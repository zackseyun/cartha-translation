  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: id
  text: Dengan tangannya sendiri ia harus membawa persembahan yang dibakar bagi TUHAN. Ia harus membawa lemak yang berada di atas dada itu; ia harus membawa dada itu untuk mengayunkannya sebagai persembahan unjukan di hadapan TUHAN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: Tangannya sendiri
  rationale: Bentuk dengan sufiks orang ketiga menegaskan bahwa orang yang mempersembahkan harus membawanya secara pribadi.
- source_word: אִשֵּׁי יְהוָה
  choice: persembahan yang dibakar bagi TUHAN
  rationale: אִשֶּׁה menunjuk pada persembahan yang dibakar, bukan secara umum pada makanan; 'bagi TUHAN' menyampaikan relasi genitif secara alami.
- source_word: הַחֵלֶב עַל הֶחָזֶה
  choice: lemak bersama dada itu
  rationale: Dalam konteks ritual, עַל dapat menyatakan penyertaan; pilihan ini menghindari kesan spasial yang terlalu kaku bahwa lemak harus berada tepat di atas dada.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: untuk mengayunkan ... sebagai persembahan unjukan
  rationale: Mempertahankan permainan akar נוף dan istilah ritual bagi tindakan serta jenis persembahannya.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan TUHAN
  rationale: Padanan formal dan alami untuk ungkapan lokasi ritual tersebut.
theological_decisions:
- issue: Identitas pembawa persembahan
  choice: Ia
  alternative: orang itu / orang yang mempersembahkan kurban keselamatan
  rationale: Ayat ini memakai sufiks orang ketiga tanpa menyebut ulang pelakunya; pronomina mempertahankan kesinambungan dengan konteks tanpa menambahkan identifikasi ke dalam ayat.
- issue: Makna אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan makanan
  rationale: Istilah itu berkaitan dengan persembahan melalui api; menerjemahkannya sebagai 'makanan' dapat mengaburkan unsur ritual pembakaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual 'persembahan unjukan' dipertahankan karena sudah lazim dalam bahasa Alkitab Indonesia dan menjelaskan kategori persembahan; susunan kalimat dibuat jelas tanpa menghilangkan pengulangan teks Ibrani.
