review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan untuk menerjemahkan עַל secara lebih tepat. Teks Ibrani menyatakan bahwa lemak itu berada «di atas dada», bukan sekadar dibawa «bersama» dada. Teks juga mengulangi penyebutan dada dalam klausa berikutnya; terjemahan revisi mempertahankan kedua tindakan tanpa menambah penafsiran ritual.
  naturalness: Bahasa revisi tetap baku dan jelas. Frasa «Dengan tangannya sendiri» menyampaikan penegasan bahwa pembawa harus melakukannya secara pribadi, sambil menghindari bentuk tunggal «Tangannya» yang kurang tepat untuk יָדָיו.
  terminology: «Persembahan yang dibakar», «lemak», «dada», dan «persembahan unjukan» merupakan padanan yang layak dan konsisten bagi istilah ritual dalam ayat ini. Nama ilahi «TUHAN» dipertahankan sesuai draf dan audit bahasa Inggris.
  issues:
  - severity: medium
    issue: עַל הֶחָזֶה diterjemahkan «bersama dada itu».
    rationale: Preposisi עַל secara langsung berarti «di atas/pada», dan dalam susunan ritual ini menerangkan lemak yang ditempatkan di atas dada. «Bersama» menghilangkan hubungan spasial yang dinyatakan sumber.
  - severity: low
    issue: «Tangannya sendiri» memakai bentuk tunggal untuk יָדָיו.
    rationale: Nomina Ibrani tersebut bermakna «tangan-tangannya/kedua tangannya». Dalam bahasa Indonesia, «Dengan tangannya sendiri» lebih alami sekaligus menyampaikan tindakan pribadi dengan kedua tangan.
  revised_text: Dengan tangannya sendiri ia harus membawa persembahan yang dibakar bagi TUHAN. Ia harus membawa lemak yang berada di atas dada itu; ia harus membawa dada itu untuk mengayunkannya sebagai persembahan unjukan di hadapan TUHAN.
