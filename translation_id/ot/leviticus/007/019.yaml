  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: id
  text: Tetapi daging yang menyentuh apa pun yang najis[a] tidak boleh dimakan; daging itu harus dibakar dalam api. Adapun daging itu, setiap orang yang tahir boleh memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersentuhan dengan sesuatu yang najis.” Ungkapan Ibrani ini luas dan menunjuk pada kenajisan ritual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Tetapi daging
  rationale: בָּשָׂר dalam konteks korban berarti daging yang dimakan, bukan 'tubuh' atau 'kedagingan'. Kata penghubung diterjemahkan 'Tetapi' untuk menandai pertentangan dengan daging yang boleh dimakan.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: yang menyentuh apa pun yang najis
  rationale: יִגַּע menyatakan persentuhan, sedangkan כָּל טָמֵא mencakup segala sesuatu yang berstatus najis secara ritual tanpa mempersempit acuannya.
- source_word: לֹא יֵאָכֵל
  choice: tidak boleh dimakan
  rationale: Bentuk pasif dengan negasi menyampaikan larangan; ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan daya hukum teks.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: daging itu harus dibakar dalam api
  rationale: Terjemahan ini mempertahankan tindakan pasif yang diwajibkan dan gambaran konkret api. Pengulangan 'daging itu' memperjelas subjek dalam bahasa Indonesia.
- source_word: וְהַבָּשָׂר
  choice: Mengenai daging lainnya
  rationale: Pengulangan nomina mengalihkan topik dari daging yang terkena kenajisan kepada daging korban yang tidak demikian. 'Lainnya' membuat kontras yang tersirat menjadi jelas tanpa mengubah ketentuan.
- source_word: כָּל טָהוֹר
  choice: setiap orang yang tahir
  rationale: Adjektiva ini dipakai secara substantival bagi orang yang berstatus tahir secara ritual. 'Setiap orang' mempertahankan cakupan universal.
- source_word: יֹאכַל בָּשָׂר
  choice: boleh memakannya
  rationale: Bentuk ini dalam konteks hukum memberi izin, bukan perintah. Pronomina '-nya' secara alami merujuk kembali kepada daging korban yang sedang dibicarakan.
theological_decisions:
- issue: Makna טָמֵא dan טָהוֹר dalam hukum korban
  choice: najis dan tahir sebagai status ritual
  alternative: cemar dan murni sebagai penilaian moral
  rationale: Dalam peraturan korban Imamat, istilah-istilah tersebut terutama menunjukkan status ritual. Terjemahan tidak menyamakannya dengan keberdosaan atau kemurnian etis.
- issue: Daya modal יֹאכַל
  choice: boleh memakannya
  alternative: harus memakannya
  rationale: Konteks mengizinkan orang yang tahir memakan daging tersebut, bukan memerintahkan setiap orang tahir untuk makan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tahir' dipertahankan sebagai istilah ritual yang lazim dalam konteks Imamat, berpasangan dengan 'najis'. Struktur kalimat dibuat jelas bagi pembaca umum tanpa menghapus kontras hukum dalam teks.
