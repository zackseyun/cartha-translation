  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: id
  text: Dari setiap persembahan itu, ia harus mempersembahkan satu sebagai persembahan khusus kepada TUHAN[a]. Bagian itu menjadi milik imam yang memercikkan[b] darah persembahan kesejahteraan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebagai persembahan unjukan kepada TUHAN.” Istilah Ibraninya menunjuk pada bagian yang dipisahkan bagi Allah dan diberikan kepada imam.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyiramkan” atau “melemparkan” darah. Kata Ibraninya menggambarkan tindakan mengenakan darah kurban pada mazbah.'
    reason: lexical_alternative
  - marker: c
    text: “Persembahan kesejahteraan” juga dapat diterjemahkan “persembahan persekutuan” atau “persembahan keselamatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ia harus mempersembahkan
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau mempersembahkan dalam konteks kurban. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa ritual.
- source_word: מִמֶּנּוּ אֶחָד מִכָּל קָרְבָּן
  choice: Dari setiap jenis persembahan itu ... satu
  rationale: 'Susunan ini menyampaikan daya distributif: satu dari setiap jenis roti/persembahan yang disebut sebelumnya. Kata ''jenis'' ditambahkan secara kontekstual agar maksudnya jelas tanpa mengubah jumlah.'
- source_word: תְּרוּמָה
  choice: persembahan khusus
  rationale: Istilah ini menunjuk pada bagian yang dipisahkan bagi TUHAN dan kemudian diberikan kepada imam. 'Persembahan khusus' lebih mudah dipahami daripada istilah teknis 'persembahan unjukan', sementara alternatif tradisional dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Nama ilahi יהוה diterjemahkan dengan bentuk baku Indonesia 'TUHAN', sesuai kebiasaan Alkitab Indonesia; preposisi ל diekspresikan sebagai 'kepada' dalam konteks penyerahan.
- source_word: הַזֹּרֵק
  choice: yang memercikkan
  rationale: Dalam ritus kurban, זרק menggambarkan tindakan mengenakan darah pada mazbah dengan melemparkan, menyiramkan, atau memercikkannya. 'Memercikkan' alami dan dikenal dalam bahasa Indonesia Alkitab, tetapi kemungkinan 'menyiramkan' dipertahankan dalam catatan.
- source_word: דַּם הַשְּׁלָמִים
  choice: darah persembahan keselamatan
  rationale: שְׁלָמִים adalah kategori kurban yang berkaitan dengan keutuhan, kesejahteraan, dan persekutuan. 'Persembahan keselamatan' mempertahankan istilah sakrificial yang lazim tanpa membatasi maknanya hanya pada persekutuan.
- source_word: לוֹ יִהְיֶה
  choice: Bagian itu menjadi milik
  rationale: Idiom Ibrani ini menyatakan hak milik atau jatah. Penyebutan 'bagian itu' memperjelas rujukan kepada satu bagian yang dipersembahkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: Bentuk 'TUHAN' merupakan padanan baku dan hormat dalam tradisi Alkitab bahasa Indonesia. Nama personalnya tidak dihapus dari pertimbangan tekstual, tetapi tidak perlu dimasukkan ke teks utama ayat ini.
- issue: Makna שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan / persembahan kesejahteraan
  rationale: Istilah Ibrani memiliki rentang makna yang mencakup damai, kesejahteraan, keutuhan, dan persekutuan. Pilihan utama menjaga kategori kurban yang dikenal, sedangkan catatan kaki mempertahankan keluasan semantiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibagi menjadi dua agar hubungan antara bagian yang dikhususkan dan hak imam jelas. Semua istilah teknis yang memiliki rentang makna penting dijelaskan melalui catatan kaki.
