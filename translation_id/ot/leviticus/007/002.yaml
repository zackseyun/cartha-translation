  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: id
  text: Di tempat orang menyembelih kurban bakaran, mereka harus menyembelih kurban penebus salah[a]. Lalu ia harus memercikkan darahnya pada mezbah, di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban ganti rugi” atau “kurban reparasi.” Istilah Ibrani ini mencakup kesalahan dan kewajiban untuk memberikan ganti rugi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Di tempat
  rationale: Mengungkapkan lokasi prosedural yang ditandai oleh preposisi בְּ dan klausa relatif אֲשֶׁר secara alami dalam bahasa Indonesia.
- source_word: יִשְׁחֲטוּ
  choice: orang menyembelih / mereka harus menyembelih
  rationale: שׁחט dalam konteks kurban menunjuk pada penyembelihan ritual. Subjek jamak tak tentu pada klausa pertama diterjemahkan 'orang', lalu 'mereka' mempertahankan bentuk jamak pada klausa utama.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Istilah Indonesia yang mapan dan mudah dipahami untuk עֹלָה, yaitu kurban yang dibakar seluruhnya.
- source_word: הָאָשָׁם
  choice: kurban penebus salah
  rationale: Menjaga unsur kesalahan dalam אָשָׁם sekaligus nuansa pemulihan atau ganti rugi yang terkait dengan kurban ini; alternatif dicatat dalam catatan kaki.
- source_word: דָּמוֹ
  choice: darahnya
  rationale: Sufiks maskulin tunggal merujuk pada hewan kurban penebus salah; bentuk posesif Indonesia ini alami dan ringkas.
- source_word: יִזְרֹק
  choice: harus memercikkan
  rationale: Dalam tata cara kurban, זרק menunjuk pada tindakan imam mengaplikasikan darah dengan melontarkan atau memercikkannya ke mezbah, bukan sekadar meneteskan.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pada mezbah di sekelilingnya
  rationale: Menyatakan bahwa darah diaplikasikan pada sisi-sisi mezbah mengelilinginya; ungkapan ini alami tanpa menyiratkan bahwa darah hanya ditaruh di atas permukaan mezbah.
theological_decisions:
- issue: Makna istilah kurban אָשָׁם
  choice: kurban penebus salah
  alternative: kurban penghapus salah; kurban ganti rugi
  rationale: Terjemahan utama mempertahankan kaitan dengan kesalahan sekaligus fungsi reparatifnya tanpa membatasi istilah ini hanya pada rasa bersalah batin atau hanya pada pembayaran ganti rugi.
- issue: Subjek tunggal יִזְרֹק setelah verba-verba jamak
  choice: Lalu imam harus memercikkan
  alternative: lalu ia harus memercikkan
  rationale: Bahasa Ibrani beralih dari subjek jamak pada penyembelihan ke subjek tunggal pada pengaplikasian darah. 'Imam' memperjelas pelaku yang tersirat oleh konteks ritual tanpa menghapus peralihan gramatikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban' dipakai secara konsisten untuk persembahan berupa hewan; 'mezbah' dipertahankan sebagai istilah Alkitab yang lazim. Struktur dipecah menjadi dua kalimat agar pergantian subjek dari jamak ke tunggal jelas bagi pembaca.
