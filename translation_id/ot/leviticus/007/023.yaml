source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: id
  text: 'Katakanlah kepada bani Israel[a]: Janganlah kamu memakan lemak apa pun dari sapi, domba, atau kambing.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; maksudnya, orang Israel secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Katakanlah
  rationale: Bentuk imperatif Piel kepada Musa. Dalam rumusan hukum bahasa Indonesia, “Katakanlah kepada” lebih alami daripada “Berbicaralah kepada” dan tetap menyampaikan perintah langsung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi menunjuk secara kolektif kepada umat Israel. “Bani Israel” mempertahankan bentuk kekerabatan sumber sekaligus merupakan ungkapan baku dan ringkas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: diwakili oleh tanda titik dua
  rationale: Infinitif pengantar ujaran ini secara harfiah berarti “dengan berkata.” Dalam bahasa Indonesia modern, titik dua setelah “Katakanlah kepada...” menyampaikan fungsi yang sama tanpa susunan yang kaku.
- source_word: כָּל
  choice: apa pun
  rationale: Dalam larangan dengan nomina massa, “lemak apa pun” menyatakan cakupan menyeluruh secara alami.
- source_word: חֵלֶב
  choice: lemak
  rationale: Menunjuk pada lemak hewan, khususnya bagian-bagian lemak dalam konteks kurban. “Lemak” adalah padanan modern yang jelas tanpa mempersempitnya menjadi jenis lemak tertentu.
- source_word: שׁוֹר
  choice: sapi
  rationale: Istilah ini menunjuk pada hewan jenis lembu/sapi tanpa mengharuskan penentuan jenis kelamin dalam konteks daftar hukum ini. “Sapi” adalah istilah generik yang paling mudah dipahami dalam bahasa Indonesia modern.
- source_word: כֶשֶׂב
  choice: domba
  rationale: Menunjuk secara umum pada hewan domba; tidak perlu dipersempit menjadi anak domba atau domba jantan.
- source_word: עֵז
  choice: kambing
  rationale: Berfungsi sebagai istilah umum bagi kambing dalam daftar ternak ini; terjemahan tidak perlu menentukan jenis kelamin.
- source_word: לֹא תֹאכֵלוּ
  choice: Janganlah kamu memakan
  rationale: Bentuk jamak orang kedua menyampaikan larangan kepada umat. “Janganlah” cocok dengan gaya hukum yang bermartabat, sedangkan “kamu” mempertahankan bahwa sapaan sumber berbentuk jamak tanpa menambah kata “sekalian” yang tidak diperlukan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan ujaran Ibrani dialihkan secara alami dengan titik dua. Istilah “bani Israel” mempertahankan citra kekerabatan dalam teks sumber, sementara catatan kaki menjelaskan arti harfiahnya dan cakupan kolektifnya.
