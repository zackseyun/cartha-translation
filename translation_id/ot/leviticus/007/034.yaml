id: LEV.7.34
reference: Leviticus 7:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: id
  text: Sebab dada persembahan unjukan dan paha persembahan khusus[a] telah Kuambil dari orang Israel, dari kurban keselamatan mereka,[b] lalu Kuberikan kepada Harun, imam itu, dan kepada anak-anaknya sebagai ketetapan tetap dari pihak orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan yang diangkat.” Istilah Ibrani menunjuk bagian yang dikhususkan dan diangkat sebagai persembahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan persekutuan mereka.” Istilah Ibrani menunjuk suatu kategori kurban yang berkaitan dengan damai, keutuhan, dan kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: dada persembahan unjukan
  rationale: חֲזֵה menunjuk bagian dada hewan, sedangkan תְּנוּפָה adalah istilah ritual untuk bagian yang diunjukkan. Susunan ini mempertahankan pembedaan istilah kurban secara wajar dalam bahasa Indonesia.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: paha persembahan khusus
  rationale: שׁוֹק menunjuk bagian paha atau tungkai atas. תְּרוּמָה adalah bagian yang dikhususkan atau dipisahkan sebagai persembahan; 'persembahan khusus' lebih mudah dipahami daripada istilah teknis yang menyiratkan gerakan ritual tertentu.
- source_word: לָקַחְתִּי
  choice: telah Kuambil
  rationale: Bentuk perfektif menyatakan tindakan ilahi yang telah menetapkan bagian-bagian tersebut bagi imam; bentuk 'telah Kuambil' juga cocok dengan alasan yang diawali כִּי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ini adalah sebutan kolektif baku bagi umat Israel. 'Orang Israel' alami dalam bahasa Indonesia dan tidak menyempitkan cakupannya hanya kepada laki-laki biologis.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: kurban persembahan pendamaian mereka
  rationale: Terjemahan ini menampilkan baik unsur זֶבַח, 'kurban sembelihan', maupun kategori שְׁלָמִים. 'Persembahan pendamaian' mempertahankan kaitan dengan damai atau keutuhan tanpa membatasi maknanya pada persekutuan.
- source_word: וָאֶתֵּן אֹתָם
  choice: lalu Kuberikan
  rationale: Waw-konsekutif meneruskan urutan tindakan dari pengambilan kepada pemberian. 'Lalu' membuat hubungan naratif-logis itu jelas dan alami.
- source_word: לְחָק עוֹלָם
  choice: sebagai ketetapan tetap
  rationale: Ungkapan ini menyatakan ketentuan yang terus berlaku. 'Ketetapan tetap' dignified dan mudah dipahami, tanpa memakai 'kekal' yang dalam bahasa Indonesia dapat dibaca sebagai klaim metafisis lebih luas.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: yang harus dipenuhi orang Israel
  rationale: מֵאֵת pada penutup ayat menandai pihak asal atau pihak yang wajib menyediakan bagian tersebut. Perumusan ini menghindari pengulangan 'dari orang Israel' yang kaku sekaligus mempertahankan daya legalnya.
theological_decisions:
- issue: Sebutan perjanjian בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks hukum bagi seluruh umat, ungkapan Ibrani berfungsi sebagai etnonim kolektif. 'Orang Israel' merupakan padanan Indonesia yang alami dan tidak mengubah identitas perjanjiannya.
- issue: Makna kategori kurban שְׁלָמִים
  choice: persembahan pendamaian
  alternative: persembahan persekutuan
  rationale: Kata ini dapat berasosiasi dengan damai, kesejahteraan, keutuhan, dan persekutuan. Pilihan utama mempertahankan istilah kurban yang telah mapan, sedangkan catatan kaki mengakui alternatif tanpa menuntaskan rentang maknanya secara sepihak.
- issue: Daya waktu חָק עוֹלָם
  choice: ketetapan tetap
  alternative: ketetapan untuk selama-lamanya
  rationale: עוֹלָם dalam rumusan hukum menyatakan keberlakuan yang berkesinambungan atau tidak berbatas dalam cakrawala ketetapan tersebut. 'Tetap' menjaga daya hukumnya tanpa memaksakan penyelesaian teologis tentang penerapannya pada zaman-zaman berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ibadah yang khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Istilah teknis dipertahankan bila dapat dipahami, dan dua istilah kurban yang berpotensi ambigu dijelaskan melalui catatan kaki.
