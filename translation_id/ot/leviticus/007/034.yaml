revisions:
- from: Sebab dada persembahan unjukan dan paha persembahan khusus[a] telah Kuambil dari orang Israel, dari kurban persembahan pendamaian mereka,[b] lalu Kuberikan kepada Imam Harun dan anak-anaknya sebagai ketetapan tetap yang harus dipenuhi orang Israel.
  to: Sebab dada persembahan unjukan dan paha persembahan khusus[a] telah Kuambil dari orang Israel, dari kurban keselamatan mereka,[b] lalu Kuberikan kepada Harun, imam itu, dan kepada anak-anaknya sebagai ketetapan tetap dari pihak orang Israel.
  rationale: Revisi memulihkan fungsi מֵאֵת pada akhir ayat sebagai penanda pihak asal (“dari pihak orang Israel”), tanpa menambahkan kewajiban eksplisit. “Kurban keselamatan” menggantikan “kurban persembahan pendamaian” agar kategori שְׁלָמִים tidak dibaca sebagai kurban pendamaian dalam arti penebusan. Catatan kaki tetap mempertahankan alternatif yang relevan dan jangkar catatan ditempatkan pada istilah yang dijelaskannya.
