  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: id
  text: juga kedua ginjal, lemak yang ada pada kedua ginjal itu, yang berada di bagian pinggang, serta bagian yang menonjol[a] pada hati; bagian itu harus dipisahkannya bersama kedua ginjal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “cuping hati”; istilah anatomi dalam bahasa Ibrani ini bersifat teknis, dan bagian tubuh yang dimaksud secara tepat masih diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Istilah ini jelas menunjuk pada sepasang ginjal dalam uraian anatomi kurban; bentuk ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: הַחֵלֶב
  choice: lemak
  rationale: Dalam konteks kurban Imamat, kata ini menunjuk pada bagian-bagian berlemak yang dikhususkan untuk persembahan; 'lemak' merupakan padanan modern yang paling jelas.
- source_word: אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: yang ada padanya di bagian pinggang
  rationale: Terjemahan ini mempertahankan hubungan lemak dengan ginjal dan lokasinya pada kawasan pinggang, tanpa memperinci anatomi melebihi teks Ibrani.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: bagian yang menonjol pada hati
  rationale: יוֹתֶרֶת adalah istilah anatomi teknis yang rujukan tepatnya diperdebatkan. Ungkapan deskriptif ini mempertahankan sifat konkret istilah tersebut tanpa memastikan bahwa yang dimaksud adalah cuping tertentu.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: yang harus dipisahkannya bersama kedua ginjal itu
  rationale: Dalam rumusan tata cara kurban ini, frasa tersebut paling wajar dipahami sebagai tindakan memisahkan bagian hati itu bersama ginjal. Bentuk '-nya' mempertahankan pelaku tunggal yang tersirat dalam verba Ibrani.
