  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: id
  text: Dan imam yang mempersembahkan kurban bakaran seorang laki-laki[b] akan mendapat kulit[a] kurban bakaran yang telah dipersembahkannya itu sebagai miliknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kulit binatang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “kurban bakaran seorang laki-laki”; bentuk tunggal maskulin dalam bahasa Ibrani dipertahankan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Istilah baku dan wajar dalam bahasa Indonesia untuk כֹּהֵן dalam peraturan persembahan; bentuk definitif dipahami dari konteks dan klausa penjelas.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: yang mempersembahkan / yang telah dipersembahkannya
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa atau menyajikan sebagai persembahan. 'Mempersembahkan' merupakan istilah Indonesia yang alami dan mempertahankan nuansa ritual; 'telah' menandai tindakan yang sudah dilakukan.
- source_word: עֹלַת אִישׁ
  choice: kurban bakaran seorang laki-laki
  rationale: עֹלָה menunjuk pada kurban yang dibakar seluruhnya, sedangkan אִישׁ berbentuk tunggal maskulin. Ungkapan ini mempertahankan unsur laki-laki dalam teks sumber tanpa menggeneralisasikannya menjadi 'seseorang'.
- source_word: עֹור
  choice: kulit
  rationale: Kata ini menunjuk pada kulit binatang kurban. 'Kulit' adalah padanan modern yang paling umum; 'belulang' dapat memberi kesan kulit yang sudah dikeringkan atau disamak.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Padanan yang jelas dan lazim untuk kategori persembahan עֹלָה dalam hukum kurban; lebih mudah dipahami daripada terjemahan etimologis seperti 'kurban kenaikan'.
- source_word: אֲשֶׁר הִקְרִיב
  choice: yang telah dipersembahkannya itu
  rationale: Klausa relatif ini menerangkan kurban bakaran tertentu yang dipersembahkan oleh imam tersebut. Akhiran '-nya' secara alami mempertahankan pelaku yang sama.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: akan mendapat ... sebagai miliknya
  rationale: Secara harfiah, kulit itu 'akan menjadi bagi imam, baginya'. Susunan Indonesia ini menyatakan dengan jelas bahwa kulit tersebut menjadi bagian milik imam yang bertugas, tanpa mengubah acuannya.
theological_decisions:
- issue: Penerjemahan gender אִישׁ
  choice: seorang laki-laki
  alternative: seseorang / seorang
  rationale: Teks Ibrani memakai nomina tunggal maskulin אִישׁ. Terjemahan mempertahankan rincian itu, sementara catatan kaki menjelaskan bentuk sumber agar pembaca tidak menganggapnya sebagai penambahan penafsir.
- issue: Istilah ibadah untuk עֹלָה
  choice: kurban bakaran
  alternative: kurban kenaikan
  rationale: Walaupun עֹלָה berkaitan secara etimologis dengan sesuatu yang naik, dalam konteks Imamat kata itu merupakan nama kategori kurban yang dibakar. 'Kurban bakaran' jelas, mapan, dan tidak memaksakan tafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami dengan menempatkan hak imam sebagai predikat utama. Istilah 'kurban bakaran' dipakai secara konsisten sebagai istilah ritual. Semua penanda catatan kaki muncul langsung sesudah unsur yang dijelaskan.
