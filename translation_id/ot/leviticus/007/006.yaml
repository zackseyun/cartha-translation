  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: id
  text: Setiap laki-laki di antara para imam boleh memakannya[a]. Itu harus dimakan di tempat yang kudus. Itu mahakudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap laki-laki dari kalangan imam harus memakannya.” Bentuk Ibrani dapat diterjemahkan lebih formal, tetapi dalam konteks ini menyatakan bahwa setiap laki-laki dari kalangan imam diizinkan memakannya.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “kudus dari yang kudus,” suatu idiom yang berarti “mahakudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: Setiap laki-laki di antara para imam
  rationale: כָּל dipahami secara distributif, זָכָר menyatakan jenis kelamin, bukan usia dewasa, dan בַּכֹּהֲנִים menunjukkan keanggotaan dalam kelompok para imam.
- source_word: יֹאכְלֶנּוּ
  choice: boleh memakannya
  rationale: Bentuk imperfek dalam ketentuan kurban ini menyatakan hak atau izin yang diberikan kepada setiap laki-laki dari kalangan imam, bukan semata-mata tindakan pada masa depan.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: di tempat yang kudus
  rationale: Frasa sumber tidak memakai artikel tertentu pada מָקוֹם; bentuk Indonesia ini menyatakan tempat berciri kudus tanpa mempersempitnya menjadi satu lokasi tertentu.
- source_word: יֵאָכֵל
  choice: harus dimakan
  rationale: Bentuk Nifal pasif menyampaikan ketentuan tentang lokasi makan; 'harus' mengungkapkan daya wajib instruksi hukum secara alami dalam bahasa Indonesia.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: maha kudus
  rationale: Ungkapan intensif harfiah 'kudus dari segala yang kudus' menunjukkan derajat kekudusan tertinggi; 'maha kudus' merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: הוּא
  choice: Kurban itu
  rationale: Pronomina maskulin tunggal merujuk kembali pada kurban atau bagian kurban yang sedang dibicarakan. Pengulangan nomina membuat rujukannya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pembatasan hak makan kepada laki-laki dalam lingkungan imam
  choice: Setiap laki-laki di antara para imam boleh memakannya
  alternative: Setiap imam boleh memakannya
  rationale: Teks Ibrani secara eksplisit memuat זָכָר, 'laki-laki'. Terjemahan mempertahankan pembatasan kultis tersebut tanpa menggeneralisasikannya kepada semua imam.
- issue: Nuansa izin dan kewajiban dalam dua bentuk verba makan
  choice: '''boleh memakannya'' untuk יֹאכְלֶנּוּ dan ''harus dimakan'' untuk יֵאָכֵל'
  alternative: '''akan memakannya'' dan ''akan dimakan'''
  rationale: Dalam konteks hukum kurban, klausa pertama menyatakan siapa yang berhak makan, sedangkan klausa kedua menetapkan lokasi yang diwajibkan. Perbedaan ini dipertahankan tanpa menjadikannya pernyataan masa depan biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para imam' menjaga rujukan kultis dengan jelas; 'laki-laki' lebih tepat daripada 'pria' atau 'orang' karena sumber menyatakan jenis kelamin. Nomina 'kurban' ditambahkan pada dua klausa terakhir untuk memperjelas rujukan pronominal tanpa mengubah isi.
