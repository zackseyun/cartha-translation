base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: id
  text: Namun, sisa daging kurban itu pada hari ketiga harus dibakar dalam api.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Namun, sisa
  rationale: Konjungsi dengan partisip pasif substantival melanjutkan ketentuan sebelumnya dengan nuansa kontras, sedangkan “sisa” secara alami menyatakan bagian yang masih tertinggal.
- source_word: מִבְּשַׂר
  choice: daging
  rationale: בָּשָׂר secara harfiah dapat berarti “daging/tubuh,” tetapi dalam konteks makanan kurban, “daging” paling jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַזָּבַח
  choice: kurban itu
  rationale: זֶבַח menunjuk pada kurban atau hewan yang disembelih sebagai kurban; “kurban” mempertahankan konteks ritual secara ringkas dan alami.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Ini adalah padanan langsung dan idiomatis bagi keterangan waktu Ibrani tersebut.
- source_word: בָּאֵשׁ
  choice: dalam api
  rationale: Padanan ini mempertahankan preposisi ב dan gambaran konkret mengenai pemusnahan dengan pembakaran.
- source_word: יִשָּׂרֵף
  choice: harus dibakar
  rationale: Bentuk Nifal imperfek berfungsi sebagai ketentuan hukum; “harus dibakar” mempertahankan bentuk pasif sekaligus menyatakan daya wajibnya dengan jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan bentuk pasif serta nada ketentuan hukum dari teks Ibrani.
