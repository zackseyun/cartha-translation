  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: id
  text: yang Yahweh perintahkan kepada Musa di Gunung Sinai, pada hari ketika Ia memerintahkan orang Israel[a] untuk membawa persembahan mereka kepada Yahweh di padang gurun Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; ini merupakan ungkapan Ibrani untuk orang Israel. Dapat juga diterjemahkan “umat Israel.”
    reason: Menjelaskan bentuk harfiah בני ישראל sambil menunjukkan fungsi idiomatisnya sebagai sebutan kolektif.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Memperkenalkan klausa relatif yang merujuk kembali pada rangkaian ketetapan dalam ayat sebelumnya.
- source_word: צִוָּה
  choice: diperintahkan / memerintahkan
  rationale: Mempertahankan daya perintah yang berwenang dari צוה; bentuk pasif pada klausa pertama menghasilkan susunan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan tidak menggantinya dengan gelar.
- source_word: בְּהַר סִינָי
  choice: di Gunung Sinai
  rationale: Preposisi ב dapat menunjuk lokasi; 'di Gunung Sinai' alami dalam bahasa Indonesia dan tidak memaksakan pembedaan antara 'di' dan 'di atas' yang tidak perlu.
- source_word: בְּיוֹם
  choice: pada hari ketika
  rationale: Mempertahankan unsur eksplisit 'hari' sekaligus mengungkapkan hubungan waktunya secara alami.
- source_word: צַוֹּתוֹ
  choice: Ia memerintahkan
  rationale: Infinitif konstruk dengan sufiks pronominal diungkapkan sebagai klausa finite agar jelas dalam bahasa Indonesia; 'Ia' merujuk kepada Yahweh.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Mempertahankan nuansa hubungan asal-usul dalam ungkapan Ibrani tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak yang belum dewasa.
- source_word: לְהַקְרִיב
  choice: untuk membawa
  rationale: Dalam konteks persembahan, bentuk Hifil dari קרב menyatakan membawa atau menghadapkan persembahan. 'Membawa' alami dan menghindari pengulangan 'mempersembahkan persembahan'.
- source_word: קָרְבְּנֵיהֶם
  choice: persembahan mereka
  rationale: קרבן merupakan istilah luas bagi sesuatu yang dibawa sebagai persembahan dan di sini merangkum beberapa jenis kurban.
- source_word: בְּמִדְבַּר סִינָי
  choice: di Padang Gurun Sinai
  rationale: Mengungkapkan wilayah tandus מִדְבָּר sebagai nama geografis yang jelas dan lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi 'Yahweh' mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel; umat Israel
  rationale: '''Keturunan Israel'' mempertahankan unsur kekeluargaan ungkapan sumber dan tetap dapat dipahami sebagai sebutan kolektif bagi bangsa Israel; catatan kaki menyajikan bentuk harfiahnya dan padanan idiomatis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur klausa relatif dipertahankan karena ayat ini melanjutkan kalimat serta rangkuman ketetapan pada ayat sebelumnya. Kapitalisasi 'Ia' dipakai untuk memperjelas bahwa subjeknya Yahweh.
