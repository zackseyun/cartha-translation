  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: id
  text: Setiap orang yang memakan darah apa pun—orang itu akan dilenyapkan dari tengah-tengah bangsanya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa.” Kata Ibrani nefesh di sini menunjuk kepada seorang individu.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “akan dilenyapkan” merupakan rumusan baku untuk sanksi perjanjian. Ungkapan ini dapat menyiratkan penyingkiran dari komunitas atau penghukuman ilahi; teks Ibrani di sini tidak menyebutkan cara persisnya.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: orang
  rationale: Dalam konteks hukum, נֶפֶשׁ menunjuk kepada seorang individu, bukan secara khusus kepada jiwa yang tidak berwujud. “Orang” alami dan jelas dalam bahasa Indonesia.
- source_word: תֹּאכַל
  choice: memakan
  rationale: Bentuk imperfek dalam klausa relatif ini menyatakan kasus umum. “Yang memakan” menyampaikan daya hukum umum tersebut secara wajar.
- source_word: כָּל דָּם
  choice: darah apa pun
  rationale: כָּל dengan nomina tak terhitung di sini bersifat distributif, yakni darah dalam bentuk atau jenis apa pun, bukan seluruh darah sebagai suatu jumlah total.
- source_word: וְנִכְרְתָה
  choice: harus dilenyapkan
  rationale: Bentuk Niphal dari כרת merupakan rumusan sanksi perjanjian. “Dilenyapkan” mempertahankan gambaran pemutusan dan tidak menentukan apakah caranya berupa pengucilan, kematian, atau penghukuman ilahi.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: orang itu
  rationale: Pengulangan nomina dengan kata tunjuk menegaskan dan merujuk kembali kepada pelanggar yang disebut pada klausa pertama.
- source_word: מֵעַמֶּיהָ
  choice: dari tengah-tengah bangsanya
  rationale: Akhiran feminin mengikuti jenis gramatikal נֶפֶשׁ dan tidak membatasi hukum ini pada perempuan. Bentuk “-nya” bersifat netral gender, sedangkan “dari tengah-tengah” secara alami menyatakan penyingkiran dari komunitas umatnya.
theological_decisions:
- issue: Makna sanksi perjanjian dengan verba כרת
  choice: Memakai “harus dilenyapkan” tanpa menentukan cara pelaksanaannya.
  alternative: “harus dihukum mati,” “harus dikucilkan dari umat,” atau “akan dibinasakan Allah.”
  rationale: Rumusan Ibrani ringkas dan tidak menyebutkan cara sanksi itu terjadi. Terjemahan mempertahankan ketegangan antara kemungkinan penyingkiran dari komunitas dan penghukuman ilahi, tanpa memutuskan tafsiran yang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang ringkas dan bermartabat. Tanda pisah mempertahankan penegasan pada pengulangan “orang itu”; “bangsanya” dipakai untuk עַם dalam arti komunitas umat perjanjian.
