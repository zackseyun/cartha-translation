source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: id
  text: Namun, jika sebagian dari daging kurban persekutuannya dimakan pada hari ketiga, kurban itu tidak akan diterima dan tidak akan diperhitungkan bagi orang yang mempersembahkannya. Kurban itu akan menjadi sesuatu yang menjijikkan[a], dan orang yang memakannya akan menanggung kesalahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini adalah istilah khusus dalam hukum kurban untuk sesuatu yang telah menjadi tidak layak diterima dan menjijikkan; dapat juga diterjemahkan “daging yang tercemar” atau “sesuatu yang memuakkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menyatakan syarat yang berlawanan dengan ketentuan sebelumnya; bentuk ini wajar dan tetap mencerminkan unsur penghubung.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: dimakan
  rationale: Konstruksi infinitif absolut dengan imperfek memberi penegasan. Dalam bahasa Indonesia, bentuk pasif sederhana sudah alami, sementara ketegasannya terbaca dari konteks larangan.
- source_word: מִבְּשַׂר
  choice: sebagian dari daging
  rationale: Mencerminkan fungsi partitif מִן dan memakai istilah yang lazim dalam konteks makanan kurban.
- source_word: זֶבַח שְׁלָמָיו
  choice: kurban persekutuannya
  rationale: Menunjuk kategori kurban tertentu; 'kurban persekutuan' mudah dipahami dan menonjolkan dimensi persekutuan tanpa meniadakan nuansa kesejahteraan atau kedamaian.
- source_word: לֹא יֵרָצֶה
  choice: kurban itu tidak akan diterima
  rationale: Dalam konteks persembahan, bentuk Nifal dari רצה menyatakan bahwa kurban tidak berkenan atau tidak diterima. Subjek 'kurban itu' diperjelas agar rujukannya alami dalam bahasa Indonesia.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: tidak akan diperhitungkan bagi orang yang mempersembahkannya
  rationale: Mempertahankan nuansa perhitungan atau pengakuan manfaat kurban bagi si pembawa persembahan.
- source_word: פִּגּוּל
  choice: sesuatu yang menjijikkan
  rationale: Istilah teknis kurban ini menyatakan sesuatu yang telah menjadi tidak layak diterima dan memuakkan; catatan kaki mempertahankan kekhususan maknanya.
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: dan orang yang memakannya
  rationale: נפש dalam rumusan hukum ini berarti orang atau pribadi, bukan jiwa yang dibedakan dari tubuh. Objek '-nya' secara alami merujuk pada kurban atau daging tersebut.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: harus menanggung kesalahannya
  rationale: Mempertahankan idiom Ibrani tentang menanggung kesalahan, yang juga menyiratkan tanggung jawab atas akibat atau hukuman tanpa menguraikannya secara berlebihan.
theological_decisions:
- issue: Makna זֶבַח שְׁלָמָיו
  choice: kurban persekutuannya
  alternative: kurban keselamatannya; kurban kesejahteraannya; kurban pendamaiannya
  rationale: שלמים dapat berkaitan dengan keutuhan, kesejahteraan, kedamaian, dan persekutuan. 'Kurban persekutuan' merupakan istilah Indonesia yang jelas bagi kategori ritual ini, tetapi tidak dimaksudkan untuk menutup nuansa semantis lainnya.
- issue: Cakupan idiom עֲוֺנָהּ תִּשָּׂא
  choice: harus menanggung kesalahannya
  alternative: akan menanggung hukumannya karena kesalahan itu
  rationale: Teks menyebut tindakan menanggung kesalahan dan dapat menyiratkan hukuman. Terjemahan utama mempertahankan ketegangan itu tanpa mengubah implikasi hukuman menjadi pernyataan eksplisit.
- issue: Identitas pihak yang tidak menerima kurban
  choice: bentuk pasif 'tidak akan diterima'
  alternative: tidak akan diterima oleh TUHAN
  rationale: Teks Ibrani memakai bentuk pasif tanpa menyebut pelaku secara eksplisit. Terjemahan mempertahankan ketidaktersuratan tersebut dan tidak menambahkan nama ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang khidmat. Struktur dibuat jelas bagi pembaca umum tanpa menghilangkan istilah kurban, bentuk pasif teologis, atau hubungan antara kesalahan dan tanggung jawab.
