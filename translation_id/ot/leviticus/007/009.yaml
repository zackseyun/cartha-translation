  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: id
  text: Setiap persembahan sajian yang dipanggang dalam tungku, dan setiap persembahan yang diolah dalam kuali atau di atas wajan, menjadi milik imam yang mempersembahkannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks korban Imamat, istilah ini menunjuk pada persembahan berbahan hasil tanaman, bukan pemberian umum. 'Persembahan sajian' alami dalam bahasa Indonesia dan tidak membatasi bahannya hanya pada biji-bijian utuh.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: dipanggang dalam tungku
  rationale: Bentuk pasif נִפעל dipertahankan dengan 'dipanggang'; 'tungku' sesuai dengan alat pemanggang kuno dan lebih tepat daripada 'oven' sebagai serapan modern.
- source_word: נַעֲשָׂה
  choice: diolah
  rationale: Kata עשה bersifat luas, tetapi dalam konteks makanan berarti dibuat atau disiapkan. 'Diolah' tetap alami tanpa menentukan teknik memasak yang tidak dinyatakan.
- source_word: מַרְחֶשֶׁת
  choice: kuali
  rationale: Istilah ini kemungkinan menunjuk pada wadah memasak yang lebih dalam. 'Kuali' membedakannya secara wajar dari מַחֲבַת dalam bahasa Indonesia.
- source_word: מַחֲבַת
  choice: wajan
  rationale: Istilah ini kemungkinan menunjuk pada alat masak yang lebih datar. 'Wajan' mempertahankan perbedaan yang mungkin dimaksud dengan מַרְחֶשֶׁת, tanpa mengklaim bentuk teknis secara berlebihan.
- source_word: הַמַּקְרִיב
  choice: yang mempersembahkannya
  rationale: Dalam konteks ritual, bentuk Hifil dari קרב berarti membawa ke hadapan atau mempersembahkan. Pilihan ini jelas dan sesuai dengan tindakan imam.
- source_word: לוֹ תִהְיֶה
  choice: menjadi milik
  rationale: Konstruksi ini menyatakan penetapan kepemilikan. 'Menjadi milik' menyampaikan ketentuan hukum tersebut secara alami dan ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan distributif ayat dipertahankan, sementara hubungan eliptis pada unsur kedua dibuat jelas dengan pengulangan 'persembahan'. Tidak diperlukan catatan kaki karena perbedaan dua alat masak dipertahankan dalam teks sebagai 'kuali' dan 'wajan' tanpa menghapus ketidakpastian bentuk tepatnya.
