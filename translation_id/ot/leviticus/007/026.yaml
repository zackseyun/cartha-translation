  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: id
  text: Janganlah kamu makan darah apa pun di mana pun kamu tinggal, baik darah burung maupun darah hewan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bagian akhir berbunyi “untuk burung dan untuk hewan”; frasa ini menunjuk pada darah burung dan hewan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ
  choice: Janganlah kamu makan darah apa pun
  rationale: Dalam larangan, כָל paling alami dipahami secara distributif sebagai “apa pun”. Bentuk orang kedua jamak diterjemahkan dengan “kamu” yang dapat berfungsi jamak dalam bahasa Indonesia; “janganlah” mempertahankan daya hukum tanpa terdengar usang.
- source_word: בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם
  choice: di seluruh tempat tinggalmu
  rationale: מוֹשָׁב menunjuk pada tempat tinggal atau permukiman. “Di seluruh tempat tinggalmu” mempertahankan cakupan בְּכֹל dan bentuk yang dekat dengan bahasa sumber.
- source_word: לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה
  choice: baik darah burung maupun darah hewan
  rationale: Lamed menandai kategori yang memiliki atau menjadi sumber darah tersebut. Pengulangan “darah” secara tersirat dijelaskan dalam bahasa Indonesia agar hubungan sintaksisnya jelas, sedangkan pasangan “baik ... maupun ...” menyajikan kedua kategori secara alami. בְּהֵמָה diterjemahkan luas sebagai “hewan”, tanpa mempersempitnya menjadi ternak.
theological_decisions:
- issue: Cakupan larangan memakan darah
  choice: Larangan mencakup segala darah burung maupun hewan di seluruh tempat tinggal Israel.
  alternative: Frasa penutup dapat diterjemahkan secara lebih harfiah sebagai “untuk burung dan untuk hewan”.
  rationale: Sintaksis Ibrani secara wajar menyebut kategori makhluk yang darahnya dilarang untuk dimakan. Terjemahan tidak menambahkan penjelasan teologis di luar isi hukum ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan larangan dibuat langsung dan mudah dipahami, sementara catatan kaki mempertahankan bentuk harfiah frasa Ibrani yang tidak alami bila dipindahkan mentah-mentah.
