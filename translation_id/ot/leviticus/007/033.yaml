base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: id
  text: Orang dari antara anak-anak Harun yang mempersembahkan darah kurban keselamatan[a] dan lemak, dialah yang mendapat paha kanan sebagai bagiannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: orang yang mempersembahkan
  rationale: Partisipel Hifil dari קרב menyatakan orang yang membawa atau menyajikan persembahan dalam tindakan ritual. “Mempersembahkan” alami dalam konteks hukum kurban dan mempertahankan fungsi partisipelnya.
- source_word: דַּם
  choice: darah
  rationale: Padanan langsung dan baku dalam ketentuan kurban.
- source_word: הַשְּׁלָמִים
  choice: kurban keselamatan
  rationale: Istilah ini menunjuk pada kategori kurban שְׁלָמִים dan mempertahankan kaitan leksikalnya dengan keadaan utuh, sejahtera, atau damai. Alternatif yang menekankan persekutuan dicantumkan dalam catatan kaki karena lebih interpretatif.
- source_word: הַחֵלֶב
  choice: lemaknya
  rationale: Merujuk pada lemak dari kurban yang disebut sebelumnya; sufiks bahasa Indonesia memperjelas hubungan tersebut tanpa menambah makna substantif.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: Dari antara anak-anak Harun
  rationale: Menandai pemilihan satu orang dari kelompok imam laki-laki keturunan Harun serta mempertahankan ungkapan kekerabatan eksplisit dalam bahasa Ibrani.
- source_word: לוֹ תִהְיֶה
  choice: dialah yang mendapat
  rationale: Mengungkapkan hak atau peruntukan resmi secara alami dalam bahasa Indonesia, selaras dengan konteks pembagian bagian kurban.
- source_word: שׁוֹק הַיָּמִין
  choice: paha kanan
  rationale: שׁוֹק menunjuk pada bagian kaki, khususnya paha atau bagian atas kaki, dalam pembagian daging kurban; “paha kanan” cukup tepat dan lazim.
- source_word: לְמָנָה
  choice: sebagai bagiannya
  rationale: מָנָה berarti bagian atau jatah yang ditetapkan. Frasa ini menyampaikan peruntukan resmi dengan wajar.
theological_decisions:
- issue: Penerjemahan בְּנֵי אַהֲרֹן dalam hukum keimaman
  choice: anak-anak Harun
  alternative: keturunan Harun; keluarga Harun
  rationale: Teks Ibrani memakai bentuk jamak maskulin yang secara konkret merujuk kepada para imam laki-laki dari garis Harun. Ungkapan kekerabatan dipertahankan dan tidak dinetralkan.
- issue: Nuansa istilah שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban pendamaian
  rationale: Makna tepat nama kategori kurban ini tidak boleh dipersempit secara diam-diam menjadi satu penafsiran teologis. Teks utama mempertahankan kaitan dengan keselamatan, kesejahteraan, atau keutuhan, sedangkan nuansa persekutuan diberikan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan awal “Dari antara anak-anak Harun” mempertahankan penekanan kelompok asal, sedangkan “dialah” menegaskan penerima bagian kurban secara jelas dan alami.
