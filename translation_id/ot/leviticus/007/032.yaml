  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: id
  text: Kalian harus memberikan paha kanan kepada imam sebagai persembahan khusus dari kurban persekutuan kalian.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kaki kanan”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebagai persembahan”; secara tradisional, “sebagai persembahan unjukan”.'
    reason: lexical_alternative
  - marker: c
    text: “Kurban persekutuan” dapat juga diterjemahkan “kurban keselamatan” atau “kurban kesejahteraan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: paha
  rationale: Kata ini menunjuk pada bagian atas kaki hewan; “paha” lebih tepat secara anatomis dalam konteks kurban daripada “kaki” yang lebih luas maknanya.
- source_word: הַיָּמִין
  choice: kanan
  rationale: Menentukan sisi bagian hewan yang wajib diberikan dan karena itu dipertahankan secara eksplisit.
- source_word: תִּתְּנוּ
  choice: kamu harus memberikan
  rationale: Bentuk imperfek orang kedua jamak berfungsi sebagai perintah hukum. Bahasa Indonesia tidak membedakan jumlah pada “kamu”, sedangkan “harus” menyampaikan daya wajibnya dengan wajar.
- source_word: תְרוּמָה
  choice: persembahan khusus
  rationale: Menunjuk pada bagian yang dipisahkan lalu diserahkan. “Persembahan khusus” lebih jelas bagi pembaca modern daripada istilah tradisional yang menyiratkan gerakan ritual tertentu.
- source_word: לַכֹּהֵן
  choice: kepada imam
  rationale: Mempertahankan penerima dalam bentuk tunggal sebagaimana teks Ibrani.
- source_word: מִזִּבְחֵי שַׁלְמֵיכֶם
  choice: dari kurban persekutuanmu
  rationale: Preposisi מִן menyatakan sumber bagian imam itu. “Kurban persekutuan” menyampaikan dimensi relasional שְׁלָמִים dengan bahasa Indonesia yang alami, sementara alternatif maknanya dicatat dalam catatan kaki.
- source_word: וְאֵת
  choice: Dari
  rationale: Penanda objek אֵת tidak diterjemahkan tersendiri. Hubungan dengan konteks tetap terwakili oleh susunan yang menempatkan sumber bagian kurban di awal; waw penghubung tidak perlu diterjemahkan secara mekanis agar kalimat Indonesia tetap alami.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan; kurban kesejahteraan
  rationale: Istilah Ibrani mencakup nuansa damai, keutuhan, kesejahteraan, dan persekutuan tanpa harus dibatasi pada satu penafsiran teologis. Teks utama memakai istilah yang alami dan dikenal, sedangkan alternatif dicatat untuk mempertahankan keluasan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan keterangan sumber di awal. Istilah ritual dijelaskan tanpa memakai ungkapan teknis yang kabur. Setiap penanda catatan kaki muncul dalam teks utama.
