  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: id
  text: Imam harus membakar bagian-bagian itu di atas mazbah sebagai persembahan melalui api[a] bagi Yahweh; itulah korban penebus salah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan yang dibakar bagi Yahweh.” Istilah Ibraninya menunjuk pada persembahan yang dipersembahkan melalui api.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “korban ganti rugi” atau, secara tradisional, “korban pelanggaran.” Istilah Ibraninya adalah nama suatu jenis kurban yang juga dapat berkaitan dengan pemulihan kerugian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: harus membakar
  rationale: Bentuk hifil dari קטר dalam konteks kurban berarti membuat bagian kurban naik sebagai asap di atas mazbah. 'Membakar' alami dan jelas dalam bahasa Indonesia, sementara konteks mazbah menunjukkan tindakan ritualnya.
- source_word: אֹתָם
  choice: semuanya
  rationale: Pronomina objek jamak ini menunjuk kepada seluruh bagian kurban yang disebut dalam konteks sebelumnya; 'semuanya' lebih alami daripada 'mereka' untuk benda-benda tersebut.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Nomina tunggal definit; dalam konteks ketentuan ritual bahasa Indonesia, bentuk tanpa artikel sudah menyampaikan rujukan generik-definit.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran arah pada מִזְבֵּחַ secara harfiah dapat berarti 'ke mazbah', tetapi tindakan pembakaran kurban berlangsung di atas mazbah.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Istilah teknis ini menunjuk kepada persembahan yang dipersembahkan melalui api. Pilihan ini mempertahankan unsur api tanpa menambahkan gagasan 'makanan' yang tidak dinyatakan secara eksplisit oleh kata tersebut.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai penerima atau tujuan persembahan; 'bagi Yahweh' alami dalam rumusan persembahan Indonesia dan mempertahankan nama ilahi.
- source_word: אָשָׁם
  choice: persembahan penebus salah
  rationale: Dalam Imamat, אָשָׁם adalah nama kategori kurban yang berkaitan dengan kesalahan dan, dalam sejumlah kasus, pemulihan kerugian. Pilihan ini cukup transparan dan tidak menyempitkannya hanya menjadi ganti rugi.
- source_word: הוּא
  choice: itulah
  rationale: Pronomina ini mengidentifikasi kurban tersebut menurut kategorinya; 'itulah' menghasilkan klausa identifikasi yang alami dan tegas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat nama perjanjian יהוה. 'Yahweh' mempertahankannya sebagai nama diri dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Makna teknis אָשָׁם
  choice: persembahan penebus salah
  alternative: persembahan penghapus kesalahan; persembahan ganti rugi
  rationale: Istilah ini menamai kategori kurban, bukan sekadar perasaan bersalah. 'Penebus salah' mempertahankan hubungan dengan pelanggaran tanpa membatasi semua pemakaiannya pada pembayaran ganti rugi.
- issue: Makna אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan melalui api
  rationale: Etimologi dan cakupan tepat istilah ini diperdebatkan, tetapi dalam rumusan ritual ia menunjuk pada persembahan yang diproses dengan api. Terjemahan utama mempertahankan unsur itu tanpa memasukkan metafora makanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mazbah' dipertahankan sebagai istilah ritual yang ringkas dan dikenal dalam konteks Alkitab. Struktur kalimat mengikuti urutan tindakan dan identifikasi dalam bahasa Ibrani tanpa terasa kaku.
