  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: id
  text: Sebab siapa pun yang memakan lemak dari hewan yang darinya orang mempersembahkan kurban dengan api[a] kepada TUHAN, orang yang memakannya itu harus disingkirkan dari antara bangsanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan sajian”. Istilah Ibraninya menunjuk pada persembahan yang dilalap api di atas mezbah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini merupakan rumusan hukum yang arti tepat hukumannya diperdebatkan; ungkapan itu dapat menyiratkan pengucilan, kematian, atau penghukuman ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi larangan pada ayat sebelumnya; “Sebab” mempertahankan hubungan wacananya secara alami.
- source_word: כָּל אֹכֵל
  choice: siapa pun yang memakan
  rationale: Ungkapan ini menyatakan perkara umum yang berlaku bagi setiap orang, dengan bentuk Indonesia yang alami.
- source_word: חֵלֶב
  choice: lemak
  rationale: Dalam hukum kurban, istilah ini menunjuk pada lemak hewan, khususnya bagian lemak yang dikhususkan bagi persembahan.
- source_word: מִן הַבְּהֵמָה
  choice: dari hewan
  rationale: בְּהֵמָה di sini menunjuk secara luas pada hewan dalam konteks kurban; “hewan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: yang sebagian darinya dipersembahkan
  rationale: Bahasa Ibrani secara harfiah menyatakan bahwa orang mempersembahkan sesuatu “darinya”. Penambahan “sebagian” memperjelas bahwa yang dipersembahkan berasal dari hewan itu, bukan bahwa seluruh hewan selalu dibakar.
- source_word: אִשֶּׁה
  choice: kurban dengan api
  rationale: Istilah kultis ini menunjuk pada persembahan yang diproses atau diubah menjadi asap dengan api mezbah. Pilihan ini menjaga kaitannya dengan api tanpa membatasi maknanya menjadi makanan saja.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Preposisi menandai tujuan atau penerima persembahan, sedangkan nama ilahi יהוה ditampilkan dengan bentuk konvensional Indonesia “TUHAN”.
- source_word: וְנִכְרְתָה
  choice: harus disingkirkan
  rationale: Ini adalah rumusan hukuman perjanjian. “Disingkirkan” cukup alami dalam bahasa Indonesia dan, bersama catatan kaki, tidak menetapkan secara sempit apakah pelaksanaannya berupa pengucilan, kematian, atau penghukuman ilahi.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: orang yang memakannya itu
  rationale: נֶפֶשׁ dalam konteks hukum menunjuk pada pribadi atau orang yang bersalah, bukan pada “jiwa” sebagai bagian terpisah dari manusia.
- source_word: מֵעַמֶּיהָ
  choice: dari antara bangsanya
  rationale: Akhiran feminin mengikuti bentuk gramatikal נֶפֶשׁ, tetapi rujukannya generik. Bahasa Indonesia tidak perlu menandai gender, dan “bangsanya” mempertahankan gagasan keterpisahan dari kelompok asalnya.
theological_decisions:
- issue: Makna rumusan hukuman וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: harus disingkirkan dari antara bangsanya
  alternative: harus dilenyapkan dari antara bangsanya; harus dikeluarkan dari bangsanya
  rationale: Mekanisme hukuman dalam rumusan Ibrani ini diperdebatkan dan dapat dipahami sebagai pengucilan, kematian, penghukuman ilahi, atau gabungan beberapa unsur tersebut. Teks utama dan catatan kaki mempertahankan ketegangan itu tanpa memilih satu tafsiran secara mutlak.
- issue: Gender pelanggar dalam bahasa hukum generik
  choice: orang ... bangsanya
  alternative: perempuan itu ... bangsanya
  rationale: Bentuk feminin pada akhiran Ibrani disebabkan oleh kesesuaian gramatikal dengan נֶפֶשׁ, bukan karena pelanggar harus perempuan. Bentuk Indonesia menyampaikan rujukan generik tanpa menambah gender.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang khidmat tetapi mudah dipahami. Struktur kalimat mempertahankan hubungan sebab-akibat dengan ayat sebelumnya. Istilah kurban dan rumusan hukuman dibuat cukup dekat dengan sumber, sementara catatan kaki menjaga ambiguitas leksikal dan teologis.
