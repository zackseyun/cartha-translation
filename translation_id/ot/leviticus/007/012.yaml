translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-peribadatan yang tetap lugas. Istilah 'kurban' dipakai untuk זֶבַח, sedangkan 'persembahan' untuk tindakan dan jenis persembahan. Susunan daftar dibuat alami tanpa menghilangkan tiga jenis olahan roti dalam sumber.
