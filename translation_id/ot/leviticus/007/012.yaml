  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: id
  text: Jika ia mempersembahkannya sebagai persembahan syukur[a], bersama kurban syukur itu ia harus mempersembahkan roti tidak beragi yang dicampur dengan minyak, roti tipis tidak beragi yang diolesi minyak, dan roti dari tepung halus yang diolah[b], dicampur dengan minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan ucapan syukur”. Kata Ibrani תּוֹדָה menunjuk pada persembahan yang dibawa sebagai ungkapan syukur.
    reason: lexical_alternative
  - marker: b
    text: Cara pengolahan yang dimaksud oleh kata Ibrani ini tidak diketahui dengan pasti. Kata itu mungkin menunjuk pada tepung yang diaduk, diremas, atau diolah dengan cara tertentu sebelum dicampur dengan minyak.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: persembahan syukur
  rationale: Dalam konteks kurban keselamatan, istilah ini menunjuk pada persembahan yang dibawa sebagai ungkapan syukur; pilihan ini jelas dan alami dalam bahasa Indonesia.
- source_word: יַקְרִיבֶנּוּ
  choice: mempersembahkannya
  rationale: Bentuk kausatif dari קרב dalam konteks kurban berarti membawa atau menyajikan sesuatu sebagai persembahan.
- source_word: זֶבַח הַתּוֹדָה
  choice: kurban syukur
  rationale: Ungkapan ringkas ini mempertahankan hubungan konstruksi Ibrani dan membedakannya dari bahan roti yang menyertai kurban.
- source_word: חַלּוֹת מַצּוֹת
  choice: roti bundar tidak beragi
  rationale: חַלּוֹת menunjuk pada satuan roti atau kue roti, sedangkan מַצּוֹת menyatakan bahwa roti itu tidak beragi; 'roti bundar' merupakan istilah Indonesia yang mudah dipahami dalam daftar sajian.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: dicampur dengan minyak
  rationale: Partisipel dari בלל menyatakan bahan-bahan yang dicampurkan; ungkapan ini alami dalam konteks pengolahan makanan.
- source_word: רְקִיקֵי מַצּוֹת
  choice: roti tipis tidak beragi
  rationale: רְקִיקִים adalah roti atau kue tipis; 'roti tipis' lebih transparan bagi pembaca Indonesia daripada istilah serapan kuliner tertentu.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: diolesi minyak
  rationale: Secara harfiah bentuk ini dapat berarti 'diurapi' atau 'dilumuri', tetapi dalam pengolahan makanan tindakan yang dimaksud paling alami dinyatakan sebagai mengoleskan minyak, tanpa menambahkan kesan upacara pengurapan.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk pada tepung bermutu halus yang lazim dipakai sebagai bahan persembahan.
- source_word: מֻרְבֶּכֶת
  choice: diolah
  rationale: Cara pengolahan tepat yang ditunjuk istilah langka ini tidak pasti. 'Diolah' mempertahankan ketidakpastian itu dan menghindari penetapan yang terlalu khusus seperti direbus, direndam, atau diremas.
- source_word: חַלֹּת
  choice: roti bundar
  rationale: Pengulangan istilah yang sama dipertahankan secara konsisten sebagai satuan roti, tanpa memaksakan pembedaan 'roti' dan 'kue' yang tidak terdapat dalam teks Ibrani.
