  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: id
  text: 'Inilah hukum tentang kurban keselamatan[a] yang dipersembahkan kepada Yahweh:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban kesejahteraan”; secara tradisional disebut “kurban keselamatan.”
    reason: Menjaga keluasan makna שְׁלָמִים, yang dapat menunjuk pada damai, keutuhan, atau kesejahteraan.
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Inilah
  rationale: Ungkapan ini membuka bagian baru. “Inilah” alami dalam bahasa Indonesia dan menyampaikan fungsi penunjuk tanpa menambahkan keterangan waktu yang tidak terdapat dalam bahasa Ibrani.
- source_word: תּוֹרַת
  choice: hukum tentang
  rationale: Dalam bahan keimaman, תּוֹרָה menunjuk pada hukum atau ketentuan ritual yang ditetapkan. “Hukum tentang” mempertahankan corak legal sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: זֶבַח
  choice: kurban
  rationale: זֶבַח adalah kurban yang dipersembahkan, biasanya melalui penyembelihan. “Kurban” merupakan padanan Indonesia yang jelas dan ringkas dalam konteks ritual.
- source_word: הַ/שְּׁלָמִים
  choice: keselamatan
  rationale: שְׁלָמִים adalah istilah teknis bagi suatu jenis kurban. “Kurban keselamatan” mempertahankan istilah Alkitabiah yang dikenal, sedangkan nuansa kesejahteraan atau keutuhan dicantumkan dalam catatan kaki.
- source_word: אֲשֶׁר יַקְרִיב
  choice: yang dipersembahkan orang
  rationale: Hifil קרב dalam konteks kurban berarti membawa untuk dipersembahkan. Bentuk orang ketiga tunggal berfungsi secara umum dalam ketentuan hukum; “orang” mempertahankan sifat generiknya tanpa membatasi pelakunya pada laki-laki. Bentuk Indonesia ini juga tidak memaksakan apakah imperfek Ibrani harus dipahami sebagai masa depan atau kewajiban.
- source_word: לַ/יהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau penerima persembahan, dan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi alih-alih menggantinya dengan gelar.
- issue: Penerjemahan istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban kesejahteraan; kurban persekutuan
  rationale: Istilah Ibrani ini mencakup nuansa damai, keutuhan, dan kesejahteraan. “Kurban keselamatan” mempertahankan istilah tradisional yang dikenal, sementara catatan kaki menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat ringkas sebagai judul pembuka ketentuan ritual. Istilah teknis dipertahankan, sedangkan alternatif semantis utama diberikan dalam catatan kaki.
