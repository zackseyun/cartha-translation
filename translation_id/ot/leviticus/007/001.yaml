  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: id
  text: 'Inilah hukum tentang kurban penebus salah: kurban itu sangat kudus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk “kurban penebus salah” juga dapat diterjemahkan “kurban pemulihan” atau “kurban ganti rugi”; kurban ini berkaitan dengan kesalahan dan pemulihan kerugian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Inilah
  rationale: Gabungan konjungsi dan kata tunjuk ini memperkenalkan bagian ketentuan yang baru. “Inilah” alami dalam bahasa Indonesia dan tidak menambahkan makna temporal.
- source_word: תּוֹרַת
  choice: hukum tentang
  rationale: Dalam konteks kurban, תּוֹרָה menunjuk pada ketentuan atau tata aturan yang ditetapkan. “Hukum tentang” mempertahankan bentuk hukum sambil terdengar wajar.
- source_word: הָ/אָשָׁם
  choice: kurban penebus salah
  rationale: אָשָׁם adalah kategori kurban khusus yang berkaitan dengan kesalahan dan, dalam konteks tertentu, pemulihan kerugian. Pilihan ini membedakannya dari kurban penghapus dosa tanpa mempersempitnya hanya pada ganti rugi.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: sangat kudus
  rationale: Konstruksi ini menyatakan derajat kekudusan tertinggi. “Sangat kudus” jelas dan tidak mudah disalahartikan sebagai nama ruang Mahakudus.
- source_word: הוּא
  choice: kurban itu
  rationale: Kata ganti maskulin ini merujuk kembali kepada אָשָׁם. Pengulangan “kurban itu” memperjelas rujukannya dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan istilah kurban אָשָׁם
  choice: kurban penebus salah
  alternative: kurban penghapus kesalahan; kurban pemulihan; kurban ganti rugi
  rationale: Istilah Ibrani tersebut menamai kategori kurban yang terkait dengan kesalahan dan pemulihan. “Kurban penebus salah” mempertahankan dimensi kesalahan sekaligus fungsi kurbannya, sedangkan unsur pemulihan atau ganti rugi dijelaskan dalam catatan agar ketegangan maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Istilah “kurban” dipakai secara konsisten untuk konteks persembahan ritual, dan kalimat kedua mengulang nomina agar rujukan kata ganti tetap jelas.
