id: LEV.7.24
reference: Leviticus 7:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: id
  text: Namun, lemak dari hewan yang mati tanpa disembelih[a] dan lemak dari hewan yang diterkam dapat digunakan untuk keperluan apa pun; tetapi kamu sama sekali tidak boleh memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani nevelah berarti hewan mati yang tidak disembelih sebagaimana mestinya; dapat juga diterjemahkan “hewan yang ditemukan mati” atau “bangkai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: lemak
  rationale: Padanan baku dan alami dalam konteks hukum makanan dan kurban; konteks menentukan bahwa yang dimaksud ialah lemak hewan.
- source_word: נְבֵלָה
  choice: hewan yang mati tanpa disembelih
  rationale: Istilah ini menunjuk pada hewan mati yang tidak disembelih sebagaimana mestinya. Rumusan ini lebih tepat daripada sekadar 'bangkai' dan tidak membatasi sebab kematiannya pada kematian alami.
- source_word: טְרֵפָה
  choice: hewan yang diterkam
  rationale: Menggambarkan hewan yang dicabik atau diterkam pemangsa tanpa menambahkan secara eksplisit pelaku yang tidak disebut dalam bentuk leksikalnya.
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: dapat digunakan untuk keperluan apa pun
  rationale: Dalam konteks hukum ini, bentuk pasif menyatakan bahwa lemak tersebut boleh dimanfaatkan untuk penggunaan selain makanan; rumusan ini alami dalam bahasa Indonesia modern.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: tetapi kamu sama sekali tidak boleh memakannya
  rationale: Gabungan infinitif absolut dan verba berhingga memberi penegasan kuat pada larangan; 'sama sekali tidak boleh' menyampaikan daya tekan tersebut secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'kamu' mempertahankan sapaan orang kedua jamak dalam konteks umat, sedangkan 'keperluan apa pun' menyampaikan keluasan לְכָל מְלָאכָה secara alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
