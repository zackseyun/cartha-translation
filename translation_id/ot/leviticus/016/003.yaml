base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: id
  text: Harun harus masuk ke Tempat Kudus dengan membawa seekor sapi jantan dari kawanan sebagai kurban penghapus dosa[a] dan seekor domba jantan sebagai kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian.” Istilah Ibrani ini dapat menekankan pemurnian ritual maupun kaitannya dengan dosa.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזֹאת
  choice: Dengan membawa ini
  rationale: Preposisi ב dengan זֹאת menyatakan sarana atau keadaan penyerta. Dalam konteks ini, kata tersebut menunjuk pada persembahan yang segera disebutkan; ungkapan ini alami dalam bahasa Indonesia dan tidak mengaburkan acuannya.
- source_word: יָבֹא
  choice: harus masuk
  rationale: Bentuk imperfek dalam ketentuan hukum ini bersifat instruksional, bukan sekadar menyatakan masa depan.
- source_word: אֶל־הַקֹּדֶשׁ
  choice: ke Tempat Kudus
  rationale: Dalam konteks Hari Pendamaian, istilah ini menunjuk pada ruang kudus yang boleh dimasuki Harun. Kapitalisasi menandainya sebagai nama ruang peribadatan tertentu.
- source_word: בְּפַר בֶּן־בָּקָר
  choice: seekor sapi jantan dari kawanan
  rationale: Ungkapan harfiah 'sapi jantan, anak kawanan' merupakan idiom Ibrani bagi sapi jantan dari ternak; terjemahan ini mempertahankan makna tanpa kejanggalan harfiah.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam peraturan kurban, חַטָּאת lazim menunjuk pada kurban yang berkaitan dengan dosa dan penghapusan kenajisan. Pilihan baku ini tetap mempertahankan hubungan leksikal dengan dosa; nuansa pemurnian dicatat dalam catatan kaki.
- source_word: וְאַיִל
  choice: dan seekor domba jantan
  rationale: אַיִל secara langsung berarti domba jantan.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan Indonesia yang ringkas dan dikenal.
theological_decisions:
- issue: Makna istilah kultis חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah ini berkaitan dengan dosa sekaligus berfungsi dalam pemurnian ritual. Terjemahan utama memakai istilah yang mapan dan mudah dipahami, sedangkan alternatif dicatat agar ketegangan semantis teks tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan setelah titik dua mempertahankan daftar perlengkapan kurban. Ungkapan idiomatis Ibrani dibuat alami tanpa menambahkan usia hewan yang tidak dinyatakan secara tegas.
