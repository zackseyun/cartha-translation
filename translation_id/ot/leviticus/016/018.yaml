  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: id
  text: Kemudian ia harus keluar ke mazbah yang ada di hadapan Yahweh dan mengadakan pendamaian bagi mazbah itu[a]. Ia harus mengambil sebagian darah lembu jantan dan sebagian darah kambing jantan itu, lalu membubuhkannya pada semua tanduk mazbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyucikan mazbah itu”; dalam konteks ritual keimaman, kata kerja Ibrani ini dapat mengandung makna penyucian dari kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Kemudian ia harus keluar
  rationale: Bentuk ini melanjutkan urutan tindakan ritual yang diwajibkan dan mempertahankan gerak keluar dari ruang bagian dalam.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: mazbah yang ada di hadapan Yahweh
  rationale: Frasa ini secara langsung menunjuk pada mazbah yang berada di hadapan atau di depan Yahweh dalam konteks tempat kudus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: וְכִפֶּר עָלָיו
  choice: mengadakan pendamaian bagi mazbah itu
  rationale: Pilihan ini mempertahankan bobot ritual-teologis כפר dan memperjelas bahwa pronomina Ibrani merujuk kepada mazbah, tanpa menentukan teori pendamaian tertentu.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: mengambil sebagian darah lembu jantan dan sebagian darah kambing jantan itu
  rationale: Pengulangan מִן bersifat partitif, yakni mengambil sebagian dari masing-masing darah; jenis kelamin hewan yang tersirat dalam istilah Ibrani dinyatakan secara alami dalam bahasa Indonesia.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: membubuhkannya pada tanduk-tanduk mazbah di sekelilingnya
  rationale: Membubuhkan sesuai dengan tindakan ritual menaruh atau mengoleskan darah, sedangkan bentuk tunggal -nya mencerminkan objek tunggal dalam bahasa Ibrani setelah penyebutan dua sumber darah.
theological_decisions:
- issue: Makna כפר dalam konteks ritual keimaman
  choice: mengadakan pendamaian bagi mazbah itu
  alternative: menyucikan mazbah itu
  rationale: Pendamaian mempertahankan cakupan istilah ritual yang lazim dan bobot teologisnya, sementara nuansa penyucian yang benar-benar mungkin dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “mazbah” dipertahankan karena mapan dalam register Alkitab dan membedakan altar persembahan dari pemakaian umum; rujukan pronominal diperjelas menjadi “mazbah itu” untuk menghindari ketaksaan yang tidak dimaksudkan.
