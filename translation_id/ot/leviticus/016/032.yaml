  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: id
  text: Imam yang diurapi dan ditahbiskan[a] untuk melayani sebagai imam menggantikan ayahnya harus mengadakan pendamaian. Ia harus mengenakan pakaian lenan, yaitu pakaian kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani untuk “ditahbiskan” ialah “yang tangannya diisi”, yaitu idiom untuk dilantik atau ditahbiskan ke dalam pelayanan imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: harus mengadakan pendamaian
  rationale: Dalam konteks ritual keimaman, כפר menunjuk pada pelaksanaan tindakan pendamaian menurut ketetapan. Ungkapan ini mempertahankan makna kultis tanpa merinci mekanismenya melampaui teks.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Teks Ibrani menyebutnya imam, bukan memakai gelar eksplisit imam besar; peran khususnya dijelaskan melalui pengurapan, penahbisan, dan penggantian ayahnya.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: yang telah diurapi
  rationale: Bentuk pasif alami dalam bahasa Indonesia dan dalam konteks menunjuk kepada penerus yang telah menerima pengurapan untuk jabatan tersebut.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: dan ditahbiskan
  rationale: Secara harfiah berarti 'dan yang tangannya diisi', sebuah idiom Ibrani untuk pelantikan atau penahbisan ke dalam jabatan imam. Makna idiom diterjemahkan dalam teks dan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְכַהֵן
  choice: untuk melayani sebagai imam
  rationale: Infinitif ini menyatakan pelaksanaan fungsi keimaman; frasa pilihan jelas dan alami dalam bahasa Indonesia modern.
- source_word: תַּחַת אָבִיו
  choice: menggantikan ayahnya
  rationale: תחת di sini menyatakan pergantian atau suksesi dalam jabatan.
- source_word: וְלָבַשׁ
  choice: Ia harus mengenakan
  rationale: Kata kerja tersebut menyatakan tindakan mengenakan pakaian; 'harus' sesuai dengan daya normatif rangkaian ketetapan ritual ini.
- source_word: בִּגְדֵי הַבָּד
  choice: pakaian lenan
  rationale: בד dalam konteks pakaian imam berarti lenan; istilah ini jelas dan sesuai register Alkitabiah modern.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: yaitu pakaian kudus
  rationale: Pengulangan ini bersifat apositif dan mengidentifikasi pakaian lenan tersebut sebagai pakaian yang dikhususkan bagi penggunaan kudus.
theological_decisions:
- issue: Apakah הַכֹּהֵן diterjemahkan sebagai 'imam' atau secara interpretatif sebagai 'imam besar'
  choice: imam
  alternative: imam besar
  rationale: Konteks mengacu pada penerus dalam jabatan imam besar, tetapi teks Ibrani sendiri memakai 'imam' lalu menjelaskan identitasnya. Terjemahan mempertahankan penyebutan sumber tanpa menambahkan gelar.
- issue: Cara menerjemahkan idiom penahbisan 'mengisi tangan'
  choice: ditahbiskan
  alternative: yang tangannya diisi
  rationale: Terjemahan harfiah akan kabur bagi pembaca Indonesia modern. 'Ditahbiskan' menyampaikan fungsi idiom tersebut, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
- issue: Hubungan antara 'pakaian lenan' dan 'pakaian kudus'
  choice: ditampilkan sebagai aposisi dengan 'yaitu'
  alternative: dipertahankan sebagai dua frasa berurutan tanpa penghubung
  rationale: Bahasa Ibrani mengulang בִּגְדֵי dalam konstruksi apositif. 'Yaitu' memperjelas bahwa yang dimaksud bukan dua perangkat pakaian yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dipecah agar mudah dibaca, sedangkan hubungan apositif pada pakaian diperjelas tanpa menambah isi teologis. Penanda catatan kaki [a] ditempatkan setelah kalimat yang memuat istilah 'ditahbiskan'.
