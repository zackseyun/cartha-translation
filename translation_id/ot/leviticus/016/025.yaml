translation:
  language: id
  text: Dan lemak kurban penghapus dosa[a] itu harus dibakarnya di atas mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban penahiran.” Istilah Ibrani ini dapat menunjuk pada kurban yang digunakan untuk penahiran dari dosa atau kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: itu
  rationale: Konjungsi Ibrani menghubungkan tindakan ini dengan rangkaian ritual sebelumnya, sedangkan penanda objek tidak diterjemahkan tersendiri. Dalam bahasa Indonesia, kesinambungan dan fungsi objek disampaikan secara alami melalui susunan kalimat serta kata penunjuk “itu”.
- source_word: חֵלֶב
  choice: lemak
  rationale: חֵלֶב menunjuk pada lemak kurban yang dikhususkan untuk dibakar di mazbah; “lemak” merupakan padanan langsung tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam peraturan kurban, חַטָּאת menamai kurban yang berkaitan dengan dosa dan penahiran. “Kurban penghapus dosa” jelas dan lazim dipahami, sementara kemungkinan “kurban penahiran” dipertahankan dalam catatan kaki.
- source_word: יַקְטִיר
  choice: harus dibakarnya
  rationale: Bentuk ini menunjuk pada tindakan imam membakar bahan kurban di mazbah sehingga asapnya naik. Susunan “harus dibakarnya” mempertahankan subjek orang ketiga tunggal yang tersirat dan daya wajib bentuk verbal dalam konteks hukum ritual.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran arah pada kata “mazbah” secara harfiah dapat memberi nuansa menuju mazbah, tetapi dalam konteks pembakaran kurban bahasa Indonesia yang wajar menyatakan tempat tindakan itu sebagai “di atas mazbah”.
theological_decisions:
- issue: Pemaknaan חַטָּאת dalam hukum kurban
  choice: kurban penghapus dosa
  alternative: kurban penahiran
  rationale: Istilah Ibrani dapat menunjuk pada kurban yang menangani dosa maupun kenajisan ritual. Terjemahan utama memakai istilah yang mudah dikenali tanpa menutup kemungkinan fungsi penahiran, yang dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. “Mazbah” dipakai sebagai istilah kultis yang mapan; struktur kalimat dibuat alami sambil mempertahankan kaitan dengan urutan ritual sebelumnya.
