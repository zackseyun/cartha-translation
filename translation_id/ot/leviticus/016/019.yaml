reference: Leviticus 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: id
  text: Ia harus memercikkan sebagian dari darah itu ke atasnya dengan jarinya tujuh kali, lalu mentahirkannya[a] dan menguduskannya dari berbagai kenajisan orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membersihkannya secara ritual.” Kata Ibrani yang dipakai merupakan istilah imamat untuk menjadikan sesuatu tahir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Ia harus memercikkan
  rationale: Bentuk Hifil dari נזה dalam konteks ritual menunjuk pada tindakan memercikkan darah; konstruksi kewajiban menyampaikan daya instruksional bentuk verba Ibrani dalam konteks ini.
- source_word: עָלָיו
  choice: ke atasnya
  rationale: Pronomina ini merujuk pada mezbah dalam ayat sebelumnya. Ungkapan tersebut mempertahankan rujukan tanpa mengulang nomina yang tidak terdapat dalam ayat Ibrani.
- source_word: מִן־הַדָּם
  choice: sebagian dari darah itu
  rationale: 'Preposisi מִן bersifat partitif: darah yang dipercikkan diambil dari persediaan darah yang telah disebutkan.'
- source_word: בְּאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: Bet instrumental menyatakan alat atau sarana yang digunakan.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Terjemahan langsung yang mempertahankan ketepatan jumlah dalam ritual.
- source_word: וְטִהֲרוֹ
  choice: lalu menahirkannya
  rationale: טהר adalah istilah imamat untuk menjadikan sesuatu tahir atau bersih secara ritual. 'Menahirkan' membedakannya dari pembersihan fisik biasa.
- source_word: וְקִדְּשׁוֹ
  choice: dan menguduskannya
  rationale: קדש di sini berarti menjadikan atau menetapkan mezbah sebagai kudus; 'menguduskan' alami dalam register keagamaan Indonesia dan tetap dekat dengan istilah sumber.
- source_word: מִטֻּמְאֹת
  choice: dari berbagai kenajisan
  rationale: Bentuk jamak Ibrani dipertahankan secara alami melalui 'berbagai', sedangkan 'kenajisan' menyampaikan kategori ketidaktahiran ritual.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ini adalah ungkapan kolektif bagi umat Israel. Bahasa Indonesia tidak menandai gender gramatikal dalam 'orang', sehingga bentuk ini alami tanpa mengubah cakupan rujukannya.
theological_decisions:
- issue: Bahasa penahiran ritual bagi mezbah
  choice: Mezbah ditahirkan dan dikuduskan dari berbagai kenajisan orang Israel.
  alternative: Mezbah dibersihkan dan disucikan dari kenajisan orang Israel.
  rationale: 'Pilihan ini mempertahankan ranah ritual-imamat: yang dimaksud bukan pertobatan moral mezbah atau pembersihan fisik, melainkan pemulihan status tahir dan kudusnya melalui ritus darah.'
- issue: Hubungan kedua verba טהר dan קדש
  choice: menahirkannya dan menguduskannya
  alternative: menyucikannya dan menjadikannya kudus
  rationale: Dua verba berbeda dipertahankan agar penahiran dan pengudusan tidak dilebur menjadi satu gagasan, tanpa menetapkan secara berlebihan perbedaan teologis yang lebih rinci daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'menahirkan', 'menguduskan', dan 'kenajisan' dipakai untuk mempertahankan nuansa ritual-imamat, sementara susunan kalimat dibuat alami bagi pembaca masa kini. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskan.
