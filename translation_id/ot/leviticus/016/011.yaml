  naturalness: Teks revisi memakai bahasa Indonesia baku dan khidmat yang alami untuk instruksi ritual. “Menghadapkan” dan “mengadakan pendamaian” jelas, sementara pengulangan lembu jantan dipertahankan seperti dalam bahasa Ibrani.
  terminology: “Lembu jantan kurban penghapus dosa” mempertahankan jenis hewan dan hubungan dengan חַטָּאת. “Mengadakan pendamaian” mempertahankan cakupan ritual כפר tanpa menetapkan mekanisme teologis tertentu. “Seisi rumahnya” secara idiomatis menyampaikan בֵּיתוֹ dalam konteks ini.
