  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: id
  text: Harun harus menghadapkan lembu jantan kurban penghapus dosa yang diperuntukkan baginya[a], lalu mengadakan pendamaian bagi dirinya sendiri dan bagi seisi rumahnya[b]. Kemudian ia harus menyembelih lembu jantan kurban penghapus dosa yang diperuntukkan baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lembu jantan untuk kurban penghapus dosa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “rumahnya,” yaitu orang-orang dalam rumah tangganya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa mendekat atau menghadapkan hewan di hadapan TUHAN. 'Mempersembahkan' merupakan ungkapan ritual yang wajar dalam bahasa Indonesia; tindakan ini tidak disamakan dengan seluruh proses kurban karena penyembelihan baru disebut kemudian.
- source_word: פַּר הַחַטָּאת
  choice: lembu jantan sebagai kurban penghapus dosa
  rationale: Frasa konstruksi ini menunjuk kepada lembu jantan yang diperuntukkan sebagai חטאת. 'Kurban penghapus dosa' adalah istilah yang jelas dan lazim, sedangkan 'sebagai' menyampaikan fungsi hewan dalam ritual.
- source_word: אֲשֶׁר לוֹ
  choice: bagi dirinya sendiri
  rationale: Dalam konteks ini, לוֹ menandai bahwa kurban itu diperuntukkan bagi Harun sendiri, bukan sekadar bahwa hewan tersebut merupakan miliknya.
- source_word: וְכִפֶּר
  choice: mengadakan pendamaian
  rationale: כפר dalam konteks ritual keimaman menyatakan tindakan pendamaian. Pilihan ini mempertahankan istilah teologis yang umum tanpa menentukan teori atau mekanisme pendamaian tertentu.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: bagi dirinya dan seisi rumahnya
  rationale: בְּעַד berarti 'bagi' atau 'demi', sedangkan בֵּיתוֹ secara harfiah 'rumahnya' di sini merujuk kepada orang-orang dalam rumah tangganya. 'Seisi rumahnya' alami sekaligus dekat dengan metafora Ibrani.
- source_word: וְשָׁחַט
  choice: Sesudah itu, ia harus menyembelih
  rationale: שחט adalah istilah baku untuk penyembelihan kurban. 'Sesudah itu' menyatakan urutan tindakan yang dibawa oleh rangkaian waw konsekutif tanpa mengubah isi ritual.
- source_word: פַּר הַחַטָּאת אֲשֶׁר לוֹ
  choice: lembu jantan sebagai kurban penghapus dosa bagi dirinya sendiri
  rationale: Pengulangan frasa dipertahankan untuk mencerminkan penekanan dan susunan ritual dalam teks Ibrani.
theological_decisions:
- issue: Makna כפר dalam bahasa kurban
  choice: mengadakan pendamaian
  alternative: mengadakan penghapusan; melakukan ritus pendamaian
  rationale: Pilihan ini mempertahankan cakupan teologis istilah ritual tersebut tanpa mempersempitnya menjadi satu teori pendamaian atau hanya satu akibat ritual.
- issue: Cakupan בֵּיתוֹ
  choice: seisi rumahnya
  alternative: rumah tangganya; rumahnya
  rationale: Konteks menunjukkan orang-orang dalam rumah Harun, tetapi ungkapan 'seisi rumahnya' tetap mempertahankan citra 'rumah' dari bahasa Ibrani dan tidak menentukan secara lebih sempit siapa saja yang termasuk.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ritual dipertahankan. 'Harus' dipakai untuk menyampaikan bentuk tindakan yang diwajibkan dalam petunjuk ritual; 'ia' menghindari pengulangan nama yang terasa kaku.
