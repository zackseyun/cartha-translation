source:
  edition: WLC
  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: id
  text: Orang yang mengirim kambing itu ke Azazel[a] harus mencuci pakaiannya dan membasuh tubuhnya dengan air. Sesudah itu, ia boleh masuk kembali ke perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "untuk Azazel". Istilah Ibrani ini diperdebatkan; istilah ini dapat dipahami sebagai nama atau sebutan, atau ditafsirkan secara fungsional sebagai penyingkiran atau apa yang disebut "kambing pelepas".
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Orang yang membawa ... pergi
  rationale: Partisipel berartikel ini berfungsi sebagai nomina dan menunjuk kepada orang yang ditugaskan membawa kambing itu pergi. Ungkapan ini wajar dalam bahasa Indonesia dan mempertahankan gagasan pengutusan atau penyingkiran.
- source_word: הַשָּׂעִיר
  choice: kambing itu
  rationale: Nomina ini menunjuk kepada kambing jantan yang sudah dikenal dari konteks ritual. Dalam bahasa Indonesia, 'kambing itu' cukup jelas dan lebih alami daripada mengulang 'kambing jantan'.
- source_word: לַעֲזָאזֵל
  choice: kepada Azazel
  rationale: Istilah Ibrani ini diperdebatkan. Mentransliterasikannya sebagai nama atau sebutan menjaga ambiguitas teks tanpa menetapkan tafsiran tertentu seperti 'untuk disingkirkan'.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk ini menyatakan kewajiban ritual. 'Harus' menyampaikan daya perintah secara jelas, sedangkan 'pakaian' alami dalam bahasa Indonesia modern.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: בשר secara harfiah berarti 'daging', tetapi dalam konteks pentahiran menunjuk kepada tubuh. 'Membasuh tubuhnya dengan air' tepat, wajar, dan tetap dekat dengan struktur sumber.
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Penanda urutan waktu ini diterjemahkan secara ringkas dan alami.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: ia boleh masuk kembali ke perkemahan
  rationale: Dalam urutan hukum ritual ini, bentuk tersebut menyatakan bahwa orang itu diizinkan memasuki kembali perkemahan setelah pembasuhan. 'Kembali' tersirat oleh konteks karena sebelumnya ia telah keluar untuk membawa kambing itu.
theological_decisions:
- issue: Makna לַעֲזָאזֵל dalam ritual Hari Pendamaian
  choice: Mempertahankan Azazel sebagai nama atau sebutan yang ditransliterasikan
  alternative: Menerjemahkannya secara fungsional sebagai 'untuk disingkirkan' atau mengidentifikasikannya sebagai kambing pelepas maupun sosok padang gurun
  rationale: Makna dan rujukan istilah ini diperdebatkan. Transliterasi menjaga ketegangan teologis dan leksikal teks sumber tanpa memasukkan satu tafsiran ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang lugas dan bermartabat. Tidak ditambahkan catatan kaki karena transliterasi 'Azazel' sendiri mempertahankan ketidakpastian istilah; tidak ada penanda catatan kaki dalam teks utama.
