  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: id
  text: Dan dari umat Israel[a], ia harus mengambil dua ekor kambing jantan sebagai kurban penghapus dosa[b] dan seekor domba jantan sebagai kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jemaat anak-anak Israel”; maksudnya ialah umat atau keturunan Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban pemurnian.” Istilah Ibrani חַטָּאת dalam Kitab Imamat dapat menyebut kurban yang menangani dosa dan kenajisan ritual.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: Dari
  rationale: Kata depan ini menyatakan sumber hewan-hewan kurban. Hubungannya dengan ayat sebelumnya tetap jelas dalam bahasa Indonesia tanpa harus menambahkan kata penghubung yang kaku.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan ini menunjuk kepada komunitas Israel secara keseluruhan. 'Umat Israel' alami dalam bahasa Indonesia modern dan menyampaikan makna kolektifnya; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: יִקַּח
  choice: ia harus mengambil
  rationale: Bentuk imperfek ini berfungsi sebagai ketentuan dalam petunjuk ritual. 'Harus' menyampaikan daya wajibnya secara jelas dan wajar.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: dua ekor kambing jantan
  rationale: Terjemahan ini mempertahankan jumlah dan jenis kelamin hewan yang ditentukan serta memakai penggolong hewan yang alami dalam bahasa Indonesia.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks kurban, חַטָּאת menunjuk kepada jenis persembahan yang menangani dosa dan kenajisan ritual. Istilah tradisional yang mudah dipahami dipakai dalam teks utama, sedangkan nuansa pemurniannya dicatat.
- source_word: וְאַיִל אֶחָד
  choice: dan seekor domba jantan
  rationale: אַיִל secara khusus berarti domba jantan; 'seekor' menyampaikan angka satu secara alami tanpa menghilangkan spesifikasinya.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah kurban yang seluruhnya dibakar. 'Kurban bakaran' merupakan padanan Indonesia yang ringkas dan dikenal.
theological_decisions:
- issue: Cakupan עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: jemaat anak-anak Israel
  rationale: Ungkapan Ibrani secara harfiah menyebut 'anak-anak Israel', tetapi secara idiomatis menunjuk kepada seluruh komunitas keturunan Israel. Terjemahan utama mempertahankan cakupan kolektif tanpa menyiratkan bahwa yang dimaksud hanya anak laki-laki.
- issue: Makna חַטָּאת dalam tata kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani dapat menonjolkan penanganan dosa maupun pemurnian dari kenajisan ritual. Teks utama memakai istilah yang paling dikenal, sementara catatan kaki mempertahankan alternatif yang penting bagi pemahaman fungsi kurban.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah ritual dibuat konsisten dan mudah dipahami; struktur kalimat tetap dekat dengan urutan Ibrani tanpa terasa kaku.
