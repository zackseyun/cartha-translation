  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: id
  text: 'Lalu Harun harus membuang undi atas kedua kambing jantan itu: satu undi bagi TUHAN dan satu undi bagi Azazel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “satu undi bagi kambing yang dilepaskan.” Arti istilah Ibrani “Azazel” diperdebatkan; istilah itu dapat dipahami sebagai nama diri, fungsi kambing tersebut, atau istilah yang berkaitan dengan pembuangan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: harus membuang
  rationale: Secara harfiah verba ini berarti “memberikan/menaruh”, tetapi bersama גּוֹרָלוֹת dan עַל membentuk ungkapan ritual tentang membuang atau menetapkan undi. “Membuang undi” adalah ungkapan Indonesia yang alami.
- source_word: עַל
  choice: atas
  rationale: Mempertahankan gambaran harfiah bahwa undi dilakukan atas kedua kambing itu tanpa mengubahnya menjadi penjelasan yang lebih interpretatif.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: kedua kambing jantan itu
  rationale: שָׂעִיר dalam konteks ini menunjuk kepada kambing jantan. Unsur definit dipertahankan dengan “itu”.
- source_word: גּוֹרָלוֹת / גּוֹרָל אֶחָד
  choice: undi / satu undi
  rationale: “Undi” merupakan padanan baku dan jelas bagi benda atau hasil yang dipakai untuk menentukan penetapan ritual.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Prefiks ל menyatakan peruntukan atau penetapan. Nama perjanjian יהוה diterjemahkan menurut konvensi Alkitab Indonesia sebagai “TUHAN”.
- source_word: לַעֲזָאזֵל
  choice: bagi Azazel
  rationale: Istilah עֲזָאזֵל dipertahankan sebagai transliterasi karena maknanya diperdebatkan; pilihan ini tidak menutup kemungkinan bahwa istilah itu menunjuk kepada nama, fungsi kambing, atau pembuangan.
theological_decisions:
- issue: Makna עֲזָאזֵל dalam ritual Hari Pendamaian
  choice: Azazel sebagai transliterasi dalam teks utama
  alternative: kambing pelepas; pembuangan menyeluruh; sosok yang berkaitan dengan padang gurun
  rationale: Ayat ini tidak memastikan apakah istilah tersebut merupakan nama diri, sebutan bagi fungsi kambing, tujuan, atau gagasan pembuangan. Transliterasi menjaga ketegangan dan ambiguitas teks Ibrani, sedangkan alternatif tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kambing jantan” menyampaikan jenis hewan secara tepat; “membuang undi” mempertahankan idiom ritual yang mudah dipahami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
