  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: id
  text: 'Lalu ia harus menyembelih kambing jantan kurban penghapus dosa bagi umat itu. Ia harus membawa darahnya ke balik tirai dan memperlakukan darah itu seperti ia memperlakukan darah lembu jantan: ia harus memercikkannya ke atas tutup pendamaian[a] dan di depan tutup itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: kapporet, yaitu tutup emas pada Tabut Perjanjian; dalam beberapa terjemahan tradisional disebut “takhta belas kasihan”.'
    reason: Menjelaskan benda yang dimaksud dan mencatat padanan tradisional tanpa menjadikannya istilah utama atau menyiratkan bahwa itu adalah sebutan tradisional Indonesia.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Lalu ia harus menyembelih
  rationale: Kata kerja ini menunjuk pada penyembelihan ritual. Dalam rangkaian petunjuk hukum, “harus” menyatakan kewajiban, sedangkan “lalu” menyampaikan urutan tindakan yang ditandai waw.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: kambing jantan kurban penghapus dosa bagi umat itu
  rationale: שְׂעִיר adalah kambing jantan, sedangkan הַחַטָּאת merupakan nama jenis kurban. “Bagi umat itu” membedakannya dari lembu jantan yang dipersembahkan bagi Harun.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: ke balik tirai
  rationale: Ungkapan Ibrani menunjuk pada ruang di sisi dalam atau di belakang tirai. “Ke balik tirai” alami dalam bahasa Indonesia dan mempertahankan acuan ruang ritual.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: memperlakukan darah itu seperti ia memperlakukan darah lembu jantan
  rationale: Teks Ibrani bersifat eliptis dan memerintahkan tindakan ritual yang sama terhadap kedua darah. “Memperlakukan” menyampaikan maksud itu tanpa menambahkan rincian yang tidak disebutkan.
- source_word: וְהִזָּה אֹתוֹ
  choice: ia harus memercikkannya
  rationale: Dalam konteks kurban, bentuk hiphil dari נזה menunjuk pada tindakan memercikkan darah. Akhiran “-nya” mengacu pada darah kambing.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada tutup emas Tabut Perjanjian. “Tutup pendamaian” mempertahankan baik bentuk bendanya maupun kaitan leksikalnya dengan pendamaian, tanpa memakai gambaran “takhta” yang tidak eksplisit dalam kata Ibrani.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: dan di depan tutup itu
  rationale: לִפְנֵי menyatakan posisi di depan. “Tutup itu” menghindari pengulangan yang kaku sambil tetap jelas mengacu pada tutup pendamaian yang sama.
theological_decisions:
- issue: Terjemahan כַּפֹּרֶת
  choice: tutup pendamaian
  alternative: takhta belas kasihan
  rationale: Kata Ibrani secara konkret menunjuk pada tutup Tabut dalam ritual Hari Pendamaian. Pilihan utama mempertahankan acuan bendawi dan hubungan dengan akar kata pendamaian; alternatif tradisional yang menggambarkannya sebagai “takhta” dapat menyiratkan konsep yang tidak dinyatakan secara langsung oleh istilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual “kurban penghapus dosa” dipakai secara transparan; kalimat panjang sumber dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah urutan tindakan.
