  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: id
  text: Lalu ia harus mengambil kedua kambing jantan itu dan menempatkan keduanya di hadapan Yahweh, di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Lalu ia harus mengambil
  rationale: Bentuk verba dalam rangkaian petunjuk ritual menyatakan tindakan berikut yang wajib dilakukan; “lalu ... harus” menyampaikan urutan dan sifat preskriptifnya secara alami.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: kedua kambing jantan itu
  rationale: שָׂעִיר dalam konteks kurban menunjuk kambing jantan. Kata penentu pada bahasa Ibrani dipertahankan dengan “itu” karena kedua hewan tersebut telah disebut dalam konteks sebelumnya.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: dan menempatkan keduanya
  rationale: Bentuk Hifil dari עמד secara harfiah berarti membuat berdiri dan dalam konteks ini menyatakan penempatan ritual. “Menempatkan” mempertahankan tindakan konkret tanpa mempersempitnya menjadi sekadar tindakan seremonial “mempersembahkan”.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan posisi atau kehadiran, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” sesuai bukti teks sumber.
- source_word: פֶּתַח
  choice: di pintu masuk
  rationale: פֶּתַח menunjuk bukaan atau jalan masuk. “Pintu masuk” merupakan ungkapan Indonesia yang alami dan tidak mengharuskan adanya daun pintu.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan ini mempertahankan unsur “kemah” dan fungsi tempat pertemuan yang terkandung dalam frasa Ibrani, serta menggunakan kapitalisasi sebagai nama sebutan tempat kudus tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama perjanjian sebagai nama diri, alih-alih menggantinya dengan gelar.
- issue: Makna tindakan הֶעֱמִיד dalam ritual
  choice: menempatkan
  alternative: mempersembahkan
  rationale: “Menempatkan” mempertahankan makna konkret ‘membuat berdiri/menaruh di hadapan’ tanpa menambahkan tafsiran bahwa tindakan ini sendiri merupakan persembahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami untuk petunjuk ritual; “ia” dipertahankan karena pelakunya jelas dari konteks, dan “keduanya” menghindari pengulangan yang kaku.
