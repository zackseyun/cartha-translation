id: LEV.16.10
reference: Leviticus 16:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: id
  text: Namun kambing jantan yang terkena undi bagi Azazel harus dihadapkan hidup-hidup di hadapan TUHAN, untuk mengadakan pendamaian atasnya[a], lalu mengirimnya pergi bagi Azazel ke padang gurun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk mengadakan pendamaian baginya.”'
    reason: Preposisi Ibrani dapat dipahami sebagai “atasnya” atau “baginya” dalam konteks ritual.
  - marker: b
    text: Arti istilah Ibrani “Azazel” diperdebatkan. Istilah ini mungkin merupakan nama diri atau berkaitan dengan pelepasan dan pembuangan; karena itu ada juga yang menerjemahkannya “kambing pelepasan.”
    reason: Menjaga ketidakpastian leksikal dan teologis istilah עֲזָאזֵל.
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Namun kambing jantan
  rationale: שָׂעִיר menunjuk pada kambing, khususnya kambing jantan dalam konteks ritual ini. 'Namun' menandai kontras dengan kambing yang lain pada ayat sebelumnya.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: yang terkena undi
  rationale: Ungkapan Ibrani ini berarti undi jatuh atau keluar atas kambing tersebut; 'terkena undi' alami dalam bahasa Indonesia dan mempertahankan gagasan pemilihan melalui undi.
- source_word: לַעֲזָאזֵל
  choice: bagi Azazel
  rationale: Makna עֲזָאזֵל diperdebatkan. Transliterasi mempertahankan ambiguitas sumber tanpa langsung menafsirkannya sebagai 'kambing hitam' atau 'pembuangan'.
- source_word: יָעֳמַד חַי
  choice: harus dihadapkan hidup-hidup
  rationale: Bentuk Hofal menyatakan bahwa kambing itu dibuat berdiri atau ditempatkan di hadapan TUHAN. 'Dihadapkan hidup-hidup' menyampaikan daya kausatif-pasif secara alami.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan TUHAN
  rationale: Padanan baku dan bermartabat bagi ungkapan kehadiran kultis; nama ilahi ditampilkan sebagai TUHAN sesuai konvensi Alkitab Indonesia.
- source_word: לְכַפֵּר עָלָיו
  choice: untuk mengadakan pendamaian atasnya
  rationale: '''Mengadakan pendamaian'' menyampaikan fungsi kultis כפר. ''Atasnya'' mempertahankan עַל dan tidak menentukan apakah kambing itu penerima manfaat atau unsur ritual pendamaian.'
- source_word: לְשַׁלַּח אֹתוֹ
  choice: lalu melepaskannya
  rationale: Infinitif ini menyatakan tujuan lanjutan. 'Melepaskan' sesuai dengan tindakan mengirim kambing itu pergi, sedangkan 'lalu' membuat urutan tujuan alami dalam bahasa Indonesia.
- source_word: הַמִּדְבָּרָה
  choice: ke padang gurun
  rationale: Akhiran direktif menyatakan gerak menuju padang gurun; 'ke padang gurun' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Makna עֲזָאזֵל
  choice: Azazel (ditransliterasikan)
  alternative: kambing pelepasan; pembuangan sepenuhnya; nama makhluk atau tempat di padang gurun
  rationale: Makna istilah tersebut tidak pasti. Mempertahankan 'Azazel' dalam teks utama tidak memutuskan apakah istilah itu nama diri, tempat, atau konsep pelepasan.
- issue: Daya לְכַפֵּר עָלָיו
  choice: mengadakan pendamaian atasnya
  alternative: mengadakan pendamaian baginya
  rationale: Preposisi עַל secara harfiah dapat berarti 'atas', tetapi dalam konteks ritual juga dapat dipahami 'bagi'. Teks utama mempertahankan susunan yang lebih dekat dengan bahasa Ibrani.
- issue: Hubungan frasa terakhir לַעֲזָאזֵל הַמִּדְבָּרָה
  choice: ke padang gurun bagi Azazel
  alternative: sebagai kambing pelepasan ke padang gurun
  rationale: Susunan ini mempertahankan kedua unsur tujuan—padang gurun dan Azazel—tanpa menjelaskan secara spekulatif hubungan tepat di antara keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ritual dipertahankan tanpa menjadi kaku; istilah 'Azazel' dibiarkan tidak ditafsirkan dalam teks utama, sedangkan alternatif penting dijelaskan dalam catatan kaki.
