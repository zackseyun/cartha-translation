base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: id
  text: Kemudian Harun harus masuk ke Kemah Pertemuan, menanggalkan pakaian lenan yang ia kenakan ketika ia masuk ke tempat kudus[a], dan meninggalkan pakaian itu di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat suci”; berdasarkan konteks Hari Pendamaian, sebagian memahami ini secara lebih khusus sebagai “tempat mahakudus”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  choice: Kemudian ... harus masuk
  rationale: Waw dengan bentuk qatal dalam rangkaian petunjuk ritual menyatakan langkah berikutnya. Dalam konteks tujuan berupa kemah, verba בוא secara alami diterjemahkan “masuk” dalam bahasa Indonesia.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Istilah baku dan jelas untuk bangunan suci tempat pertemuan; kapitalisasi menandai sebutan khusus.
- source_word: וּפָשַׁט
  choice: menanggalkan
  rationale: Padanan Indonesia yang alami dan bermartabat untuk tindakan melepas pakaian.
- source_word: בִּגְדֵי הַבָּד
  choice: pakaian lenan
  rationale: Mempertahankan baik jenis benda maupun bahan ritualnya; “lenan” merupakan istilah Indonesia yang lazim dalam konteks tekstil dan Alkitab.
- source_word: אֲשֶׁר לָבַשׁ
  choice: yang dikenakannya
  rationale: Menyampaikan makna memakai/mengenakan tanpa membuat klausa Indonesia terasa kaku.
- source_word: בְּבֹאוֹ
  choice: ketika ia masuk
  rationale: Infinitif dengan prefiks ב menyatakan keadaan waktu. Pengulangan “masuk” mempertahankan gerak ke dalam yang terdapat dalam teks sumber.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Terjemahan langsung yang mempertahankan keluasan acuan istilah Ibrani dan tidak mempersempitnya secara tidak tersurat menjadi Ruang Mahakudus.
- source_word: וְהִנִּיחָם שָׁם
  choice: dan meninggalkannya di sana
  rationale: הניח dapat berarti menaruh atau membiarkan tetap di suatu tempat; “meninggalkannya di sana” alami dan tidak menentukan cara peletakannya.
theological_decisions:
- issue: Acuan הַקֹּדֶשׁ
  choice: tempat kudus
  alternative: tempat suci; tempat mahakudus
  rationale: Teks memakai istilah umum “yang kudus/tempat kudus”, bukan sebutan lengkap yang secara eksplisit menunjuk ruang terdalam. Terjemahan utama mempertahankan ambiguitas itu, sedangkan catatan menyebut kemungkinan pemahaman yang lebih khusus dari konteks Hari Pendamaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti urutan prosedural Ibrani sambil memakai ungkapan Indonesia yang wajar. Pronomina tunggal “-nya” merujuk pada kumpulan pakaian sebagai satu kesatuan gramatikal dalam bahasa Indonesia.
