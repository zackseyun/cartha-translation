  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: id
  text: Ia harus menaruh dupa itu ke atas api di hadapan Yahweh, supaya awan dupa itu menutupi tutup pendamaian[a] yang berada di atas Kesaksian, agar ia tidak mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional juga diterjemahkan “takhta belas kasihan”. Istilah Ibrani ini menunjuk pada tutup tabut, khususnya dalam perannya pada ritus pendamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Ia harus menaruh
  rationale: Bentuk ini dalam konteks petunjuk ritual menyatakan kewajiban/prosedur. 'Harus menaruh' alami dalam bahasa Indonesia dan mempertahankan daya instruktifnya.
- source_word: הַקְּטֹרֶת
  choice: dupa itu
  rationale: Kata ini menunjuk pada dupa yang sudah ditentukan bagi ritual tersebut; 'dupa' merupakan padanan Indonesia yang alami tanpa menambahkan gagasan 'campuran' ke dalam teks.
- source_word: עַל הָאֵשׁ
  choice: di atas api
  rationale: Ungkapan ini menyatakan bahwa dupa diletakkan pada api atau bara yang menyala. 'Di atas api' mempertahankan bentuk ungkapan Ibrani dan wajar dalam konteks.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: '''Di hadapan'' menyampaikan kedekatan kultis dan kehadiran ilahi, sedangkan nama diri יהוה ditransliterasikan sebagai ''Yahweh''.'
- source_word: וְכִסָּה
  choice: supaya ... menutupi
  rationale: Dalam rangkaian petunjuk ini, klausa tersebut paling wajar menyatakan tujuan atau hasil yang dimaksud, tanpa menentukan secara kaku batas antara tujuan dan akibat.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: awan dupa itu
  rationale: Padanan ini alami dan ringkas serta mempertahankan citra awan yang dihasilkan oleh dupa.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada tutup tabut dalam fungsi ritual pendamaian. 'Tutup pendamaian' transparan bagi pembaca modern dan mempertahankan baik referen bendanya maupun kaitannya dengan pendamaian.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: yang berada di atas loh Kesaksian
  rationale: Dalam konteks tabut, עֵדוּת menunjuk pada loh-loh yang menjadi kesaksian perjanjian. Penambahan 'loh' menjadikan referennya jelas dalam bahasa Indonesia tanpa mengubah maksud konteks.
- source_word: וְלֹא יָמוּת
  choice: sehingga ia tidak mati
  rationale: Klausa ini menyatakan hasil perlindungan yang terkait dengan awan dupa. 'Sehingga' mempertahankan kemungkinan nuansa akibat, sementara hubungan tujuan/hasil tetap tidak dipersempit secara berlebihan.
theological_decisions:
- issue: Penerjemahan הַכַּפֹּרֶת dalam konteks tempat kudus dan pendamaian
  choice: tutup pendamaian
  alternative: tutup pendamaian; takhta belas kasihan
  rationale: '''Tutup pendamaian'' secara langsung menunjukkan benda yang dimaksud dan perannya dalam ritus pendamaian. Padanan tradisional ''takhta belas kasihan'' dapat memberi kesan bahwa benda itu secara harfiah sebuah takhta, sehingga dicatat sebagai alternatif dalam catatan kaki.'
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi 'Yahweh' mempertahankan nama pribadi ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Hubungan sintaksis klausa terakhir וְלֹא יָמוּת
  choice: sehingga ia tidak mati
  alternative: supaya ia tidak mati; agar ia jangan mati
  rationale: Konteks memungkinkan nuansa tujuan maupun akibat. 'Sehingga' menyajikan hubungan hasil tanpa menghilangkan ketegangan semantis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti urutan tindakan dalam teks Ibrani, tetapi memakai bentuk kewajiban dan hubungan antarklausa yang alami bagi pembaca Indonesia. Kapitalisasi 'Kesaksian' menandai sebutan khusus bagi loh perjanjian dalam konteks tabut.
