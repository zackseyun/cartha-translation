id: LEV.16.16
reference: Leviticus 16:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: id
  text: Dengan demikian ia harus mengadakan pendamaian bagi tempat kudus karena kenajisan umat Israel dan karena pelanggaran mereka, yakni segala dosa mereka; demikian juga harus dilakukannya bagi Kemah Pertemuan yang berdiam bersama mereka di tengah-tengah kenajisan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: ia harus mengadakan pendamaian
  rationale: Dalam konteks ritual Imamat, כפר menunjuk pada tindakan pendamaian yang sekaligus menangani pencemaran ritual dan dosa. Ungkapan ini mempertahankan bobot ritual-teologisnya tanpa membatasinya hanya pada pemurnian.
- source_word: עַל הַקֹּדֶשׁ
  choice: bagi tempat kudus
  rationale: הַקֹּדֶשׁ menunjuk pada ruang suci dalam tempat ibadah. 'Tempat kudus' dekat dengan bentuk Ibrani dan sesuai dengan konteks ritual pasal ini.
- source_word: מִטֻּמְאֹת
  choice: karena kenajisan-kenajisan
  rationale: מִן menyatakan sebab atau sumber pencemaran yang ditangani oleh ritual tersebut. Bentuk jamak dipertahankan untuk mencerminkan teks Ibrani dan berbagai keadaan kenajisan ritual.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan Ibrani merujuk secara kolektif kepada bangsa Israel. 'Umat Israel' merupakan ungkapan Indonesia yang alami, jelas, dan tidak menyempitkan rujukannya hanya kepada laki-laki.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: dan karena pelanggaran-pelanggaran mereka
  rationale: פשע memuat gagasan pelanggaran yang serius, bahkan pemberontakan. 'Pelanggaran' mempertahankan bobot moralnya tanpa memastikan bahwa setiap kasus merupakan pemberontakan terbuka.
- source_word: לְכָל חַטֹּאתָם
  choice: yakni segala dosa mereka
  rationale: חטאות paling wajar berarti 'dosa-dosa' dalam kesejajaran dengan kenajisan dan pelanggaran. 'Yakni' menyampaikan hubungan penjelas atau cakupan yang mungkin dimiliki לְכָל dalam susunan ini.
- source_word: וְכֵן יַעֲשֶׂה
  choice: demikian juga harus dilakukannya
  rationale: Klausa ini mengarahkan penerapan tindakan ritual yang sama kepada Kemah Pertemuan; bentuk Indonesia ini ringkas dan prosedural.
- source_word: לְאֹהֶל מוֹעֵד
  choice: bagi Kemah Pertemuan
  rationale: Terjemahan ini mempertahankan arti transparan dari sebutan Ibrani אֹהֶל מוֹעֵד dan mengikuti istilah Indonesia yang lazim.
- source_word: הַשֹּׁכֵן אִתָּם
  choice: yang berdiam bersama mereka
  rationale: Partisipel שׁכן menerangkan Kemah Pertemuan sebagai sesuatu yang berada atau berdiam bersama umat. Terjemahan ini sengaja mempertahankan personifikasi dan kedekatan relasional teks.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: di tengah-tengah kenajisan mereka
  rationale: Ungkapan ini mempertahankan gambaran spasial bahwa Kemah Pertemuan hadir di tengah umat sekalipun mereka mengalami kenajisan ritual.
theological_decisions:
- issue: Makna כפר dalam konteks Hari Pendamaian
  choice: mengadakan pendamaian
  alternative: menahirkan; membersihkan
  rationale: Ritual ini menangani kenajisan maupun dosa yang mencemari tempat kudus. 'Mengadakan pendamaian' mempertahankan cakupan kultis-teologis istilah itu, sedangkan 'menahirkan' atau 'membersihkan' hanya menonjolkan hasil pemurniannya.
- issue: Hubungan לְכָל חַטֹּאתָם dengan pelanggaran-pelanggaran mereka
  choice: yakni segala dosa mereka
  alternative: untuk segala dosa mereka
  rationale: Susunan Ibrani dapat dipahami sebagai penjelasan atau perluasan cakupan pelanggaran mereka. 'Yakni' menghasilkan bahasa Indonesia yang alami tanpa mengubah dosa menjadi persembahan penghapus dosa.
- issue: Subjek tersirat dalam הַשֹּׁכֵן
  choice: Kemah Pertemuan yang berdiam bersama mereka
  alternative: Allah yang berdiam bersama mereka
  rationale: Secara tata bahasa, partisipel maskulin הַשֹּׁכֵן paling langsung menerangkan אֹהֶל מוֹעֵד, yang juga maskulin. Terjemahan tidak memasukkan 'Allah' sebagai subjek yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Istilah ritual dipertahankan, tetapi susunan kalimat dibuat alami. Bentuk jamak 'kenajisan-kenajisan' dan 'pelanggaran-pelanggaran' dipakai untuk mencerminkan bentuk jamak Ibrani serta ragam kasus yang dimaksud.
