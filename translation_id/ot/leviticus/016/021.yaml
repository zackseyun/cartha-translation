reference: Leviticus 16:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: id
  text: Harun harus menumpangkan kedua tangannya di atas kepala kambing jantan yang hidup itu, lalu mengakui segala kesalahan umat Israel, segala pelanggaran mereka, dan segala dosa mereka di atas kepala kambing itu. Ia harus menaruh semuanya itu di atas kepala kambing jantan tersebut, kemudian mengirim kambing itu ke padang belantara dengan perantaraan seorang yang telah disiapkan untuk tugas itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya sulit dipastikan; dapat berarti seorang yang siap, yang telah ditunjuk, atau yang sesuai untuk tugas pada waktu itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: harus menumpangkan
  rationale: Dalam konteks persembahan, סמך menunjuk pada tindakan ritual menumpangkan tangan. Bentuk kewajiban cocok dengan rangkaian petunjuk upacara.
- source_word: שְׁתֵּי יָדוֹ
  choice: kedua tangannya
  rationale: Mengungkapkan bilangan ganda secara alami dan menegaskan bahwa kedua tangan digunakan.
- source_word: הַשָּׂעִיר הַחַי
  choice: kambing jantan yang hidup itu
  rationale: שָׂעִיר adalah kambing jantan, sedangkan הַחַי membedakannya dari kambing yang telah disembelih dalam rangkaian upacara.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: lalu mengakui di atasnya
  rationale: Mempertahankan tindakan pengakuan serta relasi spasial-ritual עַל, yaitu pengakuan yang diucapkan di atas kambing.
- source_word: עֲוֺנֹת
  choice: kesalahan
  rationale: Menyampaikan bobot moral עָוֹן dengan bahasa Indonesia yang jelas, sambil membedakannya dari istilah pelanggaran dan dosa berikutnya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan Ibrani harfiah 'anak-anak Israel' berfungsi sebagai sebutan kolektif bagi bangsa atau umat Israel; 'umat Israel' alami dan tidak membatasi rujukannya kepada laki-laki saja.
- source_word: פִּשְׁעֵיהֶם
  choice: pelanggaran mereka
  rationale: פֶּשַׁע dapat mengandung unsur pemberontakan atau pelanggaran. 'Pelanggaran' mempertahankan perbedaannya dari kesalahan dan dosa tanpa mempersempit semua kejadian menjadi pemberontakan terbuka.
- source_word: לְכָל חַטֹּאתָם
  choice: dan segala dosa mereka
  rationale: Dalam konteks ini frasa tersebut melengkapi daftar menyeluruh tiga istilah dosa. 'Dan segala dosa mereka' menghasilkan daftar yang alami tanpa menjadikan לְ sebagai relasi sebab yang tidak pasti.
- source_word: וְנָתַן אֹתָם עַל רֹאשׁ הַשָּׂעִיר
  choice: Ia harus menaruh semuanya itu di atas kepala kambing jantan tersebut
  rationale: Mempertahankan gambaran konkret pemindahan ritual semua kesalahan, pelanggaran, dan dosa yang baru diakui.
- source_word: וְשִׁלַּח ... הַמִּדְבָּרָה
  choice: kemudian mengirim kambing itu ke padang belantara
  rationale: Kata kerja menyatakan pengiriman atau pelepasan pergi, dan akhiran arah pada הַמִּדְבָּרָה menunjukkan gerak menuju padang belantara.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: dengan perantaraan seorang yang telah disiapkan untuk tugas itu
  rationale: בְּיַד menyatakan perantaraan atau pelaksana. Arti tepat עִתִּי tidak pasti, tetapi dalam konteks menunjuk kepada orang yang siap atau telah ditetapkan bagi kesempatan dan tugas tersebut.
theological_decisions:
- issue: Pembedaan tiga istilah mengenai dosa
  choice: kesalahan / pelanggaran / dosa
  alternative: kejahatan / pemberontakan / dosa
  rationale: Teks Ibrani menumpuk tiga istilah berbeda untuk menyatakan cakupan menyeluruh dosa Israel. Terjemahan mempertahankan tiga padanan berbeda tanpa memaksakan batas semantis yang terlalu kaku.
- issue: Gambaran penanggungan dosa pada kambing
  choice: menaruh semuanya itu di atas kepala kambing jantan
  alternative: menanggungkan semuanya itu kepada kambing jantan
  rationale: Ungkapan konkret teks dipertahankan agar tindakan simbolis upacara tetap tampak, tanpa menjelaskan mekanisme teologisnya melampaui yang dinyatakan ayat.
- issue: Rujukan kolektif בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks ini ungkapan tersebut merujuk secara kolektif kepada seluruh komunitas Israel. 'Umat Israel' menyampaikan rujukan itu secara alami dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti urutan tindakan ritual dalam teks Ibrani, tetapi dibagi menjadi dua kalimat agar mudah dipahami. Istilah 'padang belantara' dipilih untuk מִדְבָּר karena tidak membatasi medannya pada gurun pasir.
