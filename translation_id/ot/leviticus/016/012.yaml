  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: id
  text: Ia harus mengambil satu perbaraan penuh bara api dari atas mezbah di hadapan Yahweh, juga kemenyan harum yang ditumbuk halus sepenuh kedua telapak tangannya, lalu membawa semua itu ke balik tabir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke sebelah dalam tabir.” Ungkapan Ibrani ini menunjuk pada ruang di belakang tabir, yaitu ruang kudus bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Ia harus mengambil
  rationale: Bentuk perfektum dengan waw dalam rangkaian ketetapan ritual menyatakan tindakan yang diwajibkan; “harus” menyampaikan daya preskriptifnya dengan wajar dalam bahasa Indonesia.
- source_word: מְלֹא הַמַּחְתָּה
  choice: satu perbaraan penuh
  rationale: Ungkapan konstruksi ini menunjukkan isi sebanyak kapasitas perbaraan. Susunan tersebut alami dalam bahasa Indonesia dan tetap mempertahankan benda serta ukurannya.
- source_word: גַּחֲלֵי אֵשׁ
  choice: bara api
  rationale: Padanan alami bagi frasa Ibrani yang secara harfiah berarti bara dari api; konteksnya menunjukkan bara yang menyala.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: dari atas mezbah
  rationale: Mempertahankan rincian spasial מֵעַל, yakni bahwa bara diambil dari permukaan mezbah.
- source_word: מִלִּפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Frasa ini menerangkan letak mezbah dalam relasinya dengan hadirat Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וּמְלֹא חָפְנָיו
  choice: sebanyak kedua tangannya penuh
  rationale: חָפְנָיו berbentuk dual dan menunjuk pada kedua tangan yang dicekungkan untuk menampung kemenyan. Rumusan ini mempertahankan ukuran yang berbasis pada kedua tangan tanpa menetapkan bahwa yang dimaksud pasti dua genggam terpisah.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: kemenyan harum yang ditumbuk halus
  rationale: סַמִּים menunjuk bahan-bahan aromatik, sedangkan דַּקָּה menyatakan bahwa bahan itu dihancurkan hingga halus. Padanan ini jelas dan alami bagi pembaca modern.
- source_word: וְהֵבִיא
  choice: lalu membawanya
  rationale: Bentuk Hifil dari בוא menyatakan membawa benda-benda tersebut ke tempat tujuan dan melanjutkan urutan tindakan ritual.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: ke balik tabir
  rationale: Dalam konteks tempat kudus, ungkapan ini mengarahkan imam masuk ke ruang di sebelah dalam atau belakang tabir. “Ke balik tabir” menyampaikan arah gerak secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama perjanjian tanpa menggantinya dengan sebuah gelar.
- issue: Arah ungkapan מִבֵּית לַפָּרֹכֶת
  choice: ke balik tabir
  alternative: ke sebelah dalam tabir
  rationale: Konteks ritual mengharuskan gerak masuk ke ruang di belakang tabir. Pilihan utama jelas dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk alternatif yang lebih dekat dengan gagasan “bagian dalam”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan preskriptif. Istilah ritual “perbaraan”, “mezbah”, dan “tabir” dipertahankan karena mapan dan tepat, sementara susunan kalimat dibuat mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
