id: LEV.16.17
reference: Leviticus 16:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: id
  text: Tidak seorang pun boleh berada di dalam Kemah Pertemuan ketika ia masuk untuk mengadakan pendamaian di tempat kudus sampai ia keluar. Ia harus mengadakan pendamaian bagi dirinya sendiri, bagi keluarganya, dan bagi seluruh umat Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל־אָדָם
  choice: tidak seorang pun
  rationale: Dalam konstruksi dengan לֹא, ungkapan ini berarti bahwa tidak boleh ada seorang pun; terjemahan ini alami dalam bahasa Indonesia dan tidak membatasi larangan hanya pada laki-laki.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan transparan untuk nama tempat ibadah tempat TUHAN bertemu dengan umat-Nya.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: mengadakan pendamaian
  rationale: Mempertahankan makna ritual-teologis akar כפר tanpa mempersempitnya menjadi sekadar pengampunan atau penghapusan dosa.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Mencerminkan pemakaian substantif קֹדֶשׁ bagi kawasan kudus tanpa menentukan lebih jauh bagian mana daripada yang dinyatakan teks.
- source_word: בֵּיתוֹ
  choice: keluarganya
  rationale: Dalam konteks ini בַּיִת menunjuk kepada rumah tangga atau keluarga, bukan bangunan rumah.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: Mengungkapkan perhimpunan Israel sebagai komunitas umat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan כָל־אָדָם dalam larangan
  choice: tidak seorang pun
  alternative: tidak ada laki-laki
  rationale: אָדָם di sini bersifat umum dan larangan meniadakan kehadiran siapa pun di Kemah Pertemuan; terjemahan tidak memperkenalkan pembatasan gender yang tidak dituntut konteks.
- issue: Makna ritual כפר
  choice: mengadakan pendamaian
  alternative: menghapus dosa / menebus
  rationale: ‘Pendamaian’ menjaga keluasan tindakan ritual כפר serta ketegangan teologisnya tanpa menetapkan satu teori mekanisme pendamaian.
- issue: Identitas subjek pronominal
  choice: ia
  alternative: Harun
  rationale: Teks Ibrani memakai pronomina orang ketiga; mempertahankan ‘ia’ mengikuti bentuk sumber dan mengandalkan konteks sebelumnya untuk mengidentifikasi Harun.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Struktur kalimat mempertahankan urutan larangan, batas waktunya, lalu tiga pihak yang menerima pendamaian. Pengulangan ‘bagi’ dipertahankan untuk menonjolkan masing-masing kelompok sebagaimana pengulangan בְּעַד dalam teks Ibrani.
