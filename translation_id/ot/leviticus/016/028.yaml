  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: id
  text: Orang yang membakar semuanya itu harus mencuci pakaiannya dan membasuh tubuhnya[a] dengan air. Sesudah itu, ia boleh masuk ke dalam perkemahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dagingnya”; dalam ungkapan pembasuhan ini maksudnya adalah tubuhnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ia akan masuk ke dalam perkemahan.” Kata kerja Ibrani dapat dibaca sebagai pernyataan masa depan biasa, tetapi dalam konteks ini kemungkinan besar menyatakan bahwa ia diizinkan masuk ke perkemahan setelah pembasuhan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף אֹתָם
  choice: Orang yang membakar semuanya itu
  rationale: Partisipel berartikel berfungsi sebagai nomina dan menunjuk kepada orang yang membakar lembu jantan dan kambing jantan, atau sisa-sisanya, yang disebut dalam konteks sebelumnya. 'Semuanya itu' menyatakan objek jamak yang telah disebut tanpa mengulangnya.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk imperfek dalam peraturan ritual ini menyatakan kewajiban. 'Harus' menyampaikan daya preskriptif secara wajar dalam bahasa Indonesia modern, sedangkan 'pakaiannya' jelas dan alami.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: dan membasuh tubuhnya dengan air
  rationale: Secara harfiah בְּשָׂרוֹ berarti 'dagingnya', tetapi dalam ungkapan pembasuhan ini menunjuk kepada tubuh orang tersebut. 'Membasuh tubuhnya dengan air' membedakannya dari tindakan mencuci pakaian dan merupakan ungkapan Indonesia yang alami.
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Frasa ini menandai urutan waktu setelah tindakan pembasuhan dan diterjemahkan secara ringkas serta alami.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: ia boleh masuk kembali ke perkemahan
  rationale: Dalam konteks kenajisan ritual, klausa ini paling wajar dipahami sebagai izin untuk kembali setelah pembasuhan. Kata 'kembali' tersirat dari keberadaan orang itu di luar perkemahan dalam konteks langsung, tetapi tidak dinyatakan secara eksplisit dalam verba Ibrani; karena itu alternatif harfiahnya dicatat.
theological_decisions:
- issue: Daya ritual klausa terakhir
  choice: ia boleh masuk kembali ke perkemahan
  alternative: ia akan masuk ke perkemahan / ia harus masuk ke perkemahan
  rationale: Urutan ketentuan menunjukkan bahwa pembasuhan merupakan syarat sebelum orang tersebut diizinkan masuk lagi. Namun, imperfek Ibrani juga dapat dibaca sebagai pernyataan masa depan atau ketentuan sederhana, sehingga ketegangan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang tetap mudah dipahami. 'Perkemahan' dipilih untuk הַמַּחֲנֶה. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
