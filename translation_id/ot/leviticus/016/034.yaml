  source_fidelity: Draf ini pada umumnya mencerminkan struktur dan makna ayat Ibrani, termasuk ketetapan yang terus berlaku, pendamaian tahunan, nama Yahweh, dan subjek tersirat pada klausa penutup. Namun, bentuk pasif “pendamaian harus diadakan” mengubah infinitif tujuan לְכַפֵּר menjadi perintah mandiri dan kurang langsung merepresentasikan konstruksi sumber.
  naturalness: “Pendamaian harus diadakan bagi umat Israel dari segala dosa mereka” dapat dipahami, tetapi terasa kaku dan hubungan sintaksisnya kurang jelas dalam bahasa Indonesia modern. Bentuk aktif infinitival “untuk mengadakan pendamaian ...” lebih alami serta lebih dekat dengan לְכַפֵּר.
  terminology: “Ketetapan yang berlaku untuk selamanya,” “pendamaian,” “umat Israel,” “Yahweh,” dan “Musa” sesuai register dan istilah penting. “Umat Israel” adalah padanan kolektif yang wajar untuk בְּנֵי יִשְׂרָאֵל. Nuansa מִכָּל dipertahankan dengan “dari segala dosa mereka”; alternatif kausal dijelaskan secara tepat dalam catatan kaki.
  issues:
