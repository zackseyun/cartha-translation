  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: id
  text: Hal ini harus menjadi ketetapan yang berlaku untuk selamanya[a] bagi kalian, untuk mengadakan pendamaian bagi umat Israel dari segala dosa mereka[b], sekali setahun. Dan ia melakukannya sesuai dengan yang Yahweh perintahkan kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani juga dapat diterjemahkan “ketetapan tetap” atau “ketetapan sepanjang masa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “karena segala dosa mereka.” Kata depan Ibrani yang dipakai di sini dapat menonjolkan dasar pendamaian maupun pembersihan dari dosa.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם
  choice: Hal ini harus menjadi ... bagi kalian
  rationale: Mengungkapkan ketentuan hukum yang berlaku bagi komunitas Israel dengan bahasa Indonesia modern tanpa menghilangkan unsur penghubung dan kewajiban.
- source_word: לְחֻקַּת עוֹלָם
  choice: ketetapan untuk selamanya
  rationale: חֻקָּה menunjuk pada ketetapan yang tetap, sedangkan עוֹלָם menyatakan keberlangsungan yang tidak dibatasi dalam kerangka perjanjian; ungkapan ini mempertahankan bobot hukum teks.
- source_word: לְכַפֵּר
  choice: pendamaian harus diadakan
  rationale: כפר dalam konteks ritual imamat menunjuk pada tindakan pendamaian sekaligus penanganan atau pembersihan dosa. Bentuk pasif alami dalam bahasa Indonesia tidak menambahkan pelaku yang tidak disebut dalam klausa ini.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: bagi umat Israel
  rationale: בְּנֵי יִשְׂרָאֵל adalah sebutan kolektif bagi bangsa Israel. 'Umat Israel' terdengar alami, bermartabat, dan mencakup seluruh komunitas yang dimaksud.
- source_word: מִכָּל חַטֹּאתָם
  choice: dari segala dosa mereka
  rationale: Terjemahan 'dari' mempertahankan nuansa sumber atau pembersihan yang dapat dibawa oleh מִן, sambil tetap terbaca wajar dalam hubungan dengan pendamaian.
- source_word: אַחַת בַּשָּׁנָה
  choice: sekali setahun
  rationale: Ini adalah padanan idiomatis dan tepat untuk pelaksanaan tahunan.
- source_word: וַיַּעַשׂ
  choice: Ia melaksanakannya
  rationale: Verba tunggal maskulin memiliki subjek tersirat. Kata ganti 'ia' mempertahankan ketidaktersuratan nama pelaku, sedangkan 'melaksanakannya' sesuai dengan konteks pelaksanaan perintah.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: seperti yang diperintahkan Yahweh kepada Musa
  rationale: Mengikuti susunan naratif Ibrani dan menerjemahkan nama ilahi יהוה sebagai 'Yahweh' tanpa menggantinya dengan gelar.
theological_decisions:
- issue: Makna ritual כפר
  choice: pendamaian harus diadakan
  alternative: penghapusan atau penyucian harus dilakukan
  rationale: '''Pendamaian'' mempertahankan istilah teologis utama dalam Imamat, sedangkan catatan kaki menjaga nuansa pembersihan dari dosa yang hadir dalam konstruksi ini.'
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' membedakannya dari gelar umum.
- issue: Subjek tersirat וַיַּעַשׂ
  choice: Ia melaksanakannya
  alternative: Harun melaksanakannya
  rationale: Konteks paling mungkin menunjuk kepada Harun, tetapi ayat ini sendiri tidak menyebut namanya. Kata ganti mempertahankan ketidaktersuratan itu.
- issue: Cakupan עוֹלָם dalam ketetapan hukum
  choice: untuk selamanya
  alternative: turun-temurun
  rationale: Terjemahan utama mempertahankan kekuatan duratif עוֹלָם tanpa menentukan terlebih dahulu bagaimana keberlangsungannya dipahami secara teologis.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. 'Umat Israel' dipilih sebagai sebutan kolektif yang alami; 'ia' sengaja dipertahankan agar nama pelaku tidak ditambahkan. Tanda baca titik dua memperjelas bahwa isi ketetapan adalah pelaksanaan pendamaian tahunan.
