    rationale: Alternatif ini kurang jelas sebagai padanan konstruksi מִכָּל חַטֹּאתָם. Alternatif “karena segala dosa mereka” lebih idiomatis untuk nuansa kausal, sementara teks utama tetap menyatakan nuansa pembersihan dengan “dari.”
