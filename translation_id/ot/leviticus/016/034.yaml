- from: 'Hal ini harus menjadi ketetapan untuk selamanya[a] bagi kalian: pendamaian harus diadakan bagi umat Israel dari segala dosa mereka[b], sekali setahun. Ia melaksanakannya seperti yang diperintahkan Yahweh kepada Musa.'
