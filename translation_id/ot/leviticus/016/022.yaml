base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: id
  text: Kambing jantan itu akan membawa segala kesalahan mereka pada dirinya sendiri ke suatu negeri yang terpisah[a], lalu ia akan mengirimkan kambing jantan itu ke padang gurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “negeri terpencil”, “negeri yang tak terjangkau”, atau “negeri tandus”. Kata Ibrani yang dipakai kemungkinan menunjuk pada tempat yang terpisah atau terasing dari permukiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: akan membawa
  rationale: נשא berarti membawa atau menanggung. 'Membawa' mempertahankan gambaran konkret bahwa kambing itu mengangkut kesalahan umat ke tempat lain.
- source_word: הַשָּׂעִיר
  choice: kambing jantan itu
  rationale: שָׂעִיר menunjuk pada kambing, khususnya kambing jantan; penyebutan jenis kelamin ini wajar dan tepat dalam konteks ritual.
- source_word: עָלָיו
  choice: pada dirinya
  rationale: Frasa ini menyatakan bahwa segala kesalahan tersebut berada pada kambing itu sendiri, sehingga unsur pemindahan simbolis tetap jelas.
- source_word: כָּל עֲוֺנֹתָם
  choice: segala kesalahan mereka
  rationale: עָוֹן dapat mencakup kejahatan, kesalahan, serta akibat kesalahan. 'Kesalahan' menjaga bobot moralnya tanpa mempersempitnya hanya menjadi hukuman atau rasa bersalah.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: ke suatu negeri yang terpisah
  rationale: גְּזֵרָה berkaitan dengan sesuatu yang terpotong atau terpisah. Ungkapan ini dekat dengan citra Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: וְשִׁלַּח
  choice: lalu orang itu harus melepaskan
  rationale: שׁלח dalam konteks ini berarti menyuruh pergi atau melepaskan. Subjeknya adalah orang yang disebut dalam ayat sebelumnya; 'orang itu' mencegah kesan bahwa kambing tersebut bertindak sendiri.
- source_word: בַּמִּדְבָּר
  choice: ke padang gurun
  rationale: מִדְבָּר menunjuk pada daerah liar, tandus, atau gurun. 'Padang gurun' merupakan ungkapan Indonesia yang alami dalam konteks ini.
theological_decisions:
- issue: Gambaran kambing yang menanggung kesalahan umat
  choice: Mempertahankan bahasa konkret bahwa kambing itu membawa segala kesalahan pada dirinya.
  alternative: Memparafrasakan sebagai 'menghapus dosa mereka' atau 'membawa pergi dosa mereka'.
  rationale: Teks Ibrani menggambarkan pemindahan dan pembuangan kesalahan secara ritual. Terjemahan konkret mempertahankan simbolisme itu tanpa memasukkan kesimpulan teologis yang tidak dinyatakan langsung oleh ayat.
- issue: Makna אֶרֶץ גְּזֵרָה
  choice: suatu negeri yang terpisah
  alternative: negeri terpencil; negeri yang tak terjangkau; negeri tandus
  rationale: Istilah Ibrani ini jarang dan maknanya tidak sepenuhnya pasti. Teks utama mempertahankan gagasan keterpisahan, sedangkan kemungkinan nuansa lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Struktur ayat mempertahankan urutan tindakan dalam bahasa Ibrani. 'Negeri yang terpisah' sengaja mempertahankan ambiguitas leksikal, dengan alternatif diberikan dalam catatan kaki.
