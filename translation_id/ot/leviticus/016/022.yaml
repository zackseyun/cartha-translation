  source_fidelity: Teks sumber menyatakan bahwa kambing jantan itu akan membawa/menanggung segala kesalahan mereka "pada dirinya" menuju suatu אֶרֶץ גְּזֵרָה, lalu seorang pelaksana yang telah disebut sebelumnya akan mengirimkannya ke padang gurun. Draf mempertahankan unsur-unsur ini, tetapi "harus melepaskan" mengubah bentuk imperfect/futural Ibrani menjadi kewajiban normatif dan kurang tegas menyampaikan tindakan pengiriman pergi.
  naturalness: '"Membawa pada dirinya" terasa kurang idiomatis dalam bahasa Indonesia modern. Susunan "membawa segala kesalahan mereka pada dirinya sendiri" lebih jelas dan alami, sambil tetap mempertahankan citra konkret teks. "Lalu ia akan mengirimkan ... ke padang gurun" juga lebih lancar daripada "orang itu harus melepaskan".'
  terminology: '"Kambing jantan," "segala kesalahan mereka," dan "padang gurun" sesuai dengan konteks dan register. "Suatu negeri yang terpisah" dapat dipertahankan sebagai padanan yang berhati-hati bagi istilah Ibrani yang sulit, dengan alternatif leksikal dalam catatan kaki. Kata "dirinya sendiri" membantu menyatakan referensi pronomina maskulin tunggal kepada kambing tanpa memberi tafsiran teologis tambahan.'
