revisions:
- from: Kambing jantan itu akan membawa pada dirinya segala kesalahan mereka ke suatu negeri yang terpisah[a], lalu orang itu harus melepaskan kambing jantan itu ke padang gurun.
  to: Kambing jantan itu akan membawa segala kesalahan mereka pada dirinya sendiri ke suatu negeri yang terpisah[a], lalu ia akan mengirimkan kambing jantan itu ke padang gurun.
  rationale: Revisi ini mempertahankan urutan, gambaran ritual, dan ketidakpastian leksikal dalam teks Ibrani. Bentuk masa depan dipulihkan pada tindakan kedua, dan kata kerja "mengirimkan" menyampaikan tindakan mengirim pergi ke padang gurun. Rujukan "ia" mengikuti pelaksana yang telah diperkenalkan dalam konteks langsung sebelumnya, sebagaimana pronomina tersirat dalam bahasa Ibrani.
