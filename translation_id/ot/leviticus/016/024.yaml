source:
  edition: WLC
  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: id
  text: Ia harus membasuh tubuhnya dengan air di suatu tempat kudus[a], mengenakan pakaiannya, lalu keluar dan mempersembahkan kurban bakarannya serta kurban bakaran umat itu, dan mengadakan pendamaian[b] bagi dirinya sendiri dan bagi umat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini tidak harus menunjuk pada ruang khusus yang disebut Tempat Kudus.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengadakan penghapusan dosa”; dalam beberapa konteks ritual, kata Ibrani ini juga dapat berarti “mengadakan pentahiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ
  choice: Ia harus membasuh tubuhnya
  rationale: Rangkaian verba dalam ketentuan ritual ini menyatakan prosedur yang wajib dilakukan. בשר secara harfiah berarti 'daging', tetapi dalam konteks pembasuhan menunjuk pada tubuh jasmani; 'tubuhnya' alami dan tidak menimbulkan konotasi teologis yang tidak dimaksudkan.
- source_word: בַמַּיִם
  choice: dengan air
  rationale: Dalam bahasa Indonesia, 'membasuh ... dengan air' merupakan ungkapan instrumental yang wajar.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: di suatu tempat kudus
  rationale: מקום tidak memakai kata sandang, sehingga frasa ini tidak seharusnya dipersempit menjadi nama ruang teknis 'Tempat Kudus'. Kata 'suatu' mempertahankan sifat tak tentu frasa Ibrani.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: mengenakan pakaiannya
  rationale: Pilihan ini alami dalam bahasa Indonesia modern dan tetap sesuai dengan ragam ritual yang bermartabat.
- source_word: וְיָצָא
  choice: lalu keluar
  rationale: Menunjukkan gerak keluar dari tempat pembasuhan sekaligus kelanjutan urutan prosedural.
- source_word: וְעָשָׂה אֶת־עֹלָתוֹ וְאֶת־עֹלַת הָעָם
  choice: mempersembahkan kurban bakarannya serta kurban bakaran umat itu
  rationale: Dengan עֹלָה sebagai objek, עשה secara kontekstual berarti melaksanakan atau mempersembahkan kurban. 'Kurban bakaran' adalah istilah Indonesia yang jelas untuk persembahan yang dibakar seluruhnya.
- source_word: וְכִפֶּר
  choice: mengadakan pendamaian
  rationale: Pilihan ini mempertahankan istilah luas dalam tata kurban tanpa menetapkan satu teori khusus; nuansa penghapusan atau pentahiran ritual dicatat dalam catatan kaki.
- source_word: בַעֲדוֹ וּבְעַד הָעָם
  choice: bagi dirinya sendiri dan bagi umat itu
  rationale: Kata 'bagi' menyampaikan tindakan perwakilan demi imam dan umat secara ringkas serta alami.
theological_decisions:
- issue: Makna כפר dalam ketentuan kurban Imamat
  choice: mengadakan pendamaian
  alternative: mengadakan penghapusan dosa; melakukan pentahiran ritual
  rationale: Istilah 'pendamaian' mempertahankan cakupan teologis tradisional tanpa membatasi verba ini pada satu mekanisme tertentu. Karena כפר dalam konteks ritual juga dapat menonjolkan penghapusan atau pentahiran, kemungkinan tersebut dipertahankan dalam catatan kaki.
- issue: Identifikasi בְּמָקוֹם קָדוֹשׁ
  choice: suatu tempat kudus
  alternative: Tempat Kudus
  rationale: Teks Ibrani tidak memakai kata sandang pada מקום. Karena itu terjemahan tidak mengidentifikasinya secara pasti dengan ruang khusus bernama Tempat Kudus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti urutan tindakan ritual dalam teks Ibrani. 'Umat itu' dipakai untuk העם agar kelompok yang telah disebut dalam konteks tetap tertentu. Semua penanda catatan kaki muncul dalam teks utama.
