  terminology: “Kurban penghapus dosa” merupakan istilah yang mapan dan sesuai bagi חַטָּאת dalam konteks ini. Catatan kaki dengan baik memelihara alternatif leksikal “kurban pemurnian.” “Seisi rumahnya” secara idiomatis menyampaikan cakupan בֵּיתוֹ sebagai rumah tangga/keluarga, bukan bangunan.
