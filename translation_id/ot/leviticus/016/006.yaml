  source_fidelity: Teks secara akurat mencerminkan Ibrani. “Harun harus mempersembahkan” menyampaikan וְהִקְרִיב dalam bentuk instruksi ritual; “sapi jantan sebagai kurban penghapus dosa” merepresentasikan פַּר הַחַטָּאת; dan “yang diperuntukkan baginya sendiri” dengan tepat membedakan kurban Harun (אֲשֶׁר לוֹ) dari kurban umat. Klausa terakhir secara utuh menerjemahkan וְכִפֶּר בַּעֲדוֹ וּבְעַד בֵּיתוֹ.
