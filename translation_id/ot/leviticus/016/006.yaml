id: LEV.16.6
reference: Leviticus 16:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: id
  text: Harun harus mempersembahkan sapi jantan sebagai kurban penghapus dosa yang diperuntukkan baginya sendiri[a], lalu mengadakan pendamaian bagi dirinya dan seisi rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sapi jantan sebagai kurban pemurnian yang diperuntukkan baginya sendiri.” Istilah Ibrani חַטָּאת dapat berarti kurban penghapus dosa dan, dalam beberapa konteks, menekankan pemurnian ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: harus mempersembahkan
  rationale: Dalam konteks kurban, bentuk kausatif dari קרב berarti membawa atau menghadirkan kurban ke hadapan TUHAN. 'Mempersembahkan' merupakan ungkapan ritual yang wajar dalam bahasa Indonesia, tanpa menyatakan bahwa seluruh proses penyembelihan telah selesai.
- source_word: פַּר
  choice: sapi jantan
  rationale: פַּר menunjuk pada sapi jantan sebagai hewan kurban. Padanan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam peraturan kurban, חַטָּאת menunjuk pada jenis kurban, bukan sekadar dosa sebagai konsep abstrak. Padanan tradisional dan mudah dipahami ini dipakai dalam teks, sementara nuansa pemurnian dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לוֹ
  choice: yang diperuntukkan baginya sendiri
  rationale: Frasa ini mengidentifikasi sapi tersebut sebagai kurban bagi Harun sendiri, berbeda dari kurban bagi umat dalam konteks sekitarnya. Pilihan ini mempertahankan fungsi ritual tanpa menyempitkannya menjadi sekadar kepemilikan.
- source_word: וְכִפֶּר
  choice: lalu mengadakan pendamaian
  rationale: כפר dalam konteks keimaman menyatakan tindakan ritual untuk mengadakan pendamaian. Padanan ini mempertahankan bobot kultis-teologisnya tanpa menentukan mekanisme lebih jauh daripada teks Ibrani.
- source_word: בַּעֲדוֹ
  choice: bagi dirinya
  rationale: בְּעַד dengan sufiks menyatakan tindakan demi atau bagi seseorang. 'Bagi dirinya' ringkas dan alami.
- source_word: וּבְעַד בֵּיתוֹ
  choice: dan seisi rumahnya
  rationale: בַּיִת di sini menunjuk pada rumah tangga atau keluarga Harun, bukan bangunan. 'Seisi rumahnya' merupakan ungkapan Indonesia yang alami untuk kelompok rumah tangga tersebut.
theological_decisions:
- issue: Pemaknaan חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Konteks langsung menunjukkan bahwa nomina ini adalah nama suatu kurban. 'Kurban penghapus dosa' mudah dikenali pembaca Indonesia, sedangkan kemungkinan penekanan pada pemurnian ritual dipertahankan dalam catatan kaki.
- issue: Cakupan בֵּיתוֹ
  choice: seisi rumahnya
  alternative: rumahnya
  rationale: Kata Ibrani ini kemungkinan besar menunjuk pada keluarga atau rumah tangga Harun, bukan tempat tinggal fisiknya. Pilihan ini menyampaikan cakupan personal-kolektif tanpa memasukkan kesimpulan doktrinal tambahan.
- issue: Fungsi אֲשֶׁר לוֹ
  choice: yang diperuntukkan baginya sendiri
  alternative: miliknya
  rationale: Dalam urutan ritual, frasa tersebut terutama membedakan kurban Harun dari kurban umat. Terjemahan fungsional ini lebih jelas daripada ungkapan kepemilikan semata, tetapi tetap tidak menentukan siapa yang menyediakan hewan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur prosedural dipertahankan dengan 'harus' dan 'lalu'. Istilah ritual dibuat konsisten serta mudah dipahami, sementara ambiguitas antara penghapusan dosa dan pemurnian dijaga melalui catatan kaki.
