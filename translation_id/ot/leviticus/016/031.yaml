  naturalness: Teks revisi memakai sapaan jamak yang konsisten ("kalian") dan menghindari pergeseran yang kurang alami antara "bagimu/dirimu" tunggal dan subjek Ibrani jamak. Susunannya tetap baku, jelas, dan sesuai register hukum-kultis.
