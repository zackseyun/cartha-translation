base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: id
  text: Hari itu adalah Sabat, hari istirahat penuh bagi kalian, dan kalian harus merendahkan diri[a]; itulah ketetapan untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyusahkan diri”; secara tradisional dipahami mencakup puasa dan penyangkalan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabat, hari istirahat penuh
  rationale: Mempertahankan istilah teologis-kultis “Sabat” dan menyampaikan daya intensif rangkaian Ibrani dengan frasa Indonesia yang alami.
- source_word: הִיא לָכֶם
  choice: Hari itu harus menjadi ... bagimu
  rationale: Kata ganti feminin tunggal merujuk pada hari yang sedang dibicarakan; bentuk ini menyampaikan kewajiban normatif dalam konteks hukum.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: kamu harus merendahkan dirimu
  rationale: Ungkapan Ibrani secara harfiah memakai verba yang dapat berarti menindas atau merendahkan bersama nefesy, tetapi di sini berfungsi sebagai ungkapan refleksif tentang penyangkalan atau perendahan diri. Terjemahan ini tidak mempersempitnya menjadi puasa.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan untuk selama-lamanya
  rationale: Menyampaikan rumusan hukum tentang keberlakuan yang terus-menerus secara jelas dan bermartabat, tanpa melemahkan עוֹלָם menjadi sekadar “tetap”.
theological_decisions:
- issue: Makna perintah merendahkan diri pada Hari Pendamaian
  choice: merendahkan dirimu
  alternative: menyusahkan dirimu; berpuasa
  rationale: Teks Ibrani memakai ungkapan yang lebih luas daripada kata kerja khusus untuk berpuasa. Terjemahan utama mempertahankan keluasan itu, sedangkan kemungkinan arti yang lebih harfiah dan pemahaman tradisional dicatat dalam catatan kaki.
- issue: Daya waktu חֻקַּת עוֹלָם
  choice: ketetapan untuk selama-lamanya
  alternative: ketetapan tetap; ketetapan abadi
  rationale: Pilihan ini menjaga kekuatan formula hukum Ibrani tanpa menetapkan teori teologis tertentu tentang cara keberlakuannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-kultis yang khidmat. “Bagimu” dan “dirimu” dipakai sebagai bentuk tunggal kolektif yang mewakili sapaan jamak Ibrani kepada umat; dalam bahasa Indonesia bentuk ini tetap alami dan tidak membatasi perintah kepada satu orang.
