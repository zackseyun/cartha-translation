  source_fidelity: 'Terjemahan pada dasarnya setia kepada teks Ibrani: larangan akses tanpa batas waktu, lokasi di balik tirai di hadapan כַּפֹּרֶת, konsekuensi kematian, dan penampakan ilahi dalam awan semuanya terpelihara. Penambahan preposisi «pada» diperlukan agar keterangan waktu dalam bahasa Indonesia jelas dan alami.'
  naturalness: Bahasa baku dan register khidmatnya baik. «Tidak masuk pada sembarang waktu» lebih idiomatis daripada «tidak masuk sembarang waktu». Susunan «ke Tempat Kudus, ke balik tirai» dengan tepat menyatakan ruang di sisi dalam tirai.
  terminology: «Yahweh», «Harun», «tabut», dan «tutup pendamaian» konsisten dan tepat. Catatan kaki semula tidak tepat menyebut «takhta pendamaian» sebagai padanan tradisional Indonesia; istilah itu lebih merupakan alternatif yang dipengaruhi istilah Inggris ‘mercy seat’. Catatan direvisi agar tidak membuat klaim tradisi yang tidak akurat.
