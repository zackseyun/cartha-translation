source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: id
  text: Yahweh berfirman kepada Musa, “Katakanlah kepada Harun, saudaramu, agar ia tidak masuk pada sembarang waktu ke Tempat Kudus, ke balik tirai, menghadap tutup pendamaian[a] yang berada di atas tabut, supaya ia tidak mati, sebab Aku akan menampakkan diri dalam awan di atas tutup pendamaian itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “takhta pendamaian”; padanan ini mengikuti istilah Inggris tradisional ‘mercy seat.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dan tidak menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: Katakanlah kepada Harun, saudaramu
  rationale: Menyampaikan daya imperatif secara wajar dalam bahasa Indonesia serta mempertahankan keterangan hubungan persaudaraan yang eksplisit.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: agar ia tidak masuk sembarang waktu
  rationale: Negasi ini merupakan larangan, sedangkan frasa waktunya menunjuk pada akses yang tidak dibatasi, bukan pada tindakan masuk terus-menerus.
- source_word: הַקֹּדֶשׁ
  choice: Tempat Kudus
  rationale: Dalam konteks ini istilah tersebut menunjuk pada ruang suci di balik tirai; bentuk ini jelas dan lazim dalam konteks Kemah Suci.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: ke balik tirai
  rationale: Menggambarkan tujuan masuk sebagai ruang pada sisi dalam tirai secara alami dalam bahasa Indonesia.
- source_word: אֶל פְּנֵי הַכַּפֹּרֶת
  choice: menghadap tutup pendamaian
  rationale: פני menyatakan posisi di hadapan atau bagian depan objek; 'menghadap' menyampaikan hubungan ruang itu dengan lancar.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Menunjukkan bahwa benda tersebut adalah penutup tabut sekaligus mempertahankan kaitannya dengan ritual pendamaian.
- source_word: הָאָרֹן
  choice: tabut
  rationale: Teks hanya menyebut 'tabut', tanpa menambahkan keterangan 'perjanjian'.
- source_word: וְלֹא יָמוּת
  choice: supaya ia tidak mati
  rationale: Mempertahankan akibat yang hendak dihindari tanpa memakai ungkapan Indonesia yang arkais.
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: sebab Aku akan menampakkan diri dalam awan
  rationale: כִּי memberikan alasan bagi larangan, dan bentuk nifal אֵרָאֶה menyatakan bahwa Allah menampakkan diri atau terlihat dalam awan.
theological_decisions:
- issue: Makna כַּפֹּרֶת dalam tata ibadah Kemah Suci
  choice: tutup pendamaian
  alternative: takhta pendamaian
  rationale: Pilihan utama mempertahankan bentuk konkretnya sebagai penutup tabut dan hubungan teologisnya dengan pendamaian. Padanan tradisional dicatat tanpa menjadikan benda itu semata-mata sebuah tempat duduk.
- issue: Cakupan larangan בְּכָל עֵת
  choice: larangan masuk pada sembarang waktu
  alternative: tidak masuk setiap waktu
  rationale: Konteks menetapkan pembatasan akses ke ruang terdalam, bukan menyatakan bahwa Harun biasa masuk terus-menerus.
- issue: Relasi awan dengan penampakan ilahi
  choice: Aku akan menampakkan diri dalam awan di atas tutup pendamaian
  alternative: Aku tampak dalam awan di atas tutup pendamaian
  rationale: Bentuk verbal dapat diterjemahkan sebagai penampakan ilahi; formulasi ini mempertahankan kaitan antara kehadiran Allah, awan, dan lokasi di atas tutup tanpa menjelaskan sifat penampakan lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. 'Sembarang waktu' dipakai untuk akses yang tidak diperkenankan sesuka hati; istilah ritual dijelaskan secara transparan tanpa menghilangkan bobot teologisnya.
