id: LEV.16.33
reference: Leviticus 16:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: id
  text: Dengan demikian, ia harus mengadakan pendamaian[a] bagi Tempat Kudus, Kemah Pertemuan, dan mazbah; ia juga harus mengadakan pendamaian bagi para imam dan seluruh umat jemaah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mengadakan penghapusan kenajisan"; dalam konteks ritual ini, kata Ibrani כפר dapat menekankan penghapusan kenajisan sekaligus pendamaian.
    reason: lexical_alternative
  - marker: b
    text: '"Seluruh umat jemaah itu" dapat juga diterjemahkan "seluruh umat perhimpunan itu."'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: mengadakan pendamaian
  rationale: Kata kerja כפר dipakai berulang sebagai istilah ritual. Ungkapan ini mempertahankan cakupan maknanya tanpa membatasinya pada satu teori pendamaian; dalam konteks benda-benda kudus, tindakan itu juga mencakup penghapusan kenajisan.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: Tempat Kudus
  rationale: Dalam konteks Hari Pendamaian, frasa ini menunjuk pada ruang kudus dalam tempat suci. 'Tempat Kudus' alami dalam bahasa Indonesia dan tidak mempersempit rujukannya secara tidak perlu menjadi 'Tempat Mahakudus'.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan langsung dan lazim yang mempertahankan gambaran kemah serta fungsinya sebagai tempat pertemuan.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dan ringkas dalam bahasa Indonesia untuk tempat persembahan korban, sesuai dengan konteks ritual.
- source_word: עַל
  choice: bagi
  rationale: Bersama כפר, preposisi ini secara alami menyatakan pihak yang baginya pendamaian diadakan.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk bentuk jamak yang menunjuk para pelayan keimaman.
- source_word: כָּל עַם הַקָּהָל
  choice: seluruh umat dalam perhimpunan itu
  rationale: Ungkapan ini mempertahankan unsur 'seluruh umat' dan identitas mereka sebagai komunitas yang berhimpun, sambil tetap alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Bahasa pendamaian diterapkan baik kepada benda-benda kudus maupun kepada manusia
  choice: Memakai ungkapan yang sama, 'mengadakan pendamaian bagi', untuk Tempat Kudus, Kemah Pertemuan, mazbah, para imam, dan umat.
  alternative: Memakai 'menyucikan' atau 'menghapus kenajisan dari' untuk benda-benda kudus, tetapi 'mengadakan pendamaian bagi' untuk manusia.
  rationale: Bahasa Ibrani sengaja mengulang kata kerja כפר bagi seluruh rangkaian objek dan pihak. Keseragaman terjemahan menjaga kesatuan ritual ayat ini, sedangkan catatan kaki menjelaskan bahwa penghapusan kenajisan termasuk dalam cakupan maknanya.
- issue: Identifikasi מִקְדַּשׁ הַקֹּדֶשׁ
  choice: Tempat Kudus
  alternative: Tempat Mahakudus
  rationale: Teks menyebut tempat suci secara khusus, tetapi bentuk Ibraninya di sini tidak mengharuskan terjemahan yang lebih sempit 'Tempat Mahakudus'. Pilihan ini mempertahankan ketegangan rujukan tanpa mengunci penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan verba dipertahankan pada dua bagian utama untuk mencerminkan struktur Ibrani, tetapi daftar tiga benda kudus diringkas secara alami. Kapitalisasi 'Tempat Kudus' dan 'Kemah Pertemuan' menandai sebutan khusus; 'mazbah' dipakai sebagai istilah kultis yang sudah mapan.
