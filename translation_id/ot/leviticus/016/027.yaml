  source_fidelity: 'Makna pokok telah diterjemahkan dengan tepat: kedua hewan kurban, darahnya dibawa masuk untuk mengadakan pendamaian di tempat kudus, dibawa ke luar perkemahan, lalu kulit, daging, dan kotorannya dibakar. Namun, “dibakar habis” menambahkan nuansa pemusnahan total yang tidak dinyatakan secara eksplisit oleh verba Ibrani שׂרף (“membakar”). Bentuk pasif juga mengaburkan peralihan eksplisit dari verba tunggal ke verba jamak.'
