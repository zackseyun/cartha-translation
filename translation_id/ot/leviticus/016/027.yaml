base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: id
  text: Lembu jantan untuk kurban penghapus dosa dan kambing jantan untuk kurban penghapus dosa, yang darah keduanya telah dibawa masuk untuk mengadakan pendamaian di tempat kudus, harus dibawanya ke luar perkemahan. Mereka harus membakar[a] kulit, daging, dan kotoran keduanya dalam api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani beralih dari bentuk tunggal pada “harus dibawanya” ke bentuk jamak pada “mereka harus membakar.”
    reason: Menjelaskan peralihan jumlah pelaku yang nyata dalam bahasa Ibrani tanpa mengidentifikasi para pelaku secara spekulatif.
lexical_decisions:
- source_word: פַּר הַחַטָּאת
  choice: lembu jantan untuk kurban penghapus dosa
  rationale: Menyatakan jenis hewan dan fungsi ritual חטאת secara jelas dalam bahasa Indonesia modern.
- source_word: שְׂעִיר הַחַטָּאת
  choice: kambing jantan untuk kurban penghapus dosa
  rationale: שְׂעִיר menunjuk kambing jantan; susunan ini sejajar dengan sebutan lembu sebelumnya.
- source_word: הוּבָא אֶת־דָּמָם
  choice: yang darah keduanya telah dibawa masuk
  rationale: Bentuk pasif dipertahankan, sedangkan 'masuk' menyampaikan arah menuju ruang kudus yang tersirat oleh konteks.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Istilah ini mempertahankan fungsi ritual כפר tanpa mempersempitnya hanya menjadi pembersihan.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: הַקֹּדֶשׁ di sini menunjuk lokasi sakral; 'tempat kudus' jelas dan tidak memaksakan cakupan ruang yang lebih khusus.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: harus dibawanya ke luar perkemahan
  rationale: Bentuk aktif bersubjek orang ketiga tunggal tercermin dalam klitik '-nya', sementara 'ke luar' mempertahankan arah gerak secara alami.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: harus dibakar habis
  rationale: Bentuk pasif alami dalam bahasa Indonesia mengakomodasi subjek jamak yang tidak disebutkan; 'habis' menyampaikan pembakaran menyeluruh dalam konteks pemusnahan bangkai.
- source_word: עֹרֹתָם
  choice: kulit keduanya
  rationale: '''Kulit'' merupakan padanan alami untuk kulit hewan; ''keduanya'' memperjelas sufiks jamak yang mengacu pada dua hewan.'
- source_word: בְּשָׂרָם
  choice: daging keduanya
  rationale: '''Daging'' adalah padanan Indonesia yang alami bagi בשר dalam konteks tubuh hewan kurban.'
- source_word: פִּרְשָׁם
  choice: kotoran keduanya
  rationale: Istilah ini menunjuk kotoran atau isi buangan, bukan sekadar organ dalam; padanan dipilih agar tepat tanpa menjadi terlalu kasar.
theological_decisions:
- issue: Makna istilah kurban חטאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Pilihan ini memakai istilah ritual yang luas dipahami dan mempertahankan kaitannya dengan dosa, tanpa meniadakan fungsi pemurnian ritual yang dapat terkandung dalam istilah Ibrani.
- issue: Makna כפר dalam ritus Hari Pendamaian
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan; menyucikan
  rationale: Pendamaian mempertahankan keluasan istilah ritual dan teologis כפר tanpa menetapkan satu mekanisme doktrinal tertentu.
- issue: Peralihan verba tunggal יוֹצִיא ke verba jamak וְשָׂרְפוּ
  choice: peralihan ditandai melalui 'dibawanya' lalu bentuk pasif dengan pelaku tak disebutkan
  alternative: menyebut 'mereka harus membakar' secara eksplisit
  rationale: Bahasa sumber beralih dari pelaku tunggal ke jamak. Terjemahan utama mempertahankan perbedaan itu secara alami, dan catatan menjelaskan bentuk sumber tanpa menebak identitas para pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dipilih agar dapat dipahami pembaca umum. Bentuk 'dibawanya' mempertahankan pelaku tunggal, sedangkan kalimat pasif berikutnya menghindari penambahan identitas pelaku jamak yang tidak dinyatakan teks.
