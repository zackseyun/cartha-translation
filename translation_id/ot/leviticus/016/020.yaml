  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: id
  text: Setelah Harun selesai mengadakan pendamaian bagi tempat kudus[a], Kemah Pertemuan, dan mezbah[b], ia harus menghadapkan kambing jantan yang hidup itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat suci.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “mengadakan pendamaian” juga dapat dipahami sebagai melakukan pembersihan atau pentahiran ritual.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “mendekatkan”; maksudnya, menghadapkan kambing itu untuk tindakan ritual berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: Setelah Harun selesai mengadakan pendamaian
  rationale: Bentuk verba menyatakan selesainya tindakan sebelumnya dan urutan menuju tindakan berikutnya. Nama Harun dinyatakan dari konteks agar subjek alami dan jelas dalam bahasa Indonesia.
- source_word: כפר
  choice: mengadakan pendamaian
  rationale: Istilah ini mempertahankan bobot ritual-teologis kata Ibrani tanpa membatasi maknanya hanya pada pentahiran; kemungkinan nuansa pentahiran dijelaskan dalam catatan.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Padanan ini dekat dengan bentuk Ibrani dan sesuai dengan ruang sakral yang dimaksud; 'tempat suci' tetap merupakan kemungkinan leksikal.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan transparan untuk nama tempat ibadah tersebut.
- source_word: הַמִּזְבֵּחַ
  choice: mezbah
  rationale: Istilah Indonesia yang lazim dan tepat bagi sarana ritual ini.
- source_word: וְהִקְרִיב
  choice: ia harus mempersembahkan
  rationale: Dalam konteks ritual, verba yang secara harfiah berarti 'mendekatkan' menunjuk pada tindakan menghadapkan atau menyajikan hewan untuk tahap ritual selanjutnya.
- source_word: הַשָּׂעִיר הֶחָי
  choice: kambing jantan yang hidup
  rationale: Menunjukkan secara jelas kambing yang tetap hidup, sebagai pembeda dari kambing yang telah disembelih.
theological_decisions:
- issue: Makna כפר dalam konteks ritual korban
  choice: mengadakan pendamaian
  alternative: melakukan pentahiran ritual
  rationale: Pilihan utama mempertahankan istilah teologis yang luas dan tradisional, sedangkan catatan mengakui bahwa dalam konteks ini tindakannya juga dapat dipahami sebagai pembersihan atau pentahiran ritual.
- issue: Identifikasi הַקֹּדֶשׁ
  choice: tempat kudus
  alternative: tempat suci
  rationale: Keduanya dapat menunjuk ruang sakral; 'tempat kudus' lebih formal dan selaras dengan register kitab Imamat tanpa menentukan pembagian ruang secara lebih sempit daripada teks.
- issue: Sifat tindakan הקריב terhadap kambing hidup
  choice: mempersembahkan
  alternative: mendekatkan
  rationale: Pilihan utama menyampaikan tindakan presentasi ritual secara alami, tanpa menyiratkan bahwa kambing itu saat itu juga disembelih sebagai korban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan urutan ritual dalam teks Ibrani. Kapitalisasi 'Kemah Pertemuan' menandai nama khusus.
