  source_fidelity: 'Terjemahan pada dasarnya setia pada urutan dan unsur ritual teks Ibrani: pengambilan sebagian darah lembu jantan, pemercikan dengan jari pada tutup itu ke arah timur, lalu pemercikan tujuh kali di depannya. Namun, kata ganti “darah itu” pada tindakan kedua membuat rujukan partitif מִן־הַדָּם lebih jelas, dan penempatan keterangan arah dapat dibuat lebih langsung melekat pada lokasi pertama.'
  naturalness: Bahasanya modern dan jelas. “Pada bagian depan ... , ke arah timur” dapat dipahami, tetapi “pada bagian depan ... yang menghadap ke timur” lebih lancar sebagai satu kesatuan keterangan ruang. “Tujuh kali” lebih ringkas dan alami daripada “sebanyak tujuh kali” tanpa kehilangan makna.
  terminology: “Tutup pendamaian” merupakan padanan yang baik untuk kapporet dan menghindari gambaran “kursi” yang tidak tersurat. Catatan kaki perlu memberikan alternatif leksikal yang lebih langsung serta menjelaskan bahwa benda itu adalah tutup tabut, bukan mendefinisikannya sebagai “tempat pendamaian dilakukan.”
