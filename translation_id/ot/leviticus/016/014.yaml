  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: id
  text: Lalu ia harus mengambil sebagian darah lembu jantan itu dan memercikkannya dengan jarinya pada bagian depan tutup pendamaian[a] yang menghadap ke timur. Di depan tutup pendamaian itu ia harus memercikkan sebagian dari darah itu dengan jarinya tujuh kali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penutup pendamaian.” Kata Ibrani kapporet menunjuk pada tutup tabut yang berkaitan dengan ritus pendamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Lalu ia harus mengambil
  rationale: Bentuk verbal dalam rangkaian petunjuk ritual menyatakan tindakan yang diwajibkan berikutnya; “harus” menyampaikan daya preskriptifnya secara alami dalam bahasa Indonesia.
- source_word: מִדַּם הַפָּר
  choice: sebagian darah lembu jantan itu
  rationale: 'Preposisi מִן dipahami secara partitif: hanya sebagian dari darah lembu jantan tersebut yang diambil.'
- source_word: וְהִזָּה / יַזֶּה
  choice: memercikkannya / memercikkan
  rationale: Dalam konteks ritual imamat, נזה menunjuk pada pengenaan darah dengan cara memercik; pilihan ini jelas dan lazim dalam bahasa Indonesia.
- source_word: בְאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: Preposisi ב menandai alat atau sarana tindakan.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת
  choice: pada bagian depan tutup pendamaian
  rationale: פְּנֵי dapat berarti muka atau permukaan; bersama penunjuk arah “ke arah timur”, frasa ini paling wajar dipahami sebagai bagian depan yang menghadap ke timur, tanpa menghilangkan hubungan spasial dengan tutup itu.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada tutup tabut dan berkaitan dengan ritus pendamaian. “Tutup pendamaian” mempertahankan wujud bendanya sekaligus asosiasi kultisnya.
- source_word: קֵדְמָה
  choice: ke arah timur
  rationale: Adverbia arah ini menunjukkan orientasi menuju timur.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: Di depan tutup pendamaian itu
  rationale: לִפְנֵי menunjukkan lokasi di hadapan atau di depan benda tersebut dan membedakan pemercikan kedua dari pemercikan pada bagian depannya.
- source_word: שֶׁבַע פְּעָמִים
  choice: sebanyak tujuh kali
  rationale: Jumlah ritual dipertahankan secara eksplisit dan alami.
theological_decisions:
- issue: Padanan הַכַּפֹּרֶת
  choice: tutup pendamaian
  alternative: tutup tabut tempat pendamaian dilakukan; kursi belas kasihan
  rationale: Kata Ibrani menunjuk pada tutup tabut sebagai benda konkret sekaligus tempat yang terkait dengan pendamaian. Padanan utama menjaga kedua unsur tersebut tanpa mengimpor gambaran tentang kursi yang tidak dinyatakan oleh bentuk bendanya.
- issue: Hubungan עַל פְּנֵי dengan קֵדְמָה
  choice: pada bagian depan ... ke arah timur
  alternative: pada permukaan ... di sisi timur
  rationale: Susunan Ibrani dapat menggambarkan muka atau permukaan tutup yang menghadap ke timur. Terjemahan utama mempertahankan orientasi ruang tanpa menetapkan secara berlebihan apakah darah mengenai sisi tegak atau permukaan atas.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan khidmat. Struktur dua tindakan dipertahankan: pemercikan pada bagian depan tutup yang menghadap ke timur, lalu pemercikan tujuh kali di depannya. Penanda [a] dicantumkan tepat setelah istilah yang dijelaskan.'
