  rationale: 'Revisi mempertahankan seluruh unsur sumber: formula ketetapan berkelanjutan, penanggalan, idiom perendahan diri yang tidak dipersempit menjadi puasa, larangan total atas pekerjaan, dan cakupan bagi warga asli serta pendatang. Perubahan terutama menyasar kejelasan sintaksis dan kelaziman bahasa Indonesia modern.'
