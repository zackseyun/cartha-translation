  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: id
  text: 'Inilah yang akan menjadi ketetapan yang berlaku untuk selamanya bagimu: pada bulan ketujuh, pada hari kesepuluh bulan itu, rendahkanlah dirimu[a]. Baik warga asli maupun pendatang yang tinggal di tengah-tengahmu tidak boleh melakukan pekerjaan apa pun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “buatlah dirimu menderita.” Ungkapan ini secara tradisional dipahami mencakup puasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Inilah yang harus menjadi
  rationale: Dalam rumusan hukum ini, bentuk היה menunjuk kembali kepada ketentuan sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan isi baru.
- source_word: לְחֻקַּת עוֹלָם
  choice: ketetapan tetap
  rationale: חֻקָּה menunjuk pada ketentuan yang ditetapkan, sedangkan עוֹלָם menegaskan keberlakuannya yang terus-menerus. 'Ketetapan tetap' mempertahankan daya hukum tanpa memaksakan penjelasan tentang cakupan waktunya.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: pada bulan ketujuh
  rationale: חֹדֶשׁ dalam penanggalan ini berarti 'bulan'; preposisi diterjemahkan secara idiomatis sebagai 'pada'.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: pada hari kesepuluh bulan itu
  rationale: Ungkapan Ibrani secara harfiah berarti 'pada tanggal sepuluh bulan itu'; penyebutan 'hari' membuat tanggalnya jelas dan alami.
- source_word: תְּעַנּוּ אֶת נַפְשֹׁתֵיכֶם
  choice: kamu harus merendahkan dirimu
  rationale: Idiom dengan ענה piel dan נֶפֶשׁ menyatakan perendahan atau penyangkalan diri. Terjemahan ini mempertahankan cakupan makna yang lebih luas dan tidak membatasinya hanya pada puasa.
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: dan tidak boleh melakukan pekerjaan apa pun
  rationale: מְלָאכָה berarti pekerjaan atau kegiatan kerja. Susunan ini jelas, alami, dan mempertahankan larangan menyeluruh.
- source_word: הָאֶזְרָח
  choice: warga asli
  rationale: אֶזְרָח menunjuk pada anggota asli komunitas dan dikontraskan dengan pendatang yang menetap.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: pendatang yang tinggal di tengah-tengahmu
  rationale: גֵּר adalah orang luar yang menetap dalam masyarakat Israel. 'Pendatang yang tinggal' mempertahankan pengulangan akar kata dalam bahasa Ibrani sejauh wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna perintah penyangkalan diri dalam ketentuan Hari Pendamaian
  choice: merendahkan dirimu
  alternative: menyengsarakan dirimu; berpuasa
  rationale: Idiom Ibrani lebih luas daripada satu tindakan ritual tertentu. Walaupun secara tradisional dipahami mencakup puasa, teks utama tidak dipersempit menjadi perintah untuk berpuasa saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kamu' dipakai secara kolektif sesuai sapaan jamak Ibrani. Tanda pisah membantu memperjelas bahwa larangan tersebut berlaku bagi warga asli dan pendatang.
