  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: id
  text: Lalu Harun harus mempersembahkan kambing jantan yang mendapat undi bagi Yahweh[a] dan menjadikannya kurban penghapus dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kambing jantan yang atasnya undi bagi Yahweh muncul.”
    reason: Alternatif yang lebih harfiah untuk idiom Ibrani bahwa undi itu “naik/muncul” atas kambing tersebut.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: harus mempersembahkan
  rationale: Dalam konteks kurban, bentuk ini berarti membawa mendekat atau menghadapkan hewan untuk tindakan ritual. "Mempersembahkan" merupakan padanan Indonesia yang wajar di sini tanpa menyatakan bahwa penyembelihan sudah berlangsung.
- source_word: הַשָּׂעִיר
  choice: kambing jantan
  rationale: שָׂעִיר menunjuk pada kambing jantan; penyebutan jenis kelamin secara eksplisit mempertahankan ketepatan leksikal sumber.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: yang terkena undi
  rationale: Ungkapan Ibrani secara harfiah menggambarkan undi yang "naik/jatuh atas" kambing itu. "Terkena undi" menyampaikan penetapan melalui undian secara alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Prefiks ל menandai peruntukan atau penetapan, sedangkan nama ilahi יהוה dipertahankan sebagai "Yahweh".
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: dan menjadikannya kurban penghapus dosa
  rationale: Dalam peraturan kurban, חַטָּאת menunjuk pada jenis kurban untuk penanganan dosa dan kenajisan. "Kurban penghapus dosa" jelas dan lazim, sementara "menjadikannya" mempertahankan konstruksi עשה dengan sufiks objek.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton secara langsung. "Yahweh" mempertahankan nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian; kurban karena dosa
  rationale: Istilah ini dapat menyoroti penghapusan dosa maupun pemurnian dari kenajisan ritual. Padanan utama mengikuti istilah Indonesia yang mudah dipahami tanpa menghapus kemungkinan nuansa pemurnian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lugas untuk pembaca umum; istilah ritual dipertahankan tanpa penjelasan denominatif.
