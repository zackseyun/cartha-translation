reference: Leviticus 16:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: id
  text: Sebab pada hari ini pendamaian akan diadakan bagimu untuk menyucikan kamu.[a] Dari segala dosamu, kamu akan menjadi tahir di hadapan Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia akan mengadakan pendamaian bagimu.” Verba Ibraninya berbentuk tunggal, tetapi subjeknya tidak disebutkan secara eksplisit dalam klausa ini.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ketetapan sebelumnya; “Sebab” menyampaikan fungsi penjelasannya secara alami.
- source_word: בַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mempertahankan penunjukan waktu dan demonstratif Ibrani dalam konteks hari raya yang sedang ditetapkan.
- source_word: יְכַפֵּר
  choice: pendamaian akan diadakan
  rationale: Bentuk piel כפר adalah istilah kultis untuk mengadakan pendamaian. Konstruksi pasif dalam bahasa Indonesia tidak menambahkan subjek yang tidak dinyatakan dalam klausa Ibrani.
- source_word: עֲלֵיכֶם
  choice: bagimu
  rationale: Dengan כפר, preposisi על menandai orang yang menerima manfaat pendamaian; “bagimu” adalah padanan Indonesia yang wajar.
- source_word: לְטַהֵר אֶתְכֶם
  choice: untuk menyucikan kamu
  rationale: Infinitif ini menyatakan tujuan atau hasil pendamaian. “Menyucikan” dapat mencakup kemurnian ritual dan tetap mudah dipahami.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: dari segala dosamu
  rationale: Dalam konteks penyucian umat, חטאת menunjuk pada dosa-dosa mereka, bukan persembahan penghapus dosa.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti di hadapan atau dalam hadirat, sedangkan nama ilahi יהוה dipertahankan sebagai Yahweh.
- source_word: תִּטְהָרוּ
  choice: kamu akan menjadi tahir
  rationale: Qal menyatakan keadaan bersih yang dihasilkan, dibedakan dari tindakan piel sebelumnya, “menyucikan kamu.” “Tahir” sesuai dengan konteks kemurnian ritual.
theological_decisions:
- issue: Subjek verba יְכַפֵּר tidak dinyatakan secara eksplisit
  choice: pendamaian akan diadakan
  alternative: ia akan mengadakan pendamaian
  rationale: Bentuk verba Ibrani adalah orang ketiga tunggal, tetapi subjek klausa tidak disebutkan. Bentuk pasif mempertahankan ketidakjelasan itu tanpa menentukan apakah pelakunya imam besar atau pihak lain.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian yang tertulis dalam teks dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- issue: Makna kultis כפר
  choice: pendamaian
  alternative: penghapusan dosa
  rationale: “Pendamaian” mempertahankan cakupan istilah ritual tanpa membatasi ayat ini pada satu teori teologis tentang cara kerja pendamaian.
- issue: Hubungan antara tindakan penyucian dan keadaan tahir
  choice: menyucikan kamu ... kamu akan menjadi tahir
  alternative: mentahirkan kamu ... kamu akan ditahirkan
  rationale: Pilihan ini mempertahankan perbedaan aspek antara piel לְטַהֵר, tindakan membuat suci/tahir, dan qal תִּטְהָרוּ, keadaan tahir yang dihasilkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Pendamaian” mempertahankan istilah kultis; “tahir” menandai keadaan kemurnian ritual. Susunan menjadi dua kalimat memperjelas alur tanpa menghilangkan hubungan antara pendamaian, penyucian dari dosa, dan keadaan tahir di hadapan Yahweh.
