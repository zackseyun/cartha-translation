  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: id
  text: Yahweh berfirman kepada Musa sesudah kematian kedua anak Harun, yang mati ketika mereka mendekat ke hadapan Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dalam tindakan mereka mendekat ke hadapan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam formula naratif ketika Yahweh berbicara, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אַחֲרֵי מוֹת
  choice: sesudah kematian
  rationale: Frasa konstruksi ini secara idiomatis berarti “sesudah kematian”; bentuk tunggal memandang kematian kedua anak itu sebagai satu peristiwa.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: kedua anak Harun
  rationale: Padanan ini mempertahankan angka dan hubungan keluarga secara alami dalam bahasa Indonesia.
- source_word: בְּקָרְבָתָם
  choice: ketika mereka mendekat
  rationale: 'Preposisi ב dengan infinitif konstruksi dan sufiks orang ketiga jamak berfungsi secara temporal: “ketika mereka mendekat”.'
- source_word: לִפְנֵי יְהוָה
  choice: ke hadapan Yahweh
  rationale: Ungkapan ini mempertahankan nuansa arah dari tindakan mendekat sekaligus kehadiran kultis di hadapan Yahweh.
- source_word: וַיָּמֻתוּ
  choice: dan mati
  rationale: Padanan langsung ini mempertahankan kelanjutan naratif dan pengulangan tegas tentang kematian mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan antara tindakan mendekat dan kematian kedua anak Harun
  choice: ketika mereka mendekat ... dan mati
  alternative: karena mereka mendekat ... lalu mati
  rationale: Bahasa Ibrani menyatakan keadaan temporal tanpa penanda sebab yang eksplisit. Terjemahan tidak menambahkan hubungan sebab-akibat yang lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan pengulangan “kematian ... dan mati” yang terdapat dalam bahasa Ibrani, meskipun terasa padat, karena pengulangan itu membingkai waktu firman Yahweh dan mengingatkan kembali peristiwa tersebut.
