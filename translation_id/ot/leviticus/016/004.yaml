  source_fidelity: Revisi diperlukan terutama untuk memperjelas struktur dua klausa pertama dan untuk memperbaiki pernyataan tentang pakaian kudus. Teks Ibrani membedakan tunik yang dikenakan dari celana dalam yang harus ada langsung pada tubuhnya. Urutan pembasuhan kemudian pengenaan pakaian dipertahankan.
  naturalness: Draf umumnya memakai bahasa Indonesia baku dan jelas. Namun, “Semuanya itu pakaian kudus” tidak lengkap secara idiomatis; “Itu semua adalah pakaian kudus” lebih alami. Pengulangan verba pada klausa celana dalam juga membuat instruksi lebih jelas.
  terminology: “Tunik,” “celana dalam linen,” “ikat pinggang linen,” “serban linen,” dan “kudus” merupakan pilihan yang wajar dan setia bagi konteks pakaian imam. “Tunik kudus dari linen” lebih jelas cakupan atributnya daripada “baju panjang linen yang kudus.”
  issues:
