  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: id
  text: Ia harus mengenakan tunik kudus dari linen; celana dalam linen harus dikenakannya langsung pada tubuhnya. Ia harus mengikatkan ikat pinggang linen pada pinggangnya dan melilitkan serban linen pada kepalanya. Itu semua adalah pakaian kudus. Ia harus membasuh tubuhnya dengan air, lalu mengenakan semuanya itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada dagingnya” dan “membasuh dagingnya dengan air, lalu mengenakannya [pakaian-pakaian itu].”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: baju panjang linen yang kudus
  rationale: כְּתֹנֶת menunjuk pada pakaian berbentuk tunik atau baju panjang. 'Baju panjang' lebih mudah dipahami pembaca Indonesia masa kini daripada 'tunik' dan tidak menyiratkan mantel luar. קֹדֶשׁ dipertahankan sebagai 'kudus' dalam konteks ibadah.
- source_word: מִכְנְסֵי בַד
  choice: celana dalam linen
  rationale: Ungkapan ini menunjuk pada pakaian penutup tubuh bagian bawah yang dikenakan langsung pada kulit. 'Celana dalam' merupakan padanan Indonesia modern yang jelas; 'celana pendek' terlalu umum.
- source_word: עַל בְּשָׂרוֹ
  choice: langsung pada tubuhnya
  rationale: Secara harfiah berarti 'pada daging/tubuhnya'. Penambahan idiomatis 'langsung' menjelaskan bahwa pakaian tersebut dikenakan menempel pada tubuh tanpa membawa konotasi teologis lain dari kata 'daging'.
- source_word: אַבְנֵט בַּד
  choice: ikat pinggang linen
  rationale: אַבְנֵט adalah kain pengikat yang dililit atau diikatkan pada pinggang. 'Ikat pinggang' alami dalam bahasa Indonesia dan sesuai dengan pakaian keimaman.
- source_word: מִצְנֶפֶת בַּד
  choice: serban linen
  rationale: מִצְנֶפֶת adalah penutup kepala keimaman yang dililitkan. 'Serban' merupakan padanan khusus dan dikenal luas.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: pakaian kudus
  rationale: Padanan langsung yang mempertahankan sifat ritual pakaian itu sebagai sesuatu yang dikhususkan bagi pelayanan kudus.
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: Ia harus membasuh tubuhnya dengan air
  rationale: Terjemahan ini menyampaikan tindakan pembasuhan ritual secara alami. 'Tubuh' mewakili בָּשָׂר dalam konteks konkret ini tanpa nuansa tambahan yang dapat muncul dari 'daging'.
- source_word: וּלְבֵשָׁם
  choice: lalu mengenakan semuanya itu
  rationale: Pronomina jamak merujuk kembali kepada seluruh perangkat pakaian. 'Lalu' menyatakan urutan tindakan yang ditandai oleh rangkaian verba Ibrani tanpa menambahkan penjelasan ritual.
theological_decisions:
- issue: Sifat kekudusan pakaian
  choice: Pakaian disebut 'kudus' dalam arti dikhususkan bagi pelayanan ritual.
  alternative: pakaian suci
  rationale: Kata קֹדֶשׁ diterjemahkan tanpa menambahkan simbolisme atau penafsiran teologis yang tidak dinyatakan oleh ayat.
- issue: Makna בָּשָׂר dalam petunjuk ritual
  choice: tubuh
  alternative: daging
  rationale: Dalam kedua kemunculannya, kata itu menunjuk secara konkret pada tubuh Harun. 'Tubuh' menyampaikan maksud tersebut dengan jelas sambil menghindari konotasi teologis yang tidak relevan.
- issue: Urutan pembasuhan dan pengenaan pakaian
  choice: membasuh tubuhnya dengan air, lalu mengenakan semuanya itu
  alternative: membasuh tubuhnya dengan air dan mengenakan semuanya itu
  rationale: Rangkaian verbal menempatkan pembasuhan sebelum pengenaan pakaian. 'Lalu' membuat urutan itu jelas tanpa menjelaskan lebih jauh sifat atau makna ritualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah pakaian dipilih agar mudah dipahami pembaca umum sekaligus tetap konkret dalam konteks keimaman. Pronomina tunggal 'ia' mengikuti rujukan kepada imam besar dalam konteks terdekat.
