  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: id
  text: Ia harus meletakkan tangannya pada kepala persembahannya dan menyembelihnya di hadapan Kemah Pertemuan. Lalu putra-putra Harun harus menghamburkan darahnya ke seluruh sisi mezbah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melontarkan” atau “menghempaskan”. Kata kerja Ibrani ini menunjukkan darah dilemparkan dengan kuat dalam tindakan ritual, bukan dipercikkan dengan lembut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: harus menumpangkan
  rationale: Dalam konteks kurban, סמך dengan tangan pada kepala menunjuk pada tindakan ritual meletakkan atau menekan tangan. 'Menumpangkan' alami dalam bahasa Indonesia Alkitabiah dan tidak menambahkan tafsiran simbolis.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Nomina tunggal dengan sufiks orang ketiga maskulin tunggal dipertahankan sebagai bentuk tunggal.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Makna anatomis biasa dalam petunjuk persembahan.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן adalah sesuatu yang dibawa atau dipersembahkan kepada Allah; 'persembahan' mempertahankan cakupan maknanya tanpa mempersempitnya menjadi istilah lain.
- source_word: וְשָׁחַט
  choice: menyembelihnya
  rationale: שׁחט merupakan istilah teknis untuk menyembelih hewan kurban; 'menyembelih' tepat dan wajar dalam bahasa Indonesia modern.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ruang-kultis ini dapat berarti di depan atau di hadapan; pilihan ini ringkas dan mempertahankan nuansa kehadiran.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan Indonesia yang mapan dan akurat bagi sebutan tempat ibadah tersebut.
- source_word: וְזָרְקוּ
  choice: harus menyiramkan
  rationale: זרק menyatakan tindakan ritual melontarkan atau menghempaskan darah pada mezbah. 'Menyiramkan' menggambarkan penerapan darah secara nyata dan lebih kuat daripada 'memercikkan', sementara catatan kaki menjaga alternatif leksikalnya.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Menerjemahkan istilah kekerabatan maskulin secara langsung tanpa menggantinya dengan 'keturunan' atau 'para imam'.
- source_word: דָּמוֹ
  choice: darahnya
  rationale: Sufiks merujuk kepada hewan persembahan; bentuk '-nya' alami dan tidak memaksakan gender gramatikal dalam bahasa Indonesia.
- source_word: עַל הַמִּזְבֵּחַ
  choice: pada mezbah
  rationale: Dengan זרק, frasa ini menunjukkan darah diarahkan dan dikenakan pada mezbah; 'pada' tidak membatasi tindakan hanya pada bagian atas mezbah.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Menunjukkan bahwa tindakan terhadap darah dilakukan mengitari sisi-sisi mezbah.
theological_decisions:
- issue: Penumpangan tangan dalam konteks persembahan
  choice: Menyatakan tindakan itu sebagai 'menumpangkan tangannya' tanpa menjelaskan makna simbolisnya.
  alternative: Memakai rumusan tafsiran yang menyatakan pemindahan kesalahan atau identifikasi dengan korban.
  rationale: Ayat ini memerintahkan tindakan ritual, tetapi tidak menjelaskan teologinya; terjemahan tidak boleh menyelesaikan ketegangan tersebut secara diam-diam.
- issue: Istilah kekerabatan maskulin בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  alternative: keturunan Harun atau para imam Harun
  rationale: Teks Ibrani secara khusus menyebut anak-anak laki-laki Harun dalam konstruksi maskulin; padanan yang lebih luas akan mengaburkan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Modalitas yiqtol berurutan dalam petunjuk ritual diterjemahkan dengan 'harus'. Istilah kultis 'Kemah Pertemuan' dan 'mezbah' dipertahankan sebagai istilah baku. Penanda catatan kaki ditempatkan setelah klausa yang menjelaskan tindakan darah agar rujukannya jelas.
