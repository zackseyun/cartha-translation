  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah kultis utama dipertahankan tanpa gaya arkais; pembagian menjadi dua kalimat membantu keterbacaan tanpa mengubah urutan tindakan dalam teks Ibrani.
