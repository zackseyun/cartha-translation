  - severity: medium
    issue: Frasa "pada mezbah di sekelilingnya" berpotensi ambigu.
    rationale: Dalam bahasa Indonesia, "sekelilingnya" dapat dibaca sebagai keterangan tempat yang longgar atau merujuk secara tidak jelas. Teks Ibrani סָבִיב menegaskan pengaplikasian darah pada seluruh sisi/keliling mezbah.
