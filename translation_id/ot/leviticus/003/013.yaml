base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: id
  text: Ia harus meletakkan tangannya di atas kepala hewan itu dan menyembelihnya di depan Kemah Pertemuan. Kemudian anak-anak Harun harus menghamburkan[a] darahnya pada mezbah di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memercikkan” atau “melemparkan.” Kata Ibrani ini menggambarkan darah yang dilemparkan atau dikenakan pada mezbah dalam tata cara kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁוֹ
  choice: Ia harus meletakkan tangannya di atas kepala hewan itu
  rationale: Ungkapan Ibrani menyatakan tindakan orang yang mempersembahkan kurban dengan menaruh atau menekankan satu tangan pada kepala hewan. Bentuk tunggal ‘tangannya’ dipertahankan, sedangkan ‘hewan itu’ memperjelas acuan pronomina secara alami dalam bahasa Indonesia.
- source_word: וְשָׁחַט אֹתוֹ
  choice: dan menyembelihnya
  rationale: Kata שׁחט adalah istilah lazim untuk penyembelihan hewan kurban; ‘menyembelih’ mempertahankan nuansa ritual dengan bahasa Indonesia yang wajar.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: di depan Kemah Pertemuan
  rationale: Frasa ini menyatakan lokasi di hadapan atau di depan kemah peribadatan. ‘Kemah Pertemuan’ merupakan padanan formal, jelas, dan alami.
- source_word: וְזָרְקוּ
  choice: harus menyiramkan
  rationale: Dalam tata cara kurban, זרק menunjuk pada penerapan darah dengan gerakan melemparkan atau mengayunkannya ke mezbah. ‘Menyiramkan’ menyampaikan tindakan itu secara alami tanpa memberi kesan percikan halus yang dapat dikaitkan dengan verba Ibrani lain; catatan kaki mempertahankan keluasan maknanya.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Padanan ini mempertahankan bentuk jamak dan sebutan resmi bagi para pelaksana imam dalam teks.
- source_word: אֶת דָּמוֹ
  choice: darahnya
  rationale: Akhiran pronominal mengacu pada hewan kurban. Bentuk ‘darahnya’ ringkas dan alami dalam bahasa Indonesia.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pada mezbah di sekelilingnya
  rationale: Padanan ini menyatakan bahwa darah dikenakan pada mezbah di berbagai sisinya, bukan sekadar ditempatkan pada satu titik.
