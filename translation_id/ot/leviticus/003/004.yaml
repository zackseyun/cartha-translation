  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: id
  text: juga kedua ginjal dan lemak yang melekat padanya, yaitu yang ada di sekitar pinggang, serta umbai pada hati[a]; ia harus memisahkan umbai itu bersama kedua ginjal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “cuping pada hati.” Istilah Ibrani bagi bagian tubuh ini tidak pasti; “umbai” dipakai dalam teks untuk tidak menyatakan bentuknya secara terlalu pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Ungkapan ini secara langsung menunjuk pada dua ginjal sebagai organ tubuh dalam petunjuk kurban.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: lemak yang melekat padanya
  rationale: חֵלֶב menunjuk pada bagian lemak kurban, sedangkan עַל menyatakan letaknya pada ginjal; 'melekat padanya' alami secara anatomis tanpa mengubah acuannya.
- source_word: הַכְּסָלִים
  choice: sekitar pinggang
  rationale: Istilah ini menunjuk kawasan pinggang atau lambung tubuh; 'sekitar pinggang' jelas dalam bahasa Indonesia modern dan mempertahankan cakupan anatomisnya.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: umbai pada hati
  rationale: הַיֹּתֶרֶת adalah istilah anatomis yang sulit dan menunjuk bagian menonjol yang berkaitan dengan hati. 'Umbai' mempertahankan ketidakpastian bentuknya lebih baik daripada menyebutnya secara pasti sebagai cuping.
- source_word: עַל הַכְּלָיוֹת יְסִירֶנָּה
  choice: semuanya itu harus dipisahkan bersama ginjal
  rationale: Bentuk verba menyampaikan kewajiban ritual untuk memisahkan bagian tersebut. Frasa penutup dipahami secara prosedural, yakni pemisahan bagian hati bersama ginjal; 'semuanya itu' membuat rujukan tindakan jelas dalam bahasa Indonesia.
