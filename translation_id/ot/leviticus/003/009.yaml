  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: id
  text: 'Sebagai persembahan dengan api kepada Yahweh, dari kurban persekutuan[a] itu ia harus mempersembahkan lemaknya: seluruh ekor berlemak[b], yang harus diambilnya dekat tulang belakang[c], juga lemak yang menutupi isi perut dan seluruh lemak yang melekat pada isi perut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kurban keselamatan” atau “kurban kesejahteraan.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah ekor domba yang besar dan berlemak, yang dipersembahkan sebagai bagian dari kurban.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “berhadapan dengan tulang belakang” atau “pada pangkal tulang belakang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban persekutuan
  rationale: Istilah ini menunjuk pada kurban yang berkaitan dengan kesejahteraan, perdamaian, dan persekutuan. “Kurban persekutuan” menyampaikan fungsi komunalnya dengan wajar dalam bahasa Indonesia, sementara pilihan lain dicatat dalam catatan kaki.
- source_word: אִשֶּׁה
  choice: persembahan dengan api
  rationale: Istilah ini menunjukkan persembahan yang diserahkan di atas mazbah melalui api. Ungkapan ini mempertahankan unsur api tanpa menyiratkan bahwa seluruh kurban selalu dibakar habis.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה diterjemahkan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang hadir secara eksplisit dalam teks Ibrani.
- source_word: חֶלְבּוֹ
  choice: lemaknya
  rationale: Yang dimaksud ialah bagian-bagian lemak hewan yang ditetapkan untuk dipersembahkan.
- source_word: הָאַלְיָה תְמִימָה
  choice: seluruh ekor berlemak
  rationale: אַלְיָה menunjuk secara khusus pada ekor domba yang besar dan berlemak, sedangkan תְמִימָה menandakan bahwa ekor itu diambil utuh atau seluruhnya.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: dekat tulang belakang
  rationale: Frasa ini menyatakan lokasi pemotongan ekor dalam hubungannya dengan tulang belakang. Terjemahan ini alami secara anatomis, sementara ketidakpastian nuansanya dipertahankan dalam catatan kaki.
- source_word: יְסִירֶנָּה
  choice: yang harus dipotongnya
  rationale: Bentuk kausatif verba סור berarti menyingkirkan atau mengambil. Dalam konteks anatomis ini, “dipotongnya” dengan jelas menyampaikan tindakan melepaskan ekor dari tubuh.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: lemak yang menutupi isi perut
  rationale: קֶרֶב dalam konteks anatomi kurban mengacu pada organ-organ atau bagian dalam tubuh. “Isi perut” mudah dipahami dan sesuai dengan konteks.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: seluruh lemak yang melekat pada isi perut
  rationale: “Melekat pada” menyampaikan hubungan yang dinyatakan oleh עַל sekaligus membedakannya secara alami dari lemak yang “menutupi” isi perut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan membedakannya dari gelar “Tuhan”.
- issue: Makna זֶבַח הַשְּׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan atau kurban kesejahteraan
  rationale: Istilah Ibrani memiliki cakupan makna yang melibatkan keadaan sejahtera atau damai dan persekutuan dalam santapan kurban. Teks utama memakai ungkapan yang komunikatif tanpa menutup alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat diatur agar daftar bagian kurban mudah diikuti, sambil mempertahankan rincian anatomi dan pengulangan lemak dalam teks Ibrani.
