id: LEV.3.6
reference: Leviticus 3:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: id
  text: Dan jika persembahannya untuk kurban damai[a] kepada Yahweh berasal dari kawanan domba atau kambing, baik jantan maupun betina, ia harus mempersembahkannya tanpa cacat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan.” Istilah Ibrani שְׁלָמִים secara tradisional diterjemahkan “kurban damai,” tetapi juga dapat menekankan kesejahteraan bersama atau persekutuan dalam jamuan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Partikel bersyarat diterjemahkan secara alami dalam bahasa Indonesia. Hubungannya dengan petunjuk sebelumnya tetap tersirat oleh konteks, tanpa memakai pembukaan yang kaku seperti “Dan jika”.
- source_word: מִן הַצֹּאן
  choice: berasal dari kawanan domba atau kambing
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, khususnya domba dan kambing. Ungkapan ini jelas bagi pembaca modern dan tidak membatasi jenis hewan hanya pada domba.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן menunjuk pada sesuatu yang dibawa atau dipersembahkan dalam ibadah; “persembahan” merupakan padanan Indonesia yang alami dalam konteks Imamat.
- source_word: לְזֶבַח שְׁלָמִים
  choice: sebagai kurban damai
  rationale: זֶבַח menyatakan kurban sembelihan, sedangkan שְׁלָמִים berkaitan dengan damai, kesejahteraan, dan keutuhan. “Kurban damai” mempertahankan istilah ritual yang ringkas, sementara kemungkinan nuansa persekutuan dijelaskan dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: baik jantan maupun betina
  rationale: Padanan ini menyampaikan secara langsung bahwa kedua jenis kelamin hewan boleh dipersembahkan.
- source_word: תָּמִים
  choice: tanpa cacat
  rationale: Dalam konteks kurban, תָּמִים berarti hewan yang tidak memiliki cacat yang membuatnya tidak layak dipersembahkan.
- source_word: יַקְרִיבֶנּוּ
  choice: ia harus mempersembahkannya
  rationale: Bentuk Hifil dari קרב dalam konteks ritual berarti membawa ke hadapan atau mempersembahkan. Pronomina “-nya” merujuk pada hewan yang menjadi persembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban damai
  alternative: kurban persekutuan
  rationale: Akar istilah ini dapat menunjuk pada damai, kesejahteraan, atau keutuhan, sedangkan praktik kurbannya juga mencakup jamuan bersama. Teks utama memakai padanan tradisional yang dekat dengan bentuk Ibrani, dan catatan kaki mempertahankan kemungkinan nuansa persekutuan tanpa menetapkan satu penafsiran secara mutlak.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan urutan pokok sumber: jenis kurban, peruntukan kepada Yahweh, asal hewan, jenis kelamin, dan syarat tanpa cacat.'
