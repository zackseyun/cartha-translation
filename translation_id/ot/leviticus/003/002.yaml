base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: id
  text: Ia harus meletakkan tangannya pada kepala persembahannya dan menyembelihnya di pintu masuk Kemah Pertemuan. Lalu anak-anak Harun, yaitu para imam, harus melemparkan[a] darah itu ke seluruh sisi mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyiramkan darah itu ke seluruh sisi mezbah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Ia harus meletakkan tangannya
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan menaruh atau menekankan tangan pada hewan. 'Meletakkan tangannya' alami dalam bahasa Indonesia dan tetap mempertahankan bentuk tunggal יָדוֹ.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: pada kepala persembahannya
  rationale: רֹאשׁ adalah kepala secara konkret, sedangkan קָרְבָּן merupakan istilah umum bagi sesuatu yang dipersembahkan; 'persembahan' menjaga cakupan istilah itu tanpa mempersempitnya menjadi jenis kurban tertentu.
- source_word: וּשְׁחָטוֹ
  choice: dan menyembelihnya
  rationale: שׁחט adalah verba lazim untuk penyembelihan hewan kurban; 'menyembelih' tepat secara ritual dan lebih khusus daripada 'membunuh'.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח berarti bukaan atau jalan masuk, dan 'pintu masuk' merupakan ungkapan Indonesia yang alami. 'Kemah Pertemuan' mempertahankan sebutan khusus אֹהֶל מוֹעֵד.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: anak-anak Harun, yaitu para imam
  rationale: Frasa aposisional itu mengidentifikasi anak-anak Harun sebagai para imam. 'Yaitu' memperjelas hubungan tersebut secara alami tanpa mengubah makna.
- source_word: וְזָרְקוּ ... אֶת הַדָּם
  choice: harus menyiramkan darahnya
  rationale: Dalam tata kurban, זרק menggambarkan darah yang dilemparkan atau dipercikkan dalam jumlah tertentu ke arah mezbah. 'Menyiramkan' menyampaikan penerapan darah dengan gerakan menghamburkan cairan dan menghindari kesan percikan halus yang dapat timbul dari 'memercikkan'.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pada mezbah di sekelilingnya
  rationale: עַל menyatakan arah atau sasaran darah pada mezbah, sedangkan סָבִיב menunjukkan penerapan mengelilingi sisi-sisinya. Ungkapan ini alami dan tidak menyiratkan bahwa darah hanya ditaruh di permukaan atas mezbah.
theological_decisions:
- issue: Cara darah diterapkan pada mezbah
  choice: menyiramkan darahnya pada mezbah di sekelilingnya
  alternative: memercikkan darahnya pada mezbah di sekelilingnya
  rationale: זרק lebih kuat daripada tindakan memercik halus dan dalam konteks ini menunjuk pada pelemparan atau penyiraman darah ke sisi-sisi mezbah. Pilihan ini menjaga perbedaan ritual tanpa memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibagi menjadi dua agar prosedur ritual mudah dipahami. Pronomina 'Ia' mengacu kepada orang yang membawa persembahan; sufiks pada 'darahnya' mengacu kepada hewan persembahan.
