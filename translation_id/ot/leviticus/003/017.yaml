  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: id
  text: 'Ini akan menjadi ketetapan untuk selama-lamanya[a] bagi kamu turun-temurun, di semua tempat tinggalmu: janganlah kamu makan lemak ataupun darah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan yang tetap” atau “ketetapan yang berlaku terus-menerus.” Dalam konteks hukum, kata Ibrani עוֹלָם sering menunjuk pada keberlakuan yang tetap dan berkelanjutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan tetap
  rationale: Frasa ini menyatakan aturan yang terus berlaku. 'Ketetapan' mempertahankan daya hukum חֻקָּה, sedangkan 'tetap' menyampaikan keberlangsungan עוֹלָם dalam rumusan hukum tanpa harus menentukan kemutlakan metafisis.
- source_word: לְדֹרֹתֵיכֶם
  choice: bagi kamu turun-temurun
  rationale: Ungkapan Indonesia yang alami untuk keberlakuan bagi generasi-generasi berturut-turut.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: di mana pun kamu tinggal
  rationale: Menyampaikan cakupan setiap tempat kediaman secara jelas dan alami dalam bahasa Indonesia modern.
- source_word: כָּל חֵלֶב
  choice: lemak apa pun
  rationale: Kata 'apa pun' mempertahankan cakupan menyeluruh כָּל dalam larangan. 'Lemak' dibiarkan sebagai istilah umum sebagaimana teks sumber.
- source_word: וְכָל דָּם
  choice: ataupun darah apa pun
  rationale: Mempertahankan kesejajaran dengan larangan lemak dan cakupan menyeluruh כָּל.
- source_word: לֹא תֹאכֵלוּ
  choice: janganlah kamu makan
  rationale: Bentuk larangan langsung ini alami, jelas, dan tetap bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Jangka waktu ketetapan yang dinyatakan oleh עוֹלָם
  choice: ketetapan tetap
  alternative: ketetapan untuk selama-lamanya; ketetapan kekal
  rationale: Dalam rumusan hukum, עוֹלָם menekankan keberlakuan yang berlanjut dari generasi ke generasi. 'Tetap' menjaga daya ungkapan itu tanpa secara diam-diam menetapkan bahwa idiom tersebut harus berarti kemutlakan filosofis tanpa akhir.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan dibentuk sebagai pernyataan hukum yang dapat dipahami pembaca umum; bentuk tunggal kolektif 'kamu' mengikuti sapaan kepada umat sebagai satu komunitas.
