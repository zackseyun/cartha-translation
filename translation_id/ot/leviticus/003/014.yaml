source:
  edition: WLC
  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: id
  text: 'Dari hewan itu ia harus mempersembahkan kurbannya, suatu persembahan dengan api[a] bagi Yahweh: lemak yang menutupi isi perut dan seluruh lemak yang ada pada isi perut,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan yang dibakar.” Istilah Ibrani אִשֶּׁה secara tradisional diterjemahkan demikian dalam konteks kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ia harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban menyatakan tindakan membawa dan menyajikan sesuatu sebagai persembahan; 'mempersembahkan' alami sekaligus mempertahankan makna ritual.
- source_word: מִמֶּנּוּ
  choice: dari hewan itu
  rationale: Akhiran pronominal mengacu kepada hewan kurban yang dibicarakan sebelumnya. Penyebutan 'hewan' memperjelas acuannya dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן merupakan istilah teknis bagi sesuatu yang dibawa sebagai persembahan; 'persembahan' adalah padanan Indonesia yang baku dan mudah dipahami.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Istilah ritual ini berkaitan dengan persembahan yang diberikan melalui pembakaran. Padanan ini mempertahankan unsur api tanpa menambahkan tafsiran 'makanan' yang tidak dinyatakan secara eksplisit dalam bentuk katanya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai penerima atau tujuan persembahan. Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: הַחֵלֶב
  choice: lemak
  rationale: Dalam peraturan kurban, חֵלֶב menunjuk pada bagian-bagian lemak tertentu yang dikhususkan untuk dibakar.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: yang menutupi isi perut
  rationale: Partisipel diterjemahkan sebagai klausa relatif yang alami; קֶרֶב di sini menunjuk pada bagian atau organ dalam rongga perut.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: dan seluruh lemak yang melekat pada isi perut
  rationale: '''Melekat pada'' menyampaikan hubungan spasial עַל secara alami dalam konteks anatomi dan membedakannya dari lemak yang menutupi bagian dalam.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. 'Yahweh' mempertahankan nama pribadi itu dalam bentuk transliterasi yang lazim secara akademis dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Makna istilah kurban אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan berupa makanan; persembahan dengan api
  rationale: Etimologi dan cakupan tepat istilah ini diperdebatkan. Terjemahan utama mempertahankan kaitannya dengan pembakaran, sedangkan catatan kaki mengakui padanan tradisional yang lebih harfiah tanpa memastikan bahwa istilah itu berarti 'makanan'.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar bagian kurban dipertahankan, termasuk tanda koma akhir yang menunjukkan bahwa kalimat berlanjut ke ayat berikutnya. 'Isi perut' dipilih sebagai ungkapan anatomis yang mudah dipahami dan tidak sekeras 'jeroan'.
