base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: id
  text: Kedua ginjal, lemak yang ada padanya, yaitu yang di daerah pinggang, dan bagian tambahan pada hati[a] harus dikeluarkannya bersama kedua ginjal itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lobus hati.” Istilah Ibrani untuk bagian tubuh ini (יֹתֶרֶת) tidak pasti; karena itu, teks utama memakai ungkapan umum agar tidak memberi kesan bahwa identifikasi anatomisnya sudah pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atas ginjal.” Di sini ungkapan itu kemungkinan berarti bahwa bagian tersebut dikeluarkan bersama kedua ginjal itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Ungkapan ini secara langsung menunjuk pada sepasang ginjal dalam anatomi kurban.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: lemak yang melekat padanya
  rationale: Dalam konteks kurban, חֵלֶב adalah lemak khusus yang diambil untuk dipersembahkan; 'melekat padanya' menyampaikan hubungan anatomis dengan kedua ginjal secara alami.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: di daerah pinggang
  rationale: כְּסָלִים menunjuk pada daerah pinggang atau panggul. 'Di daerah pinggang' jelas dan wajar dalam bahasa Indonesia tanpa mengklaim ketepatan anatomi modern yang berlebihan.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: bagian yang menonjol pada hati
  rationale: Identitas anatomis יֹתֶרֶת tidak pasti. Frasa deskriptif ini mempertahankan hubungan dengan hati tanpa memastikan bahwa bagian tersebut adalah lobus tertentu.
- source_word: עַל הַכְּלָיֹת
  choice: bersama ginjal
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', dalam rumusan tata cara kurban ini frasa tersebut kemungkinan menyatakan bahwa bagian pada hati dikeluarkan bersama ginjal.
- source_word: יְסִירֶנָּה
  choice: harus dikeluarkannya
  rationale: Bentuk Hifil dari סור menyatakan tindakan menyingkirkan atau mengeluarkan dalam ketentuan ritual. Susunan ini mempertahankan pelaku tunggal tersirat dan gaya hukum yang wajar.
