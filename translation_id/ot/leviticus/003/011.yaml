  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: id
  text: Imam harus membakarnya di atas mazbah sebagai makanan[a], suatu persembahan melalui api bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti dari persembahan api bagi Yahweh”; di sini “roti” dipakai secara idiomatis dengan arti makanan dalam sistem kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: harus membakarnya
  rationale: Bentuk Hifil dari קטר dalam konteks kurban menunjuk pada pembakaran di mazbah sehingga persembahan naik sebagai asap. Pilihan ini alami dalam bahasa Indonesia dan tetap menyatakan tindakan ritualnya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan jelas untuk כֹּהֵן dalam konteks peribadatan Israel.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran penunjuk arah pada kata 'mazbah' bersama tindakan membakar secara alami dipahami sebagai penempatan dan pembakaran di atas mazbah.
- source_word: לֶחֶם
  choice: makanan
  rationale: Walaupun arti dasarnya sering 'roti', dalam ungkapan kurban ini kata tersebut berfungsi lebih luas sebagai makanan atau bagian yang dipersembahkan di mazbah; 'makanan' menghindari kesan keliru bahwa yang dimaksud ialah roti harfiah.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Istilah teknis ini menunjuk pada persembahan yang disajikan melalui api. Rumusan ini jelas dan wajar dalam bahasa Indonesia tanpa menentukan lebih jauh etimologi istilah yang diperdebatkan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau pengabdian persembahan, sedangkan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' sesuai lapisan konsultasi yang diberikan.
theological_decisions:
- issue: Ungkapan kurban לֶחֶם אִשֶּׁה
  choice: sebagai makanan, persembahan yang dibakar
  alternative: sebagai roti persembahan api
  rationale: Terjemahan utama mempertahankan kedua unsur ungkapan Ibrani tetapi memakai 'makanan' secara idiomatis agar tidak menyiratkan roti harfiah. Bahasa ini merupakan gambaran sistem kurban dan tidak dimaksudkan untuk menyatakan bahwa Allah memerlukan makanan secara jasmani.
- issue: Hubungan sintaksis antara לֶחֶם dan אִשֶּׁה
  choice: 'aposisi: ''sebagai makanan, persembahan yang dibakar'''
  alternative: '''sebagai makanan dari persembahan yang dibakar'''
  rationale: Teks Ibrani yang padat memungkinkan hubungan kedua nomina dipahami secara aposisional atau konstruktif. Tanda koma mempertahankan kepadatan dan sebagian ambiguitas tersebut tanpa menambahkan hubungan kepemilikan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Mazbah' dipertahankan sebagai istilah ibadah yang ringkas dan dikenal dalam konteks Imamat. Struktur kalimat mengikuti urutan tindakan dalam teks Ibrani, sementara ungkapan kurbannya dibuat alami tanpa menghapus metafora makanannya.
