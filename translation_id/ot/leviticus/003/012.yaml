id: LEV.3.12
reference: Leviticus 3:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: id
  text: Namun, jika persembahannya adalah seekor kambing, ia harus mempersembahkannya di hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (nama ilahi), yang secara tradisional diterjemahkan “TUHAN”; alternatif: “Yehova”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Gabungan konjungsi dan syarat memperkenalkan kemungkinan berikutnya dalam rangkaian petunjuk korban. “Namun, jika” menyatakan peralihan dan sedikit kontras secara wajar.
- source_word: עֵז
  choice: seekor kambing
  rationale: Nomina tunggal ini berarti kambing; kata penggolong “seekor” membuat ungkapan alami dalam bahasa Indonesia.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן adalah istilah umum untuk sesuatu yang dibawa atau dihampirkan sebagai persembahan; “persembahan” mempertahankan cakupan maknanya tanpa mempersempitnya menjadi jenis korban tertentu.
- source_word: וְהִקְרִיבוֹ
  choice: ia harus mempersembahkannya
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau menyajikan sebagai persembahan. Dalam konteks hukum ritual, “harus” menyampaikan daya instruksionalnya.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini secara alami menyampaikan arti spasial dan kultis, yakni menghadirkan persembahan di hadapan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehova” mencerminkan bentuk transliterasi tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “ia” menjaga kelancaran tanpa menentukan identitas pelaku lebih jauh daripada konteks, sedangkan istilah ritual tetap mudah dipahami pembaca umum.
