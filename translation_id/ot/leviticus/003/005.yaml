  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: id
  text: Anak-anak Harun hendaklah membakarnya di atas mazbah, di atas kurban bakaran yang ada di atas kayu yang ada di atas api. Itulah persembahan yang dibakar dengan api[a], aroma yang menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan makanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: harus membakarnya
  rationale: Bentuk Hifil dari קטר dalam konteks kurban berarti membakar persembahan di mazbah sehingga asapnya naik. Kata 'harus' menyampaikan daya instruksional bentuk verba ini dalam tata cara ritual.
- source_word: בְנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Padanan langsung dan wajar bagi frasa konstruksi Ibrani, sekaligus mempertahankan sebutan keluarga yang menunjuk para imam.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Menunjuk tempat sekaligus tujuan tindakan ritual. 'Mazbah' merupakan istilah Indonesia yang tepat dan ringkas untuk altar persembahan.
- source_word: עַל הָעֹלָה
  choice: di atas kurban bakaran
  rationale: עַל paling wajar menunjukkan posisi di atas kurban bakaran; עֹלָה diterjemahkan dengan istilah baku 'kurban bakaran'.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: yang berada di atas kayu yang ada di atas api
  rationale: Susunan bertingkat dan pengulangan עַל dipertahankan agar tata letak unsur-unsur di mazbah tetap terlihat sebagaimana dalam teks Ibrani.
- source_word: אִשֵּׁה
  choice: persembahan makanan
  rationale: Istilah teknis kurban ini berkaitan dengan bagian persembahan bagi Yahweh yang dikonsumsi api mazbah. Padanan ini mengikuti makna kultisnya, sedangkan kemungkinan arti 'persembahan melalui api' dicatat dalam catatan kaki.
- source_word: רֵיחַ נִיחֹחַ
  choice: suatu aroma yang menyenangkan
  rationale: Ungkapan kurban tetap ini menyatakan bahwa persembahan tersebut berkenan kepada Allah. 'Aroma yang menyenangkan' alami dalam bahasa Indonesia dan tidak terlalu menafsirkan unsur ניחֹחַ.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan persembahan. Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Makna istilah kurban אִשֵּׁה
  choice: persembahan makanan
  alternative: persembahan melalui api
  rationale: Istilah tersebut dapat dipahami sebagai kategori persembahan yang menjadi bagian sajian bagi Yahweh, tetapi kaitannya dengan api juga kuat dan lazim dalam tradisi penerjemahan. Alternatif itu dipertahankan dalam catatan kaki agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah ritual 'mazbah' dan 'kurban bakaran' dipertahankan karena ringkas serta dikenal luas. Rangkaian 'di atas ... di atas ... di atas' sengaja dipertahankan untuk mencerminkan struktur konkret teks Ibrani.
