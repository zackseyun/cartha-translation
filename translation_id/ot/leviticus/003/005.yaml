  naturalness: Susunan ruang "di atas ... di atas ... di atas" dengan tepat mencerminkan teks Ibrani dan tetap dapat dipahami dalam bahasa Indonesia modern. "Harus membakarnya" dapat dipakai untuk instruksi ritual, walaupun "hendaklah membakarnya" lebih lazim untuk gaya perintah kitab suci.
