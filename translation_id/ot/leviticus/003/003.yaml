  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: id
  text: Dari kurban kesejahteraan itu, ia harus mempersembahkan kepada Yahweh sebagai persembahan makanan[a] lemak yang menutupi bagian dalam dan seluruh lemak yang ada pada bagian dalam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan yang dibakar” atau “persembahan dengan api.”'
    reason: Alternatif leksikal bagi אִשֶּׁה, yang dapat menonjolkan persembahan yang dibakar dan dijadikan asap.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ia harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban menunjuk pada tindakan ritual membawa dan menyajikan persembahan; 'mempersembahkan' alami dan tepat dalam bahasa Indonesia.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: dari kurban persembahan keselamatan itu
  rationale: זֶבַח adalah kurban sembelihan, sedangkan שְׁלָמִים merupakan kategori kurban yang berkaitan dengan keutuhan, kesejahteraan, dan damai. 'Persembahan keselamatan' mempertahankan nama kategori tanpa membatasinya hanya pada persekutuan.
- source_word: אִשֶּׁה
  choice: persembahan makanan
  rationale: Dalam teks keimaman, istilah ini menunjuk pada persembahan yang dibakar sehingga naik sebagai asap dan dipandang sebagai pemberian makanan bagi Allah. Terjemahan utama mengutamakan fungsi kultisnya, sedangkan unsur api dipertahankan dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: הַחֵלֶב
  choice: lemak
  rationale: Dalam peraturan kurban, חֵלֶב menunjuk pada bagian-bagian lemak tertentu yang dikhususkan untuk dipersembahkan.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: yang menutupi isi perut
  rationale: Partisipel הַמְכַסֶּה menerangkan lemak sebagai lapisan penutup, dan קֶרֶב dalam konteks anatomi hewan menunjuk pada bagian-bagian dalam rongga perut.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: seluruh lemak yang melekat pada isi perut itu
  rationale: '''Melekat pada'' menyampaikan hubungan anatomis עַל secara alami dan membedakannya dari lemak yang secara khusus menutupi isi perut.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Penerjemahan אִשֶּׁה dalam hukum kurban
  choice: persembahan makanan
  alternative: persembahan yang dibakar; persembahan dengan api
  rationale: Pilihan utama menyampaikan fungsi persembahan sebagai pemberian kultis kepada Allah, tetapi karena etimologi dan nuansa istilah diperdebatkan, unsur pembakaran disajikan sebagai alternatif dalam catatan kaki.
- issue: Penerjemahan זֶבַח הַשְּׁלָמִים
  choice: kurban persembahan keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan; kurban pendamaian
  rationale: שְׁלָמִים mempunyai rentang makna yang berkaitan dengan damai, kesejahteraan, dan keutuhan. Pilihan ini mempertahankan istilah kategori yang cukup luas tanpa menyamakan kurban tersebut secara khusus dengan pendamaian dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti urutan ritual teks Ibrani sambil tetap alami. Istilah anatomi dibuat jelas tanpa bahasa yang terlalu teknis.
