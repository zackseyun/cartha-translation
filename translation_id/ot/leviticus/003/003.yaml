revisions:
- from: Dari kurban persembahan keselamatan itu, ia harus mempersembahkan kepada Yahweh sebagai persembahan makanan[a] lemak yang menutupi isi perut dan seluruh lemak yang melekat pada isi perut itu.
  to: Dari kurban kesejahteraan itu, ia harus mempersembahkan kepada Yahweh sebagai persembahan makanan[a] lemak yang menutupi bagian dalam dan seluruh lemak yang ada pada bagian dalam itu.
  rationale: Revisi mengganti istilah yang berpotensi mengarahkan pembaca kepada keselamatan rohani dengan “kurban kesejahteraan,” suatu sebutan kategori yang lebih netral bagi זֶבַח הַשְּׁלָמִים. “Isi perut” diganti dengan “bagian dalam” karena lebih tepat bagi anatomi hewan yang dimaksud קֶרֶב. Relasi עַל diterjemahkan “ada pada,” tanpa menambahkan tingkat keterlekatan yang tidak dinyatakan secara eksplisit. Catatan kaki tetap terjangkar pada “persembahan makanan” dan mempertahankan alternatif yang relevan bagi אִשֶּׁה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:16:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan umumnya setia pada struktur dan unsur utama teks Ibrani: tindakan mempersembahkan, kurban šĕlāmîm, Yahweh, lemak penutup, dan seluruh lemak pada bagian dalam. Namun, “persembahan keselamatan” memberi konotasi keselamatan/soteriologi yang tidak menjadi makna utama atau pasti dari שְׁלָמִים. Istilah tersebut lebih aman diterjemahkan sebagai kategori ritual “kurban kesejahteraan,” dengan nuansa alternatif dicatat bila diperlukan. Selain itu, “isi perut” dalam pemakaian modern terutama berarti materi dalam perut, bukan organ/bagian dalam hewan; “bagian dalam” lebih tepat untuk קֶרֶב di sini.'
  naturalness: Kalimatnya sudah baku dan jelas, tetapi “lemak yang melekat pada isi perut” kurang idiomatis secara anatomis dan dapat membayangkan isi lambung/usus. “Lemak yang ada pada bagian dalam” mempertahankan relasi עַל secara dekat dan alami dalam konteks ritual.
  terminology: “Yahweh” tepat dan konsisten dengan keputusan proyek. “Persembahan makanan” dapat dipertahankan sebagai padanan fungsional untuk אִשֶּׁה, dengan catatan kaki yang menyebut alternatif berorientasi api. “Kurban kesejahteraan” menghindari pembacaan doktrinal yang terlalu khusus pada “keselamatan” dan mencerminkan ranah makna šĕlāmîm secara lebih netral.
  issues:
  - severity: medium
    issue: “Persembahan keselamatan” untuk זֶבַח הַשְּׁלָמִים
    rationale: Šĕlāmîm menunjuk suatu jenis kurban yang berhubungan dengan keutuhan, kesejahteraan, atau damai; “keselamatan” dalam bahasa Indonesia modern mudah dibaca sebagai keselamatan rohani. “Kurban kesejahteraan” lebih netral dan tidak mengimpor makna soteriologis.
  - severity: medium
    issue: “Isi perut” untuk הַקֶּרֶב
    rationale: Dalam bahasa Indonesia modern, “isi perut” biasanya merujuk pada isi lambung atau usus, sedangkan konteks Ibrani menunjuk pada bagian-bagian dalam/visera hewan. “Bagian dalam” menjaga ketepatan tanpa terlalu teknis.
  - severity: low
    issue: “Melekat pada” untuk עַל
    rationale: Teks menyatakan lemak yang “pada/di atas” bagian dalam. “Melekat” merupakan spesifikasi anatomi yang mungkin benar secara konteks, tetapi lebih sempit daripada preposisi Ibrani. “Yang ada pada” lebih dekat pada sumber.
