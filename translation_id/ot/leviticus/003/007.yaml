id: LEV.3.7
reference: Leviticus 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: id
  text: Jika ia mempersembahkan seekor domba sebagai persembahannya[a], ia harus membawanya ke hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seekor anak domba sebagai persembahannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan satu kasus bersyarat dalam petunjuk tentang persembahan; “jika” mempertahankan bentuk kondisional teks Ibrani.
- source_word: כֶּשֶׂב
  choice: domba
  rationale: Istilah ini dapat menunjuk kepada domba, termasuk domba muda menurut konteks. “Domba” tidak menetapkan usia hewan secara berlebihan; alternatif “anak domba” dicatat dalam catatan kaki.
- source_word: הוּא מַקְרִיב
  choice: ia mempersembahkan
  rationale: Partisipel Hifil dari קרב menggambarkan tindakan membawa atau menyajikan sesuatu sebagai persembahan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks ibadah.
- source_word: קָרְבָּנוֹ
  choice: sebagai persembahannya
  rationale: קָרְבָּן merupakan istilah umum bagi sesuatu yang dibawa mendekat sebagai persembahan; “persembahan” lebih luas dan tepat daripada “kurban” dalam klausa ini.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: ia harus membawanya
  rationale: Dalam konteks hukum, bentuk verba ini menyatakan tindakan lanjutan yang diwajibkan. “Membawanya” menghindari pengulangan kaku sekaligus mempertahankan gagasan membawa hewan itu mendekat.
- source_word: לִפְנֵי
  choice: ke hadapan
  rationale: Padanan alami bagi ungkapan ruang dan ibadah yang berarti membawa sesuatu ke depan atau ke hadirat pihak yang disebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa tindakan korban dalam וְהִקְרִיב
  choice: membawanya ke hadapan
  alternative: mempersembahkannya di hadapan
  rationale: Pilihan ini mempertahankan citra dasar ‘membawa mendekat’ dan tidak menyiratkan bahwa seluruh tindakan pengurbanan telah dilaksanakan pada tahap ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kondisional dipertahankan, sedangkan pengulangan akar kata Ibrani diterjemahkan secara alami dengan “mempersembahkan” lalu “membawanya ke hadapan.”
