  terminology: “Kurban damai” merupakan padanan yang wajar dan cukup mapan untuk זֶבַח שְׁלָמִים. Nama ilahi “Yahweh” tepat mempertahankan יְהוָה. Dalam catatan kaki, “kurban kesejahteraan” lebih akurat daripada “kurban keselamatan,” karena שְׁלָמִים berhubungan dengan keutuhan/kesejahteraan, bukan secara khusus keselamatan dalam pengertian soteriologis.
