id: LEV.3.1
reference: Leviticus 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: id
  text: Jika persembahannya berupa kurban damai[a] dan ia mempersembahkannya dari ternak sapi, baik jantan maupun betina, ia harus mempersembahkannya tanpa cela di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban kesejahteraan” atau “kurban persekutuan.” Secara harfiah, bahasa Ibrani menyebutnya “kurban dari persembahan-persembahan damai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: kurban damai
  rationale: זֶבַח menyatakan kurban, sedangkan שְׁלָמִים menamai jenisnya. “Kurban damai” ringkas dan wajar dalam bahasa Indonesia, serta mempertahankan hubungan istilah itu dengan damai, keutuhan, dan kesejahteraan tanpa membatasinya pada gagasan persekutuan saja.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן adalah sesuatu yang dibawa atau dipersembahkan kepada Allah. “Persembahan” jelas dan alami dalam konteks hukum kurban.
- source_word: מִן הַבָּקָר
  choice: dari kawanan sapi
  rationale: בָּקָר menunjuk pada ternak dari jenis sapi. Ungkapan ini mempertahankan unsur kelompok ternak dalam frasa Ibrani dan tetap mudah dipahami.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: mempersembahkan / harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa untuk dipersembahkan. “Mempersembahkan” menyampaikan fungsi ritualnya secara alami.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: baik jantan maupun betina
  rationale: Pasangan אִם ... אִם menyatakan bahwa hewan dari kedua jenis kelamin diperbolehkan. Rumusan Indonesia ini alami dan tetap mencakup keduanya.
- source_word: תָּמִים
  choice: tidak bercela
  rationale: Dalam hukum kurban, תָּמִים berarti bebas dari cacat yang membuat hewan tidak layak dipersembahkan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan” atau “dalam hadirat,” sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh.”
theological_decisions:
- issue: Penamaan jenis persembahan שְׁלָמִים
  choice: kurban damai
  alternative: kurban keselamatan; kurban persekutuan
  rationale: Istilah Ibrani memiliki medan makna yang berkaitan dengan damai, keutuhan, dan kesejahteraan, sementara konteks ritualnya juga dapat melibatkan persekutuan. Teks utama memakai “damai” agar tidak mempersempit maknanya; pilihan lain dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan bersyarat dari teks Ibrani dipertahankan tanpa membuat kalimat kaku; “hewan ... itu” memperjelas objek pronominal Ibrani tanpa menambah jenis hewan baru.
