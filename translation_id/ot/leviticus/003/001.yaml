    rationale: Alternatif ini berpotensi mengarahkan pembaca kepada konsep keselamatan yang tidak dinyatakan oleh istilah שְׁלָמִים. “Kesejahteraan” mencerminkan medan makna istilah itu dengan lebih baik.
