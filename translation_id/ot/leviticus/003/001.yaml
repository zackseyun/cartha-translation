  to: Jika persembahannya berupa kurban damai[a] dan ia mempersembahkannya dari ternak sapi, baik jantan maupun betina, ia harus mempersembahkannya tanpa cela di hadapan Yahweh.
  rationale: Revisi mempertahankan seluruh unsur syarat dalam teks Ibrani, memakai “ternak sapi” yang lebih idiomatis, dan menerjemahkan תָּמִים sebagai kualifikasi langsung atas tindakan mempersembahkan. Catatan kaki mempertahankan alternatif yang relevan tanpa mengimpor pengertian soteriologis ke dalam istilah kurban.
