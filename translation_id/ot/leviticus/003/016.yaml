review_pass:
  verdict: revise
  source_fidelity: Perlu perbaikan kecil pada hubungan sintaktis לֶחֶם אִשֶּׁה. Teks Ibrani menyebut bagian-bagian itu sebagai “makanan/santapan dari persembahan api,” bukan menyamakan “santapan” dengan “persembahan dengan api.” Terjemahan nama Yahweh, cakupan “semua lemak,” dan rujukan jamak “bagian-bagian itu” setia pada sumber.
  naturalness: Kalimat draf umumnya baku dan mudah dipahami. Namun, “sebagai santapan, yaitu persembahan dengan api” kurang tepat secara hubungan makna. “Sebagai santapan dari persembahan yang dibakar dengan api” memperjelas konstruksi tersebut dalam bahasa Indonesia modern tanpa menjadi kaku.
  terminology: “Imam,” “mazbah,” “persembahan,” dan “Yahweh” sesuai register ritual dan keputusan terminologis yang diberikan. “Aroma yang menyenangkan” mempertahankan metafora formula kurban tanpa penafsiran tambahan.
  issues:
  - severity: medium
    issue: Hubungan “santapan” dan “persembahan dengan api” dalam teks utama tidak mencerminkan konstruksi לֶחֶם אִשֶּׁה secara memadai.
    rationale: Konstruksi itu secara harfiah berarti “makanan/santapan dari persembahan api.” Kata “yaitu” dalam draf menjadikan keduanya aposisi yang setara, sehingga mengaburkan bahwa santapan tersebut berkaitan dengan persembahan api.
  revised_text: Lalu imam harus membakar bagian-bagian itu di atas mazbah sebagai santapan dari persembahan yang dibakar dengan api, untuk aroma yang menyenangkan. Semua lemak adalah untuk Yahweh.
  revised_footnotes:
  - marker: a
    text: Atau “santapan persembahan api”; secara harfiah, “roti/makanan dari persembahan api.”
    reason: lexical_alternative
  revision_rationale: Revisi membetulkan hubungan genitif dalam לֶחֶם אִשֶּׁה sambil mempertahankan istilah ritual, metafora “aroma yang menyenangkan,” dan nuansa peruntukan dalam “untuk Yahweh.” Penanda catatan kaki a ditempatkan setelah frasa yang dijelaskan.
