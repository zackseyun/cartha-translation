base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: id
  text: Lalu imam harus membakar bagian-bagian itu di atas mazbah sebagai santapan dari persembahan yang dibakar dengan api, untuk aroma yang menyenangkan. Semua lemak adalah untuk Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: Lalu imam harus membakar bagian-bagian itu
  rationale: Bentuk Hifil dari קטר dalam konteks kurban menunjuk pada pembakaran di atas mazbah hingga asapnya naik. Ungkapan “bagian-bagian itu” menyatakan akhiran pronominal jamak dan merujuk pada bagian-bagian kurban yang disebut sebelumnya.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran penunjuk arah/tempat di sini secara idiomatis menunjukkan mazbah sebagai tempat bagian-bagian kurban dibakar.
- source_word: לֶחֶם אִשֶּׁה
  choice: sebagai santapan, yaitu persembahan dengan api
  rationale: לֶחֶם berarti roti atau makanan, tetapi dalam konteks ini “santapan” lebih tepat dan tidak menyiratkan roti harfiah. אִשֶּׁה dipertahankan sebagai “persembahan dengan api,” sesuai dengan ungkapan ritual Ibrani.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  rationale: Ungkapan ritual ini mempertahankan metafora aroma yang berkenan tanpa menjabarkan atau menyelesaikan makna teologisnya di dalam teks.
- source_word: כָּל חֵלֶב
  choice: Semua lemak
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari כָּל dan merujuk pada lemak kurban dalam konteks.
- source_word: לַיהוָה
  choice: adalah untuk Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau pengkhususan. “Untuk Yahweh” mempertahankan keluwesan antara peruntukan dan kepemilikan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna ל dalam כָּל חֵלֶב לַיהוָה
  choice: Semua lemak adalah untuk Yahweh
  alternative: Semua lemak adalah milik Yahweh
  rationale: “Untuk Yahweh” secara lebih langsung mencerminkan konstruksi Ibrani dan mempertahankan kemungkinan nuansa peruntukan maupun kepemilikan tanpa mempersempitnya.
- issue: Formula kurban לְרֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  alternative: yang aromanya menenangkan
  rationale: Terjemahan ini mempertahankan citra indrawi dan gagasan keberkenanan, tanpa mengimpor penjelasan teologis bahwa aroma tersebut secara harfiah menenangkan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “mazbah” dipertahankan sebagai istilah ritual yang lazim dalam konteks Imamat; susunan kalimat dibuat alami tanpa menghilangkan metafora kurban dalam bahasa Ibrani.
