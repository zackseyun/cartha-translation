base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: id
  text: dan kedua ginjal, serta lemak yang ada pada kedua ginjal itu, yang berada pada bagian pinggang, dan bagian tambahan pada hati[a], harus ia lepaskan bersama kedua ginjal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cuping pada hati.” Istilah Ibrani untuk bagian anatomi ini (יֹתֶרֶת) tidak pasti; “bagian tambahan” digunakan dalam teks utama agar tidak memberi kesan ketepatan yang berlebihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Istilah כְּלָיֹת dengan jelas menunjuk pada ginjal dalam uraian anatomi kurban.
- source_word: הַחֵלֶב
  choice: lemak
  rationale: Dalam konteks kurban Imamat, חֵלֶב menunjuk pada bagian lemak dalam yang dikhususkan untuk persembahan; 'lemak' jelas dan mudah dipahami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: yang ada pada ginjal itu
  rationale: Klausa relatif ini menerangkan letak lemak. Pengulangan 'ginjal' lebih alami dan lebih jelas daripada pronomina jamak untuk organ berpasangan.
- source_word: הַכְּסָלִים
  choice: di sekitar pinggang
  rationale: כְּסָלִים menunjuk pada daerah pinggang atau sisi tubuh. Ungkapan ini mempertahankan cakupan anatominya tanpa memberi kesan ketepatan yang berlebihan.
- source_word: הַיֹּתֶרֶת
  choice: bagian tambahan
  rationale: Nama bagian anatomi ini tidak pasti. 'Bagian tambahan' mempertahankan ketidakpastian tersebut, sedangkan kemungkinan 'cuping' dicatat dalam catatan kaki.
- source_word: עַל הַכָּבֵד
  choice: pada hati
  rationale: Kata depan עַל menyatakan hubungan letak atau perlekatan; 'pada hati' cukup luas untuk mempertahankan ambiguitas itu.
- source_word: עַל הַכְּלָיֹת
  choice: bersama ginjal-ginjal itu
  rationale: Dalam rumusan tata cara kurban ini, frasa tersebut paling wajar dipahami sebagai pelepasan bagian hati bersama kedua ginjal, tanpa memaksakan gambaran lokasi yang janggal.
- source_word: יְסִירֶנָּה
  choice: yang harus dilepaskannya
  rationale: Bentuk kausatif dari סור berarti menyingkirkan atau melepaskan. Susunan klausa relatif mengikuti hubungan sintaksis ayat dan sesuai dengan gaya ketentuan ritual.
