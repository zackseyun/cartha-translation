  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: id
  text: Lalu ia harus mengambil seluruh lemak dari hewan itu dan membakarnya di atas mazbah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai di sini secara khusus berarti menjadikan bagian korban naik sebagai asap dalam upacara korban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Kemudian
  rationale: Kata penghubung ini meneruskan urutan tindakan ritual; “kemudian” terdengar alami dalam bahasa Indonesia dan menunjukkan kesinambungan dengan ayat sebelumnya.
- source_word: כָּל חֶלְבּוֹ
  choice: seluruh lemak
  rationale: כָּל menyatakan keseluruhan, sedangkan חֶלֶב dalam konteks korban menunjuk pada bagian-bagian lemak yang dikhususkan untuk dibakar di mazbah.
- source_word: יָרִים מִמֶּנּוּ
  choice: mengambil ... dari lembu itu
  rationale: Bentuk kausatif dari רום secara harfiah berkaitan dengan mengangkat, tetapi dalam konteks ini berarti mengambil atau memisahkan lemak dari hewan korban. Referen pronomina diperjelas sebagai “lembu itu” berdasarkan konteks ayat sebelumnya.
- source_word: וְהִקְטִיר
  choice: dan membakarnya
  rationale: Dalam bahasa ritual imamat, הקטיר berarti membuat bagian korban naik sebagai asap. “Membakarnya” merupakan ungkapan Indonesia yang alami, sementara nuansa khusus pengorbanannya dijelaskan dalam catatan kaki.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran penunjuk arah secara harfiah dapat menyiratkan gerak menuju mazbah, tetapi bersama verba הקטיר maksudnya adalah pembakaran bagian korban di atas mazbah.
