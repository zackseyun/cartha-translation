  register: Bahasa Indonesia baku, modern, dan lugas. Istilah “mazbah” dipertahankan sebagai istilah kultis yang lazim dalam terjemahan Alkitab Indonesia; struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan ritual.
