  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: id
  text: Kemudian imam harus mengambil sedikit darah kurban penghapus dosa[a] dengan jarinya dan membubuhkannya pada tanduk-tanduk mazbah kurban bakaran. Seluruh darahnya harus ia curahkan pada bagian bawah mazbah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kurban penahiran". Istilah Ibrani ini dapat menunjuk kepada kurban yang dipersembahkan sehubungan dengan dosa dan penahiran ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Waw dengan bentuk qatal melanjutkan urutan petunjuk ritual; 'kemudian' menyatakan tahap berikutnya secara alami.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan langsung bagi nomina definit yang menunjuk kepada imam yang bertugas.
- source_word: מִדַּם
  choice: sedikit darah
  rationale: 'Preposisi מִן bersifat partitif dalam konteks ini: hanya sebagian darah diambil untuk dibubuhkan dengan jari.'
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam peraturan kurban, istilah ini menunjuk kepada persembahan yang berkaitan dengan dosa dan penahiran; padanan ini lazim dan mudah dipahami, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: בְּאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: Preposisi bet menyatakan alat atau sarana yang digunakan imam.
- source_word: וְנָתַן
  choice: membubuhkannya
  rationale: נתן berarti memberi atau menaruh; 'membubuhkan' secara alami menggambarkan penerapan darah dalam tindakan ritual ini.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: pada tanduk-tanduk mazbah kurban bakaran
  rationale: Mempertahankan citra bagian-bagian mazbah yang disebut 'tanduk' dan mengidentifikasi mazbah menurut kurban bakaran.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: Seluruh darahnya
  rationale: כָּל menyatakan keseluruhan. Teks Ibrani mengatakan 'seluruh darahnya', meski secara prosedural yang dimaksud adalah darah yang masih ada setelah sebagian diambil.
- source_word: יִשְׁפֹּךְ
  choice: harus ia curahkan
  rationale: Menyatakan tindakan ritual yang disengaja, bukan penumpahan yang tidak sengaja.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: pada bagian bawah mazbah itu
  rationale: יְסוֹד secara harfiah menunjuk dasar atau fondasi; 'bagian bawah' jelas bagi pembaca modern dan sesuai dengan lokasi penuangan darah.
theological_decisions:
- issue: Pemadanan חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban penahiran
  rationale: Dalam konteks ini istilah tersebut jelas menunjuk kepada suatu kurban, tetapi dapat menonjolkan kaitannya dengan dosa ataupun fungsi penahiran. Teks utama memakai padanan yang umum, sedangkan kemungkinan penekanan penahiran dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan khidmat. Istilah 'mazbah' dipertahankan sebagai kosakata ibadah yang ringkas dan dikenal dalam konteks Alkitab; susunan kalimat dibuat prosedural dan mudah dibaca.
