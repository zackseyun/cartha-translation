  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: id
  text: Jika imam yang diurapi itu berbuat dosa sehingga umat menjadi bersalah, ia harus mempersembahkan kepada Yahweh, sebagai kurban penghapus dosa atas dosa yang telah diperbuatnya, seekor sapi jantan muda yang tidak bercacat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seekor lembu jantan, anak dari kawanan sapi.”
    reason: Ungkapan Ibrani פַּר בֶּן־בָּקָר dapat diterjemahkan lebih harfiah, sedangkan teks utama memakai padanan Indonesia yang lebih alami.
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: imam yang diurapi
  rationale: Menerjemahkan ungkapan Ibrani secara langsung tanpa menambahkan gelar 'imam besar', yang tidak disebutkan secara eksplisit.
- source_word: יֶחֱטָא
  choice: berbuat dosa
  rationale: 'Bentuk imperfek dalam syarat dengan אִם menyatakan kemungkinan hukum: ''jika ... berbuat dosa''.'
- source_word: לְאַשְׁמַת הָעָם
  choice: sehingga mendatangkan kesalahan atas umat
  rationale: Menjaga hubungan akibat yang terkandung dalam frasa padat ini, sekaligus tidak menjelaskan secara berlebihan bagaimana kesalahan imam berdampak pada umat.
- source_word: וְהִקְרִיב
  choice: ia harus mempersembahkan
  rationale: Dalam konteks kurban, kata ini menunjuk pada tindakan membawa atau menghadirkan hewan sebagai persembahan; 'harus' menyampaikan tuntutan hukum dalam kalimat bersyarat.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: atas dosa yang telah diperbuatnya
  rationale: Menyampaikan alasan kurban dengan tetap mempertahankan pengulangan gagasan dosa dalam bahasa Indonesia yang wajar.
- source_word: פַּר בֶּן בָּקָר
  choice: seekor sapi jantan muda
  rationale: Ungkapan harfiah 'lembu jantan, anak dari kawanan sapi' secara idiomatis menunjuk pada sapi jantan muda; terjemahan ini alami dan tetap cukup spesifik.
- source_word: תָּמִים
  choice: yang tidak bercacat
  rationale: Istilah baku dalam konteks kurban untuk hewan yang utuh dan tanpa cacat.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mempertahankan nama diri ilahi יהוה sebagai Yahweh, sesuai teks sumber dan lapisan konsultasi yang diberikan.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam peraturan kurban, חַטָּאת menunjuk bukan hanya pada dosa, melainkan pada jenis persembahan yang menangani dosa; istilah ini membedakannya dari sekadar 'kurban karena dosa'.
theological_decisions:
- issue: Apakah הַכֹּהֵן הַמָּשִׁיחַ diterjemahkan sebagai 'imam yang diurapi' atau 'imam besar yang diurapi'
  choice: imam yang diurapi
  alternative: imam besar yang diurapi
  rationale: Teks Ibrani secara eksplisit menyebut 'imam yang diurapi'. Walaupun dalam konteksnya jabatan itu dapat merujuk kepada imam besar, gelar tambahan tidak dimasukkan ke dalam teks utama.
- issue: Cara menyatakan akibat komunal dalam לְאַשְׁמַת הָעָם
  choice: sehingga mendatangkan kesalahan atas umat
  alternative: sehingga umat menjadi bersalah
  rationale: Pilihan utama mempertahankan ketegangan tentang hubungan dosa imam dan kesalahan umat tanpa menetapkan mekanisme teologis yang tidak dijelaskan ayat ini.
- issue: Makna kultis חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban karena dosa
  rationale: Kata tersebut di sini menunjuk pada persembahan ritual. 'Kurban penghapus dosa' merupakan istilah Indonesia yang jelas, tanpa menyatakan lebih jauh bagaimana kurban itu bekerja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk hukum bersyarat serta akibat komunal dosa imam. Istilah ritual diterjemahkan secara konsisten dan dapat dipahami pembaca umum.
