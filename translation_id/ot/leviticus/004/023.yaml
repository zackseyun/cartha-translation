  edition: WLC
  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: id
  text: atau jika dosa yang telah dilakukannya diberitahukan kepadanya,[a] maka ia harus membawa sebagai persembahannya seekor kambing jantan yang tidak bercacat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “jika dosanya yang telah dilakukannya diberitahukan kepadanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ
  choice: atau
  rationale: Konjungsi disjungtif sederhana yang melanjutkan ketentuan hukum dari ayat sebelumnya.
- source_word: הוֹדַע אֵלָיו
  choice: diberitahukan kepadanya
  rationale: Bentuk Hofal dari ידע menyatakan bahwa pengetahuan tentang dosa itu disampaikan kepadanya; bentuk pasif ini mempertahankan nuansa teks sumber.
- source_word: חַטָּאתוֹ
  choice: dosa
  rationale: Di sini חטאת menunjuk pada pelanggaran, bukan persembahan penghapus dosa, sebagaimana diperjelas oleh klausa relatif berikutnya.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: yang telah dilakukannya
  rationale: Klausa ini mengidentifikasi dosa yang dimaksud. Unsur preposisional בָּהּ bersifat idiomatis bersama חטא dan tidak perlu diterjemahkan secara kaku dalam bahasa Indonesia.
- source_word: וְהֵבִיא
  choice: maka ia harus membawa
  rationale: Waw dengan bentuk perfektif dalam konteks hukum menyatakan akibat atau kewajiban yang timbul setelah dosa itu diketahui.
- source_word: קָרְבָּנוֹ
  choice: sebagai persembahannya
  rationale: קרבן adalah sesuatu yang dibawa mendekat sebagai persembahan; ungkapan ini alami setelah verba 'membawa' dan tetap mudah dipahami.
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: seekor kambing jantan
  rationale: Gabungan ini menunjuk pada kambing berjenis kelamin jantan; jenis hewan dan jenis kelaminnya dipertahankan secara jelas.
- source_word: תָּמִים
  choice: yang tidak bercacat
  rationale: Ungkapan baku dalam konteks kurban untuk hewan yang bebas dari cacat fisik.
theological_decisions:
- issue: Makna חַטָּאת dalam ayat ini
  choice: dosa atau pelanggaran, bukan persembahan penghapus dosa
  alternative: persembahan penghapus dosa
  rationale: Klausa 'yang telah dilakukannya' menunjukkan bahwa חַטָּאתוֹ mengacu pada pelanggaran yang dilakukan. Persembahan kemudian disebut secara terpisah dengan קָרְבָּנוֹ.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan bentuk pasif yang penting dalam teks Ibrani; istilah persembahan dipilih agar dapat dipahami pembaca umum.
