  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: id
  text: Kemudian imam harus mencelupkan jarinya ke dalam darah itu, lalu memercikkan darah itu tujuh kali di hadapan Yahweh, di depan tirai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tabir.” Istilah Ibrani ini merujuk pada tirai tempat kudus yang memisahkan ruang sakral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: Kemudian ... harus mencelupkan
  rationale: Kata טבל berarti ‘mencelupkan’ atau ‘membenamkan’. Dalam rangkaian petunjuk ritual, bentuk ini menyatakan tindakan berikutnya yang wajib dilakukan; ‘kemudian’ memperjelas urutannya.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כהן dalam peraturan persembahan. Kekhususan nomina Ibrani tersampaikan secara alami oleh konteks dan urutan tindakan.
- source_word: אֶצְבָּעוֹ
  choice: jarinya
  rationale: Terjemahan langsung yang mempertahankan bentuk tunggal dan akhiran pronominal orang ketiga.
- source_word: מִן הַדָּם
  choice: ke dalam sebagian dari darah itu
  rationale: 'Preposisi מן setelah ‘mencelupkan’ memiliki nuansa partitif: jari dicelupkan ke bagian dari darah yang tersedia. Rumusan ini mempertahankan nuansa tersebut tanpa menyiratkan bahwa tangan dibenamkan seluruhnya.'
- source_word: וְהִזָּה
  choice: lalu memercikkan sebagian darah itu
  rationale: Dalam konteks ritual keimaman, הזה menunjuk pada tindakan memercikkan cairan, khususnya darah. Objek yang tersirat dijelaskan secara alami sebagai sebagian darah itu.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan langsung dan wajar bagi bilangan serta nomina jamak Ibrani.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti ‘di hadapan’ atau ‘di depan’. ‘Di hadapan’ menyampaikan dimensi kehadiran ilahi dalam konteks ibadah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’ agar nama perjanjian dalam teks Ibrani dipertahankan, bukan diganti dengan gelar.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: di depan tirai
  rationale: Frasa ini secara harfiah menunjuk pada muka atau bagian depan tirai tempat kudus. ‘Di depan tirai’ alami dalam bahasa Indonesia dan mempertahankan orientasi ruang tindakan ritual.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama pribadi itu tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
- issue: Penerjemahan פָּרֹכֶת
  choice: tirai
  alternative: tabir
  rationale: Kata Ibrani ini merujuk pada tirai khusus yang memisahkan ruang kudus. ‘Tirai’ lebih mudah dipahami dalam bahasa Indonesia modern, sedangkan ‘tabir’ tetap dicatat sebagai padanan tradisional.
- issue: Arah tindakan pemercikan
  choice: di hadapan Yahweh, di depan tirai
  alternative: di hadapan Yahweh, ke arah muka tirai
  rationale: Susunan Ibrani menghubungkan tindakan itu dengan kehadiran Yahweh sekaligus bagian depan tirai. Terjemahan utama mempertahankan kedua unsur tanpa menentukan secara berlebihan mekanika atau sasaran persis percikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Harus’ menandai sifat preskriptif petunjuk ritual; pengulangan ‘sebagian darah itu’ dipertahankan demi kejelasan tindakan dan nuansa partitif. Penanda catatan kaki ditempatkan pada ‘tirai’, sesuai isi catatan.
