reference: Leviticus 4:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: id
  text: Ia harus mengambil seluruh lemaknya, sama seperti lemak diambil dari kurban keselamatan[a]. Imam harus membakarnya di atas mazbah sebagai aroma yang menyenangkan bagi TUHAN.[b] Imam harus mengadakan pendamaian bagi orang itu, dan orang itu akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban persekutuan.”'
    reason: lexical_alternative
  - marker: b
    text: “Aroma yang menyenangkan” adalah ungkapan tetap dalam konteks kurban yang menyatakan bahwa persembahan itu berkenan kepada TUHAN.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: lemaknya / lemak
  rationale: Kata ini menunjuk pada lemak kurban yang harus diambil lalu dibakar di atas mazbah. Padanan sederhana “lemak” mempertahankan bentuk konkret teks tanpa menambahkan “bagian-bagian” yang tidak dinyatakan secara eksplisit.
- source_word: יָסִיר
  choice: harus mengambil
  rationale: Bentuk Hifil menyatakan tindakan menyingkirkan atau mengambil lemak dari hewan. “Harus” menyampaikan sifat prosedural dan wajib dari ketentuan hukum ini dalam bahasa Indonesia yang wajar.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: sama seperti ... diambil
  rationale: Ungkapan ini merujuk pada tata cara kurban yang sudah ditetapkan. Bentuk pasif mempertahankan struktur perbandingan dalam bahasa Ibrani.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban persembahan keselamatan
  rationale: “Persembahan keselamatan” mempertahankan kaitan leksikal שְׁלָמִים dengan keadaan damai atau sejahtera sekaligus menandai istilah tersebut sebagai kategori kurban; “persembahan persekutuan” dicatat sebagai alternatif.
- source_word: וְהִקְטִיר
  choice: harus membakarnya
  rationale: Dalam konteks ritual, verba ini berarti membakar bahan kurban di atas mazbah sehingga menjadi asap. “Membakarnya” alami dan konteks mazbah sudah memperjelas fungsi ritualnya.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Ini merupakan padanan baku dan jelas untuk tempat pembakaran kurban.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Terjemahan ini mempertahankan metafora indrawi dari rumusan kurban tersebut tanpa mengubahnya secara langsung menjadi penjelasan abstrak tentang penerimaan ilahi.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Nama ilahi יהוה ditampilkan menurut konvensi Indonesia yang umum sebagai “TUHAN”; preposisi “bagi” sesuai dengan arah relasional ungkapan persembahan itu.
- source_word: וְכִפֶּר עָלָיו
  choice: Imam harus mengadakan pendamaian bagi orang itu
  rationale: “Mengadakan pendamaian” mempertahankan istilah ritual כפר dan hubungan perantaraan imam tanpa menjelaskan mekanismenya melampaui teks.
- source_word: וְנִסְלַח לוֹ
  choice: orang itu akan diampuni
  rationale: Bentuk pasif mempertahankan Niphal Ibrani dan menyatakan hasil bagi pelanggar tanpa menyebut pelaku pengampunan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Hubungan antara tindakan pendamaian oleh imam dan pengampunan
  choice: Imam harus mengadakan pendamaian bagi orang itu, dan orang itu akan diampuni.
  alternative: Imam harus melakukan penghapusan dosa baginya, dan kesalahannya akan diampuni.
  rationale: Teks menghubungkan pelayanan ritual imam dengan pengampunan, tetapi tidak menguraikan mekanisme teologisnya. Rumusan yang dipilih mempertahankan urutan dan ketegangan tersebut tanpa memasukkan penjelasan doktrinal tambahan.
- issue: Makna ungkapan רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan bagi TUHAN
  alternative: aroma yang menenteramkan bagi TUHAN
  rationale: Pilihan ini mempertahankan bahasa antropomorfis dan formula kurban sebagaimana adanya, sementara catatan kaki menjelaskan fungsi budayanya sebagai ungkapan penerimaan tanpa menggantikan metafora dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan kalimat prosedural yang mudah dipahami. Istilah ritual “mazbah” dan “mengadakan pendamaian” dipertahankan karena tepat dan dikenal dalam konteks Imamat; ejaan modern “kurban” digunakan. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
