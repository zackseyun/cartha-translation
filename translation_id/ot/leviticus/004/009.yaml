base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: id
  text: dan kedua ginjal, serta lemak yang ada pada kedua ginjal itu, yang berada di bagian pinggang, dan bagian tambahan pada hati[a], harus dipisahkannya bersama kedua ginjal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cuping hati”. Istilah Ibrani untuk bagian anatomi ini tidak pasti; “bagian tambahan” merupakan terjemahan yang berhati-hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Menjaga penyebutan konkret mengenai dua ginjal dalam petunjuk kurban dan terdengar alami dalam bahasa Indonesia.
- source_word: הַחֵלֶב
  choice: lemak
  rationale: Dalam konteks kurban Imamat, kata ini menunjuk pada bagian berlemak yang dikhususkan untuk persembahan; “lemak” jelas dan mudah dipahami.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: yang ada padanya
  rationale: Klausa relatif ini menerangkan lemak yang berada pada kedua ginjal; bentuk “padanya” mempertahankan gaya ringkas teks sumber.
- source_word: הַכְּסָלִים
  choice: bagian pinggang
  rationale: Istilah ini menunjuk pada daerah pinggang atau rusuk bawah; “bagian pinggang” cukup konkret tanpa memberi ketepatan anatomis yang tidak pasti.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: bagian tambahan pada hati
  rationale: Identitas tepat bagian anatomis ini tidak pasti. “Bagian tambahan” merupakan padanan berhati-hati, sedangkan “pada hati” mencerminkan preposisi Ibrani.
- source_word: עַל הַכְּלָיוֹת
  choice: bersama kedua ginjal
  rationale: Dalam rumus petunjuk kurban ini, frasa tersebut paling wajar dipahami sebagai pemisahan bagian hati itu bersama ginjal, sambil tidak menuntut hubungan anatomis yang terlalu spesifik.
- source_word: יְסִירֶנָּה
  choice: bagian tambahan itu harus dipisahkannya
  rationale: Akhiran feminin tunggal paling dekat merujuk pada יוֹתֶרֶת, bagian tambahan pada hati. “Harus dipisahkannya” mempertahankan gaya prosedural-hukum dan tindakan menyingkirkan bagian tersebut dari hewan.
