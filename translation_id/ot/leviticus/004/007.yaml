reference: Leviticus 4:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: id
  text: Imam harus membubuhkan sebagian darah itu pada tanduk-tanduk mazbah dupa wangi yang ada di dalam Kemah Pertemuan, di hadapan Yahweh. Seluruh darah lembu jantan itu[a] harus ia curahkan ke dasar mazbah kurban bakaran yang berada di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh darah lembu jantan itu.” Karena sebagian darah sudah dibubuhkan pada tanduk-tanduk mazbah, dalam konteks ini yang dimaksud adalah seluruh darah yang masih tersisa.
    reason: Menjelaskan hubungan antara ungkapan harfiah teks Ibrani dan urutan tindakan ritual.
lexical_decisions:
- source_word: וְנָתַן
  choice: harus membubuhkan
  rationale: Dalam petunjuk ritual ini, נָתַן menyatakan tindakan menaruh atau mengoleskan darah pada tanduk mazbah. “Membubuhkan” terdengar alami dan cukup konkret tanpa menentukan cara penerapannya secara berlebihan.
- source_word: מִן הַדָּם
  choice: sebagian darah itu
  rationale: Preposisi מִן bersifat partitif di sini, sehingga menyatakan bahwa hanya sebagian dari darah tersebut yang digunakan.
- source_word: קַרְנוֹת
  choice: tanduk-tanduk
  rationale: Bentuk jamak dipertahankan dan istilah tradisional untuk tonjolan pada sudut-sudut mazbah tetap digunakan.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: mazbah dupa wangi
  rationale: Frasa konstruksi ini menunjuk kepada mazbah untuk dupa yang terbuat dari bahan-bahan harum. “Dupa wangi” mempertahankan unsur aromatik dan tetap mudah dipahami.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini mempertahankan nuansa ruang dan liturgis, yakni mazbah itu berada di hadapan atau dalam hadirat Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks Ibrani.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan ini jelas, mapan, dan mempertahankan fungsi kemah sebagai tempat pertemuan yang ditetapkan.
- source_word: כָּל דַּם הַפָּר
  choice: seluruh darah lembu jantan itu
  rationale: Terjemahan ini mengikuti bunyi eksplisit teks Ibrani, “seluruh darah lembu jantan,” tanpa menyisipkan kata “sisanya”; implikasi kontekstual dijelaskan dalam catatan kaki.
- source_word: יִשְׁפֹּךְ
  choice: harus ia curahkan
  rationale: Kata שׁפך dalam konteks persembahan menyatakan tindakan mencurahkan cairan. Susunan ini mempertahankan pelaku tunggal, yaitu imam.
- source_word: אֶל יְסוֹד
  choice: ke bagian dasar
  rationale: יְסוֹד menunjuk kepada dasar atau fondasi mazbah, sedangkan אֶל menyatakan arah pencurahan.
- source_word: מִזְבַּח הָעֹלָה
  choice: mazbah kurban bakaran
  rationale: Istilah ini membedakan mazbah luar untuk kurban bakaran dari mazbah dupa yang disebut sebelumnya.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pintu masuk Kemah Pertemuan
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk; “pintu masuk” merupakan ungkapan Indonesia yang alami dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian secara langsung. Bentuk “Yahweh” mempertahankan statusnya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna כָּל דַּם הַפָּר setelah sebagian darah telah digunakan
  choice: seluruh darah lembu jantan itu, dengan catatan konteks
  alternative: seluruh sisa darah lembu jantan itu
  rationale: Bahasa Ibrani secara eksplisit mengatakan “seluruh darah lembu jantan,” meskipun alur ritual menunjukkan bahwa yang dicurahkan adalah darah yang masih tersisa. Teks utama mempertahankan bentuk sumber, sedangkan catatan kaki menjelaskan implikasi konteks tanpa menghapus ketegangan ungkapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Harus” menyampaikan daya wajib dari petunjuk ritual; “mazbah,” “dupa,” dan “kurban bakaran” dipakai sebagai istilah keagamaan yang tetap dapat dipahami pembaca umum. Susunan keterangan tempat diatur agar jelas bahwa mazbah dupa berada di dalam Kemah Pertemuan dan di hadapan Yahweh.
