  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; nama ini juga ditransliterasikan sebagai “Yehovah” atau “Jehovah”.'
    reason: Menjelaskan bentuk konsonantal Ibrani dari nama ilahi serta transliterasi alternatif yang umum.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam rumusan pengantar perkataan ilahi, bahasa Indonesia secara alami dan bermartabat memakai “berfirman”; pilihan ini tetap menunjukkan tindakan berbicara tanpa menambahkan isi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: אֶל menandai pihak yang dituju dalam komunikasi; “kepada Musa” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak dinyatakan tersendiri
  rationale: Infinitif לֵאמֹר memperkenalkan isi firman yang langsung menyusul. Dalam bahasa Indonesia modern, fungsi ini sudah tersampaikan secara alami oleh verba “berfirman” dan tanda baca; menerjemahkannya sebagai “demikian” dapat terasa kaku dan seolah-olah menambah penunjuk yang tidak eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu secara transparan tanpa menggantinya dengan gelar atau memakai bentuk transliterasi alternatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. “Berfirman” dipilih sebagai ungkapan lazim untuk perkataan Allah. Koma akhir menunjukkan bahwa ayat berikutnya memuat isi firman.
