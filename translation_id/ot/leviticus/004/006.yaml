  source_fidelity: 'Teks Indonesia dengan setia menyampaikan urutan tindakan ritual: imam mencelupkan jari ke dalam darah, memercikkan darah tujuh kali, dan melakukannya di hadapan Yahweh ke arah/depan tirai. Frasa “sebagian darah itu” menyampaikan fungsi partitif מִן־הַדָּם secara wajar. Dua keterangan lokasi, “di hadapan Yahweh” dan “di depan tirai tempat kudus,” mempertahankan unsur yang berbeda dalam teks Ibrani tanpa menambahkan rincian arsitektural.'
  naturalness: Bahasa baku, jelas, dan mengalir untuk pembaca Indonesia modern. “Imam itu harus …, lalu …” sesuai register instruksi ritual. Pengulangan “darah itu” dapat dipertahankan demi kejelasan rujukan dan tidak terasa janggal.
  terminology: “Imam,” “memercikkan,” “Yahweh,” dan “tirai tempat kudus” konsisten dengan konteks kultis dan pilihan istilah yang tidak terlalu teknis. Catatan kaki pada penanda [a] ditempatkan tepat setelah frasa yang dijelaskan dan dengan aman memberi alternatif “tirai Ruang Kudus,” tanpa memaksakan pembacaan arsitektural tertentu ke dalam teks utama.
