id: LEV.4.6
reference: Leviticus 4:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: id
  text: Imam itu harus mencelupkan jarinya ke dalam darah itu, lalu memercikkan sebagian darah itu tujuh kali di hadapan Yahweh, di depan tirai tempat kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tirai Ruang Kudus.”
    reason: Frasa הַקֹּדֶשׁ dapat dibaca sebagai sebutan teknis bagi Ruang Kudus, bukan sekadar keterangan umum “tempat kudus”.
lexical_decisions:
- source_word: וְטָבַל
  choice: harus mencelupkan
  rationale: Dalam rangkaian petunjuk ritual, bentuk ini melanjutkan tindakan yang diwajibkan; “mencelupkan” menyampaikan arti dasar טבל secara alami.
- source_word: הַכֹּהֵן
  choice: imam itu
  rationale: Nomina tunggal definit ini menunjuk kepada imam yang melaksanakan ritual tersebut.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: jarinya ke dalam darah itu
  rationale: Akhiran orang ketiga tunggal pada אֶצְבָּע berarti “jarinya”; preposisi ב menunjukkan darah sebagai zat tempat jari dicelupkan, yang secara idiomatis dinyatakan “ke dalam” dalam bahasa Indonesia.
- source_word: וְהִזָּה
  choice: lalu memercikkan
  rationale: Dalam konteks ritual keimaman, bentuk Hifil dari נזה menunjuk pada tindakan memercikkan; “lalu” mengalirkan urutan tindakan secara wajar.
- source_word: מִן־הַדָּם
  choice: sebagian darah itu
  rationale: 'מִן bersifat partitif: yang dipercikkan adalah sejumlah darah yang diambil dari darah tersebut.'
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan langsung dan alami bagi ungkapan bilangan adverbial ini.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan orientasi ruang sekaligus kehadiran kultis; nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: di depan tirai tempat kudus
  rationale: פְּנֵי menunjuk pada sisi depan atau arah menghadap suatu benda, פָּרֹכֶת adalah tirai pemisah di Kemah Suci, dan הַקֹּדֶשׁ menerangkan kawasan kudus yang terkait dengannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat nama ilahi secara langsung; “Yahweh” mempertahankan fungsinya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna kultis פָּרֹכֶת הַקֹּדֶשׁ
  choice: tirai tempat kudus
  alternative: tirai Ruang Kudus
  rationale: Frasa Ibrani dapat dipahami secara umum sebagai tirai yang berkaitan dengan kawasan kudus atau secara lebih teknis sebagai tirai Ruang Kudus. Teks utama memakai ungkapan yang alami tanpa menetapkan pembagian arsitektural lebih jauh daripada yang diwajibkan oleh frasa tersebut; alternatif teknis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ritual yang bermartabat. Susunan tindakan dibuat jelas melalui “lalu”, sementara istilah yang terlalu teknis dihindari dalam teks utama. Pengulangan “darah itu” dipertahankan demi kejelasan rujukan.
