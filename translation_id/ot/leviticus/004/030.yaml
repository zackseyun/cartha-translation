  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: id
  text: Kemudian imam harus mengambil sebagian darahnya[a] dengan jarinya dan membubuhkannya pada tanduk-tanduk mazbah kurban bakaran[b]. Lalu ia harus mencurahkan seluruh darahnya[c] ke dasar mazbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari darahnya.” Ungkapan Ibrani secara harfiah berbunyi “dari darahnya” dan di sini kemungkinan berarti bahwa imam mengambil sebagian darah itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tanduk-tanduk mazbah kurban bakaran,” yaitu tonjolan berbentuk tanduk pada sudut-sudut mazbah.
    reason: cultural_note
  - marker: c
    text: Walaupun teks Ibrani mengatakan “seluruh darahnya,” urutan tindakannya mengisyaratkan bahwa darah yang masih tersisa dicurahkan setelah sebagian dibubuhkan dengan jari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Dalam rangkaian petunjuk ritual, bentuk verba ini menyatakan tindakan yang diwajibkan berikutnya, bukan peristiwa lampau.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan langsung bagi petugas ibadah yang disebut secara definit dalam konteks ini.
- source_word: מִדָּמָהּ
  choice: sebagian darahnya
  rationale: 'Preposisi מִן paling wajar dipahami secara partitif: imam mengambil sebagian dari darah hewan itu untuk dibubuhkan pada mazbah.'
- source_word: בְּאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: Prefiks בְּ menyatakan alat atau sarana yang dipakai.
- source_word: וְנָתַן
  choice: dan membubuhkannya
  rationale: נתן secara dasar berarti memberi atau menaruh; 'membubuhkan' alami dalam konteks mengoleskan sedikit darah pada bagian mazbah tanpa terlalu menjelaskan caranya.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: pada tanduk-tanduk mazbah kurban bakaran
  rationale: Istilah kultis 'tanduk-tanduk' dipertahankan secara harfiah, dan rangkaian konstruksi mengidentifikasi mazbah yang digunakan untuk kurban bakaran.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: seluruh darahnya
  rationale: כָּל berarti 'seluruh'. Teks utama mempertahankan bentuk komprehensif bahasa Ibrani, sementara konteks urutan ritual diterangkan dalam catatan kaki.
- source_word: יִשְׁפֹּךְ
  choice: harus mencurahkan
  rationale: Dalam konteks pengurbanan, שׁפך berarti mencurahkan; 'harus' menyampaikan daya preskriptif petunjuk ritual.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: ke dasar mazbah
  rationale: יְסוֹד berarti dasar atau fondasi; 'dasar' merupakan padanan alami untuk bagian bawah mazbah.
theological_decisions:
- issue: Aspek verba dalam petunjuk ritual
  choice: 'Diterjemahkan sebagai kewajiban prosedural: ''harus mengambil ... harus mencurahkan'''
  alternative: 'Diterjemahkan sebagai narasi lampau: ''mengambil ... membubuhkan ... mencurahkan'''
  rationale: Ayat ini berada dalam ketentuan ritual, sehingga bentuk-bentuk verba menyatakan prosedur yang harus dilakukan, bukan satu kejadian historis.
- issue: Istilah kultis bagi tonjolan pada mazbah
  choice: Mempertahankan ungkapan harfiah 'tanduk-tanduk'
  alternative: Menggantikannya dengan 'sudut-sudut' atau 'tonjolan-tonjolan'
  rationale: Bahasa Ibrani memakai istilah kultis yang konkret dan khas. Mempertahankannya menjaga citra teks tanpa memaksakan penafsiran simbolis.
- issue: Ketegangan antara 'sebagian darah' dan 'seluruh darah'
  choice: Mempertahankan 'seluruh darahnya' dalam teks utama dan menjelaskan urutannya dalam catatan kaki
  alternative: Mengubahnya menjadi 'sisa darahnya'
  rationale: Konteks mengisyaratkan bahwa yang dicurahkan ialah darah yang masih tersisa, tetapi bahasa Ibrani secara eksplisit mengatakan 'seluruh darahnya'. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah tradisional 'mazbah' dipertahankan untuk מִזְבֵּחַ karena merupakan benda kultis khusus, sedangkan susunan kalimat dibuat lugas agar prosedur ritual mudah diikuti. Semua penjelasan yang melampaui bentuk eksplisit bahasa Ibrani ditempatkan dalam catatan kaki.
