  source_fidelity: 'Teks Indonesia dengan tepat mempertahankan urutan prosedural Ibrani: imam mengambil sebagian darah dengan jarinya, membubuhkannya pada tanduk-tanduk mazbah kurban bakaran, lalu mencurahkan seluruh darahnya ke dasar mazbah. Nuansa preskriptif konteks hukum-ritual tersampaikan melalui “harus.” Partitivitas מִדָּמָהּ diterjemahkan secara wajar sebagai “sebagian darahnya,” sedangkan כָּל דָּמָהּ tetap dipertahankan sebagai “seluruh darahnya,” tanpa memasukkan “sisa” ke dalam teks utama.'
