id: LEV.4.15
reference: Leviticus 4:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: id
  text: Para tua-tua umat itu harus menumpangkan tangan mereka pada kepala lembu jantan itu di hadapan Yahweh, lalu seseorang[a] harus menyembelih lembu jantan itu di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lalu ia harus menyembelih.” Bahasa Ibrani beralih dari “para tua-tua” yang jamak kepada kata kerja tunggal tanpa menyebut dengan jelas siapa pelakunya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: harus menumpangkan
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan ritual menaruh atau menekankan tangan pada hewan persembahan. “Menumpangkan tangan” merupakan ungkapan Indonesia yang alami dan tepat untuk tindakan ini.
- source_word: זִקְנֵי הָעֵדָה
  choice: para tua-tua umat itu
  rationale: זִקְנֵי berarti para tua-tua, sedangkan עֵדָה menunjuk pada umat atau perhimpunan Israel sebagai komunitas. “Umat” jelas bagi pembaca modern dan mempertahankan sifat komunalnya.
- source_word: אֶת יְדֵיהֶם
  choice: tangan mereka
  rationale: Mempertahankan bentuk jamak dan akhiran orang ketiga jamak dari bahasa Ibrani tanpa menentukan apakah masing-masing menggunakan satu atau kedua tangan.
- source_word: עַל רֹאשׁ הַפָּר
  choice: pada kepala lembu jantan itu
  rationale: Terjemahan langsung dan alami dari ungkapan tempat tersebut; פַּר berarti lembu jantan, tanpa keharusan menambahkan keterangan usia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti di hadapan atau dalam kehadiran. “Di hadapan” sesuai dengan konteks peribadatan dan idiom bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וְשָׁחַט
  choice: lalu seseorang harus menyembelih
  rationale: Kata kerja berbentuk tunggal sesudah subjek jamak, tetapi subjek tunggalnya tidak dinyatakan. “Seseorang” mempertahankan ketunggalan sekaligus tidak mengidentifikasi pelakunya secara pasti; “menyembelih” tepat bagi tindakan kurban.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama diri.
- issue: Peralihan dari subjek jamak kepada kata kerja tunggal וְשָׁחַט
  choice: seseorang harus menyembelih
  alternative: mereka harus menyembelih; lembu jantan itu harus disembelih; ia harus menyembelih
  rationale: Bahasa Ibrani beralih dari “para tua-tua” yang jamak kepada kata kerja orang ketiga tunggal tanpa menyebut subjek baru. Terjemahan impersonal tunggal menjaga peralihan itu dan tidak menetapkan apakah pelakunya seorang tua-tua, wakil tertentu, atau orang lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat jelas tanpa menjadi teknis berlebihan. Penanda catatan kaki ditempatkan setelah kalimat yang memuat peralihan jumlah pada kata kerja.
