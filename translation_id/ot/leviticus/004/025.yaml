- from: Kemudian imam harus mengambil sebagian darah kurban penghapus dosa itu dengan jarinya dan membubuhkannya pada tanduk-tanduk mazbah kurban bakaran.[a] Darah yang selebihnya harus ia curahkan ke dasar mazbah kurban bakaran.
  to: Kemudian imam harus mengambil sebagian darah kurban dosa itu dengan jarinya dan mengoleskannya pada tanduk-tanduk mazbah kurban bakaran.[a] Lalu ia harus mencurahkan sisa darahnya di bagian dasar mazbah kurban bakaran.
  rationale: Revisi mempertahankan seluruh unsur prosedural teks Ibrani dan ambiguitas leksikal חַטָּאת. “Kurban dosa” menggantikan ungkapan yang lebih interpretatif, sedangkan “mengoleskannya” dan “di bagian dasar” meningkatkan ketepatan tindakan dan kelancaran bahasa Indonesia.
