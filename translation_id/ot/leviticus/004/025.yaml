review_pass:
  verdict: revise
  source_fidelity: Teks menangkap urutan prosedural, bagian darah yang diambil, penggunaan jari imam, tanduk-tanduk mazbah, serta pencurahan darah di dasar mazbah. Namun, “kurban penghapus dosa” dapat terdengar seolah-olah menyatakan fungsi penghapusan dosa secara lebih tegas daripada kategori kurban yang dinyatakan oleh חַטָּאת; “kurban dosa” lebih langsung dan netral. Selain itu, אֶל lebih baik diterjemahkan “di/ke bagian dasar” daripada sekadar “ke dasar” agar lokasi ritualnya jelas dan alami.
  naturalness: Bahasa draft umumnya baku dan jelas. “Membubuhkannya” dapat dipakai, tetapi “mengoleskannya” lebih lazim untuk penerapan darah dengan jari dan mempertahankan tindakan konkret. “Darah yang selebihnya harus ia curahkan” juga agak bertanda; susunan “lalu mencurahkan sisa darahnya” lebih mengalir dalam bahasa Indonesia modern.
  terminology: “Mazbah,” “kurban bakaran,” dan “tanduk-tanduk” tepat serta konsisten dengan register ritual. Mengganti “kurban penghapus dosa” dengan “kurban dosa” menjaga istilah utama tetap dekat dengan kategori Ibrani tanpa memaksakan penjelasan teologis. Alternatif “kurban pemurnian” patut dipertahankan dalam catatan kaki.
  issues:
  - severity: medium
    issue: “Kurban penghapus dosa” terlalu eksplikatif untuk חַטָּאת.
    rationale: Istilah Ibrani menunjuk pada jenis kurban; walaupun berkaitan dengan dosa dan pemurnian, frasa “penghapus dosa” lebih mudah dibaca sebagai penetapan fungsi atau mekanisme teologis. “Kurban dosa” adalah padanan yang lebih langsung dan netral.
  - severity: low
    issue: “Membubuhkannya” kurang spesifik dan kurang idiomatis dibanding “mengoleskannya.”
    rationale: Dalam konteks darah yang diterapkan dengan jari pada tanduk mazbah, “mengoleskannya” menyampaikan tindakan fisik yang dimaksud secara alami.
  - severity: low
    issue: “Ke dasar mazbah” dapat diperjelas menjadi “di bagian dasar mazbah.”
    rationale: יְסוֹד menunjuk pada bagian dasar/fondasi mazbah sebagai tempat pencurahan; bentuk ini lebih jelas sebagai lokasi dan lebih alami dalam bahasa Indonesia.
