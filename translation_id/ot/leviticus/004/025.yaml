  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: id
  text: Kemudian imam harus mengambil sebagian darah kurban dosa itu dengan jarinya dan mengoleskannya pada tanduk-tanduk mazbah kurban bakaran.[a] Lalu ia harus mencurahkan sisa darahnya di bagian dasar mazbah kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban pemurnian.” Istilah Ibrani ini dapat menunjuk pada kurban yang berkaitan dengan penghapusan kenajisan maupun dosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Bentuk waw + qatal melanjutkan urutan petunjuk ritual; 'Kemudian' menyampaikan tahap berikutnya secara alami dalam bahasa Indonesia.
- source_word: מִדַּם
  choice: sebagian darah
  rationale: 'Preposisi מִן bersifat partitif: hanya sebagian darah yang diambil untuk dibubuhkan.'
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks hukum kurban, kata ini menunjuk pada kurban yang berkaitan dengan dosa, bukan pada konsep dosa secara abstrak. Ungkapan ini jelas bagi pembaca Indonesia dan tetap mempertahankan kategori ritual tradisional.
- source_word: בְּאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: Preposisi בְּ menyatakan alat; imam menggunakan jarinya dalam tindakan tersebut.
- source_word: וְנָתַן עַל
  choice: membubuhkannya pada
  rationale: '''Membubuhkan'' mengungkapkan tindakan menaruh atau mengoleskan darah pada bagian mazbah secara wajar dan bermartabat.'
- source_word: קַרְנוֹת
  choice: tanduk-tanduk
  rationale: Kata ini merujuk pada tonjolan berbentuk tanduk di sudut-sudut mazbah; istilah konkret dari teks sumber dipertahankan.
- source_word: מִזְבַּח הָעֹלָה
  choice: mazbah kurban bakaran
  rationale: Frasa ini menunjuk pada mazbah luar yang digunakan bagi kurban bakaran; bentuk Indonesia ini ringkas dan tepat.
- source_word: וְאֶת־דָּמוֹ יִשְׁפֹּךְ
  choice: Darah yang selebihnya harus ia curahkan
  rationale: Karena sebagian darah telah diambil, 'yang selebihnya' menyatakan implikasi partitif dari urutan ritual tanpa menambahkan tindakan baru.
- source_word: אֶל יְסוֹד
  choice: ke dasar
  rationale: יְסוֹד menunjuk pada bagian dasar atau fondasi mazbah, dan אֶל menyatakan arah pencurahan.
theological_decisions:
- issue: Pemaknaan חַטָּאת dalam hukum kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani ini dapat menunjuk pada kurban yang berhubungan dengan dosa sekaligus pemurnian. Terjemahan utama mempertahankan kategori yang lazim dan mudah dipahami tanpa menetapkan teori pendamaian tertentu; alternatif yang menekankan fungsi pemurnian dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'mazbah' dipakai untuk membedakan altar kurban Israel dari meja altar dalam pemakaian umum; susunan kalimat mengikuti urutan prosedural teks Ibrani.
