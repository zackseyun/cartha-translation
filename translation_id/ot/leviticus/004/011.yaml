  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: id
  text: Namun, kulit sapi jantan itu, seluruh dagingnya, beserta kepalanya, kakinya, isi perutnya, dan kotorannya—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹר
  choice: kulit
  rationale: Dalam konteks hewan yang telah disembelih, עוֹר menunjuk pada kulitnya; “kulit” merupakan padanan Indonesia yang alami dan tepat.
- source_word: הַפָּר
  choice: sapi jantan itu
  rationale: פַּר menunjuk pada sapi jantan, kerap yang masih muda. Konteks telah mengidentifikasi hewan tersebut, sehingga bentuk definit “sapi jantan itu” tepat tanpa perlu menambahkan usia yang tidak ditekankan di sini.
- source_word: כָּל בְּשָׂרוֹ
  choice: seluruh dagingnya
  rationale: בָּשָׂר secara konkret berarti daging; “seluruh dagingnya” mempertahankan bahasa anatomis dan cakupan כָּל.
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: beserta kepala dan kakinya
  rationale: Dalam rangkaian daftar ini, עַל berfungsi menyertakan bagian-bagian tersebut. “Beserta” menyampaikan hubungan itu secara alami, sedangkan כְּרָעַיִם merujuk pada kaki atau tungkai hewan.
- source_word: קִרְבּוֹ
  choice: isi perutnya
  rationale: Dalam konteks anatomi korban, קֶרֶב menunjuk pada bagian-bagian dalam. “Isi perut” jelas bagi pembaca modern dan tidak menyempitkannya hanya pada usus.
- source_word: פִרְשׁוֹ
  choice: kotorannya
  rationale: פֶּרֶשׁ menunjuk secara khusus pada kotoran atau tahi hewan, bukan pada jeroan secara umum.
