id: LEV.4.24
reference: Leviticus 4:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: id
  text: Ia harus meletakkan tangannya pada kepala kambing jantan itu, lalu menyembelihnya di tempat orang menyembelih kurban bakaran di hadapan Yahweh. Itulah kurban penghapus dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban pemurnian.” Istilah Ibrani חַטָּאת dapat berarti “dosa” maupun kurban yang berkaitan dengan penghapusan dosa atau kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Ia harus meletakkan tangannya
  rationale: Ungkapan ritual סמך יד menyatakan tindakan meletakkan tangan pada hewan kurban. Bentuk tunggal 'tangannya' dipertahankan sesuai teks Ibrani.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: pada kepala kambing jantan itu
  rationale: שָׂעִיר menunjuk kambing jantan; unsur definit dalam bahasa Ibrani dinyatakan secara alami dengan 'itu'.
- source_word: וְשָׁחַט אֹתוֹ
  choice: lalu menyembelihnya
  rationale: שׁחט adalah verba baku untuk penyembelihan ritual. 'Lalu' mengungkapkan urutan tindakan secara alami tanpa mengubah hubungan antarklausa.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: di tempat orang menyembelih
  rationale: Konstruksi aktif Ibrani dipertahankan dengan subjek umum 'orang', yang wajar dalam bahasa Indonesia dan tidak menetapkan pelaku tertentu.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עֹלָה adalah jenis kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan yang jelas dan lazim dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti 'di hadapan', sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: חַטָּאת הוּא
  choice: Itulah kurban penghapus dosa
  rationale: Klausa nominal ini menggolongkan hewan tersebut sebagai חַטָּאת. 'Kurban penghapus dosa' menyampaikan fungsi kultis secara alami, sementara kemungkinan makna pemurnian dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Makna kultis חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Dalam hukum kurban, חַטָּאת menamai jenis persembahan yang berkaitan dengan dosa sekaligus penyingkiran kenajisan. Teks utama memakai istilah yang mudah dipahami pembaca umum, sedangkan alternatif yang sah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami; susunan aktif teks Ibrani dipertahankan sejauh alami dalam bahasa Indonesia.
