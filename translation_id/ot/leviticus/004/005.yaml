  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: id
  text: Lalu imam yang diurapi itu harus mengambil sebagian darah lembu jantan tersebut dan membawanya ke dalam Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ke Kemah Pertemuan.” Kata Ibrani yang digunakan biasanya berarti “ke”; terjemahan “ke dalam” mengikuti konteks ritual karena tindakan selanjutnya berlangsung di dalam tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Lalu ... harus mengambil
  rationale: Dalam rangkaian petunjuk kurban, bentuk waw + qatal ini menyatakan tindakan prosedural berikutnya. “Lalu” menandai urutan, sedangkan “harus” menyampaikan daya instruksionalnya secara wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: imam yang diurapi itu
  rationale: Terjemahan ini mempertahankan arti leksikal מָשִׁיחַ, yaitu “yang diurapi,” tanpa menggantinya dengan gelar interpretatif “imam besar” atau memasukkan pengertian mesianik di luar konteks jabatan imamat ini.
- source_word: מִדַּם הַפָּר
  choice: sebagian darah lembu jantan tersebut
  rationale: 'Preposisi מִן paling mungkin bersifat partitif di sini: imam mengambil sebagian dari darah, bukan seluruhnya. פַּר secara khusus menunjuk kepada lembu jantan.'
- source_word: וְהֵבִיא אֹתוֹ
  choice: dan membawanya
  rationale: Akhiran objek tunggal mengacu kembali kepada darah sebagai nomina massa. Daya instruksional “harus” pada predikat pertama secara alami mencakup tindakan kedua yang terkoordinasi.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: ke dalam Kemah Pertemuan
  rationale: אֶל secara leksikal dapat berarti “ke,” tetapi konteks ritual dan tindakan pada ayat-ayat selanjutnya menunjukkan bahwa darah dibawa masuk ke ruang kemah. “Kemah Pertemuan” merupakan padanan baku dan jelas bagi אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Penerjemahan הַכֹּהֵן הַמָּשִׁיחַ dalam konteks imamat
  choice: imam yang diurapi itu
  alternative: imam besar; imam yang ditahbiskan
  rationale: Pilihan ini mempertahankan kata Ibrani “yang diurapi” dan status jabatan yang dinyatakannya, tanpa menambahkan gelar yang tidak tertulis atau memasukkan makna kristologis ke dalam konteks ini.
- issue: Arah gerak pada אֶל אֹהֶל מוֹעֵד
  choice: ke dalam Kemah Pertemuan
  alternative: ke Kemah Pertemuan
  rationale: “Ke dalam” membuat implikasi masuk yang dituntut oleh rangkaian ritual menjadi jelas, tetapi catatan kaki tetap menjaga bentuk yang lebih harfiah dan ambiguitas leksikal אֶל.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sebagai petunjuk ritual. Penunjuk “itu/tersebut” membantu mempertahankan sifat definit dari nomina Ibrani dan rujukan kepada lembu jantan yang telah disebut sebelumnya.
