  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: id
  text: Jika segenap umat Israel berbuat dosa tanpa sengaja[a], dan perkara itu luput dari perhatian jemaah[b], lalu mereka melakukan salah satu hal yang dilarang oleh perintah-perintah Yahweh, dan mereka menjadi bersalah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai di sini menunjuk pada dosa karena kekeliruan atau yang dilakukan tanpa sengaja, bukan pembangkangan yang disengaja.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “perkara itu tersembunyi dari mata jemaah,” yaitu perkara tersebut tidak diketahui atau tidak disadari oleh jemaah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: segenap umat Israel
  rationale: עֵדָה menunjuk kepada seluruh komunitas Israel. “Umat” alami dalam bahasa Indonesia dan tetap dapat dibedakan dari הַקָּהָל, yang diterjemahkan “jemaah” kemudian dalam ayat ini.
- source_word: יִשְׁגּוּ
  choice: berbuat dosa tanpa sengaja
  rationale: Dalam peraturan persembahan di Imamat 4, שׁגה menunjuk pada kekeliruan atau dosa yang tidak disengaja, bukan pembangkangan yang dilakukan dengan sengaja.
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: dan perkara itu luput dari perhatian jemaah
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa perkara itu “tersembunyi dari mata” jemaah. Terjemahan ini menyampaikan idiom persepsi tersebut dengan bahasa Indonesia yang alami.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: lalu mereka melakukan salah satu dari segala hal yang Yahweh perintahkan untuk tidak dilakukan
  rationale: Frasa ini menggambarkan dilakukannya satu tindakan dari keseluruhan kategori tindakan yang dilarang dalam perintah-perintah Yahweh. Susunan ini mempertahankan cakupan מִכָּל tanpa membuat bahasa Indonesia terlalu harfiah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וְאָשֵׁמוּ
  choice: sehingga mereka menjadi bersalah
  rationale: Kata kerja ini menyatakan keadaan bersalah atau tertanggungnya kesalahan sebagai akibat pelanggaran. “Sehingga” memperjelas hubungan akibat yang tersirat dalam rangkaian hukum tersebut.
theological_decisions:
- issue: Sifat dosa yang dinyatakan oleh שׁגה
  choice: dosa tanpa sengaja
  alternative: tersesat; keliru
  rationale: Konteks Imamat 4 membahas pelanggaran yang dilakukan karena kekeliruan atau tanpa sengaja. Terjemahan ini tidak memperluasnya menjadi pemberontakan yang disengaja.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri.
- issue: Hubungan וְאָשֵׁמוּ dengan tindakan sebelumnya
  choice: sehingga mereka menjadi bersalah
  alternative: dan mereka menjadi bersalah; dan mereka menanggung kesalahan
  rationale: Konteks mendukung hubungan akibat, tetapi catatan kaki mempertahankan kemungkinan pembacaan koordinatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Umat” dan “jemaah” dipakai untuk mencerminkan perbedaan antara עֵדָה dan קָהָל tanpa memberi kesan bahwa keduanya adalah kelompok yang sepenuhnya berbeda. Struktur kalimat dipertahankan sebagai protasis hukum yang berlanjut ke ayat berikutnya.
