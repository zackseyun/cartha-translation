  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: id
  text: Ia harus memisahkan seluruh lemaknya, sebagaimana lemak anak domba dipisahkan dari kurban persembahan keselamatan. Lalu imam harus membakar bagian-bagian lemak itu di atas mazbah, di atas persembahan-persembahan bagi Yahweh yang dipersembahkan melalui api.[a] Dengan demikian, imam mengadakan pendamaian baginya atas dosa yang telah dilakukannya, dan ia akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di atas korban-korban api bagi Yahweh.” Ungkapan Ibrani ini merupakan istilah teknis dalam tata cara kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: lemaknya / lemak
  rationale: Istilah ini menunjuk pada lemak hewan yang secara khusus dipisahkan untuk dipersembahkan. 'Lemak' mempertahankan arti leksikal yang lugas.
- source_word: יָסִיר / יוּסַר
  choice: harus memisahkan / dipisahkan
  rationale: Dalam tata cara kurban, bentuk verba ini berarti menyingkirkan atau memisahkan lemak dari hewan. 'Memisahkan' terdengar alami dan menjelaskan tindakan ritualnya.
- source_word: הַכֶּשֶׂב
  choice: anak domba
  rationale: Dalam konteks kurban, כֶּשֶׂב paling wajar menunjuk pada anak domba, bukan kategori umum 'domba'.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban persembahan keselamatan
  rationale: Terjemahan ini mempertahankan זֶבַח sebagai 'kurban' dan שְׁלָמִים sebagai nama kategori ritual. 'Persembahan keselamatan' cukup transparan dalam bahasa Indonesia dan tidak membatasi istilah itu hanya pada makna persekutuan.
- source_word: וְהִקְטִיר
  choice: harus membakar
  rationale: Dalam konteks mazbah, verba ini berarti membakar persembahan sehingga asapnya naik. 'Membakar' jelas dan idiomatis.
- source_word: אֹתָם
  choice: bagian-bagian lemak itu
  rationale: Pronomina Ibrani berbentuk jamak maskulin. Ungkapan eksplisit ini mempertahankan bentuk jamak dan menghindari ketidakjelasan rujukan dalam bahasa Indonesia.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Walaupun akhiran direktif dapat menyatakan gerak menuju, konteks pembakaran kurban menuntut lokasi tindakan, yakni di atas mazbah.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: di atas persembahan yang dibakar bagi Yahweh
  rationale: אִשֵּׁי adalah istilah teknis untuk persembahan melalui api. Terjemahan ini mempertahankan unsur api dan membiarkan עַל bermakna penempatan 'di atas'; alternatif teknis dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: וְכִפֶּר עָלָיו
  choice: mengadakan pendamaian baginya
  rationale: Ungkapan ini mempertahankan kategori ritual-teologis כפר tanpa menentukan satu teori sistematis tertentu mengenai cara kerja pendamaian.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: atas dosa yang telah dilakukannya
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan tetap menunjukkan dosa tertentu yang menjadi perkara pendamaian.
- source_word: וְנִסְלַח לוֹ
  choice: ia akan diampuni
  rationale: Bentuk pasif Niphal menyatakan hasil ritual bagi orang yang berdosa. 'Ia akan diampuni' mempertahankan bentuk pasif dan terdengar alami.
theological_decisions:
- issue: Bahasa pendamaian dalam ritual kurban
  choice: mengadakan pendamaian baginya
  alternative: mengadakan penghapusan dosa baginya
  rationale: '''Pendamaian'' mempertahankan keluasan makna kultis כפר dan tidak mempersempit ayat kepada satu penjelasan teologis tertentu.'
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi. 'Yahweh' mempertahankannya, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Makna זֶבַח הַשְּׁלָמִים
  choice: kurban persembahan keselamatan
  alternative: kurban persembahan persekutuan
  rationale: Makna tepat שְׁלָמִים memiliki keluasan dan perdebatan. 'Keselamatan' mempertahankan kaitannya dengan akar שׁלם tanpa menetapkan bahwa persekutuan merupakan satu-satunya nuansa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. 'Mazbah' dipertahankan sebagai istilah ritual Alkitab yang mapan. Pengulangan dan hubungan prosedural diringkas secara alami tanpa menghilangkan rincian sumber; bentuk jamak אֹתָם dibuat eksplisit sebagai 'bagian-bagian lemak itu'.
