  text: וְ/הוֹצִ֣יא אֶת הַ/פָּ֗ר אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/שָׂרַ֣ף אֹת֔/וֹ כַּ/אֲשֶׁ֣ר שָׂרַ֔ף אֵ֖ת הַ/פָּ֣ר הָ/רִאשׁ֑וֹן חַטַּ֥את הַ/קָּהָ֖ל הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: id
  text: Ia harus membawa lembu jantan itu ke luar perkemahan dan membakarnya, sama seperti ia membakar lembu jantan yang pertama. Itulah korban penghapus dosa[a] bagi jemaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban pemurnian.” Istilah Ibrani yang diterjemahkan “korban penghapus dosa” dapat menekankan fungsi korban itu dalam menyingkirkan kenajisan sekaligus menangani dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ia harus membawa ... ke luar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan membawa atau mengeluarkan sesuatu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah perpindahan bangkai korban.
- source_word: הַפָּר
  choice: lembu jantan itu
  rationale: פַּר menunjuk pada lembu jantan, sering kali yang masih muda. 'Lembu jantan' cukup tepat tanpa menambahkan rincian usia yang tidak tegas dalam konteks ini.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Rangkaian preposisi ini menyatakan gerak menuju tempat di luar batas perkemahan. 'Ke luar perkemahan' ringkas dan idiomatis.
- source_word: וְשָׂרַף אֹתוֹ
  choice: dan membakarnya
  rationale: שׂרף adalah verba umum untuk membakar. Bentuk ini meneruskan kewajiban yang dinyatakan oleh 'harus' tanpa pengulangan yang kaku.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: sama seperti ia membakar
  rationale: כַּאֲשֶׁר menandai perbandingan dengan prosedur sebelumnya; 'sama seperti' menyatakan kesepadanan itu dengan jelas.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: lembu jantan yang pertama
  rationale: רִאשׁוֹן merujuk kembali kepada lembu yang telah dibahas dalam kasus sebelumnya. 'Yang pertama' mempertahankan rujukan langsung tersebut.
- source_word: חַטַּאת
  choice: persembahan penghapus dosa
  rationale: Dalam peraturan korban, חַטָּאת menunjuk pada korban yang berkaitan dengan dosa dan pemurnian. 'Persembahan penghapus dosa' dapat dipahami pembaca umum, sedangkan alternatif fungsi pemurniannya dicatat dalam catatan kaki.
- source_word: הַקָּהָל
  choice: umat itu
  rationale: קָהָל di sini menunjuk pada seluruh komunitas perjanjian yang diwakili dalam korban tersebut. 'Umat itu' alami dalam bahasa Indonesia dan mempertahankan sifat korporatnya.
- source_word: הוּא
  choice: Itulah
  rationale: Pronomina ini berfungsi mengidentifikasi lembu tersebut sebagai korban bagi umat. 'Itulah' menyampaikan penegasan identifikasi secara alami.
theological_decisions:
- issue: Pemaknaan חַטַּאת dalam hukum korban
  choice: persembahan penghapus dosa
  alternative: persembahan pemurnian
  rationale: Istilah Ibrani dapat menonjolkan penanganan dosa maupun pemurnian dari kenajisan. Dalam ayat ini acuannya jelas berupa hewan korban; terjemahan utama mempertahankan hubungan eksplisit dengan dosa, sementara catatan kaki menjaga alternatif pemurnian agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hukum-ritual yang lugas dan bermartabat. Pronomina 'ia' mempertahankan kesinambungan pelaku dari konteks tanpa menambahkan identitas yang tidak disebut dalam ayat. Penanda catatan kaki [a] ditempatkan pada tindakan membakar sesuai lapisan konsultasi yang diberikan, walaupun catatannya menjelaskan istilah korban pada kalimat berikutnya.
