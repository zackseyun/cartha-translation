base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: id
  text: 'Dari lembu jantan untuk kurban penghapus dosa itu, ia harus mengambil seluruh lemaknya: lemak yang menutupi bagian dalam dan seluruh lemak yang ada pada bagian dalam itu,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembu jantan untuk kurban pemurnian.” Istilah Ibrani חַטָּאת dapat menunjuk pada “dosa” maupun pada kurban yang berkaitan dengan penghapusan kenajisan atau dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: seluruh
  rationale: Mempertahankan daya cakup menyeluruh dari kata Ibrani dan terdengar alami untuk keseluruhan bagian lemak yang ditentukan.
- source_word: חֵלֶב
  choice: lemak
  rationale: Padanan langsung dan wajar dalam konteks anatomi kurban; frasa berikutnya memperjelas bahwa yang dimaksud ialah bagian lemak tertentu.
- source_word: פַּר הַחַטָּאת
  choice: lembu jantan ... untuk kurban penghapus dosa
  rationale: Menyatakan secara alami bahwa lembu jantan itu diperuntukkan bagi kurban tersebut, tanpa menyiratkan bahwa hewan itu sendiri secara metaforis adalah dosa.
- source_word: יָרִים
  choice: harus mengambil
  rationale: Dalam prosedur kurban, verba ini menunjuk pada tindakan mengangkat lalu memisahkan bagian tertentu; 'mengambil' menyampaikan tindakan ritual itu secara jelas dalam bahasa Indonesia.
- source_word: מִמֶּנּוּ
  choice: dari lembu jantan itu
  rationale: Rujukan pronominal dibuat eksplisit agar jelas dan alami dalam bahasa Indonesia.
- source_word: הַמְכַסֶּה
  choice: yang menutupi
  rationale: Mempertahankan fungsi partisip atributif dengan klausa relatif yang alami.
- source_word: קֶרֶב
  choice: isi perut
  rationale: Padanan modern yang konkret dan mudah dipahami bagi organ-organ dalam dalam konteks anatomi kurban.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: yang melekat pada isi perut
  rationale: Mengungkapkan hubungan spasial עַל secara alami sekaligus membedakannya dari lemak yang menutupi organ-organ dalam.
theological_decisions:
- issue: Pemaknaan חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani dapat menunjuk pada dosa maupun kurban yang berkaitan dengan penghapusan dosa atau kenajisan. Terjemahan utama memakai istilah yang dikenal luas, sedangkan alternatif yang menonjolkan fungsi pemurnian dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur prosedural dipertahankan, sementara pengulangan dan hubungan anatominya dibuat jelas tanpa menambahkan tafsiran denominasi.
