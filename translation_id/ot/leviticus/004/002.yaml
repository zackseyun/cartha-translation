id: LEV.4.2
reference: Leviticus 4:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: id
  text: 'Berbicaralah kepada orang Israel[a]: Jika seseorang berbuat dosa tanpa sengaja[b] sehubungan dengan salah satu dari perintah-perintah Yahweh tentang hal-hal yang tidak boleh dilakukan, dengan melakukan salah satu dari hal-hal itu,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; ungkapan ini dapat berarti “keturunan Israel” atau “orang Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini merujuk pada dosa yang dilakukan karena kekeliruan atau tanpa disengaja, bukan dengan sikap menantang.
    reason: lexical_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: Katakanlah
  rationale: Bentuk imperatif yang memperkenalkan perintah ilahi; “Katakanlah kepada” alami dalam bahasa Indonesia untuk menyampaikan pesan kepada suatu kelompok.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk secara kolektif kepada bangsa Israel; “umat Israel” jelas, alami, dan tetap mempertahankan identitas komunalnya.
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Di sini נֶפֶשׁ berarti seorang individu, bukan secara khusus unsur nonjasmani yang disebut “jiwa.”
- source_word: תֶחֱטָא
  choice: berbuat dosa
  rationale: Padanan Indonesia yang langsung dan wajar bagi verba חטא dalam konteks hukum kurban.
- source_word: בִשְׁגָגָה
  choice: tanpa sengaja
  rationale: Menunjukkan tindakan karena kekeliruan atau ketidaksengajaan, bukan pelanggaran yang dilakukan dengan sikap menantang.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: sehubungan dengan salah satu perintah Yahweh
  rationale: Konstruksi מן dalam konteks ini menyatakan hubungan pelanggaran dengan perintah-perintah; “sehubungan dengan” menghindari pemaksaan nuansa “melawan” sambil tetap jelas.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: tentang hal-hal yang tidak boleh dilakukan
  rationale: Mempertahankan sifat impersonal dari klausa relatif dan menjelaskan bahwa yang dimaksud adalah larangan.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: lalu ia melakukan salah satunya
  rationale: Menyatakan bahwa orang tersebut benar-benar melakukan salah satu tindakan terlarang yang baru disebutkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan dosa בִשְׁגָגָה
  choice: tanpa sengaja
  alternative: karena kekhilafan; karena kesalahan
  rationale: Terjemahan ini mempertahankan pembedaan teks antara pelanggaran yang tidak disengaja dan dosa yang dilakukan dengan sikap menantang, tanpa menyatakan bahwa tindakan tersebut bukan dosa.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat hukum bersyarat dipertahankan, tetapi susunannya dibuat alami. “Umat Israel” dipilih dalam teks utama agar mudah dipahami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
