  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: id
  text: dan apabila dosa yang telah mereka lakukan itu diketahui[a], umat itu harus mempersembahkan seekor lembu jantan dari kawanan sapi sebagai kurban penghapus dosa, lalu membawanya ke hadapan Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata Ibrani חַטָּאת (ḥaṭṭā’t) dipakai dua kali dalam ayat ini: pertama dengan arti “dosa”, kemudian dengan arti “kurban penghapus dosa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: menjadi diketahui
  rationale: Bentuk nifal ידע menyatakan bahwa dosa tersebut mulai atau kemudian diketahui tanpa menyebutkan siapa yang mengetahuinya; pilihan ini mempertahankan sifat pasif/inchoatif teks Ibrani.
- source_word: הַחַטָּאת
  choice: dosa
  rationale: Klausa relatif 'yang mereka lakukan' menunjukkan bahwa pemakaian pertama חַטָּאת merujuk pada pelanggaran, bukan persembahan.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: yang mereka lakukan itu
  rationale: Ungkapan ini mengidentifikasi dosa tertentu yang dilakukan umat; 'melakukan dosa' merupakan ungkapan Indonesia yang alami, sedangkan pronomina '-nya' pada עָלֶיהָ tidak perlu diterjemahkan secara kaku.
- source_word: הַקָּהָל
  choice: umat itu
  rationale: Dalam konteks ini קָהָל menunjuk kepada seluruh komunitas Israel yang disebut pada ayat sebelumnya. 'Umat' alami dalam konteks keagamaan dan mempertahankan sifat kolektifnya.
- source_word: וְהִקְרִיבוּ
  choice: harus mempersembahkan
  rationale: Bentuk hifil קרב dalam konteks kurban berarti membawa atau menyajikan sebagai persembahan. 'Mempersembahkan' memberi nuansa kultis dan tetap dibedakan dari kata kerja 'membawa' yang menyusul.
- source_word: פַּר בֶּן בָּקָר
  choice: seekor sapi jantan, anak lembu dari kawanan sapi
  rationale: Terjemahan ini mempertahankan unsur פַּר, בֶּן, dan בָּקָר serta keapposisiannya. 'Anak lembu' di sini menunjukkan hewan jantan dari jenis ternak sapi, tanpa menetapkan umur yang tidak dinyatakan secara pasti.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Pemakaian kedua חַטָּאת jelas menunjuk pada kategori kurban. Istilah ini dapat dipahami pembaca Indonesia dan membedakannya dari dosa itu sendiri.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: lalu membawanya
  rationale: Kata kerja hifil בוא berarti 'membawa', dan pronomina objek merujuk pada sapi jantan tersebut.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: ke hadapan Kemah Pertemuan
  rationale: Ungkapan lokasi kultis ini diterjemahkan secara langsung dan alami; 'Kemah Pertemuan' merupakan padanan transparan bagi אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Dua arti חַטָּאת dalam ayat yang sama
  choice: Pemakaian pertama diterjemahkan 'dosa', sedangkan yang kedua 'kurban penghapus dosa'.
  alternative: Menerjemahkan kedua pemakaian secara seragam sebagai 'dosa' atau 'kurban penghapus dosa'; alternatif terminologisnya ialah 'kurban pemurnian'.
  rationale: Konteks gramatikal membedakan pelanggaran yang dilakukan dari kurban yang dipersembahkan. Pembedaan itu diperlukan agar ayat dapat dipahami, sementara catatan kaki mempertahankan hubungan leksikal keduanya. 'Kurban penghapus dosa' mengikuti fungsi istilah dalam konteks ini tanpa menghapus kemungkinan pembahasan yang lebih luas mengenai label 'kurban pemurnian'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan hubungan syarat-akibat dengan ayat sebelumnya. Istilah kultis dibuat jelas tanpa memakai kosakata yang terlalu denominatif.
