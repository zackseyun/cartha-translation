  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: id
  text: Ia harus membakar seluruh lemaknya di atas mazbah, seperti lemak kurban keselamatan.[a] Dengan demikian, imam harus mengadakan pendamaian baginya atas dosanya,[b] dan ia akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini juga dapat diterjemahkan “persembahan persekutuan”, “persembahan kesejahteraan”, atau “persembahan damai”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “dosa” juga dapat berarti “kurban penghapus dosa”; di sini kemungkinan besar yang dimaksud ialah dosa orang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חֶלְבּוֹ
  choice: seluruh lemaknya
  rationale: Frasa ini menunjuk kepada semua bagian lemak hewan yang ditetapkan untuk dibakar dalam tata kurban; sufiks orang ketiga dipertahankan dengan '-nya'.
- source_word: יַקְטִיר
  choice: harus membakar
  rationale: Dalam bentuk Hifil dan konteks kurban, verba ini berarti membakar bahan kurban di atas mazbah hingga berasap. 'Membakar' jelas dan alami dalam bahasa Indonesia.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran lokatif/direksional secara harfiah mengarah ke mazbah, tetapi dalam konteks tindakan ritual, bahasa Indonesia alami memakai 'di atas mazbah'.
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: seperti lemak kurban persembahan keselamatan
  rationale: Terjemahan ini mempertahankan perbandingan dengan tata pengolahan lemak dalam kategori kurban שְׁלָמִים, sekaligus memakai istilah yang dapat mencakup gagasan damai, kesejahteraan, dan keutuhan.
- source_word: וְכִפֶּר עָלָיו
  choice: imam harus mengadakan pendamaian baginya
  rationale: Dalam konteks imamat, כפר menunjuk kepada tindakan ritual untuk menangani pelanggaran dan memulihkan hubungan. 'Mengadakan pendamaian' mempertahankan istilah teologis tanpa menentukan satu teori pendamaian tertentu.
- source_word: מֵחַטָּאתוֹ
  choice: atas dosanya
  rationale: Walaupun חַטָּאת dapat berarti 'dosa' atau 'kurban penghapus dosa', susunan dengan כפר dan klausa pengampunan berikutnya lebih kuat menunjuk kepada dosa orang itu.
- source_word: וְנִסְלַח לוֹ
  choice: dan ia akan diampuni
  rationale: Bentuk pasif dengan ל menandai orang yang menerima pengampunan. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan pelaku ilahi yang tidak disebutkan secara eksplisit.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan; persembahan kesejahteraan; persembahan damai
  rationale: Istilah Ibrani ini mencakup nuansa damai, keutuhan, kesejahteraan, dan persekutuan. 'Persembahan keselamatan' dipilih sebagai istilah utama yang bermartabat dan cukup luas, sedangkan kemungkinan lain dicatat agar rentang maknanya tidak dipersempit.
- issue: Makna חַטָּאת dalam מֵחַטָּאתוֹ
  choice: dosanya
  alternative: kurban penghapus dosanya
  rationale: Konteks menyatakan bahwa imam mengadakan pendamaian bagi orang itu dan bahwa ia kemudian diampuni; karena itu, rujukan kepada pelanggarannya lebih mungkin daripada rujukan kepada hewan kurban, tetapi ambiguitas leksikal tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'mazbah' dipertahankan sebagai kosakata ritual yang ringkas dan dikenal dalam konteks Alkitab. Struktur kalimat mengikuti urutan tindakan teks Ibrani tanpa menjadi kaku.
