source:
  edition: WLC
  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: id
  text: Atau, apabila dosa yang telah dilakukannya diberitahukan kepadanya,[a] ia harus membawa seekor kambing betina yang tidak bercacat sebagai persembahannya karena dosa yang telah dilakukannya itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dosanya menjadi diketahui olehnya” atau “ia diberi tahu tentang dosanya.” Bentuk pasif dalam bahasa Ibrani dapat mencakup dosa yang disadarinya sendiri maupun yang diberitahukan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Atau, apabila
  rationale: א֚וֹ memperkenalkan kemungkinan lain dalam rangkaian hukum. Penambahan “apabila” menyatakan nuansa syarat yang tersirat dan menghasilkan bahasa Indonesia yang wajar.
- source_word: הוֹדַ֣ע אֵלָ֔יו
  choice: diberitahukan kepadanya
  rationale: 'Bentuk Hofal dari ידע bersifat pasif: dosa itu dibawa kepada pengetahuannya. Terjemahan ini mempertahankan bentuk pasif tanpa menetapkan siapa yang memberitahukannya.'
- source_word: חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dosa yang telah dilakukannya
  rationale: Dalam kedua kemunculannya, חַטָּאתוֹ menunjuk pada perbuatan dosa, sedangkan אֲשֶׁר חָטָא secara idiomatis diterjemahkan “yang telah dilakukannya.”
- source_word: וְהֵבִיא קָרְבָּנוֹ
  choice: ia harus membawa sebagai persembahannya
  rationale: Dalam konteks hukum, bentuk ini menyatakan tindakan yang diwajibkan. “Harus” menyampaikan daya preskriptif, sedangkan “sebagai persembahannya” mempertahankan fungsi קָרְבָּנוֹ.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: seekor kambing betina
  rationale: Ungkapan ini secara khusus menunjuk pada kambing berjenis kelamin betina. Bahasa Indonesia tidak perlu mengulang keterangan “betina” untuk mewakili penegasan gramatikal Ibrani.
- source_word: תְּמִימָה
  choice: yang tidak bercacat
  rationale: Ini adalah ungkapan kurban yang lazim bagi hewan tanpa cacat fisik dan lebih tepat daripada “sempurna.”
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: karena dosa yang telah dilakukannya itu
  rationale: עַל menyatakan hubungan persembahan dengan dosa yang menjadi alasannya. “Karena” alami dalam bahasa Indonesia dan tidak mengubah חַטָּאת menjadi nama jenis persembahan.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks hukum kurban dan pemurnian
  choice: Menerjemahkan kedua kemunculan חַטָּאת sebagai “dosa.”
  alternative: Menerjemahkan kemunculan kedua sebagai “kurban penghapus dosa.”
  rationale: Persembahan dalam ayat ini sudah disebut קָרְבָּנוֹ dan ditentukan sebagai kambing betina. Karena itu, kedua frasa חַטָּאתוֹ אֲשֶׁר חָטָא paling wajar menunjuk pada pelanggaran yang telah dilakukannya, bukan pada jenis kurbannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan corak hukum ayat sekaligus menghindari ungkapan yang kaku; istilah “persembahan” dan “tidak bercacat” dipakai secara konsisten dengan konteks kurban.
