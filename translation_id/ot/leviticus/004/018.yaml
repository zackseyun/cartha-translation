reference: Leviticus 4:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: id
  text: Dari darah itu, ia harus membubuhkan sebagian pada tanduk-tanduk mazbah yang ada di hadapan Yahweh, yaitu mazbah yang berada di dalam Kemah Pertemuan. Seluruh darah itu harus ia curahkan pada dasar mazbah kurban bakaran yang berada di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: Dari darah itu ... sebagian
  rationale: Bentuk Ibrani secara harfiah berbunyi 'dan dari darah itu ia harus membubuhkan'. Kata 'sebagian' memperjelas makna partitif yang tersirat dan membedakannya dari 'seluruh darah' kemudian dalam ayat ini.
- source_word: יִתֵּן
  choice: haruslah ia membubuhkan
  rationale: נתן berarti 'memberikan/menaruh'. Dalam tata cara kurban, 'membubuhkan' secara alami menyatakan tindakan menaruh darah pada tanduk-tanduk mazbah tanpa menjadikannya terlalu teknis.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: tanduk-tanduk mazbah
  rationale: קרנות secara harfiah berarti 'tanduk-tanduk', istilah konkret bagi tonjolan pada sudut-sudut mazbah; citra dan istilah ritualnya dipertahankan.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: yang ada di hadapan Yahweh
  rationale: לִפְנֵי menyatakan letak 'di hadapan' atau 'di depan'. Ungkapan ini mempertahankan baik aspek ruang maupun nuansa kehadiran ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֲשֶׁר בְּאֹהֶל מוֹעֵד
  choice: yaitu mazbah yang berada di dalam Kemah Pertemuan
  rationale: Klausa relatif ini menerangkan mazbah. Pengulangan 'mazbah' menghindari kemungkinan salah rujuk dalam bahasa Indonesia, sedangkan אֹהֶל מוֹעֵד diterjemahkan dengan istilah baku dan transparan 'Kemah Pertemuan'.
- source_word: וְאֵת כָּל הַדָּם
  choice: Seluruh darah itu
  rationale: Teks Ibrani mengatakan 'seluruh darah', bukan secara eksplisit 'sisa darah'. Bentuk ini dipertahankan agar tidak menambahkan penafsiran, meskipun konteks menunjukkan darah yang masih ada setelah sebagian dibubuhkan.
- source_word: יִשְׁפֹּךְ
  choice: haruslah ia curahkan
  rationale: שׁפך lazim berarti 'mencurahkan/menumpahkan'. 'Mencurahkan' tepat untuk tindakan ritual terhadap cairan dan bernada wajar serta bermartabat.
- source_word: אֶל יְסוֹד
  choice: ke dasar
  rationale: יְסוֹד berarti 'dasar/fondasi'. Untuk mazbah, 'dasar' merupakan padanan Indonesia yang paling alami.
- source_word: מִזְבַּח הָעֹלָה
  choice: mazbah kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya. 'Kurban bakaran' ringkas dan jelas, sementara 'mazbah' mempertahankan istilah khusus bagi altar persembahan.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: yang berada di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח menunjuk pada bukaan atau pintu masuk. 'Di pintu masuk' menyampaikan lokasi secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi, sehingga transliterasi 'Yahweh' mempertahankan fungsinya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Cakupan frasa 'seluruh darah' setelah sebagian darah dibubuhkan
  choice: Seluruh darah itu
  alternative: Sisa darah itu
  rationale: Walaupun konteks praktis menunjuk pada darah yang tersisa, bahasa Ibraninya memakai כָּל הַדָּם, 'seluruh darah'. Terjemahan mempertahankan ketegangan tekstual ini dan tidak diam-diam menggantinya dengan tafsiran 'sisa'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat diperjelas dengan mengulang kata 'mazbah' pada klausa relatif supaya rujukannya tidak ambigu. Istilah ritual 'mazbah', 'tanduk-tanduk', 'kurban bakaran', dan 'Kemah Pertemuan' dipertahankan secara konsisten. Tidak diperlukan catatan kaki karena makna partitif dapat dibuat eksplisit secara alami dalam teks utama.
