  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: id
  text: Jika ia membawa seekor anak domba sebagai persembahan kurban dosa[a], ia harus membawa seekor betina yang tidak bercacat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian”. Istilah Ibrani חַטָּאת dapat merujuk pada kurban yang berkaitan dengan dosa dan kenajisan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Memperkenalkan kemungkinan alternatif dalam rangkaian petunjuk kurban. Dalam bahasa Indonesia, “jika” sudah cukup alami tanpa harus menerjemahkan waw secara tersendiri.
- source_word: כֶּבֶשׂ
  choice: seekor anak domba
  rationale: Menunjuk pada domba dari kawanan; “anak domba” merupakan padanan yang lazim dan sesuai dalam konteks aturan kurban.
- source_word: יָבִיא
  choice: ia membawa
  rationale: Bentuk Hifil dari בוא berarti “membawa” dan mempertahankan tindakan konkret dalam konteks persembahan.
- source_word: קָרְבָּנוֹ
  choice: sebagai persembahannya
  rationale: קָרְבָּן adalah sesuatu yang dibawa mendekat sebagai persembahan; akhiran pronominal orang ketiga tunggal dipertahankan dengan “-nya”.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Menampilkan kategori kurban yang berkaitan dengan dosa, sambil menyediakan “kurban pemurnian” dalam catatan kaki agar cakupan istilah Ibraninya tidak dipersempit secara diam-diam.
- source_word: נְקֵבָה
  choice: yang betina
  rationale: Menegaskan jenis kelamin hewan secara alami dalam susunan kalimat bahasa Indonesia.
- source_word: תְמִימָה
  choice: tidak bercacat
  rationale: Dalam peraturan kurban, istilah ini menyatakan bahwa hewan itu bebas dari cacat, bukan kesempurnaan abstrak.
- source_word: יְבִיאֶנָּה
  choice: ia harus membawa
  rationale: Mengungkapkan daya instruksional verba, sedangkan objek feminin yang dirujuk dinyatakan secara alami melalui frasa “yang betina dan tidak bercacat”.
theological_decisions:
- issue: Pemaknaan חַטָּאת dalam hukum kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah ini dapat menunjuk pada kurban yang menangani dosa sekaligus kenajisan ritual. Padanan utama mempertahankan sebutan yang mudah dipahami, sedangkan alternatif dicatat untuk menjaga nuansa pemurnian yang sungguh ada dalam istilah Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat langsung dan mudah dipahami, dengan istilah ritual yang konsisten serta tanpa memasukkan penafsiran denominasi tertentu.
