base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: id
  text: Ia harus meletakkan tangannya pada kepala kurban penghapus dosa itu dan menyembelihnya sebagai kurban penghapus dosa di tempat kurban bakaran biasa disembelih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian” untuk kedua kemunculan “kurban penghapus dosa”; istilah Ibrani ini dapat menunjuk pada kurban yang mengatasi dosa dan kenajisan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ia harus meletakkan
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan menaruh atau menekankan tangan pada hewan; 'meletakkan' alami dan tidak menafsirkan simbolismenya secara berlebihan.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Bentuk Ibrani adalah tunggal dengan akhiran orang ketiga maskulin tunggal, sehingga bentuk tunggal dipertahankan.
- source_word: עַל רֹאשׁ
  choice: pada kepala
  rationale: Terjemahan langsung dan wajar untuk frasa preposisional ini dalam bahasa Indonesia.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: kurban penghapus dosa / sebagai kurban penghapus dosa
  rationale: חטאת adalah istilah kurban yang berkaitan dengan penanganan dosa dan kenajisan ritual. 'Kurban penghapus dosa' jelas bagi pembaca modern, sementara nuansa alternatif 'kurban pemurnian' dicatat dalam catatan kaki.
- source_word: וְשָׁחַט
  choice: dan menyembelihnya
  rationale: שׁחט merupakan verba teknis bagi penyembelihan hewan kurban; 'menyembelih' mempertahankan makna ritual dan konkretnya.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: di tempat ... disembelih
  rationale: Ungkapan ini menunjuk lokasi penyembelihan yang ditetapkan. Bentuk pasif Indonesia menyampaikan praktik ritual umum tanpa menentukan pelaku yang tidak disebutkan.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Istilah Indonesia yang lazim dan tepat untuk עֹלָה dalam hukum kurban.
theological_decisions:
- issue: Pemaknaan חטאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani ini dapat menandai kurban yang menangani dosa maupun kenajisan ritual. Teks utama memakai istilah yang mudah dikenali tanpa meniadakan nuansa pemurnian, yang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur prosedural hukum dipertahankan secara jelas; bentuk tunggal 'tangannya' mengikuti teks Ibrani.
