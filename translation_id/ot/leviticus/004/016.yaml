  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: id
  text: Kemudian imam yang diurapi itu harus membawa sebagian dari darah lembu jantan itu ke dalam Kemah Pertemuan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari darah lembu jantan itu.” Dalam konteks ini, ungkapan Ibrani kemungkinan besar berarti bahwa hanya sebagian darah yang dibawa masuk.
    reason: lexical_alternative
  - marker: b
    text: Dalam terjemahan bahasa Inggris tradisional, sebutan ini sering diterjemahkan “tabernacle.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Kemudian ... harus membawa
  rationale: Bentuk verba dengan waw melanjutkan urutan tata cara. “Kemudian” menyatakan urutan secara alami, sedangkan “harus membawa” menyampaikan daya wajib dari petunjuk hukum ritual.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: imam yang diurapi itu
  rationale: Frasa ini menunjuk kepada imam yang dilantik bagi jabatannya melalui pengurapan. Terjemahan ini mempertahankan makna konkret מָשִׁיחַ tanpa menjadikannya gelar mesianik.
- source_word: מִדַּם הַפָּר
  choice: sebagian dari darah lembu jantan itu
  rationale: 'מִן paling wajar dipahami secara partitif dalam konteks ini: hanya sebagian darah yang dibawa masuk. פַּר diterjemahkan “lembu jantan,” istilah yang jelas dalam konteks kurban.'
- source_word: אֶל
  choice: ke dalam
  rationale: Walaupun אֶל pada dasarnya dapat berarti “ke,” konteks gerakan menuju ruang kudus menyiratkan bahwa darah dibawa masuk ke dalam kemah.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan ini mengikuti unsur leksikal Ibrani secara transparan dan memakai sebutan Indonesia yang jelas bagi tempat pertemuan kudus tersebut.
theological_decisions:
- issue: Makna הַמָּשִׁיחַ dalam konteks keimaman
  choice: yang diurapi
  alternative: yang ditahbiskan; Mesias
  rationale: Di sini kata itu menerangkan imam yang diurapi untuk menjalankan jabatan, bukan berfungsi sebagai gelar “Mesias.” “Yang ditahbiskan” mungkin menyampaikan fungsi, tetapi kurang mempertahankan gambaran pengurapan dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan prosedural, gambaran pengurapan, dan istilah tempat kudus dalam bahasa sumber.
