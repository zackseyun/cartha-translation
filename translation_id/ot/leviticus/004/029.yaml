id: LEV.4.29
reference: Leviticus 4:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: id
  text: Ia harus meletakkan tangannya pada kepala kurban penghapus dosa[a] itu, lalu menyembelih kurban penghapus dosa itu di tempat kurban bakaran disembelih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pentahiran.” Istilah Ibrani חַטָּאת dapat merujuk pada kurban yang berkaitan dengan dosa dan pentahiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ia harus meletakkan
  rationale: Dalam tata cara kurban, סמך menunjuk pada tindakan menaruh atau menekankan tangan pada hewan. Bentuk preskriptif “harus meletakkan” menyampaikan fungsi prosedural ayat ini secara alami dalam bahasa Indonesia.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Bentuk Ibrani adalah tunggal dengan akhiran orang ketiga maskulin tunggal; bentuk tunggal dipertahankan.
- source_word: עַל רֹאשׁ
  choice: pada kepala
  rationale: Padanan langsung dan alami yang mempertahankan kekhususan tindakan ritual tersebut.
- source_word: הַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks ini חטאת adalah istilah teknis bagi kurban yang berkaitan dengan dosa dan pentahiran. “Kurban penghapus dosa” jelas bagi pembaca Indonesia, sedangkan kemungkinan “kurban pentahiran” dicatat dalam catatan kaki.
- source_word: וְשָׁחַט
  choice: lalu menyembelih
  rationale: שחט adalah istilah teknis untuk menyembelih hewan kurban. “Lalu” menyatakan urutan prosedural secara alami tanpa mengubah hubungan antartindakan.
- source_word: בִּמְקוֹם הָעֹלָה
  choice: di tempat kurban bakaran disembelih
  rationale: Secara harfiah frasa itu berbunyi “di tempat kurban bakaran.” Penambahan “disembelih” menjelaskan bahwa yang dimaksud adalah lokasi penyembelihan dan didukung oleh konteks langsung, tanpa mengubah isi prosedur.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Ini adalah padanan baku dan mudah dipahami untuk istilah kurban עֹלָה, yakni kurban yang dibakar seluruhnya.
theological_decisions:
- issue: Makna חטאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pentahiran
  rationale: Istilah ini jelas menunjuk pada jenis kurban tertentu, tetapi dapat menonjolkan kaitannya dengan dosa maupun fungsi pentahiran. Teks utama memakai padanan yang lazim dan mudah dipahami, sementara ambiguitas yang nyata dipertahankan melalui catatan kaki.
- issue: Daya preskriptif bentuk verba dalam konteks ritual
  choice: harus meletakkan ... lalu menyembelih
  alternative: meletakkan ... dan menyembelih
  rationale: Walaupun bentuk Ibraninya mengikuti rangkaian verbal yang dapat tampak naratif, konteksnya adalah petunjuk ritual. Bentuk “harus” menyampaikan kewajiban prosedural secara wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “kurban” dipakai secara konsisten untuk bahasa kultis; pronomina tunggal dan urutan tindakan ritual dipertahankan.
