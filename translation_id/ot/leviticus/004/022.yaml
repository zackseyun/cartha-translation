  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: id
  text: Apabila seorang pemimpin[a] berbuat dosa dengan melakukan tanpa sengaja[b] salah satu hal yang dilarang oleh perintah-perintah Yahweh, Allahnya, dan ia menjadi bersalah,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pangeran”, “penguasa”, atau “kepala”; kata Ibrani נָשִׂיא menunjuk kepada seorang pemimpin atau kepala yang diakui.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena kekeliruan” atau “karena kesalahan”; bahasa Ibrani menunjuk pada pelanggaran yang tidak disengaja.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Kata ini menunjuk kepada seorang kepala atau pemimpin yang diakui, dan tidak harus berarti pangeran dalam pengertian monarkis.
- source_word: יֶחֱטָא
  choice: berbuat dosa
  rationale: Ungkapan ini secara langsung dan wajar menyampaikan verba Ibrani standar untuk berdosa.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: melakukan salah satu hal
  rationale: Pilihan ini mempertahankan arti partitif, yaitu melakukan satu tindakan dari antara berbagai larangan.
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: salah satu hal yang menurut perintah Yahweh, Allahnya, tidak boleh dilakukan
  rationale: Susunan ini menghubungkan larangan dengan perintah Yahweh secara alami dalam bahasa Indonesia dan mempertahankan sufiks 'Allahnya'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: בִּשְׁגָגָה
  choice: dengan tidak sengaja
  rationale: Dalam hukum korban Imamat, istilah ini menunjuk pada pelanggaran yang tidak disengaja atau dilakukan karena kekeliruan.
- source_word: וְאָשֵׁם
  choice: sehingga ia menjadi bersalah
  rationale: Verba ini menyatakan keadaan bersalah yang timbul sebagai akibat pelanggaran; 'sehingga' membuat hubungan akibat itu jelas tanpa meniadakan bobot hukumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Hubungan antara pelanggaran tidak sengaja dan keadaan bersalah
  choice: sehingga ia menjadi bersalah
  alternative: dan ia bersalah
  rationale: Terjemahan ini mempertahankan ketegangan teologis teks bahwa ketidaksengajaan tidak menghapus kesalahan, sekaligus mencerminkan nuansa hasil pada וְאָשֵׁם.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Apabila' cocok dengan rumusan kasus hukum. Kalimat sengaja berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya.
