source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: id
  text: Jika seorang dari kalangan rakyat biasa[a] tanpa sengaja berbuat dosa dengan melakukan salah satu dari hal-hal yang dilarang oleh perintah-perintah Yahweh, lalu ia menjadi bersalah,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari rakyat negeri.” Dalam konteks ini, ungkapan tersebut menunjuk kepada seorang anggota biasa umat, berbeda dari imam atau pemimpin dalam hukum-hukum di sekitarnya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dan ia bersalah” atau “dan ia menanggung kesalahan.” Kata kerja Ibrani dapat menyatakan keadaan menjadi bersalah ataupun menanggung kesalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: seseorang
  rationale: Dalam rumusan hukum ini, נֶפֶשׁ berarti seorang individu, bukan ‘jiwa’ sebagai unsur manusia. ‘Seseorang’ alami dalam bahasa Indonesia dan tetap mempertahankan subjek tunggal.
- source_word: תֶּחֱטָא
  choice: berbuat dosa
  rationale: Bentuk verbal חטא menyatakan tindakan berdosa; ‘berbuat dosa’ merupakan padanan Indonesia yang langsung dan wajar.
- source_word: בִשְׁגָגָה
  choice: tanpa sengaja
  rationale: Istilah ini menunjuk pada pelanggaran yang tidak disengaja dalam konteks hukum kurban, bukan sekadar kesalahan kecil atau kecerobohan biasa.
- source_word: מֵעַם הָאָרֶץ
  choice: dari kalangan rakyat biasa
  rationale: Dalam rangkaian hukum ini, frasa tersebut membedakan anggota biasa umat dari imam, seluruh umat, dan pemimpin. Padanan ini menyampaikan fungsi sosial-hukumnya tanpa menyiratkan golongan etnis atau penduduk wilayah tertentu.
- source_word: בַּעֲשֹׂתָהּ
  choice: dengan melakukan
  rationale: Preposisi ב pada bentuk infinitif menyatakan cara atau keadaan terjadinya dosa; ‘dengan melakukan’ mempertahankan hubungan tersebut.
- source_word: אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: salah satu hal yang menurut perintah Yahweh tidak boleh dilakukan
  rationale: Susunan ini mempertahankan acuan partitif ‘salah satu’ dan daya larangan dari klausa relatif, sekaligus menghindari ungkapan Indonesia yang janggal seolah-olah perintah itu sendiri yang dilakukan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap tampak.
- source_word: וְאָשֵׁם
  choice: lalu ia menjadi bersalah
  rationale: Kata kerja אשם dapat menyatakan masuk ke dalam keadaan bersalah atau menanggung kesalahan. ‘Menjadi bersalah’ mempertahankan gerak dari perbuatan menuju keadaan hukum yang dihasilkannya; ‘lalu’ menghubungkannya secara alami.
theological_decisions:
- issue: Makna מֵעַם הָאָרֶץ dalam hukum kurban
  choice: dari kalangan rakyat biasa
  alternative: dari rakyat negeri
  rationale: Konteks membentuk kategori hukum bagi seorang anggota biasa umat, berbeda dari imam yang diurapi, seluruh umat, dan pemimpin. Terjemahan pilihan menjelaskan kontras itu tanpa memasukkan pembagian kelas atau identitas lain yang tidak dinyatakan teks.
- issue: Daya makna וְאָשֵׁם
  choice: lalu ia menjadi bersalah
  alternative: dan ia bersalah / dan ia menanggung kesalahan
  rationale: Bentuk Ibrani dapat menunjuk pada keadaan bersalah maupun timbulnya tanggungan kesalahan. Teks utama mempertahankan nuansa memasuki keadaan bersalah, sedangkan catatan kaki menjaga kemungkinan nuansa lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. Kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat bersyarat yang berlanjut ke ayat berikutnya. Penataan ulang klausa larangan dilakukan agar alami dalam bahasa Indonesia tanpa menghilangkan unsur ‘salah satu’, perintah Yahweh, atau larangan.
