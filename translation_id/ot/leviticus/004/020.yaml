base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: id
  text: Ia harus memperlakukan lembu jantan itu sama seperti ia telah memperlakukan lembu jantan untuk persembahan penghapus dosa[a]; demikianlah ia harus memperlakukannya. Imam harus mengadakan pendamaian bagi mereka, dan mereka akan diampuni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan pentahiran.” Istilah Ibrani ini dapat menunjuk pada persembahan yang menangani dosa dengan menghasilkan pentahiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: Ia harus memperlakukan lembu jantan itu
  rationale: Dalam petunjuk ritual ini, עשה dengan ל menyatakan tindakan yang dilakukan terhadap hewan. 'Memperlakukan' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'melakukan kepada'.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: sama seperti ia memperlakukan
  rationale: כַּאֲשֶׁר menyatakan perbandingan dengan tata cara yang sudah dijelaskan sebelumnya; 'sama seperti' mempertahankan kesepadanan yang tegas.
- source_word: לְפַר הַחַטָּאת
  choice: lembu jantan persembahan penghapus dosa
  rationale: Frasa ini menunjuk pada lembu dalam ritual חטאת yang telah diuraikan. 'Persembahan penghapus dosa' menyampaikan hubungan persembahan itu dengan dosa dalam bahasa Indonesia yang jelas.
- source_word: הַחַטָּאת
  choice: persembahan penghapus dosa
  rationale: Dalam konteks korban, חטאת dapat menunjuk pada persembahan yang menangani dosa dan menghasilkan pentahiran. Pilihan utama mempertahankan hubungan eksplisit dengan dosa, sedangkan alternatif 'persembahan pentahiran' dicatat dalam catatan kaki.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: demikianlah harus dilakukannya terhadap lembu itu
  rationale: כֵּן menandai kesesuaian tata cara. Penyebutan kembali 'lembu itu' menghindari ketidakjelasan pronomina tanpa menambah rujukan baru.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: Imam harus mengadakan pendamaian bagi mereka
  rationale: כפר adalah istilah kultis utama. 'Mengadakan pendamaian' mempertahankan bobot ritual-teologisnya, dan עֲלֵהֶם secara idiomatis berarti tindakan itu dilakukan bagi mereka.
- source_word: וְנִסְלַח לָהֶם
  choice: maka mereka akan diampuni
  rationale: Bentuk Nifal menyatakan hasil pasif berupa pengampunan. 'Maka' mengungkapkan hubungan hasil yang wajar dari rangkaian ritual tersebut tanpa menentukan pelaku yang tidak dinyatakan dalam bentuk Ibrani.
theological_decisions:
- issue: Makna חטאת dalam peraturan persembahan
  choice: persembahan penghapus dosa
  alternative: persembahan pentahiran
  rationale: Istilah חטאת dapat menyoroti dosa yang ditangani maupun pentahiran yang dihasilkan. Teks utama mempertahankan kaitan yang mudah dipahami dengan dosa, sementara alternatif yang sah secara leksikal disediakan dalam catatan kaki.
- issue: Makna כפר dalam konteks ritual
  choice: mengadakan pendamaian
  alternative: mengadakan pengampunan; menahirkan
  rationale: כפר tidak semata-mata identik dengan pengampunan atau pentahiran, walaupun keduanya berkaitan dengan hasil ritual. 'Mengadakan pendamaian' menjaga istilah kultis yang lebih luas dan tidak menyelesaikan secara sempit mekanisme teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'harus' menyampaikan daya instruktif prosedur ritual; susunan kalimat tetap dekat dengan pengulangan dan alur teks Ibrani. Penanda catatan kaki ditempatkan setelah klausa pendamaian agar tidak disalahpahami sebagai catatan tentang kata ganti.
