  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: id
  text: Sebagaimana lemak-lemak itu diambil dari sapi jantan kurban keselamatan[a], imam harus membakarnya di atas mazbah kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “diangkat dari sapi jantan kurban keselamatan.” Kata Ibrani yang dipakai secara harfiah berarti “diangkat” dan menggambarkan pengambilan bagian-bagian yang akan dipersembahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: seperti
  rationale: Menandai kesamaan tata cara dengan kurban keselamatan; bentuk ini alami dalam bahasa Indonesia dan tetap terkait secara sintaksis dengan uraian ayat sebelumnya.
- source_word: יוּרַם
  choice: diangkat
  rationale: Bentuk Hofal dari רום secara harfiah menyatakan tindakan mengangkat. Dalam konteks ini yang dimaksud ialah mengambil bagian-bagian lemak dari hewan untuk dipersembahkan; terjemahan harfiah dipertahankan karena citra ritualnya bermakna.
- source_word: מִשּׁוֹר
  choice: dari sapi jantan
  rationale: שׁוֹר menunjuk pada ternak sapi; dalam konteks hewan kurban ini, 'sapi jantan' jelas dan wajar bagi pembaca Indonesia.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban keselamatan
  rationale: Mempertahankan hubungan leksikal שְׁלָמִים dengan keutuhan, kesejahteraan, atau damai tanpa mempersempitnya menjadi sekadar persekutuan. 'Kurban' sudah menyampaikan unsur זֶבַח secara ringkas.
- source_word: וְהִקְטִירָם
  choice: Imam harus membakarnya
  rationale: Dalam konteks mezbah, bentuk Hifil קטר berarti membakar bagian kurban hingga menjadi asap. Akhiran jamak dirujukkan secara eksplisit kepada lemak-lemak dari ayat sebelumnya.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Padanan baku dan alami bagi pelayan kultis yang menjalankan ritus.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: di atas mazbah kurban bakaran
  rationale: Menerjemahkan ungkapan kultis secara langsung dan mempertahankan pembedaan antara mezbah dan jenis kurban yang terkait dengannya.
theological_decisions:
- issue: Rujukan objek jamak pada וְהִקְטִירָם
  choice: lemak-lemak itu ... membakarnya
  alternative: bagian-bagian itu ... membakarnya
  rationale: Akhiran objek jamak merujuk kembali kepada bagian-bagian lemak yang dirinci dalam ayat 8–9. Penyebutan 'lemak-lemak' membuat hubungan lintas ayat jelas tanpa menambahkan tafsir teologis.
- issue: Makna שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban pendamaian; kurban persekutuan
  rationale: '''Keselamatan'' mempertahankan rentang gagasan keutuhan, kesejahteraan, dan damai pada akar katanya serta menghindari penyamaan kurban ini dengan kurban penghapus dosa atau pembatasan makna hanya pada persekutuan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mazbah' dipakai sebagai istilah khusus untuk altar persembahan, sedangkan 'kurban bakaran' dan 'kurban keselamatan' menjaga konsistensi istilah ritual. Karena ayat ini melanjutkan kalimat dan daftar pada ayat sebelumnya, 'lemak-lemak itu' ditambahkan sebagai acuan eksplisit bagi bentuk verba tunggal dan sufiks objek jamak dalam bahasa Ibrani.
