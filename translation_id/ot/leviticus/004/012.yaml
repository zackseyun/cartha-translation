  text: וְ/הוֹצִ֣יא אֶת כָּל הַ֠/פָּר אֶל מִ/ח֨וּץ לַֽ/מַּחֲנֶ֜ה אֶל מָק֤וֹם טָהוֹר֙ אֶל שֶׁ֣פֶךְ הַ/דֶּ֔שֶׁן וְ/שָׂרַ֥ף אֹת֛/וֹ עַל עֵצִ֖ים בָּ/אֵ֑שׁ עַל שֶׁ֥פֶךְ הַ/דֶּ֖שֶׁן יִשָּׂרֵֽף־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: id
  text: Ia harus membawa seluruh lembu jantan itu ke luar perkemahan, ke suatu tempat yang tahir[a], ke tempat pembuangan abu[b], lalu membakarnya di atas kayu dengan api. Di tempat pembuangan abu itulah lembu itu harus dibakar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “suatu tempat yang bersih”; dalam konteks ini, yang dimaksud ialah tahir menurut ketentuan ritual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tempat abu dicurahkan,” yaitu tempat yang ditetapkan untuk membuang abu dari mezbah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ia harus membawa ... ke luar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan membawa sesuatu keluar. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan arah tindakan.
- source_word: כָּל הַפָּר
  choice: seluruh lembu jantan itu
  rationale: כָּל dengan nomina definit menekankan keseluruhan hewan; 'seluruh' menyampaikan penekanan itu dengan jelas.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Ungkapan ini menunjuk lokasi di luar batas perkemahan sekaligus menjadi tujuan tindakan membawa keluar.
- source_word: מָקוֹם טָהוֹר
  choice: suatu tempat yang tahir
  rationale: Dalam konteks Imamat, טָהוֹר terutama berkaitan dengan ketahiran ritual. 'Tahir' merupakan istilah Indonesia yang ringkas dan lazim untuk kategori tersebut.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: tempat pembuangan abu
  rationale: שֶׁפֶךְ menunjuk tempat pencurahan atau pembuangan, sedangkan דֶּשֶׁן dalam konteks ini adalah abu mezbah. Frasa ini lebih tepat daripada sekadar 'tumpukan abu' karena menyiratkan lokasi yang ditetapkan.
- source_word: וְשָׂרַף אֹתוֹ
  choice: lalu membakarnya
  rationale: שׂרף berarti 'membakar'. 'Lalu' menghubungkan tahap berikutnya secara alami tanpa mengubah urutan prosedur.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: di atas kayu dalam api
  rationale: 'Terjemahan mempertahankan kedua unsur Ibrani: kayu sebagai alas atau bahan bakar dan api sebagai tempat atau sarana pembakaran.'
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: Di tempat pembuangan abu itulah lembu itu harus dibakar
  rationale: Pengulangan lokasi dipertahankan sebagai penegasan legal. Partikel '-lah' menyampaikan fokus pada lokasi yang telah ditetapkan.
theological_decisions:
- issue: Nuansa ketahiran dalam טָהוֹר
  choice: suatu tempat yang tahir
  alternative: suatu tempat yang bersih; suatu tempat yang tahir secara ritual
  rationale: Konteks korban menunjukkan kategori ritual, bukan semata-mata kebersihan fisik. 'Tahir' mempertahankan nuansa itu tanpa menambahkan penjelasan ke dalam teks utama.
- issue: Identitas שֶׁפֶךְ הַדֶּשֶׁן sebagai lokasi pembuangan korban
  choice: tempat pembuangan abu
  alternative: tumpukan abu; tempat abu dicurahkan
  rationale: Ungkapan Ibrani menunjuk lokasi yang ditetapkan untuk menaruh abu mezbah. Terjemahan ini konkret dan tidak menyiratkan bahwa lokasinya hanya berupa suatu tumpukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'tahir' dipakai karena konteks ritual Imamat, sedangkan 'tempat pembuangan abu' memperjelas fungsi lokasi tanpa menjadi terlalu teknis. Pengulangan lokasi pada akhir ayat sengaja dipertahankan.
