id: LEV.4.4
reference: Leviticus 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: id
  text: Ia harus membawa sapi jantan itu ke pintu masuk Kemah Pertemuan, ke hadapan Yahweh,[a] lalu meletakkan tangannya di atas kepala sapi jantan itu dan menyembelihnya di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “ke hadapan Yahweh” dan “di hadapan Yahweh” juga dapat berarti “dalam hadirat Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Ia harus membawa
  rationale: Bentuk Hifil dari בוא menyatakan tindakan membawa dalam rangkaian petunjuk ritual. 'Harus membawa' menyampaikan daya preskriptif konteks dengan wajar dalam bahasa Indonesia.
- source_word: הַפָּר
  choice: sapi jantan itu
  rationale: פַּר menunjuk pada sapi jantan, kerap dalam konteks kurban. Unsur 'muda' tidak dinyatakan secara eksplisit dalam ayat ini, sehingga tidak ditambahkan.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pintu masuk Kemah Pertemuan
  rationale: פֶּתַח berarti bukaan atau pintu masuk. 'Pintu masuk Kemah Pertemuan' alami, jelas, dan mempertahankan sebutan baku tempat kudus.
- source_word: לִפְנֵי יְהוָה
  choice: ke hadapan Yahweh / di hadapan Yahweh
  rationale: לִפְנֵי dapat berarti di depan atau dalam hadirat. Ungkapan 'di hadapan' mempertahankan rumusan kultis yang ringkas; sesudah verba gerak, 'ke hadapan' lebih alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: lalu meletakkan tangannya di atas kepala sapi jantan itu
  rationale: סמך dalam konteks kurban menyatakan tindakan ritual menaruh atau menumpukan tangan pada hewan. Terjemahan ini menyatakan tindakannya tanpa menetapkan makna simbolis yang tidak dijelaskan dalam ayat.
- source_word: וְשָׁחַט
  choice: dan menyembelihnya
  rationale: שׁחט adalah verba teknis untuk menyembelih hewan, khususnya dalam konteks kurban. Pronomina '-nya' menghindari pengulangan yang kaku tanpa mengaburkan acuannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama pribadi tersebut dan mengikuti bentuk transliterasi yang dipilih.
- issue: Makna penumpangan tangan dalam ritual kurban penghapus dosa
  choice: Menerjemahkan tindakan fisiknya tanpa memberi tafsir doktrinal khusus
  alternative: Menjelaskannya sebagai identifikasi atau pemindahan kesalahan
  rationale: Ayat ini menyebut tindakan ritual tersebut, tetapi tidak menjelaskan seluruh makna teologisnya. Terjemahan karena itu tidak menambahkan penafsiran yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Kemah Pertemuan' diperlakukan sebagai nama sebutan tempat kudus. Rangkaian waw Ibrani diterjemahkan secara alami dengan 'lalu' dan 'dan', sementara corak instruksional dipertahankan melalui 'harus'.
