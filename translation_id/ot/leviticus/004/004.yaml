  source_fidelity: 'Terjemahan dengan setia mencakup seluruh unsur Ibrani: membawa sapi jantan ke pintu masuk Kemah Pertemuan di hadapan Yahweh, menaruh tangan pada kepalanya, lalu menyembelihnya di hadapan Yahweh. Bentuk instruksional “harus” sesuai dengan fungsi imperfek dalam petunjuk ritual. Tidak ada penambahan tafsir atas tindakan penumpangan tangan.'
