base_translation:
  language: en
  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: id
  text: Pada suatu hari, anak-anak Allah[a] datang untuk menghadap Yahweh, dan Sang Penentang[b] juga datang di antara mereka untuk menghadap Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Allah.” Ungkapan ini dapat merujuk kepada makhluk-makhluk surgawi atau anggota dewan ilahi.
    reason: lexical_alternative
  - marker: b
    text: Atau “Setan” atau “si penuduh.” Dalam bahasa Ibrani terdapat kata sandang tertentu—secara harfiah, “sang penentang”—sehingga ungkapan ini kemungkinan berfungsi sebagai gelar atau sebutan peran di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Pada suatu hari
  rationale: Ungkapan naratif Ibrani ini memperkenalkan sebuah peristiwa pada suatu hari tertentu. Terjemahan ini alami dalam bahasa Indonesia tanpa menambahkan kata “lagi,” yang tidak dinyatakan secara eksplisit dalam frasa Ibraninya.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: anak-anak Allah
  rationale: Terjemahan formal ini mempertahankan idiom Ibrani dan tidak menetapkan secara sepihak apakah yang dimaksud ialah makhluk-makhluk surgawi atau anggota dewan ilahi.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: untuk menghadap Yahweh
  rationale: Dalam konteks kehadiran di hadapan penguasa, bentuk hitpael dari יצב menyatakan tindakan menempatkan atau menghadirkan diri. “Menghadap” menyampaikan nuansa resmi tersebut secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN.”
- source_word: הַשָּׂטָן
  choice: Sang Penentang
  rationale: Kata Ibrani memakai kata sandang tertentu dan dalam konteks ini paling wajar dipahami sebagai sebutan peran. “Sang Penentang” mempertahankan makna leksikal dan sifat titulernya tanpa langsung menjadikannya nama diri “Satan.”
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Pilihan ini mempertahankan gambaran bahwa Sang Penentang hadir di dalam kumpulan tersebut dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah הַשָּׂטָן merupakan nama diri atau sebutan peran
  choice: Sang Penentang
  alternative: Satan; si penuduh
  rationale: Adanya kata sandang tertentu mendukung pemahaman sebagai gelar atau peran dalam adegan ini. Terjemahan tidak memaksakan pemakaian nama diri yang berkembang kemudian, sedangkan catatan kaki tetap memberi pembaca alternatif tradisional.
- issue: Identitas בְּנֵי הָאֱלֹהִים
  choice: anak-anak Allah
  alternative: makhluk-makhluk surgawi; anggota dewan ilahi
  rationale: Ungkapan sumber dipertahankan agar ambiguitas mengenai identitas kelompok itu tidak diselesaikan di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara pengulangan “untuk menghadap Yahweh” dipertahankan guna mencerminkan kesejajaran dalam teks Ibrani.
