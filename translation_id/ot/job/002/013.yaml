  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: id
  text: Lalu mereka duduk bersamanya di tanah selama tujuh hari dan tujuh malam. Tidak seorang pun mengucapkan sepatah kata kepadanya, karena mereka melihat bahwa penderitaannya sangat berat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rasa sakitnya sangat hebat” atau “kepedihannya sangat dalam.” Kata Ibrani yang digunakan dapat mencakup penderitaan jasmani maupun kepedihan batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ אִתּוֹ לָאָרֶץ
  choice: Lalu mereka duduk bersama dia di tanah
  rationale: ישׁב menyatakan tindakan konkret 'duduk', אִתּוֹ berarti 'bersama dia', dan לָאָרֶץ dalam konteks perkabungan menunjuk pada tanah sebagai tempat mereka duduk.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: selama tujuh hari tujuh malam
  rationale: Ungkapan waktu ini dipertahankan secara langsung; penambahan 'selama' membuat durasinya jelas dan alami dalam bahasa Indonesia.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: Tidak seorang pun mengucapkan sepatah kata kepadanya
  rationale: Konstruksi Ibrani menekankan keheningan total. 'Mengucapkan sepatah kata' mempertahankan idiom dan tekanannya secara wajar.
- source_word: כִּי רָאוּ
  choice: karena mereka melihat
  rationale: כִּי di sini memperkenalkan alasan mereka berdiam diri.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: bahwa penderitaannya sangat berat
  rationale: כְּאֵב dapat mencakup rasa sakit, penderitaan, dan kepedihan. 'Penderitaan' menjaga cakupan makna yang luas, sedangkan גָדַל ... מְאֹד dinyatakan secara alami sebagai 'sangat berat'.
