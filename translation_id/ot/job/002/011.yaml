  to: 'Ketika ketiga sahabat Ayub mendengar tentang segala malapetaka ini yang telah menimpanya[a], masing-masing datang dari tempatnya: Elifas, orang Teman; Bildad, orang Suah; dan Zofar, orang Naama. Mereka bersepakat untuk datang guna menyatakan simpati kepadanya[b] dan menghiburnya.'
