  terminology: Nama Elifas, Bildad, Zofar serta Teman, Suah, dan Naama sudah lazim dalam bahasa Indonesia. “Menyatakan simpati” lebih luas dan tepat untuk לָנוּד dalam konteks penderitaan daripada “menyatakan belasungkawa,” yang dalam penggunaan Indonesia modern lebih erat dikaitkan dengan kematian.
