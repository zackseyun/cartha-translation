  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: id
  text: 'Ketika ketiga sahabat Ayub mendengar tentang segala malapetaka ini yang telah menimpanya[a], masing-masing datang dari tempatnya: Elifas, orang Teman; Bildad, orang Suah; dan Zofar, orang Naama. Mereka bersepakat untuk datang guna menyatakan simpati kepadanya[b] dan menghiburnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala kemalangan ini.” Kata Ibrani yang digunakan di sini menunjuk pada bencana atau kemalangan yang menimpa Ayub, bukan kejahatan moral yang dilakukannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyatakan belasungkawa kepadanya” atau “turut berkabung dengannya.” Kata Ibrani ini dapat menunjuk pada ungkapan simpati atau belasungkawa atas penderitaan maupun kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Ketika ... mendengar
  rationale: Waw-konsekutif melanjutkan alur narasi; bentuk temporal ini menghasilkan bahasa Indonesia yang alami tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: ketiga sahabat Ayub
  rationale: Rantai konstruksi diterjemahkan secara idiomatis; רֵעַ berarti sahabat atau teman dalam konteks ini.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: segala malapetaka
  rationale: רָעָה di sini menunjuk pada bencana atau kemalangan yang menimpa Ayub, bukan kejahatan moral yang dilakukannya.
- source_word: הַבָּאָה עָלָיו
  choice: yang telah menimpanya
  rationale: Ungkapan ini menerangkan malapetaka yang datang atas Ayub; 'menimpa' merupakan ungkapan Indonesia yang alami.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: datanglah mereka masing-masing dari tempatnya
  rationale: אִישׁ dipakai secara distributif dengan arti 'masing-masing'; susunan ini mempertahankan gerak narasi.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: orang Teman / orang Suah / orang Naama
  rationale: Gentilik diterjemahkan dengan pola Indonesia yang wajar dan mempertahankan nama geografis.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: Mereka bersepakat ... bersama-sama
  rationale: Bentuk nifal dari יעד menunjukkan pengaturan atau kesepakatan yang disengaja; יַחְדָּו menyatakan tindakan bersama.
- source_word: לָבוֹא
  choice: untuk datang
  rationale: Infinitif tujuan dipertahankan secara langsung, sesuai dengan perspektif narator.
- source_word: לָנוּד לוֹ
  choice: guna menyatakan belasungkawa kepadanya
  rationale: נוּד dapat berarti menunjukkan simpati atau turut berkabung atas penderitaan; 'menyatakan belasungkawa' membedakannya dari tindakan menghibur yang disebut sesudahnya.
- source_word: וּלְנַחֲמוֹ
  choice: dan menghiburnya
  rationale: נחם dalam bentuk ini berarti menghibur atau memberi penghiburan.
theological_decisions:
- issue: Makna רָעָה dalam penderitaan Ayub
  choice: malapetaka
  alternative: kejahatan
  rationale: Konteks menunjuk pada bencana yang menimpa Ayub dan tidak menyatakan bahwa Ayub melakukan kejahatan moral.
- issue: Hubungan antara לָנוּד dan נָחַם
  choice: menyatakan belasungkawa ... dan menghibur
  alternative: bersimpati ... dan menghibur
  rationale: 'Terjemahan mempertahankan dua tindakan yang berdekatan tetapi tidak identik: ungkapan turut berduka dan pemberian penghiburan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama orang dan tempat mengikuti bentuk Indonesia yang lazim. Pengulangan serta pembedaan dua verba tujuan dipertahankan sejauh tetap alami.
