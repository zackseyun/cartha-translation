  text: אוּלָם֙ שְֽׁלַֽח נָ֣א יָֽדְ/ךָ֔ וְ/גַ֥ע אֶל עַצְמ֖/וֹ וְ/אֶל בְּשָׂר֑/וֹ אִם לֹ֥א אֶל פָּנֶ֖י/ךָ יְבָרֲכֶֽ/ךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/005.yaml
  text: But stretch out your hand[a], please, and touch his bone and his flesh, and he will surely curse you to your face.
translation:
  language: id
  text: Namun, ulurkanlah kiranya tangan-Mu dan sentuhlah tulang serta dagingnya. Ia pasti akan mengutuk Engkau di hadapan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah berbunyi “memberkati Engkau”; di sini kata itu dipahami sebagai ungkapan halus yang berarti “mengutuk Engkau”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Namun
  rationale: Partikel ini menyatakan pertentangan dan memperkenalkan sanggahan serta tantangan lanjutan dari si penuduh.
- source_word: שְׁלַח נָא יָדְךָ
  choice: ulurkanlah kiranya tangan-Mu
  rationale: Ungkapan harfiahnya adalah ‘kirimkanlah tangan-Mu’; dalam konteks ini maksudnya mengulurkan tangan untuk bertindak terhadap seseorang. ‘Kiranya’ mempertahankan nuansa permohonan atau desakan pada נָא.
- source_word: וְגַע
  choice: dan sentuhlah
  rationale: נגע pada dasarnya berarti ‘menyentuh’, meskipun dalam konteks ini sentuhan tersebut jelas mendatangkan celaka. Pilihan ini mempertahankan gambaran konkret bahasa Ibrani tanpa mempersempitnya menjadi ‘pukullah’ atau ‘timpakanlah penderitaan’.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: tulang serta dagingnya
  rationale: Kata ‘tulang’ berbentuk tunggal kolektif dan dipasangkan dengan ‘daging’ untuk menunjuk keberadaan jasmani Ayub secara konkret; ungkapan itu tidak diratakan sekadar menjadi ‘tubuhnya’.
- source_word: אִם לֹא
  choice: Ia pasti akan
  rationale: Dalam rumusan bernuansa sumpah atau penegasan, אִם לֹא berfungsi sebagai pernyataan yang sangat yakin, bukan syarat biasa ‘jika tidak’.
- source_word: אֶל פָּנֶיךָ
  choice: terang-terangan di hadapan-Mu
  rationale: Secara harfiah ungkapan ini berarti ‘ke wajah-Mu’ dan menyatakan tindakan langsung serta terbuka. Bentuk Indonesia ini menyampaikan daya idiomatisnya dengan wajar.
- source_word: יְבָרֲכֶךָּ
  choice: mengutuk Engkau
  rationale: Walaupun ברך biasanya berarti ‘memberkati’, dalam adegan pengujian ini kata tersebut dipakai secara eufemistis untuk tindakan mengutuk atau menyangkal Allah. Makna kontekstual ditempatkan dalam teks utama, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemakaian eufemistis ברך dalam adegan pengujian Ayub
  choice: Diterjemahkan ‘mengutuk’ dalam teks utama
  alternative: Diterjemahkan secara harfiah ‘memberkati’, lalu dijelaskan melalui konteks atau catatan
  rationale: Tantangan si penuduh ialah bahwa Ayub akan berbalik melawan Allah jika tubuhnya disakiti. ‘Memberkati’ dalam teks utama akan mengaburkan arah pernyataan itu bagi pembaca modern. Namun, bentuk harfiah bahasa Ibrani tetap disajikan dalam catatan agar ketegangan leksikalnya transparan.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Allah dipertahankan. ‘Kiranya’ memberi nuansa permohonan/desakan tanpa membuat ucapan si penuduh terdengar santun secara berlebihan; ‘terang-terangan di hadapan-Mu’ menyampaikan idiom ‘ke wajah-Mu’ secara alami.
