base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: id
  text: Lalu Yahweh berkata kepada sang Pendakwa[a], “Dari mana engkau datang?” Sang Pendakwa menjawab Yahweh dan berkata, “Dari berkeliling di bumi dan berjalan ke sana kemari di atasnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “ha-satan”; di sini kemungkinan merupakan gelar yang berarti “pendakwa” atau “penentang”, bukan nama diri.'
    reason: Menjelaskan artikel tertentu dalam teks Ibrani dan mempertahankan kemungkinan bahwa istilah tersebut berfungsi sebagai gelar.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagaimana tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הַשָּׂטָן
  choice: Pendakwa
  rationale: Kata ini memakai artikel tertentu dan dalam konteks Ayub 1–2 paling wajar dipahami sebagai gelar atau peran, bukan langsung sebagai nama diri. 'Pendakwa' mempertahankan nuansa hukum dan permusuhannya.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: Dari mana engkau datang?
  rationale: Ungkapan ini menanyakan tempat asal kedatangan dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: menjawab ... katanya
  rationale: Mencerminkan kedua verba Ibrani tanpa menghasilkan susunan Indonesia yang terlalu kaku.
- source_word: מִשֻּׁט
  choice: dari menjelajahi
  rationale: Mengungkapkan gerak berkeliling atau hilir mudik tanpa menambahkan gagasan khusus seperti patroli.
- source_word: בָּאָרֶץ
  choice: bumi
  rationale: Dalam konteks ini אֶרֶץ paling mungkin menunjuk pada bumi atau dunia yang dihuni, bukan suatu negeri tertentu.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: dan berjalan ke sana kemari di atasnya
  rationale: Mempertahankan kesan gerak berulang atau berkeliling yang terkandung dalam bentuk hitpael, sekaligus terdengar jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah הַשָּׂטָן diterjemahkan sebagai nama diri atau gelar/peran
  choice: Pendakwa
  alternative: Satan; Lawan
  rationale: Adanya artikel tertentu pada bentuk Ibrani mendukung pembacaan sebagai gelar atau peran dalam sidang surgawi. Terjemahan ini tidak memaksakan perkembangan pemakaian kata tersebut sebagai nama diri, tetapi tetap membuka kemungkinan kaitannya dengan tokoh yang dalam tradisi kemudian disebut Satan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' dipakai dalam dialog langsung agar tetap alami dalam register Alkitab Indonesia. Struktur naratif Ibrani dipertahankan sejauh tidak terasa kaku.
