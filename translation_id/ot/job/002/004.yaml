  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: id
  text: Lalu Sang Penentang[a] menjawab Yahweh dan berkata, “Kulit ganti kulit![b] Orang akan memberikan segala miliknya demi nyawanya.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Satan” atau “sang pendakwa.” Dalam bahasa Ibrani, sebutan ini memakai kata sandang dan berfungsi seperti gelar atau sebutan peran.
    reason: alternative_reading
  - marker: b
    text: “Kulit ganti kulit” adalah ungkapan peribahasa yang makna tepatnya tidak pasti; kemungkinan maksudnya, seseorang rela melepaskan sesuatu untuk melindungi hidupnya sendiri.
    reason: cultural_note
  - marker: c
    text: Secara harfiah dapat juga diterjemahkan “jiwanya” atau “dirinya.” Dalam konteks ini, “nyawanya” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: Sang Penentang
  rationale: Bentuk Ibrani memakai kata sandang dan berfungsi sebagai sebutan peran, bukan dengan jelas sebagai nama diri. “Sang Penentang” mempertahankan makna peran itu dalam bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עוֹר בְּעַד עוֹר
  choice: Kulit ganti kulit
  rationale: Ungkapan Ibrani ini singkat dan bersifat peribahasa. Terjemahan harfiah yang ringkas mempertahankan ketidakjelasan asli tanpa memasukkan tafsiran ke dalam teks utama.
- source_word: בְּעַד
  choice: ganti; demi
  rationale: Dalam peribahasa, “ganti” menyampaikan pertukaran dengan ringkas; dalam klausa berikutnya, “demi” secara alami menyatakan bahwa nyawa menjadi kepentingan yang hendak dipertahankan.
- source_word: אִישׁ
  choice: orang
  rationale: Kata benda tunggal maskulin ini dipakai secara umum bagi manusia. “Orang” merupakan padanan generik yang alami dalam bahasa Indonesia dan tidak mengubah cakupan maknanya.
- source_word: נַפְשׁוֹ
  choice: nyawanya
  rationale: Dalam konteks ancaman terhadap kehidupan Ayub, נֶפֶשׁ menunjuk pada hidup atau nyawa yang hendak dipertahankan, bukan secara khusus unsur rohani yang terpisah dari tubuh.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: segala miliknya
  rationale: 'Ungkapan ini menyampaikan secara alami makna kepunyaan dalam susunan Ibrani: segala sesuatu yang ada pada atau dimiliki seseorang.'
- source_word: יִתֵּן
  choice: akan memberikan
  rationale: 'Bentuk imperfek menyatakan kecenderungan umum: apa yang akan dilakukan seseorang untuk mempertahankan nyawanya.'
theological_decisions:
- issue: Penyebutan הַשָּׂטָן dalam prolog Ayub
  choice: Sang Penentang
  alternative: Satan; sang pendakwa
  rationale: Kata sandang Ibrani menunjukkan sebutan berbasis peran. Pilihan ini mempertahankan nuansa sastra dan ruang sidang ilahi dalam prolog tanpa memaksakan penggunaan “Satan” sebagai nama diri dari tradisi yang lebih kemudian.
- issue: Makna נֶפֶשׁ dalam ancaman terhadap Ayub
  choice: nyawa
  alternative: jiwa; diri
  rationale: Konteks membicarakan kesediaan manusia menyerahkan miliknya agar tetap hidup. “Nyawa” menjaga fokus pada kelangsungan hidup tanpa menetapkan antropologi dikotomis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumus ujaran “menjawab … katanya” mempertahankan pengulangan formula Ibrani, sedangkan peribahasa dibiarkan ringkas dan tidak dijelaskan berlebihan dalam teks utama.
