  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: id
  text: Lalu istrinya berkata kepadanya, “Apakah engkau masih berpegang teguh pada integritasmu? Berkatilah Allah dan matilah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “Berkatilah Allah dan matilah”; banyak orang memahami “berkatilah” di sini sebagai eufemisme penuh hormat yang berarti “kutukilah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan rangkaian kisah; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Konstruksi nomina dengan sufiks posesif ini secara langsung berarti istri Ayub.
- source_word: עֹדְךָ
  choice: Apakah engkau masih
  rationale: Adverbia dengan sufiks orang kedua menyatakan keberlanjutan dan secara alami dimasukkan ke dalam pertanyaan.
- source_word: מַחֲזִיק
  choice: berpegang teguh
  rationale: Partisipel dari חזק di sini menunjukkan tindakan terus mempertahankan atau berpaut dengan kukuh.
- source_word: בְּתֻמָּתֶךָ
  choice: pada ketulusanmu
  rationale: תֻּמָּה dapat berarti ketulusan, integritas, atau keadaan tidak bercela. “Ketulusan” mempertahankan nuansa keutuhan moral tanpa menyiratkan kesempurnaan mutlak.
- source_word: בָּרֵךְ
  choice: Berkatilah
  rationale: Bentuk Ibrani secara leksikal berarti “berkatilah”. Kemungkinan pemakaian eufemistisnya dicatat dalam catatan kaki agar bentuk sumber dan ketegangan maknanya tetap terlihat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: אֱלֹהִים adalah sebutan ilahi umum; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia Alkitabiah.
- source_word: וָמֻת
  choice: lalu matilah
  rationale: Imperatif kedua mengikuti imperatif pertama. “Lalu” menyampaikan urutan yang tersirat oleh koordinasi Ibrani sambil mempertahankan ungkapan yang singkat dan tajam.
theological_decisions:
- issue: Pemakaian eufemistis kata “memberkati” dalam ujaran tentang Allah
  choice: Mempertahankan bentuk harfiah “Berkatilah Allah” dalam teks utama dan menjelaskan kemungkinan arti eufemistisnya dalam catatan kaki.
  alternative: “Kutukilah Allah, lalu matilah.”
  rationale: Teks Ibrani memakai ברך, “memberkati”, tetapi dalam konteks ini banyak orang memahaminya sebagai eufemisme penuh hormat untuk “mengutuki”. Mempertahankan bentuk sumber dalam teks utama menjaga ambiguitas dan ketegangan asli tanpa menutup kemungkinan makna kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai sesuai register percakapan Alkitabiah; “berpegang teguh” mempertahankan daya ungkap partisipel Ibrani. Penanda catatan kaki ditempatkan setelah seluruh ujaran yang dijelaskannya.
