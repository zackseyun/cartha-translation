  - severity: low
    issue: '"menyerang Ayub dengan"'
    rationale: Walaupun dapat dipahami, frasa ini kurang tepat menangkap konstruksi "memukul/menimpakan ... kepada Ayub" dalam konteks penyakit. "Menimpakan" lebih alami dan eksplisit.
  - severity: low
