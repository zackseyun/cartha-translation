id: JOB.2.7
reference: Job 2:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: id
  text: Lalu Sang Penentang itu pergi dari hadapan Yahweh dan menimpakan bisul-bisul yang parah kepada Ayub, dari telapak kakinya sampai ke ubun-ubunnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani: “ha-satan” (harfiah, “sang penentang”); secara tradisional diterjemahkan “Satan”. Istilah ini memakai kata sandang dan dapat berfungsi sebagai gelar.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “borok-borok yang parah” atau “bisul-bisul yang menyakitkan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: Pendakwa itu
  rationale: Kata Ibrani memakai kata sandang dan dalam prolog Ayub tampaknya berfungsi sebagai gelar atau peran. “Pendakwa” mengungkap fungsi tokoh tersebut tanpa langsung menjadikannya nama diri.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Ungkapan ini secara harfiah menunjuk keberangkatan dari hadapan atau hadirat Yahweh. “Dari hadapan” alami dalam bahasa Indonesia dan mempertahankan citra teks.
- source_word: וַיַּךְ
  choice: menyerang
  rationale: Verba נכה berarti memukul atau menyerang. Dalam konteks penimpaan penyakit, “menyerang” mempertahankan tindakan langsung tanpa menyiratkan pukulan fisik semata.
- source_word: בִּשְׁחִין רָע
  choice: dengan bisul-bisul ganas
  rationale: שְׁחִין menunjuk bisul atau radang kulit, sedangkan רָע di sini menyatakan sifat parah atau buruk, bukan kejahatan moral. “Ganas” menyampaikan beratnya penyakit secara ringkas.
- source_word: מִכַּף רַגְלוֹ
  choice: dari telapak kakinya
  rationale: כַּף dalam hubungannya dengan kaki berarti telapak kaki.
- source_word: עַד קָדְקֳדוֹ
  choice: sampai ke ubun-ubunnya
  rationale: קָדְקֹד berarti puncak atau bagian teratas kepala. “Ubun-ubun” merupakan padanan Indonesia yang jelas dan idiomatis.
theological_decisions:
- issue: Penerjemahan הַשָּׂטָן dalam prolog Ayub
  choice: Pendakwa itu
  alternative: Satan
  rationale: Adanya kata sandang dalam bahasa Ibrani mendukung pembacaan sebagai gelar atau fungsi. Pilihan ini mempertahankan ketegangan mengenai identitas tokoh tersebut, sementara bentuk tradisional dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama ilahi, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Pendakwa” dipilih sebagai istilah peran yang mudah dipahami; “bisul-bisul ganas” mempertahankan kekonkretan penyakit kulit serta intensitas רָע.
