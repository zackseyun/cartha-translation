reference: Job 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: id
  text: 'Lalu Yahweh berkata kepada Sang Pendakwa[a], “Sudahkah engkau memperhatikan hamba-Ku Ayub? Sebab tidak ada seorang pun seperti dia di bumi: seorang yang tidak bercela dan lurus, yang takut akan Allah dan menjauhi kejahatan. Ia masih berpegang teguh pada integritasnya, meskipun engkau menghasut Aku untuk melawannya, untuk membinasakannya tanpa alasan[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani ha-satan, yaitu “Sang Pendakwa” atau “sang lawan”; secara tradisional diterjemahkan “Setan” atau “Iblis.”
    reason: alternative_reading
  - marker: b
    text: “Tanpa alasan” juga dapat berarti “dengan cuma-cuma” atau “tanpa pamrih.” Ungkapan ini menggemakan Ayub 1:9, ketika Sang Pendakwa bertanya apakah Ayub takut akan Allah “tanpa pamrih.” Kata “membinasakannya” secara harfiah berarti “menelannya.”
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: הַשָּׂטָן
  choice: Sang Pendakwa
  rationale: Artikel Ibrani menunjukkan gelar atau fungsi dalam adegan ini; “Pendakwa” menyampaikan peran yudisialnya tanpa langsung menjadikannya nama diri.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: sudahkah engkau menaruh perhatian kepada
  rationale: Mengungkapkan idiom harfiah “menaruh hati kepada” secara alami dalam bahasa Indonesia, tanpa mengubahnya menjadi sekadar melihat.
- source_word: עַבְדִּי
  choice: hamba-Ku
  rationale: Menyampaikan relasi Ayub sebagai orang yang menjadi milik dan melayani Allah.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: tidak ada seorang pun seperti dia di bumi
  rationale: “Di bumi” sesuai dengan cakupan universal adegan surgawi ini.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: seorang yang tidak bercela dan lurus
  rationale: “Tidak bercela” menunjuk pada keutuhan watak, bukan kesempurnaan tanpa dosa; “lurus” mempertahankan gambaran moral יָשָׁר.
- source_word: יְרֵא אֱלֹהִים
  choice: yang takut akan Allah
  rationale: Mempertahankan ungkapan teologis tentang rasa takut yang penuh hormat.
- source_word: וְסָר מֵרָע
  choice: menjauhi kejahatan
  rationale: Ungkapan Indonesia yang alami untuk tindakan berpaling atau menjauh dari kejahatan.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: Ia masih berpegang teguh pada integritasnya
  rationale: “Berpegang teguh” menangkap kekuatan מַחֲזִיק, sedangkan “integritas” menyampaikan keutuhan moral תֻמָּה dan kaitannya dengan תָּם.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: meskipun engkau menghasut Aku untuk melawannya
  rationale: Hubungan konsesif tersirat oleh konteks, sementara “menghasut Aku” mempertahankan secara langsung ketegangan mengenai keterlibatan ilahi.
- source_word: לְבַלְּעוֹ
  choice: untuk membinasakannya
  rationale: Makna metaforis “menelannya” dalam konteks ini ialah menghancurkan atau membinasakan; pilihan ini alami dalam bahasa Indonesia.
- source_word: חִנָּם
  choice: tanpa alasan
  rationale: Menunjukkan tindakan tanpa sebab yang layak; makna alternatif “dengan cuma-cuma” atau “tanpa pamrih” dalam 1:9 dicatat agar gema sastra tetap terlihat.
theological_decisions:
- issue: Keterlibatan ilahi dalam penderitaan Ayub
  choice: Mempertahankan perkataan langsung “engkau menghasut Aku untuk melawannya.”
  alternative: “engkau mendorong Aku untuk mengizinkan dia dicelakakan”
  rationale: Teks Ibrani secara langsung menyatakan bahwa Yahweh dihasut terhadap Ayub. Terjemahan tidak melunakkan ketegangan teologis itu dengan menambahkan gagasan izin.
- issue: Identitas הַשָּׂטָן
  choice: Sang Pendakwa
  alternative: Iblis; Satan; sang lawan
  rationale: Adanya artikel dalam bahasa Ibrani mendukung pembacaan sebagai gelar atau fungsi dalam narasi, bukan dengan sendirinya sebagai nama diri.
- issue: Makna חִנָּם
  choice: tanpa alasan
  alternative: dengan cuma-cuma; tanpa pamrih
  rationale: Dalam ayat ini ungkapan tersebut paling alami menyatakan bahwa Ayub dibinasakan tanpa sebab, tetapi polisemi yang menggemakan pertanyaan di Ayub 1:9 tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan “engkau” dipakai sesuai konteks dialog ilahi. Kapitalisasi pronomina yang mengacu kepada Yahweh mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
