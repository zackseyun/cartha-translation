review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan bahwa mereka melihat Ayub dari jauh, tidak mengenalinya, merobek jubah masing-masing, dan melemparkan debu ke atas kepala mereka. Namun, וַיִּשְׂאוּ קוֹלָם secara khusus berarti mereka ‘mengangkat/meninggikan suara mereka’ sebelum menangis; ‘menangis dengan suara nyaring’ menggabungkan kedua verba dan menggeser tindakan eksplisit itu menjadi sekadar cara menangis.
  naturalness: Bahasa draf umumnya baku dan alami. ‘Mereka mengangkat suara lalu menangis’ tetap wajar dalam register naratif kitab suci modern serta lebih dekat dengan idiom Ibrani daripada parafrasa ‘menangis dengan suara nyaring’.
  terminology: ‘Mengenalinya’, ‘jubahnya’, dan ‘debu’ sesuai konteks. ‘Langit’ memadai untuk הַשָּׁמָיְמָה, dengan catatan kaki yang menjelaskan arah ke atas dan gestur perkabungan.
  issues:
