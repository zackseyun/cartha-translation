translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Idiom Ibrani yang akan terdengar kaku bila diterjemahkan secara harfiah dialihkan secara alami, sementara tindakan perkabungan dan arah geraknya tetap dipertahankan. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
