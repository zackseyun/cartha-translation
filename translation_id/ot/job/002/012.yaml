    issue: Tindakan ‘mengangkat suara’ tidak diterjemahkan secara tersendiri.
    rationale: Teks Ibrani memiliki dua tindakan berurutan, ‘mereka mengangkat suara mereka’ dan ‘mereka menangis’. Terjemahan perlu mempertahankan keduanya tanpa menyatakan secara berlebihan bahwa tangisan itu ‘nyaring’.
