  text: וַ/יִּשְׂא֨וּ אֶת עֵינֵי/הֶ֤ם מֵ/רָחוֹק֙ וְ/לֹ֣א הִכִּירֻ֔/הוּ וַ/יִּשְׂא֥וּ קוֹלָ֖/ם וַ/יִּבְכּ֑וּ וַֽ/יִּקְרְעוּ֙ אִ֣ישׁ מְעִל֔/וֹ וַ/יִּזְרְק֥וּ עָפָ֛ר עַל רָאשֵׁי/הֶ֖ם הַ/שָּׁמָֽיְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: id
  text: Ketika mereka memandang dari kejauhan[a], mereka tidak mengenalinya. Mereka pun mengangkat suara lalu menangis. Masing-masing merobek jubahnya, lalu mereka melemparkan debu ke atas kepala mereka, ke arah langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari jauh.”'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka melemparkan debu ke atas sehingga jatuh di atas kepala mereka sebagai tanda perkabungan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת־עֵינֵיהֶם
  choice: mereka memandang
  rationale: Ungkapan Ibrani harfiah 'mengangkat mata mereka' secara idiomatis berarti mengarahkan pandangan. 'Memandang' menyampaikan tindakannya dengan wajar dalam bahasa Indonesia modern.
- source_word: מֵרָחוֹק
  choice: dari kejauhan
  rationale: Menunjukkan bahwa mereka melihat Ayub ketika masih berada pada jarak yang jauh; bentuk ini alami dan tetap mempertahankan perspektif sumber.
- source_word: וְלֹא הִכִּירֻהוּ
  choice: mereka tidak mengenalinya
  rationale: Dalam konteks ini verba tersebut berarti gagal mengenali identitas Ayub karena penampilannya, bukan tidak mengenal atau tidak mengetahui siapa dia.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: mereka pun menangis dengan suara nyaring
  rationale: Mengungkapkan idiom 'mengangkat suara' bersama tindakan menangis sebagai ratapan yang terdengar keras, tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: masing-masing merobek jubahnya
  rationale: אִישׁ dipakai secara distributif, sedangkan מְעִיל menunjuk pada jubah atau pakaian luar. Terjemahan ini jelas dan mempertahankan tindakan perkabungan setiap orang.
- source_word: וַיִּזְרְקוּ עָפָר עַל־רָאשֵׁיהֶם
  choice: mereka melemparkan debu ke atas kepala mereka
  rationale: Mempertahankan tindakan konkret dalam upacara perkabungan dan bentuk jamak 'kepala mereka' dari teks Ibrani.
- source_word: הַשָּׁמָיְמָה
  choice: ke arah langit
  rationale: Akhiran direktif menyatakan gerak ke arah atas. 'Ke arah langit' mempertahankan arah tersebut tanpa menafsirkan bahwa debu mencapai langit.
