base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: id
  text: Namun, ia berkata kepadanya, “Engkau berbicara seperti salah seorang dari perempuan-perempuan bebal. Apakah kita menerima yang baik dari Allah, tetapi tidak menerima yang buruk[a]?” Dalam semua itu Ayub tidak berdosa dengan bibirnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “malapetaka”; secara tradisional, “kejahatan.” Kata Ibrani רָע di sini menunjuk pada keadaan yang merugikan atau tidak menguntungkan, sebagai lawan dari “yang baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: Engkau berbicara seperti salah seorang perempuan bebal
  rationale: Kata נְבָלוֹת menyatakan kebebalan dalam arti moral dan keagamaan, bukan sekadar kurang cerdas. “Bebal” mempertahankan daya etis ungkapan itu dan tetap wajar dalam bahasa Indonesia.
- source_word: גַּם אֶת הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: Apakah kita mau menerima yang baik dari Allah
  rationale: Bentuk imperfek נְקַבֵּל dalam konteks ini merupakan bagian dari pertanyaan retoris. “Yang baik” mempertahankan kategori luas dalam teks Ibrani, yakni segala hal yang baik atau menguntungkan.
- source_word: וְאֶת הָרָע לֹא נְקַבֵּל
  choice: tetapi tidak mau menerima yang buruk
  rationale: רָע dapat menunjuk pada kejahatan moral maupun keadaan buruk. Dalam pertentangannya dengan “yang baik” dan dalam konteks penderitaan Ayub, ungkapan ini terutama menunjuk pada pengalaman yang merugikan. “Yang buruk” mempertahankan kesejajaran leksikal tanpa sepenuhnya meniadakan keluasan istilah Ibrani; alternatif yang lebih kontekstual dijelaskan dalam catatan kaki.
- source_word: בְּכָל־זֹאת
  choice: Dalam semuanya itu
  rationale: Ungkapan ini secara alami memperkenalkan penilaian narator terhadap seluruh keadaan dan perkataan yang baru disebutkan.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: Ayub tidak berdosa dengan bibirnya
  rationale: Terjemahan ini mempertahankan gambaran tubuh dalam teks Ibrani dan nuansa bahwa penilaian narator secara khusus menyangkut perkataan Ayub.
theological_decisions:
- issue: Makna הָרָע dalam kaitannya dengan Allah
  choice: yang buruk
  alternative: malapetaka; kejahatan
  rationale: Dalam konteks ini, הָרָע dipertentangkan dengan “yang baik” dan menunjuk pada keadaan merugikan yang dialami di bawah kedaulatan Allah, tanpa mengharuskan pengertian bahwa Allah melakukan kejahatan moral. Pilihan ini mempertahankan ketegangan teks, sedangkan catatan kaki menyajikan padanan kontekstual dan tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” sesuai dengan dialog langsung bernuansa sastra. Struktur pertanyaan retoris dibuat alami dalam bahasa Indonesia, sementara ungkapan “dengan bibirnya” dipertahankan untuk menjaga citra dan batas penilaian narator dalam teks sumber.
