reference: Job 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: id
  text: Lalu TUHAN berkata kepada Pendakwa, “Lihat, ia ada dalam tanganmu. Hanya saja, jangan cabut nyawanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH, dengan huruf kapital yang membedakannya dari gelar biasa.
- source_word: הַשָּׂטָן
  choice: Pendakwa
  rationale: Dengan artikel tertentu, bentuk ini dalam konteks prolog Ayub menunjuk pada peran sebagai penentang atau pendakwa; terjemahan jabatan mempertahankan fungsi istilah tanpa langsung menjadikannya nama diri.
- source_word: הִנּוֹ
  choice: Lihat
  rationale: Menyampaikan partikel penunjuk yang menarik perhatian pada ketetapan yang segera dinyatakan.
- source_word: בְיָדֶךָ
  choice: ada dalam tanganmu
  rationale: Mempertahankan metafora Ibrani tentang penyerahan ke dalam kuasa atau kendali pihak lain.
- source_word: נַפְשׁוֹ
  choice: nyawanya
  rationale: Dalam konteks ancaman jasmani, נֶפֶשׁ merujuk pada hidup atau nyawa Ayub, bukan pada konsep abstrak tentang jiwa.
- source_word: שְׁמֹר
  choice: jangan cabut
  rationale: 'Secara idiomatis menyatakan batas larangan yang dimaksud oleh imperatif ''jaga/pelihara'': Pendakwa tidak boleh mengambil nyawa Ayub.'
theological_decisions:
- issue: Identitas הַשָּׂטָן
  choice: Pendakwa
  alternative: Iblis
  rationale: Teks Ibrani memakai artikel tertentu dan menonjolkan fungsi tokoh itu. 'Pendakwa' mempertahankan ambiguitas naratif tanpa memaksakan identifikasi teologis yang lebih kemudian.
- issue: Ruang lingkup kuasa Pendakwa
  choice: Metafora 'dalam tanganmu' dipertahankan, disertai larangan mencabut nyawa
  alternative: Menjelaskan secara eksplisit bahwa TUHAN memberi izin terbatas untuk menyiksa Ayub
  rationale: Terjemahan mempertahankan ketegangan teologis dan bentuk metaforis teks tanpa menambahkan penjelasan kausal atau moral yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Lalu' meneruskan alur narasi; 'Hanya saja' menandai pembatasan dengan jelas. Tidak ada catatan kaki karena semua keputusan dapat disampaikan secara memadai dalam teks utama.
