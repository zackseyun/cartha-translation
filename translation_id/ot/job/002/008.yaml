translation:
  language: id
  text: Lalu Ayub mengambil sebuah pecahan tembikar[a] untuk menggaruk dirinya dengan pecahan itu[b], sementara ia duduk di tengah abu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sekeping tembikar.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mengikis dirinya.” Kata Ibrani ini dapat berarti menggaruk atau mengikis; penggunaan pecahan tembikar mendukung nuansa mengikis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu Ayub mengambil
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Nama Ayub dinyatakan agar subjek alami dan jelas dalam bahasa Indonesia.
- source_word: לוֹ
  choice: mengambil
  rationale: Pronomina datif ini dapat tersirat secara idiomatis dalam verba bahasa Indonesia; 'mengambil bagi dirinya' akan terasa kaku.
- source_word: חֶרֶשׂ
  choice: sekeping tembikar
  rationale: Kata ini menunjuk pada pecahan barang gerabah. 'Sekeping tembikar' ringkas, tepat, dan mudah dipahami.
- source_word: לְהִתְגָּרֵד
  choice: untuk menggaruk tubuhnya
  rationale: Infinitif hitpael menyatakan tindakan yang dikenakan Ayub pada dirinya sendiri. 'Menggaruk' mempertahankan cakupan makna verba tanpa menentukan secara berlebihan apakah tindakannya lebih berupa menggaruk atau mengikis.
- source_word: בּוֹ
  choice: dengan pecahan itu (tersirat)
  rationale: Preposisi dan pronomina menyatakan alat, yakni keping tembikar tersebut. Dalam susunan Indonesia, hubungan instrumental sudah jelas dari 'mengambil ... untuk menggaruk'; alternatif eksplisit dicatat dalam pertimbangan terjemahan.
- source_word: וְהוּא יֹשֵׁב
  choice: sementara ia duduk
  rationale: Klausa ini menyatakan keadaan yang berlangsung bersamaan dengan tindakan menggaruk.
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: di tengah abu
  rationale: Terjemahan ini mempertahankan arti harfiah 'di tengah' tanpa menambahkan gagasan bahwa tempat itu pasti sebuah timbunan abu.
