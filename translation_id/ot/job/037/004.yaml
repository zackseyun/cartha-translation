  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: id
  text: Sesudah kilat itu[a], suara mengaum; Ia mengguntur dengan suara-Nya yang agung, dan tidak menahannya[b] ketika[c] suara-Nya terdengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sesudahnya, suara mengaum.” Ungkapan Ibrani ini dapat dipahami secara adverbial, tetapi konteksnya kemungkinan besar menunjuk kembali kepada kilat dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “Ia tidak menundanya.” Objek dalam bahasa Ibrani berbentuk jamak dan kemungkinan menunjuk kepada kilat-kilat atau gejala badai yang dilepaskan bersama bunyi guruh.
    reason: lexical_alternative
  - marker: c
    text: Atau “karena suara-Nya terdengar.” Kata penghubung Ibrani ini dapat dipahami secara kausal maupun temporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah kilat itu
  rationale: Bentuk ini secara harfiah berarti “sesudah dia/itu.” Dalam konteks, akhiran pronominalnya paling mungkin menunjuk kepada kilat pada ayat sebelumnya. Penyebutan “kilat” membuat hubungan itu jelas dalam bahasa Indonesia, sementara kemungkinan pembacaan adverbial dicatat dalam catatan kaki.
- source_word: יִשְׁאַג קוֹל
  choice: suara mengaum
  rationale: Kata kerja שׁאג lazim menggambarkan auman singa dan di sini dipakai secara metaforis untuk bunyi guruh. Terjemahan ini mempertahankan gambaran yang hidup tanpa lebih dahulu menambahkan pronomina kepunyaan yang baru muncul kemudian.
- source_word: יַרְעֵם
  choice: Ia mengguntur
  rationale: Bentuk Hifil dari רעם menyatakan tindakan menghasilkan guruh. “Ia mengguntur” ringkas dan mempertahankan Allah sebagai pelaku, sebagaimana ditunjukkan konteks dan frasa berikutnya.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: dengan suara-Nya yang agung
  rationale: גָּאוֹן dapat menyatakan keagungan, keluhuran, atau kemegahan. “Suara-Nya yang agung” terdengar alami dan bermartabat dalam bahasa Indonesia serta mempertahankan nuansa kebesaran ilahi.
- source_word: וְלֹא יְעַקְּבֵם
  choice: Ia tidak menahan semuanya itu
  rationale: Dalam bentuk Piel, עקב dapat berarti menahan, menghambat, atau menunda. Akhiran orang ketiga jamak dibiarkan memiliki rujukan kontekstual yang tidak sepenuhnya dinyatakan, sebagaimana dalam bahasa Ibrani.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: ketika suara-Nya terdengar
  rationale: כִּי dapat dipahami secara temporal maupun kausal. Pembacaan temporal sesuai dengan urutan kilat lalu guruh dalam konteks, tetapi kemungkinan kausal tetap dicatat.
theological_decisions:
- issue: Pelaku yang mengaum dan mengguntur
  choice: “Ia” menunjuk kepada Allah, yang suara-Nya terwujud dalam guruh.
  alternative: Suara atau badai dapat dipahami secara lebih impersonal sebagai subjek gambaran tersebut.
  rationale: Konteks langsung menggambarkan tindakan Allah dalam badai, dan ungkapan “suara-Nya yang agung” kuat mendukung pelaku pribadi ilahi. Nama “Allah” tidak ditambahkan ke teks karena bahasa Ibrani hanya menyiratkannya melalui bentuk orang ketiga tunggal dan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. “Suara mengaum” mempertahankan metafora Ibrani, sedangkan “mengguntur” mempertahankan tindakan ilahi secara langsung. Kapitalisasi “Ia” dan “-Nya” menandai rujukan kepada Allah sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia tanpa menambahkan nama ilahi ke dalam ayat.
