  text: Engkau, yang pakaianmu panas ketika bumi menjadi tenang karena angin dari selatan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari selatan.” Secara harfiah, bahasa Ibrani berbunyi “dari selatan,” yang dapat menunjuk lebih umum kepada kawasan selatan; “angin dari selatan” memperjelas makna meteorologisnya.'
