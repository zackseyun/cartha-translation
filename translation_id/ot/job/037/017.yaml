lexical_decisions:
- source_word: אֲשֶׁר
  choice: engkau yang
  rationale: Partikel relatif ini, dalam konteks sapaan Elihu kepada Ayub, paling alami diterjemahkan sebagai klausa relatif yang menerangkan orang kedua.
- source_word: בְּגָדֶיךָ
  choice: pakaianmu
  rationale: בגד berarti pakaian atau kain yang dikenakan; 'pakaianmu' alami dalam bahasa Indonesia modern dan tetap sesuai dengan ragam puitis.
- source_word: חַמִּים
  choice: terasa panas
  rationale: Adjektiva ini berarti panas atau hangat. 'Terasa panas' mengungkapkan pengalaman pemakainya secara alami tanpa mengubah gambaran meteorologis.
- source_word: בְּהַשְׁקִט
  choice: ketika ... menjadi tenang
  rationale: Bentuk dari שקט dengan prefiks ב berfungsi temporal dan menggambarkan keadaan bumi yang tenang atau tidak terusik.
- source_word: אֶרֶץ
  choice: bumi
  rationale: אֶרֶץ dapat berarti bumi atau negeri; dalam gambaran cuaca ini, 'bumi' mempertahankan cakupan luas teks.
- source_word: מִדָּרוֹם
  choice: karena angin selatan
  rationale: Secara harfiah berarti 'dari selatan'. Dalam konteks meteorologis, ungkapan ini dapat menunjuk pada angin panas dari selatan; terjemahan utama membuat hubungan sebab dan gambaran cuacanya eksplisit, sementara bentuk harfiahnya dicatat.
