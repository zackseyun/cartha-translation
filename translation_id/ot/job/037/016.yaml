  - severity: medium
    issue: Konstruksi “keajaiban-keajaiban Dia” tidak cukup idiomatis dan hubungan kepemilikannya kurang jelas.
    rationale: Frasa Ibrani מִפְלְאוֹת תְּמִים דֵּעִים menyatakan keajaiban-keajaiban yang berkaitan dengan/berasal dari pihak yang sempurna dalam pengetahuan. Penambahan “dari” membuat hubungan ini jelas tanpa menentukan rujukan dengan nama eksplisit.
