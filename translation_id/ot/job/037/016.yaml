  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: id
  text: Tahukah engkau tentang keseimbangan awan[a], tentang keajaiban-keajaiban dari Dia yang sempurna dalam pengetahuan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamparan awan.” Istilah Ibraninya langka dan nuansa tepatnya tidak pasti; kemungkinan kata itu menunjuk pada cara awan dihamparkan atau melayang di langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Tahukah engkau
  rationale: Partikel tanya הֲ dan bentuk ידע orang kedua tunggal maskulin membentuk pertanyaan retoris langsung. Bentuk ini alami dan tetap bernada khidmat dalam bahasa Indonesia.
- source_word: עַל
  choice: tentang
  rationale: Di sini עַל memperkenalkan pokok yang diketahui; 'tentang' menyampaikan fungsi tersebut secara idiomatis.
- source_word: מִפְלְשֵׂי עָב
  choice: keseimbangan awan-awan
  rationale: מִפְלְשֵׂי adalah istilah langka dan maknanya tidak pasti. 'Keseimbangan' mempertahankan gambaran awan yang tertata atau tergantung di langit, sementara kemungkinan 'hamparan' dicatat dalam catatan kaki.
- source_word: מִפְלְאוֹת
  choice: keajaiban-keajaiban
  rationale: Bentuk ini menunjuk kepada hal-hal atau karya-karya menakjubkan; bentuk ulang menyampaikan nilai jamaknya.
- source_word: תְּמִים
  choice: sempurna
  rationale: Dalam konteks ini kata tersebut menyatakan keutuhan atau kesempurnaan, bukan hanya ketidakbersalahan moral.
- source_word: דֵּעִים
  choice: dalam pengetahuan
  rationale: Bentuk jamak Ibrani dapat mengungkapkan kepenuhan atau kelimpahan pengetahuan. Bahasa Indonesia wajar memakai nomina abstrak tunggal.
theological_decisions:
- issue: Rujukan frasa 'yang sempurna dalam pengetahuan'
  choice: Dia yang sempurna dalam pengetahuan, dengan rujukan ditentukan oleh konteks
  alternative: Menyebut 'Allah' secara eksplisit; seorang berhikmat secara umum; rujukan tidak langsung kepada Elihu
  rationale: Konteks pembicaraan Elihu mengenai penguasaan ilahi atas cuaca paling wajar menunjuk kepada Allah. Namun, karena teks Ibrani tidak menyebut nama Allah dalam frasa ini, terjemahan tidak menambahkannya dan membiarkan konteks menentukan rujukan.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. 'Engkau' dipakai untuk mempertahankan sapaan tunggal langsung dalam wacana puitis. Pengulangan 'tentang' memperjelas kesejajaran kedua unsur pertanyaan.
