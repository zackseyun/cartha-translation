revisions:
- from: Sebab kepada salju Ia berfirman, “Turunlah ke bumi,”[a] dan kepada hujan, “Jadilah hujan deras,” dan kepada curahan-curahan hujan, “Jadilah curahan dahsyat oleh kuasa-Nya.”[b]
  to: Sebab kepada salju Ia berfirman, “Turunlah ke bumi,”[a] dan kepada hujan, “Jadilah hujan deras,” dan kepada hujan-hujan, “Jadilah curahan hujan dahsyat yang menyatakan kuasa-Nya.”[b]
  rationale: Revisi mempertahankan tiga ujaran puitis yang digunakan dalam audit Inggris serta jangkar catatan kaki yang ada. Istilah yang tidak alami diganti, dan hubungan antara hujan deras dan kuasa Allah tidak lagi diterjemahkan secara instrumental dengan “oleh.” Frasa “yang menyatakan” merupakan pengungkapan Indonesia yang jelas atas metafora genitif yang padat, tanpa mengubahnya menjadi klaim bahwa kuasa Allah adalah alat gramatikal bagi hujan.
