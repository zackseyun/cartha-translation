  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: id
  text: Sebab kepada salju Ia berfirman, “Turunlah ke bumi,”[a] dan kepada hujan, “Jadilah hujan deras,” dan kepada hujan-hujan, “Jadilah curahan hujan dahsyat yang menyatakan kuasa-Nya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Beradalah di bumi,” dalam arti bahwa salju diperintahkan untuk muncul atau terhampar di atas tanah.'
    reason: lexical_alternative
  - marker: b
    text: 'Frasa terakhir juga dapat diterjemahkan: “dan hujan-hujan lebat yang menyatakan kekuatan-Nya” atau “dan curahan hujan yang dahsyat.” Susunan bahasa Ibraninya padat dan puitis; secara harfiah frasa itu menghubungkan hujan-hujan dengan kuasa-Nya.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan tentang kuasa Allah atas cuaca dalam konteks sebelumnya.
- source_word: לַשֶּׁלַג
  choice: kepada salju
  rationale: Preposisi ל dengan אמר menandai pihak yang diajak bicara dan mempertahankan personifikasi puitis.
- source_word: יֹאמַר
  choice: Ia berfirman
  rationale: Bentuk imperfek menggambarkan tindakan khas atau kini secara puitis; 'berfirman' wajar untuk ujaran ilahi tanpa perlu menambahkan kata 'memerintahkan'.
- source_word: הֱוֵא אָרֶץ
  choice: Turunlah ke bumi
  rationale: Secara harfiah ungkapan ini dekat dengan 'jadilah/beradalah di bumi'; dalam konteks salju, 'turunlah' mengungkapkan tindakan yang dimaksud secara alami, sementara alternatif literal dicatat dalam catatan kaki.
- source_word: וְגֶשֶׁם מָטָר
  choice: dan kepada hujan, ‘Jadilah hujan deras’
  rationale: Dua kata yang berdekatan maknanya dipertahankan sebagai ujaran kepada hujan agar paralelisme dan peningkatan gambaran tetap terasa.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: dan kepada curahan-curahan hujan, ‘Jadilah curahan dahsyat oleh kuasa-Nya’
  rationale: Bentuk jamak מִטְרוֹת menyiratkan curahan hujan yang berulang atau meningkat; konstruksi Ibrani yang padat dipertahankan sebagai perintah paralel dengan penjelasan alternatif dalam catatan kaki.
- source_word: עֻזּוֹ
  choice: oleh kuasa-Nya
  rationale: Akhiran orang ketiga tunggal maskulin paling wajar merujuk kepada Allah sebagai pembicara dan penguasa cuaca dalam konteks.
theological_decisions:
- issue: Acuan pronomina dalam עֻזּוֹ
  choice: 'Akhiran merujuk kepada Allah: ''kuasa-Nya''.'
  alternative: 'Akhiran dapat dipahami merujuk kepada hujan: ''kekuatannya''.'
  rationale: Allah adalah pelaku tersirat yang berfirman kepada unsur-unsur cuaca dalam konteks langsung. Namun, karena susunan Ibraninya padat, kemungkinan acuan kepada daya hujan dicatat sebagai bagian dari alternatif terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Pengulangan 'hujan/curahan' sengaja dipertahankan untuk mencerminkan paralelisme dan kepadatan teks Ibrani.
