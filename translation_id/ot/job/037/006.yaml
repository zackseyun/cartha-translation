  terminology: “Ia berfirman,” “salju,” “hujan,” dan kapitalisasi pronomina ilahi sesuai dengan register Alkitab Indonesia. Catatan a tepat. Catatan b perlu diperbarui agar tidak mempertahankan frasa “oleh kekuatan-Nya,” yang sama-sama menggeser hubungan genitif dalam teks sumber.
