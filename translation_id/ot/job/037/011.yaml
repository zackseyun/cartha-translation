lexical_decisions:
- source_word: אַף
  choice: Bahkan
  rationale: Partikel ini menambahkan sekaligus menegaskan gambaran berikutnya tentang kuasa Allah atas cuaca.
- source_word: בְּרִי
  choice: dengan air
  rationale: Kata Ibrani ini sulit dipastikan. Dalam konteks awan yang dibuat sarat, makna air atau hujan paling sesuai, tetapi ketidakpastiannya dipertahankan dalam catatan kaki.
- source_word: יַטְרִיחַ
  choice: membuat ... sarat
  rationale: Bentuk kausatif kata kerja ini menggambarkan tindakan memberi beban. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran awan yang sarat air.
- source_word: עָב
  choice: awan tebal
  rationale: Kata ini menunjuk pada awan yang padat atau tebal.
- source_word: יָפִיץ
  choice: menyebarkan
  rationale: Bentuk kausatif ini berarti menceraiberaikan atau menyebarkan; pilihan ini cocok dengan gerakan awan.
- source_word: עֲנַן אוֹרוֹ
  choice: awan cahaya-Nya
  rationale: Terjemahan ini mempertahankan susunan harfiah yang tidak biasa, yaitu awan yang berkaitan dengan cahaya milik-Nya, tanpa langsung menafsirkannya sebagai kilat.
