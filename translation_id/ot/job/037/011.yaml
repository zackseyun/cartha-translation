  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: id
  text: Sungguh, Ia membuat awan tebal sarat dengan air[a]; Ia menyebarkan awan cahaya-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan hujan” atau “dengan uap air”; arti kata Ibrani ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “awan kilat-Nya”; dalam konteks badai, “cahaya-Nya” mungkin menunjuk pada kilat.
