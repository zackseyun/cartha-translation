  to: Awan itu berputar berkeliling[a] menurut pengarahan-Nya,[b] untuk melaksanakan segala yang diperintahkan-Nya kepada mereka di seluruh muka bumi yang berpenghuni.[c]
  rationale: Revisi mengganti gambaran gerak yang terutama arah-bolak-balik dengan perputaran sirkular yang lebih dekat kepada teks Ibrani. Penutup dilancarkan menjadi bahasa Indonesia modern tanpa menghilangkan cakupan “dunia yang berpenghuni” dan penekanan pada bumi. Catatan kaki mempertahankan alternatif leksikal serta ketidakpastian yang sah mengenai fungsi akhiran arah dan rujukan pronomina.
