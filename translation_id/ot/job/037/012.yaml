  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: id
  text: Awan itu berputar berkeliling[a] menurut pengarahan-Nya,[b] untuk melaksanakan segala yang diperintahkan-Nya kepada mereka di seluruh muka bumi yang berpenghuni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berputar ke sana kemari” atau “berputar dalam lingkaran”; bahasa Ibrani menekankan gerak berputar yang berulang.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut pengemudian-Nya” atau “menurut arahan-Nya”; istilah Ibrani menyiratkan pengarahan atau pengendalian yang terampil.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di atas muka dunia yang berpenghuni, ke bumi/ke arah bumi”; ungkapan berlapis ini menunjuk pada dunia terestrial. “Awan itu” juga dapat dipahami lebih luas sebagai kumpulan awan atau gejala badai.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: וְהוּא
  choice: Awan itu
  rationale: Pronomina maskulin tunggal ini merujuk kembali pada awan atau kumpulan awan dalam konteks terdekat. Penyebutan nomina membuat rujukannya jelas dalam bahasa Indonesia tanpa mengidentifikasinya secara ilmiah dengan terlalu sempit.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: berputar ke sana kemari
  rationale: Gabungan bentuk ini menggambarkan gerak berputar yang berulang sekaligus perubahan arah. Ungkapan Indonesia ini mempertahankan kedua unsur tersebut secara wajar.
- source_word: בְתַחְבֻּלֹתוֹ
  choice: menurut pengarahan-Nya
  rationale: Kata ini dapat menggambarkan pengemudian, pengarahan, atau pengendalian yang terampil. 'Pengarahan-Nya' sesuai dengan konteks kuasa Allah atas gejala cuaca tanpa memakai istilah teknis.
- source_word: לְפָעֳלָם
  choice: untuk melaksanakan
  rationale: Bentuk ini menyatakan tujuan, yaitu agar para pelaku cuaca menjalankan apa yang ditetapkan bagi mereka.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: segala yang diperintahkan-Nya kepada mereka
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dan sufiks objek jamak pada verba 'memerintahkan'.
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: di seluruh muka dunia yang berpenghuni di bumi
  rationale: Ungkapan ini mempertahankan citra 'muka', nuansa תֵבֵל sebagai dunia berpenghuni, dan unsur terestrial pada אָרְצָה, meskipun hasilnya sengaja sedikit berlapis seperti bahasa Ibrani.
theological_decisions:
- issue: Rujukan pronomina tunggal dan rangkaian verba dalam konteks cuaca
  choice: Ayat ini menggambarkan awan sebagai bagian dari gejala cuaca yang bergerak di bawah pengarahan Allah.
  alternative: Pronomina itu dapat menunjuk lebih luas pada kumpulan awan, badai, atau sistem cuaca.
  rationale: Konteks terdekat menyebut awan, kilat, dan badai sebagai sarana pemerintahan Allah. Terjemahan memakai 'awan' sebagai rujukan gramatikal yang paling dekat, sementara catatan kaki mengakui kemungkinan cakupan yang lebih luas.
- issue: Objek jamak dalam יְצַוֵּם setelah subjek tunggal
  choice: '''Mereka'' dipertahankan sebagai para pelaku atau unsur cuaca yang menerima perintah Allah.'
  alternative: Kalimat dapat dilancarkan menjadi 'melaksanakan segala perintah-Nya' tanpa menyatakan objek jamak.
  rationale: Mempertahankan 'mereka' mencerminkan perubahan bilangan dalam teks Ibrani dan menjaga ketegangan antara awan sebagai kesatuan dan unsur-unsur cuaca sebagai pelaku jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berputar ke sana kemari' mudah dipahami serta mempertahankan gerak berulang dan perubahan arah. Bentuk hormat ilahi ditandai dengan huruf kapital pada sufiks -Nya. Susunan akhir sengaja mempertahankan sebagian sifat berlapis ungkapan Ibrani, dengan penjelasan pada catatan kaki.
