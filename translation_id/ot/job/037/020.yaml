  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: id
  text: Haruskah diberitahukan kepadanya bahwa aku hendak berbicara? Jika seseorang berbicara, ia pasti akan ditelan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani ayat ini sulit. Terjemahan lain: “Haruskah diberitahukan kepadanya bahwa aku berbicara? Atau patutkah seseorang berkata bahwa ia akan ditelan?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: Haruskah disampaikan
  rationale: Bentuk pasif dengan הֲ diterjemahkan sebagai pertanyaan retoris impersonal, dekat dengan susunan Ibrani dan wajar dalam bahasa Indonesia.
- source_word: לוֹ
  choice: kepada-Nya
  rationale: Dalam konteks, pronomina ini merujuk kepada Allah. Kapitalisasi merupakan gaya bahasa Indonesia untuk memperjelas rujukan, bukan ciri gramatikal bahasa Ibrani.
- source_word: כִּי אֲדַבֵּר
  choice: bahwa aku hendak berbicara
  rationale: כִּי memperkenalkan isi pemberitaan, sedangkan bentuk imperfek אֲדַבֵּר memiliki nuansa tindakan yang sedang dipertimbangkan.
- source_word: אִם אָמַר אִישׁ
  choice: Jika seseorang berkata demikian
  rationale: אִם dipertahankan sebagai syarat. אִישׁ bersifat generik dalam konteks ini, sehingga 'seseorang' alami dalam bahasa Indonesia; 'demikian' melengkapi objek tersirat tanpa menentukan isi lebih jauh.
- source_word: כִּי יְבֻלָּע
  choice: ia pasti akan ditelan
  rationale: בלע mempertahankan gambaran hidup 'ditelan'; כִּי dipahami memberi penegasan pada akibat dalam konstruksi yang sulit ini.
theological_decisions:
- issue: Rujukan pronomina לוֹ
  choice: kepada-Nya, merujuk kepada Allah
  alternative: kepadanya
  rationale: Konteks menjadikan Allah sebagai rujukan yang paling mungkin. Kapitalisasi memperjelasnya bagi pembaca Indonesia tanpa menambahkan gelar atau ciri ilahi yang tidak ada dalam teks.
- issue: Cakupan generik אִישׁ
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Di sini אִישׁ menyatakan siapa pun yang melakukan tindakan tersebut, bukan menonjolkan jenis kelamin; 'seseorang' mempertahankan fungsi generiknya secara alami.
- issue: Sintaks klausa kedua yang sukar
  choice: Jika seseorang berkata demikian, ia pasti akan ditelan
  alternative: Atau patutkah seseorang berkata bahwa ia akan ditelan?
  rationale: Teks Ibrani sangat padat dan dapat dipahami sebagai syarat dengan akibat atau sebagai pertanyaan alternatif. Teks utama mengikuti konstruksi syarat, sementara kemungkinan lain dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pertanyaan retoris serta gambaran konkret 'ditelan' dipertahankan; sintaks diperjelas secukupnya tanpa meniadakan ambiguitas naskah.
