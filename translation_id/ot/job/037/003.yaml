  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: id
  text: Ke seluruh kolong langit Ia mengirimkannya, dan cahaya-Nya sampai ke ujung-ujung bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan cahaya-Nya di atas sayap-sayap bumi.” Dalam konteks ini, “cahaya-Nya” mungkin merujuk pada kilat, sedangkan “sayap-sayap bumi” adalah ungkapan puitis untuk bagian-bagian bumi yang paling jauh.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: Di bawah seluruh langit
  rationale: Mempertahankan gambaran ruang dari תַּחַת dan cakupan menyeluruh dari כָּל. Dalam bahasa Indonesia, bentuk tunggal kolektif “langit” lebih alami daripada “segala langit”, tanpa mengubah maksud Ibrani.
- source_word: יִשְׁרֵהוּ
  choice: Ia melepaskannya
  rationale: Verba puitis ini dapat menyatakan tindakan mengirimkan, mengarahkan, atau membiarkan lepas. “Melepaskannya” sesuai dengan gambaran daya badai dan tetap mempertahankan objek pronominal yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: וְאוֹרוֹ
  choice: dan cahaya-Nya
  rationale: אוֹר secara langsung berarti “cahaya”. Konteks badai mungkin menunjuk pada kilat, tetapi teks tidak memakai kata khusus untuk kilat; karena itu terjemahan utama mempertahankan ambiguitas leksikal tersebut.
- source_word: עַל כַּנְפוֹת הָאָרֶץ
  choice: sampai ke ujung-ujung bumi
  rationale: Secara harfiah ungkapan ini berbunyi “di atas sayap-sayap bumi”, sebuah gambaran puitis bagi bagian-bagian bumi yang paling jauh. “Sampai ke ujung-ujung bumi” menyampaikan jangkauan geraknya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah אוֹרוֹ harus ditafsirkan secara eksplisit sebagai kilat
  choice: cahaya-Nya
  alternative: kilat-Nya
  rationale: Konteks nyanyian tentang badai mendukung pengertian “kilat”, tetapi kata Ibraninya tetap “cahaya”. Terjemahan utama tidak menutup kemungkinan bahwa cahaya itu adalah kilat; catatan kaki menjelaskan kemungkinan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Susunan klausa dipertahankan dekat dengan puisi Ibrani, sementara idiom “sayap-sayap bumi” dijelaskan dalam catatan agar teks utama tetap mudah dipahami.
