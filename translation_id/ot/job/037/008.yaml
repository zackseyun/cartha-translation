  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: id
  text: Lalu binatang liar masuk ke tempat persembunyiannya[a] dan tinggal di tempat-tempat kediamannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke tempat pengintaiannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Lalu ... masuk
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan puitis. 'Lalu ... masuk' mempertahankan gerak urutan itu dalam bahasa Indonesia yang alami.
- source_word: חַיָּה
  choice: binatang liar
  rationale: חַיָּה dapat berarti binatang secara umum atau binatang liar. Dalam konteks cuaca ini, yang dimaksud adalah makhluk liar secara generik, bukan spesies tertentu.
- source_word: בְמוֹ אָרֶב
  choice: ke tempat persembunyiannya
  rationale: אָרֶב menunjuk pada tempat tersembunyi untuk mengintai atau berlindung. 'Tempat persembunyian' mempertahankan cakupan maknanya tanpa menyamakannya sepenuhnya dengan מְעוֹנוֹת pada baris berikutnya.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: di sarang-sarangnya
  rationale: מְעוֹנוֹת berarti tempat-tempat kediaman; dalam konteks binatang, 'sarang-sarang' terdengar alami dan mempertahankan bentuk jamaknya. Sufiks feminin tunggal merujuk kembali kepada חַיָּה sebagai nomina generik.
- source_word: תִשְׁכֹּן
  choice: tinggal
  rationale: שכן berarti tinggal atau menetap. 'Tinggal' jelas dan alami serta tidak menentukan apakah keberadaan di sana hanya sementara atau merupakan kediaman tetap.
