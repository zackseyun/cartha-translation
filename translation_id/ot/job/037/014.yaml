  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: id
  text: Dengarkanlah ini, Ayub; berdirilah[a] dan renungkanlah keajaiban-keajaiban[b] Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetaplah berdiri” atau “ambil sikapmu”.
    reason: lexical_alternative
  - marker: b
    text: Atau “perbuatan-perbuatan ajaib”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Dengarkanlah
  rationale: Bentuk imperatif ini menyerukan agar Ayub mendengarkan dengan sungguh-sungguh. “Dengarkanlah” alami dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: זֹּאת
  choice: ini
  rationale: Kata tunjuk feminin tunggal ini menunjuk pada hal yang harus didengarkan, baik perkataan yang baru disampaikan maupun yang segera menyusul; “ini” mempertahankan keluasan rujukan tersebut.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Mengikuti bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: עֲמֹד
  choice: berdirilah
  rationale: Imperatif dari עמד secara langsung berarti “berdiri”. Terjemahan ini tidak menambahkan gagasan “diam” atau “berhenti” yang hanya tersirat dari konteks.
- source_word: וְהִתְבּוֹנֵן
  choice: dan renungkanlah
  rationale: Bentuk imperatif ini menyatakan pengamatan dan pertimbangan yang penuh perhatian. “Renungkanlah” menyampaikan tindakan memikirkan secara mendalam dengan bahasa yang wajar dan bermartabat.
- source_word: נִפְלְאוֹת
  choice: keajaiban-keajaiban
  rationale: Nomina jamak dari פלא dapat menunjuk pada hal-hal menakjubkan maupun perbuatan-perbuatan ajaib. Bentuk ulang mempertahankan makna jamaknya.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini adalah sebutan bagi Tuhan. “Allah” merupakan padanan baku dan umum dalam Alkitab bahasa Indonesia tanpa menambahkan unsur “Mahakuasa” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל
  choice: Allah
  alternative: Allah Yang Mahakuasa
  rationale: Konteks menyebut keajaiban-keajaiban ilahi, tetapi bentuk אֵל sendiri tidak mengharuskan penambahan “Yang Mahakuasa”. “Allah” mempertahankan makna langsung tanpa mempersempitnya secara teologis.
- issue: Apakah נִפְלְאוֹת menunjuk pada hal ajaib atau perbuatan ajaib
  choice: keajaiban-keajaiban
  alternative: perbuatan-perbuatan ajaib
  rationale: Nomina ini dapat mencakup karya atau perbuatan Allah sekaligus hal-hal menakjubkan yang dihasilkan-Nya. Teks utama mempertahankan ungkapan yang lebih luas, sedangkan kemungkinan makna tindakan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel “-lah” mempertahankan bentuk imperatif yang tegas tetapi tidak kasar. Susunan dua perintah dibuat ringkas agar kesejajaran Ibraninya tetap terasa.
