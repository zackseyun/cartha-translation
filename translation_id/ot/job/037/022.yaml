  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: id
  text: Dari utara datang kemegahan keemasan; pada Allah ada keagungan yang menggentarkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצָּפוֹן
  choice: Dari utara
  rationale: Menerjemahkan preposisi מִן dan צָפוֹן secara langsung serta mempertahankan arah geografis sumber.
- source_word: זָהָב
  choice: kemegahan keemasan
  rationale: Secara harfiah berarti 'emas', tetapi dalam susunan puitis ini kemungkinan menggambarkan kilau atau kemegahan seperti emas. Ungkapan ini mempertahankan citra emas tanpa menghasilkan kalimat Indonesia yang terlalu janggal.
- source_word: יֶאֱתֶה
  choice: datang
  rationale: Bentuk verba ini berarti 'datang' atau 'tiba'; pilihan sederhana ini menjaga gerak dalam baris puisi.
- source_word: עַל
  choice: di sekeliling
  rationale: Preposisi ini lazim berarti 'atas/pada', tetapi dalam konteks kemegahan yang menyertai Allah dapat menyatakan sesuatu yang ada pada atau mengelilingi-Nya. 'Di sekeliling' menghasilkan ungkapan Indonesia yang alami sambil mengikuti pembacaan kontekstual teks konsultasi.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Padanan Indonesia baku bagi sebutan ilahi tunggal ini.
- source_word: נוֹרָא הוֹד
  choice: keagungan yang menggentarkan
  rationale: נוֹרָא menyatakan sesuatu yang membangkitkan rasa gentar atau takjub, sedangkan הוֹד berarti kemegahan/keagungan. Pilihan ini mempertahankan daya emosional frasa tanpa membatasinya pada makna 'menakutkan' saja.
theological_decisions:
- issue: Hubungan keagungan dengan Allah dalam frasa עַל אֱלוֹהַּ
  choice: di sekeliling Allah ada keagungan
  alternative: di atas Allah ada keagungan / pada Allah ada keagungan
  rationale: Kata עַל mempunyai rentang arti yang luas. Terjemahan 'di sekeliling' cocok dengan gambaran kemegahan yang menyertai hadirat Allah, tetapi tidak dimaksudkan untuk menetapkan doktrin khusus tentang lokasi atau hakikat kemuliaan ilahi.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme dua klausa dipertahankan; citra emas dan nuansa gentar-takjub tetap tampak tanpa memakai istilah teknis.
