  register: Bahasa Indonesia baku, modern, dan puitis. Susunan paralel kedua klausa dipertahankan; kata kerja “datanglah” diulang agar hubungan sintaksisnya jelas dan alami. Semua ketidakpastian leksikal utama dipertahankan melalui catatan kaki.
