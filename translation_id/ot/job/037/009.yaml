  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: id
  text: Dari ruang itu datanglah badai[a], dan dari angin-angin yang menyebar datanglah hawa dingin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dari selatan datanglah badai.” Teks Ibrani secara harfiah berbunyi “dari ruang itu”; ungkapan puitis ini mungkin menunjuk pada kawasan selatan atau tempat penyimpanan yang tersembunyi.
    reason: alternative_reading
  - marker: b
    text: Atau “dan dari utara datanglah hawa dingin” atau “dan dari angin-angin yang memencar, hawa dingin.” Istilah Ibraninya langka dan makna tepatnya tidak pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: Dari ruangnya
  rationale: חֶדֶר secara harfiah berarti “ruang” atau “kamar bagian dalam”. Dalam puisi tentang cuaca ini, kata tersebut mungkin menggambarkan tempat tersembunyi atau kawasan asal badai. “Ruangnya” mempertahankan citra Ibrani tanpa langsung menafsirkannya sebagai arah mata angin.
- source_word: תָּבוֹא
  choice: datanglah
  rationale: בוא lazim berarti “datang” atau “tiba”. Bentuk “datanglah” memberi gerak yang hidup dan alami dalam baris puisi Indonesia.
- source_word: סוּפָה
  choice: badai
  rationale: סוּפָה menunjuk pada badai dahsyat, prahara, atau angin pusar. “Badai” alami dan cukup luas sehingga tidak mempersempit maknanya menjadi angin pusar.
- source_word: וּמִמְּזָרִים
  choice: dan dari angin-angin yang menyebar
  rationale: מְזָרִים adalah istilah langka yang maknanya diperdebatkan. Terjemahan ini mengikuti kemungkinan kaitannya dengan tindakan menyebar atau memencar, sambil mempertahankan ketidakpastiannya dalam catatan kaki.
- source_word: קָרָה
  choice: hawa dingin
  rationale: קָרָה dapat berarti dingin, cuaca dingin, atau embun beku. “Hawa dingin” terdengar alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi embun beku.
