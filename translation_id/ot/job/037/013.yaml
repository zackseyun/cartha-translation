base_translation:
  language: en
  yaml_path: translation/ot/job/037/013.yaml
  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: id
  text: Entah untuk mendisiplinkan[a], entah untuk tanah-Nya, entah demi kasih setia[b], Ia mendatangkannya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai tongkat”, yaitu untuk menghukum atau mendisiplinkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk belas kasihan” atau “untuk kebaikan”.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “Ia membuatnya terjadi” atau “Ia membuatnya datang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: entah
  rationale: Pengulangan אִם menyusun tiga kemungkinan tujuan atau hasil, bukan anak kalimat bersyarat biasa. “Entah” mempertahankan susunan alternatif itu secara alami dalam bahasa Indonesia.
- source_word: לְשֵׁבֶט
  choice: untuk menghukum
  rationale: שֵׁבֶט secara harfiah berarti “tongkat”, tetapi di sini merupakan metonimia bagi hukuman atau tindakan disiplin Allah melalui gejala cuaca. “Untuk menghukum” menyampaikan fungsi ungkapan itu tanpa memasukkan benda harfiah ke dalam teks utama.
- source_word: לְאַרְצוֹ
  choice: demi tanah-Nya
  rationale: אֶרֶץ dapat berarti “tanah” atau “bumi”; akhiran orang ketiga tunggal maskulin menyatakan kepunyaan. “Tanah-Nya” mempertahankan akhiran tersebut, sedangkan “demi” menyatakan tujuan yang menguntungkan tanah itu.
- source_word: לְחֶסֶד
  choice: untuk menunjukkan kasih setia
  rationale: חֶסֶד mencakup kasih, kemurahan, dan kesetiaan yang teguh. Tambahan verba “menunjukkan” membuat hubungan tujuan yang tersirat oleh לְ dapat dipahami secara alami tanpa mempersempit חֶסֶד hanya menjadi belas kasihan.
- source_word: יַמְצִאֵהוּ
  choice: Ia mendatangkannya
  rationale: Bentuk kausatif dari מצא beserta sufiks objek menunjuk pada Allah yang membuat gejala cuaca dalam konteks sebelumnya tiba atau terjadi. “Mendatangkannya” mempertahankan tindakan kausatif serta objek pronominal dengan idiom Indonesia yang wajar.
theological_decisions:
- issue: Tujuan ilahi dalam tiga klausa אִם
  choice: 'Ayat ini menyebut tiga kemungkinan tujuan gejala cuaca yang Allah datangkan: hukuman, pemeliharaan tanah-Nya, atau pernyataan kasih setia.'
  alternative: Klausa-klausa itu dapat dipahami sebagai tujuan kedatangan gejala tersebut, dan שֵׁבֶט dapat dipersempit menjadi hukuman penghukuman semata.
  rationale: Konteks langsung membahas pengarahan awan oleh Allah. Terjemahan mempertahankan rentang antara penghakiman dan kemurahan serta tidak membatasi tindakan Allah hanya pada salah satu sisi.
- issue: Nuansa חֶסֶד
  choice: kasih setia
  alternative: belas kasihan atau kebaikan
  rationale: “Kasih setia” menjaga bobot relasional dan keteguhan yang lazim terkandung dalam חֶסֶד, tanpa mengharuskan konteks ini dipahami sebagai rujukan eksplisit kepada suatu perjanjian tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “entah” mempertahankan pola tiga bagian dalam bahasa Ibrani; “Ia” merujuk kepada Allah. Semua penanda catatan kaki ditempatkan langsung pada unsur teks yang dijelaskan.
