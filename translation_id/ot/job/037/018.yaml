base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: id
  text: Dapatkah engkau, bersama-Nya, membentangkan[a] langit[b] yang keras seperti cermin dari logam tuangan[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menempa langit hingga tipis” atau “merentangkan langit.” Kata kerja Ibrani ini dapat menggambarkan penempaan logam hingga tipis maupun tindakan menghamparkan sesuatu.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang puitis ini dapat berarti “langit” dan, dalam konteks tertentu, “awan-awan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “seperti cermin tuangan.” Cermin pada zaman itu dibuat dari logam yang dipoles; gambaran ini melukiskan langit sebagai sesuatu yang keras dan berkilau seperti hasil karya logam.
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: membentangkan
  rationale: Bentuk kausatif dari רקע dapat menggambarkan tindakan menghamparkan atau menempa sesuatu hingga tipis. “Membentangkan” alami dalam bahasa Indonesia, sementara nuansa pengerjaan logam dijelaskan dalam catatan kaki dan diperkuat oleh perumpamaan pada akhir ayat.
- source_word: עִמּוֹ
  choice: bersama-Nya
  rationale: Teks Ibrani memakai pronomina “bersama dia-Nya,” bukan menyebut Allah secara langsung. Terjemahan mempertahankan pronomina tersebut; kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah dalam konteks ini.
- source_word: לִשְׁחָקִים
  choice: langit
  rationale: שׁחקים adalah istilah puitis bagi langit dan dalam konteks tertentu dapat menunjuk kepada awan. “Langit” paling sesuai dengan gambaran bentangan yang keras dan berkilau seperti cermin.
- source_word: חֲזָקִים
  choice: keras
  rationale: Dalam perumpamaan dengan cermin logam tuangan, “keras” menyampaikan sifat padat dan kukuh yang dimaksud dengan lebih langsung daripada “kuat.”
- source_word: כִּרְאִי
  choice: seperti cermin
  rationale: ראי berarti cermin, dan prefiks כ menyatakan perbandingan.
- source_word: מוּצָק
  choice: logam tuangan
  rationale: Partisip pasif ini menunjuk pada sesuatu yang dicurahkan atau dituang, khususnya dalam pengerjaan logam. “Logam tuangan” mempertahankan citra metalurgis tanpa mempersempit bahannya menjadi perunggu.
theological_decisions:
- issue: Rujukan pronomina עִמּוֹ
  choice: Mempertahankan pronomina dalam bentuk “bersama-Nya”
  alternative: “bersama Allah”
  rationale: Konteks menunjukkan bahwa rujukannya ialah Allah, tetapi teks Ibrani sendiri menggunakan pronomina. Karena itu, nama “Allah” tidak disisipkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kata “engkau” mempertahankan sapaan tunggal dalam wacana puitis, sedangkan susunan pertanyaan tetap jelas bagi pembaca umum.
