  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: id
  text: Yang Mahakuasa—kita tidak dapat menyelami-Nya[a]—besar kuasa-Nya; dalam keadilan[b] dan kebenaran yang berlimpah, Ia tidak menindas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kita tidak dapat memahami-Nya” atau “kita tidak dapat menjangkau-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “penghakiman.”
    reason: lexical_alternative
  - marker: c
    text: Verba Ibrani ini lazim berarti “menindas” atau “menyengsarakan.” Klausa ini juga dapat dipahami sebagai “keadilan dan kebenaran yang berlimpah tidak dilanggar-Nya”; sebagian menafsirkannya sebagai “Ia tidak menjawab,” tetapi makna itu kurang sesuai dengan konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi dengan padanan baku bahasa Indonesia, alih-alih mentransliterasikannya sebagai “Shaddai”.
- source_word: לֹא מְצָאנֻהוּ
  choice: kita tidak dapat menyelami-Nya
  rationale: Secara harfiah berarti “kita tidak menemukan-Nya,” tetapi dalam konteks kemahatinggian Allah ungkapan ini menyatakan ketidakmampuan manusia menjangkau atau memahami-Nya sepenuhnya.
- source_word: שַׂגִּיא כֹחַ
  choice: besar kuasa-Nya
  rationale: Mengungkapkan kebesaran atau kelimpahan kuasa dengan susunan yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: וּמִשְׁפָּט
  choice: keadilan
  rationale: Di sini מִשְׁפָּט paling wajar menunjuk pada sifat adil, karena disejajarkan dengan kebenaran, meskipun “penghakiman” tetap mungkin.
- source_word: וְרֹב צְדָקָה
  choice: kebenaran yang berlimpah
  rationale: Mempertahankan gagasan kelimpahan pada רֹב dan nilai moral צְדָקָה tanpa mempersempitnya menjadi istilah denominasi tertentu.
- source_word: לֹא יְעַנֶּה
  choice: tidak dilanggar-Nya
  rationale: Bentuk Piel dari ענה lazim berarti menindas atau menyengsarakan. Dengan “keadilan dan kebenaran” sebagai objek, “tidak dilanggar-Nya” menyampaikan maksud bahwa Allah tidak memperlakukan atau merusak keduanya secara menindas, sekaligus menghasilkan bahasa Indonesia yang alami.
theological_decisions:
- issue: Hubungan klausa terakhir לֹא יְעַנֶּה dengan keadilan dan kebenaran Allah
  choice: Klausa itu menyatakan bahwa Allah tidak melanggar keadilan dan kebenaran.
  alternative: “Ia tidak menindas/menyengsarakan,” atau, berdasarkan analisis leksikal lain, “Ia tidak menjawab.”
  rationale: Aksen dan susunan Ibrani menempatkan “keadilan dan kebenaran yang berlimpah” sebelum verba terakhir, sehingga keduanya dapat dipahami sebagai objek. Terjemahan ini mempertahankan penegasan tentang kelurusan moral Allah, sementara catatan kaki menjaga kemungkinan pembacaan lain.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Tanda pisah mempertahankan sisipan retoris dalam Ibrani, sedangkan urutan klausa mengikuti struktur Masoretik tanpa menghilangkan ketegangan antara ketakterjangkauan Allah dan keadilan-Nya.
