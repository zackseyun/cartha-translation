id: JOB.37.15
reference: Job 37:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: id
  text: Tahukah engkau bagaimana Allah menempatkan hal-hal itu atas mereka[a] dan membuat cahaya awan-Nya memancar[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika Allah menempatkannya atas mereka” atau “bagaimana Allah menetapkannya.” Ungkapan Ibraninya padat; objek tindakan Allah dan acuan “mereka” dibiarkan tersirat oleh konteks.
    reason: alternative_reading
  - marker: b
    text: Atau, “membuat terang awan-Nya berkilat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Tahukah engkau
  rationale: Bentuk tanya dengan ידע Qal imperfek orang kedua tunggal maskulin mengajukan pertanyaan retoris kepada Ayub. Ungkapan ini langsung, wajar, dan mempertahankan sapaan tunggal.
- source_word: בְּשׂוּם
  choice: bagaimana ... menempatkan
  rationale: Preposisi ב dengan infinitif konstruk שום dapat menyatakan keadaan atau cara. Sesudah 'Tahukah engkau', 'bagaimana ... menempatkan' merupakan ungkapan Indonesia yang alami tanpa memastikan apakah maksudnya cara atau waktu.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: אֱלוֹהַּ adalah bentuk tunggal puitis yang lazim untuk Allah dalam kitab Ayub; tidak ada dasar untuk memperluasnya menjadi gelar lain.
- source_word: עֲלֵיהֶם
  choice: atas mereka
  rationale: על dengan sufiks orang ketiga jamak maskulin berarti 'atas/pada mereka'. Acuannya tersirat dalam konteks, sehingga terjemahan tidak menggantinya dengan 'awan-awan' atau gejala cuaca tertentu.
- source_word: וְהוֹפִיעַ
  choice: dan membuat ... memancar
  rationale: Bentuk Hifil dari יפע menyatakan tindakan menyebabkan terang tampil atau bersinar. 'Membuat ... memancar' menyampaikan makna kausatif serta cocok dengan gambaran cahaya yang keluar dari awan.
- source_word: אוֹר
  choice: cahaya
  rationale: אוֹר berarti cahaya atau terang. 'Cahaya' alami dalam hubungan konstruksi dengan 'awan-Nya'.
- source_word: עֲנָנוֹ
  choice: awan-Nya
  rationale: Nomina tunggal dengan sufiks orang ketiga tunggal diterjemahkan secara harfiah sebagai 'awan-Nya', tanpa menambahkan unsur 'badai' atau mengubahnya menjadi jamak.
theological_decisions:
- issue: Objek tersirat dari tindakan Allah dan acuan kata ganti jamak
  choice: Mempertahankan ketidakjelasan dengan 'menempatkan hal-hal itu atas mereka'.
  alternative: Menetapkan perintah-Nya atas awan-awan; menempatkan awan-awan di atas bumi; membebani awan-awan dengan kilat.
  rationale: Teks Ibrani tidak menyebutkan objek eksplisit sesudah שום, sedangkan sufiks jamak pada עֲלֵיהֶם bergantung pada konteks. Menyebut perintah, awan, bumi, atau muatan kilat akan menetapkan tafsiran meteorologis yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. Sapaan 'engkau' sesuai dengan ujaran langsung kepada Ayub dan menjaga bentuk tunggal. Ungkapan sengaja tetap agak terbuka karena konstruksi Ibraninya padat dan ambigu.
