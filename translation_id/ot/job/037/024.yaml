  text: לָ֭/כֵן יְרֵא֣וּ/הוּ אֲנָשִׁ֑ים לֹֽא יִ֝רְאֶ֗ה כָּל חַכְמֵי לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: id
  text: Karena itu, manusia takut kepada-Nya; Ia tidak mengindahkan seorang pun yang berhikmat dalam hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Ia tidak melihat semua orang yang berhikmat dalam hati.” Kata kerja Ibrani dapat berarti “melihat” atau “mengindahkan”; ungkapan ini mungkin menekankan bahwa Allah tidak mengindahkan hikmat manusia di hadapan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari uraian sebelumnya tentang kebesaran Allah dan terdengar alami dalam bahasa Indonesia.
- source_word: יְרֵאוּהוּ
  choice: takut kepada-Nya
  rationale: Kata kerja ירא dapat mencakup rasa takut, hormat, dan gentar. Pilihan ini paling langsung serta mempertahankan bobot tanggapan manusia terhadap keagungan ilahi.
- source_word: אֲנָשִׁים
  choice: manusia
  rationale: Bentuk jamak ini merujuk secara umum kepada umat manusia; bentuk kolektif tunggal dalam bahasa Indonesia menyampaikan makna generiknya dengan wajar.
- source_word: לֹא יִרְאֶה
  choice: Ia tidak mengindahkan
  rationale: ראה secara harfiah berarti 'melihat', tetapi dalam konteks ini dapat menyatakan memberi perhatian atau penghargaan. 'Tidak mengindahkan' menyampaikan makna relasional itu tanpa menambahkan penjelasan teologis yang tidak tersurat.
- source_word: כָּל
  choice: seorang pun
  rationale: Dalam cakupan penyangkalan, כָּל dengan kelompok orang secara idiomatis dinyatakan sebagai 'seorang pun', sehingga daya distributifnya tetap terpelihara.
- source_word: חַכְמֵי לֵב
  choice: yang berhikmat dalam hati
  rationale: Mempertahankan ungkapan Ibrani tentang hikmat batin tanpa menambahkan gagasan 'menurut anggapannya sendiri', yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna Allah tidak melihat atau tidak mengindahkan orang yang berhikmat dalam hati
  choice: Ia tidak mengindahkan seorang pun yang berhikmat dalam hati
  alternative: Ia tidak melihat semua orang yang berhikmat dalam hati
  rationale: Subjek tersirat paling wajar merujuk kepada Allah, dan ראה dapat bermakna 'melihat' maupun, secara kontekstual, 'mengindahkan'. Teks utama memakai ungkapan Indonesia yang idiomatis, sedangkan catatan mempertahankan kemungkinan bentuk yang lebih harfiah. Terjemahan tidak menambahkan bahwa hikmat itu semata-mata hikmat menurut pandangan mereka sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Struktur dua klausa dan ketegangan antara hikmat manusia dan keagungan Allah dipertahankan.
