  text: יַרְעֵ֤ם אֵ֣ל בְּ֭/קוֹל/וֹ נִפְלָא֑וֹת עֹשֶׂ֥ה גְ֝דֹל֗וֹת וְ/לֹ֣א נֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: id
  text: Allah mengguntur secara menakjubkan[a] dengan suara-Nya; Ia melakukan hal-hal besar yang tidak kita ketahui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah, “Allah mengguntur dengan suara-Nya—keajaiban-keajaiban.” Kata Ibrani yang berarti “keajaiban-keajaiban” mungkin berfungsi sebagai keterangan cara: “secara menakjubkan.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “hal-hal besar yang berada di luar pengetahuan kita” atau “hal-hal besar yang tidak dapat kita pahami.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: mengguntur
  rationale: Bentuk Hifil dari רעם menyatakan tindakan menghasilkan guruh atau mengguntur. Dalam gambaran badai pada konteks ini, “mengguntur” ringkas, alami, dan mempertahankan hubungan langsung antara Allah dan bunyi guruh.
- source_word: אֵל
  choice: Allah
  rationale: Gelar ilahi אֵל di sini menunjuk kepada Allah tanpa menuntut perluasan seperti “Yang Mahakuasa”.
- source_word: בְּקוֹלוֹ
  choice: dengan suara-Nya
  rationale: Preposisi ב dapat dipahami secara instrumental; ungkapan ini mempertahankan suara Allah sebagai sarana atau penyerta guruh.
- source_word: נִפְלָאוֹת
  choice: secara menakjubkan
  rationale: Walaupun bentuknya secara formal adalah nomina jamak, “keajaiban-keajaiban,” dalam klausa ini kemungkinan besar berfungsi adverbial untuk menerangkan cara Allah mengguntur. “Secara menakjubkan” alami dalam bahasa Indonesia sambil tetap menyampaikan unsur keajaiban.
- source_word: עֹשֶׂה
  choice: melakukan
  rationale: עשה memiliki arti luas “melakukan/membuat”; bersama גְדֹלוֹת, “melakukan” merupakan padanan yang alami.
- source_word: גְדֹלוֹת
  choice: hal-hal besar
  rationale: Adjektiva feminin jamak ini dipakai secara substantival. “Hal-hal besar” mempertahankan cakupan umum teks tanpa membatasinya menjadi jenis perbuatan tertentu.
- source_word: וְלֹא נֵדָע
  choice: yang tidak kita ketahui
  rationale: Teks Ibrani secara harfiah berbunyi “dan tidak kita ketahui.” Menjadikannya klausa relatif menghasilkan bahasa Indonesia yang alami dan tidak memperkuat ידע menjadi “tidak dapat kita pahami.”
theological_decisions:
- issue: Cakupan ketidaktahuan manusia dalam klausa terakhir
  choice: Karya-karya besar Allah dinyatakan tidak kita ketahui.
  alternative: Karya-karya itu berada di luar pengetahuan kita atau tidak dapat kita pahami.
  rationale: ידע berarti “mengetahui.” Terjemahan utama tidak memperluas pernyataan ini menjadi klaim yang lebih kuat tentang ketidakmampuan mutlak manusia untuk memahami, sehingga ketegangan teologis dalam teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina “-Nya” dan “Ia” mengikuti konvensi penghormatan kepada Allah. Struktur dua klausa dan ambiguitas utama pada נִפְלָאוֹת serta וְלֹא נֵדָע dipertahankan melalui catatan kaki.
