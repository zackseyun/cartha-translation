  text: At this also my heart trembles and leaps from its place[a][b].
translation:
  language: id
  text: Karena hal ini pun hatiku gemetar dan melonjak dari tempatnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berguncang” untuk “gemetar”; kata kerja Ibrani ini dapat menunjuk pada getaran karena takut, gentar, kagum, atau kegelisahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “melompat keluar dari tempatnya”; ungkapan Ibrani ini menggambarkan dengan hidup seolah-olah hati tiba-tiba bergeser dari tempatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: Bahkan karena hal ini
  rationale: Gabungan אַף dan לְזֹאת menghubungkan reaksi Elihu dengan gejala yang baru dibicarakan serta memberi penegasan. 'Karena hal ini' menyatakan pemicu reaksi secara alami, sedangkan 'bahkan' mempertahankan daya intensif אַף.
- source_word: יֶחֱרַד
  choice: gemetar
  rationale: Kata חרד dapat menggambarkan getaran akibat takut, gentar, kagum, atau kegelisahan. 'Gemetar' mempertahankan keluasan itu tanpa mempersempitnya menjadi ketakutan semata.
- source_word: לִבִּי
  choice: hatiku
  rationale: '''Hati'' mempertahankan gambaran antropologis Ibrani mengenai batin dan juga menjadi acuan bagi akhiran orang ketiga pada ''tempatnya''.'
- source_word: וְיִתַּר
  choice: dan melonjak
  rationale: Dalam konteks ini, bentuk dari יתר sulit dan tampaknya melukiskan gerakan hati yang mendadak serta kuat. 'Melonjak' mempertahankan metafora jasmaniah yang hidup tanpa meratakannya menjadi sekadar 'tergerak'.
- source_word: מִמְּקוֹמוֹ
  choice: dari tempatnya
  rationale: Ungkapan ini secara harfiah menggambarkan hati bergeser dari tempatnya sendiri; terjemahan ini mempertahankan citra tersebut dan rujukan pronominalnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan kalimat dibuat alami, sementara citra konkret tentang hati yang gemetar dan melonjak tetap dipertahankan. Semua penanda catatan kaki ditempatkan dalam teks utama.
