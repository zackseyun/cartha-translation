  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: id
  text: Dengarkanlah baik-baik[a] dalam kegentaran suara-Nya,[b] dan gemuruh[c] yang keluar dari mulut-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dengarkanlah, dengarkanlah”; bentuk Ibrani ini menegaskan perintah.
    reason: translation_clarity
  - marker: b
    text: Atau “dalam gejolak”, “dalam kegelisahan”, atau “dalam amarah suara-Nya”. Kata Ibrani ini dapat mengandung gagasan tentang kegentaran, kegelisahan, atau amarah.
    reason: lexical_alternative
  - marker: c
    text: Atau “gumam” atau “bunyi rendah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Dengarkanlah baik-baik
  rationale: Gabungan imperatif dengan infinitif absolut menegaskan perintah. Ungkapan ini menyampaikan penekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: בְּרֹגֶז
  choice: getaran
  rationale: רֹגֶז dapat menunjuk pada getaran, kegentaran, gejolak, atau keganasan. Dalam gambaran badai, “getaran” menyampaikan daya suara yang mengguncang tanpa secara pasti menafsirkannya sebagai murka.
- source_word: קֹלוֹ
  choice: suara-Nya
  rationale: קוֹל dapat berarti “suara” atau “bunyi”. Penyebutan mulut-Nya pada baris berikut mendukung “suara-Nya” dan mempertahankan personifikasi puitis.
- source_word: וְהֶגֶה
  choice: gemuruh
  rationale: הֶגֶה menunjuk pada bunyi rendah seperti gumam, dengung, atau erangan. Dalam konteks badai, “gemuruh” paling alami menggambarkan bunyi guntur.
- source_word: מִפִּיו יֵצֵא
  choice: yang keluar dari mulut-Nya
  rationale: Terjemahan ini mempertahankan gambaran konkret sumber Ibrani dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah dalam gambaran badai
  choice: Mempertahankan “suara-Nya” dan “mulut-Nya”
  alternative: Menggantikannya dengan ungkapan tak berpribadi seperti “bunyi guntur”
  rationale: Teks Ibrani menggambarkan badai secara puitis sebagai ucapan Allah sendiri. Mempertahankan bahasa antropomorfis menjaga daya sastra dan teologis teks tanpa menjelaskan metaforanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Akhiran penghormatan “-Nya” dipakai karena konteks mengacu kepada Allah. Susunan kalimat mempertahankan kesejajaran antara suara-Nya dan bunyi yang keluar dari mulut-Nya.
