base_translation:
  language: en
  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: id
  text: Dari napas Allah terbentuklah es[a], dan hamparan luas air membeku menjadi padat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Oleh napas Allah terbentuklah es.” Kata depan Ibrani dapat menyatakan sumber (“dari”) atau sarana (“oleh”).'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “keluasan air menjadi keras.” Ungkapan Ibrani ini puitis dan mungkin menggambarkan permukaan air yang luas menjadi padat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: Dari napas
  rationale: נִשְׁמָה berarti napas, sedangkan prefiks מִן dapat menandai sumber atau sarana. 'Dari napas' mempertahankan gambaran konkret dan menyatakan sumber tanpa menutup kemungkinan makna instrumental.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini merupakan sebutan umum bagi Allah; konteks tidak menuntut perluasan seperti 'Allah Yang Mahakuasa'.
- source_word: יִתֶּן קָרַח
  choice: terbentuklah es
  rationale: Secara harfiah נתן berarti 'memberikan', tetapi dalam susunan puitis ini maksudnya es muncul atau dihasilkan oleh napas Allah. 'Terbentuklah es' alami dalam bahasa Indonesia dan tetap menampilkan tindakan ilahi.
- source_word: וְרֹחַב מַיִם
  choice: dan hamparan luas air
  rationale: רֹחַב menunjuk pada keluasan atau bentangan. Dalam konteks air, 'hamparan luas air' menyampaikan gambaran permukaan air yang membentang dengan wajar.
- source_word: בְּמוּצָק
  choice: membeku menjadi padat
  rationale: מוּצָק menggambarkan keadaan yang diteguhkan, dikeraskan, atau menjadi padat. Dalam konteks cuaca dan es, frasa ini secara kontekstual berarti air membeku hingga padat.
theological_decisions:
- issue: מִן sebagai sumber atau sarana tindakan Allah
  choice: Dari napas Allah
  alternative: Oleh napas Allah
  rationale: Bahasa Ibrani memungkinkan arti 'dari' maupun 'oleh'. Teks utama memakai arti sumber, sementara alternatif instrumental dipertahankan dalam catatan agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Inversi ringan 'terbentuklah es' mempertahankan corak puisi tanpa terdengar usang; 'membeku menjadi padat' memperjelas citra meteorologis dari ungkapan Ibrani.
