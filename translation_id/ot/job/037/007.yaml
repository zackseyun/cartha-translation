base_translation:
  language: en
  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: id
  text: Ia memeteraikan tangan setiap orang[a], supaya semua manusia mengetahui karya-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menyegel tangan setiap orang.” Ungkapan Ibrani ini kemungkinan berarti bahwa Allah menghentikan kegiatan kerja manusia yang biasa dilakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: tangan
  rationale: Dengan verba חתם, frasa ini paling wajar diterjemahkan sebagai objek langsung dalam bahasa Indonesia. Ungkapan ini tetap mempertahankan metafora Ibrani yang sukar.
- source_word: כָּל אָדָם
  choice: setiap orang
  rationale: אָדָם adalah bentuk tunggal generik yang mengacu kepada setiap manusia; 'setiap orang' alami dan inklusif dalam bahasa Indonesia.
- source_word: יַחְתּוֹם
  choice: Ia memeteraikan
  rationale: Qal חתם berarti 'memeteraikan' atau 'membubuhkan meterai'. Pilihan ini ringkas dan mempertahankan metafora sumber tanpa menjelaskan maknanya secara berlebihan.
- source_word: לָדַעַת
  choice: supaya ... mengetahui
  rationale: Infinitif dengan ל dapat menyatakan tujuan atau hasil; 'supaya' mempertahankan hubungan tersebut secara alami.
- source_word: כָּל אַנְשֵׁי
  choice: semua manusia
  rationale: Frasa ini secara harfiah berbentuk maskulin jamak, tetapi bersifat generik bagi umat manusia. 'Semua manusia' juga mempertahankan kesejajaran dengan 'setiap orang'.
- source_word: מַעֲשֵׂהוּ
  choice: pekerjaan-Nya
  rationale: Nomina tunggal dengan sufiks orang ketiga maskulin tunggal berarti 'pekerjaan-Nya'. Dalam konteks, ini menunjuk kepada karya atau tindakan Allah.
theological_decisions:
- issue: Acuan subjek 'Ia' dan sufiks posesif dalam מַעֲשֵׂהוּ
  choice: Keduanya mengacu kepada Allah.
  alternative: Subjek tak berpribadi, atau musim dingin/badai sebagai pelaku.
  rationale: Dalam pembicaraan Elihu mengenai kuasa Allah atas cuaca dan ciptaan, Allah merupakan anteseden yang paling kuat. Namun teks utama tidak menambahkan nama 'Allah', sehingga bentuk pronominal sumber tetap dipertahankan.
- issue: Makna metafora memeteraikan tangan
  choice: Metafora dipertahankan dalam teks utama.
  alternative: Dijelaskan langsung sebagai 'menghentikan pekerjaan manusia'.
  rationale: Ungkapan Ibrani kemungkinan menggambarkan Allah menghentikan kegiatan kerja manusia, tetapi rincian maknanya tidak sepenuhnya pasti. Karena itu, penjelasan ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Memeteraikan' dipilih untuk menjaga metafora sumber; kapitalisasi 'Ia' dan '-Nya' menandai acuan kepada Allah menurut kebiasaan penulisan Alkitab bahasa Indonesia. Penanda catatan kaki [a] dicantumkan tepat setelah ungkapan yang dijelaskan.
