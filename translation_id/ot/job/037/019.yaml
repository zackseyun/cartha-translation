  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: id
  text: Beritahukanlah kepada kami apa yang harus kami katakan kepada-Nya; kami tidak dapat menyusun perkataan kami[a] karena kegelapan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami tidak dapat menata perkataan kami” atau “kami tidak dapat mengemukakan perkara kami.”
    reason: lexical_alternative
  - marker: b
    text: “Kegelapan” mungkin secara kiasan menunjuk pada ketidaktahuan atau ketidakmampuan manusia, tetapi makna yang lebih harfiah juga mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: Beritahukanlah kepada kami
  rationale: Bentuk imperatif Hifil dari ידע berarti ‘buatlah kami mengetahui’ atau ‘beritahukanlah’. Pilihan ini mempertahankan makna kausatif dan terdengar wajar dalam bahasa Indonesia.
- source_word: מַה נֹּאמַר לוֹ
  choice: apa yang harus kami katakan kepada-Nya
  rationale: Ungkapan ini menyatakan pertanyaan deliberatif tentang apa yang patut dikatakan kepada Allah; ‘harus kami katakan’ menyampaikannya secara alami.
- source_word: לֹא נַעֲרֹךְ
  choice: kami tidak dapat menyusun perkataan kami
  rationale: Kata ערך berarti ‘menata’ atau ‘menyusun’. Objeknya tersirat; konteks pembicaraan mendukung pelengkapan ‘perkataan kami’, sambil tetap dekat dengan gambaran Ibrani dan tidak mempersempitnya menjadi perkara hukum.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: karena kegelapan
  rationale: מִפְּנֵי di sini paling wajar menyatakan sebab. ‘Kegelapan’ mempertahankan citra padat dalam bahasa Ibrani tanpa menentukan apakah maknanya harfiah atau kiasan.
theological_decisions:
- issue: Makna ‘kegelapan’ dalam klausa terakhir
  choice: Mempertahankan istilah luas ‘kegelapan’
  alternative: karena ketidaktahuan kami; karena hari gelap
  rationale: Puisi Ibrani tidak menjelaskan apakah kegelapan itu harfiah atau menunjuk pada keterbatasan dan ketidaktahuan manusia. Terjemahan tidak boleh meniadakan ambiguitas tersebut.
- issue: Rujukan pronomina לוֹ
  choice: kepada-Nya
  alternative: kepadanya
  rationale: Dalam konteks pidato Elihu, pronomina tersebut merujuk kepada Allah. Huruf kapital mengikuti konvensi bahasa Indonesia untuk pronomina ilahi tanpa menambahkan identitas yang tidak ada dalam klausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan puitis dipertahankan dengan dua klausa yang seimbang. Semua penanda catatan kaki muncul dalam teks utama.
