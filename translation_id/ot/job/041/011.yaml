  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: id
  text: Dari mulutnya keluar obor-obor; percikan api[a] melompat keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suluh-suluh” atau “anak-anak panah berapi”; kata Ibrani yang diterjemahkan “percikan api” jarang ditemukan dan maknanya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: Dari mulutnya
  rationale: Preposisi מִן dengan פֶּה dan sufiks orang ketiga tunggal menyatakan asal atau arah keluar. Bentuk “mulutnya” alami dalam bahasa Indonesia dan tidak perlu menandai gender gramatikal Ibrani.
- source_word: לַפִּידִים
  choice: obor-obor
  rationale: Kata ini lazim menunjuk pada obor atau benda yang menyala. “Obor-obor” mempertahankan gambaran konkret dan bentuk jamak sumber.
- source_word: יַהֲלֹכוּ
  choice: keluar
  rationale: Secara dasar berarti “berjalan/pergi,” tetapi bersama frasa “dari mulutnya” maknanya adalah bergerak keluar. “Keluar” menyampaikan arah itu secara wajar tanpa menghilangkan citra puitis.
- source_word: כִּידוֹדֵי אֵשׁ
  choice: percikan-percikan api
  rationale: כִּידוֹדֵי adalah kata langka dan maknanya diperdebatkan. Dalam paralelisme dengan obor dan gerak keluar dari mulut, “percikan-percikan api” memberi gambaran unsur api yang melesat tanpa menetapkan secara berlebihan bahwa itu senjata tertentu.
- source_word: יִתְמַלָּטוּ
  choice: berhamburan
  rationale: Akar מלט pada dasarnya berkaitan dengan meloloskan diri atau keluar. Dalam gambaran emisi api yang mendadak, “berhamburan” mengungkapkan gerakan cepat ke luar secara alami dan hidup.
