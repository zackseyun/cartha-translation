  naturalness: “Dari mulutnya keluar obor-obor” adalah susunan yang lebih lancar dalam bahasa Indonesia modern daripada menempatkan “keluar” setelah subjek. “Percikan api melompat keluar” juga hidup dan mudah dipahami. Bentuk tunggal kolektif “percikan api” wajar dalam bahasa Indonesia; tidak perlu pengulangan untuk setiap nomina jamak Ibrani.
