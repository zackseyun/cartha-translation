  text: His heart is hard like a stone[a], hard like the lower millstone.
translation:
  language: id
  text: Hatinya keras seperti batu,[a] keras seperti batu kilangan bawah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kukuh seperti batu”; kata Ibrani ini secara harfiah berkaitan dengan sesuatu yang dituang atau dicor, sehingga menjadi keras atau padat.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: hatinya
  rationale: לֵב menunjuk pada hati sebagai pusat batin, kehendak, dan watak; dalam gambaran puitis ini, “hatinya” mempertahankan citra konkret dan merupakan padanan Indonesia yang alami.
- source_word: יָצוּק
  choice: keras
  rationale: Bentuk dari יצק secara harfiah berkaitan dengan sesuatu yang dituang atau dicor; dalam perbandingan ini hasil yang ditekankan ialah keadaan yang padat, kukuh, dan keras.
- source_word: כְּמוֹ אָבֶן
  choice: seperti batu
  rationale: Padanan langsung yang mempertahankan perbandingan konkret dalam bahasa Indonesia yang wajar.
- source_word: וְיָצוּק
  choice: keras
  rationale: Pengulangan “keras” mempertahankan paralelisme dan penegasan pada teks Ibrani.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: seperti batu kilangan bagian bawah
  rationale: Dalam kolokasi ini, פֶלַח תַּחְתִּית paling wajar dipahami sebagai batu bagian bawah dari alat penggilingan, yang terkenal berat dan keras.
