  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: id
  text: Ketika ia bangkit, orang-orang perkasa[a] ketakutan; oleh hempasan, mereka menjadi kalang kabut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “makhluk-makhluk ilahi.”'
    reason: אֵלִים dapat menunjuk kepada sosok-sosok perkasa atau makhluk-makhluk ilahi.
  - marker: b
    text: Ungkapan Ibrani ini sulit. Secara harfiah, klausa ini menyebut “deburan-deburan” atau “hempasan-hempasan”; kata terakhir dapat menggambarkan gelombang yang pecah atau hantaman. Kata kerja berikutnya dapat menggambarkan orang yang kehilangan sasaran atau arah.
    reason: Menjelaskan ambiguitas מִשְּׁבָרִים dan bentuk tidak lazim יִתְחַטָּאוּ tanpa menambahkan kepemilikan pada hempasan atau memaksakan satu etimologi.
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: Ketika ia bangkit
  rationale: Bentuk ini menunjuk pada tindakan atau keadaan makhluk itu meninggikan diri atau bangkit; terjemahan ini alami dalam konteks kemunculannya yang menakutkan.
- source_word: אֵלִים
  choice: para perkasa
  rationale: Kata ini dapat berarti makhluk-makhluk ilahi atau sosok-sosok yang kuat. Dalam konteks reaksi ketakutan terhadap Lewiatan, 'para perkasa' mempertahankan cakupan makna tanpa memastikan bahwa yang dimaksud adalah para dewa.
- source_word: מִשְּׁבָרִים
  choice: karena hempasannya
  rationale: Bentuk jamak ini secara harfiah berkaitan dengan pecahan, hantaman, atau deburan. 'Hempasannya' menyampaikan daya benturan dan memungkinkan konteks gerakan air.
- source_word: יִתְחַטָּאוּ
  choice: mereka menjadi kalang kabut
  rationale: Dalam bentuk yang tidak lazim ini, kata tersebut menyiratkan kehilangan sasaran atau arah, sehingga menggambarkan kebingungan hebat, bukan tindakan penyucian yang disengaja.
theological_decisions:
- issue: Identitas אֵלִים
  choice: para perkasa
  alternative: para dewa / makhluk-makhluk ilahi
  rationale: Teks dapat dibaca sebagai sebutan bagi sosok kuat ataupun makhluk ilahi. Teks utama mengikuti arti kontekstual yang luas, sementara catatan mempertahankan kemungkinan lainnya.
- issue: Makna יִתְחַטָּאוּ
  choice: menjadi kalang kabut
  alternative: menyucikan diri
  rationale: Walaupun akar חטא dalam bentuk tertentu dapat berkaitan dengan pemurnian, konteks paralel dengan ketakutan dan pemakaian idiomatis di sini lebih mendukung keadaan kehilangan arah atau kebingungan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Frasa 'menjadi kalang kabut' dipilih sebagai idiom umum untuk kebingungan dan kepanikan yang hebat; susunan dua klausa mempertahankan paralelisme puisi Ibrani.
