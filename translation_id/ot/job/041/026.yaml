  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: id
  text: Ia memandang segala yang tinggi; dialah raja atas semua anak-anak kesombongan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua yang sombong.” Secara harfiah, “semua anak-anak kesombongan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: segala yang tinggi
  rationale: אֵת menandai objek langsung dan tidak perlu diterjemahkan tersendiri. Ungkapan כָּל גָּבֹהַּ mencakup segala atau semua yang tinggi; terjemahan ini mempertahankan gambaran ketinggian sekaligus membuka kemungkinan makna kiasan tentang keluhuran atau keangkuhan.
- source_word: יִרְאֶה
  choice: memandang
  rationale: Kata kerja ראה berarti melihat. Dalam konteks puitis ini, “memandang” menyatakan tindakan memperhatikan objek dengan tenang dan tetap alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: dialah
  rationale: Pronomina mandiri הוּא memberi penegasan. Bentuk “dialah” mempertahankan tekanan itu secara wajar dalam bahasa Indonesia.
- source_word: מֶלֶךְ עַל
  choice: raja atas
  rationale: מֶלֶךְ berarti “raja,” sedangkan עַל menyatakan kedudukan atau kekuasaan atas pihak lain. Ungkapan ini mempertahankan metafora kerajaan dan supremasi.
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: semua anak kesombongan
  rationale: Terjemahan ini mempertahankan ungkapan puitis harfiah “anak-anak kesombongan” tanpa membatasinya pada hewan buas, makhluk tertentu, atau kuasa kosmis. Bentuk “semua anak” dipakai karena בְּנֵי merupakan bentuk jamak konstruktus, sedangkan “kesombongan” mewakili שָׁחַץ.
theological_decisions:
- issue: Identitas “semua anak kesombongan”
  choice: Mempertahankannya sebagai sebutan puitis bagi semua makhluk atau sosok yang dicirikan oleh kesombongan, dengan Lewiatan digambarkan sebagai raja atas mereka.
  alternative: Menafsirkannya secara khusus sebagai binatang buas atau sebagai kuasa kosmis yang angkuh.
  rationale: Bahasa Ibrani tidak mengharuskan pembatasan pada satu kelompok tertentu. Terjemahan harfiah-puitis mempertahankan ambiguitas dan ketegangan gambaran tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Dialah” mempertahankan penegasan Ibrani, sementara ungkapan “anak kesombongan” sengaja dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
