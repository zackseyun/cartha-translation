  text: לֹֽא יַבְרִיחֶ֥/נּוּ בֶן קָ֑שֶׁת לְ֝/קַ֗שׁ נֶהְפְּכוּ ל֥/וֹ אַבְנֵי קָֽלַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/020.yaml
  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: id
  text: Pemanah[a] tidak dapat membuatnya lari; batu-batu umban menjadi seperti jerami baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak busur”, yaitu seorang pemanah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: tidak dapat membuatnya lari
  rationale: Bentuk Hifil dari ברח dengan objek orang ketiga tunggal maskulin menyatakan tindakan menyebabkan dia lari. Ungkapan ini mempertahankan daya kausatif verba Ibrani secara alami dalam bahasa Indonesia.
- source_word: בֶן קָשֶׁת
  choice: pemanah
  rationale: Secara harfiah berarti “anak busur”, sebuah ungkapan Ibrani bagi orang yang menggunakan atau berkaitan erat dengan busur. “Pemanah” menyampaikan maksud idiom itu dengan jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְקַשׁ
  choice: seperti jerami
  rationale: קַשׁ menunjuk pada sisa batang tanaman yang kering atau jerami. “Jerami” mempertahankan gambaran tentang sesuatu yang ringan dan tidak berarti di hadapan Lewiatan.
- source_word: נֶהְפְּכוּ לוֹ
  choice: menjadi ... baginya
  rationale: Bentuk Nifal dari הפך di sini menyatakan keadaan atau perubahan menjadi sesuatu dalam hubungannya dengan Lewiatan. “Menjadi ... baginya” mempertahankan susunan dan sudut pandang teks tanpa menambahkan penafsiran.
- source_word: אַבְנֵי קָלַע
  choice: batu-batu umban
  rationale: Frasa konstruksi ini berarti batu-batu yang digunakan sebagai peluru umban. “Batu-batu umban” ringkas, jelas, dan sesuai dengan citra persenjataan dalam konteks.
