  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: id
  text: Di bawahnya terdapat pecahan-pecahan tembikar yang tajam[a]; ia menghamparkan dirinya seperti papan pengirik di atas lumpur.[b]
  philosophy: optimal-equivalence
