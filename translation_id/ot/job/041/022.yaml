lexical_decisions:
- source_word: תַּחְתָּיו
  choice: Di bawahnya
  rationale: Mempertahankan arti ruang dari preposisi dengan sufiks orang ketiga maskulin tunggal dan terdengar alami dalam bahasa Indonesia.
- source_word: חַדּוּדֵי חָרֶשׂ
  choice: pecahan-pecahan tembikar yang tajam
  rationale: Mengungkapkan bentuk konstruksi yang menunjuk pada benda-benda tembikar berujung atau bertepi tajam; frasa ini lebih mudah dipahami daripada istilah teknis 'kereweng'.
- source_word: יִרְפַּד
  choice: membaringkan dirinya
  rationale: Kata kerja ini dapat berarti membentangkan atau menata sebagai alas/tempat berbaring. Pilihan refleksif sesuai dengan Leviatan sebagai subjek dan mempertahankan gambaran bahwa bagian bawah tubuhnya terhampar di atas lumpur.
- source_word: חָרוּץ
  choice: papan pengirik
  rationale: Dalam konteks ini menunjuk pada alat pertanian tajam yang diseret untuk mengirik; 'papan pengirik' konkret dan dapat dipahami dalam bahasa Indonesia.
- source_word: עֲלֵי טִיט
  choice: di atas lumpur
  rationale: Mempertahankan hubungan posisi yang dinyatakan oleh preposisi serta arti fisik טִיט sebagai lumpur atau tanah liat basah.
