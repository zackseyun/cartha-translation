  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: id
  text: Dari lubang hidungnya keluar asap, seperti dari periuk[a] yang apinya dikipasi dan dari gelagah yang terbakar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuali besar.” Kata Ibrani דּוּד dapat menunjuk pada periuk masak atau wadah yang lebih besar.
    reason: lexical_alternative
  - marker: b
    text: Gelagah atau tumbuhan rawa sejenis dapat dipakai sebagai bahan bakar; gambaran ini menekankan asap dari api yang berkobar kuat.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: dari lubang hidungnya
  rationale: Ungkapan ini secara konkret menunjuk pada lubang hidung; pilihan ini mempertahankan gambaran jasmani yang kuat.
- source_word: יֵצֵא עָשָׁן
  choice: keluar asap
  rationale: Bentuk imperfek menggambarkan tindakan khas dalam uraian puitis; susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan teks sumber.
- source_word: כְּדוּד
  choice: seperti dari periuk
  rationale: דּוּד adalah wadah untuk memasak yang dapat berupa periuk atau kuali besar. Penambahan 'dari' dalam bahasa Indonesia memperjelas sumber asap yang tersirat dalam perbandingan.
- source_word: נָפוּחַ
  choice: yang apinya dikipasi
  rationale: Partisip pasif ini berhubungan dengan tindakan meniup atau mengipasi agar api menyala kuat. Terjemahan ini mempertahankan tindakan tersebut, bukan hanya hasilnya berupa panas atau didih.
- source_word: וְאַגְמֹן
  choice: dan gelagah yang terbakar
  rationale: אַגְמוֹן menunjuk pada tumbuhan rawa seperti gelagah atau mensiang. Dalam gambaran ini tumbuhan tersebut tampaknya berfungsi sebagai bahan bakar; 'yang terbakar' mengungkapkan elipsis puitis tanpa mengubah citra dasarnya.
