  register: Bahasa Indonesia modern yang puitis dan bermartabat. Struktur kalimat mempertahankan urutan gambaran Ibrani, sedangkan frasa “apinya dikipasi” menyampaikan nuansa נָפוּחַ secara konkret. Semua penanda catatan kaki dicantumkan dalam teks utama.
