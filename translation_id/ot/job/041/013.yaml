translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Pilihan “napasnya” menyampaikan citra hembusan berapi secara jelas, sedangkan catatan kaki mempertahankan keluasan makna kata Ibrani.
