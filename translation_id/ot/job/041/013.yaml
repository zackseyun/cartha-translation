  text: His breath kindles coals[a], and a flame comes out from his mouth.
translation:
  language: id
  text: Napasnya menyalakan bara[a], dan nyala api keluar dari mulutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jiwanya menyalakan bara” atau “Tenggorokannya menyalakan bara.” Kata Ibrani נֶפֶשׁ dapat berarti “jiwa,” “hidup,” atau “tenggorokan,” dan dalam konteks ini dapat diperluas maknanya menjadi “napas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: napasnya
  rationale: Dalam konteks gambaran fisiologis dan paralel dengan “dari mulutnya,” נֶפֶשׁ paling wajar dipahami sebagai napas, meskipun secara leksikal juga dapat berarti jiwa, hidup, atau tenggorokan.
- source_word: גֶּחָלִים
  choice: bara
  rationale: Kata ini menunjuk pada bara atau arang membara. “Bara” ringkas, alami, dan tidak mengulang gagasan penyalaan yang sudah dinyatakan oleh verba.
- source_word: תְּלַהֵט
  choice: menyalakan
  rationale: Bentuk Piel menyatakan tindakan menyebabkan sesuatu menyala atau berkobar. “Menyalakan” mempertahankan daya kausatif itu dalam bahasa Indonesia yang alami.
- source_word: וְלַהַב
  choice: dan nyala api
  rationale: לַהַב adalah nomina tunggal yang berarti nyala atau kobaran. “Nyala api” mempertahankan citra tunggal dan terdengar alami.
- source_word: מִפִּיו
  choice: dari mulutnya
  rationale: Terjemahan langsung dan alami untuk preposisi מִן dengan פֶּה beserta sufiks orang ketiga tunggal.
- source_word: יֵצֵא
  choice: keluar
  rationale: Verba ini berarti keluar atau pergi ke luar. Bersama frasa “dari mulutnya,” “keluar” merupakan padanan Indonesia yang paling lugas.
