  source_fidelity: 'Teks Indonesia dengan setia menyampaikan tekad orang pertama dalam לֹא אַחֲרִישׁ, objek pembicaraan berupa anggota tubuh Lewiatan, serta dua unsur lanjutan: keperkasaan dan keelokan/tatanan bentuknya. Pengulangan "tentang" merupakan penguraian yang wajar dari konstruksi Ibrani dan tidak mengubah cakupan unsur-unsurnya.'
