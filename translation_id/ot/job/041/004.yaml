  terminology: '"Keindahan susunan tubuhnya" menangkap חִין עֶרְכּוֹ tanpa memaksakan pembacaan teknis. "Kekuatannya yang besar" secara wajar menyatakan גְּבוּרוֹת dalam konteks deskripsi fisik, walaupun nomina Ibrani berbentuk jamak. Catatan kaki menyediakan alternatif leksikal yang relevan dan penanda [a] ditempatkan tepat setelah istilah yang dijelaskan.'
