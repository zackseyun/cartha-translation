  text: לא אַחֲרִ֥ישׁ בַּדָּ֑י/ו וּ/דְבַר גְּ֝בוּר֗וֹת וְ/חִ֣ין עֶרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: id
  text: Aku tidak akan berdiam diri tentang anggota-anggota tubuhnya,[a] tentang kekuatannya yang besar dan keindahan susunan tubuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku tidak akan berdiam diri tentang bagian-bagian tubuhnya, tentang kekuatannya dan keelokan susunannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: Aku tidak akan berdiam diri
  rationale: Bentuk Hifil dari חרשׁ di sini menyatakan tindakan menahan diri untuk tidak berbicara. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tekad orang pertama.
- source_word: בַּדָּיו
  choice: anggota-anggota tubuhnya
  rationale: בַּד dapat menunjuk pada bagian atau anggota tubuh. Dalam uraian tentang Lewiatan, pilihan ini konkret dan sesuai dengan konteks anatomis.
- source_word: דְבַר
  choice: tentang
  rationale: Dalam rangkaian ini, דְבַר memperkenalkan pokok yang akan dibicarakan. Terjemahan sederhana 'tentang' menghasilkan kalimat Indonesia yang alami tanpa memaksakan arti teknis seperti 'laporan'.
- source_word: גְּבוּרוֹת
  choice: kekuatannya yang besar
  rationale: Bentuk jamak ini dapat berarti kuasa, keperkasaan, atau perbuatan-perbuatan dahsyat. Konteks gambaran fisik Lewiatan mendukung pengertian kekuatan yang luar biasa, sambil mempertahankan intensitas bentuk Ibraninya.
- source_word: חִין
  choice: keindahan
  rationale: חֵן dapat berarti keelokan, pesona, atau perkenanan. Di sini makna estetis paling sesuai karena kata tersebut menerangkan susunan tubuh makhluk itu.
- source_word: עֶרְכּוֹ
  choice: susunan tubuhnya
  rationale: Kata yang berasal dari ערך menunjuk pada tatanan atau susunan. Penambahan 'tubuh' memperjelas acuannya dalam konteks tanpa mengubah gambaran tentang bentuk yang tertata.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina 'Aku' mempertahankan ujaran langsung ilahi dalam konteks, sedangkan pengulangan 'tentang' menjaga kesejajaran unsur-unsur Ibrani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
