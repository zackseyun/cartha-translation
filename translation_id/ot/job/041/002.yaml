source:
  edition: WLC
  text: לֹֽא אַ֭כְזָר כִּ֣י יְעוּרֶ֑/נּוּ וּ/מִ֥י ה֝֗וּא לְ/פָנַ֥/י יִתְיַצָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: id
  text: Tidak seorang pun begitu ganas sehingga berani membangkitkannya[a]. Jadi, siapakah yang sanggup berdiri di hadapan-Ku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membangunkannya.” Kata kerja Ibrani berarti “membangunkan” atau “membangkitkan”; di sini maksudnya membangkitkan Lewiatan untuk bertindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: Tidak seorang pun begitu ganas
  rationale: Partikel negatif dan adjektiva dipahami secara idiomatis sebagai penyangkalan bahwa ada orang yang cukup ganas atau nekat untuk menghadapi Lewiatan. “Ganas” mempertahankan gagasan keganasan tanpa memberi penilaian moral sekuat “kejam”.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam susunan ini כִּי memperkenalkan akibat dari tingkat keganasan yang disebut sebelumnya; “sehingga” menghasilkan konstruksi Indonesia yang alami.
- source_word: יְעוּרֶנּוּ
  choice: berani membangkitkannya
  rationale: Kata kerja עור berarti membangunkan atau membangkitkan. Dalam konteks ini tindakan tersebut berarti membangkitkan Lewiatan untuk bertindak, sedangkan “berani” mengungkapkan daya retoris klausa tanpa mengubah pokok maknanya.
- source_word: וּמִי הוּא
  choice: Jadi, siapakah
  rationale: Konjungsi dan kata tanya mengalihkan argumen dari ketakutan terhadap Lewiatan kepada tantangan untuk menghadap Allah. “Jadi” menyatakan hubungan inferensial itu secara wajar dalam bahasa Indonesia.
- source_word: לְפָנַי
  choice: di hadapan-Ku
  rationale: Ungkapan ini secara harfiah menunjuk pada berada di depan wajah atau hadirat pembicara ilahi. Bentuk “di hadapan-Ku” mempertahankan gambaran tersebut.
- source_word: יִתְיַצָּב
  choice: sanggup berdiri
  rationale: Bentuk hitpael dari יצב berarti menempatkan diri atau berdiri tegak. Dalam pertanyaan retoris ini, “sanggup berdiri” menyampaikan kemampuan bertahan atau tampil di hadapan Allah.
theological_decisions:
- issue: Hubungan klausa pertama tentang Lewiatan dengan klausa kedua tentang Allah
  choice: 'Klausa kedua beralih kepada Allah: jika tidak ada yang berani membangkitkan Lewiatan, terlebih lagi tidak ada yang sanggup berdiri di hadapan Allah.'
  alternative: Kedua klausa sama-sama merujuk hanya kepada Lewiatan.
  rationale: Akhiran orang pertama pada לְפָנַי (“di hadapan-Ku”) menunjukkan bahwa pembicara ilahi merujuk kepada diri-Nya sendiri. Alurnya bergerak dari makhluk kepada Sang Pencipta, sesuai dengan konteks perkataan Allah dalam Ayub 40–41.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Kapital pada “-Ku” mengikuti konvensi ejaan keagamaan Indonesia untuk rujukan kepada Allah. Susunan pertanyaan dibuat alami tanpa menghilangkan peralihan retoris dari Lewiatan kepada Allah.
