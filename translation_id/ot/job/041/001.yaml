- from: Lihatlah, harapannya ternyata semu[a]; bukankah orang tersungkur bahkan hanya dengan melihatnya[b]?
  to: Lihatlah, harapannya ternyata sia-sia[a]; bukankah orang dijatuhkan bahkan hanya dengan melihatnya[b]?
  rationale: Revisi mengganti "semu" dengan "sia-sia" agar hasil kegagalan atau kekecewaan yang terkandung dalam נִכְזָבָה lebih jelas dalam bahasa Indonesia. "Dijatuhkan" menggantikan "tersungkur" untuk menjaga bentuk pasif יֻטָל. Penekanan retoris הֲגַם tetap tampak melalui "bukankah" dan "bahkan," dan catatan kaki b diperbaiki agar tidak mempersempit מַרְאָיו menjadi sekadar "penampilan."
