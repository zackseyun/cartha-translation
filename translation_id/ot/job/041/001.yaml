  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: id
  text: Lihatlah, harapannya ternyata sia-sia[a]; bukankah orang dijatuhkan bahkan hanya dengan melihatnya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harapannya kandas,” “harapannya terbukti palsu,” atau “kepercayaannya gagal.” Kata Ibrani ini dapat menekankan bahwa harapan tersebut ternyata menipu atau berakhir dengan kekecewaan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bukankah orang dijatuhkan bahkan pada saat melihatnya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dan penegasan dalam bahasa puisi, sekaligus tetap wajar dalam bahasa Indonesia modern.
- source_word: תֹּחַלְתּוֹ
  choice: harapannya
  rationale: Nomina ini menyatakan harapan atau penantian; 'harapannya' merupakan padanan langsung dan alami.
- source_word: נִכְזָבָה
  choice: ternyata semu
  rationale: Bentuk dari כזב menyatakan bahwa harapan itu terbukti palsu, menipu, atau mengecewakan. 'Ternyata semu' mempertahankan nuansa hasil tanpa menentukan secara berlebihan siapa yang kecewa.
- source_word: הֲגַם
  choice: bukankah ... bahkan
  rationale: Gabungan partikel tanya dan penambah membentuk pertanyaan retoris yang diperkuat; kedua unsur itu dinyatakan secara alami dengan 'bukankah' dan 'bahkan'.
- source_word: אֶל מַרְאָיו
  choice: hanya dengan melihatnya
  rationale: Ungkapan ini menunjuk pada reaksi ketika berhadapan dengan penampakannya. Terjemahan tersebut alami dan menyampaikan bahwa sekadar melihatnya sudah cukup, sementara alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: יֻטָל
  choice: tersungkur
  rationale: Bentuk pasif kausatif dari טול menyatakan dilemparkan atau dijatuhkan. 'Tersungkur' secara ringkas menggambarkan orang yang dibuat jatuh atau tak berdaya tanpa menetapkan penyebabnya hanya sebagai rasa takut.
