translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. 'Lihatlah' menjaga penegasan teks, sedangkan pertanyaan retoris dipertahankan. Pronomina '-nya' dibiarkan mengikuti konteks Lewiatan tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
