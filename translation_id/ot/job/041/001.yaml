review_pass:
  verdict: revise
  source_fidelity: 'Teks Ibrani menyatakan bahwa harapan/harapannya terbukti menipu atau gagal, lalu mengajukan pertanyaan retoris: bahkan pada saat melihatnya, tidakkah seseorang dijatuhkan/tersungkur? Terjemahan draf pada umumnya menangkap struktur dan penekanan ayat. Namun, "ternyata semu" kurang tepat untuk נִכְזָבָה karena lebih mudah dipahami sebagai tampak samar atau tidak nyata, bukan harapan yang terbukti gagal/menipu. "Dijatuhkan" lebih jelas mempertahankan bentuk pasif יֻטָל daripada "tersungkur."'
  naturalness: Revisi tetap memakai bahasa Indonesia modern dan puitis. "Harapannya ternyata sia-sia" adalah ungkapan yang lebih lazim daripada "harapannya ternyata semu," dan "dijatuhkan hanya dengan melihatnya" menyampaikan pertanyaan retoris secara ringkas serta alami.
  terminology: '"Lihatlah" sesuai untuk הֵן, dan "harapannya" mempertahankan rujukan pronominal tanpa menambahkan identitas makhluk itu. Tidak ada istilah teologis khusus dalam ayat ini yang perlu diubah.'
  issues:
  - severity: medium
    issue: '"harapannya ternyata semu" untuk נִכְזָבָה'
    rationale: '"Semu" terutama berarti tidak nyata, samar, atau bersifat ilusi. Dalam konteks ini verba dari כזב menyatakan bahwa harapan itu terbukti menipu, gagal, atau sia-sia. "Ternyata sia-sia" lebih jelas dan idiomatis tanpa menentukan secara berlebihan bentuk kekecewaannya.'
  - severity: low
    issue: '"tersungkur" tidak sejelas bentuk pasif יֻטָל'
    rationale: '"Tersungkur" dapat menggambarkan hasil jatuh, tetapi tidak secara eksplisit menyatakan bahwa subjek dijatuhkan/dilayangkan ke bawah. "Dijatuhkan" mempertahankan daya pasif verba Ibrani, sambil tetap membiarkan mekanisme kejatuhan tidak dijelaskan.'
  - severity: low
    issue: Catatan kaki b menyebut "penampilannya"
    rationale: '"Penampilannya" dapat mengarah pada gaya atau rupa luaran. "Melihatnya" atau "pada saat melihatnya" lebih langsung mewakili אֶל מַרְאָיו dalam konteks ini.'
