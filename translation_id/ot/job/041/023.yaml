translation:
  language: id
  text: 'Ia membuat kedalaman laut mendidih seperti periuk;

    ia menjadikan laut seperti racikan minyak wangi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti salep racikan” atau “seperti racikan wewangian.” Kata Ibrani ini menunjuk pada campuran yang diracik, sering kali berkaitan dengan salep atau wewangian.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: membuat ... mendidih
  rationale: Bentuk kausatif dari רתח menyatakan tindakan menyebabkan sesuatu mendidih atau bergolak; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: כַּסִּיר
  choice: seperti periuk
  rationale: סִיר menunjuk pada wadah untuk memasak. “Periuk” mempertahankan gambaran puitis tentang air yang mendidih dalam bejana.
- source_word: מְצוּלָה
  choice: laut dalam
  rationale: מְצוּלָה menunjuk pada kedalaman atau perairan yang dalam. “Laut dalam” jelas bagi pembaca modern dan tetap sejajar dengan “laut” pada baris berikutnya.
- source_word: יָם
  choice: laut
  rationale: יָם lazim berarti “laut”; pilihan langsung ini mempertahankan gambaran konkret dan kesejajaran puisi.
- source_word: יָשִׂים
  choice: membuat
  rationale: Dalam konstruksi perbandingan ini, שׂים yang secara harfiah berarti menaruh atau menetapkan berfungsi dalam arti menjadikan atau membuat tampak seperti.
- source_word: כַּמֶּרְקָחָה
  choice: seperti racikan minyak wangi
  rationale: מֶרְקָחָה berarti campuran yang diracik, khususnya salep, rempah wangi, atau minyak wangi. “Racikan minyak wangi” mempertahankan gagasan campuran hasil racikan tanpa menambahkan bejana yang tidak disebut secara eksplisit dalam frasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas. “Periuk” dipilih sebagai kata konkret yang umum, sedangkan susunan dua baris mempertahankan paralelisme teks Ibrani.
