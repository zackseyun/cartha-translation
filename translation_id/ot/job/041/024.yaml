  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: id
  text: Di belakangnya, jalur berkilau[a]; orang mengira samudra raya itu beruban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sesudahnya, suatu jalur berkilau.” Ungkapan Ibrani dapat dipahami secara spasial (“di belakangnya”) atau temporal (“sesudahnya”); konteks jejak di air mendukung arti spasial.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “samudra raya sebagai uban/keadaan beruban”; buih putih membuat laut tampak seolah-olah beruban.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Di belakangnya
  rationale: Bentuk ini dapat menyatakan urutan ruang maupun waktu. Dalam gambaran Lewiatan yang bergerak di air, arti spasial paling sesuai karena menunjuk pada jejak air yang ditinggalkannya.
- source_word: יָאִיר
  choice: berkilau
  rationale: Bentuk Hifil dari אור berarti memberi terang atau bersinar. Dalam konteks ini, kata tersebut menggambarkan terangnya buih pada jejak di air; 'berkilau' alami dan puitis dalam bahasa Indonesia.
- source_word: נָתִיב
  choice: jejak
  rationale: Nomina ini berarti jalan, jalur, atau lintasan. Di sini yang dimaksud ialah jejak terang yang terbentuk di air ketika Lewiatan melintas.
- source_word: יַחְשֹׁב
  choice: orang menyangka
  rationale: Walaupun secara bentuk merupakan verba orang ketiga tunggal maskulin, bentuk ini dapat dipakai secara impersonal. 'Orang menyangka' menyampaikan kesan pengamat tanpa menentukan pelaku tertentu.
- source_word: תְּהוֹם
  choice: samudra raya
  rationale: Kata ini menunjuk pada perairan dalam. 'Samudra raya' mempertahankan daya puitisnya dan lebih alami daripada ungkapan harfiah 'yang dalam' dalam konteks ini.
- source_word: לְשֵׂיבָה
  choice: beruban
  rationale: Nomina שֵׂיבָה berarti uban, keadaan beruban, atau usia tua. Gambaran ini mempersonifikasikan laut yang tampak putih oleh buih, seolah-olah beruban.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. 'Jejak berkilau' menggambarkan lintasan berbuih secara ringkas, sedangkan 'samudra raya beruban' mempertahankan personifikasi yang mencolok dalam teks Ibrani. Penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
