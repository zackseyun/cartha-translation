  text: A club is regarded as straw[b][a], and he laughs at the rattling of the javelin.
translation:
  language: id
  text: Gada[b] dianggapnya seperti jerami[a], dan ia menertawakan gemeretak lembing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seperti sisa batang kering."
