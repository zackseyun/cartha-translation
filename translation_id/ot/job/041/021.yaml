lexical_decisions:
- source_word: כְּקַשׁ
  choice: seperti jerami
  rationale: קַשׁ berarti jerami atau tunggul kering; 'jerami' alami dalam bahasa Indonesia dan mempertahankan gambaran sesuatu yang ringan serta tidak berbahaya.
- source_word: נֶחְשְׁבוּ
  choice: dianggapnya
  rationale: Bentuk pasif dari חשׁב menyatakan 'dianggap/diperhitungkan'. Akhiran '-nya' memperjelas sudut pandang Lewiatan tanpa mengubah makna.
- source_word: תוֹתָח
  choice: gada
  rationale: Kata ini langka dan arti tepatnya tidak pasti. Dalam konteks persenjataan, 'gada' memberi padanan yang jelas sambil mempertahankan alternatif proyektil dalam catatan kaki.
- source_word: וְיִשְׂחַק
  choice: dan ia menertawakan
  rationale: Kata kerja שׂחק berarti 'tertawa'; subjeknya adalah Lewiatan yang digambarkan dalam konteks.
- source_word: לְרַעַשׁ
  choice: gemeretak
  rationale: רַעַשׁ dapat menunjuk bunyi gaduh, guncangan, atau derak. 'Gemeretak' menangkap bunyi mengancam dari senjata yang digerakkan tanpa mempersempit makna secara berlebihan.
- source_word: כִּידוֹן
  choice: lembing
  rationale: כידון adalah senjata bertangkai yang menyerupai tombak dan dapat dilempar; 'lembing' merupakan padanan Indonesia yang tepat dan mudah dipahami.
