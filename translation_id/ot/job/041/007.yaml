translation:
  language: id
  text: Barisan perisainya yang megah tertutup rapat, tersegel erat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּאֲוָה
  choice: yang megah
  rationale: Secara harfiah berarti 'keagungan/kebanggaan'. Di sini kata itu menggambarkan barisan pelindung Lewiatan sebagai sesuatu yang mengesankan, tanpa memaksakan arti bahwa sisik itu sendiri merasa bangga.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: barisan sisiknya
  rationale: Ungkapan sulit ini secara harfiah berkaitan dengan 'alur/barisan perisai'. Dalam konteks uraian tubuh Lewiatan, 'perisai' merupakan kiasan bagi sisik-sisik pelindungnya; 'barisan' mempertahankan gambaran susunannya.
- source_word: סָגוּר
  choice: tertutup rapat
  rationale: Menunjukkan bahwa susunan pelindung itu tertutup atau terkatup tanpa celah.
- source_word: חוֹתָם צָר
  choice: masing-masing seperti dimeteraikan
  rationale: Frasa nominal yang padat ini secara harfiah berarti kira-kira 'meterai yang rapat/ketat'. Terjemahan ini mempertahankan citra meterai dan, dengan konteks ayat berikutnya, menyatakan rapatnya hubungan antarsisik.
