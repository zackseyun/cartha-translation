translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Sisik' dipilih demi kejelasan konteks zoologis, sedangkan citra perisai tetap terwakili oleh fungsi pelindung dan citra meterai dipertahankan.
