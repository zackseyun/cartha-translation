base_translation:
  language: en
  yaml_path: translation/ot/job/041/019.yaml
  text: He regards iron as straw[a], and bronze as rotten wood.
translation:
  language: id
  text: Ia menganggap besi seperti jerami, dan perunggu[a] seperti kayu lapuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tembaga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׁב
  choice: menganggap
  rationale: Kata kerja חשׁב di sini menyatakan penilaian atau perhitungan; “menganggap” secara alami menunjukkan bahwa Lewiatan menilai logam-logam kuat itu tidak berarti.
- source_word: לְתֶבֶן
  choice: seperti jerami
  rationale: תֶּבֶן lazim berarti jerami atau sisa tangkai tanaman, dan prefiks לְ menyatakan perbandingan.
- source_word: בַּרְזֶל
  choice: besi
  rationale: Padanan baku untuk logam ini dan sesuai dengan konteks bahan yang kuat.
- source_word: לְעֵץ רִקָּבוֹן
  choice: seperti kayu lapuk
  rationale: Frasa ini secara harfiah berarti “seperti kayu kelapukan”; “kayu lapuk” mempertahankan gambaran bahan yang telah lemah karena membusuk.
- source_word: נְחוּשָׁה
  choice: perunggu
  rationale: נְחוּשָׁה dapat menunjuk pada tembaga atau perunggu. Dalam konteks logam kuat dan perlengkapan kuno, “perunggu” merupakan pilihan utama yang wajar, sementara kemungkinan “tembaga” dicatat dalam catatan kaki.
