source:
  edition: WLC
  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: id
  text: Siapakah yang lebih dahulu memberi kepada-Ku[a], sehingga Aku harus membalasnya? Segala sesuatu yang ada di bawah seluruh langit adalah milik-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Siapakah yang telah mendahului Aku, sehingga Aku harus membalasnya?” Kata kerja Ibrani dapat berarti “mendahului” atau “mengantisipasi”, tetapi di sini kemungkinan besar berarti memberi atau berbuat lebih dahulu sehingga pihak lain dianggap berkewajiban membalas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapakah
  rationale: Kata tanya ini membuka pertanyaan retoris. Bentuk “Siapakah” wajar dalam bahasa Indonesia yang bermartabat dan tidak menambahkan penekanan yang tidak tersurat.
- source_word: הִקְדִּימַנִי
  choice: yang lebih dahulu memberi kepada-Ku
  rationale: Bentuk Hifil dari קדם dengan akhiran orang pertama tunggal secara harfiah dapat berarti mendahului atau mengantisipasi Aku. Dalam kaitannya dengan “Aku harus membalasnya,” ungkapan ini menunjuk pada pemberian atau jasa yang dilakukan lebih dahulu sehingga seolah-olah menempatkan Allah dalam kewajiban membalas.
- source_word: וַאֲשַׁלֵּם
  choice: sehingga Aku harus membalasnya
  rationale: Dalam pertanyaan retoris ini, verba tersebut menyatakan akibat dari tindakan sebelumnya, bukan janji masa depan. “Harus” menyampaikan gagasan kewajiban yang tersirat oleh tindakan membalas, sedangkan objek “-nya” dituntut oleh ungkapan bahasa Indonesia.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: di bawah seluruh langit
  rationale: Ungkapan ini mencakup seluruh tatanan ciptaan. Walaupun שׁמים berbentuk jamak dalam bahasa Ibrani, “seluruh langit” lebih alami dalam bahasa Indonesia daripada “semua langit” dan tetap mempertahankan cakupan universalnya.
- source_word: לִי הוּא
  choice: adalah milik-Ku
  rationale: Susunan bahasa Ibrani menonjolkan kepunyaan Allah, secara harfiah “bagi-Ku itu.” “Adalah milik-Ku” merupakan padanan Indonesia yang jelas dan idiomatis; “segala sesuatu yang ada” mengungkapkan totalitas yang tersirat dalam frasa sebelumnya.
theological_decisions:
- issue: Allah tidak berutang kepada siapa pun dan memiliki seluruh ciptaan
  choice: Ayat diterjemahkan sebagai pertanyaan retoris yang menyangkal bahwa seseorang dapat lebih dahulu memberi kepada Allah sehingga membuat-Nya wajib membalas, lalu menegaskan bahwa segala sesuatu di bawah langit adalah milik-Nya.
  alternative: Klausa pertama dapat diterjemahkan secara lebih harfiah, “Siapakah yang telah mendahului Aku, sehingga Aku harus membalasnya?” tanpa menjelaskan unsur pemberian atau jasa.
  rationale: Hubungan langsung antara הִקְדִּימַנִי dan “membalas” mendukung makna memberi atau berbuat lebih dahulu, bukan sekadar berada lebih dahulu dalam urutan waktu. Terjemahan ini mempertahankan argumen ayat tanpa memasukkan rumusan doktrinal dari luar teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Huruf kapital pada bentuk yang merujuk kepada Allah mengikuti gaya penerbitan religius Indonesia. Pilihan “seluruh langit” menghindari bentuk “semua langit” yang kurang alami, sementara “segala sesuatu yang ada” menyatakan totalitas yang tersirat.
