  text: Siapa yang dapat menyingkap permukaan pakaiannya? Siapa yang dapat masuk ke dalam kekangnya yang rangkap?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang dapat masuk ke dalam lipatan kekangnya?” Ungkapan Ibrani ini sulit dipahami; secara kiasan mungkin menunjuk pada mulut atau rahang Lewiatan, atau pada deretan giginya yang rangkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: menyingkap
  rationale: Kata kerja ini berarti membuka atau menyingkap sesuatu yang tertutup. “Menyingkap” mempertahankan gambaran konkret tanpa memastikan bahwa penutup itu dilepaskan seluruhnya.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: bagian luar pakaiannya
  rationale: Secara harfiah ungkapan ini menunjuk pada “permukaan/wajah pakaiannya.” Pilihan ini mempertahankan metafora pakaian sambil menyampaikan bahwa yang dimaksud ialah bagian penutup yang tampak.
- source_word: בְּכֶפֶל
  choice: ke lipatan ... yang rangkap
  rationale: כפל dapat menyatakan lipatan atau keadaan berlipat/rangkap. Terjemahan ini sengaja mempertahankan citra yang sulit dan tidak langsung mengidentifikasikannya sebagai rahang atau deretan gigi.
- source_word: רִסְנוֹ
  choice: kekangnya
  rationale: רסן lazim berarti kekang atau tali pengendali pada mulut. “Kekang” merupakan padanan langsung dan membiarkan penerapan metaforisnya pada Lewiatan tetap terasa.
- source_word: מִי יָבוֹא
  choice: Siapa yang berani masuk
  rationale: Pertanyaan retoris ini menyatakan tantangan atau ketidakmungkinan. “Berani masuk” terdengar alami dalam bahasa Indonesia dan sesuai dengan konteks mendekati bagian mulut makhluk yang berbahaya.
