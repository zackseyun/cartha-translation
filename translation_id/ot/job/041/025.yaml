  text: On earth there is none like him[b][a], one made without fear.
translation:
  language: id
  text: Di bumi tidak ada yang seperti dia[a], makhluk yang dijadikan tanpa rasa gentar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di bumi tidak ada yang sebanding dengannya”; istilah Ibrani di sini dapat menyatakan keserupaan atau kesetaraan.
    reason: lexical_alternative
