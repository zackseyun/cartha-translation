  text: אִישׁ בְּ/אָחִ֥י/הוּ יְדֻבָּ֑קוּ יִ֝תְלַכְּד֗וּ וְ/לֹ֣א יִתְפָּרָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: id
  text: Masing-masing melekat pada sesamanya[a]; semuanya saling terkait erat dan tidak dapat dipisahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Setiap orang dengan saudaranya, mereka melekat.” Dalam gambaran puitis tentang sisik Lewiatan, “saudaranya” merupakan metafora bagi sisik yang berdampingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Yang satu
  rationale: Dalam gambaran tentang sisik Lewiatan, אִישׁ dipakai secara distributif, bukan untuk menunjuk seorang laki-laki. Pilihan ini mempertahankan penekanan pada setiap bagian secara individual.
- source_word: בְּאָחִיהוּ
  choice: pada yang lain
  rationale: Secara harfiah berarti 'dengan/pada saudaranya'. Dalam konteks benda-benda yang berdampingan, 'yang lain' terdengar alami dan tetap menyatakan hubungan erat antara satu sisik dan sisik di sebelahnya; metafora 'saudara' dicatat dalam catatan kaki.
- source_word: יְדֻבָּקוּ
  choice: melekat
  rationale: Kata kerja דבק menyatakan pelekatan atau perlekatan yang rapat. Bentuk Indonesia ini jelas, lugas, dan sesuai dengan gambaran sisik-sisik.
- source_word: יִתְלַכְּדוּ
  choice: saling mengunci
  rationale: Kata kerja ini menggambarkan bagian-bagian yang tertangkap, terikat, atau terkait erat satu sama lain. 'Saling mengunci' menyampaikan susunan sisik yang berpaut rapat tanpa memakai istilah teknis.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: dan tidak terpisahkan
  rationale: Ungkapan ini menyampaikan akibat dari keterikatan yang rapat, yaitu bagian-bagian itu tidak dapat tercerai. 'Tidak terpisahkan' alami dalam bahasa Indonesia dan mempertahankan daya ungkap puitis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan puitis. Susunan distributif 'yang satu ... yang lain' mempertahankan gambaran setiap sisik, sedangkan 'semuanya saling mengunci' mengungkapkan tindakan jamak pada baris berikutnya.
