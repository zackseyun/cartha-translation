  text: Who has opened the doors of his face? Around his teeth is terror[a][b].
translation:
  language: id
  text: Siapa yang pernah membuka pintu-pintu wajahnya?[a] Di sekeliling giginya ada kengerian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Siapa yang dapat membuka pintu-pintu mulutnya?” Secara harfiah, bahasa Ibrani berbunyi “pintu-pintu wajahnya,” suatu ungkapan puitis yang menunjuk pada mulut atau rahang.
    reason: lexical_alternative
  - marker: b
    text: Atau “Di sekeliling giginya ada kedahsyatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: pintu-pintu
  rationale: Bentuk jamak konstruktus ini secara harfiah berarti “pintu-pintu.” Pilihan ini mempertahankan metafora puitis Ibrani; “rahang” lebih bersifat penafsiran dan dicantumkan dalam catatan kaki.
- source_word: פָנָיו
  choice: wajahnya
  rationale: Makna dasarnya ialah “wajahnya” atau bagian depannya. Dalam konteks ini ungkapan tersebut menunjuk pada daerah mulut atau rahang, tetapi terjemahan utama mempertahankan citra bahasa Ibrani.
- source_word: מִי
  choice: Siapa
  rationale: Kata tanya baku yang mengawali pertanyaan retoris.
- source_word: פִתֵּחַ
  choice: pernah membuka
  rationale: Verba dari akar פתח berarti “membuka.” Kata “pernah” menyampaikan daya bentuk perfektif dalam pertanyaan retoris secara alami tanpa mengubahnya langsung menjadi pernyataan tentang kemampuan.
- source_word: סְבִיבוֹת
  choice: di sekeliling
  rationale: Mengungkapkan sesuatu yang berada di sekitar atau mengelilingi dan menghasilkan susunan bahasa Indonesia yang wajar.
- source_word: שִׁנָּיו
  choice: giginya
  rationale: Makna dasarnya adalah “gigi-giginya/giginya.” “Taringnya” akan memperkuat gambaran melampaui nilai leksikal kata sumber.
- source_word: אֵימָה
  choice: kengerian
  rationale: Nomina ini menyatakan kengerian atau kedahsyatan yang menimbulkan takut. “Kengerian” mempertahankan kekuatan klausa nominal penutup.
