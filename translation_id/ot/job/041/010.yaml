  text: Bersin-bersinnya memancarkan cahaya[a], dan matanya seperti kelopak mata fajar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bersin-bersinnya membuat cahaya bersinar.” Kata kerja Ibraninya berbentuk kausatif, dan ungkapan ini sangat puitis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kelopak mata fajar,” sebuah gambaran puitis Ibrani tentang cahaya pertama yang menyingsing pada awal hari.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: bersinnya
  rationale: Nomina dari עטש merujuk pada bersin. Bentuk jamak Ibrani dengan sufiks orang ketiga maskulin tunggal diterjemahkan secara alami dalam bahasa Indonesia sebagai nomina kolektif "bersinnya".
- source_word: תָּהֶל
  choice: memancarkan
  rationale: Bentuk kausatif verba ini menyatakan menyebabkan cahaya bersinar. "Memancarkan" mempertahankan daya kausatif dan cocok dengan gambaran puitis yang hidup.
- source_word: אוֹר
  choice: cahaya
  rationale: Padanan langsung dan wajar bagi nomina umum yang berarti cahaya.
- source_word: וְעֵינָיו
  choice: dan matanya
  rationale: Menerjemahkan konjungsi, nomina, dan sufiks orang ketiga maskulin tunggal secara langsung dan alami.
- source_word: כְעַפְעַפֵּי
  choice: seperti kelopak
  rationale: עפעפים secara harfiah berarti kelopak mata. Dalam gabungan puitis dengan fajar, kata ini menggambarkan cahaya awal hari yang seolah-olah membuka mata; citra literal dipertahankan.
- source_word: שָׁחַר
  choice: fajar
  rationale: Padanan ringkas, puitis, dan lazim untuk waktu terbitnya cahaya pagi.
