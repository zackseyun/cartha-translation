  text: אֶחָ֣ד בְּ/אֶחָ֣ד יִגַּ֑שׁוּ וְ֝/ר֗וּחַ לֹא יָב֥וֹא בֵֽינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/008.yaml
  text: They press close[a], one to another, and no air can come between them.
translation:
  language: id
  text: Yang satu merapat pada yang lain, dan tidak ada udara[a] yang dapat masuk di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “angin”. Kata Ibrani רוּחַ dapat berarti “udara”, “angin”, atau “napas”; di sini yang dimaksud adalah sesuatu yang bersifat fisik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: yang satu ... pada yang lain
  rationale: Ungkapan berulang ini menyatakan kedekatan timbal balik, yakni setiap bagian berdempetan dengan bagian di sebelahnya.
- source_word: יִגַּשׁוּ
  choice: merapat
  rationale: Dalam konteks sisik-sisik Lewiatan, verba ini bukan sekadar berarti mendekat, melainkan berada sangat rapat satu sama lain.
- source_word: וְרוּחַ
  choice: dan ... udara
  rationale: רוּחַ memiliki rentang makna ‘udara’, ‘angin’, atau ‘napas’. Gambaran fisik tentang tidak adanya celah paling alami dinyatakan dengan ‘udara’, sementara alternatif leksikalnya dicatat dalam catatan kaki.
- source_word: לֹא יָבוֹא
  choice: tidak ada ... yang dapat masuk
  rationale: Bentuk imperfek bernegasi menggambarkan bahwa karena rapatnya susunan itu, udara secara efektif tidak dapat masuk.
- source_word: בֵינֵיהֶם
  choice: di antara mereka
  rationale: Frasa ini menyatakan ruang di antara bagian-bagian yang berdekatan; pronomina jamak maskulin dipertahankan secara alami sebagai ‘mereka’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. ‘Merapat’ menyampaikan hubungan fisik antarsisik tanpa menambahkan istilah ‘sisik’ yang tidak muncul secara eksplisit dalam ayat ini.
