  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: id
  text: Pedang yang mencapainya tidak dapat bertahan[a]; demikian pula tombak, senjata lontar, dan lembing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pedang yang menyusulnya tidak berhasil.” Secara harfiah, ungkapan Ibrani mengatakan bahwa pedang itu “tidak berdiri”.
    reason: lexical_alternative
  - marker: b
    text: Kedua istilah Ibrani yang diterjemahkan “senjata lontar” dan “lembing” langka dan maknanya tidak pasti. Istilah pertama juga dapat berarti “proyektil” atau “batang”, sedangkan istilah kedua mungkin berarti “baju zirah” atau “zirah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: yang mencapainya
  rationale: Bentuk dari השׂיג berarti ‘mencapai, menyusul’. Dalam konteks pedang yang digunakan untuk melawan Lewiatan, ‘yang mencapainya’ mempertahankan daya verbal tanpa menambahkan gagasan bahwa pedang itu pasti melukai.
- source_word: חֶרֶב
  choice: pedang
  rationale: Nomina umum bagi pedang; dalam bahasa Indonesia bentuk tanpa artikel secara alami dapat menyatakan jenis senjata secara generik.
- source_word: בְּלִי תָקוּם
  choice: tidak akan bertahan
  rationale: Ungkapan בלי + קום secara harfiah menyatakan bahwa pedang itu ‘tidak berdiri’. ‘Tidak akan bertahan’ menjaga citra konkretnya sekaligus menyampaikan ketidakmampuannya menghadapi Lewiatan.
- source_word: חֲנִית
  choice: tombak
  rationale: Padanan Indonesia yang umum dan mudah dipahami untuk senjata bertangkai yang digunakan menusuk atau dilempar.
- source_word: מַסָּע
  choice: lembing
  rationale: Istilah Ibrani ini langka dan tidak pasti, tetapi dalam deretan senjata kemungkinan menunjuk pada senjata lempar atau batang proyektil. ‘Lembing’ cocok dengan konteks tanpa menutup alternatif leksikal lain yang dicatat dalam catatan kaki.
- source_word: וְשִׁרְיָה
  choice: pelontar
  rationale: Istilah ini langka dan maknanya tidak pasti. Konteks deretan senjata mendukung pengertian senjata atau proyektil; ‘pelontar’ dipilih sebagai padanan netral, sementara kemungkinan ‘zirah’ dipertahankan dalam catatan kaki.
