base_translation:
  language: en
  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: id
  text: Di lehernya kekuatan berdiam, dan di hadapannya kegentaran[a] melompat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kengerian.” Kata Ibrani דְּאָבָה jarang dipakai; dalam konteks puitis ini maknanya dapat berkisar dari kegentaran atau kemuraman hingga kengerian.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: Di lehernya
  rationale: Preposisi ב dengan צַוָּאר dan sufiks orang ketiga maskulin tunggal paling wajar dipahami secara lokatif; pilihan ini mempertahankan gambaran bahwa kekuatan berada pada lehernya.
- source_word: יָלִין
  choice: berdiam
  rationale: Kata לין secara harfiah dapat berarti bermalam atau menginap. Dalam personifikasi puitis ini, ‘berdiam’ menyampaikan keberadaan yang menetap tanpa terdengar janggal dalam bahasa Indonesia.
- source_word: עֹז
  choice: kekuatan
  rationale: Padanan langsung dan alami untuk nomina yang berarti kekuatan atau keperkasaan.
- source_word: וּלְפָנָיו
  choice: dan di hadapannya
  rationale: Ungkapan dengan פָּנִים berarti di depan atau di hadapan seseorang; ‘di hadapannya’ ringkas, wajar, dan mempertahankan acuan personal.
- source_word: תָּדוּץ
  choice: melompat
  rationale: Verba langka דוץ menggambarkan gerakan melonjak atau melompat. ‘Melompat’ mempertahankan personifikasi yang hidup dan menghindari nuansa positif yang dapat timbul dari ‘menari’.
- source_word: דְּאָבָה
  choice: kegentaran
  rationale: Nomina langka ini menunjuk pada keadaan batin negatif yang dapat mencakup rasa gentar, muram, atau ngeri. ‘Kegentaran’ sesuai dengan konteks ancaman tanpa mempersempit maknanya menjadi teror semata.
