  text: The folds of his flesh cling together[a]; they are cast firm upon him and cannot be moved.
translation:
  language: id
  text: Lipatan-lipatan dagingnya saling melekat; semuanya terpasang kukuh[a] padanya dan tidak tergoyahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini memakai gambaran sesuatu yang dicor atau dituangkan sehingga menjadi tetap dan kukuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: lipatan-lipatan
  rationale: Nomina ini menunjuk pada bagian-bagian yang menggantung atau berlipat. Dalam konteks tubuh makhluk itu, 'lipatan-lipatan' mempertahankan gambaran konkret secara alami.
- source_word: בְשָׂרוֹ
  choice: dagingnya
  rationale: Mempertahankan arti dasar בשר, yaitu 'daging', tanpa mempersempitnya menjadi 'kulit' atau memperluasnya menjadi 'tubuh'.
- source_word: דָבֵקוּ
  choice: melekat erat
  rationale: Kata דבק menyatakan perlekatan yang rapat. 'Melekat erat' menyampaikan kekuatan ikatan antarlipatan dengan idiom Indonesia yang wajar.
- source_word: יָצוּק
  choice: terpancang kukuh
  rationale: Bentuk pasif/adjektival ini menggambarkan sesuatu yang dicor atau dituangkan hingga menjadi tetap dan kokoh. 'Terpancang kukuh' menyampaikan hasil berupa keadaan yang tidak bergeser, sementara catatan kaki mempertahankan citra pengecorannya.
- source_word: עָלָיו
  choice: padanya
  rationale: Padanan langsung dan alami bagi preposisi dengan sufiks pronominal tersebut.
- source_word: בַּל יִמּוֹט
  choice: tidak dapat digoyahkan
  rationale: Partikel negatif puitis בַּל dan verba Niphal מוט menyatakan bahwa bagian-bagian itu tidak akan bergerak, goyah, atau bergeser. 'Tidak dapat digoyahkan' wajar dan mempertahankan citra kekukuhan.
