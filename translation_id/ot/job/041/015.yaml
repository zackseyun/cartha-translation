translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat, tetapi tetap mudah dipahami. Pengulangan 'lipatan-lipatan' mempertahankan bentuk jamak, sedangkan 'semuanya' memperjelas subjek klausa kedua tanpa mengubah acuannya.
