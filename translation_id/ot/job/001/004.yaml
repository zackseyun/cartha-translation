  verdict: revise
  source_fidelity: Teks utama dengan tepat menyatakan kebiasaan para putra mengadakan perjamuan secara bergiliran di rumah masing-masing dan mengundang ketiga saudari mereka. Namun, verba וְהָלְכוּ ('pergi') tidak terwakili dalam draf. Selain itu, 'menyuruh orang mengundang' mengubah pasangan 'mengirim dan mengundang' menjadi tindakan kausatif serta menambahkan 'orang' tanpa perlu.
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. 'Pergi mengadakan perjamuan' dan 'mengirim utusan untuk mengundang' merupakan susunan yang alami dalam bahasa Indonesia modern serta mempertahankan tindakan yang dinyatakan sumber.
  terminology: '''Anak-anak lelakinya,'' ''perjamuan,'' dan ''ketiga saudari mereka'' tepat dan konsisten dengan jenis kelamin serta jumlah dalam teks Ibrani. Catatan kaki dengan benar mempertahankan ketidakpastian makna ''pada harinya.'''
  issues:
  - severity: medium
    issue: Verba gerak וְהָלְכוּ tidak diterjemahkan.
    rationale: Kata 'biasa' memang menyampaikan aspek kebiasaan, tetapi tidak menyampaikan unsur 'pergi.' Penambahan 'pergi' dapat dilakukan tanpa membuat kalimat tidak alami.
  - severity: medium
    issue: Ungkapan 'menyuruh orang mengundang' tidak secara dekat mencerminkan וְשָׁלְחוּ וְקָרְאוּ.
    rationale: Teks Ibrani menyebut tindakan mengirim dan mengundang. 'Menyuruh orang' mengubahnya menjadi kausatif dan menyisipkan pelaku perantara yang tidak dinyatakan secara eksplisit. 'Mengirim utusan untuk mengundang' menyampaikan kedua unsur itu secara wajar.
  - severity: low
    issue: '''bersama-sama'' kurang jelas rujukannya.'
    rationale: Preposisi עִמָּהֶם secara spesifik berarti 'bersama mereka,' yakni bersama para putra. Rujukan eksplisit lebih jelas.
  revised_text: Anak-anak lelakinya biasa pergi mengadakan perjamuan, masing-masing di rumahnya sendiri, pada harinya[a]. Mereka mengirim utusan untuk mengundang ketiga saudari mereka makan dan minum bersama mereka.
  revised_footnotes:
