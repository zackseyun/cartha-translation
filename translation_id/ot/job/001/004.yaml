  text: וְ/הָלְכ֤וּ בָנָי/ו֙ וְ/עָשׂ֣וּ מִשְׁתֶּ֔ה בֵּ֖ית אִ֣ישׁ יוֹמ֑/וֹ וְ/שָׁלְח֗וּ וְ/קָרְאוּ֙ לִ/שְׁלֹ֣שֶׁת אחיתי/הם לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת עִמָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: id
  text: Anak-anak lelakinya biasa pergi mengadakan perjamuan, masing-masing di rumahnya sendiri, pada harinya[a]. Mereka mengirim utusan untuk mengundang ketiga saudari mereka makan dan minum bersama mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “pada hari ulang tahunnya.” Secara harfiah bahasa Ibrani berbunyi “pada harinya,” yang dapat menunjuk pada hari giliran masing-masing atau pada hari ulang tahunnya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: biasa
  rationale: Bentuk perfek dalam uraian ini menyatakan tindakan yang berulang pada masa lampau; 'biasa' menyampaikan kebiasaan tersebut secara alami dalam bahasa Indonesia tanpa menerjemahkan verba gerak secara kaku.
- source_word: בָנָיו
  choice: anak-anak lelakinya
  rationale: Nomina Ibrani ini berbentuk jamak maskulin dan dibedakan dari para saudari yang disebut kemudian.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: mengadakan perjamuan
  rationale: Ungkapan harfiah 'membuat perjamuan' secara idiomatis berarti mengadakan jamuan makan dan minum; 'perjamuan' mempertahankan nuansa perayaan tanpa mengesankan upacara tertentu.
- source_word: בֵּית אִישׁ
  choice: masing-masing di rumahnya sendiri
  rationale: אִישׁ berfungsi distributif, sehingga setiap anak lelaki menjadi tuan rumah di rumahnya sendiri.
- source_word: יוֹמוֹ
  choice: pada harinya
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang tidak menentukan apakah yang dimaksud adalah giliran yang ditetapkan atau hari ulang tahun.
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: menyuruh orang mengundang
  rationale: Dua verba itu menggambarkan pengiriman pesan atau utusan untuk memanggil para saudari; ungkapan Indonesia ini alami dan tetap menyampaikan kedua unsur tindakan tersebut.
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: ketiga saudari mereka
  rationale: Numeralia dan sufiks kepunyaan menunjuk secara khusus kepada tiga saudari mereka.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: untuk makan dan minum
  rationale: Pasangan infinitif ini secara langsung menyatakan keikutsertaan dalam perjamuan.
- source_word: עִמָּהֶם
  choice: bersama-sama
  rationale: Dalam konteks kalimat, bentuk ini secara alami menyatakan bahwa para saudari makan dan minum bersama saudara-saudara lelaki mereka.
theological_decisions:
- issue: Makna יוֹמוֹ ('harinya')
  choice: Mempertahankan 'pada harinya' dalam teks utama
  alternative: pada hari gilirannya; pada hari ulang tahunnya
  rationale: Bahasa Ibrani tidak menjelaskan apakah hari itu adalah giliran masing-masing anak atau hari ulang tahunnya. Teks utama mempertahankan ambiguitas tersebut, sedangkan kemungkinan maknanya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Anak-anak lelaki' membedakan para putra dari ketiga saudari mereka; 'perjamuan' dipakai dalam arti umum, bukan sebagai istilah ritual. Struktur dibagi menjadi dua kalimat agar mudah dipahami tanpa menghilangkan hubungan antartindakan.
