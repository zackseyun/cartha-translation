base_translation:
  language: en
  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: id
  text: Lalu orang-orang Syeba menyerbu dan mengambilnya[a]. Mereka menewaskan orang-orang muda itu dengan mata pedang[b][c]. Hanya aku seorang yang lolos untuk memberitahukannya kepada Tuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengambil mereka,” yaitu lembu-lembu dan keledai-keledai yang disebut dalam ayat sebelumnya.
    reason: referential_clarification
  - marker: b
    text: Bahasa Ibrani secara harfiah berbunyi “dengan mulut pedang,” suatu ungkapan yang berarti dengan mata pedang.
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani dapat berarti “orang-orang muda” atau “para pelayan”; di sini yang dimaksud kemungkinan besar ialah para pelayan Ayub yang menjaga ternak.
    reason: lexical_cultural_note
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: orang-orang Syeba menyerbu
  rationale: Dalam konteks serangan, נפל menyatakan serbuan mendadak, bukan tindakan jatuh secara harfiah. Nama tempat/kelompok שְׁבָא dipertahankan sebagai Syeba, sedangkan 'orang-orang' menjelaskan bahwa yang bertindak ialah para penyerbu dari Syeba.
- source_word: וַתִּקָּחֵם
  choice: merampas semuanya
  rationale: Akhiran orang ketiga jamak merujuk pada lembu dan keledai dalam ayat sebelumnya. 'Merampas' menyampaikan tindakan mengambil sebagai jarahan; 'semuanya' secara alami mencakup kedua kelompok ternak itu.
- source_word: הַנְּעָרִים
  choice: para pelayan muda itu
  rationale: נַעַר dapat berarti pemuda maupun pelayan. Dalam konteks ini mereka menjaga ternak Ayub; pilihan ini mempertahankan unsur usia sekaligus fungsi mereka.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: menewaskan ... dengan mata pedang
  rationale: Frasa idiomatis ini secara harfiah menyebut 'mulut pedang'. 'Mata pedang' merupakan ungkapan Indonesia yang wajar dan mempertahankan citra ketajaman pedang, sedangkan 'menewaskan' memperjelas akibat serangan.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Hanya aku seorang yang lolos
  rationale: Susunan ini mempertahankan penekanan ganda pada satu-satunya orang yang selamat dan menggunakan ungkapan Indonesia yang alami.
- source_word: לְהַגִּיד לָךְ
  choice: untuk memberi tahu Tuan
  rationale: נגד menyatakan penyampaian laporan. Sapaan 'Tuan' wajar bagi seorang pelayan yang berbicara kepada majikannya dan membuat pronomina tunggal לָךְ eksplisit.
