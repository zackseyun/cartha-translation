  naturalness: Secara umum bahasanya modern dan bernada layak. “Jangan ulurkan tanganmu terhadap dirinya” kurang alami dan ambigu dalam bahasa Indonesia. “Jangan ulurkan tanganmu kepadanya” lebih lancar dalam konteks larangan untuk bertindak terhadap Ayub.
  terminology: “Yahweh” konsisten dengan sumber dan jejak audit. “Sang Pendakwa” lebih sesuai untuk gelar/peran dalam register Alkitabiah modern daripada “si Pendakwa,” yang dapat terdengar percakapan atau merendahkan. Catatan kaki dengan tepat mempertahankan alternatif “Satan” dan “lawan” serta fungsi kata sandang Ibrani.
