  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הִנֵּ֤ה כָל אֲשֶׁר ל/וֹ֙ בְּ/יָדֶ֔/ךָ רַ֣ק אֵלָ֔י/ו אַל תִּשְׁלַ֖ח יָדֶ֑/ךָ וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/עִ֖ם פְּנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: id
  text: Lalu Yahweh berkata kepada sang Pendakwa[a], “Lihat, segala miliknya ada dalam tanganmu. Hanya saja, jangan ulurkan tanganmu kepadanya.” Kemudian sang Pendakwa pergi dari hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sang Satan” atau “sang lawan.” Dalam bahasa Ibrani kata ini memakai kata sandang, yang menunjukkan gelar atau peran.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti Tuhan.
- source_word: הַשָּׂטָן
  choice: si Pendakwa
  rationale: Kata sandang Ibrani menunjukkan gelar atau peran, bukan secara pasti nama diri; 'Pendakwa' menangkap fungsi tuduhannya dalam sidang surgawi.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Penanda wacana ini mengarahkan perhatian secara tegas dan tetap wajar dalam bahasa Indonesia modern.
- source_word: כָל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Ungkapan alami yang mencakup semua yang dimiliki Ayub.
- source_word: בְּיָדֶךָ
  choice: ada dalam tanganmu
  rationale: Mempertahankan citra 'tangan' sebagai kuasa atau kendali sekaligus pengulangannya dalam larangan berikutnya.
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai satu-satunya batas atas wewenang yang baru diberikan.
- source_word: אֵלָיו אַל תִּשְׁלַח יָדֶךָ
  choice: jangan ulurkan tanganmu terhadap dirinya
  rationale: Mempertahankan idiom dan pengulangan 'tangan'; 'terhadap dirinya' menunjukkan bahwa Ayub sendiri, berbeda dari miliknya, tidak boleh diserang.
- source_word: וַיֵּצֵא
  choice: pergi
  rationale: Padanan naratif yang lugas dan alami untuk tindakan meninggalkan tempat itu.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Menyampaikan idiom keberangkatan dari hadirat seseorang sambil mempertahankan gambaran suasana sidang.
theological_decisions:
- issue: Identitas dan fungsi הַשָּׂטָן dalam prolog Ayub
  choice: si Pendakwa
  alternative: Satan; sang lawan
  rationale: Kata sandang dalam bahasa Ibrani mendukung pembacaan sebagai gelar atau peran. Terjemahan ini mempertahankan fungsi forensiknya tanpa memastikan bahwa bentuk tersebut sudah menjadi nama diri.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'si Pendakwa' dipakai karena 'sang Pendakwa' dapat terdengar terlalu luhur bagi tokoh ini, sedangkan kata sandangnya tetap perlu terwakili. Citra tangan sengaja dipertahankan pada kedua klausa.
