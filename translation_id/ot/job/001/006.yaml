id: JOB.1.6
reference: Job 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/יּ֔וֹם וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י הָ/אֱלֹהִ֔ים לְ/הִתְיַצֵּ֖ב עַל יְהוָ֑ה וַ/יָּב֥וֹא גַֽם הַ/שָּׂטָ֖ן בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: id
  text: Pada suatu hari, anak-anak Allah datang untuk menghadap Yahweh, dan Sang Penentang[a] juga datang di tengah-tengah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan tradisional, “Setan.” Dalam bahasa Ibrani tertulis “sang penentang” dengan kata sandang; di sini sebutan itu mungkin berfungsi sebagai gelar, bukan nama diri.
    reason: alternative_reading
  - marker: b
    text: “Anak-anak Allah” mungkin merujuk kepada makhluk-makhluk surgawi dalam sidang ilahi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Pada suatu hari
  rationale: Ungkapan ini memperkenalkan sebuah adegan. Bentuk ini alami dalam narasi Indonesia tanpa menambahkan penanda wacana yang tidak eksplisit.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: anak-anak Allah
  rationale: Terjemahan formal ini mempertahankan gambaran dan ambiguitas ungkapan Ibrani; tafsiran bahwa mereka adalah makhluk surgawi ditempatkan dalam catatan kaki.
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: untuk menghadap Yahweh
  rationale: Dalam konteks kehadiran di hadapan penguasa, bentuk verba ini menyatakan datang atau menampilkan diri untuk menghadap; 'menghadap' merupakan padanan Indonesia yang alami dan ringkas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sesuai bentuk nama diri dalam sumber dan lapisan konsultasi proyek.
- source_word: הַשָּׂטָן
  choice: Sang Penentang
  rationale: Nomina Ibrani memakai kata sandang dan di sini dapat berfungsi sebagai gelar atau sebutan peran, bukan semata-mata nama diri. 'Sang Penentang' mempertahankan sifat definit dan makna leksikalnya.
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Padanan alami yang menyatakan bahwa tokoh tersebut hadir di dalam kelompok itu.
theological_decisions:
- issue: Apakah הַשָּׂטָן diterjemahkan sebagai nama diri atau gelar
  choice: Sang Penentang
  alternative: Setan; sang pendakwa
  rationale: Adanya kata sandang Ibrani mendukung pembacaan sebagai gelar atau sebutan peran. Terjemahan ini tidak memaksakan pemakaian nama diri yang lebih baku dalam tradisi kemudian, sementara bentuk tradisional dicatat sebagai alternatif.
- issue: Apakah בְּנֵי הָאֱלֹהִים diterjemahkan secara formal atau ditafsirkan
  choice: anak-anak Allah
  alternative: makhluk-makhluk surgawi; makhluk-makhluk ilahi
  rationale: Terjemahan formal mempertahankan ungkapan sumber dan ketegangan teologisnya. Kemungkinan rujukannya kepada para makhluk dalam sidang ilahi dijelaskan tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang wajar dan bermartabat. Ungkapan sumber yang penting secara teologis dipertahankan, sedangkan penjelasan interpretatif ditempatkan dalam catatan kaki. Penanda catatan ditempatkan langsung setelah frasa yang dijelaskan.
