  terminology: Nama ilahi 'Yahweh' konsisten dengan keputusan proyek. 'Anak-anak Allah' mempertahankan bentuk idiomatik sumber tanpa menafsirkan secara berlebihan. 'Sang Penentang' secara tepat menandai artikel definit dalam הַשָּׂטָן dan catatan kaki menyediakan padanan tradisional 'Setan' tanpa memaksakan pembacaan nama diri.
