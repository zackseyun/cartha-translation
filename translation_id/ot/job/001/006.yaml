  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur Ibrani: formula naratif ''Pada suatu hari'', בני האלהים sebagai ''anak-anak Allah'', הופעת/kehadiran resmi melalui ''untuk menghadap Yahweh'', הַשָּׂטָן sebagai gelar ''Sang Penentang'', dan בְּתוֹכָם sebagai kehadiran di dalam kelompok itu. Ambiguitas istilah-istilah utama dipertahankan.'
