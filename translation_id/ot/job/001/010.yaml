  text: הֲ/לֹֽא את שַׂ֣כְתָּ בַעֲד֧/וֹ וּ/בְעַד בֵּית֛/וֹ וּ/בְעַ֥ד כָּל אֲשֶׁר ל֖/וֹ מִ/סָּבִ֑יב מַעֲשֵׂ֤ה יָדָי/ו֙ בֵּרַ֔כְתָּ וּ/מִקְנֵ֖/הוּ פָּרַ֥ץ בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: id
  text: Bukankah Engkau telah memasang pagar pelindung di sekeliling dia, di sekeliling rumahnya, dan di sekeliling segala miliknya—di segala sisi[a]? Engkau telah memberkati hasil pekerjaannya, dan ternaknya telah bertambah banyak di negeri itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di sekeliling dia, di sekeliling rumahnya, dan di sekeliling segala yang ada padanya.” “Rumahnya” dapat mencakup rumah tangga atau seisi rumahnya.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang digunakan secara harfiah menggambarkan sesuatu yang menerobos batas atau meluas. Dapat juga diterjemahkan, “ternaknya telah tersebar di seluruh negeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: memasang pagar pelindung di sekeliling
  rationale: Mempertahankan gambaran konkret tentang pagar yang mengelilingi sekaligus memperjelas fungsi perlindungannya dalam bahasa Indonesia yang alami.
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ מִסָּבִיב
  choice: di sekeliling dia, keluarganya, dan segala miliknya
  rationale: Ungkapan ini menyampaikan perlindungan yang melingkupi seluruh kehidupan Ayub. Dalam konteks ini, בֵּיתוֹ terutama menunjuk kepada seisi rumah atau keluarga, bukan hanya bangunan rumah.
- source_word: מַעֲשֵׂה יָדָיו
  choice: hasil pekerjaannya
  rationale: Idiom Ibrani ini menunjuk pada pekerjaan dan hasil usaha seseorang. Bentuk Indonesia ini alami dan tidak membatasi maknanya pada barang yang dibuat dengan tangan.
- source_word: בֵּרַכְתָּ
  choice: telah memberkati
  rationale: Mempertahankan istilah teologis ברך dan atribusi berkat kepada Allah, bukan mereduksinya menjadi kemakmuran material semata.
- source_word: מִקְנֵהוּ
  choice: ternaknya
  rationale: מִקְנֶה dalam konteks ini menunjuk pada hewan peliharaan atau kawanan ternak, bukan seluruh harta benda.
- source_word: פָּרַץ בָּאָרֶץ
  choice: telah berkembang ke seluruh negeri
  rationale: פָּרַץ menggambarkan gerak menerobos atau meluas dengan pesat. 'Berkembang ke seluruh negeri' mempertahankan unsur pertambahan dan penyebaran secara wajar dalam bahasa Indonesia.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Menjaga bentuk pertanyaan retoris dan nada tuduhan penutur.
theological_decisions:
- issue: Bahasa berkat atau sekadar keberhasilan ekonomi
  choice: Engkau telah memberkati hasil pekerjaannya
  alternative: Engkau telah membuat pekerjaannya berhasil
  rationale: Teks secara langsung menghubungkan keberhasilan Ayub dengan berkat Allah; istilah 'memberkati' perlu dipertahankan.
- issue: Metafora perlindungan yang mengelilingi
  choice: memasang pagar pelindung di sekeliling
  alternative: melindungi
  rationale: Pilihan ini mempertahankan citra konkret sumber Ibrani sekaligus menyatakan fungsi pagar itu tanpa memasukkan ajaran khusus.
- issue: Makna בֵּיתוֹ
  choice: keluarganya
  alternative: rumahnya
  rationale: Dalam konteks daftar 'dia, rumahnya, dan segala miliknya', istilah tersebut dapat menunjuk kepada rumah tangga atau keluarga. Teks utama memilih makna personal yang alami, sedangkan kemungkinan bangunan atau seisi rumah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pertanyaan retoris dipertahankan. Metafora pagar dibuat jelas tanpa menjadi abstrak; idiom pekerjaan dialihkan secara alami, dan citra perluasan ternak tetap dijaga.
