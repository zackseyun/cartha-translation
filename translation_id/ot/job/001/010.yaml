revisions:
- from: Bukankah Engkau telah memasang pagar pelindung di sekeliling dia, keluarganya, dan segala miliknya[a]? Engkau telah memberkati hasil pekerjaannya, dan ternaknya telah berkembang ke seluruh negeri[b].
  to: Bukankah Engkau telah memasang pagar pelindung di sekeliling dia, di sekeliling rumahnya, dan di sekeliling segala miliknya—di segala sisi[a]? Engkau telah memberkati hasil pekerjaannya, dan ternaknya telah bertambah banyak di negeri itu[b].
  rationale: Revisi mempertahankan ambiguitas “rumahnya,” memperjelas cakupan pagar yang mengelilingi, dan mengganti ungkapan tentang ternak dengan bentuk Indonesia yang alami serta setia pada makna pertambahan besar dari פָּרַץ. Catatan kaki b mempertahankan kemungkinan nuansa perluasan spasial tanpa memaksakannya dalam teks utama.
