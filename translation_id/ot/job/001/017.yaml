base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: id
  text: Ketika orang itu masih berbicara, datanglah orang lain dan berkata, “Orang-orang Kasdim membentuk tiga kelompok penyerbu[a], lalu menyerbu unta-unta itu dan mengambilnya. Mereka menewaskan para pemuda[b] dengan pedang[c]. Hanya aku seorang diri yang lolos untuk memberitahukan kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menetapkan tiga kepala”; dapat juga berarti “membagi diri menjadi tiga kelompok” atau “mengerahkan tiga kelompok.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “para pemuda” juga dapat merujuk kepada para pelayan atau pembantu rumah tangga dalam konteks ini.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani secara harfiah berbunyi “memukul dengan mulut pedang,” yaitu membunuh dengan pedang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: Sementara orang itu masih berbicara
  rationale: עֹוד dengan partisip menyatakan tindakan yang masih berlangsung; זֶה menunjuk kepada pembawa berita sebelumnya. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan tumpang tindih waktunya.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: datanglah orang lain dan berkata
  rationale: זֶה kedua dalam rangkaian naratif menunjuk pembawa berita berikutnya; 'orang lain' menyampaikan pergantian tokoh secara alami.
- source_word: כַּשְׂדִּים
  choice: Orang-orang Kasdim
  rationale: Nama etnis ini menunjuk secara kolektif kepada kelompok penyerbu.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: membentuk tiga kelompok penyerbu
  rationale: Ungkapan harfiah 'menetapkan tiga kepala' dalam konteks serangan menunjukkan tiga kelompok atau satuan. 'Kelompok penyerbu' menjelaskan fungsi taktis tanpa mengubah jumlahnya.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: lalu menyerbu
  rationale: פשט על berarti menyerang atau melakukan penyerbuan secara mendadak.
- source_word: הַגְּמַלִּים וַיִּקָּחוּם
  choice: unta-unta dan merampasnya
  rationale: Objek akhiran pronominal adalah unta-unta; 'merampas' secara wajar menyatakan pengambilan dalam konteks serangan.
- source_word: הַנְּעָרִים
  choice: para pemuda
  rationale: נְעָרִים secara dasar berarti pemuda, tetapi dalam rumah tangga dapat merujuk kepada pelayan; ambiguitas itu dipertahankan melalui catatan kaki.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: menewaskan ... dengan mata pedang
  rationale: Idiom 'menurut mulut/mata pedang' berarti membunuh dengan pedang. 'Menewaskan' menyatakan akibatnya, sedangkan 'mata pedang' mempertahankan citra idiom Ibrani secara wajar.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Hanya aku seorang diri yang lolos
  rationale: רַק dan לְבַדִּי bersama-sama menekankan bahwa pembawa berita adalah satu-satunya yang lolos.
- source_word: לְהַגִּיד לָךְ
  choice: untuk memberi tahu Tuan
  rationale: הגיד berarti memberi tahu atau melaporkan. Sapaan 'Tuan' membuat objek orang kedua tunggal terasa alami dalam laporan seorang bawahan kepada Ayub tanpa memasukkan nama yang tidak ada dalam teks.
