  - severity: low
    issue: '"Merampasnya" dapat diganti dengan "mengambil unta-unta itu."'
    rationale: Akhiran objek Ibrani memang merujuk kepada unta, tetapi pengulangan nomina membuat rujukan dalam bahasa Indonesia lebih jelas dan "mengambil" lebih dekat dengan לקח.
  - severity: low
