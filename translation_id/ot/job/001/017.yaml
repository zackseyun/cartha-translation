revisions:
- from: Sementara orang itu masih berbicara, datanglah orang lain dan berkata, “Orang-orang Kasdim membentuk tiga kelompok penyerbu[a], lalu menyerbu unta-unta dan merampasnya. Mereka menewaskan para pemuda[b] dengan mata pedang[c]. Hanya aku seorang diri yang lolos untuk memberi tahu Tuan.”
  to: Ketika orang itu masih berbicara, datanglah orang lain dan berkata, “Orang-orang Kasdim membentuk tiga kelompok penyerbu[a], lalu menyerbu unta-unta itu dan mengambilnya. Mereka menewaskan para pemuda[b] dengan pedang[c]. Hanya aku seorang diri yang lolos untuk memberitahukan kepadamu.”
