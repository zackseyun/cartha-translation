  text: And seven sons and three daughters were born to him.
translation:
  language: id
  text: Lalu lahirlah baginya tujuh anak laki-laki dan tiga anak perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: mempunyai
  rationale: Bentuk Nifal dari ילד secara harfiah menyatakan bahwa anak-anak “dilahirkan baginya.” Dalam bahasa Indonesia, rumusan kepemilikan “ia mempunyai” menyampaikan hasil kelahiran dan hubungan sebagai orang tua secara alami tanpa menonjolkan tindakan memperanakkan.
- source_word: לוֹ
  choice: Ia mempunyai
  rationale: ל dengan sufiks pronominal menandai hubungan atau kepemilikan dalam rumus kelahiran. Bahasa Indonesia alami mengungkapkannya melalui konstruksi “ia mempunyai,” bukan “lahir kepadanya.”
- source_word: שִׁבְעָה
  choice: tujuh
  rationale: Bilangan pokok yang menerangkan anak-anak laki-laki.
- source_word: בָנִים
  choice: anak laki-laki
  rationale: Kata Ibrani ini secara khusus menunjuk anak berjenis kelamin laki-laki; pilihan ini mempertahankan informasi tersebut dan lebih alami daripada “putra” dalam narasi modern umum.
- source_word: וְשָׁלֹשׁ
  choice: dan tiga
  rationale: Padanan langsung dan alami untuk kata sambung yang diikuti bilangan pokok.
- source_word: בָּנוֹת
  choice: anak perempuan
  rationale: Kata Ibrani ini secara khusus menunjuk anak berjenis kelamin perempuan; pilihan ini akurat dan alami dalam bahasa Indonesia modern.
