  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: id
  text: 'Lalu Yahweh berkata kepada sang Pendakwa[a], “Sudahkah engkau memperhatikan[b] hamba-Ku Ayub? Sebab tidak ada seorang pun seperti dia di bumi: seorang yang tidak bercela dan jujur, yang takut akan Allah dan menjauhi kejahatan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “sang pendakwa” atau “sang satan.” Kata ini memakai kata sandang dan dalam konteks ini tampaknya merupakan gelar atau peran, bukan nama diri.'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “Sudahkah engkau menaruh hatimu pada?”; ungkapan ini berarti mengarahkan perhatian dengan sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar seperti TUHAN.
- source_word: הַשָּׂטָן
  choice: si Pendakwa
  rationale: Kata sandang Ibrani menunjukkan gelar atau peran; 'si Pendakwa' menyampaikan nuansa penuduh dalam sidang surgawi tanpa menjadikannya nama diri secara prematur.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: Sudahkah engkau memperhatikan
  rationale: Ungkapan harfiahnya ialah 'menaruh hatimu pada', tetapi dalam konteks ini berarti mengarahkan perhatian dengan sungguh-sungguh. Bentuk idiomatis dipilih untuk kejelasan bahasa Indonesia.
- source_word: עַבְדִּי
  choice: hamba-Ku
  rationale: Menunjukkan bahwa Ayub adalah milik dan pelayan Allah; 'hamba' paling wajar dalam konteks ini.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Sebab tidak ada seorang pun seperti dia di bumi
  rationale: Menyampaikan keunikan watak Ayub dan cakupan luas frasa Ibrani, bukan wilayah geografis tertentu.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: Ia seorang yang tidak bercela dan lurus hati
  rationale: '''Tidak bercela'' menyatakan keutuhan moral, bukan kesempurnaan tanpa dosa; ''lurus hati'' menyampaikan kelurusan moral secara alami dalam bahasa Indonesia.'
- source_word: יְרֵא אֱלֹהִים
  choice: yang takut akan Allah
  rationale: Mempertahankan ungkapan alkitabiah yang mencakup rasa gentar, hormat, dan kesalehan.
- source_word: וְסָר מֵרָע
  choice: dan menjauhi kejahatan
  rationale: Partisip Ibrani menggambarkan kebiasaan berpaling atau menjaga diri dari kejahatan.
theological_decisions:
- issue: Apakah הַשָּׂטָן merupakan nama diri atau gelar/peran
  choice: si Pendakwa
  alternative: Satan; sang lawan
  rationale: Adanya kata sandang dalam teks Ibrani lebih kuat menunjuk kepada gelar atau peran. Terjemahan ini mempertahankan latar sidang surgawi dan tidak memasukkan perkembangan penggunaan sebagai nama diri dari masa kemudian.
- issue: Apakah תָּם menyatakan kesempurnaan tanpa dosa
  choice: tidak bercela dalam arti berintegritas
  alternative: sempurna; utuh
  rationale: Dalam sastra hikmat dan dalam pasangan dengan 'lurus', istilah ini menunjuk pada keutuhan watak dan integritas, bukan klaim bahwa Ayub sama sekali tidak berdosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'engkau' dipertahankan untuk dialog ilahi. Ungkapan Ibrani 'menaruh hati pada' diterjemahkan secara idiomatis sebagai 'memperhatikan'; ambiguitas penting pada gelar הַשָּׂטָן dijelaskan dalam catatan kaki.
