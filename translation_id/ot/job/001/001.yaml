  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: id
  text: Di tanah Us ada seorang laki-laki bernama Ayub. Orang itu tidak bercela dan lurus hati; ia takut akan Allah dan menjauhi kejahatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berpaling dari kejahatan” atau “menghindari kejahatan.” Verba Ibrani ini dapat berarti berbalik, menyimpang, atau menjauh dari sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Kata benda ini berbentuk tunggal maskulin dan menunjuk kepada seorang tokoh laki-laki; pilihan ini wajar dan tepat dalam pembukaan narasi Indonesia.
- source_word: הָיָה
  choice: ada
  rationale: Dalam konteks ini verba tersebut memperkenalkan keberadaan tokoh dan latar cerita. 'Ada' mempertahankan daya eksistensialnya tanpa menambahkan gagasan bahwa ia menetap di sana.
- source_word: בְאֶרֶץ עוּץ
  choice: di tanah Us
  rationale: אֶרֶץ dalam ungkapan geografis berarti wilayah atau tanah, sedangkan עוּץ ditransliterasikan menurut bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: אִיּוֹב שְׁמוֹ
  choice: bernama Ayub
  rationale: Ini merupakan ungkapan identifikasi yang alami dalam bahasa Indonesia. 'Ayub' adalah bentuk nama yang sudah baku dan dikenal luas.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: Orang itu
  rationale: Ungkapan ini kembali menunjuk kepada tokoh yang baru diperkenalkan. 'Orang itu' mempertahankan daya demonstratif הַהוּא secara alami.
- source_word: תָּם
  choice: tidak bercela
  rationale: Dalam sastra hikmat, kata ini menyatakan keutuhan moral atau integritas, bukan kesempurnaan mutlak tanpa dosa. 'Tidak bercela' mempertahankan pujian moral yang kuat tanpa melebihkan maknanya.
- source_word: יָשָׁר
  choice: lurus hati
  rationale: Adjektiva ini menggambarkan kelurusan etis. 'Lurus hati' jelas bagi pembaca modern dan selaras dengan gambaran integritas moral.
- source_word: וִירֵא אֱלֹהִים
  choice: ia takut akan Allah
  rationale: Ungkapan ini menyatakan sikap hormat dan takwa kepada Allah, bukan semata-mata rasa gentar. Bentuk 'takut akan Allah' merupakan idiom Indonesia yang alami dan cukup dekat dengan struktur sumber.
- source_word: וְסָר מֵרָע
  choice: dan menjauhi kejahatan
  rationale: Frasa ini menggambarkan tindakan aktif menghindari atau meninggalkan yang jahat. 'Menjauhi kejahatan' alami dalam bahasa Indonesia dan mempertahankan keluasan makna verba Ibrani.
theological_decisions:
- issue: Makna gambaran moral Ayub
  choice: Ayub digambarkan memiliki integritas dan kehidupan yang patut diteladani, bukan dinyatakan sama sekali tanpa dosa.
  alternative: Ayub sempurna secara mutlak atau sama sekali tidak berdosa.
  rationale: Dalam konteks sastra hikmat, תָּם dan יָשָׁר memuji keutuhan serta kelurusan moral. 'Tidak bercela dan lurus hati' mempertahankan pujian kuat itu tanpa menyelesaikan ketegangan teologis secara berlebihan.
- issue: Acuan אֱלֹהִים
  choice: Allah
  alternative: allah-allah atau para dewa
  rationale: Walaupun bentuk katanya secara morfologis jamak, idiom dan konteks narasi menuntut acuan tunggal kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar alami dalam narasi Indonesia, tanpa mengubah hubungan antargagasan. Penanda catatan kaki ditempatkan pada frasa yang dijelaskannya.
