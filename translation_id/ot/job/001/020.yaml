base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: id
  text: Kemudian Ayub bangkit, mengoyakkan jubahnya, mencukur kepalanya, lalu jatuh ke tanah dan bersujud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membungkukkan diri.” Kata Ibrani ini dapat menunjuk pada tindakan merendahkan tubuh, sering kali sebagai penghormatan atau penyembahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk wayyiqtol dari קום melanjutkan urutan tindakan. “Bangkit” merupakan padanan naratif yang ringkas dan wajar.
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: mengoyakkan jubahnya
  rationale: קרע menyatakan tindakan merobek pakaian, khususnya sebagai tanda berkabung, sedangkan מְעִיל menunjuk pada jubah atau pakaian luar.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: mencukur kepalanya
  rationale: גזז berarti menggunting atau mencukur rambut; dalam konteks perkabungan, ungkapan ini secara alami dipahami sebagai mencukur rambut kepala.
- source_word: וַיִּפֹּל אַרְצָה
  choice: lalu sujud ke tanah
  rationale: Secara harfiah berarti jatuh menuju tanah. Dalam rangkaian dengan tindakan berikutnya, bahasa Indonesia alami dapat memadukan gerak turun dan sikap merendahkan diri tanpa menghilangkan unsur jasmaninya.
- source_word: וַיִּשְׁתָּחוּ
  choice: sujud
  rationale: Bentuk verba ini menyatakan membungkukkan diri atau merebahkan diri, kerap sebagai penghormatan atau penyembahan. “Sujud” mempertahankan tindakan jasmani sekaligus memungkinkan nuansa religius tanpa menjadikannya eksplisit secara berlebihan.
theological_decisions:
- issue: Apakah tindakan terakhir Ayub harus dinyatakan secara eksplisit sebagai penyembahan
  choice: sujud
  alternative: menyembah
  rationale: Konteks berikutnya mendukung makna penghormatan kepada Allah, tetapi verba Ibrani sendiri menggambarkan tindakan membungkuk atau merebahkan diri dan tidak secara leksikal mengharuskan terjemahan eksplisit “menyembah”. “Sujud” mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Mengoyakkan” mempertahankan tindakan perkabungan yang disengaja; “sujud” alami bagi pembaca umum dan menjaga ambiguitas antara postur jasmani dan tindakan penyembahan.
