  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: id
  text: Dalam semua ini, Ayub tidak berbuat dosa dan tidak menuduh Allah berbuat tidak patut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menuduhkan kebodohan kepada Allah” atau “tidak menganggap Allah melakukan kesalahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: Dalam semua ini
  rationale: Gabungan preposisi, kata 'semua', dan kata tunjuk ini merujuk secara menyeluruh pada segala peristiwa yang baru saja dialami Ayub. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan teks sumber.
- source_word: לֹא חָטָא
  choice: tidak berbuat dosa
  rationale: Kata kerja חטא lazim berarti 'berbuat dosa'. Terjemahan langsung ini mempertahankan bobot moral dan keagamaan kata tersebut.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וְלֹא נָתַן תִּפְלָה לֵאלֹהִים
  choice: dan tidak menuduh Allah berbuat tidak patut
  rationale: Secara harfiah נתן berarti 'memberikan', tetapi dalam konstruksi ini maknanya adalah mengenakan atau menisbahkan תִּפְלָה kepada Allah. 'Menuduh Allah berbuat tidak patut' menyampaikan ungkapan itu secara alami tanpa mengurangi bobot moralnya.
- source_word: תִּפְלָה
  choice: berbuat tidak patut
  rationale: Kata ini dapat menunjuk pada kebodohan, ketidakpatutan, atau kesalahan yang tercela. 'Berbuat tidak patut' cukup luas untuk mempertahankan unsur moral-keagamaan tanpa membatasinya hanya pada kekurangan intelektual.
- source_word: לֵאלֹהִים
  choice: Allah
  rationale: Preposisi ל menandai pihak yang kepadanya ketidakpatutan itu dituduhkan; אֱלֹהִים diterjemahkan dengan sebutan baku 'Allah'.
theological_decisions:
- issue: Makna תִּפְלָה ketika dikenakan kepada Allah
  choice: Ayub tidak menuduh Allah berbuat tidak patut
  alternative: Ayub tidak menuduhkan kebodohan kepada Allah; Ayub tidak menganggap Allah melakukan kesalahan
  rationale: Teks menegaskan bahwa dalam penderitaannya Ayub tidak menyalahkan Allah atas sesuatu yang tercela. Pilihan utama mempertahankan bobot moral kata itu, sedangkan catatan kaki menjaga kemungkinan nuansa 'kebodohan' dan 'kesalahan' tanpa menetapkan bahwa kata tersebut hanya memiliki satu arti sempit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat mengikuti alur Ibrani sejauh tetap alami; istilah yang kurang lazim dijelaskan melalui catatan kaki.
