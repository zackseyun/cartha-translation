  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: id
  text: Pada suatu hari, anak-anak lelaki dan anak-anak perempuan Ayub sedang makan dan minum anggur di rumah saudara lelaki mereka yang tertua[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saudara lelaki mereka yang sulung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Pada suatu hari
  rationale: Ungkapan naratif Ibrani ini memperkenalkan sebuah adegan pada satu hari yang tidak ditentukan. “Pada suatu hari” alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu eksplisit seperti “sekarang”.
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: anak-anak lelaki dan anak-anak perempuan Ayub
  rationale: Teks secara eksplisit menyebut putra dan putri. Nama “Ayub” dipakai untuk memperjelas rujukan akhiran pronominal orang ketiga dalam bahasa Indonesia tanpa mengaburkan kedua kelompok tersebut.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: sedang makan dan minum
  rationale: Kedua partisipel menggambarkan tindakan yang tengah berlangsung, sehingga “sedang” mempertahankan aspek adegan itu.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan leksikal langsung dalam konteks minuman; konteks tidak menuntut penggeneralan menjadi sekadar “minuman”.
- source_word: בְּבֵית אֲחִיהֶם
  choice: di rumah saudara lelaki mereka
  rationale: Frasa ini menunjukkan lokasi di rumah saudara mereka. “Saudara lelaki” mempertahankan makna gender yang eksplisit dari אָח dan menghindari kemungkinan pemahaman “saudara” sebagai kerabat secara umum.
- source_word: הַבְּכוֹר
  choice: yang tertua
  rationale: Dalam konteks urutan kelahiran saudara-saudara, “yang tertua” merupakan ungkapan Indonesia yang alami. Makna lebih harfiah, “yang sulung,” dicatat sebagai alternatif.
