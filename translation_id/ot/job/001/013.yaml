  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan penyebutan anak lelaki dan perempuan, aspek tindakan yang sedang berlangsung, serta arti eksplisit “anggur.”
