base_translation:
  language: en
  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Sang Penentang[a], “Dari mana engkau datang?” Sang Penentang menjawab Yahweh dan berkata, “Dari menjelajahi bumi dan berjalan ke sana kemari di bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “ha-satan,” secara harfiah “sang penentang.” Istilah ini memakai kata sandang tertentu dan berfungsi sebagai gelar atau sebutan, bukan dengan pasti sebagai nama diri.'
    reason: Menjelaskan bentuk Ibrani, arti leksikal, dan fungsi definitnya secara akurat tanpa menetapkan pembacaan nama diri.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: הַשָּׂטָן
  choice: Sang Penentang
  rationale: Kata sandang Ibrani menunjukkan sebutan atau peran, bukan dengan pasti nama diri. “Penentang” mempertahankan arti luas שׂטן, sedangkan “Sang” menandai bentuk definit dan pemakaiannya sebagai gelar.
- source_word: מֵאַיִן תָּבֹא
  choice: Dari mana engkau datang?
  rationale: Ungkapan ini menanyakan asal kedatangan; susunan tersebut alami dalam dialog bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: menjawab ... katanya
  rationale: Dua verba pengantar ujaran dipertahankan tanpa menghasilkan konstruksi Indonesia yang terlalu kaku.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: Dari menjelajahi bumi
  rationale: שׁוט menggambarkan bergerak berkeliling atau ke sana kemari. “Menjelajahi” menyampaikan gerak luas di bumi secara alami, tanpa menambahkan gagasan militer seperti “berpatroli”.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: dan berjalan ke sana kemari di atasnya
  rationale: Bentuk hitpael menyiratkan gerak berjalan berulang atau berkeliling. “Ke sana kemari” menyampaikan nuansa itu, sementara “di atasnya” merujuk kembali kepada bumi.
theological_decisions:
- issue: Apakah הַשָּׂטָן diperlakukan sebagai nama diri atau gelar/peran
  choice: 'Gelar/peran: “Sang Penentang”'
  alternative: 'Nama diri: “Satan”; atau transliterasi bergelar: “sang satan”'
  rationale: Adanya kata sandang tertentu הַ dalam bahasa Ibrani lebih mendukung pembacaan sebagai gelar atau fungsi dalam konteks ini. Terjemahan ini tidak memasukkan penggunaan “Satan” sebagai nama diri dari perkembangan pemakaian yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Dialog dibuat alami, sedangkan pengulangan naratif Ibrani tetap cukup terasa. Kapitalisasi “Sang Penentang” menandai pemakaiannya sebagai gelar dalam adegan ini, bukan menetapkannya sebagai nama diri.
