  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: id
  text: Ternaknya berjumlah tujuh ribu ekor domba dan kambing[a], tiga ribu ekor unta, lima ratus pasang lembu, lima ratus ekor keledai betina, dan pelayan yang sangat banyak. Orang itu adalah yang terbesar di antara semua orang dari Timur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ternak kecil”; istilah Ibrani ini dapat mencakup domba dan kambing.
    reason: Menjaga keluasan arti צֹאן, yang tidak selalu terbatas pada domba.
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: ternaknya
  rationale: Kata ini menunjuk pada harta berupa hewan peliharaan; daftar sesudahnya menegaskan arti ternak.
- source_word: צֹאן
  choice: kambing domba
  rationale: Istilah Ibrani ini dapat mencakup domba dan kambing sebagai ternak kecil, sehingga 'kambing domba' mempertahankan cakupan leksikalnya.
- source_word: גְמַלִּים
  choice: unta
  rationale: Padanan langsung dan alami dalam bahasa Indonesia.
- source_word: צֶמֶד בָּקָר
  choice: pasang lembu
  rationale: צֶמֶד berarti sepasang hewan yang dipasangkan untuk bekerja, sedangkan בָּקָר menunjuk pada sapi/lembu; 'pasang lembu' mempertahankan jumlah dan fungsi hewan penarik.
- source_word: אֲתוֹנוֹת
  choice: keledai betina
  rationale: Bentuk Ibraninya secara khusus menyatakan jenis kelamin betina.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: sangat banyak pelayan
  rationale: Dalam konteks kekayaan rumah tangga, frasa ini paling wajar dipahami sebagai tenaga pelayanan atau kumpulan pelayan yang sangat besar, meskipun secara harfiah dapat menunjuk pada pelayanan/pekerjaan yang amat banyak.
- source_word: גָּדוֹל מִכָּל
  choice: yang terbesar di antara semua
  rationale: Konstruksi perbandingan menyatakan bahwa Ayub melampaui semua kelompok yang disebut dalam kekayaan, kedudukan, atau kebesaran.
- source_word: בְּנֵי קֶדֶם
  choice: orang dari Timur
  rationale: Idiom harfiah 'anak-anak Timur' merujuk secara kolektif kepada penduduk wilayah timur; bentuk idiomatis Indonesia lebih jelas tanpa mempersempit rujukannya kepada laki-laki saja.
theological_decisions:
- issue: Makna kebesaran Ayub dalam גָּדוֹל מִכָּל
  choice: yang terbesar di antara semua orang dari Timur
  alternative: lebih besar daripada semua orang dari Timur
  rationale: Superlatif alami dalam bahasa Indonesia menyampaikan daya komparatif konstruksi Ibrani tanpa menetapkan secara sempit apakah kebesaran itu terutama kekayaan, status, atau pengaruh.
- issue: Cakupan בְּנֵי קֶדֶם
  choice: orang dari Timur
  alternative: anak-anak Timur
  rationale: Ungkapan ini merupakan sebutan kolektif geografis. Terjemahan idiomatis menghindari kesan bahwa teks hanya berbicara tentang putra-putra secara harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Satuan hewan dibuat eksplisit dengan 'ekor' dan 'pasang'. Ayat dipecah menjadi tiga kalimat agar daftar panjang dan kesimpulannya mudah dipahami, tanpa mengubah hubungan maknanya.
