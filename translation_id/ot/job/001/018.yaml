  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: id
  text: Sementara orang itu masih berbicara, seorang lain datang dan berkata, “Putra-putrimu sedang makan dan minum anggur di rumah saudara laki-laki mereka yang sulung.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: Sementara orang itu masih berbicara
  rationale: Mempertahankan tindakan yang sedang berlangsung dalam partisipel מְדַבֵּר dan secara alami menunjukkan bahwa utusan berikutnya datang sebelum utusan sebelumnya selesai berbicara.
- source_word: וְזֶה בָּא
  choice: datanglah seorang yang lain
  rationale: Secara harfiah berarti 'dan orang ini datang', tetapi dalam alur narasi menunjuk kepada utusan lain yang datang secara beruntun.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Padanan wajar bagi bentuk naratif yang memperkenalkan perkataan langsung.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: Anak-anakmu laki-laki dan perempuan
  rationale: Menyatakan kedua kelompok yang disebut secara eksplisit dalam bahasa Ibrani, tanpa menggeneralisasikannya hanya sebagai 'anak-anakmu'.
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: sedang makan dan minum anggur
  rationale: Partisipel menggambarkan kegiatan yang sedang berlangsung; terjemahan ini tetap dekat dengan ungkapan Ibrani dan tidak menambahkan penafsiran 'berpesta'.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: di rumah saudara laki-laki mereka yang sulung
  rationale: הַבְּכוֹר menandai urutan kelahiran. 'Yang sulung' akurat, alami, dan mempertahankan nuansa 'firstborn' lebih baik daripada sekadar 'yang tertua'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan inversi 'datanglah seorang yang lain' menjaga gerak naratif tanpa terdengar terlalu arkais. Tidak diperlukan catatan kaki karena terjemahan utama dapat mempertahankan ungkapan harfiah 'makan dan minum anggur' secara alami.
