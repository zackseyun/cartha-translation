id: JOB.1.21
reference: Job 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ עָרֹ֨ם יצתי מִ/בֶּ֣טֶן אִמִּ֗/י וְ/עָרֹם֙ אָשׁ֣וּב שָׁ֔מָ/ה יְהוָ֣ה נָתַ֔ן וַ/יהוָ֖ה לָקָ֑ח יְהִ֛י שֵׁ֥ם יְהוָ֖ה מְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: id
  text: Lalu katanya, “Telanjang aku keluar dari kandungan ibuku, dan telanjang aku akan kembali ke sana.[a] Yahweh[b] telah memberi, dan Yahweh telah mengambil. Kiranya nama Yahweh diberkati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “ke sana” dan membiarkan tujuannya tersirat. Ungkapan ini dapat merujuk secara kiasan kepada kandungan, atau secara lebih luas kepada tanah atau kubur dan keadaan tidak membawa apa-apa.
    reason: alternative_reading
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi, yang secara tradisional diterjemahkan “TUHAN”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: dengan telanjang
  rationale: Menjaga gambaran konkret tentang keadaan tanpa pakaian sekaligus menyiratkan keadaan tanpa harta; pengulangan frasa mempertahankan kesejajaran puitis Ibrani.
- source_word: יצתי
  choice: aku keluar
  rationale: Dalam konteks kandungan, bentuk dari יצא secara alami merujuk pada kelahiran, sementara pilihan ini tetap mempertahankan gambaran harfiah ‘keluar’.
- source_word: מִבֶּטֶן אִמִּי
  choice: dari kandungan ibuku
  rationale: Padanan langsung dan alami dalam bahasa Indonesia modern yang mempertahankan kekonkretan tubuh dalam sumber.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: dan dengan telanjang aku akan kembali ke sana
  rationale: Menerjemahkan שָׁמָה sebagai ‘ke sana’ dan tidak menentukan tujuannya sebagai tanah, kubur, atau kandungan; dengan demikian ambiguitas sumber tetap terpelihara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: נָתַן
  choice: yang memberi
  rationale: Bentuk ini alami dalam pasangan pernyataan ringkas bahasa Indonesia dan menggambarkan Yahweh sebagai pihak yang memberi.
- source_word: לָקָח
  choice: yang mengambil
  rationale: ‘Mengambil’ menerjemahkan arti dasar verba tanpa menambahkan objek yang tidak dinyatakan; dalam konteks ini makna kehilangan tetap jelas.
- source_word: יְהִי
  choice: kiranya ... diberkati
  rationale: ‘Kiranya’ menyampaikan daya jusif berupa harapan atau ucapan berkat.
- source_word: שֵׁם יְהוָה
  choice: nama Yahweh
  rationale: Mempertahankan hubungan konstruksi Ibrani dengan ungkapan Indonesia yang ringkas dan wajar.
- source_word: מְבֹרָךְ
  choice: diberkati
  rationale: Mempertahankan makna pasif ‘diberkati’ dan tidak mengalihkannya secara diam-diam menjadi ‘dipuji’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Acuan שָׁמָה (‘ke sana’)
  choice: mempertahankan ‘ke sana’ tanpa menyebut tujuannya
  alternative: kembali ke tanah, kembali ke kubur, atau kembali ke kandungan ibu secara kiasan
  rationale: Bahasa Ibrani membiarkan acuan ‘sana’ tersirat. Terjemahan tidak boleh memastikan salah satu tafsiran ketika sumber mempertahankan ambiguitas.
- issue: Makna ucapan berkat pada nama Yahweh
  choice: Kiranya nama Yahweh diberkati
  alternative: Terpujilah nama Yahweh
  rationale: Pilihan ini mempertahankan medan makna ברך (‘memberkati’) dan bentuk pasif sumber, meskipun ‘Terpujilah’ lebih lazim dalam ungkapan keagamaan Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ‘Dengan telanjang aku ...’ sengaja mempertahankan penekanan serta kesejajaran puitis sumber. Marker [a] ditempatkan langsung sesudah frasa yang dijelaskannya; marker [b] ditempatkan pada kemunculan pertama nama ilahi.
