  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: id
  text: Lalu Sang Pendakwa menjawab Yahweh, “Apakah Ayub takut kepada Allah tanpa pamrih[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan cuma-cuma” atau “tanpa alasan”. Ungkapan Ibrani ini mempertanyakan apakah takutnya Ayub kepada Allah tidak didorong oleh keuntungan yang ia terima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: menjawab
  rationale: Dalam formula dialog naratif Ibrani, rangkaian harfiah ‘menjawab ... dan berkata’ secara alami dapat dipadatkan menjadi ‘menjawab’ dalam bahasa Indonesia tanpa kehilangan fungsi pengantar ujaran.
- source_word: הַשָּׂטָן
  choice: Sang Pendakwa
  rationale: Artikel Ibrani menunjukkan gelar atau peran, bukan semata-mata nama diri. ‘Sang Pendakwa’ mempertahankan nuansa peran tuduhan dalam adegan ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan tidak menggantinya dengan gelar.
- source_word: הֲחִנָּם
  choice: tanpa pamrih
  rationale: Dalam konteks ini ungkapan tersebut mempertanyakan apakah kesalehan Ayub bebas dari keuntungan yang diharapkan. ‘Tanpa pamrih’ alami dalam bahasa Indonesia dan mempertahankan pokok pertanyaan itu.
- source_word: יָרֵא
  choice: takut kepada
  rationale: Mempertahankan istilah dasar ‘takut’, yang dalam hubungan dengan Allah mencakup rasa gentar dan hormat, tanpa mempersempitnya menjadi sekadar ‘menghormati’.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk אֱלֹהִים ketika merujuk kepada satu-satunya Allah.
theological_decisions:
- issue: Status הַשָּׂטָן yang memakai artikel
  choice: Sang Pendakwa
  alternative: Iblis; sang lawan
  rationale: Terjemahan berbentuk gelar mempertahankan peran tokoh dalam adegan ini dan menghindari penetapan diam-diam bahwa kata tersebut sudah berfungsi sebagai nama diri.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Bentuk ‘Yahweh’ mempertahankan nama pribadi yang terdapat dalam teks sumber.
- issue: Makna pertanyaan הֲחִנָּם
  choice: Apakah Ayub takut kepada Allah tanpa pamrih?
  alternative: Apakah Ayub takut kepada Allah dengan cuma-cuma?; Apakah tanpa alasan Ayub takut kepada Allah?
  rationale: ‘Tanpa pamrih’ menyampaikan tuduhan bahwa kesalehan Ayub mungkin didorong oleh manfaat yang diterimanya, sambil tidak menambahkan jawaban atas pertanyaan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Sang Pendakwa’ digunakan sebagai gelar; konstruksi ganda Ibrani ‘menjawab dan berkata’ dipadatkan agar alami. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
