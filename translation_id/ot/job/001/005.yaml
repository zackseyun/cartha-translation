revisions:
- from: Setiap kali rangkaian hari perjamuan itu berakhir, Ayub menyuruh orang memanggil anak-anaknya untuk menguduskan mereka. Ia bangun pagi-pagi dan mempersembahkan kurban bakaran sebanyak jumlah mereka semua, sebab Ayub berkata, “Mungkin anak-anakku telah berbuat dosa dan mengutuki Allah dalam hati mereka.”[a] Begitulah yang selalu dilakukan Ayub.
  to: Setiap kali rangkaian hari perjamuan itu berakhir, Ayub menyuruh putra-putranya datang dan menguduskan mereka. Ia bangun pagi-pagi dan mempersembahkan kurban bakaran sebanyak jumlah mereka semua, sebab Ayub berkata, “Mungkin putra-putraku telah berbuat dosa dan mengutuki Allah dalam hati mereka.”[a] Begitulah yang selalu dilakukan Ayub.
  rationale: Revisi menghapus penambahan “orang” dalam tindakan mengutus/memanggil, sambil memakai konstruksi Indonesia yang alami. Rujukan בָנַי diperjelas sebagai “putra-putraku” sesuai bentuk Ibrani dan konteks dekat. Unsur-unsur lain serta catatan eufemisme dipertahankan.
