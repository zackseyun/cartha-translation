  naturalness: Bahasa draf umumnya baku dan mengalir. “Menyuruh mereka datang” merupakan cara Indonesia yang alami untuk menyampaikan tindakan mengutus/memanggil tanpa menambahkan seorang perantara yang tidak dinyatakan.
  terminology: “Menguduskan,” “kurban bakaran,” dan “Allah” tepat bagi register naratif-ritual ini. Catatan tentang bentuk harfiah “memberkati Allah” dan fungsi eufemistisnya diperlukan serta ditempatkan pada klausa yang relevan.
