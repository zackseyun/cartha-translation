  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: id
  text: Setiap kali rangkaian hari perjamuan itu berakhir, Ayub menyuruh putra-putranya datang dan menguduskan mereka. Ia bangun pagi-pagi dan mempersembahkan kurban bakaran sebanyak jumlah mereka semua, sebab Ayub berkata, “Mungkin putra-putraku telah berbuat dosa dan mengutuki Allah dalam hati mereka.”[a] Begitulah yang selalu dilakukan Ayub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “memberkati Allah”; dalam konteks ini kata tersebut dipakai sebagai ungkapan halus untuk “mengutuki Allah.”
    reason: Menjelaskan eufemisme Ibrani yang jika diterjemahkan secara harfiah tidak sesuai dengan kekhawatiran Ayub tentang kemungkinan dosa.
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: rangkaian hari perjamuan itu berakhir
  rationale: Ungkapan ini secara harfiah menggambarkan hari-hari perjamuan yang telah berkeliling atau menyelesaikan putarannya. Terjemahan ini menyampaikan selesainya satu rangkaian perjamuan tanpa menambahkan pola waktu yang tidak dinyatakan.
- source_word: וַיְקַדְּשֵׁם
  choice: untuk menguduskan mereka
  rationale: Mempertahankan istilah ritual 'menguduskan' dan tidak mempersempitnya menjadi sekadar membersihkan atau memurnikan, sebab tindakan persis yang dilakukan terhadap anak-anak itu tidak dijelaskan.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Istilah ini menunjuk kurban yang seluruhnya dinaikkan atau dibakar di atas mezbah; 'kurban bakaran' adalah padanan Indonesia yang lazim dan jelas.
- source_word: בָנַי
  choice: anak-anakku
  rationale: Dalam konteks keluarga Ayub, bentuk ini dapat merujuk kepada anak-anaknya; pilihan netral ini juga selaras dengan jumlah kurban bagi 'mereka semua' dan tidak secara tidak perlu mengecualikan putri-putrinya.
- source_word: כָּכָה יַעֲשֶׂה אִיּוֹב כָּל הַיָּמִים
  choice: Begitulah yang selalu dilakukan Ayub
  rationale: Bentuk verba menyatakan kebiasaan berulang, sedangkan 'sepanjang hari-hari' secara idiomatis berarti terus-menerus atau senantiasa.
theological_decisions:
- issue: Makna וּבֵרֲכוּ אֱלֹהִים dalam konteks kemungkinan dosa
  choice: mengutuki Allah
  alternative: memberkati Allah
  rationale: Walaupun bentuk leksikalnya berarti 'memberkati', konteks dosa yang dikhawatirkan Ayub menunjukkan pemakaian eufemistis untuk 'mengutuki'. Catatan kaki mempertahankan transparansi terhadap bentuk Ibraninya.
- issue: Cakupan tindakan pengudusan dan kurban Ayub
  choice: Tidak menjelaskan mekanisme pengudusan atau dampak kurban melampaui teks
  alternative: Menafsirkan tindakan Ayub sebagai pengampunan otomatis bagi dosa anak-anaknya
  rationale: Ayat menyatakan tindakan pencegahan atau perantaraan Ayub berdasarkan kemungkinan dosa, tetapi tidak menguraikan tata caranya maupun memastikan bahwa anak-anak itu benar-benar berdosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Setiap kali' serta bentuk verba berikutnya menampilkan kebiasaan yang berulang. 'Menyuruh orang memanggil' membuat konstruksi Ibrani 'mengutus' dapat dipahami secara alami tanpa menentukan siapa utusannya. Penanda catatan kaki [a] ditempatkan langsung sesudah klausa yang dijelaskannya.
