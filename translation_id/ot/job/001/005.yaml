    rationale: Kata Ibrani berarti “putra-putraku,” dan konteks langsung (1:4) menyebut putra-putra Ayub sebagai penyelenggara perjamuan. “Putra-putraku” menyampaikan rujukan teks tanpa menggabungkan putri-putrinya ke dalam subjek yang dinyatakan.
