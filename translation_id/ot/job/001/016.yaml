  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: id
  text: Sementara orang itu masih berbicara, datanglah orang lain dan berkata, “Api Allah jatuh dari langit dan membakar di antara kawanan domba dan orang-orang muda itu, lalu menghanguskan mereka. Hanya aku seorang diri yang lolos untuk memberitahukan kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: Api Allah
  rationale: Mempertahankan ungkapan Ibrani secara langsung tanpa menafsirkan apakah yang dimaksud adalah kilat, api adikodrati, atau sebutan intensif bagi api yang sangat dahsyat.
- source_word: וַתִּבְעַר בַּצֹּאן וּבַנְּעָרִים
  choice: menyambar kawanan domba dan para pelayan
  rationale: Kata בּער menyatakan api yang berkobar atau membakar; 'menyambar' alami bagi api yang turun dari langit. נְעָרִים dalam konteks rumah tangga Ayub menunjuk para pelayan, bukan sekadar laki-laki muda.
- source_word: וַתֹּאכְלֵם
  choice: lalu menghanguskan mereka
  rationale: Secara harfiah api 'memakan' mereka; 'menghanguskan' menyampaikan idiom kehancuran oleh api dalam bahasa Indonesia alami.
- source_word: וָאִמָּלְטָה רַק־אֲנִי לְבַדִּי
  choice: Hanya aku seorang diri yang lolos
  rationale: Menjaga penegasan berlapis רַק, אֲנִי, dan לְבַדִּי tentang satu-satunya penyintas.
theological_decisions:
- issue: Sifat dan asal 'Api Allah'
  choice: Ungkapan 'Api Allah' dipertahankan tanpa penjelasan tambahan.
  alternative: Kilat; api yang sangat dahsyat; api yang dikirim Allah.
  rationale: Teks laporan utusan menggunakan konstruksi אֵשׁ אֱלֹהִים, tetapi tidak menjelaskan fenomena atau kausalitasnya; terjemahan tidak boleh menyelesaikan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Inversi 'datanglah orang lain' memberi alur cerita yang dignified tanpa terdengar kuno. 'Para pelayan' dipilih berdasarkan konteks, sedangkan 'orang-orang muda' akan mudah disalahpahami sebagai keterangan usia semata.
