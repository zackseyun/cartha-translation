id: JOB.1.19
reference: Job 1:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: id
  text: Lihatlah[a], angin besar datang dari seberang padang gurun dan menghantam keempat sudut rumah itu. Rumah itu pun roboh menimpa orang-orang muda itu[b], sehingga mereka tewas. Hanya aku yang berhasil meloloskan diri untuk memberitahukannya kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sesungguhnya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang muda itu.” Istilah Ibrani ini juga dapat berarti “para pemuda” atau, dalam konteks tertentu, “para pelayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tiba-tiba
  rationale: Dalam laporan bencana yang memuncak ini, ungkapan tersebut menandai kemunculan peristiwa secara mendadak dan hidup. Pilihan ini alami dalam bahasa Indonesia modern tanpa memakai bentuk arkais seperti 'sesungguhnya'.
- source_word: רוּחַ גְּדוֹלָה
  choice: angin besar
  rationale: רוּחַ di sini menunjuk pada angin, bukan roh atau napas. 'Angin besar' mempertahankan susunan dan kadar deskripsi Ibrani tanpa mempersempitnya menjadi jenis badai tertentu.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: datang dari seberang padang gurun
  rationale: מֵעֵבֶר menyatakan asal dari sisi lain atau seberang; terjemahan ini mempertahankan arah geografis tanpa menambah rincian.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: menghantam keempat sudut rumah itu
  rationale: נגע dapat berarti menyentuh, mencapai, atau menghantam. Akibat yang merusak mendukung 'menghantam', sedangkan 'keempat sudut' mengikuti ungkapan sumber.
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: Rumah itu pun roboh menimpa orang-orang muda itu
  rationale: Subjek verba tunggal adalah rumah tersebut. Mengulang 'rumah itu' menghindari ambiguitas rujukan dalam bahasa Indonesia; 'roboh menimpa' menyampaikan jatuhnya bangunan secara alami.
- source_word: הַנְּעָרִים
  choice: orang-orang muda
  rationale: Istilah Ibrani dapat menunjuk kepada para pemuda atau, menurut konteks, para pelayan. Pilihan ini mempertahankan arti dasarnya dan tidak memaksakan identitas mereka.
- source_word: וַיָּמֻתוּ
  choice: sehingga mereka tewas
  rationale: '''Tewas'' alami untuk kematian akibat bencana. ''Sehingga'' menjelaskan hubungan akibat yang sudah tersirat dalam urutan klausa Ibrani tanpa menambahkan penyebab baru.'
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Hanya aku yang berhasil meloloskan diri
  rationale: '''Hanya aku'' membawa penekanan ganda רַק ... לְבַדִּי secara idiomatis, dan ''meloloskan diri'' menyatakan keselamatan dari bahaya.'
- source_word: לְהַגִּיד לָךְ
  choice: untuk memberitahukannya kepadamu
  rationale: Terjemahan ini alami dalam formula laporan utusan; akhiran '-nya' merujuk pada kejadian yang baru dilaporkan.
theological_decisions:
- issue: Identitas הַנְּעָרִים
  choice: orang-orang muda
  alternative: para pelayan / anak-anak muda
  rationale: Teks memakai nomina maskulin jamak yang memiliki rentang makna 'orang muda, pemuda, pelayan'. Terjemahan utama tidak menyelaraskannya secara diam-diam dengan semua anak Ayub ataupun menetapkannya sebagai para pelayan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat panjang Ibrani dibagi agar alur bencana mudah dipahami. Penanda [a] dan [b] ditempatkan pada unsur yang diterangkan; catatan [b] mengikuti klausa kematian tetapi menerangkan sebutan 'orang-orang muda' dalam kalimat sebelumnya.
