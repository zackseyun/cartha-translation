  terminology: '"Angin besar," "padang gurun," "keempat sudut," and "orang-orang muda" are appropriate. The latter preserves the lexical ambiguity of הַנְּעָרִים; the footnote should be anchored directly to that expression, not to the subsequent death clause.'
