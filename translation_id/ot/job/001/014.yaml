  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: id
  text: Lalu seorang utusan datang kepada Ayub dan berkata, “Sapi-sapi sedang membajak, dan keledai-keledai[a] sedang merumput di dekat sapi-sapi itu,”
  philosophy: optimal-equivalence
