    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: Lalu seorang pembawa pesan
  rationale: Dalam konteks ini מַלְאָךְ menunjuk kepada manusia yang membawa laporan, bukan malaikat. Kata penghubung וּ diterjemahkan secara alami sebagai “Lalu” untuk melanjutkan alur cerita.
- source_word: בָּא אֶל אִיּוֹב
  choice: datang kepada Ayub
  rationale: Ungkapan ini menyatakan gerak menuju Ayub; “datang kepada Ayub” alami dalam narasi bahasa Indonesia.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Bentuk ini melanjutkan rangkaian peristiwa dan memperkenalkan perkataan langsung.
- source_word: הַבָּקָר
  choice: Sapi-sapi
  rationale: בָּקָר berarti ternak sapi. Konteks membajak menunjukkan bahwa sapi-sapi itu merupakan hewan pekerja, tetapi bahasa Indonesia tidak perlu mempersempitnya menjadi “lembu jantan” karena bentuk Ibraninya tidak menyatakan jenis kelamin.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: sedang membajak
  rationale: Konstruksi partisipial menyatakan tindakan yang sedang berlangsung pada saat laporan itu terjadi.
- source_word: וְהָאֲתֹנוֹת
  choice: dan keledai-keledai[a]
  rationale: אֲתֹנוֹת secara khusus berarti keledai betina. Teks utama memakai istilah umum yang lebih lancar, sedangkan rincian jenis kelamin dipertahankan dalam catatan kaki.
- source_word: רֹעוֹת
  choice: sedang merumput
  rationale: Kata רעה dalam konteks hewan yang makan di padang paling alami diterjemahkan “merumput”.
- source_word: עַל יְדֵיהֶם
  choice: di dekatnya
  rationale: Ungkapan idiomatis ini menunjukkan kedekatan tempat, yakni keledai-keledai merumput di dekat sapi-sapi yang sedang membajak.
