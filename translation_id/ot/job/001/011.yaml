  yaml_path: translation/ot/job/001/011.yaml
  text: But stretch out your hand[a], please, and touch all that he has, and he will surely curse you to your face.
translation:
  language: id
  text: Namun, ulurkanlah tangan-Mu, kiranya, dan jamahlah segala miliknya; ia pasti akan mengutuk-Mu[a] di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “memberkati-Mu.” Dalam prolog kitab Ayub, kata ini lazim dipahami sebagai ungkapan halus untuk “mengutuk-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Menandai sanggahan yang tegas terhadap perkataan sebelumnya dengan bentuk yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: שְׁלַח נָא יָדְךָ
  choice: ulurkanlah tangan-Mu
  rationale: Mempertahankan gambaran Ibrani tentang tangan sebagai kuasa yang bertindak. Partikel נָא tercermin dalam bentuk ajakan atau tantangan halus melalui akhiran -lah.
- source_word: וְגַע
  choice: dan jamahlah
  rationale: נגע pada dasarnya berarti 'menyentuh/menjamah'; dalam konteks ini sentuhan itu jelas dimaksudkan untuk mendatangkan kerugian, tetapi terjemahan mempertahankan citra sumber tanpa mempertegasnya menjadi 'pukul'.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Ungkapan ringkas dan alami yang mencakup seluruh kepunyaan Ayub.
- source_word: אִם לֹא
  choice: pasti akan
  rationale: Dalam konstruksi penegasan bernuansa sumpah ini, frasa tersebut menyatakan keyakinan kuat, bukan syarat biasa.
- source_word: עַל פָּנֶיךָ
  choice: terang-terangan
  rationale: Menyampaikan makna idiomatis tindakan langsung dan terbuka 'di hadapan wajah-Mu' dalam bahasa Indonesia alami.
- source_word: יְבָרֲכֶךָּ
  choice: mengutuk-Mu
  rationale: Walaupun bentuk leksikalnya biasanya berarti 'memberkati-Mu', konteks prolog Ayub menunjukkan pemakaian eufemistis untuk 'mengutuk-Mu'; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pemakaian eufemistis ברך dalam prolog Ayub
  choice: Menerjemahkan יְבָרֲכֶךָּ sebagai 'mengutuk-Mu' dalam teks utama
  alternative: memberkati-Mu
  rationale: Tuduhan si penuduh ialah bahwa Ayub akan berbalik melawan Allah apabila kepunyaannya disentuh. 'Mengutuk' menyampaikan maksud kontekstual, sedangkan arti leksikal harfiahnya dipertahankan dalam catatan kaki agar ketegangan bahasa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Huruf kapital pada pronomina -Mu mengikuti rujukan kepada Allah. Tanda seru mempertahankan daya tantangan tegas dalam ucapan tersebut.
