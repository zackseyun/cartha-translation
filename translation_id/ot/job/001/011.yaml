  naturalness: Bahasa draf umumnya baku dan alami. ‘Ulurkanlah tangan-Mu, kiranya’ merupakan cara formal yang masih dapat dipahami untuk menyatakan nuansa permohonan נָא tanpa menambahkan penafsir seperti ‘aku mohon’. ‘Di hadapan-Mu’ alami dalam register kitab suci modern dan lebih dekat kepada idiom sumber daripada ‘terang-terangan’.
  terminology: Kapitalisasi pronomina ilahi konsisten. ‘Menjamah’ mempertahankan citra leksikal נגע, sedangkan ‘mengutuk-Mu’ dan catatan kaki secara tepat menyampaikan eufemisme ברך tanpa menghilangkan bentuk harfiahnya.
