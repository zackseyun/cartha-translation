  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: id
  text: Sesudah itu, Ayub hidup seratus empat puluh tahun dan melihat anak-anak lelakinya serta cucu-cucu lelakinya hingga empat generasi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ia melihat anak-anak lelakinya dan anak-anak lelaki dari anak-anak lelakinya, empat generasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup
  rationale: Bentuk naratif dari חיה menyatakan bahwa Ayub terus hidup setelah peristiwa-peristiwa sebelumnya. Kata “hidup” langsung, wajar, dan tidak menambahkan makna yang tidak dinyatakan.
- source_word: אַחֲרֵי זֹאת
  choice: Sesudah itu
  rationale: Ungkapan ini menunjukkan waktu setelah peristiwa-peristiwa yang baru diceritakan. “Sesudah itu” alami dalam bahasa Indonesia dan setia pada hubungan waktunya.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: seratus empat puluh tahun
  rationale: Ini merupakan padanan langsung dan lazim bagi bilangan dalam teks Ibrani.
- source_word: וירא
  choice: Ia melihat
  rationale: Kata kerja ראה secara langsung berarti “melihat”. Terjemahan ini mempertahankan bentuk sederhana teks Ibrani tanpa mengeksplisitkan makna idiomatis “hidup hingga menyaksikan”.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk Ibrani adalah jamak maskulin “anak-anak lelakinya”, bukan istilah umum bagi semua anak.
- source_word: בְּנֵי בָנָיו
  choice: cucu-cucunya
  rationale: Secara harfiah frasa ini berarti “anak-anak lelaki dari anak-anak lelakinya”. “Cucu-cucunya” menyampaikan hubungan kekerabatan itu secara alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: sampai empat generasi
  rationale: Ungkapan ini menunjukkan jangkauan generasi keturunan yang sempat dilihat Ayub. Kata “sampai” membuat hubungan tersebut jelas dan alami tanpa menentukan secara berlebihan cara menghitung generasinya.
