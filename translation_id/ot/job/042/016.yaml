translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dibaca. Istilah “anak-anak lelakinya” mempertahankan acuan maskulin sumber, sedangkan “cucu-cucunya” dipilih sebagai ungkapan kekerabatan yang alami.
