reference: Job 42:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה בֵּרַ֛ךְ אֶת אַחֲרִ֥ית אִיּ֖וֹב מֵ/רֵאשִׁת֑/וֹ וַֽ/יְהִי ל֡/וֹ אַרְבָּעָה֩ עָשָׂ֨ר אֶ֜לֶף צֹ֗אן וְ/שֵׁ֤שֶׁת אֲלָפִים֙ גְּמַלִּ֔ים וְ/אֶֽלֶף צֶ֥מֶד בָּקָ֖ר וְ/אֶ֥לֶף אֲתוֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: id
  text: Yahweh memberkati masa akhir hidup Ayub lebih daripada masa awalnya.[a] Ayub memiliki empat belas ribu ekor kambing domba, enam ribu ekor unta, seribu pasang lembu,[b] dan seribu ekor keledai betina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bagian akhir Ayub lebih daripada permulaannya.”'
    reason: Menjelaskan bentuk ringkas ungkapan Ibrani dan kontras antara keadaan Ayub pada masa akhir dan masa awal.
  - marker: b
    text: Dapat juga diterjemahkan “seribu kuk lembu” atau “seribu regu lembu.” Setiap pasang terdiri atas dua ekor lembu pekerja.
    reason: Menjelaskan bahwa צֶמֶד adalah satuan berupa pasangan hewan yang dipasangkan untuk bekerja.
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: בֵּרַךְ
  choice: memberkati
  rationale: Kata kerja ברך secara langsung menyatakan tindakan berkat ilahi; konteks menunjukkan berkat itu terwujud dalam pemulihan kemakmuran.
- source_word: אַחֲרִית אִיּוֹב
  choice: masa akhir hidup Ayub
  rationale: אַחֲרִית menunjuk pada bagian atau keadaan yang kemudian dalam hidup Ayub. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasinya hanya pada hari-hari terakhirnya.
- source_word: מֵרֵאשִׁתוֹ
  choice: lebih daripada masa awalnya
  rationale: Preposisi מִן menandai perbandingan antara keadaan Ayub pada masa kemudian dan pada masa awal hidupnya.
- source_word: וַיְהִי לוֹ
  choice: Ayub memiliki
  rationale: Konstruksi eksistensial Ibrani secara harfiah berarti “ada padanya”; “Ayub memiliki” merupakan padanan Indonesia yang wajar.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: empat belas ribu ekor kambing domba
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing. “Kambing domba” mempertahankan cakupan leksikalnya tanpa menyempitkannya menjadi domba saja.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: enam ribu ekor unta
  rationale: Padanan langsung dan alami untuk frasa bilangan serta nomina tersebut.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: seribu pasang lembu
  rationale: צֶמֶד berarti sepasang hewan yang dipasangkan untuk bekerja; בָּקָר merujuk pada lembu atau sapi. “Pasang lembu” menjaga satuan hitung yang dinyatakan teks.
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: seribu ekor keledai betina
  rationale: אֲתוֹנוֹת secara khusus berbentuk feminin dan berarti keledai-keledai betina; rincian ini dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan fungsi nama tersebut dan tidak mengubahnya menjadi gelar.
- issue: Sifat perbandingan berkat pada masa akhir dan awal Ayub
  choice: lebih daripada masa awalnya
  alternative: setelah masa awalnya
  rationale: מִן dalam susunan ini paling wajar menyatakan perbandingan. Terjemahan mempertahankan klaim bahwa berkat pada masa kemudian lebih besar, bukan sekadar berlangsung sesudah masa awal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sedangkan nama ilahi, perbandingan berkat, cakupan צֹאן, satuan pasangan lembu, dan jenis kelamin keledai dipertahankan sesuai teks Ibrani.
