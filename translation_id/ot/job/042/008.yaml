  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: id
  text: Maka sekarang, ambillah bagi kalian tujuh ekor sapi jantan dan tujuh ekor domba jantan, lalu pergilah kepada hamba-Ku Ayub dan persembahkanlah kurban bakaran bagi diri kalian. Hamba-Ku Ayub akan berdoa bagi kalian, sebab Aku akan berkenan kepadanya[a], agar Aku tidak melakukan terhadap kalian suatu tindakan yang memalukan[b]. Sebab kalian tidak berkata benar kepada-Ku[c] seperti hamba-Ku Ayub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebab hanya wajahnya akan Kuangkat,” sebuah ungkapan Ibrani yang berarti “Aku akan menerimanya” atau “Aku akan menunjukkan perkenanan kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “agar Aku tidak memperlakukan kalian menurut kebebalan kalian.” Kata Ibrani ini dapat menunjuk kebebalan, atau tindakan yang memalukan dan keji.
    reason: lexical_alternative
  - marker: c
    text: Atau, “kalian tidak berkata benar tentang Aku.” Bahasa Ibraninya secara harfiah dapat dipahami sebagai “kepada-Ku,” sedangkan konteks juga memungkinkan arti “tentang Aku.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Karena itu
  rationale: Gabungan waw dan עַתָּה di sini menandai peralihan menuju tindakan yang harus dilakukan sebagai konsekuensi teguran sebelumnya. 'Karena itu' lebih alami daripada temporal harfiah 'sekarang' dalam konteks ini.
- source_word: קְחוּ לָכֶם
  choice: ambillah bagi kalian
  rationale: Imperatif dengan datif לָכֶם menyatakan bahwa hewan-hewan itu harus diambil atau disediakan untuk kepentingan mereka sendiri dalam ritus yang diperintahkan.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: tujuh ekor sapi jantan dan tujuh ekor domba jantan
  rationale: פָרִים menunjuk sapi jantan dan אֵילִים menunjuk domba jantan dewasa. Kata penggolong 'ekor' membuat susunan alami dalam bahasa Indonesia.
- source_word: עַבְדִּי אִיּוֹב
  choice: hamba-Ku Ayub
  rationale: Dalam konteks ini עֶבֶד merupakan sebutan terhormat bagi orang yang setia melayani Allah, bukan penekanan pada status perbudakan.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: persembahkanlah kurban bakaran
  rationale: Bentuk Hifil dari עלה bersama עוֹלָה adalah ungkapan kurban baku bagi persembahan yang dibakar seluruhnya.
- source_word: בַּעַדְכֶם
  choice: bagi diri kalian
  rationale: Preposisi ini menyatakan kepentingan atau perwakilan dalam konteks kurban; pilihan ini mempertahankan bahwa kurban dipersembahkan demi mereka.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: akan berdoa bagi kalian
  rationale: Ungkapan ini menyatakan doa syafaat Ayub demi sahabat-sahabatnya tanpa perlu menambahkan kategori teologis yang tidak dinyatakan teks.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: sebab Aku akan berkenan kepadanya
  rationale: Ungkapan harfiah 'mengangkat wajah' berarti menerima atau menunjukkan perkenanan. 'Berkenan kepadanya' alami dan tetap memperlihatkan penerimaan Allah terhadap Ayub sebagai pendoa.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: sehingga Aku tidak memperlakukan kalian menurut kebebalan kalian
  rationale: נְבָלָה dapat berarti kebebalan maupun tindakan memalukan atau keji. Dalam konteks penghakiman, rumusan ini mengaitkan perlakuan yang terancam dengan kebebalan mereka tanpa menyiratkan bahwa Allah bertindak tercela.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: kalian tidak berkata benar kepada-Ku
  rationale: אֵלַי secara paling langsung berarti 'kepada-Ku'. Ambiguitas kontekstual dengan arti 'tentang Aku' dipertahankan melalui catatan kaki.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: seperti hamba-Ku Ayub
  rationale: Perbandingan Ibrani bersifat eliptis; bahasa Indonesia dapat mempertahankan elipsis ini secara alami dan tidak perlu menentukan rincian semua ucapan Ayub yang dimaksud.
theological_decisions:
- issue: Penerimaan Ayub dan peran doanya
  choice: Allah berkenan kepada Ayub, dan doa Ayub menjadi sarana agar hukuman terhadap para sahabat tidak dijalankan.
  alternative: Ungkapan tersebut hanya menyatakan perkenanan pribadi Allah kepada Ayub tanpa menonjolkan fungsi perantaraannya.
  rationale: Urutan perintah membawa kurban, doa Ayub, dan pernyataan bahwa Allah akan mengangkat wajah Ayub memperlihatkan fungsi perantaraan, tanpa memasukkan gagasan imamat atau teori pendamaian yang tidak disebutkan.
- issue: Makna נְבָלָה dalam tindakan Allah terhadap para sahabat
  choice: Allah tidak memperlakukan mereka menurut kebebalan mereka.
  alternative: Allah tidak melakukan sesuatu yang memalukan atau keji terhadap mereka.
  rationale: Pilihan utama menampilkan logika penghukuman dan menghindari kesan bahwa teks menuduhkan tindakan bermoral tercela kepada Allah, sedangkan rentang leksikal alternatif dicatat secara terbuka.
- issue: Arah ujaran dalam אֵלַי
  choice: '''kepada-Ku'' dipakai dalam teks utama.'
  alternative: '''tentang Aku'' atau ''mengenai Aku''.'
  rationale: Preposisi אֶל dengan sufiks orang pertama secara formal menunjuk arah 'kepada-Ku', tetapi konteks percakapan tentang Allah memungkinkan pengertian 'tentang Aku'; ketegangan itu tidak diselesaikan diam-diam dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina ilahi memakai kapitalisasi konvensional. 'Kurban bakaran' dipilih sebagai istilah ritual yang jelas; 'kalian' mempertahankan bentuk jamak orang kedua. Semua ambiguitas penting diberi catatan kaki tanpa membebani teks utama.
