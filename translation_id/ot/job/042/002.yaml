  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ידעת כִּי כֹ֣ל תּוּכָ֑ל וְ/לֹא יִבָּצֵ֖ר מִמְּ/ךָ֣ מְזִמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/002.yaml
  text: I know that you can do all things[a], and no purpose of yours can be thwarted.
translation:
  language: id
  text: Aku tahu bahwa Engkau sanggup melakukan segala sesuatu, dan tidak ada rencana-Mu yang dapat digagalkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan tidak ada maksud-Mu yang dapat dihalangi.” Kata benda Ibrani dapat berarti “rencana” atau “maksud”, dan kata kerjanya dapat mengandung arti ditahan, dicegah, atau digagalkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Aku tahu
  rationale: Bentuk perfektif Ibrani dalam pengakuan Ayub paling alami dipahami sebagai keadaan pengetahuan yang kini ia akui; bahasa Indonesia memakai bentuk tanpa penanda waktu.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi pengakuan Ayub secara alami dalam bahasa Indonesia.
- source_word: כֹל תּוּכָל
  choice: Engkau sanggup melakukan segala sesuatu
  rationale: יכל menyatakan kemampuan atau kuasa, sedangkan כֹל memberi cakupan menyeluruh. Kata 'melakukan' melengkapi ungkapan secara idiomatis tanpa mempersempit maknanya.
- source_word: וְלֹא יִבָּצֵר
  choice: dan tidak ada ... yang dapat digagalkan
  rationale: Dalam konstruksi ini bentuk Nifal dari בצר menyatakan bahwa sesuatu tidak dapat dicegah, ditahan, atau dibuat tidak terlaksana.
- source_word: מִמְּךָ
  choice: rencana-Mu
  rationale: Relasi dengan Allah dinyatakan secara alami sebagai kepunyaan melalui akhiran '-Mu', bukan secara harfiah dan kaku sebagai 'dari-Mu'.
- source_word: מְזִמָּה
  choice: rencana
  rationale: Nomina ini dapat berarti rencana, maksud, atau rancangan. 'Rencana' jelas dan netral dalam konteks tindakan Allah, sambil mempertahankan unsur kesengajaan.
theological_decisions:
- issue: Pernyataan tentang kemampuan Allah dan tidak tergagalkannya kehendak-Nya
  choice: Engkau sanggup melakukan segala sesuatu, dan tidak ada rencana-Mu yang dapat digagalkan.
  alternative: Engkau mampu melakukan segala sesuatu, dan tidak ada maksud-Mu yang dapat dihalangi.
  rationale: Terjemahan ini menegaskan keluasan kemampuan Allah dan bahwa rencana-Nya tidak dapat dicegah, tanpa menambahkan rumusan teologis yang melampaui teks. Ambiguitas מְזִמָּה antara 'rencana' dan 'maksud', serta rentang makna verba antara 'digagalkan' dan 'dihalangi', dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ilahi 'Engkau' dan akhiran '-Mu'. Susunan kalimat dibuat lugas, khidmat, dan mudah dipahami; penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
