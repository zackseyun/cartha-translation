revisions:
- from: Kemudian, semua saudara laki-laki dan saudara perempuannya serta semua orang yang dahulu mengenalnya datang menemuinya. Mereka makan bersama dengannya di rumahnya.[a] Mereka menunjukkan rasa iba kepadanya dan menghiburnya karena segala malapetaka yang telah didatangkan Yahweh atas dirinya. Masing-masing memberi dia satu kesita[b] dan satu cincin emas.[c]
  to: Kemudian semua saudara laki-lakinya, semua saudara perempuannya, serta semua orang yang dahulu mengenalnya datang menemuinya. Mereka makan bersama dengannya di rumahnya.[a] Mereka menyatakan simpati kepadanya dan menghiburnya karena segala malapetaka yang telah didatangkan Yahweh menimpa dia. Masing-masing memberi dia satu kesita[b] dan satu cincin emas.[c]
