  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: id
  text: Kemudian semua saudara laki-lakinya, semua saudara perempuannya, serta semua orang yang dahulu mengenalnya datang menemuinya. Mereka makan bersama dengannya di rumahnya.[a] Mereka menyatakan simpati kepadanya dan menghiburnya karena segala malapetaka yang telah didatangkan Yahweh menimpa dia. Masing-masing memberi dia satu kesita[b] dan satu cincin emas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “makan roti bersamanya”, sebuah ungkapan umum untuk makan bersama.
    reason: cultural_note
  - marker: b
    text: Kesita adalah benda atau satuan nilai pada zaman dahulu; nilai tepatnya tidak diketahui.
    reason: cultural_note
  - marker: c
    text: Kata Ibrani ini dapat menunjuk pada cincin yang dikenakan di hidung atau di telinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֵלָיו
  choice: datang menemuinya
  rationale: Mengungkapkan gerak menuju Ayub secara alami dalam narasi Indonesia.
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: semua saudara laki-laki dan saudara perempuannya
  rationale: Mempertahankan penyebutan terpisah dan pengulangan cakupan 'semua' dalam bentuk Indonesia yang jelas.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: serta semua orang yang dahulu mengenalnya
  rationale: יֹדְעָיו menunjuk kepada orang-orang yang mengenal Ayub, sedangkan לְפָנִים memberi kontras waktu 'dahulu'.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם
  choice: Mereka makan bersama dengannya
  rationale: Ungkapan harfiah 'makan roti' merupakan idiom untuk makan bersama; terjemahan ini menyampaikan makna persekutuan jamuan secara alami.
- source_word: בְּבֵיתוֹ
  choice: di rumahnya
  rationale: Padanan langsung dan wajar untuk lokasi jamuan.
- source_word: וַיָּנֻדוּ לוֹ
  choice: Mereka menunjukkan rasa iba kepadanya
  rationale: Dalam konteks ini נוד menyatakan simpati atau keprihatinan terhadap orang yang menderita, bukan ejekan.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: menghiburnya
  rationale: Padanan lazim bagi נחם dalam konteks menghibur seseorang yang mengalami penderitaan.
- source_word: עַל כָּל הָרָעָה
  choice: karena segala malapetaka
  rationale: רָעָה di sini menunjuk pada bencana atau kemalangan yang dialami, bukan kejahatan moral.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: yang telah didatangkan Yahweh atas dirinya
  rationale: Mempertahankan ungkapan kausatif eksplisit dalam bahasa Ibrani dan tidak memperlunak peranan ilahi menjadi sekadar izin.
- source_word: קְשִׂיטָה אֶחָת
  choice: satu kesita
  rationale: Kesita adalah benda atau satuan nilai kuno yang nilai tepatnya tidak diketahui; transliterasi menjaga kekhususan istilah sumber.
- source_word: נֶזֶם זָהָב אֶחָד
  choice: satu cincin emas
  rationale: נֶזֶם adalah perhiasan berbentuk cincin yang dapat dikenakan pada hidung atau telinga; istilah umum dipakai dalam teks dan ambiguitas dijelaskan dalam catatan.
theological_decisions:
- issue: Peranan ilahi dalam penderitaan Ayub
  choice: yang telah didatangkan Yahweh atas dirinya
  alternative: yang telah Yahweh izinkan menimpa dirinya
  rationale: Teks Ibrani secara eksplisit memakai bentuk kausatif הֵבִיא, 'mendatangkan'. Terjemahan mempertahankan ketegangan teologis itu tanpa mengubahnya menjadi sekadar izin ilahi.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri ilahi ditampilkan sebagai 'Yahweh' agar perbedaan antara nama יהוה dan gelar ilahi tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan pengulangan penting, ketidakpastian istilah budaya kuno, atau atribusi langsung malapetaka kepada Yahweh.
