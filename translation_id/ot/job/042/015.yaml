base_translation:
  language: en
  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: id
  text: Di seluruh negeri[a] tidak ditemukan perempuan yang secantik anak-anak perempuan Ayub. Ayah mereka pun memberi mereka warisan bersama saudara-saudara laki-laki mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di seluruh bumi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְצָא
  choice: tidak ditemukan
  rationale: Bentuk pasif מצא menyatakan bahwa tidak ada yang didapati; bentuk pasif ini alami dalam bahasa Indonesia dan mempertahankan susunan gagasan Ibrani.
- source_word: נָשִׁים יָפוֹת
  choice: perempuan yang secantik
  rationale: נָשִׁים berarti 'perempuan', sedangkan יָפוֹת berarti 'cantik'. Bersama prefiks perbandingan כ pada frasa berikutnya, bentuk 'secantik' menyampaikan perbandingan secara alami.
- source_word: כִּבְנוֹת אִיּוֹב
  choice: anak-anak perempuan Ayub
  rationale: Prefiks כ menandai perbandingan, yang sudah tercakup dalam 'secantik'; בנות איוב secara khusus berarti anak-anak perempuan Ayub.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh negeri
  rationale: הָאָרֶץ dapat berarti 'negeri' atau 'bumi'. Dalam konteks naratif ini, 'negeri' menyampaikan cakupan wilayah tanpa memaksakan pengertian global modern.
- source_word: וַיִּתֵּן לָהֶם
  choice: memberikan ... kepada mereka
  rationale: Terjemahan langsung dan alami dari נתן dengan akhiran objek tak langsung feminin jamak.
- source_word: נַחֲלָה
  choice: warisan
  rationale: נַחֲלָה menunjuk pada warisan atau milik pusaka; 'warisan' merupakan padanan Indonesia yang ringkas dan jelas.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: di antara saudara-saudara laki-laki mereka
  rationale: בְּתוֹךְ berarti 'di tengah/di antara', dan אֲחֵיהֶם secara khusus menunjuk pada saudara laki-laki mereka. Terjemahan ini mempertahankan rincian sosial bahwa para anak perempuan menerima warisan di antara ahli waris laki-laki.
theological_decisions:
- issue: Istilah kekerabatan yang khusus gender
  choice: di antara saudara-saudara laki-laki mereka
  alternative: di antara saudara-saudara mereka
  rationale: Teks Ibrani memakai bentuk maskulin jamak yang secara khusus berarti 'saudara laki-laki'. Kekhususan gender dipertahankan dan tidak dinetralkan.
- issue: Cakupan הָאָרֶץ
  choice: di seluruh negeri
  alternative: di seluruh bumi
  rationale: Kata tersebut dapat berarti 'negeri' atau 'bumi'. 'Negeri' lebih sesuai dengan ungkapan naratif dalam konteks ini, sementara kemungkinan 'bumi' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Partikel “pun” menyampaikan kesinambungan וַ secara alami. Penanda catatan kaki ditempatkan langsung sesudah frasa ambigu “di seluruh negeri”.
