  source_fidelity: 'Makna pokok diterjemahkan dengan setia: tidak ada perempuan yang sebanding kecantikannya dengan anak-anak perempuan Ayub, dan sang ayah memberi mereka warisan bersama para saudara laki-laki mereka. Pilihan “negeri” untuk הָאָרֶץ sah dan alternatif “bumi” telah dicatat. Istilah אֲחֵיהֶם dipertahankan secara khusus sebagai “saudara-saudara laki-laki mereka.”'
