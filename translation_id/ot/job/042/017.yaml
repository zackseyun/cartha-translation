  text: And Job died[a], old and full of days.
translation:
  language: id
  text: Lalu Ayub meninggal dalam usia tua dan kenyang akan hari-hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kenyang akan hari-hari.” Ini adalah idiom Ibrani untuk masa hidup yang panjang dan genap.'
