lexical_decisions:
- source_word: וַיָּמָת
  choice: Lalu ... meninggal
  rationale: Bentuk wayyiqtol dari מוּת melanjutkan urutan peristiwa dalam narasi. “Lalu” menyatakan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Nama diri ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: זָקֵן
  choice: dalam usia tua
  rationale: Adjektiva זָקֵן berarti tua atau lanjut usia. Dalam berita kematian, “meninggal dalam usia tua” terdengar alami dan tetap dekat dengan makna sumber.
- source_word: וּשְׂבַע יָמִים
  choice: setelah menjalani hidup yang panjang
  rationale: Secara harfiah ungkapan ini berarti “kenyang akan hari-hari” dan merupakan idiom bagi umur yang panjang serta lengkap. Pilihan ini menyampaikan maksud idiom secara jelas, sedangkan citra Ibraninya dipertahankan dalam catatan kaki.
