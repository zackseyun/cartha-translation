id: JOB.42.3
reference: Job 42:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֤י זֶ֨ה מַעְלִ֥ים עֵצָ֗ה בְּֽלִ֫י דָ֥עַת לָ/כֵ֣ן הִ֭גַּדְתִּי וְ/לֹ֣א אָבִ֑ין נִפְלָא֥וֹת מִ֝מֶּ֗/נִּי וְ/לֹ֣א אֵדָֽע׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: id
  text: “Siapakah ini yang menyembunyikan rencana tanpa pengetahuan?” Karena itu, aku telah berbicara, tetapi aku tidak mengerti—hal-hal yang terlalu ajaib bagiku[b], yang tidak kuketahui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan yang lebih tradisional, “Siapakah ini yang menggelapkan rencana tanpa pengetahuan?” Kata-kata Ayub di sini berbeda dalam bahasa Ibrani dari Ayub 38:2.
    reason: lexical_alternative
  - marker: b
    text: Atau “hal-hal yang melampaui diriku” atau “keajaiban-keajaiban yang melampaui diriku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Siapakah ini
  rationale: Mempertahankan bentuk pertanyaan langsung dan nada kutipan dari teguran Allah.
- source_word: מַעְלִים
  choice: menyembunyikan
  rationale: Bentuk Hifil dari עלם berarti membuat tersembunyi atau menyembunyikan; pilihan ini mengikuti kata Ibrani dalam 42:3 dan tidak menyamakannya dengan חשך dalam 38:2.
- source_word: עֵצָה
  choice: rencana
  rationale: Dalam konteks hikmat dan maksud ilahi, 'rencana' alami bagi pembaca Indonesia dan mencakup gagasan pertimbangan atau rancangan.
- source_word: בְּלִי דָעַת
  choice: tanpa pengetahuan
  rationale: Padanan langsung yang mempertahankan kaitan dengan pengakuan ketidaktahuan Ayub.
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai hubungan kesimpulan antara teguran yang dikutip dan pengakuan Ayub.
- source_word: הִגַּדְתִּי
  choice: aku telah berbicara
  rationale: Mengungkapkan pengakuan Ayub tentang ucapannya terdahulu tanpa memberi kesan deklarasi resmi yang terlalu kuat.
- source_word: וְלֹא אָבִין
  choice: tetapi aku tidak mengerti
  rationale: Kata sambung 'tetapi' menyatakan pertentangan kontekstual antara berbicara dan tidak memahami, sedangkan bentuk verba dipahami sebagai lampau dalam pengakuan ini.
- source_word: נִפְלָאוֹת
  choice: hal-hal yang terlalu ajaib
  rationale: Menangkap arti perkara-perkara menakjubkan yang melampaui kemampuan Ayub untuk memahaminya.
- source_word: מִמֶּנִּי
  choice: bagiku
  rationale: Bersama 'terlalu ajaib', bentuk ini menyampaikan idiom bahwa perkara-perkara itu melampaui kapasitas Ayub; alternatif yang lebih eksplisit dicatat.
- source_word: וְלֹא אֵדָע
  choice: yang tidak kuketahui
  rationale: Relatif 'yang' mempertautkan klausa terakhir secara alami dengan 'hal-hal' tanpa mengubah maknanya.
theological_decisions:
- issue: Hubungan Ayub 42:3 dengan teguran ilahi dalam Ayub 38:2
  choice: Mengikuti kata yang terdapat dalam 42:3, yaitu 'menyembunyikan rencana'.
  alternative: menggelapkan rencana tanpa pengetahuan
  rationale: Ayub mengutip atau menyesuaikan teguran sebelumnya, tetapi teks Ibrani 42:3 memakai עלם, bukan חשך seperti dalam 38:2. Terjemahan tidak mengharmoniskan perbedaan leksikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'aku' sesuai dengan ujaran langsung Ayub. Tanda pisah mempertahankan jeda dan penjelasan dalam pengakuannya. Semua penanda catatan kaki muncul dalam teks utama; urutannya dibuat [b] pada frasa terkait lalu [a] pada akhir ayat agar catatan tradisional tentang keseluruhan kutipan tidak memutus kalimat pembuka.
