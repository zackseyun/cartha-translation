base_translation:
  language: en
  yaml_path: translation/ot/job/042/010.yaml
  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: id
  text: Lalu Yahweh memulihkan keadaan Ayub[a] ketika ia berdoa bagi sahabat-sahabatnya,[b] dan Yahweh memberikan kepada Ayub dua kali lipat dari segala miliknya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memulihkan nasib Ayub.” Ungkapan Ibrani ini berarti memulihkan keadaan seseorang dan tidak harus mengacu pada pembebasan dari penawanan harfiah.
    reason: lexical_alternative
  - marker: b
    text: Atau “demi sahabat-sahabatnya.” Bentuk Ibraninya secara tata bahasa berbunyi “sahabatnya,” tetapi konteksnya menunjuk kepada para sahabat Ayub.
    reason: lexical_alternative
  - marker: c
    text: Atau “menambahkan kepada Ayub segala miliknya, menjadi dua kali lipat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang secara langsung diwakili oleh tetragramaton Ibrani.
- source_word: שָׁב אֶת שבית
  choice: memulihkan keadaan
  rationale: Ungkapan Ibrani ini menunjuk pada pembalikan atau pemulihan keadaan seseorang; dalam konteks Ayub, ungkapan itu tidak harus berarti pembebasan dari penawanan harfiah.
- source_word: בְּהִתְפַּלְלוֹ
  choice: ketika ia berdoa
  rationale: Preposisi ב dengan infinitif konstruk paling wajar menyatakan keadaan waktu di sini tanpa secara eksplisit menjadikan doa Ayub sebagai penyebab mekanis pemulihannya.
- source_word: בְּעַד רֵעֵהוּ
  choice: bagi sahabat-sahabatnya
  rationale: בְּעַד menyatakan doa syafaat untuk atau demi seseorang, sedangkan sahabat-sahabat sesuai dengan kelompok rekan Ayub dalam konteks dekat.
- source_word: וַיֹּסֶף ... לְמִשְׁנֶה
  choice: memberikan ... dua kali lipat
  rationale: Secara harfiah gagasannya ialah Yahweh menambahkan milik Ayub hingga menjadi dua kali lipat; susunan ini menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: אֶת כָּל אֲשֶׁר לְאִיּוֹב
  choice: dari segala yang dimilikinya sebelumnya
  rationale: Frasa tersebut mencakup seluruh milik Ayub; kata 'sebelumnya' memperjelas tolok ukur pelipatgandaan berdasarkan konteks kehilangan dan pemulihan.
theological_decisions:
- issue: Hubungan antara doa Ayub dan pemulihan keadaannya
  choice: 'Hubungan waktu: ''ketika ia berdoa'''
  alternative: '''karena ia berdoa'' atau ''sementara ia berdoa'''
  rationale: Konstruksi Ibrani menghubungkan doa syafaat Ayub dengan pemulihannya, tetapi tidak mengharuskan terjemahan yang menegaskan hubungan sebab-akibat.
- issue: Makna pemulihan Ayub
  choice: Keadaannya dipulihkan dan miliknya diberikan dua kali lipat
  alternative: Ayub dibebaskan dari penawanan harfiah
  rationale: Konteks kitab ini mendukung pembalikan nasib atau keadaan Ayub, bukan penawanan historis secara harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Nama 'Yahweh' dipertahankan; ungkapan idiomatis Ibrani dijelaskan dalam catatan kaki tanpa membebani teks utama.
