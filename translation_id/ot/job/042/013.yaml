  text: He also had seven sons and three daughters.
translation:
  language: id
  text: Ia juga mempunyai tujuh anak laki-laki dan tiga anak perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ia juga mempunyai
  rationale: Ungkapan Ibrani harfiah 'ada baginya' menyatakan kepemilikan. 'Ia mempunyai' menyampaikannya secara alami dalam bahasa Indonesia, sedangkan 'juga' menandai kelanjutan dari pemulihan yang diceritakan pada ayat sebelumnya.
- source_word: שִׁבְעָנָה
  choice: tujuh
  rationale: Bilangan pokok ini secara langsung berarti 'tujuh'.
- source_word: בָנִים
  choice: anak laki-laki
  rationale: Kata Ibrani ini secara khusus menunjuk kepada anak-anak berjenis kelamin laki-laki; pilihan ini mempertahankan ketepatan gender dalam bahasa Indonesia modern.
- source_word: וְשָׁלוֹשׁ
  choice: dan tiga
  rationale: Gabungan kata penghubung dan bilangan pokok diterjemahkan secara langsung dan alami.
- source_word: בָּנוֹת
  choice: anak perempuan
  rationale: Kata Ibrani ini secara khusus menunjuk kepada anak-anak berjenis kelamin perempuan; 'anak perempuan' merupakan padanan alami dan tepat dalam konteks keluarga.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Pronomina 'Ia' dipakai untuk Ayub sesuai konteks, dan pasangan 'anak laki-laki' serta 'anak perempuan' menjaga kesejajaran serta kejelasan.
