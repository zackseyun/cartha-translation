  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: id
  text: Lalu Ayub menjawab kepada Yahweh dan berkata:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”, nama ilahi yang secara tradisional diterjemahkan “TUHAN”; bentuk transliterasi lain adalah “Yehuwa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam rumus percakapan naratif ini, ענה berarti ‘menjawab’ atau ‘menanggapi’. ‘Menjawab’ mempertahankan bentuk dialog, sekalipun tidak ada pertanyaan langsung tepat sebelumnya.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Bentuk baku nama אִיּוֹב dalam bahasa Indonesia.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: אֶת menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memerlukan padanan kata tersendiri dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar, serta mempertahankan bentuk yang dipakai dalam teks sumber.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Padanan transparan bagi rumus lanjutan naratif Ibrani; bentuk ini juga memperkenalkan perkataan langsung pada ayat berikutnya.
- source_word: וַ
  choice: Lalu
  rationale: Waw konsekutif awal melanjutkan urutan narasi. ‘Lalu’ alami dalam bahasa Indonesia modern dan tetap menyatakan kesinambungan peristiwa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi, sedangkan ‘TUHAN’ merupakan penggantian tradisional dengan gelar dan ‘Yehuwa’ adalah bentuk alternatif yang dikenal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumus ganda ‘menjawab ... dan berkata’ dipertahankan karena mencerminkan struktur naratif Ibrani dan menghubungkan ayat ini dengan perkataan langsung berikutnya.
