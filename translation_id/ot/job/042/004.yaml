  text: Hear[a], please, and I will speak; I will ask you[b], and you declare to me.
translation:
  language: id
  text: Dengarlah[a], aku mohon, dan aku akan berbicara; aku akan menanyai-Mu, dan beritahukanlah kepadaku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini Ayub menggemakan hampir kata demi kata ucapan TUHAN sebelumnya dalam Ayub 38:3 dan 40:7.
    reason: cross_reference
  - marker: b
    text: Dapat juga diterjemahkan, “dan nyatakanlah kepadaku”; secara harfiah, “dan buatlah aku mengetahui.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk imperatif dari שׁמע. “Dengarlah” mempertahankan perintah langsung dan gema formal dari perkataan TUHAN sebelumnya.
- source_word: נָא
  choice: kiranya
  rationale: Partikel permohonan atau kesantunan. “Kiranya” sesuai dengan ragam bahasa yang bermartabat dan tidak memberi arti temporal seperti “sekarang”.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: dan aku akan berbicara
  rationale: Mempertahankan konjungsi, penegasan pronomina orang pertama, dan bentuk verba tanpa menambahkan hubungan logis yang tidak dinyatakan.
- source_word: אֶשְׁאָלְךָ
  choice: aku akan bertanya kepada-Mu
  rationale: Makna dasar verba שאל dengan sufiks orang kedua tunggal maskulin ialah bertanya kepada seseorang. Huruf kapital pada “-Mu” mengikuti kebiasaan bahasa Indonesia untuk sapaan kepada Allah.
- source_word: וְהוֹדִיעֵנִי
  choice: dan beritahukanlah kepadaku
  rationale: Imperatif Hifil dari ידע dengan sufiks orang pertama tunggal secara harfiah berarti menyebabkan aku mengetahui. “Beritahukanlah kepadaku” menyampaikan daya kausatif itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan ayat ini dengan Ayub 38:3 dan 40:7
  choice: Menerjemahkan ucapan Ayub secara langsung sebagai gema perkataan TUHAN sebelumnya, tanpa menambahkan “Engkau telah berfirman” atau tanda kutip dalam teks utama.
  alternative: Menambahkan pengantar seperti “Engkau telah berfirman” atau menandainya secara eksplisit sebagai kutipan.
  rationale: Bahasa Ibrani tidak memuat pengantar kutipan. Hubungan antarteks dapat dijelaskan dalam catatan kaki tanpa menambahkan kata pada teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel serta bentuk perintah dipertahankan. Kata “kiranya” dipilih untuk kesantunan yang khidmat, sedangkan “beritahukanlah” tetap alami bagi pembaca masa kini.
