  text: וַ/יִּקְרָ֤א שֵׁם הָֽ/אַחַת֙ יְמִימָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית קְצִיעָ֑ה וְ/שֵׁ֥ם הַ/שְּׁלִישִׁ֖ית קֶ֥רֶן הַפּֽוּךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/014.yaml
  text: He named the first Jemimah[a], the second Keziah, and the third Keren-happuch.
translation:
  language: id
  text: Yang pertama diberinya nama Yemima, yang kedua Kezia, dan yang ketiga Keren-Hapukh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Keren-Hapukh mungkin berarti “tanduk antimon” atau “tanduk celak mata”, yakni wadah kosmetik atau bahan pewarna mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: diberinya nama
  rationale: Ungkapan Ibrani harfiah ‘ia menyebut nama’ secara idiomatis menyatakan tindakan memberi nama. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan subjek laki-laki tunggal dari konteks, yaitu Ayub.
- source_word: הָאַחַת
  choice: yang pertama
  rationale: Dalam rangkaian penyebutan tiga perempuan, bentuk feminin ‘yang satu’ berfungsi sebagai urutan dan paling wajar diterjemahkan ‘yang pertama’.
- source_word: יְמִימָה
  choice: Yemima
  rationale: Nama pribadi ditransliterasikan menurut bunyi Ibrani dan ejaan Indonesia, bukan diterjemahkan.
- source_word: הַשֵּׁנִית
  choice: yang kedua
  rationale: Padanan langsung dan alami bagi bentuk ordinal feminin dalam urutan nama.
- source_word: קְצִיעָה
  choice: Kezia
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia; bunyi awal Ibraninya diwakili dengan k.
- source_word: הַשְּׁלִישִׁית
  choice: yang ketiga
  rationale: Padanan langsung dan alami bagi bentuk ordinal feminin dalam urutan nama.
- source_word: קֶרֶן הַפּוּךְ
  choice: Keren-Hapukh
  rationale: Nama majemuk ini ditransliterasikan, dengan tanda hubung untuk mencerminkan kedua unsurnya. Akhiran ‘kh’ mewakili konsonan Ibrani akhir dan membedakannya dari bunyi k biasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan ‘diberinya nama’ mempertahankan nuansa tindakan penamaan sambil menghindari ungkapan harfiah yang kaku. Penanda catatan ditempatkan sesudah nama Keren-Hapukh karena catatan menjelaskan arti nama tersebut.
