  text: עַל כֵּ֭ן אֶמְאַ֣ס וְ/נִחַ֑מְתִּי עַל עָפָ֥ר וָ/אֵֽפֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/042/006.yaml
  text: Therefore I despise myself[a], and I repent in dust and ashes.
translation:
  language: id
  text: Karena itu, aku memandang hina diriku sendiri[a] dan bertobat dalam debu dan abu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu, aku menarik kembali perkataanku dan berubah sikap mengenai debu dan abu.” Bahasa Ibraninya ringkas dan diperdebatkan, khususnya mengenai objek tersirat dari kata “menolak/memandang hina” serta nuansa kata yang dapat berarti “bertobat,” “menyesal,” “berubah sikap,” atau “mendapat penghiburan.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Frasa ini menyatakan kesimpulan Ayub berdasarkan firman Allah sebelumnya dan pengakuannya dalam ayat 5. “Karena itu” alami dalam bahasa Indonesia modern dan mempertahankan hubungan sebab-akibatnya.
- source_word: אֶמְאַס
  choice: aku memandang hina diriku sendiri
  rationale: Kata kerja מאס berarti “menolak” atau “memandang hina.” Teks Ibrani tidak menyebutkan objeknya; “diriku sendiri” ditambahkan agar kalimat Indonesia lengkap dan untuk mencerminkan pembacaan kontekstual bahwa Ayub merendahkan dirinya setelah berjumpa dengan Allah. Karena objek tersirat itu diperdebatkan, kemungkinan “aku menarik kembali perkataanku” dicantumkan dalam catatan kaki.
- source_word: וְנִחַמְתִּי
  choice: dan bertobat
  rationale: Dalam bentuk Nifal, נחם dapat berarti menyesal, berubah sikap, bertobat, atau mendapat penghiburan, bergantung pada konteks. Di sini respons Ayub terhadap penyataan Allah dan ungkapan “debu dan abu” mendukung bahasa pertobatan, tanpa menghapus kemungkinan makna lain yang dicatat dalam catatan kaki.
- source_word: עַל
  choice: dalam
  rationale: Kata depan ini secara harfiah dapat berarti “di atas,” “mengenai,” atau “terhadap.” Dalam ungkapan tentang debu dan abu, “dalam” paling alami untuk menyatakan keadaan atau sikap perkabungan dan perendahan diri Ayub.
- source_word: עָפָר וָאֵפֶר
  choice: debu dan abu
  rationale: Pasangan kata ini merupakan ungkapan tetap yang berkaitan dengan kefanaan, perendahan diri, dan perkabungan. “Debu dan abu” mempertahankan bentuk ringkas dan gaya khidmat sumber.
theological_decisions:
- issue: Apakah respons terakhir Ayub menyatakan penghinaan diri dan pertobatan atau penarikan kembali perkaranya
  choice: 'Ayub merendahkan dirinya dan bertobat: “aku memandang hina diriku sendiri dan bertobat dalam debu dan abu.”'
  alternative: Ayub menarik kembali perkataan atau perkaranya dan berubah sikap mengenai debu dan abu.
  rationale: 'Bahasa Ibraninya sangat ringkas: objek אֶמְאַס tidak dinyatakan, sedangkan נִחַמְתִּי memiliki beberapa kemungkinan arti. Konteks langsung, khususnya perjumpaan Ayub dengan Allah dalam ayat 5, mendukung pembacaan sebagai perendahan diri dan pertobatan. Namun, karena pembacaan sebagai penarikan kembali perkataan atau perkara tetap mungkin secara leksikal dan gramatikal, alternatif tersebut dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Ungkapan “memandang hina” dipilih daripada “membenci” agar makna penolakan atau perendahan tetap terasa tanpa memberi kesan kebencian emosional yang terlalu sempit. Catatan kaki mempertahankan ambiguitas asli dan ketegangan tafsir.
