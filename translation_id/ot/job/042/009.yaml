  text: וַ/יֵּלְכוּ֩ אֱלִיפַ֨ז הַ/תֵּֽימָנִ֜י וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֗י צֹפַר֙ הַ/נַּ֣עֲמָתִ֔י וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם יְהוָ֑ה וַ/יִּשָּׂ֥א יְהוָ֖ה אֶת פְּנֵ֥י אִיּֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: id
  text: Lalu Elifas, orang Teman, Bildad, orang Suah, dan Zofar, orang Naama, pergi dan melakukan seperti yang telah difirmankan Yahweh kepada mereka. Yahweh pun berkenan kepada Ayub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Yahweh mengangkat wajah Ayub,” sebuah ungkapan Ibrani yang berarti bahwa Ia menunjukkan perkenanan kepada atau menerima Ayub.'
    reason: Menjaga gambaran idiom asli sekaligus menjelaskan maknanya dalam konteks.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan rangkaian cerita secara sederhana; “pergi” alami dalam bahasa Indonesia dan tidak menambahkan gagasan tentang keberangkatan permanen.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: orang Teman / orang Suah / orang Naama
  rationale: Ketiga bentuk ini adalah gentilisia yang menunjukkan asal tempat atau kelompok. Pola “orang + nama” merupakan bentuk Indonesia yang alami dan tetap mempertahankan nama-nama diri tersebut.
- source_word: וַיַּעֲשׂוּ
  choice: melakukan
  rationale: Kata עשה dalam konstruksi כַּאֲשֶׁר menyatakan bahwa mereka bertindak sesuai dengan firman sebelumnya. “Melakukan seperti” mempertahankan keluasan makna tanpa merinci tindakan melebihi teks.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם
  choice: seperti yang telah difirmankan ... kepada mereka
  rationale: Ungkapan ini merujuk kembali pada perkataan Yahweh sebelumnya. “Telah difirmankan” menandai urutan waktunya dan memakai diksi Indonesia yang wajar untuk perkataan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיִּשָּׂא יְהוָה אֶת פְּנֵי אִיּוֹב
  choice: Yahweh pun berkenan kepada Ayub
  rationale: Ungkapan נשׂא פנים secara idiomatis berarti menerima dengan baik atau menunjukkan perkenanan. “Berkenan kepada Ayub” menyampaikan sikap ilahi yang positif tanpa mempersempitnya hanya pada penerimaan doa Ayub; gambaran harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna perkenanan ilahi terhadap Ayub
  choice: Yahweh pun berkenan kepada Ayub
  alternative: Yahweh menerima Ayub; Yahweh mengangkat wajah Ayub
  rationale: Idiom Ibrani menunjukkan penerimaan atau perkenanan terhadap Ayub dalam konteks tindakannya sebagai perantara. Terjemahan ini tidak menambahkan penjelasan doktrinal bahwa hanya doa atau persembahannya yang diterima, dan bentuk harfiah tetap tersedia dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama asal ketiga sahabat dinyatakan dengan pola alami “orang Teman/Suah/Naama”. Partikel “pun” menandai hasil naratif tanpa menambah hubungan sebab-akibat yang tidak dinyatakan.
