    text: 'Atau: “kalian tidak berbicara kepada-Ku dengan benar, seperti hamba-Ku Ayub.” Kata depan Ibrani secara harfiah berarti “kepada-Ku”, tetapi dalam konteks ini mungkin berarti “tentang Aku” atau “mengenai Aku”.'
    reason: lexical_alternative
