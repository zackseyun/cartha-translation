  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: id
  text: Setelah Yahweh mengucapkan kata-kata ini kepada Ayub, Yahweh berfirman kepada Elifas, orang Teman itu, “Murka-Ku menyala terhadap engkau dan kedua sahabatmu, sebab kalian tidak berbicara dengan benar tentang Aku, seperti hamba-Ku Ayub.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר
  choice: Setelah
  rationale: Dalam narasi Indonesia modern, pembuka ini secara alami menyatakan urutan waktu tanpa ungkapan kaku seperti 'terjadilah setelah'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani dan membedakannya dari gelar 'Tuhan'.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: menyampaikan perkataan-perkataan ini
  rationale: Mengungkapkan tindakan berbicara beserta isi yang disampaikan secara wajar dalam bahasa Indonesia, sambil mempertahankan unsur 'perkataan-perkataan ini'.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: Elifas, orang Teman itu
  rationale: Bentuk nisbah הַתֵּימָנִי diterjemahkan secara alami sebagai orang yang berasal dari Teman.
- source_word: חָרָה אַפִּי
  choice: Murka-Ku menyala
  rationale: Mempertahankan metafora Ibrani tentang murka yang menyala dan tetap terdengar luhur serta jelas.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: terhadap engkau dan kedua sahabatmu
  rationale: Preposisi menunjukkan sasaran murka; 'engkau' membedakan sapaan tunggal kepada Elifas dari 'kalian' pada klausa berikutnya.
- source_word: לֹא דִבַּרְתֶּם ... נְכוֹנָה
  choice: kalian tidak mengatakan yang benar
  rationale: Bentuk orang kedua jamak mencakup Elifas dan kedua sahabatnya; 'yang benar' mempertahankan cakupan makna kebenaran, ketepatan, dan kepatutan.
- source_word: אֵלַי
  choice: tentang Aku
  rationale: Walaupun secara bentuk berarti 'kepada-Ku', konteks paling mungkin menilai perkataan mereka mengenai Allah; ambiguitas asli dicatat dalam catatan kaki.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: seperti hamba-Ku Ayub
  rationale: Mempertahankan sebutan ilahi yang penting bagi Ayub dan perbandingan langsung dengan perkataan para sahabat.
theological_decisions:
- issue: Apakah אֵלַי berarti 'tentang Aku' atau secara harfiah 'kepada-Ku'
  choice: tentang Aku
  alternative: kepada-Ku
  rationale: Konteks dialog mendukung penilaian atas isi perkataan para sahabat mengenai Allah, tetapi preposisi Ibrani secara harfiah dapat dipahami sebagai 'kepada-Ku'; karena itu alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Cakupan makna נְכוֹנָה
  choice: yang benar
  alternative: dengan tepat
  rationale: Pilihan ini tidak mempersempit penilaian Allah hanya pada ketepatan faktual atau ketulusan moral, melainkan mempertahankan keluasan makna sesuatu yang benar, tepat, atau patut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai untuk sasaran tunggal, sedangkan 'kalian' memperjelas bahwa teguran mencakup Elifas dan kedua sahabatnya. Metafora 'Murka-Ku menyala' dipertahankan dari bahasa Ibrani.
