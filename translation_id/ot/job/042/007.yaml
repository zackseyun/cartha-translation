  to: Setelah Yahweh mengucapkan kata-kata ini kepada Ayub, Yahweh berfirman kepada Elifas, orang Teman itu, “Murka-Ku menyala terhadap engkau dan kedua sahabatmu, sebab kalian tidak berbicara dengan benar tentang Aku, seperti hamba-Ku Ayub.”
  rationale: Revisi terbatas pada kelancaran bahasa dan ketepatan bentuk verbal. «Mengucapkan kata-kata ini» menggantikan ungkapan yang berlebihan, sementara «berbicara dengan benar tentang Aku» mempertahankan keluasan נְכוֹנָה tanpa menyempitkannya menjadi sekadar ketepatan faktual. Catatan kaki tetap melestarikan kemungkinan pembacaan harfiah «kepada-Ku».
