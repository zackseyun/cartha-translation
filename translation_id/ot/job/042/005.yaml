  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: id
  text: Dulu aku mendengar tentang Engkau dari kabar orang[a], tetapi sekarang mataku telah melihat Engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui pendengaran telinga”; atau “dari apa yang didengar telinga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: dari apa yang didengar telinga
  rationale: Ungkapan ini mempertahankan gambaran Ibrani tentang pendengaran melalui telinga sekaligus tetap wajar dalam bahasa Indonesia. Ungkapan tersebut mendukung kontras antara pengetahuan melalui laporan dan pengalaman langsung.
- source_word: שְׁמַעְתִּיךָ
  choice: aku mendengar tentang Engkau
  rationale: Walaupun bentuk Ibraninya secara harfiah dapat diterjemahkan 'aku mendengar Engkau', konteksnya menunjuk pada pengetahuan sebelumnya mengenai Allah melalui apa yang didengar. 'Mendengar tentang Engkau' menyampaikan makna itu tanpa menyatakan bahwa Ayub mendengar suara Allah secara langsung.
- source_word: וְעַתָּה
  choice: tetapi sekarang
  rationale: Kata penghubung bersama 'sekarang' menandai kontras kuat antara keadaan sebelumnya dan pengalaman Ayub kini. 'Tetapi sekarang' mengungkapkan daya pertentangan itu secara alami.
- source_word: עֵינִי
  choice: mataku
  rationale: Bentuk tunggal dalam bahasa Ibrani dipertahankan untuk menjaga ungkapan puitis dan sifat pribadi pengakuan Ayub.
- source_word: רָאָתְךָ
  choice: telah melihat Engkau
  rationale: Bentuk perfektif menyatakan kenyataan yang sudah terjadi dan tetap bermakna pada saat Ayub berbicara. 'Telah melihat' mempertahankan aspek tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat tindakan Ayub 'melihat' Allah
  choice: telah melihat Engkau
  alternative: telah memahami Engkau; telah berjumpa langsung dengan Engkau
  rationale: Kata kerja Ibrani untuk 'melihat' diterjemahkan secara langsung tanpa menentukan apakah penglihatan itu harfiah, metaforis, atau bentuk perjumpaan tertentu. Dengan demikian, kontras antara mendengar dan melihat serta ketegangan teologis mengenai keterlihatan Allah tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Sebelumnya' memperjelas kontras waktu yang tersirat oleh 'sekarang' tanpa menambah klaim teologis. Huruf kapital pada kata ganti yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
