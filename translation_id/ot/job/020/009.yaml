  text: The eye that saw him will not see him again[a], and his place will no longer see him.
translation:
  language: id
  text: Mata yang pernah melihatnya tidak akan melihatnya lagi[a], dan tempatnya tidak akan lagi memandangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mata yang menatapnya tidak akan menatapnya lagi.” Kata “mata” berbentuk tunggal secara puitis, dan pada baris kedua “tempatnya” diperlakukan seolah-olah dapat melihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Mata
  rationale: Mempertahankan bentuk tunggal yang puitis dan gambaran hidup dalam teks Ibrani, tanpa menghaluskannya menjadi “tidak seorang pun”.
- source_word: שְׁזָפַתּוּ
  choice: yang pernah melihatnya
  rationale: Verba ini berarti melihat atau menatap. “Melihatnya” alami dalam bahasa Indonesia, sedangkan “pernah” menegaskan bahwa penglihatan itu terjadi dahulu sebelum ketiadaannya.
- source_word: וְלֹא תוֹסִיף
  choice: tidak akan melihatnya lagi
  rationale: Dalam konteks ini, יסף dengan negasi menyatakan bahwa tindakan tersebut tidak akan terjadi lagi. Objek dan verba diulang secara wajar dalam bahasa Indonesia agar maknanya jelas.
- source_word: וְלֹא עוֹד
  choice: tidak akan lagi
  rationale: Ungkapan ini menyatakan berhentinya keadaan secara tuntas dan membentuk kesejajaran dengan baris pertama.
- source_word: תְּשׁוּרֶנּוּ
  choice: memandangnya
  rationale: שׁור berarti melihat atau memandang. “Memandangnya” mempertahankan nuansa puitis dan membedakannya secara halus dari verba pada baris pertama.
- source_word: מְקוֹמוֹ
  choice: tempatnya
  rationale: Terjemahan harfiah ini mempertahankan personifikasi tempat yang tidak lagi melihat orang tersebut.
