  text: מֵשִׁ֣יב יָ֭גָע וְ/לֹ֣א יִבְלָ֑ע כְּ/חֵ֥יל תְּ֝מוּרָת֗/וֹ וְ/לֹ֣א יַעֲלֹֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/018.yaml
  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: id
  text: Ia mengembalikan hasil jerih payahnya dan tidak menelannya; sebanding dengan kekayaan yang diperolehnya dari pertukaran[a], ia tidak bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia mengembalikan jerih payahnya dan tidak menghabiskannya; mengenai kekayaan yang diperoleh melalui pertukaran, ia tidak bersorak girang.” Baris kedua dalam bahasa Ibrani sangat padat dan dapat diterjemahkan dengan beberapa cara yang maknanya berdekatan.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵשִׁיב
  choice: mengembalikan
  rationale: Bentuk partisip Hifil dari שׁוב berarti menyebabkan sesuatu kembali. ‘Mengembalikan’ menyatakan bahwa orang fasik harus menyerahkan kembali apa yang diperolehnya.
- source_word: יָגָע
  choice: hasil jerih payahnya
  rationale: Kata ini dapat menunjuk pada jerih payah itu sendiri atau hasil yang diperoleh melalui jerih payah. Sebagai objek ‘mengembalikan’, makna hasil kerja paling sesuai dengan konteks.
- source_word: וְלֹא יִבְלָע
  choice: dan tidak menelannya
  rationale: בלע secara konkret berarti ‘menelan’. Ungkapan ini mempertahankan gambaran hidup bahwa keuntungan itu tidak sempat dikonsumsi atau dikuasainya.
- source_word: כְּחֵיל
  choice: sebanding dengan kekayaan
  rationale: חֵיל di sini paling wajar berarti kekayaan atau harta. Prefiks כ dapat menyatakan perbandingan atau kadar; ‘sebanding dengan’ mempertahankan nuansa tersebut tanpa menghapus kepadatan ungkapan Ibrani.
- source_word: תְּמוּרָתוֹ
  choice: yang diperolehnya dari pertukaran
  rationale: תְּמוּרָה dapat berarti pertukaran, imbalan, atau sesuatu yang diperoleh sebagai hasil pertukaran. Rumusan ini menjaga gagasan dasar pertukaran sambil terdengar alami dalam bahasa Indonesia.
- source_word: וְלֹא יַעֲלֹס
  choice: ia tidak bersukacita
  rationale: עלס berarti bersukacita atau bersorak girang. ‘Tidak bersukacita’ jelas dan mempertahankan pernyataan bahwa ia tidak dapat menikmati kekayaan yang didapatnya.
