  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Metafora konkret ‘menelan’ dipertahankan, sedangkan susunan baris kedua dibuat cukup alami tanpa menutupi ketidakpastian sintaksis teks Ibrani.
