id: JOB.20.11
reference: Job 20:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַ֭צְמוֹתָי/ו מָלְא֣וּ עלומ/ו וְ֝/עִמּ֗/וֹ עַל עָפָ֥ר תִּשְׁכָּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/011.yaml
  text: His bones are full of his youthful vigor[a], but it will lie down with him in the dust.
translation:
  language: id
  text: Tulang-tulangnya penuh dengan tenaga masa muda[a], tetapi tenaga itu akan berbaring bersamanya dalam debu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tulang-tulangnya penuh dengan masa mudanya”; istilah Ibrani ini dapat menunjuk pada masa muda itu sendiri atau pada tenaga yang menyertai masa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: tulang-tulangnya
  rationale: Mempertahankan gambaran konkret kata עֶצֶם dalam bentuk jamak dengan akhiran orang ketiga maskulin tunggal.
- source_word: מָלְאוּ
  choice: penuh dengan
  rationale: Bentuk Qal perfektif ini menyatakan keadaan tulang-tulangnya yang dipenuhi tenaga masa muda; ungkapan Indonesia ini alami dan tidak memaksakan penandaan waktu yang tidak wajib dinyatakan.
- source_word: עֲלוּמָיו
  choice: tenaga masa muda
  rationale: Istilah ini dapat menunjuk pada masa muda maupun daya yang menyertainya. Dalam konteks tulang-tulang, 'tenaga masa muda' menyampaikan makna kontekstual sambil mempertahankan kaitannya dengan masa muda.
- source_word: וְעִמּוֹ
  choice: tetapi ... bersamanya
  rationale: עִם berarti 'bersama'; kata sambung diterjemahkan secara adversatif karena klausa kedua mempertentangkan tenaga muda dengan akhirnya di dalam debu.
- source_word: עַל־עָפָר
  choice: dalam debu
  rationale: Walaupun עַל secara harfiah berarti 'di atas', dalam gambaran kematian dan penguburan bahasa Indonesia lebih wajar memakai 'dalam debu'.
- source_word: תִּשְׁכָּב
  choice: akan berbaring
  rationale: Imperfek Qal orang ketiga feminin tunggal dipahami merujuk pada gagasan tenaga atau masa muda yang menyertai orang itu menuju kematian; bentuk mendatang sesuai dengan alur puitis.
theological_decisions:
- issue: Subjek tersirat pada תִּשְׁכָּב
  choice: tenaga itu
  alternative: masa mudanya
  rationale: Bahasa Indonesia memerlukan rujukan yang cukup jelas. 'Tenaga itu' mengacu kembali pada pilihan utama untuk עֲלוּמָיו tanpa meniadakan kemungkinan bahwa istilah Ibrani menunjuk pada masa muda itu sendiri; kemungkinan tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Gambaran konkret tentang tulang, berbaring, dan debu dipertahankan. Personifikasi tenaga masa muda juga dipertahankan agar ketegangan dan citra teks Ibrani tidak diratakan.
