  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: id
  text: Seperti mimpi, ia terbang pergi dan tidak ditemukan[a]; ia dihalau seperti penglihatan malam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan mereka tidak menemukannya.” Bahasa Ibrani memakai verba aktif jamak dengan pelaku yang tidak disebutkan serta sufiks objek yang berarti “dia”.
    reason: lexical_alternative
  - marker: b
    text: Atau “seperti penglihatan pada malam hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Seperti mimpi
  rationale: Prefiks כְּ menandai perbandingan, sedangkan חֲלוֹם berarti “mimpi”; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan perumpamaannya.
- source_word: יָעוּף
  choice: ia terbang lenyap
  rationale: Kata kerja עוּף secara harfiah berarti “terbang”. Gabungan “terbang lenyap” mempertahankan gambaran puitis sekaligus menyampaikan hilangnya orang itu dengan cepat.
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: dan tidak ditemukan
  rationale: Bentuk Ibrani secara gramatikal adalah verba aktif jamak tak tentu dengan sufiks objek, yakni “dan mereka tidak menemukannya”. Bentuk pasif Indonesia mempertahankan pelaku yang tidak ditentukan dan memusatkan perhatian pada orang yang lenyap; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְיֻדַּד
  choice: ia dihalau
  rationale: Bentuk Hofal ini menyatakan bahwa ia dibuat pergi atau disingkirkan. “Dihalau” mempertahankan bentuk pasif dan daya gambar puitis tanpa menentukan pelaku.
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: seperti penglihatan pada malam hari
  rationale: חֶזְיוֹן berarti “penglihatan”, dan לָיְלָה dapat menyatakan kaitan dengan malam. Pilihan ini jelas dan alami, sementara kemungkinan konstruksi genitif yang lebih padat dicatat dalam catatan kaki.
