  yaml_path: translation/ot/job/020/001.yaml
  text: Then Zophar the Naamathite answered and said:[a]
translation:
  language: id
  text: 'Lalu Zofar, orang Naama, menjawab dan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam formula naratif dialog ini, ענה berarti ‘menjawab’ atau ‘menanggapi’. ‘Menjawab’ mempertahankan rumusan konvensional dan sesuai dengan konteks ketika Zofar menanggapi perkataan sebelumnya.
- source_word: צֹפַר
  choice: Zofar
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַנַּעֲמָתִי
  choice: orang Naama
  rationale: Kata nisbah berartikel ini menunjukkan asal tempat atau hubungan kelompok Zofar. ‘Orang Naama’ menyampaikan makna tersebut secara alami dalam bahasa Indonesia modern.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: אמר berarti ‘berkata’. Bentuk ‘katanya’ mempertahankan unsur kedua dari formula Ibrani ‘menjawab dan berkata’ tanpa menghasilkan susunan Indonesia yang terlalu kaku.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada awal verba memajukan alur narasi. ‘Lalu’ menyampaikan daya urutan secara alami; ‘Dan’ tetap mungkin sebagai padanan yang lebih formal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Teks utama menghindari terjemahan kaku ‘menjawab dan berkata’ dengan memakai ‘menjawab, katanya’, sedangkan catatan kaki menyediakan bentuk yang lebih formal.
