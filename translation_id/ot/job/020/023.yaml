  naturalness: “Menghujankannya ke atas dia” tidak idiomatis dalam bahasa Indonesia baku. Bentuk “menghujankan murka itu ke atasnya” lebih alami, puitis, dan tidak menyisakan ketaksaan mengenai apa yang dihujankan atau siapa sasarannya. “Terhadap dia” juga lebih wajar sebagai “terhadapnya.”
  terminology: “Allah,” “murka-Nya yang menyala-nyala,” “perutnya,” dan “makanannya” sesuai register serta mempertahankan citra dan istilah pokok. “Sebagai makanannya” layak dipertahankan di teks utama karena menjaga kemungkinan hubungan langsung dari בִּלְחוּמוֹ dengan makanan; catatan kaki dengan tepat memelihara pembacaan temporal.
