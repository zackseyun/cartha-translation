base_translation:
  language: en
  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: id
  text: Ketika ia hendak mengisi perutnya, Allah akan melepaskan murka-Nya yang menyala-nyala terhadapnya dan menghujankan murka itu ke atasnya sebagai makanannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan menghujankan murka itu ke atasnya ketika ia sedang makan.” Frasa terakhir dalam bahasa Ibrani sulit; frasa itu dapat menghubungkan penghukuman yang dihujankan dengan makanannya atau dengan waktu ia makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא בִטְנוֹ
  choice: Ketika ia hendak mengisi perutnya
  rationale: Dalam konteks ini, bentuk יְהִי bersama infinitif לְמַלֵּא paling wajar dipahami sebagai keadaan temporal. Terjemahan ini mempertahankan gambaran konkret tentang perut dan saat orang fasik hendak memuaskan dirinya.
- source_word: יְשַׁלַּח בּוֹ
  choice: Allah akan melepaskan ... terhadap dia
  rationale: Subjek tersirat dipahami sebagai Allah berdasarkan konteks penghukuman ilahi. 'Melepaskan' menyampaikan tindakan mengirimkan murka dengan wajar, sedangkan 'terhadap dia' mencerminkan arah bermusuhan dari בּוֹ.
- source_word: חֲרוֹן אַפּוֹ
  choice: murka-Nya yang menyala-nyala
  rationale: Ungkapan ini mempertahankan metafora panas atau nyala kemarahan sekaligus terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: dan menghujankannya ke atas dia
  rationale: Kata kerja Hifil dari מטר menggambarkan penghukuman yang dicurahkan seperti hujan. Pronomina puitis עָלֵימוֹ dipahami sebagai tunggal sesuai rujukan kepada orang fasik dalam konteks.
- source_word: בִּלְחוּמוֹ
  choice: sebagai makanannya
  rationale: Frasa yang sulit ini kemungkinan berkaitan dengan makanan atau santapan. Pilihan ini mempertahankan hubungan langsung antara penghukuman yang dihujankan dan makanan, tanpa mengubahnya menjadi keterangan waktu yang lebih interpretatif.
theological_decisions:
- issue: Subjek tersirat pada kata kerja penghukuman
  choice: Allah disebut secara eksplisit sebagai subjek.
  alternative: Memakai 'Ia' atau bentuk pasif tanpa menyebut subjek.
  rationale: Konteks menggambarkan pembalasan ilahi, dan akhiran posesif pada אַפּוֹ paling alami merujuk kepada Allah. Menyebut 'Allah' menghindari ketidakjelasan pronomina dalam bahasa Indonesia tanpa menambahkan klaim teologis asing.
- issue: Hubungan frasa terakhir dengan penghukuman
  choice: Penghukuman dihujankan 'sebagai makanannya'.
  alternative: Penghukuman datang 'ketika ia sedang makan'.
  rationale: Bahasa Ibrani sulit dan dapat dipahami dalam hubungan dengan makanan maupun waktu makan. Teks utama memilih hubungan yang lebih langsung dengan makanan, sementara catatan kaki mempertahankan alternatif temporal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Gambaran tubuh, murka yang menyala, dan hujan penghukuman dipertahankan. 'Ia' merujuk kepada orang fasik, sedangkan 'Allah' dinyatakan eksplisit untuk mencegah ketaksaan.
