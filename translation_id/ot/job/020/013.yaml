translation:
  language: id
  text: Ia menyayanginya dan tidak mau melepaskannya; ia menahannya di dalam mulutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di langit-langit mulutnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹל
  choice: menyimpannya
  rationale: חמל biasanya berarti menyayangi, mengasihani, atau menyelamatkan dari kebinasaan. Dalam gambaran sesuatu yang manis yang sengaja dipertahankan di mulut (ay. 12–13), “menyimpannya” menyampaikan tindakan memperlakukan benda itu sebagai sesuatu yang tidak rela dilepaskan tanpa memakai “menyayangkan,” yang mudah disalahpahami sebagai menyatakan penyesalan dalam bahasa Indonesia modern.
- source_word: עָלֶיהָ
  choice: -nya
  rationale: Akhiran feminin tunggal merujuk pada objek metaforis dari ayat sebelumnya, yaitu kejahatan. Setelah חמל, preposisi עַל bersifat idiomatis, sehingga bahasa Indonesia paling alami mengungkapkannya sebagai objek langsung.
- source_word: לֹא יַעַזְבֶנָּה
  choice: tidak mau melepaskannya
  rationale: עזב dapat berarti meninggalkan atau melepaskan. Dalam konteks orang yang sengaja mempertahankan sesuatu di mulut, “tidak mau melepaskannya” mengungkapkan penolakan aktif untuk membiarkannya pergi.
- source_word: יִמְנָעֶנָּה
  choice: menahannya
  rationale: מנע berarti menahan, mencegah, atau menyimpan kembali. Di sini kata itu menggambarkan benda yang ditahan di dalam mulut agar tidak ditelan atau dilepaskan.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: di dalam mulutnya
  rationale: חֵך secara harfiah menunjuk pada langit-langit mulut, tetapi “di dalam mulutnya” menyampaikan gambaran fisiknya secara alami dalam bahasa Indonesia. Arti anatomis yang lebih harfiah dicatat dalam catatan kaki.
