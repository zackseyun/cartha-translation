  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: id
  text: Inilah bagian orang fasik dari Allah, warisan yang ditetapkan baginya oleh Yang Perkasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “warisan perkataannya dari Yang Perkasa”; teks Ibrani memakai kata yang berarti “perkataan” atau “ucapan”. Dalam konteks ini, kata itu kemungkinan besar menunjuk pada apa yang Allah nyatakan atau tetapkan bagi orang fasik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Inilah
  rationale: Kata tunjuk ini memperkenalkan ringkasan penutup Zofar; “Inilah” secara alami menyatakan identifikasi dalam bahasa Indonesia.
- source_word: חֵלֶק
  choice: bagian
  rationale: Menunjuk pada jatah atau nasib yang diberikan; “bagian” mempertahankan gambaran pembagian tanpa menyempitkannya menjadi sekadar keberuntungan.
- source_word: אָדָם רָשָׁע
  choice: orang fasik
  rationale: Ungkapan tunggal generik ini menunjuk siapa pun yang fasik. “Orang fasik” alami dalam bahasa Indonesia dan tidak mengubah cakupan generiknya.
- source_word: מֵאֱלֹהִים
  choice: dari Allah
  rationale: Preposisi menandai Allah sebagai sumber bagian yang diterima orang fasik.
- source_word: וְנַחֲלַת
  choice: warisan
  rationale: Kata ini sejajar dengan “bagian” dan menggambarkan sesuatu yang menjadi jatah atau milik seseorang.
- source_word: אִמְרוֹ
  choice: yang ditetapkan baginya
  rationale: Secara bentuk kata ini berkaitan dengan perkataan atau ucapan, tetapi dalam konteks ini kemungkinan menunjuk pada bagian yang dinyatakan atau ditetapkan bagi orang fasik. Terjemahan utama dibuat jelas, sedangkan arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: מֵאֵל
  choice: oleh Yang Perkasa
  rationale: Gelar ilahi אֵל menyatakan kekuatan Allah. “Yang Perkasa” mempertahankan variasi puitis dari אֱלֹהִים; “oleh” menyatakan Allah sebagai pelaku penetapan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Arti אִמְרוֹ dalam baris paralel
  choice: yang ditetapkan baginya
  alternative: perkataan-Nya / ucapannya
  rationale: Konteks merangkum jatah hukuman orang fasik yang berasal dari Allah, sehingga makna deklaratif atau penetapan paling koheren. Namun, bentuk Ibraninya secara harfiah berkaitan dengan “perkataan/ucapan”, dan sufiksnya memungkinkan ungkapan yang tetap ambigu; karena itu alternatif tersebut dicatat, bukan dihapus.
- issue: Penerjemahan gelar אֵל
  choice: Yang Perkasa
  alternative: Allah
  rationale: Pilihan ini menyampaikan nuansa kekuatan dalam gelar tersebut serta menjaga variasi puitis antara אֱלֹהִים dan אֵל tanpa menganggapnya sebagai dua pribadi ilahi.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hikmat-puitis. “Orang fasik” dipilih sebagai istilah umum yang lazim dalam konteks Alkitab, sedangkan “Yang Perkasa” menjaga variasi gelar ilahi dalam puisi.
