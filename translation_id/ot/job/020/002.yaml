  yaml_path: translation/ot/job/020/002.yaml
  text: Therefore my thoughts answer me[b][a], because of my inward agitation.
translation:
  language: id
  text: Karena itu, pikiran-pikiranku mendorong aku untuk menjawab[a], oleh karena kegelisahan dalam diriku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pikiran-pikiranku menjawab aku” atau “pikiran-pikiranku yang menggelisahkan membuat aku menjawab.” Ungkapan Ibraninya padat dan dapat berarti bahwa pikiran-pikiranku menjawab di dalam diriku atau mendorongku untuk menjawab.
    reason: lexical_alternative
  - marker: b
    text: Atau “oleh karena ketergesa-gesaan dalam diriku.” Kata Ibraninya dapat berarti ketergesa-gesaan, tetapi dalam konteks kemungkinan besar menunjuk pada kegelisahan batin atau dorongan mendesak.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan atau akibat dari perkataan sebelumnya dengan penghubung yang alami dalam bahasa Indonesia modern.
- source_word: שְׂעִפַּי
  choice: pikiran-pikiranku
  rationale: Bentuk jamak ini dapat menunjuk pada pikiran yang bercabang atau menggelisahkan. Terjemahan utama mempertahankan ungkapan yang relatif netral, sedangkan nuansa kegelisahannya muncul dari konteks dan klausa berikutnya.
- source_word: יְשִׁיבוּנִי
  choice: mendorong aku untuk menjawab
  rationale: Bentuk kausatif dari שׁוב secara harfiah berhubungan dengan membuat kembali atau berbalik. Dalam idiom puitis ini, pikiran Zofar dipahami menggerakkannya untuk memberikan jawaban; pilihan ini alami dalam bahasa Indonesia tanpa meniadakan ketaksaan yang dicatat dalam catatan kaki.
- source_word: וּבַעֲבוּר
  choice: oleh karena
  rationale: Mengungkapkan hubungan sebab. Konjungsi waw terserap secara alami dalam susunan kalimat Indonesia.
- source_word: חוּשִׁי
  choice: kegelisahan
  rationale: Kata ini berkaitan dengan ketergesa-gesaan atau dorongan mendesak, tetapi dalam konteks menunjuk pada gejolak batin yang membuat Zofar segera menanggapi.
- source_word: בִי
  choice: dalam diriku
  rationale: Mempertahankan secara langsung letak gejolak tersebut di dalam diri pembicara.
