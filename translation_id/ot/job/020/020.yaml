  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: id
  text: Sebab ia tidak mengenal ketenangan dalam perutnya; dengan barang-barang yang didambakannya, ia tidak akan dapat meluputkan diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia tidak akan dapat meluputkan barang yang didambakannya.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi hukuman yang dijelaskan dalam konteks sebelumnya dan sesuai dengan alur argumentasi puisi.
- source_word: לֹא יָדַע שָׁלֵו
  choice: ia tidak mengenal ketenangan
  rationale: Mempertahankan bentuk konkret ungkapan Ibrani dan menggambarkan tidak adanya rasa tenteram atau puas.
- source_word: בְּבִטְנוֹ
  choice: dalam perutnya
  rationale: בטן secara harfiah menunjuk pada perut atau bagian dalam tubuh; terjemahan konkret ini mempertahankan gambaran tentang nafsu makan dan kerakusan dalam konteks.
- source_word: בַּחֲמוּדוֹ
  choice: dengan apa yang diinginkannya
  rationale: Bentuk dari חמד dapat menunjuk pada sesuatu yang didambakan atau dianggap berharga. Ungkapan ini mempertahankan keluasan makna tanpa membatasinya hanya pada harta.
- source_word: לֹא יְמַלֵּט
  choice: ia tidak akan menyelamatkan dirinya
  rationale: Piel מלט dapat berarti meluputkan atau menyelamatkan. Bentuk refleksif ini menampilkan kemungkinan bahwa barang yang didambakannya tidak dapat menjadi sarana keselamatan baginya.
theological_decisions:
- issue: Hubungan antara barang yang didambakan dan kegagalan untuk luput
  choice: dengan apa yang diinginkannya, ia tidak akan menyelamatkan dirinya
  alternative: ia tidak akan meluputkan apa yang diinginkannya
  rationale: Sintaksis Ibrani padat dan dapat dipahami secara instrumental atau sebagai rujukan kepada benda yang tidak berhasil dipertahankan. Teks utama mengikuti pembacaan instrumental yang cocok dengan בְּ, sedangkan alternatif dicatat agar ambiguitas tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Kata “perut” dipertahankan demi citra jasmani teks Ibrani; “ketenangan” lebih alami daripada “ketenteraman” dalam konstruksi ini dan tetap mencakup gagasan rasa tenteram atau puas.
