  text: His sons will seek the favor of the poor[b][a], and his own hands will give back his wealth.
translation:
  language: id
  text: Putra-putranya akan memohon kemurahan kepada orang-orang miskin[a], dan tangannya sendiri akan mengembalikan kekayaannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan berusaha menenangkan orang-orang miskin” atau “akan mencari perkenanan orang-orang miskin”; kata kerja Ibrani dapat berarti mencari penerimaan atau meredakan orang-orang yang telah dirugikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “hartanya” atau “kekuatannya”; kata Ibrani dapat menunjuk pada kekayaan, milik, daya, atau kekuatan, tetapi “kekayaan” paling sesuai dengan konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Bentuk Ibrani ini secara gramatikal berarti 'anak-anak lelaki/putra-putranya', tetapi dalam bahasa Indonesia modern 'anak-anaknya' merupakan padanan alami bagi keturunannya tanpa mengubah rujukan jamak.
- source_word: יְרַצּוּ
  choice: akan mencari belas kasihan
  rationale: Bentuk piel dari רצה di sini dapat berarti mencari penerimaan atau meredakan pihak yang dirugikan. Ungkapan ini menyampaikan bahwa anak-anaknya harus memohon kemurahan orang miskin, sambil mempertahankan alternatif 'menenangkan' dalam catatan kaki.
- source_word: דַלִּים
  choice: orang miskin
  rationale: דלים menunjuk kepada mereka yang miskin, lemah, atau berkekurangan; konteks pemulihan harta paling mendukung 'orang miskin'.
- source_word: יָדָיו
  choice: tangannya sendiri
  rationale: Secara harfiah 'tangan-tangannya'; bahasa Indonesia lazim memakai bentuk tunggal kolektif 'tangannya'. Kata 'sendiri' menonjolkan bahwa pemulihan itu dilakukan olehnya secara pribadi.
- source_word: תָּשֵׁבְנָה
  choice: akan mengembalikan
  rationale: Bentuk hifil dari שוב berarti menyebabkan sesuatu kembali, sehingga 'mengembalikan' tepat dan alami dalam konteks ganti rugi.
- source_word: אוֹנוֹ
  choice: kekayaannya
  rationale: אוֹן dapat berarti kekayaan, harta, daya, atau kekuatan. Dalam konteks pengembalian kepada orang miskin, makna material 'kekayaan' paling sesuai, sementara ambiguitas leksikal dicatat.
