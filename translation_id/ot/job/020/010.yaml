  naturalness: “Putra-putranya akan memohon kemurahan kepada orang-orang miskin” adalah bahasa Indonesia modern yang alami dan jelas. “Tangannya sendiri akan mengembalikan kekayaannya” juga wajar, sambil mempertahankan metafora tangan dan penekanan bahwa pengembalian itu dilakukan olehnya sendiri.
  terminology: “Putra-putranya” mempertahankan gender maskulin plural dari bahasa Ibrani. “Memohon kemurahan kepada” menyampaikan konteks permohonan kepada pihak miskin yang telah dirugikan tanpa memaksakan satu penafsiran sempit atas רצה. “Kekayaannya” merupakan pilihan kontekstual yang baik untuk אוֹנוֹ, sedangkan kemungkinan “harta/milik” dan “kekuatan” tetap dicatat.
