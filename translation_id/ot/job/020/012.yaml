source:
  edition: WLC
  text: אִם תַּמְתִּ֣יק בְּ/פִ֣י/ו רָעָ֑ה יַ֝כְחִידֶ֗/נָּה תַּ֣חַת לְשׁוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: id
  text: Sekalipun kejahatan terasa manis di mulutnya[a], ia menyembunyikannya di bawah lidahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika kejahatan terasa manis di mulutnya.” Partikel Ibrani ini dapat dipahami sebagai syarat (“jika”) atau konsesi (“sekalipun”); konteks lebih mendukung makna konsesif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Sekalipun
  rationale: Partikel ini dapat menyatakan syarat (‘jika’) atau konsesi (‘sekalipun’). Dalam rangkaian gambaran tentang orang fasik yang menikmati kejahatan, makna konsesif paling sesuai, tetapi alternatifnya dicatat dalam catatan kaki.
- source_word: תַּמְתִּיק
  choice: terasa manis
  rationale: Bentuk Hifil dari מתק secara harfiah berkaitan dengan membuat menjadi manis, tetapi dengan רָעָה sebagai subjek, ungkapan idiomatis Indonesia ‘terasa manis’ menyampaikan bahwa kejahatan itu menyenangkan baginya.
- source_word: בְּפִיו
  choice: di mulutnya
  rationale: Terjemahan konkret ini mempertahankan metafora mulut yang dilanjutkan oleh frasa ‘di bawah lidahnya’.
- source_word: רָעָה
  choice: kejahatan
  rationale: Dalam konteks hikmat ini, kata tersebut menunjuk pada keburukan moral yang dinikmati orang fasik; ‘kejahatan’ merupakan padanan Indonesia yang alami dan cukup luas.
- source_word: יַכְחִידֶנָּה
  choice: ia menyembunyikannya
  rationale: Bentuk Hifil dari כחד menyatakan tindakan menyembunyikan; sufiks feminin merujuk kembali kepada רָעָה, yakni ‘kejahatan’.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan spasial langsung yang mempertahankan gambaran sesuatu yang ditahan di dalam mulut.
- source_word: לְשׁוֹנוֹ
  choice: lidahnya
  rationale: Terjemahan harfiah mempertahankan gambaran hidup tentang kejahatan yang diam-diam dinikmati dan disimpan.
