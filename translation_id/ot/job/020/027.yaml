  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: id
  text: Langit akan menyingkapkan kejahatannya[a], dan bumi[b] akan bangkit melawan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesalahannya”; kata Ibrani ini dapat menunjuk pada perbuatan jahat ataupun kesalahan yang melekat padanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “negeri itu”, tetapi “bumi” lebih sesuai dengan kesejajarannya dengan “langit” dalam konteks puitis ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: akan menyingkapkan
  rationale: Bentuk Piel imperfek dari גלה menyatakan tindakan membuat sesuatu tersingkap atau diketahui. “Menyingkapkan” mempertahankan gambaran puitis sekaligus nuansa terbukanya kejahatan di hadapan penghakiman.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Walaupun bentuk Ibraninya jamak, kata ini lazim berfungsi sebagai nomina kolektif. “Langit” alami dalam bahasa Indonesia dan mempertahankan personifikasi kosmisnya.
- source_word: עֲוֺנוֹ
  choice: kejahatannya
  rationale: עָוֹן dapat menunjuk pada perbuatan jahat maupun kesalahan atau status bersalah yang ditimbulkannya. Dalam konteks penyingkapan moral orang fasik, “kejahatannya” menyampaikan makna utama tanpa menghapus kemungkinan makna lainnya.
- source_word: וְאֶרֶץ
  choice: dan bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri/tanah”. Dalam kesejajaran dengan “langit” dan personifikasi kosmis ayat ini, “bumi” paling sesuai.
- source_word: מִתְקוֹמָמָה
  choice: akan bangkit
  rationale: Bentuk dari קום ini menggambarkan bangkit atau berdiri dalam perlawanan. “Akan bangkit” mempertahankan gambaran personifikasi yang hidup.
- source_word: לוֹ
  choice: melawan dia
  rationale: Dengan verba bangkit dalam konteks permusuhan, ל memiliki daya adversatif. “Melawan dia” menyampaikan hubungan tersebut secara idiomatis dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan dua klausa mempertahankan kesejajaran kosmis antara langit dan bumi, sementara verba “menyingkapkan” dan “bangkit” menjaga personifikasi dalam teks Ibrani.
