lexical_decisions:
- source_word: אִם
  choice: Sekalipun
  rationale: 'Dalam konteks puitis ini, אִם memperkenalkan keadaan yang bersifat konsesif: betapa pun tinggi orang fasik itu terangkat, ia tetap akan binasa. Bentuk kondisional harfiah “jika” tetap dicatat sebagai kemungkinan.'
- source_word: יַעֲלֶה
  choice: menjulang
  rationale: Kata kerja עלה menyatakan gerak ke atas. “Menjulang” alami dalam bahasa Indonesia dan menguatkan gambaran vertikal yang berpasangan dengan kepala yang mencapai awan.
- source_word: לַשָּׁמַיִם
  choice: sampai ke langit
  rationale: Ungkapan ini menyatakan batas ketinggian yang dicapai. “Langit” merupakan padanan Indonesia yang alami untuk bentuk Ibrani שָׁמַיִם dalam puisi.
- source_word: שִׂיאוֹ
  choice: kebesarannya
  rationale: שִׂיאוֹ dapat menunjuk pada ketinggian, keluhuran, atau keadaan yang ditinggikan. “Kebesarannya” mempertahankan kemungkinan makna kedudukan atau keagungan tanpa menghilangkan gambaran tentang sesuatu yang menjulang.
- source_word: וְרֹאשׁוֹ
  choice: dan kepalanya
  rationale: “Kepalanya” adalah arti langsung dan mempertahankan personifikasi atau gambaran tubuh yang menjulang sangat tinggi.
- source_word: לָעָב
  choice: awan-awan
  rationale: עָב menunjuk pada awan atau awan tebal. Bentuk “awan-awan” terdengar alami dalam paralelisme puitis dengan “langit”.
- source_word: יַגִּיעַ
  choice: mencapai
  rationale: Dalam bentuk Hifil di sini, נגע menyatakan sampai atau menjangkau suatu batas. “Mencapai” jelas dan mempertahankan metafora ruang.
theological_decisions:
- issue: Apakah kebesaran orang fasik dipahami secara fisik atau sebagai kedudukan dan keagungan
  choice: Memakai “kebesarannya” sambil mempertahankan gambaran vertikal
  alternative: “ketinggiannya” atau “keluhurannya”
  rationale: Teks Ibrani memungkinkan makna ketinggian sekaligus keadaan yang ditinggikan. Terjemahan tidak membatasi gambaran itu hanya pada tubuh, status sosial, atau kesombongan moral.
translation_notes:
  register: Bahasa puitis modern dan bermartabat. “Menjulang sampai ke langit” serta “kepalanya mencapai awan-awan” mempertahankan paralelisme dan citra hiperbolis Ibrani tanpa menjadikannya terlalu teknis.
