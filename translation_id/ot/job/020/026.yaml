  text: כָּל חֹשֶׁךְ֮ טָמ֪וּן לִ/צְפּ֫וּנָ֥י/ו תְּ֭אָכְלֵ/הוּ אֵ֣שׁ לֹֽא נֻפָּ֑ח יֵ֖רַע שָׂרִ֣יד בְּ/אָהֳלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: id
  text: Segala kegelapan disimpan untuk harta bendanya[a]; api yang tidak dikipas akan melalapnya[b]; ia akan mencelakakan yang tersisa dalam kemahnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Segala kegelapan dicadangkan baginya.” Frasa Ibrani ini sulit dan dapat menunjuk pada bencana yang disimpan baginya atau pada kegelapan yang disimpan untuk harta atau simpanannya yang tersembunyi.
    reason: alternative_reading
  - marker: b
    text: “Tidak dikipas” dapat berarti tidak ditiup, tidak dinyalakan, atau tidak dibesarkan dengan tiupan manusia; ungkapan ini tidak menyatakan secara eksplisit asal api itu.
    reason: lexical_alternative
  - marker: c
    text: Atau, “api itu akan melalap sisa yang ada dalam kemahnya.” Kata yang diterjemahkan “yang tersisa” juga dapat berarti “orang yang selamat,” dan kata kerjanya dapat berarti “mencelakakan” atau “menghancurkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: Segala kegelapan
  rationale: Mempertahankan gambaran konkret sekaligus metaforis tentang kegelapan sebagai bencana atau penghakiman, tanpa mempersempit maknanya.
- source_word: טָמוּן
  choice: tersimpan
  rationale: Mencakup nuansa sesuatu yang disembunyikan sekaligus dicadangkan untuk kemudian.
- source_word: לִצְפּוּנָיו
  choice: bagi harta bendanya
  rationale: Bentuk yang sulit ini berkaitan dengan sesuatu yang tersembunyi atau tersimpan dan dapat menunjuk pada simpanan miliknya; catatan kaki mempertahankan kemungkinan bahwa bencana justru dicadangkan baginya.
- source_word: תְּאָכְלֵהוּ
  choice: akan melalapnya
  rationale: Ungkapan alami dalam bahasa Indonesia untuk tindakan api yang menghabiskan, dengan akhiran pronominal orang ketiga tunggal tetap dipertahankan.
- source_word: אֵשׁ לֹא נֻפָּח
  choice: api yang tidak dikipas
  rationale: Mempertahankan citra api yang tidak perlu ditiup atau dikipas manusia, tanpa secara eksplisit menentukan asal api itu.
- source_word: יֵרַע
  choice: akan ditimpa malapetaka
  rationale: Mencerminkan arti dasar bahwa keadaan akan menjadi buruk atau bahwa bahaya akan menimpa, alih-alih secara pasti menjadikan api sebagai subjek tersirat.
- source_word: שָׂרִיד
  choice: yang tersisa
  rationale: Menjaga ambiguitas antara seorang penyintas dan sisa orang atau milik dalam rumah tangganya.
- source_word: בְּאָהֳלוֹ
  choice: dalam kemahnya
  rationale: Mempertahankan citra harfiah dan puitis kemah, yang juga dapat mewakili tempat tinggal atau rumah tangga.
theological_decisions:
- issue: Asal api yang tidak dikipas
  choice: Tidak menyebutnya secara eksplisit sebagai api ilahi
  alternative: Api yang dikirim Allah
  rationale: Teks menyiratkan api yang tidak memerlukan tindakan manusia, tetapi tidak secara langsung menyatakan siapa yang mengirimkannya.
- issue: Identitas yang tersisa dalam kemah
  choice: Mempertahankan ungkapan umum “yang tersisa”
  alternative: Orang yang selamat atau sisa harta bendanya
  rationale: Bahasa Ibrani memungkinkan rujukan kepada penyintas maupun sisa rumah tangga atau milik, sehingga terjemahan tidak menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Harta benda,” “melalap,” dan “kemah” mudah dipahami pembaca umum, sementara catatan kaki mempertahankan kesulitan sintaksis dan leksikal teks Ibrani.
