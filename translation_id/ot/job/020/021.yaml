translation:
  language: id
  text: Tidak ada yang tersisa untuk dilahapnya[a]; karena itu, kemakmurannya tidak akan bertahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Tidak ada yang tersisa untuk dimakannya,” yaitu, tidak ada yang tersisa dari apa yang dihabiskannya.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja yang diterjemahkan “bertahan” sulit dipastikan maknanya. Kemungkinan lain ialah “berlangsung” atau, meski kurang mungkin di sini, “menjadi makmur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: Tidak ada yang tersisa
  rationale: Ungkapan eksistensial dengan שָׂרִיד, secara harfiah ‘orang yang selamat/sisa’, menyatakan bahwa tidak ada apa pun yang tinggal atau luput. Bentuk ini alami dalam bahasa Indonesia sambil mempertahankan gambaran penghabisan total.
- source_word: לְאָכְלוֹ
  choice: untuk dilahapnya
  rationale: Infinitif אכל berarti ‘makan’; dalam konteks kerakusan orang fasik, ‘dilahap’ menyampaikan tindakan menghabiskan dengan rakus. Hubungan sintaksisnya tetap agak terbuka, sehingga alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: עַל כֵּן
  choice: karena itu
  rationale: Ungkapan inferensial baku yang memperkenalkan akibat dari klausa sebelumnya.
- source_word: לֹא יָחִיל
  choice: tidak akan bertahan
  rationale: Makna verba יָחִיל di sini sulit dipastikan. ‘Bertahan’ menyampaikan pengertian bahwa keadaan baiknya tidak akan berlangsung, tanpa mempersempitnya menjadi sekadar keberhasilan ekonomi.
- source_word: טוּבוֹ
  choice: kemakmurannya
  rationale: Secara harfiah berarti ‘kebaikannya/hal-hal baik miliknya’; dalam konteks penghakiman atas orang fasik, kata ini menunjuk pada keadaan baik atau kemakmuran yang dinikmatinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. ‘Dilahapnya’ mempertahankan nuansa kerakusan dalam konteks, sedangkan ‘kemakmurannya tidak akan bertahan’ menyampaikan akibat secara wajar tanpa menghapus ketidakpastian leksikal yang dijelaskan dalam catatan kaki.
