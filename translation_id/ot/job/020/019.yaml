  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: id
  text: Sebab ia telah meremukkan dan menelantarkan orang miskin; ia telah merampas sebuah rumah dan tidak akan membangunnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “... dan tidak membangunnya.” Verba Ibrani ini berbentuk imperfek; dalam konteks ini dapat menyatakan tindakan yang tidak akan dilakukan atau tindakan yang tidak dilakukannya.'
    reason: Nuansa imperfek
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata sambung ini memperkenalkan alasan bagi hukuman yang disebutkan dalam konteks sebelumnya.
- source_word: רִצַּץ
  choice: telah meremukkan
  rationale: Mempertahankan daya konkret dan keras dari verba Ibrani, tanpa melemahkannya menjadi sekadar 'menindas'.
- source_word: עָזַב
  choice: menelantarkan
  rationale: Dalam rangkaian dengan tindakan terhadap orang miskin, pilihan ini secara wajar menyampaikan tindakan meninggalkan mereka tanpa pertolongan.
- source_word: דַּלִּים
  choice: orang miskin
  rationale: Menunjuk kepada orang yang miskin, lemah, atau rentan secara sosial; 'orang miskin' merupakan padanan langsung dan alami.
- source_word: בַּיִת
  choice: rumah
  rationale: Konteks perampasan dan pembangunan paling alami menunjuk pada rumah atau properti fisik.
- source_word: גָּזַל
  choice: telah merampas
  rationale: Verba ini menunjukkan pengambilan secara paksa atau melalui perampokan; 'merampas' mempertahankan unsur kekerasannya.
- source_word: וְלֹא יִבֶנֵהוּ
  choice: yang tidak dibangunnya
  rationale: Bentuk verba Ibrani secara morfologis dapat dibaca sebagai imperfek atau bentuk keadaan/modal. Karena klausa relatif paling alami menerangkan rumah hasil rampasan, terjemahan ini mempertahankan kemungkinan bahwa pelaku merampas rumah yang bukan hasil bangunannya sendiri.
theological_decisions:
- issue: Hubungan sintaksis וְלֹא יִבֶנֵהוּ dengan בַּיִת גָּזַל
  choice: rumah yang tidak dibangunnya
  alternative: rumah yang dirampasnya, tetapi tidak akan dibangunnya kembali
  rationale: Aksen Masoret menempatkan pemisah kuat setelah גָּזַל, tetapi konstruksi dan pemakaian imperfek memungkinkan lebih dari satu pemahaman. Teks utama memilih pembacaan klausa relatif yang dikenal dari tradisi penerjemahan dan menyimpan pembacaan futuratif dalam catatan, tanpa menjadikannya keputusan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Meremukkan' mempertahankan citra keras teks puisi; 'menelantarkan' lebih alami daripada 'meninggalkan' untuk tindakan tercela terhadap orang miskin. Penanda catatan [a] ditempatkan tepat setelah klausa yang memiliki ambiguitas sintaksis.
