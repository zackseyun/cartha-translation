  text: his food in his belly is turned[a]; it is the venom of cobras within him.
translation:
  language: id
  text: Makanannya di dalam perutnya berubah[a] menjadi bisa ular kobra di dalam dirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Rotinya di dalam perutnya berubah menjadi empedu ular-ular berbisa di dalam dirinya.”
    reason: 'Alternatif ini mempertahankan arti yang lebih harfiah dari beberapa kata Ibrani: “roti”, “isi perut”, dan “empedu”.'
lexical_decisions:
- source_word: לַחְמוֹ
  choice: makanan
  rationale: Secara harfiah kata ini sering berarti “roti”, tetapi dalam konteks pencernaan kata tersebut menunjuk secara lebih luas pada apa yang telah dimakan. “Makanan” alami dan jelas dalam bahasa Indonesia modern.
- source_word: בְּמֵעָיו
  choice: di dalam perutnya
  rationale: Kata Ibrani ini menunjuk pada organ-organ bagian dalam atau isi perut. “Di dalam perutnya” mempertahankan gambaran pencernaan dengan bahasa yang wajar.
- source_word: נֶהְפָּךְ
  choice: berubah
  rationale: Bentuk Nifal ini menyatakan perubahan keadaan. “Berubah” ringkas dan tetap membiarkan baris berikut menjelaskan hasil perubahan tersebut.
- source_word: מְרוֹרַת
  choice: bisa
  rationale: Walaupun berhubungan dengan makna “kepahitan” atau “empedu”, dalam gabungan dengan ular berbisa kata ini mengungkapkan racun atau bisa ular.
- source_word: פְּתָנִים
  choice: ular kobra
  rationale: Istilah ini menunjuk pada sejenis ular berbisa dan secara tradisional juga diterjemahkan “ular tedung” atau “asp”. “Ular kobra” mudah dipahami pembaca Indonesia modern tanpa menghilangkan gambaran ular tertentu.
- source_word: בְּקִרְבּוֹ
  choice: di dalam dirinya
  rationale: Frasa ini menegaskan bahwa bisa itu berada di bagian dalam orang tersebut. Pilihan ini alami sekaligus mempertahankan tekanan jasmaniah ayat.
