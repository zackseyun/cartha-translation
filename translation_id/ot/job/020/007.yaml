  naturalness: Susunan kalimat, "ia akan binasa untuk selamanya," dan "orang-orang yang pernah melihatnya" wajar dalam bahasa Indonesia modern. "Di manakah dia?" sesuai dengan register puitis dan pertanyaan lokasi dalam bahasa Ibrani.
