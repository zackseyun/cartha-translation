  text: Like his own dung[a], he will perish forever; those who saw him will say, ‘Where is he?’
translation:
  language: id
  text: Seperti tahinya, ia akan binasa untuk selamanya; orang-orang yang pernah melihatnya akan berkata, “Di manakah dia?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: Seperti kotorannya sendiri
  rationale: Nomina גֶּלֶל menunjuk pada kotoran atau tinja. “Kotorannya sendiri” mempertahankan gambaran yang sengaja merendahkan sekaligus mengungkapkan sufiks posesif secara alami dalam bahasa Indonesia; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: לָנֶצַח
  choice: untuk selamanya
  rationale: Ungkapan ini menyatakan jangka waktu yang terus berlangsung. Dalam konteks penghukuman puitis, “untuk selamanya” menyampaikan hilangnya seseorang secara total dan tetap.
- source_word: יֹאבֵד
  choice: ia akan binasa
  rationale: Verba אבד mengandung arti binasa, lenyap, atau hancur. “Binasa” mempertahankan daya penghukuman dan kehancuran yang lebih kuat daripada sekadar “lenyap”.
- source_word: רֹאָיו
  choice: orang-orang yang pernah melihatnya
  rationale: Bentuk partisip dengan sufiks secara harfiah berarti orang-orang yang melihatnya. Kata “pernah” secara alami menunjukkan mereka yang mengenalnya atau melihatnya sebelum ia binasa, tanpa menambahkan gagasan yang asing dari konteks.
- source_word: יֹאמְרוּ
  choice: akan berkata
  rationale: אמר berarti “berkata”. Bentuk pertanyaan pada ucapan berikutnya tidak mengharuskan verba ini diterjemahkan sebagai “bertanya”.
- source_word: אַיּוֹ
  choice: Di manakah dia?
  rationale: Interogatif lokasi dengan sufiks pronominal ini berarti “di manakah dia?” Bentuk tersebut mempertahankan pertanyaan sederhana tanpa menambahkan “sekarang” atau “ke mana ia pergi”.
