  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: id
  text: Ia telah menelan kekayaan[a], tetapi akan memuntahkannya kembali; Allah akan mengeluarkannya dari perutnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “harta benda” (חַיִל).'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari perutnya”; ungkapan ini mempertahankan gambaran kekayaan yang ditelan lalu dikeluarkan secara paksa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: kekayaan
  rationale: Dalam konteks sastra hikmat ini, kata tersebut menunjuk pada kekayaan atau harta benda, bukan kekuatan atau pasukan. “Kekayaan” sesuai dengan gambaran keuntungan yang ditelan orang fasik.
- source_word: בָּלַע
  choice: telah menelan
  rationale: Arti konkretnya adalah “menelan”; pilihan ini mempertahankan metafora jasmani yang dilanjutkan oleh kata “memuntahkan”.
- source_word: וַיְקִאֶנּוּ
  choice: tetapi akan memuntahkannya kembali
  rationale: Kata kerja ini berarti “memuntahkan”. Dalam rangkaian puitis tentang nasib orang fasik, bentuk ini dipahami sebagai akibat yang akan terjadi; “tetapi” menyatakan pembalikan yang tersirat, dan “kembali” menunjukkan bahwa apa yang ditelan harus dikeluarkan.
- source_word: מִבִּטְנוֹ
  choice: dari perutnya
  rationale: בֶּטֶן secara harfiah berarti “perut” dalam konteks ini. Pilihan ini mempertahankan gambaran konkret tentang kekayaan yang ditelan lalu dikeluarkan.
- source_word: יוֹרִשֶׁנּוּ
  choice: akan mengeluarkannya
  rationale: Bentuk kausatif verba ירשׁ di sini menyatakan bahwa Allah membuat kekayaan itu keluar dari orang tersebut. “Mengeluarkannya” jelas dan alami dalam bahasa Indonesia tanpa menghilangkan daya paksa yang ditunjukkan konteks.
- source_word: אֵל
  choice: Allah
  rationale: אֵל adalah sebutan umum tunggal bagi Allah dan menjadi subjek eksplisit tindakan pengeluaran tersebut.
theological_decisions:
- issue: Pelaku penghukuman yang menyebabkan kekayaan orang fasik dikeluarkan
  choice: Allah disebut secara eksplisit sebagai pelaku yang mengeluarkan kekayaan itu.
  alternative: Kehilangan tersebut dipahami hanya sebagai akibat impersonal atau nasib yang pelakunya tidak disebutkan.
  rationale: Teks Ibrani secara eksplisit menempatkan אֵל sebagai subjek יוֹרִשֶׁנּוּ; karena itu, tindakan Allah tidak diperhalus menjadi sekadar konsekuensi alamiah.
- issue: Nilai waktu וַיְקִאֶנּוּ dalam rangkaian puisi
  choice: Diterjemahkan “akan memuntahkannya” sesuai gambaran nasib yang akan menimpa orang fasik dalam konteks.
  alternative: Diterjemahkan sebagai peristiwa lampau, “lalu ia memuntahkannya”.
  rationale: Bentuk Ibrani secara morfologis dapat tampak sebagai rangkaian naratif, tetapi konteks pidato Zofar menggambarkan akibat yang pasti akan terjadi. Terjemahan berorientasi masa depan menjaga alur konteks tanpa meniadakan bentuk puitis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora jasmani “menelan—memuntahkan—dari perut” dipertahankan secara utuh. Pronomina “ia” merujuk kepada orang fasik dalam konteks, sedangkan “Allah” mempertahankan pelaku ilahi yang eksplisit.
