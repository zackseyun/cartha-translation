  register: Bahasa Indonesia baku, lugas, dan puitis. “Mengisap” serta “lidah” mempertahankan gambaran konkret Ibrani, sedangkan nama-nama ular dibuat mudah dipahami tanpa menyatakan kepastian zoologis yang tidak dimiliki teks sumber.
