  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: id
  text: Ia mengisap bisa ular kobra[a]; lidah ular berbisa membunuhnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “racun ular kobra”. Kata Ibrani yang secara harfiah berarti “kepala” dipakai di sini dalam arti “bisa” atau “racun”.
    reason: lexical_alternative
  - marker: b
    text: Atau “lidah ular beludak membunuhnya.” Jenis ular yang dimaksud oleh kata Ibrani ini tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: bisa
  rationale: Walaupun secara harfiah sering berarti “kepala”, dalam gambaran puitis tentang ular kata ini dipakai untuk racun atau bisa. “Bisa” paling tepat untuk racun yang dihasilkan ular.
- source_word: פְּתָנִים
  choice: ular kobra
  rationale: Kata ini menunjuk pada ular berbisa; “ular kobra” merupakan padanan modern yang jelas, tanpa mempertahankan istilah tradisional yang kurang dikenal.
- source_word: יִינָק
  choice: mengisap
  rationale: Mempertahankan arti konkret dan gambaran tajam dari verba Ibrani yang berarti mengisap atau menyusu.
- source_word: תַּהַרְגֵהוּ
  choice: membunuhnya
  rationale: Menyatakan akibat yang pasti secara langsung dan alami dalam gaya puisi hikmat.
- source_word: לְשׁוֹן
  choice: lidah
  rationale: Menerjemahkan citra konkret teks Ibrani secara formal, tanpa menggantinya dengan mekanisme yang disimpulkan seperti taring atau gigitan.
- source_word: אֶפְעֶה
  choice: ular berbisa
  rationale: Istilah Ibrani menunjuk pada sejenis ular berbisa, tetapi identifikasi spesiesnya tidak pasti. Padanan umum ini menjaga ketidakpastian tersebut; alternatif tradisionalnya ialah “ular beludak” atau “viper”.
