base_translation:
  language: en
  yaml_path: translation/ot/job/020/005.yaml
  text: For the rejoicing of the wicked is brief[a], and the joy of the godless lasts only a moment.
translation:
  language: id
  text: Sebab sorak-sorai orang fasik hanya sebentar, dan sukacita orang yang tidak saleh[a] hanya sesaat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang munafik.” Kata Ibrani חָנֵף dapat berarti “orang munafik,” tetapi dalam kitab Ayub sering menunjuk lebih luas kepada orang yang tidak saleh atau tidak mengindahkan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dasar bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan penjelas atau kausal secara alami.
- source_word: רִנְנַת
  choice: sorak-sorai
  rationale: Nomina ini menunjuk pada seruan sukacita; “sorak-sorai” mempertahankan unsur vokalnya sekaligus terdengar wajar dalam puisi hikmat.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Padanan baku dan ringkas bagi orang-orang yang bersalah atau jahat secara moral, sesuai dengan ragam sastra hikmat.
- source_word: מִקָּרוֹב
  choice: hanya sebentar
  rationale: Dalam konteks ini frasa tersebut menyatakan singkatnya durasi, bukan kedekatan tempat. “Hanya sebentar” menyampaikan batas waktu dengan jelas.
- source_word: וְשִׂמְחַת
  choice: dan sukacita
  rationale: Padanan langsung yang mempertahankan kesejajaran puitis dengan klausa pertama.
- source_word: חָנֵף
  choice: orang yang tidak mengenal Allah
  rationale: Dalam kitab Ayub kata ini memiliki cakupan lebih luas daripada orang yang sekadar berpura-pura saleh, yakni orang yang tidak saleh atau tidak mengindahkan Allah. Ungkapan ini mudah dipahami pembaca modern dan sejajar dengan “orang fasik”.
- source_word: עֲדֵי רָגַע
  choice: hanya sesaat
  rationale: Gabungan ini menyatakan berlangsungnya sesuatu sampai batas waktu yang amat singkat; “hanya sesaat” alami, ringkas, dan puitis.
theological_decisions:
- issue: Makna חָנֵף
  choice: orang yang tidak mengenal Allah
  alternative: orang munafik; orang tidak saleh
  rationale: Pilihan utama mencerminkan arti luas tentang orang yang tidak mengindahkan Allah, tanpa mempersempitnya menjadi kepura-puraan religius. Catatan kaki menjaga alternatif leksikal yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran puitis dipertahankan melalui pasangan “sorak-sorai ... hanya sebentar” dan “sukacita ... hanya sesaat.” Penanda catatan kaki ditempatkan setelah seluruh ayat karena catatan menerangkan istilah pada klausa kedua.
