  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: id
  text: Ia menariknya keluar[a], dan senjata itu keluar dari tubuhnya; suatu kilatan keluar dari empedunya; berbagai kengerian menimpanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Objek yang ditarik tidak disebutkan dalam bahasa Ibrani; konteksnya mengisyaratkan senjata.
    reason: textual_ambiguity
lexical_decisions:
- source_word: שָׁלַף
  choice: Ia mencabutnya
  rationale: Verba ini berarti menarik atau mencabut, khususnya senjata. Objek tersirat dipertahankan dengan pronomina -nya karena konteks menggambarkan senjata yang tertancap dalam tubuh.
- source_word: וַיֵּצֵא
  choice: lalu senjata itu keluar
  rationale: Verba ini berarti keluar. Subjek eksplisit 'senjata itu' ditambahkan demi kejelasan rujukan dalam bahasa Indonesia, sesuai konteks senjata yang dicabut.
- source_word: מִגֵּוָה
  choice: dari tubuhnya
  rationale: Nomina ini menunjuk pada tubuh atau batang tubuh. 'Tubuhnya' jelas, alami, dan tidak mempersempit bagian anatomi secara berlebihan.
- source_word: וּבָרָק
  choice: mata senjata yang berkilat
  rationale: Kata ini secara harfiah berarti kilat atau cahaya yang berkilau, tetapi dalam konteks ini kemungkinan menunjuk secara metonimis pada bagian senjata yang berkilat. 'Mata senjata' tidak membatasi jenis senjata pada pedang saja.
- source_word: מִמְּרֹרָתוֹ
  choice: dari empedunya
  rationale: Dalam gambaran luka tubuh ini, makna anatomis empedu atau kantong empedu lebih tepat daripada makna kiasan 'kepahitan'. 'Empedunya' mempertahankan daya gambar yang tajam tanpa menjadi terlalu klinis.
- source_word: יַהֲלֹךְ עָלָיו
  choice: menimpa dia
  rationale: Gabungan ini menggambarkan sesuatu yang datang atas seseorang. 'Menimpa dia' alami dalam bahasa Indonesia dan menyampaikan datangnya kengerian.
- source_word: אֵמִים
  choice: kengerian
  rationale: Bentuk jamak ini menyatakan berbagai teror atau hal-hal yang mengerikan. Nomina kolektif 'kengerian' terdengar alami dalam bahasa Indonesia dan mempertahankan intensitasnya.
