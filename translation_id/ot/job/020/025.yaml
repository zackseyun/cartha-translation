  terminology: '"Empedu" tepat untuk מְרֹרָה dalam konteks luka tubuh, tanpa memaksakan istilah klinis "kantong empedu". "Senjata" adalah penyediaan konteks yang wajar untuk objek tersirat, sedangkan "kilatan" tidak memaksakan identifikasi lebih lanjut atas בָּרָק.'
