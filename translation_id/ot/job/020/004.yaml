  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: id
  text: Tahukah engkau hal ini sejak dahulu kala, sejak manusia ditempatkan di atas bumi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲזֹאת
  choice: hal ini
  rationale: Kata tunjuk ini memperkenalkan isi pertanyaan retoris; “hal ini” alami dalam bahasa Indonesia dan tidak menambah penafsiran.
- source_word: יָדַעְתָּ
  choice: Tidakkah engkau mengetahui
  rationale: Bentuk perfektif orang kedua tunggal dalam pertanyaan retoris menyatakan pengetahuan yang semestinya telah dimiliki; bentuk negatif retoris ini menyampaikan daya pragmatisnya secara alami dalam bahasa Indonesia.
- source_word: מִנִּי עַד
  choice: sejak dahulu kala
  rationale: Ungkapan temporal ini menunjuk pada masa lampau yang sangat jauh; “sejak dahulu kala” jelas, wajar, dan bermartabat.
- source_word: מִנִּי שִׂים
  choice: sejak ... ditempatkan
  rationale: Frasa temporal ini menandai titik awal, yakni saat manusia ditempatkan; susunan pasif mempertahankan hubungan sintaksis sumber.
- source_word: שִׂים
  choice: ditempatkan
  rationale: Kata ini menyatakan bahwa manusia ditaruh atau ditempatkan di bumi; “ditempatkan” cocok dengan frasa lokatif berikutnya tanpa menentukan pelaku yang tidak dinyatakan.
- source_word: אָדָם
  choice: manusia
  rationale: Dalam konteks ini אָדָם dipakai secara generik bagi umat manusia. Bahasa Indonesia “manusia” mempertahankan baik bentuk tunggal kolektif maupun cakupan generiknya tanpa ambiguitas gender yang muncul dalam bahasa Inggris.
- source_word: עֲלֵי אָרֶץ
  choice: di atas bumi
  rationale: Padanan lokatif yang dekat dengan bentuk Ibrani dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan generik אָדָם dalam pernyataan antropologis
  choice: manusia
  alternative: umat manusia
  rationale: “Manusia” secara alami dapat bersifat tunggal kolektif dan generik dalam bahasa Indonesia, sehingga mewakili אָדָם tanpa mempersempitnya menjadi seorang laki-laki tertentu. “Umat manusia” mungkin, tetapi lebih eksplisit kolektif daripada bentuk sumber.
- issue: Pelaku dalam tindakan menempatkan manusia
  choice: dipertahankan tidak disebut melalui bentuk pasif “ditempatkan”
  alternative: Allah menempatkan manusia
  rationale: Teks Ibrani tidak menyebut pelaku secara eksplisit. Menambahkan “Allah” akan menyelesaikan sesuatu yang dibiarkan tersirat oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau”, sesuai ujaran langsung Zofar kepada Ayub. Pertanyaan dibuat retoris secara alami tanpa mengubah isi proposisional; diksi tetap jelas dan bermartabat.
