  text: בִּ/מְלֹ֣אות שִׂ֭פְק/וֹ יֵ֣צֶר ל֑/וֹ כָּל יַ֖ד עָמֵ֣ל תְּבוֹאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/022.yaml
  text: In the fullness of his abundance[a], distress will come upon him[b]; every hand of the miserable will come against him.
translation:
  language: id
  text: Ketika kelimpahannya mencapai puncak[a], ia akan terdesak; setiap tangan orang yang sengsara akan menimpanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Pada saat kecukupannya penuh.” Ungkapan Ibraninya padat; kata yang diterjemahkan “kelimpahannya” dapat juga berarti “kecukupannya,” “persediaannya,” atau “kemakmurannya.”
    reason: lexical_alternative
  - marker: b
    text: “Setiap tangan orang yang sengsara” dapat juga diterjemahkan “setiap tangan orang yang berjerih payah” atau “setiap tangan orang yang menderita.” “Tangan” dapat menyatakan kuasa atau tindakan, dan frasa Ibraninya ringkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְלֹאות
  choice: Di tengah
  rationale: Gabungan preposisi ב dan bentuk dari מלא memberi keadaan atau waktu ketika sesuatu berada dalam kepenuhannya. Dalam bahasa Indonesia, “di tengah” secara alami menyatakan bahwa kesesakan datang saat kelimpahan masih penuh, tanpa menghilangkan hubungan paradoksal ayat ini.
- source_word: שִׂפְקוֹ
  choice: kelimpahannya
  rationale: Nomina ini menunjuk pada kecukupan, persediaan yang cukup, atau kelimpahan. Dalam konteks kemakmuran orang fasik, “kelimpahannya” alami dan tetap mempertahankan cakupan makna kemakmuran material.
- source_word: יֵצֶר לוֹ
  choice: kesesakan akan menimpanya
  rationale: Ungkapan ini menyampaikan keadaan terjepit atau kesusahan yang datang atas seseorang. “Kesesakan akan menimpanya” mempertahankan citra penyempitan sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: כָּל יַד
  choice: setiap tangan
  rationale: Terjemahan harfiah ini mempertahankan metafora Ibrani tentang tangan sebagai pelaku atau kuasa. “Setiap” sesuai dengan daya distributif כָּל di depan nomina tunggal.
- source_word: עָמֵל
  choice: orang yang sengsara
  rationale: Dalam sastra hikmat, kata ini dapat menunjuk kepada orang yang mengalami jerih payah, penderitaan, atau kemalangan. “Orang yang sengsara” mempertahankan sisi penderitaannya tanpa mempersempit makna menjadi pekerja biasa.
- source_word: תְּבוֹאֶנּוּ
  choice: akan mendatanginya
  rationale: Bentuk בוא dengan sufiks objek secara dasar berarti datang kepadanya atau mengenainya. “Mendatanginya” mempertahankan ketidakjelasan mengenai apakah tangan itu menyerang, menekan, atau sekadar sampai kepadanya, alih-alih menambahkan unsur permusuhan yang tidak dinyatakan secara eksplisit oleh verba.
theological_decisions:
- issue: Identitas orang-orang yang disebut עָמֵל dan sifat tindakan tangan mereka
  choice: orang yang sengsara ... akan mendatanginya
  alternative: orang yang tertindas ... akan melawannya
  rationale: Teks dapat dipahami sebagai orang-orang menderita yang berbalik terhadap orang fasik, tetapi kata benda dan verba Ibraninya tidak secara eksplisit menyatakan bahwa mereka ditindas olehnya atau bahwa tindakan mereka adalah serangan. Terjemahan utama mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada sastra-hikmat yang bermartabat. Metafora “tangan” dan istilah “kesesakan” dipertahankan karena penting bagi citra Ibrani. Penanda catatan kaki [a] dan [b] keduanya dicantumkan dalam teks utama.
