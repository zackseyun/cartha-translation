base_translation:
  language: en
  yaml_path: translation/ot/job/020/024.yaml
  text: He will flee from an iron weapon[b][a]; a bronze bow will pierce him through.
translation:
  language: id
  text: Ia akan melarikan diri dari senjata besi[a]; busur perunggu akan menembusnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “senjata” juga dapat berarti persenjataan secara lebih umum.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “akan melewati dirinya.” Dalam konteks ini, maksudnya kemungkinan besar adalah menembus dirinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְרַח
  choice: akan melarikan diri
  rationale: Bentuk Qal imperfek orang ketiga tunggal maskulin dari ברח menyatakan tindakan melarikan diri; dalam konteks puitis tentang penghakiman yang akan menimpa orang fasik, nuansa futur paling sesuai.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: dari senjata besi
  rationale: נשק dapat menunjuk pada senjata atau persenjataan secara umum, sedangkan בַּרְזֶל berarti 'besi'. Frasa 'senjata besi' mempertahankan cakupan umum istilah Ibrani tanpa menentukan jenis senjatanya.
- source_word: תַּחְלְפֵהוּ
  choice: akan menembusnya
  rationale: Dalam gambaran serangan dengan busur, bentuk dari חלף secara harfiah menggambarkan sesuatu yang melewati atau menembus dirinya. 'Menembusnya' menyampaikan akibat yang tersirat secara alami dalam bahasa Indonesia.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: busur perunggu
  rationale: קֶשֶׁת adalah 'busur', dan נְחוּשָׁה menunjuk pada tembaga atau paduan perunggu; 'perunggu' paling wajar dalam gambaran persenjataan kuno.
