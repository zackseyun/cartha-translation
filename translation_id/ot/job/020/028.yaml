base_translation:
  language: en
  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: id
  text: Hasil rumahnya akan terbawa pergi[a], hanyut pada hari kemurkaannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan pergi ke pembuangan” atau “akan disingkirkan”; kata Ibrani ini dapat menyatakan pergi, dibuang, atau dipindahkan, di sini mengenai hasil atau kekayaan rumah orang fasik.
    reason: lexical_alternative
  - marker: b
    text: Kemungkinan besar yang dimaksud adalah kemurkaan Allah, meskipun bahasa Ibrani tidak menyebutkan rujukannya secara eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: akan terbawa pergi
  rationale: Bentuk Qal imperfek dari גלה menyatakan pergi, dipindahkan, atau dibawa ke pembuangan. Karena subjeknya adalah hasil milik rumah, frasa ini secara alami menyampaikan bahwa kekayaan itu akan lenyap terbawa tanpa menetapkan pelaku yang tidak disebutkan.
- source_word: יְבוּל
  choice: hasil
  rationale: Kata ini menunjuk pada hasil, perolehan, atau apa yang dihasilkan. Dalam konteks rumah orang fasik, “hasil” cukup luas untuk mencakup kekayaan atau perolehan rumah tangganya.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Terjemahan langsung ini mempertahankan gambaran Ibrani, sambil tetap memungkinkan arti yang lebih luas berupa rumah tangga atau seluruh miliknya.
- source_word: נִגָּרוֹת
  choice: hanyut
  rationale: Bentuk dari נגר menggambarkan sesuatu yang mengalir atau tercurah pergi. “Hanyut” mempertahankan citra gerak cair yang membawa hasil rumah itu lenyap dan terdengar alami dalam bahasa Indonesia.
- source_word: בְּיוֹם
  choice: pada hari
  rationale: Ungkapan temporal ini mempertahankan idiom dan nada khidmat teks Ibrani.
- source_word: אַפּוֹ
  choice: kemurkaannya
  rationale: Kata אַף di sini berarti amarah atau murka, dengan akhiran orang ketiga tunggal maskulin. Bentuk huruf kecil mempertahankan ketidakjelasan rujukan pronomina dalam bahasa Ibrani.
theological_decisions:
- issue: Rujukan akhiran pronomina dalam “kemurkaannya”
  choice: Rujukan tidak disebutkan secara eksplisit dalam teks utama.
  alternative: “kemurkaan Allah” atau kemurkaan orang fasik
  rationale: Konteks penghakiman paling mungkin menunjuk kepada kemurkaan Allah, tetapi bahasa Ibrani hanya memakai akhiran pronomina tanpa menyebut Allah. Terjemahan mempertahankan ketegangan ini dan menjelaskan pembacaan yang paling mungkin dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pilihan “hasil rumahnya” ringkas dan mempertahankan citra sumber, sedangkan “hanyut” menyampaikan gambaran mengalir atau tercurah pergi tanpa menambahkan pelaku.
