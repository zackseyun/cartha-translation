  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: id
  text: Ia tidak akan melihat aliran-aliran air[a], sungai-sungai, dan anak-anak sungai yang mengalir dengan madu dan dadih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saluran-saluran air, sungai-sungai, dan wadi-wadi yang mengalir dengan madu dan dadih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: Ia tidak akan melihat
  rationale: Dalam konteks puitis ini, אַל dengan bentuk imperfek menyatakan bahwa orang fasik tidak akan mengalami kelimpahan yang digambarkan. Bentuk futur negatif lebih sesuai daripada larangan ‘janganlah ia melihat’.
- source_word: בִפְלַגּוֹת
  choice: aliran-aliran air
  rationale: פְלַגּוֹת menunjuk pada saluran atau aliran air. Prefiks ב dipahami secara idiomatis bersama verba ‘melihat’, bukan diterjemahkan secara kaku sebagai ‘di dalam’.
- source_word: נַהֲרֵי
  choice: sungai-sungai
  rationale: Bentuk jamak konstruksi dari נָהָר dipertahankan sebagai unsur tersendiri dalam rangkaian gambaran kelimpahan.
- source_word: נַחֲלֵי
  choice: batang-batang air yang mengalirkan
  rationale: נַחַל dapat berarti batang air, wadi, atau alur sungai. ‘Batang air’ dapat mencakup alur air yang tetap maupun musiman, sedangkan ‘yang mengalirkan’ menyampaikan hubungan konstruksi dengan madu dan dadih secara alami.
- source_word: דְּבַשׁ
  choice: madu
  rationale: Padanan baku yang mempertahankan citra kelimpahan dalam puisi Ibrani.
- source_word: וְחֶמְאָה
  choice: dan dadih
  rationale: חֶמְאָה dapat berarti dadih, krim, atau mentega. ‘Dadih’ paling sesuai dengan gambaran produk susu tradisional dan tidak menyiratkan mentega olahan modern.
