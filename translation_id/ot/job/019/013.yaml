id: JOB.19.13
reference: Job 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: id
  text: Ia telah menjauhkan saudara-saudaraku dariku,[a] dan orang-orang yang mengenal aku telah sama sekali terasing dariku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia telah menyingkirkan saudara-saudaraku dari sisiku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “telah benar-benar menjadi orang asing bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Bentuk Ibrani secara harfiah berarti “saudara-saudara laki-lakiku,” tetapi dalam bahasa Indonesia bentuk “saudara-saudaraku” wajar dipakai tanpa harus mempersempitnya secara eksplisit pada jenis kelamin, sekaligus tetap lebih dekat daripada parafrasa “kaum kerabatku.”
- source_word: מֵעָלַי
  choice: dariku
  rationale: Gabungan preposisi ini, bersama verba הִרְחִיק, menyatakan pemindahan atau penjauhan dari lingkungan dan kedekatan Ayub. “Dariku” menghasilkan ungkapan Indonesia yang alami.
- source_word: הִרְחִיק
  choice: telah menjauhkan
  rationale: 'Bentuk Hifil ini bersifat kausatif: membuat seseorang menjadi jauh atau menempatkannya jauh. “Telah menjauhkan” mempertahankan daya kausatif dan ketajaman keluhan Ayub.'
- source_word: וְיֹדְעַי
  choice: dan orang-orang yang mengenal aku
  rationale: Ungkapan ini secara dekat berarti “orang-orang yang mengenal aku.” Pilihan tersebut mempertahankan gambaran relasional sumber dan lebih transparan daripada “kenalan-kenalanku.”
- source_word: אַךְ
  choice: sama sekali
  rationale: Dalam konteks ini אַךְ menguatkan keadaan keterasingan. “Sama sekali” menyampaikan intensitas atau kelengkapan tersebut secara alami.
- source_word: זָרוּ
  choice: telah ... terasing
  rationale: Verba ini menyatakan menjadi asing atau berlaku sebagai orang asing. “Telah terasing” mempertahankan nuansa keretakan hubungan dan keadaan yang dihasilkan.
- source_word: מִמֶּנִּי
  choice: dariku
  rationale: Preposisi מן menandai pemisahan, sehingga “dariku” mempertahankan arah relasional dalam teks Ibrani.
theological_decisions:
- issue: Subjek tersirat dari הִרְחִיק
  choice: Memakai “Ia” tanpa menyebut nama subjek secara eksplisit.
  alternative: “Allah telah menjauhkan saudara-saudaraku dariku.”
  rationale: Verba Ibrani memiliki subjek orang ketiga tunggal maskulin yang tidak disebutkan. Konteks menunjuk kepada Allah, tetapi “Ia” mempertahankan keekonomisan dan ketegangan ungkapan sumber tanpa menambahkan nama yang tidak tertulis dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Susunan klausa dibuat alami, sementara pengulangan “dariku” dipertahankan untuk menegaskan pemisahan relasional dalam teks Ibrani.
