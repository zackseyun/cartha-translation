  text: And after my skin has been destroyed[b][a], yet from my flesh I will see God.
translation:
  language: id
  text: Namun, setelah kulitku dihancurkan[a], dari dagingku aku akan melihat Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa ini sulit secara tekstual dan leksikal. Terjemahan yang lebih harfiah antara lain, “setelah mereka mengupas kulitku, ini.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “di dalam dagingku aku akan melihat Allah”; kemungkinan lain, “tanpa dagingku aku akan melihat Allah.” Ungkapan Ibraninya sulit dan telah dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר
  choice: Dan setelah
  rationale: Mempertahankan hubungan dengan baris sebelumnya melalui וְ dan makna temporal אַחַר, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: עוֹרִי
  choice: kulitku
  rationale: עוֹר berarti kulit atau belulang; dalam konteks tubuh manusia, “kulitku” paling alami dan mempertahankan gambaran jasmani penderitaan Ayub.
- source_word: נִקְּפוּ זֹאת
  choice: dihancurkan
  rationale: Ungkapan Ibrani ini sulit secara leksikal dan sintaksis. Bentuk pasif “dihancurkan” menyampaikan kerusakan kulit Ayub tanpa memaksakan terjemahan harfiah yang kabur; kesulitannya dijelaskan dalam catatan kaki.
- source_word: וּמִבְּשָׂרִי
  choice: namun dari dagingku
  rationale: מִן paling lazim berarti “dari”. “Namun” mencerminkan pertentangan kontekstual, sedangkan “dari dagingku” mempertahankan ungkapan konkret dan ambiguitas bahasa Ibrani.
- source_word: אֶחֱזֶה
  choice: aku akan melihat
  rationale: חזה berarti melihat atau memandang. “Aku akan melihat” jelas, alami, dan tetap menyampaikan kepastian bentuk verba Ibrani dalam konteks ini.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: אֱלוֹהַּ adalah sebutan tunggal bagi Allah yang lazim dalam kitab Ayub; “Allah” merupakan padanan baku dan langsung dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah וּמִבְּשָׂרִי secara tegas menyatakan kebangkitan tubuh
  choice: Mempertahankan ungkapan “dari dagingku” dalam teks utama.
  alternative: “di dalam dagingku” atau “tanpa dagingku”
  rationale: Preposisi dan sintaksis Ibraninya diperdebatkan. “Di dalam dagingku” lebih langsung menunjang pembacaan tentang kebangkitan tubuh, sedangkan “tanpa dagingku” menunjuk pada penglihatan tanpa tubuh. Teks utama tidak memilih salah satu tafsiran teologis tersebut secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan mempertahankan citra tubuh serta ketegangan teologis teks sumber, sementara dua kesulitan utama dijelaskan melalui catatan kaki.
