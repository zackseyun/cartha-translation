  yaml_path: translation/ot/job/019/002.yaml
  text: How long will you torment me and crush me with words?[a]
translation:
  language: id
  text: Berapa lama lagi kalian akan menyiksa batinku dan meremukkan aku dengan kata-kata?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Berapa lama lagi kalian akan mendukakan jiwaku dan meremukkan aku dengan kata-kata?”'
    reason: Alternatif ini mempertahankan padanan yang lebih harfiah bagi תּוֹגְיוּן נַפְשִׁי dan ambiguitas antara dukacita batin serta penderitaan yang lebih kuat.
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Berapa lama lagi
  rationale: Ungkapan keluhan temporal ini paling alami disampaikan dalam bahasa Indonesia sebagai pertanyaan retoris “Berapa lama lagi,” yang mempertahankan desakan emosional teks.
- source_word: תּוֹגְיוּן
  choice: akan menyiksa
  rationale: Bentuk kausatif dari יגה menyatakan tindakan mendatangkan dukacita atau penderitaan batin. “Menyiksa” mempertahankan intensitas keluhan Ayub, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: נַפְשִׁי
  choice: batinku
  rationale: נֶפֶשׁ di sini menunjuk pada diri Ayub dalam aspek batiniahnya. “Batinku” terdengar alami, menghindari kesan pembagian tubuh-jiwa yang tidak perlu, dan tetap mempertahankan dimensi batin yang lebih khusus daripada sekadar “aku.”
- source_word: וּתְדַכְּאוּנַנִי
  choice: dan meremukkan aku
  rationale: Akar דכא menggambarkan tindakan menghancurkan atau meremukkan. Pilihan ini mempertahankan metafora kekerasan dan kesejajaran dengan penderitaan pada klausa pertama.
- source_word: בְמִלִּים
  choice: dengan kata-kata
  rationale: 'Preposisi בְּ berfungsi instrumental: kata-kata mereka merupakan sarana yang meremukkan Ayub.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada keluhan yang lugas dan bermartabat. Bentuk jamak “kalian” memperjelas bahwa Ayub menyapa para sahabatnya. “Meremukkan” mempertahankan citra puitis Ibrani tanpa terdengar usang.
