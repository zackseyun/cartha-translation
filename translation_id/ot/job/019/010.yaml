  text: He tears me down on every side[a], and I am gone; he has uprooted my hope like a tree.
translation:
  language: id
  text: Ia merobohkan aku dari segala arah, sehingga aku binasa[a]; Ia mencabut harapanku seperti pohon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “dan aku pergi” atau “dan aku lenyap.” Secara harfiah, teks Ibrani berbunyi “dan aku pergi,” yang tampaknya menyatakan akibat dari dirobohkannya Ayub: ia hancur atau binasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: merobohkan aku
  rationale: Kata kerja נתץ menyatakan tindakan merobohkan atau menghancurkan sesuatu yang berdiri; pilihan ini mempertahankan daya rusaknya dan sesuai dengan gambaran kehancuran Ayub.
- source_word: סָבִיב
  choice: dari segala arah
  rationale: Kata ini berarti di sekeliling atau dari semua sisi dan menegaskan menyeluruhnya serangan terhadap Ayub.
- source_word: וָאֵלַךְ
  choice: sehingga aku binasa
  rationale: Secara harfiah berarti 'dan aku pergi', tetapi dalam konteks kehancuran dapat menyatakan akibat berupa lenyap atau binasanya Ayub. Kata 'sehingga' memperjelas hubungan akibat yang tersirat.
- source_word: וַיַּסַּע
  choice: Ia mencabut
  rationale: נסע dapat berarti menarik atau mencabut sesuatu dari tempatnya. Bersama perbandingan dengan pohon, 'mencabut' mempertahankan gambaran sesuatu yang dicabut dari akarnya tanpa harus menambahkan kata 'akar' yang tidak terdapat dalam teks.
- source_word: כָּעֵץ
  choice: seperti pohon
  rationale: Terjemahan langsung dan alami bagi frasa perbandingan ini.
- source_word: תִּקְוָתִי
  choice: harapanku
  rationale: תִּקְוָה berarti harapan atau pengharapan; 'harapanku' alami dalam ratapan pribadi Ayub.
theological_decisions:
- issue: Identitas subjek orang ketiga tunggal
  choice: Ia
  alternative: Dia
  rationale: Konteks menunjuk kepada Allah sebagai pelaku, tetapi ayat ini memakai pronomina tersirat tanpa menyebut nama-Nya. 'Ia' mempertahankan rujukan itu dalam ragam Alkitab Indonesia yang wajar tanpa menambahkan sebutan ilahi.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Susunan kalimat mempertahankan paralelisme puitis serta metafora perobohan dan pencabutan pohon. Penanda catatan kaki [a] ditempatkan sesudah frasa yang menerjemahkan וָאֵלַךְ.
