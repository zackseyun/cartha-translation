  text: אִם אָ֭מְנָם עָלַ֣/י תַּגְדִּ֑ילוּ וְ/תוֹכִ֥יחוּ עָ֝לַ֗/י חֶרְפָּתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/005.yaml
  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
translation:
  language: id
  text: Jika kamu memang meninggikan diri terhadap aku[a] dan menjadikan kehinaanku bukti untuk melawan aku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membesarkan diri atas aku.” Kata kerja Ibrani ini dapat menggambarkan tindakan meninggikan diri dengan merendahkan orang lain.
    reason: lexical_alternative
  - marker: b
    text: Atau “memperkarakan kehinaanku untuk melawan aku” atau “menggunakan kehinaanku sebagai bukti untuk melawan aku.” Kata kerja Ibrani ini dapat bernuansa hukum, yaitu membuktikan atau menegakkan suatu perkara.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אָמְנָם
  choice: Jika kamu memang
  rationale: אִם memperkenalkan syarat, sedangkan אָמְנָם menegaskannya. Gabungan “jika ... memang” alami dalam bahasa Indonesia dan mempertahankan daya kondisional serta penekanannya.
- source_word: עָלַי תַּגְדִּילוּ
  choice: meninggikan diri terhadap aku
  rationale: Bentuk Hifil dari גדל di sini menyatakan tindakan menjadikan diri besar atau meninggikan diri dengan merendahkan pihak lain. “Terhadap aku” mempertahankan nuansa permusuhan dari עָלַי.
- source_word: וְתוֹכִיחוּ עָלַי
  choice: dan menjadikan ... bukti untuk melawan aku
  rationale: 'Hifil יכח dapat memiliki nuansa forensik: membuktikan, mengajukan alasan, atau menegakkan perkara. Rumusan ini menyampaikan bahwa kehinaan Ayub dipakai sebagai bukti dalam perkara melawan dirinya.'
- source_word: חֶרְפָּתִי
  choice: kehinaanku
  rationale: חֶרְפָּה menunjuk pada cela, aib, atau kehinaan sosial. “Kehinaanku” wajar, bermartabat, dan tetap dapat berarti keadaan hina maupun penghinaan yang ditanggung Ayub.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang tetap dekat pada struktur Ibrani. Ungkapan “menjadikan kehinaanku bukti” dipilih agar nuansa forensik terbaca secara alami tanpa meniadakan kemungkinan makna “memperkarakan” atau “membuktikan.”
