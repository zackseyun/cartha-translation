  yaml_path: translation/ot/job/019/023.yaml
  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: id
  text: Ah, sekiranya sekarang perkataanku dituliskan! Ah, sekiranya perkataanku ditorehkan[b] dalam sebuah kitab[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam sebuah gulungan” atau “dalam sebuah dokumen tertulis”; kata Ibrani סֵפֶר dapat merujuk pada kitab, gulungan, atau dokumen.
    reason: cultural_note
  - marker: b
    text: Atau “diukirkan”; kata kerjanya menyiratkan penginskripsian yang tahan lama, bukan sekadar penulisan biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah, sekiranya
  rationale: Ungkapan idiomatis ini menyatakan harapan yang kuat, bukan pertanyaan harfiah tentang siapa yang akan memberi. “Ah, sekiranya” menyampaikan daya optatif dan emosi itu secara wajar dalam bahasa Indonesia.
- source_word: אֵפוֹ
  choice: sekarang
  rationale: Partikel ini memberi penekanan dan rasa mendesak pada harapan Ayub; “sekarang” mempertahankan nuansa tersebut tanpa penjelasan tambahan.
- source_word: וְיִכָּתְבוּן
  choice: dituliskan
  rationale: Bentuk pasif ini menyatakan keinginan agar perkataan Ayub dicatat. “Dituliskan” alami dan mempertahankan gagasan perekaman secara tertulis.
- source_word: מִלָּי
  choice: perkataanku
  rationale: Pilihan ini langsung menyampaikan perkataan atau ucapan Ayub dan berfungsi alami sebagai nomina kolektif dalam bahasa Indonesia.
- source_word: בַּסֵּפֶר
  choice: dalam sebuah kitab
  rationale: סֵפֶר dapat menunjuk pada kitab, gulungan, atau dokumen tertulis. “Kitab” cocok dengan ragam bermartabat dan konteks kuno, sedangkan keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: וְיֻחָקוּ
  choice: ditorehkan
  rationale: Kata kerja חקק mengandung gagasan menggoreskan atau menginskripsikan secara menetap. “Ditorehkan” mempertahankan kesan tahan lama sekaligus tetap dapat dipahami dalam konteks pencatatan.
