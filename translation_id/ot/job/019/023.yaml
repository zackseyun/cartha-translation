  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pengulangan “Ah, sekiranya” mempertahankan struktur emosional teks Ibrani. “Perkataanku” diulang pada klausa kedua untuk memperjelas rujukan yang tersirat dalam bahasa sumber. Kedua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
