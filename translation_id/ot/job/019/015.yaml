  text: גָּ֘רֵ֤י בֵיתִ֣/י וְ֭/אַמְהֹתַ/י לְ/זָ֣ר תַּחְשְׁבֻ֑/נִי נָ֝כְרִ֗י הָיִ֥יתִי בְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/015.yaml
  text: The guests in my house and my female servants count me as a stranger; I have become a foreigner in their eyes.
translation:
  language: id
  text: Orang-orang yang menumpang di rumahku dan hamba-hamba perempuanku menganggap aku sebagai orang asing; di mata mereka aku telah menjadi orang luar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: Orang-orang yang menumpang di rumahku
  rationale: גָּרֵי adalah bentuk jamak konstruksi dari גֵּר, yaitu orang yang tinggal sementara atau menumpang. Ungkapan ini mempertahankan nuansa penghuni bukan anggota tetap rumah tangga tanpa mempersempitnya menjadi tamu singkat.
- source_word: אַמְהֹתַי
  choice: hamba-hamba perempuanku
  rationale: אָמָה menunjuk hamba perempuan; terjemahan ini jelas dan wajar dalam bahasa Indonesia serta mempertahankan jenis kelamin yang dinyatakan teks sumber.
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: menganggap aku sebagai orang asing
  rationale: זָר menggambarkan seseorang yang tidak dikenal atau bukan bagian dari kelompok, sedangkan חשׁב berarti memperhitungkan atau menganggap.
- source_word: נָכְרִי הָיִיתִי בְעֵינֵיהֶם
  choice: di mata mereka aku telah menjadi orang luar
  rationale: נָכְרִי dapat berarti orang asing atau orang luar. 'Orang luar' membedakannya dari זָר pada klausa sebelumnya sambil mempertahankan paralelisme dan rasa keterasingan sosial.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa mempertahankan paralelisme Ibrani dan perkembangan dari dianggap asing menjadi orang luar di mata seisi rumah.
