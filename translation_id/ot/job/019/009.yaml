  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: id
  text: Ia telah melucuti aku dari kehormatanku dan mengambil mahkota dari kepalaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemuliaanku” atau “martabatku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: kehormatanku
  rationale: כָּבוֹד dapat berarti kehormatan, kemuliaan, atau martabat/status. Dalam ratapan Ayub tentang penghinaan dan hilangnya kedudukan, “kehormatanku” menyampaikan makna sosialnya secara alami tanpa memberi kesan teologis yang tidak perlu.
- source_word: מֵעָלַי
  choice: dariku
  rationale: Secara harfiah berarti “dari atasku,” tetapi sesudah metafora menanggalkan, “dariku” merupakan ungkapan Indonesia yang wajar dan tetap menyatakan penyingkiran.
- source_word: הִפְשִׁיט
  choice: telah menanggalkan
  rationale: Kata kerja ini menggambarkan tindakan melucuti atau menanggalkan sesuatu yang dikenakan. Pilihan ini mempertahankan metafora kuat bahwa Ayub dilucuti dari kehormatannya.
- source_word: וַיָּסַר
  choice: mengambil
  rationale: Bentuk kausatif dari סור berarti menyingkirkan atau mengambil. “Mengambil” terdengar alami dalam hubungan dengan mahkota yang diambil dari kepala serta mempertahankan kesejajaran puitis.
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Kata ini menunjuk pada mahkota atau karangan kepala sebagai lambang kehormatan dan kedudukan. “Mahkota” paling jelas mempertahankan citra tersebut.
- source_word: רֹאשִׁי
  choice: kepalaku
  rationale: Konstruksi posesif ini diterjemahkan langsung karena gambaran mahkota yang berada di kepala merupakan inti metafora baris kedua.
theological_decisions:
- issue: Pelaku yang tidak disebutkan namanya
  choice: Kata ganti “Ia” secara kontekstual merujuk kepada Allah sebagai pihak yang mempermalukan Ayub.
  alternative: Seorang lawan atau keadaan yang tidak disebutkan.
  rationale: Dalam konteks langsung, Ayub menghubungkan penderitaannya dengan tindakan Allah. Terjemahan mempertahankan kata ganti orang ketiga tanpa menambahkan nama “Allah,” sehingga keringkasan dan ketegangan teologis teks Ibrani tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku yang modern, puitis, dan mudah dipahami. “Ia” mempertahankan subjek tersirat secara kontekstual tanpa memperjelasnya secara berlebihan; dua metafora kehilangan kehormatan dan mahkota dipertahankan.
