base_translation:
  language: en
  yaml_path: translation/ot/job/019/019.yaml
  text: All my intimate friends abhor me[a], and those whom I loved have turned against me.
translation:
  language: id
  text: Semua sahabat karibku[a] merasa jijik terhadap aku, dan orang-orang yang kukasihi telah berbalik melawan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang-orang dalam persekutuan rahasiaku,” yakni lingkaran orang kepercayaan atau teman dekat Ayub.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: merasa jijik terhadap aku
  rationale: Kata kerja תעב menyatakan rasa muak atau jijik yang kuat, bukan sekadar tidak suka. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan intensitas ratapan Ayub.
- source_word: כָּל
  choice: semua
  rationale: Kuantor ini mencakup seluruh kelompok yang dimaksud dan paling wajar diterjemahkan 'semua'.
- source_word: מְתֵי סוֹדִי
  choice: sahabat karibku
  rationale: Secara harfiah frasa ini menunjuk kepada 'orang-orang dalam persekutuan rahasiaku', yaitu lingkaran orang kepercayaan atau teman akrab Ayub. 'Sahabat karibku' menyampaikan kedekatan dan kepercayaan secara alami.
- source_word: וְזֶה
  choice: dan orang-orang
  rationale: Walaupun זֶה berbentuk tunggal, kata kerja jamak sesudahnya dan paralelisme menunjukkan rujukan kolektif. 'Orang-orang' mempertahankan makna itu dalam bahasa Indonesia yang wajar.
- source_word: אָהַבְתִּי
  choice: yang kukasihi
  rationale: Bentuk qatal menyatakan kasih Ayub kepada mereka; konstruksi relatif ini alami dan tidak perlu membatasi kasih itu hanya pada masa lampau.
- source_word: נֶהְפְּכוּ
  choice: telah berbalik
  rationale: Bentuk nifal dari הפך menyatakan perubahan atau pembalikan sikap. 'Telah berbalik' mempertahankan gambaran peralihan tersebut.
- source_word: בִי
  choice: melawan aku
  rationale: Dalam konteks permusuhan, preposisi בְּ memiliki arti adversatif. 'Melawan aku' menyampaikan arah perubahan sikap tanpa menambahkan sebab.
