  text: These ten times you have humiliated me[a]; you are not ashamed to wrong me.
translation:
  language: id
  text: Sudah sepuluh kali kalian mempermalukan aku; kalian tidak malu memperlakukan aku sebagai orang asing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbuat salah terhadap aku,” “memperlakukan aku dengan kasar,” atau “memperlakukan aku dengan buruk.” Kata kerja Ibraninya sulit dipastikan dan dapat menggambarkan sikap terhadap Ayub seolah-olah ia orang asing atau tidak dikenal.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: Sudah sepuluh kali
  rationale: Ungkapan bilangan Ibrani dipertahankan untuk menjaga daya retoris keluhan Ayub; 'sudah' membuatnya alami dalam bahasa Indonesia dan menandai tindakan yang berulang hingga saat ini.
- source_word: תַּכְלִימוּנִי
  choice: kalian mempermalukan aku
  rationale: Bentuk Hifil dari כלם menyatakan tindakan menyebabkan malu atau hina. 'Mempermalukan' mempertahankan daya kausatif dan penghinaan pribadi yang dialami Ayub.
- source_word: לֹא תֵבֹשׁוּ
  choice: kalian tidak malu
  rationale: בוש menunjuk pada rasa malu. Terjemahan ini langsung, alami, dan mempertahankan tuduhan moral Ayub kepada para sahabatnya.
- source_word: תַּהְכְּרוּ לִי
  choice: memperlakukan aku sebagai orang asing
  rationale: Bentuk Hifil yang sulit dari נכר dapat menggambarkan tindakan memperlakukan seseorang sebagai asing atau tidak dikenal. Pilihan yang lebih harfiah ini mempertahankan citra keterasingan tanpa membatasi maknanya hanya pada perlakuan buruk secara umum.
theological_decisions: []
