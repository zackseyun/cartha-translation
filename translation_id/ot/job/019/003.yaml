  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti jamak 'kalian' dipakai karena bentuk-bentuk verba Ibrani ditujukan kepada beberapa sahabat Ayub. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkannya.
