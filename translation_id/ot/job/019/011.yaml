  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: id
  text: Murka-Nya menyala terhadap aku, dan Ia menganggap aku sebagai salah satu dari musuh-musuh-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Murka-Nya berkobar terhadap aku, dan Ia memperhitungkan aku sebagai salah satu dari lawan-lawan-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַר ... אַפּוֹ
  choice: Murka-Nya menyala
  rationale: Gabungan חרה dengan אַף adalah ungkapan tentang amarah yang menyala. Terjemahan ini mempertahankan metafora Ibrani dalam bahasa Indonesia yang wajar dan bermartabat; bentuk lampau wayyiqtol dipahami dalam rangkaian keluhan puitis, tetapi bahasa Indonesia tidak wajib menandainya secara eksplisit.
- source_word: עָלַי
  choice: terhadap aku
  rationale: Dengan kata yang menyatakan murka, עַל menunjukkan arah permusuhan kepada Job. 'Terhadap aku' alami dan mempertahankan daya adversatifnya.
- source_word: וַיַּחְשְׁבֵנִי
  choice: Ia menganggap aku
  rationale: חשב di sini berarti memandang atau memperhitungkan seseorang sebagai sesuatu. 'Menganggap' paling alami dalam bahasa Indonesia modern.
- source_word: לוֹ
  choice: musuh-Nya
  rationale: Pronomina datif menyatakan relasi dari sudut pandang Allah dan secara alami tercakup oleh akhiran posesif '-Nya'.
- source_word: כְצָרָיו
  choice: sebagai salah seorang musuh-Nya
  rationale: Bentuk Ibrani harfiah adalah 'seperti/sebagai musuh-musuh-Nya'. Karena objeknya tunggal ('aku') sedangkan pelengkapnya jamak, 'salah seorang musuh-Nya' mempertahankan bentuk jamak dan menghasilkan kalimat Indonesia yang alami.
theological_decisions:
- issue: Rujukan subjek orang ketiga dan akhiran pronominal
  choice: Huruf kapital pada 'Ia' dan '-Nya' menunjukkan bahwa rujukannya adalah Allah, sesuai konteks keluhan Job dalam 19:6-12.
  alternative: Agen bermusuhan yang tidak disebutkan secara khusus.
  rationale: Konteks langsung secara berulang mengaitkan tindakan-tindakan ini dengan Allah. Terjemahan mempertahankan ketegangan teologis dalam tuduhan Job dan tidak melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. 'Murka' dipilih untuk kekuatan אַף dalam konteks ini, sedangkan 'menyala' mempertahankan metafora sumber. Bentuk 'salah seorang musuh-Nya' menghindari ketidakalamian 'menganggap aku sebagai musuh-musuh-Nya' tanpa menghilangkan jamak Ibrani.
