  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: id
  text: Kerabatku telah meninggalkan aku[a], dan orang-orang yang kukenal telah melupakan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Kerabatku telah berhenti.” Ungkapan ini dapat berarti bahwa mereka tidak lagi hadir atau tidak lagi dekat denganku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ
  choice: telah menjauh dariku
  rationale: Makna dasarnya ialah ‘berhenti’ atau ‘tidak lagi’. Dengan kaum kerabat sebagai subjek, ungkapan ini secara wajar menyampaikan bahwa mereka tidak lagi hadir atau berhubungan dengan Ayub, tanpa menambahkan gagasan pertolongan yang tidak dinyatakan secara eksplisit.
- source_word: קְרוֹבָי
  choice: kaum kerabatku
  rationale: Secara harfiah berarti ‘orang-orang dekatku’ dan dalam konteks ini paling wajar menunjuk kepada sanak saudara atau kerabat.
- source_word: וּמְיֻדָּעַי
  choice: orang-orang yang mengenalku
  rationale: Bentuk ini menunjuk kepada orang-orang yang dikenal atau akrab dengan Ayub. Terjemahan ini mempertahankan hubungan dengan akar ידע, ‘mengenal’, tanpa melebihkan tingkat keakraban menjadi ‘sahabat’.
- source_word: שְׁכֵחוּנִי
  choice: telah melupakan aku
  rationale: Terjemahan langsung dari kata kerja ‘melupakan’, yang mempertahankan kekuatan ratapan Ayub.
