base_translation:
  language: en
  yaml_path: translation/ot/job/019/007.yaml
  text: Look[a], I cry out, “Violence!” but I am not answered; I cry for help[c][b], but there is no justice.
translation:
  language: id
  text: Sungguh[a], aku berteriak, “Kekerasan!” tetapi aku tidak dijawab; aku berseru minta tolong[b], tetapi tidak ada keadilan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lihatlah.” Kata Ibrani ini memperkenalkan pernyataan dengan penegasan dan menarik perhatian.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku berteriak minta pertolongan.” Kata kerjanya menyatakan permohonan mendesak untuk memperoleh bantuan.
    reason: lexical_alternative
  - marker: c
    text: Atau “tidak ada putusan hukum” atau “tidak ada penyelesaian hukum.” Kata Ibrani ini dapat menunjuk pada keadilan maupun keputusan hukum yang semestinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian dengan penegasan. “Lihatlah” mempertahankan daya deiktisnya dalam bahasa Indonesia modern tanpa menjadi terlalu arkais.
- source_word: אֶצְעַק
  choice: aku berteriak
  rationale: Bentuk dari צעק menyatakan seruan keras dalam kesusahan. “Berteriak” menyampaikan kerasnya suara dan mendesaknya keluhan Ayub.
- source_word: חָמָס
  choice: Kekerasan!
  rationale: Nomina ini dapat berarti kekerasan, kelaliman, atau pelanggaran yang memicu gugatan. Sebagai seruan pengaduan, “Kekerasan!” merupakan padanan langsung dan tetap membuka nuansa hukum melalui catatan kaki.
- source_word: אֵעָנֶה
  choice: aku tidak dijawab
  rationale: Bentuk nifal dari ענה paling wajar dipahami secara pasif, yaitu “dijawab.” Pilihan ini mempertahankan hubungan verbal antara seruan Ayub dan tidak adanya jawaban, tanpa menafsirkannya sekadar sebagai tidak didengar.
- source_word: אֲשַׁוַּע
  choice: aku berseru minta tolong
  rationale: Verba שׁוע menunjuk pada seruan mendesak untuk memperoleh pertolongan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan paralelisme dengan seruan pada klausa pertama.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks gugatan Ayub, istilah ini mencakup keadilan, keputusan hukum yang semestinya, dan pemulihan melalui pengadilan. “Keadilan” menyampaikan makna hukum dan moral secara alami, sementara alternatifnya dicatat.
theological_decisions:
- issue: Sifat keluhan Ayub terhadap Allah
  choice: Menerjemahkan ayat ini sebagai ratapan tentang seruan yang tidak dijawab dan tidak adanya keadilan, tanpa memperlunak tuduhan Ayub.
  alternative: Mengungkapkannya secara lebih tidak langsung agar tidak terkesan bahwa Allah menahan keadilan.
  rationale: Teks Ibrani secara tegas menampilkan Ayub yang meneriakkan adanya kekerasan, tidak menerima jawaban, dan tidak menemukan keadilan. Ketegangan teologis ini perlu dipertahankan, bukan diselesaikan di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Orang pertama “aku” sesuai dengan tuturan langsung Ayub. Paralelisme kedua seruan dipertahankan, dan tanda seru pada “Kekerasan!” menampilkan kata itu sebagai isi pengaduan hukum yang lantang.
