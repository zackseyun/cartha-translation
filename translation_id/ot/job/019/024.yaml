  text: with an iron stylus and lead[b][a], may they be engraved in the rock forever!
translation:
  language: id
  text: dengan alat pengukir besi dan timbal[a], kiranya perkataan itu dipahat pada batu karang untuk selama-lamanya![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Timbal di sini adalah logam yang juga disebut timah hitam. Mungkin logam ini digunakan bersama alat besi, misalnya untuk mengisi guratan huruf agar lebih jelas terlihat, tetapi teks tidak menjelaskan fungsinya.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan, “kiranya perkataan itu diukir pada batu karang untuk selama-lamanya.” Kata Ibrani yang dipakai biasanya berarti “memahat” atau “memotong.” Di sini kata itu menggambarkan perkataan yang ditorehkan secara permanen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵט
  choice: dengan pena
  rationale: עֵט adalah alat untuk menulis atau menggores. Karena alat itu terbuat dari besi dan digunakan pada batu karang, yang dimaksud ialah pena pengukir, bukan pena bertinta; kata “pena” mempertahankan gambaran penulisan secara alami dalam bahasa Indonesia.
- source_word: בַּרְזֶל
  choice: besi
  rationale: Istilah bahan yang langsung dan tidak ambigu; besi menerangkan bahan pena tersebut.
- source_word: וְעֹפָרֶת
  choice: dan timah
  rationale: עֹפָרֶת menunjuk pada logam timah hitam (timbal). Teks hanya menyebut logam itu tanpa menerangkan fungsinya, sehingga terjemahan utama tidak menambahkan dugaan penggunaannya.
- source_word: לָעַד
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan ketahanan yang terus berlangsung dan cocok dengan harapan agar perkataan Ayub diabadikan.
- source_word: בַּצּוּר
  choice: pada batu karang
  rationale: צוּר berarti batu karang atau cadas. Preposisi ב dapat dipahami secara lokatif; “pada batu karang” alami untuk permukaan yang dipahat, sementara tindakan memahat sendiri menyiratkan bahwa tulisan masuk ke dalam batu.
- source_word: יֵחָצְבוּן
  choice: kiranya semuanya dipahat
  rationale: Bentuk ini berasal dari חצב, “memahat/memotong.” Dalam konteks perkataan yang hendak diabadikan pada batu, “dipahat” mempertahankan citra konkret tindakan tersebut. Bentuk imperfek melanjutkan nuansa harapan dari ayat sebelumnya, ditandai dengan “kiranya”; subjek jamaknya merujuk pada perkataan Ayub.
