  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Pena besi” mempertahankan metafora alat tulis sambil tetap jelas dalam konteks pemahatan; “semuanya” mengacu pada perkataan yang disebut dalam ayat sebelumnya. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
