  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Susunan kalimat mempertahankan gerak ratapan Ibrani, sedangkan ungkapan permusuhan diterjemahkan secara jelas tanpa menambahkan bentuk ejekan tertentu yang tidak dinyatakan oleh teks.
