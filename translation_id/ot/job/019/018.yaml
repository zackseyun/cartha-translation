id: JOB.19.18
reference: Job 19:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: id
  text: Bahkan anak-anak kecil[a] menghina aku; ketika aku berdiri, mereka berbicara menentang aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang bodoh,” “orang-orang kurang ajar,” atau “anak-anak muda.” Istilah Ibrani עֲוִילִים biasanya menunjuk kepada orang yang bodoh atau tidak berakal secara moral, tetapi dalam konteks ini banyak yang memahaminya sebagai anak-anak atau kaum muda yang belum matang dan berkedudukan rendah yang mengejek Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: 'Menyampaikan penekanan sekaligus kelanjutan ratapan Ayub: bahkan mereka yang paling tidak disangka pun turut merendahkannya.'
- source_word: עֲוִילִים
  choice: anak-anak kecil
  rationale: Istilah ini dapat menunjuk kepada orang bodoh atau tidak berakal secara moral, tetapi dalam konteks ini kemungkinan mengacu kepada anak-anak atau kaum muda yang belum matang dan berkedudukan rendah. Pilihan ini menonjolkan dalamnya penghinaan sosial yang dialami Ayub, sedangkan ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: מָאֲסוּ בִי
  choice: menghina aku
  rationale: Kata kerja מָאַס menyatakan penolakan yang disertai sikap meremehkan. 'Menghina' menyampaikan nada permusuhan dan penghinaan secara wajar dalam bahasa Indonesia.
- source_word: אָקוּמָה
  choice: ketika aku berdiri
  rationale: 'Dalam konteks ini bentuk tersebut berfungsi secara alami sebagai keterangan waktu: saat atau setiap kali Ayub berdiri, mereka berbicara menentangnya. ''Berdiri'' menghindari kemungkinan asosiasi lain dari ''bangkit'' dan menyatakan tindakan fisik dengan jelas.'
- source_word: וַיְדַבְּרוּ בִי
  choice: mereka berbicara menentang aku
  rationale: Preposisi ב dengan דּבר memiliki nuansa bermusuhan dalam konteks ini. Terjemahan ini mempertahankan tindakan berbicara tanpa mempersempitnya secara berlebihan menjadi tindakan tertentu seperti mengejek atau memfitnah.
theological_decisions: []
