  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: id
  text: Mengapa kalian mengejar aku seperti Allah[a] dan tidak juga puas dengan dagingku?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti seorang ilah.” Kata Ibrani אֵל juga dapat berarti “ilah”, atau—meski kemungkinannya lebih kecil di sini—“yang perkasa”.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “dari dagingku.” Ungkapan ini tampaknya menggambarkan mereka seolah-olah memangsa daging Ayub sendiri tetapi tetap tidak kenyang—gambaran tajam tentang permusuhan tanpa henti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya ini membuka protes Ayub dan secara langsung berarti “mengapa”.
- source_word: תִּרְדְּפֻנִי
  choice: kalian mengejar aku
  rationale: Kata kerja רדף berarti mengejar, memburu, atau menganiaya. “Mengejar” mempertahankan gambaran pengejaran yang bermusuhan tanpa mempersempitnya menjadi jenis penganiayaan tertentu; “kalian” menyatakan bentuk jamak yang merujuk kepada sahabat-sahabat Ayub.
- source_word: כְמוֹ
  choice: seperti
  rationale: Partikel perbandingan ini paling wajar diterjemahkan “seperti” dalam bahasa Indonesia modern.
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks ini, referen yang paling mungkin adalah Allah, sebab Ayub membandingkan pengejaran para sahabatnya dengan tindakan ilahi yang dirasakannya. Kemungkinan arti umum “ilah” tetap dicatat dalam catatan kaki.
- source_word: וּמִבְּשָׂרִי
  choice: dan ... dengan dagingku
  rationale: Secara harfiah frasa ini berbunyi “dan dari dagingku”. Bersama kata שבע, preposisi מִן dapat menyatakan sesuatu yang menjadi sumber kepuasan atau kekenyangan. “Dengan dagingku” alami dalam bahasa Indonesia dan mempertahankan gambaran jasmani yang tajam.
- source_word: לֹא תִשְׂבָּעוּ
  choice: tidak juga puas
  rationale: Kata שבע berarti menjadi kenyang atau puas. “Tidak juga puas” menyampaikan pertanyaan retoris tentang permusuhan yang tak kunjung cukup, tanpa menambahkan tindakan makan secara eksplisit.
theological_decisions:
- issue: Referen אֵל dalam perbandingan כְמוֹ אֵל
  choice: Allah
  alternative: seorang ilah; Yang Mahakuasa
  rationale: 'Konteks ratapan Ayub paling mungkin menunjuk kepada Allah: para sahabatnya memperlakukannya dengan keras seolah-olah melanjutkan serangan atau penghakiman ilahi. Namun, karena אֵל secara leksikal juga dapat berarti “ilah” atau, lebih jarang di sini, “yang perkasa”, ambiguitas itu dicatat dan tidak disembunyikan.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti “kalian” dipakai untuk memperlihatkan bahwa verba Ibrani berbentuk jamak dan Ayub sedang menyapa para sahabatnya. Susunan kalimat mempertahankan satu pertanyaan retoris serta citra konkret “dagingku”.
