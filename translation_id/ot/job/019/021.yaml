  text: חָנֻּ֬/נִי חָנֻּ֣/נִי אַתֶּ֣ם רֵעָ֑/י כִּ֥י יַד אֱ֝ל֗וֹהַּ נָ֣גְעָה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: id
  text: Kasihanilah aku[a], kasihanilah aku, hai sahabat-sahabatku, sebab tangan Allah telah menghantam aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bermurah hatilah kepadaku” atau “Tunjukkanlah belas kasihan kepadaku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telah menyentuh aku”; dalam konteks ini ungkapan tersebut menunjukkan tindakan yang mencelakakan atau menimpakan penderitaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: Kasihanilah aku
  rationale: Bentuk imperatif jamak dari חנן ditujukan kepada para sahabat Ayub. Dalam konteks ini, Ayub memohon perlakuan yang penuh belas kasihan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan desakan permohonannya.
- source_word: חָנֻּנִי (diulang)
  choice: kasihanilah aku
  rationale: Pengulangan dipertahankan untuk menyampaikan urgensi emosional dan penegasan puitis dalam permohonan Ayub.
- source_word: רֵעָי
  choice: hai sahabat-sahabatku
  rationale: רֵעַ berarti sahabat atau rekan. Bentuk sapaan dengan “hai” menyampaikan panggilan langsung secara wajar dan bermartabat, sedangkan akhiran “-ku” mempertahankan unsur kepunyaan dalam bahasa Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi permohonan Ayub. “Sebab” jelas, alami, dan sesuai dengan register puitis yang tetap mudah dipahami.
- source_word: יַד אֱלוֹהַּ
  choice: tangan Allah
  rationale: Metafora Ibrani bagi tindakan atau kuasa ilahi dipertahankan, bukan diratakan menjadi ungkapan abstrak.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: אֱלוֹהַּ adalah bentuk tunggal puitis untuk Allah yang sering muncul dalam kitab Ayub. Tidak ada dasar dalam konteks langsung untuk menambahkan gelar lain.
- source_word: נָגְעָה בִּי
  choice: telah menghantam aku
  rationale: נגע dengan preposisi ב dapat berarti menyentuh, menyerang, atau menimpakan penderitaan. Dalam konteks penderitaan Ayub, “menghantam aku” menyampaikan dampak yang mencelakakan secara konkret, sementara catatan kaki mempertahankan arti harfiahnya.
theological_decisions:
- issue: Peran Allah dalam penderitaan Ayub
  choice: tangan Allah telah menghantam aku
  alternative: tangan Allah telah menyentuh aku; tangan Allah telah menimpakan penderitaan kepadaku
  rationale: Teks Ibrani secara eksplisit mengaitkan penderitaan Ayub dengan tindakan Allah melalui metafora “tangan Allah”. Terjemahan mempertahankan ketegangan teologis tersebut tanpa memperhalus, membela, atau menyistematisasikannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan permohonan serta metafora “tangan Allah” dipertahankan. “Hai sahabat-sahabatku” menandai sapaan langsung tanpa terdengar kuno secara berlebihan.
