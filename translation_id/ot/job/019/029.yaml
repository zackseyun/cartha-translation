  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: id
  text: Takutlah kamu sendiri akan pedang, sebab murka mendatangkan hukuman oleh pedang, supaya kamu tahu bahwa ada penghakiman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani terakhir sulit. Ungkapan itu juga dapat dipahami sebagai “bahwa Yang Mahakuasa ada”, “bahwa ada berbagai penghakiman”, atau “bahwa ada seorang hakim”.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ
  choice: Hendaklah ... takut
  rationale: Bentuk imperatif jamak ini menyampaikan peringatan agar para lawan bicara merasa takut atau gentar; bentuk “hendaklah ... takut” alami dan tetap bernada tegas dalam bahasa Indonesia.
- source_word: לָכֶם
  choice: kamu sendiri
  rationale: Pronomina datif ini memberi penekanan kepada orang-orang yang diperingatkan. “Kamu sendiri” mempertahankan tekanan tersebut tanpa menambahkan gagasan yang tidak tersurat.
- source_word: מִפְּנֵי חֶרֶב
  choice: terhadap pedang
  rationale: Gabungan preposisi ini menunjukkan sesuatu yang harus ditakuti. “Terhadap pedang” jelas dan wajar sesudah kata “takut”.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi peringatan sebelumnya.
- source_word: חֵמָה
  choice: murka
  rationale: Kata ini menunjuk pada kemarahan yang menyala-nyala. “Murka” mempertahankan bobot moral dan yudisialnya tanpa menentukan secara eksplisit siapa yang murka.
- source_word: עֲוֺנוֹת חָרֶב
  choice: hukuman pedang
  rationale: Secara harfiah rangkaian ini sulit dan dapat berkaitan dengan kesalahan, akibat kesalahan, atau hukuman yang dijalankan oleh pedang. Dalam konteks peringatan akan penghakiman, “hukuman pedang” memberikan makna kontekstual yang koheren sambil mempertahankan ungkapan ringkas sumber.
- source_word: לְמַעַן
  choice: supaya
  rationale: Konjungsi ini menyatakan tujuan atau hasil yang dimaksudkan.
- source_word: תֵּדְעוּן
  choice: kamu tahu
  rationale: 'Bentuk imperfek jamak setelah לְמַעַן secara alami menyatakan tujuan: “supaya kamu tahu”.'
- source_word: שדין
  choice: bahwa ada penghakiman
  rationale: Ungkapan Ibrani terakhir sulit secara tekstual dan leksikal. Dalam konteks ini, “bahwa ada penghakiman” paling langsung melanjutkan peringatan tentang hukuman, sedangkan kemungkinan pembacaan penting lainnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penafsiran ungkapan akhir שדין yang sulit
  choice: bahwa ada penghakiman
  alternative: bahwa Yang Mahakuasa ada; bahwa ada berbagai penghakiman; bahwa ada seorang hakim
  rationale: Konteksnya adalah peringatan Ayub bahwa sikap para sahabatnya dapat menghadapkan mereka pada keadilan yang menghukum. Pembacaan yang berpusat pada “penghakiman” paling sesuai dengan alur langsung, tetapi bentuk Ibraninya cukup sulit sehingga alternatif-alternatif lama yang bermakna secara teologis tidak boleh disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan “Hendaklah kamu sendiri takut” mempertahankan penekanan kepada para lawan bicara; istilah “murka”, “hukuman”, dan “penghakiman” menjaga nada yudisial ayat tanpa menentukan lebih jauh hal-hal yang dibiarkan tersirat dalam bahasa Ibrani.
