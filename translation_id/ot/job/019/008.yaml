  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: id
  text: ia telah memagari jalanku sehingga aku tidak dapat melintas[a], dan ia menaruh kegelapan di atas jalan-jalanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Subjeknya tersirat dalam bahasa Ibrani. Dalam konteks ini Ayub sedang berbicara tentang Allah, meskipun ayat ini sendiri hanya menyatakan “ia”.
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: jalanku
  rationale: Kata ini menunjuk pada jalan, lorong, atau arah perjalanan. “Jalanku” alami dalam bahasa Indonesia serta mempertahankan kemungkinan makna harfiah dan kiasan.
- source_word: גָדַר
  choice: menutup ... dengan tembok
  rationale: Kata kerja ini berarti membuat tembok, memagari, atau menghalangi. Ungkapan ini mempertahankan gambaran konkret tentang jalan yang ditutup oleh tembok dan terdengar lebih alami daripada “menembok jalanku”.
- source_word: וְלֹא אֶעֱבוֹר
  choice: sehingga aku tidak dapat lewat
  rationale: Terjemahan ini menyatakan akibat dari jalan yang ditutup, sambil menerjemahkan עבר secara langsung sebagai “lewat”.
- source_word: נְתִיבוֹתַי
  choice: jalan-jalanku
  rationale: Bentuk jamak dipertahankan. Kata ini dapat menunjuk pada jalur-jalur nyata maupun arah perjalanan hidup Ayub.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan langsung yang sesuai untuk makna harfiah maupun kiasan dalam puisi ratapan Ayub.
- source_word: יָשִׂים
  choice: menaruh
  rationale: Kata kerja ini berarti menaruh, menempatkan, atau menetapkan. Bentuk bahasa Indonesia tanpa penanda waktu mempertahankan keluwesan aspek bentuk Ibrani dalam paralel puitis ini.
- source_word: וְעַל נְתִיבוֹתַי חֹשֶׁךְ יָשִׂים
  choice: dan Ia menaruh kegelapan di atas jalan-jalanku
  rationale: Susunan ini mempertahankan gambaran puitis tentang kegelapan yang diletakkan di atas jalan-jalan Ayub, bukan mereduksinya menjadi sekadar “menggelapkan”.
theological_decisions:
- issue: Rujukan subjek orang ketiga tunggal
  choice: Ia
  alternative: Allah/TUHAN
  rationale: Subjek orang ketiga maskulin tunggal tidak disebutkan secara eksplisit dalam teks Ibrani. Konteks menunjukkan bahwa Ayub sedang berbicara tentang Allah, tetapi memakai pronomina mempertahankan ketidaktersuratan dalam ayat ini tanpa memasukkan nama ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Menutup jalanku dengan tembok” dipilih agar gambaran Ibrani tetap konkret namun alami; pengulangan “Ia” memperjelas paralel klausa tanpa menyebut Allah secara eksplisit.
