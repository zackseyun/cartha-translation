  text: כִּ֣י תֹ֭אמְרוּ מַה נִּרְדָּף ל֑/וֹ וְ/שֹׁ֥רֶשׁ דָּ֝בָ֗ר נִמְצָא בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/028.yaml
  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: id
  text: Jika kalian berkata[a], “Bagaimana kita akan mengejarnya, sebab akar persoalan itu terdapat dalam diriku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani sulit. Klausa terakhir juga dapat dipahami kira-kira sebagai “akar persoalan itu terdapat dalam dirinya,” bergantung pada pertimbangan terhadap teks konsonantal dan versi-versi kuno. Kata “mengejar” juga dapat bermakna lebih kuat, yaitu “menganiaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam konteks ini memperkenalkan perkataan hipotetis lawan-lawan Ayub, bukan alasan kausal biasa.
- source_word: תֹאמְרוּ
  choice: kalian berkata
  rationale: Bentuk imperfek orang kedua jamak dalam konstruksi bersyarat wajar diterjemahkan dengan bentuk kini dalam bahasa Indonesia.
- source_word: מַה נִּרְדָּף
  choice: Bagaimana kita akan mengejarnya
  rationale: מַה berfungsi secara adverbial, sedangkan רדף mempertahankan gambaran mengejar dan tetap memungkinkan nuansa memusuhi atau menganiaya.
- source_word: לוֹ
  choice: -nya
  rationale: Preposisi ל menandai orang yang menjadi sasaran pengejaran; akhiran objek menghasilkan bahasa Indonesia yang alami.
- source_word: וְשֹׁרֶשׁ
  choice: sebab akar
  rationale: Konjungsi menghubungkan klausa kedua sebagai dasar bagi tindakan yang disebutkan; 'akar' mempertahankan metafora sumber atau dasar.
- source_word: דָּבָר
  choice: persoalan
  rationale: Di sini menunjuk pada perkara yang sedang diperdebatkan, bukan khusus pada suatu perkataan.
- source_word: נִמְצָא
  choice: terdapat
  rationale: Menyampaikan keadaan resultatif-pasif Niphal secara alami tanpa menafsirkan metafora secara berlebihan.
- source_word: בִי
  choice: dalam diriku
  rationale: Mengikuti pembacaan langsung teks konsonantal bertitik בִי dan mempertahankan kesulitan maknanya; kemungkinan lain dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina jamak 'kalian' membedakan orang kedua jamak dari 'kita' pada verba berikutnya. Metafora 'akar persoalan' dipertahankan, dan ambiguitas tekstual serta kekuatan semantis רדף dicatat tanpa diselesaikan secara dogmatis.
