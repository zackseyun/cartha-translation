translation:
  language: id
  text: Aku memanggil hambaku[a], tetapi ia tidak menjawab[b]; dengan mulutku sendiri aku memohon kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “budakku.” Kata Ibrani עֶבֶד dapat berarti hamba atau budak, bergantung pada konteks.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Aku telah memanggil hambaku, tetapi ia tidak menjawab; dengan mulutku sendiri aku memohon kepadanya.” Bentuk perfektif Ibrani pada kata kerja pertama dapat diterjemahkan sebagai bentuk lampau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: hambaku
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks rumah tangga Ayub, 'hamba' merupakan pilihan utama yang wajar dan tetap menyampaikan kedudukan bawahannya; 'budak' dicatat sebagai alternatif.
- source_word: קָרָאתִי
  choice: Aku memanggil
  rationale: Bentuk perfektif קָרָאתִי secara harfiah dapat menunjuk tindakan lampau, tetapi dalam keluhan puitis dapat dipahami sebagai penggambaran hidup atas keadaan yang sedang dialami. Bahasa Indonesia 'Aku memanggil' mempertahankan keluwesan aspek ini.
- source_word: וְלֹא יַעֲנֶה
  choice: tetapi ia tidak menjawab
  rationale: ענה berarti menjawab atau menanggapi. Konjungsi diterjemahkan secara adversatif karena tanggapan yang diharapkan berlawanan dengan kenyataan.
- source_word: בְּמוֹ פִי
  choice: dengan mulutku sendiri
  rationale: Ungkapan ini menegaskan bahwa Ayub sendiri harus menyampaikan permohonan secara langsung; 'dengan mulutku sendiri' mempertahankan penekanan tersebut.
- source_word: אֶתְחַנֶּן לוֹ
  choice: aku memohon kepadanya
  rationale: Hitpael חנן menyatakan permohonan akan belas kasihan atau kemurahan. 'Memohon' alami dalam bahasa Indonesia dan tidak menambahkan modalitas 'harus' yang tidak dinyatakan secara eksplisit.
