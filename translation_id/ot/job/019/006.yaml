  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: id
  text: Maka ketahuilah bahwa Allah telah berlaku tidak adil terhadapku[a] dan telah mengepung aku dengan jaring-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "telah memperlakukan aku secara tidak adil" atau "telah memutarbalikkan keadilan terhadapku." Kata kerja Ibraninya dapat mengandung arti membengkokkan atau menyimpangkan apa yang benar.
    reason: lexical_alternative
  - marker: b
    text: Atau "perangkap-Nya" atau "jaring pemburu-Nya."
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ
  choice: Ketahuilah
  rationale: Bentuk imperatif jamak dari ידע yang meminta para pendengar mengakui suatu kenyataan. Dalam bahasa Indonesia, bentuk ini dapat ditujukan kepada lebih dari satu orang sesuai konteks.
- source_word: אֵפוֹ
  choice: kalau begitu
  rationale: Partikel wacana ini memberi tekanan sekaligus menarik kesimpulan dalam alur argumentasi; 'kalau begitu' wajar dalam bahasa Indonesia dan tidak menerjemahkannya secara berlebihan.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Gelar ilahi tunggal yang lazim diterjemahkan 'Allah'; bentuk ini tidak memuat gelar yang lebih khusus seperti 'Yang Mahakuasa'.
- source_word: עִוְּתַנִי
  choice: telah memperlakukan aku dengan tidak adil
  rationale: Kata kerja עות dapat berarti membengkokkan, menyimpangkan, atau berbuat tidak adil. Pilihan ini menyampaikan daya moral-yudisial tuduhan Ayub secara alami tanpa melunakkan ketegangan teks.
- source_word: מְצוּדוֹ
  choice: jaring-Nya
  rationale: Nomina ini menunjuk pada jaring atau perangkap untuk berburu. 'Jaring' mempertahankan metafora konkret dan ringkas.
- source_word: עָלַי הִקִּיף
  choice: mengepung aku dengan
  rationale: Kata kerja ini berarti mengelilingi atau mengepung. Susunan Indonesia ini secara idiomatis menghubungkannya dengan sarana atau gambaran berikutnya, yaitu jaring.
theological_decisions:
- issue: Tuduhan Ayub terhadap Allah
  choice: Mempertahankan pernyataan langsung bahwa Allah telah memperlakukan Ayub dengan tidak adil.
  alternative: Allah telah menindas aku; Allah telah berbalik melawan aku.
  rationale: Bahasa Ibraninya memiliki nuansa kuat berupa penyimpangan atau ketidakadilan. Terjemahan mempertahankan kekuatan ratapan Ayub tanpa menyajikan penilaiannya sebagai pernyataan doktrinal normatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Tuduhan Ayub dipertahankan secara tajam, sedangkan kedua penanda catatan kaki [a] dan [b] ditempatkan langsung sesudah unsur yang dijelaskan.
