  text: Tulangku[a] melekat pada kulitku dan dagingku, dan aku lolos dengan kulit gigiku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk tunggal, “tulangku”, kemungkinan secara kolektif untuk seluruh kerangka tubuh; dapat juga diterjemahkan “tulang-tulangku”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan kulit gigiku”. Ungkapan Ibrani ini menyatakan bahwa seseorang lolos dengan sangat tipis.
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: pada kulit dan dagingku
  rationale: 'Kata עוֹר dan בָּשָׂר secara harfiah berarti ‘kulit’ dan ‘daging’. Bersama דבק, preposisi ב paling alami dinyatakan dengan ‘pada’ dalam bahasa Indonesia: tulang itu melekat erat pada kulit dan daging.'
- source_word: דָּבְקָה עַצְמִי
  choice: Tulangku melekat
  rationale: Teks Ibrani memakai עֶצֶם dalam bentuk tunggal, ‘tulangku’, kemungkinan sebagai bentuk tunggal kolektif bagi kerangka tubuh Ayub. Bentuk tunggal dipertahankan karena tetap dapat dipahami dalam bahasa Indonesia, sedangkan דבק diterjemahkan ‘melekat’ untuk menyampaikan keadaan menempel erat akibat tubuh yang sangat kurus.
- source_word: וָאֶתְמַלְּטָה
  choice: dan aku lolos
  rationale: Kata kerja מלט menyatakan luput atau lolos. ‘Aku lolos’ alami dalam bahasa Indonesia dan mempertahankan gambaran Ayub sebagai orang yang nyaris tidak tersisa tanpa menambahkan penafsiran ke dalam kata kerjanya.
- source_word: בְּעוֹר שִׁנָּי
  choice: dengan kulit gigiku
  rationale: Terjemahan ini mempertahankan citra Ibrani yang mencolok dan preposisi ב (‘dengan’). Karena ungkapan tersebut tidak lazim dalam bahasa Indonesia, makna kemungkinan bahwa Ayub lolos secara amat tipis dijelaskan dalam catatan kaki, bukan menggantikan citra teks.
