  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: id
  text: Napasku memuakkan istriku, dan aku menjijikkan bagi anak-anak dari tubuhku[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut pemahaman lain atas teks Ibrani yang sulit: “dan permohonanku kutujukan kepada anak-anak dari tubuhku” atau “aku memohon belas kasihan kepada anak-anak dari tubuhku.”'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “putra-putra dari perutku.” Ungkapan ini dapat menunjuk kepada anak-anak Ayub sendiri atau, secara lebih umum, kepada kerabat dekat sedarahnya.
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: napasku
  rationale: רוּחַ dapat berarti napas, angin, atau roh. Dalam gambaran jasmani dan relasional ayat ini, makna konkret “napas” paling sesuai.
- source_word: זָרָה
  choice: memuakkan
  rationale: Bentuk ini pada dasarnya menyatakan sesuatu yang asing atau menjauhkan. Dalam konteks reaksi istri Ayub terhadap napasnya, “memuakkan” menyampaikan akibat berupa rasa jijik secara alami dalam bahasa Indonesia.
- source_word: לְאִשְׁתִּי
  choice: bagi istriku
  rationale: Preposisi לְ menandai orang yang mengalami atau menilai keadaan tersebut; “bagi istriku” alami dengan predikat ini.
- source_word: וְחַנֹּתִי
  choice: dan aku menjijikkan
  rationale: Bentuk Ibrani ini sulit dan dapat dipahami dengan beberapa cara. Terjemahan utama mengikuti pembacaan yang sejajar dengan klausa pertama dan menyatakan bahwa Ayub menjadi menjijikkan bagi kerabatnya; pembacaan tentang permohonan belas kasihan dipertahankan dalam catatan kaki.
- source_word: לִבְנֵי
  choice: bagi anak-anak
  rationale: בנים secara harfiah berarti “anak-anak lelaki,” tetapi dalam ungkapan kekerabatan ini dapat menunjuk kepada anak-anak atau kerabat sedarah; “anak-anak” mempertahankan makna dasar tanpa mempersempit secara tidak perlu.
- source_word: בִטְנִי
  choice: yang berasal dari tubuhku
  rationale: בטן secara harfiah berarti perut atau rahim. Ungkapan ini menekankan hubungan jasmani atau darah; “berasal dari tubuhku” mempertahankan citra fisiknya dan memungkinkan ambiguitas rujukannya dijelaskan dalam catatan.
theological_decisions:
- issue: Identitas “anak-anak yang berasal dari tubuhku” setelah kematian anak-anak Ayub
  choice: Ungkapan dipertahankan secara cukup harfiah tanpa menetapkan identitas mereka.
  alternative: Menafsirkannya secara tegas sebagai anak kandung Ayub atau sebagai kerabat sedarah dekat.
  rationale: Teks Ibrani sendiri memungkinkan lebih dari satu rujukan. Terjemahan tidak boleh menyelesaikan ketegangan naratif dengan memasukkan identitas yang tidak dinyatakan secara pasti.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat, dengan pronomina orang pertama “aku” yang sesuai dengan tuturan pribadi dalam puisi Ayub. Paralelisme antara penolakan istri dan kaum kerabat dipertahankan, sementara kesulitan bentuk וְחַנֹּתִי dan ketidakpastian rujukan ungkapan kekerabatan dijelaskan dalam catatan kaki.
