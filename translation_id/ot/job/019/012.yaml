  text: יַ֤חַד יָ֘בֹ֤אוּ גְדוּדָ֗י/ו וַ/יָּסֹ֣לּוּ עָלַ֣/י דַּרְכָּ֑/ם וַ/יַּחֲנ֖וּ סָבִ֣יב לְ/אָהֳלִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/012.yaml
  text: Together his troops come; they build up their road against me[a], and they camp all around my tent.
translation:
  language: id
  text: Bersama-sama pasukan-Nya datang; mereka membangun jalan mereka untuk menyerang aku[a], dan berkemah di sekeliling kemahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka menimbunkan tanggul pengepungan terhadap aku”; kata kerja Ibrani dapat menggambarkan pembangunan jalan yang ditinggikan atau tanggul pengepungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Bersama-sama
  rationale: Menunjukkan tindakan yang serentak dan terpadu; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran serangan terkoordinasi.
- source_word: יָבֹאוּ
  choice: datang
  rationale: Makna dasar בוא ialah datang; bentuk kini mempertahankan daya hidup tuturan puitis Ayub.
- source_word: גְדוּדָיו
  choice: pasukan-Nya
  rationale: גְּדוּד dapat berarti pasukan atau gerombolan penyerbu. 'Pasukan' jelas dalam konteks militer tanpa menentukan ukuran kelompok secara berlebihan; akhiran orang ketiga tunggal dipertahankan sebagai pronomina.
- source_word: וַיָּסֹלּוּ
  choice: mereka menimbun
  rationale: Akar סלל menggambarkan penimbunan atau peninggian jalan maupun tanggul pengepungan; 'menimbun' mempertahankan tindakan konkret tersebut.
- source_word: עָלַי
  choice: untuk menyerang aku
  rationale: Secara harfiah berarti 'atas/terhadap aku', tetapi dalam gambaran pengepungan memiliki daya permusuhan. Rumusan ini menyatakan arah serangan tanpa menghapus citra pembangunan jalannya.
- source_word: דַּרְכָּם
  choice: jalan
  rationale: דֶּרֶךְ berarti jalan atau jalur. Bersama סלל, 'jalan' mempertahankan gambaran rute yang ditimbun untuk mendekati sasaran.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Menerjemahkan חנה secara langsung dan mempertahankan latar militer.
- source_word: סָבִיב
  choice: mengelilingi
  rationale: Mengungkapkan pengepungan dari segala sisi secara alami dalam bahasa Indonesia.
- source_word: לְאָהֳלִי
  choice: kemahku
  rationale: אֹהֶל secara konkret berarti kemah; pilihan ini mempertahankan citra asli, meskipun secara kiasan dapat menunjuk tempat tinggal atau rumah tangga.
theological_decisions:
- issue: Rujukan akhiran orang ketiga tunggal pada גְדוּדָיו
  choice: Dipertahankan sebagai 'pasukan-Nya', dengan konteks menunjuk kepada Allah yang digambarkan Ayub sebagai penyerang.
  alternative: Pasukan milik panglima musuh yang tidak disebutkan.
  rationale: Konteks dekat menggambarkan tindakan Allah terhadap Ayub melalui metafora pengepungan. Terjemahan tidak mengganti pronomina dengan nama 'Allah', sehingga bentuk Ibrani dan sedikit keluwesan rujukannya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan citra militer konkret. Kapital pada '-Nya' mengikuti kebiasaan Indonesia untuk pronomina yang merujuk kepada Allah, sedangkan konteks—bukan penambahan nama—menentukan rujukannya.
