  text: whom I myself will see for myself[a], and my eyes will see, and not another[b]. My kidneys fail within my bosom.
translation:
  language: id
  text: yang akan kulihat sendiri bagi diriku[a]; mataku akan melihat-Nya, bukan orang lain[b]. Batin terdalamku merana dalam dadaku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat dipahami, “yang akan kulihat di pihakku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan bukan orang asing.” Dalam konteks ini, frasa itu juga dapat berarti bahwa Ayub sendiri, bukan orang lain, akan melihat-Nya.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ginjal-ginjalku merana dalam dadaku.” Dalam bahasa Ibrani, ginjal dapat melambangkan batin atau emosi terdalam. Frasa terakhir mungkin mengungkapkan kerinduan yang sangat kuat.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata ganti relatif ini mengacu kepada sosok pribadi pada ayat sebelumnya; bahasa Indonesia cukup memakai 'yang', sementara objek tersirat dalam verba 'kulihat'.
- source_word: אֲנִי אֶחֱזֶה
  choice: akan kulihat sendiri
  rationale: Pronomina mandiri אֲנִי menegaskan subjek yang sudah terkandung dalam verba, sehingga 'sendiri' mempertahankan tekanannya.
- source_word: לִּי
  choice: bagiku
  rationale: Datif ini sulit dan dapat menyatakan kepentingan atau keterlibatan pribadi. 'Bagiku' mempertahankan ungkapan Ibrani tanpa menetapkannya sebagai pernyataan forensik seperti 'berpihak kepadaku'.
- source_word: וְעֵינַי רָאוּ
  choice: mataku sendiri akan melihat-Nya
  rationale: Bentuk qatal רָאוּ dipahami secara futur dalam kesejajaran puitis dengan אֶחֱזֶה. 'Sendiri' membuat penekanan bahwa mata Ayublah yang melihat terdengar alami dalam bahasa Indonesia; '-Nya' memperjelas objek personal yang tersirat dari konteks.
- source_word: וְלֹא זָר
  choice: bukan orang lain
  rationale: זָר secara harfiah dapat berarti 'orang asing', tetapi dalam kontras ini menunjuk kepada bukan pihak lain selain Ayub. Catatan kaki mempertahankan alternatif harfiahnya.
- source_word: כָּלוּ כִלְיֹתַי
  choice: batin terdalamku merana
  rationale: Secara harfiah 'ginjalku habis/merana'. Dalam antropologi Ibrani, ginjal melambangkan pusat emosi terdalam; padanan idiomatis ini menyampaikan maknanya, sedangkan citra literal dicatat dalam catatan kaki.
- source_word: בְּחֵקִי
  choice: di dalam dadaku
  rationale: חֵיק berarti dada, pangkuan, atau bagian dalam dekat dada. 'Di dalam dadaku' mempertahankan citra tubuh secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat penglihatan yang diharapkan Ayub
  choice: Menyatakan bahwa Ayub sendiri kelak melihat sosok yang disebut pada ayat sebelumnya, tanpa menentukan keadaan atau waktu penglihatan itu.
  alternative: Menafsirkannya secara khusus sebagai kebangkitan tubuh, pembenaran semasa hidup, atau penglihatan akan Allah sesudah kematian.
  rationale: Teks Ibrani sangat menekankan pengalaman pribadi Ayub, tetapi ayat ini sendiri tidak menyelesaikan perdebatan tentang keadaan penglihatan tersebut.
- issue: Arti datif לִּי
  choice: bagiku
  alternative: di pihakku
  rationale: Terjemahan 'bagiku' menjaga kemungkinan nuansa kepentingan, pengalaman, atau kepemilikan pribadi tanpa memaksakan bahwa sosok itu pasti tampil sebagai pembela yang berpihak kepada Ayub.
- issue: Emosi pada penutup ayat
  choice: merana
  alternative: habis oleh kerinduan
  rationale: כָּלוּ dapat menyatakan habis, gagal, atau merana. Teks tidak menyebut objek kerinduan secara eksplisit, sehingga 'merana' menjaga daya emosional tanpa menambahkan penafsiran tertentu.
translation_notes:
  register: Bahasa puitis, bermartabat, dan modern. Pengulangan verba 'melihat' dipertahankan untuk mencerminkan kesejajaran Ibrani. Citra 'ginjal' dialihkan secara idiomatis dalam teks utama agar dipahami pembaca umum, namun bentuk literal dan makna budayanya dipertahankan dalam catatan kaki.
