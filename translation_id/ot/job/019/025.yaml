  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: id
  text: Namun aku sendiri tahu bahwa Penebusku[a] hidup, dan pada akhirnya ia akan berdiri di atas debu.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pembelaku.” Kata Ibrani גֹּאֵל dapat menunjuk kepada penebus, pembela, atau orang yang memperjuangkan hak anggota keluarganya.
    reason: lexical_alternative
  - marker: b
    text: Bagian ini sulit. Dapat juga diterjemahkan, “dan sebagai yang terakhir ia akan berdiri di atas debu,” atau, “dan pada akhirnya ia akan bangkit di atas debu.”
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “debu”; kata ini dapat membangkitkan gambaran tentang tanah, kefanaan, atau kubur.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun aku sendiri
  rationale: Kata ganti mandiri אֲנִי memberi penegasan, sedangkan וַ dalam konteks ini wajar dipahami sebagai penghubung yang bernuansa kontras. Ungkapan ini menyampaikan penegasan pribadi Ayub secara alami.
- source_word: יָדַעְתִּי
  choice: tahu
  rationale: Bentuk perfektif ini menyatakan keyakinan yang telah teguh dan tetap berlaku; kala kini dalam bahasa Indonesia paling alami menyampaikan maksud tersebut.
- source_word: גֹּאֲלִי
  choice: Penebusku
  rationale: גֹּאֵל menunjuk kepada pihak yang menebus, membela, atau memperjuangkan hak seorang kerabat. 'Penebusku' mempertahankan keluasan dan bobot istilah itu tanpa menentukan identitas tokohnya secara lebih sempit.
- source_word: חָי
  choice: hidup
  rationale: Adjektiva predikatif חָי menyatakan bahwa sang Penebus hidup; bentuk ini langsung dan alami dalam bahasa Indonesia.
- source_word: וְאַחֲרוֹן
  choice: dan kelak
  rationale: אַחֲרוֹן dapat dipahami secara adverbial ('kemudian/pada akhirnya') atau substantival ('sebagai yang terakhir'). 'Kelak' mempertahankan orientasi waktu tanpa memaksakan rumusan eskatologis tertentu; alternatif utama dicatat dalam catatan kaki.
- source_word: יָקוּם
  choice: akan berdiri
  rationale: קום dapat berarti bangkit, tampil, atau berdiri. 'Akan berdiri' dekat dengan makna dasarnya dan tetap membiarkan kemungkinan nuansa tindakan tampil atau bangkit.
- source_word: עַל עָפָר
  choice: di atas debu
  rationale: Terjemahan harfiah ini mempertahankan citra עָפָר dan tidak langsung menafsirkannya sebagai bumi, kubur, atau kefanaan.
theological_decisions:
- issue: Identitas dan fungsi גֹּאֵל milik Ayub
  choice: Penebusku, tanpa mengidentifikasinya secara eksplisit
  alternative: Pembelaku; penebus kerabatku
  rationale: Bahasa Ibrani tidak secara eksplisit menetapkan apakah tokoh ini adalah Allah, saksi surgawi, penebus kerabat, atau figur yang dipahami secara mesianik. Terjemahan mempertahankan daya teologis istilah tersebut tanpa menyelesaikan ketegangan yang ada dalam teks.
- issue: Daya eskatologis וְאַחֲרוֹן ... יָקוּם
  choice: dan kelak ia akan berdiri di atas debu
  alternative: dan sebagai yang terakhir ia akan berdiri di atas debu; dan pada akhirnya ia akan bangkit di atas debu
  rationale: Susunan ini dapat dipahami secara temporal maupun dengan אַחֲרוֹן sebagai sebutan bagi tokohnya. Teks utama memakai ungkapan temporal yang tidak terlalu menentukan, sementara catatan kaki mempertahankan alternatif substantival dan nuansa 'bangkit' pada קום.
- issue: Makna simbolis עָפָר
  choice: debu
  alternative: bumi; kubur
  rationale: Teks Ibrani secara harfiah berbunyi 'debu'. Terjemahan tidak menetapkan apakah yang terutama dimaksud ialah tanah, kefanaan, atau kubur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. 'Aku sendiri' menampilkan penegasan pribadi Ayub; 'kelak' menghindari penentuan berlebihan atas sintaksis dan eskatologi klausa terakhir. Huruf kecil pada 'ia' dipertahankan karena identitas sang גֹּאֵל tidak dijelaskan secara eksplisit oleh ayat ini.
