  yaml_path: translation/ot/job/004/016.yaml
  text: 'It stood still[a], but I could not recognize its appearance; a form was before my eyes; there was silence[b], and I heard a voice:'
translation:
  language: id
  text: 'Ia berdiri diam, tetapi aku tidak dapat mengenali rupanya[a]; suatu bentuk tampak di depan mataku. Keheningan[b]; lalu aku mendengar suara:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akhiran Ibrani pada kata “rupanya” berbentuk maskulin tunggal, tetapi referennya tetap merupakan sosok yang tidak teridentifikasi. Bahasa Indonesia tidak perlu menentukan jenis kelaminnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesunyian” atau “keadaan yang senyap.” Kata Ibrani ini dapat menunjuk pada keheningan maupun keadaan yang senyap.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: berdiri diam
  rationale: Kata kerja עמד berarti berdiri atau tetap berdiri. Dalam konteks penglihatan ini, “berdiri diam” menyampaikan bahwa sosok tersebut berhenti dan tetap berada di hadapan pembicara.
- source_word: וְלֹא אַכִּיר
  choice: tetapi aku tidak dapat mengenali
  rationale: Bentuk Hifil dari נכר lazim berarti mengenali atau mengidentifikasi. “Tetapi” menyatakan kontras antara kehadiran sosok itu dan ketidakmampuan pembicara mengenalinya; “tidak dapat mengenali” wajar dalam bahasa Indonesia modern.
- source_word: מַרְאֵהוּ
  choice: rupanya
  rationale: מַרְאֶה menunjuk pada rupa atau penampilan yang terlihat. “Rupanya” alami dalam bahasa Indonesia dan tidak menentukan jenis kelamin referennya, sehingga ketidakjelasan sosok dalam penglihatan tetap terpelihara.
- source_word: תְּמוּנָה
  choice: suatu bentuk
  rationale: תְּמוּנָה dapat berarti bentuk, gambaran, atau rupa. “Suatu bentuk” sesuai dengan kesan visual yang samar tanpa membuat sosok itu lebih jelas daripada teks sumber.
- source_word: לְנֶגֶד עֵינַי
  choice: di depan mataku
  rationale: Ungkapan ini secara harfiah berarti di hadapan atau di depan mata. Pilihan ini mempertahankan gambaran indrawi teks dan tetap alami.
- source_word: דְּמָמָה
  choice: dalam keheningan
  rationale: דְּמָמָה dapat menunjuk pada keheningan, kesunyian, atau keadaan yang senyap. Bentuk “dalam keheningan” menghasilkan kalimat Indonesia yang alami sambil mempertahankan suasana hening sebelum suara terdengar.
- source_word: וָקוֹל אֶשְׁמָע
  choice: aku mendengar suatu suara
  rationale: קוֹל dapat berarti suara atau bunyi. Karena ayat berikutnya memuat perkataan, “suara” paling sesuai dengan konteks. Susunan ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas sosok yang berdiri
  choice: Menggunakan “Ia” dan “rupanya” tanpa mengidentifikasi sosok tersebut
  alternative: Menyebutnya sebagai roh, penampakan, atau tokoh laki-laki
  rationale: Teks Ibrani tidak menyatakan secara eksplisit identitas sosok itu. Terjemahan mempertahankan ketidakjelasan tersebut dan tidak memasukkan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang wajar. “Ia” memberi nada bermartabat tanpa menentukan jenis kelamin dalam bahasa Indonesia, sedangkan tanda titik koma mempertahankan alur penglihatan sebelum peralihan dari penglihatan ke pendengaran.
