  yaml_path: translation/ot/job/004/019.yaml
  text: how much more those who dwell in houses of clay[a], whose foundation is in the dust[b], who are crushed before the moth!
translation:
  language: id
  text: Apalagi mereka yang tinggal di rumah-rumah tanah liat[a], yang fondasinya di dalam debu, yang diremukkan sebelum ngengat[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahkan mereka yang tinggal di rumah-rumah tanah liat.” Partikel Ibrani ini dapat berarti “bahkan” atau “sungguh,” tetapi dalam konteks ini kemungkinan menyatakan “apalagi.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang diremukkan lebih cepat daripada ngengat” atau “lebih mudah daripada ngengat.” Ungkapan Ibrani “sebelum ngengat” mungkin menyatakan betapa cepat atau mudahnya manusia binasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: apalagi
  rationale: Dalam hubungan dengan ayat 18, partikel ini menguatkan penalaran dari makhluk surgawi kepada manusia yang rapuh. 'Apalagi' menyampaikan daya inferensial tersebut dengan alami.
- source_word: שֹׁכְנֵי
  choice: mereka yang tinggal
  rationale: Partisip ini menunjuk pada keadaan menetap atau terus-menerus; bentuk ini wajar dalam bahasa Indonesia dan mempertahankan gambaran penghuni.
- source_word: בָתֵּי חֹמֶר
  choice: rumah-rumah dari tanah liat
  rationale: Frasa ini menggambarkan tempat tinggal yang terbuat dari tanah liat dan secara metaforis menunjuk pada kerapuhan tubuh atau keberadaan manusia. Terjemahan mempertahankan metafora tanpa menjelaskannya di dalam teks.
- source_word: אֲשֶׁר ... יְסוֹדָם
  choice: yang dasarnya
  rationale: Klausa relatif ini menghubungkan dasar dengan rumah-rumah metaforis tersebut. Sufiks jamak pada kata Ibrani diterjemahkan secara idiomatis dengan 'dasarnya' karena 'rumah-rumah' dipandang sebagai gambaran kolektif.
- source_word: בֶּעָפָר
  choice: di dalam debu
  rationale: עָפָר berarti debu atau tanah gembur dan membangkitkan tema asal-usul serta kefanaan manusia. 'Di dalam debu' mempertahankan citra konkretnya.
- source_word: יְדַכְּאוּם
  choice: yang diremukkan
  rationale: Bentuk Piel dari דכא menyatakan tindakan meremukkan. Bentuk pasif menghindari penambahan pelaku yang tidak dinyatakan secara jelas dalam teks Ibrani.
- source_word: לִפְנֵי עָשׁ
  choice: di hadapan ngengat
  rationale: Terjemahan yang relatif harfiah ini mempertahankan kejanggalan puitis dan ambiguitas ungkapan, yang dapat menyiratkan bahwa manusia binasa lebih cepat atau lebih mudah daripada ngengat.
theological_decisions:
- issue: Rujukan metaforis 'rumah-rumah dari tanah liat'
  choice: Metafora bagi tubuh atau keberadaan manusia yang fana dan rapuh
  alternative: Rumah bata lumpur secara harfiah sebagai gambaran kerentanan manusia
  rationale: Konteks membandingkan makhluk surgawi dengan manusia dan menekankan kefanaan. Metafora dipertahankan agar pembaca dapat menangkap kedua lapis citranya.
- issue: Makna perbandingan dengan ngengat
  choice: Dibiarkan sebagai 'di hadapan ngengat' dalam teks utama
  alternative: Mereka diremukkan lebih cepat atau lebih mudah daripada ngengat
  rationale: לִפְנֵי secara harfiah berarti 'di hadapan/sebelum', sedangkan fungsi komparatif atau temporal ungkapan ini tidak sepenuhnya pasti. Catatan kaki menyajikan kemungkinan tafsir tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. 'Apalagi' menjaga alur argumentasi, sementara 'diremukkan' dan 'di hadapan ngengat' mempertahankan kekuatan serta ambiguitas puisi Ibrani. Semua penanda catatan kaki ditempatkan dalam teks utama.
