base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: id
  text: Dapatkah manusia yang fana benar di hadapan Allah? Dapatkah manusia murni di hadapan Penciptanya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “Dapatkah manusia yang fana lebih benar daripada Allah? Dapatkah manusia lebih murni daripada Penciptanya?”'
    reason: Bentuk dengan preposisi מן dapat dipahami secara komparatif, bukan hanya secara relasional.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: manusia yang fana
  rationale: אֱנוֹשׁ menunjuk kepada manusia dengan nuansa kelemahan dan kefanaan; ungkapan ini mempertahankan kontras dengan Allah secara alami dalam bahasa Indonesia.
- source_word: מֵאֱלוֹהַ
  choice: di hadapan Allah
  rationale: Dalam konstruksi dengan צדק, מן dapat dipahami secara relasional atau komparatif. 'Di hadapan Allah' menyampaikan pertanyaan tentang kedudukan manusia terhadap Allah tanpa meniadakan kemungkinan komparatif, yang dicatat dalam catatan kaki.
- source_word: יִצְדָּק
  choice: benar
  rationale: צדק di sini menyatakan keadaan benar atau dibenarkan dalam hubungan dengan Allah. 'Benar' ringkas, wajar, dan mempertahankan nuansa forensik-relasional.
- source_word: אִם
  choice: Dapatkah
  rationale: אִם memperkenalkan baris pertanyaan kedua dalam paralelisme. Pengulangan 'Dapatkah' membuat struktur retorisnya jelas dan alami.
- source_word: מֵעֹשֵׂהוּ
  choice: di hadapan Penciptanya
  rationale: עֹשֵׂהוּ berarti 'pembuat/penciptanya'; kapitalisasi pada 'Pencipta' menandai rujukannya kepada Allah. מן diterjemahkan secara relasional dalam teks utama.
- source_word: יִטְהַר
  choice: murni
  rationale: טהר berarti bersih atau murni. 'Murni' sesuai dengan kesejajaran moral-spiritual bersama 'benar'.
- source_word: גָּבֶר
  choice: seorang laki-laki
  rationale: גָּבֶר adalah nomina maskulin tunggal yang dipakai sejajar dengan אֱנוֹשׁ. 'Seorang laki-laki' mempertahankan bentuk tersebut tanpa menambahkan gagasan 'perkasa' yang tidak perlu dalam konteks ini.
theological_decisions:
- issue: Kedudukan manusia dalam hubungannya dengan Allah
  choice: Ayat diterjemahkan sebagai pertanyaan retoris apakah manusia fana dapat benar atau murni di hadapan Allah.
  alternative: 'Ayat dapat dibaca secara komparatif: apakah manusia dapat lebih benar daripada Allah atau lebih murni daripada Penciptanya.'
  rationale: Preposisi מן memungkinkan pembacaan relasional maupun komparatif. Teks utama memakai ungkapan relasional yang alami dan sesuai konteks, sedangkan ambiguitas asli dipertahankan melalui catatan kaki tanpa memasukkan rumusan doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme puisi dipertahankan melalui dua pertanyaan dengan pola yang sama; istilah teologis dibuat mudah dipahami tanpa menghilangkan ambiguitas Ibrani.
