base_translation:
  language: en
  yaml_path: translation/ot/job/004/018.yaml
  text: Look[a], he puts no trust in his servants[b], and he charges his messengers with error.
translation:
  language: id
  text: Sesungguhnya, Ia tidak menaruh kepercayaan kepada hamba-hamba-Nya, dan Ia mendapati kekeliruan pada utusan-utusan-Nya[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “malaikat-malaikat-Nya.” Kata Ibrani ini dapat menunjuk kepada utusan manusia maupun surgawi; dalam konteks ini kemungkinan besar yang dimaksud ialah makhluk surgawi.
    reason: alternative_reading
  - marker: b
    text: Atau “kebodohan,” “kesalahan,” atau “ketidaksempurnaan.” Kata Ibrani yang dipakai di sini sangat jarang dan makna tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menandai penegasan dan menarik perhatian. “Sesungguhnya” mempertahankan daya penegasnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: בַּעֲבָדָיו
  choice: kepada hamba-hamba-Nya
  rationale: Preposisi ב bersama bentuk Hifil dari אמן menandai pihak yang menjadi sasaran kepercayaan. “Hamba-hamba” menekankan kedudukan mereka sebagai bawahan Allah tanpa mengutamakan status sosial sebagai budak.
- source_word: לֹא יַאֲמִין
  choice: Ia tidak menaruh kepercayaan
  rationale: Bentuk Hifil dari אמן di sini menyatakan kepercayaan atau keyakinan terhadap seseorang, bukan sekadar mempercayai suatu pernyataan.
- source_word: וּבְמַלְאָכָיו
  choice: kepada utusan-utusan-Nya
  rationale: מַלְאָךְ secara leksikal berarti “utusan” dan dapat menunjuk kepada utusan manusia ataupun surgawi. Konteks kemungkinan besar menunjuk kepada makhluk surgawi, tetapi terjemahan utama mempertahankan keluasan istilah Ibrani.
- source_word: יָשִׂים
  choice: Ia menimpakan
  rationale: שׂים dengan nomina abstrak di sini berarti menaruh, mengenakan, atau memperhitungkan sesuatu kepada pihak tertentu. “Menimpakan” mengungkapkan tindakan mengaitkan kekeliruan itu kepada para utusan-Nya tanpa mengubahnya menjadi sekadar tindakan menemukan.
- source_word: תָּהֳלָה
  choice: kekeliruan
  rationale: Nomina yang sangat jarang ini dapat menyatakan kekeliruan, kebodohan, kesalahan, atau ketidaksempurnaan. “Kekeliruan” cukup luas dan tidak menetapkan nuansa yang tidak pasti secara berlebihan.
theological_decisions:
- issue: Apakah מַלְאָכָיו harus diterjemahkan secara khusus sebagai “malaikat-malaikat-Nya” atau secara leksikal sebagai “utusan-utusan-Nya”
  choice: utusan-utusan-Nya
  alternative: malaikat-malaikat-Nya
  rationale: Makna dasar מַלְאָךְ ialah “utusan,” walaupun konteks perbandingan dengan hamba-hamba Allah kemungkinan besar menunjuk kepada makhluk surgawi. Terjemahan utama mempertahankan ambiguitas leksikal, sedangkan tafsiran yang sangat mungkin dicatat dalam catatan kaki.
- issue: Nuansa תָּהֳלָה yang dikenakan kepada para utusan Allah
  choice: kekeliruan
  alternative: kebodohan, kesalahan, atau ketidaksempurnaan
  rationale: Karena kata ini langka dan cakupan maknanya tidak sepenuhnya pasti, terjemahan tidak boleh menentukan secara sempit apakah yang dimaksud ialah kesalahan moral, kebodohan, atau keterbatasan makhluk.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan paralel puisi dipertahankan, bentuk hormat “-Nya” digunakan untuk rujukan kepada Allah, dan kata “pun” menonjolkan gagasan bahwa bahkan hamba-hamba Allah tidak menjadi objek kepercayaan mutlak-Nya.
