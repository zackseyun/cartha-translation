  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: id
  text: 'Lalu Elifas, orang Teman, menjawab dan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam rumus naratif dialog, verba ענה berarti menjawab atau menanggapi. “Menjawab” mempertahankan bentuk konvensional dan sesuai sebagai tanggapan terhadap perkataan Ayub.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַתֵּימָנִי
  choice: orang Teman
  rationale: Adjektiva nisbah ini menunjukkan orang yang berasal dari Teman. “Orang Teman” jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: Rumus pengantar ujaran Ibrani ini dipertahankan secara alami dalam bahasa Indonesia. “Katanya” menghindari rangkaian yang kaku “menjawab dan berkata” tanpa menghilangkan fungsi pengantar perkataan langsung.
- source_word: וַ
  choice: Lalu
  rationale: Waw-konsekutif awal melanjutkan urutan narasi; “Lalu” menyatakan peralihan dan urutan secara wajar.
