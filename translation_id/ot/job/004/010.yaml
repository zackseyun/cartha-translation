id: JOB.4.10
reference: Job 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שַׁאֲגַ֣ת אַ֭רְיֵה וְ/ק֣וֹל שָׁ֑חַל וְ/שִׁנֵּ֖י כְפִירִ֣ים נִתָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/010.yaml
  text: The lion’s roar[a], and the voice of the fierce lion, and the teeth of the young lions are broken.
translation:
  language: id
  text: Auman singa, suara singa yang ganas, dan gigi singa-singa muda telah dipatahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah dicabut” atau “telah direnggut.” Kata kerja Ibrani menggambarkan pematahan atau pencabutan dengan kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲגַת
  choice: auman
  rationale: Nomina bentuk terikat dari שׁאג yang menunjuk pada bunyi raungan singa. “Auman” merupakan padanan Indonesia yang alami dan puitis.
- source_word: אַרְיֵה
  choice: singa
  rationale: Istilah Ibrani umum untuk singa; konteks tidak menuntut padanan yang lebih khusus.
- source_word: קוֹל
  choice: suara
  rationale: קוֹל dapat berarti “suara” atau “bunyi.” “Suara” mempertahankan kesejajaran puitis dengan “auman” tanpa menyamakan kedua ungkapan itu.
- source_word: שָׁחַל
  choice: singa yang ganas
  rationale: Istilah puitis bagi singa yang menonjolkan kekuatan atau keganasannya. Padanan ini membedakannya dari אַרְיֵה tanpa memakai pengertian “singa hitam” yang tidak pasti.
- source_word: שִׁנֵּי
  choice: gigi
  rationale: Bentuk jamak konstruksi dari kata “gigi”; dalam bahasa Indonesia jumlah jamak sudah jelas melalui pemiliknya, yaitu “singa-singa muda.”
- source_word: כְפִירִים
  choice: singa-singa muda
  rationale: כפיר menunjuk pada singa muda yang kuat, bukan sekadar anak singa yang masih lemah. Bentuk ulang menyatakan jamak secara jelas.
- source_word: נִתָּעוּ
  choice: telah dipatahkan
  rationale: Bentuk Nifal perfek jamak menggambarkan tindakan keras yang menghilangkan atau menghancurkan gigi. “Telah dipatahkan” alami dalam citra puitis ini, sedangkan kemungkinan ‘dicabut’ atau ‘direnggut’ dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya puitis yang ringkas. Susunan paralel teks Ibrani dipertahankan, termasuk ketegangan citranya: satu kata kerja pada akhir baris berlaku bagi rangkaian “auman,” “suara,” dan “gigi.” Penanda catatan kaki ditempatkan sesudah kata kerja yang menjadi pokok alternatif leksikal.'
