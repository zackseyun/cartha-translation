id: JOB.4.8
reference: Job 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר רָ֭אִיתִי חֹ֣רְשֵׁי אָ֑וֶן וְ/זֹרְעֵ֖י עָמָ֣ל יִקְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/008.yaml
  text: As I have seen[b][a], those who plow iniquity and sow trouble reap it.
translation:
  language: id
  text: Seperti yang telah kulihat, mereka yang membajak kejahatan[a] dan menabur kesusahan[b] akan menuai hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kefasikan”; kata Ibrani ini dapat menunjuk pada kejahatan moral dan, dalam konteks tertentu, kesusahan yang ditimbulkannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “penderitaan” atau “bahaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Seperti yang
  rationale: Mengantar pengamatan berdasarkan pengalaman Elifas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan yang dinyatakan teks Ibrani.
- source_word: רָאִיתִי
  choice: telah kulihat
  rationale: Bentuk perfek orang pertama tunggal menunjuk pada apa yang telah diamati sendiri oleh pembicara; bentuk ini sesuai dengan daya ungkap pepatah dalam konteks.
- source_word: חֹרְשֵׁי
  choice: mereka yang membajak
  rationale: Partisipel dipakai secara substantival. Terjemahan ini alami dan mempertahankan metafora pertanian.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Kata ini dapat berarti kejahatan moral maupun kesusahan yang ditimbulkannya. Dalam pasangan dengan עָמָל, makna moral paling menonjol, tanpa meniadakan alternatif leksikalnya.
- source_word: וְזֹרְעֵי
  choice: dan menabur
  rationale: Partisipel koordinatif melanjutkan metafora pertanian. Tidak mengulang 'mereka yang' membuat kalimat lebih lancar tanpa menghilangkan paralelismenya.
- source_word: עָמָל
  choice: kesusahan
  rationale: Kata ini dapat menunjuk pada kesusahan, penderitaan, atau bahaya. 'Kesusahan' mempertahankan keluasan makna serta kaitannya dengan akibat yang dituai.
- source_word: יִקְצְרֻהוּ
  choice: akan menuai hal itu
  rationale: Verba dengan sufiks objek maskulin tunggal merujuk kembali secara ringkas pada apa yang dibajak dan ditabur. 'Menuai hal itu' mempertahankan metafora sekaligus rujukan kolektifnya.
theological_decisions:
- issue: Kausalitas moral dalam perkataan Elifas
  choice: Pepatah diterjemahkan secara lugas sebagai prinsip yang diklaim Elifas berdasarkan pengamatannya.
  alternative: Menjadikannya pernyataan doktrinal mutlak tentang pembalasan, atau melemahkannya menjadi sekadar kecenderungan umum.
  rationale: Ayat ini merupakan bagian dari argumen Elifas kepada Ayub. Terjemahan mempertahankan kekuatan klaimnya tanpa menjadikannya secara tersirat sebagai putusan teologis terakhir kitab ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora membajak, menabur, dan menuai dipertahankan; klaim Elifas tidak diperkuat atau diperlemah secara interpretatif.
