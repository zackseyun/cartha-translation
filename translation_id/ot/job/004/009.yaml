  text: מִ/נִּשְׁמַ֣ת אֱל֣וֹהַ יֹאבֵ֑דוּ וּ/מֵ/ר֖וּחַ אַפּ֣/וֹ יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: id
  text: Oleh napas Allah mereka binasa[a], dan oleh embusan[c] murka-Nya mereka lenyap[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dari napas Allah mereka binasa.” Kata depan Ibrani dapat menunjukkan sumber atau sarana; di sini diterjemahkan sebagai sarana.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka habis” atau “mereka berakhir.”
    reason: lexical_alternative
  - marker: c
    text: “Embusan” menerjemahkan kata Ibrani ruakh, yang juga dapat berarti “angin”, “napas”, atau “roh”. Dalam konteks ini, maksudnya ialah hembusan dahsyat yang berkaitan dengan murka-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: oleh napas
  rationale: נְשָׁמָה berarti napas; prefiks מִן di sini paling wajar dipahami secara instrumental atau kausal. ‘Oleh napas’ mempertahankan citra puitis dan tetap alami dalam bahasa Indonesia.
- source_word: אֱלוֹהַ
  choice: Allah
  rationale: אֱלוֹהַ adalah bentuk tunggal puitis untuk Allah yang sering dipakai dalam kitab Ayub; tidak ada dasar untuk menambahkan gelar lain.
- source_word: יֹאבֵדוּ
  choice: mereka binasa
  rationale: Bentuk dari אבד menyatakan binasa atau musnah. ‘Binasa’ mempertahankan daya intransitifnya dan selaras dengan paralelisme puisi.
- source_word: וּמֵרוּחַ
  choice: dan oleh embusan
  rationale: רוּחַ dapat berarti angin, napas, roh, atau embusan. Dalam kesejajaran dengan ‘napas’ dan hubungan dengan murka, ‘embusan’ menyampaikan hembusan kuat tanpa menimbulkan pengertian teologis ‘roh’.
- source_word: אַפּוֹ
  choice: murka-Nya
  rationale: אַף secara harfiah berarti hidung atau lubang hidung, tetapi secara idiomatis juga berarti kemarahan. ‘Murka-Nya’ cocok dengan konteks penghukuman ilahi dan mempertahankan ragam bahasa yang bermartabat.
- source_word: יִכְלוּ
  choice: mereka lenyap
  rationale: כלה dalam bentuk Qal dapat berarti habis, berakhir, atau dilenyapkan. ‘Lenyap’ menghasilkan baris puitis yang alami dan tidak membatasi gambaran pada konsumsi material.
theological_decisions:
- issue: Pengungkapan antropomorfis tentang kemarahan Allah
  choice: Menerjemahkan אַפּוֹ secara idiomatis sebagai ‘murka-Nya’, sambil mempertahankan gambaran napas dan embusan.
  alternative: ‘lubang hidung-Nya’ atau ‘amarah-Nya’
  rationale: Makna idiomatisnya adalah kemarahan, sedangkan terjemahan harfiah ‘lubang hidung-Nya’ dapat mengaburkan maksud bagi pembaca modern. ‘Murka’ mempertahankan bobot puitis tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya puitis yang ringkas dan bermartabat. Paralelisme kedua larik dipertahankan; ‘napas’ dan ‘embusan’ membedakan dua istilah Ibrani yang berdekatan maknanya.
