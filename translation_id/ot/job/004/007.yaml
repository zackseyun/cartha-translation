source:
  edition: WLC
  text: זְכָר נָ֗א מִ֤י ה֣וּא נָקִ֣י אָבָ֑ד וְ֝/אֵיפֹ֗ה יְשָׁרִ֥ים נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/007.yaml
  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: id
  text: 'Ingatlah kiranya: siapakah orang yang tidak bersalah[a] yang pernah binasa? Atau di manakah orang-orang lurus pernah dilenyapkan?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak bercela.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ditumpas” atau “dimusnahkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Ingatlah kiranya
  rationale: Bentuk imperatif זְכָר memerintahkan untuk mengingat atau merenungkan, sedangkan נָא melembutkan permintaan. ‘Ingatlah kiranya’ mempertahankan keduanya dalam ragam bahasa yang santun dan bermartabat.
- source_word: מִי הוּא
  choice: siapakah orang ... yang
  rationale: Gabungan kata tanya dan pronomina memberi penekanan pada pertanyaan retoris, yang secara alami tersampaikan dalam susunan ‘siapakah orang ... yang’.
- source_word: נָקִי
  choice: tidak bersalah
  rationale: נָקִי menunjuk pada orang yang bebas dari kesalahan atau tidak berdosa dalam perkara tertentu. ‘Tidak bersalah’ jelas bagi pembaca modern dan tidak mempersempit maknanya menjadi kesempurnaan moral mutlak.
- source_word: אָבָד
  choice: binasa
  rationale: Bentuk Qal dari אבד menyatakan kebinasaan atau kehancuran. ‘Binasa’ mempertahankan bobot kata tersebut dan cocok dengan pertanyaan retoris ini.
- source_word: וְאֵיפֹה
  choice: Atau di manakah
  rationale: Konjungsi dengan kata tanya membuka baris paralel kedua. ‘Atau di manakah’ menyampaikan hubungan retoris antarkedua pertanyaan secara alami dalam bahasa Indonesia.
- source_word: יְשָׁרִים
  choice: orang-orang lurus
  rationale: Adjektiva jamak ini dipakai secara substantival bagi orang yang lurus secara moral. Bentuk eksplisit ‘orang-orang lurus’ lebih alami dan mudah dipahami daripada sekadar ‘yang lurus’.
- source_word: נִכְחָדוּ
  choice: dilenyapkan
  rationale: Bentuk Niphal dari כחד dapat menyatakan dihapuskan, dimusnahkan, atau dibuat lenyap. ‘Dilenyapkan’ mempertahankan unsur pasif serta hasil berupa ketiadaan tanpa menentukan secara berlebihan cara kehancurannya.
theological_decisions:
- issue: Pernyataan retoris Elifas mengenai nasib orang yang tidak bersalah dan orang lurus
  choice: Menyajikannya secara langsung sebagai pertanyaan retoris Elifas tanpa melemahkan ataupun mengesahkannya sebagai kesimpulan kitab Ayub.
  alternative: Menambahkan bahasa yang mengisyaratkan bahwa klaim Elifas kelak dipersoalkan oleh alur kitab.
  rationale: Ayat ini harus mempertahankan kekuatan argumen Elifas sebagaimana diucapkannya, sementara ketegangan dengan pengalaman Ayub dan keseluruhan kitab tidak boleh diselesaikan melalui penambahan tafsiran dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan ‘kiranya’ dipakai untuk membawa daya pelembut נָא tanpa menjadi terlalu percakapan; struktur pertanyaan retoris dipertahankan.
