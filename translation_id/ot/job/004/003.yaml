  yaml_path: translation/ot/job/004/003.yaml
  text: Behold[a], you have instructed many, and you have strengthened weak hands.
translation:
  language: id
  text: Sesungguhnya, engkau telah mendidik[a] banyak orang dan menguatkan tangan yang lemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mendisiplinkan” atau “menegur”; kata Ibrani ini dapat mencakup pengajaran melalui koreksi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Penanda wacana yang menarik perhatian dan memberi penekanan. “Sesungguhnya” mempertahankan nada puitis yang luhur tanpa terdengar seperti perintah harfiah untuk melihat.
- source_word: יִסַּרְתָּ
  choice: telah mendidik
  rationale: Kata kerja יסר dapat berarti mendidik melalui teguran atau koreksi, mendisiplinkan, atau menghajar. Dalam konteks pujian Elifas atas peranan Ayub terhadap orang lain, “mendidik” menyampaikan makna positif utama, sedangkan cakupan korektifnya dipertahankan dalam catatan kaki.
- source_word: רַבִּים
  choice: banyak orang
  rationale: Bentuk ini merujuk kepada banyak orang; penambahan “orang” diperlukan agar alami dan jelas dalam bahasa Indonesia.
- source_word: יָדַיִם רָפוֹת
  choice: tangan yang lemah
  rationale: Ungkapan ini menggambarkan hilangnya kekuatan atau semangat. Terjemahan ini mempertahankan metafora tubuh dan tetap mudah dipahami.
- source_word: תְּחַזֵּק
  choice: menguatkan
  rationale: Bentuk piel dari חזק berarti membuat kuat atau menguatkan. Dalam kesejajaran dengan tindakan sebelumnya, bentuk Indonesia ini menyatakan tindakan Ayub pada masa lampau tanpa memaksakan pembedaan aspek yang tidak alami.
