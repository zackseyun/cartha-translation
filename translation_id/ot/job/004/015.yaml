translation:
  language: id
  text: Lalu, sebuah roh melintas di depan wajahku[a]; bulu-bulu di tubuhku berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “angin” atau “napas” melintas di depan wajahku. Kata Ibrani רוּחַ dapat berarti “roh”, “angin”, atau “napas”; dalam konteks ini, “roh” tampaknya paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: suatu roh
  rationale: רוּחַ dapat berarti roh, angin, atau napas. Dalam konteks pengalaman misterius yang menimbulkan rasa gentar ini, 'roh' paling sesuai, sedangkan 'suatu' mempertahankan ketakrifan yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: עַל פָּנַי
  choice: di depan wajahku
  rationale: Secara harfiah berarti 'pada/di atas wajahku', tetapi bersama יַחֲלֹף ungkapan ini menunjuk pada gerakan yang melintas di hadapan pembicara. Pilihan ini mempertahankan gambaran konkret teks.
- source_word: יַחֲלֹף
  choice: melintas
  rationale: Bentuk ini berarti lewat atau berlalu. 'Melintas' alami dalam bahasa Indonesia dan menyampaikan gerakan di depan wajah pembicara tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: תְּסַמֵּר
  choice: berdiri
  rationale: Kata kerja ini menggambarkan sesuatu yang menjadi kaku atau tegak. Dengan bulu sebagai subjek, ungkapan Indonesia yang alami ialah 'bulu ... berdiri'.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: bulu di tubuhku
  rationale: Frasa konstruksi ini secara harfiah berarti 'bulu dagingku'. 'Bulu di tubuhku' mempertahankan maknanya dengan bahasa Indonesia modern yang wajar dan bermartabat.
