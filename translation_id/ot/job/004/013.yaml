  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: id
  text: Di tengah pikiran-pikiran yang menggelisahkan, yang timbul dari penglihatan-penglihatan pada malam hari[a], ketika tidur lelap menimpa manusia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dari penglihatan-penglihatan malam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: Di tengah pikiran-pikiran yang menggelisahkan
  rationale: Kata ini menunjuk pada pikiran atau renungan yang terbagi dan meresahkan. Ungkapan ini mempertahankan nuansa kegelisahan batin sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: yang timbul dari penglihatan-penglihatan pada malam hari
  rationale: חֶזְיֹנוֹת berarti penglihatan-penglihatan, sedangkan מִן menyatakan sumber atau sebab. Frasa 'pada malam hari' menghindari kemungkinan salah paham bahwa yang dimaksud ialah kemampuan melihat pada malam hari.
- source_word: בִּנְפֹל
  choice: ketika ... menimpa
  rationale: Infinitif konstruk dengan בְּ membentuk anak kalimat waktu. 'Ketika' menyampaikan hubungan temporal itu secara alami.
- source_word: תַּרְדֵּמָה
  choice: tidur lelap
  rationale: Istilah ini mengacu pada tidur yang berat atau sangat dalam, bukan sekadar tidur biasa.
- source_word: עַל אֲנָשִׁים
  choice: menimpa manusia
  rationale: Preposisi עַל dipadankan melalui verba 'menimpa', sedangkan אֲנָשִׁים di sini dipakai secara umum untuk umat manusia. Bahasa Indonesia tidak menuntut bentuk maskulin untuk mempertahankan makna generiknya.
theological_decisions:
- issue: Cakupan generik אֲנָשִׁים
  choice: manusia
  alternative: orang-orang / laki-laki
  rationale: Dalam konteks ini bentuk jamak maskulin tersebut merujuk secara generik kepada manusia. 'Manusia' mempertahankan cakupan itu tanpa memasukkan pembatasan jenis kelamin yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat dipertahankan sebagai bagian dari kalimat puitis yang berlanjut ke ayat berikutnya; karena itu ayat berakhir dengan koma.
