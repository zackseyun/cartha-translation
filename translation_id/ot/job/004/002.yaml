  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan ‘sepatah kata’ membuat pembukaan tentatif Elifas terdengar alami, sementara ‘menahan kata-kata’ mempertahankan citra dan pengulangan leksikal teks Ibrani.
