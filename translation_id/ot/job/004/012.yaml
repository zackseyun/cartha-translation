translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan kalimat mempertahankan citra telinga yang menangkap sesuatu yang sangat lirih, sambil menghindari terjemahan harfiah 'dicuri' yang berpotensi menyesatkan.
