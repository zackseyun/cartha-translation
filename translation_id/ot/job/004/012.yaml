  yaml_path: translation/ot/job/004/012.yaml
  text: A word was secretly brought to me[a], and my ear caught a whisper of it.
translation:
  language: id
  text: Sebuah perkataan disampaikan kepadaku secara diam-diam, dan telingaku menangkap bisikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telingaku menangkap sedikit darinya” atau “menangkap bunyi samar darinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַי
  choice: kepadaku
  rationale: Mempertahankan tujuan yang dinyatakan oleh preposisi אֶל dengan sufiks orang pertama; waw tidak diberi padanan tersendiri karena alur bahasa Indonesia sudah cukup alami tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: דָּבָר
  choice: sebuah perkataan
  rationale: Dalam konteks pengalaman pewahyuan ini, 'perkataan' mempertahankan bentuk yang ringkas dan misterius tanpa memperluasnya menjadi 'pesan'.
- source_word: יְגֻנָּב
  choice: disampaikan ... secara diam-diam
  rationale: Bentuk pasif dari גנב secara harfiah berkaitan dengan pencurian, tetapi di sini dipakai secara metaforis untuk sesuatu yang sampai dengan sembunyi-sembunyi; ungkapan ini mempertahankan sifat rahasia tanpa memberi kesan bahwa perkataan itu benar-benar dicuri.
- source_word: וַתִּקַּח
  choice: menangkap
  rationale: Walaupun arti dasarnya 'mengambil/menerima', dengan 'telingaku' sebagai subjek, 'menangkap' merupakan ungkapan pendengaran yang alami sekaligus mempertahankan gambaran konkret Ibrani.
- source_word: אָזְנִי
  choice: telingaku
  rationale: Mempertahankan bentuk tunggal dan gambaran anggota tubuh dalam teks Ibrani.
- source_word: שֵׁמֶץ
  choice: bisikannya
  rationale: Kata ini menunjuk pada sedikit bagian, jejak, isyarat, atau bunyi samar. Dalam konteks pendengaran, 'bisikan' sesuai dengan suasana pewahyuan yang lirih, sedangkan keluasan maknanya dicatat dalam catatan kaki.
- source_word: מֶנְהוּ
  choice: -nya (pada 'bisikannya')
  rationale: Preposisi dengan pronomina ini secara harfiah berarti 'darinya'. Sufiks '-nya' secara alami menghubungkan bisikan itu dengan perkataan yang disebut sebelumnya.
