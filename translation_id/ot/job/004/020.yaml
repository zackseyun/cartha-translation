base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: id
  text: Dari pagi sampai petang mereka diremukkan; tanpa seorang pun memperhatikannya[a], mereka binasa untuk selamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanpa seorang pun menaruhnya dalam hati” atau “tanpa seorang pun menghiraukannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: Dari pagi sampai petang
  rationale: Ungkapan waktu berpasangan ini menunjukkan rentang satu hari dan menekankan singkat serta rapuhnya hidup manusia. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan gambaran Ibrani.
- source_word: יֻכַּתּוּ
  choice: mereka diremukkan
  rationale: Bentuk Hofal menyatakan tindakan pasif berupa dipukul hingga remuk atau dihancurkan. 'Diremukkan' mempertahankan daya ungkap dan bentuk pasif tanpa menentukan sarana penghancurannya.
- source_word: מִבְּלִי מֵשִׂים
  choice: tanpa seorang pun memperhatikannya
  rationale: Ungkapan eliptis ini secara harfiah berkaitan dengan 'menaruh/menempatkan', mungkin maksudnya menaruh dalam hati atau pikiran. Terjemahan ini menyampaikan bahwa kebinasaan mereka tidak dihiraukan, sambil menempatkan alternatif yang lebih harfiah dalam catatan kaki.
- source_word: לָנֶצַח
  choice: untuk selamanya
  rationale: Kata ini menyatakan kelangsungan yang tetap dan di sini menekankan sifat kebinasaan yang tidak dapat dibalikkan. Terjemahan tidak memperluasnya menjadi pernyataan khusus tentang penghukuman eskatologis.
- source_word: יֹאבֵדוּ
  choice: mereka binasa
  rationale: Qal dari אבד berarti binasa, lenyap, atau hilang. 'Binasa' mempertahankan cakupan makna kehancuran tanpa memasukkan nuansa teologis yang lebih sempit.
theological_decisions:
- issue: Finalitas kefanaan manusia dalam perkataan Elifas
  choice: Ayat diterjemahkan sebagai pernyataan tentang kerapuhan manusia dan kematian yang tidak diperhatikan, dengan tetap mempertahankan ungkapan 'untuk selamanya'.
  alternative: Memahami 'untuk selamanya' sebagai pernyataan langsung tentang kebinasaan eskatologis terakhir.
  rationale: Dalam konteksnya, Elifas sedang menggambarkan rapuhnya manusia di hadapan Allah. Ungkapan tersebut menekankan kematian yang tidak dapat dibalikkan dan kefanaan manusia, tetapi terjemahan tidak menutup kemungkinan nuansa lain dengan menambahkan penjelasan doktrinal ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Petang' mempertahankan pasangan puitis pagi–petang; 'diremukkan' dan 'binasa' menjaga kekuatan metafora serta nada hikmat Ibrani.
