  text: Your words have raised up the one who stumbles[b][a], and you have strengthened knees that were giving way.
translation:
  language: id
  text: Kata-katamu telah menegakkan[a] orang yang tersandung, dan engkau telah menguatkan lutut yang goyah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menopang” atau “membuat berdiri.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “lutut yang tertekuk”; maksudnya ialah lutut yang melemah atau hampir tidak sanggup menyangga tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: orang yang tersandung
  rationale: Partisipel dari כשל menggambarkan orang yang tersandung atau terhuyung. Pilihan ini mempertahankan gambaran konkret dan alami dalam bahasa Indonesia.
- source_word: יְקִימוּן
  choice: telah menegakkan
  rationale: Bentuk Hifil dari קום bersifat kausatif, yaitu membuat berdiri atau menegakkan. Bentuk ini juga selaras dengan gambaran lutut yang goyah pada baris kedua.
- source_word: מִלֶּיךָ
  choice: kata-katamu
  rationale: Bentuk jamak מִלָּה secara langsung berarti kata-kata atau perkataan; 'kata-katamu' ringkas dan wajar.
- source_word: בִרְכַּיִם
  choice: lutut
  rationale: Istilah anggota tubuh ini dipertahankan secara harfiah karena citra puitisnya jelas dalam bahasa Indonesia.
- source_word: כֹּרְעוֹת
  choice: yang goyah
  rationale: Dari כרע, 'membungkuk, berlutut, atau merosot'. Dalam hubungannya dengan lutut, kata ini menggambarkan lutut yang melemah dan hampir tertekuk; 'goyah' menyampaikan keadaan itu dengan alami.
- source_word: תְּאַמֵּץ
  choice: engkau telah menguatkan
  rationale: Bentuk Piel dari אמץ berarti menguatkan atau membuat kukuh. Terjemahan ini mempertahankan kesejajaran dengan tindakan menegakkan pada baris pertama.
