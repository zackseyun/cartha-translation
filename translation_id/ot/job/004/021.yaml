  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: id
  text: Bukankah tali kemah mereka dicabut dari dalam diri mereka?[a] Mereka mati, bukan dalam hikmat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Bukankah tali mereka direnggut dari mereka?” Secara tradisional diterjemahkan, “Bukankah keunggulan mereka disingkirkan dari mereka?” Bahasa Ibrani kemungkinan besar membangkitkan gambaran kemah: tali kehidupan atau tali kemah dicabut.'
    reason: lexical_alternative
  - marker: b
    text: Atau, “Mereka mati tanpa hikmat,” “Mereka mati sebelum memperoleh hikmat,” atau “Mereka mati dengan tidak bijaksana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan.
- source_word: נִסַּע
  choice: dicabut
  rationale: Bentuk pasif dari נסע dapat menggambarkan sesuatu yang dicabut atau dibongkar, khususnya dalam konteks kemah; pilihan ini mempertahankan citra tersebut tanpa harus memberi nuansa kekerasan seperti 'direnggut'.
- source_word: יִתְרָם
  choice: tali kemah mereka
  rationale: יֶתֶר dapat berarti tali, termasuk tali kemah. Makna konkret ini sesuai dengan gambaran tempat tinggal manusia yang rapuh dalam konteks ayat sebelumnya.
- source_word: בָּם
  choice: dari dalam diri mereka
  rationale: Ungkapan ini menyampaikan ב dengan sufiks jamak sebagai lokasi internal sekaligus melengkapi verba 'dicabut' secara alami dalam bahasa Indonesia.
- source_word: יָמוּתוּ
  choice: Mereka mati
  rationale: מות adalah verba umum untuk mati; terjemahan langsung ini tidak menambahkan bobot tafsir.
- source_word: וְלֹא בְחָכְמָה
  choice: tanpa memperoleh hikmat
  rationale: Frasa Ibrani ini ringkas dan ambigu. Dalam teks utama dipilih pengertian bahwa mereka mati tanpa sempat mencapai hikmat, sementara catatan mempertahankan kemungkinan arti yang lebih harfiah atau adverbial.
theological_decisions:
- issue: Makna וְלֹא בְחָכְמָה dalam kaitannya dengan kematian
  choice: tanpa memperoleh hikmat
  alternative: dan tidak dalam hikmat; tidak dengan bijaksana
  rationale: Teks Ibrani tidak menjelaskan apakah orang-orang itu mati sebelum mencapai hikmat, mati tanpa hikmat, atau mati dengan cara yang tidak bijaksana. Terjemahan utama dibuat alami, sedangkan keragaman makna dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Citra kemah dipertahankan secara eksplisit agar kaitannya dengan konteks tetap jelas. Semua penanda catatan kaki dicantumkan dalam teks utama.
