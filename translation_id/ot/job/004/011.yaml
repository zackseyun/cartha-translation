  source_fidelity: 'Teks Indonesia dengan setia menyampaikan paralelisme Ibrani: לַיִשׁ sebagai “singa,” אֹבֵד sebagai “binasa,” מִבְּלִי טָרֶף sebagai sebab kekurangan mangsa, dan יִתְפָּרָדוּ sebagai “tercerai-berai.” “Anak-anak singa” merupakan padanan alami untuk בְנֵי לָבִיא dan tidak memaksakan apakah לָבִיא berarti singa jantan atau singa betina.'
