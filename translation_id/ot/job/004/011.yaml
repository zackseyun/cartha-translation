  variant: modern standard Indonesian
source:
  edition: WLC
  text: לַ֭יִשׁ אֹבֵ֣ד מִ/בְּלִי טָ֑רֶף וּ/בְנֵ֥י לָ֝בִ֗יא יִתְפָּרָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/011.yaml
  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: id
  text: Singa binasa karena tidak mendapat mangsa, dan anak-anak singa[a] tercerai-berai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anak-anak singa betina” atau “anak-anak singa yang ganas.” Istilah Ibrani untuk singa memiliki nuansa yang beragam, dan לָבִיא dapat dipahami sebagai “singa” atau “singa betina.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: singa
  rationale: Kata ini menunjuk pada singa, mungkin dengan nuansa kuat atau dewasa. 'Singa' paling wajar dan tidak menambahkan rincian yang tidak pasti.
- source_word: אֹבֵד
  choice: binasa
  rationale: Partisipel dari אבד menyatakan kebinasaan atau kehancuran. 'Binasa' mempertahankan nada pepatah yang tajam dan puitis.
- source_word: מִבְּלִי
  choice: karena tidak mendapat
  rationale: Ungkapan ini menyatakan ketiadaan atau kekurangan. Dalam konteks pemangsa, 'karena tidak mendapat' mengungkapkan hubungan sebab secara alami dalam bahasa Indonesia.
- source_word: טָרֶף
  choice: mangsa
  rationale: Kata ini secara khusus mengacu pada hasil buruan atau mangsa pemangsa, bukan sekadar makanan.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Secara harfiah berarti 'anak-anak lelaki/keturunan', tetapi dalam gambaran tentang hewan, 'anak-anak' alami dan tetap mempertahankan hubungan keturunan.
- source_word: לָבִיא
  choice: singa
  rationale: Kata ini dapat menunjuk pada singa atau singa betina. Teks tidak memastikan jenis kelaminnya, sehingga 'singa' mempertahankan ambiguitas leksikal tanpa mempersempit makna.
- source_word: יִתְפָּרָדוּ
  choice: tercerai-berai
  rationale: Bentuk ini menyatakan bahwa mereka berpisah atau tersebar. 'Tercerai-berai' sesuai dengan gambaran bubarnya kelompok keluarga dan kuat secara puitis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada puitis-bermartabat. Susunan dua klausa paralel dipertahankan, dan ambiguitas jenis kelamin pada לָבִיא tidak diselesaikan secara paksa.
