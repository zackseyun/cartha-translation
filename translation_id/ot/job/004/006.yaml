lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Memperkenalkan pertanyaan retoris yang mengharapkan persetujuan, dengan bentuk yang alami dan tetap bermartabat dalam bahasa Indonesia.
- source_word: יִרְאָתְךָ
  choice: takutmu akan Allah
  rationale: Secara harfiah objek kata 'takut' tidak disebutkan, tetapi dalam sastra hikmat ungkapan ini lazim menunjuk pada takut akan Allah. Objek diperjelas dalam teks utama, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כִּסְלָתֶךָ
  choice: keyakinanmu
  rationale: Dalam konteks ini nomina tersebut berarti keyakinan atau kepercayaan, bukan kebodohan. 'Keyakinanmu' sesuai dengan kesejajaran terhadap 'harapanmu' dan terdengar alami.
- source_word: תִּקְוָתְךָ
  choice: harapanmu
  rationale: Padanan baku dan alami bagi תקוה yang mempertahankan gagasan pengharapan atau penantian penuh harap.
- source_word: וְתֹם
  choice: dan ketulusan
  rationale: תֹּם menyatakan keutuhan moral, integritas, atau keadaan tak bercela. 'Ketulusan' alami dalam frasa ini dan tidak memberi kesan kesempurnaan mutlak.
- source_word: דְּרָכֶיךָ
  choice: jalan hidupmu
  rationale: Mempertahankan metafora Ibrani 'jalan' sekaligus memperjelas bahwa yang dimaksud ialah perilaku atau cara hidup.
theological_decisions:
- issue: Objek tersirat dari 'takut'
  choice: takutmu akan Allah
  alternative: takutmu; rasa hormatmu
  rationale: Teks Ibrani tidak menyatakan objeknya, tetapi konteks sastra hikmat sangat mungkin menunjuk kepada Allah. Penambahan kontekstual ini diberi catatan agar ambiguitas sumber tetap terlihat.
- issue: Hubungan sintaksis empat frasa nominal
  choice: 'Dua klausa sejajar: ''takutmu akan Allah [adalah] keyakinanmu'' dan ''ketulusan jalan hidupmu [adalah] harapanmu'''
  alternative: Membaca 'keyakinanmu', 'harapanmu', dan 'ketulusan jalan hidupmu' sebagai sebuah daftar
  rationale: Susunan Ibrani paling wajar dipahami sebagai dua pasangan sejajar. Terjemahan mempertahankan keseimbangan puitis tersebut tanpa menggabungkan unsur-unsurnya menjadi daftar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Bentuk pertanyaan retoris serta dua klausa nominal yang sejajar dipertahankan. 'Jalan hidup' mempertahankan metafora hikmat sambil tetap mudah dipahami.
