  yaml_path: translation/ot/job/004/005.yaml
  text: But now it comes to you[a], and you are weary; it touches you[b], and you are dismayed.
translation:
  language: id
  text: Namun sekarang, itu datang kepadamu[a], dan engkau menjadi letih; itu menyentuhmu[b], dan engkau menjadi gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab sekarang, itu datang kepadamu.” Kata penghubung Ibrani כִּי dapat dipahami dalam beberapa cara; terjemahan utama memakai arti pertentangan karena konteks membandingkan sikap Ayub dahulu dengan reaksinya sekarang.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja untuk “datang” dan “menyentuh” berbentuk feminin tunggal dalam bahasa Ibrani. Subjeknya tidak disebutkan, tetapi mungkin merujuk pada kesusahan atau malapetaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Namun
  rationale: Dalam konteksnya, Elifas mempertentangkan keteguhan Ayub ketika menasihati orang lain dengan reaksinya saat penderitaan menimpa dirinya sendiri. 'Namun' menyampaikan fungsi adversatif ini sambil mengakui kemungkinan kausal dalam catatan kaki.
- source_word: עַתָּה
  choice: sekarang
  rationale: Keterangan waktu ini menandai keadaan Ayub kini, berbeda dengan tindakannya dahulu.
- source_word: תָּבוֹא אֵלֶיךָ
  choice: ketika itu menimpa engkau
  rationale: Kata kerja feminin tunggal mempunyai subjek tersirat, mungkin kesusahan atau malapetaka. 'Itu' mempertahankan ketidaktersuratannya, sedangkan 'menimpa engkau' merupakan ungkapan Indonesia yang wajar bagi datangnya kesusahan kepada seseorang.
- source_word: וַתֵּלֶא
  choice: engkau menjadi letih
  rationale: Kata לאה menyatakan menjadi letih atau kehabisan daya. Pilihan ini tidak mempersempit maknanya menjadi ketidaksabaran moral.
- source_word: תִּגַּע עָדֶיךָ
  choice: ketika itu menyentuh engkau
  rationale: Kata נגע secara dasar berarti menyentuh, mencapai, atau menyerang. 'Menyentuh' mempertahankan gambaran Ibrani dan perkembangan dari datang kepada Ayub hingga mengenai dirinya.
- source_word: וַתִּבָּהֵל
  choice: engkau menjadi gentar
  rationale: Kata בהל menyampaikan keguncangan, keterkejutan, atau ketakutan. 'Gentar' mengungkapkan daya emosionalnya tanpa harus memperkuatnya menjadi teror.
theological_decisions:
- issue: Identitas subjek feminin tunggal pada תָּבוֹא dan תִּגַּע
  choice: Dibiarkan tersirat dengan kata 'itu'
  alternative: Menuliskan 'kesusahan' atau 'malapetaka' sebagai subjek
  rationale: Teks Ibrani tidak menyebutkan nomina subjek secara eksplisit. Tidak menambahkannya menjaga ambiguitas sumber dan menghindari penafsiran yang terlalu pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai sesuai register Alkitab yang tetap mudah dipahami. Pengulangan 'ketika itu' memperjelas hubungan klausa tanpa menyebut secara eksplisit subjek yang dibiarkan tersirat dalam bahasa Ibrani.
