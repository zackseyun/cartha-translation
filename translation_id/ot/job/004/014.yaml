  text: Fear came upon me[a], and trembling, and it made all my bones shake.
translation:
  language: id
  text: Ketakutan menimpa aku, dan kegentaran; itu membuat banyak tulangku gemetar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kelimpahan” atau “banyaknya tulang-tulangku dibuat gentar.” Ungkapan puitis Ibrani ini dapat menyatakan reaksi jasmani yang sangat hebat; juga dapat diterjemahkan, “banyak dari tulangku dibuatnya gemetar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד
  choice: ketakutan
  rationale: Nomina ini menyatakan rasa takut atau kengerian; “ketakutan” alami dalam bahasa Indonesia dan tidak memperkuat maknanya secara berlebihan.
- source_word: קְרָאַנִי
  choice: menyergap aku
  rationale: Di sini קרא bermakna menemui, menimpa, atau mendatangi. “Menyergap aku” menyampaikan datangnya pengalaman itu secara mendadak dan kuat, bukan tindakan memanggil.
- source_word: וּרְעָדָה
  choice: dan kegentaran
  rationale: Nomina ini menggambarkan reaksi gemetar akibat takut. “Kegentaran” menjaga kesejajaran puitis dengan “ketakutan” dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: וְרֹב עַצְמוֹתַי
  choice: semua tulangku
  rationale: Secara harfiah frasa ini berbunyi “banyaknya tulang-tulangku.” Dalam puisi, ungkapan itu menggambarkan reaksi jasmani yang menyeluruh; “semua tulangku” menyampaikan maksud tersebut secara wajar, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הִפְחִיד
  choice: dibuatnya gemetar
  rationale: Bentuk Hifil bersifat kausatif, yakni menyebabkan ketakutan. Dengan “tulang-tulang” sebagai objek, “dibuatnya gemetar” mengungkapkan akibat jasmani secara alami tanpa menghilangkan daya kausatifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan dua nomina pada awal ayat dipadatkan menjadi satu klausa yang alami, sedangkan citra konkret “tulang” dipertahankan. Pronomina “-nya” merujuk pada ketakutan dan kegentaran yang baru disebutkan.
