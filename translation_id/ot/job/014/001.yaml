source:
  edition: WLC
  text: אָ֭דָם יְל֣וּד אִשָּׁ֑ה קְצַ֥ר יָ֝מִ֗ים וּֽ/שְׂבַֽע רֹֽגֶז־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/001.yaml
  text: Man[a], born of woman[b], is short of days and full of turmoil.
translation:
  language: id
  text: Manusia yang lahir dari perempuan singkat umurnya dan penuh kesusahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penuh kegelisahan” atau “penuh gejolak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: manusia
  rationale: Nomina ini berbentuk tunggal generik dan di sini menyatakan keadaan manusia secara umum. “Manusia” mempertahankan acuan insani tanpa secara keliru membatasinya pada laki-laki.
- source_word: יְלוּד אִשָּׁה
  choice: yang lahir dari perempuan
  rationale: Ungkapan ini mempertahankan gambaran konkret dalam bahasa Ibrani tentang setiap manusia yang dilahirkan oleh perempuan serta menegaskan kefanaan manusia.
- source_word: קְצַר יָמִים
  choice: singkat umurnya
  rationale: Secara harfiah ungkapan ini berarti “pendek hari-harinya.” “Singkat umurnya” menyampaikan idiom tersebut dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: וּשְׂבַע רֹגֶז
  choice: dan penuh kesusahan
  rationale: שְׂבַע berarti “kenyang/penuh,” sedangkan רֹגֶז dapat menunjuk pada kesusahan, kegelisahan, atau gejolak. “Penuh kesusahan” cocok dengan ratapan Ayub dan tetap cukup luas untuk mencakup penderitaan hidup.
theological_decisions:
- issue: Cakupan אָדָם sebagai bentuk tunggal generik
  choice: manusia
  alternative: seorang laki-laki; umat manusia
  rationale: Ayat ini menyampaikan kebenaran umum tentang keadaan setiap manusia. “Manusia” mempertahankan bentuk representatif yang alami dalam bahasa Indonesia tanpa menjadikannya kolektif abstrak atau khusus laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan paralel dipertahankan, sementara idiom harfiah “pendek hari-harinya” diungkapkan secara alami sebagai “singkat umurnya.”
