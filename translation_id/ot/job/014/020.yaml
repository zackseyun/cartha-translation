  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: id
  text: Engkau mengalahkannya untuk selama-lamanya, lalu ia pergi[a]; Engkau mengubah wajahnya[b] dan mengirimnya pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lalu ia berlalu.” Kata kerja Ibraninya secara harfiah berarti “pergi” atau “berjalan”; dalam konteks ini kemungkinan menunjuk pada kepergian dari kehidupan atau dari dunia manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau “rupanya.” Kata Ibrani yang secara harfiah berarti “wajah” juga dapat menunjuk pada penampilan lahiriah seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: Engkau mengalahkannya
  rationale: Bentuk ini menyatakan bahwa Allah menjadi kuat terhadap manusia dan menang atasnya. “Mengalahkannya” alami dalam bahasa Indonesia serta mempertahankan gagasan dominasi tanpa menambahkan cara atau tingkat kekerasannya.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menunjuk pada keberlangsungan atau sifat tetap. Dalam konteks kefanaan manusia, terjemahan ini mempertahankan tekanan pada finalitas kemenangan Allah.
- source_word: וַיַּהֲלֹךְ
  choice: lalu ia berlalu
  rationale: Kata kerja הלך secara harfiah berarti “pergi/berjalan”. “Berlalu” cocok dengan konteks kepergian manusia dari kehidupan atau dari dunia, tetapi tidak menyatakan kematian secara lebih eksplisit daripada teks Ibrani.
- source_word: מְשַׁנֶּה
  choice: Engkau mengubah
  rationale: Partisip dari שנה menyatakan tindakan mengubah. Dalam sapaan langsung kepada Allah, bentuk predikatif “Engkau mengubah” jelas dan wajar.
- source_word: פָנָיו
  choice: wajahnya
  rationale: פנים secara konkret berarti “wajah”, meskipun dapat pula mencakup rupa atau penampilan lahiriah. Terjemahan utama mempertahankan gambaran konkret Ibrani.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: dan menyuruhnya pergi
  rationale: Bentuk intensif שלח dapat berarti mengirim pergi, melepas, atau menyingkirkan. “Menyuruhnya pergi” mempertahankan tindakan Allah mengeluarkan manusia tanpa memastikan apakah nuansanya pelepasan atau pengusiran.
