base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: id
  text: Demikian pula manusia berbaring dan tidak bangkit; sampai langit tidak ada lagi[a], mereka tidak akan terbangun ataupun dibangunkan dari tidur mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sampai tidak ada langit.” Ungkapan Ibrani ini menunjuk pada batas waktu kosmis yang secara praktis tak terjangkau.'
    reason: lexical_alternative
  - marker: b
    text: 'Ayat ini memakai gambaran tidur untuk kematian: orang mati tidak “terbangun” atau “dibangunkan dari tidur mereka.”'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Demikian pula manusia
  rationale: Kata אִישׁ berbentuk tunggal dan di sini mewakili umat manusia dalam kefanaannya. 'Manusia' paling wajar dalam bahasa Indonesia untuk pemakaian representatif ini, sedangkan וְ diterjemahkan 'Demikian pula' untuk menghubungkan pernyataan ini dengan perbandingan sebelumnya.
- source_word: שָׁכַב
  choice: berbaring
  rationale: Kata kerja שׁכב berarti 'berbaring' dan dalam konteks ini menjadi kiasan bagi kematian. Kiasannya dipertahankan tanpa menggantinya dengan 'mati'.
- source_word: וְלֹא יָקוּם
  choice: dan tidak bangkit
  rationale: קום berarti bangkit atau berdiri. 'Tidak bangkit' mempertahankan gambaran Ibrani dan tidak mempersempitnya menjadi pernyataan doktrinal eksplisit.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: sampai langit tidak ada lagi
  rationale: Ungkapan ini secara harfiah menunjuk pada saat ketika langit tidak ada; terjemahan ini mempertahankan cakrawala waktu kosmis yang secara praktis tak terjangkau.
- source_word: לֹא יָקִיצוּ
  choice: mereka tidak akan terbangun
  rationale: Bentuk verba ini jamak dan berarti 'terbangun'. Kata 'mereka' mencerminkan peralihan sumber dari manusia representatif tunggal kepada orang-orang mati secara umum.
- source_word: וְלֹא יֵעֹרוּ
  choice: ataupun dibangunkan
  rationale: Bentuk Niphal dari עור menyatakan dibuat bangun atau digugah. 'Dibangunkan' mempertahankan nuansa pasif serta kesejajarannya dengan 'terbangun'.
- source_word: מִשְּׁנָתָם
  choice: dari tidur mereka
  rationale: Kata שֵׁנָה berarti 'tidur' dan meneruskan kiasan kematian. Pronomina jamak dipertahankan sesuai bentuk Ibrani.
theological_decisions:
- issue: Apakah kiasan tidur harus dijelaskan sebagai kebinasaan mutlak atau penyangkalan kebangkitan
  choice: Mempertahankan gambaran berbaring, bangkit, dan terbangun tanpa perluasan doktrinal
  alternative: Menerjemahkannya secara eksplisit sebagai 'mati dan tidak akan hidup lagi' atau menjadikannya pernyataan langsung tentang kebangkitan akhir
  rationale: Ayat ini menyuarakan kefanaan manusia dari sudut pandang puisi Ayub. Teks sumber tidak menjelaskan secara sistematis keadaan akhir manusia, sehingga ketegangan teologisnya dipertahankan.
- issue: Pemaknaan אִישׁ yang maskulin dan representatif
  choice: manusia
  alternative: seorang laki-laki
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam konteks ini אִישׁ menyatakan manusia secara representatif. Bahasa Indonesia memakai 'manusia' secara alami untuk makna tersebut; 'seorang laki-laki' akan memberi penekanan jenis kelamin yang tidak menjadi pokok perbandingan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang mudah dipahami. Peralihan dari 'manusia' tunggal yang representatif ke 'mereka' mengikuti peralihan jumlah gramatikal dalam teks Ibrani. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
