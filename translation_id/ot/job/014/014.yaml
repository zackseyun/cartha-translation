id: JOB.14.14
reference: Job 14:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: id
  text: Jika seorang laki-laki mati, akankah ia hidup kembali? Sepanjang masa tugas beratku, aku akan menanti sampai perubahanku tiba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelegaanku” atau “pembaruanku.” Kata Ibrani ini dapat berarti perubahan, pergantian, kelegaan, atau pembaruan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk syarat yang membuka pertanyaan retoris, bukan mengubahnya menjadi penanda waktu "ketika".
- source_word: גֶּבֶר
  choice: seorang laki-laki
  rationale: Mencerminkan nomina maskulin tunggal yang di sini menunjuk kepada manusia fana, dengan ungkapan Indonesia yang wajar.
- source_word: הֲיִחְיֶה
  choice: akankah ia hidup kembali?
  rationale: Kata "kembali" tidak dinyatakan secara tersendiri dalam verba Ibrani, tetapi tersirat kuat oleh urutan mati lalu hidup; bentuk pertanyaan mempertahankan ketidakpastian Ayub.
- source_word: כָּל יְמֵי צְבָאִי
  choice: Sepanjang masa tugas beratku
  rationale: צָבָא dapat berarti dinas, tugas, peperangan, atau masa yang ditetapkan. Ungkapan ini menyampaikan masa pengabdian yang berat tanpa membatasi metaforanya pada kemiliteran.
- source_word: אֲיַחֵל
  choice: aku akan menanti
  rationale: Verba ini dapat memuat nuansa menanti dan berharap; dalam konstruksi dengan "sampai", tindakan menanti menjadi unsur utama.
- source_word: חֲלִיפָתִי
  choice: perubahanku
  rationale: Pilihan ini mempertahankan keluasan makna kata Ibrani—perubahan, pergantian, kelegaan, atau pembaruan—dan tidak menjadikan harapan Ayub sebagai pernyataan tegas tentang kebangkitan.
theological_decisions:
- issue: Apakah ayat ini menyatakan kebangkitan secara tegas atau mengungkapkan pertanyaan dan harapan yang masih terbuka.
  choice: Pertanyaan "akankah ia hidup kembali?" dipertahankan, dan חֲלִיפָתִי diterjemahkan "perubahanku".
  alternative: Menerjemahkan חֲלִיפָתִי sebagai "kebangkitanku", "pembaruanku", atau "kelegaanku".
  rationale: Teks menyandingkan kematian, kemungkinan hidup kembali, dan penantian akan suatu perubahan tanpa menjelaskan secara pasti hakikat perubahan itu. Terjemahan utama mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. "Masa tugas berat" dipilih agar alami bagi pembaca umum, sedangkan "perubahanku" sengaja dibiarkan cukup luas untuk mencerminkan ambiguitas sumber.
