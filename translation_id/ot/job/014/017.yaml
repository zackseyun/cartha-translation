base_translation:
  language: en
  yaml_path: translation/ot/job/014/017.yaml
  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: id
  text: 'Pelanggaranku dimeteraikan dalam sebuah kantong,

    dan Engkau menutupi[a] kesalahanku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melapisi,” “menjahitkan penutup pada,” atau “melekatkan sesuatu di atas” kesalahanku. Kata kerja Ibrani di sini sulit dipastikan maknanya, dan gambaran tepatnya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: dimeteraikan
  rationale: Bentuk partisip pasif dari חתם menyatakan sesuatu yang telah ditutup dan diamankan dengan meterai. Pilihan ini mempertahankan hasil tindakan tersebut tanpa menentukan pelakunya secara eksplisit.
- source_word: בִּצְרוֹר
  choice: dalam sebuah kantong
  rationale: צְרוֹר dapat berarti bungkusan, pundi-pundi, atau kantong yang diikat. 'Kantong' merupakan gambaran konkret dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: פִּשְׁעִי
  choice: pelanggaranku
  rationale: פֶּשַׁע dapat menunjuk pada pelanggaran atau pemberontakan. 'Pelanggaran' mempertahankan bobot moralnya tanpa mempersempit makna menjadi pemberontakan terang-terangan.
- source_word: וַתִּטְפֹּל
  choice: dan Engkau menutupi
  rationale: Makna טפל dalam ayat ini sulit dipastikan; kata ini dapat menggambarkan tindakan melapisi, melekatkan, atau mungkin menjahit hingga tertutup. 'Menutupi' menghasilkan bahasa Indonesia yang alami sambil mempertahankan gambaran umum bahwa sesuatu dikenakan di atas kesalahan Ayub; alternatif penting dicantumkan dalam catatan kaki.
- source_word: עַל
  choice: atas (tersirat dalam 'menutupi')
  rationale: Dengan טפל, עַל menunjukkan sesuatu yang dikenakan pada atau di atas objek. Dalam bahasa Indonesia, hubungan ini sudah terkandung secara idiomatis dalam verba transitif 'menutupi'.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat berarti kesalahan, kebengkokan moral, atau kesalahan yang mendatangkan hukuman. 'Kesalahan' alami bagi pembaca modern dan tetap dibedakan dari 'pelanggaran' pada baris pertama.
theological_decisions:
- issue: Daya tafsir gambaran tentang pelanggaran yang dimeteraikan dan kesalahan yang ditutupi
  choice: Bahasa gambaran dipertahankan sebagai tindakan Allah menyimpan dan mengamankan catatan kesalahan Ayub untuk diperhitungkan terhadapnya.
  alternative: Gambaran menutupi kesalahan dapat dibaca sebagai penghapusan atau pengampunan dosa.
  rationale: Dalam konteks ratapan Ayub, khususnya ayat sebelumnya, ia mengeluh bahwa Allah mengawasi dan mencatat dosanya dengan teliti. Karena itu, terjemahan tidak memperjelas 'menutupi' menjadi 'mengampuni', tetapi juga tidak mengganti metafora Ibrani dengan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan dengan susunan dua baris yang mengikuti paralelisme Ibrani. Sapaan 'Engkau' memakai huruf kapital karena merujuk kepada Allah. Istilah 'dimeteraikan' dipertahankan karena sesuai dengan gambaran konkret dan bernada khidmat, sedangkan catatan kaki menjaga ketidakpastian leksikal pada טפל.
