id: JOB.14.5
reference: Job 14:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: id
  text: Karena hari-harinya telah ditentukan[a], jumlah bulan-bulannya ada pada-Mu; Engkau telah menetapkan batasnya[b], dan ia tidak dapat melampauinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Jika hari-harinya telah ditentukan.” Partikel Ibrani ini dapat memperkenalkan suatu syarat, tetapi dalam konteks kemungkinan menyatakan dasar bagi permohonan Ayub: “Karena hari-harinya telah ditentukan.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “ketetapannya”. Istilah Ibrani ini dapat berarti batas tetap atau ketetapan yang telah ditentukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Karena
  rationale: Partikel ini dapat berarti “jika”, tetapi dalam konteks seruan Ayub kemungkinan memperkenalkan dasar bagi permohonannya. “Karena” menyampaikan fungsi itu secara alami sambil mempertahankan alternatif kondisional dalam catatan kaki.
- source_word: חֲרוּצִים
  choice: telah ditentukan
  rationale: Partisip pasif ini menyatakan bahwa hari-hari manusia sudah diputuskan atau ditetapkan. Pilihan ini jelas dan tidak memperluas pernyataan ayat melampaui teks.
- source_word: יָמָיו
  choice: hari-harinya
  rationale: Terjemahan langsung bentuk jamak dengan sufiks orang ketiga tunggal maskulin; dalam konteks, ungkapan ini menunjuk kepada masa hidup manusia.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: jumlah bulan-bulannya
  rationale: Mempertahankan bentuk nominal Ibrani dan gambaran bahwa masa hidup manusia dapat dihitung dalam bulan.
- source_word: אִתָּךְ
  choice: ada pada-Mu
  rationale: Secara harfiah berarti “bersama/pada-Mu”. Dalam konteks, jumlah itu berada dalam pengetahuan dan kuasa Allah; terjemahan ini mempertahankan ungkapan sumber tanpa menjelaskan salah satu nuansa secara berlebihan.
- source_word: חֻקּוֹ
  choice: batasnya
  rationale: Nomina ini dapat menunjuk kepada batas tetap atau ketetapan yang ditentukan. “Batasnya” cocok dengan verba berikutnya, “melampauinya”.
- source_word: עָשִׂיתָ
  choice: telah menetapkan
  rationale: Walaupun arti dasarnya “membuat/melakukan”, bersama kata “batas” verba ini secara alami berarti menetapkan atau memberlakukan batas tersebut.
- source_word: וְלֹא יַעֲבוֹר
  choice: dan ia tidak dapat melampauinya
  rationale: Subjek verba tunggal adalah manusia yang dibicarakan. Dalam konteks batas hidup yang telah ditetapkan, ungkapan ini menyampaikan bahwa ia tidak mampu melewati batas itu.
theological_decisions:
- issue: Penentuan ilahi atas lamanya hidup manusia
  choice: Ayat ini menyatakan bahwa hari-hari manusia telah ditentukan, jumlah bulan-bulannya ada pada Allah, dan Allah menetapkan batas yang tidak dapat dilampauinya.
  alternative: Ayat ini dapat dipahami secara lebih lemah sebagai penekanan pada pengetahuan Allah tentang lamanya hidup, bukan penentuan aktif-Nya.
  rationale: Gabungan “telah ditentukan”, “ada pada-Mu”, dan “Engkau telah menetapkan batasnya” mendukung pengetahuan sekaligus kedaulatan Allah. Terjemahan mempertahankan pernyataan kuat teks tanpa memasukkannya ke dalam sistem doktrin yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia. Susunan paralel Ibrani dipertahankan sejauh tetap alami dan mudah dipahami.
