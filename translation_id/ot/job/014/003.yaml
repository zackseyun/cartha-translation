base_translation:
  language: en
  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: id
  text: Namun, kepada orang seperti ini pun Engkau membuka mata-Mu, dan Engkau membawa aku ke pengadilan bersama-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan-Mu”; secara harfiah bahasa Ibrani berbunyi “bersama-Mu”, yang dapat menyiratkan tampil untuk diadili di hadapan Allah atau masuk ke dalam perkara hukum dengan-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: Namun, ... pun
  rationale: Partikel ini memberi tekanan sekaligus menyatakan kontras dengan kefanaan manusia dalam ayat-ayat sebelumnya. Gabungan ini menyampaikan nada protes Ayub secara wajar dalam bahasa Indonesia.
- source_word: עַל זֶה
  choice: kepada orang seperti ini
  rationale: Secara harfiah berarti 'atas/kepada yang ini'. Dalam konteksnya, frasa ini menunjuk kepada manusia fana yang baru digambarkan, sehingga rujukan personal dibuat jelas tanpa memperluas makna.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: Engkau membuka mata-Mu
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa Ibrani, yang dalam konteks menyiratkan bahwa Allah mengarahkan perhatian atau pemeriksaan-Nya kepada manusia.
- source_word: וְאֹתִי
  choice: dan Engkau membawa aku
  rationale: Pronomina objek yang ditandai menekankan Ayub sendiri. Susunan Indonesia dibuat alami sambil mempertahankan fokus personal tersebut.
- source_word: תָבִיא
  choice: membawa
  rationale: Bentuk kausatif dari בוא memiliki arti dasar 'membawa' atau 'membuat datang'. Pilihan ini mempertahankan inti leksikal tanpa langsung menafsirkannya sebagai 'memanggil' secara hukum.
- source_word: בְמִשְׁפָּט
  choice: ke pengadilan
  rationale: מִשְׁפָּט di sini menunjuk pada proses hukum atau penghakiman. 'Ke pengadilan' menyampaikan gambaran yudisial secara alami dalam bahasa Indonesia.
- source_word: עִמָּךְ
  choice: bersama-Mu
  rationale: עם pada dasarnya berarti 'dengan' atau 'bersama'. Pilihan ini mempertahankan bentuk dan ketegangan bahasa Ibrani; catatan kaki menjelaskan kemungkinan nuansa yudisialnya.
theological_decisions:
- issue: Hubungan yudisial yang dinyatakan oleh עִמָּךְ ketika Ayub berbicara kepada Allah
  choice: bersama-Mu
  alternative: di hadapan-Mu; berperkara melawan-Mu
  rationale: Bahasa Ibrani secara langsung memakai preposisi 'dengan/beserta'. Terjemahan utama mempertahankan ketegangan apakah Ayub sekadar dihadapkan kepada Allah sebagai hakim atau masuk ke dalam perkara hukum dengan-Nya, alih-alih menetapkan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan kepada Allah memakai huruf kapital. Ungkapan 'membuka mata-Mu' dipertahankan karena dapat dipahami secara puitis, sedangkan ketidaklaziman ringan pada 'ke pengadilan bersama-Mu' disengaja untuk menjaga ambiguitas asli dan dijelaskan dalam catatan kaki.
