  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: id
  text: Air mengikis batu-batu; alirannya yang deras[a] menghanyutkan debu tanah; demikian pula, Engkau melenyapkan harapan manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “alirannya yang deras” langka dan tidak pasti. Kata itu mungkin juga berarti “curahannya”, “bilasannya”, atau sesuatu seperti “apa yang tumbuh darinya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים
  choice: batu-batu
  rationale: Bentuk jamak ini menunjuk pada batu secara umum dalam gambaran puitis tentang pengikisan oleh air.
- source_word: שָׁחֲקוּ מַיִם
  choice: Air mengikis
  rationale: 'Susunan puitis Ibrani menempatkan objek sebelum verba dan subjek: secara idiomatis, airlah yang mengikis batu. Bentuk מַיִם lazim diterjemahkan sebagai nomina massa tunggal dalam bahasa Indonesia.'
- source_word: תִּשְׁטֹף
  choice: menghanyutkan
  rationale: Verba ini menggambarkan tindakan air yang membilas atau menyeret sesuatu hingga terbawa; 'menghanyutkan' sesuai dengan citra erosi.
- source_word: סְפִיחֶיהָ
  choice: alirannya yang deras
  rationale: Istilah langka dan sulit ini dipahami dalam konteks sebagai curahan atau aliran air yang kuat. Karena maknanya tidak pasti, alternatif utama dicatat dalam catatan kaki.
- source_word: עֲפַר אָרֶץ
  choice: tanah di bumi
  rationale: Secara harfiah berarti 'debu/tanah dari bumi atau tanah daratan'. Dalam konteks erosi, 'tanah di bumi' menyampaikan bahan permukaan yang dihanyutkan tanpa membuat ungkapan Indonesia terasa janggal.
- source_word: תִקְוַת אֱנוֹשׁ
  choice: harapan manusia
  rationale: אֱנוֹשׁ adalah sebutan tunggal kolektif bagi manusia, sering dengan nuansa kefanaan. 'Manusia' alami, inklusif sesuai cakupan kata sumber, dan mempertahankan pernyataan umum.
- source_word: הֶאֱבַדְתָּ
  choice: Engkau melenyapkan
  rationale: Bentuk kausatif ini berarti membuat binasa atau menghancurkan. 'Melenyapkan harapan' merupakan padanan Indonesia yang langsung dan alami, sedangkan 'Engkau' mempertahankan sapaan langsung kepada Allah.
theological_decisions:
- issue: Sapaan langsung kepada Allah pada klausa terakhir
  choice: Demikian pula, Engkau melenyapkan harapan manusia
  alternative: Dan harapan manusia Engkau binasakan
  rationale: Verba orang kedua maskulin tunggal jelas menyapa Allah. 'Demikian pula' mengungkapkan perbandingan puitis yang tersirat oleh rangkaian gambaran alam tanpa menambahkan penjelasan teologis.
- issue: Cakupan אֱנוֹשׁ
  choice: manusia
  alternative: manusia fana
  rationale: Kata ini dapat menonjolkan kerapuhan dan kefanaan manusia, tetapi nuansa itu dibiarkan tetap tersirat agar terjemahan tidak mempersempit atau memperberat ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur dua gambaran erosi diikuti penerapannya kepada harapan manusia dipertahankan. Huruf kapital pada “Engkau” menandai bahwa sapaan ditujukan kepada Allah dalam konteks.
