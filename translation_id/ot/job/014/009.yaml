translation:
  language: id
  text: Hanya karena mencium air, pohon itu akan bertunas dan mengeluarkan pucuk seperti tanaman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan menghasilkan pertumbuhan seperti sesuatu yang ditanam.” Kata Ibrani yang diterjemahkan “pucuk” biasanya berarti “panen”, tetapi dalam konteks ini kemungkinan besar menunjuk pada tunas, cabang muda, atau pertumbuhan baru.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: Begitu mencium
  rationale: Secara harfiah berarti ‘dari/karena bau atau aroma’. Ungkapan ini menggambarkan pohon yang kembali hidup hanya karena merasakan dekatnya air; ‘begitu mencium’ mempertahankan daya puitis personifikasi itu dalam bahasa Indonesia.
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, kata ini lazim berfungsi sebagai nomina massa dan secara alami diterjemahkan ‘air’.
- source_word: יַפְרִחַ
  choice: akan bersemi
  rationale: Bentuk hifil dari פרח dapat berarti bertunas, bersemi, atau berbunga. ‘Ber semi’ menyampaikan munculnya kembali kehidupan tanpa membatasi gambaran hanya pada bunga.
- source_word: וְעָשָׂה קָצִיר
  choice: dan mengeluarkan pucuk
  rationale: עשה berarti ‘membuat/menghasilkan’, sedangkan קָצִיר biasanya berarti ‘panen’ tetapi dalam konteks pohon yang hidup kembali paling mungkin menunjuk pada pertumbuhan baru. ‘Mengeluarkan pucuk’ alami dalam bahasa Indonesia dan mempertahankan gambaran botanisnya.
- source_word: כְּמוֹ נָטַע
  choice: seperti tanaman
  rationale: כְּמוֹ adalah partikel perbandingan ‘seperti’, dan נָטַע di sini menunjuk pada sesuatu yang ditanam. ‘Tanaman’ menyampaikan makna itu tanpa menambahkan kata ‘pohon’ yang tidak dinyatakan dalam frasa ini.
