translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang tetap mudah dipahami. Subjek ‘pohon itu’ dibuat eksplisit dari konteks ayat sebelumnya agar rujukan pronominal jelas. Personifikasi ‘mencium air’ dipertahankan karena merupakan unsur penting dalam citraan Ibrani.
