  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: id
  text: Namun, seorang laki-laki mati dan menjadi tidak berdaya[a]; manusia mengembuskan napas terakhir[b], dan di manakah dia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menjadi lemah.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai dua kata yang berbeda secara paralel: גבר, “laki-laki,” dan אדם, “manusia.” Susunan ini menekankan kefanaan manusia.'
    reason: cultural_note
lexical_decisions:
- source_word: גֶבֶר
  choice: seorang laki-laki
  rationale: Kata ini menunjuk pada laki-laki dewasa dan kadang menyiratkan kekuatan. Dalam konteks ini, terjemahan sederhana ini mempertahankan bentuk tunggal serta ironi bahwa manusia yang kuat sekalipun mati.
- source_word: יָמוּת
  choice: mati
  rationale: Bentuk imperfek menyatakan kenyataan umum tentang kefanaan, sehingga bentuk kini gnomic dalam bahasa Indonesia paling wajar.
- source_word: וַיֶּחֱלָשׁ
  choice: dan menjadi tidak berdaya
  rationale: Kata kerja חלש berarti menjadi lemah atau kehilangan kekuatan. 'Menjadi tidak berdaya' cocok dengan konteks kematian tanpa menyiratkan sekadar sakit sementara.
- source_word: וַיִּגְוַע
  choice: mengembuskan napas terakhir
  rationale: גוע menyatakan berakhirnya hidup atau kematian. Ungkapan Indonesia ini mempertahankan gambaran puitis dan menghindari pengulangan datar dari 'mati'.
- source_word: אָדָם
  choice: manusia
  rationale: Dalam paralel dengan גבר, kata ini menyoroti insan sebagai bagian dari umat manusia. 'Manusia' membedakannya dari 'seorang laki-laki' sekaligus mempertahankan cakupan generiknya.
- source_word: וְאַיּוֹ
  choice: lalu di manakah dia?
  rationale: Pertanyaan ini menanyakan keberadaan manusia setelah ia mati. 'Lalu' mengungkapkan kesinambungan logis dari waw Ibrani secara alami dalam bahasa Indonesia, tanpa mengubahnya menjadi pernyataan bahwa ia tidak ada.
theological_decisions:
- issue: Pertanyaan tentang keberadaan manusia sesudah mati
  choice: 'dipertahankan sebagai pertanyaan terbuka: ''di manakah dia?'''
  alternative: menafsirkannya sebagai pernyataan bahwa manusia sudah tidak ada
  rationale: Teks Ibrani mengajukan pertanyaan retoris tetapi tidak secara eksplisit menjelaskan keadaan orang mati dalam ayat ini. Terjemahan tidak boleh menyelesaikan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme dua klausa dipertahankan; 'seorang laki-laki' dan 'manusia' mencerminkan dua istilah Ibrani yang berbeda. Tanda titik koma menjaga keseimbangan puitis, sedangkan 'lalu' membuat hubungan menuju pertanyaan penutup terdengar alami.
