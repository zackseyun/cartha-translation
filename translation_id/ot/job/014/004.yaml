  text: מִֽי יִתֵּ֣ן טָ֭הוֹר מִ/טָּמֵ֗א לֹ֣א אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: id
  text: Siapa dapat menghasilkan yang tahir dari yang najis? Tidak seorang pun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harafiah, “bukan satu [orang pun].”
    reason: Mempertahankan bentuk singkat dan eliptis dari לֹא אֶחָד sambil menjelaskan, sesuai pertanyaan “Siapa”, bahwa negasi itu merujuk kepada pelaku, bukan kepada hasil yang tahir.
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata tanya ini membuka pertanyaan retoris secara langsung; daya modalnya dinyatakan melalui konteks dan terjemahan verba berikutnya.
- source_word: יִתֵּן
  choice: dapat menghasilkan
  rationale: Secara harfiah berarti 'memberi', tetapi dalam ungkapan ini menunjuk pada tindakan menghasilkan atau memunculkan sesuatu; 'dapat menghasilkan' menangkap makna idiomatis sekaligus ketidakmungkinan yang tersirat.
- source_word: טָהוֹר
  choice: yang tahir
  rationale: Adjektiva ini dipakai secara substantival. 'Yang tahir' alami dalam bahasa Indonesia dan mempertahankan cakupan kemurnian yang dapat bersifat ritual, moral, atau lebih umum.
- source_word: מִטָּמֵא
  choice: dari yang najis
  rationale: Preposisi מִן diikuti adjektiva substantival טָמֵא. Pilihan ini mempertahankan kontras langsung antara tahir dan najis tanpa menentukan apakah acuannya benda, orang, atau keadaan.
- source_word: לֹא אֶחָד
  choice: Tidak seorang pun
  rationale: Ungkapan ini memberi jawaban negatif mutlak terhadap pertanyaan retoris. Bentuk tersebut jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Acuan bahasa tahir dan najis
  choice: Pernyataan umum tentang ketidakmampuan menghasilkan yang tahir dari yang najis, yang dalam konteks diterapkan pada keadaan manusia.
  alternative: Pernyataan khusus tentang kelahiran dari orang tua yang najis, atau pepatah yang lebih luas mengenai kenajisan moral maupun ritual.
  rationale: Bahasa Ibraninya singkat dan bersifat seperti pepatah. Terjemahan tidak menentukan jenis kenajisan atau kemurnian tertentu, sehingga ambiguitas dan ketegangan teologis teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Istilah 'tahir' dan 'najis' dipilih untuk mempertahankan pasangan istilah kemurnian yang mapan dan cakupan makna sumber. Penanda catatan kaki [a] dicantumkan dalam teks utama.
