base_translation:
  language: en
  yaml_path: translation/ot/job/014/008.yaml
  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: id
  text: Sekalipun akarnya menua di dalam tanah[a], dan tunggulnya mati dalam debu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika akarnya menua di dalam tanah.” Partikel Ibrani ini dapat dipahami sebagai penanda syarat, tetapi dalam alur perumpamaan tentang pohon ini kemungkinan besar bermakna konsesif.
    reason: alternative_reading
  - marker: b
    text: Atau, “pangkal batangnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Sekalipun
  rationale: 'Dalam alur perumpamaan tentang pohon, partikel ini paling wajar dipahami secara konsesif: keadaan pohon tampak tanpa harapan, tetapi ayat berikutnya menyatakan kemungkinan tumbuh kembali. Ambiguitas bentuk kondisional tetap dicatat dalam catatan kaki.'
- source_word: יַזְקִין
  choice: menua
  rationale: Bentuk ini menyatakan proses menjadi tua. “Menua” ringkas, alami, dan mempertahankan aspek proses tersebut.
- source_word: בָּאָרֶץ
  choice: di dalam tanah
  rationale: Dalam gambaran botani ini, אָרֶץ menunjuk pada tanah tempat akar berada. Pilihan ini alami dalam bahasa Indonesia dan selaras dengan pasangan puitisnya, “debu”.
- source_word: שָׁרְשׁוֹ
  choice: akarnya
  rationale: Bentuk tunggal dengan akhiran orang ketiga maskulin tunggal dipertahankan sebagai bentuk tunggal kolektif yang menunjuk pada akar pohon itu.
- source_word: וּבֶעָפָר
  choice: dan dalam debu
  rationale: עָפָר berarti debu atau tanah gembur. “Debu” mempertahankan diksi puitis serta gema kefanaan yang khas dalam Kitab Ayub.
- source_word: יָמוּת
  choice: mati
  rationale: Ini adalah padanan langsung verba מות dan tidak menambahkan gagasan “layu” yang tidak dinyatakan secara eksplisit.
- source_word: גִּזְעוֹ
  choice: tunggulnya
  rationale: גֵּזַע di sini menunjuk pada bagian pangkal batang yang tertinggal. “Tunggul” paling tepat dalam konteks pohon yang telah ditebang tetapi masih mungkin bertunas.
