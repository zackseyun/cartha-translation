  text: וְ֭/אוּלָם הַר נוֹפֵ֣ל יִבּ֑וֹל וְ֝/צ֗וּר יֶעְתַּ֥ק מִ/מְּקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/018.yaml
  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: id
  text: Namun, bahkan gunung yang runtuh akan hancur[a], dan batu cadas bergeser dari tempatnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan layu” atau “akan pudar”. Kata Ibraninya lebih umum dipakai untuk tumbuhan yang layu atau sesuatu yang memudar, tetapi di sini digunakan secara metaforis untuk gunung.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dipindahkan” atau “disingkirkan dari tempatnya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun, bahkan
  rationale: Mengungkapkan peralihan yang kuat sekaligus penekanan bahwa bahkan sesuatu yang tampak kukuh pun dapat binasa.
- source_word: הַר נוֹפֵל
  choice: gunung yang runtuh
  rationale: Partisipel נוֹפֵל menggambarkan gunung dalam keadaan jatuh atau runtuh; klausa relatif terdengar alami dalam puisi Indonesia.
- source_word: יִבּוֹל
  choice: akan hancur
  rationale: Verba ini biasanya berarti layu atau pudar, tetapi di sini dipakai secara metaforis untuk kemerosotan gunung; 'hancur' menjaga gambaran kehancuran tanpa menyamakannya begitu saja dengan verba 'runtuh' sebelumnya.
- source_word: וְצוּר
  choice: dan batu cadas
  rationale: צוּר menunjuk batu besar, cadas, atau tebing; 'batu cadas' membedakannya dari batu kecil dan sesuai dengan pasangan puitis 'gunung'.
- source_word: יֶעְתַּק
  choice: bergeser
  rationale: Menyatakan berpindah atau tersingkir dari suatu tempat tanpa menentukan pelaku, sesuai bentuk dan konteks Ibrani.
- source_word: מִמְּקֹמוֹ
  choice: dari tempatnya
  rationale: Terjemahan langsung dan alami yang mempertahankan citra sesuatu yang kukuh terlepas dari kedudukannya.
