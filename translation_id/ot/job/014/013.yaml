revisions:
- from: Ah, sekiranya Engkau menyimpan aku di Syeol[a], menyembunyikan aku sampai murka-Mu surut, menetapkan suatu batas bagiku[b], lalu mengingat aku!
  to: Ah, sekiranya Engkau menyembunyikan aku di Syeol[a], menutupi aku sampai murka-Mu surut, menetapkan suatu batas waktu bagiku[b], dan mengingat aku!
  rationale: 'Revisi memperjelas arti kedua verba paralel tanpa menghilangkan intensifikasi puitisnya: “menyembunyikan” dan “menutupi.” “Batas waktu” memberi padanan Indonesia yang alami bagi sesuatu yang ditetapkan atau dibatasi dalam konteks ini, sementara catatan kaki mempertahankan kemungkinan makna non-temporal ‘ketetapan.’ Konjungsi “dan” mengikuti koordinasi Ibrani tanpa menambahkan urutan temporal yang lebih kuat melalui “lalu.”'
