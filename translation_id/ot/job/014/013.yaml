base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: id
  text: Ah, sekiranya Engkau menyembunyikan aku di Syeol[a], menutupi aku sampai murka-Mu surut, menetapkan suatu batas waktu bagiku[b], dan mengingat aku!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “di kubur” atau “di alam orang mati.” Ibrani: Syeol.'
    reason: lexical_alternative
  - marker: b
    text: Atau “menetapkan suatu ketetapan bagiku.” Kata Ibrani ini dapat menunjuk pada sesuatu yang tetap, ditentukan, atau dibatasi.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah, sekiranya Engkau
  rationale: Ungkapan ini menyatakan harapan yang kuat, bukan pertanyaan harfiah tentang siapa yang akan memberi. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nada kerinduan Ayub.
- source_word: בִּשְׁאוֹל
  choice: di Syeol
  rationale: Transliterasi mempertahankan konsep Ibrani tentang alam orang mati tanpa mempersempitnya menjadi sekadar kubur atau menyamakannya dengan gagasan neraka yang berkembang kemudian.
- source_word: תַּצְפִּנֵנִי
  choice: menyimpan aku
  rationale: Kata kerja ini dapat berarti menyembunyikan atau menyimpan di suatu tempat. Pilihan ini membedakannya dari kata kerja sejajar berikutnya tanpa menghilangkan kedekatan makna keduanya.
- source_word: תַּסְתִּירֵנִי
  choice: menyembunyikan aku
  rationale: Pilihan ini menyampaikan tindakan membuat Ayub tidak terlihat atau terlindung, sekaligus mempertahankan kesejajaran puitis dengan 'menyimpan aku'.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: sampai murka-Mu surut
  rationale: Secara harfiah ungkapan ini berbicara tentang berbaliknya murka Allah. 'Surut' mengungkapkan gerak menjauh itu secara alami dalam bahasa Indonesia tanpa sekadar menyatakan bahwa murka tersebut lenyap.
- source_word: תָּשִׁית לִי חֹק
  choice: menetapkan suatu batas bagiku
  rationale: חֹק menunjuk pada sesuatu yang ditetapkan, ditentukan, atau dibatasi. 'Suatu batas' mempertahankan keluasan makna itu, sedangkan konteks memungkinkan batas tersebut dipahami sebagai jangka atau waktu yang ditentukan.
- source_word: וְתִזְכְּרֵנִי
  choice: lalu mengingat aku
  rationale: Kata 'mengingat' mempertahankan daya relasional ungkapan Ibrani. 'Lalu' menyatakan urutan yang diharapkan Ayub setelah masa persembunyian itu.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: Syeol
  alternative: kubur; alam orang mati
  rationale: Transliterasi menjaga dunia konseptual teks Ibrani dan tidak memasukkan ajaran yang lebih kemudian tentang neraka maupun membatasi maknanya pada tempat penguburan.
- issue: Makna חֹק dalam permohonan Ayub
  choice: suatu batas
  alternative: suatu waktu yang ditentukan; suatu ketetapan
  rationale: Kata Ibrani dapat menunjuk pada ketetapan, batas, atau masa yang sudah ditentukan. Terjemahan utama mempertahankan ambiguitas itu; catatan kaki menjelaskan kemungkinan makna temporal yang kuat dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan tanpa menjadi arkais. Sapaan kepada Allah memakai kapital hormat. Pengulangan semantis kedua kata kerja Ibrani dipertahankan melalui pasangan 'menyimpan' dan 'menyembunyikan'.
