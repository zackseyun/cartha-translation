source:
  edition: WLC
  text: תִּ֭קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑/ךָּ לְֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ תִכְסֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: id
  text: Engkau akan memanggil, dan aku akan menjawab-Mu; Engkau akan merindukan karya tangan-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Karya tangan-Mu” mengacu kepada manusia sebagai ciptaan Allah, yakni orang yang telah dibuat-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: Engkau akan memanggil
  rationale: Bentuk imperfek Qal orang kedua maskulin tunggal dari קרא. Dalam rangkaian harapan Ayub, bentuk ini menggambarkan keadaan yang diharapkan; bahasa Indonesia secara alami memakai 'akan' tanpa harus memaksakan penanda pengandaian yang tidak idiomatis.
- source_word: וְאָנֹכִי
  choice: dan aku
  rationale: 'Konjungsi dan pronomina orang pertama yang ditegaskan membentuk pasangan responsif dengan tindakan Allah: Allah memanggil, Ayub menjawab.'
- source_word: אֶעֱנֶךָּ
  choice: akan menjawab-Mu
  rationale: Imperfek Qal orang pertama tunggal dengan akhiran orang kedua maskulin tunggal dari ענה, yang berarti 'menjawab'. 'Akan' mempertahankan kesinambungan skenario harapan dalam konteks.
- source_word: לְמַעֲשֵׂה
  choice: karya
  rationale: מַעֲשֶׂה dapat berarti pekerjaan, perbuatan, atau sesuatu yang dibuat. 'Karya' bersama 'tangan-Mu' terdengar alami dan tetap menunjuk kepada hasil ciptaan Allah.
- source_word: יָדֶיךָ
  choice: tangan-Mu
  rationale: Terjemahan harfiah ini mempertahankan gambaran antropomorfis tentang Allah sebagai Pencipta, alih-alih mereduksinya menjadi istilah abstrak.
- source_word: תִכְסֹף
  choice: akan merindukan
  rationale: Imperfek Qal orang kedua maskulin tunggal dari כסף menyatakan kerinduan atau hasrat yang kuat. 'Merindukan' alami, mudah dipahami, dan mempertahankan daya emosional kata Ibrani.
theological_decisions:
- issue: Apakah ayat ini menyatakan sekadar perhatian Allah atau kerinduan-Nya kepada manusia ciptaan-Nya
  choice: Engkau akan merindukan karya tangan-Mu
  alternative: Engkau akan memperhatikan karya tangan-Mu
  rationale: Kata כסף paling wajar menyatakan kerinduan atau hasrat, bukan sekadar perhatian. Pilihan ini mempertahankan ketegangan dalam harapan Ayub bahwa Allah kembali menginginkan ciptaan-Nya, di tengah pengalaman penghakiman.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan langsung. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab Indonesia. Susunan paralel puisi dipertahankan, dan nuansa harapan dinyatakan dengan bentuk 'akan' yang alami dalam konteks pengandaian yang dibangun oleh ayat-ayat sebelumnya.
