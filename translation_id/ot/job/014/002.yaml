  yaml_path: translation/ot/job/014/002.yaml
  text: Like a flower he comes forth and withers[a]; he flees like a shadow and does not remain.
translation:
  language: id
  text: Seperti bunga, ia muncul lalu layu[a]; ia melarikan diri seperti bayang-bayang dan tidak bertahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lalu dipotong”; kata kerja Ibrani ini dapat dipahami sebagai layu atau pudar, ataupun sebagai dipotong, khususnya dalam gambaran bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: Seperti bunga
  rationale: צִיץ berarti bunga atau kuntum; 'bunga' merupakan padanan Indonesia yang paling alami dan mempertahankan gambaran puitis tentang rapuhnya hidup manusia.
- source_word: יָצָא
  choice: ia muncul
  rationale: יָצָא secara harfiah berarti keluar. Dalam perbandingan dengan bunga yang tampil sesaat, 'muncul' mengungkapkan gambaran itu secara wajar dalam bahasa Indonesia tanpa menambah gagasan yang tidak ada dalam teks.
- source_word: וַיִּמָּל
  choice: lalu layu
  rationale: Dalam konteks gambaran bunga, bentuk dari מול dapat dipahami sebagai layu atau pudar; kemungkinan arti 'dipotong' tetap dicatat dalam catatan kaki.
- source_word: וַיִּבְרַח
  choice: ia berlalu
  rationale: ברח biasanya berarti lari atau melarikan diri. Dalam gambaran bayang-bayang yang cepat lenyap, 'berlalu' terdengar alami dalam bahasa Indonesia dan tetap menyampaikan gerak serta kefanaan.
- source_word: כַּצֵּל
  choice: seperti bayang-bayang
  rationale: Padanan langsung yang mempertahankan perbandingan puitis tentang sesuatu yang tidak tetap dan singkat.
- source_word: וְלֹא יַעֲמוֹד
  choice: dan tidak bertahan
  rationale: עמד secara harfiah berarti berdiri, tetapi di sini menyatakan keberlangsungan. 'Tidak bertahan' menyampaikan maknanya dengan jelas dan wajar.
