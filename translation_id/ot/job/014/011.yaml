base_translation:
  language: en
  yaml_path: translation/ot/job/014/011.yaml
  text: As waters disappear from the sea, and a river dries up and withers,
translation:
  language: id
  text: 'Air lenyap dari laut,

    dan sungai mengering lalu menjadi kering kerontang,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְלוּ
  choice: menghilang
  rationale: Kata kerja ini menyatakan air yang habis atau lenyap; “menghilang” mempertahankan gambaran berkurangnya air sampai tiada.
- source_word: יָם
  choice: laut
  rationale: Padanan langsung dan alami untuk יָם; teks tidak mengharuskan pengertian khusus seperti danau atau waduk.
- source_word: נָהָר
  choice: sungai
  rationale: Padanan baku untuk aliran air besar dalam konteks perbandingan ini.
- source_word: יֶחֱרַב
  choice: mengering
  rationale: Mengungkap keadaan kehilangan air secara alami dalam bahasa Indonesia.
- source_word: וְיָבֵשׁ
  choice: dan menjadi kering kerontang
  rationale: Menjaga unsur kedua yang memperkuat יֶחֱרַב, tanpa meleburkan kedua verba Ibrani menjadi satu.
theological_decisions:
- issue: Perumpamaan tentang lenyapnya air sebagai pengantar bagi nasib manusia dalam konteks dekat
  choice: Mempertahankan gambaran alam secara lugas tanpa menambahkan penjelasan teologis
  alternative: Menafsirkan gambaran itu secara eksplisit sebagai kematian atau kebangkitan
  rationale: Ayat ini sendiri hanya menyajikan perbandingan; implikasi teologisnya berkembang pada ayat berikutnya dan tidak boleh disisipkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme dua baris mengikuti struktur Ibrani; frasa “kering kerontang” memberi penguatan idiomatis bagi pasangan verba יֶחֱרַב וְיָבֵשׁ.
