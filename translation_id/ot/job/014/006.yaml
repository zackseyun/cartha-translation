  yaml_path: translation/ot/job/014/006.yaml
  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: id
  text: Palingkanlah pandangan-Mu darinya[a], dan biarkanlah ia beristirahat, sampai ia menikmati harinya seperti seorang pekerja upahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Palingkanlah pandangan-Mu darinya dan biarkanlah ia berhenti, sampai ia menyelesaikan harinya seperti seorang pekerja upahan.” Bahasa Ibrani memungkinkan penekanan pada berhenti atau memperoleh kelegaan, dan pada menikmati atau menyelesaikan hari yang ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה
  choice: Alihkanlah pandangan-Mu
  rationale: Bentuk imperatif ini meminta Allah mengalihkan tatapan atau perhatian-Nya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang pengawasan ilahi.
- source_word: מֵעָלָיו
  choice: darinya
  rationale: Gabungan preposisi ini menunjukkan dijauhkannya perhatian atau tekanan dari orang yang sedang dibicarakan.
- source_word: וְיֶחְדָּל
  choice: supaya ia dapat beristirahat
  rationale: Kata חדל pada dasarnya berarti berhenti atau tidak melanjutkan. Dalam konteks ini, maksudnya ialah memperoleh jeda dari penderitaan atau pengawasan; 'beristirahat' menyampaikan daya kontekstual itu tanpa menyiratkan bahwa ia berhenti hidup.
- source_word: עַד
  choice: sampai
  rationale: Penanda temporal yang memperkenalkan batas waktu bagi kelegaan yang diminta.
- source_word: יִרְצֶה
  choice: ia menyelesaikan
  rationale: Kata רצה dapat berkaitan dengan berkenan, menerima, atau merasa puas. Dalam perbandingan dengan pekerja upahan dan harinya, frasa ini dapat menunjuk pada mencapai akhir hari yang telah ditentukan; pilihan ini mempertahankan gagasan penyelesaian tanpa menekankan kepuasan emosional.
- source_word: כְּשָׂכִיר
  choice: seperti seorang pekerja upahan
  rationale: שָׂכִיר menunjuk kepada orang yang bekerja untuk mendapatkan upah. 'Pekerja upahan' jelas, modern, dan mempertahankan gambaran sosial-ekonominya.
- source_word: יוֹמוֹ
  choice: harinya
  rationale: Secara harfiah berarti 'harinya'. Konteks pekerja upahan sudah menjelaskan bahwa yang dimaksud ialah hari kerjanya, sehingga bentuk ringkas dapat dipertahankan.
