translation_notes:
  register: Bahasa Indonesia baku modern dengan nada permohonan yang khidmat. Huruf kapital pada akhiran posesif '-Mu' menandai bahwa Ayub sedang menyapa Allah. Ambiguitas kata חדל dan רצה dipertahankan melalui catatan kaki.
