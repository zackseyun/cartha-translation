  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: id
  text: Hanya[a] dagingnya sendiri akan merasa sakit, dan jiwanya sendiri akan berdukacita[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sesungguhnya dagingnya padanya akan sakit, dan jiwanya padanya akan berdukacita.” Bahasa Ibrani ini padat; kata pembukanya juga dapat berarti “sungguh,” dan pengulangan “padanya” diterjemahkan secara idiomatis sebagai “sendiri.”
    reason: lexical_alternative
  - marker: b
    text: “Jiwa” juga dapat diterjemahkan “nyawa”, “diri”, atau “batin”.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini dapat bersifat membatasi, menegaskan, atau menyatakan pertentangan. Dalam penutup perenungan ini, “Namun” secara alami mempertahankan kemungkinan nuansa adversatif tanpa memaksakan arti “sungguh” atau “hanya”.
- source_word: בְּשָׂרוֹ
  choice: dagingnya
  rationale: Terjemahan konkret ini mempertahankan gambaran puitis Ibrani dan kesejajarannya dengan נַפְשׁוֹ.
- source_word: עָלָיו
  choice: sendiri
  rationale: Secara harfiah berarti “atas/padanya”; dalam ungkapan padat ini, “sendiri” menyampaikan bahwa rasa sakit dan perkabungan dialami oleh orang itu, sekaligus mempertahankan pengulangan pada kedua klausa.
- source_word: יִכְאָב
  choice: merasa sakit
  rationale: Kata kerja ini menyatakan pengalaman rasa sakit; pilihan ini wajar dalam bahasa Indonesia dan tidak menentukan jenis sakitnya.
- source_word: נַפְשׁוֹ
  choice: jiwanya
  rationale: “Jiwa” mempertahankan istilah puitis yang disejajarkan dengan “daging”, tanpa menutup kemungkinan makna “nyawa”, “diri”, atau “batin”.
- source_word: תֶּאֱבָל
  choice: berkabung
  rationale: Kata ini menyatakan berkabung atau meratap; “berkabung” mempertahankan bobot emosional dan laras puitisnya.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ dalam kesejajaran dengan daging
  choice: jiwanya
  alternative: nyawanya; dirinya; batinnya
  rationale: “Jiwa” mempertahankan ketegangan puitis antara daging dan diri batiniah tanpa menjadikan ayat ini pernyataan dogmatis tentang susunan manusia.
- issue: Keadaan orang mati dalam ayat ini
  choice: Bahasa pengalaman sakit dan berkabung dipertahankan apa adanya
  alternative: Menjelaskannya sebagai kesadaran sesudah kematian atau semata-mata sebagai gambaran proses kematian
  rationale: Konteks dan ungkapan puitisnya tidak mengharuskan penerjemah menetapkan salah satu tafsiran teologis tersebut.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “sendiri” mencerminkan pengulangan עָלָיו sambil menghindari ungkapan harfiah “dagingnya padanya” yang tidak alami. Penanda catatan kaki ditempatkan sesudah unsur yang dijelaskan.
