  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: id
  text: 'Sebab ada harapan bagi pohon: jika ditebang, pohon itu akan bertunas kembali[a], dan tunas mudanya[b] tidak akan berhenti tumbuh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan memperbarui dirinya.” Dalam konteks pohon, kata kerja Ibrani ini menggambarkan pertumbuhan baru.
    reason: lexical_alternative
  - marker: b
    text: Atau “tunasnya” atau “pucuk mudanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal atau penjelas yang menghubungkan ayat ini dengan pernyataan sebelumnya.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: bagi pohon masih ada harapan
  rationale: Menyampaikan konstruksi eksistensial secara alami dalam bahasa Indonesia sekaligus mempertahankan nuansa bahwa kemungkinan hidup kembali tetap tersedia bagi pohon.
- source_word: אִם יִכָּרֵת
  choice: jika ditebang
  rationale: 'Partikel אִם dan bentuk pasif verba paling langsung menyatakan kondisi: pohon itu ditebang.'
- source_word: וְעוֹד יַחֲלִיף
  choice: pohon itu akan bertunas kembali
  rationale: Dalam gambaran pohon yang telah ditebang, verba חלף menunjuk pada pembaruan pertumbuhan; 'bertunas kembali' menyatakan makna botanisnya secara jelas dan wajar.
- source_word: וְיֹנַקְתּוֹ
  choice: dan tunas mudanya
  rationale: Kata יוֹנֶקֶת menunjuk pada tunas baru atau tunas yang masih muda; pilihan ini mempertahankan gambaran pertumbuhan yang segar.
- source_word: לֹא תֶחְדָּל
  choice: tidak akan berhenti tumbuh
  rationale: Secara harfiah berarti 'tidak akan berhenti'. Penambahan 'tumbuh' membuat hubungan dengan tunas jelas dalam bahasa Indonesia tanpa mengubah gambaran sumber.
