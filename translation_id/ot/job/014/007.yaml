  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Pengulangan 'pohon itu' dipakai agar subjek sesudah klausa pasif tetap jelas. Penanda catatan kaki ditempatkan pada unsur Ibrani yang benar-benar dijelaskan oleh masing-masing catatan.
