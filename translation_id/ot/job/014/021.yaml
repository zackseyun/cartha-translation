  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: id
  text: Putra-putranya menjadi terhormat[a], tetapi ia tidak mengetahuinya; mereka menjadi tidak berarti, tetapi ia tidak memahaminya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Putra-putranya mendapat kehormatan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: mendapat kehormatan
  rationale: Qal dari כבד dengan subjek jamak dapat menyatakan bahwa mereka menjadi terhormat atau memperoleh kehormatan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan kontras dengan keadaan hina pada klausa berikutnya.
- source_word: בָנָיו
  choice: anak-anak lelakinya
  rationale: Nomina Ibrani berbentuk maskulin jamak dengan sufiks orang ketiga tunggal maskulin, sehingga rujukan khusus kepada para putranya dipertahankan.
- source_word: וְלֹא יֵדָע
  choice: tetapi ia tidak mengetahuinya
  rationale: ידע berarti 'mengetahui'. Kata ganti '-nya' merujuk secara alami kepada keadaan sebelumnya; ו dipahami sebagai pertentangan kontekstual dan diterjemahkan 'tetapi' agar hubungan antarklausa jelas dalam bahasa Indonesia.
- source_word: וְיִצְעֲרוּ
  choice: mereka menjadi hina
  rationale: צער di sini berlawanan dengan כבד dan menunjuk pada keadaan menjadi rendah, kecil, atau tidak berarti. 'Menjadi hina' mempertahankan perubahan status tanpa menentukan penyebabnya.
- source_word: וְלֹא יָבִין
  choice: tetapi ia tidak menyadari
  rationale: בין mencakup memahami atau mencermati. Dalam konteks ketidaktahuan orang mati terhadap nasib anak-anaknya, 'menyadari' terdengar alami dan tetap dekat dengan maknanya.
- source_word: לָמוֹ
  choice: keadaan mereka
  rationale: Bentuk pronominal ini merujuk kembali kepada anak-anak lelaki itu. 'Keadaan mereka' mengungkapkan relasinya secara alami, sambil menghindari ungkapan Indonesia yang kaku seperti 'mengenai mereka' sesudah 'menyadari'.
theological_decisions:
- issue: Pengetahuan orang mati tentang keadaan keturunannya
  choice: Ayat menyatakan ketidaktahuan tokoh itu terhadap naik-turunnya kedudukan anak-anak lelakinya.
  alternative: Membaca ayat ini sebagai pernyataan sistematis dan universal tentang keadaan sadar semua orang mati.
  rationale: Terjemahan mempertahankan pernyataan puitis dalam konteks keluhan Ayub tanpa mengembangkannya menjadi rumusan doktrinal yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Paralelisme antarklausa dipertahankan, dengan kontras antara mendapat kehormatan dan menjadi hina. Istilah 'anak-anak lelaki' dipilih untuk mempertahankan kekhususan bentuk Ibrani.
