  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: id
  text: Sebab sekarang Engkau menghitung langkah-langkahku[a]; Engkau tidak mengawasi dosaku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau membilang langkah-langkahku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Engkau tidak memperhatikan dosaku” atau “Engkau tidak mengintai dosaku.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי עַתָּה
  choice: Sebab sekarang
  rationale: כִּי menghubungkan ayat ini dengan konteks sebagai penjelasan, sedangkan עַתָּה menandai keadaan sekarang yang dikontraskan dengan harapan Ayub.
- source_word: צְעָדַי
  choice: tiap langkahku
  rationale: Bentuk ini berarti langkah-langkah Ayub. Kata 'tiap' secara alami menyampaikan gambaran bahwa setiap geraknya diperhitungkan tanpa mengubah acuannya.
- source_word: תִּסְפּוֹר
  choice: Engkau menghitung
  rationale: Verba ספר dalam qal berarti menghitung atau membilang. 'Menghitung' adalah padanan Indonesia modern yang paling wajar dan tetap mempertahankan gambaran konkretnya.
- source_word: לֹא תִשְׁמוֹר עַל
  choice: Engkau tidak mengawasi
  rationale: שׁמר dengan עַל dapat menyatakan tindakan mengawasi, menjaga, atau mencermati. 'Mengawasi' mempertahankan nuansa pemantauan dan kesejajarannya dengan menghitung langkah.
- source_word: חַטָּאתִי
  choice: dosaku
  rationale: Dalam konteks ini חַטָּאת berarti dosa, bukan persembahan penghapus dosa. Bentuk tunggal dipertahankan agar tidak menghilangkan kemungkinan makna kolektif atau abstraknya.
theological_decisions:
- issue: Makna klausa negatif לֹא תִשְׁמוֹר עַל חַטָּאתִי dalam konteks
  choice: 'Diterjemahkan sebagai pernyataan kini: ''Engkau tidak mengawasi dosaku.'''
  alternative: '''Engkau tidak akan mengawasi dosaku'' sebagai bagian dari keadaan yang diharapkan; atau ''Engkau tidak mengintai dosaku.'''
  rationale: Teks Ibrani memakai bentuk imperfek sederhana dengan negasi dan tanpa penanda pertanyaan. Pernyataan kini paling langsung mencerminkan sintaksis ayat ini. Ketegangan dengan ayat-ayat di sekitarnya dibiarkan tetap ada dan tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Susunan dua klausa dipertahankan ringkas agar paralelisme dan ketegangan teks tetap terasa.
