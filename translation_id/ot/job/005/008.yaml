  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: id
  text: Namun, aku sendiri akan mencari Allah; kepada Allah akan kuajukan perkaraku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan kutaruh urusanku kepada Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: Namun aku, aku
  rationale: אוּלָם menandai peralihan yang kontras, sedangkan pronomina mandiri אֲנִי memberi penekanan. Pengulangan alami ini mempertahankan tekanan pada sikap pribadi sang pembicara.
- source_word: אֶדְרֹשׁ
  choice: aku akan mencari
  rationale: Bentuk ini menyatakan tindakan yang dianjurkan atau hendak dilakukan dalam konteks perkataan Elifas. 'Mencari' tetap dekat dengan makna dasar דרשׁ dan dapat mencakup berpaling kepada Allah untuk memohon pertolongan.
- source_word: אֶל אֵל
  choice: Allah
  rationale: Preposisi arah terserap secara alami dalam konstruksi bahasa Indonesia 'mencari Allah'. אֵל di sini merupakan sebutan ilahi dan tidak perlu diperluas menjadi 'Allah Yang Mahakuasa'.
- source_word: וְאֶל אֱלֹהִים
  choice: kepada Allah
  rationale: Frasa ini sejajar dengan klausa pertama. Kedua sebutan ilahi diterjemahkan 'Allah' agar paralelisme puitis terpelihara tanpa menciptakan pembedaan referen.
- source_word: אָשִׂים
  choice: akan kuajukan
  rationale: שׂים secara harfiah berarti 'menaruh' atau 'menempatkan', tetapi bersama דִּבְרָתִי di sini menunjuk pada membawa atau mengemukakan suatu perkara kepada Allah.
- source_word: דִּבְרָתִי
  choice: perkaraku
  rationale: Kata ini dapat berarti perkataan, urusan, atau perkara. 'Perkaraku' mempertahankan nuansa permohonan atau pengajuan tanpa mempersempitnya menjadi keluhan.
theological_decisions:
- issue: Penerjemahan sebutan ilahi אֵל dan אֱלֹהִים dalam paralelisme
  choice: Keduanya diterjemahkan 'Allah'
  alternative: '''Yang Mahakuasa'' untuk אֵל, atau mempertahankan ''El'''
  rationale: Kedua istilah menunjuk kepada referen ilahi yang sama dalam paralelisme puitis. Membedakannya dalam terjemahan dapat menyiratkan kontras teologis yang tidak dituntut teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Penekanan pronominal Ibrani dipertahankan melalui 'Namun aku, aku', sedangkan susunan klausa kedua dibuat alami tanpa menghilangkan arah pengajuan kepada Allah.
