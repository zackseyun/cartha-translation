revisions:
- from: Sesungguhnya, hal ini telah kami selidiki; memang demikian adanya. Dengarkanlah, dan engkau sendiri, pahamilah itu bagi dirimu.
  to: Lihatlah, inilah yang telah kami selidiki; memang demikian adanya. Dengarkanlah itu dan ketahuilah sendiri.
  rationale: The revision retains Elifas's emphatic claim and the feminine demonstrative/object reference to the matter just discussed. It replaces the interpretively narrower 'pahamilah' with 'ketahuilah' and renders the personal force of לָךְ idiomatically as 'sendiri.'
  reviewer_model: gpt-5.6-terra
