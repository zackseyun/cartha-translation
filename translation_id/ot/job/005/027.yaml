  text: הִנֵּה זֹ֭את חֲקַרְנ֥וּ/הָ כֶּֽן הִ֑יא שְׁ֝מָעֶ֗/נָּה וְ/אַתָּ֥ה דַֽע לָֽ/ךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/005/027.yaml
  text: Look, this is what we have searched out; it is so. Hear it, and you, know it for yourself.
translation:
  language: id
  text: Lihatlah, inilah yang telah kami selidiki; memang demikian adanya. Dengarkanlah itu dan ketahuilah sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Penanda wacana ini mengarahkan perhatian pada kesimpulan yang ditegaskan; 'Sesungguhnya' terdengar wajar dan bermartabat dalam konteks ini.
- source_word: חֲקַרְנוּהָ
  choice: hal ini telah kami selidiki
  rationale: Bentuk verba orang pertama jamak dengan sufiks feminin merujuk kembali kepada pokok yang telah dibicarakan dan menyatakan penyelidikan yang sungguh-sungguh.
- source_word: כֶּן הִיא
  choice: memang demikian adanya
  rationale: Mempertahankan penegasan bahwa hasil penyelidikan itu benar atau sesuai kenyataan tanpa menambah rincian.
- source_word: שְׁמָעֶנָּה
  choice: Dengarkanlah
  rationale: Imperatif dengan sufiks objek feminin diterjemahkan secara alami; objeknya tersirat sebagai perkara atau kesimpulan tersebut.
- source_word: וְאַתָּה דַע לָךְ
  choice: dan engkau sendiri, pahamilah itu bagi dirimu
  rationale: Kata ganti eksplisit וְאַתָּה diberi tekanan melalui 'engkau sendiri'; ידע dalam konteks nasihat menyangkut penerimaan dan pemahaman pribadi, sedangkan לָךְ dipertahankan sebagai 'bagi dirimu'.
theological_decisions:
- issue: Status perkataan Elifas
  choice: Ayat diterjemahkan sebagai klaim tegas Elifas tanpa menjadikannya pengesahan ilahi oleh narator.
  alternative: Merumuskan perkataannya seolah-olah merupakan kebenaran ilahi yang dijamin teks.
  rationale: Dalam konteks kitab Ayub, ini adalah ucapan seorang sahabat; terjemahan perlu mempertahankan ketegasannya tanpa menyelesaikan terlebih dahulu penilaian teologis atas seluruh nasihatnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'dan engkau sendiri' mempertahankan penekanan pada kata ganti Ibrani eksplisit, sementara tanda baca membantu kelancaran pembacaan.
