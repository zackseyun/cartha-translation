  source_fidelity: 'Teks secara tepat mencerminkan struktur dan makna dasar Ibrani: כִּי sebagai penghubung penjelas, כַּעַשׂ sebagai emosi batin yang merusak, serta קִנְאָה sebagai iri hati/kecemburuan. ‘Orang bodoh’ dan ‘orang yang lugu’ menyampaikan kategori hikmat אֱוִיל dan פֹּתֶה tanpa mengarah pada disabilitas intelektual. Namun, ‘mematikan orang’ kurang idiomatis dalam bahasa Indonesia untuk tindakan yang dilakukan oleh suatu emosi; bentuk ini juga dapat diasosiasikan dengan ‘mematikan’ alat. ‘Menewaskan’ menyampaikan hasil kausatif תָּמִית dengan lebih alami.'
