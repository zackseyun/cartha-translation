lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan Elifas dan menghubungkan pernyataan ini dengan ayat sebelumnya.
- source_word: לֶאֱוִיל
  choice: orang bodoh
  rationale: Menunjuk kepada orang yang bodoh secara moral dan praktis, bukan sekadar kurang cerdas; bentuk ini wajar sebagai pernyataan umum dalam bahasa Indonesia.
- source_word: יַהֲרָג
  choice: membunuh
  rationale: Bentuk imperfek menyatakan kebenaran umum bergaya hikmat, dengan daya mematikan yang dipertahankan secara langsung.
- source_word: כָּעַשׂ
  choice: kekesalan
  rationale: Dapat mencakup kejengkelan, kemarahan, atau keresahan batin; 'kekesalan' cukup luas dan selaras dengan hasrat merusak pada baris berikutnya.
- source_word: וּפֹתֶה
  choice: orang yang lugu
  rationale: Menggambarkan orang yang sederhana dan mudah dibujuk dalam sastra hikmat tanpa menyiratkan disabilitas intelektual.
- source_word: תָּמִית
  choice: mematikan
  rationale: Mempertahankan nuansa kausatif Hifil dari מות sekaligus menjaga kesejajaran puitis dengan 'membunuh'.
- source_word: קִנְאָה
  choice: iri hati
  rationale: Dalam konteks hasrat batin yang merusak, 'iri hati' merupakan padanan negatif yang alami; 'kecemburuan' tetap mungkin.
