  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: id
  text: Sebab kekesalan membunuh orang bodoh, dan iri hati menewaskan orang yang lugu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kecemburuan”. Kata Ibrani ini dapat berarti iri hati ataupun kecemburuan; di sini kata itu menunjuk pada perasaan yang merusak.
