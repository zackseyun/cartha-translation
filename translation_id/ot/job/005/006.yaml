  yaml_path: translation/ot/job/005/006.yaml
  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: id
  text: Sebab kesusahan tidak muncul dari debu[a], dan jerih payah tidak bertunas dari tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab kejahatan tidak muncul dari debu, dan kesengsaraan tidak bertunas dari tanah.” Kata-kata Ibraninya juga dapat mengandung makna moral atau makna yang berkaitan dengan malapetaka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan bagi pernyataan sebelumnya dan mempertahankan alur argumentatif.
- source_word: יֵצֵא
  choice: muncul
  rationale: Menyampaikan gagasan keluar atau timbul dari suatu sumber secara wajar dalam bahasa Indonesia.
- source_word: מֵעָפָר
  choice: dari debu
  rationale: עָפָר secara umum berarti debu; ungkapan ini mempertahankan citra bahan tanah tanpa menambahkan kekhususan.
- source_word: אָוֶן
  choice: kesusahan
  rationale: Dalam konteks Ayub, kata ini dapat menunjuk pada kesukaran, malapetaka, atau penderitaan, selain kejahatan moral. 'Kesusahan' sesuai dengan paralelnya dan tidak mempersempit makna pada dosa.
- source_word: וּמֵאֲדָמָה
  choice: dan ... dari tanah
  rationale: אֲדָמָה menunjuk pada tanah atau lahan tempat tumbuhan tumbuh; 'tanah' menjaga citra pertanian dan kesejajaran dengan 'debu'.
- source_word: יִצְמַח
  choice: bertunas
  rationale: Kata צמח menggambarkan pertumbuhan tumbuhan; 'bertunas' mempertahankan metafora sesuatu yang tumbuh dari tanah.
- source_word: עָמָל
  choice: jerih payah
  rationale: Kata ini dapat berarti kerja berat, kesusahan, atau penderitaan akibat beban. 'Jerih payah' mempertahankan unsur usaha yang berat sekaligus kesukaran.
theological_decisions:
- issue: Daya semantis אָוֶן dan עָמָל dalam pernyataan Elifas
  choice: Ayat ini berbicara tentang kesusahan dan jerih payah yang tidak muncul dengan sendirinya dari bumi.
  alternative: Pasangan kata itu dapat dipahami sebagai kejahatan dan penderitaan, atau secara lebih umum sebagai malapetaka dan kesengsaraan.
  rationale: Terjemahan ini menjaga gambaran pertanian dan alur pemikiran Elifas tanpa memasukkan kesimpulan yang lebih tegas tentang sebab moral penderitaan daripada yang dinyatakan ayat itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku yang modern, puitis, dan mudah dipahami. Kesejajaran antarklausa serta metafora pertumbuhan dari tanah dipertahankan.
