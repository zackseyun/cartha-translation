  text: to set the lowly on high[b][a], and those who mourn are lifted up to salvation.
translation:
  language: id
  text: untuk menempatkan mereka yang rendah di tempat tinggi, dan mereka yang berkabung[a] diangkat ke tempat yang aman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka yang menjadi muram” atau “mereka yang berduka”; partisip Ibrani ini menggambarkan dukacita dengan citra kegelapan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kepada keselamatan” atau “kepada pembebasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָשׂוּם
  choice: untuk menempatkan
  rationale: Bentuk infinitif dari שׂוּם menyatakan tujuan atau hasil dalam hubungannya dengan konteks sebelumnya. Pilihan ini mempertahankan daya verbalnya secara wajar.
- source_word: שְׁפָלִים
  choice: orang-orang yang rendah
  rationale: Kata sifat ini menunjuk kepada mereka yang berkedudukan rendah atau telah direndahkan. Ungkapan ini mempertahankan cakupan sosial dan keadaan hidup tanpa membatasinya pada kerendahan hati sebagai sifat moral.
- source_word: לְמָרוֹם
  choice: di tempat tinggi
  rationale: מָרוֹם merujuk pada ketinggian atau tempat tinggi. Terjemahan ini mempertahankan gambaran ruang yang berlawanan dengan keadaan orang-orang yang rendah.
- source_word: וְקֹדְרִים
  choice: orang-orang yang berkabung
  rationale: Partisip dari קדר dapat menggambarkan keadaan gelap, muram, atau berkabung. Dalam konteks pembalikan nasib, 'berkabung' menyampaikan makna pengalaman dukacita, sedangkan citra kegelapannya dicatat dalam catatan kaki.
- source_word: שָׂגְבוּ
  choice: diangkat tinggi
  rationale: Kata kerja ini menyatakan menjadi tinggi, tidak terjangkau, aman, atau ditinggikan. Bentuk ini menghasilkan ungkapan Indonesia yang alami dan mempertahankan kesejajaran dengan 'menempatkan ... di tempat tinggi'.
- source_word: יֶשַׁע
  choice: keselamatan
  rationale: יֶשַׁע mencakup keselamatan, pembebasan, dan keadaan aman. 'Keselamatan' mempertahankan keluasan leksikalnya tanpa mengharuskan pengertian doktrinal yang lebih khusus.
theological_decisions:
- issue: Pemaknaan יֶשַׁע dalam konteks sastra hikmat
  choice: keselamatan
  alternative: pembebasan; keamanan
  rationale: Istilah Ibrani ini dapat menunjuk pada pertolongan nyata, pembebasan, atau keamanan. 'Keselamatan' mempertahankan keluasan istilah tersebut, sementara konteks langsung tetap memungkinkan makna penyelamatan konkret.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran antara keadaan rendah dan pengangkatan ke tempat tinggi dipertahankan; ambiguitas citra dukacita/kegelapan serta cakupan makna keselamatan dicatat tanpa diselesaikan secara sepihak.
