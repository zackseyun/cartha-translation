  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: id
  text: Sebab engkau akan mengadakan perjanjian dengan batu-batu di padang[a], dan binatang liar di padang[b] akan berdamai denganmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu-batu padang.” Ungkapan ini mungkin membangkitkan gambaran batu-batu sebagai penghalang dalam pengolahan tanah, tetapi citra Ibraninya dipertahankan secara eksplisit dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Atau “binatang-binatang di padang.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “telah berdamai denganmu” atau “berada dalam damai denganmu.” Bahasa Ibrani menyatakan hubungan damai antara orang itu dan binatang liar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan jaminan sebelumnya sebagai alasan atau penjelasan; “Sebab” mempertahankan hubungan logis itu secara alami.
- source_word: עִם אַבְנֵי הַשָּׂדֶה בְרִיתֶךָ
  choice: engkau akan mengadakan perjanjian dengan batu-batu di ladang
  rationale: Klausa Ibrani tidak menyatakan verba secara eksplisit. “Akan mengadakan perjanjian” melengkapinya sesuai konteks yang berorientasi ke masa depan, sedangkan “batu-batu di ladang” mempertahankan citra puitis konkret tanpa menafsirkannya hanya sebagai hambatan pertanian.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: dan binatang-binatang liar di padang
  rationale: Dalam kolokasi ini חַיָּה merujuk pada binatang liar. Bentuk kolektif Ibrani diungkapkan dengan bentuk jamak yang wajar dalam bahasa Indonesia.
- source_word: הָשְׁלְמָה לָךְ
  choice: akan hidup damai denganmu
  rationale: Ungkapan ini menyatakan hubungan damai antara orang tersebut dan binatang liar. “Hidup damai denganmu” alami dalam bahasa Indonesia serta mempertahankan kesejajaran gagasan damai dengan perjanjian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. “Ladang” pada klausa pertama terdengar alami untuk konteks batu yang mengganggu pengolahan tanah, sedangkan “padang” pada klausa kedua cocok bagi habitat binatang liar; keduanya tetap menerjemahkan הַשָּׂדֶה dan tidak dimaksudkan sebagai pembedaan teologis.
