  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: id
  text: Sesungguhnya, berbahagialah manusia yang ditegur Allah; sebab itu, janganlah memandang hina didikan Yang Mahakuasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “janganlah menolak” atau “janganlah mengabaikan.” Kata Ibrani yang diterjemahkan “didikan” juga dapat berarti “disiplin”, “koreksi”, atau “hajaran”. “Yang Mahakuasa” menerjemahkan gelar Ibrani Shaddai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Menandai dan menegaskan pernyataan penting yang menyusul dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: אַשְׁרֵי
  choice: berbahagialah
  rationale: Formula ucapan bahagia ini menyatakan keadaan yang patut dianggap beruntung atau diberkati, bukan sekadar perasaan senang.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Kata ini menunjuk kepada manusia fana secara umum; 'manusia' mempertahankan bentuk tunggal generik secara alami dalam bahasa Indonesia.
- source_word: יוֹכִחֶנּוּ
  choice: yang ditegur
  rationale: Bentuk ini mengandung gagasan teguran korektif; 'ditegur' tetap cukup luas dan berpadanan dengan didikan pada klausa berikutnya.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Padanan baku bagi sebutan ilahi ini dalam konteks kitab Ayub.
- source_word: מוּסַר
  choice: didikan
  rationale: Dalam sastra hikmat, kata ini mencakup pembinaan melalui pengajaran dan koreksi; 'didikan' mempertahankan daya formatifnya.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi Shaddai dengan padanan Indonesia yang baku dan bermakna.
- source_word: אַל תִּמְאָס
  choice: janganlah menolak
  rationale: Dalam konteks menerima koreksi ilahi, 'menolak' mengungkapkan penolakan terhadap didikan; nuansa memandang hina dicatat dalam catatan kaki.
theological_decisions:
- issue: Identitas manusia yang menerima teguran ilahi
  choice: manusia
  alternative: orang; manusia fana
  rationale: Ucapan hikmat ini bersifat umum. Terjemahan tidak membatasi penerapannya berdasarkan jenis kelamin dan tetap mempertahankan konsep manusia yang rapuh atau fana.
- issue: Hubungan teguran Allah dengan didikan-Nya
  choice: ditegur ... didikan
  alternative: dikoreksi ... disiplin; diperingatkan ... hajaran
  rationale: Pilihan ini mempertahankan ketegangan bahwa koreksi ilahi dapat menyakitkan tetapi bersifat membina, tanpa menjadikannya semata-mata hukuman.
- issue: Hubungan logis antara kedua klausa
  choice: sebab itu
  alternative: dan; maka
  rationale: 'Tanpa menambahkan gagasan baru, penghubung ini menyatakan implikasi nasihat: karena orang yang ditegur Allah disebut berbahagia, didikan-Nya tidak patut ditolak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hikmat. 'Sesungguhnya' mempertahankan penanda perhatian tanpa memakai bentuk arkais 'lihatlah'. Susunan paralel dan nasihat langsung dipertahankan.
