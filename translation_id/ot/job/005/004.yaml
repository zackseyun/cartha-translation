  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: id
  text: Anak-anaknya jauh dari keselamatan[a]; mereka diremukkan di gerbang kota[b], dan tidak ada yang menyelamatkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jauh dari kelepasan” atau “jauh dari keamanan.”
    reason: lexical_alternative
  - marker: b
    text: Gerbang kota merupakan tempat yang lazim untuk pengadilan dan pengambilan keputusan di depan umum.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: jauh
  rationale: Bentuk verba רחק menyatakan keadaan berada jauh. Dalam bahasa Indonesia, konstruksi "jauh dari" menyampaikan keadaan itu secara alami.
- source_word: בָנָיו
  choice: anak-anaknya
  rationale: בנים dapat menunjuk kepada anak laki-laki secara khusus atau keturunan/anak-anak secara umum. Konteks tidak menekankan jenis kelamin, sehingga "anak-anaknya" paling wajar.
- source_word: מִיֶּשַׁע
  choice: dari keselamatan
  rationale: יֶשַׁע mencakup keselamatan, kelepasan, atau keamanan. "Keselamatan" mempertahankan keluasan makna istilah sumber, sedangkan alternatif praktisnya dicatat dalam catatan kaki.
- source_word: וְיִדַּכְּאוּ
  choice: mereka diremukkan
  rationale: דכא membawa gambaran kuat tentang dihancurkan, diremukkan, atau ditindas. Bentuk pasif "diremukkan" mempertahankan daya ungkap teks.
- source_word: בַשַּׁעַר
  choice: di gerbang kota
  rationale: שׁער secara harfiah berarti gerbang, tetapi dalam konteks sosial Israel kuno menunjuk tempat pengadilan dan keputusan umum. Penambahan "kota" membuat rujukan budayanya jelas tanpa mengganti citra sumber.
- source_word: וְאֵין מַצִּיל
  choice: dan tidak ada yang menyelamatkan mereka
  rationale: Konstruksi אֵין dengan partisipel מַצִּיל menyatakan bahwa tidak ada seorang pun yang bertindak sebagai penyelamat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan leksikal dengan "keselamatan".
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada hikmat yang lugas dan bermartabat. Susunan klausa mempertahankan perkembangan teks Ibrani: keadaan anak-anak, penghancuran mereka dalam ranah peradilan umum, lalu ketiadaan penyelamat. Penanda catatan kaki ditempatkan sesuai isi catatannya; data konsultasi bahasa Inggris tampaknya menukar urutan marker a dan b.'
