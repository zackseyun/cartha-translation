base_translation:
  language: en
  yaml_path: translation/ot/job/005/014.yaml
  text: By day they meet darkness[a], and at noon they grope as in the night.
translation:
  language: id
  text: Pada siang hari mereka bertemu dengan kegelapan, dan pada tengah hari mereka meraba-raba seperti pada malam hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹמָם
  choice: Pada siang hari
  rationale: Ungkapan adverbial yang menunjukkan waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan malam hari.
- source_word: יְפַגְּשׁוּ
  choice: mereka bertemu dengan
  rationale: Menerjemahkan פגשׁ secara langsung sebagai mengalami atau berhadapan dengan sesuatu; 'bertemu dengan kegelapan' mempertahankan personifikasi dan daya gambarnya.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan baku yang mempertahankan kemungkinan makna harfiah maupun metaforis tanpa menafsirkannya secara berlebihan.
- source_word: וְכַלַּיְלָה
  choice: seperti pada malam hari
  rationale: Prefiks כ menyatakan perbandingan. Frasa ini membuat gambaran bahwa mereka meraba-raba pada tengah hari seolah-olah malam dengan jelas dan alami.
- source_word: יְמַשְׁשׁוּ
  choice: mereka meraba-raba
  rationale: Menggambarkan tindakan mencari jalan dengan tangan karena tidak dapat melihat; padanan Indonesia ini tepat dan mudah dipahami.
- source_word: בַצָּהֳרָיִם
  choice: pada tengah hari
  rationale: Menunjuk waktu tengah hari secara khusus dan mempertahankan ironi bahwa mereka meraba-raba ketika cahaya seharusnya paling terang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Paralelisme serta kontras tajam antara siang/tengah hari dan kegelapan/malam dipertahankan. Tidak diperlukan catatan kaki karena unsur perbandingan כ dapat disampaikan secara jelas dalam teks utama.
