  yaml_path: translation/ot/job/005/013.yaml
  text: He catches the wise in their craftiness[c][b][a], and the counsel of the twisted is hurried along.
translation:
  language: id
  text: Ia menangkap orang-orang bijak dalam kelicikan mereka[a], dan siasat orang-orang yang bengkok itu dijalankan dengan tergesa-gesa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh kecerdikan mereka” atau “dalam tipu daya mereka”. Kata Ibrani ini dapat berarti kecerdikan yang bijaksana dalam konteks lain, tetapi di sini bernuansa negatif.
    reason: lexical_alternative
  - marker: c
    text: Atau “dipercepat” atau “terburu-buru”. Dalam konteks ini, siasat mereka didorong menuju kegagalan yang cepat, tetapi kata Ibraninya sendiri menekankan ketergesa-gesaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹכֵד
  choice: menangkap
  rationale: Partisipel Qal dari לכד berfungsi secara verbal dan menggambarkan tindakan menjebak atau menawan. “Menangkap” alami dalam bahasa Indonesia dan mempertahankan gambaran tersebut.
- source_word: חֲכָמִים
  choice: orang-orang bijak
  rationale: Adjektiva jamak ini dipakai secara substantival. Pilihan ini mempertahankan ironi bahwa mereka yang dianggap bijak justru tertangkap.
- source_word: בְּעָרְמָם
  choice: dalam kelicikan mereka
  rationale: עָרְמָה dapat berarti kecerdikan atau kecakapan, tetapi paralelisme dan konteks di sini memberinya nuansa moral negatif. “Kelicikan” menyampaikan nuansa itu tanpa menghilangkan kemungkinan makna sarana atau lingkup pada preposisi בְּ.
- source_word: וַעֲצַת
  choice: dan siasat
  rationale: עֵצָה dapat berarti nasihat, rencana, atau siasat. Dalam konteks gagasan orang licik yang digagalkan, “siasat” terdengar alami dan mempertahankan kaitan dengan perencanaan yang penuh perhitungan.
- source_word: נִפְתָּלִים
  choice: orang-orang yang bengkok
  rationale: Bentuk dari פתל menyatakan sesuatu yang terpilin, berbelit, atau menyimpang. “Yang bengkok” mempertahankan metafora sekaligus makna moralnya.
- source_word: נִמְהָרָה
  choice: menjadi tergesa-gesa
  rationale: Bentuk Nifal feminin tunggal ini bersesuaian dengan עֲצַת dan menyatakan bahwa siasat itu dipercepat atau terburu-buru. “Menjadi tergesa-gesa” mempertahankan keadaan hasil tanpa secara eksplisit menambahkan gagasan kehancuran yang tidak dinyatakan langsung.
theological_decisions:
- issue: Subjek tersirat pada לֹכֵד
  choice: Kata ganti “Ia” dipakai dan merujuk kepada Allah dari konteks sebelumnya.
  alternative: Subjek tak tentu, misalnya “seseorang yang menangkap”.
  rationale: Teks Ibrani tidak menyebut subjek secara eksplisit dalam ayat ini, tetapi Ayub 5:9–16 sedang menguraikan tindakan Allah. Bahasa Indonesia memerlukan subjek yang lebih jelas; “Ia” meneruskan subjek kontekstual tanpa menambahkan identifikasi baru.
- issue: Watak moral עָרְמָה dan נִפְתָּלִים
  choice: 'Keduanya diterjemahkan dengan nuansa negatif: “kelicikan” dan “yang bengkok”.'
  alternative: Terjemahan lebih netral seperti “kecerdikan” dan “yang berbelit-belit”.
  rationale: Paralelisme menggambarkan orang-orang yang siasatnya Allah gagalkan, sehingga nuansa etis negatif paling sesuai. Metafora “bengkok” tetap dipertahankan agar teks tidak terlalu ditafsirkan.
- issue: Hasil akhir siasat dalam נִמְהָרָה
  choice: Diterjemahkan “menjadi tergesa-gesa”, tanpa menyatakan secara langsung bahwa siasat itu gagal.
  alternative: “Segera kandas” atau “digiring menuju kegagalan”.
  rationale: Konteks menyiratkan penggagalan yang mendadak, tetapi verba Ibrani secara langsung menyatakan ketergesa-gesaan atau percepatan. Terjemahan utama mempertahankan ketegangan itu; implikasi kegagalan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ayat dipertahankan. “Ia” memakai huruf kapital sebagai kata ganti yang secara kontekstual merujuk kepada Allah. Istilah “siasat” dan “yang bengkok” mempertahankan corak sastra hikmat serta metafora Ibrani, sementara catatan kaki menyediakan alternatif yang lebih idiomatis.
