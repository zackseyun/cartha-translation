  yaml_path: translation/ot/job/005/009.yaml
  text: who does great things beyond searching out[a], wonders beyond number[b],
translation:
  language: id
  text: yang melakukan hal-hal besar yang tak terselidiki[a], keajaiban yang tak terhitung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tidak dapat diselidiki”; secara harfiah, “dan tidak ada penyelidikan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tanpa terhitung” atau “tak terbilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: yang melakukan
  rationale: Partisipel Qal ini menerangkan Allah dalam konteks ayat sebelumnya. Bentuk relatif “yang melakukan” mempertahankan hubungan sintaksis itu tanpa menambahkan subjek yang tidak dinyatakan dalam ayat ini.
- source_word: גְדֹלוֹת
  choice: hal-hal besar
  rationale: Kata sifat jamak ini dipakai secara substantival. “Hal-hal besar” langsung, wajar dalam bahasa Indonesia modern, dan tidak mempersempit maknanya menjadi hanya karya atau perbuatan.
- source_word: וְאֵין חֵקֶר
  choice: yang tak terselidiki
  rationale: Ungkapan ini secara harfiah menyatakan bahwa tidak ada penyelidikan atau penelusuran yang memadai. “Tak terselidiki” menyampaikan makna tidak terjangkau oleh penyelidikan dengan ringkas dan puitis.
- source_word: נִפְלָאוֹת
  choice: keajaiban
  rationale: Nomina ini menunjuk pada hal atau tindakan luar biasa yang menimbulkan kekaguman. “Keajaiban” alami dan mempertahankan kesejajaran puitis dengan “hal-hal besar”.
- source_word: עַד אֵין מִסְפָּר
  choice: yang tak terhitung
  rationale: Ungkapan idiomatis ini menyatakan jumlah yang tidak dapat dihitung. “Tak terhitung” jelas, alami, dan membentuk kesejajaran yang baik dengan “tak terselidiki”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya puitis yang ringkas dan bermartabat. Huruf awal kecil serta bentuk “yang melakukan” mempertahankan kesinambungan sintaksis dengan ayat sebelumnya. Pengulangan “tak” menjaga kesejajaran dua baris puisi Ibrani.
