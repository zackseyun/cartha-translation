  text: כִּ֤י ה֣וּא יַכְאִ֣יב וְ/יֶחְבָּ֑שׁ יִ֝מְחַ֗ץ ו/יד/ו תִּרְפֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/018.yaml
  text: For he causes pain[a], but he binds up; he shatters, but his hands heal.
translation:
  language: id
  text: Sebab Dialah yang mendatangkan rasa sakit, tetapi Dia membalut; Dia meremukkan, tetapi tangan-Nya menyembuhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani memakai nomina tunggal, “tangan-Nya,” diikuti verba berbentuk jamak, “menyembuhkan.” Bahasa Indonesia dapat mempertahankan ungkapan “tangan-Nya menyembuhkan” tanpa menentukan apakah yang dimaksud satu tangan atau kedua tangan.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan wacana tersebut secara alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: Dialah
  rationale: Bentuk ini mencerminkan penekanan dari pronomina mandiri Ibrani tanpa terasa kaku dalam bahasa Indonesia.
- source_word: יַכְאִיב
  choice: mendatangkan rasa sakit
  rationale: Bentuk Hifil dari כאב menyatakan tindakan menyebabkan rasa sakit. Pilihan ini mempertahankan kausalitas langsung tanpa mempersempit maknanya menjadi luka jasmani.
- source_word: וְיֶחְבָּשׁ
  choice: tetapi Dia membalut
  rationale: חבש dalam konteks cedera berarti membalut atau membebat. Konjungsi diterjemahkan secara adversatif untuk menyatakan kontras dalam paralelisme puitis.
- source_word: יִמְחַץ
  choice: Dia meremukkan
  rationale: מחץ menggambarkan pukulan atau tekanan yang menghancurkan. 'Meremukkan' mempertahankan daya dan kerasnya gambaran puitis.
- source_word: וְיָדוֹ
  choice: tetapi tangan-Nya
  rationale: Nomina dalam teks Masoret berbentuk tunggal, sehingga dipertahankan sebagai 'tangan-Nya'; bahasa Indonesia tidak mengharuskan penyesuaian jumlah pada verba berikutnya.
- source_word: תִּרְפֶּינָה
  choice: menyembuhkan
  rationale: רפא dalam bentuk Qal secara langsung berarti menyembuhkan. Bentuk verbanya jamak dalam bahasa Ibrani, suatu ketegangan gramatikal yang dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Tindakan Allah dalam penderitaan dan pemulihan
  choice: Ayat ini secara langsung mengaitkan tindakan mendatangkan rasa sakit dan menyembuhkan dengan Allah.
  alternative: Melunakkan tindakan pertama menjadi 'membiarkan rasa sakit terjadi'.
  rationale: Teks Ibrani menjadikan Allah subjek langsung dari tindakan yang menyakitkan maupun yang memulihkan. Terjemahan mempertahankan ketegangan teologis ini dan tidak menjelaskannya menurut suatu sistem doktrin tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Paralelisme dua tindakan yang berlawanan dipertahankan dengan 'tetapi', sementara 'Dialah' menyampaikan penekanan pada subjek ilahi.
