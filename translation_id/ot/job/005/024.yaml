  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: id
  text: Engkau akan tahu bahwa kemahmu sejahtera, dan ketika engkau memeriksa kediamanmu, engkau tidak akan mendapati sesuatu pun hilang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau tidak akan berdosa.” Kata kerja Ibrani ini dapat berarti “berdosa”; kata ini juga dapat berarti “meleset” atau “gagal menemukan.” Dalam konteks ini, frasa tersebut kemungkinan berarti bahwa tidak ada sesuatu pun yang hilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Engkau akan tahu
  rationale: Bentuk perfektum Qal dengan waw berfungsi sebagai janji berorientasi masa depan dalam rangkaian ini. Ungkapan ini mempertahankan kepastian pernyataan Ibrani.
- source_word: כִּי
  choice: bahwa
  rationale: Partikel ini memperkenalkan isi dari apa yang diketahui, bukan alasan kausal.
- source_word: שָׁלוֹם
  choice: sejahtera
  rationale: Kata ini mencakup damai, aman, utuh, dan baik keadaannya. Dalam bahasa Indonesia, 'sejahtera' secara alami menggambarkan keadaan kemah atau rumah tangga tanpa mempersempit maknanya hanya pada keamanan.
- source_word: אָהֳלֶךָ
  choice: kemahmu
  rationale: Terjemahan harfiah ini mempertahankan gambaran dan latar kuno teks.
- source_word: וּפָקַדְתָּ
  choice: ketika engkau memeriksa
  rationale: Dalam konteks meninjau keadaan tempat kediaman, פקד paling wajar menyatakan tindakan memeriksa atau memperhatikan dengan saksama. 'Ketika' mengungkapkan hubungan temporal yang tersirat.
- source_word: נָוְךָ
  choice: tempat kediamanmu
  rationale: נָוֶה dapat berarti tempat tinggal, hunian, atau padang rumput. Paralelnya dengan 'kemahmu' mendukung arti tempat kediaman di sini.
- source_word: וְלֹא תֶחֱטָא
  choice: tidak ada yang akan kaudapati hilang
  rationale: חטא lazim berarti 'berdosa', tetapi juga dapat berarti meleset atau gagal mendapati sesuatu. Setelah tindakan memeriksa tempat kediaman, ungkapan ini paling wajar menunjukkan bahwa tidak ada sesuatu pun yang didapati hilang, sambil mencatat arti moral sebagai alternatif.
theological_decisions:
- issue: Makna וְלֹא תֶחֱטָא dalam konteks
  choice: 'makna nonmoral: tidak ada yang akan kaudapati hilang'
  alternative: engkau tidak akan berdosa
  rationale: Ayat ini berbicara tentang kesejahteraan dan keutuhan rumah tangga. Urutan 'memeriksa tempat kediamanmu' secara alami diikuti hasil bahwa tidak ada yang hilang. Namun, karena arti umum חטא adalah 'berdosa', alternatif itu dipertahankan dalam catatan kaki agar ketegangan leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' sesuai untuk sapaan tunggal dalam puisi hikmat. 'Kemah' mempertahankan citra kuno, sedangkan 'tempat kediaman' menyampaikan cakupan domestik נָוֶךָ secara alami.
