translation:
  language: id
  text: Ia menggagalkan rencana orang-orang licik, sehingga tangan mereka tidak berhasil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: menggagalkan
  rationale: Partisip Hifil dari פרר menyatakan tindakan membatalkan atau membuat suatu rencana tidak terlaksana; “menggagalkan” alami dan tepat dalam konteks ini.
- source_word: מַחְשְׁבוֹת
  choice: rencana
  rationale: Kata ini dapat berarti pikiran, rancangan, atau rencana; dengan orang-orang licik sebagai pemiliknya dan tindakan tangan pada klausa berikut, “rencana” paling sesuai.
- source_word: עֲרוּמִים
  choice: orang-orang licik
  rationale: Dalam konteks negatif, bentuk ini menunjuk kepada mereka yang cerdik dengan konotasi kelicikan, bukan sekadar bijaksana.
- source_word: יְדֵיהֶם
  choice: tangan mereka
  rationale: Metonimia sumber dipertahankan untuk menyatakan tindakan atau usaha mereka.
- source_word: תּוּשִׁיָּה
  choice: berhasil
  rationale: Istilah ini memiliki rentang makna seperti keberhasilan, hasil yang efektif, kebijaksanaan praktis, atau sesuatu yang kukuh. Dalam konstruksi “tangan ... melakukan,” makna kontekstualnya ialah mencapai keberhasilan; bentuk verbal menghasilkan bahasa Indonesia yang alami.
theological_decisions:
- issue: Subjek ilahi yang tersirat
  choice: Ia
  alternative: Allah
  rationale: Teks Ibrani memakai bentuk verba orang ketiga tunggal tanpa menyebut nama pada ayat ini. “Ia” mempertahankan kesinambungan konteks dan tidak menambahkan nomina yang tidak dinyatakan.
- issue: Makna תּוּשִׁיָּה yang luas
  choice: tidak berhasil melaksanakannya
  alternative: tidak menghasilkan sesuatu yang kukuh
  rationale: Pilihan utama mengikuti hubungan antara rencana dan tindakan tangan, sambil tidak memasukkan penilaian teologis tambahan. Ambiguitas leksikal diakui dalam keputusan leksikal, tetapi tidak memerlukan catatan kaki karena “keberhasilan” merupakan makna kontekstual yang kuat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “Ia” ditulis dengan huruf kapital menurut kebiasaan Indonesia untuk rujukan kepada Allah. Klausa kedua dibuat idiomatis dengan “melaksanakannya,” yang merujuk kembali pada “rencana,” sementara citra “tangan mereka” tetap dipertahankan.
