  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: id
  text: Berserulah sekarang—adakah yang akan menjawabmu? Kepada siapa di antara yang kudus akan engkau berpaling?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para kudus” atau “makhluk-makhluk kudus.” Dalam konteks ini, ungkapan Ibrani tersebut kemungkinan merujuk kepada makhluk-makhluk surgawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא
  choice: Berserulah
  rationale: Imperatif קרא menyampaikan tantangan Elifas agar Ayub memanggil atau berseru. “Berserulah” alami dalam konteks permohonan yang mengharapkan jawaban tanpa menambahkan objek yang tidak dinyatakan.
- source_word: נָא
  choice: sekarang
  rationale: Partikel נָא di sini memberi desakan pada tantangan retoris; “sekarang” lebih sesuai daripada “silakan” atau “tolong,” yang dapat terdengar terlalu sopan.
- source_word: הֲיֵשׁ
  choice: adakah
  rationale: Gabungan partikel tanya dan bentuk eksistensial dipertahankan sebagai pertanyaan langsung dan retoris.
- source_word: עוֹנֶךָ
  choice: yang akan menjawabmu
  rationale: 'Bentuk partisipial dari ענה dengan sufiks orang kedua tunggal berfungsi secara substantival: seseorang yang menjawab engkau. Bentuk futuratif Indonesia sesuai dengan tantangan yang diajukan.'
- source_word: וְאֶל מִי מִקְּדֹשִׁים
  choice: Kepada siapa di antara orang-orang kudus itu
  rationale: 'Preposisi מן bersifat partitif: siapa dari kalangan para kudus. Ungkapan ini mempertahankan sebutan umum teks Ibrani, sementara kemungkinan bahwa mereka adalah makhluk surgawi dijelaskan dalam catatan kaki.'
- source_word: תִּפְנֶה
  choice: akan engkau berpaling
  rationale: פנה secara harfiah berarti berbalik atau berpaling kepada seseorang. Pilihan ini mempertahankan metafora tanpa mempersempit maknanya menjadi “memohon pertolongan.”
theological_decisions:
- issue: Identitas קְדֹשִׁים (“orang-orang kudus” atau “makhluk-makhluk kudus”)
  choice: orang-orang kudus, dengan penjelasan bahwa konteks kemungkinan menunjuk pada makhluk surgawi
  alternative: makhluk-makhluk kudus; para kudus
  rationale: Dalam konteks Kitab Ayub, istilah ini kemungkinan besar mengacu kepada anggota sidang surgawi. Namun, teks Ibrani sendiri memakai kata sifat substantival “yang kudus” dan tidak secara eksplisit mengatakan “malaikat”; karena itu, ketegangan leksikal dipertahankan dalam teks dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi “akan engkau” dipakai untuk menjaga irama puitis dan tekanan retoris; pronomina akrab “-mu/engkau” sesuai dengan tuturan langsung Elifas kepada Ayub.
