id: JOB.5.21
reference: Job 5:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/שׁ֣וֹט לָ֭שׁוֹן תֵּחָבֵ֑א וְֽ/לֹא תִירָ֥א מִ֝/שֹּׁ֗ד כִּ֣י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: id
  text: Engkau akan terlindung dari cambuk lidah[a], dan engkau tidak akan takut pada kehancuran[b] ketika itu datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “cambuk lidah”, sebuah metafora untuk perkataan yang menyakiti atau memfitnah.
    reason: lexical_alternative
  - marker: b
    text: Atau “kebinasaan” atau “kerusakan hebat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט
  choice: dari cambuk
  rationale: שׁוֹט secara harfiah berarti cambuk atau cemeti. Bersama לָשׁוֹן, kata ini membentuk metafora tentang serangan melalui perkataan; frasa Indonesia ini mempertahankan gambaran tersebut.
- source_word: לָשׁוֹן
  choice: lidah
  rationale: לָשׁוֹן secara metonimis menunjuk pada perkataan, khususnya ucapan yang menyakiti atau memfitnah. 'Lidah' mempertahankan citra Ibrani tanpa meratakannya menjadi sekadar 'perkataan'.
- source_word: תֵּחָבֵא
  choice: engkau akan terlindung
  rationale: Bentuk Nifal dari חבא menyatakan keadaan disembunyikan atau diamankan. 'Terlindung' menyampaikan fungsi perlindungannya secara wajar dalam bahasa Indonesia, sedangkan 'akan disembunyikan' terdengar kaku dalam konteks ini.
- source_word: וְלֹא תִירָא
  choice: dan engkau tidak akan takut
  rationale: Terjemahan langsung dari bentuk imperfek yang dinegasikan ini mempertahankan nada jaminan mengenai masa depan.
- source_word: מִשֹּׁד
  choice: pada kehancuran
  rationale: שֹׁד menunjuk pada kehancuran, kebinasaan, atau kerusakan hebat, sering kali dengan nuansa kekerasan. 'Kehancuran' jelas dan cukup luas dalam bahasa Indonesia modern.
- source_word: כִּי יָבֹוא
  choice: ketika itu datang
  rationale: כִּי paling wajar dipahami secara temporal di sini. Kata 'itu' merujuk kembali kepada kehancuran dan membuat hubungan antarklausa jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Metafora Ibrani 'cambuk lidah' dipertahankan, sedangkan bentuk pasif תֵּחָבֵא diterjemahkan secara alami sebagai 'terlindung'. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
