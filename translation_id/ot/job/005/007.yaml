  text: For man is born for trouble[a], and the sons of flame fly upward.
translation:
  language: id
  text: 'Sebab manusia lahir untuk mengalami kesusahan,

    dan anak-anak nyala api[a] terbang ke atas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bunga api beterbangan ke atas.” Secara harfiah, teks Ibrani berbunyi “anak-anak nyala api” (atau mungkin “anak-anak Reshef”), suatu ungkapan yang lazim dipahami sebagai bunga api.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan pernyataan ini sebagai penjelasan atas perkataan sebelumnya; “sebab” alami dalam konteks argumentasi Elifas.
- source_word: אָדָם
  choice: manusia
  rationale: Nomina tunggal ini dipakai secara generik dan menunjuk kepada manusia pada umumnya; “manusia” mempertahankan cakupan tersebut secara wajar dalam bahasa Indonesia.
- source_word: לְעָמָל
  choice: untuk mengalami kesusahan
  rationale: עָמָל mencakup kesukaran, penderitaan, dan jerih payah. Tambahan “mengalami” membuat frasa tujuan/keadaan ini alami dalam bahasa Indonesia tanpa membatasi maknanya pada pekerjaan berat saja.
- source_word: יוּלָּד
  choice: lahir
  rationale: Bentuk pasif dalam pernyataan yang bersifat umum paling alami diungkapkan dengan “lahir” dalam bahasa Indonesia.
- source_word: וּבְנֵי רֶשֶׁף
  choice: dan anak-anak nyala api
  rationale: Terjemahan ini mempertahankan gambaran harfiah dan ambiguitas ungkapan Ibrani, yang dapat dipahami sebagai bunga api atau mungkin berkaitan dengan nama Reshef.
- source_word: יַגְבִּיהוּ עוּף
  choice: terbang tinggi
  rationale: Kedua unsur verbal bersama-sama menggambarkan gerak terbang ke atas; “terbang tinggi” ringkas, alami, dan tetap mempertahankan citranya.
theological_decisions: []
