  text: Engkau akan sampai ke kubur dalam kekuatan penuh[a], seperti timbunan gandum yang diangkat pada musimnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada usia tua yang matang” atau “dalam kematangan penuh.” Kata Ibrani ini langka dan dapat menunjuk pada kematangan usia atau vitalitas yang penuh.'
