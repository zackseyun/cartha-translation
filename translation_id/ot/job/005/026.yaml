  - marker: b
    text: 'Atau: “seperti timbunan gandum yang dibawa naik pada waktunya.” Gambaran Ibraninya membandingkan kematian pada waktu yang tepat dengan hasil panen yang dikumpulkan ketika sudah siap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: Engkau akan sampai
  rationale: Bentuk Qal imperfek orang kedua maskulin tunggal dari בוא menyatakan kedatangan pada masa mendatang. 'Sampai' alami dalam bahasa Indonesia untuk tujuan 'ke kubur'.
- source_word: בְכֶלַח
  choice: dalam kematangan penuh
  rationale: כֶּלַח merupakan kata langka dan maknanya diperdebatkan, mungkin menunjuk pada usia matang, kekuatan penuh, atau tahap kehidupan yang sudah masak. Pilihan ini mempertahankan keluasan makna dan kaitannya dengan gambaran panen tanpa membatasinya pada usia lanjut saja.
- source_word: אֱלֵי קָבֶר
  choice: ke kubur
  rationale: אֱלֵי menyatakan arah dan קֶבֶר berarti kubur atau tempat penguburan. Ungkapan 'ke kubur' ringkas dan wajar.
- source_word: כַּעֲלוֹת
  choice: seperti ... yang diangkat
  rationale: כְּ menandai perbandingan, sedangkan infinitif עלה secara harfiah menggambarkan sesuatu yang naik atau dibawa naik. Dalam gambaran pertanian ini, maksudnya kemungkinan gandum hasil panen yang diangkat atau dikumpulkan.
- source_word: גָּדִישׁ
  choice: timbunan gandum
  rationale: גָּדִישׁ menunjuk pada tumpukan atau timbunan bulir/gandum yang telah dipotong, bukan terutama satu berkas. 'Timbunan gandum' mempertahankan gambaran sumber dengan tepat.
- source_word: בְּעִתּוֹ
  choice: pada musimnya
  rationale: Secara harfiah berarti 'pada waktunya'. Dalam perumpamaan pertanian, 'pada musimnya' menyampaikan baik waktu yang tepat maupun nuansa panen.
