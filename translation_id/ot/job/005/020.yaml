base_translation:
  language: en
  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: id
  text: Dalam kelaparan, Dia akan menebusmu[a] dari maut, dan dalam perang, dari kuasa pedang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyelamatkanmu” atau “membebaskanmu dengan tebusan.” Kata kerja Ibrani ini mengandung gagasan pembebasan atau penyelamatan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari tangan-tangan pedang,” sebuah ungkapan yang berarti “dari kuasa pedang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: Dalam kelaparan
  rationale: רָעָב dapat berarti kelaparan atau bencana kelaparan. Dalam rangkaian malapetaka pada konteks ini, “kelaparan” secara alami mencakup keadaan bencana tersebut, sedangkan בְּ menyatakan keadaan atau waktu.
- source_word: פָּדְךָ
  choice: Dia akan menebusmu
  rationale: פדה menyatakan pembebasan atau penyelamatan, sering dengan nuansa penebusan. “Menebusmu” mempertahankan bobot leksikal itu tanpa harus menyiratkan ajaran keselamatan yang lebih lengkap.
- source_word: מִמָּוֶת
  choice: dari maut
  rationale: מִן menyatakan pelepasan dari sesuatu, dan מָוֶת adalah maut atau kematian. “Maut” sesuai dengan ragam bahasa hikmat yang puitis dan bermartabat.
- source_word: וּבְמִלְחָמָה
  choice: dan dalam perang
  rationale: מִלְחָמָה berarti perang atau pertempuran; “perang” mempertahankan cakupan umum dan sejajar dengan “dalam kelaparan”.
- source_word: מִידֵי
  choice: dari kuasa
  rationale: Secara harfiah bentuk ini berarti “dari tangan-tangan,” tetapi dalam ungkapan Ibrani menunjuk pada kuasa atau cengkeraman. “Dari kuasa” menyampaikan makna idiomatisnya dengan wajar.
- source_word: חָרֶב
  choice: pedang
  rationale: חָרֶב adalah istilah biasa untuk pedang dan di sini juga berfungsi sebagai metonimia bagi kekerasan serta kematian dalam perang.
theological_decisions:
- issue: Makna פדה dalam konteks sastra hikmat
  choice: menebus
  alternative: menyelamatkan; membebaskan dengan tebusan
  rationale: Ayat ini berbicara tentang penyelamatan dari bahaya jasmani. “Menebus” mempertahankan bahasa pembebasan yang kuat dalam bahasa Ibrani, tetapi konteks tidak boleh diperluas menjadi pernyataan soteriologis yang lebih lengkap.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kapitalisasi “Dia” dipakai untuk memperjelas bahwa subjek tersiratnya adalah Allah dalam konteks. Susunan paralel Ibrani dipertahankan; verba pada bagian kedua dibiarkan eliptis sebagaimana sumber.
