source:
  edition: WLC
  text: וְֽ֭/יָדַעְתָּ כִּי רַ֣ב זַרְעֶ֑/ךָ וְ֝/צֶאֱצָאֶ֗י/ךָ כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/025.yaml
  text: You will know that your offspring are many[b][a], and your descendants are like the grass of the earth.
translation:
  language: id
  text: Engkau akan tahu bahwa keturunanmu[a] banyak, dan anak cucumu seperti rumput di bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu”; kata Ibrani זַרְעֶךָ merupakan istilah kolektif untuk keturunan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di tanah.” Kata Ibrani אֶרֶץ dapat berarti “bumi”, “tanah”, atau “negeri”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Engkau akan tahu
  rationale: Bentuk Qal perfektum orang kedua maskulin tunggal dengan waw dipahami secara futur/resultatif dalam rangkaian janji ini. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nada kepastian.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang akan diketahui, bukan alasan.
- source_word: רַב
  choice: banyak
  rationale: Dengan זַרְעֶךָ sebagai nomina kolektif, kata sifat ini menyatakan jumlah yang besar.
- source_word: זַרְעֶךָ
  choice: keturunanmu
  rationale: Dalam konteks keluarga, זֶרַע menunjuk kepada keturunan secara kolektif. 'Keturunanmu' jelas dan wajar bagi pembaca Indonesia modern.
- source_word: וְצֶאֱצָאֶיךָ
  choice: dan anak cucumu
  rationale: Istilah ini menunjuk kepada orang-orang yang berasal dari seseorang. 'Anak cucumu' mempertahankan kesejajaran dengan 'keturunanmu' tanpa pengulangan kaku.
- source_word: כְּעֵשֶׂב
  choice: seperti rumput
  rationale: Terjemahan ini mempertahankan perbandingan puitis dengan tumbuh-tumbuhan yang sangat banyak.
- source_word: הָאָרֶץ
  choice: di bumi
  rationale: אֶרֶץ dapat berarti 'bumi' atau 'tanah/negeri'. Dalam gambaran umum tentang kelimpahan, 'bumi' menyampaikan cakupan yang luas, sedangkan alternatifnya dicatat dalam catatan kaki.
theological_decisions: []
