  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Engkau' dipakai untuk orang kedua tunggal dalam konteks puitis. Struktur paralel Ibrani dipertahankan tanpa menambahkan kopula yang tidak diperlukan dalam bahasa Indonesia.
