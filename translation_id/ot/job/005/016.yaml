  text: וַ/תְּהִ֣י לַ/דַּ֣ל תִּקְוָ֑ה וְ֝/עֹלָ֗תָ/ה קָ֣פְצָה פִּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: id
  text: Maka ada harapan bagi orang lemah, dan ketidakadilan menutup mulutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kejahatan menutup mulutnya”; secara lebih harfiah, “mulutnya tertutup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Maka ada
  rationale: Bentuk wayyiqtol menyatakan hasil dari uraian sebelumnya. "Maka ada" mempertahankan hubungan akibat sekaligus memberi ungkapan yang wajar dalam bahasa Indonesia.
- source_word: לַדַּל
  choice: bagi orang lemah
  rationale: דַּל dapat menunjuk kepada orang miskin, lemah, atau tidak berdaya secara sosial. "Orang lemah" mempertahankan keluasan makna itu dan sesuai dengan konteks perlindungan bagi kaum rentan.
- source_word: תִּקְוָה
  choice: harapan
  rationale: תִּקְוָה lazim berarti harapan atau pengharapan; "harapan" jelas dan alami dalam bahasa Indonesia.
- source_word: וְעֹלָתָה
  choice: ketidakadilan
  rationale: עַוְלָה berarti ketidakadilan, kelaliman, atau perbuatan salah. "Ketidakadilan" cocok dengan konteks sosial dan mempertahankan personifikasi dalam klausa berikutnya.
- source_word: קָפְצָה פִּיהָ
  choice: menutup mulutnya
  rationale: Secara harfiah frasa ini menggambarkan mulut ketidakadilan yang tertutup. Terjemahan ini mempertahankan gambaran Ibrani yang hidup tanpa menggantinya dengan penafsiran abstrak seperti "dibungkam".
