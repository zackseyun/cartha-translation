  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: id
  text: Aku pernah melihat seorang bodoh berakar, dan tiba-tiba aku mengutuk kediamannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku menyatakan bahwa kediamannya terkutuk,” atau “aku menyatakan bahwa kediamannya akan binasa.” Kata kerja Ibrani ini dapat dipahami sebagai pengucapan kutuk secara langsung atau sebagai pernyataan bahwa hukuman akan menimpanya.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Aku
  rationale: Pronomina orang pertama yang eksplisit dipertahankan untuk mencerminkan penekanan subjek dalam bahasa Ibrani.
- source_word: רָאִיתִי
  choice: pernah melihat
  rationale: Bentuk perfektif menyampaikan pengalaman yang telah disaksikan oleh pembicara; 'pernah melihat' alami dalam bahasa Indonesia dan mempertahankan nuansa kesaksian berdasarkan pengalaman.
- source_word: אֱוִיל
  choice: orang bodoh
  rationale: Dalam sastra hikmat, istilah ini menunjuk pada kategori moral dan rohani, bukan semata-mata kurang cerdas; 'orang bodoh' merupakan padanan Indonesia yang lazim.
- source_word: מַשְׁרִישׁ
  choice: berakar
  rationale: Partisipel kausatif dari שׁרשׁ menggambarkan tindakan menumbuhkan akar atau menjadi mapan. 'Berakar' mempertahankan metafora kestabilan dan kemakmuran yang tampak.
- source_word: וָאֶקּוֹב
  choice: lalu ... aku mengutuk
  rationale: Dalam konteks ini נקב paling langsung berarti menyatakan kutuk. 'Lalu' mencerminkan urutan naratif dari waw penghubung tanpa memasukkan pertentangan yang tidak dinyatakan.
- source_word: נָוֵהוּ
  choice: kediamannya
  rationale: נָוֶה dapat berarti tempat tinggal, hunian, atau kediaman. 'Kediamannya' cukup luas dan bermartabat tanpa mempersempit gambaran menjadi rumah fisik saja.
- source_word: פִתְאֹם
  choice: tiba-tiba
  rationale: Padanan langsung dan alami bagi adverbia yang menyatakan sesuatu yang terjadi secara mendadak.
theological_decisions:
- issue: Makna tindakan pembicara dalam וָאֶקּוֹב
  choice: Elifas mengatakan bahwa ia mengucapkan kutuk atas kediaman orang bodoh itu.
  alternative: Elifas mengenali atau menyatakan bahwa kediaman itu terkutuk atau ditentukan untuk binasa.
  rationale: Makna leksikal langsung verba tersebut mendukung 'mengutuk', tetapi konteks puisi hikmat memungkinkan pemahaman sebagai pernyataan penilaian mengenai nasib kediaman itu. Ambiguitas ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis-hikmat yang ringkas dan bermartabat. Metafora 'berakar' dipertahankan, sedangkan hubungan antarklausa diterjemahkan dengan 'lalu' agar urutan tindakan terdengar alami tanpa menambahkan nuansa pertentangan.
