- from: Aku pernah melihat orang bodoh berakar, lalu tiba-tiba aku mengutuk kediamannya.[a]
  to: Aku pernah melihat seorang bodoh berakar, dan tiba-tiba aku mengutuk kediamannya.[a]
  rationale: Revisi kecil ini mempertahankan seluruh makna teks sumber dan ambiguitas yang dicatat dalam jejak audit bahasa Inggris. Konjungsi “dan” mengikuti waw tanpa menambahkan pertentangan, sedangkan “tiba-tiba” ditempatkan secara lebih alami sebelum tindakan mengutuk. Catatan kaki diperjelas secara idiomatis tanpa mengubah fungsi alternatif pembacaannya.
