  text: וַ/יֹּ֣שַׁע מֵ֭/חֶרֶב מִ/פִּי/הֶ֑ם וּ/מִ/יַּ֖ד חָזָ֣ק אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: id
  text: Namun, Ia menyelamatkan orang miskin dari pedang mulut mereka[a] dan dari tangan orang kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menyelamatkan orang miskin dari pedang, dari mulut mereka, dan dari tangan orang kuat.” Susunan bahasa Ibraninya padat; “dari mulut mereka” dapat dipahami secara terpisah, bukan sebagai “pedang mulut mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: Ia menyelamatkan
  rationale: Berasal dari ישׁע, dengan Allah sebagai subjek tersirat dalam konteks. Walaupun bentuk wayyiqtol dapat menunjukkan masa lampau, bentuk kini cocok dengan pernyataan hikmat yang bersifat umum dalam perkataan Elifas.
- source_word: מֵחֶרֶב
  choice: dari pedang
  rationale: חֶרֶב berarti 'pedang', dan prefiks מִן menyatakan pemisahan atau pelepasan dari bahaya.
- source_word: מִפִּיהֶם
  choice: mulut mereka
  rationale: Secara bentuk berarti 'dari mulut mereka', tetapi susunan padatnya paling wajar dipahami bersama מֵחֶרֶב sebagai metafora 'pedang mulut mereka', yakni ucapan yang membinasakan. Bentuk kolektif tunggal 'mulut' dipertahankan.
- source_word: וּמִיַּד
  choice: dan dari tangan
  rationale: יָד secara harfiah berarti 'tangan' dan dapat melambangkan kuasa. Citra konkret dipertahankan karena selaras dengan gaya puitis ayat.
- source_word: חָזָק
  choice: orang kuat
  rationale: Adjektiva ini dipakai secara substantival untuk orang yang kuat atau berkuasa. 'Orang kuat' alami dalam bahasa Indonesia dan mempertahankan kontras sosial.
- source_word: אֶבְיוֹן
  choice: orang miskin
  rationale: אֶבְיוֹן menunjuk kepada orang yang miskin atau berkekurangan dan rentan secara sosial. 'Orang miskin' merupakan padanan baku, jelas, dan tidak mempersempitnya menjadi penderitaan pada umumnya.
theological_decisions:
- issue: Daya metaforis frasa 'pedang mulut mereka'
  choice: Mempertahankan metafora ucapan yang menghancurkan sebagai 'pedang mulut mereka'.
  alternative: Memisahkan frasa itu menjadi 'dari pedang, dari mulut mereka' atau menjelaskannya sebagai 'dari perkataan fitnah mereka'.
  rationale: Teks Ibrani menempatkan 'pedang' dan 'mulut' dalam susunan puitis yang padat. Mempertahankan metafora menjaga kekuatan sastranya tanpa menetapkan secara berlebihan jenis ucapan yang dimaksud; kemungkinan pemisahan sintaksis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam bermartabat dan mudah dipahami. Kata ganti 'Ia' memakai huruf kapital karena subjek tersiratnya adalah Allah dalam konteks. Metafora dan ambiguitas sintaksis sumber dipertahankan; alternatifnya dijelaskan dalam catatan kaki.
