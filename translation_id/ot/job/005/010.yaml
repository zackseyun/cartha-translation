translation:
  language: id
  text: 'yang menurunkan hujan ke permukaan bumi[a]

    dan mengirimkan air ke tempat-tempat terbuka[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “daratan.” Kata Ibrani אֶרֶץ dapat berarti “bumi,” “daratan,” atau “negeri,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau, “daerah-daerah terbuka”; atau, “jalan-jalan.” Kata Ibrani חוּצוֹת dapat menunjuk pada tempat terbuka, daerah luas di luar permukiman, atau jalan dan lapangan kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: yang menurunkan
  rationale: Partisipel Qal berartikel berfungsi sebagai sebutan bagi Allah dan melanjutkan uraian dari ayat sebelumnya. Dalam hubungan dengan hujan, ungkapan Indonesia yang alami ialah “menurunkan hujan”; ini menyampaikan tindakan memberi hujan tanpa terjemahan kaku.
- source_word: מָטָר
  choice: hujan
  rationale: Padanan umum dan alami untuk presipitasi dalam bahasa Indonesia modern.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: ke permukaan bumi
  rationale: “Permukaan” mempertahankan gambaran harfiah פְּנֵי serta kesejajarannya dengan bagian kedua. “Bumi” dipilih karena pernyataan ini bersifat umum, sementara kemungkinan “daratan” dicatat dalam catatan kaki.
- source_word: וְשֹׁלֵחַ
  choice: dan mengalirkan
  rationale: Partisipel Qal ini sejajar dengan הַנֹּתֵן. Secara harfiah berarti “mengirimkan”; ketika objeknya air, “mengalirkan” lebih alami dalam bahasa Indonesia dan tetap menggambarkan Allah menyebabkan air sampai ke tempat tujuannya.
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya bersifat jamak, kata ini lazim berfungsi sebagai kata benda massa dan secara alami diterjemahkan “air”.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: ke tempat-tempat terbuka
  rationale: חוּצוֹת dapat menunjuk pada tempat luas atau terbuka, daerah di luar permukiman, ataupun jalan-jalan. Dalam konteks hujan dan air, “tempat-tempat terbuka” mempertahankan keluasan maknanya tanpa memaksakan latar perkotaan atau jenis lahan tertentu.
theological_decisions:
- issue: Cakupan אָרֶץ
  choice: bumi
  alternative: daratan
  rationale: Konteks menggambarkan pemeliharaan Allah melalui hujan secara umum, bukan wilayah tertentu. “Bumi” sesuai dengan cakupan tersebut, tetapi kemungkinan makna “daratan” tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan dua baris mempertahankan paralelisme puisi Ibrani; “permukaan” pada bagian pertama menjaga citra sumber, sedangkan pengulangan harfiah pada bagian kedua tidak dipaksakan karena akan terasa kaku dalam bahasa Indonesia.
