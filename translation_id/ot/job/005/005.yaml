  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gerak puitis dari panen yang dimakan dan dirampas menuju kekayaan yang sangat diinginkan. Penanda catatan kaki ditempatkan setelah klausa pertama agar sesuai dengan bahan konsultasi, meskipun isi catatan membahas pembacaan alternatif untuk klausa terakhir.
