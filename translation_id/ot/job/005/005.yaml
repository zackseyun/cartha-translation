  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: id
  text: Panennya dimakan oleh orang lapar, dan mereka bahkan mengambilnya dari antara semak berduri, dan orang haus terengah-engah mengincar kekayaan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan jerat menelan kekayaan mereka.” Klausa terakhir dalam teks Ibrani sulit dipahami; teks utama mengikuti pembacaan umum yang menyejajarkan “orang lapar” dengan “orang haus”.
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: panennya
  rationale: קָצִיר menunjuk pada hasil panen; bentuk dengan akhiran orang ketiga tunggal dipertahankan sebagai “-nya”.
- source_word: רָעֵב
  choice: orang lapar
  rationale: Adjektiva ini dipakai secara substantival. “Orang lapar” alami dalam bahasa Indonesia dan tidak memaksakan jumlah yang tidak dinyatakan secara tegas.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: bahkan diambil dari antara semak berduri
  rationale: Terjemahan ini mempertahankan gambaran hasil panen yang dirampas sekalipun berada di antara tumbuhan berduri, tanpa menentukan bahwa duri itu sengaja dijadikan pagar pelindung.
- source_word: צִנִּים
  choice: semak berduri
  rationale: Dalam konteks pertanian, makna yang paling langsung ialah tumbuhan berduri; “semak berduri” menghasilkan gambaran yang lebih alami daripada bentuk abstrak “duri”.
- source_word: וְשָׁאַף
  choice: terengah-engah menginginkan
  rationale: שָׁאַף dapat menggambarkan terengah-engah atau hasrat yang kuat. Ungkapan ini mempertahankan metafora kerakusan sambil tetap jelas bagi pembaca modern.
- source_word: צַמִּים
  choice: orang haus
  rationale: Pembacaan ini sesuai dengan Teks Masoret dan membentuk kesejajaran dengan “orang lapar”. Kemungkinan pembacaan lain yang berkaitan dengan jerat dicatat dalam catatan kaki.
- source_word: חֵילָם
  choice: kekayaan mereka
  rationale: חַיִל dapat berarti harta, sumber daya, atau kekayaan. Dalam konteks perampasan hasil milik, “kekayaan” merupakan padanan Indonesia yang wajar; akhiran jamak dipertahankan sebagai “mereka”.
