base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: id
  text: Dalam enam kesusahan Ia akan melepaskanmu; bahkan dalam tujuh kesusahan,[a] malapetaka[b] tidak akan menyentuhmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan puitis Ibrani “dalam enam ... bahkan dalam tujuh” menyatakan pembebasan yang berulang atau menyeluruh, bukan batas harfiah tepat tujuh kesusahan.
    reason: cultural_note
  - marker: b
    text: Atau “bahaya” atau “kemalangan”. Kata Ibrani ini dapat menunjuk pada sesuatu yang buruk atau mencelakakan; dalam konteks ini tidak harus berarti kejahatan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שֵׁשׁ צָרוֹת
  choice: Dalam enam kesusahan
  rationale: Preposisi בְּ paling wajar diterjemahkan “dalam” pada ungkapan bilangan ini. צָרוֹת mencakup kesusahan, tekanan, dan keadaan sulit tanpa membatasi jenis penderitaannya.
- source_word: יַצִּילֶךָּ
  choice: Ia akan melepaskan engkau
  rationale: Bentuk Hifil dari נצל berarti melepaskan atau menyelamatkan dari bahaya. “Melepaskan” sesuai dengan ragam puitis yang luhur; subjek tersirat tetap dinyatakan dengan pronomina karena nama Allah tidak muncul secara eksplisit dalam ayat ini.
- source_word: וּ/בְ/שֶׁבַע
  choice: bahkan dalam tujuh kesusahan
  rationale: Ungkapan bilangan bertingkat “enam ... tujuh” dipertahankan, sedangkan “bahkan” menyampaikan daya klimaksnya. Kata “kesusahan” diulang secara alami dalam bahasa Indonesia untuk memperjelas elipsis Ibrani.
- source_word: לֹא יִגַּע בְּךָ
  choice: tidak akan menyentuh engkau
  rationale: נגע dapat berarti menyentuh, mencapai, atau menimpa. “Menyentuh” mempertahankan citra dan keluasan ungkapan sumber.
- source_word: רָע
  choice: malapetaka
  rationale: Dalam konteks pembebasan dari kesusahan, רָע menunjuk pada sesuatu yang buruk atau mencelakakan, bukan harus kejahatan moral. “Malapetaka” menyampaikan arti kontekstual ini dengan jelas, sambil tetap cukup luas.
theological_decisions:
- issue: Rujukan subjek tersirat pada יַצִּילֶךָּ
  choice: Menggunakan “Ia” tanpa menggantinya dengan “Allah”.
  alternative: “Allah akan melepaskan engkau.”
  rationale: Konteks sebelumnya menunjukkan Allah sebagai rujukannya, tetapi teks ayat ini hanya memakai verba orang ketiga tunggal maskulin. Pronomina mempertahankan bentuk sumber dan tidak menambahkan nama ilahi.
- issue: Makna formula bilangan “enam ... tujuh”
  choice: Mempertahankan kedua bilangan dan menandai peningkatannya dengan “bahkan”.
  alternative: Menafsirkannya langsung sebagai “berkali-kali” atau membatasinya secara harfiah pada tepat tujuh kesusahan.
  rationale: Formula bilangan puitis ini menyatakan pembebasan yang berulang atau menyeluruh. Mempertahankan angkanya menjaga bentuk puisi dan ketegangannya tanpa menjadikannya batas matematis.
- issue: Cakupan רָע
  choice: Menerjemahkannya sebagai “malapetaka”.
  alternative: “kejahatan”, “bahaya”, atau “kemalangan”.
  rationale: Konteks berbicara tentang kesusahan dan pembebasan, sehingga nuansa bencana atau hal yang mencelakakan lebih menonjol daripada kejahatan moral. Pilihan ini tidak mengubah ayat menjadi janji doktrinal yang lebih mutlak daripada ucapan Elifas dalam konteksnya.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam puitis dan bermartabat. “Engkau” mempertahankan sapaan tunggal dalam puisi hikmat; “Ia” dikapitalisasi sesuai kebiasaan bahasa Indonesia untuk rujukan ilahi, tanpa menambahkan nama Allah yang tidak eksplisit dalam ayat.
