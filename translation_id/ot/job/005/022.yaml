source:
  edition: WLC
  text: לְ/שֹׁ֣ד וּ/לְ/כָפָ֣ן תִּשְׂחָ֑ק וּֽ/מֵ/חַיַּ֥ת הָ֝/אָ֗רֶץ אַל תִּירָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: id
  text: Engkau akan menertawakan kehancuran dan kelaparan, dan engkau tidak akan takut[a] kepada binatang liar di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan takut kepada binatang liar di bumi.” Bentuk Ibraninya lazim dipakai sebagai larangan, tetapi di sini dapat berfungsi sebagai janji bahwa engkau akan aman dan tidak merasa takut.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: kehancuran
  rationale: Kata ini menunjuk pada kehancuran atau kebinasaan yang dahsyat. “Kehancuran” ringkas, alami, dan sejajar dengan “kelaparan” sebagai malapetaka.
- source_word: כָפָן
  choice: kelaparan
  rationale: Nomina ini berarti kelaparan hebat atau bencana kelaparan. “Kelaparan” jelas dan sesuai dengan kesejajarannya dengan kehancuran.
- source_word: תִּשְׂחָק
  choice: engkau akan menertawakan
  rationale: Verba שׂחק berarti tertawa dan dalam konteks ini menyiratkan sikap tanpa gentar terhadap malapetaka. Bentuk transitif “menertawakan” secara alami mengungkapkan konstruksi Ibrani dengan לְ tanpa menjelaskan metaforanya secara berlebihan.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: kepada binatang liar di bumi
  rationale: חַיָּה dalam konteks ancaman lazimnya mengacu pada binatang liar. “Di bumi” mempertahankan cakupan הָאָרֶץ tanpa membatasinya secara tidak perlu menjadi suatu negeri tertentu.
- source_word: אַל תִּירָא
  choice: engkau tidak akan takut
  rationale: Walaupun אַל dengan bentuk imperfek biasanya menyatakan larangan, rangkaian janji perlindungan dalam konteks ini memungkinkan bentuk tersebut dipahami sebagai jaminan. Terjemahan utama mengikuti alur janji, sedangkan kemungkinan larangan dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Daya ujar אַל תִּירָא dalam konteks
  choice: 'jaminan berupa janji: “engkau tidak akan takut”'
  alternative: 'larangan: “jangan takut”'
  rationale: Ayat ini berada dalam rangkaian perlindungan dan berkat yang dijanjikan dalam perkataan Elifas. Bentuk jaminan selaras dengan “engkau akan menertawakan,” tetapi ambiguitas gramatikal yang nyata tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. “Menertawakan” mempertahankan gambaran berani dari teks Ibrani, sedangkan “binatang liar” lebih jelas bagi pembaca modern daripada “binatang buas” dan tetap sesuai dengan konteks ancaman.
