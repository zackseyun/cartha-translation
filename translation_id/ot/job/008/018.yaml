  text: אִם יְבַלְּעֶ֥/נּוּ מִ/מְּקוֹמ֑/וֹ וְ/כִ֥חֶשׁ בּ֝֗/וֹ לֹ֣א רְאִיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: id
  text: Jika ia dilenyapkan dari tempatnya[a], tempat itu akan menyangkalnya[b], dengan berkata, “Aku tidak pernah melihatmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari tempat tanaman itu.” Akhiran Ibrani dapat dipahami dengan mengacu pada tanaman dalam gambaran ini, meskipun tanaman tersebut juga menggambarkan orang fasik.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak mengakuinya” atau “berlaku dusta terhadapnya.” Kata kerja Ibrani ini dapat menyatakan penyangkalan atau penolakan untuk mengakui.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan daya kondisional dari partikel Ibrani dalam gambaran puitis ini.
- source_word: יְבַלְּעֶנּוּ
  choice: ia dilenyapkan
  rationale: Bentuk ini secara harfiah menyatakan bahwa ia ditelan, tetapi dalam konteks tercabutnya tanaman/orang fasik dari tempatnya, ‘dilenyapkan’ menyampaikan hasilnya secara alami tanpa menghilangkan kekuatan citra sepenuhnya.
- source_word: מִמְּקוֹמוֹ
  choice: dari tempatnya
  rationale: Akhiran maskulin tunggal dapat merujuk kepada orang yang digambarkan sebagai tanaman atau kepada tanaman itu sendiri; ‘tempatnya’ mempertahankan ambiguitas tersebut dalam bahasa Indonesia.
- source_word: וְכִחֶשׁ בּוֹ
  choice: tempat itu akan menyangkalnya
  rationale: Subjek tersirat paling wajar adalah ‘tempatnya’, yang dipersonifikasikan. ‘Menyangkalnya’ mencakup arti menolak mengakui atau tidak mengakuinya.
- source_word: לֹא רְאִיתִיךָ
  choice: Aku tidak pernah melihatmu
  rationale: Menyampaikan penyangkalan langsung secara idiomatis sambil mempertahankan citra konkret verba ‘melihat’, bukan menafsirkannya sebagai ‘mengenal’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan ‘tempat itu’ memperjelas subjek personifikasi yang hanya tersirat dalam bahasa Ibrani, sedangkan ‘tempatnya’ tetap membuka rujukan kepada orang atau tanaman.
