lexical_decisions:
- source_word: עַד אָן
  choice: Berapa lama lagi
  rationale: Ungkapan tanya idiomatis ini menyampaikan teguran tidak sabar secara alami dalam bahasa Indonesia.
- source_word: תְּמַלֶּל
  choice: engkau akan terus mengatakan
  rationale: Bentuk verba ini menunjuk pada tindakan berbicara atau mengucapkan; 'terus mengatakan' menangkap nuansa berkelanjutan dalam konteks.
- source_word: אֵלֶּה
  choice: semua ini
  rationale: Demonstrativa jamak ini merujuk secara luas pada berbagai pernyataan Ayub sebelumnya tanpa mengulang kata 'perkataan' dari baris kedua.
- source_word: וְרוּחַ כַּבִּיר
  choice: menjadi seperti angin yang dahsyat
  rationale: רוּחַ dipertahankan sebagai gambaran konkret 'angin', sedangkan כַּבִּיר menyatakan kekuatan atau kedahsyatan. Kata 'seperti' membuat fungsi metaforisnya alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: אִמְרֵי פִיךָ
  choice: perkataan mulutmu
  rationale: Terjemahan formal ini mempertahankan frasa konstruksi Ibrani dan kekonkretan puitisnya, sekaligus tetap dapat dipahami.
