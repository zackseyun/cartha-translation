id: JOB.8.20
reference: Job 8:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֶן אֵ֭ל לֹ֣א יִמְאַס תָּ֑ם וְ/לֹֽא יַ֝חֲזִ֗יק בְּ/יַד מְרֵעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: id
  text: Sungguh, Allah tidak menolak orang yang tidak bercela dan tidak menopang tangan orang-orang yang berbuat jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak mendukung orang-orang yang berbuat jahat”; lebih harfiah, “tidak menggenggam tangan orang-orang yang berbuat jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sungguh
  rationale: Partikel ini memperkenalkan penegasan. “Sungguh” mempertahankan daya deklaratifnya dan terdengar alami dalam puisi Indonesia modern.
- source_word: אֵל
  choice: Allah
  rationale: אֵל merupakan sebutan puitis umum bagi Allah di sini; teks tidak secara eksplisit menambahkan gagasan “Mahakuasa”.
- source_word: יִמְאַס
  choice: menolak
  rationale: Kata kerja מאס menyatakan penolakan atau tidak menerima; “menolak” mempertahankan maknanya tanpa menambahkan nuansa kebencian emosional.
- source_word: תָּם
  choice: orang yang tidak bercela
  rationale: Kata sifat substantival ini menunjuk kepada orang yang utuh dalam integritas atau tidak bercela. Bentuk umum ini tidak membatasi pernyataan hanya kepada satu laki-laki tertentu.
- source_word: יַחֲזִיק בְּיַד
  choice: menopang tangan
  rationale: Gabungan חזק bentuk Hifil dengan בְּיַד dapat menggambarkan memegang atau menopang tangan seseorang, dengan pengertian memberi dukungan. Pilihan ini mempertahankan citra tangan sekaligus menyampaikan implikasi idiomatisnya.
- source_word: מְרֵעִים
  choice: orang-orang yang berbuat jahat
  rationale: Bentuk partisipial ini menonjolkan mereka yang melakukan kejahatan; terjemahan ini mempertahankan daya verbal tersebut.
theological_decisions:
- issue: Makna ungkapan וְלֹא יַחֲזִיק בְּיַד מְרֵעִים
  choice: Allah tidak menopang tangan orang-orang yang berbuat jahat
  alternative: Allah tidak mendukung orang-orang yang berbuat jahat; Allah tidak menggenggam tangan orang-orang yang berbuat jahat
  rationale: Ungkapan Ibrani dapat dibaca secara konkret sebagai menggenggam tangan atau secara idiomatis sebagai menopang dan mendukung. Teks utama mempertahankan citra tangan sambil membiarkan makna dukungan tetap terbaca; catatan kaki menyajikan kemungkinan lainnya tanpa meniadakan ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sungguh” memberi penegasan puitis tanpa kekakuan “Lihatlah”; susunan kedua klausa mempertahankan kesejajaran Ibrani.
