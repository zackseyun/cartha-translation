  text: עַל גַּ֭ל שָֽׁרָשָׁ֣י/ו יְסֻבָּ֑כוּ בֵּ֖ית אֲבָנִ֣ים יֶחֱזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/017.yaml
  text: His roots are intertwined over a stone heap[a]; he sees a house of stones.
translation:
  language: id
  text: Akar-akarnya berjalin-jalin di atas timbunan batu[a]; ia memandang rumah batu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia memandang rumah yang terbuat dari batu” atau “ia melihat ke dalam tempat berbatu.” Frasa Ibraninya secara harfiah berarti “rumah batu-batu” dan dapat menunjuk pada bangunan batu ataupun tempat berbatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: di atas
  rationale: Menunjukkan posisi akar terhadap timbunan batu dan secara alami menggambarkan akar yang menjalar di atasnya.
- source_word: גַּל
  choice: timbunan batu
  rationale: Dalam konteks yang menyebut batu pada paruh kedua, kata ini paling mungkin menunjuk pada tumpukan atau timbunan batu, bukan gelombang.
- source_word: שָׁרָשָׁיו
  choice: akar-akarnya
  rationale: Mempertahankan bentuk jamak berakhiran posesif dan metafora orang yang digambarkan sebagai tumbuhan.
- source_word: יְסֻבָּכוּ
  choice: berjalin-jalin
  rationale: Mengungkapkan akar-akar yang saling teranyam atau kusut, dengan bentuk Indonesia yang wajar dan puitis.
- source_word: בֵּית אֲבָנִים
  choice: rumah batu
  rationale: Mempertahankan gambaran harfiah konstruksi Ibrani, tetapi tetap membuka kemungkinan bahwa frasa ini menunjuk pada bangunan batu atau tempat berbatu.
- source_word: יֶחֱזֶה
  choice: ia memandang
  rationale: Menjaga daya visual verba 'melihat/memandang' serta personifikasi tunggal dari sosok tumbuhan dalam perumpamaan.
