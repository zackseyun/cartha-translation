base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: id
  text: Jika engkau murni dan lurus hati, tentu sekarang juga Ia akan bangkit demi engkau[a] dan memulihkan kediaman kebenaranmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia akan bangun bagi engkau” atau “Ia akan menggerakkan diri-Nya demi engkau.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kediaman kebenaranmu.” Kata kerja yang diterjemahkan “memulihkan” juga dapat berarti “membuat utuh” atau “membayar kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel kondisional biasa yang memperkenalkan syarat dalam pernyataan Bildad.
- source_word: זַךְ
  choice: murni
  rationale: Menyatakan kemurnian moral tanpa mempertegasnya menjadi ketidakbersalahan dalam arti hukum.
- source_word: יָשָׁר
  choice: lurus hati
  rationale: Ungkapan Indonesia yang alami untuk kelurusan moral dalam sastra hikmat; bukan sekadar keadaan fisik yang lurus.
- source_word: כִּי עַתָּה
  choice: tentu sekarang juga
  rationale: Memahami כִּי sebagai penegas dalam klausa akibat dan mempertahankan desakan waktu dari עַתָּה.
- source_word: יָעִיר עָלֶיךָ
  choice: Ia akan bertindak demi engkau
  rationale: Secara harfiah verba itu berarti membangunkan atau menggerakkan; padanan ini menyampaikan tindakan aktif Allah bagi Ayub dengan bahasa Indonesia yang alami, sementara metafora sumber dicatat dalam catatan kaki.
- source_word: וְשִׁלַּם
  choice: dan memulihkan
  rationale: Piel dari שׁלם dapat berarti membuat utuh, membayar kembali, atau memulihkan. Dengan kediaman sebagai objek, 'memulihkan' paling sesuai tanpa menutup alternatif leksikal.
- source_word: נְוַת
  choice: kediaman
  rationale: Mencakup tempat tinggal beserta lingkungan rumah tangga atau harta keluarga, dengan ragam bahasa yang bermartabat.
- source_word: צִדְקֶךָ
  choice: mu yang benar
  rationale: Mengalihkan frasa konstruksi 'kediaman kebenaranmu' secara adjektival agar alami, sambil mempertahankan kualifikasi moralnya.
theological_decisions:
- issue: Subjek tersirat pada verba dalam klausa akibat
  choice: Menggunakan 'Ia', yang dalam konteks merujuk kepada Allah, tanpa menambahkan nama 'Allah'.
  alternative: Menyebut 'Allah' secara eksplisit.
  rationale: Bahasa Ibrani tidak menyebut nomina subjek. Kapitalisasi membantu rujukan kontekstual tanpa memasukkan nomina yang tidak tertulis.
- issue: Kekuatan klaim Bildad
  choice: Menerjemahkannya sebagai pernyataan bersyarat Bildad dengan kepastian yang tegas.
  alternative: Melunakkan pernyataan untuk menjauhkan narator dari teologi pembalasan Bildad.
  rationale: Terjemahan harus menyajikan ucapan Bildad sebagaimana adanya, tanpa mengesahkan ataupun mengoreksi pandangannya secara tersirat.
- issue: Makna צִדְקֶךָ dalam frasa נְוַת צִדְקֶךָ
  choice: '''kediamanmu yang benar'' sebagai kualifikasi moral atas kediaman atau rumah tangga.'
  alternative: '''kediaman kebenaranmu'' atau ''kediamanmu yang sejahtera''.'
  rationale: Bentuk konstruksi Ibrani sungguh dapat dipertahankan secara harfiah, tetapi bentuk adjektival lebih alami dalam bahasa Indonesia. Terjemahan tidak mengubahnya menjadi janji kemakmuran semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang bermartabat. 'Engkau' dipakai sesuai wacana langsung puitis. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
