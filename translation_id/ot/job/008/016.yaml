  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: id
  text: 'Ia lembap di hadapan matahari[a],

    dan tunas-tunasnya menjulur di atas kebunnya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “di hadapan matahari” dapat berarti “di depan matahari” atau “di bawah cahaya matahari”, tidak harus “sebelum matahari terbit”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan tunasnya tumbuh keluar di atas kebunnya”. Kata benda Ibrani berbentuk tunggal dan menunjuk pada pertumbuhan muda, tetapi dapat dipahami secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: penuh kelembapan
  rationale: Kata sifat ini menggambarkan keadaan yang lembap atau cukup mendapat air. Pilihan ini mempertahankan gambaran konkret tanaman tanpa mempersempit maknanya menjadi sekadar ‘segar’ atau ‘subur’.
- source_word: הוּא
  choice: ia
  rationale: Pronomina maskulin dipertahankan sebagai ‘ia’ karena perumpamaan Bildad menggambarkan sosok tersebut dengan citra tanaman sekaligus bahasa personal.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: di hadapan matahari
  rationale: Ungkapan ini secara harfiah berarti ‘di hadapan matahari’. Terjemahan tersebut mempertahankan kemungkinan makna spasial—terbuka di depan atau di bawah cahaya matahari—tanpa menafsirkannya sebagai waktu sebelum matahari terbit.
- source_word: וְעַל
  choice: dan ... di atas
  rationale: Pilihan ini mempertahankan hubungan antarbait dan makna spasial preposisi עַל dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: גַּנָּתוֹ
  choice: kebunnya
  rationale: Nomina ini berarti kebun atau petak kebun dan memiliki akhiran milik orang ketiga maskulin tunggal. ‘Kebunnya’ merupakan padanan Indonesia yang alami.
- source_word: יֹנַקְתּוֹ
  choice: tunas-tunasnya
  rationale: Nomina feminin tunggal ini menunjuk pada tunas atau pertumbuhan muda dan dapat dipahami secara kolektif. Bentuk ulang menyampaikan pengertian kolektif itu secara alami dalam bahasa Indonesia.
- source_word: תֵצֵא
  choice: menjulur
  rationale: Secara dasar verba ini berarti ‘keluar’ atau ‘tampil’. Dalam konteks pertumbuhan tanaman di atas kebun, ‘menjulur’ menyampaikan gerak keluar dan meluas tanpa menghilangkan citra spasialnya.
