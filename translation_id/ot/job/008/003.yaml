  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: id
  text: Apakah Allah memutarbalikkan keadilan[a], atau Yang Mahakuasa memutarbalikkan kebenaran?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah Allah menyimpangkan penghakiman, atau Yang Mahakuasa menyimpangkan apa yang benar?”'
    reason: Alternatif ini menonjolkan nuansa yuridis מִשְׁפָּט dan cakupan moral צֶדֶק, serta memakai padanan yang lebih dekat dengan arti dasar יְעַוֵּת.
lexical_decisions:
- source_word: הַאֵל
  choice: Apakah Allah
  rationale: Partikel tanya הַ membentuk pertanyaan ya/tidak, sedangkan אֵל di sini merupakan sebutan umum bagi Allah. Bentuk “Apakah Allah” wajar dalam bahasa Indonesia dan mempertahankan sifat retoris pertanyaan itu.
- source_word: יְעַוֵּת
  choice: membengkokkan
  rationale: Bentuk Piel dari עוה berarti membuat bengkok atau menyimpangkan. “Membengkokkan” mempertahankan citra dasar Ibrani sekaligus menyampaikan tindakan merusak keadilan secara kuat.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks hukum dan moral ini, מִשְׁפָּט menunjuk pada keputusan yang adil atau keadilan sebagai norma; “keadilan” alami dan mudah dipahami.
- source_word: וְאִם
  choice: atau
  rationale: Secara harfiah ungkapan ini dapat berarti “dan jika”, tetapi dalam pasangan pertanyaan retoris ini berfungsi secara disjungtif. “Atau” menyampaikan hubungan antarklausa secara alami.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: שַׁדַּי adalah gelar ilahi dalam konteks ini. “Yang Mahakuasa” menerjemahkan gelar tersebut dalam bahasa Indonesia yang baku dan khidmat.
- source_word: צֶדֶק
  choice: kebenaran
  rationale: צֶדֶק mencakup kelurusan, kebenaran, dan keadilan. “Kebenaran” mempertahankan perbedaan leksikalnya dari מִשְׁפָּט sambil tetap membawa nuansa moral.
theological_decisions:
- issue: Penerjemahan pasangan gelar ilahi אֵל dan שַׁדַּי
  choice: Allah ... Yang Mahakuasa
  alternative: El ... Shaddai
  rationale: Keduanya berfungsi sebagai sebutan atau gelar ilahi, bukan nama diri yang perlu ditransliterasikan. Penerjemahan ini menyampaikan maknanya secara langsung kepada pembaca Indonesia.
- issue: Pembedaan antara מִשְׁפָּט dan צֶדֶק
  choice: keadilan ... kebenaran
  alternative: keadilan ... keadilan
  rationale: Teks Ibrani memakai dua istilah etis-yuridis yang berdekatan tetapi berbeda. Pilihan ini tidak meratakan paralelisme dan mempertahankan ketegangan antara keadilan hukum dan kelurusan moral.
- issue: Kekuatan retoris pertanyaan tentang tindakan Allah
  choice: Dibiarkan sebagai dua pertanyaan retoris yang berpasangan
  alternative: Diubah menjadi pernyataan bahwa Allah tidak mungkin berlaku tidak adil
  rationale: Bentuk interogatif teks sumber harus dipertahankan agar penegasan teologis tersirat tidak diubah menjadi penjelasan eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, baku, khidmat, dan mudah dipahami. Paralelisme puitis serta pertanyaan retoris dipertahankan; “membengkokkan” sengaja mempertahankan metafora Ibrani.
