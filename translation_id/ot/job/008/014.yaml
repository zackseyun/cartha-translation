  text: yang keyakinannya terputus[a][b], dan sandarannya adalah rumah laba-laba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harapannya terputus”; kata benda Ibrani di sini dapat berarti keyakinan, harapan, atau rasa aman.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani yang diterjemahkan “terputus” tergolong langka dan maknanya diperdebatkan; kemungkinan nuansanya mencakup “diputuskan” atau, yang kurang mungkin dalam konteks ini, “dibenci.”
