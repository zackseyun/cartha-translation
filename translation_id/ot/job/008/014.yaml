    text: Maksudnya, sandarannya serapuh rumah atau jaring laba-laba.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang ...-nya
  rationale: Partikel relatif ini menghubungkan ayat dengan orang fasik yang dibicarakan sebelumnya; susunan dengan “yang” alami dalam bahasa Indonesia dan mempertahankan hubungan tersebut.
- source_word: יָקוֹט
  choice: terputus
  rationale: Kata kerja ini langka dan maknanya diperdebatkan. “Terputus” sesuai dengan gambaran runtuhnya rasa aman, tanpa menutup kemungkinan nuansa “diputuskan” atau, yang kurang mungkin di sini, “menjadi sesuatu yang dibenci”.
- source_word: כִּסְלוֹ
  choice: keyakinannya
  rationale: Dalam konteks sastra hikmat, nomina ini dapat menunjuk pada keyakinan, harapan, atau rasa aman. “Keyakinan” selaras dengan מִבְטַחוֹ sekaligus menghindari pengulangan kata yang sama.
- source_word: וּבֵית
  choice: dan ... rumah
  rationale: Terjemahan “rumah” mempertahankan metafora konkret Ibrani tentang bangunan laba-laba yang rapuh.
- source_word: עַכָּבִישׁ
  choice: laba-laba
  rationale: Padanan Indonesia yang lazim; rangkaian konstruksi Ibrani diterjemahkan secara alami sebagai “rumah laba-laba”.
- source_word: מִבְטַחוֹ
  choice: sandarannya
  rationale: Nomina ini dapat berarti kepercayaan, rasa aman, atau sesuatu yang diandalkan. “Sandarannya” menonjolkan objek tempat orang itu bertumpu dan menghasilkan metafora yang alami dalam bahasa Indonesia.
