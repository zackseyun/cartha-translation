  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: id
  text: Ia bersandar pada rumahnya[a], tetapi rumah itu tidak akan tetap berdiri; ia berpegang erat padanya[b], tetapi rumah itu tidak akan tegak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia mengandalkan rumahnya.” Kata kerja Ibrani ini dapat berarti bergantung pada sesuatu sebagai penopang maupun bersandar secara fisik padanya.'
    reason: lexical_alternative
  - marker: b
    text: Pengulangan gambaran tentang tidak tetap berdiri dan tidak tegak mempertahankan kesejajaran puisi Ibrani serta melukiskan ketidakstabilan rumah itu.
    reason: poetic_parallelism
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: bersandar
  rationale: Bentuk Nifal dari שׁען menyatakan tindakan menyandarkan diri atau mengandalkan sesuatu sebagai penopang. “Bersandar” mempertahankan gambaran fisiknya sekaligus menyiratkan ketergantungan.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: בַּיִת pada dasarnya berarti “rumah”. Terjemahan ini mempertahankan citra konkret dalam perumpamaan dan tidak mempersempitnya menjadi “keluarga” atau menafsirkannya sebagai sesuatu yang abstrak.
- source_word: וְלֹא יַעֲמֹד
  choice: tetapi rumah itu tidak tetap berdiri
  rationale: עמד berarti “berdiri” atau “tetap berdiri”. Penyebutan kembali “rumah itu” memperjelas subjek dalam bahasa Indonesia, sedangkan bentuk kini menyampaikan corak peribahasa umum.
- source_word: יַחֲזִיק בּוֹ
  choice: ia berpegang erat padanya
  rationale: Bentuk Hifil dari חזק dengan ב dapat menyatakan memegang atau berpegang kuat pada sesuatu. Ungkapan ini menjaga tindakan fisik yang hidup tanpa mengubahnya menjadi sekadar kepercayaan batin.
- source_word: וְלֹא יָקוּם
  choice: tetapi rumah itu tidak dapat bertahan tegak
  rationale: קום dapat berarti “bangkit” atau “berdiri”. Dalam kesejajaran dengan עמד, frasa ini menggambarkan rumah yang gagal menjadi tegak atau kukuh; “bertahan tegak” mempertahankan citra tersebut sambil membedakan baris kedua.
