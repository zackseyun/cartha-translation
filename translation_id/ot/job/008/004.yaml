base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: id
  text: Jika anak-anak laki-lakimu berdosa terhadap-Nya, Ia menyerahkan mereka ke dalam kuasa pelanggaran mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke dalam tangan pelanggaran mereka.” Dalam bahasa Ibrani, “tangan” dapat berarti kuasa atau kendali.'
    reason: Menjelaskan idiom Ibrani dan mempertahankan metafora sumber sebagai alternatif.
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan fungsi normal partikel Ibrani sebagai pengantar syarat, tanpa mengubahnya menjadi pernyataan sebab yang pasti.
- source_word: בָּנֶיךָ
  choice: anak-anak laki-lakimu
  rationale: Bentuk Ibrani adalah jamak maskulin, yaitu “anak-anak laki-laki” atau “putra-putra”; pilihan ini akurat sekaligus mudah dipahami dalam bahasa Indonesia modern.
- source_word: חָטְאוּ
  choice: berdosa
  rationale: Menyampaikan makna dasar verba חטא dalam klausa bersyarat secara alami.
- source_word: לוֹ
  choice: terhadap-Nya
  rationale: Dengan verba חטא, preposisi ini menandai pihak yang menjadi sasaran dosa. Konteks menunjuk kepada Allah, tetapi terjemahan tetap memakai pronomina sebagaimana teks Ibrani.
- source_word: וַיְשַׁלְּחֵם
  choice: Ia menyerahkan mereka
  rationale: Dalam gabungan dengan idiom “ke dalam tangan”, verba שלח menyatakan tindakan menyerahkan seseorang kepada suatu kuasa atau akibat, bukan sekadar menyuruh pergi.
- source_word: בְּיַד
  choice: ke dalam kuasa
  rationale: “Tangan” merupakan idiom Ibrani untuk kuasa atau kendali. Terjemahan maknawi ini lebih alami dalam bahasa Indonesia, sedangkan metafora harfiahnya dicatat dalam catatan kaki.
- source_word: פִּשְׁעָם
  choice: pelanggaran mereka
  rationale: פשע menunjuk pada pelanggaran atau pemberontakan yang disengaja; “pelanggaran” mempertahankan perbedaannya dari חטא (“berdosa”) pada bagian awal ayat.
theological_decisions:
- issue: Acuan pronomina dalam “berdosa terhadap-Nya”
  choice: Pronomina dipertahankan dan, sesuai konteks, dipahami menunjuk kepada Allah.
  alternative: Mengganti pronomina secara eksplisit dengan “Allah”, atau membiarkannya tanpa kapitalisasi.
  rationale: Pembicaraan Bildad berpusat pada keadilan ilahi, sehingga Allah merupakan acuan yang paling wajar. Namun, memakai pronomina alih-alih menambahkan nama “Allah” tetap menjaga bentuk teks sumber.
- issue: Hubungan antara tindakan ilahi dan pelanggaran anak-anak Ayub
  choice: “Ia menyerahkan mereka ke dalam kuasa pelanggaran mereka.”
  alternative: “Ia membuang mereka karena pelanggaran mereka.”
  rationale: Teks Ibrani menggambarkan tindakan menyerahkan mereka kepada kuasa pelanggaran mereka sendiri. Terjemahan ini mempertahankan baik tindakan ilahi maupun peranan pelanggaran tersebut tanpa merinci mekanisme penghukuman melebihi yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Anak-anak laki-lakimu” dipilih daripada “putra-putramu” agar akurat terhadap bentuk maskulin Ibrani namun tetap mudah dipahami. Kapitalisasi pronomina mengikuti kebiasaan bahasa Indonesia untuk acuan kepada Allah.
