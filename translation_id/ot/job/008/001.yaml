lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam formula naratif yang memperkenalkan percakapan, verba ענה berarti ‘menjawab’ atau ‘menanggapi’. ‘Menjawab’ mempertahankan bentuk dialogis yang lazim dalam kitab Ayub.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַשּׁוּחִי
  choice: orang Suah
  rationale: Kata nisbah ini menunjukkan bahwa Bildad berasal dari kaum atau wilayah yang berkaitan dengan Suah. ‘Orang Suah’ alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: וַיֹאמַר
  choice: dan berkata
  rationale: Verba אמר dalam rangkaian naratif ini berarti ‘berkata’. Kedua verba dipertahankan untuk mencerminkan formula Ibrani ‘menjawab dan berkata’.
- source_word: וַ
  choice: Kemudian
  rationale: Waw pada awal ayat meneruskan urutan narasi; ‘Kemudian’ menyampaikan perkembangan adegan secara alami dalam bahasa Indonesia.
