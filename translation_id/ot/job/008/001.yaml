  text: Then Bildad the Shuhite answered and said:[a][b]
translation:
  language: id
  text: Kemudian Bildad, orang Suah, menjawab dan berkata:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menanggapi.”
    reason: lexical_alternative
  - marker: b
    text: “Orang Suah” berarti anggota suatu kaum atau penduduk suatu wilayah yang berkaitan dengan Suah.
