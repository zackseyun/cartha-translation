translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan formula ‘menjawab dan berkata’ dipertahankan karena mencerminkan gaya naratif Ibrani, meskipun agak formal dalam bahasa Indonesia.
