  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: id
  text: Sebab kita ini baru ada sejak kemarin[a] dan tidak tahu, karena hari-hari kita di bumi adalah bayang-bayang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kita hanyalah orang-orang dari kemarin”; maksudnya, manusia baru muncul dan karena itu pengetahuannya terbatas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya dalam argumentasi Bildad; “sebab” mempertahankan hubungan penjelasannya dengan wajar.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: kita baru ada sejak kemarin
  rationale: Ungkapan Ibrani yang eliptis ini secara harfiah menghubungkan “kita” dengan “kemarin” dan menyatakan bahwa manusia baru muncul serta terbatas. Terjemahan ini mempertahankan citra “kemarin” dalam bahasa Indonesia yang alami.
- source_word: וְלֹא נֵדָע
  choice: dan tidak tahu
  rationale: Bentuk verba orang pertama jamak dengan penyangkalan diterjemahkan secara langsung tanpa memperkuatnya menjadi “tidak tahu apa-apa.”
- source_word: כִּי
  choice: karena
  rationale: Pemakaian kedua memberi dasar bagi keterbatasan pengetahuan manusia. “Karena” membuat alur logisnya jelas sambil menghindari pengulangan “sebab” yang terasa kaku.
- source_word: צֵל
  choice: bayang-bayang
  rationale: Nomina ini merupakan metafora bagi kefanaan dan singkatnya kehidupan; “bayang-bayang” mempertahankan gambaran puitis tersebut.
- source_word: יָמֵינוּ
  choice: hari-hari kita
  rationale: Terjemahan langsung bentuk konstruksi dengan akhiran orang pertama jamak.
- source_word: עֲלֵי אָרֶץ
  choice: di bumi
  rationale: Frasa ini menunjuk tempat berlangsungnya kehidupan manusia; “di bumi” alami dan tetap sesuai dengan register puitis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Struktur alasan ganda dipertahankan, sementara citra “kemarin” dan “bayang-bayang” tetap tampak jelas. Ungkapan “tidak tahu” sengaja tidak diperkuat menjadi “tidak tahu apa-apa” agar tidak melampaui bentuk Ibraninya.
