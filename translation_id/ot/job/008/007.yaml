source:
  edition: WLC
  text: וְ/הָיָ֣ה רֵאשִׁיתְ/ךָ֣ מִצְעָ֑ר וְ֝/אַחֲרִיתְ/ךָ֗ יִשְׂגֶּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/007.yaml
  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: id
  text: Sekalipun permulaanmu kecil[a], keadaanmu kelak akan menjadi sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Permulaanmu memang kecil, tetapi masa depanmu akan menjadi sangat besar.”'
    reason: Bentuk penghubung Ibrani dapat diterjemahkan secara lebih harfiah sebagai pernyataan berurutan dengan pertentangan tersirat, bukan sebagai anak kalimat konsesif.
lexical_decisions:
- source_word: וְהָיָה
  choice: Sekalipun ...
  rationale: Konstruksi dengan וְ dan bentuk qatal היה secara harfiah dapat menyatakan “dan ... adalah,” tetapi dalam paralelisme ini bagian pertama berfungsi sebagai keadaan yang berlawanan dengan kebesaran pada masa mendatang. “Sekalipun” mengungkapkan pertentangan itu secara wajar tanpa menambah gagasan baru.
- source_word: רֵאשִׁיתְךָ
  choice: permulaanmu
  rationale: רֵאשִׁית menunjuk pada awal, bagian pertama, atau keadaan mula-mula. “Permulaanmu” mempertahankan ungkapan ringkas teks Ibrani dan mudah dipahami.
- source_word: מִצְעָר
  choice: kecil
  rationale: Kata ini menyatakan sesuatu yang kecil atau tidak berarti. “Kecil” paling langsung dan membentuk kontras yang jelas dengan keadaan yang sangat besar kemudian.
- source_word: אַחֲרִיתְךָ
  choice: keadaanmu kelak
  rationale: אַחֲרִית dapat berarti bagian akhir, hasil akhir, atau masa depan. “Keadaanmu kelak” alami dalam bahasa Indonesia dan menjaga nuansa hasil atau keadaan mendatang tanpa menyiratkan saat kematian.
- source_word: יִשְׂגֶּה
  choice: akan menjadi ... besar
  rationale: Kata kerja ini menyatakan bertumbuh, bertambah, atau menjadi besar. Dalam pasangan dengan “kecil,” ungkapan “akan menjadi ... besar” menyampaikan gerak perbandingannya dengan jelas.
- source_word: מְאֹד
  choice: sangat
  rationale: מְאֹד memberi penegasan kuat. “Sangat” merupakan padanan modern dan alami yang memperkuat kata “besar.”
theological_decisions: []
