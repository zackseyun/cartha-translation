  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: id
  text: Sebab, tanyakanlah kiranya kepada generasi terdahulu, dan perhatikanlah hasil penyelidikan[a] bapak-bapak mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyelidikan”. Kata benda Ibrani ini dapat menunjuk kepada tindakan menyelidiki ataupun kepada hasil yang ditemukan melalui penyelidikan itu.
    reason: lexical_alternative
  - marker: b
    text: “Bapak-bapak mereka” dapat dipahami secara lebih luas sebagai “leluhur mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan nasihat Bildad dengan alasan yang mendukung perkataannya sebelumnya; “Sebab” mempertahankan fungsi penghubung tersebut.
- source_word: שְׁאַל נָא
  choice: tanyakanlah kiranya
  rationale: Bentuk imperatif שׁאל berarti “bertanya/mencari keterangan”, sedangkan נָא melunakkan perintah sebagai permohonan atau desakan halus. “Kiranya” mempertahankan nuansa itu dalam ragam yang bermartabat.
- source_word: לְדֹר רִאשׁוֹן
  choice: kepada angkatan terdahulu
  rationale: דּוֹר berarti “angkatan/generasi”, dan רִאשׁוֹן di sini menunjuk kepada angkatan pada masa lampau, bukan harus angkatan yang pertama secara mutlak.
- source_word: וְכוֹנֵן
  choice: dan perhatikanlah
  rationale: Dalam konteks ini bentuk imperatif dari כון menyatakan pengarahan atau pemusatan diri/perhatian kepada sesuatu. “Perhatikanlah” alami dalam bahasa Indonesia dan sesuai dengan kesejajaran terhadap perintah untuk bertanya.
- source_word: לְחֵקֶר
  choice: hasil penyelidikan
  rationale: חֵקֶר dapat menunjuk baik kepada tindakan penyelidikan maupun kepada hasil yang ditemukan melaluinya. Teks utama memakai arti hasil karena konteksnya mengacu pada hikmat yang diwariskan, sedangkan kemungkinan arti proses dipertahankan dalam catatan kaki.
- source_word: אֲבוֹתָם
  choice: bapak-bapak mereka
  rationale: Bentuk ini secara harfiah berarti “bapak-bapak mereka” dan sufiksnya paling wajar merujuk kembali kepada angkatan terdahulu. Ungkapan itu dapat mencakup leluhur mereka secara lebih luas, sebagaimana dijelaskan dalam catatan kaki.
