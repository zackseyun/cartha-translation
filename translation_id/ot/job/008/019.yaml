  text: הֶן ה֭וּא מְשׂ֣וֹשׂ דַּרְכּ֑/וֹ וּ֝/מֵ/עָפָ֗ר אַחֵ֥ר יִצְמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: id
  text: Sesungguhnya, itulah sukacita jalannya[a], dan dari debu yang lain-lain akan bertunas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dia adalah sukacita jalannya.” Pronomina Ibrani dapat dibaca secara lebih personal, tetapi konteks lebih mendukung rangkuman nasib tumbuhan daripada pernyataan langsung tentang seseorang.
    reason: alternative_reading
  - marker: b
    text: Atau, “yang lain akan bertunas.” Kata Ibrani yang diterjemahkan “yang lain” berbentuk tunggal, tetapi kata kerja “bertunas” berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sesungguhnya
  rationale: Partikel wacana ini menandai pengamatan yang tegas. “Sesungguhnya” mempertahankan penekanan puitis dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: הוּא
  choice: demikianlah
  rationale: Walaupun secara bentuk berarti “dia/itu”, pronomina ini secara deiktis merangkum keadaan atau nasib tumbuhan yang baru digambarkan. “Demikianlah” menyampaikan fungsi rangkuman itu dengan alami tanpa meniadakan kemungkinan pembacaan personal, yang dicatat dalam catatan kaki.
- source_word: מְשׂוֹשׂ
  choice: sukacita
  rationale: Nomina ini berarti sukacita atau kegembiraan. “Sukacita” sesuai dengan ragam puitis dan mempertahankan konstruksi harfiah yang sengaja terasa ironis dalam konteks.
- source_word: דַּרְכּוֹ
  choice: jalannya
  rationale: דֶּרֶךְ dapat berarti jalan, arah perjalanan, atau rangkaian nasib. “Jalannya” mempertahankan gema harfiah sekaligus kiasannya.
- source_word: וּמֵעָפָר
  choice: lalu dari debu
  rationale: Preposisi מִן menunjukkan asal. “Dari debu” mempertahankan citra tanah gembur sekaligus warna sastra Alkitab; “lalu” mengungkapkan kesinambungan ו dalam alur puitis.
- source_word: אַחֵר
  choice: yang lain
  rationale: Kata sifat tunggal ini dipakai secara substantival. Frasa Indonesia “yang lain” dapat tetap tidak menandai jumlah secara eksplisit, sehingga ketegangan antara bentuk tunggal אַחֵר dan verba jamak יִצְמָחוּ tetap terpelihara.
- source_word: יִצְמָחוּ
  choice: akan bertunas
  rationale: Verba צמח menggambarkan tumbuh atau munculnya tanaman. “Bertunas” mempertahankan metafora botanis dan bentuk jamaknya dapat dipahami melalui konteks serta catatan kaki.
theological_decisions:
- issue: 'Rujukan הוּא: personal atau rangkuman keadaan tumbuhan'
  choice: Diterjemahkan secara deiktis sebagai “demikianlah”
  alternative: “dia” atau “itulah”
  rationale: Konteks terdekat merangkum nasib tumbuhan dalam perumpamaan, tetapi pembacaan personal tetap mungkin secara gramatikal dan karena itu dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang sederhana dan bermartabat. Susunan kalimat mempertahankan kepadatan serta ironi teks Ibrani. Semua penanda catatan kaki dicantumkan dalam teks utama.
