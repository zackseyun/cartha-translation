  text: Will they not teach you and tell you[a], and bring forth words from their heart?
translation:
  language: id
  text: Bukankah mereka akan mengajarimu dan berbicara kepadamu, serta mengeluarkan perkataan dari hati mereka[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari pikiran mereka” atau “dari batin mereka”; dalam bahasa Ibrani, “hati” sering menunjuk pusat pemikiran maupun perasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mengungkapkan pertanyaan retoris yang mengharapkan jawaban positif secara alami dalam bahasa Indonesia.
- source_word: הֵם
  choice: mereka
  rationale: Merujuk kembali kepada generasi-generasi terdahulu dalam konteks sebelumnya.
- source_word: יוֹרוּךָ
  choice: mengajarimu
  rationale: Bentuk Hifil dari ירה lazim berarti mengajar atau memberi petunjuk; 'mengajarimu' sesuai dengan konteks hikmat.
- source_word: יֹאמְרוּ לָךְ
  choice: berbicara kepadamu
  rationale: Mempertahankan tindakan berkata sebagai unsur yang berbeda dari tindakan mengajar, dengan ungkapan Indonesia yang wajar.
- source_word: וּמִלִּבָּם
  choice: dari hati mereka
  rationale: Mempertahankan citra antropologis Ibrani; 'hati' dapat menunjuk pusat pemikiran dan batin, bukan hanya perasaan.
- source_word: יוֹצִיאוּ
  choice: mengeluarkan
  rationale: Mempertahankan metafora kausatif יצא tentang perkataan yang keluar dari dalam diri.
- source_word: מִלִּים
  choice: perkataan
  rationale: Padanan alami dalam konteks ucapan hikmat dan serasi dengan verba 'mengeluarkan'.
