  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: id
  text: Orang-orang yang membencimu akan mengenakan malu, dan kemah orang-orang fasik tidak akan ada lagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kemah orang-orang fasik itu tidak ada.”'
    reason: Menunjukkan bentuk formal penyangkalan eksistensial אֵינֶנּוּ dan mempertahankan kemungkinan pembacaan kini.
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: orang-orang yang membencimu
  rationale: Partisipel aktif Qal jamak dengan sufiks orang kedua tunggal maskulin berfungsi sebagai nomina. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan objek personal “-mu”.
- source_word: יִלְבְּשׁוּ
  choice: akan diselubungi
  rationale: Secara harfiah verba לבשׁ berarti “mengenakan” atau “memakai”. Bersama nomina abstrak “aib”, ungkapan “diselubungi aib” mempertahankan metafora pakaian sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בֹשֶׁת
  choice: aib
  rationale: בֹשֶׁת mencakup rasa malu dan kehinaan di hadapan umum. “Aib” secara ringkas menonjolkan unsur kehinaan publik yang sesuai dengan konteks nasib para pembenci.
- source_word: וְאֹהֶל
  choice: dan kemah
  rationale: אֹהֶל secara konkret berarti “kemah”. Walaupun dapat merujuk secara metonimis pada rumah tangga atau kediaman, citra konkret teks dipertahankan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak ini menunjuk suatu golongan. “Orang-orang fasik” merupakan padanan Indonesia yang jelas dan mempertahankan penilaian moral dalam sumber.
- source_word: אֵינֶנּוּ
  choice: tidak akan ada lagi
  rationale: Bentuk ini secara formal merupakan penyangkalan eksistensial, “ia/itu tidak ada”. Dalam alur perkataan yang berorientasi pada hasil mendatang, bentuk futur “tidak akan ada lagi” menyampaikan daya wacananya secara alami.
theological_decisions:
- issue: Daya temporal klausa terakhir
  choice: 'hasil pada masa mendatang: “kemah orang-orang fasik tidak akan ada lagi”'
  alternative: 'keadaan kini: “kemah orang-orang fasik itu tidak ada”'
  rationale: Ayat 20–22 membicarakan pemulihan dan hasil yang akan dialami para lawan. Bentuk futur/resultatif mengikuti alur tersebut tanpa menutupi bahwa frasa Ibraninya secara formal berupa penyangkalan eksistensial nonfutur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secukupnya. Metafora pakaian pada “diselubungi aib” serta citra “kemah” dipertahankan. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
