  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל שֹׁ֣כְחֵי אֵ֑ל וְ/תִקְוַ֖ת חָנֵ֣ף תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: id
  text: Demikianlah jalan semua orang yang melupakan Allah; harapan orang fasik[a] akan sirna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang tidak saleh”; secara tradisional juga diterjemahkan “orang munafik.” Kata Ibrani ini menunjuk pada orang yang fasik atau tidak menghormati Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Menandai perbandingan sekaligus kesimpulan dari gambaran pada ayat-ayat sebelumnya dengan ungkapan Indonesia yang alami dan ringkas.
- source_word: אָרְחוֹת
  choice: jalan
  rationale: Mempertahankan metafora tentang arah atau perjalanan hidup. Bahasa Indonesia lazim memakai bentuk tunggal kolektif setelah frasa 'semua orang'.
- source_word: שֹׁכְחֵי אֵל
  choice: semua orang yang melupakan Allah
  rationale: Bentuk partisip Ibrani dialihkan menjadi klausa relatif yang wajar. אֵל di sini merupakan sebutan umum bagi Allah, bukan nama diri yang perlu ditransliterasikan.
- source_word: תִקְוַת
  choice: harapan
  rationale: Menyampaikan arti harapan atau pengharapan secara langsung dan sesuai dengan konteks sastra hikmat.
- source_word: חָנֵף
  choice: orang fasik
  rationale: Dalam kitab Ayub, istilah ini menunjuk pada orang yang tidak saleh atau tidak menghormati Allah, bukan hanya seseorang yang berpura-pura secara moral. 'Orang fasik' mempertahankan bobot moral-religiusnya.
- source_word: תֹּאבֵד
  choice: akan sirna
  rationale: Mengungkapkan hilang atau berakhirnya harapan secara alami dalam bahasa Indonesia, sambil mempertahankan kepastian akibat yang dinyatakan verba Ibrani.
theological_decisions:
- issue: Makna חָנֵף dalam konteks penghakiman sastra hikmat
  choice: orang fasik
  alternative: orang munafik
  rationale: '''Orang munafik'' dapat mempersempit makna menjadi kepura-puraan atau ketidaktulusan. ''Orang fasik'' lebih tepat mencakup sikap tidak saleh dan tidak hormat kepada Allah yang dimaksud dalam konteks ini.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora 'jalan' dipertahankan, sedangkan 'akan sirna' dipilih agar kolokasi dengan 'harapan' terdengar alami. Penanda catatan kaki ditempatkan pada 'orang fasik', yaitu unsur yang benar-benar dijelaskan oleh catatan.
