  source_fidelity: 'Teks Indonesia menyampaikan struktur dan makna Ibrani dengan setia: כֵּן sebagai simpulan/perbandingan (“Demikianlah”), אָרְחוֹת sebagai metafora “jalan,” שֹׁכְחֵי אֵל sebagai “semua orang yang melupakan Allah,” serta תִּקְוַת חָנֵף תֹּאבֵד sebagai lenyapnya harapan orang fasik. Bentuk tunggal kolektif “jalan” wajar dalam bahasa Indonesia meskipun nomina Ibrani berbentuk jamak.'
