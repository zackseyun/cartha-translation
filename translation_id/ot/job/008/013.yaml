  terminology: “Allah” tepat untuk אֵל dalam konteks ini. “Orang fasik” secara memadai mewakili חָנֵף dalam konteks Ayub sebagai orang yang tidak saleh/impius, tanpa membatasi makna pada kemunafikan psikologis. Catatan kaki mempertahankan alternatif tradisional “orang munafik” dan menjelaskan cakupan istilah tersebut. Penanda catatan kaki ditempatkan tepat pada istilah yang dibahas.
