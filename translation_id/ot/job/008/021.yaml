source:
  edition: WLC
  text: עַד יְמַלֵּ֣ה שְׂח֣וֹק פִּ֑י/ךָ וּ/שְׂפָתֶ֥י/ךָ תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: id
  text: Ia masih akan memenuhi mulutmu dengan tawa[a] dan bibirmu dengan sorak-sorai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai Ia memenuhi mulutmu dengan tawa dan bibirmu dengan sorak-sorai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: masih akan
  rationale: Dalam konteks janji Bildad, ungkapan ini menunjuk pada tindakan yang masih akan Allah lakukan. Padanan ini alami dalam bahasa Indonesia, sementara kemungkinan arti temporal ‘sampai’ dipertahankan dalam catatan kaki.
- source_word: יְמַלֵּה
  choice: akan memenuhi
  rationale: Bentuk Piel imperfek orang ketiga maskulin tunggal menyatakan tindakan mendatang dengan daya janji; subjek tersiratnya adalah Allah dari ayat sebelumnya.
- source_word: שְׂחוֹק
  choice: tawa
  rationale: Kata benda ini secara langsung berarti tawa; konteks pemulihan tidak mendukung nuansa tawa mengejek.
- source_word: פִּיךָ
  choice: mulutmu
  rationale: Terjemahan langsung ini mempertahankan gambaran puitis tentang mulut yang dipenuhi tawa.
- source_word: וּשְׂפָתֶיךָ
  choice: dan bibirmu
  rationale: Terjemahan harfiah mempertahankan kesejajaran anggota tubuh dengan ‘mulutmu’.
- source_word: תְרוּעָה
  choice: sorak-sorai
  rationale: Kata ini dapat berarti seruan keras, sering kali dalam kegembiraan atau kemenangan. Dalam konteks pemulihan, ‘sorak-sorai’ alami dan mempertahankan gambaran ucapan sukacita tanpa memasukkan nuansa militer atau liturgis tertentu.
theological_decisions:
- issue: Subjek tersirat dari kata kerja
  choice: ‘Ia’, yang mengacu kepada Allah dalam konteks langsung
  alternative: Bentuk pasif tanpa menyebut pelaku, misalnya ‘mulutmu akan dipenuhi’
  rationale: Ayat 20 menyebut Allah sebagai pelaku, dan ayat 21 secara alami melanjutkan pernyataan itu. Penyebutan ‘Ia’ mempertahankan bentuk verba Ibrani dan menunjukkan bahwa pemulihan tersebut berasal dari Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Ungkapan ‘mulutmu’ dan ‘bibirmu’ dipertahankan untuk menjaga paralelisme Ibrani; ‘masih akan’ membuat janji mendatang terdengar alami sambil mempertahankan alternatif ‘sampai’ dalam catatan kaki.
