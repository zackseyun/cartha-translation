base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: id
  text: 'Namun, jika engkau sungguh-sungguh mencari Allah[a]

    dan memohon kemurahan kepada Yang Mahakuasa[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari Allah pada pagi hari”; kata kerja Ibrani ini dapat menunjuk pada tindakan mencari pada pagi hari, meskipun di sini kemungkinan besar berarti mencari dengan sungguh-sungguh atau tekun.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Shaddai”; secara tradisional diterjemahkan “Yang Mahakuasa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Namun, jika
  rationale: Partikel ini memperkenalkan syarat. Kata “Namun” menyatakan kontras wacana dengan ayat sebelumnya, sedangkan “jika” mempertahankan sifat kondisionalnya.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua maskulin tunggal dinyatakan secara eksplisit dalam bahasa Ibrani. “Engkau” sesuai dengan ragam puitis yang bermartabat dan tetap mudah dipahami.
- source_word: תְּשַׁחֵר
  choice: sungguh-sungguh mencari
  rationale: Bentuk piel dari שׁחר dapat berarti mencari sejak dini atau mencari dengan tekun dan sungguh-sungguh. Dalam konteks permohonan kepada Allah, makna kesungguhan paling alami, sementara kemungkinan makna waktu dipertahankan dalam catatan kaki.
- source_word: אֶל אֵל
  choice: mencari Allah
  rationale: Preposisi אֶל menunjukkan arah kepada Allah, tetapi dalam bahasa Indonesia sudah tercakup secara alami oleh konstruksi transitif “mencari Allah”.
- source_word: וְ/אֶל
  choice: dan ... kepada
  rationale: Konjungsi menghubungkan dua klausa sejajar, sedangkan preposisi arah diterjemahkan secara alami sebagai “kepada” bersama verba permohonan.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi ini diterjemahkan dengan padanan tradisional dan wajar dalam bahasa Indonesia; bentuk Ibraninya dicantumkan dalam catatan kaki.
- source_word: תִּתְחַנָּן
  choice: memohon kemurahan
  rationale: Bentuk hitpael dari חנן menyatakan tindakan memohon belas kasih, kasih karunia, atau kemurahan. “Memohon kemurahan” mempertahankan nuansa mencari perkenanan tanpa terdengar kaku.
theological_decisions:
- issue: Penerjemahan gelar ilahi שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Shaddai
  rationale: Menerjemahkan gelar ini menyampaikan fungsinya kepada pembaca Indonesia, sementara transliterasi “Shaddai” tetap dicatat sebagai bentuk Ibraninya tanpa menetapkan etimologi yang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan larik puitis yang ringkas. Pronomina “engkau” dipilih agar selaras dengan tuturan langsung yang khidmat dalam puisi hikmat. Kesejajaran kedua klausa Ibrani dipertahankan.
