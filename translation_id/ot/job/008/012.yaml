translation:
  language: id
  text: Selagi masih berupa tunas[a] dan belum dipotong[b], tumbuhan itu mengering lebih dahulu daripada rumput lainnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masih hijau” atau “masih berupa pucuk muda.” Kata Ibrani ini menunjuk pada pertumbuhan tanaman yang masih segar.
    reason: lexical_alternative
  - marker: b
    text: Atau “dipetik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: selagi masih
  rationale: Adverbia dengan sufiks orang ketiga maskulin tunggal menyatakan keadaan yang masih berlangsung. Ungkapan “selagi masih” membentuk anak kalimat waktu yang alami dalam bahasa Indonesia.
- source_word: בְאִבּוֹ
  choice: bertunas
  rationale: Kata אֵב/אִב menunjuk pada pertumbuhan tanaman yang segar, seperti tunas atau pucuk muda. “Bertunas” mempertahankan gambaran botanis secara ringkas dan alami; kemungkinan arti “masih hijau” dicatat dalam catatan kaki.
- source_word: לֹא יִקָּטֵף
  choice: belum dipotong
  rationale: Bentuk Nifal imperfek dari קטף menyatakan bahwa tanaman itu belum dipotong atau dipetik. Dalam konteks tumbuhan rawa, “dipotong” terdengar wajar dan mempertahankan makna pasif.
- source_word: וְלִפְנֵי
  choice: lebih dahulu daripada
  rationale: Gabungan konjungsi dan preposisi ini menyatakan perbandingan waktu. “Lebih dahulu daripada” membuat hubungan komparatifnya jelas dalam bahasa Indonesia tanpa perlu menerjemahkan waw secara mekanis.
- source_word: כָל חָצִיר
  choice: rumput lainnya
  rationale: Dalam perbandingan ini, frasa tersebut berarti bahwa tumbuhan yang dibicarakan mengering sebelum jenis rumput lain. “Rumput lainnya” menyampaikan perbandingan itu secara alami tanpa memberi kesan bahwa setiap helai rumput di dunia dimaksudkan secara mutlak.
- source_word: יִיבָשׁ
  choice: mengering
  rationale: Kata יבש berarti menjadi kering atau mengering. Pilihan ini sesuai dengan gambaran tumbuhan yang bergantung pada air dan tidak menambahkan gagasan lain di luar teks.
