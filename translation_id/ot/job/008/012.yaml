translation_notes:
  register: Bahasa Indonesia baku-modern dengan susunan kalimat yang ringkas dan puitis. Subjek “tumbuhan itu” dinyatakan pada klausa utama agar rujukannya jelas dalam bahasa Indonesia, sementara citra tumbuhan muda yang cepat mengering tetap dipertahankan.
