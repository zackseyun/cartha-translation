  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: id
  text: Itu pun adalah pelanggaran yang harus diadili[a], sebab aku telah menyangkal Allah di atas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelanggaran yang dapat dihukum oleh para hakim,” “pelanggaran hukum,” atau “pelanggaran yang tunduk pada pengadilan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab aku telah tidak setia kepada Allah di atas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Itu pun
  rationale: Merujuk kembali pada tindakan dalam ayat sebelumnya dan menambahkannya pada rangkaian pelanggaran yang disangkal Ayub.
- source_word: עָוֺן
  choice: pelanggaran
  rationale: Menyampaikan bobot moral sekaligus yuridis istilah Ibrani dalam konteks pernyataan pembelaan di hadapan hukum.
- source_word: פְּלִילִי
  choice: yang patut diadili
  rationale: Mengungkapkan kaitannya dengan putusan atau proses peradilan secara alami dalam bahasa Indonesia tanpa menentukan secara berlebihan apakah hukumannya dijatuhkan oleh hakim manusia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan mengapa tindakan tersebut merupakan pelanggaran yang patut diadili.
- source_word: כִחַשְׁתִּי
  choice: aku telah menyangkal
  rationale: Dalam konteks penyembahan benda langit, verba ini menunjuk pada penyangkalan atau ketidaksetiaan kepada Allah, bukan sekadar mengucapkan kebohongan.
- source_word: לָאֵל
  choice: Allah
  rationale: Preposisi Ibrani mengikuti verba, sedangkan bahasa Indonesia secara alami memakai verba transitif 'menyangkal Allah'.
- source_word: מִמָּעַל
  choice: yang di atas
  rationale: Mempertahankan ungkapan vertikal yang ringkas serta kontras dengan benda-benda langit dalam konteks, tanpa menambahkan kata 'surga' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Apakah מִמָּעַל perlu diperluas menjadi 'di surga' atau diperlakukan sebagai gelar ilahi
  choice: Allah yang di atas
  alternative: Allah di tempat tinggi; Allah yang di surga
  rationale: Bahasa Ibraninya singkat dan hanya menyatakan posisi 'di atas'. Terjemahan utama mempertahankan ungkapan itu tanpa mengubahnya menjadi gelar atau menambahkan konsep yang tidak tersurat.
- issue: Nuansa כִחַשְׁתִּי dalam konteks penyembahan berhala
  choice: aku telah menyangkal
  alternative: aku telah berlaku tidak setia terhadap
  rationale: '''Menyangkal'' menangkap tindakan berbalik dari Allah kepada objek penyembahan lain, sedangkan alternatif mempertahankan kemungkinan nuansa ketidaksetiaan relasional.'
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan klausa mempertahankan corak pengakuan hukum dalam Ayub 31, sedangkan penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
