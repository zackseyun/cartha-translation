  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: id
  text: Sebab, itu adalah api yang membakar sampai kepada kebinasaan[a] dan akan mencabut sampai ke akar segala hasilku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai ke Abadon.” Kata Ibrani אֲבַדּוֹן dapat berarti “kebinasaan” atau, dalam konteks tertentu, menunjuk alam kebinasaan atau personifikasinya.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi peringatan dalam sumpah Ayub dan mempertahankan daya penjelas penghubung Ibrani.
- source_word: אֵשׁ הִיא
  choice: itu adalah api
  rationale: Mempertahankan metafora predikatif secara jelas dan wajar dalam bahasa Indonesia.
- source_word: עַד אֲבַדּוֹן
  choice: sampai kepada kebinasaan
  rationale: Menyatakan jangkauan akibat api hingga kebinasaan; arti nomina umum paling sesuai dalam konteks ini, sementara kemungkinan nama Abadon dicatat dalam catatan kaki.
- source_word: תֹּאכֵל
  choice: membakar
  rationale: Secara harfiah verba ini berarti 'memakan/menghanguskan'; 'membakar' alami dengan subjek api dan menyampaikan daya penghancurnya tanpa ungkapan janggal.
- source_word: וּבְכָל תְּבוּאָתִי
  choice: dan segala hasilku
  rationale: Menyampaikan cakupan menyeluruh terhadap hasil atau perolehan Ayub; 'hasil' cukup luas untuk mencakup hasil tanah maupun pertambahan miliknya.
- source_word: תְשָׁרֵשׁ
  choice: akan mencabut sampai ke akar
  rationale: Piel dari שׁרשׁ menyatakan pencabutan atau penghancuran dari akar. Ungkapan ini mempertahankan citra agraris sekaligus menegaskan kehancuran total; bentuk mendatang cocok dengan konteks akibat dalam sumpah.
theological_decisions:
- issue: Makna אֲבַדּוֹן
  choice: nomina umum 'kebinasaan'
  alternative: nama diri atau sebutan alam kebinasaan, 'Abadon'
  rationale: Dalam konteks hikmat ini, frasa tersebut paling alami menggambarkan batas atau tingkat kehancuran yang ditimbulkan dosa, bukan secara pasti menunjuk tokoh tertentu. Ambiguitas leksikal tetap dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa 'mencabut sampai ke akar' mempertahankan gambaran pertanian dalam bahasa yang mudah dipahami; tanda baca memisahkan dua akibat yang sejajar.
