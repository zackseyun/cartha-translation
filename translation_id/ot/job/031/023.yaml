base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: id
  text: Sebab malapetaka dari Allah menjadi kengerian bagiku[a], dan karena keagungan-Nya aku tidak sanggup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “malapetaka Allah adalah kengerian bagiku.” Frasa Ibraninya dapat menunjuk pada malapetaka yang berasal dari Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “karena keluhuran-Nya aku tidak berdaya.” Kata Ibrani yang diterjemahkan “keagungan” dapat berarti keluhuran atau ketinggian, sedangkan kata kerjanya secara harfiah berarti “mampu”; pelengkapnya tidak dinyatakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pengendalian diri Ayub dalam konteks sebelumnya.
- source_word: פַחַד אֵלַי
  choice: menggentarkan aku
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa sesuatu menjadi kengerian bagi Ayub; bentuk verbal ini menyampaikan intensitasnya secara alami dalam bahasa Indonesia.
- source_word: אֵיד אֵל
  choice: malapetaka dari Allah
  rationale: Frasa konstruksi ini paling mungkin menunjuk pada malapetaka yang datang dari Allah, sementara alternatif yang lebih harfiah, 'malapetaka Allah', dicatat dalam catatan kaki.
- source_word: וּמִשְּׂאֵתוֹ
  choice: dan di hadapan keagungan-Nya
  rationale: שְׂאֵת dapat berarti keluhuran, ketinggian, atau keagungan. 'Di hadapan' secara alami menghubungkan keagungan Allah dengan ketidakmampuan Ayub untuk bertahan tanpa membatasi maknanya pada sebab semata.
- source_word: לֹא אוּכָל
  choice: aku tidak sanggup bertahan
  rationale: יכל pada dasarnya menyatakan kemampuan. 'Tidak sanggup bertahan' mengungkapkan ketidakmampuan Ayub menghadapi keagungan Allah, sambil mengakui dalam catatan bahwa objek atau pelengkap verba tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Pemaknaan אֵל dalam frasa אֵיד אֵל
  choice: Allah
  alternative: Yang Mahakuasa; El
  rationale: Dalam konteks ini אֵל menunjuk kepada Allah sebagai sumber malapetaka dan tidak harus dipertahankan sebagai bentuk nama Ibrani.
- issue: Dasar pengendalian diri Ayub
  choice: Ayub digentarkan oleh malapetaka dari Allah dan tidak sanggup bertahan di hadapan keagungan-Nya
  alternative: Ayub hanya takut akan hukuman; Ayub semata-mata merenungkan keluhuran Allah secara abstrak
  rationale: Terjemahan mempertahankan kedua unsur dalam ayat—kengerian akan malapetaka ilahi dan ketidakmampuan di hadapan keagungan Allah—tanpa mereduksinya menjadi satu motif saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Malapetaka' mempertahankan bobot אֵיד, sedangkan 'menggentarkan aku' lebih wajar daripada konstruksi nominal yang sangat harfiah. Kapitalisasi pronomina ilahi mengikuti konvensi penerbitan Alkitab Indonesia.
