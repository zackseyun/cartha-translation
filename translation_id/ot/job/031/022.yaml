  naturalness: “Biarlah” sesuai dengan register sumpah-kutuk Ayub. “Bahu terlepas dari sendinya” adalah bahasa Indonesia modern yang alami. “Lengan patah dari tulangnya” sengaja agak konkret dan puitis, tetapi tetap dapat dipahami dalam paralelisme kutukan; catatan kaki menjelaskan ketidakpastian anatominya.
  terminology: “Bahu” dan “lengan” tepat. “Sendi” pada teks utama merupakan penyampaian idiomatis yang wajar atas cedera pemisahan, tanpa mengklaim kepastian leksikal; alternatif bahu/punggung atas perlu dicatat. Untuk קָנֶה, “tulangnya” mempertahankan pilihan audit Inggris dan tidak menggantinya dengan “pangkal,” yang tidak didukung secara langsung.
