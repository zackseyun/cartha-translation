  text: maka biarlah bahuku terlepas dari sendinya[a], dan biarlah lenganku patah dari tulangnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari bahu” atau “dari punggung bagian atas.” Secara harfiah kata Ibrani ini menunjuk daerah bahu/punggung atas; dalam gambaran cedera ini kemungkinan maksudnya bahu terlepas dari tempat persendiannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari sendinya.” Kata Ibrani yang dipakai di sini jarang ditemukan; dalam konteks ini kemungkinan menunjuk tulang atau struktur persendian lengan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: bahuku
  rationale: כָּתֵף lazim berarti bahu; dalam kutukan mengenai cedera tubuh, 'bahuku' merupakan padanan alami dan sejajar dengan 'lenganku'.
- source_word: מִשִּׁכְמָה
  choice: dari tempatnya
  rationale: שִׁכְמָה menunjuk daerah bahu atau tempat bahu bertumpu. Ungkapan ini mempertahankan gambaran terlepasnya bahu tanpa memaksakan istilah anatomi modern yang tidak eksplisit dalam bahasa Ibrani.
- source_word: תִפּוֹל
  choice: terlepas
  rationale: Secara harfiah verba ini berarti 'jatuh', tetapi dalam konstruksi cedera anggota tubuh, 'terlepas' menyampaikan akibat konkret secara wajar dalam bahasa Indonesia.
- source_word: וְאֶזְרֹעִי
  choice: dan lenganku
  rationale: זְרוֹעַ secara umum berarti lengan; konteks tidak menuntut bagian lengan yang lebih khusus.
- source_word: מִקָּנָה
  choice: pada pangkalnya
  rationale: קָנֶה adalah istilah langka dalam konteks anatomi ini dan mungkin menunjuk tulang atau struktur persendian lengan. 'Pada pangkalnya' menghasilkan gambaran cedera yang alami sambil tidak menetapkan secara berlebihan apakah yang dimaksud tulang atau sendi.
- source_word: תִשָּׁבֵר
  choice: patah
  rationale: Bentuk Nifal dari שׁבר menyatakan keadaan pasif 'dipatahkan/patah'; 'patah' adalah ungkapan Indonesia yang paling alami untuk lengan.
