    rationale: “Pada” menjadikan pangkal sebagai lokasi patah, sedangkan teks Ibrani memakai “dari” dan istilah langka yang kemungkinan menunjuk tulang atau struktur sendi. “Dari tulangnya” lebih dekat pada citra sumber dan audit Inggris.
