  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: id
  text: Jika aku bersukacita atas kehancuran[a] orang yang membenciku[b], dan bersukaria[c] ketika kemalangan menimpanya[d]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bencana” atau “malapetaka.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang yang membenci aku”; secara tradisional, “musuhku.”
    reason: lexical_alternative
  - marker: c
    text: Atau “bersorak kegirangan”; dalam konteks ini dapat menyiratkan kegembiraan yang tidak patut atas kemalangan orang lain.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “ketika yang buruk mendapatinya”; dalam konteks ini dapat berarti “ketika malapetaka” atau “bahaya menimpanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan klausa pengandaian dalam sumpah pembelaan diri Ayub; akibat dari pengandaian ini dilanjutkan dalam konteks berikutnya.
- source_word: אֶשְׂמַח
  choice: aku bersukacita
  rationale: Menyampaikan makna kegembiraan dengan bobot etis yang sesuai dalam penyangkalan Ayub.
- source_word: בְּפִיד
  choice: atas kebinasaan
  rationale: פִיד menunjuk pada bencana, kehancuran, atau keruntuhan yang menimpa seseorang. 'Kebinasaan' ringkas dan mempertahankan kesan akibat yang menghancurkan.
- source_word: מְשַׂנְאִי
  choice: orang yang membenci aku
  rationale: Mempertahankan daya verbal bentuk partisipelnya, bukan langsung menafsirkannya dengan istilah umum 'musuhku'.
- source_word: וְהִתְעֹרַרְתִּי
  choice: dan bersukaria
  rationale: Dalam kesejajaran dengan 'bersukacita', bentuk ini menyatakan bangkitnya kegembiraan yang meluap. 'Bersukaria' mempertahankan intensitas tanpa mempersempit maknanya menjadi tindakan 'menertawakan' atau 'bergembira di atas penderitaan' secara eksplisit.
- source_word: כִּי
  choice: ketika
  rationale: Menandai keadaan atau waktu saat sukaria itu mungkin terjadi; bacaan temporal paling alami dalam konteks.
- source_word: מְצָאוֹ רָע
  choice: kemalangan menimpanya
  rationale: Secara harfiah רָע 'mendapati' dia, tetapi dalam konteks ungkapan ini berarti bahaya, kesusahan, atau kemalangan menimpa seseorang. Pilihan ini alami dalam bahasa Indonesia dan tidak membuat רָע terdengar terutama sebagai kejahatan moral.
theological_decisions:
- issue: Nuansa etis penyangkalan Ayub mengenai kebinasaan orang yang membencinya
  choice: Menyatakan bahwa Ayub menyangkal pernah bersukacita atau bersukaria atas kebinasaan orang yang membencinya, tanpa memperkuat kata kerjanya menjadi 'bergembira di atas penderitaannya' dalam teks utama.
  alternative: Jika aku bersukacita atas bencana musuhku dan bergembira di atas penderitaannya ketika malapetaka menimpanya—
  rationale: Teks Ibrani jelas menyangkut kesenangan yang tidak patut atas kemalangan lawan, tetapi kata kerjanya tidak perlu dipersempit menjadi ungkapan yang secara eksplisit menambahkan sikap mengejek. Ketegangan etis dipertahankan dengan diksi yang kuat tetapi tidak berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengandaian dipertahankan terbuka dengan tanda pisah karena sumpah pembelaan diri Ayub berlanjut ke ayat berikutnya. Ungkapan 'orang yang membenci aku' sengaja dipertahankan agar lebih dekat dengan bentuk Ibrani daripada 'musuhku'.
