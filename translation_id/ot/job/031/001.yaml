translation:
  language: id
  text: Aku telah mengikat perjanjian dengan mataku; jadi, bagaimana mungkin aku menatap seorang perawan[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lalu, mengapa aku memandang seorang perawan?”'
    reason: Kata tanya וּמָה dan verba אֶתְבּוֹנֵן memungkinkan nuansa alternatif ‘mengapa aku memandang’, bukan hanya ‘bagaimana mungkin aku menatap’.
lexical_decisions:
- source_word: בְּרִית כָּרַתִּי
  choice: telah mengikat perjanjian
  rationale: Ungkapan Ibrani harfiah berarti ‘memotong perjanjian’, yaitu membuat komitmen yang resmi dan mengikat. ‘Mengikat perjanjian’ terdengar wajar dalam bahasa Indonesia serta mempertahankan bobot ungkapan tersebut.
- source_word: לְעֵינָי
  choice: dengan mataku
  rationale: Preposisi לְ dalam ungkapan ini paling alami dipahami sebagai hubungan dengan mata yang dikenai komitmen pribadi Ayub, bukan sekadar tujuan atau manfaat.
- source_word: וּמָה
  choice: jadi, bagaimana mungkin aku
  rationale: Gabungan konjungsi dan kata tanya memperkenalkan konsekuensi retoris dari perjanjian pada klausa pertama. Pilihan ini mempertahankan hubungan inferensial tanpa menutup kemungkinan terjemahan ‘mengapa’.
- source_word: אֶתְבּוֹנֵן
  choice: menatap
  rationale: Bentuk verba ini menunjuk pada tindakan memperhatikan atau memandang dengan saksama, bukan sekadar melihat sepintas. ‘Menatap’ menyampaikan pandangan yang disengaja dan berkelanjutan.
- source_word: עַל
  choice: seorang
  rationale: Dalam terjemahan frasa verba, עַל tercakup secara alami dalam konstruksi transitif ‘menatap seorang ...’; bahasa Indonesia tidak memerlukan padanan preposisi tersendiri.
- source_word: בְּתוּלָה
  choice: perawan
  rationale: Kata ini lazim menunjuk pada perempuan yang belum pernah berhubungan seksual. ‘Perawan’ lebih tepat daripada istilah yang hanya berarti perempuan muda, sekaligus tetap mudah dipahami pembaca modern.
theological_decisions:
- issue: Sifat pandangan yang ditolak Ayub
  choice: Tidak menambahkan kata ‘dengan berahi’ atau ‘penuh nafsu’ ke dalam teks utama.
  alternative: Menerjemahkan secara eksplisit sebagai ‘menatap dengan berahi’.
  rationale: Konteks moral dapat menyiratkan hasrat seksual, tetapi teks Ibrani sendiri hanya menyebut tindakan memandang atau memperhatikan seorang perawan. Terjemahan mempertahankan implikasi tanpa menjadikannya eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk orang pertama mempertahankan nada pembelaan diri Ayub. Tanda titik koma memperjelas hubungan erat antara komitmen pada klausa pertama dan pertanyaan retoris pada klausa kedua.
