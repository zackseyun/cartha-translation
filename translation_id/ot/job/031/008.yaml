  text: אֶ֭זְרְעָה וְ/אַחֵ֣ר יֹאכֵ֑ל וְֽ/צֶאֱצָאַ֥/י יְשֹׁרָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/008.yaml
  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: id
  text: maka biarlah aku menabur dan orang lain memakannya, dan biarlah keturunanku dicabut sampai ke akar-akarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hasil tanamanku dicabut sampai ke akar-akarnya.” Kata Ibrani yang diterjemahkan “keturunanku” dapat merujuk pada sesuatu yang keluar atau tumbuh, baik keturunan maupun hasil tanaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: biarlah aku menabur
  rationale: Bentuk kohortatif orang pertama tunggal dalam konteks sumpah kutuk diri paling wajar diterjemahkan secara volitif dengan “biarlah,” bukan sebagai masa depan biasa.
- source_word: וְאַחֵר
  choice: dan orang lain
  rationale: אַחֵר berarti “yang lain/orang lain”; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras antara Ayub yang menabur dan pihak lain yang menikmati hasilnya.
- source_word: יֹאכֵל
  choice: memakannya
  rationale: Kata kerja אכל secara harfiah berarti “makan.” Akhiran “-nya” secara alami menunjuk pada hasil yang ditabur tanpa menghilangkan gambaran pertanian.
- source_word: וְצֶאֱצָאַי
  choice: keturunanku
  rationale: צֶאֱצָא dapat menunjuk pada keturunan maupun sesuatu yang tumbuh atau dihasilkan. “Keturunanku” mempertahankan kemungkinan utama yang bersifat familial, sementara catatan kaki menyajikan alternatif agraris.
- source_word: יְשֹׁרָשׁוּ
  choice: dicabut sampai ke akar-akarnya
  rationale: Bentuk Piel dari שׁרשׁ di sini menyatakan pencabutan atau pemusnahan dari akar. Ungkapan ini alami dan jelas dalam bahasa Indonesia sekaligus mempertahankan citra akar dalam bahasa Ibrani.
theological_decisions:
- issue: 'Objek kutuk pada klausa kedua: keturunan atau hasil tanaman'
  choice: keturunanku
  alternative: hasil tanamanku
  rationale: Nomina צֶאֱצָא memang ambigu dan dapat merujuk pada apa yang keluar atau tumbuh, termasuk keturunan ataupun hasil bumi. Teks utama memakai makna familial yang paling lazim, tetapi ambiguitas aslinya dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel “biarlah ... dan biarlah ...” mempertahankan daya sumpah kutuk diri, sedangkan ungkapan konkret “menabur,” “memakannya,” dan “dicabut sampai ke akar-akarnya” menjaga citra pertanian teks Ibrani.
