base_translation:
  language: en
  yaml_path: translation/ot/job/031/020.yaml
  text: if his loins have not blessed me[b][a], and if he was not warmed by the fleece of my sheep—
translation:
  language: id
  text: jika pinggangnya tidak memberkati aku[b], dan jika ia tidak menjadi hangat oleh bulu domba-dombaku[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh wol dari domba-dombaku.” Kata benda Ibrani ini dapat berarti bulu domba atau wol hasil cukuran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “pinggangnya,” suatu ungkapan jasmani yang merujuk pada tubuh orang berkekurangan yang telah diberi pakaian dan dihangatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: jika ... tidak
  rationale: Dalam rangkaian sumpah Ayub, ungkapan ini memperkenalkan syarat bagi kutuk atas diri sendiri. Terjemahan ini mempertahankan bentuk bersyaratnya dan tidak mengubahnya menjadi pernyataan biasa.
- source_word: בֵרֲכוּנִי
  choice: memberkati aku
  rationale: Bentuk Piel dari ברך lazim berarti ‘memberkati’. Dalam konteks ini ungkapan tersebut menyiratkan rasa syukur orang yang ditolong, tetapi terjemahan harfiah mempertahankan citra dan nuansa teologis bahasa Ibrani.
- source_word: חֲלָצָיו
  choice: pinggangnya
  rationale: Kata ini secara harfiah menunjuk bagian pinggang tubuh. Di sini pinggang mewakili tubuh orang berkekurangan yang dikenai pakaian dan dihangatkan; ‘pinggangnya’ mempertahankan metonimia teks sumber.
- source_word: וּמִגֵּז
  choice: dengan bulu
  rationale: גֵּז dapat menunjuk bulu domba atau bulu yang telah dicukur. Preposisi מִן dalam konteks ini menyatakan sarana atau bahan yang membuat orang itu hangat, sehingga ‘dengan bulu’ alami dalam bahasa Indonesia.
- source_word: כְּבָשַׂי
  choice: domba-dombaku
  rationale: כֶּבֶשׂ dapat berarti domba atau anak domba. Karena konteksnya adalah penyediaan bulu, ‘domba-dombaku’ paling wajar dan tidak membatasi usia hewan.
- source_word: יִתְחַמָּם
  choice: ia tidak menghangatkan diri
  rationale: Bentuk Hitpael menyatakan menjadi hangat atau menghangatkan diri. Subjek tunggal dijelaskan dengan ‘ia’, sedangkan unsur negatif dipahami berlanjut dalam struktur sumpah dari אִם לֹא.
theological_decisions:
- issue: Cakupan penyangkalan pada klausa kedua
  choice: mengulang ‘jika ... tidak’ pada klausa kedua
  alternative: 'menerjemahkan klausa kedua secara positif: ‘dan ia menghangatkan diri’'
  rationale: Bahasa Ibrani tidak mengulang לֹא pada klausa kedua, tetapi kedua tindakan membentuk satu syarat negatif dalam sumpah Ayub. Pengulangan dalam bahasa Indonesia memperjelas cakupan yang secara sintaksis tersirat tanpa mengubah maksud sumpah.
translation_notes:
  register: Bahasa Indonesia modern dan bermartabat. Ungkapan ‘pinggangnya ... memberkati aku’ sengaja dipertahankan karena merupakan personifikasi/metonimia kuat dalam teks Ibrani; catatan kaki menjelaskan maksudnya. Tanda pisah mempertahankan kalimat sumpah yang berlanjut ke ayat berikutnya.
