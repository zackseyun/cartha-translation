  text: If I have rejected the case of my male servant or my female servant when they brought a complaint against me[b][a],
translation:
  language: id
  text: Jika aku pernah menolak perkara budak laki-lakiku atau budak perempuanku[a] ketika mereka mengajukan pengaduan terhadapku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hamba laki-lakiku atau hamba perempuanku.” Kedua istilah Ibrani dapat menunjuk budak atau hamba, bergantung pada konteks sosialnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hak hukum budak laki-lakiku atau budak perempuanku ketika mereka berselisih dengan aku.” Kata Ibrani מִשְׁפָּט dapat berarti keadilan, hak hukum, atau perkara; רִיב dapat berarti perselisihan, gugatan, atau pengaduan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan anak kalimat bersyarat dalam sumpah pembelaan diri Ayub; bentuk sederhana ini alami dan tepat.
- source_word: אֶמְאַס
  choice: aku pernah menolak
  rationale: Dalam konteks hukum, מָאַס menyatakan penolakan atau pengabaian perkara, bukan sekadar perasaan menghina. Kata 'pernah' membantu menyatakan tindakan masa lampau dalam konstruksi bersyarat.
- source_word: מִשְׁפַּט
  choice: perkara
  rationale: Kata ini dapat berarti keadilan, hak hukum, putusan, atau perkara. 'Perkara' mempertahankan latar yuridis tanpa menentukan secara berlebihan apakah yang dimaksud adalah kasus atau hak.
- source_word: עַבְדִּי וַאֲמָתִי
  choice: budak laki-lakiku atau budak perempuanku
  rationale: Kedua istilah menunjuk orang yang berada dalam status perbudakan dan secara eksplisit membedakan laki-laki dari perempuan. 'Atau' menyampaikan cakupan distributif pasangan tersebut dalam bahasa Indonesia yang alami.
- source_word: בְּרִיבָם
  choice: ketika mereka mengajukan pengaduan
  rationale: רִיב memiliki nuansa perselisihan atau gugatan hukum. Ungkapan ini menyampaikan bahwa mereka menyuarakan perkara terhadap Ayub.
- source_word: עִמָּדִי
  choice: terhadap aku
  rationale: Secara harfiah berarti 'dengan aku', tetapi dalam konteks perselisihan menunjukkan pihak yang dihadapi dalam pengaduan. 'Terhadap aku' mempertahankan arah pertentangannya.
