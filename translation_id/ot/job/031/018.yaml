  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: id
  text: Sebab sejak masa mudaku ia membesarkanku seperti seorang ayah,[a] dan sejak dalam kandungan ibuku aku membimbingnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baris Ibrani ini sulit. Dapat juga dipahami, “ia membuatku bertumbuh seperti seorang ayah,” atau, dengan memahami maksud kalimatnya secara berbeda, “aku membesarkannya seperti seorang ayah.” Dalam pembacaan terakhir, Ayub berbicara tentang pemeliharaannya terhadap anak yatim.
    reason: alternative_reading
  - marker: b
    text: Akhiran feminin dalam bahasa Ibrani, yang diterjemahkan dengan “-nya”, kemungkinan merujuk kepada janda yang disebut dalam ayat sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari penyangkalan Ayub dalam konteks sekitarnya.
- source_word: מִנְּעוּרַי
  choice: sejak masa mudaku
  rationale: Menyatakan rentang waktu yang bermula pada masa muda dengan ungkapan Indonesia yang wajar.
- source_word: גְּדֵלַנִי
  choice: ia membesarkanku
  rationale: Bentuk Qal dengan akhiran orang pertama tunggal paling langsung dibaca sebagai ‘ia membesarkan aku’, meskipun susunan dan maksud baris ini sulit.
- source_word: כְאָב
  choice: seperti seorang ayah
  rationale: Awalan כְ menyatakan perbandingan; terjemahan ini mempertahankan similenya.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: dan sejak dalam kandungan ibuku
  rationale: Ungkapan temporal ini menunjuk pada tahap kehidupan yang paling awal dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: אַנְחֶנָּה
  choice: aku membimbingnya
  rationale: Bentuk Hifil orang pertama tunggal dengan akhiran feminin tunggal berarti ‘aku membimbing dia’; rujukan femininnya kemungkinan adalah janda pada ayat sebelumnya.
theological_decisions:
- issue: Pergantian rujukan di dalam ayat
  choice: Klausa pertama mempertahankan subjek maskulin tersirat dan objek orang pertama (‘ia membesarkanku’), sedangkan klausa kedua mempertahankan objek feminin (‘aku membimbingnya’).
  alternative: Memahami kedua klausa secara lebih lancar sebagai pernyataan bahwa Ayub sejak muda mengasuh anak yatim seperti seorang ayah dan menuntun janda.
  rationale: Teks Ibrani memiliki pergeseran gramatikal yang mencolok dan klausa pertama yang sulit. Terjemahan utama tidak diam-diam menyelesaikan ketegangan itu, sementara catatan kaki memberi pembacaan alternatif yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Ketidaklaziman klausa pertama dipertahankan karena mencerminkan bentuk teks Ibrani; alternatif dijelaskan dalam catatan kaki.
