translation:
  language: id
  text: Biarlah istriku menggiling untuk laki-laki lain, dan biarlah laki-laki lain berlutut di atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “biarlah laki-laki lain bersetubuh dengannya”; dalam konteks ini, “berlutut di atasnya” kemungkinan merupakan eufemisme seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  choice: menggiling
  rationale: Mempertahankan gambaran konkret verba Ibrani טחן, yaitu menggiling biji-bijian. Dalam kutuk ini ungkapan tersebut dapat menyiratkan kerja hina sekaligus penghinaan seksual, tanpa membuat implikasinya eksplisit dalam teks utama.
- source_word: לְאַחֵר
  choice: bagi laki-laki lain
  rationale: אַחֵר berarti 'yang lain/orang lain'; 'laki-laki' dibuat eksplisit karena konteksnya menyangkut istri Ayub dan laki-laki lain.
- source_word: אִשְׁתִּי
  choice: istriku
  rationale: Padanan kontekstual dan alami bagi אִשָּׁה dengan sufiks orang pertama tunggal.
- source_word: וְעָלֶיהָ
  choice: di atasnya
  rationale: Mempertahankan gambaran ruang dari עַל dengan sufiks feminin, tanpa memperhalus ungkapan fisiknya.
- source_word: יִכְרְעוּן
  choice: berlutut
  rationale: כרע pada dasarnya berarti 'berlutut' atau 'membungkuk'. Dalam konteks ini kemungkinan besar merupakan eufemisme seksual, tetapi teks utama mempertahankan citra harfiahnya.
- source_word: אֲחֵרִין
  choice: laki-laki lain
  rationale: Bentuk jamak maskulin ini secara kontekstual menunjuk kepada laki-laki lain; padanan tersebut jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah eufemisme seksual harus dibuat eksplisit dalam teks utama
  choice: Mempertahankan gambaran harfiah 'menggiling' dan 'berlutut di atasnya' dalam teks utama, dengan penjelasan makna seksual dalam catatan kaki.
  alternative: biarlah istriku menggiling bagi orang lain, dan biarlah laki-laki lain tidur dengannya
  rationale: Bahasa Ibrani memakai verba konkret yang tampaknya berfungsi sebagai eufemisme dalam konteks kutuk ini, tetapi tidak memakai verba eksplisit untuk persetubuhan. Pilihan ini mempertahankan ambiguitas dan ketegangan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kutuk 'biarlah ...' dipertahankan. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
