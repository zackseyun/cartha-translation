base_translation:
  language: en
  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: id
  text: Maka, bagian apakah yang berasal dari Allah dari atas, dan warisan apakah yang berasal dari Yang Mahakuasa dari ketinggian[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagian dari Allah di atas ... warisan dari Yang Mahakuasa dari ketinggian.” Frasa-frasa Ibrani ini juga dapat dipahami secara lebih adverbial, dengan menekankan bahwa bagian dan warisan itu berasal dari atas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  choice: Jadi, ... apakah
  rationale: Konjungsi dan kata tanya melanjutkan argumen Ayub sebagai pertanyaan retoris; “Jadi” mengungkapkan kaitan logis secara wajar dalam bahasa Indonesia.
- source_word: חֵלֶק
  choice: bagian
  rationale: Kata ini menunjuk pada bagian atau jatah yang diberikan dan berpadanan secara puitis dengan “warisan” pada baris berikutnya.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal puitis yang umum bagi Allah dalam kitab Ayub; padanan langsung ini tidak menambahkan gelar yang tidak terdapat dalam kata Ibrani.
- source_word: מִמָּעַל
  choice: yang berasal dari Allah di atas
  rationale: Ungkapan ini secara harfiah menyatakan sumber “dari atas”; penempatan “di atas” sesudah “Allah” mempertahankan kemungkinan bahwa frasa itu menerangkan kedudukan Allah, sementara catatan kaki menjaga pembacaan adverbial.
- source_word: וְנַחֲלַת
  choice: dan warisan apakah
  rationale: נַחֲלָה berarti warisan atau milik yang dijatahkan. Pengulangan “apakah” menghasilkan pertanyaan Indonesia yang alami dan memperjelas kesejajaran puisi.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi ini diterjemahkan agar maknanya langsung dipahami pembaca modern.
- source_word: מִמְּרֹמִים
  choice: yang berasal dari Yang Mahakuasa di tempat-tempat tinggi
  rationale: Bentuk jamak secara harfiah berarti “dari tempat-tempat tinggi.” Susunan ini mempertahankan preposisi sumber dan kesejajarannya dengan מִמָּעַל tanpa secara tidak perlu mempersempit maknanya menjadi “surga.”
theological_decisions:
- issue: Gelar-gelar ilahi dalam puisi Ibrani
  choice: Menerjemahkan אֱלוֹהַּ sebagai “Allah” dan שַׁדַּי sebagai “Yang Mahakuasa”
  alternative: Allah ... Shaddai
  rationale: Kedua sebutan ilahi dipakai secara sejajar. Menerjemahkan keduanya menyampaikan makna kepada pembaca modern tanpa memasukkan kekhasan denominasi.
- issue: Hubungan frasa lokasi dengan pemberi atau pemberian
  choice: Dalam teks utama, frasa lokasi ditempatkan dekat dengan sebutan ilahi, sambil mempertahankan unsur sumber “berasal dari”
  alternative: “bagian dari atas ... warisan dari tempat-tempat tinggi”
  rationale: Sintaksis puisi memungkinkan frasa-frasa itu dipahami lebih adverbial sebagai penekanan pada sumber surgawi. Catatan kaki mempertahankan ambiguitas asli tanpa memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk pertanyaan retoris serta kesejajaran antara “bagian” dan “warisan” dipertahankan; ungkapan spasial dibuat cukup harfiah agar ketaksaan puisi Ibrani tetap terlihat.
