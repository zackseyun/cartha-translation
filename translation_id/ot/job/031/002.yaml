- from: Jadi, bagian apakah yang berasal dari Allah di atas[a], dan warisan apakah yang berasal dari Yang Mahakuasa di tempat-tempat tinggi?
  to: Maka, bagian apakah yang berasal dari Allah dari atas, dan warisan apakah yang berasal dari Yang Mahakuasa dari ketinggian[a]?
