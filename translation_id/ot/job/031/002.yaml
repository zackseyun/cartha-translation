    issue: Ungkapan “di tempat-tempat tinggi” dalam teks utama
    rationale: מִמְּרֹמִים memiliki preposisi מִן (‘dari’) dan menunjuk ‘ketinggian/places on high’. Terjemahan saat ini menempatkan unsur itu sebagai lokasi bagi Yang Mahakuasa dan memakai bentuk Indonesia yang tidak idiomatis serta berpotensi berkonotasi ‘bukit pengorbanan’.
  - severity: low
    issue: “Jadi” untuk waw pembuka
    rationale: “Jadi” dapat menyiratkan inferensi yang lebih kuat daripada konjungsi penghubung Ibrani. “Maka” lebih netral dan tetap wajar dalam register puitis-baku.
