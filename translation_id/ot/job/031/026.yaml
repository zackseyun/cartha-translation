    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Memperkenalkan anak kalimat bersyarat dalam sumpah penyangkalan Ayub dan menyambung rangkaian tindakan yang ia sangkal.
- source_word: אֶרְאֶה
  choice: aku memandang
  rationale: Bentuk imperfek Qal orang pertama tunggal dipahami dalam konteks sumpah sebagai tindakan hipotetis pada masa lampau; 'memandang' cocok dengan perhatian kepada benda langit yang dibicarakan.
- source_word: אוֹר
  choice: cahaya
  rationale: Mempertahankan arti harfiah Ibrani. Dalam paralel dengan bulan, kata ini kemungkinan menunjuk kepada matahari, tetapi sumber tidak menyebut 'matahari' secara eksplisit.
- source_word: כִּי
  choice: ketika
  rationale: Menandai keadaan yang menyertai tindakan memandang dan menghasilkan bahasa Indonesia yang alami.
- source_word: יָהֵל
  choice: bersinar
  rationale: Mengungkapkan pancaran terang secara ringkas dan wajar.
- source_word: וְיָרֵחַ
  choice: atau bulan
  rationale: Konjungsi dipahami secara disjungtif dalam rangkaian syarat; 'bulan' menjadi objek kedua dari 'memandang'.
- source_word: יָקָר
  choice: dalam kemegahan
  rationale: Dalam gambaran bulan, kata ini menyatakan kecemerlangan atau keagungan, bukan nilai ekonomis; frasa ini mempertahankan nuansa adverbial.
- source_word: הֹלֵךְ
  choice: yang bergerak
  rationale: Partisip verba הלך menggambarkan gerak bulan yang terus berlangsung melintasi langit.
theological_decisions:
- issue: Kemungkinan konteks pemujaan benda langit
  choice: Mempertahankan gambaran harfiah 'cahaya' dan 'bulan' tanpa menyatakan unsur pemujaan secara eksplisit dalam ayat ini.
  alternative: Menerjemahkan אוֹר sebagai 'matahari' untuk memperjelas konteks penolakan terhadap penyembahan benda langit.
  rationale: Ayat 27–28 menjelaskan implikasi pemujaan, sedangkan ayat 26 sendiri hanya menyebut cahaya dan bulan. Pilihan ini menjaga ketegangan dan membiarkan konteks menerangkan makna teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern, puitis namun mudah dipahami. Struktur ayat dibiarkan terbuka dengan koma karena merupakan bagian dari kalimat sumpah yang berlanjut ke ayat berikutnya. Semua penanda catatan kaki dicantumkan dalam teks utama.
