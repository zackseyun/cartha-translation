  text: if I looked at the light when it shone[a], or at the moon moving in splendor[b],
translation:
  language: id
  text: jika aku memandang cahaya ketika bersinar[a], atau bulan yang bergerak dalam kemegahan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “matahari”; di sini “cahaya” kemungkinan menunjuk kepada matahari, sejajar dengan “bulan”.
