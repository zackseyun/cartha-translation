base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: id
  text: Jika langkahku menyimpang dari jalan, dan hatiku mengikuti mataku, dan noda apa pun melekat pada tanganku[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cela” atau “cacat”. Kata Ibrani ini dapat menunjuk pada noda, cela, atau cacat.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה
  choice: menyimpang
  rationale: Kata kerja נטה dalam konteks ini menyatakan penyimpangan dari arah atau jalan yang semestinya. “Menyimpang” alami dalam bahasa Indonesia dan mempertahankan makna etis dari gambaran perjalanan.
- source_word: אַשֻּׁרִי
  choice: langkahku
  rationale: Nomina ini menunjuk pada langkah atau gerak langkah. “Langkahku” mempertahankan metafora perilaku hidup dengan ungkapan Indonesia yang wajar.
- source_word: מִנִּי הַדָּרֶךְ
  choice: dari jalan
  rationale: Frasa ini menyatakan penyimpangan dari jalan. Bentuk konkret “jalan” dipertahankan agar metafora moral dalam bahasa Ibrani tidak diubah menjadi penjelasan abstrak.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: dan hatiku mengikuti mataku
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang hati yang bergerak mengikuti mata, yakni keinginan batin yang mengikuti apa yang dilihat, tanpa mempersempitnya melalui parafrasa.
- source_word: לִבִּי
  choice: hatiku
  rationale: “Hati” mempertahankan istilah antropologis Alkitab yang mencakup kehendak, keinginan, dan batin, bukan hanya pikiran.
- source_word: עֵינַי
  choice: mataku
  rationale: Terjemahan harfiah menjaga hubungan puitis dan moral antara penglihatan dan gerak hati.
- source_word: וּבְכַפַּי דָּבַק
  choice: dan noda melekat pada tanganku
  rationale: דבק berarti melekat atau menempel. “Melekat pada tanganku” mempertahankan citra kenajisan atau kesalahan yang menempel pada perbuatan seseorang. Bentuk כַּפַּי secara khusus berarti telapak tangan, tetapi “tanganku” lebih alami dan tetap menyampaikan metonimia perbuatan.
- source_word: מֻאוּם
  choice: noda
  rationale: Istilah ini dapat berarti noda, cacat, atau cela. Dalam konteks pemeriksaan integritas moral, “noda” paling alami dan tetap mempertahankan citra sesuatu yang mencemari tangan.
theological_decisions:
- issue: Metafora moral tentang jalan
  choice: Mempertahankan ungkapan “menyimpang dari jalan”.
  alternative: Menjelaskannya sebagai “meninggalkan perilaku yang benar”.
  rationale: Teks Ibrani menggunakan gambaran langkah dan jalan untuk perilaku moral. Metafora konkret dipertahankan agar cakupan maknanya tidak dipersempit.
- issue: Hubungan antara hati dan mata
  choice: Mempertahankan “hatiku mengikuti mataku”.
  alternative: Memparafrasakan sebagai “aku menginginkan apa yang kulihat”.
  rationale: Ungkapan sumber menggambarkan dinamika antara penglihatan dan keinginan batin. Bentuk literalnya dapat dipahami dalam bahasa Indonesia dan tidak menentukan secara berlebihan objek atau jenis keinginan tersebut.
- issue: Noda pada tangan sebagai gambaran kesalahan moral
  choice: Mempertahankan citra “noda melekat pada tanganku”.
  alternative: Menafsirkan langsung sebagai “aku bersalah dalam perbuatanku”.
  rationale: Citra tangan dapat menunjuk pada perbuatan, tetapi teks tetap memakai bahasa konkret tentang noda. Terjemahan ini menjaga ketegangan antara gambaran fisik dan makna moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dengan pengulangan “dan” mempertahankan alur sumpah bersyarat dalam bahasa Ibrani. Tanda koma akhir menunjukkan bahwa konsekuensi sumpah berlanjut pada ayat berikutnya.
