lexical_decisions:
- source_word: נִפְתָּה
  choice: terpikat
  rationale: Bentuk Nifal dari פתה dapat berarti terbujuk, tergoda, atau terpikat. Dalam konteks godaan seksual, “terpikat” secara alami menggambarkan hati yang tertarik tanpa secara berlebihan menyatakan bahwa perempuan itu pelaku aktifnya.
- source_word: לִבִּי
  choice: hatiku
  rationale: “Hati” mempertahankan gambaran antropologis Ibrani tentang pusat hasrat, kehendak, dan niat batin.
- source_word: עַל אִשָּׁה
  choice: oleh seorang perempuan
  rationale: Preposisi עַל secara harfiah lebih luas, tetapi bersama נִפְתָּה di sini menunjuk kepada perempuan sebagai sasaran atau penyebab ketertarikan. Susunan ini wajar dalam bahasa Indonesia dan tetap mempertahankan konteks godaan seksual.
- source_word: פֶּתַח
  choice: di depan pintu
  rationale: פֶּתַח berarti pintu, ambang, atau jalan masuk. Dengan kata kerja “mengintai,” frasa “di depan pintu” paling alami untuk menggambarkan keberadaan tersembunyi di sekitar pintu rumah orang lain.
- source_word: רֵעִי
  choice: sesamaku
  rationale: רֵעַ dapat berarti sesama, kawan, atau sahabat. “Sesamaku” mempertahankan cakupan sosial-etis yang luas tanpa menyiratkan kedekatan pribadi.
- source_word: אָרָבְתִּי
  choice: aku mengintai
  rationale: ארב menunjukkan tindakan menunggu secara diam-diam dengan maksud tertentu. “Mengintai” ringkas, alami, dan mempertahankan unsur kesengajaan serta kerahasiaan.
theological_decisions:
- issue: Pembingkaian moral sumpah Ayub mengenai perzinaan
  choice: Mempertahankan perkembangan dari ketertarikan batin menuju tindakan mengintai secara sengaja.
  alternative: Menjadikannya sekadar ketertarikan romantis, atau mengeksplisitkannya sebagai percobaan perzinaan.
  rationale: Teks Ibrani menyebut hati yang terpikat dan tindakan rahasia di pintu sesama. Terjemahan mempertahankan bobot etisnya tanpa menambahkan tindakan seksual yang tidak dinyatakan secara eksplisit.
