  text: Jika hatiku terpikat kepada seorang perempuan[a], dan aku mengintai di depan pintu tetanggaku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tergoda” atau “terbujuk.” Kata kerja Ibrani ini dapat berarti terpikat, tergoda, atau terbujuk; dalam konteks ini berkaitan dengan godaan seksual.
    reason: lexical_alternative
