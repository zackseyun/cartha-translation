  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: id
  text: Bukankah Dia yang menjadikan aku dalam kandungan juga menjadikan dia? Bukankah Dia yang satu dan sama membentuk kami dalam rahim?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan membentuk kami dalam satu rahim?” Kata Ibrani untuk “satu” dapat dipahami sebagai menerangkan “rahim”. Ungkapan ini menekankan asal-usul kemanusiaan yang sama, bukan bahwa keduanya dilahirkan oleh ibu yang sama.'
    reason: Menjaga kemungkinan sintaksis bahwa אֶחָד ('satu') menerangkan 'rahim', alih-alih menunjuk kepada Dia yang membentuk.
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan jawaban ya dan terdengar alami dalam bahasa Indonesia.
- source_word: בַבֶּטֶן
  choice: dalam kandungan
  rationale: Dalam konteks pembentukan sebelum lahir, בטן menunjuk pada kandungan, bukan sekadar perut.
- source_word: עֹשֵׂנִי
  choice: Dia yang menjadikan aku
  rationale: Mempertahankan bentuk verbal dan personal dari partisip dengan akhiran orang pertama, tanpa mengubahnya menjadi gelar teologis.
- source_word: עָשָׂהוּ
  choice: juga menjadikan dia
  rationale: Akhiran tunggal maskulin menunjuk kepada hamba laki-laki dalam konteks dekat; 'juga' menyampaikan kesejajaran penciptaan secara wajar.
- source_word: וַיְכֻנֶנּוּ
  choice: membentuk kami
  rationale: Verba ini dalam konteks rahim menyatakan tindakan membentuk atau menjadikan; sufiksnya paling wajar dipahami sebagai orang pertama jamak.
- source_word: בָּרֶחֶם
  choice: dalam rahim
  rationale: רחם secara khusus berarti rahim dan menjadi lokasi pembentukan sebelum lahir.
- source_word: אֶחָד
  choice: Dia yang sama
  rationale: אחד dapat dipahami sebagai subjek yang menegaskan bahwa satu Pribadi yang sama membentuk keduanya. Susunan ini alami dalam bahasa Indonesia dan menghindari kesan biologis bahwa Ayub dan hambanya berasal dari ibu yang sama; kemungkinan bahwa אחד menerangkan 'rahim' dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan kata ganti tunggal maskulin dalam argumen Ayub
  choice: Kata 'dia' dipertahankan dan dalam konteks langsung menunjuk kepada hamba laki-laki Ayub.
  alternative: Ayat ini dapat diterapkan secara lebih luas kepada setiap sesama manusia.
  rationale: Ayub 31:13–14 membicarakan hamba laki-laki dan perempuan Ayub. Terjemahan mempertahankan bentuk tunggal teks sambil tidak membatasi implikasi etisnya.
- issue: Hubungan sintaksis אֶחָד dengan frasa penutup
  choice: אֶחָד dipahami sebagai penegasan bahwa Pribadi yang sama membentuk Ayub dan hambanya.
  alternative: אֶחָד dapat menerangkan רֶחֶם sehingga frasanya berarti 'dalam satu rahim' atau secara idiomatis 'dalam rahim yang sama'.
  rationale: Pembacaan sebagai subjek sesuai dengan sintaksis puitis Ibrani dan menyatakan kesamaan Pencipta tanpa menyiratkan bahwa keduanya memiliki ibu biologis yang sama. Ambiguitas sumber tetap disajikan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kandungan' dipakai pada klausa pertama dan 'rahim' pada klausa kedua untuk mengikuti variasi leksikal Ibrani. Pengulangan 'Bukankah' mempertahankan daya retoris dan memperjelas susunan puitis.
