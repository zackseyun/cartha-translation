  text: if the men of my tent have not said[b][a], ‘Who is there that has not been filled with his flesh?’
translation:
  language: id
  text: Jika orang-orang di kemahku[a] tidak berkata, “Siapa yang tidak kenyang oleh dagingnya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang dalam rumah tanggaku”; “kemah” dapat menunjuk pada rumah tangga atau lingkungan domestik seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari dagingnya”; dalam konteks ini, yang dimaksud ialah daging atau makanan yang Ayub sediakan bagi orang-orang di rumahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Jika ... tidak
  rationale: Mempertahankan bentuk bersyarat dari rumusan sumpah Ayub. Dalam rangkaian pasal ini, ungkapan tersebut berfungsi sebagai pernyataan tegas yang terkait dengan kutuk atas diri sendiri.
- source_word: מְתֵי אָהֳלִי
  choice: orang-orang di kemahku
  rationale: Menerjemahkan gambaran konkret Ibrani secara dekat, sambil membiarkan catatan kaki menjelaskan bahwa yang dimaksud dapat berupa anggota rumah tangga atau para pelayan Ayub.
- source_word: מִי יִתֵּן
  choice: Siapa yang
  rationale: Dalam konteks ini, ungkapan tersebut memperkenalkan pertanyaan retoris tentang ada tidaknya seseorang, bukan harapan ‘sekiranya’ yang lazim di tempat lain.
- source_word: מִבְּשָׂרוֹ
  choice: oleh daging yang disediakannya
  rationale: בָּשָׂר secara harfiah berarti ‘daging’, tetapi konteksnya menunjuk pada daging sebagai makanan yang Ayub sediakan. Rumusan ini menjaga unsur ‘daging’ tanpa memberi kesan bahwa orang memakan tubuh Ayub.
- source_word: לֹא נִשְׂבָּע
  choice: tidak pernah dikenyangkan
  rationale: Nifal שׂבע berarti menjadi kenyang atau dipuaskan. Bentuk pasif dipertahankan, dan ‘pernah’ membuat pertanyaan retorisnya alami dalam bahasa Indonesia.
