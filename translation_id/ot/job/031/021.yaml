source:
  edition: WLC
  text: אִם הֲנִיפ֣וֹתִי עַל יָת֣וֹם יָדִ֑/י כִּֽי אֶרְאֶ֥ה בַ֝/שַּׁ֗עַר עֶזְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/021.yaml
  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: id
  text: jika aku pernah mengangkat tanganku melawan anak yatim[a] karena aku melihat bahwa aku mendapat dukungan di pintu gerbang[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang yang tidak berayah". Istilah Ibrani ini secara khusus menunjuk kepada orang yang kehilangan ayah sehingga rentan secara sosial.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah pintu gerbang kota, tempat para tua-tua mengadili perkara dan keputusan umum dibuat.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, "pertolonganku"; di sini berarti dukungan atau sokongan dalam lingkungan hukum dan kemasyarakatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Mempertahankan rumusan sumpah bersyarat yang berlanjut ke akibat pada ayat berikutnya.
- source_word: הֲנִיפוֹתִי
  choice: aku pernah mengangkat
  rationale: Bentuk Hifil dari נוּף di sini menggambarkan gerakan tangan yang mengancam atau bermusuhan; 'mengangkat' alami dalam bahasa Indonesia tanpa mempersempitnya menjadi tindakan kekerasan tertentu.
- source_word: עַל
  choice: melawan
  rationale: Menyampaikan arah bermusuhan dari gerakan tangan terhadap pihak yang lemah.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Istilah Ibrani menunjuk kepada orang yang kehilangan ayah dan karena itu rentan secara sosial; 'anak yatim' merupakan padanan Indonesia yang alami.
- source_word: יָדִי
  choice: tanganku
  rationale: Mempertahankan unsur tubuh harfiah karena ungkapan ini jelas dan membawa nuansa ancaman atau penggunaan kuasa.
- source_word: כִּי
  choice: karena
  rationale: 'Mengungkapkan alasan bagi tindakan hipotetis itu: adanya dukungan dalam lingkungan pengadilan publik.'
- source_word: אֶרְאֶה
  choice: aku melihat
  rationale: Mempertahankan verba persepsi tanpa menafsirkannya terlalu jauh; dalam konteks, melihat mencakup menyadari adanya dukungan.
- source_word: בַשַּׁעַר
  choice: di pintu gerbang
  rationale: Terjemahan konkret ini mempertahankan latar budaya tempat perkara hukum dan keputusan publik dijalankan.
- source_word: עֶזְרָתִי
  choice: aku mendapat dukungan
  rationale: Secara harfiah 'pertolonganku'; dalam konteks hukum-publik, ungkapan ini berarti bantuan atau sokongan yang tersedia bagi Ayub.
