base_translation:
  language: en
  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: id
  text: Sebagai ganti gandum, biarlah duri tumbuh, dan sebagai ganti jelai, gulma berbau busuk[a]. Perkataan Ayub telah berakhir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "gulma berbahaya"; jenis tanaman yang dimaksud oleh kata Ibrani ini tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: sebagai ganti
  rationale: Dalam konteks kutukan atas lahan pertanian, kata ini menyatakan penggantian, bukan letak fisik.
- source_word: חִטָּה
  choice: gandum
  rationale: Padanan baku untuk tanaman biji-bijian yang dimaksud.
- source_word: יֵצֵא
  choice: biarlah ... tumbuh
  rationale: Bentuk ini menyampaikan nuansa harapan atau kutukan, sedangkan 'tumbuh' merupakan ungkapan alami bagi tanaman yang muncul dari tanah.
- source_word: חוֹחַ
  choice: duri
  rationale: Kata Ibrani ini menunjuk pada tumbuhan berduri yang merugikan; 'duri' jelas dan mempertahankan gambaran kutukan.
- source_word: שְׂעֹרָה
  choice: jelai
  rationale: Padanan baku bahasa Indonesia untuk tanaman serealia barley.
- source_word: בָאְשָׁה
  choice: gulma berbau busuk
  rationale: Kata ini menunjuk pada tumbuhan liar yang buruk atau berbau busuk, tetapi jenis botaninya tidak pasti. Pilihan ini mempertahankan kaitan leksikalnya dengan bau busuk dan kontrasnya dengan jelai.
- source_word: תַּמּוּ
  choice: berakhirlah
  rationale: Ungkapan ringkas ini menandai selesainya rangkaian perkataan Ayub dan mempertahankan nada penutup teks.
- source_word: דִּבְרֵי אִיּוֹב
  choice: perkataan Ayub
  rationale: Konstruksi ini menerjemahkan frasa Ibrani secara lugas dan wajar dalam bahasa Indonesia tanpa mempersempitnya menjadi jenis pidato tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel 'sebagai ganti ... dan sebagai ganti ...' dipertahankan, sementara bentuk 'biarlah' menyampaikan daya kutukan pada kalimat tersebut. Penanda catatan kaki ditempatkan sesudah istilah yang memang tidak pasti, yaitu בָאְשָׁה.
