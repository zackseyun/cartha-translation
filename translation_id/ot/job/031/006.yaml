lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: Biarlah Ia menimbang aku
  rationale: 'Bentuk imperfek Qal dengan sufiks orang pertama tunggal berfungsi secara volitif dalam konteks ini: Ayub mempersilakan dirinya diuji. “Biarlah Ia menimbang aku” mempertahankan nuansa tersebut dan metafora penilaian.'
- source_word: בְּמֹאזְנֵי צֶדֶק
  choice: dengan neraca yang adil
  rationale: מֹאזְנַיִם berarti neraca atau timbangan, sedangkan צֶדֶק dalam gambaran pengadilan atau perdagangan menyatakan keadilan dan kejujuran. “Neraca yang adil” alami dalam bahasa Indonesia dan mempertahankan metafora pengukuran yang tidak berat sebelah.
- source_word: וְיֵדַע
  choice: dan biarlah ... mengetahui
  rationale: Konjungsi yang diikuti bentuk imperfek dapat meneruskan daya volitif klausa sebelumnya. Terjemahan ini mempertahankan kesejajaran itu tanpa mengubahnya menjadi pernyataan masa depan.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal puitis ini berarti “Allah” dan lazim dipakai dalam kitab Ayub; ayat ini tidak memberi dasar untuk menambahkan gelar lain.
- source_word: תֻּמָּתִי
  choice: ketulusanku
  rationale: Kata ini menunjuk pada keutuhan moral, ketulusan, atau keadaan tidak bercela. “Ketulusanku” menyampaikan klaim Ayub akan karakter yang utuh tanpa menyiratkan bahwa ia mengaku sama sekali tidak berdosa.
theological_decisions:
- issue: Daya klaim Ayub mengenai dirinya
  choice: ketulusanku
  alternative: keadaanku yang tidak bercela; bahwa aku tidak bersalah
  rationale: Ayub meminta penilaian ilahi yang adil dan menegaskan keutuhan moralnya. “Ketulusan” menjaga ketegangan teologis itu tanpa memperkuatnya menjadi klaim eksplisit tentang kesempurnaan tanpa dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “Ia” mempertahankan rujukan implisit kepada Allah dari konteks, sementara pengulangan “biarlah” mencerminkan kesejajaran volitif teks Ibrani.
