  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: id
  text: Biarlah Ia menimbang aku dengan neraca yang adil, dan biarlah Allah mengetahui integritasku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketidakbercelaanku” atau “ketidakbersalahanku.”
