  text: Sebab itu adalah perbuatan mesum, suatu pelanggaran yang menjadi perkara pengadilan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pelanggaran bagi para hakim”; dapat juga dipahami, “pelanggaran yang patut dihukum oleh para hakim.”
    reason: Ungkapan Ibrani עָוֺן פְּלִילִים padat secara sintaksis dan dapat menunjuk pada pelanggaran yang menjadi urusan pengadilan atau pada pelanggaran yang layak dijatuhi hukuman oleh hakim.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi sumpah Ayub dalam ayat sebelumnya dan mempertahankan hubungan penjelas antarayat.
- source_word: הוא
  choice: itu
  rationale: Menunjuk kembali pada tindakan yang dibicarakan dalam konteks, yaitu perzinaan.
- source_word: זִמָּה
  choice: perbuatan mesum
  rationale: Dalam konteks seksual ini, kata tersebut menunjuk pada tindakan amoral yang keji. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern tanpa mempersempitnya menjadi istilah hukum tertentu.
- source_word: וְהִיא
  choice: dan merupakan
  rationale: Melanjutkan predikasi mengenai tindakan yang sama; bentuk feminin Ibrani mengikuti nomina feminin זִמָּה dan tidak perlu ditampilkan sebagai gender gramatikal dalam bahasa Indonesia.
- source_word: עָוֺן
  choice: pelanggaran
  rationale: Menyatakan kesalahan yang membawa tanggung jawab moral dan, dalam konteks ini, juga memiliki dimensi hukum.
- source_word: פְּלִילִים
  choice: yang harus diadili
  rationale: Mengungkapkan makna yudisial ungkapan Ibrani secara alami. Hubungan sintaksis yang lebih harfiah dengan para hakim serta nuansa 'patut dihukum' dipertahankan dalam catatan kaki.
