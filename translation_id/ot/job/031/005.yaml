  text: אִם הָלַ֥כְתִּי עִם שָׁ֑וְא וַ/תַּ֖חַשׁ עַל מִרְמָ֣ה רַגְלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: id
  text: Jika aku telah berjalan dengan kepalsuan[b], dan kakiku bergegas menuju tipu daya[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan kakiku bergegas mengejar tipu daya.” Preposisi Ibrani ini dapat dipahami sebagai penunjuk arah: “ke”, “menuju”, atau “mengejar”.'
    reason: lexical_alternative
  - marker: b
    text: “Berjalan” merupakan ungkapan Ibrani yang menggambarkan perilaku atau cara hidup seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Membuka klausa bersyarat dalam sumpah pembelaan Ayub tanpa menambahkan penegasan yang tidak tersurat.
- source_word: הָלַכְתִּי
  choice: aku telah berjalan
  rationale: Mempertahankan metafora Ibrani tentang perjalanan sebagai perilaku hidup, sekaligus menyampaikan tindakan lampau yang relevan dengan pembelaan Ayub.
- source_word: עִם
  choice: dengan
  rationale: Menyatakan hubungan atau keterlibatan dengan kepalsuan secara ringkas dan dekat dengan arti dasar preposisi Ibrani.
- source_word: שָׁוְא
  choice: kepalsuan
  rationale: Dalam kesejajaran dengan מִרְמָה, kata ini terutama menunjuk pada apa yang palsu atau tidak benar, bukan sekadar kesia-siaan atau kehampaan.
- source_word: וַתַּחַשׁ
  choice: dan ... bergegas
  rationale: Menyampaikan gerak cepat serta mempertahankan gambaran puitis bahwa kaki bertindak sebagai subjek.
- source_word: עַל
  choice: menuju
  rationale: Dengan verba gerak, preposisi ini dapat menunjukkan arah atau sasaran; 'menuju' alami dalam bahasa Indonesia sambil mempertahankan nuansa gerak.
- source_word: מִרְמָה
  choice: tipu daya
  rationale: Mengungkapkan tindakan atau perilaku menipu dalam ragam yang wajar dan bermartabat, serta selaras dengan 'kepalsuan' pada baris pertama.
- source_word: רַגְלִי
  choice: kakiku
  rationale: Mempertahankan bentuk tunggal dan personifikasi puitis dalam teks Ibrani.
theological_decisions: []
