  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: id
  text: Ah, sekiranya ada orang yang mau mendengarkan aku! Inilah tanda tanganku[a]. Biarlah Yang Mahakuasa menjawab aku, dan biarlah lawan perkaraku menuliskan surat tuduhannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanda pengesahanku” atau “tandaku.” Kata Ibrani ini kemungkinan menunjuk kepada tanda yang dibubuhkan Ayub untuk mengesahkan pernyataannya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah, bagian ini dapat diterjemahkan: “dan dokumen yang ditulis oleh orang yang berperkara denganku.” Dalam konteks ini, dokumen tersebut adalah surat tuduhan dari pihak lawan.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן לִי שֹׁמֵעַ לִי
  choice: Ah, sekiranya ada orang yang mau mendengarkan aku!
  rationale: Ungkapan מִי יִתֶּן menyatakan harapan kuat, bukan pertanyaan harfiah. Bentuk partisip שֹׁמֵעַ dengan לִי menunjuk kepada seseorang yang bersedia mendengarkan perkara Ayub.
- source_word: הֶן תָּוִי
  choice: Inilah tanda tanganku
  rationale: הֶן menarik perhatian kepada tanda yang diajukan Ayub, sedangkan תָּוִי adalah tanda pengesahan atas pernyataannya. 'Tanda tangan' menyampaikan fungsi legalnya secara alami dalam bahasa Indonesia modern.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan baku bagi gelar ilahi שַׁדַּי, tanpa menambahkan penafsiran doktrinal tertentu.
- source_word: יַעֲנֵנִי
  choice: menjawab aku
  rationale: Dalam konteks pengadilan, verba ini menyatakan jawaban atau tanggapan terhadap perkara yang diajukan Ayub.
- source_word: וְסֵפֶר כָּתַב
  choice: dan biarlah ... menuliskan surat tuduhannya
  rationale: סֵפֶר berarti dokumen tertulis atau gulungan, dan dalam konteks sengketa berfungsi sebagai surat tuduhan. Walaupun כָּתַב berbentuk perfektif, klausa ini dapat dipahami sebagai kelanjutan harapan Ayub.
- source_word: אִישׁ רִיבִי
  choice: lawan perkaraku
  rationale: Secara harfiah frasa ini berarti 'orang dalam sengketaku' dan menunjuk kepada pihak lawan dalam proses hukum. 'Lawan perkaraku' mempertahankan citra yuridis tanpa menentukan identitas pihak tersebut secara berlebihan.
theological_decisions:
- issue: Citra pengadilan dalam permohonan Ayub
  choice: 'Menggunakan istilah legal yang wajar: ''tanda tangan'', ''lawan perkara'', dan ''surat tuduhan''.'
  alternative: 'Padanan yang lebih harfiah: ''tandaku'', ''orang dalam sengketaku'', dan ''dokumen/gulungan''.'
  rationale: Konteks menggambarkan tantangan resmi Ayub untuk memperoleh jawaban dan melihat tuduhan tertulis. Pilihan ini menampilkan fungsi hukum ungkapan Ibrani tanpa menambahkan kesimpulan teologis.
- issue: Hubungan sintaksis klausa terakhir
  choice: 'Memahaminya sebagai kelanjutan harapan: lawan perkara diminta menuliskan surat tuduhan.'
  alternative: 'Membacanya sebagai pernyataan: ''dan dokumen yang telah ditulis lawan perkaraku''.'
  rationale: Bentuk Ibrani ringkas dan dapat dipahami lebih dari satu cara. Alur harapan yang dimulai dengan מִי יִתֶּן mendukung terjemahan volitif, sementara kemungkinan pembacaan perfektif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Interjeksi 'Ah' menyampaikan kerinduan kuat; istilah hukum dipakai secukupnya agar citra pengadilan dalam teks tetap jelas. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
