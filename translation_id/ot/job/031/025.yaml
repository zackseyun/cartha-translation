  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: id
  text: jika aku bersukacita karena kekayaanku berlimpah, dan karena tanganku telah memperoleh banyak[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tanganku menemukan yang besar/banyak,” sebuah ungkapan Ibrani yang berarti memperoleh banyak melalui kemampuan atau usaha sendiri.'
    reason: Menjelaskan idiom Ibrani sambil mempertahankan gambaran tangan dan unsur usaha pribadi.
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Kata ini membuka anak kalimat bersyarat dalam rangkaian sumpah pembelaan diri Ayub.
- source_word: אֶשְׂמַח
  choice: aku bersukacita
  rationale: Bentuk ini menyatakan kegembiraan atau kesenangan; pilihan ini mempertahankan fokus moral pada kegembiraan yang didasarkan pada kekayaan.
- source_word: כִּי
  choice: karena
  rationale: Dalam kedua kemunculannya, kata ini menyatakan alasan Ayub bersukacita, bukan sekadar isi pikirannya.
- source_word: רַב חֵילִי
  choice: kekayaanku berlimpah
  rationale: חַיִל dalam konteks ini menunjuk pada kekayaan atau harta benda, sedangkan רַב menyatakan jumlah yang besar.
- source_word: כַבִּיר מָצְאָה יָדִי
  choice: tanganku telah memperoleh banyak
  rationale: Terjemahan ini mempertahankan gambaran 'tangan' sebagai pelaku sekaligus menyampaikan idiom Ibrani tentang memperoleh banyak melalui kemampuan atau usaha sendiri.
theological_decisions:
- issue: Apakah ayat ini mengecam kekayaan itu sendiri atau kegembiraan yang bertumpu pada kelimpahan dan hasil usaha sendiri
  choice: Ayub menyangkal bahwa ia bersukacita karena kekayaannya berlimpah dan karena tangannya memperoleh banyak.
  alternative: Terjemahan yang lebih longgar dapat memberi kesan bahwa sekadar memiliki kekayaanlah yang dipersoalkan.
  rationale: Teks Ibrani menyoroti alasan untuk bersukacita, dengan dua klausa kausal, serta menekankan peran 'tanganku'. Karena itu, terjemahan tidak menjadikan kepemilikan harta itu sendiri sebagai pokok kesalahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “jika” serta tanda pisah mempertahankan ayat ini sebagai bagian dari rangkaian sumpah pembelaan diri yang berlanjut ke ayat berikutnya.
