  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: id
  text: hatiku diam-diam terpikat[a], dan tanganku mencium mulutku—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis dalam konteks ini, “dan aku melontarkan ciuman dengan tanganku”—kemungkinan suatu isyarat penghormatan yang berkaitan dengan penyembahan benda-benda langit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: terpikat
  rationale: Bentuk dari פתה di sini menyatakan bahwa batin tertarik atau tergoda. “Terpikat” mempertahankan daya tarik batin tanpa menambahkan gagasan penipuan yang tidak harus tersirat.
- source_word: בַּסֵּתֶר
  choice: diam-diam
  rationale: סתר menunjuk pada keadaan tersembunyi atau rahasia. “Diam-diam” merupakan ungkapan Indonesia yang alami dan menegaskan bahwa hal itu terjadi secara batiniah serta tersembunyi.
- source_word: לִבִּי
  choice: hatiku
  rationale: לֵב menunjuk pada pusat batin, kehendak, dan perasaan. “Hatiku” adalah padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: וַתִּשַּׁק
  choice: mencium
  rationale: נשק secara konkret berarti “mencium”. Terjemahan utama mempertahankan tindakan jasmani itu, sedangkan makna isyarat penghormatan dijelaskan dalam catatan kaki.
- source_word: יָדִי
  choice: tanganku
  rationale: Padanan langsung yang mempertahankan tangan sebagai bagian dari gerakan penghormatan tersebut.
- source_word: לְפִי
  choice: mulutku
  rationale: Secara harfiah berarti “ke mulutku”. Sesudah verba “mencium”, bentuk “mencium mulutku” alami dalam bahasa Indonesia, sementara arah gerak dan kemungkinan idiom ritual diterangkan dalam catatan kaki.
theological_decisions:
- issue: Kemungkinan rujukan kepada isyarat penyembahan benda-benda langit
  choice: Mempertahankan tindakan jasmani yang konkret dalam teks utama tanpa menambahkan kata “menyembah”.
  alternative: dan tanganku melontarkan ciuman dari mulutku sebagai tanda hormat
  rationale: Konteks ayat 26–28 menunjukkan penghormatan terlarang kepada matahari atau bulan, tetapi ayat ini sendiri menggambarkan gerakannya dan tidak secara eksplisit menamai tindakan itu sebagai penyembahan. Catatan kaki menjelaskan kemungkinan makna budaya tanpa menghilangkan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan klausa mengikuti kesinambungan dari ayat sebelumnya; tanda pisah mempertahankan kalimat yang belum selesai menuju ayat berikutnya. Penanda catatan kaki [a] dicantumkan dalam teks utama.
