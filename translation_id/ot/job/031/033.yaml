  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: id
  text: jika aku menutupi pelanggaran-pelanggaranku seperti manusia[a], dengan menyembunyikan kejahatanku di dalam dadaku—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti Adam.” Kata Ibrani אָדָם dapat dipahami sebagai kata umum yang berarti “manusia” atau sebagai nama diri “Adam.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Memperkenalkan anak kalimat bersyarat dalam rangkaian sumpah Ayub tanpa menambahkan penegasan yang tidak tersurat.
- source_word: כִּסִּיתִי
  choice: aku menutupi
  rationale: Mempertahankan gambaran konkret verba כסה, yang dapat berarti menutupi atau menyembunyikan.
- source_word: כְאָדָם
  choice: seperti manusia pada umumnya
  rationale: אָדָם dapat menjadi nomina umum yang berarti manusia atau nama diri Adam. Teks utama memakai pengertian umum, sementara kemungkinan nama diri dipertahankan dalam catatan kaki.
- source_word: פְּשָׁעָי
  choice: pelanggaran-pelanggaranku
  rationale: פֶּשַׁע menunjuk pada pelanggaran atau pemberontakan. Pilihan ini mempertahankan nuansa moral-hukum tanpa mempersempitnya menjadi pemberontakan politis.
- source_word: לִטְמוֹן
  choice: dengan menyembunyikan
  rationale: Infinitif טמן menjelaskan cara atau sarana penutupan itu; bentuk ini alami dalam bahasa Indonesia.
- source_word: בְּחֻבִּי
  choice: di dalam dadaku
  rationale: Mempertahankan citra konkret tempat tersembunyi di dada atau pangkuan, tanpa menggantinya dengan tafsiran abstrak seperti 'dalam hati' atau 'secara rahasia'.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat mencakup kesalahan, kejahatan moral, atau keadaan bersalah. 'Kesalahan' cukup luas dan tidak menyamakan begitu saja istilah ini dengan פֶּשַׁע.
theological_decisions:
- issue: Makna אָדָם dalam כְאָדָם
  choice: 'Nomina umum: “seperti manusia pada umumnya”'
  alternative: 'Nama diri: “seperti Adam”'
  rationale: Bentuk Ibrani memungkinkan kedua pembacaan. Teks utama mempertahankan makna generik yang sesuai dengan pemakaian umum אָדָם, sedangkan kemungkinan alusi kepada Adam dicatat agar ambiguitas dan bobot eksegetisnya tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur bersyarat serta tanda pisah dipertahankan karena ayat ini merupakan bagian dari rangkaian sumpah Ayub yang berlanjut ke ayat berikutnya.
