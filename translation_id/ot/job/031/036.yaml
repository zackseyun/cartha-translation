  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: id
  text: Sungguh, aku akan membawanya di atas bahuku; aku akan mengenakannya seperti mahkota.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk jamak, “mahkota-mahkota”; bentuk itu mungkin merupakan jamak intensif, sehingga dapat diterjemahkan “seperti mahkota.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Sungguh
  rationale: Dalam konteks sumpah pembelaan Ayub, ungkapan ini berfungsi sebagai penegasan kuat, bukan sebagai syarat biasa.
- source_word: עַל שִׁכְמִי
  choice: di atas bahuku
  rationale: Menerjemahkan ungkapan tempat secara langsung dan mempertahankan bentuk tunggal serta gambaran bahwa Ayub secara terbuka membawa surat tuduhan itu.
- source_word: אֶשָּׂאֶנּוּ
  choice: aku akan membawanya
  rationale: Kata kerja נשׂא di sini menyatakan tindakan mengangkat atau membawa; 'membawanya' alami dalam bahasa Indonesia dan sesuai dengan gambarannya.
- source_word: אֶעֶנְדֶנּוּ
  choice: aku akan mengikatkannya
  rationale: Kata kerja ענד dapat berarti memasang atau mengikatkan sebuah perhiasan. Pilihan ini mempertahankan tindakan fisik tanpa membatasi maknanya hanya pada berhias.
- source_word: עֲטָרוֹת
  choice: seperti mahkota
  rationale: Bentuk Ibraninya jamak, tetapi mungkin merupakan bentuk jamak intensif atau menunjuk pada perhiasan menyerupai mahkota. Bentuk tunggal lebih wajar dalam perbandingan bahasa Indonesia, sedangkan bentuk sumber dicatat dalam catatan kaki.
- source_word: לִי
  choice: pada diriku
  rationale: Bersama ענד, pronomina datif ini secara alami menunjukkan bahwa Ayub sendiri akan mengenakannya; bentuk refleksif memperjelas hubungan tersebut.
