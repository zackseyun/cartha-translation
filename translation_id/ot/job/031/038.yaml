  yaml_path: translation/ot/job/031/038.yaml
  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: id
  text: Jika tanahku berseru menentang aku, dan alur-alurnya menangis bersama-sama[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meratap”; kata kerja Ibrani ini lazim berarti menangis atau meratap dan di sini dipakai secara puitis untuk alur-alur tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan klausa bersyarat dalam sumpah pembelaan Ayub; bentuk sederhana ini alami dan tetap mempertahankan struktur kalimat Ibrani.
- source_word: עָלַי
  choice: menentang aku
  rationale: Dengan kata kerja זעק, preposisi על di sini paling wajar menyatakan arah tuduhan atau protes terhadap Ayub, bukan lokasi secara harfiah.
- source_word: אַדְמָתִי
  choice: tanahku
  rationale: אדמה menunjuk pada tanah atau lahan yang digarap; “tanahku” ringkas, alami, dan mempertahankan bentuk posesif.
- source_word: תִזְעָק
  choice: berseru
  rationale: זעק menyatakan seruan kuat, kerap karena kesusahan atau sebagai protes. “Berseru” mempertahankan personifikasi tanah dan nuansa kesaksiannya terhadap Ayub.
- source_word: וְיַחַד
  choice: dan ... bersama-sama
  rationale: יחד menyatakan tindakan serentak atau kolektif. Penempatan “bersama-sama” setelah predikat terdengar alami dalam bahasa Indonesia.
- source_word: תְּלָמֶיהָ
  choice: alur-alurnya
  rationale: תלם adalah alur tanah yang terbentuk oleh pembajakan. “Alur-alurnya” tepat dalam konteks pertanian dan cukup mudah dipahami.
- source_word: יִבְכָּיוּן
  choice: menangis
  rationale: Kata בכה lazim berarti menangis atau meratap. “Menangis” mempertahankan personifikasi puitis serta membedakannya dari “berseru” pada baris sebelumnya.
