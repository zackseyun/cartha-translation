lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan rangkaian sumpah pembelaan diri Ayub; bentuk sederhana ini alami dalam bahasa Indonesia dan mempertahankan struktur bersyarat.
- source_word: אֶמְנַע
  choice: aku menahan
  rationale: Bentuk Qal dari מנע berarti menahan, tidak memberikan, atau menghalangi; konteksnya meninjau tindakan masa lalu dalam rumusan bersyarat.
- source_word: מֵחֵפֶץ דַּלִּים
  choice: dari orang miskin apa yang mereka inginkan
  rationale: Susunan ini mempertahankan relasi verba dengan preposisi מן dan memaknai חֵפֶץ sebagai sesuatu yang diinginkan, tanpa mempersempitnya secara pasti menjadi kebutuhan.
- source_word: דַּלִּים
  choice: orang miskin
  rationale: דַּל dapat menunjuk orang lemah, rendah, atau miskin; dalam konteks tanggung jawab sosial, 'orang miskin' paling jelas dan wajar.
- source_word: וְ
  choice: atau
  rationale: Dalam rangkaian protasis sumpah, waw menghubungkan tuduhan alternatif/sejajar; 'atau' menghasilkan hubungan yang alami dalam bahasa Indonesia.
- source_word: עֵינֵי אַלְמָנָה אֲכַלֶּה
  choice: membuat mata seorang janda menanti sampai letih
  rationale: Ungkapan harfiah tentang menghabiskan mata menggambarkan penantian penuh harap yang berkepanjangan hingga melelahkan; terjemahan ini menyampaikan daya idiomnya sambil mempertahankan citra mata.
