  text: הֲ/לֹא אֵ֥יד לְ/עַוָּ֑ל וְ֝/נֵ֗כֶר לְ/פֹ֣עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: id
  text: Bukankah malapetaka menimpa orang lalim[a], dan bencana menimpa mereka yang melakukan kejahatan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang berlaku tidak adil” atau “pelaku kesalahan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka yang mengerjakan kejahatan”; kata yang diterjemahkan “kejahatan” juga dapat berarti “kesusahan” atau “kefasikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אֵיד
  choice: malapetaka
  rationale: Menyatakan kemalangan yang menghancurkan atau kebinasaan dengan bobot puitis yang sesuai dengan konteks akibat moral.
- source_word: לְעַוָּל
  choice: bagi orang yang tidak benar
  rationale: Menunjuk kepada orang yang bercirikan ketidakadilan atau perbuatan salah tanpa mempersempitnya menjadi satu jenis pelanggaran tertentu.
- source_word: וְנֵכֶר
  choice: dan bencana
  rationale: Dalam paralelisme ini menunjuk pada akibat buruk atau nasib celaka; pilihan ini membedakannya secara wajar dari אֵיד tanpa memakai arti 'keterasingan' yang kurang sesuai dengan konteks.
- source_word: לְפֹעֲלֵי
  choice: bagi mereka yang melakukan
  rationale: Mengungkapkan tindakan yang menjadi ciri atau kebiasaan pelakunya dalam susunan Indonesia yang alami.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Dalam gabungan dengan bentuk partisipial, kata ini menunjuk pada tindakan jahat yang mengandung kesalahan moral; 'kejahatan' jelas dan berbobot bagi pembaca modern.
theological_decisions:
- issue: Istilah moral dalam sastra hikmat
  choice: Ayat diterjemahkan sebagai prinsip umum bahwa malapetaka diperuntukkan bagi orang tidak benar dan pelaku kejahatan, tanpa menentukan mekanismenya.
  alternative: Menafsirkannya secara eksplisit sebagai hukuman langsung dari Allah atau semata-mata sebagai akibat alamiah.
  rationale: Teks Ibrani menghubungkan malapetaka dengan orang tidak benar dan pelaku kejahatan, tetapi ayat ini sendiri tidak menyebut siapa yang mendatangkannya atau bagaimana hal itu terjadi. Ketegangan tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang bermartabat. Paralelisme dua baris dipertahankan melalui pasangan 'malapetaka/bencana' dan 'orang yang tidak benar/mereka yang melakukan kejahatan'. Ungkapan 'tersedia bagi' menyampaikan fungsi preposisi לְ sebagai peruntukan tanpa menambahkan pelaku penghukuman.
