base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: id
  text: Jika aku menjadikan emas sebagai sandaranku[a] dan berkata kepada emas murni[b], ‘Engkaulah andalanku[c],’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harapanku” atau “kepercayaanku.”
    reason: lexical_alternative
  - marker: b
    text: “Emas murni” menerjemahkan כֶּתֶם, yaitu emas bermutu tinggi atau emas yang telah dimurnikan.
    reason: lexical_alternative
  - marker: c
    text: Atau “tempat kepercayaanku” atau “jaminan keamananku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan protasis dalam sumpah pembelaan diri Ayub dan mempertahankan bentuk bersyarat teks Ibrani.
- source_word: שַׂמְתִּי
  choice: aku menjadikan
  rationale: Dalam konstruksi dengan objek dan pelengkap predikatif, ungkapan ini secara alami menyatakan tindakan menetapkan emas sebagai sesuatu yang diandalkan.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung dan wajar bagi זָהָב.
- source_word: כִּסְלִי
  choice: sandaranku
  rationale: כֶּסֶל dapat berarti keyakinan, harapan, atau hal yang diandalkan. 'Sandaranku' menyampaikan ketergantungan pada kekayaan dan tetap membedakannya dari מִבְטַחִי pada klausa berikutnya.
- source_word: וְלַכֶּתֶם
  choice: dan kepada emas murni
  rationale: כֶּתֶם menunjuk pada emas bermutu tinggi atau yang dimurnikan; 'emas murni' alami dalam bahasa Indonesia dan membedakannya dari זָהָב. Preposisi ל diterjemahkan 'kepada' sebagai penanda sasaran perkataan.
- source_word: אָמַרְתִּי
  choice: berkata
  rationale: Bentuk lampau Ibrani berada dalam rangkaian syarat yang sama; 'berkata' mengikuti 'Jika aku menjadikan' secara alami tanpa perlu mengulang penanda aspek.
- source_word: מִבְטַחִי
  choice: tempat kepercayaanku
  rationale: מִבְטָח dapat menunjuk pada rasa aman maupun sesuatu yang menjadi objek kepercayaan. Ungkapan ini mempertahankan gambaran emas sebagai hal yang dipercayai sekaligus menghindari penyamaan penuh dengan כִּסְלִי.
theological_decisions:
- issue: Penyangkalan Ayub bahwa ia mengandalkan kekayaan
  choice: 'Dipertahankan sebagai klausa bersyarat dalam rangkaian sumpah pembelaan diri: ''Jika aku menjadikan emas sebagai sandaranku ...'''
  alternative: Jika aku menaruh harapanku pada emas ...
  rationale: Bentuk ini menjaga daya etis-teologis teks, yakni penyangkalan bahwa kekayaan menjadi objek ketergantungan, tanpa memasukkan kategori doktrinal yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sandaran' dan 'tempat kepercayaan' mudah dipahami, mempertahankan paralelisme, serta mencerminkan dua istilah Ibrani yang berbeda tanpa menghapus kedekatan maknanya.
