  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: id
  text: karena aku takut kepada khalayak ramai[a], dan cemooh dari kelompok-kelompok kekerabatan[b] membuatku gentar, sehingga aku diam dan tidak keluar dari pintu[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika aku takut kepada khalayak ramai.” Dalam rangkaian sumpah Ayub, bahasa Ibraninya dapat dipahami sebagai keadaan bersyarat yang tidak dinyatakan secara lengkap.
    reason: syntactic_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kelompok-kelompok kekerabatan” dapat berarti keluarga besar, klan, atau kelompok kekerabatan.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini melukiskan sikap berdiam diri dan tidak keluar karena tekanan sosial yang disebutkan sebelumnya.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: karena
  rationale: Kata ini dapat menyatakan alasan, tetapi dalam rangkaian sumpah ketidakbersalahan Ayub juga dapat dipahami sebagai pembuka keadaan bersyarat yang tersirat. Pilihan utama mempertahankan alur sebab-akibat, sedangkan kemungkinan bersyarat dicatat dalam catatan kaki.
- source_word: אֶעֱרוֹץ הָמוֹן רַבָּה
  choice: aku takut kepada orang banyak
  rationale: אֶעֱרוֹץ menyatakan rasa takut atau gentar yang kuat, sedangkan הָמוֹן רַבָּה menunjuk pada khalayak yang besar. Ungkapan Indonesia ini alami dan menonjolkan tekanan sosial tanpa menambahkan penafsiran.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: dan penghinaan kaum-kaum
  rationale: בּוּז berarti penghinaan atau cercaan. מִשְׁפָּחוֹת dapat menunjuk pada keluarga besar atau kelompok kekerabatan; 'kaum-kaum' lebih luas daripada keluarga inti dan sesuai dengan latar sosial kuno.
- source_word: יְחִתֵּנִי
  choice: membuatku gentar
  rationale: Bentuk kausatif dari חתת menyatakan bahwa sesuatu menyebabkan ketakutan atau meruntuhkan keberanian. 'Membuatku gentar' kuat, wajar, dan tidak berlebihan.
- source_word: וָאֶדֹּם
  choice: sehingga aku diam
  rationale: דמם berarti diam atau tidak bersuara. Dalam urutan ini, waw paling wajar dibaca sebagai hasil dari rasa takut yang baru disebutkan.
- source_word: לֹא אֵצֵא פָתַח
  choice: dan tidak keluar dari pintu
  rationale: Ungkapan ini menggambarkan tidak keluarnya Ayub melalui pintu atau ambang rumah. Terjemahan dipertahankan konkret dan ringkas.
theological_decisions:
- issue: Hubungan ayat ini dengan rumusan sumpah ketidakbersalahan Ayub
  choice: Menerjemahkan כִּי sebagai 'karena' dalam teks utama sambil mempertahankan kemungkinan pembacaan bersyarat dalam catatan kaki.
  alternative: Memulai dengan 'jika aku takut' sebagai kelanjutan langsung rumusan sumpah.
  rationale: Bahasa Ibrani bersifat eliptis dan memungkinkan kedua hubungan tersebut. Catatan kaki mencegah struktur sumpah yang tersirat dianggap pasti ataupun dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat dibuat alami tanpa menghapus sifat eliptis teks Ibrani; tanda pisah dipertahankan karena kalimat berlanjut ke seruan pada ayat berikutnya.
