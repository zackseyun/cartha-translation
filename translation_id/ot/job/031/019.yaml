review_pass:
  verdict: revise
  source_fidelity: Draf secara umum mempertahankan struktur bersyarat, dua kelompok orang yang membutuhkan, serta kesinambungan kalimat ke ayat berikutnya. Namun, “orang binasa” dalam bahasa Indonesia mudah dipahami sebagai orang yang telah mati atau mengalami kebinasaan, sedangkan partisip אֹבֵד menggambarkan orang yang sedang menuju kehancuran/binasa dalam keadaan kekurangan. “Penutup tubuh” juga terlalu harfiah dan tidak lazim untuk כְּסוּת dalam konteks pakaian.
  naturalness: “Jika aku pernah melihat” lebih wajar untuk tinjauan retrospektif dalam sumpah Ayub. “Seseorang yang sedang binasa karena kekurangan pakaian” menyampaikan keadaan yang berlangsung, dan “orang miskin tanpa pakaian” adalah ungkapan modern yang jelas serta puitis tanpa terdengar teknis.
  terminology: “Orang miskin” layak bagi אֶבְיוֹן dalam konteks ini. Kedua istilah Ibrani bagi pakaian tidak perlu dibedakan secara artifisial dalam bahasa Indonesia; “penutup tubuh” bukan padanan baku yang alami dan dapat mengaburkan maksud.
  issues:
  - severity: medium
    issue: “Orang binasa” tidak menyatakan aspek keadaan yang sedang berlangsung dari אֹבֵד.
    rationale: Frasa tersebut dapat terdengar sebagai fakta bahwa orang itu sudah binasa. Penambahan “yang sedang” mempertahankan nuansa partisipal tanpa menambahkan rincian teologis.
  - severity: medium
    issue: “Penutup tubuh” tidak alami dalam bahasa Indonesia modern.
    rationale: Dalam konteks ini כְּסוּת berarti pakaian/penutup sebagai sandang. “Tanpa pakaian” jelas, lazim, dan tetap setia pada makna konteks.
