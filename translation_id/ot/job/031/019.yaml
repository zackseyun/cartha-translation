  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Memperkenalkan anak kalimat bersyarat dalam sumpah pembelaan Ayub dan mempertahankan struktur protasis yang berlanjut ke ayat berikutnya.
- source_word: אֶרְאֶה
  choice: aku melihat
  rationale: Bentuk imperfek orang pertama tunggal dalam konteks sumpah dapat dinyatakan secara alami dengan bentuk netral bahasa Indonesia; konteks pasal menunjukkan tinjauan atas perbuatannya.
- source_word: אֹבֵד
  choice: orang binasa
  rationale: Partisip dari אבד menggambarkan seseorang yang sedang menuju kebinasaan atau kehancuran; ungkapan ini mempertahankan keseriusan keadaan tanpa menambahkan sebab yang tidak dinyatakan.
- source_word: מִבְּלִי לְבוּשׁ
  choice: karena tidak memiliki pakaian
  rationale: Frasa ini menyatakan kekurangan atau ketiadaan pakaian dan dapat mengandung nuansa sebab; terjemahan ini alami serta sesuai dengan keadaan melarat yang digambarkan.
- source_word: וְאֵין
  choice: atau ... tanpa
  rationale: Walaupun וְ secara bentuk adalah konjungsi umum, dalam paralelisme bersyarat ini bahasa Indonesia lebih alami memakai 'atau' untuk menghadirkan gambaran sejajar, bukan dua syarat yang wajib terjadi bersamaan.
- source_word: כְּסוּת
  choice: penutup tubuh
  rationale: Kata ini menunjuk pada sesuatu yang menutupi, termasuk pakaian. 'Penutup tubuh' mempertahankan perbedaan leksikal dari לְבוּשׁ sekaligus memperjelas maksudnya bagi pembaca modern.
- source_word: לָאֶבְיוֹן
  choice: orang miskin
  rationale: אֶבְיוֹן menunjuk pada orang miskin atau berkekurangan; 'orang miskin' merupakan ungkapan Indonesia yang alami dan langsung dalam konteks kebutuhan material.
