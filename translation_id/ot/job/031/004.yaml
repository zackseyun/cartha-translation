  text: Does he not see my ways and count all my steps?[a]
translation:
  language: id
  text: Bukankah Dia melihat jalan-jalanku dan menghitung semua langkahku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengamati perilakuku dan menomori semua langkahku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif dan terdengar alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: Dia
  rationale: Mempertahankan pronomina mandiri yang menunjuk kepada Allah dalam konteks, tanpa menambahkan penekanan berlebihan seperti 'Dia sendiri'.
- source_word: יִרְאֶה
  choice: melihat
  rationale: Makna dasar ראה adalah 'melihat'; pilihan ini mempertahankan gambaran konkret tentang pengamatan ilahi.
- source_word: דְרָכָי
  choice: jalan-jalanku
  rationale: Mempertahankan bentuk jamak serta metafora Ibrani yang dapat mencakup perjalanan dan cara hidup.
- source_word: וְכָל
  choice: dan ... semua
  rationale: Meneruskan hubungan kumulatif antara kedua klausa sekaligus mempertahankan cakupan menyeluruh.
- source_word: צְעָדָי
  choice: langkahku
  rationale: Ungkapan Indonesia yang alami untuk gambaran setiap gerak atau tindakan Ayub; makna kolektifnya sudah ditandai oleh 'semua'.
- source_word: יִסְפּוֹר
  choice: menghitung
  rationale: Menyampaikan arti dasar 'menghitung/menomori' secara ringkas dan mempertahankan citra konkret teks.
theological_decisions:
- issue: Pengetahuan ilahi yang diungkapkan melalui kata kerja antropomorfis
  choice: Mempertahankan pertanyaan retoris bahwa Allah melihat jalan-jalan Ayub dan menghitung semua langkahnya.
  alternative: Tidakkah Dia mengamati perilakuku dan mencatat semua tindakanku?
  rationale: Teks Ibrani memakai gambaran konkret melihat dan menghitung. Terjemahan mempertahankan daya teologis gambaran itu tanpa mengubahnya menjadi rumusan abstrak tentang kemahatahuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Bukankah' mempertahankan sifat retoris ayat; 'jalan-jalanku' sengaja mempertahankan metafora dan bentuk jamak sumber. Pronomina 'Dia' ditulis dengan huruf kapital karena merujuk kepada Allah.
