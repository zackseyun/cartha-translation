  edition: WLC
  text: מִסְפַּ֣ר צְ֭עָדַ/י אַגִּידֶ֑/נּוּ כְּמוֹ נָ֝גִ֗יד אֲקָרֲבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/037.yaml
  text: I would declare to him the number of my steps[c][b][a]; like a prince I would approach him.
translation:
  language: id
  text: Jumlah langkahku[c] akan kunyatakan kepadanya[a]; seperti seorang pemimpin[b], aku akan mendekatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “-nya” dapat merujuk kepada Allah atau kepada pihak yang menuduh Ayub dalam konteks terdekat. Pada frasa pertama, bahasa Ibrani juga dapat diterjemahkan “akan kunyatakan itu”.
    reason: alternative_reading
  - marker: b
    text: Atau “seorang penguasa” atau “seorang bangsawan”.
    reason: lexical_alternative
  - marker: c
    text: Atau “Pertanggungjawaban mengenai langkah-langkahku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: jumlah
  rationale: Kata benda ini berarti jumlah atau hitungan. Pilihan “jumlah” mempertahankan ungkapan konkret bahasa Ibrani, sambil membiarkan konteks menyiratkan pertanggungjawaban atas seluruh jalan hidup Ayub.
- source_word: צְעָדַי
  choice: langkahku
  rationale: Bentuk jamak ini secara harfiah menunjuk pada langkah-langkah dan secara kiasan dapat menggambarkan perilaku atau perjalanan hidup. “Langkahku” alami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: אַגִּידֶנּוּ
  choice: akan kunyatakan kepadanya
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. Terjemahan ini mengikuti kemungkinan bahwa akhiran orang ketiga tunggal merujuk kepada pribadi yang dihadapi Ayub, tetapi catatan kaki mempertahankan kemungkinan gramatikal bahwa akhiran itu merujuk pada “jumlah” tersebut.
- source_word: כְּמוֹ
  choice: seperti
  rationale: Partikel ini menyatakan perbandingan; “seperti” merupakan padanan langsung dan alami.
- source_word: נָגִיד
  choice: seorang pemimpin
  rationale: Kata ini dapat berarti pemimpin, penguasa, atau bangsawan. “Pemimpin” mempertahankan nuansa kedudukan dan kewibawaan tanpa menyiratkan gelar kerajaan tertentu.
- source_word: אֲקָרֲבֶנּוּ
  choice: aku akan mendekatinya
  rationale: Bentuk verba ini menyatakan tindakan datang mendekat, dan akhiran orang ketiga tunggal dipertahankan sebagai “-nya”. Ungkapan tersebut menyampaikan keberanian Ayub untuk tampil menghadap tanpa menambahkan tafsiran tentang siapa yang dihadapinya.
theological_decisions:
- issue: Rujukan akhiran orang ketiga tunggal pada “kepadanya” dan “mendekatinya”
  choice: Teks memakai “-nya” tanpa menyebut identitas rujukannya.
  alternative: 'Rujukannya dapat dipahami sebagai Allah atau pihak yang menuduh Ayub; pada אַגִּידֶנּוּ, akhiran itu juga mungkin menunjuk pada “jumlah” langkahnya: “akan kunyatakan itu”.'
  rationale: Bahasa Ibrani tidak menyebut rujukan tersebut secara eksplisit. Konteks hukum dalam ayat-ayat sekitar memungkinkan lebih dari satu pemahaman, sehingga terjemahan dan catatan kaki tidak menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa yang dipakai bersifat puitis, formal, dan tetap mudah dipahami. Susunan awal “Jumlah langkahku” mempertahankan penekanan teks Ibrani. Kata ganti “-nya” sengaja dibiarkan tanpa rujukan eksplisit agar ambiguitas sumber tetap terjaga.
