  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: id
  text: Pendatang tidak bermalam di luar; pintu-pintuku kubuka bagi musafir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang asing tidak menginap di luar; pintuku kubuka bagi orang yang sedang dalam perjalanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: di luar
  rationale: Ungkapan ini menunjuk pada tempat di luar rumah atau di tempat terbuka; “di luar” adalah padanan Indonesia yang langsung dan alami.
- source_word: יָלִין
  choice: bermalam
  rationale: Kata kerja לין secara khusus menyatakan tinggal atau menginap semalam; “bermalam” ringkas dan tepat.
- source_word: גֵּר
  choice: pendatang
  rationale: גֵּר menunjuk pada orang bukan pribumi yang tinggal di tengah suatu masyarakat dan kerap berada dalam posisi rentan. “Pendatang” mudah dipahami tanpa membatasinya sekadar pada orang yang tidak dikenal.
- source_word: דְּלָתַי
  choice: pintu-pintuku
  rationale: Bentuk Ibrani adalah jamak dengan akhiran orang pertama tunggal; bentuk ulang Indonesia mempertahankan gambaran jamak tersebut.
- source_word: לָאֹרַח
  choice: bagi musafir
  rationale: Dalam konteks ini אֹרַח menunjuk kepada orang yang sedang dalam perjalanan dan membutuhkan tumpangan; “musafir” merupakan istilah Indonesia yang alami dan bermartabat.
- source_word: אֶפְתָּח
  choice: selalu kubuka
  rationale: Bentuk imperfek dalam pembelaan Ayub paling wajar dipahami sebagai tindakan kebiasaan pada masa lampau. “Selalu kubuka” menyampaikan sifat berulang itu tanpa menjadikannya janji atau tindakan masa depan.
