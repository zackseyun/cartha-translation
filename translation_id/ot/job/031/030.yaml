  text: I have not allowed my mouth to sin by asking for his life with a curse[a].
translation:
  language: id
  text: Aku tidak membiarkan mulutku berdosa dengan meminta nyawanya dengan kutukan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan sumpah.” Kata benda Ibrani ini dapat berarti “kutukan” atau “sumpah”, tetapi konteks harapan agar orang itu celaka lebih mendukung arti “kutukan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: membiarkan
  rationale: Dalam konstruksi dengan infinitif, bentuk harfiah 'memberikan' menyatakan izin; 'membiarkan' menyampaikan idiom itu secara alami.
- source_word: לַחֲטֹא
  choice: berdosa
  rationale: Kata ini mempertahankan makna moralnya yang lazim, yakni melakukan kesalahan atau dosa.
- source_word: חִכִּי
  choice: mulutku
  rationale: Secara harfiah berarti 'langit-langit mulutku', tetapi dalam puisi menjadi metonimia bagi alat bicara; 'mulutku' alami dan jelas dalam konteks kutukan lisan.
- source_word: לִשְׁאֹל
  choice: dengan meminta
  rationale: Infinitif ini menjelaskan cara mulut berdosa; 'dengan meminta' menyatakan hubungan tersebut secara wajar dalam bahasa Indonesia.
- source_word: בְּאָלָה
  choice: melalui kutuk
  rationale: אָלָה dapat berarti kutuk atau sumpah. Konteks keinginan mencelakakan musuh lebih mendukung 'kutuk', sedangkan kemungkinan 'sumpah' dicatat dalam catatan kaki.
- source_word: נַפְשׁוֹ
  choice: nyawanya
  rationale: נפשׁ di sini menunjuk pada hidup orang itu; 'nyawanya' secara alami mengungkapkan bahwa kutuk tersebut memohon kematiannya, tanpa memasukkan gagasan metafisik tentang jiwa.
