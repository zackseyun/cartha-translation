  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kata 'kutuk' dipilih sebagai nomina agar padat dan sesuai dengan gaya puisi hikmat; ambiguitas leksikal sumber dipertahankan melalui catatan kaki.
