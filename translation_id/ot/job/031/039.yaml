  yaml_path: translation/ot/job/031/039.yaml
  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: id
  text: jika aku telah memakan hasilnya tanpa membayar, atau membuat para pemiliknya kehilangan semangat[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “menyebabkan nyawa para pemiliknya mengembuskan napas”; dapat juga berarti “membuat para pemiliknya terengah-engah.” Kata kerja Ibrani yang dipakai di sini jarang ditemukan; klausa ini mungkin menunjuk pada penindasan berat atau pada tindakan yang menyebabkan kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: hasilnya
  rationale: Secara harfiah berarti 'kekuatannya', tetapi dalam konteks tanah menunjuk pada daya produktifnya, yakni hasil yang diberikannya.
- source_word: אָכַלְתִּי
  choice: aku telah memakan
  rationale: Mempertahankan verba umum 'makan' dan bentuk orang pertama dalam rangkaian sumpah Ayub.
- source_word: בְלִי כָסֶף
  choice: tanpa membayar
  rationale: כֶּסֶף secara harfiah berarti 'perak', tetapi di sini berfungsi sebagai uang atau pembayaran; ungkapan ini menyatakan pengambilan hasil tanpa memberikan imbalan.
- source_word: נֶפֶשׁ בְּעָלֶיהָ
  choice: para pemiliknya ... napas terakhir
  rationale: נֶפֶשׁ dapat berarti hidup, nyawa, atau napas; bersama verba yang langka ini, frasa tersebut kemungkinan menggambarkan hilangnya nyawa atau keadaan terengah-engah akibat penindasan.
- source_word: בְּעָלֶיהָ
  choice: para pemiliknya
  rationale: Bentuk jamak dengan sufiks feminin merujuk kepada orang-orang yang memiliki atau berhak atas tanah itu.
- source_word: הִפָּחְתִּי
  choice: membuat ... mengembuskan
  rationale: Bentuk Hifil dari נפח secara dasar berkaitan dengan meniup atau mengembuskan napas. Terjemahan utama mempertahankan kemungkinan makna menyebabkan kematian, sedangkan ketidakpastian leksikal dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah klausa terakhir menyatakan kematian atau penderitaan berat
  choice: Teks utama memakai 'mengembuskan napas terakhir', yang menyatakan kemungkinan menyebabkan kematian.
  alternative: membuat para pemiliknya terengah-engah; membuat para pemiliknya putus asa
  rationale: Verba הִפָּחְתִּי langka dan konstruksi dengan נֶפֶשׁ dapat dipahami sebagai menyebabkan nyawa berakhir atau membuat seseorang terengah-engah karena penindasan. Ambiguitas ini tidak diselesaikan secara dogmatis dan dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'aku' mengikuti suara sumpah pribadi Ayub. Tanda pisah mempertahankan klausa bersyarat yang berlanjut ke ayat berikutnya.
