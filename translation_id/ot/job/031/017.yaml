  text: וְ/אֹכַ֣ל פִּתִּ֣/י לְ/בַדִּ֑/י וְ/לֹא אָכַ֖ל יָת֣וֹם מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/017.yaml
  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: id
  text: jika aku memakan sepotong makananku seorang diri, dan anak yatim[a] tidak makan darinya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang tidak berayah.” Kata Ibrani secara harfiah menunjuk kepada seseorang yang telah kehilangan ayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  choice: jika aku memakan
  rationale: Dalam rangkaian sumpah pembelaan diri di Ayub 31, waw dipahami sebagai pembuka anak kalimat bersyarat; bentuk Qal orang pertama tunggal berarti “aku makan/memakan”.
- source_word: פִּתִּי
  choice: suap makananku
  rationale: Kata ini menunjuk pada sepotong atau sesuap makanan. Pilihan ini mempertahankan gambaran konkret tanpa membatasi maknanya hanya pada roti.
- source_word: לְבַדִּי
  choice: seorang diri
  rationale: Ungkapan ini berarti “sendirian” atau “seorang diri” dan di sini menekankan bahwa makanan itu tidak dibagikan.
- source_word: וְלֹא אָכַל
  choice: dan ... tidak turut memakannya
  rationale: Klausa kedua dikoordinasikan dengan klausa pertama. Kata “turut” menyampaikan secara alami bahwa anak yatim tidak mendapat bagian dari makanan Ayub, sedangkan akhiran objek pada “memakannya” mewakili מִמֶּנָּה, “darinya”.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Dalam pemakaian Ibrani Alkitab, istilah ini secara khusus menunjuk kepada orang yang kehilangan ayah dan karena itu rentan secara sosial. “Anak yatim” adalah padanan Indonesia yang alami.
- source_word: מִמֶּנָּה
  choice: memakannya
  rationale: Akhiran feminin tunggal merujuk kembali kepada פִּתִּי. Dalam bahasa Indonesia, hubungan ini lebih alami dinyatakan dengan akhiran objek “-nya” daripada “makan darinya”.
