  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: id
  text: Lalu, apa yang akan kulakukan ketika Allah bangkit? Dan ketika Ia menuntut pertanggungjawaban dariku[a], apa yang akan kujawab kepada-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika Ia mengunjungi aku” atau “ketika Ia memeriksa aku.” Kata Ibrani ini dapat berarti mengunjungi, memeriksa, atau menuntut pertanggungjawaban; dalam konteks ini, nuansa pertanggungjawaban yudisial lebih kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: Lalu, apa
  rationale: Kata tanya מָה dengan penghubung וּ melanjutkan alasan Ayub sekaligus membuka pertanyaan retoris; “Lalu, apa” alami dalam bahasa Indonesia dan mempertahankan daya penghubungnya.
- source_word: אֶעֱשֶׂה
  choice: yang akan kulakukan
  rationale: Bentuk imperfek orang pertama tunggal menggambarkan tindakan Ayub dalam keadaan mendatang yang dibayangkan; konstruksi “apa yang akan kulakukan” menyampaikan nuansa itu secara wajar.
- source_word: כִּי יָקוּם
  choice: ketika Allah bangkit
  rationale: כִּי dipahami secara temporal, sedangkan קום berarti bangkit atau berdiri. “Bangkit” mempertahankan metafora Allah yang tampil untuk bertindak tanpa menjabarkannya secara berlebihan.
- source_word: אֵל
  choice: Allah
  rationale: אֵל merupakan sebutan umum bagi Allah dalam ayat ini; tidak diperlukan perluasan seperti “Yang Mahakuasa”.
- source_word: וְכִי יִפְקֹד
  choice: Ketika Ia meminta pertanggungjawabanku
  rationale: פקד dapat berarti mengunjungi, memeriksa, memperhatikan, atau menuntut pertanggungjawaban. Paralelnya dengan pertanyaan tentang jawaban Ayub mendukung nuansa pemeriksaan yudisial, sementara catatan kaki mempertahankan keluasan leksikalnya.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: apa yang akan kujawab kepada-Nya
  rationale: Bentuk Hifil dari שוב di sini bermakna memberikan jawaban; akhiran orang ketiga tunggal maskulin dirender sebagai “kepada-Nya,” merujuk kepada Allah.
theological_decisions:
- issue: Gambaran penghakiman ilahi
  choice: Ayat ini menggambarkan Allah bangkit dan meminta pertanggungjawaban Ayub, tanpa membatasinya pada penghakiman akhir.
  alternative: Menerjemahkan פקד secara lebih umum sebagai “mengunjungi” atau “memeriksa,” atau menafsirkannya secara khusus sebagai penghakiman eskatologis.
  rationale: Konteks tentang menjawab Allah mendukung nuansa pemeriksaan dan pertanggungjawaban. Namun, ayat ini tidak menentukan bahwa yang dimaksud khusus penghakiman akhir, sehingga terjemahan tidak memasukkan pembatasan doktrinal tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan retoris. Metafora “Allah bangkit” dipertahankan, sedangkan “meminta pertanggungjawabanku” menyampaikan nuansa forensik secara alami. Kapitalisasi pronomina ilahi mengikuti register Alkitab Indonesia yang umum.
