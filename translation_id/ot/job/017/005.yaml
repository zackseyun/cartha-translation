  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: id
  text: Orang yang mengadukan sahabat-sahabatnya demi mendapat bagian[a], mata anak-anaknya akan menjadi redup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi suatu jatah,” “demi keuntungan,” atau, menurut penafsiran lain, “demi sanjungan.” Frasa Ibraninya sulit, tetapi tampaknya menggambarkan perlakuan terhadap sahabat demi keuntungan pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: demi mendapat bagian
  rationale: חֵלֶק berarti “bagian” atau “jatah.” Dalam konteks yang sulit ini, frasa tersebut kemungkinan menunjukkan tindakan demi keuntungan pribadi. Terjemahan ini mempertahankan arti dasar nomina tanpa menambahkan “jarahan” ke dalam teks utama.
- source_word: יַגִּיד
  choice: mengadukan
  rationale: Bentuk Hifil dari נגד pada dasarnya berarti “memberitahukan” atau “menyatakan.” Dengan sahabat sebagai objek dan keuntungan sebagai motif, “mengadukan” secara alami menyampaikan tindakan melaporkan atau menyerahkan mereka untuk kepentingan diri.
- source_word: רֵעִים
  choice: sahabat-sahabatnya
  rationale: רֵעִים berarti “sahabat” atau “rekan.” Bentuk dengan akhiran posesif dalam bahasa Indonesia memperjelas hubungan dengan pelaku yang tersirat dan menonjolkan unsur pengkhianatan.
- source_word: וְעֵינֵי בָנָיו
  choice: mata anak-anaknya
  rationale: בנים dapat merujuk kepada anak laki-laki atau anak-anak secara umum. “Anak-anaknya” wajar dalam bahasa Indonesia dan tidak mempersempit cakupan yang mungkin dimaksud.
- source_word: תִּכְלֶנָה
  choice: akan menjadi kabur
  rationale: כלה dapat berarti habis, merana, atau gagal. Ketika subjeknya mata, “menjadi kabur” mempertahankan gambaran mata yang kehilangan daya atau menjadi redup.
