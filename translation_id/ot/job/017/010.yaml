  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: id
  text: Namun, kalian semua, kembalilah dan datanglah sekarang[a]; aku tidak akan menemukan seorang pun yang bijaksana di antara kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbaliklah dan datanglah.” Ungkapan Ibrani ini merupakan seruan yang kuat, kemungkinan besar tantangan kepada sahabat-sahabat Ayub untuk mencoba lagi dengan argumentasi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Menandai peralihan yang tegas dan berlawanan, dengan ragam bahasa Indonesia yang wajar dan bermartabat.
- source_word: כֻּלָּם
  choice: kalian semua
  rationale: Bentuk-bentuk verba orang kedua jamak menunjukkan bahwa Ayub menyapa langsung seluruh lawan bicaranya.
- source_word: תָּשֻׁבוּ
  choice: kembalilah
  rationale: Bentuk ini berfungsi sebagai seruan atau tantangan agar para sahabat Ayub kembali mengajukan perkara mereka.
- source_word: וּבֹאוּ נָא
  choice: dan datanglah sekarang
  rationale: Mempertahankan verba kedua serta daya desak נָא tanpa mengubahnya menjadi permohonan yang terlalu sopan.
- source_word: וְלֹא אֶמְצָא
  choice: aku tidak akan menemukan
  rationale: Bentuk imperfek paling wajar dipahami sebagai hasil yang akan tetap berlaku sesudah tantangan tersebut.
- source_word: בָכֶם
  choice: di antara kalian
  rationale: Menunjukkan bahwa orang bijaksana itu dicari dalam kelompok lawan bicara Ayub.
- source_word: חָכָם
  choice: seorang pun yang bijaksana
  rationale: Adjektiva tunggal ini dipakai secara substantival. Ungkapan Indonesia tersebut alami dalam kalimat negatif dan tetap merujuk pada satu orang dari antara para sahabat Ayub.
theological_decisions:
- issue: Rujukan tunggal maskulin חָכָם
  choice: seorang pun yang bijaksana
  alternative: seorang laki-laki bijaksana
  rationale: Bahasa Indonesia tidak menandai gender gramatikal pada kata 'orang'. Konteks tetap memperlihatkan bahwa yang disapa ialah para sahabat Ayub, sehingga penambahan 'laki-laki' tidak diperlukan dan akan membuat kalimat kurang alami.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan dua verba dipertahankan untuk mencerminkan seruan Ibrani, sedangkan 'kalian' dipakai karena Ayub berbicara langsung kepada beberapa sahabatnya.
