  text: My eye has grown dim from grief[b][a], and all my members are like a shadow.
translation:
  language: id
  text: Mataku menjadi redup karena dukacita[a], dan semua anggota tubuhku[b] seperti bayang-bayang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena kemarahan,” “karena kekesalan,” atau “karena kesedihan.” Kata Ibrani ini dapat menyatakan berbagai bentuk gejolak batin.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “anggota tubuhku” dapat juga dipahami sebagai “rupaku” atau “bentuk tubuhku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: menjadi redup
  rationale: Kata kerja כהה menyatakan menjadi redup, lemah, atau pudar. Ungkapan ini mempertahankan gambaran penglihatan yang melemah dan terdengar alami dalam bahasa Indonesia.
- source_word: מִכַּעַשׂ
  choice: karena dukacita
  rationale: כַּעַשׂ dapat menunjuk pada dukacita, kekesalan, kejengkelan, atau kemarahan. Dalam konteks ratapan dan penderitaan Ayub, 'dukacita' paling sesuai, sementara kemungkinan makna lainnya dipertahankan dalam catatan kaki.
- source_word: עֵינִי
  choice: Mataku
  rationale: Bentuk Ibrani ini tunggal dengan akhiran orang pertama tunggal. 'Mataku' mempertahankan bentuk sumber dan dapat dipahami sebagai mata atau daya penglihatan Ayub.
- source_word: וִיצֻרַי
  choice: anggota tubuhku
  rationale: Bentuk ini kemungkinan menunjuk pada bagian-bagian atau rupa tubuh Ayub. 'Anggota tubuhku' mempertahankan bentuk jamak dan hubungannya dengan כֻּלָּם, tanpa membatasi maknanya hanya pada tangan dan kaki.
- source_word: כַּצֵּל
  choice: seperti bayang-bayang
  rationale: Terjemahan ini mempertahankan perbandingan puitis yang menyiratkan ketidakberwujudan, kelemahan, atau tubuh yang menyusut.
- source_word: כֻּלָּם
  choice: semua
  rationale: Kata ini merujuk secara kolektif kepada anggota-anggota tubuh Ayub; 'semua' mempertahankan cakupan menyeluruhnya secara ringkas.
