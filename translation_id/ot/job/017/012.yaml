translation:
  language: id
  text: Mereka menjadikan malam sebagai siang; mereka berkata, “Terang dekat,” di hadapan kegelapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka berkata” tidak tertulis secara eksplisit dalam teks Ibrani, tetapi dapat dipahami sebagai pengantar bagi pernyataan “Terang dekat.” Frasa “di hadapan kegelapan” menerjemahkan secara dekat ungkapan Ibrani yang secara harfiah berarti ‘di muka kegelapan’.
    reason: Menandai pengantar ujaran yang tersirat dan menjelaskan padanan yang dekat dengan ungkapan Ibrani tanpa memaksakan satu penafsiran konteks.
lexical_decisions:
- source_word: לַיְלָה לְיוֹם יָשִׂימוּ
  choice: Mereka menjadikan malam sebagai siang
  rationale: Mempertahankan urutan gagasan dan kontras harfiah antara malam dan siang, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: אוֹר קָרוֹב
  choice: “Terang sudah dekat”
  rationale: Menerjemahkan ungkapan nominal Ibrani secara ringkas; “sudah” menyampaikan keadaan dekat tanpa mengubahnya menjadi janji bahwa terang pasti segera datang.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: di tengah kegelapan
  rationale: Secara harfiah ungkapan ini berkaitan dengan ‘di hadapan/muka kegelapan’; padanan ini menyampaikan bahwa pernyataan tentang terang dibuat ketika kegelapan nyata sedang meliputi keadaan tersebut, tanpa menghasilkan frasa Indonesia yang janggal.
theological_decisions:
- issue: Siapa yang menjadi subjek jamak ‘mereka’ dan apakah ucapan langsung ditandai dalam bahasa Ibrani
  choice: Mempertahankan subjek umum “mereka” dan menampilkan bagian kedua sebagai perkataan mereka
  alternative: 'Membaca kedua bagian sebagai satu tindakan tanpa sisipan “kata mereka”: “Mereka menjadikan malam sebagai siang, terang dekat di tengah kegelapan.”'
  rationale: Konteks memungkinkan ‘mereka’ merujuk kepada pihak yang dibicarakan Ayub, tetapi ayat ini tidak menamai mereka. Sisipan “kata mereka” membuat hubungan sintaksis yang tersirat menjadi jelas, namun dicatat karena verba ‘berkata’ tidak tertulis secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kontras puitis malam–siang serta terang–kegelapan dipertahankan; identitas subjek jamak tidak diperjelas melampaui teks.
