  text: רוּחִ֣/י חֻ֭בָּלָה יָמַ֥/י נִזְעָ֗כוּ קְבָרִ֥ים לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/001.yaml
  text: My spirit is broken[a]; my days are extinguished[b]; graves await me.
translation:
  language: id
  text: Rohku telah hancur[a]; hari-hariku telah padam[b]; liang-liang kubur menantiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Napasku telah hancur.” Kata Ibrani רוּחַ dapat berarti “roh” atau “napas”.
    reason: lexical_alternative
  - marker: b
    text: Atau “hari-hariku telah dipadamkan.” Kata kerjanya tampaknya menggambarkan sesuatu yang dipadamkan, seperti nyala api.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: rohku
  rationale: רוּחַ dapat berarti roh, napas, atau angin. Dalam ratapan Ayub, “rohku” secara wajar menunjuk pada daya hidup atau batinnya, sementara arti “napasku” tetap dicatat sebagai kemungkinan.
- source_word: חֻבָּלָה
  choice: telah hancur
  rationale: Bentuk pasif ini menyatakan keadaan yang dirusak atau dihancurkan. “Telah hancur” alami dalam bahasa Indonesia dan mempertahankan kuatnya ratapan tanpa menentukan cara kehancuran itu.
- source_word: יָמַי
  choice: hari-hariku
  rationale: Terjemahan langsung bentuk jamak dengan akhiran kepunyaan, yang menunjuk pada sisa masa hidup Ayub.
- source_word: נִזְעָכוּ
  choice: telah padam
  rationale: Kata kerja ini membawa gambaran sesuatu yang dipadamkan. “Telah padam” mempertahankan metafora berakhirnya hidup tanpa menambahkan objek yang tidak disebutkan.
- source_word: קְבָרִים
  choice: liang-liang kubur
  rationale: Bentuk jamak dipertahankan. “Liang-liang kubur” lebih alami dan konkret dalam bahasa Indonesia daripada “kubur-kubur”, sekaligus menyampaikan tempat penguburan.
- source_word: לִי
  choice: menantiku
  rationale: Secara harfiah berarti “bagiku” atau “untukku”. Dalam konteks ini, “menantiku” mengungkapkan bahwa penguburan terbentang di hadapan Ayub, tanpa mengubah maksud pokoknya.
