  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: id
  text: Orang-orang jujur tertegun oleh hal ini, dan orang yang tidak bersalah bangkit melawan orang fasik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang munafik.” Kata Ibrani חָנֵף dapat menunjuk kepada orang yang tidak saleh atau tidak menghormati Allah, dan dalam sebagian konteks secara tradisional diterjemahkan “orang munafik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: tercengang
  rationale: Bentuk qal dari שׁמם di sini menyatakan keterkejutan atau kengerian yang mendalam. “Tercengang” alami dalam bahasa Indonesia dan sesuai dengan reaksi emosional dalam konteks.
- source_word: יְשָׁרִים
  choice: orang-orang yang lurus hati
  rationale: Adjektiva jamak yang dipakai secara substantival ini menunjuk kepada orang yang lurus secara moral. “Lurus hati” mempertahankan gambaran dasarnya sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: עַל זֹאת
  choice: melihat hal ini
  rationale: עַל dengan זֹאת menandai hal yang menimbulkan reaksi. “Melihat hal ini” menyampaikan hubungan tersebut secara alami tanpa mempersempitnya menjadi sebab yang dijelaskan secara eksplisit.
- source_word: נָקִי
  choice: orang yang tidak bersalah
  rationale: Kata ini menunjuk kepada orang yang bebas dari kesalahan atau tuduhan bersalah; pilihan ini jelas dan tepat dalam konteks moral.
- source_word: יִתְעֹרָר
  choice: bangkit
  rationale: Bentuk hitpolel dari עור menggambarkan seseorang yang menggugah atau menggerakkan dirinya untuk bertindak. “Bangkit” mengungkapkan tindakan aktif itu secara alami, meskipun nuansa refleksifnya tersirat.
- source_word: עַל חָנֵף
  choice: melawan orang fasik
  rationale: Dengan verba yang menyatakan bangkit atau menggugah diri, עַל paling tepat dipahami secara adversatif. חָנֵף menunjuk kepada orang yang tidak saleh atau tidak menghormati Allah; “orang fasik” mempertahankan cakupan moral-keagamaannya.
theological_decisions:
- issue: Pemaknaan חָנֵף
  choice: orang fasik
  alternative: orang munafik
  rationale: Dalam konteks ini kata tersebut mengontraskan orang yang lurus dan tidak bersalah dengan orang yang tidak saleh. “Orang fasik” mempertahankan cakupan etis-keagamaan yang luas, sedangkan “orang munafik” dapat mempersempit maknanya menjadi ketidaktulusan yang berpura-pura.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur dua klausa paralel dipertahankan, sementara pilihan kata dibuat alami bagi pembaca umum.
