  text: לַ/שַּׁ֣חַת קָ֭רָאתִי אָ֣בִ/י אָ֑תָּה אִמִּ֥/י וַ֝/אֲחֹתִ֗/י לָֽ/רִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/014.yaml
  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: id
  text: Kepada liang kubur aku berseru, ‘Engkaulah ayahku,’ dan kepada belatung, ‘Ibuku dan saudara perempuanku.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: liang kubur
  rationale: Dalam konteks Ayub 17, kata ini menunjuk pada liang kematian atau kubur. Pilihan ini mempertahankan citra tempat kematian tanpa menyempitkannya menjadi gagasan abstrak seperti kebinasaan.
- source_word: קָרָאתִי
  choice: aku berseru
  rationale: Bentuk ini secara harfiah berarti ‘aku memanggil/berseru’. ‘Berseru’ alami dalam sapaan langsung yang bersifat puitis dan mempertahankan kekuatan ujarannya.
- source_word: רִמָּה
  choice: belatung
  rationale: Kata ini menunjuk pada ulat yang berkaitan dengan pembusukan mayat. ‘Belatung’ menyampaikan citra tersebut secara konkret dan wajar dalam bahasa Indonesia modern.
- source_word: אָבִי ... אִמִּי וַאֲחֹתִי
  choice: ayahku ... ibuku dan saudara perempuanku
  rationale: Istilah kekerabatan diterjemahkan langsung untuk mempertahankan personifikasi kematian dan pembusukan sebagai keluarga terdekat Ayub.
theological_decisions:
- issue: Hubungan Ayub dengan kematian dan pembusukan
  choice: Metafora kekerabatan dipertahankan tanpa penjelasan tambahan dalam teks.
  alternative: Menafsirkan ungkapan itu secara eksplisit sebagai penerimaan atau keakraban dengan kematian.
  rationale: Teks Ibrani menyajikan sapaan puitis yang tajam, tetapi tidak menjelaskan secara dogmatis apakah ini menyatakan kepasrahan, kedekatan, atau keniscayaan. Ambiguitas dan ketegangannya perlu dipertahankan.
translation_notes:
  register: Bahasa puitis, lugas, dan bermartabat. Susunan paralel sumber dipertahankan, sementara ‘saudara perempuanku’ dipilih agar relasi feminin yang ditandai bentuk Ibrani tetap jelas.
