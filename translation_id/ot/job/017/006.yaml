  text: וְֽ֭/הִצִּגַ/נִי לִ/מְשֹׁ֣ל עַמִּ֑ים וְ/תֹ֖פֶת לְ/פָנִ֣ים אֶֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/006.yaml
  text: He has made me a byword among the peoples[b][a], and I have become one before whom people spit.
translation:
  language: id
  text: Ia telah menjadikan aku buah bibir di antara bangsa-bangsa[a], dan aku telah menjadi sasaran ludah di depan umum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia telah menjadikan aku peribahasa di antara bangsa-bangsa.” Istilah Ibraninya kemungkinan menunjuk pada seseorang yang menjadi contoh terkenal untuk dicemooh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan aku menjadi ludah di hadapan wajah-wajah,” yaitu sasaran penghinaan yang dilakukan secara terang-terangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: Ia telah menjadikan aku
  rationale: Bentuk kausatif dengan akhiran orang pertama tunggal menyatakan bahwa Allah menyebabkan Ayub ditempatkan atau dijadikan sesuatu di hadapan umum. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan pelengkap sesudahnya.
- source_word: לִמְשֹׁל
  choice: buah bibir
  rationale: Dalam konteks ini, istilah tersebut menunjuk pada seseorang yang dijadikan ungkapan atau contoh yang terkenal, khususnya sebagai sasaran cemoohan. 'Buah bibir' mempertahankan nuansa kemasyhuran yang memalukan, sedangkan alternatif harfiah 'peribahasa' dapat terdengar terlalu netral.
- source_word: עַמִּים
  choice: di antara bangsa-bangsa
  rationale: Bentuk jamak עַמִּים dipertahankan dengan 'bangsa-bangsa', tanpa meratakannya menjadi 'orang banyak' atau bentuk tunggal.
- source_word: וְתֹפֶת
  choice: sasaran ludah
  rationale: Nomina yang langka ini kemungkinan mengacu pada ludah atau objek yang diludahi. 'Sasaran ludah' mempertahankan gambaran penghinaan secara jasmani sekaligus dapat dipahami dalam bahasa Indonesia.
- source_word: לְפָנִים
  choice: di depan umum
  rationale: Secara harfiah berarti 'di hadapan wajah-wajah'. Dalam konteksnya, frasa ini menyatakan penghinaan terbuka di hadapan orang lain; 'di depan umum' menyampaikan fungsi idiomatisnya tanpa menghilangkan unsur keterbukaan.
- source_word: אֶהְיֶה
  choice: aku telah menjadi
  rationale: Walaupun bentuknya imperfek, dalam puisi ini kata tersebut dapat menyatakan keadaan kini sebagai hasil tindakan sebelumnya. 'Telah menjadi' juga menjaga kesejajaran dengan 'telah menjadikan aku'.
theological_decisions:
- issue: Subjek tersirat pada וְהִצִּגַנִי
  choice: Ia
  alternative: Allah
  rationale: Bahasa Ibrani hanya memuat subjek orang ketiga tunggal yang tersirat. 'Ia' menjaga kesinambungan konteks dan tidak menambahkan nama ilahi yang tidak tertulis dalam ayat ini.
- issue: Pelaku tindakan meludah
  choice: Tidak dinyatakan secara eksplisit dalam teks utama
  alternative: orang meludahi aku
  rationale: Bahasa Ibrani memakai konstruksi nominal yang sukar dan tidak menyebut pelaku secara eksplisit. Terjemahan 'sasaran ludah' mempertahankan ketegangan ini tanpa menambahkan subjek manusia secara langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Buah bibir' dipilih sebagai idiom yang mudah dipahami, sementara catatan kaki mempertahankan alternatif 'peribahasa' dan bentuk harfiah baris kedua.
