  text: יָמַ֣/י עָ֭בְרוּ זִמֹּתַ֣/י נִתְּק֑וּ מ֖וֹרָשֵׁ֣י לְבָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/011.yaml
  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: id
  text: Hari-hariku telah berlalu; rencana-rencanaku terputus—segala dambaan hatiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “milik hatiku,” “hal-hal yang berharga bagi hatiku,” atau “warisan hatiku.” Ungkapan Ibrani ini langka dan sulit dipahami.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Hari-hariku
  rationale: Mempertahankan bentuk jamak dan idiom Ibrani yang menunjuk pada waktu atau masa hidup si pembicara.
- source_word: עָבְרוּ
  choice: telah berlalu
  rationale: 'Menyampaikan tindakan yang sudah terjadi: hari-hari Ayub telah lewat.'
- source_word: זִמֹּתַי
  choice: rencana-rencanaku
  rationale: Dalam konteks ratapan ini, kata tersebut menunjuk pada maksud atau rencana, tanpa nuansa buruk yang dapat terkandung dalam padanan seperti “muslihat”.
- source_word: נִתְּקוּ
  choice: terputus
  rationale: Mencerminkan bentuk pasif dan makna dicabut, diputuskan, atau dipisahkan, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: מוֹרָשֵׁי
  choice: segala dambaan
  rationale: Istilah ini langka dan sulit. Dalam kesejajaran dengan “rencana-rencanaku,” pilihan ini secara wajar mengungkapkan hal-hal yang dipegang atau dihargai oleh hati, sementara kemungkinan arti lain dipertahankan dalam catatan kaki.
- source_word: לְבָבִי
  choice: hatiku
  rationale: Padanan baku yang mempertahankan gambaran Ibrani tentang pusat pikiran dan keinginan batin.
