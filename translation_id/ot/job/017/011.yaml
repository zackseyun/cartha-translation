  register: Bahasa Indonesia modern yang puitis dan bermartabat. Tanda pisah mempertahankan hubungan aposisional antara “rencana-rencanaku” dan “segala dambaan hatiku” tanpa menghilangkan ketidakpastian ungkapan Ibraninya.
