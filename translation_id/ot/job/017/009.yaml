  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: id
  text: Namun, orang benar tetap berpegang pada jalannya, dan orang yang tangannya bersih semakin kuat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menambah kekuatan”; dapat juga dipahami sebagai “bertambah kuat” atau, dalam arti yang lebih sempit, “bertambah berani”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: Namun, ... tetap berpegang
  rationale: Kata penghubung וְ secara harfiah dapat diterjemahkan “dan”, tetapi dalam konteks ini bernuansa kontras terhadap uraian suram sebelumnya. Kata kerja אחז berarti memegang atau berpegang erat; “tetap berpegang” menyampaikan ketekunan tanpa menambah gagasan asing.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Kata sifat tunggal ini dipakai sebagai nomina dan menunjuk kepada sosok yang benar secara representatif. “Orang benar” alami dalam bahasa Indonesia dan tidak membatasi rujukannya pada laki-laki.
- source_word: דַּרְכּוֹ
  choice: jalannya
  rationale: דֶּרֶךְ dapat berarti jalan, lintasan, atau arah hidup. “Jalannya” mempertahankan citra konkret sekaligus makna metaforisnya.
- source_word: וּטֳהָר יָדַיִם
  choice: orang yang tangannya bersih
  rationale: Ungkapan harfiah “bersih tangan” menggambarkan ketidakbersalahan atau kemurnian moral. Terjemahan ini mempertahankan citra Ibrani dalam ungkapan Indonesia yang mudah dipahami.
- source_word: יֹסִיף אֹמֶץ
  choice: semakin kuat
  rationale: Secara harfiah frasa ini berarti “menambah kekuatan”. “Semakin kuat” merupakan ungkapan Indonesia yang alami dan mempertahankan gagasan pertambahan kekuatan, keteguhan, atau keberanian; kemungkinan lain dicatat dalam catatan kaki.
