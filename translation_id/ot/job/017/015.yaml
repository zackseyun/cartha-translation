  text: וְ֭/אַיֵּה אֵפ֣וֹ תִקְוָתִ֑/י וְ֝/תִקְוָתִ֗/י מִ֣י יְשׁוּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/015.yaml
  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: id
  text: Jadi, di manakah harapanku? Dan harapanku—siapa yang dapat melihatnya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “siapa yang akan memandangnya?” Kata kerja Ibrani dapat berarti “melihat” atau “memandang”, dan bentuk imperfeknya dapat dipahami sebagai futur (“akan”) atau modal (“dapat”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה
  choice: di manakah
  rationale: אַיֵּה adalah kata tanya tempat, “di mana?” Konjungsi וְ melanjutkan ratapan Ayub; dalam bahasa Indonesia, kesinambungan dan daya simpulnya disampaikan secara alami bersama אֵפוֹ dengan “Jadi”.
- source_word: אֵפוֹ
  choice: Jadi
  rationale: אֵפוֹ memberi penekanan atau nuansa kesimpulan pada pertanyaan. “Jadi” wajar dalam bahasa Indonesia modern dan tetap mempertahankan alur ratapan.
- source_word: תִקְוָתִי
  choice: harapanku
  rationale: תִּקְוָה berarti harapan atau pengharapan. Bentuk “harapanku” alami, ringkas, dan sesuai dengan konteks puitis.
- source_word: וְתִקְוָתִי
  choice: Harapanku
  rationale: Pengulangan kata dalam bahasa Ibrani dipertahankan untuk menjaga penekanan dan daya puitis, sementara וְ tidak diterjemahkan secara mekanis karena jeda antarkalimat sudah menyatakan kelanjutannya.
- source_word: מִי
  choice: siapa
  rationale: Padanan langsung dan alami untuk kata tanya orang.
- source_word: יְשׁוּרֶנָּה
  choice: yang dapat melihatnya
  rationale: Verba שׁור berarti “melihat, memandang.” Bentuk imperfek dapat dipahami secara modal (“dapat melihat”) atau futur (“akan melihat”); teks utama memakai nuansa modal yang sesuai dengan pertanyaan retoris, dengan alternatif dicatat dalam catatan kaki. Sufiks feminin tunggal merujuk kepada תִּקְוָה, yakni “harapan.”
theological_decisions:
- issue: Nuansa modal atau futur pada יְשׁוּרֶנָּה
  choice: dapat melihatnya
  alternative: akan memandangnya
  rationale: Konteks ratapan mendukung pertanyaan mengenai siapa yang mampu melihat adanya harapan itu, tetapi bentuk imperfek Ibrani juga dapat bernuansa futur. Ambiguitas tersebut dipertahankan melalui catatan kaki dan tidak dijadikan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan “harapanku” serta tanda pisah mempertahankan tekanan puitis dan retoris dari teks Ibrani.
