id: JOB.17.2
reference: Job 17:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם לֹ֣א הֲ֭תֻלִים עִמָּדִ֑/י וּ֝/בְ/הַמְּרוֹתָ֗/ם תָּלַ֥ן עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/002.yaml
  text: Surely mockers are with me[b][a], and my eye lodges on their provocation.
translation:
  language: id
  text: Sungguh, para pengejek ada bersamaku[a], dan mataku terus tertuju pada provokasi mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para penipu ada bersamaku”; istilah Ibrani ini dapat merujuk kepada orang yang menipu atau mengejek.
    reason: lexical_alternative
  - marker: b
    text: Atau “mataku tetap tertuju pada pemberontakan mereka” atau “kepahitan mereka.” Ungkapan Ibrani ini sulit dan dapat menunjuk pada perilaku yang memancing, menentang, atau pahit. Secara harfiah, kata yang diterjemahkan “terus tertuju” berarti “bermalam” atau “menetap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Sungguh
  rationale: Dalam konteks ini, ungkapan tersebut berfungsi sebagai penegasan, bukan sebagai syarat harfiah. “Sungguh” menyampaikan tekanan itu secara wajar dalam bahasa Indonesia.
- source_word: הֲתֻלִים
  choice: para pengejek
  rationale: Kata ini menunjuk kepada orang-orang yang mengejek atau memperolok. Konteks perkataan para sahabat Ayub mendukung makna ini, meskipun arti “para penipu” juga mungkin.
- source_word: עִמָּדִי
  choice: ada bersamaku
  rationale: Frasa ini menyatakan keberadaan mereka bersama atau di dekat Ayub; terjemahan ini mempertahankan bentuk sederhana teks Ibrani.
- source_word: וּבְהַמְּרוֹתָם
  choice: pada provokasi mereka
  rationale: Bentuk ini dapat menunjuk pada perilaku yang memancing, menentang, atau pahit. “Provokasi mereka” cukup luas untuk mempertahankan ketegangan leksikal tanpa mengkhususkannya sebagai pemberontakan terhadap Allah.
- source_word: תָּלַן
  choice: terus tertuju
  rationale: Secara harfiah verba ini berarti bermalam atau menetap. Dalam hubungannya dengan mata, frasa Indonesia ini menyampaikan gambaran perhatian yang tetap melekat secara alami.
- source_word: עֵינִי
  choice: mataku
  rationale: Bentuk Ibrani adalah tunggal dengan akhiran orang pertama; bentuk tunggal dapat dipertahankan secara wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Susunan kalimat mempertahankan penegasan awal, bentuk tunggal “mataku,” dan ketegangan makna pada perilaku para pengejek, sementara ungkapan metaforis Ibrani dijelaskan dalam catatan kaki.
