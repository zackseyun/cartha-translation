  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: id
  text: Sediakanlah kiranya jaminan untukku pada diri-Mu sendiri[a]; siapa lagi yang akan menepukkan tangannya pada tanganku sebagai penjamin?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jadilah penjaminku pada diri-Mu sendiri.” Bahasa Ibrani memakai istilah hukum tentang pemberian jaminan atau kesediaan menjadi penanggung. Secara harfiah, frasa terakhir berarti “dengan-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Siapakah dia yang akan menepukkan tangannya pada tanganku?” Menepukkan tangan merupakan tindakan untuk mengesahkan kesediaan menjadi penanggung.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה נָּא
  choice: Berikanlah kiranya
  rationale: Imperatif שׂים menyatakan tindakan menaruh atau menyediakan, sedangkan נָּא melembutkannya menjadi permohonan. Dalam konteks hukum jaminan, 'berikanlah kiranya' alami dan tetap bernada memohon.
- source_word: עָרְבֵנִי
  choice: jaminan bagiku
  rationale: Bentuk ini berasal dari ערב dalam arti menjadi penanggung atau menyediakan jaminan; sufiks orang pertama menunjukkan bahwa jaminan itu diminta bagi Ayub.
- source_word: עִמָּךְ
  choice: di hadapan-Mu sendiri
  rationale: Frasa ini secara harfiah berarti 'dengan-Mu'. Pilihan ini mengungkapkan bahwa jaminan tersebut ditempatkan pada Allah sendiri, tanpa menghapus ketegangan bahwa Allah juga diminta menyediakan jaminan itu.
- source_word: מִי הוּא
  choice: siapa lagi
  rationale: Pertanyaan retoris ini menyiratkan bahwa tidak ada penjamin lain; 'lagi' membuat kontras tersebut wajar dalam bahasa Indonesia.
- source_word: לְיָדִי יִתָּקֵעַ
  choice: mau berjabat tangan denganku sebagai penjamin
  rationale: Secara harfiah ungkapan ini menggambarkan seseorang 'menepukkan tangan pada tanganku', yaitu gerak untuk mengesahkan kesediaan menjadi penanggung. Terjemahan ini mempertahankan gambaran tangan sambil menjelaskan fungsi hukumnya.
theological_decisions:
- issue: Metafora hukum yang ditujukan kepada Allah
  choice: Ayub memohon agar Allah sendiri menyediakan jaminan baginya di hadapan Allah.
  alternative: Ayub hanya meminta adanya seorang penjamin secara umum, tanpa menyiratkan bahwa Allah menjalankan kedua peran.
  rationale: Gabungan עָרְבֵנִי dan עִמָּךְ mengarahkan permohonan kepada Allah sebagai satu-satunya pihak yang dapat menyediakan jaminan, tetapi susunan yang paradoksal itu dibiarkan tetap terasa dan tidak dijelaskan menjadi suatu rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Kapitalisasi pronomina untuk Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Istilah 'jaminan' dan 'penjamin' mempertahankan ranah hukum, sedangkan 'berjabat tangan' menjaga gambaran konkret idiom Ibrani.
