base_translation:
  language: en
  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: id
  text: Sebab Engkau telah menyembunyikan hati mereka dari pengertian[a]; karena itu Engkau tidak akan meninggikan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pikiran mereka” atau “batin mereka”; dalam bahasa Ibrani, “hati” sering menunjuk pada pusat pikiran dan daya memahami, bukan hanya perasaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengangkat mereka” atau “membiarkan mereka menang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan berikutnya dan sesuai dengan alur argumentasi puitis dalam bahasa Indonesia.
- source_word: לִבָּם
  choice: hati mereka
  rationale: Dalam bahasa Ibrani, 'hati' kerap menunjuk pada pusat pikiran, kehendak, dan daya menimbang, bukan hanya perasaan. Ungkapan ini mempertahankan citra sumber.
- source_word: צָפַנְתָּ מִשָּׂכֶל
  choice: Engkau telah menjauhkan ... dari pengertian
  rationale: צפן berarti menyembunyikan atau menjauhkan dari jangkauan, sedangkan מִן menyatakan pemisahan. Pilihan ini menyampaikan bahwa kemampuan batin mereka dijauhkan dari pengertian tanpa memakai ungkapan Indonesia yang janggal.
- source_word: עַל כֵּן
  choice: karena itu
  rationale: Frasa inferensial baku yang menghubungkan tindakan pada klausa pertama dengan akibat pada klausa kedua.
- source_word: לֹא תְרֹמֵם
  choice: Engkau tidak akan meninggikan mereka
  rationale: Bentuk dari רום mempertahankan gambaran mengangkat atau meninggikan. Objek jamak dipertahankan sesuai rujukan dalam konteks dan lapisan konsultasi.
theological_decisions:
- issue: Rujukan akhiran dan objek jamak ('mereka')
  choice: Mempertahankan 'mereka' tanpa menyebut identitas kelompok itu secara khusus.
  alternative: Menjelaskannya sebagai para lawan Ayub atau para pendukung mereka.
  rationale: Kata kerja orang kedua menunjukkan bahwa Ayub berbicara kepada Allah, sedangkan bentuk jamak merujuk kepada kelompok lain. Ayat ini sendiri tidak menetapkan identitas mereka secara lebih terperinci.
- issue: Tindakan Allah terhadap kemampuan memahami
  choice: Menyatakan langsung bahwa Allah telah menjauhkan hati mereka dari pengertian.
  alternative: Melunakkan menjadi bahwa mereka sekadar gagal memahami atau tidak mau mengerti.
  rationale: Teks Ibrani menempatkan Allah sebagai pelaku langsung; ketegangan teologis ini dipertahankan dan tidak dialihkan menjadi tindakan manusia semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi 'Engkau' menandai sapaan langsung kepada Allah. Susunan dua klausa dan hubungan sebab-akibat dipertahankan, sementara ungkapan 'menjauhkan ... dari pengertian' dipilih agar citra pemisahan dalam bahasa Ibrani tetap terasa secara alami.
