base_translation:
  language: en
  yaml_path: translation/ot/job/017/016.yaml
  text: Will they go down to the bars of Sheol? Shall we descend together into the dust?[a][b]
translation:
  language: id
  text: Akankah semua itu turun ke palang-palang Sheol?[a] Akankah kita bersama-sama turun di atas debu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian-bagian Sheol” atau “gerendel-gerendel Sheol.” Gambaran Ibrani ini kemungkinan membangkitkan gerbang atau kurungan alam orang mati.
    reason: lexical_alternative
  - marker: b
    text: Atau “Akankah kita bersama-sama beristirahat di atas debu?” Frasa Ibrani pada akhir ayat dapat dipahami sebagai “turun” atau, menurut sebagian penafsir, sebagai “beristirahat.”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּדֵּי
  choice: palang-palang
  rationale: Dalam konteks dunia orang mati, kata ini paling mungkin menggambarkan palang atau gerendel gerbang yang mengurung penghuninya; bentuk ulang menghasilkan ungkapan jamak yang wajar dalam bahasa Indonesia.
- source_word: שְׁאֹל
  choice: dunia orang mati
  rationale: Ungkapan ini mempertahankan pengertian ranah kematian dalam istilah Ibrani tanpa menyempitkannya menjadi sekadar kubur, sekaligus lebih mudah dipahami pembaca Indonesia daripada transliterasi.
- source_word: תֵּרַדְנָה
  choice: Akankah semuanya turun
  rationale: Bentuk feminin jamak kemungkinan menunjuk kepada hal-hal yang disebut dalam konteks sebelumnya, khususnya harapan-harapan Ayub. Kata 'semuanya' mempertahankan rujukan jamak tanpa memasukkan kata 'harapan' yang tidak tertulis dalam ayat ini; bentuk pertanyaan sesuai dengan alur retoris.
- source_word: אִם
  choice: Akankah
  rationale: Di sini partikel tersebut paling alami dipahami sebagai pengantar pertanyaan retoris pada bagian kedua, bukan sebagai syarat biasa.
- source_word: יַחַד
  choice: bersama-sama
  rationale: Menyampaikan makna kebersamaan dalam gerak turun menuju kematian.
- source_word: עַל עָפָר
  choice: ke dalam debu
  rationale: Walaupun preposisinya secara harfiah dapat berarti 'di atas', konteks gerak turun dan kematian mendukung ungkapan tujuan yang alami dalam bahasa Indonesia.
- source_word: נָחַת
  choice: turun
  rationale: Dipahami sebagai gagasan 'turun' atau 'penurunan', sejajar dengan kata kerja pada baris pertama. Kemungkinan arti 'beristirahat' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Pengalihan istilah שְׁאוֹל
  choice: dunia orang mati
  alternative: Sheol; kubur
  rationale: '''Dunia orang mati'' menjaga cakupan konsep ranah kematian dan menghindari penyamaan langsung dengan kubur fisik atau pemuatan konsep akhirat yang lebih khusus.'
- issue: Subjek feminin jamak pada תֵּרַדְנָה
  choice: semuanya
  alternative: harapan-harapanku
  rationale: Konteks mengarah kepada harapan Ayub, tetapi ayat ini sendiri tidak mengulang nomina tersebut. Kata ganti umum mempertahankan kaitan kontekstual sekaligus ambiguitas gramatikal.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Dua pertanyaan retoris serta kesejajaran kedua baris dipertahankan. Istilah teknis 'Sheol' diterjemahkan secara transparan sebagai 'dunia orang mati', dan ambiguitas utama dicatat tanpa diselesaikan secara dogmatis.
