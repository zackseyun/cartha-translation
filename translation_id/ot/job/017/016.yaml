revisions:
- from: Akankah semuanya turun ke palang-palang dunia orang mati?[a] Akankah kita turun bersama-sama ke dalam debu?[b]
  to: Akankah semua itu turun ke palang-palang Sheol?[a] Akankah kita bersama-sama turun di atas debu?[b]
