  text: If I hope for Sheol as my house[a], if I spread my bed in the darkness,
translation:
  language: id
  text: Jika aku mengharapkan Syeol sebagai rumahku[a], di dalam kegelapan aku telah membentangkan tempat tidurku,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur” atau “alam orang mati”. Kata Ibrani “Syeol” merujuk pada tempat orang mati dan maknanya lebih luas daripada lokasi penguburan saja.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan daya syarat atau pengandaian dalam bahasa Ibrani tanpa mengubahnya menjadi pernyataan waktu atau kepastian.
- source_word: אֲקַוֶּה
  choice: aku mengharapkan
  rationale: Bentuk verba ini mengungkapkan penantian yang disertai harapan atau pengharapan; pilihan ini mempertahankan nuansa emosional dalam perkataan Ayub.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan keluasan konsep Ibrani tentang tempat atau alam orang mati dan tidak mempersempitnya menjadi lokasi penguburan saja.
- source_word: בֵּיתִי
  choice: sebagai rumahku
  rationale: Hubungan tanpa verba antara 'Syeol' dan 'rumahku' paling alami dinyatakan dengan 'sebagai', yakni Syeol dibayangkan sebagai tempat tinggal Ayub.
- source_word: בַּחֹשֶׁךְ
  choice: dalam kegelapan
  rationale: Mencerminkan preposisi dan kata sandang Ibrani serta mempertahankan gambaran kelam yang berkaitan dengan kematian dan Syeol.
- source_word: רִפַּדְתִּי
  choice: aku membentangkan
  rationale: Menggambarkan tindakan menata atau menghamparkan alas untuk berbaring secara konkret dan alami dalam bahasa Indonesia.
- source_word: יְצוּעָי
  choice: tempat tidurku
  rationale: Padanan modern dan wajar untuk tempat berbaring, sekaligus mempertahankan citra kematian sebagai perhentian.
theological_decisions:
- issue: Apakah שְׁאוֹל diterjemahkan secara interpretatif
  choice: Syeol
  alternative: kubur; alam orang mati
  rationale: Transliterasi menjaga cakupan konsep aslinya dan menghindari penyamaan dengan kubur fisik saja ataupun pemasukan gagasan doktrinal yang lebih berkembang. Alternatif makna dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel 'Jika ... jika ...' dipertahankan untuk mencerminkan susunan Ibrani; tanda koma menunjukkan bahwa pemikiran berlanjut ke ayat berikutnya.
