base_translation:
  language: en
  yaml_path: translation/ot/job/007/002.yaml
  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: id
  text: Seperti seorang budak yang mendambakan tempat teduh, dan seperti seorang pekerja upahan yang menantikan upahnya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/עֶבֶד
  choice: seperti seorang budak
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam gambaran tentang kerja berat dan kerinduan akan kelegaan, “budak” mempertahankan kerentanan serta status terikat yang tersirat.
- source_word: יִשְׁאַף
  choice: mendambakan
  rationale: שׁאף menyatakan hasrat yang kuat, bahkan dapat menggambarkan terengah-engah. “Mendambakan” menyampaikan kerinduan intens secara alami dalam bahasa Indonesia.
- source_word: צֵל
  choice: tempat teduh
  rationale: Secara harfiah צֵל adalah bayang-bayang, tetapi dalam konteks kerja di tengah panas, yang dimaksud ialah keteduhan sebagai kelegaan.
- source_word: וּ/כְ/שָׂכִיר
  choice: dan seperti seorang pekerja upahan
  rationale: שָׂכִיר menunjuk kepada orang yang dipekerjakan dengan imbalan upah; pilihan ini mempertahankan nuansa ekonominya.
- source_word: יְקַוֶּה
  choice: menantikan
  rationale: קוה dapat berarti menunggu atau berharap. Di sini pekerja menunggu pembayaran yang menjadi haknya, sehingga “menantikan” mempertahankan unsur penantian penuh harap.
- source_word: פָעֳל/וֹ
  choice: upahnya
  rationale: פעל pada dasarnya dapat berkaitan dengan pekerjaan atau hasilnya, tetapi bersama “pekerja upahan” paling wajar menunjuk kepada imbalan atas pekerjaan itu.
