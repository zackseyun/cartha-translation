  source_fidelity: 'Teks utama menangkap struktur argumentatif Ibrani dengan baik: konsesi retoris pada חָטָאתִי, pertanyaan tentang tindakan Ayub terhadap Allah, keluhan bahwa Ayub dijadikan sasaran, dan bacaan Masoret “beban bagi diriku sendiri.” Namun, “terhadap-Mu” mempersempit לָךְ ke arah konfrontasi, sedangkan “kepada-Mu” mempertahankan pertanyaan yang lebih netral dan luas. Untuk נֹצֵר הָאָדָם, “Penjaga manusia” lebih idiomatis sebagai sapaan dan lebih dekat dengan rentang “yang menjaga/mengawasi”; konteks keluhan tetap membiarkan nadanya bernuansa ironis atau menekan.'
