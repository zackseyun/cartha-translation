  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: id
  text: Jika aku telah berdosa,[a] apa yang dapat kulakukan kepada-Mu, hai Penjaga manusia? Mengapa Engkau menjadikan aku sasaran-Mu,[b] sehingga aku menjadi beban bagi diriku sendiri?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku telah berdosa.” Bahasa Ibrani secara harfiah memakai bentuk pernyataan; dalam konteks ini kalimat itu dapat dipahami sebagai konsesi retoris.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menjadikan aku suatu sasaran bagi-Mu.”'
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani Masoret berbunyi “beban bagi diriku sendiri”; beberapa versi kuno mencerminkan bacaan “beban bagi-Mu”.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָאתִי
  choice: Jika aku telah berdosa
  rationale: Bentuknya perfektif orang pertama tunggal, secara harfiah 'aku telah berdosa'. Dalam keluhan retoris Ayub, 'jika' menyatakan konsesi tanpa mengubahnya menjadi pengakuan dosa yang tegas.
- source_word: מָה אֶפְעַל לָךְ
  choice: apa yang dapat kulakukan terhadap-Mu
  rationale: Imperfektif orang pertama tunggal menyatakan tindakan yang mungkin dilakukan Ayub terhadap Allah. 'Dapat' menangkap daya retoris tentang ketidakmampuannya; 'terhadap-Mu' lebih jelas daripada 'kepada-Mu' dalam konteks ini.
- source_word: נֹצֵר הָאָדָם
  choice: Pengawas umat manusia
  rationale: נֹצֵר dapat berarti menjaga, mengawasi, atau mengamati. 'Pengawas' mempertahankan ketegangan antara penjagaan dan pengamatan yang menekan, sedangkan הָאָדָם dipakai secara generik-kolektif bagi manusia.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: Mengapa Engkau menjadikan aku sasaran-Mu
  rationale: מִפְגָּע menunjuk pada sesuatu yang dihantam atau dijadikan objek serangan. 'Sasaran-Mu' alami dalam bahasa Indonesia dan menyerap datif לָךְ tanpa menghilangkan maknanya.
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: sehingga aku menjadi beban bagi diriku sendiri
  rationale: Teks Masoret memakai עָלַי, 'atas/bagiku sendiri', sehingga bacaan tersulit dan paling langsung ialah bahwa Ayub menjadi beban bagi dirinya sendiri. Hubungan akibat diterjemahkan dengan 'sehingga' sesuai alur keluhan.
theological_decisions:
- issue: Apakah חָטָאתִי merupakan pengakuan dosa langsung atau konsesi retoris
  choice: Jika aku telah berdosa
  alternative: Aku telah berdosa
  rationale: Konstruksi konteks mendukung nuansa konsesif dalam pertanyaan retoris. Terjemahan ini tidak menyangkal kemungkinan dosa, tetapi juga tidak memaksakan pengakuan mutlak yang tidak ditandai secara eksplisit oleh konteks argumentatif.
- issue: Nuansa gelar נֹצֵר הָאָדָם
  choice: Pengawas umat manusia
  alternative: Penjaga umat manusia
  rationale: '''Pengawas'' menjaga ambiguitas antara pemeliharaan ilahi dan pengamatan yang dirasakan Ayub sebagai tekanan; ''penjaga'' cenderung terlalu positif dalam konteks keluhan.'
- issue: Pronomina pada frasa beban
  choice: bagi diriku sendiri
  alternative: bagi-Mu
  rationale: Teks Masoret berbunyi עָלַי, yang menunjuk kepada Ayub sendiri. Sejumlah versi kuno mencerminkan bacaan 'bagi-Mu', tetapi itu dicatat sebagai varian dan tidak menggantikan teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan langsung kepada Allah memakai kapital kehormatan. 'Pengawas' sengaja dipilih agar nuansa menjaga dan mengamati secara ketat tetap terbuka. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
