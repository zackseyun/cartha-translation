  terminology: Kapital kehormatan pada Engkau/-Mu konsisten. “Sasaran-Mu” merupakan padanan yang baik untuk לְמִפְגָּע לָךְ. “Beban bagi diriku sendiri” setia pada עָלַי dan catatan varian bagi-Mu diperlukan serta telah dipertahankan.
