revisions:
- from: Jika aku telah berdosa,[a] apa yang dapat kulakukan terhadap-Mu, hai Pengawas umat manusia? Mengapa Engkau menjadikan aku sasaran-Mu,[b] sehingga aku menjadi beban bagi diriku sendiri?[c]
  to: Jika aku telah berdosa,[a] apa yang dapat kulakukan kepada-Mu, hai Penjaga manusia? Mengapa Engkau menjadikan aku sasaran-Mu,[b] sehingga aku menjadi beban bagi diriku sendiri?[c]
  rationale: Revisi terbatas pada dua pilihan diksi. “Penjaga manusia” menggantikan istilah administratif “Pengawas umat manusia” sambil tetap membiarkan ambiguitas נֹצֵר antara menjaga dan mengawasi. “Kepada-Mu” menggantikan “terhadap-Mu” agar tidak menambahkan nuansa konfrontatif yang tidak dituntut oleh לָךְ. Semua penanda catatan kaki dipertahankan pada unsur yang relevan, dan catatan c tetap membedakan teks Masoret dari bacaan beberapa versi kuno.
