    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: memilih
  rationale: Bentuk dari בחר berarti ‘memilih’. Dalam alur puisi yang meneruskan ungkapan keinginan Ayub, bentuk ini dapat disampaikan sebagai tindakan kini tanpa menambahkan modalitas yang tidak dinyatakan secara eksplisit.
- source_word: מַחֲנָק
  choice: dicekik
  rationale: Nomina ini menunjuk pada pencekikan atau keadaan tercekik. ‘Dicekik’ mempertahankan gambaran yang konkret dan keras, serta lebih alami dalam kalimat Indonesia daripada nomina ‘pencekikan’.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, atau hidup. ‘Jiwaku’ mempertahankan ungkapan Ibrani dan tetap dapat dipahami sebagai diri atau hidup Ayub.
- source_word: מָוֶת
  choice: kematian
  rationale: Padanan baku bagi מָוֶת dan cocok sebagai objek pilihan yang disejajarkan dengan ‘dicekik’.
- source_word: מֵעַצְמוֹתָי
  choice: daripada tulang-tulangku
  rationale: 'Secara harfiah ‘dari tulang-tulangku’. Preposisi מן dipahami secara komparatif dalam konteks pilihan: Ayub memilih kematian daripada keberadaan jasmaninya yang menderita. Citra ‘tulang-tulang’ dipertahankan dan tidak diratakan menjadi ‘tubuh’.'
