base_translation:
  language: en
  yaml_path: translation/ot/job/007/007.yaml
  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: id
  text: Ingatlah bahwa hidupku hanyalah embusan napas[a]; mataku tidak akan kembali melihat yang baik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidupku hanyalah angin.” Kata Ibrani רוּחַ dapat berarti “napas,” “angin,” atau “roh”; di sini kata itu mengungkapkan betapa singkat dan cepat berlalunya hidup.
    reason: lexical_alternative
  - marker: b
    text: Atau “mataku tidak akan melihat hal yang baik lagi,” yaitu tidak akan mengalami kesejahteraan atau kemakmuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Bentuk imperatif tunggal yang ditujukan kepada Allah dalam konteks ini. “Ingatlah” mempertahankan seruan langsung dan bernada permohonan tanpa menambahkan sapaan yang tidak terdapat dalam teks.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diingat. “Bahwa” paling alami dalam susunan bahasa Indonesia ini dan tidak menggeser nuansanya menjadi alasan sebab-akibat yang tegas.
- source_word: רוּחַ
  choice: embusan napas
  rationale: Dalam ratapan ini, kata tersebut menggambarkan hidup yang singkat dan lekas lenyap. “Embusan napas” menyampaikan metafora itu secara alami, sedangkan “roh” akan memberi kesan antropologis yang bukan makna utama di sini.
- source_word: חַיָּי
  choice: hidupku
  rationale: Padanan yang langsung, jelas, dan alami untuk bentuk dengan akhiran orang pertama tunggal.
- source_word: לֹא תָשׁוּב
  choice: tidak akan kembali
  rationale: Mempertahankan citra verbal “kembali” dan bentuk akan datang dari ungkapan Ibrani, dengan subjek “mataku”.
- source_word: עֵינִי
  choice: mataku
  rationale: Bentuk Ibraninya tunggal. Bentuk tunggal dipertahankan sebagai ungkapan puitis dan sebagai metonimia bagi diri Ayub yang melihat atau mengalami.
- source_word: לִרְאוֹת
  choice: melihat
  rationale: Ini adalah arti dasar kata kerja tersebut dan tetap memungkinkan makna harfiah maupun idiomatis.
- source_word: טוֹב
  choice: kebaikan
  rationale: Pilihan ini mempertahankan keluasan makna Ibrani, yang dapat mencakup hal baik, kesejahteraan, dan kemakmuran, tanpa mempersempitnya pada salah satu saja.
theological_decisions:
- issue: Apakah pernyataan Ayub tentang tidak lagi melihat kebaikan harus ditafsirkan sebagai klaim mutlak mengenai keadaan sesudah kematian?
  choice: Terjemahan mempertahankan pernyataan ratapan sebagaimana diucapkan Ayub tanpa penjelasan teologis tambahan.
  alternative: Menambahkan atau menyiratkan pembatasan seperti “dalam hidup ini.”
  rationale: Frasa pembatas tersebut tidak ada dalam teks Ibrani. Menambahkannya akan menyelesaikan ketegangan teologis yang sengaja dibiarkan terbuka oleh ujaran puitis Ayub.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada puitis. “Hanyalah” membuat metafora nominal terdengar alami sekaligus menonjolkan kefanaan yang tersirat dalam konteks. Bentuk tunggal “mataku” dipertahankan untuk mengikuti teks Ibrani dan gaya puisi ratapan.
