  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: id
  text: Seperti awan sirna dan berlalu, demikian pula orang yang turun ke Syeol[a] tidak akan naik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur” atau “dunia orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: sirna
  rationale: Kata kerja ini berarti berakhir atau habis. Dengan awan sebagai subjek, “sirna” secara alami menggambarkan awan yang menghilang tanpa mengubah gambaran puitisnya.
- source_word: עָנָן
  choice: awan
  rationale: Makna nomina ini langsung dan mempertahankan gambaran biasa tentang awan yang menghilang.
- source_word: וַיֵּלַךְ
  choice: dan berlalu
  rationale: Secara harfiah berarti “dan pergi.” Dalam kesejajaran dengan awan yang sirna, “berlalu” menyampaikan perginya awan dengan bahasa Indonesia yang wajar dan tetap dekat dengan citra sumber.
- source_word: כֵּן
  choice: demikian pula
  rationale: Ungkapan ini menghubungkan perumpamaan awan dengan keadaan orang yang turun ke Syeol.
- source_word: יוֹרֵד
  choice: orang yang turun
  rationale: Partisipel ini berfungsi secara substantival dan menunjuk secara umum kepada seseorang; bentuk ini mempertahankan gambaran gerak turun.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Istilah Ibrani dipertahankan dalam bentuk transliterasi Indonesia agar tidak dipersempit menjadi sekadar kubur atau ditafsirkan sepenuhnya sebagai dunia orang mati.
- source_word: לֹא יַעֲלֶה
  choice: tidak akan naik kembali
  rationale: Ungkapan ini mempertahankan gambaran vertikal yang berlawanan dengan “turun.” Kata “kembali” menjelaskan secara alami dalam bahasa Indonesia bahwa orang itu tidak muncul lagi dari Syeol.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati
  rationale: Istilah sumber dapat merujuk pada ranah orang mati atau kubur. Mempertahankan “Syeol” menjaga keluasan konsep dalam teks dan tidak menjadikan ayat ini pernyataan doktrinal lengkap tentang keadaan sesudah mati atau kebangkitan. Dalam konteksnya, Ayub berbicara mengenai finalitas kematian sebagaimana tampak dari sudut pandang manusia.
translation_notes:
  register: Bahasa Indonesia modern yang puitis namun tetap mudah dipahami. “Sirna dan berlalu” mempertahankan dua kata kerja Ibrani tanpa menghasilkan pengulangan yang kaku; “demikian pula” menandai perbandingan dengan jelas.
