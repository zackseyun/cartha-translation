base_translation:
  language: en
  yaml_path: translation/ot/job/007/012.yaml
  text: Am I the sea[a], or a sea monster[b], that you set a guard over me?
translation:
  language: id
  text: Apakah aku ini laut atau monster laut[a], sehingga Engkau memasang penjagaan atasku[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “naga” atau “ular besar.” Kata Ibrani tannin menunjuk pada makhluk besar yang mengancam dan sering muncul dalam citra laut atau kekacauan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengawasi aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָם
  choice: Apakah aku ini laut
  rationale: Partikel tanya הֲ membentuk pertanyaan retoris. “Laut” mempertahankan citra puitis Ibrani secara langsung dan wajar dalam bahasa Indonesia.
- source_word: אֲנִי
  choice: aku
  rationale: Kata ganti orang pertama tunggal ini diberi penekanan dalam pertanyaan retoris. “Aku” sesuai dengan tuturan pribadi Ayub kepada Allah.
- source_word: אִם
  choice: atau
  rationale: 'Dalam pasangan pertanyaan retoris ini, אִם berfungsi sebagai penghubung disjungtif: “laut atau monster laut.”'
- source_word: תַּנִּין
  choice: monster laut
  rationale: תַּנִּין dapat menunjuk pada makhluk besar yang mengancam, naga, atau ular. Dalam kesejajaran dengan “laut,” “monster laut” mempertahankan citra bahaya dan kekacauan tanpa menetapkan identitas mitologis tertentu.
- source_word: כִּי
  choice: sehingga
  rationale: 'Di sini כִּי mengantar klausa yang menyatakan konsekuensi atau alasan tersirat bagi pertanyaan retoris. “Sehingga” mengungkapkan maksudnya secara alami: apakah Ayub sedemikian berbahaya sampai harus dijaga.'
- source_word: תָשִׂים
  choice: Engkau menempatkan
  rationale: Bentuk ini berasal dari שׂים, “menaruh/menempatkan.” Huruf kapital pada “Engkau” menandai bahwa sapaan ditujukan kepada Allah tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: עָלַי
  choice: atas diriku
  rationale: Preposisi עַל di sini menyatakan penjagaan atau pengawasan yang diberlakukan terhadap Ayub. “Atas diriku” mempertahankan bentuk relasional teks dengan bahasa Indonesia yang bermartabat.
- source_word: מִשְׁמָר
  choice: penjagaan
  rationale: מִשְׁמָר dapat berarti penjagaan, pengawasan, atau keadaan ditahan. “Penjagaan” mempertahankan gagasan pengawasan sekaligus pengekangan tanpa harus mengartikannya sebagai seorang penjaga tertentu.
theological_decisions:
- issue: Citra תַּנִּין dalam bahasa puitis tentang laut dan kekacauan
  choice: Diterjemahkan “monster laut” tanpa mengembangkan mitologi di luar teks
  alternative: “naga” atau “ular besar”
  rationale: Ayat ini menggambarkan keluhan Ayub bahwa Allah memperlakukannya seolah-olah ia merupakan ancaman besar yang perlu dikekang. Terjemahan mempertahankan daya citra tersebut tanpa mengimpor sistem mitologis tertentu.
- issue: Arah keluhan Ayub kepada Allah
  choice: Mempertahankan sapaan langsung “Engkau” dan ketegangan pertanyaan retoris
  alternative: Mengubahnya menjadi pernyataan tidak langsung atau melunakkan keluhannya
  rationale: Teks Ibrani menyampaikan keluhan yang tajam secara langsung. Terjemahan tidak menjelaskan atau meredakan ketegangan teologis antara penderitaan Ayub dan tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Aku” dipakai karena Ayub berbicara langsung dan pribadi kepada Allah; “Engkau” mempertahankan sapaan tunggal yang hormat. Susunan pertanyaan tetap ringkas agar daya retoris teks Ibrani terpelihara.
