  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: id
  text: Ketika aku berbaring[a], aku berkata, “Kapan aku akan bangun?” Namun, petang terasa begitu panjang[b], dan aku gelisah dan berguling-guling sampai fajar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Jika aku berbaring.” Partikel Ibrani ini dapat menyatakan syarat, tetapi di sini kemungkinan besar memperkenalkan keadaan yang berulang: “Ketika aku berbaring.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan petang diukur.” Maksudnya, petang itu terasa memanjang dan berlalu dengan lambat.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani נָשֶׁף dapat berarti “waktu remang” dan di sini mungkin secara khusus menunjuk pada remang pagi, yaitu fajar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ketika
  rationale: Meskipun partikel ini lazim berarti ‘jika’, dalam konteks ini partikel tersebut paling mungkin memperkenalkan keadaan yang berulang setiap kali Ayub berbaring.
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: aku berbaring, aku berkata
  rationale: Bentuk perfektif di sini dipahami secara habitual atau iteratif, sesuai keluhan Ayub tentang pengalaman yang berulang setiap malam.
- source_word: מָתַי אָקוּם
  choice: Kapan aku akan bangun?
  rationale: ‘Bangun’ merupakan padanan alami bagi קום dalam konteks seseorang yang sedang berbaring dan menantikan malam berakhir.
- source_word: וּמִדַּד עָרֶב
  choice: Namun, petang terasa begitu panjang
  rationale: Secara harfiah frasa ini berkaitan dengan ‘mengukur’ petang; terjemahan ini menyampaikan kesan bahwa waktu malam berlalu dengan sangat lambat, sambil mempertahankan עָרֶב sebagai ‘petang’.
- source_word: וְשָׂבַעְתִּי נְדֻדִים
  choice: aku sudah jemu berguling-guling dengan gelisah
  rationale: שׂבע menyatakan keadaan telah kenyang atau jenuh, sedangkan נְדֻדִים menunjuk pada gerakan gelisah saat tidak dapat tidur. ‘Jemu’ menyampaikan kejenuhan negatif secara alami dalam bahasa Indonesia.
- source_word: עֲדֵי נָשֶׁף
  choice: sampai fajar
  rationale: נָשֶׁף dapat berarti waktu remang pada petang atau pagi. Karena petang telah disebut dan Ayub menanti untuk bangun, konteks menunjuk pada remang pagi, yaitu fajar.
