    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ketika
  rationale: Partikel ini dapat bersifat kausal, kondisional, atau temporal. Dalam alur menuju ayat berikutnya, “ketika” secara alami memperkenalkan harapan Ayub yang kemudian digagalkan.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Bentuk Ibrani secara formal adalah perfektif, tetapi dalam konteks ini menggambarkan ujaran batin yang muncul ketika Ayub berharap mendapat kelegaan; bahasa Indonesia dapat memakai “berkata” tanpa memaksakan penandaan waktu.
- source_word: תְּנַחֲמֵנִי
  choice: akan menghibur aku
  rationale: Bentuk piel dari נחם menyatakan tindakan menghibur atau memberi kelegaan. “Menghibur aku” mempertahankan personifikasi tempat tidur.
- source_word: עַרְשִׂי
  choice: tempat tidurku
  rationale: עֶרֶשׂ berarti tempat tidur atau dipan. Padanan ini paling jelas dan alami bagi pembaca Indonesia.
- source_word: יִשָּׂא
  choice: akan membantu menanggung
  rationale: נשׂא berarti mengangkat, membawa, atau menanggung. Penambahan “membantu” membuat metafora bahwa pembaringan ikut memikul beban keluhan Ayub terdengar alami tanpa menghilangkan gagasan menanggung.
- source_word: בְשִׂיחִי
  choice: keluh kesahku
  rationale: שִׂיחַ dapat menunjuk pada renungan, percakapan batin, atau ratapan. Dalam konteks penderitaan Ayub, “keluh kesah” menangkap nuansa ujaran ratapan sambil tetap memungkinkan unsur pergumulan batin.
- source_word: מִשְׁכָּבִי
  choice: pembaringanku
  rationale: מִשְׁכָּב adalah tempat berbaring atau tempat tidur. “Pembaringan” membedakannya dari עֶרֶשׂ dan menjaga variasi dalam paralelisme puisi.
