  text: Ketika aku berkata[a], “Tempat tidurku akan menghiburku; pembaringanku akan menanggung keluh kesahku[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Sebab aku berkata” atau “Jika aku berkata.” Kata Ibrani כִּי dapat dipahami dengan beberapa cara di sini; “Ketika” paling sesuai dengan konteks langsung dan peralihan ke ayat berikutnya.
    reason: lexical_alternative
  - marker: b
