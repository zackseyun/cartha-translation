  text: Hari-hariku berlalu lebih cepat daripada torak seorang penenun[a]; hari-hari itu berakhir tanpa harapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani di sini dapat dipahami lebih umum sebagai alat atau perlengkapan tenun. “Torak” mengikuti gambaran tradisional tentang alat tenun yang bergerak cepat.
