lexical_decisions:
- source_word: יָמַי
  choice: Hari-hariku
  rationale: Mempertahankan bentuk konkret jamak dengan sufiks orang pertama, bukan mengabstrakkannya menjadi “hidupku” atau “masa hidupku”.
- source_word: קַלּוּ
  choice: berlalu lebih cepat
  rationale: Kata kerja ini menyatakan gerak atau berlangsung dengan cepat; ungkapan verbal ini alami dalam bahasa Indonesia dan mempertahankan daya komparatifnya.
- source_word: מִנִּי אָרֶג
  choice: daripada sekoci penenun
  rationale: אֹרֶג dapat menunjuk pada alat tenun atau kegiatan/perlengkapan menenun. Dalam perbandingan tentang kecepatan, sekoci yang bergerak cepat paling sesuai dengan gambaran tersebut.
- source_word: וַיִּכְלוּ
  choice: semuanya berakhir
  rationale: Bentuk dari כלה berarti selesai atau mencapai akhir. “Semuanya” merujuk kembali secara wajar kepada hari-hari Ayub.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: tanpa harapan
  rationale: Menyampaikan secara ringkas dan alami keadaan tidak adanya תִּקְוָה, tanpa menambahkan penafsiran teologis.
