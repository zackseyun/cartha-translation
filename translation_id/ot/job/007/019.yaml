  yaml_path: translation/ot/job/007/019.yaml
  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: id
  text: Berapa lama Engkau tidak akan mengalihkan pandangan-Mu dariku dan tidak membiarkan aku sendiri sampai aku menelan ludahku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memalingkan pandangan-Mu dariku.” Secara harfiah, “sampai aku menelan ludahku”; ungkapan ini menunjuk pada waktu yang sangat singkat.
    reason: lexical_alternative; idiom_clarification
lexical_decisions:
- source_word: כַּמָּה
  choice: Berapa lama lagi
  rationale: Dalam konteks keluhan, ungkapan ini menanyakan lamanya keadaan yang sedang dialami; kata 'lagi' membuat keluhan berkelanjutan itu wajar dalam bahasa Indonesia.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: Engkau tidak mau mengalihkan pandangan-Mu dariku
  rationale: Verba שׁעה dalam konteks ini menunjuk pada mengarahkan atau memalingkan pandangan. Ayub meminta agar pengawasan Allah yang terus-menerus dihentikan sejenak.
- source_word: תַרְפֵּנִי
  choice: membiarkan aku sendiri
  rationale: Bentuk dari רפה berarti melepaskan, membiarkan, atau berhenti menekan. Pilihan ini alami dan sejalan dengan permintaan agar Allah mengalihkan pandangan.
- source_word: עַד
  choice: bahkan sampai
  rationale: עַד menandai batas waktu. Tambahan 'bahkan' menyampaikan daya retoris keluhan bahwa Ayub tidak diberi waktu sesingkat itu pun.
- source_word: בִּלְעִי רֻקִּי
  choice: aku sempat menelan ludahku
  rationale: Terjemahan ini mempertahankan gambaran jasmani yang lugas. Kata 'sempat' memperjelas fungsi idiomatisnya sebagai waktu yang amat singkat tanpa menghapus gambaran asli.
theological_decisions: []
