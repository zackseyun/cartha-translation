  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: id
  text: 'Demikianlah aku telah mendapat bagian: bulan-bulan kesia-siaan[a], dan malam-malam kesusahan[b] telah ditetapkan bagiku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bulan-bulan kehampaan” atau “bulan-bulan kesia-siaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “malam-malam jerih payah,” “malam-malam kesukaran,” atau “malam-malam penderitaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikian juga
  rationale: Menghubungkan pengalaman Ayub dengan gambaran pada ayat sebelumnya, sambil mempertahankan daya perbandingan sekaligus kesimpulannya.
- source_word: הָנְחַלְתִּי לִי
  choice: aku mendapat bagian
  rationale: Bentuk Hofal menyatakan bahwa Ayub menjadi penerima suatu bagian yang diberikan kepadanya. Ungkapan ini alami dalam bahasa Indonesia dan tidak menggambarkan Ayub sebagai pihak yang memilihnya.
- source_word: יַרְחֵי שָׁוְא
  choice: bulan-bulan yang sia-sia
  rationale: יַרְחֵי menunjuk rentang waktu beberapa bulan, sedangkan שָׁוְא menggambarkan kehampaan, kesia-siaan, atau keadaan tanpa hasil dan tujuan.
- source_word: וְלֵילוֹת עָמָל
  choice: dan malam-malam penuh kesusahan
  rationale: עָמָל dapat berarti jerih payah, kesukaran, atau penderitaan. Dalam keluhan Ayub tentang malamnya, 'kesusahan' menyampaikan pengalaman menyakitkan tanpa membatasinya pada kerja fisik.
- source_word: מִנּוּ לִי
  choice: ditetapkan bagiku
  rationale: Bentuk pasif jamak ini menyatakan bahwa malam-malam tersebut ditentukan atau dibagikan kepada Ayub; pilihan ini mempertahankan kepasifan dan ketidakberdayaannya.
theological_decisions:
- issue: Pelaku yang memberikan atau menetapkan penderitaan
  choice: Tidak disebutkan secara eksplisit
  alternative: Menambahkan 'Allah' sebagai pelaku
  rationale: Teks Ibrani memakai bentuk-bentuk pasif tanpa menyebut pelakunya. Terjemahan mempertahankan ketidaktersuratan itu agar tidak menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Pengulangan 'bulan-bulan' dan 'malam-malam' mempertahankan kesejajaran puisi Ibrani, sedangkan konstruksi pasif menjaga kesan bahwa keadaan ini dibebankan kepada Ayub.
