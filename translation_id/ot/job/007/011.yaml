id: JOB.7.11
reference: Job 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם אֲנִי֮ לֹ֤א אֶחֱשָׂ֫ךְ פִּ֥/י אֲֽ֭דַבְּרָה בְּ/צַ֣ר רוּחִ֑/י אָ֝שִׂ֗יחָה בְּ/מַ֣ר נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/011.yaml
  text: I also will not restrain my mouth[a]; I will speak in the distress of my spirit[c][b]; I will complain in the bitterness of my soul.
translation:
  language: id
  text: Aku pun tidak akan mengekang mulutku[a]; aku akan berbicara dalam kesesakan rohku[b]; aku akan mengeluh[c] dalam kepahitan jiwaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menahan mulutku.” Ungkapan Ibrani secara harfiah menggambarkan tindakan tidak menahan atau tidak mengekang mulut.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam kepedihan rohku.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “meratap” atau “berbicara.” Verba Ibrani ini dapat menunjuk pada perenungan, pembicaraan, atau keluh kesah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: pun
  rationale: Partikel "pun" secara alami menyampaikan nilai aditif גַּם dalam bahasa Indonesia tanpa mengubahnya menjadi hubungan sebab-akibat.
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: tidak akan mengekang mulutku
  rationale: Ungkapan ini mempertahankan gambaran Ibrani tentang tidak menahan atau mengekang mulut, sekaligus dapat dipahami sebagai tekad untuk tidak membatasi ucapan.
- source_word: אֲדַבְּרָה
  choice: aku akan berbicara
  rationale: Bentuk ini menyatakan tekad atau maksud Ayub dan menerjemahkan arti dasar verba דבר secara langsung.
- source_word: בְּצַר רוּחִי
  choice: dalam kesesakan rohku
  rationale: '"Kesesakan" mencerminkan צַר, yaitu keadaan sempit, tertekan, atau menderita; "rohku" mempertahankan istilah רוּחַ tanpa menafsirkannya sebagai Roh Kudus.'
- source_word: אָשִׂיחָה
  choice: aku akan mengeluh
  rationale: Dalam konteks ratapan dan kepahitan Ayub, "mengeluh" menyampaikan nuansa ujaran keluh kesah, sambil mengakui dalam catatan kaki bahwa verba ini memiliki rentang arti yang lebih luas.
- source_word: בְּמַר נַפְשִׁי
  choice: dalam kepahitan jiwaku
  rationale: Terjemahan ini mempertahankan metafora kepahitan dan istilah antropologis נֶפֶשׁ, serta sesuai dengan paralelisme puitis ayat tersebut.
theological_decisions:
- issue: Istilah antropologis רוּחַ dan נֶפֶשׁ dalam puisi Ibrani
  choice: Diterjemahkan secara berbeda sebagai "roh" dan "jiwa"
  alternative: Menyamakan keduanya sebagai "batin", atau memakai "pikiran" dan "hati"
  rationale: Teks memakai dua istilah Ibrani yang berbeda dalam paralelisme. Mempertahankan keduanya menjaga tekstur puisi dan ketegangan maknanya tanpa memaksakan doktrin teknis mengenai susunan manusia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Metafora "mengekang mulut" serta pasangan "roh" dan "jiwa" dipertahankan agar tekstur Ibrani tidak diratakan; alternatif leksikal yang penting diberikan dalam catatan kaki.
