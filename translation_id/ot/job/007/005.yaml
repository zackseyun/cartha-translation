translation:
  language: id
  text: Dagingku diselimuti belatung dan gumpalan debu; kulitku mengeras[a], lalu pecah kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kulitku menutup, lalu bernanah kembali.” Makna dua kata kerja Ibrani terakhir sulit dipastikan; baris ini tampaknya menggambarkan kulit yang sempat menutup atau mengeras, kemudian terbuka kembali.
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: berselubungkan
  rationale: Mempertahankan metafora harfiah ‘mengenakan/berpakaian’ dalam bentuk Indonesia yang alami untuk sesuatu yang menutupi daging.
- source_word: בְּשָׂרִי
  choice: dagingku
  rationale: Padanan langsung yang mempertahankan penekanan jasmani dan konkret pada penderitaan Ayub.
- source_word: רִמָּה
  choice: belatung
  rationale: Dalam konteks luka dan pembusukan tubuh, ‘belatung’ menyampaikan larva yang berkaitan dengan jaringan membusuk secara lebih tepat daripada ‘cacing’, tanpa mengubah gambaran pokok.
- source_word: גיש עפר
  choice: gumpalan debu
  rationale: גיש adalah bentuk langka yang kemungkinan menunjuk pada gumpalan atau kerak, sedangkan עפר berarti debu/tanah; pilihan ini mempertahankan citra bahan yang menggumpal pada tubuh.
- source_word: עוֹרִי
  choice: kulitku
  rationale: Padanan biasa dan langsung untuk kulit manusia.
- source_word: רָגַע
  choice: mengeras
  rationale: Dalam urutan gambaran penyakit kulit, kata ini dapat menggambarkan kulit yang sejenak merapat atau mengeras; ketidakpastian maknanya dicatat dalam catatan kaki.
- source_word: וַיִּמָּאֵס
  choice: pecah kembali
  rationale: Dalam konteks kulit berpenyakit, bentuk ini kemungkinan menggambarkan luka yang kembali terbuka atau membusuk; ‘pecah kembali’ menjaga alur konkret tanpa menjadikannya diagnosis medis tertentu.
