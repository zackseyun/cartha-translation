  source_fidelity: 'Terjemahan dengan tepat menyampaikan dua verba Piel berakhiran orang pertama tunggal: Allah menggentarkan/menakutkan Ayub. Pilihan “dengan” untuk בְּ dan מִן mempertahankan pembacaan instrumental yang wajar dalam paralelisme puitis, sementara kemungkinan pembacaan yang lebih formal dicatat dalam catatan kaki. “Maka” merupakan penghubung kontekstual yang dapat dipertanggungjawabkan bagi waw pembuka.'
