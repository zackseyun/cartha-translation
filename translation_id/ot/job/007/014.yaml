  yaml_path: translation/ot/job/007/014.yaml
  text: then you terrify me with dreams and frighten me with visions[a].
translation:
  language: id
  text: maka Engkau menggentarkan aku dengan mimpi-mimpi dan menakutkan aku dengan penglihatan-penglihatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan Engkau menggentarkan aku dalam mimpi-mimpi, dan dari penglihatan-penglihatan Engkau menakutkan aku.” Preposisi-preposisi Ibrani dapat diterjemahkan secara lebih harfiah sebagai “dalam/dengan” dan “dari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: maka
  rationale: Kata penghubung ini mengaitkan keluhan tersebut dengan ayat sebelumnya dan dalam konteks menyatakan akibat atau kelanjutan, bukan sekadar penambahan.
- source_word: חִתַּתַּנִי
  choice: Engkau menggentarkan aku
  rationale: Bentuk Piel dari חתת dengan akhiran orang pertama tunggal menyatakan tindakan yang menimbulkan kengerian hebat; 'menggentarkan' alami dan bermartabat tanpa memberi kesan penghancuran fisik.
- source_word: בַחֲלֹמוֹת
  choice: dengan mimpi-mimpi
  rationale: Preposisi ב dapat menyatakan sarana; 'dengan' menyampaikan bahwa mimpi-mimpi menjadi sarana yang menggentarkan Ayub.
- source_word: וּמֵחֶזְיֹנוֹת
  choice: dan dengan penglihatan-penglihatan
  rationale: Preposisi מן secara harfiah dapat berarti 'dari', tetapi di sini dapat menyatakan sumber atau sarana. 'Dengan' menghasilkan kesejajaran puitis yang wajar, sedangkan kemungkinan 'dari' dipertahankan dalam catatan kaki.
- source_word: תְּבַעֲתַנִּי
  choice: menakutkan aku
  rationale: Bentuk Piel dari בעת dengan akhiran orang pertama tunggal menyatakan timbulnya rasa takut atau kengerian. 'Menakutkan' mempertahankan intensitasnya sekaligus membedakan kata ini dari verba pada baris sebelumnya.
theological_decisions: []
