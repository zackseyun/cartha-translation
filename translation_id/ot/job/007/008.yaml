base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: id
  text: Mata orang yang melihatku tidak akan lagi memandangku[a]; mata-Mu akan tertuju kepadaku[b], tetapi aku sudah tidak ada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mata yang melihatku tidak akan melihatku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mata-Mu tertuju kepadaku, dan aku tidak ada”—ungkapan yang berarti bahwa ketika aku dicari, aku sudah tiada.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: memandang aku
  rationale: Kata kerja שׁור menyatakan tindakan melihat atau menatap. “Memandang” mempertahankan fokus visual dan nada puitis yang wajar dalam bahasa Indonesia.
- source_word: עֵין רֹאִי
  choice: mata orang yang melihat aku
  rationale: Frasa konstruksi ini secara harfiah berarti “mata orang yang melihat aku.” Rumusan tersebut mempertahankan citra konkret Ibrani dan tetap mudah dipahami.
- source_word: לֹא
  choice: tidak akan lagi
  rationale: Walaupun לֹא sendiri hanya merupakan negasi, konteks ratapan tentang lenyapnya Ayub memberi orientasi waktu ke depan; “tidak akan lagi” menyampaikan implikasi itu tanpa mengubah pokok makna.
- source_word: עֵינֶיךָ
  choice: mata-Mu
  rationale: Bentuk Ibrani bersifat jamak dan dalam konteks ditujukan kepada Allah. Kapitalisasi pronomina mengikuti kebiasaan bahasa Indonesia untuk sapaan ilahi tanpa menambahkan nama Allah yang tidak terdapat dalam teks.
- source_word: בִּי
  choice: tertuju kepadaku
  rationale: Dengan subjek “mata-Mu,” ungkapan “tertuju kepadaku” merupakan bahasa Indonesia alami untuk perhatian atau pandangan yang diarahkan kepada seseorang.
- source_word: וְאֵינֶנִּי
  choice: tetapi aku sudah tidak ada
  rationale: Secara harfiah, ungkapan ini berarti “dan aku tidak ada.” Dalam konteks pandangan Allah yang mencari Ayub kelak, “tetapi aku sudah tidak ada” mempertahankan idiom lenyap atau mati sekaligus hubungan kontras yang tersirat.
theological_decisions:
- issue: Pihak yang disapa oleh “mata-Mu”
  choice: Allah sebagai pihak yang disapa
  alternative: Seorang pengamat secara umum sebagai pihak yang disapa
  rationale: Dalam konteks dekat, Ayub berbicara langsung kepada Allah. Terjemahan mempertahankan sapaan langsung itu, tetapi tidak menambahkan “ya Allah” karena nama tersebut tidak muncul dalam ayat ini.
- issue: Makna “aku tidak ada”
  choice: Dibiarkan sebagai ungkapan tentang ketiadaan atau kepergian Ayub
  alternative: Dijelaskan secara eksplisit sebagai kematian Ayub
  rationale: Ungkapan Ibrani dapat menunjuk pada lenyapnya seseorang dari pandangan atau kematiannya. Terjemahan tidak mempersempit ketegangan puitis itu menjadi pernyataan doktrinal yang lebih spesifik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. “Memandang” menjaga nada ratapan yang luhur tanpa terdengar kuno. Bentuk “mata-Mu” mempertahankan citra antropomorfis teks Ibrani; “sudah tidak ada” menjaga ambiguitas antara lenyap dari pandangan dan kematian.
