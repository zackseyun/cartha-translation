  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Objek verba pertama sengaja tidak dipastikan, sesuai dengan ketaksaan teks Ibrani. Penanda catatan [b] ditempatkan pada “embusan napas,” yaitu istilah yang dijelaskannya.
