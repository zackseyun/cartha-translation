base_translation:
  language: en
  yaml_path: translation/ot/job/007/016.yaml
  text: I despise my life[a]; I will not live forever. Leave me alone[b], for my days are a breath.
translation:
  language: id
  text: Aku muak[a]; aku tidak akan hidup untuk selama-lamanya. Biarkanlah aku, sebab hari-hariku hanya embusan napas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku menolaknya” atau “Aku membencinya.” Dalam bahasa Ibrani, objeknya tidak disebutkan; konteksnya dapat menunjuk pada hidup Ayub.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “embusan napas” juga dapat berarti “uap” dan menekankan betapa singkat serta tidak tetapnya kehidupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאַסְתִּי
  choice: Aku muak
  rationale: Verba מָאַס menyatakan penolakan atau rasa jijik yang kuat. Bahasa Ibrani tidak menyebutkan objeknya; terjemahan ini tetap wajar dalam bahasa Indonesia tanpa secara pasti menambahkan “hidupku” sebagai objek.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: aku tidak akan hidup untuk selama-lamanya
  rationale: Ungkapan ini secara langsung menyatakan bahwa Ayub tidak akan terus hidup selamanya, tanpa mengubahnya menjadi suatu keinginan.
- source_word: חֲדַל מִמֶּנִּי
  choice: Biarkanlah aku
  rationale: Imperatif חֲדַל berarti berhenti atau tidak meneruskan, sedangkan מִמֶּנִּי secara harfiah berarti “dari aku.” “Biarkanlah aku” menyampaikan permohonan itu secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi permohonan Ayub.
- source_word: הֶבֶל
  choice: embusan napas
  rationale: הֶבֶל dapat menunjuk pada napas atau uap dan secara kiasan menekankan singkatnya serta rapuhnya kehidupan. “Embusan napas” mempertahankan citra konkretnya.
- source_word: יָמָי
  choice: hari-hariku
  rationale: Bentuk jamak dengan akhiran orang pertama ini menunjuk pada hari-hari kehidupan Ayub.
