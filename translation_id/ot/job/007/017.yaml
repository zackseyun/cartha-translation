base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: id
  text: Apakah manusia fana itu[a], sehingga Engkau menganggapnya begitu penting[b] dan mengarahkan hati-Mu kepadanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai berbentuk tunggal dan menekankan manusia sebagai makhluk yang lemah serta dapat mati; bandingkan Mazmur 8:5.
    reason: lexical_and_cross_reference
  - marker: b
    text: 'Secara lebih harfiah: “membesarkannya” atau “membuatnya besar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Apakah ... itu
  rationale: Membuka pertanyaan retoris secara alami dalam bahasa Indonesia sambil mempertahankan makna dasar ‘apakah/apa gerangan’.
- source_word: אֱנוֹשׁ
  choice: manusia fana
  rationale: Nomina tunggal ini menunjuk kepada manusia sebagai makhluk yang lemah dan dapat mati. ‘Manusia fana’ mempertahankan nuansa tersebut serta daya representatif bentuk tunggalnya.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan retoris ini, כִּי memperkenalkan alasan atau keadaan yang membuat perhatian Allah kepada manusia terasa mengherankan.
- source_word: תְגַדְּלֶנּוּ
  choice: Engkau menganggapnya begitu penting
  rationale: Bentuk Piel dari גדל secara harfiah berarti ‘membesarkan’ atau ‘membuat besar’; dalam konteks ini ungkapan tersebut menyatakan pemberian arti atau perhatian besar. Pilihan ini alami dalam bahasa Indonesia dan tetap membuka nada heran sekaligus gelisah dalam perkataan Ayub.
- source_word: וְכִי
  choice: dan
  rationale: Menghubungkan klausa kedua dengan klausa pertama dalam susunan pertanyaan retoris yang sejajar.
- source_word: תָשִׁית
  choice: menaruh
  rationale: Mewakili arti dasar ‘menempatkan/meletakkan’ dan membentuk ungkapan Indonesia yang wajar bersama ‘hati’.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Menandai manusia sebagai arah atau sasaran hati dan perhatian Allah.
- source_word: לִבֶּךָ
  choice: hati-Mu
  rationale: Mempertahankan gambaran antropomorfis Ibrani; ‘hati’ mencakup pikiran, perhatian, dan kepedulian tanpa mempersempit artinya.
theological_decisions:
- issue: Bentuk tunggal representatif dan nuansa אֱנוֹשׁ
  choice: manusia fana
  alternative: manusia; umat manusia
  rationale: Pilihan ini mempertahankan bentuk tunggal yang mewakili manusia pada umumnya sekaligus menyampaikan nuansa kelemahan dan kefanaan, tanpa mengubahnya menjadi bentuk jamak.
- issue: Bahasa antropomorfis mengenai perhatian Allah
  choice: menaruh hati-Mu kepadanya
  alternative: memberikan perhatian kepadanya; memusatkan pikiran-Mu kepadanya
  rationale: Ungkapan dengan ‘hati’ dipertahankan agar daya puitis dan ketegangan teologis teks tidak dilarutkan menjadi gagasan abstrak semata.
- issue: Nada perhatian ilahi dalam konteks keluhan Ayub
  choice: menganggapnya begitu penting
  alternative: membesarkannya; mengagungkannya
  rationale: Terjemahan ini dapat menyatakan pemberian arti dan perhatian besar tanpa menentukan apakah tindakan itu sepenuhnya menguntungkan; konteks Ayub memberi ungkapan tersebut nada gelisah yang berbeda dari pujian dalam Mazmur 8.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Sapaan kepada Allah memakai huruf kapital. Susunan pertanyaan retoris dipertahankan, sedangkan ungkapan גדל diterjemahkan secara idiomatis agar mudah dipahami pembaca umum.
