  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan retoris dipertahankan. “Kerja berat” dipilih agar mudah dipahami, sedangkan nuansa dinas militer atau peperangan dipertahankan dalam catatan kaki.
