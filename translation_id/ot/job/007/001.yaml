id: JOB.7.1
reference: Job 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/לֹא צָבָ֣א לֶ/אֱנ֣וֹשׁ על אָ֑רֶץ וְ/כִ/ימֵ֖י שָׂכִ֣יר יָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: id
  text: Bukankah manusia harus menjalani kerja berat di bumi[a], dan bukankah hari-harinya seperti hari-hari seorang pekerja upahan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bukankah manusia menghadapi peperangan di bumi?” Kata Ibrani צָבָא dapat berarti dinas militer atau peperangan, tetapi di sini tampaknya menunjuk secara lebih luas pada masa kerja atau pengabdian yang berat, sebagaimana tersirat dari perbandingannya dengan “seorang pekerja upahan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah ...?
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya; bentuk “Bukankah” mempertahankan daya interogatifnya secara alami dalam bahasa Indonesia.
- source_word: צָבָא
  choice: harus menjalani kerja berat
  rationale: Kata ini dapat berarti perang, dinas militer, atau masa pelayanan wajib yang berat. Paralelnya dengan pekerja upahan mendukung gagasan tentang kerja atau pengabdian berat yang harus dijalani, tanpa menutup kemungkinan citra militernya.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Istilah ini menunjuk manusia dalam kelemahan dan kefanaannya. “Manusia” menyampaikan rujukan generik secara wajar dalam bahasa Indonesia.
- source_word: עַל־אָרֶץ
  choice: di bumi
  rationale: Ungkapan lokatif umum yang di sini merujuk pada ranah kehidupan manusia, bukan sebidang tanah tertentu.
- source_word: וְכִימֵי
  choice: dan bukankah hari-harinya seperti hari-hari
  rationale: Susunan ini mempertahankan perbandingan antara hari-hari manusia dan hari-hari pekerja upahan serta meneruskan pertanyaan retoris secara alami.
- source_word: שָׂכִיר
  choice: seorang pekerja upahan
  rationale: Merujuk kepada orang yang bekerja untuk menerima upah. Pilihan ini jelas, modern, dan tidak mengandung nada merendahkan yang tidak dituntut teks.
- source_word: יָמָיו
  choice: hari-harinya
  rationale: Terjemahan langsung yang mempertahankan metafora temporal mengenai hari-hari kehidupan manusia.
theological_decisions: []
