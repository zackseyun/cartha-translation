  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: id
  text: Ia tidak akan kembali lagi ke rumahnya, dan tempatnya tidak akan mengenalinya lagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “mengenalinya” juga dapat berarti “mengakuinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: akan kembali
  rationale: Bentuk imperfek שוב menyatakan bahwa ia tidak akan kembali; frasa ini alami dalam bahasa Indonesia dan sesuai dengan konteks orang yang telah pergi menuju kematian.
- source_word: עוֹד (kemunculan pertama)
  choice: lagi
  rationale: Dengan negasi dan kata 'kembali', עוֹד menyatakan bahwa kepulangan itu tidak akan terjadi lagi.
- source_word: לְבֵיתוֹ
  choice: ke rumahnya
  rationale: Terjemahan konkret dan langsung dari בַּיִת, dengan akhiran pronominal orang ketiga tunggal.
- source_word: יַכִּירֶנּוּ
  choice: akan mengenalinya
  rationale: Bentuk Hifil dari נכר dapat berarti mengenali atau mengakui. 'Mengenalinya' mempertahankan personifikasi puitis bahwa tempat itu seolah-olah mengenal orang yang biasa berada di sana.
- source_word: עוֹד (kemunculan kedua)
  choice: tidak ... lagi
  rationale: Dalam konstruksi negatif, ungkapan Indonesia 'tidak ... lagi' menyampaikan berakhirnya pengenalan secara permanen.
- source_word: מְקֹמוֹ
  choice: tempatnya
  rationale: Terjemahan ringkas dan formal dari מָקוֹם yang mempertahankan keluasan rujukan serta personifikasi teks Ibrani.
theological_decisions:
- issue: Apakah ayat ini menyatakan keadaan akhir manusia secara sistematis
  choice: Mempertahankan pernyataan puitis Ayub bahwa orang itu tidak kembali ke rumah dan tidak lagi dikenali oleh tempatnya
  alternative: Memperjelasnya sebagai pernyataan doktrinal mutlak tentang kehidupan setelah kematian
  rationale: Teks merupakan ratapan puitis dalam konteks ujaran Ayub. Terjemahan tidak boleh menambahkan kesimpulan teologis yang melampaui ungkapan aslinya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis. Pengulangan 'kembali lagi' serta 'tidak ... lagi' dipertahankan untuk mewakili dua kemunculan עוֹד. Personifikasi 'tempatnya ... mengenalinya' sengaja dipertahankan.
