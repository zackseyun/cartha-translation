  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּפְקְדֶ֥/נּוּ לִ/בְקָרִ֑ים לִ֝/רְגָעִ֗ים תִּבְחָנֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/018.yaml
  text: that you attend to him every morning[b][a], and test him every moment?
translation:
  language: id
  text: sehingga Engkau memperhatikannya setiap pagi[a] dan mengujinya setiap saat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengunjunginya setiap pagi.” Kata Ibrani yang digunakan dapat berarti “mengunjungi”, “memperhatikan”, atau “mengindahkan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “memeriksanya setiap saat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: sehingga Engkau memperhatikannya
  rationale: Kata kerja פקד memiliki rentang arti ‘mengunjungi’, ‘memperhatikan’, atau ‘mengindahkan’. Dalam keluhan Ayub dan sejajar dengan ‘menguji’, pilihan ini menyampaikan perhatian aktif Allah tanpa menganggapnya semata-mata sebagai kunjungan yang penuh kebaikan. Konjungsi וַ diterjemahkan ‘sehingga’ untuk melanjutkan pertanyaan retoris dari ayat sebelumnya.
- source_word: לִבְקָרִים
  choice: setiap pagi
  rationale: Bentuk jamak ini menyatakan waktu yang berulang; ‘setiap pagi’ alami dalam bahasa Indonesia dan mempertahankan daya iteratifnya.
- source_word: לִרְגָעִים
  choice: setiap saat
  rationale: רְגָעִים menunjuk pada saat-saat yang sangat singkat dan berulang. ‘Setiap saat’ merupakan ungkapan Indonesia yang alami untuk pengawasan yang terus-menerus.
- source_word: תִּבְחָנֶנּוּ
  choice: mengujinya
  rationale: בחן berarti menguji atau memeriksa dengan saksama. ‘Menguji’ mempertahankan gambaran tentang penyelidikan yang dirasakan membebani dalam konteks keluhan Ayub.
- source_word: ־נּוּ
  choice: -nya
  rationale: Akhiran pronominal maskulin tunggal merujuk kembali kepada manusia dalam ayat sebelumnya. Bentuk ‘-nya’ mempertahankan rujukan tunggal secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Nada pengawasan ilahi
  choice: Tindakan Allah digambarkan sebagai perhatian dan pengujian yang dekat serta terus-menerus, yang dalam keluhan Ayub terasa membebani.
  alternative: Menafsirkannya semata-mata sebagai kunjungan atau pemeliharaan yang penuh kebaikan.
  rationale: Konteks pertanyaan retoris Ayub bernada keluhan. Terjemahan harus mempertahankan ketegangan itu tanpa meniadakan kemungkinan leksikal ‘mengunjungi’.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Huruf kapital pada ‘Engkau’ dipakai sebagai sapaan kepada Allah. Susunan kalimat mempertahankan kesinambungan pertanyaan retoris dari Ayub 7:17.
