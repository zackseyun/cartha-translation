  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: id
  text: Mengapa Engkau tidak mengampuni pelanggaranku dan menghapus kesalahanku?[a] Sebab sekarang aku akan berbaring dalam debu; Engkau akan mencari aku dengan sungguh-sungguh,[b] tetapi aku sudah tidak ada lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kedua verba Ibrani itu berarti “mengangkat/membawa pelanggaranku” dan “membuat kesalahanku berlalu”; dalam konteks ini keduanya menyatakan pengampunan dan penghapusan kesalahan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “Engkau akan mencari aku sejak pagi.” Verba Ibrani ini dapat mengandung nuansa mencari pada pagi hari, tetapi di sini kemungkinan berarti mencari dengan tekun atau sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: mengampuni
  rationale: Secara harfiah verba נשׂא berarti ‘mengangkat/membawa’, tetapi ketika pelanggaran menjadi objeknya, verba ini merupakan ungkapan bagi pengampunan atau penanggungan kesalahan. ‘Mengampuni’ menyampaikan makna idiomatisnya secara alami dalam bahasa Indonesia.
- source_word: פִשְׁעִי
  choice: pelanggaranku
  rationale: פשע menunjuk pada pelanggaran atau pemberontakan, sering dengan nuansa tindakan yang disengaja. ‘Pelanggaranku’ mempertahankan bobot moralnya dan membedakannya dari עון.
- source_word: וְתַעֲבִיר
  choice: dan menghapus
  rationale: Bentuk Hifil dari עבר dapat berarti ‘membuat berlalu’ atau ‘menyingkirkan’. Dengan עון sebagai objek, ‘menghapus’ secara wajar menyatakan peniadaan kesalahan tanpa menyiratkan bahwa Allah sekadar mengabaikannya.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: עון dapat menunjuk pada kesalahan, kebengkokan moral, rasa bersalah, atau akibat kesalahan. Dalam pasangan dengan פשע, ‘kesalahanku’ mempertahankan istilah yang berbeda dan tetap mudah dipahami.
- source_word: כִּי עַתָּה
  choice: Sebab sekarang
  rationale: Frasa ini memberi alasan yang bertumpu pada kematian Ayub yang sudah dekat. ‘Sebab sekarang’ mempertahankan hubungan sebab dan unsur waktunya tanpa menambahkan tafsiran ‘sebentar lagi’.
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: aku akan berbaring dalam debu
  rationale: עפר berarti ‘debu’ dan membangkitkan gambaran kematian serta penguburan. Terjemahan konkret ini mempertahankan citra puitis sumber alih-alih langsung memparafrasakannya sebagai ‘mati’.
- source_word: וְשִׁחֲרְתַּנִי
  choice: Engkau akan mencari aku dengan sungguh-sungguh
  rationale: Dalam bentuk Piel, שׁחר dapat berarti mencari dengan tekun atau sungguh-sungguh, dengan kemungkinan nuansa mencari sejak pagi. Pilihan ini menyampaikan daya idiomatis yang paling sesuai dalam konteks.
- source_word: וְאֵינֶנִּי
  choice: tetapi aku sudah tidak ada lagi
  rationale: Ungkapan harfiahnya ialah ‘dan aku tidak ada’. Dalam konteks tindakan yang akan datang, ‘tetapi aku sudah tidak ada lagi’ secara alami menyatakan bahwa ketika Allah mencarinya, Ayub telah tiada.
theological_decisions:
- issue: Pembedaan dua istilah bagi dosa
  choice: Menerjemahkan פשע sebagai ‘pelanggaran’ dan עון sebagai ‘kesalahan’
  alternative: Memakai ‘dosa’ untuk keduanya, atau memakai ‘pemberontakan’ dan ‘kesalahan/kejahatan’
  rationale: Teks Ibrani memakai dua istilah yang berhubungan tetapi tidak identik. Pembedaan ini menjaga paralelisme serta keluasan kosakata moral tanpa memaksakan sistem teologis tertentu.
- issue: Citra kematian dalam לֶעָפָר אֶשְׁכָּב
  choice: Mempertahankan citra konkret ‘berbaring dalam debu’
  alternative: Menerjemahkannya secara interpretatif sebagai ‘mati’
  rationale: Bahasa sumber menghadirkan gambaran puitis tentang kefanaan dan penguburan. Mempertahankan gambarnya menjaga kekuatan sastra dan ketegangan teks.
- issue: Waktu dan keadaan dalam וְאֵינֶנִּי
  choice: ‘tetapi aku sudah tidak ada lagi’
  alternative: ‘dan aku tidak ada’ atau ‘tetapi aku akan tiada’
  rationale: Bentuk Ibrani secara harfiah menyatakan ketiadaan, sedangkan konteksnya memandang saat Allah kelak mencari Ayub. Pilihan ini membuat hubungan waktunya alami tanpa menentukan lebih jauh keadaan sesudah kematian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ilahi ‘Engkau’. Susunan kalimat mempertahankan pertanyaan retoris, paralelisme istilah moral, dan citra puitis kematian, sambil memakai ungkapan yang jelas bagi pembaca umum.
