  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: id
  text: Sebab engkau akan melupakan kesusahanmu; engkau akan mengingatnya seperti air yang telah mengalir berlalu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau hanya akan mengingatnya sebagai air yang telah mengalir berlalu.” Gambaran Ibrani membandingkan kesusahan yang dahulu dengan air yang sudah lewat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mengungkapkan hubungan penjelasan atau alasan dengan janji pada ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: engkau
  rationale: Mempertahankan pronomina orang kedua tunggal yang dinyatakan secara eksplisit dalam bahasa Ibrani, sekaligus sesuai dengan ragam Alkitab yang bermartabat.
- source_word: עָמָל
  choice: kesusahan
  rationale: Dalam konteks penderitaan Ayub, kata ini menunjuk pada kesulitan, derita, atau kemalangan; 'kesusahan' cukup luas dan alami tanpa membatasinya pada jerih payah.
- source_word: תִּשְׁכָּח
  choice: akan melupakan
  rationale: Bentuk imperfek Qal orang kedua tunggal maskulin memiliki makna mendatang dalam konteks janji ini.
- source_word: כְ/מַיִם
  choice: seperti air
  rationale: Awalan perbandingan כְּ diterjemahkan 'seperti'; bentuk kolektif 'air' lebih alami dalam bahasa Indonesia sambil mempertahankan citra Ibrani.
- source_word: עָבְרוּ
  choice: telah mengalir berlalu
  rationale: Kata kerja עבר menggambarkan air yang sudah lewat dan tidak lagi hadir; 'mengalir berlalu' membuat citra air jelas tanpa menghilangkan aspek tindakan yang telah selesai.
- source_word: תִזְכֹּר
  choice: akan mengingatnya
  rationale: Objek '-nya' yang tersirat merujuk kembali pada kesusahan dan diperlukan agar perbandingan terbaca jelas dalam bahasa Indonesia.
