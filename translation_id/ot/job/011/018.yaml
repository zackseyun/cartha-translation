  naturalness: Bahasa draf sudah baku dan alami. “Memeriksa sekeliling” merupakan cara yang wajar untuk menyampaikan penafsiran kontekstual atas חפר. “Dan berbaring dengan aman” mengalir alami tanpa penambahan nuansa temporal.
