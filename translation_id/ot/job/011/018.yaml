  text: And you will be secure[a], because there is hope; you will look around and lie down in safety.
translation:
  language: id
  text: Engkau akan merasa aman karena ada harapan; engkau akan memeriksa sekeliling[a] dan berbaring dengan aman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggali sekeliling.” Kata kerja Ibrani ini secara harfiah berarti “menggali,” tetapi di sini mungkin merujuk pada memeriksa atau menyiapkan tempat sebelum berbaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: Engkau akan merasa aman
  rationale: Bentuk dari בטח menyatakan keyakinan atau rasa aman yang timbul karena masih ada harapan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan keadaan yang digambarkan.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: karena ada harapan
  rationale: כִּי berfungsi kausal, sedangkan תִּקְוָה berarti harapan atau pengharapan. Terjemahan ini langsung dan alami.
- source_word: וְחָפַרְתָּ
  choice: engkau akan memeriksa sekeliling[a]
  rationale: חפר pada dasarnya berkaitan dengan tindakan menggali, tetapi dalam konteks ini dapat menunjuk pada pemeriksaan atau penyiapan tempat sebelum berbaring. Terjemahan utama menyampaikan kemungkinan makna kontekstual, sementara arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: לָבֶטַח
  choice: dengan tenteram
  rationale: Ungkapan adverbial ini menyatakan keadaan aman atau tanpa rasa takut. 'Dengan tenteram' cocok secara alami dengan tindakan berbaring.
- source_word: תִּשְׁכָּב
  choice: berbaring
  rationale: שׁכב secara konkret berarti berbaring; pilihan ini mempertahankan gambaran teks tanpa mengubahnya menjadi istilah yang lebih tafsiran seperti 'beristirahat'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk orang kedua tunggal 'engkau' dipakai sesuai konteks tuturan langsung dalam kitab Ayub; susunan kalimat dibuat alami tanpa menghilangkan ambiguitas leksikal pada חפר.
