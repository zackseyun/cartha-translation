  text: בַּ֭דֶּי/ךָ מְתִ֣ים יַחֲרִ֑ישׁו וַ֝/תִּלְעַ֗ג וְ/אֵ֣ין מַכְלִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: id
  text: Apakah omong kosongmu akan membuat orang-orang berdiam diri,[a] dan ketika engkau mencemooh, tidak adakah yang akan mempermalukanmu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bualanmu” atau “ocehanmu”. Istilah Ibraninya dapat menunjuk pada perkataan yang kosong, sia-sia, membual, atau palsu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: omong kosongmu
  rationale: Nomina בַּד dapat menunjuk pada perkataan kosong, sia-sia, membual, atau palsu. Dalam teguran Zofar, “omong kosongmu” menyampaikan nada meremehkan tanpa secara tegas menuduh Ayub berdusta.
- source_word: מְתִים
  choice: orang-orang
  rationale: Bentuk jamak ini menunjuk kepada manusia atau orang secara umum. “Orang-orang” alami dalam bahasa Indonesia dan tidak mempersempit acuannya kepada laki-laki saja.
- source_word: יַחֲרִישׁו
  choice: membuat ... berdiam diri
  rationale: Bentuk verba ini menyatakan tindakan menyebabkan atau membuat pihak lain diam; susunan tersebut mempertahankan nuansa kausatif dalam pertanyaan retoris.
- source_word: וַתִּלְעַג
  choice: dan ketika engkau mencemooh
  rationale: Verba לָעַג berarti mengejek atau mencemooh. “Ketika” mengungkapkan kaitan situasional antarklausa secara alami, sedangkan “dan” tetap mencerminkan penghubung Ibrani.
- source_word: מַכְלִם
  choice: yang akan mempermalukanmu
  rationale: Partisipel kausatif dari כלם berarti menyebabkan malu atau mendapat aib. Pilihan ini mempertahankan daya interpersonalnya tanpa mengubahnya menjadi sekadar “menegur”.
