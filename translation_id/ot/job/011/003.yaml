translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis-retoris yang tegas. Pronomina “engkau” dipakai untuk menjaga keluhuran register, sedangkan “omong kosong” dipilih karena jelas bagi pembaca umum dan sesuai dengan nada tajam Zofar.
