  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: id
  text: Jika Dia melintas, lalu mengurung seseorang dan mengumpulkan orang-orang[a], siapa yang dapat membuat Dia kembali?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Mengumpulkan orang-orang" dapat juga diterjemahkan "menghimpunkan" atau "memanggil sidang"; mungkin terdapat nuansa pengadilan.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "siapa yang dapat membuat dia kembali?" Ini juga dapat dipahami sebagai "siapa yang dapat membatalkannya?", yakni membalikkan tindakan-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk pengandaian atau keadaan hipotetis dalam pernyataan retoris Zofar.
- source_word: יַחֲלֹף
  choice: Dia melintas
  rationale: Kata kerja חלף menyatakan gerak melewati atau melintas; pilihan ini mempertahankan gambaran tindakan tanpa menambahkan kesan kehancuran.
- source_word: וְיַסְגִּיר
  choice: lalu mengurung seseorang
  rationale: Bentuk kausatif dari סגר dapat berarti menutup, mengurung, atau menyerahkan. 'Mengurung' mempertahankan citra konkret; 'seseorang' melengkapi verba transitif secara wajar dalam bahasa Indonesia meskipun objeknya tersirat dalam bahasa Ibrani.
- source_word: וְיַקְהִיל
  choice: dan menghimpunkan orang-orang
  rationale: Bentuk kausatif dari קהל berarti mengumpulkan, menghimpunkan, atau memanggil suatu perhimpunan. Pilihan ini alami dalam bahasa Indonesia dan tidak memastikan nuansa pengadilan yang hanya mungkin tersirat.
- source_word: וּמִי
  choice: siapa
  rationale: Memulai pertanyaan retoris sebagai akibat dari rangkaian tindakan sebelumnya; hubungan logisnya sudah jelas tanpa harus menambahkan 'maka'.
- source_word: יְשִׁיבֶנּוּ
  choice: dapat membuat-Nya berbalik
  rationale: Bentuk kausatif dari שוב dengan akhiran orang ketiga maskulin tunggal secara harfiah menyatakan membuat dia kembali atau berbalik. Terjemahan ini mempertahankan rujukan personal dan daya retoris tindakan Allah yang tidak dapat dicegah.
theological_decisions:
- issue: Rujukan subjek verba maskulin tunggal dan akhiran pada יְשִׁיבֶנּוּ
  choice: Subjek dipahami sebagai Allah, dan akhiran terakhir diterjemahkan secara personal sebagai '-Nya'.
  alternative: 'Akhiran itu dapat dipahami lebih umum sebagai tindakan atau keadaan yang hendak dibalikkan: ''siapa dapat membatalkannya?'''
  rationale: Konteks sekitarnya membicarakan pengetahuan dan tindakan Allah. Rujukan personal paling langsung mengikuti tata bahasa dan alur wacana, sementara kemungkinan makna yang lebih umum dipertahankan dalam catatan kaki.
- issue: Kemungkinan nuansa yudisial pada וְיַקְהִיל
  choice: Teks utama memakai 'menghimpunkan orang-orang' tanpa secara tegas menyebut pengadilan.
  alternative: Dapat diterjemahkan 'memanggil sidang' bila perhimpunan itu dipahami bernuansa yudisial.
  rationale: Akar קהל menyatakan penghimpunan atau pemanggilan suatu kumpulan, tetapi kata itu sendiri tidak mewajibkan nuansa pengadilan. Terjemahan utama tidak mempersempit makna yang masih terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi 'Dia' dan '-Nya' menandai rujukan kepada Allah sesuai konteks. Susunan klausa mempertahankan gerak retoris bahasa Ibrani, sedangkan objek generik ditambahkan seperlunya agar verba transitif terdengar alami.
