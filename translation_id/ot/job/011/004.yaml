  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֭/תֹּאמֶר זַ֣ךְ לִקְחִ֑/י וּ֝/בַ֗ר הָיִ֥יתִי בְ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: id
  text: Sebab engkau berkata, “Ajaranku[a] murni, dan aku bersih di mata-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelajaranku,” “pengajaranku,” atau “perkataanku.” Kata Ibrani ini dapat menunjuk pada sesuatu yang diterima atau disampaikan sebagai ajaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: engkau berkata
  rationale: Bentuk wayyiqtol orang kedua tunggal maskulin dari אמר ditujukan Zofar kepada Ayub. Dalam tuduhan yang sedang dikemukakan, bentuk Indonesia ini dapat merangkum pernyataan Ayub tanpa harus menekankan waktu lampau.
- source_word: זַךְ
  choice: murni
  rationale: Kata sifat ini berarti murni atau bersih. “Murni” cocok untuk menilai isi ajaran dan membedakannya dari בַר pada klausa berikutnya.
- source_word: לִקְחִי
  choice: ajaranku
  rationale: Nomina לקח dapat menunjuk pada sesuatu yang diterima atau disampaikan sebagai pelajaran, ajaran, atau tuturan. “Ajaranku” ringkas dan alami untuk isi pandangan yang menurut Zofar telah dikemukakan Ayub.
- source_word: וּבַר
  choice: dan aku bersih
  rationale: בַר berarti bersih atau murni. “Bersih” mempertahankan kedekatan maknanya dengan זַךְ sekaligus menghindari pengulangan kata “murni”.
- source_word: הָיִיתִי
  choice: aku bersih
  rationale: Walaupun היה berbentuk perfektif orang pertama tunggal, dalam klaim keadaan ini bahasa Indonesia paling alami memakai predikasi tanpa kopula, yang menyatakan keadaan diri pada saat yang dimaksud.
- source_word: בְעֵינֶיךָ
  choice: di mata-Mu
  rationale: Ungkapan harfiah ini menyatakan penilaian seseorang. Akhiran orang kedua tunggal dipertahankan, dan huruf kapital menunjukkan bahwa dalam kutipan yang dirangkum Zofar, sapaan itu diarahkan kepada Allah.
theological_decisions:
- issue: Rujukan orang kedua tunggal dalam בְעֵינֶיךָ
  choice: Allah, ditandai dengan “di mata-Mu”
  alternative: Lawan bicara secara lebih umum, “di matamu”
  rationale: Zofar sedang merangkum klaim Ayub tentang kebersihannya di hadapan Allah. Bentuk tunggal cocok dengan sapaan langsung kepada Allah dalam klaim yang dikutip, tanpa menambahkan nama atau penjelasan yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. “Engkau” sesuai dengan wacana puitis langsung, sedangkan “ajaranku murni” mempertahankan bentuk ringkas klausa Ibrani. Tanda kapital pada “-Mu” mengikuti konvensi Indonesia untuk sapaan kepada Allah.
