  yaml_path: translation/ot/job/011/005.yaml
  text: But if only God would speak and open his lips against you,[a]
translation:
  language: id
  text: Namun, sekiranya saja Allah mau berbicara denganmu dan membuka bibir-Nya![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepadamu” atau “menentangmu.” Kata depan Ibrani secara harfiah berarti “dengan”; dalam konteks ini dapat pula dipahami bernuansa konfrontatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Menandai peralihan yang tegas dan bernada pertentangan dari perkataan sebelumnya dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: מִי יִתֵּן
  choice: sekiranya saja
  rationale: Ungkapan Ibrani ini menyatakan harapan kuat, bukan pertanyaan harfiah tentang siapa yang akan memberi.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Gelar ilahi tunggal ini secara wajar diterjemahkan 'Allah' tanpa menambahkan unsur seperti 'Yang Mahakuasa' yang tidak terdapat dalam bentuk sumber.
- source_word: דַּבֵּר
  choice: mau berbicara
  rationale: Dalam lingkup ungkapan harapan מִי יִתֵּן, bentuk ini menyatakan tindakan yang sangat diharapkan Zofar; 'mau berbicara' alami dalam bahasa Indonesia.
- source_word: וְיִפְתַּח
  choice: dan membuka
  rationale: Mempertahankan tindakan kedua yang sejajar dengan 'berbicara' dan citra konkret teks Ibrani.
- source_word: שְׂפָתָיו
  choice: bibir-Nya
  rationale: Mempertahankan ungkapan antropomorfis yang secara khusus menyebut bibir, bukan meratakannya menjadi 'mulut' atau sekadar 'berkata'.
- source_word: עִמָּךְ
  choice: untuk menentangmu
  rationale: Walaupun preposisi ini secara harfiah biasanya berarti 'denganmu', konteks menunjukkan bahwa Zofar menginginkan Allah berbicara untuk menghadapi dan membantah Ayub. Catatan kaki mempertahankan kemungkinan makna yang lebih netral.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah ('membuka bibir-Nya')
  choice: Ungkapan antropomorfis dipertahankan secara langsung
  alternative: Diparafrasakan menjadi 'berbicara kepadamu'
  rationale: Teks Ibrani memakai gambaran jasmani untuk tindakan Allah berbicara. Mempertahankannya menghormati bentuk sumber tanpa mengharuskan kesimpulan bahwa Allah memiliki tubuh jasmani.
- issue: Daya makna עִמָּךְ dalam konteks
  choice: Diterjemahkan secara konfrontatif sebagai 'untuk menentangmu'
  alternative: '''denganmu'' atau ''kepadamu'''
  rationale: Zofar mengharapkan Allah menghadapi pernyataan Ayub, bukan sekadar bercakap-cakap dengannya. Karena bentuk Ibraninya sendiri dapat dibaca lebih netral, alternatif tersebut dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Sapaan orang kedua tunggal diwujudkan melalui akhiran -mu agar alami dan tetap langsung; kapitalisasi pada -Nya mengikuti kebiasaan penulisan rujukan kepada Allah.
