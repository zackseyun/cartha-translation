base_translation:
  language: en
  yaml_path: translation/ot/job/011/019.yaml
  text: You will lie down[a], and none will make you afraid; many will entreat your favor.
translation:
  language: id
  text: Engkau akan berbaring tanpa seorang pun membuatmu takut; banyak orang akan memohon perkenananmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “akan memohon wajahmu,” sebuah ungkapan yang berarti memohon perkenananmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבַצְתָּ
  choice: Engkau akan berbaring
  rationale: רָבַץ secara langsung menggambarkan tindakan berbaring atau merebahkan diri, dengan konteks rasa aman; terjemahan ini mempertahankan gambaran konkret tanpa mempersempitnya menjadi tidur.
- source_word: וְאֵין מַחֲרִיד
  choice: tanpa seorang pun membuatmu takut
  rationale: מַחֲרִיד adalah bentuk partisip kausatif yang menunjuk kepada orang atau hal yang menyebabkan kegentaran. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penyangkalan keberadaan pelaku tersebut.
- source_word: וְחִלּוּ פָנֶיךָ
  choice: akan memohon perkenananmu
  rationale: Gabungan חלה dengan פנה merupakan idiom untuk memohon atau mencari perkenanan seseorang. 'Memohon perkenananmu' menyampaikan unsur permohonan dengan wajar tanpa menerjemahkan 'wajah' secara kaku.
- source_word: רַבִּים
  choice: banyak orang
  rationale: Bentuk substantival ini menunjuk kepada sejumlah besar orang; penambahan 'orang' diperlukan agar maknanya jelas dan alami dalam bahasa Indonesia.
