  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur puitis dua bagian dipertahankan dengan tanda titik koma; idiom Ibrani dijelaskan melalui catatan kaki tanpa dimasukkan secara kaku ke dalam teks utama.
