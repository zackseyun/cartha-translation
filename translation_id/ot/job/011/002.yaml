translation:
  language: id
  text: Haruskah begitu banyak perkataan tidak dijawab, dan haruskah seseorang yang banyak bicara dinyatakan benar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang laki-laki dari bibir-bibir”. Idiom Ibrani ini menunjuk kepada seseorang yang dicirikan oleh perkataannya, kemungkinan seorang yang berbicara berlebihan atau kosong. “Dinyatakan benar” juga dapat diterjemahkan “terbukti benar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: banyaknya perkataan
  rationale: Ungkapan ini menyatakan kelimpahan atau banyaknya kata-kata. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan nada teguran terhadap ucapan yang berlebihan.
- source_word: לֹא יֵעָנֶה
  choice: dibiarkan tanpa jawaban
  rationale: Bentuk Nifal dari ענה di sini bermakna pasif, yaitu 'tidak dijawab'. Rumusan ini menyampaikan pertanyaan retoris dengan wajar dalam bahasa Indonesia.
- source_word: וְאִם
  choice: dan apakah
  rationale: Dalam paralelisme puisi ini, וְאִם melanjutkan pertanyaan retoris, bukan terutama menyatakan syarat. 'Dan apakah' mempertahankan hubungan antarklausa secara alami.
- source_word: אִישׁ שְׂפָתַיִם
  choice: orang yang banyak bicara
  rationale: Secara harfiah berarti 'orang berbibir', sebuah idiom bagi orang yang dicirikan oleh banyak bicara. Terjemahan idiomatis ini lebih mudah dipahami pembaca Indonesia tanpa menghilangkan nada negatif konteksnya.
- source_word: יִצְדָּק
  choice: dinyatakan benar
  rationale: 'Qal dari צדק di sini bersifat evaluatif atau forensik: dinilai atau dinyatakan berada di pihak yang benar. Pilihan ini jelas dan tidak memasukkan muatan teologis khusus yang tidak dituntut konteks.'
theological_decisions:
- issue: Makna צדק dalam konteks perdebatan
  choice: dinyatakan benar
  alternative: dibenarkan; terbukti benar; dianggap benar
  rationale: Konteksnya adalah penilaian atas klaim Ayub dalam perdebatan, bukan doktrin pembenaran. 'Dinyatakan benar' mempertahankan nuansa evaluatif tanpa mempersempitnya menjadi pembuktian faktual semata.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur pertanyaan retoris serta paralelisme Ibrani dipertahankan, sedangkan idiom 'orang berbibir' diterjemahkan secara komunikatif dan dijelaskan dalam catatan kaki.
