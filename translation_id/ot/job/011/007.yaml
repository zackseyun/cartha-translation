source:
  edition: WLC
  text: הַ/חֵ֣קֶר אֱל֣וֹהַ תִּמְצָ֑א אִ֤ם עַד תַּכְלִ֖ית שַׁדַּ֣י תִּמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/007.yaml
  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: id
  text: Dapatkah engkau menyelami kedalaman Allah?[a] Dapatkah engkau menemukan batas Yang Mahakuasa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dapatkah engkau menemukan apa yang dapat diselidiki tentang Allah?” Kata Ibrani חֵקֶר dapat berarti penyelidikan atau sesuatu yang diselidiki sampai tuntas.
    reason: lexical_alternative
  - marker: b
    text: Atau “ujung”, “keluasan sepenuhnya”, atau “kesempurnaan Yang Mahakuasa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: kedalaman
  rationale: Nomina חֵקֶר dapat menunjuk pada penyelidikan maupun sesuatu yang diselidiki sampai tuntas. Dalam pertanyaan retoris ini, “kedalaman” secara wajar menyampaikan apa yang berada di luar jangkauan penyelidikan manusia.
- source_word: אֱלוֹהַ
  choice: Allah
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk gelar ilahi tunggal ini, serta sesuai dengan paralelnya, שַׁדַּי.
- source_word: תִּמְצָא (klausa pertama)
  choice: menyelami
  rationale: Secara dasar berarti “menemukan”, tetapi bersama חֵקֶר, “menyelami” menyampaikan usaha menyelidiki dan mencapai pemahaman mendalam dengan lebih alami dalam bahasa Indonesia.
- source_word: אִם
  choice: Dapatkah
  rationale: Di sini אִם mengawali pertanyaan retoris kedua, bukan menyatakan syarat. Pengulangan “Dapatkah” mempertahankan kesejajaran kedua klausa.
- source_word: עַד תַּכְלִית
  choice: batas
  rationale: Gabungan ini menunjuk pada ujung, batas terjauh, atau keluasan sepenuhnya. “Batas” mempertahankan gambaran tentang titik terjauh yang tidak mampu dicapai manusia.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan gelar ilahi yang mapan, jelas, dan sesuai dengan konteks kitab Ayub.
- source_word: תִּמְצָא (klausa kedua)
  choice: menemukan
  rationale: Padanan langsung verba מצא yang terdengar alami bersama objek “batas” dan mempertahankan gagasan keberhasilan pencarian.
theological_decisions:
- issue: Bahasa tentang kemampuan manusia memahami Allah
  choice: Pertanyaan retoris menyatakan ketidakmampuan manusia menyelami Allah sampai tuntas atau mencapai batas-Nya.
  alternative: Memahaminya sebagai pernyataan bahwa manusia sama sekali tidak dapat mengenal Allah.
  rationale: Teks menekankan bahwa kedalaman dan keluasan Allah tidak dapat dicapai sepenuhnya; teks tidak secara eksplisit menyangkal segala kemungkinan pengetahuan yang benar tentang Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” dipakai untuk sapaan tunggal dalam wacana puitis. Kedua pertanyaan dibuat sejajar, sementara “menyelami” pada klausa pertama dan “menemukan” pada klausa kedua menjaga kealamian tanpa menghapus hubungan leksikalnya.
