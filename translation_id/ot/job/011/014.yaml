  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: id
  text: Jika kejahatan ada di tanganmu,[a] jauhkanlah itu, dan jangan biarkan ketidakadilan tinggal di dalam kemah-kemahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “ada di tanganmu” dapat berarti dilakukan olehmu atau berada di bawah kuasamu.
    reason: lexical_alternative
  - marker: b
    text: “Kemah-kemahmu” merujuk pada lingkungan rumah tangga atau kehidupan keluargamu.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan klausa bersyarat secara langsung dan wajar dalam bahasa Indonesia.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Dalam nasihat moral ini, kata tersebut menunjuk pada perbuatan jahat atau kesalahan. “Kejahatan” mempertahankan bobot etisnya tanpa mempersempitnya menjadi istilah teologis teknis.
- source_word: בְּיָדְךָ
  choice: ada di tanganmu
  rationale: Mempertahankan gambaran konkret bahasa Ibrani tentang sesuatu yang dilakukan, dimiliki, atau berada di bawah kuasa seseorang.
- source_word: הַרְחִיקֵהוּ
  choice: jauhkanlah itu
  rationale: Bentuk kausatif imperatif menuntut tindakan aktif untuk membuat kejahatan itu berada jauh.
- source_word: וְאַל
  choice: dan jangan
  rationale: Padanan alami untuk kata penghubung yang diikuti larangan.
- source_word: תַּשְׁכֵּן
  choice: biarkan ... tinggal
  rationale: Berasal dari kata kerja “tinggal/menetap”; dalam konstruksi larangan ini, maksudnya ialah tidak mengizinkan ketidakadilan menetap.
- source_word: בְּאֹהָלֶיךָ
  choice: di dalam kemah-kemahmu
  rationale: Mempertahankan bentuk jamak dan latar konkret kuno, sekaligus menyiratkan lingkungan rumah tangga.
- source_word: עַוְלָה
  choice: ketidakadilan
  rationale: Menunjuk pada hal yang tidak adil atau salah. Pilihan ini membedakannya dari אָוֶן sambil mempertahankan kesejajaran makna etis.
theological_decisions:
- issue: Istilah moral dalam paralelisme puitis
  choice: Menerjemahkan אָוֶן dan עַוְלָה dengan dua istilah etis yang berkaitan, yaitu “kejahatan” dan “ketidakadilan”.
  alternative: Memakai istilah Indonesia yang sama untuk keduanya, atau menerjemahkan keduanya secara umum sebagai “kejahatan”.
  rationale: Dua istilah terkait mempertahankan variasi diksi Ibrani dan paralelisme puisi tanpa menciptakan pembedaan teologis teknis yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Gambaran konkret “tangan” dan bentuk jamak “kemah-kemah” dipertahankan, dengan catatan kaki untuk menjelaskan makna idiomatis dan ranah rumah tangga.
