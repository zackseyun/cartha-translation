  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: id
  text: Lebih tinggi daripada langit—apa yang dapat kaulakukan? Lebih dalam daripada Sheol—apa yang dapat kauketahui?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “lebih dalam daripada kubur” atau “lebih dalam daripada alam orang mati”. Ibrani: Sheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: lebih tinggi daripada langit
  rationale: Frasa konstruksi ini secara harfiah menunjuk pada ketinggian langit. Bentuk komparatif alami dalam bahasa Indonesia mempertahankan kesejajaran puitis dan gagasan tentang sesuatu yang melampaui langit.
- source_word: מַה
  choice: apa
  rationale: Kata tanya ini membuka pertanyaan retoris pada kedua bagian ayat; 'apa' mempertahankan daya langsung teks Ibrani.
- source_word: תִּפְעָל
  choice: dapat kaulakukan
  rationale: Bentuk imperfek Qal orang kedua tunggal dari פעל berarti melakukan atau mengerjakan. Dalam pertanyaan retoris ini, bentuk tersebut menyatakan kemampuan.
- source_word: עֲמֻקָּה
  choice: lebih dalam
  rationale: Kata sifat 'dalam' meneruskan pokok tersirat dari ayat sebelumnya. Bentuk komparatif menjaga kesejajaran dengan 'lebih tinggi' pada bagian pertama.
- source_word: מִשְּׁאוֹל
  choice: daripada Syeol
  rationale: Preposisi מִן berfungsi sebagai penanda perbandingan. 'Syeol' mempertahankan istilah dunia sumber dan tidak mempersempit maknanya menjadi kubur fisik semata.
- source_word: תֵּדָע
  choice: dapat kauketahui
  rationale: Bentuk imperfek Qal orang kedua tunggal dari ידע berarti mengetahui. Sejajar dengan 'dapat kaulakukan', pertanyaan ini menyoroti keterbatasan kemampuan manusia.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; alam orang mati
  rationale: Dalam ayat ini, Syeol menjadi pembanding puitis untuk kedalaman. Transliterasi menjaga cakupan konsep Ibrani tanpa menyamakannya hanya dengan tempat penguburan atau memberi penafsiran teologis yang terlalu khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk terikat 'kau-' menjaga sapaan tunggal serta menghasilkan ritme yang ringkas dan wajar. Tanda pisah mempertahankan struktur dua pertanyaan retoris yang sejajar.
