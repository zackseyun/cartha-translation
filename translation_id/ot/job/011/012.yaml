  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: id
  text: Namun, orang yang pikirannya kosong akan memperoleh pengertian ketika anak keledai liar lahir sebagai manusia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “orang yang kosong mendapat hati.” Dalam idiom Ibrani, mendapat hati berarti memperoleh akal atau pengertian.'
    reason: lexical_alternative
  - marker: b
    text: 'Kalimat ini kemungkinan bersifat ironis: orang bebal akan menjadi bijaksana hanya apabila anak keledai liar lahir sebagai manusia—sesuatu yang mustahil.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ נָבוּב
  choice: orang yang kosong pikirannya
  rationale: Ungkapan ini mempertahankan gambaran harfiah tentang kekosongan sekaligus menyampaikan maksud kiasannya, yaitu orang yang tidak berakal, dalam bahasa Indonesia yang wajar.
- source_word: יִלָּבֵב
  choice: akan memperoleh pengertian
  rationale: Bentuk Nifal ini secara harfiah berarti 'mendapat hati'; dalam idiom Ibrani, hati menunjuk pada akal atau pengertian. Bentuk 'akan memperoleh' juga mencerminkan verba imperfek.
- source_word: וְ
  choice: Namun
  rationale: Kata sambung ini dipahami bernuansa pertentangan dalam konteks pernyataan ironis tersebut.
- source_word: עַיִר פֶּרֶא
  choice: anak keledai liar
  rationale: Frasa konstruksi ini menunjuk pada anak dari keledai liar; terjemahan tersebut jelas dan alami dalam bahasa Indonesia modern.
- source_word: אָדָם
  choice: manusia
  rationale: Di sini kata tersebut mengontraskan anak binatang dengan manusia sebagai jenis makhluk, sehingga 'manusia' lebih tepat daripada 'laki-laki'.
- source_word: יִוָּלֵד
  choice: lahir
  rationale: Bentuk Nifal dari ילד secara langsung menyatakan 'dilahirkan' atau 'lahir'; bentuk aktif taktransitif lebih alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya ironis peribahasa
  choice: 'Kalimat diterjemahkan sebagai perbandingan ironis tentang sesuatu yang mustahil: orang yang kosong pikirannya memperoleh pengertian ketika anak keledai liar lahir sebagai manusia.'
  alternative: Kalimat dapat dibaca kurang eksplisit sebagai dua pernyataan sejajar, atau sebagai harapan bahwa orang yang tidak berakal dapat menjadi bijaksana.
  rationale: Teks Ibrani ringkas dan sulit, tetapi kesejajaran kedua bagiannya paling mungkin menyamakan kemungkinan orang bebal menjadi berpengertian dengan kemustahilan anak keledai liar lahir sebagai manusia. Kata 'ketika' menyampaikan ironi itu tanpa menambahkan kata 'hanya' ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'kosong pikirannya' mempertahankan citra Ibrani, sedangkan catatan kaki menjelaskan idiom 'mendapat hati' dan kemungkinan ironi.
