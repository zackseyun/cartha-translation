  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: id
  text: Hidupmu[a] akan bangkit, lebih terang daripada tengah hari[b]; sekalipun ada kegelapan[c], kegelapan itu akan menjadi seperti pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti “masa hidupmu” atau, secara lebih luas, “keberadaanmu di dunia.”
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan lain: “Hidupmu akan lebih terang daripada tengah hari; kegelapan akan menjadi seperti pagi.” Bahasa Ibrani ayat ini memakai beberapa ungkapan puitis yang padat, terutama pada baris kedua.'
    reason: alternative_reading
  - marker: c
    text: Kata Ibrani langka yang diterjemahkan “kegelapan” tidak pasti; kemungkinan lain ialah “kesuraman” atau “kekaburan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלֶד
  choice: kehidupanmu
  rationale: Kata ini dapat menunjuk pada masa hidup atau keberadaan seseorang di dunia. Dalam konteks sapaan langsung Zofar kepada Ayub, bentuk milik orang kedua dibuat tersurat agar alami dalam bahasa Indonesia.
- source_word: וּמִצָּהֳרַיִם
  choice: lebih terang daripada tengah hari
  rationale: Preposisi מִן paling wajar dipahami sebagai perbandingan dalam gambaran tentang cahaya. Kata 'terang' tersirat oleh perbandingan dengan tengah hari dan dibuat tersurat dalam bahasa Indonesia.
- source_word: יָקוּם
  choice: akan terbit
  rationale: Arti dasarnya ialah bangkit atau muncul. 'Terbit' mempertahankan metafora gerak sekaligus selaras dengan gambaran cahaya dan pagi.
- source_word: תָּעֻפָה
  choice: sekalipun ada kegelapan
  rationale: Istilah langka ini tidak pasti, tetapi dalam konteksnya kemungkinan menunjuk pada kegelapan atau kesuraman. Hubungan konsesif dibuat tersurat untuk menyampaikan kontras puitis dengan pagi tanpa mengklaim bahwa bentuk Ibraninya sendiri merupakan konjungsi.
- source_word: כַּבֹּקֶר
  choice: seperti pagi
  rationale: Terjemahan ini mempertahankan perbandingan yang ditandai oleh כ dan gambaran pagi sebagai lawan kegelapan.
- source_word: תִּהְיֶה
  choice: semuanya akan menjadi
  rationale: Kata היה pada dasarnya berarti 'ada' atau 'menjadi'. 'Menjadi' menyampaikan perubahan yang digambarkan, sedangkan 'semuanya' menyediakan rujukan alami dalam bahasa Indonesia bagi susunan Ibrani yang sangat padat.
theological_decisions:
- issue: Apakah ucapan Zofar menyatakan janji ilahi langsung atau gambaran bersyarat tentang masa depan Ayub
  choice: Dipertahankan sebagai pernyataan Zofar tanpa diberi cap sebagai janji langsung dari Allah
  alternative: Merumuskannya sebagai jaminan ilahi langsung
  rationale: Konteks sastra menempatkan kalimat ini dalam pidato Zofar. Terjemahan tidak seharusnya menambahkan kewibawaan teologis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Terbit' dipilih agar citra bangkit dan cahaya tetap terasa. Susunan kalimat dibuat lancar bagi pembaca umum, sementara ketidakpastian istilah langka dan kepadatan sintaksis Ibrani dipertahankan melalui catatan kaki.
