base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: id
  text: Sebab Dia mengenal orang-orang yang penuh kepalsuan; ketika Dia melihat kejahatan, tidakkah Dia memperhatikannya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “dan Dia tidak memperhatikannya.” Klausa Ibrani terakhir dapat dibaca sebagai pernyataan negatif biasa, tetapi konteks lebih mendukung pertanyaan retoris: “tidakkah Dia memperhatikannya?”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang mendasari pernyataan Zofar dan mengalir alami dalam argumentasi bahasa Indonesia.
- source_word: הוּא
  choice: Dia
  rationale: Dalam konteks, pronomina ini merujuk kepada Allah. Huruf kapital mengikuti kebiasaan bahasa Indonesia untuk pronomina yang mengacu kepada Allah.
- source_word: יָדַע
  choice: mengenal
  rationale: Bentuk perfek menyatakan pengetahuan Allah yang tetap atau menyeluruh. 'Mengenal' cocok untuk pengetahuan tentang orang, bukan sekadar mengetahui suatu fakta.
- source_word: מְתֵי שָׁוְא
  choice: orang-orang yang penuh kepalsuan
  rationale: Ungkapan ini mempertahankan unsur manusia dan makna moral שָׁוְא sebagai kepalsuan, tanpa memakai 'orang tak berguna' yang dapat terdengar sebagai penilaian terhadap nilai diri mereka.
- source_word: וַיַּרְא
  choice: ketika Dia melihat
  rationale: Rangkaian dengan klausa berikutnya dapat disampaikan secara alami sebagai klausa waktu, selaras dengan alur bahwa Allah melihat lalu tentu memperhatikan.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Dalam konteks moral ini, kata tersebut menunjuk pada kejahatan atau kedurhakaan; 'kejahatan' adalah padanan modern yang luas dan jelas.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: tidakkah Dia memperhatikannya?
  rationale: Dibaca sebagai pertanyaan retoris sesuai logika konteks. 'Memperhatikan' menyampaikan arti mengamati atau mencermati, sedangkan '-nya' secara alami merujuk kembali kepada kejahatan.
theological_decisions:
- issue: Daya klausa terakhir וְלֹא יִתְבּוֹנָן
  choice: 'Pertanyaan retoris: ''tidakkah Dia memperhatikannya?'''
  alternative: 'Pernyataan negatif biasa: ''dan Dia tidak memperhatikannya/mempertimbangkannya.'''
  rationale: Secara gramatikal, negasi biasa mungkin, tetapi konteks perkataan Zofar menegaskan pengetahuan Allah atas kejahatan manusia. Pertanyaan retoris paling sesuai dengan alur tersebut, sementara kemungkinan lain tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur paralel Ibrani dipertahankan sejauh tetap alami; ambiguitas pada klausa terakhir tidak dihapus, melainkan dicatat.
