source:
  edition: WLC
  text: אִם אַ֭תָּ֗ה הֲכִינ֣וֹתָ לִבֶּ֑/ךָ וּ/פָרַשְׂתָּ֖ אֵלָ֣י/ו כַּפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: id
  text: Jika engkau mempersiapkan hatimu dan menadahkan tanganmu kepada-Nya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membentangkan telapak tanganmu kepada-Nya.” Ungkapan ini menggambarkan sikap tangan yang ditadahkan atau diulurkan dalam doa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Menandai klausa bersyarat dan mempertahankan sifat ajakan bersyarat dalam perkataan Zofar.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua tunggal yang ditujukan langsung kepada Ayub; dipertahankan untuk penegasan.
- source_word: הֲכִינוֹתָ
  choice: mempersiapkan
  rationale: Bentuk Hifil dari כון menyatakan tindakan membuat siap, teguh, atau terarah; 'mempersiapkan' alami dalam ungkapan dengan 'hati' tanpa mempersempit maknanya.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: לֵב menunjuk pada batin manusia, termasuk pikiran dan kehendak; 'hati' mempertahankan gambaran antropologis Ibrani.
- source_word: וּפָרַשְׂתָּ
  choice: dan menadahkan
  rationale: פרשׂ berarti membentangkan atau mengulurkan. Dalam konteks doa, 'menadahkan tangan' merupakan ungkapan Indonesia yang alami bagi sikap memohon kepada Allah.
- source_word: אֵלָיו
  choice: kepada-Nya
  rationale: Preposisi dan pronomina menunjukkan arah kepada satu rujukan maskulin, yaitu Allah dalam konteks, tanpa mengganti pronomina Ibrani dengan nomina eksplisit.
- source_word: כַּפֶּךָ
  choice: tanganmu
  rationale: כַּף berbentuk tunggal dan secara harfiah berarti telapak tangan atau tangan. Bentuk tunggal dipertahankan karena alami dalam bahasa Indonesia dan menjaga bentuk teks sumber.
theological_decisions:
- issue: Rujukan pronomina dalam אֵלָיו
  choice: Dipahami sebagai Allah dan diterjemahkan 'kepada-Nya'.
  alternative: Menerjemahkan secara eksplisit 'kepada Allah'.
  rationale: Konteks menunjukkan bahwa Allah adalah rujukannya, tetapi penggunaan pronomina dipertahankan agar tidak menambahkan nomina yang tidak terdapat dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Engkau' sesuai untuk sapaan tunggal dalam wacana Alkitab; 'menadahkan tangan' menyampaikan gestur doa secara idiomatis. Penanda catatan kaki [a] dicantumkan dalam teks utama.
