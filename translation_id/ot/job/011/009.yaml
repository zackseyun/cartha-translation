source:
  edition: WLC
  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: id
  text: Ukurannya lebih panjang daripada bumi dan lebih luas daripada laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bentangannya lebih panjang daripada bumi dan lebih lebar daripada laut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: lebih panjang
  rationale: Bentuk feminin tunggal ini sejajar dengan מִדָּהּ dan, bersama מִן yang menyatakan perbandingan, paling alami diterjemahkan dengan bentuk komparatif.
- source_word: מֵאֶרֶץ
  choice: daripada bumi
  rationale: Awalan מִן di sini menyatakan perbandingan, bukan pemisahan. Dalam kesejajaran kosmis dengan laut, אֶרֶץ paling tepat diterjemahkan sebagai “bumi”.
- source_word: מִדָּהּ
  choice: ukurannya
  rationale: מִדָּה berarti ukuran atau bentangan. “Ukurannya” mempertahankan gambaran konkret dan akhiran orang ketiga feminin yang merujuk pada pokok bahasan ayat sebelumnya.
- source_word: וּרְחָבָה
  choice: dan lebih luas
  rationale: Adjektiva feminin tunggal ini sejajar dengan אֲרֻכָּה; bentuk komparatif menyampaikan fungsi מִן pada klausa kedua dengan jelas dan alami.
- source_word: מִנִּי יָם
  choice: daripada laut
  rationale: מִנִּי adalah bentuk puitis dari מִן dan menyatakan perbandingan. יָם secara langsung berarti “laut”, yang mempertahankan citra dan paralelisme teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan puitis. “Lebih luas” dipilih untuk keluasan, sedangkan catatan kaki mempertahankan alternatif yang lebih harfiah, “lebih lebar”.
