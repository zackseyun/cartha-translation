  edition: WLC
  text: וְ/יַגֶּד לְ/ךָ֨ תַּֽעֲלֻמ֣וֹת חָכְמָה֮ כִּֽי כִפְלַ֪יִם לְֽ/ת֫וּשִׁיָּ֥ה וְ/דַ֡ע כִּֽי יַשֶּׁ֥ה לְ/ךָ֥ אֱ֝ל֗וֹהַ מֵ/עֲוֺנֶֽ/ךָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: id
  text: dan memberitahukan kepadamu hal-hal tersembunyi dari hikmat[a], sebab hikmat yang sejati memiliki dua sisi.[b] Ketahuilah bahwa Allah tidak memperhitungkan sebagian kesalahanmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rahasia-rahasia hikmat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab itu berlipat dua bagi hikmat yang sejati”; ungkapan ini menunjukkan bahwa hikmat lebih kompleks atau memiliki lebih banyak segi daripada yang tampak.
    reason: lexical_alternative
  - marker: c
    text: Kata kerja Ibrani di sini sulit. Mungkin juga, “Allah telah melupakan sebagian kesalahanmu,” atau, “Allah menuntut darimu lebih sedikit daripada yang patut diterima karena kesalahanmu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד לְךָ
  choice: dan memberitahukan kepadamu
  rationale: Bentuk Hifil dari נגד berarti ‘memberitahukan, menyatakan’. Dalam konteks harapan pada ayat sebelumnya, bentuk ini melanjutkan apa yang diharapkan akan Allah lakukan.
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: hal-hal tersembunyi dari hikmat
  rationale: Mempertahankan gagasan konkret tentang berbagai perkara yang tersembunyi serta hubungan genitifnya dengan hikmat.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: hikmat yang sejati memiliki dua sisi
  rationale: כִפְלַיִם menyatakan kelipatan atau kedualipatan, sedangkan תּוּשִׁיָּה adalah istilah hikmat yang dapat menunjuk pada hikmat yang mantap dan efektif. Ungkapan ini menyampaikan bahwa hikmat lebih kompleks daripada yang tampak tanpa memakai frasa Indonesia yang kaku.
- source_word: וְדַע
  choice: Ketahuilah
  rationale: Menerjemahkan bentuk imperatif secara langsung dan wajar.
- source_word: יַשֶּׁה לְךָ אֱלוֹהַ מֵעֲוֺנֶךָ
  choice: Allah tidak memperhitungkan sebagian kesalahanmu
  rationale: Kata kerja yang sulit ini berkaitan dengan makna ‘lupa’ dan, dalam konteks tuduhan Zofar, kemungkinan menyiratkan bahwa Allah tidak menuntut pertanggungjawaban penuh atas kesalahan Ayub. Terjemahan utama mengungkapkan implikasi kontekstual itu, sedangkan kemungkinan harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Pernyataan Zofar tentang perlakuan Allah terhadap Ayub
  choice: Allah tidak memperhitungkan sebagian kesalahan Ayub
  alternative: Allah telah melupakan sebagian kesalahan Ayub; atau Allah menuntut dari Ayub lebih sedikit daripada yang patut diterimanya karena kesalahannya
  rationale: Konteks mendukung tuduhan Zofar bahwa hukuman Ayub lebih ringan daripada yang menurutnya layak diterima Ayub. Terjemahan menyajikan perkataan Zofar tanpa mengesahkannya sebagai penilaian ilahi atas Ayub.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kesinambungan dengan harapan Zofar pada ayat sebelumnya. Istilah ‘hikmat yang sejati’ dipakai untuk תּוּשִׁיָּה, dan ketidakpastian kata kerja יַשֶּׁה dipertahankan melalui catatan kaki.
