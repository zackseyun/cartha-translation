id: JOB.11.15
reference: Job 11:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי אָ֤ז תִּשָּׂ֣א פָנֶ֣י/ךָ מִ/מּ֑וּם וְ/הָיִ֥יתָ מֻ֝צָ֗ק וְ/לֹ֣א תִירָֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/015.yaml
  text: For then you will lift up your face without blemish[b][a]; you will stand firm and will not fear.
translation:
  language: id
  text: Sebab pada waktu itu engkau akan mengangkat wajahmu tanpa cela[a]; engkau akan teguh[b] dan tidak akan takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “engkau akan menegakkan kepalamu tanpa rasa malu.” Bahasa Ibrani secara harfiah berbunyi “mengangkat wajahmu tanpa cela,” suatu gambaran tentang keyakinan yang dipulihkan dan kebebasan dari kehinaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kokoh,” “aman,” atau “berdiri mantap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: Sebab pada waktu itu
  rationale: כִּי memperkenalkan akibat dari syarat yang disebut sebelumnya, sedangkan אָז menandai keadaan yang akan menyusul. Ungkapan ini mempertahankan hubungan penjelas dan temporal secara wajar dalam bahasa Indonesia.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: engkau akan mengangkat wajahmu
  rationale: Terjemahan ini mempertahankan gambaran harfiah idiom Ibrani tentang wajah yang terangkat, yang menyiratkan pulihnya keyakinan dan kebebasan dari kehinaan.
- source_word: מִמּוּם
  choice: tanpa cela
  rationale: מוּם pada dasarnya berarti cacat atau cela. Dalam konteks ini maknanya bersifat kiasan, tetapi terjemahan utama tetap mempertahankan citra leksikalnya tanpa membatasinya hanya pada rasa malu.
- source_word: מֻצָק
  choice: teguh
  rationale: Bentuk pasif dari akar יצק menggambarkan keadaan yang kukuh, mantap, atau aman. 'Teguh' alami, ringkas, dan tetap mempertahankan citra kestabilan.
- source_word: וְלֹא תִירָא
  choice: dan tidak akan takut
  rationale: Menerjemahkan secara langsung bentuk negatif futuratif dari ירא dengan susunan bahasa Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Kata ganti “engkau” dipertahankan karena konteksnya adalah sapaan langsung tunggal dalam puisi hikmat. Paralelisme antarklausa dan citra Ibrani tentang wajah yang terangkat dipertahankan.
