  text: וְ/עֵינֵ֥י רְשָׁעִ֗ים תִּ֫כְלֶ֥ינָה וּ֭/מָנוֹס אָבַ֣ד מִנְ/הֶ֑ם וְ֝/תִקְוָתָ֗/ם מַֽפַּח נָֽפֶשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: id
  text: 'Namun, mata orang-orang fasik akan menjadi kabur,

    dan tempat pelarian akan lenyap dari mereka;

    harapan mereka hanyalah embusan napas terakhir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “pengembusan nyawa.” Ungkapan Ibrani ini sulit dan tampaknya menggambarkan napas saat nyawa berakhir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים תִּכְלֶינָה
  choice: mata orang-orang fasik akan menjadi kabur
  rationale: 'Mempertahankan gambaran konkret ''mata'' dan menyampaikan idiom כלה dengan mata sebagai subjek: mata melemah atau menjadi kabur karena penantian yang sia-sia.'
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: tempat pelarian akan lenyap dari mereka
  rationale: מָנוֹס dapat menunjuk pada tempat atau sarana untuk melarikan diri. 'Tempat pelarian' mempertahankan nuansa perlindungan sekaligus jalan lolos; bentuk lampau אָבַד dipahami secara prospektif dalam rangkaian puisi ini.
- source_word: תִקְוָתָם
  choice: harapan mereka
  rationale: '''Harapan'' merupakan padanan alami bagi תִּקְוָה dan tetap memuat ironi bahwa satu-satunya hal yang dapat mereka nantikan adalah kematian.'
- source_word: מַפַּח נָפֶשׁ
  choice: embusan napas terakhir
  rationale: Ungkapan Ibrani yang sulit ini berkaitan dengan pengembusan napas/nyawa. Pilihan ini mempertahankan citra kematian tanpa menggantinya dengan abstraksi seperti 'keputusasaan'.
theological_decisions:
- issue: Apakah baris terakhir menyatakan keputusasaan atau kematian
  choice: Mempertahankan gambaran napas terakhir
  alternative: keputusasaan mereka
  rationale: Teks Ibrani memakai bahasa konkret tentang pengembusan נֶפֶשׁ ('napas/nyawa'), sehingga gambaran kematian lebih dekat dengan bentuk sumber dan tidak memasukkan penafsiran psikologis secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Orang-orang fasik' dipilih sebagai istilah bermartabat dan lazim dalam konteks Alkitab; susunan tiga baris menjaga paralelisme puisi Ibrani.
