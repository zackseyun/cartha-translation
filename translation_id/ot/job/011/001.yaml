  yaml_path: translation/ot/job/011/001.yaml
  text: 'Then Zophar the Naamathite answered and said:'
translation:
  language: id
  text: 'Lalu Zofar, orang Naama, menjawab dan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam formula naratif yang memperkenalkan giliran bicara, verba ענה berarti ‘menjawab’ atau ‘menanggapi’. ‘Menjawab’ alami dalam bahasa Indonesia dan mempertahankan hubungan dialogisnya.
- source_word: צֹפַר
  choice: Zofar
  rationale: Nama pribadi ditransliterasikan ke bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַנַּעֲמָתִי
  choice: orang Naama
  rationale: Adjektiva gentilik ini menunjukkan asal atau keterkaitan Zofar dengan Naama. Ungkapan ‘orang Naama’ menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia tanpa memastikan lebih jauh sifat keterkaitannya.
- source_word: וַיֹּאמַר
  choice: menjawab,
  rationale: Secara harfiah unsur ini berarti ‘dan berkata’. Namun, dalam formula pembuka ujaran Ibrani וַיַּעַן ... וַיֹּאמַר, bahasa Indonesia alami cukup memakai ‘menjawab’, sedangkan isi perkataannya langsung menyusul pada ayat berikutnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami sebagai pengantar ucapan; koma menandai bahwa perkataan Zofar berlanjut pada ayat berikutnya.
