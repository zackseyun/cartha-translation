  text: וְ/אִם לֹ֣א אֵ֭פוֹ מִ֣י יַכְזִיבֵ֑/נִי וְ/יָשֵׂ֥ם לְ֝/אַ֗ל מִלָּתִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: id
  text: Jika tidak demikian, siapakah yang dapat membuktikan bahwa aku berdusta dan membuat perkataanku menjadi tidak berarti?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Jika tidak demikian
  rationale: Mengungkapkan syarat yang merujuk pada pernyataan Ayub sebelumnya secara alami dalam bahasa Indonesia; וְ tidak perlu diterjemahkan secara mekanis pada awal kalimat.
- source_word: אֵפוֹ
  choice: -kah (pada siapakah)
  rationale: Daya penegas dan argumentatif partikel ini tercermin secara idiomatis melalui bentuk pertanyaan retoris dengan -kah, tanpa menambahkan kata yang terasa kaku.
- source_word: מִי
  choice: siapakah
  rationale: Padanan langsung untuk kata tanya orang dan sesuai dengan nada tantangan retoris.
- source_word: יַכְזִיבֵנִי
  choice: dapat membuktikan bahwa aku berdusta
  rationale: Bentuk Hifil כזב berarti menunjukkan atau membuktikan seseorang sebagai pendusta; 'dapat' menyampaikan daya pertanyaan retoris secara wajar.
- source_word: וְיָשֵׂם לְאַל
  choice: dan membuat ... menjadi tidak berarti
  rationale: Ungkapan harfiahnya adalah menaruh atau menjadikan sesuatu sebagai ketiadaan; padanan ini menyampaikan gagasan meniadakan bobot atau keabsahan perkataan.
- source_word: מִלָּתִי
  choice: perkataanku
  rationale: Mewakili nomina tunggal kolektif 'ucapan/perkataan' dan terdengar alami serta bermartabat dalam konteks pembelaan Ayub.
