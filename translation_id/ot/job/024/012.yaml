base_translation:
  language: en
  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: id
  text: Dari kota, orang-orang yang sekarat mengerang[a], dan jiwa orang-orang yang terbunuh berseru meminta pertolongan; namun Allah tidak menganggapnya sebagai kebebalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di kota orang-orang mengerang.” Kata Ibrani מְתִים sulit ditafsirkan di sini; sebagian memahaminya sebagai “orang-orang”, bukan “orang-orang yang sekarat”.
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan Ibrani ini sulit. Kemungkinan lain: “namun Allah tidak menganggapnya sebagai suatu kesalahan” atau “namun Allah tidak memperhatikan seruan itu”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: Dari kota
  rationale: Preposisi מִן paling wajar menunjukkan asal terdengarnya erangan. Pilihan ini mempertahankan gambaran Ibrani tanpa menentukan apakah yang ditekankan adalah asal atau lokasi.
- source_word: מְתִים
  choice: orang-orang yang sekarat
  rationale: Bentuk ini sulit dan juga dapat dipahami sebagai 'orang-orang'. Namun, kesejajarannya dengan mereka yang terbunuh mendukung pengertian yang berkaitan dengan kematian dan penderitaan.
- source_word: יִנְאָקוּ
  choice: mengerang
  rationale: Kata kerja ini menggambarkan suara penderitaan yang mendalam; 'mengerang' alami dan kuat dalam bahasa Indonesia.
- source_word: וְנֶפֶשׁ חֲלָלִים
  choice: dan jiwa mereka yang terbunuh
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, atau diri. 'Jiwa' mempertahankan bentuk ungkapan Ibrani, sedangkan 'mereka yang terbunuh' menyampaikan חֲלָלִים sebagai korban kekerasan yang tewas.
- source_word: תְּשַׁוֵּעַ
  choice: berseru meminta pertolongan
  rationale: Bentuk intensif ini menyatakan seruan mendesak untuk memperoleh bantuan; tujuan seruan dibuat jelas secara idiomatis.
- source_word: וֶאֱלוֹהַּ
  choice: namun Allah
  rationale: Kata sambung memiliki daya pertentangan antara jeritan para korban dan tidak adanya tanggapan ilahi yang tampak.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: tidak menganggapnya sebagai kebebalan
  rationale: Ungkapan ini sulit. תִּפְלָה dapat menunjuk pada kebebalan, ketidakpatutan, atau kesalahan. Terjemahan ini dekat dengan susunan Ibrani dan tidak memastikan apakah yang dinilai adalah keadaan tersebut atau seruan para korban.
theological_decisions:
- issue: Allah tampak tidak menanggapi ketidakadilan
  choice: namun Allah tidak menganggapnya sebagai kebebalan
  alternative: namun Allah tidak menetapkan kesalahan; atau, namun Allah tidak memperhatikan seruan itu
  rationale: Ayat ini menyuarakan keluhan Ayub mengenai ketidakadilan dan ketidaktanggapan Allah yang tampak. Terjemahan mempertahankan ketegangan tersebut tanpa mengubahnya menjadi penyangkalan doktrinal terhadap keadilan Allah atau menambahkan penyelesaian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Berseru meminta pertolongan' dipilih agar alami bagi pembaca umum, sedangkan 'jiwa' dan 'kebebalan' mempertahankan bobot serta ambiguitas ungkapan Ibrani.
