base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: id
  text: Mereka ditinggikan hanya sebentar, lalu lenyap. Mereka direndahkan; seperti semua orang, mereka dikumpulkan[a]. Mereka dipotong seperti ujung malai gandum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “diambil.” Kata Ibrani di sini jarang dipakai dan maknanya diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti kepala atau puncak malai gandum.”
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ מְּעַט
  choice: ditinggikan hanya sebentar
  rationale: 'Bentuk dari רום menyatakan keadaan terangkat atau berkedudukan tinggi, sedangkan מְעַט dalam konteks ini paling alami dipahami secara temporal: keadaan itu berlangsung singkat.'
- source_word: וְאֵינֶנּוּ
  choice: lalu lenyap
  rationale: Ungkapan idiomatis ini menyatakan bahwa seseorang tidak ada lagi atau menghilang. Bentuk tunggalnya dipahami secara distributif dalam rangkaian verba jamak.
- source_word: וְהֻמְּכוּ
  choice: mereka direndahkan
  rationale: Bentuk pasif ini menggambarkan mereka dibawa turun dari kedudukan tinggi, sehingga mempertahankan kontras dengan 'ditinggikan'.
- source_word: כַּכֹּל
  choice: seperti semua orang
  rationale: Frasa ini menunjuk pada nasib umum manusia; 'semua orang' merupakan ungkapan Indonesia yang alami tanpa menambahkan kelompok tertentu.
- source_word: יִקָּפְצוּן
  choice: dikumpulkan
  rationale: Verba Nifal yang langka ini memiliki nuansa yang diperdebatkan; 'dikumpulkan' mempertahankan kemungkinan gambaran pengumpulan tanpa menentukan mekanismenya.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: seperti pucuk bulir gandum
  rationale: Secara harfiah frasa ini berarti 'seperti kepala/pucuk bulir'; pilihan ini mempertahankan gambaran panen dengan bahasa Indonesia yang ringkas dan mudah dipahami.
- source_word: יִמָּלוּ
  choice: dipotong
  rationale: Dalam gambaran panen, verba ini kemungkinan menunjuk pada pemotongan bulir. 'Dipotong' mempertahankan metafora sekaligus menyatakan akhir yang mendadak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme antara ditinggikan dan direndahkan dipertahankan, demikian pula gambaran panen pada klausa terakhir. Ambiguitas verba יִקָּפְצוּן tidak diselesaikan secara berlebihan dan dicatat dalam catatan kaki.
