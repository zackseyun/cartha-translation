  text: חֲמ֣וֹר יְתוֹמִ֣ים יִנְהָ֑גוּ יַ֝חְבְּל֗וּ שׁ֣וֹר אַלְמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/003.yaml
  text: They drive away the orphan's donkey[b][a]; they take the widow's ox as a pledge.
translation:
  language: id
  text: Mereka menggiring pergi keledai milik anak-anak yatim[a]; mereka mengambil lembu milik seorang janda sebagai jaminan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keledai anak-anak yatim.” Ungkapan Ibrani dapat dipahami sebagai satu keledai milik mereka bersama-sama atau secara distributif sebagai keledai-keledai milik masing-masing anak yatim.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyita lembu milik seorang janda sebagai agunan.” Kata kerjanya secara khusus merujuk pada pengambilan harta sebagai jaminan utang.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  choice: keledai
  rationale: Padanan baku dan alami untuk hewan pengangkut domestik yang dimaksud.
- source_word: יְתוֹמִים
  choice: anak-anak yatim
  rationale: Bentuk Ibrani adalah jamak. Padanan ini mempertahankan jumlah tersebut dan menunjuk pada kelompok rentan tanpa mempersempitnya secara tidak perlu.
- source_word: יִנְהָגוּ
  choice: menggiring pergi
  rationale: Kata kerja נהג berarti menggiring atau menuntun; unsur 'pergi' menyampaikan pengambilan hewan itu dari pemiliknya dalam konteks penindasan.
- source_word: יַחְבְּלוּ
  choice: mengambil ... sebagai jaminan
  rationale: Dalam konteks hukum-ekonomi, חבל merujuk pada pengambilan barang sebagai jaminan utang, bukan sekadar mengambil atau mencuri.
- source_word: שׁוֹר
  choice: lembu
  rationale: Padanan agraris yang wajar untuk seekor bovina, khususnya hewan kerja, sambil tidak menentukan jenis kelaminnya lebih jauh daripada yang perlu dalam bahasa sasaran.
- source_word: אַלְמָנָה
  choice: milik seorang janda
  rationale: Hubungan konstruksi Ibrani dinyatakan secara alami sebagai kepemilikan dalam bahasa Indonesia; bentuk tanpa artikel diterjemahkan dengan 'seorang janda'.
