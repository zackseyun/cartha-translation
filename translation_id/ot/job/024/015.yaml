  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: id
  text: Mata seorang pezina menantikan senja[a], sambil berkata, “Tidak ada mata yang akan melihat aku”; lalu ia menutupi wajahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “petang.” Kata Ibrani ini dapat menunjuk pada waktu remang-remang menjelang malam; dalam konteks ini, waktunya cocok bagi perbuatan yang dilakukan secara sembunyi-sembunyi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan ia menaruh penyembunyian wajah.” Ungkapan Ibrani yang padat ini berarti bahwa ia menutupi atau menyamarkan wajahnya agar tidak dikenali.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: mata
  rationale: Mempertahankan gambaran konkret Ibrani pada kedua kemunculannya dan terdengar alami dalam konteks mengawasi serta terlihat.
- source_word: נֹאֵף
  choice: orang yang berzina
  rationale: Partisip maskulin tunggal menunjuk kepada laki-laki yang melakukan perzinaan; ungkapan ini jelas dan alami tanpa memberi label yang terasa kaku.
- source_word: שָׁמְרָה
  choice: menantikan
  rationale: Walaupun makna dasarnya adalah menjaga atau mengawasi, dalam konteks ini verba tersebut menyatakan penantian akan datangnya cahaya redup.
- source_word: נֶשֶׁף
  choice: senja
  rationale: Nomina ini dapat menunjuk pada waktu remang-remang; dalam konteks perbuatan rahasia, senja paling wajar, sambil tetap diberi alternatif dalam catatan kaki.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Menerjemahkan pengantar perkataan atau pikiran secara ringkas tanpa menentukan apakah ucapan itu disuarakan atau hanya di dalam hati.
- source_word: תְשׁוּרֵנִי
  choice: akan melihat aku
  rationale: Menyampaikan arti שׁוּר, yakni memandang atau melihat, dan mempertahankan kaitannya dengan kata 'mata'.
- source_word: וְסֵתֶר פָּנִים יָשִׂים
  choice: lalu ia menutupi wajahnya
  rationale: Ungkapan Ibrani yang padat secara harfiah berbicara tentang menaruh penyembunyian wajah; terjemahan ini menyampaikan tindakan menyamarkan wajah secara alami.
