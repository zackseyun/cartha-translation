base_translation:
  language: en
  yaml_path: translation/ot/job/024/005.yaml
  text: Look[a], like wild donkeys in the wilderness they go out to their work, seeking prey early; the desert is bread for him[b], for the children.
translation:
  language: id
  text: Lihatlah, seperti keledai liar di padang belantara, mereka keluar untuk bekerja, mencari makanan sejak pagi.[a] Padang tandus menjadi roti baginya, bagi anak-anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “bangun pagi-pagi untuk mencari mangsa” atau “mencari bekal hidup sejak dini.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “padang tandus menjadi roti baginya, bagi anak-anak.” Teks Ibrani memakai bentuk tunggal “baginya”; bentuk itu mungkin bersifat distributif. Kata terakhir dapat berarti “anak-anak”, “orang-orang muda”, atau “anak-anak lelaki”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Kata seru ini mengarahkan perhatian kepada gambaran yang segera disajikan; “Lihatlah” alami sekaligus mempertahankan daya penunjuknya.
- source_word: פְּרָאִים
  choice: keledai-keledai liar
  rationale: Merujuk kepada keledai yang hidup liar; bentuk ulang menyatakan jamak secara jelas dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Menggambarkan kawasan liar yang tidak dibudidayakan dan tidak harus berupa gurun pasir.
- source_word: יָצְאוּ בְּפָעֳלָם
  choice: mereka keluar untuk bekerja
  rationale: Menyampaikan gerak keluar dan kegiatan mencari nafkah dalam ungkapan Indonesia yang wajar.
- source_word: מְשַׁחֲרֵי לַטָּרֶף
  choice: mencari makanan sejak pagi
  rationale: Partisipelnya dapat menyiratkan pencarian sejak dini, sedangkan טֶרֶף dalam konteks kemiskinan manusia menunjuk pada makanan atau bekal hidup, meski secara harfiah dapat berarti “mangsa”.
- source_word: עֲרָבָה
  choice: padang tandus
  rationale: Menunjuk pada dataran gersang atau stepa; “padang tandus” membedakannya dari מִדְבָּר sambil mempertahankan gambaran lahan kering.
- source_word: לֶחֶם
  choice: sumber makanan
  rationale: Secara harfiah berarti “roti”, tetapi di sini berfungsi sebagai gambaran makanan pokok yang diperoleh dari padang tandus.
- source_word: לוֹ ... לַנְּעָרִים
  choice: bagi mereka dan bagi anak-anak mereka
  rationale: Bentuk tunggal “baginya” dipahami secara distributif terhadap kelompok jamak; נְעָרִים dalam konteks ini paling wajar menunjuk kepada anak-anak atau tanggungan muda.
