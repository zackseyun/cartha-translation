  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: id
  text: Mengapa waktu-waktu tidak disimpan oleh Yang Mahakuasa,[a] dan mengapa orang-orang yang mengenal-Nya tidak melihat hari-hari-Nya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “waktu-waktu yang ditetapkan.” Baris ini dapat dipahami, “Mengapa waktu-waktu yang ditetapkan tidak disediakan dalam cadangan oleh Yang Mahakuasa?”
    reason: lexical_alternative
  - marker: b
    text: “Hari-hari-Nya” mungkin menunjuk pada saat-saat ketika Allah bertindak, khususnya dalam penghakiman atau campur tangan.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini membuka keluhan Ayub secara langsung; “Mengapa” alami dan mempertahankan daya pertanyaannya.
- source_word: מִשַּׁדַּי
  choice: oleh Yang Mahakuasa
  rationale: Dengan bentuk pasif נִצְפְּנוּ, prefiks מ־ dapat dipahami berkaitan dengan pelaku atau sumber. “Yang Mahakuasa” merupakan padanan baku dan sesuai konteks bagi שַׁדַּי dalam kitab Ayub.
- source_word: נִצְפְּנוּ
  choice: disimpan
  rationale: Kata צפן dapat berarti menyembunyikan, menyimpan, atau menyediakan dalam cadangan. “Disimpan” mempertahankan bentuk pasif dan tidak menambahkan gagasan “tersembunyi” secara berlebihan.
- source_word: עִתִּים
  choice: masa-masa
  rationale: Bentuk jamak ini menunjuk pada waktu-waktu atau masa-masa tertentu, mungkin waktu yang ditetapkan. “Masa-masa” mempertahankan keluasan makna ungkapan Ibrani.
- source_word: וְיֹדְעָיו
  choice: orang-orang yang mengenal-Nya
  rationale: Partisip Qal dengan sufiks orang ketiga tunggal menunjuk kepada mereka yang mengenal Allah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa relasionalnya.
- source_word: חָזוּ
  choice: melihat
  rationale: חזה berarti melihat atau menyaksikan, kadang dengan nuansa penglihatan khusus. “Melihat” paling wajar di sini dan tidak mempersempit maknanya.
- source_word: יָמָיו
  choice: hari-hari-Nya
  rationale: Terjemahan harfiah bentuk jamak bersufiks ini mempertahankan ungkapan puitis yang padat dan ambigu, tanpa langsung menafsirkannya sebagai hari penghakiman.
theological_decisions:
- issue: Makna “hari-hari-Nya” dalam kaitannya dengan Allah
  choice: Mempertahankan ungkapan harfiah “hari-hari-Nya”
  alternative: hari-hari ketika Allah bertindak atau menghakimi
  rationale: Bahasa Ibrani tidak menjelaskan tindakan tertentu. Mempertahankan ungkapan tersebut menjaga ketegangan teologis dan kepadatan puisinya.
- issue: Hubungan “masa-masa” dengan Yang Mahakuasa
  choice: “disimpan oleh Yang Mahakuasa” dalam teks utama
  alternative: “tersembunyi dari Yang Mahakuasa” atau “ditetapkan oleh Yang Mahakuasa”
  rationale: Prefiks מ־ dan rentang makna צפן memungkinkan lebih dari satu pemahaman. Teks utama mengikuti pengertian menyimpan atau menyediakan dalam cadangan, sedangkan catatan kaki menjaga alternatif yang sungguh-sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur pertanyaan yang tetap dekat pada bahasa Ibrani. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia; tanda hubung dipakai sesuai ejaan pada bentuk “mengenal-Nya” dan “hari-hari-Nya”.
