  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: id
  text: Kekeringan dan panas merenggut air dari salju[a]; demikian pula Syeol[b] merenggut orang-orang yang telah berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air salju”; dapat dipahami sebagai air lelehan salju.
    reason: lexical_alternative
  - marker: b
    text: “Syeol” adalah istilah Ibrani bagi alam orang mati; dapat juga diterjemahkan “kubur”.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: kekeringan
  rationale: Nomina ini menyatakan keadaan kering atau gersang. “Kekeringan” alami dalam bahasa Indonesia dan dapat dipersonifikasikan sebagai pelaku yang merenggut air.
- source_word: גַם
  choice: dan; hubungan tambahan tercakup dalam pasangan
  rationale: Partikel ini menambahkan חֹם kepada צִיָּה. Dalam bahasa Indonesia, hubungan tersebut paling wajar dinyatakan dengan “dan”, tanpa “juga” yang akan terasa kaku dalam susunan ini.
- source_word: חֹם
  choice: panas
  rationale: Padanan langsung yang mempertahankan kesejajaran dengan “kekeringan”.
- source_word: יִגְזְלוּ
  choice: merenggut
  rationale: Kata kerja גזל menggambarkan tindakan mengambil atau merampas dengan paksa. “Merenggut” mempertahankan personifikasi dan daya puitisnya.
- source_word: מֵימֵי שֶׁלֶג
  choice: air dari salju
  rationale: Ungkapan ini dekat dengan bentuk harfiah “air salju”, tetapi lebih mudah dipahami dalam bahasa Indonesia tanpa membatasi maknanya secara mutlak pada istilah teknis tertentu.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan istilah Ibrani bagi alam orang mati dan tidak menyempitkannya menjadi kubur fisik atau memasukkan gagasan teologis kemudian seperti neraka.
- source_word: חָטָאוּ
  choice: orang-orang yang telah berdosa
  rationale: Bentuk perfek jamak secara harfiah berarti “mereka telah berdosa”. Karena klausa kedua bersifat eliptis, frasa ini menyatakan pihak yang direnggut Syeol sambil mempertahankan sifat verbal bentuk Ibraninya.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: Syeol, yakni istilah Ibrani bagi alam orang mati
  alternative: kubur; alam orang mati; maut
  rationale: Transliterasi menjaga keluasan konsep sumber dan tidak menyamakannya secara prematur dengan kubur fisik ataupun hukuman akhir.
- issue: Klausa eliptis שְׁאוֹל חָטָאוּ
  choice: 'Kata kerja “merenggut” dipahami berlaku juga pada klausa kedua: “Syeol merenggut orang-orang yang telah berdosa.”'
  alternative: Mempertahankan secara harfiah bentuk terputus “Syeol—mereka telah berdosa”
  rationale: Bahasa Ibrani puitis menghilangkan kata kerja dalam klausa kedua dan mengandalkan kata kerja sebelumnya. Pengulangan dalam bahasa Indonesia memperjelas hubungan perbandingan tanpa mengubah gambaran dasarnya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Demikian pula” menyatakan perbandingan yang tersirat oleh penjajaran kedua klausa Ibrani. Pengulangan “merenggut” membuat elipsis sumber dapat dipahami oleh pembaca umum.
