  text: At dawn the murderer rises[a]; he kills the poor and needy[b], and in the night he is like a thief.
translation:
  language: id
  text: Saat fajar, seorang pembunuh bangkit[a]; ia menewaskan orang miskin dan orang yang berkekurangan[b], dan pada malam hari ia seperti pencuri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Saat hari mulai terang”; bahasa Ibrani secara harfiah merujuk kepada datangnya terang, kemungkinan besar waktu fajar.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia membunuh orang miskin dan orang yang berkekurangan”; bahasa Ibrani memakai verba yang berbeda dari kata “pembunuh”, sehingga teks utama memakai “menewaskan” untuk mempertahankan perbedaan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: Saat fajar
  rationale: Ungkapan ini secara harfiah menunjuk kepada datangnya terang. Dalam konteks waktu, “saat fajar” menyampaikan maknanya secara alami tanpa menghilangkan gambaran terang yang mulai muncul.
- source_word: יָקוּם
  choice: bangkit
  rationale: Bentuk verba קום di sini menggambarkan bangun atau mulai bertindak. “Bangkit” ringkas, puitis, dan wajar dalam bahasa Indonesia.
- source_word: רוֹצֵחַ
  choice: si pembunuh
  rationale: Partisip ini berfungsi sebagai nomina yang menunjuk kepada sosok pelaku. Artikel “si” membantu menyajikannya sebagai tipe orang yang sedang digambarkan dalam puisi.
- source_word: יִקְטָל
  choice: ia menewaskan
  rationale: Bahasa Ibrani memakai verba קטל, bukan mengulang akar רצח yang terdapat pada “pembunuh”. “Menewaskan” mempertahankan perbedaan leksikal itu sekaligus menyatakan tindakan membunuh dengan jelas.
- source_word: עָנִי וְאֶבְיוֹן
  choice: orang miskin dan melarat
  rationale: Pasangan istilah ini menunjuk kepada orang yang miskin, berkekurangan, dan rentan secara sosial. “Miskin dan melarat” mempertahankan penekanan dua istilah dengan bahasa yang mudah dipahami.
- source_word: וּבַלַּיְלָה
  choice: dan pada malam hari
  rationale: Frasa ini menandai latar waktu kedua dan mempertahankan pertentangan puitis antara fajar dan malam.
- source_word: יְהִי
  choice: ia seperti
  rationale: Dengan unsur pembanding כ, verba היה menyatakan keadaan atau peran. Susunan “ia seperti” mempertahankan perbandingan secara langsung tanpa mempersempitnya menjadi perilaku tertentu saja.
- source_word: כַגַּנָּב
  choice: seperti pencuri
  rationale: Prefiks כ menyatakan perbandingan sederhana. “Seperti pencuri” merupakan padanan yang langsung dan alami.
