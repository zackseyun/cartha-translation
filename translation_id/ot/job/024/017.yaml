  text: כִּ֤י יַחְדָּ֨ו בֹּ֣קֶר לָ֣/מוֹ צַלְמָ֑וֶת כִּֽי יַ֝כִּ֗יר בַּלְה֥וֹת צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: id
  text: Sebab bagi mereka semua, pagi adalah kegelapan pekat[a][b]; sebab mereka mengenal[c] kengerian kegelapan pekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sebab pagi bagi mereka semua seperti kegelapan pekat.” Susunan bahasa Ibraninya ringkas dan dapat dipahami dengan sedikit berbeda.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani צַלְמָוֶת (tsalmavet) juga dapat diterjemahkan “bayang-bayang maut”. Di sini kemungkinan besar artinya “kegelapan pekat” atau “kesuraman”, bukan kematian itu sendiri.
    reason: lexical_alternative
  - marker: c
    text: Dalam bahasa Ibrani, kata kerjanya berbentuk tunggal (“ia mengenal”), tetapi kemungkinan dipakai secara umum untuk menunjuk kepada orang-orang jahat sebagai satu golongan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan yang melanjutkan gambaran tentang para pelaku kejahatan dalam konteks sebelumnya.
- source_word: יַחְדָּו
  choice: semua
  rationale: Secara harfiah berarti “bersama-sama”, tetapi di sini menyatakan kelompok itu secara kolektif; “mereka semua” alami dalam bahasa Indonesia.
- source_word: בֹּקֶר
  choice: pagi
  rationale: Makna lazimnya adalah “pagi”; pilihan ini mempertahankan pertentangan tajam dengan kegelapan pekat.
- source_word: לָמוֹ
  choice: bagi mereka
  rationale: Frasa pronominal ini menyatakan hubungan dalam klausa tanpa verba; “bagi mereka” terdengar alami dalam bahasa Indonesia.
- source_word: צַלְמָוֶת
  choice: kegelapan pekat
  rationale: Dalam Kitab Ayub, istilah ini kerap menunjuk pada kegelapan atau kesuraman yang sangat dalam, bukan selalu pada kematian; diterjemahkan sama pada kedua kemunculannya.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan klausa penjelas kedua yang sejajar dengan klausa pertama.
- source_word: יַכִּיר
  choice: mereka mengenal
  rationale: Bentuk Ibraninya adalah orang ketiga tunggal, tetapi dalam konteks tampaknya berfungsi secara generik bagi golongan orang jahat; bentuk jamak membuat rujukannya jelas tanpa mengubah maksud kolektifnya.
- source_word: בַּלְהוֹת
  choice: kengerian
  rationale: Bentuk jamak Ibrani menunjuk pada berbagai teror atau hal yang menggentarkan; bahasa Indonesia dapat memakai nomina kolektif “kengerian” secara alami.
