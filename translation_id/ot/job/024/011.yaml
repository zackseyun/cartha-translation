  yaml_path: translation/ot/job/024/011.yaml
  text: Between their rows they press out oil[a]; they tread winepresses[b], yet they go thirsty.
translation:
  language: id
  text: Di antara deretan milik mereka[a], mereka menghasilkan minyak[b]; mereka menginjak anggur dalam tempat pemerasan anggur, tetapi mereka sendiri kehausan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara tembok-tembok milik mereka.” Kata Ibrani ini dapat menunjuk pada deretan atau tembok, mungkin di kawasan pertanian bertingkat atau berpagar.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini sulit dipastikan dan berkaitan dengan “minyak” atau “kilau”; dalam konteks ini kemungkinan besar berarti menghasilkan minyak, yakni dengan memeras buah zaitun.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: Di antara
  rationale: Menunjukkan lokasi para pekerja di tengah area pertanian; bentuk ini wajar dalam bahasa Indonesia.
- source_word: שׁוּרֹתָם
  choice: deretan tanaman milik mereka
  rationale: שׁוּרוֹת dapat berarti deretan atau tembok. Dalam konteks pengolahan minyak dan anggur, deretan tanaman paling mungkin dimaksudkan; unsur kepunyaan pada akhiran Ibrani tetap dipertahankan.
- source_word: יַצְהִירוּ
  choice: mereka memeras minyak
  rationale: Bentuk ini sulit secara leksikal dan berhubungan dengan minyak atau kilau. Dalam konteks pekerjaan pertanian, makna menghasilkan minyak—kemungkinan dengan memeras zaitun—paling sesuai.
- source_word: יְקָבִים
  choice: tempat pemerasan
  rationale: Istilah ini menunjuk pada tempat pemerasan anggur atau bak penampungnya. Frasa Indonesia ini cocok dengan tindakan menginjak-injak anggur yang disebut berikutnya.
- source_word: דָּרְכוּ
  choice: mereka menginjak-injak anggur
  rationale: Kata kerja ini lazim digunakan untuk tindakan menginjak buah anggur dalam tempat pemerasan. Objek 'anggur' dibuat tersurat agar gambaran tersebut jelas dalam bahasa Indonesia.
- source_word: וַיִּצְמָאוּ
  choice: tetapi mereka sendiri kehausan
  rationale: 'Kata penghubung diterjemahkan secara adversatif untuk menampilkan ironi: orang yang mengolah hasil kebun anggur justru tidak mendapat minuman. ''Sendiri'' menegaskan kontras tanpa mengubah pelakunya.'
