  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: id
  text: Mereka menyingkirkan orang-orang yang berkekurangan dari jalan[a]; bersama-sama orang-orang miskin di negeri itu[b] bersembunyi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuat orang-orang yang berkekurangan menyimpang dari jalan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang miskin di bumi.”'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, bentuk kata Ibraninya dapat diterjemahkan “disembunyikan” atau “berada dalam persembunyian.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יַטּוּ
  choice: menyingkirkan
  rationale: Bentuk Hifil dari נטה menyatakan tindakan menyebabkan seseorang berbelok atau tersisih. Dalam konteks penindasan, “menyingkirkan” menyampaikan makna kausatif secara alami tanpa menambahkan tingkat kekerasan yang tidak dinyatakan secara eksplisit.
- source_word: אֶבְיוֹנִים
  choice: orang-orang yang berkekurangan
  rationale: אֶבְיוֹן menunjuk kepada orang miskin atau berkekurangan yang rentan. Pilihan ini juga membedakannya secara halus dari עֲנִיֵּי pada klausa berikutnya.
- source_word: מִדָּרֶךְ
  choice: dari jalan
  rationale: דֶּרֶךְ dapat berarti jalan, jalur, atau cara. “Dari jalan” mempertahankan gambaran konkret dan hubungan preposisional מן tanpa menafsirkannya sebagai penyimpangan moral.
- source_word: יַחַד
  choice: bersama-sama
  rationale: Kata keterangan ini menunjukkan keadaan kolektif; “bersama-sama” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: חֻבְּאוּ
  choice: bersembunyi
  rationale: Bentuk Pual dari חבא secara formal bersifat pasif, tetapi dalam konteks ini dapat menggambarkan orang miskin yang berada dalam persembunyian atau menyembunyikan diri akibat tekanan. “Bersembunyi” alami dalam bahasa Indonesia, sementara nuansa pasif dicatat dalam catatan kaki.
- source_word: עֲנִיֵּי אָרֶץ
  choice: orang-orang miskin di negeri itu
  rationale: עָנִי dapat berarti miskin, tertindas, atau sengsara. Dalam gambaran sosial ayat ini, “orang-orang miskin di negeri itu” jelas dan alami; אָרֶץ juga dapat dipahami lebih luas sebagai bumi.
