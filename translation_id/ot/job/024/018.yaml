base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: id
  text: Ia melaju cepat di atas permukaan air[a]; bagian mereka di negeri itu terkutuk[b]; ia tidak berpaling ke jalan menuju kebun-kebun anggur.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia ringan di atas permukaan air.” Teks Ibrani sulit; bagian awal ini juga dapat dipahami sebagai gambaran tentang sesuatu yang lekas berlalu, bukan tentang kecepatan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani sulit; sebagian orang membaca “bagiannya di negeri itu terkutuk”, bukan “bagian mereka di negeri itu terkutuk”.
    reason: textual_variant
  - marker: c
    text: Atau, “ia tidak berpaling ke jalan kebun-kebun anggur”; ini mungkin berarti bahwa ia tidak lagi kembali ke tanah pertanian atau ke tempat-tempat yang makmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: cepat
  rationale: Kata sifat ini secara harfiah dapat berarti “ringan”, tetapi dalam gambaran tentang gerak di atas air kemungkinan menyatakan kecepatan atau sesuatu yang lekas berlalu. “Cepat” mempertahankan makna yang paling mungkin tanpa memperluas metaforanya.
- source_word: עַל־פְּנֵי מַיִם
  choice: di atas permukaan air
  rationale: Ungkapan ini menerjemahkan idiom Ibrani secara dekat dan wajar; פְּנֵי menunjuk pada permukaan, sedangkan bentuk מַיִם tidak perlu diterjemahkan sebagai jamak dalam bahasa Indonesia.
- source_word: תְּקֻלַּל
  choice: terkutuk
  rationale: Bentuk Pual dari קלל paling langsung dipahami sebagai pasif, “dikutuk/terkutuk”, dengan “bagian mereka” sebagai subjek.
- source_word: חֶלְקָתָם
  choice: bagian mereka
  rationale: Bentuk yang disajikan memiliki akhiran orang ketiga jamak. “Bagian” mempertahankan cakupan makna yang dapat merujuk pada jatah, milik, atau bidang tanah tanpa mempersempitnya menjadi “warisan”.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Dalam hubungan dengan “bagian”, אֶרֶץ paling wajar menunjuk pada negeri atau tanah tempat kepemilikan berada. “Negeri itu” lebih alami daripada “di bumi” dalam konteks ini.
- source_word: לֹא יִפְנֶה
  choice: ia tidak berpaling ke
  rationale: פנה berarti berbalik, berpaling, atau mengarahkan diri. “Berpaling ke” mempertahankan citra gerak tanpa memastikan bahwa yang dimaksud adalah kembali.
- source_word: דֶּרֶךְ כְּרָמִים
  choice: jalan kebun-kebun anggur
  rationale: Terjemahan dekat dari frasa konstruksi ini mempertahankan ambiguitas antara jalan yang berada di kawasan kebun anggur dan jalan yang menuju ke sana.
