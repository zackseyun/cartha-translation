base_translation:
  language: en
  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: id
  text: Namun, dengan kekuatannya ia menyeret orang-orang perkasa; ia bangkit[a], tetapi ia tidak yakin akan hidupnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia bangkit dan tidak memercayai kehidupan,” atau, “ia bangkit dan tidak seorang pun merasa aman akan hidupnya.” Subjek yang dimaksud oleh verba terakhir dalam bahasa Ibrani ambigu.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: ia menyeret
  rationale: Makna dasar משׁך ialah menarik atau menyeret. Dengan orang-orang perkasa sebagai objek dan kekuatannya sebagai sarana, ungkapan ini paling wajar menggambarkan tindakan paksa.
- source_word: אַבִּירִים
  choice: orang-orang perkasa
  rationale: Bentuk jamak ini menunjuk kepada mereka yang kuat atau berkuasa; 'orang-orang perkasa' mempertahankan keluasan makna tersebut tanpa membatasinya pada kekuatan fisik.
- source_word: בְּכֹחוֹ
  choice: dengan kekuatannya
  rationale: Preposisi ב bersifat instrumental, sedangkan כֹּחַ berarti kekuatan atau kuasa. Pilihan ini alami dalam bahasa Indonesia dan dekat dengan susunan Ibrani.
- source_word: יָקוּם
  choice: ia bangkit
  rationale: קום dalam bentuk qal lazim berarti bangkit atau berdiri. 'Bangkit' mempertahankan gambaran verbal tanpa menentukan apakah yang dimaksud ialah mulai bertindak, menegakkan diri, atau tetap bertahan.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: tetapi tidak yakin akan hidupnya
  rationale: Secara gramatikal, verba tunggal paling langsung melanjutkan subjek 'ia'. אמן dalam konstruksi ini menyatakan rasa aman atau keyakinan, sedangkan bentuk חַיִּין yang tidak lazim dipahami sebagai kehidupan. Terjemahan ini menjaga ketidakpastian mengenai kelangsungan hidup.
theological_decisions:
- issue: Subjek ambigu dalam klausa terakhir
  choice: 'Subjek tunggal diteruskan sebagai ''ia'': ''tetapi tidak yakin akan hidupnya.'''
  alternative: '''dan tidak seorang pun merasa hidupnya aman'''
  rationale: Bentuk verba Ibrani adalah tunggal dan paling langsung merujuk kembali kepada tokoh yang bangkit. Namun, konstruksi yang padat memungkinkan pembacaan impersonal yang menekankan ketidakamanan hidup orang lain; alternatif itu dicatat agar ambiguitas asli tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang-orang perkasa' mudah dipahami sekaligus mempertahankan nuansa kekuatan atau kuasa. Konjungsi 'tetapi' menyampaikan ketegangan antarklausa tanpa menambah penafsiran doktrinal.
