id: JOB.24.6
reference: Job 24:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ֭/שָּׂדֶה בְּלִיל֣/וֹ יקצירו וְ/כֶ֖רֶם רָשָׁ֣ע יְלַקֵּֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/006.yaml
  text: In the field they harvest fodder[c][b][a], and they glean in the vineyard of the wicked.
translation:
  language: id
  text: Di ladang mereka menuai pakan ternak[a], dan di kebun anggur milik orang fasik[b] mereka memungut hasil panen yang tertinggal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pakannya.” Kata Ibrani ini menunjuk pada pakan ternak atau campuran pakan, bukan biji-bijian biasa untuk makanan manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kebun anggur orang fasik.” Bahasa Ibrani tidak mengulangi kata depan “di” dan dapat dipahami dengan “kebun anggur” sebagai objek langsung.
    reason: lexical_alternative
  - marker: c
    text: Atau, “mengumpulkan hasil yang dipetik belakangan.” Kata Ibrani dapat menunjuk pada pengumpulan sisa panen atau hasil yang matang belakangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: Di ladang
  rationale: Frasa dengan preposisi ב bersifat lokatif. Bentuk ini alami dalam bahasa Indonesia dan tidak memberi penekanan berlebihan pada ketakrifan nomina Ibrani.
- source_word: בְּלִילוֹ
  choice: pakan ternak[a]
  rationale: בְּלִיל menunjuk pada pakan atau campuran pakan untuk hewan, bukan biji-bijian yang lazim dikonsumsi manusia. Sufiks orang ketiga tunggal tidak dinyatakan dalam teks utama karena acuannya tidak jelas, tetapi dicatat dalam catatan kaki.
- source_word: יקצירו
  choice: mereka menuai
  rationale: Bentuk dari קצר berarti menuai atau memanen; 'menuai' mempertahankan gambaran kegiatan pertanian dengan bahasa yang wajar.
- source_word: וְכֶרֶם רָשָׁע
  choice: dan di kebun anggur milik orang fasik[b]
  rationale: Bahasa Indonesia secara alami memasok 'di' untuk menyatakan lokasi kegiatan. רָשָׁע berbentuk tunggal dan dipahami secara substantival; 'orang fasik' mempertahankan ketunggalannya tanpa menentukan identitas pemilik.
- source_word: יְלַקֵּשׁוּ
  choice: mereka memungut hasil panen yang tertinggal[c]
  rationale: Piel dari לקשׁ menggambarkan pengumpulan hasil yang dipetik belakangan atau yang tersisa. Ungkapan ini lebih mudah dipahami pembaca umum daripada istilah teknis, sambil mempertahankan kaitannya dengan pemungutan sisa panen.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan klausa mempertahankan paralelisme pertanian dalam teks Ibrani, sedangkan penambahan 'di' pada klausa kedua dipilih demi kelancaran tanpa menyembunyikan bentuk sumber; alternatifnya dicatat. Istilah 'orang fasik' mempertahankan corak moral רָשָׁע tanpa menambahkan identitas atau ajaran denominasi.
