  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: id
  text: Mereka termasuk orang-orang yang memberontak terhadap terang[a]; mereka tidak mengenal jalan-jalannya[b] dan tidak tetap berada di lintasan-lintasannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka dahulu termasuk para pemberontak terhadap terang.” Bentuk kata kerja Ibraninya dapat dibaca sebagai lampau (“dahulu termasuk”), tetapi dalam konteks puitis ini kemungkinan besar menggambarkan suatu golongan yang terus ada.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bahasa Ibrani memakai akhiran maskulin tunggal: “jalan-jalannya ... lintasan-lintasannya.” Akhiran itu paling wajar merujuk kepada “terang,” yang dalam bahasa Ibrani merupakan kata benda maskulin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Mereka
  rationale: Pronomina mandiri ini memberi penegasan pada kelompok yang sedang dibicarakan. Dalam bahasa Indonesia, “mereka” paling alami; daya tunjuknya muncul dari konteks dan frasa “termasuk orang-orang”.
- source_word: הָיוּ
  choice: termasuk
  rationale: Secara bentuk berarti “ada/adalah” dalam kala lampau, tetapi bersama בְּמֹרְדֵי menyatakan keanggotaan dalam suatu golongan. Dalam konteks puisi yang menggambarkan watak yang terus berlaku, “termasuk” wajar tanpa memaksakan penandaan kala.
- source_word: בְּמֹרְדֵי
  choice: orang-orang yang memberontak
  rationale: Preposisi ב dengan bentuk partisipial menyatakan ketercakupan dalam kelompok. Klausa relatif mempertahankan sifat aktif tindakan מרד.
- source_word: אוֹר
  choice: terang
  rationale: “Terang” mempertahankan kemungkinan makna harfiah sekaligus moral tanpa mempersempit metaforanya.
- source_word: לֹא הִכִּירוּ
  choice: tidak mengenal
  rationale: הכיר dapat berarti mengenal, mengakui, atau mengenali. “Tidak mengenal” alami dengan objek “jalan-jalannya” dan tetap membiarkan nuansa kegagalan memahami maupun mengakui.
- source_word: דְרָכָיו
  choice: jalan-jalannya
  rationale: Akhiran orang ketiga maskulin tunggal paling dekat merujuk kepada אוֹר, yang secara gramatikal maskulin tunggal. Bentuk ini mempertahankan rujukan tersebut tanpa menambah personalisasi eksplisit.
- source_word: וְלֹא יָשְׁבוּ
  choice: dan tidak tinggal
  rationale: ישב dapat berarti duduk, menetap, atau tinggal. Bersama “di lintasan-lintasannya,” maknanya ialah tetap berada atau berdiam dalam lintasan itu; “tinggal” mempertahankan metafora dan terdengar alami.
- source_word: בִּנְתִיבֹתָיו
  choice: di lintasan-lintasannya
  rationale: נתיבה berarti jalan setapak, jalur, atau lintasan. “Lintasan” membedakannya dari דְּרָכִים (“jalan-jalan”) sambil menjaga paralelisme puitis.
theological_decisions:
- issue: Rujukan akhiran pronominal pada “jalan-jalannya” dan “lintasan-lintasannya”
  choice: Akhiran dipahami merujuk kepada “terang.”
  alternative: Akhiran dapat dibaca dengan rujukan personal tersirat sehingga berarti “jalan-jalan-Nya” dan “lintasan-lintasan-Nya.”
  rationale: Anteseden gramatikal terdekat ialah אוֹר (“terang”), nomina maskulin tunggal, dan gambaran ayat berpusat pada pemberontakan terhadap terang. Penulisan dengan huruf kecil tidak memasukkan personalisasi teologis yang tidak dinyatakan secara eksplisit oleh teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Terang,” “jalan,” dan “lintasan” mempertahankan metafora serta paralelisme sumber. Tanda kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
