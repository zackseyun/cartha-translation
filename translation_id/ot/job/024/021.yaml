  yaml_path: translation/ot/job/024/021.yaml
  text: He preys on the barren woman who does not bear[a], and he does no good to the widow.
translation:
  language: id
  text: Ia memangsa perempuan mandul yang tidak melahirkan[a], dan tidak berbuat baik kepada janda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memakan perempuan mandul”; kata kerja Ibraninya secara harfiah berarti “menggembalakan” atau “memberi makan,” tetapi dalam konteks ini kemungkinan besar bernuansa pemangsaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה
  choice: memangsa
  rationale: Bentuk ini berasal dari רעה, yang secara harfiah biasanya berarti “menggembalakan” atau “memberi makan.” Namun, dalam konteks tindakan orang fasik terhadap kaum rentan, kata ini tampaknya bernuansa pemangsaan atau eksploitasi. “Memangsa” menyampaikan daya negatif itu secara wajar dalam bahasa Indonesia, sementara arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: עֲקָרָה
  choice: perempuan mandul
  rationale: Ungkapan ini secara jelas menunjuk kepada seorang perempuan yang mandul. Pilihan ini mempertahankan jenis kelamin dan bentuk tunggal yang terdapat dalam bahasa Ibrani.
- source_word: לֹא תֵלֵד
  choice: yang tidak melahirkan
  rationale: Terjemahan ini dekat dengan arti harfiah “tidak melahirkan” dan tidak menambahkan gagasan modal “tidak dapat,” yang tidak dinyatakan secara eksplisit.
- source_word: אַלְמָנָה
  choice: janda
  rationale: Padanan baku dan alami untuk golongan sosial rentan yang disebut dalam teks Ibrani.
- source_word: לֹא יְיֵטִיב
  choice: tidak berbuat baik kepada
  rationale: Bentuk kausatif dari יטב dapat berarti berbuat baik, memperlakukan dengan baik, atau memberi manfaat. Pilihan ini jelas, cukup harfiah, dan mempertahankan bobot moral ungkapan tersebut.
