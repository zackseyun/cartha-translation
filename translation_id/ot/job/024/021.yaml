  terminology: “Perempuan mandul,” “janda,” dan “berbuat baik kepada” tepat serta netral. Catatan kaki perlu membedakan arti dasar verba Ibrani (“menggembalakan/memberi makan”) dari alternatif kontekstual “memakan.”
