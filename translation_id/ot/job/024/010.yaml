  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עָר֣וֹם הִ֭לְּכוּ בְּלִ֣י לְב֑וּשׁ וּ֝/רְעֵבִ֗ים נָ֣שְׂאוּ עֹֽמֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: id
  text: Mereka berjalan telanjang, tanpa pakaian; dalam keadaan lapar, mereka mengangkut berkas-berkas gandum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seberkas gandum.” Kata benda Ibrani berbentuk tunggal, tetapi di sini mungkin dipakai secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: telanjang
  rationale: Padanan langsung dan wajar untuk keadaan tidak berpakaian atau sangat kekurangan pakaian; konteks menekankan kemelaratan mereka.
- source_word: הִלְּכוּ
  choice: mereka berjalan
  rationale: Bentuk dari הלך menyatakan tindakan berjalan atau pergi; 'berjalan' mempertahankan gambaran konkret dalam bahasa Indonesia yang alami.
- source_word: בְּלִי
  choice: tanpa
  rationale: Secara langsung menyatakan ketiadaan sesuatu.
- source_word: לְבוּשׁ
  choice: pakaian
  rationale: Merujuk pada pakaian atau sesuatu yang dikenakan; bentuk massal 'pakaian' alami sesudah 'tanpa'.
- source_word: רְעֵבִים
  choice: dalam keadaan lapar
  rationale: Mempertahankan arti dasar 'lapar' tanpa memperkuatnya menjadi 'kelaparan' atau 'sangat lapar', sekaligus mengalir alami dalam susunan kalimat.
- source_word: נָשְׂאוּ
  choice: mereka mengangkut
  rationale: Dalam konteks pekerja yang membawa hasil panen, 'mengangkut' menyampaikan tindakan membawa beban secara alami.
- source_word: עֹמֶר
  choice: berkas-berkas gandum
  rationale: Kata Ibrani berbentuk tunggal, tetapi mungkin dipakai secara kolektif untuk berkas hasil panen yang dibawa para pekerja; bentuk jamak alami dalam bahasa Indonesia, sementara bentuk tunggal dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan makna dalam 'telanjang, tanpa pakaian' dipertahankan karena terdapat dalam teks Ibrani dan menegaskan penderitaan para pekerja. Tanda catatan kaki ditempatkan pada 'berkas-berkas gandum', yaitu unsur yang memiliki alternatif leksikal.
