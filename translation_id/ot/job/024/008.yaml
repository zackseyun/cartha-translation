  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: id
  text: Mereka kuyup oleh hujan deras di pegunungan[a]; tanpa tempat berlindung, mereka memeluk batu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka basah oleh aliran deras dari pegunungan” atau “oleh hujan badai di pegunungan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka memeluk batu”; yakni, mereka merapat kepadanya untuk berlindung.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם
  choice: oleh hujan deras
  rationale: זֶרֶם dapat menunjuk pada curahan deras, hujan badai, atau aliran deras. Dalam konteks orang-orang yang terpapar cuaca dan menjadi basah kuyup, 'hujan deras' menyampaikan makna meteorologis secara alami tanpa meniadakan alternatif 'aliran deras'.
- source_word: הָרִים
  choice: dari pegunungan
  rationale: Bentuk jamak ini menunjuk pada gunung-gunung atau kawasan pegunungan. Frasa 'dari pegunungan' mempertahankan hubungan sumber atau lokasi yang dinyatakan oleh konstruksi Ibrani.
- source_word: יִרְטָבוּ
  choice: mereka kuyup
  rationale: Kata kerja ini berarti menjadi basah atau terendam air. 'Kuyup' secara ringkas dan wajar menggambarkan keadaan sangat basah akibat terpaan hujan.
- source_word: וּמִבְּלִי
  choice: karena tidak mempunyai
  rationale: Konstruksi ini berarti 'tanpa' atau 'karena tidak ada'. Dalam bahasa Indonesia, 'karena tidak mempunyai tempat berlindung' mengungkapkan kekurangan yang menyebabkan tindakan pada klausa berikutnya.
- source_word: מַחְסֶה
  choice: tempat berlindung
  rationale: Nomina ini berarti perlindungan, naungan, atau tempat berlindung. Bentuk konkret paling sesuai dengan keadaan fisik dalam ayat ini.
- source_word: חִבְּקוּ
  choice: mereka memeluk
  rationale: Makna harfiahnya adalah 'memeluk'. Pilihan ini mempertahankan gambaran puitis tentang orang-orang yang merapat pada batu demi perlindungan.
- source_word: צוּר
  choice: batu
  rationale: צוּר berarti batu besar atau cadas. 'Batu' alami bagi pembaca umum, sedangkan catatan kaki menjelaskan bahwa tindakan memeluknya berarti merapat untuk berlindung.
