  yaml_path: translation/ot/job/024/023.yaml
  text: He gives them security[a], and they are supported[b]; his eyes are on their ways.
translation:
  language: id
  text: Ia memberi mereka keamanan[a], dan mereka ditopang[b]; matanya tertuju pada jalan-jalan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, bagian ini secara harfiah memakai bentuk tunggal, “kepadanya” dan “ia ditopang”. Terjemahan utama memahaminya secara kolektif sebagai “mereka” karena ayat ini berakhir dengan “jalan-jalan mereka”.
    reason: alternative_reading
  - marker: b
    text: 'Atau, secara lebih harfiah: “Ia memberi dia keamanan, dan ia ditopang; matanya tertuju pada jalan-jalan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: memberi
  rationale: Bentuk Qal imperfek orang ketiga tunggal dari נתן menyatakan pemberian atau penganugerahan; bentuk kini cocok dengan pernyataan puitis umum dalam konteks.
- source_word: לוֹ
  choice: mereka
  rationale: Secara morfologis berarti 'kepadanya', tetapi bentuk jamak דַּרְכֵיהֶם ('jalan-jalan mereka') pada akhir ayat mendukung pemahaman kolektif tentang orang-orang fasik. Bentuk tunggal Ibrani dicatat dalam catatan kaki.
- source_word: לָבֶטַח
  choice: rasa aman
  rationale: Nomina בטח menunjuk pada keamanan atau keadaan aman. 'Rasa aman' alami sesudah 'memberi' dan tidak membatasi maknanya pada keselamatan dari bahaya tertentu.
- source_word: וְיִשָּׁעֵן
  choice: dan mereka ditopang
  rationale: Bentuk Nifal imperfek dari שׁען dapat berarti 'ditopang' atau 'bersandar'. Terjemahan pasif mempertahankan gambaran bahwa keadaan mereka mendapat penopang, sedangkan bentuk jamak mengikuti pengertian kolektif dalam baris ini.
- source_word: וְעֵינֵיהוּ
  choice: mata-Nya
  rationale: Secara harfiah 'mata-matanya'; dalam bahasa Indonesia idiomatis menjadi 'mata-Nya'. Sufiks tunggal paling wajar menunjuk kepada Allah dalam konteks, meskipun Ia tidak disebut secara eksplisit dalam ayat ini.
- source_word: עַל
  choice: tertuju pada
  rationale: Dalam ungkapan tentang mata, preposisi ini menandai perhatian atau pengamatan yang diarahkan kepada sesuatu. 'Tertuju pada' alami dalam bahasa Indonesia.
- source_word: דַּרְכֵיהֶם
  choice: jalan-jalan mereka
  rationale: דרך dapat berarti jalan secara harfiah maupun cara hidup atau perilaku. 'Jalan-jalan' mempertahankan metafora Ibrani serta kemungkinan makna etisnya.
theological_decisions:
- issue: Pergantian bentuk tunggal dan jamak serta rujukan subjek dalam ayat
  choice: Bagian pertama diterjemahkan secara kolektif ('mereka'), sedangkan 'mata-Nya' dipertahankan sebagai rujukan tunggal dan frasa terakhir tetap jamak.
  alternative: 'Terjemahan yang lebih formal: ''Ia memberi dia rasa aman, dan dia ditopang; mata-Nya tertuju pada jalan-jalan mereka.'''
  rationale: Teks Ibrani memakai 'kepadanya' dan verba tunggal pada bagian pertama, tetapi berakhir dengan 'jalan-jalan mereka'. Terjemahan utama mengungkapkan kelompok orang fasik sebagai kolektif tanpa menghapus ketidakteraturan gramatikal, yang dijelaskan dalam catatan kaki. Kapitalisasi pada '-Nya' menyatakan rujukan yang paling wajar kepada Allah, tetapi teks tidak menambahkan nama Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. Ungkapan 'jalan-jalan mereka' dipertahankan untuk menjaga metafora sumber; kapitalisasi pronomina ilahi mengikuti kebiasaan penulisan bahasa Indonesia.
