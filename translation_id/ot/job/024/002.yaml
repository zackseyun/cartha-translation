translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Paralelisme tindakan dipertahankan, sedangkan “lalu” memperjelas urutan alami dalam klausa kedua tanpa menambahkan penilaian teologis.
