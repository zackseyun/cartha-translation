  text: גְּבֻל֥וֹת יַשִּׂ֑יגוּ עֵ֥דֶר גָּ֝זְל֗וּ וַ/יִּרְעֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/002.yaml
  text: They move boundary markers[b][a]; they seize a flock and pasture it.
translation:
  language: id
  text: Mereka menggeser tanda-tanda batas[a]; mereka merampas kawanan ternak, lalu menggembalakannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memindahkan tanda-tanda batas.” Verba Ibrani ini dapat menyatakan penggeseran atau penyingkiran penanda tanah untuk menyerobot lahan orang lain.
    reason: lexical_alternative
  - marker: b
    text: Atau “mencuri kawanan ternak dan membawanya merumput.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: tanda-tanda batas
  rationale: Bentuk jamak ini dalam konteks kepemilikan tanah menunjuk pada penanda fisik yang menetapkan batas lahan; pilihan ini lebih konkret daripada sekadar “batas-batas”.
- source_word: יַשִּׂיגוּ
  choice: menggeser
  rationale: Dalam konteks tanda batas tanah, verba ini menyatakan pemindahan tanda untuk menyerobot lahan orang lain. “Menggeser” mempertahankan tindakan konkret tanpa menentukan bahwa tanda itu dibuang sama sekali.
- source_word: עֵדֶר
  choice: kawanan ternak
  rationale: Nomina kolektif tunggal ini lazim menunjuk pada sekawanan hewan ternak. “Kawanan ternak” alami dalam bahasa Indonesia dan tidak mempersempit jenis hewannya tanpa dasar yang pasti.
- source_word: גָּזְלוּ
  choice: merampas
  rationale: Verba ini menyatakan pengambilan secara tidak sah, sering dengan kekerasan atau secara terang-terangan. “Merampas” mempertahankan unsur tersebut lebih baik daripada “mencuri,” yang dapat menyiratkan tindakan diam-diam.
- source_word: וַיִּרְעוּ
  choice: lalu menggembalakannya
  rationale: Verba רעה di sini berarti menggembalakan atau membawa kawanan merumput. “Menggembalakannya” alami dengan objek kawanan ternak dan menampilkan ironi bahwa kawanan rampasan itu kemudian dipelihara seperti milik sendiri.
