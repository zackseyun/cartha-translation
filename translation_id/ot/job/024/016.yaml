base_translation:
  language: en
  yaml_path: translation/ot/job/024/016.yaml
  text: In the dark they break into houses[a]; by day they shut themselves in[c][b]; they do not know the light.
translation:
  language: id
  text: Dalam gelap ia membobol rumah-rumah[a]; pada siang hari mereka mengurung diri[b]; mereka tidak mengenal terang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia menggali menembus rumah-rumah dalam gelap.” Kata kerja Ibrani secara lebih harfiah dapat berarti “menggali menembus”, mungkin dengan membobol dinding.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka menutup diri rapat-rapat.” Bahasa Ibrani dapat menekankan tindakan menutup atau menyembunyikan diri selama siang hari.
    reason: lexical_alternative
  - marker: c
    text: “Terang” terutama dapat berarti cahaya siang, tetapi dalam konteks ini mungkin juga mengandung nuansa moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתַר
  choice: membobol
  rationale: Kata kerja ini secara harfiah menggambarkan tindakan menggali atau menerobos, khususnya menembus dinding dalam konteks pencurian. “Membobol” menyampaikan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: בַּחֹשֶׁךְ
  choice: dalam gelap
  rationale: Frasa ini menyatakan waktu atau suasana tindakan dan mempertahankan gambaran tentang kegelapan sebagai sarana bersembunyi.
- source_word: בָּתִּים
  choice: rumah-rumah
  rationale: Bentuk jamak ini secara langsung merujuk kepada tempat-tempat tinggal; pengulangan nomina merupakan bentuk jamak yang wajar dalam bahasa Indonesia.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Ungkapan ini membentuk kontras puitis yang jelas dengan “dalam gelap” dan terdengar alami dalam bahasa Indonesia modern.
- source_word: חִתְּמוּ לָמוֹ
  choice: mereka mengurung diri
  rationale: Kata kerja tersebut berarti memeteraikan atau menutup rapat. Bersama לָמוֹ, ungkapan ini paling mungkin menggambarkan mereka menutup atau menyembunyikan diri pada siang hari.
- source_word: לֹא יָדְעוּ אוֹר
  choice: mereka tidak mengenal terang
  rationale: Terjemahan ini mempertahankan idiom Ibrani dengan verba “mengenal” serta membiarkan “terang” merujuk kepada cahaya siang sekaligus membuka kemungkinan nuansa moral.
theological_decisions:
- issue: Kemungkinan makna moral-simbolis dari אוֹר (“terang”)
  choice: Mempertahankan “terang” tanpa menjelaskan simbolismenya dalam teks utama.
  alternative: Menerjemahkannya secara lebih tafsiran sebagai “cahaya siang” atau “apa yang benar”.
  rationale: Konteks terutama mengontraskan kejahatan malam hari dengan persembunyian pada siang hari, tetapi “terang” juga mungkin bernuansa moral. Terjemahan mempertahankan ketegangan itu.
- issue: Peralihan dari bentuk tunggal חָתַר ke bentuk jamak חִתְּמוּ dan יָדְעוּ
  choice: Mempertahankan peralihan “ia” ke “mereka”.
  alternative: 'Menyeragamkan seluruh ayat menjadi bentuk jamak: “mereka membobol”.'
  rationale: Teks Masoret memakai kata kerja tunggal pada klausa pertama lalu bentuk jamak pada klausa berikutnya. Peralihan ini mungkin bergerak dari pelaku individual kepada golongan orang-orang seperti dia, sehingga tidak diseragamkan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Membobol” dipilih sebagai padanan idiomatis yang umum untuk tindakan menerobos rumah, sedangkan “mengenal terang” mempertahankan ungkapan puitis dan ambiguitas sumber. Peralihan gramatikal dari tunggal ke jamak dalam bahasa Ibrani dipertahankan.
