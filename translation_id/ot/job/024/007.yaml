  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: id
  text: Mereka bermalam telanjang, tanpa pakaian, dan tidak mempunyai penutup terhadap hawa dingin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka bermalam telanjang, tanpa pakaian, dan tidak mempunyai penutup di tengah hawa dingin.”
    reason: Alternatif ini menerjemahkan בַּקָּרָה secara lebih harfiah dalam arti lokatif, “di tengah/dalam hawa dingin,” alih-alih menyatakan fungsi perlindungan dengan “terhadap hawa dingin.”
lexical_decisions:
- source_word: עָרוֹם
  choice: dengan telanjang
  rationale: Kata sifat ini menunjukkan keadaan tanpa pakaian atau hanya berpakaian sangat minim. Pilihan ini langsung dan mempertahankan gambaran tajam tentang kesengsaraan mereka.
- source_word: יָלִינוּ
  choice: bermalam
  rationale: Bentuk dari לין berarti melewatkan malam atau menginap. “Bermalam” alami, ringkas, dan mempertahankan unsur waktunya.
- source_word: מִבְּלִי
  choice: tanpa
  rationale: Ungkapan ini menyatakan ketiadaan atau kekurangan. “Tanpa” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: לְבוּשׁ
  choice: pakaian
  rationale: Nomina ini dapat menunjuk pada pakaian secara umum atau sehelai pakaian. “Pakaian” mempertahankan makna umum dan cocok dengan bahasa Indonesia modern.
- source_word: כְּסוּת
  choice: penutup
  rationale: Kata ini menunjuk pada sesuatu yang menutupi, sering kali pakaian yang juga berfungsi sebagai pelindung. “Penutup” tidak mempersempit maknanya menjadi selimut atau jenis pakaian tertentu.
- source_word: בַּקָּרָה
  choice: untuk menghadapi hawa dingin
  rationale: Secara harfiah frasa ini berarti “dalam hawa dingin”. Susunan yang dipilih menyatakan secara alami fungsi perlindungan dari penutup dalam konteks ini, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
