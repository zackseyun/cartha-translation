translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pengulangan “telanjang” dan “tanpa pakaian” dipertahankan karena terdapat dalam teks Ibrani dan menegaskan parahnya keadaan mereka.
