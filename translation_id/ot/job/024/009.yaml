  text: יִ֭גְזְלוּ מִ/שֹּׁ֣ד יָת֑וֹם וְֽ/עַל עָנִ֥י יַחְבֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/009.yaml
  text: They snatch the orphan from the breast[a], and they take a pledge from the poor.
translation:
  language: id
  text: 'Mereka merenggut anak yatim dari buah dada,[a]

    dan mengambil barang jaminan dari orang miskin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka merampas anak yatim dari buah dada ibunya.” Ungkapan Ibraninya sulit; maksudnya tampaknya bahwa orang-orang jahat dengan kejam mengambil bahkan seorang anak yatim yang masih menyusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְזְלוּ
  choice: merenggut
  rationale: Kata גזל menyatakan tindakan mengambil secara paksa atau tidak adil. “Merenggut” menyampaikan kekerasan dan sifat memangsa dalam konteks ini.
- source_word: מִשֹּׁד
  choice: dari buah dada
  rationale: Ungkapan Ibrani ini sulit. Dalam konteks ini, שֹׁד dipahami menurut penafsiran tradisional sebagai “buah dada,” yaitu tempat seorang bayi menyusu; terjemahan ini mempertahankan gambaran sumber tanpa menambahkan “ibunya” ke teks utama.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: יָתוֹם menunjuk pada anak yatim, khususnya anak yang kehilangan ayah. “Anak yatim” adalah sebutan baku dan alami dalam bahasa Indonesia.
- source_word: וְעַל
  choice: dan ... dari
  rationale: Dengan חבל dalam konteks utang, עַל memperkenalkan orang yang darinya barang jaminan diambil. “Dari” menghasilkan ungkapan Indonesia yang alami.
- source_word: עָנִי
  choice: orang miskin
  rationale: Dalam paralel dengan praktik pengambilan jaminan utang, עָנִי paling tepat dipahami dalam arti sosial-ekonomi, yaitu orang miskin.
- source_word: יַחְבֹּלוּ
  choice: mengambil barang jaminan
  rationale: Dalam bentuk dan konteks ini, חבל berarti mengambil sesuatu sebagai jaminan utang. “Barang jaminan” memperjelas bahwa yang dimaksud adalah benda yang dijadikan agunan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Merenggut” mempertahankan daya kekerasan verba Ibrani, sedangkan “buah dada” menjaga citra konkret teks. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkan.
