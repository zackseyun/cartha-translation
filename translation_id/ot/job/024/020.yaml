  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: id
  text: Rahim melupakannya; belatung menganggapnya manis.[a] Ia tidak lagi dikenang, dan kezaliman dipatahkan seperti pohon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “ia manis bagi belatung.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang zalim dipatahkan seperti pohon.” Kata Ibrani yang dipakai adalah nomina abstrak yang berarti “kezaliman” atau “ketidakbenaran”, tetapi dapat menunjuk kepada orang yang berbuat zalim.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: melupakannya
  rationale: Bentuk Qal imperfek dengan akhiran orang ketiga maskulin tunggal. Bentuk kini tanpa penanda waktu mempertahankan sifat puitis-gnomisnya dalam bahasa Indonesia.
- source_word: רֶחֶם
  choice: rahim
  rationale: Padanan langsung yang mempertahankan personifikasi dan gambaran tajam dalam teks Ibrani, tanpa memperluasnya menjadi 'rahim ibunya'.
- source_word: מְתָקוֹ רִמָּה
  choice: belatung melahapnya dengan nikmat
  rationale: Ungkapan ini secara harfiah mengaitkan rasa manis dengan belatung sebagai subjek. Terjemahan ini menyampaikan bahwa tubuh orang itu menjadi santapan yang nikmat bagi belatung, sambil mempertahankan alternatif yang lebih harfiah dalam catatan kaki.
- source_word: רִמָּה
  choice: belatung
  rationale: Dalam konteks pembusukan mayat, 'belatung' lebih tepat dan alami daripada istilah umum 'cacing', tanpa menentukan spesies secara berlebihan.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: Ia tidak lagi dikenang
  rationale: Bentuk pasif Niphal dengan עוֹד לֹא menyatakan berhentinya ingatan tentang orang itu. Susunan ini alami dalam bahasa Indonesia dan mempertahankan bentuk pasif.
- source_word: וַתִּשָּׁבֵר
  choice: dipatahkan
  rationale: Mempertahankan makna pasif שׁבר dan kesejajaran puitis tanpa mengubahnya menjadi tindakan yang lebih khusus seperti 'ditumbangkan'.
- source_word: כָּעֵץ
  choice: seperti pohon
  rationale: Padanan langsung bagi perbandingan dengan עֵץ, dengan mempertahankan gambaran pohon dalam teks sumber.
- source_word: עַוְלָה
  choice: kezaliman
  rationale: Nomina abstrak ini berarti ketidakbenaran, kejahatan, atau kelaliman. 'Kezaliman' alami dalam konteks sastra hikmat dan tetap mempertahankan bentuk abstrak Ibrani.
theological_decisions:
- issue: Apakah עַוְלָה diterjemahkan sebagai gagasan abstrak atau sebagai orang yang melakukannya
  choice: 'Bentuk abstrak: ''kezaliman dipatahkan seperti pohon'''
  alternative: 'Bentuk konkret/metonimis: ''orang zalim dipatahkan seperti pohon'''
  rationale: Teks Ibrani memakai nomina abstrak. Karena nomina itu mungkin secara metonimis menunjuk kepada pelaku kezaliman, alternatif konkret dicatat tanpa menggantikan ketegangan yang terdapat dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Personifikasi 'rahim' serta bentuk abstrak 'kezaliman' dipertahankan; ungkapan mengenai belatung dibuat alami tanpa menghilangkan citra mengerikan dari teks sumber.
