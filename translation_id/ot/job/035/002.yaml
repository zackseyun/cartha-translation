base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: id
  text: Apakah menurutmu ini adil—engkau berkata[a], “Kebenaranku lebih besar daripada kebenaran Allah”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku benar di hadapan Allah,” atau, “Hakku berasal dari Allah.” Ungkapan Ibraninya sangat padat, dan hubungan antara “kebenaranku” dengan “Allah” diperdebatkan.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: Apakah menurutmu ini
  rationale: Partikel tanya הֲ, kata tunjuk זֹאת, dan verba חָשַׁבְתָּ membentuk pertanyaan retoris. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan teguran langsung Elihu.
- source_word: לְמִשְׁפָּט
  choice: adil
  rationale: מִשְׁפָּט di sini menunjuk pada apa yang dinilai adil atau benar. Bentuk predikatif 'ini adil' menyampaikan fungsi evaluatif frasa Ibrani secara wajar.
- source_word: אָמַרְתָּ
  choice: ketika engkau berkata
  rationale: Bentuk perfektif secara harfiah mendukung 'berkata/telah berkata'. Hubungan sintaksis dengan pertanyaan sebelumnya dibuat alami memakai 'ketika', tanpa mengubah isi kutipan.
- source_word: צִדְקִי
  choice: Kebenaranku
  rationale: צֶדֶק dengan sufiks orang pertama dapat berarti kebenaran, hak, atau keadaan benar. 'Kebenaranku' mempertahankan nuansa moral-yudisial dan kaitan leksikalnya.
- source_word: מֵאֵל
  choice: lebih besar daripada kebenaran Allah
  rationale: מִן dapat menyatakan perbandingan. Karena bahasa Indonesia memerlukan unsur pembanding yang jelas, 'kebenaran' diulang secara eksplisit; kemungkinan relasi lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna klaim Ayub dalam ringkasan polemis Elihu
  choice: 'Perbandingan: ''Kebenaranku lebih besar daripada kebenaran Allah'''
  alternative: '''Aku benar di hadapan Allah'' atau ''hakku berasal dari Allah'''
  rationale: Frasa Ibrani צִדְקִי מֵאֵל sangat padat dan hubungan sintaksisnya diperdebatkan. Bacaan komparatif paling sesuai dengan tuduhan Elihu dalam konteks dekat, tetapi alternatif yang sungguh mungkin dipertahankan dalam catatan kaki agar ketegangan teologis tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' mempertahankan sapaan tunggal langsung dalam wacana puitis. Tanda [a] ditempatkan pada pengantar kutipan karena catatan menerangkan keseluruhan kemungkinan pembacaan klausa yang dikutip.
