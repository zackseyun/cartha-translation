  text: Pandanglah langit dan lihatlah; tataplah awan-awan—semuanya lebih tinggi daripadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֵּט
  choice: Pandanglah
  rationale: Imperatif ini mengajak orang mengarahkan pandangan; 'pandanglah' alami dan bermartabat.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Mempertahankan imperatif kedua dan kesejajaran retoris teks Ibrani.
- source_word: וְשׁוּר
  choice: tataplah
  rationale: Mengungkapkan tindakan memandang dengan saksama serta membedakannya dari ראה.
- source_word: שְׁחָקִים
  choice: awan-awan
  rationale: Dalam konteks paralel dengan 'langit' dan pernyataan tentang ketinggian, istilah ini paling alami dipahami sebagai awan-awan di angkasa.
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: semuanya lebih tinggi daripadamu
  rationale: Menyampaikan perbandingan ketinggian secara langsung; 'semuanya' memperjelas bahwa bentuk jamak verba mengacu pada awan-awan tanpa mengubah makna.
