  register: Bahasa Indonesia baku modern dengan gaya tutur langsung yang wajar dan bermartabat. Ambiguitas sintaksis mengenai hubungan “dengan kata-kata” dan cakupan orang-orang yang dijawab dipertahankan serta dijelaskan dalam catatan kaki.
