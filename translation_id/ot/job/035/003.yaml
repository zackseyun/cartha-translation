  text: כִּֽי תֹ֭אמַר מַה יִּסְכָּן לָ֑/ךְ מָֽה אֹ֝עִ֗יל מֵֽ/חַטָּאתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: id
  text: Sebab engkau berkata[a], “Apa manfaatnya bagimu? Apa keuntungan yang kuperoleh dari dosaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa keuntungan yang kaudapat? Apa keuntungan yang kuperoleh lebih daripada jika aku berbuat dosa?” Bahasa Ibraninya ringkas dan mungkin menyiratkan perbandingan antara hidup benar dan berbuat dosa.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan Elihu mengenai perkataan yang ia nisbahkan kepada Ayub, sesuai dengan alur argumentasi.
- source_word: תֹאמַר
  choice: engkau berkata
  rationale: Bentuk Qal imperfek orang kedua tunggal maskulin ditujukan kepada Ayub; bentuk kini umum ini wajar untuk menyampaikan tuduhan Elihu.
- source_word: מַה יִּסְכָּן לָךְ
  choice: Apa manfaatnya bagimu?
  rationale: סכן menyatakan kegunaan atau manfaat. Akhiran orang kedua pada לָךְ dipertahankan tanpa memperjelas rujukannya, karena ungkapan Ibrani ini ringkas dan ambigu.
- source_word: מָה אֹעִיל
  choice: Apa keuntungan yang kuperoleh
  rationale: Bentuk Hifil orang pertama tunggal dari יעל menyatakan mendapat manfaat atau keuntungan; susunan ini alami dalam bahasa Indonesia.
- source_word: מֵחַטָּאתִי
  choice: dari dosaku
  rationale: מן dapat menandai sumber maupun perbandingan. Terjemahan utama mempertahankan arti sumber yang lebih langsung, sedangkan kemungkinan perbandingan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Daya tafsir kutipan Elihu
  choice: Kutipan dibiarkan menanyakan manfaat bagi pihak yang disebut dengan pronomina orang kedua dan keuntungan pribadi yang diperoleh dari dosa.
  alternative: Elihu dapat dipahami menuduh Ayub bertanya apakah hidup benar memberinya keuntungan lebih besar daripada berbuat dosa.
  rationale: Bahasa Ibrani sangat ringkas; לָךְ berakhiran orang kedua feminin dan mungkin merujuk pada gagasan tentang kebenaran dalam ayat sebelumnya, sedangkan מן pada מֵחַטָּאתִי dapat bersifat komparatif. Terjemahan tidak menetapkan satu rujukan teologis secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada argumentatif yang lugas dan bermartabat. Kata “engkau” mempertahankan sapaan tunggal kepada Ayub; “manfaat” dan “keuntungan” menjaga paralelisme tanpa pengulangan yang kaku.
