id: JOB.35.12
reference: Job 35:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: id
  text: Di sana mereka berseru, tetapi Ia tidak menjawab[a], karena keangkuhan orang-orang jahat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani tidak menyebutkan secara eksplisit siapa yang tidak menjawab; konteks mengisyaratkan Allah.
    reason: alternative_reading
  - marker: b
    text: Atau “kesombongan orang-orang jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Di sana
  rationale: Adverbia ini terutama bersifat lokatif dan menunjuk pada keadaan yang baru digambarkan; “di sana” mempertahankan makna itu tanpa mengubahnya menjadi penanda waktu.
- source_word: יִצְעֲקוּ
  choice: mereka berseru
  rationale: Kata kerja צעק menyatakan seruan karena kesusahan atau penindasan. “Berseru” alami dan bermartabat dalam bahasa Indonesia serta mempertahankan kesan mendesak.
- source_word: וְלֹא
  choice: tetapi ... tidak
  rationale: 'Walaupun waw dapat sekadar berarti “dan”, hubungan antarklausa bersifat kontras: mereka berseru, tetapi jawaban tidak diberikan.'
- source_word: יַעֲנֶה
  choice: Ia tidak menjawab
  rationale: Bentuk verba adalah orang ketiga maskulin tunggal, tanpa subjek yang disebutkan secara eksplisit. Konteks menunjuk kepada Allah; pronomina “Ia” menghasilkan kalimat Indonesia yang wajar, sedangkan catatan kaki mempertahankan ketidaktersuratan subjek dalam bahasa Ibrani.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Dalam konteks ini frasa tersebut menyatakan sebab; “karena” adalah padanan Indonesia yang langsung dan alami.
- source_word: גְּאוֹן
  choice: keangkuhan
  rationale: Dengan רָעִים, kata ini bermakna negatif, yakni kesombongan atau keangkuhan, bukan kemuliaan. “Keangkuhan” menyampaikan sifat tercela itu dengan jelas.
- source_word: רָעִים
  choice: orang-orang jahat
  rationale: Adjektiva maskulin jamak ini dipakai secara substantival untuk para pelaku kejahatan. “Orang-orang jahat” jelas, alami, dan tidak mengaburkan rujukannya kepada manusia.
theological_decisions:
- issue: Subjek tersirat dari “tidak menjawab”
  choice: Memakai “Ia” dalam teks utama, dengan catatan bahwa bahasa Ibrani tidak menyebut subjek secara eksplisit.
  alternative: Allah tidak menjawab mereka; atau konstruksi pasif “mereka tidak dijawab”.
  rationale: Konteks mengarahkan pembaca kepada Allah sebagai pihak yang diharapkan menjawab, tetapi teks Ibrani hanya memakai verba orang ketiga maskulin tunggal. “Ia” menjaga kelancaran bahasa Indonesia tanpa memasukkan nama “Allah” ke dalam klausa.
- issue: Makna גְּאוֹן dalam konteks negatif
  choice: keangkuhan
  alternative: kesombongan
  rationale: Kedua padanan menyampaikan kebanggaan diri yang tercela. “Keangkuhan” dipilih karena sesuai dengan kaitannya pada orang-orang jahat, sementara alternatif dicatat untuk mempertahankan rentang leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. “Berseru” dan “keangkuhan” mempertahankan martabat sastra Ayub tanpa terdengar usang.
