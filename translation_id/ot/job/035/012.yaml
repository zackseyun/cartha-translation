  source_fidelity: Teks Indonesia dengan setia menerjemahkan שָׁם sebagai “Di sana,” יִצְעֲקוּ sebagai “mereka berseru,” dan מִפְּנֵי גְּאוֹן רָעִים sebagai “karena keangkuhan orang-orang jahat.” Kontras waw ditangkap secara wajar oleh “tetapi.” Subjek tunggal pada יַעֲנֶה tetap tidak diberi nama; “Ia” sesuai dengan konteks tanpa mengganti subjek tersirat itu menjadi “Allah” dalam teks utama.
