  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם צָ֭דַקְתָּ מַה תִּתֶּן ל֑/וֹ א֥וֹ מַה מִ/יָּדְ/ךָ֥ יִקָּֽח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: id
  text: Jika engkau benar, apa yang kauberikan kepadanya?[a] Atau apa yang dia ambil dari tanganmu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Allah. Dalam konteks ini, Elihu menegaskan bahwa kebenaran manusia tidak memberikan keuntungan kepada Allah.
    reason: cross_reference
  - marker: b
    text: Atau, “apa yang dia terima dari tanganmu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan klausa bersyarat secara langsung dan wajar dalam bahasa Indonesia.
- source_word: צָדַקְתָּ
  choice: engkau benar
  rationale: Bentuk verba dari צדק menyatakan keadaan benar atau berada di pihak yang benar. Ungkapan ini mempertahankan keluasan makna Ibrani tanpa menambahkan unsur seperti 'hidup' atau 'di hadapan Allah' yang tidak tersurat.
- source_word: מַה תִּתֶּן לוֹ
  choice: apa yang kauberikan kepadanya
  rationale: Mempertahankan pertanyaan retoris serta relasi objek tak langsung yang ditandai oleh לְ. Bentuk kini menyampaikan kebenaran umum dalam argumen Elihu.
- source_word: אוֹ
  choice: Atau
  rationale: Menghubungkan dua pertanyaan retoris yang sejajar dengan konjungsi disjungtif sederhana.
- source_word: מִיָּדְךָ
  choice: dari tanganmu
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang sesuatu yang berasal dari milik atau kuasa seseorang.
- source_word: יִקָּח
  choice: dia ambil
  rationale: לקח secara langsung berarti 'mengambil', tetapi juga dapat berarti 'menerima'. Pilihan utama mempertahankan citra aktif teks sumber, sedangkan kemungkinan 'menerima' dicatat dalam catatan kaki.
theological_decisions:
- issue: Acuan pronomina לוֹ dan subjek tersirat pada יִקָּח
  choice: Pronomina 'kepadanya/dia' dipertahankan dalam teks utama dan dipahami mengacu kepada Allah berdasarkan konteks.
  alternative: Mengganti pronomina secara langsung dengan 'Allah', atau memahaminya sebagai orang yang tidak ditentukan.
  rationale: Ayat 6–8 menunjukkan bahwa Elihu sedang membahas apakah dosa atau kebenaran manusia memberi dampak atau keuntungan kepada Allah. Namun, karena teks Ibrani ayat ini memakai pronomina dan bukan nama Allah, terjemahan utama juga mempertahankan pronomina agar tidak menghilangkan bentuk dan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kata ganti 'engkau' sesuai dengan sapaan tunggal dalam wacana hikmat. Pronomina orang ketiga tidak dikapitalisasi agar bentuk teks Ibrani dan kemungkinan acuannya tidak diselesaikan secara tipografis; catatan kaki menjelaskan acuan kontekstualnya.
