id: JOB.35.10
reference: Job 35:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְֽ/לֹא אָמַ֗ר אַ֭יֵּה אֱל֣וֹהַּ עֹשָׂ֑/י נֹתֵ֖ן זְמִר֣וֹת בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: id
  text: Namun, tak seorang pun berkata[a], “Di manakah Allah, Penciptaku, yang memberi nyanyian pada malam hari?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk jamak, “pencipta-penciptaku,” tetapi di sini bentuk itu merujuk kepada Allah yang satu; karena itu diterjemahkan “Penciptaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Namun, tak seorang pun
  rationale: Konjungsi dan negasi menyatakan pertentangan dengan konteks sebelumnya. Subjek tak tentu yang tersirat dibuat eksplisit agar wajar dalam bahasa Indonesia.
- source_word: אָמַר
  choice: berkata
  rationale: Walaupun bentuk Ibraninya perfektif, dalam konteks ini tindakan itu merupakan pengamatan umum; bahasa Indonesia tidak mengharuskan penandaan kala.
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Kata tanya ini menanyakan lokasi atau kehadiran; bentuk ini alami sekaligus mempertahankan nada puitis.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Gelar ilahi tunggal yang lazim dalam kitab Ayub diterjemahkan dengan istilah baku bahasa Indonesia.
- source_word: עֹשָׂי
  choice: Penciptaku
  rationale: Bentuknya secara morfologis jamak dengan akhiran orang pertama tunggal, tetapi merujuk kepada Allah yang tunggal. Bentuk tunggal menghindari kesan banyak ilah, sedangkan bentuk formalnya dicatat dalam catatan kaki.
- source_word: נֹתֵן
  choice: yang memberi
  rationale: Partisip ini menggambarkan tindakan khas Allah dan paling jelas diungkapkan sebagai klausa relatif.
- source_word: זְמִרוֹת
  choice: nyanyian
  rationale: Kata ini menunjuk pada lagu atau nyanyian; terjemahan ini mempertahankan cakupan makna tanpa menambahkan unsur pujian atau liturgi yang tidak dinyatakan secara eksplisit.
- source_word: בַּלָּיְלָה
  choice: pada malam hari
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan latar malam secara puitis.
theological_decisions:
- issue: Jumlah gramatikal עֹשָׂי ketika merujuk kepada Allah
  choice: 'Makna tunggal: “Penciptaku”'
  alternative: 'Bentuk harfiah jamak: “para penciptaku” atau “pencipta-penciptaku”'
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, acuan dalam konteks adalah Allah yang tunggal. Teks utama memakai bentuk tunggal agar tidak menimbulkan kesan politeistis, sementara ketegangan bentuk sumber dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat, dengan susunan pertanyaan langsung serta nuansa puitis. “Tak seorang pun” dipilih sebagai bentuk ringkas dan alami; “Penciptaku” memakai huruf kapital karena menjadi sebutan bagi Allah.
