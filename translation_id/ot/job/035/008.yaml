  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: id
  text: Kefasikanmu berdampak pada orang seperti dirimu, dan kebenaranmu pada manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang anak manusia.” Ungkapan Ibrani ini di sini berarti manusia fana; bukan gelar mesianis.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: berdampak pada orang
  rationale: Klausa Ibrani bersifat eliptis dan memakai לְ untuk menandai pihak yang terkena dampak. Berdasarkan konteks ayat 6–7, kata kerja tersirat diterjemahkan dengan “berdampak pada” agar hubungan maknanya jelas dalam bahasa Indonesia.
- source_word: כָּמוֹךָ
  choice: seperti dirimu
  rationale: Mempertahankan perbandingan eksplisit bahwa yang dimaksud ialah manusia lain yang sama seperti Ayub.
- source_word: רִשְׁעֶךָ
  choice: kefasikanmu
  rationale: רֶשַׁע menunjuk pada kejahatan atau kefasikan secara moral; “kefasikan” sesuai dengan ragam etis dan puitis ayat ini.
- source_word: וּלְבֶן אָדָם
  choice: dan ... pada seorang anak manusia
  rationale: Ungkapan ini dipertahankan secara cukup formal untuk mencerminkan citra Ibrani, sedangkan “seorang” dan huruf kecil menandai pemakaiannya sebagai sebutan umum bagi manusia, bukan gelar mesianis.
- source_word: צִדְקָתֶךָ
  choice: kebenaranmu
  rationale: צְדָקָה di sini berarti kebenaran atau perilaku benar dan membentuk pasangan antitesis dengan “kefasikanmu”.
theological_decisions:
- issue: Makna בֶּן אָדָם dalam konteks
  choice: Ungkapan umum bagi manusia, diterjemahkan “seorang anak manusia”
  alternative: “seorang manusia” atau gelar “Anak Manusia”
  rationale: Dalam puisi Ayub, ungkapan ini sejajar dengan “orang seperti dirimu” dan menunjuk kepada manusia fana. Bentuk formalnya dipertahankan tanpa menjadikannya gelar kristologis.
- issue: Arah dampak kefasikan dan kebenaran manusia
  choice: Keduanya berdampak pada sesama manusia
  alternative: Keduanya diberikan kepada atau menjadi milik manusia
  rationale: Preposisi לְ berada dalam klausa eliptis yang diterangi oleh ayat 6–7. “Berdampak pada” menyampaikan maksud ucapan Elihu tanpa menyatakan bahwa tindakan manusia sama sekali tidak berhubungan dengan Allah dalam setiap pengertian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. Paralelisme Ibrani dipertahankan dengan menghilangkan pengulangan kata kerja “berdampak” pada klausa kedua. “Anak manusia” ditulis dengan huruf kecil untuk menghindari kesan sebagai gelar khusus.
