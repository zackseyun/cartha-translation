  yaml_path: translation/ot/job/035/015.yaml
  text: And now[a], because his anger has not punished, and he does not greatly heed transgression[b],
translation:
  language: id
  text: Dan sekarang, karena murka-Nya tidak menghukum[a] dan Dia tidak banyak menghiraukan pelanggaran[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia tidak mendatangi untuk menghukum dalam murka-Nya.” Kata Ibrani ini dapat berarti “mendatangi,” “memperhatikan,” atau “menghukum.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “pelanggaran” tidak pasti; kata itu mungkin juga menyiratkan “pemberontakan,” “keangkuhan,” atau “pelanggaran besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan kata penghubung וְ serta peralihan waktu/wacana yang dinyatakan oleh עַתָּה tanpa menentukan hubungan yang lebih khusus.
- source_word: כִּי
  choice: karena
  rationale: Mengungkapkan fungsi penjelas atau alasan dalam perkataan Elihu dan mempertahankan kaitan ayat ini dengan kelanjutannya.
- source_word: אַיִן פָּקַד אַפּוֹ
  choice: murka-Nya tidak menghukum
  rationale: פקד dapat berarti mengunjungi, memperhatikan, atau menghukum. Dalam konteks penghakiman, makna hukuman paling masuk akal; susunan ini juga mempertahankan אַפּוֹ sebagai subjek gramatikal yang mengikuti verba.
- source_word: וְלֹא יָדַע
  choice: dan Dia tidak terlalu menghiraukan
  rationale: ידע di sini paling wajar dipahami sebagai memperhatikan atau mengindahkan, bukan sekadar mengetahui secara kognitif. Kata 'terlalu' membawa daya intensif מְאֹד dalam bahasa Indonesia yang alami.
- source_word: בַּפַּשׁ
  choice: pelanggaran
  rationale: Kata Ibrani ini langka dan tidak pasti. 'Pelanggaran' sesuai dengan konteks penghakiman, sementara kemungkinan makna lain dipertahankan dalam catatan kaki.
- source_word: מְאֹד
  choice: terlalu
  rationale: Berfungsi sebagai keterangan intensitas bagi tindakan menghiraukan; bentuk ini menghasilkan ungkapan Indonesia yang alami tanpa menghilangkan tingkat intensitasnya.
theological_decisions:
- issue: Makna klausa Ibrani yang sangat sulit dan hubungannya dengan tindakan Allah
  choice: Ayat ini menyatakan bahwa murka Allah belum menghukum dan bahwa Dia tidak terlalu menghiraukan pelanggaran.
  alternative: Klausa itu dapat berarti bahwa Allah tidak menghukum dalam murka-Nya dan tidak sepenuhnya mengenali kesombongan besar.
  rationale: Pilihan ini mengikuti makna yudisial yang sesuai dengan konteks teguran Elihu, tetapi tidak mengubah ucapan Elihu menjadi pernyataan doktrinal mutlak tentang pengetahuan atau perhatian Allah. Ketidakpastian leksikal tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur klausa yang belum selesai dipertahankan dengan tanda koma karena ayat berikutnya melanjutkan pemikiran Elihu. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
