source:
  edition: WLC
  text: אִם חָ֭טָאתָ מַה תִּפְעָל בּ֑/וֹ וְ/רַבּ֥וּ פְ֝שָׁעֶ֗י/ךָ מַה תַּעֲשֶׂה לּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: id
  text: Jika engkau berdosa, apa yang kaulakukan terhadap Dia?[a] Dan jika pelanggaranmu banyak, apa yang kauperbuat kepada-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “apa yang kauhasilkan terhadap Dia?” Kata Ibrani yang dipakai dapat berarti “melakukan”, “mengerjakan”, atau “menghasilkan suatu akibat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: Jika engkau berdosa
  rationale: אִם memperkenalkan syarat retoris, sedangkan bentuk perfektif חָטָאתָ dalam konteks ini menyatakan keadaan umum; bentuk kini bahasa Indonesia paling alami tanpa membatasi makna pada tindakan lampau.
- source_word: מַה תִּפְעָל בּוֹ
  choice: apa yang kaulakukan terhadap Dia?
  rationale: פעל dapat berarti melakukan, mengerjakan, atau menghasilkan suatu akibat. Ungkapan netral ini mempertahankan pertanyaan retoris dan cakupan בּוֹ tanpa secara berlebihan menyimpulkan bahwa dosa sama sekali tidak berkaitan dengan Allah.
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: Dan jika pelanggaranmu banyak
  rationale: Kata penghubung dan verba jamak membentuk klausa sejajar dengan syarat pertama; kata 'jika' dibuat eksplisit dalam bahasa Indonesia. פשע diterjemahkan 'pelanggaran' untuk mempertahankan bobot moralnya, termasuk nuansa pemberontakan, tanpa terdengar tidak alami.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: apa yang kauperbuat kepada-Nya?
  rationale: עשה berarti melakukan atau berbuat, dan לּוֹ menandai pihak yang menjadi sasaran. 'Kauperbuat kepada-Nya' dekat dengan bentuk Ibrani dan mempertahankan daya retoris tanpa menambahkan kata 'dapat'.
theological_decisions:
- issue: Apakah pertanyaan ini harus menyiratkan bahwa dosa manusia sama sekali tidak relevan bagi Allah, atau hanya tidak merusak dan mengurangi Dia.
  choice: 'Pertanyaan dibiarkan dalam bentuk retoris yang netral: dosa manusia tidak digambarkan mampu menghasilkan sesuatu terhadap Allah dalam arti yang sedang dipersoalkan Elihu.'
  alternative: Menerjemahkan secara lebih eksplisit, misalnya, 'kerugian apa yang kautimbulkan bagi-Nya?' atau 'apa yang dapat kaulakukan untuk melawan Dia?'
  rationale: Bahasa Ibrani menekankan keluhuran dan ketidaktergantungan Allah, tetapi tidak menyatakan bahwa dosa tidak penting secara moral di hadapan-Nya. Terjemahan ini mempertahankan ketegangan itu tanpa mempersempit pertanyaan menjadi kerugian saja.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Sapaan tunggal 'engkau' sesuai dengan konteks ujaran langsung; bentuk 'kaulakukan' dan 'kauperbuat' menjaga kelancaran serta paralelisme. Rujukan kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
