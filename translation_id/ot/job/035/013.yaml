source:
  edition: WLC
  text: אַךְ שָׁ֭וְא לֹא יִשְׁמַ֥ע אֵ֑ל וְ֝/שַׁדַּ֗י לֹ֣א יְשׁוּרֶֽ/נָּה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: id
  text: Sungguh, Allah tidak mendengarkan kesia-siaan[a], dan Yang Mahakuasa tidak memperhatikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehampaan,” “kepalsuan,” atau “hal yang tidak berguna.” Kata Ibrani ini dapat menggambarkan sesuatu yang hampa, sia-sia, atau menipu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menegaskan kesimpulan Elihu; “Sungguh” menyampaikan daya penegasnya secara wajar tanpa memberi arti pembatas seperti “hanya”.
- source_word: שָׁוְא
  choice: kesia-siaan
  rationale: Kata ini dapat menunjuk pada sesuatu yang hampa, sia-sia, tidak bernilai, atau palsu. “Kesia-siaan” mempertahankan bentuk abstrak dan keluasan maknanya tanpa mempersempitnya menjadi “seruan palsu” atau “doa sia-sia”.
- source_word: יִשְׁמַע
  choice: tidak mendengarkan
  rationale: Bentuk imperfek menyatakan kebenaran umum dalam konteks ini. “Mendengarkan” lebih alami dalam bahasa Indonesia untuk tindakan memberi perhatian terhadap suatu seruan, tanpa menyiratkan bahwa Allah tidak mampu mendengar.
- source_word: אֵל
  choice: Allah
  rationale: אֵל adalah sebutan umum bagi Allah; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: וְשַׁדַּי
  choice: dan Yang Mahakuasa
  rationale: שַׁדַּי adalah gelar ilahi. “Yang Mahakuasa” menerjemahkan gelar tersebut secara jelas dan sesuai dengan pemakaiannya dalam kitab Ayub.
- source_word: יְשׁוּרֶנָּה
  choice: tidak memperhatikannya
  rationale: Kata kerja שׁוּר berarti melihat, memandang, atau mengindahkan. “Memperhatikannya” menyampaikan perhatian yang sungguh-sungguh dan sejalan dengan baris paralel “tidak mendengarkan”; akhiran feminin tunggal diterjemahkan “-nya” dan merujuk kembali pada kesia-siaan.
theological_decisions:
- issue: Maksud שָׁוְא dalam pernyataan Elihu
  choice: Teks dibiarkan menyatakan bahwa Allah tidak mendengarkan “kesia-siaan,” dengan konteks yang dapat mengarah pada seruan yang hampa, sia-sia, atau tidak tulus.
  alternative: Menafsirkannya secara khusus sebagai kepalsuan, perkataan congkak, atau doa yang sia-sia.
  rationale: Bahasa Ibrani memakai nomina abstrak yang cakupan maknanya luas. Terjemahan ini mempertahankan ketegangan tersebut dan tidak mengubah ayat menjadi pernyataan tentang keterbatasan pengetahuan atau kemampuan Allah untuk mendengar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan Allah sebagai subjek eksplisit, sementara paralelisme antara “Allah” dan “Yang Mahakuasa” serta antara “mendengarkan” dan “memperhatikan” dipertahankan.
