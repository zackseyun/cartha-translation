  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: id
  text: Jadi, Ayub membuka mulutnya dengan sia-sia[a]; tanpa pengetahuan ia memperbanyak kata-kata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kehampaan”; kata Ibrani הֶבֶל dapat menunjuk pada kesia-siaan, kehampaan, atau sesuatu yang seperti uap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִיּוֹב
  choice: Jadi, Ayub
  rationale: Konjungsi וְ menghubungkan ayat ini dengan kesimpulan Elihu sebelumnya dan dalam konteks dapat bernuansa simpulan; “Jadi” menyampaikan hubungan itu secara wajar.
- source_word: הֶבֶל
  choice: dengan kesia-siaan
  rationale: הֶבֶל dapat berarti napas, uap, kehampaan, atau kesia-siaan. Di sini kata itu menerangkan sifat perkataan Ayub sebagai hampa atau sia-sia, sekaligus mempertahankan keluasan citra Ibraninya.
- source_word: יִפְצֶה פִּיהוּ
  choice: membuka mulutnya
  rationale: Ungkapan פצה פה secara harfiah berarti “membuka mulut” dan lazim menunjuk pada tindakan mulai berbicara; padanan ini juga alami dalam bahasa Indonesia.
- source_word: בִּבְלִי דַעַת
  choice: tanpa pengetahuan
  rationale: בִּבְלִי menyatakan ketiadaan, sedangkan דַעַת berarti “pengetahuan”; terjemahan langsung ini tidak mempersempit maknanya menjadi sekadar kebodohan atau kurang pengertian.
- source_word: מִלִּין
  choice: kata-kata
  rationale: Bentuk jamak bercorak Aram ini berarti kata-kata atau ucapan; “kata-kata” merupakan padanan Indonesia yang paling langsung.
- source_word: יַכְבִּר
  choice: ia memperbanyak
  rationale: Bentuk Hifil dari כָּבַר di sini menyatakan membuat menjadi banyak atau melimpah; “memperbanyak” mempertahankan nuansa kausatifnya.
