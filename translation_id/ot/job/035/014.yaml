base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: id
  text: Apalagi ketika engkau berkata, “Engkau tidak melihat-Nya.” Perkara itu ada di hadapan-Nya, dan engkau harus menantikan Dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “dan menggeliat di hadapan-Nya.” Kata kerja Ibrani ini sulit dipastikan; banyak penafsir memahaminya di sini sebagai “menantikan Dia dengan penuh harap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Apalagi ketika
  rationale: Ungkapan ini meneruskan dan menguatkan alasan Elihu dari ayat sebelumnya. “Apalagi ketika” menyampaikan hubungan argumentatif itu secara alami dalam bahasa Indonesia tanpa memaksakan nuansa konsesif.
- source_word: תֹאמַר
  choice: engkau berkata
  rationale: Bentuk orang kedua tunggal ini ditujukan kepada Ayub dan secara langsung berarti tindakan berkata.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: Engkau tidak melihat-Nya
  rationale: Kata kerja שׁור berarti melihat, memandang, atau menangkap dengan penglihatan. Dalam konteks ini subjeknya adalah Ayub, sedangkan akhiran pronominalnya menunjuk kepada Allah.
- source_word: דִּין
  choice: Perkara itu
  rationale: דִּין di sini paling wajar menunjuk pada perkara yang diajukan untuk diputuskan, bukan terutama pada konsep abstrak “keadilan”. Kata “itu” memperjelas bahwa yang dimaksud ialah perkara yang sedang dibicarakan tanpa menambahkan isi baru.
- source_word: לְפָנָיו
  choice: ada di hadapan-Nya
  rationale: Ungkapan ini mempertahankan gambaran hukum bahwa perkara tersebut berada di hadapan Allah untuk dipertimbangkan atau diputuskan.
- source_word: וּתְחוֹלֵל לוֹ
  choice: dan engkau harus menantikan Dia
  rationale: Bentuk dari חול ini sulit dan dapat dikaitkan dengan menggeliat atau berputar, tetapi dalam konteksnya banyak dipahami sebagai menanti dengan penuh harap. “Harus menantikan” menyampaikan daya nasihat dalam perkataan Elihu, sementara kemungkinan makna yang lebih konkret dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Keluhan Ayub tentang Allah yang tidak terlihat dan perkara yang berada di hadapan Allah
  choice: Ayub tidak melihat Allah, tetapi perkaranya tetap berada di hadapan Allah dan ia harus menantikan-Nya.
  alternative: Allah tidak melihat perkara itu; atau klausa terakhir berarti Ayub “menggeliat di hadapan-Nya”.
  rationale: Tata bahasa dan alur pembicaraan paling mendukung pemahaman bahwa Ayublah yang tidak melihat Allah, bukan bahwa Allah tidak melihat perkara tersebut. Namun, kesulitan leksikal pada kata kerja terakhir tidak disembunyikan dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Sapaan “engkau” dipakai karena Elihu berbicara langsung kepada Ayub. Kapitalisasi pronomina yang menunjuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
