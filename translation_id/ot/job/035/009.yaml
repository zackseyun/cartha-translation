  source_fidelity: Teks Indonesia dengan tepat menyampaikan hubungan sebab pada מֵרֹב, makna jamak abstrak עֲשׁוּקִים sebagai penindasan, serta dua seruan paralel. “Karena lengan orang-orang berkuasa” mempertahankan metafora זְרוֹעַ dan secara wajar memahami מִן sebagai kausal, sementara alternatif “dari” dicatat. Pemahaman רַבִּים sebagai pihak yang berkuasa sangat sesuai konteks dan alternatif numeriknya juga dicatat.
  naturalness: Kalimatnya lancar, lugas, dan sesuai bahasa Indonesia modern. Urutan “orang-orang berseru; mereka berteriak minta tolong” menyampaikan paralelisme Ibrani dengan jelas tanpa menjadi kaku.
  terminology: “Penindasan,” “berseru,” “berteriak minta tolong,” “lengan,” dan “orang-orang berkuasa” tepat register dan makna. Catatan budaya untuk “lengan” cukup menjelaskan idiom kekuatan/kuasa tanpa mengganti citra teks.
