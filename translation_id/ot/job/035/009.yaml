id: JOB.35.9
reference: Job 35:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: id
  text: Karena banyaknya penindasan, orang-orang berseru; mereka berteriak minta tolong karena lengan[b] orang-orang berkuasa.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka berteriak minta tolong dari lengan orang-orang berkuasa.” Kata depan Ibrani dapat diterjemahkan lebih harfiah sebagai “dari”, meskipun di sini kemungkinan besar menyatakan penyebab seruan mereka.
    reason: lexical_alternative
  - marker: b
    text: “Lengan” adalah gambaran Ibrani untuk kekuatan atau kuasa.
    reason: cultural_note
  - marker: c
    text: Atau, “banyak orang.” Kata Ibrani yang sama dapat berarti orang-orang yang besar atau berkuasa maupun orang-orang yang banyak jumlahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  choice: Karena banyaknya
  rationale: Preposisi מִן bersama רֹב menyatakan sebab atau sumber seruan. Frasa ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan tentang banyaknya penindasan.
- source_word: עֲשׁוּקִים
  choice: penindasan
  rationale: Dalam konstruksi ini bentuk jamak dari akar עשׁק paling wajar dipahami sebagai berbagai tindakan atau kejadian penindasan, bukan terutama sebagai sebutan bagi orang-orang yang tertindas.
- source_word: יַזְעִיקוּ
  choice: orang-orang berseru
  rationale: Bentuk Hifil dari זעק menyatakan seruan keras dalam kesusahan. Subjek jamaknya tidak disebutkan secara eksplisit; 'orang-orang' membuat kalimat Indonesia jelas tanpa menentukan kelompok yang tidak dinyatakan teks.
- source_word: יְשַׁוְּעוּ
  choice: mereka berteriak minta tolong
  rationale: Kata kerja שׁוע menyatakan permohonan akan pertolongan. Pilihan ini membedakannya sedikit dari 'berseru' sekaligus mempertahankan paralelisme.
- source_word: מִזְּרֹעַ
  choice: karena lengan
  rationale: זְרוֹעַ secara harfiah berarti 'lengan' dan menjadi gambaran kekuatan atau kuasa. Preposisi מִן dipahami secara kausal dalam konteks ini, tetapi kemungkinan arti 'dari' dicatat dalam catatan kaki.
- source_word: רַבִּים
  choice: orang-orang berkuasa
  rationale: Dalam konteks penindasan, רַבִּים paling mungkin menunjuk kepada orang-orang besar atau kuat secara sosial. Namun, arti harfiah alternatif 'banyak orang' tetap dicatat karena bentuk Ibraninya dapat memuat kedua nuansa itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan dua kata kerja seruan dipertahankan dengan 'berseru' dan 'berteriak minta tolong'. Metafora 'lengan' dipertahankan, sedangkan ambiguitas pada kata depan dan רַבִּים dijelaskan dalam catatan kaki.
