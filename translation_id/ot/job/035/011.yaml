  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: id
  text: yang mengajar kita lebih daripada binatang-binatang di bumi dan menjadikan kita lebih bijaksana daripada burung-burung di langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang mengajar kita melalui binatang-binatang di bumi dan menjadikan kita bijaksana melalui burung-burung di langit.” Preposisi Ibrani ini juga dapat menunjukkan sumber, bukan perbandingan.
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: mengajar kita
  rationale: Partisipel Piel dari למד dengan sufiks orang pertama jamak menyatakan tindakan aktif memberi pengajaran; bentuk ini alami dan langsung dalam bahasa Indonesia.
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: melebihi binatang-binatang di bumi
  rationale: Preposisi מִן paling mungkin bersifat komparatif dalam paralelisme ini. Kata 'melebihi' mengungkapkan bahwa pengajaran yang diberikan kepada manusia melampaui yang diberikan kepada binatang, tanpa mengubah citra konkret teks Ibrani.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: daripada burung-burung di langit
  rationale: מֵ diterjemahkan secara komparatif sejajar dengan klausa pertama. 'Burung-burung di langit' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran עוֹף הַשָּׁמַיִם.
- source_word: יְחַכְּמֵנוּ
  choice: membuat kita lebih bijaksana
  rationale: Bentuk Piel dari חכם dengan sufiks orang pertama jamak bermakna kausatif, yakni menjadikan bijaksana. Unsur 'lebih' memperjelas perbandingan yang dinyatakan oleh מֵ.
theological_decisions:
- issue: Makna preposisi מִן dalam kedua bagian paralel
  choice: 'Komparatif: Allah mengajar manusia melebihi binatang dan membuat manusia lebih bijaksana daripada burung.'
  alternative: 'Sumber: Allah mengajar kita dari binatang-binatang di bumi dan memberi kita hikmat dari burung-burung di langit.'
  rationale: Paralelisme puitis dan konteks mendukung perbandingan antara karunia yang diterima manusia dan kehidupan hewan. Namun, kemungkinan makna sumber tetap dipertahankan dalam catatan kaki karena preposisi Ibrani memungkinkan pembacaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. 'Binatang-binatang di bumi' serta 'burung-burung di langit' mempertahankan kesejajaran dan citra konkret bahasa Ibrani.
