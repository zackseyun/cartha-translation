  text: Did you not pour me out like milk and curdle me like cheese?[a]
translation:
  language: id
  text: Bukankah Engkau mencurahkan aku seperti susu dan menggumpalkan aku seperti keju?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuatku memadat seperti dadih.” Kata benda Ibrani yang diterjemahkan “keju” juga dapat dipahami lebih umum sebagai “dadih,” yaitu hasil olahan susu yang menggumpal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel tanya retoris ini mengharapkan jawaban ya; “Bukankah” mempertahankan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: כֶחָלָב
  choice: seperti susu
  rationale: Prefiks כ menyatakan perbandingan; ungkapan ini mempertahankan gambaran susu dalam bahasa Indonesia yang wajar.
- source_word: תַּתִּיכֵנִי
  choice: menuangkan aku
  rationale: Bentuk Hifil dari נתך menggambarkan tindakan menuangkan cairan; pilihan ini sesuai dengan metafora pembentukan dari susu.
- source_word: וְכַגְּבִנָּה
  choice: dan seperti keju
  rationale: Konjungsi dan prefiks perbandingan memperkenalkan gambaran kedua; גְּבִנָּה secara lugas dapat berarti keju, meski dapat pula merujuk secara lebih umum pada dadih.
- source_word: תַּקְפִּיאֵנִי
  choice: mengentalkan aku
  rationale: Bentuk Hifil dari קפא berarti menyebabkan menjadi kental atau membeku; “mengentalkan” alami dalam konteks olahan susu dan tidak terlalu teknis.
