  text: תְּחַדֵּ֬שׁ עֵדֶ֨י/ךָ נֶגְדִּ֗/י וְ/תֶ֣רֶב כַּֽ֭עַשְׂ/ךָ עִמָּדִ֑/י חֲלִיפ֖וֹת וְ/צָבָ֣א עִמִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: id
  text: 'Engkau terus menghadirkan saksi-saksi baru untuk melawan aku[a]

    dan semakin murka terhadapku;

    pergantian dan pasukan menyertaiku.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bukti-bukti-Mu.” Kata Ibrani yang digunakan dapat menunjuk pada saksi dalam perkara hukum maupun pada kesaksian atau bukti yang diajukan terhadap Ayub.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, frasa Ibrani ini berbunyi kira-kira “pergantian-pergantian dan pasukan ada bersamaku.” Frasa itu mungkin menggambarkan gelombang pasukan atau serangan yang datang silih berganti; “peperangan” atau “tugas berat” juga mungkin untuk kata yang diterjemahkan “pasukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: terus menghadirkan ... baru
  rationale: 'Bentuk piel dari חדש menyatakan membuat baru atau memperbarui. Dalam konteks keluhan Ayub, ungkapan ini secara alami menyampaikan tindakan berulang: Allah menghadirkan saksi atau bukti baru lagi.'
- source_word: עֵדֶיךָ
  choice: saksi-saksi-Mu
  rationale: Bentuk jamak עֵד lazim berarti saksi, tetapi juga dapat menunjuk pada kesaksian atau bukti. Pilihan ini mempertahankan gambaran pengadilan; arti 'bukti-bukti' dicatat dalam catatan kaki.
- source_word: נֶגְדִּי
  choice: untuk melawan aku
  rationale: Secara dasar berarti 'di hadapanku', tetapi dalam konteks hukum dan permusuhan di sini bermakna adversatif, yaitu 'melawan aku'.
- source_word: וְתֶרֶב
  choice: semakin
  rationale: Bentuk dari רבה menyatakan penambahan atau pelipatgandaan. Bersama kata tentang murka, 'semakin murka' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan peningkatan intensitas.
- source_word: כַּעַשְׂךָ
  choice: murka-Mu
  rationale: כעס dapat berarti kemarahan, kejengkelan, atau murka. 'Murka' sesuai dengan register puisi yang bermartabat dan jelas menunjuk pada kemarahan Allah sebagaimana dikeluhkan Ayub.
- source_word: עִמָּדִי
  choice: terhadapku
  rationale: Preposisi ini secara harfiah berarti 'denganku', tetapi dengan 'murka' bahasa Indonesia menuntut hubungan sasaran; 'terhadapku' menyampaikan maksud kontekstual tanpa kejanggalan.
- source_word: חֲלִיפוֹת
  choice: demi pasukan
  rationale: Kata ini dapat berarti pergantian, giliran, atau penggantian. Dalam kaitannya dengan צבא, konstruksi 'pasukan demi pasukan' menyampaikan gelombang atau giliran serangan yang terus berganti.
- source_word: וְצָבָא
  choice: pasukan
  rationale: צבא dapat berarti pasukan, bala tentara, peperangan, atau tugas berat. Konteks serangan mendukung citra militer, tetapi kemungkinan 'peperangan/tugas berat' dipertahankan dalam catatan kaki.
- source_word: עִמִּי
  choice: menyerang aku
  rationale: Secara harfiah berarti 'denganku'. Dalam konteks bermusuhan dan citra pasukan, terjemahan ini menyatakan relasi adversatif yang tersirat secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah pernyataan Ayub harus dilunakkan agar tidak terdengar menuduh Allah?
  choice: Mempertahankan tuduhan langsung Ayub bahwa Allah menghadirkan saksi dan meningkatkan murka terhadapnya.
  alternative: Melunakkan kalimat menjadi gambaran penderitaan tanpa menyebut tindakan Allah secara langsung.
  rationale: Teks Ibrani memakai sapaan orang kedua secara langsung. Ketegangan teologis dalam keluhan Ayub merupakan bagian dari puisi dan tidak boleh diselesaikan atau dilunakkan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia modern dengan corak puisi yang bermartabat. Baris terakhir diterjemahkan secara idiomatis agar citra serangan berturut-turut jelas, sementara ketidakpastian frasa Ibrani yang padat dipertahankan dalam catatan kaki.
