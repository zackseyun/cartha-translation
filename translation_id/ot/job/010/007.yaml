source:
  edition: WLC
  text: עַֽל דַּ֭עְתְּ/ךָ כִּי לֹ֣א אֶרְשָׁ֑ע וְ/אֵ֖ין מִ/יָּדְ/ךָ֣ מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: id
  text: Meskipun Engkau tahu bahwa aku bukan orang fasik,[a] tidak ada seorang pun yang dapat melepaskan aku dari tangan-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku tidak bersalah.” Secara harfiah, bahasa Ibrani menyatakan “bukan orang fasik,” yang menekankan penyangkalan Ayub bahwa ia seorang fasik, bukan klaim bahwa ia sama sekali tanpa dosa.
    reason: lexical_alternative
  - marker: b
    text: “Dari tangan-Mu” adalah ungkapan Ibrani yang berarti terlepas dari kuasa atau kendali seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: Meskipun Engkau tahu
  rationale: 'Ungkapan ini berfungsi secara adverbial dan, dalam konteks keluhan Ayub, paling wajar dipahami dengan nuansa konsesif: Allah mengetahui keadaan Ayub, tetapi tetap memperlakukannya demikian.'
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari apa yang Allah ketahui.
- source_word: לֹא אֶרְשָׁע
  choice: aku bukan orang fasik
  rationale: Bentuk imperfek Qal dari רשע dapat menyatakan keadaan dalam konteks ini. Ungkapan ini mempertahankan istilah moral 'fasik' dan menampilkan penyangkalan Ayub bahwa dirinya termasuk orang fasik, tanpa menjadikannya klaim bahwa ia sama sekali tanpa dosa.
- source_word: וְאֵין
  choice: tidak ada seorang pun
  rationale: Konstruksi eksistensial negatif ini secara alami menyatakan bahwa sama sekali tidak ada orang yang dapat bertindak sebagai penyelamat.
- source_word: מִיָּדְךָ
  choice: dari tangan-Mu
  rationale: Terjemahan ini mempertahankan citra Ibrani tentang tangan sebagai kuasa atau kendali.
- source_word: מַצִּיל
  choice: yang dapat melepaskan aku
  rationale: Partisip Hifil dari נצל menunjuk kepada pihak yang melepaskan atau menyelamatkan. Kata 'dapat' menyampaikan ketidakmungkinan yang tersirat, sedangkan objek 'aku' dijelaskan secara alami dari konteks.
theological_decisions:
- issue: Pernyataan Ayub tentang ketidakbersalahannya di hadapan Allah
  choice: aku bukan orang fasik
  alternative: aku tidak bersalah
  rationale: Teks Ibrani memakai רשע, yang menunjuk pada kefasikan atau orang fasik, bukan istilah yang dengan sendirinya menyatakan kesempurnaan tanpa dosa. Pilihan ini mempertahankan ketegangan teologis dalam protes Ayub.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai “Engkau” dan “-Mu”. Istilah “orang fasik” dipertahankan karena tepat secara moral-teologis, dengan catatan kaki yang menjelaskan batas maknanya.
