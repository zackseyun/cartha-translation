  text: sebelum aku pergi—dan tidak kembali—ke negeri yang gelap dan kelam pekat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan tradisional, “negeri kegelapan dan bayang-bayang maut.”
