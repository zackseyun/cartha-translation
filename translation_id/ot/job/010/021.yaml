lexical_decisions:
- source_word: בְּטֶרֶם
  choice: sebelum
  rationale: Partikel waktu ini berarti 'sebelum' dan secara alami mengawali klausa 'sebelum aku pergi'.
- source_word: אֵלֵךְ
  choice: aku pergi
  rationale: Bentuk Qal orang pertama tunggal dari הלך berarti 'aku pergi'. Ungkapan ini mempertahankan gambaran gerak menuju alam kematian tanpa menerjemahkannya secara interpretatif sebagai 'aku mati'.
- source_word: וְלֹא אָשׁוּב
  choice: dan tidak kembali
  rationale: Terjemahan langsung yang mempertahankan urutan Ibrani dan tidak menambahkan penegasan 'tidak akan pernah', walaupun sifat final tersirat dalam konteks.
- source_word: אֶל
  choice: ke
  rationale: Preposisi arah yang wajar dalam frasa Indonesia 'pergi ... ke negeri'.
- source_word: אֶרֶץ
  choice: negeri
  rationale: Dalam konteks ini kata tersebut menunjuk pada suatu ranah atau negeri, bukan bumi secara umum.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Makna dasar dan padanan Indonesia yang langsung serta alami.
- source_word: צַלְמָוֶת
  choice: kelam pekat
  rationale: Istilah ini dapat menunjuk pada kegelapan atau kekelaman yang sangat dalam. 'Kelam pekat' alami dalam puisi Indonesia dan menjaga kesejajaran dengan 'kegelapan' tanpa memaksakan unsur 'maut' yang diperdebatkan secara leksikal.
theological_decisions:
- issue: Terjemahan צַלְמָוֶת dalam konteks puitis tentang kematian
  choice: kelam pekat
  alternative: bayang-bayang maut; kegelapan pekat
  rationale: Istilah Ibrani ini diperdebatkan antara pengertian tradisional 'bayang-bayang maut' dan pengertian idiomatis berupa kekelaman yang sangat dalam. Teks utama memakai ungkapan Indonesia yang alami dan sesuai dengan paralelisme, sedangkan terjemahan tradisional dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Tanda pisah mempertahankan sisipan klausa Ibrani, sedangkan 'negeri' menyampaikan gambaran suatu ranah tanpa menjelaskannya secara berlebihan sebagai dunia orang mati.
