  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: id
  text: Kedua tangan-Mu membentuk dan menjadikan aku seluruhnya, dari segala sisi; namun Engkau menelan aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֶיךָ
  choice: Tangan-Mu
  rationale: Bentuk Ibrani adalah jamak dengan akhiran orang kedua maskulin tunggal. Dalam bahasa Indonesia, bentuk idiomatis “Tangan-Mu” tetap mempertahankan gambaran konkret tentang karya Allah secara pribadi tanpa perlu menandai jamak secara kaku.
- source_word: עִצְּבוּנִי
  choice: membentuk aku
  rationale: Bentuk Piel dari עצב di sini menunjuk pada pembentukan seperti karya seorang perajin. “Membentuk” alami dalam bahasa Indonesia dan mempertahankan nuansa penciptaan yang disengaja.
- source_word: וַיַּעֲשׂוּנִי
  choice: dan menjadikan aku
  rationale: עשה adalah kata kerja umum untuk membuat atau menjadikan. “Menjadikan aku” membedakannya secara wajar dari “membentuk aku” sambil mempertahankan kesejajaran kedua tindakan.
- source_word: יַחַד סָבִיב
  choice: seluruh diriku dari segala sisi
  rationale: Gabungan ungkapan ini menekankan kelengkapan dan cakupan menyeluruh dari karya pembentukan Allah. Terjemahan ini lebih alami daripada susunan harfiah “bersama-sama di sekeliling” dan tidak menghilangkan gagasan spasialnya.
- source_word: וַתְּבַלְּעֵנִי
  choice: namun Engkau menelan aku
  rationale: בלע secara harfiah berarti “menelan” dan sering menjadi metafora bagi pemusnahan. Metafora yang tajam dipertahankan; “namun” menyatakan pertentangan yang jelas dalam konteks ratapan Ayub.
theological_decisions:
- issue: Bahasa antropomorfis tentang penciptaan oleh Allah
  choice: Mempertahankan ungkapan konkret “Tangan-Mu” serta dua kata kerja pembentukan.
  alternative: “Engkau menciptakan aku.”
  rationale: Ayat ini menampilkan Allah sebagai pembentuk yang bekerja secara dekat dan pribadi. Penyederhanaan menjadi kata umum “menciptakan” akan mengurangi kekuatan gambaran tersebut.
- issue: Ketegangan antara tindakan Allah membentuk dan menelan Ayub
  choice: Mempertahankan pertentangan tajam dengan “namun Engkau menelan aku.”
  alternative: “lalu Engkau membinasakan aku” atau “hanya untuk membinasakan aku.”
  rationale: Keluhan Ayub sengaja memperhadapkan pemeliharaan kreatif Allah dengan tindakan-Nya yang dirasakan menghancurkan. Terjemahan tidak menjelaskan atau menyelesaikan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda titik koma mempertahankan alur formal sekaligus menonjolkan pertentangan dalam ratapan.
