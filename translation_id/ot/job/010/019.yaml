lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: seperti orang yang
  rationale: Dalam konteks ini partikel tersebut menyatakan perbandingan dengan keadaan yang tidak nyata, bukan hubungan waktu. Ungkapan ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan sifat pengandaian.
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: Aku akan menjadi ... yang tidak pernah ada
  rationale: Urutan bentuk verba היה menggambarkan keadaan yang berlawanan dengan kenyataan atau yang diharapkan Ayub. Bentuk ini mempertahankan ketegangan antara harfiah 'aku akan menjadi' dan gagasan seolah-olah tidak pernah ada.
- source_word: מִבֶּטֶן
  choice: dari kandungan
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang perjalanan langsung sejak dalam kandungan, bukan sekadar 'sejak lahir'.
- source_word: לַקֶּבֶר
  choice: ke kubur
  rationale: קֶבֶר menunjuk pada kubur atau tempat pemakaman, bukan secara khusus dunia orang mati.
- source_word: אוּבָל
  choice: aku akan dibawa
  rationale: Bentuk Hofal dari יבל bersifat pasif-kausatif, yakni 'dibawa'. Pilihan ini tepat untuk gambaran seseorang yang langsung dibawa dari kandungan ke kubur.
