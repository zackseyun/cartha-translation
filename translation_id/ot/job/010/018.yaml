id: JOB.10.18
reference: Job 10:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: id
  text: Mengapa, kalau begitu, Engkau mengeluarkan aku dari rahim? Seharusnya aku mati, dan tidak satu mata pun pernah melihatku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan mati, dan tidak satu mata pun akan melihatku.” Bentuk-bentuk imperfek dalam bahasa Ibrani dapat diterjemahkan secara lebih formal demikian, tetapi konteks lebih mendukung makna kontrafaktual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Mengapa, kalau begitu,
  rationale: Kata tanya dengan konjungsi penghubung. Ungkapan ini menyatakan kaitan dengan keluhan sebelumnya secara wajar tanpa menghilangkan pertanyaan langsung.
- source_word: מֵרֶחֶם
  choice: dari rahim
  rationale: Mempertahankan gambaran konkret tentang kelahiran dan menyatakan asal atau tempat keluar.
- source_word: הֹצֵאתָנִי
  choice: Engkau mengeluarkan aku
  rationale: Bentuk Hifil dari יצא dengan akhiran orang pertama tunggal berarti menyebabkan aku keluar, yakni dilahirkan; huruf kapital mempertahankan sapaan langsung kepada Allah.
- source_word: אֶגְוַע
  choice: Seharusnya aku mati
  rationale: Dalam konteks ratapan ini, bentuk imperfek mengungkapkan hasil tidak nyata yang diinginkan Ayub. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kontrafaktual.
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: dan tidak satu mata pun pernah melihatku
  rationale: ‘Mata’ dipertahankan sebagai metonimia bagi orang yang melihat. ‘Pernah’ membantu menyatakan akibat kontrafaktual pada masa lampau tanpa mengganti citra Ibrani.
theological_decisions:
- issue: Nilai modal dua bentuk imperfek dalam konteks ratapan
  choice: 'Diterjemahkan sebagai keadaan lampau kontrafaktual: ‘Seharusnya aku mati ... tidak ... pernah melihatku.’'
  alternative: 'Terjemahan lebih formal: ‘Aku akan mati, dan tidak satu mata pun akan melihatku.’'
  rationale: Konteks menunjukkan keinginan Ayub bahwa ia semestinya mati sebelum terlihat, tetapi bentuk Ibraninya sendiri dapat diterjemahkan lebih formal; alternatif itu dicatat agar ambiguitas gramatikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Citra ‘rahim’ dan ‘mata’ dipertahankan; struktur dibuat alami bagi pembaca umum.
