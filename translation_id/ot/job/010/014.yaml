  naturalness: Teksnya pada dasarnya baku dan alami. “Menganggap aku tidak bersalah atas kesalahanku” merupakan ungkapan modern yang jelas dalam bahasa Indonesia dan menandai konteks yudisial lebih tepat daripada “membebaskan aku dari kesalahanku.”
