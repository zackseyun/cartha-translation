  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: id
  text: Jika aku berbuat dosa[a], Engkau mengawasi aku[b], dan Engkau tidak akan menganggap aku tidak bersalah atas kesalahanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jika aku telah berdosa”.
    reason: lexical_alternative
  - marker: b
    text: “Mengawasi” di sini berarti mengamati dengan saksama, bukan menjaga untuk melindungi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Kata ini memperkenalkan syarat. “Jika” mempertahankan sifat bersyarat dari keluhan Ayub tanpa memastikan apakah keadaan itu hanya dugaan atau berlaku secara umum.
- source_word: חָטָאתִי
  choice: aku berbuat dosa
  rationale: Bentuk perfek orang pertama tunggal dari חטא. Dalam konstruksi bersyarat bahasa Indonesia, “berbuat dosa” terdengar alami dan dapat menyatakan keadaan umum; kemungkinan nuansa perfek tetap dicatat dalam catatan kaki.
- source_word: וּשְׁמַרְתָּנִי
  choice: Engkau mengawasi aku
  rationale: Dalam konteks pemeriksaan terhadap kesalahan, שׁמר menyatakan pengamatan ketat, bukan penjagaan yang melindungi.
- source_word: וּמֵעֲוֺנִי
  choice: dari kesalahanku
  rationale: עָוֹן dapat menunjuk pada perbuatan salah, kesalahan, atau akibat hukumannya. “Kesalahan” mempertahankan dimensi moral sekaligus cocok dengan konteks yudisial.
- source_word: לֹא תְנַקֵּנִי
  choice: tidak akan membebaskan aku
  rationale: 'Bentuk piel נקה di sini paling wajar dipahami secara forensik: membebaskan atau menyatakan tidak bersalah. Pilihan ini menghindari kesan pemurnian ritual.'
theological_decisions:
- issue: Makna forensik atau pemurnian dari נקה
  choice: 'forensik/yudisial: “tidak akan membebaskan aku”'
  alternative: 'pemurnian: “tidak akan menyucikan aku”; akibat hukuman: “tidak akan membiarkan aku tanpa hukuman”'
  rationale: 'Konteks keluhan Ayub menyerupai pemeriksaan pengadilan: Allah mengawasi kesalahan dan tidak membebaskannya. Terjemahan yudisial mempertahankan tuduhan dalam teks tanpa memasukkan kategori doktrinal yang lebih kemudian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Engkau” mengikuti kebiasaan terjemahan Alkitab Indonesia ketika menyapa Allah. Susunan kalimat mempertahankan gerak bersyarat dan nuansa yudisial teks Ibrani.
