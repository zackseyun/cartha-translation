id: JOB.10.9
reference: Job 10:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זְכָר נָ֭א כִּי כַ/חֹ֣מֶר עֲשִׂיתָ֑/נִי וְֽ/אֶל עָפָ֥ר תְּשִׁיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: id
  text: Ingatlah kiranya bahwa Engkau membuat aku seperti tanah liat[a], lalu apakah Engkau akan mengembalikan aku ke debu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti tanah liat.” Ungkapan Ibrani ini menyatakan perbandingan, bukan secara eksplisit “dari tanah liat,” meskipun jelas membangkitkan gambaran penciptaan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “lalu Engkau akan mengembalikan aku ke debu.” Bentuk Ibraninya dapat dibaca sebagai pernyataan atau, dalam konteks ini, sebagai pertanyaan retoris.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר־נָא
  choice: Ingatlah kiranya
  rationale: Bentuk perintah זְכָר ditujukan langsung kepada Allah, sedangkan נָא memperhalusnya sebagai permohonan. “Ingatlah kiranya” mempertahankan seruan yang hormat tanpa memberi נָא makna waktu.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang diminta Ayub agar Allah ingat; “bahwa” merupakan penghubung yang wajar dalam bahasa Indonesia.
- source_word: כַחֹמֶר
  choice: seperti tanah liat
  rationale: Awalan כְּ menyatakan perbandingan, jadi frasa ini berarti “seperti tanah liat,” bukan secara eksplisit “dari tanah liat.” Pilihan ini mempertahankan kiasan penciptaan tanpa mempertegas asal bahan melampaui teks.
- source_word: עֲשִׂיתָנִי
  choice: Engkau membuat aku
  rationale: Kata עשה berarti luas, “membuat/mengerjakan.” “Membuat aku” akurat dan tidak menambahkan kekhususan makna seperti “membentuk” atau “menempa.”
- source_word: וְאֶל־עָפָר
  choice: lalu ... ke debu
  rationale: Preposisi אֶל menunjukkan arah atau tujuan menuju debu. “Ke debu” mempertahankan gambaran kematian dan gema kisah penciptaan; “lalu” menghubungkan tindakan penciptaan dengan kemungkinan pengembalian secara alami dalam bahasa Indonesia.
- source_word: תְּשִׁיבֵנִי
  choice: apakah Engkau akan mengembalikan aku
  rationale: Bentuk Hifil dari שוב berarti menyebabkan kembali atau mengembalikan. Dalam konteks ratapan, susunan tanya retoris menyampaikan daya protes ayat, meskipun bentuk Ibraninya sendiri tidak memakai penanda tanya eksplisit.
theological_decisions:
- issue: Apakah klausa kedua merupakan pernyataan atau pertanyaan retoris
  choice: 'Diterjemahkan sebagai pertanyaan retoris: “lalu apakah Engkau akan mengembalikan aku ke debu?”'
  alternative: 'Dapat dibaca sebagai pernyataan: “lalu Engkau akan mengembalikan aku ke debu.”'
  rationale: Teks Ibrani tidak memiliki partikel tanya eksplisit, sehingga kedua pembacaan secara gramatikal mungkin. Konteks permohonan dan protes Ayub mendukung pertanyaan retoris, tetapi catatan kaki mempertahankan ambiguitas yang asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ingatlah kiranya” mempertahankan nada permohonan yang sungguh-sungguh; kapitalisasi “Engkau” menandai sapaan langsung kepada Allah sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah unsur yang dijelaskannya.
