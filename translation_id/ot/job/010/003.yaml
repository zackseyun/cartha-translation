  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: id
  text: Apakah baik bagi-Mu bila Engkau menindas, bila Engkau menolak karya tangan-Mu, dan menyinari rencana orang-orang fasik?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menunjukkan perkenanan kepada rencana orang-orang fasik.” Kata Ibrani itu secara harfiah berkaitan dengan “bersinar” atau “menyinari” dan di sini mungkin menyatakan sikap yang menguntungkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: Apakah baik bagi-Mu
  rationale: Mempertahankan bentuk pertanyaan retoris langsung tentang apa yang baik atau patut bagi Allah, tanpa mengubahnya menjadi pertanyaan yang lebih interpretatif seperti 'Apakah Engkau berkenan'.
- source_word: תַעֲשֹׁק
  choice: Engkau menindas
  rationale: Kata kerja עָשַׁק lazim menyatakan penindasan atau pemerasan. 'Menindas' mempertahankan kerasnya tuduhan Ayub.
- source_word: תִמְאַס
  choice: Engkau menolak
  rationale: מָאַס mencakup penolakan yang dapat disertai penghinaan. Dalam hubungan dengan hasil karya tangan Allah, 'menolak' terdengar alami dan tetap mempertahankan gagasan repudiatif tanpa mempersempitnya menjadi perasaan batin semata.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: hasil karya tangan-Mu
  rationale: יְגִיעַ dapat menunjuk pada jerih payah maupun hasilnya. Dalam konteks tindakan penciptaan Allah terhadap Ayub, 'hasil karya tangan-Mu' jelas, alami, dan mempertahankan citra tangan.
- source_word: עֲצַת רְשָׁעִים
  choice: rencana orang-orang fasik
  rationale: עֵצָה dapat berarti nasihat, rencana, atau maksud. Dalam konteks ini, 'rencana' lebih alami dalam bahasa Indonesia daripada 'nasihat' dan tidak mengharuskan adanya pemberian nasihat kepada Allah.
- source_word: הוֹפָעְתָּ
  choice: menyinari
  rationale: Bentuk hifil dari יָפַע pada dasarnya berkaitan dengan bersinar atau tampil dalam kemegahan. 'Menyinari' mempertahankan metafora Ibrani, sementara makna idiomatis berupa pemberian perkenanan dicatat dalam catatan kaki.
theological_decisions:
- issue: Tuduhan antropomorfis Ayub terhadap Allah
  choice: 'Mempertahankan pertanyaan retoris Ayub yang langsung dan tajam: ''Engkau menindas'' dan ''Engkau menolak''.'
  alternative: Melunakkan menjadi 'seolah-olah Engkau menindas' atau 'tampaknya Engkau menolak'.
  rationale: Teks Ibrani menyampaikan keluhan Ayub tanpa pembatas semacam 'seolah-olah'. Terjemahan tidak boleh meredakan ketegangan teologis yang memang terdapat dalam ujaran Ayub.
- issue: Arti tindakan Allah terhadap rencana orang fasik
  choice: Mempertahankan metafora 'menyinari' dalam teks utama.
  alternative: Menerjemahkan secara idiomatis sebagai 'berkenan kepada' atau 'menunjukkan perkenanan kepada'.
  rationale: Metafora cahaya merupakan ungkapan asli teks, tetapi dalam konteks ini mungkin menyiratkan pandangan atau perlakuan yang menguntungkan. Alternatif interpretatif diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Sapaan ilahi ditandai dengan huruf kapital pada pronomina terikat. Struktur tiga tuduhan dipertahankan, dengan 'tetapi' untuk menampilkan kontras yang tersirat antara penolakan terhadap karya Allah sendiri dan perlakuan menguntungkan terhadap rencana orang fasik.
