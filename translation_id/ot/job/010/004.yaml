  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: id
  text: Apakah Engkau mempunyai mata dari daging, atau apakah Engkau melihat seperti manusia[a] melihat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani אֱנוֹשׁ menunjuk manusia secara umum dan sering mengandung nuansa kefanaan atau kelemahan.
    reason: Menjelaskan cakupan generik dan nuansa leksikal yang tidak dinyatakan secara eksplisit dalam teks utama.
lexical_decisions:
- source_word: הַעֵינֵי בָשָׂר לָךְ
  choice: Apakah Engkau mempunyai mata dari daging
  rationale: Konstruksi tanpa verba dengan לָךְ menyatakan kepunyaan, sehingga diterjemahkan secara alami dengan “mempunyai”. Ungkapan konkret “mata dari daging” mempertahankan citra antropomorfis dan kontras dengan penglihatan Allah.
- source_word: אִם
  choice: atau
  rationale: Dalam pertanyaan retoris ini, אִם memperkenalkan pilihan kedua, bukan syarat.
- source_word: כִּרְאוֹת ... תִּרְאֶה
  choice: apakah Engkau melihat seperti ... melihat
  rationale: Awalan perbandingan כ pada infinitif ראה paling alami diungkapkan sebagai “seperti ... melihat”, sambil mempertahankan pengulangan verba ‘melihat’.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Kata ini menunjuk seorang manusia secara generik dan dapat mengandung nuansa kefanaan atau kelemahan. “Manusia” mempertahankan cakupan generiknya tanpa menambahkan nuansa tersebut secara eksplisit ke dalam teks utama.
theological_decisions:
- issue: Bahasa antropomorfis tentang cara Allah melihat
  choice: Mempertahankan pertanyaan konkret tentang “mata dari daging” dan melihat seperti manusia
  alternative: Menafsirkan sebagai “Apakah Engkau menilai menurut penampilan lahiriah seperti manusia?”
  rationale: Teks Ibrani memakai citra tubuh dan penglihatan secara langsung. Mempertahankannya menjaga daya retoris serta ketegangan teks tanpa memasukkan penjelasan teologis tambahan.
- issue: Nuansa אֱנוֹשׁ sebagai manusia fana atau lemah
  choice: manusia
  alternative: manusia fana
  rationale: Nuansa kefanaan mungkin hadir, tetapi tidak perlu dibuat eksplisit dalam teks utama; catatan kaki menjaga kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina “Engkau” dan akhiran “-Mu” digunakan ketika merujuk kepada Allah. Susunan pertanyaan mempertahankan kesejajaran dan daya retoris bahasa Ibrani.
