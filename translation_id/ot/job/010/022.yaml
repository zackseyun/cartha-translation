    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: negeri
  rationale: Dalam konteks ini, kata tersebut menunjuk pada suatu ranah atau tempat yang dituju Ayub, bukan bumi secara umum; “negeri” mempertahankan citra spasialnya secara alami.
- source_word: עֵיפָתָה
  choice: yang diliputi kesuraman
  rationale: Bentuk ini menggambarkan keadaan gelap dan suram. Ungkapan ini terdengar alami dalam bahasa Indonesia dan tidak mengalihkannya kepada makna keletihan.
- source_word: כְּמוֹ אֹפֶל
  choice: seperti kelam pekat
  rationale: אֹפֶל menyatakan kegelapan yang pekat, bukan sekadar keadaan gelap. Pengulangan ungkapan yang sama pada akhir ayat dipertahankan.
- source_word: צַלְמָוֶת
  choice: bayang-bayang maut
  rationale: Pilihan ini mempertahankan kemungkinan hubungan khusus dengan maut yang sangat sesuai dengan konteks dunia orang mati dalam Ayub, sementara kemungkinan arti “kegelapan yang sangat pekat” dicatat dalam catatan kaki.
- source_word: וְלֹא סְדָרִים
  choice: tanpa tatanan
  rationale: סְדָרִים menunjuk pada keteraturan atau susunan. “Tanpa tatanan” ringkas, wajar, dan mempertahankan gambaran keadaan kacau.
- source_word: וַתֹּפַע
  choice: yang bersinar
  rationale: Kata kerja יפע berarti bersinar atau tampil terang. Terjemahan ini mempertahankan citra paradoks bahwa sinar negeri itu sendiri menyerupai kelam pekat.
theological_decisions:
- issue: Makna צַלְמָוֶת
  choice: bayang-bayang maut
  alternative: bayang-bayang yang sangat gelap / kegelapan pekat
  rationale: Bentuk Ibrani dapat dipahami sebagai bayang-bayang yang berkaitan dengan maut ataupun sebagai istilah bagi kegelapan yang amat pekat. Teks utama mempertahankan asosiasi maut yang kontekstual tanpa meniadakan alternatif leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan puitis serta pengulangan “seperti kelam pekat” dipertahankan, demikian pula paradoks bahwa negeri tersebut bersinar seperti kegelapan.
