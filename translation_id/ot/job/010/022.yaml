  text: suatu negeri yang suram, seperti kegelapan pekat—negeri bayang-bayang maut[a], tanpa tatanan; negeri itu bersinar seperti kegelapan pekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
