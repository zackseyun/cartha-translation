  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: id
  text: Namun, semua ini Kausembunyikan dalam hati-Mu[a]; aku tahu bahwa hal ini ada pada-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kausimpan dalam hati-Mu.” Kata Ibrani yang dipakai dapat berarti “menyembunyikan”, “menyimpan”, atau “menyimpan sebagai cadangan”.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “ada pada-Mu” dapat berarti “ada dalam pikiran-Mu” atau “merupakan bagian dari maksud-Mu yang tersembunyi”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Namun, hal-hal ini
  rationale: Kata penghubung וְ secara dasar berarti “dan”, tetapi dalam konteks ini menandai peralihan yang bernada kontras dari pemeliharaan Allah pada ayat sebelumnya kepada maksud-Nya yang tersembunyi. “Namun” menyampaikan nuansa itu secara wajar, sedangkan אֵלֶּה diterjemahkan “hal-hal ini”.
- source_word: צָפַנְתָּ
  choice: Kausembunyikan
  rationale: Kata kerja צפן dapat berarti menyembunyikan, menyimpan, atau menaruh sebagai cadangan. Dalam konteks maksud batin yang tidak dinyatakan, “Kausembunyikan” paling langsung dan tetap membuka kemungkinan makna lain melalui catatan kaki.
- source_word: בִלְבָבֶךָ
  choice: dalam hati-Mu
  rationale: לֵבָב menunjuk pada pusat batin, pikiran, atau kehendak. “Dalam hati-Mu” mempertahankan ungkapan antropologis Ibrani dan cocok dengan ragam bahasa Indonesia yang bermartabat.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk qatal orang pertama tunggal menyatakan pengetahuan Ayub. Dalam bahasa Indonesia, “aku tahu” lebih alami daripada bentuk lampau yang eksplisit, karena verba Indonesia tidak menandai kala dan konteks menentukan waktunya.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang diketahui Ayub, sehingga “bahwa” merupakan padanan penghubung yang paling tepat.
- source_word: זֹאת
  choice: inilah
  rationale: Demonstrativa feminin tunggal ini merujuk secara ringkas pada perkara atau maksud tersembunyi tadi. “Inilah” mempertahankan bentuk tunggal kolektif tanpa menjelaskan referennya secara berlebihan.
- source_word: עִמָּךְ
  choice: yang ada pada-Mu
  rationale: Secara harfiah עִם dengan sufiks berarti “dengan-Mu”. Ungkapan Indonesia “ada pada-Mu” mempertahankan gagasan bahwa perkara itu berada dalam kepunyaan atau maksud Allah tanpa secara pasti menyamakannya dengan pikiran atau rencana tertentu.
theological_decisions:
- issue: Hakikat maksud Allah yang tersembunyi dalam keluhan Ayub
  choice: Membiarkan referen “hal-hal ini” dan “inilah” tetap ambigu serta menyajikannya sebagai sesuatu yang Allah sembunyikan dalam hati-Nya.
  alternative: Menafsirkan ungkapan itu secara khusus sebagai rencana rahasia Allah untuk menimpakan penderitaan kepada Ayub, atau sebagai berkat-berkat pada ayat sebelumnya.
  rationale: Teks Ibrani tidak menyebut dengan tegas apa yang dimaksud oleh demonstrativa tersebut. Terjemahan ini mempertahankan ketegangan dalam tuduhan Ayub tanpa menetapkan klaim teologis yang lebih khusus daripada sumbernya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Bentuk pronominal “aku” sesuai dengan tuturan langsung Ayub, sedangkan huruf kapital pada unsur yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan metafora “hati” atau ambiguitas ungkapan penutup.
