base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: id
  text: Jika aku berbuat fasik, celakalah aku! Sekalipun aku benar, aku tidak dapat mengangkat kepalaku, sarat dengan kehinaan dan memandang kesengsaraanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan lihatlah kesengsaraanku.” Bahasa Ibrani pada bagian ini sulit secara sintaksis; sebagian orang memahaminya sebagai permohonan langsung kepada Allah, bukan sebagai kelanjutan penggambaran diri Ayub.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: Jika aku berbuat fasik
  rationale: Bentuk perfek dapat menyatakan tindakan fasik yang telah dilakukan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bobot moral רשע tanpa membatasinya pada arti forensik 'bersalah'.
- source_word: אַלְלַי לִי
  choice: celakalah aku!
  rationale: Seruan ratapan yang kuat dan wajar dalam bahasa Indonesia modern.
- source_word: וְצָדַקְתִּי
  choice: Sekalipun aku benar
  rationale: Kata penghubung dipahami secara konsesif dalam pertentangannya dengan klausa sebelumnya. 'Benar' mempertahankan kemungkinan nuansa moral maupun yudisial צדק.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: aku tidak dapat mengangkat kepalaku
  rationale: Idiom mengangkat kepala menyiratkan keyakinan atau martabat. 'Tidak dapat' menyampaikan ketidakmampuan praktis Ayub dalam konteks kehinaan.
- source_word: שְׂבַע קָלוֹן
  choice: sarat dengan kehinaan
  rationale: שְׂבַע berfungsi dengan arti 'kenyang/penuh', sedangkan קָלוֹן menunjuk pada aib atau kehinaan. 'Sarat dengan kehinaan' ringkas, alami, dan mempertahankan gambaran keadaan yang dipenuhi penghinaan.
- source_word: וּרְאֵה עָנְיִי
  choice: dan memandang kesengsaraanku
  rationale: Susunannya sulit. Terjemahan ini mempertahankan unsur melihat dan membacanya sebagai kelanjutan gambaran keadaan Ayub tanpa menutup kemungkinan bahwa bentuk tersebut merupakan seruan langsung kepada Allah.
theological_decisions:
- issue: Penafsiran וּרְאֵה עָנְיִי
  choice: 'Kelanjutan penggambaran diri Ayub: ''dan memandang kesengsaraanku'''
  alternative: 'Permohonan langsung kepada Allah: ''dan lihatlah kesengsaraanku'', atau seruan ''lihatlah kesengsaraanku'''
  rationale: Sintaks Ibraninya sulit dan memungkinkan lebih dari satu konstruksi. Teks utama mengikuti alur penggambaran keadaan Ayub, sedangkan catatan kaki mempertahankan kemungkinan sapaan langsung kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang bermartabat. 'Fasik' dipertahankan karena tepat secara moral dan lazim dalam register Alkitab, sedangkan susunan klausa dibuat cukup alami bagi pembaca umum. Penanda catatan kaki ditempatkan pada akhir bagian yang ambigu.
