id: JOB.10.12
reference: Job 10:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: id
  text: Engkau telah mengaruniakan kepadaku hidup dan kasih setia, dan perhatian-Mu[a] telah menjaga rohku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pengawasan-Mu” atau “lawatan-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “napasku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: hidup
  rationale: Walaupun bentuk Ibraninya jamak, kata ini lazim dipakai sebagai nomina abstrak yang berarti ‘hidup’; bentuk tunggal paling alami dalam bahasa Indonesia.
- source_word: וָחֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini mempertahankan unsur kasih, kebaikan, dan kesetiaan dalam חֶסֶד tanpa mempersempitnya menjadi satu pengertian doktrinal.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Engkau telah mengaruniakan kepadaku
  rationale: Secara harfiah berarti ‘Engkau telah melakukan terhadap/bersamaku’, tetapi dalam konteks pemberian hidup dan kasih setia, ungkapan benefaktif ini paling jelas dan alami.
- source_word: וּפְקֻדָּתְךָ
  choice: perhatian-Mu
  rationale: פְקֻדָּה dapat menunjuk pada pengawasan, lawatan, atau perhatian. Konteks tindakan yang menjaga mendukung arti perhatian ilahi yang terus tertuju kepada Ayub, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: שָׁמְרָה
  choice: telah menjaga
  rationale: Kata kerja שׁמר berarti menjaga, memelihara, atau melindungi. ‘Telah menjaga’ dekat dengan teks sumber dan wajar dalam bahasa Indonesia.
- source_word: רוּחִי
  choice: rohku
  rationale: רוּחַ dapat berarti roh atau napas. ‘Rohku’ mempertahankan keluasan makna utama, sedangkan ‘napasku’ dicantumkan sebagai alternatif.
theological_decisions:
- issue: Nuansa חֶסֶד ketika dikenakan kepada Allah
  choice: kasih setia
  alternative: kebaikan; belas kasihan; kesetiaan perjanjian
  rationale: ‘Kasih setia’ mempertahankan bobot relasional dan unsur kesetiaan tanpa memaksakan pengertian teknis tentang perjanjian yang tidak dinyatakan secara eksplisit dalam ayat ini.
- issue: Makna פְקֻדָּה
  choice: perhatian ilahi
  alternative: pengawasan; lawatan
  rationale: Klausa ‘telah menjaga rohku’ mendukung nuansa positif berupa perhatian yang memelihara. Karena kata Ibraninya tetap dapat berarti pengawasan atau lawatan, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai huruf kapital sesuai konvensi penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan dua tindakan Allah dalam teks Ibrani tanpa terdengar kaku.
