source:
  edition: WLC
  text: נָֽקְטָ֥ה נַפְשִׁ֗/י בְּ/חַ֫יָּ֥/י אֶֽעֶזְבָ֣ה עָלַ֣/י שִׂיחִ֑/י אֲ֝דַבְּרָה֗ בְּ/מַ֣ר נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/001.yaml
  text: My soul loathes my life[a]; I will give free course to my complaint[b]; I will speak in the bitterness of my soul.
translation:
  language: id
  text: Jiwaku muak akan hidupku[a]. Aku akan membiarkan keluh kesahku tercurah[b]; aku akan berbicara dalam kepahitan jiwaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jiwaku sangat jemu akan hidupku.” Kata kerja Ibrani ini dapat menyatakan kejenuhan yang mendalam maupun rasa muak.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Aku akan melepaskan keluh kesahku.” Ungkapan Ibrani ini berarti Ayub tidak akan lagi menahan ratapannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקְטָה
  choice: muak
  rationale: Kata kerja ini mengungkapkan kejenuhan atau rasa jijik yang sangat dalam. “Muak” mempertahankan daya emosionalnya, sementara kemungkinan makna “sangat jemu” dicatat dalam catatan kaki.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Di sini נֶפֶשׁ menunjuk pada diri batiniah Ayub. “Jiwaku” mempertahankan ungkapan Ibrani serta pengulangannya yang memberi tekanan emosional pada awal dan akhir ayat.
- source_word: בְּחַיָּי
  choice: akan hidupku
  rationale: Dengan kata kerja נקט, frasa ini menyatakan hidup Ayub sebagai sasaran rasa muaknya. “Akan hidupku” alami dalam bahasa Indonesia dan tetap dekat dengan susunan makna sumber.
- source_word: אֶעֶזְבָה
  choice: aku akan membiarkan ... tercurah
  rationale: Dalam ungkapan ini, akar עזב bukan sekadar berarti meninggalkan, melainkan membiarkan sesuatu keluar tanpa lagi dikekang. Terjemahan ini menyampaikan keputusan Ayub untuk tidak menahan keluh kesahnya.
- source_word: עָלַי
  choice: -ku dalam “keluh kesahku”
  rationale: Preposisi ini menjadi bagian dari idiom עזב עלי שיחי dan tidak perlu dipadankan secara terpisah dengan bentuk kaku seperti “atas diriku”. Hubungan dengan diri Ayub tersampaikan secara alami melalui bentuk posesif dan keseluruhan frasa.
- source_word: שִׂיחִי
  choice: keluh kesahku
  rationale: Dalam konteks ratapan Ayub, שִׂיחַ menunjuk pada tuturan penuh kesusahan atau keluhan, bukan perenungan netral. “Keluh kesah” terdengar alami dan sesuai dengan nuansa ratapan.
- source_word: אֲדַבְּרָה
  choice: aku akan berbicara
  rationale: Bentuk kohortatif menyatakan tekad Ayub. “Aku akan berbicara” menyampaikan niat tegas itu tanpa menambahkan gagasan lain.
- source_word: בְּמַר
  choice: dalam kepahitan
  rationale: Preposisi dan nomina ini menggambarkan keadaan batin atau suasana yang menyertai ucapan Ayub. “Dalam kepahitan” mempertahankan metafora sumber.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Pengulangan “jiwaku” mempertahankan kohesi leksikal dan bingkai retoris teks Ibrani.
theological_decisions: []
