  source_fidelity: 'Terjemahan secara akurat mencerminkan tiga klausa Ibrani: rasa muak/kejenuhan mendalam terhadap hidupnya, keputusan untuk tidak lagi menahan keluh kesahnya, dan tekad untuk berbicara dalam kepahitan batinnya. Pengulangan «jiwaku» mempertahankan penekanan retoris נַפְשִׁי pada awal dan akhir ayat. «Membiarkan keluh kesahku tercurah» merupakan pengungkapan Indonesia yang wajar bagi idiom עָזַב עָלַי שִׂיחִי tanpa menyempitkan maknanya secara tidak semestinya.'
