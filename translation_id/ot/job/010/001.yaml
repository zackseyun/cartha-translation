  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Susunan “jiwaku ... jiwaku” dipertahankan untuk menjaga pengulangan dan intensitas teks Ibrani, sedangkan idiom pada klausa kedua diterjemahkan secara alami agar mudah dipahami.
