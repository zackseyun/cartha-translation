base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: id
  text: Apakah hari-hari-Mu seperti hari-hari seorang manusia[a], atau tahun-tahun-Mu seperti hari-hari seorang lelaki perkasa[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani אֱנוֹשׁ dapat diterjemahkan “manusia fana”; kata ini sering menekankan kelemahan atau kefanaan manusia.
    reason: lexical_alternative
  - marker: b
    text: Ibrani גָבֶר juga dapat diterjemahkan “laki-laki” atau “orang kuat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: Apakah ... seperti hari-hari
  rationale: Partikel tanya הֲ, unsur perbandingan כ, dan bentuk konstruksi ימי membentuk pertanyaan retoris yang membandingkan rentang kehidupan; susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan gambaran 'hari-hari'.
- source_word: אֱנוֹשׁ
  choice: manusia fana
  rationale: אֱנוֹשׁ menunjuk manusia dan kerap menonjolkan kefanaan atau kelemahannya. 'Manusia fana' mempertahankan nuansa itu serta membedakannya dari גָבֶר pada baris kedua.
- source_word: יָמֶיךָ
  choice: hari-hari-Mu
  rationale: Terjemahan langsung bentuk jamak dengan sufiks orang kedua maskulin tunggal; huruf kapital menandai bahwa sapaan ditujukan kepada Allah.
- source_word: אִם
  choice: atau
  rationale: Dalam paralelisme puitis ini אִם memperkenalkan pertanyaan pembanding kedua, bukan syarat, sehingga 'atau' paling tepat.
- source_word: שְׁנוֹתֶיךָ
  choice: tahun-tahun-Mu
  rationale: Menerjemahkan bentuk jamak dengan sufiks orang kedua dan mempertahankan kesejajarannya dengan 'hari-hari-Mu'.
- source_word: כִּימֵי
  choice: seperti umur
  rationale: Secara harfiah berarti 'seperti hari-hari'; dalam baris kedua, 'umur' merupakan ungkapan Indonesia yang alami untuk jumlah hari kehidupan tanpa mengubah pokok perbandingan.
- source_word: גָבֶר
  choice: seorang lelaki perkasa
  rationale: גָבֶר dapat berarti laki-laki atau lelaki dengan nuansa kekuatan. 'Lelaki perkasa' menjaga pembedaan leksikal dari אֱנוֹשׁ tanpa mempersempit maknanya menjadi 'prajurit'.
theological_decisions:
- issue: Pertanyaan retoris tentang apakah keberadaan Allah dibatasi seperti kehidupan manusia
  choice: Mempertahankan pertanyaan langsung tanpa menambahkan jawaban atau penjelasan
  alternative: Mengungkapkannya sebagai pernyataan bahwa Allah tidak memiliki umur manusia
  rationale: Teks Ibrani menyampaikan perbandingan sebagai pertanyaan retoris dalam keluhan Ayub; bentuk itu mempertahankan ketegangan dan daya puitisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan kepada Allah memakai bentuk hormat bertanda kapital. Paralelisme 'hari-hari-Mu/tahun-tahun-Mu' dipertahankan, sementara 'umur' dipakai pada unsur pembanding kedua agar alami dalam bahasa Indonesia.
