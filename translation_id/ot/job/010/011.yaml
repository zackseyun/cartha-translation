  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: id
  text: 'Engkau membalut aku dengan kulit dan daging,

    dan menenun aku dengan tulang dan urat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melingkupi aku dengan tulang dan urat.” Kata kerja Ibrani juga dapat berarti menutupi atau melingkupi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: kulit
  rationale: Dalam konteks tubuh manusia, kata ini secara langsung menunjuk pada kulit; pilihan seperti “belulang” tidak sesuai.
- source_word: בָשָׂר
  choice: daging
  rationale: Mempertahankan gambaran konkret jaringan tubuh dan kesejajarannya dengan “kulit”.
- source_word: תַּלְבִּישֵׁנִי
  choice: Engkau mengenakan ... padaku
  rationale: Bentuk kausatif dari לבש menggambarkan Allah seolah-olah mengenakan kulit dan daging sebagai pakaian pada Ayub; ungkapan ini alami dalam bahasa Indonesia.
- source_word: בַעֲצָמוֹת
  choice: dengan tulang
  rationale: Preposisi ב dipahami secara instrumental atau asosiatif, yang paling alami diterjemahkan “dengan” dalam gambaran pembentukan tubuh.
- source_word: גִידִים
  choice: urat
  rationale: Kata ini menunjuk pada jaringan penghubung tubuh, seperti urat atau tendon. “Urat” lebih umum, ringkas, dan sesuai dengan laras puitis daripada istilah klinis “tendon” atau “ligamen”.
- source_word: תְּסֹכְכֵנִי
  choice: menjalin aku
  rationale: Dalam konteks pembentukan tubuh, pilihan ini menyampaikan penyusunan bagian-bagian tubuh menjadi satu, sambil tetap mempertahankan citra puitis. Makna leksikal lain berupa menutupi atau melingkupi dicatat dalam catatan kaki.
theological_decisions:
- issue: Gambaran antropologis tentang pembentukan manusia oleh Allah
  choice: Ayat diterjemahkan sebagai gambaran puitis bahwa Allah membentuk tubuh Ayub.
  alternative: Menerjemahkan verba kedua secara lebih harfiah sebagai “menutupi” atau “melingkupi”.
  rationale: Konteks terdekat berbicara tentang pembentukan tubuh Ayub. Terjemahan mempertahankan gambaran tersebut tanpa menambahkan kesimpulan doktrinal mengenai proses penciptaan yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. Baris kedua mempertahankan ambiguitas verba Ibrani melalui teks utama yang menekankan pembentukan dan catatan kaki yang menyajikan arti menutupi atau melingkupi.
