  - marker: b
    text: Atau “Engkau berbantah dengan aku” atau “Engkau menggugat aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Aku akan berkata
  rationale: Imperfek Qal orang pertama tunggal dapat menyatakan maksud yang akan dilakukan; konteks ini memperkenalkan perkataan Ayub kepada Allah.
- source_word: אֶל אֱלוֹהַּ
  choice: kepada Allah
  rationale: אֱלוֹהַּ adalah sebutan tunggal bagi Allah; 'Allah' merupakan padanan Indonesia yang alami dan tepat.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: Jangan nyatakan aku bersalah
  rationale: Bentuk Hifil dari רשע memiliki nuansa yudisial, yakni menyatakan seseorang bersalah; pilihan ini mempertahankan nuansa tersebut secara lebih jelas daripada sekadar 'menghukum'.
- source_word: הוֹדִיעֵנִי
  choice: beri tahu aku
  rationale: Imperatif Hifil dari ידע berarti membuat seseorang mengetahui atau memberitahukan; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: עַל מַה
  choice: atas dasar apa
  rationale: Secara harfiah menunjuk pada 'mengenai/berdasarkan apa'; dalam konteks sengketa hukum, frasa ini menanyakan alasan atau dasar perkara tanpa menghilangkan citra yudisial.
- source_word: תְּרִיבֵנִי
  choice: Engkau menggugat aku
  rationale: ריב dapat berarti berselisih, berbantah, atau mengajukan perkara. 'Menggugat' menjaga nuansa hukum yang berpasangan dengan 'menyatakan bersalah', sementara catatan kaki mempertahankan cakupan makna lainnya.
theological_decisions:
- issue: Nuansa yudisial dalam permohonan Ayub kepada Allah
  choice: '''nyatakan aku bersalah'' dan ''menggugat aku'''
  alternative: '''menganggap aku fasik'' dan ''berbantah dengan aku'''
  rationale: Bahasa Ibrani memuat gambaran pengadilan sekaligus konflik. Terjemahan utama mempertahankan tekanan yudisial tanpa mengembangkan gambaran itu menjadi doktrin penghakiman ilahi yang lebih sistematis daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang pertama 'aku' yang sesuai bagi ujaran pribadi dalam puisi Ayub. Kapitalisasi 'Engkau' dipakai sebagai gaya hormat ketika menyapa Allah. Diksi yudisial dipertahankan, tetapi alternatif yang lebih luas dicatat agar ambiguitas ריב tidak hilang.
