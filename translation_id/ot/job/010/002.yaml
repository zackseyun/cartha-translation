  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: id
  text: Aku akan berkata kepada Allah, “Jangan nyatakan aku bersalah[a]; beri tahu aku mengapa Engkau berperkara dengan aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “anggap aku fasik”; kata Ibrani ini bernuansa keputusan hukum: menyatakan seseorang bersalah.'
