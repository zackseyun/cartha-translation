  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: id
  text: Jika aku meninggikan diri[a], Engkau memburuku seperti singa dan kembali bertindak secara luar biasa terhadapku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani sulit dan eliptis; bagian pembuka ini juga dapat dipahami, “Dan ia/itu meninggi” atau “Jika aku ditinggikan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menunjukkan diri-Mu sebagai yang menakjubkan terhadapku.” Kata Ibrani ini dapat menunjuk pada tindakan yang luar biasa atau menakjubkan, di sini dalam konteks yang bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: Jika aku meninggikan diri
  rationale: Bentuk Ibrani secara harfiah adalah orang ketiga maskulin tunggal, ‘dan ia/itu meninggi’, tetapi ungkapannya eliptis. Dalam konteks keluhan Ayub, subjek orang pertama yang tersirat menghasilkan bahasa Indonesia yang wajar, sementara catatan kaki mempertahankan ketidakpastian bentuk sumber.
- source_word: כַּשַּׁחַל
  choice: seperti singa
  rationale: שַׁחַל menunjuk kepada singa, dengan kemungkinan nuansa keganasan. ‘Seperti singa’ mempertahankan perumpamaan tanpa memperinci secara berlebihan.
- source_word: תְּצוּדֵנִי
  choice: Engkau memburuku
  rationale: Kata kerja צוד menggambarkan memburu atau mengejar sebagai mangsa. Pilihan ini menyatu secara alami dengan gambaran singa.
- source_word: וְתָשֹׁב
  choice: lalu kembali
  rationale: שׁוב secara harfiah berarti ‘kembali’ dan di sini menyatakan tindakan yang dilakukan lagi. ‘Lalu kembali’ mempertahankan citra verbal sumber sekaligus menyampaikan pengulangan.
- source_word: תִּתְפַּלָּא
  choice: bertindak secara ajaib
  rationale: Bentuk hitpael dari פלא dapat berarti memperlihatkan diri sebagai ajaib atau melakukan sesuatu yang luar biasa. Ungkapan ini menjaga unsur tindakan yang menakjubkan tanpa memberinya nada positif yang tidak sesuai dengan keluhan Ayub.
- source_word: בִי
  choice: terhadapku
  rationale: Preposisi בִּ dapat berarti ‘di dalam’, ‘dengan’, atau ‘terhadap’. Dalam konteks penderitaan Ayub, ‘terhadapku’ menyampaikan arah tindakan tanpa memperkerasnya secara tidak perlu menjadi ‘melawanku’.
theological_decisions:
- issue: Makna פלא dalam konteks tindakan ilahi yang dialami sebagai permusuhan
  choice: bertindak secara ajaib terhadapku
  alternative: memperlihatkan keajaiban-Mu melawanku
  rationale: Terjemahan mempertahankan ketegangan antara tindakan Allah yang luar biasa dan pengalaman Ayub sebagai pihak yang menderita, tanpa mengubah ‘ajaib’ menjadi pujian positif ataupun sekadar memparafrasakannya sebagai serangan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan kepada Allah memakai ‘Engkau’. Struktur puitis dipertahankan dengan diksi yang mudah dipahami; ambiguitas pembuka dan nuansa tindakan ajaib dijelaskan dalam catatan kaki.
