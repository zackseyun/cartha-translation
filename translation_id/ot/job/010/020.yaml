  yaml_path: translation/ot/job/010/020.yaml
  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: id
  text: Bukankah hari-hariku sedikit saja? Berhentilah dan biarkan aku sendiri[a], agar aku sedikit terhibur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpalinglah dariku” atau “menjauhlah dariku.” Rangkaian kata Ibrani “berhenti” dan ungkapan berikutnya bersifat padat dan idiomatis; maksudnya ialah agar Allah berhenti menekan Ayub dan membiarkannya.
    reason: alternative_reading
  - marker: b
    text: Atau “agar aku sedikit lega” atau “agar semangatku pulih sedikit.” Verba Ibraninya menyiratkan kelegaan atau kecerahan semangat yang singkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris negatif yang mengharapkan persetujuan.
- source_word: מְעַט יָמַי
  choice: hari-hariku hanya sedikit
  rationale: Mencerminkan arti harfiah bahwa hari-hari Ayub sedikit, yakni masa hidupnya singkat, tanpa secara eksplisit menambahkan gagasan 'tersisa' yang tidak dinyatakan dalam teks.
- source_word: יחדל
  choice: Berhentilah
  rationale: Mewakili verba yang berarti 'berhenti' atau 'menghentikan'; subjek tersiratnya adalah Allah yang sedang disapa Ayub.
- source_word: ישית מִמֶּנִּי
  choice: biarkan aku sendiri
  rationale: Ungkapan Ibrani ini padat dan sulit. Dalam rangkaian dengan 'berhentilah', terjemahan ini secara alami menyampaikan permohonan agar Allah tidak lagi menekan atau memperhatikan Ayub.
- source_word: וְאַבְלִיגָה
  choice: supaya hatiku ... terhibur
  rationale: Verba בלג menunjuk pada sedikit kecerahan, penghiburan, atau pemulihan semangat. Penambahan 'hatiku' merupakan pengungkapan idiomatis dalam bahasa Indonesia, bukan penetapan bahwa maknanya hanya bersifat batiniah.
- source_word: מְעָט
  choice: sedikit
  rationale: Mempertahankan pemakaian adverbial yang menyatakan kecilnya kadar atau singkatnya kelegaan.
theological_decisions:
- issue: Permohonan Ayub agar Allah berhenti dan membiarkannya
  choice: Dipertahankan sebagai seruan langsung dan berani kepada Allah
  alternative: Diperhalus menjadi permohonan umum agar penderitaan berhenti
  rationale: Konteks dan bentuk orang kedua tersirat menunjukkan bahwa Ayub berbicara kepada Allah; ketegangan teologis dalam keluhannya tidak boleh dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. Susunan kalimat mempertahankan pertanyaan retoris, dua permohonan langsung, dan tujuan berupa kelegaan singkat. Tanda koma akhir dipertahankan karena ayat ini berlanjut ke ayat berikutnya.
