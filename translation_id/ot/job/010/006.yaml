  text: כִּֽי תְבַקֵּ֥שׁ לַ/עֲוֺנִ֑/י וּ֭/לְ/חַטָּאתִ֥/י תִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/006.yaml
  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: id
  text: bahwa Engkau mencari kesalahanku dan menyelidiki dosaku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab Engkau mencari kesalahanku dan menyelidiki dosaku.”
    reason: Kata Ibrani כִּי juga dapat dipahami dalam arti kausal.
lexical_decisions:
- source_word: כִּי
  choice: sehingga
  rationale: Dalam rangkaian pertanyaan retoris dari ayat sebelumnya, partikel ini paling alami dipahami sebagai pengantar isi atau akibat dari tindakan yang dipersoalkan Ayub, bukan sebagai alasan mandiri. 'Sehingga' menjaga hubungan subordinatif dalam bahasa Indonesia.
- source_word: תְבַקֵּשׁ
  choice: Engkau mencari-cari
  rationale: Bentuk piel dari בקש menyatakan pencarian aktif. 'Mencari-cari' secara alami menyiratkan upaya menemukan kesalahan dan cocok dengan nada keluhan Ayub.
- source_word: לַעֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat berarti kesalahan, kejahatan, atau kesalahan yang mendatangkan rasa bersalah/hukuman. Di sini 'kesalahan' mempertahankan arti moral tanpa menyatakan bahwa Ayub memang bersalah.
- source_word: וּלְחַטָּאתִי
  choice: dosaku
  rationale: חַטָּאת berarti dosa atau perbuatan berdosa. 'Dosa' mempertahankan istilah moral yang lazim dan membedakannya dari עָוֹן dalam baris sejajar.
- source_word: תִדְרֹשׁ
  choice: menyelidiki
  rationale: דרש dapat berarti mencari, menanyakan, atau menyelidiki. 'Menyelidiki' menyampaikan nuansa pemeriksaan yang saksama dan membentuk pasangan alami dengan 'mencari-cari'.
theological_decisions:
- issue: Penerjemahan pasangan עָוֹן dan חַטָּאת
  choice: kesalahanku ... dosaku
  alternative: kesalahanku ... pelanggaranku; kejahatanku ... dosaku
  rationale: Pilihan ini mempertahankan dua istilah moral yang berbeda dalam paralelisme, tetapi tidak menegaskan bahwa Ayub sungguh bersalah. Ucapan tersebut tetap menjadi keluhan Ayub tentang apa yang tampaknya dilakukan Allah, sehingga ketegangan teologis kitab ini tidak diselesaikan oleh terjemahan.
- issue: Hubungan כִּי dengan pertanyaan retoris sebelumnya
  choice: sehingga
  alternative: bahwa; sebab
  rationale: '''Sehingga'' menghasilkan sambungan Indonesia yang wajar dengan ayat 5 dan menyampaikan tindakan yang dipertanyakan Ayub. Namun, karena כִּי juga dapat bernilai penjelas atau kausal, alternatifnya dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kapitalisasi 'Engkau' menandai sapaan langsung kepada Allah. Pengulangan 'mencari-cari' dipilih untuk menyampaikan nuansa pemeriksaan guna menemukan kesalahan, sedangkan 'menyelidiki' menjaga variasi paralel yang alami.
