  text: הֵ֣ן קַ֭לֹּתִי מָ֣ה אֲשִׁיבֶ֑/ךָּ יָ֝דִ֗/י שַׂ֣מְתִּי לְמוֹ פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: id
  text: Sungguh, aku ini tidak berarti[a]. Apa yang dapat kujawab kepada-Mu? Aku meletakkan tanganku di atas mulutku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku ini remeh”; secara tradisional, “aku ini hina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sungguh
  rationale: Partikel ini menarik perhatian dan menandai pengakuan mendadak Ayub. “Sungguh” terdengar alami dalam bahasa Indonesia modern tanpa kesan arkais atau seolah-olah menyuruh Allah melihat.
- source_word: קַלֹּתִי
  choice: aku ini tidak berarti
  rationale: Bentuk dari קלל di sini menyatakan keadaan kecil, ringan, atau tidak diperhitungkan. Pilihan ini menyampaikan perendahan diri Ayub tanpa menambahkan gagasan kebejatan moral yang lebih kuat.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: Apa yang dapat kujawab kepada-Mu?
  rationale: מָה memperkenalkan pertanyaan retoris, sedangkan bentuk hiphil שוב dalam ungkapan ini berarti menjawab atau membalas. Kata “dapat” menyampaikan ketidakmampuan yang tersirat dalam konteks.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: Aku menaruh tanganku pada mulutku
  rationale: Terjemahan ini mempertahankan gambaran jasmani dan ungkapan sikap diam dalam bahasa Ibrani. “Pada” mencerminkan preposisi yang menyatakan penempatan tangan pada atau di atas mulut tanpa menjelaskan maknanya secara berlebihan.
theological_decisions:
- issue: Apakah penggambaran diri Ayub harus diterjemahkan dengan istilah yang bermuatan moral
  choice: aku ini tidak berarti
  alternative: aku ini hina; aku ini remeh
  rationale: Istilah Ibrani lebih langsung menyatakan kecilnya nilai atau kedudukan Ayub dalam tanggapannya di hadapan Allah. “Hina” dapat dipahami sebagai pengakuan akan kebejatan moral, sesuatu yang tidak dinyatakan secara tegas oleh kata ini; karena itu ketegangan teologis dipertahankan tanpa memperkuat pengakuan Ayub melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan pertanyaan dan gerak tangan dipertahankan dekat dengan teks Ibrani.
