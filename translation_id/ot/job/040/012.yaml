  text: רְאֵ֣ה כָל גֵּ֭אֶה הַכְנִיעֵ֑/הוּ וַ/הֲדֹ֖ךְ רְשָׁעִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: id
  text: Pandanglah setiap orang yang sombong dan rendahkanlah dia; remukkanlah orang-orang fasik di tempat mereka berada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di tempat mereka.”'
    reason: Frasa תַּחְתָּם dapat dipahami secara idiomatis sebagai tempat mereka berada atau secara lebih ringkas sebagai tempat mereka sendiri.
lexical_decisions:
- source_word: רְאֵה
  choice: Pandanglah
  rationale: Bentuk imperatif yang mengarahkan perhatian Ayub kepada orang sombong sebagai sasaran tindakan penghakiman; lebih wajar dan berwibawa daripada sekadar “lihatlah” dalam konteks ini.
- source_word: כָל גֵּאֶה
  choice: setiap orang yang sombong
  rationale: כָל dengan kata sifat yang berfungsi sebagai nomina menunjuk secara distributif kepada seluruh golongan orang sombong.
- source_word: הַכְנִיעֵהוּ
  choice: rendahkanlah dia
  rationale: Imperatif Hifil dari כנע dengan sufiks orang ketiga maskulin tunggal berarti menyebabkan orang sombong itu menjadi rendah; pilihan ini mempertahankan pertentangan antara kesombongan dan perendahan.
- source_word: וַהֲדֹךְ
  choice: remukkanlah
  rationale: Imperatif ini menyatakan tindakan keras dan tuntas untuk menaklukkan atau menghancurkan; “remukkanlah” mempertahankan daya ungkap penghakiman tanpa mempersempitnya menjadi satu gerakan fisik tertentu.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak ini menunjuk kepada suatu golongan moral, yakni mereka yang berlaku jahat; “orang-orang fasik” merupakan padanan baku dan bermartabat dalam bahasa Indonesia Alkitabiah modern.
- source_word: תַּחְתָּם
  choice: di tempat mereka berada
  rationale: תחת dengan sufiks jamak dapat secara idiomatis menunjuk kepada tempat mereka sendiri, yakni tempat mereka berada; catatan kaki mempertahankan alternatif yang lebih ringkas dan dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Sifat perintah kepada Ayub
  choice: Mempertahankan bentuk-bentuk imperatif sebagai tantangan ilahi yang menyebut tindakan penghakiman.
  alternative: Mengubahnya menjadi kalimat pengandaian yang secara eksplisit menyatakan ketidakmampuan Ayub, atau membacanya sebagai pemberian wewenang nyata kepada Ayub untuk menghakimi.
  rationale: Dalam konteksnya, Allah menantang Ayub dengan tindakan-tindakan yang berkaitan dengan pemerintahan dan penghakiman ilahi. Terjemahan mempertahankan daya perintah tanpa menambahkan kesimpulan doktrinal tentang apakah Ayub diberi wewenang tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan berwibawa. Paralelisme kedua klausa dipertahankan dengan dua imperatif langsung; pronomina tunggal “dia” mengikuti bentuk Ibrani yang merujuk secara distributif kepada “setiap orang”.
