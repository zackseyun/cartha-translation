  text: הִנֵּה נָ֣א בְ֭הֵמוֹת אֲשֶׁר עָשִׂ֣יתִי עִמָּ֑/ךְ חָ֝צִ֗יר כַּ/בָּקָ֥ר יֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/015.yaml
  text: Look now at Behemoth[a], which I made along with you; he eats grass like an ox.
translation:
  language: id
  text: Lihatlah sekarang Behemot[a], yang Kubuat bersamamu; ia makan rumput seperti lembu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "binatang besar"; banyak penafsir memahami "Behemot" sebagai nama atau sebutan bagi suatu makhluk besar tertentu, sedangkan yang lain mengidentifikasikannya sebagai kuda nil atau hewan besar lainnya.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah sekarang
  rationale: Gabungan partikel ini mengarahkan perhatian dengan nuansa segera; ungkapan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan daya imperatifnya.
- source_word: בְהֵמוֹת
  choice: Behemot
  rationale: Dalam konteks Ayub 40, bentuk ini berfungsi sebagai sebutan bagi makhluk tertentu. Transliterasi mempertahankan kekuatan sastranya tanpa memaksakan identifikasi zoologis.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: yang Kubuat
  rationale: Klausa relatif dengan verba עשה menyatakan tindakan membuat atau menciptakan secara lugas. Kapitalisasi pronomina mengikuti kebiasaan ejaan Alkitab bahasa Indonesia untuk ujaran Allah.
- source_word: עִמָּךְ
  choice: bersamamu
  rationale: 'Preposisi עם paling wajar menyatakan kebersamaan dalam tindakan penciptaan: Allah membuat Behemot sebagaimana Ia membuat Ayub, bukan terutama kedekatan tempat.'
- source_word: חָצִיר
  choice: rumput
  rationale: Kata ini menunjuk pada rumput atau tumbuh-tumbuhan hijau; 'rumput' merupakan padanan yang paling jelas dan alami.
- source_word: כַבָּקָר
  choice: seperti lembu
  rationale: בקר dapat bersifat kolektif bagi ternak besar, tetapi dalam perbandingan ini 'lembu' memberi gambaran konkret tanpa mempersempitnya menjadi lembu jantan.
- source_word: יֹאכֵל
  choice: ia makan
  rationale: Verba maskulin tunggal merujuk kembali kepada Behemot. Pronomina 'ia' wajar bagi makhluk hidup dalam bahasa Indonesia dan tidak menambahkan personifikasi yang berlebihan.
theological_decisions:
- issue: Identifikasi בְהֵמוֹת
  choice: Mempertahankan 'Behemot' sebagai nama atau sebutan bagi suatu makhluk tertentu.
  alternative: Menerjemahkannya secara umum sebagai 'binatang besar' atau mengidentifikasikannya secara khusus sebagai kuda nil maupun hewan besar lain.
  rationale: Bentuk Ibrani dan konteks puisi mendukung pemeliharaan sebutan tersebut, sedangkan identitas zoologisnya tidak dinyatakan secara pasti. Pilihan ini menjaga ambiguitas asli dan menghindari kesimpulan tafsir yang terlalu dini.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat mempertahankan seruan pembuka, klausa penciptaan, dan perbandingan puitis teks Ibrani tanpa terasa kaku.
