  yaml_path: translation/ot/job/040/005.yaml
  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: id
  text: Aku telah berbicara sekali[a], dan aku tidak akan menjawab; dua kali, dan aku tidak akan menambahkan apa-apa lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah berbicara sekali, tetapi aku tidak akan menjawab; dua kali, tetapi aku tidak akan melanjutkan lagi.” Ungkapan Ibrani yang secara harfiah berarti “menambahkan” dapat berarti melanjutkan atau mengulangi suatu tindakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: sekali
  rationale: Bilangan feminin 'satu' dipakai secara adverbial bersama verba 'aku telah berbicara', sehingga secara idiomatis berarti 'sekali'.
- source_word: דִּבַּרְתִּי
  choice: Aku telah berbicara
  rationale: Bentuk perfektif orang pertama tunggal menunjuk pada perkataan Ayub yang sudah diucapkan dan masih relevan dalam tanggapannya kepada TUHAN.
- source_word: וְלֹא אֶעֱנֶה
  choice: dan aku tidak akan menjawab
  rationale: Verba ענה dalam qal berarti 'menjawab'. Konjungsi diterjemahkan secara langsung sebagai 'dan' agar hubungan koordinatif bahasa Ibrani tidak ditafsirkan secara berlebihan.
- source_word: וּשְׁתַּיִם
  choice: dua kali
  rationale: Bilangan 'dua' digunakan secara adverbial, sejajar dengan 'sekali', dan dalam bahasa Indonesia wajar diterjemahkan 'dua kali'.
- source_word: וְלֹא אוֹסִיף
  choice: dan aku tidak akan menambahkan apa-apa lagi
  rationale: Verba יסף dalam hifil dapat berarti 'menambahkan', 'melanjutkan', atau 'mengulangi'. Pilihan ini mempertahankan metafora Ibrani tentang menambahkan perkataan sekaligus menyampaikan bahwa Ayub tidak akan berbicara lebih lanjut.
theological_decisions: []
