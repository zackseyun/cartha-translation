  terminology: Pemakaian “Aku” sesuai dengan suara langsung Ayub dan tidak menambahkan nuansa teologis atau denominasi. Catatan kaki secara memadai menjelaskan alternatif konjungsi serta cakupan makna יסף (“menambahkan,” “melanjutkan,” atau “mengulangi”).
