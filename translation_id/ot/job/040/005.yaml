  source_fidelity: 'Terjemahan secara setia mencerminkan struktur dan makna Ibrani: אַחַת dan שְׁתַּיִם diterjemahkan secara adverbial sebagai “sekali” dan “dua kali”; bentuk perfektif דִּבַּרְתִּי tersampaikan dengan tepat melalui “telah berbicara”; dan kedua bentuk imperfek menyatakan tekad untuk tidak lagi menjawab atau menambahkan. “Menambahkan apa-apa lagi” mempertahankan metafora יסף tanpa memaksakan satu penafsiran sempit seperti “berbicara lagi.”'
