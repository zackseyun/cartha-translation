  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: id
  text: Sebab gunung-gunung menghasilkan makanan baginya[a], dan segala binatang liar di padang bermain di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gunung-gunung memberikan hasil bumi baginya.”
