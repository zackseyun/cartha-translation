  text: הַ֭/אַף תָּפֵ֣ר מִשְׁפָּטִ֑/י תַּ֝רְשִׁיעֵ֗/נִי לְמַ֣עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: id
  text: Apakah engkau bahkan hendak membatalkan keadilan-Ku?[a] Apakah engkau hendak menyatakan Aku bersalah supaya engkau dinyatakan benar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keputusan-Ku” atau “penghakiman-Ku.” Kata Ibrani mishpati dapat berarti keadilan, keputusan hukum, penghakiman, atau hak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: Apakah engkau bahkan hendak
  rationale: Gabungan partikel tanya dan אַף memberi penekanan yang bernada heran atau menggugat. Bentuk ini mempertahankan daya retorisnya dalam bahasa Indonesia modern.
- source_word: תָּפֵר
  choice: membatalkan
  rationale: Bentuk Hifil dari פרר berarti meniadakan, menggagalkan, atau membuat tidak berlaku. 'Membatalkan' alami dalam konteks hukum dan tetap menyampaikan tindakan meniadakan keabsahan.
- source_word: מִשְׁפָּטִי
  choice: keadilan-Ku
  rationale: מִשְׁפָּט dapat menunjuk pada keadilan, keputusan hukum, atau hak. Dalam konteks ini, 'keadilan-Ku' paling baik mengungkapkan pemerintahan dan penilaian Allah yang adil, sementara alternatif yang sah dicatat dalam catatan kaki.
- source_word: תַּרְשִׁיעֵנִי
  choice: menyatakan Aku bersalah
  rationale: 'Hifil dari רשע bersifat forensik: menyatakan seseorang bersalah atau menghukumnya. Pilihan ini memperjelas latar pengadilan dan berpasangan langsung dengan ''dinyatakan benar''.'
- source_word: לְמַעַן
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil. 'Supaya' ringkas, alami, dan mempertahankan tuduhan retoris mengenai pembenaran diri.
- source_word: תִּצְדָּק
  choice: engkau dinyatakan benar
  rationale: Dalam konteks forensik, Qal dari צדק berarti berada atau terbukti benar. Bentuk pasif bahasa Indonesia ini mempertahankan kontras yuridis dengan 'menyatakan Aku bersalah' tanpa membatasi maknanya pada kesalehan moral.
theological_decisions:
- issue: Nuansa forensik dibandingkan nuansa moral umum
  choice: 'Bahasa yuridis dipertahankan: ''membatalkan keadilan-Ku ... menyatakan Aku bersalah ... dinyatakan benar.'''
  alternative: Ungkapan moral yang lebih umum, misalnya 'menyangkal kebenaran-Ku ... menganggap Aku salah agar engkau benar.'
  rationale: Kosakata Ibrani מִשְׁפָּט, רשע, dan צדק memiliki pertalian kuat dengan ranah hukum. Pilihan yuridis mempertahankan ketegangan teologis ketika Allah menggugat upaya Ayub membenarkan dirinya dengan menyalahkan Allah.
- issue: Makna מִשְׁפָּטִי
  choice: keadilan-Ku
  alternative: keputusan-Ku; penghakiman-Ku
  rationale: '''Keadilan-Ku'' menonjolkan dimensi moral-yuridis pemerintahan Allah tanpa menyempitkannya menjadi satu putusan tertentu. Kemungkinan arti ''keputusan-Ku'' tetap dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' sesuai dengan wacana langsung bernada luhur, sedangkan kapitalisasi pada '-Ku' dan 'Aku' menandai bahwa pembicara adalah Allah. Struktur dua pertanyaan retoris dan kesejajaran istilah forensik dipertahankan.
