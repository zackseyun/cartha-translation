  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: id
  text: Maka Aku pun akan memuji engkau, sebab tangan kananmu dapat menyelamatkan dirimu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dapat mendatangkan keselamatan bagimu sendiri”; bahasa Ibrani memakai preposisi yang dapat berarti “bagimu” atau “bagi dirimu sendiri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Maka ... pun
  rationale: Gabungan ini meneruskan tantangan sebelumnya sekaligus memberi penekanan; dalam konteks bersyarat, “Maka Aku pun” alami dalam bahasa Indonesia.
- source_word: אֲנִי
  choice: Aku
  rationale: Pronomina eksplisit dipertahankan karena menegaskan bahwa Allah sendiri yang berbicara.
- source_word: אוֹדְךָ
  choice: akan memuji engkau
  rationale: Bentuk Hifil dari ידה di sini menyatakan pujian atau pengakuan; “memuji” paling sesuai dengan konsesi ilahi dalam konteks ini.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi pernyataan sebelumnya dengan gaya yang jelas dan bermartabat.
- source_word: תוֹשִׁיעַ
  choice: dapat menyelamatkan
  rationale: Hifil dari ישׁע berarti menyelamatkan atau melepaskan. Konteks tantangan menyoroti kemampuan yang harus dibuktikan, sehingga “dapat” lebih tepat daripada prediksi sederhana “akan”.
- source_word: לְךָ
  choice: dirimu
  rationale: Preposisi לְ menyatakan keuntungan atau kepentingan, yaitu “bagi dirimu sendiri”; “menyelamatkan dirimu” mengungkapkan objek secara alami, sementara nuansa preposisional dicatat dalam catatan kaki.
- source_word: יְמִינְךָ
  choice: tangan kananmu
  rationale: Gambaran konkret Ibrani dipertahankan; tangan kanan melambangkan kekuatan, tetapi metafora itu tidak dijabarkan di dalam teks utama.
theological_decisions:
- issue: Ungkapan antropomorfis tentang kuasa
  choice: tangan kananmu dapat menyelamatkan dirimu
  alternative: kekuatanmu sendiri dapat menyelamatkan dirimu
  rationale: Teks Ibrani memakai gambaran konkret “tangan kanan”. Terjemahan mempertahankan metafora dan tidak menggantinya dengan tafsiran abstrak.
- issue: Nuansa keselamatan bagi diri sendiri
  choice: menyelamatkan dirimu
  alternative: mendatangkan keselamatan bagimu sendiri
  rationale: Konstruksi לְךָ mempertahankan gagasan keuntungan bagi subjek. Pilihan utama alami dalam bahasa Indonesia tanpa menghilangkan nuansa refleksif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Aku” mengikuti rujukan kepada Allah. Susunan “Maka Aku pun” menjaga kesinambungan dan penekanan, sedangkan metafora “tangan kanan” dipertahankan.
