  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: id
  text: 'Kemudian Yahweh menjawab Ayub dari dalam badai[a] dan berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari dalam angin puyuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Kemudian ... menjawab
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “kemudian” menyatakan perkembangan peristiwa secara alami, sedangkan ענה dalam konteks ini berarti menjawab atau menanggapi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶת אִיּוֹב
  choice: Ayub
  rationale: Penanda objek langsung אֶת menunjukkan bahwa Ayub adalah orang yang dijawab; konstruksi “menjawab Ayub” wajar dalam bahasa Indonesia.
- source_word: מִן סְעָרָה
  choice: dari dalam badai
  rationale: סְעָרָה dapat berarti badai, angin ribut, atau angin puyuh. “Dari dalam badai” jelas dan alami serta menggambarkan Yahweh berbicara dari tengah fenomena badai tanpa mempersempit citranya.
- source_word: וַיֹּאמַר
  choice: 'dan berkata:'
  rationale: Ungkapan naratif baku ini memperkenalkan perkataan langsung yang dimulai pada ayat berikutnya; tanda titik dua menandai kelanjutan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan urutan naratif Ibrani, sementara “dari dalam badai” dipilih agar alami dan mudah dipahami. Penanda catatan kaki [a] ditempatkan setelah tanda titik dua karena catatan menjelaskan frasa dalam keseluruhan klausa.
