base_translation:
  language: en
  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: id
  text: Dapatkah engkau menarik Lewiatan dengan kail,[a] atau menekan lidahnya dengan tali?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menarik Lewiatan dengan sebuah kait.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menenggelamkan lidahnya dengan tali” atau “menahan lidahnya dengan tali.” Gambaran dalam bahasa Ibrani sulit dipastikan dan mungkin menunjuk pada tindakan menundukkan makhluk itu melalui mulutnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: menarik
  rationale: Bentuk Qal imperfek orang kedua tunggal maskulin dari משׁך menyatakan tindakan menarik; dalam gambaran penangkapan dengan kail, 'menarik' wajar dan tidak menentukan secara berlebihan apakah makhluk itu ditarik keluar atau mendekat.
- source_word: לִוְיָתָן
  choice: Lewiatan
  rationale: Nama atau sebutan makhluk ini ditransliterasikan dengan bentuk Indonesia yang lazim, tanpa kata sandang karena teks Ibrani juga tidak memakainya.
- source_word: בְּחַכָּה
  choice: dengan kail
  rationale: חכה menunjuk pada kail untuk menangkap ikan. 'Kail' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: וּבְחֶבֶל
  choice: dengan tali
  rationale: חבל berarti tali atau tambang. 'Tali' mempertahankan keluasan makna istilah Ibrani dan terdengar alami dalam konteks ini.
- source_word: תַּשְׁקִיעַ
  choice: menekan
  rationale: Bentuk Hifil dari שׁקע secara harfiah berarti menyebabkan turun atau tenggelam. Dalam kaitannya dengan lidah dan tali, 'menekan' mempertahankan gambaran penundukan tanpa menetapkan teknik penangkapan yang tidak dijelaskan.
- source_word: לְשֹׁנוֹ
  choice: lidahnya
  rationale: Teks Ibrani secara eksplisit menyebut 'lidahnya'; terjemahan ini mempertahankan rincian konkret tersebut, bukan menggantinya dengan 'mulutnya'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Kata ganti 'engkau' dipakai untuk sapaan tunggal dalam wacana ilahi kepada Ayub. Susunan pertanyaan retoris dan gambaran konkret teks Ibrani dipertahankan.
