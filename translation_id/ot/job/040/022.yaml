  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: id
  text: Pohon-pohon teratai[a] menaunginya; pohon-pohon dedalu[b] di tepi sungai mengelilinginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon-pohon peneduh”; jenis tumbuhan yang dimaksud oleh צֶאֱלִים tidak diketahui secara pasti, meskipun “pohon teratai” merupakan terjemahan tradisional.
    reason: lexical_alternative
  - marker: b
    text: Atau “pohon-pohon poplar di wadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: menaunginya
  rationale: Bentuk dari סכך menyatakan tindakan menutupi atau melindungi; dalam konteks pepohonan dan צל, “menaungi” paling alami sekaligus mempertahankan gambaran perlindungan oleh teduhnya daun.
- source_word: צֶאֱלִים
  choice: pohon-pohon teratai
  rationale: Identifikasi tradisionalnya ialah pohon teratai, tetapi jenis tumbuhan yang tepat tidak pasti; ketidakpastian ini dicatat dalam catatan kaki.
- source_word: צִלֲלוֹ
  choice: dengan bayang-bayangnya
  rationale: צֵל berarti bayang-bayang atau keteduhan. Pilihan ini mempertahankan citra konkret teks Ibrani dan cocok dengan verba “menaungi”.
- source_word: יְסֻבּוּהוּ
  choice: mengelilinginya
  rationale: סבב berarti mengelilingi atau mengepung; “mengelilinginya” merupakan padanan langsung dan alami tanpa nuansa permusuhan.
- source_word: עַרְבֵי נָחַל
  choice: pohon-pohon dedalu di tepi sungai
  rationale: עַרְבֵי dapat menunjuk dedalu atau pohon sejenis poplar yang hidup dekat air, sedangkan נַחַל dapat berarti sungai, aliran air, atau wadi. Terjemahan utama memakai ungkapan Indonesia yang jelas, sementara alternatif botani dan geografis dicatat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Paralelisme dua baris Ibrani dipertahankan melalui verba “menaunginya” dan “mengelilinginya”; istilah botani yang tidak pasti tidak dibuat seolah-olah pasti dan dijelaskan lewat catatan kaki.
