  yaml_path: translation/ot/job/040/013.yaml
  text: Hide them together in the dust[b][a]; bind their faces in the hidden place.
translation:
  language: id
  text: Sembunyikanlah[a] mereka bersama-sama dalam debu; ikatlah wajah mereka di tempat tersembunyi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kuburkanlah mereka bersama-sama dalam debu.” Kata kerja Ibrani dapat berarti “menyembunyikan” dan dalam konteks ini mungkin menyiratkan penguburan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam persembunyian”. Frasa Ibrani terakhir sulit dipastikan; kemungkinan menunjuk pada tempat tersembunyi dan menggemakan kata “sembunyikanlah” pada awal ayat.
    reason: alternative_reading
lexical_decisions:
- source_word: טָמְנֵם
  choice: Sembunyikanlah mereka
  rationale: Kata טמן pada dasarnya berarti “menyembunyikan”; bentuk ini juga memuat akhiran objek jamak “mereka”. Dalam konteks debu, penguburan mungkin tersirat, tetapi tidak dimasukkan secara tegas ke dalam teks utama.
- source_word: בֶּעָפָר
  choice: dalam debu
  rationale: עָפָר berarti debu atau tanah gembur. “Debu” mempertahankan citra puitis serta kaitannya dengan kefanaan.
- source_word: יָחַד
  choice: bersama-sama
  rationale: Adverbia ini menunjukkan tindakan kolektif; “bersama-sama” jelas dan alami dalam bahasa Indonesia.
- source_word: פְּנֵיהֶם
  choice: wajah mereka
  rationale: Terjemahan konkret dari bentuk harfiah “wajah-wajah mereka”; bahasa Indonesia lazim memakai nomina tunggal distributif setelah kata ganti jamak.
- source_word: חֲבֹשׁ
  choice: belenggulah
  rationale: חבשׁ berarti mengikat atau membelenggu. “Belenggulah” mempertahankan gambaran pengekangan dan cocok dengan nada perintah puitis.
- source_word: בַּטָּמוּן
  choice: di tempat tersembunyi
  rationale: Kemungkinan merupakan bentuk yang disubstantifkan dari akar טמן, yaitu “yang tersembunyi” atau “tempat tersembunyi”. Pilihan ini mempertahankan gema dengan kata pembuka “sembunyikanlah” tanpa menafsirkannya sebagai kegelapan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Bentuk perintah dengan -lah mempertahankan nada ilahi yang tegas dan bermartabat. Susunan citra konkret dipertahankan, sementara ambiguitas mengenai penguburan dan frasa terakhir dijelaskan dalam catatan kaki.
