  text: Will you play with him like a bird[b][a], or tie him up for your girls?
translation:
  language: id
  text: Apakah engkau akan bermain dengannya seperti dengan seekor burung, atau mengikatnya untuk gadis-gadismu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: akan bermain
  rationale: Bentuk Qal dari שׂחק dapat berarti bermain atau bersenang-senang; 'bermain' alami dalam bahasa Indonesia dan sesuai dengan gambaran memperlakukan Lewiatan sebagai hewan jinak.
- source_word: בּוֹ
  choice: dengannya
  rationale: Pronomina berakhiran maskulin tunggal merujuk kepada Lewiatan; 'dengannya' mempertahankan rujukan persona gramatikal tanpa terdengar tidak wajar.
- source_word: כַּצִּפּוֹר
  choice: seperti dengan burung
  rationale: 'צִפּוֹר berarti burung; penambahan ''dengan'' menghasilkan konstruksi Indonesia yang jelas: bermain dengannya sebagaimana orang bermain dengan seekor burung.'
- source_word: וְתִקְשְׁרֶנּוּ
  choice: atau mengikatnya
  rationale: קשר berarti mengikat atau menambatkan. 'Mengikatnya' ringkas, jelas, dan mempertahankan citra pengekangan hewan.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: untuk gadis-gadismu
  rationale: נַעֲרוֹת menunjuk kepada anak-anak perempuan atau perempuan muda. 'Gadis-gadismu' mempertahankan bentuk feminin dan cukup luas untuk ambiguitas usia dalam istilah Ibrani.
