  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: id
  text: Ia mengeraskan ekornya seperti pohon aras; urat-urat di pangkal pahanya[a] terjalin erat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “urat-urat pinggangnya”; mungkin lebih khusus, “urat-urat alat kelaminnya”. Arti istilah Ibraninya tidak pasti dan diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: mengeraskan
  rationale: Dalam konteks ekor yang dibandingkan dengan pohon aras, verba ini paling wajar dipahami sebagai tindakan fisik yang membuatnya kaku atau tegang. Pilihan ini mempertahankan gambaran kekuatan tanpa memasukkan makna umum ‘menyukai’ yang tidak cocok di sini.
- source_word: זְנָבוֹ
  choice: ekornya
  rationale: Padanan langsung untuk nomina ‘ekor’ dengan sufiks orang ketiga tunggal maskulin.
- source_word: כְמוֹ אָרֶז
  choice: seperti pohon aras
  rationale: Mempertahankan perbandingan langsung dengan aras, lambang ukuran dan kekokohan dalam gambaran puitis ini.
- source_word: גִּידֵי
  choice: urat-urat
  rationale: Dalam bahasa Indonesia umum, ‘urat-urat’ secara alami dapat menunjuk tendon atau jaringan kuat pada tubuh dan tetap mempertahankan citra jasmani teks.
- source_word: פחדו
  choice: pangkal pahanya
  rationale: Istilah Ibrani ini tidak pasti. ‘Pangkal paha’ mempertahankan lokasi umum di bagian bawah tubuh tanpa menutup kemungkinan bahwa istilah tersebut mengacu lebih khusus pada pinggang atau alat kelamin.
- source_word: יְשֹׂרָגוּ
  choice: terjalin erat
  rationale: Verba ini menggambarkan sesuatu yang saling berjalin atau berpilin. ‘Terjalin erat’ alami dalam bahasa Indonesia dan menyampaikan kekokohan jaringan urat.
