  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: id
  text: Apakah orang yang berbantah dengan Yang Mahakuasa akan mengoreksi Dia? Hendaklah orang yang berdebat dengan Allah menjawabnya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah orang yang mencari-cari kesalahan pada Yang Mahakuasa akan mengajar atau menegur Dia?” Bahasa Ibrani memadukan bahasa persengketaan dengan bahasa koreksi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menjawab perkara ini” atau “menjawab Dia.” Rujukan akhiran dalam bahasa Ibrani ringkas dan dapat menunjuk pada perkara yang diajukan, bukan secara langsung kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: Apakah orang yang berbantah
  rationale: Berasal dari ריב, yang berarti berbantah atau bersengketa. Bentuk ini menyampaikan nuansa perselisihan hukum sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: עִם
  choice: dengan
  rationale: Arti dasarnya ialah 'dengan'; dalam konteks persengketaan, kata ini juga menyiratkan perlawanan tanpa perlu diterjemahkan secara eksplisit sebagai 'melawan'.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan baku dan bermakna bagi gelar ilahi שדי dalam bahasa Indonesia.
- source_word: יִסּוֹר
  choice: akan mengoreksi Dia
  rationale: Kata dari akar יסר dapat berarti mendidik, menegur, atau mengoreksi. Dalam susunan dan paralelisme ayat ini, manusia yang berbantah menjadi subjek yang lancang hendak mengoreksi Yang Mahakuasa.
- source_word: מוֹכִיחַ
  choice: orang yang berdebat
  rationale: Berasal dari יכח, yang dapat menunjuk pada berdebat, menegur, atau mengajukan perkara. 'Berdebat' mempertahankan nuansa persengketaan dalam bahasa yang mudah dipahami.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal puitis bagi Allah ini tidak menuntut tambahan penekanan atau gelar.
- source_word: יַעֲנֶנָּה
  choice: menjawabnya
  rationale: Akhiran feminin tunggal kemungkinan menunjuk kepada perkara atau teguran yang baru diajukan. Bentuk '-nya' mempertahankan kepadatan dan ambiguitas rujukannya dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah ayat ini menggambarkan manusia mengoreksi Allah atau manusia menerima koreksi dari Allah
  choice: Pertanyaan retoris ini menggambarkan orang yang berbantah sebagai pihak yang lancang hendak mengoreksi Yang Mahakuasa.
  alternative: Orang yang berbantah dengan Yang Mahakuasa hendaknya menerima koreksi.
  rationale: Sintaksis dan paralelisme lebih mendukung orang yang berbantah sebagai subjek יִסּוֹר. Larik kedua meneguhkannya dengan menantang orang yang berdebat dengan Allah untuk menjawab.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. 'Berbantah' dan 'berdebat' mempertahankan corak persengketaan hukum, sedangkan pronomina hormat 'Dia' dipakai untuk rujukan langsung kepada Allah. Semua penanda catatan kaki dicantumkan dalam teks utama.
