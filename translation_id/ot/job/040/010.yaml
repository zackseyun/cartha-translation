  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֲדֵ֥ה נָ֣א גָֽא֣וֹן וָ/גֹ֑בַהּ וְ/ה֖וֹד וְ/הָדָ֣ר תִּלְבָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: id
  text: Hiasilah dirimu[a] dengan keagungan dan keluhuran; kenakanlah kemegahan dan kehormatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kenakanlah sekarang kebanggaan dan martabat; berbusanalah dengan kemuliaan dan keagungan.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa נָא berarti 'sekarang' serta rentang makna גָאוֹן, גֹבַהּ, הוֹד, dan הָדָר yang saling bertumpang tindih.
lexical_decisions:
- source_word: עֲדֵה
  choice: Hiasilah dirimu
  rationale: Bentuk perintah orang kedua tunggal maskulin dari עדה menyatakan tindakan mengenakan perhiasan atau menghiasi diri; pilihan ini alami dalam bahasa Indonesia dan sejalan dengan metafora mengenakan pakaian pada bagian kedua.
- source_word: נָא
  choice: -lah
  rationale: Partikel ini memberi nuansa desakan atau permintaan. Dalam konteks tantangan retoris Allah kepada Ayub, sufiks imperatif -lah menyampaikan dorongan itu secara alami tanpa memberi kesan permohonan sopan yang terlalu lunak.
- source_word: גָאוֹן
  choice: keagungan
  rationale: Dalam konteks kebesaran dan kewibawaan ilahi, kata ini menunjuk pada kemuliaan atau keagungan yang luhur, bukan terutama kesombongan moral.
- source_word: גֹבַהּ
  choice: keluhuran
  rationale: Secara harfiah berarti ketinggian, tetapi dalam pasangan puitis ini menggambarkan kedudukan yang luhur. 'Keluhuran' mempertahankan citra ketinggian tanpa memaksakan nuansa negatif.
- source_word: הוֹד
  choice: kemegahan
  rationale: Kata ini menunjuk pada keindahan atau kebesaran yang tampak dan berwibawa. 'Kemegahan' membedakannya dari גָאוֹן sambil mempertahankan rangkaian istilah kebesaran kerajaan.
- source_word: הָדָר
  choice: kehormatan
  rationale: Kata ini dapat menyatakan kehormatan, semarak, atau kemuliaan yang berwibawa. 'Kehormatan' memberikan nuansa tersendiri di samping 'kemegahan'.
- source_word: תִּלְבָּשׁ
  choice: kenakanlah
  rationale: Bentuk ini meneruskan daya imperatif dan secara eksplisit mempertahankan metafora pakaian; 'kenakanlah' wajar dan puitis dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah גָאוֹן dan גֹבַהּ harus diberi konotasi moral negatif atau dipahami sebagai kebesaran yang agung
  choice: Pasangan kata itu diterjemahkan sebagai 'keagungan dan keluhuran'.
  alternative: '''Kesombongan dan keangkuhan'' atau padanan negatif lainnya.'
  rationale: Dalam konteks tantangan Allah agar Ayub memperlihatkan kewibawaan dan kuasa yang setara dengan milik Allah, gambaran berpakaian serta kesejajarannya dengan הוֹד dan הָדָר lebih mendukung kebesaran yang agung daripada sifat buruk moral.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Paralelisme dua bagian serta metafora menghiasi dan mengenakan dipertahankan. Sufiks -lah mewakili daya desakan נָא secara idiomatis.
