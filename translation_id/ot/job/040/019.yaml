base_translation:
  language: en
  yaml_path: translation/ot/job/040/019.yaml
  text: He is the first of the works of God[b][a]; only his Maker can bring near his sword.
translation:
  language: id
  text: Ia adalah yang pertama di antara karya-karya Allah[a]; biarlah Dia yang membuatnya mendekatkan pedang-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia adalah yang utama di antara jalan-jalan Allah.”
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir dalam bahasa Ibrani sulit dipahami. Klausa itu dapat berarti, “Hanya Dia yang membuatnya dapat menghampirinya dengan pedang,” atau, “Dia yang membuatnya memperlengkapinya dengan pedang.”
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: yang pertama
  rationale: Ungkapan ini mempertahankan bentuk ringkas bahasa Ibrani dan dapat menunjuk pada urutan maupun kedudukan utama; alternatif 'yang terutama' dicatat dalam catatan kaki.
- source_word: דַּרְכֵי אֵל
  choice: di antara karya-karya Allah
  rationale: Dalam konteks penciptaan, דֶּרֶךְ dapat menunjuk pada kegiatan atau perbuatan Allah. 'Karya-karya Allah' menyampaikan maksud tersebut dengan jelas dalam bahasa Indonesia modern tanpa mengubahnya menjadi istilah doktrinal.
- source_word: אֵל
  choice: Allah
  rationale: אֵל merupakan sebutan umum bagi Allah dalam konteks ini dan secara wajar diterjemahkan 'Allah'.
- source_word: הָעֹשׂוֹ
  choice: Pembuatnya
  rationale: Partisip berartikel dengan sufiks pronominal berarti 'dia yang membuatnya'. 'Pembuatnya' ringkas, wajar, dan mempertahankan hubungan langsung dengan makhluk yang sedang dibicarakan.
- source_word: יַגֵּשׁ
  choice: dapat mendekatkan
  rationale: Bentuk Hifil dari נגשׁ pada dasarnya berarti 'membawa atau membuat mendekat'. Kata 'dapat' mencerminkan pembacaan kontekstual bahwa hanya Pembuatnya yang sanggup melakukan tindakan ini, sedangkan kesulitan klausa dijelaskan dalam catatan kaki.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: Sufiks orang ketiga maskulin tunggal diterjemahkan secara langsung sebagai '-nya'. Bentuk Indonesia ini tidak secara berlebihan menetapkan apakah pedang itu milik Pembuat atau berkaitan dengan makhluk tersebut.
theological_decisions:
- issue: Penafsiran klausa terakhir yang sintaksisnya sulit
  choice: Pembuatnya sajalah yang dapat mendekatkan pedangnya
  alternative: Pembuatnya mendekatkan pedang kepadanya; atau Pembuatnya memperlengkapinya dengan pedang
  rationale: Bahasa Ibrani sangat padat dan memungkinkan beberapa hubungan sintaksis. Terjemahan utama mengikuti pembacaan bahwa hanya Sang Pembuat dapat menghadapi makhluk itu dengan pedang, tetapi catatan kaki mempertahankan alternatif-alternatif penting tanpa menetapkan tafsiran teologis secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Pembuatnya sajalah' menandai pembatasan secara alami, sedangkan 'pedangnya' dan catatan kaki mempertahankan ketaksaan klausa Ibrani.
