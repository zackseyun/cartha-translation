  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: id
  text: Curahkanlah murka-Mu yang meluap-luap[a]; pandanglah setiap orang yang sombong dan rendahkanlah dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hamburkanlah luapan-luapan murka-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai objek tunggal pada “rendahkanlah dia”, sehingga setiap orang sombong diperlakukan satu per satu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: Lepaskanlah
  rationale: Bentuk perintah ini menyatakan tindakan mengirimkan atau membiarkan suatu daya dahsyat terpancar. “Lepaskanlah” alami dalam bahasa Indonesia bersama “luapan murka” dan tetap memuat kesan tindakan yang kuat, tanpa memaksakan metafora cairan.
- source_word: עֶבְרוֹת אַפֶּךָ
  choice: luapan murka-Mu
  rationale: Bentuk jamak עֶבְרוֹת menggambarkan gelora atau luapan amarah yang dahsyat, sedangkan אַף merupakan idiom Ibrani yang berarti kemarahan. “Murka” sesuai dengan ragam puitis dan khidmat ayat ini.
- source_word: וּרְאֵה
  choice: pandanglah
  rationale: Kata perintah ini bukan sekadar menyadari keberadaan seseorang, melainkan mengarahkan pandangan kepadanya sebelum bertindak. “Pandanglah” mempertahankan nada puitis secara alami.
- source_word: כָל גֵּאֶה
  choice: setiap orang yang sombong
  rationale: Adjektiva tunggal yang dipakai secara substantival bersama כָל bersifat distributif, menunjuk kepada tiap-tiap orang sombong.
- source_word: וְהַשְׁפִּילֵהוּ
  choice: dan rendahkanlah dia
  rationale: Bentuk kausatif imperatif dari שׁפל berarti membuat seseorang menjadi rendah. Pilihan ini mempertahankan kontras langsung antara kesombongan dan perendahan.
