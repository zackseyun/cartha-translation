  text: Will he make a covenant with you[b][a], that you would take him as a servant forever?
translation:
  language: id
  text: Apakah ia akan mengikat perjanjian denganmu,[a] lalu akankah engkau mengambilnya sebagai budak selamanya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “memotong perjanjian denganmu,” sebuah ungkapan baku yang berarti “mengikat perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai hamba selamanya.” Kata Ibrani עֶבֶד dapat berarti “hamba” atau “budak”; “budak” dipakai di sini karena konteksnya menekankan status terikat yang permanen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִכְרֹת בְּרִית
  choice: Apakah ia akan mengikat perjanjian
  rationale: Kata kerja כרת bersama בְּרִית merupakan ungkapan baku untuk membuat atau mengadakan perjanjian. Dalam bahasa Indonesia, 'mengikat perjanjian' terdengar alami, tetap mempertahankan nuansa ikatan resmi, dan הֲ diterjemahkan sebagai penanda pertanyaan.
- source_word: עִמָּךְ
  choice: denganmu
  rationale: Padanan langsung dan alami untuk frasa preposisional yang menunjuk kepada orang kedua tunggal.
- source_word: תִּקָּחֶנּוּ
  choice: sehingga engkau dapat mengambilnya
  rationale: לקח berarti 'mengambil'; akhiran objeknya menunjuk kepada pihak ketiga maskulin tunggal. Hubungan dengan klausa pertama dapat dipahami sebagai akibat atau kelanjutan, sehingga 'sehingga' menyampaikan alurnya tanpa menjadikannya kepastian.
- source_word: לְעֶבֶד
  choice: sebagai budak
  rationale: עֶבֶד dapat berarti 'hamba', 'pelayan', atau 'budak'. Konteks kepemilikan permanen yang dinyatakan oleh עוֹלָם menonjolkan status perbudakan, sehingga 'budak' paling tepat di sini.
- source_word: עוֹלָם
  choice: untuk selamanya
  rationale: Dalam konteks ini עוֹלָם menyatakan jangka waktu yang terus-menerus atau permanen. 'Untuk selamanya' merupakan ungkapan Indonesia yang alami dan mempertahankan daya retoris teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' dipakai untuk sapaan tunggal dalam wacana ilahi kepada Ayub. Susunan pertanyaan mempertahankan nada retoris sumber Ibrani.
