  text: בְּ/עֵינָ֥י/ו יִקָּחֶ֑/נּוּ בְּ֝/מֽוֹקְשִׁ֗ים יִנְקָב אָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: id
  text: Dapatkah orang menangkapnya di depan matanya? Dapatkah orang menusuk hidungnya dengan jerat?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia akan menangkapnya di depan matanya; ia akan menusuk hidungnya dengan perangkap.” Bahasa Ibrani ringkas dan sulit; bentuk katanya juga dapat dipahami tanpa subjek generik dan tanpa dinyatakan sebagai pertanyaan.'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dengan jerat-jerat.” Sejumlah terjemahan tradisional memakai gambaran yang lebih dekat dengan “kait-kait”, tetapi kata Ibraninya biasanya berarti jerat atau perangkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: di depan matanya
  rationale: Ungkapan dengan preposisi ב dan ‘mata’ paling wajar dipahami sebagai tindakan yang dilakukan terang-terangan dalam pandangan makhluk itu, bukan dengan matanya sebagai alat. Ungkapan ini juga mempertahankan kepadatan bahasa Ibrani.
- source_word: יִקָּחֶנּוּ
  choice: Dapatkah orang menangkapnya
  rationale: לקח pada dasarnya berarti ‘mengambil’, tetapi dalam konteks perburuan berarti menangkap atau menyergap binatang. Subjeknya tidak dinyatakan; ‘orang’ dipakai secara generik, dan bentuk pertanyaan retoris mengikuti tantangan dalam konteks.
- source_word: בְּמוֹקְשִׁים
  choice: dengan jerat
  rationale: מוֹקֵשׁ lazim berarti jerat atau perangkap, bukan kail. ‘Jerat’ mempertahankan arti leksikal meskipun gambaran menusuk dengannya terasa tidak biasa.
- source_word: יִנְקָב
  choice: menusuk
  rationale: נקב berarti melubangi atau menembus. ‘Menusuk’ alami dalam bahasa Indonesia dan sesuai dengan gambaran pelubangan hidung binatang.
- source_word: אָף
  choice: hidung
  rationale: Dalam konteks anatomis ini אַף berarti hidung; ‘hidung’ lebih langsung daripada ‘lubang hidung’ dan sesuai dengan tindakan menusuk.
theological_decisions:
- issue: Apakah kedua klausa harus disajikan sebagai pertanyaan retoris dengan subjek generik
  choice: Keduanya diterjemahkan sebagai pertanyaan dengan subjek ‘orang’
  alternative: ‘Ia akan menangkapnya di depan matanya; ia akan menusuk hidungnya dengan jerat.’
  rationale: Bahasa Ibrani sangat ringkas dan tidak memuat partikel tanya atau subjek eksplisit. Namun, konteks tantangan ilahi mendukung pertanyaan retoris. Catatan kaki mempertahankan kemungkinan pembacaan yang lebih harfiah dan kurang generik.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘Dapatkah orang’ mempertahankan kesejajaran retoris kedua klausa. Kejanggalan gambaran ‘menusuk ... dengan jerat’ tidak dihaluskan dalam teks utama karena mencerminkan pilihan leksikal Ibrani; alternatif dijelaskan dalam catatan kaki.
