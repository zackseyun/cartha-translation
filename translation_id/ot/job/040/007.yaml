  text: אֱזָר נָ֣א כְ/גֶ֣בֶר חֲלָצֶ֑י/ךָ אֶ֝שְׁאָלְ/ךָ֗ וְ/הוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: id
  text: Bersiaplah seperti seorang laki-laki[a]; Aku akan mengajukan pertanyaan kepadamu, dan beritahukanlah kepada-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Ikatlah pinggangmu seperti seorang laki-laki.” Ini adalah ungkapan untuk bersiap menghadapi suatu tugas atau tantangan; kata Ibrani untuk “laki-laki” juga dapat membawa nuansa kekuatan.'
    reason: Menjelaskan idiom konkret yang diterjemahkan secara dinamis serta nuansa leksikal גֶבֶר, tanpa mengganti acuan maskulinnya dalam teks utama.
lexical_decisions:
- source_word: אֱזָר נָא ... חֲלָצֶיךָ
  choice: Bersiaplah
  rationale: Ungkapan harfiahnya menggambarkan tindakan mengikat pinggang sebagai persiapan untuk bekerja atau menghadapi tantangan. Dalam bahasa Indonesia modern, “bersiaplah” menyampaikan fungsi idiom itu secara alami; partikel נָא tercermin dalam desakan bentuk imperatif -lah tanpa menambahkan penanda waktu yang tidak ada dalam teks.
- source_word: כְגֶבֶר
  choice: seperti seorang laki-laki
  rationale: גֶּבֶר menunjuk kepada laki-laki dan dapat menyiratkan kekuatan atau keberanian. Terjemahan ini mempertahankan acuan maskulin serta membiarkan konteks menyampaikan nuansa keteguhan.
- source_word: אֶשְׁאָלְךָ
  choice: Aku akan bertanya kepadamu
  rationale: שׁאל berarti bertanya atau meminta keterangan. Dalam konteks tantangan ilahi ini, bentuk “bertanya kepadamu” tetap dekat dengan teks dan cukup menyampaikan daya pengujiannya.
- source_word: וְהוֹדִיעֵנִי
  choice: dan engkau harus memberi tahu Aku
  rationale: Bentuk Hifil dari ידע berarti menyebabkan seseorang mengetahui, yaitu memberitahukan. “Memberi tahu Aku” mempertahankan makna kausatif, sedangkan “harus” mengungkapkan daya imperatif dari rangkaian ujaran ini secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa bergender dalam גֶּבֶר
  choice: seperti seorang laki-laki
  alternative: seperti seorang pejuang / seperti orang yang perkasa
  rationale: Kata benda maskulin tunggal itu ditujukan kepada Ayub dan secara leksikal berarti laki-laki, meskipun dapat membawa nuansa kekuatan. Terjemahan tidak menetralkan atau mempersempitnya menjadi “pejuang” tanpa kepastian dari konteks.
- issue: Bentuk jawaban yang dituntut Allah
  choice: engkau harus memberi tahu Aku
  alternative: jawablah Aku
  rationale: “Jawablah Aku” sesuai dengan konteks, tetapi lebih menafsirkan. Pilihan utama mempertahankan bentuk kausatif ידע, yakni membuat Allah mengetahui atau memberitahukan kepada-Nya, beserta ketegangan retoris yang disengaja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bersiaplah” dipilih agar idiom mudah dipahami, sementara gambaran harfiahnya dipertahankan dalam catatan kaki. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
