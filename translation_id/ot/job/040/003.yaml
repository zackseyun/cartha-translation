lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Bentuk wayyiqtol Qal dari ענה yang memperkenalkan tanggapan Ayub; “menjawab” merupakan padanan naratif yang alami dan tepat.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung dalam bahasa Ibrani; fungsinya sudah terwakili oleh susunan kalimat bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi Tetragramaton, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Bentuk wayyiqtol Qal dari אמר. Dipertahankan bersama “menjawab” untuk mencerminkan rumusan pengantar ujaran Ibrani “menjawab ... dan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: YHWH atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi, sementara catatan kaki mengakui bentuk tekstual dan alternatif transliterasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur formula ujaran Ibrani dipertahankan tanpa membuat kalimat sulit dipahami.
