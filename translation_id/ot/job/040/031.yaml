base_translation:
  language: en
  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: id
  text: Dapatkah engkau memenuhi kulitnya dengan tempuling[a], dan kepalanya dengan tombak penangkap ikan[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “besi-besi berkait”; kata Ibrani ini langka dan mungkin menunjuk secara lebih umum kepada alat berburu yang tajam atau berkait.
    reason: lexical_alternative
  - marker: b
    text: Atau “kait penangkap ikan”; ungkapan Ibrani ini dapat menunjuk secara umum kepada alat untuk menangkap ikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְמַלֵּא
  choice: Dapatkah engkau memenuhi
  rationale: Partikel tanya dan bentuk Piel imperfek orang kedua tunggal maskulin membentuk pertanyaan retoris yang menantang kemampuan lawan bicara; “Dapatkah engkau” menyampaikan daya ini dengan wajar.
- source_word: בְשֻׂכּוֹת
  choice: dengan tempuling
  rationale: Nomina langka ini tampaknya menunjuk kepada alat tajam atau berkait untuk berburu atau menangkap ikan. “Tempuling” mempertahankan gambaran senjata penusuk besar dan sesuai dengan kesejajaran pada klausa berikutnya.
- source_word: עוֹרוֹ
  choice: kulitnya
  rationale: Padanan langsung dan alami bagi kulit seekor makhluk besar, tanpa menambahkan penafsiran.
- source_word: וּבְצִלְצַל דָּגִים
  choice: dan ... dengan tombak penangkap ikan
  rationale: Frasa konstruksi ini secara harfiah menyebut alat yang berkaitan dengan ikan. “Tombak penangkap ikan” menjaga hubungan eksplisit dengan ikan dan cocok dengan gambaran serangan terhadap kepala serta kesejajaran dengan tempuling.
- source_word: רֹאשׁוֹ
  choice: kepalanya
  rationale: Padanan anatomis langsung yang mempertahankan kesejajaran dengan “kulitnya”.
theological_decisions: []
