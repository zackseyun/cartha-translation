  text: תַּֽחַת צֶאֱלִ֥ים יִשְׁכָּ֑ב בְּ/סֵ֖תֶר קָנֶ֣ה וּ/בִצָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/021.yaml
  text: Under the lotus trees he lies down[a], in the shelter of the reeds and the marsh.
translation:
  language: id
  text: Di bawah pohon-pohon teratai ia berbaring[a], di tempat terlindung di antara gelagah dan rawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bawah pohon-pohon peneduh.” Jenis tumbuhan yang dimaksud oleh istilah Ibrani ini tidak diketahui dengan pasti; “pohon-pohon teratai” mengikuti identifikasi yang umum berdasarkan konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Di bawah
  rationale: Preposisi tempat yang secara alami menyatakan posisi di bawah sesuatu.
- source_word: צֶאֱלִים
  choice: pohon-pohon teratai
  rationale: Istilah ini tampaknya menunjuk pada tumbuhan atau pohon peneduh di lingkungan perairan dan lazim diidentifikasi sebagai pohon teratai; karena spesies tepatnya tidak pasti, alternatif dicatat dalam catatan kaki.
- source_word: יִשְׁכָּב
  choice: ia berbaring
  rationale: Bentuk imperfek Qal orang ketiga tunggal maskulin menggambarkan keadaan atau tindakan yang biasa/nyata dalam konteks; 'berbaring' menyampaikan posisi hewan itu dengan wajar.
- source_word: בְּסֵתֶר
  choice: di tempat terlindung
  rationale: סֵתֶר menyatakan tempat tersembunyi, naungan, atau perlindungan; frasa ini alami dalam bahasa Indonesia dan mempertahankan gambaran vegetasi sebagai pelindung.
- source_word: קָנֶה
  choice: di antara gelagah
  rationale: Walaupun berbentuk tunggal, קָנֶה dapat dipahami secara kolektif sebagai rumpun tumbuhan air. 'Gelagah' sesuai dengan habitat tepian air, sedangkan 'di antara' mengungkapkan secara alami lokasi terlindung yang dibentuk vegetasi itu.
- source_word: וּבִצָּה
  choice: dan rawa
  rationale: בִּצָּה menunjuk pada tanah berair atau berlumpur; 'rawa' merupakan padanan Indonesia yang alami dan tidak mempersempit makna secara berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Pronomina 'ia' mempertahankan rujukan maskulin gramatikal tanpa menambahkan identifikasi hewan. Paralelisme lokasi dipertahankan secara alami.
