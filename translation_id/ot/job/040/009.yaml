base_translation:
  language: en
  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: id
  text: Atau, apakah engkau mempunyai lengan seperti lengan Allah[a], dan dapatkah engkau mengguntur dengan suara seperti suara-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kurang mungkin, “seperti lengan seorang ilah,” jika אֵל dipahami secara lebih umum; konteks sangat mendukung “Allah”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Atau, apakah
  rationale: Dalam rangkaian pertanyaan retoris ini, ungkapan tersebut melanjutkan tantangan sebelumnya. 'Atau, apakah' mempertahankan daya penghubung sekaligus tantangannya secara alami dalam bahasa Indonesia.
- source_word: זְרוֹעַ
  choice: lengan
  rationale: Makna harfiahnya adalah 'lengan'. Walaupun melambangkan kekuatan atau kuasa, gambaran konkret dalam teks Ibrani dipertahankan.
- source_word: כָּאֵל
  choice: seperti lengan Allah
  rationale: Konteks menunjukkan bahwa אֵל merujuk kepada Allah yang sedang berbicara. Pengulangan 'lengan' melengkapi perbandingan yang eliptis dalam bahasa Ibrani dan terdengar jelas dalam bahasa Indonesia.
- source_word: לָךְ
  choice: engkau mempunyai
  rationale: Secara harfiah berarti 'padamu', tetapi dalam konstruksi keberadaan ini secara idiomatis menyatakan kepunyaan.
- source_word: וּבְקוֹל
  choice: dan ... dengan suara
  rationale: Preposisi בְּ menyatakan sarana atau penyertaan; 'dengan suara' mempertahankan hubungan itu secara alami.
- source_word: כָּמֹהוּ
  choice: seperti suara-Nya
  rationale: Akhiran pronominal merujuk kembali kepada Allah. Pengulangan 'suara' memperjelas bahwa yang dibandingkan adalah suara, bukan pribadi secara umum.
- source_word: תַרְעֵם
  choice: dapatkah engkau mengguntur
  rationale: Bentuk verba ini menyatakan tindakan menghasilkan atau memperdengarkan guruh. 'Mengguntur' mempertahankan citra badai dan pertanyaan tentang kemampuan ilahi.
theological_decisions:
- issue: Rujukan אֵל dalam perbandingan ilahi
  choice: Allah
  alternative: seorang ilah
  rationale: Dalam konteks langsung, Allah Israel sedang menantang Ayub dengan membandingkan kemampuan Ayub dengan kemampuan-Nya sendiri. 'Allah' paling sesuai dengan rujukan kontekstual, sedangkan kemungkinan generik tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' sesuai dengan sapaan langsung dalam wacana puitis. Citra konkret 'lengan' dan metafora bunyi 'mengguntur' dipertahankan tanpa menjelaskannya sebagai 'kekuatan' atau 'kuasa' di dalam teks utama.
