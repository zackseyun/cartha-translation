  text: Dapatkah engkau memasang tali[a] pada hidungnya, atau menusuk rahangnya dengan kait[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menaruh gelagah pada hidungnya.” Kata Ibrani אַגְמוֹן secara harfiah menunjuk pada gelagah atau tumbuhan rawa sejenis, tetapi di sini kemungkinan berarti tali yang dibuat dari bahan tersebut.'
    reason: lexical_alternative
  - marker: b
