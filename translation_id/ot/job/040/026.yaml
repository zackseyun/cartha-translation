lexical_decisions:
- source_word: הֲתָשִׂים
  choice: Dapatkah engkau memasang
  rationale: Partikel tanya הֲ dengan bentuk imperfek שׂים membentuk pertanyaan retoris yang menantang Ayub. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kemampuan.
- source_word: אַגְמוֹן
  choice: tali
  rationale: Secara harfiah kata ini menunjuk pada gelagah atau pandan air, tetapi dalam konteks pengekangan hewan kemungkinan berarti tali yang dibuat dari bahan tersebut. 'Tali' menyampaikan fungsi konkret dengan jelas.
- source_word: בְּאַפּוֹ
  choice: pada hidungnya
  rationale: אַף berarti hidung atau lubang hidung. Preposisi בְּ tidak secara eksplisit menyatakan gerakan menembus, sehingga 'pada hidungnya' mempertahankan gambaran tanpa menambahkan rincian yang tidak pasti.
- source_word: וּבְחוֹחַ
  choice: dengan kait
  rationale: חוֹחַ dapat berarti duri atau kait. Dalam gambaran menangkap dan mengekang hewan, 'kait' paling sesuai dengan konteks.
- source_word: תִּקּוֹב
  choice: menusuk
  rationale: Kata kerja נקב menyatakan tindakan melubangi atau menembus. 'Menusuk' ringkas, jelas, dan wajar dalam bahasa Indonesia.
- source_word: לֶחֱיוֹ
  choice: rahangnya
  rationale: לְחִי dapat berarti rahang atau pipi. 'Rahang' paling sesuai dengan gambaran pemasangan kait untuk mengekang, sementara alternatif literal dicatat dalam catatan kaki.
