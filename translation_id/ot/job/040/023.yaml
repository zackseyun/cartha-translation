    rationale: Verba ini berarti merasa aman, percaya, atau yakin. Ketenangan dapat menjadi akibatnya, tetapi tidak menyatakan gagasan rasa aman secara langsung.
  - severity: low
    issue: “Sungai Yordan menerjang mulutnya” memperkeras relasi spasial אֶל־פִּיהוּ.
    rationale: Preposisi אֶל menyatakan gerak menuju atau ke arah mulutnya. “Meluap ke arah mulutnya” mempertahankan gambaran air yang naik/menyembur tanpa secara eksplisit menyatakan benturan.
  revised_text: Lihat, sekalipun sungai bergolak, ia tidak panik; ia tetap merasa aman, bahkan jika Sungai Yordan meluap ke arah mulutnya.
