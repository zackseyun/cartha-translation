  source_fidelity: Draf pada umumnya mempertahankan gambaran seekor hewan yang tidak terguncang oleh sungai yang bergolak dan oleh luapan Yordan. Namun, יִבְטַח terutama menyatakan rasa aman atau keyakinan, bukan semata-mata keadaan tenang; karena itu “tetap tenang” terlalu melemahkan unsur tersebut. Frasa אֶל־פִּיהוּ lebih tepat dinyatakan sebagai gerak air menuju/ke arah mulutnya daripada tindakan transitif “menerjang mulutnya.”
