  text: Look, if a river rages, he is not alarmed; he is confident even if the Jordan surges against his mouth.
translation:
  language: id
  text: Lihat, sekalipun sungai bergolak, ia tidak panik; ia tetap merasa aman, bahkan jika Sungai Yordan meluap ke arah mulutnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲשֹׁק נָהָר
  choice: sungai mengamuk
  rationale: Secara harfiah verba ini dapat berarti menindas atau bertindak ganas; dalam konteks sungai, ungkapan ini menggambarkan aliran yang meluap atau bergelora dengan hebat.
- source_word: לֹא יַחְפּוֹז
  choice: ia tidak gentar
  rationale: Verba ini pada dasarnya menyatakan ketergesa-gesaan atau kepanikan; 'tidak gentar' menyampaikan bahwa hewan itu tidak panik menghadapi arus deras.
- source_word: יִבְטַח
  choice: ia tetap tenang
  rationale: Kata ini berarti merasa aman atau percaya diri; dalam konteks perilaku hewan, 'tetap tenang' terdengar alami tanpa menghilangkan gagasan rasa aman.
- source_word: יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ
  choice: Sungai Yordan menerjang mulutnya
  rationale: Verba יָגִיחַ menggambarkan gerakan yang menyembur atau menerjang; susunan ini mempertahankan citra arus Yordan yang datang dengan deras sampai ke mulut hewan itu.
theological_decisions:
- issue: Rujukan Sungai Yordan
  choice: Dipertahankan sebagai nama geografis konkret, 'Sungai Yordan'.
  alternative: Memahami 'Yordan' secara umum sebagai sungai yang sangat deras.
  rationale: Teks Ibrani secara eksplisit memakai nama יַרְדֵּן, sehingga nama tersebut tidak digeneralisasi atau diberi makna simbolis.
- issue: Hubungan klausa dengan כִּי
  choice: Diterjemahkan secara konsesif dengan 'sekalipun'.
  alternative: Diterjemahkan temporal atau kausal sebagai 'ketika' atau 'karena'.
  rationale: Dalam konteks, klausa itu menggambarkan keadaan ekstrem yang tetap tidak menggoyahkan ketenangan hewan tersebut; makna konsesif paling sesuai sambil tidak menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan 'sekalipun' mempertahankan kesejajaran retoris dua klausa, sedangkan 'mengamuk', 'tidak gentar', dan 'menerjang' menghadirkan daya gambar teks Ibrani secara alami.
