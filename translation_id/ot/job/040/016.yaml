  yaml_path: translation/ot/job/040/016.yaml
  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: id
  text: Lihatlah, kekuatannya ada pada pinggangnya, dan keperkasaannya pada otot-otot perutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “urat-urat perutnya” untuk “otot-otot perutnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: Partikel הִנֵּה menarik perhatian, sedangkan נָא menambah dorongan atau penegasan. Imperatif Indonesia “Lihatlah” menyampaikan keduanya secara alami dan bermartabat tanpa perlu menambahkan “sekarang,” yang terasa kurang wajar dalam konteks ini.
- source_word: כֹחוֹ
  choice: kekuatannya
  rationale: כֹחַ menunjuk pada kekuatan jasmani atau tenaga; “kekuatan” merupakan padanan langsung dan sesuai dengan gambaran fisik makhluk tersebut.
- source_word: בְמָתְנָיו
  choice: pada pinggangnya
  rationale: מָתְנַיִם menunjuk kawasan pinggang atau panggul. “Pinggang” mudah dipahami pembaca modern dan cukup luas untuk mempertahankan cakupan anatominya.
- source_word: וְאֹנוֹ
  choice: dan keperkasaannya
  rationale: אוֹן berarti kekuatan, daya, atau keperkasaan. “Keperkasaan” mempertahankan kesejajaran makna dengan כֹחַ sekaligus memberi variasi puitis yang wajar.
- source_word: בִּשְׁרִירֵי
  choice: pada otot-otot
  rationale: שְׁרִירִים dapat merujuk pada otot, urat, atau bagian tubuh yang kukuh. “Otot-otot” adalah gambaran anatomis yang paling jelas dalam bahasa Indonesia modern.
- source_word: בִטְנוֹ
  choice: perutnya
  rationale: בֶּטֶן dalam konteks anatomi ini berarti perut atau abdomen. “Perut” adalah padanan yang alami, jelas, dan tidak terlalu teknis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada puitis dan bermartabat. Kesejajaran antara “kekuatan” dan “keperkasaan” dipertahankan, sementara istilah anatomi dibuat jelas bagi pembaca umum.
