  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: id
  text: Letakkan tanganmu padanya; ingatlah pertempuran itu—jangan melakukannya lagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani secara harfiah, “jangan menambah.” Maksud idiomatisnya dapat berupa “jangan melakukannya lagi” atau “engkau tidak akan melakukannya lagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים
  choice: Letakkanlah
  rationale: Bentuk perintah dari שׂים menyatakan tindakan menaruh atau meletakkan tangan; “letakkanlah” alami dan tetap mempertahankan daya perintahnya.
- source_word: עָלָיו
  choice: padanya
  rationale: Preposisi עַל dengan akhiran orang ketiga maskulin tunggal paling langsung berarti “pada/di atas dia”; “padanya” sesuai dengan gambaran menyentuh atau menyerang Lewiatan.
- source_word: כַּפֶּךָ
  choice: tanganmu
  rationale: כַּף secara harfiah dapat berarti telapak tangan, tetapi dalam ungkapan ini “tanganmu” lebih alami dalam bahasa Indonesia dan menyampaikan tindakan yang dimaksud.
- source_word: זְכֹר
  choice: ingatlah
  rationale: Bentuk perintah dari זכר dipertahankan secara langsung sebagai “ingatlah”.
- source_word: מִלְחָמָה
  choice: pertempuran itu
  rationale: מִלְחָמָה berarti perang atau pertempuran. Dalam konteks menghadapi Lewiatan, “pertempuran itu” menunjuk pada bentrokan yang harus diperhitungkan atau diingat.
- source_word: אַל תּוֹסַף
  choice: jangan mengulanginya lagi
  rationale: Secara harfiah frasa ini berarti “jangan menambah,” tetapi di sini merupakan idiom untuk tidak mengulangi tindakan tersebut. Bentuk larangan dipertahankan agar ambiguitas antara perintah dan akibat yang diperkirakan tidak dihapus.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Susunan perintah serta peringatan dalam bahasa Ibrani dipertahankan, sementara idiom penutup dibuat jelas tanpa menutup kemungkinan bahwa frasa itu juga menyiratkan akibat: orang tersebut tidak akan berani mencobanya lagi.'
