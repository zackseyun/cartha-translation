  yaml_path: translation/ot/job/040/001.yaml
  text: And Yahweh answered Job and said:[a]
translation:
  language: id
  text: Lalu Yahweh menjawab Ayub dan berkata:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; juga dapat ditransliterasikan “Yehova”.'
    reason: Menjelaskan bentuk nama ilahi dalam bahasa sumber dan alternatif transliterasinya.
lexical_decisions:
- source_word: וַיַּעַן
  choice: Lalu ... menjawab
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan ענה dalam formula dialog berarti “menjawab” atau “menanggapi”. “Lalu ... menjawab” alami dalam bahasa Indonesia dan mempertahankan struktur dialog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: אֶת adalah penanda objek langsung; fungsinya terwakili oleh susunan kalimat Indonesia tanpa padanan leksikal.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: “Ayub” adalah bentuk nama אִיּוֹב yang mapan dalam bahasa Indonesia.
- source_word: וַיֹּאמַר
  choice: kata-Nya
  rationale: אמר berarti “berkata”. “Kata-Nya” mempertahankan verba ujaran kedua dalam formula Ibrani “menjawab dan berkata”, tetapi menghindari susunan Indonesia yang kaku; “-Nya” merujuk kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut, sementara catatan kaki mengakui bentuk Ibrani dan alternatif transliterasi tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Formula “Lalu Yahweh menjawab Ayub, kata-Nya” mempertahankan kedua verba ujaran Ibrani tanpa terdengar seberat terjemahan harfiah “menjawab ... dan berkata”. Pronomina hormat “-Nya” dipakai untuk rujukan kepada Allah.
