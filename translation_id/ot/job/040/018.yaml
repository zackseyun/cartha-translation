  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: id
  text: Tulang-tulangnya adalah pipa-pipa perunggu[a]; tulang-tulangnya seperti batang besi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saluran-saluran perunggu.” Kata Ibrani אֲפִיקֵי dapat menggambarkan saluran, saluran air, atau poros, bukan secara khusus pipa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tulang-tulangnya seperti benda tuangan dari besi.” Kata Ibrani yang diterjemahkan “batang” dapat menunjuk benda logam yang dituang atau dibentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: tulang-tulangnya
  rationale: Makna anatomis yang lazim dari עֶצֶם dan sesuai dengan paralelisme baris kedua.
- source_word: אֲפִיקֵי
  choice: bagaikan pipa-pipa
  rationale: אֲפִיקִים dapat menunjuk saluran atau bentuk memanjang yang kokoh. Dalam gambaran anatomis ini, 'pipa-pipa' mempertahankan citra benda berbentuk tabung; unsur perbandingan dibuat eksplisit agar ungkapannya alami dalam bahasa Indonesia.
- source_word: נְחוּשָׁה
  choice: perunggu
  rationale: Dalam perbandingan puitis tentang kekuatan, 'perunggu' merupakan padanan yang wajar, meskipun kata Ibrani ini juga dapat merujuk tembaga.
- source_word: גְּרָמָיו
  choice: anggota-anggota tubuhnya
  rationale: גֶּרֶם dapat berarti tulang atau kerangka. Pilihan ini mempertahankan variasi puitis dan gambaran kekuatan tubuh tanpa mengulang 'tulang-tulangnya'.
- source_word: כִּמְטִיל
  choice: seperti batang-batang
  rationale: מָטִיל menunjuk sesuatu yang dituang atau dibentuk dari logam; 'batang-batang' menyampaikan kekakuan dan kekokohannya secara alami.
- source_word: בַּרְזֶל
  choice: besi
  rationale: Padanan baku bagi בַּרְזֶל dan membentuk pasangan citra logam dengan perunggu.
