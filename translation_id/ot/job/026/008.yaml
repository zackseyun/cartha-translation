  variant: modern standard Indonesian
source:
  edition: WLC
  text: צֹרֵֽר מַ֥יִם בְּ/עָבָ֑י/ו וְ/לֹא נִבְקַ֖ע עָנָ֣ן תַּחְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: id
  text: Ia mengikat air di dalam awan-awan-Nya[a], tetapi awan itu tidak terbelah[b] di bawahnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam awan-awan tebal-Nya”; kata Ibrani ini dapat menekankan kumpulan awan yang tebal.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak pecah”; secara harfiah, kata Ibraninya berarti “tidak terbelah.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di bawah mereka.” Akhiran jamak itu dapat merujuk kepada air atau kumpulan awan.
    reason: ambiguity
lexical_decisions:
- source_word: צֹרֵר
  choice: mengikat
  rationale: Partisipel dari צרר menggambarkan tindakan mengikat, membungkus, atau menahan. “Mengikat” mempertahankan gambaran puitis tentang air yang ditahan di dalam awan.
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya jamak, dalam bahasa Indonesia “air” secara alami merupakan nomina massa dan paling wajar dalam konteks ini.
- source_word: בְּעָבָיו
  choice: di dalam awan-awan-Nya
  rationale: עָב dapat berarti awan, khususnya awan tebal. Bentuk dengan akhiran orang ketiga tunggal maskulin menunjukkan kepunyaan; bentuk ulang “awan-awan” menyampaikan kemajemukannya secara alami.
- source_word: וְלֹא
  choice: tetapi ... tidak
  rationale: 'Kata penghubung ini menyatakan kontras: meskipun air tertahan di dalam awan, awan itu tidak terbelah.'
- source_word: נִבְקַע
  choice: tidak terbelah
  rationale: Bentuk Nifal dari בקע berarti terbelah atau terbuka karena terbelah. “Tidak terbelah” mempertahankan bentuk pasif dan citra fisik teks.
- source_word: עָנָן
  choice: awan itu
  rationale: Nomina ini berbentuk tunggal dan dapat berfungsi secara kolektif atau generik dalam puisi. “Awan itu” mempertahankan bentuk tunggal serta kesinambungan dengan awan-awan pada baris sebelumnya.
- source_word: תַּחְתָּם
  choice: di bawahnya
  rationale: Akhiran Ibraninya berbentuk jamak dan rujukannya tidak sepenuhnya pasti, mungkin air atau kumpulan awan. Bahasa Indonesia memakai “-nya” secara alami tanpa harus menentukan rujukannya; catatan kaki menjelaskan bentuk sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan kalimat mempertahankan citra kosmis serta bentuk tunggal “awan” pada klausa kedua. Huruf kapital pada “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah dalam Alkitab bahasa Indonesia.
