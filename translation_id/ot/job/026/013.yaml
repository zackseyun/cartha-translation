  text: בְּ֭/רוּח/וֹ שָׁמַ֣יִם שִׁפְרָ֑ה חֹֽלֲלָ֥ה יָ֝ד֗/וֹ נָחָ֥שׁ בָּרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/013.yaml
  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: id
  text: Dengan napas-Nya[a], langit dibuat indah; tangan-Nya menikam[b] ular yang melarikan diri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dengan Roh-Nya” atau “Dengan angin-Nya.” Kata Ibrani ini dapat berarti napas, angin, atau roh.
    reason: lexical_alternative
  - marker: b
    text: Atau “membentuk.” Kata kerjanya dapat dipahami dengan cara yang berbeda, meskipun “menikam” paling sesuai dengan gambaran pertarungan dalam baris ini.
    reason: alternative_reading
  - marker: c
    text: “Ular yang melarikan diri” kemungkinan menggambarkan ular kekacauan kosmis; bandingkan Yesaya 27:1.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: Dengan napas-Nya
  rationale: 'רוּחַ dapat berarti napas, angin, atau roh. Dalam puisi ini, “napas” mempertahankan gambaran konkret tentang kuasa kreatif Allah tanpa menetapkan bahwa yang dimaksud secara khusus adalah pribadi Roh Kudus. בְּ menyatakan sarana: “dengan/melalui”.'
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” secara alami dapat menunjuk bentangan surgawi secara kolektif dan sesuai dengan konteks kosmologis puitis ini.
- source_word: שִׁפְרָה
  choice: dibuat indah
  rationale: Kata ini menyampaikan gagasan keindahan, keelokan, atau kecemerlangan. Bentuk “dibuat indah” mempertahankan hasil tindakan ilahi sekaligus selaras dengan gaya puitis ayat.
- source_word: חֹלֲלָה
  choice: menikam
  rationale: Dalam konteks tangan Allah dan ular sebagai objek, makna tindakan bermusuhan paling sesuai dengan gambaran pertarungan kosmis. Namun, kemungkinan arti “membentuk” tetap dicatat karena bentuk verba ini dapat dipahami secara berbeda.
- source_word: יָדוֹ
  choice: tangan-Nya
  rationale: Terjemahan konkret ini mempertahankan citra Ibrani tentang kuasa Allah yang bertindak.
- source_word: נָחָשׁ בָּרִיחַ
  choice: ular yang melarikan diri
  rationale: בָּרִיחַ dapat mengandung arti melarikan diri, meluncur, atau memanjang. “Ular yang melarikan diri” merupakan pembacaan yang kuat dalam gambaran penaklukan makhluk kekacauan dan berpadanan dengan Yesaya 27:1, tanpa menafsirkan identitas ular itu secara berlebihan.
theological_decisions:
- issue: Apakah רוּחַ harus diterjemahkan “Roh” sehingga menyiratkan rujukan khusus kepada pribadi Roh Kudus
  choice: “napas” dalam teks utama
  alternative: “Roh” atau “angin”
  rationale: Bahasa Ibrani memungkinkan ketiga arti itu, tetapi tidak mengharuskan rujukan personal yang eksplisit dalam ayat ini. “Napas” menjaga citra puitis dan ketegangan teologis; pilihan lain dicatat dalam catatan kaki.
- issue: Apakah נָחָשׁ בָּרִיחַ harus diidentifikasi secara eksplisit sebagai Iblis atau Lewiatan
  choice: Mempertahankan citra “ular yang melarikan diri”
  alternative: Lewiatan, ular kekacauan kosmis, atau Iblis
  rationale: Ayat ini memakai gambaran pertarungan kosmis, tetapi tidak secara eksplisit menamai ular tersebut sebagai Iblis atau Lewiatan. Terjemahan tidak menetapkan identitas yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur dua klausa dan citra konkret “napas,” “tangan,” serta “ular” dipertahankan. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
