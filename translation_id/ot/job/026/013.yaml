  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan dua klausa Ibrani: בְּרוּחוֹ sebagai sarana (“Dengan napas-Nya”), שָׁמַיִם sebagai “langit,” dan tindakan tangan-Nya terhadap נָחָשׁ בָּרִיחַ. “Menikam” merupakan pilihan yang sah untuk חֹלֲלָה dalam pembacaan imagery pertarungan, sementara alternatif penting “membentuk” dicatat. Pilihan “ular yang melarikan diri” mempertahankan citra dan tidak mengidentifikasikannya secara melampaui teks.'
