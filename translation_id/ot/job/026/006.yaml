  text: עָר֣וֹם שְׁא֣וֹל נֶגְדּ֑/וֹ וְ/אֵ֥ין כְּ֝ס֗וּת לָֽ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: id
  text: Syeol telanjang di hadapan-Nya[a], dan Abadon[b] tidak memiliki penutup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Syeol terbuka di hadapan-Nya.”
    reason: lexical_alternative
  - marker: b
    text: “Abadon” juga dapat diterjemahkan “Kebinasaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: telanjang
  rationale: Kata sifat ini berarti ‘telanjang’ atau ‘tidak tertutup’. Pilihan ini mempertahankan gambaran puitis yang kuat serta kesejajarannya dengan ‘penutup’ pada baris kedua.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Istilah Ibrani ini dipertahankan sebagai nama bagi alam orang mati karena cakupan maknanya lebih luas daripada sekadar ‘kubur’. Ejaan ‘Syeol’ lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: נֶגְדּוֹ
  choice: di hadapan-Nya
  rationale: Ungkapan ini secara langsung berarti ‘di hadapan dia’. Dalam konteks, akhiran orang ketiga tunggal merujuk kepada Allah; bentuk ‘-Nya’ menyampaikan rujukan itu secara wajar tanpa menambahkan nama yang tidak terdapat dalam baris ini.
- source_word: אֵין
  choice: tidak memiliki
  rationale: Bersama frasa nomina sesudahnya, konstruksi ini menyatakan ketiadaan penutup pada Abadon. ‘Tidak memiliki’ alami dalam bahasa Indonesia dan tetap dekat dengan susunan serta makna Ibrani.
- source_word: כְּסוּת
  choice: penutup
  rationale: Nomina ini menunjuk pada sesuatu yang menutupi. ‘Penutup’ mempertahankan metafora yang sejajar dengan keadaan ‘telanjang’ pada bagian pertama ayat.
- source_word: אֲבַדּוֹן
  choice: Abadon
  rationale: Dalam kesejajaran dengan Syeol, istilah ini berfungsi seperti nama bagi tempat atau ranah kebinasaan. Transliterasi ‘Abadon’ mempertahankan daya puitis dan hubungan antarteksnya, sedangkan arti leksikalnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan akhiran orang ketiga tunggal pada נֶגְדּוֹ
  choice: Merujuk kepada Allah, diterjemahkan ‘di hadapan-Nya’.
  alternative: Merujuk kepada seorang pengamat yang tidak disebutkan, diterjemahkan ‘di hadapannya’.
  rationale: Konteks Ayub 26 menggambarkan pengetahuan dan kuasa Allah atas ranah yang tersembunyi. Kapitalisasi ‘-Nya’ menjadikan rujukan kontekstual itu jelas, tetapi tidak menambahkan penjelasan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan ringkas. Istilah dunia sumber ‘Syeol’ dan ‘Abadon’ dipertahankan, sementara hubungan metaforis antara ‘telanjang’ dan ‘penutup’ dibuat jelas dan alami.
