  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan konstruksi instrumental בְּכֹחוֹ dan וּבִתְבוּנָתוֹ, serta mempertahankan paralelisme puitis: kuasa Allah atas laut dan pengertian-Nya dalam meremukkan Rahab. “Menenangkan laut” merupakan pemahaman kontekstual yang mapan untuk רָגַע dalam ayat ini dan selaras dengan konteks penaklukan kekacauan; terjemahan ini tidak memaksakan rincian tambahan ke dalam teks utama.'
