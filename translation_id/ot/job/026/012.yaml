  text: בְּ֭/כֹח/וֹ רָגַ֣ע הַ/יָּ֑ם ו/ב/תובנת/ו מָ֣חַץ רָֽהַב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: id
  text: Dengan kuasa-Nya Dia menenangkan laut, dan dengan pengertian-Nya Dia meremukkan Rahab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab adalah nama puitis bagi kuasa kekacauan atau monster laut yang melawan Allah; sebagai alternatif, istilah ini dapat diterjemahkan secara interpretatif sebagai “monster laut”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: Dengan kuasa-Nya
  rationale: Preposisi בְּ bersifat instrumental. “Dengan kuasa-Nya” alami dalam bahasa Indonesia dan sesuai dengan cakupan kosmis ayat ini.
- source_word: רָגַע
  choice: Dia menenangkan
  rationale: Dalam konteks laut, verba ini paling mungkin menyatakan tindakan membuat tenang atau meredakan. Pilihan ini tetap menyampaikan penaklukan kekacauan tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: הַיָּם
  choice: laut
  rationale: Padanan langsung yang mempertahankan baik arti harfiah maupun gema puitis laut sebagai kekuatan kekacauan.
- source_word: וּבִתְבוּנָתוֹ
  choice: dan dengan pengertian-Nya
  rationale: תְּבוּנָה menunjuk pada pengertian, wawasan, atau kecakapan memahami. “Pengertian” mempertahankan kaitannya dengan tema hikmat dalam kitab Ayub.
- source_word: מָחַץ
  choice: Dia meremukkan
  rationale: Verba ini menggambarkan tindakan menghancurkan atau meremukkan dengan kuat. “Meremukkan” mempertahankan daya puitis dan gambaran kekalahan telak.
- source_word: רָהַב
  choice: Rahab
  rationale: Dalam konteks puitis-kosmologis ini, Rahab paling tepat dipahami sebagai nama bagi kuasa kekacauan atau monster laut. Transliterasi mempertahankan citra Ibrani dan tidak menyempitkannya menjadi satu penafsiran.
theological_decisions:
- issue: Apakah רָהַב diterjemahkan sebagai nama diri atau secara interpretatif
  choice: Nama “Rahab”, yang merujuk pada kuasa kekacauan atau monster laut yang ditaklukkan Allah
  alternative: “kesombongan” sebagai nomina abstrak, atau “monster laut” sebagai terjemahan interpretatif
  rationale: Konteks kosmologis puisi Ayub mendukung Rahab sebagai sosok mitopoetis yang melambangkan kuasa kekacauan. Mempertahankan nama tersebut menjaga citra dan ketegangan teks, sedangkan catatan kaki menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan paralel yang mengikuti teks Ibrani. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan bahasa Indonesia. Penanda catatan kaki ditempatkan langsung setelah “Rahab”, istilah yang dijelaskannya.
