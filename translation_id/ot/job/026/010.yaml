translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Kata ganti 'Ia' mempertahankan subjek ilahi dari konteks, sedangkan 'menggoreskan sebuah lingkaran' menjaga citra konkret teks Ibrani. Penanda catatan kaki [a] dicantumkan langsung sesudah frasa yang memiliki alternatif terjemahan.
