  text: אֶת מִ֭י הִגַּ֣דְתָּ מִלִּ֑ין וְ/נִשְׁמַת מִ֝י יָצְאָ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/004.yaml
  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: id
  text: Kepada siapa engkau menyampaikan perkataan, dan napas[a] siapa yang keluar darimu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “roh siapa yang keluar darimu?” Kata Ibrani ini dapat berarti “napas” atau, dalam konteks tertentu, “roh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: kepada siapa
  rationale: Partikel אֶת di depan kata tanya menunjukkan orang yang menjadi sasaran penyampaian; “kepada siapa” alami dalam bahasa Indonesia dan mempertahankan daya retoris pertanyaan itu.
- source_word: הִגַּדְתָּ
  choice: engkau menyampaikan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan, menyatakan, atau menyampaikan. “Menyampaikan” cocok dengan objek “perkataan” dan tetap wajar dalam ragam puitis.
- source_word: מִלִּין
  choice: perkataan
  rationale: Bentuk jamak bercorak Aram ini menunjuk pada kata-kata atau ujaran. “Perkataan” mempertahankan nuansa ujaran yang disampaikan.
- source_word: וְנִשְׁמַת
  choice: dan napas
  rationale: נשמה terutama dapat berarti napas atau napas kehidupan, tetapi dalam konteks tertentu juga dapat berarti roh. “Napas” mempertahankan gambaran konkret tentang sesuatu yang keluar dari seseorang, sedangkan alternatif “roh” dicatat dalam catatan kaki.
- source_word: מִי
  choice: siapa
  rationale: Dalam rangkaian “napas siapa,” kata tanya ini berfungsi secara posesif; susunan tersebut alami dalam bahasa Indonesia.
- source_word: יָצְאָה מִמֶּךָּ
  choice: yang keluar darimu
  rationale: יצא secara konkret berarti keluar. Terjemahan ini mempertahankan metafora sumber napas atau ilham tanpa menafsirkannya lebih jauh.
theological_decisions:
- issue: Apakah נְשָׁמָה merujuk pada napas atau roh
  choice: napas dalam teks utama
  alternative: roh
  rationale: Konteks keluarnya sesuatu dari Bildad mendukung citra konkret “napas,” tetapi kemungkinan makna “roh” tetap nyata secara leksikal dan karena itu dipertahankan dalam catatan kaki, bukan disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” mempertahankan sapaan tunggal dan ragam puitis kitab Ayub; susunan pertanyaan dijaga ringkas serta retoris.
