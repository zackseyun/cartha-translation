  text: נֹטֶ֣ה צָפ֣וֹן עַל תֹּ֑הוּ תֹּ֥לֶה אֶ֝֗רֶץ עַל בְּלִי מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/007.yaml
  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: id
  text: Ia membentangkan utara[a] di atas kehampaan[b]; Ia menggantungkan bumi pada ketiadaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “langit sebelah utara”. Teks Ibrani hanya menyebut “utara”, yang dalam konteks puitis ini mungkin menunjuk pada langit di sebelah utara.
    reason: lexical_alternative
  - marker: b
    text: Atau “ruang kosong” atau “keadaan yang belum berbentuk”. Kata Ibrani ini dapat menyatakan kehampaan, ketandusan, atau keadaan tanpa bentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: membentangkan
  rationale: Partisipel Qal dari נטה menyatakan tindakan membentangkan atau merentangkan. “Membentangkan” mempertahankan gambaran kosmologis dan cocok dengan objek yang dipahami sebagai kawasan langit.
- source_word: צָפוֹן
  choice: utara
  rationale: Kata ini secara langsung berarti “utara”. Dalam konteks puitis ini, kata tersebut mungkin menunjuk pada langit sebelah utara, tetapi terjemahan “utara” mempertahankan ungkapan ringkas dan ambiguitas teks Ibrani.
- source_word: תֹּהוּ
  choice: kehampaan
  rationale: תֹּהוּ dapat berarti kehampaan, ketandusan, atau keadaan yang belum berbentuk. “Kehampaan” alami dalam bahasa Indonesia dan mempertahankan citra ruang kosong tanpa mempersempit maknanya.
- source_word: תֹּלֶה
  choice: menggantungkan
  rationale: Partisipel Qal dari תלה berarti menggantungkan atau menangguhkan. “Menggantungkan” merupakan padanan langsung dan mempertahankan citra puitis.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Dalam konteks kosmologis ini, אֶרֶץ menunjuk pada bumi sebagai dunia, bukan suatu negeri tertentu.
- source_word: בְּלִי מָה
  choice: ketiadaan
  rationale: Ungkapan ini secara harfiah menyatakan “tanpa sesuatu”. Dengan preposisi עַל, “pada ketiadaan” mempertahankan bentuk puitis yang tajam dan gagasan bahwa bumi tidak digantungkan pada sesuatu pun.
- source_word: עַל
  choice: di atas / pada
  rationale: 'Preposisi yang sama muncul dua kali, tetapi konteks bahasa Indonesia menuntut padanan idiomatis yang berbeda: “di atas kehampaan” pada klausa pertama dan “pada ketiadaan” pada klausa kedua.'
theological_decisions:
- issue: Gambaran kosmologis
  choice: Mempertahankan ayat ini sebagai gambaran puitis tentang kuasa Allah atas tatanan ciptaan.
  alternative: Menafsirkannya sebagai pernyataan ilmiah modern yang presisi, atau memperluas “utara” menjadi rujukan mitologis yang eksplisit.
  rationale: Teks sastra hikmat ini menyampaikan kuasa Allah melalui bahasa kosmologis puitis. Terjemahan mempertahankan gambaran Ibraninya tanpa mengubahnya menjadi klaim ilmiah modern ataupun memasukkan latar mitologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kata ganti “Ia” memberi nada khidmat tanpa menambahkan nama ilahi yang tidak muncul dalam ayat. Struktur dua klausa paralel dan citra kosmologis teks sumber dipertahankan.
