base_translation:
  language: en
  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: id
  text: Tiang-tiang langit gemetar dan tercengang karena hardikan-Nya.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berguncang” sebagai ganti “gemetar”.
    reason: lexical_alternative
  - marker: b
    text: Atau “terpana” atau “terkejut” sebagai ganti “tercengang”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari hardikan-Nya”; ungkapan ini juga dapat dipahami sebagai “akibat hardikan-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: tiang-tiang langit
  rationale: Mempertahankan gambaran kosmis puitis Ibrani secara langsung dan wajar dalam bahasa Indonesia, tanpa menafsirkannya sebagai fondasi atau gunung.
- source_word: יְרוֹפָפוּ
  choice: gemetar
  rationale: Kata kerja רפף menyatakan gerakan bergetar atau berguncang. 'Gemetar' menangkap gerakan sekaligus nuansa gentar dalam konteks ini.
- source_word: וְיִתְמְהוּ
  choice: dan tercengang
  rationale: Kata kerja תמהּ menyatakan keadaan terkejut atau terpana. 'Tercengang' alami dalam bahasa Indonesia dan tidak menambahkan nuansa kejijikan moral.
- source_word: מִגַּעֲרָתוֹ
  choice: karena hardikan-Nya
  rationale: Preposisi מִן dapat menandai sumber maupun sebab. 'Karena' menyampaikan hubungan kausal secara alami, sedangkan 'hardikan-Nya' mempertahankan daya perkataan ilahi yang mengancam atau menegur.
theological_decisions:
- issue: Gambaran kosmis 'tiang-tiang langit'
  choice: Mempertahankan gambaran kosmologis puitis tanpa menghilangkan unsur mitopoetis maupun menjadikannya pernyataan arsitektur kosmos secara harfiah.
  alternative: Menafsirkannya sebagai gunung atau menggantinya dengan 'fondasi langit'.
  rationale: Puisi Ayub memakai citra kosmis kuno yang hidup. Terjemahan sebaiknya mempertahankan citra teks tanpa memaksakan penjelasan kosmologis modern atau penafsiran khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, puitis, dan mudah dipahami. Kapital pada enklitik '-Nya' menandai rujukan kepada Allah sesuai konteks, tanpa menambahkan nama ilahi yang tidak terdapat dalam klausa Ibrani.
