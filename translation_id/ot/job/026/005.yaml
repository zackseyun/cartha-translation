  yaml_path: translation/ot/job/026/005.yaml
  text: The departed spirits tremble beneath the waters[a], and those who dwell in them.
translation:
  language: id
  text: Arwah-arwah gemetar di bawah air[a], serta para penghuninya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Orang-orang mati menggeliat di bawah air, serta para penghuninya.” Kata Ibrani רְפָאִים dapat berarti “orang-orang mati” atau “arwah”; kata יְחוֹלָלוּ juga dapat diterjemahkan “menggeliat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: arwah orang mati
  rationale: Dalam konteks puitis tentang dunia orang mati, kata ini menunjuk kepada orang mati atau arwah mereka, bukan bangsa Refaim. Ungkapan ini mempertahankan nuansa alam kematian dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: יְחוֹלָלוּ
  choice: gemetar
  rationale: Kata kerja ini dapat menggambarkan gerakan menggeliat, bergetar, atau gemetar. Dalam gambaran kedahsyatan kekuasaan Allah atas alam maut, 'gemetar' menyampaikan kegentaran tanpa menghilangkan kemungkinan nuansa gerak fisik, yang dicatat dalam catatan kaki.
- source_word: מִתַּחַת מַיִם
  choice: di bawah air
  rationale: Terjemahan ini mempertahankan gambaran ruang dalam bahasa Ibrani secara alami dan ringkas.
- source_word: וְשֹׁכְנֵיהֶם
  choice: demikian juga para penghuninya
  rationale: Akhiran pronominal paling wajar merujuk kepada air. 'Para penghuninya' mempertahankan paralelisme Ibrani tanpa menentukan lebih jauh siapa penghuni tersebut.
theological_decisions:
- issue: Rujukan רְפָאִים
  choice: arwah orang mati di alam maut
  alternative: orang Refaim sebagai bangsa kuno
  rationale: Konteks Ayub 26 menggambarkan kekuasaan Allah atas ranah kosmis dan alam maut. Karena itu, makna puitis 'orang mati/arwah orang mati' lebih sesuai daripada nama suatu bangsa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Struktur paralel dipertahankan, sementara hubungan kata ganti dibuat alami tanpa mempersempit rujukannya.
