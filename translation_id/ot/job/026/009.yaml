  yaml_path: translation/ot/job/026/009.yaml
  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: id
  text: 'Ia menutupi[a] permukaan takhta-Nya,

    dengan membentangkan awan-Nya di atasnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia memegang erat bagian depan takhta.” Verba Ibrani ini biasanya berarti “memegang” atau “mencengkeram”, tetapi di sini kemungkinan bermakna menutupi atau menyelubungi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: menutupi
  rationale: Secara lebih harfiah verba ini berarti 'memegang' atau 'mencengkeram', tetapi dalam paralelisme dengan tindakan membentangkan awan di atas takhta, makna kontekstualnya kemungkinan adalah menutupi atau menyelubungi.
- source_word: פְּנֵי
  choice: permukaan
  rationale: Kata Ibrani yang secara harfiah berarti 'wajah' dapat menunjuk pada bagian depan atau permukaan sesuatu. 'Permukaan' menghasilkan bahasa Indonesia yang alami sambil mempertahankan gambaran spasialnya.
- source_word: כִסֵּה
  choice: takhta-Nya
  rationale: Kata ini berarti 'takhta'. Sufiks milik tidak tertulis pada nomina ini, tetapi subjek ilahi yang tersirat dan frasa 'awan-Nya' mendukung pengungkapan hubungan tersebut dalam bahasa Indonesia.
- source_word: פַּרְשֵׁז
  choice: dengan membentangkan
  rationale: Bentuk langka ini dipahami sebagai tindakan membentangkan atau menghamparkan. Konstruksi 'dengan membentangkan' menghubungkan tindakan ini secara alami dengan klausa pertama.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Sufiks maskulin tunggal paling wajar merujuk kembali kepada takhta; bahasa Indonesia dapat memakai '-nya' untuk benda tersebut.
- source_word: עֲנָנוֹ
  choice: awan-Nya
  rationale: Nomina tunggal dengan sufiks orang ketiga maskulin tunggal berarti 'awan-Nya' dan mengacu kepada awan milik subjek ilahi.
theological_decisions:
- issue: Subjek tersirat dan kepemilikan takhta
  choice: Allah yang tersirat sebagai subjek menutupi takhta-Nya dengan awan-Nya.
  alternative: Menerjemahkan secara kurang eksplisit sebagai 'takhta itu', karena kata Ibrani untuk 'takhta' sendiri tidak memiliki sufiks kepunyaan.
  rationale: Konteks menggambarkan tindakan Allah, dan 'awan-Nya' secara eksplisit mengacu kepada subjek yang sama. 'Takhta-Nya' memperjelas hubungan yang sangat mungkin dimaksud tanpa menambahkan ajaran tertentu.
- issue: Makna verba מְאַחֵז
  choice: menutupi
  alternative: memegang atau mencengkeram
  rationale: Makna dasar verba tetap mungkin terdengar dalam bahasa sumber, tetapi gambaran awan yang dibentangkan di atas takhta kuat mendukung nuansa penyelubungan. Alternatif harfiah dipertahankan dalam catatan kaki agar ketegangan leksikal tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Baris kedua mempertahankan kesejajaran puisi Ibrani. 'Permukaan takhta' dipilih daripada ungkapan harfiah 'wajah takhta' agar mudah dipahami, sedangkan ambiguitas verba utama dijaga melalui catatan kaki.
