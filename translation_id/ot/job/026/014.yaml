base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: id
  text: Lihatlah, semua ini hanyalah ujung-ujung jalan-Nya[a]; betapa sayupnya bisikan yang kita dengar tentang Dia![b] Namun, siapakah yang dapat memahami guruh kuasa-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tepi-tepi jalan-Nya.” Bahasa Ibrani menunjukkan bahwa yang dimaksud hanyalah bagian-bagian paling luar dari jalan atau tindakan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “betapa sedikit yang kita dengar tentang Dia.” Ungkapan Ibrani yang langka ini menekankan bahwa yang terdengar amat sedikit dibandingkan dengan “guruh” kuasa-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Lihatlah
  rationale: Kata seru penunjuk ini mengarahkan perhatian dengan tegas. “Lihatlah” alami, bermartabat, dan tidak terlalu arkais.
- source_word: קְצוֹת
  choice: tepi-tepi
  rationale: Bentuk ini menunjuk pada ujung atau bagian terluar. “Tepi-tepi” mempertahankan gambaran bahwa yang tampak baru bagian paling luar dari tindakan Allah.
- source_word: דְּרָכָיו
  choice: jalan-Nya
  rationale: Terjemahan metaforis yang dekat dengan bahasa sumber dan tetap idiomatis dalam bahasa Indonesia; ini tidak mempersempit makna menjadi hanya karya-karya tertentu.
- source_word: שֵּׁמֶץ דָּבָר
  choice: bisikan yang samar
  rationale: Ungkapan langka ini menyatakan sesuatu yang amat sedikit atau sayup terdengar. “Bisikan yang samar” mempertahankan citra bunyi dan kontras puitis dengan “gemuruh” tanpa memaksakan terjemahan harfiah דָּבָר yang janggal.
- source_word: נִשְׁמַע בּוֹ
  choice: yang kita dengar tentang Dia
  rationale: Bentuk pasif dipahami secara kolektif dalam konteks. “Tentang Dia” menyatakan terbatasnya apa yang manusia tangkap mengenai Allah, bukan secara khusus perkataan yang berasal dari-Nya.
- source_word: רַעַם
  choice: gemuruh
  rationale: Kata ini lazim menunjuk pada guruh. “Gemuruh” menghasilkan citra bunyi yang kuat dan berkontras dengan bisikan.
- source_word: גְּבוּרָתוֹ
  choice: kuasa-Nya
  rationale: Menyatakan kekuatan atau keperkasaan; “kuasa-Nya” ringkas, wajar, dan sesuai dengan konteks kebesaran ilahi.
- source_word: יִתְבּוֹנָן
  choice: dapat memahami
  rationale: Kata kerja ini menyatakan pemahaman atau pengertian yang penuh perhatian. Pilihan ini mempertahankan pertanyaan retoris tentang keterbatasan manusia.
theological_decisions:
- issue: Cakupan pengetahuan manusia tentang Allah dalam bahasa puitis
  choice: Ayat ini menyatakan bahwa manusia hanya menangkap bagian terluar dan isyarat yang sangat samar dari jalan serta kuasa Allah.
  alternative: Ayat ini dapat dibaca lebih sempit sebagai pernyataan mengenai karya penciptaan Allah yang disebut dalam konteks dekat.
  rationale: Konteksnya memang memaparkan tindakan kosmis Allah, tetapi ungkapan “tepi-tepi jalan-Nya” dan “gemuruh kuasa-Nya” sengaja membiarkan cakupan puitisnya luas. Terjemahan tidak mengubahnya menjadi klaim filosofis yang lebih terperinci.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Kontras bunyi antara “bisikan” dan “gemuruh” dipertahankan.
