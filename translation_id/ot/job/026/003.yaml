translation:
  language: id
  text: Betapa engkau telah menasihati orang yang tidak berhikmat[a], dan menyatakan pertimbangan yang matang secara berlimpah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Nasihat apa yang telah kauberikan kepada orang yang tidak berhikmat, dan pertimbangan matang apa yang telah kaunyatakan secara berlimpah!” Kata pembuka Ibrani dapat dipahami sebagai “apa” atau sebagai seruan “betapa”; teks utama memakai “betapa” untuk mencerminkan sindiran Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Betapa
  rationale: Dalam konteks seruan bernada sindiran, מַה dapat menyatakan kadar atau keheranan. “Betapa” mempertahankan bentuk seruan dan ironi Ayub tanpa memasukkan penjelasan ke dalam teks.
- source_word: יָּעַצְתָּ
  choice: engkau telah menasihati
  rationale: Kata kerja יעץ berarti memberi nasihat atau pertimbangan. “Menasihati” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: לְלֹא חָכְמָה
  choice: orang yang tidak berhikmat
  rationale: Gabungan preposisi, penyangkalan, dan nomina abstrak ini menunjuk kepada pihak yang tidak memiliki hikmat. “Orang” melengkapi objek tersirat secara alami tanpa menentukan identitasnya.
- source_word: חָכְמָה
  choice: hikmat
  rationale: “Hikmat” adalah padanan baku dan sesuai bagi חָכְמָה dalam sastra hikmat.
- source_word: וְתוּשִׁיָּה
  choice: pertimbangan yang matang
  rationale: תּוּשִׁיָּה dapat menunjuk pada hikmat yang kokoh, penilaian yang tepat, atau kecakapan yang efektif. “Pertimbangan yang matang” alami dalam bahasa Indonesia dan membedakannya dari חָכְמָה pada klausa pertama.
- source_word: לָרֹב
  choice: dengan limpah
  rationale: Ungkapan ini menyatakan kadar yang besar. “Dengan limpah” mempertahankan penguatan bernada sindiran.
- source_word: הוֹדָעְתָּ
  choice: menyatakan
  rationale: Bentuk kausatif dari ידע berarti membuat sesuatu diketahui. Dalam konteks penyampaian hikmat, “menyatakan” menyampaikan makna itu secara ringkas dan alami.
