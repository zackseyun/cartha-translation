  text: How you have helped the powerless! How you have saved the arm without strength![a]
translation:
  language: id
  text: Betapa engkau telah menolong orang yang tidak berdaya! Betapa engkau telah menyelamatkan lengan yang tidak bertenaga![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Bagaimanakah engkau telah menolong orang yang tidak mempunyai kekuatan? Bagaimanakah engkau telah menyelamatkan—lengan yang tidak mempunyai keperkasaan?” Bahasa Ibraninya bernada sangat ironis.
    reason: Menampilkan bentuk seruan/interogatif yang lebih dekat dengan bahasa Ibrani serta menjelaskan ironi tajamnya.
lexical_decisions:
- source_word: מֶה
  choice: Betapa hebat
  rationale: Dalam pertanyaan retoris bernada seruan ini, מֶה menyatakan seruan ironis, bukan sekadar pertanyaan 'apa'. Ungkapan ini membuat sindiran Ayub terdengar jelas dan alami dalam bahasa Indonesia.
- source_word: עָזַרְתָּ
  choice: engkau telah menolong
  rationale: Bentuk dari עזר berarti 'menolong'. Kata ganti 'engkau' mempertahankan sapaan langsung kepada Bildad, sedangkan 'telah' menyampaikan aspek tindakan selesai dalam ungkapan retoris.
- source_word: לְלֹא כֹחַ
  choice: orang yang tidak berdaya
  rationale: Frasa ini secara harfiah menunjuk kepada seseorang yang tidak memiliki kekuatan. Bentuk tunggal 'orang' dipertahankan dengan ungkapan Indonesia yang alami.
- source_word: הוֹשַׁעְתָּ
  choice: engkau telah menyelamatkan
  rationale: Bentuk dari ישׁע memiliki arti dasar 'menyelamatkan' atau 'melepaskan'. 'Menyelamatkan' mempertahankan daya leksikal dan kesejajaran ironis dengan 'menolong'.
- source_word: זְרוֹעַ
  choice: lengan
  rationale: Kata ini secara harfiah berarti 'lengan' dan menjadi gambaran puitis bagi kekuatan. Metafora aslinya dipertahankan agar ironi pada frasa berikutnya tetap terasa.
- source_word: לֹא עֹז
  choice: tidak bertenaga
  rationale: עֹז berarti kekuatan atau keperkasaan. 'Tidak bertenaga' alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan 'tidak berdaya' tanpa menghapus variasi kosakata Ibrani.
theological_decisions:
- issue: Identitas orang yang tidak berdaya dan lengan yang tidak bertenaga
  choice: Tidak dijelaskan secara eksplisit dalam teks utama
  alternative: Menafsirkan keduanya secara langsung sebagai Ayub atau sebagai sindiran khusus terhadap nasihat Bildad
  rationale: Bahasa Ibrani bersifat retoris dan metaforis. Terjemahan mempertahankan ketegangan itu tanpa menetapkan rujukan teologis atau psikologis yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “Betapa hebat” dipakai untuk menyampaikan seruan ironis yang tajam; “lengan” dipertahankan sebagai metafora Ibrani, meskipun sengaja terdengar tidak biasa.
