  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: id
  text: Sesungguhnya[a], bila ia merobohkan, tidak ada yang dapat membangunnya kembali; bila ia mengurung seseorang[b], tidak ada yang dapat membukanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lihatlah” atau “Sungguh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menutup seseorang di dalam” atau “membatasi gerak seseorang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menandai penegasan dan dapat pula berfungsi menarik perhatian. “Sesungguhnya” menyampaikan daya penegasannya secara wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: יַהֲרוֹס
  choice: merobohkan sesuatu
  rationale: Kata kerja הרס menunjuk pada tindakan meruntuhkan atau merobohkan. “Merobohkan” mempertahankan gambaran bangunan yang diteruskan oleh kata “membangunnya kembali”; “sesuatu” melengkapi objek yang tersirat dalam bahasa Ibrani.
- source_word: וְלֹא יִבָּנֶה
  choice: tidak ada yang dapat membangunnya kembali
  rationale: Bentuk Nifal menyatakan bahwa yang telah dirobohkan itu tidak akan atau tidak dapat dibangun kembali. Susunan aktif tak tentu ini lebih alami dalam bahasa Indonesia dan menyampaikan ketidakmungkinan akibat tindakan tersebut.
- source_word: יִסְגֹּר עַל אִישׁ
  choice: mengurung seseorang
  rationale: סגר dengan עַל אִישׁ menyampaikan tindakan menutup atau mengurung seorang manusia. “Mengurung seseorang” mempertahankan gambaran konkret tanpa mempersempitnya menjadi pemenjaraan resmi.
- source_word: וְלֹא יִפָּתֵחַ
  choice: tidak ada yang dapat membukakan jalan keluar baginya
  rationale: Bentuk Nifal dari פתח berarti “dibuka.” Karena bahasa Indonesia memerlukan rujukan yang lebih jelas sesudah “mengurung seseorang,” frasa ini mengungkapkan gambaran pembukaan kurungan sebagai pembukaan jalan keluar, tanpa mengubah hasil akhirnya yang tak dapat dibatalkan.
theological_decisions:
- issue: Rujukan subjek ilahi
  choice: ia
  alternative: Allah; TUHAN; Dia
  rationale: Teks Ibrani memakai kata kerja orang ketiga tunggal tanpa menyebut nama atau gelar ilahi dalam ayat ini. “Ia” mempertahankan kesinambungan dengan konteks sekaligus tidak menambahkan sebutan yang tidak terdapat secara eksplisit dalam ayat.
- issue: Daya modal pada dua bentuk pasif negatif
  choice: tidak ada yang dapat
  alternative: tidak akan
  rationale: Secara bentuk, kedua klausa dapat diterjemahkan sebagai kejadian yang tidak akan berlangsung, tetapi konteks menekankan akibat tindakan ilahi yang tidak dapat dibalikkan. “Tidak ada yang dapat” menyampaikan daya itu tanpa menentukan mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang tegas dan bermartabat. Paralelisme kedua klausa dipertahankan melalui pola “bila ia ... tidak ada yang dapat ...”. Pronomina ilahi tidak dikapitalisasi agar tidak menambahkan penandaan teologis yang tidak dinyatakan oleh bentuk Ibrani.
