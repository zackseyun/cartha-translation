  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata 'pikiran' dipilih untuk menyampaikan fungsi intelektual לֵבָב, sedangkan bentuk pertanyaan retoris dipertahankan. Penanda catatan kaki [a] ditempatkan setelah klausa yang dijelaskannya.
