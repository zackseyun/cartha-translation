  yaml_path: translation/ot/job/012/003.yaml
  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: id
  text: Aku pun memiliki akal budi seperti kalian; aku tidak kalah daripada kalian.[a] Siapakah yang tidak mengetahui hal-hal seperti ini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku pun mempunyai hati seperti kalian.” Di sini “hati” menunjuk pada kemampuan memahami atau berpikir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: Aku pun mempunyai pikiran
  rationale: Secara harfiah berarti 'aku pun mempunyai hati', tetapi לֵבָב di sini menunjuk pada kemampuan berpikir dan memahami. 'Pikiran' menyampaikan maksud itu secara alami dalam bahasa Indonesia modern.
- source_word: כְּמוֹכֶם
  choice: seperti kamu
  rationale: Menyatakan bahwa Ayub memiliki kemampuan berpikir yang setara dengan para lawan bicaranya. Bentuk 'kamu' dapat merujuk kepada kelompok dalam bahasa Indonesia dan sesuai dengan konteks ujaran langsung.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: aku tidak lebih rendah daripada kamu
  rationale: Ungkapan נפל dengan מן menyatakan kedudukan yang tidak berada di bawah atau tidak kalah dari pihak lain; terjemahan ini mempertahankan perbandingan secara jelas.
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: Siapa yang tidak tahu hal-hal seperti ini?
  rationale: Klausa Ibrani ini eliptis dan dapat diterjemahkan sangat harfiah dengan ungkapan yang kabur. Dalam konteksnya, pertanyaan retoris Ayub menyatakan bahwa perkataan mereka merupakan pengetahuan umum.
theological_decisions: []
