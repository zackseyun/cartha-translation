  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: id
  text: Ia membawa para penasihat pergi dalam keadaan dilucuti[a], dan Ia membuat para hakim menjadi bodoh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dijarah” atau “sebagai jarahan”; kata Ibrani ini dapat menekankan bahwa para penasihat dibawa pergi dalam kehinaan dan kehilangan milik atau kedudukan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: menggiring
  rationale: Bentuk Hifil partisip dari הלך menyatakan tindakan kausatif membawa atau menuntun pergi. Dalam konteks orang-orang yang dibawa sebagai pihak kalah, “menggiring” secara alami menyampaikan gerak yang dipaksakan.
- source_word: יוֹעֲצִים
  choice: para penasihat
  rationale: Bentuk jamak dari יעץ menunjuk kepada orang-orang yang memberikan nasihat; “para penasihat” langsung, alami, dan sesuai dengan konteks para pemimpin masyarakat.
- source_word: שׁוֹלָל
  choice: sebagai orang-orang yang telah dirampasi
  rationale: Kata ini berkaitan dengan perampasan atau penjarahan dan menggambarkan keadaan hina serta kehilangan milik. Rumusan ini mempertahankan gagasan bahwa mereka dibawa pergi dalam keadaan telah dilucuti dari kepunyaan atau kedudukan, tanpa membatasi maknanya pada ketelanjangan atau keadaan tanpa alas kaki.
- source_word: שֹׁפְטִים
  choice: para hakim
  rationale: Kata dari akar שפט paling langsung berarti orang-orang yang menghakimi, meskipun dalam konteks kuno mereka juga dapat menjalankan fungsi pemerintahan. “Para hakim” mempertahankan padanan sosial dengan “para penasihat”.
- source_word: יְהוֹלֵל
  choice: membuat ... menjadi bodoh
  rationale: Bentuk Piel imperfek dari הלל II bersifat kausatif, yakni membuat seseorang bodoh atau bertindak tidak masuk akal. Ungkapan ini jelas dan tetap dekat dengan bentuk sumber.
theological_decisions:
- issue: Subjek tersirat dalam ayat
  choice: “Ia”, yang mengacu kepada Allah dalam konteks sebelumnya
  alternative: Mengulangi nama “Allah” secara eksplisit
  rationale: Bahasa Ibrani tidak menyebutkan subjek secara tersurat dalam ayat ini, tetapi konteks Ayub 12 mengacu kepada Allah. Pronomina “Ia” melengkapi kalimat Indonesia tanpa menambahkan nama yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menggiring” dipilih untuk menggambarkan pembawaan tawanan secara paksa, sedangkan frasa catatan kaki mempertahankan rentang makna שׁוֹלָל.
