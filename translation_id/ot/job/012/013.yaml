  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: id
  text: Pada-Nya ada hikmat dan keperkasaan; milik-Nya nasihat dan pengertian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמּוֹ
  choice: Pada-Nya ada
  rationale: Preposisi עִם dengan sufiks secara harfiah menyatakan 'bersama Dia'; dalam klausa nominal puitis ini, ungkapan Indonesia 'pada-Nya ada' menyampaikan asosiasi sekaligus kepemilikan tanpa mengubahnya menjadi gagasan lokasi 'di dalam-Nya'.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan bermartabat untuk חָכְמָה, yakni kebijaksanaan dan kecakapan memahami dengan benar.
- source_word: וּגְבוּרָה
  choice: dan keperkasaan
  rationale: גְבוּרָה menunjuk pada kekuatan atau kuasa. 'Keperkasaan' menjaga corak puitis dan menyandingkannya secara alami dengan 'hikmat'.
- source_word: לוֹ
  choice: milik-Nya
  rationale: ל dengan sufiks menandai kepemilikan dalam klausa tanpa verba. 'Milik-Nya' ringkas, alami, dan mempertahankan paralelisme Ibrani.
- source_word: עֵצָה
  choice: nasihat
  rationale: עֵצָה dapat berarti nasihat, pertimbangan, atau rancangan. 'Nasihat' mempertahankan cakupan deliberatif kata itu tanpa mempersempitnya menjadi satu rencana tertentu.
- source_word: וּתְבוּנָה
  choice: dan pengertian
  rationale: תְבוּנָה berarti pengertian, wawasan, atau daya membedakan. 'Pengertian' merupakan padanan luas yang sesuai dengan pasangan puitisnya.
theological_decisions:
- issue: Rujukan sufiks pronominal maskulin tunggal
  choice: Mempertahankan pronomina tersirat melalui bentuk '-Nya', dengan konteks yang mengidentifikasikan rujukannya sebagai Allah.
  alternative: Menyebut 'Allah' secara eksplisit.
  rationale: Teks Ibrani memakai sufiks pronominal, bukan nama Allah. Bentuk '-Nya' menjaga kedekatan dengan bentuk sumber serta membiarkan konteks menetapkan rujukannya.
- issue: Hubungan hikmat dan keperkasaan dengan Allah
  choice: Mengungkapkannya sebagai kualitas yang ada pada-Nya dan menjadi milik-Nya.
  alternative: Menerjemahkan 'di dalam-Nya', yang dapat memberi nuansa inherensi metafisik lebih tegas.
  rationale: עִם paling langsung berarti 'bersama/pada', sedangkan ל menyatakan kepemilikan. Terjemahan tidak mempertegas formulasi metafisik melampaui bahasa puisi Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Paralelisme dua bagian dipertahankan; kapitalisasi '-Nya' mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah tanpa mengganti pronomina sumber dengan nama diri.
