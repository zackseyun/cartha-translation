  naturalness: '''Kemah-kemah para penjarah hidup tenteram'' dan ''orang-orang yang membangkitkan murka Allah merasa aman'' baku dan puitis. Revisi ''Allah beri sesuatu ke tangan mereka'' tetap alami dalam bahasa Indonesia, sekaligus menandai objek yang memang tidak dinyatakan dalam Ibrani dengan kata ''sesuatu''.'
  terminology: '''Penjarah'', ''Allah'', ''membangkitkan murka Allah'', dan ''merasa aman'' sesuai register hikmat. Kapitalisasi ''Allah'' dipertahankan untuk pembacaan utama, tetapi catatan kaki menjelaskan bahwa אֱלוֹהַּ juga dapat dipahami secara ironis sebagai ''allah'' orang fasik.'
