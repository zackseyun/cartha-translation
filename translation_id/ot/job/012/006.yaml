  to: 'Kemah-kemah para penjarah hidup tenteram,

    dan orang-orang yang membangkitkan murka Allah merasa aman—

    mereka yang Allah beri sesuatu ke tangan mereka.[a]'
  rationale: Revisi mempertahankan paralelisme dan register draf, tetapi mengganti pembacaan utama yang secara gramatikal tidak aman. 'Allah beri sesuatu ke tangan mereka' menyatakan pembacaan umum bahwa Allah adalah subjek, sambil mengakui melalui 'sesuatu' bahwa objek Ibrani tidak dinyatakan. Catatan kaki mempertahankan alternatif penting tanpa menjadikan salah satunya kepastian teologis.
