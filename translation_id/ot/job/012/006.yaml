  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: id
  text: 'Kemah-kemah para penjarah hidup tenteram,

    dan orang-orang yang membangkitkan murka Allah merasa aman—

    mereka yang Allah beri sesuatu ke tangan mereka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Klausa terakhir dalam bahasa Ibrani sulit dipastikan; secara harfiah, “kepada/untuk orang yang Allah bawa dalam tangannya.” Objek kata kerja “bawa” tidak disebutkan. Kemungkinan terjemahan lain: “mereka yang Allah bawa ke dalam tangan-Nya,” atau, secara ironis, “mereka yang allahnya membawa ke tangan mereka.” Karena itu, klausa ini dapat menunjuk pada tindakan Allah sejati atau pada kuasa yang diandalkan orang fasik sebagai allah.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: hidup tenteram
  rationale: Kata kerja ini menyatakan keadaan tenang dan tidak terganggu; pilihan ini mempertahankan ironi bahwa para penjarah justru menikmati ketenteraman.
- source_word: אֹהָלִים לְשֹׁדְדִים
  choice: kemah-kemah para penjarah
  rationale: Gambaran konkret 'kemah' dipertahankan, sedangkan שֹׁדְדִים diterjemahkan 'penjarah' untuk menyatakan pelaku perampasan dengan kekerasan.
- source_word: וּבַטֻּחוֹת
  choice: merasa aman
  rationale: Ungkapan ini menyampaikan keadaan aman atau penuh rasa percaya; 'merasa aman' mengalir alami dalam bahasa Indonesia dan sejajar dengan 'hidup tenteram'.
- source_word: לְמַרְגִּיזֵי אֵל
  choice: orang-orang yang membangkitkan murka Allah
  rationale: Bentuk kausatif רגז menunjukkan bahwa mereka membuat Allah murka atau memprovokasi-Nya. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: mereka yang membawa allah mereka dalam genggaman tangan
  rationale: Klausa Ibrani ini sangat sulit. Terjemahan utama memahami אֱלוֹהַּ sebagai objek dari 'membawa' dan menggambarkan orang fasik yang memegang atau membawa allahnya sendiri. 'Dalam genggaman tangan' juga memungkinkan sindiran terhadap kuasa yang dijadikan allah, tanpa menjadikannya eksplisit dalam teks utama.
theological_decisions:
- issue: Acuan dan fungsi אֱלוֹהַּ dalam klausa terakhir
  choice: allah milik orang fasik yang dibawa dalam genggaman mereka
  alternative: 'Allah sejati sebagai subjek: ''mereka yang ke tangannya Allah membawa [sesuatu]'' atau sebagai objek: ''orang yang Allah bawa ke dalam tangan-Nya'''
  rationale: Tanpa penanda objek, tata bahasa Ibrani memungkinkan אֱלוֹהַּ dipahami sebagai objek ataupun subjek. Bacaan utama cocok dengan kecaman terhadap penyembahan atau kepercayaan orang fasik kepada sesuatu yang berada dalam kuasanya, tetapi kemungkinan bahwa yang dimaksud ialah Allah sejati tetap dicatat karena sintaksisnya tidak pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puisi hikmat yang lugas dan bermartabat. Pengulangan 'kemah-kemah' mempertahankan bentuk jamak konkret, dan tanda pisah menandai klausa penjelas yang secara sintaksis sulit. Huruf kecil pada 'allah mereka' menandai ilah milik orang fasik, sedangkan 'Allah' memakai huruf besar ketika menunjuk kepada Allah sejati.
