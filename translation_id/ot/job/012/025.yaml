  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְמַֽשְׁשׁוּ חֹ֥שֶׁךְ וְ/לֹא א֑וֹר וַ֝/יַּתְעֵ֗/ם כַּ/שִּׁכּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: id
  text: Mereka meraba-raba dalam kegelapan, tanpa cahaya; Dia membuat mereka terhuyung-huyung seperti orang mabuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia membuat mereka mengembara” atau “Dia membuat mereka tersesat.” Kata Ibrani dapat berarti mengembara atau tersesat; dalam konteks ini, perbandingan dengan orang mabuk mendukung terjemahan “terhuyung-huyung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: mereka meraba-raba
  rationale: Bentuk Piel dari משש menggambarkan tindakan mencari jalan dengan rabaan ketika tidak dapat melihat; pengulangan pada 'meraba-raba' alami dalam bahasa Indonesia dan mempertahankan gambaran disorientasi.
- source_word: חֹשֶׁךְ
  choice: dalam kegelapan
  rationale: חֹשֶׁךְ lazim berarti 'kegelapan'; preposisi 'dalam' dibuat eksplisit secara idiomatis sesuai gambaran meraba-raba.
- source_word: וְלֹא אוֹר
  choice: tanpa cahaya
  rationale: Secara harfiah 'dan tidak ada cahaya'; 'tanpa cahaya' ringkas, alami, dan mempertahankan kontras yang tegas.
- source_word: וַיַּתְעֵם
  choice: Dia membuat mereka terhuyung-huyung
  rationale: Bentuk kausatif dari תעה berarti membuat mengembara atau tersesat. Dalam konteks kegelapan dan perbandingan dengan orang mabuk, 'terhuyung-huyung' menyampaikan disorientasi fisik dengan wajar, sementara alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: ־ם (akhiran dalam וַיַּתְעֵם)
  choice: mereka
  rationale: Akhiran pronominal orang ketiga jamak maskulin berfungsi sebagai objek dan merujuk kembali kepada kelompok jamak dalam konteks.
- source_word: כַּשִּׁכּוֹר
  choice: seperti orang mabuk
  rationale: Kata ini menunjuk kepada seseorang yang mabuk. 'Orang mabuk' merupakan ungkapan Indonesia yang alami, jelas, dan tetap bermartabat.
theological_decisions:
- issue: Subjek tersirat dalam וַיַּתְעֵם
  choice: Dia membuat mereka terhuyung-huyung
  alternative: mereka terhuyung-huyung
  rationale: Bentuk verba adalah orang ketiga tunggal maskulin dengan objek orang ketiga jamak, sehingga subjek tunggal tersirat harus dipertahankan. Dalam konteks yang lebih luas, subjeknya adalah Allah; kapitalisasi 'Dia' memperjelas rujukan tersebut tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. 'Meraba-raba', 'kegelapan', dan 'terhuyung-huyung' mempertahankan citraan konkret Ibrani. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
