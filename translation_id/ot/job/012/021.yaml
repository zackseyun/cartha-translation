  text: שׁוֹפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וּ/מְזִ֖יחַ אֲפִיקִ֣ים רִפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: id
  text: Ia mencurahkan penghinaan kepada para bangsawan dan melonggarkan ikat pinggang orang-orang kuat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gambaran melonggarkan ikat pinggang menyiratkan hilangnya kekuatan, kesiapan, atau wewenang.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: mencurahkan
  rationale: Partisipel שׁפך mempertahankan gambaran tindakan yang terus atau khas dilakukan; 'mencurahkan' alami dengan objek abstrak 'penghinaan' dan menjaga metafora sumber.
- source_word: בּוּז
  choice: penghinaan
  rationale: בּוּז menyatakan penghinaan atau cercaan. 'Penghinaan' cocok dengan konteks pembalikan kedudukan dan dapat berarti tindakan yang mempermalukan di depan umum.
- source_word: נְדִיבִים
  choice: para bangsawan
  rationale: Dalam konteks ini נְדִיבִים menunjuk kepada orang-orang berkedudukan tinggi atau pemuka, bukan terutama sifat murah hati. 'Para bangsawan' menjaga makna sosial tanpa membatasinya pada pangeran kerajaan.
- source_word: מְזִיחַ
  choice: ikat pinggang
  rationale: Istilah ini menunjuk pada sabuk atau pengikat tubuh. 'Ikat pinggang' merupakan padanan Indonesia modern yang konkret dan mempertahankan citra puitis.
- source_word: אֲפִיקִים
  choice: orang-orang kuat
  rationale: Dalam paralelisme ini אֲפִיקִים paling mungkin menunjuk kepada orang-orang yang kuat atau berkuasa. 'Orang-orang kuat' mempertahankan keluasan makna tanpa membatasi pada kekuatan militer atau jabatan tertentu.
- source_word: רִפָּה
  choice: melonggarkan
  rationale: רפה berarti membuat longgar atau kendur. 'Melonggarkan' secara langsung mempertahankan tindakan konkret terhadap ikat pinggang sekaligus menyiratkan hilangnya kesiapan atau kekuatan.
theological_decisions:
- issue: Gambaran metaforis tentang penghinaan dan pelucutan kuasa oleh Allah
  choice: Mempertahankan ungkapan konkret 'melonggarkan ikat pinggang orang-orang kuat' dalam teks utama.
  alternative: Melucuti orang-orang kuat; menghilangkan kekuatan orang-orang perkasa.
  rationale: Bahasa Ibrani memakai citra ikat pinggang yang dilonggarkan. Mempertahankan metafora menjaga daya puitis serta ambiguitas apakah yang hilang ialah kekuatan, kesiapan, martabat, atau wewenang, tanpa mempersempitnya menjadi tindakan militer.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan dua klausa paralel dipertahankan. Pronomina 'Ia' mengikuti konteks yang menunjuk kepada Allah. Penanda catatan kaki [a] ditempatkan langsung sesudah ungkapan yang dijelaskan.
