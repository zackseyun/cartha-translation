  yaml_path: translation/ot/job/012/012.yaml
  text: With the aged is wisdom[a], and with length of days[b], understanding.
translation:
  language: id
  text: Pada orang lanjut usia ada hikmat[a], dan dalam umur panjang[b] ada pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Di antara orang lanjut usia ada hikmat.” Preposisi Ibrani dapat menyatakan hubungan atau tempat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “panjang hari-hari”; maksudnya umur panjang atau hidup selama banyak hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: pada orang-orang lanjut usia
  rationale: Preposisi ב dapat menyatakan keberadaan atau lingkungan tempat sesuatu dijumpai. Pilihan ini mempertahankan hubungan hikmat dengan kaum lanjut usia tanpa membatasi rujukan hanya kepada laki-laki.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan wajar bagi חָכְמָה dalam sastra hikmat.
- source_word: וְאֹרֶךְ יָמִים
  choice: dan pada panjang umur
  rationale: Mempertahankan ungkapan harfiah Ibrani 'panjang hari-hari' dalam bentuk Indonesia yang alami serta menjaga kesejajaran puitis.
- source_word: תְּבוּנָה
  choice: pengertian
  rationale: Menyatakan kemampuan memahami dan menimbang dengan tepat, serta berpasangan secara alami dengan 'hikmat' tanpa menyamakan sepenuhnya kedua istilah.
