  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: id
  text: Siapakah di antara semuanya itu yang tidak tahu bahwa tangan Yahweh telah melakukan hal ini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisional yang umum dikenal.
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: Siapa ... yang tidak tahu
  rationale: Bentuk tanya retoris dipertahankan secara langsung dan alami dalam bahasa Indonesia; verba perfektif Ibrani di sini menyatakan pengenalan yang dianggap umum, sehingga diterjemahkan dengan bentuk kini "tahu".
- source_word: בְּ/כָל אֵלֶּה
  choice: di antara semua ini
  rationale: Preposisi ב dalam frasa ini paling wajar dipahami secara partitif atau distributif, menunjuk kepada semua makhluk yang disebut dalam konteks sebelumnya.
- source_word: כִּי
  choice: bahwa
  rationale: Konjungsi ini memperkenalkan isi dari apa yang diketahui, bukan alasan sebab-akibat.
- source_word: יַד
  choice: tangan
  rationale: Metafora antropomorfis Ibrani dipertahankan karena jelas dan lazim, serta menyampaikan gagasan tentang kuasa dan tindakan langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai "Yahweh" agar nama diri dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: עָשְׂתָה זֹּאת
  choice: telah melakukan hal ini
  rationale: Terjemahan ini mempertahankan arti luas עשה, yakni "melakukan/membuat", serta bentuk tunggal demonstratif זֹּאת tanpa memperluasnya menjadi bentuk jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk "Yahweh" mempertahankan fungsi nama tersebut, sementara catatan kaki menjelaskan padanan tradisionalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan retoris dibuat alami, sedangkan ungkapan kiasan "tangan Yahweh" dan ketegangan semantis antara "melakukan" serta "membuat" dipertahankan sedekat mungkin dengan teks Ibrani.
