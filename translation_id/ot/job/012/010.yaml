reference: Job 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: id
  text: Di tangan-Nya ada nyawa segala yang hidup dan napas setiap manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jiwa segala yang hidup dan roh seluruh daging manusia.”'
    reason: Alternatif leksikal yang lebih harfiah untuk נֶפֶשׁ, רוּחַ, dan כָּל בְּשַׂר אִישׁ.
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Di tangan-Nya
  rationale: Ungkapan relatif Ibrani ini merujuk kepada Allah dalam konteks sebelumnya. Metafora “di tangan-Nya” dipertahankan karena menyatakan kuasa dan kendali-Nya secara alami dalam bahasa Indonesia.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam konteks ini kata tersebut menunjuk pada kehidupan yang menghidupkan makhluk, bukan dengan pasti pada ‘jiwa’ sebagai unsur tak berjasmani. ‘Nyawa’ alami dalam bahasa Indonesia dan sejalan dengan paralelnya, ‘napas’.
- source_word: כָּל חָי
  choice: segala yang hidup
  rationale: Pilihan ini mempertahankan cakupan menyeluruh ungkapan Ibrani tanpa membatasinya hanya pada manusia.
- source_word: וְרוּחַ
  choice: dan napas
  rationale: Dalam paralelisme dengan נֶפֶשׁ dan hubungannya dengan manusia sebagai makhluk fana, רוּחַ paling wajar menyatakan napas atau daya hidup. Kemungkinan ‘roh’ tetap dicatat dalam catatan kaki.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: setiap manusia
  rationale: Ungkapan harfiah ‘seluruh daging manusia’ menunjuk secara kolektif pada umat manusia dalam kefanaan jasmaninya. ‘Setiap manusia’ menyampaikan cakupan universal itu dengan bahasa Indonesia yang jelas dan alami.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ dan רוּחַ
  choice: Diterjemahkan sebagai ‘nyawa’ dan ‘napas’.
  alternative: ‘jiwa’ dan ‘roh’
  rationale: Konteks menekankan bahwa kehidupan semua makhluk berada dalam kuasa Allah. Pilihan konkret ini tidak memaksakan pembedaan tubuh-jiwa yang lebih tajam daripada yang dituntut teks, sementara alternatif leksikalnya dipertahankan dalam catatan kaki.
- issue: Cakupan כָּל בְּשַׂר אִישׁ
  choice: setiap manusia
  alternative: seluruh daging manusia
  rationale: Terjemahan utama menyampaikan rujukan universal kepada manusia secara wajar, sedangkan bentuk harfiahnya dicatat agar gambaran tentang kefanaan jasmani tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur puitis dua bagian dipertahankan; metafora tangan Allah tetap eksplisit, sedangkan istilah antropologis diterjemahkan secara konkret tanpa menutup kemungkinan ‘jiwa/roh’.
