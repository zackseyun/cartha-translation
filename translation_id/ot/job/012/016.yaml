  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: id
  text: Pada-Nya ada kekuatan dan kebijaksanaan yang sehat; milik-Nyalah orang yang tersesat dan orang yang menyesatkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “orang yang tertipu dan penipu.” Kedua partisip Ibrani dapat diterjemahkan lebih ringkas demikian, tetapi teks utama mempertahankan kontras verbal: yang satu tersesat, yang lain menyesatkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: Pada-Nya ada
  rationale: Ungkapan ini menyatakan bahwa kekuatan dan hikmat berada pada Allah, yakni menjadi milik-Nya dan tersedia bagi-Nya, sambil tetap mempertahankan corak idiom Ibrani.
- source_word: עֹז
  choice: kekuatan
  rationale: Kata ini lazim menunjuk pada kekuatan atau keperkasaan; “kekuatan” paling alami dan luas dalam bahasa Indonesia modern.
- source_word: תּוּשִׁיָּה
  choice: hikmat yang teguh
  rationale: Dalam sastra hikmat, kata ini menunjuk pada hikmat yang mantap, efektif, dan dapat diandalkan. Pilihan ini mempertahankan nuansa yang lebih penuh daripada sekadar “hikmat” tanpa menggesernya menjadi “keberhasilan”.
- source_word: לוֹ
  choice: milik-Nyalah
  rationale: Preposisi dengan akhiran pronominal di sini menyatakan kepemilikan atau lingkup kekuasaan. Bentuk ini juga mencerminkan penekanan pada awal bagian kedua.
- source_word: שֹׁגֵג
  choice: orang yang tersesat
  rationale: Partisip Qal ini menggambarkan orang yang keliru atau menyimpang. Pilihan ini mempertahankan makna intransitif bentuk Ibraninya dan tidak secara otomatis menjadikannya korban penipuan.
- source_word: מַשְׁגֶּה
  choice: orang yang menyesatkan
  rationale: Partisip Hifil ini menunjuk pada orang yang menyebabkan orang lain tersesat. Ungkapan ini mempertahankan hubungan verbal dengan “orang yang tersesat”.
theological_decisions:
- issue: Hubungan Allah dengan orang yang tersesat dan orang yang menyesatkan
  choice: Keduanya disebut milik Allah, tanpa menjelaskan bahwa Allah secara moral menyebabkan kesesatan.
  alternative: Allah mengetahui keduanya; Allah mengendalikan keduanya dalam pemeliharaan-Nya; atau Allah menjadi sumber langsung kesesatan dan penyesatan.
  rationale: Teks menyatakan secara kuat bahwa keduanya adalah milik-Nya atau berada dalam wilayah kedaulatan-Nya. Terjemahan tidak memperluas pernyataan itu menjadi klaim tentang penyebab moral, sehingga ketegangan teologis teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme dipertahankan melalui “Pada-Nya ada” dan “milik-Nyalah”, sedangkan pasangan “tersesat/menyesatkan” mencerminkan perbedaan bentuk Qal dan Hifil.
