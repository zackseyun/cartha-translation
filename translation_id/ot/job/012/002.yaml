  text: אָ֭מְנָם כִּ֣י אַתֶּם עָ֑ם וְ֝/עִמָּ/כֶ֗ם תָּמ֥וּת חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/002.yaml
  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: id
  text: Memang, kalianlah orang-orangnya, dan bersama kalian hikmat akan mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh, kalianlah orang-orangnya, dan bersama kalian hikmat akan lenyap.” Perkataan ini umumnya dipahami sebagai sindiran yang ditujukan kepada sahabat-sahabat Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: Memang
  rationale: Gabungan ini menguatkan pernyataan. “Memang” terdengar alami dalam bahasa Indonesia dan, dalam konteks jawaban Ayub, tetap memungkinkan nada sindiran.
- source_word: אַתֶּם
  choice: kalianlah
  rationale: Pronomina orang kedua jamak ini menunjuk langsung kepada sahabat-sahabat Ayub; partikel “-lah” menonjolkan mereka sebagai subjek klaim yang disindir.
- source_word: עָם
  choice: umat itu
  rationale: Secara harfiah berarti “umat/bangsa.” Frasa “umat itu” mempertahankan bentuk ungkapan Ibrani yang menampilkan mereka seolah-olah sebagai umat yang paling menentukan, tanpa menjabarkan sindirannya di dalam teks.
- source_word: וְעִמָּכֶם
  choice: dan bersama kalian
  rationale: Menerjemahkan konjungsi dan frasa preposisional secara langsung serta menghubungkan nasib hikmat dengan nasib orang-orang yang disapa.
- source_word: תָּמוּת חָכְמָה
  choice: hikmat akan mati
  rationale: Verba feminin tunggal “akan mati” sesuai dengan subjek “hikmat.” Terjemahan langsung ini mempertahankan personifikasi dan ketajaman ironi.
theological_decisions:
- issue: Nada ucapan Ayub
  choice: Teks utama mempertahankan pernyataan dalam bentuk lugas, sedangkan catatan menjelaskan bahwa ucapan itu umumnya dipahami sebagai sindiran.
  alternative: Memasukkan penanda eksplisit seperti “tentu saja” atau “seolah-olah” ke dalam teks utama.
  rationale: Bahasa Ibrani menguatkan pernyataan tetapi tidak memberi penanda leksikal khusus yang secara tegas menyebut sindiran; kontekslah yang terutama membentuk nada tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak; susunan kalimat dijaga ringkas untuk mempertahankan daya gigit ucapan Ayub.
