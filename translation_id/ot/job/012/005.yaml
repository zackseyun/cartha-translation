translation:
  language: id
  text: Obor dipandang hina dalam pikiran orang yang hidup tenteram; obor itu siap bagi mereka yang kakinya tergelincir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat Ibrani ini sulit. Bagian terakhir juga dapat dipahami sebagai “siap bagi kaki yang tergelincir” atau “ditetapkan bagi orang yang kakinya tergelincir.”
    reason: Memberi tahu pembaca tentang kepadatan sintaksis dan ketidakpastian makna נָכוֹן לְמוֹעֲדֵי רָגֶל tanpa membebani teks utama.
lexical_decisions:
- source_word: לַפִּיד
  choice: obor
  rationale: Makna dasarnya adalah obor atau suluh; “obor” merupakan padanan modern yang jelas.
- source_word: בּוּז
  choice: dipandang hina
  rationale: Nomina “penghinaan” dipahami secara predikatif dalam klausa nominal Ibrani; ungkapan ini mempertahankan gagasan bahwa obor menjadi sasaran penghinaan.
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: oleh orang yang hidup tenteram
  rationale: עַשְׁתּוּת merupakan bentuk langka dan maknanya diperdebatkan; dalam konteks ini diikuti pemahaman “pikiran/pandangan” orang yang aman atau tenteram, lalu diungkapkan secara alami tanpa menjadikan “pikiran” sebagai lokasi harfiah.
- source_word: נָכוֹן
  choice: tersedia
  rationale: Kata ini dapat berarti siap, tersedia, atau ditetapkan. “Tersedia” mempertahankan kaitan praktis obor dengan orang yang membutuhkan pertolongan.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: bagi mereka yang kakinya tergelincir
  rationale: Frasa Ibrani sulit dan dapat dipahami sebagai mereka yang terancam atau mengalami kegoyahan kaki; pilihan ini mengikuti paralel kontekstual antara rasa aman dan keadaan mudah jatuh.
theological_decisions:
- issue: Hubungan kedua klausa dan rujukan נָכוֹן
  choice: “obor itu” dipahami tetap sebagai subjek tersirat pada klausa kedua
  alternative: Memahami sesuatu atau seseorang yang dihina sebagai pihak yang telah ditetapkan bagi mereka yang kakinya tergelincir
  rationale: Struktur puitis paling alami mempertahankan לַפִּיד sebagai pokok gambaran, tetapi teks Ibrani ringkas sehingga rujukan tepatnya tidak sepenuhnya eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora “obor” dipertahankan, sedangkan susunan klausa dibuat alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
