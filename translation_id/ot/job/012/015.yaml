base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: id
  text: Lihatlah, bila Dia menahan air, air itu mengering; bila Dia melepaskannya, air itu menjungkirbalikkan bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “daratan.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “daratan/negeri”, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Kata ini mengarahkan perhatian kepada pernyataan yang tegas dan hidup. “Lihatlah” mempertahankan daya serunya dalam bahasa Indonesia modern.
- source_word: יַעְצֹר בַּמַּיִם
  choice: menahan air
  rationale: Kata kerja עצר dengan מַיִם menyatakan tindakan menahan atau menghentikan air. Bahasa Indonesia lazim memakai bentuk tunggal kolektif “air” untuk מַיִם.
- source_word: וְיִבָשׁוּ
  choice: air itu mengering
  rationale: Bentuk jamak verba secara gramatikal dapat merujuk kembali kepada מַיִם. Terjemahan ini mempertahankan rujukan tersebut tanpa menambahkan subjek lain yang tidak dinyatakan dalam teks.
- source_word: וִישַׁלְּחֵם
  choice: bila Dia melepaskannya
  rationale: Akhiran pronominal paling wajar merujuk kepada air. “Melepaskan” menyampaikan kebalikan dari tindakan menahan dan cocok dengan kesejajaran bersyarat dalam ayat ini.
- source_word: וְיַהַפְכוּ
  choice: menjungkirbalikkan
  rationale: Kata הפך menggambarkan pembalikan atau pergolakan yang kuat. “Menjungkirbalikkan” mempertahankan gambaran puitis dan daya rusaknya tanpa membatasinya pada peristiwa banjir tertentu.
- source_word: אָרֶץ
  choice: bumi
  rationale: Dalam pernyataan hikmat mengenai kuasa Allah atas air, “bumi” cocok dengan cakupan luas ayat ini. Namun, kata Ibrani tersebut juga dapat berarti daratan atau negeri, sehingga alternatifnya dicatat.
theological_decisions:
- issue: Cakupan אָרֶץ dalam gambaran puitis tentang kuasa ilahi
  choice: bumi
  alternative: daratan
  rationale: “Bumi” mempertahankan kemungkinan cakupan universal dan tidak mengaitkan ayat ini secara khusus dengan kisah banjir tertentu. Karena konteks air juga memungkinkan makna “daratan”, ambiguitas leksikalnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Kata ganti “Dia” dipakai karena subjek tersiratnya adalah Allah dalam konteks, sedangkan bentuk kolektif “air” alami dalam bahasa Indonesia.
