  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׂחֹ֤ק לְ/רֵעֵ֨/הוּ אֶֽהְיֶ֗ה קֹרֵ֣א לֶ֭/אֱלוֹהַּ וַֽ/יַּעֲנֵ֑/הוּ שְׂ֝ח֗וֹק צַדִּ֥יק תָּמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: id
  text: Aku menjadi bahan tertawaan bagi kawanku[a]—aku yang berseru kepada Allah, lalu Dia menjawabku[b]. Orang yang benar dan tak bercela menjadi bahan tertawaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagi kawannya”; dalam konteks, yang dimaksud tampaknya kawan Ayub.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “lalu Dia menjawabnya”; orang yang dijawab adalah Ayub sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: bahan tertawaan
  rationale: Nomina ini menunjuk pada seseorang yang dijadikan sasaran tawa atau ejekan. “Bahan tertawaan” alami dalam bahasa Indonesia dan mempertahankan pengulangannya dalam ayat.
- source_word: לְרֵעֵהוּ
  choice: bagi kawanku
  rationale: Dalam konteks, Ayub sedang berbicara tentang dirinya dan kawan-kawannya. Bentuk Ibrani secara formal dapat dipahami “bagi kawannya”; ketegangan pronominal itu dipertahankan dalam catatan kaki.
- source_word: אֶהְיֶה
  choice: Aku menjadi
  rationale: Bentuk imperfek menyatakan keadaan Ayub dalam konteks keluhannya. “Menjadi” juga dapat memuat nuansa bahwa ia kini diperlakukan sebagai bahan tertawaan.
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: aku yang berseru kepada Allah
  rationale: Partisip ini menerangkan Ayub sebagai orang yang berseru kepada Allah. Klausa relatif menghasilkan bahasa Indonesia yang jelas tanpa menghilangkan hubungan dengan pembicara.
- source_word: וַיַּעֲנֵהוּ
  choice: lalu Dia menjawabku
  rationale: Subjek tersirat paling wajar adalah Allah, sedangkan objek orang ketiga secara referensial menunjuk kepada Ayub. Terjemahan memakai orang pertama agar alur wacana alami, sementara bentuk harfiahnya dicatat.
- source_word: צַדִּיק
  choice: benar
  rationale: Kata ini menyatakan kelurusan atau kebenaran moral dalam konteks sastra hikmat.
- source_word: תָּמִים
  choice: tak bercela
  rationale: Kata ini menunjuk pada keutuhan integritas, bukan kesempurnaan mutlak tanpa dosa. “Tak bercela” sesuai dengan penggambaran Ayub dalam kitab ini.
theological_decisions:
- issue: Apakah sebutan תָּמִים menyatakan kesempurnaan tanpa dosa
  choice: “tak bercela” sebagai bahasa tentang integritas
  alternative: “sempurna”
  rationale: Dalam sastra hikmat, תָּמִים terutama menyatakan keutuhan dan integritas. Pilihan ini mempertahankan bobot penilaian moral teks tanpa mengubahnya menjadi klaim eksplisit tentang ketidakberdosaan mutlak.
- issue: Hubungan frasa “orang yang benar dan tak bercela” dengan “bahan tertawaan”
  choice: Membacanya sebagai klausa nominal yang merangkum keadaan Ayub
  alternative: Membaca orang benar dan tak bercela sebagai pihak yang menertawakan Ayub
  rationale: Urutan Ibrani שְׂחוֹק צַדִּיק תָּמִים paling langsung mendukung pengertian “orang benar dan tak bercela [menjadi] bahan tertawaan,” selaras dengan pengulangan שְׂחֹק dan keluhan Ayub.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “bahan tertawaan” dipertahankan untuk mencerminkan struktur dan penekanan teks Ibrani. Tanda pisah menandai keterangan tentang Ayub tanpa menghapus ketegangan sintaksis ayat.
