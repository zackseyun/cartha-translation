  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: id
  text: Namun, bertanyalah kepada hewan-hewan, dan mereka akan mengajarimu; bertanyalah pula kepada burung-burung di langit, dan mereka akan memberitahumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Menandai peralihan yang bersifat kontras dalam perkataan Ayub; “Namun” alami dan tetap bermartabat dalam bahasa Indonesia.
- source_word: שְׁאַל נָא
  choice: tanyakanlah
  rationale: Bentuk imperatif dengan partikel נָא menyampaikan permintaan atau desakan halus. Akhiran -lah mengungkapkan nuansa itu secara alami tanpa harus menambahkan “sekarang” atau “tolong”.
- source_word: בְהֵמוֹת
  choice: binatang-binatang
  rationale: Dalam konteks ini kata tersebut menunjuk secara luas kepada hewan darat, bukan hanya ternak. Bentuk ulang menyatakan jamak secara jelas dan selaras dengan verba berikutnya.
- source_word: וְתֹרֶךָּ
  choice: dan mereka akan mengajarimu
  rationale: Berasal dari ירה bentuk Hifil, berarti “mengajar” atau “memberi petunjuk.” Walaupun bentuk Ibraninya feminin tunggal karena subjek kolektif, bahasa Indonesia secara alami memakai “mereka” untuk binatang-binatang.
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: juga kepada burung-burung di langit
  rationale: עוֹף dalam konteks ini paling alami diterjemahkan “burung-burung,” sedangkan הַשָּׁמַיִם menunjuk ruang langit tempat burung terbang. “Di langit” mempertahankan makna citraan Ibrani dengan ungkapan Indonesia yang wajar.
- source_word: וְיַגֶּד לָךְ
  choice: dan mereka akan memberitahumu
  rationale: נגד bentuk Hifil berarti “memberi tahu,” “menyatakan,” atau “membuat diketahui.” “Memberitahumu” jelas, langsung, dan cocok dengan subjek jamak dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang puitis namun mudah dipahami. Paralelisme antara binatang darat yang “mengajar” dan burung di langit yang “memberi tahu” dipertahankan. Tidak diperlukan catatan kaki karena “burung-burung di langit” secara alami dan tepat menyampaikan konstruksi Ibrani.
