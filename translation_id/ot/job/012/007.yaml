  naturalness: “Bertanyalah kepada” adalah bentuk modern yang lebih alami dan jelas. Pengulangan imperatif pada pasangan kedua membuat elipsis puitis Ibrani jelas dalam bahasa Indonesia tanpa mengubah makna. “Hewan-hewan” juga lebih netral dalam bahasa Indonesia modern daripada “binatang-binatang.”
