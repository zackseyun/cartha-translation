  text: הֲ/לֹא אֹ֭זֶן מִלִּ֣ין תִּבְחָ֑ן וְ֝/חֵ֗ךְ אֹ֣כֶל יִטְעַם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/011.yaml
  text: Does not the ear test words[a], as the palate tastes food?
translation:
  language: id
  text: Bukankah telinga menguji kata-kata[a], seperti langit-langit mulut mengecap makanan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memeriksa perkataan”.
    reason: Alternatif ini mempertahankan kemungkinan makna מִלִּין sebagai “perkataan” dan תִּבְחָן sebagai “memeriksa”.
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan dan terdengar alami dalam bahasa Indonesia.
- source_word: אֹזֶן
  choice: telinga
  rationale: Mempertahankan gambaran konkret Ibrani tentang organ pendengaran yang berfungsi menilai perkataan.
- source_word: מִלִּין
  choice: kata-kata
  rationale: Padanan langsung bagi bentuk jamak yang dapat berarti kata-kata atau perkataan; bentuk ini menjaga kesejajaran konkret dengan makanan.
- source_word: תִּבְחָן
  choice: menguji
  rationale: Kata kerja ini menyatakan tindakan memeriksa atau menguji mutu; 'menguji' mempertahankan daya ungkap paralel dengan mengecap.
- source_word: חֵךְ
  choice: langit-langit
  rationale: Menunjuk secara khusus pada langit-langit mulut atau indra pengecap, bukan mulut secara umum, sehingga citra anatomis sumber dipertahankan.
- source_word: אֹכֶל
  choice: makanan
  rationale: Padanan konkret dan wajar untuk sesuatu yang dimakan.
- source_word: יִטְעַם
  choice: mengecap
  rationale: Menyatakan tindakan merasakan rasa; 'mengecap' sesuai dengan langit-langit dan mempertahankan perbandingan indrawi.
- source_word: לוֹ
  choice: tidak dinyatakan tersendiri
  rationale: Pronomina ini bersifat idiomatis dan terkait dengan tindakan langit-langit mengecap; menerjemahkannya secara eksplisit sebagai 'bagi dirinya sendiri' akan terasa janggal dan dapat memberi penekanan yang tidak diperlukan dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada sastra-hikmat. Citra tubuh dalam teks Ibrani dipertahankan. Penanda catatan kaki [a] dicantumkan langsung sesudah frasa terkait.
