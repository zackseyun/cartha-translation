source:
  edition: WLC
  text: מוּסַ֣ר מְלָכִ֣ים פִּתֵּ֑חַ וַ/יֶּאְסֹ֥ר אֵ֝ז֗וֹר בְּ/מָתְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: id
  text: Ia melonggarkan ikatan raja-raja[a], lalu mengikatkan sabuk pada pinggang mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “didikan raja-raja” atau “belenggu raja-raja”. Kata benda Ibrani ini dapat berarti didikan/hajaran maupun ikatan/belenggu; “ikatan” paling sesuai dengan kesejajaran antara “melonggarkan” dan “mengikatkan”.
    reason: lexical_alternative
  - marker: b
    text: 'Gambaran ini mungkin menyiratkan penghinaan atau penaklukan: Allah mencopot kuasa para raja dan mengikat mereka seperti orang biasa atau tawanan. Namun, gambaran itu juga dapat dipahami sebagai tindakan memperlengkapi mereka untuk bertindak.'
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: ikatan
  rationale: Kata ini dapat berarti didikan/hajaran atau ikatan/belenggu. Dalam konteks ini, makna konkret “ikatan” paling sesuai dengan kata kerja “melonggarkan” dan membentuk kesejajaran dengan tindakan mengikat pada bagian berikutnya.
- source_word: פִּתֵּחַ
  choice: melonggarkan
  rationale: Kata kerja ini secara harfiah berarti membuka atau melepaskan. “Melonggarkan” mempertahankan gambaran fisik dan berpasangan secara wajar dengan “mengikatkan”.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Ini adalah arti biasa dan langsung dari kata Ibrani tersebut; tidak perlu diperluas menjadi “para penguasa”.
- source_word: וַיֶּאְסֹר
  choice: mengikatkan
  rationale: Kata kerja ini berarti mengikat atau menambatkan. Bentuk “mengikatkan” sesuai dengan objek “sabuk” dan mempertahankan kontras dengan “melonggarkan”.
- source_word: אֵזוֹר
  choice: sabuk
  rationale: Kata ini menunjuk pada sabuk atau ikat pinggang yang dikenakan pada pinggang. “Sabuk” ringkas, alami, dan cukup netral untuk tidak menentukan apakah gambaran itu menyiratkan kesiapan, kerja kasar, atau penghinaan.
- source_word: בְּמָתְנֵיהֶם
  choice: pada pinggang mereka
  rationale: Frasa ini menunjuk pada pinggang atau bagian tubuh sekitar pinggang. Pilihan ini jelas dalam bahasa Indonesia modern dan menghindari ungkapan arkais.
theological_decisions:
- issue: Makna gambaran pembalikan keadaan raja-raja
  choice: Teks utama mempertahankan gambaran bahwa Allah melonggarkan ikatan raja-raja lalu mengikatkan sabuk pada pinggang mereka, tanpa menjelaskan metaforanya secara pasti.
  alternative: Ayat ini dapat dipahami sebagai Allah membebaskan raja-raja lalu memperlengkapi mereka untuk bertindak, atau sebagai Allah meruntuhkan kuasa mereka lalu menundukkan dan mempermalukan mereka.
  rationale: Bahasa Ibrani singkat dan metaforis. Kontras antara “melonggarkan” dan “mengikatkan” menunjukkan pembalikan di bawah kedaulatan Allah, tetapi rincian maknanya tetap ambigu; karena itu terjemahan tidak memilih satu penafsiran secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan dua klausa mempertahankan kontras puitis Ibrani antara melonggarkan dan mengikatkan. Istilah “sabuk” dipilih daripada “ikat pinggang” agar pengulangan dengan “pinggang” tidak terasa berat.
