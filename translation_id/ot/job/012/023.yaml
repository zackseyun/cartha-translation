  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: id
  text: Ia menjadikan bangsa-bangsa besar[a] dan membinasakan mereka; Ia memperluas bangsa-bangsa dan membawa mereka pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia memperluas bangsa-bangsa dan menuntun mereka.” Kata-kata kerja Ibrani dapat dipahami sebagai perluasan yang diikuti penuntunan; teks utama mencerminkan kemungkinan kesejajaran pembalikan dalam konteks ini.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: membuat ... menjadi besar
  rationale: Bentuk kausatif dari שׂגא menyatakan tindakan menjadikan besar atau menambah; ungkapan ini mempertahankan makna kausatif tanpa mempersempitnya menjadi kemakmuran.
- source_word: לַגּוֹיִם
  choice: bangsa-bangsa
  rationale: גּוֹיִם di sini menunjuk secara luas kepada bangsa-bangsa sebagai kelompok politik, bukan khusus kepada orang bukan Yahudi.
- source_word: וַיְאַבְּדֵם
  choice: membinasakan mereka
  rationale: Bentuk verba ini menyatakan menyebabkan mereka lenyap atau binasa; 'membinasakan' ringkas dan cocok dengan kontras terhadap tindakan membesarkan bangsa-bangsa.
- source_word: שֹׁטֵחַ
  choice: memperluas
  rationale: Partisipel dari שטח menggambarkan tindakan membentangkan atau meluaskan; untuk objek bangsa-bangsa, 'memperluas' secara wajar menyampaikan perluasan wilayah atau pengaruh.
- source_word: וַיַּנְחֵם
  choice: membawa mereka pergi
  rationale: נחה pada dasarnya berarti memimpin atau menuntun. Dalam kesejajaran yang menekankan pembalikan nasib bangsa-bangsa, ungkapan ini mempertahankan gerak yang diarahkan tanpa menjadikannya bimbingan yang pasti bersifat baik.
theological_decisions:
- issue: Makna pergerakan bangsa-bangsa pada bagian kedua ayat
  choice: Allah memperluas bangsa-bangsa, kemudian membawa mereka pergi.
  alternative: Allah memperluas bangsa-bangsa dan menuntun mereka.
  rationale: Konteks menekankan kedaulatan Allah atas kebesaran dan kehancuran bangsa-bangsa. Karena נחה dapat berarti 'menuntun' tanpa menentukan apakah hasilnya menguntungkan, terjemahan ini mempertahankan ketegangan dalam kesejajaran dan tidak memasukkan nuansa kebajikan yang tidak diwajibkan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Ia' mempertahankan tekanan puitis pada tindakan Allah; 'lalu' menyatakan urutan retoris tanpa mengharuskan selang waktu tertentu.
