base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: id
  text: Ia menghilangkan pengertian[a] dari para pemimpin rakyat negeri itu[b], lalu membuat mereka mengembara di tanah tandus tanpa jalan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah “hati”; di sini maksudnya kemampuan untuk memahami atau mempertimbangkan dengan tepat.
    reason: lexical_alternative
  - marker: b
    text: Atau “para pemimpin rakyat di bumi.” Bahasa Ibraninya secara harfiah berbunyi “kepala-kepala rakyat negeri/bumi.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “di tempat tandus, tidak ada jalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: menghilangkan
  rationale: Bentuk kausatif ini menyatakan tindakan mengambil atau menyingkirkan sesuatu. “Menghilangkan” alami dalam bahasa Indonesia dan mempertahankan tindakan Allah sebagai penyebab hilangnya pengertian.
- source_word: לֵב
  choice: pengertian
  rationale: Secara harfiah berarti “hati”, tetapi di sini menunjuk pada kemampuan berpikir dan membuat pertimbangan. “Pengertian” menyampaikan fungsi tersebut tanpa memberi kesan bahwa yang dimaksud terutama ialah perasaan.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: para pemimpin rakyat negeri itu
  rationale: רָאשֵׁי secara harfiah berarti “kepala-kepala”, tetapi merupakan ungkapan bagi para pemimpin. הָאָרֶץ dapat berarti “negeri” atau “bumi”; dalam konteks sosial-politik ini, “negeri itu” menghasilkan bacaan yang alami sambil mempertahankan alternatif yang lebih universal dalam catatan kaki.
- source_word: וַיַּתְעֵם
  choice: lalu membuat mereka mengembara
  rationale: Bentuk kausatif dari תעה menyatakan bahwa Allah menyebabkan mereka mengembara atau tersesat. “Membuat mereka mengembara” mempertahankan unsur kausatif dan gambaran ruang dalam teks.
- source_word: בְּתֹהוּ
  choice: di tanah tandus
  rationale: תֹהוּ dapat menunjuk pada kehampaan, ketandusan, atau tempat yang kacau dan sepi. Dalam gambaran orang yang mengembara tanpa jalan, “tanah tandus” jelas dan hidup dalam bahasa Indonesia.
- source_word: לֹא דָרֶךְ
  choice: tanpa jalan
  rationale: Ungkapan Ibrani ini secara harfiah berarti “tidak ada jalan”. “Tanpa jalan” ringkas, alami, dan mempertahankan gambaran tempat yang tidak memiliki jalur.
theological_decisions:
- issue: Subjek yang tersirat dalam bentuk-bentuk verba
  choice: Kata ganti “Ia” merujuk kepada Allah sebagai pelaku yang menghilangkan pengertian dan membuat para pemimpin mengembara.
  alternative: Mengulang nama “Allah” dalam ayat ini.
  rationale: Konteks Ayub 12 telah menetapkan Allah sebagai subjek. Kata ganti mempertahankan kesinambungan wacana tanpa menambahkan nama yang tidak diulang dalam teks Ibrani ayat ini.
- issue: Cakupan הָאָרֶץ
  choice: Diterjemahkan “negeri itu”, dengan alternatif “bumi” dicatat.
  alternative: “para pemimpin rakyat di bumi” atau “para pemimpin bangsa-bangsa di bumi”.
  rationale: Kata tersebut memang dapat berarti negeri maupun bumi. Konteks memungkinkan gambaran para pemimpin suatu rakyat atau negeri, tetapi cakupan universal tidak boleh ditutup; karena itu ambiguitasnya dijaga melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan idiomatis Ibrani “kepala-kepala” dialihkan menjadi “para pemimpin” agar langsung dipahami, sedangkan gambaran mengembara di tempat tandus tanpa jalan dipertahankan. Ambiguitas “negeri/bumi” dan arti harfiah “hati” dijelaskan dalam catatan kaki.
