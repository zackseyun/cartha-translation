- source_word: וַיַּעַן
  choice: menjawab
  rationale: Bentuk wayyiqtol dari ענה memperkenalkan tanggapan Ayub terhadap perkataan sebelumnya; “menjawab” mempertahankan rumusan dialog Ibrani secara wajar.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Nama diri ini memakai bentuk baku yang sudah dikenal luas dalam bahasa Indonesia.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: Bentuk wayyiqtol dari אמר secara harfiah berarti “dan berkata”; “katanya” menghasilkan rumusan pembuka ujaran yang alami dan bermartabat dalam bahasa Indonesia tanpa menghilangkan unsur berbicara.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada verba pembuka menandai kelanjutan atau urutan wacana; “Lalu” mengungkapkan peralihan kepada jawaban Ayub secara alami. “Dan” tetap merupakan kemungkinan yang lebih formal.
