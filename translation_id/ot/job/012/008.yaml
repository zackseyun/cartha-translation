  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: id
  text: Atau berbicaralah kepada bumi[a], dan bumi akan mengajarimu[b]; ikan-ikan di laut akan memberitahukan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah”; kata Ibrani אֶרֶץ dapat berarti “bumi” atau “tanah.”
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, kata kerja ini berbentuk feminin tunggal, sesuai dengan kata “bumi” yang secara gramatikal berjenis feminin.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: Atau
  rationale: Partikel pemisah ini melanjutkan rangkaian ajakan dalam konteks sebelumnya; “Atau” merupakan penghubung yang alami dan tetap dekat dengan bentuk Ibrani.
- source_word: שִׂ֣יחַ
  choice: berbicaralah
  rationale: Dalam konstruksi dengan לָאָרֶץ, verba ini paling wajar dipahami sebagai menyapa atau berbicara kepada bumi, sejajar dengan tindakan bertanya kepada makhluk-makhluk dalam ayat sebelumnya.
- source_word: לָ/אָ֣רֶץ
  choice: kepada bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “tanah/daratan”; cakupan gambaran yang mencakup binatang, burung, dan ikan laut mendukung “bumi”, sambil mempertahankan alternatif dalam catatan kaki.
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: maka bumi akan mengajarimu
  rationale: Bentuk Hifil dari ירה berarti “mengajar” atau “memberi petunjuk”. Pengulangan “bumi” menghindari pronomina Indonesia yang kabur dan mempertahankan personifikasinya.
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: akan menceritakannya kepadamu
  rationale: Bentuk Piel dari ספר dapat berarti menceritakan, memberitahukan, atau menyatakan. “Menceritakannya kepadamu” alami dalam bahasa Indonesia dan mencerminkan bahwa objek pesannya tersirat dalam teks Ibrani.
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: ikan-ikan di laut
  rationale: Ungkapan ini menyampaikan frasa konstruksi Ibrani secara alami dalam bahasa Indonesia; bentuk ulang menandai kelompok ikan yang menjadi subjek verba jamak.
