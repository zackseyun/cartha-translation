translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secukupnya. Sapaan orang kedua tunggal diterjemahkan dengan bentuk -mu sesuai konteks percakapan Ayub. Personifikasi bumi dan ikan dipertahankan; tanda titik koma mempertahankan kesejajaran dua baris puisi.
