lexical_decisions:
- source_word: מוֹלִיךְ
  choice: menggiring ... pergi
  rationale: Partisipel Hifil dari הלך menyatakan tindakan menyebabkan seseorang pergi. Dalam konteks penghukuman dan penghinaan, “menggiring ... pergi” secara alami menyiratkan bahwa mereka dibawa secara paksa.
- source_word: כֹּהֲנִים
  choice: para imam
  rationale: Ini adalah padanan baku dan langsung bagi kata Ibrani yang menunjuk kepada para imam sebagai tokoh agama yang terpandang.
- source_word: שׁוֹלָל
  choice: dalam keadaan dilucuti
  rationale: Bentuk ini menggambarkan orang yang telah dirampasi milik, kedudukan, atau kehormatannya. “Dillucuti” mempertahankan gambaran penghinaan tanpa membatasi maknanya hanya pada ketelanjangan atau keadaan tanpa alas kaki.
- source_word: אֵתָנִים
  choice: orang-orang yang kukuh
  rationale: Kata ini mengandung gagasan kekuatan, keteguhan, dan kemapanan. “Orang-orang yang kukuh” mempertahankan nuansa itu dan sesuai dengan konteks tokoh-tokoh yang dianggap tidak mudah digoyahkan.
- source_word: יְסַלֵּף
  choice: menggulingkan
  rationale: Piel dari סלף secara harfiah berkaitan dengan membengkokkan atau memutarbalikkan. Dalam konteks Allah merendahkan orang yang mapan, “menggulingkan” menyampaikan akibat tindakan tersebut dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Subjek tersirat yang berlanjut dari konteks Ayub 12
  choice: Memakai kata ganti tunggal “Ia” yang merujuk kepada Allah
  alternative: Menyebut “Allah” secara eksplisit
  rationale: Ayat-ayat di sekitarnya terus menggambarkan tindakan Allah, sedangkan teks Ibrani tidak mengulang nama-Nya dalam baris ini. “Ia” mempertahankan alur puitis sekaligus tidak mengubah subjek.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan dua klausa mempertahankan paralelisme puisi Ibrani. Pilihan “dilucuti” dan “kukuh” sengaja mempertahankan keluasan makna sumber, sedangkan catatan kaki menyajikan alternatif leksikal yang penting.
