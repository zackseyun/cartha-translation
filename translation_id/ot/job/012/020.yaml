  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: id
  text: Ia mengambil kemampuan berbicara[a] dari orang-orang tepercaya dan mencabut daya pertimbangan[b] dari para sesepuh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ia menyingkirkan bibir.” Maksudnya, Ia membuat mereka kehilangan kemampuan berbicara atau kefasihan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kemampuan menilai” atau “pengertian.”
    reason: lexical_alternative
  - marker: c
    text: Atau “orang-orang lanjut usia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: mengambil
  rationale: Bentuk partisipel Hifil ini menyatakan tindakan menyingkirkan atau mengambil sesuatu dari seseorang. Dalam bahasa Indonesia, “mengambil kemampuan berbicara” secara alami menyampaikan akibat yang dimaksud.
- source_word: שָׂפָה
  choice: kemampuan berbicara
  rationale: Secara harfiah berarti “bibir”, tetapi di sini dipakai secara metonimis untuk kemampuan berbicara, termasuk kefasihan atau daya menyampaikan perkataan.
- source_word: לְנֶאֱמָנִים
  choice: dari orang-orang tepercaya
  rationale: נֶאֱמָנִים dapat berarti orang yang setia, dapat diandalkan, atau dipercaya. “Orang-orang tepercaya” mempertahankan nuansa sosial bahwa mereka dipandang layak dipercaya tanpa menutup kemungkinan makna kesetiaan.
- source_word: טַעַם
  choice: daya pertimbangan
  rationale: Walaupun arti dasarnya berkaitan dengan rasa, secara kiasan kata ini menunjuk pada pertimbangan, pengertian, atau kemampuan menilai dengan bijaksana. “Daya pertimbangan” sesuai dengan konteks hikmat.
- source_word: זְקֵנִים
  choice: para sesepuh
  rationale: Kata ini dapat menunjuk kepada orang-orang lanjut usia maupun para tua-tua yang dihormati. “Para sesepuh” menyampaikan unsur usia, pengalaman, dan kedudukan sosial dalam bahasa Indonesia masa kini.
- source_word: יִקָּח
  choice: mencabut
  rationale: לקח pada dasarnya berarti “mengambil”. Dalam paralelisme ini maknanya bersifat privatif, yaitu membuat para sesepuh kehilangan daya pertimbangan. “Mencabut” menyatakan hal itu secara jelas sekaligus menghindari pengulangan yang kaku.
