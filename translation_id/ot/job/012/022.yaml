  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: id
  text: Ia menyingkapkan hal-hal yang dalam dari kegelapan dan membawa bayang-bayang maut[a] ke dalam terang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kegelapan pekat” atau “kegelapan maut” (Ibrani צַלְמָוֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: menyingkapkan
  rationale: Partisipel dari גלה menyatakan tindakan membuka sesuatu yang tersembunyi atau membuatnya diketahui. “Menyingkapkan” mempertahankan kedua nuansa itu dan sesuai dengan gambaran puitis ayat ini.
- source_word: עֲמֻקוֹת
  choice: hal-hal yang dalam
  rationale: Bentuk jamak feminin yang dipakai secara substantival dapat menunjuk pada hal, tempat, atau rahasia yang dalam. Pilihan ini mempertahankan bentuk jamak serta kemungkinan makna harfiah dan kiasannya.
- source_word: מִנִּי חֹשֶׁךְ
  choice: dari kegelapan
  rationale: Preposisi menunjukkan asal atau tempat sesuatu dikeluarkan. “Dari kegelapan” alami dalam bahasa Indonesia dan mempertahankan citra tentang sesuatu yang tersembunyi.
- source_word: וַיֹּצֵא
  choice: membawa ... kepada
  rationale: 'Bentuk Hifil dari יצא bersifat kausatif: menyebabkan sesuatu keluar atau tampil. Dalam konstruksi dengan לָאוֹר, “membawa ... kepada terang” menyampaikan gerak dari keadaan tersembunyi menuju keterbukaan.'
- source_word: לָאוֹר
  choice: kepada terang
  rationale: Frasa ini menunjukkan arah menuju terang. “Kepada terang” menjaga kesejajaran puitis dengan “dari kegelapan” tanpa menambahkan penjelasan.
- source_word: צַלְמָוֶת
  choice: bayang-bayang maut
  rationale: Ungkapan tradisional ini mempertahankan daya puitis dan kemungkinan hubungan leksikal dengan maut. Karena kata Ibrani ini juga sering dipahami sebagai kegelapan yang sangat pekat, alternatif itu dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna צַלְמָוֶת
  choice: bayang-bayang maut
  alternative: kegelapan pekat; kegelapan maut
  rationale: Persoalan ini terutama bersifat leksikal dan puitis, bukan penetapan doktrin. Teks utama mempertahankan pembacaan tradisional yang masih dapat dipertanggungjawabkan, sedangkan kemungkinan bahwa istilah itu berarti kegelapan ekstrem disajikan dalam catatan kaki agar ambiguitas sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang sederhana dan bermartabat. Pengulangan citra “kegelapan” dan “terang” dipertahankan; subjek ilahi dinyatakan dengan “Ia” sesuai konteks.
