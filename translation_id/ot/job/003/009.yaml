base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: id
  text: Biarlah bintang-bintang senjanya menjadi gelap[a]; biarlah malam itu menantikan terang, tetapi terang itu tidak ada, dan janganlah ia melihat kelopak mata fajar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bintang-bintang waktu remangnya.” Kata Ibrani ini dapat menunjuk pada waktu remang, khususnya senja.
    reason: lexical_alternative
  - marker: b
    text: “Kelopak mata fajar” adalah gambaran puitis Ibrani bagi munculnya cahaya pagi yang pertama.
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: menjadi gelap
  rationale: 'Bentuk Qal imperfek dalam rangkaian kutukan ini menyatakan harapan atau kutukan: bintang-bintang itu kiranya menjadi gelap. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya imprekasinya.'
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: bintang-bintang senjanya
  rationale: Bentuk konstruksi כּוֹכְבֵי diikuti נִשְׁפּוֹ, yang menunjuk pada waktu remang, khususnya senja. Akhiran milik orang ketiga tunggal dipertahankan dengan '-nya'.
- source_word: יְקַו
  choice: menantikan
  rationale: Verba קוה dapat berarti menunggu atau berharap. Dalam paralel dengan terang yang tidak datang, 'menantikan' menyampaikan pengharapan penuh penantian tanpa menambahkan unsur psikologis secara berlebihan.
- source_word: לְאוֹר
  choice: terang
  rationale: Makna dasarnya adalah 'terang'. Pilihan ini mempertahankan pertentangan puitis dengan gelap dan tidak mempersempitnya menjadi 'cahaya siang'.
- source_word: וָאַיִן
  choice: tetapi terang itu tidak kunjung datang
  rationale: Secara harfiah ungkapan ini berarti 'tetapi tidak ada'. Dalam bahasa Indonesia, penyebutan kembali 'terang itu' memperjelas rujukan, sedangkan 'tidak kunjung datang' mengungkapkan penantian yang sia-sia dalam konteks personifikasi malam.
- source_word: וְאַל יִרְאֶה
  choice: dan janganlah ia melihat
  rationale: אַל dengan bentuk imperfek merupakan jusif negatif. 'Janganlah ia melihat' mempertahankan bentuk kutukan atau harapan negatif.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: kelopak mata fajar
  rationale: Ungkapan harfiahnya adalah 'kelopak mata fajar', gambaran puitis Ibrani bagi munculnya cahaya pagi yang pertama. Metafora tersebut dipertahankan dalam teks utama.
