translation:
  language: id
  text: Mengapa lutut menyambut aku,[a] dan mengapa ada buah dada agar aku menyusu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lutut” kemungkinan menggambarkan bayi yang diterima pada lutut atau pangkuan ketika lahir.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini membuka ratapan Ayub secara langsung; “Mengapa” alami dan tepat dalam bahasa Indonesia.
- source_word: קִדְּמוּנִי
  choice: menyambut aku
  rationale: Dalam konteks kelahiran, verba dari קדם menggambarkan tindakan datang menyongsong atau menerima bayi. “Menyambut aku” mempertahankan citra itu tanpa membatasi pelakunya.
- source_word: בִרְכָּיִם
  choice: lutut
  rationale: Bentuk konkret jamak dipertahankan. Ungkapan ini kemungkinan menggambarkan bayi yang diterima atau diletakkan pada lutut atau pangkuan ketika lahir.
- source_word: וּמַה
  choice: dan mengapa ada
  rationale: Walaupun secara harfiah berarti “dan apa,” dalam paralelisme pertanyaan ini maknanya adalah “dan mengapa.” Kata “ada” membuat konstruksi eliptis Ibrani menjadi wajar dalam bahasa Indonesia.
- source_word: שָׁדַיִם
  choice: buah dada
  rationale: Istilah anatomis ini jelas dan bermartabat dalam bahasa Indonesia. Teks Ibrani tidak secara eksplisit menambahkan “ibu.”
- source_word: כִּי
  choice: sehingga
  rationale: Di sini כִּי menghubungkan keberadaan buah dada dengan akibat atau tujuannya, yaitu agar bayi dapat menyusu.
- source_word: אִינָק
  choice: aku dapat menyusu
  rationale: Verba ini menunjuk kepada tindakan bayi mengisap susu. “Menyusu” secara alami menyatakan bahwa Ayub adalah bayi yang menerima susu, bukan pihak yang memberikannya.
