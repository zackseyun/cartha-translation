base_translation:
  language: en
  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: id
  text: Lihatlah, biarlah malam itu mandul; janganlah sorak sukacita masuk ke dalamnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda perhatian yang membuka kutukan puitis ini dengan bentuk yang wajar dan bermartabat.
- source_word: גַלְמוּד
  choice: mandul
  rationale: Dalam konteks malam kelahiran, kata ini menyatakan keadaan tanpa hasil atau tanpa kelahiran; 'mandul' mempertahankan citra tersebut secara ringkas.
- source_word: רְנָנָה
  choice: sorak sukacita
  rationale: Menangkap seruan nyaring penuh kegembiraan, kemungkinan berkaitan dengan perayaan kelahiran, tanpa mempersempitnya secara berlebihan.
- source_word: תָּבוֹא ... בוֹ
  choice: memasukinya
  rationale: Menerjemahkan secara langsung gambaran gerak 'datang/masuk ke dalamnya' dan mempertahankan personifikasi malam.
theological_decisions:
- issue: Lingkup kutukan Ayub terhadap malam kelahirannya
  choice: Mempertahankan bentuk harapan negatif puitis tanpa menjelaskan atau melunakkan ucapan itu.
  alternative: Menafsirkannya secara eksplisit sebagai doa, nubuat, atau penolakan terhadap kehidupan.
  rationale: Teks menyampaikan serangkaian jusiif dalam ratapan Ayub; terjemahan tidak boleh menentukan status teologis ucapan itu melampaui bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan dua klausa mempertahankan paralelisme Ibrani dan dapat dipahami pembaca umum.
