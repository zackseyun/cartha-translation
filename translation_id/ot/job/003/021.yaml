  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: id
  text: mereka yang menantikan maut, tetapi maut tidak datang,[a] dan menggali untuk mencarinya lebih daripada mereka menggali harta terpendam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan ia tidak ada”; secara harfiah, bahasa Ibraninya berbunyi “dan ia tidak ada”, dengan “ia” merujuk kepada maut. Dalam konteks, ini berarti maut tidak muncul atau tidak tiba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: yang menanti-nantikan
  rationale: Partisipel חכה menyatakan tindakan menunggu dengan penuh harap. Dalam konteks ini, bentuk ulang 'menanti-nantikan' secara alami menyampaikan penantian yang kuat tanpa mengubah makna dasarnya menjadi sekadar kerinduan.
- source_word: לַמָּוֶת
  choice: maut
  rationale: Konstruksi preposisi + nomina ini menjadikan maut sebagai objek penantian. 'Maut' sesuai dengan ragam puitis dan bermartabat dalam ucapan Ayub.
- source_word: וְאֵינֶנּוּ
  choice: tetapi maut tidak kunjung datang
  rationale: Secara harfiah berarti 'dan ia tidak ada', dengan sufiks maskulin tunggal yang merujuk kepada maut. Dalam konteks, 'tidak kunjung datang' menyampaikan ketidakhadiran maut secara idiomatis, sedangkan pengulangan 'maut' memperjelas rujukannya.
- source_word: וַיַּחְפְּרֻהוּ
  choice: dan yang menggalinya
  rationale: Kata חפר secara harfiah berarti 'menggali'. Terjemahan ini mempertahankan gambaran tajam tentang mencari maut seperti orang menggali untuk memperoleh harta terpendam.
- source_word: מִמַּטְמוֹנִים
  choice: lebih daripada harta terpendam
  rationale: מַטְמוֹן menunjuk pada harta yang disembunyikan atau ditimbun. Preposisi מִן di sini berfungsi komparatif; 'lebih daripada' mempertahankan perbandingan dengan kuat dan 'harta terpendam' selaras dengan gambaran menggali.
