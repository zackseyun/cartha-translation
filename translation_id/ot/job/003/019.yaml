  text: קָטֹ֣ן וְ֭/גָדוֹל שָׁ֣ם ה֑וּא וְ֝/עֶ֗בֶד חָפְשִׁ֥י מֵ/אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/019.yaml
  text: The small and the great are there[a], and the servant is free from his master.
translation:
  language: id
  text: Yang kecil dan yang besar ada di sana, dan budak bebas dari tuannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pelayan bebas dari tuannya.” Kata Ibrani עֶבֶד dapat berarti “budak” atau “pelayan”; di sini “budak” dipakai karena kebebasan dari seorang tuan dikontraskan dengan statusnya yang terikat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹן
  choice: yang kecil
  rationale: Dalam pasangan antitetis dengan גָדוֹל, istilah ini menunjuk terutama pada rendahnya kedudukan atau arti sosial, bukan sekadar ukuran fisik. Ungkapan ringkas ini mempertahankan kontras Ibrani.
- source_word: גָדוֹל
  choice: yang besar
  rationale: Dalam pasangan dengan קָטֹן, istilah ini menunjuk pada orang yang berkedudukan tinggi atau terpandang. 'Yang besar' mempertahankan bentuk kontras sumber secara wajar dalam bahasa Indonesia.
- source_word: שָׁם
  choice: di sana
  rationale: Kata ini menunjuk kembali pada tempat kematian yang dibicarakan dalam konteks sebelumnya dan mempertahankan daya tunjuk teks Ibrani.
- source_word: הוּא
  choice: ada
  rationale: Pronomina tunggal ini membentuk pernyataan nominal dengan pasangan kolektif 'yang kecil dan yang besar'. Bahasa Indonesia dapat mengungkapkannya secara alami dengan 'ada' tanpa menambahkan gagasan 'sama' yang tidak dinyatakan secara eksplisit.
- source_word: עֶבֶד
  choice: budak
  rationale: Konteks menonjolkan status terikat melalui kontras langsung dengan kebebasan dari seorang tuan; karena itu 'budak' lebih tepat daripada 'pelayan'.
- source_word: חָפְשִׁי
  choice: bebas
  rationale: Adjektiva ini secara langsung menyatakan kebebasan sebagai lawan dari keadaan diperbudak.
- source_word: מֵאֲדֹנָיו
  choice: dari tuannya
  rationale: Preposisi menandai keterlepasan, sedangkan אֲדוֹן di sini adalah tuan manusia yang berkuasa atas budak tersebut. 'Tuannya' alami dan tepat secara kontekstual.
theological_decisions:
- issue: Kesetaraan keadaan orang kecil dan orang besar dalam kematian
  choice: Tidak menambahkan kata 'sama' atau 'setara'.
  alternative: Yang kecil dan yang besar sama-sama ada di sana.
  rationale: Konteks menyiratkan bahwa kedua golongan berada di tempat yang sama, tetapi teks ayat ini hanya menyatakan bahwa mereka ada di sana. Terjemahan mempertahankan implikasi tanpa menjadikannya pernyataan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan paralel teks Ibrani dipertahankan, dengan 'budak' dipilih untuk memperjelas kontras sosial yang nyata. Penanda catatan kaki ditempatkan sesudah kalimat yang memuat istilah terkait.
