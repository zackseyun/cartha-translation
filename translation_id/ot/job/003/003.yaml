  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יֹ֣אבַד י֭וֹם אִוָּ֣לֶד בּ֑/וֹ וְ/הַ/לַּ֥יְלָה אָ֝מַ֗ר הֹ֣רָה גָֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/003.yaml
  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: id
  text: Biarlah lenyap hari ketika aku dilahirkan, dan malam yang berkata, “Seorang laki-laki[a] telah dikandung.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang anak laki-laki.”
    reason: Alternatif ini mencerminkan bahwa גָבֶר, meskipun secara leksikal berarti laki-laki atau pria, dalam konteks pembuahan dapat merujuk kepada anak laki-laki.
lexical_decisions:
- source_word: יֹאבַד
  choice: Biarlah lenyap
  rationale: Bentuk yusif menyatakan kutukan atau harapan agar hari itu lenyap, bukan sekadar pernyataan tentang masa depan.
- source_word: יוֹם
  choice: hari
  rationale: Dalam konteks ini yang dimaksud ialah hari tertentu, yaitu hari kelahiran Ayub; bahasa Indonesia tidak memerlukan kata sandang definit.
- source_word: אִוָּלֶד בּוֹ
  choice: ketika aku dilahirkan
  rationale: Nifal dari ילד menyatakan makna pasif, 'aku dilahirkan'; 'ketika' mengungkapkan hubungan dengan hari secara alami dalam bahasa Indonesia.
- source_word: וְהַלַּיְלָה
  choice: dan malam
  rationale: Frasa ini mengoordinasikan malam dengan hari sebagai sasaran kedua kutukan Ayub.
- source_word: אָמַר
  choice: yang berkata
  rationale: Pilihan ini mempertahankan personifikasi malam sebagai pihak yang mengucapkan pengumuman.
- source_word: הֹרָה
  choice: telah dikandung
  rationale: Bentuk perfektif menyatakan bahwa pembuahan telah terjadi; bentuk pasif sesuai dengan konteks pengumuman mengenai asal kehidupan Ayub.
- source_word: גָבֶר
  choice: seorang laki-laki
  rationale: גָבֶר menunjuk pada manusia berjenis kelamin laki-laki. Terjemahan utama mempertahankan arti leksikal langsung, sementara konteks memungkinkan arti 'anak laki-laki' yang dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Susunan paralel antara hari dan malam dipertahankan, demikian pula personifikasi malam dan nada kutukan Ayub.
