base_translation:
  language: en
  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: id
  text: Kiranya hari itu menjadi kegelapan; kiranya Allah dari atas tidak mencarinya[a], dan kiranya cahaya[b] tidak bersinar atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperhatikannya” atau “memedulikannya”; kata kerja Ibrani dapat berarti mencari, memperhatikan, atau memedulikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kecemerlangan” atau “sinar terang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: hari itu
  rationale: Frasa penunjuk ini merujuk kembali kepada hari kelahiran Ayub; “hari itu” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: יְהִי
  choice: kiranya ... menjadi
  rationale: Bentuk yusif menyatakan harapan atau kutukan. “Kiranya” mempertahankan daya optatifnya dalam ragam puitis yang tetap alami.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Kata benda Ibrani ini menunjuk pada keadaan gelap; bentuk nomina “kegelapan” mempertahankan susunan dan gambaran teks sumber.
- source_word: יִדְרְשֵׁהוּ
  choice: mencarinya
  rationale: דרש pada dasarnya berarti mencari atau menanyakan. Padanan ini mempertahankan gambaran Ibrani, sementara catatan kaki menjelaskan kemungkinan nuansa memperhatikan atau memedulikan.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal puitis ini berarti Allah dan lazim dalam kitab Ayub; konteks tidak mendukung perluasan menjadi gelar lain.
- source_word: מִמָּעַל
  choice: dari atas
  rationale: Padanan ini mempertahankan sudut pandang spasial ungkapan Ibrani tanpa mengubahnya menjadi parafrasa “di surga”.
- source_word: תּוֹפַע
  choice: bersinar
  rationale: Kata kerja ini menyampaikan tindakan memancarkan atau menampakkan terang; “bersinar” ringkas, alami, dan cocok dengan paralelismenya.
- source_word: נְהָרָה
  choice: cahaya
  rationale: Nomina langka ini berarti cahaya, kecemerlangan, atau sinar. “Cahaya” paling alami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Pronomina merujuk kepada “hari itu”; ungkapan ini mempertahankan citra cahaya yang menyinari hari tersebut.
theological_decisions:
- issue: Penyebutan Allah dalam harapan yang bernada kutukan
  choice: Mempertahankan penyebutan langsung “Allah dari atas”
  alternative: “surga di atas” atau “Allah di surga”
  rationale: Teks Ibrani secara eksplisit menyebut Allah. Bahasa ratapan Ayub yang berani tidak dilunakkan menjadi ungkapan tak langsung.
translation_notes:
  register: Bahasa puitis, khidmat, dan mudah dipahami. “Kiranya” menandai harapan bernada kutukan tanpa menjadi arkais. Susunan paralel dan ambiguitas leksikal utama dipertahankan serta dijelaskan melalui catatan kaki.
