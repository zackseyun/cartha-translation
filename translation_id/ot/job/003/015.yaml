id: JOB.3.15
reference: Job 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: א֣וֹ עִם שָׂ֭רִים זָהָ֣ב לָ/הֶ֑ם הַֽ/מְמַלְאִ֖ים בָּתֵּי/הֶ֣ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/015.yaml
  text: or with princes who had gold[b][a], who filled their houses with silver—
translation:
  language: id
  text: 'atau bersama para penguasa[a] yang memiliki emas,

    yang memenuhi rumah-rumah mereka dengan perak—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para bangsawan” atau “para pemimpin”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: atau
  rationale: Melanjutkan rangkaian kemungkinan yang tidak terwujud dalam ayat 13–16; konjungsi sederhana ini mempertahankan alur puitis.
- source_word: עִם
  choice: bersama
  rationale: Menandai kebersamaan Ayub dengan para penguasa yang telah mati dalam keadaan yang sedang ia bayangkan.
- source_word: שָׂרִים
  choice: para penguasa
  rationale: Istilah ini menunjuk kepada orang-orang berkedudukan tinggi. 'Para penguasa' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa mereka harus keturunan raja.
- source_word: זָהָב לָהֶם
  choice: yang memiliki emas
  rationale: Ungkapan Ibrani menyatakan kepemilikan; terjemahan ini alami dan tetap dekat dengan maknanya.
- source_word: הַמְמַלְאִים
  choice: yang memenuhi
  rationale: Partisipel ini menjelaskan lebih lanjut para penguasa. Klausa relatif mempertahankan hubungan tersebut secara alami.
- source_word: בָּתֵּיהֶם
  choice: rumah-rumah mereka
  rationale: Kata dasarnya berarti 'rumah-rumah'. 'Istana-istana' mungkin sesuai konteks, tetapi lebih khusus daripada teks sumber.
- source_word: כָּסֶף
  choice: perak
  rationale: Dalam gambaran puitis tentang kekayaan ini, logam mulia dimaksudkan; 'uang' akan mengurangi kesejajaran dengan emas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan dua baris mempertahankan paralelisme deskriptif Ibrani. Tanda pisah menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
