base_translation:
  language: en
  yaml_path: translation/ot/job/003/014.yaml
  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: id
  text: bersama raja-raja dan para penasihat negeri, yang membangun reruntuhan bagi diri mereka sendiri,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Bentuk jamak ini secara langsung berarti para raja.
- source_word: יֹעֲצֵי אָרֶץ
  choice: para penasihat dunia
  rationale: Secara harfiah berarti 'para penasihat negeri/bumi'; dalam konteks para penguasa, 'dunia' menyampaikan cakupan manusiawi dan politis secara alami.
- source_word: הַבֹּנִים
  choice: yang membangun
  rationale: Partisipel aktif jamak ini menerangkan raja-raja dan para penasihat.
- source_word: חֳרָבוֹת
  choice: reruntuhan
  rationale: Kata ini lazim menunjuk tempat atau bangunan yang telah runtuh dan telantar. Ungkapan yang tampak paradoksal, 'membangun reruntuhan', dipertahankan karena teks Ibrani memang demikian dan mungkin merujuk pada pembangunan kembali reruntuhan atau bangunan megah yang akhirnya menjadi puing.
- source_word: לָמוֹ
  choice: bagi diri mereka sendiri
  rationale: Bentuk pronominal puitis ini berarti 'bagi mereka'; bentuk refleksif sesuai konteks tindakan yang dilakukan demi kepentingan mereka sendiri.
theological_decisions:
- issue: Ambiguitas ungkapan 'membangun reruntuhan'
  choice: Mempertahankan ungkapan paradoksal 'membangun reruntuhan' dalam teks utama
  alternative: yang membangun kembali tempat-tempat yang telah menjadi reruntuhan bagi diri mereka sendiri
  rationale: Teks sumber tidak memuat kata eksplisit 'kembali'. Menambahkannya akan memperjelas salah satu kemungkinan makna, tetapi menutup ambiguitas puitis yang asli.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Struktur ayat dipertahankan sebagai lanjutan kalimat dari ayat sebelumnya; karena itu diawali huruf kecil dan diakhiri koma.
