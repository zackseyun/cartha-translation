  yaml_path: translation/ot/job/003/005.yaml
  text: May darkness and deep shadow reclaim it[a]; may a cloud dwell over it[b]; may the blacknesses of the day terrify it.
translation:
  language: id
  text: Biarlah kegelapan dan bayang-bayang kelam mengambilnya kembali[a]; biarlah awan berdiam di atasnya; biarlah kegelapan-kegelapan hari itu menggentarkannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayang-bayang maut” atau “kegelapan pekat” untuk צַלְמָוֶת.
    reason: lexical_alternative
  - marker: b
    text: Frasa “kegelapan-kegelapan hari itu” sulit ditafsirkan; frasa itu juga dapat berarti “kegelapan hari itu”, “gerhana-gerhana hari itu”, atau, dengan kemungkinan lebih kecil, “kepahitan-kepahitan hari itu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: mengambilnya kembali
  rationale: Kata גאל pada dasarnya menunjuk pada tindakan memperoleh atau menuntut kembali. Dalam kutukan ini, ungkapan tersebut menggambarkan kegelapan seolah-olah mengambil kembali hari itu; pilihan ini alami dalam bahasa Indonesia tanpa memasukkan konotasi keselamatan dari 'menebus'.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan langsung dan wajar untuk gambaran lenyapnya terang.
- source_word: צַלְמָוֶת
  choice: kelam pekat
  rationale: Menjaga citra kegelapan yang berat tanpa memastikan bahwa unsur 'maut' harus dinyatakan secara eksplisit; kemungkinan lain dicatat dalam catatan kaki.
- source_word: תִּשְׁכָּן עָלָיו
  choice: berdiam di atasnya
  rationale: Mempertahankan arti dasar שׁכן, yaitu tinggal atau berdiam, sekaligus menyampaikan gambaran awan yang menetap di atas hari itu.
- source_word: עֲנָנָה
  choice: awan
  rationale: Padanan konkret dan alami bagi nomina tunggal yang dapat dipahami secara kolektif.
- source_word: יְבַעֲתֻהוּ
  choice: menggentarkannya
  rationale: Menyampaikan tindakan menimbulkan rasa takut atau kedahsyatan dengan laras puitis yang sesuai.
- source_word: כִּמְרִירֵי יוֹם
  choice: berbagai kegelapan pada siang hari
  rationale: Frasa Ibrani ini sulit. Pilihan ini mengikuti kemungkinan makna penggelapan atau kehitaman, mempertahankan nuansa jamak, dan sesuai dengan rangkaian citra kegelapan dan awan.
theological_decisions: []
