  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat. Paralelisme kutukan dipertahankan melalui pengulangan “biarlah”. Kejanggalan frasa terakhir tidak dihapus, tetapi dibuat cukup terbaca dan alternatifnya disajikan dalam catatan kaki.
