translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan satu pertanyaan pembuka, dua istilah maternal yang berbeda, gambaran konkret 'keluar', serta perbedaan antara 'mati' dan 'mengembuskan napas terakhir'.
