  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: id
  text: Mengapa aku tidak mati saat lahir dari rahim, atau mengembuskan napas terakhir ketika keluar dari kandungan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mengapa aku tidak mati dari rahim, keluar dari kandungan lalu mengembuskan napas terakhir?” Bahasa Ibrani menghubungkan klausa-klausa ini dengan “dan” dan memakai dua istilah tubuh ibu yang berkaitan tetapi berbeda: “rahim” dan “kandungan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan interogatif sebab yang alami dalam bahasa Indonesia dan sesuai dengan nada ratapan Ayub.
- source_word: לֹא
  choice: tidak
  rationale: Mempertahankan negasi langsung pada klausa verbal pertama.
- source_word: מֵרֶחֶם
  choice: sejak dari rahim
  rationale: רֶחֶם secara konkret menunjuk rahim. Ungkapan ini mempertahankan gambaran asal kelahiran, sedangkan 'sejak' membuat maksud waktunya wajar dalam bahasa Indonesia.
- source_word: אָמוּת
  choice: aku ... mati
  rationale: Bentuk imperfek orang pertama tunggal di dalam pertanyaan ratapan ini secara idiomatis menyatakan penyesalan kontrafaktual mengenai kelahirannya.
- source_word: מִבֶּטֶן
  choice: dari kandungan
  rationale: בֶּטֶן dapat berarti perut atau kandungan. 'Kandungan' jelas dalam konteks kelahiran dan tetap dibedakan dari רֶחֶם yang diterjemahkan 'rahim'.
- source_word: יָצָאתִי
  choice: aku keluar
  rationale: Mempertahankan gambaran konkret verba יצא, 'keluar', tanpa menggantinya dengan penafsiran yang lebih abstrak seperti 'lahir'.
- source_word: וְאֶגְוָע
  choice: atau mengembuskan napas terakhir
  rationale: גוע berbeda dari מות dan dapat menekankan saat seseorang mengembuskan napas terakhir. Dalam pertanyaan negatif bahasa Indonesia, 'atau' secara alami menghubungkan dua kemungkinan yang sama-sama dipertanyakan.
