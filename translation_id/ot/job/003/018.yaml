  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: id
  text: 'Di sana para tahanan hidup tenteram bersama-sama;

    mereka tidak mendengar suara mandor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penindas” atau “penagih,” yaitu orang yang menuntut pembayaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: bersama-sama
  rationale: Kata keterangan ini menerangkan keadaan kolektif para tahanan; “bersama-sama” alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa mereka mengalami ketenteraman yang sama.
- source_word: אֲסִירִים
  choice: para tahanan
  rationale: Istilah ini menunjuk kepada orang-orang yang terikat atau dikurung. “Para tahanan” jelas dan wajar dalam bahasa Indonesia modern tanpa membatasi makna pada tawanan perang.
- source_word: שַׁאֲנָנוּ
  choice: hidup tenteram
  rationale: Bentuk ini menyatakan keadaan tenang, aman, dan bebas dari gangguan. “Hidup tenteram” menyampaikan keadaan tersebut secara alami tanpa menyamakannya begitu saja dengan kata Ibrani lain yang berarti ‘beristirahat’.
- source_word: לֹא שָׁמְעוּ
  choice: mereka tidak mendengar
  rationale: Walaupun verba berbentuk qatal, dalam puisi dan konteks gambaran keadaan orang mati bentuk ini dapat menyatakan keadaan yang sedang berlaku atau bersifat resultatif; bentuk kini Indonesia mempertahankan fungsi kontekstual itu.
- source_word: קוֹל
  choice: suara
  rationale: “Suara” merupakan padanan langsung dan cocok untuk perintah atau tuntutan yang terdengar dari pihak yang mengerahkan kerja.
- source_word: נֹגֵשׂ
  choice: pengerah kerja
  rationale: Partisip ini menunjuk kepada orang yang mendesak, menindas, atau menuntut kerja maupun pembayaran. “Pengerah kerja” konkret dalam konteks para tahanan, tetapi tidak mempersempit rujukan hanya kepada perbudakan.
