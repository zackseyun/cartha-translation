  text: אַחֲרֵי כֵ֗ן פָּתַ֤ח אִיּוֹב֙ אֶת פִּ֔י/הוּ וַ/יְקַלֵּ֖ל אֶת יוֹמֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/001.yaml
  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: id
  text: Sesudah itu, Ayub membuka mulutnya dan mengutuk harinya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hari kelahirannya." Bahasa Ibrani secara harfiah berbunyi "harinya."
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan ini merupakan peralihan waktu yang umum. “Sesudah itu” alami dalam bahasa Indonesia modern dan mempertahankan urutan narasi.
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: membuka mulutnya
  rationale: Idiom Ibrani ini mengawali sebuah ucapan. Bentuk harfiahnya tetap wajar dalam bahasa Indonesia serta mempertahankan daya retoris dan suasana khidmat teks.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וַיְקַלֵּל
  choice: mengutuki
  rationale: Bentuk Piel dari קלל di sini berarti mengutuk. “Mengutuki” menyampaikan tindakan yang diarahkan kepada harinya tanpa memperhalus ketegasan teks.
- source_word: אֶת יוֹמוֹ
  choice: harinya
  rationale: Secara harfiah berarti “harinya”. Konteks selanjutnya menjelaskan bahwa yang dimaksud ialah hari kelahirannya, tetapi ungkapan ringkas sumber dipertahankan dalam teks utama.
theological_decisions:
- issue: Apakah “harinya” perlu diperjelas sebagai hari kelahiran Ayub
  choice: Mempertahankan ungkapan ringkas “harinya” dalam teks utama
  alternative: hari kelahirannya
  rationale: Ayat ini sendiri tidak menyebut kelahiran secara eksplisit, walaupun ayat-ayat berikutnya memperjelas maksudnya. Pilihan ini menjaga perkembangan teks dan tidak memasukkan penjelasan kontekstual ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Idiom “membuka mulutnya” dipertahankan karena dapat dipahami dan membawa bobot retoris sumber. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkan.
