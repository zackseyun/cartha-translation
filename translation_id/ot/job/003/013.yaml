  terminology: “Berbaring,” “tenang,” “tidur,” dan “beristirahat” merupakan padanan baku yang baik dan menjaga citraan tanpa memaksakan penafsiran doktrinal. Catatan kaki diperbaiki agar secara akurat mencerminkan konstruksi Ibrani “ada ketenangan bagiku.”
