  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: id
  text: Sebab sekarang aku sudah berbaring dengan tenang; aku sudah tidur—maka aku beristirahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “maka ada ketenangan bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan bagi harapan Ayub dalam konteks sebelumnya dan mempertahankan daya kausal teks Ibrani.
- source_word: עַתָּה
  choice: sekarang
  rationale: Menunjukkan keadaan kini yang secara hipotetis akan dialami Ayub seandainya ia mati ketika dilahirkan.
- source_word: שָׁכַבְתִּי
  choice: aku tentu sudah berbaring
  rationale: Mempertahankan gambaran jasmani verba שׁכב sekaligus mengungkapkan hasil kontrafaktual secara wajar dalam bahasa Indonesia.
- source_word: וְאֶשְׁקֹט
  choice: dengan tenang
  rationale: שׁקט menyatakan keadaan tidak terganggu atau tenteram. Ungkapan ini alami dalam bahasa Indonesia dan tidak menafsirkan kata tersebut secara berlebihan sebagai damai dalam arti teologis.
- source_word: יָשַׁנְתִּי
  choice: aku sudah tidur
  rationale: Mempertahankan verba biasa untuk tidur dan dengan demikian menjaga metafora kematian tanpa menjelaskannya secara eksplisit.
- source_word: אָז
  choice: saat itu
  rationale: Menandai keadaan konsekuensial dalam urutan puitis; pilihan ini menghindari pengulangan 'tentu' yang akan timbul jika diterjemahkan 'maka'.
- source_word: יָנוּחַ לִי
  choice: aku tentu sudah beristirahat
  rationale: Merupakan padanan Indonesia yang alami bagi konstruksi נוח dengan לִי, sambil mempertahankan keadaan istirahat dan bukan mengubahnya menjadi pernyataan doktrinal.
theological_decisions:
- issue: Gambaran kematian melalui berbaring, tidur, dan beristirahat
  choice: Mempertahankan bahasa harfiah tentang berbaring, tidur, dan beristirahat tanpa menyatakan doktrin tertentu mengenai keadaan orang mati.
  alternative: Menerjemahkan 'tidur' secara langsung sebagai 'mati' atau memperluasnya menjadi 'beristirahat dalam kematian'.
  rationale: Teks menggambarkan ketenangan kematian secara puitis melalui verba sehari-hari. Mempertahankan gambaran itu menjaga ketegangan puitis dan teologis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis namun mudah dipahami. Bentuk 'tentu sudah' menyampaikan nuansa kontrafaktual konteks tanpa menambahkan penjelasan ke dalam ayat. Tanda pisah mempertahankan jeda dan perkembangan paralel dari tidur menuju istirahat.
