  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: id
  text: Mengapa terang diberikan kepada orang yang menderita[a], dan hidup kepada mereka yang pahit jiwanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mengapa Ia memberikan terang kepada orang yang sengsara, dan hidup kepada mereka yang pahit jiwanya?” Bahasa Ibrani tidak menyebutkan siapa pemberinya, meskipun konteksnya mungkin menyiratkan Allah. “Terang” merupakan gambaran puitis bagi hidup yang masih berlanjut.'
    reason: alternative_reading_and_lexical_metaphor
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya ini membuka ratapan Ayub secara langsung dan wajar dalam bahasa Indonesia.
- source_word: יִתֵּן
  choice: diberikan
  rationale: Bentuk Ibrani secara harfiah berarti 'ia memberikan', tetapi pelakunya tidak disebutkan. Bentuk pasif mempertahankan ketidaktersuratan pemberi tanpa secara eksplisit menambahkan Allah.
- source_word: לְעָמֵל
  choice: kepada orang yang menderita
  rationale: עָמֵל di sini menunjuk kepada orang yang mengalami kesusahan atau penderitaan, bukan semata-mata orang yang bekerja keras. Pilihan ini alami dan sesuai dengan konteks ratapan.
- source_word: אוֹר
  choice: terang
  rationale: Metafora puitis Ibrani dipertahankan; dalam konteks ini terang melambangkan keberadaan atau hidup yang masih berlanjut.
- source_word: וְחַיִּים
  choice: dan hidup
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, חַיִּים lazim berarti 'hidup' sebagai satu konsep.
- source_word: לְמָרֵי נָפֶשׁ
  choice: kepada mereka yang pahit jiwanya
  rationale: Ungkapan ini mempertahankan gambaran Ibrani tentang kepahitan batin dan lebih alami dalam bahasa Indonesia daripada terjemahan yang terlalu harfiah.
theological_decisions:
- issue: Subjek tersirat dari יִתֵּן
  choice: Pemberi dibiarkan tidak disebutkan melalui bentuk pasif 'diberikan'.
  alternative: Menggunakan bentuk aktif 'Mengapa Ia memberikan...' atau menyebut 'Allah' secara eksplisit.
  rationale: Dalam konteksnya Allah mungkin dimaksudkan, tetapi teks Ibrani tidak menyebut-Nya pada ayat ini. Bentuk pasif mempertahankan ambiguitas dan ketegangan teologis dalam keluhan Ayub.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan bermartabat. Susunan paralel Ibrani dipertahankan, sedangkan ungkapan dibuat cukup alami bagi pembaca umum.
