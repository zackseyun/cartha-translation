  - severity: low
    issue: '"orang-orang yang mengutuki hari-hari" untuk אֹרְרֵי יוֹם'
    rationale: Nomina Ibrani adalah konstruksi padat dengan יוֹם tunggal generik. "Para pengutuk hari" lebih setia pada bentuk dan lebih alami dalam register puitis Indonesia.
  - severity: low
