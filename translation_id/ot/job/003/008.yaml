  yaml_path: translation/ot/job/003/008.yaml
  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: id
  text: 'Biarlah para pengutuk hari mengutukinya,

    mereka yang siap membangkitkan Lewiatan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרְרֵי יוֹם
  choice: orang-orang yang mengutuki hari-hari
  rationale: Nomina jamak 'para pengutuk' dan יוֹם tanpa artikel dipertahankan sebagai ungkapan umum, selaras dengan bukti sumber serta menghindari pembatasan diam-diam kepada 'hari itu'.
- source_word: יִקְּבֻהוּ
  choice: mengutukinya
  rationale: Pronomina objek maskulin tunggal merujuk secara alami kepada hari yang sedang dikutuki Ayub dalam konteks sebelumnya; bentuk Indonesia dengan -nya mempertahankan rujukan tersebut.
- source_word: הָעֲתִידִים
  choice: mereka yang sanggup
  rationale: Dalam konstruksi ini kata tersebut menunjuk pada orang-orang yang siap atau cakap melakukan tindakan berikut; 'sanggup' terdengar alami dan tidak menentukan apakah kesiapan itu sekadar niat atau kemampuan ritual.
- source_word: עֹרֵר
  choice: membangkitkan
  rationale: Infinitif ini berarti membangunkan atau membangkitkan; pilihan ini mempertahankan gambaran makhluk yang dibuat bangun atau digerakkan.
- source_word: לִוְיָתָן
  choice: Lewiatan
  rationale: Nama/istilah makhluk tersebut ditransliterasikan, bukan ditafsirkan sebagai hewan tertentu, sehingga citra puitis dan ambiguitas sumber tetap terjaga.
theological_decisions:
- issue: Identitas dan sifat Lewiatan
  choice: Lewiatan
  alternative: buaya, naga laut, atau monster kekacauan
  rationale: Ayat ini tidak menjelaskan secara pasti identitas makhluk itu. Transliterasi menghindari pemaksaan suatu identifikasi zoologis atau kosmologis.
- issue: Makna kemampuan membangkitkan Lewiatan
  choice: mereka yang sanggup membangkitkan Lewiatan
  alternative: para ahli mantra yang dapat memanggil monster mitologis
  rationale: Teks menyebut orang yang siap/cakap membangkitkannya, tetapi tidak secara eksplisit menyebut mantra, profesi ritual, atau menyatakan bahwa kuasa mereka nyata; terjemahan menjaga ketegangan puitis itu.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Susunan dua baris mempertahankan paralelisme. 'Mengutuki' dipilih untuk tindakan pengucapan kutuk, sedangkan 'Lewiatan' dipertahankan sebagai transliterasi yang lazim.
