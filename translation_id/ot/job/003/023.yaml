    reason: lexical_alternative
lexical_decisions:
- source_word: לְגֶבֶר
  choice: kepada seorang laki-laki
  rationale: Preposisi לְ melanjutkan pertanyaan retoris pada ayat sebelumnya tentang kepada siapa terang diberikan. גֶּבֶר berbentuk tunggal maskulin dan secara khusus menunjuk seorang laki-laki.
- source_word: אֲשֶׁר דַּרְכּוֹ
  choice: yang jalannya
  rationale: Konstruksi relatif ini secara alami diterjemahkan dengan 'yang jalannya'. 'Jalan' mempertahankan metafora Ibrani yang dapat menunjuk arah atau perjalanan hidup seseorang.
- source_word: נִסְתָּרָה
  choice: tersembunyi
  rationale: Bentuk Nifal menyatakan keadaan pasif. 'Tersembunyi' mempertahankan ketaksaan apakah jalan itu tidak terlihat oleh orang tersebut atau tersembunyi secara lebih umum.
- source_word: וַיָּסֶךְ ... בַּעֲדוֹ
  choice: dan yang telah ... kurung
  rationale: Kata kerja ini menggambarkan tindakan menutup atau membatasi seseorang dari sekelilingnya. 'Kurung' menyampaikan keadaan terhalang tanpa memberi kesan perlindungan yang dapat timbul dari ungkapan 'memagari' dalam bahasa Indonesia.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: אֱלוֹהַּ adalah sebutan puitis tunggal untuk Allah yang sering dipakai dalam kitab Ayub. Terjemahan 'Allah' tepat tanpa menambahkan gelar yang tidak terdapat dalam teks.
theological_decisions:
- issue: Pelaku tindakan yang mengurung
  choice: Allah dinyatakan secara langsung sebagai pihak yang mengurung laki-laki itu.
  alternative: Memakai susunan pasif yang mengaburkan atau menghilangkan pelaku ilahi.
  rationale: Teks Ibrani secara eksplisit menempatkan אֱלוֹהַּ sebagai subjek. Keluhan Ayub tidak boleh diperhalus dengan menyamarkan tindakan yang ia nisbahkan kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Ayat ini dipertahankan sebagai kelanjutan pertanyaan retoris dari ayat 20, sehingga dimulai dengan 'kepada'. Susunan 'telah Allah kurung' menjaga pelaku ilahi tetap jelas dan memberi tekanan puitis yang wajar.
