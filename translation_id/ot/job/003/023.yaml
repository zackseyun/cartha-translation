translation:
  language: id
  text: kepada seorang laki-laki yang jalannya tersembunyi[a], dan yang telah Allah kurung[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang jalan hidupnya terselubung.”'
    reason: lexical_alternative
  - marker: b
