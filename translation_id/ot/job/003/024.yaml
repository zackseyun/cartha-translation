base_translation:
  language: en
  yaml_path: translation/ot/job/003/024.yaml
  text: For my sighing comes before my bread[b][a], and my groanings pour out like water.
translation:
  language: id
  text: 'Sebab keluhanku datang sebelum rotiku[a],

    dan jeritan-jeritanku[b] tercurah seperti air.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makananku”; kata Ibrani yang secara harfiah berarti “rotiku” dapat merujuk lebih luas kepada apa yang dimakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “raungan-raunganku”; istilah Ibrani ini dapat menggambarkan seruan keras seperti raungan binatang, sehingga memperkuat gambaran penderitaan Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan tentang keadaan Ayub dalam rangkaian ratapannya; “sebab” mempertahankan hubungan penjelas tersebut.
- source_word: לִפְנֵי
  choice: sebelum
  rationale: 'Preposisi ini paling wajar menyatakan urutan waktu di sini: keluhan Ayub datang mendahului makannya.'
- source_word: לַחְמִי
  choice: rotiku
  rationale: לֶחֶם secara harfiah berarti “roti”, tetapi dapat merujuk lebih luas kepada makanan. Terjemahan utama mempertahankan gambaran konkret Ibrani, sedangkan arti luas dicatat dalam catatan kaki.
- source_word: אַנְחָתִי
  choice: keluhanku
  rationale: Kata ini menunjuk kepada keluhan atau helaan napas akibat kesesakan. “Keluhanku” alami dalam bahasa Indonesia dan tetap membedakannya dari seruan keras pada baris berikutnya.
- source_word: תָבֹא
  choice: datang
  rationale: Arti dasar verba בוא ialah “datang”; bentuk kini dalam bahasa Indonesia menyampaikan keadaan yang terus dialami Ayub.
- source_word: וַיִּתְּכוּ
  choice: tercurah
  rationale: Verba נתך menggambarkan sesuatu yang dicurahkan atau mengalir deras. “Tercurah” selaras dengan perbandingan “seperti air” dan menyampaikan luapan yang tak tertahan.
- source_word: כַמַּיִם
  choice: seperti air
  rationale: Perbandingan langsung dalam teks Ibrani dipertahankan secara alami.
- source_word: שַׁאֲגֹתָי
  choice: jeritan-jeritanku
  rationale: Nomina dari שׁאג dapat berarti raungan atau seruan keras. “Jeritan-jeritanku” menyampaikan penderitaan vokal yang hebat dalam bahasa Indonesia modern; nuansa harfiah seperti suara binatang dipertahankan dalam catatan kaki.
