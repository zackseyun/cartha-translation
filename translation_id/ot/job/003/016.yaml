base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: id
  text: Atau seperti janin yang gugur dan tersembunyi[a], aku tidak akan ada, seperti bayi-bayi yang tidak pernah melihat terang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti bayi yang lahir mati.” Kata Ibrani ini dapat menunjuk pada janin yang gugur atau bayi yang lahir mati.
    reason: lexical_alternative
  - marker: b
    text: “Melihat terang” adalah ungkapan Ibrani untuk memasuki atau mengalami kehidupan di dunia.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Atau
  rationale: Memperkenalkan kemungkinan lain dalam rangkaian harapan Ayub tentang ketidakberadaannya; bentuk sederhana ini alami dalam bahasa Indonesia.
- source_word: כְ/נֵ֣פֶל
  choice: seperti janin gugur
  rationale: Nomina נֵפֶל dapat menunjuk pada janin yang gugur atau bayi yang lahir mati. 'Janin gugur' ringkas, wajar, dan mempertahankan gambaran tentang kehidupan yang tidak sempat dialami.
- source_word: טָ֭מוּן
  choice: yang tersembunyi
  rationale: Partisip pasif dari טמן berarti 'disembunyikan/tersembunyi'. Pilihan ini mempertahankan metafora tanpa mempersempitnya menjadi penguburan.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: aku tidak akan ada
  rationale: Secara dekat mencerminkan verba 'ada/menjadi' dan menyampaikan keinginan kontrafaktual Ayub akan ketidakberadaan dalam bahasa Indonesia yang alami.
- source_word: כְ֝/עֹלְלִ֗ים
  choice: seperti bayi-bayi
  rationale: עֹלְלִים menunjuk kepada anak-anak yang sangat kecil atau bayi; konteks menekankan mereka yang belum pernah mengalami kehidupan di dunia.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: yang tidak pernah melihat terang
  rationale: Mempertahankan metafora Ibrani 'melihat terang' sambil memakai 'tidak pernah' untuk menyatakan bahwa pengalaman itu sama sekali tidak terjadi.
theological_decisions: []
