  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י לֹ֣א סָ֭גַר דַּלְתֵ֣י בִטְנִ֑/י וַ/יַּסְתֵּ֥ר עָ֝מָ֗ל מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/010.yaml
  text: because it did not shut the doors of my womb[b][a], nor hide trouble from my eyes.
translation:
  language: id
  text: Sebab malam itu tidak menutup pintu-pintu rahimku[a] dan tidak menyembunyikan kesusahan[b] dari mataku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perutku.” Dalam konteks ini, “rahim” paling sesuai karena Ayub sedang berbicara tentang kelahirannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesengsaraan,” “jerih payah,” atau “penderitaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi kutukan Ayub dalam konteks sebelumnya dan mempertahankan hubungan sebab-akibat.
- source_word: סָגַר
  choice: menutup
  rationale: Padanan langsung dan alami untuk tindakan menutup pintu.
- source_word: דַּלְתֵי
  choice: pintu-pintu
  rationale: Bentuk jamak dipertahankan dan gambaran konkret bahasa Ibrani tetap terlihat.
- source_word: בִטְנִי
  choice: rahimku
  rationale: Kata ini dapat berarti perut atau rahim. Konteks kelahiran mendukung 'rahim', sementara akhiran orang pertama dipertahankan secara formal dalam ungkapan puitis Ayub.
- source_word: וַיַּסְתֵּר
  choice: dan tidak menyembunyikan
  rationale: Negasi dari klausa pertama secara wajar berlaku juga pada verba ini. Bahasa Indonesia lebih jelas bila 'tidak' diulangi.
- source_word: עָמָל
  choice: kesusahan
  rationale: Padanan ini cukup luas untuk mencakup penderitaan, jerih payah, dan kesengsaraan tanpa mempersempit arti kata Ibrani.
- source_word: מֵעֵינָי
  choice: dari mataku
  rationale: Ungkapan konkret bahasa Ibrani dipertahankan dan dalam konteks berarti menjauhkan penderitaan dari penglihatan atau pengalaman Ayub.
theological_decisions:
- issue: Subjek tersirat dari verba orang ketiga tunggal
  choice: malam itu
  alternative: ia
  rationale: Subjek tidak disebut ulang dalam bahasa Ibrani, tetapi konteks terdekat menunjuk pada malam yang dikutuk Ayub. Penyebutan 'malam itu' membuat bahasa Indonesia jelas tanpa mengubah arah ratapan.
translation_notes:
  register: Bahasa Indonesia modern yang puitis tetapi tetap mudah dipahami. Citra 'pintu-pintu rahim' dan 'dari mataku' dipertahankan untuk menjaga kekonkretan puisi Ibrani; pengulangan 'tidak' dipakai demi kejelasan alami.
