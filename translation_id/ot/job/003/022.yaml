translation:
  language: id
  text: yang sangat bersukacita[a], yang bersorak-sorai ketika[b] menemukan kubur[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang bersukacita sampai kepada kegirangan”; frasa Ibrani ini merupakan ungkapan penguat.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena”; konjungsi Ibrani di sini dapat dipahami sebagai penanda sebab maupun waktu.
    reason: alternative_reading
  - marker: c
    text: Atau “sebuah kubur”. Kata Ibrani קָבֶר tidak memakai artikel dan dapat dipahami secara tak tentu atau secara umum sebagai kubur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: yang ... bersukacita
  rationale: Artikel dengan partisip berfungsi secara substantival dan melanjutkan gambaran tentang orang-orang pada ayat sebelumnya. Bentuk relatif “yang ... bersukacita” alami dalam bahasa Indonesia.
- source_word: אֱלֵי גִיל
  choice: sangat
  rationale: Ungkapan harfiahnya mengarah kepada kegembiraan, tetapi di sini berfungsi sebagai penguat idiomatis. “Sangat” menyampaikan intensitasnya dengan bahasa yang wajar.
- source_word: יָשִׂישׂוּ
  choice: yang bersorak-sorai
  rationale: Kata kerja ini menyatakan kegembiraan yang meluap. Pilihan ini mempertahankan peningkatan puitis setelah “bersukacita” tanpa mengulang kata yang sama.
- source_word: כִּי
  choice: ketika
  rationale: Konjungsi ini dapat memperkenalkan keadaan atau waktu yang memicu kegembiraan mereka. “Ketika” paling alami dalam alur puitis, sementara kemungkinan makna kausal dicatat dalam catatan kaki.
- source_word: יִמְצְאוּ
  choice: menemukan
  rationale: Padanan langsung dan alami bagi מצא yang mempertahankan kesederhanaan serta ketegasan ungkapan Ibrani.
- source_word: קָבֶר
  choice: kubur
  rationale: Nomina Ibrani tidak memakai artikel dan dapat dipahami sebagai “sebuah kubur” atau secara generik sebagai keadaan/tempat kematian. “Kubur” tanpa penentu terdengar puitis dan mempertahankan ketaktertentuan tersebut.
