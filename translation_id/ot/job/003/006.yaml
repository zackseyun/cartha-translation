  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: id
  text: Mengenai malam itu, biarlah kegelapan merebutnya; janganlah ia bersukacita di antara hari-hari dalam setahun[a]; janganlah ia masuk dalam hitungan bulan-bulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah ia digabungkan dengan hari-hari dalam setahun.” Kata kerja Ibrani di sini jarang dipakai; sebagian penafsir memahaminya sebagai pengeluaran malam itu dari kalender, bukan sebagai ketiadaan sukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: Mengenai malam itu
  rationale: Frasa ini dikedepankan sebagai topik yang ditekankan. Bentuk ini mempertahankan penonjolan tersebut dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: יִקָּחֵהוּ
  choice: biarlah ... merebutnya
  rationale: Kata לקח pada dasarnya berarti mengambil. Dalam konteks kegelapan yang menguasai malam, 'merebutnya' mempertahankan daya personifikasi dan nuansa penguasaan yang keras.
- source_word: אֹפֶל
  choice: kegelapan
  rationale: אֹפֶל menunjuk pada kegelapan atau kesuraman. 'Kegelapan' jelas, luas, dan tetap memungkinkan personifikasi melalui verba 'merebut'.
- source_word: אַל יִחַדְּ
  choice: janganlah ia bersukacita
  rationale: Bentuk yang jarang ini dapat dipahami sebagai ikut bersukacita atau berbagian dengan hari-hari dalam setahun. Karena maknanya diperdebatkan, kemungkinan 'digabungkan' dicatat dalam catatan kaki.
- source_word: בִּימֵי שָׁנָה
  choice: di antara hari-hari dalam tahun itu
  rationale: Preposisi ב dipahami sebagai keikutsertaan dalam kumpulan hari yang membentuk satu tahun; 'di antara' menyampaikan cakupan itu secara alami.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: dalam hitungan bulan-bulan
  rationale: Ungkapan ini mempertahankan gambaran tentang pencatatan atau penghitungan di antara bulan-bulan, bukan sekadar keberadaan di antaranya.
- source_word: אַל יָבֹא
  choice: janganlah ia masuk
  rationale: בוא berarti datang atau masuk. Bersama 'hitungan bulan-bulan', 'masuk' secara alami mengungkapkan penyertaan dalam penghitungan kalender.
