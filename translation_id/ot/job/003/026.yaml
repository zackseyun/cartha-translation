translation:
  language: id
  text: Aku tidak tenteram[a], dan aku tidak tenang; aku tidak beristirahat, dan gejolak datang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku tidak merasa tenteram, tidak merasa tenang, dan tidak mendapat istirahat.” Bahasa Ibrani memakai tiga verba yang hampir sejajar untuk menegaskan bahwa Ayub sama sekali tidak mengalami kelegaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kegelisahan datang,” “kegoncangan datang,” atau “kesusahan datang.” Kata Ibrani yang dipakai dapat menunjuk pada gangguan, kegelisahan, gejolak, atau kekacauan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: aku tenteram
  rationale: Kata ini menyatakan keadaan tenteram, lega, atau aman dari gangguan. “Tenteram” alami dalam bahasa Indonesia dan tetap cukup berbeda dari dua verba berikutnya.
- source_word: שָׁקַטְתִּי
  choice: aku tenang
  rationale: Kata ini menunjuk pada ketenangan atau keadaan tanpa gangguan. “Tenang” mempertahankan kesejajaran makna tanpa menyamakannya sepenuhnya dengan “tenteram”.
- source_word: נָחְתִּי
  choice: aku beristirahat
  rationale: Verba נוח berarti beristirahat atau menetap. Bentuk “beristirahat” jelas dan mempertahankan klimaks rangkaian tiga keadaan yang tidak dialami Ayub.
- source_word: רֹגֶז
  choice: kekacauan
  rationale: Nomina ini dapat berarti kegelisahan, gejolak, gangguan, atau kekacauan. “Kekacauan” mencakup pergolakan yang datang tanpa mempersempitnya menjadi amarah atau kesusahan semata.
- source_word: וַיָּבֹא
  choice: lalu ... datang
  rationale: Bentuk verba ini menyatakan datangnya רֹגֶז sesudah rangkaian penyangkalan. “Lalu ... datang” menyampaikan urutan tersebut tanpa menambahkan objek seperti “menimpaku” yang tidak dinyatakan secara eksplisit.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: aku tidak ... dan aku tidak ...; aku tidak ...
  rationale: Pengulangan “tidak” dan subjek orang pertama mempertahankan irama penyangkalan yang tegas dalam bahasa Ibrani serta memperkuat ratapan Ayub.
