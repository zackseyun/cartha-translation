  text: כִּ֤י פַ֣חַד פָּ֭חַדְתִּי וַ/יֶּאֱתָיֵ֑/נִי וַ/אֲשֶׁ֥ר יָ֝גֹ֗רְתִּי יָ֣בֹא לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/025.yaml
  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: id
  text: Sebab ketakutan yang kutakuti telah menimpa aku[a][b], dan apa yang kugentari telah datang kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hal yang kutakuti telah menimpa aku.” Bahasa Ibrani memakai kata benda dan kata kerja yang seakar—secara harfiah, “ketakutan yang kutakuti”—untuk memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja pada klausa pertama kemungkinan berarti “telah menimpa” atau “telah menyusul aku,” sedangkan klausa kedua secara lebih harfiah berbunyi “telah datang kepadaku.” Terjemahan ini mempertahankan sedikit variasi dalam kesejajaran bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi keluhan Ayub sebelumnya; “sebab” menyampaikan hubungan tersebut secara alami.
- source_word: פַחַד פָּחַדְתִּי
  choice: ketakutan yang kutakuti
  rationale: Ibrani memakai kata benda dan kata kerja yang seakar untuk memberi penekanan. Ungkapan ini mempertahankan pengulangan tersebut meskipun terdengar lebih kuat daripada tuturan biasa.
- source_word: וַיֶּאֱתָיֵנִי
  choice: telah menimpa aku
  rationale: Dalam konteks malapetaka, verba ini menyatakan sesuatu yang datang atas atau menimpa seseorang. Pilihan ini juga membedakannya dari ungkapan yang lebih harfiah “datang kepadaku” pada klausa kedua.
- source_word: וַאֲשֶׁר
  choice: dan apa yang
  rationale: Membuka klausa sejajar kedua dengan fungsi relatif secara wajar dalam bahasa Indonesia.
- source_word: יָגֹרְתִּי
  choice: kugentari
  rationale: Kata ini menyatakan rasa takut atau gentar. “Kugentari” mempertahankan bobot emosionalnya sekaligus memberi sedikit variasi dari akar takut pada klausa pertama.
- source_word: יָבֹא לִי
  choice: telah datang kepadaku
  rationale: Bentuk Ibrani secara harfiah menyatakan “datang kepadaku.” Bentuk perfektif bahasa Indonesia sesuai dengan malapetaka yang kini telah dialami Ayub dan mempertahankan variasi dari “menimpa aku.”
theological_decisions: []
