  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan “ketakutan yang kutakuti” sengaja dipertahankan untuk mencerminkan penekanan bentuk seakar dalam bahasa Ibrani; “kugentari” menjaga kesejajaran tanpa menghapus variasi leksikal.
