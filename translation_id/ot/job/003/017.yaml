translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat digunakan dengan tetap mempertahankan pengulangan 'di sana' serta kesejajaran kedua larik. 'Fasik' dipilih sebagai istilah moral yang mapan, sedangkan idiom tentang kekuatan diterjemahkan secara alami dan bentuk harfiahnya dicatat.
