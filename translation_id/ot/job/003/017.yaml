  yaml_path: translation/ot/job/003/017.yaml
  text: There the wicked cease from turmoil[b][a], and there those weary in strength find rest.
translation:
  language: id
  text: Di sana orang-orang fasik tidak lagi bergolak[a], dan di sana orang-orang yang kehabisan tenaga[b] beristirahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “bergolak” juga dapat berarti “berada dalam kegelisahan”, “mengamuk”, atau “berada dalam kegaduhan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka yang letih dalam kekuatan”, yaitu mereka yang tenaganya telah terkuras.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Di sana
  rationale: Keterangan tempat ini menunjuk kepada tempat yang sedang dibicarakan dalam ratapan Ayub. Pengulangannya pada paruh kedua dipertahankan demi penekanan dan kesejajaran puisi.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk ini menunjuk kepada orang-orang yang jahat secara moral. 'Orang-orang fasik' merupakan ungkapan baku, ringkas, dan bermartabat dalam bahasa Indonesia.
- source_word: חָדְלוּ
  choice: berhenti
  rationale: Verba Qal ini berarti 'berhenti' atau 'tidak lagi melakukan'. Bentuk kini cocok dengan gambaran umum tentang keadaan di tempat tersebut.
- source_word: רֹגֶז
  choice: membuat kegaduhan
  rationale: Nomina ini dapat menyatakan gejolak, amukan, keresahan, atau gangguan. Dalam konstruksi dengan 'berhenti', terjemahan ini secara alami menggambarkan kegaduhan yang ditimbulkan orang fasik, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: וְשָׁם
  choice: dan di sana
  rationale: Konjungsi dan pengulangan keterangan tempat dipertahankan untuk mencerminkan struktur paralel teks Ibrani.
- source_word: יָנוּחוּ
  choice: beristirahat
  rationale: Verba נוח berarti berhenti bergerak, menetap, atau beristirahat. 'Beristirahat' alami dalam konteks orang-orang yang kehabisan tenaga.
- source_word: יְגִיעֵי כֹחַ
  choice: orang-orang yang kehabisan tenaga
  rationale: Ungkapan harfiahnya adalah 'mereka yang letih dalam hal kekuatan', yakni orang-orang yang kekuatannya telah terkuras. Pilihan ini menyampaikan idiom tersebut dengan jelas dalam bahasa Indonesia modern.
