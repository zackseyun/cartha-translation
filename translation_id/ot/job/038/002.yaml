base_translation:
  language: en
  yaml_path: translation/ot/job/038/002.yaml
  text: Who is this who darkens counsel with words without knowledge?[a]
translation:
  language: id
  text: Siapakah ini yang mengaburkan pertimbangan dengan kata-kata tanpa pengetahuan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rancangan” atau “maksud” untuk “pertimbangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Siapakah ini
  rationale: Bentuk tanya ini mempertahankan tantangan yang tegas dalam bahasa Ibrani dan tetap alami serta bermartabat dalam bahasa Indonesia.
- source_word: מַחְשִׁיךְ
  choice: menggelapkan
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang membuat sesuatu menjadi gelap atau tidak jelas, tanpa menggantinya dengan tafsiran seperti 'mengacaukan'.
- source_word: עֵצָה
  choice: nasihat
  rationale: Kata ini dapat menunjuk pada nasihat, rencana, atau maksud. 'Nasihat' menjaga gagasan pertimbangan yang bijaksana sekaligus tidak mempersempit kemungkinan maknanya.
- source_word: בְמִלִּין
  choice: dengan kata-kata
  rationale: Preposisi ini menyatakan sarana; penggelapan itu dilakukan melalui kata-kata. Ungkapan tersebut alami dan dekat dengan bentuk sumber.
- source_word: בְּלִי דָעַת
  choice: tanpa pengetahuan
  rationale: Terjemahan langsung ini mempertahankan pengertian dasar frasa Ibrani dan tidak mengubahnya menjadi keterangan cara yang lebih interpretatif.
theological_decisions:
- issue: Makna עֵצָה dalam perkataan ilahi
  choice: nasihat
  alternative: rencana atau maksud
  rationale: Dalam konteksnya, Allah menegur perkataan yang mengaburkan hikmat sejati dan mungkin juga rencana atau maksud ilahi. 'Nasihat' mempertahankan keluasan makna dan ketegangan teologis itu tanpa memaksakan satu tafsiran yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat mempertahankan bentuk pertanyaan retoris serta metafora sumber, dengan penanda catatan kaki [a] di teks utama.
