base_translation:
  language: en
  yaml_path: translation/ot/job/038/008.yaml
  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: id
  text: Atau siapakah yang membendung laut dengan pintu-pintu ketika laut itu menyembur keluar dari rahim[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menerobos keluar”; kata Ibrani menggambarkan kemunculan yang kuat dan tiba-tiba.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini menggambarkan laut secara puitis seperti seorang anak yang keluar dari rahim, melanjutkan gambaran penciptaan dalam bagian ini.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסֶךְ
  choice: membendung
  rationale: Dalam konteks ini verba tersebut menyatakan tindakan menahan atau mengurung laut. “Membendung” alami dalam bahasa Indonesia dan mempertahankan gambaran tentang daya laut yang dibatasi.
- source_word: בִּדְלָתַיִם
  choice: dengan pintu-pintu
  rationale: Bentuk dual dari דֶּלֶת menunjuk pada sepasang pintu. “Pintu-pintu” mempertahankan metafora arsitektural serta fungsi instrumental preposisi בְּ tanpa mengubahnya menjadi “gerbang”.
- source_word: יָם
  choice: laut
  rationale: Walaupun tanpa artikel eksplisit, konteks penciptaan menunjukkan laut sebagai entitas yang sudah tertentu; bahasa Indonesia tidak memerlukan artikel definit.
- source_word: בְּגִיחוֹ
  choice: ketika laut itu menyembur keluar
  rationale: גיח menggambarkan kemunculan yang kuat dan tiba-tiba. “Menyembur keluar” menyampaikan gerak tersebut secara hidup dan wajar; subjek diulang demi kejelasan bahasa Indonesia.
- source_word: מֵרֶחֶם
  choice: dari rahim
  rationale: Ungkapan ini mempertahankan gambaran kelahiran yang mempersonifikasikan laut.
- source_word: יֵצֵא
  choice: keluar
  rationale: Verba finit ini melengkapi gambaran laut yang muncul dari rahim. Maknanya dipadukan secara alami dengan “menyembur keluar” agar bahasa Indonesia tidak terasa berulang tanpa kehilangan unsur semantisnya.
theological_decisions:
- issue: Gambaran puitis penciptaan dan kelahiran laut
  choice: Mempertahankan gambaran Allah membendung laut dengan pintu-pintu ketika laut muncul dari rahim.
  alternative: Mengabstraksikannya menjadi pernyataan bahwa Allah sekadar menetapkan batas laut.
  rationale: Bahasa Ibrani dengan sengaja mempersonifikasikan laut sebagai bayi yang lahir dan langsung dibatasi. Mempertahankan metafora ini menyajikan puisi penciptaan sebagaimana adanya tanpa menjadikannya klaim mitologis literal.
- issue: Pelaku dalam pertanyaan retoris
  choice: Memakai “siapakah” tanpa menambahkan nama Allah.
  alternative: Menuliskan “siapakah selain Aku” atau menyebut Allah secara eksplisit.
  rationale: Konteks jelas menunjuk kepada Allah, tetapi ayat ini sendiri berbentuk pertanyaan dan tidak menyebut nama-Nya. Terjemahan tidak menambahkan unsur yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Membendung” lebih idiomatis daripada “mengurung” bagi laut, sedangkan “dengan pintu-pintu” mempertahankan metafora konkret teks Ibrani. Urutan penanda catatan dibuat [a][b] sesuai urutan keterangan leksikal lalu keterangan gambaran puitis.
