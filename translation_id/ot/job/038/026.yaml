  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: id
  text: untuk menurunkan hujan atas tanah yang tidak ada seorang pun, atas padang belantara yang tidak ada manusia di dalamnya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: untuk menurunkan hujan
  rationale: Bentuk kausatif menyatakan tindakan menyebabkan hujan turun; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kausatif.
- source_word: עַל
  choice: ke atas
  rationale: Preposisi ini menunjukkan permukaan atau wilayah yang menerima hujan; dalam konstruksi dengan 'menurunkan hujan', 'ke atas' terdengar alami.
- source_word: אֶרֶץ
  choice: tanah
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada suatu kawasan daratan, bukan seluruh bumi atau sebuah negara.
- source_word: לֹא אִישׁ
  choice: yang tidak didiami seorang pun
  rationale: אִישׁ berbentuk tunggal dan di sini menyatakan ketiadaan orang. Terjemahan eksistensial-lokatif ini alami dalam bahasa Indonesia tanpa membatasi makna hanya kepada laki-laki.
- source_word: מִדְבָּר
  choice: padang belantara
  rationale: מִדְבָּר berarti daerah liar atau tanah tak digarap, tidak selalu gurun berpasir; 'padang belantara' mempertahankan cakupan itu.
- source_word: לֹא אָדָם בּוֹ
  choice: yang tidak dihuni manusia
  rationale: אָדָם di sini mengacu secara umum kepada manusia. 'Manusia' juga mempertahankan variasi leksikal terhadap אִישׁ, sedangkan בּוֹ dinyatakan secara alami melalui konstruksi lokatif 'dihuni'.
theological_decisions:
- issue: Makna generik אָדָם dalam paralelisme puitis
  choice: manusia
  alternative: orang; umat manusia
  rationale: Konteks menyatakan tidak adanya manusia di wilayah itu, bukan seorang laki-laki tertentu. 'Manusia' mempertahankan makna generik sekaligus membedakannya dari אִישׁ pada baris sebelumnya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme kedua klausa dipertahankan dengan 'ke atas ... yang tidak ...', sementara perbedaan אִישׁ dan אָדָם tercermin melalui 'seorang pun' dan 'manusia'.
