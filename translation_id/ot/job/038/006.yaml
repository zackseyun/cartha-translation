  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל מָ֭ה אֲדָנֶ֣י/הָ הָטְבָּ֑עוּ א֥וֹ מִֽי יָ֝רָ֗ה אֶ֣בֶן פִּנָּתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/006.yaml
  text: On what were its bases sunk[a], or who laid its cornerstone[b],
translation:
  language: id
  text: Di atas apakah alas-alasnya ditanamkan[a], atau siapakah yang meletakkan batu penjurunya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dasar-dasarnya" atau "soket-soketnya". Kata Ibrani ini menunjuk pada alas atau tumpuan struktural.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "siapakah yang melemparkan batu sudutnya"; dalam gambaran pembangunan, maksudnya ialah meletakkan batu penjuru.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Di atas apakah
  rationale: Mempertahankan pertanyaan tentang tumpuan atau dasar dengan ungkapan Indonesia yang alami.
- source_word: אֲדָנֶיהָ
  choice: alas-alasnya
  rationale: אֶדֶן menunjuk pada alas, landasan, atau soket struktural. Bentuk konkret jamak dipertahankan dalam metafora bangunan.
- source_word: הָטְבָּעוּ
  choice: ditanamkan
  rationale: Bentuk Hofal dari טָבַע menyatakan dibuat tenggelam atau tertancap. 'Ditanamkan' menyampaikan tindakan pasif memasukkan alas secara kukuh tanpa terdengar janggal.
- source_word: אוֹ
  choice: atau
  rationale: Kata penghubung disjungtif yang mengaitkan kedua pertanyaan retoris.
- source_word: מִי
  choice: siapakah
  rationale: Kata tanya untuk pribadi; bentuk ini sesuai dengan ragam puitis yang bermartabat.
- source_word: יָרָה
  choice: meletakkan
  rationale: Secara harfiah dapat berarti melemparkan atau melontarkan, tetapi dalam gambaran pembangunan menunjuk pada penempatan batu penjuru.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: batu penjurunya
  rationale: Ungkapan harfiahnya 'batu sudutnya'; 'batu penjuru' merupakan istilah arsitektural Indonesia yang alami dan mempertahankan sufiks feminin yang mengacu kepada bumi.
theological_decisions:
- issue: Metafora arsitektural bagi penciptaan bumi
  choice: Mempertahankan gambaran alas-alas dan batu penjuru.
  alternative: Memparafrasakan sebagai 'Apa yang menopang bumi?'
  rationale: Pertanyaan Allah bersifat puitis dan menggambarkan bumi sebagai bangunan. Metafora itu dipertahankan tanpa mengubahnya menjadi penjelasan kosmologis atau ilmiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang wajar. Susunan pertanyaan dan metafora bangunan dipertahankan, sementara istilah teknis yang kurang lazim dijelaskan dalam catatan kaki.
