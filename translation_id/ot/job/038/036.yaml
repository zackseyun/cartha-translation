  text: מִי שָׁ֭ת בַּ/טֻּח֣וֹת חָכְמָ֑ה א֤וֹ מִֽי נָתַ֖ן לַ/שֶּׂ֣כְוִי בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: id
  text: Siapakah yang menaruh hikmat dalam batin,[a] atau yang memberikan pengertian kepada pikiran?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Siapakah yang menaruh hikmat dalam bagian-bagian tersembunyi, atau yang memberikan pengertian kepada ayam jantan?” Sebagian memahami istilah kedua sebagai nama burung—secara tradisional, “ayam jantan,” dan kadang-kadang “ibis”—bukan sebagai pikiran.
    reason: Mempertahankan kemungkinan leksikal alternatif bagi dua istilah Ibrani yang langka dan diperdebatkan.
lexical_decisions:
- source_word: מִי
  choice: Siapakah
  rationale: Kata tanya yang membuka pertanyaan retoris Allah; bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: שָׁת
  choice: menaruh
  rationale: Menyampaikan makna dasar 'menaruh/menempatkan' dan berpasangan secara alami dengan 'memberikan' pada klausa kedua.
- source_word: בַּטֻּחוֹת
  choice: dalam batin manusia
  rationale: Istilah yang sulit ini tampaknya menunjuk pada bagian terdalam atau keberadaan batiniah. 'Batin manusia' mempertahankan gambaran antropologis tanpa terjemahan harfiah 'ginjal' yang berpotensi menyesatkan pembaca modern.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku dan wajar bagi חָכְמָה dalam sastra hikmat.
- source_word: אוֹ
  choice: atau
  rationale: Mempertahankan penghubung disjungtif antara dua klausa sejajar.
- source_word: נָתַן
  choice: memberikan
  rationale: Padanan langsung yang alami dan mempertahankan kesejajaran dengan 'menaruh'.
- source_word: לַשֶּׂכְוִי
  choice: kepada pikiran
  rationale: Kata ini sangat diperdebatkan. Kesejajaran dengan 'batin' serta pasangan 'hikmat/pengertian' mendukung arti kemampuan batiniah, yakni pikiran; kemungkinan arti burung tetap dicatat dalam catatan kaki.
- source_word: בִינָה
  choice: pengertian
  rationale: Padanan baku yang menjaga hubungan semantis sekaligus perbedaan dari 'hikmat'.
theological_decisions:
- issue: Makna dua istilah antropologis yang sulit dalam konteks firman ilahi tentang hikmat
  choice: Ayat ini berbicara tentang pemberian hikmat dan pengertian kepada batin serta pikiran manusia.
  alternative: Ayat ini mungkin berbicara tentang pengetahuan naluriah yang diberikan kepada burung, khususnya ayam jantan atau ibis.
  rationale: Kesejajaran puitis antara istilah pertama dan kedua, serta antara 'hikmat' dan 'pengertian', lebih mendukung rujukan kepada kemampuan batin manusia. Namun, karena tafsiran tentang burung memiliki dasar leksikal dan tradisi yang lama, kemungkinan itu tidak dihapus, melainkan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Frasa 'batin manusia' memperjelas rujukan antropologis yang tersirat tanpa menghilangkan alternatif tekstual-leksikal, yang disajikan dalam catatan kaki. Penanda [a] hadir dalam teks utama.
