  text: when they crouch in their dens and lie in wait in the thicket?[a]
translation:
  language: id
  text: ketika mereka merunduk di sarang mereka dan diam menunggu dalam semak belukar untuk menyergap?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam tempat persembunyian” atau “dalam tempat berlindung” untuk “dalam semak belukar.” Kata Ibrani סֻכָּה di sini menunjuk pada tempat tertutup yang cocok untuk mengintai, bukan pondok yang didirikan untuk perayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ketika
  rationale: Dalam rangkaian pertanyaan retoris ini, kata tersebut memperkenalkan keadaan atau waktu saat singa-singa menanti mangsa; padanan temporal “ketika” paling wajar.
- source_word: יָשֹׁחוּ
  choice: mereka merunduk
  rationale: Kata kerja ini menggambarkan tubuh yang direndahkan dalam posisi berburu. “Merunduk” alami dalam bahasa Indonesia dan sesuai dengan konteks singa.
- source_word: בַמְּעוֹנוֹת
  choice: di sarang mereka
  rationale: מְעוֹנוֹת menunjuk pada tempat tinggal atau sarang binatang. “Sarang” merupakan padanan Indonesia yang lazim dalam konteks singa; unsur kepunyaan dinyatakan secara idiomatis.
- source_word: יֵשְׁבוּ
  choice: diam menunggu
  rationale: Makna dasarnya adalah duduk, tinggal, atau menetap. Bersama frasa tujuan לְמוֹ אָרֶב, ungkapan “diam menunggu” menyampaikan posisi menetap saat mengintai tanpa menghapus unsur penantian untuk menyergap.
- source_word: בַסֻּכָּה
  choice: dalam semak belukar
  rationale: Dalam konteks perburuan, סֻכָּה menunjuk pada tempat tertutup yang menyediakan perlindungan atau persembunyian, bukan pondok perayaan. “Semak belukar” memberi gambaran alami yang sesuai, sementara cakupan alternatif dijelaskan dalam catatan kaki.
- source_word: לְמוֹ אָרֶב
  choice: untuk menyergap
  rationale: Frasa ini menyatakan tujuan berada dalam persembunyian, yakni melakukan penyergapan. Bentuk verbal “untuk menyergap” lebih alami daripada nomina abstrak “untuk penyergapan” dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern yang lugas dan bermartabat. Susunan dua tindakan dipertahankan: singa-singa merunduk di sarang lalu diam menunggu di tempat tertutup dengan tujuan menyergap. Tanda tanya dipertahankan karena ayat ini meneruskan pertanyaan retoris dari konteks sebelumnya.'
