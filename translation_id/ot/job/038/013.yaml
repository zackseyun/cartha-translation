  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
translation:
  language: id
  text: supaya fajar memegang ujung-ujung bumi[a], dan orang-orang fasik dikibaskan darinya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penjuru-penjuru bumi.” Secara harfiah, bahasa Ibrani berbunyi “sayap-sayap bumi,” suatu gambaran puitis bagi bagian-bagiannya yang terluar.
    reason: lexical_alternative
  - marker: b
    text: Gambarannya ialah fajar memegang bumi lalu mengibaskan orang-orang fasik darinya, seperti debu dikibaskan dari kain.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: supaya fajar memegang
  rationale: Infinitif konstruk dengan ל menyatakan tujuan atau hasil sebagai kelanjutan ayat sebelumnya. Subjek tersiratnya adalah fajar; penyebutan kembali membuat hubungan antarayat jelas dalam bahasa Indonesia. Kata 'memegang' mempertahankan gambaran konkret אחז tanpa menambah kesan kekerasan.
- source_word: בְּכַנְפוֹת
  choice: ujung-ujung
  rationale: כָּנָף secara harfiah berarti 'sayap', tetapi dalam ungkapan ruang bersama 'bumi' menunjuk pada bagian-bagian terluar. 'Ujung-ujung' alami dalam bahasa Indonesia dan tetap mempertahankan citra puitisnya.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks kosmis perkataan TUHAN mengenai penciptaan dan fajar, kata ini menunjuk pada bumi, bukan sekadar suatu negeri.
- source_word: וְיִנָּעֲרוּ
  choice: dikibaskan
  rationale: Bentuk Nifal dari נער menggambarkan sesuatu yang terlepas atau tersingkir karena dikibas. 'Dikibaskan' mempertahankan citra bumi seperti kain yang dikibas dan berpadu alami dengan 'darinya'.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk substantival ini menunjuk kepada orang yang jahat secara moral. 'Orang-orang fasik' merupakan ungkapan Indonesia yang ringkas, bermartabat, dan lazim dalam konteks Alkitab.
- source_word: מִמֶּנָּה
  choice: darinya
  rationale: Akhiran feminin tunggal merujuk kembali kepada bumi. 'Darinya' mempertahankan makna 'dari bumi itu' tanpa mempersempit apakah mereka dikibaskan keluar atau lepas dari permukaannya.
