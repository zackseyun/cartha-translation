  text: Apakah engkau memburu mangsa bagi singa betina[a] dan memuaskan rasa lapar singa-singa muda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “singa”. Kata Ibrani ini dapat merujuk kepada singa jantan ataupun betina.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Secara lebih harfiah: “memenuhi kehidupan singa-singa muda”; ungkapan ini berarti memenuhi kebutuhan makan atau memuaskan rasa lapar mereka.'
    reason: idiom_clarification
lexical_decisions:
- source_word: הֲתָצוּד
  choice: Apakah engkau memburu
  rationale: Partikel tanya הֲ dengan bentuk imperfek orang kedua tunggal maskulin dari צוד menyampaikan pertanyaan retoris yang ditujukan kepada Ayub. “Memburu” mempertahankan gambaran perburuan.
- source_word: לְלָבִיא
  choice: bagi singa betina
  rationale: Preposisi לְ berarti “bagi/untuk”. לָבִיא dapat merujuk kepada singa jantan atau betina; konteks pemberian makan kepada singa-singa muda mendukung “singa betina”, sementara ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: טָרֶף
  choice: mangsa
  rationale: טָרֶף menunjuk pada hasil buruan yang menjadi makanan binatang pemangsa. “Mangsa” mempertahankan nuansa predatorisnya.
- source_word: וְחַיַּת
  choice: dan ... nafsu makan
  rationale: Dalam susunan dengan מלא, חַיַּת secara idiomatis menunjuk pada kehidupan, kebutuhan hidup, atau selera yang dipenuhi. “Nafsu makan” jelas dan alami dalam konteks ini, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: כְּפִירִים
  choice: singa-singa muda
  rationale: כְּפִירִים berarti singa-singa muda, bukan semata-mata anak singa yang baru lahir.
- source_word: תְּמַלֵּא
  choice: mengenyangkan
  rationale: Bentuk Piel dari מלא secara dasar berarti “memenuhi”. Bersama “nafsu makan”, “mengenyangkan” menyampaikan makna idiomatisnya secara alami dan tetap mempertahankan gagasan pemenuhan.
