  register: Bahasa Indonesia baku modern dengan nada puitis dan agung yang sesuai dengan wacana ilahi dalam Ayub 38. Pertanyaan berlanjut dari konteks ayat sebelumnya, sehingga tanda tanya dipertahankan.
