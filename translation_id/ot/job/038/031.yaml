  yaml_path: translation/ot/job/038/031.yaml
  text: Can you bind the chains of the Pleiades[c][b][a], or loosen the cords of Orion?
translation:
  language: id
  text: Dapatkah engkau mengikat belenggu Pleiades[a], atau melonggarkan tali-tali Orion[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “belenggu” jarang dipakai dan dapat juga dipahami sebagai “ikatan” atau “pengikat”; sebagian terjemahan lama menafsirkannya sebagai “pengaruh yang manis.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, nama Ibrani ini kemungkinan menunjuk pada rasi Orion; di tempat lain, kata yang sama dapat berarti “orang bebal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְקַשֵּׁר
  choice: Dapatkah engkau mengikat
  rationale: Partikel tanya dan bentuk Piel orang kedua tunggal membentuk pertanyaan retoris tentang keterbatasan manusia. “Mengikat” alami dalam bahasa Indonesia dan mempertahankan gambaran konkret teks.
- source_word: מַעֲדַנּוֹת
  choice: belenggu
  rationale: Kata jamak yang langka ini kemungkinan menunjuk pada ikatan, pengikat, atau sesuatu yang menyatukan. “Belenggu” mempertahankan citra pengekangan dan sejajar dengan “tali-tali,” tanpa mengikuti tafsiran tradisional “pengaruh yang manis.”
- source_word: כִּימָה
  choice: Pleiades
  rationale: Nama astronomis ini secara umum diidentifikasi sebagai gugus bintang Pleiades; bentuk nama bakunya dipakai dalam bahasa Indonesia.
- source_word: מֹשְׁכוֹת
  choice: tali-tali
  rationale: Bentuk jamak ini merujuk pada sesuatu yang dipakai untuk menarik atau menahan. “Tali-tali” konkret, mudah dipahami, dan cocok dengan tindakan melonggarkan.
- source_word: כְּסִיל
  choice: Orion
  rationale: Dalam konteks astronomis dan dalam kesejajaran dengan Pleiades, kata ini paling mungkin menunjuk pada rasi Orion, meskipun sebagai nomina umum kata tersebut dapat berarti “orang bebal.”
- source_word: תְּפַתֵּחַ
  choice: melonggarkan
  rationale: Secara dasar verba ini berarti “membuka,” tetapi dengan objek berupa tali, makna idiomatisnya ialah melonggarkan atau melepaskan ikatan. “Melonggarkan” menjaga kesejajaran kontras dengan “mengikat.”
