  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: id
  text: ketika bintang-bintang fajar bernyanyi bersama, dan semua anak-anak Allah[a] bersorak-sorai?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “makhluk-makhluk surgawi” atau “malaikat-malaikat.” Secara harfiah dalam bahasa Ibrani: “anak-anak Allah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/רָן
  choice: ketika ... bernyanyi
  rationale: Preposisi ב pada bentuk infinitif רנן menyatakan waktu dalam rangkaian pertanyaan ini. Kata kerja tersebut menggambarkan seruan atau nyanyian sukacita; “bernyanyi” selaras dengan paralelisme puitis berikutnya.
- source_word: יַחַד
  choice: bersama
  rationale: Kata ini menyatakan kebersamaan atau keserempakan; “bersama” alami dalam bahasa Indonesia dan mempertahankan daya kolektifnya.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: bintang-bintang fajar
  rationale: Frasa konstruksi ini secara harfiah berarti “bintang-bintang fajar/pagi.” “Bintang-bintang fajar” mempertahankan citra puitis sekaligus terdengar wajar.
- source_word: וַ/יָּרִיעוּ
  choice: bersorak-sorai
  rationale: Bentuk Hifil dari רוע/ריע berarti memperdengarkan sorak, sering kali dalam kegembiraan. “Bersorak-sorai” menyampaikan nuansa perayaan dan sejalan dengan nyanyian pada baris pertama.
- source_word: כָּל
  choice: semua
  rationale: Terjemahan langsung yang menegaskan keseluruhan kelompok.
- source_word: בְּנֵי אֱלֹהִים
  choice: anak Allah
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak Allah.” Dalam bahasa Indonesia, bentuk majemuk “semua anak Allah” sudah menyatakan jamak. Pilihan ini mempertahankan ungkapan sumber tanpa langsung menafsirkannya sebagai malaikat atau makhluk surgawi.
theological_decisions:
- issue: Identitas בְּנֵי אֱלֹהִים
  choice: anak Allah dalam teks utama
  alternative: makhluk-makhluk surgawi; malaikat-malaikat; makhluk-makhluk ilahi
  rationale: Dalam kitab Ayub, ungkapan ini kemungkinan menunjuk kepada para anggota sidang surgawi. Namun, menerjemahkannya langsung sebagai “malaikat” akan menutup ambiguitas dan menambahkan penafsiran. Ungkapan sumber dipertahankan, sedangkan kemungkinan maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan ayat mempertahankan paralelisme Ibrani. Tanda tanya dipertahankan karena ayat ini melanjutkan pertanyaan dari konteks sebelumnya; penanda catatan kaki [a] ditempatkan dalam teks utama.
