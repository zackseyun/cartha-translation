  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: id
  text: Sudahkah engkau memahami luasnya bumi? Katakanlah, jika engkau mengetahui semuanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: Sudahkah engkau memahami
  rationale: Bentuk hitpael dari בין menyatakan memperhatikan dengan saksama hingga memperoleh pemahaman; 'memahami' alami dalam bahasa Indonesia dan sesuai dengan tantangan retoris konteks.
- source_word: רַחֲבֵי אָרֶץ
  choice: luasnya bumi
  rationale: Bentuk jamak/abstrak רַחֲבֵי menunjuk pada bentangan atau keluasan bumi. 'Luasnya bumi' mempertahankan gagasan spasial dengan ungkapan Indonesia yang wajar.
- source_word: הַגֵּד
  choice: Beritahukanlah
  rationale: Imperatif hiphil dari נגד berarti menyatakan atau memberitahukan; bentuk ini mempertahankan nada tantangan langsung.
- source_word: כֻלָּהּ
  choice: semuanya
  rationale: Pronomina feminin tunggal merujuk kembali kepada bumi dan secara harfiah menyampaikan 'seluruhnya'. 'Semuanya' mempertahankan cakupan total tanpa menambahkan objek yang tidak dinyatakan.
theological_decisions:
- issue: Cakupan pengetahuan manusia yang dipertanyakan dalam ujaran ilahi
  choice: jika engkau mengetahui semuanya
  alternative: jika engkau mengetahui seluruh bumi
  rationale: Terjemahan mempertahankan tantangan retoris dan rujukan pronominal teks Ibrani tanpa mempersempitnya menjadi pengetahuan geografis tertentu atau memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'engkau' dipakai untuk sapaan tunggal dalam wacana puitis ilahi. Tidak diperlukan catatan kaki karena ambiguitas pronominal dapat dipertahankan secara alami dalam teks utama.
