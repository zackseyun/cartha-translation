base_translation:
  language: en
  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: id
  text: Pernahkah gerbang-gerbang maut tersingkap bagimu, dan pernahkah engkau melihat gerbang-gerbang kegelapan pekat[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bayang-bayang maut.” Kata Ibrani צַלְמָוֶת secara tradisional diterjemahkan demikian, tetapi juga dapat berarti kegelapan pekat atau kesuraman secara lebih umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/נִגְלוּ לְךָ
  choice: Pernahkah ... tersingkap bagimu
  rationale: Partikel tanya הֲ dan bentuk Nifal perfektum dari גלה membentuk pertanyaan retoris. “Tersingkap bagimu” mempertahankan nuansa pasif serta terdengar alami dan puitis dalam bahasa Indonesia.
- source_word: שַׁעֲרֵי מָוֶת
  choice: gerbang-gerbang maut
  rationale: Frasa konstruksi Ibrani dipertahankan secara konkret. “Maut” cocok dengan citra puitis tentang ranah kematian.
- source_word: וְ/שַׁעֲרֵי
  choice: dan ... gerbang-gerbang
  rationale: Kata penghubung וְ diterjemahkan secara langsung sebagai “dan”; pengulangan “pernahkah” memperjelas bahwa klausa kedua tetap merupakan bagian dari pertanyaan retoris.
- source_word: צַלְמָוֶת
  choice: kegelapan pekat
  rationale: Dalam konteks ini צַלְמָוֶת dapat menunjuk pada kegelapan yang sangat dalam atau kesuraman, tanpa harus selalu berarti kematian secara langsung. Pilihan ini mempertahankan citra suram dan membuka alternatif tradisional melalui catatan kaki.
- source_word: תִּרְאֶה
  choice: pernahkah engkau melihat
  rationale: Bentuk Qal imperfek orang kedua maskulin tunggal dipahami dalam rangkaian pertanyaan retoris mengenai pengalaman Ayub. “Pernahkah ... melihat” sejajar secara alami dengan klausa pertama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. Sapaan tunggal “engkau” sesuai dengan ujaran langsung Allah kepada Ayub. Pengulangan “gerbang-gerbang” mempertahankan bentuk jamak dan citra konkret teks Ibrani.
