  terminology: “Samudra raya” merupakan padanan puitis yang tepat untuk תְּהוֹם dalam konteks ini. “Engkau” sesuai dengan sapaan langsung Allah kepada Ayub. Tidak ada istilah teologis yang perlu diubah.
