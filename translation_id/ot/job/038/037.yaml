  text: מִֽי יְסַפֵּ֣ר שְׁחָקִ֣ים בְּ/חָכְמָ֑ה וְ/נִבְלֵ֥י שָׁ֝מַ֗יִם מִ֣י יַשְׁכִּֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/037.yaml
  text: Who can count the clouds with wisdom[a], or tip over the jars of the heavens?
translation:
  language: id
  text: 'Siapa dapat menghitung awan-awan dengan hikmat,

    dan siapa dapat menunggingkan tempayan-tempayan langit?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat terbaring tempayan-tempayan langit.” Gambaran ini ialah wadah-wadah di langit yang menyimpan hujan lalu ditunggingkan sehingga isinya tercurah.
    reason: Menjelaskan ungkapan puitis Ibrani dan arti harfiah verba yang tidak dapat dipertahankan secara alami dalam teks utama.
lexical_decisions:
- source_word: מִי
  choice: Siapa dapat
  rationale: Kata tanya ini membuka dua pertanyaan retoris tentang kemampuan yang hanya dimiliki Allah. Penambahan “dapat” menyampaikan daya retoris bentuk verba Ibrani secara wajar dalam bahasa Indonesia.
- source_word: יְסַפֵּר
  choice: menghitung
  rationale: Bentuk piel dari ספר di sini berarti menghitung atau menentukan jumlah; “menghitung” paling sesuai dengan awan sebagai objeknya.
- source_word: שְׁחָקִים
  choice: awan-awan
  rationale: Dalam konteks meteorologis puisi ini, kata tersebut menunjuk kepada awan atau lapisan awan, bukan sekadar langit.
- source_word: בְּחָכְמָה
  choice: dengan hikmat
  rationale: Mempertahankan hubungan instrumental/adverbial preposisi בְּ dengan חָכְמָה dan mengikuti ragam bahasa hikmat Alkitab yang tetap mudah dipahami.
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: tempayan-tempayan langit
  rationale: נֵבֶל adalah wadah, khususnya kirbat atau tempayan. “Tempayan-tempayan langit” mempertahankan metafora wadah surgawi tanpa menambahkan kata “air” yang tidak tersurat.
- source_word: יַשְׁכִּיב
  choice: menunggingkan
  rationale: Bentuk hiphil dari שכב secara harfiah berarti membuat terbaring. Bila objeknya wadah, tindakan itu menggambarkan memiringkan atau menunggingkannya agar isinya tercurah; “menunggingkan” menjaga citra konkret tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan “siapa” dipertahankan karena terdapat dalam teks Ibrani dan menegaskan kesejajaran kedua pertanyaan. “Hikmat” dipilih sebagai istilah ragam Alkitab yang mapan, sedangkan “tempayan-tempayan langit” menjaga metafora kuno tanpa menjelaskannya secara berlebihan di dalam ayat.
