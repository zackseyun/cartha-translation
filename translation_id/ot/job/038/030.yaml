  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: id
  text: Air menjadi keras seperti batu[a], dan permukaan samudra raya membeku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Air menyembunyikan diri seperti batu.” Verba Ibrani yang dipakai di sini tidak lazim dalam konteks ini dan tampaknya menggambarkan air yang mengeras atau membeku.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “permukaan samudra raya terpaut erat” atau “mengental.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: seperti batu
  rationale: Prefiks כ menyatakan perbandingan. “Seperti batu” mempertahankan gambaran bahwa air mengeras, tanpa menyatakan secara lebih kuat bahwa air berubah menjadi batu.
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara gramatikal jamak, מַיִם lazim berfungsi sebagai nomina massa. Dalam bahasa Indonesia, “air” adalah padanan alami.
- source_word: יִתְחַבָּאוּ
  choice: menjadi keras
  rationale: Secara biasa verba ini berarti “menyembunyikan diri,” tetapi dalam konteks dingin, frasa “seperti batu,” dan paralelisme dengan klausa berikutnya, verba ini menggambarkan air yang mengeras atau membeku. Arti harfiahnya dicatat dalam catatan kaki karena pemakaiannya di sini tidak lazim.
- source_word: וּפְנֵי
  choice: dan permukaan
  rationale: Secara harfiah berarti “dan wajah,” tetapi ketika merujuk kepada perairan, ungkapan ini secara idiomatis berarti “permukaan.”
- source_word: תְהוֹם
  choice: samudra raya
  rationale: Ungkapan ini menyampaikan kedalaman perairan kosmis yang dimaksud תְהוֹם dengan bahasa Indonesia yang wajar dan bernuansa puitis.
- source_word: יִתְלַכָּדוּ
  choice: membeku
  rationale: Akar katanya menyatakan keadaan tertangkap, terikat, atau terpaut erat. Dalam konteks cuaca dingin, “membeku” menyampaikan hasil keadaan itu secara alami; gambaran yang lebih harfiah dicatat dalam catatan kaki.
