  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: id
  text: Di manakah engkau ketika Aku meletakkan dasar bumi?[a] Katakanlah, jika engkau memiliki pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "ketika Aku mendasarkan bumi."'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה
  choice: Di manakah
  rationale: Kata tanya tempat ini diterjemahkan secara langsung dan wajar, sekaligus mempertahankan daya tantangan dalam pertanyaan Allah.
- source_word: הָיִיתָ
  choice: engkau
  rationale: Bentuk Qal perfektum orang kedua tunggal maskulin dipahami dalam pertanyaan tentang keadaan pada masa lampau; unsur 'berada' secara alami tercakup dalam frasa Indonesia 'Di manakah engkau ketika ...'.
- source_word: בְּיָסְדִי
  choice: ketika Aku meletakkan dasar
  rationale: Preposisi ב pada infinitif konstruk dengan sufiks orang pertama tunggal menyatakan waktu. Pilihan ini mempertahankan metafora arsitektural dari יסד dan terdengar lebih alami daripada 'mendasarkan bumi'.
- source_word: אָרֶץ
  choice: bumi
  rationale: Konteks penciptaan kosmis menunjuk kepada bumi, bukan sebidang tanah atau suatu negeri.
- source_word: הַגֵּד
  choice: Katakanlah
  rationale: Imperatif נגד menuntut Ayub menyatakan jawabannya. 'Katakanlah' mempertahankan bentuk perintah tanpa perlu menambahkan objek yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: אִם
  choice: jika
  rationale: Partikel ini memperkenalkan tantangan bersyarat dan retoris.
- source_word: יָדַעְתָּ בִינָה
  choice: engkau memang memiliki pengertian
  rationale: Secara harfiah konstruksi ini tidak biasa, 'engkau mengetahui pengertian'. Dalam konteks tantangan retoris, terjemahan ini menyampaikan makna kemampuan memahami; 'memang' membuat daya retorisnya alami dalam bahasa Indonesia tanpa mengubah syarat menjadi pernyataan fakta.
theological_decisions:
- issue: Gambaran arsitektural dalam penciptaan bumi
  choice: meletakkan dasar bumi
  alternative: mendasarkan bumi; mendirikan bumi
  rationale: Pilihan ini mempertahankan gambaran יסד bahwa Allah menetapkan bumi seperti seorang pembangun meletakkan dasar, tanpa memperluasnya menjadi uraian doktrinal.
- issue: Sifat retoris syarat tentang pengertian Ayub
  choice: jika engkau memang memiliki pengertian
  alternative: jika engkau mengetahui pengertian; jika engkau mempunyai pengetahuan
  rationale: Ucapan ini merupakan tantangan, bukan penegasan bahwa Ayub memiliki atau sama sekali tidak memiliki pengertian. Rumusan bersyarat dipertahankan agar ketegangan retoris teks tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Aku' dan 'engkau' dipakai untuk mempertahankan tuturan langsung ilahi yang personal serta sesuai dengan konteks puitis. Tidak ada penanda catatan kaki karena tidak diperlukan; alternatif leksikal bahasa Inggris yang dicantumkan sebenarnya berkaitan dengan frasa sebelumnya dan sudah terwakili langsung dalam teks Indonesia.
