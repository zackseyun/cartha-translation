base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: id
  text: Dapatkah engkau mengangkat suaramu kepada awan[a], sehingga kelimpahan air menutupi engkau?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada awan tebal.” Kata Ibrani yang dipakai berbentuk tunggal dan dapat menekankan awan hujan yang pekat.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan kelimpahan air menutupi engkau.” Bahasa Ibrani juga dapat dibaca sebagai dua klausa yang sejajar; ungkapan “kelimpahan air” menyiratkan air yang sangat banyak atau meluap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: Dapatkah engkau berseru
  rationale: Bentuk Hifil dari רוּם secara harfiah berarti ‘mengangkat/meninggikan’. Bersama קוֹלֶךָ, ungkapan ini berarti meninggikan atau menyaringkan suara. ‘Berseru’ menyampaikan makna itu secara alami dalam bahasa Indonesia dan mempertahankan bentuk pertanyaan tentang kemampuan manusia.
- source_word: לָעָב
  choice: kepada awan
  rationale: עָב menunjuk pada awan, khususnya awan tebal pembawa hujan. Bentuk tunggal ‘awan’ dipertahankan karena nomina Ibraninya tunggal dan dapat dipahami secara kolektif.
- source_word: קוֹלֶךָ
  choice: berseru
  rationale: קוֹלֶךָ berarti ‘suaramu’. Maknanya dipadukan secara idiomatis ke dalam verba ‘berseru’, yakni memperdengarkan atau meninggikan suara kepada awan.
- source_word: וְשִׁפְעַת מַיִם
  choice: sehingga limpahan air
  rationale: שִׁפְעָה menyatakan kelimpahan atau luapan. ‘Limpahan air’ mempertahankan gambaran jumlah air yang sangat banyak tanpa memastikan bahwa yang dimaksud adalah banjir yang merusak.
- source_word: תְּכַסֶּךָּ
  choice: menutupi engkau
  rationale: Bentuk Piel dari כסה berarti ‘menutupi’, dan sufiks orang kedua tunggal maskulin menunjuk kepada orang yang disapa. ‘Engkau’ sesuai dengan ragam Alkitab yang dignified dan jelas.
theological_decisions:
- issue: Hubungan antara kedua klausa
  choice: 'Klausa kedua dipahami sebagai hasil yang dimaksudkan: berseru kepada awan sehingga limpahan air menutupi orang yang berseru.'
  alternative: 'Kedua klausa dapat dihubungkan secara koordinatif: ‘dan limpahan air menutupi engkau’.'
  rationale: Konteksnya adalah pertanyaan retoris mengenai ketidakmampuan manusia memerintah cuaca. ‘Sehingga’ membuat hubungan hasil yang tersirat menjadi alami dalam bahasa Indonesia, sedangkan kemungkinan hubungan koordinatif tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. ‘Engkau’ mempertahankan sapaan tunggal dan cocok dengan wacana ilahi dalam Ayub. Ungkapan idiomatis ‘berseru’ dipilih daripada terjemahan kaku ‘mengangkat suaramu’, sementara unsur ‘suara’ dipahami terkandung dalam verba tersebut.
