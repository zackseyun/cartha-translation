  text: when I prescribed my boundary for it and set bars and doors,[a]
translation:
  language: id
  text: ketika Aku menetapkan batas bagi laut itu dan memasang palang serta pintu-pintu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika Aku menetapkan ketetapan-Ku atasnya”; secara harfiah kata kerjanya biasanya berarti “mematahkan”, tetapi di sini kemungkinan besar menunjuk pada penetapan batas laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: menetapkan
  rationale: Walaupun akar שׁבר biasanya berarti “memecahkan” atau “mematahkan”, arti harfiah itu sulit dalam konteks ini. Bersama חֻקִּי, kata ini paling wajar dipahami sebagai tindakan menetapkan batas bagi laut.
- source_word: עָלָיו
  choice: bagi laut itu
  rationale: Akhiran pronominal maskulin tunggal merujuk kepada laut dalam konteks sebelumnya. Penyebutan eksplisit “laut itu” membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: חֻקִּי
  choice: batas
  rationale: חֹק dapat berarti ketetapan, keputusan, bagian yang ditentukan, atau batas yang ditetapkan. Dalam konteks pengekangan laut, “batas” mempertahankan sisi konkret sekaligus gagasan tentang ketetapan ilahi.
- source_word: וָאָשִׂים
  choice: memasang
  rationale: שׂים berarti menaruh atau menempatkan. Untuk palang dan pintu, “memasang” merupakan ungkapan Indonesia yang alami dan tetap konkret.
- source_word: בְּרִיחַ
  choice: palang
  rationale: Kata ini menunjuk pada palang atau selarak untuk menutup jalan masuk. Bentuk tunggal “palang” mengikuti bentuk Ibrani dan sesuai dengan citra pintu yang dikunci.
- source_word: וּדְלָתָיִם
  choice: pintu-pintu
  rationale: Bentuk dual mengacu pada sepasang daun pintu. “Pintu-pintu” mempertahankan unsur jamak tanpa membuat ungkapan terlalu teknis.
theological_decisions:
- issue: Penggambaran antropomorfis tentang kekuasaan Allah atas laut
  choice: Mempertahankan gambaran konkret tentang Allah yang menetapkan batas serta memasang palang dan pintu-pintu.
  alternative: Mengubahnya menjadi pernyataan abstrak mengenai kedaulatan Allah atas alam.
  rationale: Puisi ini menyatakan kedaulatan Allah melalui citra arsitektural yang hidup. Citra tersebut perlu dipertahankan tanpa meratakannya menjadi rumusan teologis abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kata “Aku” memakai huruf kapital karena merupakan ujaran langsung Allah. Koma dipertahankan karena ayat ini melanjutkan kalimat dan rangkaian puisi dari konteks sekitarnya.
