  source_fidelity: 'Teks Indonesia dengan setia mengikuti struktur dan citra Ibrani: מִי שָׂם diterjemahkan “Siapa yang menetapkan,” מְמַדֶּיהָ sebagai “ukurannya,” dan נָטָה ... קָו sebagai “merentangkan tali pengukur.” “Jika engkau tahu” mempertahankan kemungkinan pembacaan kondisional dari כִּי תֵדָע serta daya retorisnya tanpa memaksakan tingkat sindiran tertentu. “Di atasnya” merupakan padanan yang dapat diterima untuk עָלֶיהָ dalam metafora pengukuran bumi.'
