  yaml_path: translation/ot/job/038/005.yaml
  text: Who set its measurements[a], if you know, or who stretched a line upon it?
translation:
  language: id
  text: Siapa yang menetapkan ukurannya[a]—jika engkau tahu—atau siapa yang merentangkan tali pengukur di atasnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "dimensinya."'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata ganti tanya yang membuka pertanyaan retoris ilahi.
- source_word: שָׂם
  choice: menetapkan
  rationale: Bentuk qal perfektif dari שׂים berarti menaruh, menetapkan, atau menentukan; dalam gambaran pembangunan, 'menetapkan' wajar untuk ukuran bumi.
- source_word: מְמַדֶּיהָ
  choice: ukurannya
  rationale: Bentuk jamak dengan sufiks feminin tunggal merujuk kepada bumi; 'ukurannya' menyampaikan dimensi yang ditetapkan tanpa membuat kalimat terasa teknis.
- source_word: כִּי תֵדָע
  choice: jika engkau tahu
  rationale: Mengikuti pembacaan kondisional yang sesuai dengan tantangan retoris dalam konteks dan mempertahankan ketegangan ungkapan Ibrani tanpa mempertegasnya menjadi pernyataan ironis.
- source_word: אוֹ
  choice: atau
  rationale: Kata penghubung disjungtif yang mengaitkan dua pertanyaan sejajar.
- source_word: נָטָה
  choice: merentangkan
  rationale: Dalam gambaran pekerjaan bangunan, verba ini menggambarkan tindakan membentangkan tali untuk mengukur.
- source_word: עָלֶיהָ
  choice: di atasnya
  rationale: Preposisi עַל dengan sufiks feminin tunggal merujuk kepada bumi dan mempertahankan gambaran spasial teks.
- source_word: קָו
  choice: tali pengukur
  rationale: Dalam konteks pembangunan, קָו adalah tali atau garis yang digunakan untuk mengukur; 'tali pengukur' membuat benda dan fungsinya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Daya retoris כִּי תֵדָע
  choice: jika engkau tahu
  alternative: tentu engkau tahu
  rationale: Teks dapat dipahami sebagai tantangan kondisional atau sindiran. Terjemahan utama memilih bentuk kondisional yang lebih dekat dengan pembacaan konteks, tanpa menambahkan kadar ironi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'engkau' dipakai karena Allah sedang menyapa Ayub secara langsung. Tanda pisah mempertahankan sisipan retoris tanpa mengaburkan struktur dua pertanyaan sejajar.
