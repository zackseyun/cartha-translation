  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁר חָשַׂ֥כְתִּי לְ/עֶת צָ֑ר לְ/י֥וֹם קְ֝רָ֗ב וּ/מִלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/023.yaml
  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: id
  text: yang telah Kusimpan[a] untuk masa kesesakan[b], untuk hari pertempuran dan peperangan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kutahan” atau “Kucadangkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kesulitan,” “malapetaka,” atau “keadaan genting.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Memperkenalkan klausa relatif yang mengacu pada salju dan hujan es dalam ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia dan tidak memaksakan jumlah gramatikal.
- source_word: חָשַׂכְתִּי
  choice: telah Kusimpan
  rationale: Kata kerja ini dapat berarti menahan, menyimpan, atau mencadangkan. Dalam konteks perbendaharaan salju dan hujan es, 'telah Kusimpan' menyampaikan tindakan menjaga sesuatu untuk digunakan kemudian, sedangkan 'telah' mencerminkan aspek tindakan yang sudah dilakukan.
- source_word: לְעֶת
  choice: untuk masa
  rationale: Preposisi לְ menyatakan peruntukan atau tujuan, sedangkan עֵת berarti waktu atau masa tertentu.
- source_word: צָר
  choice: kesesakan
  rationale: Menyatakan keadaan sulit, genting, atau penuh tekanan. 'Kesesakan' bernada khidmat dan sesuai dengan konteks puitis tanpa membatasi maknanya pada satu jenis malapetaka.
- source_word: לְיוֹם
  choice: untuk hari
  rationale: Mempertahankan kesejajaran dengan לְעֶת dan menyampaikan hari yang diperuntukkan bagi peristiwa berikutnya.
- source_word: קְרָב
  choice: pertempuran
  rationale: Istilah militer langsung untuk bentrokan dalam perang dan merupakan padanan Indonesia yang jelas.
- source_word: וּמִלְחָמָה
  choice: dan peperangan
  rationale: Mempertahankan pasangan dua istilah militer yang berdekatan maknanya dalam bahasa Ibrani, alih-alih meleburkannya menjadi satu.
theological_decisions:
- issue: Penggunaan kekuatan alam oleh Allah dalam gambaran penghukuman
  choice: Mempertahankan pengertian langsung bahwa Allah menyimpan fenomena alam tersebut bagi masa kesesakan serta hari pertempuran dan peperangan.
  alternative: Menganggap seluruh ungkapan ini semata-mata metafora tentang pemeliharaan ilahi tanpa acuan militer.
  rationale: Teks secara eksplisit menyebut pertempuran dan peperangan. Terjemahan mempertahankan gambaran itu tanpa memperlunak ataupun merumuskan implikasi teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis-khidmat. Bentuk 'Kusimpan' memakai kapital untuk pembicara ilahi. Tanda tanya dipertahankan karena ayat ini melanjutkan pertanyaan yang dimulai pada ayat sebelumnya. Penanda catatan kaki ditempatkan tepat setelah kata yang diterangkannya.
