base_translation:
  language: en
  yaml_path: translation/ot/job/038/003.yaml
  text: Gird up your loins like a man[a]; I will question you[b], and you shall make it known to me.
translation:
  language: id
  text: Ikatlah pinggangmu seperti seorang laki-laki[a]. Aku akan menanyaimu, dan beritahukanlah kepada-Ku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersiaplah dengan teguh seperti seorang pejuang.” Secara harfiah, bahasa Ibrani berbunyi “ikatlah pinggangmu seperti seorang laki-laki,” sebuah ungkapan untuk mempersiapkan diri dengan tekad dan keberanian.
    reason: lexical_alternative
  - marker: b
    text: Atau “jawablah Aku.” Bahasa Ibrani secara lebih harfiah berarti “buatlah Aku tahu” atau “beritahukanlah kepada-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱזָר נָא
  choice: Ikatlah
  rationale: Bentuk imperatif mempertahankan gambaran konkret tindakan mengikat pinggang sebagai persiapan yang teguh. Partikel נָא dinyatakan melalui akhiran imperatif -lah, yang memberi dorongan tegas tanpa menambahkan kata waktu seperti “sekarang”.
- source_word: כְגֶבֶר
  choice: seperti seorang laki-laki
  rationale: גֶּבֶר menunjuk kepada laki-laki dan dapat menyiratkan kekuatan atau keberanian. Terjemahan ini mempertahankan bentuk maskulin dan membiarkan nuansa kekuatannya dijelaskan dalam catatan kaki.
- source_word: חֲלָצֶיךָ
  choice: pinggangmu
  rationale: Kata ini secara konkret menunjuk bagian pinggang atau pangkal tubuh. “Pinggangmu” alami dalam bahasa Indonesia dan mempertahankan idiom Ibrani tentang kesiapan.
- source_word: וְאֶשְׁאָלְךָ
  choice: Aku akan menanyai engkau
  rationale: שׁאל berarti bertanya atau meminta. Dalam konteks tantangan berupa serangkaian pertanyaan, “menanyai” menyampaikan tindakan mempertanyakan secara langsung tanpa menambahkan gambaran pengadilan.
- source_word: וְהוֹדִיעֵנִי
  choice: engkau harus memberitahukannya kepada-Ku
  rationale: Bentuk Hifil dari ידע secara harfiah berarti membuat seseorang tahu atau memberitahukan. Pilihan ini lebih dekat dengan bentuk sumber daripada langsung menafsirkannya sebagai “jawablah Aku”.
theological_decisions:
- issue: Ungkapan maskulin dalam tantangan ilahi
  choice: seperti seorang laki-laki
  alternative: seperti seorang pejuang
  rationale: Teks Ibrani memakai גֶּבֶר, kata maskulin yang dapat mengandung nuansa kekuatan. Bentuk maskulin dipertahankan tanpa menjadikannya pernyataan doktrinal tentang keunggulan laki-laki; daya idiomatisnya diterangkan dalam catatan kaki.
- issue: Perintah untuk membuat Allah tahu
  choice: engkau harus memberitahukannya kepada-Ku
  alternative: jawablah Aku
  rationale: Terjemahan mempertahankan ungkapan kausatif Ibrani dan ketegangan retoris bahwa Ayub diminta membuat Allah tahu, tanpa melemahkannya menjadi sekadar perintah untuk menjawab.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Idiom konkret Ibrani dipertahankan dalam teks utama, sedangkan maknanya dijelaskan bagi pembaca umum melalui catatan kaki. Pronomina “Aku” dan “Ku” ditulis dengan huruf kapital karena penuturnya adalah Allah.
