  text: הֲ/יֵשׁ לַ/מָּטָ֥ר אָ֑ב א֥וֹ מִי ה֝וֹלִ֗יד אֶגְלֵי טָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/028.yaml
  text: Does the rain have a father[a], or who has begotten the drops of dew?
translation:
  language: id
  text: Apakah hujan mempunyai ayah, atau siapakah yang memperanakkan titik-titik embun?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: Apakah hujan mempunyai
  rationale: Partikel tanya הֲ dengan konstruksi eksistensial-kepunyaan יֵשׁ לְ membentuk pertanyaan ya/tidak. Dalam bahasa Indonesia, “Apakah hujan mempunyai” menyampaikan hubungan kepunyaan itu secara alami.
- source_word: אָב
  choice: ayah
  rationale: Makna harfiahnya ialah “ayah”. Pilihan ini mempertahankan gambaran kebapakan dan kesejajarannya dengan kata kerja yang berarti memperanakkan.
- source_word: אוֹ מִי
  choice: atau siapakah
  rationale: אוֹ menghubungkan dua pertanyaan sejajar, sedangkan מִי menanyakan pelaku. Bentuk “siapakah” sesuai dengan gaya puitis yang bermartabat.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד berarti menyebabkan lahir atau memperanakkan. “Memperanakkan” mempertahankan citra asal-usul melalui seorang ayah serta hubungan puitisnya dengan “ayah”, tanpa menggantinya dengan penjelasan abstrak seperti “menciptakan”.
- source_word: אֶגְלֵי טָל
  choice: titik-titik embun
  rationale: Frasa konstruksi ini menunjuk pada tetes atau titik embun. “Titik-titik embun” merupakan ungkapan Indonesia yang jelas dan alami serta tetap mempertahankan gambaran konkretnya.
