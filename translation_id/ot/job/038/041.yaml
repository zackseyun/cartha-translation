source:
  edition: WLC
  text: מִ֤י יָכִ֥ין לָ/עֹרֵ֗ב צֵ֫יד֥/וֹ כִּֽי ילד/ו אֶל אֵ֣ל יְשַׁוֵּ֑עוּ יִ֝תְע֗וּ לִ/בְלִי אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/041.yaml
  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: id
  text: Siapakah yang menyediakan mangsanya[a] bagi burung gagak ketika[b] anak-anaknya berseru kepada Allah dan berkeliaran[c] karena kekurangan makanan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “makanan bagi burung gagak.” Kata Ibrani yang diterjemahkan “mangsa” juga dapat berarti makanan hasil buruan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “karena anak-anaknya berseru kepada Allah.” Kata penghubung Ibrani ini dapat dipahami secara kausal (“karena”) maupun situasional-temporal (“ketika”).
    reason: lexical_alternative
  - marker: c
    text: Atau, “mengembara” atau “tersesat.” Kata kerja Ibrani ini dapat menggambarkan gerak tanpa arah atau berkeliaran dalam pencarian makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapakah
  rationale: Kata ganti tanya ini membuka pertanyaan retoris dalam firman Allah; bentuk ini sesuai dengan ragam bahasa Indonesia yang bermartabat.
- source_word: יָכִין
  choice: menyediakan
  rationale: Bentuk Hifil dari כון di sini berarti menyiapkan atau menyediakan. Dalam konteks pemeliharaan Allah terhadap burung gagak, 'menyediakan' paling alami tanpa menghilangkan makna dasarnya.
- source_word: לָעֹרֵב
  choice: bagi burung gagak
  rationale: Preposisi ל menandai penerima manfaat. Bentuk tunggal definit dipahami secara generik sebagai wakil jenis burung gagak.
- source_word: צֵידוֹ
  choice: mangsanya
  rationale: ציד menunjuk pada hasil buruan atau makanan, sedangkan sufiks orang ketiga tunggal merujuk kepada burung gagak. 'Mangsanya' mempertahankan gambaran konkret dan sufiks tersebut.
- source_word: כִּי
  choice: ketika
  rationale: Dalam konteks ini, כִּי dapat memperkenalkan keadaan atau waktu saat kebutuhan anak-anak burung itu tampak. Kemungkinan kausal tetap dicatat dalam catatan kaki.
- source_word: ילדיו
  choice: anak-anaknya
  rationale: Nomina dengan sufiks ini menunjuk kepada anak-anak burung gagak; bentuk ulang menyatakan jamak secara alami dalam bahasa Indonesia.
- source_word: אֶל אֵל
  choice: kepada Allah
  rationale: אֵל di sini dipahami sebagai sebutan umum bagi Allah, bukan nama diri yang perlu ditransliterasikan.
- source_word: יְשַׁוֵּעוּ
  choice: berseru
  rationale: Bentuk Piel dari שוע berarti berseru, khususnya meminta pertolongan. 'Berseru' mempertahankan daya ungkapnya tanpa menambahkan objek yang tidak dinyatakan.
- source_word: יִתְעוּ
  choice: berkeliaran
  rationale: Bentuk Qal dari תעה dapat berarti mengembara, berkeliaran, atau tersesat. Dalam konteks hewan yang mencari makanan, 'berkeliaran' terdengar alami dan tetap cukup luas.
- source_word: לִבְלִי אֹכֶל
  choice: karena kekurangan makanan
  rationale: Ungkapan ini menyatakan ketiadaan atau kelangkaan makanan. 'Karena kekurangan makanan' mengungkapkan baik keadaan maupun hubungan dengan tindakan berkeliaran.
theological_decisions:
- issue: Pemeliharaan Allah atas makhluk hidup
  choice: Pertanyaan dibiarkan retoris tanpa menambahkan jawaban eksplisit bahwa Allah adalah penyedianya.
  alternative: Menambahkan 'bukankah Allah' atau merumuskan pernyataan langsung tentang Allah.
  rationale: Bentuk tanya dalam bahasa Ibrani sendiri menyiratkan jawabannya dalam konteks pidato Allah, tetapi terjemahan tidak seharusnya mengubah ketegangan retoris itu menjadi pernyataan doktrinal eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sebagai pertanyaan retoris; 'burung gagak' dipakai secara generik, sedangkan 'anak-anaknya' mempertahankan hubungan dengan burung tersebut. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
