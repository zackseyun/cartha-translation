  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: id
  text: 'Lalu Yahweh menjawab Ayub dari dalam badai[a] dan berfirman:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari angin puyuh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Bentuk naratif dari ענה berarti ‘menjawab’ atau ‘menanggapi’. ‘Menjawab’ mempertahankan kaitan dengan perkataan Ayub sebelumnya dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶת אִיּוֹב
  choice: Ayub
  rationale: אֶת adalah penanda objek langsung dan tidak perlu diterjemahkan; nama אִיּוֹב memakai bentuk Indonesia yang sudah baku, ‘Ayub’.
- source_word: מִן־הַסְּעָרָה
  choice: dari tengah badai
  rationale: סְעָרָה menunjuk pada badai dahsyat dan dapat pula dipahami sebagai angin puyuh. ‘Dari tengah badai’ alami, jelas, dan tidak mempersempit gambaran secara berlebihan; alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: וַיֹּאמַר
  choice: dan berfirman
  rationale: אמר berarti ‘berkata’. Ketika subjeknya Allah, ‘berfirman’ merupakan ungkapan Indonesia yang alami dan bermartabat tanpa mengubah isi tindakan tutur tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan makna סְעָרָה dalam penampakan ilahi
  choice: badai
  alternative: angin puyuh; prahara
  rationale: Kata Ibrani dapat menunjuk pada badai dahsyat atau angin puyuh. Teks utama memakai istilah luas ‘badai’, sementara kemungkinan gambaran yang lebih khusus dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Lalu’ menandai kelanjutan narasi; ‘dari tengah’ menyampaikan bahwa suara Yahweh datang dari dalam badai. Tanda titik dua mengantar langsung pada perkataan yang menyusul.
