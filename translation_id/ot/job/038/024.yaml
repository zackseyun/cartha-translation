translation:
  language: id
  text: Lewat jalan manakah terang terbagi[a][b], atau angin timur menyebar di atas bumi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di manakah jalan yang melaluinya terang terbagi?” Ungkapan tanya Ibrani dapat menanyakan tempat ataupun cara.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kilat” sebagai ganti “terang”. Kata Ibrani ini biasanya berarti “terang”, tetapi dalam konteks ini sebagian penafsir memahaminya secara lebih khusus sebagai gejala cahaya dalam badai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Melalui jalan manakah
  rationale: Ungkapan tanya ini dapat menunjuk pada tempat atau cara. Bentuk ini mempertahankan gambaran harfiah tentang 'jalan' sekaligus terdengar wajar dalam pertanyaan puitis bahasa Indonesia.
- source_word: יֵחָלֶק
  choice: terbagi
  rationale: Bentuk Nifal dari חלק menyatakan makna pasif atau refleksif, yaitu 'dibagi/terbagi'. 'Terbagi' ringkas dan tetap mempertahankan ketidakjelasan mengenai pelakunya.
- source_word: אוֹר
  choice: terang
  rationale: Makna lazim אוֹר adalah 'terang'. Konteks badai memungkinkan arti yang lebih khusus, yakni 'kilat', tetapi teks utama tidak dipersempit tanpa kepastian.
- source_word: יָפֵץ
  choice: tersebar
  rationale: Bentuk Hifil dari פוץ membawa gagasan menyebarkan atau mencerai-beraikan. Dalam susunan Ibrani, klausa ini dapat dipahami secara eliptis; 'tersebar' menghasilkan kesejajaran alami dengan 'terbagi' tanpa menambahkan pelaku.
- source_word: קָדִים
  choice: angin timur
  rationale: Dalam konteks meteorologis, קָדִים lazim menunjuk pada angin yang bertiup dari timur, bukan sekadar arah timur.
- source_word: עֲלֵי אָרֶץ
  choice: ke seluruh bumi
  rationale: Frasa ini menggambarkan penyebaran di atas atau melintasi bumi. 'Ke seluruh bumi' alami dalam bahasa Indonesia dan menyampaikan cakupan geraknya, sementara alternatif yang lebih harfiah dicatat.
