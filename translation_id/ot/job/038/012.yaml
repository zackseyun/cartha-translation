  text: הְֽ֭/מִ/יָּמֶי/ךָ צִוִּ֣יתָ בֹּ֑קֶר ידעתה שחר מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/012.yaml
  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: id
  text: Pernahkah engkau, sepanjang hidupmu[a], memberi perintah kepada pagi dan membuat fajar tahu tempatnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari hari-harimu”; maksudnya, kapan pun sejak masa hidupmu bermula.
    reason: cultural_note
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: pernahkah engkau, selama hidupmu
  rationale: Gabungan partikel tanya dan ungkapan harfiah ‘dari hari-harimu’ menanyakan apakah hal itu pernah dilakukan pada suatu waktu sepanjang hidup Ayub. Bentuk ini alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan idiom Ibraninya.
- source_word: צִוִּיתָ
  choice: memberi perintah kepada
  rationale: Kata kerja ini menyatakan tindakan memerintah dengan kewenangan. Bentuk ini menghindari kemungkinan ‘memerintah pagi’ dipahami sebagai berkuasa atas pagi saja, bukan menyampaikan perintah kepadanya.
- source_word: בֹּקֶר
  choice: pagi
  rationale: Kata ini menunjuk pada pagi sebagai realitas ciptaan yang dipersonifikasikan dan menerima perintah.
- source_word: יָדַעְתָּה
  choice: membuat ... mengetahui
  rationale: Bentuk Hifil bersifat kausatif. Terjemahan ini mempertahankan baik unsur ‘menyebabkan tahu’ maupun personifikasi fajar.
- source_word: שַׁחַר
  choice: fajar
  rationale: ‘Fajar’ merupakan padanan Indonesia yang wajar dan puitis, sekaligus membedakannya dari ‘pagi’ pada baris sejajar.
- source_word: מְקוֹמוֹ
  choice: tempatnya
  rationale: Padanan langsung ini tidak menambahkan gagasan ‘yang telah ditetapkan’, yang mungkin tersirat tetapi tidak dinyatakan oleh kata Ibrani tersebut.
