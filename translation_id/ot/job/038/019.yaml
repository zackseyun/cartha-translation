  yaml_path: translation/ot/job/038/019.yaml
  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: id
  text: Di manakah jalan menuju tempat bersemayamnya terang,[a] dan di manakah tempat kegelapan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Di manakah jalan tempat terang bersemayam, dan kegelapan—di manakah tempatnya?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵי זֶה
  choice: Di manakah
  rationale: Ungkapan tanya ini menanyakan lokasi atau arah. “Di manakah” alami dalam bahasa Indonesia dan dapat memperkenalkan baik jalan menuju terang maupun tempat kegelapan.
- source_word: הַדֶּרֶךְ
  choice: jalan
  rationale: דֶּרֶךְ berarti jalan, jalur, atau arah. “Jalan” mempertahankan gambaran rute sekaligus cakupan maknanya yang luas.
- source_word: יִשְׁכָּן
  choice: menuju tempat bersemayamnya
  rationale: Bentuk verba שׁכן berarti tinggal, menetap, atau bersemayam. Susunan ini menghubungkan “jalan” dengan tujuan secara alami, sambil mempertahankan personifikasi terang sebagai sesuatu yang memiliki kediaman.
- source_word: אוֹר
  choice: terang
  rationale: Padanan baku yang sesuai dengan kontras kosmis antara terang dan kegelapan.
- source_word: וְחֹשֶׁךְ
  choice: dan ... kegelapan
  rationale: Menerjemahkan konjungsi dan nomina secara langsung serta menjaga kesejajaran kedua klausa.
- source_word: מְקוֹמוֹ
  choice: tempat kegelapan
  rationale: מָקוֹם berarti “tempat,” dan akhiran orang ketiga tunggal merujuk kepada kegelapan. Pengulangan nomina menghasilkan bahasa Indonesia yang jelas dan alami.
