  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
translation:
  language: id
  text: Bumi berubah seperti tanah liat di bawah meterai[a], dan bentuk-bentuknya tampil seperti pakaian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bumi berbalik seperti tanah liat yang dikenai meterai.” Kata kerja Ibraninya secara lebih harfiah dapat berarti “berbalik” atau “dibalik.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan mereka tampil seperti pakaian.” Bentuk jamak “mereka” kemungkinan merujuk pada berbagai bentuk permukaan bumi yang menjadi jelas dalam cahaya fajar.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: berubah
  rationale: Bentuk Hitpael dari הפך menyatakan perubahan atau pembalikan pada rupa permukaan bumi; “berubah” alami dalam bahasa Indonesia dan tetap memberi ruang bagi nuansa refleksif atau pasif.
- source_word: כְּחֹמֶר חוֹתָם
  choice: seperti tanah liat di bawah meterai
  rationale: חֹמֶר berarti tanah liat, sedangkan konstruksi eliptis dengan חוֹתָם menggambarkan tanah liat yang menerima teraan meterai. Ungkapan ini mempertahankan perbandingan sambil membuat gambarnya dapat dipahami.
- source_word: וְיִתְיַצְּבוּ
  choice: segala bentuknya tampak jelas
  rationale: Kata kerja jamak itu secara harfiah berarti mereka menempatkan diri atau tampil. Dalam konteks fajar, subjek tersirat kemungkinan ialah bentuk-bentuk permukaan bumi yang menjadi kentara; terjemahan ini menyampaikan gambaran tersebut tanpa menjadikannya subjek eksplisit yang terlalu khusus.
- source_word: כְּמוֹ לְבוּשׁ
  choice: seperti pakaian
  rationale: לְבוּשׁ berarti pakaian. Bentuk tunggal dan perbandingan puitisnya dipertahankan secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Meterai” dipilih untuk alat cap, bukan sekadar hasil cap. Subjek “bumi” dipulihkan dari konteks ayat sebelumnya, sedangkan ketidakjelasan rujukan kata kerja jamak dijelaskan dalam catatan kaki.
