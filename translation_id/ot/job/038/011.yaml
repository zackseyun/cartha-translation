  text: and I said[a], ‘You may come this far, and no farther; here your proud waves shall stop.’
translation:
  language: id
  text: dan Aku berkata, “Sampai di sini engkau boleh datang, tetapi tidak lebih jauh; di sinilah gelombangmu yang congkak akan ditahan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, verba Ibrani ini berarti “ditaruh” atau “ditempatkan”. Dalam konteks ini, baris tersebut menyatakan titik tempat gelombang laut yang meninggi dibatasi atau dihentikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: dan Aku berkata
  rationale: Bentuk wayyiqtol orang pertama tunggal melanjutkan urutan tuturan ilahi. “Aku berkata” mempertahankan makna dasar אמר, sedangkan huruf kapital menandai bahwa penuturnya adalah Allah dalam konteks ini.
- source_word: עַד פֹּה
  choice: Sampai di sini
  rationale: Gabungan preposisi dan kata penunjuk tempat menetapkan batas ruang; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: תָבוֹא
  choice: engkau boleh datang
  rationale: Bentuk orang kedua tunggal menyapa laut secara puitis. “Boleh” menyampaikan batas yang diizinkan oleh perintah ilahi, bukan sekadar ramalan.
- source_word: וְלֹא תֹסִיף
  choice: tetapi tidak lebih jauh
  rationale: Secara harfiah verba ini berarti “menambah” atau “melanjutkan”; dalam konteks penetapan batas, ungkapan ini menyampaikan larangan secara jelas dan idiomatis.
- source_word: וּפֹא
  choice: di sinilah
  rationale: Kata penunjuk tempat yang diulang menegaskan lokasi batas. Partikel “-lah” secara alami membawa penekanan itu dalam bahasa Indonesia.
- source_word: יָשִׁית
  choice: akan ditahan
  rationale: Verba ini pada dasarnya berarti “menaruh/menempatkan”, tetapi konstruksi Ibrani pada klausa ini sulit dan dalam konteks menyatakan bahwa gelombang tidak dapat melampaui batas. Bentuk pasif “ditahan” menyampaikan hasil pembatasan tanpa menambahkan pelaku baru.
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: gelombangmu yang congkak
  rationale: גאון dapat berarti keangkuhan, kebanggaan, atau kemegahan. Dalam gambaran gelombang laut yang meninggi dan harus dibatasi, “congkak” mempertahankan personifikasi dan nuansa meninggikan diri; גלים diterjemahkan dengan kata umum “gelombang”.
theological_decisions:
- issue: Personifikasi laut di bawah perintah Allah
  choice: Mempertahankan sapaan orang kedua tunggal kepada laut dan bahasa penetapan batas.
  alternative: Mengubah laut menjadi kekuatan alam yang sepenuhnya impersonal.
  rationale: Teks Ibrani langsung menyapa laut sebagai “engkau”. Personifikasi puitis ini menonjolkan kedaulatan Allah atas ciptaan tanpa menjadikan laut sebagai dewa atau lawan ilahi yang mandiri.
- issue: Ketaksaan bentuk יָשִׁית dalam klausa penutup
  choice: Menerjemahkan secara kontekstual dengan bentuk pasif “akan ditahan” dan menjelaskan arti harfiahnya dalam catatan kaki.
  alternative: Menerjemahkan secara lebih harfiah sebagai “akan ditempatkan”, yang terasa tidak lengkap dan kabur dalam bahasa Indonesia.
  rationale: Pilihan ini menjaga pokok gambaran batas yang menghentikan gelombang sekaligus tidak menyembunyikan kesulitan leksikal teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan tanpa menjadi arkais. “Engkau” mempertahankan sapaan tunggal yang khidmat kepada laut yang dipersonifikasikan; “di sinilah” memberi penekanan alami pada batas yang ditetapkan.
