  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina “engkau” mempertahankan sapaan tunggal langsung dalam wacana puitis ilahi. Pengulangan “pernahkah engkau” mempertahankan kesejajaran retoris ayat.
