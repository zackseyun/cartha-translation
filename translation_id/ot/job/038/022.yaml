  text: הֲ֭/בָאתָ אֶל אֹצְר֣וֹת שָׁ֑לֶג וְ/אֹצְר֖וֹת בָּרָ֣ד תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: id
  text: Pernahkah engkau masuk ke gudang-gudang salju[a], atau pernahkah engkau melihat gudang-gudang hujan es?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perbendaharaan salju ... perbendaharaan hujan es.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: Pernahkah engkau masuk ke
  rationale: Partikel tanya הֲ dan bentuk perfektif orang kedua tunggal maskulin dari בוא membentuk pertanyaan retoris. Frasa “masuk ke” menyampaikan gerak menuju tempat penyimpanan secara alami dalam bahasa Indonesia.
- source_word: אֹצְרוֹת
  choice: gudang-gudang
  rationale: אֹצָר dapat berarti tempat penyimpanan atau perbendaharaan. “Gudang-gudang” mempertahankan gambaran konkret tentang persediaan fenomena cuaca dan mudah dipahami pembaca modern.
- source_word: שָׁלֶג
  choice: salju
  rationale: Padanan meteorologis baku.
- source_word: וְאֹצְרוֹת
  choice: atau ... gudang-gudang
  rationale: Walaupun וְ secara harfiah berarti “dan”, dalam pasangan pertanyaan retoris ini “atau” menghasilkan koordinasi bahasa Indonesia yang alami tanpa mengubah kesejajaran kedua bagiannya.
- source_word: תִּרְאֶה
  choice: pernahkah engkau melihat
  rationale: Bentuk imperfektif ini merupakan pertanyaan kedua yang sejajar dengan pertanyaan pertama. “Pernahkah ... melihat” menyampaikan pertanyaan retoris tentang pengalaman Ayub secara wajar.
- source_word: בָּרָד
  choice: hujan es
  rationale: “Hujan es” adalah istilah bahasa Indonesia modern yang lazim untuk presipitasi berupa butiran es.
theological_decisions: []
