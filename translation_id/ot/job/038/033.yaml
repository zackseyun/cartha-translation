  text: הֲ֭/יָדַעְתָּ חֻקּ֣וֹת שָׁמָ֑יִם אִם תָּשִׂ֖ים מִשְׁטָר֣/וֹ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: id
  text: Tahukah engkau ketetapan-ketetapan langit? Dapatkah engkau menetapkan kekuasaannya atas bumi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemerintahannya” atau “wewenangnya” untuk “kekuasaannya”. Sufiks Ibraninya berbentuk tunggal (“-nya”), tampaknya menunjuk kepada langit sebagai satu kesatuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Tahukah engkau
  rationale: Partikel tanya dengan bentuk perfektif ידע menyatakan pertanyaan tentang keadaan pengetahuan saat ini. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya tantangan retoris ilahi.
- source_word: חֻקּוֹת
  choice: ketetapan-ketetapan
  rationale: Kata ini menunjuk pada ketentuan atau batas tetap yang mengatur ciptaan. Pilihan ini mempertahankan gagasan tata kosmis yang telah ditetapkan tanpa membatasinya pada hukum alam dalam pengertian ilmiah modern.
- source_word: שָׁמָיִם
  choice: langit
  rationale: Walaupun bentuk Ibraninya jamak, kata ini lazim menunjuk pada bentangan atau ranah langit secara kolektif. Bahasa Indonesia baku secara alami memakai bentuk tunggal kolektif 'langit'.
- source_word: אִם
  choice: Dapatkah engkau
  rationale: Di sini אִם memperkenalkan pertanyaan kedua yang sejajar dengan pertanyaan pertama. Bentuk interogatif ini menyampaikan tantangan retoris dengan wajar.
- source_word: תָּשִׂים
  choice: menetapkan
  rationale: Makna dasarnya ialah menaruh atau menempatkan; bersama מִשְׁטָרוֹ, konteksnya adalah membuat kekuasaan itu berlaku atas bumi. 'Menetapkan' mempertahankan gagasan tersebut secara ringkas.
- source_word: מִשְׁטָרוֹ
  choice: kekuasaannya
  rationale: מִשְׁטָר menyatakan kekuasaan, pemerintahan, atau wewenang yang mengatur. Sufiks orang ketiga tunggal dipertahankan dengan '-nya', cocok dengan 'langit' sebagai kesatuan kolektif.
- source_word: בָאָרֶץ
  choice: atas bumi
  rationale: Dalam konteks kekuasaan atau pemerintahan, 'atas bumi' secara alami menyatakan bumi sebagai ranah yang berada di bawah kekuasaan tersebut.
theological_decisions:
- issue: Hakikat tatanan langit yang dimaksud
  choice: Ayat ini berbicara tentang ketetapan kosmis dan kekuasaan yang mengatur ciptaan, tanpa menentukan mekanisme pengaruhnya terhadap bumi.
  alternative: Ayat ini secara khusus mengajarkan pengaruh astrologis benda-benda langit atas kejadian di bumi.
  rationale: Konteks membahas bintang dan langit, tetapi istilah Ibrani menekankan ketetapan dan kekuasaan. Terjemahan mempertahankan bahasa pemerintahan kosmis tanpa memasukkan determinisme astrologis yang tidak dinyatakan secara tegas.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan 'engkau' mempertahankan bentuk tunggal serta nada langsung dalam pertanyaan ilahi. Pengulangan 'ketetapan-ketetapan' dipakai untuk mencerminkan bentuk jamak Ibrani, sedangkan 'langit' diperlakukan sebagai nomina kolektif yang alami dalam bahasa Indonesia.
