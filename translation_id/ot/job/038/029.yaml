  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: id
  text: 'Dari rahim siapakah es keluar,

    dan embun beku dari langit, siapakah yang melahirkannya?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: Dari rahim siapakah
  rationale: Mempertahankan gambaran kelahiran dalam bahasa Ibrani sekaligus memakai susunan interogatif yang wajar dan puitis dalam bahasa Indonesia.
- source_word: יָצָא
  choice: keluar
  rationale: Padanan langsung dan alami bagi verba 'keluar'; dalam kaitan dengan 'rahim', kata ini tetap menyampaikan gambaran kelahiran tanpa menambahkan unsur yang tidak tersurat.
- source_word: הַקָּרַח
  choice: es
  rationale: קֶרַח berarti 'es'. Bahasa Indonesia tidak memiliki artikel definit seperti bahasa Ibrani, sehingga bentuk sederhana 'es' paling alami.
- source_word: וּכְפֹר שָׁמַיִם
  choice: dan embun beku dari langit
  rationale: כְּפוֹר menunjuk pada embun beku atau bunga es; 'embun beku' mudah dipahami dalam bahasa Indonesia. Genitif Ibrani diterjemahkan dengan 'dari langit' agar hubungan asal dalam citraan kosmis terasa alami.
- source_word: מִי יְלָדוֹ
  choice: siapakah yang melahirkan
  rationale: ילד berarti 'melahirkan' dan melanjutkan personifikasi maternal dari baris pertama. Sufiks objek maskulin tunggal mengacu kepada embun beku dan terwakili secara alami sebagai objek setelah verba.
