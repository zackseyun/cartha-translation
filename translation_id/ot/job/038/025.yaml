  text: Who has cut a channel for the flood[a], or a path for the thunderbolt,
translation:
  language: id
  text: Siapakah yang menggali saluran bagi hujan deras,[a] atau jalur bagi kilat yang berguruh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi luapan air”. Secara harfiah, “bagi luapan ... bagi kilat suara-suara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִלַּג
  choice: membelah
  rationale: Kata kerja ini menyatakan tindakan membagi atau membelah sehingga terbentuk suatu jalur. ‘Membelah saluran’ mempertahankan gambaran pembuatan alur air secara puitis.
- source_word: שֶּׁטֶף
  choice: luapan air
  rationale: Nomina ini dapat menunjuk pada arus banjir, luapan deras, atau hujan lebat. Dalam hubungan dengan ‘saluran’, ‘luapan air’ secara alami menggambarkan massa air yang deras tanpa membatasi makna hanya pada satu jenis peristiwa.
- source_word: תְּעָלָה
  choice: saluran
  rationale: Kata ini berarti saluran atau alur untuk mengalirkan air. ‘Saluran’ merupakan padanan Indonesia modern yang jelas dan wajar.
- source_word: דֶרֶךְ
  choice: jalan
  rationale: Dalam kesejajaran puitis dengan ‘saluran’, kata ini menunjuk pada jalur atau lintasan yang ditetapkan bagi gejala di langit.
- source_word: חֲזִיז
  choice: kilat
  rationale: Nomina langka ini umumnya dipahami sebagai kilat atau halilintar. ‘Kilat’ mempertahankan unsur cahaya dan memungkinkan konstruksi berikutnya, קֹלוֹת, tetap terwakili sebagai guruh.
- source_word: קֹלוֹת
  choice: yang disertai guruh
  rationale: Secara harfiah bentuk jamak ini berarti ‘suara-suara’, tetapi dalam konteks cuaca lazim menunjuk pada guruh. Ungkapan ‘yang disertai guruh’ menghasilkan bahasa Indonesia yang alami sambil tetap menampilkan kedua unsur frasa Ibrani.
