  - severity: low
    issue: “atau membuka jalan”
    rationale: Teks menggunakan satu verba yang secara puitis menaungi kedua objek. “Membuka” dapat dipahami, tetapi memperkenalkan tindakan berbeda dari penggalian/pembentukan saluran dan tidak diperlukan.
