source:
  edition: WLC
  text: הֲ/תֹצִ֣יא מַזָּר֣וֹת בְּ/עִתּ֑/וֹ וְ֝/עַ֗יִשׁ עַל בָּנֶ֥י/הָ תַנְחֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: id
  text: Dapatkah engkau menerbitkan Mazarot pada musimnya,[a] atau menuntun Ayis bersama anak-anaknya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mazarot adalah istilah astronomis Ibrani yang langka, mungkin merujuk pada rasi-rasi bintang atau zodiak.
    reason: lexical_alternative
  - marker: b
    text: Ayis adalah nama bintang atau rasi dalam bahasa Ibrani. Sebagian terjemahan lama menyebutnya Arkturus, sedangkan banyak penafsir memahaminya sebagai rasi Beruang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תֹצִיא
  choice: Dapatkah engkau menerbitkan
  rationale: Bentuk kausatif dari יצא menyatakan tindakan membuat benda-benda langit muncul. 'Menerbitkan' alami dalam konteks benda langit dan mempertahankan nuansa kausatif.
- source_word: מַזָּרוֹת
  choice: Mazarot
  rationale: Istilah astronomis Ibrani ini langka dan acuannya tidak pasti. Transliterasi menghindari kepastian semu; kemungkinan artinya dijelaskan dalam catatan kaki.
- source_word: בְּ/עִתּ/וֹ
  choice: pada musimnya
  rationale: Frasa ini menunjuk pada waktu atau musim yang tepat bagi kemunculannya; pilihan ini alami dalam konteks peredaran benda langit.
- source_word: וְ/עַיִשׁ
  choice: Ayis
  rationale: Nama bintang atau rasi ini tidak dapat diidentifikasi secara pasti. Transliterasi mempertahankan ketidakpastian teks sumber.
- source_word: עַל בָּנֶי/הָ
  choice: bersama anak-anaknya
  rationale: Ungkapan Ibrani mempertahankan metafora kekeluargaan feminin dan kemungkinan menunjuk pada bintang-bintang yang menyertai Ayis.
- source_word: תַנְחֵ/ם
  choice: menuntun
  rationale: Bentuk kausatif נחה berarti memimpin atau menuntun; 'menuntun' sesuai dengan gambaran mengarahkan rasi di langit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung tetapi mudah dipahami. Nama-nama astronomis yang tidak pasti ditransliterasikan untuk mempertahankan ambiguitas sumber. Semua penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
