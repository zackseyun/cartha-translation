  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: id
  text: Terang mereka ditahan dari orang-orang fasik, dan lengan[b] yang terangkat dipatahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "akan dipatahkan." Bentuk imperfek Ibrani dapat dipahami sebagai masa depan maupun sebagai gambaran masa kini yang hidup.
    reason: lexical_alternative
  - marker: b
    text: “Lengan” di sini kemungkinan melambangkan kekuatan atau kuasa, khususnya kekuatan untuk melakukan kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: dihalangi
  rationale: Bentuk Nifal imperfek dari מנע menyatakan bahwa terang itu ditahan atau dicegah; bentuk pasif dipertahankan.
- source_word: מֵרְשָׁעִים
  choice: dari orang-orang fasik
  rationale: 'Preposisi מִן menyatakan pemisahan: terang dijauhkan dari mereka yang fasik. Ungkapan ini mempertahankan kategori moral tanpa membatasi gender.'
- source_word: אוֹרָם
  choice: terang mereka
  rationale: Akhiran pronominal jamak paling langsung diterjemahkan sebagai milik atau terang yang dinikmati orang-orang fasik, sesuai gambaran fajar dalam konteks.
- source_word: וּזְרוֹעַ
  choice: dan lengan
  rationale: Makna harfiah 'lengan' dipertahankan, sementara makna kiasannya sebagai kekuatan atau kuasa dijelaskan dalam catatan kaki.
- source_word: רָמָה
  choice: yang terangkat
  rationale: Kata dari רום menggambarkan lengan yang diangkat; pilihan ini mempertahankan citra kekuatan yang angkuh atau siap melakukan kekerasan.
- source_word: תִּשָּׁבֵר
  choice: dipatahkan
  rationale: Nifal imperfek dari שבר dapat menyatakan tindakan kini yang hidup atau kebiasaan dalam puisi. Bentuk pasif Indonesia mempertahankan konstruksi Ibrani.
