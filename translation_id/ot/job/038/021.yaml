  yaml_path: translation/ot/job/038/021.yaml
  text: You know[a], for then you were born, and the number of your days is great!
translation:
  language: id
  text: Engkau tentu tahu, sebab pada waktu itu engkau lahir, dan jumlah hari-harimu banyak!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Tentu engkau tahu
  rationale: 'Bentuk Qal perfek orang kedua tunggal maskulin dari ידע. Dalam rangkaian pertanyaan ilahi yang bernada ironis, ungkapan ini paling alami dipahami sebagai sindiran: Job tentu tidak benar-benar mengetahuinya.'
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan ironis bagi pernyataan sebelumnya dan mempertahankan hubungan wacana dalam bahasa Indonesia yang alami.
- source_word: אָז
  choice: pada waktu itu
  rationale: Menunjuk pada masa peristiwa penciptaan yang baru disebutkan; bentuk ini lebih jelas dan wajar daripada hanya 'waktu itu'.
- source_word: תִּוָּלֵד
  choice: engkau sudah lahir
  rationale: Nifal imperfek orang kedua tunggal maskulin dari ילד, digunakan secara retoris dengan acuan waktu lampau. 'Sudah lahir' menyampaikan bahwa Job seolah-olah telah hidup pada masa penciptaan.
- source_word: וּמִסְפַּר
  choice: dan jumlah
  rationale: Mempertahankan nomina konstruksi dan konjungsi Ibrani secara lugas.
- source_word: יָמֶיךָ
  choice: hari-harimu
  rationale: Menerjemahkan konstruksi dengan sufiks orang kedua secara alami, sambil mempertahankan ungkapan Semitis mengenai lamanya hidup.
- source_word: רַבִּים
  choice: begitu banyak
  rationale: Adjektiva jamak ini menyatakan bahwa hari-hari Job sangat banyak. 'Begitu banyak' terdengar alami dalam sindiran retoris dan tidak memaksakan kesesuaian dengan nomina tunggal 'jumlah'.
theological_decisions:
- issue: Nada ucapan ilahi
  choice: Dinyatakan sebagai ironi melalui 'Tentu' dan tanda seru
  alternative: 'Terjemahan datar: ''Engkau tahu, sebab ...'''
  rationale: Konteks pertanyaan retoris dalam Ayub 38 menunjukkan sindiran tajam, bukan pengakuan harfiah bahwa Job hadir pada penciptaan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan langsung. Kata ganti 'engkau' dipakai agar sesuai dengan sapaan tunggal dalam wacana ilahi. Susunan kalimat mempertahankan paralelisme dan daya ironi teks Ibrani.
