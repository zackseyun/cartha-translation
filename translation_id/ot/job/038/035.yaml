  yaml_path: translation/ot/job/038/035.yaml
  text: Can you send out lightnings so that they go and say to you[a], ‘Here we are’ ?
translation:
  language: id
  text: Dapatkah engkau mengirim kilat-kilat[a], sehingga mereka pergi dan berkata kepadamu, “Kami di sini”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sambaran-sambaran kilat.” Kata Ibrani ini berbentuk jamak dan menggambarkan kilat-kilat itu seolah-olah sebagai utusan yang taat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתְשַׁלַּח
  choice: Dapatkah engkau mengirim
  rationale: Partikel tanya dengan bentuk kausatif imperfek orang kedua tunggal maskulin menyampaikan pertanyaan retoris tentang kemampuan Ayub. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tantangan tersirat dalam konteks.
- source_word: בְּרָקִים
  choice: kilat-kilat
  rationale: Bentuk ulang mempertahankan jamak Ibrani dan mendukung gambaran puitis tentang kilat sebagai para utusan yang bergerak dan menjawab perintah.
- source_word: וְיֵלֵכוּ
  choice: sehingga mereka pergi
  rationale: Kata 'sehingga' mengungkapkan nuansa hasil atau tujuan dalam rangkaian verba, sedangkan 'mereka' mempertahankan personifikasi kilat.
- source_word: וְיֹאמְרוּ
  choice: dan berkata
  rationale: Terjemahan ini mempertahankan penggambaran kilat sebagai utusan yang dapat menjawab, tanpa menjelaskan metafora itu secara berlebihan.
- source_word: לְךָ
  choice: kepadamu
  rationale: Menerjemahkan bentuk datif orang kedua tunggal secara langsung dan wajar.
- source_word: הִנֵּנוּ
  choice: Kami di sini
  rationale: Ungkapan ini merupakan jawaban kehadiran dan kesiapan. 'Kami di sini' alami dalam bahasa Indonesia serta mempertahankan citra para utusan yang siap menjalankan perintah.
theological_decisions:
- issue: Personifikasi kilat dalam perkataan ilahi
  choice: Mempertahankan gambaran bahwa kilat-kilat pergi dan berkata, “Kami di sini.”
  alternative: Mengubahnya menjadi uraian tak berpribadi tentang gejala alam yang berada di bawah kuasa Allah.
  rationale: Teks Ibrani secara eksplisit memberi kilat tindakan bergerak dan berbicara. Personifikasi ini menegaskan kuasa perintah Allah atas ciptaan secara puitis, tanpa mengharuskan pemahaman bahwa kilat sungguh memiliki kesadaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan 'engkau' sesuai dengan tuturan langsung Allah kepada Ayub. Bentuk jamak 'kilat-kilat' dipertahankan agar personifikasi dalam puisi tetap jelas.
