translation:
  language: id
  text: 'ketika debu menjadi padat,[a]

    dan gumpalan-gumpalan tanah melekat satu sama lain?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika debu dicurahkan menjadi massa yang keras” atau “ketika debu menjadi keras seperti benda cor.” Bahasa Ibrani menggunakan gambaran penuangan atau pencetakan untuk melukiskan tanah yang memadat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶקֶת
  choice: ketika ... mengeras
  rationale: Bentuk ini memperkenalkan klausa waktu. Dalam konteks debu dan gumpalan tanah, verba yang berhubungan dengan menuang atau mengecor menggambarkan tanah yang menjadi keras dan padat.
- source_word: עָפָר
  choice: debu
  rationale: Kata ini berarti debu atau tanah lepas; 'debu' mempertahankan gambaran bahan tanah yang semula lepas.
- source_word: לַמּוּצָק
  choice: menjadi massa yang padat
  rationale: Istilah dari akar יצק dapat menunjuk pada sesuatu yang dituang atau dicor lalu memadat. Ungkapan ini menyampaikan hasil pemadatan secara alami tanpa mengharuskan gambaran logam.
- source_word: וּרְגָבִים
  choice: dan gumpalan-gumpalan tanah
  rationale: Kata ini menunjuk pada bongkahan atau gumpalan tanah; pilihan ini jelas bagi pembaca Indonesia modern.
- source_word: יְדֻבָּקוּ
  choice: melekat satu sama lain
  rationale: Bentuk pasif ini menggambarkan gumpalan-gumpalan tanah yang saling menempel atau menyatu.
