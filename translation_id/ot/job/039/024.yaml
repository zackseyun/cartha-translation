translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat digunakan untuk mempertahankan tenaga gambaran Ibrani. Ungkapan “ganas dan geram” menyalurkan kesejajaran intensif sumber tanpa menjadikannya uraian teknis; “melahap tanah” mempertahankan metafora. Istilah “sangkakala” dipilih karena jelas sebagai alat pemberi isyarat perang dan lazim dalam register Alkitab Indonesia.
