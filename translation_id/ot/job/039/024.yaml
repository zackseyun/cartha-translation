  yaml_path: translation/ot/job/039/024.yaml
  text: With fierceness and rage he devours the ground[b][a], and he cannot stand still at the sound of the trumpet.
translation:
  language: id
  text: Dengan ganas dan geram ia melahap tanah[a]; ia tidak dapat tinggal diam ketika bunyi sangkakala terdengar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menelan tanah”, gambaran hidup tentang kecepatan dan semangat kuda ketika maju menyerbu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ia tidak menahan diri ketika bunyi sangkakala terdengar.” Kata kerja Ibrani ini sering diterjemahkan lebih harfiah sebagai “percaya”, tetapi dalam konteks ini dapat dipahami sebagai ungkapan tentang tidak tetap tenang atau tidak menahan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: dengan ganas
  rationale: רַעַשׁ dapat menunjuk pada guncangan, kegemparan, atau gerak keras. Dalam gambaran kuda perang, frasa ini menyatakan tenaga liar dan dahsyat ketika ia menyerbu; “dengan ganas” menyampaikan daya adverbial itu secara wajar dalam bahasa Indonesia.
- source_word: וְרֹגֶז
  choice: dan geram
  rationale: רֹגֶז mencakup kegelisahan, getaran, atau amarah. Bersama רַעַשׁ, kata ini menggambarkan gejolak dan kegairahan kuda perang; “geram” mempertahankan intensitas dan menghasilkan ungkapan Indonesia yang ringkas.
- source_word: יְגַמֶּא
  choice: ia melahap
  rationale: גמא secara harfiah berarti menelan atau meneguk. Dengan objek “tanah”, kata ini menjadi metafora hidup bagi kuda yang melintasi medan dengan sangat cepat. “Melahap” mempertahankan metafora sekaligus terdengar alami.
- source_word: אָרֶץ
  choice: tanah
  rationale: Dalam konteks kuda yang maju menyerbu, אֶרֶץ menunjuk pada permukaan atau medan yang dilintasinya, bukan seluruh bumi atau suatu wilayah politik.
- source_word: וְלֹא יַאֲמִין
  choice: ia tidak dapat tinggal diam
  rationale: Bentuk Hifil dari אמן biasanya berarti “percaya”, tetapi di sini secara idiomatis dapat dipahami sebagai tetap tenang, bertahan di tempat, atau menahan diri. Konteks kuda perang yang mendengar tanda serbuan mendukung “tidak dapat tinggal diam”, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: כִּי
  choice: ketika
  rationale: כִּי di sini paling wajar dipahami sebagai pengantar keadaan atau waktu yang berkaitan dengan bunyi sangkakala.
- source_word: קוֹל שׁוֹפָר
  choice: mendengar bunyi sangkakala
  rationale: שׁוֹפָר ialah tanduk yang dipakai sebagai alat pemberi isyarat, khususnya dalam peperangan. “Sangkakala” sesuai dengan register Alkitab Indonesia, dan “mendengar” mengungkapkan hubungan alami antara reaksi kuda dan bunyinya.
