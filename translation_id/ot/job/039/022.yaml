lexical_decisions:
- source_word: יִשְׂחַק
  choice: menertawakan
  rationale: Bentuk Qal imperfek dari שׂחק mempertahankan gambaran hidup tentang kuda yang begitu berani sehingga seolah-olah tertawa terhadap ketakutan; nuansa mengejek tetap mungkin.
- source_word: לְפַחַד
  choice: ketakutan
  rationale: פחד menunjuk pada rasa takut atau kedahsyatan. 'Ketakutan' alami dalam bahasa Indonesia dan tidak memperkuat maknanya secara berlebihan.
- source_word: יֵחָת
  choice: gentar
  rationale: Bentuk Nifal dari חתת dalam konteks pertempuran menyatakan tidak menjadi ciut, gentar, atau tawar hati; 'gentar' ringkas dan idiomatis.
- source_word: יָשׁוּב
  choice: berbalik
  rationale: שׁוב secara harfiah berarti berbalik atau kembali. Di sini maksudnya tidak mundur ketika menghadapi ancaman.
- source_word: מִפְּנֵי
  choice: menghadapi
  rationale: Ungkapan מִפְּנֵי secara harfiah dapat berarti 'dari hadapan'. Dalam konteks ini, konstruksi tersebut menggambarkan tidak berbalik ketika berhadapan dengan pedang; 'menghadapi' menghasilkan ungkapan Indonesia yang alami tanpa menghilangkan relasi spasialnya.
- source_word: חָרֶב
  choice: pedang
  rationale: חרב berbentuk tunggal dan berfungsi sebagai gambaran umum senjata atau ancaman dalam pertempuran; 'pedang' mempertahankan citra konkret itu.
