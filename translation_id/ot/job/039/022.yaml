  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: id
  text: Ia menertawakan ketakutan dan tidak gentar; ia tidak berbalik ketika menghadapi pedang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia tidak mundur dari hadapan pedang.”'
