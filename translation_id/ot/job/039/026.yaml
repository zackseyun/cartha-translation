  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: id
  text: Apakah karena pengertianmu, elang-alap itu terbang tinggi[a] dan membentangkan sayapnya ke arah selatan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alap-alap” untuk “elang-alap”; kata Ibrani נֵץ dapat menunjuk secara lebih umum kepada burung pemangsa sejenis ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: Apakah karena pengertianmu
  rationale: 'Partikel tanya dengan מִן menyatakan sarana atau sebab: tindakan burung itu bukan terjadi karena pengertian Ayub. ‘Pengertian’ menerjemahkan בִּינָה secara langsung dan alami.'
- source_word: יַאֲבֶר
  choice: terbang tinggi
  rationale: Bentuk Hifil dari אבר menggambarkan burung yang naik atau terbang membubung. ‘Terbang tinggi’ mempertahankan gerak ke atas tanpa mempersempitnya menjadi jenis terbang tertentu.
- source_word: נֵץ
  choice: elang-alap
  rationale: Istilah ini menunjuk pada burung pemangsa dari kelompok elang-alap atau alap-alap, tetapi spesies tepatnya tidak pasti. ‘Elang-alap’ merupakan padanan Indonesia yang cukup luas dan wajar.
- source_word: יִפְרֹשׂ
  choice: dan membentangkan
  rationale: פרשׂ berarti membentangkan atau merentangkan. Kata penghubung ‘dan’ menyajikan tindakan lanjutan secara alami dalam bahasa Indonesia.
- source_word: כְּנָפוֹ
  choice: sayapnya
  rationale: Bentuk Ibrani tunggal dapat dipahami secara kolektif. Bahasa Indonesia lazim memakai ‘sayapnya’ tanpa harus menandai jumlah.
- source_word: לְתֵימָן
  choice: ke arah selatan
  rationale: Preposisi לְ menyatakan arah, sedangkan תֵימָן berarti selatan. Frasa ini menjaga nuansa orientasi atau migrasi menuju selatan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan bentuk pertanyaan retoris yang jelas dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan penekanan bahwa pengertian Ayub bukan sumber perilaku burung tersebut.
