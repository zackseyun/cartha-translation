  text: אֲשֶׁר שַׂ֣מְתִּי עֲרָבָ֣ה בֵית֑/וֹ וּֽ/מִשְׁכְּנוֹתָ֥י/ו מְלֵֽחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/006.yaml
  text: to whom I have given the desert for his house[a], and the salt land for his dwelling place[c][b],
translation:
  language: id
  text: yang telah Kuberi padang gurun sebagai rumahnya[a], dan tanah asin sebagai tempat-tempat tinggalnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “padang tandus” atau “stepa” untuk עֲרָבָה.
    reason: lexical_alternative
  - marker: b
    text: Atau “dataran garam” atau “tanah tandus bergaram” untuk מְלֵחָה.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini menghubungkan ayat dengan keledai liar pada ayat sebelumnya; 'yang' merupakan bentuk alami dalam bahasa Indonesia.
- source_word: שַׂמְתִּי
  choice: telah Kuberi
  rationale: Secara dasar berarti 'menaruh/menetapkan', tetapi dalam konteks penetapan habitat, 'Kuberi' secara alami menyampaikan bahwa Allah menyediakan atau menetapkan kawasan itu baginya.
- source_word: עֲרָבָה
  choice: padang gurun
  rationale: Menunjuk pada kawasan tandus atau stepa; 'padang gurun' jelas bagi pembaca modern dan tidak menjadikannya nama tempat khusus.
- source_word: בֵיתוֹ
  choice: sebagai rumahnya
  rationale: Mempertahankan metafora harfiah 'rumahnya' sambil memasok hubungan sintaksis yang tersirat dalam bahasa Ibrani.
- source_word: וּמִשְׁכְּנוֹתָיו
  choice: dan ... sebagai tempat-tempat tinggalnya
  rationale: Bentuk Ibraninya jamak. Bahasa Indonesia dapat mempertahankan bentuk jamak tersebut secara wajar dan dengan demikian tidak perlu menafsirkannya sebagai bentuk puitis intensif tunggal.
- source_word: מְלֵחָה
  choice: tanah asin
  rationale: Menggambarkan lahan tandus yang mengandung garam tanpa mempersempit makna menjadi dataran garam dengan ciri geologis tertentu.
theological_decisions: []
