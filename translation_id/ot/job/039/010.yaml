  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: id
  text: Dapatkah engkau mengikat lembu liar itu pada alur dengan tali pengikatnya,[a] atau akankah ia menggaru tanah di lembah-lembah di belakangmu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aurochs” atau “banteng liar”. Kata Ibrani רֵים menunjuk pada hewan bovina liar yang kuat, bukan “unicorn” dalam sejumlah terjemahan lama.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengolah tanah di lembah-lembah” atau “meratakan tanah di lembah-lembah”. Kata kerja Ibrani ini tampaknya secara khusus mengacu pada penggaruan atau perataan tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: Dapatkah engkau mengikat
  rationale: Bentuk tanya retoris dengan verba קשׁר menyatakan tindakan mengikat atau menambat hewan agar dapat dikendalikan. 'Dapatkah' menyampaikan tantangan tentang kemampuan manusia secara alami dalam bahasa Indonesia.
- source_word: רֵים
  choice: lembu liar
  rationale: רֵים menunjuk pada bovina liar yang kuat, kemungkinan aurochs, bukan makhluk mitologis. 'Lembu liar' jelas bagi pembaca umum dan mempertahankan sifat liarnya.
- source_word: בְּתֶלֶם
  choice: pada alur bajak
  rationale: תֶּלֶם adalah alur tanah hasil pembajakan. 'Pada alur bajak' memberi gambaran pertanian yang lebih jelas daripada sekadar 'di alur'.
- source_word: עֲבֹתוֹ
  choice: dengan talinya
  rationale: עֲבֹת berarti tali atau tambang pengikat, dengan sufiks orang ketiga maskulin tunggal yang merujuk kepada lembu liar.
- source_word: אִם
  choice: atau
  rationale: Dalam rangkaian pertanyaan retoris paralel, אִם memperkenalkan pertanyaan alternatif, bukan syarat.
- source_word: יְשַׂדֵּד
  choice: akankah ia menggaru
  rationale: Dalam konteks pertanian, verba ini menunjuk pada pengerjaan atau perataan tanah, kemungkinan dengan garu, bukan pembajakan awal. Istilah 'menggaru' mempertahankan kekhususan tindakan tersebut.
- source_word: עֲמָקִים
  choice: lembah-lembah
  rationale: Makna leksikal biasa עֲמָקִים ialah lembah-lembah atau tempat-tempat rendah. Terjemahan ini mempertahankan citra bentang lahan tanpa menafsirkannya sebagai alur.
- source_word: אַחֲרֶיךָ
  choice: di belakangmu
  rationale: Frasa ini menggambarkan hewan yang bekerja mengikuti arahan petani; 'di belakangmu' alami dan konkret dalam bahasa Indonesia.
