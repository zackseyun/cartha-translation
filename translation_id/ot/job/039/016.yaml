  text: הִקְשִׁ֣יחַ בָּנֶ֣י/הָ לְּ/לֹא לָ֑/הּ לְ/רִ֖יק יְגִיעָ֣/הּ בְּלִי פָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/016.yaml
  text: She treats her young harshly[a], as if they were not hers; her labor is in vain, without fear.
translation:
  language: id
  text: Ia memperlakukan anak-anaknya dengan keras[a], seolah-olah mereka bukan miliknya; jerih payahnya sia-sia, tanpa rasa takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Ia mengeraskan anak-anaknya terhadap dirinya, seakan-akan mereka bukan miliknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: memperlakukan ... dengan keras
  rationale: Bentuk Hifil dari קשׁח menyatakan tindakan membuat keras atau bersikap keras. Dalam konteks induk burung unta terhadap anak-anaknya, ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan ketegasan makna Ibrani.
- source_word: בָּנֶיהָ
  choice: anak-anaknya
  rationale: Secara harfiah berarti anak-anaknya. Pilihan ini wajar untuk keturunan hewan dalam bahasa Indonesia dan tidak membatasi jenis kelamin.
- source_word: לְלֹא לָהּ
  choice: seolah-olah mereka bukan miliknya
  rationale: Frasa Ibrani yang ringkas, secara harfiah 'sebagai bukan kepunyaannya', diperjelas secara alami tanpa menghilangkan nuansa penyangkalan hubungan induk-anak.
- source_word: לְרִיק
  choice: sia-sia
  rationale: Padanan Indonesia yang ringkas dan lazim untuk usaha yang tidak menghasilkan tujuan.
- source_word: יְגִיעָהּ
  choice: jerih payahnya
  rationale: Menunjukkan usaha atau kerja berat sang induk; 'jerih payah' mempertahankan bobot kata sumber dan cocok dengan 'sia-sia'.
- source_word: בְּלִי פָחַד
  choice: tanpa rasa takut
  rationale: Terjemahan dekat dari frasa Ibrani, dengan tetap membiarkan pembaca menilai apakah yang dimaksud ialah ketakutan, kekhawatiran, atau kepedulian.
