  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: id
  text: Dapatkah engkau membuatnya melompat seperti belalang? Keagungan dengusannya menimbulkan kengerian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dapatkah engkau membuatnya bergemuruh seperti belalang?” Kata kerja Ibrani dapat berarti menyebabkan sesuatu berguncang, bergetar, atau bergerak hebat; sebagian penafsir memahami gambaran ini menekankan bunyi sekaligus gerakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: Dapatkah engkau membuatnya melompat
  rationale: Bentuk Hifil dari רעשׁ dapat berarti menyebabkan berguncang, bergetar, atau bergerak hebat. Dalam gambaran tentang kuda perang yang dibandingkan dengan belalang, 'melompat' menyampaikan gerak menyentak dengan wajar, sementara kemungkinan nuansa bunyi dicatat dalam catatan kaki.
- source_word: כָּאַרְבֶּה
  choice: seperti belalang
  rationale: Kata ini berbentuk tunggal dan dapat mewakili jenisnya; dalam bahasa Indonesia, 'seperti belalang' merupakan perbandingan yang alami dan mempertahankan gambaran gerak lompat yang kuat.
- source_word: הוֹד
  choice: Keagungan
  rationale: הוֹד berarti keagungan, kemegahan, atau semarak. 'Keagungan' mempertahankan gaya puitis yang luhur dan kesan menggentarkan dari kuda itu.
- source_word: נַחְרוֹ
  choice: dengusannya
  rationale: Kata ini menunjuk pada dengusan atau hembusan napas melalui lubang hidung. 'Dengusannya' tepat bagi gambaran kuda dan alami dalam bahasa Indonesia.
- source_word: אֵימָה
  choice: menimbulkan kengerian
  rationale: Nomina ini berarti kengerian, ketakutan, atau kedahsyatan. Ungkapan predikatif ini alami dalam bahasa Indonesia dan mempertahankan daya gentar dari klausa nominal Ibrani.
