  text: אִם עַל פִּ֭י/ךָ יַגְבִּ֣יהַּ נָ֑שֶׁר וְ֝/כִ֗י יָרִ֥ים קִנּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/027.yaml
  text: Is it at your command that the eagle flies high and lifts up its nest?[a][b][c]
translation:
  language: id
  text: Apakah atas perintahmu[b] rajawali[c] terbang tinggi[a] dan menempatkan sarangnya di tempat tinggi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membubung tinggi.”
    reason: lexical_alternative
  - marker: b
    text: Ibrani secara harfiah, “atas mulutmu,” suatu ungkapan yang berarti “atas perintahmu” atau “menurut perkataanmu.”
    reason: lexical_alternative
  - marker: c
    text: Kata “rajawali” juga dapat dipahami secara lebih luas sebagai burung pemangsa besar, mungkin termasuk burung nasar dalam konteks tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Apakah
  rationale: Dalam konteks pertanyaan retoris, אִם memperkenalkan klausa tanya, bukan syarat biasa.
- source_word: עַל פִּיךָ
  choice: atas perintahmu
  rationale: Secara harfiah berarti “atas mulutmu,” tetapi merupakan ungkapan yang menunjuk pada perintah atau titah seseorang.
- source_word: יַגְבִּיהַּ
  choice: terbang tinggi
  rationale: Bentuk kausatif dari גבה menyatakan bergerak atau naik tinggi; dengan rajawali sebagai subjek, “terbang tinggi” alami dan tetap mempertahankan gagasan ketinggian.
- source_word: נָשֶׁר
  choice: rajawali
  rationale: Padanan tradisional dan sesuai dengan gambaran burung pemangsa yang terbang serta bersarang di tempat tinggi; cakupan katanya dapat lebih luas.
- source_word: וְכִי
  choice: dan
  rationale: Menghubungkan tindakan kedua dengan tindakan pertama dalam satu pertanyaan retoris; terjemahan sederhana ini alami dalam bahasa Indonesia.
- source_word: יָרִים קִנּוֹ
  choice: menempatkan sarangnya di tempat tinggi
  rationale: Terjemahan idiomatis yang menyampaikan bahwa burung itu membuat atau menaruh sarangnya pada lokasi yang tinggi, bukan secara harfiah mengangkat sarang yang sudah ada.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Bentuk pertanyaan retoris dipertahankan. “Menempatkan sarangnya di tempat tinggi” dipilih agar idiom Ibrani dipahami secara alami tanpa memberi kesan bahwa burung itu mengangkat sarang yang telah jadi.
