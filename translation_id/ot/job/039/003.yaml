- from: Mereka merunduk[a] dan melahirkan anak-anak mereka; mereka melepaskan rasa sakit saat melahirkan.[b]
  to: Mereka berjongkok[a], lalu melahirkan anak-anaknya; sakit bersalin mereka pun berlalu.[b]
