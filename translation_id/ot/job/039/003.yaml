  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas. Terjemahan mempertahankan dua tindakan yang sejajar—melahirkan anak dan melepaskan sakit persalinan—serta menghindari istilah teknis yang tidak diperlukan.
