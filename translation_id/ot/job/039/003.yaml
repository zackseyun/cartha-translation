  - severity: medium
    issue: “Mereka melepaskan rasa sakit saat melahirkan” kurang alami dan kurang jelas.
    rationale: Dalam bahasa Indonesia, seseorang umumnya tidak “melepaskan rasa sakit.” Klausa Ibrani secara idiomatik menunjuk pada lepasnya sakit bersalin setelah kelahiran; “sakit bersalin mereka pun berlalu” menyampaikan makna itu secara wajar.
