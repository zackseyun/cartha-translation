  verdict: revise
  source_fidelity: Draf pada dasarnya mengikuti tiga klausa Ibrani dan konteks kelahiran hewan. Namun, “merunduk” kurang tepat untuk כרע dalam adegan melahirkan; “berjongkok” lebih langsung menyatakan postur fisiknya. “Melepaskan rasa sakit saat melahirkan” juga kurang idiomatis dalam bahasa Indonesia dan tidak cukup jelas menyampaikan hasil idiomatik dari שׁלח + חבלים, yakni terbebas/selesai dari sakit bersalin.
  naturalness: “Mereka berjongkok, lalu melahirkan anak-anaknya; sakit bersalin mereka pun berlalu” adalah bahasa Indonesia baku modern yang alami, ringkas, dan tetap puitis. Bentuk “anak-anaknya” lebih luwes daripada “anak-anak mereka” dalam kelanjutan rujukan kepada kelompok hewan yang sama.
  terminology: “Sakit bersalin” adalah istilah baku dan jelas untuk חבלים dalam konteks ini. “Anak-anaknya” cocok bagi keturunan hewan tanpa memasukkan istilah teknis yang tidak diperlukan.
