  text: They crouch down[a], they bring forth their young[b]; they cast off their labor pains.
translation:
  language: id
  text: Mereka berjongkok[a], lalu melahirkan anak-anaknya; sakit bersalin mereka pun berlalu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berlutut.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka melepaskan sakit-sakit bersalin mereka”; ungkapan ini berarti bahwa mereka terbebas dari sakit bersalin.
    reason: literal_rendering
lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: mereka merunduk
  rationale: Kata kerja כרע menggambarkan gerakan merendahkan tubuh, berlutut, atau berjongkok. Dalam konteks hewan yang melahirkan, “merunduk” menyampaikan gerakan tubuh itu secara alami tanpa memberi kesan tindakan penghormatan.
- source_word: יַלְדֵיהֶן
  choice: anak-anak mereka
  rationale: Bentuk nominal dari ילד menunjuk kepada yang dilahirkan. Dalam konteks hewan, “anak-anak mereka” jelas, wajar, dan mempertahankan bentuk jamak sumber.
- source_word: תְּפַלַּחְנָה
  choice: melahirkan
  rationale: Dalam konteks ini, bentuk kata kerja פלח menggambarkan keluarnya anak dari kandungan. “Melahirkan” mengungkapkan makna kontekstualnya dengan jelas dan alami dalam bahasa Indonesia.
- source_word: חֶבְלֵיהֶם
  choice: rasa sakit saat melahirkan
  rationale: חבל dapat berarti rasa sakit atau mulas persalinan. Ungkapan ini mudah dipahami pembaca modern dan sesuai dengan gambaran kelahiran dalam ayat.
- source_word: תְּשַׁלַּחְנָה
  choice: mereka melepaskan
  rationale: שלח pada dasarnya berarti menyuruh pergi, melepaskan, atau membiarkan pergi. “Melepaskan” mempertahankan gambaran puitis bahwa rasa sakit persalinan disingkirkan setelah anak lahir.
