  text: Apakah engkau memberi kekuatan kepada kuda? Apakah engkau mengenakan surai pada lehernya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “mengenakan guruh pada lehernya,” mengikuti tradisi penafsiran lama atas רַעְמָה. Di sini diterjemahkan “surai” karena gambaran langsungnya ialah sesuatu yang dikenakan pada leher kuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִתֵּן
  choice: Apakah engkau yang memberi
  rationale: Partikel tanya dengan bentuk imperfek orang kedua tunggal maskulin menyampaikan pertanyaan retoris Allah kepada Ayub. Penambahan "yang" secara alami menegaskan kontras pelaku dalam bahasa Indonesia tanpa mengubah makna.
- source_word: לַסּוּס
  choice: kuda
  rationale: Nomina Ibrani berartikel menunjuk secara generik kepada kuda sebagai jenis. Dalam bahasa Indonesia, bentuk tanpa "si" atau "seekor" paling alami untuk penyebutan generik ini.
- source_word: גְּבוּרָה
  choice: kekuatan
  rationale: גְּבוּרָה dapat berarti kekuatan, keperkasaan, atau daya. "Kekuatan" jelas dan sesuai dengan tenaga fisik kuda dalam konteks.
- source_word: הֲתַלְבִּישׁ
  choice: Apakah engkau yang mengenakan
  rationale: Bentuk Hifil dari לבש berarti mengenakan atau menyelubungi sesuatu. "Mengenakan" mempertahankan metafora menghiasi leher kuda dan terdengar wajar dalam bahasa Indonesia.
- source_word: צַוָּארוֹ
  choice: pada lehernya
  rationale: Akhiran orang ketiga tunggal maskulin merujuk kepada kuda. "-nya" merupakan rujukan alami dan tidak menyiratkan jenis kelamin biologis tertentu.
- source_word: רַעְמָה
  choice: surai
  rationale: Dalam konteks leher kuda dan metafora mengenakan, "surai" merupakan makna yang paling sesuai. Namun, hubungan bentuk kata ini dengan gagasan guruh telah melahirkan tradisi penafsiran lama yang tetap dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kata ganti "engkau" mempertahankan sapaan langsung tunggal kepada Ayub. Struktur "Apakah engkau yang ...?" menyampaikan tantangan retoris dengan alami.
