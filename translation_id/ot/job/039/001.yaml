id: JOB.39.1
reference: Job 39:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/יָדַ֗עְתָּ עֵ֭ת לֶ֣דֶת יַעֲלֵי סָ֑לַע חֹלֵ֖ל אַיָּל֣וֹת תִּשְׁמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/001.yaml
  text: Do you know the time when the mountain goats give birth? Do you watch over the deer in labor?[a][b][c]
translation:
  language: id
  text: Tahukah engkau kapan kambing-kambing gunung beranak?[a] Apakah engkau mengamati rusa-rusa betina yang sedang melahirkan?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kambing-kambing tebing”; yang dimaksud ialah kambing liar penghuni pegunungan, mungkin ibeks.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai secara khusus berarti rusa betina.
    reason: lexical_clarification
  - marker: c
    text: Kata kerja Ibrani ini juga dapat diterjemahkan “mengawasi” atau “menjaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Tahukah engkau
  rationale: Partikel tanya dengan bentuk perfektif orang kedua tunggal berfungsi sebagai pertanyaan retoris; bentuk ini alami dan tetap bernada luhur dalam bahasa Indonesia.
- source_word: עֵת לֶדֶת
  choice: kapan ... beranak
  rationale: Ungkapan harfiah 'waktu untuk melahirkan' paling alami disampaikan sebagai klausa waktu; 'beranak' lazim untuk hewan.
- source_word: יַעֲלֵי סָלַע
  choice: kambing-kambing gunung
  rationale: Secara harfiah berarti kambing-kambing batu/tebing dan menunjuk pada kambing liar penghuni pegunungan, mungkin ibeks; pilihan ini jelas tanpa kepastian zoologis berlebihan.
- source_word: חֹלֵל
  choice: yang sedang melahirkan
  rationale: Bentuk ini menggambarkan kesakitan atau proses persalinan. Dalam konteks hewan, terjemahan ini alami dan lebih jelas daripada padanan harfiah 'menggeliat'.
- source_word: אַיָּלוֹת
  choice: rusa-rusa betina
  rationale: Nomina ini secara khusus menunjuk rusa betina; unsur betina dipertahankan karena relevan dengan tindakan melahirkan.
- source_word: תִּשְׁמֹר
  choice: Apakah engkau mengamati
  rationale: שׁמר dapat berarti menjaga, memperhatikan, atau mengamati. Dalam pertanyaan tentang proses kelahiran hewan, 'mengamati' mempertahankan gagasan perhatian saksama tanpa menambahkan nuansa perlindungan yang belum tentu dimaksud.
theological_decisions:
- issue: Cakupan tindakan Allah yang tersirat dalam תִּשְׁמֹר
  choice: mengamati
  alternative: menjaga / mengawasi
  rationale: Ayat ini secara langsung mempertentangkan keterbatasan pengetahuan Ayub dengan pengetahuan Allah. Terjemahan 'mengamati' tidak meniadakan pemeliharaan Allah, tetapi juga tidak memasukkan gagasan perlindungan secara lebih tegas daripada yang dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' mempertahankan bahwa Allah berbicara langsung kepada Ayub. Paralelisme dua pertanyaan dipertahankan, sedangkan istilah reproduksi dibuat alami untuk hewan.
