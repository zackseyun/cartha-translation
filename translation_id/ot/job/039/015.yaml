  text: and she forgets that a foot may crush them[b][a], and a wild animal may trample them.
translation:
  language: id
  text: Ia lupa bahwa kaki dapat meremukkannya[a], dan binatang liar dapat menginjak-injaknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akhiran feminin tunggal pada kata Ibrani diterjemahkan “-nya”; kemungkinan besar kata itu merujuk secara kolektif kepada telur-telur yang ditinggalkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “binatang padang,” yaitu binatang liar yang hidup di daerah terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: Ia lupa
  rationale: Bentuk wayyiqtol Qal orang ketiga feminin tunggal melanjutkan gambaran puitis tentang burung unta; bentuk kini terdengar alami dalam alur bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi dari apa yang dilupakan, bukan alasan.
- source_word: רֶגֶל
  choice: kaki
  rationale: 'Nomina tunggal ini bersifat umum: kaki mana pun dapat menyebabkan kerusakan tersebut. Bahasa Indonesia tidak memerlukan penanda ketakrifan.'
- source_word: תְּזוּרֶהָ
  choice: dapat meremukkannya
  rationale: Dalam konteks sesuatu yang terinjak kaki, verba ini menyatakan kerusakan berat; 'meremukkan' mempertahankan citra konkret. Akhiran feminin tunggal dipertahankan dengan '-nya' dan dijelaskan dalam catatan.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: dan binatang liar
  rationale: Ungkapan harfiahnya 'binatang padang'; 'binatang liar' merupakan padanan Indonesia modern yang jelas.
- source_word: תְּדוּשֶׁהָ
  choice: dapat menginjak-injaknya
  rationale: Verba דושׁ berarti menginjak atau mengirik dengan kaki. 'Menginjak-injak' alami dalam konteks ini dan mempertahankan akhiran feminin tunggal sebagai '-nya'.
