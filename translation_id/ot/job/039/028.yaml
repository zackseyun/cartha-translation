  text: סֶ֣לַע יִ֭שְׁכֹּן וְ/יִתְלֹנָ֑ן עַֽל שֶׁן סֶ֝֗לַע וּ/מְצוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/028.yaml
  text: He dwells on the cliff and spends the night there[c][b][a], on the tooth of the crag and the stronghold.
translation:
  language: id
  text: Ia tinggal dan bermalam di tebing, di atas gigi batu[a] dan di kubu pertahanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “gigi batu,” yaitu tonjolan atau puncak batu yang tajam.
    reason: cultural_note
  - marker: b
    text: Atau “benteng.” Dalam konteks ini, istilah tersebut dapat menggambarkan tempat perlindungan berbatu yang kokoh.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: tebing
  rationale: Dalam konteks habitat burung rajawali, kata ini menunjuk pada tempat berbatu yang tinggi dan terjal; 'tebing' merupakan padanan Indonesia yang alami.
- source_word: יִשְׁכֹּן
  choice: tinggal
  rationale: Kata kerja ini menyatakan menetap atau berdiam; 'tinggal' jelas, wajar, dan tetap sesuai dengan laras puitis modern.
- source_word: וְיִתְלֹנָן
  choice: dan bermalam di sana
  rationale: Bentuk verba ini mengandung arti menginap atau melewatkan malam. 'Di sana' ditambahkan secara idiomatis dengan merujuk pada tebing yang baru disebut.
- source_word: שֶׁן סֶלַע
  choice: gigi bukit batu
  rationale: Frasa harfiahnya adalah 'gigi batu', gambaran konkret bagi tonjolan atau puncak batu yang tajam. 'Bukit batu' memperjelas bentang alam tanpa menghilangkan metafora 'gigi'.
- source_word: וּמְצוּדָה
  choice: tempat yang sukar dicapai
  rationale: Kata ini dapat berarti kubu atau benteng. Dalam konteks sarang burung di daerah berbatu, ungkapan ini menunjuk pada tempat perlindungan alami yang aman dan tidak mudah dicapai.
