    issue: The rendering of לַהַב as 'berkilat-kilat' changes a poetic noun image into a verbal predicate.
    rationale: לַהַב ('flame,' and figuratively flashing brightness) stands before 'spear and javelin' as the poetic image. 'Kilatan tombak dan lembing' reflects this structure and avoids making the weapons themselves the sole grammatical subject of a new predicate.
  - severity: low
    issue: Footnote a offers 'Di dekatnya,' which understates the spatial/possibly adversative force of עַל.
    rationale: The source permits 'di atasnya,' 'menimpanya,' or, contextually, 'terhadapnya'; 'di dekatnya' merely means nearby and is less well anchored in the preposition.
