  text: Over him the quiver rattles[b][a], the flashing spear and javelin.
translation:
  language: id
  text: Di atasnya tabung anak panah bergemerincing[a], kilatan tombak dan lembing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Terhadapnya tabung anak panah berdenting nyaring.” Preposisi dan verba Ibraninya memungkinkan sedikit perbedaan nuansa ruang dan bunyi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “nyala tombak dan lembing,” ungkapan puitis tentang kilau terang senjata-senjata itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: di atasnya
  rationale: Preposisi עַל dengan akhiran orang ketiga tunggal maskulin menempatkan bunyi senjata di atas atau dekat kuda. “Di atasnya” mempertahankan gambaran ruang tanpa menambahkan tafsiran bahwa senjata itu pasti diarahkan untuk menyerangnya.
- source_word: תִּרְנֶה
  choice: bergemerincing
  rationale: Dalam konteks perlengkapan perang, verba puitis ini menggambarkan bunyi nyaring dan berulang. “Bergemerincing” wajar untuk bunyi tabung berisi anak panah yang terguncang.
- source_word: אַשְׁפָּה
  choice: tabung anak panah
  rationale: Kata ini menunjuk pada wadah tempat menyimpan anak panah. Ungkapan ini lebih mudah dipahami pembaca Indonesia modern daripada istilah teknis yang jarang dipakai.
- source_word: לַהַב
  choice: berkilat-kilat
  rationale: Secara harfiah berarti “nyala” atau dapat merujuk pada bagian tajam yang berkilau. Bentuk verbal “berkilat-kilat” menyampaikan citra cahaya yang memancar dari senjata secara alami dalam bahasa Indonesia.
- source_word: חֲנִית
  choice: tombak
  rationale: Padanan umum dan luas untuk senjata bertangkai panjang dengan mata tajam.
- source_word: כִידוֹן
  choice: lembing
  rationale: Menunjuk pada senjata tikam atau lempar yang dapat dibedakan dari חֲנִית. “Lembing” mempertahankan pembedaan tersebut tanpa mengulang “tombak”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan puitis. “Tabung anak panah” dipilih demi kejelasan umum, sedangkan “tombak” dan “lembing” mempertahankan pasangan senjata yang berbeda dalam teks Ibrani.
