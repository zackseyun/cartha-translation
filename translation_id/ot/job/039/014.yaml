  yaml_path: translation/ot/job/039/014.yaml
  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: id
  text: Sebab burung unta meninggalkan telur-telurnya di tanah dan menghangatkannya di atas debu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menelantarkan telur-telurnya di tanah.” Kata kerja Ibrani ini dapat mengandung arti yang lebih kuat daripada sekadar “meninggalkan”, tetapi baris berikutnya lebih menunjukkan bahwa telur-telur itu dibiarkan terbuka di tanah, bukan ditinggalkan sama sekali.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal-eksplanatif yang menghubungkan ayat ini dengan gambaran tentang burung unta pada bagian sebelumnya.
- source_word: תַעֲזֹב
  choice: meninggalkan
  rationale: Mencakup arti dasar 'meninggalkan' tanpa memastikan bahwa telur-telur itu ditelantarkan sepenuhnya; kemungkinan nuansa yang lebih kuat dicatat dalam catatan kaki.
- source_word: לָאָרֶץ
  choice: di tanah
  rationale: Dalam bahasa Indonesia, 'di tanah' menyampaikan letak telur secara alami, meskipun preposisi Ibraninya secara harfiah dapat berarti 'ke tanah'.
- source_word: בֵּצֶיהָ
  choice: telur-telurnya
  rationale: Menerjemahkan bentuk jamak dengan sufiks feminin tunggal yang mengacu kepada burung unta betina dalam konteks.
- source_word: וְעַל עָפָר
  choice: di atas debu
  rationale: Mempertahankan gambaran konkret dan puitis dari עָפָר serta membedakannya dari frasa sebelumnya, 'di tanah'.
- source_word: תְּחַמֵּם
  choice: menghangatkannya
  rationale: Menyampaikan bentuk Piel 'membuat hangat'; akhiran '-nya' secara wajar merujuk kepada telur-telur tanpa memakai istilah teknis 'mengerami'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. 'Burung unta' disebut secara eksplisit agar subjek feminin tersirat dalam bahasa Ibrani tetap jelas dalam bahasa Indonesia. Penanda catatan kaki [a] ditempatkan setelah kalimat.
