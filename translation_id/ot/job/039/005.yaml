  text: Siapakah yang melepaskan keledai liar agar bebas? Siapakah yang membuka ikatan keledai liar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapakah yang melepaskan ikatan keledai liar?” Kata Ibrani עָרוֹד mungkin merupakan sebutan lain untuk keledai liar; sebagian menerjemahkannya “onager.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata tanya ini membuka dua pertanyaan retoris Allah dan diterjemahkan secara langsung.
- source_word: שִׁלַּח ... חָפְשִׁי
  choice: melepaskan ... sehingga bebas
  rationale: Bentuk piel dari שלח bersama חָפְשִׁי menyatakan tindakan membiarkan hewan itu lepas dalam keadaan bebas; susunan ini alami dalam bahasa Indonesia.
- source_word: פֶּרֶא
  choice: keledai liar
  rationale: Istilah ini menunjuk pada keledai liar; padanan ini jelas, tepat, dan mudah dipahami pembaca modern.
- source_word: מֹסְרוֹת
  choice: ikatan
  rationale: Bentuk jamak ini menunjuk pada tali atau alat pengekang. 'Ikatan' mempertahankan gambaran konkret tanpa terasa kuno.
- source_word: עָרוֹד
  choice: keledai gurun
  rationale: Istilah ini menunjuk pada sejenis keledai liar dan memiliki kaitan leksikal dengan padang tandus. 'Keledai gurun' membedakannya dari פֶּרֶא tanpa menambahkan gagasan 'cepat' yang tidak dinyatakan secara langsung.
- source_word: פִתֵּחַ
  choice: membuka
  rationale: Dalam konteks ikatan, kata kerja ini berarti membuka atau melepaskan pengekang; 'membuka ikatan' mempertahankan citra ungkapan Ibrani secara alami.
