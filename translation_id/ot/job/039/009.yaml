translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Dua pertanyaan retoris dipertahankan secara sejajar. Pronomina terikat “-mu” menjaga sapaan orang kedua tunggal tanpa menambahkan unsur yang tidak terdapat dalam teks sumber.
