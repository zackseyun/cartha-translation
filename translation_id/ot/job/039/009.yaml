  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: id
  text: Apakah lembu liar[b] mau melayanimu? Apakah ia akan bermalam di dekat palunganmu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat makan hewanmu.” Istilah Ibrani ini menunjuk pada tempat atau wadah makan bagi hewan.
    reason: lexical_alternative
  - marker: b
    text: Atau “banteng liar” atau “aurochs”; jenis hewan yang dimaksud oleh istilah Ibrani ini tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: mau
  rationale: Kata kerja אבה menyatakan kemauan atau kesediaan. Dalam pertanyaan retoris ini, “mau” terdengar alami dan tetap mempertahankan nuansa kehendak.
- source_word: רֵּים
  choice: lembu liar
  rationale: Jenis hewan yang dimaksud tidak dapat dipastikan. “Lembu liar” merupakan padanan umum yang mudah dipahami dan tidak memberi kepastian zoologis yang melampaui bukti.
- source_word: עָבְדֶךָ
  choice: melayanimu
  rationale: Bentuk dari עבד di sini menunjuk pada pelayanan atau pekerjaan bagi seorang tuan; “melayanimu” ringkas dan sesuai dengan kontras antara hewan piaraan dan hewan liar.
- source_word: אִם
  choice: Apakah
  rationale: Dalam paralelisme puisi, אִם memperkenalkan pertanyaan retoris kedua. Pengulangan “Apakah” menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan antarklausa.
- source_word: יָלִין
  choice: akan bermalam
  rationale: Kata kerja לין berarti tinggal atau menginap semalam. “Akan bermalam” mempertahankan aspek waktu dan cocok dengan gambaran hewan yang tinggal di tempat pemberian makan.
- source_word: עַל
  choice: di dekat
  rationale: Walaupun arti dasarnya dapat berupa “di atas” atau “pada,” dalam kaitannya dengan palungan preposisi ini menyatakan lokasi hewan di sisi tempat makan. “Di dekat” alami dalam bahasa Indonesia.
- source_word: אֲבוּסֶךָ
  choice: palunganmu
  rationale: אֲבוּס menunjuk pada tempat atau wadah makan hewan. “Palungan” merupakan istilah Indonesia yang tepat dan ringkas; alternatif yang lebih deskriptif dicantumkan dalam catatan.
