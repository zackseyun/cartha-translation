source:
  edition: WLC
  text: יַחְלְמ֣וּ בְ֭נֵי/הֶם יִרְבּ֣וּ בַ/בָּ֑ר יָ֝צְא֗וּ וְ/לֹא שָׁ֥בוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: id
  text: Anak-anak mereka menjadi kuat; mereka tumbuh besar di alam terbuka[a]; mereka pergi dan tidak kembali kepada induknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di alam liar” atau “di daerah terbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: menjadi kuat
  rationale: Dalam konteks anak binatang, verba חלם menggambarkan pertumbuhan fisik yang sehat dan kokoh. “Menjadi kuat” jelas dan alami tanpa mempersempit maknanya menjadi sekadar gemuk.
- source_word: בְנֵיהֶם
  choice: anak-anak mereka
  rationale: Secara harfiah berarti “anak-anak mereka”; dalam konteks binatang, ungkapan ini menunjuk kepada anak binatang tanpa menyiratkan bahwa semuanya jantan.
- source_word: יִרְבּוּ
  choice: tumbuh besar
  rationale: רבה biasanya dapat berarti bertambah banyak, tetapi dalam paralelisme tentang anak binatang yang menjadi kuat lalu meninggalkan induknya, makna perkembangan menuju kedewasaan paling sesuai. Terjemahan ini tetap mempertahankan gagasan pertumbuhan.
- source_word: בַבָּר
  choice: di alam terbuka
  rationale: בָּר di sini menunjuk pada daerah liar atau terbuka, bukan tanah pertanian. “Alam terbuka” alami dalam bahasa Indonesia dan sesuai dengan kehidupan binatang liar.
- source_word: יָצְאוּ
  choice: mereka pergi
  rationale: יצא menyatakan gerak keluar atau menjauh. “Pergi” secara alami menyampaikan bahwa anak-anak binatang itu meninggalkan induknya.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: dan tidak kembali kepada induknya
  rationale: שוב dengan ל menyatakan kembali kepada pihak yang disebut sebelumnya. Karena acuannya adalah binatang-binatang induk, “kepada induknya” lebih jelas dalam bahasa Indonesia daripada “kepada mereka,” tanpa menambahkan gagasan “tidak pernah” yang tidak dinyatakan secara eksplisit.
