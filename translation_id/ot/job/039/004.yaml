  source_fidelity: 'Terjemahan mengikuti urutan dan makna pokok Ibrani dengan baik: anak-anak binatang itu menjadi kuat, bertumbuh di daerah terbuka, lalu pergi dan tidak kembali kepada induknya. “Tumbuh besar” merupakan pengungkapan Indonesia yang wajar untuk pembacaan kontekstual יִרְבּוּ sebagai pertumbuhan menuju kematangan, tanpa menambahkan unsur waktu seperti “tidak pernah.”'
