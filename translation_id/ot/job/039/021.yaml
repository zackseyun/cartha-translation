base_translation:
  language: en
  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: id
  text: Ia mengais-ngais tanah di lembah[a] dan bersukacita dalam kekuatannya; ia maju menyongsong persenjataan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menggali di lembah.” Kata kerja Ibrani yang berarti “menggali” di sini menggambarkan gerakan kuku kuda yang menggaruk atau mengais tanah.
    reason: lexical_alternative
  - marker: b
    text: Atau “pertempuran.” Kata Ibrani ini dapat berarti senjata atau persenjataan secara kolektif, dan secara lebih luas dapat menunjuk pada pertempuran itu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: mengais-ngais tanah
  rationale: Bentuk verba ini secara harfiah berarti “menggali,” tetapi dalam konteks kuda perang menggambarkan gerakan kukunya yang menggaruk atau mengais tanah. Pengulangan “mengais-ngais” menyampaikan tindakan yang berulang dan bersemangat secara alami dalam bahasa Indonesia.
- source_word: בָעֵמֶק
  choice: di lembah
  rationale: עֵמֶק lazim berarti lembah atau dataran rendah; “di lembah” mempertahankan gambaran ruang dalam teks Ibrani.
- source_word: וְיָשִׂישׂ
  choice: dan bersukacita
  rationale: Verba שׂושׂ menyatakan kegembiraan atau kegirangan yang kuat. “Bersukacita” tetap bermartabat dan tidak mengurangi daya ungkapnya.
- source_word: בְּכֹחַ
  choice: dalam kekuatannya
  rationale: Terjemahan ini mempertahankan konstruksi dengan preposisi ב dan menunjukkan bahwa kuda itu bergembira dalam kekuatan yang dimilikinya, tanpa menentukan secara sempit apakah kekuatan itu sebab atau lingkup kegembiraannya.
- source_word: יֵצֵא
  choice: ia maju
  rationale: יָצָא pada dasarnya berarti “keluar” atau “pergi keluar.” Dalam konteks bergerak menghadapi persenjataan, “maju” terdengar alami dalam bahasa Indonesia tanpa menambahkan kekuatan makna sebesar “menyerbu.”
- source_word: לִקְרַאת
  choice: menyongsong
  rationale: לִקְרַאת menunjuk gerak menuju suatu pertemuan atau konfrontasi. “Menyongsong” secara ringkas menyampaikan gerak maju untuk menghadapi sesuatu.
- source_word: נָשֶׁק
  choice: persenjataan
  rationale: נֶשֶׁק dapat merujuk pada senjata atau persenjataan secara kolektif, dan secara lebih luas pada pertempuran. “Persenjataan” mempertahankan arti konkret kolektifnya.
