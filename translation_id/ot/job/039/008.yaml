  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: id
  text: Ia menjelajahi pegunungan sebagai tempat merumputnya[a], dan mencari segala yang hijau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menyusuri pegunungan untuk mendapatkan tempat merumput.”
    reason: lexical_alternative
  - marker: b
    text: “Segala yang hijau” mengacu pada tumbuh-tumbuhan atau pertumbuhan hijau yang segar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: menjelajahi
  rationale: Bentuk Qal dari תור menyatakan kegiatan menjelajah, mengintai, atau menyusuri suatu wilayah. “Menjelajahi” secara alami menggambarkan gerak bebas keledai liar di pegunungan.
- source_word: הָרִים
  choice: pegunungan
  rationale: הָרִים berarti gunung-gunung. Dalam konteks wilayah yang dijelajahi, “pegunungan” lebih alami dalam bahasa Indonesia dan tetap mempertahankan gagasan kawasan bergunung.
- source_word: מִרְעֵהוּ
  choice: padang rumputnya
  rationale: מִרְעֶה menunjuk pada padang rumput atau tempat merumput, sedangkan akhiran orang ketiga tunggal dipertahankan dengan “-nya”.
- source_word: וְאַחַר
  choice: dan mencari
  rationale: Gabungan אַחַר dengan יִדְרֹשׁ menyatakan pencarian atau pengejaran terhadap sesuatu. Dalam bahasa Indonesia, nuansa ini disampaikan secara wajar oleh verba “mencari”.
- source_word: כָּל
  choice: segala
  rationale: כָּל digunakan secara menyeluruh terhadap יָרוֹק. “Segala” cocok dengan ungkapan substantival “yang hijau” dan mencakup semua tumbuhan hijau yang tersedia.
- source_word: יָרוֹק
  choice: yang hijau
  rationale: יָרוֹק secara harfiah berarti sesuatu yang hijau dan dalam konteks ini mengacu pada tumbuh-tumbuhan segar. “Yang hijau” mempertahankan keluasan ungkapan Ibrani tanpa mempersempitnya menjadi jenis tanaman tertentu.
- source_word: יִדְרֹשׁ
  choice: mencari
  rationale: Dalam konteks mencari makanan, דרשׁ berarti mencari atau berusaha menemukan. “Mencari” jelas, aktif, dan alami dalam bahasa Indonesia.
