  text: הֲ/תַאֲמִ֣ין בּ֭/וֹ כִּי ישוב זַרְעֶ֑/ךָ וְֽ/גָרְנְ/ךָ֥ יֶאֱסֹֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/012.yaml
  text: Will you trust him that he will bring back your seed and gather it to your threshing floor?[a]
translation:
  language: id
  text: Apakah engkau akan memercayainya bahwa ia akan membawa pulang benihmu[a] dan mengumpulkannya ke tempat pengirikanmu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu”; dalam konteks ini kemungkinan yang dimaksud ialah biji-bijian atau hasil panen yang dibawa pulang dari ladang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַאֲמִין
  choice: Apakah engkau akan memercayainya
  rationale: Bentuk Hifil dari אמן menanyakan apakah Ayub bersedia menaruh kepercayaan praktis pada lembu liar itu; 'memercayainya' lebih sesuai daripada sekadar 'percaya' secara kognitif.
- source_word: בּוֹ
  choice: -nya
  rationale: Pronomina maskulin tunggal ini merujuk kepada lembu liar; akhiran '-nya' alamiah untuk rujukan kepada hewan dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi kepercayaan, yaitu bahwa hewan itu akan melakukan tindakan berikutnya.
- source_word: יָשׁוּב
  choice: akan membawa pulang
  rationale: Dengan זַרְעֶךָ sebagai objek, שׁוב menyampaikan tindakan membawa hasil dari ladang kembali ke tempat pemiliknya; 'membawa pulang' mengungkapkan arah itu secara wajar.
- source_word: זַרְעֶךָ
  choice: benihmu
  rationale: Terjemahan ini mempertahankan arti leksikal זֶרַע, sambil membiarkan metonimia pertanian—benih yang telah menjadi hasil panen—tetap tampak; catatan kaki menjelaskan konteksnya.
- source_word: גָרְנְךָ
  choice: tempat pengirikanmu
  rationale: גֹּרֶן menunjuk khusus pada tempat atau lantai untuk mengirik, bukan lumbung penyimpanan.
- source_word: יֶאֱסֹף
  choice: mengumpulkannya ke
  rationale: אָסַף berarti mengumpulkan. Akhiran '-nya' merujuk kembali kepada hasil yang disebut 'benihmu', sedangkan 'ke' menyatakan tujuan, yakni tempat pengirikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai untuk sapaan tunggal dalam wacana ilahi kepada Ayub. Struktur pertanyaan retoris dan citra pertanian Ibrani dipertahankan.
