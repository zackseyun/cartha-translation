  source_fidelity: 'Terjemahan dengan tepat mencerminkan struktur dan makna Ibrani: keledai liar itu menertawakan/mengejek kegaduhan kota dan tidak mendengar teriakan orang yang menggiringnya. Bentuk kolektif “teriakan” wajar untuk jamak תְּשֻׁאוֹת, dan “tidak mendengar” mempertahankan verba שׁמע tanpa memparafrasakannya sebagai “tidak menghiraukan.”'
