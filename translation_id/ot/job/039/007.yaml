  text: יִ֭שְׂחַק לַ/הֲמ֣וֹן קִרְיָ֑ה תְּשֻׁא֥וֹת נ֝וֹגֵ֗שׂ לֹ֣א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/007.yaml
  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: id
  text: Ia menertawakan hiruk pikuk kota[a]; ia tidak mendengar teriakan si penggiring[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kegaduhan kota."
    reason: lexical_alternative
  - marker: b
    text: Atau "mandor" atau "pengawas kerja." Istilah Ibrani ini dapat menunjuk secara lebih luas kepada orang yang mendesak, menggiring, atau menuntut kerja.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: menertawakan
  rationale: Bentuk Qal imperfek dari שׂחק menyatakan reaksi keledai liar yang tidak gentar terhadap kebisingan kota. 'Menertawakan' mempertahankan gambaran langsung dalam bahasa Indonesia tanpa memperkuatnya menjadi 'mencemooh'.
- source_word: לַהֲמוֹן
  choice: hiruk pikuk
  rationale: הָמוֹן dapat menunjuk pada bunyi ramai, kegaduhan, atau keramaian. 'Hiruk pikuk' secara alami mencakup kebisingan sekaligus kesibukan kota.
- source_word: קִרְיָה
  choice: kota
  rationale: קִרְיָה berarti kota atau permukiman perkotaan; bentuk tanpa artikel dalam bahasa Indonesia wajar untuk menyatakan kehidupan kota secara umum.
- source_word: תְּשֻׁאוֹת
  choice: teriakan
  rationale: Bentuk jamak ini mengacu pada seruan atau teriakan keras. Dalam bahasa Indonesia, 'teriakan' dapat berfungsi kolektif dan berpadu alami dengan pelakunya.
- source_word: נֹגֵשׂ
  choice: si penggiring
  rationale: נֹגֵשׂ dapat berarti orang yang mendesak, menuntut kerja, atau menggiring. Dalam konteks binatang, 'penggiring' paling sesuai dan tidak memasukkan nuansa penindasan secara berlebihan.
- source_word: לֹא יִשְׁמָע
  choice: ia tidak mendengar
  rationale: Terjemahan ini mempertahankan arti langsung verba שׁמע. Konteks dapat menyiratkan bahwa binatang itu tidak menghiraukan, tetapi teks memakai bahasa 'mendengar'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hiruk pikuk' menyampaikan bunyi serta kesibukan kota secara idiomatis, sedangkan 'si penggiring' menjaga konteks binatang dan membedakan pelaku itu secara alami.
