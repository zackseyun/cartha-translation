  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: id
  text: Apakah engkau akan percaya kepadanya karena kekuatannya besar, dan menyerahkan jerih payahmu[a] kepadanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hasil jerih payahmu”; istilah Ibrani ini dapat merujuk pada kerja keras itu sendiri atau pada hasilnya.
