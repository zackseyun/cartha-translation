lexical_decisions:
- source_word: הֲתִבְטַח בּוֹ
  choice: Apakah engkau akan percaya kepadanya
  rationale: Bentuk tanya retoris dengan verba בטח menyatakan kepercayaan atau keandalan. Ungkapan “percaya kepadanya” alami dalam bahasa Indonesia dan tetap mengacu kepada lembu liar dalam konteks.
- source_word: כִּי רַב כֹּחוֹ
  choice: karena kekuatannya besar
  rationale: כִּי berfungsi kausal, sedangkan רַב כֹּחוֹ menyatakan besarnya kekuatan hewan itu. Terjemahan ini dekat dengan susunan dan makna Ibrani.
- source_word: וְתַעֲזֹב אֵלָיו
  choice: dan menyerahkan ... kepadanya
  rationale: עזב secara dasar berarti meninggalkan atau membiarkan, tetapi bersama אֵלָיו dalam konteks penugasan kerja menyiratkan penyerahan sesuatu kepada hewan itu. “Menyerahkan ... kepadanya” menyampaikan maksud tersebut secara alami tanpa menambahkan gagasan bahwa ia pasti dapat diandalkan.
- source_word: יְגִיעֶךָ
  choice: jerih payahmu
  rationale: יְגִיעַ dapat menunjuk pada kerja keras itu sendiri ataupun hasil yang diperoleh darinya. “Jerih payahmu” mempertahankan makna utama sekaligus cocok dengan konteks pekerjaan pertanian.
