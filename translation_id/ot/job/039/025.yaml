  text: בְּ/דֵ֤י שֹׁפָ֨ר יֹ֘אמַ֤ר הֶאָ֗ח וּֽ֭/מֵ/רָחוֹק יָרִ֣יחַ מִלְחָמָ֑ה רַ֥עַם שָׂ֝רִים וּ/תְרוּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: id
  text: Ketika sangkakala berbunyi[a], ia berkata, “Ha!”[b] Dari jauh ia mencium pertempuran, gemuruh para panglima, dan pekik perang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Pada bunyi sangkakala”; ungkapan Ibrani בְּדֵי שֹׁפָר menandai saat sangkakala dibunyikan.
    reason: lexical_alternative
  - marker: b
    text: “Ha!” adalah seruan penuh gairah yang menggambarkan kesiapan kuda itu untuk bertempur.
    reason: cultural_note
  - marker: c
    text: “Gemuruh para panglima dan pekik perang” dapat juga diterjemahkan “guntur para panglima dan sorak-sorai”. Kata רַעַם secara harfiah berarti “guntur” dan di sini menggambarkan bunyi pertempuran yang keras; תְרוּעָה dapat berarti pekikan perang atau bunyi isyarat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: Ketika sangkakala berbunyi
  rationale: Ungkapan ini menandai saat atau peristiwa terdengarnya sangkakala. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan makna waktunya.
- source_word: שֹׁפָר
  choice: sangkakala
  rationale: Dalam konteks ini, שֹׁפָר adalah alat tiup dari tanduk yang digunakan sebagai pemberi isyarat. “Sangkakala” merupakan padanan Indonesia yang lazim dalam konteks puitis dan militer.
- source_word: יֹאמַר
  choice: ia berkata
  rationale: Kata kerja ini secara dasar berarti “berkata”. Pilihan ini mempertahankan personifikasi yang hidup tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: הֶאָח
  choice: Ha!
  rationale: Seruan singkat ini menyatakan gairah atau kegembiraan kuda perang ketika mendengar tanda pertempuran. “Ha!” lebih wajar sebagai seruan bersemangat daripada “Aha!”, yang dalam bahasa Indonesia sering menyiratkan bahwa seseorang baru memahami sesuatu.
- source_word: וּמֵרָחוֹק
  choice: Dari jauh
  rationale: Frasa ini menunjukkan jarak dan diterjemahkan secara langsung serta alami.
- source_word: יָרִיחַ
  choice: ia mencium
  rationale: Kata kerja ini menggambarkan penciuman. Terjemahan harfiah tersebut mempertahankan gambaran konkret tentang kuda yang mengetahui adanya pertempuran dari jauh.
- source_word: מִלְחָמָה
  choice: pertempuran
  rationale: Dalam adegan langsung ini, kata tersebut menunjuk pada pertempuran, bukan perang sebagai keadaan umum.
- source_word: רַעַם
  choice: gemuruh
  rationale: Makna dasarnya adalah “guntur”, tetapi di sini digunakan sebagai gambaran bunyi keras di medan perang. “Gemuruh” mempertahankan daya metaforisnya dengan ungkapan Indonesia yang alami.
- source_word: שָׂרִים
  choice: para panglima
  rationale: Dalam konteks militer, kata ini menunjuk pada para pemimpin pasukan. “Para panglima” lebih tepat daripada “para pangeran” di sini.
- source_word: וּתְרוּעָה
  choice: dan pekik perang
  rationale: Kata ini dapat berarti pekikan atau bunyi isyarat. Bersama gemuruh para panglima dalam konteks medan perang, “pekik perang” merupakan padanan yang paling wajar tanpa meniadakan alternatif leksikalnya.
