  text: Ketika ia mengangkat dirinya ke atas[a], ia menertawakan[b] kuda dan penunggangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ketika ia membentangkan sayapnya di tempat tinggi” atau “ketika ia mengepak-ngepak hingga terangkat ke atas.” Verba Ibraninya kemungkinan menunjuk pada gerakan meninggi, tetapi nuansa tepatnya diperdebatkan.
