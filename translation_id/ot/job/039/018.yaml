lexical_decisions:
- source_word: כָּעֵת
  choice: Ketika
  rationale: Ungkapan ini berfungsi secara temporal untuk memperkenalkan keadaan saat tindakan burung unta berlangsung. “Ketika” alami dalam bahasa Indonesia dan tetap mempertahankan daya temporalnya.
- source_word: בַּמָּרוֹם
  choice: tinggi-tinggi
  rationale: Kata מָרוֹם menunjuk pada ketinggian. Dalam konstruksi ini, “tinggi-tinggi” secara alami menyampaikan gerakan meninggi tanpa memastikan bahwa burung itu benar-benar terbang.
- source_word: תַּמְרִיא
  choice: mengangkat dirinya
  rationale: Bentuk verba ini kemungkinan menggambarkan tindakan membuat diri naik atau meninggi, tetapi nuansa tepatnya diperdebatkan. Pilihan ini mempertahankan gambaran dasarnya tanpa menyatakan secara berlebihan bahwa burung unta melayang atau terbang.
- source_word: תִּשְׂחַק
  choice: menertawakan
  rationale: Verba שׂחק dapat berarti tertawa maupun mengejek. Dengan objek yang ditandai ל, tindakan ini bernuansa meremehkan; “menertawakan” mempertahankan gambaran hidup sekaligus membuka nuansa ejekan.
- source_word: לַסּוּס
  choice: kuda
  rationale: Bentuk tunggal dengan artikel berfungsi secara generik. Bahasa Indonesia lazim memakai nomina tanpa penanda khusus untuk menyatakan jenis secara umum.
- source_word: וּלְרֹכְבוֹ
  choice: dan penunggangnya
  rationale: Akhiran pronominal secara paling alami merujuk kembali kepada kuda. “Penunggangnya” ringkas dan mempertahankan hubungan tersebut.
