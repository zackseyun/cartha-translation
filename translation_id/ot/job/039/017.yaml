  - marker: b
    text: Secara harfiah, "tidak membagikan kepadanya dalam pengertian," yaitu tidak mengalokasikan atau mengaruniakan pengertian kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perilaku burung unta dalam konteks sekitarnya dan mempertahankan daya kausal teks Ibrani.
- source_word: הִשָּׁהּ
  choice: telah meniadakan ... darinya
  rationale: Bentuk kausatif dengan akhiran feminin tunggal menyatakan bahwa Allah menyebabkan hikmat tidak ada padanya. Pilihan ini mempertahankan tindakan ilahi tanpa membatasinya pada arti 'membuat lupa'.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Padanan baku bagi gelar ilahi tunggal ini dalam kitab Ayub.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Menunjuk pada kebijaksanaan, penilaian yang baik, atau kecakapan naluriah; 'hikmat' merupakan padanan langsung dan sesuai dengan konteks.
- source_word: וְלֹא
  choice: dan tidak
  rationale: Mempertahankan koordinasi serta negasi klausa kedua secara alami dalam bahasa Indonesia.
- source_word: חָלַק לָהּ
  choice: memberinya bagian dalam
  rationale: Kata kerja dasarnya berarti membagi atau mengalokasikan. Ungkapan ini mempertahankan nuansa bahwa suatu bagian tidak dialokasikan kepadanya.
- source_word: בַּבִּינָה
  choice: pengertian
  rationale: Menyatakan kemampuan memahami atau membedakan dan tetap berbeda secara semantis dari 'hikmat'.
theological_decisions:
- issue: Peran langsung Allah dalam ketiadaan hikmat pada burung unta
  choice: Allah dinyatakan sebagai pelaku yang meniadakan hikmat dan tidak memberikan bagian dalam pengertian.
  alternative: Melembutkan peran ilahi menjadi sekadar 'ia tidak memiliki hikmat'.
  rationale: Teks Ibrani secara eksplisit menyebut Allah sebagai subjek. Terjemahan mempertahankan atribusi langsung dan ketegangan teologisnya tanpa melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel Ibrani dipertahankan, sementara ungkapan dibuat cukup alami bagi pembaca umum.
