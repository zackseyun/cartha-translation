  text: sebab Allah telah membuatnya kekurangan hikmat[a] dan tidak mengaruniakan pengertian kepadanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "telah membuatnya melupakan hikmat" atau "telah menyebabkan ia kekurangan hikmat."
