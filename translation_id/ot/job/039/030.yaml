  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: id
  text: Anak-anak burungnya mengisap darah[a]; di mana ada orang-orang yang terbunuh[b], di situlah ia berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Anak-anak burungnya meneguk darah dengan lahap.” Kata kerja Ibrani ini sangat hidup dan dapat menyiratkan mengisap, meneguk, atau menjilat.
    reason: lexical_alternative
  - marker: b
    text: Atau “di mana ada mayat-mayat, di situlah ia berada.” Teks Ibrani menyebut “orang-orang yang terbunuh,” yang menekankan kematian akibat kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: anak-anaknya
  rationale: Kata ini menunjuk pada anak burung yang dibicarakan dalam konteks. “Anak-anaknya” alami dalam bahasa Indonesia dan tidak menentukan tahap pertumbuhan secara berlebihan.
- source_word: יְעַלְעוּ
  choice: mengisap
  rationale: Kata kerja Ibrani ini menggambarkan tindakan mengisap atau meneguk dengan lahap. “Mengisap” mempertahankan gambaran yang hidup dan lugas bersama objek “darah”.
- source_word: דָם
  choice: darah
  rationale: Padanan langsung yang mempertahankan kekuatan gambaran Ibrani tanpa memperhalusnya.
- source_word: וּבַאֲשֶׁר
  choice: di mana
  rationale: Konstruksi relatif ini menyatakan tempat. Dalam bahasa Indonesia, hubungan antarklausa tetap jelas tanpa harus menerjemahkan waw secara kaku sebagai “dan”.
- source_word: חֲלָלִים
  choice: orang-orang yang terbunuh
  rationale: Istilah ini menunjuk pada mereka yang mati karena kekerasan, bukan sekadar orang mati. Pilihan ini jelas bagi pembaca modern dan mempertahankan nuansa kematian akibat dibunuh.
- source_word: שָׁם הוּא
  choice: di situlah ia berada
  rationale: Pronomina tunggal merujuk kembali kepada burung dalam konteks. “Ia” wajar bagi hewan dalam gaya sastra Indonesia, sedangkan “di situlah” mempertahankan penekanan lokatif.
