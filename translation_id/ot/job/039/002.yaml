  text: Do you count the months they fulfill[a], and do you know the time when they give birth?
translation:
  language: id
  text: Dapatkah engkau menghitung bulan-bulan sampai mereka cukup bulan[a], dan tahukah engkau saat mereka melahirkan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bulan-bulan yang mereka genapi.” Ungkapan ini menunjuk pada genapnya masa kebuntingan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּסְפֹּר
  choice: Dapatkah engkau menghitung
  rationale: Bentuk Qal imperfek orang kedua tunggal maskulin muncul dalam pertanyaan retoris. “Dapatkah” menyampaikan tantangan ilahi secara alami dalam bahasa Indonesia tanpa menjadikannya sekadar pertanyaan tentang tindakan yang sedang dilakukan.
- source_word: יְרָחִים
  choice: bulan-bulan
  rationale: Kata ini berarti “bulan-bulan” sebagai satuan waktu; konteks menunjukkan lamanya masa kebuntingan, sehingga tidak perlu diperjelas menjadi “bulan-bulan kamariah”.
- source_word: תְּמַלֶּאנָה
  choice: yang mereka genapi
  rationale: 'Bentuk Piel imperfek orang ketiga jamak feminin mempertahankan susunan aktif bahasa Ibrani: hewan-hewan betina itu “menggenapi” bulan-bulan masa kebuntingannya. Ungkapan yang agak tidak lazim ini dipertahankan dalam teks, sementara bentuk yang lebih idiomatis diberikan dalam catatan kaki.'
- source_word: וְיָדַעְתָּ
  choice: dan tahukah engkau
  rationale: Bentuk Qal perfek orang kedua tunggal maskulin dengan konjungsi merupakan pertanyaan kedua dalam rangkaian retoris. “Tahukah engkau” alami dan menjaga perbedaan antara menghitung dan mengetahui.
- source_word: עֵת
  choice: saat
  rationale: Kata עֵת menunjuk pada waktu tertentu. “Saat” ringkas dan alami; “waktu yang ditetapkan” akan menambahkan penafsiran yang tidak harus dinyatakan di sini.
- source_word: לִדְתָּנָה
  choice: mereka melahirkan
  rationale: Infinitif konstruk ילד dengan sufiks orang ketiga jamak feminin diterjemahkan sebagai klausa waktu yang wajar dalam bahasa Indonesia dan tetap merujuk kepada hewan-hewan betina dalam konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Pronomina “engkau” dipakai untuk mempertahankan sapaan tunggal langsung dalam interogasi ilahi. Istilah teknis “masa kebuntingan” dibatasi pada catatan kaki; teks utama memakai ungkapan umum “melahirkan”.
