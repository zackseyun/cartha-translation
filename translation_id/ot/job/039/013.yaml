translation:
  language: id
  text: Sayap burung unta mengepak dengan riang—apakah itu sayap dan bulu-bulu burung bangau?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sayap burung unta berkepak dengan bangga, tetapi apakah itu sayap dan bulu-bulu burung bangau?” Teks Ibrani ayat ini sulit dan telah dipahami dengan beberapa cara.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַף
  choice: sayap
  rationale: Bentuk tunggal Ibrani berfungsi secara kolektif; dalam bahasa Indonesia, “sayap” dapat tetap menyatakan bagian tubuh yang berpasangan tanpa harus dibuat jamak.
- source_word: רְנָנִים
  choice: burung unta
  rationale: Dalam rangkaian uraian tentang binatang di Ayub 39, kata ini paling wajar menunjuk kepada burung unta, meskipun secara etimologis berkaitan dengan seruan atau nyanyian.
- source_word: נֶעֱלָסָה
  choice: mengepak dengan riang
  rationale: Ungkapan ini mempertahankan gabungan gerakan sayap dan nuansa kegembiraan atau kegirangan yang terkandung dalam verba Ibrani.
- source_word: אִם
  choice: apakah
  rationale: Partikel ini memperkenalkan perbandingan retoris yang eliptis. “Apakah” mempertahankan daya tanya tanpa memastikan hubungan sintaksis yang diperdebatkan.
- source_word: אֶבְרָה
  choice: bulu kepak
  rationale: Kata ini menunjuk lebih khusus kepada bulu besar pada sayap, bukan seluruh sayap. “Bulu kepak” cukup tepat sekaligus dapat dipahami pembaca umum.
- source_word: חֲסִידָה
  choice: burung bangau
  rationale: Dalam konteks zoologis ini, kata tersebut adalah nama burung stork. “Burung bangau” merupakan sebutan Indonesia yang umum dan mudah dipahami.
- source_word: וְנֹצָה
  choice: dan bulu
  rationale: Kata benda ini berarti bulu atau bulu burung secara umum. Pilihan sederhana ini mempertahankan perbedaannya dari “bulu kepak”.
