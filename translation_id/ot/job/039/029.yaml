translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina "ia" merujuk kepada rajawali pada konteks sebelumnya; "mengintai makanan" menyampaikan pencarian tajam dari tempat tinggi tanpa mempersempit אֹכֶל menjadi "mangsa".
