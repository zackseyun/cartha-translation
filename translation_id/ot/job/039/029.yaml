  text: From there he spies out food[a]; his eyes look from far away.
translation:
  language: id
  text: Dari sana ia mencari makanan; matanya memandang dari kejauhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Menunjukkan tempat tinggi yang menjadi titik pengamatan rajawali; ungkapan ini alami dan dekat dengan bentuk Ibrani.
- source_word: חָפַר
  choice: mengintai
  rationale: Walaupun arti dasarnya berkaitan dengan menggali atau mencari, dalam konteks rajawali yang melihat dari jauh kata ini menggambarkan pencarian makanan dengan pengamatan tajam.
- source_word: אֹכֶל
  choice: makanan
  rationale: Mempertahankan arti umum nomina Ibrani; dalam konteks ini makanan itu dapat berupa mangsa.
- source_word: לְמֵרָחוֹק
  choice: dari kejauhan
  rationale: Mengungkapkan jarak yang jauh secara alami dalam bahasa Indonesia dan berkaitan dengan tindakan memandang.
- source_word: עֵינָיו יַבִּיטוּ
  choice: matanya memandang
  rationale: Mempertahankan gambaran konkret mata sebagai subjek dan nuansa pandangan yang diarahkan.
