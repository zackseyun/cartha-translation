  yaml_path: translation/ot/job/016/019.yaml
  text: Even now[a], behold, my witness is in heaven[b], and he who testifies for me is in the heights.
translation:
  language: id
  text: Bahkan sekarang, lihatlah, saksiku ada di surga, dan saksiku ada di ketinggian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Bahkan sekarang
  rationale: Gabungan ini memberi penekanan temporal pada keadaan Ayub saat ini; ‘Bahkan sekarang’ alami dan mempertahankan desakan ungkapan Ibrani.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel penunjuk ini mengarahkan perhatian kepada pernyataan berikutnya. ‘Lihatlah’ bermartabat tetapi tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: בַשָּׁמַיִם
  choice: di surga
  rationale: Dalam konteks ini שָׁמַיִם menunjuk pada ranah surgawi, bukan sekadar langit fisik.
- source_word: עֵדִי
  choice: saksiku
  rationale: Terjemahan langsung yang mempertahankan gambaran hukum dalam permohonan Ayub.
- source_word: וְשָׂהֲדִי
  choice: dia yang bersaksi bagiku
  rationale: Nomina bercorak Aram ini berdekatan makna dengan ‘saksi’. Ungkapan ini mempertahankan fungsi kesaksian tanpa mempersempit tokoh tersebut menjadi pembela dalam arti teknis.
- source_word: בַּמְּרוֹמִים
  choice: di tempat-tempat tinggi
  rationale: Bentuk jamak ini menunjuk pada ketinggian surgawi dan sejajar dengan ‘di surga’; terjemahan ini mempertahankan citra ruang serta paralelismenya.
theological_decisions:
- issue: Identitas saksi Ayub di surga
  choice: Tokoh itu digambarkan hanya menurut fungsinya sebagai saksi yang bersaksi bagi Ayub.
  alternative: Menentukannya sebagai Allah, perantara atau malaikat surgawi, ataupun personifikasi kesaksian Ayub.
  rationale: Teks Ibrani tidak mengidentifikasi tokoh tersebut secara eksplisit. Terjemahan ini mempertahankan ketegangan teologis dan gambaran peradilannya tanpa menetapkan tafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme Ibrani dipertahankan dengan ‘di surga’ dan ‘di tempat-tempat tinggi’; pengulangan semantis antara dua istilah kesaksian dibuat jelas tanpa menjadi kaku.
