  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: id
  text: 'Wajahku memerah karena menangis,

    dan pada kelopak mataku ada kegelapan pekat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bayang-bayang maut.” Istilah Ibrani ini dapat berarti bayang-bayang maut atau kegelapan yang sangat dalam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: wajahku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal secara idiomatis merujuk pada wajah sebagai satu kesatuan; “wajahku” alami dan tepat dalam bahasa Indonesia.
- source_word: חמרמרה
  choice: memerah
  rationale: Kata kerja langka ini menggambarkan perubahan pada rupa wajah akibat gejolak atau penderitaan. Dalam konteks tangisan, “memerah” menyampaikan dampak yang tampak tanpa menentukan keadaan fisik secara berlebihan.
- source_word: מִנִּי בֶכִי
  choice: karena menangis
  rationale: Preposisi menandai sebab, sedangkan nomina menunjuk pada tindakan menangis; ungkapan ini jelas, alami, dan tetap puitis.
- source_word: וְעַל עַפְעַפַּי
  choice: dan ... menyelimuti kelopak mataku
  rationale: “Kelopak mataku” mempertahankan rujukan anatomis yang khusus. Kata kerja “menyelimuti” melengkapi klausa nominal Ibrani secara wajar dan mempertahankan gambaran kegelapan yang berada di atas kelopak mata.
- source_word: צַלְמָוֶת
  choice: kelam pekat
  rationale: Istilah puitis ini dapat berarti kegelapan yang sangat dalam atau bayang-bayang maut. “Kelam pekat” mempertahankan intensitas dan suasana muram tanpa secara sepihak menjadikannya rujukan langsung kepada kematian.
theological_decisions:
- issue: Apakah צַלְמָוֶת secara langsung merujuk kepada maut
  choice: kelam pekat
  alternative: bayang-bayang maut
  rationale: Dalam konteks wajah dan kelopak mata akibat tangisan, gambaran kegelapan atau kemuraman yang sangat dalam paling sesuai, tetapi kemungkinan nuansa maut tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan puitis. Paralelisme dua baris dipertahankan. Pilihan “kelam pekat menyelimuti” membuat klausa nominal Ibrani alami dalam bahasa Indonesia tanpa menghilangkan citra kelopak mata yang diliputi kegelapan.
