  text: אַפּ֤/וֹ טָרַ֨ף וַֽ/יִּשְׂטְמֵ֗/נִי חָרַ֣ק עָלַ֣/י בְּ/שִׁנָּ֑י/ו צָרִ֓/י יִלְט֖וֹשׁ עֵינָ֣י/ו לִֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: id
  text: 'Murkanya mencabik-cabik aku, dan ia memusuhi aku;

    ia mengertakkan giginya terhadap aku;

    lawanku menajamkan matanya terhadap aku.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menajamkan matanya terhadap aku,” yaitu menatap dengan tajam dan penuh permusuhan.
    reason: Menjelaskan metafora Ibrani yang sengaja dipertahankan dalam teks utama.
lexical_decisions:
- source_word: אַפּוֹ
  choice: Murkanya
  rationale: אַף secara harfiah dapat berarti ‘hidung’, tetapi secara idiomatis menyatakan amarah atau murka. ‘Murkanya’ mempertahankan daya puitis dan permusuhan yang kuat dalam konteks ini.
- source_word: טָרַף
  choice: mencabik-cabik
  rationale: Kata kerja ini menggambarkan tindakan merobek mangsa seperti binatang buas. ‘Mencabik-cabik’ mempertahankan gambaran pemangsaan yang keras.
- source_word: וַיִּשְׂטְמֵנִי
  choice: dan ia memusuhi aku
  rationale: שׂטם menyatakan kebencian atau sikap bermusuhan. ‘Memusuhi aku’ alami dalam bahasa Indonesia dan tidak menambahkan tindakan yang tidak dinyatakan teks.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: ia mengertakkan giginya terhadap aku
  rationale: Ungkapan ini melukiskan kertakan gigi karena kemarahan. Frasa ‘terhadap aku’ mempertahankan arah permusuhannya.
- source_word: צָרִי
  choice: lawanku
  rationale: צַר menunjuk kepada sosok yang bermusuhan atau menentang. ‘Lawanku’ tidak mempersempitnya menjadi musuh perang atau lawan hukum dan membiarkan identitas sosok itu tetap terbuka.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: menajamkan matanya terhadap aku
  rationale: לָטַשׁ secara harfiah berarti menajamkan atau mengasah. Terjemahan ini sengaja mempertahankan metafora Ibrani yang tidak biasa tentang tatapan yang tajam dan bermusuhan.
theological_decisions:
- issue: Identitas subjek yang bermusuhan dalam ratapan Ayub
  choice: Mempertahankan kata ganti orang ketiga tunggal dan sebutan ‘lawanku’ tanpa menyebut identitasnya.
  alternative: Menentukan subjek secara eksplisit sebagai Allah, musuh manusia, atau gambaran gabungan tentang Allah yang bertindak sebagai lawan.
  rationale: Bentuk-bentuk Ibrani berjenis maskulin tunggal, tetapi ayat ini sendiri tidak menyebut ulang identitas subjek. Terjemahan tidak menyelesaikan ketegangan teologis dengan memasukkan nama ‘Allah’ ataupun membatasinya pada musuh manusia.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Huruf kecil pada ‘ia’ dan akhiran ‘-nya’ dipakai agar identitas sosok yang dimaksud tidak ditentukan oleh kapitalisasi. Paralelisme tiga baris mempertahankan gerak dan intensitas puisi Ibrani.
