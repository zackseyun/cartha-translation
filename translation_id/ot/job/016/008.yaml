  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: id
  text: Engkau telah membuatku mengerut—itu telah menjadi saksi; kekurusanku bangkit melawan aku dan menjawab tepat di hadapanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjawab di wajahku.”
    reason: Menjelaskan ungkapan Ibrani בְּפָנַי (“di wajahku”) dan mempertahankan verba “menjawab” yang dipakai dalam teks utama.
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: Engkau telah mengerutkan aku
  rationale: Bentuk ini menyatakan tindakan yang membuat tubuh Ayub mengerut atau menyusut. Terjemahan harfiah ini mempertahankan gambaran jasmani yang kuat tanpa mempersempitnya menjadi sekadar kehilangan berat badan.
- source_word: לְעֵד הָיָה
  choice: hal itu menjadi saksi
  rationale: Subjek gramatikalnya tidak dinyatakan secara eksplisit dan dapat menunjuk pada keadaan Ayub yang mengerut atau pada tindakan tersebut. 'Hal itu' mempertahankan ketidakjelasan rujukan ini.
- source_word: כַחֲשִׁי
  choice: kekurusanku
  rationale: Dalam konteks tubuh Ayub yang menyusut, nomina ini paling wajar dipahami sebagai kekurusan atau keadaan tubuh yang tinggal kurus, meskipun bentuk Ibraninya sulit dan secara leksikal juga dapat dikaitkan dengan kepalsuan.
- source_word: יַעֲנֶה
  choice: bersaksi
  rationale: Secara dasar berarti 'menjawab', tetapi dalam rangkaian bahasa pengadilan dengan 'saksi' maknanya ialah memberi kesaksian. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan citra yudisial ayat.
- source_word: בְּפָנַי
  choice: di hadapanku
  rationale: Ungkapan ini secara harfiah berarti 'di wajahku/di hadapanku'. 'Di hadapanku' lebih alami untuk tindakan bersaksi, sedangkan arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Identitas pihak yang mengerutkan Ayub
  choice: Mempertahankan sapaan orang kedua tunggal 'Engkau' tanpa menambahkan nama atau identitas
  alternative: Menjelaskan secara eksplisit bahwa Allah yang melakukan tindakan itu
  rationale: Teks Ibrani hanya memakai bentuk orang kedua tunggal. Konteks dapat menunjuk kepada Allah, tetapi ayat ini sendiri tidak menyebut nama-Nya; penambahan itu akan menutup ketegangan retoris yang ada.
- issue: Tubuh Ayub sebagai bukti yang memberatkannya
  choice: Mempertahankan personifikasi kekurusan sebagai saksi yang bangkit melawan Ayub
  alternative: Menjelaskan bahwa orang lain menafsirkan penderitaan fisiknya sebagai bukti kesalahan
  rationale: Teks menggambarkan keadaan fisik Ayub sendiri sebagai saksi yang menentangnya. Penjelasan mengenai tafsiran orang lain tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan puitis serta metafora pengadilan dipertahankan. Tanda pisah menandai peralihan dari tindakan terhadap Ayub kepada akibatnya sebagai kesaksian yang menentangnya.
