  text: They have opened their mouths wide against me[a]; with reproach they have struck my cheek; together they gather themselves against me.
translation:
  language: id
  text: Mereka mengangakan mulut terhadap aku; dengan cercaan mereka memukul pipiku; bersama-sama mereka berhimpun melawan aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, “mereka memenuhi diri terhadap aku.” Kata kerja terakhir bersifat idiomatis dan sulit; dalam konteks ini, tampaknya menunjuk pada pihak-pihak yang bermusuhan yang berkumpul serentak melawan Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּעֲרוּ
  choice: mengangakan
  rationale: Verba פער menggambarkan tindakan membuka mulut lebar-lebar, di sini dengan sikap mengejek atau memusuhi. “Mengangakan mulut” mempertahankan gambaran yang hidup dan wajar dalam bahasa Indonesia.
- source_word: עָלַי
  choice: terhadap aku / melawan aku
  rationale: Preposisi עַל dalam konteks serangan menyatakan arah permusuhan. “Terhadap aku” alami pada klausa pertama, sedangkan “melawan aku” memperjelas daya permusuhan pada klausa terakhir tanpa mengubah acuannya.
- source_word: בְּפִיהֶם
  choice: mulut
  rationale: Bahasa Ibrani memakai bentuk tunggal distributif, harfiah “dengan mulut mereka.” Bahasa Indonesia juga dapat memakai “mulut” secara alami dengan subjek jamak.
- source_word: בְּחֶרְפָּה
  choice: dengan cercaan
  rationale: חֶרְפָּה mencakup celaan, penghinaan, dan aib. “Cercaan” mempertahankan bentuk nomina dan menyampaikan penghinaan yang menyertai serangan.
- source_word: הִכּוּ
  choice: menampar
  rationale: נכה berarti memukul. Bersama objek “pipi,” “menampar” merupakan padanan Indonesia yang alami dan menangkap sifat serangan yang menghina, meski secara harfiah dapat diterjemahkan “memukul.”
- source_word: לְחָיָי
  choice: pipiku
  rationale: לְחִי menunjuk pipi atau rahang. “Pipi” paling sesuai dengan gambaran penghinaan melalui tamparan.
- source_word: יַחַד
  choice: bersama-sama
  rationale: יַחַד menandai tindakan kolektif atau serentak; “bersama-sama” jelas dan alami.
- source_word: יִתְמַלָּאוּן
  choice: berhimpun
  rationale: Bentuk ini secara harfiah berkaitan dengan “memenuhi diri,” tetapi pemakaiannya di sini sulit dan tampaknya idiomatis. “Berhimpun” menyampaikan pasukan atau pihak-pihak bermusuhan yang berkumpul secara serentak tanpa memaksakan arti yang terlalu spesifik.
