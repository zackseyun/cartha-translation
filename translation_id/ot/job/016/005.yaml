translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Bentuk orang kedua jamak diterjemahkan ‘kamu’, sesuai konteks Job berbicara kepada para sahabatnya. Paralelisme ‘mulutku’ dan ‘bibirku’ dipertahankan.
