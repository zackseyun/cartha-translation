  yaml_path: translation/ot/job/016/018.yaml
  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: id
  text: Wahai bumi, jangan tutupi darahku[a][c], dan jangan ada tempat bagi jeritanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “darahku yang tertumpah”. Secara harfiah teks Ibrani berbunyi “darahku”, tetapi dalam konteks ini dapat berarti darah yang ditumpahkan secara tidak adil.
    reason: lexical_alternative
  - marker: b
    text: Atau “seruan minta tolongku”. Istilah Ibrani ini dapat menunjuk pada jeritan kesusahan yang sekaligus menjadi permohonan agar keadilan ditegakkan.
    reason: lexical_alternative
  - marker: c
    text: Gambaran ini mengingatkan pada darah yang berseru dari tanah menuntut keadilan; bandingkan Kejadian 4:10.
    reason: cross_reference
lexical_decisions:
- source_word: אֶרֶץ
  choice: Hai bumi
  rationale: Nomina ini disapa secara langsung, sebagaimana tampak dari bentuk verba feminin tunggal sesudahnya. “Bumi” mempertahankan cakupan puitis yang lebih luas daripada “tanah”, sedangkan “Hai” menandai sapaan secara wajar dalam bahasa Indonesia.
- source_word: אַל תְּכַסִּי
  choice: jangan tutupi
  rationale: אַל dengan bentuk verba ini menyatakan larangan atau harapan negatif yang mendesak. “Tutupi” mempertahankan gambaran konkret bahwa darah jangan disembunyikan atau dibuat tidak terlihat.
- source_word: דָמִי
  choice: darahku
  rationale: Secara harfiah bentuk ini berarti “darahku”. Konteks dapat menyiratkan darah yang ditumpahkan secara tidak adil, tetapi terjemahan utama mempertahankan ungkapan konkret dan ambiguitas teks Ibrani.
- source_word: וְאַל יְהִי
  choice: dan jangan ada
  rationale: Rangkaian ini menyatakan harapan negatif kedua. “Jangan ada” alami dalam bahasa Indonesia dan mempertahankan konstruksi eksistensial teks sumber.
- source_word: מָקוֹם
  choice: tempat perhentian
  rationale: מָקוֹם secara dasar berarti “tempat”, tetapi dalam konteks ini tempat tersebut dibayangkan sebagai tempat jeritan berhenti atau dibungkam. “Tempat perhentian” menyampaikan nuansa kontekstual itu tanpa menjelaskan gambaran secara berlebihan.
- source_word: לְזַעֲקָתִי
  choice: bagi jeritanku
  rationale: זְעָקָה menunjuk pada jeritan dalam kesusahan yang juga dapat berfungsi sebagai permohonan pertolongan atau keadilan. “Jeritanku” kuat dan alami, sementara catatan kaki mempertahankan kemungkinan nuansa tuntutan keadilan.
theological_decisions:
- issue: Kiasan tentang darah orang tidak bersalah yang berseru menuntut keadilan
  choice: Mempertahankan ungkapan konkret “darahku” dan “jeritanku” dalam teks utama.
  alternative: Menerjemahkan dengan “darahku yang tertumpah” atau “seruan tuntutanku” untuk menonjolkan makna forensik.
  rationale: Ayat ini kemungkinan menggemakan motif darah yang berseru dari tanah dalam Kejadian 4:10. Namun, teks Ibrani tetap menyisakan ketegangan puitis antara darah secara konkret dan permohonan pembenaran, sehingga terjemahan utama tidak mengubahnya menjadi parafrasa teologis yang lebih eksplisit.
translation_notes:
  register: Bahasa puitis yang modern dan bermartabat. Sapaan “Hai bumi” mempertahankan personifikasi, sedangkan “tempat perhentian” mempertahankan gambaran bahwa jeritan Ayub tidak boleh berhenti, dibungkam, atau kehilangan tuntutannya untuk didengar.
