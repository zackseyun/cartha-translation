  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: id
  text: Aku telah menjahit kain kabung pada kulitku, dan menjatuhkan[a] tandukku[b] ke dalam debu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merendahkan” atau “menodai tandukku di dalam debu.” Kata kerja Ibraninya sulit dipahami, dan nuansa tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: “Tanduk” adalah metafora Ibrani untuk kekuatan, kehormatan, atau kedudukan tinggi.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: kain kabung
  rationale: Istilah baku dalam bahasa Indonesia untuk kain kasar yang dikenakan sebagai tanda berkabung atau merendahkan diri.
- source_word: תָּפַרְתִּי
  choice: Aku telah menjahit
  rationale: Bentuk Qal perfektif orang pertama tunggal berarti ‘menjahit’; ‘telah’ menandai tindakan yang sudah dilakukan dengan keadaan yang masih berlangsung.
- source_word: עֲלֵי גִלְדִּי
  choice: pada kulitku
  rationale: Mengungkapkan penempatan kain kabung di atas kulit secara alami tanpa memperluas גֶּלֶד menjadi ‘tubuh’.
- source_word: וְעֹלַלְתִּי
  choice: dan membenamkan
  rationale: Kata kerjanya sulit dan nuansanya tidak pasti. ‘Membenamkan’ mempertahankan gambaran tindakan konkret yang membawa tanduk ke dalam debu, sedangkan alternatif dicatat dalam catatan kaki.
- source_word: בֶעָפָר
  choice: ke dalam debu
  rationale: Dengan kata kerja gerak ‘membenamkan’, ungkapan ini secara wajar menyatakan arah dan hasil tindakan, yaitu penghinaan atau perendahan.
- source_word: קַרְנִי
  choice: tandukku
  rationale: Mempertahankan metafora Ibrani yang konkret; tanduk dapat melambangkan kekuatan, kehormatan, atau kedudukan tinggi.
theological_decisions:
- issue: Metafora tanduk
  choice: Mempertahankan ‘tandukku’ dalam teks utama
  alternative: kekuatanku; kehormatanku
  rationale: Metafora asli menyampaikan perendahan secara puitis dan konkret. Menafsirkannya langsung sebagai kekuatan atau kehormatan akan mempersempit cakupan gambarnya.
- issue: Nuansa וְעֹלַלְתִּי yang tidak pasti
  choice: membenamkan
  alternative: merendahkan; menodai; mencampakkan
  rationale: Pilihan ini sesuai dengan gambaran tanduk yang dibawa ke debu tanpa menyembunyikan ketidakpastian leksikal; alternatif penting diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. ‘Kain kabung’ mempertahankan kosakata ratapan yang dikenal, sedangkan susunan kalimat dibuat langsung dan mudah dipahami.
