base_translation:
  language: en
  yaml_path: translation/ot/job/016/002.yaml
  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: id
  text: Aku sudah mendengar banyak hal semacam itu; kalian semua adalah penghibur yang menyusahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “para penghibur kesusahan”; dapat juga diterjemahkan, “para penghibur yang mendatangkan kesusahan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Aku sudah mendengar
  rationale: Bentuk Qal perfektif orang pertama tunggal. Kata 'sudah' menyampaikan bahwa Ayub telah berulang kali mendengar perkataan serupa dan akibatnya masih terasa dalam keluhannya sekarang.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: banyak hal semacam itu
  rationale: Gabungan preposisi perbandingan, kata tunjuk, dan bentuk jamak רב secara alami berarti banyak hal seperti yang baru saja diucapkan.
- source_word: מְנַחֲמֵי
  choice: penghibur
  rationale: Partisipel dari נחם dipakai sebagai nomina. 'Penghibur' mempertahankan ironi bahwa sahabat-sahabat Ayub bermaksud menghibur, tetapi justru gagal.
- source_word: עָמָל
  choice: yang menyusahkan
  rationale: עמל dapat menunjuk pada kesusahan, penderitaan, jerih payah, atau sesuatu yang menimbulkan masalah. Dalam frasa konstruksi ini, 'yang menyusahkan' alami dalam bahasa Indonesia dan mempertahankan kemungkinan bahwa mereka adalah penghibur yang mendatangkan kesusahan.
- source_word: כֻּלְּכֶם
  choice: kalian semua
  rationale: Bentuk orang kedua jamak dengan כֹּל menegaskan bahwa kecaman Ayub ditujukan kepada seluruh kelompok.
