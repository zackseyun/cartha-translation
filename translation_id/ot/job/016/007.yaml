  source_fidelity: 'Teks Indonesia mempertahankan unsur-unsur pokok Ibrani: partikel pembuka yang dapat bernuansa adversatif/emfatis ("Namun"), "sekarang", verba orang ketiga tunggal tersirat pada klausa pertama ("dia telah membuatku letih"), dan peralihan yang disengaja kepada orang kedua tunggal pada klausa kedua ("engkau telah membuat"). "Segenap" menerjemahkan כָּל dengan baik, sedangkan "kelompokku" merupakan padanan yang cukup luas bagi עֲדָתִי tanpa memaksakan makna lembaga keagamaan.'
