source:
  edition: WLC
  text: אַךְ עַתָּ֥ה הֶלְאָ֑/נִי הֲ֝שִׁמּ֗וֹתָ כָּל עֲדָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: id
  text: Namun sekarang dia telah membuatku letih[a]; engkau telah membuat segenap kelompokku porak-poranda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dia telah menghabiskan tenagaku” atau “dia telah membuatku kelelahan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “seluruh kumpulanku” atau “seluruh jemaatku.” Kata Ibrani ini dapat menunjuk pada lingkaran orang-orang yang berkumpul di sekitar Ayub atau kelompok seperti keluarga besarnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang tegas dari uraian sebelumnya. Dalam konteks ini, “namun” menyampaikan daya adversatifnya secara alami, sementara nuansa penegasan tetap terasa dari susunan kalimat.
- source_word: עַתָּה
  choice: sekarang
  rationale: Keterangan waktu ini menunjuk langsung pada keadaan Ayub saat ini dan mempertahankan kesegeraan ratapannya.
- source_word: הֶלְאָנִי
  choice: dia telah membuatku letih
  rationale: Bentuk dari לאה menyatakan tindakan membuat letih atau menguras tenaga. Subjeknya orang ketiga tunggal maskulin dan tidak disebutkan secara eksplisit, sehingga “dia” dipertahankan tanpa langsung menggantinya dengan nama Allah.
- source_word: הֲשִׁמּוֹתָ
  choice: engkau telah membuat ... porak-poranda
  rationale: Bentuk kausatif dari שמם berarti membuat sunyi, tandus, atau hancur. Ungkapan “membuat ... porak-poranda” menyampaikan akibat kehancuran secara kuat dan wajar dalam bahasa Indonesia, sekaligus mempertahankan bentuk orang kedua tunggal.
- source_word: כָּל
  choice: segenap
  rationale: “Segenap” secara alami menyatakan keseluruhan dari kelompok yang dimaksud.
- source_word: עֲדָתִי
  choice: kelompokku
  rationale: עֵדָה dapat berarti kumpulan, perhimpunan, atau jemaat. Dalam ratapan Ayub, “kelompokku” cukup luas untuk merujuk pada lingkaran orang-orang atau keluarga besar yang menyertainya tanpa menjadikannya secara khusus sebagai jemaat ibadah.
theological_decisions:
- issue: Peralihan persona gramatikal antara kedua verba
  choice: Mempertahankan peralihan dari orang ketiga, “dia telah membuatku letih,” kepada sapaan orang kedua, “engkau telah membuat ...”
  alternative: Menyelaraskan kedua verba sebagai sapaan langsung kepada Allah, atau menjadikan keduanya orang ketiga.
  rationale: Teks Masoret memang beralih dari bentuk orang ketiga tunggal maskulin ke bentuk orang kedua tunggal maskulin. Terjemahan tidak menghaluskan peralihan tersebut, sehingga tetap terbuka kemungkinan bahwa Ayub beralih secara retoris dari berbicara tentang Allah kepada berbicara langsung kepada-Nya.
- issue: Kapitalisasi kata ganti bagi Allah
  choice: Menggunakan “dia” dan “engkau” dengan huruf kecil
  alternative: Menggunakan “Dia” dan “Engkau” dengan huruf besar.
  rationale: Bahasa Ibrani tidak memakai kapitalisasi untuk menandai rujukan ilahi. Huruf kecil menghindari penambahan penafsiran pada subjek tersirat verba pertama dan tetap sesuai dengan kaidah umum bahasa Indonesia.
translation_notes:
  register: Bahasa dibuat modern dan bermartabat. “Membuatku letih” mempertahankan arti dasar verba tanpa menjadi kaku, sedangkan “porak-poranda” menyampaikan kuatnya kehancuran secara idiomatis. Peralihan “dia ... engkau” sengaja dipertahankan sebagai ketegangan yang ada dalam teks sumber.
