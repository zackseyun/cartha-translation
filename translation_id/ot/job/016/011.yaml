  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: id
  text: Allah menyerahkan aku kepada orang fasik[a] dan menghempaskan aku ke dalam tangan orang-orang jahat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang yang tidak saleh” atau “orang lalim.”'
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani pada bagian ini sulit dipastikan; mungkin berarti “melemparkan aku” atau “mencampakkan aku” ke dalam kuasa orang-orang jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: menyerahkan aku
  rationale: Bentuk hifil dari סגר di sini menyatakan penyerahan seseorang ke dalam kuasa pihak lain; 'menyerahkan aku' alami dalam bahasa Indonesia dan mempertahankan nuansa permusuhan.
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks keluhan Ayub, אֵל merujuk kepada Allah, bukan sekadar 'seorang yang perkasa'.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pemindahan kepada pihak lain dan secara alami menyatu dengan ungkapan 'menyerahkan ... kepada'.
- source_word: עֲוִיל
  choice: orang fasik
  rationale: Kata ini menunjuk kepada orang yang menyimpang secara moral atau tidak saleh; 'orang fasik' mempertahankan bobot etis-religiusnya.
- source_word: וְעַל יְדֵי
  choice: ke dalam tangan
  rationale: Ungkapan dengan 'tangan' menggambarkan masuk ke dalam kuasa pihak lain; terjemahan harfiah ini juga mempertahankan metafora dan kesejajaran baris.
- source_word: רְשָׁעִים
  choice: orang-orang jahat
  rationale: Bentuk jamak ini menunjuk kepada mereka yang bercirikan kejahatan; pilihan ini jelas dan alami bagi pembaca modern.
- source_word: יִרְטֵנִי
  choice: menghempaskan aku
  rationale: Kata kerja yang langka dan sulit ini tampaknya menyatakan tindakan melempar atau mencampakkan dengan keras. 'Menghempaskan' mempertahankan daya tindakannya tanpa menentukan arah yang tidak dinyatakan.
theological_decisions:
- issue: Rujukan אֵל
  choice: Ayub menyatakan bahwa Allah yang menyerahkannya kepada orang fasik.
  alternative: Seorang yang perkasa menyerahkannya.
  rationale: Dalam kitab Ayub, אֵל lazim merujuk kepada Allah; konteks keluhan ini juga menempatkan Allah sebagai pelaku tindakan tersebut. Ketegangan teologis dalam ucapan Ayub dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel teks Ibrani dipertahankan. 'Ke dalam tangan' sengaja mempertahankan metafora kuasa, sedangkan catatan kaki menandai ketidakpastian kata kerja terakhir.
