  text: that he would arbitrate for a man with God[c][b][a], as a son of man does for his neighbor.
translation:
  language: id
  text: Kiranya ia memperjuangkan perkara seorang laki-laki di hadapan Allah[a], seperti seorang anak manusia[b] memperjuangkan perkara sesamanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membela seorang laki-laki terhadap Allah” atau “memohon bagi seorang laki-laki kepada Allah”. Kata kerja Ibrani dapat berarti memutuskan, menjadi penengah, membuktikan, atau memperjuangkan suatu perkara.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak manusia”; di sini ungkapan ini berarti seorang manusia dan tidak harus merupakan gelar mesianik.
    reason: lexical_alternative
  - marker: c
    text: Atau, “sahabatnya” atau “rekannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: Kiranya ia memperjuangkan perkara
  rationale: 'Bentuk Hifil dari יכח dalam konteks ini bernuansa hukum: mengajukan, membela, atau memperkarakan suatu perkara. Ungkapan ini mempertahankan peran juridis tanpa menyempitkannya menjadi teguran atau putusan netral seorang penengah. Kata ganti “ia” mempertahankan subjek maskulin tunggal yang tidak disebutkan secara eksplisit dalam konteks dekat.'
- source_word: לְגֶבֶר
  choice: seorang laki-laki
  rationale: גֶּבֶר menunjuk kepada seorang laki-laki dan di sini berfungsi sebagai pihak yang perkaranya diperjuangkan. Terjemahan ini mempertahankan bentuk maskulin sumber, meskipun konteksnya menyangkut keadaan manusia di hadapan Allah.
- source_word: עִם אֱלוֹהַּ
  choice: di hadapan Allah
  rationale: עִם secara dasar berarti “dengan”, tetapi dalam konteks perselisihan hukum dapat menunjuk kepada pihak yang dihadapi. “Di hadapan Allah” terdengar alami dalam bahasa Indonesia dan mempertahankan latar hukum tanpa memaksakan gagasan seorang arbiter netral di antara dua pihak.
- source_word: וּבֶן אָדָם
  choice: seperti seorang anak manusia
  rationale: בֶּן־אָדָם secara harfiah berarti “anak manusia” dan di sini merupakan ungkapan bagi seorang manusia, sejajar dengan גֶּבֶר. Kata “seperti” menyatakan perbandingan eliptis yang tersirat dalam baris puisi.
- source_word: לְרֵעֵהוּ
  choice: perkara sesamanya
  rationale: רֵעַ dapat berarti sesama, sahabat, atau rekan. “Sesamanya” cukup luas dan alami, sedangkan prefiks ל dipahami secara benefaktif, sejajar dengan לְגֶבֶר.
theological_decisions:
- issue: Kemungkinan pembacaan mesianik atas בֶּן־אָדָם
  choice: Mempertahankan “anak manusia” sebagai ungkapan biasa bagi manusia dan menuliskannya dengan huruf kecil.
  alternative: Menerjemahkannya sebagai gelar “Anak Manusia” atau secara dinamis sebagai “manusia”.
  rationale: Dalam ayat ini בֶּן־אָדָם berada dalam paralelisme puitis dengan גֶּבֶר dan tidak harus merupakan gelar mesianik. Huruf kecil mencegah masuknya pembacaan kristologis yang tidak dinyatakan oleh konteks, sementara terjemahan harfiah mempertahankan citra Ibrani.
- issue: Peran tokoh yang memperjuangkan perkara
  choice: Memakai “ia” tanpa menjelaskan identitas atau menjadikannya arbiter netral.
  alternative: Menambahkan “seorang penengah” atau mengidentifikasinya sebagai tokoh ilahi tertentu.
  rationale: Bentuk verba menyatakan subjek maskulin tunggal, tetapi identitasnya tidak disebutkan secara eksplisit dalam ayat ini. Terjemahan mempertahankan ketidakjelasan dan kerinduan hukum-teologis dalam ucapan Ayub.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada puitis dan bermartabat. Pengulangan “memperjuangkan perkara” dipertahankan untuk memperjelas elipsis pada baris kedua serta menjaga paralelisme. “Ia” tidak diberi huruf kapital agar identitas subjek yang tidak dinyatakan tidak ditentukan secara teologis.
