base_translation:
  language: en
  yaml_path: translation/ot/job/016/006.yaml
  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: id
  text: Jika aku berbicara, rasa sakitku tidak berkurang; jika aku menahan diri, apa yang beranjak dariku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang pergi dariku?” Bahasa Ibraninya ringkas dan mungkin menyiratkan, “bagian mana dari rasa sakitku yang meninggalkanku?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: Jika aku berbicara
  rationale: אִם memperkenalkan kondisi, sedangkan bentuk orang pertama אֲדַבְּרָה paling alami diterjemahkan dengan kala kini dalam konstruksi bersyarat bahasa Indonesia.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: rasa sakitku tidak berkurang
  rationale: Nifal יֵחָשֵׂךְ secara harfiah menyatakan sesuatu yang ditahan atau dikekang; bersama כְּאֵבִי, ungkapan alami ini menyampaikan bahwa rasa sakit itu tidak mereda tanpa mempersempitnya menjadi sakit jasmani atau batin saja.
- source_word: וְאַחְדְּלָה
  choice: jika aku menahan diri
  rationale: חדל berarti berhenti atau menahan diri. Konteks paralel menyiratkan menahan diri dari berbicara, tetapi objek itu tidak ditambahkan agar keringkasan teks Ibrani tetap terjaga.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: apa yang beranjak dariku?
  rationale: הלך dengan מן dapat berarti pergi atau beranjak dari seseorang. Terjemahan ini mempertahankan pertanyaan eliptis dan tidak secara eksplisit memasukkan 'rasa sakit' sebagai subjek yang hanya tersirat.
theological_decisions: []
