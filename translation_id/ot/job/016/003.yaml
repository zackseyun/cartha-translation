  text: Is there no end to windy words? Or what provokes you[a], that you answer this way?
translation:
  language: id
  text: Tidak adakah akhir bagi kata-kata kosong? Atau apa yang mendorongmu[a] untuk menjawab?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “apa yang memberanikanmu untuk menjawab?”'
    reason: Alternatif leksikal bagi יַמְרִיצְךָ; verba ini juga dapat dipahami dalam arti memberi keberanian atau dorongan.
lexical_decisions:
- source_word: הֲקֵץ
  choice: Tidak adakah akhir
  rationale: Nomina קֵץ berarti ‘akhir’ atau ‘batas’. Dalam konteks keluhan Ayub, bentuk tanya ini bersifat retoris; ‘Tidak adakah akhir’ menyampaikan kejengkelannya secara alami dalam bahasa Indonesia.
- source_word: לְדִבְרֵי רוּחַ
  choice: bagi kata-kata kosong
  rationale: Secara harfiah frasa ini berarti ‘bagi perkataan-perkataan angin’. Dalam konteksnya, angin menggambarkan ucapan yang hampa dan tidak berbobot. ‘Kata-kata kosong’ menyampaikan idiom itu dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אוֹ
  choice: Atau
  rationale: Konjungsi disjungtif ini memperkenalkan pertanyaan retoris kedua.
- source_word: מַה
  choice: apa
  rationale: Kata tanya ini menanyakan hal yang menggerakkan atau mendorong lawan bicara untuk menjawab.
- source_word: יַמְרִיצְךָ
  choice: yang mendorongmu
  rationale: Bentuk verba ini dapat menunjuk pada sesuatu yang menggerakkan, menghasut, atau memberi dorongan untuk bertindak. ‘Mendorongmu’ sesuai dengan nada perdebatan tanpa menentukan apakah dorongan itu berupa gangguan atau keberanian; kemungkinan ‘memberanikanmu’ dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sehingga
  rationale: Di sini כִּי menghubungkan dorongan dengan respons yang dihasilkannya. ‘Sehingga’ menghasilkan susunan bahasa Indonesia yang alami.
- source_word: תַעֲנֶה
  choice: engkau menjawab seperti ini
  rationale: Verba ענה berarti ‘menjawab’ atau ‘menanggapi’. Tambahan kontekstual ‘seperti ini’ memperjelas bahwa Ayub mempersoalkan cara lawan bicaranya menjawab, tanpa mengubah isi dasar pertanyaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina tunggal ‘engkau/-mu’ dipertahankan karena Ayub sedang menyapa satu lawan bicara. Metafora Ibrani ‘perkataan angin’ disampaikan secara idiomatis sebagai ‘kata-kata kosong’ agar segera dipahami pembaca umum.
