base_translation:
  language: en
  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: id
  text: Para pemanah-Nya mengelilingi aku.[a] Ia membelah ginjalku[b] tanpa belas kasihan; Ia menumpahkan empeduku ke tanah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang besar-Nya” atau “para pemimpin-Nya.” Bentuk Ibraninya sulit; “para pemanah-Nya” sesuai dengan gambaran serangan dalam ayat ini dan konteks sekitarnya.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “ginjalku.” Dalam ungkapan Ibrani, ginjal dapat juga melambangkan batin atau diri seseorang yang terdalam.
    reason: cultural_note
  - marker: c
    text: Atau “cairan empeduku”; sebagian orang memahaminya secara kiasan sebagai “kepahitanku,” tetapi makna jasmani sesuai dengan gambaran kekerasan dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: mengelilingi
  rationale: Bentuk jamak dari סבב menggambarkan gerakan para penyerang yang mengepung Ayub; “mengelilingi” alami dan tetap mempertahankan citra serangan.
- source_word: רַבָּיו
  choice: para pemanah-Nya
  rationale: Bentuk Ibrani ini sulit dan dapat dipahami sebagai “orang-orang besar-Nya” atau “para pemimpin-Nya.” Dalam konteks serangan dan pelukaan tubuh, pemaknaan tradisional “para pemanah-Nya” paling padu, tetapi alternatifnya dicatat dalam catatan kaki.
- source_word: יְפַלַּח
  choice: membelah
  rationale: Bentuk Piel dari פלח menyampaikan tindakan merobek atau membelah dengan keras. “Membelah” mempertahankan gambaran jasmani yang tajam.
- source_word: כִּלְיוֹתַי
  choice: ginjalku
  rationale: Kata ini secara konkret berarti “ginjal.” Bagian tubuh tersebut dipertahankan dalam teks utama agar bahasa puisi Ibrani tidak dilunakkan menjadi gagasan abstrak.
- source_word: וְלֹא יַחְמוֹל
  choice: tanpa belas kasihan
  rationale: Ungkapan ini menyampaikan bahwa pelaku tidak menahan diri atau menunjukkan belas kasihan; rumusan Indonesia ini ringkas dan wajar dalam rangkaian tindakan puitis.
- source_word: יִשְׁפֹּךְ
  choice: menumpahkan
  rationale: Kata שפך berarti menuangkan atau menumpahkan. Dalam gambaran organ tubuh yang terluka, “menumpahkan” merupakan pilihan yang paling alami.
- source_word: מְרֵרָתִי
  choice: empeduku
  rationale: Kata ini dapat menunjuk pada empedu atau cairan pahit dan berhubungan dengan gagasan kepahitan. Makna jasmani “empedu” paling sesuai dengan citra kekerasan dalam ayat ini.
theological_decisions:
- issue: Citra antropologis dalam bahasa puitis tentang penderitaan
  choice: Mempertahankan istilah tubuh yang konkret, yaitu “ginjal” dan “empedu,” dalam teks utama.
  alternative: Menggunakan ungkapan tafsiran seperti “bagian terdalam diriku” dan “kepahitanku.”
  rationale: Ayat ini melukiskan penderitaan Ayub dengan gambaran anatomis yang sangat kuat. Istilah konkret mempertahankan daya puisi Ibrani dan tidak mengubahnya menjadi tafsiran psikologis.
- issue: Identitas pelaku dalam peralihan dari bentuk jamak ke tunggal
  choice: Menerjemahkan רַבָּיו sebagai pasukan milik Allah (“para pemanah-Nya”), lalu mempertahankan Allah sebagai pelaku tunggal dengan “Ia.”
  alternative: Memahami seluruh tindakan sebagai tindakan para penyerang secara kolektif, atau menerjemahkan רַבָּיו sebagai “orang-orang besar-Nya/para pemimpin-Nya.”
  rationale: Teks Ibrani beralih dari verba jamak “mengelilingi” kepada verba tunggal “membelah” dan “menumpahkan.” Terjemahan mempertahankan peralihan gramatikal itu tanpa menghapus ketegangan puitisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis digunakan tanpa mengurangi kekerasan citra asli. Huruf kapital pada pronomina “-Nya” dan “Ia” menandai bahwa Allah adalah pelaku yang dimaksud dalam konteks. Struktur jamak lalu tunggal dipertahankan melalui “para pemanah-Nya” dan “Ia.”
