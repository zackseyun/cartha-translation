  to: Aku hidup tenteram, tetapi dia mengguncangku dengan keras[a]; dia mencengkeram tengkukku dan meremukkan aku; dia menempatkan aku sebagai sasarannya.
  rationale: Hanya klausa terakhir direvisi demi kelancaran bahasa Indonesia. "Menempatkan" mewakili tindakan kausatif memosisikan dalam ויקימני dalam konteks metafora target, sedangkan "sasarannya" menerjemahkan hubungan yang ditandai לוֹ tanpa menjelaskan siapa pelakunya atau maksudnya lebih jauh.
