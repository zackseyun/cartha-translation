base_translation:
  language: en
  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: id
  text: Aku hidup tenteram, tetapi dia mengguncangku dengan keras[a]; dia mencengkeram tengkukku dan meremukkan aku; dia menempatkan aku sebagai sasarannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verba Ibrani yang diterjemahkan “mengguncangku dengan keras” jarang dipakai dan mungkin juga berarti “menghancurkan aku”, “mencabik-cabik aku”, atau “membuatku gemetar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: hidup tenteram
  rationale: Adjektiva ini menyatakan keadaan tenang, aman, dan tidak terusik. Ungkapan ini alami dalam bahasa Indonesia dan menonjolkan kontras dengan kekerasan yang menyusul.
- source_word: וַיְפַרְפְּרֵנִי
  choice: mengguncangku dengan keras
  rationale: Verba langka ini menggambarkan gangguan fisik yang hebat; makna tepatnya tidak pasti. Pilihan ini mempertahankan gambaran tindakan keras tanpa menyamakannya dengan verba penghancuran berikutnya.
- source_word: וְאָחַז
  choice: mencengkeram
  rationale: Dalam konteks serangan, kata ini berarti memegang erat atau menangkap dengan paksa. 'Mencengkeram' menyampaikan daya paksa tersebut secara wajar.
- source_word: בְּעָרְפִּי
  choice: tengkukku
  rationale: Kata עֹרֶף secara khusus menunjuk bagian belakang leher atau tengkuk. Padanan ini tepat dan alami dalam bahasa Indonesia.
- source_word: וַיְפַצְפְּצֵנִי
  choice: meremukkan aku
  rationale: Verba intensif yang langka ini menyatakan penghancuran atau pemecahan dengan kekerasan. 'Meremukkan' mempertahankan intensitasnya tanpa ungkapan Indonesia yang berlebihan.
- source_word: וַיְקִימֵנִי
  choice: menegakkan aku
  rationale: Bentuk kausatif dari קום berarti membuat berdiri atau menempatkan dalam posisi tegak. Dalam metafora sasaran, 'menegakkan aku' mempertahankan citra konkret teks Ibrani.
- source_word: לוֹ
  choice: baginya
  rationale: Pronomina ini menyatakan bahwa Ayub ditempatkan sebagai sasaran untuk si penyerang. 'Baginya' mempertahankan bentuk sederhana teks tanpa memperluasnya menjadi maksud atau kepentingan tertentu.
- source_word: לְמַטָּרָה
  choice: sebagai sasaran
  rationale: Nomina ini menunjuk sasaran atau tanda yang dibidik. Pilihan ini jelas dan mempertahankan metafora serangan.
theological_decisions:
- issue: Rujukan subjek maskulin orang ketiga sepanjang ayat
  choice: Diterjemahkan sebagai 'dia' tanpa menyebut identitasnya secara eksplisit.
  alternative: Allah sebagai penyerang yang tersirat; atau seorang lawan yang tidak disebutkan.
  rationale: Dalam konteks perkataan Ayub, rujukannya mengarah kepada Allah, tetapi ayat Ibrani ini hanya memakai bentuk verba dan pronomina orang ketiga. Terjemahan mempertahankan ketegangan retoris dan tidak menambahkan nama yang tidak muncul dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang bermartabat. Rangkaian verba keras dipertahankan, dan 'tengkuk' dipilih untuk ketepatan anatomi serta kekuatan citra.
