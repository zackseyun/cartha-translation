  text: גַּ֤ם אָנֹכִי֮ כָּ/כֶ֪ם אֲדַ֫בֵּ֥רָה ל֤וּ יֵ֪שׁ נַפְשְׁ/כֶ֡ם תַּ֤חַת נַפְשִׁ֗/י אַחְבִּ֣ירָה עֲלֵי/כֶ֣ם בְּ/מִלִּ֑ים וְ/אָנִ֥יעָה עֲ֝לֵי/כֶ֗ם בְּמ֣וֹ רֹאשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: id
  text: Aku pun dapat berbicara seperti kalian, seandainya kalian berada di tempatku.[a] Aku dapat merangkai kata-kata terhadap kalian[b] dan menggelengkan kepala kepada kalian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seandainya diri kalian berada di tempat diriku.” Kata Ibrani נֶפֶשׁ dapat berarti diri, pribadi, hidup, atau jiwa, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menumpuk kata-kata terhadap kalian.” Kata kerja Ibraninya dapat menggambarkan tindakan menggabungkan, merangkai, atau menumpuk kata-kata.
    reason: lexical_alternative
  - marker: c
    text: Menggelengkan kepala kepada seseorang merupakan gerak tubuh yang menyatakan ejekan atau penghinaan dalam konteks ini.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Aku pun
  rationale: Menjaga penegasan pada diri Ayub sekaligus menunjukkan bahwa ia membalas kemungkinan tindakan teman-temannya.
- source_word: כָכֶם אֲדַבֵּרָה
  choice: dapat berbicara seperti kalian
  rationale: Bentuk verba dalam konteks pengandaian menyatakan kemampuan atau kemungkinan; frasa ini juga mempertahankan perbandingan dengan cara bicara para sahabat.
- source_word: לוּ
  choice: seandainya
  rationale: Menandai keadaan hipotetis yang berlawanan dengan kenyataan secara alami dalam bahasa Indonesia.
- source_word: יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: kalian berada di tempatku
  rationale: נֶפֶשׁ di sini menunjuk pada diri atau pribadi. Ungkapan idiomatis Indonesia ini menyampaikan pertukaran keadaan tanpa memaksakan arti antropologis khusus pada 'jiwa'; cakupan harfiahnya dicatat dalam catatan kaki.
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: merangkai kata-kata untuk menyerang kalian
  rationale: Verba חָבַר menggambarkan tindakan menggabungkan atau menyusun. 'Merangkai kata-kata' mempertahankan gambaran itu, sedangkan 'untuk menyerang kalian' menyampaikan arah bermusuhan dari עֲלֵיכֶם dalam konteks.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: dan menggeleng-gelengkan kepala terhadap kalian
  rationale: Mengungkapkan gerakan kepala secara jelas dan mempertahankan bahwa gerak tersebut diarahkan kepada para sahabat; makna budayanya sebagai ejekan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam pertukaran keadaan
  choice: Diterjemahkan secara idiomatis sebagai 'kalian berada di tempatku'.
  alternative: jiwa kalian berada di tempat jiwaku; hidup kalian menggantikan hidupku
  rationale: Dalam konteks ini נֶפֶשׁ dapat berarti diri, pribadi, atau hidup, bukan harus menunjuk pada unsur tak berjasad. Terjemahan utama menghindari penetapan antropologi tertentu, sedangkan kemungkinan leksikal tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk jamak 'kalian' dipakai karena Ayub berbicara kepada beberapa sahabat. Struktur pengandaian dibuat alami, sementara pengulangan dan nada sindiran dalam bahasa Ibrani tetap dipertahankan.
