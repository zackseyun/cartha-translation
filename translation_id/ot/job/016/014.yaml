  text: Ia menerobosku dengan dobrakan demi dobrakan[a]; Ia menyerbu aku seperti seorang pejuang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “Ia menjebolku, dobrakan demi dobrakan.” Pengulangan dalam bahasa Ibrani menegaskan terjadinya dobrakan yang berturut-turut.'
    reason: lexical_alternative
  - marker: b
