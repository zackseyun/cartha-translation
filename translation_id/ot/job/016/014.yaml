lexical_decisions:
- source_word: יִפְרְצֵנִי
  choice: Ia menerjangku
  rationale: Kata kerja פרץ menggambarkan tindakan membobol atau menerobos dengan keras. “Menerjangku” mempertahankan kekerasan dan gerak serangan itu dalam bahasa Indonesia yang alami.
- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: serangan demi serangan
  rationale: Ungkapan Ibrani mengulang פֶרֶץ untuk menyatakan dobrakan yang datang berturut-turut. “Serangan demi serangan” menyampaikan penumpukan serangan secara jelas, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: יָרֻץ עָלַי
  choice: Ia menyerbu aku
  rationale: Secara harfiah berarti “ia berlari ke arah/menyerang aku.” Dalam konteks gerak bermusuhan, “menyerbu aku” menyampaikan kecepatan dan agresi tanpa terasa kaku.
- source_word: כְגִבּוֹר
  choice: seperti seorang pejuang
  rationale: גִּבּוֹר dapat berarti orang perkasa, pejuang, atau pahlawan. “Pejuang” cocok dengan gambaran serbuan dalam baris ini dan tidak menyiratkan bahwa tokoh tersebut dipuji secara moral.
theological_decisions:
- issue: Subjek maskulin tunggal tidak disebutkan namanya dalam ayat ini
  choice: Mempertahankan kata ganti “Ia” tanpa menambahkan “Allah”
  alternative: Allah menerjangku
  rationale: Bahasa Ibrani hanya memakai bentuk verba orang ketiga maskulin tunggal. Konteks dapat menunjukkan Allah, tetapi terjemahan tidak perlu menambahkan nama yang tidak terdapat dalam ayat.
translation_notes:
  register: Puisi keluhan yang kuat dan langsung. Diksi dibuat modern serta mudah dipahami, sambil mempertahankan gambaran serangan berulang dan serbuan seorang pejuang.
