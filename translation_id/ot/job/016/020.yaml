translation:
  language: id
  text: Sahabat-sahabatku adalah pengejekku[a]; mataku mencucurkan air mata kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sahabat-sahabatku adalah para perantaraku atau pembelaku.” Kata Ibrani מְלִיצַי dipahami oleh sebagian orang dalam arti positif, tetapi dalam konteks keluhan Ayub, arti “pengejekku” lebih sesuai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלִיצַי
  choice: mengejek aku
  rationale: Bentuk ini dapat menunjuk kepada orang yang mengejek atau mencemooh. Dalam konteks keluhan Ayub terhadap para sahabatnya, makna adversatif paling sesuai; susunan verbal ini lebih alami dalam bahasa Indonesia daripada sebutan nominal seperti 'pengejekku'.
- source_word: רֵעָי
  choice: sahabat-sahabatku
  rationale: רֵעַ berarti sahabat atau teman. 'Sahabat-sahabatku' alami dan mempertahankan ironi bahwa orang-orang yang seharusnya mendukung Ayub justru mengejeknya.
- source_word: אֶל אֱלוֹהַ
  choice: kepada Allah
  rationale: אֶל menyatakan arah, sedangkan אֱלוֹהַ adalah sebutan tunggal bagi Allah yang sering dipakai dalam kitab Ayub. 'Kepada Allah' mempertahankan arah tangisan Ayub.
- source_word: דָּלְפָה
  choice: mencucurkan air mata
  rationale: Kata kerja ini secara harfiah menggambarkan cairan yang menetes atau mengalir. Bersama 'mataku' sebagai subjek, ungkapan ini menyampaikan tangisan terus-menerus secara alami.
- source_word: עֵינִי
  choice: mataku
  rationale: Teks Ibrani memakai bentuk tunggal. Bentuk tunggal dipertahankan demi citra puitis dan kedekatan dengan sumber.
theological_decisions:
- issue: Apakah מְלִיצַי bermakna negatif atau positif
  choice: mengejek aku
  alternative: menjadi perantara atau pembelaku
  rationale: Akar katanya dapat dipahami sebagai ejekan, tetapi sebagian penafsiran mengaitkannya dengan perantaraan. Konteks keluhan Ayub mendukung makna negatif, sementara kemungkinan positif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa terasa kuno. Bentuk tunggal 'mataku' dan arah 'kepada Allah' dipertahankan dari bahasa Ibrani; ungkapan 'mencucurkan air mata' dipilih agar citra tetesan cairan tetap jelas dan alami.
