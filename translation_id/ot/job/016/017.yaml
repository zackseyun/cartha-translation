  text: although there is no violence in my hands[b][a], and my prayer is pure.
translation:
  language: id
  text: Meskipun tidak ada kekerasan di tanganku,[a] dan doaku murni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sebab tidak ada kekerasan di tanganku.” Kata depan Ibrani dapat dipahami dengan lebih dari satu cara; teks utama mengikuti makna konsesif berdasarkan konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersih.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: meskipun
  rationale: Dalam konteks pembelaan Ayub, kata depan ini paling wajar dipahami secara konsesif. Namun, kemungkinan kausal tetap dipertahankan dalam catatan kaki.
- source_word: לֹא חָמָס
  choice: tidak ada kekerasan
  rationale: Ungkapan ini menyatakan tidak adanya tindakan kekerasan atau kejahatan; “kekerasan” mempertahankan gambaran konkret dan daya moral kata Ibrani.
- source_word: בְּכַפָּי
  choice: di tanganku
  rationale: Terjemahan ini dekat dengan citra harfiah bahasa Ibrani dan menunjuk pada perbuatan serta tanggung jawab Ayub sendiri.
- source_word: וּתְפִלָּתִי
  choice: dan doaku
  rationale: תְּפִלָּה adalah istilah umum untuk doa; “doaku” alami dalam bahasa Indonesia dan sesuai dengan konteks perkataan Ayub kepada Allah.
- source_word: זַכָּה
  choice: murni
  rationale: Kata sifat ini berarti bersih atau murni. “Murni” sesuai dengan “doa” dan mempertahankan nuansa ketulusan moral tanpa menjadikannya klaim bahwa Ayub sama sekali tidak berdosa.
theological_decisions:
- issue: Klaim Ayub mengenai ketidakbersalahannya
  choice: Ayub menyatakan bahwa tangannya bebas dari kekerasan dan bahwa doanya murni.
  alternative: Memahaminya sebagai klaim mutlak bahwa Ayub sepenuhnya tanpa dosa, atau hanya sebagai pernyataan tentang kemurnian ritual.
  rationale: Teks menyajikan pembelaan Ayub terhadap tuduhan tersirat bahwa penderitaannya disebabkan oleh kejahatan yang dilakukannya. Terjemahan mempertahankan kekuatan klaim itu dalam lingkup langsung ayat tanpa mengubahnya menjadi doktrin tentang kesempurnaan moral mutlak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk tunggal “tanganku” alami dalam bahasa Indonesia sekaligus mempertahankan citra Ibrani yang secara harfiah memakai bentuk jamak untuk telapak tangan.
