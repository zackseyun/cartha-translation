  text: כִּֽי שְׁנ֣וֹת מִסְפָּ֣ר יֶאֱתָ֑יוּ וְ/אֹ֖רַח לֹא אָשׁ֣וּב אֶהֱלֹֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: id
  text: Sebab tahun-tahun yang tinggal sedikit akan tiba,[a] lalu aku akan menempuh jalan yang darinya aku tidak akan kembali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tahun-tahun jumlah”; ungkapan ini berarti tahun-tahun yang sedikit atau terbatas jumlahnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan aku akan pergi ke jalan yang tidak akan kukembali.” Maksudnya, “jalan yang darinya aku tidak akan kembali”; ungkapan ini menunjuk pada perjalanan menuju kematian yang tidak dapat dibalikkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi pernyataan Ayub sebelumnya dan mempertahankan hubungan kausal secara alami dalam bahasa Indonesia.
- source_word: שְׁנוֹת מִסְפָּר
  choice: hanya beberapa tahun lagi
  rationale: Secara harfiah berarti 'tahun-tahun yang terhitung', suatu ungkapan untuk jumlah tahun yang sedikit atau terbatas; 'hanya beberapa tahun lagi' menyampaikan singkatnya waktu yang tersisa.
- source_word: יֶאֱתָיוּ
  choice: akan berlalu
  rationale: Verba ini secara dasar berarti 'akan datang/tiba'. Dalam kaitannya dengan tahun-tahun yang tersisa sebelum perjalanan terakhir Ayub, bahasa Indonesia lebih alami menyatakannya sebagai tahun-tahun yang akan berlalu; bacaan harfiahnya dicatat dalam catatan kaki.
- source_word: וְאֹרַח
  choice: lalu ... jalan
  rationale: אֹרַח berarti jalan atau jalur dan di sini menjadi metafora perjalanan menuju kematian. 'Jalan' mempertahankan gambaran konkretnya, sedangkan 'lalu' menyampaikan urutan yang tersirat oleh konteks.
- source_word: לֹא אָשׁוּב
  choice: yang tidak akan membawaku kembali
  rationale: Secara harfiah, 'aku tidak akan kembali'. Rumusan Indonesia ini menghubungkan klausa relatif dengan 'jalan' secara wajar tanpa menghilangkan ketakterbalikan perjalanan tersebut; bentuk harfiah dicatat sebagai alternatif.
- source_word: אֶהֱלֹךְ
  choice: aku akan menempuh
  rationale: Bentuk imperfek Qal dari הלך berarti 'aku akan pergi/berjalan'. Dengan objek 'jalan', 'menempuh' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan metafora perjalanan.
theological_decisions:
- issue: Rujukan jalan yang tidak memungkinkan kepulangan
  choice: Metafora kematian dibiarkan tersirat dalam teks utama.
  alternative: Menuliskan secara eksplisit 'aku akan mati' atau 'jalan menuju kematian'.
  rationale: Bahasa Ibrani memakai gambaran perjalanan yang tidak dapat dibalikkan dan tidak menyebut kematian secara langsung; terjemahan mempertahankan metafora serta ketegangan puitis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kata 'aku' sesuai dengan ujaran pribadi Ayub. Susunan kalimat dibuat alami bagi pembaca umum, sementara ungkapan harfiah dan metafora kematian dijelaskan dalam catatan kaki.
