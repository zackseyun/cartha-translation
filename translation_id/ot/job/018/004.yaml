  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: id
  text: Engkau yang mencabik-cabik dirimu dalam amarahmu—masakan bumi ditinggalkan demi engkau,[a] atau batu dipindahkan dari tempatnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bagian awal berbunyi, “Orang yang mencabik-cabik jiwanya dalam amarahnya.” Teks Ibrani dimulai dengan ungkapan partisipel orang ketiga, lalu beralih kepada sapaan langsung orang kedua.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: mencabik-cabik dirimu
  rationale: Partisipel Qal טֹרֵף menggambarkan tindakan mencabik atau mengoyak, sedangkan נֶפֶשׁ dapat menunjuk pada diri atau nyawa. Dalam konteks teguran langsung kepada Ayub, ungkapan ini secara alami menyampaikan amarah yang merusak diri.
- source_word: בְּאַפּוֹ
  choice: dalam amarahmu
  rationale: אַף secara harfiah dapat berarti 'hidung', tetapi lazim menjadi ungkapan untuk amarah. Bentuk orang kedua dipakai dalam teks utama agar selaras dengan sapaan langsung לְמַעַנְךָ, sementara pergeseran gramatikal Ibrani dijelaskan dalam catatan kaki.
- source_word: הַלְמַעַנְךָ
  choice: masakan ... demi engkau
  rationale: Partikel tanya הֲ dan לְמַעַן membentuk pertanyaan retoris tentang apakah tatanan dunia harus berubah karena Ayub. 'Masakan' menandai daya retoris, dan 'demi engkau' mempertahankan nuansa kepentingan pribadi.
- source_word: תֵּעָזַב אָרֶץ
  choice: bumi ditinggalkan
  rationale: אָרֶץ di sini paling mungkin berskala umum atau kosmis, sehingga 'bumi' lebih sesuai daripada 'negeri'. Bentuk Nifal תֵּעָזַב dipertahankan sebagai pasif, 'ditinggalkan'.
- source_word: וְיֶעְתַּק
  choice: dipindahkan
  rationale: Kata kerja עתק di sini berarti dipindahkan atau digeser dari tempatnya. Bentuk pasif Indonesia mempertahankan kesejajaran dengan 'ditinggalkan'.
- source_word: צוּר
  choice: gunung batu
  rationale: צוּר menunjuk pada batu besar, cadas, atau tebing batu. 'Gunung batu' menyampaikan sesuatu yang besar dan kukuh, serta tidak menimbulkan kesan bahwa kata ini merupakan gelar ilahi.
- source_word: מִמְּקֹמוֹ
  choice: dari tempatnya
  rationale: Akhiran maskulin tunggal merujuk pada צוּר. Dalam bahasa Indonesia, bentuk '-nya' secara alami berlaku bagi benda tak bernyawa.
theological_decisions:
- issue: Acuan dan daya retoris ayat
  choice: 'Bildad menegur Ayub secara langsung: amarah Ayub tidak akan membuat tatanan dunia berubah demi dirinya.'
  alternative: 'Mempertahankan orang ketiga pada pembukaan: ''Dia yang mencabik-cabik dirinya dalam amarahnya—masakan bumi ditinggalkan demi engkau ...?'''
  rationale: Bahasa Ibrani membuka dengan partisipel dan akhiran orang ketiga tunggal, lalu beralih secara eksplisit kepada orang kedua dalam לְמַעַנְךָ. Teks utama memakai sapaan orang kedua agar wajar dalam bahasa Indonesia, tetapi catatan kaki mempertahankan informasi tentang pergeseran gramatikal itu tanpa menghapus ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Mencabik-cabik' mempertahankan gambaran tajam dari kata Ibrani; 'masakan' mengungkapkan pertanyaan retoris dengan alami. Tanda pisah mempertahankan jeda antara seruan pembuka dan dua pertanyaan sejajar.
