base_translation:
  language: en
  yaml_path: translation/ot/job/018/010.yaml
  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: id
  text: Talinya tersembunyi di dalam tanah[a], dan perangkapnya ada di jalan setapak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tambangnya tersembunyi di dalam tanah, dan jeratnya ada di jalan setapak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמוּן
  choice: tersembunyi
  rationale: Partisip pasif dari טמן menyatakan keadaan sesuatu yang disembunyikan atau ditanam; “tersembunyi” mempertahankan nuansa statif-pasif secara wajar.
- source_word: בָּאָרֶץ
  choice: di dalam tanah
  rationale: Dalam konteks pemasangan perangkap, אֶרֶץ menunjuk pada tanah tempat tali disembunyikan, bukan wilayah atau negeri.
- source_word: חַבְלוֹ
  choice: talinya
  rationale: חבל dapat berarti tali atau tambang. “Tali” alami dalam bahasa Indonesia dan sesuai dengan perlengkapan perangkap tanpa menentukan bentuknya secara berlebihan.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: dan perangkapnya
  rationale: מַלְכֹּדֶת berarti perangkap atau jerat; “perangkap” merupakan padanan luas dan mudah dipahami, sementara “jerat” dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: עֲלֵי נָתִיב
  choice: ada di jalan setapak
  rationale: Frasa ini menunjukkan lokasi perangkap pada jalur yang dilalui. Penambahan “ada” menghasilkan kalimat Indonesia yang alami, sedangkan “jalan setapak” secara tepat menyampaikan נָתִיב.
