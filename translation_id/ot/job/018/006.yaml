  yaml_path: translation/ot/job/018/006.yaml
  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: id
  text: Terang di dalam kemahnya menjadi gelap, dan pelitanya di atas dia[a] padam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “atas dia.” Preposisi Ibrani dapat menyatakan posisi pada atau di atas seseorang; ungkapan ini mungkin menggambarkan pelita yang berada di atas orang fasik itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: terang
  rationale: Kata ini secara konkret berarti ‘terang’ atau ‘cahaya’. ‘Terang’ menghasilkan ungkapan puitis yang alami dalam bahasa Indonesia dan mempertahankan gambaran penerangan di tempat tinggal.
- source_word: חָשַׁךְ
  choice: menjadi gelap
  rationale: Verba ini menyatakan perubahan menuju keadaan gelap. ‘Menjadi gelap’ mempertahankan nuansa tersebut, bukan sekadar menyatakan keadaan statis.
- source_word: בְּאָהֳלוֹ
  choice: di dalam kemahnya
  rationale: אָהֶל secara harfiah berarti ‘kemah’ dan secara puitis dapat mewakili tempat tinggal atau rumah tangga seseorang. ‘Kemah’ mempertahankan gambaran konkret bahasa Ibrani.
- source_word: וְנֵרוֹ
  choice: dan pelita
  rationale: נֵר menunjuk pada pelita atau nyala pelita. ‘Pelita’ mempertahankan benda konkret pada baris kedua dan cocok dengan ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Preposisi עַל dapat berarti ‘di atas’, ‘pada’, atau ‘atas’. Dalam gambaran ruang tempat tinggal, ‘di atasnya’ secara alami menggambarkan posisi pelita terhadap orang itu tanpa menghapus keluwesan ungkapan sumber.
- source_word: יִדְעָךְ
  choice: padam
  rationale: Verba ini dipakai untuk api atau pelita yang padam. ‘Padam’ ringkas, alami, dan mempertahankan kesejajaran puitis dengan terang yang menjadi gelap.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan dua baris gambaran terang–pelita dipertahankan, demikian pula citra konkret ‘kemah’. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya, yaitu ‘di atasnya’.
