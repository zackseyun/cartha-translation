  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: id
  text: Sungguh, inilah tempat-tempat kediaman orang lalim, dan inilah tempat orang yang tidak mengenal Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menegaskan kesimpulan ucapan Bildad, bukan membatasi dengan arti “hanya”.
- source_word: אֵלֶּה
  choice: beginilah
  rationale: Demonstrativa jamak ini menunjuk kembali kepada berbagai kengerian yang baru diuraikan; dalam kalimat rangkuman bahasa Indonesia, “beginilah” menyampaikan fungsi deiktis-predikatifnya secara alami.
- source_word: מִשְׁכְּנוֹת
  choice: tempat-tempat kediaman
  rationale: Bentuk jamak ini menunjuk tempat tinggal secara luas tanpa mempersempitnya menjadi kemah.
- source_word: עַוָּל
  choice: orang lalim
  rationale: Kata ini menunjuk orang yang dicirikan oleh kejahatan atau ketidakadilan; “lalim” mempertahankan nuansa moral tersebut dengan gaya yang ringkas dan bermartabat.
- source_word: וְזֶה
  choice: dan inilah
  rationale: Gabungan konjungsi dan demonstrativa memperkenalkan klausa sejajar yang merangkum nasib orang tersebut.
- source_word: מְקוֹם
  choice: tempat
  rationale: Padanan langsung ini mempertahankan kesejajaran dengan tempat-tempat kediaman pada klausa pertama.
- source_word: לֹא יָדַע אֵל
  choice: orang yang tidak mengenal Allah
  rationale: Ungkapan ini tetap memakai verba “mengenal,” sehingga cakupan relasional dan moralnya terpelihara tanpa dijabarkan secara doktrinal.
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks kitab Ayub, אֵל merujuk kepada Allah; “Allah” adalah padanan baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna “tidak mengenal Allah”
  choice: Mempertahankan ungkapan “tidak mengenal Allah,” yang dapat mencakup pengenalan relasional dan moral.
  alternative: Memahaminya hanya sebagai tidak mengetahui keberadaan Allah.
  rationale: Terjemahan literal-alami ini menjaga bobot teologis verba “mengenal” dan tidak mempersempitnya menjadi ketidaktahuan intelektual semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang lalim” dipilih sebagai ungkapan yang mudah dipahami sekaligus mempertahankan nuansa ketidakadilan dan kejahatan. Tidak diperlukan catatan kaki karena tidak ada alternatif tekstual atau leksikal yang harus ditampilkan agar ambiguitas penting tetap terjaga.
