base_translation:
  language: en
  yaml_path: translation/ot/job/018/015.yaml
  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: id
  text: 'Yang bukan miliknya berdiam di dalam kemahnya;[a]

    belerang ditaburkan di atas kediamannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani sulit dipastikan. Mungkin juga: “Belerang berdiam di kemahnya, yang bukan lagi miliknya,” atau, “Tidak ada lagi miliknya yang berdiam di kemahnya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: berdiam
  rationale: Bentuk ini berasal dari שכן, yang berarti ‘berdiam’ atau ‘menetap’. Subjek feminin tunggalnya tidak dinyatakan secara eksplisit sebelum verba, sehingga terjemahan tidak menentukan identitas penghuni itu secara berlebihan.
- source_word: בְּאָהֳלוֹ
  choice: di dalam kemahnya
  rationale: אֹהֶל secara konkret berarti ‘kemah’. Pilihan ini mempertahankan gambaran rumah tangga dalam puisi Ayub.
- source_word: מִבְּלִי לוֹ
  choice: yang bukan miliknya
  rationale: Ungkapan Ibrani ini eliptis dan menyatakan ketiadaan atau sesuatu yang tidak lagi berhubungan sebagai milik orang itu. Terjemahan ini mempertahankan ketidakjelasan sintaksis tanpa menambahkan identitas penghuni.
- source_word: יְזֹרֶה
  choice: ditaburkan
  rationale: Verba Piel dari זרה berarti ‘menaburkan’ atau ‘menghamburkan’. Bentuk pasif bahasa Indonesia menyampaikan pemakaian impersonalnya tanpa menciptakan pelaku yang tidak disebutkan.
- source_word: עַל נָוֵהוּ
  choice: di atas kediamannya
  rationale: נָוֶה dapat berarti tempat tinggal, kediaman, atau padang. Kesejajarannya dengan ‘kemahnya’ mendukung arti ‘kediamannya’ di sini.
- source_word: גָפְרִית
  choice: belerang
  rationale: גָפְרִית berarti sulfur atau belerang. ‘Belerang’ merupakan istilah Indonesia modern dan wajar serta mempertahankan citra penghukuman dan kehancuran.
theological_decisions:
- issue: Identitas subjek feminin תִּשְׁכּוֹן dan hubungan frasa מִבְּלִי לוֹ
  choice: Teks utama menyatakan bahwa ‘yang bukan miliknya’ berdiam di kemah orang fasik, tanpa menentukan apakah itu kehadiran asing atau belerang yang disebut kemudian.
  alternative: Belerang berdiam di kemahnya, yang bukan lagi miliknya; atau tidak ada lagi sesuatu miliknya yang tinggal di kemah itu.
  rationale: Sintaksis Ibrani sangat padat dan sulit. Bentuk verba feminin dapat dikaitkan dengan גָפְרִית (‘belerang’) yang muncul kemudian, sedangkan מִבְּלִי לוֹ dapat menunjuk pada sesuatu yang bukan miliknya atau pada kemah yang tidak lagi menjadi miliknya. Terjemahan utama dan catatan kaki mempertahankan ketegangan ini tanpa memilih tafsiran teologis secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. ‘Berdiam’, ‘kemah’, dan ‘kediaman’ mempertahankan citra konkret serta kesejajaran puisi Ibrani; susunan klausa mengikuti urutan teks sumber.
