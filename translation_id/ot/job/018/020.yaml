translation:
  language: id
  text: Orang-orang yang datang kemudian terperanjat karena harinya[a], dan orang-orang yang terdahulu[b] dicekam kengerian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “harinya”; kemungkinan besar hari malapetaka atau penghakiman yang menimpanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang yang belakangan ... orang-orang yang dahulu”; sebagian orang memahami pasangan ini secara geografis sebagai “orang-orang di barat ... orang-orang di timur.”
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “mereka mencengkeram kegentaran”; sebuah idiom untuk merasa sangat ngeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: melihat
  rationale: Dalam konteks reaksi emosional, preposisi ini menunjukkan hal yang menimbulkan keterkejutan. “Melihat” menyampaikan hubungan tersebut secara alami tanpa menjadikannya keterangan tempat.
- source_word: יוֹמוֹ
  choice: harinya
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa Ibrani dan tidak langsung membatasinya menjadi “nasib” atau “kehancuran”; konteks menunjuk pada hari malapetaka atau penghakiman yang menimpanya.
- source_word: נָשַׁמּוּ
  choice: terperanjat
  rationale: Kata kerja ini mengungkapkan keterkejutan mendalam yang bercampur rasa ngeri; “terperanjat” alami dan cukup kuat dalam bahasa Indonesia modern.
- source_word: אַחֲרֹנִים
  choice: orang-orang yang datang kemudian
  rationale: Makna temporal “orang-orang yang kemudian” paling langsung dalam pasangan paralel ini, meskipun kemungkinan pembacaan geografis tetap dicatat.
- source_word: וְקַדְמֹנִים
  choice: orang-orang yang terdahulu
  rationale: Pilihan ini mempertahankan kontras temporal dengan “yang datang kemudian” dan terdengar alami dalam bahasa Indonesia.
- source_word: אָחֲזוּ
  choice: dicekam
  rationale: Secara harfiah kata ini berarti “memegang” atau “mencengkeram”; bentuk pasif “dicekam” secara idiomatis menggambarkan emosi kuat yang menguasai seseorang.
- source_word: שָׂעַר
  choice: kengerian
  rationale: Nomina ini menunjuk pada rasa ngeri atau tubuh yang bergidik. “Kengerian” menyampaikan dampak emosionalnya dengan jelas, sementara gambaran yang lebih harfiah dijelaskan dalam catatan kaki.
