  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: id
  text: Kenangan tentang dia lenyap dari bumi,[a] dan tidak ada nama baginya di jalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kenangannya hilang dari negeri, dan tidak ada nama baginya di jalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹ
  choice: Kenangan tentang dia
  rationale: Nomina dari זכר berarti kenangan atau ingatan. Ungkapan ini alami dalam bahasa Indonesia dan menunjuk pada ingatan orang-orang tentang dirinya.
- source_word: אָבַד
  choice: lenyap
  rationale: Verba אבד dapat berarti binasa, hilang, atau lenyap. Karena subjeknya adalah kenangan, 'lenyap' paling alami sekaligus mempertahankan gambaran penghapusan total.
- source_word: מִנִּי אָרֶץ
  choice: dari bumi
  rationale: אֶרֶץ dapat berarti 'negeri' atau 'bumi'. Dalam konteks puitis tentang hilangnya seseorang secara menyeluruh, 'bumi' menyampaikan cakupan yang luas tanpa menutup alternatif 'negeri'.
- source_word: וְלֹא שֵׁם לוֹ
  choice: dan namanya tidak dikenal lagi
  rationale: Secara harfiah konstruksi ini berarti 'dan tidak ada nama baginya'. Dalam konteks kenangan dan ranah publik, maksudnya ialah tidak tersisanya nama atau reputasi yang dikenal; formulasi Indonesia ini menyampaikan makna tersebut secara alami.
- source_word: עַל־פְּנֵי חוּץ
  choice: di tempat umum
  rationale: חוּץ menunjuk ruang luar, jalan, atau ruang publik, sedangkan עַל־פְּנֵי memberi gambaran 'di atas permukaan/di seluruh'. 'Di tempat umum' menangkap fungsi sosial ruang itu dalam bahasa Indonesia modern.
