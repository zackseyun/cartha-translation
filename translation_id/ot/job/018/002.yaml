base_translation:
  language: en
  yaml_path: translation/ot/job/018/002.yaml
  text: How long will you keep setting traps with words? Understand[b][a], and afterward we will speak.
translation:
  language: id
  text: Sampai kapan kalian terus memasang jerat dengan kata-kata?[a] Mengertilah, lalu kita akan berbicara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sampai kapan kalian akan memberi batas pada kata-kata?” Frasa Ibraninya sulit; sebagian orang memahaminya sebagai keluhan tentang pembicaraan yang tak kunjung selesai, bukan tentang menjerat dengan kata-kata.
    reason: lexical_alternative
  - marker: b
    text: Atau “lalu marilah kita berbicara.” Kata kerja terakhir dapat dipahami sebagai ajakan maupun sebagai pernyataan tentang apa yang akan dilakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Sampai kapan
  rationale: Ungkapan tanya temporal ini secara idiomatis menyatakan keluhan, “sampai kapan?”
- source_word: תְּשִׂימוּן
  choice: kalian terus memasang
  rationale: Bentuk orang kedua jamak dari שׂים berarti “menaruh/memasang.” Kata “terus” menyampaikan daya teguran tentang tindakan yang berlangsung, tanpa mengubah pelakunya yang jamak.
- source_word: קִנְצֵי לְמִלִּין
  choice: jerat dengan kata-kata
  rationale: Frasa Ibrani ini sulit. קִנְצֵי secara harfiah dapat berkaitan dengan “ujung/batas,” tetapi dalam konteks dapat dipahami secara idiomatis sebagai jerat dalam pertukaran kata. Terjemahan utama dibuat alami, sedangkan kemungkinan harfiah dipertahankan dalam catatan kaki.
- source_word: תָּבִינוּ
  choice: Mengertilah
  rationale: 'Bentuk jamak dari בין di sini berdaya perintah: para pendengar diminta memahami atau mempertimbangkan dahulu.'
- source_word: וְאַחַר
  choice: lalu
  rationale: 'Menandai urutan: memahami lebih dahulu, kemudian berbicara.'
- source_word: נְדַבֵּר
  choice: kita akan berbicara
  rationale: Bentuk orang pertama jamak dapat menyatakan masa depan sederhana; kemungkinan nuansa ajakan dicatat sebagai alternatif.
theological_decisions:
- issue: Daya modal נְדַבֵּר
  choice: kita akan berbicara
  alternative: marilah kita berbicara
  rationale: Bentuk imperfek Ibrani memungkinkan pernyataan tentang tindakan berikutnya maupun ajakan. Teks utama memakai pembacaan langsung dan catatan kaki mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kalian” mempertahankan sapaan orang kedua jamak dalam bahasa sumber; susunan kalimat menjaga nada teguran Bildad sekaligus mempertahankan ketidakpastian frasa kunci melalui catatan kaki.
