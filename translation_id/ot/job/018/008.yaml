  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: id
  text: Sebab ia didorong ke dalam jaring oleh kakinya sendiri, dan ia berjalan di atas jalinan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח
  choice: menjerumuskannya
  rationale: Bentuk pasif secara harfiah berarti 'dikirim/didorong masuk'. Dalam konteks perangkap, ungkapan aktif berkausatif dengan 'kakinya sendiri' sebagai pelaku alami menyampaikan bahwa langkahnya membawanya masuk tanpa menentukan agen luar yang tidak disebutkan.
- source_word: בְּרֶשֶׁת
  choice: ke dalam jaring
  rationale: רֶשֶׁת adalah jaring penangkap; preposisi ב dapat menyatakan gerak masuk dalam konstruksi ini.
- source_word: בְּרַגְלָיו
  choice: kakinya sendiri
  rationale: Secara harfiah 'dengan/oleh kakinya'; 'sendiri' menonjolkan ironi bahwa langkah orang itu menjadi sarana ia terperangkap.
- source_word: שְׂבָכָה
  choice: anyaman perangkap
  rationale: Kata ini menunjuk jalinan atau anyaman seperti kisi/jaring. Tambahan 'perangkap' memperjelas fungsi dalam rangkaian gambaran alat penjerat tanpa menyamakannya sepenuhnya dengan רֶשֶׁת.
- source_word: יִתְהַלָּךְ
  choice: ia berjalan
  rationale: Bentuk hitpael menyatakan gerak berjalan atau mondar-mandir; terjemahan netral 'berjalan' mempertahankan gambaran bahwa ia menginjak alat perangkap.
theological_decisions:
- issue: Agen pada שֻׁלַּח pasif
  choice: Tidak menyebut Allah atau agen luar; kakinya sendiri dinyatakan sebagai sarana yang menjerumuskannya.
  alternative: Ia dikirim ke dalam jaring oleh kakinya sendiri.
  rationale: Teks tidak menyebut agen ilahi. Terjemahan harus mempertahankan fokus pada langkah orang fasik dan tidak memasukkan penentuan teologis yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme dua jenis alat perangkap dipertahankan melalui 'jaring' dan 'anyaman perangkap'.
