  text: יֹ֭אכַל בַּדֵּ֣י עוֹר֑/וֹ יֹאכַ֥ל בַּ֝דָּ֗י/ו בְּכ֣וֹר מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: id
  text: 'Ia melahap bagian-bagian kulitnya;

    anak sulung maut melahap bagian-bagiannya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak sulung dari maut”; mungkin suatu personifikasi puitis untuk penderitaan yang paling mematikan atau agen utama maut.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹאכַל
  choice: dilahap
  rationale: Bentuk Qal imperfek orang ketiga tunggal dari אכל menggambarkan tindakan merusak secara puitis. Bentuk pasif alami dalam bahasa Indonesia dan tidak memaksakan subjek yang tidak dinyatakan pada klausa pertama.
- source_word: בַּדֵּי עוֹרוֹ
  choice: bagian-bagian kulitnya
  rationale: בדים dapat berarti bagian, anggota, atau cabang. Dalam konstruksi dengan 'kulitnya', 'bagian-bagian kulitnya' lebih wajar dan tidak terlalu anatomis.
- source_word: בַּדָּיו
  choice: bagian-bagian tubuhnya
  rationale: Kata yang sama diulangi, tetapi sufiksnya merujuk langsung kepada bagian-bagian milik orang itu. Penambahan 'tubuh' memperjelas rujukan secara alami tanpa mempersempitnya menjadi anggota gerak saja.
- source_word: בְּכוֹר מָוֶת
  choice: anak sulung maut
  rationale: Terjemahan ini mempertahankan metafora genitif Ibrani yang mencolok serta ketidakjelasan mengenai identitas agen penghancur tersebut.
theological_decisions:
- issue: Penafsiran בְּכוֹר מָוֶת
  choice: Mempertahankan ungkapan puitis 'anak sulung maut' sebagai agen yang melahap.
  alternative: penyakit yang paling mematikan; agen utama maut; kematian yang paling mengerikan
  rationale: Teks Ibrani tidak menetapkan satu penafsiran khusus. Mempertahankan personifikasi menghindari penyempitan makna secara teologis atau medis.
translation_notes:
  register: Bahasa puitis, khidmat, dan mudah dipahami. Pengulangan pola antarklausa dipertahankan, sementara bentuk pasif menjaga ketidakjelasan subjek pada klausa pertama.
