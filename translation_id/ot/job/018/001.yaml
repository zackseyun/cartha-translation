  register: Bahasa Indonesia baku, alami, dan bermartabat. Rumus pengantar ucapan Ibrani dipertahankan secara formal, sedangkan identitas nisbah הַשֻּׁחִי diungkapkan dengan bentuk Indonesia yang mudah dipahami, “orang Suah”.
