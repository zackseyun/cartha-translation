base_translation:
  language: en
  yaml_path: translation/ot/job/018/001.yaml
  text: Then Bildad the Shuhite answered and said:[a]
translation:
  language: id
  text: Lalu Bildad, orang Suah, menjawab dan berkata:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Bildad, orang Suah, menjawab dan berkata.”
    reason: Alternatif ini menerjemahkan kata penghubung Ibrani pada awal ayat secara lebih harfiah sebagai “Dan”.
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam rumus dialog naratif ini, verba ענה berarti menjawab atau menanggapi; “menjawab” mempertahankan nuansa bahwa Bildad merespons perkataan sebelumnya.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam bahasa Indonesia.
- source_word: הַשֻּׁחִי
  choice: orang Suah
  rationale: Sebutan nisbah ini menunjukkan asal kelompok atau wilayah Bildad. “Orang Suah” merupakan bentuk yang alami dalam bahasa Indonesia dan mempertahankan identifikasi tersebut tanpa menentukan secara lebih sempit apakah yang dimaksud adalah suku atau daerah.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Verba אמר berarti “berkata”. Kedua verba dalam rumus Ibrani—“menjawab dan berkata”—dipertahankan, bukannya dilebur menjadi satu verba.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada awal ayat menandai kelanjutan atau perkembangan narasi. “Lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia; “Dan” tetap dicatat sebagai alternatif yang lebih harfiah.
theological_decisions: []
