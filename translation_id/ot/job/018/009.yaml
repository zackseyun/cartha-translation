  text: A trap seizes him by the heel[a]; a snare holds him fast.
translation:
  language: id
  text: Perangkap mencengkeram tumitnya[a]; jerat menahannya erat-erat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perangkap menangkapnya pada tumit; tali penjerat mencengkeramnya.” Kata terakhir dalam ayat ini jarang dipakai dan mungkin menunjuk pada jenis jerat atau tali penjerat tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: dicengkeram
  rationale: Bentuk Qal imperfek dari אחז menyatakan tindakan memegang atau mencengkeram. Bentuk pasif alami dalam bahasa Indonesia menempatkan korban sebagai sasaran perangkap tanpa mengubah hubungan sintaksis.
- source_word: בְּעָקֵב
  choice: kakinya
  rationale: עָקֵב secara khusus berarti 'tumit'. Dalam gambaran perangkap, bahasa Indonesia lebih alami menyebut kaki sebagai bagian yang dicengkeram; kekhususan 'tumit' dipertahankan dalam catatan alternatif.
- source_word: פָּח
  choice: perangkap
  rationale: פָּח menunjuk pada perangkap atau jerat. 'Perangkap' dipilih untuk membedakannya dari nomina langka pada baris kedua dan menjaga paralelisme.
- source_word: יַחֲזֵק
  choice: menahannya erat-erat
  rationale: Bentuk Hifil imperfek dari חזק di sini menyampaikan tindakan memegang dengan kuat atau menahan erat. Pilihan ini mempertahankan intensitas dan kesejajaran dengan klausa pertama.
- source_word: עָלָיו
  choice: -nya
  rationale: Preposisi על dengan sufiks orang ketiga tunggal menunjukkan bahwa tindakan jerat diarahkan kepada orang itu. Objek pronominal '-nya' menghasilkan ungkapan Indonesia yang wajar.
- source_word: צַמִּים
  choice: jerat
  rationale: Nomina ini langka dan tampaknya menunjuk pada sejenis jerat atau tali penjerat. 'Jerat' mempertahankan ketidakpastian umum tanpa menetapkan jenis alat yang terlalu khusus.
