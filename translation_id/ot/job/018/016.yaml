  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: id
  text: 'Di bawah, akar-akarnya mengering,

    dan di atas, pucuknya[a] terpotong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pucuknya layu.” Kata kerja Ibrani di sini dapat dipahami sebagai “terpotong” atau “layu.” Kata yang diterjemahkan “pucuk” juga dapat berarti “hasil tuaian”; dalam konteks gambaran tumbuhan dengan akar, kata itu tampaknya menunjuk pada pertumbuhan tanaman di bagian atas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: di bawah
  rationale: Menjaga keterangan ruang dan kesejajarannya dengan וּמִמַּעַל, “di atas,” dalam gambaran tumbuhan.
- source_word: שָׁרָשָׁיו
  choice: akar-akarnya
  rationale: Bentuk jamak dengan akhiran orang ketiga maskulin tunggal; bentuk ulang alami dalam bahasa Indonesia dan selaras dengan verba jamak Ibrani.
- source_word: יִבָשׁוּ
  choice: mengering
  rationale: Menyampaikan makna dasar verba יבשׁ secara lugas serta mempertahankan gambaran akar yang kehilangan kehidupan.
- source_word: וּמִמַּעַל
  choice: dan di atas
  rationale: Mempertahankan pasangan puitis “di bawah—di atas” dan hubungan koordinatif kedua baris.
- source_word: יִמַּל
  choice: terpotong
  rationale: Mewakili pengertian vegetasi yang dipotong atau dipangkas tanpa menentukan alat maupun pelakunya; kemungkinan nuansa “layu” dicatat dalam catatan kaki.
- source_word: קְצִירוֹ
  choice: pucuknya
  rationale: Walaupun nomina ini lazim berarti “panen” atau “hasil tuaian,” dalam kesejajaran dengan akar kata itu menunjuk pada pertumbuhan tanaman di bagian atas. “Pucuk” mempertahankan citra tumbuhan secara alami.
