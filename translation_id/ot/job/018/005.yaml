source:
  edition: WLC
  text: גַּ֤ם א֣וֹר רְשָׁעִ֣ים יִדְעָ֑ךְ וְ/לֹֽא יִ֝גַּ֗הּ שְׁבִ֣יב אִשּֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: id
  text: Sungguh, terang orang-orang fasik akan padam, dan nyala[a] api mereka tidak akan bersinar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: percikan api mereka tidak akan bersinar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Sungguh
  rationale: Di sini גַּם berfungsi sebagai partikel penegas yang mengawali pernyataan Bildad, bukan sekadar berarti “juga.” “Sungguh” menyampaikan penegasan itu secara wajar dalam bahasa Indonesia.
- source_word: אוֹר
  choice: terang
  rationale: Makna dasarnya adalah “terang,” yang di sini dipakai sebagai gambaran bagi kehidupan atau kesejahteraan. Citra sumber dipertahankan dan tidak dijelaskan secara berlebihan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Bentuk jamak ini menunjuk secara umum kepada orang yang jahat. “Orang-orang fasik” mempertahankan sifat kolektifnya dan sesuai dengan ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: יִדְעָךְ
  choice: akan padam
  rationale: Kata kerja דָּעַךְ menggambarkan terang yang meredup hingga padam. “Akan padam” alami dalam bahasa Indonesia, cocok dengan bentuk imperfek Ibrani dalam pernyataan tentang nasib mereka, dan tidak menambahkan pelaku yang tidak disebutkan.
- source_word: וְלֹא
  choice: dan ... tidak
  rationale: Gabungan kata penghubung dan penyangkalan ini mengaitkan klausa kedua secara langsung; susunan “dan ... tidak” wajar dalam bahasa Indonesia.
- source_word: יִגַּהּ
  choice: akan bersinar
  rationale: Kata kerja נגהּ di sini berarti memancarkan terang. “Bersinar” mempertahankan gambaran puitis dan selaras dengan “terang” pada klausa pertama.
- source_word: שְׁבִיב
  choice: nyala
  rationale: שְׁבִיב dapat berarti “nyala” atau “percikan.” Dalam kesejajaran dengan “terang” dan bersama kata “api,” “nyala” menghasilkan gambaran puitis yang paling alami; alternatif leksikalnya dicatat dalam catatan kaki.
- source_word: אִשּׁוֹ
  choice: api mereka
  rationale: Kata benda “api” memakai akhiran pronominal orang ketiga maskulin tunggal yang secara distributif merujuk kepada setiap anggota kelompok “orang-orang fasik.” Bahasa Indonesia secara alami menyesuaikannya menjadi “mereka” sambil mempertahankan citra api dan tidak menggantinya dengan “pelita.”
