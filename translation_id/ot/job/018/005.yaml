translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme antara “terang” dan “nyala api” dipertahankan, sedangkan bentuk waktu diterjemahkan dengan “akan” untuk menyampaikan pernyataan Bildad mengenai nasib orang-orang fasik.
