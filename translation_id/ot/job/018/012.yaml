  naturalness: “Kekuatannya menjadi lapar” dapat dipahami, tetapi kurang idiomatis dalam bahasa Indonesia modern. “Kekuatannya kelaparan” mempertahankan metafora personifikasi Ibrani dengan lebih ringkas dan alami. “Di sampingnya” juga lebih alami daripada “di sisinya” dalam konteks malapetaka yang mengintai dekat.
  terminology: “Kekuatan,” “malapetaka,” dan “siap” sesuai dengan ragam puitis yang bermartabat serta tidak menambahkan penafsiran teologis. Catatan kaki mempertahankan alternatif leksikal bagi צלע tanpa menjadikannya makna utama.
