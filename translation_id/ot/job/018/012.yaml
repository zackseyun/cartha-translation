  text: His strength is famished[a], and calamity is ready at his side.
translation:
  language: id
  text: Kekuatannya kelaparan, dan malapetaka siap di sampingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “siap untuk saat ia tersandung.” Kata Ibrani ini dapat berarti “sisi,” tetapi dalam beberapa penafsiran dikaitkan dengan tersandung atau berjalan pincang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: menjadi
  rationale: Bentuk imperfek Qal dari היה dalam puisi ini paling wajar dipahami secara deskriptif; “menjadi” mempertahankan nuansa keadaan yang terjadi tanpa menjadikannya suatu harapan atau perintah.
- source_word: רָעֵב
  choice: lapar
  rationale: Kata sifat ini secara langsung berarti lapar. Dalam hubungan metaforis dengan “kekuatan,” pilihan ini mempertahankan gambaran Ibrani yang tajam tanpa menambahkan tingkat intensitas yang tidak dinyatakan secara eksplisit.
- source_word: אֹנוֹ
  choice: kekuatannya
  rationale: אוֹן dapat menunjuk pada kekuatan, daya, atau sumber daya. “Kekuatan” paling sesuai dengan gambaran daya orang fasik yang kehilangan pemeliharaan.
- source_word: וְאֵיד
  choice: dan malapetaka
  rationale: אֵיד menyatakan bencana atau kehancuran. “Malapetaka” menjaga bobot dan ragam puitis ayat.
- source_word: נָכוֹן
  choice: siap
  rationale: Bentuk ini menyatakan keadaan telah dipersiapkan atau teguh tersedia; “siap” alami dalam bahasa Indonesia dan menggambarkan malapetaka yang menanti untuk menyerang.
- source_word: לְצַלְעוֹ
  choice: di sisinya
  rationale: צֵלָע lazim berarti sisi atau rusuk. Dengan preposisi לְ, “di sisinya” menyampaikan gambaran malapetaka yang sudah dekat, sambil alternatif terkait tersandung dicatat dalam catatan kaki.
