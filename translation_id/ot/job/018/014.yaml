  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִנָּתֵ֣ק מֵ֭/אָהֳל/וֹ מִבְטַח֑/וֹ וְ֝/תַצְעִדֵ֗/הוּ לְ/מֶ֣לֶךְ בַּלָּהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: id
  text: Ia direnggut dari keamanan kemahnya,[a] lalu digiring kepada raja segala kengerian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia direnggut dari kemahnya, tempat keamanannya.” Susunan bahasa Ibrani dapat berarti bahwa ia disingkirkan dari kemah yang aman atau bahwa kemah itu sendiri merupakan sesuatu yang diandalkannya.
    reason: lexical_alternative
  - marker: b
    text: “Raja segala kengerian” adalah ungkapan puitis yang sering dipahami sebagai maut yang dipersonifikasikan.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: direnggut
  rationale: Bentuk Nifal dari נתק menyatakan tindakan pasif berupa ditarik lepas atau dicabut dengan paksa. “Direnggut” mempertahankan daya dan kekerasan gambaran itu secara alami dalam bahasa Indonesia.
- source_word: מֵאָהֳלוֹ
  choice: dari ... kemahnya
  rationale: אֹהֶל secara konkret berarti “kemah”. Kata ini dipertahankan agar citra puitis Ibrani tidak dilebur menjadi istilah umum seperti “rumah” atau “kediaman”.
- source_word: מִבְטַחוֹ
  choice: keamanan
  rationale: מִבְטָח dapat berarti keamanan, rasa aman, kepercayaan, atau sesuatu yang diandalkan. “Keamanan kemahnya” menyampaikan bahwa kemah itu dipandang sebagai tempat perlindungan, sambil tetap membuka alternatif hubungan sintaksis melalui catatan kaki.
- source_word: וְתַצְעִדֵהוּ
  choice: lalu digiring
  rationale: Bentuk Hifil dari צעד berarti menyebabkan seseorang melangkah atau pergi. Pasif “digiring” mempertahankan gerak yang dipaksakan tanpa menentukan subjek feminin yang tidak dinyatakan dengan jelas dalam konteks dekat.
- source_word: לְמֶלֶךְ
  choice: kepada raja
  rationale: Preposisi לְ menyatakan arah menuju seseorang atau sesuatu. “Kepada” wajar dipakai untuk arah menuju sosok yang dipersonifikasikan.
- source_word: בַּלָּהוֹת
  choice: segala kengerian
  rationale: Bentuk jamak בַּלָּהוֹת menunjuk pada berbagai kedahsyatan atau kengerian. “Raja segala kengerian” menghasilkan ungkapan puitis yang jelas dan kuat dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas “raja segala kengerian”
  choice: Mempertahankan gelar puitis tanpa menetapkan identitasnya
  alternative: Menyatakannya secara eksplisit sebagai maut yang dipersonifikasikan, dunia orang mati, atau penguasa jahat
  rationale: Teks Ibrani tidak menjelaskan siapa yang dimaksud. Terjemahan mempertahankan ambiguitas dan ketegangan puitisnya; kemungkinan bahwa ungkapan ini menunjuk pada maut disampaikan hanya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Direnggut” serta “digiring” mempertahankan unsur pemaksaan dalam teks, sedangkan susunan pasif menghindari penetapan subjek yang tidak dinyatakan secara jelas. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang dijelaskannya.
