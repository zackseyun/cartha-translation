lexical_decisions:
- source_word: יֵצְרוּ
  choice: dipersempit
  rationale: Bentuk jamak ini bersesuaian dengan “langkah-langkah” dan menggambarkan ruang gerak yang menyempit atau terhalang. “Dipersempit” mempertahankan citra puitis sumber.
- source_word: צַעֲדֵי
  choice: langkah-langkahnya
  rationale: Bentuk jamak konstruksi dari צעד menunjuk pada langkah atau derap; “langkah-langkah” merupakan padanan Indonesia yang paling langsung dan alami.
- source_word: אוֹנוֹ
  choice: yang bertenaga
  rationale: אוֹן dapat berarti kekuatan atau tenaga. Dalam hubungannya dengan langkah, “yang bertenaga” menyampaikan gerak yang kuat tanpa mengubah nomina itu menjadi keterangan tentang kekayaan.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: menjatuhkan dia
  rationale: Bentuk Hifil dengan objek orang ketiga maskulin menyatakan bahwa sesuatu menyebabkan dia terlempar atau jatuh. Dalam konteks kehancuran, “menjatuhkan dia” alami sekaligus mempertahankan daya permusuhan verba tersebut.
- source_word: עֲצָתוֹ
  choice: rencananya sendiri
  rationale: עֵצָה mencakup nasihat, pertimbangan, atau rencana. Di sini yang dimaksud adalah rancangannya sendiri yang berbalik mencelakakannya; “sendiri” menonjolkan ironi yang tersirat dalam konteks.
