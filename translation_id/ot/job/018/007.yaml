  text: Langkah-langkahnya yang kuat dibatasi[a], dan rencananya sendiri menjatuhkannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Langkah-langkahnya yang kuat dipersempit.” Kata אוֹן dapat berarti “kekuatan” atau “tenaga,” sedangkan kata kerja ini dapat berarti “dipersempit” atau “dibatasi.”
