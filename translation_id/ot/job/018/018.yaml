  text: They drive him from light into darkness[b][a], and banish him from the world.
translation:
  language: id
  text: Mereka menghalaunya dari terang ke dalam kegelapan[a], dan membuangnya dari dunia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka mengejarnya dari terang ke dalam kegelapan.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani tevel dapat berarti “dunia” atau, secara lebih khusus, “dunia yang dihuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: Mereka menghalaunya
  rationale: Bentuk Qal imperfek orang ketiga jamak dengan akhiran orang ketiga tunggal maskulin menyatakan tindakan aktif oleh subjek jamak yang tidak disebutkan. “Menghalau” mempertahankan daya dorong dan pengusiran tanpa mengubahnya menjadi bentuk pasif.
- source_word: מֵאוֹר
  choice: dari terang
  rationale: אוֹר berarti “terang,” sedangkan prefiks מ menandai pemisahan atau asal. Bentuk tanpa artikel menghasilkan ungkapan puitis yang alami dalam bahasa Indonesia.
- source_word: אֶל חֹשֶׁךְ
  choice: ke dalam kegelapan
  rationale: אֶל menyatakan arah perpindahan; “ke dalam” menonjolkan gerak dari satu ranah ke ranah lain dan mempertahankan pertentangan terang–kegelapan.
- source_word: וּמִתֵּבֵל
  choice: dan dari dunia
  rationale: תֵּבֵל dapat berarti dunia secara umum atau secara lebih khusus dunia yang dihuni. “Dunia” ringkas, alami, dan tetap membuka cakupan maknanya.
- source_word: יְנִדֻּהוּ
  choice: membuangnya
  rationale: Bentuk ini menyatakan tindakan menyebabkan seseorang tersingkir atau terusir. “Membuang” menyampaikan pengeluaran dari ranah manusia dan menghindari pengulangan kata “menghalau” dalam paralelisme.
