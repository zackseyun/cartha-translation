  text: He has neither offspring nor posterity among his people[b][a], and no survivor in the places where he sojourned.
translation:
  language: id
  text: Ia tidak mempunyai anak cucu di antara bangsanya[a], dan tidak ada seorang pun yang tersisa di tempat-tempat kediamannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan”; pasangan kata Ibrani ini menyatakan terputusnya seluruh garis keturunan.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tempat-tempat ia tinggal” atau “di permukiman-permukimannya”; kata Ibrani ini dapat menunjuk pada tempat tinggal maupun tempat menumpang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִין
  choice: anak
  rationale: Dalam pasangan dengan נֶכֶד, kata ini menunjuk pada keturunan; “anak” alami dalam bahasa Indonesia dan membantu menyampaikan pemusnahan garis keturunan secara menyeluruh.
- source_word: נֶכֶד
  choice: cucu
  rationale: Kata ini dapat menunjuk pada cucu atau keturunan selanjutnya. Gabungan “anak cucu” merupakan ungkapan Indonesia yang alami untuk keseluruhan keturunan.
- source_word: בְּעַמּוֹ
  choice: di antara bangsanya
  rationale: Frasa ini mempertahankan arti עַם sebagai komunitas atau bangsa tempat orang itu berasal.
- source_word: שָׂרִיד
  choice: seorang pun yang tersisa
  rationale: שָׂרִיד menunjuk pada orang yang tetap hidup atau tertinggal; rumusan ini jelas, alami, dan tidak membawa nuansa teologis tambahan.
- source_word: בִּמְגוּרָיו
  choice: di tempat-tempat kediamannya
  rationale: Bentuk jamak ini menunjuk pada tempat-tempat ia tinggal atau menumpang. “Tempat-tempat kediamannya” terbaca alami sambil mempertahankan kemungkinan tempat tinggal.
