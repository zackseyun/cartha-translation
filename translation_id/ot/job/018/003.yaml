  text: Why are we regarded as cattle[b][a], and considered unclean in your eyes?
translation:
  language: id
  text: Mengapa kami dianggap seperti binatang[a] dan dianggap najis[b] di mata kalian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti hewan ternak.” Kata Ibrani בְּהֵמָה dapat berarti binatang secara umum atau hewan ternak dan di sini dipakai sebagai perbandingan yang merendahkan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “dianggap najis” sulit dipastikan maknanya. Ada yang memahaminya secara lain, misalnya “dianggap dungu”; tetapi makna yang berkaitan dengan kenajisan atau kecemaran lebih umum diterima.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini membuka pertanyaan retoris Bildad; “Mengapa” merupakan padanan Indonesia yang langsung dan alami.
- source_word: נֶחְשַׁבְנוּ
  choice: kami dianggap
  rationale: Bentuk pasif dari חשׁב menyatakan bagaimana Bildad dan rekan-rekannya dinilai. “Kami” tepat karena pembicara tidak memasukkan lawan bicaranya.
- source_word: כַבְּהֵמָה
  choice: seperti binatang
  rationale: בְּהֵמָה adalah istilah luas bagi binatang, sering kali hewan ternak. “Binatang” mempertahankan cakupan umumnya dan nada perbandingan yang merendahkan tanpa membatasinya pada ternak tertentu.
- source_word: נִטְמִינוּ
  choice: dianggap dungu
  rationale: Bentuk dan makna kata ini sulit. Dalam paralelisme dengan perbandingan terhadap binatang, pengertian “dianggap dungu” memberikan makna kontekstual yang kuat, tetapi kemungkinan pengertian “dianggap najis” tetap dicatat.
- source_word: בְּעֵינֵיכֶם
  choice: di mata kalian
  rationale: Ungkapan Ibrani ini menyatakan penilaian atau pandangan. Bentuk orang kedua jamak dipertahankan dengan “kalian”.
theological_decisions:
- issue: Makna נִטְמִינוּ yang tidak pasti
  choice: dianggap dungu
  alternative: dianggap najis / cemar
  rationale: Konteks keluhan tentang diperlakukan seperti binatang mendukung gagasan dianggap tidak berakal atau dungu. Namun, hubungan leksikal yang mungkin dengan kenajisan membuat arti “najis” tetap layak dan tidak boleh disembunyikan; karena itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan tetap bermartabat. Pengulangan “dianggap” mempertahankan kesejajaran kedua klausa. “Kalian” mencerminkan bentuk jamak pada teks Ibrani.
