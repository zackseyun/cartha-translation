translation_notes:
  register: Bahasa puitis yang lugas dan bermartabat. 'Kengerian' dipakai secara kolektif, sedangkan 'menghalau dia pada setiap langkahnya' menyampaikan gerak yang dipaksakan sambil menghindari frasa Indonesia yang tidak alami.
