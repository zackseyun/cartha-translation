translation:
  language: id
  text: Kengerian membuatnya gentar dari segala penjuru dan mengusirnya ke mana pun ia melangkah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada kakinya.” Ungkapan Ibrani ini mungkin menggambarkan kengerian yang mengejar atau mengusirnya pada setiap langkah; juga dapat diterjemahkan “di belakangnya” atau “pada tumitnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: dari segala penjuru
  rationale: Ungkapan ini secara alami menyatakan bahwa kengerian mengepung dan datang dari semua arah.
- source_word: בִּעֲתֻהוּ
  choice: membuatnya gentar
  rationale: Bentuk dari בעת menyatakan tindakan menakutkan atau menggentarkan. Pilihan ini kuat tetapi tetap wajar dalam puisi Indonesia.
- source_word: בַלָּהוֹת
  choice: Kengerian
  rationale: Nomina jamak ini menunjuk pada berbagai hal atau pengalaman yang menimbulkan rasa ngeri. Bahasa Indonesia dapat memakai nomina kolektif tanpa penanda jamak eksplisit.
- source_word: וֶהֱפִיצֻהוּ
  choice: dan menghalau dia
  rationale: Bentuk kausatif dari פוץ pada konteks ini menggambarkan kengerian yang membuat orang itu bergerak tercerai atau terusir. 'Menghalau' mempertahankan daya gerak tersebut tanpa ungkapan janggal seperti 'mencerai-beraikan dia' untuk satu orang.
- source_word: לְרַגְלָיו
  choice: pada setiap langkahnya
  rationale: Secara harfiah berarti 'pada/ke kakinya', tetapi dalam konteks dapat menggambarkan kengerian yang terus memburunya ke mana pun ia melangkah. Ketidakpastian citra Ibrani dipertahankan dalam catatan kaki.
