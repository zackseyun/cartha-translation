  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: id
  text: Jika ada yang hendak kaukatakan, jawablah aku; berbicaralah, sebab aku ingin menyatakan bahwa engkau benar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membenarkanmu” atau “menyatakan engkau benar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: Jika ada yang hendak kaukatakan
  rationale: Ungkapan eksistensial ini secara harfiah berarti ‘jika ada perkataan’. Terjemahan ini menyampaikan idiomnya secara alami sebagai undangan kepada Ayub untuk mengemukakan tanggapan, tanpa mempersempitnya khusus menjadi ‘argumen’.
- source_word: הֲשִׁיבֵנִי
  choice: jawablah aku
  rationale: Bentuk imperatif Hifil dari שוב dalam konteks percakapan berarti ‘jawablah’ atau ‘balaslah’; pilihan ini ringkas dan langsung.
- source_word: דַּבֵּר
  choice: berbicaralah
  rationale: Imperatif ini meneruskan undangan Elihu kepada Ayub untuk berbicara. ‘Berbicaralah’ mempertahankan daya perintahnya dalam bahasa Indonesia yang wajar.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan Elihu mengundang Ayub menjawab.
- source_word: חָפַצְתִּי
  choice: aku ingin
  rationale: Kata kerja ini mengungkapkan kehendak atau keinginan. ‘Aku ingin’ alami dalam bahasa Indonesia dan tetap menunjukkan kesungguhan Elihu.
- source_word: צַדְּקֶךָ
  choice: menyatakan bahwa engkau benar
  rationale: Bentuk dari akar צדק di sini berarti menyatakan atau menunjukkan seseorang berada di pihak yang benar. Pilihan ini jelas dalam konteks perdebatan dan menghindari kesan bahwa ayat ini sedang memakai istilah teknis tentang pembenaran di hadapan Allah.
theological_decisions:
- issue: Makna צַדְּקֶךָ dan kemungkinan nuansa pembenaran teologis
  choice: menyatakan bahwa engkau benar
  alternative: membenarkanmu; membela kebenaranmu
  rationale: Elihu menyatakan bahwa ia ingin mendapati atau menunjukkan Ayub benar apabila Ayub dapat menjawab. Ini bukan pernyataan doktrinal tentang pembenaran di hadapan Allah. Terjemahan utama menjelaskan makna kontekstual, sedangkan catatan kaki mempertahankan pilihan leksikal yang lebih padat dan kemungkinan nuansa vindikasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘kaukatakan’ mempertahankan sapaan orang kedua tunggal yang langsung, sedangkan tanda titik koma mencerminkan kesinambungan dua imperatif dalam bahasa sumber.
