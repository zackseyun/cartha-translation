translation:
  language: id
  text: Ia memasukkan kedua kakiku ke dalam pasung; Ia mengawasi semua jalanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia menjaga semua jalanku.” Kata kerja Ibrani yang dipakai dapat berarti mengawasi atau menjaga; dalam konteks ini, pengawasan yang ketat lebih mungkin dimaksudkan daripada perlindungan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: memasukkan
  rationale: Dalam konstruksi dengan kaki dan pasung, 'memasukkan' lebih alami dalam bahasa Indonesia daripada 'menaruh', sambil tetap menyampaikan tindakan menempatkan.
- source_word: בַּסַּד
  choice: ke dalam pasung
  rationale: סַד menunjuk pada alat pengekang kaki; 'pasung' mempertahankan gambaran konkret tentang penahanan yang menghukum.
- source_word: רַגְלָי
  choice: kakiku
  rationale: Bentuk Ibrani merujuk pada kaki milik penutur; bahasa Indonesia lazim memakai bentuk tunggal kolektif 'kakiku' untuk sepasang kaki.
- source_word: יִשְׁמֹר
  choice: mengawasi
  rationale: שׁמר dapat berarti menjaga atau mengawasi. Dalam konteks keluhan Ayub yang sedang diringkas Elihu, 'mengawasi' menyampaikan pengamatan ketat tanpa menyiratkan perlindungan.
- source_word: כָּל
  choice: segala
  rationale: '''Segala'' merupakan padanan alami bagi quantifier ini ketika menerangkan ''jalanku'' dan menegaskan cakupan menyeluruh.'
- source_word: אָרְחֹתָי
  choice: jalanku
  rationale: אֹרַח berarti jalan atau lintasan dan kerap menjadi metafora bagi perilaku atau perjalanan hidup; 'jalan' mempertahankan metafora tersebut secara alami.
theological_decisions:
- issue: Apakah tindakan Allah pada bagian kedua menggambarkan perlindungan atau pengawasan yang menghukum
  choice: 'pengawasan ketat: ''Ia mengawasi segala jalanku'''
  alternative: '''Ia menjaga segala jalanku'' sebagai gambaran perlindungan'
  rationale: Konteksnya adalah Elihu merangkum keluhan Ayub bahwa Allah memperlakukannya sebagai lawan dan membatasi geraknya. Karena itu, 'mengawasi' lebih sesuai, tetapi catatan kaki mempertahankan kemungkinan leksikal 'menjaga'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pasung' mempertahankan citra alat pengekang kaki, sedangkan 'mengawasi' menjaga nuansa pemeriksaan yang menekan dalam konteks tanpa meniadakan alternatif leksikal yang dicatat.
