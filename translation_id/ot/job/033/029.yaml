  text: Lihatlah, Allah melakukan semua ini dua atau tiga kali kepada seseorang[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harfiah, “kepada seorang laki-laki.” Bahasa Ibrani memakai bentuk tunggal maskulin secara representatif untuk manusia pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Lihatlah
  rationale: Partikel wacana ini mengarahkan perhatian pada pernyataan yang menyusul. “Lihatlah” mempertahankan daya penegasnya dalam bahasa Indonesia modern.
- source_word: כָּל אֵלֶּה
  choice: semua ini
  rationale: Frasa ini merujuk kembali pada berbagai tindakan Allah yang baru saja diuraikan. Bahasa Indonesia tidak memerlukan penambahan kata “hal” agar maknanya jelas.
- source_word: יִפְעַל
  choice: melakukan
  rationale: Kata kerja פעל di sini menyatakan pelaksanaan tindakan; “melakukan” cocok secara alami dengan “semua ini” dan mempertahankan Allah sebagai pelaku.
- source_word: אֵל
  choice: Allah
  rationale: אֵל menunjuk kepada Allah dalam konteks ini dan bukan nama khusus YHWH; “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: פַּעֲמַיִם שָׁלֹשׁ
  choice: dua atau tiga kali
  rationale: Ungkapan harfiahnya “dua kali, tiga kali” menyatakan tindakan yang berulang. “Dua atau tiga kali” mempertahankan urutan bilangannya tanpa memperluasnya menjadi “berulang-ulang.”
- source_word: עִם
  choice: terhadap
  rationale: Preposisi ini menggambarkan tindakan Allah dalam hubungannya dengan manusia. “Terhadap” lebih alami daripada “dengan” setelah kata kerja “melakukan” dan tidak menambahkan gagasan bahwa manusia ikut bertindak.
- source_word: גָּבֶר
  choice: seorang laki-laki
  rationale: גָּבֶר secara leksikal adalah laki-laki dalam bentuk tunggal, tetapi di sini dipakai secara representatif. Teks utama mempertahankan unsur maskulin sumber, sedangkan cakupan umumnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Bahasa maskulin representatif dalam גָּבֶר
  choice: seorang laki-laki
  alternative: seseorang; seorang manusia
  rationale: Bahasa Ibrani memakai nomina maskulin tunggal dengan fungsi generik atau representatif. Terjemahan utama mempertahankan bentuk itu tanpa menyiratkan bahwa tindakan Allah hanya berlaku bagi laki-laki; cakupan representatifnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lihatlah” mempertahankan penekanan wacana, sedangkan susunan kalimat mengikuti urutan gagasan Ibrani secara alami. Tanda koma pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
