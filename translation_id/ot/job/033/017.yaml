  text: לְ֭/הָסִיר אָדָ֣ם מַעֲשֶׂ֑ה וְ/גֵוָ֖ה מִ/גֶּ֣בֶר יְכַסֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/017.yaml
  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: id
  text: untuk menjauhkan manusia dari perbuatannya[a] dan menyembunyikan kesombongan dari manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “untuk menyingkirkan perbuatan manusia, dan Ia menutupi kesombongan dari seorang laki-laki.” Bahasa Ibraninya padat; baris ini dapat dipahami sebagai tindakan menjauhkan manusia dari perbuatannya atau menyingkirkan perbuatan itu sendiri darinya. Kata yang diterjemahkan “manusia” pada bagian kedua juga dapat menekankan laki-laki dalam kekuatannya.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: untuk menjauhkan ... dari
  rationale: Infinitif kausatif הִפְעִיל dari סור menyatakan tindakan membuat seseorang beralih atau menjauh. Susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan hubungan sintaksis Ibrani.
- source_word: אָדָם
  choice: manusia
  rationale: Di sini אָדָם menunjuk kepada seorang manusia secara umum. 'Manusia' mempertahankan cakupan umum tanpa harus menambahkan gender yang tidak perlu dalam bahasa Indonesia.
- source_word: מַעֲשֶׂה
  choice: perbuatannya
  rationale: Kata ini dapat berarti perbuatan, pekerjaan, atau tindakan. Dalam konteks peringatan ilahi, 'perbuatannya' alami dan menyampaikan hubungan posesif yang tersirat.
- source_word: וְגֵוָה
  choice: kesombongan
  rationale: Nomina גֵּוָה di sini menyatakan keangkuhan atau peninggian diri dalam arti negatif. 'Kesombongan' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: מִגֶּבֶר
  choice: dari manusia
  rationale: גֶּבֶר dapat menyoroti laki-laki dalam kekuatan atau kedewasaannya, tetapi dalam konteks ini berfungsi sebagai sebutan paralel bagi manusia. Terjemahan 'manusia' menghindari ungkapan Indonesia yang janggal seperti 'orang kuat', sementara nuansa leksikal dicatat dalam catatan kaki.
- source_word: יְכַסֶּה
  choice: menyembunyikan
  rationale: Bentuk imperfek ini sejajar secara makna dengan klausa tujuan sebelumnya. Secara harfiah berarti 'menutupi', tetapi dalam konstruksi 'kesombongan dari manusia', 'menyembunyikan' menyampaikan metafora itu secara lebih alami tanpa menetapkan secara berlebihan apakah kesombongan disingkirkan atau hanya ditahan.
theological_decisions:
- issue: Makna tujuan tindakan Allah dalam ujaran Elihu
  choice: Allah bertujuan menjauhkan manusia dari perbuatannya dan menyembunyikan atau menahan kesombongan darinya.
  alternative: Allah menyingkirkan perbuatan manusia darinya dan menutupi kesombongan dari seorang laki-laki.
  rationale: Bahasa Ibrani sangat padat dan memungkinkan objek serta relasi preposisional dipahami lebih dari satu cara. Teks utama mengikuti alur konteks Ayub 33:14–18, sedangkan catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur tujuan dipertahankan karena ayat ini melanjutkan kalimat dari konteks sebelumnya. 'Menyembunyikan kesombongan dari manusia' sengaja mempertahankan ketegangan metaforis teks Ibrani, dengan alternatif harfiah dijelaskan dalam catatan kaki.
