  text: הֵן אֲנִ֣י כְ/פִ֣י/ךָ לָ/אֵ֑ל מֵ֝/חֹ֗מֶר קֹרַ֥צְתִּי גַם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: id
  text: Lihat, di hadapan Allah aku ini sesuai dengan keinginanmu[a]; aku pun dibentuk dari tanah liat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku seperti mulutmu bagi Allah.” Frasa Ibrani ini diperdebatkan; frasa tersebut dapat berarti “aku hadir di hadapan Allah sesuai dengan keinginanmu,” “aku menjadi juru bicaramu di hadapan Allah,” atau mungkin “aku setara denganmu di hadapan Allah.”
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “dibentuk” dapat membangkitkan gambaran tanah liat yang dicubit, dipotong, atau dibentuk dari bahan asalnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Partikel wacana ini menarik perhatian dengan tegas. “Lihat” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya penunjuknya.
- source_word: כְפִיךָ לָאֵל
  choice: juru bicaramu di hadapan Allah
  rationale: Ungkapan padat ini secara harfiah berbunyi kira-kira “seperti mulutmu kepada/di hadapan Allah.” Dalam konteksnya, “juru bicaramu di hadapan Allah” menyampaikan kemungkinan bahwa Elihu akan berbicara mewakili Ayub, tetapi ketaksaan ungkapan Ibraninya tetap dicatat.
- source_word: מֵחֹמֶר
  choice: dari tanah liat
  rationale: חֹמֶר menunjuk pada tanah liat atau bahan lempung; pilihan ini sesuai dengan gambaran asal-usul manusia dari bahan bumi.
- source_word: קֹרַצְתִּי
  choice: dibentuk
  rationale: Kata kerja ini dapat menggambarkan tindakan mencubit atau membentuk tanah liat. “Dibentuk” terdengar wajar dan bermartabat dalam bahasa Indonesia, sedangkan citra sentuhan yang lebih konkret dijelaskan dalam catatan kaki.
- source_word: גַם אֲנִי
  choice: aku pun
  rationale: Bentuk ini menegaskan bahwa Elihu memiliki asal-usul manusiawi yang sama dengan Ayub.
theological_decisions:
- issue: Hubungan yang diklaim Elihu antara dirinya, Ayub, dan Allah
  choice: Elihu tampil sebagai juru bicara Ayub di hadapan Allah sekaligus menekankan bahwa ia sama-sama makhluk yang berasal dari tanah liat.
  alternative: Ungkapan itu dapat berarti bahwa Elihu berada di hadapan Allah sebagaimana Ayub, atau bahwa ia hadir sesuai dengan keinginan Ayub.
  rationale: Paruh kedua ayat dengan jelas menekankan kemanusiaan bersama. Pilihan utama mengikuti kemungkinan makna “mulut/juru bicara,” tanpa menganggap Elihu memiliki status ilahi atau memasukkan konsep perantaraan yang lebih kuat daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Aku” dipakai sesuai suasana tuturan langsung dalam puisi hikmat. Ungkapan utama dibuat mudah dipahami, sedangkan ketaksaan frasa Ibrani dan citra konkret pembentukan tanah liat dipertahankan melalui catatan kaki.
