  edition: WLC
  text: הֵ֣ן תְּ֭נוּאוֹת עָלַ֣/י יִמְצָ֑א יַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/010.yaml
  text: Look[a], he finds grounds for hostility against me; he counts me as his enemy.
translation:
  language: id
  text: Lihat, Ia menemukan alasan untuk memusuhi aku[a]; Ia menganggap aku sebagai musuh-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia menemukan permusuhan terhadap aku,” “Ia menemukan kesempatan untuk melawan aku,” atau mungkin “Ia menemukan keluhan terhadap aku.” Kata benda Ibrani yang dipakai di sini jarang muncul dan artinya bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Berfungsi sebagai penegas sekaligus penarik perhatian; “Lihat” alami dalam bahasa Indonesia modern dan mempertahankan dayanya.
- source_word: תְּנוּאוֹת
  choice: alasan untuk memusuhi
  rationale: Nomina ini langka dan bergantung pada konteks. Pilihan ini menyampaikan gagasan tentang alasan atau kesempatan yang ditemukan untuk bersikap bermusuhan, tanpa menafsirkannya sebagai tuduhan yang direkayasa.
- source_word: עָלַי
  choice: terhadap aku (tercakup dalam “memusuhi aku”)
  rationale: Dalam konteks permusuhan, preposisi ini bersifat adversatif. Susunan “memusuhi aku” mengungkapkannya secara alami.
- source_word: יִמְצָא
  choice: Ia menemukan
  rationale: Mempertahankan arti dasar verba “menemukan” dan tidak mempertajamnya menjadi “mengada-adakan” atau “mereka-reka”.
- source_word: יַחְשְׁבֵנִי
  choice: Ia menganggap aku
  rationale: Menyampaikan arti menilai atau memandang seseorang dalam suatu status dengan bahasa Indonesia yang wajar.
- source_word: לְאוֹיֵב לוֹ
  choice: sebagai musuh-Nya
  rationale: Mengungkapkan peran atau status yang dikenakan kepada Ayub; akhiran orang ketiga merujuk kepada Allah dalam keluhan yang sedang dikutip.
theological_decisions:
- issue: Sudut pandang pembicara mengenai perlakuan Allah terhadap Ayub
  choice: 'Menyajikan laporan Elihu tentang keluhan Ayub: “Ia menemukan alasan untuk memusuhi aku; Ia menganggap aku sebagai musuh-Nya.”'
  alternative: “Ia mencari-cari tuduhan terhadap aku” atau “Ia mengada-adakan alasan untuk melawan aku.”
  rationale: Ayat ini melaporkan persepsi Ayub dan tidak dengan sendirinya membenarkan penilaian itu. “Menemukan” mempertahankan ketegangan teologis tanpa menyatakan bahwa Allah mereka-reka tuduhan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Huruf kapital pada “Ia” dan akhiran “-Nya” memperjelas bahwa yang dimaksud adalah Allah, sesuai konteks langsung. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang memiliki ketidakpastian leksikal.
