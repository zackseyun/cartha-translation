  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: id
  text: Ia menyelamatkan nyawanya dari liang kubur[a], dan hidupnya dari binasa oleh senjata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari liang maut,” “dari kubur,” atau “dari kebinasaan.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani dapat menunjuk lebih khusus pada senjata lempar, anak panah, atau mungkin pedang; maksud larik ini ialah terhindar dari kematian yang disebabkan oleh senjata.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: menahan
  rationale: Bentuk Hifil dari חשׂך berarti menahan, mencegah, atau menyelamatkan dari sesuatu. “Menahan ... dari” mempertahankan gambaran bahwa seseorang dicegah memasuki bahaya maut.
- source_word: נַפְשׁוֹ
  choice: nyawanya
  rationale: נפש di sini menunjuk pada nyawa atau kehidupan seseorang. “Nyawanya” alami dalam bahasa Indonesia dan tetap sejalan dengan paralel “hidupnya” pada larik kedua.
- source_word: מִנִּי שָׁחַת
  choice: dari liang kubur
  rationale: שׁחת dapat berarti liang, kubur, atau kebinasaan. “Liang kubur” mempertahankan gambaran konkret tentang ranah kematian tanpa membatasi maknanya pada kuburan harfiah.
- source_word: וְחַיָּתוֹ
  choice: dan hidupnya
  rationale: Dalam konteks ini חיה merujuk pada kehidupan orang tersebut dan membentuk kesejajaran puitis dengan נפשו.
- source_word: מֵעֲבֹר בַּשָּׁלַח
  choice: dari binasa oleh senjata
  rationale: Terjemahan harfiah unsur-unsurnya adalah kira-kira “dari melewati/melintas dengan senjata,” tetapi dalam konteks ancaman maut frasa ini paling alami dipahami sebagai dicegah mengalami kematian akibat senjata. “Binasa oleh senjata” menyampaikan maksud itu dalam bahasa Indonesia yang wajar.
- source_word: בַּשָּׁלַח
  choice: oleh senjata
  rationale: שׁלח dapat menunjuk pada senjata lempar, anak panah, atau senjata secara lebih umum. “Senjata” menghindari ketepatan semu karena jenis senjatanya tidak pasti.
theological_decisions:
- issue: Identitas subjek tersirat pada יַחְשֹׂךְ
  choice: Ia
  alternative: Dia (dengan penegasan eksplisit bahwa subjeknya Allah)
  rationale: Bahasa Ibrani tidak menyebutkan nomina subjek dalam ayat ini, walaupun konteks sebelumnya menunjuk kepada Allah. “Ia” mempertahankan kesinambungan konteks tanpa menambahkan nama ilahi yang tidak tertulis dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kesejajaran “nyawanya ... hidupnya” dipertahankan, sedangkan ungkapan sulit pada larik kedua diterjemahkan secara idiomatis agar jelas bagi pembaca umum.
