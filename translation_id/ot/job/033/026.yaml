source:
  edition: WLC
  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: id
  text: Ia memohon dengan sungguh-sungguh kepada Allah[a], dan Allah berkenan kepadanya. Ia melihat wajah-Nya[b] sambil bersorak-sorai, dan Allah mengembalikan kepada orang itu kebenarannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdoa kepada Allah.” Kata Ibrani ini dapat menekankan permohonan yang sungguh-sungguh dalam doa.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, wajah Allah; teks Ibrani hanya mengatakan “wajahnya.”
    reason: alternative_reading
  - marker: c
    text: Atau “kedudukannya yang benar” atau “pembenarannya.” Kata Ibrani yang diterjemahkan “kebenaran” dapat menunjuk pada kedudukan yang dipulihkan di hadapan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: memohon dengan sungguh-sungguh
  rationale: Kata kerja עתר menunjuk pada doa atau permohonan yang sungguh-sungguh. Ungkapan ini mempertahankan unsur desakan tanpa terdengar kuno.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: אֱלוֹהַּ adalah sebutan puitis tunggal bagi Allah yang umum dalam kitab Ayub; tidak ada dasar untuk menambahkan gelar lain.
- source_word: וַיִּרְצֵהוּ
  choice: Allah berkenan kepadanya
  rationale: רצה dengan objek orang di sini menyatakan penerimaan atau perkenanan Allah terhadap orang yang berdoa. Subjek eksplisit 'Allah' ditambahkan demi kejelasan pergantian subjek dalam bahasa Indonesia.
- source_word: וַיַּרְא פָּנָיו
  choice: Ia melihat wajah-Nya
  rationale: Terjemahan ini mempertahankan bentuk ringkas Ibrani dan sufiks pronominalnya. Dalam konteks, orang itu paling mungkin melihat wajah Allah, tetapi rujukannya dijelaskan dalam catatan karena teks hanya mengatakan 'wajahnya'.
- source_word: בִּתְרוּעָה
  choice: sambil bersorak-sorai
  rationale: תְּרוּעָה menggambarkan seruan nyaring yang bersifat gembira atau penuh kemenangan; 'bersorak-sorai' menyampaikan unsur suara dan sukacita secara alami.
- source_word: וַיָּשֶׁב
  choice: memulihkan
  rationale: Bentuk kausatif שוב berarti membuat kembali atau mengembalikan. 'Memulihkan' sesuai dengan konteks pemulihan hubungan dan keadaan orang itu.
- source_word: לֶאֱנוֹשׁ
  choice: kepada manusia itu
  rationale: אֱנוֹשׁ menunjuk kepada manusia fana. Dalam konteks ini, 'manusia itu' secara alami merujuk kembali kepada orang yang berdoa.
- source_word: צִדְקָתוֹ
  choice: kebenarannya
  rationale: צְדָקָה paling langsung berarti 'kebenaran' atau keadaan benar. Pilihan ini mempertahankan keluasan makna Ibrani tanpa menetapkan teori teologis tertentu.
theological_decisions:
- issue: Rujukan subjek dan pronomina dalam rangkaian tindakan
  choice: Allah berkenan kepada orang yang berdoa, lalu orang itu melihat wajah Allah.
  alternative: Secara tata bahasa, rangkaian pronomina dapat dibaca lain, misalnya Allah melihat wajah orang itu, tetapi konteks dan ungkapan 'melihat wajah Allah' lebih mendukung bacaan utama.
  rationale: Konteks menggambarkan manusia yang datang kepada Allah lalu menerima perkenanan dan pemulihan. Bacaan utama menyampaikan alur tersebut, sedangkan catatan mempertahankan ketidaktersuratan rujukan 'wajah-Nya' dalam bahasa Ibrani.
- issue: Makna צִדְקָתוֹ ('kebenarannya')
  choice: Allah memulihkan kebenaran atau kedudukan benar milik manusia itu.
  alternative: Kata itu dapat bernuansa pembenaran atau pemulihan nama baiknya; teks tidak secara tegas menyatakan bahwa yang dimaksud adalah kebenaran Allah yang diperhitungkan kepadanya.
  rationale: Sufiks orang ketiga tunggal paling wajar merujuk kepada manusia itu. Terjemahan harfiah 'kebenarannya' menjaga keluasan teologis ungkapan tanpa memasukkan kerangka doktrinal yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pergantian subjek yang tersirat dalam puisi Ibrani dijelaskan dengan menyebut 'Allah' agar alurnya tidak rancu, sedangkan ungkapan teologis 'kebenarannya' dipertahankan agar ketegangan maknanya tidak dipersempit.
