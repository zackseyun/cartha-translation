translation:
  language: id
  text: Lalu ia bermurah hati kepadanya dan berkata, “Bebaskanlah dia agar tidak turun ke liang[b]; aku telah menemukan tebusan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harga pendamaian” atau “penutup”. Kata Ibrani כֹּפֶר dapat berarti tebusan atau ganti rugi yang menjamin pembebasan dan, dalam konteks tertentu, dapat mengandung nuansa pendamaian.
    reason: lexical_alternative
  - marker: b
    text: “Liang” juga dapat menggambarkan kubur atau kebinasaan, bukan hanya lubang fisik di tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: Lalu ia berbelas kasihan kepadanya
  rationale: Kata חנן menyatakan pemberian belas kasihan, kemurahan, atau perkenanan. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada rasa iba semata. Kata ganti “ia” tidak diberi huruf kapital agar identitas subjek tersirat dalam bahasa Ibrani tidak diputuskan secara teologis di dalam terjemahan.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: Bentuk naratif ini melanjutkan urutan tindakan dan secara alami memperkenalkan ucapan langsung dalam bahasa Indonesia.
- source_word: פְּדָעֵהוּ
  choice: Bebaskanlah dia
  rationale: Kata פדה dapat berarti menebus, membayar pembebasan, atau melepaskan. “Bebaskanlah” mempertahankan hasil tindakan yang diperintahkan tanpa terlebih dahulu menjadikannya istilah teknis, sementara unsur harga pembebasan dinyatakan oleh כֹפֶר pada akhir ayat.
- source_word: מֵרֶדֶת
  choice: agar tidak turun
  rationale: Gabungan preposisi מִן dengan infinitif ירד menyatakan pencegahan terhadap tindakan turun. Susunan “agar tidak turun” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dari turun”.
- source_word: שָׁחַת
  choice: liang
  rationale: שׁחת menggambarkan liang dan dalam konteks puitis dapat menunjuk pada kubur atau kebinasaan. “Liang” mempertahankan gambaran konkret tanpa memutuskan salah satu nuansa tersebut.
- source_word: מָצָאתִי
  choice: aku telah menemukan
  rationale: Bentuk perfektif orang pertama tunggal menyatakan bahwa dasar pembebasan itu sudah ditemukan dan hasilnya kini berlaku.
- source_word: כֹפֶר
  choice: tebusan
  rationale: כֹפֶר dapat berarti harga tebusan atau ganti rugi yang menjamin pembebasan. “Tebusan” jelas dan wajar dalam bahasa Indonesia, sekaligus tidak memaksakan seluruh muatan doktrin pendamaian ke dalam konteks ini.
theological_decisions:
- issue: Makna כֹפֶר dalam perkataan ini
  choice: tebusan
  alternative: harga pendamaian; pembayaran pengganti; penutup
  rationale: Konteksnya berbicara tentang dasar untuk membebaskan seseorang dari turun ke liang. “Tebusan” mempertahankan gagasan konkret tentang sesuatu yang menjamin pembebasan, sedangkan kemungkinan nuansa pendamaian dijelaskan dalam catatan kaki tanpa dijadikan satu-satunya tafsiran.
- issue: Identitas subjek וַיְחֻנֶּנּוּ וַיֹּאמֶר
  choice: kata ganti “ia” tanpa kapitalisasi
  alternative: “Dia” sebagai rujukan eksplisit kepada Allah atau penyebutan utusan/perantara secara eksplisit
  rationale: Bahasa Ibrani hanya menandai subjek orang ketiga tunggal maskulin dan bergantung pada konteks untuk acuannya. Terjemahan tidak menambahkan identitas yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur puitis Ibrani, tetapi “agar tidak turun” dipakai demi kealamian. Kata “ia” dan “aku” ditulis dengan huruf kecil untuk tidak menentukan secara tersirat bahwa pembicara atau pelaku harus dipahami sebagai Allah.
