  text: His flesh wastes away from sight[a], and his bones, once unseen, stick out.
translation:
  language: id
  text: Dagingnya habis, hingga tidak terlihat lagi,[a] dan tulang-tulangnya yang dahulu tidak tampak kini menonjol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dagingnya habis dari pandangan, dan tulang-tulangnya yang tidak tampak tersingkap.” Teks Ibrani pada baris ini padat dan agak sulit, terutama kata yang diterjemahkan “menonjol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכֶל
  choice: menyusut
  rationale: Bentuk imperfek Qal dari כלה menggambarkan daging yang makin habis atau merosot akibat penderitaan; “menyusut” alami dalam bahasa Indonesia dan mempertahankan gambaran kemerosotan jasmani.
- source_word: בְּשָׂרוֹ
  choice: dagingnya
  rationale: Padanan konkret bagi “dagingnya” yang mempertahankan citra tubuh dalam teks Ibrani.
- source_word: מֵרֹאִי
  choice: sampai tidak terlihat lagi
  rationale: Frasa מן + רֹאִי menunjukkan lenyapnya daging dari pandangan; ungkapan ini menyampaikan akibat tersebut secara wajar dalam bahasa Indonesia.
- source_word: וְשֻׁפִי
  choice: kini menonjol
  rationale: Bentuk Ibrani ini sulit dan maknanya tidak sepenuhnya pasti. Dalam konteks daging yang menyusut, kata ini paling mungkin menggambarkan tulang yang menjadi terbuka atau menonjol.
- source_word: עַצְמוֹתָיו
  choice: tulang-tulangnya
  rationale: Terjemahan langsung bentuk jamak dengan sufiks orang ketiga tunggal maskulin.
- source_word: לֹא רֻאּוּ
  choice: yang dahulu tidak tampak
  rationale: Bentuk pasif dari ראה dengan negasi menyatakan bahwa tulang-tulang itu sebelumnya tidak terlihat; “dahulu” memperjelas kontras waktu yang tersirat tanpa mengubah gambaran dasarnya.
