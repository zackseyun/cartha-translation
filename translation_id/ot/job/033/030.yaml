  register: Bahasa Indonesia baku modern dengan susunan puitis yang tetap mudah dipahami. “Liang” dipertahankan tanpa pelengkap agar ambiguitas antara lubang, kubur, dan kebinasaan tidak dihilangkan; catatan kaki menjelaskan pilihan penafsirannya.
