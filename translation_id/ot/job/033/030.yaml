  text: לְ/הָשִׁ֣יב נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת לֵ֝/א֗וֹר בְּ/א֣וֹר הַֽ/חַיִּים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: id
  text: untuk membawa jiwanya[a] kembali dari liang[b], agar ia diterangi[c] oleh cahaya kehidupan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyawanya” atau “dirinya”; kata Ibrani nefesh dapat berarti jiwa, nyawa, kehidupan, atau diri.
    reason: lexical_alternative
  - marker: b
    text: Atau “kubur” atau “kebinasaan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “agar ia melihat terang” atau “agar ia dibawa kepada terang.” Ungkapan Ibraninya ringkas dan puitis.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: membawa ... kembali
  rationale: Bentuk Hifil infinitif dari שוב menyatakan tindakan kausatif untuk mengembalikan. Susunan ini mempertahankan gambaran konkret tentang membawa kembali, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: נַפְשׁוֹ
  choice: jiwanya
  rationale: נפש dapat berarti jiwa, nyawa, kehidupan, atau diri. “Jiwanya” mempertahankan keluasan antropologis dan nuansa puitis teks, sedangkan kemungkinan makna “nyawanya” dicatat dalam catatan kaki.
- source_word: מִנִּי שָׁחַת
  choice: dari liang
  rationale: שחת dapat menunjuk pada liang, kubur, atau kebinasaan. “Liang” mempertahankan citra konkret bahasa Ibrani tanpa menetapkan apakah yang dimaksud secara khusus adalah kubur atau kebinasaan.
- source_word: לֵאוֹר
  choice: agar ia diterangi
  rationale: Ungkapan Ibrani ini ringkas dan eliptis. Bentuk tujuan “agar ia diterangi” menghubungkan penyelamatan dari liang dengan masuknya orang itu ke dalam terang, sambil mempertahankan akar citra אור.
- source_word: בְּאוֹר הַחַיִּים
  choice: oleh cahaya kehidupan
  rationale: Preposisi ב dapat bernuansa sarana atau lingkungan. “Oleh cahaya kehidupan” sesuai dengan bentuk pasif “diterangi” dan mempertahankan ungkapan puitis Ibrani tanpa menjabarkannya secara berlebihan.
