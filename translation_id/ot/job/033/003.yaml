translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kata “tampak” dipakai untuk mengungkapkan hubungan eliptis dalam klausa pertama tanpa menyatakan secara lebih tegas bahwa kata-kata itu ‘berasal’ dari hati. Ambiguitas בָּרוּר dijaga melalui catatan kaki.
