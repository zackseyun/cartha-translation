  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: id
  text: Kelurusan hatiku tercermin dalam kata-kataku, dan bibirku mengucapkan pengetahuan dengan jelas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bibirku mengucapkan pengetahuan yang murni” atau “bibirku mengatakan dengan terus terang apa yang kuketahui.” Kata Ibrani yang diterjemahkan “dengan jelas” juga dapat mengandung arti kemurnian atau keterusterangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: ketulusan
  rationale: Nomina ini menunjuk pada kelurusan atau integritas batin. Dalam bahasa Indonesia modern, “ketulusan” secara alami menyatakan kejujuran dan ketidakberpihakan hati Elihu tanpa memakai ungkapan kaku “kelurusan hati”.
- source_word: לִבִּי
  choice: hatiku
  rationale: Mempertahankan idiom antropologis Ibrani bagi pusat pikiran, kehendak, dan batin, serta paralelisme puitis dengan “bibirku”.
- source_word: אֲמָרַי
  choice: kata-kataku
  rationale: Padanan langsung dan alami untuk bentuk jamak yang menunjuk pada perkataan Elihu.
- source_word: וְדַעַת
  choice: pengetahuan
  rationale: Mempertahankan nomina abstrak sebagai isi yang disampaikan oleh bibirnya, tanpa mempersempitnya menjadi sekadar pemahaman.
- source_word: שְׂפָתַי
  choice: bibirku
  rationale: Metonimia puitis sumber dipertahankan dan membentuk pasangan dengan “hatiku”.
- source_word: בָּרוּר
  choice: dengan jelas
  rationale: Bentuk ini dapat menyatakan kejernihan, kemurnian, atau keterusterangan. Dalam konteks ujaran, “dengan jelas” merupakan padanan Indonesia yang paling alami, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: מִלֵּלוּ
  choice: menyampaikan
  rationale: Verba ini berarti berbicara atau mengucapkan. “Menyampaikan” terdengar alami dengan objek “pengetahuan” dan tetap menyatakan tindakan berbicara melalui bibir.
