  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: id
  text: Perhatikanlah, Ayub; dengarkan aku. Diamlah, dan aku akan berbicara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: Perhatikanlah
  rationale: Bentuk imperatif Hifil dari קשׁב menuntut perhatian dalam mendengarkan; “Perhatikanlah” alami dalam bahasa Indonesia modern dan mempertahankan kekuatan perintah.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: שְׁמַע לִי
  choice: dengarkan aku
  rationale: שׁמע dengan ל menunjukkan tindakan mendengarkan yang diarahkan kepada seseorang; “dengarkan aku” merupakan padanan Indonesia yang langsung dan idiomatis.
- source_word: הַחֲרֵשׁ
  choice: Diamlah
  rationale: Imperatif ini menyuruh lawan bicara untuk tidak berbicara; “Diamlah” ringkas, wajar, dan sesuai dengan konteks Elihu yang hendak melanjutkan perkataannya.
- source_word: וְאָנֹכִי
  choice: dan aku
  rationale: Konjungsi sederhana diikuti pronomina orang pertama yang eksplisit. Padanan ini mempertahankan urutan serta penegasan subjek dalam bahasa sumber.
- source_word: אֲדַבֵּר
  choice: akan berbicara
  rationale: Bentuk imperfek Piel menyatakan tindakan yang hendak dilakukan Elihu sesudah perintah agar Ayub diam; “akan berbicara” jelas dan alami.
