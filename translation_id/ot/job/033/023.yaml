  text: אִם יֵ֤שׁ עָלָ֨י/ו מַלְאָ֗ךְ מֵלִ֗יץ אֶחָ֥ד מִנִּי אָ֑לֶף לְ/הַגִּ֖יד לְ/אָדָ֣ם יָשְׁרֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: id
  text: Jika ada baginya seorang malaikat[a], seorang penengah, satu di antara seribu, untuk memberitahukan kepada orang itu apa yang benar baginya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang malaikat, seorang penafsir” atau “seorang utusan, seorang penengah.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “kelurusannya”; dapat juga berarti “apa yang benar dalam perkaranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ
  choice: Jika ada
  rationale: Mempertahankan bentuk syarat atau kemungkinan yang diperkenalkan oleh אִם dan makna eksistensial יֵשׁ.
- source_word: עָלָיו
  choice: baginya
  rationale: Dalam konteks ini, preposisi tersebut menyatakan hubungan dengan orang yang sedang dibicarakan dan dapat menyiratkan tindakan demi kepentingannya, tanpa mempertegas fungsi perantaraan melebihi teks.
- source_word: מַלְאָךְ
  choice: malaikat
  rationale: Konteks mengarah pada utusan surgawi, tetapi kata Ibrani juga dapat berarti 'utusan'; alternatif itu dipertahankan dalam catatan kaki.
- source_word: מֵלִיץ
  choice: penengah
  rationale: Istilah ini dapat menunjuk pada orang yang menafsirkan, menjadi juru bicara, atau menengahi. 'Penengah' cukup luas untuk menyampaikan fungsi perantara tanpa menentukan identitasnya.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: satu di antara seribu
  rationale: Ungkapan ini dipertahankan secara alami dalam bahasa Indonesia dan menyampaikan kelangkaan atau keistimewaan tokoh tersebut.
- source_word: לְהַגִּיד
  choice: untuk memberitahukan
  rationale: Bentuk infinitif menyatakan tujuan tindakan sang penengah; 'memberitahukan' jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: לְאָדָם
  choice: kepada orang itu
  rationale: אָדָם di sini menunjuk kepada individu yang sedang dibicarakan dalam konteks, bukan umat manusia secara kolektif.
- source_word: יָשְׁרוֹ
  choice: apa yang benar baginya
  rationale: Bentuk dari akar ישר dengan sufiks orang ketiga dapat dipahami sebagai apa yang lurus atau benar dalam perkaranya. Terjemahan ini alami dan tetap mempertahankan hubungan sufiks dengan orang tersebut; kemungkinan yang lebih harfiah dicatat.
theological_decisions:
- issue: Identitas dan fungsi מַלְאָךְ מֵלִיץ
  choice: Diterjemahkan secara umum sebagai 'seorang malaikat, seorang penengah'.
  alternative: Seorang utusan atau penafsir manusia; atau perantara surgawi dengan makna teologis yang lebih khusus.
  rationale: Ayat ini tidak mengidentifikasi tokoh itu secara lebih khusus. Terjemahan tidak memasukkan angelologi atau pembacaan kristologis yang tidak dinyatakan secara eksplisit oleh teks.
- issue: Makna יָשְׁרוֹ
  choice: apa yang benar baginya
  alternative: kelurusannya atau kebenarannya
  rationale: Frasa Ibrani dapat menunjuk pada kelurusan orang tersebut atau pada apa yang benar dan patut dalam perkaranya. Terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan kemungkinan formalnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan aposisional mempertahankan hubungan antara 'malaikat' dan 'penengah', sedangkan catatan kaki menjaga ambiguitas leksikal dan teologis teks Ibrani.
