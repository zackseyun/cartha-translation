  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: id
  text: Jiwanya mendekati liang[a], dan hidupnya kepada para pembawa maut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur” atau “kebinasaan” untuk “liang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang mati” atau “para pelaku maut”; ungkapan Ibraninya sulit dan dapat menunjuk pada agen pembawa maut ataupun ranah atau kuasa kematian.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: mendekat
  rationale: Berasal dari קרב, ‘datang mendekat/mendekati’. Bentuk kini sesuai dengan uraian puitis Elihu tentang keadaan orang yang sedang menderita dan selaras dengan konteks ayat-ayat di sekitarnya.
- source_word: לַשַּׁחַת
  choice: ke liang kebinasaan
  rationale: שַׁחַת dapat menunjuk pada liang, kubur, atau kebinasaan. ‘Liang kebinasaan’ mempertahankan gambaran konkret sekaligus menyampaikan ancaman maut tanpa mempersempitnya hanya menjadi kubur fisik.
- source_word: נַפְשׁוֹ
  choice: jiwanya
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, diri, atau pribadi. ‘Jiwanya’ mempertahankan perbedaan puitis dengan ‘hidupnya’ pada larik kedua tanpa menetapkan antropologi teknis.
- source_word: וְחַיָּתוֹ
  choice: dan hidupnya
  rationale: Dalam konteks ini kata tersebut menunjuk pada kehidupan atau keberadaan yang hidup. ‘Hidupnya’ merupakan padanan Indonesia yang alami dan cocok dengan paralelismenya.
- source_word: לַמְמִתִים
  choice: kepada para pembawa maut
  rationale: Ungkapan ini paling mungkin dipahami secara aktif atau kausatif sebagai ‘mereka yang menyebabkan kematian’. ‘Para pembawa maut’ mempertahankan daya partisipialnya tanpa secara khusus menjadikannya algojo manusia; kesulitan dan kemungkinan bacaan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Nuansa antropologis נַפְשׁוֹ dan וְחַיָּתוֹ dalam paralelisme
  choice: Pasangan itu diterjemahkan ‘jiwanya’ dan ‘hidupnya’ tanpa menyiratkan dualisme tubuh-jiwa yang ketat.
  alternative: Keduanya dapat diratakan menjadi ‘nyawanya’ dan ‘hidupnya’, atau ‘jiwa’ dapat ditafsirkan sebagai unsur nonjasmani yang bersifat teknis.
  rationale: Ayat ini bersifat puitis dan memakai paralelisme yang hampir sinonim. Terjemahan mempertahankan perbedaan leksikal tanpa memaksakan rumusan doktrinal tentang susunan manusia.
- issue: Identitas לַמְמִתִים
  choice: Diterjemahkan sebagai agen atau kuasa yang membawa maut, tanpa menentukan apakah mereka manusia atau kuasa kematian.
  alternative: Ungkapan itu dapat dipahami sebagai ‘orang-orang mati’ atau sebagai ranah kematian.
  rationale: Bentuk Ibraninya sulit dan memungkinkan lebih dari satu pemahaman. Teks utama mempertahankan makna aktif yang paling langsung, sedangkan kemungkinan lain dicatat tanpa menyelesaikan ketegangan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. ‘Liang kebinasaan’ mempertahankan citra konkret Ibrani, sedangkan ‘para pembawa maut’ sengaja tidak menentukan identitas agen tersebut.
