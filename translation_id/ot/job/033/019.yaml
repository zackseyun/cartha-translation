base_translation:
  language: en
  yaml_path: translation/ot/job/033/019.yaml
  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: id
  text: Ia juga ditegur melalui rasa sakit di tempat tidurnya dan melalui pergulatan yang tak kunjung reda[a] dalam tulang-tulangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pergulatan hebat dalam tulang-tulangnya.” Kata sifat Ibrani dapat berarti “tetap/terus berlangsung” atau “kuat/hebat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: Ia juga ditegur
  rationale: Bentuk Hofal dari יכח menyatakan bahwa orang itu ditegur atau dikoreksi. “Ditegur” mempertahankan nuansa korektif tanpa secara berlebihan menjadikannya hukuman. Kata “juga” menghubungkan ayat ini dengan cara Allah berbicara yang disebut sebelumnya.
- source_word: בְּמַכְאוֹב
  choice: melalui rasa sakit
  rationale: מַכְאוֹב berarti rasa sakit atau penderitaan. “Melalui” menyampaikan fungsi instrumental ב secara wajar dalam bahasa Indonesia dan tetap mempertahankan gambaran penderitaan jasmani.
- source_word: עַל מִשְׁכָּבוֹ
  choice: di tempat tidurnya
  rationale: Frasa ini menunjukkan tempat dan keadaan orang yang terbaring karena penderitaan. “Di tempat tidurnya” merupakan ungkapan Indonesia yang langsung dan alami.
- source_word: וְרִיב
  choice: dan melalui pergulatan
  rationale: רִיב biasanya berarti perselisihan, pertentangan, atau pergulatan. Dalam hubungannya dengan tulang-tulang, kata ini dipahami secara metaforis sebagai pergulatan jasmani atau rasa nyeri yang hebat di dalam tubuh.
- source_word: עֲצָמָיו
  choice: dalam tulang-tulangnya
  rationale: Terjemahan harfiah “tulang-tulangnya” dipertahankan karena menunjuk pada bagian terdalam dari tubuh dan mengungkapkan penderitaan jasmani yang mendalam. Kata “dalam” membuat hubungan metaforisnya dengan “pergulatan” jelas dan alami dalam bahasa Indonesia.
- source_word: אֵתָן
  choice: yang tak kunjung reda
  rationale: אֵתָן dapat berarti tetap, berlangsung terus, atau kuat. Dalam konteks ini, “tak kunjung reda” mengungkapkan penderitaan yang bertahan terus. Kemungkinan arti “hebat/kuat” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Hakikat penderitaan sebagai tindakan ilahi
  choice: Penderitaan disajikan sebagai sarana teguran atau koreksi ilahi tanpa merumuskan doktrin pembalasan yang lengkap.
  alternative: Penderitaan itu semata-mata hukuman Allah, atau hanya penyakit alamiah tanpa tindakan ilahi.
  rationale: Dalam perkataan Elihu, penderitaan berfungsi sebagai salah satu cara Allah menyapa manusia. “Ditegur” mempertahankan fungsi korektif itu tanpa mempersempit maknanya menjadi hukuman retributif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat menjaga gambaran konkret tentang tempat tidur dan tulang-tulang, sedangkan “pergulatan” mempertahankan metafora bahasa Ibrani tanpa terdengar seperti perselisihan antarmanusia.
