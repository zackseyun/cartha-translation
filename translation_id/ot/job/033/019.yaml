  source_fidelity: 'Terjemahan mengikuti unsur-unsur utama teks Ibrani: bentuk pasif korektif וְהוּכַח diterjemahkan “ditegur”; בְּמַכְאוֹב sebagai sarana (“melalui rasa sakit”); lokasi עַל מִשְׁכָּבוֹ; serta gambaran metaforis רִיב yang terkait dengan tulang-tulang. “Yang tak kunjung reda” menyampaikan kemungkinan utama אֵתָן, yakni keadaan yang terus berlangsung, tanpa menutup alternatif “kuat/hebat.”'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada puitis secukupnya. “Pergulatan ... dalam tulang-tulangnya” mempertahankan ketakterbiasaan metafora sumber tetapi masih dapat dipahami sebagai penderitaan batiniah/jasmaniah yang mendalam. Pengulangan “melalui” memperjelas hubungan instrumental dalam kalimat pasif.
  terminology: “Ditegur” tepat untuk nuansa korektif tanpa mengubahnya menjadi penghukuman retributif. “Rasa sakit,” “tempat tidurnya,” dan “tulang-tulangnya” adalah padanan yang tepat dan konsisten dengan register modern standar. Catatan kaki secara tepat melestarikan ambiguitas leksikal אֵתָן.
