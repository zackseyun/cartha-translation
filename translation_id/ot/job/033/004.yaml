id: JOB.33.4
reference: Job 33:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: id
  text: Roh Allah telah menjadikan aku[a], dan napas Yang Mahakuasa memberi aku hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Napas Allah telah menjadikan aku.” Kata Ibrani רוּחַ juga dapat berarti “napas” atau “angin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Roh
  rationale: Dalam rangkaian רוּחַ אֵל dan kesejajarannya dengan 'napas Yang Mahakuasa', kata ini menunjuk pada daya hidup yang berasal dari Allah. 'Roh' mempertahankan pembedaan puitis dari נִשְׁמַת, sedangkan catatan kaki menjaga kemungkinan arti 'napas'.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini merupakan sebutan bagi Allah dan sejajar dengan שַׁדַּי. 'Allah' adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: עָשָׂתְנִי
  choice: telah menjadikan aku
  rationale: Kata kerja עשה pada dasarnya berarti 'membuat/menjadikan'. Bentuk 'telah menjadikan aku' menyatakan tindakan yang sudah terjadi dan tetap relevan, tanpa menambahkan gambaran khusus seperti 'membentuk'.
- source_word: נִשְׁמַת
  choice: napas
  rationale: נשמה menunjuk pada napas sebagai napas kehidupan. 'Napas' mempertahankan citra penciptaan dan kesejajaran dengan רוּחַ.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Ini adalah padanan Indonesia yang lazim bagi gelar ilahi שַׁדַּי dan sesuai dengan konteks kitab Ayub.
- source_word: תְּחַיֵּנִי
  choice: memberi aku hidup
  rationale: Bentuk intensif/kausatif dari חיה di sini berarti menyebabkan hidup. 'Memberi aku hidup' alami, jelas, dan sesuai dengan kesejajaran tentang penciptaan serta pemberian kehidupan.
theological_decisions:
- issue: Apakah רוּחַ אֵל diterjemahkan sebagai 'Roh Allah' atau 'napas Allah'
  choice: Roh Allah
  alternative: napas Allah
  rationale: Kesejajaran dengan 'napas Yang Mahakuasa' mengacu pada karya Allah yang menciptakan dan memberi hidup. 'Roh Allah' mempertahankan perbedaan leksikal antara רוּחַ dan נִשְׁמַת tanpa menutup kemungkinan bahwa רוּחַ juga dapat berarti 'napas'; kemungkinan itu dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa mempertahankan kesejajaran puisi Ibrani. Kapitalisasi 'Roh' mengikuti rujukannya kepada Allah, tetapi ambiguitas leksikal asli tetap dijaga melalui catatan kaki.
