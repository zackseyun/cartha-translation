translation:
  language: id
  text: Mengapa engkau berbantah dengan Dia karena Dia tidak memberi jawaban mengenai segala perkara-Nya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena Dia tidak menjawab semua perkataannya.” Dalam bahasa Ibrani, kata ganti “-nya” dapat merujuk kepada Allah (“segala perkara-Nya”) atau kepada orang yang berbantah (“semua perkataannya”).
    reason: Mempertahankan ketaksaan referen kata ganti dalam דְּבָרָיו dan kemungkinan arti “perkataan” atau “perkara” bagi דָּבָר.
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Menyampaikan pertanyaan langsung mengenai alasan.
- source_word: אֵלָיו רִיבוֹתָ
  choice: engkau berbantah dengan Dia
  rationale: ריב dengan preposisi אֶל menyatakan tindakan berselisih atau mengajukan perkara terhadap seseorang; bentuk orang kedua tunggal dipertahankan.
- source_word: כִּי
  choice: karena
  rationale: Dipahami secara kausal, sesuai konteks keluhan bahwa Allah tidak menjawab.
- source_word: כָל דְּבָרָיו
  choice: satu pun perkataan manusia
  rationale: Dalam cakupan negasi, כָל wajar diterjemahkan 'satu pun'. Ketiv דְּבָרָיו secara harfiah 'perkataan-perkataannya', tetapi referen pronomina ambigu; 'manusia' dipakai dalam teks demi kejelasan dengan catatan kaki yang menjaga alternatif.
- source_word: לֹא יַעֲנֶה
  choice: Dia tidak menjawab
  rationale: Subjek tersirat dipahami sebagai Allah, mengikuti konteks dan bentuk maskulin tunggal.
theological_decisions:
- issue: Referen pronomina pada דְּבָרָיו
  choice: manusia, yakni perkataan orang yang berbantah dengan Allah
  alternative: 'Allah: ''Dia tidak memberi pertanggungjawaban atas segala tindakan-Nya'' atau ''tidak menjawab mengenai segala perkara-Nya'''
  rationale: Teks Ibrani memungkinkan ketegangan referensial. Konteks dekat tentang Allah yang berbicara tetapi manusia tidak memperhatikannya (ayat 14) mendukung pengertian bahwa Allah tidak menjawab setiap perkataan/keluhan manusia, tetapi alternatif yang merujuk kepada Allah tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan bermartabat. Kapitalisasi 'Dia' menandai bahwa subjek tersirat adalah Allah. 'Berbantah' mempertahankan nuansa sengketa dari ריב tanpa terdengar terlalu teknis.
