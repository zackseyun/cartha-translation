  text: then he opens the ears of men and seals their instruction[a].
translation:
  language: id
  text: Pada waktu itu Ia membuka telinga manusia dan memeteraikan didikan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memeteraikan peringatan mereka,” atau “memeteraikan disiplin mereka.” Kata Ibrani מוּסָר dapat berarti didikan, teguran, disiplin, atau peringatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: pada waktu itu
  rationale: Keterangan waktu ini menghubungkan tindakan Allah dengan mimpi dan penglihatan malam pada ayat-ayat sebelumnya. Frasa ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: יִגְלֶה אֹזֶן
  choice: membuka telinga
  rationale: Secara harfiah verba גלה berarti menyingkapkan atau membuka. Bersama אֹזֶן, ungkapan ini menggambarkan dibuatnya seseorang mampu menerima atau memperhatikan perkataan.
- source_word: אֲנָשִׁים
  choice: manusia
  rationale: Kata jamak ini menunjuk kepada manusia sebagai golongan dalam konteks umum. 'Manusia' merupakan padanan Indonesia yang wajar tanpa mempersempit acuan kepada laki-laki saja.
- source_word: וּבְמֹסָרָם
  choice: didikan bagi mereka
  rationale: מוּסָר mencakup didikan, teguran, disiplin, atau peringatan. Sufiks orang ketiga jamak dipahami sebagai pihak penerima didikan; 'bagi mereka' lebih alami daripada 'didikan mereka' dan tidak menyiratkan bahwa didikan itu berasal dari mereka.
- source_word: יַחְתֹּם
  choice: memeteraikan
  rationale: חתם mempertahankan metafora tindakan menyegel, menetapkan, atau menanamkan dengan kuat. 'Memeteraikan' bernada pantas dan dapat digunakan dengan objek abstrak berupa didikan.
