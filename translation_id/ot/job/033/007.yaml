translation:
  language: id
  text: Lihatlah, kengerian yang berasal dariku tidak akan membuatmu gentar, dan tanganku[a] atasmu tidak akan memberatkanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “tanganku” sulit dipastikan. Secara harfiah mungkin menunjuk pada tangan atau telapak tangan; dalam konteks ini juga dapat menyiratkan tekanan atau beban yang dikenakan atas seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel penunjuk ini menarik perhatian dan menegaskan jaminan Elihu. “Lihatlah” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya retorisnya.
- source_word: אֵמָתִי
  choice: kengerian yang berasal dariku
  rationale: Nomina ini menyatakan kengerian atau kedahsyatan yang dikaitkan dengan Elihu. Ungkapan ini mempertahankan nuansa objektifnya tanpa memberi kesan bahwa Elihu sendiri sedang merasa ngeri.
- source_word: תְבַעֲתֶךָ
  choice: tidak akan membuatmu gentar
  rationale: Bentuk piel dari בעת berarti sangat menakutkan atau menggentarkan. “Membuatmu gentar” wajar, jelas, dan sesuai dengan konteks jaminan.
- source_word: אַכְפִּי
  choice: tekananku
  rationale: Kata yang sulit ini paling mungkin menunjuk pada tekanan atau beban yang dikenakan kepada seseorang. “Tekananku” sesuai dengan pasangan predikat “tidak akan terasa berat”, sementara kemungkinan gambaran tradisional tentang tangan dicatat dalam catatan kaki.
- source_word: עָלֶיךָ
  choice: atasmu
  rationale: Padanan ini mempertahankan gambaran sesuatu yang dikenakan pada atau berada di atas Ayub.
- source_word: יִכְבָּד
  choice: tidak akan terasa berat
  rationale: Kata kerja כבד secara harfiah berarti “menjadi berat”. Rumusan ini mempertahankan citra berat sekaligus terdengar alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk orang kedua tunggal dipertahankan melalui akhiran “-mu”. Citra kengerian, tekanan, dan berat dijaga sedekat mungkin dengan bahasa Ibrani tanpa menghasilkan kalimat yang kaku.
