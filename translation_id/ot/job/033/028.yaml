  variant: modern standard Indonesian
source:
  edition: WLC
  text: פָּדָ֣ה נפש/י מֵ/עֲבֹ֣ר בַּ/שָּׁ֑חַת ו/חית/י בָּ/א֥וֹר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: id
  text: Dia telah menebus jiwaku agar tidak masuk ke dalam lubang[a][b], dan hidupku akan memandang terang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah membebaskan nyawaku agar tidak turun ke liang kubur.”
    reason: lexical_alternative
  - marker: b
    text: “Lubang” merupakan gambaran Ibrani yang umum untuk kematian atau kubur.
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: telah menebus
  rationale: Kata kerja ini menyatakan tindakan membebaskan atau menyelamatkan dari bahaya. “Menebus” mempertahankan gambaran konkret tanpa menyatakan secara eksplisit bahwa suatu harga telah dibayar.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, atau diri. “Jiwaku” mempertahankan perbedaan puitis dengan חַיָּתִי (“hidupku”) pada baris berikutnya.
- source_word: מֵעֲבֹר
  choice: agar tidak masuk ke dalam
  rationale: Gabungan preposisi dan infinitif menyatakan dicegahnya seseorang dari menyeberang atau masuk. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan gerak menuju lubang.
- source_word: בַּשַּׁחַת
  choice: lubang
  rationale: שַׁחַת secara konkret berarti lubang dan dalam puisi dapat melambangkan kematian, kubur, atau kebinasaan. “Lubang” mempertahankan metafora tanpa membatasi maknanya.
- source_word: וְחַיָּתִי
  choice: dan hidupku
  rationale: Nomina ini menunjuk pada hidup atau keberadaan yang hidup. “Hidupku” menjaga kesejajaran puitis dengan “jiwaku”.
- source_word: בָּאוֹר
  choice: terang
  rationale: Frasa ini menunjuk pada terang, yang dalam konteks berlawanan dengan lubang dan kematian. Bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: תִּרְאֶה
  choice: akan memandang
  rationale: Bentuk imperfek dapat dipahami sebagai tindakan mendatang. “Akan memandang” cocok dengan ungkapan puitis tentang mengalami kembali terang kehidupan.
theological_decisions:
- issue: Subjek kata kerja perfektum pembuka
  choice: Dia telah menebus jiwaku
  alternative: Dia menebus jiwaku; jiwaku telah ditebus-Nya
  rationale: Teks Ibrani memakai kata kerja orang ketiga maskulin tunggal tanpa menyebut subjeknya. Konteks menunjuk kepada Allah, tetapi terjemahan memakai “Dia” dan tidak menambahkan nama “Allah” yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan kalimat dibuat alami tanpa menghilangkan kesejajaran antara “jiwaku” dan “hidupku” maupun metafora lubang dan terang.
