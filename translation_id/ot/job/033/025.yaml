translation:
  language: id
  text: Dagingnya menjadi lebih segar daripada ketika ia masih muda[a]; ia kembali ke hari-hari mudanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dagingnya menjadi segar seperti daging seorang anak muda” atau “dagingnya menjadi lebih segar daripada daging seorang anak muda.” Kata kerja Ibraninya langka, dan frasa perbandingan dengan masa muda dapat dipahami dengan beberapa cara.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia kembali ke masa mudanya.” Kata Ibrani yang digunakan dapat menunjuk pada masa muda itu sendiri atau pada kekuatan yang menyertainya.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: menjadi lebih segar
  rationale: Kata kerja yang langka ini menunjuk pada keadaan yang kembali segar atau subur. Ungkapan ini mempertahankan gambaran jasmani yang konkret tanpa mempersempitnya menjadi sekadar pemulihan umum.
- source_word: בְּשָׂרוֹ
  choice: dagingnya
  rationale: Padanan langsung ini mempertahankan penekanan Ibrani pada pemulihan fisik; dalam konteks ini, bentuk berakhiran -nya juga terdengar wajar dalam bahasa Indonesia.
- source_word: מִנֹּעַר
  choice: daripada pada masa mudanya
  rationale: 'Preposisi מִן dipahami secara komparatif: daging orang itu menjadi lebih segar daripada keadaannya ketika muda. Karena frasa Ibrani dapat pula dibandingkan dengan seorang anak muda, kemungkinan itu dicatat dalam catatan kaki.'
- source_word: יָשׁוּב
  choice: ia kembali
  rationale: Kata kerja maskulin tunggal paling wajar merujuk kepada orang yang sedang dipulihkan, bukan hanya kepada dagingnya.
- source_word: לִימֵי
  choice: ke hari-hari
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang kembali kepada hari-hari suatu tahap kehidupan.
- source_word: עֲלוּמָיו
  choice: kekuatan mudanya
  rationale: Nomina ini dapat menunjuk pada masa muda maupun daya hidup yang menyertainya. Dalam konteks pemulihan fisik, 'kekuatan mudanya' menyampaikan nuansa tersebut secara alami, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
