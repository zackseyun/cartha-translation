  text: If you are able[a], answer me; set your case in order before me; take your stand.
translation:
  language: id
  text: Jika engkau sanggup, jawablah aku; susunlah pembelaanmu[a] di hadapanku; tampillah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “susunlah perkataanmu di hadapanku.” Kata kerja Ibrani berarti “menata” atau “menyusun,” tanpa menyebutkan objeknya; yang dimaksud dapat berupa pembelaan Ayub atau, secara lebih umum, tanggapan yang telah disiapkannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Kata ini memperkenalkan tantangan bersyarat secara langsung dan wajar dalam bahasa Indonesia.
- source_word: תּוּכַל
  choice: engkau sanggup
  rationale: Bentuk dari יכל menyatakan kemampuan. “Sanggup” cocok dengan nada tantangan Elihu dan tetap alami.
- source_word: הֲשִׁיבֵנִי
  choice: jawablah aku
  rationale: Dalam konteks perdebatan, bentuk Hifil dari שוב secara idiomatis berarti memberi jawaban atau tanggapan.
- source_word: עֶרְכָה
  choice: susunlah pembelaanmu
  rationale: Kata kerja ערך berarti menata atau menyusun. Teks Ibrani tidak menyebut objeknya; “pembelaanmu” melengkapinya secara alami sesuai konteks perdebatan, sementara catatan kaki mempertahankan kemungkinan “perkataanmu”.
- source_word: לְפָנַי
  choice: di hadapanku
  rationale: Ungkapan ini secara langsung menyatakan keberadaan di depan pembicara dan mempertahankan suasana konfrontatif.
- source_word: הִתְיַצָּבָה
  choice: bersiaplah berdiri teguh
  rationale: Bentuk Hitpael dari יצב berarti menempatkan diri atau berdiri siap. Pilihan ini menyampaikan kesiapan menghadapi tantangan, bukan sekadar posisi tubuh.
theological_decisions:
- issue: Objek tersirat dari עֶרְכָה
  choice: pembelaanmu
  alternative: perkataanmu
  rationale: Konteksnya menyerupai perdebatan atau pengajuan perkara, tetapi bahasa Ibrani membiarkan objeknya tidak disebutkan. Alternatif yang lebih umum dipertahankan dalam catatan kaki agar ketaksaan asli tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau,” imperatif yang tegas, dan nuansa perdebatan yang bermartabat. Istilah “pembelaan” mempertahankan kemungkinan warna forensik tanpa menjadikannya istilah hukum teknis.
