id: JOB.33.12
reference: Job 33:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: id
  text: Lihat, dalam hal ini engkau tidak benar. Aku akan menjawabmu, sebab Allah lebih besar daripada manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “manusia fana.” Kata Ibrani אֱנוֹשׁ sering menyoroti kefanaan dan kerapuhan manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Lihat
  rationale: Partikel wacana ini mengarahkan perhatian dengan penegasan; “Lihat” alami dalam bahasa Indonesia modern dan mempertahankan daya serunya.
- source_word: זֹאת
  choice: dalam hal ini
  rationale: Kata tunjuk ini merujuk pada pokok yang sedang dibicarakan, sehingga “dalam hal ini” menyampaikan maksud idiomatisnya.
- source_word: לֹא צָדַקְתָּ
  choice: engkau tidak benar
  rationale: Dalam konteks perdebatan, צדק menyatakan bahwa seseorang berada atau tidak berada di pihak yang benar, bukan penilaian menyeluruh tentang kesalehan moralnya.
- source_word: אֶעֱנֶךָּ
  choice: Aku akan menjawabmu
  rationale: Bentuk imperfek orang pertama tunggal dengan akhiran orang kedua maskulin tunggal menunjuk pada jawaban yang akan Elihu berikan.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan yang mendasari jawaban Elihu.
- source_word: יִרְבֶּה
  choice: lebih besar
  rationale: Dengan preposisi komparatif מִן, verba רבה menyatakan keunggulan atau kebesaran relatif, bukan jumlah.
- source_word: אֱלוֹהַ
  choice: Allah
  rationale: Sebutan ilahi tunggal ini merujuk kepada Allah; “Allah” merupakan padanan baku dan langsung dalam bahasa Indonesia.
- source_word: מֵאֱנוֹשׁ
  choice: daripada manusia
  rationale: אֱנוֹשׁ menunjuk kepada insan, sering dengan nuansa kefanaan atau kerapuhan; “manusia” mempertahankan pertentangan umum antara Allah dan insan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna אֱנוֹשׁ dalam perbandingan antara Allah dan manusia
  choice: manusia
  alternative: manusia fana
  rationale: Konteks mengontraskan kebesaran Allah dengan insan secara umum. “Manusia” jelas dan alami, sedangkan nuansa kefanaan yang dapat terkandung dalam אֱנוֹשׁ dipertahankan dalam catatan kaki tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina “engkau” mempertahankan sapaan tunggal dalam konteks percakapan puitis; dua kalimat dipakai agar alur teguran dan alasannya terdengar alami.
