lexical_decisions:
- source_word: זַךְ
  choice: murni
  rationale: Kata sifat ini menyatakan kemurnian atau kebersihan secara moral. “Murni” alami dalam bahasa Indonesia dan membedakannya dari חַף pada klausa berikutnya.
- source_word: בְּלִי פָשַׁע
  choice: tanpa pelanggaran
  rationale: בְּלִי menyatakan ketiadaan, sedangkan פֶּשַׁע menunjuk pada pelanggaran atau pemberontakan. “Tanpa pelanggaran” mempertahankan nuansa moral-hukumnya tanpa mempersempitnya menjadi pemberontakan dalam arti tertentu.
- source_word: חַף
  choice: bersih
  rationale: Kata ini dapat berarti bersih atau bebas dari kesalahan. “Bersih” mempertahankan citra teks Ibrani, sedangkan kemungkinan makna yuridis “tidak bersalah” dicatat dalam catatan kaki.
- source_word: עָוֺן
  choice: kesalahan
  rationale: Kata ini dapat menunjuk pada perbuatan salah, kejahatan, atau keadaan bersalah. “Kesalahan” cukup luas untuk mempertahankan ketaksaan tersebut dalam konteks pengakuan diri Ayub.
- source_word: לִי
  choice: padaku
  rationale: Secara harfiah berarti “bagiku/kepadaku” dan di sini menyatakan sesuatu yang melekat atau dapat dikenakan kepada pembicara. “Padaku” mempertahankan bentuk atribusinya dengan bahasa Indonesia yang ringkas.
theological_decisions:
- issue: Kadar pengakuan Ayub tentang dirinya dalam kutipan Elihu
  choice: Pernyataan diterjemahkan langsung sebagai pengakuan kuat tentang kemurnian dan ketiadaan kesalahan.
  alternative: Melunakkannya menjadi “aku menganggap diriku murni” atau memperkuatnya dengan istilah yang secara eksplisit menyatakan ketidakberdosaan mutlak.
  rationale: Teks Ibrani memakai predikat langsung dan penyangkalan tegas. Terjemahan mempertahankan ketegangan teologis itu tanpa memutuskan apakah penilaian Ayub benar dan tanpa menambahkan rumusan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur paralel serta kekuatan pengakuan orang pertama dipertahankan. “Padaku” dipilih untuk mencerminkan atribusi dalam לִי tanpa menghasilkan susunan yang kaku.
