lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah sekarang
  rationale: הִנֵּה menarik perhatian kepada ucapan yang segera menyusul, sedangkan נָא memberi dorongan atau penegasan halus. Gabungan ini mempertahankan daya wacana Ibrani dalam bahasa Indonesia modern.
- source_word: פָּתַחְתִּי פִי
  choice: aku telah membuka mulutku
  rationale: Terjemahan harfiah ini tetap wajar dalam bahasa Indonesia serta mempertahankan ungkapan konkret Ibrani untuk mulai berbicara.
- source_word: דִּבְּרָה לְשׁוֹנִי
  choice: lidahku berbicara
  rationale: Bentuk verbal yang tidak lazim dipahami dengan לְשׁוֹנִי sebagai subjek feminin. Bentuk kini menyampaikan tindakan bicara yang sedang berlangsung tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: בְחִכִּי
  choice: di langit-langit mulutku
  rationale: חֵךְ secara khusus menunjuk pada langit-langit mulut. Terjemahan ini mempertahankan gambaran jasmani yang hidup dan agak tidak lazim dalam puisi Ibrani.
