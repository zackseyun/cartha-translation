  text: Lihatlah sekarang[a], aku telah membuka mulutku; lidahku telah berbicara di langit-langit mulutku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lihatlah, kumohon, aku telah membuka mulutku; lidahku telah berbicara di dalam mulutku.” Bagian akhir dalam bahasa Ibrani sangat konkret dan agak tidak lazim.
