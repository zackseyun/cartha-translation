  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: id
  text: Namun[a], Ayub, dengarkanlah perkataanku dan simaklah semua ucapanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tetapi sungguh.” Kata Ibrani ini menandai peralihan yang tegas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun sekarang
  rationale: Menandai peralihan yang tegas dalam pembicaraan Elihu. 'Namun' menyampaikan daya pertentangan, sedangkan 'sekarang' membuat fungsi peralihannya alami dalam bahasa Indonesia; unsur waktu tidak dinyatakan secara eksplisit dalam bahasa Ibrani sehingga alternatif dicatat dalam catatan kaki.
- source_word: שְׁמַע נָא
  choice: dengarkanlah
  rationale: Imperatif שׁמע meminta Ayub mendengar dengan sengaja, sedangkan נָא memperhalus permintaan. Akhiran '-lah' menghasilkan ajakan yang sopan dan wajar tanpa menambahkan kata yang terasa berlebihan.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: מִלָּי
  choice: perkataanku
  rationale: Bentuk jamak dengan sufiks orang pertama tunggal. 'Perkataanku' menyampaikan kumpulan kata atau hal yang diucapkan secara alami dalam konteks ini.
- source_word: וְכָל דְּבָרַי
  choice: dan segala ucapanku
  rationale: '''Segala'' mempertahankan cakupan menyeluruh כָּל. ''Ucapanku'' dekat maknanya dengan מִלָּי tetapi tidak identik secara bunyi, sehingga paralelisme sinonim tetap terasa.'
- source_word: הַאֲזִינָה
  choice: simaklah
  rationale: Imperatif Hifil dari אזן berarti memasang telinga atau mendengarkan dengan penuh perhatian. 'Simaklah' secara ringkas menyampaikan perhatian yang lebih intens daripada sekadar mendengar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Pasangan 'dengarkanlah' dan 'simaklah', serta 'perkataanku' dan 'ucapanku', mempertahankan dua ungkapan Ibrani yang hampir sejajar tanpa membuat kalimat terasa kaku.
