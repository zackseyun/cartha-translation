  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: id
  text: 'Sungguh, engkau telah berkata di telingaku,[a]

    dan bunyi kata-katamu kudengar:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani secara harfiah, “di telingaku, dan bunyi kata-kata kudengar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini bersifat menegaskan, bukan membatasi. “Sungguh” menyampaikan tekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: אָמַרְתָּ
  choice: engkau telah berkata
  rationale: Bentuk qatal orang kedua tunggal maskulin menunjuk pada ucapan yang sudah disampaikan Ayub dan kini dikutip kembali oleh Elihu.
- source_word: בְאָזְנִי
  choice: dalam pendengaranku
  rationale: Ungkapan Ibrani secara harfiah berarti “di telingaku”. Pilihan ini mempertahankan gagasan bahwa Elihu mendengarnya sendiri tanpa memakai ungkapan harfiah yang terlalu janggal dalam bahasa Indonesia.
- source_word: וְקוֹל
  choice: dan bunyi
  rationale: קוֹל dapat berarti “suara” atau “bunyi”. Di depan “kata-katamu”, “bunyi” mempertahankan penekanan indrawi dan menghindari frasa “suara kata-kata” yang kurang alami.
- source_word: מִלִּין
  choice: kata-katamu
  rationale: Bentuk jamak bercorak Aram ini berarti “kata-kata”. Akhiran milik orang kedua dinyatakan berdasarkan konteks, sebab yang didengar Elihu adalah ucapan Ayub.
- source_word: אֶשְׁמָע
  choice: kudengar
  rationale: Bentuk imperfek dapat diterjemahkan secara langsung tanpa penanda kala dalam bahasa Indonesia. Bentuk ringkas ini tetap membuka nuansa “aku mendengar” sekaligus cocok sebagai laporan tentang ucapan yang telah disampaikan.
