translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada puitis dan bermartabat. Susunan dua baris mempertahankan paralelisme Ibrani. Konjungsi וְ diterjemahkan 'sehingga' berdasarkan hubungan akibat dengan konteks sebelumnya. Penambahan 'menolak' pada baris kedua mengeksplisitkan verba eliptis yang dibagikan oleh kedua unsur sejajar.
