  text: so that his life loathes bread[b][a], and his soul desirable food.
translation:
  language: id
  text: 'sehingga hidupnya muak terhadap roti,

    dan jiwanya[a] terhadap makanan yang menggugah selera.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani “jiwanya”; kata ini juga dapat berarti “hidupnya”, “selera makannya”, atau “dirinya sendiri”, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “makanan pilihan”. Ungkapan Ibrani ini menunjuk makanan yang diinginkan atau menarik selera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: muak terhadap / menolak
  rationale: Bentuk verba dari זהם menyatakan rasa jijik atau enggan yang kuat. Bahasa Indonesia alami memakai 'muak terhadap' pada baris pertama; verba itu dipahami juga dalam baris sejajar dan diungkapkan sebagai 'menolak' agar maknanya jelas tanpa pengulangan kaku.
- source_word: חַיָּתוֹ
  choice: hidupnya
  rationale: Nomina ini secara harfiah berkaitan dengan hidup atau makhluk hidup. Dalam kesejajaran dengan נַפְשׁוֹ, 'hidupnya' mempertahankan ungkapan puitis dan tidak mempersempitnya menjadi 'selera makannya'.
- source_word: לָחֶם
  choice: roti
  rationale: Arti dasarnya ialah 'roti'. Pilihan konkret ini mempertahankan citraan Ibrani dan kontras dengan istilah makanan yang lebih umum pada baris kedua.
- source_word: נַפְשׁוֹ
  choice: jiwanya
  rationale: נפשׁ dapat menunjuk jiwa, kehidupan, diri, atau selera. 'Jiwanya' mempertahankan bahasa antropologis serta kesejajaran puisi, sementara catatan kaki menjelaskan keluasan maknanya.
- source_word: מַאֲכַל
  choice: makanan
  rationale: Istilah umum bagi sesuatu yang dimakan; 'makanan' merupakan padanan Indonesia yang alami dan cukup luas.
- source_word: תַּאֲוָה
  choice: yang menggugah selera
  rationale: Nomina ini menyatakan keinginan atau sesuatu yang diinginkan. Dalam konstruksi dengan 'makanan', frasa ini menunjuk makanan yang biasanya menarik atau diinginkan; ungkapan tersebut lebih alami daripada 'makanan yang diinginkan'.
