  yaml_path: translation/ot/job/033/033.yaml
  text: If not[a], then listen to me; be silent[b], and I will teach you wisdom.
translation:
  language: id
  text: Jika tidak, dengarkanlah aku[a]; diamlah[b], dan aku akan mengajarkan hikmat kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “simaklah perkataanku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tetaplah diam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אַיִן
  choice: Jika tidak
  rationale: 'Ungkapan ini menyatakan kondisi yang berlawanan dengan undangan pada ayat sebelumnya: jika Ayub tidak mempunyai jawaban, ia harus mendengarkan. Terjemahan ini ringkas dan mempertahankan daya kondisional teks Ibrani.'
- source_word: שְׁמַע לִי
  choice: dengarkanlah aku
  rationale: Kata שׁמע dengan ל menunjukkan tindakan mendengarkan dengan penuh perhatian kepada seorang pembicara. Bentuk imperatif dengan partikel -lah menyampaikan perintah secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: הַחֲרֵשׁ
  choice: diamlah
  rationale: Imperatif dari חרש di sini memerintahkan seseorang untuk tidak berbicara. 'Diamlah' lugas, alami, dan sesuai dengan nada perkataan Elihu.
- source_word: וַאֲאַלֶּפְךָ
  choice: dan aku akan mengajarkan ... kepadamu
  rationale: 'Bentuk piel dari אלף berarti mengajar atau memberi pengajaran. Bentuk waw dengan imperfek sesudah rangkaian perintah paling wajar dipahami sebagai hasil atau tindakan berikutnya: Elihu akan mengajar Ayub.'
- source_word: חָכְמָה
  choice: hikmat
  rationale: '''Hikmat'' merupakan padanan baku untuk חכמה dan mempertahankan kosakata tematis sastra hikmat tanpa mempersempit maknanya menjadi sekadar informasi atau nasihat.'
