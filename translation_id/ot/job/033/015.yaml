base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: id
  text: dalam mimpi, dalam penglihatan malam, ketika tidur lelap menimpa orang-orang, di kala mereka terlelap di tempat tidur,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: dalam mimpi
  rationale: Preposisi בְּ menandai suasana atau sarana ketika Allah berbicara; 'dalam mimpi' alami dalam bahasa Indonesia dan mempertahankan kesejajaran puitis.
- source_word: חֶזְיוֹן לַיְלָה
  choice: dalam penglihatan pada malam hari
  rationale: Frasa konstruksi ini secara harfiah berarti 'penglihatan malam'. Bentuk yang dipilih jelas dan alami, dengan 'dalam' dipasok untuk menghubungkannya secara sejajar dengan frasa sebelumnya.
- source_word: בִּנְפֹל
  choice: ketika ... tertidur
  rationale: Infinitif konstruksi dengan בְּ memperkenalkan keterangan waktu. Ungkapan harfiah 'ketika tidur lelap jatuh atas' dialihkan menjadi idiom Indonesia yang wajar.
- source_word: תַּרְדֵּמָה
  choice: tertidur lelap
  rationale: Kata ini menunjuk pada tidur yang dalam atau berat; 'tertidur lelap' mudah dipahami tanpa menafsirkannya sebagai keadaan ekstatis.
- source_word: עַל אֲנָשִׁים
  choice: orang-orang
  rationale: אֲנָשִׁים berbentuk maskulin jamak tetapi di sini merujuk secara umum kepada manusia. Bahasa Indonesia tidak mengharuskan pembedaan gender, sehingga 'orang-orang' menyampaikan cakupan leksikalnya tanpa kehilangan informasi yang relevan.
- source_word: בִּתְנוּמוֹת
  choice: ketika mereka terlelap
  rationale: Bentuk jamak puitis menunjuk pada keadaan-keadaan terlelap. Pengulangan 'terlelap' mempertahankan kesejajaran tanpa menghasilkan ungkapan Indonesia yang janggal seperti 'dalam tidur-tidur'.
- source_word: עֲלֵי מִשְׁכָּב
  choice: di tempat tidur
  rationale: Secara harfiah 'di atas tempat berbaring'. 'Di tempat tidur' merupakan padanan Indonesia yang alami; bentuk tunggal kolektif sumber dipertahankan.
theological_decisions:
- issue: Cakupan gender אֲנָשִׁים
  choice: orang-orang
  alternative: laki-laki
  rationale: Dalam konteks ini bentuk maskulin jamak berfungsi generik. 'Orang-orang' adalah padanan langsung dan alami dalam bahasa Indonesia, bukan penetralan atas kontras gender yang bermakna.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan puitis. Struktur temporal serta kesejajaran antara mimpi/penglihatan dan tidur lelap/terlelap dipertahankan. Tanda koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
