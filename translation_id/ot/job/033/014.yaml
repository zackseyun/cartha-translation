  text: כִּֽי בְ/אַחַ֥ת יְדַבֶּר אֵ֑ל וּ֝/בִ/שְׁתַּ֗יִם לֹ֣א יְשׁוּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: id
  text: Sebab Allah berbicara dengan satu cara[a], bahkan dengan dua cara, tetapi orang tidak menyadarinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab Allah berbicara sekali, bahkan dua kali, tetapi orang tidak memperhatikannya.” Bilangan dalam bahasa Ibrani dapat dipahami sebagai keterangan frekuensi (“sekali ... dua kali”) atau secara idiomatis sebagai cara yang berbeda (“dengan satu cara ... dengan dua cara”).
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal-penjelas yang menghubungkan ayat ini dengan alasan Elihu bahwa Allah memang berkomunikasi.
- source_word: בְאַחַת ... וּבִשְׁתַּיִם
  choice: dengan satu cara ... bahkan dengan dua cara
  rationale: Mengungkapkan pembacaan idiomatis tentang cara atau bentuk komunikasi sambil mempertahankan kesejajaran angka Ibrani. 'Bahkan' membuat perkembangan paralel itu alami dalam bahasa Indonesia.
- source_word: יְדַבֶּר
  choice: berbicara
  rationale: Bentuk imperfek menyatakan tindakan umum atau kebiasaan; bentuk kini Indonesia menyampaikan makna gnomic itu secara alami.
- source_word: אֵל
  choice: Allah
  rationale: Padanan standar bagi gelar ilahi אֵל dalam register Alkitab bahasa Indonesia, tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: לֹא יְשׁוּרֶנָּה
  choice: tetapi orang tidak menyadarinya
  rationale: שׁור di sini menunjuk pada kegagalan menangkap atau mengenali komunikasi Allah. 'Orang' menyampaikan subjek tunggal generik yang tersirat, sedangkan '-nya' mempertahankan objek feminin tunggal tanpa menentukannya secara berlebihan.
theological_decisions:
- issue: Subjek manusia yang tersirat dalam klausa terakhir
  choice: orang tidak menyadarinya
  alternative: ia tidak memperhatikannya; manusia tidak melihatnya
  rationale: Bahasa Ibrani memakai subjek maskulin tunggal yang tidak dinyatakan. 'Orang' mempertahankan sifat generik dan tidak mengkhususkan identitas atau jenis kelamin penerima.
- issue: Makna pasangan bilangan 'satu ... dua'
  choice: cara komunikasi
  alternative: sekali ... dua kali
  rationale: Konteks berikutnya memaparkan berbagai sarana Allah berbicara, tetapi bentuk Ibrani juga dapat menunjuk pada pengulangan. Ambiguitas asli dipertahankan melalui catatan kaki, bukan diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami, sementara paralelisme angka dan ambiguitas sumber Ibrani tetap dijaga melalui catatan kaki.
