  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: id
  text: Ia bernyanyi di hadapan orang-orang[a] dan berkata, “Aku telah berdosa dan membengkokkan apa yang benar, dan aku tidak menerima balasan yang setimpal.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Ia memandang orang-orang.'
    reason: יָשֹׁר memiliki penafsiran tekstual/leksikal yang diperdebatkan; sejumlah tradisi memahami bentuk ini sebagai “memandang” alih-alih “bernyanyi”.
  - marker: b
    text: 'Atau: dan itu tidak berguna bagiku.'
    reason: Ungkapan וְלֹא שָׁוָה לִי dapat dipahami sebagai tidak menerima balasan yang sepadan atau sebagai sesuatu yang tidak memberi manfaat.
lexical_decisions:
- source_word: יָשֹׁר
  choice: bernyanyi
  rationale: Dipahami sebagai bentuk dari akar שׁיר/שור dalam arti ‘bernyanyi’. Bentuk dan konteksnya juga memungkinkan penafsiran lain, sehingga alternatif dicatat dalam catatan kaki.
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: dan membengkokkan apa yang benar
  rationale: Mempertahankan kontras leksikal antara יָשָׁר (‘yang lurus/benar’) dan עוה (‘membengkokkan, memutarbalikkan’), sekaligus menghasilkan ungkapan Indonesia yang jelas.
- source_word: וְלֹא שָׁוָה לִי
  choice: tetapi aku tidak menerima balasan yang setimpal
  rationale: Menangkap gagasan bahwa akibat atau balasan yang sepadan tidak menimpa si pembicara. Karena שׁוה dapat pula dipahami dalam arti ‘berguna/berfaedah’, kemungkinan itu dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Hubungan antara pengakuan dosa dan balasan yang tidak diterima
  choice: Tidak menjelaskan secara eksplisit siapa yang menahan balasan atau mengapa balasan itu tidak diterima.
  alternative: Menambahkan bahwa Allah mengampuni atau tidak menghukum orang itu sebagaimana layaknya.
  rationale: Teks Ibrani hanya menyatakan bahwa balasan yang setimpal tidak diterima; identitas pelaku dan penjelasan teologisnya tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Membengkokkan apa yang benar’ sengaja mempertahankan citra konkret teks sumber, sedangkan ‘balasan yang setimpal’ menyampaikan ungkapan penutup secara alami tanpa menambahkan pelaku atau penjelasan teologis.
