  yaml_path: translation/ot/job/034/016.yaml
  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: id
  text: Jika engkau memiliki pengertian, dengarkanlah ini; simaklah suara perkataanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada suara perkataanku”; kata Ibrani yang diterjemahkan “suara” juga dapat berarti “bunyi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Gabungan konjungsi dan partikel syarat memperkenalkan seruan yang bergantung pada adanya pengertian pada pendengar. Dalam bahasa Indonesia modern, “Jika” sudah menyampaikan hubungan itu secara alami.
- source_word: בִּינָה
  choice: memiliki pengertian
  rationale: בִּינָה menunjuk pada pengertian atau daya memahami. Frasa “memiliki pengertian” memperjelas konstruksi eliptis Ibrani tanpa mempersempit maknanya menjadi kecerdasan semata.
- source_word: שִׁמְעָה
  choice: dengarkanlah
  rationale: Bentuk imperatif dari שׁמע menyampaikan perintah langsung. “Dengarkanlah” alami dalam bahasa Indonesia dan dapat dibedakan dari kata berikutnya yang menekankan perhatian saksama.
- source_word: זֹּאת
  choice: ini
  rationale: Kata penunjuk ini merujuk pada hal yang sedang disampaikan Elihu. “Ini” mempertahankan bentuk ringkas teks sumber tanpa menambahkan nomina penjelas.
- source_word: הַאֲזִינָה
  choice: simaklah
  rationale: Kata kerja ini menekankan tindakan mendengar dengan penuh perhatian. “Simaklah” membedakannya dari “dengarkanlah” pada klausa sebelumnya dan tetap wajar dalam bahasa Indonesia modern.
- source_word: לְקוֹל
  choice: suara
  rationale: קוֹל dapat berarti “suara” atau “bunyi”. Dalam hubungan dengan “perkataanku”, “suara” mempertahankan ungkapan konkret dan puitis bahasa Ibrani dengan lebih alami daripada “bunyi”.
- source_word: מִלָּי
  choice: perkataanku
  rationale: Nomina ini merujuk pada kata-kata atau ujaran yang diucapkan. “Perkataanku” menyampaikan makna kolektifnya secara ringkas dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan dua perintah mendengar dipertahankan dengan “dengarkanlah” dan “simaklah”, sedangkan ungkapan konkret “suara perkataanku” menjaga corak puitis teks Ibrani.
