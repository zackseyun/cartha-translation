  yaml_path: translation/ot/job/034/013.yaml
  text: Who appointed the earth over him[a], and who set the whole world in place?
translation:
  language: id
  text: Siapa yang menugaskan Dia atas bumi[a], dan siapa yang membebankan seluruh dunia kepada-Nya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Siapa yang memercayakan bumi kepada-Nya, dan siapa yang menaruh seluruh dunia di atas-Nya?” Kata Ibrani פקד dapat berarti mengangkat, menugaskan, atau memercayakan tanggung jawab; kata שׂים berarti menaruh atau menempatkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָקַד עָלָיו
  choice: mengangkat-Nya untuk berkuasa atas
  rationale: Dalam konteks ini, פקד dengan עַל menyatakan pemberian tugas, wewenang, atau tanggung jawab. Ungkapan ini menyampaikan pertanyaan retoris bahwa tidak ada pihak yang lebih tinggi yang mengangkat Allah sebagai penguasa bumi.
- source_word: אָרְצָה
  choice: bumi
  rationale: Kesejajarannya dengan תבל menunjukkan cakupan kosmis, bukan suatu wilayah atau negeri tertentu.
- source_word: שָׂם
  choice: menyerahkan
  rationale: Arti dasarnya ialah 'menaruh' atau 'menempatkan'. Dalam kesejajaran dengan klausa pertama, 'menyerahkan' secara alami menyatakan penempatan seluruh dunia dalam tanggung jawab-Nya, tanpa mengubah pertanyaan retorisnya.
- source_word: תֵּבֵל כֻּלָּהּ
  choice: seluruh dunia
  rationale: תבל menunjuk pada dunia yang teratur atau dihuni, sedangkan כֻּלָּהּ menegaskan keseluruhannya. 'Seluruh dunia' mempertahankan penekanan itu dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Acuan pronomina pada עָלָיו
  choice: Akhiran pronomina dipahami mengacu kepada Allah, sehingga diterjemahkan dengan '-Nya'.
  alternative: Pronomina dapat dipahami secara lebih abstrak atau susunannya diterjemahkan, 'Siapa yang memercayakan bumi kepada-Nya?'
  rationale: Dalam Ayub 34:10–15, Elihu menegaskan bahwa Allah tidak menerima wewenang dari penguasa yang lebih tinggi. Acuan kepada Allah paling sesuai dengan konteks langsung, sedangkan catatan kaki mempertahankan kemungkinan nuansa penugasan atau pemberian tanggung jawab.
- issue: Hubungan klausa kedua dengan klausa pertama
  choice: Klausa kedua dipahami meneruskan gagasan penyerahan tanggung jawab kepada Allah.
  alternative: שָׂם dapat diterjemahkan secara lebih harfiah sebagai 'menempatkan seluruh dunia', tanpa menyebut kepada siapa dunia ditempatkan.
  rationale: Paralelisme kedua klausa mendukung pelengkapan makna yang tersirat. Namun, karena unsur 'kepada-Nya' tidak diulang secara eksplisit dalam klausa kedua, alternatif yang lebih harfiah dicatat dalam penjelasan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Huruf kapital pada “-Nya” menandai bahwa pronomina merujuk kepada Allah. Bentuk pertanyaan retoris dan kesejajaran puitis dipertahankan.
