  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: id
  text: Dapatkah orang yang membenci keadilan memerintah?[a] Akankah engkau menyatakan Sang Perkasa yang adil bersalah?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkuasa,” “menahan,” atau secara lebih harfiah, “mengikat.” Dalam konteks ini, kata kerja Ibrani tersebut tampaknya mengandung arti menjalankan kekuasaan atau pengendalian.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang perkasa yang adil” atau “Yang Adil, Yang Perkasa.” Dalam konteks ini, frasa tersebut paling wajar dipahami sebagai rujukan kepada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: Dapatkah
  rationale: Partikel tanya dengan אַף membentuk pertanyaan retoris yang tegas. Dalam bahasa Indonesia, “Dapatkah” menyampaikan pertanyaan itu secara alami; nuansa penegas “bahkan” tersirat dalam konteks.
- source_word: שׂוֹנֵא
  choice: orang yang membenci
  rationale: Partisip ini dipakai secara substantival untuk menunjuk seseorang yang bercirikan kebencian terhadap sesuatu.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam pembicaraan tentang kelayakan memerintah dan tatanan moral, kata ini menunjuk pada keadilan, bukan hanya satu keputusan hukum.
- source_word: יַחֲבֹשׁ
  choice: memerintah
  rationale: Makna dasarnya ialah “mengikat,” tetapi dalam konteks ini kemungkinan besar dipakai untuk pelaksanaan kuasa atau pengendalian. “Memerintah” paling wajar dalam pertanyaan tentang pemerintahan yang adil.
- source_word: וְאִם
  choice: Akankah
  rationale: Konjungsi ini menghubungkan pertanyaan retoris kedua dengan yang pertama. Pemisahan menjadi dua kalimat tetap mempertahankan paralelismenya secara alami dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: yang benar
  rationale: Adjektiva ini menyatakan kelurusan moral. “Yang benar” mempertahankan bobot etisnya dan secara alami menerangkan “Sang Perkasa.”
- source_word: כַּבִּיר
  choice: Sang Perkasa
  rationale: Adjektiva yang disubstantivalkan ini berarti sosok yang besar atau perkasa. Bentuk “Sang Perkasa” menyampaikan rujukan yang kemungkinan besar ilahi tanpa memakai gelar teknis yang lebih kuat daripada teks Ibrani.
- source_word: תַּרְשִׁיעַ
  choice: menyatakan ... bersalah
  rationale: Bentuk Hifil dari רשע berarti menyatakan seseorang bersalah atau fasik. Ungkapan ini mempertahankan nuansa forensik yang selaras dengan “keadilan.”
theological_decisions:
- issue: Rujukan frasa צַדִּיק כַּבִּיר
  choice: Dipahami sebagai rujukan kepada Allah dan diterjemahkan “Sang Perkasa yang benar.”
  alternative: “orang perkasa yang benar” atau “Yang Benar, Yang Mahabesar,” tanpa memastikan rujukan ilahi.
  rationale: Alur argumen Elihu menekankan kemustahilan bahwa penguasa tertinggi membenci keadilan atau bahwa manusia dapat menyatakan Dia bersalah. Namun, catatan kaki mempertahankan kemungkinan gramatikal bahwa frasa itu dapat dibaca secara lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Dua pertanyaan retoris dibuat ringkas agar daya tekan paralel Ibraninya terasa. Kata ganti “engkau” dipakai karena ujaran ini ditujukan kepada Ayub secara tunggal; kapitalisasi “Sang Perkasa” menandai rujukan ilahi yang paling mungkin tanpa menghapus alternatif gramatikal.
