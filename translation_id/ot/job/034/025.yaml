id: JOB.34.25
reference: Job 34:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/כֵ֗ן יַ֭כִּיר מַעְבָּֽדֵי/הֶ֑ם וְ/הָ֥פַךְ לַ֝֗יְלָה וְ/יִדַּכָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: id
  text: Karena itu, Dia mengenali perbuatan mereka; Dia menggulingkan mereka pada malam hari[a], lalu mereka diremukkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia menggulingkan mereka pada waktu malam.” Teks Ibrani tidak menyatakan objek kata “menggulingkan” secara eksplisit, tetapi konteks menunjuk kepada para penguasa fasik yang sedang dihakimi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan logis dari uraian sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: יַכִּיר
  choice: Dia mengenali
  rationale: Bentuk hifil dari נכר di sini menyatakan bahwa Allah mengenali atau mengetahui dengan saksama perbuatan mereka; 'mengenali' mempertahankan nuansa identifikasi.
- source_word: מַעְבָּדֵיהֶם
  choice: perbuatan mereka
  rationale: Merujuk pada apa yang mereka kerjakan; 'perbuatan' alami, ringkas, dan sesuai dengan konteks moral.
- source_word: וְהָפַךְ
  choice: Dia menggulingkan mereka
  rationale: הפך dapat berarti membalikkan atau menggulingkan. Objek tidak dinyatakan dalam teks Ibrani, tetapi dari konteks menunjuk kepada orang-orang fasik yang sedang dihakimi.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Dipahami secara adverbial-temporal; ungkapan ini alami dan mempertahankan gambaran penghukuman pada malam hari.
- source_word: וְיִדַּכָּאוּ
  choice: lalu mereka diremukkan
  rationale: Bentuk pasif dari דכא menyampaikan tindakan meremukkan atau menghancurkan. 'Diremukkan' mempertahankan kekuatan citra penghakiman.
theological_decisions:
- issue: Subjek dan objek tersirat dalam adegan penghakiman
  choice: Allah adalah subjek rangkaian verba, sedangkan orang-orang fasik yang dibicarakan dalam konteks menjadi objek tersirat dari 'menggulingkan'.
  alternative: Memahami frasa itu secara lebih harfiah sebagai 'Dia membalikkan malam', atau membaca verbanya secara impersonal.
  rationale: Konteks Ayub 34:24–26 membicarakan Allah yang mengetahui dan menghukum para penguasa perkasa yang fasik. Menambahkan 'mereka' memperjelas objek yang tersirat tanpa menutup ketidakjelasan tekstual, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pronomina ilahi dipakai secara konsisten dalam ayat ini. Struktur puitis dipertahankan dengan dua klausa penghakiman yang ringkas.
