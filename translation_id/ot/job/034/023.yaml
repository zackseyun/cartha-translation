  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: id
  text: Sebab Ia tidak menetapkan waktu tambahan bagi seseorang untuk menghadap Allah dalam pengadilan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab Ia tidak menetapkan lagi bagi seseorang untuk menghadap Allah dalam pengadilan.” Teks Ibrani ayat ini sulit dan padat; kata “waktu” dalam terjemahan utama merupakan pelengkapan untuk menyatakan pembacaan bahwa Allah tidak memerlukan kesempatan tambahan atau penundaan sebelum menghakimi.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai dasar atau penjelasan bagi pernyataan sebelumnya dalam alur argumentasi Elihu.
- source_word: לֹא
  choice: tidak
  rationale: Negasi biasa yang diterjemahkan secara langsung dan alami.
- source_word: עַל אִישׁ
  choice: bagi seseorang
  rationale: Dengan יָשִׂים, עַל dapat menandai orang yang baginya sesuatu ditetapkan. 'Seseorang' menyampaikan pemakaian generik אִישׁ secara wajar dalam bahasa Indonesia.
- source_word: יָשִׂים
  choice: menetapkan
  rationale: שׂים berarti menaruh atau menetapkan; dalam konteks ini, 'menetapkan' sesuai dengan gagasan penentuan waktu atau kesempatan.
- source_word: עוֹד
  choice: waktu lagi
  rationale: עוֹד secara harfiah berarti 'lagi/lebih lanjut'. Karena klausa Ibrani bersifat eliptis, 'waktu' dipahami sebagai objek tersirat, sedangkan עוֹד dipertahankan dengan 'lagi'.
- source_word: לַהֲלֹךְ
  choice: untuk menghadap
  rationale: Secara harfiah berarti 'untuk pergi'. Dalam konteks peradilan, 'menghadap' secara alami menyatakan pergi dan tampil di hadapan hakim.
- source_word: אֶל אֵל
  choice: Allah
  rationale: Secara harfiah 'kepada Allah'; bersama 'menghadap', arah kepada Allah sudah tersampaikan secara idiomatis.
- source_word: בַּמִּשְׁפָּט
  choice: dalam pengadilan
  rationale: מִשְׁפָּט dapat menunjuk pada penghakiman atau proses hukum. 'Dalam pengadilan' mempertahankan gambaran yudisial tanpa menentukan secara berlebihan apakah yang dimaksud putusan atau persidangan.
theological_decisions:
- issue: Makna klausa sulit dengan עוֹד dan objek yang tidak dinyatakan sesudah יָשִׂים
  choice: Allah tidak menetapkan waktu tambahan bagi seseorang untuk menghadap-Nya dalam proses pengadilan.
  alternative: Allah tidak lagi memperhatikan seseorang sebelum membawanya ke dalam pengadilan; atau Allah tidak menetapkan waktu tertentu bagi seseorang untuk datang kepada-Nya dalam pengadilan.
  rationale: Teks Ibrani padat dan eliptis. Konteks menekankan bahwa pengetahuan Allah sempurna sehingga Ia tidak memerlukan sidang tambahan atau penundaan sebelum menghakimi. Namun, karena objek 'waktu' tidak tertulis secara eksplisit, ketidakpastian itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menghadap Allah dalam pengadilan' mempertahankan suasana hukum, sementara 'waktu lagi' menjaga unsur עוֹד dan menandai sifat eliptis teks sumber.
