  source_fidelity: 'Terjemahan utama secara tepat menangkap pembacaan sintaktis yang paling lazim bagi Ibrani yang padat ini: tindakan ilahi pada konteks sebelumnya mencegah orang fasik berkuasa dan mencegah rakyat terjerat. “Orang fasik” sesuai dengan חָנֵף, “memerintah” dengan מִמְּלֹךְ, dan “rakyat” sesuai dengan עָם dalam konteks kekuasaan. Peralihan frasa nominal “jerat-jerat rakyat/bagi rakyat” menjadi predikasi “rakyat tidak terjerat” adalah pengungkapan Indonesia yang wajar tanpa perubahan makna substantif.'
