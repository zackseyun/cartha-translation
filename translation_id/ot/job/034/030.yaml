  terminology: “Fasik” merupakan istilah Alkitab Indonesia yang mapan dan mempertahankan muatan religius-moral חָנֵף. “Rakyat” tepat untuk komunitas yang berada di bawah pemerintahan seorang penguasa. Catatan kaki dengan baik memelihara kemungkinan pembacaan nominal dari frasa kedua dan kepadatan sintaks Ibrani.
