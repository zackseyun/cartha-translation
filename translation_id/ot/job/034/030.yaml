base_translation:
  language: en
  yaml_path: translation/ot/job/034/030.yaml
  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: id
  text: agar orang fasik tidak memerintah dan rakyat tidak terjerat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “agar orang fasik tidak memerintah, agar tidak ada jerat bagi rakyat.” Teks Ibrani sangat ringkas dan memungkinkan beberapa terjemahan yang berdekatan, yang dibangun dari kata “memerintah” dan “jerat”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: agar ... tidak memerintah
  rationale: Gabungan מִן dengan infinitif konstruk מָלַךְ dalam konteks ini paling wajar dipahami sebagai pencegahan atau tujuan/hasil yang melanjutkan tindakan Allah pada ayat sebelumnya. Bentuk 'agar ... tidak memerintah' alami dalam bahasa Indonesia tanpa menghilangkan sifat eliptis hubungan antarayat.
- source_word: אָדָם
  choice: orang
  rationale: Kata ini menunjuk kepada seorang manusia sebagai penguasa, bukan umat manusia secara kolektif. 'Orang' merupakan padanan tunggal yang alami dan tidak menambahkan identitas yang tidak dinyatakan teks.
- source_word: חָנֵף
  choice: fasik
  rationale: Dalam sastra hikmat, חָנֵף menunjuk kepada orang yang tidak saleh atau durhaka terhadap Allah, bukan sekadar orang munafik. 'Fasik' mempertahankan bobot moral-keagamaannya dalam ragam Alkitab bahasa Indonesia.
- source_word: מִמֹּקְשֵׁי
  choice: tidak terjerat
  rationale: Bentuk ini berasal dari מִן dan bentuk jamak מוֹקֵשׁ, 'jerat-jerat'. Dalam susunan Ibrani yang sangat padat, frasa tersebut dapat menyatakan pencegahan bahaya bagi rakyat. Ungkapan verbal 'tidak terjerat' menyampaikan hasil preventif secara alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: עָם
  choice: rakyat
  rationale: Dalam konteks pemerintahan dan penindasan, עָם adalah masyarakat yang berada di bawah seorang penguasa. 'Rakyat' lebih tepat daripada 'bangsa' untuk relasi politik yang dimaksud di sini.
theological_decisions:
- issue: Sintaks padat dan eliptis dalam ayat ini
  choice: Tindakan Allah mencegah orang fasik memerintah dan dengan demikian mencegah rakyat terjerat.
  alternative: agar orang fasik tidak memerintah, agar tidak ada jerat bagi rakyat
  rationale: Bahasa Ibrani hanya memberikan dua frasa berawalan מִן dan bergantung pada konteks sebelumnya. Terjemahan utama menyatakan hubungan tujuan/hasil yang paling koheren tanpa menetapkan cara khusus Allah bertindak; catatan kaki mempertahankan kemungkinan bahwa frasa kedua harus dibaca secara nominal sebagai 'jerat bagi rakyat'.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah 'fasik' mempertahankan nuansa moral-keagamaan yang lazim dalam sastra hikmat, sedangkan 'rakyat' memperjelas konteks pemerintahan tanpa menambah keterangan di luar teks.
