lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi ajakan pada ayat sebelumnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: אֹזֶן
  choice: telinga
  rationale: Nomina tunggal ini dipakai secara umum dalam pernyataan yang bersifat pepatah.
- source_word: מִלִּין
  choice: kata-kata
  rationale: Mengacu pada perkataan yang didengar; bentuk ini langsung dan alami dalam bahasa Indonesia.
- source_word: תִּבְחָן
  choice: menguji
  rationale: Mempertahankan makna evaluatif akar בחן dan kesejajarannya dengan tindakan mengecap.
- source_word: חֵךְ
  choice: langit-langit
  rationale: Merujuk secara khusus pada langit-langit mulut sebagai organ pengecap, bukan mulut secara keseluruhan.
- source_word: יִטְעַם
  choice: mengecap
  rationale: Menyampaikan tindakan merasakan cita rasa dan mempertahankan gambaran indrawi dalam perbandingan.
- source_word: לֶאֱכֹל
  choice: makanan
  rationale: Infinitif dengan prefiks ל dipakai secara substantival, secara harfiah 'untuk dimakan'; 'makanan' merupakan padanan Indonesia yang ringkas dan alami.
