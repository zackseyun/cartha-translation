  text: יָרֹ֣עַ כַּבִּירִ֣ים לֹא חֵ֑קֶר וַ/יַּעֲמֵ֖ד אֲחֵרִ֣ים תַּחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/024.yaml
  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: id
  text: Dia meremukkan orang-orang berkuasa tanpa penyelidikan[a] dan menempatkan orang lain sebagai pengganti mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa pemeriksaan” atau “tanpa mencari tahu.” Frasa Ibrani secara harfiah berbunyi “tidak ada penyelidikan/pencarian,” yang menyatakan bahwa Dia tidak memerlukan pemeriksaan panjang untuk meruntuhkan orang-orang berkuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: meremukkan
  rationale: Bentuk kausatif dari רעע menyatakan tindakan menghancurkan atau meruntuhkan secara tegas; “meremukkan” mempertahankan daya ungkap yang kuat.
- source_word: כַּבִּירִים
  choice: orang-orang berkuasa
  rationale: Kata ini menunjuk kepada orang-orang yang besar atau kuat, dan dalam konteks penghakiman atas para pemimpin paling wajar dipahami sebagai orang-orang yang memiliki kekuasaan, tanpa membatasi mereka pada jabatan tertentu.
- source_word: לֹא חֵקֶר
  choice: tanpa penyelidikan[a]
  rationale: 'Terjemahan ini dekat dengan susunan Ibrani dan mempertahankan ketegangan ungkapan tersebut: Allah bertindak tanpa memerlukan proses pemeriksaan atau pencarian sebagaimana manusia.'
- source_word: וַיַּעֲמֵד
  choice: menempatkan
  rationale: Bentuk kausatif dari עמד berarti membuat berdiri atau menetapkan. Bersama frasa berikutnya, “menempatkan” secara alami menyatakan pengangkatan orang-orang pengganti.
- source_word: אֲחֵרִים
  choice: orang lain
  rationale: Bentuk jamak tak tentu ini menunjuk kepada orang-orang yang menggantikan mereka yang disingkirkan.
- source_word: תַּחְתָּם
  choice: sebagai pengganti mereka
  rationale: Walaupun secara dasar berarti “di bawah mereka,” dalam konteks pergantian kedudukan frasa ini berarti “menggantikan mereka” atau “di tempat mereka.”
theological_decisions:
- issue: Subjek tersirat pada kedua kata kerja
  choice: “Dia,” yaitu Allah, dipertahankan sebagai subjek tersirat.
  alternative: Membiarkan subjek tidak dinyatakan atau memahaminya secara impersonal.
  rationale: Konteks perkataan Elihu membahas tindakan Allah dalam menghakimi para penguasa. Bahasa Indonesia memerlukan subjek yang jelas, dan “Dia” mengikuti alur wacana tanpa menambahkan penegasan doktrinal di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang-orang berkuasa” lebih alami untuk konteks sosial-politik daripada “orang-orang perkasa,” sedangkan “meremukkan” mempertahankan kekuatan citra puitis Ibrani.
