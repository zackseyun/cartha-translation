  text: Should I lie concerning my right? My wound is incurable[b][a], though there is no transgression.
translation:
  language: id
  text: Haruskah aku berdusta tentang hakku?[a] Lukaku tidak dapat disembuhkan[b], sekalipun aku tidak melakukan pelanggaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berlawanan dengan hakku, aku dianggap pendusta,” jika klausa pertama dipahami sebagai pernyataan, bukan pertanyaan retoris.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “panahku tidak dapat disembuhkan”; “panah” kemungkinan merupakan gambaran bagi luka atau penderitaan yang menimpanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁפָּטִי
  choice: tentang hakku
  rationale: עַל menyatakan pokok pembicaraan, sedangkan מִשְׁפָּטִי dalam konteks pembelaan Ayub menunjuk pada hak atau tuntutan keadilannya. Ungkapan ini mempertahankan nuansa hukum secara alami dalam bahasa Indonesia.
- source_word: אֲכַזֵּב
  choice: Haruskah aku berdusta
  rationale: Bentuk Piel dapat berarti berdusta atau tampil sebagai pendusta. Sebagai pertanyaan retoris, pilihan ini menyampaikan bahwa Ayub tidak dapat menyangkal hak atau ketidakbersalahannya tanpa berdusta; konstruksi pernyataan tetap dicatat sebagai alternatif.
- source_word: אָנ֖וּשׁ
  choice: tidak dapat disembuhkan
  rationale: Kata sifat ini menggambarkan keadaan yang tidak tersembuhkan atau sangat parah. Frasa ini menyampaikan beratnya penderitaan tanpa mengurangi kekuatan teks.
- source_word: חִצִּי
  choice: lukaku
  rationale: Secara harfiah berarti 'panahku', tetapi di sini kemungkinan merupakan metonimia atau metafora bagi luka maupun penderitaan akibat panah yang mengenainya. Terjemahan utama memakai maknanya, sementara citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: בְלִי פָשַׁע
  choice: sekalipun aku tidak melakukan pelanggaran
  rationale: Secara harfiah berarti 'tanpa pelanggaran'. Dalam hubungan dengan klausa sebelumnya, 'sekalipun' mengungkapkan kontras yang tersirat, dan penambahan subjek-verba menghasilkan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Cara memahami klausa pertama sebagai kutipan Elihu atas pengakuan Ayub
  choice: 'Pertanyaan retoris: ''Haruskah aku berdusta tentang hakku?'''
  alternative: 'Pernyataan: ''Berlawanan dengan hakku, aku dianggap pendusta.'''
  rationale: Teks Ibrani ringkas dan dapat dipahami sebagai pertanyaan retoris atau pernyataan. Teks utama mengikuti pertanyaan retoris, tetapi catatan kaki mempertahankan pembacaan alternatif agar ketegangan hukum dan teologis tidak diselesaikan secara sepihak.
- issue: Citra חִצִּי
  choice: Menyampaikan acuannya sebagai 'lukaku' dalam teks utama
  alternative: Mempertahankan bentuk harfiah 'panahku'
  rationale: Citra panah kemungkinan menunjuk pada luka atau penderitaan yang ditimpakan kepada Ayub. Catatan kaki mempertahankan bentuk harfiah sehingga metafora sumber tetap tersedia bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hakku' mempertahankan nuansa hukum tanpa terdengar teknis; 'pelanggaran' menjaga bobot moral פָשַׁע. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
