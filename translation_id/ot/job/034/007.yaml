  text: מִי גֶ֥בֶר כְּ/אִיּ֑וֹב יִֽשְׁתֶּה לַּ֥עַג כַּ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/007.yaml
  text: What man is like Job[a], who drinks mockery like water?
translation:
  language: id
  text: Siapakah orang seperti Ayub[a], yang meminum ejekan seperti air?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Adakah orang seperti Ayub, yang meminum ejekan seperti air?”'
    reason: Alternatif ini menyampaikan daya pertanyaan retoris מִי גֶבֶר sebagai pertanyaan tentang ada tidaknya orang lain yang sebanding dengan Ayub.
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Siapakah orang
  rationale: Ungkapan ini membuka pertanyaan retoris tentang tidak adanya orang lain yang seperti Ayub. “Orang” menyampaikan גֶבֶר secara wajar dalam bahasa Indonesia tanpa menambahkan nuansa kekuatan yang tidak ditonjolkan konteks.
- source_word: כְּאִיּוֹב
  choice: seperti Ayub
  rationale: Prefiks כְּ menyatakan perbandingan; “seperti Ayub” merupakan padanan Indonesia yang langsung dan alami.
- source_word: יִשְׁתֶּה
  choice: meminum
  rationale: Bentuk imperfek menggambarkan tindakan yang menjadi ciri Ayub dalam pertanyaan retoris ini. Bentuk “meminum” mempertahankan metafora konsumsi.
- source_word: לַּעַג
  choice: ejekan
  rationale: Kata benda ini menunjuk pada olok-olok, cemoohan, atau penghinaan. “Ejekan” jelas bagi pembaca modern dan mempertahankan unsur tindakan mengejek.
- source_word: כַּמָּיִם
  choice: seperti air
  rationale: Terjemahan langsung ini mempertahankan perbandingan yang hidup tentang sesuatu yang diminum dengan mudah atau berlimpah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan pertanyaan serta metafora Ibrani dipertahankan tanpa memperjelas secara berlebihan apakah Ayub menerima, menanggung, atau menyambut ejekan.
