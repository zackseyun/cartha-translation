  text: Hear my words[a], you wise men, and give ear to me, you who know.
translation:
  language: id
  text: Dengarkanlah perkataanku, hai orang-orang bijak; dengarkanlah aku, hai orang-orang yang berpengetahuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Dengarkanlah
  rationale: Imperatif jamak Qal dari שׁמע. Bentuk ini menyampaikan seruan langsung secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: חֲכָמִים
  choice: orang-orang bijak
  rationale: Adjektiva maskulin jamak yang dipakai sebagai nomina dan sapaan. Pilihan ini alami serta tidak menambahkan gelar khusus seperti 'para ahli hikmat'.
- source_word: מִלָּי
  choice: perkataanku
  rationale: Nomina jamak dengan sufiks orang pertama tunggal, bermakna kata-kata atau ujaran. 'Perkataanku' mengungkapkan isi ucapan secara idiomatis tanpa mengubahnya menjadi gagasan abstrak.
- source_word: וְיֹדְעִים
  choice: orang-orang yang berpengetahuan
  rationale: Partisip Qal jamak yang dipakai secara substantival dan vokatif. Pilihan ini mempertahankan arti dasar 'mengetahui' dan kesejajaran dengan 'orang-orang bijak'.
- source_word: הַאֲזִינוּ
  choice: pasanglah telinga
  rationale: Imperatif jamak Hifil dari אזן mempunyai gambaran yang berkaitan dengan telinga. Ungkapan Indonesia ini mempertahankan gambaran tersebut dan paralelisme dengan 'Dengarkanlah'.
- source_word: לִי
  choice: kepadaku
  rationale: Preposisi dengan sufiks orang pertama tunggal, yang secara eksplisit menunjukkan orang yang harus didengarkan.
