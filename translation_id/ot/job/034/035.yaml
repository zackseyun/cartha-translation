  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: id
  text: Ayub berbicara tanpa pengetahuan, dan kata-katanya tidak disertai pengertian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: tanpa pengetahuan
  rationale: Frasa לֹא בְדַעַת menyatakan cara berbicara yang tidak disertai pengetahuan. 'Tanpa pengetahuan' alami dalam bahasa Indonesia dan mempertahankan kesejajaran puisi.
- source_word: יְדַבֵּר
  choice: berbicara
  rationale: Bentuk imperfek di sini paling wajar dipahami sebagai penilaian umum Elihu tentang perkataan Ayub, bukan sebagai tindakan masa depan.
- source_word: דְבָרָיו
  choice: kata-katanya
  rationale: Bentuk jamak ini secara langsung berarti perkataan atau ucapan milik Ayub; 'kata-katanya' ringkas dan alami.
- source_word: בְהַשְׂכֵּיל
  choice: tanpa pengertian
  rationale: Akar שכל menunjuk pada pengertian, wawasan, atau tindakan dengan bijaksana. Dalam kesejajaran dengan 'tanpa pengetahuan', 'tanpa pengertian' mempertahankan arti dan bentuk puitis.
- source_word: לֹא
  choice: tanpa
  rationale: Walaupun secara harfiah berarti 'tidak', dalam kedua konstruksi keterangan cara ini 'tanpa' menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah daya negasinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur paralel Ibrani dipertahankan. Tidak diperlukan catatan kaki karena terjemahan harfiah 'tidak dengan pengetahuan/pengertian' tidak menambah perbedaan makna yang berarti dalam bahasa Indonesia.
