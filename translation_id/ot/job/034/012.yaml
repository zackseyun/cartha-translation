  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַף אָמְנָ֗ם אֵ֥ל לֹֽא יַרְשִׁ֑יעַ וְ֝/שַׁדַּ֗י לֹֽא יְעַוֵּ֥ת מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: id
  text: Sungguh, Allah tidak berbuat jahat[a], dan Yang Mahakuasa tidak memutarbalikkan keadilan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menghukum secara tidak adil” atau “tidak menyatakan bersalah.” Kata kerja Ibrani yang dipakai di sini dalam konteks tertentu dapat bermakna yudisial.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: Sungguh
  rationale: Gabungan ini menegaskan kebenaran pernyataan. “Sungguh” menyampaikan daya penegasan itu secara alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל menunjuk kepada Allah sebagai Pribadi ilahi. “Allah” merupakan padanan baku dan alami dalam Alkitab bahasa Indonesia, sementara unsur kekuatan sudah tampil dalam sebutan paralel “Yang Mahakuasa”.
- source_word: יַרְשִׁיעַ
  choice: tidak berbuat jahat
  rationale: Bentuk Hifil dari רשע dapat bermakna bertindak jahat atau, dalam konteks hukum, menyatakan seseorang bersalah. Dalam paralel dengan tidak memutarbalikkan keadilan, “tidak berbuat jahat” menyatakan penyangkalan yang lebih luas tanpa meniadakan kemungkinan makna yudisial, yang dicatat dalam catatan kaki.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Sebutan ilahi ini diterjemahkan dengan padanan baku yang alami dan mempertahankan kesejajarannya dengan “Allah”.
- source_word: יְעַוֵּת
  choice: tidak memutarbalikkan
  rationale: Kata kerja ini menggambarkan tindakan membengkokkan, memelintir, atau menyimpangkan. “Memutarbalikkan” tepat dan lazim digunakan bersama “keadilan”.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada keadilan atau keputusan yang adil. “Keadilan” paling jelas menyampaikan standar moral dan yudisial yang dimaksud.
theological_decisions:
- issue: Makna יַרְשִׁיעַ dalam pernyataan tentang watak Allah
  choice: Allah tidak berbuat jahat
  alternative: Allah tidak menghukum secara tidak adil; Allah tidak menyatakan bersalah
  rationale: Pilihan utama mempertahankan penegasan luas tentang integritas moral Allah dan sesuai dengan paralelnya mengenai keadilan. Kemungkinan makna forensik tidak dihapus, tetapi disajikan dalam catatan kaki agar ketegangan leksikal teks Ibrani tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Sungguh” memberi penegasan tanpa kesan arkais; “memutarbalikkan keadilan” mempertahankan nada yudisial ayat. Penanda catatan kaki ditempatkan langsung setelah frasa yang memiliki kemungkinan makna alternatif.
