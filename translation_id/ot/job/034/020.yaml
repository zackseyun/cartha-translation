id: JOB.34.20
reference: Job 34:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רֶ֤גַע יָמֻתוּ֮ וַ/חֲצ֪וֹת לָ֥יְלָה יְגֹעֲשׁ֣וּ עָ֣ם וְ/יַעֲבֹ֑רוּ וְ/יָסִ֥ירוּ אַ֝בִּ֗יר לֹ֣א בְ/יָֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: id
  text: Dalam sekejap mereka mati; pada tengah malam suatu bangsa terguncang lalu lenyap; orang perkasa disingkirkan, bukan oleh tangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tanpa tangan manusia. Secara harfiah: bukan oleh tangan; kemungkinan maksudnya ialah tanpa perantaraan manusia.'
    reason: Menjelaskan idiom Ibrani dan kemungkinan maknanya tanpa memasukkan penafsiran itu secara pasti ke dalam teks utama.
lexical_decisions:
- source_word: רֶגַע
  choice: dalam sekejap
  rationale: Menunjukkan rentang waktu yang amat singkat secara alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: יָמֻתוּ
  choice: mereka mati
  rationale: Padanan langsung bagi verba umum yang berarti mati.
- source_word: וַחֲצוֹת לָיְלָה
  choice: pada tengah malam
  rationale: Mengungkapkan secara idiomatis frasa Ibrani yang secara harfiah berarti 'pada pertengahan malam'.
- source_word: יְגֹעֲשׁוּ
  choice: terguncang
  rationale: Mempertahankan gambaran guncangan atau kekacauan yang menimpa suatu bangsa.
- source_word: עָם
  choice: suatu bangsa
  rationale: Nomina kolektif tunggal ini merujuk kepada satu kelompok masyarakat; 'bangsa' lebih alami daripada 'suatu rakyat' dalam konteks ini.
- source_word: וְיַעֲבֹרוּ
  choice: lalu lenyap
  rationale: Dalam konteks kematian dan penghukuman, verba 'berlalu' menyatakan bahwa bangsa itu hilang atau tidak ada lagi; 'lenyap' menyampaikan maksud tersebut dengan wajar.
- source_word: וְיָסִירוּ
  choice: disingkirkan
  rationale: Bentuk pasif tak berpelaku mempertahankan ketidakjelasan mengenai pelaku yang menyingkirkan dan sesuai dengan frasa berikutnya.
- source_word: אַבִּיר
  choice: orang perkasa
  rationale: Bentuk substantival tunggal menunjuk kepada seseorang yang kuat atau berkuasa; terjemahan tunggal mempertahankan bentuk sumber.
- source_word: לֹא בְיָד
  choice: bukan oleh tangan
  rationale: Terjemahan yang dekat dengan idiom Ibrani mempertahankan ambiguitas mengenai pelaku, sedangkan kemungkinan makna 'tanpa tangan manusia' dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Pelaku yang tersirat dalam frasa לֹא בְיָד
  choice: Frasa utama dibiarkan sebagai 'bukan oleh tangan', sehingga tindakan ilahi mungkin tersirat tetapi tidak dinyatakan secara eksplisit.
  alternative: tanpa tangan manusia
  rationale: Konteks dapat menunjuk pada tindakan yang terjadi tanpa perantaraan manusia, mungkin tindakan Allah, tetapi teks Ibrani sendiri hanya mengatakan 'bukan oleh/dengan tangan'. Terjemahan tidak memastikan pelaku yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Paralelisme serta gerak cepat ayat dipertahankan dengan titik koma; 'lalu' memperjelas urutan guncangan dan lenyapnya bangsa itu.
