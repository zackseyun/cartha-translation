  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: id
  text: Sebab ia telah berkata, “Orang tidak memperoleh manfaat apa pun dengan bergembira bersama Allah.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang tidak memperoleh manfaat apa pun ketika Allah berkenan kepadanya,” atau, “Orang tidak memperoleh manfaat apa pun dengan mencari perkenanan Allah.” Frasa Ibraninya padat dan dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi tuduhan Elihu dalam konteks sebelumnya dan mempertahankan alur argumentatif.
- source_word: אָמַר
  choice: ia telah berkata
  rationale: Bentuk perfektif menunjuk pada perkataan terdahulu yang tetap relevan dalam argumen Elihu.
- source_word: לֹא יִסְכָּן
  choice: tidak mendapat keuntungan apa pun
  rationale: Mengungkapkan makna tidak memperoleh manfaat atau keuntungan dengan bahasa Indonesia yang alami.
- source_word: גָּבֶר
  choice: Orang
  rationale: Nomina maskulin tunggal dipakai secara representatif bagi manusia; 'orang' menyampaikan cakupan generiknya secara alami dalam bahasa Indonesia.
- source_word: בִּרְצֹתוֹ
  choice: dengan menyukai
  rationale: Infinitif dari רצה dengan sufiks dapat menunjuk pada tindakan orang itu berkenan atau bersukacita dalam hubungannya dengan Allah; 'menyukai' mempertahankan gagasan rasa senang tanpa memperluasnya secara berlebihan.
- source_word: עִם אֱלֹהִים
  choice: Allah
  rationale: Dalam konstruksi Indonesia, objek setelah 'menyukai' menyampaikan relasi dengan Allah secara alami, meskipun preposisi עִם secara harfiah berarti 'dengan'.
theological_decisions:
- issue: Penafsiran frasa בִּרְצֹתוֹ עִם אֱלֹהִים
  choice: orang tidak memperoleh keuntungan dengan menyukai Allah
  alternative: orang tidak memperoleh keuntungan ketika Allah berkenan kepadanya; atau dengan mencari perkenanan Allah
  rationale: Sufiks pada בִּרְצֹתוֹ paling langsung dipahami dengan orang itu sebagai subjek, sesuai ringkasan tuduhan Elihu bahwa kesalehan tidak mendatangkan manfaat. Karena susunan Ibraninya padat dan memungkinkan penafsiran lain, alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kata 'orang' dipilih untuk fungsi generik גָּבֶר. Penanda catatan kaki ditempatkan setelah kutipan yang diterangkannya.
