base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: id
  text: Bila Dia memberikan ketenangan, siapa dapat menyalahkan?[a] Bila Dia menyembunyikan wajah-Nya, siapa dapat melihat-Nya?[b] Hal ini berlaku sama, baik bagi suatu bangsa maupun bagi seseorang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “menyatakan bersalah”. Kata Ibraninya dapat memiliki arti hukum: menyatakan seseorang jahat atau bersalah. Objeknya tidak disebutkan.'
    reason: lexical_alternative
  - marker: b
    text: Atau “memandang-Nya”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan atas suatu bangsa dan atas seorang manusia, bersama-sama”; maksudnya mencakup bangsa maupun seseorang secara individual.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: memberikan ketenangan
  rationale: 'Bentuk Hifil dari שׁקט bersifat kausatif: Dia menyebabkan keadaan tenang. Pilihan ini mempertahankan daya kausatif tanpa mempersempit maknanya menjadi damai dalam arti tertentu.'
- source_word: יַרְשִׁעַ
  choice: menyalahkan
  rationale: Bentuk Hifil dari רשע dapat berarti menyatakan jahat atau bersalah. 'Menyalahkan' terdengar alami tanpa menambahkan objek yang tidak dinyatakan dalam bahasa Ibrani; nuansa hukumnya dicatat dalam catatan kaki.
- source_word: יַסְתֵּר פָּנִים
  choice: menyembunyikan wajah-Nya
  rationale: Terjemahan harfiah ini mempertahankan ungkapan antropomorfis tentang ketersembunyian ilahi dan tidak membatasinya hanya pada penarikan perkenanan.
- source_word: יְשׁוּרֶנּוּ
  choice: melihat-Nya
  rationale: Kata שור berarti memandang atau melihat. Akhiran tunggal maskulin merujuk kepada Allah; 'melihat-Nya' alami dalam bahasa Indonesia dan mempertahankan rujukan tersebut.
- source_word: גּוֹי
  choice: suatu bangsa
  rationale: גוי di sini menunjuk pada kesatuan kolektif sosial atau politik, sehingga 'bangsa' paling tepat dan tidak memasukkan gagasan non-Yahudi yang tidak dinyatakan.
- source_word: אָדָם
  choice: seseorang
  rationale: Dalam pertentangan dengan 'bangsa', kata ini menunjuk pada manusia secara individual. Bahasa Indonesia tidak menuntut penandaan gender, dan 'seseorang' mempertahankan makna tunggal individual.
- source_word: יָחַד
  choice: berlaku sama, baik ... maupun ...
  rationale: Di sini יחד menyatakan penerapan yang setara pada kedua lingkup, bukan terutama kebersamaan secara ruang.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: Hal ini berlaku sama, baik atas suatu bangsa maupun atas seseorang
  rationale: על bersifat luwes. Dalam klausa penutup ini, ungkapan tersebut memperluas cakupan pernyataan sebelumnya kepada lingkup kolektif dan individual tanpa memaksakan arti penghukuman.
theological_decisions:
- issue: Ungkapan ketersembunyian ilahi
  choice: Mempertahankan ungkapan 'menyembunyikan wajah-Nya'.
  alternative: Berpaling atau menarik perkenanan-Nya.
  rationale: Ungkapan Ibrani memiliki bobot teologis yang lebih luas daripada sekadar penarikan perkenanan; menerjemahkannya secara langsung mempertahankan ketegangan itu.
- issue: Objek tersirat pada יַרְשִׁעַ
  choice: Tidak menambahkan objek eksplisit pada 'menyalahkan'.
  alternative: Menyatakan Dia, penerima ketenangan, atau seseorang bersalah.
  rationale: Teks Ibrani tidak menyebut objek. Penambahan objek akan menyelesaikan secara sepihak ambiguitas mengenai siapa yang hendak dipersalahkan atau dinyatakan bersalah.
- issue: Cakupan klausa terakhir
  choice: Menerapkannya secara setara kepada bangsa dan individu.
  alternative: Menafsirkan על secara lebih tegas sebagai tindakan melawan bangsa dan individu.
  rationale: Klausa ini secara alami memperluas prinsip sebelumnya ke ranah kolektif dan individual, sementara daya preposisinya tidak perlu dipersempit menjadi tindakan penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Struktur retoris dua pertanyaan dipertahankan, sedangkan klausa terakhir dibuat idiomatis tanpa menghilangkan cakupan kolektif-individual.
