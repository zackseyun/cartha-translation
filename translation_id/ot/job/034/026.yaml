  text: תַּֽחַת רְשָׁעִ֥ים סְפָקָ֗/ם בִּ/מְק֥וֹם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: id
  text: Ia memukul mereka sebagai orang fasik di depan umum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia memukul mereka karena kefasikan mereka di depan umum.” Frasa pembukanya sulit dan mungkin menyatakan alasan mereka dihukum, bukan status mereka ketika dipukul.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: sebagai
  rationale: Dalam frasa sulit תַּחַת רְשָׁעִים, kata depan ini dipahami menunjukkan status mereka ketika dihukum; pemahaman kausal tetap dicantumkan dalam catatan kaki.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Adjektiva jamak ini dipakai secara substantival dan secara alami merujuk kepada orang-orang yang fasik tanpa pembatasan gender.
- source_word: סְפָקָם
  choice: Ia memukul mereka
  rationale: Verba ini menyatakan tindakan memukul; terjemahan ini tidak menambahkan akibat seperti 'merobohkan' atau 'membinasakan' yang tidak dinyatakan secara eksplisit.
- source_word: בִּמְקוֹם רֹאִים
  choice: di depan umum
  rationale: Secara harfiah ungkapan ini menunjuk tempat orang-orang melihat; 'di depan umum' menyampaikan dengan wajar bahwa hukuman itu dilaksanakan secara terbuka.
