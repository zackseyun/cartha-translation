  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: id
  text: Haruskah Dia membalasnya menurut kehendakmu[a] karena engkau telah menolaknya[b]? Engkaulah yang harus memilih, bukan aku; maka katakanlah apa yang engkau ketahui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari pihakmu” atau “menurutmu”. Ungkapan Ibrani pada awal ayat ini sulit; maksudnya tampaknya bahwa pembalasan Allah tidak ditentukan oleh kehendak atau penilaian Ayub.
    reason: lexical_alternative
  - marker: b
    text: Objek setelah “engkau telah menolak” tidak disebutkan dengan tegas dalam bahasa Ibrani; mungkin yang dimaksud ialah keputusan Allah, cara Allah memerintah, atau balasan yang sedang dibicarakan.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: menurut kehendakmu
  rationale: Ungkapan harfiahnya sulit ('dari denganmu'). Dalam konteks, pertanyaan Elihu ialah apakah pembalasan Allah harus ditentukan oleh kehendak atau penilaian Ayub. 'Menurut kehendakmu' menyampaikan maksud idiomatis itu tanpa memastikan lebih dari yang dinyatakan teks.
- source_word: יְשַׁלְמֶנָּה
  choice: haruskah Dia membalas
  rationale: Bentuk Piel dari שלם menyatakan tindakan membayar kembali atau memberi balasan. 'Membalas' alami dalam bahasa Indonesia dan cocok untuk tindakan ilahi dalam konteks ini; unsur pertanyaan retoris disampaikan dengan 'haruskah'.
- source_word: כִּי מָאַסְתָּ
  choice: karena engkau telah menolaknya
  rationale: מאס berarti menolak, tidak menerima, atau memandang hina. 'Menolaknya' mempertahankan pronomina objek yang rujukannya tidak tegas dalam bahasa Ibrani.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: Engkaulah yang harus memilih, bukan aku
  rationale: בחר berarti 'memilih'. Bentuk penegasan '-lah' mempertahankan kontras antara Ayub dan Elihu, sedangkan 'harus' menyampaikan daya desakan retoris dalam konteks.
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: maka katakanlah apa yang kauketahui
  rationale: Terjemahan ini mempertahankan perintah langsung agar Ayub menyatakan pengetahuannya, dengan susunan yang wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan objek dalam 'engkau telah menolaknya'
  choice: Membiarkan rujukan '-nya' tidak ditentukan dalam teks utama
  alternative: Menjelaskannya sebagai keputusan Allah, cara Allah memerintah, atau balasan yang dibicarakan
  rationale: Teks Ibrani tidak menyebutkan rujukan itu secara tegas. Menentukan salah satu rujukan akan menutup ambiguitas asli dan dapat memberi penafsiran teologis yang terlalu pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' dipakai agar sesuai dengan wacana langsung dalam sastra hikmat. Huruf kapital pada 'Dia' menandai bahwa subjeknya adalah Allah tanpa menambahkan nama ilahi yang tidak muncul dalam ayat.
