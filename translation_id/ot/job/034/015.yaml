lexical_decisions:
- source_word: יִגְוַע
  choice: akan binasa
  rationale: Kata kerja גוע menyatakan mati atau mengembuskan napas terakhir. Bentuk "akan binasa" menyampaikan akibat bersyarat yang berlanjut dari ayat 14 sekaligus mempertahankan bobot ungkapannya.
- source_word: כָּל בָּשָׂר
  choice: semua makhluk hidup
  rationale: Secara harfiah berarti "segala daging", suatu idiom Ibrani bagi makhluk fana. "Semua makhluk hidup" alami dalam bahasa Indonesia dan tidak mempersempit cakupannya hanya kepada manusia.
- source_word: יָחַד
  choice: bersama-sama
  rationale: Kata ini menekankan bahwa semuanya mengalami hal tersebut secara serentak atau sebagai satu keseluruhan.
- source_word: אָדָם
  choice: manusia
  rationale: Nomina tunggal ini dapat menunjuk manusia secara generik atau umat manusia secara kolektif. "Manusia" mempertahankan bentuk tunggal serta makna generiknya dalam bahasa Indonesia.
- source_word: עַל עָפָר
  choice: kepada debu
  rationale: Walaupun עַל biasanya berarti "di atas/atas", bersama שׁוב ungkapan ini menyatakan kembalinya manusia kepada debu. "Kepada debu" mempertahankan citra sumber sekaligus terdengar wajar.
- source_word: יָשׁוּב
  choice: akan kembali
  rationale: שׁוב berarti "kembali"; bentuk "akan" membawa daya bersyarat dari konteks ayat sebelumnya.
theological_decisions:
- issue: Makna generik-kolektif אָדָם
  choice: manusia
  alternative: umat manusia
  rationale: '"Manusia" dalam bahasa Indonesia dapat berfungsi sebagai nomina tunggal generik dan dengan demikian mencerminkan bentuk Ibrani. Catatan kaki mempertahankan kemungkinan untuk mengungkapkan rujukan kolektifnya secara eksplisit.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat. Ungkapan idiomatis "semua makhluk hidup" dipilih daripada terjemahan harfiah "segala daging", sedangkan kesejajaran dan nada universal teks Ibrani dipertahankan.
