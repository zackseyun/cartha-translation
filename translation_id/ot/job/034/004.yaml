- from: Marilah kita memilih bagi diri kita apa yang adil[a]; marilah kita bersama-sama memahami apa yang baik.
  to: Marilah kita memilih apa yang adil bagi kita[a]; marilah kita mengetahui di antara kita apa yang baik.
  rationale: The revision restores “di antara kita” for בֵּינֵינוּ and uses “mengetahui” for נֵדְעָה, preserving the Hebrew wording and its open evaluative sense. Word order in the first clause is adjusted to natural Indonesian while retaining the sense of לָנוּ (“bagi kita”).
