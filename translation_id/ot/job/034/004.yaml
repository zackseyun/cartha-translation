  yaml_path: translation/ot/job/034/004.yaml
  text: Let us choose for ourselves what is just[a]; let us know among ourselves what is good.
translation:
  language: id
  text: Marilah kita memilih apa yang adil bagi kita[a]; marilah kita mengetahui di antara kita apa yang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Marilah kita memilih keadilan bagi kita; marilah kita membedakan di antara kita apa yang baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: apa yang adil
  rationale: Kata ini dapat berarti keadilan, penghakiman, atau keputusan hukum. Dalam ajakan untuk menilai bersama, “apa yang adil” terdengar alami dan mempertahankan nuansa etis-yudisialnya.
- source_word: נִבְחֲרָה
  choice: marilah kita memilih
  rationale: Bentuk imperfek orang pertama jamak ini digunakan secara kohortatif; “marilah kita memilih” menyampaikan daya ajakannya dengan jelas.
- source_word: לָּנוּ
  choice: bagi diri kita
  rationale: Preposisi dengan pronomina orang pertama jamak menunjukkan kepentingan atau acuan diri; ungkapan ini mempertahankan sifat deliberatif dan keterlibatan para pembicara.
- source_word: נֵדְעָה
  choice: marilah kita memahami
  rationale: ידע secara dasar berarti “mengetahui”, tetapi dalam konteks menilai apa yang baik mengandung nuansa mengenali atau memahami melalui pertimbangan.
- source_word: בֵינֵינוּ
  choice: bersama-sama
  rationale: Secara harfiah berarti “di antara kita”; dalam konteks ini menunjuk pada pertimbangan bersama. “Bersama-sama” lebih alami dalam bahasa Indonesia tanpa mengubah sifat timbal baliknya.
- source_word: מַה טּוֹב
  choice: apa yang baik
  rationale: טוֹב memiliki cakupan makna yang luas, termasuk baik, bermanfaat, atau tepat. “Apa yang baik” mempertahankan keluasan itu dan paralelnya dengan מִשְׁפָּט.
