source:
  edition: WLC
  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: id
  text: Sebab ia menambahkan pemberontakan pada dosanya; di tengah-tengah kita ia bertepuk tangan[a] dan memperbanyak kata-katanya melawan Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia saling memukulkan kedua tangannya.” Gerakan ini kemungkinan menyatakan cemoohan, pembangkangan, atau ejekan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kepada Allah.” Kata depan Ibrani dapat menyatakan arah secara lebih netral, tetapi konteks mendukung arti “melawan Allah.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi penilaian Elihu dalam ayat sebelumnya; “sebab” menyampaikan hubungan penjelas-kausal tersebut secara wajar.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: ia menambahkan ... pada dosanya
  rationale: Bentuk hifil dari יסף menyatakan penambahan, sedangkan עַל menunjukkan bahwa pelanggaran baru ditumpuk di atas dosa yang sudah ada.
- source_word: פֶשַׁע
  choice: pemberontakan
  rationale: Kata ini dapat menunjuk pada pelanggaran yang bersifat memberontak atau menentang, lebih kuat daripada kesalahan biasa.
- source_word: בֵּינֵינוּ
  choice: di tengah-tengah kita
  rationale: Secara harfiah berarti “di antara kita” dan secara idiomatis menunjuk pada tindakan yang dilakukan dalam lingkungan para pembicara yang hadir.
- source_word: יִסְפּוֹק
  choice: ia menepukkan tangan
  rationale: Terjemahan ini mempertahankan gambaran gerak tangan yang konkret tanpa memasukkan makna sikapnya langsung ke dalam teks utama; kemungkinan nuansanya dijelaskan dalam catatan kaki.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: dan memperbanyak kata-katanya
  rationale: Bentuk hifil dari רבה menyatakan membuat menjadi banyak; pilihan ini mempertahankan gambaran tentang menumpuk banyak perkataan.
- source_word: לָאֵל
  choice: melawan Allah
  rationale: Walaupun ל secara dasar dapat menyatakan arah kepada, konteks tuduhan—pemberontakan dan perkataan yang bertambah—mendukung arti adversatif, yakni perkataan yang ditujukan melawan Allah.
theological_decisions:
- issue: Apakah perkataan Ayub digambarkan ditujukan “kepada Allah” atau “melawan Allah”.
  choice: melawan Allah
  alternative: kepada Allah
  rationale: 'Konteksnya membentuk peningkatan tuduhan: dosa ditambahi pemberontakan, disertai gerak tangan, lalu perkataan diperbanyak. “Melawan Allah” mempertahankan daya tuduhan Elihu, sementara kemungkinan arah yang lebih netral tetap dicatat.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan susunan yang tetap dekat dengan urutan Ibrani. “Menepukkan tangan” dipilih sebagai ungkapan konkret, bukan “bertepuk tangan,” agar tidak terutama dipahami sebagai tepuk tangan tanda pujian. Semua alternatif penting yang mencerminkan ambiguitas sumber dipertahankan dalam catatan kaki.
