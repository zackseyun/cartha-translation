base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: id
  text: Jika Ia memusatkan hati-Nya pada diri-Nya sendiri[a], dan menghimpun roh dan napas-Nya kepada diri-Nya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika Ia mengarahkan hati-Nya kepada hal ini.” Ungkapan Ibrani “memusatkan hati” dapat berarti mengarahkan perhatian atau menetapkan niat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan klausa syarat secara langsung tanpa menambahkan penegasan yang tidak dituntut oleh bahasa Ibrani.
- source_word: יָשִׂים
  choice: memusatkan
  rationale: Dalam ungkapan dengan לֵב, verba שׂים menyatakan pengarahan perhatian atau niat; 'memusatkan hati' alami dalam bahasa Indonesia dan mempertahankan citra sumber.
- source_word: אֵלָיו
  choice: pada diri-Nya sendiri
  rationale: Preposisi אֶל dengan sufiks yang mengacu kembali kepada subjek dapat dipahami secara refleksif. Pilihan ini mempertahankan pembacaan utama sambil mencatat kemungkinan lain.
- source_word: לִבּוֹ
  choice: hati-Nya
  rationale: '''Hati'' dipertahankan sebagai ungkapan antropologis Ibrani bagi perhatian, niat, atau kehendak batin.'
- source_word: רוּחוֹ
  choice: roh
  rationale: רוּחַ dapat berarti roh, angin, atau napas. Di sini 'roh' membedakannya dari נְשָׁמָה dan sesuai dengan konteks daya hidup yang dapat Allah tarik kembali.
- source_word: וְנִשְׁמָתוֹ
  choice: dan napas-Nya
  rationale: נְשָׁמָה menunjuk pada napas atau napas kehidupan. 'Napas' mempertahankan kesejajaran dengan 'roh' tanpa melebur kedua istilah.
- source_word: יֶאֱסֹף
  choice: menghimpun kembali
  rationale: אָסַף secara harfiah berarti menghimpun atau mengumpulkan. Kata 'kembali' menyampaikan arah אֵלָיו dan implikasi penarikan daya hidup tanpa mengganti citra dasarnya dengan 'mencabut'.
theological_decisions:
- issue: Acuan pronomina orang ketiga tunggal maskulin
  choice: Semua pronomina mengacu kepada Allah; אֵלָיו pertama diterjemahkan secara refleksif.
  alternative: אֵלָיו pertama dapat dipahami 'kepada hal ini' atau sebagai pengarahan perhatian, bukan secara tegas 'pada diri-Nya sendiri'.
  rationale: Konteks argumen Elihu mengidentifikasi Allah sebagai subjek yang dapat menghimpun kembali roh dan napas milik-Nya. Namun, karena hubungan idiomatis antara 'menaruh hati' dan אֵלָיו tidak sepenuhnya tunggal, alternatifnya dipertahankan dalam catatan kaki.
- issue: Kepemilikan 'roh-Nya dan napas-Nya'
  choice: Sufiks diterjemahkan secara formal sebagai milik Allah, yakni 'roh dan napas-Nya'.
  alternative: Dapat dijelaskan secara kontekstual sebagai roh dan napas yang Allah berikan kepada makhluk.
  rationale: Bentuk Ibrani memakai sufiks orang ketiga tunggal yang mengacu kepada subjek ilahi. Terjemahan tidak mengubahnya menjadi 'roh mereka', sementara ayat berikutnya menjelaskan akibatnya bagi segala makhluk.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kapitalisasi pronomina ilahi dipakai sesuai konvensi umum penerbitan Alkitab bahasa Indonesia. Tanda koma dipertahankan karena ayat ini merupakan klausa syarat yang berlanjut ke ayat berikutnya.
