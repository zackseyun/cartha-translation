  yaml_path: translation/ot/job/034/036.yaml
  text: My father[a], let Job be tested to the limit[c][b], because of his answers like wicked men.
translation:
  language: id
  text: Wahai bapaku[a], biarlah Ayub diuji sampai tuntas[b] karena jawaban-jawabannya seperti orang-orang fasik[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapaku”; kemungkinan merupakan sapaan, meskipun ungkapan Ibrani ini juga dipahami dengan cara lain.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sampai selama-lamanya”; di sini kemungkinan berarti diuji secara menyeluruh atau sampai batas akhir.
    reason: lexical_alternative
  - marker: c
    text: Atau “bersama orang-orang fasik” atau “di antara orang-orang fasik”; preposisi Ibrani dapat menyatakan perbandingan atau pergaulan.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִי
  choice: Ya Bapaku
  rationale: Bentuk ini secara harfiah berarti “bapaku” dan paling wajar dipahami sebagai sapaan. Partikel “Ya” menandai vokatif secara alami dalam bahasa Indonesia.
- source_word: יִבָּחֵן
  choice: biarlah ... diuji
  rationale: Bentuk Nifal imperfek dari בחן berarti “diuji/diperiksa”; dalam konteks ini nuansa harapan atau permohonan paling tepat diungkapkan dengan “biarlah”.
- source_word: עַד נֶצַח
  choice: sampai tuntas
  rationale: Secara harfiah berarti “sampai selama-lamanya,” tetapi dalam konteks pengujian kemungkinan besar menekankan pengujian yang menyeluruh atau sampai batas akhir, bukan durasi tanpa akhir.
- source_word: עַל
  choice: karena
  rationale: Preposisi ini memperkenalkan alasan bagi permohonan agar Ayub diuji.
- source_word: תְּשֻׁבוֹת
  choice: jawaban-jawabannya
  rationale: Nomina ini menunjuk pada jawaban atau tanggapan Ayub dalam perdebatan; bentuk ulang terdengar alami dan menunjukkan jamak.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: seperti orang-orang fasik
  rationale: Preposisi ב dapat menyatakan perbandingan atau pergaulan. Dalam konstruksi ini, “seperti orang-orang fasik” menghasilkan kalimat Indonesia yang jelas, sementara kemungkinan arti “bersama/di antara” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Maksud harapan Elihu mengenai pengujian Ayub
  choice: Elihu memohon agar Ayub diuji sampai tuntas karena jawaban-jawabannya menyerupai jawaban orang fasik.
  alternative: Ayub diuji untuk selama-lamanya, atau diuji bersama/di antara orang-orang fasik.
  rationale: Ayat ini sulit secara sintaksis. Terjemahan mempertahankan nada tuduhan Elihu tanpa menjadikan “selama-lamanya” sebagai klaim teologis tentang hukuman kekal, dan mencatat ambiguitas asosiasi/perbandingan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Ya Bapaku” mempertahankan sapaan yang agak tidak lazim dalam teks sumber; “sampai tuntas” menyampaikan daya intensif idiom; dan seluruh penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
