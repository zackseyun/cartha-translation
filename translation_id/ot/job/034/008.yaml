  source_fidelity: Terjemahan dengan tepat menyampaikan וְאָרַח לְחֶבְרָה sebagai pergaulan/keberpihakan sosial-moral, dan mempertahankan paralelisme dengan וְלָלֶכֶת sebagai “berjalan bersama.” פֹּעֲלֵי אָוֶן diterjemahkan secara setia sebagai orang-orang yang melakukan kejahatan, sedangkan אַנְשֵׁי רֶשַׁע sebagai orang-orang fasik secara wajar menyampaikan kelompok orang berciri kefasikan. Subjek “Ia” sesuai dengan kelanjutan sintaksis dari ayat sebelumnya.
