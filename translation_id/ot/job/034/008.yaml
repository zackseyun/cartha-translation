  text: וְ/אָרַ֣ח לְ֭/חֶבְרָה עִם פֹּ֣עֲלֵי אָ֑וֶן וְ֝/לָ/לֶ֗כֶת עִם אַנְשֵׁי רֶֽשַׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: id
  text: Ia bergaul dengan orang-orang yang melakukan kejahatan[a], dan berjalan bersama orang-orang fasik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pelaku kejahatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: Ia bergaul
  rationale: Gabungan verba ארח dan לְחֶבְרָה dalam konteks ini menyatakan pergaulan atau keterikatan dengan suatu kelompok, bukan terutama perjalanan secara harfiah. 'Bergaul' alami dalam bahasa Indonesia dan sesuai dengan paralel 'berjalan bersama'.
- source_word: עִם
  choice: dengan / bersama
  rationale: Preposisi ini menyatakan kebersamaan; variasi Indonesia dipakai agar kedua klausa terdengar alami.
- source_word: פֹּעֲלֵי אָוֶן
  choice: orang-orang yang melakukan kejahatan
  rationale: Ungkapan ini secara harfiah menunjuk para pelaku atau pekerja אָוֶן. Terjemahan klausal ini mempertahankan gagasan tindakan jahat dengan bahasa Indonesia yang wajar; אָוֶן di sini dipahami secara moral sebagai kejahatan.
- source_word: וְ/לָ/לֶכֶת
  choice: dan berjalan
  rationale: הלך mempertahankan citra berjalan, yang dalam sastra hikmat juga dapat menunjuk arah hidup dan pergaulan seseorang.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: orang-orang fasik
  rationale: אַנְשֵׁי רֶשַׁע berarti orang-orang yang bercirikan kefasikan atau kejahatan. 'Orang-orang fasik' merupakan padanan Indonesia yang ringkas, bermuatan moral, dan tidak perlu memaksakan gender gramatikal Ibrani ke dalam bahasa Indonesia.
theological_decisions:
- issue: Citra moral dalam 'berjalan bersama'
  choice: Mempertahankan verba 'berjalan' tanpa menjelaskan apakah maknanya harfiah atau kiasan
  alternative: hidup bersama / mengikuti jalan hidup
  rationale: Bahasa Ibrani memungkinkan citra perjalanan sekaligus hubungan dengan jalan hidup dan pergaulan. Mempertahankan 'berjalan' menjaga ambiguitas serta paralelisme puitis.
- issue: Gender dalam אַנְשֵׁי רֶשַׁע
  choice: orang-orang fasik
  alternative: laki-laki fasik
  rationale: Dalam bahasa Ibrani, אֲנָשִׁים adalah bentuk maskulin, tetapi di sini fokus semantisnya ialah kelompok orang fasik, bukan penegasan jenis kelamin. Bahasa Indonesia secara alami memakai 'orang-orang' tanpa menghapus unsur kontekstual yang relevan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ayat ini merupakan kelanjutan sintaksis dari ayat sebelumnya; subjek 'Ia' ditambahkan secara alami agar fragmen dapat dibaca sebagai satu ayat mandiri. Paralelisme antara 'bergaul' dan 'berjalan bersama' dipertahankan.
