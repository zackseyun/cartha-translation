  terminology: “Kejahatan” untuk אָוֶן dan “fasik” untuk רֶשַׁע merupakan pilihan istilah yang tepat dalam register Alkitab bahasa Indonesia. Penggunaan “orang-orang” wajar dalam bahasa Indonesia dan tidak menambahkan pembatasan gender yang tidak dituntut oleh konteks.
