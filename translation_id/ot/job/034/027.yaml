  text: because they turned aside from following him[b][a], and they did not understand any of his ways.
translation:
  language: id
  text: sebab mereka berpaling dari mengikuti Dia,[a] dan tidak memahami satu pun jalan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari belakang-Nya”; ini adalah ungkapan Ibrani yang berarti berhenti mengikuti-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak mempertimbangkan segala jalan-Nya” atau “tidak mengindahkan satu pun jalan-Nya.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר עַל כֵּן
  choice: sebab
  rationale: Gabungan ini berfungsi secara idiomatis untuk menyatakan alasan bagi penghukuman yang disebut sebelumnya; “sebab” mempertahankan hubungan kausal secara alami.
- source_word: סָרוּ מֵאַחֲרָיו
  choice: mereka menyimpang dan tidak lagi mengikuti Dia
  rationale: סור menyatakan tindakan menyimpang atau berbalik, sedangkan מֵאַחֲרָיו secara harfiah berarti “dari belakang-Nya” dan secara idiomatis berarti berhenti mengikuti-Nya. Rumusan ini menyampaikan kedua unsur tersebut dengan jelas.
- source_word: וְכָל דְּרָכָיו
  choice: serta ... satu pun jalan-Nya
  rationale: Secara harfiah berarti “dan segala jalan-Nya,” tetapi dalam cakupan penyangkalan bahasa Indonesia, “tidak ... satu pun” secara alami menyampaikan makna distributifnya. “Jalan” mempertahankan metafora Ibrani tentang tindakan, kehendak, atau tata laku Allah.
- source_word: לֹא הִשְׂכִּילוּ
  choice: tidak memperhatikan
  rationale: Bentuk Hifil dari שׂכל dapat berarti memahami, mempertimbangkan, memperhatikan dengan saksama, atau bertindak bijaksana. Dalam hubungan dengan “jalan-Nya,” “tidak memperhatikan” mempertahankan kemungkinan kelalaian yang disengaja tanpa membatasinya pada kegagalan intelektual.
theological_decisions:
- issue: Acuan sufiks orang ketiga tunggal maskulin pada מֵאַחֲרָיו dan דְּרָכָיו
  choice: Dipahami sebagai Allah dan ditulis “Dia” serta “-Nya” menurut kaidah bahasa Indonesia
  alternative: Seorang penguasa atau hakim manusia sebagai acuan terdekat
  rationale: Konteks pidato Elihu membicarakan Allah yang melihat dan menghakimi perilaku manusia. Namun, nama Allah tidak disisipkan ke dalam teks, sehingga bentuk pronominal sumber tetap dipertahankan.
- issue: Nuansa לֹא הִשְׂכִּילוּ
  choice: tidak memperhatikan
  alternative: tidak memahami; tidak mempertimbangkan; tidak bertindak bijaksana mengenai
  rationale: Pilihan ini tidak mengubah pernyataan menjadi ketidakmampuan intelektual semata dan mempertahankan ketegangan semantis kata kerja Ibrani; alternatif penting dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kausal dipertahankan karena ayat ini melanjutkan kalimat sebelumnya. Kapitalisasi “Dia/-Nya” mengikuti kebiasaan ejaan Indonesia untuk acuan kepada Allah, sementara pronomina—bukan nama ilahi—tetap digunakan agar identifikasi kontekstual sumber tidak diperjelas secara berlebihan.
