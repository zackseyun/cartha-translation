base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: id
  text: 'Karena itu, hai orang-orang yang berpengertian,[a] dengarkanlah aku: Tidak mungkin Allah berbuat jahat ataupun Yang Mahakuasa berbuat tidak adil.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang berhati”; dalam bahasa Ibrani, “hati” di sini menunjuk pada pengertian dan daya pertimbangan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Jauhlah dari Allah berbuat jahat, dan dari Yang Mahakuasa berbuat tidak adil.” Ungkapan Ibraninya menegaskan bahwa kejahatan semacam itu sama sekali tidak dapat dikaitkan dengan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Penanda wacana ini menghubungkan seruan Elihu dengan uraiannya sebelumnya dan menyatakan kelanjutan atau kesimpulan logis secara alami dalam bahasa Indonesia.
- source_word: אַנֲשֵׁי לֵבָב
  choice: orang-orang yang berpengertian
  rationale: Secara harfiah berarti 'orang-orang berhati', tetapi dalam idiom Ibrani 'hati' merupakan pusat pengertian dan pertimbangan. Pilihan ini menyampaikan makna idiomatis tanpa mengubah sapaan kepada sekelompok orang.
- source_word: שִׁמְעוּ לִי
  choice: dengarkanlah aku
  rationale: Bentuk imperatif dengan לִי meminta perhatian sungguh-sungguh kepada pembicara; partikel -lah mempertahankan nada seruan yang bermartabat.
- source_word: חָלִילָה
  choice: Mustahil
  rationale: Ungkapan ini menyatakan penolakan yang sangat kuat—bahwa hal tersebut sama sekali tidak dapat dibayangkan atau dikaitkan dengan Allah. 'Mustahil' alami dan tegas dalam bahasa Indonesia.
- source_word: לָאֵל מֵרֶשַׁע
  choice: Allah berbuat fasik
  rationale: Konstruksi dengan חָלִילָה menyingkirkan kefasikan sama sekali dari Allah. Kata kerja 'berbuat' mengungkapkan gagasan verbal yang tersirat, sedangkan 'fasik' mempertahankan bobot moral רֶשַׁע.
- source_word: וְשַׁדַּי
  choice: dan Yang Mahakuasa
  rationale: שַׁדַּי diperlakukan sebagai gelar ilahi dan diterjemahkan agar maknanya langsung dipahami pembaca Indonesia.
- source_word: מֵעָוֶל
  choice: berbuat tidak adil
  rationale: עָוֶל menunjuk pada ketidakadilan atau perbuatan salah. Ungkapan ini mempertahankan kesejajaran dengan 'berbuat fasik' sekaligus menyatakan nuansa yuridis-moral kata tersebut.
theological_decisions:
- issue: Penerjemahan gelar ilahi שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Shaddai
  rationale: Dalam konteks ini שַׁדַּי berfungsi sebagai gelar ilahi. Menerjemahkannya menyampaikan maknanya kepada pembaca tanpa menjadikannya nama diri.
- issue: Cakupan gender dalam אַנֲשֵׁי לֵבָב
  choice: orang-orang yang berpengertian
  alternative: laki-laki yang berpengertian
  rationale: אַנְשֵׁי merupakan bentuk jamak maskulin, tetapi dalam sapaan hikmat ini dapat merujuk secara generik kepada orang-orang yang memiliki pengertian. Bahasa Indonesia secara alami memakai 'orang-orang' tanpa menambahkan pembatasan biologis yang tidak harus dituntut oleh konteks.
- issue: Bentuk penyangkalan חָלִילָה ... מִן
  choice: Mustahil Allah berbuat fasik, dan Yang Mahakuasa berbuat tidak adil
  alternative: Jauhlah kiranya kefasikan dari Allah dan ketidakadilan dari Yang Mahakuasa
  rationale: Pilihan utama menyampaikan daya penolakan idiom Ibrani secara alami. Alternatif yang lebih formal mempertahankan gambaran keterpisahan, sehingga dicatat dalam catatan kaki agar ketegangan bentuk dan makna tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'hai' dan partikel '-lah' mempertahankan nada pidato hikmat tanpa menjadi terlalu arkais. Paralelisme dua klausa Ibrani dipertahankan.
