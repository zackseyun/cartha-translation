  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: id
  text: 'Orang-orang yang berpengertian[a] akan berkata kepadaku,

    dan orang bijak yang mendengarkan aku,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang berhati,” suatu ungkapan Ibrani untuk orang-orang yang berpengertian atau memiliki pertimbangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: orang-orang yang berpengertian
  rationale: Secara harfiah berarti “orang-orang berhati,” tetapi dalam idiom Ibrani, “hati” juga menunjuk pada kemampuan berpikir dan menimbang. Pilihan ini menyampaikan makna idiomatis secara wajar dalam bahasa Indonesia tanpa membatasi ungkapan generik itu hanya kepada laki-laki.
- source_word: יֹאמְרוּ לִי
  choice: akan berkata kepadaku
  rationale: Bentuk yiqtol dapat menyatakan hal yang diharapkan atau akan terjadi dalam konteks ini; “akan berkata kepadaku” mempertahankan nuansa tersebut.
- source_word: וְגֶבֶר חָכָם
  choice: dan orang bijak
  rationale: Dalam paralelisme dengan “orang-orang yang berpengertian,” גֶבֶר paling wajar dipahami sebagai seorang manusia atau laki-laki; bahasa Indonesia alami cukup menyatakannya sebagai “orang bijak.”
- source_word: שֹׁמֵעַ לִי
  choice: yang mendengarkan aku
  rationale: Partisipel ini menerangkan orang bijak sebagai orang yang sedang memberi perhatian kepada perkataan Elihu. “Mendengarkan” lebih alami dan menangkap unsur perhatian dibanding sekadar “mendengar.”
