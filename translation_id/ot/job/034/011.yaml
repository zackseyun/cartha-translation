source:
  edition: WLC
  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: id
  text: Sebab Dia membalas setiap orang sesuai dengan perbuatannya dan membuatnya mengalami apa yang sesuai dengan jalan hidupnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendatangkan kepadanya apa yang sesuai dengan jalan hidupnya.” Kata kerja Ibrani berbentuk kausatif dan dapat berarti membuat seseorang menemukan atau mengalami sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberi alasan bagi pernyataan Elihu sebelumnya; “Sebab” mempertahankan fungsi penjelasnya secara alami.
- source_word: פֹעַל אָדָם
  choice: perbuatan setiap orang
  rationale: פֹעַל menunjuk pada tindakan atau perbuatan seseorang dalam konteks keadilan dan pembalasan. Bentuk tunggal אָדָם bersifat representatif; “setiap orang” menyampaikan cakupan generiknya dalam bahasa Indonesia modern.
- source_word: יְשַׁלֶּם לֹו
  choice: Dia membalas setiap orang
  rationale: Bentuk piel dari שׁלם di sini berarti membalas atau memberi ganjaran setimpal. “Membalas” mempertahankan nuansa retributif tanpa menentukan apakah hasilnya berupa hukuman atau ganjaran baik.
- source_word: וּכְאֹרַח אִישׁ
  choice: sesuai dengan jalan hidupnya
  rationale: אֹרַח secara harfiah berarti jalan atau lintasan dan secara kiasan menunjuk pada cara hidup. “Jalan hidup” mempertahankan metafora sekaligus jelas bagi pembaca modern.
- source_word: יַמְצִאֶנּוּ
  choice: membuatnya mengalami apa yang sesuai
  rationale: Bentuk hifil dari מצא memiliki arti kausatif, yakni membuat seseorang menemukan atau mengalami sesuatu. Ungkapan ini menyampaikan akibat yang menimpa orang tersebut tanpa menghilangkan unsur kausatif.
theological_decisions:
- issue: Pembalasan ilahi sesuai dengan perbuatan manusia
  choice: Ayat ini menyatakan prinsip bahwa Allah membalas setiap orang sesuai dengan perbuatan dan jalan hidupnya.
  alternative: Memahaminya sebagai pernyataan bahwa setiap penderitaan selalu merupakan hukuman langsung dan setimpal atas dosa pribadi tertentu.
  rationale: Kata-kata Elihu menegaskan keadilan ilahi, tetapi terjemahan tidak boleh memperluas pernyataan ini menjadi penyelesaian sederhana atas seluruh ketegangan teologis dalam kitab Ayub.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Dia” merujuk kepada Allah dari konteks. “Setiap orang” dipakai untuk menyampaikan fungsi generik dari nomina maskulin tunggal tanpa membatasi pernyataan hanya kepada laki-laki.
