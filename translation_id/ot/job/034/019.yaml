  text: אֲשֶׁ֤ר לֹֽא נָשָׂ֨א פְּנֵ֥י שָׂרִ֗ים וְ/לֹ֣א נִכַּר שׁ֭וֹעַ לִ/פְנֵי דָ֑ל כִּֽי מַעֲשֵׂ֖ה יָדָ֣י/ו כֻּלָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: id
  text: yang tidak memihak kepada para pembesar dan tidak mengutamakan orang kaya daripada orang miskin, karena mereka semua adalah karya tangan-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָשָׂא פְּנֵי שָׂרִים
  choice: tidak memihak kepada para pembesar
  rationale: Ungkapan idiomatis Ibrani 'mengangkat wajah' dalam konteks ini berarti menunjukkan keberpihakan; 'para pembesar' menyampaikan שרים sebagai orang berkedudukan tinggi.
- source_word: וְלֹא נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: tidak mengutamakan orang kaya daripada orang miskin
  rationale: נכר di sini menyatakan perlakuan atau pengakuan istimewa, sedangkan konstruksi לִפְנֵי menunjukkan bahwa orang kaya tidak ditempatkan di atas orang miskin.
- source_word: מַעֲשֵׂה יָדָיו
  choice: buatan tangan-Nya
  rationale: Mempertahankan gambaran konkret bahwa semua manusia merupakan karya tangan Allah, sambil memakai ungkapan Indonesia yang alami.
theological_decisions:
- issue: Ketidakberpihakan Allah terhadap status sosial
  choice: tidak mengutamakan orang kaya daripada orang miskin
  alternative: tidak memandang orang kaya melebihi orang miskin
  rationale: Pilihan ini mempertahankan kontras status sosial dan maksud ketidakberpihakan tanpa menyiratkan bahwa Allah sama sekali tidak memperhatikan individu.
- issue: Rujukan pronomina posesif pada 'tangan-Nya'
  choice: huruf kapital pada -Nya
  alternative: huruf kecil pada -nya
  rationale: Konteks mengacu kepada Allah; kapitalisasi mengikuti kelaziman bahasa Indonesia untuk pronomina ilahi tanpa menambah sebutan yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur anak kalimat dipertahankan karena ayat ini melanjutkan konteks sebelumnya; diksi dibuat jelas bagi pembaca umum tanpa menghilangkan paralelisme sosial dalam teks Ibrani.
