  text: so as to bring before him the cry of the poor[b][a], and he hears the cry of the afflicted.
translation:
  language: id
  text: sehingga jeritan orang miskin dibawa ke hadapan-Nya[a], dan Ia mendengar jeritan orang-orang yang tertindas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menimpa dia” atau “diajukan terhadap dia”; preposisi Ibrani di sini dapat dipahami dengan lebih dari satu cara.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang lemah ... orang sengsara.” Kedua istilah Ibrani ini bertumpang tindih maknanya, tetapi tidak sama persis.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: sehingga ... sampai
  rationale: Prefiks ל pada infinitif kausatif dapat menyatakan tujuan atau akibat. Dalam konteks ini, susunan idiomatis bahasa Indonesia ini menyampaikan bahwa tindakan sebelumnya menyebabkan jeritan itu mencapai perhatian Allah.
- source_word: עָלָיו
  choice: ke hadapan-Nya
  rationale: Dengan gagasan gerak pada לְהָבִיא, frasa ini wajar dipahami sebagai jeritan yang dibawa ke hadapan atau perhatian Allah. Kemungkinan arti lain tetap dicatat dalam catatan kaki.
- source_word: צַעֲקַת
  choice: jeritan
  rationale: Kata ini menunjuk pada seruan keras karena kesusahan. 'Jeritan' langsung, alami, dan mempertahankan daya emosional istilah Ibrani.
- source_word: דָּל
  choice: orang miskin
  rationale: Istilah ini dapat mengacu pada orang miskin, lemah, atau tidak berdaya secara sosial. 'Orang miskin' merupakan padanan utama yang sesuai dengan konteks.
- source_word: וְצַעֲקַת
  choice: dan ... jeritan
  rationale: Pengulangan nomina dipertahankan untuk mencerminkan paralelisme dan penekanan dalam puisi Ibrani.
- source_word: עֲנִיִּים
  choice: orang-orang yang tertindas
  rationale: Istilah ini mencakup orang yang sengsara, miskin, direndahkan, atau ditindas. Pilihan ini membedakannya dari דָּל tanpa meniadakan tumpang tindih makna keduanya.
- source_word: יִשְׁמָע
  choice: Ia mendengar
  rationale: Bentuk imperfek dalam puisi hikmat dapat menyatakan tindakan khas atau yang berlaku umum. Bentuk kini bahasa Indonesia cocok untuk penegasan bahwa Allah mendengar jeritan itu.
theological_decisions:
- issue: Acuan pronomina dalam עָלָיו dan subjek יִשְׁמָע
  choice: Jeritan itu sampai ke hadapan Allah, dan Allah mendengar jeritan orang-orang yang tertindas.
  alternative: Jeritan itu diajukan terhadap orang fasik sementara Allah mendengarnya; atau jeritan itu menimpa si penindas dan ia yang mendengarnya.
  rationale: Dalam konteks dekat, Elihu membahas penindasan oleh orang fasik dan pengetahuan serta penghakiman Allah. Subjek tersirat pada 'mendengar' paling wajar adalah Allah. Namun, keluasan makna preposisi עַל dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan 'jeritan' dipertahankan untuk paralelisme. Huruf kapital pada pronomina ilahi mengikuti konvensi penerbitan religius Indonesia dan memperjelas acuan kontekstual tanpa menghapus alternatif pada catatan kaki.
