  terminology: “Ayub” dan “Allah” sesuai pemakaian baku. “Berada di pihak yang benar” menjaga bingkai perkara tanpa menyatakan kesalehan mutlak. “Hakku” merupakan padanan utama yang lebih alami untuk מִשְׁפָּטִי; catatan kaki mempertahankan kemungkinan “keadilanku,” “keadilan yang menjadi hakku,” dan “perkaraku.”
