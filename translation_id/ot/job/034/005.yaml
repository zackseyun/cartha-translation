base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: id
  text: Sebab Ayub telah berkata, “Aku berada di pihak yang benar, dan Allah telah mencabut hakku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilanku,” “keadilan yang menjadi hakku,” atau “perkaraku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi uraian Elihu. “Sebab” sesuai dengan alur argumentatif ayat ini.
- source_word: אָמַר
  choice: telah berkata
  rationale: Bentuk qatal melaporkan perkataan Ayub sebelumnya yang masih relevan bagi argumen Elihu.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: צָדַקְתִּי
  choice: Aku berada di pihak yang benar
  rationale: Ungkapan ini menyampaikan klaim Ayub bahwa ia benar dalam perkara yang dipersengketakan, tanpa memperluasnya menjadi klaim kesempurnaan moral.
- source_word: וְאֵל
  choice: dan Allah
  rationale: וְ diterjemahkan secara aditif sebagai “dan”; אֵל adalah sebutan umum bagi Allah dan tidak perlu diperluas menjadi gelar lain.
- source_word: הֵסִיר
  choice: telah mencabut
  rationale: Bentuk hifil dari סור berarti menyingkirkan atau mengambil. “Mencabut” terdengar alami dalam hubungannya dengan hak yang dianggap tidak lagi diberikan kepada seseorang.
- source_word: מִשְׁפָּטִי
  choice: hakku atas keadilan
  rationale: מִשְׁפָּט dapat menunjuk pada keadilan, hak hukum, putusan, atau perkara. Frasa ini menyampaikan dimensi hukum dan moralnya secara alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan alternatif leksikalnya.
theological_decisions:
- issue: Nuansa forensik dalam pernyataan Ayub tentang dirinya
  choice: Aku berada di pihak yang benar
  alternative: Aku benar; Aku orang benar
  rationale: Pilihan ini mengaitkan klaim Ayub dengan perkara yang sedang diperdebatkan di hadapan Allah, tanpa membuatnya terdengar sebagai pernyataan bahwa ia sama sekali tidak berdosa.
- issue: Cakupan makna מִשְׁפָּטִי
  choice: hakku atas keadilan
  alternative: hakku; keadilan yang menjadi hakku; perkaraku
  rationale: Pilihan utama mempertahankan unsur hak dan keadilan dalam istilah Ibrani. Catatan kaki menjaga keluasan maknanya agar ketegangan hukum dan moral dalam pernyataan Ayub tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan nada hukum dari perkataan yang dinisbatkan Elihu kepada Ayub.
