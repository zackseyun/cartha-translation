  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: id
  text: 'Sebab, pernahkah seseorang berkata kepada Allah, “Aku telah menanggung hukuman[a]; aku tidak akan berbuat salah”?


    [a] Secara lebih harfiah: “Aku telah menanggung; aku tidak akan bertindak jahat.” Dalam bahasa Ibrani, apa yang ditanggung tidak disebutkan; yang dimaksud mungkin hukuman, hajaran, atau kesalahan yang harus ditanggung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku telah menanggung; aku tidak akan bertindak jahat.” Dalam bahasa Ibrani, apa yang ditanggung tidak disebutkan; yang dimaksud mungkin hukuman, hajaran, atau kesalahan yang harus ditanggung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberikan alasan atau penjelasan bagi argumen sebelumnya.
- source_word: אֶל אֵל
  choice: kepada Allah
  rationale: Preposisi אֶל bersama אֵל secara alami berarti ‘kepada Allah’; di sini אֵל berfungsi sebagai sebutan umum bagi Allah.
- source_word: הֶאָמַר
  choice: pernahkah seseorang berkata
  rationale: Bentuknya secara morfologis adalah orang ketiga tunggal maskulin, tetapi dalam konteks ini paling wajar dipahami sebagai pertanyaan retoris dengan subjek tak tentu. ‘Pernahkah seseorang berkata’ alami dalam bahasa Indonesia dan mempertahankan daya retorisnya.
- source_word: נָשָׂאתִי
  choice: Aku telah menanggung hukuman
  rationale: נשׂא pada dasarnya berarti ‘mengangkat, membawa, menanggung’. Objeknya tidak dinyatakan dalam teks Ibrani; konteks pengakuan di hadapan Allah memungkinkan pengertian hukuman atau hajaran. Kata ‘hukuman’ ditambahkan demi kejelasan, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לֹא
  choice: tidak
  rationale: Padanan langsung bagi penyangkalan Ibrani.
- source_word: אֶחְבֹּל
  choice: aku tidak akan berbuat salah lagi
  rationale: Dalam konteks etis ini, חבל dapat berarti bertindak rusak, jahat, atau salah. ‘Berbuat salah lagi’ menyampaikan janji untuk tidak mengulangi pelanggaran dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Objek tersirat dari נָשָׂאתִי
  choice: Menampilkan ‘hukuman’ dalam teks utama dan mempertahankan ketidakpastian dalam catatan kaki.
  alternative: Menerjemahkan secara harfiah ‘Aku telah menanggung’ tanpa objek.
  rationale: Konteks mendukung hukuman atau hajaran sebagai objek tersirat, tetapi bahasa Ibrani tidak menyatakannya. Catatan kaki mencegah kemungkinan tafsir itu tampil sebagai sesuatu yang pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris dibuat alami bagi pembaca umum. Istilah ‘Allah’ dipakai sebagai padanan standar אֵל, sedangkan elipsis pada kata ‘menanggung’ dijelaskan agar ambiguitas sumber tetap terlihat.
