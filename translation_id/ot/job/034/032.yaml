  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּלְעֲדֵ֣י אֶ֭חֱזֶה אַתָּ֣ה הֹרֵ֑/נִי אִֽם עָ֥וֶל פָּ֝עַ֗לְתִּי לֹ֣א אֹסִֽיף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/032.yaml
  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: id
  text: Apa yang tidak kulihat, ajarkanlah kepadaku;[a] jika aku telah berbuat salah, aku tidak akan mengulanginya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Di luar apa yang kulihat, ajarilah aku.” Bahasa Ibraninya eliptis dan dapat dipahami sebagai permohonan agar hal yang tidak dilihat atau disadari diperlihatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “aku tidak akan menambah lagi,” yaitu, “aku tidak akan meneruskannya” atau “aku tidak akan melakukannya lagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: Apa yang tidak kulihat
  rationale: Ungkapan Ibrani ini eliptis. Terjemahan ini menyampaikan kemungkinan makna ‘apa yang tidak kulihat atau kusadari’ sambil mempertahankan citra melihat.
- source_word: אַתָּה הֹרֵנִי
  choice: ajarkanlah kepadaku
  rationale: Bentuk Hifil dari ירה lazim berarti ‘mengajar’ atau ‘memberi petunjuk’. Bentuk permohonan ini alami dalam bahasa Indonesia dan sesuai dengan konteks kesediaan menerima koreksi.
- source_word: אִם
  choice: jika
  rationale: Kata ini paling wajar dipahami sebagai pengantar syarat, tanpa mengubahnya menjadi pengakuan bersalah yang pasti.
- source_word: עָוֶל פָּעַלְתִּי
  choice: aku telah berbuat salah
  rationale: עָוֶל menunjuk pada kesalahan, kejahatan, atau ketidakadilan, sedangkan פעל berarti melakukan. ‘Berbuat salah’ alami dan cukup luas tanpa mempersempit jenis pelanggarannya.
- source_word: לֹא אֹסִיף
  choice: aku tidak akan mengulanginya
  rationale: Secara harfiah berarti ‘aku tidak akan menambah lagi’, sebuah ungkapan yang dalam konteks berarti tidak meneruskan atau mengulangi perbuatan tersebut.
theological_decisions:
- issue: Ucapan sebagai sikap mau diajar dan tekad menghentikan kesalahan di hadapan Allah
  choice: Menerjemahkannya sebagai permohonan untuk diajar dan tekad bersyarat untuk tidak mengulangi kesalahan.
  alternative: 'Menerjemahkan secara sangat harfiah: ‘Di luar yang kulihat, ajarilah aku; jika aku telah melakukan kejahatan, aku tidak akan menambah lagi.’'
  rationale: Terjemahan mempertahankan kerendahan hati dan kesediaan menerima koreksi tanpa mengubah klausa bersyarat menjadi pengakuan bersalah yang tegas atau memasukkan istilah pertobatan formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Bentuk ‘kulihat’ dan ‘ajarkanlah kepadaku’ menjaga kelancaran serta nuansa permohonan. Semua penanda catatan kaki dicantumkan dalam teks utama.
