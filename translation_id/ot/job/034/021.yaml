  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי עֵ֭ינָי/ו עַל דַּרְכֵי אִ֑ישׁ וְֽ/כָל צְעָדָ֥י/ו יִרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/021.yaml
  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: id
  text: Sebab mata-Nya tertuju pada jalan-jalan manusia[a], dan Ia melihat setiap langkahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jalan-jalan seorang laki-laki.” Bentuk maskulin tunggal dalam bahasa Ibrani dipakai dengan arti umum, yaitu manusia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: עֵינָיו
  choice: mata-Nya
  rationale: Nomina jamak dengan sufiks orang ketiga maskulin tunggal. Dalam konteks, pronomina itu merujuk kepada Allah, sehingga huruf kapital dipakai menurut kelaziman bahasa Indonesia.
- source_word: עַל
  choice: tertuju pada
  rationale: Bersama “mata” dan objek pengamatan, ungkapan ini secara alami menyatakan perhatian dan pengawasan tanpa mengubah makna dasar preposisinya.
- source_word: דַּרְכֵי אִישׁ
  choice: jalan-jalan manusia
  rationale: דֶּרֶךְ dapat menunjuk pada jalan maupun, secara kiasan, perilaku atau perjalanan hidup. אִישׁ berbentuk maskulin tunggal tetapi di sini berdaya generik; “manusia” menyampaikan cakupan umum itu secara wajar dalam bahasa Indonesia.
- source_word: וְכָל
  choice: dan … setiap
  rationale: Gabungan konjungsi dan unsur totalitas ini diterjemahkan dengan “dan … setiap” agar selaras secara idiomatis dengan nomina tunggal “langkah”.
- source_word: צְעָדָיו
  choice: langkahnya
  rationale: Kata ini mempertahankan gambaran konkret tentang langkah, yang sekaligus dapat melambangkan tindakan atau perjalanan hidup seseorang.
- source_word: יִרְאֶה
  choice: Ia melihat
  rationale: Bentuk imperfek Qal orang ketiga maskulin tunggal menyatakan kebenaran umum atau tindakan yang berlangsung; kala kini tersirat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Maskulin generik אִישׁ
  choice: manusia
  alternative: seorang laki-laki
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, pemakaiannya bersifat representatif dan mencakup manusia pada umumnya. “Manusia” menjaga daya generik itu tanpa menyempitkan maksud ayat hanya kepada laki-laki; bentuk sumber dijelaskan dalam catatan kaki.
- issue: Rujukan pronomina ilahi
  choice: mata-Nya … Ia
  alternative: matanya … ia
  rationale: Konteks wacana merujuk kepada Allah. Kapitalisasi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia, tetapi tidak menambahkan nama Allah ke dalam teks ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan paralelisme antara “jalan-jalan” dan “setiap langkahnya,” serta tidak mempersempit maskulin generik Ibrani.
