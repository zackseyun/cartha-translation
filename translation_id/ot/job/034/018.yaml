  text: הַ/אֲמֹ֣ר לְ/מֶ֣לֶךְ בְּלִיָּ֑עַל רָ֝שָׁ֗ע אֶל נְדִיבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/018.yaml
  text: who says to a king[a], ‘Worthless one!’ and to nobles[b], ‘Wicked ones!’
translation:
  language: id
  text: Patutkah orang berkata kepada seorang raja, “Orang tak berguna!”[a] dan kepada para bangsawan, “Orang-orang fasik!”[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani memakai istilah yang berarti tidak berguna, hina, atau bejat; di sini bukan nama diri “Belial”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani “fasik” berbentuk tunggal, tetapi ditujukan kepada “para bangsawan” yang berbentuk jamak; karena itu diterjemahkan dalam bentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמֹר
  choice: Patutkah orang berkata
  rationale: Bentuk ini paling wajar dipahami sebagai pertanyaan retoris dengan הֲ interogatif dan infinitif אָמַר. Ungkapan “patutkah orang berkata” menyampaikan pertanyaan tentang kepantasan berbicara demikian kepada penguasa.
- source_word: לְמֶלֶךְ
  choice: kepada seorang raja
  rationale: Preposisi לְ menandai pihak yang disapa, sedangkan מֶלֶךְ tanpa kata sandang dipahami secara umum.
- source_word: בְּלִיָּעַל
  choice: Orang tak berguna
  rationale: Di sini istilah tersebut merupakan sebutan menghina yang menyatakan kehinaan atau ketidakberhargaan, bukan nama diri Belial. Bentuk tunggal sesuai dengan raja yang disapa.
- source_word: רָשָׁע
  choice: Orang-orang fasik
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini ditujukan kepada נְדִיבִים yang jamak; bentuk jamak dalam bahasa Indonesia membuat cakupan sapaan jelas tanpa mengubah sifat yang dinyatakan.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini memperkenalkan pihak yang disapa dan sejajar dengan לְ pada bagian pertama.
- source_word: נְדִיבִים
  choice: para bangsawan
  rationale: Dalam konteks pemerintahan dan kesejajarannya dengan “raja”, kata ini menunjuk kepada orang-orang berkedudukan tinggi; “para bangsawan” alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah הַאֲמֹר merupakan pertanyaan retoris atau frasa substantival “orang yang berkata”
  choice: 'Diterjemahkan sebagai pertanyaan retoris: “Patutkah orang berkata ...?”'
  alternative: “yang berkata ...”
  rationale: Pembacaan interogatif sesuai dengan bentuk הֲ + infinitif dan menghasilkan kalimat Ibrani yang utuh dalam konteks. Namun, bentuk konsonantal dan hubungan sintaksisnya telah dipahami berbeda; terjemahan utama mengikuti pembacaan interogatif yang paling langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pertanyaan retoris dipertahankan, sedangkan kedua seruan dibuat ringkas dan kuat. Tanda [a] dan [b] ditempatkan langsung setelah ungkapan yang dijelaskan.
