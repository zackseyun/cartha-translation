  text: There is no darkness[a], and no deep shadow, where workers of wickedness may hide themselves.
translation:
  language: id
  text: Tidak ada kegelapan ataupun bayang-bayang kelam yang di dalamnya para pelaku kejahatan dapat bersembunyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayang-bayang maut”; istilah Ibrani ini juga dapat berarti kegelapan yang sangat pekat atau kemuraman dalam konteks puitis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Tidak ada
  rationale: Menyampaikan negasi eksistensial Ibrani secara alami dan langsung dalam bahasa Indonesia.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Makna umum kata ini adalah kegelapan; dalam konteks ini menunjuk pada sarana untuk bersembunyi dan berpasangan dengan istilah yang lebih kuat sesudahnya.
- source_word: צַלְמָוֶת
  choice: kelam pekat
  rationale: Dalam puisi hikmat, istilah ini dapat berarti kegelapan yang sangat dalam atau kemuraman, tanpa harus secara khusus merujuk pada kematian. Pilihan ini mempertahankan peningkatan puitis setelah 'kegelapan'.
- source_word: לְהִסָּתֶר
  choice: dapat menyembunyikan diri
  rationale: Infinitif dengan ל menyatakan kemungkinan atau tujuan bersembunyi dalam lingkup penyangkalan. Bentuk refleksif sesuai dengan verba Ibrani dan alami dalam bahasa Indonesia.
- source_word: שָׁם
  choice: tempat
  rationale: 'Secara harfiah berarti ''di sana'', tetapi dalam susunan ini berfungsi wajar sebagai penghubung lokatif: tidak ada tempat berupa kegelapan itu untuk bersembunyi.'
- source_word: פֹּעֲלֵי אָוֶן
  choice: para pelaku kejahatan
  rationale: Mengungkapkan orang-orang yang melakukan אָוֶן secara alami, jelas, dan tetap mempertahankan unsur tindakan dari partisipel פֹּעֲלֵי.
- source_word: אָוֶן
  choice: kejahatan
  rationale: Di sini konteksnya adalah keburukan moral yang dilakukan oleh orang-orang yang hendak bersembunyi dari pengamatan Allah.
theological_decisions:
- issue: Makna צַלְמָוֶת dalam konteks puitis
  choice: kelam pekat
  alternative: bayang-bayang maut; kegelapan yang sangat pekat
  rationale: Ayat ini menekankan mustahilnya bersembunyi dari Allah, bukan kematian itu sendiri. Terjemahan utama mempertahankan gagasan kegelapan mendalam, sementara arti tradisional yang mungkin tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kelam pekat' mempertahankan intensifikasi puitis tanpa terdengar kuno; 'para pelaku kejahatan' jelas bagi pembaca umum.
