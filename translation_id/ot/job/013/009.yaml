  yaml_path: translation/ot/job/013/009.yaml
  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: id
  text: Apakah itu akan baik ketika Dia menyelidiki kalian? Atau, apakah kalian akan mempermainkan Dia[a] seperti kalian mempermainkan seorang manusia?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti “mengejek” atau “menipu”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seorang manusia”; yakni manusia biasa yang fana, berbeda dengan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: Apakah hasilnya akan baik bagi kalian
  rationale: Partikel tanya dengan טוֹב membentuk pertanyaan retoris yang mengarah pada akibat pemeriksaan Allah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa keadaan mereka tidak akan berakhir baik.
- source_word: כִּי
  choice: ketika
  rationale: Di sini כִּי memperkenalkan keadaan saat penilaian itu berlaku. 'Ketika' sesuai dengan nuansa temporal dalam konteks.
- source_word: יַחְקֹר
  choice: Dia menyelidiki
  rationale: Kata kerja חקר menyatakan pemeriksaan atau penyelidikan yang saksama. 'Menyelidiki' mempertahankan kesan pengusutan mendalam.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Akhiran orang kedua maskulin jamak dinyatakan dengan 'kalian' agar bentuk jamaknya jelas dalam bahasa Indonesia.
- source_word: אִם
  choice: Atau
  rationale: Dalam pertanyaan retoris yang sejajar ini, אִם memperkenalkan pilihan kedua; 'atau' paling alami dalam bahasa Indonesia.
- source_word: כְּהָתֵל ... תְּהָתֵלּוּ בוֹ
  choice: apakah kalian akan mempermainkan Dia seperti mempermainkan
  rationale: התל dapat berarti mempermainkan, mengejek, atau menipu. 'Mempermainkan' cocok dengan konstruksi perbandingan yang diulang dan cukup luas untuk mempertahankan sebagian rentang maknanya.
- source_word: בֶּאֱנוֹשׁ
  choice: manusia
  rationale: אֱנוֹשׁ menunjuk pada manusia yang lemah atau fana. 'Manusia' terdengar alami, sedangkan nuansa kontras dengan Allah dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Rujukan kata ganti orang ketiga tunggal
  choice: Kata ganti 'Dia' merujuk kepada Allah.
  alternative: Seorang pemeriksa atau hakim yang tidak disebutkan secara khusus.
  rationale: Konteks langsung, khususnya Ayub 13:7–11, membicarakan orang-orang yang berkata tidak benar demi Allah lalu menghadapi pemeriksaan-Nya. Huruf kapital membantu memperjelas rujukan kontekstual tanpa menambahkan nama ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa sapaan berbentuk jamak. Pengulangan 'mempermainkan' dipertahankan karena mencerminkan pengulangan verba dalam bahasa Ibrani dan memperkuat pertanyaan retoris.
