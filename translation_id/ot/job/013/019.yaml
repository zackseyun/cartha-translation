  yaml_path: translation/ot/job/013/019.yaml
  text: Who is it that will contend with me? For then I would be silent and die[a].
translation:
  language: id
  text: Siapakah yang akan berbantah dengan aku? Sebab kalau demikian, aku akan diam dan mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab sekarang aku akan diam dan mati.” Kata keterangan Ibrani ini biasanya berarti “sekarang”, tetapi di sini banyak yang memahaminya dalam arti “kalau demikian” sesuai dengan alur argumentasi Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: Siapakah
  rationale: Gabungan kata tanya dan pronomina mandiri memberi penekanan retoris. Dalam bahasa Indonesia modern, “Siapakah” menyampaikan penekanan itu secara alami tanpa terjemahan kaku “siapakah dia”.
- source_word: יָרִיב
  choice: akan berbantah
  rationale: Verba ריב memiliki nuansa pertikaian atau sengketa, termasuk dalam ranah hukum. “Berbantah” mempertahankan nuansa adversarial itu tanpa mempersempitnya menjadi prosedur pengadilan tertentu.
- source_word: עִמָּדִי
  choice: dengan aku
  rationale: Preposisi ini secara langsung berarti “dengan aku”; sifat perlawanannya sudah dinyatakan oleh verba “berbantah”.
- source_word: כִּי
  choice: Sebab
  rationale: Di sini כִּי memperkenalkan alasan atau akibat yang mendukung tantangan Ayub dalam kalimat sebelumnya.
- source_word: עַתָּה
  choice: kalau demikian
  rationale: Secara leksikal עַתָּה biasanya berarti “sekarang”, tetapi dalam alur argumentasi ini banyak dipahami menunjuk pada hasil hipotetis, yakni “kalau demikian” atau “maka”. Ambiguitas leksikalnya dicatat dalam catatan kaki.
- source_word: אַחֲרִישׁ
  choice: aku akan diam
  rationale: Bentuk ini menyatakan bahwa Ayub akan berdiam diri sebagai akibat dari keadaan yang baru disebutkan. Ungkapan “akan diam” alami dan tetap dekat dengan sumber.
- source_word: וְאֶגְוָע
  choice: dan mati
  rationale: Verba גוע berarti mati atau mengembuskan napas terakhir. “Mati” mempertahankan daya ungkap yang lugas dan tajam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “aku” dipakai sesuai ujaran langsung Ayub. “Berbantah” dipilih untuk mempertahankan nuansa sengketa tanpa membuat bahasa terlalu teknis.
