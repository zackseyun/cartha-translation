base_translation:
  language: en
  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: id
  text: Panggillah, maka aku akan menjawab; atau aku akan berbicara[a], lalu jawablah aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga: “izinkan aku berbicara.”'
    reason: Bentuk imperfek אֲדַבֵּר dalam konteks ini dapat dipahami sebagai usulan atau permohonan bernuansa volitif.
lexical_decisions:
- source_word: וּקְרָא
  choice: Panggillah
  rationale: Imperatif Qal orang kedua tunggal dari קרא. Bentuk ini menyampaikan pilihan pertama dalam tantangan Ayub kepada Allah; waw pembuka tidak perlu diterjemahkan tersendiri agar kalimat Indonesia tetap wajar.
- source_word: וְאָנֹכִי אֶעֱנֶה
  choice: maka aku akan menjawab
  rationale: Pronomina mandiri אָנֹכִי menegaskan Ayub sebagai pihak yang menjawab. Kata 'maka' memperjelas hubungan respons tanpa mengubah struktur timbal balik.
- source_word: אוֹ
  choice: atau
  rationale: Partikel disjungtif yang memperkenalkan susunan percakapan yang kedua.
- source_word: אֲדַבֵּר
  choice: aku akan berbicara
  rationale: Imperfek Piel orang pertama tunggal dari דבר. Terjemahan ini mempertahankan bentuk pernyataan/proposal dalam bahasa Ibrani tanpa secara pasti mengubahnya menjadi permohonan izin.
- source_word: וַהֲשִׁיבֵנִי
  choice: lalu jawablah aku
  rationale: Imperatif Hifil orang kedua tunggal dengan sufiks orang pertama tunggal dari שוב. Dalam konstruksi ini maknanya adalah memberi jawaban atau menanggapi; 'lalu' menyatakan urutan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Nada tantangan Ayub kepada Allah
  choice: Dipertahankan sebagai tawaran dua susunan dialog yang langsung
  alternative: Diperhalus menjadi permohonan yang lebih tidak langsung
  rationale: Teks Ibrani memakai imperatif dan bentuk percakapan timbal balik yang tegas. Terjemahan tidak melunakkan ketegangan antara Ayub dan Allah.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk sapaan kepada Allah dipertahankan dengan huruf kecil sesuai teks yang tidak menyebut pronomina eksplisit untuk Allah pada ayat ini; imperatif '-lah' menjaga nada langsung sekaligus wajar.
