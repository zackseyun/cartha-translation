  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: id
  text: Petuah-petuah kalian adalah amsal dari abu[a]; pertahanan kalian adalah pertahanan dari tanah liat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hal-hal yang kalian kenang adalah amsal dari abu; punggung kalian adalah punggung dari tanah liat.” Bahasa Ibraninya sangat padat, dan bagian akhirnya sulit dipastikan. Terjemahan “pertahanan” mengikuti pemahaman kontekstual atas kata benda yang diulang itu.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: petuah-petuah kalian
  rationale: Kata ini biasanya berkaitan dengan ingatan atau sesuatu yang dikenang. Dalam konteks ini, kata tersebut menunjuk pada ucapan berhikmat yang diajukan para sahabat Ayub sebagai ajaran berwibawa. “Petuah-petuah” menyampaikan fungsi itu secara alami, sedangkan bentuk “kalian” mempertahankan orang kedua jamak.
- source_word: מִשְׁלֵי
  choice: amsal dari
  rationale: מָשָׁל dapat berarti amsal, pepatah, atau perbandingan. “Amsal” mempertahankan corak sastra hikmat dan bentuk nominal metafora Ibrani.
- source_word: אֵפֶר
  choice: abu
  rationale: Arti leksikal lazimnya adalah abu. Gambaran ini menyiratkan sesuatu yang rapuh dan tidak bernilai tanpa menggantinya dengan tafsiran eksplisit.
- source_word: לְגַבֵּי
  choice: adalah
  rationale: Ungkapan puitis dengan ל dan גַּב sangat padat dan sulit. Kopula “adalah” menyatakan hubungan predikatif secara wajar dalam bahasa Indonesia tanpa memperluas maknanya.
- source_word: חֹמֶר
  choice: tanah liat
  rationale: חֹמֶר dapat menunjuk pada tanah liat, lumpur, atau bahan semacam lepa. “Tanah liat” adalah padanan umum yang sesuai dengan gambaran kelemahan dan kerapuhan.
- source_word: גַּבֵּיכֶם
  choice: pertahanan kalian
  rationale: Walaupun גַּב secara harfiah dapat berarti punggung atau permukaan yang meninggi, dalam konteks ini kemungkinan besar dipakai secara metaforis untuk perlindungan atau posisi bertahan. “Pertahanan” menyampaikan makna kontekstual sambil mempertahankan pengulangan dalam kedua bagian frasa.
