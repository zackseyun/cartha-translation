lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah, sekarang
  rationale: Gabungan partikel ini menarik perhatian dengan penekanan dan kesegeraan. Ungkapan ini mempertahankan daya deiktis teks Ibrani dalam bahasa Indonesia modern.
- source_word: עָרַכְתִּי
  choice: aku telah menyiapkan
  rationale: Kata kerja ערך berarti menata atau menyusun. Dalam konteks hukum, 'menyiapkan' secara alami menyatakan bahwa Ayub telah menyusun argumennya.
- source_word: מִשְׁפָּט
  choice: perkaraku
  rationale: Dalam gambaran ruang sidang pada konteks ini, מִשְׁפָּט menunjuk pada perkara atau kasus hukum Ayub. Akhiran posesif ditambahkan secara wajar berdasarkan verba orang pertama dan konteks.
- source_word: יָדַעְתִּי כִּי
  choice: aku tahu bahwa
  rationale: Bentuk perfektif menyatakan keyakinan yang sudah mantap, sedangkan כִּי memperkenalkan isi dari apa yang diketahui Ayub.
- source_word: אֲנִי אֶצְדָּק
  choice: aku akan dinyatakan benar
  rationale: צדק dalam bentuk ini dan dalam konteks forensik berarti dinyatakan atau terbukti berada di pihak yang benar. 'Dinyatakan benar' mempertahankan nuansa putusan hukum tanpa memasukkan pengertian doktrinal yang lebih kemudian.
theological_decisions:
- issue: Makna forensik dari pernyataan Ayub
  choice: Ayub yakin bahwa ia akan dinyatakan benar dalam perkaranya.
  alternative: aku akan dibenarkan
  rationale: Kata צדק dapat diterjemahkan 'dibenarkan', tetapi konteks peradilan di sini terutama berbicara tentang putusan bahwa Ayub berada di pihak yang benar, bukan secara khusus tentang doktrin pembenaran dalam pengertian teologis yang berkembang kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' sesuai dengan tuturan langsung Ayub. Istilah 'perkara' dan 'dinyatakan benar' mempertahankan citra hukum yang menonjol dalam konteks.
