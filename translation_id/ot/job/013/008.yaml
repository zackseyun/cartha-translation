  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: id
  text: Apakah kalian akan memihak kepada-Nya?[a] Apakah kalian akan membela Allah?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengangkat muka-Nya”—ungkapan Ibrani yang berarti memihak atau menunjukkan pilih kasih.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Apakah kalian akan berperkara demi Allah?”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: Apakah kalian akan memihak kepada-Nya?
  rationale: Ungkapan נָשָׂא פָּנִים secara harfiah berarti 'mengangkat muka', tetapi dalam konteks hukum dan perdebatan bermakna menunjukkan keberpihakan atau pilih kasih. 'Memihak kepada-Nya' alami dalam bahasa Indonesia dan mempertahankan tuduhan bahwa para sahabat Ayub tidak bersikap netral.
- source_word: אִם
  choice: Apakah
  rationale: Di sini אִם memperkenalkan pertanyaan retoris kedua yang sejajar dengan pertanyaan pertama. Dalam bahasa Indonesia, pengulangan 'Apakah' menyampaikan daya interogatifnya secara lebih alami daripada terjemahan harfiah 'jika'; hubungan alternatifnya tetap tersirat dalam kesejajaran.
- source_word: לָאֵל
  choice: Allah
  rationale: אֵל dalam konteks ini menunjuk kepada Allah. Preposisi ל menyatakan pihak yang kepentingannya dibela dan tercakup secara alami dalam frasa 'membela perkara Allah'.
- source_word: תְּרִיבוּן
  choice: akan membela perkara
  rationale: רִיב memiliki nuansa berselisih, berperkara, atau mengajukan pembelaan dalam konteks forensik. 'Membela perkara' mempertahankan nuansa hukum dan advokasi tanpa membatasi tindakan itu pada prosedur pengadilan tertentu.
theological_decisions:
- issue: Apakah Ayub menuduh para sahabatnya membela Allah secara berat sebelah
  choice: Ayat diterjemahkan sebagai dua pertanyaan retoris yang menuduh mereka memihak kepada Allah dan membela perkara-Nya.
  alternative: Klausa pertama dapat diterjemahkan secara harfiah 'mengangkat muka-Nya', dan klausa kedua dapat diterjemahkan 'berperkara bagi Allah' atau 'berdebat demi Allah'.
  rationale: Konteks langsungnya adalah teguran Ayub kepada para sahabatnya karena mereka berbicara sebagai pembela Allah, tetapi tidak dengan benar. Terjemahan ini mempertahankan ketegangan etis bahwa pembelaan terhadap Allah pun dapat dilakukan secara berat sebelah, tanpa menyiratkan bahwa Allah sendiri membutuhkan pembelaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai karena verba Ibrani berbentuk orang kedua jamak. Kapitalisasi '-Nya' memperjelas bahwa pronomina itu merujuk kepada Allah. 'Membela perkara Allah' dipilih untuk mempertahankan nuansa forensik רִיב sekaligus terdengar wajar bagi pembaca umum.
