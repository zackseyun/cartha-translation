lexical_decisions:
- source_word: הֶעָלֶה
  choice: sehelai daun
  rationale: Kata עָלֶה berarti ‘daun’. Kata penggolong ‘sehelai’ menghasilkan ungkapan Indonesia yang alami dan menegaskan gambaran tentang sesuatu yang rapuh.
- source_word: נִדָּף
  choice: yang diterbangkan angin
  rationale: Bentuk ini menggambarkan sesuatu yang terdorong atau terembus ke sana kemari. Penyebutan angin secara wajar menyampaikan daya penggerak yang tersirat dalam konteks.
- source_word: תַּעֲרוֹץ
  choice: menggentarkan
  rationale: Kata kerja ערץ dapat berarti menyebabkan rasa takut atau gentar. ‘Menggentarkan’ mempertahankan daya ungkap yang kuat dan sesuai dengan ragam puisi yang bermartabat tanpa mempersempitnya menjadi kekerasan fisik.
- source_word: וְאֶת
  choice: dan
  rationale: Kata penghubung mempertautkan gambaran kedua yang sejajar; penanda objek אֶת tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: קַשׁ
  choice: jerami
  rationale: קַשׁ menunjuk pada jerami atau sisa batang tanaman. ‘Jerami’ lebih tepat secara leksikal daripada ‘sekam’ dan tetap menyampaikan gambaran bahan tumbuhan yang ringan serta tidak berdaya.
- source_word: יָבֵשׁ
  choice: kering
  rationale: Adjektiva ini secara langsung menyatakan keadaan kering, yang memperkuat gambaran kerapuhan jerami.
- source_word: תִּרְדֹּף
  choice: mengejar
  rationale: רדף lazim berarti mengejar atau memburu. ‘Mengejar’ alami dalam bahasa Indonesia dan mempertahankan kesejajaran tindakan agresif dalam kedua bagian pertanyaan.
