translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan paralel Ibrani serta dua gambaran tubuh dipertahankan. Bentuk 'dalam genggamanku' dipilih daripada 'di telapak tanganku' agar alami tanpa menghilangkan citra tangan; ketidakpastian idiom pertama dijelaskan dalam catatan kaki.
