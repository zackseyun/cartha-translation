translation:
  language: id
  text: Mengapa aku harus membawa dagingku di antara gigiku dan menaruh nyawaku di tanganku?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa aku harus membawa dagingku dengan gigiku?” Ungkapan Ibrani ini bersifat idiomatis dan sulit; maksudnya berkaitan dengan tindakan nekat yang membahayakan diri sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jiwaku.” Kata Ibrani nefesy dapat berarti “nyawa,” “jiwa,” atau “diri”; di sini “nyawa” paling sesuai dengan gambaran mempertaruhkan hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Mengapa ... harus
  rationale: Ungkapan ini memperkenalkan pertanyaan retoris tentang alasan atau tujuan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya tanyanya.
- source_word: אֶשָּׂא
  choice: membawa
  rationale: Kata נשׂא berarti mengangkat atau membawa. 'Membawa' mempertahankan gambaran konkret dalam ungkapan yang sulit ini.
- source_word: בְשָׂרִי
  choice: dagingku
  rationale: בשר secara harfiah berarti 'daging'. Pilihan ini mempertahankan citra Ibrani yang tajam, alih-alih melunakkannya menjadi 'tubuhku'.
- source_word: בְשִׁנָּי
  choice: di antara gigiku
  rationale: Preposisi ב dalam gambaran ini dapat berarti 'di/dalam' atau secara instrumental 'dengan'. 'Di antara gigiku' wajar dalam bahasa Indonesia dan menjaga citra sesuatu yang dibawa dengan gigi.
- source_word: וְנַפְשִׁי
  choice: dan nyawaku
  rationale: נפש dapat berarti jiwa, diri, atau nyawa. Dalam konteks mempertaruhkan kehidupan, 'nyawaku' paling jelas dan tetap padat.
- source_word: אָשִׂים
  choice: menaruh
  rationale: שׂים berarti menaruh, menempatkan, atau menetapkan. 'Menaruh' sesuai dengan gambaran konkret ayat ini.
- source_word: בְכַפִּי
  choice: dalam genggamanku
  rationale: כף secara harfiah menunjuk telapak tangan. Ungkapan 'dalam genggamanku' alami dalam bahasa Indonesia, mempertahankan citra tangan, dan menyampaikan bahwa nyawa sengaja dibawa ke dalam bahaya.
