base_translation:
  language: en
  yaml_path: translation/ot/job/013/003.yaml
  text: But I would speak to the Almighty[a], and I desire to argue with God.
translation:
  language: id
  text: Namun aku hendak berbicara kepada Yang Mahakuasa, dan aku ingin berperkara[a] dengan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bernalar dengan Allah” atau “mengajukan perkara di hadapan Allah.” Kata kerja Ibrani ini dapat berarti berdebat, membuktikan, atau mengajukan perkara dalam suasana hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: Namun
  rationale: Menandai pertentangan kuat dengan perkataan Ayub sebelumnya kepada sahabat-sahabatnya; bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: אֲנִי
  choice: aku
  rationale: Kata ganti yang dinyatakan secara eksplisit memberi penekanan pada tekad Ayub; ragam 'aku' sesuai dengan tuturan langsung dalam konteks puitis.
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: aku hendak berbicara kepada Yang Mahakuasa
  rationale: Imperfek menyatakan kehendak atau niat, sehingga 'hendak' lebih tepat daripada sekadar bentuk masa depan. Preposisi אֶל menunjukkan arah pembicaraan kepada Allah.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi secara semantis dan mempertahankan perbedaannya dari אֵל pada baris berikutnya.
- source_word: וְהוֹכֵחַ אֶל אֵל אֶחְפָּץ
  choice: dan aku ingin berperkara dengan Allah
  rationale: 'Bentuk Hifil dari יכח di sini memiliki nuansa forensik: berdebat, membuktikan, atau mengajukan perkara. ''Berperkara dengan'' menyampaikan nuansa hukum itu tanpa menambahkan objek seperti ''perkaraku'' yang tidak dinyatakan secara eksplisit.'
- source_word: אֵל
  choice: Allah
  rationale: Dalam paralelisme ini kata tersebut jelas menunjuk kepada Allah; pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan variasi gelar ilahi.
- source_word: אֶחְפָּץ
  choice: aku ingin
  rationale: Mengungkapkan kemauan atau hasrat Ayub dengan bahasa Indonesia yang wajar, tanpa nuansa kesenangan yang dapat ditimbulkan oleh 'bersukacita' atau 'berkenan'.
theological_decisions:
- issue: Penerjemahan gelar ilahi שַׁדַּי dan אֵל
  choice: Yang Mahakuasa ... Allah
  alternative: Shaddai ... Allah; Yang Mahakuasa ... Yang Perkasa
  rationale: Teks memakai dua sebutan ilahi yang berbeda dalam paralelisme. Keduanya diterjemahkan menurut maknanya tanpa diseragamkan, sehingga variasi sumber tetap terpelihara.
- issue: Sikap Ayub terhadap Allah dalam וְהוֹכֵחַ
  choice: berperkara dengan Allah
  alternative: bernalar dengan Allah; menyampaikan perkara di hadapan Allah; berbantah dengan Allah
  rationale: Pilihan ini mempertahankan ketegangan teologis dalam keinginan Ayub untuk menghadapi Allah secara forensik, tanpa melunakkannya menjadi percakapan biasa ataupun mengartikannya sebagai celaan terhadap Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. 'Aku' dipakai karena ayat ini merupakan tuturan langsung Ayub. Istilah 'berperkara' mempertahankan nuansa forensik sumber, sedangkan catatan kaki menjelaskan cakupan maknanya.
