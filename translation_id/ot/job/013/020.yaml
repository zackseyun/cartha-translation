  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapitalisasi pada “Kau-” dan “-Mu” menandai bahwa Ayub sedang menyapa Allah. Tanda titik dua dipertahankan karena dua hal yang dimaksud dijabarkan dalam ayat-ayat berikutnya.
