  text: 'Only do not do two things to me[a]; then I will not hide myself from your face:'
translation:
  language: id
  text: 'Hanya, janganlah Engkau melakukan dua hal terhadapku; maka aku tidak akan menyembunyikan diri dari hadapan-Mu[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari wajah-Mu”; dapat juga berarti “dari kehadiran-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: Kata ini membatasi permohonan Ayub pada syarat tertentu; “Hanya” menyampaikan daya restriktifnya secara alami.
- source_word: שְׁתַּיִם
  choice: dua hal
  rationale: Teks Ibrani hanya memakai bilangan feminin “dua” tanpa nomina; “hal” ditambahkan agar wajar dalam bahasa Indonesia dan menunjuk pada dua tindakan yang dijabarkan sesudahnya.
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: jangan Kaulakukan terhadapku
  rationale: Ungkapan עשה dengan עִם dalam konteks ini berarti melakukan atau memperlakukan sesuatu terhadap Ayub. Bentuk ini jelas sekaligus mempertahankan urutan permohonan Ibrani.
- source_word: אָז
  choice: maka
  rationale: Kata ini menandai akibat jika permohonan tersebut dikabulkan; “maka” menyatakan hubungan syarat-akibat dengan ringkas.
- source_word: מִפָּנֶיךָ
  choice: dari hadapan-Mu
  rationale: Ungkapan harfiahnya berkaitan dengan “wajah” dan secara idiomatis berarti hadapan atau kehadiran. “Dari hadapan-Mu” mempertahankan citra relasional Ibrani dan tetap alami.
- source_word: לֹא אֶסָּתֵר
  choice: aku tidak akan bersembunyi
  rationale: 'Bentuk Nifal di sini paling wajar dipahami secara refleksif atau intransitif: Ayub tidak akan menyembunyikan diri atau mundur dari hadapan Allah.'
