  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: id
  text: Hal itu pun akan menjadi keselamatanku[a], sebab orang fasik[b] tidak dapat datang ke hadapan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Keselamatan” juga dapat diterjemahkan “kelepasan” atau “pembenaran.” Kata Ibrani yang diterjemahkan “hal itu” berbentuk maskulin dan juga dapat dipahami sebagai “Dia,” bergantung pada acuannya.
    reason: lexical_and_pronominal_alternative
  - marker: b
    text: “Orang fasik” juga dapat diterjemahkan “orang yang tidak saleh” atau “orang durhaka.” Kata Ibrani ini menunjuk kepada orang yang tidak hormat kepada Allah, bukan sekadar orang munafik dalam arti tidak tulus.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: pun
  rationale: Menandai tambahan sekaligus penegasan secara alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: hal itu
  rationale: Pronomina ini secara bentuk dapat berarti “dia,” tetapi dalam konteks paling wajar menunjuk pada keadaan atau tindakan yang baru disebutkan; “hal itu” mempertahankan fungsi demonstratifnya.
- source_word: לִי לִישׁוּעָה
  choice: menjadi keselamatanku
  rationale: Mengungkapkan makna manfaat atau kepemilikan secara idiomatis, sambil mempertahankan keluasan makna יְשׁוּעָה.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan yang mendasari pernyataan sebelumnya.
- source_word: חָנֵף
  choice: orang fasik
  rationale: Menunjuk kepada orang yang tidak saleh atau tidak hormat kepada Allah, bukan sekadar orang yang berpura-pura atau tidak tulus.
- source_word: לְפָנָיו
  choice: ke hadapan-Nya
  rationale: Ungkapan idiomatis untuk datang atau tampil di hadirat seseorang; konteks mendukung Allah sebagai acuannya.
- source_word: יָבוֹא
  choice: dapat datang
  rationale: Dalam pernyataan umum ini, bentuk tersebut menyiratkan kemungkinan atau kelayakan untuk menghadap, bukan hanya tindakan datang pada masa depan.
theological_decisions:
- issue: Acuan pronomina dalam לְפָנָיו
  choice: Allah, dinyatakan melalui “-Nya”
  alternative: seseorang yang di hadapannya Ayub tampil
  rationale: Konteks pembelaan Ayub dan pernyataan tentang orang fasik yang tidak dapat datang ke hadapan-Nya paling alami merujuk kepada Allah, tanpa menambahkan nama Allah ke dalam teks utama.
- issue: Makna יְשׁוּעָה dalam keyakinan Ayub
  choice: keselamatan
  alternative: kelepasan atau pembenaran
  rationale: “Keselamatan” mempertahankan keluasan dan bobot istilah Ibrani, sedangkan catatan kaki mengakui nuansa kelepasan serta pembenaran dalam konteks perkara Ayub.
- issue: Acuan הוּא
  choice: hal itu, yakni keadaan atau tindakan yang disebut sebelumnya
  alternative: Dia, dengan Allah sebagai subjek
  rationale: Bentuk Ibrani memungkinkan acuan maskulin “Dia,” tetapi penggunaannya dapat menunjuk kembali kepada gagasan sebelumnya. Teks utama memilih bacaan kontekstual yang paling wajar dan catatan kaki mempertahankan alternatif formalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pun” menjaga daya penghubung dan penekanan גַּם; “ke hadapan-Nya” mempertahankan ragam resmi yang alami. Huruf kapital pada “-Nya” menandai acuan ilahi yang didukung konteks.
