  text: הֵ֣ן יִ֭קְטְלֵ/נִי לא אֲיַחֵ֑ל אַךְ דְּ֝רָכַ֗/י אֶל פָּנָ֥י/ו אוֹכִֽיחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/015.yaml
  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: id
  text: Sekalipun Dia membunuh aku[a], aku tidak akan berharap; namun aku akan membela jalan-jalanku di hadapan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terjemahan tradisional berbunyi, “Sekalipun Dia membunuh aku, aku akan tetap berharap kepada-Nya.” Terjemahan ini mencerminkan bacaan alternatif teks Ibrani.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Sekalipun
  rationale: Dalam konteks ini partikel tersebut memperkenalkan kemungkinan yang diakui secara konsesif; “sekalipun” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: יִקְטְלֵנִי
  choice: Dia membunuh aku
  rationale: Kata kerja קטל berarti membunuh. Susunan ini mempertahankan nada khidmat tanpa memakai kata Indonesia yang terlalu arkais.
- source_word: לֹא אֲיַחֵל
  choice: aku tidak akan berharap
  rationale: Mengikuti teks konsonantal Masoret, לֹא adalah negasi. יחל dapat berarti menanti atau berharap; “berharap” mempertahankan nuansa pengharapan dan ketegangan pernyataan Ayub.
- source_word: אַךְ
  choice: namun
  rationale: Menandai peralihan adversatif dari kemungkinan kematian kepada tekad Ayub untuk mengemukakan pembelaannya.
- source_word: דְּרָכַי
  choice: jalan-jalanku
  rationale: Mempertahankan metafora harfiah Ibrani yang mengacu pada perilaku atau perjalanan hidup Ayub.
- source_word: אֶל־פָּנָיו
  choice: di hadapan-Nya
  rationale: Ungkapan idiomatis Indonesia untuk arti harfiah “ke wajah-Nya,” yaitu secara langsung dalam kehadiran Allah.
- source_word: אוֹכִיחַ
  choice: aku akan membela
  rationale: Dalam konteks hukum dan perdebatan kitab Ayub, bentuk hiphil יכח mengacu pada pengajuan atau pembelaan perkara. “Membela” terasa lebih alami ketika objeknya adalah jalan hidup Ayub.
theological_decisions:
- issue: Apakah mengikuti teks Masoret dengan negasi atau bacaan tradisional “namun aku akan berharap kepada-Nya”
  choice: 'Mengikuti teks Masoret sebagaimana tertulis: “aku tidak akan berharap”'
  alternative: “Namun aku akan berharap kepada-Nya”
  rationale: Sumber Ibrani yang diberikan memuat לֹא (“tidak”), bukan לוֹ (“kepada-Nya”). Bacaan utama karena itu mempertahankan negasi, sedangkan bacaan tradisional yang penting secara tekstual dan teologis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina untuk Allah mengikuti kelaziman penerbitan Alkitab Indonesia. Metafora “jalan-jalanku” dipertahankan, sementara verba hukum diterjemahkan secara idiomatis sebagai “membela”.
