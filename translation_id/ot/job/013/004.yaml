  yaml_path: translation/ot/job/013/004.yaml
  text: But you are plasterers of lies[b][a]; all of you are worthless physicians.
translation:
  language: id
  text: Namun, kalian adalah pembuat dusta[a]; kalian semua adalah tabib yang tidak berguna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang melumuri dengan dusta” atau “pereka kebohongan.” Kata Ibrani ini dapat menggambarkan tindakan mengoles atau melapisi sesuatu, sehingga mungkin menyiratkan bahwa mereka menutupi kenyataan dengan kebohongan.
    reason: lexical_alternative
  - marker: b
    text: Atau “tabib yang tidak bernilai.” Frasa Ibrani ini menggambarkan mereka sebagai penyembuh yang tidak berguna. Arti “tabib berhala” juga mungkin secara leksikal, tetapi kurang cocok dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Penanda pertentangan ini memperkenalkan sanggahan tajam terhadap perkataan sahabat-sahabat Ayub; “Namun” alami dalam bahasa Indonesia baku dan mempertahankan daya retorisnya.
- source_word: אַתֶּם
  choice: kalian
  rationale: Pronomina orang kedua jamak ini ditujukan langsung kepada sahabat-sahabat Ayub. “Kalian” menyatakan kejamakan yang tersurat dalam bahasa Ibrani.
- source_word: טֹפְלֵי
  choice: pengoles
  rationale: Partisip dari טפל menggambarkan tindakan mengoles atau melapisi sesuatu. “Pengoles” mempertahankan citra konkretnya tanpa langsung mereduksinya menjadi gagasan yang lebih interpretatif seperti “pereka” atau “pemalsu”.
- source_word: שָׁקֶר
  choice: kebohongan
  rationale: Nomina tunggal Ibrani dapat dipahami secara kolektif sebagai bahan atau isi yang mereka oleskan. “Kebohongan” cocok dengan metafora tersebut dan mudah dipahami pembaca modern.
- source_word: רֹפְאֵי
  choice: tabib
  rationale: Bentuk ini menunjuk kepada orang-orang yang menyembuhkan. “Tabib” mempertahankan metafora pengobatan dan memberi nuansa retoris yang sesuai dengan kitab Ayub.
- source_word: אֱלִל
  choice: yang tidak berguna
  rationale: Dalam konteks ini אֱלִל paling wajar menyatakan ketiadaan nilai atau kegunaan. Frasa ini menjelaskan bahwa mereka gagal sebagai penyembuh, tanpa memasukkan arti “berhala” yang kurang mungkin di sini.
- source_word: כֻּלְּכֶם
  choice: kalian semua
  rationale: Ungkapan ini mencakup seluruh lawan bicara Ayub dan mempertahankan penegasan penutup dalam bahasa Ibrani.
theological_decisions:
- issue: Makna אֱלִל dalam frasa רֹפְאֵי אֱלִל
  choice: tabib yang tidak berguna
  alternative: tabib berhala
  rationale: Walaupun אֱלִל dapat berarti “berhala” dalam konteks lain, di sini makna “ketiadaan nilai/kegunaan” menghasilkan kolokasi yang lebih wajar dan sesuai dengan kecaman Ayub terhadap nasihat mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan tajam. “Kalian” dipakai untuk mempertahankan bentuk jamak yang eksplisit; “tabib” mempertahankan citra pengobatan dan nuansa sastra, sedangkan susunan klausa tetap dekat dengan retorika Ibrani.
