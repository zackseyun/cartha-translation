  text: הֶן כֹּ֭ל רָאֲתָ֣ה עֵינִ֑/י שָֽׁמְעָ֥ה אָ֝זְנִ֗/י וַ/תָּ֥בֶן לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/001.yaml
  text: Look[a], my eye has seen all this; my ear has heard and understood it.
translation:
  language: id
  text: Lihat, mataku telah melihat semuanya ini; telingaku telah mendengar dan memahaminya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan mencernanya” atau “dan mempertimbangkannya.” Secara harfiah, bahasa Ibraninya melanjutkan dengan “dan memahami bagi dirinya sendiri,” suatu ungkapan yang menyatakan pemahaman atas apa yang didengar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Lihat
  rationale: Partikel ini mengundang perhatian sekaligus menegaskan pernyataan Ayub. “Lihat” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya deiktisnya.
- source_word: כֹּל
  choice: semuanya ini
  rationale: Secara harfiah berarti “semua”; dalam konteks ini, “semuanya ini” menyatakan secara ringkas segala hal yang baru dibicarakan.
- source_word: רָאֲתָה עֵינִי
  choice: mataku telah melihat
  rationale: Subjek tunggal “mataku” dipertahankan demi gambaran dan kesejajaran dengan “telingaku”; “telah melihat” menyampaikan pengalaman yang sudah diperoleh dan masih relevan.
- source_word: שָׁמְעָה אָזְנִי
  choice: telingaku telah mendengar
  rationale: Bentuk dengan anggota tubuh sebagai subjek dipertahankan agar gaya dan paralelisme Ibrani tetap terasa secara wajar.
- source_word: וַתָּבֶן לָהּ
  choice: dan memahaminya
  rationale: Kata kerja dari בין berarti memahami atau membedakan. Bentuk feminin paling wajar meneruskan subjek feminin terdekat, “telingaku”; frasa pronominal לָהּ bersifat idiomatis dan menunjukkan bahwa apa yang didengar juga dipahami.
