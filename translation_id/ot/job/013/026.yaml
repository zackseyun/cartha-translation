base_translation:
  language: en
  yaml_path: translation/ot/job/013/026.yaml
  text: For you write bitter things against me and make me inherit the iniquities of my youth[a][b].
translation:
  language: id
  text: Sebab Engkau menuliskan hal-hal yang pahit terhadapku[a] dan membuatku mewarisi kesalahan-kesalahan masa mudaku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Engkau menetapkan hal-hal yang pahit terhadapku”; secara harfiah bahasa Ibrani berbunyi “Engkau menuliskan hal-hal yang pahit terhadapku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “membuatku menanggung rasa bersalah atas kesalahan-kesalahan masa mudaku” atau “hukuman atas kesalahan-kesalahan masa mudaku.” Kata Ibrani ini dapat berarti perbuatan salah, rasa bersalah, atau akibatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan penjelasan Ayub sebelumnya; padanan ini mempertahankan fungsi argumentatif partikel Ibrani.
- source_word: תִכְתֹּב עָלַי
  choice: Engkau menuliskan ... terhadap aku
  rationale: Mempertahankan metafora harfiah 'menulis' dan nuansa adversatif עַל tanpa mempersempitnya menjadi 'menetapkan' atau 'mendakwa'.
- source_word: מְרֹרוֹת
  choice: hal-hal yang pahit
  rationale: Bentuk jamak ini menunjuk pada berbagai hal yang pahit; pilihan tersebut membiarkan terbuka apakah yang dimaksud ialah dakwaan, ketetapan, atau pengalaman pahit.
- source_word: וְתוֹרִישֵׁנִי
  choice: dan membuat aku mewarisi
  rationale: Mempertahankan bentuk kausatif verba ירשׁ serta gambaran tentang menerima sesuatu sebagai warisan.
- source_word: עֲוֺנוֹת
  choice: kesalahan-kesalahan
  rationale: Kata עָוֹן dapat merujuk pada perbuatan salah, kesalahan atau kesalahan yang ditanggung, dan akibatnya. 'Kesalahan-kesalahan' cukup luas untuk menjaga rentang makna itu.
- source_word: נְעוּרָי
  choice: masa mudaku
  rationale: Padanan langsung dan alami bagi bentuk konstruksi dengan akhiran orang pertama tunggal.
theological_decisions:
- issue: Makna עֲוֺנוֹת dalam konteks
  choice: kesalahan-kesalahan masa muda Ayub, dengan kemungkinan tersirat bahwa ia menanggung kesalahan atau akibatnya
  alternative: dosa-dosa masa mudaku; hukuman atas kesalahan-kesalahan masa mudaku
  rationale: Bahasa Ibrani tidak mengharuskan pembaca memilih hanya antara perbuatan salah, keadaan bersalah, atau akibat penghukuman. Teks utama mempertahankan keluasan makna tersebut, sedangkan catatan kaki menyebut alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi kata ganti untuk Allah mengikuti kebiasaan umum teks Alkitab Indonesia. Ungkapan 'membuat aku mewarisi' sengaja dipertahankan sebagai metafora sumber meskipun agak tidak lazim.
