base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: id
  text: Jauhkanlah tangan-Mu dariku[a], dan janganlah kengerian-Mu membuat aku gentar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “Jauhkanlah tangan-Mu dari atas diriku.” Atau “Singkirkanlah tangan-Mu dariku.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “janganlah teror-Mu menggentarkan aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְּךָ
  choice: tangan-Mu
  rationale: כַּף secara harfiah menunjuk pada telapak atau tangan. Dalam gambaran tentang tekanan atau tindakan Allah terhadap Ayub, “tangan” merupakan padanan Indonesia yang alami dan mempertahankan metafora konkret teks.
- source_word: מֵעָלַי הַרְחַק
  choice: Jauhkanlah ... dari atasku
  rationale: Bentuk Hifil imperatif הַרְחַק berarti membuat jauh atau menyingkirkan, sedangkan מֵעָלַי secara harfiah berarti “dari atasku.” Susunan ini mempertahankan gambaran tangan yang menekan atau membebani Ayub.
- source_word: אֵמָתְךָ
  choice: kedahsyatan-Mu
  rationale: אֵימָה dapat berarti kedahsyatan, kengerian, atau teror. “Kedahsyatan-Mu” menyatakan daya menggentarkan yang berasal dari kehadiran atau tindakan Allah tanpa mereduksinya menjadi perasaan subjektif Ayub saja.
- source_word: אַל תְּבַעֲתַנִּי
  choice: jangan biarkan ... menggentarkan aku
  rationale: אַל memberi larangan, dan בעת berarti membuat gentar, menakutkan, atau mengejutkan. Konstruksi ini mempertahankan אֵמָתְךָ sebagai subjek gramatikal dari tindakan menggentarkan.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah (“tangan-Mu”)
  choice: Mempertahankan ungkapan konkret “tangan-Mu.”
  alternative: kuasa-Mu; pukulan-Mu
  rationale: Teks Ibrani memakai citra anggota tubuh dan tidak menentukan apakah yang terutama dimaksud ialah kuasa, hukuman, penderitaan, atau tekanan Allah. Terjemahan literal mempertahankan daya puitis dan ketegangan maknanya.
- issue: Makna אֵמָתְךָ sebagai kedahsyatan yang terkait dengan Allah
  choice: kedahsyatan-Mu
  alternative: kengerian-Mu; rasa takut kepada-Mu
  rationale: Akhiran orang kedua mengaitkan kedahsyatan itu langsung dengan Allah. Pilihan ini tidak mengubahnya menjadi sekadar rasa takut subjektif dalam diri Ayub, namun juga tidak menjelaskan secara berlebihan sumber atau bentuk kedahsyatan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan langsung. Partikel hormat “-Mu” dipertahankan untuk sapaan kepada Allah. “Dari atasku” sengaja mempertahankan citra spasial Ibrani, sementara catatan kaki menyediakan ungkapan yang lebih idiomatis.
