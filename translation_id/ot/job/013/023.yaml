  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: id
  text: Berapa banyak kesalahan dan dosa yang ada padaku?[a] Beritahukanlah kepadaku pelanggaranku[b] dan dosaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Betapa besar kesalahan dan dosaku?” Kata tanya Ibrani ini dapat menanyakan kadar maupun jumlah, tetapi teks utama mempertahankan pengertian jumlah yang lebih langsung.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “pelanggaran” juga dapat berarti “pemberontakan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: Berapa banyak ... yang ada padaku
  rationale: Ungkapan tanya ini menanyakan jumlah atau kadar sesuatu yang dimiliki Job. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan tekanan kuantitatif teks Ibrani.
- source_word: עֲוֺנוֹת
  choice: kesalahan
  rationale: Kata עָוֹן menunjuk pada kesalahan moral dan dapat pula mencakup akibat berupa kesalahan atau kebersalahan. 'Kesalahan' mempertahankan bobot moralnya sekaligus membedakannya dari kata berikutnya, 'dosa'.
- source_word: וְחַטָּאוֹת
  choice: dan dosa
  rationale: Kata חַטָּאת secara langsung berarti dosa. Dalam konstruksi 'berapa banyak ... yang ada padaku', bentuk Indonesia tidak perlu mengulang penanda jamak.
- source_word: פִּשְׁעִי
  choice: pelanggaranku
  rationale: Kata פֶּשַׁע menyatakan pelanggaran yang dapat mengandung unsur kesengajaan atau pemberontakan. 'Pelanggaran' mempertahankan makna dasarnya tanpa mempersempitnya secara berlebihan.
- source_word: וְחַטָּאתִי
  choice: dan dosaku
  rationale: Bentuk tunggal dengan akhiran orang pertama diterjemahkan langsung sebagai 'dosaku', sejalan dengan pasangan leksikal dalam bahasa Ibrani.
- source_word: הֹדִיעֵנִי
  choice: Beritahukanlah kepadaku
  rationale: Bentuk kausatif dari ידע berarti membuat seseorang mengetahui atau memberitahukan. Pilihan ini alami dan mempertahankan daya perintah atau permohonan dalam konteks.
