base_translation:
  language: en
  yaml_path: translation/ot/job/013/024.yaml
  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: id
  text: Mengapa Engkau menyembunyikan wajah-Mu dan menganggap aku sebagai musuh-Mu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menganggap aku musuh bagi-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Mengapa
  rationale: Kata tanya ini secara langsung menanyakan alasan; “Mengapa” merupakan padanan Indonesia yang alami.
- source_word: פָנֶיךָ
  choice: wajah-Mu
  rationale: Secara harfiah berarti “wajah-Mu.” Ungkapan konkret ini tetap dipertahankan karena jelas dalam bahasa Indonesia dan membawa nuansa kehadiran atau perkenanan Allah.
- source_word: תַסְתִּיר
  choice: menyembunyikan
  rationale: Bentuk Hifil dari סתר berarti “menyembunyikan” atau “merahasiakan”; pilihan ini mempertahankan gambaran relasional tentang Allah yang menyembunyikan wajah-Nya.
- source_word: וְתַחְשְׁבֵנִי
  choice: dan menganggap aku
  rationale: חשב dapat berarti memikirkan, memperhitungkan, atau menganggap. Dalam konstruksi predikatif ini, “menganggap aku” paling alami dalam bahasa Indonesia.
- source_word: לְאוֹיֵב
  choice: sebagai musuh
  rationale: Preposisi ל menandai pelengkap predikatif sesudah “menganggap”; “sebagai musuh” menyampaikan fungsi tersebut dengan jelas.
- source_word: לָךְ
  choice: -Mu
  rationale: 'Walaupun secara bentuk berarti “bagi/kepada-Mu,” dalam konstruksi ini relasinya paling alami dinyatakan sebagai posesif: “musuh-Mu.”'
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah dalam ungkapan “menyembunyikan wajah-Mu”
  choice: Mempertahankan ungkapan konkret “menyembunyikan wajah-Mu” dalam teks utama.
  alternative: menarik kehadiran-Mu; berpaling dariku
  rationale: Bahasa Ibrani memakai ungkapan “wajah” yang lazim menggambarkan kehadiran atau perkenanan Allah. Mempertahankannya menjaga kekuatan puitis dan teologis tanpa menafsirkan metafora secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina serta akhiran posesif yang merujuk kepada Allah mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
