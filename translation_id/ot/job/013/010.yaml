source:
  edition: WLC
  text: הוֹכֵ֣חַ יוֹכִ֣יחַ אֶתְ/כֶ֑ם אִם בַּ֝/סֵּ֗תֶר פָּנִ֥ים תִּשָּׂאֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/010.yaml
  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: id
  text: Ia pasti akan menegur kalian jika kalian diam-diam memihak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengangkat muka,” sebuah ungkapan Ibrani yang berarti memihak atau menunjukkan pilih kasih.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: pasti akan menegur
  rationale: Gabungan infinitif absolut dan verba finit dari יכח memberi penegasan kuat. Kata 'pasti' mempertahankan intensitas itu, sedangkan 'menegur' sesuai dengan ancaman kecaman ilahi dalam konteks.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Bentuk objek orang kedua maskulin jamak menunjuk kepada para sahabat Ayub secara kolektif; 'kalian' menyatakan jumlah jamak dengan jelas dalam bahasa Indonesia modern.
- source_word: אִם
  choice: jika
  rationale: Kata ini memperkenalkan syarat dalam peringatan Ayub. 'Jika' mempertahankan sifat kondisional tanpa menganggap tindakan tersebut pasti terjadi.
- source_word: בַּסֵּתֶר
  choice: diam-diam
  rationale: Bentuk ini menyatakan tindakan yang tersembunyi. 'Diam-diam' alami dalam bahasa Indonesia dan mempertahankan nuansa tindakan yang dilakukan secara terselubung.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: kalian ... memihak
  rationale: Ungkapan harfiahnya 'mengangkat muka/wajah' merupakan idiom Ibrani untuk menunjukkan keberpihakan atau perlakuan istimewa. 'Memihak' ringkas, wajar, dan mempertahankan daya etis serta yudisialnya.
theological_decisions:
- issue: Pemaknaan idiom נשׂא פנים
  choice: memihak
  alternative: menunjukkan pilih kasih; menerima muka
  rationale: Dalam konteks ini idiom tersebut menggambarkan keberpihakan yang tidak adil, yakni para sahabat membela pihak tertentu secara bias. 'Memihak' menyampaikan tuduhan itu secara alami tanpa menambahkan tafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina 'Ia' mempertahankan rujukan kontekstual kepada Allah, sedangkan 'kalian' memperjelas bahwa teguran ditujukan kepada para sahabat Ayub sebagai kelompok.
