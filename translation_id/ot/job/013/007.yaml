  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: id
  text: Apakah kalian akan berbicara tidak adil untuk Allah dan berkata penuh tipu daya untuk-Nya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada Allah” atau “atas nama Allah”; demikian juga “kepada-Nya” atau “atas nama-Nya” dalam klausa kedua. Preposisi Ibrani yang dipakai dapat dipahami dengan lebih dari satu cara, meskipun konteks lebih mendukung arti berbicara untuk membela Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: demi Allah
  rationale: Preposisi ל dapat menyatakan arah, kepentingan, atau perwakilan. Dalam konteks teguran Ayub kepada sahabat-sahabatnya, “demi Allah” secara alami menyampaikan bahwa mereka berbicara untuk membela Allah, tanpa memperluas teks menjadi parafrasa “atas nama Allah”.
- source_word: תְּדַבְּרוּ
  choice: akankah kalian berbicara / berkata
  rationale: Bentuk imperfek dalam pertanyaan retoris diterjemahkan dengan “akankah,” yang mempertahankan nada tantangan dan teguran. Pronomina tersiratnya berbentuk jamak, sehingga dipakai “kalian.” Variasi “berbicara” dan “berkata” menghasilkan bahasa Indonesia yang alami tanpa mengubah kesejajaran kedua klausa.
- source_word: עַוְלָה
  choice: tidak adil
  rationale: Kata ini menunjuk pada ketidakadilan, kesalahan moral, atau kelaliman. Ungkapan verbal “berbicara tidak adil” lebih alami dalam bahasa Indonesia daripada “mengucapkan ketidakadilan” dan tetap mempertahankan bobot etisnya.
- source_word: וְלוֹ
  choice: demi Dia
  rationale: Pronomina ini merujuk kembali kepada Allah. “Demi Dia” mempertahankan kesejajaran dengan “demi Allah” serta makna kontekstual berbicara untuk kepentingan atau pembelaan-Nya.
- source_word: רְמִיָּה
  choice: penuh tipu daya
  rationale: Nomina ini berarti tipu daya, kecurangan, atau kelicikan. “Berkata penuh tipu daya” mempertahankan cakupan makna yang lebih luas daripada “berbohong” dan terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah Ayub menuduh sahabat-sahabatnya berbicara untuk membela Allah atau berbicara kepada Allah
  choice: Ayub menegur mereka karena berbicara secara tidak adil demi membela Allah
  alternative: Ayub menegur mereka karena menyampaikan ketidakadilan kepada Allah
  rationale: Konteks dekat, khususnya Ayub 13:4 dan 13:8, menggambarkan para sahabat sebagai pihak yang memihak dan membela Allah. Karena itu, “demi” paling sesuai dengan konteks, sementara catatan kaki mempertahankan kemungkinan gramatikal lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak yang tersirat dalam verba Ibrani. Huruf kapital pada “Dia” mengikuti rujukan kepada Allah.
