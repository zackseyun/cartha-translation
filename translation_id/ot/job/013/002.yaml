lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: Apa yang kamu ketahui
  rationale: Ungkapan dengan prefiks כ dan nomina דַּעַת bersufiks orang kedua jamak membandingkan pengetahuan Ayub dengan pengetahuan para sahabatnya. Terjemahan ini alami dalam bahasa Indonesia dan membentuk kesejajaran dengan 'aku juga mengetahuinya'.
- source_word: יָדַעְתִּי
  choice: aku ... mengetahuinya
  rationale: 'Bentuk perfek orang pertama tunggal berfungsi secara statif dalam pernyataan perbandingan ini: Ayub memiliki pengetahuan yang sama. Bentuk kini bahasa Indonesia dipahami secara alami tanpa penanda waktu khusus.'
- source_word: גַם אֲנִי
  choice: aku juga
  rationale: Gabungan ini menegaskan bahwa Ayub pun memiliki pengetahuan tersebut. 'Aku juga' jelas, alami, dan mempertahankan penekanannya.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: aku tidak lebih rendah daripada kamu
  rationale: Partisipel נֹפֵל dengan מן menyatakan kedudukan yang lebih rendah atau kekurangan dalam suatu perbandingan. Dalam konteks ini Ayub menyangkal bahwa dirinya kalah dari para sahabatnya, terutama dalam pengetahuan; terjemahan ini mempertahankan ungkapan komparatif tanpa mempersempitnya hanya pada kecerdasan.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri ini memberi penekanan pada diri Ayub. Bahasa Indonesia menyampaikannya secara memadai melalui penyebutan eksplisit 'aku' dalam klausa kedua.
