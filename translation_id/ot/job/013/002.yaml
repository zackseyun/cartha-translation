  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: id
  text: Apa yang kalian ketahui, aku juga mengetahuinya; aku tidak lebih rendah daripada kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku tidak kurang daripada kalian.”
