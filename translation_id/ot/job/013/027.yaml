  text: You put my feet in the stocks[a], and you watch all my paths; you mark out the soles of my feet.
translation:
  language: id
  text: Engkau memasung kakiku dan mengawasi segala jalanku; Engkau menandai telapak kakiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau menggoreskan garis di sekeliling telapak kakiku.” Secara harfiah, frasa itu menyebut “akar-akar kakiku”; ungkapan ini dapat menunjuk pada bagian dasar atau telapak kaki. Kata kerjanya dapat berarti menandai, menggoreskan, atau menetapkan batas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָשֵׂם בַּסַּד רַגְלַי
  choice: Engkau memasung kakiku
  rationale: Ungkapan ini secara harfiah berarti menaruh kaki dalam alat pengekang. Kata kerja “memasung” menyampaikan tindakan dan citra penahanan itu secara alami dalam bahasa Indonesia.
- source_word: וְתִשְׁמוֹר
  choice: mengawasi
  rationale: Dalam konteks ini שׁמר menyatakan pengamatan ketat atas gerak-gerik Ayub, bukan perlindungan.
- source_word: כָּל אָרְחוֹתָי
  choice: segala jalanku
  rationale: “Jalan” mempertahankan gambaran konkret tentang lintasan sekaligus kemungkinan makna yang lebih luas mengenai perilaku atau perjalanan hidup.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: di sekeliling telapak kakiku
  rationale: שָׁרְשֵׁי secara harfiah berarti “akar-akar,” tetapi dalam ungkapan ini menunjuk pada bagian dasar kaki. Frasa “di sekeliling” sesuai dengan kemungkinan bahwa tindakan tersebut membatasi ruang gerak.
- source_word: תִּתְחַקֶּה
  choice: Engkau menggoreskan batas
  rationale: Bentuk kata dari חקה dapat menggambarkan penggoresan, penandaan, atau penetapan garis batas. Pilihan ini mempertahankan citra pembatasan tanpa menghilangkan unsur penandaan.
