  text: Be silent before me[a], and let me speak; then let come upon me what may.
translation:
  language: id
  text: Diamlah di hadapanku, dan biarkan aku berbicara; biarlah apa pun menimpa aku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: Diamlah
  rationale: Imperatif jamak bentuk Hifil dari חרשׁ memerintahkan para lawan bicara Ayub untuk berhenti berbicara. “Diamlah” ringkas, tegas, dan alami dalam bahasa Indonesia.
- source_word: מִמֶּנִּי
  choice: terhadap aku
  rationale: Secara harfiah berarti “dari aku.” Dalam konstruksi ini frasa tersebut menunjuk pada sikap diam dalam relasi dengan Ayub. “Terhadap aku” mempertahankan kejanggalan semantis yang asli tanpa menjadikannya tidak dapat dipahami.
- source_word: וַאֲדַבְּרָה
  choice: dan biarkan aku berbicara
  rationale: Bentuk kohortatif orang pertama tunggal menyatakan kehendak atau desakan Ayub untuk berbicara. “Biarkan aku berbicara” menyampaikan nuansa itu secara wajar.
- source_word: אָנִי
  choice: aku
  rationale: Pronomina mandiri menegaskan bahwa Ayublah yang hendak berbicara. Dalam bahasa Indonesia, penegasan tersebut cukup tercermin melalui penyebutan eksplisit “aku” setelah “biarkan.”
- source_word: וְיַעֲבֹר
  choice: biarlah ... menimpa
  rationale: Verba עבר pada dasarnya berarti “lewat,” tetapi bersama עָלַי dapat menggambarkan sesuatu yang datang atau melintas atas seseorang. “Biarlah ... menimpa” mempertahankan daya jussif dan menyampaikan penerimaan Ayub atas akibat apa pun.
- source_word: עָלַי
  choice: aku
  rationale: Preposisi עַל dengan sufiks orang pertama menandai Ayub sebagai orang yang terkena apa pun yang akan terjadi; maknanya terwakili secara idiomatis dalam “menimpa aku.”
- source_word: מָה
  choice: apa pun
  rationale: מָה dipakai secara tak tentu, yakni “apa saja yang mungkin terjadi.” “Apa pun” alami dalam bahasa Indonesia dan menjaga keterbukaan hasilnya.
theological_decisions:
- issue: Sikap Ayub terhadap akibat setelah ia berbicara
  choice: biarlah apa pun menimpa aku
  alternative: maka terjadilah padaku apa yang akan terjadi
  rationale: Teks menyatakan kesiapan atau kepasrahan Ayub menghadapi akibat yang tidak ditentukan, tanpa menjelaskan apakah akibat itu berasal langsung dari Allah, dari para sahabatnya, atau dari keadaan lain.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti “aku” sesuai dengan tuturan langsung Ayub. Ungkapan “terhadap aku” sengaja mempertahankan nuansa preposisi Ibrani yang tidak lazim, sementara catatan kaki menyediakan bentuk yang lebih harfiah.
