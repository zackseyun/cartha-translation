  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: id
  text: Adapun ia lapuk seperti sesuatu yang busuk, seperti pakaian yang dimakan ngengat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan ia lapuk seperti kebusukan, seperti pakaian yang dimakan ngengat.”'
    reason: Alternatif ini mempertahankan hubungan koordinatif וְ secara lebih harfiah dan menerjemahkan רָקָב dengan nomina abstrak “kebusukan”.
lexical_decisions:
- source_word: וְהוּא
  choice: Sementara ia
  rationale: Konjungsi dan pronomina mandiri melanjutkan subjek dari konteks. 'Sementara ia' menghubungkan gambaran ini secara wajar dengan uraian sebelumnya, meski bentuk Ibraninya juga dapat diterjemahkan 'Dan ia'.
- source_word: כְּרָקָב
  choice: seperti sesuatu yang busuk
  rationale: רָקָב menunjuk pada kebusukan atau pelapukan. Ungkapan konkret ini alami dalam bahasa Indonesia dan mempertahankan daya gambar perbandingannya.
- source_word: יִבְלֶה
  choice: lapuk
  rationale: בלה berarti menjadi usang, lapuk, atau merana. 'Lapuk' cocok dengan citra kebusukan dan pakaian yang rusak, serta menyampaikan kehancuran bertahap.
- source_word: כְּבֶגֶד
  choice: seperti pakaian
  rationale: בֶּגֶד adalah istilah umum untuk pakaian. 'Pakaian' merupakan padanan Indonesia yang alami dan tetap mempertahankan bentuk tunggal generik.
- source_word: אֲכָלוֹ
  choice: yang dimakan
  rationale: Bentuk dari אכל dengan akhiran pronominal menggambarkan pakaian itu sebagai sesuatu yang telah dimakan atau dihabiskan; konstruksi pasif ini alami dalam bahasa Indonesia.
- source_word: עָשׁ
  choice: ngengat
  rationale: Kata Ibrani berbentuk tunggal dan dapat berfungsi secara generik. Bahasa Indonesia secara alami memakai 'ngengat' tanpa penanda jumlah dalam gambaran ini, sehingga ambiguitas jumlah tetap terjaga.
theological_decisions: []
translation_notes:
  register: Bahasa puitis yang modern dan bermartabat. 'Lapuk' menyatukan citra kerusakan tubuh atau manusia dengan pakaian yang dimakan ngengat tanpa menentukan secara berlebihan siapa rujukan 'ia' dalam konteks yang diperdebatkan.
