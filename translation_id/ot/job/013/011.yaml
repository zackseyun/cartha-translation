  text: Bukankah keagungan-Nya[a] akan menggentarkan kalian, dan kegentaran-Nya[b] akan menimpa kalian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keluhuran-Nya” atau “martabat-Nya.” Kata Ibrani ini dapat menyatakan ketinggian, keluhuran, atau kedudukan yang mulia.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini dapat berarti kegentaran yang ditimbulkan oleh-Nya atau rasa gentar terhadap-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Menyampaikan pertanyaan retoris yang mengharapkan jawaban ya secara alami dalam bahasa Indonesia.
- source_word: שְׂאֵתוֹ
  choice: keagungan-Nya
  rationale: Nomina ini dapat menunjuk pada ketinggian, keluhuran, atau martabat. Dalam konteks kebesaran Allah yang menimbulkan gentar, 'keagungan-Nya' alami dan tetap cukup luas.
- source_word: תְּבַעֵת
  choice: akan menggentarkan
  rationale: Bentuk Piel dari בעת menyatakan tindakan menyebabkan rasa gentar atau ngeri yang kuat; 'menggentarkan' mempertahankan intensitas dan ragam bahasa yang bermartabat.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Pronomina objek orang kedua jamak; 'kalian' membuat kemajemukannya jelas dalam bahasa Indonesia modern.
- source_word: וּפַחְדּוֹ
  choice: kegentaran terhadap-Nya
  rationale: Konstruksi pronominal ini dapat dipahami sebagai kegentaran yang Dia timbulkan atau kegentaran terhadap Dia. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan alternatif possessif yang lebih formal.
- source_word: יִפֹּל עֲלֵיכֶם
  choice: akan menimpa kalian
  rationale: Menyampaikan idiom sesuatu yang jatuh atau datang secara menguasai atas seseorang dengan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Arah makna pronomina pada וּפַחְדּוֹ
  choice: kegentaran terhadap-Nya
  alternative: kegentaran-Nya
  rationale: Ibrani memungkinkan pengertian kegentaran yang berkaitan dengan Allah, baik sebagai rasa gentar terhadap-Nya maupun kegentaran yang Dia timbulkan. Pilihan utama alami dalam bahasa Indonesia, dan ambiguitasnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas; susunan paralel dan daya retoris ayat dipertahankan.
