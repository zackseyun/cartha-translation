  yaml_path: translation/ot/job/013/005.yaml
  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: id
  text: Kalau saja kalian benar-benar diam[a], hal itu akan menjadi hikmat bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Ah, sekiranya kalian sama sekali tidak berbicara.”
    reason: Ungkapan pembuka dapat diterjemahkan dengan seruan harapan, sedangkan konstruksi verbal yang ditegaskan dapat dinyatakan sebagai tidak berbicara sama sekali.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Kalau saja
  rationale: Ungkapan ini menyatakan harapan atau keinginan kuat, bukan pertanyaan harfiah. “Kalau saja” alami dalam bahasa Indonesia modern dan mempertahankan daya optatifnya.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: kalian benar-benar diam
  rationale: Infinitif absolut yang diikuti verba dari akar yang sama memberi penegasan pada tindakan. “Benar-benar diam” menyampaikan penekanan itu tanpa terasa kaku.
- source_word: וּתְהִי
  choice: hal itu akan menjadi
  rationale: Verba feminin tunggal ini kemungkinan merujuk pada tindakan diam yang baru disebutkan. “Hal itu” membuat rujukannya jelas tanpa mengubah hubungan antarklausa.
- source_word: לָכֶם
  choice: bagi kalian
  rationale: Preposisi ל menyatakan hubungan atau manfaat; “bagi kalian” merupakan padanan Indonesia yang alami.
- source_word: לְחָכְמָה
  choice: menjadi hikmat
  rationale: Kata חָכְמָה berarti “hikmat”. Susunan “menjadi hikmat bagi kalian” mempertahankan bentuk evaluatif teks Ibrani dan tidak mempersempitnya menjadi sekadar tanda atau kesan bijaksana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk jamak “kalian” dipakai karena verba dan pronomina Ibrani ditujukan kepada lebih dari satu orang. “Hikmat” dipertahankan sebagai istilah yang lazim dalam konteks sastra hikmat.
