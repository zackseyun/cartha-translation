  text: Please hear my argument[b][a], and listen to the pleadings of my lips.
translation:
  language: id
  text: Dengarkanlah kiranya argumentasiku[a], dan simaklah perbantahan dari bibirku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “teguran”, “pembelaan”, atau “pembuktianku”; istilah Ibrani ini dapat menunjuk pada koreksi atau teguran, juga pada alasan, pembuktian, atau perkara yang dikemukakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “perselisihan” atau “pembelaan dalam perkara” dari bibirku; ungkapan Ibrani ini bernuansa perbantahan verbal dan dapat memiliki latar forensik.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Dengarlah kiranya
  rationale: Imperatif jamak שׁמע disertai partikel permohonan נָא. Bentuk ini mempertahankan seruan langsung yang diperhalus tanpa terdengar terlalu sehari-hari.
- source_word: תוֹכַחְתִּי
  choice: pembelaanku
  rationale: Nomina ini dapat berarti teguran, pembuktian, atau argumentasi. Dalam konteks perbantahan Ayub, 'pembelaanku' menyampaikan perkara beralasan yang ia kemukakan tanpa membatasinya menjadi teguran moral.
- source_word: וְרִבוֹת
  choice: dan sanggahan-sanggahan
  rationale: Bentuk dari ריב membawa nuansa perselisihan atau perbantahan, termasuk dalam suasana forensik. 'Sanggahan-sanggahan' wajar dalam bahasa Indonesia dan menunjukkan pernyataan yang diajukan untuk melawan tuduhan atau argumen.
- source_word: שְׂפָתַי
  choice: dari bibirku
  rationale: Citra konkret 'bibir' dipertahankan, sementara preposisi 'dari' mengungkapkan bahwa sanggahan itu diucapkan oleh Ayub.
- source_word: הַקְשִׁיבוּ
  choice: perhatikanlah
  rationale: Imperatif קשׁב menuntut perhatian sungguh-sungguh. 'Perhatikanlah' membedakannya dari שׁמע pada baris pertama sekaligus mempertahankan paralelisme puitis.
