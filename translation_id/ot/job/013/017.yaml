  text: שִׁמְע֣וּ שָׁ֭מוֹעַ מִלָּתִ֑/י וְ֝/אַֽחֲוָתִ֗/י בְּ/אָזְנֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/017.yaml
  text: Listen carefully to my word[a], and let my declaration be in your ears.
translation:
  language: id
  text: Dengarkanlah baik-baik perkataanku, dan biarlah pernyataanku masuk ke telinga kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ucapanku” atau “penjelasanku” untuk “pernyataanku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Dengarkanlah baik-baik
  rationale: Gabungan verba imperatif dan infinitif absolut menguatkan perintah. Ungkapan ini menyampaikan penekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: מִלָּתִי
  choice: perkataanku
  rationale: מִלָּה dapat berarti 'perkataan' atau 'ucapan'. 'Perkataanku' mempertahankan bentuk tunggal kolektif dan cocok dengan seruan Ayub yang khidmat.
- source_word: וַאֲחֲוָתִי
  choice: pernyataanku
  rationale: Kata benda yang berkaitan dengan חוה di sini menunjuk pada sesuatu yang dikemukakan atau dinyatakan. 'Pernyataanku' mempertahankan kesan formal tanpa mempersempit maknanya menjadi penjelasan.
- source_word: בְּאָזְנֵיכֶם
  choice: masuk ke telinga kalian
  rationale: Ibrani harfiahnya 'di dalam telinga kalian'. Bentuk Indonesia ini mempertahankan gambaran konkret itu sekaligus menghasilkan kalimat yang alami dan mengungkapkan permintaan agar pernyataan Ayub sungguh diperhatikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Pronomina jamak 'kalian' memperjelas bahwa Ayub berbicara kepada beberapa sahabat. Partikel '-lah' dan pengulangan 'baik-baik' menyampaikan penekanan Ibrani secara alami.
