  text: It will be paid in full before his time[b][a], and his branch will not stay green.
translation:
  language: id
  text: Sebelum waktunya, hal itu akan menjadi genap[a], dan pucuknya tidak akan tetap hijau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan menjadi penuh.” Verba Ibrani ini juga dapat dipahami sebagai “akan terpenuhi” atau “akan selesai”; subjeknya tidak disebutkan dan mungkin mengacu pada “balasannya” dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “cabangnya,” “pelepahnya,” atau “tajuknya.” Istilah Ibrani ini menunjuk pada bagian pohon atau tumbuhan yang menyerupai cabang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֹא יוֹמוֹ
  choice: sebelum waktunya
  rationale: Ungkapan harfiahnya, “bukan pada harinya,” secara idiomatis menunjuk pada sesuatu yang terjadi sebelum waktu yang semestinya; pilihan ini wajar dalam bahasa Indonesia dan sesuai dengan konteks kebinasaan dini.
- source_word: תִּמָּלֵא
  choice: akan genap
  rationale: Bentuk nifal dari מלא pada dasarnya berarti “menjadi penuh” atau “menjadi lengkap.” “Akan genap” mempertahankan gagasan kepenuhan atau penyelesaian tanpa memasukkan gambaran pembayaran yang tidak dinyatakan langsung oleh verba tersebut.
- source_word: כִפָּתוֹ
  choice: rantingnya
  rationale: Nomina ini menunjuk pada bagian tumbuhan yang menyerupai cabang, mungkin pelepah atau pucuk teratas. “Rantingnya” mempertahankan citra tumbuhan tanpa menentukan jenis pohon secara berlebihan.
- source_word: לֹא רַעֲנָנָה
  choice: tidak akan tetap hijau
  rationale: רענן menggambarkan tumbuhan yang hijau, segar, atau subur. Ungkapan ini mempertahankan citra konkret tumbuhan dan menyampaikan hilangnya kesegaran serta kehidupan.
theological_decisions:
- issue: Subjek tersirat dari תִּמָּלֵא
  choice: balasannya akan genap
  alternative: hal itu akan genap
  rationale: Verba feminin tunggal kemungkinan merujuk kembali kepada תְּמוּרָתוֹ, “balasannya,” dalam ayat sebelumnya. Penyebutan kembali nomina itu membuat bahasa Indonesia jelas, tetapi catatan kaki mempertahankan kemungkinan bahwa rujukannya dipahami secara lebih umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang ringkas. “Genap” dipilih untuk mempertahankan keluasan makna verba Ibrani, sedangkan citra tumbuhan dijaga secara konkret melalui “ranting” dan “hijau.”
