  text: אֲשֶׁר חֲכָמִ֥ים יַגִּ֑ידוּ וְ/לֹ֥א כִֽ֝חֲד֗וּ מֵ/אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/018.yaml
  text: what wise men declare[a], and have not hidden from their fathers—
translation:
  language: id
  text: 'yang diberitahukan oleh orang-orang bijak


    dan yang tidak mereka sembunyikan dari leluhur mereka[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tidak disembunyikan oleh leluhur mereka,” atau, “dan mereka tidak menyembunyikan apa pun yang diterima dari leluhur mereka.” Susunan bahasa Ibrani memungkinkan lebih dari satu pemahaman tentang hubungan antara tindakan “menyembunyikan” dan “leluhur mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata relatif ini melanjutkan isi yang diperkenalkan pada ayat sebelumnya. “Yang” alami dalam bahasa Indonesia dan mempertahankan hubungan sintaksis dengan konteks.
- source_word: חֲכָמִים
  choice: orang-orang bijak
  rationale: Nomina jamak ini menunjuk kepada para pemilik hikmat sebagai kelompok konkret; “orang-orang bijak” jelas, alami, dan sesuai dengan konteks pewarisan hikmat.
- source_word: יַגִּידוּ
  choice: dinyatakan
  rationale: Bentuk Hifil dari נגד bermakna memberitahukan atau menyatakan. Bentuk pasif “dinyatakan” menyatu secara alami dengan klausa relatif yang bergantung pada ayat sebelumnya dan mempertahankan nada khidmat.
- source_word: וְלֹא
  choice: dan tidak
  rationale: Mempertahankan koordinasi serta negasi dalam teks Ibrani tanpa menambahkan penjelasan temporal.
- source_word: כִחֲדוּ
  choice: mereka sembunyikan
  rationale: Kata kerja ini lazim berarti menyembunyikan atau merahasiakan. “Sembunyikan” merupakan padanan langsung dan mudah dipahami.
- source_word: מֵאֲבוֹתָם
  choice: dari leluhur mereka
  rationale: “Leluhur” lebih tepat daripada “ayah” karena konteksnya ialah tradisi hikmat lintas generasi. Preposisi “dari” mempertahankan kekompakan dan ambiguitas ungkapan Ibrani mengenai hubungan leluhur dengan tindakan menyembunyikan.
theological_decisions:
- issue: Hubungan מֵאֲבוֹתָם dengan כִחֲדוּ
  choice: dan tidak mereka sembunyikan dari leluhur mereka
  alternative: 'yang tidak disembunyikan oleh leluhur mereka; atau: dan mereka tidak menyembunyikan apa pun yang diterima dari leluhur mereka'
  rationale: 'Susunan Ibrani ringkas dan dapat dipahami dengan lebih dari satu cara: leluhur dapat dipandang sebagai pihak yang tidak menyembunyikan tradisi, sebagai pihak yang darinya sesuatu tidak disembunyikan, atau sebagai sumber tradisi yang tidak ditahan. Teks utama mengikuti susunan Ibrani secara dekat, sedangkan catatan kaki menjaga alternatif yang sungguh mungkin.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Larik kedua mempertahankan urutan unsur Ibrani serta tanda pisah yang menunjukkan bahwa kalimat berlanjut ke ayat berikutnya. Penanda catatan kaki [a] ditempatkan setelah klausa pertama karena catatan menerangkan konstruksi klausa berikutnya dalam hubungannya dengan keseluruhan pernyataan.
