  text: Indeed[c][b][a], you annul the fear of God and diminish meditation before God.
translation:
  language: id
  text: Sungguh, engkau melemahkan rasa takut kepada Allah[a] dan mengurangi perenungan[b] di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rasa takut”; dapat juga berarti sikap hormat kepada Allah. Kata kerjanya dapat diterjemahkan “meniadakan” atau “membuat tidak efektif”.
    reason: lexical_alternative
  - marker: b
    text: Atau “doa”, “ibadah”, “keluhan”, atau “curahan pikiran”. Kata Ibrani ini dapat menunjuk pada renungan maupun ucapan yang reflektif atau penuh doa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Sungguh
  rationale: Partikel ini menegaskan tuduhan Elifas. “Sungguh” menyampaikan daya penegasan itu secara alami dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua tunggal maskulin dinyatakan secara eksplisit untuk memberi tekanan kepada orang yang disapa. “Engkau” sesuai dengan ragam puitis yang bermartabat.
- source_word: תָּפֵר
  choice: melemahkan
  rationale: Bentuk hifil dari פרר berarti membatalkan, menggagalkan, atau membuat tidak efektif. Dalam konteks pengaruh perkataan Ayub terhadap kesalehan, “melemahkan” terdengar alami dan mempertahankan gagasan membuat sesuatu kehilangan dayanya.
- source_word: יִרְאָה
  choice: rasa takut kepada Allah
  rationale: Secara harfiah nomina ini berarti “rasa takut”, tetapi paralelnya dengan “di hadapan Allah” menunjukkan rasa takut atau hormat yang tertuju kepada Allah. Penambahan “kepada Allah” memperjelas rujukan yang tersirat tanpa mengubah pokok tuduhan.
- source_word: וְתִגְרַע
  choice: dan mengurangi
  rationale: Bentuk qal dari גרע berarti mengurangi, menyusutkan, atau menahan. “Mengurangi” mempertahankan arti dasarnya dan kesejajaran dengan “melemahkan” pada baris pertama.
- source_word: שִׂיחָה
  choice: perenungan
  rationale: Kata ini dapat menunjuk pada renungan, curahan pikiran, doa, atau keluhan. “Perenungan” mempertahankan keluasan maknanya lebih baik daripada pilihan yang lebih khusus seperti “doa”.
- source_word: לִפְנֵי אֵל
  choice: di hadapan Allah
  rationale: Frasa ini secara langsung berarti “di hadapan Allah” atau “dalam kehadiran Allah”. Pilihan ini alami dan mempertahankan orientasi religius dari tindakan tersebut.
theological_decisions:
- issue: Rujukan religius יִרְאָה
  choice: rasa takut kepada Allah
  alternative: rasa takut; sikap hormat
  rationale: Teks Ibrani hanya menyebut “rasa takut”, tetapi baris sejajarnya secara eksplisit menyebut Allah. Terjemahan ini menyatakan rujukan religius yang kuat dalam konteks, sementara catatan kaki menjaga bentuk harfiahnya dan kemungkinan nuansa hormat.
- issue: Makna שִׂיחָה di hadapan Allah
  choice: perenungan
  alternative: doa; ibadah; keluhan; curahan pikiran
  rationale: Istilah Ibrani memiliki rentang arti yang luas dan dapat mencakup ucapan reflektif maupun ucapan yang diarahkan kepada Allah. “Perenungan” tidak membatasi istilah itu hanya pada doa atau keluhan, sehingga ambiguitas aslinya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Engkau” dipakai sesuai sapaan tunggal dalam puisi hikmat. Susunan dua klausa dipertahankan untuk mencerminkan paralelisme Ibrani, dan catatan kaki menjaga keluasan makna istilah religius yang ambigu.
