translation:
  language: id
  text: sehingga engkau mengarahkan rohmu kepada Allah dan mengeluarkan kata-kata dari mulutmu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke arah Allah.” Dalam konteks tuduhan Elifas, ungkapan ini dapat menyiratkan sikap yang melawan Allah, tetapi bahasa Ibrani secara harfiah berbunyi “kepada/ke arah Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: sehingga
  rationale: Dalam rangkaian pertanyaan retoris ayat 12–13, כִּי memperkenalkan akibat atau wujud sikap yang baru saja dituduhkan. 'Sehingga' menghubungkannya secara alami dengan konteks Indonesia.
- source_word: תָשִׁיב
  choice: engkau mengarahkan
  rationale: Bentuk Hifil dari שׁוב di sini menyatakan tindakan mengarahkan atau memalingkan kecenderungan batin, bukan kembali secara fisik.
- source_word: אֶל אֵל
  choice: melawan Allah
  rationale: אֶל secara harfiah berarti 'kepada/ke arah', tetapi konteks tuduhan menunjukkan arah yang bermusuhan. 'Melawan Allah' menyampaikan implikasi kontekstual itu, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: רוּחֶךָ
  choice: semangatmu
  rationale: רוּחַ di sini menunjuk pada daya atau sikap batin Ayub. 'Semangat' cukup alami dalam bahasa Indonesia dan tidak membatasi maknanya menjadi sekadar emosi seperti 'amarah'.
- source_word: וְהֹצֵאתָ
  choice: dan mengeluarkan
  rationale: Bentuk Hifil יצא secara konkret berarti menyebabkan keluar. Pilihan ini mempertahankan gambaran kata-kata yang keluar dari mulut.
- source_word: מִפִּיךָ
  choice: dari mulutmu
  rationale: מִן menandai sumber; ungkapan Indonesia 'mengeluarkan ... dari mulutmu' alami dan mempertahankan citra teks.
- source_word: מִלִּין
  choice: kata-kata
  rationale: Bentuk jamak bercorak Aram ini berarti kata-kata atau ujaran. 'Kata-kata' paling langsung dan sesuai dengan konstruksi konkret ayat.
theological_decisions:
- issue: Arah semangat Ayub terhadap Allah
  choice: melawan Allah
  alternative: kepada Allah / ke arah Allah
  rationale: Teks Ibrani memakai preposisi arah yang pada dirinya sendiri tidak berarti 'melawan', tetapi konteks tuduhan Elifas menyiratkan pertentangan. Terjemahan utama menyampaikan daya tuduhan tersebut tanpa menyembunyikan arti harfiahnya, yang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti 'engkau' mempertahankan sapaan tunggal dalam wacana puitis. Susunan konkret 'mengeluarkan kata-kata dari mulutmu' sengaja dipertahankan.
