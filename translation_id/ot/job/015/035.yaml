  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: id
  text: Mereka mengandung kesusahan dan melahirkan kejahatan[a]; rahim mereka menyiapkan tipu daya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka hamil dengan kesusahan dan melahirkan kedurjanaan.”
    reason: Alternatif ini mempertahankan secara lebih harfiah keadaan hamil pada הָרֹה dan kemungkinan padanan etis yang lebih formal untuk אָוֶן.
lexical_decisions:
- source_word: הָרֹה
  choice: mengandung
  rationale: Partisipel Qal dari הרה mempertahankan gambaran kehamilan dan berpasangan secara alami dengan 'melahirkan'.
- source_word: עָמָל
  choice: kesusahan
  rationale: Dalam sastra hikmat, עָמָל dapat menunjuk pada kesusahan, kemalangan, atau perbuatan yang mendatangkan celaka; 'kesusahan' mempertahankan keluasan maknanya.
- source_word: וְיָלֹד
  choice: dan melahirkan
  rationale: Bentuk Qal dari ילד melanjutkan secara eksplisit metafora kehamilan dan kelahiran.
- source_word: אָוֶן
  choice: kejahatan
  rationale: אָוֶן dapat berarti kejahatan, kedurjanaan, atau kesusahan; dalam kecaman moral yang disejajarkan dengan tipu daya, 'kejahatan' menyampaikan daya etisnya.
- source_word: וּבִטְנָם
  choice: rahim mereka
  rationale: בטן secara harfiah dapat berarti perut atau rahim. 'Rahim' paling koheren dengan rangkaian mengandung dan melahirkan; akhiran orang ketiga jamak mendukung 'mereka'.
- source_word: תָּכִין
  choice: menyiapkan
  rationale: Bentuk Hifil dari כון berarti menyiapkan, membuat siap, atau menegakkan. 'Menyiapkan' mempertahankan gagasan pembentukan batin dalam metafora ini.
- source_word: מִרְמָה
  choice: tipu daya
  rationale: מִרְמָה menunjuk pada penipuan atau kelicikan; 'tipu daya' alami, ringkas, dan tidak mempersempit makna menjadi jenis pengkhianatan tertentu.
theological_decisions:
- issue: Jumlah dan gender subjek tersirat
  choice: Mereka mengandung ... rahim mereka ...
  alternative: Ia mengandung ... rahimnya ...; Seseorang mengandung ... rahimnya ...
  rationale: Walaupun partisipelnya berbentuk tunggal, akhiran orang ketiga jamak pada 'rahim mereka' dan konteks yang menggambarkan orang fasik sebagai suatu golongan mendukung subjek jamak kolektif. Pilihan ini juga menghindari ketidakselarasan tunggal-jamak dalam bahasa Indonesia.
- issue: Hubungan metaforis antara עָמָל dan אָוֶן
  choice: kesusahan ... kejahatan
  alternative: kesusahan ... kedurjanaan; kejahatan ... kesia-siaan
  rationale: 'Pembedaan ini mempertahankan ketegangan leksikal kedua istilah: yang pertama lebih luas dan menyoroti kesusahan/celaka, sedangkan yang kedua dalam konteks ini membawa bobot moral yang jelas.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang lugas dan bermartabat. Metafora kehamilan dipertahankan secara utuh; 'rahim' dipilih daripada 'perut' agar rangkaian citranya jelas.
