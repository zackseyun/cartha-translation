  text: Your own mouth condemns you[a], and not I; your own lips testify against you.
translation:
  language: id
  text: Mulutmu sendiri menyatakan bahwa engkau bersalah, bukan aku; bibirmu sendiri bersaksi melawanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “bibirmu sendiri menjawab melawanmu.” Kata Ibrani itu dapat berarti “menjawab”, tetapi dalam konteks ini tampaknya mengandung arti memberi kesaksian yang memberatkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: menyatakan engkau bersalah
  rationale: Bentuk Hifil dari רשע lazim berarti menyatakan seseorang bersalah atau menghukumnya. Pilihan ini mempertahankan nuansa forensik tanpa menyiratkan bahwa ucapan itu sendiri menjatuhkan hukuman.
- source_word: פִיךָ
  choice: mulutmu sendiri
  rationale: Secara harfiah berarti 'mulutmu'. Kata 'sendiri' menegaskan kontras bahwa perkataan Ayub sendirilah yang memberatkannya, bukan Elifas.
- source_word: וְלֹא אָנִי
  choice: bukan aku
  rationale: Terjemahan ringkas ini mempertahankan kontras langsung dan penekanan Ibrani.
- source_word: וּשְׂפָתֶיךָ
  choice: bibirmu sendiri
  rationale: Secara harfiah berarti 'bibirmu'. Kata 'sendiri' menghasilkan kesejajaran alami dengan 'mulutmu sendiri' dan menonjolkan unsur pemberatan diri.
- source_word: יַעֲנוּ
  choice: bersaksi
  rationale: 'Kata ענה secara dasar dapat berarti ''menjawab'', tetapi dalam konteks tuduhan ini memiliki nuansa forensik: bibir Ayub tampil seolah-olah sebagai saksi.'
- source_word: בָךְ
  choice: melawan engkau
  rationale: Bersama nuansa forensik יַעֲנוּ, preposisi ini paling alami menyatakan kesaksian yang memberatkan atau melawan Ayub.
