  yaml_path: translation/ot/job/015/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: id
  text: 'Lalu Elifas, orang Teman, menjawab dan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Bentuk naratif dari ענה menyatakan tanggapan dalam dialog. Ungkapan “menjawab” tetap wajar meskipun tidak didahului pertanyaan langsung.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַתֵּימָנִי
  choice: orang Teman
  rationale: Adjektiva nisbah ini menunjukkan asal atau keterkaitan Elifas dengan Teman. “Orang Teman” alami dalam bahasa Indonesia dan tidak mengacaukannya dengan kata sifat yang berarti penakut.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Mempertahankan kedua verba dalam rumusan dialog Ibrani “menjawab dan berkata”, tanpa meringkasnya menjadi satu verba.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada awal verba menandai kelanjutan urutan narasi; “Lalu” menyampaikan peralihan kepada tanggapan Elifas secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Rumusan ganda Ibrani dipertahankan karena kedua verba memiliki fungsi dalam pengantar tuturan. Tanda koma akhir mengantar langsung kepada perkataan pada ayat berikutnya.
