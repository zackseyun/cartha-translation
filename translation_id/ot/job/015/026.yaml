  yaml_path: translation/ot/job/015/026.yaml
  text: He rushes at him with his neck[a], with the thick bosses of his shields.
translation:
  language: id
  text: Ia menyerbu Dia dengan lehernya,[a] dengan tonjolan-tonjolan tebal pada perisai-perisainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan lehernya.” Gambaran Ibraninya hidup tetapi padat; ungkapan ini mungkin menggambarkan serangan dengan leher terjulur atau sikap menantang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרוּץ
  choice: menyerbu
  rationale: Kata kerja ini pada dasarnya berarti ‘berlari’; dalam konteks serangan yang menantang, ‘menyerbu’ menyampaikan gerak maju yang agresif secara wajar dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: Dia
  rationale: Dengan kata kerja gerak dalam konteks bermusuhan, preposisi ini menunjuk sasaran serangan. Kapitalisasi menjelaskan bahwa sasaran dalam konteks ialah Allah tanpa menambahkan sebutan yang tidak ada dalam ayat.
- source_word: בְּצַוָּאר
  choice: dengan leher terjulur
  rationale: Secara harfiah ‘dengan leher’. Bahasa Indonesia memerlukan sedikit pelengkapan agar citra serbuan itu dapat dipahami; ‘terjulur’ menyatakan kemungkinan postur maju tanpa menafsirkannya sebagai ‘tegar tengkuk’.
- source_word: בַּעֲבִי
  choice: tebal
  rationale: Nomina ini menyatakan ketebalan atau kemasifan; ‘tebal’ mempertahankan unsur konkret tersebut.
- source_word: גַּבֵּי
  choice: tonjolan-tonjolan
  rationale: Dalam kaitannya dengan perisai, kata ini menunjuk bagian belakang, permukaan cembung, atau tonjolan perisai. ‘Tonjolan-tonjolan’ tepat sekaligus lebih mudah dipahami pembaca umum daripada istilah teknis khusus.
- source_word: מָגִנָּיו
  choice: perisai-perisainya
  rationale: Bentuk Ibrani adalah jamak dengan akhiran milik orang ketiga tunggal; bentuk ulang mempertahankan kejamakan itu.
theological_decisions:
- issue: Rujukan pronomina אֵלָיו
  choice: Dia
  alternative: dia
  rationale: Dalam alur Ayub 15:25–26, orang fasik menyerang Allah. Kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Allah, tetapi tidak mengubah identitas referen.
- issue: Makna simbolis leher
  choice: mempertahankan citra tubuh tanpa menyebut ‘tegar tengkuk’
  alternative: dengan tengkuk tegar
  rationale: Teks hanya menyebut ‘leher’; meskipun citranya dapat menyiratkan sikap menantang, menerjemahkannya langsung sebagai kekerasan hati akan menutup ketegangan metaforis teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Citra serangan serta bentuk jamak ‘perisai-perisainya’ dipertahankan, sementara istilah teknis ‘bos perisai’ dihindari demi keterpahaman umum.
