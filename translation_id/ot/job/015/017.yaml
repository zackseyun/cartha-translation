  yaml_path: translation/ot/job/015/017.yaml
  text: I will tell you; listen to me. What I have seen[a], I will recount—
translation:
  language: id
  text: Aku akan memberitahumu; dengarkanlah aku. Apa yang telah kulihat, akan kuceritakan—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: Aku akan memberitahumu
  rationale: Bentuk piel ini memperkenalkan uraian Elifas. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan tindakan bertutur tanpa memberi kesan bahwa ia akan memperlihatkan sesuatu secara visual.
- source_word: שְׁמַע לִי
  choice: dengarkanlah aku
  rationale: Imperatif dengan preposisi menuntut perhatian kepada pembicara. Bentuk berpartikel -lah mempertahankan daya ajakan atau perintah dengan ragam yang wajar dan bermartabat.
- source_word: וְזֶה
  choice: Apa yang
  rationale: Secara formal berarti 'dan ini', tetapi di sini demonstratif tersebut mengantar isi yang akan diceritakan. 'Apa yang' menghasilkan hubungan klausa yang alami tanpa mengubah fungsi wacananya.
- source_word: חָזִיתִי
  choice: telah kulihat
  rationale: Bentuk perfektum menunjuk pada pengamatan pribadi Elifas yang tetap relevan bagi perkataannya sekarang. 'Telah kulihat' mempertahankan unsur pengalaman langsung.
- source_word: וַאֲסַפֵּרָה
  choice: akan kuceritakan
  rationale: Bentuk kohortatif menyatakan niat pembicara untuk menuturkan atau menguraikan apa yang diamatinya. 'Kuceritakan' lebih alami daripada 'kuuraikan kembali' dan tetap membedakannya dari kata pembuka yang lebih umum, 'memberitahumu'.
