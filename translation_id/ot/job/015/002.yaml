  text: הֶֽ/חָכָ֗ם יַעֲנֶ֥ה דַֽעַת ר֑וּחַ וִֽ/ימַלֵּ֖א קָדִ֣ים בִּטְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/002.yaml
  text: Should a wise man answer with windy knowledge[a], and fill his belly with the east wind?
translation:
  language: id
  text: Patutkah orang bijak menjawab dengan pengetahuan yang hampa seperti angin[a] dan memenuhi perutnya dengan angin timur?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pengetahuan angin,” yaitu pengetahuan yang kosong atau tidak berbobot.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: orang bijak
  rationale: Partikel tanya memperkenalkan pertanyaan retoris. Bentuk tunggal maskulin dipahami secara umum; 'orang bijak' alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: יַעֲנֶה
  choice: Patutkah ... menjawab
  rationale: Bentuk imperfek dalam pertanyaan retoris menyatakan kepatutan atau hal yang diharapkan, sehingga 'Patutkah' mempertahankan daya tegurannya.
- source_word: דַעַת רוּחַ
  choice: pengetahuan yang hampa seperti angin
  rationale: Frasa konstruksi ini secara harfiah berarti 'pengetahuan angin/roh'. Dalam konteks celaan Elifas, רוּחַ paling tepat merujuk pada angin sebagai gambaran kehampaan; ungkapan ini mempertahankan metafora sekaligus jelas bagi pembaca Indonesia.
- source_word: וִימַלֵּא
  choice: dan memenuhi
  rationale: Imperfek berurutan melanjutkan pertanyaan retoris; 'memenuhi' mempertahankan tindakan dan gambaran konkret teks sumber.
- source_word: קָדִים
  choice: angin timur
  rationale: קָדִים menunjuk pada angin timur, yang dalam konteks kawasan itu dapat bersifat keras dan merusak. Terjemahan mempertahankan citra konkret tanpa menambahkan sifat yang tidak dinyatakan.
- source_word: בִּטְנוֹ
  choice: perutnya
  rationale: בֶּטֶן secara konkret berarti 'perut'; pilihan ini mempertahankan metafora jasmani yang kuat dalam teks.
