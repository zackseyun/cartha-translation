  text: לֹֽא יֶ֭עְשַׁר וְ/לֹא יָק֣וּם חֵיל֑/וֹ וְ/לֹֽא יִטֶּ֖ה לָ/אָ֣רֶץ מִנְלָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: id
  text: 'Ia tidak akan menjadi kaya,

    kekayaannya tidak akan bertahan,

    dan hasilnya[a] tidak akan merunduk sampai ke tanah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hasilnya” sangat langka dan tidak pasti; mungkin juga berarti “milik mereka”, “perolehan mereka”, atau “kelimpahan mereka”. Bentuk Ibraninya memakai akhiran jamak, meskipun baris-baris sebelumnya berbicara tentang satu orang.
    reason: lexical_alternative
  - marker: b
    text: 'Baris terakhir mungkin menggambarkan hasil atau ranting yang tidak merunduk ke tanah karena sarat oleh kelimpahan. Ada juga yang memahaminya secara lebih umum: miliknya tidak akan meluas di negeri.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: menjadi kaya
  rationale: Bentuk Qal dari עשר menyatakan proses memperoleh kekayaan, bukan sekadar keadaan statis sebagai orang kaya.
- source_word: יָקוּם
  choice: bertahan
  rationale: Secara harfiah berarti “berdiri”, tetapi dengan חֵילוֹ ungkapan ini menyatakan bahwa kekayaannya tidak tetap atau tidak berlangsung lama.
- source_word: חֵילוֹ
  choice: kekayaannya
  rationale: חַיִל dapat berarti kekuatan, kemampuan, harta, atau sumber daya. Dalam konteks kemakmuran orang fasik, “kekayaannya” paling jelas dan wajar.
- source_word: יִטֶּה
  choice: merunduk
  rationale: נטה dapat berarti membentang, condong, atau membungkuk. Bersama לָאָרֶץ dan pemahaman agraris atas kata terakhir, “merunduk” mempertahankan gambaran hasil yang sarat hingga condong ke tanah.
- source_word: מִנְלָם
  choice: hasilnya
  rationale: Kata ini sangat langka dan maknanya tidak pasti. “Hasilnya” menghasilkan gambaran agraris yang koheren dengan יִטֶּה לָאָרֶץ, sementara ketidakpastian leksikal dan akhiran jamaknya dijelaskan dalam catatan kaki.
