  text: Both the gray-haired and the aged are among us[a], older in days than your father.
translation:
  language: id
  text: Baik orang beruban maupun orang yang lanjut usia ada di antara kami; usia mereka melebihi usia ayahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “besar/perkasa daripada ayahmu dalam hal hari-hari”; dalam konteks ini maksudnya ialah lebih tua daripada ayahmu.
