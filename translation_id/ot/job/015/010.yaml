lexical_decisions:
- source_word: גַּם ... גַּם
  choice: baik ... maupun
  rationale: Pengulangan גַּם memasangkan dua kelompok secara tegas; konstruksi Indonesia “baik ... maupun” menyampaikan pola itu dengan wajar.
- source_word: שָׂב
  choice: orang yang beruban
  rationale: Kata ini menunjuk kepada orang berusia lanjut dengan gambaran konkret rambut yang telah beruban.
- source_word: יָשִׁישׁ
  choice: orang yang sudah sangat tua
  rationale: Istilah ini menekankan usia yang sangat lanjut dan tetap dibedakan dari שָׂב tanpa menghilangkan kesejajarannya.
- source_word: בָּנוּ
  choice: ada di antara kami
  rationale: Preposisi dengan sufiks orang pertama jamak di sini menyatakan keberadaan dalam lingkungan atau kelompok Elifas.
- source_word: כַּבִּיר
  choice: lebih lanjut usianya
  rationale: Walaupun arti dasarnya dapat berupa “besar” atau “perkasa,” konstruksi perbandingan yang disertai יָמִים menuntut pengertian melampaui dalam usia.
- source_word: מֵאָבִיךָ יָמִים
  choice: daripada ayahmu
  rationale: Frasa Ibrani membandingkan usia dengan ayah Ayub; “lebih lanjut usianya daripada ayahmu” menyampaikan maksudnya secara alami sambil mempertahankan nuansa umur panjang.
