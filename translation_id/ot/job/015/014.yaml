  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: id
  text: 'Bagaimana mungkin manusia fana dapat murni[a],

    dan bagaimana mungkin orang yang lahir dari perempuan dapat menjadi benar[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersih.” Kata Ibrani ini dapat menunjuk kepada kebersihan atau kemurnian dalam arti moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “berada dalam keadaan benar,” “dianggap benar,” atau “berada di pihak yang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ כִּי
  choice: Bagaimana mungkin manusia fana
  rationale: Ungkapan tanya retoris ini secara harfiah mendekati ‘Apakah manusia itu, sehingga …?’ Dalam bahasa Indonesia, ‘Bagaimana mungkin …?’ menyampaikan daya retorisnya secara wajar. אֱנוֹשׁ menunjuk kepada manusia dalam kefanaan dan kelemahannya, sehingga diterjemahkan ‘manusia fana’.
- source_word: יִזְכֶּה
  choice: dapat murni
  rationale: Bentuk ini berasal dari זכה dan dapat menyatakan keadaan bersih atau murni, khususnya dalam arti moral pada konteks ini. ‘Murni’ mempertahankan nuansa moral tanpa membatasinya pada kebersihan jasmani.
- source_word: וְכִי
  choice: dan bagaimana mungkin
  rationale: וְ menghubungkan dua baris pertanyaan retoris yang sejajar. Pengulangan ‘bagaimana mungkin’ diperlukan agar susunan itu alami dan jelas dalam bahasa Indonesia.
- source_word: יִצְדַּק
  choice: dapat benar
  rationale: Kata dari akar צדק ini dapat berarti berada dalam keadaan benar, dinilai benar, atau berada di pihak yang benar. ‘Benar’ mempertahankan keluasan maknanya tanpa menjadikannya istilah teknis tentang pembenaran.
- source_word: יְלוּד אִשָּׁה
  choice: orang yang lahir dari perempuan
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang menggambarkan manusia dalam keadaan fana dan lemah, sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan antropologis אֱנוֹשׁ dan יְלוּד אִשָּׁה
  choice: ‘manusia fana’ dan ‘orang yang lahir dari perempuan’ sebagai sebutan umum bagi umat manusia
  alternative: ‘manusia’ atau ‘siapa pun yang lahir dari perempuan’
  rationale: Kedua ungkapan berbentuk tunggal tetapi mewakili manusia secara umum. ‘Manusia fana’ juga mempertahankan nuansa kelemahan yang terkandung dalam אֱנוֹשׁ.
- issue: Nuansa moral atau forensik pada יִצְדַּק
  choice: ‘dapat benar’
  alternative: ‘dapat dibenarkan’, ‘dapat dianggap benar’, atau ‘dapat berada di pihak yang benar’
  rationale: Konteks puisi hikmat ini berbicara luas tentang keadaan manusia, bukan secara khusus merumuskan doktrin teknis pembenaran. Pilihan ‘benar’ menjaga kemungkinan nuansa moral dan evaluatif.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan ‘Bagaimana mungkin …?’ dipilih untuk menyampaikan pertanyaan retoris Ibrani secara alami; paralelisme kedua baris dipertahankan melalui pengulangan.
