  yaml_path: translation/ot/job/015/009.yaml
  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: id
  text: Apa yang engkau ketahui yang tidak kami ketahui? Apa yang engkau pahami yang tidak kami miliki?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tidak ada pada kami.” Secara harfiah, bahasa Ibraninya berbunyi, “dan itu tidak bersama kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Apa
  rationale: Kata tanya ini membuka pertanyaan retoris; “Apa” mempertahankan keringkasan teks Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: יָדַעְתָּ
  choice: engkau ketahui
  rationale: Bentuk perfek orang kedua tunggal maskulin dari ידע dipakai dengan makna kini dalam pertanyaan retoris; konstruksi “yang engkau ketahui” alami setelah “Apa”.
- source_word: וְלֹא נֵדָע
  choice: yang tidak kami ketahui
  rationale: Konjungsi, negasi, dan verba orang pertama jamak menyatakan kontras dengan pengetahuan lawan bicara; klausa relatif menghasilkan bahasa Indonesia yang jelas dan tetap dekat dengan susunan maknanya.
- source_word: תָּבִין
  choice: engkau pahami
  rationale: בין menyatakan pengertian atau kemampuan memahami; “pahami” jelas, umum, dan sejajar dengan “ketahui”.
- source_word: וְלֹא עִמָּנוּ הוּא
  choice: yang tidak ada pada kami
  rationale: Ungkapan Ibrani secara harfiah berarti “dan itu tidak bersama kami.” “Tidak ada pada kami” mempertahankan gambaran keberadaan atau kepemilikan tanpa mengubahnya langsung menjadi “tidak kami miliki”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina “engkau” dipakai untuk sapaan tunggal dalam wacana puitis, sedangkan “kami” mempertahankan pembedaan kelompok pembicara dari lawan bicara. Paralelisme kedua pertanyaan dijaga.
