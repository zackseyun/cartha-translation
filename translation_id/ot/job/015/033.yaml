translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Paralelisme kedua bagian dipertahankan melalui “menggugurkan … dan merontokkan …,” sedangkan gambaran buah serta bunga yang hilang sebelum waktunya dibuat mudah dipahami tanpa meniadakan nuansa keras pada kata kerja pertama.
