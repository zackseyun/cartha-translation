  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: id
  text: Ia akan menggugurkan buahnya yang belum matang seperti pokok anggur[a], dan merontokkan bunganya[b] seperti pohon zaitun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melucuti buahnya yang belum matang seperti pokok anggur.” Kata kerja Ibrani biasanya memiliki nuansa tindakan keras, perampasan, atau pelucutan, tetapi gambaran pertanian di sini menekankan hilangnya buah sebelum matang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kembangnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: akan menggugurkan
  rationale: Akar kata ini biasanya menyiratkan kekerasan, perampasan, atau tindakan melucuti. Dalam gambaran pertanian ini, ungkapan tersebut menunjuk pada buah muda yang terlepas sebelum matang; “menggugurkan” menyampaikan akibat konkretnya secara alami tanpa menghapus kemungkinan nuansa tindakan keras, yang dicatat dalam catatan kaki.
- source_word: כַּגֶּפֶן
  choice: seperti pokok anggur
  rationale: Kata גֶּפֶן menunjuk pada tanaman anggur. “Pokok anggur” merupakan padanan Indonesia yang jelas dalam perbandingan ini.
- source_word: בִּסְרוֹ
  choice: buahnya yang belum matang
  rationale: בֹּסֶר berarti buah anggur yang masih muda atau belum matang. Karena “anggur yang belum matang” dapat terdengar seolah menunjuk jenis tanamannya, “buahnya yang belum matang” lebih alami dalam bahasa Indonesia, sementara konteks pokok anggur memperjelas jenis buah tersebut. Sufiks orang ketiga maskulin dipertahankan dengan “-nya”.
- source_word: וְיַשְׁלֵךְ
  choice: dan merontokkan
  rationale: Bentuk kausatif dari שׁלך berarti melemparkan atau membuang. Dalam gambaran pohon yang kehilangan bunga sebelum menjadi buah, “merontokkan” alami dan tetap menyatakan tindakan aktif.
- source_word: כַּזַּיִת
  choice: seperti pohon zaitun
  rationale: Dalam konteks bunga yang terlepas, זַיִת menunjuk pada pohon zaitun, bukan buah zaitun.
- source_word: נִצָּתוֹ
  choice: bunganya
  rationale: Kata נִצָּה menunjuk pada bunga atau kembang tanaman. “Bunga” adalah padanan Indonesia yang paling umum dan jelas; sufiks kepunyaan dipertahankan dengan “-nya”.
