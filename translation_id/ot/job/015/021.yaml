  text: A sound of terrors is in his ears[a]; in prosperity the destroyer comes upon him.
translation:
  language: id
  text: 'Suara berbagai kengerian terdengar di telinganya;

    di tengah kemakmuran[a], si perusak mendatanginya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah kedamaian” atau “ketika ia merasa aman”; kata Ibrani שָׁלוֹם dapat berarti kedamaian, kesejahteraan, kemakmuran, atau keadaan aman.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Suara
  rationale: Kata ini dapat berarti ‘suara’ atau ‘bunyi’. Dalam konstruksi dengan פְּחָדִים, yang dimaksud ialah sesuatu yang didengar, bukan perkataan yang diucapkan; ‘suara’ tetap alami dalam bahasa Indonesia.
- source_word: פְּחָדִים
  choice: berbagai kengerian
  rationale: Bentuk jamak menunjuk pada beragam teror atau hal-hal yang menakutkan, bukan sekadar rasa takut batin. ‘Berbagai kengerian’ mempertahankan daya jamaknya tanpa ungkapan ulang yang kaku.
- source_word: בְּאָזְנָיו
  choice: terdengar di telinganya
  rationale: Secara harfiah berarti ‘di telinganya’. Penambahan ‘terdengar’ membuat hubungan dengan ‘suara’ wajar dalam bahasa Indonesia sambil mempertahankan gambaran konkret telinga.
- source_word: בַּשָּׁלוֹם
  choice: di tengah kemakmuran
  rationale: שָׁלוֹם dapat menyatakan damai, keadaan aman, kesejahteraan, atau kemakmuran. Dalam konteks datangnya kehancuran secara mendadak ketika keadaan tampak baik, ‘kemakmuran’ cocok, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: שׁוֹדֵד
  choice: si perusak
  rationale: Partisip ini menunjuk kepada orang yang merusak, membinasakan, atau menjarah. ‘Si perusak’ jelas dan mudah dipahami serta tidak mempersempit makna hanya pada perampasan barang.
- source_word: יְבוֹאֶנּוּ
  choice: datang menyerangnya
  rationale: Bentuk ini secara dasar berarti ‘datang’ dengan akhiran objek orang ketiga tunggal. ‘Datang menyerangnya’ menyampaikan kedatangan yang bermusuhan secara alami; bentuk kini mempertahankan gaya puitis Ibrani, meskipun nuansa mendatang tetap mungkin.
