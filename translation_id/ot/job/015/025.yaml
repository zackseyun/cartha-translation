  yaml_path: translation/ot/job/015/025.yaml
  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: id
  text: 'sebab ia telah mengulurkan tangannya melawan Allah[a]

    dan menunjukkan dirinya kuat terhadap Yang Mahakuasa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebab ia telah mengulurkan tangannya ke arah Allah dan menguatkan dirinya melawan Yang Mahakuasa.”'
    reason: Alternatif ini mempertahankan arti dasar preposisi “ke arah” dan nuansa refleksif verba secara lebih harfiah.
lexical_decisions:
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi keadaan orang fasik dalam konteks sekitarnya; “sebab” menyampaikan hubungan kausal dengan wajar.
- source_word: נָטָה ... יָדוֹ
  choice: telah mengacungkan tangannya
  rationale: Secara harfiah menggambarkan mengulurkan atau merentangkan tangan. Dalam konteks permusuhan, “mengacungkan tangan” mempertahankan gambaran konkret sekaligus menyatakan sikap menantang.
- source_word: אֶל
  choice: melawan / terhadap
  rationale: Makna dasarnya ialah “kepada/ke arah”, tetapi konteks permusuhan menuntut ungkapan Indonesia yang menyatakan perlawanan. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֵל
  choice: Allah
  rationale: Gelar ilahi ini diterjemahkan sebagai “Allah”, berbeda dari שַׁדַּי pada baris sejajar.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi ini, bukan mentransliterasikannya, serta mempertahankan kesejajaran dengan “Allah”.
- source_word: יִתְגַּבָּר
  choice: menyombongkan kekuatannya
  rationale: Bentuk refleksif ini menyatakan bahwa orang itu membuat atau menunjukkan dirinya kuat. Dalam konteks pemberontakan, pilihan ini mempertahankan gagasan kekuatan yang dibanggakan tanpa menyiratkan bahwa ia benar-benar mengungguli Allah.
theological_decisions:
- issue: Dua gelar ilahi dalam kesejajaran puisi
  choice: Allah / Yang Mahakuasa
  alternative: Allah / Shaddai; Allah Yang Perkasa / Yang Mahakuasa
  rationale: Menerjemahkan kedua gelar mempertahankan maknanya bagi pembaca modern, sedangkan pilihan yang berbeda menjaga kesejajaran tanpa meleburkan keduanya.
- issue: Nuansa tindakan manusia terhadap Allah
  choice: menyombongkan kekuatannya terhadap Yang Mahakuasa
  alternative: menguatkan dirinya melawan Yang Mahakuasa; menunjukkan dirinya kuat terhadap Yang Mahakuasa
  rationale: Ungkapan ini mempertahankan ironi tindakan menegakkan kekuatan diri di hadapan Yang Mahakuasa, tetapi tidak mengajarkan bahwa manusia sungguh dapat mengalahkan-Nya.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pemenggalan dua baris mengikuti kesejajaran Ibrani; penanda [a] ditempatkan langsung sesudah “Allah”.
