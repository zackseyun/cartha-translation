base_translation:
  language: en
  yaml_path: translation/ot/job/015/007.yaml
  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: id
  text: Apakah engkau dilahirkan sebagai manusia pertama[a], dan apakah engkau dilahirkan sebelum bukit-bukit ada?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah engkau dilahirkan sebagai Adam, manusia pertama?” Teks Ibrani berbunyi “manusia pertama” dan mungkin mengacu kepada Adam tanpa secara eksplisit memakai Adam sebagai nama diri.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: sebagai manusia pertama
  rationale: Partikel tanya הֲ membentuk pertanyaan retoris; רִאשׁוֹן menyatakan yang terdahulu dalam waktu, sedangkan אָדָם di sini paling wajar dipahami sebagai manusia, bukan secara pasti sebagai nama diri Adam.
- source_word: תִּוָּלֵד
  choice: engkau dilahirkan
  rationale: Bentuk nifal dari ילד lazim berarti 'dilahirkan' dan secara alami mempertahankan bentuk pasif dalam bahasa Indonesia.
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  choice: dan ... sebelum bukit-bukit ada
  rationale: לִפְנֵי menunjukkan keberadaan yang lebih dahulu daripada bukit-bukit. Penambahan 'ada' membuat perbandingan waktu alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: חוֹלָלְתָּ
  choice: engkau dilahirkan
  rationale: Bentuk ini memakai citra persalinan dan dapat berarti 'dilahirkan' atau 'dibawa lahir'. Pengulangan 'dilahirkan' lebih wajar dalam bahasa Indonesia, sementara citra kelahiran tetap terpelihara.
theological_decisions:
- issue: Apakah אָדָם merupakan nama diri Adam atau kata umum 'manusia'
  choice: manusia dalam frasa 'manusia pertama'
  alternative: Adam, manusia pertama
  rationale: Bahasa Ibrani dapat membangkitkan bayangan tentang Adam, tetapi bentuk katanya tidak mengharuskan pembacaan sebagai nama diri. Terjemahan utama mempertahankan ketidakpastian itu, sedangkan kemungkinan alusi dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'engkau' dipakai untuk mempertahankan sapaan tunggal dalam wacana puitis; struktur pertanyaan retoris dan gambaran tentang zaman purba dipertahankan.
