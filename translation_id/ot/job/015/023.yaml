base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: id
  text: 'Ia mengembara mencari roti[a]: “Di mana?” Ia tahu bahwa hari kegelapan sudah siap baginya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makanan”. Kata Ibrani yang secara harfiah berarti “roti” juga dapat menunjuk pada makanan secara umum.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “di tangannya”; ungkapan ini tampaknya berarti bahwa hari kegelapan itu sudah dekat baginya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: mengembara
  rationale: Partisipel Qal ini menggambarkan tindakan terus-menerus berupa berkeliaran atau mengembara tanpa ketenangan. “Mengembara” menyampaikan keadaan itu tanpa menafsirkannya secara khusus sebagai pembuangan.
- source_word: לַלֶּחֶם
  choice: mencari roti
  rationale: לֶחֶם secara harfiah berarti “roti”, tetapi dapat menunjuk pada makanan secara umum. Preposisi ל menunjukkan tujuan pencarian; karena itu “mencari roti” alami dalam bahasa Indonesia dan tetap mempertahankan gambaran konkret teks Ibrani.
- source_word: אַיֵּה
  choice: Di manakah itu?
  rationale: Kata tanya ini berarti “di mana?” Kata “itu” merujuk kembali kepada roti dan diperlukan agar pertanyaan terdengar wajar dalam bahasa Indonesia. Tanda petik menyajikannya sebagai seruan pencarian, sesuai alur kalimat meskipun kata “berkata” tidak terdapat secara eksplisit.
- source_word: יָדַע
  choice: Ia tahu
  rationale: Bentuk perfektum dari ידע menyatakan pengetahuan atau kesadaran yang mantap. “Ia tahu” adalah padanan langsung dan tidak menambahkan nuansa kepastian di luar teks.
- source_word: נָכוֹן
  choice: siap
  rationale: Bentuk ini menyatakan sesuatu yang telah dipersiapkan, ditetapkan, atau tersedia. “Siap” mempertahankan kesan bahwa malapetaka segera mendatang tanpa terlalu menentukan nuansa katanya.
- source_word: בְּיָדוֹ
  choice: menantinya
  rationale: Ungkapan ini secara harfiah berarti “di tangannya”, tetapi dalam konteks ini menunjukkan bahwa hari kegelapan berada dekat dan siap menimpa orang itu. “Siap menantinya” menyampaikan ancaman yang segera dan alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יוֹם חֹשֶׁךְ
  choice: hari kegelapan
  rationale: Frasa konstruksi ini menggambarkan suatu hari yang bercirikan kegelapan. Padanan ini mempertahankan citra Ibrani dan tidak mempersempitnya menjadi “malapetaka”, “kebinasaan”, atau “penghakiman”.
theological_decisions:
- issue: Makna metaforis “hari kegelapan”
  choice: hari kegelapan
  alternative: hari malapetaka; hari kebinasaan; hari penghakiman
  rationale: Dalam perkataan Elifas, frasa ini mengarah kepada bencana yang mengancam orang fasik. Namun, teks Ibrani memakai gambaran “kegelapan” dan tidak secara eksplisit menyebut penghakiman ilahi. Terjemahan mempertahankan gambaran serta ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Kalimat pertama mempertahankan pertanyaan pendek yang mendesak; metafora “hari kegelapan” dipertahankan tanpa penjelasan doktrinal dalam teks utama.
