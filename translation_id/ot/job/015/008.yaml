  yaml_path: translation/ot/job/015/008.yaml
  text: Have you listened in the council of God[a], and restricted wisdom to yourself?
translation:
  language: id
  text: Apakah engkau mendengarkan di dalam sidang Allah[a] dan membatasi hikmat hanya pada dirimu sendiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: pembicaraan rahasia Allah atau nasihat Allah. Kata Ibrani סוֹד dapat berarti sidang terbatas, lingkungan akrab, pembicaraan rahasia, atau musyawarah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: di dalam sidang
  rationale: סוֹד dapat menunjuk pada pertemuan terbatas tempat berlangsungnya pembicaraan rahasia atau musyawarah. “Sidang” mempertahankan gambaran forum ilahi dan gagasan tentang akses istimewa, sedangkan alternatif leksikalnya dicatat dalam catatan kaki.
- source_word: אֱלוֹהַ
  choice: Allah
  rationale: אֱלוֹהַ adalah bentuk tunggal yang lazim dipakai untuk Allah dalam kitab Ayub; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: תִּשְׁמָע
  choice: engkau mendengarkan
  rationale: שׁמע dapat berarti mendengar atau mendengarkan. Dalam konteks mengikuti pembicaraan suatu sidang, “mendengarkan” menyampaikan tindakan menyimak dengan sengaja.
- source_word: וְ/תִגְרַע
  choice: dan membatasi
  rationale: גרע berarti mengurangi, membatasi, atau menahan. Bersama frasa אֵלֶיךָ חָכְמָה, kata ini menyatakan tuduhan retoris bahwa Ayub menganggap hikmat terbatas pada dirinya.
- source_word: אֵלֶיךָ
  choice: hanya pada dirimu sendiri
  rationale: Preposisi אֶל dengan sufiks orang kedua tunggal menunjukkan pembatasan atau pengarahan kepada lawan bicara. Kata “hanya” memperjelas unsur eksklusif yang tersirat oleh konstruksi ini.
- source_word: חָכְמָה
  choice: hikmat
  rationale: “Hikmat” adalah padanan baku bagi חָכְמָה dan di sini menunjuk pada kebijaksanaan atau pengertian secara umum.
theological_decisions:
- issue: Makna סוֹד ilahi dalam retorika kitab Ayub
  choice: sidang Allah
  alternative: rahasia Allah; pembicaraan rahasia Allah; nasihat Allah
  rationale: Pertanyaan Elifas menyindir seolah-olah Ayub memiliki akses khusus ke pembicaraan batin Allah. “Sidang Allah” mempertahankan kemungkinan gambaran majelis tempat berlangsungnya musyawarah tanpa meniadakan arti “rahasia” atau “nasihat,” yang disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” dipakai karena konteksnya adalah sapaan langsung tunggal dalam wacana puitis. Susunan pertanyaan dipertahankan sebagai sindiran retoris.
