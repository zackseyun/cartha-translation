  yaml_path: translation/ot/job/015/012.yaml
  text: Why does your heart carry you away[a], and why do your eyes flash?
translation:
  language: id
  text: Mengapa hatimu menghanyutkanmu, dan mengapa matamu berkilat[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkedip,” “memberi isyarat,” atau mungkin “berputar”; kata kerja Ibrani ini langka dan nuansa tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Mengapa
  rationale: Walaupun secara harfiah berarti “apa”, dalam pertanyaan retoris ini kata tersebut menanyakan sebab atau dorongan; “mengapa” paling alami dalam bahasa Indonesia.
- source_word: יִקָּחֲךָ
  choice: menyeretmu
  rationale: Bentuk dari לקח berarti “mengambil” dengan akhiran objek orang kedua. Dengan “hatimu” sebagai subjek, ungkapan ini menggambarkan hati yang membawa seseorang menurut dorongannya; “menyeretmu” mempertahankan daya metaforisnya tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: לִבֶּךָ
  choice: hatimu
  rationale: “Hati” menunjuk pada batin, termasuk pikiran dan perasaan. Padanan harfiah ini alami dan mempertahankan metafora Ibrani.
- source_word: וּמַה
  choice: dan mengapa
  rationale: Konjungsi וּ dipertahankan sebagai “dan”, sedangkan מַה secara idiomatis dipahami sebagai pertanyaan mengenai sebab atau dorongan.
- source_word: יִרְזְמוּן
  choice: memberi isyarat
  rationale: Kata kerja ini langka dan nuansanya tidak pasti. “Memberi isyarat” cukup luas untuk mencakup gerakan mata yang bermakna tanpa menetapkan secara pasti apakah mata itu berkedip, berkilat, atau berputar; alternatif penting dicantumkan dalam catatan kaki.
- source_word: עֵינֶיךָ
  choice: matamu
  rationale: Padanan langsung ini alami dalam bahasa Indonesia dan mempertahankan gambaran jasmani dari tuduhan Elifas.
