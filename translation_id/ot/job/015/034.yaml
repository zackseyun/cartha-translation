base_translation:
  language: en
  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: id
  text: Sebab kumpulan orang fasik itu mandul[a], dan api melalap kemah-kemah hasil suap[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kumpulan orang munafik itu mandul.” Kata Ibrani חָנֵף dapat berarti “munafik”, tetapi dalam kitab Ayub sering memiliki arti yang lebih luas, yaitu “fasik” atau “tidak takut kepada Allah”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “kemah-kemah suap” atau “kemah-kemah dari suap”. Ungkapan ini menunjuk pada tempat tinggal yang ditandai oleh keuntungan hasil korupsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan wacananya tanpa mempersempit nuansanya.
- source_word: עֲדַת
  choice: kumpulan
  rationale: Nomina ini menunjuk pada kelompok atau perhimpunan. “Kumpulan” alami dalam bahasa Indonesia dan tidak menimbulkan kesan khusus sebagai jemaat ibadah.
- source_word: חָנֵף
  choice: orang fasik
  rationale: Dalam kitab Ayub, kata ini biasanya menyatakan kefasikan atau sikap tidak takut kepada Allah, bukan sekadar kemunafikan sosial. Bentuk tunggalnya dipahami secara kolektif setelah עֲדַת.
- source_word: גַּלְמוּד
  choice: mandul
  rationale: Kata sifat ini menggambarkan keadaan tanpa hasil, keturunan, atau buah. “Mandul” mempertahankan metafora tajam dalam teks Ibrani.
- source_word: וְאֵשׁ
  choice: dan api
  rationale: Terjemahan langsung yang mempertahankan koordinasi kedua klausa dan gambaran konkret api.
- source_word: אָכְלָה
  choice: melalap
  rationale: Bentuk qatal di sini dapat menyatakan kenyataan umum secara hidup. “Melalap” merupakan padanan idiomatis bagi tindakan api yang memakan atau menghabiskan.
- source_word: אָהֳלֵי
  choice: kemah-kemah
  rationale: Mempertahankan gambaran konkret dan latar budaya teks, alih-alih menggeneralisasinya menjadi rumah atau tempat tinggal.
- source_word: שֹׁחַד
  choice: hasil suap
  rationale: Secara harfiah berarti “suap”. Dalam konstruksi “kemah-kemah suap”, hubungan maknanya eliptis; “hasil suap” menyampaikan bahwa tempat tinggal itu berkaitan dengan keuntungan korup tanpa menambahkan pelaku tertentu.
