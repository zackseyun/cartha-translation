  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: id
  text: Ia tidak akan luput dari kegelapan; nyala api akan mengeringkan tunasnya,[a] dan oleh embusan dari mulutnya ia akan lenyap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Tunasnya” mempertahankan gambaran tumbuhan: orang fasik digambarkan seperti pohon yang pertumbuhan mudanya hangus dan mengering.'
    reason: cultural_note
  - marker: b
    text: Atau, “dan oleh embusan dari mulut-Nya ia akan lenyap,” jika frasa terakhir dipahami merujuk kepada Allah, bukan kepada orang fasik.
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: luput dari kegelapan
  rationale: סור dengan מן menyatakan menjauh atau terlepas dari sesuatu. Dalam konteks malapetaka atas orang fasik, “luput dari kegelapan” alami dalam bahasa Indonesia dan menyampaikan ketidakmampuannya melepaskan diri tanpa menghilangkan citra kegelapan.
- source_word: יֹנַקְתּוֹ
  choice: tunas-tunasnya
  rationale: Nomina ini menunjuk pada tunas atau pucuk muda tanaman. Bentuk jamak kolektif dalam bahasa Indonesia mempertahankan gambaran orang fasik sebagai pohon dengan pertumbuhan muda yang hangus.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: nyala api akan mengeringkan
  rationale: Piel יבש berarti “mengeringkan” atau “melayukan,” sedangkan שַׁלְהֶבֶת berarti nyala api. Pilihan ini mempertahankan tindakan api terhadap gambaran tumbuhan.
- source_word: וְיָסוּר
  choice: ia akan lenyap
  rationale: Kata yang sama dapat berarti pergi, disingkirkan, atau berlalu. “Akan lenyap” menyampaikan akibat penghukuman secara wajar dalam konteks, sambil tetap memakai subjek maskulin tunggal.
- source_word: בְּרוּחַ פִּיו
  choice: oleh embusan mulutnya
  rationale: רוּחַ dapat berarti napas, angin, atau embusan. Bersama “mulutnya,” “embusan” mempertahankan citra konkret dan daya penghancur ungkapan itu tanpa menentukannya sebagai ucapan atau roh.
- source_word: פִּיו
  choice: mulutnya
  rationale: Akhiran orang ketiga maskulin tunggal paling dekat merujuk kepada orang fasik yang sedang dibicarakan. Bahasa Ibrani tidak menandai pergantian subjek secara eksplisit, sehingga rujukan kepada Allah dicatat sebagai kemungkinan alternatif.
theological_decisions:
- issue: Rujukan kata “mulutnya” dalam klausa terakhir
  choice: mulut orang fasik
  alternative: mulut Allah
  rationale: Secara sintaksis, anteseden terdekat ialah orang fasik tunggal yang dibicarakan. Namun, ungkapan tentang embusan mulut juga dapat dipahami sebagai gambaran penghukuman ilahi. Ketegangan ini dipertahankan melalui catatan kaki, bukan diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Luput” lebih alami daripada “menyimpang” untuk hubungan dengan kegelapan; “embusan mulutnya” mempertahankan ambiguitas רוּחַ dan rujukan pronominal dijelaskan dalam catatan.
