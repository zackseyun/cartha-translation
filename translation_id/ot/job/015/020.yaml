id: JOB.15.20
reference: Job 15:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל יְמֵ֣י רָ֭שָׁע ה֣וּא מִתְחוֹלֵ֑ל וּ/מִסְפַּ֥ר שָׁ֝נִ֗ים נִצְפְּנ֥וּ לֶ/עָרִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/020.yaml
  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: id
  text: Sepanjang hidupnya, orang fasik menggeliat dalam penderitaan[a], dan sejumlah tahun tersimpan[b] bagi orang yang kejam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terus menderita”; kata Ibrani ini dapat menggambarkan menggeliat, gemetar, atau menderita seperti orang yang sedang bersalin.
    reason: lexical_alternative
  - marker: b
    text: Atau “tersembunyi” atau “dicadangkan” bagi orang yang kejam.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Sepanjang hidupnya
  rationale: Ungkapan temporal total ini secara harfiah berarti 'seluruh hari-hari'; dalam bahasa Indonesia, 'sepanjang hidupnya' menyampaikan cakupan yang sama secara alami.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Adjektiva tunggal yang dipakai sebagai nomina menunjuk seorang pribadi sebagai tipe; 'orang fasik' mempertahankan ketunggalan tanpa membuat gender gramatikal Ibrani menjadi penekanan yang tidak alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: -nya
  rationale: Pronomina mandiri Ibrani bersifat resumtif atau memberi penegasan. Dalam susunan Indonesia, rujukan kepada subjek paling alami tercermin melalui bentuk posesif pada keterangan waktu, tanpa menambahkan 'dia' yang terasa kaku.
- source_word: מִתְחוֹלֵל
  choice: menggeliat dalam penderitaan
  rationale: Bentuk Hitpolel partisipial menggambarkan keadaan yang berlangsung dan dapat mencakup gerakan menggeliat serta derita seperti kesakitan bersalin. Terjemahan ini mempertahankan gambaran kuatnya, sementara catatan kaki mengakui rentang maknanya.
- source_word: וּמִסְפַּר שָׁנִים
  choice: dan sejumlah tahun
  rationale: Frasa ini menunjuk jangka waktu yang tertentu tetapi tidak disebutkan jumlahnya; 'sejumlah tahun' mempertahankan ketidakpastian tersebut.
- source_word: נִצְפְּנוּ
  choice: tersimpan
  rationale: Nifal dari צפן dapat berarti disembunyikan, disimpan, atau dicadangkan. 'Tersimpan' mempertahankan metafora tanpa menentukan apakah tekanannya pada ketersembunyian atau penetapan.
- source_word: לֶעָרִיץ
  choice: bagi orang yang kejam
  rationale: עָרִיץ menunjuk orang yang bengis, keras, atau menindas. 'Orang yang kejam' cocok dengan konteks hikmat dan tidak mempersempit maknanya menjadi penguasa politik.
theological_decisions:
- issue: Hubungan 'sejumlah tahun' dengan orang yang kejam
  choice: Mempertahankan ungkapan bahwa tahun-tahun itu 'tersimpan bagi' dia
  alternative: Menafsirkan frasa sebagai jumlah tahun yang telah ditentukan atau dibatasi baginya
  rationale: Teks Ibrani tidak menyatakan secara eksplisit apakah tahun-tahun itu dicadangkan sebagai masa hidup, masa penderitaan, atau ketetapan hukuman. Terjemahan tidak menyelesaikan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk tunggal representatif dipertahankan dengan 'orang fasik' dan 'orang yang kejam'. Susunan menghindari pengulangan pronomina yang kaku, tetapi tetap mempertahankan cakupan sepanjang hidup dan ambiguitas verba צפן.
