  text: He has lived in ruined cities[a], in houses where no one dwells, which were destined to become heaps.
translation:
  language: id
  text: Ia tinggal di kota-kota yang telah dihancurkan[a], di rumah-rumah yang tidak didiami, yang telah ditentukan untuk menjadi timbunan puing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia menetap di kota-kota yang telah dihancurkan, di rumah-rumah yang tidak mereka diami, yang telah disiapkan untuk menjadi timbunan puing.” Teks Ibrani ayat ini padat dan memungkinkan beberapa terjemahan yang maknanya berdekatan, khususnya pada bagian tengahnya.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: Ia tinggal
  rationale: Kata kerja שכן berarti ‘tinggal’ atau ‘menetap’. Bahasa Indonesia tidak mewajibkan penandaan kala, sehingga ‘tinggal’ mempertahankan bentuk yang lugas tanpa memaksakan hubungan waktu yang tidak dinyatakan secara pasti.
- source_word: עָרִים נִכְחָדוֹת
  choice: kota-kota yang telah dihancurkan
  rationale: Partisipel pasif נכחדות menggambarkan kota-kota yang telah dilenyapkan, dihancurkan, atau dijadikan tandus. Pilihan ini jelas dan selaras dengan gambaran rumah kosong serta timbunan puing.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: di rumah-rumah yang tidak didiami
  rationale: Ungkapan Ibrani ini padat dan pronomina לָמוֹ dapat dipahami dengan beberapa cara. Bentuk pasif tanpa pelaku menyampaikan gagasan utama bahwa rumah-rumah itu kosong, tanpa memaksakan rujukan pronomina yang tidak pasti.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: yang ditetapkan
  rationale: Bentuk Hitpael dari עתד dapat berarti ‘disiapkan’, ‘ditentukan’, atau ‘ditetapkan’. ‘Ditetapkan’ mempertahankan nuansa bahwa bangunan-bangunan itu diarahkan kepada keadaan tertentu.
- source_word: לְגַלִּים
  choice: untuk menjadi timbunan puing
  rationale: גַּלִּים menunjuk pada tumpukan atau timbunan, khususnya batu dan reruntuhan. ‘Timbunan puing’ menghadirkan gambaran konkret dan alami dalam bahasa Indonesia.
