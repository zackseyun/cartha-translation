  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: id
  text: 'Sebab kesalahanmu mengajari mulutmu,[a]

    dan engkau memilih lidah orang-orang licik.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kejahatanmu mengajari mulutmu” atau “rasa bersalahmu mengajari mulutmu.” Kata Ibrani עָוֹן dapat berarti kesalahan, kejahatan, atau keadaan bersalah, bergantung pada konteks.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bahasa orang-orang licik”; kata yang diterjemahkan “licik” juga dapat berarti “cerdik” atau “lihai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menunjukkan alasan yang mendasari tuduhan Elifas dalam konteks sebelumnya dan mempertahankan alur argumentasinya.
- source_word: יְאַלֵּף
  choice: mengajari
  rationale: Bentuk Piel dari אלף berarti mengajar atau melatih. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan personifikasi kesalahan sebagai pengajar ucapan Ayub.
- source_word: עֲוֺנְךָ
  choice: kesalahanmu
  rationale: עָוֹן dapat menunjuk pada kejahatan, kesalahan, atau keadaan bersalah. 'Kesalahanmu' mempertahankan daya moral tuduhan tanpa mempersempitnya hanya pada rasa bersalah subjektif.
- source_word: פִיךָ
  choice: mulutmu
  rationale: Terjemahan harfiah ini wajar dalam bahasa Indonesia dan mempertahankan citraan Ibrani tentang ucapan yang keluar dari mulut.
- source_word: וְתִבְחַר
  choice: dan engkau memilih
  rationale: Qal בחר berarti memilih. Bentuk orang kedua dan sifat langsung tuduhan dipertahankan.
- source_word: לְשׁוֹן
  choice: lidah
  rationale: Mempertahankan citraan puitis organ bicara dan kesejajarannya dengan 'mulut' pada baris pertama.
- source_word: עֲרוּמִים
  choice: orang-orang licik
  rationale: עָרוּם dapat berarti bijaksana atau cerdik secara positif maupun licik secara negatif. Dalam tuduhan Elifas, nuansa negatif paling sesuai.
theological_decisions:
- issue: Nuansa moral עָוֹן dalam tuduhan Elifas
  choice: '''kesalahanmu'''
  alternative: '''kejahatanmu'', ''dosamu'', atau ''rasa bersalahmu'''
  rationale: Istilah Ibrani mencakup perbuatan salah dan keadaan bersalah. 'Kesalahanmu' mempertahankan tuduhan moral sekaligus tidak memaksakan satu nuansa hukum atau psikologis saja.
- issue: Penilaian atas עֲרוּמִים
  choice: '''orang-orang licik'''
  alternative: '''orang-orang cerdik'' atau ''orang-orang lihai'''
  rationale: Konteksnya adalah tuduhan terhadap cara Ayub berbicara, sehingga nuansa manipulatif yang negatif perlu terdengar, tanpa mengubah perkataan Elifas menjadi penilaian narator.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme 'mulutmu' dan 'lidah' dipertahankan; 'engkau' dipakai untuk gaya kitab suci yang tetap mudah dipahami.
