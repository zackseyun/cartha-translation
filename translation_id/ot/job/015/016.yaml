  yaml_path: translation/ot/job/015/016.yaml
  text: how much less a man who is detestable and corrupt[b][a], who drinks injustice like water!
translation:
  language: id
  text: Apalagi manusia yang menjijikkan dan tercemar[a], yang meminum ketidakadilan[b] seperti air!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kotor” atau “busuk”; istilah Ibrani ini jarang dipakai dan menggambarkan keadaan yang tercemar atau busuk.
    reason: lexical_alternative
  - marker: b
    text: Atau “kelaliman,” “kejahatan,” atau “perbuatan salah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: apalagi
  rationale: Dalam konteks argumen a fortiori dari ayat sebelumnya, idiom ini berarti bahwa manusia jauh lebih tidak mungkin murni di hadapan Allah. “Apalagi” menyampaikan alur itu secara alami dan ringkas.
- source_word: נִתְעָב
  choice: menjijikkan
  rationale: Partisipel Nifal ini menggambarkan seseorang sebagai sesuatu yang menimbulkan rasa jijik atau muak; “menjijikkan” mempertahankan daya ungkap Ibrani.
- source_word: נֶאֱלָח
  choice: bejat
  rationale: Istilah langka ini menunjuk pada keadaan tercemar, kotor, atau rusak secara moral. “Bejat” jelas menyatakan keburukan moral, sedangkan alternatif “cemar” lebih dekat pada citra kenajisan.
- source_word: אִישׁ
  choice: manusia
  rationale: Walaupun nomina Ibrani berbentuk maskulin tunggal, di sini ia berfungsi secara representatif dalam pernyataan umum mengenai manusia; “manusia” alami dalam bahasa Indonesia dan tidak menghilangkan cakupan tersebut.
- source_word: שֹׁתֶה
  choice: yang meneguk
  rationale: Partisipel menunjukkan tindakan yang menjadi kebiasaan atau ciri. “Meneguk” mempertahankan metafora minum sekaligus menyiratkan tindakan yang dilakukan dengan mudah dan lahap.
- source_word: כַמַּיִם
  choice: seperti air
  rationale: Terjemahan langsung atas simile yang menggambarkan kelaliman dikonsumsi dengan mudah dan lazim.
- source_word: עַוְלָה
  choice: kelaliman
  rationale: Nomina ini mencakup ketidakadilan, kesalahan, dan kefasikan. “Kelaliman” mempertahankan bobot moralnya dan cocok sebagai objek metafora “meneguk,” tanpa memakai istilah teologis yang terlalu teknis.
theological_decisions:
- issue: Bahasa maskulin representatif
  choice: manusia
  alternative: seorang laki-laki
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi pernyataan ini bersifat representatif tentang manusia di hadapan Allah. Bahasa Indonesia secara alami memakai “manusia” untuk fungsi ini; terjemahan tidak memasukkan pembatasan khusus pada jenis kelamin laki-laki.
- issue: Makna moral עַוְלָה
  choice: kelaliman
  alternative: ketidakadilan; kejahatan; kefasikan
  rationale: Kata sumber dapat menunjuk pada ketidakadilan atau perbuatan salah secara lebih luas. “Kelaliman” mempertahankan keseriusan moral tanpa mempersempitnya menjadi istilah doktrinal tertentu; catatan kaki menjaga alternatif penting.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralel “menjijikkan dan bejat” mempertahankan dua gambaran kuat dalam bahasa Ibrani, sedangkan “meneguk ... seperti air” menjaga metafora dan kesan tindakan yang mudah serta habitual.
