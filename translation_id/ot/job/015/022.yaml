  source_fidelity: Klausa pertama secara tepat menyampaikan bahwa orang itu tidak mengharapkan/menaruh keyakinan bahwa ia akan kembali dari kegelapan. Klausa kedua Ibrani sulit; terjemahan utama “pedang menantinya” merupakan penyampaian idiomatis yang dapat dipertahankan atas kemungkinan makna ‘ia ditunggu/diawasi oleh pedang,’ tetapi catatan kaki perlu menyatakan alternatif-alternatif itu secara lebih akurat.
  naturalness: “Tidak berharap akan kembali” lebih idiomatis dan langsung daripada “tidak yakin akan kembali” dalam konteks pengharapan akan masa depan. Personifikasi “pedang menantinya” alami dalam register puitis Indonesia.
  terminology: “Kegelapan” dan “pedang” mempertahankan metafora Ibrani tanpa menafsirkan secara berlebihan. Istilah “kematian dengan kekerasan” dalam catatan kaki sebaiknya diperlunak menjadi “hukuman atau kematian yang keras,” karena ‘pedang’ dapat menunjuk pada penghakiman/kehancuran kekerasan dan bukan semata-mata cara kematian.
