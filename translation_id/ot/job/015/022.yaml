  yaml_path: translation/ot/job/015/022.yaml
  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: id
  text: Ia tidak berharap akan kembali dari kegelapan, dan pedang menantinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia ditunggu oleh pedang,” “ia diawasi oleh pedang,” atau “ia ditentukan bagi pedang.” Kata kerja Ibrani di sini sulit dipastikan; baris ini tampaknya menyatakan bahwa hukuman atau kematian yang keras sedang menantinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: tidak yakin
  rationale: Bentuk hiphil dari אמן dalam konteks ini menyatakan keyakinan atau pengharapan mengenai suatu hasil, bukan kepercayaan religius.
- source_word: שׁוּב
  choice: akan kembali
  rationale: Infinitif ini menyatakan isi dari keyakinannya; bentuk futuratif 'akan kembali' wajar dalam bahasa Indonesia.
- source_word: מִנִּי חֹשֶׁךְ
  choice: dari kegelapan
  rationale: Frasa ini menggambarkan keluar dari keadaan gelap, malapetaka, atau kesengsaraan tanpa mempersempit metaforanya.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: dan pedang menantinya
  rationale: Kata kerja צפה sulit ditafsirkan di sini. Dengan 'pedang' sebagai subjek yang dipersonifikasikan, terjemahan ini mempertahankan gagasan bahwa kematian dengan kekerasan sudah mengancam atau menunggu dia, sekaligus menghasilkan bahasa Indonesia yang alami.
