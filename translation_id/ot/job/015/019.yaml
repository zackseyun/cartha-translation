  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: id
  text: Hanya kepada merekalah negeri itu diberikan[a], dan tidak ada orang asing yang melintas di antara mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bumi itu" atau "tanah itu". Kata Ibrani אֶרֶץ dapat berarti bumi, tanah, atau negeri; dalam konteks ini, "negeri" lebih mungkin karena yang dimaksud ialah wilayah yang diberikan kepada suatu kelompok.
    reason: lexical_alternative
  - marker: b
    text: Atau "tidak ada orang asing yang melintas di tengah mereka."
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: Hanya kepada mereka
  rationale: Gabungan pronomina berpreposisi dan ungkapan eksklusif ini menegaskan bahwa pemberian itu ditujukan khusus kepada mereka. Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan Ibrani.
- source_word: נִתְּנָה
  choice: diberikan
  rationale: Bentuk Nifal menyatakan pasif; 'diberikan' mempertahankan bentuk tersebut tanpa menentukan pemberi yang tidak disebut dalam ayat.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: אֶרֶץ dapat berarti 'bumi', 'tanah', atau wilayah/negeri. Konteks pemberian wilayah kepada suatu kelompok dan tidak masuknya orang luar mendukung 'negeri itu', sementara kemungkinan 'bumi' dicatat dalam catatan kaki.
- source_word: וְלֹא עָבַר זָר
  choice: dan tidak ada orang asing yang melintas
  rationale: זָר menunjuk orang yang berada di luar kelompok, sedangkan עָבַר menggambarkan gerakan melewati atau melintasi. Ungkapan ini alami serta tidak mempersempit maknanya pada kebangsaan tertentu.
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Terjemahan ini dekat dengan makna harfiah 'di bagian tengah mereka' dan mempertahankan gambaran kehadiran di lingkungan komunitas mereka.
