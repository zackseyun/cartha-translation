id: JOB.15.15
reference: Job 15:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: id
  text: Sesungguhnya, bahkan kepada orang-orang kudus-Nya[a] Ia tidak menaruh kepercayaan, dan langit pun tidak murni di mata-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kudus-Nya”; dalam konteks ini kemungkinan besar yang dimaksud ialah makhluk-makhluk surgawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menegaskan pernyataan yang menyusul. “Sesungguhnya” alami dalam ragam Alkitab Indonesia yang bermartabat tanpa menjadi usang.
- source_word: בִּקְדֹשָׁיו
  choice: kepada orang-orang kudus-Nya
  rationale: Secara harfiah berarti “pada/kepada para kudus-Nya.” Bentuk umum ini mempertahankan keluasan ungkapan Ibrani dan tidak langsung menggantinya dengan “malaikat,” meskipun konteks sejajarnya menunjuk pada makhluk surgawi.
- source_word: לֹא יַאֲמִין
  choice: Ia tidak menaruh kepercayaan
  rationale: Bentuk Hifil dari אמן di sini menyatakan menaruh kepercayaan atau keyakinan kepada seseorang. Ungkapan ini mempertahankan nuansa relasionalnya.
- source_word: וְשָׁמַיִם
  choice: dan langit pun
  rationale: שָׁמַיִם berbentuk jamak dalam bahasa Ibrani, tetapi “langit” merupakan padanan kolektif yang alami dalam bahasa Indonesia. Partikel “pun” menyampaikan penguatan pada unsur kedua dalam paralelisme.
- source_word: לֹא זַכּוּ
  choice: tidak murni
  rationale: Dalam konteks ini זכה menunjuk pada kemurnian atau kebersihan, bukan terutama ketidakbersalahan yuridis.
- source_word: בְּעֵינָיו
  choice: di mata-Nya
  rationale: Mempertahankan gambaran harfiah Ibrani tentang penilaian dari sudut pandang Allah dan tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan “orang-orang kudus-Nya”
  choice: Mempertahankan ungkapan umum dalam teks utama, dengan catatan bahwa kemungkinan besar yang dimaksud ialah makhluk-makhluk surgawi.
  alternative: Menerjemahkan langsung sebagai “malaikat-malaikat-Nya” atau memahami ungkapan itu sebagai orang-orang saleh.
  rationale: Paralel dengan “langit” sangat mendukung acuan surgawi, tetapi kata Ibraninya sendiri tidak secara khusus berarti “malaikat.” Karena itu, terjemahan tidak mempersempit ambiguitas leksikal yang asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan puitis serta paralelisme dipertahankan; rujukan kepada Allah ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia.
