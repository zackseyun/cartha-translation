translation:
  language: id
  text: Kesusahan dan kesesakan membuatnya gentar; keduanya mengalahkannya seperti raja yang siap menyerang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti raja yang siap untuk pertempuran.” Kata Ibrani yang diterjemahkan “menyerang” sangat langka dan mungkin lebih khusus menunjuk pada serangan bersenjata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: membuatnya gentar
  rationale: Bentuk Piel menyatakan penyebab rasa takut atau kegentaran yang kuat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: צַר
  choice: kesusahan
  rationale: Nomina ini menunjuk pada keadaan terjepit, kesulitan, atau kesusahan. Pilihan ini sesuai dengan konteks tekanan berat dan membentuk pasangan puitis yang wajar.
- source_word: מְצוּקָה
  choice: kesesakan
  rationale: Kata ini menyatakan tekanan, keadaan terimpit, atau kesesakan. 'Kesesakan' mempertahankan citra tekanan dan membedakannya dari צַר.
- source_word: תִּתְקְפֵהוּ
  choice: keduanya menguasai dia
  rationale: Meskipun verba berbentuk feminin tunggal, dua nomina sebelumnya membentuk pasangan puitis. 'Keduanya' memperjelas subjek gabungan, sedangkan 'menguasai' menyampaikan daya תקף yang mengalahkan atau mencengkeram kuat.
- source_word: כְּמֶלֶךְ
  choice: seperti raja
  rationale: Menerjemahkan perbandingan secara langsung dan alami.
- source_word: עָתִיד
  choice: siap
  rationale: Dalam konteks ini kata tersebut menyatakan keadaan sudah dipersiapkan atau bersiap untuk tindakan.
- source_word: לַכִּידוֹר
  choice: menyerang
  rationale: כידור adalah kata langka dengan makna militer yang tidak pasti. Dalam perumpamaan ini, serangan bersenjata paling mungkin dimaksudkan; bentuk verbal 'menyerang' menghasilkan bahasa Indonesia yang alami.
