lexical_decisions:
- source_word: הוֹכֵחַ
  choice: berdebat
  rationale: Bentuk Hifil dari יכח dapat berarti berdebat, bernalar, atau menegur. Dalam konteks perdebatan Ayub, “berdebat” paling alami menggambarkan kecaman Elifas terhadap cara Ayub berbicara tanpa mempersempitnya menjadi teguran atau proses hukum.
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: dengan kata-kata yang tidak berguna
  rationale: דָבָר di sini menunjuk pada perkataan, sejalan dengan מִלִּים pada bagian berikutnya; סכן menyatakan kegunaan atau manfaat. Terjemahan ini mempertahankan paralelisme sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: וּמִלִּים
  choice: atau dengan ucapan
  rationale: מִלִּים secara harfiah berarti “kata-kata”. “Ucapan” menghindari pengulangan yang kaku, sedangkan “atau” menyampaikan hubungan dua bagian sejajar dalam pertanyaan retoris.
- source_word: לֹא יוֹעִיל בָּם
  choice: yang tidak membawa manfaat
  rationale: יועיל berarti mendatangkan manfaat, berguna, atau menolong, dan בם merujuk pada perkataan tersebut. Pilihan ini mempertahankan gagasan bahwa ucapan itu tidak menghasilkan kebaikan atau manfaat.
