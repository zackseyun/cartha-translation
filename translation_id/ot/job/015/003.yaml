    rationale: “Ucapan yang tidak membawa manfaat” menyampaikan hasil yang serupa, tetapi teks Ibrani menyatakan bahwa “ia” tidak memberi manfaat dengan kata-kata tersebut. Revisi mempertahankan unsur ini secara lebih dekat.
