    rationale: Waw Ibrani secara normal menghubungkan dua bagian paralel secara aditif. Dalam bahasa Indonesia, “dan” mempertahankan hubungan sumber dengan lebih tepat; pertanyaan retoris tidak mengharuskan perubahan menjadi “atau.”
