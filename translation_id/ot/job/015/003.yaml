  text: Apakah ia berdebat dengan perkataan yang tidak berguna[a], dan dengan kata-kata yang dengannya ia tidak dapat memberi manfaat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah ia akan bernalar dengan perkataan yang tidak bermanfaat, dan dengan kata-kata yang dengannya ia tidak dapat memberi manfaat?”'
