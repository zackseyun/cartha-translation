translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Citra tubuh yang keras dan konkret dipertahankan, tanpa mengubahnya secara eksplisit menjadi penjelasan moral seperti kemewahan atau pemanjaan diri.
