translation:
  language: id
  text: Sebab ia menutupi wajahnya dengan lemaknya dan membuat lipatan lemak pada pinggangnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab ia menutupi wajahnya dengan lemak dan membuat ketebalan lemak pada sisi tubuhnya.”'
    reason: פִּימָה adalah kata langka yang dapat menunjuk pada ketebalan atau lapisan lemak, sedangkan כֶּסֶל dapat berarti pinggang, pinggul, atau sisi tubuh.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal atau penjelas terhadap gambaran sebelumnya dan terdengar wajar dalam puisi Indonesia.
- source_word: כִסָּה
  choice: menutupi
  rationale: Menyampaikan arti konkret ‘menutup, menyelubungi’ tanpa menambahkan penafsiran di luar citra tubuh.
- source_word: פָנָיו
  choice: wajahnya
  rationale: Makna anatomis konkret paling sesuai dengan paralelisme tentang tubuh dalam ayat ini.
- source_word: בְּחֶלְבּוֹ
  choice: dengan lemaknya
  rationale: Mempertahankan metafora konkret tentang lemak dan unsur pronominal ‘-nya’, bukan mengabstrakkannya menjadi kemakmuran atau pemanjaan diri.
- source_word: וַיַּעַשׂ
  choice: menimbun
  rationale: Dalam kolokasi ini, ‘menimbun’ merupakan ungkapan Indonesia yang alami untuk tindakan menghasilkan atau menambahkan timbunan lemak, meskipun arti dasar verba ini ialah ‘membuat/melakukan’.
- source_word: פִּימָה
  choice: lemak
  rationale: Nomina langka ini menunjuk pada kegemukan, ketebalan, atau lapisan lemak. ‘Lemak’ menjaga citra utama secara ringkas; kemungkinan ‘lipatan-lipatan lemak’ dicatat dalam catatan kaki.
- source_word: עֲלֵי
  choice: pada
  rationale: Padanan lokatif yang alami dalam bahasa Indonesia modern.
- source_word: כָסֶל
  choice: pinggangnya
  rationale: כֶּסֶל dapat menunjuk bagian pinggang atau sisi tubuh. ‘Pinggang’ mudah dipahami dan tetap cukup dekat dengan gambaran anatomis Ibrani; alternatif ‘sisi tubuh’ dicatat.
