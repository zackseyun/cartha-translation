base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: id
  text: Janganlah ia memercayai kesia-siaan[a] dalam keadaan terperdaya,[b] sebab kesia-siaan akan menjadi balasannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kesia-siaan” juga dapat berarti “kehampaan”, “kepalsuan”, atau “sesuatu yang tidak bernilai”. Kata Ibrani yang sama diulangi dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Janganlah orang yang tersesat memercayai kesia-siaan.” Bentuk Ibrani ini juga dapat berarti “tersesat” atau “disesatkan”; teksnya tidak secara tegas menyatakan bahwa ia menipu dirinya sendiri.
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: Janganlah ia memercayai
  rationale: Partikel negatif אַל dengan bentuk verbal ini menyampaikan larangan atau peringatan. Verba Hifil dari אמן di sini berarti menaruh kepercayaan, yang secara alami dinyatakan dengan verba transitif “memercayai” dalam bahasa Indonesia.
- source_word: בַשָּׁוְא / שָׁוְא
  choice: kesia-siaan
  rationale: שָׁוְא dapat menunjuk pada kesia-siaan, kehampaan, kepalsuan, atau sesuatu yang tidak bernilai. “Kesia-siaan” mempertahankan keluasan citra puitisnya, dan pilihan yang sama dipakai pada kedua kemunculan untuk menjaga pengulangan Ibrani.
- source_word: נִתְעָה
  choice: sambil menipu dirinya sendiri
  rationale: Bentuk Nifal dari תעה dapat berarti tersesat, disesatkan, atau terperdaya. Dalam hubungan deskriptif dengan subjek, ungkapan ini menyampaikan keadaan orang yang menaruh kepercayaan pada kesia-siaan dan menipu dirinya sendiri; catatan kaki mempertahankan kemungkinan sintaksis dan nuansa pasif lainnya.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi peringatan pada baris pertama.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: akan menjadi imbalannya
  rationale: תְּמוּרָה berarti pertukaran, pengganti, atau sesuatu yang diterima sebagai balasan. “Imbalannya” menyatakan hasil yang diperoleh tanpa harus memberi nuansa hukuman formal yang tidak diwajibkan oleh katanya.
theological_decisions:
- issue: Pelaku dan nuansa נִתְעָה
  choice: Teks utama menggambarkannya sebagai menipu diri sendiri.
  alternative: “Janganlah orang yang tersesat memercayai kesia-siaan” atau “dalam keadaan terperdaya.”
  rationale: Bentuk Ibrani memungkinkan nuansa tersesat, disesatkan, atau terperdaya, dan susunannya dapat dibaca sebagai keterangan tentang subjek. Ambiguitas itu tidak dijadikan pernyataan doktrinal tentang sumber penyesatan, tetapi dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Pengulangan “kesia-siaan” dipertahankan untuk mencerminkan daya retoris teks Ibrani; “imbalan” dipilih sebagai kata yang umum dan bermartabat.
