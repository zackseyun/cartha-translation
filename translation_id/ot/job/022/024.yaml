  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: id
  text: dan taruhlah emas di atas debu[a], serta emas Ofir[c] di antara bebatuan di alur-alur sungai musiman[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “taruhlah bijih emas di atas debu.” Istilah Ibrani ini dapat menunjuk pada logam berharga atau bijihnya, bukan hanya emas yang telah dimurnikan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah alur sungai atau lembah aliran yang biasanya kering, tetapi dialiri air deras pada musim hujan; dapat juga diterjemahkan “aliran-aliran deras” atau “lembah-lembah sungai.”
    reason: cultural_note
  - marker: c
    text: Ofir adalah tempat yang terkenal karena emasnya yang bermutu tinggi; karena itu, nama “Ofir” di sini dipahami sebagai “emas Ofir.”
    reason: cross_reference
lexical_decisions:
- source_word: וְשִׁית
  choice: dan taruhlah
  rationale: Kata kerja שׁית berarti menaruh, meletakkan, atau menempatkan. Bentuk imperatif dan waw penghubung dipertahankan secara alami sebagai “dan taruhlah”.
- source_word: עַל עָפָר
  choice: di dalam debu
  rationale: Secara harfiah עַל berarti “di atas,” tetapi dalam gambaran pembuangan harta, ungkapan “di dalam debu” lebih wajar dalam bahasa Indonesia dan tetap mempertahankan citra konkret debu atau tanah gembur.
- source_word: בָּצֶר
  choice: emas
  rationale: Istilah ini dapat menunjuk pada logam berharga, khususnya emas atau bijih emas. “Emas” paling jelas dalam kesejajaran dengan Ofir, sementara kemungkinan “bijih emas” dicatat dalam catatan kaki.
- source_word: וּבְצוּר נְחָלִים
  choice: di antara batu-batu dasar sungai musiman
  rationale: צוּר berarti batu atau cadas, sedangkan נְחָלִים dapat berarti aliran deras, lembah sungai, atau wadi. Frasa ini menyampaikan gambaran emas yang diletakkan di antara bebatuan pada dasar aliran musiman.
- source_word: אוֹפִיר
  choice: emas Ofir
  rationale: Ofir adalah nama tempat yang terkenal sebagai sumber emas bermutu tinggi. Dalam kesejajaran puisi, nama tempat itu secara metonimis menunjuk pada emas Ofir.
theological_decisions:
- issue: Daya perintah ayat dalam nasihat Elifas
  choice: Menggambarkan tindakan melepaskan ketergantungan pada kekayaan duniawi dengan menaruh emas dalam debu dan di antara bebatuan dasar sungai.
  alternative: Perintah untuk menyimpan emas dengan aman di tempat alami.
  rationale: Konteks ayat 24–25 mengarahkan gambaran ini pada penyingkiran harta sebagai sandaran agar Yang Mahakuasa menjadi harta sejati. Namun terjemahan mempertahankan tindakan konkret “taruhlah” dan tidak menambahkan kata seperti “buanglah,” sehingga ketegangan dalam citra Ibrani tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Dasar sungai musiman” dipilih agar makna wadi dapat dipahami pembaca umum tanpa memakai istilah serapan yang kurang lazim. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
