  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: id
  text: Dapatkah manusia memberi manfaat kepada Allah? Dapatkah orang yang berpengertian memberi manfaat kepada-Nya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dapatkah manusia menguntungkan Allah? Dapatkah orang yang bijaksana menguntungkan-Nya?” Secara harfiah, klausa kedua melanjutkan pertanyaan retoris yang sama.'
    reason: Mencatat padanan alternatif untuk סכן dan מַשְׂכִּיל serta menjelaskan bahwa kata ganti Ibrani merujuk kepada Allah, bukan kepada orang itu sendiri.
lexical_decisions:
- source_word: הַלְאֵל
  choice: Dapatkah ... kepada Allah?
  rationale: Partikel tanya הֲ dan לְאֵל membentuk pertanyaan retoris tentang apakah manusia dapat mendatangkan manfaat bagi Allah. Susunan ini alami dalam bahasa Indonesia dan mempertahankan Allah sebagai pihak yang menerima manfaat.
- source_word: יִסְכָּן / יִסְכֹּן
  choice: memberi manfaat
  rationale: Dalam konteks ini, verba סכן berarti berguna atau menguntungkan. “Memberi manfaat” jelas, alami, dan dapat dipakai secara sejajar pada kedua anak kalimat tanpa memberi kesan komersial yang terlalu kuat.
- source_word: גָּבֶר
  choice: manusia
  rationale: Nomina maskulin tunggal ini dipakai secara representatif untuk seorang manusia. “Manusia” menyampaikan acuan generiknya secara wajar dalam bahasa Indonesia tanpa mengubah pokok perbandingan antara manusia dan Allah.
- source_word: כִּי
  choice: Sesungguhnya
  rationale: כִּי di sini dapat bersifat menegaskan atau menjelaskan. “Sesungguhnya” mempertahankan daya penegasnya dan alur retoris ayat, sementara kemungkinan nuansa kausal dicatat dalam catatan kaki.
- source_word: עָלֵימוֹ
  choice: kepada dirinya sendiri
  rationale: Dalam konteks paralelisme ini, ungkapan tersebut menunjuk pada manfaat yang kembali kepada orang berakal budi itu sendiri. Bentuk refleksif membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: מַשְׂכִּיל
  choice: orang yang berakal budi
  rationale: Partisip substantival dari שכל menunjuk kepada orang yang memiliki pengertian atau bertindak dengan bijaksana. “Berakal budi” mempertahankan unsur pengertian sekaligus kebijaksanaan praktis.
theological_decisions:
- issue: Apakah manusia dapat menambahkan sesuatu yang bermanfaat kepada Allah
  choice: Pertanyaan pertama diterjemahkan sebagai pertanyaan retoris, lalu anak kalimat kedua menyatakan bahwa manfaat akal budi kembali kepada manusia itu sendiri.
  alternative: Anak kalimat kedua dapat dibaca lebih umum sebagai penjelasan bahwa orang berpengertian menguntungkan dirinya sendiri, tanpa penekanan kontras yang kuat.
  rationale: Paralelisme Ibrani menempatkan Allah dan diri manusia dalam hubungan kontras, tetapi terjemahan tidak memperluas pernyataan ini menjadi rumusan doktrinal di luar cakupan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Memberi manfaat” dipilih agar mudah dipahami pembaca umum, sedangkan “berakal budi” menjaga corak sastra hikmat tanpa terdengar usang.
