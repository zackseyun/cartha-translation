  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: id
  text: Engkau akan berdoa kepada-Nya, dan Dia akan mendengarkanmu, dan engkau akan menunaikan nazar-nazarmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: Engkau akan berdoa
  rationale: Bentuk Hifil dari עתר berarti memohon atau berdoa dengan sungguh-sungguh. Dalam konteks ini, “berdoa” merupakan ungkapan Indonesia modern yang paling alami dan tetap mempertahankan sifat permohonannya.
- source_word: אֵלָיו
  choice: kepada-Nya
  rationale: Frasa ini secara harfiah berarti “kepada dia”; acuannya adalah Allah dalam konteks langsung. Kapitalisasi pronomina mengikuti kelaziman bahasa Indonesia untuk rujukan kepada Allah tanpa mengulang nama-Nya.
- source_word: וְיִשְׁמָעֶךָּ
  choice: dan Dia akan mendengarkanmu
  rationale: שׁמע berarti mendengar atau mendengarkan. “Mendengarkanmu” menyampaikan perhatian terhadap doa tanpa memperluas makna menjadi “mengabulkan” atau “menjawab”.
- source_word: וּנְדָרֶיךָ
  choice: lalu ... nazar-nazarmu
  rationale: נֶדֶר menunjuk pada nazar yang diucapkan kepada Allah. Bentuk jamak dengan sufiks orang kedua diterjemahkan langsung sebagai “nazar-nazarmu”.
- source_word: תְשַׁלֵּם
  choice: engkau akan memenuhi
  rationale: Bentuk Piel dari שלם bersama “nazar” merupakan idiom untuk membayar atau menunaikan nazar. “Memenuhi” jelas dalam bahasa Indonesia modern dan tidak menimbulkan kesan pembayaran uang.
theological_decisions:
- issue: Apakah klausa terakhir diterjemahkan secara lebih harfiah sebagai “membayar nazar-nazarmu” atau secara idiomatis sebagai “memenuhi nazar-nazarmu”
  choice: memenuhi nazar-nazarmu
  alternative: membayar nazar-nazarmu; menunaikan nazar-nazarmu
  rationale: Ungkapan Ibrani menunjuk pada pelaksanaan kewajiban yang telah dinazarkan kepada Allah. “Memenuhi” mempertahankan maknanya secara wajar dalam bahasa Indonesia dan tidak menambahkan rincian kultis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti orang kedua tunggal “engkau” dipakai sesuai gaya sastra kitab Ayub. Penghubung “lalu” mencerminkan kelanjutan yang tersirat dalam rangkaian waw Ibrani tanpa memaksakan hubungan sebab-akibat.
