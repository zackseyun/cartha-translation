base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: id
  text: Namun, Dialah yang memenuhi rumah-rumah mereka dengan segala yang baik[a], sedangkan nasihat orang fasik jauh dariku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dengan yang baik”; dalam konteks ini dapat juga berarti “dengan kemakmuran.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “biarlah nasihat orang fasik jauh dariku.” Namun, bahasa Ibraninya lebih langsung berbentuk pernyataan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Namun, Dialah
  rationale: Kata sambung bersama pronomina menandai kontras dengan sikap orang fasik pada ayat sebelumnya. Bentuk "Dialah" mempertahankan subjek eksplisit dan penekanannya, dengan rujukan kepada Allah.
- source_word: מִלֵּא
  choice: memenuhi
  rationale: Verba ini berarti "memenuhi". Dalam puisi Ibrani, bentuk perfektif dapat menyatakan tindakan yang dipandang utuh tanpa harus dipaksa menjadi kala lampau dalam bahasa Indonesia.
- source_word: בָתֵּיהֶם
  choice: rumah-rumah mereka
  rationale: Terjemahan konkret dan dekat dengan bentuk jamak Ibrani; konteksnya menunjuk pada kehidupan serta kemakmuran mereka.
- source_word: טוֹב
  choice: dengan hal-hal yang baik
  rationale: Kata "baik" dipakai secara substantival. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi kemakmuran saja.
- source_word: וַעֲצַת
  choice: tetapi nasihat
  rationale: Kata sambung diterjemahkan secara adversatif karena klausa kedua menyatakan pemisahan pembicara dari nasihat orang fasik. עֵצָה dapat berarti nasihat, rancangan, atau pertimbangan.
- source_word: רְשָׁעִים
  choice: orang fasik
  rationale: Padanan baku dan bermartabat bagi bentuk jamak substantival yang menunjuk kepada orang-orang yang jahat secara moral.
- source_word: רָחֲקָה מֶנִּי
  choice: jauh dariku
  rationale: Bentuk qatal paling langsung dibaca sebagai pernyataan bahwa nasihat itu jauh dari pembicara, bukan sebagai perintah atau permohonan.
theological_decisions:
- issue: Sikap pembicara dalam klausa terakhir
  choice: 'Pernyataan: "nasihat orang fasik jauh dariku"'
  alternative: 'Harapan atau penolakan: "biarlah nasihat orang fasik jauh dariku"'
  rationale: Teks Ibrani memakai bentuk qatal, bukan imperatif atau bentuk yusif. Pernyataan langsung mempertahankan ketegangan teks tanpa mengubahnya menjadi doa atau seruan.
- issue: Identitas subjek וְהוּא
  choice: Allah, dinyatakan dengan "Dialah"
  alternative: Pronomina biasa "dia" tanpa penekanan
  rationale: Konteks langsung mengacu kepada Allah sebagai pihak yang memenuhi rumah mereka; kapitalisasi dan bentuk emfatis membantu memperjelas rujukan tanpa menambah nama yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Citra konkret "rumah-rumah" dipertahankan, sedangkan ambiguitas semantis pada "yang baik" dan kemungkinan pembacaan klausa terakhir dicatat dalam catatan kaki.
