id: JOB.22.3
reference: Job 22:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: id
  text: Apakah Yang Mahakuasa mendapat kesenangan[a] karena engkau benar, atau mendapat keuntungan[b] karena engkau membuat jalan hidupmu tak bercela?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kegembiraan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: laba atau manfaat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: mendapat kesenangan
  rationale: חֵפֶץ dapat berarti kesenangan, kegembiraan, atau keinginan. Dalam pertanyaan retoris ini, “mendapat kesenangan” terdengar alami dan mempertahankan gagasan tentang sesuatu yang menyenangkan bagi Allah.
- source_word: לְשַׁדַּי
  choice: Yang Mahakuasa
  rationale: שַׁדַּי adalah gelar ilahi yang secara wajar diterjemahkan “Yang Mahakuasa” dalam kitab Ayub; unsur preposisional לְ diungkapkan secara idiomatis melalui konstruksi “mendapat kesenangan”.
- source_word: כִּי תִצְדָּק
  choice: karena engkau benar
  rationale: Bentuk Qal dari צדק paling wajar berarti “benar” atau “berada di pihak yang benar”, bukan tindakan membenarkan diri. “Engkau benar” mempertahankan keluasan maknanya.
- source_word: וְאִם
  choice: atau
  rationale: Dalam kesejajaran dua pertanyaan retoris, וְאִם memperkenalkan kemungkinan kedua dan paling alami diterjemahkan “atau”.
- source_word: בֶּצַע
  choice: keuntungan
  rationale: בֶּצַע menunjuk pada keuntungan, laba, atau manfaat. “Keuntungan” mempertahankan metafora manfaat ekonomis dan mudah dipahami.
- source_word: כִּי תַתֵּם
  choice: karena engkau membuat ... tak bercela
  rationale: Bentuk Hifil dari תמם menyatakan tindakan menjadikan lengkap, utuh, atau tak bercela. Konstruksi ini mempertahankan unsur kausatif dan nuansa moralnya.
- source_word: דְּרָכֶיךָ
  choice: jalan hidupmu
  rationale: Bentuk jamak דְּרָכֶיךָ secara metaforis menunjuk pada perilaku atau cara hidup. “Jalan hidupmu” mempertahankan metafora Ibrani sekaligus alami dalam bahasa Indonesia modern.
- source_word: תַתֵּם דְּרָכֶיךָ
  choice: engkau membuat jalan hidupmu tak bercela
  rationale: Ungkapan ini menggambarkan tindakan menjadikan perilaku seseorang utuh atau tanpa cela. Terjemahan ini mempertahankan bentuk aktif-kausatif tanpa mengurangi nuansa etisnya.
theological_decisions:
- issue: Apakah ayat ini menyiratkan bahwa kebenaran manusia memberikan manfaat hakiki kepada Allah
  choice: Pertanyaan retoris diterjemahkan sebagai pernyataan Elifas bahwa Yang Mahakuasa tidak memperoleh kesenangan atau keuntungan bagi diri-Nya dari kebenaran Ayub.
  alternative: Memahami pertanyaan pertama secara lebih lunak sebagai penekanan bahwa Allah tidak membutuhkan kebenaran manusia, tanpa menyangkal bahwa Dia berkenan pada kebenaran.
  rationale: Teks Ibrani memakai istilah kesenangan dan keuntungan dalam pertanyaan retoris. Terjemahan mempertahankan daya argumentasi Elifas tanpa mengubah ucapannya menjadi pernyataan teologis universal bahwa Allah sama sekali tidak berkenan pada kebenaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” sesuai dengan dialog langsung dalam sastra hikmat. “Jalan hidupmu” mempertahankan metafora sumber sambil memperjelas bahwa yang dimaksud ialah perilaku.
