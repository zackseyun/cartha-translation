base_translation:
  language: en
  yaml_path: translation/ot/job/022/023.yaml
  text: If you return to the Almighty[a], you will be restored; if you put unrighteousness far from your tent[b],
translation:
  language: id
  text: Jika engkau kembali kepada Yang Mahakuasa, engkau akan dipulihkan[a]; jika engkau menjauhkan kejahatan[b] dari kemahmu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan dibangun kembali” atau “akan ditegakkan kembali.” Kata kerja Ibrani secara harfiah berarti “dibangun” dan di sini dipakai sebagai gambaran pemulihan atau penegakan kembali.
    reason: lexical_alternative
  - marker: b
    text: Atau “perbuatan salah” atau “ketidakadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Menandai klausa bersyarat secara langsung dan alami dalam bahasa Indonesia.
- source_word: תָּשׁוּב
  choice: engkau kembali
  rationale: Kata kerja שׁוב pada dasarnya berarti berbalik atau kembali. Pilihan ini mempertahankan gambaran gerak menuju Allah tanpa mempersempitnya menjadi istilah teologis 'bertobat'.
- source_word: עַד
  choice: kepada
  rationale: Bersama kata kerja 'kembali', preposisi ini menunjukkan arah atau tujuan menuju Allah.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi שַׁדַּי dengan bentuk baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: תִּבָּנֶה
  choice: engkau akan dipulihkan
  rationale: Bentuk Nifal dari בנה secara harfiah berarti 'dibangun' atau 'dibangun kembali'. Dalam konteks ini, 'dipulihkan' menyampaikan makna kiasan berupa pemulihan atau penegakan kembali sambil mempertahankan bentuk pasif.
- source_word: תַּרְחִיק
  choice: engkau menjauhkan
  rationale: Bentuk Hifil ini berarti menyebabkan sesuatu menjadi jauh. 'Menjauhkan' mempertahankan daya kausatifnya secara alami.
- source_word: עַוְלָה
  choice: kejahatan
  rationale: Kata ini mencakup perbuatan salah, ketidakadilan, dan ketidakbenaran moral. 'Kejahatan' jelas dan wajar dalam konteks nasihat moral ini, sementara pilihan yang lebih khusus dicatat dalam catatan kaki.
- source_word: מֵאָהֳלֶךָ
  choice: dari kemahmu
  rationale: Terjemahan harfiah ini mempertahankan citra budaya teks, meskipun 'kemah' juga dapat mewakili tempat tinggal atau rumah tangga seseorang.
theological_decisions:
- issue: Apakah metafora pembangunan diterjemahkan secara harfiah atau menurut maknanya
  choice: engkau akan dipulihkan
  alternative: engkau akan dibangun kembali; engkau akan ditegakkan kembali
  rationale: Metafora Ibrani menggambarkan seseorang sebagai sesuatu yang dibangun atau ditegakkan kembali. 'Dipulihkan' menyampaikan maksudnya secara alami tanpa menghapus alternatif harfiahnya, yang dicatat dalam catatan kaki.
- issue: Apakah שׁוב diterjemahkan sebagai 'kembali' atau 'bertobat'
  choice: kembali
  alternative: bertobat; berbalik kembali
  rationale: '''Kembali'' mempertahankan arti dasar kata Ibrani dan membiarkan implikasi pertobatan muncul dari konteks, bukan dimasukkan secara eksplisit ke dalam kata tersebut.'
- issue: Hubungan klausa kedua dengan syarat pertama
  choice: jika engkau menjauhkan
  alternative: dan engkau menjauhkan
  rationale: Teks Ibrani tidak mengulang אִם sebelum תַּרְחִיק, tetapi klausa tersebut paling wajar dipahami sebagai syarat sejajar yang masih berada dalam cakupan 'jika'. Pengulangan 'jika' dalam bahasa Indonesia memperjelas hubungan sintaksis tanpa mengubah isinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'engkau' dipakai untuk sapaan tunggal dalam wacana sastra Alkitab. 'Kemah' dipertahankan agar citra sumber tidak diganti dengan 'rumah' atau 'rumah tangga'. Tanda koma penutup mempertahankan kesinambungan sintaksis dengan ayat berikutnya.
