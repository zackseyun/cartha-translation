  text: Will you keep to the ancient path that men of wickedness have trodden?[a][b]
translation:
  language: id
  text: Apakah engkau akan mengikuti jalan dari zaman dahulu[a] yang telah ditempuh orang-orang jahat?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan purbakala” atau “jalan dari zaman dahulu.” Ungkapan Ibrani ini menunjuk pada jalan yang telah lama ditempuh pada masa lampau, bukan dengan sendirinya pada jalan yang kekal.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang kejahatan.” Dapat juga diterjemahkan “orang-orang fasik” atau “orang-orang lalim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֹרַח
  choice: jalan
  rationale: Kata אֹרַח menunjuk pada jalan atau lintasan, dan di sini secara kiasan menggambarkan cara hidup. “Jalan” alami dalam bahasa Indonesia sekaligus mempertahankan gambaran aslinya.
- source_word: עוֹלָם
  choice: sejak dahulu
  rationale: Dalam konteks ini עוֹלָם menunjuk pada masa lampau yang jauh, bukan pada kekekalan. Frasa “jalan sejak dahulu” menyampaikan bahwa jalan itu sudah ditempuh pada masa silam.
- source_word: תִּשְׁמֹר
  choice: akan tetap mengikuti
  rationale: Kata שׁמר pada dasarnya berarti menjaga atau memelihara. Jika objeknya adalah “jalan”, ungkapan ini berarti berpegang pada atau terus mengikuti suatu cara hidup.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini memperkenalkan klausa yang menerangkan jalan tersebut.
- source_word: דָּרְכוּ
  choice: telah ditempuh
  rationale: Bentuk dari דרך berarti menginjak, menapaki, atau berjalan. “Telah ditempuh” mempertahankan citra jalan dan menyatakan tindakan orang-orang pada masa lampau.
- source_word: מְתֵי אָוֶן
  choice: orang-orang jahat
  rationale: Ungkapan ini secara harfiah berarti “orang-orang kejahatan/kelaliman”. “Orang-orang jahat” menyampaikan penilaian moral dalam konteks secara jelas dan wajar.
