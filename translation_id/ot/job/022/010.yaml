  yaml_path: translation/ot/job/022/010.yaml
  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: id
  text: Karena itu, jerat-jerat mengelilingimu, dan kengerian tiba-tiba membuatmu gentar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan ini menyatakan kesimpulan atau akibat dari tuduhan sebelumnya; “Karena itu” mempertahankan daya inferensialnya secara alami dalam bahasa Indonesia.
- source_word: סְבִיבוֹתֶיךָ פַחִים
  choice: jerat-jerat mengelilingimu
  rationale: פַחִים berarti jerat atau perangkap, sedangkan סְבִיבוֹתֶיךָ menunjukkan keberadaan di sekeliling orang yang disapa. Susunan ini alami sekaligus mempertahankan gambaran bahaya yang mengepung.
- source_word: וִיבַהֶלְךָ
  choice: membuatmu gentar
  rationale: Bentuk dari בהל menyatakan tindakan mengejutkan, menggentarkan, atau membuat panik. “Membuatmu gentar” menyampaikan dampak rasa takut tanpa melebihkan maknanya.
- source_word: פַּחַד
  choice: kengerian
  rationale: Kata ini dapat berarti ketakutan, kegentaran, atau kengerian. “Kengerian” sesuai dengan intensitas konteks ancaman.
- source_word: פִּתְאֹם
  choice: tiba-tiba
  rationale: 'Adverbia ini berarti “dengan mendadak.” Penempatannya mempertahankan keluwesan puitis: kengerian itu dapat dipahami sebagai datang mendadak atau mendadak membuat orang tersebut gentar.'
