  text: who were snatched away before their time[c][b][a], whose foundation was washed away by a river.
translation:
  language: id
  text: yang direnggut sebelum waktunya[a], yang fondasinya dihanyutkan oleh sungai.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang ditebang sebelum waktunya.” Verba Ibrani ini sulit dan dapat mengandung gagasan direnggut, mengerut, atau disingkirkan secara tiba-tiba.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, susunan Ibraninya dapat dipahami sebagai “fondasinya tercurah menjadi atau seperti aliran.” Gambaran ini padat dan juga dapat dipahami bahwa fondasi itu dilanda atau dihanyutkan oleh sungai.
    reason: lexical_alternative
  - marker: c
    text: Ayat ini mungkin secara khusus menyinggung generasi yang dibinasakan oleh Air Bah, atau secara lebih umum menggambarkan keruntuhan mendadak orang fasik.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini melanjutkan gambaran tentang orang-orang fasik dalam konteks sebelumnya; “yang” merupakan penghubung alami dalam bahasa Indonesia.
- source_word: קֻמְּטוּ
  choice: direnggut
  rationale: Bentuk pasifnya menggambarkan mereka yang tiba-tiba disingkirkan. “Direnggut” menyampaikan kematian atau kebinasaan mendadak tanpa membatasi verba sulit ini pada gambaran fisik “mengisut”.
- source_word: וְלֹא עֵת
  choice: sebelum waktunya
  rationale: Ungkapan ini secara alami menyatakan akhir yang datang terlalu dini; terjemahan tersebut jelas dan idiomatis dalam bahasa Indonesia.
- source_word: נָהָר
  choice: sungai
  rationale: Makna biasa nomina ini ialah “sungai”. Pilihan ini mempertahankan citra konkret tanpa langsung menafsirkannya sebagai Air Bah.
- source_word: יוּצַק
  choice: dihanyutkan
  rationale: Verba ini secara harfiah berkaitan dengan tindakan menuang atau mencurahkan. Dalam susunan puitis yang padat ini, “dihanyutkan” menyampaikan bahwa fondasi itu dilanda atau tersapu oleh air, sambil memberi catatan tentang bentuk harfiahnya.
- source_word: יְסוֹדָם
  choice: fondasinya
  rationale: Nomina tunggal dengan akhiran orang ketiga jamak berarti fondasi milik mereka; bahasa Indonesia lazim memakai bentuk tunggal “fondasinya” sebagai gambaran dasar penopang mereka.
theological_decisions:
- issue: Sifat gambaran penghukuman
  choice: Mempertahankan gambaran orang fasik yang binasa sebelum waktunya dan fondasinya dilanda sungai, tanpa menentukan apakah ini secara khusus merujuk kepada generasi Air Bah atau merupakan metafora umum.
  alternative: Menafsirkannya secara tegas sebagai rujukan historis kepada generasi Air Bah, atau semata-mata sebagai metafora keruntuhan mendadak.
  rationale: Konteks mengingat orang-orang fasik pada masa lampau dan memakai citra kehancuran oleh air, tetapi teks Ibrani sendiri tidak mengharuskan salah satu penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Direnggut” mempertahankan daya puitis kebinasaan mendadak, sedangkan “fondasi” dan “sungai” menjaga metafora konkret serta ambiguitas historis-teologis teks.
