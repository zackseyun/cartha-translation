  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: id
  text: Sungguh, para lawan kita[a] telah dilenyapkan, dan api telah menghanguskan sisa mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani קִימָנוּ sulit dipastikan. Kata ini dapat dipahami sebagai “para lawan kita,” seperti dalam teks utama, atau mungkin sebagai “harta milik kita.”
    reason: alternative_reading
  - marker: b
    text: Atau “kelimpahan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Sungguh
  rationale: Ungkapan ini berfungsi sebagai penegasan, bukan sebagai syarat yang nyata. “Sungguh” menyampaikan tekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: נִכְחַד
  choice: telah dilenyapkan
  rationale: 'Bentuk Nifal menyatakan keadaan pasif atau hasil: dihapuskan, dimusnahkan, atau dilenyapkan. Pilihan ini mempertahankan daya pasif-resultatifnya.'
- source_word: קִימָנוּ
  choice: para lawan kita
  rationale: Bentuk Ibrani ini sulit dan dapat dipahami dengan beberapa cara. Dalam kesejajaran dengan klausa mengenai sisa mereka yang dihanguskan api, rujukan kepada orang-orang yang bangkit melawan, yakni para lawan, paling sesuai dengan konteks. Ketidakpastiannya dicatat dalam catatan kaki.
- source_word: וְיִתְרָם
  choice: sisa mereka
  rationale: Kata יֶתֶר menunjuk kepada sesuatu yang tersisa, sedangkan akhiran pronominal merujuk kepada kelompok yang baru disebut. “Sisa mereka” ringkas dan mempertahankan gagasan tentang yang masih tertinggal.
- source_word: אָכְלָה אֵשׁ
  choice: api telah menghanguskan
  rationale: Pemakaian אכל dengan api sebagai subjek menggambarkan pemusnahan seperti tindakan memakan. “Menghanguskan” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran api yang membinasakan.
