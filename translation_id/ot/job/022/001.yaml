  yaml_path: translation/ot/job/022/001.yaml
  text: 'Then Eliphaz the Temanite answered and said:'
translation:
  language: id
  text: 'Kemudian Elifas, orang Teman, menjawab, katanya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam bentuk naratif ini, verba ענה memperkenalkan tanggapan dalam dialog. 'Menjawab' mempertahankan hubungan ujaran Elifas dengan pembicaraan sebelumnya.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: הַתֵּמָנִי
  choice: orang Teman
  rationale: Adjektiva nisbah ini menunjukkan asal atau keterkaitan dengan Teman. 'Orang Teman' alami dalam bahasa Indonesia dan mempertahankan penandaan geografisnya.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: אמר adalah verba ujaran umum. Dalam rumus Ibrani 'menjawab dan berkata', 'menjawab, katanya' mempertahankan kedua unsur tanpa menghasilkan susunan Indonesia yang terlalu kaku.
- source_word: וַ
  choice: Kemudian
  rationale: Waw pada verba pertama melanjutkan urutan narasi. 'Kemudian' menyampaikan perkembangan dialog secara wajar dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada sastra-naratif. Rumus ujaran Ibrani dipertahankan secara alami sebagai 'menjawab, katanya', sedangkan sebutan asal diterjemahkan 'orang Teman' agar mudah dipahami pembaca umum.
