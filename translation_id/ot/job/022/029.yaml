id: JOB.22.29
reference: Job 22:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי הִ֭שְׁפִּילוּ וַ/תֹּ֣אמֶר גֵּוָ֑ה וְ/שַׁ֖ח עֵינַ֣יִם יוֹשִֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: id
  text: Sebab, ketika orang-orang direndahkan[a], engkau berkata, “Angkatlah mereka!” dan Dia menyelamatkan orang yang matanya tertunduk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab, ketika orang-orang dijatuhkan, engkau berkata, ‘Ada pengangkatan!’” Klausa Ibrani ini eliptis dan dapat diterjemahkan secara lebih harfiah demikian.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “orang yang rendah matanya”; maksudnya dapat menunjuk kepada orang yang rendah hati atau yang sedang tertekan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab, ketika
  rationale: Mengungkapkan hubungan alasan sekaligus keadaan waktu dengan janji pada konteks sebelumnya.
- source_word: הִשְׁפִּילוּ
  choice: orang-orang direndahkan
  rationale: Bentuk jamak ini menyatakan keadaan direndahkan atau dijatuhkan. Kata “orang-orang” ditambahkan secara wajar karena subjek Ibrani tidak dinyatakan dengan nomina.
- source_word: וַתֹּאמֶר
  choice: engkau berkata
  rationale: Kata kerja ini ditujukan kepada orang kedua tunggal. Bentuk kini cocok dengan corak umum atau menjanjikan dalam konteks tersebut.
- source_word: גֵּוָה
  choice: Angkatlah mereka!
  rationale: Nomina Ibrani yang eliptis ini menunjuk pada ketinggian atau pengangkatan, sebagai kebalikan dari keadaan direndahkan. Bentuk seruan membuat maksudnya dapat dipahami dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וְשַׁח עֵינַיִם
  choice: orang yang matanya tertunduk
  rationale: Mempertahankan gambaran harfiah tentang mata yang tertunduk, yang dapat menyiratkan kerendahan hati atau kepedihan.
- source_word: יוֹשִׁעַ
  choice: Dia menyelamatkan
  rationale: Kata kerja orang ketiga tunggal berarti menyelamatkan atau melepaskan. Huruf kapital pada “Dia” menunjukkan bahwa subjek tersirat dalam konteks adalah Allah tanpa menambahkan nama yang tidak terdapat dalam teks.
theological_decisions:
- issue: Subjek יוֹשִׁעַ
  choice: Subjek dipahami sebagai Allah dan diterjemahkan “Dia”, tetapi nama “Allah” tidak ditambahkan.
  alternative: Subjek tak tentu, atau menjadikan orang yang diajak bicara sebagai subjek.
  rationale: Kata kerja Ibrani berbentuk orang ketiga maskulin tunggal, dan konteks menunjuk kepada Allah. Terjemahan ini mempertahankan subjek tersirat sebagaimana dalam teks sumber.
- issue: Makna גֵּוָה dalam klausa yang eliptis
  choice: 'Diterjemahkan sebagai seruan pengangkatan: “Angkatlah mereka!”'
  alternative: “Ada pengangkatan!”, “Pengangkatan!”, atau “kesombongan”.
  rationale: Kontras langsung dengan keadaan direndahkan mendukung makna positif berupa pengangkatan, bukan kesombongan negatif. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur dibuat alami bagi pembaca umum, sedangkan keelliptisan dan ambiguitas utama teks Ibrani dijaga melalui catatan kaki.
