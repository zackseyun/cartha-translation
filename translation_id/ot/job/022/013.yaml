translation:
  language: id
  text: Namun, engkau berkata, “Apa yang Allah ketahui? Dapatkah Ia menghakimi melalui kegelapan pekat[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah Ia menghakimi melalui kegelapan pekat?” Bentuk imperfek Ibrani dapat menyatakan tindakan kini atau mendatang, bukan hanya kemampuan. “Kegelapan pekat” juga dapat diterjemahkan “awan gelap”, “kesuraman”, atau “dari balik kegelapan pekat”.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Namun, katamu
  rationale: Konjungsi dan bentuk perfektum orang kedua tunggal maskulin menyampaikan tuduhan dengan mengutip perkataan lawan bicara. Bentuk kini dalam bahasa Indonesia wajar untuk daya retoris konteks, sedangkan “Namun” menampilkan hubungan adversatif.
- source_word: מַה
  choice: Apa
  rationale: 'Kata tanya ini memperkenalkan isi tantangan yang dikutip: “Apa yang diketahui Allah?”'
- source_word: יָדַע
  choice: yang diketahui
  rationale: Verba ini menunjuk pada pengetahuan atau pengenalan kognitif. Konstruksi pasif relatif menghasilkan pertanyaan bahasa Indonesia yang alami tanpa menambahkan gagasan kemampuan.
- source_word: אֵל
  choice: Allah
  rationale: Sebutan umum bagi Allah diterjemahkan secara idiomatis sebagai “Allah”, bukan ditransliterasikan sebagai “El”.
- source_word: הַבְעַד
  choice: dari balik
  rationale: Preposisi ini dapat menyatakan posisi atau tindakan dari balik penghalang. “Dari balik” mempertahankan gambaran bahwa kelam pekat berada di antara Allah dan dunia yang dihakimi.
- source_word: עֲרָפֶל
  choice: kelam pekat
  rationale: Nomina ini menunjuk pada kegelapan pekat, kemuraman, atau awan gelap. “Kelam pekat” mempertahankan bobot serta gambaran terhalangnya penglihatan.
- source_word: יִשְׁפּוֹט
  choice: Dapatkah Dia menghakimi
  rationale: Bentuk imperfek dalam pertanyaan retoris dapat menyiratkan keraguan terhadap kemampuan. “Dapatkah” mengungkapkan daya retoris tersebut secara alami dalam bahasa Indonesia, sementara alternatif aspek sederhana dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah יִשְׁפּוֹט menyatakan kemampuan atau sekadar tindakan kini/akan datang
  choice: Dapatkah Dia menghakimi dari balik kelam pekat?
  alternative: Apakah Dia menghakimi dari balik kelam pekat? / Akankah Dia menghakimi dari balik kelam pekat?
  rationale: Dalam konteksnya, Elifas menisbatkan kepada Ayub pandangan bahwa Allah terhalang untuk mengetahui dan mengatur urusan manusia. Terjemahan dengan “Dapatkah” menyampaikan keraguan retoris itu, tetapi catatan kaki mempertahankan kemungkinan pembacaan kini atau mendatang dari bentuk imperfek Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “Apa yang diketahui Allah?” mempertahankan bentuk pertanyaan Ibrani, sedangkan “dari balik kelam pekat” menjaga citra adanya penghalang tanpa menjelaskan metafora secara berlebihan.
