base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: id
  text: Bukankah Allah ada di ketinggian langit[a]? Perhatikanlah bintang-bintang tertinggi[b], betapa tingginya!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat-tempat tinggi di langit.” Secara harfiah, frasa Ibraninya berarti “ketinggian langit.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “kepala” atau “puncak bintang-bintang”; maksudnya dapat dipahami sebagai bintang-bintang yang tertinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “bukankah” mempertahankan bentuk dan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Padanan baku bagi sebutan tunggal untuk Allah, tanpa menambahkan gelar atau nuansa yang tidak dinyatakan dalam kata Ibrani.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: di ketinggian langit
  rationale: Frasa konstruksi ini secara harfiah menunjuk pada ketinggian langit. Preposisi “di” melengkapi ungkapan lokasi yang tersirat dan mempertahankan citra ruang.
- source_word: וּרְאֵה
  choice: Lihatlah
  rationale: Bentuk imperatif ראה diterjemahkan dengan perintah yang wajar dalam bahasa Indonesia. Konjungsi waw tidak harus ditampilkan sebagai “dan” karena pergantian kalimat sudah menghubungkan seruan ini dengan pertanyaan sebelumnya.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: puncak bintang-bintang
  rationale: רֹאשׁ secara dasar berarti “kepala” atau “puncak”. Ungkapan “puncak bintang-bintang” mempertahankan metafora sumber dan tetap dapat dipahami, sementara catatan kaki menjelaskan kemungkinan makna idiomatisnya.
- source_word: כִּי
  choice: betapa
  rationale: Dalam konteks ini כִּי memperkenalkan seruan mengenai ketinggian bintang-bintang; “betapa” menyampaikan fungsi eksklamatif itu secara alami.
- source_word: רָמּוּ
  choice: tingginya mereka
  rationale: Kata kerja dari רום menyatakan keadaan tinggi. “Tinggi” mempertahankan arti ruang dan menghindari kemungkinan nuansa kehormatan dari “mulia” atau “ditinggikan”.
theological_decisions:
- issue: Apakah gambaran ini harus diperluas menjadi pernyataan tentang jauhnya Allah atau kritik teologis terhadap Ayub
  choice: Pertahankan pertanyaan retoris dan gambaran ruang sebagaimana dinyatakan dalam ucapan Elifas.
  alternative: Memparafrasakan ayat untuk menekankan bahwa Allah jauh atau untuk menjelaskan kritik Elifas terhadap Ayub.
  rationale: Teks hanya menunjuk pada Allah di ketinggian langit dan mengajak pendengar memperhatikan tingginya bintang-bintang. Terjemahan tidak menambahkan kesimpulan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern yang puitis namun jelas. “Bukankah” mempertahankan pertanyaan retoris, sedangkan “Lihatlah” dan “betapa” menjaga daya seruan. Pronomina “mereka” mengikuti bentuk jamak kata kerja Ibrani dan mempunyai anteseden yang jelas, yaitu bintang-bintang.
