base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: id
  text: Apakah karena engkau takut kepada-Nya, Ia menegurmu dan berperkara denganmu?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena engkau menghormati-Nya”; secara harfiah, “karena/dari ketakutanmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia menghardikmu” atau “Ia mengoreksimu.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “datang denganmu ke dalam pengadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: Apakah karena engkau takut kepada-Nya
  rationale: Frasa ini bersifat interogatif dan kausal, secara harfiah ‘apakah karena/dari ketakutanmu’. Dalam konteks, rasa takut atau hormat itu tertuju kepada Allah; bentuk verbal ‘engkau takut kepada-Nya’ menyampaikan elipsis Ibrani secara alami dalam bahasa Indonesia.
- source_word: יֹכִיחֶךָ
  choice: Ia menegurmu
  rationale: Bentuk hifil dari יכח dapat berarti menegur, mengoreksi, atau mengajukan perkara terhadap seseorang. ‘Menegurmu’ mempertahankan daya moralnya, sedangkan nuansa hukum diperjelas oleh klausa berikutnya.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: berperkara denganmu
  rationale: Ungkapan harfiahnya ialah ‘datang bersama/denganmu ke dalam pengadilan’. ‘Berperkara denganmu’ merupakan ungkapan Indonesia yang alami dan mempertahankan latar yudisial serta hubungan adversatifnya.
- source_word: מִּשְׁפָּט
  choice: perkara
  rationale: Di sini מִשְׁפָּט menunjuk pada proses pengadilan atau sengketa hukum. Dalam konstruksi ‘berperkara’, pilihan ini menyampaikan nuansa forensik secara ringkas dan wajar.
theological_decisions:
- issue: Acuan tersirat dalam ‘ketakutanmu’
  choice: Rasa takut itu dipahami tertuju kepada Allah dan diterjemahkan ‘engkau takut kepada-Nya’.
  alternative: 'Membiarkan objeknya tersirat: ‘karena ketakutanmu’.'
  rationale: Konteksnya adalah perkataan Elifas tentang tindakan Allah terhadap Ayub. Penyebutan ‘kepada-Nya’ memperjelas elipsis Ibrani tanpa menambahkan klaim teologis baru.
- issue: Daya pertanyaan Elifas
  choice: Dipertahankan sebagai pertanyaan retoris yang mengharapkan jawaban ‘tidak’.
  alternative: Membacanya sebagai pertanyaan netral.
  rationale: Partikel tanya Ibrani dan konteks ironi dalam perkataan Elifas menunjukkan bahwa ia menyangkal Allah sedang mengadili Ayub karena kesalehan atau rasa takut Ayub kepada-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘engkau’ sesuai dengan dialog puitis langsung; ‘Ia’ dan ‘-Nya’ merujuk kepada Allah. Susunan pertanyaan dijaga ringkas agar ironi Elifas tetap terasa.
