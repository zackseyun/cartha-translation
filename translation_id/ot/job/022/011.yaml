  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: id
  text: atau kegelapan, sehingga engkau tidak dapat melihat, dan air yang melimpah menutupi engkau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan banjir menutupi engkau.” Ungkapan Ibrani dapat menggambarkan air yang meluap, tetapi juga dapat berarti air dalam jumlah yang sangat banyak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: atau
  rationale: Kata ini secara alami memperkenalkan kemungkinan atau malapetaka berikutnya dalam uraian Elifas; terjemahan ringkas “atau” mempertahankan gaya puitis Ibrani.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Nomina ini dapat menunjuk pada kegelapan secara harfiah maupun kiasan. “Kegelapan” adalah padanan langsung dan sesuai dengan gambaran tidak dapat melihat.
- source_word: לֹא תִרְאֶה
  choice: sehingga engkau tidak dapat melihat
  rationale: Secara harfiah berarti “engkau tidak melihat.” Dalam konteks frasa nominal “atau kegelapan,” kata “sehingga” menyatakan akibat secara wajar dalam bahasa Indonesia tanpa mengubah gambaran pokok.
- source_word: וְשִׁפְעַת
  choice: dan ... yang melimpah
  rationale: שִׁפְעָה menyatakan kelimpahan atau luapan. Bentuk “air yang melimpah” alami dalam bahasa Indonesia serta tidak mempersempit maknanya menjadi banjir.
- source_word: מַיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya gramatikal jamak, bahasa Indonesia lazim memakai nomina massa tunggal “air”; gambaran kolektifnya tetap terpelihara.
- source_word: תְּכַסֶּךָּ
  choice: menutupi engkau
  rationale: Bentuk piel dari כסה berarti “menutupi.” Pilihan ini mempertahankan citra harfiah, sedangkan “menenggelamkan” atau “melanda” akan lebih interpretatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti “engkau” dipakai karena konteksnya adalah sapaan langsung dalam puisi hikmat. Susunan kalimat mempertahankan rangkaian gambaran yang padat; penanda catatan kaki ditempatkan setelah klausa yang memiliki alternatif terjemahan.
