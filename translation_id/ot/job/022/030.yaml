base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: id
  text: 'Ia bahkan menyelamatkan orang yang bersalah[a],

    dan orang itu akan diselamatkan melalui kebersihan tanganmu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menyelamatkan orang yang tidak bersalah.” Teks Ibrani pada baris pertama sulit dan dapat dipahami dengan cara lain.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “melalui kebersihan tanganmu”; tangan yang bersih menggambarkan ketidakbersalahan atau kemurnian moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: menyelamatkan
  rationale: Bentuk Piel dari מלט berarti membuat seseorang luput atau menyelamatkannya; pilihan ini alami dalam bahasa Indonesia dan sejajar dengan bentuk pasif pada baris kedua.
- source_word: אִי נָקִי
  choice: orang yang tidak bebas dari kesalahan
  rationale: Ungkapan Ibrani ini sulit. אִי dipahami menurut tafsiran tradisional sebagai unsur negatif, sedangkan נָקִי menunjuk pada keadaan bebas dari kesalahan. Rumusan ini menghindari ambiguitas frasa Indonesia 'tidak bersalah', yang justru lazim berarti 'tidak mempunyai kesalahan'.
- source_word: וְנִמְלַט
  choice: dan orang itu akan diselamatkan
  rationale: Bentuk Nifal dari מלט dapat berarti 'diselamatkan' atau 'luput'. Bentuk pasif mempertahankan kesejajaran dengan kata kerja pada baris pertama, sedangkan 'orang itu' memperjelas rujukannya secara alami.
- source_word: בְּבֹר כַּפֶּיךָ
  choice: karena tanganmu bersih
  rationale: בְּ menyatakan sarana atau dasar, בֹּר menyatakan kebersihan atau kemurnian, dan כַּפֶּיךָ secara harfiah berarti 'telapak-telapak tanganmu'. Ungkapan 'tangan yang bersih' dapat dipahami dalam bahasa Indonesia sebagai gambaran ketidakbersalahan atau kemurnian moral.
theological_decisions:
- issue: Makna klausa pertama yang secara sintaksis sulit
  choice: Elifas menyatakan bahwa Allah bahkan menyelamatkan orang yang tidak bebas dari kesalahan.
  alternative: Ia menyelamatkan orang yang tidak bersalah.
  rationale: Pembacaan utama mengikuti pemahaman tradisional terhadap אִי sebagai unsur negatif dan membuat baris kedua menyatakan bahwa orang tersebut diselamatkan karena kebersihan tangan Ayub. Catatan kaki mempertahankan pembacaan alternatif tanpa menjadikan ayat ini pernyataan doktrinal yang lebih kuat daripada teksnya.
- issue: Peranan kebersihan tangan Ayub dalam penyelamatan orang lain
  choice: Dinyatakan sebagai dasar atau sarana penyelamatan tanpa penjelasan teologis tambahan.
  alternative: Menafsirkannya secara eksplisit sebagai doa syafaat atau jasa Ayub.
  rationale: Teks hanya menghubungkan keselamatan orang itu dengan kebersihan tangan Ayub. Terjemahan tidak menetapkan mekanismenya dan dengan demikian mempertahankan ketegangan teologis dalam perkataan Elifas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa 'tidak bebas dari kesalahan' dipilih untuk menyampaikan pembacaan negatif tanpa menimbulkan kekeliruan semantis dari ungkapan Indonesia 'tidak bersalah'. Kesejajaran puisi dipertahankan dalam dua baris.
