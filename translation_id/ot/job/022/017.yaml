  text: הָ/אֹמְרִ֣ים לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וּ/מַה יִּפְעַ֖ל שַׁדַּ֣י לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/017.yaml
  text: who said to God, ‘Depart from us,’ and, ‘What can the Almighty do to them?’
translation:
  language: id
  text: mereka yang berkata kepada Allah, “Jauhilah kami!” dan, “Apa yang dapat dilakukan Yang Mahakuasa kepada mereka?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: kepada mereka; sejumlah terjemahan memahami ungkapan ini sebagai kepada kami sesuai dengan kutipan sebelumnya.'
    reason: Menjelaskan pergeseran pronomina yang nyata dan memberi tahu pembaca tentang pembacaan kontekstual alternatif tanpa mengganti bentuk sumber.
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: Jauhilah kami
  rationale: Secara alami menyampaikan perintah agar Allah menyingkir atau menjauh dari kelompok pembicara; pronomina orang pertama jamak dipertahankan.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan gelar ilahi yang baku, jelas, dan sesuai dengan pemakaian dalam konteks kitab Ayub.
- source_word: לָמוֹ
  choice: kepada mereka
  rationale: Bentuk pronominal puitis ini secara morfologis menunjuk orang ketiga jamak; terjemahan mempertahankan pergeseran dari “kami” dalam kutipan pertama ke “mereka” dalam pertanyaan kedua.
- source_word: יִפְעַל
  choice: dapat dilakukan
  rationale: Dalam pertanyaan retoris, verba פעל dipadankan secara idiomatis sebagai tindakan yang mampu dilakukan, tanpa menentukan apakah nuansanya menghasilkan, mengerjakan, atau bertindak.
theological_decisions:
- issue: Pergeseran pronomina dari מִמֶּנּוּ (“kami”) ke לָמוֹ (“mereka”)
  choice: Mempertahankan “kami” lalu “mereka”
  alternative: Menyeragamkannya menjadi “kami” pada kedua kutipan
  rationale: Teks Masoret secara eksplisit memakai orang pertama jamak lalu bentuk orang ketiga jamak. Pergeseran yang terasa janggal itu merupakan ketegangan asli teks dan tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Jauhilah kami” lebih alami daripada “Menyingkirlah dari kami,” sedangkan susunan pertanyaan mempertahankan ketegangan pronominal teks Ibrani.
