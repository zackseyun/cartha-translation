id: JOB.22.14
reference: Job 22:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: id
  text: Awan-awan menjadi selubung bagi-Nya[a], sehingga Ia tidak melihat; Ia berjalan-jalan di atas lengkungan langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Awan tebal menjadi selubung bagi-Nya, dan Ia tidak melihat; Ia berjalan-jalan di atas lingkaran langit.”'
    reason: Menunjukkan kemungkinan menerjemahkan עָבִים sebagai “awan tebal”, hubungan koordinatif pada וְלֹא יִרְאֶה, dan חוּג sebagai “lingkaran”.
lexical_decisions:
- source_word: עָבִים
  choice: awan-awan
  rationale: Bentuk jamak ini menunjuk pada awan, yang dalam konteks dapat berupa awan tebal. “Awan-awan” alami dalam bahasa Indonesia dan tidak menambahkan sifat yang hanya tersirat.
- source_word: סֵתֶר
  choice: selubung
  rationale: Nomina ini menyatakan sesuatu yang menutupi atau menyembunyikan. “Selubung” mempertahankan gambaran konkret tentang awan yang menghalangi pandangan.
- source_word: לוֹ
  choice: bagi-Nya
  rationale: Preposisi dengan sufiks pronominal menyatakan bahwa awan menjadi selubung bagi Dia. Kapitalisasi mengikuti ragam Indonesia yang lazim untuk pronomina yang merujuk kepada Allah, tanpa mengganti pronomina Ibrani dengan nama eksplisit.
- source_word: וְלֹא יִרְאֶה
  choice: sehingga Ia tidak melihat
  rationale: Klausa ini dapat menyatakan akibat dari adanya selubung, walaupun hubungan koordinatif “dan Ia tidak melihat” juga mungkin; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: חוּג
  choice: lengkungan
  rationale: Kata ini dapat berarti lingkaran atau bentangan berbentuk kubah. “Lengkungan langit” menyampaikan gambaran bentangan langit tanpa menjadikannya istilah kosmologis teknis.
- source_word: שָׁמַיִם
  choice: langit
  rationale: “Langit” merupakan padanan Indonesia yang alami dan tetap sesuai dengan gambaran ketinggian dalam ayat ini.
- source_word: יִתְהַלָּךְ
  choice: Ia berjalan-jalan
  rationale: Bentuk Hitpael dari הלך menyiratkan bergerak atau berjalan ke sana kemari; “berjalan-jalan” mempertahankan nuansa iteratif tersebut.
theological_decisions:
- issue: Sudut pandang pembicara dan subjek tersirat
  choice: Mempertahankan pronomina “Ia/-Nya” sebagai kelanjutan laporan Elifas mengenai anggapan orang fasik tentang Allah.
  alternative: Menuliskan “Allah” secara eksplisit atau membacanya sebagai pernyataan netral tentang transendensi Allah.
  rationale: Dalam Ayub 22:13-14, Elifas sedang mengemukakan apa yang menurut tuduhannya dipikirkan orang fasik. Teks Ibrani hanya memakai pronomina; karena itu terjemahan tidak menyisipkan nama “Allah” dan tidak mengubah tuduhan tersebut menjadi penegasan teologis langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Selubung” serta “lengkungan langit” menjaga citra puitis, sedangkan susunan kalimat tetap mudah dipahami. Pronomina ilahi dikapitalisasi sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia.
