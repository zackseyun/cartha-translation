  text: קַח נָ֣א מִ/פִּ֣י/ו תּוֹרָ֑ה וְ/שִׂ֥ים אֲ֝מָרָ֗י/ו בִּ/לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: id
  text: Terimalah kiranya pengajaran dari mulut-Nya, dan simpanlah perkataan-Nya dalam hatimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח נָא
  choice: Terimalah kiranya
  rationale: Imperatif לקח dalam konteks menerima pengajaran paling alami diterjemahkan “terimalah”; partikel נָא memberi nuansa permohonan atau desakan halus, yang dipertahankan dengan “kiranya” dalam ragam bahasa bermartabat.
- source_word: מִפִּיו
  choice: dari mulut-Nya
  rationale: Ungkapan konkret Ibrani “dari mulutnya” dipertahankan karena menunjuk pada pengajaran yang diucapkan secara langsung. Huruf kapital mencerminkan rujukan Elifas kepada Allah dalam konteks dekat.
- source_word: תּוֹרָה
  choice: pengajaran
  rationale: Dalam konteks sastra hikmat ini, תּוֹרָה berarti arahan atau pengajaran berotoritas, tanpa harus secara khusus menunjuk kepada hukum Musa. “Pengajaran” alami dalam bahasa Indonesia dan menjaga cakupan maknanya.
- source_word: וְשִׂים
  choice: dan simpanlah
  rationale: Secara harfiah berarti “dan taruhlah/tempatkanlah”; bersama frasa “dalam hatimu,” kata ini menyatakan penyimpanan batin. “Simpanlah” mempertahankan metafora itu secara alami.
- source_word: אֲמָרָיו
  choice: perkataan-Nya
  rationale: Bentuk jamak ini menunjuk kepada ucapan-ucapan-Nya. “Perkataan” memiliki bobot yang sesuai dan lebih idiomatis daripada “ujaran” dalam konteks ini.
- source_word: בִּלְבָבֶךָ
  choice: dalam hatimu
  rationale: Ungkapan Ibrani tentang hati sebagai pusat pikiran, kehendak, dan batin dipertahankan secara harfiah sekaligus idiomatis.
theological_decisions:
- issue: Makna תּוֹרָה dalam perkataan hikmat
  choice: pengajaran
  alternative: hukum; ajaran
  rationale: “Pengajaran” tidak membatasi kata ini pada hukum perjanjian atau hukum Musa, tetapi tetap menyampaikan wibawa arahan yang menurut Elifas berasal dari Allah.
- issue: Rujukan pronomina orang ketiga tunggal
  choice: akhiran hormat “-Nya” untuk Allah
  alternative: “-nya” tanpa kapital, yang dapat mempertahankan ambiguitas grafis
  rationale: Dalam konteks seruan Elifas agar Ayub berdamai dengan Allah (22:21), “mulut-Nya” dan “perkataan-Nya” secara wajar merujuk kepada Allah. Kapitalisasi adalah konvensi bahasa Indonesia dan tidak menambahkan gelar ilahi ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur paralel dua imperatif dipertahankan. “Kiranya” dipilih untuk nuansa permohonan נָא; ungkapannya sedikit formal tetapi masih lazim dan sesuai dengan register puisi hikmat.
