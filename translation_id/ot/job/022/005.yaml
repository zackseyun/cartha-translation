lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban membenarkan tuduhan itu.
- source_word: רָעָתְךָ
  choice: kejahatanmu
  rationale: Dalam kesejajaran dengan 'kesalahan-kesalahanmu', kata ini menunjuk pada kejahatan moral, bukan malapetaka yang dialami Ayub.
- source_word: רַבָּה
  choice: besar
  rationale: Menyatakan besarnya kejahatan dan terdengar alami dalam bahasa Indonesia.
- source_word: וְאֵין קֵץ
  choice: dan ... tidak ada habisnya
  rationale: Ungkapan idiomatis Indonesia yang mempertahankan gambaran bahwa tidak ada akhir atau batas.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: kesalahan-kesalahanmu
  rationale: Bentuk jamak mempertahankan banyaknya pelanggaran yang dituduhkan; 'kesalahan' cukup luas untuk cakupan עָוֹן, meski dapat pula diterjemahkan 'kedurhakaan' atau 'dosa'.
theological_decisions:
- issue: Apakah רָעָתְךָ berarti kejahatan moral atau malapetaka
  choice: kejahatan moral
  alternative: malapetaka atau kemalangan
  rationale: Kesejajarannya dengan עֲוֺנֹתֶיךָ menunjukkan bahwa Elifas sedang menuduh Ayub melakukan kejahatan, bukan sekadar menggambarkan penderitaannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk 'Bukankah' menjaga nada pertanyaan retoris sekaligus tuduhan Elifas. 'Tidak ada habisnya' dipilih sebagai ungkapan alami; alternatif yang lebih formal dicatat dalam catatan kaki.
