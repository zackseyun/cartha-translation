  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: id
  text: Tetapi, tanah itu milik orang yang berkuasa[a], dan orang yang mendapat perlakuan istimewa[b] tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang berlengan,” sebuah ungkapan untuk orang yang kuat atau berkuasa.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang dihormati,” “orang yang diperkenan,” atau “orang yang diperlakukan secara istimewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Tetapi ... orang
  rationale: Kata אִישׁ berarti 'orang/laki-laki'. Dalam konteks tuduhan Elifas yang membandingkan penindasan terhadap kaum lemah dengan keistimewaan kaum kuat, waw diterjemahkan secara adversatif sebagai 'Tetapi'.
- source_word: זְרוֹעַ
  choice: yang berkuasa
  rationale: Secara harfiah berarti 'lengan', tetapi ungkapan אִישׁ זְרוֹעַ menunjuk kepada orang yang mempunyai kekuatan atau kuasa. 'Orang yang berkuasa' menyampaikan makna sosial idiom itu secara wajar.
- source_word: לוֹ הָאָרֶץ
  choice: negeri itu menjadi milik
  rationale: 'Konstruksi ל dengan pronomina menyatakan kepemilikan atau penguasaan: secara harfiah, ''negeri itu adalah miliknya''. ''Menjadi milik'' mempertahankan makna posesif dengan bahasa Indonesia yang alami.'
- source_word: וּנְשׂוּא פָנִים
  choice: orang yang disegani
  rationale: Secara harfiah, 'orang yang diangkat wajahnya'; idiom ini dapat berarti orang yang dihormati, diperkenan, atau diperlakukan secara istimewa. 'Disegani' mempertahankan unsur kedudukan sosial tanpa memastikan apakah penghormatan itu patut atau merupakan sikap pilih kasih.
- source_word: יֵשֶׁב בָּהּ
  choice: tinggal di sana
  rationale: יָשַׁב dapat berarti duduk, berdiam, atau tinggal. Karena antesedennya adalah negeri, 'tinggal di sana' lebih alami daripada 'tinggal di dalamnya'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pilihan 'negeri' cocok untuk הָאָרֶץ sebagai wilayah yang dimiliki atau dikuasai; 'di sana' menghindari ungkapan Indonesia yang kaku. Kedua penanda catatan kaki dicantumkan tepat setelah frasa terkait.
