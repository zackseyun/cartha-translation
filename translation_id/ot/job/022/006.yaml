  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan mempertahankan ironi tajam dalam frasa tentang menanggalkan pakaian orang-orang yang telanjang. Semua penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
