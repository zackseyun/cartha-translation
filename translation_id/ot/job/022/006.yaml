  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: id
  text: Sebab engkau mengambil barang jaminan dari saudara-saudaramu tanpa alasan[a][b], dan engkau melucuti orang-orang yang telanjang itu dari pakaian mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merampas barang jaminan dari saudara-saudaramu tanpa dasar.”'
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudaramu” di sini dapat berarti sesama anggota masyarakat, bukan hanya saudara kandung.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas atau kausal yang menghubungkan tuduhan ini dengan perkataan sebelumnya.
- source_word: תַחְבֹּל
  choice: engkau mengambil barang jaminan
  rationale: Kata kerja חבל dalam konteks ini menunjuk pada pengambilan barang sebagai jaminan utang; ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אַחֶיךָ
  choice: saudara-saudaramu
  rationale: Menerjemahkan bentuk Ibrani secara langsung, sambil mengakui bahwa cakupannya dapat meluas kepada sesama anggota masyarakat.
- source_word: חִנָּם
  choice: tanpa alasan
  rationale: Menunjukkan bahwa tindakan itu dilakukan tanpa dasar yang sah, bukan semata-mata tanpa pembayaran.
- source_word: וּבִגְדֵי
  choice: dan ... pakaian
  rationale: בגד berarti pakaian atau kain sandang; 'pakaian' alami dan mudah dipahami.
- source_word: עֲרוּמִּים
  choice: orang-orang yang telanjang
  rationale: Mempertahankan gambaran tajam dan paradoksal teks Ibrani, tanpa menggantinya dengan tafsiran seperti 'orang melarat' atau 'yang berpakaian minim'.
- source_word: תַּפְשִׁיט
  choice: menanggalkan
  rationale: Bentuk kausatif פשט berarti membuat seseorang lepas dari pakaiannya atau melucutinya; 'menanggalkan pakaian' menyampaikan tindakan tersebut secara jelas.
