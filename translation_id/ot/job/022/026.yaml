id: JOB.22.26
reference: Job 22:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי אָ֭ז עַל שַׁדַּ֣י תִּתְעַנָּ֑ג וְ/תִשָּׂ֖א אֶל אֱל֣וֹהַּ פָּנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: id
  text: Sebab pada waktu itu engkau akan bersukacita dalam Yang Mahakuasa dan mengangkat wajahmu kepada Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mengangkat wajah kepada Allah” dapat menyiratkan keberanian untuk menghadap-Nya, pulihnya perkenanan, atau doa yang penuh keyakinan.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: Sebab pada waktu itu
  rationale: כִּי menghubungkan ayat ini dengan nasihat sebelumnya, sedangkan אָז menandai waktu atau akibat yang menyusul. Ungkapan ini mempertahankan kedua fungsi tersebut tanpa memastikan hubungan yang semata-mata kausal.
- source_word: עַל שַׁדַּי תִּתְעַנָּג
  choice: engkau akan bersukacita dalam Yang Mahakuasa
  rationale: Bentuk hitpael תִּתְעַנָּג menyatakan mengalami atau menikmati kesukaan, dan עַל menunjuk kepada pribadi yang menjadi pusat kesukaan itu. 'Bersukacita dalam' terdengar wajar dan bermartabat serta tidak menambahkan gagasan seperti persekutuan yang tidak dinyatakan secara eksplisit.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Ini merupakan padanan Indonesia yang lazim dan jelas untuk gelar ilahi שַׁדַּי; transliterasi 'Shaddai' kurang langsung dipahami pembaca umum.
- source_word: וְתִשָּׂא ... פָּנֶיךָ
  choice: dan mengangkat wajahmu
  rationale: Terjemahan konkret ini mempertahankan gambaran idiom Ibrani dan tidak mempersempit maknanya hanya menjadi berdoa, berharap, atau memandang.
- source_word: אֶל אֱלוֹהַּ
  choice: kepada Allah
  rationale: אֶל menyatakan arah, dan אֱלוֹהַּ adalah sebutan tunggal bagi Allah tanpa gelar tambahan.
theological_decisions:
- issue: Makna idiom 'mengangkat wajah kepada Allah'
  choice: Mempertahankan ungkapan konkret 'mengangkat wajahmu kepada Allah' dengan catatan penjelas.
  alternative: memandang kepada Allah; berdoa dengan yakin kepada Allah; menghadap Allah dengan kepala tegak
  rationale: Idiom ini dapat menyiratkan keberanian untuk menghadap, pulihnya perkenanan, atau doa yang penuh keyakinan. Mempertahankan citranya menjaga keluasan dan ketegangan makna teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' mempertahankan sapaan tunggal dalam puisi hikmat. Struktur puitis Ibrani dipertahankan sejauh tetap alami dalam bahasa Indonesia.
