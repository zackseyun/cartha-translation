  terminology: “Yang Mahakuasa” merupakan padanan Indonesia yang mapan bagi שַׁדַּי, sedangkan “Allah” tepat untuk אֱלוֹהַּ dalam konteks ini. Catatan kaki menjelaskan kemungkinan daya idiomatis tanpa menjadikannya satu-satunya arti.
