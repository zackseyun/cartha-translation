  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: id
  text: Engkau akan menetapkan suatu perkara[a], dan perkara itu akan terlaksana bagimu; terang akan menyinari jalan-jalanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau akan menetapkan suatu ucapan, dan ucapan itu akan berlaku bagimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִגְזַר
  choice: akan menetapkan
  rationale: Kata kerja גזר secara harfiah berkaitan dengan memotong atau membagi, tetapi dalam pemakaian luas dapat berarti memutuskan, menentukan, atau menetapkan. Dalam konteks ini, “menetapkan” menyampaikan keputusan atau pernyataan yang tegas tanpa harus menyiratkan wewenang kerajaan seperti yang dapat terkandung dalam “mendekretkan”.
- source_word: אֹמֶר
  choice: suatu perkara
  rationale: אֹמֶר biasanya berarti perkataan atau ucapan, tetapi sesudah גזר ungkapan ini menunjuk pada hal yang ditetapkan melalui perkataan. “Suatu perkara” alami dalam bahasa Indonesia dan makna harfiah “suatu ucapan” dipertahankan dalam catatan kaki.
- source_word: יָקָם
  choice: akan terlaksana
  rationale: קום pada dasarnya berarti bangkit atau berdiri. Mengenai perkara yang telah ditetapkan, bentuk ini menyatakan bahwa ketetapan tersebut akan berlaku atau menjadi kenyataan. “Akan terlaksana” menyampaikan hasil itu secara alami tanpa menambahkan kepastian teologis di luar pernyataan tokoh.
- source_word: לָךְ
  choice: bagimu
  rationale: Preposisi ל menyatakan hubungan atau manfaat. “Bagimu” ringkas dan mempertahankan bentuk pernyataan Ibrani.
- source_word: דְּרָכֶיךָ
  choice: jalan-jalanmu
  rationale: דֶּרֶךְ dapat berarti jalan secara harfiah maupun arah hidup atau tindakan secara kiasan. Bentuk “jalan-jalanmu” mempertahankan metafora puitis serta cocok dengan gambaran terang yang menyinari.
- source_word: נָגַהּ אֹור
  choice: terang akan menyinari
  rationale: נגה berarti bersinar atau bercahaya, dan אוֹר adalah subjeknya. “Terang akan menyinari” jelas, alami, dan mempertahankan gambaran puitis sumber.
theological_decisions:
- issue: Sifat janji dalam perkataan Elifas
  choice: Diterjemahkan sebagai pernyataan tegas mengenai hasil yang diharapkan menurut Elifas, tanpa diperkuat menjadi jaminan teologis mutlak.
  alternative: Menjadikannya janji kemakmuran yang tanpa syarat, atau melemahkannya menjadi sekadar kemungkinan.
  rationale: Ayat ini merupakan bagian dari nasihat dan pandangan teologis Elifas, bukan dengan sendirinya kesimpulan akhir kitab Ayub. Terjemahan mempertahankan keyakinan dalam ucapannya sekaligus tidak menambahkan bobot doktrinal yang tidak dinyatakan oleh teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Engkau” sesuai dengan tuturan langsung dalam konteks sastra Alkitab; susunan paralel dan gambaran puitis tentang terang dipertahankan.
