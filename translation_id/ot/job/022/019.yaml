  text: יִרְא֣וּ צַדִּיקִ֣ים וְ/יִשְׂמָ֑חוּ וְ֝/נָקִ֗י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: id
  text: Orang-orang benar melihat dan bersukacita, dan orang yang tidak bersalah mengejek mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menertawakan mereka.”
    reason: Alternatif leksikal untuk יִלְעַג yang lebih menonjolkan tindakan tertawa dengan nada merendahkan.
lexical_decisions:
- source_word: יִרְאוּ
  choice: melihat
  rationale: Bentuk Qal imperfek orang ketiga jamak dari ראה menyatakan bahwa orang-orang benar melihat atau menyaksikan apa yang terjadi. “Melihat” langsung dan tidak menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Kata sifat jamak yang dipakai sebagai nomina. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kategori moral dalam teks.
- source_word: וְיִשְׂמָחוּ
  choice: dan bersukacita
  rationale: Bentuk Qal imperfek orang ketiga jamak dari שׂמח menunjukkan kegembiraan. “Bersukacita” mempertahankan nada yang kuat sekaligus sesuai dengan ragam bahasa Alkitab yang modern dan bermartabat.
- source_word: וְנָקִי
  choice: dan orang yang tidak bersalah
  rationale: Kata sifat tunggal yang dipakai sebagai nomina dan dapat berfungsi secara generik. Bentuk tunggal dipertahankan, sementara frasa ini terdengar alami dalam bahasa Indonesia.
- source_word: יִלְעַג
  choice: mengejek
  rationale: Bentuk Qal imperfek orang ketiga tunggal dari לעג menyatakan ejekan atau tertawaan yang bernada merendahkan. “Mengejek” ringkas dan jelas; kemungkinan “menertawakan” dicatat dalam catatan kaki.
- source_word: לָמוֹ
  choice: mereka
  rationale: Pronomina ini menunjuk kepada kelompok yang dibicarakan dalam konteks sebelumnya, yakni orang-orang fasik yang mengalami kebinasaan. Terjemahan mempertahankan pronomina tanpa menjelaskan rujukannya di dalam teks utama.
theological_decisions:
- issue: Rujukan pronomina לָמוֹ dalam konteks
  choice: Mempertahankan “mereka” sebagai rujukan kepada orang-orang fasik yang kebinasaannya digambarkan dalam konteks sekitar.
  alternative: Menjadikannya pernyataan umum tentang tanggapan orang benar ketika menyaksikan penghakiman ilahi.
  rationale: Konteks langsung mendukung rujukan kepada orang-orang fasik, tetapi teks utama tidak memperluas atau mengganti pronomina tersebut sehingga ketegangan dan kepadatan ungkapan aslinya tetap terjaga.
- issue: Objek yang dilihat oleh orang-orang benar
  choice: Tidak menambahkan objek eksplisit setelah “melihat”.
  alternative: “Melihatnya” atau “menyaksikan hal itu”.
  rationale: Teks Ibrani tidak menyatakan objek bagi יִרְאוּ. Meskipun objeknya dapat dipahami dari konteks, menambah “-nya” akan membuat sesuatu yang tersirat menjadi eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Paralel antara “orang-orang benar” dan “orang yang tidak bersalah” dipertahankan, termasuk perbedaan bentuk jamak dan tunggal dalam bahasa Ibrani.
