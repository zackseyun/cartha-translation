  text: אַ֭לְמָנוֹת שִׁלַּ֣חְתָּ רֵיקָ֑ם וּ/זְרֹע֖וֹת יְתֹמִ֣ים יְדֻכָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: id
  text: Engkau menyuruh para janda pergi dengan tangan hampa, dan lengan anak-anak yatim diremukkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lengan anak-anak yatim”; “lengan” juga dapat melambangkan kekuatan atau kuasa mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: para janda
  rationale: Bentuk jamak ini menunjuk kepada perempuan yang kehilangan suami dan menonjolkan kerentanan sosial mereka.
- source_word: שִׁלַּחְתָּ
  choice: menyuruh ... pergi
  rationale: Bentuk Piel dari שלח bermakna menyuruh pergi atau mengusir; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan nada tuduhan.
- source_word: רֵיקָם
  choice: dengan tangan hampa
  rationale: Adverbia ini berarti pergi tanpa membawa atau menerima apa-apa; 'dengan tangan hampa' menyampaikan maknanya secara idiomatis.
- source_word: זְרֹעוֹת
  choice: lengan
  rationale: Terjemahan konkret ini mempertahankan citra Ibrani sekaligus tetap memungkinkan makna kiasan berupa kekuatan atau daya.
- source_word: יְתֹמִים
  choice: anak-anak yatim
  rationale: Dalam konteks sosial Ibrani, istilah ini terutama menunjuk kepada anak-anak yang kehilangan ayah dan karena itu rentan; 'anak-anak yatim' adalah padanan Indonesia yang jelas dan lazim.
- source_word: יְדֻכָּא
  choice: diremukkan
  rationale: Bentuk pasif dari דכא menyatakan tindakan meremukkan atau menghancurkan. Bentuk Indonesia tidak perlu menandai ketidakselarasan jumlah antara verba tunggal dan subjek jamak dalam teks Ibrani.
