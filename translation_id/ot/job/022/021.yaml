  text: Berbaiklah dengan Dia, kiranya, dan hiduplah dalam damai; dengan demikian kebaikan akan datang kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסְכֶּן נָא עִמּוֹ
  choice: Biasakanlah dirimu dengan Dia
  rationale: הסכן עם berarti membiasakan atau mengakrabkan diri dengan seseorang; bentuk נָא memberi nuansa permohonan atau desakan halus, yang dalam bahasa Indonesia cukup terwakili oleh bentuk ajakan imperatif ini tanpa menambahkan kata yang terasa kaku.
- source_word: וּשְׁלם
  choice: dan hiduplah dalam damai
  rationale: Bentuk imperatif dari שלם di sini menyatakan keadaan damai atau utuh. Ungkapan ini lebih alami dalam bahasa Indonesia daripada 'jadilah damai' dan tidak menentukan secara berlebihan apakah damai itu terutama dengan Allah atau keadaan sejahtera.
- source_word: בָּהֶם
  choice: dengan demikian
  rationale: Pronomina jamak harfiah 'dengan/oleh mereka' memiliki rujukan yang tidak sepenuhnya jelas, kemungkinan menunjuk pada tindakan-tindakan sebelumnya. 'Dengan demikian' mempertahankan hubungan sarana atau akibat tanpa memaksakan anteseden tertentu.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: kebaikan akan datang kepadamu
  rationale: Mempertahankan susunan dan makna langsung bahwa 'yang baik/kebaikan' akan datang kepada orang yang disapa, tanpa mempersempitnya menjadi kemakmuran materi.
theological_decisions:
- issue: Identitas pronomina maskulin tunggal עִמּוֹ
  choice: Dia
  alternative: dia
  rationale: Dalam konteks nasihat Elifas, rujukannya adalah Allah. Huruf kapital membantu pembaca Indonesia mengenali rujukan ilahi, tanpa mengganti pronomina dengan nama yang tidak tertulis dalam ayat.
- issue: Hubungan tindakan dan datangnya kebaikan
  choice: dengan demikian kebaikan akan datang kepadamu
  alternative: oleh hal-hal ini kebaikan akan datang kepadamu
  rationale: Ayat menyampaikan klaim Elifas tentang akibat dari berdamai dengan Allah. Terjemahan mempertahankan klaim itu sebagai ucapan tokoh, tanpa mengesahkannya sebagai rumusan teologis universal di luar konteks kitab.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Diksi 'biasakanlah dirimu dengan Dia' dipilih untuk menjaga nuansa leksikal yang tidak biasa dari הסכן, sedangkan 'hiduplah dalam damai' menghasilkan imperatif yang alami.
