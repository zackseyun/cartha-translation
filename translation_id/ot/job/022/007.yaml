source:
  edition: WLC
  text: לֹא מַ֭יִם עָיֵ֣ף תַּשְׁקֶ֑ה וּ֝/מֵ/רָעֵ֗ב תִּֽמְנַֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: id
  text: Engkau tidak memberi air untuk diminum kepada orang yang letih, dan engkau menahan roti[a] dari orang yang lapar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “roti” juga dapat berarti “makanan” secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: tidak
  rationale: Negasi sederhana yang menyatakan tuduhan bahwa kebutuhan orang yang letih tidak dipenuhi.
- source_word: מַיִם
  choice: air
  rationale: Makna langsung kata Ibrani; dalam bahasa Indonesia dipakai sebagai nomina massa.
- source_word: עָיֵף
  choice: orang yang letih
  rationale: Adjektiva ini dipakai secara substantival dan secara umum menunjuk orang yang kelelahan; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: תַּשְׁקֶה
  choice: memberi air untuk diminum
  rationale: Bentuk kausatif dari שׁקה berarti memberi minum atau membuat seseorang minum; ungkapan ini mempertahankan unsur air dan tujuan meminumnya.
- source_word: וּמֵרָעֵב
  choice: dan ... dari orang yang lapar
  rationale: Preposisi מִן berarti 'dari', sedangkan רָעֵב dipakai secara substantival bagi orang lapar secara representatif.
- source_word: תִּמְנַע
  choice: menahan
  rationale: Kata מנע berarti menahan atau tidak menyerahkan sesuatu; 'menahan' mempertahankan daya tuduhan moral dalam teks.
- source_word: לָחֶם
  choice: roti
  rationale: Makna konkret kata Ibrani adalah 'roti'. Walaupun dapat mewakili makanan secara lebih luas, gambaran konkret dipertahankan dalam teks utama.
