translation:
  language: id
  text: maka Yang Mahakuasa akan menjadi emasmu[a], dan menjadi perak pilihan bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “maka Yang Mahakuasa akan menjadi hartamu, dan engkau akan memiliki perak berlimpah.” Istilah Ibrani untuk “emas” dan kata yang menerangkan “perak” sulit dipastikan; keduanya mungkin menekankan kekayaan yang disediakan Allah, bukan Allah sendiri sebagai harta.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: maka ... akan menjadi
  rationale: Dalam rangkaian nasihat bersyarat Elifas, waw + qatal menyatakan akibat yang akan terjadi. “Maka ... akan menjadi” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan baku dan bermakna bagi gelar ilahi Shaddai, khususnya dalam konteks kitab Ayub.
- source_word: בְּצָרֶיךָ
  choice: emasmu
  rationale: Dalam kesejajaran puitis dengan “perak”, kata yang sulit ini paling wajar menunjuk pada logam mulia atau kekayaan, khususnya emas. Namun kemungkinan arti “harta” atau emas yang disediakan Allah tetap dicatat dalam catatan kaki.
- source_word: וְכֶסֶף
  choice: dan perak
  rationale: Mempertahankan unsur kedua dalam kesejajaran puitis; predikat “akan menjadi” dipahami dari larik pertama.
- source_word: תּוֹעָפוֹת
  choice: berharga
  rationale: Istilah langka ini tidak pasti dan mungkin menyiratkan mutu tinggi atau kelimpahan. “Berharga” alami dalam bahasa Indonesia dan tidak terlalu mempersempit maknanya.
- source_word: לָךְ
  choice: bagimu
  rationale: Menyatakan nuansa datif atau manfaat pribadi secara ringkas dan alami.
theological_decisions:
- issue: Makna janji dalam perkataan Elifas
  choice: Teks utama menyatakan bahwa Yang Mahakuasa sendiri akan menjadi kekayaan Ayub yang sejati.
  alternative: Ayat ini mungkin menjanjikan bahwa Yang Mahakuasa akan menyediakan emas dan perak yang berlimpah bagi Ayub.
  rationale: Struktur puisi Ibrani memungkinkan identifikasi Allah sebagai harta maupun pemahaman bahwa Allah menyediakan kekayaan. Teks utama mempertahankan metafora yang kuat, sedangkan kemungkinan penyediaan kekayaan materi disajikan dalam catatan kaki agar ketegangan tafsir tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan singkat mempertahankan kesejajaran kedua larik, dan penanda [a] ditempatkan langsung sesudah kata yang dipersoalkan.
