  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: id
  text: Namun, engkau penuh dengan penghakiman orang fasik[a]; penghakiman dan keadilan mencengkeram engkau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penghakiman atas orang fasik,” atau “penghakiman seperti yang dilakukan orang fasik.” Ungkapan Ibraninya padat dan hubungan antara “penghakiman” dan “orang fasik” tidak dinyatakan secara tegas.
    reason: alternative_reading
  - marker: b
    text: Atau, “penghakiman dan keadilan menopang engkau,” atau “penghakiman dan keadilan berpegang teguh.” Kata kerja Ibraninya dapat berarti menopang, memegang, atau mencengkeram, dan tidak memiliki objek yang dinyatakan secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: Namun
  rationale: Kata penghubung ini dipahami bernuansa pertentangan dalam konteks, beralih dari kemungkinan pemulihan pada keadaan Ayub saat ini.
- source_word: דִין
  choice: penghakiman
  rationale: Kata ini dapat berarti penghakiman, perkara, atau keputusan hukum. 'Penghakiman' mempertahankan corak yuridis dan pengulangannya dalam kedua bagian ayat.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Kata sifat tunggal ini dipakai sebagai nomina. 'Orang fasik' menyampaikan rujukan generik tanpa mempersempitnya kepada tokoh tertentu.
- source_word: מָלֵאתָ
  choice: engkau penuh dengan
  rationale: Bentuk perfek orang kedua tunggal maskulin menggambarkan keadaan Ayub; ungkapan ini mempertahankan citra kepenuhan tanpa menentukan apakah penghakiman itu dilakukan oleh orang fasik atau dijatuhkan atasnya.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Walaupun maknanya bertumpang tindih dengan דִין, 'keadilan' mempertahankan pasangan puitis sekaligus nuansa tatanan atau keputusan yang adil.
- source_word: יִתְמֹכוּ
  choice: mencengkeram engkau
  rationale: Akar תמך dapat berarti menopang, memegang, atau mencengkeram. Dalam konteks yang bernada negatif, 'mencengkeram' alami dalam bahasa Indonesia; objek 'engkau' dipahami dari konteks, tetapi ketaksaan leksikal dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan frasa 'penghakiman orang fasik'
  choice: Dibiarkan sebagai konstruksi yang dapat menunjuk pada penghakiman yang berkaitan dengan orang fasik.
  alternative: Penghakiman yang dijatuhkan atas orang fasik, atau cara orang fasik menghakimi.
  rationale: Bahasa Ibrani sangat padat dan konstruksi genitifnya tidak menentukan hubungan itu secara eksplisit; terjemahan utama tidak boleh menutup salah satu kemungkinan.
- issue: Makna klausa akhir יִתְמֹכוּ
  choice: penghakiman dan keadilan mencengkeram engkau
  alternative: penghakiman dan keadilan menopang engkau; atau berpegang teguh tanpa objek tersurat
  rationale: Konteks cenderung bersifat menghukum, tetapi verba tersebut juga dapat bermakna menopang. Bacaan utama dibuat wajar dalam bahasa Indonesia, sementara kemungkinan yang lebih positif dan ketiadaan objek eksplisit dalam bahasa Ibrani dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Sapaan 'engkau' dipakai sesuai wacana puisi langsung kepada Ayub; istilah yuridis 'penghakiman' dan 'keadilan' mempertahankan paralelisme Ibrani.
