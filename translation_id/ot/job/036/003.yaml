  text: אֶשָּׂ֣א דֵ֭עִ/י לְ/מֵ/רָח֑וֹק וּ֝/לְ/פֹעֲלִ֗/י אֶֽתֵּֽן צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: id
  text: Aku akan mendatangkan pengetahuanku dari jauh[a], dan akan kunyatakan bahwa Pembuatku benar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan membawa pengetahuanku dari tempat yang jauh.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan kunyatakan bahwa Pembuatku adil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: akan mendatangkan
  rationale: Secara harfiah verba ini berarti ‘mengangkat, membawa, menanggung’. Dengan ‘pengetahuanku’ sebagai objek dan ‘dari jauh’ sebagai keterangan, ‘mendatangkan’ secara alami menyampaikan gambaran membawa sesuatu dari suatu sumber tanpa menghilangkan metaforanya.
- source_word: דֵעִי
  choice: pengetahuanku
  rationale: Bentuk ini paling langsung menyatakan pengetahuan atau pemahaman milik si pembicara; ‘pendapatku’ akan terlalu subjektif.
- source_word: לְמֵרָחוֹק
  choice: dari jauh
  rationale: Dalam konstruksi ini frasa tersebut paling wajar dipahami sebagai asal pengetahuan yang didatangkan. Ungkapan Ibraninya tetap dapat diterjemahkan lebih eksplisit sebagai ‘dari tempat yang jauh’, yang dicatat dalam catatan kaki.
- source_word: וּלְפֹעֲלִי
  choice: Pembuatku
  rationale: Partisip פֹעֵל berarti orang yang berbuat atau membuat; dengan akhiran orang pertama tunggal, istilah ini menunjuk kepada Dia yang membuat si pembicara. ‘Pembuatku’ mempertahankan bentuk dan cakupan kata sumber tanpa mempersempitnya menjadi istilah teknis tertentu.
- source_word: אֶתֵּן
  choice: akan kunyatakan
  rationale: Arti dasarnya ialah ‘memberikan’, tetapi ketika objeknya צדק dan penerimanya adalah Pembuat si pembicara, maksud idiomatisnya ialah mengakui atau menyatakan sifat benar pada-Nya. ‘Akan kunyatakan’ menghasilkan bahasa Indonesia yang alami.
- source_word: צֶדֶק
  choice: benar
  rationale: Nomina ini dapat menyatakan kebenaran moral, kelurusan, atau keadilan. Dalam susunan Indonesia, klausa ‘bahwa Pembuatku benar’ menyampaikan pengakuan akan kelurusan-Nya, sedangkan nuansa ‘adil’ dipertahankan sebagai alternatif.
theological_decisions:
- issue: Makna צֶדֶק ketika dikenakan kepada Allah
  choice: bahwa Pembuatku benar
  alternative: bahwa Pembuatku adil
  rationale: ‘Benar’ mempertahankan cakupan luas berupa kelurusan moral dan ketepatan tindakan Allah, sementara ‘adil’ menonjolkan segi penghakiman. Karena kedua nuansa didukung oleh kata Ibrani, alternatifnya dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk ‘Pembuatku’ sengaja dipertahankan agar dekat dengan partisip Ibrani dan tidak menggantikannya dengan istilah yang lebih sempit. Susunan predikatif ‘bahwa Pembuatku benar’ menghindari ungkapan harfiah yang kaku ‘memberikan kebenaran kepada Pembuatku’.
