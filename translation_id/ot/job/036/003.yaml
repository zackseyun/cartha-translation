  source_fidelity: 'Terjemahan mempertahankan dua gerak utama Ibrani: Elihu akan membawa/mendatangkan pengetahuannya dari jauh, lalu menyatakan atau mengakui kebenaran/keadilan Pembuatnya. “Akan kunyatakan bahwa Pembuatku benar” merupakan pengungkapan Indonesia yang wajar bagi idiom נתן צדק kepada seseorang, tanpa mengubah subjek atau arah pernyataannya.'
