  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: id
  text: Namun, orang-orang yang fasik dalam hati[a] menimbun amarah; mereka tidak berseru meminta pertolongan ketika[b] Ia membelenggu mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat diterjemahkan “orang-orang yang munafik dalam hati” atau “orang-orang yang tidak saleh dalam batin.”
    reason: lexical_alternative
  - marker: b
    text: Atau “karena Ia membelenggu mereka.” Kata penghubung Ibrani dapat dipahami secara kausal, bukan temporal.
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: orang-orang yang fasik dalam hati
  rationale: חנף dapat menunjuk kepada orang fasik, tidak saleh, atau munafik. Dalam kitab Ayub, nuansa kefasikan atau ketidaktaatan kepada Allah lebih menonjol daripada sekadar ketidaktulusan sosial. Frasa 'dalam hati' mempertahankan penekanan pada watak batin.
- source_word: יָשִׂימוּ אָף
  choice: menimbun amarah
  rationale: Ungkapan harfiah 'menaruh amarah' tidak alami dalam bahasa Indonesia. 'Menimbun amarah' menyampaikan gagasan menyimpan atau menumpuk amarah dalam diri; amarah di sini paling wajar dipahami sebagai amarah mereka sendiri.
- source_word: לֹא יְשַׁוְּעוּ
  choice: tidak berseru meminta pertolongan
  rationale: Bentuk Piel dari שׁוע lazim berarti berseru untuk memperoleh pertolongan. Terjemahan ini alami sekaligus mempertahankan unsur seruan dalam kata sumber.
- source_word: כִּי
  choice: ketika
  rationale: 'Di sini כִּי dapat dipahami secara temporal: mereka tidak berseru pada saat dibelenggu atau ditindas. Makna kausal ''karena/sebab'' juga mungkin dan dipertahankan dalam catatan kaki.'
- source_word: אֲסָרָם
  choice: Ia membelenggu mereka
  rationale: אָסַר berarti mengikat, membelenggu, atau memenjarakan. 'Membelenggu' cocok dengan konteks penderitaan dan pengekangan. Subjek tunggalnya dipertahankan sebagai pronomina 'Ia', yang dalam konteks merujuk kepada Allah.
theological_decisions:
- issue: Rujukan subjek tunggal dalam אֲסָרָם
  choice: Mempertahankan pronomina 'Ia', yang secara kontekstual merujuk kepada Allah
  alternative: Menuliskan secara eksplisit 'Allah membelenggu mereka'
  rationale: Teks Ibrani memakai verba orang ketiga tunggal tanpa menyebut nama subjek. Konteks menunjukkan Allah sebagai rujukannya, tetapi pronomina dipertahankan agar tidak membuat teks lebih eksplisit daripada sumber.
- issue: Pemilik amarah dalam יָשִׂימוּ אָף
  choice: Amarah dipahami sebagai amarah yang dipendam oleh orang-orang fasik
  alternative: Memahaminya sebagai murka Allah yang mereka timbun atas diri mereka
  rationale: Secara sintaksis, orang-orang fasik adalah pelaku verba 'menimbun'. Pembacaan sebagai amarah batin mereka paling langsung, meskipun ungkapan itu secara konseptual dapat mengingatkan pada penimbunan murka penghukuman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Fasik dalam hati' mempertahankan tekanan pada keadaan batin, sedangkan 'menimbun amarah' menyampaikan idiom Ibrani secara alami. Huruf kapital pada 'Ia' mengikuti rujukan kontekstual kepada Allah tanpa mengganti pronomina sumber dengan nama ilahi.
