  text: יְחַלֵּ֣ץ עָנִ֣י בְ/עָנְי֑/וֹ וְ/יִ֖גֶל בַּ/לַּ֣חַץ אָזְנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: id
  text: 'Ia menyelamatkan orang yang tertindas melalui penderitaan mereka[a],

    dan membuka telinga mereka melalui tekanan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia membebaskan orang miskin dalam penderitaannya.” Kata-kata Ibrani di sini dapat menekankan kemiskinan, penderitaan, atau penindasan; preposisinya juga dapat berarti “melalui” atau “dalam”.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menyingkap telinga mereka”, sebuah ungkapan Ibrani yang berarti membuat seseorang mau mendengar atau menerima pengajaran.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: menyelamatkan
  rationale: Bentuk piel dari חלץ berarti menarik keluar atau membebaskan dari bahaya. “Menyelamatkan” menyampaikan tindakan aktif Allah secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עָנִי
  choice: orang yang tertindas
  rationale: עָנִי dapat berarti orang miskin, sengsara, rendah, atau tertindas. Dalam konteks ini, kesejajarannya dengan עָנְיוֹ dan לַחַץ mendukung arti penderitaan atau penindasan, bukan kemiskinan ekonomi saja.
- source_word: בְעָנְיוֹ
  choice: melalui penderitaan mereka
  rationale: Preposisi ב dapat dipahami secara instrumental (“melalui”) atau sirkumstansial (“dalam”). “Melalui” mempertahankan kemungkinan bahwa penderitaan menjadi sarana penyelamatan, sedangkan bentuk jamak generik membuat peralihan ke akhiran jamak pada אָזְנָם terasa alami dalam bahasa Indonesia.
- source_word: וְיִגֶל
  choice: membuka
  rationale: גלה secara harfiah berarti menyingkap atau membuka. Dengan “telinga” sebagai objek, ungkapan ini berarti membuat seseorang mendengar atau menerima pengajaran; “membuka” mempertahankan gambarnya sekaligus terdengar alami.
- source_word: בַּלַּחַץ
  choice: melalui tekanan
  rationale: לַחַץ mencakup tekanan, kesesakan, dan penindasan. “Tekanan” mempertahankan cakupan yang cukup luas, sementara “melalui” mencerminkan kemungkinan fungsi instrumental dari preposisi ב dan kesejajarannya dengan frasa sebelumnya.
- source_word: אָזְנָם
  choice: telinga mereka
  rationale: Bentuk teks memiliki akhiran orang ketiga jamak. Terjemahan mempertahankan bentuk jamak itu dan memahami עָנִי sebelumnya secara kolektif atau generik.
theological_decisions:
- issue: Penderitaan sebagai sarana penyelamatan dan pengajaran ilahi
  choice: Kedua frasa berpreposisi diterjemahkan secara instrumental dengan “melalui”, sehingga penderitaan dan tekanan tampil sebagai sarana yang dipakai Allah untuk menyelamatkan dan membuka pendengaran.
  alternative: Menerjemahkan keduanya secara sirkumstansial dengan “dalam”, sehingga penderitaan hanya menjadi keadaan tempat penyelamatan dan pengajaran terjadi.
  rationale: Kesejajaran בְעָנְיוֹ dan בַּלַּחַץ mendukung nuansa instrumental, tetapi catatan kaki mempertahankan kemungkinan nuansa sirkumstansial. Terjemahan tidak menambahkan klaim bahwa semua penderitaan baik pada dirinya sendiri atau selalu merupakan hukuman langsung; ketegangan teologis dalam perkataan Elihu tetap dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang yang tertindas” menghindari pembatasan makna pada kemiskinan ekonomi, sedangkan “tekanan” menjaga keluasan makna לַחַץ. Bentuk jamak dipakai secara generik agar sesuai dengan “telinga mereka” dalam teks Ibrani.
