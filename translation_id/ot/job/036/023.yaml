  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: id
  text: Siapakah yang telah menetapkan bagi-Nya jalan-Nya?[a] Atau siapakah yang pernah berkata, “Engkau telah berlaku tidak adil”?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapakah yang telah membebankan kepada-Nya jalan yang harus ditempuh-Nya?” Kata Ibrani ini juga dapat berarti menunjuk, menentukan, menugaskan, atau membebankan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Engkau telah berbuat salah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata tanya yang membuka pertanyaan retoris; padanan langsung dan alami dalam bahasa Indonesia.
- source_word: פָקַד
  choice: telah menetapkan
  rationale: Dalam konstruksi ini, פקד dapat berarti menetapkan, menentukan, menugaskan, atau membebankan. 'Menetapkan' menyampaikan gagasan bahwa tidak seorang pun menentukan jalan Allah bagi-Nya, sambil mempertahankan alternatif dalam catatan kaki.
- source_word: עָלָיו
  choice: bagi-Nya
  rationale: Dengan פקד, preposisi עַל di sini paling alami dipahami sebagai penetapan jalan bagi Dia. Bentuk ini lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'atas-Nya'.
- source_word: דַּרְכּוֹ
  choice: jalan-Nya
  rationale: דֶּרֶךְ dapat menunjuk jalan secara harfiah maupun cara bertindak atau haluan; 'jalan-Nya' mempertahankan keluasan metaforis itu.
- source_word: וּמִי
  choice: Atau siapa
  rationale: Menghubungkan pertanyaan retoris kedua sebagai tantangan alternatif yang sejajar; 'atau' alami dalam konteks ini.
- source_word: אָמַר
  choice: yang pernah berkata
  rationale: Bentuk perfektif dalam pertanyaan retoris menyiratkan tantangan universal—siapa yang pernah dapat melontarkan tuduhan demikian. 'Pernah berkata' menyampaikannya secara alami.
- source_word: פָּעַלְתָּ
  choice: Engkau telah melakukan
  rationale: פעל berarti melakukan, mengerjakan, atau bertindak. Bersama עַוְלָה, 'telah melakukan' membentuk ungkapan tuduhan yang wajar.
- source_word: עַוְלָה
  choice: ketidakadilan
  rationale: Kata ini menunjuk penyimpangan dari keadilan, kelaliman, atau perbuatan salah. 'Ketidakadilan' mempertahankan tekanan moral-yuridisnya dalam konteks pujian terhadap keadilan Allah.
theological_decisions:
- issue: Rujukan akhiran pronominal maskulin dan verba orang kedua
  choice: Ayat ini dipahami berbicara tentang Allah; karena itu digunakan 'jalan-Nya', 'bagi-Nya', dan 'Engkau'.
  alternative: Pembacaan yang lebih umum tentang seorang penguasa atau manusia yang berkuasa.
  rationale: Konteks Ayub 36:22–23 sedang meninggikan kebesaran dan keadilan Allah. Kapitalisasi pronomina mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia, tanpa menambahkan nama 'Allah' ke dalam teks.
- issue: Kekuatan pernyataan pada אָמַר
  choice: yang pernah berkata
  alternative: yang berkata
  rationale: Tambahan idiomatis 'pernah' menyatakan daya retoris bentuk perfektif—tidak seorang pun pernah dapat menuduh Allah—tanpa mengubah isi tuduhan.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan dua pertanyaan retoris dipertahankan. Pronomina yang merujuk kepada Allah dikapitalisasi sesuai kelaziman Alkitab Indonesia. Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
