translation:
  language: id
  text: Lalu Ia menyatakan kepada mereka perbuatan mereka dan pelanggaran mereka, bahwa mereka telah meninggikan diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “mereka telah menjadi kuat”; dalam konteks ini, ungkapan tersebut kemungkinan berarti meninggikan diri atau berlaku sombong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Lalu Ia menyatakan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. Dalam rangkaian konteks ini, “Lalu” mengungkapkan waw secara alami, sedangkan “menyatakan” mempertahankan bobot tindakan Allah yang menyingkapkan kesalahan.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Padanan langsung bagi preposisi dengan sufiks pronominal yang menandai penerima pernyataan.
- source_word: פָּעֳלָם
  choice: perbuatan mereka
  rationale: Nomina ini dapat berarti pekerjaan, tindakan, atau perbuatan. Bersama “pelanggaran mereka”, maknanya mengacu pada tindakan mereka dalam ranah moral.
- source_word: וּפִשְׁעֵיהֶם
  choice: dan pelanggaran mereka
  rationale: פשע mengandung gagasan pelanggaran atau pemberontakan terhadap otoritas yang sah. “Pelanggaran” alami dalam bahasa Indonesia dan tetap mempertahankan keseriusan moralnya.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי paling wajar memperkenalkan isi yang Allah nyatakan kepada mereka. Makna kausal “karena” tetap mungkin secara umum, tetapi kurang sesuai dengan susunan langsung ayat ini.
- source_word: יִתְגַּבָּרוּ
  choice: mereka telah meninggikan diri
  rationale: Bentuk Hitpael dari גבר secara harfiah berkaitan dengan menjadi kuat atau membuat diri kuat, tetapi dalam konteks pelanggaran kemungkinan menunjuk pada pengagungan diri atau kesombongan. “Meninggikan diri” mempertahankan citra refleksif bahasa sumber tanpa menjadikannya sekadar pernyataan tentang kekuatan.
theological_decisions:
- issue: Nuansa moral יִתְגַּבָּרוּ
  choice: 'pengagungan diri: “mereka telah meninggikan diri”'
  alternative: “mereka telah menjadi kuat” atau “mereka telah berlaku sombong”
  rationale: Kedekatannya dengan “pelanggaran” memberi verba ini daya moral negatif. “Meninggikan diri” menyampaikan kesombongan atau penegasan diri secara angkuh, sekaligus lebih dekat pada ketegangan ungkapan Ibrani daripada parafrasa yang sepenuhnya eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Ia” mengikuti rujukan kontekstual kepada Allah. Struktur ayat dijaga ringkas; penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
