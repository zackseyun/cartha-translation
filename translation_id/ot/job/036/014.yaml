  text: תָּמֹ֣ת בַּ/נֹּ֣עַר נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם בַּ/קְּדֵשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: id
  text: Mereka mati pada masa muda, dan hidup mereka berakhir di antara para pelacur bakti laki-laki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang dibaktikan.” Istilah Ibrani ini kemungkinan menunjuk pada pelacur bakti laki-laki yang berkaitan dengan peribadatan kafir.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: mati
  rationale: Bentuk imperfek Qal dari מות; subjek gramatikalnya adalah נַפְשָׁם dalam arti idiomatis. Bentuk jamak Indonesia mengikuti rujukan kolektif pada orang-orang yang sedang dibicarakan.
- source_word: בַּנֹּעַר
  choice: pada masa muda
  rationale: נֹעַר menunjuk pada masa muda atau tahap awal kehidupan; ungkapan ini alami dan mempertahankan cakupan waktunya.
- source_word: נַפְשָׁם
  choice: mereka
  rationale: נֶפֶשׁ di sini berarti nyawa, hidup, atau diri sebagai pribadi. Terjemahan idiomatis 'mereka mati' menghindari kesan menyesatkan dari ungkapan harfiah 'jiwa mereka mati'.
- source_word: וְחַיָּתָם
  choice: dan hidup mereka berakhir
  rationale: Nomina ini menunjuk pada hidup atau masa hidup. Kata 'berakhir' melengkapi klausa eliptis berdasarkan kesejajaran dengan klausa pertama tanpa mengubah makna pokoknya.
- source_word: בַּקְּדֵשִׁים
  choice: di antara para pelacur bakti laki-laki
  rationale: Dalam pemakaian Alkitab Ibrani, bentuk jamak ini kemungkinan menunjuk pada laki-laki yang terkait dengan praktik seksual dalam peribadatan terlarang. 'Pelacur bakti laki-laki' mempertahankan unsur kultis dan jenis kelamin tanpa memakai istilah tradisional yang lebih bermuatan dan kurang tepat.
theological_decisions:
- issue: Makna קְדֵשִׁים
  choice: pelacur bakti laki-laki
  alternative: orang-orang yang dibaktikan
  rationale: Pemakaian קָדֵשׁ di bagian-bagian lain dan konteks akhir hidup yang memalukan mendukung rujukan kepada pelacuran kultis laki-laki. Namun, hubungan etimologisnya dengan gagasan pembaktian dipertahankan sebagai alternatif dalam catatan kaki karena istilah tersebut dapat diterjemahkan lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. 'Pelacur bakti' dipilih sebagai istilah yang mudah dipahami sekaligus cukup spesifik untuk latar kultis; penambahan 'laki-laki' mencerminkan bentuk dan pemakaian istilah Ibrani.
