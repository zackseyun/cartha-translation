  text: Ia menyelubungi kedua tangan-Nya dengan kilat[a], lalu memerintahkan kilat itu menyambar sasaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “cahaya”; dalam konteks gambaran badai di sekitarnya, kemungkinan yang dimaksud adalah kilat.'
