source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: id
  text: Namun, jika mereka tidak mendengarkan, mereka akan binasa oleh pedang dan mati tanpa pengetahuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena kurang pengetahuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Ungkapan ini memperkenalkan syarat yang berlawanan dengan hasil positif pada ayat sebelumnya; “Namun, jika” menyampaikan hubungan tersebut secara wajar dalam bahasa Indonesia.
- source_word: לֹא יִשְׁמְעוּ
  choice: mereka tidak mendengarkan
  rationale: Kata שׁמע dapat berarti mendengar, mendengarkan, atau menaati. “Mendengarkan” mempertahankan cakupan antara mendengar dan menanggapi tanpa mempersempitnya menjadi ketaatan semata.
- source_word: בְּשֶׁלַח
  choice: oleh pedang
  rationale: שׁלח di sini menunjuk pada alat penghancur, yang dapat dipahami lebih umum sebagai senjata atau proyektil. “Pedang” merupakan padanan kontekstual yang alami dan sesuai dengan gambaran penghukuman.
- source_word: יַעֲבֹרוּ
  choice: mereka akan binasa
  rationale: עבר secara harfiah berarti berlalu atau menyeberang, tetapi dalam konteks penghukuman ini menyatakan berlalunya hidup atau kebinasaan. “Binasa” jelas dan alami serta menghindari ungkapan Indonesia yang kurang idiomatis.
- source_word: וְיִגְוְעוּ
  choice: dan mati
  rationale: גוע berarti mati atau mengembuskan napas terakhir. “Mati” menyampaikan maknanya dengan lugas dan mempertahankan kesejajaran dengan klausa sebelumnya.
- source_word: כִּבְלִי דָעַת
  choice: tanpa pengetahuan
  rationale: Frasa ini secara langsung menggambarkan keadaan tanpa pengetahuan, tetapi juga dapat memiliki nuansa sebab, yakni mati karena kurang pengetahuan; kemungkinan itu dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Apakah שׁמע menunjuk pada sekadar mendengar atau pada tanggapan yang taat
  choice: mereka tidak mendengarkan
  alternative: mereka tidak mendengar; mereka tidak menaati
  rationale: “Mendengarkan” mempertahankan keluasan makna Ibrani yang mencakup penerimaan dan tanggapan terhadap pengajaran, tanpa secara teologis mempersempitnya.
- issue: Apakah כִּבְלִי דָעַת menyatakan keadaan atau sebab
  choice: tanpa pengetahuan
  alternative: karena kurang pengetahuan
  rationale: Konstruksi Ibrani secara alami dapat menyatakan keadaan tanpa pengetahuan, sementara nuansa kausal tetap mungkin. Teks utama mempertahankan bentuk yang lebih langsung dan catatan kaki mencatat alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan kesejajaran antara kebinasaan oleh pedang dan kematian tanpa pengetahuan.
