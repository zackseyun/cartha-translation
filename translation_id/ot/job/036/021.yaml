  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: id
  text: Waspadalah! Jangan berpaling kepada kejahatan,[a] sebab engkau telah memilih hal itu daripada penderitaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kefasikan”; kata Ibrani אָוֶן juga dapat berarti “kesusahan” atau “malapetaka.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sebagai ganti penderitaan” atau “daripada kesengsaraan.” Maksud kalimatnya tampaknya bahwa Ayub telah lebih memilih perbuatan salah daripada penderitaan yang sedang dialaminya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Waspadalah!
  rationale: Bentuk perintah Nifal dari שׁמר menyampaikan peringatan yang tegas. “Waspadalah” alami dalam bahasa Indonesia modern dan mempertahankan daya imperatifnya.
- source_word: אַל תֵּפֶן
  choice: Jangan berpaling
  rationale: Larangan dengan אַל dan verba פנה menyatakan tindakan berbalik atau mengarahkan diri kepada sesuatu. “Jangan berpaling” ringkas dan idiomatis.
- source_word: אֶל אָוֶן
  choice: kepada kejahatan
  rationale: אָוֶן dapat berarti kejahatan, kefasikan, kesusahan, atau malapetaka. Dalam nasihat moral ini, “kejahatan” paling wajar, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi peringatan sebelumnya; “sebab” mempertahankan hubungan penjelas tersebut.
- source_word: עַל זֶה
  choice: hal itu
  rationale: Frasa ini menunjuk kembali kepada perkara yang baru disebutkan, yakni kejahatan. “Hal itu” membuat rujukannya wajar tanpa menghapus kemungkinan nuansa konstruksi Ibraninya.
- source_word: בָּחַרְתָּ
  choice: engkau telah memilih
  rationale: Bentuk perfektum orang kedua tunggal maskulin dari בחר menyatakan pilihan yang telah dibuat dan masih relevan dengan peringatan Elihu.
- source_word: מֵעֹנִי
  choice: daripada penderitaan
  rationale: עֹנִי berarti penderitaan, kesengsaraan, atau kemelaratan. Dalam konteks pengalaman Ayub, “penderitaan” paling sesuai; prefiks מ־ dipahami sebagai perbandingan, yakni memilih yang satu daripada yang lain.
theological_decisions:
- issue: Apakah Elihu menyatakan bahwa Ayub telah memilih kejahatan atau hanya memperingatkannya agar tidak melakukannya?
  choice: 'Mempertahankan bentuk pernyataan langsung: “engkau telah memilih hal itu.”'
  alternative: Melunakkannya menjadi kemungkinan atau peringatan saja, misalnya “jangan sampai engkau memilihnya.”
  rationale: Teks Ibrani memakai perfektum בָּחַרְתָּ, bukan bentuk yang secara eksplisit menyatakan kemungkinan. Terjemahan tidak melunakkan tuduhan atau penilaian Elihu, sekalipun ketegangan dengan peringatan sebelumnya tetap terasa.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Engkau” dipakai karena konteks sapaan langsung puitis dalam kitab Ayub. Tanda seru sesudah “Waspadalah” mempertahankan ketegasan perintah tanpa memakai ungkapan arkais.
