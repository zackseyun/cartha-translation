base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: id
  text: Sesungguhnya, Allah itu agung, dan kita tidak mengenal-Nya[a]; jumlah tahun-Nya tidak dapat diselidiki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dan kita tidak mengetahui.” Objek “-Nya” tersirat dari konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih harfiah, “tidak ada penyelidikan atas jumlah tahun-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sesungguhnya
  rationale: Partikel ini menegaskan pernyataan dan mengarahkan perhatian kepada hal berikutnya. “Sesungguhnya” mempertahankan nada puitis yang luhur tanpa terdengar terlalu kuno.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל merupakan sebutan puitis umum bagi Allah, bukan nama diri yang perlu ditransliterasikan.
- source_word: שַׂגִּיא
  choice: agung
  rationale: Kata sifat ini menyatakan kebesaran atau keluhuran. “Agung” sesuai untuk konteks tentang Allah dan mempertahankan nuansa kemegahan.
- source_word: וְלֹא נֵדָע
  choice: dan kita tidak mengenal-Nya
  rationale: Secara harfiah klausa ini berbunyi “dan kita tidak mengetahui/mengenal.” Objeknya tidak dinyatakan, tetapi Allah merupakan rujukan langsung dalam konteks; akhiran “-Nya” melengkapinya secara wajar dalam bahasa Indonesia tanpa memperluas maknanya menjadi penjelasan tentang ketidakmampuan memahami Allah sepenuhnya.
- source_word: מִסְפַּר
  choice: jumlah
  rationale: Padanan langsung untuk nomina yang menunjuk kepada bilangan atau hitungan tahun.
- source_word: שָׁנָיו
  choice: tahun-Nya
  rationale: Mempertahankan gambaran antropomorfis dan puitis dalam teks Ibrani, tanpa menggantinya dengan istilah teologis seperti “kekekalan-Nya.”
- source_word: וְלֹא חֵקֶר
  choice: tidak terselidiki
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa tidak ada penyelidikan atau penelusuran. “Tidak terselidiki” ringkas, alami dalam puisi hikmat, dan mempertahankan gagasan bahwa jumlah tahun Allah berada di luar jangkauan penyelidikan.
theological_decisions:
- issue: Objek tersirat dalam וְלֹא נֵדָע
  choice: 'Objek Allah dinyatakan melalui “-Nya”: “kita tidak mengenal-Nya.”'
  alternative: 'Membiarkan klausa tanpa objek: “kita tidak mengetahui”; atau memperluasnya menjadi “Ia melampaui pengetahuan kita.”'
  rationale: Bahasa Ibrani tidak menyebut objek secara eksplisit, tetapi konteks langsung menunjuk kepada Allah. Menambahkan “-Nya” merupakan pelengkapan minimal agar klausa alami dalam bahasa Indonesia, sedangkan “melampaui pengetahuan kita” akan menafsirkan lebih jauh daripada bentuk sumber.
- issue: Makna “tahun-Nya”
  choice: Mempertahankan ungkapan “tahun-Nya.”
  alternative: Menafsirkannya sebagai “kekekalan-Nya” atau “masa hidup-Nya.”
  rationale: Teks berbicara secara puitis tentang tahun-tahun Allah. Bentuk langsung ini menjaga gambaran dan ketegangan teologis sumber tanpa memasukkan istilah sistematis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Sesungguhnya” dan “agung” mempertahankan daya tekan serta keluhuran puisi hikmat, sementara susunan kalimat tetap mudah dipahami pembaca umum.
