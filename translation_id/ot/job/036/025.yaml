  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: id
  text: Semua manusia telah melihatnya[a]; insan[b] memandang dari kejauhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk “-nya” dapat dipahami sebagai “Dia” atau “itu”; pronomina Ibraninya maskulin tunggal, tetapi konteks sebelumnya menunjuk kepada karya Allah.
    reason: alternative_reading
  - marker: b
    text: “Manusia” dan “insan” di sini merupakan sebutan umum bagi umat manusia; kata Ibrani אֱנוֹשׁ juga dapat menonjolkan kefanaan manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  choice: Semua manusia
  rationale: Gabungan כָּל dan אָדָם menyatakan seluruh umat manusia secara umum, bukan hanya laki-laki atau seorang individu. “Semua manusia” alami dalam bahasa Indonesia dan mempertahankan cakupan menyeluruhnya.
- source_word: חָזוּ
  choice: telah melihat
  rationale: חזה berarti melihat atau menyaksikan, kadang dengan nuansa mengamati. “Telah melihat” mempertahankan bentuk perfektif verba Ibrani tanpa memakai ungkapan yang arkais.
- source_word: בּוֹ
  choice: -nya
  rationale: Akhiran pronominal maskulin tunggal ini dapat menunjuk kepada Allah atau kepada karya-Nya yang disebut dalam konteks sebelumnya. Bentuk Indonesia “-nya” secara alami mempertahankan ketaksaan tersebut.
- source_word: אֱנוֹשׁ
  choice: insan
  rationale: אֱנוֹשׁ menunjuk kepada manusia, sering dengan nuansa kefanaan atau kelemahan. “Insan” mempertahankan corak puitis dan tetap merupakan sebutan umum bagi manusia.
- source_word: יַבִּיט
  choice: memandang
  rationale: Bentuk Hifil dari נבט berarti melihat atau mengarahkan pandangan. “Memandang” lebih kuat daripada “melihat” dan cocok dengan gaya puisi tanpa terdengar kuno.
- source_word: מֵרָחוֹק
  choice: dari kejauhan
  rationale: Ungkapan ini menyatakan bahwa pandangan dilakukan dari jarak jauh. “Dari kejauhan” ringkas, alami, dan puitis dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan pronomina בּוֹ
  choice: Menggunakan “-nya” untuk mempertahankan kemungkinan rujukan kepada Allah maupun kepada karya-Nya.
  alternative: Memperjelasnya sebagai “Dia” atau “karya itu”.
  rationale: Secara gramatikal pronomina Ibrani itu maskulin tunggal, sedangkan konteks dekat menyebut karya Allah. Bahasa Indonesia memungkinkan ketaksaan asli ini dipertahankan tanpa menentukan salah satu rujukan secara paksa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. Paralelisme dua larik dipertahankan melalui “semua manusia” dan “insan”, sedangkan “dari kejauhan” menjaga nada luhur tanpa menjadi arkais.
