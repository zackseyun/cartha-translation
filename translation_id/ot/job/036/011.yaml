base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: id
  text: Jika mereka mendengarkan[a] dan melayani, mereka akan menjalani hari-hari mereka dalam kesejahteraan dan tahun-tahun mereka dalam kenikmatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaati”; kata Ibrani yang diterjemahkan “mendengarkan” juga dapat berarti mendengar dengan sikap taat.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “menghabiskan hari-hari mereka dalam kebaikan dan tahun-tahun mereka dalam hal-hal yang menyenangkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Menandai syarat secara langsung dan mempertahankan bentuk kondisional dalam perkataan Elihu.
- source_word: יִשְׁמְעוּ
  choice: mereka mendengarkan
  rationale: Kata שׁמע dapat berarti mendengar, mendengarkan, atau menaati. 'Mendengarkan' mempertahankan arti dasarnya sekaligus memungkinkan nuansa tanggapan yang taat dalam konteks.
- source_word: וְיַעֲבֹדוּ
  choice: dan mengabdi
  rationale: Kata עבד berarti melayani atau mengabdi. 'Mengabdi' terdengar alami ketika objek tersiratnya adalah Allah dan tidak membatasi makna pada ibadah ritual saja.
- source_word: יְכַלּוּ
  choice: mereka akan menjalani
  rationale: Dalam bentuk piel dan bersama 'hari-hari' serta 'tahun-tahun', כלה menyatakan menghabiskan atau menuntaskan masa hidup. 'Menjalani' menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: יְמֵיהֶם
  choice: hari-hari mereka
  rationale: Terjemahan langsung yang mempertahankan citra dan kesejajaran puisi Ibrani.
- source_word: בַּטּוֹב
  choice: dalam kesejahteraan
  rationale: טוב yang dipakai sebagai nomina menunjuk pada keadaan baik atau makmur; 'kesejahteraan' cukup luas dan tidak hanya menyiratkan kekayaan materi.
- source_word: וּשְׁנֵיהֶם
  choice: dan tahun-tahun mereka
  rationale: Mempertahankan kesejajaran puitis dengan 'hari-hari mereka'.
- source_word: בַּנְּעִימִים
  choice: dalam kenikmatan
  rationale: Bentuk jamak נְעִימִים menunjuk pada hal-hal yang menyenangkan atau nikmat. 'Kenikmatan' wajar dalam bahasa Indonesia dan mempertahankan sifat umum ungkapan itu.
theological_decisions:
- issue: Apakah ayat ini menjanjikan kemakmuran materi sebagai prinsip teologis yang mutlak
  choice: Pernyataan bersyarat Elihu diterjemahkan apa adanya sebagai kehidupan dalam keadaan baik dan menyenangkan.
  alternative: Menjadikannya jaminan universal bahwa ketaatan selalu menghasilkan kemakmuran duniawi, atau menafsirkannya semata-mata sebagai berkat rohani.
  rationale: Teks Ibrani menyampaikan klaim bersyarat dalam pidato Elihu. Terjemahan tidak boleh memperluasnya menjadi doktrin universal ataupun menghilangkan rujukan wajarnya pada keadaan hidup yang baik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Mengabdi' dipilih daripada 'melayani' agar hubungan dengan Allah yang tersirat terdengar alami, tanpa mempersempitnya menjadi ibadah ritual. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
