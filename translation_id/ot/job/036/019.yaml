  yaml_path: translation/ot/job/036/019.yaml
  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: id
  text: Apakah seruanmu akan berguna ketika kesesakan datang?[a][b] Atau apakah segala pengerahan kekuatanmu akan berguna?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani ayat ini sulit, khususnya ungkapan yang diterjemahkan “seruanmu” dan “ketika kesesakan datang.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau, menurut penafsiran lain atas bahasa Ibrani yang sulit: “Apakah kekayaanmu akan berguna sehingga engkau tidak berada dalam kesesakan, atau segala daya kekuatanmu?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: apakah ... akan berguna
  rationale: Kata kerja ערך biasanya berarti “mengatur” atau “menata,” tetapi dalam baris puisi yang sulit ini kemungkinan dipakai dengan arti idiomatis “berguna” atau “mencukupi.” Bentuk pertanyaan dipertahankan.
- source_word: שׁוּעֲךָ
  choice: seruanmu
  rationale: Vokalisasi Teks Masoret mendukung pemahaman שׁוע sebagai seruan minta tolong. Kemungkinan “kekayaanmu” dicatat dalam catatan kaki karena teks ini memang sulit.
- source_word: לֹא בְצָר
  choice: ketika kesesakan datang
  rationale: Secara harfiah לֹא adalah “tidak” dan בְצָר berkaitan dengan kesesakan. Dalam susunan puitis yang padat ini, frasa tersebut dipahami secara idiomatis sebagai keadaan ketika kesesakan datang; konstruksi negatif yang lebih harfiah dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: וְכֹל
  choice: atau ... segala
  rationale: Walaupun וְ biasanya berarti “dan,” di sini unsur kedua melanjutkan pertanyaan retoris dengan menyebut sumber daya lain yang juga tidak akan berguna. “Atau” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: מַאֲמַצֵּי כֹחַ
  choice: segala pengerahan kekuatanmu
  rationale: Ungkapan ini memadukan gagasan upaya atau pengerahan dengan kekuatan. Akhiran milik “-mu” dibuat eksplisit berdasarkan sapaan langsung dan kesejajaran baris.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pertanyaan kedua dibuat lengkap dengan mengulang “apakah ... akan berguna” agar jelas dan alami bagi pembaca Indonesia, sambil mempertahankan kesejajaran retoris teks Ibrani.
