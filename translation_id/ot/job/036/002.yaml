translation:
  language: id
  text: Tunggulah aku sebentar, dan aku akan menunjukkan kepadamu, sebab masih ada lagi perkataan bagi Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebab masih ada lagi perkataan bagi Allah.” Frasa ini dapat berarti bahwa Elihu masih hendak berbicara demi Allah, membela Allah, atau mengenai Allah.'
    reason: Catatan ini menjelaskan bentuk harfiah serta mempertahankan ambiguitas preposisi לְ yang tidak dapat diwakili sepenuhnya oleh satu ungkapan Indonesia.
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: Bersabarlah sebentar terhadap aku
  rationale: Ungkapan ini meminta pendengar menanggung atau menantikan pembicara sedikit lebih lama; terjemahan ini mempertahankan unsur kesabaran dan objek orang pertama.
- source_word: וַאֲחַוֶּךָּ
  choice: dan aku akan menjelaskannya kepadamu
  rationale: Bentuk verba ini berarti menyatakan, memberitahukan, atau menjelaskan. Akhiran orang kedua tunggal diterjemahkan eksplisit sebagai 'kepadamu'; '-nya' merujuk pada hal yang masih akan disampaikan.
- source_word: כִּי עוֹד ... מִלִּים
  choice: sebab masih ada yang hendak kukatakan
  rationale: Secara harfiah, 'sebab masih ada perkataan-perkataan'; idiom Indonesia ini menyampaikan bahwa Elihu masih memiliki sesuatu untuk dikatakan tanpa terdengar kaku.
- source_word: לֶאֱלוֹהַּ
  choice: bagi Allah
  rationale: Preposisi ל dapat menyatakan arah, kepentingan, atau pihak yang dibela. 'Bagi Allah' mempertahankan keluasan hubungan itu dan selaras dengan teks konsultasi, tanpa memutuskannya secara sempit menjadi 'atas nama Allah'.
theological_decisions:
- issue: Arah perkataan Elihu dalam frasa לֶאֱלוֹהַּ
  choice: bagi Allah
  alternative: atas nama Allah / tentang Allah
  rationale: Bahasa sumber memakai preposisi ל yang ringkas dan berpotensi ambigu. 'Bagi Allah' menjaga ketegangan apakah perkataan itu demi Allah, dalam pembelaan terhadap-Nya, atau mengenai-Nya, tanpa mengklaim bahwa Elihu menerima mandat ilahi khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada santun dan bermartabat. 'Bersabarlah' lebih alami daripada 'tanggunglah aku', sedangkan 'menjelaskannya kepadamu' menyampaikan tindakan menyatakan atau menerangkan secara jelas.
