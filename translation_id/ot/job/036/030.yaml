  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: id
  text: Lihatlah, Dia membentangkan cahaya-Nya di atasnya[a][b] dan menutupi akar-akar laut.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata “-nya” menerjemahkan kata ganti maskulin tunggal dalam bahasa Ibrani. Rujukannya tidak disebutkan secara tegas dan mungkin berkaitan dengan awan atau badai dalam konteks ayat-ayat ini; atau: “di atas dia.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “kilat-Nya” atau “sinar terang-Nya.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “akar-akar laut,” yang mungkin berarti bagian laut yang paling dalam atau bagian dasarnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian kepada gambaran yang menyusul. “Lihatlah” mempertahankan daya puitisnya dalam bahasa Indonesia modern.
- source_word: פָּרַשׂ
  choice: membentangkan
  rationale: Kata kerja ini berarti membentangkan atau menghamparkan. “Membentangkan” secara alami mempertahankan gambaran perluasan cahaya.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Akhiran pronominal Ibrani berbentuk maskulin tunggal, tetapi rujukannya tidak dinyatakan. Bentuk Indonesia “-nya” mempertahankan ketidakjelasan itu tanpa memaksakan rujukan kepada orang.
- source_word: אוֹרוֹ
  choice: cahaya-Nya
  rationale: Makna dasarnya ialah “cahaya-Nya.” Dalam konteks badai, kata ini dapat menunjuk kepada kilat atau sinar terang, tetapi istilah yang lebih luas dipertahankan dalam teks utama.
- source_word: וְשָׁרְשֵׁי
  choice: dan ... akar-akar
  rationale: Terjemahan harfiahnya ialah “akar-akar.” Citra puitis Ibrani ini dipertahankan, sementara kemungkinan makna kiasannya dijelaskan dalam catatan kaki.
- source_word: הַיָּם
  choice: laut
  rationale: Kata ini secara langsung berarti “laut”; menerjemahkannya sebagai “air” akan memperluas makna leksikalnya.
- source_word: כִּסָּה
  choice: menutupi
  rationale: Kata kerja ini berarti “menutupi.” Bentuk kini cocok dengan rangkaian gambaran puitis dan tidak menambahkan gagasan “menyembunyikan” yang hanya tersirat.
theological_decisions:
- issue: Rujukan kata ganti dalam עָלָיו
  choice: Memakai “di atasnya” dan membiarkan rujukannya tidak ditentukan dalam teks utama.
  alternative: Menafsirkannya secara eksplisit sebagai “di atas awan itu,” “di atas badai itu,” atau “di atas diri-Nya.”
  rationale: Teks Ibrani hanya memberikan kata ganti maskulin tunggal tanpa menyatakan antesedennya. Menambahkan rujukan tertentu akan menyelesaikan ambiguitas yang masih terdapat dalam teks sumber.
- issue: Subjek verba כִּסָּה
  choice: 'Mempertahankan Allah sebagai subjek tersirat: “Dia ... menutupi.”'
  alternative: 'Memahami “cahaya-Nya” sebagai subjek: “cahaya itu menutupi.”'
  rationale: Rangkaian verba paling wajar meneruskan Allah sebagai pelaku dari klausa pertama, walaupun bentuk maskulin tunggal memungkinkan hubungan sintaksis lain secara formal.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. “Lihatlah” menjaga fungsi penarik perhatian dari הֵן; “akar-akar laut” mempertahankan metafora sumber. Kapitalisasi “Dia” dan “-Nya” menandai rujukan kepada Allah sesuai kebiasaan penerbitan Alkitab bahasa Indonesia, tanpa menambahkan gelar atau penafsiran doktrinal.
