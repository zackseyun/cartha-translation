  text: כִּי בָ֭/ם יָדִ֣ין עַמִּ֑ים יִֽתֶּן אֹ֥כֶל לְ/מַכְבִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: id
  text: Sebab melalui hal-hal itu Dia menghakimi bangsa-bangsa; Dia memberikan makanan dengan berlimpah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם (vām)
  choice: melalui hal-hal itu
  rationale: Pronomina jamak ini menunjuk kembali pada gejala-gejala yang dibicarakan sebelumnya. Ungkapan ini mempertahankan rujukan anaforisnya tanpa menetapkan secara lebih khusus apa saja yang dimaksud.
- source_word: יָדִין (yāḏîn)
  choice: menghakimi
  rationale: Bentuk ini berasal dari דין dan menyatakan tindakan menjalankan penghakiman; padanan ini mempertahankan bobot yudisialnya.
- source_word: עַמִּים (‘ammîm)
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini secara wajar diterjemahkan sebagai berbagai bangsa atau kelompok bangsa.
- source_word: יִתֶּן אֹכֶל (yitten ’ōḵel)
  choice: memberikan makanan
  rationale: Terjemahan langsung yang mempertahankan tindakan memberi dan objek konkret berupa makanan.
- source_word: לְמַכְבִּיר (ləmaḵbîr)
  choice: dengan berlimpah
  rationale: Ungkapan ini berfungsi adverbial dan menyatakan kelimpahan pemberian makanan.
theological_decisions:
- issue: Hubungan antara penghakiman dan pemeliharaan ilahi
  choice: 'Kedua tindakan dipertahankan berdampingan tanpa penjelasan tambahan: Dia menghakimi dan memberikan makanan.'
  alternative: Menafsirkan pemberian makanan sebagai hasil langsung atau tujuan penghakiman.
  rationale: Teks Ibrani menyandingkan kedua klausa, tetapi tidak secara eksplisit menjelaskan hubungan logis yang lebih khusus di antara keduanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “Dia” merujuk kepada Allah dalam konteks, sedangkan “hal-hal itu” sengaja dibiarkan anaforis agar tidak mempersempit rujukan jamak בָם.
