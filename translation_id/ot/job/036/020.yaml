  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: id
  text: Jangan merindukan malam[a], ketika bangsa-bangsa disingkirkan dari tempat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Jangan merindukan malam, ketika bangsa-bangsa naik di bawah mereka.” Teks Ibrani di sini sulit; “disingkirkan dari tempat mereka” mencerminkan pemahaman kontekstual yang umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁאַף
  choice: Jangan merindukan
  rationale: אַל dengan bentuk imperfek menyatakan larangan, sedangkan שׁאף di sini menunjuk pada hasrat atau kerinduan yang kuat. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan daya larang teks.
- source_word: הַלָּיְלָה
  choice: malam
  rationale: Padanan langsung bagi nomina definit ini; dalam bahasa Indonesia, makna definitnya sudah jelas dari konteks tanpa kata sandang.
- source_word: לַעֲלוֹת
  choice: ketika ... disingkirkan
  rationale: Infinitif dari עלה secara harfiah berarti 'naik', tetapi susunan ayat ini sangat sulit. Dalam konteks penghakiman pada malam hari, terjemahan temporal-pasif ini menyampaikan pemahaman kontekstual yang umum tanpa menyembunyikan kesulitan Ibraninya, yang dijelaskan dalam catatan kaki.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada kelompok-kelompok manusia secara kolektif. 'Bangsa-bangsa' lebih wajar daripada 'kaum-kaum' dalam bahasa Indonesia modern dan mempertahankan makna korporatnya.
- source_word: תַּחְתָּם
  choice: dari tempat mereka
  rationale: Kata תחת secara dasar berarti 'di bawah', tetapi di sini kemungkinan besar berkaitan dengan tersingkirnya bangsa-bangsa dari kedudukan atau tempat mereka. Pilihan ini memberikan makna kontekstual yang masuk akal, sementara arti harfiahnya dicatat dalam catatan kaki.
