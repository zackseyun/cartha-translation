  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: id
  text: Ingatlah untuk mengagungkan karya-Nya, yang telah dinyanyikan[a] oleh manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah dilihat oleh manusia” atau “yang telah direnungkan oleh manusia.” Kata kerja Ibrani שֹׁרְרוּ sulit ditafsirkan; sebagian memahaminya dalam arti melihat, bukan menyanyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Imperatif maskulin tunggal dari זכר; bentuk ini merupakan seruan langsung yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang harus diingat, bukan alasan sebab-akibat.
- source_word: תַשְׂגִּיא
  choice: engkau harus mengagungkan
  rationale: Bentuk Hifil dari שׂגא/שׂגה menyampaikan gagasan membuat besar atau meninggikan. Susunan ini mempertahankan daya nasihat setelah imperatif זְכֹר dan terdengar alami dalam bahasa Indonesia.
- source_word: פָעֳלוֹ
  choice: karya-Nya
  rationale: פֹּעַל dapat menunjuk pada karya, perbuatan, atau kegiatan. 'Karya-Nya' ringkas dan cukup luas untuk mencakup perbuatan Allah; kapitalisasi memperjelas rujukan kontekstual tanpa menambahkan nama ke dalam teks.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini mengaitkan 'karya-Nya' dengan klausa berikutnya secara alami.
- source_word: שֹׁרְרוּ
  choice: telah dinyanyikan
  rationale: Bentuk Ibrani yang sulit ini secara tradisional dipahami berhubungan dengan menyanyi atau merayakan dalam nyanyian. Bentuk pasif Indonesia menghasilkan hubungan yang alami dengan 'karya-Nya'; kemungkinan makna melihat atau merenungkan dipertahankan dalam catatan kaki.
- source_word: אֲנָשִׁים
  choice: manusia
  rationale: Dalam konteks ini bentuk jamak maskulin tersebut merujuk secara representatif kepada manusia. Bahasa Indonesia tidak menuntut pembedaan gender gramatikal, dan 'manusia' mempertahankan cakupan umum tanpa menambahkan pembatasan yang tidak diperlukan.
theological_decisions:
- issue: Rujukan akhiran orang ketiga maskulin tunggal pada פָעֳלוֹ
  choice: karya-Nya, yakni karya Allah menurut konteks
  alternative: karyanya
  rationale: Konteks perkataan Elihu membahas Allah dan karya-karya-Nya. Teks tetap memakai pronomina seperti bahasa Ibrani, sedangkan kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah.
- issue: Cakupan אֲנָשִׁים
  choice: manusia
  alternative: orang-orang lelaki
  rationale: Nomina Ibrani berbentuk maskulin jamak, tetapi dapat berfungsi secara umum bagi manusia. 'Manusia' merupakan padanan Indonesia yang alami dan tidak menyelesaikan ketegangan teologis apa pun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina 'engkau' mempertahankan sapaan tunggal. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dipersoalkan.
