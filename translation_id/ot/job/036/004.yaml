  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: id
  text: Sebab, sungguh, kata-kataku bukan dusta; yang sempurna dalam pengetahuan ada bersamamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “yang sempurna dalam pengetahuan” mungkin menunjuk kepada Allah, bukan kepada Elihu sendiri.
    reason: Mempertahankan kemungkinan alternatif mengenai acuan frasa תְּמִים דֵּעוֹת tanpa membatasi subjek dalam teks utama.
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: Sebab sungguh
  rationale: כִּי menghubungkan pernyataan ini dengan alasan Elihu untuk melanjutkan bicaranya, sedangkan אָמְנָם menegaskan kebenaran pernyataan itu. Gabungan ini mempertahankan fungsi penjelas dan penegas teks Ibrani.
- source_word: לֹא שֶׁקֶר
  choice: tidak dusta
  rationale: Ungkapan ini menyangkal kepalsuan perkataan Elihu. 'Tidak dusta' ringkas, wajar, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: מִלָּי
  choice: perkataanku
  rationale: Bentuk jamak dengan akhiran orang pertama tunggal merujuk pada kata-kata atau ucapan Elihu; dalam bahasa Indonesia, nomina kolektif 'perkataanku' menyampaikannya secara alami.
- source_word: תְּמִים דֵּעוֹת
  choice: seorang yang sempurna pengetahuannya
  rationale: תְּמִים menyatakan keutuhan atau kesempurnaan, dan דֵּעוֹת adalah bentuk jamak abstrak yang secara alami dapat diterjemahkan dengan bentuk tunggal 'pengetahuan'. Susunan ini mempertahankan keberanian retoris pernyataan Elihu tanpa menambahkan pengertian kesempurnaan moral.
- source_word: עִמָּךְ
  choice: ada bersamamu
  rationale: Preposisi עִם dengan akhiran orang kedua tunggal berarti 'bersamamu'. Penambahan 'ada' menghasilkan predikasi keberadaan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan frasa 'seorang yang sempurna pengetahuannya'
  choice: Dalam teks utama, frasa ini paling langsung dibaca sebagai sebutan Elihu bagi dirinya sendiri.
  alternative: Frasa itu mungkin menunjuk kepada Allah sebagai Yang sempurna dalam pengetahuan dan hadir bersama Ayub.
  rationale: Konteks langsung berisi pembelaan Elihu atas kebenaran perkataannya sendiri, sehingga acuan kepada dirinya paling alami. Namun, bahasa Ibraninya tidak menyebut subjek secara eksplisit dan memungkinkan acuan kepada Allah; kemungkinan ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur paralel serta ketegasan retoris Elihu dipertahankan, sementara ambiguitas mengenai subjek klausa terakhir dijelaskan dalam catatan kaki.
