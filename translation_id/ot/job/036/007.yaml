base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: id
  text: Ia tidak memalingkan mata-Nya dari orang benar, tetapi mendudukkan mereka bersama raja-raja di atas takhta untuk selama-lamanya,[a] dan mereka ditinggikan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan raja-raja di atas takhta—Ia mendudukkan mereka untuk selama-lamanya.” Susunan bahasa Ibrani sangat padat; klausa ini juga dapat dipahami sebagai berbicara langsung tentang para raja, bukan tentang orang benar yang didudukkan bersama raja-raja.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “dan Ia meninggikan mereka.” Verba terakhir dapat dipahami secara aktif dengan Allah sebagai subjek yang tersirat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: memalingkan
  rationale: Kata גרע berarti mengurangi, mengambil, atau menyingkirkan. Bersama objek “mata-Nya”, “memalingkan” menyampaikan secara alami bahwa Allah tidak berhenti memperhatikan, sekaligus mempertahankan gambaran konkret bahasa Ibrani.
- source_word: מִצַּדִּיק
  choice: dari orang benar
  rationale: Bentuk tunggal ini berfungsi secara generik atau kolektif. “Orang benar” wajar dalam bahasa Indonesia dan tidak membatasi rujukannya pada satu laki-laki tertentu.
- source_word: עֵינָיו
  choice: mata-Nya
  rationale: Terjemahan konkret ini mempertahankan ungkapan antropomorfis teks Ibrani dan tidak mengaburkannya menjadi “perhatian-Nya”.
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: bersama raja-raja di atas takhta
  rationale: Frasa Ibrani sangat padat dan eliptis. Pilihan ini memahami orang benar sebagai pihak yang ditempatkan dalam kehormatan kerajaan bersama para raja, tanpa menambahkan gagasan “menobatkan” yang lebih tegas daripada teks.
- source_word: וַיֹּשִׁיבֵם
  choice: mendudukkan mereka
  rationale: Bentuk Hifil dari ישׁב berarti menyebabkan duduk atau mendudukkan. Pilihan ini cukup harfiah, jelas, dan sesuai dengan konteks takhta.
- source_word: לָנֶצַח
  choice: untuk selama-lamanya
  rationale: Frasa ini menyatakan durasi yang terus berlangsung; “untuk selama-lamanya” merupakan padanan Indonesia yang alami dalam ragam puitis dan khidmat.
- source_word: וַיִּגְבָּהוּ
  choice: mereka ditinggikan
  rationale: Klausa penutup menyatakan bahwa mereka menjadi tinggi atau mulia. Bentuk pasif-resultatif Indonesia mempertahankan kepadatan ungkapan dan tidak terlalu menentukan pelaku gramatikalnya.
theological_decisions:
- issue: Bahasa antropomorfis tentang perhatian Allah
  choice: Mempertahankan ungkapan konkret “mata-Nya”.
  alternative: Menggunakan “pandangan-Nya”, “perhatian-Nya”, atau “pemeliharaan-Nya”.
  rationale: Teks menggambarkan perhatian Allah yang tidak putus melalui citra mata. Citra itu dipertahankan agar bahasa puitis sumber tidak diratakan menjadi abstraksi.
- issue: Rujukan kata ganti “mereka” dalam klausa kerajaan
  choice: Memahami “mereka” sebagai orang benar yang didudukkan bersama raja-raja di atas takhta.
  alternative: Memahaminya sebagai para raja yang didudukkan Allah, atau sebagai orang benar yang dijadikan raja.
  rationale: “Orang benar” yang bersifat kolektif dapat secara alami menjadi anteseden kata ganti jamak. Namun, karena susunan Ibrani padat, pembacaan yang menjadikan “raja-raja” objek langsung tetap dicatat dalam catatan kaki.
- issue: Pelaku pada verba penutup
  choice: 'Menerjemahkan secara pasif-resultatif: “mereka ditinggikan”.'
  alternative: 'Menerjemahkan secara aktif dengan Allah sebagai subjek tersirat: “Ia meninggikan mereka”.'
  rationale: Pilihan utama mempertahankan ketegangan sintaksis klausa yang singkat dan menonjolkan keadaan mulia yang dihasilkan tanpa memaksakan subjek tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapitalisasi pronomina ilahi dipakai secara konsisten. Struktur kalimat dibuat mengalir, tetapi citra “mata-Nya”, ungkapan kerajaan, dan ambiguitas klausa penutup tetap dipertahankan.
