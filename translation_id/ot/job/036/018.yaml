id: JOB.36.18
reference: Job 36:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: id
  text: Sebab, waspadalah agar amarah tidak membujukmu untuk mencemooh[a], dan jangan biarkan tebusan yang besar[b] membelokkanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membujukmu dengan tepukan tangan.” Kata Ibrani ini sulit dan mungkin secara harfiah menunjuk pada memukul atau menepukkan tangan, barangkali sebagai isyarat ejekan.
    reason: lexical_alternative
  - marker: b
    text: “Tebusan” juga dapat berarti “harga pendamaian” atau, dalam konteks tertentu, “suap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal yang menghubungkan peringatan ini dengan konteks sebelumnya.
- source_word: חֵמָה
  choice: amarah
  rationale: Menyampaikan panas dan kuatnya kemarahan tanpa menentukan apakah yang dimaksud ialah amarah Ayub, murka ilahi, atau amarah secara umum.
- source_word: פֶּן
  choice: waspadalah agar ... tidak
  rationale: Mengungkapkan daya peringatan partikel Ibrani secara wajar dalam bahasa Indonesia.
- source_word: יְסִיתְךָ
  choice: membujukmu
  rationale: Bentuk kausatif dari סות menunjuk pada tindakan menghasut, membujuk, atau menyesatkan seseorang menuju tindakan yang keliru.
- source_word: בְסָפֶק
  choice: untuk mencemooh
  rationale: Istilah ini sulit dan mungkin berkaitan dengan tepukan atau pukulan tangan sebagai isyarat ejekan; terjemahan utama menyampaikan makna idiomatis yang mungkin dimaksud.
- source_word: רָב כֹּפֶר
  choice: tebusan yang besar
  rationale: רָב secara alami menerangkan besarnya כֹּפֶר, sedangkan 'tebusan' mempertahankan cakupan makna pembayaran untuk menghindarkan akibat tanpa mempersempitnya menjadi 'suap'.
- source_word: אַל יַטֶּךָּ
  choice: jangan biarkan ... membelokkanmu
  rationale: Mempertahankan gambaran penyimpangan dari arah atau jalan yang semestinya.
theological_decisions:
- issue: Acuan kata 'amarah'
  choice: Dibiarkan tanpa pemilik atau sumber yang disebutkan.
  alternative: '''murka Allah'' atau ''amarahmu'''
  rationale: Teks Ibrani tidak menyatakan secara eksplisit siapa yang marah; terjemahan tidak menutup kemungkinan-kemungkinan kontekstual tersebut.
- issue: Makna כֹּפֶר
  choice: tebusan
  alternative: harga pendamaian atau suap
  rationale: Kata ini memiliki rentang makna teologis dan hukum yang cukup luas. 'Tebusan' paling sedikit membatasi tafsiran, sedangkan kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hikmat yang bermartabat. Susunan peringatan dibuat alami tanpa menghilangkan ambiguitas mengenai sumber amarah dan arti khusus dari tebusan.
