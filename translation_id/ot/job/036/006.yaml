id: JOB.36.6
reference: Job 36:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא יְחַיֶּ֥ה רָשָׁ֑ע וּ/מִשְׁפַּ֖ט עֲנִיִּ֣ים יִתֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: id
  text: Ia tidak membiarkan orang fasik tetap hidup[a], tetapi memberikan keadilan kepada orang-orang yang tertindas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memelihara orang fasik tetap hidup.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang miskin” atau “orang-orang yang menderita.” Kata Ibrani ini dapat menunjuk kepada orang yang rendah, tertindas, menderita, atau miskin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: membiarkan ... tetap hidup
  rationale: Bentuk Piel dari חיה dalam konteks ini menunjuk pada mempertahankan atau membiarkan tetap hidup, bukan membangkitkan atau memberi hidup dalam arti teologis.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini berfungsi secara generik; bentuk tunggal generik alami dalam bahasa Indonesia.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Di sini kata tersebut menunjuk pada hak atau hasil yang adil bagi mereka yang tertindas, bukan sekadar tindakan penghakiman.
- source_word: עֲנִיִּים
  choice: orang-orang yang tertindas
  rationale: Istilah ini dapat mencakup orang yang menderita, tertindas, rendah kedudukannya, atau miskin. Pilihan ini mempertahankan dimensi penderitaan dan penindasan tanpa membatasinya pada kemiskinan ekonomi.
- source_word: יִתֵּן
  choice: memberikan
  rationale: Menerjemahkan makna dasar נתן secara langsung dan wajar dalam frasa 'memberikan keadilan'.
- source_word: וּ
  choice: tetapi
  rationale: Meskipun bentuk dasarnya berarti 'dan', hubungan antarklausa bersifat kontras sehingga 'tetapi' menyampaikan alur puisi dengan jelas.
theological_decisions:
- issue: Apakah יְחַיֶּה menyiratkan kebangkitan atau pemberian hidup dalam arti teologis
  choice: membiarkan ... tetap hidup
  alternative: menghidupkan; memberi hidup kepada
  rationale: Konteksnya adalah pemerintahan Allah yang adil dan pemeliharaan hidup dalam masa kini. Terjemahan yang menyiratkan kebangkitan akan memasukkan gagasan yang tidak dituntut oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang fasik' mempertahankan register Alkitabiah yang masih dipahami luas; 'orang-orang yang tertindas' dipilih untuk menyampaikan cakupan sosial dan penderitaan dari עֲנִיִּים.
