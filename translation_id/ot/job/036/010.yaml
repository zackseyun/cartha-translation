  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: id
  text: Ia membuka telinga mereka untuk menerima didikan[a] dan berkata agar mereka berbalik dari kejahatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyingkapkan telinga mereka bagi teguran” atau “membuka telinga mereka untuk menerima disiplin.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kejahatan” juga dapat berarti “kefasikan” atau, dalam konteks tertentu, “kesusahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: membuka
  rationale: Dalam ungkapan dengan 'telinga' sebagai objek, bentuk dari גלה berarti membuka atau menyingkapkan telinga agar mau mendengar; 'membuka' mempertahankan metafora dan alami dalam bahasa Indonesia.
- source_word: אָזְנָם
  choice: telinga mereka
  rationale: Nomina Ibrani berbentuk tunggal dengan sufiks orang ketiga jamak. Bahasa Indonesia dapat mempertahankan bentuk tunggal kolektif dalam ungkapan ini.
- source_word: לַמּוּסָר
  choice: untuk menerima didikan
  rationale: מוּסָר mencakup didikan, teguran, dan disiplin korektif. 'Didikan' alami dan tetap memuat unsur pembelajaran serta koreksi; 'menerima' menjelaskan daya ungkapan idiomatis membuka telinga tanpa mengubah maksud.
- source_word: וַיֹּאמֶר
  choice: dan menyuruh mereka
  rationale: Secara harfiah berarti 'dan berkata', tetapi klausa isi dengan יְשֻׁבוּן menyampaikan arahan agar mereka berbalik. 'Menyuruh mereka' mengungkapkan fungsi ujaran secara alami tanpa menaikkannya menjadi paksaan mutlak.
- source_word: כִּי
  choice: (tercakup dalam konstruksi menyuruh ... berbalik)
  rationale: כִּי memperkenalkan isi perkataan. Dalam bahasa Indonesia, hubungan ini tersampaikan secara alami oleh konstruksi 'menyuruh mereka berbalik' tanpa padanan tersendiri.
- source_word: יְשֻׁבוּן
  choice: berbalik
  rationale: שׁוב berarti kembali atau berbalik. Dalam konteks moral dan ujaran tidak langsung ini, 'berbalik' menyampaikan seruan meninggalkan perbuatan yang salah.
- source_word: מֵאָוֶן
  choice: dari kejahatan
  rationale: אָוֶן dapat berarti kejahatan, kefasikan, kesalahan, atau kesusahan. Konteks seruan moral mendukung 'kejahatan', ungkapan yang alami dan mudah dipahami.
theological_decisions:
- issue: Sifat מוּסָר dalam perkataan Elihu
  choice: didikan yang juga bersifat korektif
  alternative: pengajaran yang terutama mendidik; disiplin atau hajaran dengan tekanan hukuman yang lebih kuat
  rationale: Konteks menggambarkan penderitaan sebagai sarana untuk mengajar dan memanggil manusia meninggalkan kejahatan. 'Didikan' mempertahankan hubungan antara pengajaran dan koreksi tanpa menetapkan teori teologis tertentu mengenai penderitaan.
- issue: Daya ujaran וַיֹּאמֶר כִּי יְשֻׁבוּן
  choice: menyuruh mereka berbalik
  alternative: berkata bahwa mereka harus berbalik; mengatakan agar mereka berbalik
  rationale: Bentuk Ibrani dapat dipahami sebagai isi perkataan yang bersifat arahan. Pilihan ini menyampaikan desakan moral secara alami tanpa menambahkan tingkat kemutlakan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang lugas dan bermartabat. Metafora 'membuka telinga' dipertahankan, sedangkan hubungan sintaksis dibuat alami melalui 'untuk menerima' dan 'menyuruh mereka'.
