base_translation:
  language: en
  yaml_path: translation/ot/job/036/022.yaml
  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: id
  text: Sesungguhnya, Allah luhur dalam kuasa-Nya[a]; siapakah pengajar seperti Dia?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oleh kuasa-Nya” atau “dengan kekuatan-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Siapakah yang seperti Dia sebagai pengajar?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sesungguhnya
  rationale: Partikel ini menarik perhatian dan menegaskan pernyataan. “Sesungguhnya” mempertahankan nada puisi yang luhur tanpa terdengar terlalu percakapan.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל merupakan sebutan ilahi yang merujuk kepada Allah, bukan nama diri yang perlu ditransliterasikan.
- source_word: יַשְׂגִּיב
  choice: luhur
  rationale: Bentuk Hifil dari שׂגב menyatakan ketinggian atau keluhuran. “Luhur” menyampaikan keadaan Allah yang tinggi atau mulia secara ringkas tanpa mempersempitnya menjadi tindakan tertentu.
- source_word: בְּכֹחוֹ
  choice: dalam kuasa-Nya
  rationale: Preposisi ב dapat menunjukkan lingkup, cara, atau sarana. “Dalam kuasa-Nya” mempertahankan kekompakan dan keluwesan ungkapan Ibrani; kemungkinan instrumental dicatat dalam catatan kaki.
- source_word: מִי כָמֹהוּ
  choice: siapakah ... seperti Dia?
  rationale: Pertanyaan retoris komparatif ini menegaskan bahwa tidak ada yang sebanding dengan Allah.
- source_word: מוֹרֶה
  choice: pengajar
  rationale: Kata ini menunjuk kepada orang yang mengajar. “Pengajar” alami dalam bahasa Indonesia dan cocok dengan nada puitis serta pertanyaan retoris ayat ini.
theological_decisions:
- issue: Hubungan antara keluhuran Allah dan kuasa-Nya
  choice: Menyatakan bahwa Allah luhur dalam kaitannya dengan kuasa-Nya tanpa menentukan secara tegas apakah kuasa itu lingkup, cara, atau sarana keluhuran-Nya.
  alternative: Allah meninggikan diri atau bertindak dengan luhur melalui kuasa-Nya.
  rationale: Kata kerja dan preposisi Ibrani memungkinkan beberapa nuansa. Terjemahan utama mempertahankan ketegangan itu dan tidak mengembangkan klaim doktrinal yang lebih khusus daripada teks.
- issue: Susunan perbandingan Allah sebagai pengajar
  choice: “Siapakah pengajar seperti Dia?”
  alternative: “Siapakah yang seperti Dia sebagai pengajar?”
  rationale: Kedua susunan mencerminkan pertanyaan retoris Ibrani. Pilihan utama lebih ringkas dan alami, sedangkan alternatif memperlihatkan kemungkinan hubungan sintaksisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. “Sesungguhnya” menjaga fungsi partikel pembuka, sedangkan “luhur” dan “pengajar” tetap mudah dipahami pembaca umum. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
