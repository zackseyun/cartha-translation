  text: yang dicurahkan oleh awan-awan dan menetes dengan limpah ke atas manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat manusia” atau “orang-orang”; kata Ibrani אָדָם berbentuk tunggal tetapi di sini mengacu pada manusia secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini mempertahankan hubungan dengan 'titik-titik air' pada ayat sebelumnya tanpa menambahkan acuan yang tidak dinyatakan.
- source_word: יִזְּלוּ
  choice: dialirkan
  rationale: Bentuk dari נזל menggambarkan air yang mengalir atau turun. Bentuk pasif menghasilkan susunan bahasa Indonesia yang wajar dengan 'awan-awan' sebagai pelaku.
- source_word: שְׁחָקִים
  choice: awan-awan
  rationale: Dalam gambaran cuaca puitis ini, kata tersebut menunjuk pada awan atau kumpulan awan yang menurunkan hujan.
- source_word: יִרְעֲפוּ
  choice: dicurahkan
  rationale: Kata רָעַף berarti meneteskan atau mencurahkan sebagai hujan. 'Dicurahkan' mempertahankan gerak air ke bawah dan sesuai dengan kelimpahan yang dinyatakan oleh רָב.
- source_word: עֲלֵי
  choice: ke atas
  rationale: Ungkapan ini menyatakan arah turunnya hujan kepada manusia di bawahnya.
- source_word: אָדָם
  choice: manusia
  rationale: Bentuk tunggal ini dipakai secara generik untuk manusia atau umat manusia. 'Manusia' mempertahankan bentuk kolektif-generik secara alami dalam bahasa Indonesia.
- source_word: רָב
  choice: dengan limpah
  rationale: Kata sifat ini berfungsi secara adverbial dan menyatakan banyaknya curahan hujan.
theological_decisions:
- issue: Makna generik אָדָם
  choice: manusia
  alternative: umat manusia / orang-orang
  rationale: Bahasa Ibrani memakai bentuk tunggal אָדָם untuk umat manusia secara umum. 'Manusia' menjaga bentuk generik itu tanpa membatasinya pada laki-laki.
translation_notes:
  register: Bahasa puitis modern dan bermartabat. Pengulangan bunyi melalui pasangan 'dialirkan' dan 'dicurahkan' mempertahankan paralelisme tindakan, sedangkan bentuk pasif menghindari pronomina yang tidak alami untuk awan dalam bahasa Indonesia.
