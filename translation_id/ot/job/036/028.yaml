  terminology: “Awan-awan,” “manusia,” dan “dengan limpah” sesuai dengan konteks puitis serta nilai leksikal sumber. Catatan untuk אָדָם tetap berguna; “manusia” dalam teks utama sudah menyampaikan pemakaian generik tunggal Ibrani secara alami.
