  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: id
  text: Sesungguhnya, Allah itu perkasa dan tidak menolak[a]; Ia perkasa dalam kekuatan hati-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak memandang hina” atau “tidak menampik.” Bahasa Ibrani tidak menyatakan objeknya secara eksplisit.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “kekuatan hati”; ungkapan ini dapat berarti kekuatan pikiran, pengertian, atau keteguhan tujuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Sesungguhnya
  rationale: Menandai penegasan kuat dengan nada puitis yang tetap alami dalam bahasa Indonesia modern.
- source_word: אֵל
  choice: Allah
  rationale: Istilah puitis umum bagi Allah di sini, tanpa perlu diperluas menjadi gelar khusus.
- source_word: כַּבִּיר
  choice: perkasa
  rationale: Mengungkapkan kebesaran dan kuasa serta mempertahankan pengulangan kata Ibrani dalam kedua klausa.
- source_word: וְלֹא יִמְאָס
  choice: dan tidak menolak
  rationale: Kata kerja dapat berarti menolak, memandang hina, atau menampik. Terjemahan ini tidak menambahkan objek yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: כֹּחַ לֵב
  choice: kekuatan hati
  rationale: Mempertahankan metafora Ibrani dan ambiguitas antara pengertian, keteguhan batin, serta keteguhan tujuan.
theological_decisions:
- issue: Objek tersirat dari 'tidak menolak'
  choice: Objek tidak ditambahkan dalam teks utama
  alternative: tidak memandang hina siapa pun
  rationale: Bahasa Ibrani tidak menyatakan objek. Mempertahankan konstruksi tanpa objek menghindari pembatasan makna yang tidak ada dalam sumber.
- issue: Makna 'kekuatan hati'
  choice: kekuatan hati
  alternative: kekuatan pengertian; keteguhan tujuan
  rationale: Ungkapan Ibrani ringkas dan dapat menunjuk pada pengertian, daya batin, atau keteguhan tujuan; metaforanya dipertahankan agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan corak puitis. 'Sesungguhnya' dipilih sebagai penanda penegasan; susunan paralel mempertahankan pengulangan sumber.
