  text: And if they are bound in chains[a], caught in cords of affliction[b],
translation:
  language: id
  text: Dan jika mereka terikat dengan rantai[a], terjerat dalam tali-tali penderitaan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan belenggu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dalam tali-tali kesengsaraan” atau “dalam tali-tali kemiskinan”; kata Ibrani ini dapat berarti penderitaan, kesengsaraan, atau kemiskinan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Mempertahankan daya penghubung וְ dan unsur syarat אִם secara wajar dalam alur perkataan Elihu.
- source_word: אֲסוּרִים
  choice: mereka terbelenggu
  rationale: Partisip pasif dari אסר menyatakan keadaan terikat; 'terbelenggu' alami dalam bahasa Indonesia dan mempertahankan gambaran pengekangan.
- source_word: בַּזִּקִּים
  choice: dengan rantai
  rationale: Menunjuk pada alat pengekang seperti rantai atau belenggu. Pilihan ini jelas bagi pembaca modern dan cocok dengan verba 'terbelenggu'.
- source_word: יִלָּכְדוּן
  choice: tertangkap
  rationale: Bentuk Nifal imperfek dari לכד menyampaikan makna pasif, yakni ditangkap atau terjerat.
- source_word: בְּחַבְלֵי
  choice: dalam tali-tali
  rationale: חבל dapat berarti tali, tambang, atau pengikat. Bentuk konkret dipertahankan agar sejajar dengan gambaran rantai.
- source_word: עֹנִי
  choice: penderitaan
  rationale: עֹנִי dapat menunjuk pada penderitaan, kesengsaraan, atau kemiskinan. Dalam konteks ini, 'penderitaan' cukup luas dan tidak mempersempit makna pada keadaan ekonomi.
theological_decisions:
- issue: Sifat gambaran pengekangan
  choice: Mempertahankan gambaran konkret berupa rantai dan tali sambil membiarkannya berfungsi secara harfiah ataupun metaforis.
  alternative: Menafsirkannya secara eksklusif sebagai pemenjaraan harfiah atau secara eksklusif sebagai kesusahan metaforis.
  rationale: Bahasa Ibrani memakai gambaran fisik yang konkret, sedangkan konteks membahas tindakan Allah terhadap orang yang menderita. Terjemahan tidak memaksakan salah satu penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme serta metafora pengekangan dalam teks Ibrani dipertahankan; koma akhir mencerminkan bahwa kalimat berlanjut ke ayat berikutnya.
