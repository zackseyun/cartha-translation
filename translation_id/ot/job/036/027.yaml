  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: id
  text: Sebab Ia menarik ke atas tetes-tetes air[a], yang menyuling hujan dari kabut-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab Ia mengurangi tetes-tetes air, yang mencurahkan hujan dari uap-Nya.” Baris kedua dalam bahasa Ibrani sulit dipahami; “kabut” juga dapat diterjemahkan “uap”, dan hubungan tepatnya dengan “hujan” tidak pasti.'
    reason: Menandai alternatif leksikal bagi יְגָרַע dan יָזֹקּוּ, serta ketidakpastian sintaksis dan makna preposisi dalam לְאֵדוֹ.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan tentang kebesaran dan karya Allah dalam konteks terdekat.
- source_word: יְגָרַע
  choice: menarik ke atas
  rationale: Makna dasar verba ini adalah mengurangi, mengambil, atau menarik. Dalam konteks cuaca, frasa ini paling wajar dipahami sebagai tindakan mengangkat tetes-tetes air, sambil tetap dekat dengan citra Ibrani.
- source_word: נִטְפֵי מָיִם
  choice: tetes-tetes air
  rationale: Padanan langsung dan alami bagi frasa konstruksi yang berarti tetesan air.
- source_word: יָזֹקּוּ
  choice: menyaring
  rationale: Verba זקק dapat berarti menyaring atau memurnikan. Pilihan ini mempertahankan citra proses pembentukan hujan tanpa memastikan secara berlebihan apakah yang dimaksud adalah penyulingan atau pencurahan.
- source_word: מָטָר
  choice: hujan
  rationale: Padanan Indonesia yang baku dan paling alami.
- source_word: לְאֵדוֹ
  choice: dari kabut-Nya
  rationale: אֵד berarti kabut atau uap. Preposisi לְ sulit ditentukan dalam baris ini; 'dari' menghasilkan gambaran meteorologis yang koheren, sedangkan sufiks orang ketiga maskulin tunggal dipertahankan sebagai rujukan kepada Allah.
theological_decisions:
- issue: Rujukan sufiks orang ketiga maskulin tunggal dalam לְאֵדוֹ
  choice: 'Sufiks dipahami merujuk kepada Allah: “kabut-Nya”.'
  alternative: Sufiks dapat dipahami secara impersonal, “kabutnya/uapnya”, atau melalui penyesuaian tekstual sebagai “kabut mereka”.
  rationale: Allah merupakan pokok pembicaraan dalam uraian Elihu tentang kendali-Nya atas alam. Mempertahankan bentuk tunggal sebagai rujukan kepada Allah sesuai dengan wacana dan tidak menambahkan gagasan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kapitalisasi pronomina ilahi mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia. Kata “semuanya” menyatakan subjek jamak verba baris kedua tanpa menentukan rujukannya lebih jauh daripada teks Ibrani.
