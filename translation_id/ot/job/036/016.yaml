  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: id
  text: Sungguh, Dia membujukmu keluar dari mulut kesesakan[a] menuju tempat lapang tanpa himpitan di bawahnya,[b] dan sajian di mejamu penuh dengan makanan yang berlimpah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari rahang penderitaan” atau “dari mulut tempat sempit.” Kata Ibrani yang diterjemahkan “kesesakan” juga dapat menunjuk pada kesempitan.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani ini sulit. Dapat juga diterjemahkan “ke tempat luas yang tidak memiliki batasan di bawahnya.”
    reason: textual_or_lexical_difficulty
  - marker: c
    text: Secara harfiah, “penuh dengan lemak,” yaitu penuh dengan makanan mewah atau kelimpahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Sungguh
  rationale: Menangkap daya penegasan dan penambahan partikel ini secara wajar dalam bahasa Indonesia.
- source_word: הֲסִיתְךָ
  choice: Dia membujukmu
  rationale: Verba סית dapat berarti menghasut, membujuk, atau memikat. Dalam konteks tindakan membawa Ayub keluar dari kesesakan, 'membujuk' mempertahankan gagasan menarik seseorang tanpa memasukkan nuansa negatif yang terlalu kuat.
- source_word: מִפִּי צָר
  choice: keluar dari mulut kesesakan
  rationale: Mempertahankan metafora konkret 'mulut' dan arti צַר sebagai kesesakan atau keadaan sempit, yang berlawanan dengan 'tempat lapang' pada frasa berikutnya.
- source_word: רַחַב
  choice: tempat lapang
  rationale: Mempertahankan citra ruang yang luas dalam puisi Ibrani dan tetap jelas bagi pembaca Indonesia modern.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: tanpa himpitan di bawahmu
  rationale: מוּצָק sulit dipastikan maknanya di sini, tetapi konteks mendukung arti batasan atau himpitan. Terjemahan ini mempertahankan unsur תַּחְתֶּיהָ, sekaligus menyampaikan pertentangan antara kesesakan dan kelapangan.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: dan sajian di mejamu
  rationale: נַחַת merupakan kata langka dan dalam hubungan dengan 'mejamu' kemungkinan menunjuk pada sesuatu yang diletakkan atau disajikan di atas meja. 'Sajian' menyampaikan pengertian itu dengan ringkas tanpa memperluasnya secara berlebihan.
- source_word: מָלֵא דָשֶׁן
  choice: penuh dengan makanan yang berlimpah
  rationale: דָּשֶׁן secara harfiah berkaitan dengan lemak atau kemakmuran dan dalam konteks meja menyiratkan makanan yang kaya serta kelimpahan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan maksud citranya.
theological_decisions:
- issue: Subjek ilahi yang tersirat dalam הֲסִיתְךָ
  choice: Memakai kata ganti 'Dia' tanpa menambahkan nama 'Allah'.
  alternative: Menerjemahkan secara eksplisit 'Allah membujukmu'.
  rationale: Konteks perkataan Elihu menunjuk kepada Allah, tetapi teks Ibrani hanya memakai verba orang ketiga maskulin tunggal tanpa menyebutkan nomina subjek. Kata ganti mempertahankan bentuk dan kadar kejelasan sumber.
- issue: Citra kesesakan dan kelapangan
  choice: Mempertahankan metafora 'mulut kesesakan' dan 'tempat lapang'.
  alternative: Memparafrasakan seluruhnya sebagai 'membebaskanmu dari penderitaan'.
  rationale: Kontras spasial merupakan unsur utama puisi ayat ini. Mempertahankannya menjaga ketegangan dan daya ungkap teks tanpa mengubahnya menjadi penjelasan abstrak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Metafora ruang dalam bahasa Ibrani dipertahankan, sedangkan ungkapan tentang meja dibuat cukup alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
