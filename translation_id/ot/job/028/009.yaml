translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. 'Batu cadas' dipilih alih-alih istilah teknis yang sempit karena konteks menekankan kerasnya batu. Pronomina 'Ia' merujuk pada manusia/penambang yang dibicarakan dalam konteks pasal.
