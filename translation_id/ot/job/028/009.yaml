  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
translation:
  language: id
  text: Ia mengulurkan tangannya ke batu cadas[a]; ia menjungkirbalikkan gunung-gunung dari akarnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terhadap batu cadas” atau “ke dalam batu cadas.” Bahasa Ibrani dapat menggambarkan tangan yang diarahkan kepada batu keras dalam pekerjaan penambangan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari akar gunung-gunung”; bentuk “akar” dalam bahasa Ibrani tunggal dan dapat dipahami secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: pada batu cadas
  rationale: חַלָּמִישׁ menunjuk pada batu yang sangat keras atau batu api. Dalam konteks penambangan, frasa ini menggambarkan tindakan manusia terhadap batu cadas; 'pada batu cadas' alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan nuansa 'terhadap' atau 'ke dalam' batu itu.
- source_word: שָׁלַח יָדוֹ
  choice: Ia mengulurkan tangannya
  rationale: Secara harfiah idiom ini berarti mengulurkan atau mengarahkan tangan. Pilihan ini menyatakan tindakan aktif seorang penambang tanpa memakai ungkapan Indonesia yang dapat menyiratkan sekadar menyentuh.
- source_word: הָפַךְ
  choice: menjungkirbalikkan
  rationale: הפך berarti membalikkan atau menjungkirbalikkan. Kata ini menyampaikan perubahan drastis yang ditimbulkan penggalian pada gunung.
- source_word: מִשֹּׁרֶשׁ
  choice: dari akarnya
  rationale: Bentuk Ibrani 'dari akar' bersifat tunggal kolektif dalam hubungannya dengan gunung-gunung. Bahasa Indonesia secara alami dapat memakai 'akarnya' untuk menyatakan bagian paling dasar.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Bentuk jamak הָרִים secara langsung berarti gunung-gunung dan di sini dipakai secara umum.
