lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memberikan alasan bagi pernyataan sebelumnya tentang pengetahuan Allah akan hikmat; “Sebab” menyampaikan fungsi penjelasannya secara alami.
- source_word: הוּא
  choice: Ia
  rationale: Kata ganti ini merujuk kepada Allah dalam konteks. “Ia” mempertahankan subjek personal dengan ragam bahasa yang wajar dan bermartabat.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: sampai ke ujung-ujung bumi
  rationale: Ungkapan ini menunjuk pada batas-batas bumi yang paling jauh. Bentuk ulang “ujung-ujung” menyampaikan bentuk jamak Ibrani dan cakupan menyeluruhnya.
- source_word: יַבִּיט
  choice: memandang
  rationale: Bentuk Hifil dari נבט menyatakan pandangan yang diarahkan. “Memandang” lebih sesuai dengan nuansa ini daripada sekadar “melihat” dan mendukung kesejajaran dengan verba berikutnya.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: di bawah seluruh langit
  rationale: Terjemahan ini mempertahankan gambaran ruang dari תַּחַת serta daya cakup כָּל. Bahasa Indonesia lazim memakai “langit” sebagai nomina kolektif meskipun bentuk Ibraninya jamak.
- source_word: יִרְאֶה
  choice: melihat segala sesuatu
  rationale: ראה berarti “melihat”; objek yang tersirat dari konstruksi “di bawah seluruh langit” dibuat eksplisit sebagai “segala sesuatu” agar kalimat Indonesia alami tanpa mempersempit cakupannya.
theological_decisions:
- issue: Rujukan kata ganti הוּא
  choice: Subjeknya adalah Allah, yang melanjutkan gambaran tentang pengetahuan-Nya yang menyeluruh.
  alternative: Mempertahankan kata ganti tanpa mengidentifikasi rujukannya.
  rationale: Dalam konteks langsung Ayub 28, pribadi yang mengetahui tempat hikmat dan menyelidiki seluruh ciptaan adalah Allah. Identifikasi ini berasal dari konteks, bukan tambahan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Kesejajaran “memandang … dan melihat” dipertahankan. Ungkapan cakupan menyeluruh dibuat alami dalam bahasa Indonesia tanpa menghilangkan gambaran kosmis teks Ibrani.
