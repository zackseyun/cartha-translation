  yaml_path: translation/ot/job/028/001.yaml
  text: Surely there is a mine for silver[b][a], and a place where they refine gold.
translation:
  language: id
  text: Sungguh, ada tambang perak[a], dan ada tempat orang memurnikan emas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sumber perak” atau “tempat asal perak.” Kata Ibraninya tidak secara khusus berarti tambang, tetapi konteksnya membahas penggalian dan pengolahan logam.
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat orang melebur emas.” Kata kerja Ibraninya dapat berarti memurnikan atau melebur logam mulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sungguh
  rationale: Dalam pembukaan puitis ini, partikel tersebut bersifat menegaskan, bukan terutama menyatakan sebab. “Sungguh” menyampaikan daya penegasannya secara alami.
- source_word: יֵשׁ
  choice: ada
  rationale: Partikel eksistensial ini paling wajar diterjemahkan “ada” dalam bahasa Indonesia.
- source_word: לַכֶּסֶף מוֹצָא
  choice: ada tambang untuk perak
  rationale: מוֹצָא pada dasarnya berarti tempat keluar, sumber, atau tempat asal. Dalam konteks penggalian logam pada pasal ini, “tambang” menyampaikan maksud konkretnya, sedangkan “untuk perak” mempertahankan hubungan yang ditandai oleh ל.
- source_word: וּמָקוֹם לַזָּהָב
  choice: dan ada tempat ... emas
  rationale: “Tempat” merupakan padanan langsung dan alami bagi מָקוֹם. Kata “ada” diulangi dalam bahasa Indonesia untuk memperjelas kesejajaran kedua klausa, meskipun tersirat dalam klausa Ibrani kedua.
- source_word: יָזֹקּוּ
  choice: orang memurnikan
  rationale: Bentuk orang ketiga jamak ini dapat menyatakan pelaku tak tentu. “Orang memurnikan” mempertahankan pelaku tak tentu itu dan memakai istilah yang mudah dipahami; verba tersebut juga dapat menunjuk pada peleburan logam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Terjemahan mempertahankan kesejajaran baris Ibrani, tetapi mengulangi “ada” agar konstruksinya alami. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
