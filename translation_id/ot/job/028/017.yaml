  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: id
  text: Emas dan kaca[a] tidak dapat menandinginya, dan benda dari emas murni tidak dapat menjadi gantinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kristal”. Istilah Ibrani זְכוֹכִית mungkin menunjuk kepada bahan mewah yang bening; “kaca” dipilih sebagai makna yang lebih mungkin.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan bejana dari emas murni tidak dapat menjadi gantinya.” Kata Ibrani כְּלִי dapat berarti “benda”, “perkakas”, atau “wadah/bejana”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: tidak dapat menandinginya
  rationale: Bentuk dari ערך menyatakan penaksiran atau perbandingan. Dalam konteks nilai hikmat yang tak tertandingi, ungkapan ini secara alami menyampaikan bahwa emas dan kaca tidak sebanding dengannya; sufiks feminin tunggal merujuk kepada hikmat.
- source_word: זָהָב
  choice: emas
  rationale: Padanan baku bagi logam mulia ini dan sesuai dengan konteks.
- source_word: זְכוֹכִית
  choice: kaca
  rationale: Kata ini kemungkinan besar menunjuk kepada kaca, bahan bening yang bernilai tinggi pada zaman kuno. 'Kristal' tetap merupakan kemungkinan leksikal.
- source_word: תְמוּרָתָהּ
  choice: ditukarkan dengannya
  rationale: תְּמוּרָה menyatakan pertukaran atau penggantian. Bentuk verbal ini mempertahankan gambaran transaksi secara alami dalam bahasa Indonesia.
- source_word: כְּלִי פָז
  choice: benda dari emas murni
  rationale: כְּלִי dapat berarti benda, perkakas, atau wadah, sehingga 'benda' tidak mempersempit maknanya. פָּז menunjuk kepada emas bermutu tinggi atau yang dimurnikan.
