  text: אֱ֭לֹהִים הֵבִ֣ין דַּרְכָּ֑/הּ וְ֝/ה֗וּא יָדַ֥ע אֶת מְקוֹמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: id
  text: Allah memahami jalannya[a], dan Dialah yang mengetahui tempatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan menuju hikmat”; akhiran -nya merujuk kepada hikmat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, kata kerja tunggal menunjukkan bahwa yang dimaksud ialah satu-satunya Allah. Dalam bahasa Indonesia, “Allah” merupakan padanan yang alami dan tepat.
- source_word: הֵבִין
  choice: memahami
  rationale: Bentuk Hifil dari בין menyatakan memahami atau mengerti dengan sungguh-sungguh. Bentuk kini sesuai dengan pernyataan puitis tentang pengetahuan Allah yang tetap berlaku.
- source_word: דַּרְכָּהּ
  choice: jalannya
  rationale: 'Akhiran pronominal merujuk kepada hikmat dalam konteks sebelumnya. “Jalannya” mempertahankan metafora dan ambiguitas bahasa Ibrani: dapat berarti jalan yang berkaitan dengan hikmat atau jalan menuju hikmat.'
- source_word: וְהוּא
  choice: dan Dialah
  rationale: Kata ganti mandiri הוּא memberi penegasan pada subjek. “Dialah” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: יָדַע
  choice: mengetahui
  rationale: Kata ini menyatakan pengetahuan. Bentuk kini mencerminkan kebenaran umum dan berkelanjutan mengenai Allah.
- source_word: אֶת מְקוֹמָהּ
  choice: tempatnya
  rationale: מָקוֹם berarti tempat atau lokasi, dan akhiran -nya merujuk kepada hikmat. “Tempatnya” ringkas serta mempertahankan gambaran teks sumber.
theological_decisions:
- issue: Rujukan akhiran feminin pada “jalannya” dan “tempatnya”
  choice: Akhiran -nya dipahami merujuk kepada hikmat, tanpa memberi hikmat kata ganti berjenis kelamin.
  alternative: Memersonifikasikan hikmat secara eksplisit dengan ungkapan feminin.
  rationale: Dalam bahasa Ibrani, “hikmat” berjenis gramatikal feminin dan dipersonifikasikan dalam konteks pasal ini. Bahasa Indonesia tidak membedakan gender dalam akhiran -nya, sehingga terjemahan ini secara alami mempertahankan rujukannya tanpa menambah tingkat personifikasi yang tidak diwajibkan oleh bentuk gramatikal Ibrani.
- issue: Makna “jalan” hikmat
  choice: Mempertahankan ungkapan “jalannya” yang dapat mencakup jalan hikmat maupun jalan menuju hikmat.
  alternative: Menerjemahkan secara tegas sebagai “jalan menuju hikmat”.
  rationale: Bentuk Ibrani דַּרְכָּהּ secara harfiah berarti “jalannya”, tetapi konteks pencarian hikmat memungkinkan nuansa “jalan menuju kepadanya”. Terjemahan utama tidak menutup salah satu kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan puitis. “Dialah” mempertahankan penegasan pada kata ganti Ibrani, sedangkan akhiran -nya secara alami menghindari persoalan gender gramatikal.
