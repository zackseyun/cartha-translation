translation:
  language: id
  text: 'Dari tanah keluarlah roti,

    namun bagian bawahnya dibalikkan seperti oleh api.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dibalikkan seperti api.” Perbandingan dalam bahasa Ibrani dapat menggambarkan cara pembalikan itu (“seperti oleh api”) atau sekadar kemiripan (“seperti api”).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: tanah
  rationale: Konteks membandingkan permukaan tanah yang menghasilkan bahan pangan dengan bagian bawahnya yang digali; “tanah” lebih alami dan tepat daripada “bumi” atau wilayah tertentu.
- source_word: מִמֶּנָּה
  choice: dari tanah
  rationale: Akhiran pronomina feminin merujuk kembali kepada אֶרֶץ. Pengulangan “tanah” membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: יֵצֵא
  choice: keluarlah
  rationale: Mempertahankan gambaran konkret verba 'keluar' dengan susunan yang wajar dan bernada puitis.
- source_word: לָחֶם
  choice: makanan
  rationale: לֶחֶם dapat menunjuk roti secara konkret maupun makanan secara lebih luas. Karena yang keluar dari tanah adalah hasil pangan, “makanan” menyampaikan maksud ungkapan itu secara alami tanpa membayangkan roti jadi keluar langsung dari tanah.
- source_word: וְתַחְתֶּיהָ
  choice: namun bagian bawahnya
  rationale: “Namun” menyatakan kontras antara permukaan yang menghasilkan makanan dan lapisan bawah yang dibongkar. “Bagian bawahnya” mempertahankan rujukan kepada tanah.
- source_word: נֶהְפַּךְ
  choice: dijungkirbalikkan
  rationale: Bentuk Nifal dari הפך menyatakan keadaan dibalik atau dijungkirbalikkan; pilihan ini sesuai dengan gambaran penggalian tambang dalam konteks pasal.
- source_word: כְּמוֹ אֵשׁ
  choice: seperti oleh api
  rationale: Terjemahan ini mempertahankan kemungkinan bahwa perbandingan menggambarkan cara atau akibat pembalikan seolah-olah dilakukan oleh api; kemungkinan 'seperti api' dicatat dalam catatan kaki.
