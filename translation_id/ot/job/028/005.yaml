translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Paralel kontras antara hasil pangan di permukaan dan pembongkaran di bawah tanah dipertahankan. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkan.
