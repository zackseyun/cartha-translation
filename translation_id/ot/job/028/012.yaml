  text: וְֽ֭/הַ/חָכְמָה מֵ/אַ֣יִן תִּמָּצֵ֑א וְ/אֵ֥י זֶ֝ה מְק֣וֹם בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/012.yaml
  text: But where can wisdom be found[a], and where is the place of understanding?
translation:
  language: id
  text: Namun, dari manakah hikmat dapat ditemukan[a], dan di manakah tempat pengertian?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari manakah hikmat akan ditemukan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Namun, ... hikmat
  rationale: וְ menandai peralihan retoris dari uraian tentang penambangan dalam konteks sebelumnya menuju pertanyaan tentang hikmat. 'Namun' menyatakan kontras ini secara alami, sedangkan חָכְמָה diterjemahkan dengan istilah baku 'hikmat'.
- source_word: מֵאַיִן
  choice: dari manakah
  rationale: Ungkapan ini secara harfiah menanyakan asal atau sumber. Bahasa Indonesia alami dapat mempertahankan unsur 'dari' tanpa terasa kaku.
- source_word: תִּמָּצֵא
  choice: dapat ditemukan
  rationale: Bentuk nifal imperfek dari מצא berarti 'ditemukan'. Dalam pertanyaan puitis-retoris ini, 'dapat ditemukan' menyampaikan daya modalnya dengan lebih tepat daripada futur sederhana.
- source_word: וְאֵי זֶה
  choice: dan di manakah
  rationale: אֵי adalah kata tanya tempat, sementara זֶה merupakan bagian dari ungkapan idiomatis אֵי זֶה מְקוֹם. Terjemahan alami Indonesia tidak perlu mempertahankan 'ini' secara harfiah.
- source_word: מְקוֹם
  choice: tempat
  rationale: Padanan langsung dan alami untuk מְקוֹם, serta mempertahankan gambaran bahwa pengertian mempunyai tempat yang dicari.
- source_word: בִּינָה
  choice: pengertian
  rationale: בִּינָה menunjuk pada pengertian atau daya memahami. 'Pengertian' mempertahankan kesejajaran kosakata sastra hikmat dengan חָכְמָה tanpa mempersempitnya menjadi jenis penilaian tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan paralel kedua pertanyaan dipertahankan; 'dari manakah' menjaga pertanyaan tentang sumber, sedangkan 'di manakah tempat' menjaga citra spasial teks Ibrani.
