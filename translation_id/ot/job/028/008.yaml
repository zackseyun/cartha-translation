  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: id
  text: Binatang-binatang buas yang angkuh tidak pernah menginjak jalan itu[a]; singa tidak pernah melintasinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak keangkuhan.” Ungkapan puitis ini kemungkinan menunjuk kepada binatang-binatang buas yang angkuh, khususnya binatang pemangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: tidak pernah menginjak jalan itu
  rationale: Bentuk Hifil dari דרך di sini menyatakan gerak menapaki atau menempuh suatu jalan. Karena akhiran pronominalnya merujuk pada jalan dalam konteks sebelumnya, penyebutan ulang “jalan itu” menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: בְנֵי שָׁחַץ
  choice: binatang-binatang buas yang angkuh
  rationale: Secara harfiah frasa ini berarti “anak-anak keangkuhan.” Dalam paralelisme dengan שׁחל, ungkapan puitis ini paling mungkin menunjuk kepada binatang liar yang gagah atau angkuh, khususnya pemangsa. “Binatang-binatang buas yang angkuh” mempertahankan unsur kebuasan dan keangkuhan tanpa membatasi maknanya pada satu jenis satwa.
- source_word: עָדָה עָלָיו
  choice: tidak pernah melintasinya
  rationale: Kata kerja עדה dengan על menggambarkan gerak melewati atau melintasi sesuatu. “Melintasinya” alami dalam bahasa Indonesia dan sejajar dengan tindakan menginjak jalan pada klausa pertama.
- source_word: שָׁחַל
  choice: singa
  rationale: שׁחל adalah istilah puitis untuk singa dan dapat menyiratkan keganasan. Padanan sederhana “singa” paling jelas, sementara konteks binatang buas sudah membawa nuansa kekuatannya.
