  register: Bahasa Indonesia modern yang puitis dan bermartabat. Kata “pernah” menegaskan negasi pengalaman dalam gambaran jalan tersembunyi, sedangkan “jalan itu” memperjelas rujukan pronominal Ibrani. Ambiguitas idiom בְנֵי שָׁחַץ dipertahankan melalui catatan kaki.
