  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: id
  text: Besi diambil dari debu tanah, dan tembaga[a] dilebur dari batu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perunggu”. Istilah Ibrani ini dapat berarti tembaga atau perunggu; “tembaga” dipilih di sini karena konteksnya adalah penambangan dan pengambilan logam dari bijih.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: besi
  rationale: Padanan baku bagi logam besi dan makna lazim kata Ibrani ini.
- source_word: מֵעָפָר
  choice: dari debu tanah
  rationale: עָפָר dapat berarti debu, tanah gembur, atau tanah. 'Debu tanah' mempertahankan gambaran konkret bahasa Ibrani sekaligus terdengar wajar dalam konteks penggalian.
- source_word: יֻקָּח
  choice: diambil
  rationale: Bentuk pasif dari לקח secara harfiah berarti 'diambil'. Pilihan ini tetap dekat dengan teks tanpa mempersempit maknanya menjadi 'ditambang'.
- source_word: וְאֶבֶן
  choice: dan ... dari batu
  rationale: אֶבֶן berarti 'batu'. Preposisi 'dari' dipahami berlanjut dalam klausa kedua agar hubungan antara logam dan batuan yang mengandung bijih jelas dalam bahasa Indonesia.
- source_word: יָצוּק
  choice: dilebur
  rationale: יצק dapat berarti menuang, mencetak, atau melebur. Dalam konteks pertambangan dan logam yang diperoleh dari batu, 'dilebur' paling tepat menyampaikan proses pemisahan logam dari bijih.
- source_word: נְחוּשָׁה
  choice: tembaga
  rationale: Istilah ini dapat menunjuk pada tembaga atau perunggu. Karena konteksnya adalah memperoleh logam dari batuan bijih, 'tembaga' lebih tepat daripada nama logam campuran.
