  text: לֹא יָדַ֣ע אֱנ֣וֹשׁ עֶרְכָּ֑/הּ וְ/לֹ֥א תִ֝מָּצֵ֗א בְּ/אֶ֣רֶץ הַֽ/חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: id
  text: 'Manusia fana tidak mengetahui nilainya[a],

    dan hikmat tidak ditemukan di negeri orang-orang hidup.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harganya” atau “taksiran nilainya.” Kata Ibrani ini menunjuk pada nilai atau penaksiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: manusia fana
  rationale: Nomina tunggal ini merujuk secara representatif kepada manusia dengan nuansa kefanaan atau kelemahan; bentuk Indonesia ini alami dan mempertahankan nuansa tersebut.
- source_word: יָדַע
  choice: tidak mengetahui
  rationale: Bentuk qatal menyatakan kebenaran umum dalam konteks ini. Terjemahan ini tidak menambahkan gagasan ketidakmampuan.
- source_word: עֶרְכָּהּ
  choice: nilainya
  rationale: Nomina dari ערך menunjuk pada penilaian, nilai, atau harga. 'Nilainya' cukup luas dan alami tanpa memberi kesan komersial yang berlebihan.
- source_word: תִמָּצֵא
  choice: tidak ditemukan
  rationale: Bentuk Nifal diterjemahkan secara pasif tanpa menambahkan modalitas 'tidak dapat' yang tidak dinyatakan secara eksplisit.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: di negeri orang hidup
  rationale: Ungkapan ini mempertahankan citra puitis Ibrani tentang ranah kehidupan manusia di bumi dan terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat pada klausa kedua
  choice: menyebut kembali 'hikmat'
  alternative: memakai pronomina 'ia' atau '-nya'
  rationale: Akhiran feminin tunggal pada עֶרְכָּהּ dan verba feminin תִמָּצֵא merujuk kembali kepada hikmat dalam konteks ayat 12. Penyebutan kembali menghindari pronomina Indonesia yang kabur tanpa mengubah rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Baris kedua menyebut kembali 'hikmat' demi kejelasan rujukan, sedangkan 'negeri orang hidup' mempertahankan idiom sumber.
