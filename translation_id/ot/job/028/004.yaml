  yaml_path: translation/ot/job/028/004.yaml
  text: He breaks open a shaft away from where people dwell[a]; forgotten by the foot, they hang far from men[c][b], they sway.
translation:
  language: id
  text: Ia membuka sebuah lubang tambang jauh dari tempat orang tinggal.[a] Mereka terlupakan oleh kaki;[b] jauh dari manusia, mereka bergantung[c] dan berayun-ayun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia membelah saluran atau dasar aliran jauh dari tempat seorang pendatang berada.” Teks Ibrani sulit, khususnya kata נַחַל dan גָּר. Karena konteks pasal ini berbicara tentang pertambangan, banyak penafsir memahami נַחַל sebagai lubang atau lorong tambang.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “terlupakan dari/oleh kaki.” Maksudnya mungkin tempat itu atau para pekerjanya berada di luar perhatian atau jangkauan orang-orang yang berjalan di atas.
    reason: lexical_alternative
  - marker: c
    text: Atau, “mereka diturunkan” atau “mereka menjuntai.” Kata kerja Ibraninya dapat menggambarkan orang yang tergantung atau diturunkan, mungkin dengan tali di dalam tambang.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַץ
  choice: membobol
  rationale: Kata kerja ini berarti menerobos atau membelah dengan kuat. Dalam gambaran pertambangan, “membobol” menyampaikan tindakan membuka jalan ke dalam bumi.
- source_word: נַחַל
  choice: lubang tambang
  rationale: Makna lazimnya ialah alur sungai, wadi, atau saluran, tetapi konteks pertambangan dalam pasal ini mendukung pengertian bukaan galian. “Lubang tambang” jelas bagi pembaca modern tanpa menutupi kesulitan teks, yang dicatat dalam catatan kaki.
- source_word: מֵעִם גָּר
  choice: jauh dari tempat orang tinggal
  rationale: מֵעִם menyatakan keterpisahan dari kedekatan, sedangkan גָּר dapat menunjuk orang yang menetap sementara atau pendatang. Terjemahan lokatif ini menghasilkan bahasa Indonesia yang wajar; kemungkinan harfiahnya tetap dicatat.
- source_word: הַנִּשְׁכָּחִים מִנִּי רָגֶל
  choice: mereka terlupakan oleh kaki manusia
  rationale: Terjemahan ini mempertahankan metafora Ibrani yang padat, yakni para pekerja atau tempat itu berada di luar perhatian dan jangkauan orang yang berjalan di atas.
- source_word: דַּלּוּ
  choice: mereka bergantung
  rationale: Kata kerja ini dapat menggambarkan keadaan tergantung, menjuntai, atau diturunkan. Dalam konteks tambang, gambaran pekerja yang bergantung pada tali paling masuk akal.
- source_word: מֵאֱנוֹשׁ
  choice: jauh dari orang lain
  rationale: אֱנוֹשׁ menunjuk manusia fana atau umat manusia. Frasa ini secara alami menyatakan keterpisahan para penambang dari masyarakat manusia.
- source_word: נָעוּ
  choice: berayun-ayun
  rationale: Kata kerja ini berarti bergerak kian kemari, berguncang, atau terhuyung. “Berayun-ayun” sesuai dengan gambaran pekerja yang tergantung.
