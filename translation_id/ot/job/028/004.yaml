  source_fidelity: Revisi diperlukan terutama untuk memperbaiki padanan מֵאֱנוֹשׁ. “Orang lain” berarti ‘other people’ dan tidak menyampaikan keterpisahan dari manusia/masyarakat manusia yang dinyatakan teks. Penempatan penanda catatan c juga perlu dipindahkan ke kata yang menerjemahkan דַּלּוּ (‘bergantung’).
  naturalness: Teks revisi tetap modern dan jelas. Frasa “terlupakan oleh kaki” memang puitis dan agak padat, tetapi sengaja mempertahankan metafora serta ketidakpastian rujukan dalam bahasa Ibrani; catatan kaki menjelaskannya.
  terminology: “Lubang tambang” adalah pilihan kontekstual yang dapat diterima untuk נחל dalam ayat yang sulit ini, dengan alternatif dicatat. “Manusia” lebih tepat daripada “orang lain” untuk אֱנוֹשׁ. “Bergantung” dan “berayun-ayun” menyampaikan gambaran דַּלּוּ ... נָעוּ tanpa memastikan secara berlebihan bahwa mereka pasti diturunkan dengan tali.
