- from: Ia membobol lubang tambang jauh dari tempat orang tinggal.[a] Di sana, mereka terlupakan oleh kaki manusia;[b] mereka bergantung jauh dari orang lain[c] dan berayun-ayun.
  to: Ia membuka sebuah lubang tambang jauh dari tempat orang tinggal.[a] Mereka terlupakan oleh kaki;[b] jauh dari manusia, mereka bergantung[c] dan berayun-ayun.
  rationale: Revisi mengganti “orang lain” dengan “manusia”, menghapus tambahan yang tidak diperlukan, dan menempatkan penanda c pada “bergantung”, yakni padanan kata kerja Ibrani yang dijelaskan catatan itu. Terjemahan tetap menyatakan pembacaan pertambangan yang paling lazim sambil mencatat kesulitan leksikal נחל dan גר serta kemungkinan arti alternatif bagi kata kerja ‘bergantung’.
