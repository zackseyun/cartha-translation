  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: id
  text: Hikmat tersembunyi dari mata setiap makhluk hidup, dan tersembunyi dari burung-burung di langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: Ia tersembunyi
  rationale: Bentuk Nifal perfektum feminin tunggal dari עלם menunjuk kembali kepada hikmat dalam konteks. Pronomina “Ia” mempertahankan rujukan feminin konseptual tanpa mengulang “hikmat”, sedangkan “tersembunyi” menyampaikan keadaan pasif/resultatif.
- source_word: מֵעֵינֵי
  choice: dari mata
  rationale: Mempertahankan gambaran konkret idiom Ibrani מן + עיניים dan tetap alami dalam bahasa Indonesia.
- source_word: כָל חָי
  choice: setiap makhluk hidup
  rationale: Mencakup semua yang hidup tanpa membatasinya pada manusia; ungkapan ini alami dan mempertahankan cakupan universal.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: dan dari burung-burung di langit
  rationale: עוֹף paling alami diterjemahkan “burung-burung” dalam konteks ini. הַשָּׁמַיִם merujuk pada bentangan langit tempat burung terbang; “di langit” menyampaikan relasi Ibrani secara wajar dalam bahasa Indonesia.
- source_word: נִסְתָּרָה
  choice: terselubung
  rationale: Bentuk Nifal perfektum feminin tunggal dari סתר sejajar dengan kata kerja pertama. “Terselubung” mempertahankan nuansa tidak terlihat sekaligus menghindari pengulangan “tersembunyi”.
