review_pass:
  verdict: revise
  source_fidelity: Draf pada dasarnya mencerminkan dua predikat pasif feminin tunggal yang merujuk kepada hikmat dari konteks sebelumnya, serta cakupan universal ‘setiap makhluk hidup’ dan burung-burung langit. Namun, ‘terselubung dari’ kurang tepat secara kolokasi untuk menyatakan tersembunyi dari pandangan/pengetahuan, dan kapitalisasi ‘Ia’ dapat secara tidak perlu mengesankan rujukan ilahi atau personal.
  naturalness: ‘Hikmat’ sebagai subjek eksplisit menghasilkan kalimat bahasa Indonesia modern yang utuh dan jelas. Pengulangan ‘tersembunyi’ mempertahankan paralelisme Ibrani dan lebih alami daripada ‘terselubung dari’.
  terminology: ‘Hikmat’ tepat untuk rujukan kontekstual; ‘makhluk hidup’ dan ‘burung-burung di langit’ mempertahankan cakupan serta citraan puitis sumber. Tidak diperlukan catatan kaki dalam bahasa Indonesia karena tidak ada ambiguitas tekstual atau leksikal penting yang perlu dipertahankan.
  issues:
  - severity: medium
    issue: Kapitalisasi ‘Ia’ dan rujukan pronominal
    rationale: Subjek feminin yang tersirat memang merujuk kepada hikmat (ay. 20), tetapi ‘Ia’ berkapital dalam bahasa Indonesia lazimnya dipakai bagi Tuhan dan dapat menambahkan nuansa personal/ilahi yang tidak dinyatakan ayat ini. Menyebut ‘Hikmat’ menghilangkan ambiguitas tersebut.
  - severity: medium
    issue: ‘Terselubung dari burung-burung’
    rationale: Konstruksi ini kurang idiomatis untuk padanan נִסְתָּרָה (‘tersembunyi/tersembunyikan dari’). ‘Tersembunyi dari’ tepat secara makna dan mempertahankan paralelisme puitis sumber.
