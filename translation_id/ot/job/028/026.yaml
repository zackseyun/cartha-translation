base_translation:
  language: en
  yaml_path: translation/ot/job/028/026.yaml
  text: when he made a decree for the rain[a], and a path for the thunderbolt of the storms,
translation:
  language: id
  text: ketika Ia menetapkan ketentuan bagi hujan dan jalan bagi kilat yang disertai guruh,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “jalan bagi kilat guruh-guruh.”'
    reason: Susunan לַחֲזִיז קֹלוֹת padat dan puitis; קֹלוֹת secara harfiah berarti ‘suara-suara’ dan dalam konteks badai berarti ‘guruh-guruh’.
lexical_decisions:
- source_word: בַּעֲשֹׂתוֹ
  choice: ketika Ia menetapkan
  rationale: ב dengan infinitif konstruk עשה dan sufiks orang ketiga tunggal berfungsi temporal, ‘ketika Ia membuat’. Dalam konteks penataan alam, ‘menetapkan’ secara alami mengungkap tindakan menjadikan suatu ketentuan tanpa mengubah hubungan temporal.
- source_word: לַמָּטָר
  choice: bagi hujan
  rationale: מָטָר berarti ‘hujan’ dan memakai artikel; frasa ini menyatakan bahwa hujan menerima ketentuan yang ditetapkan baginya.
- source_word: חֹק
  choice: ketentuan
  rationale: חֹק menunjuk pada sesuatu yang ditetapkan, seperti ketetapan, aturan, atau batas. ‘Ketentuan’ mempertahankan cakupan makna itu dan terdengar alami dalam gambaran tatanan kosmis.
- source_word: וְדֶרֶךְ
  choice: dan jalan
  rationale: דֶּרֶךְ secara harfiah berarti ‘jalan’ atau ‘jalur’; ‘jalan’ mempertahankan gambaran lintasan yang ditentukan bagi gejala di langit.
- source_word: לַחֲזִיז
  choice: bagi kilat
  rationale: חֲזִיז adalah kilatan petir atau halilintar. ‘Kilat’ tepat untuk fenomena bercahaya yang memiliki lintasan dan tidak mencampurkan makna קֹלוֹת ke dalam nomina ini.
- source_word: קֹלוֹת
  choice: yang disertai guruh
  rationale: קוֹל secara dasar berarti ‘suara’ dan dalam konteks cuaca dapat berarti ‘guruh’; bentuk jamaknya secara harfiah ‘guruh-guruh’. Ungkapan relasional ‘yang disertai guruh’ menghasilkan bahasa Indonesia alami sambil mempertahankan kaitan antara kilat dan bunyi guruh.
theological_decisions:
- issue: Tatanan alam yang ditetapkan Allah
  choice: Ayat diterjemahkan sebagai tindakan Allah menetapkan ketentuan bagi hujan dan lintasan bagi kilat berguruh.
  alternative: Memperluasnya menjadi pernyataan eksplisit tentang pemeliharaan atau kendali mutlak Allah atas alam.
  rationale: Teks puitis menggambarkan Allah menata gejala alam. Terjemahan mempertahankan implikasi teologis tersebut tanpa memasukkan rumusan doktrinal yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapitalisasi ‘Ia’ menandai rujukan kepada Allah sesuai konteks. Tanda koma ditempatkan sesudah penanda catatan kaki karena catatan menerangkan frasa yang langsung mendahuluinya.
