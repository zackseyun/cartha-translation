base_translation:
  language: en
  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: id
  text: Ia tidak dapat dinilai dengan emas Ofir, dengan batu krisopras[a] yang berharga ataupun batu lazurit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “oniks”; jenis batu yang dimaksud oleh kata Ibrani ini tidak dapat dipastikan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “safir”; istilah Ibraninya mungkin menunjuk pada lapis lazuli menurut klasifikasi batu pada zaman kuno, bukan safir dalam pengertian mineral modern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: dapat dinilai
  rationale: Bentuk Pual dari סלל dalam konteks harga dan barang berharga menyatakan penaksiran nilai; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya ekonomi-komparatifnya.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: dengan emas Ofir
  rationale: כֶּתֶם menunjuk pada emas murni atau emas bermutu tinggi, sedangkan Ofir menyatakan asalnya yang termasyhur. 'Dengan' menyampaikan sarana atau tolok ukur penilaian secara alami.
- source_word: שֹׁהַם
  choice: batu krisopras
  rationale: Identitas mineral שֹׁהַם tidak pasti. 'Krisopras' dipilih sebagai padanan utama yang dikenal dalam tradisi terjemahan Indonesia, sementara kemungkinan 'oniks' dicatat dalam catatan kaki.
- source_word: יָקָר
  choice: yang berharga
  rationale: Adjektiva ini menerangkan שֹׁהַם dan menekankan nilainya yang tinggi; frasa tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: סַפִּיר
  choice: batu lazurit
  rationale: Dalam klasifikasi mineral dunia kuno, סַפִּיר kemungkinan besar menunjuk pada lapis lazuli atau lazurit, bukan safir modern. Padanan tradisional 'safir' tetap diberikan sebagai alternatif.
