translation_notes:
  register: Puisi hikmat dalam bahasa Indonesia modern yang bermartabat. Susunan paralel dipertahankan, sedangkan 'Ia' merujuk pada hikmat dari konteks ayat-ayat sebelumnya. Istilah mineral diberi kata 'batu' agar langsung dipahami pembaca umum.
