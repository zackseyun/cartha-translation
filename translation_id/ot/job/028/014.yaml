source:
  edition: WLC
  text: תְּה֣וֹם אָ֭מַר לֹ֣א בִ/י הִ֑יא וְ/יָ֥ם אָ֝מַ֗ר אֵ֣ין עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: id
  text: Samudra raya berkata, “Ia[a] tidak ada di dalamku,” dan laut berkata, “Ia tidak ada padaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, pronomina ini berbentuk feminin dan merujuk kepada hikmat, yang dipersonifikasikan sebagai sosok feminin dalam konteks sekitarnya.
    reason: Menjelaskan informasi gramatikal dan personifikasi yang tidak tampak dalam pronomina bahasa Indonesia.
lexical_decisions:
- source_word: תְּהוֹם
  choice: samudra raya
  rationale: Istilah ini menunjuk pada kedalaman air yang sangat luas atau samudra purba. “Samudra raya” mempertahankan citra puitisnya dan membentuk kesejajaran yang wajar dengan “laut” tanpa mempersempit maknanya menjadi jurang daratan.
- source_word: אָמַר
  choice: berkata
  rationale: Bentuk verba Ibrani ini menyajikan ucapan langsung dalam puisi. Bahasa Indonesia tidak mengharuskan penandaan kala, sehingga “berkata” mempertahankan daya hidup personifikasinya.
- source_word: לֹא בִי הִיא
  choice: Ia tidak ada di dalamku
  rationale: Pronomina feminin הִיא merujuk kembali kepada hikmat dalam konteks. “Ia” mempertahankan rujukan pronominal itu secara alami dalam bahasa Indonesia, sedangkan “di dalamku” menerjemahkan בִי secara langsung.
- source_word: יָם
  choice: laut
  rationale: “Laut” adalah padanan umum dan langsung bagi יָם serta mempertahankan kesejajarannya dengan samudra raya.
- source_word: אֵין עִמָּדִי
  choice: Ia tidak ada padaku
  rationale: Ungkapan ini menyatakan bahwa hikmat tidak berada bersama atau dalam kepunyaan laut. “Tidak ada padaku” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa kehadiran sekaligus kepemilikan tanpa memilih salah satunya secara sempit.
theological_decisions:
- issue: Rujukan pronomina feminin הִיא
  choice: Memakai “Ia” dan menjelaskan rujukannya kepada hikmat dalam catatan kaki.
  alternative: Mengganti pronomina dengan “hikmat” di dalam teks utama.
  rationale: Pemakaian pronomina menjaga bentuk personifikasi dan hubungan antarayat dalam teks Ibrani. Karena bahasa Indonesia tidak membedakan gender pada pronomina, catatan kaki mempertahankan informasi gramatikal sumber tanpa memaksakan bentuk yang tidak alami.
translation_notes:
  register: Bahasa puitis, lugas, dan bermartabat. “Samudra raya” dipilih untuk membedakannya dari “laut” dalam baris sejajar, sementara dua ungkapan lokasi—“di dalamku” dan “padaku”—dipertahankan agar variasi Ibraninya tetap terdengar.
