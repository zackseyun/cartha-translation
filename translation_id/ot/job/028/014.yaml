  source_fidelity: 'Teks Indonesia dengan setia mempertahankan paralelisme dan personifikasi Ibrani: תְּהוֹם dibedakan dari יָם sebagai “samudra raya” dan “laut”; “di dalamku” menerjemahkan בִּי secara langsung, sementara “padaku” secara wajar membiarkan cakupan עִמָּדִי (‘bersamaku/dalam milikku’) tetap terbuka.'
