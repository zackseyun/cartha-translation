lexical_decisions:
- source_word: נָתִיב
  choice: jalan setapak
  rationale: Kata ini menunjuk pada jalan atau jejak yang sempit; “jalan setapak” alami dalam bahasa Indonesia dan mempertahankan gambaran puitis tentang jalur tersembunyi.
- source_word: לֹא יְדָעוֹ
  choice: tidak dikenal
  rationale: Bentuk verba dengan sufiks berarti secara harfiah “tidak mengetahuinya.” Konstruksi pasif ini menghasilkan bahasa Indonesia yang wajar sambil tetap menyatakan bahwa jalur itu luput dari pengetahuan burung pemangsa.
- source_word: עָיִט
  choice: burung pemangsa
  rationale: Istilah ini bersifat umum bagi burung pemakan daging atau burung pemangsa, bukan nama satu spesies tertentu.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: tidak terlihat oleh
  rationale: Verba ini berarti melihat, memandang, atau menangkap dengan penglihatan. Ungkapan ini jelas dan mempertahankan kesejajaran dengan klausa pertama.
- source_word: עֵין
  choice: mata
  rationale: Terjemahan harfiah ini mempertahankan citraan puitis Ibrani.
- source_word: אַיָּה
  choice: elang
  rationale: Kata ini menamai sejenis burung pemangsa, tetapi identifikasi spesiesnya tidak pasti. “Elang” merupakan sebutan Indonesia yang umum dan mudah dipahami; ketidakpastian spesies dicatat dalam catatan kaki.
