  text: וַ/יֹּ֤אמֶר לָֽ/אָדָ֗ם הֵ֤ן יִרְאַ֣ת אֲ֭דֹנָ/י הִ֣יא חָכְמָ֑ה וְ/ס֖וּר מֵ/רָ֣ע בִּינָֽה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/028/028.yaml
  text: And he said to man[a], ‘Behold, the fear of the Lord—that is wisdom, and to turn away from evil is understanding.’
translation:
  language: id
  text: Lalu Ia berkata kepada manusia, “Sesungguhnya, takut akan Tuhan—itulah hikmat, dan menjauhi kejahatan adalah pengertian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Ia berkata
  rationale: Bentuk wayyiqtol menghubungkan pernyataan ilahi penutup ini dengan konteks sebelumnya; “lalu” mempertahankan alur naratif tanpa memberi urutan waktu yang terlalu tegas.
- source_word: לָאָדָם
  choice: kepada manusia
  rationale: אָדָם berbentuk tunggal tetapi digunakan secara representatif untuk umat manusia; “manusia” alami dalam bahasa Indonesia dan tidak mengubah cakupan rujukannya.
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menarik perhatian kepada pernyataan yang khidmat dan tegas; “sesungguhnya” mempertahankan penekanan tersebut dalam ragam Indonesia yang bermartabat.
- source_word: יִרְאַת אֲדֹנָי
  choice: takut akan Tuhan
  rationale: Ungkapan ini menyatakan rasa takut yang penuh hormat kepada Tuhan. Kata “takut” dipertahankan dan tidak dilunakkan menjadi sekadar “hormat”.
- source_word: הִיא חָכְמָה
  choice: itulah hikmat
  rationale: Pronomina mandiri הִיא memberi penegasan dan menyamakan takut akan Tuhan dengan hikmat; “itulah” menyatakan daya identifikasional itu.
- source_word: וְסוּר מֵרָע
  choice: dan menjauhi kejahatan
  rationale: Infinitif סוּר menyatakan tindakan berpaling atau menjauh secara sengaja, sedangkan רָע dalam konteks hikmat ini terutama bermakna kejahatan moral.
- source_word: בִּינָה
  choice: pengertian
  rationale: Padanan baku dalam sastra hikmat yang mempertahankan kesejajaran dengan חָכְמָה, “hikmat”.
theological_decisions:
- issue: Cakupan אָדָם yang generik
  choice: manusia
  alternative: umat manusia
  rationale: Kata Ibrani berbentuk tunggal dan bersifat representatif, bukan nama diri atau rujukan khusus kepada laki-laki. “Manusia” mempertahankan bentuk tunggal kolektif secara alami dalam bahasa Indonesia.
- issue: Makna יִרְאַת dalam hubungan dengan Tuhan
  choice: takut akan Tuhan
  alternative: hormat kepada Tuhan
  rationale: “Takut” mempertahankan bobot semantis Ibrani yang mencakup rasa gentar, takzim, dan hormat; memilih “hormat” saja akan mempersempit ketegangan teologis ungkapan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Kapitalisasi “Ia” menandai rujukan kepada Allah berdasarkan konteks. Tanda pisah menonjolkan persamaan tegas dalam הִיא חָכְמָה tanpa menambah tafsiran.
