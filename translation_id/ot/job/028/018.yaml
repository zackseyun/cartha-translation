translation:
  language: id
  text: 'Karang dan kristal tidak patut disebut-sebut;

    memperoleh hikmat lebih berharga daripada mutiara.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: batu delima. Kata Ibraninya menunjuk pada benda berharga, tetapi jenisnya tidak pasti.'
    reason: Makna tepat פְּנִינִים diperdebatkan; catatan ini mempertahankan ketidakpastian leksikal tanpa mengubah terjemahan utama.
lexical_decisions:
- source_word: רָאמוֹת
  choice: batu karang
  rationale: Istilah ini kemungkinan menunjuk pada karang atau bahan berharga dari laut; 'batu karang' mempertahankan pengertian benda berharga tanpa menyamakannya dengan batuan darat biasa.
- source_word: גָבִישׁ
  choice: kristal
  rationale: Kata langka ini lazim dipahami sebagai kristal, sesuai konteks daftar benda berharga.
- source_word: לֹא יִזָּכֵר
  choice: tidak layak disebut-sebut
  rationale: Secara harfiah 'tidak akan disebut/diingat'; dalam perbandingan nilai, ungkapan ini berarti keduanya tidak patut diperhitungkan di samping hikmat.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: harga hikmat
  rationale: מֶשֶׁךְ secara dasar berkaitan dengan penarikan atau pemerolehan dan di sini kemungkinan menyatakan harga yang harus dibayar untuk memperoleh hikmat; 'harga hikmat' alami dalam bahasa Indonesia dan cocok dengan konteks penilaian.
- source_word: פְּנִינִים
  choice: mutiara
  rationale: Identitas benda berharga ini tidak pasti; 'mutiara' merupakan padanan tradisional dan sesuai konteks, tetapi alternatif 'batu delima' dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat perbandingan antara hikmat dan benda berharga
  choice: harga hikmat jauh melebihi mutiara
  alternative: memperoleh hikmat lebih berharga daripada mutiara
  rationale: Terjemahan mempertahankan metafora nilai atau harga dalam konteks puisi tanpa mengubahnya menjadi pernyataan tentang cara memperoleh hikmat.
translation_notes:
  register: Bahasa puitis, ringkas, dan bermartabat. Susunan dua baris mempertahankan kesejajaran puisi Ibrani; 'jauh melebihi' menyampaikan perbandingan מִן secara alami dalam bahasa Indonesia.
