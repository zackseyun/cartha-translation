  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Susunan “merupakan tempat safir” sengaja mempertahankan metafora lokasi dalam teks Ibrani, sedangkan “padanya terdapat” menghasilkan klausa yang alami sambil tetap dekat dengan bentuk sumber.
