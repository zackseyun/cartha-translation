  text: Its stones are the place of sapphire[a], and it has dust of gold.
translation:
  language: id
  text: Batu-batunya adalah sumber safir[a], dan padanya terdapat debu emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “lapis lazuli”; jenis batu permata kuno yang dimaksud oleh istilah Ibrani ini tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: tempat
  rationale: Makna dasarnya adalah tempat atau lokasi. Pilihan ini mempertahankan gambaran konkret lokasi penambangan tanpa mempersempitnya menjadi “sumber”.
- source_word: סַפִּיר
  choice: safir
  rationale: “Safir” adalah padanan tradisional dan mudah dikenali, tetapi identitas batu permata kuno ini tidak pasti; kemungkinan “lapis lazuli” dicatat dalam catatan kaki.
- source_word: אֲבָנֶיהָ
  choice: batu-batunya
  rationale: Bentuk ini berarti “batu-batunya”, dengan akhiran feminin tunggal yang merujuk pada bumi atau tanah dalam konteks sebelumnya. Bahasa Indonesia tidak perlu mempertahankan gender gramatikal tersebut.
- source_word: וְעַפְרֹת
  choice: dan ... debu
  rationale: Kata ini berkaitan dengan debu atau tanah gembur. “Debu” mempertahankan citra puitis Ibrani dan menghindari penafsiran tambahan seperti “bijih”.
- source_word: זָהָב
  choice: emas
  rationale: Padanan baku bagi logam mulia yang dimaksud.
- source_word: לוֹ
  choice: padanya terdapat
  rationale: Secara harfiah berarti “padanya/baginya”. Dalam klausa nominal ini, “padanya terdapat” menyampaikan keberadaan atau kandungan secara alami tanpa mengubahnya menjadi pernyataan kepemilikan yang terlalu tegas.
