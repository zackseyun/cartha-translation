  yaml_path: translation/ot/job/028/019.yaml
  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: id
  text: Batu topas[a] dari Kus tidak dapat menyamai hikmat; hikmat tidak dapat dinilai dengan emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu krisolit” atau “batu peridot”; jenis batu yang dimaksud oleh kata Ibrani פִּטְדָה tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: tidak dapat menyamai hikmat
  rationale: Kata kerja ערך di sini menyatakan kesetaraan dalam nilai atau derajat. Akhiran feminin tunggal merujuk kepada hikmat dalam konteks; penyebutan kembali “hikmat” membuat rujukan itu jelas dan alami dalam bahasa Indonesia.
- source_word: פִּטְדַת כּוּשׁ
  choice: batu topas dari Kus
  rationale: פִּטְדָה menunjuk pada batu berharga yang jenis mineralnya tidak dapat dipastikan. “Topas” mempertahankan padanan tradisional yang dikenal luas, sedangkan kemungkinan lain dicatat dalam catatan kaki. כּוּשׁ ditransliterasikan sebagai nama tempat “Kus”.
- source_word: בְּכֶתֶם טָהוֹר
  choice: dengan emas murni
  rationale: כֶּתֶם berarti emas bermutu tinggi atau emas olahan, dan טָהוֹר menegaskan kemurniannya. Preposisi ב dipahami dalam hubungan dengan penilaian, sehingga “dengan emas murni” alami dan sesuai dengan paralelisme ayat.
- source_word: תְסֻלֶּה
  choice: tidak dapat dinilai
  rationale: Bentuk pasif ini dalam konteks menyampaikan penaksiran nilai, bukan sekadar tindakan menimbang secara harfiah. Pilihan ini mempertahankan tema bahwa nilai hikmat tidak dapat diukur dengan kekayaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Paralelisme puisi dipertahankan dengan dua klausa yang seimbang; “hikmat” disebut secara eksplisit agar rujukan feminin dalam bahasa Ibrani tetap jelas tanpa menghasilkan pronomina Indonesia yang rancu.
