  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: id
  text: Ia menahan rembesan dari sungai-sungai[a] dan membawa apa yang tersembunyi kepada terang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menahan sumber-sumber sungai.” Kata Ibrani yang diterjemahkan “rembesan” langka dan dapat menggambarkan air yang menetes atau merembes; secara harfiah, kata itu berkaitan dengan “tangisan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: rembesan
  rationale: Kata benda ini langka dan sulit. Dalam konteks penggalian serta pengendalian air, kata ini kemungkinan menunjuk pada air yang merembes atau menetes dari saluran air. Pilihan ini mempertahankan gambaran air yang keluar perlahan tanpa menafsirkannya sebagai tangisan harfiah.
- source_word: נְהָרוֹת
  choice: sungai-sungai
  rationale: Bentuk jamak ini lazim berarti sungai atau aliran air. 'Sungai-sungai' mempertahankan padanan dasarnya dan sesuai dengan gambaran saluran air bawah tanah.
- source_word: חִבֵּשׁ
  choice: membendung
  rationale: Kata kerja ini pada dasarnya berarti mengikat, menahan, atau menutup. Dalam konteks pengendalian rembesan air saat menambang, 'membendung' menyampaikan tindakan menahan aliran secara alami dalam bahasa Indonesia.
- source_word: תַּעֲלֻמָהּ
  choice: apa yang tersembunyi
  rationale: Kata ini menunjuk pada sesuatu yang tersembunyi atau terselubung. Terjemahan yang umum ini tidak mempersempit maknanya hanya menjadi bijih atau harta terpendam.
- source_word: יֹצִא
  choice: membawa ... ke dalam
  rationale: Bentuk kausatif dari יצא berarti menyebabkan sesuatu keluar. Susunan 'membawa ... ke dalam terang' alami dalam bahasa Indonesia dan mempertahankan gerak dari keadaan tersembunyi menuju keterbukaan.
- source_word: אוֹר
  choice: terang
  rationale: Pilihan ini mempertahankan kontras langsung antara sesuatu yang tersembunyi dan sesuatu yang dibawa ke tempat yang dapat terlihat.
