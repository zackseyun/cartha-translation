  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֣ז רָ֭אָ/הּ וַֽ/יְסַפְּרָ֑/הּ הֱ֝כִינָ֗/הּ וְ/גַם חֲקָרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/027.yaml
  text: Then he saw it and declared it; he established it[a], and also searched it out.
translation:
  language: id
  text: Lalu Ia melihatnya dan menyatakannya[a]; Ia menetapkannya dan juga menyelidikinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghitungnya,” “menceritakannya,” atau “menguraikannya.” Kata Ibrani ini dapat berarti menghitung maupun menceritakan atau menyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Lalu
  rationale: Menandai urutan dalam uraian puitis dan terdengar alami dalam bahasa Indonesia.
- source_word: רָאָהּ
  choice: Ia melihatnya
  rationale: Mempertahankan verba konkret ראה; akhiran feminin tunggal merujuk pada hikmat dalam konteks sebelumnya.
- source_word: וַיְסַפְּרָהּ
  choice: dan menyatakannya
  rationale: Verba ספר dapat berarti menghitung, menceritakan, atau menyatakan. 'Menyatakannya' paling sesuai dengan rangkaian tindakan Allah terhadap hikmat, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: הֱכִינָהּ
  choice: Ia menetapkannya
  rationale: Bentuk Hifil dari כון menyatakan tindakan membuat teguh, menetapkan, atau mempersiapkan. 'Menetapkannya' menyampaikan bahwa hikmat dibuat tetap atau ditata.
- source_word: וְגַם
  choice: dan juga
  rationale: Mempertahankan daya kumulatif frasa Ibrani tanpa menambah penafsiran.
- source_word: חֲקָרָהּ
  choice: menyelidikinya
  rationale: חקר menunjuk pada pemeriksaan atau penyelidikan yang menyeluruh; 'menyelidikinya' alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan akhiran feminin tunggal
  choice: Semua bentuk '-nya' merujuk pada hikmat dalam konteks langsung.
  alternative: Akhiran itu dapat dipahami secara lebih abstrak sebagai ukuran atau tatanan hikmat.
  rationale: Konteks sebelumnya menampilkan hikmat sebagai objek tindakan Allah. Bentuk '-nya' mempertahankan rujukan tersebut tanpa menambah personifikasi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan puitis. Kata ganti 'Ia' mengikuti kebiasaan penulisan hormat untuk Allah. Tanda titik koma mencerminkan jeda utama dalam aksentuasi Masoret.
