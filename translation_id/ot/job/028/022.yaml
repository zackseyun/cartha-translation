  text: אֲבַדּ֣וֹן וָ֭/מָוֶת אָ֣מְר֑וּ בְּ֝/אָזְנֵ֗י/נוּ שָׁמַ֥עְנוּ שִׁמְעָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: id
  text: Abadon dan Maut berkata[a], “Dengan telinga kami, kami telah mendengar kabar tentangnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kebinasaan dan maut berkata, ‘Kami telah mendengar desas-desus tentangnya.’”
    reason: Alternatif ini mempertahankan arti leksikal אֲבַדּוֹן sebagai “Kebinasaan” dan nuansa שִׁמְעָהּ sebagai kabar yang hanya didengar secara tidak langsung.
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: Abadon
  rationale: Nama atau gelar ini ditransliterasikan sebagai “Abadon” karena diparalelkan dengan Maut dan dipersonifikasikan sebagai pembicara. Pilihan ini mempertahankan daya puitisnya; makna leksikal “Kebinasaan” dicatat sebagai alternatif.
- source_word: וָמָוֶת
  choice: dan Maut
  rationale: Kata penghubung diterjemahkan secara langsung. Huruf kapital menandai personifikasi puitis Maut sebagai pembicara bersama Abadon, tanpa menyatakan lebih jauh hakikat ontologisnya.
- source_word: אָמְרוּ
  choice: berkata
  rationale: Bentuk perfek Ibrani dapat menyampaikan pernyataan puitis yang hidup atau bersifat umum. “Berkata” alami dalam bahasa Indonesia dan tidak memaksakan pembedaan waktu yang tidak perlu.
- source_word: בְּאָזְנֵינוּ
  choice: Dengan telinga kami
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa Ibrani tentang mendengar dengan telinga, meskipun bahasa Indonesia biasa dapat cukup mengatakan “kami mendengar”.
- source_word: שָׁמַעְנוּ
  choice: kami telah mendengar
  rationale: “Telah mendengar” menyatakan tindakan mendengar yang sudah terjadi dan hasil pengetahuannya masih relevan dalam ujaran ini.
- source_word: שִׁמְעָהּ
  choice: kabar tentangnya
  rationale: Nomina ini dapat berarti kabar, laporan, atau desas-desus. “Kabar tentangnya” alami dan menunjukkan pengetahuan tidak langsung; akhiran feminin merujuk kepada hikmat dalam konteks.
theological_decisions:
- issue: Personifikasi Abadon dan Maut
  choice: Keduanya disajikan sebagai pembicara yang dipersonifikasikan.
  alternative: Menerjemahkan אֲבַדּוֹן sebagai konsep abstrak “Kebinasaan” dan menulis “maut” tanpa penandaan personifikasi.
  rationale: Teks memberi keduanya tindakan berkata dan mendengar. Penulisan sebagai “Abadon” dan “Maut” mempertahankan personifikasi puitis tanpa menjadikannya pernyataan doktrinal tentang keberadaan pribadi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Struktur paralel serta citra pendengaran dipertahankan, sementara “tentangnya” merujuk kepada hikmat dari konteks sebelumnya.
