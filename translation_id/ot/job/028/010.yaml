  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: id
  text: Ia membelah batu cadas menjadi saluran-saluran[a], dan matanya melihat segala sesuatu yang berharga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aliran-aliran” atau “kanal-kanal”; istilah Ibraninya dapat menunjuk pada aliran air, tetapi dalam gambaran pertambangan di sini kemungkinan besar berarti saluran yang dibuat dengan membelah batu.
    reason: lexical_alternative
  - marker: b
    text: Atau “segala barang bernilai” atau “segala bijih berharga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: di dalam batu cadas
  rationale: 'צוּר menunjuk pada batu atau tebing batu yang keras. Prefiks ב paling wajar dipahami secara lokatif dalam gambaran pertambangan: saluran dibelah di dalam formasi batu cadas.'
- source_word: יְאֹרִים
  choice: saluran-saluran
  rationale: יְאֹרִים biasanya berarti aliran air, sungai, atau kanal. Dalam konteks pertambangan, 'saluran-saluran' mempertahankan makna dasar tanpa mempersempitnya secara berlebihan menjadi terowongan atau lubang tambang.
- source_word: בִּקֵּעַ
  choice: membelah
  rationale: בקע berarti membelah, memecahkan, atau membukakan. 'Membelah' mempertahankan daya ungkap Ibrani dan sesuai dengan tindakan membuat jalur di batu.
- source_word: יְקָר
  choice: sesuatu yang berharga
  rationale: יְקָר mencakup apa pun yang bernilai, mahal, atau berharga. Ungkapan ini tidak membatasi maksudnya hanya pada bijih atau permata.
- source_word: רָאֲתָה עֵינוֹ
  choice: matanya melihat
  rationale: Terjemahan ini mempertahankan ungkapan puitis harfiah 'matanya melihat'. Kala kini sesuai dengan uraian tindakan yang berlangsung secara umum dalam bagian ini.
