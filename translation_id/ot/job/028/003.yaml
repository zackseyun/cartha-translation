  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: id
  text: Ia menetapkan batas bagi kegelapan; Ia menyelidiki hingga ke segala ujung, batu kekelaman dan kegelapan pekat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengikuti ungkapan Ibrani secara lebih harfiah, “batu kekelaman dan bayang-bayang maut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: menetapkan batas bagi kegelapan
  rationale: קֵץ dapat berarti akhir atau batas, dan bersama שָׂם menyatakan tindakan menetapkan suatu batas. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran konkret Ibrani.
- source_word: וּלְכָל תַּכְלִית הוּא חוֹקֵר
  choice: menyelidiki sampai ke batas terjauh
  rationale: תַּכְלִית dalam konteks penambangan menunjuk pada ujung atau batas paling jauh, sedangkan חקר menyatakan pencarian atau penyelidikan yang saksama. Susunan ini menyampaikan jangkauan pencarian tanpa memberi arti moral berupa 'kesempurnaan'.
- source_word: אֶבֶן
  choice: batu-batuan
  rationale: Kata benda tunggal ini dapat dipahami secara kolektif. 'Batu-batuan' lebih alami untuk konteks penambangan, tanpa menggantinya dengan istilah yang lebih khusus seperti 'bijih'.
- source_word: אֹפֶל
  choice: kekelaman
  rationale: אֹפֶל menunjuk pada kegelapan pekat atau suasana suram. 'Kekelaman' membedakannya dari חֹשֶׁךְ pada awal ayat.
- source_word: צַלְמָוֶת
  choice: kelam pekat
  rationale: Dalam konteks lorong tambang, istilah ini paling wajar menunjuk pada kegelapan yang amat dalam. Padanan tradisional yang berkaitan dengan maut tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna צַלְמָוֶת
  choice: kelam pekat
  alternative: bayang-bayang maut
  rationale: Gambaran penambangan bawah tanah mendukung makna kegelapan yang sangat pekat, tetapi bentuk tradisional dapat mengandung nuansa maut. Alternatif itu dipertahankan agar ambiguitas leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Kata ganti 'Ia' mempertahankan subjek maskulin tunggal dalam teks Ibrani tanpa menjelaskan identitasnya secara berlebihan.
