  register: Bahasa Indonesia baku modern dengan irama puitis dan retoris. Tanda pisah menonjolkan “hikmat” sebagai pokok pertanyaan. Partikel tanya -kah menjaga nuansa bermartabat tanpa menjadi arkais.
