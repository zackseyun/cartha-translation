  text: וְֽ֭/הַ/חָכְמָה מֵ/אַ֣יִן תָּב֑וֹא וְ/אֵ֥י זֶ֝֗ה מְק֣וֹם בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/020.yaml
  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: id
  text: Namun, hikmat—dari manakah datangnya? Di manakah tempat pengertian?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan susunan yang lebih formal: “Dari manakah hikmat datang, dan di manakah tempat pengertian?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Namun, hikmat
  rationale: Kata חָכְמָה berarti “hikmat”. Konjungsi וְ secara harfiah dapat berarti “dan”, tetapi di sini mengantar kembali pertanyaan utama dengan nuansa kontras; “Namun” menyampaikan fungsi retoris itu secara alami.
- source_word: מֵאַיִן
  choice: dari manakah
  rationale: Interogatif אַיִן dengan prefiks מֵ menyatakan asal, yakni “dari mana”. Bentuk “dari manakah” mempertahankan penekanan pada asal hikmat dan sesuai dengan ragam puitis yang bermartabat.
- source_word: תָּבוֹא
  choice: datangnya
  rationale: Bentuk imperfek Qal orang ketiga feminin tunggal dari בוא merujuk kepada hikmat dan dalam konteks ini menyatakan pertanyaan umum tentang asalnya. Konstruksi “dari manakah datangnya?” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada masa depan.
- source_word: וְאֵי זֶה
  choice: Di manakah
  rationale: Ungkapan interogatif ini menanyakan tempat. Hubungan antarklausa tetap jelas dalam bahasa Indonesia tanpa harus menerjemahkan וְ secara tersendiri sebagai “dan”.
- source_word: מְקוֹם
  choice: tempat
  rationale: מְקוֹם secara langsung berarti “tempat”; pilihan ini mempertahankan gambaran spasial dalam teks Ibrani dan lebih puitis daripada “lokasi”.
- source_word: בִּינָה
  choice: pengertian
  rationale: בִּינָה menunjuk pada pengertian, wawasan, atau daya membedakan. “Pengertian” mempertahankan pembedaan leksikal dari חָכְמָה tanpa mempersempit maknanya.
