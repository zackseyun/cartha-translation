  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: id
  text: Emas murni tidak dapat diberikan sebagai gantinya,[a] dan perak tidak dapat ditimbang sebagai harganya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “emas pilihan.”'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, perak tidak dapat ditimbang untuk membayar harganya. Pada zaman itu, perak lazim ditimbang sebagai alat pembayaran.
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: dapat diberikan
  rationale: Bentuk pasif dari נתן dalam konteks penilaian ini menyatakan sesuatu yang dapat diserahkan sebagai pembayaran; dengan לֹא, frasa ini menyatakan ketidakmungkinan.
- source_word: סְגוֹר
  choice: emas murni
  rationale: Dalam puisi hikmat, istilah ini menunjuk pada emas pilihan atau yang dimurnikan, bukan sekadar emas secara umum.
- source_word: תַּחְתֶּיהָ
  choice: sebagai gantinya
  rationale: תחת dengan sufiks di sini menyatakan penggantian atau pertukaran, bukan posisi ruang; sufiks feminin merujuk kepada hikmat dalam konteks sebelumnya.
- source_word: יִשָּׁקֵל
  choice: dapat ditimbang
  rationale: Bentuk pasif dari שקל menggambarkan perak yang ditimbang untuk pembayaran, sesuai praktik ekonomi kuno.
- source_word: כֶּסֶף
  choice: perak
  rationale: Makna konkretnya adalah perak, yang dalam konteks ini berfungsi sebagai alat pembayaran; mempertahankan 'perak' melestarikan gambaran ekonomi teks.
- source_word: מְחִירָהּ
  choice: harganya
  rationale: מְחִיר berarti harga atau nilai pembelian; bentuk bersufiks feminin merujuk kepada hikmat.
theological_decisions:
- issue: Rujukan sufiks feminin pada תַּחְתֶּיהָ dan מְחִירָהּ
  choice: -nya, merujuk kepada hikmat dari konteks sebelumnya
  alternative: menyebut 'hikmat' secara eksplisit
  rationale: Bahasa sumber memakai pronomina, sehingga terjemahan mempertahankan kohesi dan tidak menambahkan nomina yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan klausa mempertahankan emas sebagai subjek gramatikal klausa pertama, sesuai bahasa Ibrani. 'Sebagai gantinya' dipilih sebagai ungkapan pertukaran yang wajar; paralelisme kedua klausa dipertahankan.
