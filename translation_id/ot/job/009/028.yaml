base_translation:
  language: en
  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: id
  text: Aku takut akan segala penderitaanku[a]; aku tahu bahwa Engkau tidak akan menyatakan aku tidak bersalah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku gentar terhadap segala kesusahanku” atau “Aku takut akan segala dukacitaku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Engkau tidak akan membebaskan aku” atau “Engkau tidak akan membiarkan aku tanpa hukuman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: Aku takut
  rationale: Bentuk qal perfek orang pertama tunggal dari גור menyatakan rasa takut atau gentar; bentuk kini paling alami untuk daya statifnya dalam konteks ini.
- source_word: כָל
  choice: segala
  rationale: Mempertahankan cakupan menyeluruh dari kata Ibrani sambil menghasilkan ungkapan Indonesia yang alami.
- source_word: עַצְּבֹתָי
  choice: penderitaanku
  rationale: Kata ini dapat menunjuk pada rasa sakit, dukacita, atau kesusahan. 'Penderitaanku' cukup luas untuk mencakup pengalaman Ayub tanpa membatasinya hanya pada rasa sakit jasmani atau kesedihan batin.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk qal perfek dari ידע berdaya statif dan secara alami diterjemahkan dengan bentuk kini dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini memperkenalkan isi dari apa yang diketahui Ayub.
- source_word: לֹא
  choice: tidak
  rationale: Negasi langsung dipertahankan.
- source_word: תְנַקֵּנִי
  choice: Engkau tidak akan menyatakan aku tidak bersalah
  rationale: 'Bentuk piel dari נקה memiliki nuansa hukum: menyatakan seseorang bersih atau tidak bersalah, membebaskan, atau membiarkannya tanpa hukuman. Pilihan ini mempertahankan nuansa forensik sekaligus mudah dipahami.'
theological_decisions:
- issue: Nuansa hukum נקה dalam perkataan Ayub kepada Allah
  choice: Engkau tidak akan menyatakan aku tidak bersalah
  alternative: Engkau tidak akan membebaskan aku; Engkau tidak akan membiarkan aku tanpa hukuman
  rationale: Terjemahan ini mempertahankan keyakinan Ayub bahwa Allah tidak akan menyatakannya bersih dalam penghakiman, tanpa menyelesaikan ketegangan teologis dalam ucapannya atau memasukkan kategori doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku yang modern, khidmat, dan mudah dipahami. Kata ganti 'Engkau' menandai bahwa Ayub sedang menyapa Allah. Urutan penanda catatan kaki diselaraskan dengan unsur yang dijelaskannya.
