  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: id
  text: Maka aku akan berbicara dan tidak takut kepada-Nya, sebab aku tidak demikian dalam diriku sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab tidak demikian halnya denganku”; lebih harfiah, “sebab tidak demikian aku dengan diriku sendiri.” Klausa terakhir dalam bahasa Ibrani bersifat eliptis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: Maka aku akan berbicara
  rationale: Bentuk orang pertama tunggal ini menyatakan tekad atau tindakan hipotetis Ayub yang bergantung pada konteks sebelumnya; “maka” memperjelas hubungan tersebut secara wajar.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: tanpa takut kepada-Nya
  rationale: Ungkapan ini secara langsung menyatakan bahwa Ayub akan berbicara dan tidak takut kepada pihak yang dirujuk oleh sufiks orang ketiga maskulin tunggal. Bentuk “tanpa takut” alami dalam bahasa Indonesia dan tetap mempertahankan kaitan antarklausa.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi pernyataan sebelumnya.
- source_word: לֹא כֵן
  choice: tidak demikian
  rationale: Pilihan ini mempertahankan ungkapan perbandingan yang ringkas dan eliptis tanpa menentukan secara berlebihan apa yang tidak “demikian”.
- source_word: אָנֹכִי עִמָּדִי
  choice: keadaanku sendiri
  rationale: Secara harfiah konstruksi ini dekat dengan “aku dengan diriku,” tetapi sangat eliptis. “Keadaanku sendiri” menyampaikan nuansa refleksif dan keadaan yang dialami Ayub dengan bahasa Indonesia yang alami, sambil menandai ambiguitasnya dalam catatan kaki.
theological_decisions:
- issue: Penafsiran klausa akhir yang eliptis
  choice: sebab keadaanku sendiri tidak demikian
  alternative: 'sebab tidak demikian halnya denganku; lebih harfiah: sebab tidak demikian aku dengan diriku sendiri'
  rationale: Klausa Ibrani sangat padat dan eliptis. Terjemahan utama dibuat terbaca tanpa menetapkan secara pasti apakah Ayub merujuk pada keadaan batinnya, kedudukannya saat ini, atau situasi yang dihadapinya. Catatan kaki mempertahankan pilihan-pilihan yang benar-benar dimungkinkan oleh bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “-Nya” dipakai untuk rujukan kepada Allah sesuai konteks, tanpa menambahkan gelar atau penjelasan teologis yang tidak terdapat dalam ayat.
