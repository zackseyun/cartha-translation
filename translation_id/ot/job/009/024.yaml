  yaml_path: translation/ot/job/009/024.yaml
  text: The earth is given into the hand of the wicked[a]; he covers the faces of its judges. If not[b], then who is it?
translation:
  language: id
  text: Bumi telah diserahkan ke dalam tangan orang fasik[a]; ia menutupi wajah para hakimnya.[b] Jika tidak, lalu siapa dia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Negeri telah diserahkan ke dalam tangan seorang yang fasik.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri”, dan רָשָׁע dapat menunjuk kepada seorang yang fasik atau kepada orang fasik secara umum.'
    reason: lexical_alternative
  - marker: b
    text: Subjek “ia menutupi” tidak disebutkan secara eksplisit dalam bahasa Ibrani. Subjek itu dapat dipahami sebagai Allah, penguasa yang fasik, atau pelaku yang tidak ditentukan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: Bumi
  rationale: Kata ini dapat berarti “bumi” atau “negeri/tanah”. Dalam konteks keluhan Ayub tentang ketidakadilan dalam tatanan dunia, “bumi” paling sesuai dengan cakupan yang luas, sementara kemungkinan “negeri” dipertahankan dalam catatan kaki.
- source_word: נִתְּנָה
  choice: telah diserahkan
  rationale: Bentuk Nifal perfektif menyatakan tindakan pasif dengan keadaan yang masih berlaku. “Telah diserahkan” menyampaikan baik tindakan maupun akibatnya.
- source_word: בְיַד
  choice: ke dalam tangan
  rationale: Ungkapan Ibrani ini berarti diserahkan ke dalam kuasa seseorang. Metafora “tangan” dipertahankan karena tetap jelas dalam bahasa Indonesia.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggalnya dapat menunjuk kepada seorang yang fasik secara representatif atau kepada orang fasik secara umum. “Orang fasik” mempertahankan bentuk tunggal tanpa menentukan tokoh tertentu.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: wajah para hakimnya
  rationale: Terjemahan ini mempertahankan gambaran konkret “wajah” dan arti langsung “para hakim”; akhiran pronominal merujuk kembali kepada bumi.
- source_word: יְכַסֶּה
  choice: ia menutupi
  rationale: Bentuk Piel orang ketiga tunggal maskulin paling langsung berarti “ia menutupi”. Subjeknya tidak disebutkan secara eksplisit dalam bahasa Ibrani, sehingga identitasnya tidak diperjelas dalam teks.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: Jika bukan dia, lalu siapa?
  rationale: Kalimat ini merupakan tantangan retoris. “Lalu” menyampaikan daya אֵפוֹא, sedangkan “dia” mencerminkan הוּא tanpa menetapkan identitas tokohnya.
theological_decisions:
- issue: Identitas subjek tersirat dari “ia menutupi” dan sosok dalam pertanyaan “lalu siapa?”
  choice: Identitas subjek dibiarkan tidak ditentukan, sebagaimana dalam bahasa Ibrani.
  alternative: Subjek dapat dipahami sebagai Allah, orang fasik yang berkuasa, atau pelaku yang tidak ditentukan.
  rationale: Konteks retorika Ayub mungkin mengarahkan pembaca kepada Allah sebagai pelaku terakhir, tetapi klausa Ibraninya tidak menyebut subjek יְכַסֶּה. Terjemahan tidak menyelesaikan ketegangan teologis ini secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang ringkas. Metafora Ibrani “ke dalam tangan” dan “wajah para hakim” dipertahankan karena dapat dipahami secara alami serta menjaga kekuatan gambaran sumber.
