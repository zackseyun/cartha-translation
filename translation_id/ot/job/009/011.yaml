base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: id
  text: Lihatlah, Ia melintas di dekatku, dan aku tidak melihat-Nya; Ia berlalu, dan aku tidak menyadari-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan aku tidak memahami-Nya.” Kata Ibrani yang digunakan dapat berarti menyadari, mengenali, atau memahami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel ini memperkenalkan pengamatan yang tegas dan hidup. “Lihatlah” alami dalam bahasa Indonesia modern serta mempertahankan daya penunjuknya.
- source_word: יַעֲבֹר עָלַי
  choice: Ia lewat di dekatku
  rationale: Gabungan עבר dengan על di sini menggambarkan gerak melewati Job. “Di dekatku” menyampaikan kedekatan tanpa memberi kesan bahwa Ia menginjak atau secara harfiah berada di atas Job.
- source_word: וְלֹא אֶרְאֶה
  choice: tetapi aku tidak melihat-Nya
  rationale: Terjemahan langsung dari bentuk negatif verba ראה; tidak ditambahkan gagasan ketidakmampuan yang tidak dinyatakan secara eksplisit.
- source_word: וְיַחֲלֹף
  choice: Ia berlalu
  rationale: חלף menyatakan gerak lewat atau terus berlalu. Pilihan ini mempertahankan kesejajaran dengan verba pertama tanpa mengulang ungkapan yang sama persis.
- source_word: וְלֹא אָבִין לוֹ
  choice: tetapi aku tidak menyadari-Nya
  rationale: בין dapat berarti memahami atau mengenali dengan daya pengamatan. Dalam konteks kehadiran Allah yang tidak tertangkap indra, “menyadari” menyampaikan pengenalan atau persepsi, sambil mencatat kemungkinan arti “memahami” dalam catatan kaki.
theological_decisions:
- issue: Rujukan subjek orang ketiga dan sufiks
  choice: Kata ganti “Ia/-Nya” merujuk kepada Allah.
  alternative: Subjek tidak tentu, yaitu “seseorang”.
  rationale: Konteks langsung, khususnya Ayub 9:10–12, membicarakan tindakan Allah yang tidak terselami. Kata ganti mempertahankan rujukan personal tanpa menambahkan sebutan “Allah” yang tidak muncul dalam ayat ini.
- issue: Makna אָבִין לוֹ
  choice: Tidak menyadari atau mengenali kehadiran-Nya
  alternative: Tidak memahami Dia
  rationale: Konteks visual dan gerak mendukung nuansa persepsi atau kesadaran, tetapi cakupan makna intelektual tetap sah dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Kesejajaran dua klausa gerak dan dua tanggapan negatif dipertahankan.
