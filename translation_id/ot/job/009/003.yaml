  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: id
  text: Jika seseorang ingin berbantah dengan Dia,[a] ia tidak dapat menjawab-Nya satu kali pun dari seribu kali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berperkara dengan Dia” atau “menggugat Dia.” Kata Ibrani yang diterjemahkan “berbantah” dapat bernuansa sengketa hukum.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia tidak dapat menjawab-Nya satu dari seribu”; maksudnya, ia tidak mampu menjawab-Nya bahkan satu kali dalam seribu kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan keadaan bersyarat atau hipotesis secara langsung.
- source_word: יַחְפֹּץ
  choice: ingin
  rationale: Menyatakan kehendak atau keinginan tanpa memberi kesan kesenangan emosional yang tidak dituntut konteks.
- source_word: לָרִיב
  choice: berbantah
  rationale: Mencakup pertentangan verbal dan tetap dapat membawa nuansa sengketa atau perkara hukum.
- source_word: עִמּוֹ
  choice: dengan Dia
  rationale: Mempertahankan arti dasar preposisi 'dengan'; huruf kapital menunjukkan bahwa menurut konteks pronomina ini merujuk kepada Allah tanpa mengganti pronomina dengan nama-Nya.
- source_word: לֹא יַעֲנֶנּוּ
  choice: ia tidak dapat menjawab-Nya
  rationale: Dalam konteks menghadapi Allah dalam sengketa, ungkapan ini menyatakan ketidakmampuan memberi jawaban, bukan sekadar keengganan.
- source_word: אַחַת מִנִּי אָלֶף
  choice: satu pun dari seribu
  rationale: Mengungkapkan ketimpangan yang sangat besar secara alami dalam bahasa Indonesia sekaligus mempertahankan bentuk hiperbolis Ibrani.
theological_decisions:
- issue: Rujukan pronomina dalam pernyataan Ayub
  choice: Orang yang hendak berbantah adalah manusia, sedangkan 'Dia/-Nya' merujuk kepada Allah.
  alternative: Kedua pronomina dapat dibaca secara umum sebagai dua pihak manusia.
  rationale: Konteks dekat, khususnya Ayub 9:2-4, membahas hikmat dan kuasa Allah. Namun, teks utama tetap memakai pronomina dan tidak menyisipkan nama 'Allah', sehingga bentuk sumber tetap dipertahankan.
- issue: Nuansa ketidakmampuan atau penolakan dalam לֹא יַעֲנֶנּוּ
  choice: 'Ketidakmampuan: ''tidak dapat menjawab-Nya''.'
  alternative: 'Pernyataan masa depan sederhana: ''tidak akan menjawab-Nya''.'
  rationale: Alur argumentasi menekankan ketidakmampuan manusia mempertahankan perkaranya di hadapan Allah, meskipun bentuk Ibrani sendiri secara harfiah dapat dinyatakan sebagai 'tidak akan menjawabnya'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Berbantah' dipilih agar mudah dipahami sekaligus mempertahankan kemungkinan nuansa forensik. Kapitalisasi 'Dia/-Nya' mengikuti rujukan kontekstual kepada Allah, tanpa menyisipkan rujukan eksplisit yang tidak terdapat dalam teks Ibrani.
