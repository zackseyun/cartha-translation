  text: Truly[a], I know that it is so[b]; but how can a man be righteous before God?
translation:
  language: id
  text: Sungguh, aku tahu bahwa memang demikian. Namun, bagaimana manusia dapat benar di hadapan Allah?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagaimana manusia dapat dianggap benar di hadapan Allah?” atau “bagaimana manusia dapat dinyatakan benar di hadapan Allah?”'
    reason: lexical_alternative
  - marker: b
