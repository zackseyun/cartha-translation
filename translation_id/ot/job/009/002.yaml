lexical_decisions:
- source_word: אָמְנָם
  choice: Sungguh
  rationale: Menandai pengakuan Ayub yang tegas dan khidmat dengan ungkapan Indonesia yang alami.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektif ini menyatakan pengetahuan atau pengakuan yang sudah mantap; bentuk kini paling alami dalam bahasa Indonesia.
- source_word: כִי כֵן
  choice: bahwa memang demikian
  rationale: Mempertahankan penegasan bahwa perkataan sebelumnya benar adanya.
- source_word: וּמַה
  choice: Namun, bagaimana
  rationale: Waw bersama kata tanya mengalihkan perkataan dari pengakuan menuju pertanyaan yang berlawanan secara argumentatif.
- source_word: יִצְדַּק
  choice: dapat dianggap benar
  rationale: Verba צדק dalam konteks ini memiliki nuansa status benar dalam perkara atau penilaian. Pilihan ini terdengar alami dan mempertahankan nuansa forensik tanpa memasukkan mekanisme doktrinal tertentu.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Nomina ini menunjuk secara representatif kepada manusia yang lemah dan fana. 'Manusia' bersifat umum dan alami dalam bahasa Indonesia.
- source_word: עִם אֵל
  choice: di hadapan Allah
  rationale: Secara harfiah berarti 'dengan Allah', tetapi dalam konteks relasional-forensik ungkapan ini menyatakan kedudukan seseorang di hadapan Allah.
theological_decisions:
- issue: Nuansa forensik kebenaran manusia dalam hubungannya dengan Allah
  choice: bagaimana manusia dapat dianggap benar di hadapan Allah?
  alternative: bagaimana manusia dapat benar di hadapan Allah?; bagaimana manusia dapat dinyatakan benar terhadap Allah?
  rationale: Bahasa sumber memungkinkan arti berada dalam pihak yang benar atau dinyatakan benar. Terjemahan ini menjaga nuansa pengadilan dan pertanyaan teologis teks tanpa menjelaskan jawabannya menurut rumusan doktrinal yang muncul kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Kata ganti orang pertama “aku” sesuai dengan tuturan pribadi Ayub. Struktur dua kalimat mempertahankan peralihan dari pengakuan tegas menuju pertanyaan yang menyelidik.
