  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: id
  text: Sebab Dia bukan manusia seperti aku, sehingga aku dapat menjawab-Nya dan kami dapat bersama-sama menghadap di pengadilan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sehingga aku dapat menjawab-Nya dan kami dapat bersama-sama datang untuk penghakiman.”'
    reason: Alternatif ini mempertahankan מִשְׁפָּט secara lebih harfiah sebagai “penghakiman”, bukan mengungkapkan latar hukumnya dengan “pengadilan”.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan yang menjelaskan keluhan Ayub sebelumnya; “Sebab” mempertahankan alur argumentatifnya.
- source_word: לֹא אִישׁ כָּמֹנִי
  choice: Dia bukan manusia seperti aku
  rationale: אִישׁ menunjuk pada manusia sebagai pihak yang dapat berhadapan dengan Ayub. “Manusia” terdengar alami dalam bahasa Indonesia dan mempertahankan kontras antara Allah dan Ayub tanpa menyiratkan bahwa pokok utamanya ialah jenis kelamin.
- source_word: אֶעֱנֶנּוּ
  choice: aku dapat menjawab-Nya
  rationale: ענה berarti menjawab atau menanggapi; dalam konteks hukum ini, “menjawab-Nya” mempertahankan nuansa memberikan jawaban terhadap pihak lawan perkara. Bentuk modal “dapat” menyampaikan ketidakmungkinan yang dinyatakan oleh konteks.
- source_word: נָבוֹא יַחְדָּו
  choice: kami dapat bersama-sama menghadap
  rationale: Bentuk orang pertama jamak mencakup Ayub dan Allah, sedangkan יַחְדָּו menekankan bahwa keduanya hadir bersama. “Menghadap” merupakan ungkapan Indonesia yang wajar untuk tampil dalam proses hukum.
- source_word: בַּמִּשְׁפָּט
  choice: menghadap pengadilan
  rationale: מִשְׁפָּט dapat berarti penghakiman, keputusan hukum, atau perkara hukum. Dalam gambaran litigasi ayat ini, “pengadilan” menyampaikan latar forensik secara jelas dan alami.
theological_decisions:
- issue: Gambaran perkara hukum antara Ayub dan Allah
  choice: Ayat diterjemahkan sebagai ketidakmungkinan Ayub dan Allah tampil sebagai dua pihak setara di pengadilan.
  alternative: “kami dapat bersama-sama datang untuk dihakimi”
  rationale: Bahasa Ibrani memakai gambaran hukum, tetapi tidak mengajarkan lebih dari ketidakmampuan Ayub untuk menggugat Allah sebagai sesama manusia yang setara. Terjemahan ini mempertahankan ketegangan dalam ucapan Ayub tanpa mengembangkannya menjadi pernyataan doktrinal tambahan.
- issue: Makna אִישׁ dalam kontras dengan Allah
  choice: manusia
  alternative: laki-laki
  rationale: Walaupun nomina Ibrani berbentuk maskulin tunggal dan penuturnya laki-laki, fokus kontrasnya ialah bahwa Allah bukan manusia seperti Ayub. “Manusia” menyampaikan kontras ontologis dan forensik tersebut secara tepat dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Struktur kalimat dibuat lugas sambil mempertahankan metafora hukum dan bentuk orang pertama jamak dalam teks Ibrani.
