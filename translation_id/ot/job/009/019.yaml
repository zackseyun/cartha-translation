  yaml_path: translation/ot/job/009/019.yaml
  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: id
  text: Jika yang dipersoalkan adalah kekuatan, sungguh, Dia perkasa; dan jika yang dipersoalkan adalah perkara hukum[a], siapa yang dapat memanggil aku untuk menghadap?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti “keadilan” atau “penghakiman”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bentuk Ibraninya memakai objek “aku” dan dapat juga dipahami, “siapa yang dapat menetapkan sidang bagiku?” Karena konteks berbicara tentang membawa perkara melawan Allah, sebagian orang memahami maksudnya sebagai “siapa yang dapat memanggil Dia?”
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: Jika yang dipersoalkan adalah kekuatan
  rationale: Preposisi לְ membingkai pokok yang sedang diperbandingkan, yakni ‘dalam hal’ atau ‘berkenaan dengan’ kekuatan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan susunan dua kemungkinan dalam ayat tersebut.
- source_word: אַמִּיץ הִנֵּה
  choice: sungguh, Dialah yang perkasa
  rationale: אַמִּיץ menyatakan kekuatan yang besar, sedangkan הִנֵּה memberi penegasan retoris. ‘Sungguh’ lebih wajar daripada ‘lihatlah’ dalam konteks ini. Kata ganti ‘Dia’ menjadikan subjek tersiratnya jelas dalam bahasa Indonesia tanpa menambah identitas di luar konteks.
- source_word: וְאִם לְמִשְׁפָּט
  choice: dan jika perkara pengadilan
  rationale: מִשְׁפָּט di sini berada dalam rangkaian gambaran hukum di pasal 9. ‘Perkara pengadilan’ mempertahankan nuansa sengketa atau proses hukum, bukan hanya gagasan abstrak tentang keadilan.
- source_word: מִי יוֹעִידֵנִי
  choice: siapa yang dapat memanggil aku untuk menghadap?
  rationale: Bentuk יוֹעִידֵנִי memiliki akhiran objek orang pertama tunggal (‘aku’) dan dalam konteks hukum dapat menunjuk pada pemanggilan untuk hadir pada sidang atau pertemuan yang ditetapkan. Terjemahan mengikuti bentuk Masoret, sementara pembacaan kontekstual lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Gambaran hukum dalam tantangan Ayub mengenai Allah
  choice: Memakai bahasa ruang sidang dan mempertahankan objek orang pertama ‘aku’ sesuai bentuk Ibrani Masoret.
  alternative: ‘Jika mengenai keadilan, siapa yang dapat memanggil Dia?’
  rationale: Konteks menampilkan ketidakmungkinan membawa perselisihan dengan Allah ke pengadilan. Namun, bentuk Ibrani yang diwariskan secara langsung berbunyi ‘aku’, sehingga ketegangan antara tata bahasa dan alur konteks tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada khidmat. Paralelisme dua anak kalimat dipertahankan; ‘sungguh’ menyampaikan daya retoris הִנֵּה tanpa memakai ungkapan arkais.
