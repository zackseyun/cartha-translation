  text: חָ֭לְפוּ עִם אֳנִיּ֣וֹת אֵבֶ֑ה כְּ֝/נֶ֗שֶׁר יָט֥וּשׂ עֲלֵי אֹֽכֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/026.yaml
  text: They pass by like reed boats, like an eagle swooping on prey.
translation:
  language: id
  text: Hari-hariku berlalu seperti perahu-perahu papirus,[a] seperti rajawali yang menukik ke arah mangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: perahu-perahu gelagah. Arti kata Ibrani ini tidak pasti.'
    reason: אֵבֶה hanya muncul di sini dan identifikasi bahan atau jenis perahunya diperdebatkan; catatan mempertahankan ketidakpastian leksikal yang nyata.
lexical_decisions:
- source_word: חָלְפוּ
  choice: berlalu
  rationale: Bentuk perfekt jamak ini meneruskan subjek 'hari-hariku' dari ayat 25 dan menyatakan bahwa hari-hari itu lewat dengan cepat.
- source_word: אֳנִיּוֹת אֵבֶה
  choice: perahu-perahu papirus
  rationale: אֳנִיּוֹת berarti 'perahu-perahu'; אֵבֶה adalah istilah langka yang paling mungkin menunjuk pada papirus atau gelagah sebagai bahan perahu. 'Papirus' mempertahankan citra perahu ringan dan cepat tanpa mengubahnya menjadi jenis perahu modern.
- source_word: נֶשֶׁר
  choice: rajawali
  rationale: Istilah ini menunjuk pada burung pemangsa besar; 'rajawali' merupakan padanan Indonesia yang alami bagi citra burung yang meluncur turun menuju mangsa.
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: yang menyambar mangsa
  rationale: Frasa menggambarkan gerak cepat burung pemangsa yang meluncur atau menerjang ke arah makanan; 'menyambar mangsa' menyampaikan citra itu secara alami dan ringkas.
theological_decisions:
- issue: Subjek tersirat pada awal ayat
  choice: Hari-hariku
  alternative: Mereka
  rationale: Bahasa Ibrani hanya memakai verba jamak, tetapi subjeknya secara sintaksis diteruskan dari 'hari-hariku' pada ayat 25. Mengulang subjek membuat ayat berdiri jelas dalam bahasa Indonesia tanpa menambahkan tafsir teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Pengulangan 'seperti' mempertahankan dua perbandingan berurutan dalam teks Ibrani; penanda catatan [a] ditempatkan langsung setelah frasa terkait.
