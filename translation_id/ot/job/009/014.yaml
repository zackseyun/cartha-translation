  text: Terlebih lagi aku, bagaimana mungkin aku dapat menjawab-Nya dan memilih kata-kataku ketika berbicara dengan-Nya?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kalau begitu, bagaimana mungkin aku menjawab-Nya?” Ungkapan pembuka dalam bahasa Ibrani, menurut konteksnya, menegaskan bahwa hal itu jauh lebih mustahil.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “argumen-argumenku” sebagai ganti “kata-kataku”, karena konteksnya menyangkut usaha Ayub menyampaikan perkaranya di hadapan Allah.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “dengan-Nya”. Dalam konteks ini juga dapat dipahami sebagai “di hadapan-Nya” atau “untuk melawan-Nya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Apalagi aku—bagaimana mungkin
  rationale: 'Dalam konteks ayat 11–13, ungkapan ini menyatakan penalaran a fortiori: jika tidak seorang pun dapat menahan Allah, lebih mustahil lagi Ayub dapat menjawab-Nya. Susunan ini menyampaikan daya retoris tersebut secara alami dalam bahasa Indonesia.'
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina orang pertama tunggal ini bersifat menegaskan. Kata “aku” sesuai dengan tuturan langsung Ayub dan penekanannya terbantu oleh posisi setelah “apalagi”.
- source_word: אֶעֱנֶנּוּ
  choice: aku menjawab-Nya
  rationale: Kata kerja ענה dalam qal berarti “menjawab” atau “menanggapi”. Dalam pertanyaan retoris ini, “bagaimana mungkin” menyatakan ketidakmampuan Ayub.
- source_word: אֶבְחֲרָה
  choice: memilih
  rationale: Terjemahan ini mempertahankan arti biasa בחר, yaitu memilih atau menyeleksi dengan sengaja.
- source_word: דְבָרַי
  choice: kata-kataku
  rationale: דבר dapat berarti kata, perkataan, atau perkara. “Kata-kataku” paling langsung dan mempertahankan gambaran Ayub yang harus memilih ucapannya dengan cermat; makna “argumen-argumenku” dicatat sebagai alternatif.
- source_word: עִמּוֹ
  choice: saat berhadapan dengan-Nya
  rationale: עם pada dasarnya berarti “dengan”. Dalam konteks perbantahan atau perkara, frasa Indonesia ini menyampaikan keterlibatan langsung dengan Allah tanpa memastikan apakah nuansanya sekadar di hadapan-Nya atau secara menentang-Nya.
theological_decisions:
- issue: Nuansa yudisial dalam perkataan Ayub kepada Allah
  choice: Mempertahankan ungkapan umum “kata-kataku saat berhadapan dengan-Nya”
  alternative: Menafsirkan secara khusus sebagai “argumen-argumenku untuk melawan-Nya”
  rationale: Konteks memang bernuansa perkara atau perbantahan, tetapi kosakata Ibraninya tidak mewajibkan perumusan yang sepenuhnya yudisial atau bermusuhan. Terjemahan utama mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa yang digunakan modern, lugas, dan tetap khidmat. Tanda pisah mempertahankan tekanan retoris pada “apalagi aku”. Bentuk “-Nya” mengikuti kebiasaan ejaan Indonesia untuk rujukan kepada Allah tanpa menambahkan penafsiran pada isi ayat.
