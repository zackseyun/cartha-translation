  text: חֲכַ֣ם לֵ֭בָב וְ/אַמִּ֣יץ כֹּ֑חַ מִֽי הִקְשָׁ֥ה אֵ֝לָ֗י/ו וַ/יִּשְׁלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/004.yaml
  text: He is wise in heart and mighty in strength[a]; who has hardened himself against him and prospered?
translation:
  language: id
  text: Ia bijaksana dalam hati dan perkasa dalam kekuatan; siapa yang mengeraskan diri terhadap-Nya dan tetap selamat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan berhasil,” atau “dan tetap tidak terluka.” Kata kerja Ibrani ini dapat berarti keluar dalam keadaan utuh atau aman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: bijaksana dalam hati
  rationale: Mempertahankan gambaran Ibrani tentang hati sebagai pusat pikiran dan kehendak, dengan ungkapan puitis yang tetap mudah dipahami.
- source_word: וְאַמִּיץ כֹּחַ
  choice: dan perkasa dalam kekuatan
  rationale: Mencerminkan kolokasi Ibrani yang bersifat menegaskan, meskipun sedikit repetitif, serta mempertahankan gaya puisi.
- source_word: מִי
  choice: siapa
  rationale: Mengawali pertanyaan retoris secara langsung dan alami dalam bahasa Indonesia.
- source_word: הִקְשָׁה
  choice: mengeraskan diri
  rationale: Mempertahankan nuansa refleksif Hifil dan sikap keras kepala atau perlawanan yang disengaja.
- source_word: אֵלָיו
  choice: terhadap-Nya
  rationale: Dalam konstruksi ini preposisi menunjukkan pertentangan kepada Allah, bukan sekadar arah.
- source_word: וַיִּשְׁלָם
  choice: dan tetap selamat
  rationale: Kata dari akar שלם di sini menunjuk pada keluar dari perlawanan dalam keadaan utuh atau tanpa celaka. 'Tetap selamat' alami dalam konteks pertanyaan retoris dan menjaga gagasan tetap tidak binasa.
theological_decisions:
- issue: Subjek tersirat pada awal ayat
  choice: Ia, yang merujuk kepada Allah dalam konteks
  alternative: Allah itu
  rationale: Teks Ibrani tidak menyebutkan subjek secara eksplisit, tetapi konteks perkataan Ayub jelas menunjuk kepada Allah. Pronomina mempertahankan sifat implisit itu tanpa menambahkan nama yang tidak ada pada ayat.
- issue: Kapitalisasi pronomina ilahi
  choice: terhadap-Nya
  alternative: terhadapnya
  rationale: Kapitalisasi membantu pembaca Indonesia mengenali bahwa rujukannya adalah Allah, tanpa mengubah makna sintaksis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur paralel Ibrani dipertahankan sejauh tetap alami; tanda titik koma menghubungkan pernyataan tentang sifat Allah dengan pertanyaan retoris yang menyusul.
