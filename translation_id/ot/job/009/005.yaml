  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: id
  text: Dia memindahkan gunung-gunung[a] tanpa mereka menyadarinya[b], ketika Dia menjungkirbalikkannya dalam murka-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggeser gunung-gunung.” Kata Ibrani ini dapat berarti menyebabkan sesuatu berpindah dari tempatnya.
    reason: lexical_alternative
  - marker: b
    text: Baris ini secara puitis mempersonifikasikan gunung-gunung seolah-olah mereka tidak menyadari ketika Dia menjungkirbalikkannya.
    reason: cultural_note
  - marker: c
    text: Atau “dalam amarah-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: memindahkan
  rationale: Partisipel Hifil dari עתק menyatakan tindakan menyebabkan sesuatu bergeser dari tempatnya. “Memindahkan” alami dalam bahasa Indonesia dan tetap membuka kemungkinan gerakan atau penyingkiran.
- source_word: הָרִים
  choice: gunung-gunung
  rationale: Mempertahankan makna baku dan bentuk jamak Ibrani.
- source_word: וְלֹא יָדָעוּ
  choice: tanpa mereka menyadarinya
  rationale: Ungkapan ini menyampaikan bahwa gunung-gunung tidak mengetahui apa yang terjadi, sambil mempertahankan personifikasi puitis. Akhiran “-nya” memasok objek tersirat secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: ketika
  rationale: Dalam konteks ini אֲשֶׁר memperkenalkan keadaan atau waktu terjadinya tindakan, sehingga “ketika” lebih alami daripada padanan relatif yang harfiah.
- source_word: הֲפָכָם
  choice: Dia menjungkirbalikkannya
  rationale: Kata הפך menyatakan membalik atau menjungkirbalikkan, dan akhiran pronominal jamak objek dirujuk secara alami oleh “-nya” kepada gunung-gunung.
- source_word: בְּאַפּוֹ
  choice: dalam murka-Nya
  rationale: אַף secara idiomatis berarti kemarahan atau murka. “Murka” sesuai dengan register puisi hikmat yang luhur, sedangkan “dalam” mempertahankan nuansa keadaan atau sarana tanpa mempersempitnya.
