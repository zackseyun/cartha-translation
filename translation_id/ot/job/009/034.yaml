base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: id
  text: Kiranya Ia menyingkirkan tongkat-Nya dari atasku[a], dan janganlah kengerian-Nya membuat aku gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya Ia menjauhkan tongkat-Nya dariku, dan janganlah kengerian-Nya menakutkan aku.”'
    reason: Alternatif leksikal dan idiomatis untuk יָסֵר, מֵעָלַי, dan תְּבַעֲתַנִּי.
lexical_decisions:
- source_word: יָסֵר
  choice: Kiranya Ia menyingkirkan
  rationale: Bentuk hifil dalam konteks ini berdaya yusif, menyatakan harapan atau permohonan Ayub. 'Kiranya ... menyingkirkan' mempertahankan nuansa volitif dan terdengar wajar dalam puisi Indonesia.
- source_word: מֵעָלַי
  choice: dari atasku
  rationale: Secara harfiah berarti 'dari atas diriku'. Pilihan ini mempertahankan gambaran tongkat yang membebani atau terangkat mengancam di atas Ayub.
- source_word: שִׁבְטוֹ
  choice: tongkat-Nya
  rationale: שֵׁבֶט dapat berarti tongkat, gada, atau tongkat kerajaan. Dalam konteks penderitaan dan ancaman, 'tongkat' paling baik mempertahankan citra alat pukulan atau penghukuman tanpa mempersempitnya secara berlebihan.
- source_word: וְאֵמָתוֹ
  choice: dan kedahsyatan-Nya
  rationale: אֵימָה menunjuk pada kengerian atau kedahsyatan yang menimbulkan rasa takut. 'Kedahsyatan-Nya' secara alami menyatakan rasa gentar yang ditimbulkan oleh Allah, bukan sifat takut pada diri-Nya.
- source_word: אַל
  choice: janganlah
  rationale: Partikel negatif ini bersama verba berikut mengungkapkan larangan atau harapan negatif. 'Janganlah' menjaga daya volitif serta laras puitis yang tetap modern.
- source_word: תְּבַעֲתַנִּי
  choice: menggentarkan aku
  rationale: Verba בעת berarti menakutkan, mengejutkan, atau membuat gentar. 'Menggentarkan aku' kuat namun alami dan menghindari pengulangan leksikal yang kaku dengan 'kedahsyatan'.
theological_decisions:
- issue: Rujukan pronomina orang ketiga tunggal
  choice: Allah dibicarakan secara tidak langsung sebagai 'Ia/-Nya', bukan disapa sebagai 'Engkau/-Mu'.
  alternative: 'Sapaan langsung: ''Singkirkanlah tongkat-Mu dariku, dan jangan biarkan kedahsyatan-Mu menggentarkan aku.'''
  rationale: Teks Ibrani memakai verba orang ketiga tunggal dan sufiks orang ketiga, selaras dengan Ayub yang berbicara tentang Allah dalam bagian ini. Terjemahan mempertahankan tata bahasa tersebut dan tidak mengubahnya menjadi sapaan langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penulisan Alkitab bahasa Indonesia. Susunan 'dari atasku' sengaja dipertahankan untuk membawa citra Ibrani, dengan alternatif yang lebih idiomatis dalam catatan kaki.
