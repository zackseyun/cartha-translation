  text: who alone stretches out the heavens and treads on the heights of the sea[a].
translation:
  language: id
  text: Dia sendiri yang membentangkan langit dan menginjak tempat-tempat tinggi di laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berjalan di atas gelombang-gelombang laut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: membentangkan
  rationale: Partisipel Qal dari נטה menggambarkan tindakan membentangkan atau merentangkan; “membentangkan” alami dalam bahasa Indonesia dan cocok dengan gambaran kosmis puitis.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam konteks kosmologis puitis, שָׁמַיִם menunjuk pada bentangan langit; “langit” merupakan padanan Indonesia yang alami tanpa harus meniru bentuk jamak Ibrani.
- source_word: לְבַדּוֹ
  choice: sendiri
  rationale: Kata ini menekankan bahwa tindakan tersebut dilakukan oleh Allah seorang diri, tanpa bantuan pihak lain.
- source_word: וְדוֹרֵךְ
  choice: dan menginjak
  rationale: דרך dalam Qal berarti menginjak atau menapaki. “Menginjak” mempertahankan citra fisik yang kuat tanpa memberi nuansa penghancuran seperti “menginjak-injak”.
- source_word: עַל
  choice: di
  rationale: Dalam ungkapan gerak ini, “di” menghasilkan susunan Indonesia yang wajar; relasi berada atau bergerak di atas permukaan tetap tersirat.
- source_word: בָּמֳתֵי
  choice: tempat-tempat tinggi
  rationale: במה pada dasarnya berarti ketinggian atau tempat tinggi. Terjemahan ini mempertahankan metafora Ibrani, sementara kemungkinan bahwa yang dimaksud adalah gelombang dijelaskan dalam catatan kaki.
- source_word: יָם
  choice: laut
  rationale: Bentuk tunggal Ibrani dipertahankan dengan “laut”, sesuai dengan citra kosmis dalam puisi ini.
theological_decisions:
- issue: Gambaran kosmis tentang kedaulatan ilahi atas ciptaan
  choice: Mempertahankan gambaran bahwa Dia sendiri membentangkan langit dan menginjak tempat-tempat tinggi di laut.
  alternative: Menerjemahkan bagian akhir secara lebih interpretatif sebagai “berjalan di atas gelombang-gelombang laut.”
  rationale: Teks menampilkan kekuasaan unik Allah melalui bahasa puitis yang luhur. Terjemahan utama mempertahankan metafora dan ketegangannya tanpa mereduksinya atau memasukkan klaim doktrinal dari teks lain; penafsiran yang mungkin dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan “Dia sendiri yang” menonjolkan eksklusivitas לְבַדּוֹ secara alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
