  - marker: c
    text: Atau “tanpa alasan” atau “dengan cuma-cuma”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata ganti relatif ini melanjutkan gambaran tentang Allah dari konteks sebelumnya; “yang” merupakan penghubung alami dalam bahasa Indonesia.
- source_word: בִּשְׂעָרָה
  choice: dalam badai
  rationale: שְׂעָרָה berarti badai atau angin ribut. Preposisi ב dapat menunjukkan suasana/cara maupun alat; “dalam badai” mempertahankan citraan dan ambiguitasnya secara wajar.
- source_word: יְשׁוּפֵנִי
  choice: meremukkan aku
  rationale: Kata kerja שׁוף jarang dipakai dan maknanya bergantung pada konteks. Di sini, kesejajarannya dengan luka-luka yang diperbanyak menunjukkan tindakan yang mencederai dengan hebat; “meremukkan” menyampaikan daya tersebut.
- source_word: וְהִרְבָּה
  choice: dan memperbanyak
  rationale: Bentuk kausatif רבה berarti membuat menjadi banyak atau menambah; “memperbanyak” dekat dengan bentuk dan citraan teks Ibrani.
- source_word: פְצָעַי
  choice: luka-lukaku
  rationale: פצע menunjuk pada luka atau cedera. Bentuk ulang menyampaikan kejamakan sufiksal secara alami dalam bahasa Indonesia.
- source_word: חִנָּם
  choice: tanpa sebab
  rationale: חִנָּם berarti dengan cuma-cuma, tanpa alasan, atau tanpa sebab. “Tanpa sebab” mempertahankan daya moral dan yudisial keluhan Ayub.
theological_decisions:
- issue: Apakah חִנָּם menyatakan bahwa Ayub mutlak tidak berdosa atau menyuarakan pengalamannya tentang penderitaan yang tidak layak diterimanya
  choice: Menerjemahkannya secara langsung sebagai “tanpa sebab” tanpa melunakkan keluhan Ayub atau menyelesaikan ketegangan teologisnya.
  alternative: “tanpa alasan” atau “padahal aku tidak layak menerimanya”
  rationale: Ayat ini menyuarakan protes Ayub. Terjemahan perlu mempertahankan kekuatannya tanpa memasukkan kesimpulan doktrinal tentang kepolosan mutlak Ayub atau keadilan Allah yang tidak dinyatakan oleh ayat ini sendiri.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan fragmen relatif “yang ...” dipertahankan karena ayat ini melanjutkan kalimat dan gambaran tentang Allah dari ayat sebelumnya.
