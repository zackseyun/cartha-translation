  text: yang meremukkan aku dalam badai[a][b] dan memperbanyak luka-lukaku tanpa sebab[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan badai” atau “dalam angin ribut”. Preposisi Ibrani dapat menunjukkan cara, keadaan, atau alat.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini juga dapat diterjemahkan “mememarkan” atau, meski kurang mungkin di sini, “menggigit”.
