  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ/מַּרְגִּ֣יז אֶ֭רֶץ מִ/מְּקוֹמָ֑/הּ וְ֝/עַמּוּדֶ֗י/הָ יִתְפַלָּצֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/006.yaml
  text: who shakes the earth from its place[a], and its pillars tremble.
translation:
  language: id
  text: 'yang mengguncangkan bumi dari tempatnya,

    dan tiang-tiangnya bergetar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berguncang” atau “gemetar.”'
    reason: Alternatif leksikal untuk יִתְפַלָּצוּן.
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: yang mengguncangkan
  rationale: Partisipel Hifil dari רגז menyatakan tindakan kausatif. “Yang mengguncangkan” alami dalam bahasa Indonesia dan cocok sebagai kelanjutan puitis dari gambaran tentang Allah.
- source_word: אֶרֶץ
  choice: bumi
  rationale: Konteks kosmis—bumi bergeser dari tempatnya dan tiang-tiangnya bergetar—lebih mendukung “bumi” daripada “negeri” atau “tanah”.
- source_word: מִמְּקוֹמָהּ
  choice: dari tempatnya
  rationale: Terjemahan langsung dan wajar bagi preposisi מִן, kata מָקוֹם, dan sufiks feminin tunggal yang merujuk kepada bumi.
- source_word: וְעַמּוּדֶיהָ
  choice: dan tiang-tiangnya
  rationale: “Tiang-tiang” mempertahankan citra kosmologis puitis teks Ibrani tanpa menafsirkannya menjadi “dasar-dasar” atau menyesuaikannya dengan kosmologi modern.
- source_word: יִתְפַלָּצוּן
  choice: bergetar
  rationale: Bentuk ini menggambarkan guncangan atau gemetaran hebat. “Bergetar” menjaga kesejajaran puitis dengan “mengguncangkan” tanpa memberi kesan psikologis yang tidak perlu.
theological_decisions:
- issue: Citra kosmologis tentang tiang-tiang bumi
  choice: Mempertahankan citra harfiah sebagai “tiang-tiangnya”
  alternative: Menafsirkannya sebagai “dasar-dasarnya” agar selaras dengan pemahaman kosmologi modern
  rationale: Ayat ini memakai bahasa kosmologis puitis kuno. Terjemahan mempertahankan citra asli tanpa memodernkan, mendemitologikan, atau mengubahnya menjadi pernyataan ilmiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan “yang mengguncangkan” dipertahankan sebagai klausa partisipial yang melanjutkan uraian tentang Allah dari konteks sebelumnya. Penanda catatan kaki [a] dicantumkan langsung setelah kata yang diterangkan.
