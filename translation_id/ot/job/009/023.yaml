base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: id
  text: Jika cambuk membunuh secara tiba-tiba, ia menertawakan kemalangan orang-orang yang tidak bersalah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia menertawakan ujian orang-orang yang tidak bersalah” atau “ia menertawakan keruntuhan orang-orang yang tidak bersalah.” Kata benda Ibrani ini dapat berarti ujian, keruntuhan, atau keputusasaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan fungsi syarat atau pengandaian dari partikel Ibrani tanpa mengubahnya menjadi pernyataan waktu yang lebih pasti.
- source_word: שׁוֹט
  choice: cambuk
  rationale: Mempertahankan gambaran konkret alat pemukul yang secara kiasan dapat menunjuk pada malapetaka atau hukuman yang melanda.
- source_word: יָמִית
  choice: membunuh
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati; 'membunuh' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: פִּתְאֹם
  choice: dengan tiba-tiba
  rationale: Menyampaikan tindakan mendadak secara alami dalam bahasa Indonesia.
- source_word: לְמַסַּת
  choice: kemalangan
  rationale: Dalam konteks penderitaan orang tak bersalah, pilihan ini menyampaikan keadaan berat yang menimpa mereka tanpa membatasinya hanya pada emosi batin; kemungkinan makna 'ujian' atau 'keruntuhan' dicatat dalam catatan kaki.
- source_word: נְקִיִּם
  choice: orang-orang yang tidak bersalah
  rationale: Menunjuk kepada mereka yang bebas dari kesalahan dan sesuai dengan argumen Ayub tentang penderitaan yang tidak semestinya.
- source_word: יִלְעָג
  choice: ia menertawakan
  rationale: Mengungkapkan tindakan mengejek atau mencemooh secara tajam, sambil mempertahankan subjek pronominal yang tidak disebutkan secara eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Subjek dari 'ia menertawakan'
  choice: Memakai pronomina 'ia' tanpa menyebut Allah secara eksplisit
  alternative: Menjadikan cambuk sebagai subjek yang dipersonifikasikan, atau menerjemahkan dengan subjek tak tentu
  rationale: Dalam alur Ayub 9, tuduhan Ayub tampaknya diarahkan kepada Allah, tetapi teks Ibrani tidak menyebut nama subjek. Pronomina huruf kecil mempertahankan ketegangan dan ambiguitas itu tanpa menyisipkan penafsiran secara terang-terangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Gambaran 'cambuk' dipertahankan, sedangkan susunan kalimat dibuat alami. Pronomina 'ia' sengaja tidak dikapitalisasi agar teks tidak secara eksplisit menetapkan Allah sebagai subjek.
