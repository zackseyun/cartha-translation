id: JOB.9.22
reference: Job 9:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַחַ֗ת הִ֥יא עַל כֵּ֥ן אָמַ֑רְתִּי תָּ֥ם וְ֝/רָשָׁ֗ע ה֣וּא מְכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/022.yaml
  text: It is all one[a]; therefore I say[b], ‘He destroys both the blameless and the wicked.’
translation:
  language: id
  text: Semuanya sama saja. Karena itu aku berkata[a], “Ia[b] membinasakan orang yang tidak bercela maupun orang fasik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah kukatakan.” Bentuk perfektif Ibrani dapat dipahami sebagai pernyataan kini atau sebagai pernyataan yang telah diucapkan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Hal itu membinasakan orang yang tidak bercela maupun orang fasik,” jika subjeknya dipahami secara lebih impersonal.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת הִיא
  choice: Semuanya sama saja
  rationale: Ungkapan ini menyatakan bahwa hasil akhirnya tidak berbeda, bukan sekadar menyebut bilangan satu. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nada suram perkataan Ayub.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari pernyataan sebelumnya dengan hubungan logis yang jelas.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Bentuk perfektif Ibrani di sini dapat berfungsi sebagai pernyataan yang sedang Ayub tegaskan dalam alur percakapan. Bentuk lampau atau perfektif tetap mungkin dan dicatat dalam catatan kaki.
- source_word: תָּם
  choice: orang yang tidak bercela
  rationale: Menunjuk pada keutuhan atau integritas watak, bukan kesempurnaan tanpa dosa. Ungkapan ini jelas dan wajar bagi pembaca Indonesia.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Padanan baku dalam sastra hikmat bagi orang yang bersalah secara moral dan membentuk kontras yang tepat dengan orang yang tidak bercela.
- source_word: הוּא מְכַלֶּה
  choice: Ia membinasakan
  rationale: Kata ganti maskulin tunggal dan partisip ini paling wajar dipahami merujuk kepada Allah dalam konteks Ayub 9. 'Membinasakan' menyampaikan daya verba כלה tanpa melunakkan keluhan Ayub.
theological_decisions:
- issue: Subjek tersirat dari tindakan membinasakan
  choice: Ia, merujuk kepada Allah dalam perkataan Ayub
  alternative: Hal itu membinasakan, dengan subjek yang dipahami secara lebih impersonal
  rationale: Konteks Ayub 9 membicarakan kuasa dan pemerintahan Allah, sehingga rujukan personal paling mungkin. Namun, ketegangan dalam bentuk Ibrani tidak dihapus; kemungkinan pemahaman impersonal dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kontras hikmat antara orang yang tidak bercela dan orang fasik dipertahankan, demikian pula ketegangan teologis dalam keluhan Ayub.
