lexical_decisions:
- source_word: אִם אָמְרִי
  choice: Jika aku berkata
  rationale: אִם memperkenalkan pernyataan bersyarat atau hipotetis. Bentuk lampau אָמְרִי dalam susunan ini paling wajar diungkapkan dengan bentuk kini bahasa Indonesia.
- source_word: אֶשְׁכְּחָה
  choice: Aku akan melupakan
  rationale: Bentuk orang pertama ini menyatakan tekad atau tindakan yang dibayangkan Ayub; bentuk ‘akan’ mempertahankan arah kehendaknya.
- source_word: שִׂיחִי
  choice: keluh kesahku
  rationale: Kata ini dapat berarti perenungan atau tuturan batin, tetapi dalam konteks ratapan Ayub menunjuk pada ungkapan kesusahan atau keluhan. ‘Keluh kesah’ terdengar alami dan mencakup proses batin serta ucapannya.
- source_word: אֶעֶזְבָה פָנַי
  choice: menanggalkan wajah muramku
  rationale: Secara harfiah berarti ‘aku akan meninggalkan wajahku’. Ungkapan ini menunjuk pada upaya melepaskan raut muka yang muram; ‘menanggalkan’ mempertahankan gambaran meninggalkan sesuatu tanpa menghasilkan bahasa Indonesia yang janggal.
- source_word: וְאַבְלִיגָה
  choice: dan kembali ceria
  rationale: Kata kerja בלג di sini kemungkinan menyatakan meredanya kesedihan atau menjadi lebih cerah/ceria. ‘Kembali ceria’ menyampaikan perubahan keadaan yang dimaksud secara alami.
