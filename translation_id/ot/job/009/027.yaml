  naturalness: “Meninggalkan raut muramku” adalah ungkapan Indonesia baku yang lebih alami daripada “menanggalkan wajah muramku,” sambil tetap mempertahankan citra raut/wajah. Kalimat tetap bernada puitis dan dibiarkan terbuka dengan koma karena berlanjut ke ayat berikutnya.
