  - marker: a
    text: Atau “renunganku” atau “tutur batinku”. Kata Ibrani ini dapat menunjuk pada perkataan batin, perenungan, atau keluhan; dalam konteks ratapan ini, “keluh kesah” paling sesuai.
    reason: lexical_alternative
