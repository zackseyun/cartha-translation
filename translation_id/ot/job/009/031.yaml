lexical_decisions:
- source_word: אָז
  choice: Lalu
  rationale: Menandai akibat berurutan dari pengandaian pada ayat sebelumnya dengan bahasa Indonesia yang alami.
- source_word: בַּשַּׁחַת
  choice: ke dalam lubang
  rationale: שַׁחַת dapat berarti lubang, parit, atau dalam konteks tertentu kebinasaan. 'Lubang' mempertahankan gambaran konkret tanpa mempersempitnya menjadi kebinasaan; preposisi ב bersama verba gerak diterjemahkan secara idiomatis sebagai 'ke dalam'.
- source_word: תִּטְבְּלֵנִי
  choice: Engkau akan mencelupkan aku
  rationale: Verba טבל berarti mencelupkan atau membenamkan. 'Mencelupkan' mempertahankan kaitan dengan gambaran pembasuhan pada ayat sebelumnya, sedangkan 'Engkau' menjaga sapaan langsung kepada Allah.
- source_word: וְתִעֲבוּנִי
  choice: akan merasa jijik terhadapku
  rationale: תעב menyatakan rasa muak atau jijik yang kuat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan personifikasi pakaian sebagai pihak yang merasa jijik terhadap Ayub.
- source_word: שַׂלְמוֹתָי
  choice: pakaianku sendiri
  rationale: Kata ini menunjuk pada pakaian atau jubah. 'Pakaianku sendiri' menonjolkan ironi bahwa bahkan benda yang paling dekat dan melekat pada Ayub akan menolaknya.
theological_decisions:
- issue: Pelaku yang tersirat dalam verba orang kedua
  choice: 'Allah disapa langsung: ''Engkau akan mencelupkan aku.'''
  alternative: Pembacaan impersonal bahwa Ayub sekadar akan jatuh atau berakhir di dalam lubang.
  rationale: Bentuk verba orang kedua maskulin tunggal meneruskan sapaan langsung Ayub kepada Allah. Terjemahan ini mempertahankan tajamnya keluhan Ayub dan ketegangan mengenai tindakan ilahi tanpa melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Personifikasi pakaian dipertahankan, demikian pula sapaan langsung kepada Allah dan gambaran pembasuhan yang berbalik menjadi kenajisan.
