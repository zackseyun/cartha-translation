translation:
  language: id
  text: Lalu Engkau akan membenamkan aku ke dalam lubang[a], dan pakaianku sendiri pun akan jijik kepadaku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke dalam parit.” Kata Ibrani שַׁחַת dapat berarti “lubang,” “parit,” atau, dalam konteks tertentu, “kebinasaan.”'
