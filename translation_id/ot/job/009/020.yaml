  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: id
  text: Jika aku benar, mulutku sendiri akan menyatakan aku bersalah; sekalipun aku tidak bercela, ia akan menyatakan bahwa aku bengkok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sekalipun aku tidak bercela, Ia akan menyatakan bahwa aku bengkok,” jika Allah dipahami sebagai subjek tersirat dalam klausa kedua.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel ini paling alami memperkenalkan syarat pada klausa pertama; nuansa konsesif muncul pada klausa berikutnya.
- source_word: אֶצְדָּק
  choice: aku benar
  rationale: Bentuk qal ini bersifat statif, yakni berada di pihak yang benar dalam konteks pengadilan, bukan membenarkan diri sendiri.
- source_word: פִּי
  choice: mulutku sendiri
  rationale: Secara harfiah berarti 'mulutku'; 'sendiri' menonjolkan ironi bahwa perkataan Ayub justru berbalik melawannya.
- source_word: יַרְשִׁיעֵנִי
  choice: akan menyatakan aku bersalah
  rationale: Hifil dari רשע dalam konteks forensik berarti menetapkan atau menyatakan seseorang bersalah.
- source_word: תָּם
  choice: tidak bercela
  rationale: Dalam kitab Ayub, kata ini menunjuk pada integritas atau keadaan tanpa cela, bukan kesempurnaan tanpa dosa.
- source_word: וַיַּעְקְשֵׁנִי
  choice: akan menyatakan aku bengkok
  rationale: Kata kerja ini menggambarkan seseorang sebagai bengkok atau menyimpang. Subjek 'mulutku' diteruskan dari klausa sebelumnya, dan 'menyatakan' mempertahankan nuansa forensik tanpa memberi kesan bahwa mulut itu secara harfiah mengubah watak Ayub.
theological_decisions:
- issue: Subjek וַיַּעְקְשֵׁנִי
  choice: Subjeknya diteruskan dari 'mulutku'.
  alternative: 'Allah adalah subjek tersirat: ''Ia akan menyatakan aku bengkok.'''
  rationale: Kesejajaran kedua klausa mendukung kesinambungan subjek, tetapi bahasa Ibrani tidak menyebut subjek itu secara eksplisit. Catatan kaki mempertahankan kemungkinan bahwa Allah adalah subjek tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'benar', 'bersalah', serta 'menyatakan' mempertahankan latar forensik; 'bengkok' menjaga metafora Ibrani dan ketegangan ucapan Ayub.
