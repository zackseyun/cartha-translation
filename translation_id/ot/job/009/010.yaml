  text: who does great things beyond searching out[b][a], and wonders beyond number.
translation:
  language: id
  text: yang melakukan hal-hal besar yang tak terselidiki[a], dan keajaiban yang jumlahnya tak terhitung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang tidak dapat diselidiki.” Ungkapan Ibrani ini berarti bahwa hal-hal besar-Nya tidak dapat diselidiki atau dipahami sepenuhnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hingga tidak ada bilangan”; maksudnya, jumlahnya tidak terhitung banyaknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: yang melakukan
  rationale: Partisipel Qal berfungsi secara deskriptif dan merujuk kepada Allah dalam konteks sebelumnya; bentuk ini alami dalam bahasa Indonesia serta mempertahankan hubungan relatifnya.
- source_word: גְדֹלוֹת
  choice: perkara-perkara besar
  rationale: Adjektiva feminin jamak ini digunakan secara substantival. 'Perkara-perkara besar' mempertahankan cakupan luas tanpa membatasinya hanya pada perbuatan atau karya tertentu.
- source_word: עַד אֵין חֵקֶר
  choice: yang tak terselidiki
  rationale: Ungkapan Ibrani ini menyatakan bahwa perkara-perkara besar tersebut tidak dapat diselidiki atau dipahami sepenuhnya. Pilihan ini ringkas, wajar, dan mempertahankan gagasan ketakterjangkauan manusia.
- source_word: וְנִפְלָאוֹת
  choice: dan keajaiban-keajaiban
  rationale: Kata ini menunjuk pada hal atau tindakan luar biasa yang membangkitkan kekaguman; 'keajaiban-keajaiban' merupakan padanan Indonesia yang jelas dan umum.
- source_word: עַד אֵין מִסְפָּר
  choice: yang tak terhitung
  rationale: Frasa ini berarti jumlahnya tidak dapat dihitung. Bentuk ini alami dalam bahasa Indonesia dan sejajar secara makna dengan klausa sebelumnya.
