  register: Bahasa Indonesia baku, modern, dan puitis. “Berfirman” sesuai bagi tindakan tutur Allah, sedangkan “memeteraikan” mempertahankan metafora Ibrani tanpa menjelaskan secara berlebihan. Penanda catatan ditempatkan langsung sesudah unsur yang diterangkan.
