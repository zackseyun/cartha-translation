  text: הָ/אֹמֵ֣ר לַ֭/חֶרֶס וְ/לֹ֣א יִזְרָ֑ח וּ/בְעַ֖ד כּוֹכָבִ֣ים יַחְתֹּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/007.yaml
  text: who says to the sun[b][a], ‘Do not rise,’ and seals up the stars.
translation:
  language: id
  text: yang berfirman kepada matahari[b], “Jangan terbit,”[a] dan memeteraikan bintang-bintang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dan matahari tidak terbit”; bahasa Ibrani dapat menyatakan perintah kepada matahari ataupun akibat dari firman Allah.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani חֶרֶס di sini kemungkinan berarti “matahari” dalam pemakaian puitis; di tempat lain kata itu dapat berarti barang tembikar atau tanah liat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: yang berfirman
  rationale: Partisipel ini melanjutkan gambaran tentang Allah pada konteks sebelumnya. Karena perkataan ilahi di sini berdaya memerintah, “berfirman” alami dan bermartabat dalam bahasa Indonesia.
- source_word: לַחֶרֶס
  choice: kepada matahari
  rationale: Dalam konteks puitis yang menyebut terbit dan bintang-bintang, חֶרֶס menunjuk kepada matahari, bukan tanah liat atau barang tembikar.
- source_word: וְלֹא יִזְרָח
  choice: “Jangan terbit,”
  rationale: Bentuk imperfek sesudah “berfirman kepada matahari” dapat dipahami sebagai isi perintah. Terjemahan ini mempertahankan personifikasi yang hidup, sementara kemungkinan makna hasil dicatat dalam catatan kaki.
- source_word: וּבְעַד
  choice: dan
  rationale: Bersama verba חתם, preposisi ini menyumbang pada gambaran menutup atau menghalangi. Dalam bahasa Indonesia, maknanya tersampaikan secara alami melalui “memeteraikan bintang-bintang” tanpa menerjemahkan preposisi secara kaku.
- source_word: כּוֹכָבִים
  choice: bintang-bintang
  rationale: Bentuk jamak ini secara langsung berarti bintang-bintang; pengulangan nomina merupakan bentuk jamak baku dan alami dalam bahasa Indonesia.
- source_word: יַחְתֹּם
  choice: memeteraikan
  rationale: Verba חתם berarti membubuhkan meterai atau menutup dengan meterai. “Memeteraikan” mempertahankan citra konkret bahwa Allah menutup bintang-bintang sehingga tidak tampak.
theological_decisions: []
