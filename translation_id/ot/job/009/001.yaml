- source_word: וַיֹּאמַר
  choice: katanya
  rationale: Verba אמר adalah verba umum untuk berkata. Dalam bahasa Indonesia, “katanya” menghasilkan rumus pengantar ujaran yang alami sambil tetap mewakili unsur “berkata” dalam bahasa Ibrani.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada bentuk wayyiqtol menandai kelanjutan urutan naratif. “Lalu” menyampaikan perkembangan dari ucapan pembicara sebelumnya secara alami dalam bahasa Indonesia.
