id: JOB.9.21
reference: Job 9:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תָּֽם אָ֭נִי לֹֽא אֵדַ֥ע נַפְשִׁ֗/י אֶמְאַ֥ס חַיָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/021.yaml
  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: id
  text: Aku tidak bercela. Aku tidak mengenal diriku sendiri[a]; aku membenci hidupku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: nyawaku. Kata Ibrani nefesy dapat berarti diri, nyawa, atau hidup.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: tidak bercela
  rationale: Kata ini menunjuk pada keutuhan watak atau integritas. Dalam konteks Ayub, frasa ini menyatakan bahwa dirinya tidak bersalah dalam perkara yang diperdebatkan, tanpa harus berarti sempurna tanpa dosa.
- source_word: אָ֭נִי
  choice: aku
  rationale: Pronomina orang pertama dipertahankan secara eksplisit, sesuai penekanan dalam bahasa Ibrani.
- source_word: לֹא אֵדַע
  choice: tidak mengenal
  rationale: Makna dasar verba יָדַע adalah 'mengetahui/mengenal'. Terjemahan ini mempertahankan ungkapan Ibrani yang tajam dan ambigu, tanpa mengubahnya menjadi tafsiran seperti 'tidak memedulikan'.
- source_word: נַפְשִׁי
  choice: diriku sendiri
  rationale: נֶפֶשׁ dapat berarti diri, nyawa, atau hidup. 'Diriku sendiri' paling wajar sebagai objek 'mengenal' dalam bahasa Indonesia, sedangkan keluasan makna istilah Ibraninya dijaga dalam catatan kaki.
- source_word: אֶמְאַס
  choice: membenci
  rationale: מָאַס berarti menolak atau memandang dengan kebencian. 'Membenci' menyampaikan daya emosional ungkapan ini secara alami tanpa memperkuatnya menjadi 'merasa jijik terhadap'.
- source_word: חַיָּי
  choice: hidupku
  rationale: Bentuk ini merujuk pada hidup atau keberadaan Ayub; 'hidupku' merupakan padanan Indonesia yang alami dan jelas.
theological_decisions:
- issue: Pernyataan Ayub bahwa dirinya תָּם
  choice: tidak bercela
  alternative: tidak bersalah; tulus
  rationale: Pilihan ini mempertahankan pengakuan integritas Ayub dalam konteks sengketanya tanpa menyiratkan kesempurnaan moral mutlak.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Tiga klausa pendek dipertahankan agar ketegangan dan keterputusan retoris teks Ibrani tetap terasa; ambiguitas נַפְשִׁי tidak diselesaikan secara berlebihan.
