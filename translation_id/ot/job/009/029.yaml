  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: id
  text: Aku akan dinyatakan bersalah[a]; mengapa kalau begitu aku bersusah payah dengan sia-sia?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menjadi fasik.” Kata kerja Ibrani dapat bermakna moral (“menjadi fasik”) atau forensik (“dinyatakan bersalah”).
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: Aku
  rationale: Pronomina orang pertama mandiri ini memberi penekanan pada subjek; “aku” alami dalam tuturan pribadi Ayub.
- source_word: אֶרְשָׁע
  choice: akan dinyatakan bersalah
  rationale: Bentuk Qal dari רשע dapat bermakna menjadi fasik atau, dalam konteks hukum, dinyatakan bersalah. Konteks Ayub 9 menonjolkan ketidakmampuan Ayub membuktikan dirinya benar di hadapan Allah, sehingga nuansa forensik paling sesuai, sementara alternatif moral dipertahankan dalam catatan kaki.
- source_word: לָמָה זֶּה
  choice: jadi, untuk apa
  rationale: Ungkapan idiomatis ini menyatakan pertanyaan inferensial, yakni “mengapa, kalau demikian?” Dalam bahasa Indonesia, “jadi, untuk apa” menghubungkannya secara alami dengan usaha sia-sia pada klausa berikutnya.
- source_word: הֶבֶל
  choice: dengan sia-sia
  rationale: Kata ini menunjuk pada kehampaan atau kesia-siaan; di sini menerangkan bahwa jerih payah Ayub tidak akan menghasilkan apa-apa.
- source_word: אִיגָע
  choice: aku bersusah payah
  rationale: Berasal dari יגע, yang berarti berjerih lelah, bekerja keras, atau menjadi letih. “Bersusah payah” mengungkapkan usaha berat dalam pertanyaan retoris ini.
theological_decisions:
- issue: Makna forensik atau moral dari רשע
  choice: 'Forensik: “akan dinyatakan bersalah”'
  alternative: 'Moral/deskriptif: “akan menjadi fasik”'
  rationale: Konteks dekat membahas ketidakmampuan Ayub membuktikan dirinya benar di hadapan Allah serta kepastian bahwa ia tetap diperlakukan sebagai orang bersalah. Terjemahan forensik mempertahankan alur argumentasinya tanpa menghapus kemungkinan leksikal moral, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pribadi, lugas, dan bermartabat. “Aku” sesuai dengan ujaran langsung Ayub; “bersusah payah” mudah dipahami dan tetap mencerminkan unsur jerih lelah dalam bahasa sumber.
