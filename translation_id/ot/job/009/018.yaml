  text: He does not let me catch my breath[b][a], for he fills me with bitterness.
translation:
  language: id
  text: Ia tidak membiarkan aku mengatur napas,[a] sebab Ia memenuhi aku dengan kepahitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memulihkan napasku”; secara harfiah, “tidak memberi aku untuk memulihkan napasku/rohku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan hal-hal pahit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: membiarkan aku
  rationale: Bentuk dari נתן secara harfiah berarti ‘memberi’, tetapi bersama infinitif berikutnya berfungsi secara idiomatis dengan arti ‘mengizinkan/membiarkan’.
- source_word: הָשֵׁב רוּחִי
  choice: menarik napas
  rationale: Gabungan infinitif kausatif שוב dengan רוּחַ secara harfiah menunjuk pada memulihkan atau mengembalikan napas/roh. Dalam konteks penderitaan Ayub yang tiada henti, ungkapan Indonesia ‘menarik napas’ secara alami menyatakan kesempatan untuk bernapas atau pulih sejenak tanpa menutup alternatif harfiahnya.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי paling wajar dipahami sebagai penghubung kausal yang memberikan alasan bagi pernyataan sebelumnya.
- source_word: יַשְׂבִּיעַנִי
  choice: memenuhi aku
  rationale: Hifil dari שבע berarti membuat kenyang atau memenuhi. ‘Memenuhi aku’ mempertahankan gambaran dibuat penuh oleh sesuatu yang menyakitkan dan sesuai dengan ragam puitis.
- source_word: מַמְּרֹרִים
  choice: dengan kepahitan
  rationale: Bentuk jamak ini dapat berarti kepahitan-kepahitan atau hal-hal pahit. Nomina abstrak ‘kepahitan’ terdengar alami dalam bahasa Indonesia, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan subjek orang ketiga tunggal
  choice: Ia
  alternative: Dia
  rationale: Konteks menunjuk kepada Allah sebagai pelaku. Kapitalisasi ‘Ia’ mengikuti kelaziman bahasa Indonesia untuk rujukan kepada Allah tanpa menambahkan penafsiran teologis baru.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. Susunan mempertahankan hubungan sebab-akibat dan metafora kepenuhan dalam teks Ibrani.
