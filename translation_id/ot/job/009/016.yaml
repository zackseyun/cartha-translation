  text: Jika aku berseru dan Dia menjawabku, aku tidak akan percaya bahwa Dia mendengarkan suaraku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Sekalipun
  rationale: Dalam konteks hipotesis yang bernuansa konsesif ini, 'sekalipun' menyampaikan bahwa bahkan andaikata hal itu terjadi, Ayub tetap sulit memercayainya. Bentuk ini alami dalam bahasa Indonesia tanpa mengubah skenario menjadi pernyataan waktu.
- source_word: קָרָאתִי
  choice: aku berseru
  rationale: קרא dapat berarti memanggil atau berseru. Dalam konteks permohonan Ayub kepada Allah, 'berseru' alami dan tetap mempertahankan gagasan menyuarakan panggilan tanpa menambahkan isi permohonan.
- source_word: וַיַּעֲנֵנִי
  choice: dan Dia menjawab aku
  rationale: ענה berarti menjawab atau menanggapi; 'menjawab aku' merupakan padanan langsung dan idiomatis.
- source_word: לֹא אַאֲמִין
  choice: aku tidak akan percaya
  rationale: Bentuk imperfek dalam konstruksi hipotesis ini paling alami dinyatakan dengan 'tidak akan percaya', yang mempertahankan daya modal dari skenario tersebut.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang tidak akan dipercayai Ayub, bukan alasan kausal.
- source_word: יַאֲזִין
  choice: mendengarkan
  rationale: אזן menunjuk pada memberi telinga atau mendengarkan dengan perhatian. 'Mendengarkan' mempertahankan nuansa perhatian lebih baik daripada sekadar 'mendengar'.
- source_word: קוֹלִי
  choice: suaraku
  rationale: קוֹלִי secara langsung berarti 'suaraku'; pilihan ini tidak mempersempit maknanya menjadi 'permohonanku'.
theological_decisions:
- issue: Gambaran tentang tanggapan Allah dalam perkataan Ayub
  choice: Ayat diterjemahkan sebagai ungkapan ketidakpercayaan subjektif Ayub bahwa Allah sungguh mendengarkannya, bahkan jika Allah menjawab.
  alternative: Menerjemahkannya sebagai penyangkalan mutlak bahwa Allah mendengarkan, atau melemahkannya menjadi sekadar keheranan.
  rationale: Teks menyatakan kesulitan pribadi Ayub untuk memercayai bahwa Allah memberi perhatian dalam skenario hipotetis tersebut. Terjemahan mempertahankan ketegangan pengalaman Ayub tanpa menjadikannya dalil bahwa Allah tidak pernah mendengar doa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi 'Dia' dipakai untuk rujukan kepada Allah. Susunan kalimat dijaga ringkas dan puitis, dengan ketegangan hipotetis-konsesif tetap terasa.
