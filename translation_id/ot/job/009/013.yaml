id: JOB.9.13
reference: Job 9:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱ֭לוֹהַּ לֹא יָשִׁ֣יב אַפּ֑/וֹ תחת/ו שָׁ֝חֲח֗וּ עֹ֣זְרֵי רָֽהַב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: id
  text: Allah tidak menarik kembali murka-Nya; di bawah-Nya para penolong Rahab merunduk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab di sini kemungkinan adalah nama figur kekacauan kosmis; “para penolong Rahab” berarti kekuatan-kekuatan yang bersekutu dengannya.
    reason: Pembaca modern dapat mengira Rahab merujuk kepada tokoh perempuan dalam Kitab Yosua, sedangkan konteks dan pemakaian puitis menunjuk kepada figur lain.
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Padanan baku dan wajar dalam bahasa Indonesia untuk sebutan tunggal bagi God dalam konteks ini.
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: tidak menarik kembali murka-Nya
  rationale: Secara dekat mempertahankan gagasan bahwa Allah tidak membalikkan atau menyurutkan murka-Nya; 'murka' menyampaikan idiom אַף secara alami.
- source_word: תחתו
  choice: di bawah-Nya
  rationale: Mempertahankan citra spasial dan ketundukan langsung dari teks Ibrani.
- source_word: שָׁחֲחוּ
  choice: merunduk
  rationale: Mengungkapkan postur direndahkan atau meringkuk di bawah kuasa Allah tanpa mempersempitnya menjadi tindakan ibadah.
- source_word: עֹזְרֵי רָהַב
  choice: para penolong Rahab
  rationale: Rahab dipertahankan sebagai nama figur/kekuatan kosmis, bukan diterjemahkan menjadi sifat abstrak, karena konstruksi 'para penolong Rahab' menunjuk kepada sekutu-sekutunya.
theological_decisions:
- issue: Identitas רָהַב (Rahab)
  choice: Mempertahankan 'Rahab' sebagai nama diri dengan catatan penjelas.
  alternative: Menerjemahkannya sebagai 'kesombongan' atau menafsirkannya langsung sebagai Mesir/monster laut.
  rationale: Dalam konteks puisi ini, Rahab kemungkinan merupakan figur kekacauan kosmis; mempertahankan nama menghindari penetapan identitas yang lebih spesifik daripada bukti teks.
- issue: Makna tindakan שָׁחֲחוּ
  choice: merunduk
  alternative: sujud atau membungkuk
  rationale: '''Merunduk'' menjaga nuansa ditaklukkan dan direndahkan tanpa menyiratkan secara pasti penyembahan sukarela.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan struktur dua klausa yang mengikuti paralelisme teks Ibrani. Kapital pada pronomina ilahi mengikuti kebiasaan ejaan religius Indonesia.
