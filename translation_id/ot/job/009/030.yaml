  text: If I washed myself with snow and cleansed my hands with lye,[a]
translation:
  language: id
  text: Sekalipun aku membasuh diriku dengan salju dan membersihkan tanganku dengan alkali,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "sabun"; istilah Ibrani ini lebih tepat merujuk pada bahan pembersih bersifat basa, seperti larutan alkali.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Sekalipun
  rationale: 'Dalam konteks argumen Ayub, klausa ini bersifat hipotetis dengan nuansa konsesif: bahkan bila ia membersihkan diri sebersih mungkin, hasil pada ayat berikutnya tetap tidak berubah.'
- source_word: הִתְרָחַצְתִּי
  choice: aku membasuh diriku
  rationale: Bentuk Hitpael bersifat refleksif; ungkapan ini mempertahankan makna bahwa Ayub membasuh dirinya sendiri.
- source_word: במו שָׁלֶג
  choice: dengan salju
  rationale: Frasa ini menyatakan sarana pembasuhan. Terjemahan ini mengikuti bentuk Ibrani tanpa menambahkan 'air salju', yang tidak dinyatakan secara eksplisit.
- source_word: וַהֲזִכּוֹתִי
  choice: dan membersihkan
  rationale: Bentuk Hifil dari זכה berarti membuat bersih atau murni. 'Membersihkan' wajar dalam bahasa Indonesia dan tetap menyisakan gema kemurnian dalam paralelisme ini.
- source_word: בְּבֹר
  choice: dengan alkali
  rationale: בֹּר menunjuk pada bahan pembersih bersifat basa. 'Alkali' lebih tepat daripada 'sabun' modern, sementara catatan kaki memberi padanan yang lebih umum.
- source_word: כַּפָּי
  choice: tanganku
  rationale: Secara harfiah berarti 'telapak tanganku', tetapi 'tanganku' merupakan ungkapan Indonesia yang alami dalam konteks membersihkan diri.
theological_decisions:
- issue: Hubungan bersyarat dalam אִם
  choice: Sekalipun
  alternative: Jika
  rationale: Konteks Ayub 9:30–31 menunjukkan kondisi hipotetis yang tidak mengubah hasil; 'sekalipun' menyampaikan daya konsesif itu tanpa menghilangkan sifat pengandaian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Membasuh' mempertahankan corak puitis, sedangkan 'alkali' dipilih demi ketepatan sejarah; alternatif yang lebih umum dijelaskan dalam catatan kaki.
