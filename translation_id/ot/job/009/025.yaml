  yaml_path: translation/ot/job/009/025.yaml
  text: My days are swifter than a runner[a]; they flee away; they do not see good.
translation:
  language: id
  text: Hari-hariku lebih cepat daripada seorang pelari; mereka melarikan diri; mereka tidak melihat kebaikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kebaikan” juga dapat berarti “kemakmuran” atau “kesejahteraan.”
    reason: Mempertahankan alternatif leksikal yang mungkin bagi טוֹבָה tanpa mengulang terjemahan harfiah yang kini telah tercermin dalam teks utama.
lexical_decisions:
- source_word: יָמַי
  choice: Hari-hariku
  rationale: Bentuk posesif jamak dari יוֹם dipertahankan sebagai ungkapan alami untuk hari-hari kehidupan Ayub.
- source_word: קַלוּ
  choice: lebih cepat
  rationale: Dalam perbandingan dengan pelari, bentuk dari קלל menyatakan kecepatan; frasa ini menyampaikan daya komparatifnya secara wajar.
- source_word: מִנִּי רָץ
  choice: daripada seorang pelari
  rationale: מִן menandai perbandingan dan רָץ menunjuk kepada orang yang berlari; 'pelari' tidak mempersempit maknanya menjadi kurir.
- source_word: בָּרְחוּ
  choice: semuanya berlalu
  rationale: Secara harfiah verba ini berarti 'melarikan diri'. Karena subjeknya hari-hari yang cepat lewat, 'berlalu' menyampaikan gerak menjauh secara alami tanpa memberi kesan bahwa hari-hari bertindak karena ketakutan.
- source_word: לֹא רָאוּ
  choice: tanpa mengalami
  rationale: Ungkapan Ibrani harfiahnya 'tidak melihat', tetapi 'mengalami' merupakan padanan idiomatis alami ketika objeknya adalah kebaikan.
- source_word: טוֹבָה
  choice: kebaikan
  rationale: Padanan luas ini mempertahankan cakupan טוֹבָה dan tidak membatasinya hanya pada kemakmuran, kebahagiaan, atau kesejahteraan.
