  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: id
  text: Tidak ada penengah di antara kami[a] yang dapat menaruh tangannya atas kami berdua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perantara.” Kata Ibrani ini dapat menunjuk kepada orang yang memutuskan perkara atau turun tangan di antara dua pihak yang bersengketa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: Tidak ada
  rationale: Konstruksi eksistensial negatif ini paling wajar diterjemahkan “Tidak ada” dalam bahasa Indonesia.
- source_word: בֵּינֵינוּ
  choice: di antara kami
  rationale: Frasa ini menyatakan posisi di antara dua pihak yang sedang bersengketa, yaitu Ayub dan Allah.
- source_word: מוֹכִיחַ
  choice: hakim penengah
  rationale: Dalam konteks perkara hukum, kata ini menunjuk kepada pihak ketiga yang memutuskan atau menengahi sengketa. “Hakim penengah” mempertahankan unsur pengadilan tanpa memasukkan gagasan teologis yang lebih jauh.
- source_word: יָשֵׁת
  choice: yang dapat meletakkan
  rationale: Bentuk verba menyatakan tindakan yang mungkin dilakukan oleh sosok yang diandaikan itu; “dapat” menyampaikan nuansa potensial secara alami.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Terjemahan konkret ini mempertahankan gambaran tangan, yang dalam konteks dapat menyiratkan kewenangan atas kedua pihak.
- source_word: עַל שְׁנֵינוּ
  choice: pada kami berdua
  rationale: Ungkapan ini menegaskan bahwa sang penengah akan bertindak terhadap kedua pihak secara bersamaan.
theological_decisions:
- issue: Apakah מוֹכִיחַ perlu diterjemahkan dengan istilah yang secara kristologis dapat dipahami sebagai “perantara”
  choice: hakim penengah
  alternative: perantara
  rationale: Konteks langsungnya adalah keluhan Ayub bahwa tidak ada pihak ketiga yang dapat mengadili perselisihan antara dirinya dan Allah. “Hakim penengah” mempertahankan latar forensik, sedangkan pilihan sah “perantara” dicatat dalam catatan kaki tanpa menjadikan pembacaan teologis tertentu sebagai satu-satunya makna.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Gambaran konkret tentang tangan dipertahankan, sementara “hakim penengah” memperjelas konteks sengketa tanpa berlebihan menafsirkan.
