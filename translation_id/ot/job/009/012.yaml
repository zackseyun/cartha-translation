  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: id
  text: Lihatlah, jika Dia merenggut[a], siapa dapat menghalangi-Nya?[b] Siapa dapat berkata kepada-Nya, “Apa yang Engkau lakukan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merebut” atau “membawa pergi.” Kata Ibrani ini menggambarkan pengambilan yang tiba-tiba dan kuat.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “menyebabkan-Nya kembali” atau “membuat-Nya kembali.” Dalam konteks ini, maksudnya ialah membuat-Nya mundur dari atau membalikkan tindakan-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian dan menegaskan pernyataan. “Lihatlah” mempertahankan daya retorisnya dalam bahasa Indonesia modern.
- source_word: יַחְתֹּף
  choice: merenggut
  rationale: Kata kerja חטף menunjuk pada tindakan mengambil secara tiba-tiba dan kuat. “Merenggut” menyampaikan unsur kekerasan serta pengambilan itu tanpa menambahkan objek yang tidak disebutkan.
- source_word: יְשִׁיבֶנּוּ
  choice: membuat-Nya berbalik
  rationale: Bentuk Hifil dari שוב secara harfiah berarti menyebabkan seseorang kembali atau berbalik. Ungkapan ini mempertahankan rujukan pronomina maskulin kepada Allah sekaligus menyatakan bahwa tindakan-Nya tidak dapat dibalikkan.
- source_word: מִי
  choice: siapa dapat
  rationale: Dalam pertanyaan retoris ini, מִי menyiratkan ketidakmampuan. Penambahan “dapat” menyampaikan daya retoris itu secara wajar dalam bahasa Indonesia.
- source_word: יֹאמַר אֵלָיו
  choice: berkata kepada-Nya
  rationale: Terjemahan langsung dan alami yang tidak menambahkan gagasan protes secara eksplisit, meskipun konteks pertanyaannya mengandung tantangan.
- source_word: מַה תַּעֲשֶׂה
  choice: Apa yang Kaulakukan?
  rationale: 'Bentuk imperfek dalam rumusan tantangan ini paling alami dipahami sebagai pertanyaan tentang tindakan yang sedang atau lazim dilakukan: “Apa yang Kaulakukan?”'
theological_decisions:
- issue: Rujukan pronomina orang ketiga maskulin tunggal
  choice: 'Pronomina diterjemahkan secara personal sebagai rujukan kepada Allah: “Dia” dan “-Nya”.'
  alternative: 'Memahaminya sebagai rujukan kepada sesuatu yang direnggut Allah: “itu”.'
  rationale: Konteks langsung menggambarkan tindakan Allah yang tidak dapat ditentang, dan baris berikutnya juga memakai pronomina yang jelas merujuk kepada-Nya. Namun, susunan Ibrani memungkinkan pembaca mempertimbangkan nuansa tindakan atau hasil rampasan; terjemahan utama mengikuti alur personal yang paling kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi dipakai agar rujukannya jelas. Pertanyaan retoris dipertahankan, demikian pula ketegangan tentang tindakan Allah yang tidak dapat dilawan.
