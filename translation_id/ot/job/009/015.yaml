  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: id
  text: Sekalipun aku benar, aku tidak akan menjawab; aku akan memohon belas kasihan kepada hakimku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: aku benar
  rationale: Bentuk verba ini menyatakan bahwa Ayub berada di pihak yang benar atau terbukti benar; ungkapan ringkas ini mempertahankan keluasan maknanya dalam konteks hukum.
- source_word: לֹא אֶעֱנֶה
  choice: aku tidak akan menjawab
  rationale: אענה secara alami berarti memberi jawaban, khususnya dalam suasana perkara hukum; bentuk modal bahasa Indonesia mengikuti konstruksi pengandaian pada awal ayat.
- source_word: לִמְשֹׁפְטִי
  choice: kepada hakimku
  rationale: Partisip dengan sufiks orang pertama menunjuk kepada pihak yang menghakimi Ayub; 'hakimku' mempertahankan citra pengadilan tanpa menentukan identitasnya secara lebih sempit.
- source_word: אֶתְחַנָּן
  choice: aku akan memohon belas kasihan
  rationale: Bentuk hitpael dari חנן menyatakan permohonan penuh belas kasihan atau kemurahan, bukan pembelaan hak.
theological_decisions:
- issue: Ketegangan antara kebenaran Ayub dan kedudukannya di hadapan hakim
  choice: Sekalipun aku benar, aku tidak akan menjawab
  alternative: Sekalipun aku dinyatakan benar, aku tidak akan membela diri
  rationale: Terjemahan ini tidak mengubah pernyataan pengandaian Ayub menjadi putusan hukum yang sudah diberikan dan tidak menyempitkan 'menjawab' menjadi semata-mata 'membela diri'.
- issue: Identitas 'hakimku'
  choice: hakimku
  alternative: Dia yang menghakimi aku
  rationale: Bentuk ringkas mempertahankan metafora hukum dan ambiguitas rujukan sebagaimana teks Ibrani, tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Susunan dua klausa mempertahankan kontras antara kemungkinan berada di pihak yang benar dan tetap memohon belas kasihan.
