  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: id
  text: Akankah Allah mendengar seruannya ketika kesesakan menimpanya?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jeritannya” atau “permohonannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “jika kesesakan menimpanya”; konjungsi Ibrani itu juga dapat dipahami secara kondisional, meskipun makna temporal “ketika” sangat sesuai dengan konteks.
    reason: alternative_reading
  - marker: c
    text: “Kesesakan” juga dapat diterjemahkan “kesusahan”, “malapetaka”, atau “penderitaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: seruannya
  rationale: צְעָקָה menunjuk pada seruan atau jeritan yang mendesak, khususnya dalam kesusahan. “Seruannya” alami, ringkas, dan mempertahankan nuansa permohonan mendesak.
- source_word: יִשְׁמַע
  choice: akankah ... mendengar
  rationale: Bentuk yiqtol dalam konteks pertanyaan retoris ini paling wajar diterjemahkan sebagai pertanyaan berorientasi masa depan.
- source_word: אֵל
  choice: Allah
  rationale: אֵל adalah sebutan umum bagi Allah atau Yang Mahakuasa; “Allah” merupakan padanan baku dan jelas dalam bahasa Indonesia Alkitabiah.
- source_word: כִּי
  choice: ketika
  rationale: Konjungsi ini memiliki rentang arti luas. Dalam klausa ini, makna temporal “ketika” paling sesuai dengan alur konteks, sambil tetap mencatat kemungkinan kondisional.
- source_word: תָבוֹא עָלָיו
  choice: menimpanya
  rationale: Ungkapan harfiah ‘datang atasnya’ secara idiomatis dinyatakan dengan “menimpanya” dalam bahasa Indonesia, tanpa mengubah gambaran datangnya kesesakan.
- source_word: צָרָה
  choice: kesesakan
  rationale: צָרָה mencakup kesusahan, tekanan, dan keadaan sulit. “Kesesakan” mempertahankan nuansa tekanan yang kuat serta register yang bermartabat.
theological_decisions: []
