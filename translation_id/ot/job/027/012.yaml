translation:
  language: id
  text: Lihatlah, kamu semua telah melihatnya; jadi, mengapa kamu berbuat sia-sia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai kata benda dan kata kerja dari akar yang sama, הבל, yang berkaitan dengan “kesia-siaan”, “kehampaan”, atau “kesemuan”. Permainan kata yang menegaskan teguran ini sulit disampaikan sepenuhnya dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel ini menegaskan pernyataan dan menarik perhatian pendengar. “Lihatlah” mempertahankan daya serunya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: kamu semua
  rationale: Gabungan kata ganti orang kedua jamak dan כֻּלְּכֶם bersifat menyeluruh serta menegaskan bahwa teguran ini ditujukan kepada setiap lawan bicara Ayub.
- source_word: חֲזִיתֶם
  choice: telah melihatnya
  rationale: Verba חזה berarti melihat atau mengamati. Bentuk “telah melihatnya” menunjukkan bahwa mereka sudah menyaksikan kenyataan yang sedang dibicarakan; akhiran “-nya” memasok objek tersirat secara alami dalam bahasa Indonesia.
- source_word: וְלָמָּה זֶּה
  choice: Jadi, mengapa ... masih saja
  rationale: Gabungan penghubung, kata tanya, dan זֶּה melanjutkan kesimpulan teguran berdasarkan apa yang telah mereka lihat. “Jadi” menampilkan hubungan inferensial, sedangkan “masih saja” menyampaikan tekanan kontekstual tanpa menerjemahkan זֶּה secara kaku sebagai penunjuk.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: berbuat sia-sia
  rationale: Nomina הֶבֶל dan verba serumpun תֶּהְבָּלוּ membentuk permainan kata yang menekankan kehampaan atau kesia-siaan. “Berbuat sia-sia” tetap cukup luas sehingga tidak membatasi teguran ini hanya pada perkataan, pikiran, atau perilaku tertentu.
