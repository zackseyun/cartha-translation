  text: He builds his house like a moth[a], like a shelter that a watchman makes.
translation:
  language: id
  text: Ia membangun rumahnya seperti ngengat[a], seperti pondok yang dibuat seorang penjaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti ngengat.” Arti tepat perbandingan ini tidak pasti; ada yang memahaminya sebagai gambaran rumah atau tempat tinggal ngengat yang rapuh.
    reason: Menjaga terjemahan utama tetap dekat dengan bahasa Ibrani sambil menjelaskan kemungkinan penafsiran tanpa menambah “sarang” ke dalam teks.
lexical_decisions:
- source_word: בָּנָה
  choice: membangun
  rationale: Bentuk perfektif dalam puisi ini menyatakan tindakan yang menjadi ciri orang fasik, sehingga kala kini generik paling alami dalam bahasa Indonesia.
- source_word: כָעָשׁ
  choice: seperti sarang ngengat
  rationale: עָשׁ lazim berarti 'ngengat'. Karena yang dibandingkan adalah rumah yang dibangun, 'sarang ngengat' mengungkapkan elipsis puitis Ibrani secara alami sambil mempertahankan gambaran tentang tempat tinggal yang rapuh.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Kesejajaran dengan pondok dan verba membangun mendukung arti bangunan harfiah, bukan 'keluarganya' atau 'isi rumahnya'.
- source_word: וּכְסֻכָּה
  choice: seperti pondok
  rationale: סֻכָּה menunjuk pada tempat berteduh sederhana dan sementara. 'Pondok' alami dalam konteks ladang dan menyampaikan sifat bangunan yang tidak permanen.
- source_word: עָשָׂה
  choice: yang dibuat
  rationale: Bentuk pasif relatif menghasilkan susunan bahasa Indonesia yang alami dan tetap mempertahankan penjaga sebagai pelaku pembuatan pondok.
- source_word: נֹצֵר
  choice: seorang penjaga
  rationale: Partisip dari נצר berarti orang yang menjaga atau mengawasi; dalam gambaran pertanian ini kemungkinan besar ia penjaga ladang atau kebun.
