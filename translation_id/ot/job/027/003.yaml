  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי כָל ע֣וֹד נִשְׁמָתִ֣/י בִ֑/י וְ/ר֖וּחַ אֱל֣וֹהַּ בְּ/אַפִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: id
  text: Sebab, selama napasku masih ada di dalam diriku, dan napas Allah ada di dalam lubang hidungku[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Roh Allah ada di dalam lubang hidungku.” Kata Ibrani רוּחַ dapat berarti “napas,” “angin,” atau “roh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Dalam konteks ini, partikel tersebut menghubungkan pernyataan khidmat Ayub dengan sumpah pada ayat-ayat sekitarnya. “Sebab” mempertahankan hubungan wacananya tanpa menjadikannya sekadar penegasan.
- source_word: כָל עוֹד
  choice: selama ... masih
  rationale: Gabungan ini menyatakan keberlangsungan waktu. Ungkapan Indonesia “selama ... masih” alami dan mempertahankan unsur duratif kedua katanya.
- source_word: נִשְׁמָתִי
  choice: napasku
  rationale: Kata ini menunjuk pada napas atau napas kehidupan. “Napasku” sesuai dengan gambaran jasmani dalam ayat dan paralelnya.
- source_word: בִי
  choice: di dalam diriku
  rationale: Preposisi ini menyatakan keberadaan internal; bentuk ini mempertahankan gambaran Ibrani dengan jelas.
- source_word: וְרוּחַ
  choice: dan napas
  rationale: רוּחַ dapat berarti napas, angin, atau roh. Paralelisme dengan נִשְׁמָתִי dan penyebutan lubang hidung mendukung arti konkret “napas,” sementara kemungkinan “Roh” dipertahankan dalam catatan kaki.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Ini adalah sebutan ilahi tunggal yang sering dipakai dalam kitab Ayub; “Allah” merupakan padanan baku dan tepat dalam bahasa Indonesia.
- source_word: בְּאַפִּי
  choice: di dalam lubang hidungku
  rationale: אַף di sini mempunyai arti jasmani, yaitu hidung atau lubang hidung. Bentuk tunggal kolektif “lubang hidungku” mempertahankan kekonkretan gambaran sumber.
theological_decisions:
- issue: Makna רוּחַ אֱלוֹהַּ dalam paralel dengan נִשְׁמָתִי
  choice: napas Allah
  alternative: Roh Allah
  rationale: Konteks langsung menekankan kehidupan yang terus berlangsung dan pernapasan, sehingga “napas Allah” paling cocok dengan paralelisme dan frasa “di dalam lubang hidungku.” Namun, karena רוּחַ juga dapat berarti “Roh,” kemungkinan teologis tersebut tidak ditutup dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan puitis. Susunan paralel dipertahankan, sedangkan “selama ... masih” dipilih agar hubungan waktu terdengar alami. Tanda koma akhir mencerminkan bahwa kalimat berlanjut ke ayat berikutnya.
