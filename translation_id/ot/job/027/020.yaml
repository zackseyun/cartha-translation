  text: Kengerian menyusulnya seperti air;[a] pada malam hari badai membawanya pergi seperti pencuri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seperti air”; dapat juga diterjemahkan “seperti banjir” atau “seperti air bah”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pada malam hari badai merenggutnya”; סוּפָה juga dapat berarti “angin topan” atau “puting beliung”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: menyusulnya
  rationale: Bentuk Hifil dari נשׂג menggambarkan kengerian yang mengejar lalu mencapai orang itu. “Menyusulnya” alami dalam bahasa Indonesia dan mempertahankan gambaran malapetaka yang mengejar.
- source_word: כַמַּיִם
  choice: seperti air bah
  rationale: Secara harfiah berarti “seperti air/air-air”; dalam konteks puisi, “air bah” menyampaikan daya air yang melanda tanpa mengubahnya menjadi istilah teknis.
- source_word: בַּלָּהוֹת
  choice: kengerian
  rationale: Kata ini menunjuk pada berbagai hal yang menggentarkan atau menakutkan. “Kengerian” ringkas, wajar, dan sesuai dengan suasana penghakiman.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Nomina ini dipakai secara adverbial. Pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: גְּנָבַתּוּ
  choice: mencurinya pergi
  rationale: Berasal dari גנב, “mencuri”. Ungkapan ini mempertahankan personifikasi badai yang membawa orang itu pergi seperti pencuri; catatan kaki memberi padanan Indonesia yang lebih idiomatis.
- source_word: סוּפָה
  choice: badai
  rationale: Kata ini berarti badai hebat atau topan. “Badai” adalah pilihan umum yang tidak mempersempit maknanya secara berlebihan.
