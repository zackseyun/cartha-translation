  yaml_path: translation/ot/job/027/006.yaml
  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: id
  text: Aku berpegang teguh pada kebenaranku[a] dan tidak akan melepaskannya; hatiku tidak mencela aku sepanjang hari-hariku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “integritasku.” Kata Ibrani ini biasanya berarti “kebenaran” atau “keadaan benar”, tetapi dalam kitab Ayub maknanya dapat bertumpang tindih dengan integritas pribadi.
    reason: lexical_alternative
  - marker: b
    text: Atau “hatiku tidak mencemooh atau menista aku sepanjang hari-hariku.” Ungkapan Ibrani ini menggambarkan celaan batin; frasa akhirnya menyatakan cakupan sepanjang hidup Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: pada kebenaranku
  rationale: צִדְקָה terutama menyatakan kebenaran atau keadaan benar dalam arti moral-yudisial. Dalam konteks pembelaan Ayub, kata ini juga berdekatan maknanya dengan integritas, tetapi “kebenaranku” mempertahankan daya leksikalnya tanpa mempersempit klaim Ayub menjadi sekadar ketulusan.
- source_word: הֶחֱזַקְתִּי
  choice: Aku berpegang teguh
  rationale: Bentuk Hifil dari חזק di sini menyatakan tindakan memegang dengan kuat. Bentuk kini dalam bahasa Indonesia menyampaikan sikap Ayub yang tetap berlangsung dalam konteks sumpahnya.
- source_word: וְלֹא אַרְפֶּהָ
  choice: dan tidak akan melepaskannya
  rationale: רפה dalam bentuk Hifil berarti membiarkan lepas, mengendurkan, atau melepaskan. Sufiks feminin tunggal merujuk kembali kepada צִדְקָתִי.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: hatiku tidak mencela aku
  rationale: חרף dapat berarti mencela, mencemooh, atau menista. Dengan “hatiku” sebagai subjek, ungkapan ini menunjuk pada celaan atau tuduhan batin; “hatiku” dipertahankan agar metafora Ibrani tidak diganti secara interpretatif dengan “hati nurani”.
- source_word: מִיָּמָי
  choice: atas satu pun dari hari-hariku
  rationale: Dalam cakupan penyangkalan, מן dengan יָמִים dapat menunjuk pada satu pun dari hari-hari kehidupan Ayub. Rumusan ini mempertahankan bentuk ungkapan Ibrani sekaligus menyatakan bahwa Ayub tidak merasa dicela batinnya mengenai hari mana pun dalam hidupnya.
theological_decisions:
- issue: Apakah צִדְקָה harus diterjemahkan dengan arti moral-yudisial yang kuat atau dengan arti kontekstual berupa integritas pribadi.
  choice: kebenaranku
  alternative: integritasku
  rationale: Nomina Ibrani ini lazimnya menyatakan kebenaran atau keadaan benar. “Integritasku” cocok dengan konteks kitab Ayub, tetapi dapat melunakkan klaim Ayub; pilihan utama mempertahankan ketegangan teologis dalam pernyataannya.
- issue: Apakah “hati” sebaiknya ditafsirkan langsung sebagai hati nurani.
  choice: hatiku tidak mencela aku
  alternative: hati nuraniku tidak menuduh aku
  rationale: Teks menyebut לְבָבִי, “hatiku.” Mempertahankan citra ini menghindari penambahan konsep yang lebih khusus daripada yang dinyatakan teks, sambil tetap menyampaikan tuduhan batin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel serta metafora “hati” dipertahankan. “Atas satu pun dari hari-hariku” sengaja agak formal untuk menjaga hubungan dekat dengan ungkapan Ibrani dan cakupan penyangkalannya.
