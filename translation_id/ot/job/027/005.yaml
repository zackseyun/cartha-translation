base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: id
  text: Pantang bagiku menyatakan kalian benar![a] Sampai aku mati, aku tidak akan melepaskan integritasku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membenarkan kalian” atau “menyatakan kalian sebagai pihak yang benar.” Kata kerja Ibrani ini bersifat forensik, yaitu menyatakan seseorang berada di pihak yang benar.
    reason: lexical_alternative
  - marker: b
    text: Atau “keadaanku yang tak bercela.” Istilah Ibrani ini dapat menunjuk pada integritas moral atau keadaan tak bercela dalam pembelaan Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Pantang bagiku
  rationale: Ungkapan ini menyatakan penolakan yang sangat tegas. “Pantang bagiku” alami dalam bahasa Indonesia dan mempertahankan daya penolakannya tanpa menerjemahkan secara kaku gagasan dasar tentang sesuatu yang najis atau terlarang.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: menyatakan kalian benar
  rationale: 'Bentuk Hifil dari צדק di sini bersifat forensik: menyatakan pihak lain berada di pihak yang benar. Pilihan ini jelas dalam konteks perdebatan dan tidak memasukkan nuansa teologis tambahan yang mungkin melekat pada “membenarkan”.'
- source_word: עַד אֶגְוָע
  choice: Sampai aku mati
  rationale: גוע berarti mati atau mengembuskan napas terakhir. Terjemahan ini lugas, alami, dan tetap khidmat.
- source_word: לֹא אָסִיר ... מִמֶּנִּי
  choice: aku tidak akan melepaskan ...-ku
  rationale: Secara harfiah, bentuk Hifil dari סור dengan מִמֶּנִּי menggambarkan tindakan menyingkirkan sesuatu dari diri sendiri. “Melepaskan” mempertahankan metafora itu dalam ungkapan Indonesia yang alami; akhiran posesif “-ku” membuat hubungan dengan diri Ayub tetap jelas tanpa frasa “dari diriku” yang kaku.
- source_word: תֻּמָּתִי
  choice: integritasku
  rationale: תֻּמָּה dalam pembelaan Ayub menunjuk pada keutuhan moral atau keadaan tak bercela. “Integritas” mempertahankan keluasan maknanya tanpa mempersempitnya menjadi sekadar ketidakbersalahan atau memperkuatnya menjadi klaim tanpa dosa.
theological_decisions:
- issue: Sifat pernyataan Ayub tentang keadaan moralnya
  choice: integritasku
  alternative: keadaan tak bercelaku; ketidakbersalahanku
  rationale: Ayub menolak menerima tuduhan kawan-kawannya dan tetap berpegang pada keutuhan moralnya. “Integritas” mempertahankan ketegangan dalam teks tanpa menjadikannya klaim tentang kesempurnaan tanpa dosa.
- issue: Arti forensik אַצְדִּיק dalam perdebatan
  choice: menyatakan kalian benar
  alternative: membenarkan kalian; menyatakan kalian sebagai pihak yang benar
  rationale: Pilihan ini menyampaikan bahwa Ayub menolak memberi putusan yang memenangkan kawan-kawannya, tanpa mengimpor pengertian doktrinal lain dari istilah “pembenaran”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan khidmat. “Kalian” mempertahankan bentuk jamak yang ditujukan kepada kawan-kawan Ayub. Tanda seru mencerminkan kuatnya ungkapan penolakan pembuka. Penanda catatan [b] ditempatkan pada “integritasku,” yaitu kata yang benar-benar dijelaskan oleh catatan tersebut.
