  text: אִם יִצְבֹּ֣ר כֶּ/עָפָ֣ר כָּ֑סֶף וְ֝/כַ/חֹ֗מֶר יָכִ֥ין מַלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: id
  text: Sekalipun ia menimbun perak seperti debu dan menyiapkan pakaian seperti tanah liat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika ia menimbun perak seperti debu dan menyiapkan pakaian seperti tanah liat.” Kata Ibrani yang diterjemahkan “sekalipun” juga dapat berarti “jika”.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Sekalipun
  rationale: 'Partikel ini dapat bersifat kondisional atau konsesif. Dalam alur argumen puisi ini, makna konsesif paling sesuai: sekalipun orang fasik menimbun kekayaan, ayat berikutnya menegaskan bahwa kekayaan itu tidak akan tetap menjadi miliknya.'
- source_word: יִצְבֹּר
  choice: menimbun
  rationale: Kata kerja צבר menggambarkan pengumpulan hingga bertumpuk; 'menimbun' mempertahankan gambaran konkret tersebut.
- source_word: כֶּעָפָר
  choice: seperti debu
  rationale: Awalan כ menyatakan perbandingan, sedangkan 'debu' mempertahankan gambaran hiperbolis tentang jumlah yang sangat banyak.
- source_word: כָּסֶף
  choice: perak
  rationale: כֶּסֶף secara harfiah berarti perak dan dapat pula menunjuk pada uang. 'Perak' menjaga citraan konkret serta kesejajaran puitis.
- source_word: וְכַחֹמֶר
  choice: dan ... seperti tanah liat
  rationale: חֹמֶר di sini paling wajar dipahami sebagai tanah liat, sesuatu yang biasa dan berlimpah; pilihan ini mempertahankan perbandingan puitis.
- source_word: יָכִין
  choice: menyiapkan
  rationale: Bentuk Hifil dari כון dalam konteks ini berarti membuat siap atau menyediakan; 'menyiapkan' alami dalam bahasa Indonesia.
- source_word: מַלְבּוּשׁ
  choice: pakaian
  rationale: Kata ini dapat merujuk secara kolektif pada pakaian; bentuk tunggal kolektif 'pakaian' alami dalam bahasa Indonesia dan tidak perlu diubah menjadi bentuk jamak.
theological_decisions:
- issue: Nilai partikel אִם
  choice: 'Diterjemahkan secara konsesif: ''Sekalipun''.'
  alternative: 'Dapat diterjemahkan secara kondisional: ''Jika''.'
  rationale: Kedua nilai dimungkinkan secara leksikal, tetapi konteks ayat 16–17 lebih mendukung konsesi tanpa meniadakan alternatif kondisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. 'Menimbun' menjaga citraan penumpukan, sedangkan 'pakaian' dipakai sebagai nomina kolektif yang alami. Tanda koma mempertahankan ayat ini sebagai klausa yang berlanjut ke ayat berikutnya.
