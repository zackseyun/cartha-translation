  edition: WLC
  text: שריד/ו בַּ/מָּ֣וֶת יִקָּבֵ֑רוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: id
  text: Orang-orang yang masih hidup sesudah dia akan dikuburkan oleh maut[a], dan para jandanya tidak akan menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan dikuburkan dalam maut.” Ungkapan Ibraninya padat dan dapat menyatakan maut sebagai sarana atau nasib penguburan, ataupun penguburan dalam keadaan maut.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: orang-orang yang masih hidup sesudah dia
  rationale: Kata שָׂרִיד menunjuk kepada orang yang tersisa atau bertahan hidup. Walaupun bentuknya tunggal dengan akhiran orang ketiga maskulin tunggal, verba jamak sesudahnya menunjukkan pemakaian kolektif; ungkapan ini menyampaikan makna tersebut secara alami.
- source_word: בַּמָּוֶת
  choice: oleh maut
  rationale: Preposisi ב dengan מָוֶת dapat menyatakan keadaan atau sarana yang menyerupai pelaku. 'Oleh maut' mempertahankan gambaran Ibrani yang tajam bahwa maut menjadi nasib atau sarana yang mengiringi penguburan, sambil tetap mencatat kemungkinan 'dalam maut' di catatan kaki.
- source_word: יִקָּבֵרוּ
  choice: akan dikuburkan
  rationale: Bentuk nifal imperfek dari קבר bermakna pasif, yaitu 'dikuburkan'; ini padanan Indonesia yang langsung dan wajar.
- source_word: וְאַלְמְנֹתָיו
  choice: dan para jandanya
  rationale: אַלְמָנָה berarti 'janda'. Bentuk jamak dengan akhiran orang ketiga maskulin tunggal secara paling langsung berarti 'para jandanya', yakni perempuan-perempuan yang menjadi janda akibat kematian yang dibicarakan.
- source_word: לֹא תִבְכֶּינָה
  choice: tidak akan menangis
  rationale: בכה adalah verba umum untuk menangis atau meratap. 'Menangis' lebih langsung daripada istilah yang lebih luas seperti 'berkabung'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan dipertahankan dekat dengan teks Ibrani, sedangkan bentuk kolektif שָׂרִידוֹ dibuat eksplisit sebagai jamak agar selaras dengan verba jamak. Istilah 'maut' dipilih untuk mempertahankan daya puitis dan personifikasi tersirat.
