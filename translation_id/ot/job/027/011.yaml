  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: id
  text: Aku akan mengajar kalian tentang tangan Allah[a]; apa yang ada pada Yang Mahakuasa[b] tidak akan kusembunyikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengenai tangan Allah.” Ungkapan ini dapat menunjuk pada kuasa, tindakan, atau cara Allah menangani sesuatu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “apa yang menjadi milik Yang Mahakuasa,” “nasihat Yang Mahakuasa,” atau “apa yang berasal dari Yang Mahakuasa.” Ungkapan Ibraninya ringkas dan agak eliptis.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: Aku akan mengajar
  rationale: Bentuk Hifil imperfek orang pertama tunggal dari ירה dipakai dalam arti memberi pengajaran. Bentuk deklaratif mendatang sesuai dengan pernyataan Ayub kepada para pendengarnya.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Pronomina objek orang kedua maskulin jamak. 'Kalian' menyatakan jumlah jamak dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּיַד אֵל
  choice: tentang tangan Allah
  rationale: Preposisi ב paling mungkin menyatakan pokok pengajaran. Metafora 'tangan Allah' dipertahankan karena dapat menunjuk pada kuasa, tindakan, atau cara Allah menangani sesuatu tanpa membatasi maknanya pada salah satu saja.
- source_word: אֵל
  choice: Allah
  rationale: אֵל berfungsi sebagai sebutan bagi Tuhan; 'Allah' adalah padanan baku, jelas, dan bermartabat dalam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: apa yang ada pada Yang Mahakuasa
  rationale: Ungkapan Ibrani ini ringkas dan eliptis. Terjemahan yang cukup harfiah mempertahankan keluasan maknanya tanpa menentukan apakah yang dimaksud ialah milik, maksud, nasihat, atau sesuatu yang berasal dari Yang Mahakuasa.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan tradisional dan jelas bagi gelar ilahi שַׁדַּי, khususnya dalam kitab Ayub.
- source_word: לֹא אֲכַחֵד
  choice: tidak akan kusembunyikan
  rationale: Bentuk Piel imperfek dari כחד berarti menyembunyikan atau merahasiakan. Bentuk ini alami dalam bahasa Indonesia dan cocok dengan konteks penyampaian pengetahuan.
theological_decisions:
- issue: Tindakan ilahi yang dinyatakan melalui ungkapan 'tangan Allah'
  choice: Metafora 'tangan Allah' dipertahankan.
  alternative: kuasa Allah; apa yang Allah lakukan
  rationale: Metafora Ibrani ini kaya makna dan lazim dalam Kitab Suci. Mempertahankannya menghindari pembatasan makna hanya pada kuasa, penghakiman, atau tindakan tertentu.
- issue: Hubungan klausa kedua dengan apa yang dimiliki atau diketahui Yang Mahakuasa
  choice: Diterjemahkan secara terbuka sebagai 'apa yang ada pada Yang Mahakuasa'.
  alternative: nasihat Yang Mahakuasa; apa yang menjadi milik Yang Mahakuasa; apa yang berasal dari Yang Mahakuasa
  rationale: Teks Ibrani bersifat eliptis dan tidak menyebut nomina seperti 'nasihat', 'maksud', atau 'penghakiman'. Terjemahan utama mempertahankan ketegangan dan keluasan itu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kalian' dipilih untuk menyatakan bentuk jamak secara eksplisit. Susunan klausa kedua sedikit padat agar keambiguan asli tetap terpelihara; bentuk terikat 'kusembunyikan' menjaga kelancaran dan nada puitis.
