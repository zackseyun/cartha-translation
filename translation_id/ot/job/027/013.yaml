  yaml_path: translation/ot/job/027/013.yaml
  text: 'This is the portion of a wicked man with God[c][b][a], and the inheritance that the ruthless receive from the Almighty:'
translation:
  language: id
  text: 'Inilah bagian orang fasik di sisi Allah[a], dan warisan yang diterima[c] orang-orang kejam[b] dari Yang Mahakuasa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, frasa “di sisi Allah” dapat dipahami secara idiomatis sebagai “dari Allah”, yaitu bagian yang Allah jatahkan kepada orang fasik.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang ganas” atau “orang-orang yang melakukan kekerasan”.'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, bahasa Ibrani memakai kata “mengambil”; di sini diterjemahkan “diterima” karena konteksnya adalah bagian atau warisan yang dijatahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Inilah
  rationale: Kata penunjuk ini membuka pernyataan dan memperkenalkan nasib yang akan diuraikan selanjutnya.
- source_word: חֵלֶק
  choice: bagian
  rationale: Menunjuk pada jatah atau nasib yang diperuntukkan bagi seseorang, serta tetap dibedakan dari 'warisan' pada klausa berikutnya.
- source_word: אָדָם רָשָׁע
  choice: orang fasik
  rationale: Ungkapan ini bersifat umum; 'orang' wajar dalam bahasa Indonesia, sedangkan 'fasik' mempertahankan penilaian moral khas sastra hikmat.
- source_word: עִם אֵל
  choice: yang ada pada Allah
  rationale: Ungkapan ini mempertahankan hubungan dasar preposisi 'dengan/pada' tanpa secara diam-diam memastikan bahwa maknanya harus 'dari Allah'; catatan kaki menjelaskan kemungkinan idiomatisnya.
- source_word: נַחֲלַת
  choice: warisan
  rationale: Padanan lazim bagi milik atau jatah yang diterima, dan berpasangan secara alami dengan 'bagian' tanpa menyamakan kedua istilah.
- source_word: עָרִיצִים
  choice: orang-orang kejam
  rationale: Istilah ini menggambarkan orang yang bengis dan menindas; 'kejam' jelas dan alami bagi pembaca Indonesia masa kini.
- source_word: מִשַּׁדַּי
  choice: dari Yang Mahakuasa
  rationale: שדי diperlakukan sebagai gelar ilahi dan diterjemahkan menurut maknanya; preposisi מִן diterjemahkan 'dari'.
- source_word: יִקָּחוּ
  choice: diterima
  rationale: Secara leksikal verba ini berarti 'mengambil', tetapi dalam konteks bagian dan warisan, bentuk 'diterima' secara alami menyatakan jatah yang menjadi milik mereka.
theological_decisions:
- issue: Gelar ilahi שדי
  choice: Yang Mahakuasa
  alternative: Syaddai
  rationale: Bentuk ini adalah gelar ilahi, sehingga diterjemahkan menurut maknanya dan bukan ditransliterasikan sebagai nama diri.
- issue: Hubungan bagian orang fasik dengan Allah dalam עִם אֵל
  choice: yang ada pada Allah
  alternative: dari Allah
  rationale: Teks memakai preposisi yang secara dasar berarti 'dengan/pada', tetapi dalam konteks ini dapat menyatakan bagian yang dijatahkan Allah. Terjemahan utama mempertahankan ketegangan tersebut, sedangkan pembacaan idiomatis dicatat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan klausa mempertahankan kesejajaran antara 'bagian' dan 'warisan'. Tanda titik dua dipertahankan karena ayat ini memperkenalkan uraian yang berlanjut pada ayat-ayat berikutnya.
