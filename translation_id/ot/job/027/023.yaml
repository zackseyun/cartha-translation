  text: He claps his hands at him and hisses at him from his place[a][b].
translation:
  language: id
  text: Ia bertepuk tangan terhadapnya dan mendesis kepadanya dari tempatnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersiul kepadanya.” Kata Ibrani ini dapat berarti bersiul atau mendesis; “mendesis” dipilih karena nada permusuhan dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani tidak menyebutkan subjeknya secara langsung: “ia bertepuk tangan ... dan mendesis.” Pelakunya ditafsirkan secara beragam sebagai Allah, orang lain, atau suatu kekuatan tak berpribadi.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂפֹּק ... כַּפֵּימוֹ
  choice: bertepuk tangan
  rationale: Gabungan verba שׂפק dengan כפים menggambarkan tindakan menepukkan tangan. Ungkapan Indonesia ini mempertahankan gerak konkretnya; kata 'mengejek' menjelaskan arah permusuhan yang tersirat dalam konteks dan konstruksi dengan עַל.
- source_word: עָלֵימוֹ
  choice: mengejek dia
  rationale: עַל dengan pronomina merujuk kepada sasaran tindakan. Dalam bahasa Indonesia, 'bertepuk tangan mengejek dia' lebih alami daripada terjemahan spasial yang kaku dan menyampaikan fungsi bermusuhan tindakan itu.
- source_word: כַּפֵּימוֹ
  choice: tangan
  rationale: כף secara harfiah dapat berarti 'telapak tangan', tetapi dalam ungkapan ini secara idiomatis berarti tangan; 'bertepuk tangan' adalah bentuk Indonesia yang wajar.
- source_word: וְיִשְׁרֹק
  choice: dan mendesis
  rationale: שרק dapat berarti bersiul atau mendesis. 'Mendesis' dipilih karena sesuai dengan nada permusuhan dalam konteks, sedangkan kemungkinan 'bersiul' dicatat dalam catatan kaki.
- source_word: עָלָיו
  choice: kepadanya
  rationale: עַל dengan sufiks menunjuk sasaran bunyi permusuhan. 'Kepadanya' alami dalam bahasa Indonesia dan tidak menambah identitas pelaku.
- source_word: מִמְּקֹמוֹ
  choice: dari tempatnya
  rationale: מקום berarti 'tempat'; terjemahan ini mempertahankan ungkapan umum bahasa Ibrani dan membiarkan rujukan sufiks tetap mengikuti pelaku yang tidak disebutkan.
theological_decisions:
- issue: Identitas subjek dalam ayat
  choice: Memakai subjek tunggal 'ia' tanpa menentukan identitasnya.
  alternative: Menentukan pelaku sebagai Allah, orang banyak, atau suatu kekuatan tak berpribadi seperti angin timur.
  rationale: Teks Ibrani memakai verba orang ketiga maskulin tunggal tanpa subjek eksplisit. Konteks memungkinkan beberapa penafsiran, sehingga terjemahan mempertahankan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'ia' mempertahankan subjek tunggal yang tersirat. Semua penanda catatan kaki dicantumkan dalam teks utama.
