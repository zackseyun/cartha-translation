  text: And Job again took up his discourse and said:[a]
translation:
  language: id
  text: 'Kemudian Ayub kembali menyampaikan ucapannya dan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: kembali
  rationale: Bentuk dari יסף berarti menambah atau melanjutkan. Dalam gabungan idiomatis dengan שׂאת מְשָׁל, “kembali” secara alami menunjukkan bahwa Ayub mulai lagi menyampaikan ucapan resminya.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Nama pribadi ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: שְׂאֵת
  choice: menyampaikan
  rationale: Infinitif dari נשׂא secara harfiah berarti mengangkat atau membawa, tetapi dalam kolokasi שׂאת משל bermakna mengangkat suara untuk mengucapkan atau menyampaikan suatu tuturan berbobot. “Menyampaikan” menghasilkan bahasa Indonesia yang alami.
- source_word: מְשָׁלוֹ
  choice: wejangan
  rationale: מָשָׁל mencakup pepatah, perumpamaan, sindiran, atau tuturan puitis berbobot. Dalam konteks ini yang menyusul adalah pidato puitis panjang; “wejangan” menunjukkan tuturan berbobot tanpa membatasinya menjadi pepatah singkat.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Bentuk naratif standar dari אמר diterjemahkan langsung dan mempertahankan pengantar resmi menuju ucapan Ayub.
