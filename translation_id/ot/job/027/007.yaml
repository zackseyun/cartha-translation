  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: id
  text: Kiranya musuhku seperti orang fasik, dan orang yang bangkit melawan aku seperti orang lalim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya musuhku seperti orang jahat, dan lawanku seperti orang tidak adil.”'
    reason: Alternatif leksikal bagi רָשָׁע, מִתְקוֹמְמִי, dan עַוָּל. Konstruksi Ibrani dapat diterjemahkan secara eliptis tanpa menyatakan kata “menjadi”.
lexical_decisions:
- source_word: יְהִי
  choice: Biarlah ... menjadi
  rationale: Bentuk yusif Qal dari היה menyatakan harapan atau kutukan; “Biarlah ... menjadi” mempertahankan daya volitifnya secara wajar dalam bahasa Indonesia.
- source_word: כְרָשָׁע
  choice: seperti orang fasik
  rationale: Prefiks כְּ menyatakan perbandingan, sedangkan רָשָׁע menunjuk kepada orang yang jahat secara moral. “Orang fasik” merupakan padanan ringkas, bermartabat, dan lazim dalam ragam Alkitab Indonesia.
- source_word: אֹיְבִי
  choice: musuhku
  rationale: Nomina אויב dengan sufiks orang pertama tunggal secara langsung berarti “musuhku”.
- source_word: וּמִתְקוֹמְמִי
  choice: dan orang yang bangkit melawan aku
  rationale: Bentuk partisipial dari קום menggambarkan seseorang yang menempatkan diri atau bangkit menentang penutur. Terjemahan ini mempertahankan citra verbal sumber, bukan memadatkannya menjadi sekadar “lawanku”.
- source_word: כְעַוָּל
  choice: seperti orang lalim
  rationale: עַוָּל menunjuk kepada orang yang dicirikan oleh kelaliman, ketidakadilan, atau perbuatan salah. “Orang lalim” menjaga kesejajaran moral dengan “orang fasik” tanpa membatasi maknanya pada ranah hukum.
theological_decisions:
- issue: Daya ujar יְהִי sebagai harapan atau kutukan
  choice: Biarlah musuhku menjadi seperti orang fasik
  alternative: Semoga musuhku seperti orang fasik
  rationale: “Biarlah” mempertahankan nada yusif yang tegas sekaligus tidak menentukan apakah ujaran ini terutama berupa harapan, kutukan, atau pernyataan pembenaran diri dalam konteks perdebatan Ayub.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Kesejajaran puitis Ibrani dipertahankan; frasa “orang yang bangkit melawan aku” sengaja mempertahankan citra tindakan dalam teks sumber.
