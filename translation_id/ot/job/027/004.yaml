translation:
  language: id
  text: Bibirku tidak akan mengucapkan ketidakadilan[a], dan lidahku tidak akan mengucapkan tipu daya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai bentuk seperti sumpah dengan kata “jika” (אִם) untuk menyatakan penyangkalan yang tegas. Secara harfiah: “jika bibirku mengucapkan ketidakadilan ...,” dengan maksud: “bibirku sungguh tidak akan mengucapkan ketidakadilan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: tidak akan
  rationale: 'Dalam rumusan sumpah eliptis ini, אִם bukan syarat biasa, melainkan penyangkalan tegas. Bahasa Indonesia alami menyatakannya dengan bentuk negatif yang berorientasi pada tekad: “tidak akan”.'
- source_word: תְּדַבֵּרְנָה
  choice: mengucapkan
  rationale: Bentuk piel dari דבר berarti berbicara atau mengucapkan. Imperfeknya sesuai dengan tekad yang diarahkan ke depan, sedangkan “mengucapkan” cocok dengan subjek “bibirku” dan objek abstrak.
- source_word: שְׂפָתַי
  choice: bibirku
  rationale: Citra anggota tubuh dipertahankan karena alami dalam bahasa Indonesia dan membentuk kesejajaran puitis dengan “lidahku”.
- source_word: עַוְלָה
  choice: ketidakadilan
  rationale: Kata ini menunjuk pada kesalahan atau ketidakbenaran bermuatan moral. “Ketidakadilan” mempertahankan daya etisnya dan tidak melebur dengan “tipu daya” pada baris kedua.
- source_word: וּלְשׁוֹנִי
  choice: dan lidahku tidak akan
  rationale: Waw menghubungkan baris sejajar, sementara daya negatif dari rumusan sumpah perlu dinyatakan lagi dalam bahasa Indonesia agar jelas dan alami.
- source_word: יֶהְגֶּה
  choice: menuturkan
  rationale: הגה dapat berarti menggumamkan, mengucapkan, atau merenungkan. Dengan “lidah” sebagai subjek dan “tipu daya” sebagai objek, “menuturkan” menyampaikan tindakan berbahasa dengan register yang bermartabat.
- source_word: רְמִיָּה
  choice: tipu daya
  rationale: Kata ini berarti kelicikan, penipuan, atau pengkhianatan. “Tipu daya” jelas, alami, dan tetap berbeda dari ketidakadilan pada bagian pertama.
