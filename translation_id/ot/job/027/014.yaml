source:
  edition: WLC
  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: id
  text: Jika anak-anak lelakinya bertambah banyak, pedang menanti mereka, dan keturunannya tidak akan kenyang dengan roti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak akan kenyang dengan roti”; ungkapan ini berarti bahwa mereka tidak akan mempunyai cukup makanan.
    reason: Menjelaskan idiom Ibrani dan cakupan makna “roti” sebagai makanan tanpa menghilangkan citra harfiahnya dari teks utama.
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk syarat yang paling langsung dalam bahasa Ibrani.
- source_word: יִרְבּוּ
  choice: bertambah banyak
  rationale: Mengungkapkan makna verba רבה, yaitu menjadi banyak atau meningkat jumlahnya, secara alami dalam bahasa Indonesia.
- source_word: בָנָיו
  choice: anak-anak lelakinya
  rationale: Nomina Ibrani berbentuk maskulin dan secara khusus berarti anak-anak lelaki; terjemahan tidak memperluasnya menjadi semua anak.
- source_word: לָמוֹ חָרֶב
  choice: pedang menanti mereka
  rationale: Frasa Ibrani yang padat secara harfiah menyatakan 'bagi mereka pedang'. Pilihan ini secara alami menyampaikan bahwa mereka ditakdirkan mengalami kematian oleh perang atau kekerasan tanpa mengganti citra pedang.
- source_word: וְצֶאֱצָאָיו
  choice: dan keturunannya
  rationale: צֶאֱצָאִים menunjuk pada keturunan atau anak cucu secara lebih luas daripada anak-anak lelaki yang disebut sebelumnya.
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: tidak akan kenyang dengan roti
  rationale: Mempertahankan makna dasar שבע, 'kenyang/puas', dan citra konkret לֶחֶם, 'roti', sambil tetap jelas sebagai gambaran kekurangan makanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan yang sangat padat dalam frasa Ibrani לָמוֹ חָרֶב dibuat alami sebagai “pedang menanti mereka”, dengan citra penghakiman melalui pedang tetap dipertahankan.
