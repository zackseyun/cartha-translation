  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: id
  text: Ia boleh saja menyiapkannya[a], tetapi orang benar akan mengenakannya,[b] dan orang yang tidak bersalah akan membagi perak itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menyiapkannya, tetapi orang benar akan mengenakannya.” Bentuk verba Ibrani dapat diterjemahkan secara sederhana tanpa nuansa “boleh saja”; konteks ayat sebelumnya mendukung pengertian konsesif di sini.
    reason: lexical_alternative
  - marker: b
    text: 'Objek yang tersirat berasal dari ayat sebelumnya: pakaian untuk “mengenakannya” dan kekayaan yang dikumpulkan untuk “perak itu”.'
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: Ia boleh saja menyiapkannya
  rationale: 'Bentuk Hifil dari כון berarti ''menyiapkan'' atau ''menyediakan''. Nuansa konsesif tidak dinyatakan oleh bentuk verba itu sendiri, tetapi didukung oleh pertentangan dalam konteks: sekalipun orang fasik menyiapkan harta tersebut, orang lain akan menikmatinya.'
- source_word: צַדִּיק
  choice: orang benar
  rationale: Adjektiva yang dipakai secara substantival dan menunjuk kepada pribadi yang hidup benar. 'Orang benar' alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal representatif.
- source_word: יִלְבָּשׁ
  choice: akan mengenakannya
  rationale: Bentuk Qal dari לבש berarti 'mengenakan' atau 'memakai'. Akhiran '-nya' memasok objek tersirat, yaitu pakaian dari ayat sebelumnya.
- source_word: כֶסֶף
  choice: perak itu
  rationale: כֶסֶף dapat berarti 'perak' atau 'uang'. Dalam konteks harta yang ditimbun pada ayat sebelumnya, 'perak itu' mempertahankan gambaran konkret sekaligus merujuk kepada kekayaan tertentu yang telah dikumpulkan.
- source_word: נָקִי
  choice: orang yang tidak bersalah
  rationale: Adjektiva substantival ini menyatakan orang yang bebas dari kesalahan atau pelanggaran. Pilihan ini jelas bagi pembaca modern dan mempertahankan pertentangan moral dengan orang fasik.
- source_word: יַחֲלֹק
  choice: akan membagi-bagikan
  rationale: Bentuk Qal dari חלק berarti 'membagi' atau 'membagikan menurut bagian'. 'Membagi-bagikan' secara alami menyampaikan tindakan membagi harta perak tersebut.
