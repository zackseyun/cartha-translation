  yaml_path: translation/ot/job/027/008.yaml
  text: For what is the hope of the godless when God cuts him off[c][b][a], when God takes away his life?
translation:
  language: id
  text: Sebab, apakah harapan orang fasik[a], sekalipun ia memperoleh keuntungan[b], ketika Allah mencabut nyawanya[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang munafik.” Kata Ibrani ini dapat menunjuk pada orang yang tidak menghormati Allah, orang fasik, atau orang munafik.
    reason: lexical_alternative
  - marker: b
    text: 'Klausa Ibrani ini sulit. Terjemahan lain: “apabila ia memperoleh keuntungan” atau, menurut pembacaan kontekstual, “ketika ia diputuskan/dihabisi.”'
    reason: alternative_reading
  - marker: c
    text: Secara lebih harfiah, “menarik keluar jiwanya/nyawanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: harapan
  rationale: Kata benda ini menunjuk pada apa yang diharapkan atau dinantikan; “harapan” paling alami dalam pertanyaan retoris ini.
- source_word: חָנֵף
  choice: orang fasik
  rationale: Dalam Kitab Ayub, istilah ini umumnya menunjuk pada orang yang tidak menghormati Allah atau hidup tanpa kesalehan, bukan hanya orang yang berpura-pura saleh.
- source_word: יִבְצָע
  choice: Allah menghabisinya
  rationale: Klausa Ibrani sangat ringkas dan sulit. Dalam kesejajaran dengan Allah yang mencabut nyawa, terjemahan ini menyampaikan kemungkinan makna bahwa Allah memutus atau mengakhiri hidup orang itu tanpa menutupi adanya tafsiran lain.
- source_word: יֵשֶׁל
  choice: mencabut
  rationale: Kata kerja ini menggambarkan tindakan menarik keluar atau mengambil; “mencabut” mempertahankan gambaran Ibrani dan tetap wajar dengan objek “nyawa”.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal puitis yang lazim bagi Allah dalam Kitab Ayub.
- source_word: נַפְשׁוֹ
  choice: nyawanya
  rationale: Di sini נֶפֶשׁ mengacu pada hidup seseorang yang diambil pada saat kematian, bukan secara khusus mengajarkan definisi metafisis tentang jiwa.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ
  choice: nyawanya
  alternative: jiwanya
  rationale: Ayat ini berbicara tentang Allah mengakhiri hidup seseorang. “Nyawa” mempertahankan maksud kontekstual tanpa memasukkan pernyataan doktrinal yang lebih sempit tentang hakikat jiwa.
- issue: Subjek dan makna יִבְצָע
  choice: Allah menghabisinya
  alternative: ketika ia memperoleh keuntungan / sekalipun ia telah memperoleh keuntungan
  rationale: Kesejajaran dengan klausa berikutnya mendukung Allah sebagai pelaku yang mengakhiri hidup orang fasik, tetapi bentuk Ibraninya dapat berkaitan dengan memperoleh keuntungan; ketegangan ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Orang fasik” dipilih sebagai istilah yang luas dan lazim; struktur pertanyaan retoris serta kesejajaran kedua klausa waktu dipertahankan.
