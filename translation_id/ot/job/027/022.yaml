  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: id
  text: Ia melemparkan ke arahnya[a] dan tidak menyayanginya; orang itu benar-benar melarikan diri[b] dari tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “melemparkan” secara lebih harfiah berarti “melemparkan” atau “mencampakkan.” Dengan kata depan “ke atas/terhadap dia,” ungkapan ini dapat menggambarkan serangan yang keras. Subjeknya tidak disebutkan secara tersurat; konteks dapat menunjuk kepada Allah atau kepada angin/badai pada ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melarikan diri ia melarikan diri,” suatu bentuk Ibrani yang menegaskan tindakan tersebut; dapat juga dipahami, “ia melarikan diri dengan tergesa-gesa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: Ia menghantam orang itu
  rationale: Secara harfiah verba ini berarti ‘melemparkan/menghempaskan’ dan עָלָיו berarti ‘ke atas/terhadap dia’. Dalam konteks serangan keras, ‘menghantam’ menyampaikan gerakan bermusuhan itu secara wajar tanpa menambahkan objek yang tidak disebutkan dalam bahasa Ibrani.
- source_word: וְלֹא יַחְמֹל
  choice: tanpa belas kasihan
  rationale: חמל mencakup arti ‘menaruh belas kasihan’ dan ‘tidak membinasakan/menyayangkan’. Ungkapan ini ringkas dan alami dalam konteks penghukuman.
- source_word: מִיָדוֹ
  choice: dari tangannya
  rationale: Terjemahan harfiah ‘tangan’ mempertahankan gambaran Ibrani, dengan makna tersirat kuasa atau cengkeraman.
- source_word: בָּרוֹחַ יִבְרָח
  choice: sungguh-sungguh melarikan diri
  rationale: Infinitif absolut yang disertai verba finit memberi penegasan pada tindakan melarikan diri. ‘Sungguh-sungguh’ mempertahankan tekanan itu tanpa menentukan bahwa tekanannya khusus pada kecepatan.
theological_decisions:
- issue: Identitas subjek yang menyerang dan pemilik ‘tangan’
  choice: Memakai ‘Ia’ tanpa kapital dan menjelaskan ambiguitas dalam catatan
  alternative: Menuliskan ‘Allah’ atau ‘angin itu’
  rationale: Ayat Ibrani hanya memakai bentuk orang ketiga tunggal; konteks dapat mengaitkannya dengan Allah atau dengan angin/badai pada ayat sebelumnya. Terjemahan tidak boleh menutup kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘orang itu’ menghindari kerancuan antara pelaku dan sasaran, sedangkan ‘Ia’ tanpa kapital mempertahankan ketidakpastian rujukan dalam teks Ibrani.
