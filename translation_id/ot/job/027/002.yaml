lexical_decisions:
- source_word: חַי אֵל
  choice: Demi Allah yang hidup
  rationale: Ungkapan חַי yang diikuti gelar ilahi merupakan formula sumpah. Bentuk “Demi Allah yang hidup” mempertahankan daya sumpahnya dalam bahasa Indonesia alami, bukan sekadar menyatakan bahwa Allah hidup.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini adalah gelar ilahi umum dalam formula sumpah dan wajar diterjemahkan sebagai “Allah” dalam bahasa Indonesia.
- source_word: הֵסִיר
  choice: telah menyingkirkan
  rationale: Bentuk Hifil dari סור berarti menyebabkan sesuatu pergi, menghapus, atau menyingkirkan. “Telah menyingkirkan” mempertahankan gambaran bahwa keadilan yang seharusnya tersedia bagi Ayub dijauhkan darinya.
- source_word: מִשְׁפָּטִי
  choice: keadilan yang menjadi hakku
  rationale: מִשְׁפָּט dapat berarti keadilan, keputusan hukum, atau tuntutan/hak yang sah. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan unsur keadilan dan hak pribadi dalam keluhan Ayub.
- source_word: וְשַׁדַּי
  choice: dan demi Yang Mahakuasa
  rationale: שַׁדַּי diterjemahkan sebagai gelar “Yang Mahakuasa.” Kata “demi” diulang agar kedua bagian formula sumpah terbaca jelas dan alami dalam bahasa Indonesia.
- source_word: הֵמַר
  choice: telah membuat ... getir
  rationale: Bentuk Hifil dari מרר berarti membuat pahit atau menggetirkan. “Membuat ... getir” mempertahankan metafora kepahitan sekaligus terdengar wajar dalam ragam puitis Indonesia.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נֶפֶשׁ dapat menunjuk jiwa, hidup, atau diri seseorang. “Jiwaku” mempertahankan corak puitis dan kedalaman batin ungkapan Ibrani tanpa menutup kemungkinan makna “hidupku” atau “diriku,” yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל dan שַׁדַּי
  choice: Allah ... Yang Mahakuasa
  alternative: Allah ... Shaddai
  rationale: Gelar ilahi diterjemahkan agar maknanya langsung dipahami pembaca Indonesia, sambil mempertahankan paralelisme khidmat dalam sumpah Ayub.
- issue: Keluhan Ayub bahwa Allah menyingkirkan מִשְׁפָּטִי
  choice: keadilan yang menjadi hakku
  alternative: hakku; tuntutan hukumku; keputusanku
  rationale: 'Terjemahan ini mempertahankan ketegangan teologis dalam ucapan Ayub: ia bersumpah demi Allah sambil menyatakan bahwa Allah telah menjauhkan keadilan yang menurutnya menjadi haknya. Keluhan tersebut tidak diperhalus atau diubah menjadi penilaian penerjemah.'
translation_notes:
  register: Ragam bahasa modern, khidmat, dan puitis. Formula sumpah dibuat alami dengan “Demi Allah yang hidup,” sementara pengulangan “demi” pada bagian kedua memperjelas bahwa kedua gelar ilahi berada dalam satu konstruksi sumpah. Koma akhir dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
