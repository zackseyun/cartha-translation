  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: id
  text: 'Orang kaya berbaring, tetapi tidak akan dikumpulkan;[a]

    ia membuka matanya, dan ia tidak ada lagi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini ringkas. Dapat berarti “tidak akan dikumpulkan kepada leluhurnya”, atau secara lebih umum “tidak akan dikumpulkan”; ungkapan ini dapat mengacu pada kematian dan penguburan tanpa menyatakannya secara langsung.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dan ia tidak ada”; ungkapan ini dapat berarti bahwa ia telah pergi atau tidak ada lagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: orang kaya itu
  rationale: Kata sifat ini dipakai sebagai nomina, yaitu ‘orang kaya’. Partikel ‘itu’ mempertahankan kesinambungan dengan tokoh orang fasik yang dibicarakan dalam konteks.
- source_word: יִשְׁכַּב
  choice: berbaring
  rationale: Makna dasar שׁכב adalah ‘berbaring’. Bentuk kini puitis dalam bahasa Indonesia mempertahankan daya penggambaran ayat tanpa menghilangkan nuansa kejadian yang akan dialami tokoh tersebut.
- source_word: וְלֹא יֵאָסֵף
  choice: tetapi tidak akan dikumpulkan
  rationale: Bentuk Nifal dari אסף secara harfiah berarti ‘dikumpulkan’ dan dapat secara tersirat menunjuk pada kematian, penguburan, atau dikumpulkan kepada kaum leluhur. Terjemahan ringkas ini mempertahankan ketidakjelasan teks Ibrani, sedangkan ‘tetapi’ menyatakan pertentangan yang tersirat dalam konteks.
- source_word: עֵינָיו פָּקַח
  choice: ia membuka matanya
  rationale: Susunan harfiahnya menempatkan ‘matanya’ lebih dahulu, tetapi susunan ini merupakan ungkapan alami dalam bahasa Indonesia dan tetap mempertahankan peralihan yang mendadak.
- source_word: וְאֵינֶנּוּ
  choice: dan ia sudah tiada
  rationale: Ungkapan ini secara harfiah berarti ‘dan ia tidak ada’. ‘Sudah tiada’ merupakan ungkapan Indonesia yang wajar untuk ketiadaan atau kematian, sekaligus mempertahankan kesan mendadak.
theological_decisions:
- issue: Makna ‘dikumpulkan’ dalam gambaran kematian orang kaya
  choice: Mempertahankan ungkapan ‘tidak akan dikumpulkan’ tanpa menyebut leluhur atau penguburan secara eksplisit.
  alternative: ‘Tidak akan dikumpulkan kepada leluhurnya’ atau ‘tidak akan dikuburkan’.
  rationale: Teks Masoret hanya memakai verba ‘dikumpulkan’ tanpa pelengkap. Menambahkan ‘kepada leluhurnya’ atau menjadikannya khusus tentang penguburan akan menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat, dengan bentuk puitis ringkas. Baris dibagi mengikuti dua klausa utama. Istilah ‘dikumpulkan’ sengaja dipertahankan meskipun tidak lazim agar ambiguitas asli mengenai kematian atau penguburan tidak hilang.
