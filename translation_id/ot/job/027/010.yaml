id: JOB.27.10
reference: Job 27:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם עַל שַׁדַּ֥י יִתְעַנָּ֑ג יִקְרָ֖א אֱל֣וֹהַּ בְּ/כָל עֵֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: id
  text: Apakah ia bersukacita dalam Yang Mahakuasa? Apakah ia berseru kepada Allah setiap waktu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Berseru kepada” dapat juga diterjemahkan “memohon kepada” atau “berdoa kepada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Apakah ...?
  rationale: Dalam konteks ini, partikel אִם mengawali pertanyaan retoris, bukan klausa bersyarat. Bentuk tanya langsung menyampaikan fungsi wacananya secara alami dalam bahasa Indonesia.
- source_word: עַל
  choice: dalam
  rationale: Bersama verba התענג dan objek pribadi, עַל menunjukkan pribadi yang menjadi sumber atau objek kesukaan; ungkapan 'bersukacita dalam' mempertahankan relasi tersebut.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi ini diterjemahkan agar maknanya langsung dipahami, bukan ditransliterasikan sebagai 'Shaddai'.
- source_word: יִתְעַנָּג
  choice: bersukacita
  rationale: Bentuk Hitpael dari ענג menyatakan menikmati atau memperoleh kesukaan. 'Bersukacita' terdengar alami dan bermartabat, meski nuansa refleksifnya tidak dinyatakan secara mekanis.
- source_word: יִקְרָא
  choice: berseru kepada
  rationale: Ketika Allah menjadi sasaran seruan, קרא dapat berarti memanggil, memohon, atau berdoa kepada-Nya. 'Berseru kepada' mempertahankan keluasan makna itu tanpa mempersempitnya menjadi doa formal.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Nomina ilahi tunggal ini diterjemahkan secara langsung sebagai 'Allah' tanpa penambahan makna yang tidak terdapat dalam teks.
- source_word: בְּכָל עֵת
  choice: setiap waktu
  rationale: Frasa ini menunjuk pada segala kesempatan atau keberlangsungan yang tetap. 'Setiap waktu' dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan gelar ilahi שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Shaddai
  rationale: Karena שַׁדַּי merupakan gelar ilahi, gelar ini diterjemahkan agar maknanya mudah dipahami pembaca Indonesia.
- issue: Makna seruan kepada Allah
  choice: berseru kepada Allah
  alternative: berdoa kepada Allah
  rationale: '''Berseru kepada'' menjaga cakupan קרא yang dapat mencakup permohonan atau doa tanpa membatasi tindakan itu pada pengertian doa formal.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Dua pertanyaan retoris dipertahankan sejajar. Gelar ilahi diterjemahkan, sedangkan ambiguitas cakupan קרא dijaga melalui pilihan utama dan catatan kaki.
