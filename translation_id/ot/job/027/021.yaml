  text: Angin timur mengangkutnya, lalu ia pergi; angin itu menghempaskannya dari tempatnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: mengangkatnya lalu membawanya pergi
  rationale: Bentuk dari נשׂא dapat berarti ‘mengangkat’ atau ‘membawa’. Gabungan ini mempertahankan citra dasar sekaligus menyatakan akibatnya secara alami dalam bahasa Indonesia.
- source_word: קָדִים
  choice: angin timur
  rationale: קָדִים dalam puisi Ibrani lazim menunjuk pada angin timur, yang kerap digambarkan sebagai angin merusak.
- source_word: וְיֵלַךְ
  choice: lalu membawanya pergi
  rationale: Secara harfiah berarti ‘dan ia pergi’. Dalam konteks ini, makna perginya orang tersebut diungkapkan sebagai hasil tindakan angin, tanpa mengubah pelaku gramatikal yang tersirat.
- source_word: וִישָׂעֲרֵהוּ
  choice: angin itu menghempaskannya
  rationale: Kata kerja סער menyiratkan tindakan badai yang keras, seperti mengguncang, memutar, atau menghempaskan. ‘Menghempaskan’ alami dalam bahasa Indonesia dan mempertahankan kekerasan citranya.
- source_word: מִמְּקֹמוֹ
  choice: dari tempatnya
  rationale: Terjemahan langsung dan wajar dari frasa yang berarti ‘dari tempatnya’.
