  yaml_path: translation/ot/job/029/015.yaml
  text: I was eyes to the blind[a], and feet to the lame.
translation:
  language: id
  text: Aku menjadi mata bagi orang buta[a], dan aku menjadi kaki bagi orang lumpuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih dinamis, “Aku seperti mata bagi orang buta dan seperti kaki bagi orang lumpuh.”
    reason: Alternatif ini menjelaskan bahwa ungkapan tersebut merupakan metafora tentang Ayub yang menyediakan pertolongan praktis.
lexical_decisions:
- source_word: עֵינַיִם
  choice: mata
  rationale: Mempertahankan gambaran konkret dalam metafora predikatif tentang pertolongan yang menggantikan fungsi penglihatan.
- source_word: הָיִיתִי
  choice: Aku menjadi
  rationale: Bentuk perfek dapat menunjuk pada keadaan atau peran Ayub pada masa lampau. Dalam bahasa Indonesia, “menjadi” paling alami untuk konstruksi metaforis “menjadi mata bagi” dan tidak harus menyiratkan perubahan keadaan.
- source_word: לַעִוֵּר
  choice: bagi orang buta
  rationale: Preposisi ל menyatakan hubungan atau manfaat; bentuk tunggal Ibrani dapat dipahami secara representatif. “Bagi orang buta” alami dan tidak membatasi maknanya pada satu individu tertentu.
- source_word: וְרַגְלַיִם
  choice: dan ... kaki
  rationale: Mempertahankan kesejajaran puitis dengan “mata” serta metafora tentang pemberian mobilitas dan bantuan praktis.
- source_word: לַפִּסֵּחַ
  choice: bagi orang lumpuh
  rationale: Menyatakan orang yang mengalami ketimpangan atau keterbatasan berjalan. “Orang lumpuh” merupakan ungkapan Indonesia yang jelas dan umum tanpa memakai sebutan yang merendahkan.
- source_word: אָֽנִי
  choice: aku menjadi
  rationale: Pronomina mandiri memberi penekanan pada subjek dalam bagian kedua. Pengulangan “aku menjadi” menyampaikan penekanan itu secara alami, sekaligus melengkapi kesejajaran klausa.
