  language: id
  text: Ayub kembali menyampaikan tuturannya dan berkata:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “amsalnya”, “perumpamaannya”, atau “tuturannya”. Kata Ibrani mashal memiliki cakupan makna yang luas; di sini kata itu memperkenalkan pidato puitis Ayub yang panjang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: melanjutkan
  rationale: Bentuk dari יסף secara harfiah berarti ‘menambah’, tetapi bersama infinitif berikutnya membentuk ungkapan yang menyatakan bahwa Ayub meneruskan atau kembali menyampaikan ucapannya.
- source_word: אִיּוֹב
  choice: Ayub
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: שְׂאֵת
  choice: melanjutkan
  rationale: Infinitif dari נשׂא berarti ‘mengangkat’ atau ‘membawa’; dalam ungkapan נשׂא משל artinya menyampaikan atau mengangkat suatu tuturan. Makna idiomatisnya dipadukan dengan וַיֹּסֶף agar kalimat Indonesia alami tanpa mengulang dua verba yang terasa kaku.
- source_word: מְשָׁלוֹ
  choice: perkataannya
  rationale: מָשָׁל memiliki cakupan makna luas, termasuk peribahasa, perumpamaan, tuturan puitis, dan wacana. Dalam konteks ini kata tersebut memperkenalkan pidato puitis Ayub yang panjang; ‘perkataannya’ alami dan cukup luas dalam bahasa Indonesia.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Terjemahan langsung bagi bentuk naratif yang memperkenalkan ucapan berikutnya.
