translation:
  language: id
  text: ketika pelita-Nya bersinar di atas kepalaku, dan dengan terang-Nya[a] aku berjalan dalam kegelapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan terang pelita itu aku berjalan dalam kegelapan.” Akhiran bahasa Ibrani pada “terang-Nya/terangnya” dapat dipahami merujuk kepada Allah dalam konteks ini atau, secara lebih langsung, kepada pelita.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: ketika pelita-Nya bersinar
  rationale: Gabungan ב dengan bentuk infinitif berfungsi secara temporal. נֵר dipertahankan sebagai gambaran konkret “pelita”, sedangkan akhiran orang ketiga tunggal dipahami merujuk kepada Allah dalam konteks.
- source_word: עֲלֵי רֹאשִׁי
  choice: di atas kepalaku
  rationale: Ungkapan ini menyatakan letak secara alami dalam bahasa Indonesia dan mempertahankan gambaran pelita yang bersinar dari atas.
- source_word: לְאוֹרוֹ
  choice: dalam terang-Nya
  rationale: ל menyatakan lingkungan atau sarana yang memungkinkan Ayub berjalan. Akhiran maskulin tunggal dapat merujuk kepada Allah atau, secara lebih dekat, kepada pelita; teks utama mengikuti rujukan kepada Allah, sementara ambiguitas dicatat dalam catatan kaki.
- source_word: אֵלֶךְ
  choice: aku berjalan
  rationale: Bentuk imperfek dalam kenangan Ayub menggambarkan tindakan pada masa lampau; bahasa Indonesia tidak perlu menandai kala secara morfologis.
- source_word: חֹשֶׁךְ
  choice: menembus kegelapan
  rationale: Pilihan ini menyampaikan gerak maju di tengah kegelapan dan menghasilkan ungkapan Indonesia yang alami tanpa menghilangkan metaforanya.
theological_decisions:
- issue: Rujukan akhiran orang ketiga maskulin tunggal pada “pelita-Nya” dan “terang-Nya”
  choice: Akhiran dipahami merujuk kepada Allah, sehingga ditulis dengan bentuk hormat “-Nya”.
  alternative: 'Pada frasa kedua, akhiran dapat merujuk secara lebih langsung kepada pelita: “dalam terang pelita itu”.'
  rationale: Konteks Ayub 29 mengenang pemeliharaan dan penyertaan Allah. Namun, kedekatan gramatikal kata “pelita” memungkinkan rujukan alternatif pada frasa kedua, sehingga kemungkinan itu tidak dihilangkan dan dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Kapitalisasi “-Nya” menandai rujukan kepada Allah. “Menembus kegelapan” dipilih untuk menyampaikan gerak dalam keadaan gelap secara alami.
