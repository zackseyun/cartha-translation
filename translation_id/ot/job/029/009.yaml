  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: id
  text: 'Para pembesar menahan kata-kata mereka,[a]

    dan menaruh tangan pada mulut mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para bangsawan menahan bicara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: para pembesar
  rationale: Istilah ini menunjuk kepada orang-orang berkedudukan tinggi atau penguasa. “Para pembesar” alami dalam bahasa Indonesia dan mempertahankan nuansa status sosial tanpa membatasi maknanya pada putra raja.
- source_word: עָצְרוּ בְמִלִּים
  choice: menahan kata-kata mereka
  rationale: Kata kerja עָצַר di sini berarti menahan atau tidak mengucapkan sesuatu. Ungkapan ini mempertahankan citra konkret “kata-kata” sekaligus menyampaikan bahwa mereka berhenti berbicara sebagai tanda hormat.
- source_word: וְכַף
  choice: tangan
  rationale: כַּף secara harfiah dapat berarti telapak tangan, tetapi dalam gerak menutup mulut bahasa Indonesia secara alami memakai “tangan”.
- source_word: יָשִׂימוּ
  choice: menaruh
  rationale: Kata kerja ini berarti menaruh, meletakkan, atau menempatkan. “Menaruh” sesuai dengan gerak tubuh yang digambarkan.
- source_word: לְפִיהֶם
  choice: pada mulut mereka
  rationale: Preposisi לְ dapat menyatakan arah atau posisi pada mulut. “Pada mulut mereka” dekat dengan bentuk Ibrani dan tetap alami sebagai gambaran sikap diam.
