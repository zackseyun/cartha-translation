  text: קוֹל נְגִידִ֥ים נֶחְבָּ֑אוּ וּ֝/לְשׁוֹנָ֗/ם לְ/חִכָּ֥/ם דָּבֵֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: id
  text: Suara para pemuka tidak terdengar lagi[a], dan lidah mereka melekat pada langit-langit mulut mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Suara para pemuka tersembunyi”; maksudnya, suara mereka tidak terdengar lagi atau mereka terdiam.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “lidah melekat pada langit-langit mulut” menggambarkan keadaan tidak mampu atau tidak mau berbicara.
    reason: idiom_explanation
lexical_decisions:
- source_word: קוֹל
  choice: suara
  rationale: Kata ini menunjuk pada suara manusia dan, dalam konteks ini, pada perkataan para pemuka yang tidak lagi terdengar.
- source_word: נְגִידִים
  choice: para pemuka
  rationale: Istilah Ibrani ini dapat berarti para pemimpin, penguasa, atau bangsawan. “Para pemuka” mempertahankan gagasan tentang orang-orang berkedudukan tinggi tanpa membatasinya pada jabatan kerajaan.
- source_word: נֶחְבָּאוּ
  choice: tidak terdengar lagi
  rationale: Makna dasarnya berkaitan dengan bersembunyi atau tersembunyi. Dengan “suara” sebagai pokok ungkapan, maksud puitisnya ialah suara itu lenyap dari pendengaran, yakni mereka berhenti berbicara.
- source_word: וּלְשׁוֹנָם
  choice: dan lidah mereka
  rationale: Bahasa Ibrani memakai bentuk tunggal distributif dengan akhiran jamak; bentuk Indonesia ini alami dan mempertahankan gambaran puitisnya.
- source_word: לְחִכָּם
  choice: pada langit-langit mulut mereka
  rationale: Nomina ini berarti langit-langit mulut atau palatum. Ungkapan lengkap ini jelas bagi pembaca Indonesia modern.
- source_word: דָּבֵקָה
  choice: melekat
  rationale: Kata kerjanya berarti melekat atau berpaut erat. “Melekat” mempertahankan gambaran konkret tentang ketidakmampuan atau keengganan untuk berbicara.
theological_decisions: []
