    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְחֹץ
  choice: ketika ... bermandikan
  rationale: Infinitif konstruk dengan prefiks ב dapat menyatakan keadaan temporal. ‘Bermandikan’ mempertahankan gambaran pembasuhan sekaligus terdengar alami dalam puisi Indonesia.
- source_word: הֲלִיכַי
  choice: langkah-langkahku
  rationale: Nomina ini dapat menunjuk pada tindakan berjalan atau perjalanan hidup. Bentuk konkret ‘langkah-langkahku’ sesuai dengan citraan kelimpahan dalam ayat ini.
- source_word: בְּחֵמָה
  choice: dadih
  rationale: חֵמָה menunjuk pada produk susu kental, seperti dadih, krim, atau mentega. ‘Dadih’ paling dekat dengan produk susu kuno tanpa membangkitkan gambaran mentega modern secara berlebihan.
- source_word: וְצוּר
  choice: dan batu cadas
  rationale: צוּר berarti batu besar, cadas, atau tebing batu. ‘Batu cadas’ mempertahankan gambaran sumber yang keras dan secara alami tidak menghasilkan minyak.
- source_word: יָצוּק
  choice: mencurahkan
  rationale: יצק berarti menuang atau mencurahkan. ‘Mencurahkan’ mempertahankan citraan pemberian yang limpah.
- source_word: עִמָּדִי
  choice: di sisiku
  rationale: Ungkapan ini secara harfiah bersifat spasial, ‘bersamaku’ atau ‘di sisiku’. Pilihan ini mempertahankan kedekatan yang dinyatakan teks tanpa mengubahnya secara pasti menjadi makna benefaktif.
- source_word: פַּלְגֵי
  choice: aliran-aliran
  rationale: פַּלְגֵי dapat berarti saluran atau aliran. Pengulangan jamak mempertahankan gambaran banyaknya aliran.
- source_word: שָׁמֶן
  choice: minyak
  rationale: שָׁמֶן berarti minyak, yang dalam konteks Israel kuno sering kali berupa minyak zaitun. ‘Minyak’ mempertahankan keluasan istilah sumber dan kepadatan puisinya.
