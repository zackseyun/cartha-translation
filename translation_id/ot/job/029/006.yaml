  text: ketika langkah-langkahku dibasuh dengan dadih[a], dan batu cadas di sisiku[b] mencurahkan aliran-aliran minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “krim” atau “mentega”; kata Ibrani חֵמָה dapat menunjuk pada dadih, krim, atau hasil olahan susu yang menyerupai mentega.
