translation:
  language: id
  text: Mereka menantikan aku seperti orang menantikan hujan, dan mereka menganga menantikan hujan akhir musim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hujan akhir” atau “hujan musim semi.” Kata Ibrani מַלְקוֹשׁ menunjuk pada hujan musiman yang turun belakangan dalam siklus pertanian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: mereka menantikan
  rationale: Kata kerja יחל menyatakan penantian yang disertai harapan. “Menantikan” alami dalam bahasa Indonesia dan sesuai dengan gambaran orang yang mengharapkan hujan.
- source_word: כַמָּטָר
  choice: seperti menantikan hujan
  rationale: כ menyatakan perbandingan. Pengulangan tersirat dari tindakan “menantikan” dijadikan eksplisit agar perbandingannya jelas dan alami dalam bahasa Indonesia.
- source_word: לִי
  choice: aku
  rationale: Pronomina Ibrani secara harfiah menunjuk kepada Ayub sendiri. Implikasi bahwa mereka menantikan perkataan atau nasihatnya dibiarkan berasal dari konteks, bukan ditambahkan ke dalam teks.
- source_word: וּפִיהֶם פָּעֲרוּ
  choice: dan mereka membuka mulut lebar-lebar
  rationale: פער berarti membuka lebar, khususnya mulut. Susunan ini mempertahankan gambaran konkret Ibrani dengan ungkapan Indonesia yang wajar.
- source_word: לְמַלְקוֹשׁ
  choice: bagi hujan akhir musim
  rationale: מַלְקוֹשׁ menunjuk pada hujan musiman yang turun menjelang akhir musim hujan dan sangat dinantikan bagi pertanian. “Hujan akhir musim” mempertahankan ciri waktu pertanian tanpa bergantung pada pembagian empat musim yang kurang akrab bagi banyak pembaca Indonesia.
