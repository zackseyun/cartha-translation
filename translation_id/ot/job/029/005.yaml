  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pelayanku ada di sekelilingku.” Kata Ibrani yang digunakan dapat berarti “para pemudaku”, “para pengiringku”, atau “para pelayanku”, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד
  choice: ketika ... masih
  rationale: Gabungan בְּ dengan עוֹד menyatakan keadaan yang terus berlangsung pada masa lampau. Ungkapan ini juga mengisyaratkan bahwa keadaan yang dikenang Ayub itu kini telah berakhir.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: שַׁדַּי adalah gelar ilahi yang lazim diterjemahkan sebagai “Yang Mahakuasa”; penerjemahan gelar ini menjaga kejelasan bagi pembaca Indonesia.
- source_word: עִמָּדִי
  choice: menyertai aku
  rationale: Kata ini secara dasar berarti “bersama aku”. Dalam konteks kenangan Ayub akan kemurahan dan kehadiran Allah, “menyertai aku” merupakan ungkapan Indonesia yang alami tanpa mengubah rujukan pada kehadiran ilahi.
- source_word: סְבִיבוֹתַי
  choice: di sekelilingku
  rationale: Bentuk ini menunjukkan posisi mengelilingi pembicara. “Di sekelilingku” alami dan mempertahankan gambaran spasial teks Ibrani.
- source_word: נְעָרָי
  choice: para pemudaku
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pengiring. “Para pemudaku” mempertahankan arti leksikal yang lebih terbuka dan tidak memastikan status mereka sebagai pelayan.
theological_decisions:
- issue: Makna kehadiran שַׁדַּי bersama Ayub
  choice: menyertai aku
  alternative: bersama aku
  rationale: “Menyertai” secara alami menyampaikan kehadiran yang menguntungkan dalam kenangan Ayub, tetapi tidak merinci bentuk perlindungan atau berkat tertentu yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan klausa dipertahankan dekat dengan teks Ibrani; koma akhir menunjukkan bahwa ayat ini merupakan bagian dari rangkaian kenangan Ayub.
