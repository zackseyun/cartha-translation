base_translation:
  language: en
  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: id
  text: Aku menjadi ayah bagi orang-orang miskin, dan perkara yang tidak kuketahui kuselidiki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan kuselidiki perkara orang yang tidak kukenal.”'
    reason: 'Alternatif sintaksis dan leksikal: “tidak kukenal” dapat dipahami merujuk kepada orang yang perkaranya diperiksa, bukan kepada perkara itu sendiri.'
lexical_decisions:
- source_word: אָב
  choice: ayah
  rationale: Mempertahankan metafora harfiah tentang perlindungan, pemeliharaan, dan pembelaan, tanpa menggantinya dengan tafsiran seperti “pelindung” atau “pembela”.
- source_word: אָנֹכִי
  choice: Aku menjadi
  rationale: Pronomina mandiri memberi penekanan pada Ayub; bentuk lampau “menjadi” mengikuti kerangka kenangan dalam pasal 29 dan melengkapi klausa nominal Ibrani secara alami.
- source_word: לָאֶבְיוֹנִים
  choice: bagi orang-orang miskin
  rationale: אֶבְיוֹן menunjuk kepada orang miskin atau berkekurangan. “Bagi” alami bersama metafora “menjadi ayah” dan menyatakan keberpihakan serta kepedulian.
- source_word: וְרִיב
  choice: dan ... perkara
  rationale: רִיב dapat berarti sengketa, gugatan, atau perkara hukum. “Perkara” cukup luas untuk mempertahankan nuansa yudisial tanpa membatasi maknanya secara berlebihan.
- source_word: לֹא יָדַעְתִּי
  choice: orang yang tidak kukenal
  rationale: 'Dalam pembacaan kontekstual ini, ידע dipahami sebagai mengenal seseorang secara pribadi: Ayub membela bahkan orang asing. Karena susunan Ibraninya juga dapat dipahami sebagai perkara yang belum diketahuinya, alternatif itu dicatat dalam catatan kaki.'
- source_word: אֶחְקְרֵהוּ
  choice: kuselidiki
  rationale: חקר menyatakan pemeriksaan atau penyelidikan yang saksama. Bentuk ringkas “kuselidiki” alami dalam bahasa Indonesia dan sufiks objeknya terwakili oleh “perkara”.
theological_decisions:
- issue: Objek dari ungkapan “tidak kukenal/tidak kuketahui”
  choice: 'Dipahami sebagai orang yang tidak dikenal Ayub: “perkara orang yang tidak kukenal.”'
  alternative: Dipahami sebagai perkara atau sengketa yang sebelumnya tidak diketahui Ayub.
  rationale: Teks Ibrani ringkas dan memungkinkan ketegangan sintaksis. Bacaan utama menyampaikan kepedulian Ayub kepada orang asing, sedangkan catatan kaki mempertahankan kemungkinan bahwa yang tidak diketahuinya adalah perkara itu sendiri.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Metafora “ayah” dipertahankan, sementara susunan klausa kedua dibuat alami tanpa menghilangkan ambiguitas sumber; alternatifnya dicatat pada penanda [a] yang ditempatkan langsung sesudah klausa terkait.
