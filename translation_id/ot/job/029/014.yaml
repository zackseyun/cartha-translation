  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: id
  text: Aku mengenakan kebenaran[a], dan kebenaran itu membalut aku; keadilanku seperti jubah dan serban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan.” Kata Ibrani צֶדֶק dapat berarti “kebenaran” atau “keadilan.”
    reason: lexical_alternative
  - marker: b
    text: “Serban” di sini ialah kain penutup kepala yang dililit, bagian dari gambaran tentang kehormatan dan martabat di hadapan umum.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: kebenaran
  rationale: Kata ini dapat berarti kebenaran moral atau keadilan. Dipilih “kebenaran” agar berbeda tetapi tetap berpasangan dengan מִשְׁפָּטִי, “keadilanku,” pada baris berikutnya.
- source_word: לָבַשְׁתִּי
  choice: Aku mengenakan
  rationale: Bentuk Qal ini secara alami menggambarkan tindakan mengenakan pakaian dan mempertahankan metafora aktif dalam bahasa Indonesia.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: dan kebenaran itu mengenakan aku
  rationale: 'Pengulangan akar לבש membalik pelaku dan sasaran: Ayub mengenakan kebenaran, lalu kebenaran mengenakan Ayub. Pengulangan eksplisit mempertahankan permainan puitis Ibrani, meski ungkapannya sengaja tidak biasa.'
- source_word: כִּמְעִיל
  choice: seperti jubah
  rationale: מְעִיל adalah pakaian luar atau jubah; “jubah” jelas dan sesuai dengan citra kehormatan.
- source_word: וְצָנִיף
  choice: dan serban
  rationale: צָנִיף menunjuk pada kain penutup kepala yang dililit. “Serban” merupakan padanan Indonesia yang ringkas dan langsung.
- source_word: מִשְׁפָּטִי
  choice: keadilanku
  rationale: Dalam konteks perilaku publik dan peradilan Ayub, kata ini mengungkapkan praktik atau pelaksanaan keadilan, bukan sekadar putusan tertentu.
