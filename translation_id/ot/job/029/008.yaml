  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: id
  text: 'Para pemuda melihat aku lalu menyingkir[a],

    dan orang-orang lanjut usia bangkit lalu berdiri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menyembunyikan diri"; kata kerja Ibrani ini dapat berarti menyembunyikan diri, tetapi di sini kemungkinan menggambarkan tindakan menyingkir dengan hormat dari hadapan Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: melihat aku
  rationale: Bentuk dari ראה secara langsung menyatakan persepsi visual. Susunan 'melihat aku' juga mempertahankan nada puitis dan fokus pada Ayub.
- source_word: נְעָרִים
  choice: orang-orang muda
  rationale: נְעָרִים menunjuk kepada kaum muda; dalam pasangan kontras dengan יְשִׁישִׁים, 'orang-orang muda' terdengar alami dan tidak menambahkan batas umur yang tidak dinyatakan.
- source_word: וְנֶחְבָּאוּ
  choice: lalu menyingkir
  rationale: Nifal חבא secara harfiah dapat berarti 'menyembunyikan diri', tetapi dalam konteks penghormatan sosial kemungkinan menggambarkan mereka menarik diri atau menghindar dari hadapan Ayub. 'Menyingkir' menyampaikan tindakan itu secara alami, sementara arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: וִישִׁישִׁים
  choice: orang-orang lanjut usia
  rationale: יְשִׁישִׁים menunjuk kepada orang yang sudah tua, bukan secara khusus pemegang jabatan penatua. Pilihan ini bermartabat dan menjaga kontras usia.
- source_word: קָמוּ
  choice: bangkit
  rationale: קום menyatakan tindakan awal bangun sebagai tanda hormat dan dipertahankan sebagai verba tersendiri.
- source_word: עָמָדוּ
  choice: tetap berdiri
  rationale: Setelah קָמוּ, עָמָדוּ menggambarkan bahwa mereka berdiri atau terus berdiri. 'Tetap berdiri' mempertahankan kedua tindakan tanpa meleburkannya.
