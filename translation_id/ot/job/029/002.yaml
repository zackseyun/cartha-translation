base_translation:
  language: en
  yaml_path: translation/ot/job/029/002.yaml
  text: Oh[a], that I were as in months gone by, as in the days when God watched over me[b],
translation:
  language: id
  text: Ah, seandainya aku seperti pada bulan-bulan yang telah lalu, seperti pada hari-hari ketika Allah menjaga aku[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melindungi aku” atau “memelihara aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Ah, seandainya aku kembali
  rationale: Ungkapan harfiah ‘Siapa yang akan memberikan aku...?’ merupakan idiom Ibrani yang menyatakan kerinduan kuat. Dalam bahasa Indonesia, ‘Ah, seandainya aku kembali’ menyampaikan harapan untuk mengalami lagi keadaan masa lampau secara wajar.
- source_word: כְיַרְחֵי קֶדֶם
  choice: seperti pada bulan-bulan yang telah lalu
  rationale: כְּ menyatakan perbandingan, יֶרַח berarti ‘bulan’, dan קֶדֶם di sini menunjuk waktu lampau. Pilihan ini mempertahankan gambaran waktu serta nada mengenang.
- source_word: כִּימֵי
  choice: seperti pada hari-hari
  rationale: Pilihan ini mempertahankan kesejajaran puitis dengan frasa sebelumnya dan memperkenalkan masa ketika Allah memelihara Ayub.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal puitis bagi Allah yang lazim dalam kitab Ayub; tidak diperluas menjadi ‘Yang Mahakuasa’ karena שַׁדַּי tidak terdapat dalam ayat ini.
- source_word: יִשְׁמְרֵנִי
  choice: menjaga aku
  rationale: Kata שׁמר dapat berarti menjaga, melindungi, atau mengawasi. ‘Menjaga aku’ alami dalam bahasa Indonesia dan tetap memuat pengertian perlindungan ilahi.
theological_decisions:
- issue: Tindakan Allah dalam kenangan Ayub
  choice: Allah menjaga aku
  alternative: Allah melindungi aku / mengawasi aku
  rationale: Terjemahan ini menyatakan pemeliharaan Allah pada masa lalu tanpa menentukan mekanisme teologis yang tidak disebutkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan penuh kerinduan. Kata ‘Ah’ menandai keluhan atau hasrat, sedangkan ‘kembali’ melengkapi idiom Ibrani secara alami tanpa mengubah arah maknanya.
