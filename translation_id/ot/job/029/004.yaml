lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: seperti ketika
  rationale: Mempertahankan daya perbandingan כַּ sekaligus menyatakan kenangan waktu lampau secara wajar dalam bahasa Indonesia.
- source_word: הָיִיתִי בִּימֵי
  choice: aku berada pada masa
  rationale: Mengungkapkan keadaan Job pada suatu masa lampau dengan bentuk Indonesia yang alami, tanpa mempertahankan idiom 'pada hari-hari' secara kaku.
- source_word: חָרְפִּי
  choice: jayaku
  rationale: Kata ini secara harfiah dapat menunjuk musim gugur atau masa panen, lalu secara kiasan masa kematangan dan keadaan yang sedang berkembang penuh. 'Masa jayaku' menyampaikan maksud kontekstual, sedangkan citra musim dipertahankan dalam catatan kaki.
- source_word: בְּסוֹד אֱלוֹהַּ
  choice: ketika persekutuan akrab dengan Allah
  rationale: סוֹד mencakup lingkaran atau persekutuan yang akrab serta percakapan atau nasihat rahasia. Pilihan ini menonjolkan kedekatan istimewa tanpa membatasinya pada pewahyuan teknis; kemungkinan 'nasihat rahasia' dicatat di catatan kaki.
- source_word: עֲלֵי
  choice: menaungi
  rationale: Mengungkapkan gambaran sesuatu yang berada di atas kemah dan meliputinya, sekaligus menghasilkan ungkapan Indonesia yang alami untuk kehadiran dan kemurahan ilahi.
- source_word: אָהֳלִי
  choice: kemahku
  rationale: Mempertahankan gambaran konkret Ibrani; dalam konteksnya kemah juga dapat mewakili tempat tinggal dan seisi rumah Job.
theological_decisions:
- issue: Makna hubungan Job dengan Allah dalam בְּסוֹד אֱלוֹהַּ
  choice: persekutuan akrab dengan Allah menaungi kemah Job
  alternative: nasihat rahasia Allah berada di atas kemah Job
  rationale: Pilihan utama menyampaikan kedekatan, kepercayaan, dan kemurahan ilahi tanpa menganggap frasa ini semata-mata persahabatan biasa atau pewahyuan khusus. Catatan kaki mempertahankan nuansa musyawarah atau rahasia yang juga terdapat dalam סוֹד.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Bentuk 'aku' sesuai dengan tuturan pribadi Job. Koma akhir dipertahankan karena ayat ini merupakan bagian dari kalimat dan kenangan yang berlanjut.
