  text: בִּרְכַּ֣ת אֹ֭בֵד עָלַ֣/י תָּבֹ֑א וְ/לֵ֖ב אַלְמָנָ֣ה אַרְנִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/013.yaml
  text: The blessing of the perishing man came upon me[b][a], and I made the widow’s heart sing for joy.
translation:
  language: id
  text: Berkat orang yang hampir binasa datang kepadaku[a], dan aku membuat hati seorang janda bersorak gembira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkat orang yang sedang binasa datang kepadaku.” Partisipel Ibrani אֹבֵד dapat menunjuk kepada orang yang sedang binasa, hancur, atau mendekati kematian.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku membuat hati seorang janda bersukacita” atau “bersorak-sorai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת
  choice: berkat
  rationale: Bentuk konstruk dari בְּרָכָה menyatakan hubungan dengan אֹבֵד; frasa Indonesia “berkat orang yang hampir binasa” mempertahankan hubungan tersebut secara alami.
- source_word: אֹבֵד
  choice: orang yang hampir binasa
  rationale: Partisipel Qal dari אבד dapat menunjuk kepada orang yang sedang menuju kebinasaan, kehancuran, atau kematian. “Hampir binasa” menjaga cakupan maknanya tanpa membatasinya hanya pada kematian.
- source_word: עָלַי תָּבֹא
  choice: datang kepadaku
  rationale: Gabungan preposisi עַל dan verba gerak תבוא menyatakan bahwa berkat itu sampai atau tertuju kepada Ayub. “Datang kepadaku” alami dalam bahasa Indonesia dan tetap mempertahankan citra geraknya.
- source_word: לֵב אַלְמָנָה
  choice: hati seorang janda
  rationale: Terjemahan langsung dan wajar dari hubungan konstruk, dengan לֵב sebagai pusat kehidupan batin dan emosi.
- source_word: אַרְנִן
  choice: aku membuat ... bersorak gembira
  rationale: 'Bentuk Hifil orang pertama tunggal dari רנן bersifat kausatif: Ayub menyebabkan hati janda itu bersukacita atau bersorak. Pilihan ini menjaga daya emosional dan unsur kausatifnya.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Hampir binasa” mempertahankan ketidakpastian mengenai apakah orang tersebut menghadapi kematian, kehancuran, atau kemelaratan; “bersorak gembira” menyampaikan bentuk kausatif dan nuansa puitis רנן.
