  source_fidelity: 'Teks Indonesia menerjemahkan dengan setia konstruksi בִּרְכַּת אֹבֵד sebagai “berkat orang yang hampir binasa,” tanpa mempersempit jenis kebinasaan yang dimaksud. “Datang kepadaku” merupakan padanan idiomatis yang memadai bagi עָלַי תָּבֹא dalam konteks puitis retrospektif. Klausa kedua dengan tepat mempertahankan bentuk kausatif Hifil אַרְנִן: Ayub menyebabkan hati janda itu bersorak/bersukacita.'
