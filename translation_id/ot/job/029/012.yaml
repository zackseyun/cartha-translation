  yaml_path: translation/ot/job/029/012.yaml
  text: For I delivered the poor who cried for help[a], and the fatherless who had no helper.
translation:
  language: id
  text: Sebab aku menyelamatkan orang miskin yang berseru minta tolong, dan anak yatim[a] yang tidak mempunyai penolong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: orang yang tidak berayah; istilah ini menunjuk seseorang yang rentan secara sosial karena kehilangan ayah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi penghormatan yang digambarkan dalam konteks sebelumnya; bentuk ini wajar sebagai penghubung penjelas dalam bahasa Indonesia.
- source_word: אֲמַלֵּט
  choice: aku menyelamatkan
  rationale: Bentuk piel dari מלט menyatakan tindakan aktif melepaskan atau menyelamatkan seseorang dari kesusahan.
- source_word: עָנִי
  choice: orang miskin
  rationale: Kata ini dapat berarti orang miskin atau tertindas; konteks kepedulian sosial mendukung terjemahan yang konkret dan mudah dipahami ini.
- source_word: מְשַׁוֵּעַ
  choice: yang berseru minta tolong
  rationale: Partisip ini menggambarkan orang tersebut sedang berseru memohon pertolongan; klausa relatif menghasilkan bahasa Indonesia yang alami.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Dalam pemakaian Ibrani, kata ini secara khusus menunjuk anak yang kehilangan ayah dan karena itu rentan secara sosial; 'anak yatim' adalah padanan Indonesia yang lazim.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: yang tidak mempunyai penolong
  rationale: Klausa ini menerangkan anak yatim dan mempertahankan penekanan bahwa tidak ada seorang pun yang menolongnya.
