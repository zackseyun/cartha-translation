lexical_decisions:
- source_word: בְּצֵאתִי
  choice: Ketika aku keluar
  rationale: Preposisi ב dengan infinitif konstruk יצא dan sufiks orang pertama tunggal berfungsi temporal. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan latar waktu kehormatan Ayub dahulu.
- source_word: שַׁעַר עֲלֵי קָרֶת
  choice: menuju gerbang kota
  rationale: Gabungan ini mengaitkan gerbang dengan kota dan menggambarkan Ayub pergi ke pusat kehidupan umum. 'Gerbang kota' alami dalam bahasa Indonesia, sedangkan 'menuju' mempertahankan unsur arah yang mungkin terkandung dalam עֲלֵי tanpa memaksakan arti bahwa Ayub memasuki kota.
- source_word: בָּרְחוֹב
  choice: di lapangan
  rationale: רְחוֹב menunjuk pada tempat umum yang luas atau plaza, bukan hanya jalan sempit. 'Lapangan' menyampaikan ruang publik terbuka dengan bahasa Indonesia yang wajar.
- source_word: אָכִין
  choice: aku menyiapkan
  rationale: Bentuk Hifil dari כון dapat berarti menyiapkan, mendirikan, atau menetapkan. Dalam konteks ini, 'menyiapkan' cukup dekat dengan bentuk sumber dan tidak berlebihan menyiratkan kedudukan permanen.
- source_word: מוֹשָׁבִי
  choice: tempat dudukku
  rationale: מוֹשָׁב di lingkungan gerbang dan lapangan berarti tempat untuk duduk dalam pertemuan umum, bukan tempat tinggal. 'Tempat dudukku' lebih alami daripada 'kursiku' dan tidak menentukan jenis bendanya.
