translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Struktur temporal paralel dipertahankan. Pilihan 'tempat dudukku' menghindari penafsiran berlebihan tentang jabatan resmi Ayub, sementara 'lapangan' menampilkan latar publik kuno secara alami.
