  text: I smiled at them—they did not believe it[c][b][a]; and they did not cast down the light of my face.
translation:
  language: id
  text: Aku tersenyum kepada mereka—mereka tidak percaya—dan mereka tidak meredupkan cahaya wajahku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku tertawa kepada mereka, dan mereka tidak percaya.” Ungkapan Ibrani mungkin menunjukkan keheranan mereka karena Ayub berkenan memperhatikan mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bagian terakhir berbunyi, “mereka tidak membuat cahaya wajahku jatuh.” “Cahaya wajah” menggambarkan ekspresi yang cerah atau penuh perkenanan.
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂחַק
  choice: Aku tersenyum
  rationale: Kata kerja שׂחק dapat berarti tertawa atau tersenyum. Dalam konteks perhatian baik Ayub kepada orang-orang lain dan ungkapan tentang cahaya wajahnya, “tersenyum” menyampaikan nuansa sosialnya tanpa menyiratkan ejekan.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Preposisi אֶל menunjukkan arah tindakan. Dalam bahasa Indonesia, “tersenyum kepada mereka” merupakan ungkapan yang alami dan tetap mempertahankan orientasi antarpersonal teks sumber.
- source_word: לֹא יַאֲמִינוּ
  choice: mereka tidak percaya
  rationale: Terjemahan ini mempertahankan pernyataan Ibrani secara langsung dan tidak menutup kemungkinan apakah yang dimaksud ialah ketidakpercayaan harfiah atau rasa heran karena Ayub berkenan tersenyum kepada mereka.
- source_word: וְאוֹר פָּנַי
  choice: cahaya wajahku
  rationale: Ungkapan ini mempertahankan citra Ibrani tentang wajah yang cerah, berseri, atau menunjukkan perkenanan, tanpa menggantinya sepenuhnya dengan penafsiran.
- source_word: לֹא יַפִּילוּן
  choice: mereka tidak meredupkan
  rationale: Bentuk kausatif dari נפל secara harfiah berarti membuat jatuh. Dengan “cahaya wajahku” sebagai objek, “meredupkan” menghasilkan metafora yang wajar dalam bahasa Indonesia dan menyampaikan bahwa mereka tidak membuat ekspresi cerah Ayub memudar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang tetap mudah dipahami. Citra “cahaya wajahku” dipertahankan, sedangkan verba pasangannya dibuat alami melalui “meredupkan”. Struktur dua klausa dan ketegangan makna pada “tidak percaya” tetap dijaga.
