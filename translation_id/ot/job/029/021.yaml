  yaml_path: translation/ot/job/029/021.yaml
  text: They listened to me and waited[b][a], and they kept silent for my counsel.
translation:
  language: id
  text: Mereka mendengarkan aku dan menanti dengan penuh harap;[a] mereka diam menantikan nasihatku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menanti.” Kata Ibrani ini juga dapat mengandung arti berharap atau menanti dengan penuh harap.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka diam bagi/atas nasihatku.” Ungkapan ini dapat berarti bahwa mereka diam sebagai tanggapan terhadap nasihat Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי שָׁמְעוּ
  choice: mendengarkan aku
  rationale: Konstruksi ini menunjukkan bahwa Ayub menjadi orang yang didengarkan; dalam konteks penerimaan perkataan dan nasihat, bentuk aktif 'mendengarkan' lebih tepat daripada sekadar 'mendengar'.
- source_word: וְיִחֵלּוּ
  choice: menanti dengan penuh harap
  rationale: Verba יחל menyatakan penantian yang mengandung harapan atau pengharapan. Ungkapan ini mempertahankan nuansa tersebut tanpa menentukan secara berlebihan apa yang mereka nantikan.
- source_word: וְיִדְּמוּ
  choice: berdiam diri
  rationale: Verba דמם di sini menunjuk pada keadaan diam atau tenang ketika menantikan nasihat Ayub.
- source_word: לְמוֹ עֲצָתִי
  choice: untuk mendengar nasihatku
  rationale: Preposisi puitis לְמוֹ menghubungkan sikap diam mereka dengan nasihat Ayub. Tambahan implisit 'mendengar' menghasilkan bahasa Indonesia yang alami, sementara catatan kaki mempertahankan kemungkinan hubungan yang lebih harfiah.
- source_word: עֲצָתִי
  choice: nasihatku
  rationale: '''Nasihat'' merupakan padanan modern dan bermartabat bagi עֵצָה dalam konteks kebijaksanaan serta mudah dipahami pembaca umum.'
