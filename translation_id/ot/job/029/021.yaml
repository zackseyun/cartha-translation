translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa mempertahankan kesejajaran tindakan mendengarkan, menanti, dan berdiam diri; tanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
