  yaml_path: translation/ot/job/029/018.yaml
  text: Then I said[a], ‘I will die in my nest, and I will multiply my days like the sand.’
translation:
  language: id
  text: Lalu aku berkata, “Aku akan mati di sarangku, dan hari-hariku akan menjadi banyak seperti pasir.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dan hari-hariku akan menjadi banyak seperti burung feniks.” Kata Ibrani yang diterjemahkan “pasir” dipahami oleh sebagian penafsir sebagai nama burung di sini. Namun, “pasir” lebih mungkin dalam konteks ini dan sesuai dengan gambaran umum dalam Alkitab tentang jumlah yang sangat banyak.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Waw berurutan melanjutkan kenangan Ayub; “lalu” menyampaikan urutan naratif secara alami.
- source_word: עִם קִנִּי
  choice: di dalam sarangku
  rationale: Preposisi עִם secara harfiah biasanya berarti “dengan”, tetapi bersama “sarangku” konteks menuntut makna lokasi. Citra sarang dipertahankan sebagai gambaran keamanan rumah tangga.
- source_word: אֶגְוָע
  choice: aku akan mati
  rationale: Kata kerja ini menyatakan mati atau mengembuskan napas terakhir; “mati” paling jelas dan alami.
- source_word: וְכַחוֹל
  choice: seperti pasir
  rationale: חוֹל paling lazim berarti “pasir” dan cocok dengan gambaran alkitabiah tentang jumlah yang sangat banyak. Kemungkinan nama burung dipertahankan dalam catatan kaki.
- source_word: אַרְבֶּה יָמִים
  choice: memperbanyak hari-hariku
  rationale: Bentuk kausatif רבה berarti membuat banyak atau menambah. Ungkapan ini mempertahankan daya verbal teks dan merujuk pada panjang umur Ayub.
