  text: I broke the fangs of the unrighteous, and from his teeth I threw the prey.
translation:
  language: id
  text: Aku mematahkan taring orang lalim, dan dari giginya Aku melemparkan mangsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַלְּעוֹת
  choice: taring
  rationale: Kata ini menunjuk pada rahang atau gigi pemangsa; “taring” mempertahankan gambaran hewan buas dan terdengar alami dalam bahasa Indonesia.
- source_word: עַוָּל
  choice: orang lalim
  rationale: Istilah ini menunjuk kepada pelaku kejahatan atau ketidakadilan; “orang lalim” merupakan ungkapan bermartabat yang sesuai dengan konteks tindakan menindas.
- source_word: אַשְׁלִיךְ
  choice: melemparkan
  rationale: Secara leksikal berarti melemparkan atau membuang. Pilihan ini mempertahankan tindakan yang dinyatakan teks tanpa mengubahnya menjadi “merebut” atau “menyelamatkan”.
- source_word: טָרֶף
  choice: mangsa
  rationale: Kata ini berarti mangsa atau hasil terkaman dan melanjutkan metafora pemangsa yang dibangun oleh “taring” dan “gigi”.
theological_decisions:
- issue: Gambaran tindakan Ayub terhadap orang lalim
  choice: Mempertahankan metafora pemangsa secara konkret
  alternative: Menjelaskannya sebagai pembebasan korban dari penindas
  rationale: Teks menggambarkan orang lalim sebagai pemangsa dan korbannya sebagai mangsa. Terjemahan tidak menambahkan penafsiran moral di luar gambaran yang dinyatakan.
- issue: Makna verba אַשְׁלִיךְ
  choice: melemparkan
  alternative: merebut atau menarik keluar
  rationale: Pilihan ini mengikuti makna dasar verba dan mempertahankan ketegangan ungkapan sumber, meskipun bahasa Indonesia yang lebih interpretatif dapat memakai “merebut”.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Paralelisme dua klausa serta citra keras tentang pemangsa dipertahankan.
