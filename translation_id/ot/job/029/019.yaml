source:
  edition: WLC
  text: שָׁרְשִׁ֣/י פָת֣וּחַ אֱלֵי מָ֑יִם וְ֝/טַ֗ל יָלִ֥ין בִּ/קְצִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/019.yaml
  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: id
  text: Akarku terbentang menuju air, dan embun bermalam pada dahan-dahanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada panenanku.” Kata Ibrani di sini tidak lazim dalam konteks ini; “dahan-dahanku” dipilih karena lebih sesuai dengan gambaran akar dan embun.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: Akarku
  rationale: Bentuk Ibrani secara morfologis tunggal dengan akhiran orang pertama, tetapi dalam bahasa Indonesia “akarku” secara alami dapat menunjuk pada keseluruhan sistem akar.
- source_word: פָתוּחַ
  choice: terbentang
  rationale: Partisip pasif ini menggambarkan akar dalam keadaan terbuka atau terulur. “Terbentang” menyampaikan keadaan itu secara alami dalam citra tumbuhan.
- source_word: אֱלֵי מָיִם
  choice: menuju air
  rationale: אֱלֵי menyatakan arah atau hubungan menuju, sedangkan מָיִם, walaupun berbentuk jamak, lazim dipakai secara kolektif. “Menuju air” merupakan ungkapan Indonesia yang alami tanpa menghilangkan arah geraknya.
- source_word: וְטַל
  choice: dan embun
  rationale: Padanan langsung dan alami bagi טַל.
- source_word: יָלִין
  choice: bermalam
  rationale: Kata kerja לון berarti tinggal atau melewatkan malam. “Bermalam” mempertahankan nuansa waktu dan personifikasi puitisnya dengan ringkas.
- source_word: בִּקְצִירִי
  choice: pada dahan-dahanku
  rationale: קָצִיר biasanya berarti “panen,” tetapi arti itu janggal dalam konteks embun dan paralelisme dengan akar. Arti yang berkaitan dengan dahan atau pertumbuhan tanaman dipilih karena paling sesuai dengan citra tumbuhan; bentuk jamak Indonesia menggambarkan tajuk pohon secara alami.
theological_decisions: []
