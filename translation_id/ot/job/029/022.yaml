  text: After my words they did not speak again[b][a], and my word dripped upon them.
translation:
  language: id
  text: Sesudah kata-kataku, mereka tidak berbicara lagi[a], dan perkataanku menetes pada mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka tidak menjawab lagi”; kata Ibrani ini dapat menunjuk pada tidak mengulangi perkataan atau tidak menanggapi setelah Ayub berbicara.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perkataanku menetes pada mereka,” sebuah gambaran puitis tentang perkataan yang turun kepada para pendengar seperti tetesan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: Sesudah aku berbicara
  rationale: Ungkapan harfiahnya, 'sesudah perkataanku', menyatakan waktu setelah Ayub selesai menyampaikan perkataannya. Bentuk verbal ini lebih alami dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: לֹא יִשְׁנוּ
  choice: mereka tidak berkata-kata lagi
  rationale: Dalam konteks tanggapan terhadap perkataan Ayub, verba ini menunjukkan bahwa para pendengar tidak melanjutkan atau mengulangi perkataan mereka; terjemahan ini mempertahankan kemungkinan makna 'tidak menjawab lagi' dalam catatan kaki.
- source_word: וְעָלֵימוֹ
  choice: ke atas mereka
  rationale: Preposisi עַל dengan sufiks orang ketiga jamak dipertahankan sebagai arah jatuhnya tetesan dalam gambaran puitis.
- source_word: תִּטֹּף
  choice: menetes
  rationale: Verba נטף secara konkret menggambarkan sesuatu yang menetes. Bentuk kini naratif-puitis bahasa Indonesia menjaga aspek gambaran sumber tanpa menjelaskannya secara berlebihan.
- source_word: מִלָּתִי
  choice: perkataanku
  rationale: Nomina puitis tunggal ini berarti kata atau ucapan. 'Perkataanku' terdengar wajar dan bermartabat serta tetap dekat dengan bentuk tunggal Ibrani.
