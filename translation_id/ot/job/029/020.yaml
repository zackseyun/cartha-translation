  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: id
  text: Kemuliaanku tetap segar menyertaiku[a], dan busurku[b] terus diperbarui di tanganku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Kemuliaanku selalu baru bersamaku.” Kata sifat Ibrani yang digunakan berarti “baru”, tetapi dalam konteks ini kemungkinan menunjuk pada sesuatu yang terus segar atau tidak memudar.
    reason: lexical_alternative
  - marker: b
    text: “Busur” kemungkinan merupakan gambaran kekuatan atau daya hidup, tetapi teks Ibrani mempertahankan benda konkret ini.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: kemuliaanku
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau wibawa. “Kemuliaanku” mempertahankan keluasan citra Ibrani tanpa membatasinya hanya pada reputasi sosial.
- source_word: חָדָשׁ
  choice: tetap segar
  rationale: Secara harfiah berarti “baru”, tetapi sebagai predikat dalam konteks ini menunjuk pada keadaan yang terus segar atau tidak memudar. “Tetap segar” menyampaikan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: עִמָּדִי
  choice: menyertaiku
  rationale: Ungkapan ini secara harfiah berarti “bersamaku”. “Menyertaiku” menyatakan bahwa kemuliaan itu tetap ada pada Ayub, sekaligus menghasilkan kalimat Indonesia yang wajar.
- source_word: קַשְׁתִּי
  choice: busurku
  rationale: Nomina ini secara konkret berarti “busurku”. Citra tersebut dipertahankan karena dalam puisi hikmat busur dapat menyiratkan kekuatan atau daya hidup tanpa kehilangan makna harfiahnya.
- source_word: בְּיָדִי
  choice: di tanganku
  rationale: Terjemahan lokatif langsung yang mempertahankan gambaran busur yang siap digunakan.
- source_word: תַחֲלִיף
  choice: terus diperbarui
  rationale: Bentuk Hifil dari חלף di sini menyampaikan pembaruan atau penyegaran. “Terus diperbarui” sesuai dengan aspek berulang atau berkelanjutan dalam kenangan Ayub dan sejajar dengan “tetap segar” pada baris pertama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang ringkas dan bermartabat. Paralelisme kedua baris dipertahankan melalui “tetap segar” dan “terus diperbarui”; citra konkret “busur” tidak ditafsirkan langsung di dalam teks utama.
