id: JOB.29.25
reference: Job 29:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶֽבֲחַ֣ר דַּרְכָּ/ם֮ וְ/אֵשֵׁ֪ב רֹ֥אשׁ וְ֭/אֶשְׁכּוֹן כְּ/מֶ֣לֶךְ בַּ/גְּד֑וּד כַּ/אֲשֶׁ֖ר אֲבֵלִ֣ים יְנַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: id
  text: Aku memilih jalan mereka dan duduk sebagai pemimpin[a]; aku berdiam seperti seorang raja di tengah pasukan[b], seperti orang yang menghibur mereka yang berkabung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku menentukan jalan mereka dan duduk di tempat terdepan.” Ungkapan Ibrani ini dapat berarti bahwa Ayub memilih atau menyetujui jalan yang harus ditempuh orang lain, lalu menduduki tempat kepemimpinan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seperti seorang raja di tengah kelompoknya.” Kata Ibrani גְּדוּד dapat berarti pasukan, gerombolan, atau kelompok.
    reason: lexical_alternative
  - marker: c
    text: Perbandingan terakhir dalam bahasa Ibrani sukar ditafsirkan. Terjemahan ini memahaminya sebagai “seperti orang yang menghibur mereka yang berkabung,” yang menonjolkan peran Ayub sebagai penghibur sekalipun ia menduduki tempat terhormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: Aku memilih jalan mereka
  rationale: Terjemahan ini mempertahankan bentuk langsung ungkapan Ibrani. Dalam konteksnya, ungkapan tersebut mungkin berarti bahwa Ayub menentukan atau menyetujui jalan yang harus mereka tempuh; kemungkinan itu dijelaskan dalam catatan kaki agar ambiguitasnya tidak dihapus.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: dan duduk sebagai pemimpin
  rationale: Secara harfiah רֹאשׁ berarti ‘kepala’, tetapi dalam ungkapan ini menunjuk pada kedudukan utama atau kepemimpinan. ‘Duduk sebagai pemimpin’ mempertahankan gambaran konkret sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וְאֶשְׁכּוֹן
  choice: aku berdiam
  rationale: Kata שׁכן berarti tinggal atau berdiam. ‘Berdiam’ sesuai dengan ragam puisi yang bermartabat dan tidak mempersempit maknanya menjadi tindakan sesaat.
- source_word: כְּמֶלֶךְ בַּגְּדוּד
  choice: seperti seorang raja di tengah pasukan
  rationale: Awalan כְּ menyatakan perbandingan. גְּדוּד dapat berarti pasukan, gerombolan, atau kelompok; ‘pasukan’ paling sesuai dengan gambaran seorang raja di tengah kelompok yang dipimpinnya.
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: seperti orang yang menghibur mereka yang berkabung
  rationale: Susunan Ibraninya padat dan subjek verba tunggalnya tidak disebutkan secara eksplisit. Terjemahan ini menyampaikan perbandingan yang paling wajar sambil mempertahankan peran Ayub sebagai penghibur; kesulitan susunannya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. ‘Berdiam’ menjaga keluhuran ragam, sedangkan ‘pemimpin’ menghindari terjemahan harfiah ‘kepala’ yang tidak alami. Tanda baca mempertahankan dua gambaran sejajar tentang kedudukan dan peran Ayub.
