  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: id
  text: Sebab, telinga yang mendengar menyebut aku berbahagia, dan mata yang melihat memberi kesaksian tentang aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memberi kesaksian bagiku.” Kata Ibrani ini dapat berarti memberi kesaksian tentang atau bagi seseorang; dalam konteks ini kesaksiannya mendukung Ayub.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan uraian sebelumnya sebagai penjelasan tentang kehormatan yang dahulu diterima Ayub.
- source_word: אֹזֶן שָׁמְעָה
  choice: setiap telinga yang mendengar
  rationale: Mempertahankan gambaran anggota tubuh dalam bentuk tunggal generik, tetapi memakai 'setiap' agar fungsi generiknya alami dan jelas dalam bahasa Indonesia.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: menyebut aku berbahagia
  rationale: Kata kerja אשר menyatakan penilaian bahwa seseorang berbahagia atau patut disebut berbahagia; pilihan ini menghindari kemungkinan bahwa 'memberkati aku' berarti telinga itu memberikan berkat.
- source_word: וְעַיִן רָאֲתָה
  choice: dan setiap mata yang melihat
  rationale: Menjaga kesejajaran antara telinga yang mendengar dan mata yang melihat serta menyampaikan pemakaian tunggal generik secara alami.
- source_word: וַתְּעִידֵנִי
  choice: memberi kesaksian yang baik tentang aku
  rationale: Kata kerja עיד berarti bersaksi atau memberi kesaksian. Konteks menunjukkan bahwa kesaksian tersebut menguntungkan Ayub; 'tentang aku' mempertahankan Ayub sebagai pokok kesaksian.
