  text: פֶּן תֹּ֣֭אמְרוּ מָצָ֣אנוּ חָכְמָ֑ה אֵ֖ל יִדְּפֶ֣/נּוּ לֹא אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/013.yaml
  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: id
  text: Jangan sampai kalian berkata[a], “Kami telah menemukan hikmat; Allah yang akan menghalaunya, bukan manusia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah yang akan menjawabnya, bukan manusia,” atau, “Allah yang dapat menaklukkannya, bukan manusia.” Kata kerja Ibrani ini biasanya berarti “menghalau” atau “mengusir”, tetapi dalam konteks ini dapat merujuk secara lebih luas pada tindakan mengalahkan atau membantah Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Menandai peringatan terhadap kemungkinan pernyataan berikutnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: תֹּאמְרוּ
  choice: kalian berkata
  rationale: Bentuk orang kedua jamak dipertahankan secara eksplisit dengan 'kalian'.
- source_word: מָצָאנוּ חָכְמָה
  choice: Kami telah menemukan hikmat
  rationale: Mempertahankan verba perfektif sebagai hasil yang diklaim telah tercapai serta padanan baku untuk 'hikmat'.
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks ini menunjuk kepada Allah dan membentuk kontras dengan manusia.
- source_word: יִדְּפֶנּוּ
  choice: akan menghalaunya
  rationale: Mempertahankan gambaran leksikal dasar נדף, yaitu menghalau atau mengusir, sambil membiarkan catatan kaki menjelaskan kemungkinan makna kontekstual yang lebih luas.
- source_word: לֹא אִישׁ
  choice: bukan manusia
  rationale: Mengungkapkan kontras generik antara Allah dan seorang manusia tanpa memberi kesan bahwa yang dimaksud khusus laki-laki.
theological_decisions:
- issue: Makna אֵל יִדְּפֶנּוּ לֹא אִישׁ
  choice: Allah yang akan menghalaunya, bukan manusia
  alternative: Allah yang akan menjawabnya, bukan manusia; Allah yang dapat menaklukkannya, bukan manusia
  rationale: Teks utama mempertahankan citra konkret verba 'menghalau', sedangkan catatan kaki menjaga kemungkinan bahwa dalam konteks ini verba tersebut berarti mengalahkan atau membantah Ayub.
- issue: אִישׁ sebagai nomina tunggal generik dalam kontras dengan Allah
  choice: manusia
  alternative: seorang manusia; orang
  rationale: Yang ditekankan ialah agen insani sebagai lawan Allah, bukan jenis kelamin agen tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' memperjelas sapaan jamak; susunan 'Allah yang ...' menampilkan kontras fokus dengan 'bukan manusia' secara alami.
