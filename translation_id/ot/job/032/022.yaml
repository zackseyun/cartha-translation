  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: id
  text: Sebab aku tidak tahu menyanjung orang[a]; jika aku melakukannya, Penciptaku akan segera membawa aku pergi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberi gelar-gelar yang menyanjung.” Verba Ibrani ini dapat menunjuk pada pemberian gelar kehormatan untuk mengambil hati atau memihak seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Penciptaku akan segera mengambilku.” Bahasa Ibrani tidak secara eksplisit mengatakan “membunuh aku”, meskipun tindakan menyingkirkan dalam penghukuman mungkin tersirat.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi penolakan Elihu untuk memihak atau mengambil hati orang dalam konteks sebelumnya.
- source_word: לֹא יָדַעְתִּי
  choice: aku tidak tahu
  rationale: Bersama bentuk verbal sesudahnya, ungkapan ini menyatakan bahwa Elihu tidak tahu atau tidak mampu melakukan hal tersebut; bentuk kini paling alami dalam konteks.
- source_word: אֲכַנֶּה
  choice: menyanjung
  rationale: Dalam konteks sikap memihak dan mengambil hati orang, verba Piel yang langka ini menunjuk pada penyapaan atau pemberian gelar secara menjilat. 'Menyanjung' menyampaikan fungsi negatifnya dengan ringkas, sedangkan kemungkinan makna yang lebih harfiah dicatat dalam catatan kaki.
- source_word: כִּמְעַט
  choice: segera
  rationale: Dalam ancaman ini, ungkapan tersebut menyatakan akibat yang akan datang dalam waktu singkat.
- source_word: יִשָּׂאֵנִי
  choice: membawa aku pergi
  rationale: Verba נשׂא dapat berarti mengangkat, membawa, atau mengambil pergi. Pilihan ini mempertahankan gambaran pemindahan dalam penghukuman tanpa secara eksplisit menyatakan kematian.
- source_word: עֹשֵׂנִי
  choice: Pembuatku
  rationale: Bentuk partisipial ini berarti 'Dia yang membuat aku'. 'Pembuatku' ringkas serta mempertahankan hubungan pribadi antara ciptaan dan Sang Pembuat.
theological_decisions:
- issue: Sifat tindakan ilahi yang diancamkan
  choice: Pembuatku akan segera membawa aku pergi
  alternative: Pembuatku akan segera membunuh atau melenyapkan aku
  rationale: Bahasa Ibrani menyatakan tindakan membawa atau mengambil pergi, bukan secara eksplisit membunuh. Terjemahan mempertahankan daya ancam penghukuman sekaligus tidak menentukan bahwa tindakan itu pasti berarti kematian.
- issue: Hubungan logis antara kedua klausa
  choice: jika aku melakukannya
  alternative: tanpa penghubung syarat yang eksplisit
  rationale: Teks Ibrani menyandingkan ketidaktahuan untuk menyanjung dengan akibat yang segera datang dari Sang Pembuat. Klausa syarat eliptis dipertegas secara idiomatis dalam bahasa Indonesia tanpa mengubah hubungan sebab-akibat yang tersirat.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Pembuatku' sengaja dipertahankan alih-alih 'Penciptaku' agar bentuk partisipial dan hubungan pribadi dalam bahasa Ibrani tetap terasa. Ungkapan 'membawa aku pergi' menjaga ambiguitas mengenai apakah penghukuman itu berarti kematian.
