  register: Bahasa Indonesia baku modern dengan nada pidato yang bermartabat. Pronomina ‘aku’ dipakai karena Elihu berbicara langsung dan bentuk ini alami dalam konteks puitis. Penanda catatan kaki [a] dicantumkan tepat setelah unsur yang memiliki alternatif terjemahan.
