  text: Therefore I say[a], ‘Listen to me; I too will declare my knowledge.’
translation:
  language: id
  text: Karena itu aku berkata[a], “Dengarkanlah aku; aku juga akan menyatakan pengetahuanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena itu aku telah berkata, ‘Dengarkanlah aku; aku juga akan menyatakan pengetahuanku.’” Bentuk perfektif Ibrani dapat dipahami sebagai lampau biasa, tetapi dalam konteks ini mungkin berdaya performatif pada saat kini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Penanda wacana ini menarik kesimpulan dari uraian sebelumnya; ‘Karena itu’ mempertahankan hubungan logis tersebut dalam bahasa Indonesia modern.
- source_word: אָמַרְתִּי
  choice: aku berkata
  rationale: Bentuk perfektif secara harfiah dapat berarti ‘aku telah berkata’, tetapi dalam konteks pidato ini dapat berdaya performatif pada saat kini. ‘Aku berkata’ mempertahankan bentuk Ibrani sekaligus tetap wajar sebagai pengantar pernyataan langsung.
- source_word: שִׁמְעָה
  choice: Dengarkanlah
  rationale: Imperatif tunggal yang meminta perhatian sungguh-sungguh. ‘Dengarkanlah’ alami, jelas, dan mempertahankan nada perintah.
- source_word: לִּי
  choice: aku
  rationale: Preposisi menandai pihak yang harus didengarkan; dalam idiom Indonesia, ‘dengarkanlah aku’ tidak memerlukan kata depan.
- source_word: אֲחַוֶּה
  choice: akan menyatakan
  rationale: Kata kerja ini bermakna memberitahukan atau mengemukakan sesuatu. ‘Akan menyatakan’ sesuai dengan nada retoris formal tanpa mempersempit maknanya menjadi ‘menjelaskan’.
- source_word: דֵּעִי
  choice: pengetahuanku
  rationale: Terjemahan langsung yang mempertahankan klaim epistemis Elihu. ‘Pendapatku’ akan melemahkan klaim itu, sedangkan ‘pengertianku’ merupakan kemungkinan lain.
- source_word: אַף אֲנִי
  choice: aku juga
  rationale: Ungkapan ini menambahkan Elihu secara emfatis kepada orang-orang yang berbicara. ‘Aku juga’ alami dalam bahasa Indonesia dan mempertahankan makna aditif.
theological_decisions: []
