    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: menyusun
  rationale: Makna dasarnya ialah menata atau menyusun; bersama 'kata-kata' dalam konteks perdebatan, kata ini menggambarkan penyusunan suatu sanggahan. Terjemahan ini mempertahankan metafora Ibrani tanpa menutup nuansa argumentatifnya.
- source_word: אֵלַי
  choice: untuk menentang aku
  rationale: Secara harfiah berarti 'kepada/ke arah aku', tetapi konteks perdebatan mendukung arah yang bersifat konfrontatif. Ungkapan ini tetap memperlihatkan unsur arah sekaligus nada sanggahan.
- source_word: מִלִּין
  choice: kata-kata
  rationale: Padanan langsung bagi bentuk jamak Aramais yang menunjuk kepada tuturan; nuansa argumen muncul dari gabungannya dengan verba 'menyusun'.
- source_word: אִמְרֵיכֶם
  choice: perkataan-perkataan kalian
  rationale: Dipilih untuk membedakannya dari מִלִּין, sambil tetap menyampaikan arti ucapan atau tuturan. Preposisi בְּ diterjemahkan secara instrumental dengan 'dengan'.
- source_word: אֲשִׁיבֶנּוּ
  choice: aku tidak akan menjawab dia
  rationale: Bentuk Hifil שוב dalam konteks ini berarti menjawab atau membalas, sedangkan sufiks maskulin tunggal menunjuk kepada Ayub.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Ia' merujuk kepada Ayub sesuai konteks. 'Kalian' menyatakan orang kedua jamak yang ditandai dalam teks Ibrani. Pengulangan 'perkataan-perkataan' dipertahankan agar jelas bersifat jamak dan untuk membedakan leksem kedua dari 'kata-kata' pada klausa pertama.
