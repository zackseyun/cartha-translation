  text: Ia tidak menyusun kata-kata yang ditujukan kepadaku[a], dan aku tidak akan menjawab dia dengan ucapan kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia tidak mengarahkan kata-kata kepadaku.” Kata kerja Ibrani dapat berarti menata, menyusun, atau mengarahkan kata-kata sebagai suatu argumen.'
    reason: lexical_alternative
  - marker: b
