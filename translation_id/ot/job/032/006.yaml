  text: וַ/יַּ֤עַן אֱלִיה֖וּא בֶן בַּֽרַכְאֵ֥ל הַ/בּוּזִ֗י וַ/יֹּ֫אמַ֥ר צָ֘עִ֤יר אֲנִ֣י לְ֭/יָמִים וְ/אַתֶּ֣ם יְשִׁישִׁ֑ים עַל כֵּ֖ן זָחַ֥לְתִּי וָֽ/אִירָ֓א מֵ/חַוֺּ֖ת דֵּעִ֣/י אֶתְ/כֶֽם׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: id
  text: Lalu Elihu anak Barakel, orang Bus itu, menjawab, “Aku masih muda[a], sedangkan kalian sudah lanjut usia. Karena itu, aku segan[b] dan takut menyampaikan pengetahuanku kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “muda dalam hari-hari,” yaitu muda dalam usia.
    reason: cultural_note
  - marker: b
    text: Atau, “aku menahan diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: menjawab
  rationale: Kedua verba membentuk rumus pengantar tuturan Ibrani. Dalam bahasa Indonesia, satu verba “menjawab” diikuti kutipan langsung menyampaikan fungsi keduanya secara alami tanpa menimbulkan pengulangan yang kaku.
- source_word: אֱלִיהוּא בֶן־בַּרַכְאֵל הַבּוּזִי
  choice: Elihu anak Barakel, orang Bus itu
  rationale: Nama-nama ditransliterasikan, sedangkan gentilik הַבּוּזִי diterjemahkan sebagai penanda asal atau kelompok, “orang Bus”.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: Aku masih muda
  rationale: Ungkapan harfiah “muda dalam hari-hari” merupakan idiom usia. “Masih muda” adalah padanan Indonesia yang wajar, sementara citra harfiahnya dicatat dalam catatan kaki.
- source_word: וְאַתֶּם יְשִׁישִׁים
  choice: sedangkan kalian sudah lanjut usia
  rationale: יְשִׁישִׁים menunjukkan usia yang lanjut. “Lanjut usia” menjaga nada hormat Elihu, dan “sedangkan” memperjelas kontras dengan kemudaannya.
- source_word: עַל־כֵּן
  choice: Karena itu
  rationale: Frasa ini menandai akibat logis dari perbedaan usia yang baru disebutkan.
- source_word: זָחַלְתִּי
  choice: aku segan
  rationale: Verba ini menggambarkan sikap mengundurkan atau menahan diri karena gentar. “Segan” secara alami menyatakan keraguan penuh hormat dalam konteks berbicara kepada orang yang lebih tua.
- source_word: וָאִירָא
  choice: dan takut
  rationale: Padanan ini mempertahankan unsur ketakutan yang berdampingan dengan sikap segan, tanpa meleburkan kedua ungkapan tersebut.
- source_word: מֵחַוֺּת דֵּעִי אֶתְכֶם
  choice: menyampaikan pengetahuanku kepada kalian
  rationale: מֵחַוֺּת berarti menyatakan atau memberitahukan, dan דֵּעִי secara harfiah menunjuk pada “pengetahuanku”. Susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan teks sumber.
