  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: id
  text: Aku berkata[a], “Orang-orang yang lanjut usia seharusnya berbicara, dan banyaknya tahun seharusnya menyatakan hikmat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku berpikir, ‘Orang-orang yang lanjut usia seharusnya berbicara, dan banyaknya tahun seharusnya menyatakan hikmat.’” Secara harfiah, bahasa Ibrani memakai “hari-hari” dan “banyaknya tahun” secara metonimis untuk menunjuk kepada usia lanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Aku berkata
  rationale: Bentuk Qal perfektif orang pertama tunggal dari אמר secara langsung berarti ‘aku berkata’. Dalam konteks ini, ungkapan tersebut memperkenalkan anggapan Elihu sebelumnya; alternatif ‘aku berpikir’ mungkin secara kontekstual, tetapi kurang dekat dengan bentuk leksikalnya.
- source_word: יָמִים
  choice: Yang lanjut usia
  rationale: Secara harfiah berarti ‘hari-hari’, tetapi di sini dipakai secara metonimis untuk orang yang telah berumur panjang. Bahasa Indonesia tidak alami jika ‘hari-hari’ dijadikan pelaku yang berbicara, sehingga makna metonimis dinyatakan dalam teks.
- source_word: יְדַבֵּרוּ
  choice: seharusnya berbicara
  rationale: Bentuk Piel imperfektif orang ketiga jamak dari דבר. Dalam konteks, Elihu menyatakan harapan atau anggapan mengenai apa yang patut terjadi, bukan sekadar ramalan masa depan; ‘seharusnya’ menyampaikan nuansa itu.
- source_word: וְרֹב שָׁנִים
  choice: dan banyaknya tahun
  rationale: Frasa ini berarti ‘kelimpahan/banyaknya tahun’. Pilihan ini mempertahankan gambaran puitis tentang umur panjang dan kesejajaran dengan baris pertama.
- source_word: יֹדִיעוּ
  choice: seharusnya memberitahukan
  rationale: Bentuk Hifil imperfektif orang ketiga jamak dari ידע berarti ‘menyebabkan tahu, memberitahukan’. Pilihan ini menjaga makna kausatif dan meneruskan nuansa harapan dari klausa sebelumnya.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Nomina ini secara langsung berarti ‘hikmat’; istilah tersebut alami dalam register sastra hikmat dan mempertahankan tema utama kitab Ayub.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Metonimia ‘hari-hari’ dijelaskan dalam catatan kaki, sedangkan teks utama memakai ungkapan yang alami dan mudah dipahami. Personifikasi ‘banyaknya tahun’ dipertahankan untuk menjaga kesejajaran puisi Ibrani.
