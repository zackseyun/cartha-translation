  source_fidelity: 'Teks Indonesia secara setia mencerminkan tiga klausa Ibrani: חַתּוּ sebagai keadaan terdiam karena terguncang/tertegun, לֹא עָנוּ עוֹד sebagai tidak lagi menjawab, dan הֶעְתִּיקוּ מֵהֶם מִלִּים sebagai personifikasi kata-kata yang meninggalkan mereka. Terjemahan tidak menambahkan penafsiran yang tidak ada dalam sumber.'
  naturalness: “Mereka tertegun; mereka tidak menjawab lagi; kata-kata telah meninggalkan mereka” adalah bahasa Indonesia baku, jelas, dan tetap bernada puitis. Pengulangan “mereka” membantu mempertahankan susunan klausa dan subjek yang eksplisit.
  terminology: “Tertegun” merupakan pilihan kontekstual yang wajar untuk חתתו dalam gambaran para sahabat Ayub yang dibuat bungkam. Catatan a dengan tepat menjaga alternatif semantis seperti gentar dan kebingungan, sementara catatan b menjelaskan idiom tanpa menggantikan citra harfiahnya dalam teks utama. Tidak ada istilah teologis atau nama yang perlu diseragamkan.
