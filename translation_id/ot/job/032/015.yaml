source:
  edition: WLC
  text: חַ֭תּוּ לֹא עָ֣נוּ ע֑וֹד הֶעְתִּ֖יקוּ מֵ/הֶ֣ם מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: id
  text: Mereka tertegun[a]; mereka tidak menjawab lagi; kata-kata telah meninggalkan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mereka menjadi gentar” atau “Mereka kebingungan”; kata kerja Ibrani dapat menggambarkan keadaan remuk, gentar, atau kehilangan keberanian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kata-kata telah menjauh dari mereka,” yaitu mereka tidak mempunyai apa-apa lagi untuk dikatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: Mereka tertegun
  rationale: Bentuk dari חתת dapat menyatakan keadaan remuk, gentar, atau bingung dan kehilangan keberanian. Dalam konteks ini, sahabat-sahabat Ayub dibuat tak mampu melanjutkan jawaban; “tertegun” menyampaikan keadaan terpukul hingga terdiam secara alami tanpa memperkerasnya menjadi kehancuran harfiah.
- source_word: לֹא עָנוּ עוֹד
  choice: mereka tidak menjawab lagi
  rationale: ענה berarti menjawab dalam perdebatan, sedangkan לֹא ... עוֹד menunjukkan bahwa tindakan itu tidak berlanjut lagi.
- source_word: הֶעְתִּיקוּ מֵהֶם מִלִּים
  choice: kata-kata telah meninggalkan mereka
  rationale: Hifil עתק dengan מֵהֶם menggambarkan kata-kata bergerak atau menjauh dari mereka. Terjemahan ini mempertahankan personifikasi Ibrani sekaligus mengisyaratkan bahwa mereka tidak mempunyai apa-apa lagi untuk dikatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur tiga klausa dipertahankan, dan gambaran kata-kata yang meninggalkan para pembicara tidak diparafrasakan seluruhnya.
