lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel wacana ini menarik perhatian kepada perbandingan hidup yang segera disampaikan Elihu. “Lihatlah” mempertahankan daya penunjuknya dalam bahasa Indonesia modern.
- source_word: בִטְנִי
  choice: perutku
  rationale: בטן secara konkret berarti perut atau bagian dalam tubuh, tetapi juga dapat menunjuk kepada batin. “Perutku” mempertahankan gambaran jasmani tentang tekanan dari dalam tanpa menutup kemungkinan makna kiasannya.
- source_word: כְיַיִן
  choice: seperti anggur
  rationale: Terjemahan langsung dari unsur pembanding dan יין. Gagasan fermentasi tersirat oleh konteks tekanan, tetapi tidak ditambahkan karena tidak dinyatakan secara eksplisit.
- source_word: לֹא יִפָּתֵחַ
  choice: yang tidak mendapat jalan keluar
  rationale: Bentuk Nifal dari פתח secara harfiah berarti “tidak dibuka”. Dalam perumpamaan ini, ungkapan tersebut menggambarkan anggur yang tertutup sehingga tekanannya tidak dapat dilepaskan; pilihan ini menyampaikan maksud itu secara wajar.
- source_word: כְאֹבוֹת חֲדָשִׁים
  choice: seperti kirbat-kirbat baru
  rationale: אֹבוֹת dalam konteks anggur menunjuk kepada wadah dari kulit, bukan roh. “Kirbat-kirbat baru” mempertahankan benda budaya dan menerjemahkan חֲדָשִׁים secara langsung.
- source_word: יִבָּקֵעַ
  choice: ia hampir pecah
  rationale: בקע berarti terbelah atau pecah. “Hampir pecah” mengungkapkan tekanan yang terasa mendesak dalam gambaran ini, sedangkan “ia” merujuk kembali kepada perut Elihu yang dibandingkan dengan wadah anggur.
