  text: וּ/בִ/שְׁלֹ֣שֶׁת רֵעָי/ו֮ חָרָ֪ה אַ֫פּ֥/וֹ עַ֤ל אֲשֶׁ֣ר לֹא מָצְא֣וּ מַעֲנֶ֑ה וַ֝/יַּרְשִׁ֗יעוּ אֶת אִיּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/003.yaml
  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: id
  text: Ia juga sangat marah kepada ketiga sahabat Ayub karena mereka tidak menemukan jawaban, tetapi menyatakan Ayub bersalah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menganggap Ayub fasik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: kepada ketiga sahabat Ayub
  rationale: Dengan idiom חרה אף, preposisi ב menandai sasaran kemarahan. Nama Ayub dipakai alih-alih pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: חָרָה אַפּוֹ
  choice: ia juga sangat marah
  rationale: Idiom harfiah 'hidungnya menyala' menyatakan kemarahan yang berkobar. Ungkapan 'sangat marah' menyampaikan intensitasnya secara alami dalam bahasa Indonesia modern.
- source_word: עַל אֲשֶׁר
  choice: karena
  rationale: Gabungan ini memperkenalkan alasan kemarahan Elihu.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: mereka tidak menemukan jawaban
  rationale: מַעֲנֶה berarti jawaban atau tanggapan dalam konteks perdebatan; 'jawaban' mempertahankan gambaran bahwa para sahabat gagal memberi sanggahan yang memadai.
- source_word: וַיַּרְשִׁיעוּ אֶת אִיּוֹב
  choice: tetapi menyatakan Ayub bersalah
  rationale: 'Bentuk Hifil dari רשע lazimnya berdaya deklaratif atau forensik: menyatakan seseorang bersalah. ''Tetapi'' mengungkapkan pertentangan kontekstual tanpa mengubah isi tindakan tersebut.'
theological_decisions:
- issue: Makna tindakan para sahabat terhadap Ayub
  choice: menyatakan Ayub bersalah
  alternative: menganggap Ayub fasik; menghukum Ayub
  rationale: Bentuk Hifil dari רשע mendukung pengertian deklaratif/forensik. Terjemahan ini mempertahankan tuduhan para sahabat tanpa menyiratkan bahwa mereka benar-benar membuktikan kesalahan Ayub atau menjatuhkan hukuman resmi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Ia juga' menghubungkan ayat ini dengan kemarahan Elihu pada ayat sebelumnya; nama Ayub memperjelas pemilik ketiga sahabat. Metafora tubuh Ibrani pada חרה אפ tidak dipertahankan secara harfiah karena akan kabur dalam bahasa Indonesia.
