  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: id
  text: Sungguh, aku menunggu perkataan kalian; aku menyimak penalaran kalian, sampai kalian mencari-cari kata-kata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai kalian menyelidiki kata-kata,” atau, “sampai kalian mencari kata-kata untuk menjawab.” Frasa Ibrani ini ringkas dan dapat menunjuk pada pencarian rumusan atau jawaban yang tepat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sungguh
  rationale: Partikel wacana ini menarik perhatian dan memberi penegasan. “Sungguh” terdengar wajar dan bermartabat dalam konteks puisi, tanpa memakai bentuk arkais seperti “lihatlah”.
- source_word: הוֹחַלְתִּי
  choice: aku menantikan
  rationale: Kata kerja יחל dapat berarti menunggu atau berharap. “Menantikan” mempertahankan unsur menunggu dengan pengharapan yang sesuai dengan kesabaran Elihu.
- source_word: לְדִבְרֵיכֶם
  choice: perkataan kalian
  rationale: Frasa ini menunjuk kepada apa yang diucapkan para lawan bicara. “Perkataan kalian” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk sumber.
- source_word: אָזִין
  choice: aku mendengarkan
  rationale: Bentuk kausatif dari אזן menyatakan tindakan memasang telinga atau menyimak. “Mendengarkan” menyampaikan perhatian aktif secara alami.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: pemahaman kalian
  rationale: Bentuk jamak תבונות dapat menunjuk pada pemahaman, pertimbangan, atau penalaran. “Pemahaman kalian” menjaga keluasan makna tanpa mempersempitnya menjadi argumen tertentu.
- source_word: עַד
  choice: sementara
  rationale: Dalam susunan puitis ini עַד dapat menandai rentang berlangsungnya tindakan sampai atau selama mereka mencari kata-kata. “Sementara” menghasilkan hubungan kalimat yang alami, sedangkan kemungkinan temporal “sampai” dicatat dalam catatan kaki.
- source_word: תַּחְקְרוּן
  choice: kalian mencari-cari
  rationale: חקר berarti menyelidiki atau mencari dengan saksama. Reduplikasi “mencari-cari” secara alami menggambarkan upaya menemukan rumusan yang tepat.
- source_word: מִלִּין
  choice: kata-kata
  rationale: Bentuk puitis ini secara leksikal berarti kata-kata. Pilihan ini tidak menafsirkan secara berlebihan sebagai “jawaban” atau “argumen”.
