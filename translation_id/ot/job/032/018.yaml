  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֭י מָלֵ֣תִי מִלִּ֑ים הֱ֝צִיקַ֗תְ/נִי ר֣וּחַ בִּטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: id
  text: Sebab aku penuh dengan kata-kata; roh dalam batinku mendesak aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roh dalam perutku” atau “roh dalam bagian terdalam diriku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan Elihu harus berbicara dan mempertahankan daya kausal-eksplanatoris ayat ini secara alami dalam bahasa Indonesia.
- source_word: מָלֵתִי מִלִּים
  choice: aku penuh dengan kata-kata
  rationale: Mempertahankan gambaran harfiah tentang diri yang penuh oleh kata-kata, sekaligus terdengar wajar dan jelas dalam bahasa Indonesia modern.
- source_word: הֱצִיקַתְנִי
  choice: mendesak aku
  rationale: Kata kerja ini menyatakan tekanan atau desakan. Dalam konteks ucapan yang tertahan, 'mendesak' menjaga unsur tekanan batin tanpa mengubahnya secara berlebihan menjadi perintah mutlak.
- source_word: רוּחַ
  choice: roh
  rationale: Di sini menunjuk pada daya atau dorongan batin yang menggerakkan Elihu; 'roh' mempertahankan keluasan makna sumber dan tidak membatasinya menjadi napas atau angin.
- source_word: בִּטְנִי
  choice: dalam batinku
  rationale: Secara harfiah berarti 'perutku', tetapi dalam antropologi Ibrani menunjuk bagian terdalam diri. 'Dalam batinku' menyampaikan idiom itu secara alami sambil mempertahankan lokasinya sebagai batin manusia.
theological_decisions:
- issue: Apakah רוּחַ menunjuk Roh Allah atau roh/dorongan batin Elihu
  choice: roh dalam batinku
  alternative: Roh Allah di dalam diriku
  rationale: Teks tidak menyebut Allah dan konstruksinya mengaitkan roh itu dengan bagian terdalam Elihu. Terjemahan tidak menambahkan identifikasi ilahi yang tidak dinyatakan oleh sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan 'penuh dengan kata-kata' mempertahankan citra puitis sumber, sedangkan 'dalam batinku' mengomunikasikan idiom tubuh Ibrani tanpa terdengar janggal. Penanda catatan ditempatkan setelah klausa yang dijelaskannya.
