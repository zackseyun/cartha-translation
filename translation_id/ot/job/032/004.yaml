  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: id
  text: Elihu menunggu sebelum berbicara kepada Ayub[a], karena mereka lebih tua daripadanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Elihu menunggu Ayub dalam kata-kata”; dalam konteks, ungkapan ini dipahami sebagai bahwa ia menunggu sebelum berbicara kepada Ayub.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka lebih tua daripadanya menurut hari-hari,” yaitu lebih tua dalam hal umur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: Elihu
  rationale: Nama diri ditransliterasikan secara lazim dalam bahasa Indonesia. Waw tidak diterjemahkan secara tersendiri karena di sini terutama menghubungkan alur narasi, dan hubungan itu sudah wajar tanpa kata penghubung tambahan.
- source_word: חִכָּה
  choice: menunggu
  rationale: Kata kerja ini berarti menunggu atau berlambat-lambat. Bentuk lampau sempurna tidak perlu dinyatakan secara khusus dalam bahasa Indonesia karena urutan waktunya dipahami dari konteks narasi.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: untuk berbicara kepada Ayub
  rationale: Secara harfiah susunannya tidak lazim, kira-kira ‘menunggu Ayub dalam kata-kata’. Dalam konteks, maksudnya ialah Elihu menunggu sebelum berbicara kepada Ayub; ungkapan verbal ini menyampaikan arti idiomatisnya secara alami.
- source_word: כִּי
  choice: karena
  rationale: Partikel ini menyatakan alasan Elihu menunggu.
- source_word: זְקֵנִים הֵמָּה
  choice: mereka lebih tua
  rationale: Dalam konstruksi perbandingan ini, kata sifat tersebut menunjuk pada usia yang lebih tua, bukan jabatan sebagai tua-tua.
- source_word: מִמֶּנּוּ
  choice: daripadanya
  rationale: Preposisi מן menyatakan perbandingan. Bentuk pronominal tetap mempertahankan rujukan kepada Elihu tanpa mengulang namanya.
- source_word: לְיָמִים
  choice: dalam hal umur
  rationale: Ungkapan harfiahnya berkaitan dengan ‘hari-hari’, tetapi secara idiomatis menunjuk pada usia. Gagasan ini telah tersampaikan secara alami oleh ‘lebih tua’, sementara bentuk sumber dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Susunan idiom Ibrani dijernihkan dalam teks utama, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki. Kata ganti jamak ‘mereka’ dipertahankan agar rujukan implisit dalam sumber tidak diperjelas secara berlebihan.
