  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: id
  text: Ketika Elihu melihat bahwa tidak ada jawaban dari ketiga orang itu[a], amarahnya berkobar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak ada jawaban di dalam mulut ketiga orang itu,” sebuah ungkapan yang berarti bahwa mereka tidak mempunyai jawaban untuk diberikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika ... melihat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Dalam konteks ini, “ketika” secara alami menyatakan keadaan yang memicu reaksi Elihu.
- source_word: אֱלִיהוּא
  choice: Elihu
  rationale: Nama diri ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang dilihat Elihu, bukan terutama alasan atau sebab.
- source_word: אֵין מַעֲנֶה
  choice: tidak ada jawaban
  rationale: Ungkapan ini menyatakan ketiadaan jawaban dalam konteks perdebatan Ayub dan ketiga sahabatnya.
- source_word: בְּפִי שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: dari ketiga orang itu
  rationale: Bahasa Ibrani secara harfiah menggambarkan jawaban yang tidak ada “di dalam mulut” mereka. Terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan gambaran harfiahnya dijelaskan dalam catatan kaki.
- source_word: וַיִּחַר אַפּוֹ
  choice: amarahnya berkobar
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan hidung yang menyala atau panas. “Amarahnya berkobar” mempertahankan metafora panasnya kemarahan sekaligus terdengar alami dan bermartabat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan nada naratif yang bermartabat. Metafora amarah yang berkobar dipertahankan, sedangkan idiom tentang jawaban “di dalam mulut” dijelaskan melalui catatan kaki.
