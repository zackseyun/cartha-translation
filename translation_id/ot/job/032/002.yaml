  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: id
  text: Lalu Elihu bin Barakel, orang Bus dari kaum Ram, berkobar amarahnya terhadap Ayub; ia marah karena Ayub membenarkan dirinya sendiri dan bukan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena ia menganggap dirinya lebih benar daripada Allah.”
    reason: Bentuk מֵאֱלֹהִים juga dapat dipahami secara komparatif, sehingga menghasilkan bacaan yang lebih tegas daripada ungkapan kontras dalam teks utama.
lexical_decisions:
- source_word: וַיִּחַר אַף / חָרָה אַפּוֹ
  choice: amarah ... berkobar / amarahnya berkobar
  rationale: Ungkapan Ibrani secara harfiah menggambarkan amarah yang menyala. “Berkobar” mempertahankan citra itu secara alami serta menjaga pengulangan yang memberi penekanan.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: Elihu bin Barakel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; “bin” secara ringkas dan wajar menyatakan hubungan ayah-anak.
- source_word: הַבּוּזִי
  choice: orang Bus
  rationale: Sebutan asal atau kelompok ini diterjemahkan dengan bentuk Indonesia yang alami, yakni “orang” diikuti nama Bus.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: dari kaum Ram
  rationale: מִשְׁפָּחָה dapat menunjuk keluarga besar atau klan. “Kaum” cukup luas untuk mencerminkan cakupan tersebut.
- source_word: בְּאִיּוֹב
  choice: terhadap Ayub
  rationale: Dengan verba amarah, preposisi ב menandai sasaran amarah; “terhadap” merupakan padanan Indonesia yang jelas.
- source_word: עַל
  choice: karena
  rationale: Dalam konteks ini עַל memperkenalkan alasan amarah Elihu.
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: Ayub membenarkan dirinya
  rationale: Bentuk verba memiliki nuansa menyatakan benar atau berada di pihak yang benar, sedangkan נַפְשׁוֹ berfungsi secara refleksif. Nama “Ayub” dipakai untuk memperjelas subjek dalam kalimat Indonesia.
- source_word: מֵאֱלֹהִים
  choice: bukan Allah
  rationale: מִן memiliki daya banding atau kontras di sini. “Bukan Allah” mempertahankan gagasan bahwa pembenaran diri Ayub terjadi dengan mengorbankan pembenaran Allah, tanpa memasukkan tafsiran yang lebih kuat langsung ke teks utama.
theological_decisions:
- issue: Makna עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: karena Ayub membenarkan dirinya, bukan Allah
  alternative: karena ia menganggap dirinya lebih benar daripada Allah
  rationale: Susunan Ibrani sulit dan dapat menyatakan kontras maupun perbandingan. Teks utama mempertahankan ketegangan antara pembenaran diri Ayub dan pembenaran Allah tanpa menyatakan secara berlebihan bahwa Ayub secara eksplisit mengaku memiliki moralitas yang lebih tinggi daripada Allah. Bacaan komparatif yang lebih tegas dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “amarah ... berkobar” dipertahankan untuk mencerminkan penekanan retoris bahasa Ibrani. Tanda titik koma menghubungkan pernyataan umum tentang amarah Elihu dengan alasan khususnya.
