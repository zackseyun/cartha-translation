  terminology: Istilah “roh,” “napas,” “Yang Mahakuasa,” dan “pengertian” konsisten, mudah dipahami, dan tidak mengimpor penafsiran denominational. Catatan kaki menjelaskan alternatif penyelarasan jumlah tanpa menyajikannya sebagai pembacaan teks yang berbeda.
