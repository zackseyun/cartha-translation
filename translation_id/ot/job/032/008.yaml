  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur utama Ibrani: רוּחַ dibedakan dari נִשְׁמַת sebagai “roh” dan “napas”; שַׁדַּי diterjemahkan “Yang Mahakuasa”; dan bentuk kausatif תְּבִינֵם disampaikan dengan “memberi ... pengertian.” Peralihan dari nomina tunggal generik אֱנוֹשׁ kepada akhiran objek jamak pada תְּבִינֵם dipertahankan. “Namun” dapat diterima untuk אָכֵן dalam alur korektif ujaran Elihu dan sejalan dengan audit trail Inggris.'
