  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: id
  text: Namun, ada roh dalam diri manusia[a], dan napas Yang Mahakuasa memberi mereka pengertian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh, ada roh dalam diri seseorang, dan napas Yang Mahakuasa memberinya pengertian.” Teks Ibrani beralih dari bentuk tunggal “manusia” ke bentuk jamak “mereka”; sebagian terjemahan menyelaraskannya menjadi bentuk tunggal.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: Namun
  rationale: Dalam alur perkataan Elihu, kata ini memperkenalkan koreksi yang bersifat tegas terhadap anggapan bahwa usia semata-mata menghasilkan hikmat. “Namun” menyampaikan daya kontras itu secara wajar dalam bahasa Indonesia.
- source_word: רוּחַ
  choice: roh
  rationale: Di sini kata tersebut menunjuk pada unsur nonjasmani dalam manusia. “Roh” juga membedakannya dari נִשְׁמָה, yang diterjemahkan “napas” pada bagian berikutnya.
- source_word: הִיא
  choice: ada
  rationale: Dalam klausa nominal ini, pronomina tersebut paling alami dipahami secara idiomatis sebagai penegasan keberadaan. “Ada” menghasilkan bahasa Indonesia yang wajar tanpa memaksakan konstruksi belah.
- source_word: בֶאֱנוֹשׁ
  choice: dalam diri manusia
  rationale: אֱנוֹשׁ berarti manusia fana dan digunakan secara generik dalam bentuk tunggal. “Dalam diri manusia” mempertahankan cakupan umum serta terdengar alami dalam bahasa Indonesia.
- source_word: וְנִשְׁמַת
  choice: dan napas
  rationale: נִשְׁמָה paling lazim berarti “napas”, khususnya dalam kaitannya dengan pemberian hidup oleh Allah. Pilihan ini mempertahankan perbedaan leksikal dan kesejajaran puitis dengan רוּחַ, “roh”.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi שַׁדַּי diterjemahkan dengan padanan baku bahasa Indonesia yang menyampaikan kekuasaan Allah, bukan ditransliterasikan.
- source_word: תְּבִינֵם
  choice: memberi mereka pengertian
  rationale: Bentuk Hifil dari בין menyatakan pemberian kemampuan memahami, sedangkan sufiksnya berbentuk orang ketiga jamak. Terjemahan ini mempertahankan makna kausatif dan objek jamak sumber Ibrani.
theological_decisions:
- issue: Bahasa antropologis dan peralihan jumlah
  choice: 'Ayat ini berbicara secara umum tentang umat manusia: ada roh dalam diri manusia, dan napas Allah memberi mereka pengertian.'
  alternative: 'Ayat ini berbicara tentang seorang individu: ada roh dalam diri seseorang, dan napas Yang Mahakuasa memberinya pengertian.'
  rationale: Teks Ibrani beralih dari אֱנוֹשׁ yang tunggal dan generik (“manusia”) kepada sufiks objek jamak dalam תְּבִינֵם (“memberi mereka pengertian”). Teks utama mempertahankan peralihan tersebut dan tidak menyelaraskannya secara diam-diam.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. “Manusia” dipakai sebagai nomina generik yang alami dalam bahasa Indonesia. Peralihan dari bentuk tunggal “manusia” ke bentuk jamak “mereka” sengaja dipertahankan karena terdapat dalam teks Ibrani, lalu dijelaskan dalam catatan kaki.
