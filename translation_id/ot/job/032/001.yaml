  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: id
  text: Lalu ketiga orang itu berhenti menjawab Ayub, karena ia benar menurut pandangannya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Menurut tradisi tekstual lain: “karena ia benar menurut pandangan mereka.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: berhenti
  rationale: Kata kerja שבת di sini menyatakan berhenti melakukan sesuatu dan diikuti bentuk infinitif ‘menjawab’; ‘berhenti’ alami dalam bahasa Indonesia modern.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ketiga orang itu
  rationale: Menyampaikan jumlah dan rujukan demonstratif secara alami; konteks telah mengenalkan ketiganya.
- source_word: מֵעֲנוֹת
  choice: menjawab
  rationale: Bentuk infinitif ענה berarti menjawab atau menanggapi dalam perdebatan; ‘menjawab’ tepat dan ringkas.
- source_word: אֶת אִיּוֹב
  choice: Ayub
  rationale: Penanda objek langsung tidak diterjemahkan tersendiri, sedangkan nama אִיּוֹב mengikuti bentuk baku Indonesia ‘Ayub’.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan mereka berhenti menjawab dan jelas dalam bahasa Indonesia masa kini.
- source_word: צַדִּיק
  choice: benar
  rationale: Dalam konteks perselisihan ini, צַדִּיק memiliki nuansa moral-yudisial ‘berada di pihak yang benar’; ‘benar’ mempertahankan keluwesan makna tanpa menambahkan penilaian penerjemah.
- source_word: בְּעֵינָיו
  choice: menurut pandangannya sendiri
  rationale: Ungkapan idiomatis Ibrani ‘di matanya’ dengan sufiks orang ketiga tunggal paling alami dinyatakan sebagai penilaian menurut dirinya sendiri.
theological_decisions:
- issue: Apakah Ayub dinyatakan sungguh-sungguh benar atau hanya benar menurut penilaiannya sendiri
  choice: ia benar menurut pandangannya sendiri
  alternative: ia benar menurut pandangan mereka
  rationale: Teks WLC yang diberikan memakai sufiks tunggal ‘matanya’, sehingga pernyataan itu menggambarkan penilaian Ayub terhadap dirinya tanpa memastikan atau menyangkal kebenaran objektifnya. Varian tekstual dengan sufiks jamak dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Lalu’ menghubungkan ayat ini dengan perdebatan sebelumnya; ‘ketiga orang itu’ lebih alami daripada susunan yang terlalu harfiah. Penanda catatan kaki ditempatkan langsung setelah klausa yang memiliki varian.
