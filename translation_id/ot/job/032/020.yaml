base_translation:
  language: en
  yaml_path: translation/ot/job/032/020.yaml
  text: I will speak[a], that I may find relief; I will open my lips and answer.
translation:
  language: id
  text: Aku akan berbicara[a] supaya aku merasa lega; aku akan membuka bibirku dan menjawab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan itu akan membuatku lega,” atau “dan aku akan merasa lega.” Ungkapan Ibrani ini dapat menyatakan hasil maupun tujuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: Aku akan berbicara
  rationale: Bentuk kohortatif orang pertama tunggal menyatakan tekad atau niat Elihu. Ungkapan ini wajar dalam bahasa Indonesia dan tidak mengubahnya menjadi permintaan izin.
- source_word: וְיִרְוַח לִי
  choice: supaya aku merasa lega
  rationale: Kata kerja dari akar רוח dalam konstruksi dengan לִי menyatakan kelapangan atau kelegaan yang dialami pembicara. 'Supaya' mempertahankan kemungkinan hubungan tujuan dalam konteks ini, sementara catatan kaki mencatat kemungkinan hubungan hasil.
- source_word: אֶפְתַּח
  choice: aku akan membuka
  rationale: Padanan langsung dan alami untuk bentuk imperfek Qal orang pertama tunggal dari פתח.
- source_word: שְׂפָתַי
  choice: bibirku
  rationale: Mempertahankan gambaran konkret 'bibir' dalam bahasa Ibrani, yang merupakan ungkapan untuk mulai berbicara.
- source_word: וְאֶעֱנֶה
  choice: dan menjawab
  rationale: ענה berarti menjawab atau menanggapi; 'menjawab' sesuai dengan konteks perdebatan dan mempertahankan bentuk ringkas teks sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'aku' sesuai dengan tuturan pribadi dalam puisi; susunan paralel dan gambaran 'membuka bibir' dipertahankan.
