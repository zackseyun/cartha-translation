  source_fidelity: Teks Indonesia dengan tepat mempertahankan kohortatif pembicara sebagai tekad ke depan ("Aku akan berbicara"), arti רווח לי sebagai kelegaan bagi pembicara, serta urutan paralel "membuka bibirku dan menjawab." "Supaya" merupakan pembacaan tujuan yang sah, dan catatan kaki dengan benar melestarikan kemungkinan pembacaan hasil.
