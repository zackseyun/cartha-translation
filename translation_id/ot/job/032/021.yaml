translation:
  language: id
  text: Janganlah kiranya aku memihak kepada siapa pun[a], dan aku tidak akan menyanjung siapa pun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengangkat wajah seseorang,” sebuah ungkapan Ibrani yang berarti menunjukkan keberpihakan atau pilih kasih.
    reason: lexical_alternative
  - marker: b
