    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Janganlah kiranya aku
  rationale: Gabungan אַל dan נָא menyatakan permohonan atau tekad negatif yang sungguh-sungguh. Ungkapan “janganlah kiranya aku” mempertahankan nuansa itu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: memihak kepada siapa pun
  rationale: Secara harfiah ungkapan ini berarti “mengangkat wajah seseorang,” sebuah idiom Ibrani untuk memperlakukan orang dengan keberpihakan atau pilih kasih. “Siapa pun” menyampaikan daya generik dari bentuk tunggal אִישׁ secara alami dalam bahasa Indonesia.
- source_word: וְאֶל אָדָם
  choice: atau ... seseorang
  rationale: אָדָם di sini menunjuk kepada seorang manusia dan sejajar dengan אִישׁ. “Seseorang” menghindari pengulangan yang kaku tanpa menghilangkan cakupan manusiawinya. Konjungsi וְ dalam rangkaian negatif ini diterjemahkan “atau” secara idiomatis.
- source_word: לֹא אֲכַנֶּה
  choice: menyanjung
  rationale: Bentuk Piel dari כנה dapat menunjuk pada penyapaan dengan gelar, khususnya gelar yang bersifat menjilat atau menyanjung. “Menyanjung” menyampaikan maksud etisnya secara ringkas, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
