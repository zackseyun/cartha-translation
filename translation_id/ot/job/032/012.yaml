  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: id
  text: Aku memperhatikan kalian dengan saksama[a], dan ternyata tidak seorang pun di antara kalian yang menyanggah Ayub[b] dan menjawab perkataannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku menyimak kalian dengan teliti.” Kata kerja Ibrani menggambarkan pertimbangan atau pengamatan yang penuh perhatian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mengoreksi Ayub” atau “menegur Ayub.” Istilah Ibrani dapat berarti membantah dalam perdebatan, membuktikan kesalahan, atau menegur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: Aku memperhatikan kalian dengan saksama
  rationale: Gabungan עַד dengan sufiks orang kedua dan bentuk Hitpolel dari בין menyatakan perhatian atau pengamatan yang sungguh-sungguh kepada para lawan bicara; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks Elihu yang menyimak perdebatan.
- source_word: וְהִנֵּה
  choice: tetapi ternyata
  rationale: הִנֵּה menandai hasil pengamatan Elihu yang mengejutkan atau tegas. Dalam alur ini, 'tetapi ternyata' menyampaikan daya retoris dan kontras secara alami, tanpa terjemahan harfiah yang kaku.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: tidak seorang pun ... yang dapat menyanggah Ayub
  rationale: מוֹכִיחַ dari יכח dapat menunjuk orang yang membuktikan kesalahan, membantah, atau menegur. Dalam konteks perdebatan, 'menyanggah' paling langsung menyatakan bantahan argumentatif; 'dapat' membuat konstruksi eksistensial Ibrani wajar dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: עוֹנֶה אֲמָרָיו
  choice: menjawab perkataannya
  rationale: ענה bersama אֲמָרָיו berarti memberi jawaban terhadap hal-hal yang dikatakan Ayub. Pilihan ini dekat dengan bentuk Ibrani sekaligus jelas dalam bahasa Indonesia.
- source_word: מִכֶּם
  choice: di antara kalian
  rationale: Preposisi מִן menunjukkan bahwa orang yang dimaksud seharusnya berasal dari kelompok sahabat Ayub; 'di antara kalian' merupakan bentuk idiomatis dalam konstruksi negatif ini.
theological_decisions:
- issue: Cakupan makna מוֹכִיחַ
  choice: menyanggah Ayub
  alternative: menegur atau mengoreksi Ayub
  rationale: Konteks utamanya adalah perdebatan dan kegagalan menjawab perkataan Ayub, sehingga makna argumentatif dipakai dalam teks utama. Nuansa teguran atau koreksi tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' mempertahankan sapaan jamak kepada para sahabat Ayub. Struktur kalimat dibuat alami bagi pembaca umum, sementara dua catatan kaki menjaga keluasan makna istilah Ibrani.
