  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: id
  text: Bukan banyak orang yang bijaksana, dan bukan orang-orang tua yang memahami keadilan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghakiman,” “keputusan,” atau “apa yang benar.” Kata Ibrani mishpat dapat menunjuk pada putusan hukum, keadilan, atau tatanan yang benar.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang besar.” Kata Ibrani rabbim dapat berarti “banyak orang” atau, dalam beberapa konteks, “orang-orang besar/terkemuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Bukan
  rationale: Partikel ini menyangkal klausa pertama dengan penekanan. Bentuk “Bukan ...” mempertahankan penegasan Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: רַבִּים
  choice: orang banyak
  rationale: Kata ini secara harfiah berarti “banyak” dan dipakai sebagai substantif. “Orang banyak” mempertahankan gagasan kelompok yang berjumlah banyak tanpa mengalihkannya menjadi kedudukan sosial seperti “orang-orang besar.”
- source_word: יֶחְכָּמוּ
  choice: yang bijaksana
  rationale: Bentuk Qal dari חכם dapat berarti menjadi atau bersikap bijaksana. Dalam pernyataan umum ini, “yang bijaksana” menyampaikan keadaan yang dimaksud secara alami.
- source_word: וּזְקֵנִים
  choice: dan bukan orang-orang tua
  rationale: זְקֵנִים dapat berarti orang-orang tua, para tua-tua, atau mereka yang lanjut usia. Konteksnya membandingkan usia dengan pengertian sejati, sehingga ungkapan berdasarkan usia lebih tepat daripada istilah jabatan “para tua-tua.” Kata “bukan” diulang untuk menyatakan cakupan penyangkalan secara jelas dalam bahasa Indonesia.
- source_word: יָבִינוּ
  choice: yang memahami
  rationale: בין lazim berarti memahami atau membedakan. “Memahami” merupakan padanan langsung dan cocok dengan objek yang mengikutinya.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: מִשְׁפָּט dapat menunjuk pada penghakiman, keputusan hukum, keadilan, atau apa yang benar. “Keadilan” menyampaikan dimensi moral dan yudisialnya, sementara kemungkinan lain dipertahankan dalam catatan kaki.
