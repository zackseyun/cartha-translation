source:
  edition: WLC
  text: וְ֭/הוֹחַלְתִּי כִּי לֹ֣א יְדַבֵּ֑רוּ כִּ֥י עָ֝מְד֗וּ לֹא עָ֥נוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/016.yaml
  text: And I waited[a], because they did not speak[b], because they stood still and answered no more.
translation:
  language: id
  text: Aku pun menunggu[a], karena mereka tidak berbicara, karena mereka berhenti[b] dan tidak menjawab lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berharap.” Kata Ibrani ini dapat berarti menunggu dengan penuh harap; dalam konteks ini, “menunggu” lebih sesuai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berdiri.” Dalam konteks ini, maksudnya kemungkinan besar mereka telah berhenti berbicara dan tetap diam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: Aku pun menunggu
  rationale: Bentuk orang pertama tunggal dari יחל dalam konteks ini menggambarkan Elihu menahan diri sambil menantikan kelanjutan perkataan para tua-tua. Kata "menunggu" paling sesuai dengan situasi percakapan, sementara "pun" menghubungkan pernyataan ini dengan konteks sebelumnya.
- source_word: כִּי לֹא יְדַבֵּרוּ
  choice: karena mereka tidak berbicara
  rationale: כִּי dipahami secara kausal, dan bentuk imperfek יְדַבֵּרוּ menyatakan bahwa mereka tidak melanjutkan bicara selama Elihu menunggu.
- source_word: כִּי עָמְדוּ
  choice: karena mereka berhenti
  rationale: Secara harfiah עָמְדוּ berarti "mereka berdiri", tetapi dalam konteks pembicaraan ungkapan ini menunjukkan bahwa mereka telah berhenti atau terdiam. Pilihan ini menyampaikan maksud kontekstual secara alami sambil mencatat gambaran harfiahnya dalam catatan kaki.
- source_word: לֹא עָנוּ עוֹד
  choice: tidak menjawab lagi
  rationale: Gabungan negasi dengan עוֹד menunjukkan bahwa mereka tidak memberikan jawaban lebih lanjut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab yang berulang dipertahankan untuk mencerminkan pengulangan כִּי dalam teks Ibrani, sedangkan "berhenti" dipakai agar ungkapan idiomatisnya jelas bagi pembaca masa kini.
