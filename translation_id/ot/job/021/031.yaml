translation:
  language: id
  text: Siapa yang memberitahukan kepadanya tentang kelakuannya, langsung di hadapannya[a]? Dan atas apa yang telah dilakukannya[b], siapa yang membalasnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas wajahnya”; ungkapan ini menunjuk pada penyampaian atau konfrontasi secara langsung di depan orang yang bersangkutan.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibraninya ringkas: “dan ia telah melakukan; siapa yang membalasnya?” Terjemahan ini memperjelas kemungkinan maksudnya, yaitu “atas apa yang telah dilakukannya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Siapa
  rationale: Kata ganti tanya ini memperkenalkan pertanyaan retoris. Walaupun jawaban tersiratnya adalah ‘tidak seorang pun’, bentuk pertanyaan Ibrani dipertahankan.
- source_word: יַגִּיד
  choice: menyatakan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. ‘Menyatakan’ sesuai dengan tindakan mengemukakan sesuatu secara terus terang.
- source_word: עַל־פָּנָיו
  choice: di hadapannya
  rationale: Ungkapan yang secara harfiah berarti ‘di atas wajahnya’ menunjuk pada penyampaian langsung di depan orang yang bersangkutan.
- source_word: דַּרְכּוֹ
  choice: jalan hidupnya
  rationale: דֶּרֶךְ dapat berarti jalan secara harfiah maupun perilaku atau cara hidup. ‘Jalan hidup’ mempertahankan metafora Ibrani sekaligus menjelaskan makna kiasannya.
- source_word: וְהוּא עָשָׂה
  choice: atas apa yang telah dilakukannya
  rationale: Bahasa Ibrani di sini ringkas dan eliptis, secara harfiah ‘dan ia telah melakukan’. Dalam konteks pembalasan, frasa ini paling wajar dipahami sebagai dasar pemberian balasan.
- source_word: יְשַׁלֶּם לוֹ
  choice: memberikan balasan kepadanya
  rationale: Bentuk Piel dari שלם di sini berarti membayar kembali atau memberikan ganjaran setimpal. Pilihan ini mempertahankan nuansa pembalasan tanpa menentukan secara berlebihan bentuk hukumannya.
