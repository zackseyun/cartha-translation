translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua pertanyaan retoris serta kata penghubung ‘Dan’ dipertahankan. ‘Jalan hidup’ menjaga metafora sumber, sedangkan ‘memberikan balasan’ menyampaikan daya retributif tanpa menambahkan pelaku atau bentuk hukuman yang tidak disebutkan.
