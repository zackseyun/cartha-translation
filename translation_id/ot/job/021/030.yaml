source:
  edition: WLC
  text: כִּ֤י לְ/י֣וֹם אֵ֭יד יֵחָ֣שֶׂךְ רָ֑ע לְ/י֖וֹם עֲבָר֣וֹת יוּבָֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: id
  text: Sebab orang jahat disimpan untuk hari malapetaka[a]; mereka dibawa ke hari kemurkaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ditahan untuk hari malapetaka" atau "diluputkan dari hari malapetaka." Kata kerja Ibrani dapat berarti disimpan, ditahan, atau diluputkan.
    reason: lexical_alternative
  - marker: b
    text: Atau "digiring ke hari kemurkaan" atau "dibawa keluar untuk hari kemurkaan." Kata kerja terakhir dapat dipahami sebagai dibawa atau digiring ke hari itu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan argumentatif dalam konteks.
- source_word: לְיוֹם אֵיד
  choice: untuk hari malapetaka
  rationale: Preposisi לְ menunjuk pada hari mendatang, sedangkan אֵיד berarti malapetaka, bencana, atau kehancuran. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan arah temporalnya.
- source_word: יֵחָשֶׂךְ
  choice: disisakan
  rationale: Bentuk nifal dari חשׂך dapat berarti dibiarkan luput, ditahan, atau disimpan. 'Disisakan' mempertahankan kemungkinan bahwa orang jahat tidak segera terkena hukuman tetapi tetap ada untuk hari yang akan datang, tanpa sepenuhnya menutup ambiguitas leksikalnya.
- source_word: רָע
  choice: orang jahat
  rationale: Adjektiva tunggal ini dipakai secara substantival untuk seorang yang jahat. 'Orang jahat' alami, bersifat representatif, dan mempertahankan bentuk tunggal tanpa menjadikannya sebutan metafisik 'si Jahat'.
- source_word: לְיוֹם עֲבָרוֹת
  choice: menuju hari kemurkaan
  rationale: עֲבָרוֹת adalah bentuk jamak yang berkaitan dengan amarah atau kemurkaan dan kemungkinan berfungsi intensif. 'Hari kemurkaan' menyampaikan daya ungkap serta nuansa penghakimannya secara wajar.
- source_word: יוּבָלוּ
  choice: mereka dibawa
  rationale: Bentuk hofal jamak dari יבל berarti dibawa, digiring, atau diangkut. 'Mereka dibawa' mempertahankan bentuk pasif dan peralihan dari subjek tunggal ke jamak tanpa menentukan secara berlebihan cara atau tujuan pembawaannya.
theological_decisions:
- issue: Hubungan nasib orang jahat dengan penghakiman ilahi
  choice: Ayat ini menggambarkan orang jahat sebagai disisakan untuk hari malapetaka dan dibawa menuju hari kemurkaan.
  alternative: Orang jahat dijauhkan dari hari malapetaka sehingga sama sekali tidak mengalaminya; atau mereka segera dibawa keluar untuk menghadapi kemurkaan.
  rationale: Dua frasa temporal dengan לְיוֹם paling wajar menunjuk pada penundaan atau penyimpanan bagi penghakiman mendatang, sesuai dengan argumen Ayub bahwa orang jahat sering tidak segera menerima hukuman. Namun, catatan kaki mempertahankan keluasan makna kedua verba dan tidak menghapus ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Paralelisme kedua bagian dipertahankan, termasuk peralihan Ibrani dari 'orang jahat' dalam bentuk tunggal ke 'mereka' dalam bentuk jamak. Istilah 'malapetaka' dan 'kemurkaan' dipilih untuk menjaga bobot puitis dan yudisial teks.
