  source_fidelity: The draft preserves the causal connection (כִּי), the singular-to-plural shift ('orang jahat' / 'mereka'), both temporal phrases, and the passive sense of יוּבָלוּ. However, 'disisakan' commonly suggests something left over in Indonesian and does not clearly convey the Hebrew sense of being spared, withheld, or reserved for a future day.
  naturalness: The register is generally natural and suitably elevated. Replacing 'disisakan' with 'disimpan' gives a clearer, more idiomatic expression for being reserved. 'Ke hari kemurkaan' is more direct than 'menuju hari kemurkaan' and avoids adding a sense of movement in progress.
  terminology: '''Orang jahat,'' ''malapetaka,'' and ''kemurkaan'' are appropriate modern-standard Indonesian renderings and retain the judicial-poetic register. The footnotes should distinguish the lexical alternatives without implying more than the Hebrew permits.'
