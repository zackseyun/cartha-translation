  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: id
  text: Keturunan mereka tetap aman[a] di hadapan mereka, bersama mereka, dan anak cucu mereka ada di depan mata mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “teguh” atau “kokoh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעָם
  choice: keturunan mereka
  rationale: זֶרַע di sini menunjuk secara kolektif pada keturunan. “Keturunan” alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada anak-anak yang masih kecil.
- source_word: נָכוֹן
  choice: berdiri teguh
  rationale: Bentuk ini menyatakan keadaan yang tetap, kukuh, atau aman. “Berdiri teguh” mempertahankan citra dan nuansa statif bahasa Ibrani tanpa terlalu cepat menafsirkannya sebagai kemakmuran materi.
- source_word: לִפְנֵיהֶם
  choice: di hadapan mereka
  rationale: Terjemahan ini mempertahankan ungkapan spasial bahasa Ibrani dan menyiratkan bahwa mereka hidup menyaksikan keberlangsungan keturunannya.
- source_word: עִמָּם
  choice: bersama mereka
  rationale: עִם secara langsung berarti “bersama/dengan”. Ungkapan ini menegaskan bahwa keturunan itu tetap hadir bersama mereka.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: dan anak cucu mereka
  rationale: צֶאֱצָאִים berarti keturunan atau generasi penerus. “Anak cucu” jelas dan alami, sekaligus membedakannya dari istilah kolektif זֶרַע pada bagian pertama.
- source_word: לְעֵינֵיהֶם
  choice: di depan mata mereka
  rationale: Ungkapan harfiah ini menyatakan pengamatan langsung dan mempertahankan kesejajaran dengan “di hadapan mereka”.
