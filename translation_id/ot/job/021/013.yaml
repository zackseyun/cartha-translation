  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: id
  text: Mereka menghabiskan hari-hari mereka dalam kemakmuran, dan dalam sekejap mereka turun ke Syeol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur”, “dunia orang mati”, atau “kematian”. Kata Ibraninya adalah Syeol.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַלּוּ
  choice: menghabiskan
  rationale: Bentuk Piel dari בלה di sini menggambarkan hari-hari yang dijalani sampai habis. “Menghabiskan hari-hari mereka” alami dalam bahasa Indonesia dan mempertahankan gagasan temporalnya.
- source_word: בַטּוֹב
  choice: dalam kemakmuran
  rationale: טוֹב secara harfiah berarti “kebaikan/hal yang baik,” tetapi dalam konteks kehidupan nyaman orang fasik menunjuk pada keadaan sejahtera atau makmur.
- source_word: יְמֵיהֶם
  choice: hari-hari mereka
  rationale: Padanan langsung yang mempertahankan ungkapan temporal bahasa Ibrani.
- source_word: וּבְרֶגַע
  choice: lalu dalam sekejap
  rationale: רֶגַע berarti saat yang sangat singkat. “Dalam sekejap” menonjolkan kontras antara seluruh masa hidup dalam kemakmuran dan cepatnya mereka turun ke Syeol; “lalu” menyatakan urutan tanpa menambahkan hubungan sebab-akibat.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan keluasan konsep Ibrani dan tidak mempersempitnya menjadi kubur, kematian, atau neraka. Ejaan “Syeol” mudah dibaca oleh pembaca Indonesia.
- source_word: יֵחָתּוּ
  choice: turun
  rationale: Dalam kaitannya dengan שְׁאוֹל, verba ini paling wajar dipahami sebagai gerak turun menuju alam orang mati. “Turun” ringkas, alami, dan mempertahankan citra spasial sumber.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati; kematian
  rationale: Istilah Ibrani ini menunjuk pada tempat atau ranah orang mati tanpa harus berarti “neraka” dalam pengertian doktrinal yang berkembang kemudian. Transliterasi menjaga keterbukaan konseptual dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Struktur paralel serta kontras antara umur yang dijalani dalam kemakmuran dan turunnya mereka dalam sekejap dipertahankan. Penanda catatan kaki ditempatkan sesudah “Syeol”, istilah yang dijelaskan oleh catatan tersebut.
