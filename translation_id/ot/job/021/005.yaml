  text: פְּנוּ אֵלַ֥/י וְ/הָשַׁ֑מּוּ וְ/שִׂ֖ימוּ יָ֣ד עַל פֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/005.yaml
  text: Turn to me and be appalled[a], and put your hand over your mouth.
translation:
  language: id
  text: Berpalinglah kepadaku dan tertegunlah[a]; tutuplah mulutmu dengan tanganmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tercenganglah” atau “ngeri.” Kata Ibrani ini menggambarkan reaksi orang yang terpukul oleh sesuatu yang mengejutkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Berpalinglah kepadaku
  rationale: Imperatif jamak dari פנה dengan אֶל menyatakan gerak atau perhatian yang diarahkan kepada pembicara. Pilihan ini mempertahankan seruan langsung dan mendesak dari teks Ibrani.
- source_word: וְהָשַׁמּוּ
  choice: dan tertegunlah
  rationale: Bentuk imperatif jamak Hifil dari שׁמם dapat menyatakan reaksi terpukul, tercengang, atau ngeri. 'Tertegunlah' secara alami menyampaikan keadaan terpukul oleh keterkejutan tanpa membatasi maknanya hanya pada rasa takut atau jijik.
- source_word: וְשִׂימוּ יָד עַל־פֶּה
  choice: tutuplah mulutmu dengan tanganmu
  rationale: Secara harfiah, frasa ini berarti menaruh tangan pada/di atas mulut. Terjemahan idiomatis ini mempertahankan gambaran tindakan menahan diri untuk tidak berbicara; kepemilikan tangan dan mulut tersirat oleh imperatif jamak dan dinyatakan secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak pada kata-kata perintah Ibrani tidak tampak secara morfologis dalam bahasa Indonesia, tetapi dipahami dari konteks bahwa Ayub sedang menyapa para sahabatnya. Tanda titik koma mempertahankan kaitan erat antara reaksi tertegun dan gerakan menutup mulut.
