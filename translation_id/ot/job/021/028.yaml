base_translation:
  language: en
  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: id
  text: Sebab kamu berkata, “Di manakah rumah bangsawan itu, dan di manakah kemah[a], tempat kediaman orang-orang fasik?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani di sini padat: “kemah, tempat-tempat kediaman orang-orang fasik.” Frasa itu dapat berarti “kemah tempat orang-orang fasik berdiam” atau menjelaskan bahwa kemah tersebut adalah tempat kediaman mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan pertanyaan yang dikutip dengan argumen Ayub sebelumnya dan mempertahankan daya penjelas konjungsi tersebut.
- source_word: תֹאמְרוּ
  choice: kamu berkata
  rationale: Bentuk imperfek di sini secara kontekstual menyatakan perkataan khas atau yang sedang dikemukakan oleh para lawan bicara Ayub; bentuk kini alami dalam bahasa Indonesia.
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Mempertahankan daya interogatif dengan bentuk baku dan bermartabat yang tetap mudah dipahami.
- source_word: בֵית
  choice: rumah
  rationale: Mempertahankan arti dasar dan citra Ibrani tanpa mempersempitnya menjadi istana atau memperluasnya menjadi keluarga.
- source_word: נָדִיב
  choice: bangsawan
  rationale: Dalam konteks ini menunjuk pada orang yang berkedudukan tinggi atau terkemuka, bukan terutama pada sifat murah hati.
- source_word: אֹהֶל
  choice: kemah
  rationale: Mempertahankan arti biasa dan citra konkret dari kata Ibrani, sekalipun dapat merujuk secara kiasan pada tempat tinggal.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: tempat kediaman orang-orang fasik
  rationale: Menghasilkan bahasa Indonesia alami sambil mempertahankan hubungan frasa dengan 'kemah'; bentuk Ibrani yang padat memungkinkan frasa ini menjelaskan kemah tersebut.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Menyatakan kelompok manusia yang berlaku jahat sebagai kategori moral, dengan padanan Alkitabiah Indonesia yang tetap lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kata “bangsawan” dipilih untuk נָדִיב agar makna status sosialnya jelas tanpa mengartikannya sebagai sifat murah hati. Kejamakan gramatikal מִשְׁכְּנוֹת dijelaskan dalam catatan karena terjemahan utama memakai ungkapan kolektif Indonesia yang lebih alami, “tempat kediaman”.
