  yaml_path: translation/ot/job/021/029.yaml
  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: id
  text: Bukankah kalian sudah bertanya kepada orang-orang yang menempuh perjalanan[a]? Tidakkah kalian mengenali tanda-tanda mereka[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para musafir” atau “orang-orang yang melintasi jalan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “penanda-penanda mereka” atau “bukti-bukti mereka”; frasa ini mungkin menunjuk pada bukti atau petunjuk yang diketahui dari pengalaman para musafir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan sekaligus nada teguran.
- source_word: שְׁאֶלְתֶּם
  choice: kalian sudah bertanya kepada
  rationale: Bentuk orang kedua jamak dinyatakan dengan 'kalian'; 'bertanya kepada' merupakan ungkapan Indonesia yang alami untuk tindakan meminta keterangan dari seseorang.
- source_word: עֹבְרֵי דָרֶךְ
  choice: orang-orang yang menempuh perjalanan
  rationale: Menyampaikan arti harfiah orang-orang yang melintasi jalan, yaitu para musafir atau pelintas, dalam bahasa Indonesia modern dan wajar.
- source_word: וְאֹתֹתָם
  choice: tanda-tanda mereka
  rationale: Mempertahankan arti dasar אוֹת sebagai 'tanda' tanpa mempersempitnya menjadi kesaksian atau laporan; konteksnya dapat menunjuk pada bukti atau petunjuk yang mereka ketahui.
- source_word: לֹא תְנַכֵּרוּ
  choice: Tidakkah kalian mengenali
  rationale: Mencerminkan kemungkinan utama piel נכר, yakni mengenali atau mengakui, serta mempertahankan bentuk pertanyaan retoris.
theological_decisions:
- issue: Rujukan frasa 'tanda-tanda mereka' tidak sepenuhnya jelas
  choice: Mempertahankan frasa literal 'tanda-tanda mereka'
  alternative: bukti yang mereka kemukakan / kesaksian mereka
  rationale: Teks Ibrani memakai kata umum untuk tanda atau penanda. Terjemahan tidak mengunci apakah yang dimaksud ialah bukti, petunjuk, tanda pengenal, atau laporan para musafir.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat. 'Kalian' menyatakan orang kedua jamak dalam teks Ibrani dan sesuai dengan teguran Ayub kepada para sahabatnya. Dua pertanyaan dipisahkan agar alurnya jelas tanpa menghilangkan kesejajaran sumber.
