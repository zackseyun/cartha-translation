  text: הֶ֭/אָנֹכִי לְ/אָדָ֣ם שִׂיחִ֑/י וְ/אִם מַ֝דּ֗וּעַ לֹא תִקְצַ֥ר רוּחִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: id
  text: Apakah keluhanku ditujukan kepada manusia? Jika tidak, mengapa aku tidak kehilangan kesabaran?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂיחִי
  choice: keluhanku
  rationale: Dalam konteks jawaban Ayub, kata ini menunjuk pada keluhan atau pengaduannya, bukan sekadar percakapan.
- source_word: לְאָדָם
  choice: tertuju kepada manusia
  rationale: Preposisi לְ menyatakan arah atau sasaran keluhan; frasa ini mempertahankan pertanyaan retoris dalam bahasa Indonesia yang alami.
- source_word: תִקְצַר רוּחִי
  choice: aku ... menjadi tidak sabar
  rationale: Idiom harfiahnya menggambarkan 'roh/napas menjadi pendek' dan secara kontekstual berarti kehilangan kesabaran atau menjadi tidak sabar.
theological_decisions:
- issue: Sasaran keluhan Ayub
  choice: Mempertahankan pertanyaan bahwa keluhannya bukan tertuju kepada manusia
  alternative: Menafsirkan secara eksplisit bahwa keluhannya tertuju kepada Allah
  rationale: Teks Ibrani hanya menyatakan pertanyaan retoris mengenai manusia; sasaran implisitnya tidak dieksplisitkan agar ketegangan teologis tetap terpelihara.
- issue: Hubungan וְאִם dengan pertanyaan berikutnya
  choice: Jika tidak
  alternative: Dan jika demikian / dan mengapa
  rationale: Ungkapan eliptis ini dipahami sebagai 'jika [keluhanku] tidak [tertuju kepada manusia]', selaras dengan konteks dan tetap mengakui bentuk ringkas sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Subjek 'aku' digunakan dalam klausa kedua agar idiom Ibrani dapat disampaikan secara alami tanpa mengubah maknanya.
