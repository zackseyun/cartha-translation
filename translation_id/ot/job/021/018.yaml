  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: id
  text: Biarlah mereka seperti jerami di hadapan angin, dan seperti sekam yang dibawa pergi oleh badai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang dicuri badai”; dapat juga diterjemahkan “yang direnggut badai.” Kata kerja Ibraninya berarti “mencuri” dan di sini dipakai secara puitis untuk menggambarkan penyingkiran yang mendadak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Biarlah mereka
  rationale: Bentuk imperfek היה di sini memiliki nuansa modal atau harapan dalam rangkaian retoris perkataan Ayub. “Biarlah mereka” mempertahankan nuansa itu tanpa mengubahnya menjadi pernyataan fakta biasa.
- source_word: כְּתֶבֶן
  choice: seperti jerami
  rationale: תבן menunjuk pada jerami atau sisa batang kering sesudah panen; “jerami” merupakan padanan Indonesia yang tepat dan mudah dipahami.
- source_word: לִפְנֵי רוּחַ
  choice: di hadapan angin
  rationale: Ungkapan ini menggambarkan jerami yang tidak berdaya menghadapi angin dan terdorong olehnya. Terjemahan ini mempertahankan citra serta susunan puitis Ibrani.
- source_word: וּכְמֹץ
  choice: dan seperti sekam
  rationale: מֹץ adalah bagian ringan yang terpisah dari bulir ketika ditampi. “Sekam” merupakan padanan lazim dalam citra puitis Alkitab tentang sesuatu yang mudah diterbangkan.
- source_word: גְּנָבַתּוּ
  choice: yang dibawa pergi
  rationale: Kata kerja גנב secara harfiah berarti “mencuri,” tetapi dengan badai sebagai pelaku, ungkapan puitis ini menyatakan penyingkiran yang mendadak. “Dibawa pergi” terdengar alami dalam bahasa Indonesia, sementara arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: סוּפָה
  choice: oleh badai
  rationale: סוּפָה menunjuk pada badai atau angin ribut. “Badai” jelas, alami, dan tidak mempersempit artinya menjadi jenis angin tertentu.
theological_decisions: []
