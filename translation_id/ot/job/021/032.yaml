  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֭/הוּא לִ/קְבָר֣וֹת יוּבָ֑ל וְֽ/עַל גָּדִ֥ישׁ יִשְׁקֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: id
  text: Namun, ia dibawa ke pekuburan[c], dan di atas gundukan[b] itu ada yang berjaga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan ia berjaga di atas gundukan itu,” jika orang yang dikuburkan dipahami sebagai subjek kata kerja; bahasa Ibrani tidak menyebutkan subjeknya secara eksplisit.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “gundukan” berarti timbunan atau tumpukan; di sini kemungkinan besar yang dimaksud ialah tanah yang menggunduk di atas kubur.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, bahasa Ibrani memakai bentuk jamak, “kubur-kubur”; bentuk itu mungkin menunjuk secara kolektif kepada kawasan pekuburan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Namun, ia
  rationale: Kata sambung וְ pada konteks ini bernuansa pertentangan dengan uraian sebelumnya, sehingga “Namun” wajar tanpa menghilangkan pronomina yang dinyatakan dalam bahasa Ibrani.
- source_word: לִקְבָרוֹת
  choice: ke pekuburan
  rationale: Bentuk Ibraninya jamak, tetapi “pekuburan” secara alami dapat menunjuk kawasan yang berisi banyak kubur sekaligus mempertahankan pengertian kolektifnya.
- source_word: יוּבָל
  choice: dibawa
  rationale: Bentuk Hofal dari יבל menyatakan bahwa orang itu dibawa atau diusung; dalam konteks pemakaman, “dibawa” jelas dan alami.
- source_word: וְעַל
  choice: dan di atas
  rationale: Menerjemahkan hubungan spasial עַל secara langsung dan sesuai dengan gambaran penjagaan pada gundukan kubur.
- source_word: גָּדִישׁ
  choice: gundukan
  rationale: גָּדִישׁ berarti timbunan atau tumpukan; dalam konteks ini kemungkinan besar merujuk pada tanah yang menggunduk di atas kubur.
- source_word: יִשְׁקֹד
  choice: ada yang berjaga
  rationale: Kata kerja ini berarti berjaga atau tetap waspada. Ungkapan tak tentu “ada yang” mempertahankan tindakan aktif tanpa menetapkan siapa subjeknya, yang tidak disebutkan secara eksplisit dalam baris Ibrani ini.
theological_decisions:
- issue: Subjek kata kerja יִשְׁקֹד
  choice: Teks utama memakai ungkapan tak tentu “ada yang berjaga”.
  alternative: “Ia berjaga di atas gundukan itu.”
  rationale: Bentuk verba adalah maskulin tunggal dan secara tata bahasa dapat merujuk kembali kepada orang yang dikuburkan, tetapi subjeknya tidak dinyatakan secara eksplisit. Terjemahan utama tidak memaksakan identitas subjek, sedangkan kemungkinan lainnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan ringkas. “Pekuburan” dipilih agar bentuk jamak Ibrani terwakili secara kolektif dan tetap alami. “Ada yang berjaga” menjaga ketidakjelasan subjek tanpa membuat kalimat kaku.
