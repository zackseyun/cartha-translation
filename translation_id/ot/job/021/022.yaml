base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: id
  text: Dapatkah seseorang mengajarkan pengetahuan kepada Allah, karena Dialah yang menghakimi mereka yang di atas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang ditinggikan”; mungkin “makhluk-makhluk surgawi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: kepada Allah
  rationale: Gabungan partikel tanya הֲ dan לְאֵל membentuk pertanyaan retoris. Bahasa Indonesia yang wajar memerlukan subjek tak tentu, yaitu “seseorang,” sedangkan לְאֵל diterjemahkan “kepada Allah.”
- source_word: יְלַמֶּד
  choice: mengajarkan
  rationale: Bentuk Piel dari למד berarti “mengajar” atau “memberi pengajaran.” “Mengajarkan” sesuai dengan objek abstrak דָּעַת dan menghasilkan ungkapan Indonesia yang alami.
- source_word: דָּעַת
  choice: pengetahuan
  rationale: Nomina ini berarti “pengetahuan” atau “pengertian.” “Pengetahuan” mempertahankan bentuk abstrak dan hubungan langsung dengan verba “mengajarkan.”
- source_word: וְהוּא
  choice: padahal Dia
  rationale: Secara harfiah berarti “dan Dia,” tetapi dalam konteks klausa kedua menegaskan alasan mengapa pertanyaan pertama mengharapkan jawaban negatif. “Padahal Dia” menyampaikan hubungan retoris itu tanpa mengubah isi pernyataan.
- source_word: רָמִים
  choice: mereka yang di tempat tinggi
  rationale: Bentuk jamak substantival dari רום dapat menunjuk kepada pribadi-pribadi yang tinggi atau ditinggikan, termasuk kemungkinan makhluk surgawi. Ungkapan ini mempertahankan keluasan rujukannya dan tidak membatasinya pada penguasa duniawi ataupun makhluk surgawi.
- source_word: יִשְׁפּוֹט
  choice: menghakimi
  rationale: Bentuk Qal dari שפט secara langsung berarti “menghakimi.” Pilihan ini mempertahankan penekanan pada wewenang Allah untuk menjatuhkan penghakiman.
theological_decisions:
- issue: Rujukan רָמִים
  choice: mereka yang di tempat tinggi
  alternative: orang-orang yang ditinggikan; makhluk-makhluk surgawi
  rationale: Teks Ibrani tidak memastikan apakah yang dimaksud ialah para penguasa atau orang berkedudukan tinggi di bumi, atau makhluk-makhluk surgawi. Terjemahan utama mempertahankan ketidakpastian tersebut, sementara catatan kaki menyebutkan kemungkinan-kemungkinannya tanpa menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan pertanyaan dibuat alami bagi pembaca umum, sedangkan istilah “menghakimi” dan frasa “mereka yang di tempat tinggi” mempertahankan bobot serta ambiguitas teks sumber.
