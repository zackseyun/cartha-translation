  text: For what does he care about his house after him[c][b][a], when the number of his months is cut off?
translation:
  language: id
  text: Sebab, apa lagi yang dipedulikannya tentang rumahnya[a] sesudah ia tiada[b], ketika jumlah bulan hidupnya telah dipotong?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumahnya”; kata ini juga dapat berarti seisi rumah atau keluarganya. Frasa sebelumnya juga dapat diterjemahkan, “apa kesenangannya dalam rumahnya?”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sesudah dia.”
    reason: literal_rendering
  - marker: c
    text: Atau, “telah ditentukan” atau “telah dibagikan baginya.” Kata Ibrani ini dapat menggambarkan jangka hidup yang dipotong, dibatasi, atau ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang mendukung argumen sebelumnya; “Sebab” mempertahankan hubungan wacananya.
- source_word: מַה חֶפְצוֹ
  choice: apa pedulinya
  rationale: Ungkapan retoris ini secara harfiah berkaitan dengan kesenangan, kehendak, atau kepentingan seseorang. “Apa pedulinya” menyampaikan maksud bahwa orang itu tidak lagi memiliki perhatian terhadap apa yang ditinggalkannya.
- source_word: בְּבֵיתוֹ
  choice: terhadap rumah tangganya
  rationale: בַּיִת dapat menunjuk pada rumah, seisi rumah, atau keluarga. Dalam konteks kepedulian seseorang terhadap mereka yang ditinggalkannya, “rumah tangga” terdengar alami sekaligus mempertahankan keluasan maknanya.
- source_word: אַחֲרָיו
  choice: setelah ia tiada
  rationale: Secara harfiah berarti “sesudah dia”; dalam konteks ini, ungkapan itu menunjuk pada masa sesudah hidupnya berakhir. Pilihan ini alami dalam bahasa Indonesia tanpa menentukan rincian tentang keadaan sesudah kematian.
- source_word: וּמִסְפַּר חֳדָשָׁיו
  choice: ketika jumlah bulan hidupnya
  rationale: Waw dipahami menghubungkan klausa secara temporal sesuai alur retoris. “Bulan” dipertahankan sebagai gambaran konkret bagi jangka hidup.
- source_word: חֻצָּצוּ
  choice: telah berakhir
  rationale: Bentuk pasif ini dapat dipahami sebagai dipotong atau dibatasi. Dalam konteks berakhirnya umur, “telah berakhir” menyampaikan akibatnya secara wajar; kemungkinan makna “ditentukan” tetap dicatat.
theological_decisions:
- issue: Makna rumah orang fasik sesudah kematiannya
  choice: Teks menyatakan secara retoris bahwa setelah ia tiada, ia tidak lagi peduli terhadap rumah tangganya.
  alternative: Ayat ini dapat dibaca lebih harfiah sebagai pertanyaan tentang kesenangan yang masih dimilikinya dalam rumahnya sesudah dia.
  rationale: Terjemahan tidak menyimpulkan keadaan sadar atau tidak sadar sesudah kematian; fokusnya tetap pada putusnya kepentingan orang itu terhadap kehidupan rumah tangganya ketika jangka hidupnya selesai.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pertanyaan retoris dipertahankan. “Rumah tangga” dipilih agar makna sosial-keluargaan בַּיִת terbaca alami, sedangkan arti harfiahnya dicatat. Ambiguitas חֻצָּצוּ antara berakhir/dipotong dan ditentukan/dibagikan dipertahankan melalui catatan kaki.
