  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַה שַׁדַּ֥י כִּֽי נַֽעַבְדֶ֑/נּוּ וּ/מַה נּ֝וֹעִ֗יל כִּ֣י נִפְגַּע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: id
  text: Apakah Yang Mahakuasa itu sehingga kita harus mengabdi kepada-Nya? Apa keuntungan yang kita peroleh jika kita memohon kepada-Nya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: Apakah ... itu
  rationale: Kata tanya ini secara harfiah berarti “apa”, bukan “siapa”. Dalam konteks ini bentuk tersebut menyampaikan pertanyaan retoris yang meremehkan arti atau nilai Yang Mahakuasa tanpa mengubahnya menjadi pertanyaan tentang identitas.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi ini diterjemahkan agar maknanya jelas bagi pembaca Indonesia modern, alih-alih ditransliterasikan sebagai “Shaddai”.
- source_word: נַעַבְדֶנּוּ
  choice: kita harus mengabdi kepada-Nya
  rationale: Kata עבד ketika objeknya Allah mencakup pelayanan, kesetiaan, dan ibadah. “Mengabdi” mempertahankan cakupan luas itu dan terdengar wajar dalam pertanyaan ini.
- source_word: וּמַה נּוֹעִיל
  choice: Apa keuntungan yang kita peroleh
  rationale: Bentuk hiphil יעל menyatakan mendapat manfaat atau keuntungan. Ungkapan ini mempertahankan sudut pandang pragmatis orang fasik dalam konteksnya.
- source_word: כִּי נִפְגַּע בּוֹ
  choice: jika kita memohon kepada-Nya
  rationale: Dalam konstruksi dengan ב, פגע dapat berarti mengajukan permohonan atau memohon kepada seseorang. “Memohon kepada-Nya” jelas, alami, dan sesuai dengan konteks doa.
theological_decisions:
- issue: Penerjemahan gelar ilahi שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Shaddai
  rationale: Bentuk ini dipahami sebagai gelar ilahi, sehingga diterjemahkan untuk menyampaikan maknanya secara langsung tanpa menambahkan penafsiran denominasi tertentu.
- issue: Daya retoris מַה pada awal ayat
  choice: Apakah Yang Mahakuasa itu
  alternative: Siapakah Yang Mahakuasa
  rationale: Mempertahankan unsur “apa” mencerminkan nada meremehkan dalam pertanyaan tokoh-tokoh fasik; “siapakah” dapat menggesernya menjadi pertanyaan biasa tentang identitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi serta bentuk pronomina “-Nya” mengikuti kebiasaan umum ketika merujuk kepada Allah. Paralelisme dua pertanyaan retoris dipertahankan.
