  yaml_path: translation/ot/job/021/002.yaml
  text: Listen carefully to my words[a], and let this be your consolation.
translation:
  language: id
  text: Dengarkanlah baik-baik perkataanku, dan biarlah itu menjadi penghiburan kalian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penghiburan-penghiburan kalian”; bentuk Ibraninya jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Dengarkanlah baik-baik
  rationale: Infinitif absolut yang mengikuti imperatif seakar menguatkan seruan. Bahasa Indonesia alami menyatakan penekanan ini dengan “baik-baik”.
- source_word: מִלָּתִי
  choice: perkataanku
  rationale: Nomina tunggal dengan sufiks orang pertama tunggal menunjuk pada ucapan atau tuturan Ayub. “Perkataanku” alami dalam konteks ini dan tidak harus berarti hanya satu kata.
- source_word: וּתְהִי
  choice: dan biarlah ...
  rationale: Bentuk yusif dari היה menyampaikan permintaan atau kehendak; “biarlah” mempertahankan nuansa volitif tersebut.
- source_word: זֹאת
  choice: itulah
  rationale: Kata tunjuk ini kemungkinan menunjuk pada tindakan para sahabat mendengarkan Ayub; “itulah” menjaga ungkapan ringkas dan hubungan rujukannya.
- source_word: תַּנְחֻמוֹתֵיכֶם
  choice: penghiburan kalian
  rationale: Bentuk Ibrani adalah jamak dengan sufiks orang kedua jamak, tetapi dalam bahasa Indonesia nomina abstrak tunggal lebih alami. “Kalian” mempertahankan sapaan jamak secara jelas.
theological_decisions:
- issue: Kemungkinan nada ironis dalam “penghiburan kalian”
  choice: Tidak mengeksplisitkan ironi dalam teks utama
  alternative: “sebagai ganti segala penghiburan kalian” atau rumusan yang secara terang menyindir
  rationale: Teks Ibrani dapat mengandung sindiran bahwa mendengarkan adalah satu-satunya penghiburan yang dapat mereka berikan, tetapi ironi itu tidak dinyatakan secara gramatikal dan sebaiknya tetap tersirat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Partikel “-lah” mempertahankan nada permohonan yang sungguh-sungguh; “kalian” dipakai untuk menandai bahwa Ayub menyapa lebih dari satu orang.
