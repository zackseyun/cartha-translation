source:
  edition: WLC
  text: מַדּ֣וּעַ רְשָׁעִ֣ים יִחְי֑וּ עָ֝תְק֗וּ גַּם גָּ֥בְרוּ חָֽיִל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: id
  text: Mengapa orang-orang fasik terus hidup, menjadi tua, bahkan bertambah kuat dan kaya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bahkan bertambah besar kekuatannya.” Kata Ibrani חָיִל dapat berarti kekayaan, sumber daya, kekuatan, atau kuasa militer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini membuka protes Ayub secara langsung; “Mengapa” mempertahankan daya retorisnya tanpa tambahan penjelasan.
- source_word: רְשָׁעִים
  choice: orang-orang fasik
  rationale: Padanan baku dalam sastra hikmat bagi orang yang secara moral jahat, bukan sekadar orang yang dinyatakan bersalah secara hukum.
- source_word: יִחְיוּ
  choice: terus hidup
  rationale: Bentuk imperfek menyatakan keberlangsungan hidup; “terus hidup” menangkap keluhan bahwa mereka tetap hidup meskipun kejahatan semestinya mendatangkan hukuman.
- source_word: עָתְקוּ
  choice: menjadi tua
  rationale: Dalam rangkaian tentang panjang umur dan kemakmuran orang fasik, ungkapan ini paling mungkin menunjuk pada bertambahnya usia; terjemahan ini alami dan tidak melebihkan makna.
- source_word: גַּם
  choice: bahkan
  rationale: Memberi penekanan yang meningkatkan intensitas rangkaian keadaan orang fasik.
- source_word: גָּבְרוּ
  choice: bertambah kuat
  rationale: Menunjukkan peningkatan kekuatan atau kemampuan; “bertambah” juga selaras dengan perkembangan yang digambarkan oleh kata kerja sebelumnya.
- source_word: חָיִל
  choice: dan kaya
  rationale: חָיִל dapat berarti kekuatan, kemampuan, sumber daya, atau kekayaan. Dalam konteks kemakmuran orang fasik, “kaya” menyampaikan wujud konkret kekuatan mereka, sementara kemungkinan arti lain dipertahankan dalam catatan kaki.
theological_decisions: []
