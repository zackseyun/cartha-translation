  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: id
  text: Namun mereka berkata kepada Allah, “Menjauhlah dari kami[a], dan kami tidak menginginkan pengetahuan tentang jalan-jalan-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berpalinglah dari kami” atau “Pergilah dari kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Namun mereka berkata
  rationale: Bentuk naratif memperkenalkan perkataan mereka; “namun” menyatakan pertentangan kontekstual antara kemakmuran orang fasik dan penolakan mereka terhadap Allah.
- source_word: לָאֵל
  choice: kepada Allah
  rationale: אֵל di sini merupakan sebutan umum bagi Allah, bukan nama diri yang perlu ditransliterasikan.
- source_word: סוּר מִמֶּנּוּ
  choice: Menjauhlah dari kami
  rationale: Imperatif סוּר dengan מִן menyuruh Allah berpaling atau pergi menjauh. Pilihan ini lugas, alami dalam bahasa Indonesia, dan mempertahankan kerasnya penolakan tersebut.
- source_word: וְדַעַת דְּרָכֶיךָ
  choice: dan kami tidak ingin mengenal jalan-jalan-Mu
  rationale: Kata sambung diterjemahkan langsung sebagai “dan”. Ungkapan verbal “mengenal jalan-jalan-Mu” menyampaikan דַּעַת secara alami tanpa menghilangkan gagasan tentang pengetahuan yang bersifat nyata dan pribadi.
- source_word: לֹא חָפָצְנוּ
  choice: kami tidak ingin
  rationale: חפץ menyatakan keinginan atau kesukaan. “Tidak ingin” menonjolkan penolakan yang disengaja tanpa mempersempit maknanya menjadi sekadar perasaan tidak senang.
theological_decisions:
- issue: Perkataan langsung orang fasik kepada Allah
  choice: 'Mempertahankan perintah langsung: “Menjauhlah dari kami”'
  alternative: Parafrasa tidak langsung seperti “Biarkan kami sendiri”
  rationale: Teks Ibrani memuat imperatif yang ditujukan langsung kepada Allah. Bentuk langsung mempertahankan ketegangan dan kerasnya pemberontakan manusia tanpa memperhalusnya.
- issue: Hubungan antara kedua klausa
  choice: Menggunakan “dan”
  alternative: Menggunakan “sebab” untuk menjadikan klausa kedua alasan eksplisit
  rationale: וְ secara langsung mengoordinasikan kedua klausa. “Dan” mempertahankan struktur serta membiarkan hubungan logisnya tetap tersirat sebagaimana dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk “jalan-jalan-Mu” mempertahankan metafora Ibrani bagi cara bertindak atau kehendak Allah; huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
