base_translation:
  language: en
  yaml_path: translation/ot/job/021/024.yaml
  text: His pails are full of milk[a], and the marrow of his bones is well-watered.
translation:
  language: id
  text: Wadah-wadahnya penuh susu[a], dan sumsum tulang-tulangnya dibasahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ambingnya penuh susu.” Istilah Ibrani ini langka dan dapat menunjuk pada ambing atau wadah susu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטִינָיו
  choice: wadah-wadah susunya
  rationale: Nomina ini langka dan maknanya diperdebatkan. Dalam kaitannya dengan susu, istilah ini dapat menunjuk pada wadah susu atau ambing. Pilihan ini mempertahankan gambaran kelimpahan tanpa menganggap bahwa organ hewan secara harfiah dikenakan kepada orang yang sedang digambarkan.
- source_word: מָלְאוּ
  choice: penuh
  rationale: Bentuk perfek di sini menyatakan keadaan makmur dan sehat yang sedang digambarkan; bahasa Indonesia secara alami mengungkapkannya sebagai keadaan kini.
- source_word: חָלָב
  choice: susu
  rationale: Makna leksikal lazim yang dalam konteks ini menggambarkan kelimpahan dan kemakmuran.
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: dan sumsum tulang-tulangnya
  rationale: Terjemahan ini mempertahankan hubungan konstruksi dan gambaran tubuh yang konkret dalam bahasa Ibrani.
- source_word: יְשֻׁקֶּה
  choice: tetap basah
  rationale: Bentuk Pual menggambarkan sumsum yang mendapat kelembapan atau cairan. Ungkapan ini mempertahankan citra jasmani tentang kesehatan dan vitalitas, sedangkan kata 'tetap' menyampaikan keadaan berkelanjutan yang sesuai dengan konteks.
