  yaml_path: translation/ot/job/021/006.yaml
  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: id
  text: Bila aku mengingatnya, aku menjadi gentar, dan tubuhku dicekam rasa ngeri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Bila
  rationale: Dalam konteks ini, אִם menyatakan keadaan yang terjadi ketika Ayub mengingat; “bila” mempertahankan nuansa kondisional-temporal tanpa menegaskan pengulangan seperti “setiap kali”.
- source_word: זָכַרְתִּי
  choice: aku mengingatnya
  rationale: Bentuk perfek orang pertama tunggal berarti “aku mengingat.” Akhiran “-nya” membuat ungkapan alami dalam bahasa Indonesia dan menunjuk pada pokok mengerikan yang sedang direnungkan, tanpa merincinya lebih jauh.
- source_word: נִבְהָלְתִּי
  choice: aku menjadi gentar
  rationale: Kata ini menggambarkan keterkejutan atau ketakutan yang mendalam; “menjadi gentar” sesuai dengan reaksi emosional Ayub dan tetap bermartabat.
- source_word: בְּשָׂרִי
  choice: tubuhku
  rationale: Secara harfiah berarti “dagingku,” tetapi dalam konteks reaksi jasmani, “tubuhku” menyampaikan maksud dengan lebih alami dalam bahasa Indonesia modern.
- source_word: פַּלָּצוּת
  choice: rasa ngeri
  rationale: Nomina ini menunjuk pada kengerian atau rasa gemetar akibat takut; “rasa ngeri” cocok sebagai sesuatu yang mencengkeram tubuh.
theological_decisions: []
