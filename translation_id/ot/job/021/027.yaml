  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: id
  text: Sungguh, aku tahu pikiran kalian dan siasat yang kalian gunakan untuk berlaku tidak adil terhadapku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan siasat yang kalian rancang terhadapku,” atau “dan siasat terhadapku yang kalian lakukan dengan kekerasan.” Verba Ibrani yang dipakai dapat berarti melakukan kekerasan, menindas, atau berbuat tidak adil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Ketahuilah
  rationale: Partikel ini menarik perhatian sekaligus menegaskan pernyataan. “Ketahuilah” terdengar alami dan berwibawa dalam bahasa Indonesia modern.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektif di sini menyatakan pengetahuan yang sudah dimiliki dan tetap berlaku; bentuk kini “aku tahu” paling wajar dalam bahasa Indonesia.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: pikiran kalian
  rationale: Kata benda ini dapat berarti pikiran, rancangan, atau niat. “Pikiran” mempertahankan keluasan makna dan dibedakan dari istilah paralel berikutnya yang lebih bernuansa siasat.
- source_word: וּמְזִמּוֹת
  choice: dan siasat
  rationale: Dalam konteks ini kata tersebut menunjuk pada rancangan yang disengaja dan bermusuhan. “Siasat” menyampaikan nuansa itu tanpa menambahkan kata “jahat” yang tidak dinyatakan secara eksplisit.
- source_word: עָלַי
  choice: untuk mencelakakan aku
  rationale: Preposisi ini dalam hubungannya dengan verba berikut menunjukkan tindakan yang diarahkan terhadap Ayub. Susunan Indonesia ini menyampaikan arah permusuhannya secara idiomatis.
- source_word: תַּחְמֹסוּ
  choice: kalian rancang untuk mencelakakan
  rationale: Verba dari akar חמס berkaitan dengan kekerasan, penindasan, atau perlakuan tidak adil. Dalam konstruksi yang sulit ini, terjemahan tersebut menyampaikan gagasan merancang tindakan yang merugikan Ayub, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti “aku/kalian” sesuai dengan ujaran langsung Ayub kepada beberapa sahabatnya. Ambiguitas konstruksi Ibrani pada klausa terakhir tidak dihapus, tetapi dicatat sebagai alternatif.
