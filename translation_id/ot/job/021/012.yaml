base_translation:
  language: en
  yaml_path: translation/ot/job/021/012.yaml
  text: They sing to the tambourine and lyre, and rejoice at the sound of the flute.
translation:
  language: id
  text: 'Mereka bernyanyi dengan iringan rebana dan kecapi,

    dan bersukacita mendengar bunyi seruling.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: bernyanyi
  rationale: Secara harfiah berarti “mengangkat” dan dapat dipahami secara eliptis sebagai mengangkat suara atau mulai bernyanyi. Dalam konteks alat musik dan sukacita, “bernyanyi” menyampaikan maksudnya secara alami tanpa menambahkan objek “suara” yang tidak tertulis.
- source_word: תֹף
  choice: rebana
  rationale: Menunjuk alat perkusi genggam berbingkai, sejenis tamborin; “rebana” merupakan padanan Indonesia yang umum dan mudah dipahami.
- source_word: כִּנּוֹר
  choice: kecapi
  rationale: Alat musik petik kuno yang biasanya berupa lira; “kecapi” adalah padanan tradisional dan alami dalam bahasa Indonesia, meski tidak menyatakan bentuk instrumen secara persis.
- source_word: עוּגָב
  choice: seruling
  rationale: Identitas instrumen kuno ini tidak sepenuhnya pasti, tetapi konteks dan pemakaian tradisional menunjuk alat musik tiup; “seruling” mempertahankan pengertian umum itu.
- source_word: לְקוֹל
  choice: mendengar bunyi
  rationale: Secara formal berarti “pada/menurut bunyi.” Dalam ungkapan Indonesia, “bersukacita mendengar bunyi” menyatakan hubungan respons terhadap suara secara alami.
