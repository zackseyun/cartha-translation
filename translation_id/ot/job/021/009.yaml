base_translation:
  language: en
  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: id
  text: Rumah-rumah mereka[a] aman dari rasa takut, dan tongkat Allah tidak menimpa mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Rumah tangga mereka tenteram, bebas dari rasa takut.”
    reason: lexical_alternative
  - marker: b
    text: “Tongkat Allah” adalah kiasan yang dapat menunjuk pada pukulan, didikan, atau penderitaan dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: rumah-rumah mereka
  rationale: Bentuk jamak konstruksi dari בַּיִת secara konkret berarti rumah-rumah mereka. Dalam konteks, maknanya dapat meluas kepada rumah tangga mereka, tetapi bentuk konkret mempertahankan gambaran Ibrani.
- source_word: שָׁלוֹם
  choice: aman
  rationale: Di sini שָׁלוֹם menyatakan keadaan sejahtera dan terlindung dari bahaya. Kata “aman” alami dalam bahasa Indonesia dan sesuai dengan frasa berikutnya, “dari ketakutan”.
- source_word: מִפָּחַד
  choice: dari ketakutan
  rationale: Kata depan מִן menyatakan keterpisahan atau kebebasan dari פַּחַד, yakni ketakutan atau kedahsyatan. Terjemahan ini dekat dengan bentuk sumber tanpa menghilangkan nuansa emosionalnya.
- source_word: שֵׁבֶט
  choice: gada
  rationale: שֵׁבֶט dapat berarti tongkat, gada, atau lambang kekuasaan. Dalam ungkapan tentang tindakan Allah yang datang atas manusia, “gada” mempertahankan metafora alat pemukul tanpa langsung menafsirkannya sebagai hukuman, didikan, atau penderitaan tertentu.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: אֱלוֹהַּ adalah bentuk tunggal puitis yang umum untuk Allah dalam kitab Ayub; tidak ada dasar untuk menambahkan gelar lain.
- source_word: עֲלֵיהֶם
  choice: menimpa mereka
  rationale: Secara harfiah berarti “atas mereka”. Bersama gambaran gada, “menimpa mereka” merupakan ungkapan Indonesia yang alami dan tetap menyampaikan bahwa pukulan atau penderitaan ilahi tidak datang atas mereka.
- source_word: וְלֹא
  choice: dan ... tidak
  rationale: Gabungan kata penghubung dan penyangkalan mengoordinasikan klausa kedua dengan klausa pertama. Bentuk ini jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sifat tindakan ilahi yang tersirat dalam ungkapan “gada Allah”
  choice: Mempertahankan metafora “gada Allah” tanpa menentukan satu jenis tindakan ilahi tertentu.
  alternative: hukuman Allah; didikan Allah; cambuk Allah
  rationale: Metafora Ibrani dapat mencakup pukulan, pendisiplinan, atau penderitaan yang berasal dari Allah. Memilih salah satu kategori itu dalam teks utama akan mempersempit ketegangan makna yang dibiarkan terbuka oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secukupnya. “Rumah-rumah” mempertahankan gambaran konkret sumber, sedangkan “menimpa” membuat konstruksi Ibrani yang tanpa verba tetap alami dalam bahasa Indonesia. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
