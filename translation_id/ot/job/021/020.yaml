  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: id
  text: Biarlah matanya sendiri melihat malapetakanya[a][b], dan biarlah ia minum dari murka Yang Mahakuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Matanya akan melihat malapetakanya, dan ia akan minum dari murka Yang Mahakuasa.” Bentuk-bentuk imperfek Ibrani dapat dipahami sebagai ramalan, bukan sebagai harapan atau tuntutan.
    reason: alternative_reading
  - marker: b
    text: “Malapetakanya” juga dapat diterjemahkan “bencananya” atau “kehancurannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: Biarlah ... melihat
  rationale: 'Bentuk imperfek Qal orang ketiga jamak selaras dengan subjek jamak ‘matanya’. Dalam konteks ini, bentuk tersebut paling wajar dipahami sebagai harapan atau tuntutan bernuansa yusif: orang fasik itu sendiri hendaknya menyaksikan hukumannya.'
- source_word: עינ/ו (עֵינָיו)
  choice: matanya sendiri
  rationale: Secara harfiah berarti ‘matanya’. Kata ‘sendiri’ menyampaikan penekanan kontekstual bahwa orang fasik itu, bukan hanya anak-anaknya, harus mengalami akibat perbuatannya.
- source_word: כִּידוֹ
  choice: malapetakanya
  rationale: כִּיד menunjuk pada malapetaka, bencana, atau kehancuran. ‘Malapetaka’ mempertahankan keluasan makna tanpa mengharuskan pengertian pemusnahan total.
- source_word: וּמֵחֲמַת
  choice: dan ... dari murka
  rationale: חֵמָה dapat berarti murka, amarah yang menyala, atau dalam konteks tertentu racun. Bersama verba ‘minum’ dan gelar ilahi, ‘murka’ mempertahankan metafora tentang mengalami penghukuman ilahi; preposisi מִן diterjemahkan ‘dari’.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Padanan baku dan jelas bagi gelar ilahi שַׁדַּי, khususnya dalam kitab Ayub.
- source_word: יִשְׁתֶּה
  choice: biarlah ia minum
  rationale: Bentuk imperfek Qal orang ketiga tunggal dibaca sejajar dengan verba pertama sebagai harapan bernuansa yusif. Verba ‘minum’ dipertahankan agar metafora Ibrani tidak diratakan menjadi sekadar ‘mengalami’.
theological_decisions:
- issue: Daya bentuk-bentuk imperfek dalam ayat ini
  choice: 'Diterjemahkan sebagai harapan atau tuntutan bernuansa yusif: ‘Biarlah ... melihat ... biarlah ia minum’.'
  alternative: 'Dapat dibaca sebagai pernyataan prediktif: ‘Matanya akan melihat ... dan ia akan minum’.'
  rationale: Dalam konteksnya, Ayub menolak anggapan bahwa hukuman yang baru menimpa keturunan orang fasik sudah memadai; ia menuntut agar orang itu sendiri menghadapi akibatnya. Namun, karena bentuk imperfek Ibrani juga memungkinkan pembacaan prediktif, kemungkinan tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan ‘biarlah’ mempertahankan kesejajaran kedua klausa. Ungkapan ‘minum dari murka’ sengaja mempertahankan metafora dan preposisi teks Ibrani meskipun terasa lebih puitis daripada ungkapan sehari-hari.
