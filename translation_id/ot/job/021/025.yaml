  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: id
  text: sedangkan yang lain mati dengan jiwa yang pahit dan tidak menikmati kebaikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan orang ini mati dengan jiwa yang pahit dan tidak makan kebaikan”; bahasa Ibrani mempertahankan gambaran makan untuk mengalami kebaikan dalam hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: sedangkan yang lain
  rationale: Dalam konteks, ungkapan harfiah 'dan yang ini' membandingkan orang ini dengan orang dalam ayat sebelumnya. 'Sedangkan yang lain' menyatakan kontras itu secara alami dalam bahasa Indonesia.
- source_word: יָמוּת
  choice: mati
  rationale: Bentuk ini menggambarkan suatu keadaan umum dalam perbandingan puitis, bukan semata-mata ramalan tentang masa depan.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: dengan jiwa yang pahit
  rationale: Pilihan ini mempertahankan kata נֶפֶשׁ dan citra kepahitan yang menggambarkan keadaan batin orang tersebut.
- source_word: וְ/לֹא אָכַל
  choice: dan tidak pernah menikmati
  rationale: Secara harfiah berarti 'dan tidak makan', tetapi bersama בַּטּוֹבָה ungkapan ini menunjuk pada tidak mengalami atau menikmati kebaikan. 'Tidak pernah' menyampaikan aspek perfektif pengalaman yang sama sekali tidak dialami.
- source_word: בַּ/טּוֹבָה
  choice: apa yang baik
  rationale: Ungkapan ini mempertahankan keluasan makna Ibrani, yang dapat mencakup kebaikan, kesejahteraan, dan kemakmuran, tanpa mempersempitnya hanya pada kekayaan.
