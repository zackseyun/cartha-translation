  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: id
  text: Gumpalan-gumpalan tanah di lembah itu manis baginya.[a] Semua manusia mengikutinya,[b][c] dan mereka yang mendahuluinya tidak terhitung jumlahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Gumpalan-gumpalan tanah di wadi/dasar aliran air itu menyenangkan baginya.” Kata Ibrani נחל dapat berarti lembah, jurang, wadi, atau dasar aliran air.
    reason: lexical_alternative
  - marker: b
    text: Atau, “semua orang mengikutinya”; secara harfiah, “semua adam/manusia.”
    reason: lexical_alternative
  - marker: c
    text: 'Baris ini dapat menggambarkan arak-arakan pemakaman atau perjalanan semua manusia menuju kematian: mereka yang mendahuluinya tidak terhitung jumlahnya, dan semua manusia mengikutinya.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ
  choice: terasa manis
  rationale: Bentuk dari akar מתק menyatakan rasa manis atau sesuatu yang menyenangkan. Ungkapan metaforis “terasa manis” dipertahankan agar gambaran Ibrani tentang tanah kubur yang menyenangkan bagi orang mati tidak diratakan menjadi parafrasa.
- source_word: לּוֹ
  choice: baginya
  rationale: Preposisi dengan sufiks pronominal ini secara alami menyatakan pengalaman atau hubungan orang tersebut dengan gumpalan tanah.
- source_word: רִגְבֵי
  choice: gumpalan-gumpalan tanah
  rationale: רֶגֶב menunjuk pada bongkah atau gumpalan tanah. Pilihan ini konkret, mudah dipahami, dan mempertahankan gambaran penguburan.
- source_word: נָחַל
  choice: lembah
  rationale: נחל dapat berarti lembah, jurang, wadi, atau dasar aliran air. “Lembah” paling alami dalam teks utama bahasa Indonesia, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: וְאַחֲרָיו
  choice: mengikuti dia
  rationale: Secara harfiah frasa ini berarti “di belakang/sesudah dia”; bersama יִמְשׁוֹךְ, terjemahan ini mempertahankan gambaran orang-orang yang bergerak sesudahnya.
- source_word: כָּל אָדָם
  choice: semua manusia
  rationale: אָדָם digunakan secara kolektif dan generik, bukan khusus untuk seorang laki-laki. “Semua manusia” menyampaikan cakupan universal tersebut.
- source_word: יִמְשׁוֹךְ
  choice: mengikuti
  rationale: משך pada dasarnya berarti menarik atau bergerak memanjang, tetapi dalam konstruksi dengan “sesudah dia” menyatakan gerakan mengikuti. Pilihan ini alami tanpa menentukan apakah yang dimaksud khususnya arak-arakan pemakaman atau perjalanan semua manusia menuju kematian.
- source_word: וּלְפָנָיו
  choice: orang-orang yang mendahuluinya
  rationale: Ungkapan ini secara spasial berarti “di depannya” dan secara temporal dapat berarti mereka yang telah lebih dahulu. Terjemahan ini mempertahankan rujukan kepada banyak orang yang sudah berada di depan atau telah mendahuluinya.
- source_word: אֵין מִסְפָּר
  choice: tidak terhitung banyaknya
  rationale: Idiom ini menyatakan jumlah yang tak terbilang. Bentuk Indonesia ini alami dan tetap dekat dengan makna sumber.
theological_decisions:
- issue: Makna gambaran penguburan dan kematian dalam ayat ini
  choice: Teks utama mempertahankan gambaran konkret tentang tanah kubur serta manusia yang mengikuti dan mendahului orang itu.
  alternative: Ayat ini dapat dipahami lebih khusus sebagai arak-arakan pemakaman, atau lebih umum sebagai perjalanan universal umat manusia menuju kematian.
  rationale: Bahasa Ibrani memungkinkan kedua nuansa itu. Terjemahan tidak membatasi ayat hanya pada upacara pemakaman dan juga tidak mengubahnya menjadi pernyataan abstrak semata-mata tentang kefanaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “terasa manis” sengaja dipertahankan meskipun tidak lazim, karena merupakan gambaran penting dalam teks Ibrani. “Gumpalan-gumpalan tanah” dipilih agar konkret dan mudah dipahami; “wadi” ditempatkan dalam catatan kaki karena kurang umum bagi pembaca Indonesia.
