  text: וְ֭/אֵיךְ תְּנַחֲמ֣וּ/נִי הָ֑בֶל וּ֝/תְשֽׁוּבֹתֵי/כֶ֗ם נִשְׁאַר מָֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: id
  text: Jadi, bagaimana mungkin kalian menghibur aku dengan kesia-siaan[a], sedangkan jawaban-jawaban kalian tetap merupakan pengkhianatan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan kehampaan”; mungkin juga: “dengan sia-sia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Jadi, bagaimana mungkin
  rationale: Kata tanya אֵיךְ menyatakan pertanyaan retoris, sedangkan waw menghubungkannya dengan kesimpulan dari uraian sebelumnya. 'Jadi' dan 'mungkin' menyampaikan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: תְּנַחֲמוּנִי
  choice: kalian menghibur aku
  rationale: Bentuk piel dari נחם dengan sufiks orang pertama tunggal berarti 'menghibur aku'. Pronomina jamak 'kalian' memperjelas bahwa Ayub menyapa para sahabatnya.
- source_word: הָבֶל
  choice: dengan kesia-siaan
  rationale: הבל menunjuk pada kehampaan, kesia-siaan, atau sesuatu yang tidak berbobot. Frasa ini mempertahankan bentuk nomina dan menggambarkan isi penghiburan mereka sebagai hampa, bukan sekadar usaha yang gagal.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: sedangkan jawaban-jawaban kalian
  rationale: תשובה berarti jawaban atau tanggapan. Pengulangan 'jawaban-jawaban' wajar untuk sejumlah tanggapan para sahabat, dan waw di sini paling alami menyatakan pertentangan atau dasar bagi pertanyaan sebelumnya.
- source_word: נִשְׁאַר
  choice: tetap merupakan
  rationale: Nifal dari שׁאר berarti 'tersisa' atau 'tetap ada'. Dalam konstruksi predikatif ini, 'tetap merupakan' menghasilkan bahasa Indonesia yang alami tanpa menghilangkan gagasan bahwa setelah semuanya dikatakan, sifat jawaban mereka tetap sama.
- source_word: מָעַל
  choice: pengkhianatan
  rationale: מעל berarti tindakan tidak setia, pelanggaran kepercayaan, atau pengkhianatan. 'Pengkhianatan' mempertahankan kerasnya tuduhan Ayub dan lebih kuat daripada sekadar 'kekeliruan' atau 'tipu daya'.
theological_decisions:
- issue: Kekuatan tuduhan Ayub terhadap jawaban para sahabat
  choice: pengkhianatan
  alternative: ketidaksetiaan; tipu daya
  rationale: Teks Ibrani memakai מָעַל, istilah yang dapat menunjuk pada pelanggaran kepercayaan atau ketidaksetiaan. Terjemahan ini mempertahankan ketegangan dan kerasnya tuduhan Ayub tanpa menentukan secara lebih khusus apakah pengkhianatan itu terutama terhadap Ayub atau terhadap kebenaran.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Kalian' dipakai agar sapaan jamak kepada para sahabat Ayub jelas. Struktur pertanyaan retoris dipertahankan, dengan alternatif makna הָבֶל dicatat dalam catatan kaki.
