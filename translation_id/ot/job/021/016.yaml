  yaml_path: translation/ot/job/021/016.yaml
  text: Look, is not their prosperity in their own hand? The counsel of the wicked is far from me.
translation:
  language: id
  text: Lihat, kemakmuran mereka tidak berada di tangan mereka sendiri. Nasihat orang fasik jauh dariku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Kata penunjuk yang menarik perhatian; “Lihat” alami dalam bahasa Indonesia modern dan sejalan dengan fungsi pragmatisnya.
- source_word: טוּבָם
  choice: kemakmuran mereka
  rationale: Dalam konteks Ayub 21 tentang keberhasilan orang fasik, טוּב menunjuk pada keadaan baik atau kesejahteraan material, sehingga “kemakmuran” tepat.
- source_word: בְיָדָם
  choice: berada dalam tangan mereka sendiri
  rationale: Mempertahankan metafora Ibrani tentang kuasa, kendali, atau kepemilikan tanpa memilih hanya satu nuansa.
- source_word: עֲצַת רְשָׁעִים
  choice: Nasihat orang fasik
  rationale: עֵצָה dapat berarti nasihat, rencana, atau pertimbangan; “nasihat” mempertahankan padanan langsung sekaligus membiarkan cakupan maknanya tetap terbuka.
- source_word: רָחֲקָה מֶנִּי
  choice: jauh dariku
  rationale: Terjemahan langsung yang mempertahankan ungkapan penolakan atau pengambilan jarak oleh Ayub.
theological_decisions:
- issue: Hubungan antara kemakmuran orang fasik dan kendali mereka sendiri
  choice: 'Mempertahankan bentuk pertanyaan: “bukankah kemakmuran mereka berada dalam tangan mereka sendiri?”'
  alternative: “Namun kemakmuran mereka tidak berada dalam kuasa mereka sendiri.”
  rationale: Urutan konsonan dan vokalisasi WLC secara formal mendukung pertanyaan dengan לֹא, tetapi hubungan logisnya dengan konteks dapat dipahami secara berbeda. Teks utama mempertahankan bentuk sumber tanpa menyelesaikan ketegangan teologis itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora “dalam tangan” dipertahankan karena mudah dipahami dan menjaga ambiguitas antara kepemilikan, kuasa, dan kendali.
