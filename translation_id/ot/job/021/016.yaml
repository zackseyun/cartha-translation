review_pass:
  verdict: revise
  source_fidelity: Teks Ibrani memakai הֵן לֹא (“Lihatlah/sesungguhnya, tidak”), suatu pernyataan negatif, bukan bentuk pertanyaan. Draf mengikuti jejak audit bahasa Inggris yang mengubahnya menjadi pertanyaan retoris, sehingga tidak mempertahankan sintaks sumber secara tepat. “Kemakmuran mereka” merupakan pemahaman kontekstual yang wajar untuk טוּבָם, dan “nasihat orang fasik” dapat dipertahankan untuk עֲצַת רְשָׁעִים.
  naturalness: “Berada dalam tangan mereka sendiri” dapat dipahami, tetapi “berada di tangan mereka sendiri” lebih alami dalam bahasa Indonesia modern untuk idiom kuasa atau kendali. Kalimat deklaratif yang direvisi juga lebih lugas dan bermartabat.
  terminology: “Kemakmuran,” “orang fasik,” dan “nasihat” sesuai register Alkitab Indonesia modern serta tidak memaksakan penafsiran teologis tertentu. “Nasihat” mempertahankan kemungkinan cakupan עֵצָה, yang juga dapat bernuansa rencana atau pertimbangan.
  issues:
  - severity: high
    issue: Kalimat pertama diterjemahkan sebagai pertanyaan retoris (“bukankah ...?”).
    rationale: WLC berbunyi הֵן לֹא בְיָדָם טוּבָם, secara langsung “Lihatlah/sesungguhnya, kebaikan/kemakmuran mereka tidak di tangan mereka.” Tidak terdapat penanda interogatif. Terjemahan sebagai pertanyaan mengikuti teks audit Inggris, tetapi bukan bentuk sumber Ibrani.
  - severity: low
    issue: Frasa idiomatis “dalam tangan mereka sendiri” kurang alami dibanding “di tangan mereka sendiri.”
    rationale: Keduanya dapat dimengerti, tetapi “di tangan” lebih lazim dalam bahasa Indonesia untuk menyatakan berada dalam kendali atau kuasa seseorang, sambil tetap mempertahankan metafora sumber.
  revised_text: Lihat, kemakmuran mereka tidak berada di tangan mereka sendiri. Nasihat orang fasik jauh dariku.
