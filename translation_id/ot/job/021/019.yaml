base_translation:
  language: en
  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: id
  text: Allah menyimpan kejahatannya[c] bagi putra-putranya[b]? Biarlah Dia membalas orang itu sendiri, supaya ia mengetahuinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Allah menyimpan kejahatannya bagi putra-putranya; biarlah Dia membalas orang itu, supaya ia mengetahuinya.” Teks Ibrani dapat diterjemahkan tanpa pertanyaan retoris, tetapi konteks mendukung pemahaman bahwa Ayub sedang menantang gagasan tersebut.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “putra-putranya”; dalam konteks ini ungkapan tersebut dapat merujuk secara lebih luas kepada keturunannya.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang diterjemahkan “kejahatannya” juga dapat berarti “kesusahannya” atau akibat/hukuman dari kejahatannya, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal yang umum untuk Allah dalam kitab Ayub; “Allah” adalah padanan baku dan wajar dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: יִצְפֹּן
  choice: menyimpan
  rationale: Verba צפן menyatakan tindakan menyimpan atau menyediakan sesuatu untuk kemudian; “menyimpan” mempertahankan gambaran itu dengan bahasa Indonesia yang alami.
- source_word: לְבָנָיו
  choice: bagi anak-anak lelakinya
  rationale: Teks Ibrani secara harfiah memakai bentuk maskulin jamak “anak-anak lelaki/putra-putra”. Ungkapan ini dipertahankan, sementara kemungkinan cakupan yang lebih luas dijelaskan dalam catatan kaki.
- source_word: אוֹנוֹ
  choice: kejahatannya
  rationale: אוֹן dapat menunjuk pada kejahatan, kesusahan, atau akibat hukuman. “Kejahatannya” dekat dengan bentuk sumber dan tidak secara diam-diam memastikan bahwa yang disimpan adalah hukumannya.
- source_word: יְשַׁלֵּם
  choice: Biarlah Dia membalaskannya
  rationale: Bentuk Piel שׁלם dapat berarti membalas atau memberi ganjaran setimpal. Dalam alur argumen, bentuk ini paling baik dipahami sebagai desakan atau harapan korektif Job.
- source_word: אֵלָיו
  choice: kepada orang itu sendiri
  rationale: Pronomina ini merujuk kepada orang fasik yang sedang dibicarakan. “Orang itu sendiri” memperjelas kontras dengan anak-anak lelakinya tanpa menambahkan pelaku baru.
- source_word: וְיֵדָע
  choice: supaya ia mengetahuinya
  rationale: 'ידע berarti “mengetahui”. Dalam konteks ini, waw berangkai dengan bentuk imperfek dapat menyatakan hasil atau tujuan: orang itu sendiri harus mengalami pembalasan agar mengetahuinya.'
theological_decisions:
- issue: Apakah klausa pembuka merupakan pernyataan Job sendiri atau pandangan yang sedang ia tantang
  choice: Klausa pembuka disajikan sebagai pertanyaan retoris, lalu diikuti desakan Job agar Allah membalas orang fasik itu sendiri.
  alternative: 'Seluruh ayat dapat dibaca sebagai pernyataan biasa: “Allah menyimpan kejahatannya bagi anak-anak lelakinya; Dia akan membalasnya kepadanya, dan ia akan mengetahuinya.”'
  rationale: Konteks Ayub 21 menunjukkan bahwa Job sedang menantang gagasan bahwa pembalasan yang menimpa keturunan merupakan pembalasan yang memadai bagi orang fasik. Pertanyaan retoris mempertahankan alur argumentasi itu, sedangkan catatan kaki menjaga kemungkinan pembacaan sintaksis yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pertanyaan retoris dipertahankan untuk menyampaikan arah argumen Job. Huruf kapital pada “Dia” membedakan Allah sebagai pelaku pembalasan dari “ia”, yaitu orang fasik yang harus mengetahuinya.
