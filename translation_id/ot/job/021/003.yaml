  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: id
  text: Bersabarlah denganku[a], dan aku akan berbicara; sesudah aku berbicara[b], silakan mengejek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tahanlah aku.” Bahasa Ibrani secara harfiah memakai kata “menanggung” dalam arti bersabar terhadap seseorang atau memberinya kesempatan berbicara.
    reason: lexical_alternative
  - marker: b
    text: Atau “sesudah aku berbicara, kamu akan mengejek.” Bahasa Ibrani dapat dipahami sebagai pernyataan masa depan sederhana (“kamu akan mengejek”) atau sebagai izin/konsesi (“silakan mengejek”); teks utama memilih yang terakhir karena lebih lancar dalam konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Bersabarlah terhadap aku
  rationale: Secara harfiah verba נָשָׂא berarti ‘mengangkat, membawa, menanggung’, tetapi dalam konteks percakapan ini merupakan permintaan agar para pendengar menoleransi Ayub dan memberinya kesempatan berbicara. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya interpersonalnya.
- source_word: וְאָנֹכִי
  choice: dan aku
  rationale: Pronomina אָנֹכִי menegaskan orang pertama. Penyebutan eksplisit ‘aku’ sesudah permintaan tersebut cukup menyampaikan penekanannya tanpa menambahkan tafsiran.
- source_word: אֲדַבֵּר
  choice: akan berbicara
  rationale: Bentuk piel dari דבר adalah verba umum untuk berbicara; pilihan ini langsung dan sesuai dengan ragam tutur Ayub yang bermartabat.
- source_word: וְאַחַר דַּבְּרִי
  choice: setelah aku selesai berbicara
  rationale: אַחַר memperkenalkan tindakan berikutnya secara temporal, sedangkan infinitif berakhiran orang pertama דַּבְּרִי secara harfiah berarti ‘sesudah pembicaraanku’. Bentuk ‘setelah aku selesai berbicara’ wajar dalam bahasa Indonesia dan memperjelas bahwa ejekan menyusul sesudah Ayub mendapat kesempatan menyampaikan perkataannya.
- source_word: תַלְעִיג
  choice: silakan kamu mengejek
  rationale: Hifil dari לעג berarti ‘mengejek, mencemooh’. Bentuk Ibrani beralamat tunggal; ‘kamu’ mempertahankan jumlah itu. ‘Silakan’ menyampaikan nuansa permisif atau konsesif yang cocok dengan konteks tanpa menjadikannya perintah agar benar-benar mengejek.
theological_decisions:
- issue: Daya modal תַלְעִיג
  choice: silakan kamu mengejek
  alternative: kamu akan mengejek
  rationale: Bentuk Ibrani dapat dibaca sebagai tindakan masa depan sederhana atau sebagai izin/konsesi pragmatis. Teks utama memilih nuansa permisif yang lebih lancar dalam konteks, sementara catatan kaki mempertahankan kemungkinan bacaan masa depan sederhana.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Bersabarlah terhadap aku’ menghindari ungkapan yang terlalu harfiah, sedangkan ‘silakan kamu mengejek’ mempertahankan ketegangan antara izin retoris dan prediksi. Penanda catatan kaki [a] dan [b] ditempatkan tepat pada unsur yang dijelaskan.
