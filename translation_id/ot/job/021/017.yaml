  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: id
  text: Betapa seringkah pelita orang-orang fasik dipadamkan[a][b], dan bencana mereka menimpa mereka? Apakah ia membagikan penderitaan[c] dalam murkanya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Berapa kalikah pelita orang-orang fasik padam …?” Pertanyaan Ibrani ini bersifat retoris dan menggugat anggapan bahwa orang fasik secara teratur dihukum dengan cara demikian.'
    reason: lexical_alternative
  - marker: b
    text: “Pelita” adalah kiasan bagi kehidupan, kemakmuran, atau keberuntungan seseorang yang terus berlangsung.
    reason: cultural_note
  - marker: c
    text: “Penderitaan” juga dapat diterjemahkan “kesakitan” atau “sakit bersalin.” Kata Ibraninya mencakup beberapa pengertian yang berkaitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Betapa seringkah
  rationale: Kata tanya ini dalam konteksnya menanyakan frekuensi secara retoris. Bentuk ini mempertahankan tantangan Ayub terhadap anggapan bahwa orang fasik selalu atau kerap segera dihukum.
- source_word: נֵר רְשָׁעִים
  choice: pelita orang-orang fasik
  rationale: נֵר secara harfiah berarti pelita dan di sini menjadi metafora bagi kehidupan, kemakmuran, atau keberuntungan yang berlanjut. Citra Ibrani dipertahankan.
- source_word: יִדְעָךְ
  choice: dipadamkan
  rationale: Verba דעך mengacu pada pelita yang padam atau dipadamkan. Bentuk pasif ini sesuai dengan bentuk verbal sumber dan rangkaian tindakan penghukuman.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: dan bencana mereka menimpa mereka
  rationale: אֵיד menunjuk pada bencana, malapetaka, atau kehancuran. Susunan ini mempertahankan pronomina ganda dalam teks sumber tanpa mengaburkan makna.
- source_word: חֲבָלִים
  choice: penderitaan
  rationale: Nomina ini dapat menyatakan kesakitan, derita, atau rasa sakit seperti sakit bersalin. 'Penderitaan' cukup luas untuk mempertahankan keluwesan makna dalam konteks penghukuman.
- source_word: יְחַלֵּק
  choice: membagikan ... kepada mereka
  rationale: Bentuk Piel dari חלק berarti membagi, membagikan, atau menetapkan bagian. Ungkapan ini menyampaikan tindakan memberikan penderitaan sebagai bagian yang ditentukan.
- source_word: בְּאַפּוֹ
  choice: dalam murka-Nya
  rationale: אַף dalam ungkapan ini berarti amarah atau murka. 'Murka' cocok dengan register puisi hikmat dan konteks penghakiman ilahi.
theological_decisions:
- issue: Subjek orang ketiga tunggal dalam יְחַלֵּק dan rujukan sufiks בְּאַפּוֹ
  choice: Dia ... murka-Nya
  alternative: Menyebut 'Allah' secara eksplisit, atau memakai bentuk impersonal
  rationale: Bahasa Ibrani tidak menyebut nama subjek, tetapi konteks kuat menunjuk kepada Allah. 'Dia' mempertahankan ketidaktersuratan subjek sekaligus mengikuti rujukan kontekstual; kapitalisasi membantu pembaca mengenali rujukannya tanpa menambahkan nama yang tidak terdapat dalam klausa.
- issue: Daya retoris כַּמָּה
  choice: Pertanyaan tentang seberapa sering hal itu benar-benar terjadi
  alternative: Pertanyaan netral yang sekadar meminta jumlah kejadian, atau parafrasa 'betapa jarangnya'
  rationale: Dalam argumen Ayub, pertanyaan ini menggugat generalisasi bahwa orang fasik secara teratur mengalami hukuman. Terjemahan mempertahankan bentuk tanya dan tidak mengubahnya menjadi pernyataan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang-orang fasik', 'pelita', dan 'murka' mempertahankan corak sastra hikmat tanpa menjadi arkais. Penempatan penanda catatan mengikuti unsur yang diterangkan.
