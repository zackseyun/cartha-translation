  yaml_path: translation/ot/job/021/026.yaml
  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: id
  text: Bersama-sama mereka terbaring di dalam debu, dan belatung[a] menutupi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ulat.” Kata Ibrani רִמָּה dapat menunjuk pada ulat atau belatung dalam konteks pembusukan jasad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Bersama-sama
  rationale: Menegaskan nasib akhir yang sama bagi kedua orang yang dikontraskan dalam konteks, tanpa menambahkan penafsiran di luar teks.
- source_word: עַל עָפָר
  choice: dalam debu
  rationale: Walaupun עַל secara harfiah sering berarti 'di atas', dalam konteks kematian dan penguburan ungkapan Indonesia 'dalam debu' lebih alami dan menyampaikan gambaran kubur.
- source_word: יִשְׁכָּבוּ
  choice: mereka terbaring
  rationale: Mempertahankan gambaran konkret tentang berbaring dalam kematian. Bentuk kini dalam bahasa Indonesia dapat menyatakan hasil umum yang berlaku bagi keduanya.
- source_word: רִמָּה
  choice: ulat
  rationale: Kata Ibrani ini menunjuk pada ulat atau belatung dalam konteks pembusukan. 'Ulat' cukup luas dan alami, sedangkan 'belatung' dicantumkan sebagai alternatif yang lebih khusus.
- source_word: תְּכַסֶּה
  choice: menutupi
  rationale: Mempertahankan gambaran nyata pembusukan. Bentuk verba Indonesia tidak perlu menandai kesesuaian jumlah dengan nomina kolektif.
- source_word: עֲלֵיהֶם
  choice: mereka
  rationale: Makna preposisi diserap secara alami ke dalam frasa verba 'menutupi mereka', tanpa kehilangan pengertian bahwa ulat berada di atas tubuh mereka.
