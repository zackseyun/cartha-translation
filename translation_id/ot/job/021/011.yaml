  text: יְשַׁלְּח֣וּ כַ֭/צֹּאן עֲוִילֵי/הֶ֑ם וְ֝/יַלְדֵי/הֶ֗ם יְרַקֵּדֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/011.yaml
  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: id
  text: Mereka melepas anak-anak mereka yang masih kecil[a] seperti kawanan ternak[b], dan anak-anak mereka menari-nari[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bayi-bayi mereka.” Kata Ibrani ini menunjuk kepada anak-anak yang masih sangat muda.
    reason: lexical_alternative
  - marker: b
    text: Atau “seperti kawanan domba.” Kata Ibrani צֹאן dapat menunjuk secara kolektif kepada domba atau ternak kecil.
    reason: lexical_alternative
  - marker: c
    text: Atau “melompat-lompat.” Kata kerja Ibrani ini menggambarkan gerakan yang lincah dan riang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: melepas
  rationale: Bentuk piel dari שׁלח menyatakan tindakan menyuruh keluar atau membiarkan pergi. Dalam gambaran anak-anak yang bergerak bebas, “melepas” alami dalam bahasa Indonesia dan tetap mempertahankan tindakan aktif tanpa menambahkan tujuan yang tidak disebutkan.
- source_word: כַצֹּאן
  choice: seperti kawanan ternak
  rationale: צֹאן adalah sebutan kolektif bagi ternak kecil, terutama domba dan kambing. “Kawanan ternak” mempertahankan sifat kolektif perbandingan tersebut tanpa membatasi maknanya hanya pada domba.
- source_word: עֲוִילֵיהֶם
  choice: anak-anak mereka yang masih kecil
  rationale: עֲוִיל menunjuk kepada anak yang sangat muda. Ungkapan ini menyampaikan usia muda secara alami tanpa membatasi rujukannya hanya kepada bayi yang baru lahir.
- source_word: יַלְדֵיהֶם
  choice: anak-anak mereka
  rationale: Bentuk nomina dari ילד di sini secara luas berarti anak-anak atau keturunan. “Anak-anak mereka” adalah padanan yang alami dan sesuai dengan paralelisme ayat.
- source_word: יְרַקֵּדוּן
  choice: menari-nari
  rationale: רקד menggambarkan gerakan yang lincah, seperti menari atau melompat-lompat. Reduplikasi dalam “menari-nari” menyampaikan gerakan riang yang berkelanjutan tanpa menghilangkan kemungkinan nuansa melompat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana. “Melepas” dan “menari-nari” dipilih agar gambaran kebebasan serta keriangan anak-anak terasa alami, sementara catatan kaki mempertahankan keluasan leksikal bahasa Ibrani.
