  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: id
  text: Seorang mati ketika kekuatannya masih utuh,[a] dalam keadaan sepenuhnya tenteram dan aman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yang ini mati dalam kekuatannya yang penuh, sepenuhnya tenteram dan tidak terusik.”
    reason: Alternatif ini mempertahankan bentuk penunjuk זֶה dan mengungkapkan secara lebih dekat nuansa kepenuhan atau keutuhan dalam בְּעֶצֶם תֻּמּוֹ.
lexical_decisions:
- source_word: זֶה
  choice: Yang seorang
  rationale: Kata penunjuk ini memperkenalkan satu contoh dalam perbandingan Ayub. Ungkapan "yang seorang" terdengar alami dalam bahasa Indonesia dan mempertahankan fungsi representatifnya.
- source_word: יָמוּת
  choice: mati
  rationale: Bentuk imperfek di sini menyatakan kenyataan umum, sehingga bentuk kini "mati" lebih tepat daripada bentuk ramalan.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: ketika kekuatannya masih utuh
  rationale: Secara harfiah עֶצֶם berkaitan dengan tulang, hakikat, atau kekuatan, sedangkan תֻּמּוֹ menyatakan keutuhan atau keadaan yang tidak berkurang. Dalam konteks ini gabungannya menunjuk pada kekuatan hidup yang masih penuh, bukan integritas moral.
- source_word: כֻּלּוֹ
  choice: seluruh dirinya
  rationale: Ungkapan ini menegaskan bahwa keadaan tenteram tersebut mencakup orang itu sepenuhnya; terjemahan ini mempertahankan gambaran Ibrani tanpa terasa terlalu janggal.
- source_word: שַׁלְאֲנַן
  choice: tenteram
  rationale: Kata ini menggambarkan keadaan tenang, leluasa, dan bebas dari gangguan, tanpa harus mempersempit maknanya menjadi kemakmuran materi.
- source_word: וְשָׁלֵיו
  choice: dan aman
  rationale: Kata yang sejajar ini menambahkan gagasan ketenangan yang tidak terusik atau keadaan yang terjamin. "Aman" melengkapi "tenteram" tanpa pengulangan berlebihan.
