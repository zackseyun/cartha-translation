  text: His bull breeds and does not fail[a]; his cow calves and does not miscarry.
translation:
  language: id
  text: Pejantannya mengawini betina dan tidak gagal membuahinya[a]; sapi betinanya beranak dan tidak kehilangan anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan tidak menolak” atau “dan tidak menyebabkan mandul.” Kata kerja Ibrani di sini sulit dipastikan; teks utama menyatakan makna yang dituntut oleh paralelisme, yaitu bahwa perkawinan ternak itu berhasil dan tidak sia-sia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: pejantannya
  rationale: שׁוֹר menunjuk pada ternak jantan; dalam konteks perkembangbiakan, 'pejantannya' menyatakan fungsi reproduktif dengan wajar tanpa memakai 'lembu jantan' yang terasa kurang alami.
- source_word: עִבַּר
  choice: mengawini
  rationale: Dalam konteks reproduksi ternak, bentuk ini menyatakan tindakan pejantan mengawini betina, dengan hasil yang berhasil sebagaimana ditegaskan oleh klausa berikutnya.
- source_word: וְלֹא יַגְעִל
  choice: dan tidak gagal
  rationale: Makna kata kerja ini sulit dipastikan. Dalam paralelisme ayat, ungkapan ini menunjukkan bahwa perkawinan ternak tidak sia-sia; terjemahan umum 'tidak gagal' mempertahankan hasil tersebut tanpa memaksakan arti teknis.
- source_word: תְּפַלֵּט
  choice: beranak
  rationale: Piel פלט di sini berarti melahirkan anak. 'Beranak' adalah ungkapan Indonesia yang alami dan tepat untuk hewan.
- source_word: פָּרָתוֹ
  choice: sapinya
  rationale: פָּרָה berarti sapi betina; dalam bahasa Indonesia, 'sapinya' sudah alami karena konteks beranak memperjelas bahwa yang dimaksud adalah betina.
- source_word: וְלֹא תְשַׁכֵּל
  choice: dan tidak keguguran
  rationale: Dalam konteks kelahiran, שׁכל menyatakan kehilangan anak. 'Tidak keguguran' menyampaikan maksud itu secara ringkas dan alami.
