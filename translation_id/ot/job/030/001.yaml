  text: וְ/עַתָּ֤ה שָֽׂחֲק֣וּ עָלַ/י֮ צְעִירִ֥ים מִמֶּ֗/נִּי לְ/יָ֫מִ֥ים אֲשֶׁר מָאַ֥סְתִּי אֲבוֹתָ֑/ם לָ֝/שִׁ֗ית עִם כַּלְבֵ֥י צֹאנִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/001.yaml
  text: But now those younger than I laugh at me[a], whose fathers I refused to set with the dogs of my flock.
translation:
  language: id
  text: Tetapi sekarang, orang-orang yang lebih muda daripada aku menertawakan aku, orang-orang yang para ayahnya tidak sudi kutempatkan bersama anjing-anjing kawanan dombaku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Tetapi sekarang
  rationale: Konteks menunjukkan pertentangan tajam antara kehormatan Ayub dahulu dan penghinaan yang kini dialaminya.
- source_word: שָׂחֲקוּ עָלַי
  choice: menertawakan aku
  rationale: Ungkapan ini menyatakan tawa yang diarahkan kepada Ayub sebagai ejekan; pilihan ini mempertahankan gambaran konkret bahasa Ibrani.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: orang-orang yang lebih muda daripada aku
  rationale: Secara harfiah mencakup gagasan 'lebih muda daripadaku dalam hal hari/usia'; bahasa Indonesia alami mengungkapkannya sebagai perbandingan usia tanpa menambahkan jenis kelamin yang tidak dinyatakan secara eksplisit.
- source_word: אֲשֶׁר מָאַסְתִּי
  choice: yang ... bahkan tidak sudi
  rationale: מָאַסְתִּי mengandung penolakan yang disertai penghinaan atau anggapan tidak layak. 'Tidak sudi' secara alami menyampaikan kuatnya penolakan tersebut dalam konstruksi dengan infinitif berikutnya.
- source_word: אֲבוֹתָם
  choice: ayahnya
  rationale: Bentuk ini menunjuk kepada para ayah dari kelompok orang muda itu. Bahasa Indonesia memakai bentuk tunggal kolektif secara alami dalam klausa relatif ini.
- source_word: לָשִׁית
  choice: kutempatkan
  rationale: Kata kerja ini berarti menaruh atau menempatkan; bentuk aktif dengan klitik orang pertama sesuai dengan sintaksis sumber.
- source_word: עִם כַּלְבֵי צֹאנִי
  choice: bersama anjing-anjing penjaga kawanan dombaku
  rationale: Ungkapan Ibrani secara harfiah ialah 'bersama anjing-anjing kawanan dombaku'. Penambahan 'penjaga' memperjelas fungsi anjing dalam konteks penggembalaan tanpa mengubah maksud pokok; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah memperjelas bahwa klausa berikutnya menerangkan orang-orang muda yang menertawakan Ayub. Ungkapan “bahkan tidak sudi” mempertahankan nada penghinaan sosial yang kuat dalam ucapan Ayub.
