  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: id
  text: Namun sekarang, aku telah menjadi nyanyian mereka[a] dan buah bibir bagi mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyanyian ejekan mereka”—dalam konteks ini, “nyanyian mereka” kemungkinan besar bernada mengejek.
    reason: lexical_alternative
  - marker: b
    text: Atau “peribahasa” atau “bahan pembicaraan”; kata Ibrani yang dipakai menunjuk pada perkataan mengenai seseorang, di sini dalam nada menghina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Menandai peralihan waktu sekaligus pertentangan antara kehormatan Ayub dahulu dan penghinaan yang dialaminya sekarang. 'Namun sekarang' wajar dalam bahasa Indonesia dan tidak berlebihan menafsirkan hubungan antarkalimat.
- source_word: נְגִינָתָם
  choice: nyanyian mereka
  rationale: Secara harfiah menunjuk pada nyanyian atau lagu mereka. Dalam konteks ini nyanyian tersebut bersifat mengejek, tetapi ungkapan yang lebih harfiah mempertahankan citra bahasa Ibrani dan nuansanya dijelaskan dalam catatan kaki.
- source_word: הָיִיתִי
  choice: aku telah menjadi
  rationale: Bentuk perfektif היה menggambarkan perubahan yang menghasilkan keadaan Ayub saat ini. 'Telah menjadi' menyampaikan perubahan beserta hasilnya yang masih berlangsung.
- source_word: וָאֱהִי
  choice: dan aku menjadi
  rationale: Melanjutkan gambaran tentang keadaan hina Ayub. Pengulangan 'menjadi' menghasilkan kesejajaran yang jelas dan alami dengan klausa pertama.
- source_word: לָהֶם
  choice: mereka
  rationale: Relasi datif dinyatakan secara alami dalam frasa Indonesia 'menjadi buah bibir mereka', tanpa perlu menerjemahkan preposisinya secara kaku.
- source_word: לְמִלָּה
  choice: buah bibir
  rationale: מִלָּה pada konteks ini menunjuk pada perkataan atau ungkapan yang beredar mengenai seseorang. 'Buah bibir' merupakan padanan Indonesia yang alami, sementara konteks dan catatan kaki memperjelas bahwa pembicaraan itu bernada menghina.
