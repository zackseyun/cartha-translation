  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Nyanyian mereka' mempertahankan metafora sumber, sedangkan 'buah bibir' membuat klausa kedua alami bagi pembaca umum tanpa menghapus kemungkinan makna lain.
