    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי
  choice: berbalik menyerang aku
  rationale: Bentuk Hofal dari הפך menyatakan keadaan pasif/resultatif, yakni sesuatu telah dibalikkan atau diarahkan terhadap Ayub. Ungkapan ini menyampaikan gerak memusuhi secara alami dalam bahasa Indonesia tanpa menentukan pelaku di luar teks.
- source_word: בַּלָּהוֹת
  choice: kengerian
  rationale: Nomina jamak ini menunjuk pada berbagai hal yang menimbulkan rasa gentar atau ngeri. Bentuk kolektif 'kengerian' alami dalam bahasa Indonesia dan selaras dengan verba feminin tunggal Ibrani yang memperlakukannya sebagai satu kumpulan.
- source_word: תִּרְדֹּף
  choice: semuanya mengejar
  rationale: רדף berarti mengejar atau memburu. 'Semuanya' merujuk kembali kepada kengerian secara kolektif dan membuat hubungan antarklausa jelas tanpa mengubah acuannya.
- source_word: כָּרוּחַ
  choice: seperti angin
  rationale: רוּחַ paling wajar berarti 'angin' di sini. Perbandingan ini melukiskan martabat Ayub yang dikejar atau disapu, serta berpasangan secara puitis dengan gambaran awan.
- source_word: נְדִבָתִי
  choice: martabatku
  rationale: Kata yang sulit ini dapat menunjuk pada keluhuran, kemuliaan, atau kedudukan terhormat. 'Martabatku' cocok dengan ratapan Ayub tentang hilangnya keadaan terhormat dan tetap mudah dipahami; alternatif dicatat dalam catatan kaki.
- source_word: וּכְעָב
  choice: seperti awan
  rationale: עָב berarti awan, kadang-kadang awan tebal. 'Awan' cukup untuk mempertahankan gambaran puitis tanpa menambahkan ciri yang tidak diperlukan.
- source_word: עָבְרָה
  choice: berlalu
  rationale: עבר di sini menyatakan lewat, lenyap, atau sirna. 'Berlalu' mempertahankan metafora awan yang bergerak pergi.
- source_word: יְשֻׁעָתִי
  choice: keselamatanku
  rationale: יְשׁוּעָה dapat berarti keselamatan, pembebasan, atau kesejahteraan. 'Keselamatanku' mempertahankan padanan leksikal yang luas, sementara makna kontekstual lain dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna יְשֻׁעָתִי
  choice: keselamatanku
  alternative: pembebasanku; kesejahteraanku
  rationale: Dalam konteks Ayub, kata ini dapat menunjuk pada pertolongan nyata atau keadaan sejahtera, bukan harus pada keselamatan dalam pengertian doktrinal yang lebih kemudian. Terjemahan utama mempertahankan istilah luas dan catatan kaki mencegah pembacaan teologis yang terlalu sempit.
- issue: Makna נְדִבָתִי yang tidak pasti
  choice: martabatku
  alternative: keluhuranku; kehormatanku; kemakmuranku
  rationale: Konteks mendukung keadaan luhur atau terhormat yang telah hilang, tetapi nuansa tepatnya tidak pasti. 'Martabatku' tidak mengharuskan Ayub memiliki status bangsawan dan alternatifnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan dua gambaran—angin dan awan—dipertahankan. Penanda [a] ditempatkan sesudah 'martabatku' dan [b] sesudah 'keselamatanku' agar masing-masing catatan melekat pada istilah yang dijelaskannya.
