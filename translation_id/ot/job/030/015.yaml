  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: id
  text: Kengerian berbalik menimpaku; kengerian itu mengejar martabatku[a] seperti angin, dan keselamatanku[b] berlalu seperti awan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keluhuranku”, “kehormatanku”, atau “kemakmuranku”. Kata Ibrani ini menunjuk pada keadaan yang luhur atau terhormat.'
