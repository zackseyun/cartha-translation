translation:
  language: id
  text: Di antara semak-semak mereka meringkik; di bawah jelatang[a] mereka berkumpul[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semak berduri” atau “belukar berduri”. Jenis tumbuhan yang dimaksud oleh kata Ibrani ini tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka berhimpun rapat” atau “mereka meringkuk bersama”. Kata Ibraninya menggambarkan keadaan terkumpul atau terhimpit rapat; nuansa tepatnya dalam konteks ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין
  choice: di antara
  rationale: Menyatakan keberadaan di tengah sekumpulan semak dan merupakan padanan Indonesia yang alami bagi preposisi ini dengan nomina jamak.
- source_word: שִׂיחִים
  choice: semak-semak
  rationale: Menunjuk pada tumbuhan perdu rendah di daerah liar; pilihan ini jelas dan tidak terlalu menentukan kerapatannya.
- source_word: יִנְהָקוּ
  choice: mereka meringkik
  rationale: Verba נהק lazim menggambarkan suara keledai. 'Meringkik' mempertahankan gambaran keras yang menyamakan suara orang-orang tersisih itu dengan suara binatang, meskipun dalam bahasa Indonesia kata ini juga sering dikaitkan dengan kuda.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan spasial langsung dan alami dalam bahasa Indonesia.
- source_word: חָרוּל
  choice: jelatang
  rationale: Istilah tumbuhan ini menunjuk pada gulma berduri atau menyengat, tetapi spesies tepatnya tidak pasti. 'Jelatang' mempertahankan kesan tumbuhan liar yang tidak menyenangkan.
- source_word: יְסֻפָּחוּ
  choice: mereka berdesak-desakan
  rationale: Bentuk verba ini menyiratkan keadaan dikumpulkan, dihimpit, atau bergerombol. 'Berdesak-desakan' menggambarkan mereka berhimpun rapat di bawah tumbuhan liar tanpa memastikan apakah tindakan itu sukarela atau pasif.
