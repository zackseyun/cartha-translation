  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: id
  text: Sebab aku tahu bahwa Engkau akan membawa aku kepada kematian[a], ke rumah yang ditetapkan bagi setiap orang yang hidup.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: mengembalikan aku kepada kematian. Kata kerjanya mengandung arti menyebabkan seseorang kembali.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: rumah yang ditetapkan bagi semua yang hidup. Ungkapan puitis ini mungkin merujuk pada kubur atau Sheol sebagai tujuan yang sama bagi setiap manusia.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberikan dasar bagi keluhan Ayub sebelumnya.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektum dari verba statif ini secara alami menyatakan pengetahuan atau keyakinan yang telah menetap.
- source_word: מָוֶת
  choice: kematian
  rationale: Nomina ini secara langsung menunjuk pada kematian; terjemahan tidak mempersempit maknanya menjadi kubur atau dunia orang mati.
- source_word: תְּשִׁיבֵנִי
  choice: Engkau akan membawa aku
  rationale: Hifil dari שוב secara harfiah dapat berarti menyebabkan kembali, tetapi dalam konteks tujuan 'kematian', ungkapan Indonesia 'membawa aku kepada kematian' menyampaikan maksudnya secara alami tanpa menyiratkan bahwa Ayub sebelumnya sudah pernah mati. Nuansa 'mengembalikan' dicatat dalam catatan kaki.
- source_word: וּבֵית מוֹעֵד
  choice: ke rumah yang ditetapkan
  rationale: Preposisi 'ke' diteruskan secara implisit dari klausa pertama. מוֹעֵד dapat menyatakan sesuatu atau tempat yang ditetapkan; frasa ini mempertahankan metafora 'rumah' tanpa secara eksplisit menyamakannya dengan Sheol.
- source_word: לְכָל חָי
  choice: bagi setiap orang yang hidup
  rationale: Menyampaikan bentuk kolektif harfiah 'setiap yang hidup' dalam bahasa Indonesia yang wajar dan jelas merujuk kepada manusia dalam konteks ini.
theological_decisions:
- issue: Makna gambaran kematian
  choice: Kematian digambarkan sebagai tujuan universal manusia, yakni rumah yang ditetapkan bagi setiap orang yang hidup.
  alternative: Frasa itu secara lebih khusus menunjuk pada kubur atau Sheol sebagai tempat bersama orang mati.
  rationale: Teks Ibrani menyebut 'kematian' dan 'rumah yang ditetapkan' tanpa menyebut Sheol. Terjemahan mempertahankan metafora dan ketegangan puitisnya tanpa memasukkan uraian tentang alam baka yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada 'Engkau' menandai bahwa Ayub sedang menyapa Allah. Susunan puitis dipertahankan, tetapi frasa dibuat cukup alami bagi pembaca umum.
