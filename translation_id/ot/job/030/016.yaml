  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: id
  text: Dan sekarang, jiwaku tercurah dalam diriku[a]; hari-hari penderitaan mencengkeramku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jiwaku tercurah atasku.” Kata depan Ibrani secara harfiah berarti “atas/padaku”, tetapi ungkapan ini tampaknya menggambarkan keruntuhan batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan fungsi penghubung sekaligus penanda waktu tanpa menjadikannya secara eksplisit adversatif.
- source_word: עָלַי
  choice: dalam diriku
  rationale: Secara harfiah berarti 'atas/padaku', tetapi dalam ungkapan ini menunjuk pada keruntuhan batin; bentuk idiomatis Indonesia dipakai, sementara arti lebih harfiah dicatat dalam catatan kaki.
- source_word: תִּשְׁתַּפֵּךְ
  choice: tercurah
  rationale: Mempertahankan metafora שפך tentang pencurahan atau pengosongan diri tanpa menggantinya dengan tafsiran seperti 'melemah' atau 'luluh'.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפשׁ di sini menunjuk pada diri atau kehidupan batin; 'jiwaku' mempertahankan kedalaman antropologis dan corak puitis ayat.
- source_word: יֹאחֲזוּנִי
  choice: mencengkeram aku
  rationale: Mengungkapkan tindakan memegang dengan kuat dan mempertahankan daya puitis verba אחז dalam bahasa Indonesia alami.
- source_word: יְמֵי
  choice: hari-hari
  rationale: Bentuk jamak konstruktus ini secara wajar diterjemahkan sebagai 'hari-hari' dan dihubungkan dengan nomina berikutnya.
- source_word: עֹנִי
  choice: penderitaan
  rationale: Konteks menekankan kesengsaraan dan penghinaan secara luas, bukan kemiskinan ekonomi secara khusus.
