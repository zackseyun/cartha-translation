  source_fidelity: 'Baris pertama mempertahankan simile כְּפֶרֶץ dengan baik: para penyerang datang “seperti celah lebar,” tanpa memaksakan pembacaan “melalui.” Namun, “keruntuhan” mempersempit שֹׁאָה kepada runtuhnya struktur, sedangkan kata Ibrani ini lebih luas: bencana, kehancuran, atau kegemparan yang menghancurkan. “Kehancuran” lebih setia dan tetap cocok dengan citra celah/bobolan.'
