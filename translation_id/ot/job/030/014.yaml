  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: id
  text: Seperti celah yang lebar, mereka datang[a]; di tengah kehancuran mereka bergulung maju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Seolah-olah melalui celah yang lebar mereka datang; di bawah kehancuran mereka bergulung-gulung.”'
    reason: Teks Ibrani memungkinkan gambaran para penyerang yang datang melalui celah lebar; תַּחַת juga dapat diterjemahkan lebih harfiah sebagai “di bawah”, dan bentuk kata kerja terakhir dapat ditegaskan dengan “bergulung-gulung”.
lexical_decisions:
- source_word: כְּ/פֶרֶץ
  choice: Seperti celah
  rationale: פֶרֶץ menunjuk pada celah atau bobolan, khususnya pada tembok, sedangkan prefiks כְּ menandai perbandingan. Ungkapan ini mempertahankan gambaran serbuan yang menerobos pertahanan tanpa menambahkan kata depan ‘melalui’ ke dalam teks utama.
- source_word: רָחָב
  choice: yang lebar
  rationale: Kata sifat ini menerangkan פֶרֶץ dan menggambarkan bukaan yang luas. ‘Yang lebar’ alami dalam bahasa Indonesia dan tetap konkret.
- source_word: יֶאֱתָיוּ
  choice: mereka datang
  rationale: Kata kerja ini menyatakan gerak datang atau maju. ‘Mereka datang’ mempertahankan ungkapan sederhana dan hidup dalam puisi Ibrani.
- source_word: תַּחַת
  choice: di tengah
  rationale: Arti dasarnya dapat berupa ‘di bawah’, tetapi dalam hubungan dengan שֹׁאָה ungkapan ini juga dapat menyatakan keadaan yang menyertai gerakan tersebut. ‘Di tengah’ menghasilkan bahasa Indonesia yang wajar, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: שֹׁאָה
  choice: keruntuhan
  rationale: שֹׁאָה dapat berarti kehancuran, kerusakan besar, atau keruntuhan. ‘Keruntuhan’ cocok dengan gambaran tembok yang terbobol dan dapat mencakup peristiwa runtuh, bukan hanya keadaan sesudahnya.
- source_word: הִתְגַּלְגָּלוּ
  choice: mereka bergulung maju
  rationale: Bentuk hitpael dari גלל menggambarkan gerakan bergulung atau terguling. ‘Bergulung maju’ menyampaikan gerak massa yang deras dan terus mendesak tanpa membuat bahasa Indonesia terasa kaku.
