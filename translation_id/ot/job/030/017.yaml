  text: Pada malam hari, tulang-tulangku tertusuk dalam diriku[a], dan nyeri yang menggerogotiku tidak beristirahat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini dapat dipahami sebagai “tulang-tulangku dilubangi dari atasku.” Susunan frasa ini sulit, dan kata kerjanya juga dapat diterjemahkan lebih umum sebagai “menggerogoti.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “nyeri yang menggerogotiku” jarang dipakai dan mungkin secara harfiah menunjuk pada urat, pembuluh, atau saluran dalam tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: Pada malam hari
  rationale: Kata ini berfungsi sebagai keterangan waktu; pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan latar waktu penderitaan Ayub.
- source_word: עֲצָמַי
  choice: tulang-tulangku
  rationale: Terjemahan konkret ini mempertahankan gambaran jasmani dalam keluhan Ayub.
- source_word: נִקַּר מֵעָלָי
  choice: seperti ditusuk-tusuk dari dalam
  rationale: נקר menggambarkan tindakan melubangi atau menusuk. Ungkapan Ibrani dengan מֵעָלָי sulit dipastikan secara harfiah; 'dari dalam' menyampaikan penderitaan batiniah/jasmani secara wajar, sedangkan 'seperti' menghindari kesan bahwa tulangnya benar-benar ditembus benda.
- source_word: וְעֹרְקַי
  choice: rasa sakit yang menggerogotiku
  rationale: Istilah yang langka ini dapat menunjuk pada urat atau saluran tubuh, tetapi dalam konteks paralelisme dapat dipahami secara metonimis sebagai rasa sakit yang terus menggerogoti. Ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: לֹא יִשְׁכָּבוּן
  choice: tidak kunjung beristirahat
  rationale: Secara harfiah berarti 'tidak berbaring.' Pilihan ini mempertahankan personifikasi rasa sakit dan menyampaikan bahwa rasa sakit itu tidak juga reda.
