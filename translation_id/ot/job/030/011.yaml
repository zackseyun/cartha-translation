base_translation:
  language: en
  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: id
  text: Karena dia telah mengendurkan talinya[a] dan membuatku menderita, mereka melepaskan kekang di hadapanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tali busurnya.” Kata Ibrani yang dipakai dapat menunjuk secara khusus pada tali busur, bukan hanya tali pada umumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka melepaskan kekang di hadapanku,” yaitu mereka bertindak tanpa menahan diri dalam kehadiranku.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Karena
  rationale: Kata ini memperkenalkan alasan bagi penghinaan dan permusuhan yang dialami Ayub dalam konteks ini.
- source_word: יִתְרוֹ
  choice: talinya
  rationale: Kata Ibrani ini dapat menunjuk pada tali secara umum atau, secara lebih khusus, tali busur. Pilihan umum mempertahankan keluwesan metaforanya, sedangkan kemungkinan khusus dicatat dalam catatan kaki.
- source_word: פִּתַּח
  choice: telah mengendurkan
  rationale: Dengan tali sebagai objek, verba ini menyatakan tindakan melonggarkan atau melepaskan, bukan sekadar membuka.
- source_word: וַיְעַנֵּנִי
  choice: dan menyengsarakan aku
  rationale: Bentuk ini berasal dari ענה II, yang berarti menindas, merendahkan, atau membuat menderita, bukan dari verba homonim yang berarti menjawab.
- source_word: וְרֶסֶן
  choice: segala kekangan
  rationale: Secara harfiah kata ini berarti kekang atau tali kendali, tetapi ungkapan lengkapnya menggambarkan hilangnya pengendalian diri. 'Segala kekangan' menyampaikan makna idiomatisnya secara alami.
- source_word: מִפָּנַי
  choice: di hadapanku
  rationale: Ungkapan ini menunjukkan bahwa tindakan tanpa malu tersebut dilakukan di depan atau dalam kehadiran Ayub.
- source_word: שִׁלֵּחוּ
  choice: mereka membuang
  rationale: Dengan kekang sebagai objek, verba ini berarti melepaskan atau membuang pengendalian yang sebelumnya menahan mereka.
theological_decisions:
- issue: Identitas subjek tunggal dalam klausa pertama
  choice: dia
  alternative: Allah
  rationale: Teks Ibrani hanya menyatakan subjek orang ketiga tunggal melalui bentuk verbal dan pronomina, tanpa menyebut nama Allah. Walaupun konteks sangat mungkin menunjuk kepada Allah, terjemahan mempertahankan bentuk pronominal dan tidak memperjelas referen secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pronomina “dia” tidak dikapitalisasi agar identitas subjek yang tidak disebutkan secara eksplisit dalam teks Ibrani tetap terbuka. Peralihan dari subjek tunggal “dia” ke subjek jamak “mereka” dipertahankan.
