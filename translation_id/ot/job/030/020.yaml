  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: id
  text: Aku berseru kepada-Mu, tetapi Engkau tidak menjawab aku; aku berdiri, dan Engkau memperhatikan aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku berdiri, lalu Engkau memandang aku dengan saksama.” Kedua kata kerja dalam bagian kedua ayat ini dapat dipahami dengan makna waktu lampau, dan kata yang diterjemahkan “memperhatikan” dapat berarti memandang dengan saksama atau mempertimbangkan.
    reason: Alternatif aspek waktu dan nuansa leksikal dalam עָמַדְתִּי וַתִּתְבֹּנֶן.
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: Aku berseru
  rationale: Bentuk piel dari שׁוע menyatakan seruan kuat untuk meminta pertolongan. “Berseru” mempertahankan intensitasnya tanpa menambahkan isi permohonan yang tidak dinyatakan.
- source_word: אֵלֶיךָ
  choice: kepada-Mu
  rationale: Preposisi אֶל dengan sufiks orang kedua maskulin tunggal secara alami diterjemahkan “kepada-Mu”; huruf kapital mengikuti kebiasaan bahasa Indonesia untuk sapaan kepada Allah.
- source_word: וְלֹא תַעֲנֵנִי
  choice: tetapi Engkau tidak menjawab aku
  rationale: ענה dalam qal berarti “menjawab” atau “menanggapi”. “Menjawab aku” langsung dan wajar, sedangkan “tetapi” mengungkapkan pertentangan yang terkandung dalam konteks ratapan.
- source_word: עָמַדְתִּי
  choice: aku berdiri
  rationale: Walaupun bentuknya perfektif, dalam ratapan ini klausa tersebut dapat dipahami sebagai keadaan yang digambarkan secara hidup dan berlangsung kini. Kemungkinan makna waktu lampau dicatat dalam catatan kaki.
- source_word: וַתִּתְבֹּנֶן
  choice: dan Engkau memperhatikan
  rationale: התבונן dapat berarti memandang dengan saksama, mengamati, atau mempertimbangkan. “Memperhatikan” mempertahankan unsur pandangan yang penuh perhatian tanpa menambahkan kata “hanya”, yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: בִּי
  choice: aku
  rationale: Dengan verba “memperhatikan”, preposisi בְּ tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia; objek langsung “aku” menghasilkan ungkapan yang alami.
theological_decisions:
- issue: Apakah sikap Allah harus digambarkan lebih negatif daripada yang dinyatakan teks Ibrani
  choice: Mempertahankan keluhan bahwa Allah tidak menjawab dan memperhatikan Ayub tanpa menyatakan bahwa Allah mengabaikan atau menolak menolongnya
  alternative: “Engkau hanya memandangi aku” atau “Engkau mengabaikan aku”
  rationale: Teks menyatakan tidak adanya jawaban dan tindakan memperhatikan atau memandang, tetapi tidak secara eksplisit memakai kata “mengabaikan”, “tidak menyelamatkan”, ataupun partikel yang berarti “hanya”. Terjemahan ini menjaga ketegangan teologis dalam keluhan Ayub tanpa memperkeras tuduhannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Sapaan ilahi memakai “Engkau” dan sufiks “-Mu”. Susunan paralel mempertahankan gerak ratapan dari seruan yang tidak dijawab menuju tindakan Allah yang sekadar mengamati, tanpa menambahkan penilaian yang tidak eksplisit.
