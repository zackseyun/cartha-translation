  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: id
  text: Di sebelah kananku gerombolan bangkit[a]; mereka membuat kakiku tersingkir[b] dan membangun jalan-jalan malapetaka mereka untuk melawan aku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum muda itu bangkit.” Kata Ibrani פִּרְחַח sangat jarang dan dapat menunjuk pada kelompok muda, hina, atau tidak terkendali.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka menyuruh kakiku pergi.” Maksudnya mungkin mereka menghalau langkah Ayub, membuatnya menyimpang, atau menjegalnya.
    reason: lexical_alternative
  - marker: c
    text: Atau “mereka menimbun jalan-jalan kehancuran mereka untuk melawan aku.” Bahasa Ibrani mempertahankan metafora pembangunan jalan sebagai tindakan bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: Di sebelah kananku
  rationale: Frasa Ibrani secara harfiah berarti “di sebelah kanan.” Dalam konteks serangan yang diarahkan kepada Ayub, bentuk berpronomina ini wajar dalam bahasa Indonesia dan mempertahankan gambaran posisi para penyerang di sisi kanannya.
- source_word: פִּרְחַח
  choice: gerombolan
  rationale: Nomina langka ini menunjuk pada kelompok yang dipandang hina atau tidak terkendali, mungkin kaum muda. “Gerombolan” menyampaikan sifat kolektif dan nada penghinaan tanpa menentukan usia mereka secara pasti.
- source_word: יָקוּמוּ
  choice: bangkit
  rationale: Kata kerja קום di sini menggambarkan tindakan bangkit atau mengambil posisi secara bermusuhan. “Bangkit” mempertahankan ungkapan Ibrani dengan alami.
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: mereka menyingkirkan kakiku
  rationale: Ungkapan yang sulit ini secara harfiah kira-kira berbunyi “mereka menyuruh/melepaskan kakiku pergi.” “Menyingkirkan kakiku” mempertahankan citra kaki Ayub yang dipaksa keluar dari tempatnya, sementara catatan kaki menjaga ketidakpastian apakah maksudnya menghalau, membelokkan, atau menjegal.
- source_word: וַיָּסֹלּוּ
  choice: membangun
  rationale: Kata סלל lazim dipakai untuk menimbun atau membangun jalan. “Membangun” mempertahankan metafora pembuatan jalan dan mudah dipahami pembaca modern.
- source_word: עָלַי
  choice: untuk melawan aku
  rationale: Dalam konteks bermusuhan ini, preposisi tersebut bermakna adversatif, bukan sekadar lokasi. Ungkapan ini menyatakan bahwa jalan-jalan itu diarahkan untuk menyerang Ayub.
- source_word: אָרְחוֹת אֵידָם
  choice: jalan-jalan malapetaka mereka
  rationale: אָרְחוֹת berarti jalan atau lintasan, sedangkan אֵיד menunjuk pada malapetaka, kehancuran, atau bencana. Akhiran orang ketiga jamak dipertahankan dengan “mereka,” tanpa memastikan apakah jalan itu membawa malapetaka atau merupakan sarana serangan mereka.
