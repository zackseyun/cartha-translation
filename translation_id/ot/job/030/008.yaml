id: JOB.30.8
reference: Job 30:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּֽנֵי נָ֭בָל גַּם בְּנֵ֣י בְלִי שֵׁ֑ם נִ֝כְּא֗וּ מִן הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: id
  text: Anak-anak orang bebal, bahkan anak-anak tanpa nama[a], diusir dari negeri itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anak-anak tanpa nama” adalah ungkapan Ibrani bagi orang-orang yang tidak memiliki kedudukan atau kehormatan.
    reason: cultural_note
  - marker: b
    text: Kata Ibrani yang diterjemahkan “diusir” jarang dipakai. Kata itu juga dapat berarti “dipukul” atau “dicambuk”; dalam konteks ini, kemungkinan besar maksudnya mereka dihalau dari negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: anak-anak orang bebal
  rationale: Bentuk konstruksi harfiah ini menunjuk pada orang-orang yang termasuk golongan kaum bebal atau hina. “Bebal” mempertahankan bobot moral dan sosial נָבָל, bukan sekadar kurang cerdas.
- source_word: גַּם
  choice: bahkan
  rationale: Di sini גַּם menegaskan frasa sejajar berikutnya; “bahkan” wajar dalam bahasa Indonesia dan menyampaikan peningkatan penekanan.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: anak-anak tanpa nama
  rationale: Ungkapan Ibrani dipertahankan agar citra aslinya tetap tampak; maksud idiomatisnya ialah orang-orang tanpa kedudukan atau kehormatan.
- source_word: נִכְּאוּ
  choice: diusir
  rationale: Kata kerja langka ini dapat berkaitan dengan pemukulan keras atau penghalauan. Bersama מִן־הָאָרֶץ dan dalam konteks ini, “diusir” paling jelas menyatakan hasil berupa pengusiran tanpa meniadakan ketidakpastian leksikal, yang dicatat dalam catatan kaki.
- source_word: מִן הָאָרֶץ
  choice: dari negeri itu
  rationale: אֶרֶץ di sini paling wajar menunjuk pada wilayah tempat tinggal atau lingkungan masyarakat, bukan bumi secara kosmis. “Negeri itu” terdengar alami dan tetap mempertahankan nuansa ruang sosial-geografis.
theological_decisions: []
