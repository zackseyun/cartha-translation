  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat. Struktur paralel Ibrani dipertahankan, sedangkan verba pasif disusun secara alami. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
