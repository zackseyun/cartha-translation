  text: Perutku mendidih dan tidak juga tenang[a]; hari-hari kesengsaraan mendatangiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bagian dalam tubuhku bergolak dan tidak diam; hari-hari penderitaan menimpaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: organ-organ dalam tubuhku
  rationale: Kata ini secara harfiah menunjuk pada organ-organ bagian dalam dan secara puitis dapat menggambarkan batin atau emosi yang mendalam. Pilihan ini mempertahankan citra jasmani tanpa memakai ungkapan yang kuno atau langsung menafsirkannya sebagai 'hati'.
- source_word: רֻתְּחוּ
  choice: bergolak
  rationale: Bentuk dari רתח menyatakan mendidih atau bergejolak. 'Bergolak' terdengar alami dalam bahasa Indonesia sekaligus mempertahankan gambaran gejolak hebat di dalam tubuh.
- source_word: וְלֹא דָמּוּ
  choice: dan tidak kunjung tenang
  rationale: דמם dapat berarti diam, tenang, atau berhenti. Dalam konteks gejolak jasmani yang terus berlangsung, ungkapan ini menyampaikan keadaan yang tidak mereda sambil tetap mempertahankan keluasan maknanya.
- source_word: קִדְּמֻנִי
  choice: menghadang aku
  rationale: Dari קדם dalam arti datang ke depan atau menemui. Dengan 'hari-hari kesengsaraan' sebagai subjek yang dipersonifikasikan, 'menghadang aku' mempertahankan kesan perjumpaan yang mengancam.
- source_word: יְמֵי עֹנִי
  choice: hari-hari kesengsaraan
  rationale: עֹנִי dapat berarti penderitaan, kesengsaraan, atau kemiskinan. Dalam ratapan Ayub, 'kesengsaraan' mencakup penderitaan luas dan tidak membatasinya pada kemiskinan.
