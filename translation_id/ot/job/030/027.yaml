  naturalness: ‘Organ-organ dalam tubuhku’ terdengar agak klinis dalam puisi Indonesia modern. ‘Perutku’ adalah padanan puitis dan idiomatis yang tetap mempertahankan lokasi jasmaniah dari מֵעַי, tanpa mengalihkannya menjadi ‘hati’ atau ‘batin’. ‘Tidak juga tenang’ alami dan menyampaikan keadaan yang tidak berhenti.
  terminology: ‘Kesengsaraan’ sesuai untuk עֹנִי dalam konteks ratapan ini dan tidak membatasi makna pada kemiskinan. Tidak ada istilah teologis khusus yang perlu disesuaikan.
