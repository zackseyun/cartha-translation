translation:
  language: id
  text: Mereka diusir dari lembah[a]; orang-orang meneriaki mereka seperti meneriaki pencuri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari ngarai” atau “dari jurang”; kata Ibrani ini juga dapat berarti “tengah” dalam beberapa konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka berteriak terhadap mereka seperti terhadap pencuri.” Subjek “berteriak” tidak disebutkan secara tersurat dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן־גֵּו
  choice: dari tengah-tengah masyarakat
  rationale: מִן menyatakan pemisahan, sedangkan גֵּו dapat menunjuk bagian tengah atau lingkungan tempat seseorang berada. Dalam konteks pengucilan sosial, frasa ini paling wajar dipahami sebagai pengusiran dari tengah masyarakat, dengan alternatif geografis dicatat dalam catatan kaki.
- source_word: יְגֹרָשׁוּ
  choice: mereka diusir
  rationale: Bentuk ini menyatakan pengusiran secara paksa dan mempertahankan fokus pasif teks Ibrani pada perlakuan yang mereka alami.
- source_word: יָרִיעוּ עָלֵימוֹ
  choice: orang-orang meneriaki mereka
  rationale: Kata kerja ini berarti menaikkan teriakan, dan עַל mengarahkan teriakan itu kepada atau terhadap mereka. Subjeknya tidak dinyatakan secara eksplisit dalam bahasa Ibrani; 'orang-orang' dipakai sebagai subjek tak tentu agar bahasa Indonesia alami.
- source_word: כַּגַּנָּב
  choice: seperti meneriaki pencuri
  rationale: כְּ menyatakan perbandingan. Pengulangan tersirat dari tindakan 'meneriaki' dibuat eksplisit dalam bahasa Indonesia agar perbandingannya jelas tanpa mengubah gambaran teks.
