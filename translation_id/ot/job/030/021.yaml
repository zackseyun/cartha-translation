base_translation:
  language: en
  yaml_path: translation/ot/job/030/021.yaml
  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: id
  text: Engkau telah berubah menjadi kejam terhadapku[a]; dengan kekuatan tangan-Mu Engkau memusuhi aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkau telah menjadi tidak berbelas kasih terhadapku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Engkau menentang aku” atau “Engkau menyerang aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: telah berubah menjadi
  rationale: Bentuk Nifal di sini menyatakan perubahan keadaan. Ungkapan ini mempertahankan peralihan yang dikeluhkan Ayub tanpa memaksakan makna refleksif.
- source_word: לְאַכְזָר
  choice: kejam
  rationale: אַכְזָר menunjuk pada sifat kejam atau tanpa belas kasihan. 'Kejam' merupakan padanan langsung, alami, dan kuat dalam bahasa Indonesia.
- source_word: לִי
  choice: terhadapku
  rationale: Preposisi לְ menyatakan arah relasional. 'Terhadapku' lebih alami daripada 'kepadaku' setelah kata 'kejam' dan tidak menambahkan tafsiran yang tidak perlu.
- source_word: בְּעֹצֶם
  choice: dengan kekuatan
  rationale: עֹצֶם menyatakan kekuatan atau daya, sedangkan בְּ di sini bersifat instrumental. 'Dengan kekuatan' mempertahankan kedua unsur itu secara alami.
- source_word: יָדְךָ
  choice: tangan-Mu
  rationale: Citra konkret 'tangan' dipertahankan dan tidak diparafrasakan menjadi 'kuasa', sehingga bahasa antropomorfis Ibrani tetap tampak.
- source_word: תִשְׂטְמֵנִי
  choice: Engkau memusuhi aku
  rationale: Kata kerja שׂטם menyatakan permusuhan atau tindakan bermusuhan. 'Memusuhi aku' mempertahankan keluasan maknanya tanpa secara pasti menyempitkannya menjadi pengejaran berkepanjangan atau satu serangan tertentu.
theological_decisions:
- issue: Gambaran antropomorfis tentang tindakan Allah
  choice: Mempertahankan tuduhan langsung kepada Allah dan gambaran konkret 'tangan-Mu'.
  alternative: Melunakkan menjadi, misalnya, 'kuasa-Mu menentang aku'.
  rationale: Ratapan Ayub sengaja berbicara kepada Allah secara tajam dan relasional. Ketegangan teologis dalam keluhannya tidak boleh diredam oleh terjemahan.
- issue: Kekuatan tuduhan bahwa Allah bersikap kejam
  choice: Menerjemahkan אַכְזָר secara langsung sebagai 'kejam'.
  alternative: Menghaluskan menjadi 'keras' atau menjelaskan bahwa hal itu hanya persepsi Ayub.
  rationale: Teks menyajikan ucapan Ayub sebagai tuduhan langsung. Terjemahan harus mempertahankan daya dan ketegangannya tanpa menambahkan pembelaan teologis ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai 'Engkau' serta akhiran '-Mu'. Susunan dua klausa dan citra 'tangan' dipertahankan, sementara pilihan 'memusuhi' menjaga ambiguitas tindakan bermusuhan dalam kata Ibrani.
