base_translation:
  language: en
  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: id
  text: Mereka membongkar jalanku; mereka memperparah malapetakaku[a]. Tidak ada penolong bagi mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka membantu memajukannya”; kata kerja Ibrani dapat berarti memberi manfaat atau membantu sesuatu berlangsung, di sini kemungkinan besar malapetaka Ayub.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tanpa seorang pun membantu mereka.” Klausa Ibraninya singkat dan dapat berarti bahwa mereka bertindak tanpa bantuan atau bahwa mereka tidak mempunyai penolong.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: membongkar
  rationale: Kata kerja ini menggambarkan tindakan merobohkan atau mencabik hingga rusak. “Membongkar” cocok dengan gambaran jalur yang dirusak secara sengaja dan konkret.
- source_word: נְתִיבָתִי
  choice: jalanku
  rationale: Kata ini menunjuk pada jalan atau lintasan. “Jalanku” alami dalam bahasa Indonesia serta tetap mempertahankan kemungkinan makna harfiah dan metaforis.
- source_word: לְהַוָּתִי
  choice: malapetakaku
  rationale: Nomina ini dapat berarti kehancuran, bencana, atau malapetaka. “Malapetakaku” menyampaikan penderitaan besar yang menimpa Ayub tanpa membatasi maknanya pada kematian atau kebinasaan akhir.
- source_word: יֹעִילוּ
  choice: memperparah
  rationale: Bentuk Hifil dari יעל dapat menyatakan tindakan memberi manfaat, membantu, atau memajukan sesuatu. Dalam konteks permusuhan ini, mereka membantu berlangsungnya malapetaka Ayub; “memperparah” mengungkapkan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: Tidak ada penolong bagi mereka
  rationale: Terjemahan ini mempertahankan struktur klausa Ibrani yang singkat dan tidak memutuskan apakah mereka tidak memiliki penolong atau bertindak tanpa memerlukan bantuan.
