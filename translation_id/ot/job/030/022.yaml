base_translation:
  language: en
  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: id
  text: Engkau mengangkat aku ke dalam angin[a] dan membuat aku menungganginya; Engkau membuat aku luluh dalam badai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke atas angin.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani terakhir sangat sulit. Terjemahan “dalam badai” mengikuti salah satu pemahaman kontekstualnya; kata itu juga dapat merujuk pada kegaduhan dahsyat atau kehancuran. Bagian ini mungkin diterjemahkan, “Engkau mengombang-ambingkan aku dalam badai” atau “Engkau membuat aku luluh hingga binasa.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: Engkau mengangkat aku
  rationale: Bentuk dari נשׂא berarti ‘mengangkat, membawa, menanggung’. ‘Mengangkat aku’ mempertahankan gambaran konkret tentang Allah mengangkat Ayub, sekaligus cocok dengan gambaran angin pada klausa berikutnya.
- source_word: אֶל רוּחַ
  choice: ke dalam angin
  rationale: רוּחַ dapat berarti ‘angin’, ‘napas’, atau ‘roh’. Konteks gerak yang keras dan gambaran badai mendukung arti ‘angin’; ‘ke dalam’ menyampaikan arah yang ditandai oleh אֶל secara alami dalam bahasa Indonesia.
- source_word: תַּרְכִּיבֵנִי
  choice: membuat aku menungganginya
  rationale: Bentuk kausatif dari רכב berarti ‘membuat/menyebabkan menunggang’. Akhiran ‘-nya’ merujuk kepada angin dan menjadikan citra puitis itu jelas tanpa mengganti metaforanya.
- source_word: וּתְמֹגְגֵנִי
  choice: Engkau meluluhkan aku
  rationale: Kata kerja מוג lazimnya menyatakan tindakan melelehkan, meluluhkan, atau membuat goyah. ‘Meluluhkan aku’ mempertahankan gambaran Ayub yang seakan-akan terurai atau kehilangan keteguhan akibat serangan ilahi.
- source_word: תשוה
  choice: dalam badai
  rationale: Bentuk akhir teks Ibrani sangat sulit dan mungkin mencerminkan kata atau pembacaan yang berkaitan dengan kegaduhan dahsyat, badai, atau kehancuran. ‘Dalam badai’ sesuai dengan citra angin dalam ayat ini, tetapi ketidakpastiannya dinyatakan dalam catatan kaki.
theological_decisions:
- issue: Allah sebagai pelaku tindakan terhadap Ayub
  choice: Subjek orang kedua ‘Engkau’ dipertahankan pada kedua bagian ayat.
  alternative: Mengubahnya menjadi konstruksi pasif atau menyamarkan pelakunya.
  rationale: Teks Ibrani secara langsung menyapa Allah sebagai pelaku. Ketegangan teologis dalam keluhan Ayub tidak boleh diperhalus atau diselesaikan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. ‘Menungganginya’ mempertahankan metafora Ibrani yang mencolok, sedangkan pengulangan ‘Engkau’ menegaskan tuduhan langsung Ayub kepada Allah. Ketidakpastian tekstual pada akhir ayat tidak disembunyikan.
