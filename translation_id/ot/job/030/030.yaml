    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: kulitku
  rationale: Dalam konteks tubuh manusia, עוֹר secara alami berarti “kulit”; bentuk bersufiks menyatakan milik orang pertama tunggal.
- source_word: שָׁחַר
  choice: menghitam
  rationale: Kata kerja ini di sini menggambarkan kulit yang menjadi gelap atau hitam; “menghitam” mempertahankan perubahan keadaan itu secara ringkas dan wajar.
- source_word: מֵעָלָי
  choice: terkelupas dari tubuhku
  rationale: Secara harfiah ungkapan ini berarti “dari atasku.” Dalam konteks kulit yang sakit, terjemahan ini menyatakan kemungkinan bahwa kulit terlepas atau mengelupas, sementara catatan kaki mempertahankan ketidakpastian ungkapan Ibraninya.
- source_word: וְעַצְמִי
  choice: dan tulang-tulangku
  rationale: Walaupun bentuknya tunggal, עֶצֶם dapat dipakai secara kolektif; bentuk jamak merupakan ungkapan Indonesia yang alami untuk keseluruhan tulang tubuh.
- source_word: חָרָה
  choice: terbakar
  rationale: Kata ini menyampaikan gambaran menyala atau terbakar dan mempertahankan citraan fisik yang kuat dalam ayat ini.
- source_word: מִנִּי חֹרֶב
  choice: karena panas
  rationale: מִנִּי dapat menandai sebab, sedangkan חֹרֶב menunjuk pada panas atau kekeringan yang membakar. “Karena panas” mempertahankan arti luas tanpa memastikan bahwa yang dimaksud adalah demam.
