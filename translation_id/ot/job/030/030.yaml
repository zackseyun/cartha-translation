  text: Kulitku menghitam dan terkelupas dari tubuhku,[a] dan tulang-tulangku terbakar karena panas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kulitku menghitam pada tubuhku.” Ungkapan Ibrani ini dapat menggambarkan kulit yang menghitam dan terkelupas, atau kulit yang menghitam pada tubuh.
    reason: lexical_alternative
  - marker: b
