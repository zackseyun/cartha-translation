  yaml_path: translation/ot/job/030/018.yaml
  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: id
  text: Dengan kekuatan besar pakaianku berubah bentuk[a]; seperti lubang leher jubahku, ia membelit aku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata Ibrani yang dipakai di sini sulit. Terjemahan lain: “pakaianku berubah,” “pakaianku menjadi rusak bentuknya,” atau mungkin “pakaianku dicengkeram.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seperti mulut/lubang jubahku.” Subjek “ia” tidak disebutkan secara tegas dalam bahasa Ibrani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רָב כֹּחַ
  choice: Dengan kekuatan besar
  rationale: Frasa ini dipahami secara instrumental atau adverbial, yakni menunjukkan daya besar yang menyebabkan tindakan berikutnya.
- source_word: יִתְחַפֵּשׂ
  choice: berubah bentuk
  rationale: Bentuk hitpael ini sulit dan dapat berarti berubah atau menjadi tak dikenali. Dalam gambaran pakaian yang menyesakkan Ayub, 'berubah bentuk' mempertahankan makna dasar tanpa memastikan secara berlebihan bahwa pakaiannya rusak.
- source_word: לְבוּשִׁי
  choice: pakaianku
  rationale: Kata ini menunjuk pada pakaian secara umum; bentuk tunggal dan akhiran milik orang pertama dipertahankan.
- source_word: כְּפִי
  choice: seperti lubang leher
  rationale: Secara harfiah berarti 'seperti mulut/lubang'. Dalam konteks pakaian, yang dimaksud wajar dipahami sebagai lubang leher, sambil mempertahankan citra bagian pakaian yang mengelilingi tubuh.
- source_word: כֻתָּנְתִּי
  choice: jubahku
  rationale: Kata ini menunjuk pakaian panjang yang dikenakan dekat tubuh. 'Jubah' lebih mudah dipahami pembaca Indonesia daripada istilah pinjaman 'tunik', meskipun padanannya tidak sepenuhnya khusus.
- source_word: יַאַזְרֵנִי
  choice: ia membelit aku
  rationale: Verba אזר berarti mengikat atau melingkari tubuh. 'Membelit' menyampaikan gambaran pakaian yang mengelilingi sekaligus menyesakkan Ayub.
theological_decisions:
- issue: Subjek atau rujukan pronomina tersirat pada יַאַזְרֵנִי
  choice: ia, dengan rujukan dibiarkan mengikuti citra pakaian atau penderitaan dalam konteks
  alternative: Allah membelit aku atau pakaianku membelit aku
  rationale: Teks Ibrani tidak menyebut subjek nominal secara eksplisit. Terjemahan tidak menambahkan 'Allah' dan dengan demikian mempertahankan ketegangan serta ketidakjelasan puitisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang tetap mudah dipahami. Susunan dua baris dan citra pakaian dipertahankan; ambiguitas verba sulit serta subjek pada klausa kedua dijelaskan dalam catatan kaki.
