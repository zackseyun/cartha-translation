  yaml_path: translation/ot/job/030/025.yaml
  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: id
  text: Bukankah aku menangisi orang yang mengalami hari yang berat? Bukankah jiwaku berduka untuk orang miskin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk orang yang berkekurangan.” Ungkapan Ibrani pada baris pertama secara harfiah berbicara tentang “orang yang berat harinya” dan dapat juga dipahami sebagai “orang yang berada dalam masa kesusahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Bukankah ...?
  rationale: Dalam konteks pembelaan diri Ayub, ungkapan ini berfungsi sebagai pertanyaan retoris yang mengharapkan jawaban positif.
- source_word: בָכִיתִי
  choice: aku menangisi
  rationale: Bentuk ini menyampaikan tindakan menangis karena belas kasih terhadap seseorang dan tetap wajar dalam bahasa Indonesia.
- source_word: לִקְשֵׁה יוֹם
  choice: orang yang mengalami hari yang berat
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang 'hari yang berat' sambil memperjelas bahwa yang dimaksud ialah orang yang sedang mengalami kesusahan.
- source_word: עָגְמָה
  choice: berduka
  rationale: Kata ini mengungkapkan kesedihan atau kepedihan batin dan sejalan dengan tindakan menangis pada baris pertama.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: Pilihan ini mempertahankan ungkapan antropologis dan corak puitis Ibrani; dalam konteks ini artinya diri batin Ayub, bukan penetapan teknis mengenai hakikat jiwa.
- source_word: לָאֶבְיוֹן
  choice: karena orang miskin
  rationale: אֶבְיוֹן menunjuk kepada orang miskin atau berkekurangan; 'orang miskin' mudah dipahami dan bentuk tunggalnya bersifat representatif.
theological_decisions:
- issue: Makna antropologis נַפְשִׁי
  choice: Diterjemahkan 'jiwaku' sebagai ungkapan puitis bagi diri batin Ayub.
  alternative: aku berduka; batinku berduka
  rationale: Pilihan ini mempertahankan tekstur sumber tanpa menjadikannya pernyataan doktrinal teknis tentang jiwa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap jelas. Paralelisme kedua pertanyaan retoris dipertahankan, demikian pula gambaran khas 'hari yang berat'.
