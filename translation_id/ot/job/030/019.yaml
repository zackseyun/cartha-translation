  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: id
  text: Ia telah melemparkan aku ke dalam lumpur[a], dan aku telah menjadi seperti debu dan abu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanah liat” atau “kubangan berlumpur.” Kata Ibrani חֹמֶר dapat menunjuk pada tanah liat, lumpur, atau kubangan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “aku telah dibuat seperti debu dan abu” atau “aku disamakan dengan debu dan abu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: Ia telah melemparkan aku
  rationale: 'Bentuk Hifil dengan akhiran orang pertama tunggal menyatakan tindakan kuat terhadap Ayub: melemparkan atau mencampakkan dia. Subjek orang ketiga tunggal dinyatakan sebagai “Ia” sesuai konteks yang menunjuk kepada Allah.'
- source_word: לַחֹמֶר
  choice: ke dalam lumpur
  rationale: חֹמֶר dapat berarti tanah liat, lumpur, atau kubangan. “Lumpur” alami dalam bahasa Indonesia dan mempertahankan gambaran kehinaan dalam ratapan ini.
- source_word: וָאֶתְמַשֵּׁל
  choice: aku telah menjadi seperti
  rationale: Bentuk ini dapat dipahami secara refleksif atau pasif, yakni menjadi seperti atau disamakan dengan. Terjemahan utama menyampaikan keadaan yang dihasilkan tanpa meniadakan kemungkinan pasif.
- source_word: כֶּעָפָר וָאֵפֶר
  choice: seperti debu dan abu
  rationale: Ungkapan ini mempertahankan pasangan gambaran Ibrani tentang kefanaan dan kehinaan serta terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat pada verba orang ketiga tunggal maskulin
  choice: Menyatakannya sebagai “Ia”, yang dalam konteks merujuk kepada Allah
  alternative: 'Memakai bentuk pasif tanpa subjek: “Aku telah dilemparkan ke dalam lumpur”'
  rationale: Konteks perkataan Ayub mengidentifikasi pelaku sebagai Allah. “Ia” mempertahankan bentuk aktif dan tidak menambahkan nama yang tidak muncul secara eksplisit dalam ayat.
- issue: Nuansa וָאֶתְמַשֵּׁל
  choice: “aku telah menjadi seperti”
  alternative: “aku telah dibuat seperti” atau “aku disamakan dengan”
  rationale: Bentuk Ibrani memungkinkan nuansa keadaan yang terjadi maupun nuansa pasif. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang lugas dan bermartabat. “Ia” dipakai untuk subjek ilahi yang tersirat, sedangkan “lumpur” dipilih karena jelas bagi pembaca umum dan tetap menyampaikan gambaran kehinaan.
