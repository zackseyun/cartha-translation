lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: Menangkap daya tambah yang menegaskan satu alasan penghinaan lagi dalam perkataan Ayub.
- source_word: כֹּחַ יְדֵיהֶם
  choice: kekuatan tangan mereka
  rationale: Mempertahankan gambaran konkret Ibrani tentang kemampuan fisik dan kecakapan untuk bekerja.
- source_word: לָמָּה לִּי
  choice: apa gunanya bagiku?
  rationale: Mengungkapkan pertanyaan retoris tentang manfaat secara alami dalam bahasa Indonesia tanpa menghilangkan nada meremehkan.
- source_word: עָלֵימוֹ אָבַד
  choice: mereka telah lenyap
  rationale: עָלֵימוֹ dipahami berkaitan dengan nomina berikutnya sebagai penanda kepunyaan, sedangkan אָבַד menyatakan hilangnya sesuatu secara tuntas.
- source_word: כָּלַח
  choice: kekuatan masa dewasa
  rationale: Nomina langka ini kemungkinan menunjuk pada kematangan atau kekuatan penuh; pilihan ini mempertahankan hubungan antara usia dewasa dan daya fisik tanpa memastikan satu nuansa saja.
