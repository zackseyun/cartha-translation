  text: who pluck saltwort among the bushes[b][a], and the root of broom shrubs is their food.
translation:
  language: id
  text: yang memetik tumbuhan yang tahan garam di antara semak-semak[a], dan akar semak retama menjadi makanan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mallow”; nama tumbuhan Ibrani ini tidak pasti, tetapi mungkin menunjuk pada tumbuhan liar yang tahan garam.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “roti mereka”; kata “roti” di sini dapat berarti makanan atau sumber penghidupan secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: yang memetik
  rationale: Partisipel dari קטף menunjuk pada tindakan memetik tumbuhan; bentuk relatif ini juga meneruskan gambaran orang-orang dalam ayat sebelumnya.
- source_word: מַלּוּחַ
  choice: tumbuhan asin
  rationale: Nama tumbuhan Ibrani ini tidak pasti, tetapi kemungkinan menunjuk pada tumbuhan liar tahan garam. Ungkapan deskriptif ini lebih mudah dipahami pembaca Indonesia daripada nama botani asing.
- source_word: עֲלֵי שִׂיחַ
  choice: di antara semak-semak
  rationale: Dalam konteks ini, על kemungkinan menyatakan lokasi di kawasan semak belukar. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran orang yang mencari makanan liar.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: dan akar semak retama
  rationale: רתמים menunjuk pada sejenis semak gurun, umumnya dikenali sebagai retama atau broom. Bentuk kolektif bahasa Indonesia mempertahankan hubungan konstruksi Ibrani tanpa memaksakan kesesuaian jumlah yang kaku.
- source_word: לַחְמָם
  choice: menjadi makanan mereka
  rationale: לֶחֶם secara harfiah dapat berarti 'roti', tetapi juga dipakai dalam arti lebih luas sebagai makanan atau sumber penghidupan. Dalam konteks akar liar, 'makanan' menyampaikan maksud idiomatis dengan jelas.
