  yaml_path: translation/ot/job/030/003.yaml
  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: id
  text: Dalam kekurangan dan kelaparan, mereka kurus kering[a], mengais-ngais tanah gersang pada malam hari[b], di tempat yang telantar dan tandus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kurus kering” langka dan sulit. Kata ini juga dapat dipahami sebagai “merana”, “layu”, atau “sebatang kara”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “pada malam hari” biasanya berarti “kemarin” atau “tadi malam”; dalam konteks puisi ini kata itu dipahami lebih umum sebagai waktu malam. Kata kerja yang diterjemahkan “mengais-ngais” juga langka dan tidak pasti; beberapa penafsiran memahaminya sebagai mencari-cari atau melarikan diri ke tanah gersang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: Karena kekurangan dan kelaparan
  rationale: Kedua frasa berpreposisi ini menyatakan keadaan atau sebab penderitaan mereka. “Kekurangan dan kelaparan” alami dalam bahasa Indonesia dan mempertahankan pasangan puitisnya.
- source_word: גַּלְמוּד
  choice: kurus kering
  rationale: Kata sifat langka ini dapat menunjuk pada keadaan merana, mengering, atau sendirian. Dalam konteks kekurangan makanan, “kurus kering” menyampaikan kemerosotan jasmani tanpa membuat istilah sulit itu terlalu teknis.
- source_word: הָעֹרְקִים
  choice: mengais-ngais
  rationale: Bentuk partisip ini sangat sulit dan jarang. Dalam konteks mencari makanan di daerah tandus dan kelanjutan pada ayat 4, “mengais-ngais” menggambarkan pencarian putus asa di tanah, sambil tetap menandai ketidakpastiannya dalam catatan kaki.
- source_word: צִיָּה
  choice: tanah gersang
  rationale: Kata ini menunjuk pada kekeringan, tanah tandus, atau kawasan gersang. “Tanah gersang” konkret dan sesuai sebagai sasaran tindakan mengais-ngais.
- source_word: אֶמֶשׁ
  choice: pada malam hari
  rationale: Kata ini biasanya berarti “kemarin” atau “tadi malam”, tetapi dalam puisi di sini dapat dipahami sebagai keterangan waktu malam secara lebih umum. Pilihan ini menghasilkan gambaran yang wajar, dan arti lazimnya dicatat.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: kesunyian dan kehancuran
  rationale: Pasangan kata ini melukiskan keadaan telantar, porak-poranda, dan tandus. Ungkapan Indonesia ini mempertahankan intensifikasi puitis tanpa memaksakan perbedaan makna yang terlalu tajam antara kedua istilah.
