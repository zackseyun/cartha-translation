    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menyatakan alasan atau penjelasan bagi ratapan Ayub dalam konteks ini.
- source_word: טוֹב
  choice: yang baik
  rationale: Kata sifat ini dipakai sebagai nomina untuk segala sesuatu yang baik atau menguntungkan, tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: קִוִּיתִי
  choice: aku mengharapkan
  rationale: Mengungkapkan penantian yang disertai harapan dan cocok dengan objek 'yang baik'.
- source_word: וַיָּבֹא
  choice: datang
  rationale: Mempertahankan pengulangan verba Ibrani dan pembalikan yang tajam dalam kedua bagian ayat.
- source_word: רָע
  choice: malapetaka
  rationale: Dalam konteks ratapan Ayub, kata ini menunjuk pada kemalangan atau bencana yang menimpanya, bukan terutama kejahatan moral.
- source_word: אֲיַחֲלָה
  choice: aku menantikan
  rationale: Menyampaikan penantian penuh harap sekaligus membedakannya secara alami dari verba pada baris pertama.
- source_word: לְאוֹר
  choice: terang
  rationale: Mempertahankan citra sumber yang dapat membawa makna harfiah maupun metaforis.
- source_word: אֹפֶל
  choice: kegelapan
  rationale: Mempertahankan pertentangan langsung dengan 'terang' serta bobot suasana muram dari istilah Ibrani.
theological_decisions:
- issue: 'Makna רָע: kejahatan moral atau kemalangan'
  choice: malapetaka
  alternative: kejahatan; keburukan; bencana
  rationale: Konteks penderitaan Ayub mendukung arti kemalangan atau bencana. Pilihan ini menghindari kesan bahwa yang datang terutama adalah kejahatan moral, sambil mempertahankan kontras dengan 'yang baik'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara sederhana. Paralelisme serta pengulangan 'datang' dipertahankan. 'Yang baik' dipakai agar substansivasi טוֹב terdengar alami, sedangkan 'malapetaka' menjelaskan nuansa kontekstual רָע tanpa meniadakan alternatif leksikal dalam catatan kaki.
