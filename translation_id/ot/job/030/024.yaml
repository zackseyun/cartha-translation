  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: id
  text: Tentu, tidak seorang pun mengulurkan tangan terhadap reruntuhan[a], jika dalam bencananya ada seruan minta tolong bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tentu, tidak seorang pun mengulurkan tangan ke timbunan reruntuhan; jika dalam bencananya ada seruan minta tolong bagi mereka.” Teks Ibrani ayat ini sangat sulit, terutama ungkapan yang diterjemahkan “terhadap reruntuhan” dan bentuk pronominal “bagi mereka,” yang rujukannya tidak jelas.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Namun, bukankah
  rationale: אַךְ dapat bersifat penegas atau adversatif. Dalam konteks pembelaan Ayub, bentuk ini menyampaikan peralihan sekaligus penegasan retoris secara alami tanpa menjadikannya sekadar pembatas 'hanya'.
- source_word: בְּעִי
  choice: terhadap reruntuhan
  rationale: Bentuk ini langka dan sulit, tetapi kemungkinan menunjuk pada kehancuran atau timbunan reruntuhan. 'Terhadap reruntuhan' mempertahankan gambaran dan kemungkinan arah tindakan bermusuhan dalam idiom berikutnya.
- source_word: יִשְׁלַח יָד
  choice: mengulurkan tangan
  rationale: Terjemahan ini mempertahankan ungkapan konkret Ibrani; konteks memungkinkan makna menyerang tanpa mengganti metaforanya dengan penafsiran eksplisit.
- source_word: אִם
  choice: jika
  rationale: Partikel ini dipertahankan sebagai penghubung bersyarat karena hubungan sintaksis kedua klausa tidak pasti.
- source_word: בְּפִידוֹ
  choice: dalam bencananya
  rationale: פִיד berarti bencana atau malapetaka; frasa ini juga mempertahankan preposisi dan sufiks orang ketiga.
- source_word: לָהֶן
  choice: tidak diterjemahkan secara tersendiri dalam teks utama
  rationale: Bentuk pronominal ini sangat sulit dijelaskan dalam konteks dan rujukannya tidak jelas. Memaksakan 'dari mereka' akan menghasilkan bahasa Indonesia yang kabur tanpa kepastian tekstual; masalahnya dicatat dalam catatan kaki.
- source_word: שׁוּעַ
  choice: berseru meminta pertolongan
  rationale: Nomina ini menunjuk pada seruan minta tolong. Bentuk verbal menghasilkan bahasa Indonesia yang wajar sambil mempertahankan isinya.
