base_translation:
  language: en
  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: id
  text: Kecapiku[a] pun telah menjadi ratapan, dan serulingku[b] menjadi suara orang-orang yang menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harpaku.” Kata Ibrani כִּנּוֹר menunjuk pada alat musik petik sejenis lira atau harpa.
    reason: lexical_alternative
  - marker: b
    text: Atau “alat musik tiupku.” Kata Ibrani עוּגָב menunjuk pada alat musik tiup, tetapi bentuk tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: pun telah menjadi
  rationale: Bentuk wayyiqtol dari היה menyatakan perubahan menuju keadaan yang dihasilkan. “Telah menjadi” mempertahankan akibat yang kini dirasakan Ayub, sedangkan “pun” menghubungkannya secara alami dengan uraian sebelumnya.
- source_word: לְאֵבֶל
  choice: ratapan
  rationale: אֵבֶל menunjuk pada perkabungan atau ungkapan dukacita. “Ratapan” cocok dengan citra alat musik yang kini menyuarakan kesedihan.
- source_word: כִּנֹּרִי
  choice: kecapiku
  rationale: כִּנּוֹר adalah alat musik petik kuno sejenis lira atau harpa. “Kecapi” merupakan padanan Indonesia yang lazim tanpa menyamakannya secara pasti dengan harpa modern.
- source_word: וְעֻגָבִי
  choice: dan serulingku
  rationale: עוּגָב adalah alat musik tiup yang bentuk tepatnya tidak diketahui. “Seruling” alami dan mudah dipahami, sementara catatan kaki mempertahankan ketidakpastian historisnya.
- source_word: לְקוֹל
  choice: menjadi suara
  rationale: קוֹל dapat berarti suara atau bunyi. Pengulangan tersirat dari “menjadi” menghasilkan bahasa Indonesia yang jelas sekaligus mempertahankan metafora perubahan alat musik menjadi suara tangisan.
- source_word: בֹּכִים
  choice: orang-orang yang menangis
  rationale: Partisipel jamak ini menunjuk kepada orang-orang yang sedang menangis. Padanan ini mempertahankan rujukan personal dan bentuk jamaknya.
theological_decisions: []
