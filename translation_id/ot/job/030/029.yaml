  yaml_path: translation/ot/job/030/029.yaml
  text: I have become a brother to jackals[a], and a companion to ostriches.
translation:
  language: id
  text: Aku telah menjadi saudara bagi jakal-jakal dan sahabat bagi burung-burung unta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “putri-putri burung unta,” suatu ungkapan Ibrani yang berarti burung-burung unta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: saudara
  rationale: Makna harfiahnya adalah “saudara”; pilihan ini mempertahankan metafora tentang kedekatan dan kesamaan nasib dengan makhluk-makhluk tempat sunyi.
- source_word: הָיִיתִי
  choice: telah menjadi
  rationale: Bentuk perfektif orang pertama tunggal dari היה menyatakan keadaan yang terjadi dan kini dialami Ayub; “telah menjadi” alami dalam konteks ratapan.
- source_word: לְתַנִּים
  choice: bagi serigala gurun
  rationale: תַנִּים dalam puisi tentang kehancuran kemungkinan besar menunjuk pada jakal. “Serigala gurun” merupakan sebutan Indonesia yang mudah dipahami untuk hewan tersebut dan menjaga citra kawasan tandus.
- source_word: וְרֵעַ
  choice: dan kawan
  rationale: רֵעַ dapat berarti kawan atau teman sepergaulan. “Kawan” membentuk paralel yang wajar dengan “saudara” tanpa menambahkan keintiman emosional yang tidak pasti.
- source_word: לִבְנוֹת יַעֲנָה
  choice: bagi burung unta
  rationale: Ungkapan Ibrani harfiah “anak-anak perempuan burung unta” secara idiomatis menunjuk pada burung-burung unta; referennya diterjemahkan secara alami dan bentuk harfiahnya dicatat.
