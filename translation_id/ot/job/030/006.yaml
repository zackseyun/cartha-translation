  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: id
  text: Mereka tinggal di ngarai-ngarai wadi[a], di lubang-lubang tanah dan di antara batu-batu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di lembah-lembah alur sungai”. Kata Ibrani נְחָלִים dapat menunjuk pada wadi, alur sungai musiman, atau lembah, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “di lubang-lubang tanah dan di antara tebing-tebing batu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: di ngarai-ngarai
  rationale: Kata עָרוּץ menunjuk pada alur atau jurang yang tererosi. “Ngarai-ngarai” menyampaikan bentuk medan yang terpotong oleh aliran air dengan bahasa Indonesia yang wajar.
- source_word: נְחָלִים
  choice: wadi
  rationale: Kata נַחַל dalam konteks geografis ini umumnya menunjuk pada alur sungai musiman. “Wadi” mempertahankan ciri khas bentang alam Timur Dekat; alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: לִשְׁכֹּן
  choice: mereka tinggal
  rationale: Infinitif לִשְׁכֹּן menyatakan tindakan menghuni dalam rangkaian deskripsi ini. Bentuk finit “mereka tinggal” paling alami dalam bahasa Indonesia.
- source_word: חֹרֵי
  choice: lubang-lubang
  rationale: Bentuk jamak konstruksi dari חוֹר berarti lubang atau rongga. “Lubang-lubang” mempertahankan gambaran tempat tinggal yang hina dan tidak menambahkan kesan gua yang luas.
- source_word: עָפָר
  choice: tanah
  rationale: עָפָר dapat berarti debu atau tanah gembur. Dalam gabungan “lubang-lubang tanah”, “tanah” menghasilkan ungkapan Indonesia yang alami tanpa menghilangkan citra hunian di dalam bumi.
- source_word: וְכֵפִים
  choice: dan di antara batu-batu cadas
  rationale: כֵפִים menunjuk pada batu-batu besar atau tebing cadas. Preposisi lokatif dibuat eksplisit agar paralel dengan frasa sebelumnya dan alami dalam bahasa Indonesia.
