  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: id
  text: Aku berjalan dalam keadaan muram[a], bukan karena matahari[b]; aku bangkit dalam kumpulan orang dan berseru minta tolong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "berkabung" atau "menghitam." Kata Ibrani ini dapat menggambarkan dukacita maupun penampilan yang menggelap.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "bukan oleh matahari." Maksudnya, keadaan Ayub yang muram atau menggelap itu bukan disebabkan oleh paparan matahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: dengan tubuh menghitam
  rationale: Partisipel dari קדר dapat menunjuk pada keadaan gelap atau menghitam serta berkabung. Ungkapan ini mempertahankan gambaran lahiriah tanpa meniadakan nuansa dukacita.
- source_word: הִלַּכְתִּי
  choice: Aku berjalan ke mana-mana
  rationale: Bentuk ini menggambarkan gerak atau keadaan hidup Ayub dalam ratapan yang hidup; kala kini bahasa Indonesia wajar untuk konteks tersebut.
- source_word: בְּלֹא חַמָּה
  choice: tetapi bukan karena matahari
  rationale: Secara harfiah berarti 'bukan oleh/tanpa matahari'. Dalam konteks, frasa ini menyangkal bahwa keadaan menghitam itu disebabkan oleh matahari, sambil mempertahankan kontras teks Ibrani.
- source_word: קַמְתִּי
  choice: aku berdiri
  rationale: קום menyatakan tindakan bangkit atau berdiri untuk menyampaikan seruan di depan orang banyak.
- source_word: בַקָּהָל
  choice: di tengah kumpulan orang
  rationale: קהל berarti kelompok yang berhimpun. Pilihan ini alami dalam bahasa Indonesia dan tidak memasukkan konotasi kelembagaan atau gerejawi.
- source_word: אֲשַׁוֵּעַ
  choice: berteriak minta tolong
  rationale: שוע dalam bentuk Piel menyampaikan seruan putus asa untuk memperoleh pertolongan.
