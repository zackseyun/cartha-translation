  yaml_path: translation/ot/job/030/010.yaml
  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: id
  text: Mereka merasa jijik terhadap aku dan menjauh dariku; mereka tidak menahan diri untuk meludahi wajahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari hadapanku mereka tidak menahan ludah.” Ungkapan Ibrani ini menggambarkan tindakan penghinaan terang-terangan yang diarahkan secara pribadi kepada Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: mereka merasa jijik terhadap aku
  rationale: Kata kerja תעב menyatakan rasa jijik atau muak yang kuat. Ungkapan ini mempertahankan intensitas penolakan tanpa terdengar kuno dalam bahasa Indonesia modern.
- source_word: רָחֲקוּ מֶנִּי
  choice: menjauh dariku
  rationale: רחק berarti berada atau menjadi jauh. Pilihan ini secara wajar mencakup tindakan menjaga jarak, baik secara fisik maupun sosial.
- source_word: וּמִפָּנַי
  choice: wajahku
  rationale: Secara harfiah berarti 'dari wajahku/hadapanku'. Dalam kaitannya dengan ludah, 'wajahku' menyampaikan bahwa penghinaan itu diarahkan secara pribadi kepada Ayub.
- source_word: לֹא חָשְׂכוּ
  choice: mereka tidak menahan diri
  rationale: חשׂך berarti menahan, tidak memberikan, atau tidak melakukan sesuatu. Dalam konteks ini, 'tidak menahan diri' menyatakan bahwa mereka sama sekali tidak membatasi tindakan menghina tersebut.
- source_word: רֹק
  choice: meludahi
  rationale: רֹק adalah ludah. Bentuk verbal 'meludahi' menghasilkan kalimat Indonesia yang alami sambil menyampaikan tindakan penghinaan secara jelas.
