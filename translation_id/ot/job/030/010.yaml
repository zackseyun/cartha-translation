  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dua tindakan dipertahankan, sedangkan ungkapan tentang ludah dibuat alami dalam bahasa Indonesia tanpa menghilangkan citra penghinaan langsung.
