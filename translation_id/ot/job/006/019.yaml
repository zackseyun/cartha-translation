translation:
  language: id
  text: Kafilah-kafilah dari Tema memandang; para musafir dari Syeba menantikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengharapkannya.” Kata Ibrani ini dapat berarti berharap atau menunggu dengan penuh harap. Kata “-nya” merujuk pada aliran-aliran air musiman dalam ayat-ayat sebelumnya.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: mencari-carinya
  rationale: Secara dasar berarti ‘memandang’ atau ‘menatap’. Dalam konteks kafilah yang mengharapkan aliran air, ‘mencari-carinya’ mengungkapkan pandangan yang diarahkan dengan saksama; akhiran -nya memasok objek yang tersirat dari konteks sebelumnya.
- source_word: אָרְחוֹת
  choice: kafilah-kafilah
  rationale: Kata ini secara harfiah dapat berarti ‘jalan-jalan’ atau ‘jalur-jalur’, tetapi di sini dipakai secara metonimis bagi rombongan yang menempuh jalur itu, sejajar dengan הֲלִיכֹת pada baris kedua.
- source_word: תֵּמָא
  choice: Tema
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan dekat dengan teks sumber.
- source_word: הֲלִיכֹת
  choice: para musafir
  rationale: Secara harfiah berkaitan dengan ‘perjalanan’ atau ‘rombongan yang berjalan’; dalam konteks ini menunjuk kepada orang-orang yang melakukan perjalanan dan membentuk kesejajaran dengan kafilah pada baris pertama.
- source_word: שְׁבָא
  choice: Syeba
  rationale: Nama tempat ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: קִוּוּ
  choice: menantikannya dengan penuh harap
  rationale: Verba קוה mencakup nuansa menunggu dengan pengharapan. Ungkapan ini mempertahankan kedua unsur maknanya tanpa memilih salah satu secara sempit.
- source_word: לָמוֹ
  choice: -nya
  rationale: Pronomina jamak ini kemungkinan merujuk kepada aliran-aliran musiman dalam ayat-ayat sebelumnya. Bahasa Indonesia dapat memakai akhiran tunggal -nya secara alami untuk rujukan tersebut tanpa menentukan anteseden lebih jauh daripada teks.
