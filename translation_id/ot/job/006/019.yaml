translation_notes:
  register: Bahasa Indonesia modern yang puitis namun mudah dipahami. ‘Kafilah’ mempertahankan latar perdagangan gurun, sedangkan ‘musafir’ memberi variasi alami dalam paralelisme. Ambiguitas קוה antara berharap dan menunggu dipertahankan dalam teks utama dan dijelaskan dalam catatan.
