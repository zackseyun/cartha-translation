  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: id
  text: Ah, sekiranya permohonanku terkabul, dan Allah mengaruniakan apa yang kuharapkan![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ah, sekiranya permohonanku datang, dan Allah memberikan harapanku!”'
    reason: Menunjukkan metafora dan susunan teks Ibrani yang diperlancar dalam teks utama.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah, sekiranya
  rationale: Ungkapan idiomatis ini menyatakan harapan yang kuat, bukan pertanyaan harfiah. Pilihan ini alami dalam ratapan bahasa Indonesia dan mempertahankan nada kerinduan.
- source_word: תָּבוֹא שֶׁאֱלָתִי
  choice: permohonanku terkabul
  rationale: Secara harfiah berarti ‘permohonanku datang’, tetapi dalam bahasa Indonesia maksud idiomatisnya paling alami disampaikan sebagai permohonan yang terkabul.
- source_word: וְתִקְוָתִי
  choice: apa yang kuharapkan
  rationale: תִּקְוָה dapat berarti harapan, pengharapan, atau hal yang dinantikan. Dalam konstruksi dengan ‘memberikan’, bentuk ini menghasilkan bahasa Indonesia yang jelas tanpa menghilangkan objek harapan Ayub.
- source_word: יִתֵּן
  choice: mengaruniakan
  rationale: Makna dasarnya ialah ‘memberikan’. ‘Mengaruniakan’ sesuai untuk Allah sebagai pemberi dan untuk objek berupa sesuatu yang diharapkan, dengan register yang bermartabat.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: Bentuk tunggal ini berarti ‘Allah/God’ dan tidak mengandung unsur leksikal ‘Yang Mahakuasa’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Seruan ‘Ah, sekiranya’ mempertahankan nada ratapan yang kuat; ‘terkabul’ dan ‘apa yang kuharapkan’ membuat idiom Ibrani dapat dipahami pembaca umum.
