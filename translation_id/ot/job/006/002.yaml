  text: Oh[a], that my vexation were fully weighed[b], and my calamity lifted together in the balances.
translation:
  language: id
  text: Ah, sekiranya kekesalanku[a] sungguh-sungguh ditimbang, dan malapetakaku diangkat bersama-sama di atas timbangan!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepedihan batinku” atau “amarahku.” Kata Ibrani ini dapat menyatakan kekesalan, penderitaan batin, atau amarah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: Ah, sekiranya
  rationale: Partikel ini mengungkapkan harapan yang kuat dalam nada ratapan; gabungan ini alami dalam bahasa Indonesia dan mempertahankan daya emosionalnya.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: benar-benar ditimbang
  rationale: Infinitif absolut yang diikuti verba finit menguatkan tindakan menimbang; 'benar-benar' menyampaikan penekanan itu dengan wajar.
- source_word: כַּעְשִׂי
  choice: kekesalanku
  rationale: Nomina ini dapat menunjuk pada kekesalan, kepedihan batin, atau amarah. 'Kekesalan' cukup luas untuk konteks ratapan Ayub tanpa membatasinya pada kesedihan atau amarah saja.
- source_word: וְהַוָּתִי
  choice: dan malapetakaku
  rationale: Kata ini menunjuk pada bencana, kehancuran, atau kemalangan; 'malapetaka' mempertahankan sisi objektif penderitaan Ayub.
- source_word: בְּמֹאזְנַיִם
  choice: pada neraca
  rationale: Bentuk dual ini menunjuk pada alat penimbang. 'Pada neraca' merupakan ungkapan Indonesia yang alami untuk citra penimbangan.
- source_word: יִשְׂאוּ
  choice: diangkat
  rationale: Makna dasarnya ialah mengangkat atau membawa. Bentuk pasif Indonesia mempertahankan citra beban yang diangkat pada neraca tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: יָחַד
  choice: bersamanya
  rationale: Kata ini menyatakan bahwa kekesalan dan malapetaka Ayub ditimbang bersama-sama; bentuk pronominal membuat hubungan itu jelas dan alami dalam bahasa Indonesia.
