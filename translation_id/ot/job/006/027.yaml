  source_fidelity: Makna utama yang dipilih—tuduhan bahwa mereka memperlakukan anak yatim dan sahabat sebagai objek undian serta tawar-menawar—dapat dipertahankan. Namun, “membuang undi” memerlukan pelengkap yang lebih idiomatis daripada “atas anak yatim”; “mengenai anak yatim” menyampaikan bahwa anak yatim itu menjadi objek undian tanpa menyiratkan manfaat bagi mereka. Verba kedua memang sulit, sehingga pilihan “menawar-nawar” dan alternatifnya perlu tetap diberi catatan.
  naturalness: Susunan “atas anak yatim kamu membuang undi” dan terutama “atas sahabatmu kamu menawar-nawar” terasa kaku dalam bahasa Indonesia modern. Urutan yang lebih langsung dan penggunaan “mengenai” pada klausa pertama menghasilkan bahasa baku yang jelas, sambil tetap mempertahankan nada kecaman puitis.
  terminology: “Anak yatim” dan “sahabatmu” tepat dan sesuai register. “Membuang undi” merupakan padanan Alkitabiah yang dapat dipahami. “Menawar-nawar sahabatmu” dengan sengaja mempertahankan kesan dehumanisasi yang ada pada pembacaan utama atas verba Ibrani yang sukar.
  issues:
