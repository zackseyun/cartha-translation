  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: id
  text: Bahkan, kamu membuang undi mengenai anak yatim[a], dan menawar-nawar sahabatmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bahkan kamu menjatuhkan undi atas anak yatim.” Ungkapan Ibraninya secara harfiah berarti “membuat jatuh atas anak yatim.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan menggali lubang bagi sahabatmu.” Kata kerja Ibrani di sini sulit dipastikan; banyak penafsir memahaminya sebagai menawar-nawar atau mengambil keuntungan dari seorang sahabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: bahkan
  rationale: Kata ini memperkuat tuduhan dan menunjukkan peningkatan yang mengejutkan dalam kecaman Ayub.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Istilah ini menunjuk kepada orang yang kehilangan ayah dan karena itu termasuk golongan rentan; 'anak yatim' merupakan ungkapan Indonesia yang wajar dan jelas.
- source_word: תַּפִּילוּ
  choice: membuang undi
  rationale: Bentuk kausatif dari נפל dengan עַל kemungkinan besar merupakan idiom tentang membuat undi jatuh atas seseorang, yaitu membuang undi atasnya.
- source_word: תִכְרוּ
  choice: menawar-nawar
  rationale: Kata Ibrani ini sulit. Dalam paralelisme ini, makna tawar-menawar paling mungkin menggambarkan perlakuan terhadap sahabat sebagai objek keuntungan, tetapi alternatif 'menggali lubang' tetap dicatat.
- source_word: רֵיעֲכֶם
  choice: sahabatmu
  rationale: רֵעַ dapat berarti sahabat, teman, atau sesama; dalam teguran langsung Ayub kepada kawan-kawannya, 'sahabatmu' menonjolkan pengkhianatan relasional.
- source_word: עַל ... עַל
  choice: atas ... atas
  rationale: Pengulangan 'atas' mempertahankan preposisi yang sama dalam kedua bagian dan menjaga bentuk paralel teks Ibrani.
