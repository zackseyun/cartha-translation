    issue: Konstruksi “atas anak yatim kamu membuang undi” tidak idiomatis.
    rationale: Dalam bahasa Indonesia, “membuang undi atas” terdengar janggal. “Membuang undi mengenai anak yatim” lebih alami dan tidak mengubah anak yatim menjadi penerima/manfaat tindakan itu.
  - severity: medium
    issue: Konstruksi “atas sahabatmu kamu menawar-nawar” tidak lengkap dan sulit dipahami.
    rationale: Verba transitif “menawar-nawar” lebih wajar langsung diikuti objeknya. Bentuk “menawar-nawar sahabatmu” secara tajam menyampaikan perlakuan terhadap sahabat sebagai barang tawaran.
  - severity: low
    issue: Catatan kaki a menggunakan “bagi anak yatim”.
    rationale: “Bagi” dapat dibaca sebagai tindakan demi kepentingan anak yatim, padahal idiom Ibrani menunjuk pada tindakan yang dikenakan atau diarahkan kepada mereka. “Atas anak yatim” lebih dekat untuk penjelasan literal.
