lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: Selamatkanlah aku
  rationale: Bentuk imperatif Hifil orang kedua jamak dengan akhiran orang pertama tunggal dari מלט meminta para sahabat Ayub membuatnya lolos dari bahaya. “Selamatkanlah aku” alami dalam bahasa Indonesia dan tetap dibedakan dari פדה pada bagian kedua.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan Ibrani ini menunjuk pada kuasa atau kendali seseorang. Bentuk konkret “dari tangan” tetap jelas dan mempertahankan citra teks sumber.
- source_word: צָר
  choice: lawan
  rationale: Kata benda tunggal ini berarti pihak yang bermusuhan atau memusuhi. “Lawan” mempertahankan bentuk tunggal dan tidak mempersempitnya menjadi konteks perang.
- source_word: עָרִיצִים
  choice: orang-orang kejam
  rationale: Bentuk jamak ini menunjuk kepada orang-orang yang bengis, keras, atau menindas. “Orang-orang kejam” alami, mempertahankan bentuk jamak, dan tidak memberi nuansa politik khusus seperti “para tiran”.
- source_word: תִּפְדּוּנִי
  choice: Tebuslah aku
  rationale: Bentuk imperfek Qal orang kedua jamak dengan akhiran orang pertama tunggal dari פדה berfungsi dalam rangkaian permintaan dan berarti membebaskan atau melepaskan, sering dengan gagasan tebusan. “Tebuslah aku” mempertahankan perbedaan leksikal dari מלט.
theological_decisions:
- issue: Pemaknaan פדה dalam konteks yang bukan kultis atau soteriologis
  choice: Tebuslah aku
  alternative: Bebaskanlah aku; bayarlah tebusan untuk membebaskan aku
  rationale: Kata kerja Ibrani ini dapat menyatakan pembebasan nyata dari bahaya atau kuasa orang lain dan tidak dengan sendirinya menunjuk pada keselamatan rohani. “Tebuslah” mempertahankan kekuatan serta kekhasan katanya tanpa menambahkan klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai kelanjutan pertanyaan retoris dari ayat sebelumnya. Tanda kutip menampilkan dua permintaan yang menurut Ayub tidak pernah ia ajukan; pengulangan “tangan” mempertahankan paralelisme dan citra Ibrani.
