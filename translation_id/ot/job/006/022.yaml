base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: id
  text: Pernahkah aku berkata, “Berilah aku,” atau, “Dari harta kalian[a], berilah suap untukku[b]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari kekuatan kalian.” Dalam konteks ini, kata Ibrani itu mungkin berarti kemampuan materi, sumber daya, atau kekayaan.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini berkaitan dengan kata untuk “suap.” Kata itu juga dapat dipahami lebih umum sebagai memberikan suatu pemberian atau pembayaran untuk Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: Pernahkah aku berkata
  rationale: Partikel tanya memperkenalkan pertanyaan retoris yang menyangkal bahwa Ayub pernah mengajukan permintaan semacam itu. “Pernahkah” menyampaikan daya sangkal tersebut secara alami tanpa mengubah אָמַרְתִּי, “aku berkata,” menjadi “aku meminta.”
- source_word: הָבוּ לִי
  choice: Berilah aku
  rationale: Bentuk imperatif jamak ditujukan kepada para sahabat Ayub. Objek pemberian tidak dinyatakan dalam bahasa Ibrani, sehingga terjemahan tidak menambah “sesuatu” atau “uang.”
- source_word: וּמִכֹּחֲכֶם
  choice: Dari harta kalian
  rationale: כֹּחַ secara dasar berarti “kekuatan” atau “kemampuan,” tetapi dalam konteks pengeluaran untuk suatu pemberian atau suap, kata ini kemungkinan menunjuk pada kemampuan materi atau harta. Catatan kaki mempertahankan makna harfiahnya.
- source_word: שִׁחֲדוּ
  choice: berilah suap
  rationale: Kata kerja ini berhubungan dengan kata benda שֹׁחַד, “suap” atau pemberian yang dimaksudkan untuk memengaruhi. “Berilah suap” mempertahankan nuansa transaksional dan kemungkinan muatan moralnya.
- source_word: בַעֲדִי
  choice: demi aku
  rationale: Preposisi ini menyatakan tindakan yang dilakukan untuk kepentingan atau atas nama Ayub. “Demi aku” ringkas dan alami dalam konteks ini.
theological_decisions:
- issue: Apakah tindakan yang diminta merupakan suap dalam arti tercela atau pemberian/pembayaran yang lebih umum
  choice: Teks utama memakai “suap,” dengan alternatif “pemberian atau pembayaran” dalam catatan kaki.
  alternative: pemberian; pembayaran
  rationale: Akar katanya mendukung arti “suap,” tetapi konteks tidak menjelaskan penerima maupun tujuan pembayaran itu. Karena itu, terjemahan mempertahankan istilah kuat dalam teks utama tanpa menutup kemungkinan arti yang lebih umum.
translation_notes:
  register: Bahasa Indonesia modern dan bermartabat. Kata ganti “aku” dan “kalian” mempertahankan tuturan langsung Ayub kepada beberapa sahabat. Susunan dua kutipan dipertahankan untuk mencerminkan dua tuntutan hipotetis dalam teks Ibrani.
