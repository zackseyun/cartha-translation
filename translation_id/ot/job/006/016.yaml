  yaml_path: translation/ot/job/006/016.yaml
  text: which are dark from ice[a], and on them the snow conceals itself.
translation:
  language: id
  text: yang menjadi gelap karena es[a], dan di atasnya salju menyembunyikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang menjadi keruh karena es”; partisipel Ibrani terutama berarti “gelap” atau “menjadi gelap”, tetapi dalam konteks ini mungkin menggambarkan air yang menjadi keruh akibat keadaan musim dingin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: yang menjadi gelap
  rationale: Partisipel dari קדר pada dasarnya menggambarkan keadaan menjadi gelap atau suram. Ungkapan ini mempertahankan gambaran visual dan sifat verbal bentuk Ibraninya.
- source_word: מִנִּי
  choice: karena
  rationale: Preposisi ini dapat menyatakan sumber atau sebab; dalam konteks ini, es dipahami sebagai penyebab aliran-aliran itu menjadi gelap.
- source_word: קָרַח
  choice: es
  rationale: Kata ini dapat berarti es atau embun beku. 'Es' paling sesuai dengan gambaran musim dingin dan penyebutan salju pada baris berikutnya.
- source_word: עָלֵימוֹ
  choice: di atasnya
  rationale: Preposisi dengan akhiran orang ketiga jamak merujuk kepada aliran-aliran yang dibicarakan sebelumnya. Dalam bahasa Indonesia, rujukan jamak tak bernyawa dapat dinyatakan secara alami dengan '-nya'.
- source_word: יִתְעַלֶּם
  choice: menyembunyikan diri
  rationale: Bentuk hitpael dari עלם menyampaikan nuansa refleksif, yaitu bersembunyi atau menyembunyikan diri; pilihan ini mempertahankan personifikasi puitisnya.
- source_word: שָׁלֶג
  choice: salju
  rationale: Nomina ini berarti salju. Tanpa kata sandang, 'salju' merupakan bentuk generik yang alami dalam bahasa Indonesia.
