base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: id
  text: Apakah kamu bermaksud menegur kata-kata, seakan-akan perkataan orang yang putus asa seperti angin?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kamu bermaksud mengoreksi kata-kata belaka dan menganggap perkataan orang yang putus asa sebagai angin?” Susunan bahasa Ibrani memungkinkan klausa kedua dipahami sebagai pernyataan (“perkataan orang yang putus asa seperti angin”) atau sebagai bagian dari hal yang ditegur (“menganggap ... sebagai angin”).
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: menegur
  rationale: Infinitif יכח menyatakan tindakan mengoreksi atau menyanggah secara evaluatif. “Menegur” mempertahankan nada konfrontatif tanpa menjadi terlalu teknis.
- source_word: מִלִּים
  choice: kata-kata
  rationale: Padanan langsung yang mempertahankan ungkapan ringkas dan tidak menambahkan nuansa “sekadar” yang tidak dinyatakan secara eksplisit.
- source_word: תַּחְשֹׁבוּ
  choice: kamu bermaksud
  rationale: חשב dapat berarti memikirkan, memperhitungkan, atau merencanakan. Dalam pertanyaan retoris ini, “bermaksud” secara alami mengungkapkan niat para sahabat untuk menegur.
- source_word: וּ֝/לְ/ר֗וּחַ
  choice: untuk angin
  rationale: Terjemahan ini mempertahankan citra רוּחַ sebagai angin serta keluwesan fungsi preposisi ל, yang dapat menyiratkan bahwa perkataan itu berlalu atau tidak berbobot.
- source_word: אִמְרֵי
  choice: perkataan
  rationale: Bentuk konstruksi jamak dari אמר. “Perkataan” alami dalam bahasa Indonesia dan tetap dekat dengan pengulangan gagasan “kata-kata” pada klausa pertama.
- source_word: נֹאָשׁ
  choice: orang yang putus asa
  rationale: Partisipel Nifal ini menunjuk kepada seseorang yang telah kehilangan harapan. Frasa ini jelas, wajar, dan mempertahankan daya personal bentuk tunggalnya.
theological_decisions:
- issue: Hubungan sintaksis klausa kedua dengan tindakan menegur
  choice: 'Klausa kedua dibaca sebagai pernyataan: perkataan orang yang putus asa adalah “untuk angin.”'
  alternative: 'Klausa kedua dapat menjadi bagian dari sasaran teguran: para sahabat memperlakukan perkataan orang yang putus asa sebagai angin.'
  rationale: Sintaksis Ibrani memungkinkan kedua pembacaan. Teks utama mengikuti pembacaan pernyataan, sedangkan catatan kaki mempertahankan alternatif agar ketegangan dan ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Bentuk “kamu” dipakai karena verba Ibrani ditujukan kepada para sahabat dalam bentuk jamak, tetapi bahasa Indonesia tidak menandai jumlah; konteks menyediakan rujukannya. Citra “angin” dipertahankan dan ambiguitas sintaksis dijelaskan dalam catatan kaki.
