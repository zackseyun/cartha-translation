  text: שֻֽׁבוּ נָ֭א אַל תְּהִ֣י עַוְלָ֑ה ו/שבי ע֝וֹד צִדְקִ/י בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: id
  text: Tinjaulah kembali[a], aku mohon; jangan sampai ada ketidakadilan. Tinjaulah lagi; aku masih benar dalam perkara ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pertimbangkanlah kembali, aku mohon; jangan sampai ada ketidakadilan. Pertimbangkanlah lagi; hak atau keadilanku masih berlaku dalam perkara itu.”'
    reason: Menunjukkan bahwa kedua bentuk dari שוב dapat dipahami sebagai seruan untuk mempertimbangkan kembali penilaian, dan bahwa צִדְקִי בָהּ dapat menyatakan hak atau keadilan Ayub dalam perkara yang sedang dibahas.
lexical_decisions:
- source_word: שֻׁבוּ
  choice: Berbaliklah
  rationale: Bentuk perintah jamak dari שוב meminta sahabat-sahabat Ayub membalikkan atau meninjau ulang penilaian mereka. “Berbaliklah” mempertahankan metafora perubahan arah tanpa menjadikannya sekadar istilah abstrak.
- source_word: נָא
  choice: aku mohon
  rationale: Partikel ini melunakkan permintaan. “Aku mohon” terdengar wajar dan bermartabat dalam bahasa Indonesia serta tidak memberi kesan waktu seperti “sekarang”.
- source_word: אַל תְּהִי עַוְלָה
  choice: jangan sampai ada ketidakadilan
  rationale: Ungkapan impersonal ini mempertahankan nomina abstrak “ketidakadilan” dan tidak menetapkan secara eksplisit siapa pelakunya.
- source_word: עַוְלָה
  choice: ketidakadilan
  rationale: Dalam perselisihan ini, kata tersebut menunjuk pada penilaian yang tidak adil atau keliru. “Ketidakadilan” mempertahankan nuansa hukum dan moralnya.
- source_word: וְשֻׁבוּ
  choice: Berbaliklah lagi
  rationale: Pengulangan perintah memperkuat desakan Ayub agar para sahabat mengubah penilaian mereka; “lagi” menyampaikan pengulangan itu secara alami.
- source_word: עוֹד
  choice: masih
  rationale: Kata ini menyatakan bahwa keadaan yang Ayub klaim tetap berlaku, bukan terutama tindakan yang diulangi.
- source_word: צִדְקִי
  choice: aku masih benar
  rationale: Bentuk harfiahnya adalah “kebenaranku/keadilanku,” tetapi dalam konteks sengketa ini konstruksi predikatif “aku masih benar” lebih alami dan menyampaikan klaim Ayub tentang integritas atau benarnya perkaranya, tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: בָהּ
  choice: dalam perkara ini
  rationale: Akhiran pronomina feminin tidak memiliki anteseden eksplisit. Konteks paling mungkin menunjuk pada perkara atau pokok perselisihan yang sedang dibahas; pilihan ini menjadikannya dapat dipahami tanpa menutup alternatif dalam catatan kaki.
theological_decisions:
- issue: Makna klaim Ayub mengenai צדק
  choice: Ayub menyatakan bahwa ia tetap benar atau berintegritas dalam perkara yang diperdebatkan.
  alternative: Ayub menyatakan bahwa haknya tetap ada dalam perkara ini, atau bahwa keadilan masih dipertaruhkan.
  rationale: Konteksnya adalah penilaian para sahabat terhadap Ayub. Terjemahan ini mempertahankan nuansa moral-forensik tanpa mengubahnya menjadi klaim bahwa Ayub sama sekali tidak berdosa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak pada perintah Ibrani dipahami dari konteks bahwa Ayub berbicara kepada para sahabatnya, tanpa menambahkan kata “kalian” yang tidak perlu. Ambiguitas pada בָהּ dan cakupan forensik צִדְקִי dipertahankan melalui catatan kaki.
