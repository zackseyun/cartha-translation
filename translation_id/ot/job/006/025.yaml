  text: How forceful are upright words! But what does reproof from you prove?[a]
translation:
  language: id
  text: Betapa kuatnya perkataan yang benar! Namun, apa yang dibuktikan oleh teguran dari kalian?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Betapa menyakitkannya perkataan yang jujur! Namun, apa yang dibuktikan oleh perdebatan kalian?” Kata Ibrani pada klausa pertama dapat bernuansa “menyakitkan”, “meyakinkan”, atau “kuat”; sedangkan kata pada klausa kedua dapat berarti “perdebatan”, “sanggahan”, atau “teguran”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: Betapa kuatnya
  rationale: מַה menyatakan seruan tentang kadar, sedangkan bentuk Nifal נמרץ menunjuk pada kekuatan atau daya perkataan. Ungkapan ini mempertahankan nada retoris tanpa membatasi maknanya hanya pada daya bujuk.
- source_word: אִמְרֵי יֹשֶׁר
  choice: perkataan yang benar
  rationale: אִמְרֵי berarti perkataan atau ucapan, dan יֹשֶׁר menyatakan kelurusan atau kebenaran. Frasa ini alami dalam bahasa Indonesia serta mempertahankan segi moral dari perkataan yang lurus dan jujur.
- source_word: וּמַה
  choice: Namun, apa
  rationale: Kata penghubung וּ dibaca secara adversatif berdasarkan kontras antara perkataan yang benar dan teguran para sahabat Ayub.
- source_word: יוֹכִיחַ
  choice: yang dibuktikan
  rationale: Bentuk Hifil dari יכח dapat berarti membuktikan, memperkarakan, atau menegur. Dalam pertanyaan retoris ini, 'dibuktikan' menyoroti tantangan Ayub terhadap hasil nyata teguran mereka.
- source_word: הוֹכֵחַ
  choice: teguran
  rationale: Bentuk ini menunjuk pada tindakan menegur atau menyanggah. 'Teguran' sesuai dengan konteks ucapan para sahabat, sementara kemungkinan arti 'perdebatan' dicatat dalam catatan kaki.
- source_word: מִכֶּם
  choice: dari kalian
  rationale: Preposisi מִן menandai sumber, dan bentuk jamaknya ditujukan kepada para sahabat Ayub. 'Dari kalian' menerjemahkan unsur sumber secara langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis-retoris yang tetap mudah dipahami. 'Kalian' dipakai karena pronomina Ibrani berbentuk jamak dan mengacu kepada para sahabat Ayub.
