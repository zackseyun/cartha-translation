  source_fidelity: Terjemahan dengan setia menyampaikan seruan retoris מַה dan נִמְרְצוּ melalui “Betapa kuatnya,” serta mempertahankan kontras pada klausa kedua. “Perkataan yang benar” menangkap יֹשֶׁר sebagai kelurusan/kebenaran dalam ujaran. “Apa yang dibuktikan oleh teguran dari kalian?” secara wajar mengungkap pertanyaan retoris tentang apa yang sebenarnya dihasilkan atau dibuktikan oleh teguran mereka, tanpa memaksakan satu nuansa sempit dari יכח.
  naturalness: Bahasa Indonesia baku, lancar, dan bernada puitis-retoris. “Kalian” tepat karena lawan bicara Ayub adalah beberapa sahabat. Bentuk pasif pada klausa kedua terdengar alami dalam bahasa Indonesia dan tidak mengubah pokok pertanyaan retorisnya.
  terminology: “Perkataan,” “benar,” “teguran,” dan “kalian” sesuai register modern standar. Catatan kaki dengan layak mencatat rentang makna yang diperselisihkan/luas untuk נמרצו dan akar יכח, tanpa menjadikan alternatif tersebut bagian utama teks.
