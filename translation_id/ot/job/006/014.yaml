base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: id
  text: Orang yang putus asa patut menerima kasih setia[b] dari sahabatnya, sekalipun ia meninggalkan takut kepada Yang Mahakuasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sahabat yang tidak memberikan kasih setia kepada orang yang putus asa meninggalkan takut kepada Yang Mahakuasa.” Susunan bahasa Ibraninya padat dan dapat dipahami demikian.
    reason: alternative_reading
  - marker: b
    text: “Kasih setia” menerjemahkan חֶסֶד (khesed), yang juga dapat berarti kebaikan, belas kasih, atau kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: orang yang putus asa
  rationale: Secara harfiah menunjuk kepada orang yang 'mencair' atau runtuh; dalam konteks penderitaan, ungkapan ini secara alami menyatakan orang yang batinnya ambruk dan putus asa.
- source_word: מֵרֵעֵהוּ
  choice: dari sahabatnya
  rationale: Preposisi מִן menyatakan sumber, sedangkan sufiks orang ketiga tunggal dipertahankan dengan '-nya'; 'sahabat' menonjolkan hubungan pribadi yang dituntut konteks.
- source_word: חָסֶד
  choice: kasih setia
  rationale: Dalam hubungan antarmanusia, חֶסֶד mencakup kebaikan yang penuh kesetiaan, belas kasih, dan solidaritas. 'Kasih setia' mempertahankan keluasan maknanya tanpa membatasinya pada keramahan biasa.
- source_word: וְיִרְאַת שַׁדַּי
  choice: sikap takut akan Yang Mahakuasa
  rationale: Ungkapan ini mempertahankan idiom alkitabiah tentang rasa takut sekaligus hormat kepada Allah; kata 'sikap' membuat konstruksi Indonesia lebih alami.
- source_word: יַעֲזֹב
  choice: ia meninggalkan
  rationale: Kata kerja עזב berarti meninggalkan atau menelantarkan. 'Meninggalkan' jelas dan tidak menambahkan penilaian yang tidak dinyatakan teks.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Ini adalah padanan baku dan bermartabat bagi gelar ilahi שַׁדַּי dalam konteks kitab Ayub.
theological_decisions:
- issue: Hubungan sintaksis klausa terakhir
  choice: Orang yang putus asa patut menerima kasih setia dari sahabatnya, sekalipun ia meninggalkan sikap takut akan Yang Mahakuasa.
  alternative: Sahabat yang menahan kasih setia dari orang yang putus asa meninggalkan sikap takut akan Yang Mahakuasa.
  rationale: Bahasa Ibraninya sangat padat dan memungkinkan kedua pemahaman. Bacaan utama memahami klausa terakhir secara konsesif dan sesuai dengan teguran Ayub terhadap sahabat-sahabatnya, tetapi bacaan alternatif yang penting dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Frasa 'patut menerima' menyampaikan bahwa kasih setia merupakan hal yang semestinya diberikan, sementara susunan utama tetap menjaga ketegangan teologis teks dan catatan kaki memelihara ambiguitas sintaksis Ibraninya.
