  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: id
  text: Ajarlah aku, dan aku akan diam; buatlah aku mengerti bagaimana aku telah keliru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “buatlah aku mengerti dalam hal apa aku telah keliru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: Ajarlah aku
  rationale: Bentuk imperatif Hifil dari ירה berarti mengajar atau memberi petunjuk. “Ajarlah aku” alami dalam bahasa Indonesia dan menyampaikan kesiapan Ayub untuk menerima koreksi.
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: maka aku akan diam
  rationale: Pronomina eksplisit mempertajam penekanan pada respons Ayub. Konjungsi diterjemahkan “maka” untuk menyatakan akibat yang wajar, sedangkan אַחֲרִישׁ dipertahankan dengan ragam khidmat “akan diam”.
- source_word: וּמַה שָּׁגִיתִי
  choice: dalam hal apa aku telah tersesat
  rationale: מַה secara harfiah berarti “apa” dan di sini meminta penjelasan mengenai letak atau perkara kesalahan Ayub. שׁגה dapat berarti keliru atau tersesat; “telah tersesat” mempertahankan citra penyimpangan dari jalan yang benar.
- source_word: הָבִינוּ לִי
  choice: buatlah aku mengerti
  rationale: Imperatif Hifil dari בין menyatakan tindakan menyebabkan seseorang memahami. “Buatlah aku mengerti” mempertahankan nuansa kausatif dan permohonan langsung kepada para sahabat.
