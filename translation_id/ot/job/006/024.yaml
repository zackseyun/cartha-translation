translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan dua imperatif serta kesiapan Ayub untuk diam bila kesalahannya benar-benar ditunjukkan. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
