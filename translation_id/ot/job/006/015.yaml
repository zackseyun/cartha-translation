base_translation:
  language: en
  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: id
  text: Saudara-saudaraku telah berkhianat seperti wadi[a], seperti alur-alur wadi yang menghilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti sungai kecil ... seperti alur-alur sungai.” Kata Ibrani נחל dapat berarti aliran air, lembah tempat aliran deras, atau alur air musiman. Istilah “wadi” digunakan di sini untuk mempertahankan gambaran wilayah kering dalam bagian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Secara harfiah berarti “saudara-saudaraku.” Dalam konteks ini cakupannya dapat meluas kepada para sahabat atau rekan dekat Ayub, tetapi istilah kekeluargaan dipertahankan agar tidak mempersempit makna.
- source_word: בָּגְדוּ
  choice: telah berlaku khianat
  rationale: Kata kerja ini menyatakan tindakan tidak setia atau berkhianat dalam suatu hubungan. Pilihan ini mempertahankan bobot moralnya tanpa menentukan satu bentuk pengkhianatan tertentu.
- source_word: כְמוֹ
  choice: seperti
  rationale: Padanan perbandingan yang langsung dan wajar dalam bahasa Indonesia modern.
- source_word: נָחַל
  choice: wadi
  rationale: Dalam rangkaian gambaran ini, kata tersebut menunjuk pada aliran atau lembah sungai musiman di wilayah kering, bukan sungai yang terus berair. Istilah “wadi” mempertahankan latar geografis dan sifat musiman gambaran itu.
- source_word: כַאֲפִיק
  choice: seperti alur-alur
  rationale: אפיק dapat berarti alur, dasar, atau jalur tempat air mengalir. Bentuk jamak “alur-alur” selaras dengan נְחָלִים yang juga jamak.
- source_word: נְחָלִים
  choice: wadi
  rationale: Bentuk jamak dari נחל. Dalam bahasa Indonesia, “wadi” tidak perlu diberi penanda jamak setelah “alur-alur,” dan pemakaiannya menjaga konsistensi citra aliran musiman.
- source_word: יַעֲבֹרוּ
  choice: yang menghilang
  rationale: Makna dasarnya ialah berlalu atau lewat. Dalam konteks wadi musiman, ungkapan ini menggambarkan air yang berlalu lalu lenyap; “menghilang” menyampaikan sifat sementara itu secara alami, sejalan dengan ayat-ayat berikutnya.
