  text: For now it would be heavier than the sand of the seas[a]; therefore my words have been rash.
translation:
  language: id
  text: Sebab sekarang, penderitaanku akan lebih berat daripada pasir di lautan; karena itu, kata-kataku tidak terkendali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani di sini sulit dipastikan; dapat juga berarti “liar,” “kacau,” atau “gegabah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  choice: Sebab sekarang
  rationale: כִּי menghubungkan ayat ini sebagai alasan bagi keluhan Ayub sebelumnya, sedangkan עַתָּה menegaskan keadaan yang sedang dialaminya.
- source_word: מֵחוֹל יַמִּים
  choice: daripada pasir di lautan
  rationale: Ungkapan komparatif diterjemahkan secara alami dalam bahasa Indonesia; bentuk jamak יַמִּים tidak perlu ditiru secara kaku karena 'lautan' dapat menyatakan keluasan kolektif.
- source_word: יִכְבָּד
  choice: bebanku lebih berat
  rationale: Verba כבד menyatakan keadaan berat. Subjeknya tersirat dan merujuk pada kepedihan serta kemalangan dalam ayat sebelumnya; 'bebanku' membuat rujukan itu jelas tanpa mengubah gambaran penimbangan.
- source_word: עַל־כֵּן
  choice: karena itu
  rationale: 'Menandai akibat: beratnya penderitaan Ayub menjelaskan sifat ucapannya.'
- source_word: דְּבָרַי
  choice: kata-kataku
  rationale: Mempertahankan bentuk jamak dan hubungan langsung dengan perkataan Ayub.
- source_word: לָעוּ
  choice: terlontar tanpa kendali
  rationale: Verba ini sulit dan mungkin menggambarkan perkataan yang gegabah, liar, atau kacau. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan ucapan yang keluar secara tidak terkendali tanpa mengunci makna pada satu nuansa saja.
