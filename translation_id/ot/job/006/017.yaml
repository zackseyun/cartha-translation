lexical_decisions:
- source_word: בְּעֵת
  choice: Ketika
  rationale: Gabungan preposisi dan nomina ini memperkenalkan keterangan waktu; “ketika” alami dalam bahasa Indonesia dan mempertahankan hubungan antarklausa.
- source_word: יְזֹרְבוּ
  choice: menjadi hangat
  rationale: Verba langka ini menunjuk pada keadaan menjadi hangat atau panas. Bentuk ini mempertahankan proses perubahan suhu tanpa menambahkan penyebab yang tidak dinyatakan.
- source_word: נִצְמָתוּ
  choice: lenyap
  rationale: Bentuk Nifal ini dapat berarti berakhir, dibinasakan, atau menghilang. Dalam gambaran aliran musiman, “lenyap” menyampaikan hilangnya air secara jelas sambil tidak mengunci makna pada proses tertentu.
- source_word: בְּחֻמּוֹ
  choice: dalam panasnya
  rationale: Terjemahan ini mempertahankan bentuk harfiah preposisi dengan sufiks orang ketiga maskulin tunggal dan tidak secara diam-diam menyelesaikan rujukan sufiks yang dapat dipahami secara kontekstual.
- source_word: נִדְעֲכוּ
  choice: mengering
  rationale: Verba ini dapat berarti dipadamkan atau padam. Dalam konteks aliran air yang terkena panas, “mengering” menyampaikan akibat konkretnya, sementara alternatif citra pemadaman dicatat dalam catatan kaki.
- source_word: מִמְּקוֹמָם
  choice: dari tempatnya
  rationale: Pilihan ini dekat dengan arti dasar “dari tempat mereka” dan menghindari penafsiran yang terlalu spesifik sebagai dasar atau saluran sungai.
