  text: Apakah pertolonganku tidak ada dalam diriku, dan kecakapan telah disingkirkan dariku?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאִם אֵין
  choice: Bukankah ... tidak ada
  rationale: 'Gabungan partikel tanya dan penyangkalan membentuk pertanyaan retoris. Bentuk ini mempertahankan ketegangan dalam bahasa Ibrani: Ayub menegaskan bahwa ia tidak mempunyai pertolongan dalam dirinya sendiri.'
- source_word: עֶזְרָתִי
  choice: pertolongan bagi diriku
  rationale: Kata עֶזְרָה berarti pertolongan atau bantuan. Ungkapan 'bagi diriku' menyampaikan sufiks orang pertama tanpa memberi kesan bahwa Ayub sendiri adalah sumber pertolongan itu.
- source_word: בִי
  choice: dalam diriku
  rationale: Preposisi ב dengan sufiks orang pertama secara langsung berarti 'dalam diriku' dan di sini menunjuk pada sumber daya batin yang tidak dimiliki Ayub.
- source_word: וְתֻשִּׁיָּה
  choice: dan kemampuan untuk bertindak
  rationale: Dalam sastra hikmat, תּוּשִׁיָּה dapat menunjuk pada kebijaksanaan yang efektif, kecakapan, atau daya untuk mencapai sesuatu. Pilihan ini terdengar alami dan sesuai dengan paralelnya, 'pertolongan'.
- source_word: נִדְּחָה מִמֶּנִּי
  choice: telah dijauhkan dariku
  rationale: Bentuk pasif נִדְּחָה menyatakan bahwa sesuatu telah dihalau atau disingkirkan; 'telah dijauhkan dariku' mempertahankan bentuk pasif dan arah menjauh.
theological_decisions:
- issue: Arah pertanyaan retoris pada klausa pertama
  choice: Ayub menyatakan bahwa pertolongan tidak ada dalam dirinya
  alternative: Ayub menyatakan bahwa pertolongannya ada dalam dirinya
  rationale: Walaupun susunan pertanyaan dan penyangkalan dapat terasa ambigu, paralel dengan kemampuan yang telah dijauhkan mendukung pembacaan bahwa Ayub mengakui tidak adanya sumber daya dalam dirinya. Bentuk pertanyaan retoris tetap dipertahankan agar nuansa teks tidak diratakan menjadi pernyataan biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'diriku' dipertahankan karena mencerminkan penekanan Ibrani pada ketiadaan sumber daya dalam diri Ayub; 'kemampuan untuk bertindak' dipilih agar makna praktis תּוּשִׁיָּה dapat dipahami pembaca umum.
