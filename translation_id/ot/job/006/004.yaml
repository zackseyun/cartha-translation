  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: id
  text: Sebab anak-anak panah Yang Mahakuasa tertancap dalam diriku[a]; rohku meneguk racunnya[b]; kengerian dari Allah menyusun barisan melawan aku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berada bersamaku.” Preposisi Ibraninya secara lebih harfiah berarti demikian, tetapi gambaran anak panah dan racun mendukung arti bahwa anak-anak panah itu tertancap dalam diri Ayub.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bisanya”; kata Ibrani ini juga dapat dipahami secara lebih abstrak sebagai “murkanya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menyusun diri melawan aku,” yaitu gambaran pasukan yang mengambil formasi tempur.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan keluhan Ayub sebelumnya sebagai penjelasan atau alasan, tanpa mempersempit daya ungkapnya lebih jauh daripada konteks.
- source_word: חִצֵּי שַׁדַּי
  choice: anak-anak panah Yang Mahakuasa
  rationale: Mempertahankan metafora perang dan menerjemahkan gelar ilahi שַׁדַּי dengan padanan baku serta mudah dipahami.
- source_word: עִמָּדִי
  choice: tertancap dalam diriku
  rationale: Secara harfiah preposisi ini berarti 'bersamaku', tetapi gambaran anak panah dan racun menunjukkan bahwa anak-anak panah itu telah mengenai dan berada dalam diri Ayub. Kata 'tertancap' membuat implikasi kontekstual tersebut wajar dalam bahasa Indonesia.
- source_word: חֲמָתָם
  choice: racunnya
  rationale: Dalam gambaran anak panah, nomina ini paling wajar menunjuk pada racun anak panah, meskipun secara leksikal dapat pula berarti bisa atau murka.
- source_word: שֹׁתָה רוּחִי
  choice: rohku meneguk
  rationale: Mempertahankan gambaran hidup tentang batin Ayub yang meminum racun. 'Rohku' menunjuk pada kehidupan batinnya, bukan sekadar napas harfiah.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: segala kengerian dari Allah
  rationale: Mengungkapkan bentuk jamak yang intens dan mempertahankan Allah sebagai sumber kengerian itu tanpa menambahkan penjelasan teologis.
- source_word: יַעַרְכוּנִי
  choice: berbaris melawan aku
  rationale: Menjaga citra militer dari tindakan menyusun diri dalam formasi untuk menghadapi seseorang, dengan ungkapan yang dapat dipahami pembaca modern.
theological_decisions:
- issue: Penerjemahan gelar שַׁדַּי dan sebutan אֱלוֹהַּ
  choice: Yang Mahakuasa dan Allah
  alternative: Shaddai; atau memakai sebutan ilahi yang sama pada kedua klausa
  rationale: Teks Ibrani memakai dua sebutan ilahi yang berbeda. Menerjemahkan keduanya mempertahankan perbedaan itu sekaligus menghindari transliterasi yang kurang jelas bagi pembaca umum.
- issue: Makna חֲמָתָם dalam metafora anak panah
  choice: racunnya
  alternative: bisanya; murkanya
  rationale: Konteks langsung menggambarkan anak panah yang efek beracunnya diminum oleh roh Ayub. Pilihan konkret ini paling sesuai dengan metafora, sementara kemungkinan leksikal lain dicatat tanpa mengubahnya menjadi pernyataan abstrak tentang murka ilahi.
- issue: Hubungan Allah dengan penderitaan Ayub
  choice: Mempertahankan pernyataan bahwa anak panah dan kengerian berasal dari Allah
  alternative: Melunakkan ungkapan sehingga Allah hanya mengizinkan atau menyaksikan penderitaan
  rationale: Ayat ini menyuarakan persepsi dan keluhan Ayub secara langsung. Terjemahan tidak menambahkan penjelasan yang membebaskan atau menyalahkan Allah di luar yang dikatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Metafora anak panah beracun serta formasi tempur dipertahankan. Bentuk 'anak-anak panah' dipilih untuk kejelasan bentuk jamak, sedangkan 'segala kengerian' menghindari pengulangan nominal yang terasa kaku.
