  text: But now[a], please turn to me, and before your faces[c][b], would I lie?
translation:
  language: id
  text: Tetapi sekarang, sudilah memandang aku[a]. Masakan aku berdusta di depan kalian[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berpalinglah kepadaku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di hadapan wajah kalian”; maksudnya, secara langsung di hadapan kalian.'
