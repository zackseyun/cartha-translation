translation_notes:
  register: Bahasa Indonesia baku modern dengan nada permohonan yang sungguh-sungguh. Bentuk jamak 'kalian' dipakai karena semua kata ganti dalam bahasa Ibrani ditujukan kepada beberapa sahabat Job. Pertanyaan retoris dipertahankan tanpa menjadikannya pernyataan mutlak.
