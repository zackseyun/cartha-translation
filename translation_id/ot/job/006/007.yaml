  terminology: “Jiwaku” adalah padanan yang sah untuk נפשִׁי dan tidak mempersempit makna menjadi selera makan; alternatif tersebut dicatat dengan tepat. “Makananku” menyampaikan cakupan luas לֶחֶם, sementara “roti” tetap tersedia dalam catatan. Tidak ada masalah teologis atau penggunaan nama.
