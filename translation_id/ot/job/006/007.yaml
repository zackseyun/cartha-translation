  source_fidelity: 'Teks Indonesia mempertahankan unsur-unsur pokok Ibrani: penolakan/keengganan (מֵאֲנָה), tindakan menyentuh (לִנְגּוֹעַ), “jiwaku” (נַפְשִׁי), rujukan jamak kepada hal-hal sebelumnya (הֵמָּה), serta gambaran sakit/penyakit yang berhubungan dengan makanan (כִּדְוֵי לַחְמִי). Frasa “seperti penyakit pada makananku” sengaja agak padat, tetapi secara layak mencerminkan kesulitan dan ketidakpastian konstruksi Ibrani tanpa memaksakan satu penafsiran.'
