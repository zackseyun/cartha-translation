  yaml_path: translation/ot/job/006/007.yaml
  text: My soul refuses to touch them[b][a]; they are like the sickness of my food.
translation:
  language: id
  text: Jiwaku enggan menyentuhnya[a]; semuanya itu seperti penyakit pada makananku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Selera makanku enggan menyentuhnya.” Kata Ibrani nefesh dapat berarti “jiwa,” “diri,” atau, dalam konteks tertentu, “selera makan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “semuanya itu seperti makanan yang menjijikkan bagiku,” atau, “semuanya itu seperti penyakit pada roti/makananku.” Ungkapan Ibraninya padat dan sulit.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֲנָה
  choice: enggan
  rationale: Bentuk dari מאן menyatakan penolakan atau ketidaksediaan. “Enggan” alami dalam bahasa Indonesia dan mempertahankan unsur kemauan.
- source_word: לִנְגּוֹעַ
  choice: menyentuh
  rationale: נגע pada dasarnya berarti “menyentuh”; di sini kata itu mengungkapkan rasa jijik terhadap hal-hal yang disebut sebelumnya.
- source_word: נַפְשִׁי
  choice: jiwaku
  rationale: נפש dapat berarti jiwa, diri, tenggorokan, atau selera makan. “Jiwaku” mempertahankan keluasan antropologis ungkapan Ibrani tanpa mempersempitnya menjadi selera makan.
- source_word: הֵמָּה
  choice: semuanya itu
  rationale: Pronomina ini merujuk kembali pada hal-hal menjijikkan dalam ayat sebelumnya. “Semuanya itu” memperjelas rujukan jamaknya secara alami.
- source_word: כִּדְוֵי
  choice: seperti penyakit pada
  rationale: Ungkapan konstruksi dari דוה, “sakit/penyakit,” sangat padat dan sulit. “Seperti penyakit pada” menjaga citra penyakit serta hubungan dengan makanan tanpa memastikan satu tafsiran saja.
- source_word: לַחְמִי
  choice: makananku
  rationale: לחם secara harfiah berarti roti, tetapi juga dapat menunjuk pada makanan secara umum; konteks metaforis ini mendukung “makananku.”
