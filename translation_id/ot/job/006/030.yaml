  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
translation:
  language: id
  text: Adakah ketidakadilan pada lidahku? Masakan langit-langit mulutku tidak dapat membedakan malapetaka?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal yang membawa kehancuran” atau “hal-hal yang menyimpang secara moral”. Kata Ibrani ini dapat merujuk pada malapetaka atau kejahatan yang merusak, dan juga dapat dipahami dalam arti moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: Adakah
  rationale: Menyampaikan pertanyaan retoris ya/tidak secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: בִּלְשׁוֹנִי
  choice: pada lidahku
  rationale: Mempertahankan metafora anggota tubuh yang menunjuk pada perkataan, tanpa menggantinya dengan ungkapan yang lebih interpretatif.
- source_word: עַוְלָה
  choice: ketidakadilan
  rationale: Menjaga bobot moral kata yang dapat berarti kesalahan, kelaliman, atau ketidakbenaran.
- source_word: אִם
  choice: Masakan
  rationale: Dalam konteks ini memperkenalkan pertanyaan retoris kedua yang sejajar dengan pertanyaan pertama; 'masakan' menyampaikan harapan akan jawaban negatif.
- source_word: חִכִּי
  choice: langit-langit mulutku
  rationale: Padanan konkret dan mudah dipahami untuk organ pengecap, sehingga citra pengecapan dan kemampuan menilai tetap terasa.
- source_word: לֹא יָבִין
  choice: tidak dapat membedakan
  rationale: Kata kerja בין di sini menyatakan kemampuan memahami atau memilah; 'membedakan' cocok dengan metafora pengecapan.
- source_word: הַוּוֹת
  choice: hal-hal yang mendatangkan kehancuran
  rationale: Ungkapan ini mempertahankan nuansa jamak dan cakupan kata Ibrani yang dapat menunjuk pada hal-hal merusak atau malapetaka, tanpa memaksakan hanya peristiwa bencana.
