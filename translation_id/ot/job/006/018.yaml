translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang wajar. Susunan kalimat mempertahankan citra konkret dan ambiguitas teks Ibrani; “semuanya” memperjelas subjek jamak pada klausa kedua tanpa menentukan apakah yang dimaksud ialah jalur, aliran, atau—menurut bacaan alternatif—kafilah.
