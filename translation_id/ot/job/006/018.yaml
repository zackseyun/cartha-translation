  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: id
  text: Jalur-jalur perjalanan mereka berkelok menjauh[a]; mereka naik ke tanah tandus dan lenyap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jalur-jalur kafilah berbelok; kafilah-kafilah itu naik ke tanah tandus dan lenyap.” Gambaran dalam bahasa Ibrani sulit dipastikan; sebagian orang memahami ayat ini sebagai gambaran tentang kafilah, bukan jalur atau aliran air itu sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: berkelok menjauh
  rationale: Bentuk Nifal ini menyatakan gerak memutar, berkelok, atau menyimpang. Dalam gambaran alur air yang berubah arah, “berkelok menjauh” mempertahankan gerak dan arah tanpa menafsirkan berlebihan.
- source_word: אָרְחוֹת
  choice: jalur-jalur
  rationale: Kata ini lazim berarti jalan, jalur, atau jejak. “Jalur-jalur” cocok dengan gambaran alur air, sementara kemungkinan makna metonimis “kafilah” dicatat dalam catatan kaki.
- source_word: דַּרְכָּם
  choice: alirannya
  rationale: Secara harfiah berarti “jalan mereka”. Dalam konteks saluran air, “alirannya” menyampaikan jalur yang ditempuh air secara alami dan menghindari pengulangan “jalur jalan mereka” yang kaku.
- source_word: יַעֲלוּ
  choice: naik
  rationale: Kata kerja ini secara konkret berarti naik atau mendaki. Terjemahan “naik” mempertahankan citra gerak yang sukar dalam teks Ibrani tanpa menggantinya dengan tafsiran seperti “menghilang”.
- source_word: בַתֹּהוּ
  choice: ke tanah tandus
  rationale: תֹהוּ menunjuk pada kehampaan, kesunyian, atau daerah gersang. “Tanah tandus” alami dalam bahasa Indonesia dan sesuai dengan latar gurun; “ke” menyatakan arah gerak.
- source_word: וְיֹאבֵדוּ
  choice: lalu lenyap
  rationale: אבד dapat berarti binasa, hilang, atau lenyap. Karena gambaran utamanya ialah aliran air yang menghilang di daerah tandus, “lenyap” paling alami tanpa menghilangkan gagasan berakhir atau musnah.
