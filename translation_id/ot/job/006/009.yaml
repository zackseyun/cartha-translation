  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֹאֵ֣ל אֱ֭לוֹהַּ וִֽ/ידַכְּאֵ֑/נִי יַתֵּ֥ר יָ֝ד֗/וֹ וִֽ/יבַצְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/009.yaml
  text: that God would be willing to crush me[c][b][a], that he would let loose his hand and cut me off.
translation:
  language: id
  text: Kiranya Allah bersedia meremukkan aku,[a] melepaskan tangan-Nya[b] dan menghabisi aku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkenan meremukkan aku.” Kata Ibrani yang dipakai menyatakan kesediaan atau persetujuan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “melepaskan tangan-Nya”, yaitu tidak lagi menahan diri untuk bertindak.
    reason: cultural_note
  - marker: c
    text: Atau “memutuskan aku” atau “menamatkan hidupku”. Kata Ibrani ini menggambarkan tindakan pemutusan yang tegas dan final.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל
  choice: Kiranya ... bersedia
  rationale: Bentuk Hifil dari יאל menyatakan kesediaan atau persetujuan. Dalam konteks harapan kuat Ayub, “kiranya ... bersedia” terdengar alami dan tetap mempertahankan nuansa kehendak.
- source_word: אֱלוֹהַּ
  choice: Allah
  rationale: אֱלוֹהַּ adalah sebutan tunggal yang lazim bagi Allah dalam kitab Ayub; “Allah” merupakan padanan langsung dalam bahasa Indonesia.
- source_word: וִידַכְּאֵנִי
  choice: meremukkan aku
  rationale: דכא dalam bentuk Piel menyampaikan tindakan meremukkan atau menghancurkan dengan keras. Pilihan ini mempertahankan daya ungkap ratapan Ayub.
- source_word: יַתֵּר
  choice: melepaskan
  rationale: Kata ini menyatakan tindakan melonggarkan atau melepaskan. Bersama “tangan-Nya”, ungkapan tersebut menggambarkan Allah tidak lagi menahan tangan-Nya untuk bertindak.
- source_word: יָדוֹ
  choice: tangan-Nya
  rationale: Terjemahan konkret ini mempertahankan ungkapan antropomorfis Ibrani tentang tindakan dan kuasa Allah.
- source_word: וִיבַצְּעֵנִי
  choice: menghabisi aku
  rationale: בצע dapat berarti memotong atau memutuskan. Dalam konteks permohonan Ayub agar hidupnya berakhir, “menghabisi aku” menyampaikan tindakan final secara alami tanpa menentukan caranya.
theological_decisions:
- issue: Bahasa antropomorfis tentang tindakan Allah
  choice: Mempertahankan ungkapan konkret “tangan-Nya”.
  alternative: kuasa-Nya; hukuman-Nya
  rationale: Teks Ibrani memakai gambaran jasmaniah untuk menyatakan tindakan ilahi. Mempertahankannya menjaga kekuatan emosional permohonan Ayub tanpa mengharuskan pemahaman bahwa Allah memiliki tubuh jasmani.
- issue: Permohonan Ayub mengenai akhir hidupnya
  choice: Menerjemahkan secara lugas sebagai permohonan agar Allah menghabisinya.
  alternative: Memperhalusnya menjadi permohonan umum agar penderitaannya berakhir.
  rationale: Konteks dan verba Ibrani menunjuk pada kehancuran yang tegas dan final. Terjemahan tidak boleh meredakan ketegangan teologis dalam ucapan Ayub.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ratapan yang khidmat dan langsung. Susunan “kiranya” mempertahankan bentuk harapan atau permohonan, sedangkan “tangan-Nya” mempertahankan citra konkret teks sumber.
