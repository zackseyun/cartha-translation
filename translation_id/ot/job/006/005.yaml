  text: הֲ/יִֽנְהַק פֶּ֥רֶא עֲלֵי דֶ֑שֶׁא אִ֥ם יִגְעֶה שּׁ֝֗וֹר עַל בְּלִילֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/005.yaml
  text: Does a wild donkey bray over grass[b][a], or does an ox low over its fodder?
translation:
  language: id
  text: Apakah keledai liar meringkik ketika mendapat rumput, atau lembu melenguh ketika mendapat pakan campurannya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas rumput” dan “di atas pakan campurannya”. Kata Ibrani untuk pakan menunjuk pada pakan ternak yang dicampur atau adonan pakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְהַק
  choice: Apakah ... meringkik
  rationale: Kata kerja ini menunjuk pada suara keledai. Dalam bahasa Indonesia, “meringkik” merupakan padanan yang lazim dan dapat dipahami, walaupun juga digunakan untuk suara kuda.
- source_word: פֶּרֶא
  choice: keledai liar
  rationale: Istilah Ibrani ini menunjuk secara khusus pada keledai liar atau onager; “keledai liar” jelas dan alami bagi pembaca modern.
- source_word: עֲלֵי דֶשֶׁא
  choice: ketika mendapat rumput
  rationale: Secara harfiah ungkapan ini berarti “di atas/dekat rumput”. Dalam pertanyaan retoris ini, maksudnya adalah keadaan ketika rumput tersedia; pilihan ini menyampaikan maksud tersebut secara alami.
- source_word: אִם
  choice: atau
  rationale: Dalam pasangan pertanyaan retoris, אִם memperkenalkan unsur kedua dengan arti “atau”.
- source_word: יִגְעֶה
  choice: melenguh
  rationale: Kata kerja ini menunjuk pada suara sapi atau lembu; “melenguh” adalah padanan Indonesia yang tepat.
- source_word: שׁוֹר
  choice: lembu
  rationale: שׁוֹר menunjuk pada seekor hewan jenis sapi. “Lembu” mempertahankan bentuk tunggal dan sesuai dengan gaya sastra hikmat.
- source_word: עַל בְּלִילוֹ
  choice: ketika mendapat pakan campurannya
  rationale: בְּלִיל adalah pakan ternak yang dicampur atau adonan pakan. Akhiran pronominal diterjemahkan “-nya”, sedangkan עַל dipahami secara kontekstual sebagai keadaan tersedianya pakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan dua pertanyaan retoris serta kesejajaran antara keledai liar dan lembu dipertahankan.
