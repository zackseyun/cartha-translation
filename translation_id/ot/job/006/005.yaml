  source_fidelity: 'Terjemahan dengan tepat mempertahankan dua pertanyaan retoris yang paralel: keledai liar dan lembu, suara masing-masing, serta keadaan adanya rumput dan pakan. “Ketika mendapat” merupakan pengungkapan kontekstual yang wajar untuk עֲלֵי (‘di atas/dekat, dalam keadaan tersedia’) dalam kedua klausa dan tidak mengubah maksud peribahasa tersebut.'
