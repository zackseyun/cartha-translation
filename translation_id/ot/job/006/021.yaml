  yaml_path: translation/ot/job/006/021.yaml
  text: For now you have become nothing[a]; you see terror[b], and you are afraid.
translation:
  language: id
  text: Sebab sekarang kalian telah menjadi tidak berarti apa-apa[a]; kalian melihat kengerian[b], dan kalian takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi kira-kira, “kalian telah menjadi tidak.” Banyak orang memahami maksudnya sebagai “kalian telah menjadi tidak berarti apa-apa” atau “kalian telah menjadi seperti itu,” yakni seperti aliran-aliran yang tidak dapat diandalkan dalam ayat-ayat sebelumnya.
    reason: textual_variant
  - marker: b
    text: Atau “kalian melihat malapetaka dan takut.” Kata Ibrani ini dapat berarti kengerian, kegentaran, atau bencana yang menghancurkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan pernyataan ini dengan gambaran aliran musiman yang mengecewakan pada ayat-ayat sebelumnya, tanpa mempersempit kaitannya secara berlebihan.
- source_word: עַתָּה
  choice: sekarang
  rationale: Menandai keadaan para sahabat saat ini, berlawanan dengan pertolongan yang sebelumnya diharapkan Ayub.
- source_word: הֱיִיתֶם
  choice: kalian telah menjadi
  rationale: 'Bentuk היה paling wajar dipahami sebagai perubahan keadaan: para sahabat terbukti seperti aliran musiman yang tidak dapat diandalkan.'
- source_word: לא
  choice: bukan apa-apa
  rationale: Ketiv לא secara harfiah berarti 'tidak/bukan'; ungkapan 'telah menjadi bukan apa-apa' mempertahankan keganjilan tekstualnya sambil menyampaikan bahwa mereka terbukti tidak berguna.
- source_word: תִּרְאוּ
  choice: kalian melihat
  rationale: Mempertahankan arti dasar ראה dan membiarkan objeknya, חֲתַת, tetap terbuka antara pengalaman mengerikan dan malapetaka yang menghancurkan.
- source_word: חֲתַת
  choice: kengerian
  rationale: Mencakup rasa gentar atau sesuatu yang menimbulkan gentar, sekaligus selaras dengan reaksi takut pada klausa berikutnya.
- source_word: וַתִּירָאוּ
  choice: lalu menjadi takut
  rationale: Menyatakan reaksi para sahabat setelah melihat keadaan Ayub; 'lalu' menangkap urutan naratif waw tanpa harus menjadikannya hubungan sebab-akibat yang terlalu tegas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' karena Ayub berbicara kepada para sahabatnya. Susunan kalimat dibuat lugas dan bermartabat; ungkapan tidak biasa 'bukan apa-apa' sengaja dipertahankan serta dijelaskan dalam catatan kaki agar persoalan teks Ibrani tidak disamarkan.
