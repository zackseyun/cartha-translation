  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: id
  text: Kekuatan apa yang kumiliki hingga aku terus berharap? Dan apa kesudahanku hingga aku memperpanjang hidupku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hingga aku bersabar.” Secara harfiah, “hingga aku memanjangkan nyawaku.” Ungkapan ini dapat merujuk pada memperpanjang hidup atau terus bertahan dalam ketabahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: Kekuatan apa yang kumiliki
  rationale: Pertanyaan retoris ini menyoroti tidak adanya kekuatan atau kemampuan untuk terus menanggung penderitaan. Susunan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “apakah kekuatanku”.
- source_word: כִּי אֲיַחֵל
  choice: sehingga aku harus terus berharap
  rationale: Verba יחל dapat berarti menanti atau berharap. “Terus berharap” menyampaikan keberlanjutan yang dipersoalkan Ayub dalam konteks ini tanpa menutup kemungkinan nuansa menanti.
- source_word: וּמַה קִצִּי
  choice: Dan apakah kesudahanku
  rationale: קֵץ berarti akhir atau batas. “Kesudahanku” mempertahankan ungkapan singkat dan daya eksistensial pertanyaan Ayub.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: sehingga aku harus memperpanjang hidupku
  rationale: Secara harfiah frasa ini berarti “memanjangkan jiwaku/nyawaku”; dalam konteksnya, frasa tersebut menunjuk pada memperpanjang hidup atau terus bertahan. Pilihan ini alami sekaligus tetap dekat dengan citra sumber.
