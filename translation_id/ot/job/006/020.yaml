translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan dua istilah rasa malu dipertahankan, sementara catatan kaki menyajikan nuansa kekecewaan yang timbul dari harapan akan air yang tidak terpenuhi.
