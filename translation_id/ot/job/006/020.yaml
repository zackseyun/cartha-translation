translation:
  language: id
  text: Mereka malu karena telah percaya; mereka datang ke sana[a], lalu menjadi kecewa dan malu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka datang kepadanya,” yaitu ke aliran musiman yang disebut dalam konteks sebelumnya.
    reason: cross_reference
  - marker: b
    text: Atau “menjadi malu,” “tercengang,” atau “dibingungkan.” Bahasa Ibrani memakai dua kata yang berkaitan dengan rasa malu atau aib; “menjadi kecewa” mencerminkan konteks harapan mereka pada aliran itu yang tidak terpenuhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: menjadi malu
  rationale: Qal perfektum orang ketiga jamak dari בוש menyatakan keadaan atau akibat berupa rasa malu. Frasa ini mempertahankan unsur malu dan tidak menyamakannya begitu saja dengan kekecewaan.
- source_word: כִּי
  choice: karena
  rationale: Dalam konteks ini כִּי paling wajar memperkenalkan alasan mereka menjadi malu.
- source_word: בָטָח
  choice: telah percaya
  rationale: Walaupun bentuk Masoretiknya secara morfologis tunggal maskulin, konteksnya diapit verba jamak yang merujuk kepada rombongan pengembara; bahasa Indonesia secara wajar meneruskan subjek jamak. 'Percaya' mempertahankan makna dasar בטח sebagai menaruh kepercayaan atau harapan.
- source_word: בָּאוּ
  choice: mereka datang
  rationale: Padanan langsung bagi Qal perfektum orang ketiga jamak dari בוא.
- source_word: עָדֶיהָ
  choice: ke sana
  rationale: Ungkapan ini secara harfiah berarti 'kepadanya/ke situ' dan menunjuk kembali kepada aliran musiman dalam konteks sebelumnya. 'Ke sana' alami dalam bahasa Indonesia tanpa mempertahankan gender gramatikal Ibrani.
- source_word: וַיֶּחְפָּרוּ
  choice: tetapi dipermalukan
  rationale: חפר dalam konteks ini berarti menjadi malu, mendapat aib, atau kebingungan karena harapan gagal. 'Dipermalukan' mempertahankan hubungan leksikal dengan verba malu pertama dan daya akibatnya; 'tetapi' menyatakan kontras kontekstual antara kedatangan penuh harap dan hasilnya.
