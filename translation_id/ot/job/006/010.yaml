base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: id
  text: 'Itulah yang akan tetap menjadi penghiburanku: aku akan bersukacita dalam rasa sakit yang tak kunjung reda[a], sebab aku tidak menyangkal perkataan Yang Mahakudus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “aku akan bersukacita dalam kesakitan yang tidak Ia ringankan.” Bahasa Ibrani dalam klausa ini sulit dan sangat padat.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: penghiburanku
  rationale: Nomina dari akar נחם menyatakan penghiburan atau pelipur hati. 'Penghiburanku' alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa hal ini masih memberi Ayub keteguhan di tengah penderitaan.
- source_word: וַאֲסַלְּדָה
  choice: aku akan bersukacita
  rationale: Verba סלד sangat jarang dan maknanya sulit dipastikan; dalam konteks ini menunjuk pada tanggapan sukacita yang kuat. 'Bersukacita' jelas dan wajar tanpa memaksakan gambaran fisik yang tidak pasti seperti 'melonjak'.
- source_word: בְחִילָה
  choice: di tengah rasa sakit
  rationale: חִילָה dapat menyatakan geliat kesakitan, kepedihan, atau penderitaan berat. Ungkapan ini menyampaikan penderitaan jasmani dan batin secara alami dalam bahasa Indonesia.
- source_word: לֹא יַחְמֹל
  choice: yang tak kunjung reda
  rationale: Secara harfiah verba חמל berarti 'menyayangkan' atau 'menahan diri/tidak menyayangkan'. Karena susunan Ibraninya padat dan sulit, frasa ini dipadukan dengan 'rasa sakit' untuk menyampaikan penderitaan yang tidak diringankan, sambil mempertahankan bacaan yang lebih formal dalam catatan kaki.
- source_word: כִחַדְתִּי
  choice: aku tidak menyangkal
  rationale: Dalam piel, כחד dapat berarti menyangkal, menyembunyikan, atau menahan. Dengan objek 'perkataan-perkataan Yang Mahakudus', 'menyangkal' paling alami untuk menyatakan bahwa Ayub tidak menolak atau mengingkari firman-Nya.
- source_word: אִמְרֵי
  choice: perkataan-perkataan
  rationale: Bentuk jamak konstruktus dari אמרה menunjuk pada ucapan atau perkataan. Bentuk ulang mempertahankan kemajemukan sumber tanpa membuatnya terdengar teknis.
- source_word: קָדוֹשׁ
  choice: Yang Mahakudus
  rationale: Adjektiva ini dipakai secara substantival sebagai gelar ilahi. 'Yang Mahakudus' merupakan gelar Allah yang alami, khidmat, dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Gelar ilahi קָדוֹשׁ
  choice: Yang Mahakudus
  alternative: yang kudus
  rationale: Konteks menunjuk kepada Allah, bukan kepada orang kudus secara umum. Kapitalisasi dan bentuk gelar mempertahankan daya teologis teks tanpa menambahkan identifikasi yang tidak dinyatakan.
- issue: Klausa sulit בְחִילָה לֹא יַחְמֹל
  choice: di tengah rasa sakit yang tak kunjung reda
  alternative: dalam rasa sakit ketika Ia tidak menyayangkan
  rationale: Bahasa Ibraninya padat, dan hubungan sintaksis antara 'rasa sakit' dan 'Ia tidak menyayangkan' tidak sepenuhnya pasti. Teks utama memberi padanan Indonesia yang lancar dan mempertahankan gagasan penderitaan tanpa keringanan; catatan kaki menyajikan bentuk yang lebih harfiah dan menjaga acuan pelaku yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan puitis yang sesuai dengan puisi hikmat. Tanda titik dua memperkenalkan isi penghiburan Ayub, sedangkan koma sebelum catatan kaki menjaga alur klausa. Penanda [a] ditempatkan langsung sesudah klausa sulit yang diterangkannya.
