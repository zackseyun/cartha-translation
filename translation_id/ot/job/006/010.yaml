  to: 'Itulah yang akan tetap menjadi penghiburanku: aku akan bersukacita dalam rasa sakit yang tak kunjung reda[a], sebab aku tidak menyangkal perkataan Yang Mahakudus.'
  rationale: Revisi mempertahankan makna utama dan ambiguitas klausa tengah, tetapi memulihkan nuansa modal pembukaan sesuai konteks Ibrani serta memperbaiki catatan kaki agar lengkap dan idiomatis. “Dalam” mengikuti preposisi בְ secara lebih langsung, sedangkan “rasa sakit yang tak kunjung reda” tetap menyampaikan penderitaan yang tidak dihematkan atau diringankan.
