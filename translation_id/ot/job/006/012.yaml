  text: Apakah kekuatanku sekuat batu, atau apakah dagingku terbuat dari perunggu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: apakah
  rationale: Di kedua klausa, אִם memperkenalkan pertanyaan retoris; “apakah” menyampaikan fungsi interogatif itu secara alami dalam bahasa Indonesia.
- source_word: כֹּחַ ... כֹּחִי
  choice: kekuatanku seperti kekuatan
  rationale: כֹּחַ berarti kekuatan atau daya. Rumusan ini mempertahankan pengulangan akar kata Ibrani dan menghasilkan perbandingan yang jelas dalam bahasa Indonesia.
- source_word: אֲבָנִים
  choice: batu
  rationale: Bentuk Ibrani secara gramatikal jamak, tetapi bahasa Indonesia lazim memakai nomina tanpa reduplikasi untuk menyatakan benda sebagai jenis atau bahan; “batu” mempertahankan citra konkretnya.
- source_word: בְּשָׂרִי
  choice: dagingku
  rationale: Arti harfiahnya adalah “dagingku”; pilihan ini mempertahankan gambaran jasmani dan kontras antara kerapuhan manusia dengan kerasnya logam.
- source_word: נָחוּשׁ
  choice: perunggu
  rationale: Kata ini dapat menunjuk pada tembaga atau perunggu. “Perunggu” merupakan padanan sastra yang wajar dan menonjolkan sifat keras serta tahan lama yang dimaksud oleh pertanyaan retoris.
