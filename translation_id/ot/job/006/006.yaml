  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: id
  text: Dapatkah makanan hambar dimakan tanpa garam, atau adakah rasa dalam lendir tumbuhan mallow?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Makna istilah-istilah Ibrani dalam bagian kedua ayat ini tidak pasti. “Lendir tumbuhan mallow” juga dapat dipahami sebagai “sari tumbuhan mallow”; sebagian penerjemahan tradisional memahami frasa ini sebagai “putih telur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: Dapatkah ... dimakan
  rationale: Partikel tanya הֲ dengan bentuk Nifal imperfek dari אכל membentuk pertanyaan retoris. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya retorisnya.
- source_word: תָּפֵל
  choice: makanan hambar
  rationale: Kata ini berarti tawar, hambar, atau tidak berbumbu. Kata benda 'makanan' dibuat tersurat berdasarkan konteks agar kalimat jelas dan alami.
- source_word: מִ/בְּלִי מֶלַח
  choice: tanpa garam
  rationale: Frasa preposisional ini secara langsung menyatakan ketiadaan garam; padanan ini ringkas dan wajar.
- source_word: אִם יֶשׁ
  choice: atau adakah
  rationale: Dalam konteks ini אִם memperkenalkan pertanyaan retoris kedua yang sejajar dengan pertanyaan pertama. 'Atau adakah' mempertahankan kesejajaran itu.
- source_word: טַעַם
  choice: rasa
  rationale: Nomina ini berarti rasa atau cita rasa. 'Rasa' merupakan padanan langsung dan menggemakan kata 'hambar' pada baris pertama.
- source_word: בְּ/רִיר
  choice: dalam lendir
  rationale: Nomina yang sulit ini mungkin menunjuk pada cairan berlendir, lendir, atau sari. 'Lendir' mempertahankan nuansa tidak menggugah selera dalam konteks, sementara ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: חַלָּמוּת
  choice: tanaman malow
  rationale: Nama tumbuhan ini tidak pasti. 'Malow' dipakai sebagai transliterasi nama umum mallow agar tidak disalahartikan sebagai tanaman lain yang lebih dikenal dalam bahasa Indonesia; alternatif tradisional dicatat dalam catatan kaki.
