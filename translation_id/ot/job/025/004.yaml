    rationale: Dalam bahasa Indonesia, pelaku atau sumber kelahiran perlu ditandai dengan "oleh" atau, untuk makna yang dikehendaki di sini, asal kelahiran dengan "dari." Ibrani יְלוּד אִשָּׁה berarti 'yang lahir/dilahirkan dari perempuan,' bukan 'perempuan yang dilahirkan.'
  - severity: low
