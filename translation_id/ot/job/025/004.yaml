base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: id
  text: Jadi, bagaimana mungkin manusia benar di hadapan Allah?[a] Bagaimana mungkin orang yang lahir dari perempuan murni?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama Allah.” Secara harfiah, bahasa Ibrani berbunyi “dengan Allah,” tetapi ungkapan itu dapat menunjuk pada kedudukan seseorang di hadapan-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersih” atau “tidak bersalah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: Jadi, bagaimana mungkin ...? / Bagaimana mungkin ...?
  rationale: מַה dalam pertanyaan retoris paling wajar diungkapkan dengan “bagaimana mungkin”; pada klausa pertama, וּ diterjemahkan “Jadi” untuk menyatakan hubungan dengan konteks, sedangkan pengulangan konjungsi pada klausa kedua tidak diperlukan dalam bahasa Indonesia.
- source_word: יִצְדַּק
  choice: benar
  rationale: Bentuk Qal dari צדק menyatakan keadaan benar atau berada di pihak yang benar. “Benar” mempertahankan keluasan makna dan tidak mempersempitnya menjadi tindakan forensik “dibenarkan”.
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: אֱנוֹשׁ merujuk pada manusia fana atau rapuh. “Manusia” merupakan istilah generik yang alami dalam bahasa Indonesia, sementara nuansa kefanaan tersirat oleh paralel “orang yang dilahirkan perempuan”.
- source_word: עִם אֵל
  choice: di hadapan Allah
  rationale: Secara harfiah berarti “dengan Allah,” tetapi dalam konteks pertanyaan tentang kedudukan manusia terhadap Allah, idiom Indonesia “di hadapan Allah” lebih alami dan tetap membuka nuansa relasional maupun pengadilan.
- source_word: יִזְכֶּה
  choice: suci
  rationale: Bentuk Qal dari זכה dapat berarti bersih, murni, atau tidak bersalah. “Suci” alami dalam paralel dengan “benar,” tetapi alternatif leksikal dicatat karena kata Ibrani tidak hanya memiliki satu nuansa.
- source_word: יְלוּד אִשָּׁה
  choice: orang yang dilahirkan perempuan
  rationale: Ungkapan ini menunjuk secara umum kepada manusia dalam keadaan sebagai makhluk. Terjemahan tersebut mempertahankan citra kelahiran dari perempuan tanpa menambahkan “anak laki-laki” yang tidak diperlukan.
theological_decisions:
- issue: Bahasa generik tentang manusia
  choice: manusia ... orang yang dilahirkan perempuan
  alternative: seorang fana ... yang lahir dari perempuan
  rationale: Kedua ungkapan Ibrani bersifat representatif dan generik. Pilihan ini inklusif secara alami dalam bahasa Indonesia serta mempertahankan paralelisme dan kondisi manusia sebagai makhluk.
- issue: Kedudukan manusia dalam hubungannya dengan Allah
  choice: di hadapan Allah
  alternative: dengan Allah
  rationale: Preposisi Ibraninya secara harfiah “dengan,” tetapi “di hadapan” menyampaikan kedudukan manusia terhadap Allah tanpa memastikan apakah nuansanya semata-mata relasional atau secara khusus yudisial.
- issue: Cakupan makna kemurnian
  choice: suci
  alternative: bersih; tidak bersalah
  rationale: Kata זכה dapat menyentuh kemurnian moral, kebersihan, atau ketidakbersalahan. Teks utama memakai padanan yang alami, sementara catatan kaki menjaga keluasan semantisnya.
translation_notes:
  register: Bahasa Indonesia baku modern, bernada khidmat tetapi mudah dipahami. Pertanyaan retoris dan paralelisme kedua klausa dipertahankan; istilah teknis teologis seperti “dibenarkan” sengaja dihindari agar ketegangan dan keluasan makna Ibrani tidak dipersempit.
