  text: 'Then Bildad the Shuhite answered and said:'
translation:
  language: id
  text: Lalu Bildad, orang Suah, menjawab dan berkata,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam formula naratif yang memperkenalkan giliran bicara, verba ענה berarti “menjawab” atau “menanggapi”; “menjawab” mempertahankan corak dialogis teks.
- source_word: בִּלְדַּד
  choice: Bildad
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַשֻּׁחִי
  choice: orang Suah
  rationale: Sebutan nisbah ini menunjukkan asal wilayah atau kelompok Bildad. “Orang Suah” alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan nama Suah.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Verba אמר dalam formula naratif ini berarti “berkata”; unsur ini dipertahankan bersama “menjawab” agar pola Ibrani tidak dipadatkan tanpa alasan.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Lalu ... menjawab dan berkata
  rationale: Rangkaian wayyiqtol menggerakkan narasi ke giliran bicara berikutnya. “Lalu” menyampaikan urutan tersebut secara alami, sedangkan kedua verba dipertahankan.
