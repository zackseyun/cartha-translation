  text: how much less man[a], who is a maggot, and the son of man[b], who is a worm!
translation:
  language: id
  text: Apalagi manusia—belatung—dan anak manusia—ulat!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף כִּי
  choice: apalagi
  rationale: 'Dalam rangkaian argumen Bildad, ungkapan ini menyatakan perbandingan a fortiori: jika benda-benda langit pun tidak murni di hadapan Allah, terlebih lagi manusia yang rapuh.'
- source_word: אֱנוֹשׁ
  choice: manusia
  rationale: Kata ini menunjuk kepada manusia dengan nuansa kefanaan dan kerapuhan. “Manusia” alami dalam bahasa Indonesia, sedangkan nuansa khususnya dicatat dalam catatan kaki.
- source_word: רִמָּה
  choice: belatung
  rationale: Kata ini lazim menunjuk kepada belatung yang berkaitan dengan pembusukan. Pilihan ini juga membedakannya dari תּוֹלֵעָה pada baris sejajar.
- source_word: בֶן אָדָם
  choice: anak manusia
  rationale: Terjemahan harfiah ini mempertahankan bentuk dan kesejajaran puisi Ibrani. Dalam konteks ini ungkapan tersebut berarti seorang manusia, bukan gelar mesianik.
- source_word: תּוֹלֵעָה
  choice: ulat
  rationale: Istilah ini lebih umum daripada רִמָּה dan cocok diterjemahkan “ulat”, sehingga perbedaan antara kedua gambaran puitis tetap terpelihara.
theological_decisions:
- issue: Apakah “anak manusia” merupakan gelar mesianik
  choice: Ungkapan puitis non-gelar yang menunjuk kepada manusia
  alternative: Gelar mesianik
  rationale: בֶן אָדָם sejajar dengan אֱנוֹשׁ dan menggambarkan kerapuhan manusia. Konteks tidak mendukung pembacaan sebagai gelar mesianik.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Metafora langsung “adalah belatung” dan “adalah ulat” dipertahankan agar daya retoris serta ketegangan teks sumber tidak diperlemah.
