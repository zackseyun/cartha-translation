  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: id
  text: Adakah jumlah bagi pasukan-Nya?[a] Dan atas siapakah terang-Nya tidak terbit?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bala tentara-Nya” atau “kelompok-kelompok-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Dan atas siapakah terang-Nya tidak muncul?”
    reason: lexical_alternative
  - marker: c
    text: “Terang-Nya” dapat menunjuk pada terang Allah yang menjangkau secara universal, kemegahan-Nya, atau jangkauan kekuasaan-Nya; bahasa Ibrani tidak mempersempit maknanya.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: Dapatkah ... dihitung?
  rationale: Ungkapan eksistensial harfiah ‘adakah jumlah’ dialihkan menjadi pertanyaan idiomatis dalam bahasa Indonesia tanpa mengubah maksud bahwa pasukan-Nya tidak terhitung.
- source_word: לִגְדוּדָיו
  choice: pasukan-Nya
  rationale: גְּדוּד berarti pasukan, gerombolan, atau kelompok bersenjata. ‘Pasukan’ paling wajar dan sesuai dengan gambaran kekuasaan Allah dalam konteks.
- source_word: וְעַל־מִי
  choice: Dan atas siapakah
  rationale: Mempertahankan metafora ruang dari עַל serta hubungan antarklausa dengan וְ.
- source_word: לֹא יָקוּם
  choice: tidak terbit
  rationale: קוּם berarti bangkit atau muncul. Dengan ‘terang’ sebagai subjek, ‘terbit’ merupakan padanan Indonesia yang alami sambil mempertahankan citra terang yang menjangkau semua orang.
- source_word: אוֹרֵהוּ
  choice: terang-Nya
  rationale: אוֹר secara langsung berarti ‘terang’ atau ‘cahaya’. ‘Terang’ mempertahankan keluasan metaforanya tanpa membatasinya pada sinar matahari, kemegahan, atau perkenanan.
theological_decisions:
- issue: Acuan akhiran orang ketiga tunggal maskulin pada ‘pasukan-Nya’ dan ‘terang-Nya’
  choice: Akhiran itu dipahami merujuk kepada Allah, dengan bentuk pronominal tetap dipertahankan.
  alternative: Acuan umum kepada penguasa surgawi.
  rationale: Dalam Ayub 25, Bildad sedang berbicara tentang kekuasaan dan kedahsyatan Allah. Kapitalisasi ‘-Nya’ mengikuti kaidah bahasa Indonesia untuk pronomina yang mengacu kepada Allah.
- issue: Makna ‘terang-Nya’
  choice: Dipertahankan sebagai metafora luas bagi terang Allah yang menjangkau secara universal.
  alternative: Sinar matahari secara khusus, kemegahan ilahi, atau perkenanan Allah.
  rationale: Bahasa Ibrani tidak mempersempit acuannya. Karena itu, teks utama mempertahankan ‘terang’ dan catatan kaki menjelaskan rentang kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Klausa pertama dibuat idiomatis agar mudah dipahami, sedangkan klausa kedua mempertahankan citra puitis Ibrani. Kapitalisasi pronomina ilahi mengikuti kaidah ejaan bahasa Indonesia.
