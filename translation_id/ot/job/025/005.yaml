  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: id
  text: Sesungguhnya, bahkan bulan pun tidak bercahaya[a], dan bintang-bintang tidak murni[b] di mata-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bulan pun tidak terang” atau “tidak memancarkan cahaya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bintang-bintang tidak bersih”, atau mungkin “tidak cemerlang”, di mata-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menegaskan pengamatan yang akan disampaikan. “Sesungguhnya” mempertahankan daya penegasnya dalam ragam puitis yang wajar bagi pembaca Indonesia modern.
- source_word: עַד
  choice: bahkan
  rationale: Di sini kata ini berfungsi menguatkan unsur berikutnya—“bahkan bulan”—bukan menunjukkan batas ruang atau waktu.
- source_word: יָרֵחַ
  choice: bulan
  rationale: Padanan langsung bagi benda langit yang disebut dalam perbandingan.
- source_word: לֹא יַאֲהִיל
  choice: tidak bercahaya
  rationale: Bentuk verba ini dalam konteks tersebut berkaitan dengan memancarkan cahaya atau bersinar. “Tidak bercahaya” alami dalam bahasa Indonesia serta tetap membuka nuansa ‘tidak terang’ atau ‘tidak memancarkan cahaya’.
- source_word: וְכוֹכָבִים
  choice: dan bintang-bintang
  rationale: Meneruskan gambaran benda-benda langit secara koordinatif dan dekat dengan struktur Ibrani.
- source_word: לֹא זַכּוּ
  choice: tidak murni
  rationale: Akar kata ini dapat menunjuk pada kemurnian, kebersihan, atau kecemerlangan. Dalam ungkapan penilaian “di mata-Nya”, “tidak murni” paling baik mempertahankan dimensi kualitatif tanpa menutup kemungkinan nuansa lain, yang dicatat dalam catatan kaki.
- source_word: בְעֵינָיו
  choice: di mata-Nya
  rationale: Ungkapan Ibrani ini menyatakan penilaian dari sudut pandang seseorang. “Di mata-Nya” mempertahankan metafora sumber dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan akhiran pronomina orang ketiga tunggal maskulin pada בְעֵינָיו
  choice: -Nya merujuk kepada Allah
  alternative: Merujuk kepada seorang pengamat yang tidak disebutkan dalam argumen puitis
  rationale: Dalam konteks Ayub 25:2–6, Bildad sedang berbicara tentang keluhuran Allah dan ketidakmurnian makhluk di hadapan-Nya. Karena itu, rujukan kepada Allah paling wajar. Huruf kapital pada “-Nya” memperjelas rujukan kontekstual ini sesuai kebiasaan bahasa Indonesia, tanpa menambahkan nama ilahi ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Partikel “pun” menguatkan “bahkan” secara alami. Susunan klausa tetap dekat dengan paralelisme Ibrani, sedangkan catatan kaki mempertahankan ambiguitas leksikal pada kedua verba/adjektiva utama.
