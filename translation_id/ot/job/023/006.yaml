  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: id
  text: Apakah Dia akan berbantah dengan aku dengan kekuatan-Nya yang besar? Tidak; Dia pasti akan memperhatikan aku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia akan mengarahkan hati-Nya kepadaku”; mungkin juga, “Dia akan menaruh kekuatan dalam diriku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: dengan kekuatan-Nya yang besar
  rationale: Ungkapan ini mempertahankan unsur רָב, ‘besar/berlimpah’, dan כֹּחַ, ‘kekuatan’, sekaligus terdengar wajar dalam bahasa Indonesia. Dalam pertanyaan ini frasa tersebut menggambarkan kemungkinan Allah menghadapi Ayub dengan kekuatan yang tak tertandingi.
- source_word: יָרִיב עִמָּדִי
  choice: akan berbantah dengan aku
  rationale: Kata ריב memiliki nuansa perselisihan dan perkara hukum dalam konteks Ayub. ‘Berbantah dengan aku’ mempertahankan nuansa menghadapi perkara tanpa memakai istilah hukum yang terlalu teknis.
- source_word: לֹא אַךְ
  choice: Tidak; justru
  rationale: Rangkaian ini menolak kemungkinan dalam pertanyaan pertama lalu beralih secara tegas kepada apa yang Ayub yakini akan dilakukan Allah. ‘Tidak; justru’ menyampaikan kontras itu dengan alami.
- source_word: יָשִׂם בִּי
  choice: Dia akan memperhatikan aku
  rationale: שׂים dengan preposisi ב dapat menyatakan mengarahkan perhatian kepada seseorang. Dalam konteks hukum, Ayub berharap Allah mendengarkan perkaranya. Karena ungkapan Ibrani juga dapat dipahami secara lain, alternatif penting dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Makna tindakan Allah pada bagian kedua ayat
  choice: Ayub yakin Allah tidak akan mengalahkannya semata-mata dengan kekuatan, tetapi akan memperhatikannya dan memberi ruang bagi perkaranya.
  alternative: Allah akan menaruh hati-Nya pada Ayub, atau akan memberikan kekuatan kepada Ayub.
  rationale: 'Konteks dekatnya bersifat yudisial: Ayub ingin mengajukan perkaranya di hadapan Allah (23:3–7). Terjemahan utama mengikuti makna perhatian atau pengindahan, tetapi catatan kaki mempertahankan kemungkinan leksikal lain dan tidak meniadakan ketegangan antara kuasa Allah dan harapan Ayub akan perlakuan yang adil.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Berbantah’ mempertahankan latar perkara hukum dengan ungkapan yang masih mudah dipahami; ‘memperhatikan’ menyampaikan bacaan utama secara alami. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
