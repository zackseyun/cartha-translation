    issue: “justru” sebagai terjemahan אַךְ
    rationale: Kata ini secara khusus menyatakan pembalikan atau pertentangan (“on the contrary”), sedangkan dalam pembacaan utama yang dipilih, לֹא אַךְ menolak kemungkinan sebelumnya dan menegaskan tindakan Allah. “Pasti” menyatakan penegasan tanpa menambah hubungan kontras yang terlalu kuat.
  - severity: low
    issue: Catatan kaki “menaruh hati-Nya kepadaku”
    rationale: Dalam pemakaian Indonesia modern, “menaruh hati kepada” lazim bernuansa kasih romantis. Bentuk “mengarahkan hati-Nya kepadaku” mempertahankan citra literal alternatif tanpa konotasi tersebut.
