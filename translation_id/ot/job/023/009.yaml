base_translation:
  language: en
  yaml_path: translation/ot/job/023/009.yaml
  text: On the left[a], when he is at work, I do not perceive him; he turns to the right[b], and I do not see him.
translation:
  language: id
  text: Di sebelah kiri[a], ketika Ia bekerja, aku tidak dapat menangkap-Nya; Ia menyelubungi diri di sebelah kanan[b], dan aku tidak melihat-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kiri” juga dapat menunjuk ke arah utara.
    reason: cultural_note
  - marker: b
    text: 'Teks Ibrani sulit. Secara lebih harfiah: “Ia menyelubungi diri di sebelah kanan.” Sebagian orang memahaminya: “Ia berbalik ke sebelah kanan.” “Kiri” dan “kanan” juga dapat bersesuaian dengan utara dan selatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאול
  choice: di sebelah kiri
  rationale: Makna dasarnya adalah sisi kiri; dalam pasangan puitis dengan יָמִין, kontras kiri–kanan lebih tepat dipertahankan daripada diubah menjadi utara–selatan.
- source_word: בַּעֲשֹׂתוֹ
  choice: ketika Ia bekerja
  rationale: Preposisi ב dengan infinitif konstruk עשה dan sufiks orang ketiga maskulin tunggal wajar dipahami secara temporal, yaitu 'ketika Ia bertindak/bekerja'.
- source_word: אָחַז
  choice: aku tidak dapat menangkap-Nya
  rationale: Kata kerja ini pada dasarnya berarti memegang atau menangkap. Dalam konteks pencarian Ayub akan Allah, ungkapan ini mempertahankan citra konkret sekaligus menyiratkan ketidakmampuan menemukan atau memahami kehadiran-Nya.
- source_word: יַעְטֹף
  choice: Ia menyelubungi diri
  rationale: Kata kerja עטף lazimnya berarti membungkus, menyelubungi, atau menutupi. Terjemahan ini mempertahankan makna leksikal yang lebih langsung dan tidak menyelesaikan teks sulit ini menjadi sekadar 'berbalik'.
- source_word: יָמִין
  choice: di sebelah kanan
  rationale: Makna spasial dasarnya dipertahankan agar paralelisme kiri–kanan dalam bahasa Ibrani tetap nyata.
- source_word: אֶרְאֶה
  choice: aku tidak melihat-Nya
  rationale: ראה secara langsung berarti 'melihat'; objek orang ketiga dipahami dari konteks sebagai Allah.
theological_decisions:
- issue: Rujukan kata kerja dan sufiks orang ketiga
  choice: Allah sebagai rujukan, ditandai dengan huruf kapital pada Ia dan -Nya
  alternative: Seorang 'dia' yang tidak disebutkan secara khusus
  rationale: Ayat ini tidak menyebut nama Allah, tetapi konteks langsung Ayub 23:8–10 jelas menggambarkan pencarian Ayub akan Allah. Kapitalisasi bahasa Indonesia memperjelas rujukan kontekstual tanpa menambahkan identitas teologis baru.
- issue: Hubungan klausa terakhir dengan tindakan menyelubungi diri
  choice: diterjemahkan 'sehingga aku tidak melihat-Nya'
  alternative: 'dua klausa koordinatif: ''dan aku tidak melihat-Nya'''
  rationale: ו dapat menyatakan hasil dalam konteks. 'Sehingga' menghasilkan bahasa Indonesia yang alami, tetapi tidak mengubah gagasan pokok bahwa tindakan yang digambarkan berkaitan dengan ketidakmampuan Ayub melihat Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pronomina ilahi dikapitalisasi sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Struktur kiri–kanan dipertahankan, dan ketidakpastian leksikal יַעְטֹף dijelaskan dalam catatan kaki.
