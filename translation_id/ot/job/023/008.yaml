id: JOB.23.8
reference: Job 23:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵ֤ן קֶ֣דֶם אֶהֱלֹ֣ךְ וְ/אֵינֶ֑/נּוּ וְ֝/אָח֗וֹר וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: id
  text: Lihatlah, aku pergi ke timur, tetapi Dia tidak ada di sana; lalu ke barat, tetapi aku tidak dapat melihat-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke depan ... ke belakang.” Istilah arah dalam bahasa Ibrani dapat dipahami secara spasial sebagai timur dan barat, atau secara relatif sebagai depan dan belakang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Kata ini menarik perhatian pada pernyataan Ayub; “Lihatlah” mempertahankan daya interjektifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: קֶדֶם
  choice: ke timur
  rationale: Dalam pasangan puitis dengan אָחוֹר, kata ini secara wajar menunjuk arah timur, meskipun makna “ke depan” tetap mungkin.
- source_word: אֶהֱלֹךְ
  choice: aku pergi
  rationale: Bentuk imperfek orang pertama tunggal dari הלך menyatakan gerak Ayub dalam pencariannya tanpa menentukan cara bergerak.
- source_word: וְאֵינֶנּוּ
  choice: tetapi Dia tidak ada di sana
  rationale: Konteks menunjukkan bahwa pronomina itu merujuk kepada Allah. “Di sana” dibuat eksplisit agar hasil pencarian menurut arah tersebut jelas dalam bahasa Indonesia, sedangkan “tetapi” menyampaikan pertentangan yang tersirat.
- source_word: אָחוֹר
  choice: ke barat
  rationale: Sebagai lawan arah קֶדֶם, kata ini paling alami dipahami sebagai barat; kemungkinan harfiah-relasional “ke belakang” dicatat dalam catatan kaki.
- source_word: לֹא אָבִין לוֹ
  choice: aku tidak dapat melihat-Nya
  rationale: בין dapat berarti memahami, membedakan, atau menangkap keberadaan. Dalam konteks mencari Allah, “melihat” menyampaikan kegagalan menemukan atau mengenali kehadiran-Nya secara alami, tanpa mengartikannya sebagai sekadar tidak memahami.
theological_decisions:
- issue: Rujukan pronomina orang ketiga
  choice: Pronomina dipahami merujuk kepada Allah dan ditulis sebagai “Dia” serta “-Nya.”
  alternative: Rujukan maskulin tunggal dibiarkan tidak ditentukan.
  rationale: Konteks langsung menggambarkan pencarian Ayub akan Allah, sehingga rujukan ini dapat dibuat jelas tanpa menambahkan gagasan teologis baru.
- issue: Makna pencarian dan persepsi
  choice: Ayat menggambarkan ketidakmampuan Ayub menemukan atau melihat Allah.
  alternative: לֹא אָבִין לוֹ diterjemahkan “aku tidak memahami-Nya.”
  rationale: Konteks gerak ke berbagai arah mendukung makna perseptual, tetapi cakupan verba בין yang lebih luas tidak boleh dipakai untuk menyimpulkan bahwa Allah sama sekali tidak hadir.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme dua arah dipertahankan. Huruf kapital pada pronomina ilahi mengikuti kebiasaan baku penerbitan Alkitab bahasa Indonesia dan memperjelas rujukan kontekstual.
