  text: Even today my complaint is rebellious[b][a]; my hand is heavy because of my groaning.
translation:
  language: id
  text: Bahkan hari ini keluhanku merupakan pemberontakan[a]; tanganku terasa berat karena eranganku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keluhanku pahit.” Namun, kata Ibrani ini secara lebih harfiah berarti “pemberontakan” atau “sikap menentang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tanganku berat atas eranganku.” Sebagian penafsir memahami “tangan” sebagai gambaran ungkapan yang tertahan atau terbebani; yang lain mengusulkan perbaikan teks menjadi “tangan-Nya” atau “tangannya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: Bahkan hari ini
  rationale: Gabungan ini menegaskan bahwa keadaan dan keluhan Ayub masih berlanjut sampai saat ini; ungkapan tersebut wajar dalam bahasa Indonesia modern.
- source_word: מְרִי
  choice: bersifat memberontak
  rationale: Kata ini pada dasarnya menunjuk pada pemberontakan atau sikap menentang. Bentuk predikatif ini mempertahankan daya ungkap Ibrani tanpa mengubahnya menjadi sekadar kepahitan.
- source_word: שִׂיחִי
  choice: keluhanku
  rationale: Dalam konteks Ayub, kata ini dapat berarti renungan, tuturan, atau keluhan. Hubungannya dengan erangan mendukung pilihan 'keluhanku'.
- source_word: יָדִי
  choice: tanganku
  rationale: Teks Masoret secara langsung memakai akhiran orang pertama tunggal, sehingga terjemahan utama mempertahankan 'tanganku' meskipun ungkapannya sulit.
- source_word: כָּבְדָה
  choice: terasa berat
  rationale: Kata kerja ini menyatakan keadaan berat. 'Terasa berat' menghasilkan bahasa Indonesia yang alami sambil mempertahankan gambaran dasarnya.
- source_word: עַל
  choice: karena
  rationale: Dalam konteks ini preposisi tersebut dapat menyatakan hubungan sebab antara beratnya tangan Ayub dan erangannya, walaupun arti dasarnya lebih luas.
- source_word: אַנְחָתִי
  choice: eranganku
  rationale: Kata benda ini menunjuk pada desahan atau erangan dalam penderitaan; 'eranganku' sesuai dengan intensitas ratapan Ayub.
theological_decisions:
- issue: Apakah ucapan Ayub perlu diperhalus agar tidak menyiratkan sikap menentang
  choice: Mempertahankan makna kuat 'bersifat memberontak' dalam teks utama
  alternative: '''keluhanku pahit'''
  rationale: Bahasa Ibrani secara lebih langsung menunjuk pada pemberontakan atau perlawanan. Pilihan ini mempertahankan ketegangan teologis dalam ucapan seorang yang menderita dan tidak meredakannya melalui tafsiran.
- issue: Identitas tangan yang berat
  choice: 'Mengikuti Teks Masoret: ''tanganku'''
  alternative: '''tangan-Nya'' atau ''tangannya'' berdasarkan perbaikan teks yang diusulkan'
  rationale: Bentuk Ibrani yang tersedia memiliki akhiran orang pertama tunggal. Karena ungkapannya sulit, alternatif tekstual dijelaskan dalam catatan kaki dan tidak dimasukkan diam-diam ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Ungkapan 'bersifat memberontak' sengaja mempertahankan ketajaman leksikal מְרִי, sedangkan catatan kaki menjelaskan alternatif 'pahit'. Susunan klausa kedua dibuat cukup alami tanpa menutupi kesulitan ungkapan Ibraninya.
