  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: id
  text: Sekiranya saja aku tahu di mana aku dapat menemukan Dia, agar aku dapat datang ke tempat kediaman-Nya![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat-Nya.” Kata Ibrani ini dapat menunjuk pada tempat atau lokasi yang tetap atau ditetapkan; “tempat kediaman-Nya” menegaskan bahwa itulah tempat Dia dapat dijumpai.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Sekiranya saja
  rationale: Ungkapan idiomatis ini menyatakan kerinduan atau harapan kuat, bukan pertanyaan harfiah tentang siapa yang akan memberi. “Sekiranya saja” alami dalam bahasa Indonesia dan mempertahankan daya optatifnya.
- source_word: יָדַעְתִּי וְאֶמְצָאֵהוּ
  choice: aku tahu di mana aku dapat menemukan Dia
  rationale: Secara harfiah rangkaian ini berbunyi kira-kira “aku tahu dan menemukan Dia,” tetapi dalam konstruksi harapan ini yang dimaksud ialah mengetahui tempat atau cara untuk menemukan-Nya. Penyisipan “di mana” membuat hubungan yang tersirat itu jelas dan alami tanpa mengubah arah makna.
- source_word: אָבוֹא עַד
  choice: Aku akan datang ke
  rationale: Bentuk orang pertama meneruskan keinginan Ayub dan menggambarkan tindakan yang akan dilakukannya jika dapat menemukan Allah. “Datang ke” menyampaikan gerak menuju tujuan secara wajar.
- source_word: תְּכוּנָתוֹ
  choice: tempat kediaman-Nya
  rationale: Nomina ini menunjuk pada tempat yang tetap atau ditetapkan. Dalam konteks ini, “tempat kediaman-Nya” mengungkapkan lokasi tempat Allah dapat dijumpai, tanpa memasukkan nuansa yudisial seperti “takhta” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Acuan akhiran maskulin tunggal pada “Dia” dan “-Nya”
  choice: Allah sebagai acuan tersirat; pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan bahasa Indonesia.
  alternative: Pronomina dapat ditulis dengan huruf kecil atau nama “Allah” dapat ditambahkan secara eksplisit.
  rationale: Konteks langsung menunjukkan bahwa Ayub ingin menghadap Allah untuk menyampaikan perkaranya, meskipun nama Allah tidak muncul dalam ayat ini. Pronomina mempertahankan ketidaklangsungan teks sumber, sedangkan kapitalisasi mengikuti konvensi umum Alkitab bahasa Indonesia dan tidak menambah klaim teologis.
- issue: Nuansa תְּכוּנָתוֹ
  choice: Dipahami secara lokatif sebagai tempat kediaman Allah.
  alternative: “tempat-Nya,” “tempat yang ditetapkan bagi-Nya,” atau, secara lebih interpretatif, “takhta-Nya.”
  rationale: Konteks menekankan usaha Ayub untuk mencapai tempat Allah dapat dijumpai. Terjemahan lokatif menjaga gambaran tersebut tanpa menetapkan bahwa yang dimaksud khususnya ruang sidang atau takhta.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Seruan dibagi menjadi dua kalimat agar kerinduan Ayub terdengar alami dan kuat. “Sekiranya saja” dipilih sebagai ungkapan harapan yang mudah dipahami; pronomina “Dia/-Nya” mempertahankan acuan tersirat kepada Allah.
