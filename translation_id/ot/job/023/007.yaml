base_translation:
  language: en
  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: id
  text: Di sana orang yang jujur dapat berperkara dengan Dia[a], dan aku akan luput untuk selamanya dari hakimku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dapat beradu alasan dengan Dia” atau “dapat mengajukan perkaranya di hadapan-Nya”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan aku akan dilepaskan untuk selamanya dari hakimku”; frasa Ibrani terakhir juga dapat dipahami sebagai “dari orang yang menghakimi aku”.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Di sana
  rationale: Keterangan tempat ini menunjuk pada tempat perjumpaan dengan Allah yang dibayangkan Ayub dalam konteks sekitar. “Di sana” alami dan mempertahankan acuan lokatifnya.
- source_word: יָשָׁר
  choice: orang yang tulus
  rationale: Kata sifat ini menggambarkan kelurusan moral atau integritas. Dalam bahasa Indonesia, “orang yang tulus” menyampaikan integritas tanpa memasukkan istilah teologis yang lebih khusus.
- source_word: נוֹכָח
  choice: dapat berperkara
  rationale: Dalam konteks pengadilan pada bagian ini, kata tersebut menunjuk pada penyampaian alasan atau perkara di hadapan pihak lain. “Berperkara” mempertahankan nuansa yuridis, sedangkan “dapat” mengungkapkan kemungkinan yang tersirat dalam konteks.
- source_word: עִמּוֹ
  choice: dengan Dia
  rationale: Preposisi ini secara harfiah berarti “dengan dia”. Referennya adalah Allah dalam konteks; kapitalisasi pronomina mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi tanpa mengganti pronomina Ibrani dengan nama atau gelar.
- source_word: וַאֲפַלְּטָה
  choice: dan aku akan luput
  rationale: Bentuk dari פלט menyatakan lolos atau terlepas. “Akan luput” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi pembebasan hukum secara teknis.
- source_word: לָנֶצַח
  choice: untuk selamanya
  rationale: Ungkapan ini menyatakan hasil yang tetap atau berlangsung tanpa akhir. “Untuk selamanya” mempertahankan kekuatan duratifnya dengan bahasa Indonesia yang wajar.
- source_word: מִשֹּׁפְטִי
  choice: dari hakimku
  rationale: Bentuk ini dapat berarti “dari hakimku” atau “dari orang yang menghakimi aku”. “Hakimku” ringkas, mempertahankan gambaran ruang sidang, dan tidak menentukan lebih jauh sifat peran tokoh tersebut.
theological_decisions:
- issue: Rujukan dan nuansa hukum dari מִשֹּׁפְטִי
  choice: Mempertahankan “hakimku” tanpa menjelaskan lebih jauh apakah yang dimaksud ialah Allah sebagai hakim atau sosok yang sedang menghakimi Ayub.
  alternative: “orang yang menghakimi aku” atau, secara lebih interpretatif, “pendakwaku”
  rationale: Bahasa Ibrani mempertahankan gambaran yuridis sekaligus membiarkan peran tepat sang hakim tidak dijelaskan. Terjemahan tidak seharusnya mengubahnya menjadi “pendakwa” atau memaksakan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa yang dipakai modern, lugas, dan bermartabat. Istilah “berperkara” mempertahankan latar ruang sidang dari konteks, sedangkan “orang yang tulus” mengungkapkan integritas moral dengan ungkapan yang mudah dipahami. Kapitalisasi “Dia” mengikuti konvensi umum bahasa Indonesia bagi pronomina yang merujuk kepada Allah.
