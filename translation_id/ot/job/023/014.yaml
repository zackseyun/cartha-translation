source:
  edition: WLC
  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: id
  text: Sebab Dia akan menuntaskan apa yang ditetapkan bagiku[a], dan banyak hal semacam itu ada pada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapanku,” “peraturanku,” atau “bagian yang ditetapkan bagiku.” Kata Ibrani ini dapat menunjuk pada sesuatu yang telah ditentukan atau ditetapkan bagi Ayub.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan kausal tersebut secara alami dalam bahasa Indonesia.
- source_word: יַשְׁלִים
  choice: akan menuntaskan
  rationale: Bentuk hifil dari שׁלם menyatakan tindakan membawa sesuatu sampai selesai atau menggenapinya. “Akan menuntaskan” menyampaikan bahwa Allah akan menjalankan hal itu hingga selesai.
- source_word: חֻקִּי
  choice: apa yang ditetapkan bagiku
  rationale: Dalam konteks ini, חֹק menunjuk pada sesuatu yang telah ditentukan atau menjadi bagian yang ditetapkan bagi Ayub. Terjemahan ini lebih jelas daripada ungkapan harfiah “ketetapanku,” yang dapat disalahpahami sebagai ketetapan yang dibuat oleh Ayub sendiri.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: dan banyak hal semacam itu
  rationale: Ungkapan ini menunjuk pada banyak perkara lain dari jenis yang sama tanpa memperinci apa saja perkara tersebut.
- source_word: עִמּוֹ
  choice: ada pada-Nya
  rationale: Terjemahan ini mempertahankan gambaran bahwa banyak perkara serupa berada pada Allah—dalam ketetapan, kuasa, atau maksud-Nya—tanpa mempersempit maknanya.
theological_decisions:
- issue: Apakah חֻקִּי harus dipahami secara legal sebagai “ketetapanku” atau sebagai sesuatu yang Allah tetapkan bagi Ayub
  choice: apa yang ditetapkan bagiku
  alternative: ketetapanku; bagianku yang ditetapkan
  rationale: Konteksnya berbicara tentang keputusan Allah mengenai jalan dan nasib Ayub, bukan peraturan yang dibuat Ayub. Rumusan ini menyatakan kedaulatan Allah sambil mempertahankan keluasan makna kata Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
