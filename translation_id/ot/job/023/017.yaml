  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: id
  text: Sebab aku tidak dibungkam karena kegelapan,[a] dan bukan karena kegelapan yang pekat menutupi wajahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab aku tidak dilenyapkan karena kegelapan, dan bukan karena kegelapan yang pekat menutupi wajahku.” Teks Ibrani ayat ini sulit, khususnya makna “dibungkam/dilenyapkan” dan apakah klausa kedua berarti “menutupi wajahku” atau “menutupi di hadapanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya dan cocok dengan alur wacana bahasa Indonesia.
- source_word: נִצְמַתִּי
  choice: aku tidak dibungkam
  rationale: Bentuk nifal dari צמת dapat berarti dibungkam, dilenyapkan, atau diakhiri. Dalam konteks keluhan Ayub yang masih berlanjut, 'dibungkam' paling baik menangkap maknanya sambil mempertahankan bentuk pasif.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: oleh kegelapan
  rationale: Ungkapan ini dipahami menyatakan sebab atau perantara. 'Oleh kegelapan' alami dalam konstruksi pasif bahasa Indonesia dan mempertahankan hubungan antara kegelapan dan tindakan membungkam.
- source_word: וּמִפָּנַי
  choice: wajahku
  rationale: Akhiran orang pertama tunggal pada פָּנִים secara langsung menunjuk pada 'wajahku', meskipun tafsiran adverbial 'di hadapanku' juga mungkin dan dicatat dalam catatan kaki.
- source_word: כִּסָּה
  choice: menutupi
  rationale: Padanan langsung dan konkret bagi verba yang berarti menutupi atau menyembunyikan.
- source_word: אֹפֶל
  choice: kelam pekat
  rationale: Menunjukkan kegelapan yang lebih berat daripada חֹשֶׁךְ dan mempertahankan pembedaan leksikal antara dua istilah kegelapan dalam baris ini.
