  terminology: “Dibungkam,” “kegelapan,” dan “kegelapan yang pekat” dengan baik membedakan חֹשֶׁךְ dan אֹפֶל tanpa menentukan secara berlebihan arti נִצְמַתִּי yang diperselisihkan.
