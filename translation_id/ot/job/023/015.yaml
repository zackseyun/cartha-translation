  text: עַל כֵּ֭ן מִ/פָּנָ֣י/ו אֶבָּהֵ֑ל אֶ֝תְבּוֹנֵ֗ן וְ/אֶפְחַ֥ד מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/015.yaml
  text: Therefore I am terrified before him[a]; when I consider[b], I am afraid of him.
translation:
  language: id
  text: Karena itu, aku gentar di hadapan-Nya[a]; ketika aku merenung[b], aku takut kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena Dia” atau “oleh hadirat-Nya”; ungkapan Ibrani secara harfiah berkaitan dengan “dari wajah/hadirat-Nya”.
    reason: lexical_alternative
  - marker: b
    text: Atau “aku mempertimbangkannya” atau “aku memikirkannya”. Teks Ibrani tidak menyebutkan objek perenungan itu secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan ini menyatakan kesimpulan dari uraian sebelumnya. “Karena itu” alami dalam bahasa Indonesia dan mempertahankan daya inferensialnya.
- source_word: מִפָּנָיו
  choice: di hadapan-Nya
  rationale: Secara harfiah ungkapan ini berkaitan dengan wajah atau hadirat-Nya. “Di hadapan-Nya” mempertahankan gambaran kehadiran langsung tanpa mempersempit maknanya menjadi sekadar sebab.
- source_word: אֶבָּהֵל
  choice: aku gentar
  rationale: Bentuk Nifal dari בהל menyatakan keadaan sangat terguncang, cemas, atau ketakutan. “Gentar” menyampaikan intensitas reaksi Ayub dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: אֶתְבּוֹנֵן
  choice: ketika aku merenung
  rationale: Bentuk refleksif dari בין di sini menunjuk pada tindakan mempertimbangkan atau merenungkan. Teks Ibrani tidak menyebut objek secara eksplisit, sehingga “merenung” mempertahankan keterbukaan itu.
- source_word: וְאֶפְחַד
  choice: aku takut
  rationale: Kata kerja פחד secara langsung menyatakan rasa takut. Pilihan ini alami dan mempertahankan kesejajaran dengan “aku gentar”.
- source_word: מִמֶּנּוּ
  choice: kepada-Nya
  rationale: Bersama verba takut, frasa ini secara idiomatis dapat diterjemahkan “takut kepada-Nya” dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan akhiran pronomina maskulin orang ketiga
  choice: Diterjemahkan dengan pronomina “-Nya”, yang dalam konteks merujuk kepada Allah, tanpa menyisipkan sebutan “Allah” ke dalam teks.
  alternative: Menyebut “Allah” secara eksplisit.
  rationale: Teks Ibrani memakai pronomina, dan konteks langsung menjelaskan rujukannya. Mempertahankan pronomina menjaga alur wacana dan menghindari penambahan gelar yang tidak terdapat dalam ayat.
- issue: Intensitas reaksi Ayub terhadap Allah
  choice: Dipakai bahasa takut yang kuat, yaitu “gentar” dan “takut”, tanpa melunakkan pengalaman Ayub.
  alternative: Ungkapan yang lebih ringan seperti “gelisah” atau “takzim”.
  rationale: Ayat ini mengungkapkan ketakutan yang nyata di hadapan Allah. Terjemahan mempertahankan ketegangan tersebut dan tidak menafsirkannya hanya sebagai rasa hormat religius.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur dua klausa dipertahankan untuk menampilkan perkembangan dari kegentaran menuju ketakutan.
