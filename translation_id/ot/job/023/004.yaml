  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: id
  text: Aku akan memaparkan perkaraku[a] di hadapan-Nya dan memenuhi mulutku dengan argumen-argumen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan menyusun suatu perkara hukum di hadapan-Nya.” Kata Ibrani מִשְׁפָּט memiliki makna yuridis di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau “sanggahan-sanggahan”, “bukti-bukti”, atau “perbantahan-perbantahan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: Aku akan memaparkan
  rationale: Kata kerja ערך menyatakan tindakan menata atau menyusun secara teratur. Dalam konteks hukum, “memaparkan” menyampaikan gagasan penyajian perkara secara runtut dan tetap alami dalam bahasa Indonesia.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Secara harfiah menunjuk pada berada di depan atau dalam kehadiran seseorang. “Di hadapan-Nya” mempertahankan nuansa relasional sekaligus suasana pengadilan.
- source_word: מִשְׁפָּט
  choice: perkaraku
  rationale: מִשְׁפָּט dapat berarti penghakiman, keadilan, atau perkara hukum. Di sini konteksnya adalah perkara yang hendak Ayub ajukan. Unsur milik tersirat oleh penutur dan dibuat eksplisit agar wajar dalam bahasa Indonesia.
- source_word: וּפִי
  choice: dan ... mulutku
  rationale: Citra tubuh dalam teks Ibrani dipertahankan karena berpasangan secara alami dengan kata kerja “memenuhi” dan menggambarkan kesiapan Ayub untuk berbicara panjang lebar.
- source_word: אֲמַלֵּא
  choice: memenuhi
  rationale: Terjemahan ini mempertahankan citra harfiah “mengisi mulut”. Bentuk imperfek melanjutkan corak kehendak atau hipotesis dari klausa sebelumnya, yang dalam konteks Indonesia terungkap melalui “akan” pada rangkaian kalimat.
- source_word: תוֹכָחוֹת
  choice: berbagai alasan
  rationale: Kata ini dapat menunjuk pada sanggahan, teguran, pembuktian, atau perdebatan. Dalam latar yuridis ayat ini, “berbagai alasan” menyampaikan argumentasi yang akan diajukan Ayub tanpa membatasi maknanya pada teguran moral.
theological_decisions:
- issue: Gambaran hukum dalam perkataan Ayub kepada Allah
  choice: Mempertahankan bahasa perkara dan argumentasi hukum serta keberanian Ayub untuk menghadap Allah.
  alternative: Menggeneralisasi ungkapan itu menjadi menyampaikan keluhan atau menyatakan persoalan.
  rationale: Gabungan ערך, משפט, dan תוכחות membentuk gambaran penyajian perkara yang tertata. Terjemahan tidak melunakkan keberanian Ayub dan juga tidak menambahkan penilaian bahwa sikapnya tidak hormat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “memenuhi mulutku” sengaja mempertahankan citra Ibrani, sedangkan “berbagai alasan” memberi bentuk idiomatis pada argumentasi dalam suasana pengadilan.
