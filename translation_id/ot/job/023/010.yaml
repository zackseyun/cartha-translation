id: JOB.23.10
reference: Job 23:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יָ֭דַע דֶּ֣רֶךְ עִמָּדִ֑/י בְּ֝חָנַ֗/נִי כַּ/זָּהָ֥ב אֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: id
  text: Namun, Dia mengetahui jalan yang kutempuh[a]; ketika Dia menguji aku[b], aku akan keluar seperti emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jalan dengan aku”; dapat juga dipahami sebagai “jalanku.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “jika Dia menguji aku” atau “setelah Dia menguji aku”; konstruksi Ibraninya memungkinkan lebih dari satu nuansa.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Namun
  rationale: Dalam konteks ini, partikel tersebut menandai kontras antara ketidakmampuan Ayub menemukan Allah dan pengetahuan Allah tentang dirinya.
- source_word: יָדַע
  choice: mengetahui
  rationale: Bentuk perfektif Ibrani menyatakan pengetahuan Allah yang pasti dan utuh; bentuk kini bahasa Indonesia paling alami dalam konteks.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: jalan yang kutempuh
  rationale: Secara harfiah frasa ini berbunyi 'jalan dengan aku'. Ungkapan 'jalan yang kutempuh' membuat metafora perjalanan hidup dapat dipahami dalam bahasa Indonesia tanpa menyamakannya secara mutlak dengan bentuk alternatif 'jalanku'.
- source_word: בְּחָנַנִי
  choice: ketika Dia menguji aku
  rationale: בחן berarti menguji atau memeriksa, dan citra emas berikutnya mendukung nuansa pengujian. Konstruksinya memungkinkan lebih dari satu nuansa temporal atau bersyarat, yang dicatat dalam catatan kaki.
- source_word: כַּזָּהָב
  choice: seperti emas
  rationale: Prefiks כ menyatakan perbandingan dan mempertahankan citra pemurnian atau pembuktian.
- source_word: אֵצֵא
  choice: aku akan keluar
  rationale: יצא berarti keluar atau tampil. 'Akan keluar' mempertahankan metafora hasil pengujian tanpa menentukan apakah yang terutama dimaksud ialah pemurnian moral atau pembuktian ketulusan.
theological_decisions:
- issue: Hubungan antara pengujian ilahi dan pembenaran Ayub
  choice: Mempertahankan citra pengujian dan emas tanpa menjelaskan hasilnya secara khusus sebagai pemurnian moral ataupun pembenaran forensik.
  alternative: Menafsirkannya terutama sebagai pemurnian moral, atau terutama sebagai pembuktian bahwa Ayub tidak bersalah.
  rationale: Teks Ibrani memungkinkan kedua nuansa itu dan tidak secara tegas memilih salah satunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Kapitalisasi kata ganti untuk Allah dipakai demi kejelasan rujukan. Susunan kalimat dibuat alami sambil mempertahankan metafora jalan, pengujian, dan emas.
