base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: id
  text: Aku tidak menyimpang dari perintah yang keluar dari bibir-Nya; kata-kata dari mulut-Nya kusimpan sebagai harta, melebihi bagian yang ditetapkan bagiku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut penafsiran tradisional atas frasa Ibrani yang sulit ini: “kata-kata dari mulut-Nya kusimpan sebagai harta lebih daripada makanan yang kuperlukan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: perintah
  rationale: Bentuk tunggal konstruksi dengan 'bibir-Nya'; 'perintah' alami dalam bahasa Indonesia dan mempertahankan jumlah tunggal.
- source_word: שְׂפָתָיו
  choice: bibir-Nya
  rationale: Terjemahan konkret ini mempertahankan kesejajaran puitis dengan 'mulut-Nya'; sufiks orang ketiga tunggal merujuk kepada Allah dalam konteks.
- source_word: לֹא אָמִישׁ
  choice: aku tidak menyimpang
  rationale: Bentuk Hifil dari מוש di sini menyatakan tidak beranjak atau menyimpang; pilihan ini alami dan sesuai dengan konteks kesetiaan.
- source_word: מֵחֻקִּי
  choice: melebihi bagian yang ditetapkan bagiku
  rationale: Frasa Ibrani ini sulit dan dapat dipahami secara komparatif sebagai sesuatu yang menjadi bagian atau jatah Job. Terjemahan ini mempertahankan kaitannya dengan akar חק dan tidak membatasi maknanya secara eksplisit pada makanan.
- source_word: צָפַנְתִּי
  choice: kusimpan sebagai harta
  rationale: Kata kerja ini berarti menyembunyikan atau menyimpan, dan dalam konteks hikmat dapat menyiratkan menghargai sebagai harta. Ungkapan ini mempertahankan kedua nuansa tersebut.
- source_word: אִמְרֵי
  choice: perkataan
  rationale: Padanan jamak kolektif yang wajar dalam bahasa Indonesia untuk ujaran atau kata-kata.
- source_word: פִיו
  choice: mulut-Nya
  rationale: Terjemahan harfiah mempertahankan citraan konkret dan kesejajaran puitis dengan 'bibir-Nya'.
theological_decisions:
- issue: Rujukan sufiks orang ketiga tunggal pada 'bibir-Nya' dan 'mulut-Nya'
  choice: Sufiks merujuk kepada Allah.
  alternative: Seorang pembicara yang tidak disebutkan secara khusus.
  rationale: Dalam konteks Ayub 23, Ayub sedang menyatakan kesetiaannya di hadapan Allah dan terhadap firman Allah. Terjemahan memakai huruf kapital untuk memperjelas rujukan kontekstual tanpa menambahkan nama ke dalam teks.
- issue: Penafsiran מֵחֻקִּי
  choice: 'Makna komparatif: ''melebihi bagian yang ditetapkan bagiku''.'
  alternative: '''dari ketetapanku'' atau tafsiran tradisional ''lebih daripada makanan yang kuperlukan''.'
  rationale: Teks konsonantal dan vokalisasinya menghasilkan ungkapan yang sulit. Bacaan utama mempertahankan bentuk dengan sufiks orang pertama dan memberi arti yang koheren tanpa memastikan bahwa bagian itu adalah makanan; tafsiran tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Inversi ringan pada 'kusimpan sebagai harta' menjaga alur puisi. Huruf kapital pada sufiks ilahi mengikuti kebiasaan Indonesia dan memperjelas rujukan yang kuat dalam konteks.
