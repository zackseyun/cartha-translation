id: JOB.23.16
reference: Job 23:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: id
  text: Namun Allah telah membuat hatiku ciut[a], dan Yang Mahakuasa telah membuatku gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah melembutkan hatiku.” Kata kerja Ibrani itu secara harfiah berarti “membuat lembut,” tetapi di sini tampaknya berarti bahwa keberanian Ayub telah lenyap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: Namun Allah
  rationale: אֵל adalah sebutan umum bagi Allah. Kata penghubung וְ secara dasar berarti “dan”, tetapi dalam alur perkataan Ayub di sini nuansa “namun” wajar dan tetap mempertahankan ketegangan dengan ayat sebelumnya.
- source_word: הֵרַךְ
  choice: telah membuat ... ciut
  rationale: Kata kerja ini secara harfiah berarti membuat lembut atau lunak. Dengan “hati” sebagai objek, ungkapan itu menunjuk pada hilangnya keberanian atau kekuatan batin; “membuat hatiku ciut” menyampaikan makna idiomatis tersebut dalam bahasa Indonesia yang alami.
- source_word: לִבִּי
  choice: hatiku
  rationale: לֵב menunjuk pada hati atau batin, termasuk pusat keberanian dan kehendak. “Hatiku” mempertahankan gambaran Ibrani.
- source_word: וְשַׁדַּי
  choice: dan Yang Mahakuasa
  rationale: שַׁדַּי merupakan gelar ilahi. “Yang Mahakuasa” menerjemahkan gelar itu dengan bentuk yang baku dan bermartabat dalam bahasa Indonesia.
- source_word: הִבְהִילָנִי
  choice: telah membuatku gentar
  rationale: Bentuk kausatif dari בהל menyatakan tindakan menyebabkan seseorang sangat takut, gelisah, atau terkejut. “Membuatku gentar” mempertahankan intensitasnya tanpa terdengar berlebihan.
theological_decisions:
- issue: Penerjemahan sebutan ilahi אֵל dan שַׁדַּי
  choice: Allah ... Yang Mahakuasa
  alternative: Allah ... Shaddai
  rationale: Kedua sebutan ilahi tampil sejajar. אֵל diterjemahkan “Allah”, sedangkan שַׁדַּי diperlakukan sebagai gelar dan diterjemahkan “Yang Mahakuasa”, bukan ditransliterasikan, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “membuat hatiku ciut” alami bagi pembaca umum sekaligus mempertahankan citra “hati” dari teks Ibrani; catatan kaki mencatat arti harfiahnya.
