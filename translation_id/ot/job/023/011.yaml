  text: בַּ֭/אֲשֻׁר/וֹ אָחֲזָ֣ה רַגְלִ֑/י דַּרְכּ֖/וֹ שָׁמַ֣רְתִּי וְ/לֹא אָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: id
  text: Kakiku berpaut erat pada jejak langkah-Nya[a]; aku telah mengikuti jalan-Nya dan tidak menyimpang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kakiku berpegang pada langkah-Nya.” Gambaran bahasa Ibraninya ialah kaki Ayub yang melekat erat pada jejak langkah Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: pada jejak langkah-Nya
  rationale: Nomina אֲשׁוּר menunjuk pada langkah atau jejak kaki. Frasa ini mempertahankan gambaran konkret bahwa kaki Ayub mengikuti jejak langkah Allah dengan dekat.
- source_word: אָחֲזָה
  choice: berpaut erat
  rationale: Kata אחז berarti memegang atau mencengkeram. Dengan subjek 'kakiku', 'berpaut erat' menyampaikan keteguhan mengikuti tanpa memberi kesan merebut dengan keras.
- source_word: רַגְלִי
  choice: Kakiku
  rationale: Bentuk Ibrani tunggal dipertahankan agar gambaran konkret kaki yang menapak pada jejak tetap terlihat.
- source_word: דַּרְכּוֹ
  choice: jalan-Nya
  rationale: דֶּרֶךְ dapat berarti jalan atau cara hidup; 'jalan-Nya' alami dalam bahasa Indonesia dan mempertahankan makna harfiah sekaligus etis.
- source_word: שָׁמַרְתִּי
  choice: aku telah mengikuti
  rationale: שׁמר secara dasar berarti menjaga atau menaati. Dalam kolokasi dengan 'jalan', 'mengikuti' menyampaikan bahwa Ayub tetap menjalani jalan Allah secara setia dan terdengar alami dalam bahasa Indonesia.
- source_word: וְלֹא אָט
  choice: dan tidak menyimpang
  rationale: Dalam konteks metafora jalan, bentuk ini menyatakan tidak berbelok atau menyeleweng. 'Tidak menyimpang' ringkas, alami, dan mempertahankan citra perjalanan.
theological_decisions:
- issue: Rujukan akhiran orang ketiga maskulin tunggal pada 'jejak langkah-Nya' dan 'jalan-Nya'
  choice: Allah sebagai rujukan, ditandai dengan -Nya
  alternative: Seorang tokoh maskulin lain atau jalan benar yang tidak dinyatakan secara eksplisit
  rationale: Konteks langsung Ayub 23:10-12 membicarakan Allah dan kesetiaan Ayub di hadapan-Nya. Terjemahan mempertahankan pronomina teks dan menunjukkan rujukan kontekstualnya tanpa menambahkan nama 'Allah' ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berpaut erat' mempertahankan daya gambar verba Ibrani; 'jejak langkah' memperjelas citra mengikuti dari dekat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
