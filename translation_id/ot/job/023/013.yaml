  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: id
  text: Namun, Dia tetap pada satu kehendak[a]; siapa yang dapat membuat-Nya berbalik? Apa yang diinginkan jiwa-Nya[b], itulah yang dilakukan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dia dalam satu [hal].” Ungkapan Ibrani yang padat ini kemungkinan berarti bahwa Dia tetap pada satu pendirian atau teguh dalam tujuan-Nya.
    reason: alternative_reading
  - marker: b
    text: Atau, “Apa yang dikehendaki-Nya.” Dalam bahasa Ibrani tertulis “jiwa-Nya,” suatu ungkapan untuk keinginan atau kehendak diri seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Namun, Dia
  rationale: Kata penghubung dan pronomina mandiri menandai pertentangan dengan konteks sebelumnya; “Namun” menyampaikan nuansa adversatif secara wajar.
- source_word: בְאֶחָד
  choice: tetap satu
  rationale: Ungkapan Ibrani ini secara harfiah menyatakan bahwa Dia “dalam satu.” Terjemahan “tetap satu” mempertahankan bentuk dan ketaksaan aslinya, sedangkan catatan kaki menjelaskan kemungkinan makna ketetapan pendirian atau tujuan.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: siapa yang dapat membuat-Nya berbalik?
  rationale: Bentuk kausatif dari שׁוב di sini berarti membuat berbalik, mengembalikan, atau mengubah arah; ungkapan ini mempertahankan gambaran Ibrani tanpa mempersempitnya menjadi sekadar perubahan pikiran.
- source_word: וְנַפְשׁוֹ
  choice: Apa yang diingini jiwa-Nya
  rationale: נֶפֶשׁ berarti “jiwa,” “diri,” atau kehidupan seseorang. “Jiwa-Nya” mempertahankan ungkapan antropomorfis Ibrani, dengan penjelasan idiomatis dalam catatan kaki.
- source_word: אִוְּתָה
  choice: diingini
  rationale: Kata kerja ini menunjuk pada keinginan atau kehendak. “Diingini” alami dalam konstruksi ini dan tidak menambahkan gagasan keberhasilan yang tidak tersurat.
- source_word: וַיָּעַשׂ
  choice: itulah yang dilakukan-Nya
  rationale: Terjemahan ini mencerminkan struktur ringkas bahasa Ibrani dan mempertahankan arti umum עשה, yaitu “melakukan” atau “membuat.”
theological_decisions:
- issue: Pernyataan mengenai kesatuan atau ketetapan kehendak Allah
  choice: Dia tetap satu[a]
  alternative: Dia tidak berubah pendirian; Dia tetap pada satu kehendak
  rationale: Frasa Ibrani secara bentuk tidak secara eksplisit menyebut “pendirian,” “kehendak,” atau sifat metafisis tidak berubah. Terjemahan utama mempertahankan ketaksaan itu, sementara catatan menjelaskan bahwa dalam konteksnya frasa tersebut kemungkinan menunjuk pada ketetapan tujuan Allah.
- issue: Ungkapan antropomorfis tentang jiwa Allah
  choice: Apa yang diingini jiwa-Nya[b]
  alternative: Apa yang dikehendaki-Nya
  rationale: Mempertahankan “jiwa-Nya” menyajikan gambaran Ibrani apa adanya tanpa mengubahnya secara diam-diam menjadi rumusan teologis yang lebih abstrak; catatan memberi padanan idiomatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Dia” dan akhiran “-Nya” memakai huruf kapital karena acuannya adalah Allah. Susunan paralel pada kalimat terakhir dipertahankan agar daya retoris teks Ibrani tetap terasa.
