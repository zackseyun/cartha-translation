  rationale: Nama diri ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: אמר pada dasarnya berarti “berkata”. Dalam rumus וַיַּעַן ... וַיֹּאמַר, bentuk “menjawab, katanya” menyampaikan kedua verba tanpa menghasilkan ungkapan Indonesia yang terlalu kaku.
- source_word: וַ...וַ...
  choice: Lalu ... , ...
  rationale: Waw berurutan menggerakkan narasi. “Lalu” menyatakan urutan pada verba pertama; hubungan dengan verba kedua disampaikan secara alami melalui konstruksi “katanya”.
