  text: I would know the words with which he would answer me, and understand what he would say to me.
translation:
  language: id
  text: Aku akan mengetahui kata-kata yang akan dipakai-Nya untuk menjawabku, dan memahami apa yang akan dikatakan-Nya kepadaku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵדְעָה
  choice: Aku ingin mengetahui
  rationale: Bentuk cohortative menyatakan keinginan Ayub dalam situasi yang dibayangkannya. Ungkapan ini mempertahankan daya volitifnya dengan bahasa Indonesia yang alami.
- source_word: מִלִּים
  choice: kata-kata
  rationale: Makna dasarnya adalah 'kata-kata'. Pilihan ini tidak mempersempitnya menjadi 'dalil' atau 'argumen', meskipun konteksnya bernuansa peradilan.
- source_word: יַעֲנֵנִי
  choice: yang akan dipakai-Nya untuk menjawabku
  rationale: Verba ענה berarti 'menjawab'. Konstruksi ini membuat hubungan antara 'kata-kata' dan tindakan menjawab jelas serta alami dalam bahasa Indonesia.
- source_word: וְאָבִינָה
  choice: dan memahami
  rationale: Verba בין menyatakan pemahaman atau pengertian. Bentuk ini sejajar dengan keinginan yang dinyatakan pada awal ayat.
- source_word: מַה
  choice: apa yang
  rationale: Kata tanya ini memperkenalkan isi perkataan yang ingin dipahami Ayub.
- source_word: יֹאמַר לִי
  choice: akan dikatakan-Nya kepadaku
  rationale: אמר adalah verba umum 'berkata'. Bentuk pasif berpelaku pronominal mempertahankan makna sekaligus menghindari pengulangan struktur 'yang akan ...-Nya' secara kaku.
theological_decisions:
- issue: Identitas subjek tersirat pada verba orang ketiga maskulin tunggal
  choice: Huruf kapital pada enklitik -Nya menandai Allah sebagai subjek sesuai konteks.
  alternative: Menggunakan huruf kecil '-nya' dan membiarkan identitas subjek sepenuhnya implisit.
  rationale: Konteks langsung adalah keinginan Ayub untuk menghadap Allah dan mendengar jawaban-Nya. Kapitalisasi memperjelas rujukan tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan paralel Ibrani dipertahankan, sementara daya cohortative diterjemahkan sebagai keinginan, bukan kepastian sederhana.
