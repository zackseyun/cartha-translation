base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: id
  text: Namun, jika engkau tetap pergi, bertindaklah dengan teguh dalam pertempuran.[a] Allah akan membuatmu tersandung di hadapan musuh, sebab Allah berkuasa untuk menolong dan untuk membuat tersandung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini dapat juga diterjemahkan “kuatkanlah dirimu untuk pertempuran” atau “tunjukkanlah kekuatanmu dalam pertempuran”.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani mengulang verba yang sama: Allah berkuasa untuk menolong dan untuk membuat tersandung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Namun, jika
  rationale: Gabungan partikel ini memperkenalkan syarat yang berlawanan dengan nasihat sebelumnya; “Namun, jika” menyampaikan fungsi adversatif-kondisional itu secara wajar.
- source_word: בֹּא אַתָּה
  choice: engkau tetap pergi
  rationale: Bentuk perintah dengan pronomina eksplisit memberi penekanan pada keputusan orang yang disapa untuk tetap maju meskipun telah diperingatkan.
- source_word: עֲשֵׂה חֲזַק
  choice: bertindaklah dengan teguh
  rationale: Ungkapan harfiahnya memadukan verba “berbuat/bertindak” dengan kata “kuat”. Pilihan ini mempertahankan daya perintah dan cocok dengan konteks peperangan tanpa menambahkan tafsiran tentang hasilnya.
- source_word: לַמִּלְחָמָה
  choice: dalam pertempuran
  rationale: Preposisi dapat menandai tujuan atau ranah tindakan. Dalam bahasa Indonesia, “dalam pertempuran” terdengar alami dan sesuai konteks.
- source_word: יַכְשִׁילְךָ
  choice: akan membuatmu tersandung
  rationale: Bentuk kausatif dari כשל berarti menyebabkan tersandung atau jatuh. Metafora “membuatmu tersandung” dipertahankan agar kaitannya dengan kemunculan akar yang sama pada akhir ayat tetap terlihat.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk berartikel menunjuk kepada Allah; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: לִפְנֵי אוֹיֵב
  choice: di hadapan musuh
  rationale: Ungkapan ini menggambarkan kejatuhan atau kekalahan di depan musuh dan dapat diterjemahkan langsung secara alami.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: Allah berkuasa
  rationale: Konstruksi Ibrani menyatakan adanya kuasa pada Allah. Bentuk predikatif ini lebih alami dalam bahasa Indonesia dan tetap menghubungkan kuasa itu dengan kedua infinitif berikutnya.
- source_word: לַעְזֹר
  choice: untuk menolong
  rationale: Padanan langsung dan lazim bagi infinitif ini.
- source_word: וּלְהַכְשִׁיל
  choice: maupun membuat orang tersandung
  rationale: Pengulangan “membuat ... tersandung” mempertahankan akar verbal yang sama dengan ancaman sebelumnya. Kata “orang” melengkapi verba kausatif secara alami tanpa membatasi objeknya pada pihak tertentu.
theological_decisions:
- issue: Peran langsung Allah dalam kekalahan militer
  choice: Allah secara langsung dinyatakan akan membuat raja tersandung dan berkuasa membuat orang tersandung.
  alternative: Melembutkan pernyataan menjadi Allah sekadar mengizinkan atau tidak mencegah kekalahan.
  rationale: Teks Ibrani memakai bentuk kausatif secara eksplisit, baik dalam ancaman maupun dalam pernyataan umum mengenai kuasa Allah. Terjemahan mempertahankan ketegangan teologis tersebut tanpa mengubah tindakan langsung menjadi izin pasif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau”, bernada khidmat tetapi tetap mudah dipahami. Metafora “tersandung” dan pengulangannya dipertahankan karena penting bagi bentuk retoris ayat.
