id: 2CH.25.15
reference: 2 Chronicles 25:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: id
  text: Lalu murka Yahweh berkobar terhadap Amazia. Ia mengutus seorang nabi kepadanya, dan nabi itu berkata, “Mengapa engkau meminta petunjuk kepada[a] dewa-dewa bangsa itu, yang tidak menyelamatkan bangsa mereka dari tanganmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencari”; dapat juga berarti “meminta nasihat dari”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... berkobar
  rationale: Ungkapan ini mempertahankan gambaran hidup idiom Ibrani tentang amarah yang menyala, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בַּאֲמַצְיָהוּ
  choice: terhadap Amazia
  rationale: Dalam konstruksi yang menyatakan murka, preposisi ini menunjukkan sasaran kemarahan.
- source_word: נָבִיא
  choice: seorang nabi
  rationale: Padanan Indonesia yang baku bagi utusan kenabian.
- source_word: דָרַשְׁתָּ
  choice: meminta petunjuk kepada
  rationale: Dalam konteks mendatangi ilah, kata ini dapat berarti mencari atau meminta petunjuk. Pilihan ini alami dalam bahasa Indonesia dan tidak menyamakannya begitu saja dengan menyembah; alternatif leksikal dicatat dalam catatan kaki.
- source_word: אֱלֹהֵי הָעָם
  choice: dewa-dewa bangsa itu
  rationale: Bentuk jamak dan rujukannya kepada ilah-ilah bangsa yang baru dikalahkan dipertahankan; kata 'itu' membuat rujukan anaforisnya jelas secara alami.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: yang tidak menyelamatkan
  rationale: Teks menyatakan bahwa dewa-dewa itu tidak menyelamatkan, bukan secara eksplisit bahwa mereka tidak mampu menyelamatkan.
- source_word: עַמָּם
  choice: bangsa mereka
  rationale: Menerjemahkan bentuk posesif secara dekat tanpa menambahkan penegasan yang tidak dinyatakan secara leksikal.
- source_word: מִיָּדֶךָ
  choice: dari tanganmu
  rationale: Mempertahankan citra konkret idiom Ibrani tentang kuasa atau kendali, yang tetap mudah dipahami dalam ragam Alkitab Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama itu secara langsung, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Sifat tindakan Amazia terhadap dewa-dewa asing
  choice: meminta petunjuk kepada
  alternative: mencari; meminta nasihat dari; menyembah
  rationale: דרשׁ dalam konteks keagamaan mencakup tindakan mencari atau meminta petunjuk kepada ilah. Terjemahan utama tidak mempersempitnya menjadi 'menyembah', meskipun konteks yang lebih luas dapat melibatkan penghormatan religius.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat panjang Ibrani dibagi secukupnya agar alami, tanpa menghilangkan hubungan tindakan. Nama Amazia mengikuti bentuk Indonesia yang lazim.
