  text: וּ/בְנֵ֣י הַ/גְּד֗וּד אֲשֶׁ֨ר הֵשִׁ֤יב אֲמַצְיָ֨הוּ֙ מִ/לֶּ֤כֶת עִמּ/וֹ֙ לַ/מִּלְחָמָ֔ה וַֽ/יִּפְשְׁטוּ֙ בְּ/עָרֵ֣י יְהוּדָ֔ה מִ/שֹּׁמְר֖וֹן וְ/עַד בֵּ֣ית חוֹר֑וֹן וַ/יַּכּ֤וּ מֵ/הֶם֙ שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/יָּבֹ֖זּוּ בִּזָּ֥ה רַבָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: id
  text: Namun, anggota pasukan yang telah Amazia suruh pulang sehingga tidak ikut berperang bersamanya itu menyerbu kota-kota Yehuda[a], dari Samaria sampai Bet-Horon. Mereka menewaskan tiga ribu orang di antara mereka[b] dan merampas banyak jarahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari Samaria sampai ke Bet-Horon.” Frasa Ibrani ini menandai cakupan penyerbuan.
    reason: geographical_clarification
  - marker: b
    text: Secara harfiah, “memukul tiga ribu dari antara mereka.” Dalam konteks penyerbuan, kata ini dapat berarti “menewaskan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: anggota pasukan
  rationale: Secara harfiah berarti 'anak-anak pasukan/gerombolan', tetapi ungkapan Ibrani ini secara idiomatis menunjuk kepada orang-orang yang tergabung dalam satu pasukan. 'Anggota pasukan' alami dan tidak membatasi mereka sebagai satuan tertentu.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: yang disuruh Amazia pulang
  rationale: Bentuk kausatif dari שוב berarti membuat atau menyuruh seseorang kembali. 'Disuruh ... pulang' sesuai dengan konteks Amazia memberhentikan pasukan sewaan itu.
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: sehingga tidak ikut dengannya berperang
  rationale: Konstruksi ini menunjukkan bahwa mereka dipulangkan agar tidak menyertai Amazia dalam peperangan. Rumusan ini menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: וַיִּפְשְׁטוּ
  choice: menyerbu
  rationale: Dalam konteks militer, פשט menunjuk pada serangan atau penyerbuan, sering kali untuk merampas. 'Menyerbu' mempertahankan tindakan militernya tanpa mendahului keterangan tentang jarahan di akhir ayat.
- source_word: בְּעָרֵי יְהוּדָה
  choice: kota-kota Yehuda
  rationale: עָרִים dapat berarti kota-kota atau permukiman berkubu. 'Kota-kota' merupakan padanan baku dan wajar.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: dari Samaria sampai Bet-Horon
  rationale: Ungkapan מן ... ועד menandai rentang geografis. Nama tempat ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים
  choice: Mereka menewaskan tiga ribu penduduknya
  rationale: נכה berarti memukul atau mengalahkan dan dalam laporan serangan seperti ini lazim menyiratkan pembunuhan. 'Menewaskan' menyampaikan akibat mematikan tanpa memakai ungkapan yang kaku; 'penduduknya' menjelaskan rujukan pronomina Ibrani secara alami.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: merampas banyak jarahan
  rationale: Konstruksi serumpun ini secara harfiah mengulang akar kata 'merampas jarahan' dan menekankan besarnya hasil rampasan. Rumusan Indonesia mempertahankan penekanan itu secara alami.
