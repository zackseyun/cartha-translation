  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ אֲמַצְיָ֔הוּ וְ/עֶשְׂרִ֣ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְהוֹעַדָּ֖ן מִ/ירוּשָׁלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: id
  text: Amazia berumur dua puluh lima tahun ketika ia menjadi raja, dan ia memerintah selama dua puluh sembilan tahun di Yerusalem. Nama ibunya ialah Yoadan, dari Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Ungkapan usia Ibrani ini secara harfiah berarti 'anak laki-laki dua puluh lima tahun'; bentuk Indonesia yang alami ialah 'berumur dua puluh lima tahun'.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam rumus usia pada kemunculan pertama, verba ini menunjukkan naik takhta; 'menjadi raja' menyampaikan maknanya secara alami.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: ia memerintah selama dua puluh sembilan tahun
  rationale: Kemunculan kedua מָלַךְ menyatakan lamanya pemerintahan, sehingga 'memerintah selama' paling jelas dalam bahasa Indonesia.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi lokatif בְּ menunjukkan tempat pemerintahannya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Padanan modern dan wajar bagi susunan Ibrani 'dan nama ibunya' tanpa kehilangan informasi.
- source_word: יְהוֹעַדָּן
  choice: Yoadan
  rationale: Nama Ibrani ditransliterasikan ke ejaan Indonesia yang mudah dibaca, dengan unsur awal יהו dipadatkan menurut kebiasaan bentuk nama Alkitab Indonesia.
- source_word: מִירוּשָׁלָיִם
  choice: seorang perempuan dari Yerusalem
  rationale: Preposisi מִן menyatakan asal. Penambahan tersirat 'seorang perempuan' memperjelas bahwa keterangan asal ini merujuk kepada ibu Amazia, bukan sekadar kepada namanya.
