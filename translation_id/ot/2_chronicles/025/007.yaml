source:
  edition: WLC
  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: id
  text: Namun, seorang abdi Allah datang kepadanya dan berkata, “Ya Raja, jangan biarkan pasukan Israel pergi bersamamu, sebab Yahweh tidak menyertai Israel, yaitu seluruh orang Efraim.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua anak Efraim” atau “semua bani Efraim.”
    reason: Menjelaskan ungkapan kekerabatan Ibrani בְּנֵי אֶפְרָיִם, yang dalam konteks ini merujuk kepada orang Efraim.
lexical_decisions:
- source_word: וְאִישׁ הָאֱלֹהִים
  choice: Namun, seorang abdi Allah
  rationale: אִישׁ הָאֱלֹהִים merupakan gelar idiomatis bagi utusan Allah. “Abdi Allah” alami dan bermartabat dalam bahasa Indonesia, sedangkan וְ diterjemahkan “Namun” untuk menandai pertentangan dengan konteks sebelumnya.
- source_word: בָּא אֵלָיו
  choice: datang kepadanya
  rationale: בוא dengan אֶל menyatakan gerak menuju seseorang; terjemahan langsung ini jelas dan alami.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Rumus pengantar ucapan Ibrani dialihkan ke bentuk naratif Indonesia yang alami tanpa mengubah maknanya.
- source_word: הַמֶּלֶךְ
  choice: Ya Raja
  rationale: Kata ini berfungsi sebagai sapaan langsung kepada raja, bukan sebagai subjek kalimat.
- source_word: אַל יָבֹא עִמְּךָ
  choice: jangan biarkan ... pergi bersamamu
  rationale: Larangan dengan אַל ditujukan kepada raja. Dalam konteks keberangkatan untuk berperang, “pergi bersamamu” lebih alami daripada “datang bersamamu” dalam bahasa Indonesia.
- source_word: צְבָא יִשְׂרָאֵל
  choice: pasukan Israel
  rationale: צָבָא di sini menunjuk kepada kekuatan militer; “pasukan” tepat dan wajar dalam konteks ini.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: sebab Yahweh tidak menyertai Israel
  rationale: Ungkapan harfiah “Yahweh tidak bersama Israel” menyatakan ketiadaan dukungan atau kehadiran yang memihak; “tidak menyertai” menyampaikan idiom itu secara alami.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: yakni seluruh keturunan Efraim
  rationale: Frasa ini menjelaskan cakupan “Israel” dalam konteks tersebut. “Keturunan Efraim” mempertahankan unsur kekerabatan בְּנֵי sambil tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna pernyataan bahwa Yahweh tidak bersama Israel
  choice: Yahweh tidak menyertai Israel
  alternative: Yahweh tidak bersama Israel
  rationale: Pilihan ini menyatakan ketiadaan kehadiran dan dukungan ilahi dalam peperangan tanpa memperluasnya menjadi penolakan mutlak atau permanen terhadap Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Ya Raja” mempertahankan fungsi vokatif; “abdi Allah” dipakai sebagai gelar utusan ilahi. Klausa terakhir disajikan sebagai penjelasan atas “Israel” tanpa menambahkan preposisi yang tidak terdapat dalam teks Ibrani.
