  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ת אֲשֶׁר סָ֤ר אֲמַצְיָ֨הוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִיתֻ֖/הוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: id
  text: Sejak Amazia berpaling dan tidak lagi mengikuti Yahweh[a], mereka bersekongkol melawannya di Yerusalem. Ia melarikan diri ke Lakhis, tetapi mereka mengirim orang untuk mengejarnya ke Lakhis dan membunuhnya di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berpaling dari mengikuti Yahweh”; dalam bahasa Ibrani, ini adalah ungkapan yang berarti berhenti mengikuti Yahweh.'
    reason: Menjelaskan idiom Ibrani מֵאַחֲרֵי secara jelas dan alami tanpa mengubah makna terjemahan.
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: Sejak
  rationale: Menandai titik waktu ketika persekongkolan mulai berlangsung; bentuk ringkas ini alami dalam bahasa Indonesia dan tidak menambahkan penanda wacana yang tidak ada dalam sumber.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: berpaling dan tidak lagi mengikuti Yahweh
  rationale: Mengungkapkan kemurtadan atau berhentinya kesetiaan, bukan perpindahan fisik. Susunan ini menyampaikan ungkapan Ibrani secara jelas tanpa menghilangkan citra 'berpaling'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam Tetragramaton dan membedakannya dari gelar 'Tuhan'.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: mereka bersekongkol melawannya
  rationale: Padanan Indonesia yang alami untuk gabungan verba-nomina Ibrani yang menyatakan persekongkolan terhadap raja.
- source_word: וַיָּנָס לָכִישָׁה
  choice: Ia melarikan diri ke Lakhis
  rationale: Menyampaikan tindakan melarikan diri dari bahaya serta akhiran arah pada nama tempat.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: tetapi mereka mengirim orang untuk mengejarnya ke Lakhis
  rationale: Bahasa Ibrani secara harfiah menyatakan bahwa mereka 'mengirim di belakangnya'; 'mengirim orang untuk mengejarnya' menjelaskan maksud yang tersirat secara alami. 'Tetapi' menandai kontras naratif dengan usaha Amazia melarikan diri.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: dan membunuhnya di sana
  rationale: Bentuk kausatif menyatakan bahwa mereka menyebabkan kematiannya secara sengaja; 'membunuhnya' adalah padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Sifat tindakan Amazia terhadap Yahweh
  choice: berpaling dan tidak lagi mengikuti Yahweh
  alternative: menyimpang dari Yahweh
  rationale: Pilihan ini mempertahankan unsur berpaling sekaligus makna idiomatis berhenti mengikuti, tanpa merinci bentuk kemurtadan yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak “mereka” dipertahankan tanpa menetapkan identitas para pelaku yang tidak disebutkan dalam ayat. Nama tempat ditulis “Lakhis” sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
