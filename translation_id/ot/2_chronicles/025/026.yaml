  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲמַצְיָ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הֲ/לֹא֙ הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Amazia, dari awal sampai akhir, bukankah semuanya tertulis dalam Kitab Raja-Raja Yehuda dan Israel?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: Selebihnya dari riwayat Amazia
  rationale: Dalam rumus penutup tentang raja, דִּבְרֵי mencakup perbuatan dan berbagai peristiwa dalam pemerintahannya. “Riwayat” menyampaikan cakupan itu secara wajar tanpa membatasinya hanya pada perkataan.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: dari awal sampai akhir
  rationale: Ungkapan berpasangan ini merangkum seluruh rentang riwayat Amazia; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: הֲלֹא membentuk pertanyaan retoris yang mengharapkan jawaban positif, sedangkan “semuanya” mewakili rujukan jamak dan penegasan הִנָּם.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara dasar dapat berarti “di atas/pada”, dalam rumus dokumenter ini bahasa Indonesia secara idiomatis memakai “tertulis dalam kitab”.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: Raja-Raja Yehuda dan Israel
  rationale: Diperlakukan sebagai judul sumber yang dikutip, dengan urutan Yehuda lalu Israel dipertahankan.
