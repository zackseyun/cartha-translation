translation:
  language: id
  text: Mereka mengangkutnya di atas kuda-kuda[a], lalu menguburkannya bersama leluhurnya di kota Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di atas kuda-kuda.” Teks Ibrani secara eksplisit memakai bentuk jamak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Mereka mengangkutnya
  rationale: Bentuk jamak berurutan dari נשׂא dengan akhiran objek orang ketiga tunggal maskulin berarti mereka membawa atau mengangkut dia. Dalam konteks jenazah yang dibawa untuk dimakamkan, “mengangkutnya” alami dan tepat.
- source_word: עַל הַסּוּסִים
  choice: dengan kuda-kuda
  rationale: Secara harfiah frasa ini berbunyi “di atas kuda-kuda.” Bentuk jamaknya dipertahankan, sedangkan “dengan” menyampaikan sarana pengangkutan secara alami tanpa menambahkan kereta atau usungan yang tidak disebutkan teks.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: lalu menguburkannya
  rationale: קבר berarti menguburkan; “lalu” menyampaikan urutan naratif waw secara wajar dalam bahasa Indonesia.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Secara harfiah “bersama bapak-bapaknya,” tetapi dalam rumusan pemakaman Ibrani kata אָבוֹת menunjuk para pendahulu keluarga. “Leluhurnya” menyampaikan makna itu dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּעִיר יְהוּדָה
  choice: di kota Yehuda
  rationale: Mengikuti langsung Teks Masoret yang berbunyi “di kota Yehuda,” tanpa menyelaraskannya dengan rumusan “Kota Daud” yang dikenal dari bagian lain.
theological_decisions:
- issue: Rumusan pemakaman dan nama tempat
  choice: Mempertahankan bacaan Teks Masoret “di kota Yehuda.”
  alternative: Mengubah atau menyelaraskannya menjadi “di Kota Daud,” atau menggeneralisasinya menjadi “di Yehuda.”
  rationale: Teks sumber yang tersedia secara eksplisit menyebut “kota Yehuda.” Bacaan yang tidak lazim ini dipertahankan agar ketegangan tekstual tidak dihilangkan melalui harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur kalimat dibuat alami, bentuk jamak “kuda-kuda” dipertahankan, dan bacaan lokasi yang tidak lazim tidak dinormalkan.
