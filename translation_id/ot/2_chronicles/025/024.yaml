base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: id
  text: Ia mengambil semua emas dan perak, semua perlengkapan yang terdapat di rumah Allah bersama Obed-Edom[a], harta benda di istana raja, serta para sandera[b]. Lalu ia kembali ke Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bawah pengawasan Obed-Edom”; secara harfiah, “bersama Obed-Edom.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak jaminan,” kemungkinan berarti orang-orang yang ditahan sebagai jaminan, yaitu para sandera.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: semua emas dan perak
  rationale: Mempertahankan cakupan menyeluruh כָּל dan menyebut kedua logam secara alami dalam bahasa Indonesia.
- source_word: כָּל הַכֵּלִים
  choice: semua perkakas
  rationale: כֵּלִים adalah istilah luas untuk berbagai benda atau perlengkapan; “perkakas” cukup luas dan sesuai untuk perlengkapan rumah Allah.
- source_word: הַנִּמְצְאִים
  choice: yang terdapat
  rationale: Partisip ini menyatakan bahwa benda-benda itu ada atau ditemukan di tempat tersebut; “yang terdapat” alami dan tidak menyiratkan penemuan yang tidak disengaja.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan dekat dengan ungkapan Ibrani dan tetap mudah dipahami sebagai tempat ibadah Allah.
- source_word: עִם עֹבֵד אֱדוֹם
  choice: bersama Obed-Edom
  rationale: Mempertahankan arti dasar עִם, “bersama/dengan,” tanpa memastikan apakah frasa ini secara khusus menunjukkan pengawasan atau penjagaan.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: harta benda di istana raja
  rationale: Dalam konteks perampasan, אֹצְרוֹת paling wajar menunjuk kepada harta yang disimpan, sedangkan בֵּית הַמֶּלֶךְ secara kontekstual adalah istana raja.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: para sandera
  rationale: Ungkapan sulit ini secara harfiah berarti “anak-anak jaminan” dan kemungkinan besar menunjuk kepada orang-orang yang ditahan sebagai jaminan; “para sandera” menyampaikan makna kontekstualnya.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: Lalu ia kembali ke Samaria
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, dengan Samaria sebagai tujuan kepulangan.
