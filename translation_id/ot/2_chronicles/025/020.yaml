source:
  edition: WLC
  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ כִּ֤י מֵ/הָֽ/אֱלֹהִים֙ הִ֔יא לְמַ֖עַן תִּתָּ֣/ם בְּ/יָ֑ד כִּ֣י דָֽרְשׁ֔וּ אֵ֖ת אֱלֹהֵ֥י אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: id
  text: Namun, Amazia tidak mau mendengarkan, sebab hal itu berasal dari Allah, dengan maksud menyerahkan mereka ke dalam tangan musuh[a], karena mereka telah mencari ilah-ilah Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam tangan”; sebuah ungkapan Ibrani yang berarti diserahkan ke dalam kuasa pihak lain. Kata “musuh” dipasok dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Namun, ... tidak mau mendengarkan
  rationale: Dalam konteks penolakan terhadap peringatan, שׁמע berarti mengindahkan, bukan sekadar mendengar bunyi. Bentuk “tidak mau” menyampaikan unsur penolakan yang tersirat dalam konteks.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: hal itu berasal dari Allah
  rationale: Pronomina feminin הִיא menunjuk secara umum kepada keadaan atau rangkaian peristiwa tersebut. “Hal itu” mempertahankan acuan yang tidak dirinci, sedangkan “berasal dari Allah” menyatakan kausalitas ilahi tanpa menambah penjelasan.
- source_word: לְמַעַן
  choice: dengan maksud
  rationale: Ungkapan ini menyampaikan tujuan, dengan kemungkinan nuansa hasil. “Dengan maksud” mempertahankan daya purposifnya dalam bahasa Indonesia yang wajar.
- source_word: תִּתָּם
  choice: menyerahkan mereka
  rationale: נתן yang diikuti ungkapan בְּיַד lazim menyatakan penyerahan seseorang ke dalam kuasa pihak lain. “Menyerahkan” lebih alami daripada terjemahan mekanis “memberikan”.
- source_word: בְּיָד
  choice: ke dalam tangan musuh
  rationale: Secara harfiah berarti “ke dalam tangan” dan secara idiomatis berarti diserahkan ke dalam kuasa pihak lain. Kata “musuh” dijelaskan oleh konteks pertempuran, tetapi karena tidak dinyatakan langsung dalam frasa Ibrani, hal itu dicatat dalam catatan kaki.
- source_word: דָרְשׁוּ
  choice: telah mencari
  rationale: דרשׁ dengan ilah sebagai objek dapat berarti mencari, meminta petunjuk kepada, atau berpaling kepadanya dalam ketergantungan religius. “Mencari” menjaga keluasan makna tersebut.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: ilah-ilah Edom
  rationale: Rangkaian konstruksi ini menunjuk kepada dewa-dewa yang disembah oleh Edom. “Ilah-ilah Edom” ringkas, jelas, dan sesuai dengan ragam Alkitab modern.
theological_decisions:
- issue: Kausalitas ilahi dalam penolakan Amazia dan kekalahannya
  choice: Ayat menyatakan bahwa penolakan Amazia berasal dari Allah dan bertujuan menyerahkan mereka kepada kekalahan karena mereka mencari ilah-ilah Edom.
  alternative: Klausa tersebut dapat dipahami secara lebih lunak sebagai izin providensial Allah, bukan maksud atau tindakan aktif-Nya.
  rationale: Teks Ibrani secara eksplisit mengatakan bahwa hal itu “berasal dari Allah” dan memakai לְמַעַן yang menyatakan tujuan. Terjemahan mempertahankan ketegangan teologis ini tanpa mengubahnya menjadi izin pasif atau menambahkan penjelasan sistematis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa tetap dekat dengan alur teks Ibrani, sementara ungkapan idiomatis dibuat jelas bagi pembaca umum.
