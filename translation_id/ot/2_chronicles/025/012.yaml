  source_fidelity: 'Teks Indonesia secara akurat mencerminkan urutan dan isi Ibrani: orang Yehuda menangkap sepuluh ribu orang hidup-hidup, membawa mereka ke puncak tebing, melemparkan mereka dari sana, dan semuanya mengalami kehancuran. Pengulangan “puncak tebing” mempertahankan penegasan sumber. Koordinasi penutup tidak diubah menjadi hubungan tujuan atau akibat yang lebih kuat daripada teks Ibrani.'
