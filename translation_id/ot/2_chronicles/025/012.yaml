id: 2CH.25.12
reference: 2 Chronicles 25:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים חַיִּ֗ים שָׁבוּ֙ בְּנֵ֣י יְהוּדָ֔ה וַ/יְבִיא֖וּ/ם לְ/רֹ֣אשׁ הַ/סָּ֑לַע וַ/יַּשְׁלִיכ֛וּ/ם מֵֽ/רֹאשׁ הַ/סֶּ֖לַע וְ/כֻלָּ֥/ם נִבְקָֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: id
  text: Orang-orang Yehuda menangkap hidup-hidup sepuluh ribu orang. Mereka membawa para tawanan itu ke puncak tebing[a], lalu melemparkan mereka dari puncak tebing tersebut, dan mereka semua hancur berkeping-keping[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “bukit batu” atau “batu cadas” (Ibrani: selaʿ).'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “terbelah” atau “pecah terbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: menangkap
  rationale: Dalam konteks militer dan bersama חַיִּים, kata ini berarti menangkap sebagai tawanan, bukan sekadar merebut atau membawa pergi.
- source_word: חַיִּים
  choice: hidup-hidup
  rationale: Kata ini menerangkan bahwa kesepuluh ribu orang itu ditangkap dalam keadaan hidup; ungkapan 'menangkap hidup-hidup' alami dalam bahasa Indonesia.
- source_word: בְּנֵי יְהוּדָה
  choice: orang-orang Yehuda
  rationale: Secara harfiah berarti 'anak-anak Yehuda', tetapi dalam konteks ini menunjuk kepada orang-orang dari Yehuda; pilihan ini jelas dan wajar tanpa mempersempitnya secara eksplisit menjadi 'pasukan'.
- source_word: וַיְבִיאוּם
  choice: membawa para tawanan itu
  rationale: Bentuk hiphil dari בוא berarti 'membawa'. Sebutan 'para tawanan itu' memperjelas rujukan pronomina tanpa mengubah identitas mereka.
- source_word: לְרֹאשׁ
  choice: ke puncak
  rationale: רֹאשׁ secara harfiah berarti 'kepala', tetapi untuk bentang alam secara idiomatis berarti bagian atas atau puncak.
- source_word: הַסָּלַע / הַסֶּלַע
  choice: tebing
  rationale: סֶלַע dapat berarti batu besar, bukit batu, atau tebing. Tindakan melemparkan tawanan dari puncaknya mendukung 'tebing' sebagai padanan kontekstual yang alami.
- source_word: וַיַּשְׁלִיכוּם
  choice: melemparkan mereka
  rationale: שׁלך berarti melemparkan atau mencampakkan. Arah ke bawah sudah jelas dari frasa berikutnya, 'dari puncak tebing'.
- source_word: וְכֻלָּם
  choice: dan mereka semua
  rationale: Mempertahankan kata sambung Ibrani dan cakupan menyeluruh dari כֻּלָּם tanpa mengubah koordinasi menjadi hubungan tujuan atau akibat eksplisit.
- source_word: נִבְקָעוּ
  choice: hancur berkeping-keping
  rationale: Bentuk niphal dari בקע secara harfiah berarti terbelah atau pecah. Dalam konteks orang yang dilemparkan dari tebing, ungkapan ini menyampaikan akibatnya secara alami dan tetap mempertahankan kerasnya adegan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Orang-orang Yehuda' dipilih daripada terjemahan harfiah 'anak-anak Yehuda'. Kekerasan dalam teks tidak diperhalus, sedangkan pengulangan 'puncak tebing' dipertahankan mengikuti sumber Ibrani.
