review_pass:
  verdict: revise
  source_fidelity: 'Revisi diperlukan karena “hatimu menjadi tinggi” mengubah relasi dalam Ibrani: teks menyatakan bahwa hati sang raja ‘meninggikan engkau,’ bukan terutama bahwa hati itu sendiri menjadi tinggi. Terjemahan revisi mempertahankan subjek, objek, dan metafora Ibrani, serta mempertahankan fungsi לְהַכְבִּיד sebagai tujuan/hasil.'
  naturalness: Bahasa draf umumnya baku dan jelas. “Hatimu telah meninggikanmu untuk bermegah” sedikit lebih formal, tetapi tetap alami dalam register naratif-teguran kitab sejarah dan lebih dekat pada bentuk sumber. “Memancing malapetaka” lebih idiomatis daripada “menantang malapetaka.”
  terminology: Nama Edom dan Yehuda sudah tepat. “Malapetaka” sesuai untuk רָעָה dalam konteks peringatan akan kehancuran. “Bermegah” menyampaikan peninggian diri tanpa memaksakan penafsiran yang lebih sempit.
  issues:
  - severity: medium
    issue: Klausa “lalu hatimu menjadi tinggi” tidak mempertahankan sintaks dan relasi semantis וּנְשָׂאֲךָ לִבְּךָ.
    rationale: 'Dalam Ibrani, לִבְּךָ (“hatimu”) ialah subjek dan akhiran -ךָ (“engkau”) ialah objek: ‘hatimu telah meninggikanmu.’ Revisi memulihkan hubungan ini.'
  - severity: low
    issue: “Menantang malapetaka” kurang idiomatis dalam bahasa Indonesia.
    rationale: Kata kerja תִתְגָּרֶה menggambarkan memancing atau mengobarkan konflik yang berujung pada bencana. “Memancing malapetaka” menyampaikan peringatan tersebut secara lebih alami.
  revised_text: Engkau berkata, “Lihat, engkau telah mengalahkan Edom, dan hatimu telah meninggikanmu untuk bermegah.” Sekarang, tetaplah di rumahmu. Mengapa engkau memancing malapetaka sehingga engkau jatuh—engkau dan Yehuda bersamamu?
