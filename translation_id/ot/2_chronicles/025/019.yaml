base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: id
  text: Engkau berkata, “Lihat, engkau telah mengalahkan Edom, dan hatimu telah meninggikanmu untuk bermegah.” Sekarang, tetaplah di rumahmu. Mengapa engkau memancing malapetaka sehingga engkau jatuh—engkau dan Yehuda bersamamu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Engkau berkata
  rationale: Bentuk Qal perfek orang kedua tunggal maskulin dari אמר menyatakan ujaran atau pengakuan raja; bentuk lampau sederhana alami dalam narasi Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel penunjuk ini memberi penekanan dan diterjemahkan secara langsung tanpa memakai bentuk arkais.
- source_word: הִכִּיתָ אֶת־אֱדוֹם
  choice: engkau telah mengalahkan Edom
  rationale: Dalam konteks peperangan, Hifil נכה menunjuk pada tindakan memukul yang menghasilkan kemenangan; 'mengalahkan' menyampaikan makna kontekstual dengan jelas.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: lalu hatimu menjadi tinggi
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang hati yang meninggi, yang dalam konteks menyatakan kesombongan setelah kemenangan.
- source_word: לְהַכְבִּיד
  choice: sehingga engkau membanggakan diri
  rationale: Infinitif ini dapat menyatakan hasil atau tujuan berupa pemuliaan diri; 'membanggakan diri' menyampaikan teguran terhadap keangkuhan secara alami.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: Sekarang, tetaplah di rumahmu
  rationale: Perintah ישב dengan keterangan 'di rumahmu' berarti tetap tinggal dan tidak maju berperang.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: Mengapa engkau menantang malapetaka
  rationale: Hitpael גרה menggambarkan tindakan sengaja memancing konfrontasi, sedangkan רעה dalam konteks ini menunjuk pada bencana atau kehancuran, bukan terutama kejahatan moral.
- source_word: וְנָפַלְתָּ אַתָּה וִיהוּדָה עִמָּךְ
  choice: sehingga engkau jatuh—engkau dan Yehuda bersamamu
  rationale: 'Susunan ini menegaskan akibat yang diperingatkan: kejatuhan raja juga akan menyeret Yehuda.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' yang sesuai bagi ucapan antarraja. Metafora 'hati menjadi tinggi' dipertahankan, lalu maknanya diperjelas oleh klausa berikut dan catatan kaki.
