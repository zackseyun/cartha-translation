revisions:
- from: Engkau berkata, “Lihat, engkau telah mengalahkan Edom,” lalu hatimu menjadi tinggi sehingga engkau membanggakan diri.[a] Sekarang, tetaplah di rumahmu. Mengapa engkau menantang malapetaka sehingga engkau jatuh—engkau dan Yehuda bersamamu?
  to: Engkau berkata, “Lihat, engkau telah mengalahkan Edom, dan hatimu telah meninggikanmu untuk bermegah.” Sekarang, tetaplah di rumahmu. Mengapa engkau memancing malapetaka sehingga engkau jatuh—engkau dan Yehuda bersamamu?
  rationale: Revisi terbatas pada pemulihan metafora dan sintaks Ibrani dalam klausa tentang hati yang meninggikan sang raja, serta pada pilihan idiom Indonesia yang lebih wajar untuk tindakan memancing bencana. Penanda catatan kaki dipertahankan pada klausa yang memiliki alternatif leksikal.
