base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: id
  text: Ketika nabi itu sedang berbicara kepadanya, raja berkata, “Apakah kami mengangkatmu menjadi penasihat raja?[a] Berhentilah! Mengapa mereka harus memukulmu?[b]” Maka nabi itu berhenti, lalu berkata, “Aku tahu bahwa Allah telah menetapkan untuk membinasakanmu,[c] karena engkau telah melakukan hal ini dan tidak mendengarkan nasihatku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kami menjadikanmu penasihat bagi raja?”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai subjek jamak yang tidak disebutkan: “Mengapa mereka harus memukulmu?” Kemungkinan yang dimaksud ialah orang-orang yang akan menghukumnya atas perintah raja.'
    reason: lexical_alternative
  - marker: c
    text: Atau, “Allah telah merencanakan untuk membinasakanmu.” Kata Ibrani yang digunakan berkaitan dengan nasihat, perencanaan, atau penetapan maksud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּדַבְּרוֹ אֵלָיו
  choice: Ketika nabi itu sedang berbicara kepadanya
  rationale: Konstruksi וַיְהִי diikuti ungkapan waktu diterjemahkan secara alami sebagai “ketika”. Subjek tersirat diperjelas sebagai “nabi itu” berdasarkan konteks langsung dan penyebutan הַנָּבִיא kemudian dalam ayat ini.
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: Apakah kami mengangkatmu menjadi penasihat raja?
  rationale: הֲ dipahami sebagai partikel tanya retoris; נתן dalam konstruksi ini menyatakan penempatan atau pengangkatan seseorang pada suatu jabatan. “Penasihat raja” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: חֲדַל
  choice: Berhentilah!
  rationale: Imperatif ini memerintahkan nabi untuk berhenti berbicara. “Berhentilah!” ringkas, tegas, dan wajar dalam bahasa Indonesia modern.
- source_word: לָמָּה יַכּוּךָ
  choice: Mengapa mereka harus memukulmu?
  rationale: Bentuk verba memiliki subjek orang ketiga jamak yang tidak disebutkan. Terjemahan aktif mempertahankan subjek tak tentu “mereka” tanpa menentukan identitas atau memastikan bahwa pukulan itu mematikan.
- source_word: יָעַץ אֱלֹהִים
  choice: Allah telah menetapkan
  rationale: יעץ berhubungan dengan memberi nasihat, merancang, atau menetapkan suatu maksud. Dalam konstruksi dengan tujuan membinasakan, “telah menetapkan” menyampaikan keteguhan maksud ilahi tanpa menghapus nuansa perencanaan.
- source_word: לְהַשְׁחִיתֶךָ
  choice: untuk membinasakanmu
  rationale: Infinitif Hifil dari שׁחת menyatakan tindakan mendatangkan kebinasaan. “Membinasakanmu” merupakan padanan langsung dan sesuai dengan ragam bahasa Alkitab yang tetap mudah dimengerti.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: dan tidak mendengarkan nasihatku
  rationale: שמע dengan preposisi dapat berarti mendengar, mengindahkan, atau menaati. “Tidak mendengarkan nasihatku” mempertahankan unsur mendengar sekaligus implikasi tidak mengindahkan, serta mencerminkan hubungan leksikal עצה dengan יעץ.
theological_decisions:
- issue: Maksud ilahi dalam יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  choice: Allah telah menetapkan untuk membinasakanmu
  alternative: Allah telah merencanakan untuk membinasakanmu
  rationale: Teks menyatakan keputusan penghukuman Allah sebagai maksud yang tegas berkaitan dengan tindakan raja dan penolakannya terhadap nasihat nabi. Terjemahan mempertahankan ketegangan teologis itu tanpa melunakkan penghukuman atau menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Dialog dibuat alami tanpa mengurangi ancaman dalam ucapan raja. Bentuk “engkau” dipakai karena suasana naratif dan percakapan kerajaan, sedangkan istilah “penasihat”, “menetapkan”, dan “nasihat” mudah dipahami pembaca umum.
