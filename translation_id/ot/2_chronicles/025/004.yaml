revisions:
- from: 'Namun, anak-anak mereka tidak dihukum mati[a], sesuai dengan yang tertulis dalam Taurat, dalam Kitab Musa, tempat Yahweh memberi perintah: “Ayah tidak boleh dihukum mati karena anaknya, dan anak tidak boleh dihukum mati karena ayahnya. Sebaliknya, setiap orang harus mati karena dosanya sendiri.”'
  to: 'Namun, anak-anak mereka tidak dihukum mati[a], sebab itulah yang tertulis dalam Taurat, dalam Kitab Musa, yang diperintahkan Yahweh: “Para ayah tidak boleh dihukum mati karena anak-anak mereka, dan anak-anak tidak boleh dihukum mati karena para ayah mereka. Sebaliknya, setiap orang harus dihukum mati karena dosanya sendiri.”'
  rationale: Revisi memperbaiki hubungan klausa relatif dengan perintah Yahweh, mempertahankan paralelisme jamak dalam kutipan hukum, dan memakai ‘dihukum mati’ secara konsisten untuk menyatakan nuansa yudisial dalam seluruh kutipan. Catatan kaki mempertahankan bentuk leksikal ‘mati’ tanpa menjadikan makna harfiahnya tampak sebagai kematian nonyudisial dalam teks utama.
