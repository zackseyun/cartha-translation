  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: id
  text: 'Namun, anak-anak mereka tidak dihukum mati[a], sebab itulah yang tertulis dalam Taurat, dalam Kitab Musa, yang diperintahkan Yahweh: “Para ayah tidak boleh dihukum mati karena anak-anak mereka, dan anak-anak tidak boleh dihukum mati karena para ayah mereka. Sebaliknya, setiap orang harus dihukum mati karena dosanya sendiri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “para ayah tidak boleh mati karena anak-anak, dan anak-anak tidak boleh mati karena para ayah.” Dalam konteks hukum ini, ungkapan Ibrani tersebut menyatakan bahwa seseorang tidak boleh dijatuhi hukuman mati karena dosa anggota keluarganya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת בְּנֵי/הֶם
  choice: Namun, anak-anak mereka
  rationale: Konjungsi menandai kontras dengan penghukuman para pembunuh dalam ayat sebelumnya. Dalam bahasa Indonesia, bentuk jamak בָּנִים dalam hubungan keluarga secara wajar diterjemahkan “anak-anak”; konteks hukum kuno dapat merujuk khusus kepada anak laki-laki, tetapi bahasa sasaran tidak perlu mempersempitnya secara tidak alamiah.
- source_word: לֹא הֵמִית
  choice: tidak dihukum mati
  rationale: Bentuk Hifil dari מות bersifat kausatif. Dalam konteks tindakan raja berdasarkan hukum, “dihukum mati” menyampaikan makna yudisial dengan lebih jelas daripada sekadar “dibunuh”.
- source_word: כִּי כַ/כָּתוּב
  choice: sesuai dengan yang tertulis
  rationale: Ungkapan ini menghubungkan tindakan Amazia dengan ketentuan tertulis. “Sesuai dengan” mempertahankan unsur komparatif כַּ sekaligus menyampaikan dasar tindakannya secara alami.
- source_word: בַּ/תּוֹרָה בְּ/סֵפֶר מֹשֶׁה
  choice: dalam Taurat, dalam Kitab Musa
  rationale: “Taurat” merupakan istilah Indonesia yang lazim dan langsung untuk תּוֹרָה, sedangkan pengulangan “dalam” mempertahankan susunan aposisional sumber.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵ/אמֹר
  choice: tempat Yahweh memberi perintah
  rationale: Klausa relatif menunjuk kepada teks Taurat/Kitab Musa sebagai tempat perintah ilahi itu tercatat. Tanda titik dua secara alami menjalankan fungsi לֵאמֹר dalam memperkenalkan kutipan.
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים
  choice: Ayah tidak boleh dihukum mati karena anaknya
  rationale: Bentuk hukum larangan diterjemahkan “tidak boleh dihukum mati”; עַל menyatakan dasar pertanggungjawaban, dan “karena” menyampaikannya dengan jelas.
- source_word: וּ/בָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: dan anak tidak boleh dihukum mati karena ayahnya
  rationale: Terjemahan mempertahankan kesejajaran hukum dengan klausa sebelumnya dan menggunakan bentuk generik tunggal yang alami dalam bahasa Indonesia.
- source_word: כִּי אִישׁ בְּ/חֶטְא/וֹ יָמוּתוּ
  choice: Sebaliknya, setiap orang harus mati karena dosanya sendiri
  rationale: כִּי di sini mengontraskan pertanggungjawaban individual dengan pertanggungjawaban antargenerasi. אִישׁ bersifat distributif, sehingga “setiap orang” tepat; bentuk verba jamak yang tidak selaras secara gramatikal dipahami secara distributif tanpa dikoreksi secara doktrinal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Makna kematian dalam kutipan hukum
  choice: dihukum mati
  alternative: mati
  rationale: Konteksnya adalah larangan menjatuhkan hukuman kepada anggota keluarga karena dosa kerabat. Terjemahan utama memperjelas nuansa yudisial, sementara arti yang lebih harfiah dipertahankan dalam catatan kaki agar ketegangan leksikal tidak hilang.
- issue: Pertanggungjawaban individual
  choice: setiap orang harus mati karena dosanya sendiri
  alternative: masing-masing akan dihukum mati karena dosanya sendiri
  rationale: Terjemahan mempertahankan prinsip pertanggungjawaban pribadi tanpa memperluasnya menjadi pernyataan menyeluruh tentang semua akibat teologis dosa; “mati” juga menjaga peralihan tekstual dari idiom yudisial kepada rumusan yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dihukum mati” dipilih daripada “dieksekusi” agar mudah dipahami dan tetap bernuansa hukum. “Anaknya/ayahnya” memperjelas hubungan tanpa membuat kalimat kutipan terasa kaku. Semua penanda catatan kaki dalam teks utama cocok dengan daftar catatan.
