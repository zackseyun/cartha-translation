  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Tanda koma mengapit gelar kedua raja agar kalimat mudah dibaca. Kata penghubung ‘Kemudian’ mempertahankan urutan narasi netral dari waw konsekutif tanpa memasukkan pertentangan yang tidak dinyatakan.
