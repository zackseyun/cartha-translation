base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: id
  text: Lalu Yoas, raja Israel, mengirim pesan kepada Amazia, raja Yehuda, dengan berkata, “Semak duri[a] yang ada di Lebanon mengirim pesan kepada pohon aras yang ada di Lebanon, ‘Berikanlah anak perempuanmu kepada anak laki-lakiku untuk menjadi istrinya.’ Kemudian seekor binatang liar di padang yang ada di Lebanon lewat dan menginjak-injak semak duri itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumput duri” atau “belukar berduri.” Kata Ibrani ini menyebut sejenis tumbuhan berduri; jenis tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: semak berduri
  rationale: Kata Ibrani ini menunjuk pada tumbuhan berduri yang jenis tepatnya tidak pasti. ‘Semak berduri’ alami dalam bahasa Indonesia dan mempertahankan kontras dengan pohon aras yang tinggi dan kuat.
- source_word: הָאֶרֶז
  choice: pohon aras
  rationale: אֶרֶז secara langsung menunjuk pada pohon aras; penambahan ‘pohon’ memperjelas gambaran dalam bahasa Indonesia.
- source_word: בַּלְּבָנוֹן
  choice: di Lebanon
  rationale: Frasa ini menunjukkan lokasi tumbuhan dan binatang dalam perumpamaan.
- source_word: שָׁלַח ... לֵאמֹר
  choice: mengirim pesan ... demikian
  rationale: Ungkapan ini menyampaikan tindakan mengutus atau mengirim perkataan. ‘Mengirim pesan’ wajar dalam bahasa Indonesia dan menghindari kesan bahwa tumbuhan itu secara harfiah mengutus seorang pembawa pesan.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Berikanlah anak perempuanmu kepada anak laki-lakiku untuk menjadi istrinya
  rationale: Terjemahan ini mempertahankan rumusan permintaan perkawinan dan menjelaskan hubungan rujukan pronomina secara alami.
- source_word: חַיַּת הַשָּׂדֶה
  choice: seekor binatang liar
  rationale: Frasa konstruksi Ibrani menunjuk secara umum pada binatang darat yang liar; terjemahan ini jelas dan alami tanpa menentukan spesies.
- source_word: וַתַּעֲבֹר
  choice: lewat
  rationale: Kata kerja menggambarkan binatang yang melintas; ‘lewat’ ringkas dan idiomatis.
- source_word: וַתִּרְמֹס
  choice: menginjak-injak
  rationale: רמס menyatakan tindakan menginjak atau meremukkan dengan kaki; bentuk ulang menghasilkan gambaran yang hidup dalam bahasa Indonesia.
