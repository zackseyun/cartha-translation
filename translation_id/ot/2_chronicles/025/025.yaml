base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: id
  text: Amazia anak Yoas, raja Yehuda, hidup lima belas tahun sesudah kematian Yoas anak Yoahas, raja Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hidup lima belas tahun sesudah kematian Yoas.” Maksudnya, Amazia hidup lima belas tahun lebih lama daripada Yoas, raja Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup
  rationale: Bentuk ini menyatakan bahwa Amazia tetap hidup selama suatu rentang waktu; “hidup” paling dekat dengan bentuk Ibrani dan tetap alami dalam pemberitahuan kronologis ini.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Dalam identifikasi silsilah, “anak” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: יוֹאָשׁ
  choice: Yoas
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia; kedua orang bernama Yoas dibedakan oleh nama ayah dan kerajaan mereka.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Menyampaikan secara langsung jabatan kerajaan dan wilayah kekuasaannya.
- source_word: אַחֲרֵי מוֹת
  choice: sesudah kematian
  rationale: Mempertahankan konstruksi nominal Ibrani secara alami dalam bahasa Indonesia.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Padanan langsung dan alami untuk rangkaian konstruksi Ibrani.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: lima belas tahun
  rationale: Padanan baku untuk frasa bilangan Ibrani tersebut.
