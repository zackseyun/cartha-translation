  text: וַ/יְהִ֗י אַחֲרֵ֨י ב֤וֹא אֲמַצְיָ֨הוּ֙ מֵֽ/הַכּ֣וֹת אֶת אֲדוֹמִ֔ים וַ/יָּבֵ֗א אֶת אֱלֹהֵי֙ בְּנֵ֣י שֵׂעִ֔יר וַ/יַּֽעֲמִידֵ֥/ם ל֖/וֹ לֵ/אלֹהִ֑ים וְ/לִ/פְנֵי/הֶ֥ם יִֽשְׁתַּחֲוֶ֖ה וְ/לָ/הֶ֥ם יְקַטֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: id
  text: Setelah Amazia kembali dari mengalahkan orang Edom, ia membawa dewa-dewa orang Seir[a] dan menempatkan dewa-dewa itu sebagai dewa-dewanya sendiri. Ia bersujud di hadapan mereka[b] dan membakar dupa bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dewa-dewa anak-anak Seir.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “membungkuk rendah di hadapan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא אֲמַצְיָהוּ
  choice: Setelah Amazia pulang
  rationale: Ungkapan naratif וַיְהִי tidak perlu diterjemahkan secara mekanis dalam bahasa Indonesia. אַחֲרֵי בּוֹא menandai waktu sesudah kedatangan Amazia; 'pulang' menyampaikan secara alami bahwa ia datang kembali dari peperangan.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: dari mengalahkan orang Edom
  rationale: נכה secara harfiah berkaitan dengan memukul atau menewaskan, tetapi dalam konteks peperangan ini juga menyatakan penaklukan. 'Mengalahkan' alami dalam bahasa Indonesia dan tidak menentukan berapa banyak orang yang dibunuh.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: dewa-dewa keturunan Seir
  rationale: Bentuk אֱלֹהֵי bersifat jamak dan menunjuk kepada dewa-dewa bangsa Seir. 'Keturunan Seir' mempertahankan unsur kekerabatan dalam בְּנֵי שֵׂעִיר, sedangkan alternatif idiomatis dicatat dalam catatan kaki.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: mendirikan patung-patung itu sebagai dewa-dewanya sendiri
  rationale: Bentuk Hifil dari עמד berarti menempatkan atau mendirikan. Pronomina 'mereka' merujuk pada representasi fisik dewa-dewa yang dapat didirikan; 'patung-patung itu' membuat tindakan tersebut jelas tanpa mengubah identitasnya sebagai dewa yang diadopsi Amazia.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: Ia sujud di hadapan mereka
  rationale: השתחוה menggambarkan tindakan membungkuk rendah atau bersujud, di sini dalam konteks penyembahan. 'Sujud' mempertahankan tindakan fisiknya dan membiarkan konteks menunjukkan makna ibadahnya.
- source_word: וְלָהֶם יְקַטֵּר
  choice: membakar dupa bagi mereka
  rationale: קטר dalam bentuk Piel lazim berarti membakar dupa atau persembahan yang menghasilkan asap. 'Membakar dupa' adalah ungkapan Indonesia yang jelas dan langsung.
theological_decisions:
- issue: Makna אֱלֹהֵי ketika menunjuk kepada ilah bangsa asing
  choice: dewa-dewa
  alternative: makhluk-makhluk ilahi
  rationale: Konteks berbicara tentang dewa-dewa Seir yang dipasang dan disembah Amazia. 'Dewa-dewa' mempertahankan ironi kemurtadannya tanpa menyatakan bahwa mereka adalah Allah yang sejati.
- issue: Apakah השתחוה diterjemahkan sebagai tindakan fisik atau ditafsirkan langsung sebagai ibadah
  choice: sujud di hadapan mereka
  alternative: menyembah mereka
  rationale: Terjemahan utama mempertahankan gambaran fisik verba Ibrani. Konteks pemasangan dewa dan pembakaran dupa sudah memperjelas bahwa tindakan itu merupakan penyembahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dalam teks Ibrani. Istilah 'orang Edom' mengikuti pemakaian umum untuk nama bangsa; 'dewa-dewa' ditulis dengan huruf kecil karena menunjuk kepada ilah-ilah bangsa asing.
