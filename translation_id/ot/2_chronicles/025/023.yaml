  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: id
  text: Yoas, raja Israel, menangkap Amazia, raja Yehuda, anak Yoas, anak Yoahas, di Bet-Semes, lalu membawanya ke Yerusalem. Kemudian ia menjebol tembok Yerusalem dari Pintu Gerbang Efraim sampai Pintu Gerbang Sudut[a], sepanjang empat ratus hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “pintu gerbang yang berbelok” atau “pintu gerbang yang menghadap”. Terjemahan “Pintu Gerbang Sudut” mengikuti kemungkinan identifikasinya dengan gerbang dalam kisah sejajar di 2 Raja-Raja 14:13.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: menangkap
  rationale: Kata kerja ini berarti memegang atau menguasai seseorang, termasuk menangkapnya sebagai tawanan. “Menangkap” alami dalam konteks kekalahan militer tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: di Bet-Semes
  rationale: Preposisi ב menunjuk lokasi penangkapan. “Di” merupakan padanan Indonesia yang wajar, sedangkan nama tempat ditransliterasikan.
- source_word: וַיְבִיאֵהוּ
  choice: lalu membawanya
  rationale: Bentuk kausatif dari בוא lazim berarti “membawa”. “Lalu” menyampaikan urutan naratif dari waw konsekutif secara alami.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: ia membobol tembok Yerusalem
  rationale: Dalam konstruksi ini פרץ menyatakan tindakan membuat lubang besar atau bagian yang jebol pada tembok. “Membobol” jelas, ringkas, dan sesuai dengan tindakan penghancuran pertahanan kota.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: dari Pintu Gerbang Efraim sampai Pintu Gerbang Sudut[a]
  rationale: Nama gerbang pertama diterjemahkan secara langsung. הַפּוֹנֶה secara harfiah berkaitan dengan berbelok atau menghadap, tetapi kemungkinan menunjuk gerbang yang dalam kisah sejajar disebut Pintu Gerbang Sudut; ambiguitas leksikal dipertahankan dalam catatan kaki.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: sepanjang empat ratus hasta
  rationale: Teks Ibrani menyebut ukuran secara langsung. Penambahan “sepanjang” hanya memperjelas fungsi ukuran dalam bahasa Indonesia tanpa mengubah jumlah; “hasta” mempertahankan satuan kuno.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: anak Yoas, anak Yoahas
  rationale: Susunan dua generasi dipertahankan sebagaimana dalam bahasa Ibrani dan tidak dilebur menjadi keterangan yang lebih umum.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bernada naratif-historis. Tanda koma mengapit gelar raja agar rangkaian nama dan silsilah mudah dipahami. Nama diri mengikuti bentuk Indonesia yang lazim: Yoas, Amazia, Yehuda, Yoahas, Bet-Semes, Yerusalem, dan Efraim.'
