  revised_text: Lalu Amazia memisahkan[a] pasukan yang datang kepadanya dari Efraim, lalu menyuruh mereka kembali ke tempat asal mereka. Mereka sangat marah terhadap Yehuda, lalu pulang ke tempat asal mereka dengan amarah yang berkobar-kobar.
