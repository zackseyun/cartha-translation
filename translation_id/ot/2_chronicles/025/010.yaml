base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: id
  text: Lalu Amazia memisahkan[a] pasukan yang datang kepadanya dari Efraim, lalu menyuruh mereka kembali ke tempat asal mereka. Mereka sangat marah terhadap Yehuda, lalu pulang ke tempat asal mereka dengan amarah yang berkobar-kobar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: melepaskan mereka.'
    reason: Kata kerja Ibrani secara harfiah berarti "memisahkan"; dalam konteks ini juga dapat menunjuk pada pelepasan pasukan dari tugasnya.
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: memberhentikan
  rationale: Secara dasar בדל berarti memisahkan, tetapi dalam konteks ini Amazia melepaskan pasukan Efraim dari tugas dan menyuruh mereka pulang. 'Memberhentikan' menyampaikan fungsi kontekstual itu secara alami; arti harfiahnya dicatat dalam catatan kaki.
- source_word: לְהַגְּדוּד
  choice: pasukan
  rationale: גְּדוּד menunjuk pada kelompok atau kesatuan bersenjata; 'pasukan' jelas dan sesuai dengan konteks militer.
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: yang datang kepadanya dari Efraim
  rationale: Terjemahan langsung dan alami dari klausa relatif yang mengidentifikasi pasukan tersebut.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: menyuruh mereka kembali ke tempat asal mereka
  rationale: Ungkapan ini menyatakan tujuan pemberhentian. 'Tempat asal mereka' mengungkapkan maksud לִמְקוֹמָם dalam konteks kepulangan tanpa sekadar menafsirkannya sebagai rumah pribadi.
- source_word: וַיִּחַר אַפָּם מְאֹד
  choice: mereka sangat marah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan amarah yang menyala; terjemahan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia modern.
- source_word: בִּיהוּדָה
  choice: terhadap Yehuda
  rationale: Preposisi ב menandai sasaran kemarahan. 'Terhadap Yehuda' mempertahankan arah permusuhan tanpa melebihkan intensitasnya.
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: lalu pulang ke tempat asal mereka
  rationale: שׁוב berarti kembali. 'Pulang' alami dalam konteks pasukan yang disuruh kembali ke daerah asalnya.
- source_word: בָּחֳרִי אָף
  choice: dengan amarah yang berkobar-kobar
  rationale: Pilihan ini mempertahankan citra panas atau nyala dalam ungkapan Ibrani serta penekanan kuat pada amarah mereka.
