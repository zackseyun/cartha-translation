  text: וַ/יַּ֨עַל יוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יִּתְרָא֣וּ פָנִ֔ים ה֖וּא וַ/אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה בְּ/בֵ֥ית שֶׁ֖מֶשׁ אֲשֶׁ֥ר לִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: id
  text: Maka Yoas, raja Israel, bergerak maju. Ia dan Amazia, raja Yehuda, saling berhadapan[a] di Bet-Semes, yang termasuk wilayah Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “saling melihat muka”; dapat juga diterjemahkan “bertemu muka dengan muka.”'
    reason: Ungkapan Ibrani mempertahankan gambaran tentang melihat muka satu sama lain dan dapat menekankan baik perjumpaan langsung maupun konfrontasi.
lexical_decisions:
- source_word: וַיַּעַל
  choice: bergerak maju
  rationale: Kata עלה secara dasar berarti ‘naik’ atau ‘pergi naik’, tetapi dalam konteks pergerakan menuju pertempuran, ‘bergerak maju’ terdengar alami dalam bahasa Indonesia tanpa menambahkan gagasan penyerangan yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: saling berhadapan
  rationale: Ungkapan Ibrani yang secara harfiah berkaitan dengan ‘melihat muka’ menyatakan perjumpaan langsung; dalam konteks ini, ‘saling berhadapan’ mempertahankan nuansa konfrontatif sekaligus wajar dalam bahasa Indonesia.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: Ia dan Amazia
  rationale: Kata ganti eksplisit הוּא dipertahankan sebagai ‘ia’; acuannya jelas kepada Yoas yang baru disebutkan, dan susunan ini mencerminkan penekanan pada kedua raja.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: di Bet-Semes
  rationale: Preposisi tempat בְּ diterjemahkan secara alami dengan ‘di’, dan nama tempat ditransliterasikan sebagai Bet-Semes.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: yang termasuk wilayah Yehuda
  rationale: Frasa dengan לְ menunjukkan keterikatan atau kepemilikan teritorial. ‘Termasuk wilayah Yehuda’ menyampaikan maksud itu dengan jelas tanpa menyiratkan bahwa tempat tersebut sekadar berada di sana.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: raja Israel / raja Yehuda
  rationale: Gelar kerajaan diterjemahkan langsung dan konsisten dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat dibagi menjadi dua agar hubungan antartindakan jelas dan alami, tanpa menghilangkan unsur teks Ibrani.
