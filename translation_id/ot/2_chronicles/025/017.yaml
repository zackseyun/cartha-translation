base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: id
  text: 'Kemudian Amazia, raja Yehuda, berunding lalu mengirim pesan kepada Yoas anak Yoahas, anak Yehu, raja Israel, dengan pesan: “Mari, kita saling berhadapan.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mari kita bertatap muka.” Ungkapan Ibrani secara harfiah berbicara tentang saling melihat muka dan dalam konteks ini kemungkinan besar menyatakan tantangan untuk berkonfrontasi secara langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: berunding
  rationale: Bentuk Nifal dari יעץ menyatakan pertimbangan atau konsultasi sebelum bertindak; “berunding” alami dalam bahasa Indonesia dan tidak menentukan dengan siapa ia berunding.
- source_word: וַיִּשְׁלַח אֶל
  choice: mengirim pesan kepada
  rationale: Secara harfiah berarti “mengirim kepada”; objek yang dikirim tidak dinyatakan. “Mengirim pesan kepada” menyampaikan tindakan komunikasi tanpa secara eksplisit menambahkan para utusan.
- source_word: יוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: Yoas anak Yoahas, anak Yehu, raja Israel
  rationale: Mempertahankan silsilah dan gelar lengkap yang eksplisit dalam teks Ibrani serta memakai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Pengantar naratif baku bagi perkataan langsung, dinyatakan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: לְךָ
  choice: Mari
  rationale: Imperatif ini berfungsi sebagai ajakan bernada tantangan; “Mari” sesuai dengan bentuk orang pertama jamak pada klausa berikutnya.
- source_word: נִתְרָאֶה פָנִים
  choice: kita berhadapan muka
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan saling melihat muka, tetapi dalam konteks ini menyiratkan pertemuan langsung yang bersifat konfrontatif. “Berhadapan muka” mempertahankan citra muka dan nuansa tantangannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan silsilah dipertahankan, sedangkan ungkapan tantangan diterjemahkan secara alami sambil menjaga citra “muka” dari bahasa Ibrani.
