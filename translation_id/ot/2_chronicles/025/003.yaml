  yaml_path: translation/ot/2_chronicles/025/003.yaml
  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: id
  text: Ketika kerajaan itu telah kokoh di bawah kekuasaannya[a], ia membunuh para pegawainya yang telah membunuh ayahnya, sang raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kerajaan itu telah menjadi kuat atasnya.” Maksudnya, kekuasaan kerajaan telah mantap dalam kendalinya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rumus naratif ini memperkenalkan waktu terjadinya peristiwa berikutnya. 'Ketika' menyampaikan hubungan temporal secara alami tanpa menambahkan penanda wacana yang tidak tersurat.
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: kerajaan itu telah kokoh di bawah kekuasaannya
  rationale: Dalam konteks ini חזק menunjuk pada mantapnya pemerintahan atau kendali raja, bukan kekuatan fisik. Ungkapan 'di bawah kekuasaannya' menyampaikan arti idiomatis עָלָיו secara jelas.
- source_word: וַיַּהֲרֹג
  choice: ia membunuh
  rationale: Padanan langsung, jelas, dan wajar bagi הרג dalam bahasa Indonesia modern.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עבד dapat menunjuk kepada orang-orang yang melayani raja. 'Pegawai' menghindari kesan status budak yang belum tentu dimaksudkan dan lebih tepat daripada istilah umum 'pelayan' bagi para pembunuh raja.
- source_word: הַמַּכִּים
  choice: yang telah membunuh
  rationale: Partisip ini mengenali mereka sebagai orang-orang yang sebelumnya membunuh sang raja. Dalam konteks serangan fatal, 'membunuh' mengungkapkan hasil tindakan secara alami.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: ayahnya, sang raja
  rationale: Susunan ini mempertahankan hubungan aposisi antara 'raja' dan 'ayahnya' sambil terdengar alami dalam bahasa Indonesia.
