base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: id
  text: Amazia berkata kepada abdi Allah, “Tetapi, apa yang harus dilakukan mengenai seratus talenta[a] yang telah kuberikan kepada pasukan Israel itu?” Abdi Allah menjawab, “Yahweh sanggup memberikan kepadamu lebih banyak daripada itu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seratus talenta”; ayat sebelumnya menyebutkan bahwa yang dimaksud adalah talenta perak.'
    reason: cross_reference
  - marker: b
    text: 'Dapat juga diterjemahkan: “Yahweh memiliki cukup untuk memberikan kepadamu lebih banyak daripada itu.” Ungkapan Ibraninya menekankan kemampuan atau sumber daya Yahweh untuk menyediakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar baku bagi utusan yang ditugaskan Allah. ‘Abdi Allah’ terdengar alami dan bermartabat dalam bahasa Indonesia serta tidak mempersempit maknanya menjadi jabatan ‘nabi’.
- source_word: וּמַה לַּעֲשׂוֹת
  choice: Tetapi, apa yang harus dilakukan mengenai
  rationale: Ungkapan ini menanyakan tindakan yang harus diambil sehubungan dengan uang yang sudah dibayarkan. ‘Tetapi’ menyampaikan keberatan Amazia dalam konteks.
- source_word: מְאַת הַכִּכָּר
  choice: seratus talenta
  rationale: כִּכָּר adalah satuan berat yang lazim disebut ‘talenta’. Kata ‘perak’ tidak terdapat dalam ayat ini, tetapi dijelaskan dalam ayat sebelumnya, sehingga dicantumkan dalam catatan kaki.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: pasukan Israel
  rationale: גְּדוּד dapat berarti gerombolan atau satuan pasukan. Dalam konteks para prajurit sewaan, ‘pasukan Israel’ jelas dan alami.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: Yahweh sanggup memberikan kepadamu
  rationale: Konstruksi eksistensial Ibrani ini menekankan kemampuan atau sumber daya Yahweh untuk memberi. ‘Sanggup memberikan’ menyampaikan maksud itu secara wajar tanpa menghilangkan tekanannya.
- source_word: הַרְבֵּה מִזֶּה
  choice: jauh lebih banyak daripada itu
  rationale: הַרְבֵּה dengan מִן menyatakan perbandingan dalam hal kelimpahan; ‘jauh lebih banyak daripada itu’ menyampaikan penekanannya dengan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung. ‘Yahweh’ mempertahankan nama itu dan membedakannya dari gelar.
- issue: Sifat pernyataan tentang pemberian Yahweh
  choice: Yahweh sanggup memberikan kepadamu
  alternative: Yahweh memiliki cukup banyak untuk memberikan kepadamu
  rationale: Teks dapat dipahami dengan penekanan pada kemampuan maupun kecukupan sumber daya Yahweh. Teks utama memakai ungkapan Indonesia yang alami, sedangkan nuansa alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Abdi Allah’ dipakai sebagai gelar yang alami; ‘talenta’ dipertahankan sebagai satuan berat kuno. Bentuk ‘kuberi­kan’ mencerminkan orang pertama tunggal dalam teks sumber.
