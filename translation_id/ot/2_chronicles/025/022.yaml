  text: וַ/יִּנָּ֥גֶף יְהוּדָ֖ה לִ/פְנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּנֻ֖סוּ אִ֥ישׁ לְ/אֹהָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/022.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: id
  text: Yehuda dikalahkan oleh Israel, lalu setiap orang melarikan diri ke kemahnya masing-masing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap orang ke kemahnya”; ungkapan ini berarti mereka tercerai-berai dan mundur ke tempat masing-masing.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: dikalahkan
  rationale: Bentuk nifal dari נָגַף dalam konteks pertempuran menyatakan bahwa Yehuda mengalami kekalahan, bukan sekadar terkena pukulan.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama baku dalam bahasa Indonesia untuk kerajaan selatan.
- source_word: לִפְנֵי
  choice: oleh
  rationale: Secara harfiah berarti 'di hadapan', tetapi dalam konteks peperangan menandai pihak yang mengalahkan; 'oleh' menghasilkan ungkapan pasif yang alami dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama baku dalam bahasa Indonesia untuk kerajaan utara.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: נוּס berarti lari untuk menyelamatkan diri; pilihan ini jelas dan alami dalam narasi Indonesia modern.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Bentuk tunggal distributif menunjuk kepada tiap-tiap anggota pasukan. 'Setiap orang' alami dalam bahasa Indonesia tanpa menghilangkan fungsi distributifnya.
- source_word: לְאֹהָלָיו
  choice: ke kemahnya masing-masing
  rationale: Ungkapan ini secara harfiah menunjuk ke kemah masing-masing dan secara idiomatis menggambarkan pasukan yang tercerai-berai serta mundur ke tempatnya sendiri. Kata 'masing-masing' memperjelas hubungan distributif dengan אִישׁ.
theological_decisions: []
