source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה רַ֕ק לֹ֖א בְּ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh, tetapi tidak dengan segenap hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak dengan hati yang utuh/lengkap”; dapat juga diterjemahkan “tidak sepenuh hati.” Ungkapan ini menunjuk pada pengabdian yang tidak utuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol menuturkan tindakan lampau. Kata sambung awal tidak perlu dinyatakan dalam bahasa Indonesia karena alur narasi sudah jelas.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Adjektiva berartikel ini berfungsi secara substantival, yakni ‘hal yang benar’. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan evaluatif Ibrani ini dipertahankan secara transparan dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap tampak.
- source_word: רַק
  choice: tetapi
  rationale: Dalam konteks ini רַק membatasi penilaian positif sebelumnya dan memiliki daya adversatif; ‘tetapi’ menyampaikan kontras itu secara alami.
- source_word: לֹא
  choice: tidak
  rationale: Menyatakan negasi langsung.
- source_word: בְּלֵבָב שָׁלֵם
  choice: dengan segenap hati
  rationale: Ungkapan ini menunjuk pada keutuhan atau kelengkapan pengabdian batin. ‘Dengan segenap hati’ alami dalam bahasa Indonesia, mempertahankan metafora hati, dan tidak menambahkan gagasan kesempurnaan tanpa dosa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian sebagai nama pribadi tanpa menggantinya dengan sebuah gelar.
- issue: Sifat pengabdian Amazia
  choice: tidak dengan segenap hati
  alternative: tidak dengan hati yang sempurna; tidak sepenuh hati
  rationale: Teks mengkritik ketidakutuhan pengabdian batinnya tanpa secara eksplisit menyebut kemunafikan atau menuntut makna kesempurnaan tanpa dosa. Rumusan ini mempertahankan ketegangan antara tindakan yang benar dan kesetiaan batin yang tidak lengkap.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan idiom ‘di mata’ dan metafora ‘hati’ dari teks Ibrani.
