  to: Kemudian Amazia mengumpulkan orang-orang Yehuda dan mengatur mereka menurut keluarga-keluarga berdasarkan garis ayah mereka, di bawah para kepala pasukan seribu dan para kepala pasukan seratus[a], untuk seluruh Yehuda dan Benyamin. Ia mendata mereka yang berumur dua puluh tahun ke atas dan mendapati bahwa jumlah mereka tiga ratus ribu orang pilihan[b] yang maju berperang[c], sambil memegang tombak dan perisai besar[d].
