  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: id
  text: Kemudian Amazia mengumpulkan orang-orang Yehuda dan mengatur mereka menurut keluarga-keluarga berdasarkan garis ayah mereka, di bawah para kepala pasukan seribu dan para kepala pasukan seratus[a], untuk seluruh Yehuda dan Benyamin. Ia mendata mereka yang berumur dua puluh tahun ke atas dan mendapati bahwa jumlah mereka tiga ratus ribu orang pilihan[b] yang maju berperang[c], sambil memegang tombak dan perisai besar[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kepala seribu dan para kepala seratus”; ini adalah jenjang kepemimpinan militer.
    reason: Ungkapan Ibrani mempertahankan angka sebagai sebutan unit atau jenjang komando, bukan semata-mata jumlah bawahan yang pasti.
  - marker: b
    text: Kata Ibrani yang diterjemahkan “orang pilihan” juga dapat berarti “pemuda”.
    reason: Menjaga keluasan makna בָּחוּר tanpa memaksakan apakah penekanannya terutama pada usia muda atau mutu sebagai prajurit terpilih.
  - marker: c
    text: Secara harfiah, “keluar untuk perang” atau “keluar untuk dinas militer”; ini adalah ungkapan militer.
    reason: Menjelaskan idiom militer יוֹצֵא צָבָא sambil mempertahankan gambaran harfiahnya.
  - marker: d
    text: Kata Ibrani צִנָּה secara khusus menunjuk pada perisai besar.
    reason: Mempertahankan kekhususan jenis perisai dalam sumber Ibrani.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: mengumpulkan
  rationale: Makna dasar קבץ adalah mengumpulkan atau menghimpun; bentuk ini alami dan tidak menambahkan gagasan apel resmi yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּעֲמִידֵם
  choice: mengatur mereka
  rationale: Bentuk Hifil dari עמד dapat berarti menempatkan atau menetapkan. Dalam konteks ini, Amazia menyusun orang-orang itu ke dalam struktur militer; 'mengatur' menyampaikan fungsi tersebut tanpa menyiratkan bahwa setiap orang diangkat menjadi pejabat.
- source_word: לְבֵית אָבוֹת
  choice: menurut keluarga leluhur
  rationale: Ungkapan ini menunjuk pada kelompok kekerabatan berdasarkan garis ayah. 'Keluarga leluhur' lebih mudah dipahami dalam bahasa Indonesia modern daripada terjemahan harfiah 'rumah-rumah ayah'.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: di bawah para kepala pasukan seribu dan kepala pasukan seratus
  rationale: שׂר berarti pemimpin atau pejabat. 'Kepala pasukan' sesuai dengan konteks militer, sedangkan angka seribu dan seratus mempertahankan susunan hierarkis teks.
- source_word: וַיִּפְקְדֵם
  choice: Ia mendata mereka
  rationale: פקד dalam konteks militer mencakup pemeriksaan dan penghitungan. 'Mendata' secara alami menyampaikan pencatatan untuk pengerahan militer.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini adalah rumusan ambang usia dan diterjemahkan dengan idiom Indonesia yang lugas.
- source_word: וַיִּמְצָאֵם שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: mendapati bahwa jumlah mereka tiga ratus ribu
  rationale: מצא memperkenalkan hasil pendataan; penyebutan 'jumlah' membuat fungsi angka tersebut jelas secara alami.
- source_word: בָּחוּר
  choice: orang pilihan
  rationale: בָּחוּר dapat berarti pemuda atau orang terpilih/terlatih. Dalam daftar militer, 'orang pilihan' cocok dengan nuansa kecakapan, sementara kemungkinan arti usia dipertahankan dalam catatan kaki.
- source_word: יוֹצֵא צָבָא
  choice: siap maju berperang
  rationale: Secara harfiah berarti 'keluar menuju pasukan/perang' dan merupakan ungkapan bagi orang yang menjalankan atau layak menjalankan dinas militer. Pilihan ini mempertahankan gambaran maju berperang sekaligus terdengar alami.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: mampu menggunakan tombak dan perisai besar
  rationale: אֹחֵז secara harfiah berarti memegang, tetapi dalam konteks ini menunjukkan kemampuan membawa atau menggunakan senjata. צִנָּה menunjuk secara khusus pada perisai besar.
