source:
  edition: WLC
  text: וַ/אֲמַצְיָ֨הוּ֙ הִתְחַזַּ֔ק וַ/יִּנְהַג֙ אֶת עַמּ֔/וֹ וַ/יֵּ֖לֶךְ גֵּ֣יא הַמֶּ֑לַח וַ/יַּ֥ךְ אֶת בְּנֵי שֵׂעִ֖יר עֲשֶׂ֥רֶת אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: id
  text: Lalu Amazia menguatkan dirinya, memimpin rakyatnya, dan pergi ke Lembah Garam. Di sana ia menewaskan sepuluh ribu orang keturunan Seir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Seir,” yaitu orang-orang atau keturunan Seir.'
    reason: Menjelaskan ungkapan etnis-genealogis Ibrani tanpa mempertahankan bentuk harfiah yang dapat terdengar seolah-olah hanya menunjuk pada anak kandung.
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: menguatkan dirinya
  rationale: 'Bentuk Hitpael mempertahankan nuansa refleksif: Amazia menjadikan dirinya kuat atau meneguhkan dirinya. Ungkapan ini cukup alami dan tidak mempersempit maknanya hanya pada keberanian.'
- source_word: וַיִּנְהַג אֶת עַמּוֹ
  choice: memimpin rakyatnya
  rationale: Dalam konteks gerakan militer, נהג berarti membawa atau memimpin suatu kelompok. 'Memimpin rakyatnya' jelas dan tidak menambahkan rincian taktis yang tidak disebutkan.
- source_word: גֵּיא הַמֶּלַח
  choice: Lembah Garam
  rationale: Terjemahan langsung unsur-unsur nama tempat; huruf kapital menandainya sebagai nama geografis.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: נכה memiliki cakupan makna memukul, mengalahkan, atau membunuh. Penyebutan jumlah dalam pertempuran, disusul kontras dengan para tawanan yang masih hidup pada ayat berikutnya, mendukung arti bahwa sepuluh ribu orang ini tewas.
- source_word: בְּנֵי שֵׂעִיר
  choice: orang keturunan Seir
  rationale: Secara harfiah berarti 'anak-anak Seir', sebuah ungkapan etnis-genealogis. 'Orang keturunan Seir' menyampaikan maksudnya secara alami dalam bahasa Indonesia modern.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: sepuluh ribu
  rationale: Padanan langsung dan lazim bagi frasa bilangan Ibrani ini.
- source_word: וַאֲמַצְיָהוּ
  choice: Lalu Amazia
  rationale: Waw menggerakkan rangkaian narasi. 'Lalu' menyatakan urutan secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dipecah menjadi dua kalimat agar rangkaian tindakan tetap jelas dan alami. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
