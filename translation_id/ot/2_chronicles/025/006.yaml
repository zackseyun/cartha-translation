  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: id
  text: Ia menyewa dari Israel seratus ribu pejuang yang gagah perkasa[a] dengan bayaran seratus talenta perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “prajurit yang gagah berani” atau “prajurit yang perkasa.” Ungkapan Ibrani ini menunjuk pada orang-orang yang cakap bertempur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: Ia juga menyewa
  rationale: Kata kerja שׂכר dalam bentuk Qal berarti menyewa dengan upah. 'Menyewa' menyatakan transaksi tersebut tanpa menambahkan sebutan interpretatif seperti 'tentara bayaran'; 'juga' menghubungkan tindakan ini dengan persiapan militer pada ayat sebelumnya.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Kata depan מן menyatakan sumber atau asal. Dalam konteks ini Israel merujuk pada kerajaan utara, tetapi teks utama mempertahankan nama geografis-politis yang digunakan sumber.
- source_word: מֵאָה אֶלֶף
  choice: seratus ribu
  rationale: Bilangan kardinal ini diterjemahkan secara langsung.
- source_word: גִּבּוֹר חָיִל
  choice: pejuang yang gagah perkasa
  rationale: Ungkapan Ibrani ini menunjuk pada orang-orang yang kuat, cakap, dan berani dalam pertempuran. Pilihan ini alami dalam bahasa Indonesia serta mempertahankan daya dan nuansa militernya.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: dengan bayaran seratus talenta perak
  rationale: Kata depan בְּ di sini menyatakan harga atau pembayaran. 'Dengan bayaran' memperjelas hubungan transaksional secara alami, sementara satuan kuno 'talenta' dipertahankan tanpa konversi yang belum tentu tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Pronomina 'Ia' mengikuti gaya narasi Alkitab Indonesia; istilah satuan kuno 'talenta' dipertahankan. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang dijelaskannya.
