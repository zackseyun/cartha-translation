  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: id
  text: Maka sekarang, hendaklah kalian takut akan Yahweh. Berhati-hatilah dan bertindaklah, sebab Yahweh, Allah kita, tidak bertindak tidak adil, tidak memihak[a], dan tidak menerima suap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengangkat wajah,” sebuah ungkapan Ibrani yang berarti menunjukkan keberpihakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Gabungan ini menyampaikan unsur waktu sekaligus daya simpulan yang mengantar kepada nasihat.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: biarlah rasa takut akan Yahweh ada pada kalian
  rationale: Bentuk jusif diterjemahkan sebagai ajakan, sedangkan פַחַד יְהוָה menyatakan rasa gentar dan hormat kepada Allah. Ungkapan 'ada pada kalian' tetap dekat dengan gambaran Ibrani tanpa terdengar janggal.
- source_word: שִׁמְרוּ
  choice: Berhati-hatilah
  rationale: Dalam konteks para hakim, perintah ini menuntut kewaspadaan dan kecermatan dalam menjalankan tugas.
- source_word: וַעֲשׂוּ
  choice: dan bertindaklah
  rationale: Kata kerja umum 'melakukan' di sini mendesak para hakim untuk melaksanakan tugas mereka secara nyata.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: sebab pada Yahweh, Allah kita, tidak ada
  rationale: Mempertahankan konstruksi עִם yang menerangkan hal-hal yang tidak terdapat dalam sifat maupun tindakan Allah.
- source_word: עַוְלָה
  choice: ketidakadilan
  rationale: Konteks peradilan membuat 'ketidakadilan' lebih tepat daripada istilah moral yang lebih umum.
- source_word: מַשֹּׂא פָנִים
  choice: sikap memihak
  rationale: Ungkapan idiomatis ini berarti memperlakukan seseorang secara istimewa berdasarkan kedudukan atau identitasnya.
- source_word: מִקַּח שֹׁחַד
  choice: penerimaan suap
  rationale: Nomina ini menunjuk pada tindakan menerima suap; pilihan ini ringkas, alami, dan sesuai konteks kehakiman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi dan merupakan transliterasi ilmiah yang lazim tanpa memasukkan kekhasan denominasi.
- issue: Makna פַחַד יְהוָה
  choice: rasa takut akan Yahweh
  alternative: rasa hormat kepada Yahweh
  rationale: Kata פַחַד mencakup kegentaran yang penuh hormat. 'Rasa takut' mempertahankan ketegangan semantis teks dan tidak mempersempitnya menjadi rasa hormat saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk jamak 'kalian' menyatakan bahwa nasihat ini ditujukan kepada sekelompok hakim. Susunan kalimat dibuat alami sambil mempertahankan bentuk ajakan, istilah peradilan, dan nama ilahi dari teks Ibrani.
