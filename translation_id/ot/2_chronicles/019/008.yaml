  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: id
  text: Di Yerusalem juga, Yosafat mengangkat beberapa orang dari kalangan orang Lewi, para imam, dan para kepala kaum keluarga Israel untuk urusan penghakiman Yahweh[a] dan perkara-perkara sengketa. Mereka pun kembali ke Yerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk penghakiman Yahweh.” Frasa ini dapat merujuk pada penghakiman yang berkaitan dengan Yahweh atau pada perkara yang diatur oleh hukum-Nya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah menurut teks Ibrani yang diterima, “mereka kembali ke Yerusalem.” Ungkapan ini terasa agak mendadak dalam konteks. Sebagian orang memahami teks secara berbeda, misalnya “mereka tinggal di Yerusalem” atau “mereka duduk di Yerusalem.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בִּירוּשָׁלִַם
  choice: Di Yerusalem juga
  rationale: Mempertahankan daya aditif וְגַם dan keterangan tempat secara wajar dalam susunan bahasa Indonesia.
- source_word: הֶעֱמִיד
  choice: mengangkat
  rationale: Dalam konteks penataan lembaga peradilan, bentuk Hifil ini menunjuk pada penempatan orang dalam suatu tugas atau jabatan; “mengangkat” merupakan padanan administratif yang alami.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: beberapa orang dari kalangan orang Lewi, para imam, dan para kepala kaum keluarga Israel
  rationale: Kata depan מִן/מֵ menyatakan pemilihan dari kelompok-kelompok tersebut. “Kaum keluarga” menyampaikan struktur sosial רָאשֵׁי הָאָבוֹת dengan bahasa Indonesia yang mudah dipahami tanpa meratakannya sekadar menjadi keluarga inti.
- source_word: לְמִשְׁפַּט יְהוָה
  choice: untuk menangani penghakiman Yahweh
  rationale: “Penghakiman Yahweh” mempertahankan hubungan genitif yang dapat menunjuk pada penghakiman yang menjadi wewenang Yahweh, dilakukan atas nama-Nya, atau diatur oleh hukum-Nya. Kata “menangani” membuat fungsi para pejabat itu jelas tanpa menentukan salah satu tafsiran tersebut.
- source_word: וְלָרִיב
  choice: dan perkara-perkara sengketa
  rationale: רִיב dalam konteks hukum berarti sengketa, perkara, atau perselisihan. Ungkapan ini alami dalam bahasa Indonesia dan tetap menandai ranah yudisial.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Mereka pun kembali ke Yerusalem
  rationale: Teks Masoret yang diterima secara langsung memakai kata kerja שוב, “kembali”. Karena pernyataan ini terasa mendadak sesudah keterangan tempat pada awal ayat, persoalan tekstual atau penafsirannya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: “Yahweh” merepresentasikan nama diri ilahi dalam teks sumber dan selaras dengan lapisan konsultasi, tanpa menggantinya dengan gelar.
- issue: Cakupan makna לְמִשְׁפַּט יְהוָה
  choice: penghakiman Yahweh
  alternative: penghakiman bagi Yahweh; perkara yang diatur oleh hukum Yahweh
  rationale: Bentuk genitif Ibrani tidak menentukan secara tegas apakah yang dimaksud ialah penghakiman milik Yahweh, penghakiman yang dijalankan atas nama-Nya, atau perkara yang tunduk pada hukum-Nya. Terjemahan utama mempertahankan keluasan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Istilah yudisial dipertahankan, tetapi susunan kalimat dibuat alami. Ambiguitas frasa tentang penghakiman Yahweh dan kesulitan pada klausa penutup tidak diselesaikan secara sepihak.
