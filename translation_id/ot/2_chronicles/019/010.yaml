id: 2CH.19.10
reference: 2 Chronicles 19:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: id
  text: Setiap perkara yang diajukan kepadamu oleh saudara-saudaramu yang tinggal di kota-kota mereka—baik antara darah dan darah[a], antara hukum dan perintah, ketetapan dan peraturan—hendaklah kamu memperingatkan mereka agar mereka tidak menjadi bersalah terhadap Yahweh. Jika tidak, murka akan menimpa kamu dan saudara-saudaramu. Bertindaklah demikian, maka kamu tidak akan menjadi bersalah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “antara darah dan darah”; kemungkinan menunjuk pada perkara yang menyangkut penumpahan darah atau pembunuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: perkara
  rationale: Dalam konteks pengadilan, kata ini menunjuk pada sengketa atau perkara hukum. 'Perkara' alami dalam bahasa Indonesia dan tidak membatasi maknanya pada perselisihan pribadi.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: diajukan kepadamu
  rationale: Ungkapan ini dalam konteks yudisial berarti suatu perkara dibawa ke hadapan atau ke dalam kewenangan para hakim.
- source_word: מֵאֲחֵיכֶם
  choice: oleh saudara-saudaramu
  rationale: Mempertahankan bahasa kekerabatan Ibrani bagi sesama anggota umat perjanjian; bentuk ulang 'saudara-saudara' wajar untuk jamak dalam bahasa Indonesia.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: yang tinggal di kota-kota mereka
  rationale: Terjemahan langsung dan alami dari frasa partisipial tersebut.
- source_word: בֵּין דָּם לְדָם
  choice: mengenai darah dan darah
  rationale: Bentuk Ibrani yang ringkas dan teknis dipertahankan agar ambiguitasnya tidak dihilangkan; kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: mengenai hukum dan perintah, ketetapan dan peraturan
  rationale: Mempertahankan rangkaian kategori hukum tanpa melebur semuanya menjadi istilah umum yang sama.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: kamu harus memperingatkan mereka
  rationale: Bentuk Hifil dari זהר di sini menyatakan peringatan atau teguran untuk mencegah timbulnya kesalahan.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: mereka tidak menanggung kesalahan di hadapan Yahweh
  rationale: אשׁם dapat menyatakan menjadi bersalah atau menanggung kesalahan; ungkapan ini menyampaikan pertanggungjawaban di hadapan Allah tanpa mempersempitnya menjadi perasaan bersalah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: קֶצֶף
  choice: murka
  rationale: Istilah ini menyampaikan beratnya kemarahan dan penghukuman ilahi dalam konteks perjanjian.
- source_word: כֹּה תַעֲשׂוּן
  choice: Bertindaklah demikian
  rationale: Ungkapan ringkas dan alami yang merujuk kembali pada kewajiban yudisial yang baru disebutkan.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: kamu tidak akan menanggung kesalahan
  rationale: Menggunakan padanan yang konsisten dengan kemunculan אשׁם sebelumnya.
theological_decisions:
- issue: Bahasa komunitas perjanjian אֲחֵיכֶם
  choice: saudara-saudaramu
  alternative: sesama orang Israel
  rationale: Teks memakai bahasa kekerabatan bagi anggota komunitas perjanjian. Padanan harfiah dipertahankan tanpa menutup cakupan komunalnya.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat Tetragramaton sebagai nama diri; transliterasi mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Hubungan akibat dalam וְהָיָה קֶצֶף
  choice: Jika tidak, murka akan menimpa
  alternative: dan murka akan menimpa
  rationale: Konteks menunjukkan akibat jika para hakim gagal memperingatkan pihak-pihak tersebut. 'Jika tidak' membuat hubungan pragmatis itu alami dalam bahasa Indonesia tanpa mengubah dasar kondisional yang tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah yudisial dibuat jelas bagi pembaca umum, sementara ungkapan teknis Ibrani 'darah dan darah' dipertahankan dalam teks dan diterangkan melalui catatan kaki.
