revisions:
- from: Setiap perkara yang diajukan kepadamu oleh saudara-saudaramu yang tinggal di kota-kota mereka—baik mengenai darah dan darah[a], maupun mengenai hukum dan perintah, ketetapan dan peraturan—kamu harus memperingatkan mereka supaya mereka tidak menanggung kesalahan di hadapan Yahweh. Jika tidak, murka akan menimpa kamu dan saudara-saudaramu. Bertindaklah demikian, maka kamu tidak akan menanggung kesalahan.
  to: Setiap perkara yang diajukan kepadamu oleh saudara-saudaramu yang tinggal di kota-kota mereka—baik antara darah dan darah[a], antara hukum dan perintah, ketetapan dan peraturan—hendaklah kamu memperingatkan mereka agar mereka tidak menjadi bersalah terhadap Yahweh. Jika tidak, murka akan menimpa kamu dan saudara-saudaramu. Bertindaklah demikian, maka kamu tidak akan menjadi bersalah.
