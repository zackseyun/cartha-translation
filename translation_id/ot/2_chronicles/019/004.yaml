  text: וַ/יֵּ֥שֶׁב יְהוֹשָׁפָ֖ט בִּ/ירוּשָׁלִָ֑ם וַ/יָּ֜שָׁב וַ/יֵּצֵ֣א בָ/עָ֗ם מִ/בְּאֵ֥ר שֶׁ֨בַע֙ עַד הַ֣ר אֶפְרַ֔יִם וַ/יְשִׁיבֵ֕/ם אֶל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽםס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: id
  text: Yosafat tinggal di Yerusalem. Kemudian ia kembali mengunjungi rakyat, dari Bersyeba sampai ke pegunungan Efraim, dan membawa mereka kembali kepada Yahweh, Allah nenek moyang mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Bentuk dari ישׁב di sini menyatakan kediaman menetap di Yerusalem, bukan tindakan harfiah 'duduk'.
- source_word: וַיָּשָׁב וַיֵּצֵא בָעָם
  choice: kemudian ia kembali mengunjungi rakyat
  rationale: Rangkaian verba menyatakan bahwa Yosafat kembali atau mengulangi kegiatannya dengan pergi ke tengah rakyat. 'Kembali mengunjungi' alami dalam bahasa Indonesia sekaligus mempertahankan unsur pengulangan tanpa reproduksi yang kaku.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: dari Bersyeba sampai ke pegunungan Efraim
  rationale: Frasa ini menunjukkan jangkauan perjalanan. הַר אֶפְרַיִם merujuk pada kawasan pegunungan Efraim.
- source_word: וַיְשִׁיבֵם
  choice: membawa mereka kembali
  rationale: Bentuk hifil dari שוב berarti menyebabkan mereka kembali; pilihan ini mempertahankan tindakan aktif Yosafat tanpa menambahkan konsep teknis seperti 'bertobat' atau 'mempertobatkan'.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: '''Nenek moyang'' merupakan padanan modern dan inklusif secara genealogi bagi bentuk jamak אבות, serta tetap menjaga kaitan dengan iman leluhur.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama diri ilahi yang hadir secara langsung dalam teks Ibrani; 'TUHAN' tetap merupakan alternatif tradisional Indonesia.
- issue: Makna וַיְשִׁיבֵם אֶל יְהוָה
  choice: membawa mereka kembali kepada Yahweh
  alternative: membuat mereka bertobat kepada Yahweh
  rationale: Pilihan utama mempertahankan metafora kembali dan peran kausatif Yosafat tanpa mempersempitnya menjadi istilah teologis tertentu yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat mengikuti ejaan Alkitab Indonesia yang lazim. Susunan kalimat dibuat alami tanpa menghilangkan gerak kembali yang terdapat dalam rangkaian verba Ibrani.
