id: 2CH.19.3
reference: 2 Chronicles 19:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: id
  text: Namun, hal-hal baik didapati padamu, sebab engkau telah menyingkirkan benda-benda pemujaan Asyera[a] dari negeri itu dan mempersiapkan hatimu[b] untuk mencari Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Asyerot”, yaitu benda-benda pemujaan yang berkaitan dengan dewi Asyera; bentuknya mungkin berupa tiang atau patung.'
    reason: cultural_note
  - marker: b
    text: Atau “menetapkan hatimu” atau “meneguhkan hatimu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Namun
  rationale: Menandai pertentangan bernada konsesif dengan teguran pada ayat sebelumnya secara alami dan bermartabat.
- source_word: דְּבָרִים טוֹבִים
  choice: hal-hal baik
  rationale: Mempertahankan keluasan ungkapan Ibrani dan tidak membatasinya hanya pada perbuatan.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: didapati padamu
  rationale: Mencerminkan bentuk pasif dan penilaian bahwa ada hal-hal terpuji pada diri Yosafat, tanpa mengubahnya menjadi pernyataan tentang perbuatan semata.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar bagi penilaian positif tersebut dengan hubungan kausal yang jelas.
- source_word: בִעַרְתָּ
  choice: telah menyingkirkan
  rationale: Menyampaikan tindakan penghapusan yang tegas tanpa memastikan bahwa benda-benda itu secara harfiah dibakar.
- source_word: הָאֲשֵׁרוֹת
  choice: benda-benda pemujaan Asyera
  rationale: Bentuk jamak ini menunjuk pada benda kultis yang berkaitan dengan Asyera; pilihan ini lebih berhati-hati daripada memastikan bentuk fisiknya sebagai tiang.
- source_word: מִן הָאָרֶץ
  choice: dari negeri itu
  rationale: Menyatakan penyingkiran dari wilayah yang dimaksud; bentuk definit Ibrani secara wajar dirujuk sebagai negeri itu.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: dan mempersiapkan hatimu
  rationale: Mengikuti makna dasar verba כון dalam bentuk ini dan mempertahankan gambaran Ibrani tentang hati sebagai pusat tekad batin.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: untuk mencari Allah
  rationale: Mempertahankan ungkapan penting dalam Tawarikh yang mencakup orientasi dan pengabdian kepada Allah, bukan sekadar meminta informasi dari-Nya.
theological_decisions:
- issue: Identitas dan bentuk הָאֲשֵׁרוֹת
  choice: benda-benda pemujaan Asyera
  alternative: tiang-tiang Asyera; patung-patung Asyera; Asyerim
  rationale: Kata ini merujuk pada objek kultis yang berhubungan dengan dewi Asyera, tetapi bentuk fisik setiap objek tidak selalu dapat dipastikan. Terjemahan umum disertai catatan menjaga rujukan historis tanpa kepastian berlebihan.
- issue: Cakupan לִדְרֹשׁ הָאֱלֹהִים
  choice: mencari Allah
  alternative: meminta petunjuk kepada Allah
  rationale: Dalam Tawarikh, ungkapan ini lebih luas daripada tindakan meminta petunjuk dan dapat menyatakan arah hati serta kesetiaan kepada Allah.
- issue: Makna וַהֲכִינוֹתָ לְבָבְךָ
  choice: mempersiapkan hatimu
  alternative: menetapkan hatimu; meneguhkan hatimu
  rationale: Pilihan ini dekat dengan makna leksikal dan membiarkan terbuka nuansa mempersiapkan, mengarahkan, atau menetapkan batin untuk mencari Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan kalimat mempertahankan pertentangan, alasan, dan gambaran tentang hati dalam teks Ibrani, sambil menjelaskan istilah kultis yang asing melalui catatan kaki.
