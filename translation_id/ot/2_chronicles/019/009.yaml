id: 2CH.19.9
reference: 2 Chronicles 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: id
  text: 'Ia memerintahkan mereka, “Kalian harus bertindak demikian: dengan takut akan Yahweh[a], dengan setia[b], dan dengan segenap hati[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “takut akan Yahweh” juga dapat dipahami sebagai “hormat kepada Yahweh,” tetapi mencakup pula rasa gentar dan ketundukan kepada-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan penuh integritas” atau “dengan kesetiaan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan hati yang utuh” atau “dengan hati yang tidak terbagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: Ia memerintahkan mereka
  rationale: צוה dengan על menyatakan perintah yang ditujukan kepada mereka; bentuk kutipan לֵאמֹר dapat diungkapkan secara alami dalam bahasa Indonesia dengan langsung membuka petikan.
- source_word: כֹּה תַעֲשׂוּן
  choice: Kalian harus bertindak demikian
  rationale: עשה bermakna luas, tetapi dalam konteks tugas peradilan, 'bertindak' paling sesuai; כֹּה dipertahankan sebagai 'demikian', dan bentuk imperfek di sini memiliki daya perintah.
- source_word: בְּיִרְאַת יְהוָה
  choice: dengan takut akan Yahweh
  rationale: Ungkapan ini mempertahankan bobot idiom Ibrani tentang rasa takut yang mencakup hormat dan ketundukan kepada Allah; nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: בֶּאֱמוּנָה
  choice: dengan setia
  rationale: Dalam nasihat kepada para hakim, אֱמוּנָה menunjuk pada perilaku yang dapat dipercaya dan jujur dalam menjalankan tugas, bukan terutama pada kepercayaan batin.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: dan dengan segenap hati
  rationale: לֵבָב שָׁלֵם menggambarkan hati yang utuh, tidak terbagi, dan sungguh-sungguh; 'segenap hati' mempertahankan citra hati sekaligus terdengar alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna יִרְאַת יְהוָה
  choice: takut akan Yahweh
  alternative: hormat kepada Yahweh
  rationale: '''Takut'' mempertahankan keluasan dan ketegangan ungkapan Ibrani, yang mencakup rasa gentar, hormat, dan ketundukan, tanpa mempersempitnya menjadi rasa hormat saja.'
- issue: Makna אֱמוּנָה dalam konteks peradilan
  choice: dengan setia
  alternative: dengan integritas
  rationale: Konteksnya menekankan pelaksanaan tugas secara dapat dipercaya; 'dengan setia' menjaga hubungan leksikal dengan kesetiaan tanpa memasukkan gagasan iman sebagai keyakinan batin.
- issue: Makna לֵבָב שָׁלֵם
  choice: dengan segenap hati
  alternative: dengan hati yang tidak terbagi
  rationale: Pilihan utama menjaga metafora dan dapat mencakup ketulusan serta keutuhan batin; alternatif menjelaskan salah satu nuansa tanpa menetapkannya sebagai satu-satunya arti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pronomina jamak 'kalian' dipakai untuk memperjelas bahwa perintah ditujukan kepada banyak orang. Struktur kutipan dibuat alami dengan menghilangkan padanan eksplisit לֵאמֹר yang berlebihan dalam bahasa Indonesia, sementara tiga frasa berpreposisi dipertahankan secara sejajar.
