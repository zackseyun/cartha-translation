  text: וַ֠/יָּשָׁב יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֧ה אֶל בֵּית֛/וֹ בְּ/שָׁל֖וֹם לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/001.yaml
  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: id
  text: Yosafat, raja Yehuda, kembali dengan selamat ke rumahnya di Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam damai.” Ungkapan Ibrani ini juga dapat menekankan bahwa ia pulang dengan aman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk naratif dari שׁוּב menyatakan tindakan kembali; 'kembali' merupakan padanan Indonesia yang alami dan tepat.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Frasa konstruksi ini menjelaskan jabatan Yosafat; aposisi 'Yosafat, raja Yehuda' alami dalam bahasa Indonesia.
- source_word: אֶל בֵּיתוֹ
  choice: ke istananya
  rationale: בַּיִת secara harfiah berarti 'rumah', tetapi untuk kediaman seorang raja dalam konteks ini, 'istana' menyampaikan rujukan konkret secara alami tanpa mengubah tujuan perjalanan.
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan dari peperangan, idiom בְּשָׁלוֹם terutama menyatakan kepulangan tanpa celaka. Catatan kaki mempertahankan kemungkinan terjemahan lebih harfiah 'dalam damai'.
- source_word: לִירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Walaupun לְ biasanya menandai arah, sesudah 'ke istananya' bahasa Indonesia secara alami menyatakan lokasi istana dengan 'di Yerusalem'.
