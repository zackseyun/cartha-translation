  text: וַ/יַּעֲמֵ֨ד שֹֽׁפְטִ֜ים בָּ/אָ֗רֶץ בְּ/כָל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת לְ/עִ֥יר וָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: id
  text: Ia mengangkat hakim-hakim di negeri itu,[a] di semua kota berbenteng di Yehuda, kota demi kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di seluruh negeri itu.”
    reason: Alternatif ini menampilkan kemungkinan bahwa בָּאָרֶץ memiliki nuansa cakupan distributif, bukan hanya lokasi.
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: mengangkat
  rationale: Bentuk Hifil dari עמד dalam konteks administratif ini berarti menempatkan atau menetapkan seseorang dalam jabatan; “mengangkat” alami dalam bahasa Indonesia untuk pengangkatan pejabat.
- source_word: שֹׁפְטִים
  choice: hakim-hakim
  rationale: Nomina ini menunjuk kepada para pejabat yang menjalankan fungsi peradilan.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Ungkapan ini menyatakan lokasi pengangkatan dalam wilayah Yehuda. “Negeri itu” mempertahankan arti lokatif dasarnya, sedangkan cakupan distributif dijelaskan oleh frasa-frasa berikutnya.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: di semua kota ... di Yehuda
  rationale: Terjemahan ini mempertahankan preposisi dan cakupan menyeluruh. Susunan “kota ... di Yehuda” lebih alami daripada bentuk posesif yang berpotensi terdengar seolah kota-kota itu bernama Yehuda.
- source_word: הַבְּצֻרוֹת
  choice: berbenteng
  rationale: Partisip pasif ini menggambarkan kota-kota yang diperkuat atau dipertahankan dengan benteng; “kota berbenteng” ringkas dan lazim.
- source_word: לְעִיר וָעִיר
  choice: kota demi kota
  rationale: Ungkapan distributif Ibrani ini menekankan penempatan hakim pada tiap-tiap kota; “kota demi kota” mempertahankan pengulangan dan tekanannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “Ia” mengikuti rujukan subjek dari konteks ayat sebelumnya. Tanda koma sebelum penanda catatan kaki menempatkan catatan pada frasa “di negeri itu” tanpa mengaburkan kelanjutan kalimat.
