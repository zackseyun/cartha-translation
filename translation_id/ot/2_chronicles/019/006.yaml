  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: id
  text: Ia berkata kepada para hakim, “Perhatikanlah apa yang kamu lakukan, sebab kamu mengadili bukan untuk manusia[a], melainkan untuk Yahweh. Ia bersama kamu dalam urusan pengadilan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani אָדָם berbentuk tunggal, tetapi dapat menunjuk kepada manusia secara umum.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam urusan keadilan” atau “ketika menjatuhkan putusan.” Frasa Ibrani dapat menunjuk kepada urusan hukum secara umum maupun tindakan mengadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: para hakim
  rationale: Partisipel substantival dari שׁפט menunjuk kepada para pejabat yang bertugas mengadili; ‘para hakim’ merupakan padanan Indonesia yang alami dan tepat dalam konteks ini.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: Perhatikanlah apa yang kamu lakukan
  rationale: Imperatif רְאוּ di sini menuntut perhatian dan pertimbangan serius terhadap pelaksanaan tugas mereka. ‘Perhatikanlah’ menyampaikan daya teguran itu secara lebih alami daripada terjemahan harfiah ‘lihatlah’.
- source_word: לְאָדָם
  choice: untuk manusia
  rationale: אָדָם dalam bentuk tunggal dipakai secara generik dan dikontraskan dengan Yahweh. ‘Manusia’ mempertahankan kontras antara pihak manusiawi dan ilahi tanpa membatasinya pada seorang laki-laki.
- source_word: תִּשְׁפְּטוּ
  choice: kamu mengadili
  rationale: Kata kerja שׁפט merujuk pada pelaksanaan fungsi peradilan; ‘mengadili’ ringkas, lazim, dan sesuai dengan konteks para hakim.
- source_word: לַיהוָה
  choice: untuk Yahweh
  rationale: Preposisi לְ menyatakan bahwa mereka mengadili bagi atau atas nama Yahweh, bukan semata-mata demi kepentingan manusia. Nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: וְעִמָּכֶם
  choice: Ia menyertai kamu
  rationale: Klausa nominal Ibrani menyatakan kehadiran Yahweh bersama para hakim. ‘Menyertai’ menyampaikan kehadiran yang mendampingi dalam bahasa Indonesia yang alami tanpa menambahkan cara kerja yang tidak dinyatakan teks.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: dalam perkara pengadilan
  rationale: דבר dapat berarti perkara atau urusan, sedangkan משפט mencakup pengadilan, putusan, atau keadilan. Padanan ini mempertahankan corak yudisial dan keluasan frasa sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. ‘Yahweh’ mempertahankan bentuk nama perjanjian dan membedakannya dari gelar umum.
- issue: Makna kehadiran Yahweh bersama para hakim
  choice: Ia menyertai kamu dalam perkara pengadilan
  alternative: Ia akan menyertai kamu ketika menjatuhkan putusan
  rationale: Bentuk Ibrani tidak menyatakan verba beraspek masa depan secara eksplisit. Terjemahan utama mempertahankan pernyataan kehadiran ilahi tanpa mengubahnya menjadi janji masa depan atau menjelaskan secara berlebihan bagaimana penyertaan itu bekerja.
- issue: Kontras antara אָדָם dan יהוה
  choice: bukan untuk manusia, melainkan untuk Yahweh
  alternative: bukan untuk seorang manusia, melainkan untuk Yahweh
  rationale: אָדָם di sini paling wajar dipahami secara generik. ‘Manusia’ menjaga kontras teologis antara pertanggungjawaban kepada manusia dan pelayanan peradilan bagi Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘kamu’ mengikuti sapaan jamak kepada para hakim; konteks membuat jumlah jamaknya jelas. Susunan kalimat mempertahankan teguran langsung, kontras manusia–Yahweh, dan ketegangan makna pada frasa hukum penutup.
