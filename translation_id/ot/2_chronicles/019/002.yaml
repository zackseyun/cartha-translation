reference: 2 Chronicles 19:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: id
  text: Lalu Yehu anak Hanani, sang pelihat, keluar menemui dia[a] dan berkata kepada Raja Yosafat, “Patutkah engkau menolong orang fasik dan mengasihi orang-orang yang membenci Yahweh? Karena hal ini, murka dari hadapan Yahweh[b] menimpa engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “keluar ke hadapannya.” Dalam konteks ini, ungkapan Ibrani tersebut berarti keluar untuk menemuinya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dari Yahweh.” Secara harfiah: “dari hadapan Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: keluar menemui dia
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan tindakan keluar ke hadapan seseorang, tetapi dalam konteks berarti keluar untuk menemuinya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan tindakan naratifnya.
- source_word: הַחֹזֶה
  choice: sang pelihat
  rationale: חֹזֶה adalah gelar kenabian khusus. 'Pelihat' mempertahankan perbedaan leksikalnya dari istilah umum 'nabi'.
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: Patutkah engkau menolong orang fasik
  rationale: Partikel tanya dan bentuk infinitif menyampaikan teguran retoris. 'Orang fasik' mempertahankan kategori moral dalam teks tanpa secara eksplisit menambahkan nama Ahab.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: dan mengasihi orang-orang yang membenci Yahweh
  rationale: Terjemahan ini mempertahankan daya verbal partisip שֹׂנְאֵי, yakni orang-orang yang membenci, dan tidak mereduksinya menjadi sekadar sebutan 'musuh'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: וּבָזֹאת
  choice: Karena hal ini
  rationale: Frasa ini menunjuk kembali kepada tindakan Yosafat sebagai alasan bagi murka yang dinyatakan sesudahnya.
- source_word: עָלֶיךָ קֶּצֶף
  choice: murka ... menimpa engkau
  rationale: קֶצֶף menyatakan murka ilahi, sedangkan עָלֶיךָ secara konkret menggambarkannya berada atau datang atas Yosafat. 'Menimpa engkau' menyampaikan gambaran itu secara wajar dalam bahasa Indonesia.
- source_word: מִלִּפְנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang murka yang berasal dari hadirat Yahweh, sambil tetap dapat dipahami dalam ragam bahasa Indonesia yang khidmat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan הָרָשָׁע dan שֹׂנְאֵי יְהוָה
  choice: kategori moral 'orang fasik' dan 'orang-orang yang membenci Yahweh'
  alternative: menyebut Ahab secara eksplisit atau menerjemahkan 'seorang fasik' secara sempit
  rationale: Walaupun teguran ini secara historis berkaitan dengan hubungan Yosafat dan Ahab, teks Ibrani memakai sebutan moral yang lebih luas. Terjemahan mempertahankan keluasan tersebut.
- issue: Asal murka dalam מִלִּפְנֵי יְהוָה
  choice: murka dari hadapan Yahweh
  alternative: murka dari Yahweh
  rationale: Pilihan utama mempertahankan gambaran hadirat ilahi dalam teks tanpa menjelaskan lebih jauh sifat atau pelaksanaan hukuman itu.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia: Yehu, Hanani, dan Yosafat. Teguran retoris dibuat langsung tanpa menambah penjelasan historis yang tidak terdapat dalam ayat.'
