id: 2CH.19.11
reference: 2 Chronicles 19:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: id
  text: Perhatikanlah, Amarya, imam kepala, memimpin kalian dalam setiap perkara yang berkaitan dengan Yahweh, dan Zebaja anak Ismael, pemimpin kaum Yehuda, memimpin dalam setiap perkara yang berkaitan dengan raja. Orang-orang Lewi akan bertugas sebagai petugas di hadapan kalian. Kuatkanlah hati dan bertindaklah! Kiranya Yahweh menyertai orang yang baik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kiranya Yahweh menyertai yang baik.” Ungkapan Ibraninya dapat menunjuk kepada orang yang baik atau, secara lebih umum, pihak yang baik.
    reason: ambiguity
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Perhatikanlah
  rationale: Mengungkapkan fungsi penanda wacana yang menarik perhatian tanpa memakai ungkapan Indonesia yang kaku seperti 'dan lihatlah'.
- source_word: כֹהֵן הָרֹאשׁ
  choice: Imam Kepala
  rationale: Mencerminkan arti harfiah 'imam yang menjadi kepala' dan peran pengawasannya dalam konteks administratif, tanpa langsung menetapkannya sebagai istilah jabatan teknis 'Imam Besar'.
- source_word: עֲלֵיכֶם
  choice: memimpin kalian
  rationale: Menyampaikan kewenangan atas para hakim secara alami dalam bahasa Indonesia; kopula yang tidak tertulis dalam klausa Ibrani dinyatakan sebagai verba.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: dalam setiap perkara yang berkaitan dengan Yahweh
  rationale: דָּבָר mencakup perkara atau urusan, sedangkan לְ menyatakan lingkup/acuan. Rumusan ini tidak mempersempitnya hanya menjadi perkara pengadilan.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: pemimpin kaum Yehuda
  rationale: נָגִיד berarti pemimpin atau penguasa. 'Kaum Yehuda' mengungkapkan בֵית יְהוּדָה sebagai komunitas/keluarga besar Yehuda secara wajar.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: Orang-orang Lewi akan bertugas sebagai pejabat di hadapan kalian
  rationale: שֹׁטְרִים menunjuk para pejabat atau petugas administratif. 'Di hadapan kalian' mempertahankan gambaran bahwa mereka hadir untuk melayani dan membantu para hakim.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: Kuatkanlah hati dan bertindaklah
  rationale: Seruan ini mendorong keberanian dan pelaksanaan nyata atas tugas yang telah diberikan.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: Kiranya Yahweh menyertai orang yang baik
  rationale: Bentuk וִיהִי dipahami sebagai harapan atau berkat. הַטּוֹב dapat menunjuk orang yang baik, tetapi keluasannya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
theological_decisions:
- issue: Cara menerjemahkan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Apakah כֹהֵן הָרֹאשׁ merupakan gelar teknis Imam Besar
  choice: Imam Kepala
  alternative: Imam Besar
  rationale: Ungkapan Ibrani secara harfiah berarti imam kepala/utama. Konteks menekankan kewenangan administratif, sehingga terjemahan utama tidak memaksakan pengertian jabatan teknis, sementara kemungkinan itu tetap dicatat.
- issue: Acuan הַטּוֹב pada penutup ayat
  choice: orang yang baik
  alternative: yang baik / kebaikan
  rationale: Bentuk bersandang ini dapat dipahami secara substantival sebagai orang atau pihak yang baik, tetapi bahasa Ibraninya ringkas dan memungkinkan cakupan yang lebih umum; ambiguitas tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak ''kalian'' dipakai karena sapaan Ibraninya jamak. Nama Ibrani disesuaikan dengan bentuk Indonesia yang lazim: Amarya, Zebaja, dan Ismael. Paralel antara perkara Yahweh dan perkara raja dipertahankan.'
