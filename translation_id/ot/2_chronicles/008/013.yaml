  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: id
  text: 'sesuai dengan ketentuan setiap hari untuk mempersembahkan kurban, sesuai dengan perintah Musa, pada hari-hari Sabat, pada bulan-bulan baru, dan pada hari-hari raya yang ditetapkan, tiga kali setahun: pada Hari Raya Roti Tidak Beragi, Hari Raya Pekan-Pekan[b], dan Hari Raya Pondok-Pondok[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Secara harfiah: “Hari Raya Pekan-Pekan”; dalam pemakaian Yunani kemudian disebut “Pentakosta”.'
    reason: lexical_alternative_cross_reference
  - marker: c
    text: Atau “Hari Raya Tabernakel”; secara harfiah, “Hari Raya Pondok-Pondok”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: sesuai dengan ketentuan untuk setiap hari
  rationale: Ungkapan harfiahnya, 'menurut perkara suatu hari pada harinya', menunjuk pada ketentuan ibadah yang berlaku hari demi hari. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa aturan harian.
- source_word: לְהַעֲלוֹת
  choice: untuk mempersembahkan kurban
  rationale: Dalam konteks ibadah, bentuk Hifil dari עלה berarti mempersembahkan kurban. Kata 'kurban' membuat konteks ritual jelas tanpa membatasi maknanya hanya pada satu jenis persembahan.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: sebagaimana diperintahkan Musa
  rationale: Terjemahan ini secara wajar menyatakan bahwa ketentuan tersebut berasal dari perintah yang disampaikan melalui Musa.
- source_word: לַשַּׁבָּתוֹת
  choice: pada hari-hari Sabat
  rationale: Preposisi menandai waktu pelaksanaan persembahan. Bentuk jamak Ibrani dipertahankan dengan 'hari-hari Sabat'.
- source_word: וְלֶחֳדָשִׁים
  choice: perayaan-perayaan bulan baru
  rationale: Dalam kalender ibadah Israel, חֳדָשִׁים di sini menunjuk pada peringatan bulan baru, bukan sekadar bulan-bulan kalender.
- source_word: וְלַמּוֹעֲדוֹת
  choice: hari-hari raya yang ditetapkan
  rationale: מוֹעֲדִים berarti waktu-waktu yang ditentukan; dalam konteks ini, tiga perayaan berikutnya menunjukkan sifatnya sebagai hari raya.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: tiga kali setahun
  rationale: Padanan Indonesia yang ringkas dan tepat bagi keterangan frekuensi Ibrani.
- source_word: בְּחַג הַמַּצּוֹת
  choice: pada Hari Raya Roti Tidak Beragi
  rationale: Nama ini menerjemahkan unsur-unsur Ibraninya secara langsung dan merupakan istilah Indonesia yang jelas.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: Hari Raya Tujuh Minggu
  rationale: שָׁבֻעוֹת berarti 'minggu-minggu'. Penambahan 'Tujuh' membuat nama perayaan ini lebih transparan bagi pembaca Indonesia berdasarkan penghitungan tujuh minggu dalam Taurat, sementara catatan kaki memberikan nama yang lebih harfiah dan sebutan Yunani kemudian.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: Hari Raya Pondok Daun
  rationale: סֻכּוֹת adalah pondok-pondok atau tempat bernaung sementara. 'Pondok Daun' merupakan sebutan Indonesia yang konkret dan mudah dipahami.
theological_decisions:
- issue: Penamaan ketiga perayaan ziarah Israel
  choice: Hari Raya Roti Tidak Beragi / Hari Raya Tujuh Minggu / Hari Raya Pondok Daun
  alternative: masa Paskah / Pentakosta / Hari Raya Tabernakel
  rationale: Teks Ibrani menyebut ketiga perayaan itu dengan nama deskriptifnya sendiri. Terjemahan utama mempertahankan bentuk Perjanjian Lama dan tidak menggantikannya dengan sebutan Yunani yang kemudian atau istilah gerejawi.
- issue: Cakupan לְהַעֲלוֹת dalam konteks persembahan
  choice: mempersembahkan kurban
  alternative: mempersembahkan kurban bakaran
  rationale: Konteks dekat ayat sebelumnya membicarakan kurban bakaran, tetapi verba ini sendiri dapat digunakan dalam arti ritual yang lebih luas. Terjemahan tidak mempersempitnya secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar dipertahankan, tetapi tanda baca dan penghubung disesuaikan agar ayat yang merupakan kelanjutan kalimat sebelumnya tetap mudah dibaca. Istilah kalender ibadah dibuat transparan bagi pembaca umum.
