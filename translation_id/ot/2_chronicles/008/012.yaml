  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: id
  text: Kemudian Salomo mempersembahkan kurban-kurban bakaran kepada Yahweh di atas mezbah Yahweh yang telah dibangunnya di depan serambi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “balai depan” atau “beranda”. Kata Ibrani ini menunjuk pada ruang masuk Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu ini melanjutkan urutan tindakan dalam narasi; “Kemudian” alami dalam bahasa Indonesia modern.
- source_word: הֶעֱלָה
  choice: mempersembahkan
  rationale: Bentuk Hifil dari עלה dengan objek kurban merupakan ungkapan kultis yang berarti mempersembahkan kurban di atas mezbah.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang sudah mapan dalam bahasa Indonesia.
- source_word: עֹלוֹת
  choice: kurban-kurban bakaran
  rationale: Menunjukkan bentuk jamak dan jenis kurban yang dibakar seluruhnya di atas mezbah.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau peruntukan persembahan, sedangkan nama ilahi יהוה dipertahankan sebagai “Yahweh”.
- source_word: עַל מִזְבַּח יְהוָה
  choice: di atas mezbah Yahweh
  rationale: Menyatakan lokasi persembahan secara langsung dan mempertahankan hubungan konstruksi “mezbah Yahweh”.
- source_word: אֲשֶׁר בָּנָה
  choice: yang telah dibangunnya
  rationale: Klausa relatif merujuk kepada mezbah; “telah” memperjelas bahwa pembangunannya mendahului tindakan mempersembahkan.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Padanan lokatif yang jelas dan alami untuk posisi mezbah terhadap serambi.
- source_word: הָאוּלָם
  choice: serambi
  rationale: אוּלָם menunjuk pada ruang atau balai masuk di bagian depan Bait Allah; “serambi” ringkas dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה; “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah kultis “kurban bakaran” dan “mezbah” dipertahankan karena tepat dalam konteks ibadah, sedangkan “serambi” diberi catatan untuk menjelaskan arti arsitekturalnya.
