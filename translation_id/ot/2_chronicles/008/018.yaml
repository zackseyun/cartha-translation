base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: id
  text: Dengan perantaraan para pegawainya, Huram mengirim kepada Salomo kapal-kapal dan para pegawai yang berpengalaman di laut.[a] Mereka tiba di Ofir bersama para pegawai Salomo, lalu mengambil dari sana empat ratus lima puluh talenta[b] emas dan membawanya kepada Raja Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para pegawai yang mengenal laut”; maksudnya, orang-orang yang cakap atau berpengalaman dalam pelayaran.
    reason: lexical_alternative
  - marker: b
    text: Talenta adalah satuan berat kuno; nilainya tidak seragam menurut tempat dan zaman.
    reason: historical_measure
lexical_decisions:
- source_word: וַיִּשְׁלַח לוֹ חוּרָם
  choice: Huram mengirim kepada Salomo
  rationale: Kata kerja שׁלח berarti ‘mengirim’. Pronomina ‘kepadanya’ diperjelas sebagai ‘kepada Salomo’ berdasarkan konteks langsung agar rujukannya jelas dalam bahasa Indonesia.
- source_word: בְּיַד עֲבָדָיו
  choice: Dengan perantaraan para pegawainya
  rationale: Ungkapan harfiah ‘melalui tangan para pegawainya’ menyatakan perantaraan atau pelaksana. Bentuk ini mempertahankan makna tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: אֳנִיּוֹת
  choice: kapal-kapal
  rationale: Bentuk jamak ini menunjuk pada kapal yang digunakan dalam pelayaran laut menuju Ofir.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: para pegawai yang berpengalaman di laut
  rationale: Secara harfiah, ‘para hamba/pegawai yang mengenal laut’. Pilihan ini mempertahankan kedudukan mereka sebagai bawahan sekaligus menyampaikan kecakapan maritim mereka secara alami.
- source_word: וַיָּבֹאוּ ... אוֹפִירָה
  choice: Mereka tiba di Ofir
  rationale: Kata בוא menyatakan kedatangan, sedangkan akhiran arah pada אוֹפִירָה menunjukkan gerak menuju Ofir. ‘Tiba di Ofir’ menyampaikan keduanya dengan wajar.
- source_word: עִם עַבְדֵי שְׁלֹמֹה
  choice: bersama para pegawai Salomo
  rationale: Menerjemahkan hubungan konstruksi secara langsung dan wajar dalam bahasa Indonesia.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: lalu mengambil dari sana
  rationale: לקח lazim berarti ‘mengambil’; terjemahan ini tidak menentukan lebih jauh cara emas itu diperoleh.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: empat ratus lima puluh talenta emas
  rationale: Satuan kuno כִּכָּר dipertahankan sebagai ‘talenta’ agar kekhususan historis teks tidak diganti dengan perkiraan modern yang tidak pasti.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: dan membawanya kepada Raja Salomo
  rationale: Akhiran ‘-nya’ merujuk secara kolektif kepada emas yang baru disebut; ini alami karena ‘emas’ merupakan nomina massa dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Pegawai’ dipilih untuk עבד dalam konteks pelayanan kerajaan, sedangkan ‘dengan perantaraan’ mengungkapkan idiom agensi Ibrani secara alami. Nama חוּרָם ditulis ‘Huram’ mengikuti bentuk teks Ibrani, dan אוֹפִיר ditulis ‘Ofir’ menurut ejaan Indonesia.
