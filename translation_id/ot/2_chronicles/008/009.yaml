  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: id
  text: Namun, dari antara orang Israel[a], Salomo tidak menjadikan seorang pun budak untuk pekerjaannya[b], sebab mereka adalah prajurit, para perwira Salomo[c], para komandan pasukan keretanya, dan para penunggang kudanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel,” yaitu orang-orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebagai budak untuk melakukan pekerjaannya.” Ungkapan Ibrani ini mengacu pada penempatan orang sebagai budak untuk pekerjaan.'
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani yang diterjemahkan “perwira” mungkin menunjuk kepada pejabat militer elite atau ajudan; arti tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Namun, ... dari antara
  rationale: Gabungan kata sambung dan preposisi menyatakan kontras dengan ayat sebelumnya. Susunan ini menyampaikan makna ‘tetapi dari antara’ secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk kepada bangsa Israel. ‘Orang Israel’ alami dan jelas bagi pembaca modern, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לֹא נָתַן ... לַעֲבָדִים
  choice: tidak menjadikan seorang pun ... sebagai budak
  rationale: Konstruksi Ibrani berarti menempatkan orang dalam status budak atau kerja paksa. ‘Budak’ mempertahankan kekuatan istilah עֲבָדִים dan tidak memperhalusnya menjadi sekadar pelayan.
- source_word: לִמְלַאכְתּוֹ
  choice: untuk pekerjaannya
  rationale: מְלָאכָה di sini merujuk pada pekerjaan atau tenaga kerja yang diperlukan bagi proyek-proyek Salomo.
- source_word: כִּי הֵמָּה
  choice: sebab mereka adalah
  rationale: Frasa ini memperkenalkan alasan orang Israel tidak dijadikan budak untuk pekerjaan Salomo.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: prajurit
  rationale: Pilihan ini menyampaikan idiom harfiah ‘orang-orang perang’ dengan bahasa Indonesia modern dan wajar.
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: perwira-perwiranya
  rationale: שָׁלִישׁ adalah istilah militer-administratif yang sulit dan mungkin menunjuk kepada perwira elite atau ajudan. ‘Perwira’ mempertahankan cakupan umum tanpa ketepatan semu.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: para panglima pasukan keretanya
  rationale: Frasa ini menunjuk kepada para pejabat yang mengepalai korps kereta perang; penambahan ‘pasukan’ memperjelas bahwa yang dimaksud adalah kesatuan militer.
- source_word: וּפָרָשָׁיו
  choice: dan para penunggang kudanya
  rationale: פָרָשִׁים menunjuk kepada pasukan berkuda atau para penunggang kuda; terjemahan ini jelas tanpa memaksakan istilah militer yang lebih teknis.
