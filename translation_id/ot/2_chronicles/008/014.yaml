  to: Sesuai dengan ketetapan Daud, ayahnya[a], ia menetapkan kelompok-kelompok para imam untuk tugas pelayanan mereka, orang-orang Lewi untuk tugas-tugas mereka, untuk memuji dan melayani di hadapan para imam sesuai dengan keperluan setiap hari[b], serta para penjaga pintu menurut kelompok mereka untuk tiap-tiap pintu; sebab demikianlah perintah Daud, abdi Allah itu.
