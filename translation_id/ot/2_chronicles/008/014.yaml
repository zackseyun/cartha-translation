reference: 2 Chronicles 8:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: id
  text: Sesuai dengan ketetapan Daud, ayahnya[a], ia menetapkan kelompok-kelompok para imam untuk tugas pelayanan mereka, orang-orang Lewi untuk tugas-tugas mereka, untuk memuji dan melayani di hadapan para imam sesuai dengan keperluan setiap hari[b], serta para penjaga pintu menurut kelompok mereka untuk tiap-tiap pintu; sebab demikianlah perintah Daud, abdi Allah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “ayah” juga dapat dipakai untuk seorang leluhur atau pendahulu dalam garis keturunan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut urusan suatu hari pada harinya,” yakni menurut ketentuan yang berlaku untuk masing-masing hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: ia menetapkan
  rationale: Bentuk kausatif verba ini berarti menempatkan atau menetapkan orang dalam peran tertentu; 'menetapkan' paling sesuai dengan konteks pengaturan petugas Bait Allah.
- source_word: כְּמִשְׁפַּט
  choice: sesuai dengan ketetapan
  rationale: מִשְׁפָּט di sini menunjuk pada aturan atau susunan yang telah ditetapkan, bukan putusan pengadilan.
- source_word: דָּוִיד אָבִיו
  choice: Daud, ayahnya
  rationale: Terjemahan ini mempertahankan arti langsung ungkapan Ibrani dan tepat dalam konteks Salomo sebagai anak Daud, sambil mencatat jangkauan makna istilah kekerabatan itu.
- source_word: מַחְלְקוֹת
  choice: kelompok-kelompok
  rationale: Istilah ini menunjuk pada satuan petugas yang tersusun menurut pembagian; 'kelompok-kelompok' jelas bagi pembaca modern.
- source_word: עַל עֲבֹדָתָם
  choice: untuk tugas pelayanan mereka
  rationale: Ungkapan ini menunjuk pada bidang pelayanan yang ditugaskan kepada para imam.
- source_word: מִשְׁמְרוֹתָם
  choice: tanggung jawab mereka
  rationale: Kata ini dapat berarti penjagaan, kewajiban, atau tugas yang dipercayakan; konteks berikutnya menjelaskan tanggung jawab orang Lewi.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: untuk memuji dan melayani
  rationale: 'Terjemahan ini mempertahankan dua fungsi yang berbeda: menaikkan pujian dan menjalankan pelayanan suci.'
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: di hadapan para imam
  rationale: נֶגֶד berarti di depan atau di hadapan; terjemahan ini mempertahankan hubungan ruang dan pelayanan tanpa menambahkan penafsiran hierarkis.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: sesuai dengan keperluan setiap hari
  rationale: Ungkapan distributif ini berarti bahwa pelayanan dilaksanakan menurut ketentuan atau kebutuhan yang berlaku pada masing-masing hari.
- source_word: הַשּׁוֹעֲרִים
  choice: para penjaga pintu
  rationale: Istilah ini menunjuk pada petugas yang menjaga dan melayani di pintu-pintu Bait Allah.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: pada tiap-tiap pintu
  rationale: Bentuk pengulangan ini bersifat distributif dan berarti bahwa petugas ditetapkan untuk setiap pintu.
- source_word: מִצְוַת
  choice: perintah
  rationale: Kata ini menyatakan instruksi yang berwenang; 'perintah' alami dalam bahasa Indonesia modern dan mempertahankan kekuatan maknanya.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah sebutan bagi orang yang menjadi pelayan atau utusan Allah; 'abdi Allah' merupakan padanan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Bahasa hubungan Daud dengan Salomo
  choice: Mempertahankan 'ayahnya' dalam teks utama.
  alternative: leluhurnya
  rationale: Dalam konteks ini Daud memang ayah Salomo, sehingga arti langsung אָבִיו tidak menimbulkan kekeliruan. Catatan kaki tetap menyebutkan bahwa istilah Ibrani dapat memiliki cakupan genealogis yang lebih luas.
- issue: Hubungan pelayanan orang Lewi dengan para imam
  choice: Menerjemahkan נֶגֶד secara netral sebagai 'di hadapan para imam'.
  alternative: mendampingi para imam
  rationale: Teks menyatakan orientasi atau kedudukan pelayanan mereka, tetapi tidak secara eksplisit menentukan nuansa kerja sama atau hierarki; terjemahan netral mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat panjang sumber dipecah menjadi dua kalimat agar mudah dipahami tanpa menghilangkan hubungan antarbagiannya. Istilah pelayanan Bait Allah dibuat jelas bagi pembaca umum tanpa memakai kosakata denominasi tertentu.
