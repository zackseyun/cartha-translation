id: 2CH.8.8
reference: 2 Chronicles 8:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִן בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נוֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֥ר לֹֽא כִלּ֖וּ/ם בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַ֔ס עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: id
  text: Dari keturunan mereka yang masih tersisa sesudah mereka di negeri itu—orang-orang yang tidak dimusnahkan oleh orang Israel[a]—Salomo mengerahkan mereka untuk kerja paksa[b] sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “anak-anak Israel,” yaitu sebutan kebangsaan bagi orang Israel. Terjemahan lain: “yang tidak ditumpas oleh orang Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk kewajiban kerja.” Istilah Ibrani ini menunjuk kepada kerja wajib yang dikenakan oleh negara.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: Dari keturunan mereka
  rationale: בְּנֵי secara harfiah berarti “anak-anak lelaki dari,” tetapi dalam konteks kebangsaan dan silsilah menunjuk kepada keturunan secara umum. “Keturunan” tepat dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: yang masih tersisa sesudah mereka
  rationale: נוֹתְרוּ menyatakan keadaan tetap tersisa, sedangkan אַחֲרֵיהֶם mempertahankan hubungan waktu dengan generasi sebelumnya.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Kata sandang pada bahasa Ibrani menunjuk kepada negeri yang telah diketahui dari konteks, yakni wilayah bangsa-bangsa yang disebut pada ayat sebelumnya.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: orang-orang yang tidak dimusnahkan oleh orang Israel
  rationale: Bentuk Piel dari כלה dalam konteks penaklukan berarti menghabisi atau memusnahkan. “Orang Israel” merupakan sebutan kebangsaan yang alami untuk ungkapan harfiah “anak-anak Israel.”
- source_word: וַיַּעֲלֵם
  choice: Salomo mengerahkan mereka
  rationale: Bersama לְמַס, bentuk kausatif ini mengungkapkan tindakan administratif untuk mengenakan kewajiban kerja, bukan sekadar membawa mereka naik.
- source_word: לְמַס
  choice: untuk kerja paksa
  rationale: מַס menunjuk kepada kewajiban kerja yang dikenakan oleh negara. “Kerja paksa” jelas bagi pembaca modern tanpa memakai istilah teknis.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan Ibrani baku ini menyatakan bahwa keadaan tersebut berlanjut hingga masa penulis.
