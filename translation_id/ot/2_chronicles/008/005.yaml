  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: id
  text: Ia membangun Bet-Horon Atas dan Bet-Horon Bawah sebagai kota-kota berbenteng, dengan tembok, pintu-pintu[a], dan palang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kemungkinan besar yang dimaksud adalah pintu-pintu gerbang kota.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: selak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Verba בנה secara langsung menyatakan tindakan membangun. Konteks memungkinkan perbaikan atau pembangunan kembali, tetapi makna itu tidak harus dimasukkan ke dalam terjemahan.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: Bet-Horon Atas
  rationale: Nama tempat ditransliterasikan, sedangkan הָעֶלְיוֹן diterjemahkan secara alami sebagai 'Atas' untuk membedakannya berdasarkan letak ketinggian.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Bet-Horon Bawah
  rationale: Sejajar dengan nama sebelumnya; הַתַּחְתּוֹן diterjemahkan 'Bawah' sesuai dengan pasangan geografis kedua kota itu.
- source_word: עָרֵי מָצוֹר
  choice: kota-kota berbenteng
  rationale: Frasa konstruksi ini menunjuk kepada kota-kota yang diperkuat untuk pertahanan. Ungkapan 'kota-kota berbenteng' jelas dan alami dalam bahasa Indonesia modern.
- source_word: חוֹמוֹת
  choice: dengan tembok
  rationale: Kata ini menjadi bagian dari uraian tentang perlengkapan pertahanan kedua kota. 'Dengan tembok' menyampaikan hubungan deskriptif itu secara ringkas.
- source_word: דְּלָתַיִם
  choice: daun-daun pintu
  rationale: Bentuk dual/plural ini secara harfiah merujuk pada pintu-pintu atau daun-daun pintu, bukan kata Ibrani yang lazim untuk gerbang kota. Dalam konteks ini kemungkinan yang dimaksud ialah daun pintu pada gerbang kota.
- source_word: וּבְרִיחַ
  choice: dan palang-palang
  rationale: בְּרִיחַ menunjuk pada palang atau selak untuk mengunci pintu. 'Palang-palang' cocok dengan perlengkapan pertahanan kota dan berpasangan alami dengan daun pintu.
