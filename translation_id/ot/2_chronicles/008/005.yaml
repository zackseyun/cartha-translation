  - severity: low
    issue: '"Palang-palang" untuk וּבְרִיחַ'
    rationale: Nomina Ibrani berbentuk tunggal. Walaupun dapat bersifat kolektif dalam daftar perlengkapan kota, bentuk tunggal "palang" lebih dekat dengan sumber dan tetap alami dalam bahasa Indonesia.
