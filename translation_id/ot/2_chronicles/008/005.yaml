  naturalness: Kalimatnya umumnya alami, tetapi "sebagai kota-kota berbenteng" lebih langsung dan idiomatis daripada "menjadi kota-kota berbenteng." "Pintu-pintu" lebih natural serta cukup tepat daripada "daun-daun pintu" dalam teks utama.
  terminology: Nama tempat dan istilah "kota-kota berbenteng" sudah baik. "Palang" dengan catatan alternatif "selak" mempertahankan rentang makna בְרִיחַ. Catatan untuk "pintu-pintu" menjelaskan konteks gerbang tanpa menggantikan istilah sumber dalam terjemahan utama.
