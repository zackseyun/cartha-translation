translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan 'menjadi kota-kota berbenteng' memperjelas bahwa Salomo memperkuat dua kota yang disebut, tanpa memaksakan arti 'membangun kembali'. Istilah teknis pertahanan dipertahankan dengan ungkapan yang mudah dipahami.
