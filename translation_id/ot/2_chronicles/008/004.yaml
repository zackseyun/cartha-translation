source:
  edition: WLC
  text: וַ/יִּ֥בֶן אֶת תַּדְמֹ֖ר בַּ/מִּדְבָּ֑ר וְ/אֵת֙ כָּל עָרֵ֣י הַֽ/מִּסְכְּנ֔וֹת אֲשֶׁ֥ר בָּנָ֖ה בַּ/חֲמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/004.yaml
  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: id
  text: Ia membangun Tadmor di padang gurun[a], serta semua kota perbekalan yang dibangunnya di Hamat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tadmor secara tradisional diidentifikasi sebagai Palmyra.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol dari בנה menyatakan tindakan lampau dalam rangkaian narasi. Dalam bahasa Indonesia, urutan narasi sudah cukup menyampaikan nuansa penghubung tanpa harus menambahkan 'kemudian'.
- source_word: תַּדְמֹר
  choice: Tadmor
  rationale: Nama tempat ini ditransliterasikan dari teks Ibrani; bentuk Yunani/Latin yang lebih kemudian, Palmyra, tidak menggantikan nama dalam teks utama.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada wilayah liar, gersang, atau gurun. 'Padang gurun' merupakan ungkapan Indonesia yang alami dan cukup luas untuk konteks geografis ini.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: semua kota perbekalan
  rationale: Frasa ini menunjuk pada kota-kota yang berfungsi menyimpan persediaan. 'Kota perbekalan' jelas dan alami, serta mencakup fungsi penyimpanan dan penyediaan tanpa membatasinya pada harta.
- source_word: אֲשֶׁר בָּנָה
  choice: yang dibangunnya
  rationale: Klausa relatif ini menerangkan kota-kota perbekalan. Bentuk 'dibangunnya' alami dalam bahasa Indonesia dan tetap menyatakan bahwa Salomo adalah pelakunya.
- source_word: בַּחֲמָת
  choice: di Hamat
  rationale: Preposisi ב diterjemahkan secara langsung sebagai 'di'. Rumusan ini mempertahankan keterbukaan apakah yang dimaksud kota Hamat atau wilayah kekuasaannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Ia' mengikuti rujukan naratif kepada Salomo, sedangkan susunan kalimat dibuat ringkas dan mudah dipahami.
