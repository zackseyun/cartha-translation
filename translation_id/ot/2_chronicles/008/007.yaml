base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: id
  text: Adapun semua orang yang tersisa dari orang Het, orang Amori, orang Feris, orang Hewi, dan orang Yebus, yang bukan berasal dari Israel—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang bukan orang Israel.” Secara lebih harfiah, bahasa Ibrani berbunyi, “yang bukan dari Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Ungkapan ini menunjuk secara kolektif kepada keseluruhan penduduk non-Israel yang sedang dibicarakan. 'Seluruh rakyat' alami dalam bahasa Indonesia dan sesuai dengan konteks administratif kerajaan.
- source_word: הַנּוֹתָר
  choice: yang masih tersisa
  rationale: Partisipel Nifal ini menyatakan orang-orang yang tertinggal atau tetap ada; 'masih tersisa' menyampaikan keadaan yang berlanjut dalam konteks sejarah.
- source_word: מִן
  choice: dari antara
  rationale: Preposisi ini menandai asal atau kelompok sumber. Dalam daftar kelompok bangsa, 'dari antara' lebih alami daripada sekadar 'dari' dan tetap mempertahankan relasi sumber.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: orang Het, orang Amori, orang Feris, orang Hewi, dan orang Yebus
  rationale: Bentuk tunggal Ibrani dipakai secara kolektif untuk masing-masing kelompok bangsa. Nama-nama ini mengikuti bentuk Indonesia yang lazim dalam tradisi penerjemahan Alkitab.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: yang bukan berasal dari Israel
  rationale: '''Bukan berasal dari Israel'' mempertahankan unsur preposisional מִן dan identifikasi asal, tanpa mempersempitnya secara eksplisit menjadi label etnis.'
