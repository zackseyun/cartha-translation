  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: id
  text: Salomo membawa putri Firaun naik dari Kota Daud ke rumah yang telah dibangunnya untuk putri Firaun itu, sebab ia berkata, “Istriku tidak akan tinggal di istana Daud, raja Israel, karena tempat-tempat[a] yang telah didatangi Tabut Yahweh itu kudus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian akhir ayat berbunyi, “sebab kuduslah mereka, yang kepada mereka Tabut Yahweh telah datang.” Kata ganti jamak “mereka” tampaknya menunjuk kepada tempat-tempat yang pernah didatangi Tabut Yahweh.
    reason: Menjelaskan acuan jamak yang tersirat dalam teks Ibrani.
lexical_decisions:
- source_word: הֶעֱלָה
  choice: membawa ... naik
  rationale: Bentuk Hifil dari עלה menyatakan membawa naik; unsur arah dipertahankan karena perpindahan berlangsung dari Kota Daud.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: ke rumah yang telah dibangunnya bagi perempuan itu
  rationale: בַּיִת pada penyebutan pertama diterjemahkan secara langsung sebagai 'rumah'; bentuk 'telah dibangunnya' memperjelas bahwa pembangunan mendahului perpindahan.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: Istriku tidak boleh tinggal
  rationale: אִשָּׁה לִי dalam konteks ini berarti istri Salomo, yaitu putri Firaun; 'tidak boleh tinggal' mengungkapkan larangan atau ketetapan dalam bentuk imperfek secara wajar.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: di istana Daud, raja Israel
  rationale: Dalam konteks kediaman kerajaan, בֵּית paling alami berarti 'istana'; aposisi 'raja Israel' dipertahankan.
- source_word: קֹדֶשׁ הֵמָּה
  choice: tempat-tempat ... itu kudus
  rationale: Bentuk jamak הֵמָּה menuntut acuan jamak yang tersirat; 'tempat-tempat' dinyatakan agar tata bahasa dan maksud dapat dipahami dalam bahasa Indonesia.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: yang pernah dimasuki Tabut Yahweh
  rationale: Ungkapan ini menyatakan tempat-tempat yang didatangi tabut; 'pernah dimasuki' alami dalam bahasa Indonesia dan tidak mengharuskan tabut masih berada di sana.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Acuan jamak dalam alasan mengenai kekudusan
  choice: Acuan jamak yang tersirat dijelaskan sebagai 'tempat-tempat' yang pernah dimasuki Tabut Yahweh.
  alternative: Menerjemahkan secara lebih harfiah, 'karena kuduslah semuanya yang telah dimasuki Tabut Yahweh,' tanpa menyebut acuannya.
  rationale: Teks Ibrani memakai pronomina jamak הֵמָּה dan אֲלֵיהֶם tanpa nomina jamak yang dinyatakan. Penambahan 'tempat-tempat' menjernihkan elipsis tanpa menentukan lebih jauh bagian-bagian mana yang dimaksud.
- issue: Arti אִשָּׁה dalam ucapan Salomo
  choice: istri
  alternative: perempuan
  rationale: Konteks langsung menunjuk kepada putri Firaun sebagai istri Salomo, bukan kepada perempuan secara umum.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. 'Kota Daud' memakai kapital sebagai nama tempat; 'Tabut Yahweh' mempertahankan nama ilahi. 'Istana' dipakai untuk kediaman kerajaan Daud, sedangkan 'rumah' dipertahankan pada kediaman yang dibangun bagi putri Firaun agar variasi kontekstual בַּיִת tetap alami.
