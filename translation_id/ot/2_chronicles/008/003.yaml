  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
translation:
  language: id
  text: Kemudian Salomo pergi ke Hamat-Zoba dan mengalahkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkuasa atasnya” atau “menguasainya.” Secara harfiah, ungkapan Ibrani ini berarti “menjadi kuat atasnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi ke
  rationale: Bentuk naratif dari הלך pada dasarnya berarti ‘pergi’. Konteksnya memang kampanye militer, tetapi unsur permusuhan tidak dinyatakan oleh verba ini sendiri, sehingga ‘pergi ke’ mempertahankan pembagian makna dalam teks sumber.
- source_word: חֲמָת צוֹבָה
  choice: Hamat-Zoba
  rationale: Kedua nama tempat ini diperlakukan sebagai satu nama geografis majemuk. Tanda hubung menghasilkan bentuk yang ringkas dan wajar dalam bahasa Indonesia tanpa memaksakan hubungan ‘Hamat di Zoba’ yang tidak dinyatakan secara eksplisit.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: menaklukkannya
  rationale: Idiom חזק על secara harfiah menggambarkan menjadi kuat atas suatu pihak dan dalam konteks kampanye kerajaan menyatakan kemenangan atau penguasaan. ‘Menaklukkannya’ menyampaikan hasil militer-politik secara alami, sedangkan catatan kaki mempertahankan gambaran harfiahnya dan alternatif yang lebih dekat bentuknya.
