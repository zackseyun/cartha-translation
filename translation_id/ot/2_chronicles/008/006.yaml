base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: id
  text: juga Baalat, semua kota perbekalan[a] milik Salomo, semua kota kereta, semua kota bagi para penunggang kuda[b], serta segala sesuatu yang Salomo ingin bangun[c] di Yerusalem, di Lebanon, dan di seluruh wilayah kekuasaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kota penyimpanan,” “kota persediaan,” atau mungkin “kota perbendaharaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kota-kota bagi kuda”; kata Ibrani ini lebih lazim merujuk pada para penunggang kuda atau pasukan berkuda.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “segala hasrat Salomo yang ia hasrati untuk dibangun”; bahasa Ibrani memakai kata benda dan kata kerja serumpun untuk menekankan hasrat atau kesenangan Salomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: Baalat
  rationale: Nama tempat ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: kota perbekalan
  rationale: Ungkapan ini menunjuk pada kota-kota tempat menyimpan persediaan atau perlengkapan; pilihan ini jelas dan tidak mempersempit maknanya menjadi tempat penyimpanan harta.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: milik Salomo
  rationale: Menyampaikan hubungan kepemilikan secara ringkas dan alami.
- source_word: עָרֵי הָרֶכֶב
  choice: kota kereta
  rationale: Merujuk pada kota-kota yang berkaitan dengan kereta, kemungkinan sebagai pangkalan atau pusat penunjangnya, tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: kota-kota bagi para penunggang kuda
  rationale: פָּרָשִׁים biasanya berarti para penunggang kuda atau pasukan berkuda; frasa ini mempertahankan pembedaan dari kota kereta.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: segala sesuatu yang ingin dibangun Salomo
  rationale: Mengungkapkan maksud konstruksi nomina-verba serumpun dalam bahasa Indonesia yang alami, sementara penekanannya dicatat dalam catatan kaki.
- source_word: לִבְנוֹת
  choice: dibangun
  rationale: Infinitif berarti membangun; konteks langsung tidak menuntut arti membangun kembali.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Menggunakan bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: וּבַלְּבָנוֹן
  choice: di Lebanon
  rationale: Menggunakan bentuk geografis yang baku dalam bahasa Indonesia.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: di seluruh wilayah kekuasaannya
  rationale: Mempertahankan unsur teritorial dan pemerintahan dari ungkapan Ibrani dalam susunan yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari konteks sebelumnya melalui kata “juga”. Pengulangan konjungsi Ibrani diringkas secukupnya agar alami, tanpa menghilangkan susunan daftar.
