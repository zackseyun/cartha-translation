base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: id
  text: Demikianlah seluruh pekerjaan Salomo dipersiapkan[a] sejak hari dasar rumah Yahweh diletakkan sampai rumah itu selesai.[b] Maka rumah Yahweh pun selesai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ditetapkan,” “ditata,” atau “ditegakkan.” Kata kerja Ibraninya dapat menyatakan sesuatu yang dibuat siap, ditegakkan, atau diatur dengan kokoh.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “sejak hari dasar rumah Yahweh diletakkan sampai penyelesaiannya.” Sufiks Ibraninya juga dapat dipahami mengacu pada penyelesaian pekerjaan tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: terlaksana dengan tertib
  rationale: Bentuk Nifal dari כון menyatakan bahwa pekerjaan itu dibuat siap, ditata, atau ditegakkan dengan baik. Ungkapan ini mempertahankan nuansa pasif-resultatif sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: seluruh pekerjaan Salomo
  rationale: מְלָאכָה mencakup pekerjaan atau usaha besar Salomo dalam konteks pembangunan rumah Yahweh.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: sejak hari peletakan dasar rumah Yahweh sampai rumah itu selesai
  rationale: Susunan temporal Ibrani menunjuk rentang dari peletakan dasar hingga penyelesaian. Bahasa Indonesia memakai pasangan 'sejak ... sampai ...' agar hubungan waktunya jelas.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan harfiah 'rumah' dipertahankan, sedangkan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: שָׁלֵם בֵּית יְהוָה
  choice: lengkaplah rumah Yahweh
  rationale: שָׁלֵם menyatakan keadaan utuh atau lengkap setelah pekerjaan berakhir. 'Lengkaplah' membedakannya dari kata 'selesai' pada klausa sebelumnya dan mempertahankan tekanan hasil akhir.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה; transliterasi 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Acuan sufiks dalam כְּלֹתוֹ
  choice: rumah itu selesai
  alternative: pekerjaan itu selesai atau Salomo menyelesaikannya
  rationale: Sufiks maskulin tunggal dapat dikaitkan dengan rumah Yahweh yang disebut tepat sebelumnya. Terjemahan utama mengikuti acuan terdekat, sedangkan konstruksi Ibrani tetap memiliki sedikit keluwesan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Rumah Yahweh' dipertahankan daripada 'Bait Yahweh' agar metafora leksikal Ibrani tetap tampak. Kalimat penutup memakai inversi 'lengkaplah' untuk menandai simpulan yang tegas tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
