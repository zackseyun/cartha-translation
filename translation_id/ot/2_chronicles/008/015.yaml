  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: id
  text: Mereka tidak menyimpang dari perintah raja mengenai para imam dan orang-orang Lewi dalam perkara apa pun, ataupun mengenai perbendaharaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gudang-gudang penyimpanan.” Kata Ibrani אֹצָרוֹת dapat merujuk pada perbendaharaan atau gudang penyimpanan; “perbendaharaan” sesuai dengan konteks pengelolaan Bait Allah di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: tidak menyimpang
  rationale: Kata kerja סור berarti berbelok, meninggalkan, atau menyimpang. Dalam konteks ketaatan terhadap perintah, “tidak menyimpang” alami dan tetap mencerminkan ungkapan Ibrani.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: perintah raja
  rationale: מִצְוָה berarti perintah atau ketetapan. Bentuk tunggal “perintah raja” sesuai dengan konteks administratif.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: mengenai para imam dan orang-orang Lewi
  rationale: עַל di sini paling wajar dipahami sebagai penanda pokok yang diatur oleh perintah. Kedua kelompok tetap disebut secara tersendiri, sesuai dengan artikel pada teks Ibrani.
- source_word: לְכָל דָּבָר
  choice: dalam hal apa pun
  rationale: Dalam konstruksi negatif, frasa ini secara idiomatis menegaskan bahwa tidak ada satu perkara pun yang dikecualikan.
- source_word: וְלָאֹצָרוֹת
  choice: termasuk mengenai perbendaharaan
  rationale: Konjungsi וְ menghubungkan perbendaharaan dengan cakupan perintah. “Termasuk” menghasilkan hubungan yang alami dalam bahasa Indonesia tanpa menghapus bahwa unsur ini ditambahkan secara khusus. אֹצָרוֹת dapat berarti tempat penyimpanan atau perbendaharaan; konteks tata kelola Bait Allah mendukung “perbendaharaan”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Orang-orang Lewi” dipilih sebagai sebutan kelompok yang lazim dan jelas; “perbendaharaan” mempertahankan konteks kelembagaan Bait Allah.
