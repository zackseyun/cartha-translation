source:
  edition: WLC
  text: וְ/אֵ֨לֶּה שָׂרֵ֤י ה/נציבים אֲשֶׁר לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם הָ/רֹדִ֖ים בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: id
  text: 'Inilah para kepala pejabat Raja Salomo: dua ratus lima puluh orang, yang memegang kekuasaan atas rakyat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang mengawasi rakyat” atau “yang bertanggung jawab atas rakyat.” Kata kerja Ibrani yang digunakan dapat menunjuk pada pelaksanaan wewenang dalam arti administratif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan kelompok yang sedang dirangkum dalam narasi; bentuk ini alami dalam bahasa Indonesia dan tidak memaksakan penandaan kala yang tidak terdapat dalam bahasa Ibrani.
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: para kepala pejabat
  rationale: Bentuk konstruksi ini menunjuk kepada para pemimpin dari kalangan pejabat yang diangkat. 'Kepala pejabat' mempertahankan hubungan jenjang jabatan tanpa mempersempitnya menjadi jabatan militer.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Dalam frasa 'para kepala pejabat Raja Salomo', hubungan kepemilikan atau afiliasi kerajaan tersampaikan secara ringkas dan wajar.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: dua ratus lima puluh orang
  rationale: Padanan baku untuk bilangan Ibrani tersebut; 'orang' ditambahkan secara wajar karena yang dihitung adalah para pejabat.
- source_word: הָרֹדִים
  choice: yang memegang kekuasaan
  rationale: Kata kerja רדה menyatakan pelaksanaan kuasa atau pemerintahan. Ungkapan ini mempertahankan makna otoritas sambil sesuai dengan konteks administratif.
- source_word: בָּעָם
  choice: atas rakyat
  rationale: Dengan רדה, preposisi ב menandai pihak yang berada di bawah wewenang. 'Rakyat' menerjemahkan עָם tanpa mengkhususkannya sebagai tenaga kerja, yang tidak dinyatakan secara eksplisit dalam ayat ini.
