  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan unsur-unsur utama Ibrani: kota-kota itu diberikan oleh Huram kepada Salomo, Salomo membangun kembali kota-kota tersebut, lalu ia menyebabkan orang Israel tinggal di sana. Pilihan "Mengenai" wajar untuk waw pembuka dalam konteks ini, dan "telah diberikan" dengan tepat menyatakan tindakan yang mendahului pembangunan kembali.'
