id: 2CH.8.2
reference: 2 Chronicles 8:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: id
  text: Mengenai kota-kota yang telah diberikan Huram[a] kepada Salomo, Salomo membangun kembali[b] kota-kota itu dan menempatkan orang Israel[c] di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Huram; secara tradisional: Hiram.'
    reason: alternative_reading
  - marker: b
    text: Atau “membangun.” Kata kerja Ibrani ini dapat berarti “membangun” atau, dalam konteks ini, “membangun kembali/memulihkan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: Mengenai kota-kota
  rationale: Kata penghubung וְ dengan nomina definit memperkenalkan pokok berikutnya dalam rangkuman narasi; 'Mengenai' menghasilkan alur wacana Indonesia yang alami.
- source_word: אֲשֶׁר נָתַן
  choice: yang telah diberikan
  rationale: Klausa relatif ini mengacu pada tindakan pemberian yang terjadi sebelum pembangunan oleh Salomo; bentuk pasif alami dalam bahasa Indonesia mempertahankan kota-kota sebagai pokok klausa.
- source_word: חוּרָם
  choice: Huram
  rationale: Mengikuti bentuk nama Ibrani חוּרָם dalam teks sumber, bukan bentuk tradisional 'Hiram'.
- source_word: לִשְׁלֹמֹה
  choice: kepada Salomo
  rationale: Preposisi ל menandai Salomo sebagai penerima.
- source_word: בָּנָה
  choice: membangun kembali
  rationale: Arti dasarnya 'membangun', tetapi karena kota-kota itu sudah ada dan telah diberikan kepada Salomo, konteks mendukung makna membangun ulang atau memulihkannya; alternatif harfiah dicatat dalam catatan kaki.
- source_word: וַיּוֹשֶׁב
  choice: menempatkan
  rationale: Bentuk hifil dari ישׁב bersifat kausatif, yaitu membuat orang tinggal atau menetap di suatu tempat. 'Menempatkan ... di sana' menyampaikan tindakan Salomo secara alami.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah 'anak-anak Israel', tetapi dalam konteks ini ungkapan tersebut menunjuk kepada orang Israel secara kolektif, bukan hanya keturunan laki-laki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kota-kota sebagai topik serta mengungkapkan urutan tindakan dengan jelas. Catatan kaki menjaga bentuk nama sumber dan ambiguitas leksikal yang asli.
