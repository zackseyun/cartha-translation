source:
  edition: WLC
  text: אָז֩ הָלַ֨ךְ שְׁלֹמֹ֜ה לְ/עֶצְיֽוֹן גֶּ֧בֶר וְ/אֶל אֵיל֛וֹת עַל שְׂפַ֥ת הַ/יָּ֖ם בְּ/אֶ֥רֶץ אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: id
  text: Kemudian Salomo pergi ke Ezion-Geber dan ke Elot[a], di tepi laut, di tanah Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elot juga dikenal dengan bentuk nama Elat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan kisah; 'Kemudian' alami dalam narasi bahasa Indonesia.
- source_word: הָלַךְ
  choice: pergi
  rationale: Dalam konteks ini, verba tersebut menyatakan tindakan pergi atau melakukan perjalanan, bukan secara khusus berjalan kaki.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: ke Ezion-Geber
  rationale: Nama tempat ditransliterasikan; tanda hubung mempertahankan bentuk lazim nama majemuk tersebut.
- source_word: וְאֶל אֵילוֹת
  choice: dan ke Elot
  rationale: Konjungsi dan preposisi diterjemahkan secara eksplisit, sedangkan nama tempat ditransliterasikan dekat dengan bentuk Ibrani.
- source_word: עַל שְׂפַת הַיָּם
  choice: di tepi laut
  rationale: Ungkapan Ibrani secara harfiah menunjuk pada bibir atau tepian laut; 'di tepi laut' jelas dan alami.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: di tanah Edom
  rationale: Mempertahankan unsur אֶרֶץ ('tanah/negeri') yang dinyatakan secara eksplisit dalam teks sumber.
theological_decisions: []
