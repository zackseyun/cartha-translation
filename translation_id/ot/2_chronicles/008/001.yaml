id: 2CH.8.1
reference: 2 Chronicles 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: id
  text: Setelah dua puluh tahun berlalu, yaitu masa ketika Salomo membangun rumah Yahweh dan rumahnya sendiri[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “istananya.” Secara harfiah: “rumahnya.”'
    reason: Menunjukkan bahwa בֵּיתוֹ secara leksikal berarti 'rumahnya', tetapi dalam konteks kediaman raja dapat merujuk pada istananya.
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Setelah ... berlalu
  rationale: Ungkapan naratif ini menandai perkembangan yang terjadi ketika jangka waktu tersebut telah berakhir. Bentuk ini alami dalam bahasa Indonesia dan tetap menghubungkan ayat 1 dengan peristiwa pada ayat berikutnya.
- source_word: עֶשְׂרִים שָׁנָה
  choice: dua puluh tahun
  rationale: Terjemahan langsung dan idiomatis untuk keterangan jangka waktu.
- source_word: אֲשֶׁר
  choice: yaitu masa ketika
  rationale: Kata penghubung ini mengaitkan jangka dua puluh tahun dengan kegiatan pembangunan Salomo tanpa mengaburkan hubungan waktunya.
- source_word: בָּנָה
  choice: membangun
  rationale: Bentuk perfektif Ibrani memandang kegiatan pembangunan sebagai keseluruhan yang telah berlangsung dalam masa tersebut; konteks akhir dua puluh tahun menyiratkan bahwa pekerjaan itu telah selesai.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora harfiah 'rumah' dan nama ilahi יהוה, alih-alih menggantinya dengan istilah interpretatif 'Bait Allah'.
- source_word: בֵּיתוֹ
  choice: rumahnya sendiri
  rationale: Akhiran pronominal menunjuk kepada milik Salomo. Kata 'sendiri' memperjelas kontras dengan rumah Yahweh, sedangkan kemungkinan makna kontekstual 'istana' dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan ayat sengaja dibiarkan berakhir dengan koma karena kalimat Ibraninya berlanjut ke ayat berikutnya.
