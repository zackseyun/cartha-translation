  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: id
  text: Setelah Salomo selesai berdoa, api turun dari langit dan menghanguskan persembahan bakaran serta kurban-kurban. Kemuliaan Yahweh pun memenuhi rumah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah Bait Allah; secara harfiah, “rumah itu”.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: Setelah Salomo selesai berdoa
  rationale: Konstruksi temporal dengan כְּ dan infinitif כלה menunjukkan bahwa turunnya api terjadi ketika tindakan berdoa telah selesai. Ungkapan ini alami dalam bahasa Indonesia tanpa menambahkan kesan kesegeraan yang tidak dinyatakan secara tegas.
- source_word: וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם
  choice: api turun dari langit
  rationale: Mencerminkan gerak vertikal verba ירד dan idiom Ibrani שׁמים, yang secara alami diterjemahkan dengan bentuk tunggal 'langit' dalam bahasa Indonesia.
- source_word: וַתֹּאכַל
  choice: menghanguskan
  rationale: Secara harfiah verba ini berarti 'memakan', tetapi dengan api sebagai subjek, 'menghanguskan' menyampaikan makna bahwa persembahan itu dilalap habis secara alami dan jelas.
- source_word: הָעֹלָה
  choice: persembahan bakaran
  rationale: Istilah ini menunjuk pada jenis kurban yang dibakar seluruhnya; 'persembahan bakaran' merupakan padanan kultis yang jelas dan lazim.
- source_word: וְהַזְּבָחִים
  choice: serta kurban-kurban
  rationale: Bentuk jamak זבחים menunjuk pada kurban-kurban lain dan dibedakan dari persembahan bakaran yang disebut sebelumnya.
- source_word: וּכְבוֹד יְהוָה
  choice: Kemuliaan Yahweh pun
  rationale: כבוד menunjuk pada kemuliaan ilahi yang dinyatakan. Partikel 'pun' menjaga kesinambungan narasi, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: memenuhi rumah itu
  rationale: Mempertahankan arti dasar הַבַּיִת, 'rumah itu', sementara konteks bahwa yang dimaksud ialah Bait Allah dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Rujukan הַבָּיִת
  choice: rumah itu
  alternative: Bait Allah itu; bait itu
  rationale: Bahasa Ibrani secara harfiah berbunyi 'rumah itu', tetapi dalam konteks merujuk pada Bait Allah. Terjemahan utama mempertahankan bentuk sumber dan catatan menjernihkan rujukannya.
- issue: Hubungan antarklausa pada bagian akhir ayat
  choice: Kalimat baru dengan 'Kemuliaan Yahweh pun'
  alternative: Satu kalimat majemuk dengan 'dan'
  rationale: Waw Ibrani melanjutkan rangkaian narasi, tetapi tidak menuntut semua klausa menjadi satu kalimat dalam bahasa Indonesia. Pemisahan ini meningkatkan keterbacaan tanpa mengubah hubungan peristiwanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah kurban dipertahankan untuk konteks persembahan ritual. Susunan kalimat dibuat mudah dibaca, sementara ungkapan sumber 'rumah itu' dan nama Yahweh tetap dipertahankan.
