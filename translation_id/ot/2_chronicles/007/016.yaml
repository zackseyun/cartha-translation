  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: id
  text: Sekarang Aku telah memilih dan menguduskan rumah ini[a], agar nama-Ku berada di sana untuk selama-lamanya, dan mata-Ku serta hati-Ku akan berada di sana sepanjang masa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah ini” merujuk kepada Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dalam firman ilahi secara alami; dalam bahasa Indonesia, hubungan dengan kalimat sebelumnya tidak harus dinyatakan dengan kata 'dan'.
- source_word: בָּחַרְתִּי
  choice: Aku telah memilih
  rationale: Bentuk perfektif menyatakan tindakan ilahi yang sudah selesai dan tetap relevan pada saat firman ini disampaikan.
- source_word: וְהִקְדַּשְׁתִּי
  choice: dan menguduskan
  rationale: Bentuk Hifil dari קדשׁ berarti menetapkan atau memisahkan sebagai kudus; 'menguduskan' tepat dan lazim dalam konteks rumah ibadah.
- source_word: הַבַּיִת הַזֶּה
  choice: rumah ini
  rationale: Mempertahankan sebutan konkret bahasa Ibrani; konteks menunjukkan bahwa rumah yang dimaksud adalah Bait Allah.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: supaya nama-Ku tinggal di sana
  rationale: Konstruksi infinitif menyatakan tujuan atau hasil. Penambahan 'tinggal' membuat idiom teologi Bait Allah dapat dipahami tanpa mengganti 'nama-Ku' dengan tafsiran seperti 'kehadiran-Ku'.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyampaikan durasi yang terus berlangsung dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: Mata-Ku dan hati-Ku akan tetap tertuju ke sana
  rationale: Mempertahankan kedua gambaran antropomorfis sambil mengungkapkan secara alami bahwa perhatian dan kepedulian Allah terus diarahkan ke tempat itu.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Mengungkapkan idiom harfiah 'segala hari' secara wajar dalam bahasa Indonesia, dengan arti terus-menerus.
theological_decisions:
- issue: 'Bahasa antropomorfis tentang Allah: ''mata-Ku dan hati-Ku'''
  choice: Mempertahankan citra 'mata' dan 'hati'
  alternative: Memparafrasakan seluruhnya sebagai 'perhatian dan kepedulian-Ku'
  rationale: Bahasa sumber sengaja memakai gambaran tubuh untuk menyatakan perhatian dan komitmen perjanjian Allah; citra itu tidak boleh dihapus.
- issue: Teologi Bait Allah dalam ungkapan 'nama-Ku'
  choice: Mempertahankan 'nama-Ku' dan menerjemahkan konstruksinya sebagai 'supaya nama-Ku tinggal di sana'
  alternative: Mengganti dengan 'supaya Aku hadir di sana' atau 'supaya kehadiran-Ku ada di sana'
  rationale: Ungkapan 'nama-Ku' memiliki bobot teologis khas dan tidak identik begitu saja dengan penjelasan tentang kehadiran penuh atau sekadar reputasi Allah.
- issue: Jangka waktu dalam עַד עוֹלָם dan כָּל הַיָּמִים
  choice: Menerjemahkan masing-masing sebagai 'untuk selama-lamanya' dan 'sepanjang masa'
  alternative: Menyamakan keduanya sebagai 'selamanya'
  rationale: Pembedaan ungkapan sumber dipertahankan tanpa memaksakan penyelesaian atas ketegangan antara janji kekal dan peringatan bersyarat dalam konteks berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan citra utama bahasa Ibrani.
