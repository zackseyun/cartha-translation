  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: id
  text: Apabila Aku menutup langit sehingga tidak turun hujan[a], atau memerintahkan belalang untuk melahap hasil tanah, atau mengirim wabah penyakit di antara umat-Ku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jika Aku menutup langit sehingga tidak turun hujan.” Partikel pembuka dalam bahasa Ibrani juga dapat diterjemahkan lebih harfiah sebagai “sesungguhnya, jika” atau “lihatlah, jika.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sampar di antara umat-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Apabila
  rationale: Partikel ini memperkenalkan keadaan bersyarat. “Apabila” alami dalam bahasa Indonesia dan tetap terbuka antara kemungkinan dan waktu terjadinya keadaan itu.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: Aku menutup langit
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang langit yang ditutup sehingga hujan tertahan.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: sehingga tidak turun hujan
  rationale: Mengungkapkan akibat penutupan langit secara alami dalam bahasa Indonesia.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: memerintahkan belalang
  rationale: Bentuk tunggal Ibrani bersifat kolektif; “belalang” dalam bahasa Indonesia juga dapat menunjuk kepada kawanan secara kolektif.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: untuk melahap hasil tanah
  rationale: Secara harfiah berarti “memakan tanah/negeri,” tetapi yang dihancurkan belalang adalah tumbuh-tumbuhan atau hasilnya. Ungkapan ini menyampaikan dampaknya tanpa memakai “bumi” yang terlalu luas.
- source_word: דֶּבֶר
  choice: wabah penyakit
  rationale: Menunjuk pada penyakit menular yang meluas sebagai hukuman; pilihan ini jelas bagi pembaca modern dan tetap mempertahankan bobot ungkapan sumber.
- source_word: בְּעַמִּי
  choice: di antara umat-Ku
  rationale: Preposisi ב di sini secara alami menggambarkan wabah yang terjadi di tengah-tengah umat.
theological_decisions:
- issue: Rangkaian tindakan ilahi sebagai keadaan bersyarat
  choice: “Apabila ... atau ... atau ...” dengan Allah sebagai pelaku langsung
  alternative: “Jika sesungguhnya ...” atau “Lihatlah, jika ...”
  rationale: Teks Ibrani menyajikan beberapa kemungkinan tindakan penghukuman Allah. Susunan ini mempertahankan sifat bersyarat dan tindakan langsung Allah tanpa memastikan bahwa semuanya pasti terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada “Aku” dan “umat-Ku” mengikuti kebiasaan ejaan terjemahan Alkitab Indonesia untuk rujukan kepada Allah. Ayat dibiarkan berakhir dengan koma karena secara sintaksis berlanjut ke ayat 14.
