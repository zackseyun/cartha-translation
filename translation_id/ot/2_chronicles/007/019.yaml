  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: id
  text: Namun, jika kamu berbalik dan meninggalkan ketetapan serta perintah-Ku yang telah Kutaruh di hadapanmu, lalu pergi mengabdi kepada ilah-ilah lain dan sujud menyembah mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: berbalik
  rationale: Mempertahankan gambaran gerak berpaling dari jalan yang ditetapkan, sesuai makna dasar verba שׁוב dalam konteks bersyarat ini.
- source_word: וַעֲזַבְתֶּם
  choice: meninggalkan
  rationale: Padanan alami dan langsung yang menyatakan tindakan tidak lagi berpegang pada ketetapan dan perintah Allah.
- source_word: חֻקּוֹתַי וּמִצְוֺתַי
  choice: ketetapan serta perintah-Ku
  rationale: Membedakan dua istilah hukum Ibrani tanpa membuat perbedaan teknis yang berlebihan; 'serta' menghindari pengulangan 'dan' yang kaku.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: yang telah Kuberikan kepadamu
  rationale: Ungkapan idiomatis 'memberikan/menaruh di hadapan' menyatakan bahwa ketetapan itu disampaikan untuk ditaati; bentuk Indonesia ini alami tanpa menambah tafsiran.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: mengabdi kepada ilah-ilah lain
  rationale: עבד dalam konteks kultis berarti melayani atau mengabdi; 'mengabdi' membedakannya dari tindakan sujud pada klausa berikutnya.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: sujud menyembah mereka
  rationale: Mengungkapkan baik gerak membungkuk/sujud maupun makna penyembahan dalam konteks ilah-ilah lain.
theological_decisions:
- issue: Makna kultis verba עבד dan השתחוה
  choice: mengabdi ... dan sujud menyembah
  alternative: melayani ... dan bersujud
  rationale: Pilihan ini mempertahankan dua tindakan yang berbeda sekaligus memperjelas bahwa konteksnya adalah kesetiaan dan penyembahan religius, bukan pelayanan biasa.
- issue: Referen orang kedua jamak
  choice: kamu
  alternative: kalian
  rationale: Bahasa Indonesia Alkitabiah lazim memakai 'kamu' secara kolektif. Ayat ini menyapa Salomo dan umat sebagai kelompok, tanpa perlu mengubahnya menjadi bentuk informal 'kalian'.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur syarat dipertahankan, termasuk koma akhir karena kalimat berlanjut ke ayat berikutnya. Kapitalisasi pronomina ilahi digunakan sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
