  revised_text: Lalu orang-orang akan berkata, “Karena mereka meninggalkan Yahweh, Allah nenek moyang mereka, yang membawa mereka keluar dari negeri Mesir, lalu berpaut kepada ilah-ilah lain, sujud kepada ilah-ilah itu dan beribadah kepada mereka, karena itulah Ia mendatangkan seluruh malapetaka ini atas mereka.”
