  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: id
  text: Lalu orang-orang akan berkata, “Karena mereka meninggalkan Yahweh, Allah nenek moyang mereka, yang membawa mereka keluar dari negeri Mesir, lalu berpaut kepada ilah-ilah lain, sujud kepada ilah-ilah itu dan beribadah kepada mereka, karena itulah Ia mendatangkan seluruh malapetaka ini atas mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Lalu orang akan berkata
  rationale: Bentuk ini melanjutkan nubuat pada ayat sebelumnya. Subjek jamak yang tidak disebutkan secara khusus paling alami dinyatakan dengan “orang” dalam bahasa Indonesia.
- source_word: עַל אֲשֶׁר
  choice: Itu terjadi karena
  rationale: Frasa ini memperkenalkan alasan bagi kehancuran yang disaksikan; susunan ini alami dalam jawaban langsung bahasa Indonesia.
- source_word: עָזְבוּ
  choice: meninggalkan
  rationale: Kata ini menyatakan tindakan meninggalkan Yahweh dalam konteks ketidaksetiaan perjanjian; “meninggalkan” jelas, wajar, dan tetap berbobot.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: Ungkapan ini mempertahankan kaitan antargenerasi dengan umat terdahulu dan terdengar alami dalam bahasa Indonesia modern.
- source_word: הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: yang membawa mereka keluar dari tanah Mesir
  rationale: Ini merupakan padanan langsung dan alami bagi rumusan keluaran yang baku.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: Mereka berpaut kepada ilah-ilah lain
  rationale: חזק dengan ב menyatakan keterikatan yang disengaja atau berpegang erat. “Berpaut kepada” mempertahankan metafora keterikatan tanpa terdengar janggal.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: sujud menyembah ... kepada ilah-ilah itu
  rationale: Terjemahan ini mempertahankan tindakan fisik membungkuk atau bersujud sekaligus menjelaskan makna kultisnya dalam konteks.
- source_word: וַיַּעַבְדוּם
  choice: beribadah kepada ilah-ilah itu
  rationale: Dalam hubungan dengan ilah, עבד menunjuk pada pelayanan keagamaan. “Beribadah” membedakannya dari tindakan sujud pada verba sebelumnya.
- source_word: עַל כֵּן
  choice: Karena itulah
  rationale: Ungkapan ini menandai akibat dari kemurtadan secara jelas dan alami.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: Ia mendatangkan ... atas mereka
  rationale: Bentuk kausatif menyatakan bahwa Yahweh membuat malapetaka menimpa mereka. Kapitalisasi pronomina mengikuti acuan kepada Allah dalam gaya penerbitan ini.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: seluruh malapetaka ini
  rationale: Dalam konteks penghukuman, רָעָה berarti bencana atau malapetaka, bukan kejahatan moral. “Malapetaka” sesuai dengan kehancuran besar yang dimaksud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Relasi antara kemurtadan dan malapetaka
  choice: Karena itulah, Ia mendatangkan seluruh malapetaka ini atas mereka
  alternative: Karena itulah seluruh malapetaka ini menimpa mereka
  rationale: Subjek tunggal pada הֵבִיא merujuk kembali kepada Yahweh; terjemahan mempertahankan tindakan ilahi yang eksplisit dan tidak mengubahnya menjadi akibat impersonal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi beberapa kalimat agar kutipan jawaban mudah dipahami tanpa menghilangkan hubungan sebab-akibat. “Ilah-ilah” dipakai bagi אֱלֹהִים אֲחֵרִים untuk membedakannya dari “Allah” sebagai sebutan bagi Yahweh. Tidak ada penanda catatan kaki karena semua alternatif penting dapat ditangani secara memadai dalam teks utama.
