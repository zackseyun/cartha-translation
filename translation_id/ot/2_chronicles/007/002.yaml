  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: id
  text: Dan para imam tidak dapat masuk ke rumah Yahweh[a], sebab kemuliaan Yahweh memenuhi rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah Yahweh”; yang dimaksud ialah Bait Allah. Terjemahan mempertahankan kata “rumah” sesuai dengan ungkapan Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: tidak dapat
  rationale: Ungkapan ini menyatakan ketidakmampuan para imam. Dalam bahasa Indonesia, 'tidak dapat' alami dan cukup formal; וְ berfungsi melanjutkan alur narasi dan tidak harus diterjemahkan secara eksplisit.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Bentuk jamak tentu ini secara alami diterjemahkan 'para imam' dalam konteks ibadah di Bait Allah.
- source_word: לָבוֹא אֶל
  choice: masuk ke
  rationale: Dalam konteks memasuki suatu bangunan, בוא dengan אֶל paling alami berarti 'masuk ke'.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan secara langsung metafora Ibrani 'rumah' dan nama ilahi; konteks menunjukkan bahwa yang dimaksud ialah Bait Allah.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memberikan alasan para imam tidak dapat masuk. 'Sebab' jelas, wajar, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: מָלֵא
  choice: memenuhi
  rationale: Bentuk verba ini menyatakan bahwa kemuliaan Yahweh memenuhi rumah itu. 'Memenuhi' mempertahankan hubungan transitif dengan objek yang ditandai אֶת.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: '''Kemuliaan'' merupakan padanan baku dan luas bagi כָּבוֹד dalam konteks penampakan hadirat ilahi.'
- source_word: אֶת בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Pengulangan frasa yang sama dipertahankan sebagaimana dalam teks Ibrani, tanpa variasi stilistis menjadi 'Bait Allah'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Makna ketidakmampuan para imam
  choice: tidak dapat masuk
  alternative: dilarang masuk
  rationale: Teks menyatakan ketidakmampuan, tetapi tidak menjelaskan mekanisme atau menetapkan bahwa ada larangan verbal. Terjemahan tidak mempersempit ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan 'rumah Yahweh' dalam teks sumber. Kata sambung וְ tidak dinyatakan dengan 'dan' karena ayat Indonesia dapat melanjutkan narasi secara alami tanpa konjungsi awal.
