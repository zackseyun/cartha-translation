revisions:
- from: Raja Salomo mempersembahkan sebagai kurban dua puluh dua ribu ekor sapi dan seratus dua puluh ribu ekor domba dan kambing[a]. Demikianlah raja dan seluruh rakyat menahbiskan rumah Allah.
  to: Raja Salomo mempersembahkan sebagai kurban dua puluh dua ribu ekor sapi dan seratus dua puluh ribu ekor ternak kecil[a], dan raja serta seluruh rakyat menahbiskan rumah Allah.
  rationale: Revisi mengganti penghubung yang bernuansa inferensial dengan “dan”, sesuai alur koordinatif teks Ibrani. Padanan צֹאן diubah menjadi “ternak kecil” agar tidak mempersempit atau menentukan komposisi hewan yang tidak diperinci oleh sumber; kemungkinan cakupan domba dan kambing dipertahankan dalam catatan kaki.
