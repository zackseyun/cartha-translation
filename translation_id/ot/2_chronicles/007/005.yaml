base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: id
  text: Raja Salomo mempersembahkan sebagai kurban dua puluh dua ribu ekor sapi dan seratus dua puluh ribu ekor ternak kecil[a], dan raja serta seluruh rakyat menahbiskan rumah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat mencakup domba dan kambing secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: mempersembahkan sebagai kurban
  rationale: Dalam konteks ibadah, זבח berarti menyembelih atau mempersembahkan sebagai kurban. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna ritualnya.
- source_word: זֶבַח הַבָּקָר
  choice: ekor sapi
  rationale: הַבָּקָר menunjuk pada ternak besar atau sapi. Kata bantu bilangan 'ekor' diperlukan agar jumlah yang besar terdengar alami dalam bahasa Indonesia.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: dua puluh dua ribu
  rationale: Bentuk baku bahasa Indonesia modern untuk bilangan Ibrani tersebut.
- source_word: וְצֹאן
  choice: ekor domba dan kambing
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil yang dapat mencakup domba dan kambing; terjemahan ini mempertahankan cakupan leksikalnya tanpa mempersempitnya menjadi domba saja.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: seratus dua puluh ribu
  rationale: Bentuk baku bahasa Indonesia modern untuk bilangan Ibrani tersebut.
- source_word: וַיַּחְנְכוּ
  choice: menahbiskan
  rationale: חנך di sini menunjuk pada peresmian dan pengkhususan rumah Allah bagi penggunaannya. 'Menahbiskan' menyampaikan tindakan dedikasi kultis tersebut secara ringkas dan bermartabat.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ungkapan Ibrani yang tetap alami dan mempertahankan metafora sumber, alih-alih menggantinya dengan 'Bait Allah' atau 'kuil Allah'.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: raja dan seluruh rakyat
  rationale: Mempertahankan penyebutan ulang gelar 'raja' dalam bahasa Ibrani serta cakupan כָּל, dengan 'rakyat' sebagai padanan kolektif yang alami.
