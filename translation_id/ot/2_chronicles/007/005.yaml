  naturalness: Teks hasil revisi tetap lugas, modern, dan bermartabat. “Ternak kecil” merupakan padanan kolektif yang alami dalam konteks daftar hewan kurban, sedangkan “menahbiskan rumah Allah” sesuai dengan register Alkitab dan makna dedikasi kultis.
  terminology: “Mempersembahkan sebagai kurban” mempertahankan makna זבח dalam konteks ritual. “Sapi” memadai untuk בָּקָר. “Ternak kecil” menjaga keluasan צֹאן, dan catatan kaki menjelaskan kemungkinan domba serta kambing. “Rumah Allah” mempertahankan ungkapan sumber.
