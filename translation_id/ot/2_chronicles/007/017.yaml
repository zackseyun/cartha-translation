revisions:
- from: Dan engkau, jika engkau hidup di hadapan-Ku seperti Daud, ayahmu, hidup, dengan melakukan segala yang telah Kuperintahkan kepadamu, serta berpegang pada ketetapan-ketetapan dan peraturan-peraturan-Ku,
  to: Dan engkau, jika engkau hidup di hadapan-Ku sebagaimana Daud, ayahmu, hidup, dan melakukan segala yang telah Kuperintahkan kepadamu, serta menaati ketetapan-Ku dan hukum-hukum-Ku[a],
  rationale: Revisi memperlancar konstruksi perbandingan dan ketaatan dalam bahasa Indonesia modern baku, tanpa mengurangi struktur syarat atau memasukkan penafsiran teologis. Koma akhir dipertahankan karena klausa bersyarat berlanjut ke ayat berikutnya.
