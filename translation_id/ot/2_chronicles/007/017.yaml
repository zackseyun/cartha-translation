    text: 'Atau: peraturan-peraturan-Ku.'
    reason: Alternatif leksikal untuk hukum-hukum-Ku (מִשְׁפָּטַי), yang dapat menunjuk pada peraturan atau ketetapan hukum.
  revision_rationale: Revisi memperlancar konstruksi perbandingan dan ketaatan dalam bahasa Indonesia modern baku, tanpa mengurangi struktur syarat atau memasukkan penafsiran teologis. Koma akhir dipertahankan karena klausa bersyarat berlanjut ke ayat berikutnya.
