review_pass:
  verdict: revise
  source_fidelity: Makna kondisional, sapaan langsung kepada Salomo, idiom hidup di hadapan Allah, cakupan 'segala', serta pasangan istilah hukum dipertahankan. Namun, pengulangan 'hidup' dalam draf tidak wajar dalam bahasa Indonesia; koordinasi dengan 'dan melakukan' menyampaikan fungsi infinitif Ibrani dengan setia dan alami. 'Menaati' lebih langsung untuk תִּשְׁמֹר daripada 'berpegang pada'.
  naturalness: Frasa 'seperti Daud, ayahmu, hidup' terasa tersendat dan tidak idiomatis. Susunan 'sebagaimana Daud, ayahmu, hidup' lebih baku, sambil mempertahankan verba pembanding yang eksplisit. Bentuk tunggal 'ketetapan' lazim sebagai nomina hukum kolektif dalam bahasa Indonesia; 'hukum-hukum' menjaga bentuk jamak dan nuansa משפטים.
  terminology: Ketetapan dipertahankan untuk חֻקַּי dan hukum-hukum untuk מִשְׁפָּטַי agar kedua istilah tetap dibedakan. Catatan alternatif 'peraturan-peraturan' ditempatkan pada 'hukum-hukum', yaitu kata yang dirujuk, bukan pada sapaan 'engkau'.
  issues:
  - severity: medium
    issue: Pengulangan verba dalam 'seperti Daud, ayahmu, hidup' tidak alami.
    rationale: Walaupun Ibrani mengulang akar הלך, bahasa Indonesia memerlukan susunan pembanding yang lebih lancar. 'Sebagaimana Daud, ayahmu, hidup' tetap menyatakan tindakan Daud secara eksplisit tanpa mengubah makna.
  - severity: low
    issue: '''Berpegang pada'' kurang langsung untuk תִּשְׁמֹר dalam konteks perintah hukum.'
    rationale: Verba ini dapat berarti berpegang secara figuratif, sedangkan 'menaati' dengan jelas menyatakan pemeliharaan/penurutan ketetapan yang dimaksud teks.
  - severity: low
    issue: Draf tidak menyediakan jangkar catatan untuk alternatif leksikal מִשְׁפָּטַי.
    rationale: Audit bahasa Inggris mencatat 'ordinances' sebagai alternatif. Dalam bahasa Indonesia, 'peraturan-peraturan' merupakan alternatif yang relevan dan jangkar harus melekat pada istilah hukum yang dirujuk.
  revised_text: Dan engkau, jika engkau hidup di hadapan-Ku sebagaimana Daud, ayahmu, hidup, dan melakukan segala yang telah Kuperintahkan kepadamu, serta menaati ketetapan-Ku dan hukum-hukum-Ku[a],
  revised_footnotes:
