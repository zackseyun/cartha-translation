  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: id
  text: Dan engkau, jika engkau hidup di hadapan-Ku sebagaimana Daud, ayahmu, hidup, dan melakukan segala yang telah Kuperintahkan kepadamu, serta menaati ketetapan-Ku dan hukum-hukum-Ku[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: peraturan-peraturan-Ku.'
    reason: Alternatif leksikal untuk hukum-hukum-Ku (מִשְׁפָּטַי), yang dapat menunjuk pada peraturan atau ketetapan hukum.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Dan engkau
  rationale: Pronomina yang dikedepankan memberi penekanan pada sapaan langsung kepada Salomo; bentuk ini mempertahankan peralihan wacana tanpa terasa kaku dalam bahasa Indonesia.
- source_word: אִם
  choice: jika
  rationale: Menandai syarat secara langsung dan mempertahankan struktur kondisional ayat.
- source_word: תֵּלֵךְ לְפָנַי
  choice: engkau hidup di hadapan-Ku
  rationale: Secara harfiah berarti 'berjalan di hadapan-Ku', tetapi dalam konteks ini merupakan idiom tentang menjalani hidup di hadirat Allah; 'hidup di hadapan-Ku' menyampaikan maknanya secara alami.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: seperti Daud, ayahmu, hidup
  rationale: Mempertahankan perbandingan dengan kehidupan Daud dan hubungan 'ayahmu', sambil menerapkan padanan idiomatis yang sama bagi verba הלך.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: dengan melakukan segala yang telah Kuperintahkan kepadamu
  rationale: Infinitif לַעֲשׂוֹת menyatakan tindakan yang menyertai cara hidup tersebut; 'dengan melakukan' menjaga keterkaitan gramatikalnya dan cakupan menyeluruh כְּכֹל.
- source_word: חֻקַּי
  choice: ketetapan-ketetapan-Ku
  rationale: Padanan hukum-perjanjian yang lazim dan tetap dibedakan dari מִשְׁפָּטַי.
- source_word: וּמִשְׁפָּטַי
  choice: peraturan-peraturan-Ku
  rationale: Dalam rangkaian hukum ini, 'peraturan' terdengar alami bagi pembaca modern dan mempertahankan perbedaan leksikal dari 'ketetapan'.
- source_word: תִּשְׁמֹר
  choice: berpegang pada
  rationale: Menyampaikan tindakan menaati dan memelihara ketentuan perjanjian secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan ketaatan dalam syarat perjanjian tanpa memasukkan teologi jasa
  choice: Mempertahankan struktur nyata 'jika engkau ... dengan melakukan ... serta berpegang pada ...'.
  alternative: Menggeneralisasikannya sebagai sekadar 'jika engkau setia' atau melunakkan sifat persyaratannya.
  rationale: Teks menyatakan syarat perjanjian yang ditujukan kepada Salomo. Terjemahan perlu mempertahankan tuntutan ketaatan itu tanpa menambah penafsiran mengenai jasa atau sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Sapaan 'engkau' dipakai untuk mempertahankan sifat langsung dan tunggal. Bentuk ulang pada dua istilah hukum menjernihkan makna jamak. Ayat sengaja diakhiri koma karena klausa bersyaratnya berlanjut ke ayat berikutnya.
