  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: id
  text: Sekarang mata-Ku akan terbuka dan telinga-Ku akan menaruh perhatian kepada doa yang dipanjatkan di tempat ini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kepada doa yang dipanjatkan di tempat ini” atau “kepada doa yang dipanjatkan dari tempat ini.” Secara lebih harfiah: “kepada doa tempat ini.”'
    reason: Konstruksi Ibrani לִתְפִלַּת הַמָּקוֹם הַזֶּה secara harfiah berarti “kepada doa tempat ini.” Dalam konteks, doa itu dikaitkan dengan tempat ini, tetapi hubungan tersebut dapat dipahami sebagai doa di tempat ini atau dari tempat ini.
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Keterangan waktu ini menandai hasil yang berlaku kini dari pentahbisan sebelumnya. “Sekarang” alami dan tidak mempertegas durasi seperti “mulai sekarang”.
- source_word: עֵינַי
  choice: mata-Ku
  rationale: Mempertahankan bentuk jamak dengan kepunyaan orang pertama serta gambaran antropomorfis tentang perhatian Allah.
- source_word: יִהְיוּ פְתֻחוֹת
  choice: akan terbuka
  rationale: Gabungan verba keadaan dengan partisip pasif menyatakan keadaan yang akan berlaku; terjemahan ini mempertahankan daya statifnya.
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: dan telinga-Ku akan menyimak
  rationale: “Menyimak” mengungkapkan tindakan mendengarkan dengan penuh perhatian dalam bahasa Indonesia yang alami, sambil mempertahankan gambaran konkret “telinga-Ku”.
- source_word: לִתְפִלַּת
  choice: doa yang dipanjatkan
  rationale: Preposisi ל menandai arah perhatian kepada doa. Kata “dipanjatkan” membuat hubungan sintaksis dengan tempat menjadi alami dalam bahasa Indonesia, tanpa mengubah doa tunggal menjadi bentuk jamak.
- source_word: הַמָּקוֹם הַזֶּה
  choice: di tempat ini
  rationale: Secara harfiah frasa ini berada dalam konstruksi “doa tempat ini.” Dalam konteks, “di tempat ini” secara alami menyatakan doa yang terkait dengan bait/tempat tersebut; kemungkinan hubungan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa antropomorfis tentang penglihatan dan pendengaran Allah
  choice: Mempertahankan “mata-Ku” dan “telinga-Ku”
  alternative: Mengabstraksikannya menjadi “Aku akan melihat dan mendengarkan” atau “Aku akan memperhatikan”
  rationale: Teks Ibrani memakai gambaran anggota tubuh untuk menyatakan perhatian Allah. Mempertahankannya menjaga kekuatan relasional dan perjanjian dalam ungkapan sumber tanpa menetapkan teori mengenai hakikat jasmani Allah.
- issue: Hubungan doa dengan “tempat ini”
  choice: Doa yang dipanjatkan di tempat ini
  alternative: Doa dari tempat ini; doa tempat ini
  rationale: Konstruksi genitif Ibrani tetap memiliki kelonggaran makna. Teks utama memakai ungkapan Indonesia yang paling alami dalam konteks, sedangkan kemungkinan “dari” dan bentuk harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada akhiran pronominal “-Ku” menandai bahwa pembicara adalah Allah sesuai kebiasaan penulisan Alkitab bahasa Indonesia. Paralelisme antara mata dan telinga dipertahankan, sementara “menyimak” dipilih agar ungkapannya wajar bagi pembaca masa kini.
