  text: וַ/יְכַ֧ל שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל הַ/בָּ֜א עַל לֵ֣ב שְׁלֹמֹ֗ה לַ/עֲשׂ֧וֹת בְּ/בֵית יְהוָ֛ה וּ/בְ/בֵית֖/וֹ הִצְלִֽיחַ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: id
  text: Demikianlah Salomo menyelesaikan rumah Yahweh dan istana raja.[a] Segala sesuatu yang timbul dalam hati Salomo[b] untuk dikerjakan di rumah Yahweh dan di istananya sendiri berhasil ia laksanakan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah raja.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “yang timbul dalam hati Salomo” berarti apa yang ingin atau dimaksudkannya untuk dilakukan.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “ia berhasil” atau “ia membuatnya berhasil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: menyelesaikan
  rationale: Bentuk naratif dari כלה menyatakan bahwa Salomo menuntaskan pembangunan kedua bangunan yang menjadi objek langsung verba tersebut.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora harfiah בֵּית, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Dalam konteks bangunan kerajaan, בית המלך secara alami berarti istana raja; pilihan ini menghindari ungkapan Indonesia yang kaku tanpa mengubah acuannya.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: segala sesuatu yang timbul dalam hati Salomo
  rationale: Mempertahankan citra idiom Ibrani tentang sesuatu yang muncul dalam hati, sekaligus tetap dapat dipahami sebagai maksud atau keinginan.
- source_word: לַעֲשׂוֹת
  choice: untuk dikerjakan
  rationale: Bentuk pasif dalam bahasa Indonesia menghubungkan secara wajar segala sesuatu yang direncanakan dengan pelaksanaannya.
- source_word: וּבְבֵיתוֹ
  choice: di istananya sendiri
  rationale: Akhiran pronominal menunjuk kepada Salomo; 'sendiri' memperjelas pembedaan dari rumah Yahweh, sedangkan 'istana' sesuai dengan konteks kediaman raja.
- source_word: הִצְלִיחַ
  choice: berhasil ia laksanakan
  rationale: Hifil הצליח dapat berarti berhasil atau membuat berhasil. Susunan ini menjaga nuansa keberhasilan sekaligus menyatakan pelaksanaan rencana dalam konteks pembangunan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton; 'Yahweh' mempertahankan nama ilahi sebagai nama diri dan mengikuti lapisan konsultasi yang diberikan.
- issue: Nuansa kausatif atau intransitif הִצְלִיחַ
  choice: berhasil ia laksanakan
  alternative: ia berhasil / ia membuatnya berhasil
  rationale: Bentuk Ibrani dapat menyoroti keberhasilan Salomo atau keberhasilan yang ia hasilkan. Rumusan utama mengungkapkan kedua unsur tanpa menetapkan secara sempit salah satunya; catatan kaki mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rumah Yahweh' mempertahankan citra sumber, sedangkan 'istana raja' dan 'istananya sendiri' merupakan padanan Indonesia yang alami bagi kediaman kerajaan. Susunan dua kalimat mengurangi beban sintaksis ayat Ibrani yang panjang tanpa menghilangkan hubungan maknanya.
