  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: id
  text: 'Para imam berdiri di tempat tugas mereka, dan orang-orang Lewi berdiri dengan alat-alat musik untuk nyanyian bagi Yahweh[a], yang telah dibuat oleh Raja Daud untuk mengucap syukur kepada Yahweh: “Sebab kasih setia-Nya kekal.”[b] Ketika Daud menyampaikan pujian melalui mereka[c], para imam meniup trompet berhadapan dengan mereka, sementara seluruh Israel berdiri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dengan alat-alat musik Yahweh.” Frasa Ibraninya dapat menunjuk pada alat-alat yang dikhususkan bagi Yahweh atau pada alat-alat yang digunakan untuk nyanyian bagi-Nya.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Sebab kasih setia-Nya untuk selama-lamanya.” Kata “kekal” digunakan untuk menyatakan ungkapan Ibrani itu secara wajar dalam bahasa Indonesia.'
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “ketika Daud memuji melalui tangan mereka.” Ungkapan Ibraninya padat dan tampaknya berarti bahwa orang-orang Lewi membawakan pujian Daud sebagai perantaranya.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: tempat tugas mereka
  rationale: Kata ini menunjuk pada tempat atau giliran pelayanan yang telah ditetapkan. “Tempat tugas” alami dalam bahasa Indonesia dan mencakup unsur penempatan serta tanggung jawab.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: dengan alat-alat pengiring nyanyian bagi Yahweh
  rationale: Frasa ini menghubungkan alat-alat tersebut dengan nyanyian yang ditujukan atau dikhususkan bagi Yahweh. Kata “pengiring” menjelaskan fungsi musikalnya tanpa memutus hubungan konstruksi dengan nama ilahi.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: untuk mengucap syukur kepada Yahweh
  rationale: Dalam konteks rumusan syukur yang langsung menyusul, verba ידה paling tepat menyatakan pengucapan syukur, sekalipun juga dapat mencakup pujian.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: Sebab kasih setia-Nya kekal selama-lamanya
  rationale: חֶסֶד memadukan kasih, kebaikan, dan kesetiaan yang teguh; “kasih setia” mempertahankan keluasan itu. “Kekal” melengkapi ungkapan nominal Ibrani secara idiomatis.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: Ketika Daud menyampaikan pujian melalui mereka
  rationale: Susunan Ibraninya padat dan menggambarkan pujian Daud dilaksanakan dengan perantaraan orang-orang Lewi. Terjemahan ini mempertahankan Daud sebagai pelaku gramatikal tanpa menyiratkan bahwa ia sendiri memainkan alat-alat itu.
- source_word: מחצצרים
  choice: meniup trompet
  rationale: Verba ini secara khusus berarti membunyikan trompet. “Meniup trompet” konkret dan mudah dipahami pembaca modern.
- source_word: נֶגְדָּם
  choice: di seberang mereka
  rationale: Preposisi ini menyatakan posisi berhadapan atau di depan. “Di seberang mereka” mempertahankan relasi spasial tanpa menambahkan makna seremonial.
- source_word: עֹמְדִים
  choice: berdiri
  rationale: Partisipel menggambarkan keadaan yang sedang berlangsung dalam adegan upacara; bahasa Indonesia cukup menyatakannya dengan “berdiri”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan makna חֶסֶד
  choice: kasih setia
  alternative: belas kasih; kemurahan; kasih perjanjian
  rationale: “Kasih setia” mempertahankan secara seimbang unsur kasih, kemurahan, keteguhan, dan kesetiaan, tanpa mempersempitnya menjadi satu aspek teologis saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Istilah “trompet” dipilih daripada istilah tradisional “nafiri” atau “sangkakala” demi kejelasan bagi pembaca umum. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
