  terminology: “Yahweh,” “kasih setia,” “orang-orang Lewi,” dan “trompet” konsisten serta sesuai register. “Kasih setia-Nya kekal” mempertahankan keluasan חֶסֶד dan menghindari pengulangan makna “selama-lamanya.”
