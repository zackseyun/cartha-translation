base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: id
  text: maka Aku akan meneguhkan takhta kerajaanmu, sebagaimana Aku telah mengikat perjanjian dengan Daud, ayahmu, dengan berfirman, “Tidak akan terputus dari keturunanmu seorang laki-laki yang memerintah Israel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Engkau tidak akan kekurangan seorang laki-laki untuk memerintah Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: maka Aku akan meneguhkan
  rationale: Bentuk Hifil dari קום berarti membuat tetap berdiri atau meneguhkan. Dalam rangkaian syarat dari ayat sebelumnya, “maka” menandai akibatnya secara alami.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: takhta kerajaanmu
  rationale: Mempertahankan kedua unsur dalam konstruksi Ibrani, yakni “takhta” dan “kerajaan,” dengan ungkapan Indonesia yang wajar.
- source_word: כַּאֲשֶׁר כָּרַתִּי
  choice: sebagaimana Aku telah mengikat perjanjian
  rationale: כרת dalam konteks ini merupakan ungkapan baku untuk membuat atau mengikat perjanjian; kata “perjanjian” tersirat dalam bahasa Ibrani dan perlu dinyatakan agar maknanya jelas dalam bahasa Indonesia.
- source_word: לְדָוִיד אָבִיךָ
  choice: dengan Daud, ayahmu
  rationale: Preposisi diterjemahkan sesuai pasangan alami “mengikat perjanjian dengan.” Daud memang ayah Salomo, sehingga “ayahmu” tepat dan tidak memerlukan perluasan makna.
- source_word: לֵאמֹר
  choice: dengan berfirman
  rationale: Memperkenalkan kutipan langsung. Karena penuturnya adalah Allah, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: לֹא יִכָּרֵת לְךָ
  choice: tidak akan terputus darimu
  rationale: Mempertahankan gambaran harfiah verba Nifal כרת, “terputus,” serta hubungan dengan penerima janji melalui “darimu,” tanpa langsung menggantinya dengan tafsiran idiomatis.
- source_word: אִישׁ מוֹשֵׁל
  choice: seorang laki-laki yang memerintah
  rationale: אִישׁ berbentuk maskulin tunggal dan menunjuk pada penerus dinasti laki-laki; bentuk partisipel מוֹשֵׁל diterjemahkan secara atributif sebagai “yang memerintah.”
- source_word: בְּיִשְׂרָאֵל
  choice: atas Israel
  rationale: Dengan verba משל, preposisi בְּ menyatakan kekuasaan pemerintahan; “atas Israel” menyampaikan hubungan itu dengan jelas.
theological_decisions:
- issue: Rumusan janji dinasti kepada Daud
  choice: “Tidak akan terputus darimu seorang laki-laki yang memerintah atas Israel.”
  alternative: “Engkau tidak akan kekurangan seorang laki-laki untuk memerintah atas Israel.”
  rationale: Teks utama mempertahankan metafora Ibrani “terputus” dan ketegangan ungkapannya. Catatan kaki menyediakan arti idiomatis yang memperjelas kesinambungan garis dinasti tanpa memasukkannya secara diam-diam ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Aku” mengikuti rujukan kepada Allah. Susunan kalimat dijaga dekat dengan sumber Ibrani, sedangkan catatan kaki menjelaskan idiom dinasti yang kurang lazim dalam bahasa Indonesia.
