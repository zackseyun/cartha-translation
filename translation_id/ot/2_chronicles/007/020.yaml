base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: id
  text: maka Aku akan mencabut mereka dari tanah-Ku yang telah Kuberikan kepada mereka, dan rumah ini, yang telah Kukuduskan bagi nama-Ku, akan Kubuang dari hadapan-Ku.[a] Aku akan menjadikannya peribahasa dan bahan ejekan di antara segala bangsa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari depan wajah-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sindiran dan sasaran cemoohan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: maka Aku akan mencabut mereka
  rationale: Kata נתשׁ menggambarkan tindakan mencabut sampai terlepas, sehingga mempertahankan citra umat yang dicabut dari tanah perjanjian. Kata penghubung diterjemahkan 'maka' karena ayat ini merupakan akibat dalam rangkaian bersyarat ayat sebelumnya.
- source_word: מֵעַל אַדְמָתִי
  choice: dari tanah-Ku
  rationale: אֲדָמָה dapat berarti tanah, lahan, atau negeri. 'Tanah-Ku' alami dalam bahasa Indonesia dan mempertahankan gambaran tanah sekaligus kepemilikan ilahi.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: yang telah Kuberikan kepada mereka
  rationale: Menyampaikan klausa relatif secara langsung dan menunjukkan bahwa tanah itu merupakan pemberian Allah yang sudah diterima umat.
- source_word: הַבַּיִת הַזֶּה
  choice: rumah ini
  rationale: בַּיִת secara harfiah berarti 'rumah' dan dalam konteks ini menunjuk kepada Bait Allah. Bentuk harfiah dipertahankan karena istilah rumah Allah dapat dipahami dari konteks dan mengandung bobot teologis sumber.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: telah Kukuduskan bagi nama-Ku
  rationale: Bentuk hiphil קדשׁ berarti menetapkan atau mengkhususkan sebagai kudus. 'Kukuduskan' mempertahankan daya kultisnya, sedangkan 'bagi nama-Ku' menjaga konsep teologis nama ilahi tanpa memparafrasakannya menjadi 'bagi diri-Ku'.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: akan Kubuang dari hadapan-Ku
  rationale: Ungkapan Ibrani secara harfiah berarti membuang 'dari depan wajah-Ku'. 'Dari hadapan-Ku' merupakan idiom Indonesia yang wajar, tetap dekat dengan metafora wajah atau kehadiran ilahi, dan menyatakan penolakan tanpa menjelaskan secara berlebihan.
- source_word: וְאֶתְּנֶנּוּ
  choice: Aku akan menjadikannya
  rationale: נתן dengan nomina predikatif di sini menyatakan penetapan suatu keadaan; 'menjadikannya' adalah padanan Indonesia yang jelas.
- source_word: לְמָשָׁל
  choice: peribahasa
  rationale: מָשָׁל dapat berarti peribahasa, ungkapan, atau ejekan. 'Peribahasa' mempertahankan arti dasar tanpa menutup nuansa penghinaan yang dijelaskan oleh kata pasangannya.
- source_word: לִשְׁנִינָה
  choice: bahan ejekan
  rationale: שְׁנִינָה menunjuk kepada ungkapan sindiran atau sesuatu yang dijadikan sasaran cemoohan. 'Bahan ejekan' jelas bagi pembaca modern serta mempertahankan nuansa penghinaan di depan umum.
- source_word: בְּכָל הָעַמִּים
  choice: di antara segala bangsa
  rationale: עַמִּים adalah bentuk jamak dari 'bangsa/kaum'. 'Segala bangsa' merupakan ungkapan Indonesia yang alami dan tetap menunjukkan cakupan luas lintas kelompok manusia.
theological_decisions:
- issue: Istilah bagi Bait Allah
  choice: rumah ini
  alternative: Bait ini
  rationale: Teks Ibrani memakai בַּיִת, 'rumah', sebagai sebutan bagi Bait Allah. Mempertahankan 'rumah' menjaga metafora dan teologi rumah Allah tanpa mengaburkan rujukan kontekstualnya.
- issue: Ungkapan penolakan ilahi
  choice: akan Kubuang dari hadapan-Ku
  alternative: akan Kubuang dari pandangan-Ku
  rationale: '''Dari hadapan-Ku'' mempertahankan idiom yang berhubungan dengan wajah atau kehadiran Allah. Rumusan ini menyampaikan penolakan ilahi tanpa menentukan secara sempit apakah maksudnya hanya pandangan atau kehadiran.'
- issue: Nuansa pasangan מָשָׁל dan שְׁנִינָה
  choice: peribahasa dan bahan ejekan
  alternative: sindiran dan buah bibir
  rationale: Pilihan ini mempertahankan arti luas מָשָׁל sekaligus membuat unsur penghinaan dalam שְׁנִינָה jelas. Ketegangan leksikal dijaga melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina serta bentuk terikat yang merujuk kepada Allah memakai huruf kapital. Struktur ayat mengikuti rangkaian akibat dari ayat sebelumnya. Istilah 'rumah' sengaja dipertahankan untuk merepresentasikan בַּיִת, sementara catatan kaki hanya dipakai bagi idiom dan ambiguitas yang sungguh terdapat dalam bahasa sumber.
