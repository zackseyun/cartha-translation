language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: id
  text: 'Ketika seluruh umat Israel melihat api turun dan kemuliaan Yahweh berada di atas rumah itu,[a] mereka membungkukkan diri dengan wajah ke tanah di atas lantai batu. Mereka menyembah dan mengucap syukur kepada Yahweh: “Sebab Dia baik; kasih setia-Nya untuk selama-lamanya.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah itu” merujuk pada bait Allah.
    reason: cultural_note
  - marker: b
    text: “Kasih setia” juga dapat diterjemahkan “belas kasih” atau “kesetiaan dalam perjanjian.” Kata Ibraninya mencakup kasih yang teguh dan kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: Ungkapan harfiah 'seluruh anak Israel' merupakan sebutan kolektif bagi bangsa Israel; 'seluruh umat Israel' menyampaikan maknanya secara alami dan inklusif dalam bahasa Indonesia.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: ketika ... melihat api turun
  rationale: Partisipel dan konstruksi infinitif menyatakan keadaan yang berlangsung bersamaan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gerak turun api.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: kemuliaan Yahweh berada di atas rumah itu
  rationale: כָּבוֹד menunjuk pada kemuliaan atau kehadiran ilahi yang tampak. בַּיִת dipertahankan sebagai 'rumah' dengan catatan bahwa yang dimaksud ialah bait.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: mereka berlutut dengan wajah sampai ke tanah, di atas lantai batu
  rationale: כרע menggambarkan tindakan merendahkan tubuh atau berlutut, sedangkan ungkapan berikutnya menegaskan wajah menghadap dan menyentuh tanah. רִצְפָה adalah permukaan yang diperkeras atau dilapisi batu.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: mereka menyembah
  rationale: Karena postur fisiknya sudah disebutkan, 'menyembah' menyampaikan arti ibadah tanpa mengulang deskripsi sujud.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: dan mengucap syukur kepada Yahweh
  rationale: Dalam seruan liturgis ini, bentuk Hifil dari ידה paling tepat bermakna mengucap syukur, dengan nuansa memuji tetap tersirat.
- source_word: כִּי טוֹב
  choice: Sebab Dia baik
  rationale: כִּי memperkenalkan alasan atau seruan pujian; subjek orang ketiga tersirat dalam bahasa Ibrani dan perlu dinyatakan dalam bahasa Indonesia.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: kasih setia-Nya tetap untuk selama-lamanya
  rationale: חֶסֶד mencakup kasih, kemurahan, dan kesetiaan dalam hubungan perjanjian. 'Kasih setia' mempertahankan keluasan itu, sedangkan 'tetap' melengkapi klausa nominal secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankan nama tersebut dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Penerjemahan חַסְדּוֹ dalam seruan liturgis
  choice: kasih setia-Nya
  alternative: belas kasih-Nya atau kesetiaan perjanjian-Nya
  rationale: '''Kasih setia'' cukup luas untuk merangkum kemurahan dan loyalitas relasional tanpa membatasi istilah hanya pada belas kasihan atau membuat unsur perjanjian lebih eksplisit daripada teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan citra api yang turun, kemuliaan di atas bait, tindakan merendahkan diri, dan rumusan pujian liturgis.
