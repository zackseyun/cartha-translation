source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: id
  text: Pada waktu itu Salomo merayakan hari raya itu selama tujuh hari. Seluruh Israel menyertainya—suatu kumpulan yang sangat besar—dari Lebo-Hamat[a] sampai ke Wadi Mesir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan masuk ke Hamat”. Ungkapan Ibrani ini dapat dipahami sebagai nama tempat (“Lebo-Hamat”) atau sebagai sebutan deskriptif untuk suatu batas wilayah.
    reason: alternative_reading
  - marker: b
    text: Atau “Sungai Mesir”. Kata Ibrani yang digunakan dapat menunjuk pada wadi, alur air musiman, atau sungai kecil, bukan sungai besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: merayakan
  rationale: Secara harfiah berarti ‘melakukan/membuat’, tetapi bersama חָג kata ini secara idiomatis berarti merayakan atau menyelenggarakan suatu hari raya.
- source_word: הֶחָג
  choice: hari raya itu
  rationale: חָג menunjuk pada perayaan atau hari raya ziarah; bentuk tentu dalam bahasa Ibrani dipertahankan dengan ‘itu’.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Padanan temporal yang langsung, alami, dan sesuai dengan bahasa Indonesia modern.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: ‘Selama’ menyatakan durasi perayaan secara alami tanpa menambah makna.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Seluruh Israel menyertainya
  rationale: Mempertahankan makna kolektif bangsa Israel dan gagasan bahwa mereka hadir bersama Salomo.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: suatu kumpulan yang sangat besar
  rationale: Frasa ini menjelaskan ‘seluruh Israel’ sebagai orang banyak yang berhimpun; ‘kumpulan’ menghindari nuansa kelembagaan atau gerejawi yang tidak harus ada dalam קָהָל.
- source_word: מִלְּבוֹא חֲמָת
  choice: dari Lebo-Hamat
  rationale: Ungkapan ini lazim dipahami sebagai nama tempat atau penanda geografis tetap di batas utara Israel. Transliterasi mempertahankan kemungkinan toponim tanpa menutup alternatif deskriptif.
- source_word: עַד נַחַל מִצְרַיִם
  choice: sampai ke Sungai Mesir
  rationale: נַחַל dapat menunjuk pada alur air, sungai kecil, atau wadi. ‘Sungai Mesir’ mudah dipahami sebagai nama batas geografis, sedangkan ketepatan alternatif ‘Wadi Mesir’ dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Tanda pisah menampilkan קָהָל גָּדוֹל מְאֹד sebagai keterangan aposisional bagi ‘Seluruh Israel’. Penanda catatan kaki ditempatkan tepat setelah istilah geografis yang dijelaskannya.
