id: 2CH.7.14
reference: 2 Chronicles 7:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: id
  text: jika umat-Ku yang disebut dengan nama-Ku[a] merendahkan diri, berdoa, mencari wajah-Ku, dan berbalik dari jalan-jalan mereka yang jahat, maka Aku akan mendengar dari surga, mengampuni dosa mereka, dan menyembuhkan negeri mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang atas mereka nama-Ku diserukan”; suatu ungkapan Ibrani yang menyatakan bahwa umat itu menyandang nama Allah dan menjadi milik-Nya.
    reason: Menjelaskan idiom Ibrani mengenai nama ilahi, identitas, dan kepemilikan perjanjian.
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: merendahkan diri
  rationale: Bentuk nifal כנע dalam rangkaian bersyarat ini menyatakan sikap merendahkan atau menundukkan diri; pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur kesengajaan.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Menunjukkan kelompok yang menjadi milik Allah dalam hubungan perjanjian. “Umat-Ku” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: yang atasnya nama-Ku diserukan
  rationale: Terjemahan ini mempertahankan bentuk idiom Ibrani dengan cukup dekat. Ungkapan tersebut menandakan bahwa umat itu menyandang nama Allah dan menjadi milik-Nya.
- source_word: וְיִתְפַּלְלוּ
  choice: berdoa
  rationale: Hitpael dari פלל lazim berarti “berdoa”; kepada siapa doa ditujukan sudah jelas dari konteks sehingga objek tidak perlu ditambahkan.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: mencari wajah-Ku
  rationale: Mempertahankan metafora Ibrani tentang mencari hadirat, perhatian, atau perkenanan Allah tanpa mereduksinya menjadi sekadar “mencari Aku”.
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: berbalik dari jalan-jalan mereka yang jahat
  rationale: שׁוב menyatakan perubahan arah yang bersifat moral; bentuk jamak “jalan-jalan” mempertahankan gambaran berbagai pola perilaku.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: maka Aku akan mendengar dari surga
  rationale: “Maka” menandai akibat dari rangkaian syarat. “Dari surga” mencerminkan מן השמים dan lokasi ilahi dalam konteks doa penahbisan.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: mengampuni dosa mereka
  rationale: Nomina Ibrani berbentuk tunggal dan dapat berfungsi kolektif; “dosa mereka” mempertahankan bentuk itu serta terdengar alami.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: memulihkan negeri mereka
  rationale: רפא secara harfiah berarti “menyembuhkan”, tetapi ketika objeknya negeri yang terkena kekeringan, belalang, atau wabah (ay. 13), “memulihkan” menyampaikan metafora itu secara alami dalam bahasa Indonesia tanpa membatasi pemulihan pada kesehatan jasmani.
theological_decisions:
- issue: Struktur bersyarat dari tanggapan Allah
  choice: Membuka ayat dengan “jika” dan menandai jawaban Allah dengan “maka”.
  alternative: Menghubungkan semua klausa hanya dengan “dan”.
  rationale: Walaupun teks Ibrani memakai waw dalam seluruh rangkaian, konteks ayat 13 dan sintaksisnya membentuk pola syarat-akibat. “Jika ... maka” memperjelas hubungan itu tanpa mengubah isinya.
- issue: Idiom nama ilahi atas umat
  choice: 'Mempertahankan citra sumber: “yang atasnya nama-Ku diserukan”.'
  alternative: “yang disebut dengan nama-Ku” atau “yang menyandang nama-Ku”.
  rationale: 'Bentuk yang dipilih menjaga idiom Ibrani dan ketegangan maknanya: nama Allah diserukan atas umat itu, yang menandakan identitas dan kepemilikan perjanjian, bukan sekadar pemberian sebutan.'
- issue: Pemulihan negeri
  choice: Menerjemahkan וְאֶרְפָּא אֶת אַרְצָם sebagai “memulihkan negeri mereka”.
  alternative: “menyembuhkan negeri mereka”.
  rationale: Metafora penyembuhan tetap terwakili oleh pemulihan, sementara konteks langsung mencakup kerusakan negeri akibat kekeringan, belalang, dan wabah. Pilihan ini menghindari pembacaan yang hanya bersifat medis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel dipertahankan agar rangkaian tindakan umat dan tanggapan Allah tetap jelas. Bentuk sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
