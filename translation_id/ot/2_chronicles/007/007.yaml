  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: id
  text: Kemudian Salomo menguduskan bagian tengah pelataran[a] yang di depan rumah Yahweh, karena di sana ia mempersembahkan kurban bakaran dan bagian-bagian lemak dari kurban keselamatan[b], sebab mazbah perunggu yang dibuat Salomo tidak dapat menampung kurban bakaran, persembahan sajian, dan bagian-bagian lemak itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian dalam pelataran.”
    reason: תּוֹךְ dapat berarti bagian tengah maupun bagian dalam suatu ruang.
  - marker: b
    text: Atau “kurban persekutuan”; istilah Ibrani juga berkaitan dengan damai dan kesejahteraan.
    reason: שְׁלָמִים memiliki cakupan makna yang lebih luas daripada satu padanan Indonesia.
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: menguduskan
  rationale: Bentuk Hifil dari קדשׁ menyatakan bahwa tempat itu dikhususkan bagi penggunaan sakral. “Menguduskan” mempertahankan nuansa ibadah dan lazim dalam bahasa Indonesia Alkitabiah tanpa menjadi terlalu arkais.
- source_word: תּוֹךְ הֶחָצֵר
  choice: bagian tengah pelataran
  rationale: תּוֹךְ dapat menunjuk bagian tengah atau bagian dalam. Dalam konteks ini, yang dimaksud ialah suatu bagian pelataran yang turut dipakai untuk persembahan karena kapasitas mazbah tidak mencukupi.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: di depan rumah Yahweh
  rationale: לִפְנֵי bersifat spasial, sedangkan בֵית יְהוָה secara harfiah adalah “rumah Yahweh,” yaitu bangunan Bait Suci.
- source_word: עָשָׂה שָׁם
  choice: di sanalah ia mempersembahkan
  rationale: Walaupun עשה secara dasar berarti “melakukan” atau “membuat,” dalam konteks kurban kata ini berfungsi sebagai ungkapan idiomatis untuk tindakan mempersembahkan kurban.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: kurban-kurban bakaran / kurban bakaran
  rationale: עלה adalah istilah baku bagi kurban yang dibakar. Bentuk jamak pada kemunculan pertama dan bentuk tunggal kolektif pada kemunculan kedua tercermin dalam terjemahan.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: bagian-bagian lemak dari kurban-kurban keselamatan
  rationale: חלב menunjuk bagian lemak tertentu yang dibakar di mazbah, bukan sekadar bagian terbaik secara kiasan. שְׁלָמִים diterjemahkan “kurban keselamatan,” sambil mencatat alternatif “kurban persekutuan.”
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: mazbah perunggu
  rationale: Dalam konteks perlengkapan Bait Suci, נְחֹשֶׁת paling wajar diterjemahkan “perunggu.” “Mazbah” mempertahankan istilah ibadah yang mapan dan membedakannya dari meja biasa.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: tidak cukup untuk menampung
  rationale: Ungkapan ini menyatakan ketidakmampuan mazbah menampung banyaknya persembahan. Penambahan “cukup” membuat hubungan kapasitasnya jelas dan alami dalam bahasa Indonesia.
- source_word: הַמִּנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks kurban, מִנְחָה merupakan istilah teknis untuk persembahan berbahan hasil biji-bijian. “Persembahan sajian” adalah padanan Indonesia yang mapan.
- source_word: הַחֲלָבִים
  choice: bagian-bagian lemak itu
  rationale: Bentuk jamak menunjuk potongan-potongan lemak kurban. Kata “itu” secara alami menghubungkannya dengan bagian lemak yang telah disebut sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi tersebut, bukan menggantinya dengan gelar.
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan atau kurban pendamaian
  rationale: Istilah Ibrani berkaitan dengan keadaan sejahtera, damai, dan persekutuan, sehingga tidak seluruh nuansanya tertampung oleh satu padanan. “Kurban keselamatan” dipilih sebagai istilah utama, dengan alternatif dicatat agar ketegangan leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Istilah ibadah yang sudah mapan seperti “menguduskan,” “mazbah,” “kurban bakaran,” dan “persembahan sajian” dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca masa kini.
