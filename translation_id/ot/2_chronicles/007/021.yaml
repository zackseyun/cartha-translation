source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: id
  text: Dan rumah ini[b], yang dahulu tinggi, akan membuat setiap orang yang melewatinya tercengang[a]. Mereka akan berkata, “Mengapa Yahweh berbuat demikian terhadap negeri ini dan rumah ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan tertegun” atau “akan merasa ngeri.” Kata Ibrani ini dapat menyatakan keterkejutan atau kengerian yang ditimbulkan oleh kehancuran.
    reason: lexical_alternative
  - marker: b
    text: “Rumah” di sini merujuk kepada Bait Allah.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Dan rumah ini
  rationale: בַּיִת secara harfiah berarti “rumah” dan dalam konteks ini menunjuk kepada Bait Allah. “Rumah” mempertahankan ungkapan Ibrani serta gema perjanjiannya.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: yang dahulu begitu mulia
  rationale: עֶלְיוֹן menyatakan keadaan yang tinggi atau terkemuka. Dalam konteks bangunan Bait Allah sebelum dihukum, “dahulu begitu mulia” menyampaikan keagungan sebelumnya secara alami tanpa membatasinya pada ketinggian fisik.
- source_word: לְכָל עֹבֵר עָלָיו
  choice: setiap orang yang melewatinya
  rationale: Terjemahan ini mengikuti ungkapan partisipial Ibrani dan secara wajar menggambarkan orang-orang yang melintas di dekat situs itu.
- source_word: יִשֹּׁם
  choice: akan membuat ... tercengang
  rationale: Bentuk dari שמם dapat menunjuk pada kehancuran atau ketandusan dan juga rasa ngeri atau tercengang yang ditimbulkannya. Susunan ini mempertahankan fokus kontekstual pada reaksi orang yang lewat tanpa meniadakan keadaan mengenaskan rumah itu.
- source_word: וְאָמַר
  choice: Mereka akan berkata
  rationale: Walaupun verba Ibraninya berbentuk tunggal, subjek kolektif-distributif “setiap orang” secara alami dirujuk dengan bentuk jamak dalam bahasa Indonesia.
- source_word: בַּמֶּה
  choice: Mengapa
  rationale: Secara harfiah berarti “karena apa?”; “Mengapa” merupakan padanan Indonesia yang langsung dan idiomatis.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh berbuat seperti ini
  rationale: Perfek Ibrani menunjuk kepada tindakan yang menghasilkan keadaan yang sedang terlihat. “Berbuat seperti ini” alami dalam pertanyaan bahasa Indonesia dan mempertahankan kata tunjuk כָּכָה.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: terhadap negeri ini dan rumah ini
  rationale: “Negeri” sesuai untuk אֶרֶץ dalam konteks wilayah Israel, sedangkan pengulangan “rumah” menjaga konsistensi leksikal ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama diri itu dan tidak menggantinya dengan gelar.
- issue: Makna nasib Bait Allah dalam יִשֹּׁם
  choice: akan membuat setiap orang ... tercengang
  alternative: akan menjadi tandus; akan menjadi sesuatu yang mengerikan
  rationale: Kata tersebut mencakup kehancuran dan reaksi ngeri atau tercengang. Pilihan utama menonjolkan reaksi orang-orang yang lewat sebagaimana dituntut sintaksis dan konteks, sementara catatan kaki mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Rumah” dipertahankan untuk kedekatan dengan teks Ibrani, sedangkan “dahulu begitu mulia” mengungkapkan keunggulan sebelumnya secara alami. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
