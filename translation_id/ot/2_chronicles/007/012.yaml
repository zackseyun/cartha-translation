  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: id
  text: Kemudian Yahweh menampakkan diri kepada Salomo pada malam hari dan berfirman kepadanya, “Aku telah mendengar doamu dan telah memilih tempat ini bagi-Ku sebagai rumah persembahan kurban[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk menjadi rumah kurban,” yakni tempat yang dikhususkan untuk mempersembahkan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Nifal dari ראה dalam konteks ini menyatakan bahwa Yahweh menyatakan kehadiran-Nya kepada Salomo; ‘menampakkan diri’ alami dalam bahasa Indonesia dan tidak menentukan bagaimana penampakan itu terjadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani dipertahankan.
- source_word: בַּלָּיְלָה
  choice: pada malam hari
  rationale: Ungkapan ini secara alami menyatakan waktu kejadian dalam bahasa Indonesia; ‘pada malam hari’ mempertahankan arti tanpa kekakuan harfiah.
- source_word: שָׁמַעְתִּי
  choice: Aku telah mendengar
  rationale: Bentuk perfektum melaporkan tindakan yang sudah selesai dan relevan bagi jawaban Yahweh saat itu.
- source_word: תְּפִלָּתֶךָ
  choice: doamu
  rationale: תְּפִלָּה secara langsung berarti doa; bentuk posesif orang kedua tunggal diterjemahkan alami sebagai ‘doamu’.
- source_word: וּבָחַרְתִּי
  choice: dan telah memilih
  rationale: Bentuk perfektum sejajar dengan ‘telah mendengar’ dan menyatakan keputusan ilahi yang telah dibuat serta tetap berlaku.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: tempat ini
  rationale: Terjemahan langsung dan alami yang merujuk pada lokasi rumah Tuhan yang baru ditahbiskan.
- source_word: לִי
  choice: bagi-Ku
  rationale: Dativus ini menyatakan peruntukan atau kepemilikan ilahi; ‘bagi-Ku’ mempertahankan keduanya tanpa menambahkan unsur refleksif yang tidak perlu.
- source_word: לְבֵית זָבַח
  choice: sebagai rumah persembahan kurban
  rationale: Ungkapan ini secara harfiah adalah ‘sebagai/untuk rumah kurban’. ‘Rumah persembahan kurban’ mempertahankan metafora rumah dan memperjelas bahwa yang dimaksud ialah tempat ibadah dengan persembahan kurban, tanpa menggantinya secara interpretatif dengan ‘bait’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה. Bentuk ‘Yahweh’ mempertahankan nama itu, sedangkan ‘TUHAN’ menggantinya dengan gelar dan ‘Yehova’ mencerminkan bentuk pelafalan sekunder.
- issue: Fungsi rumah yang dipilih Yahweh
  choice: rumah persembahan kurban
  alternative: rumah kurban; bait untuk mempersembahkan kurban
  rationale: Pilihan utama mempertahankan ungkapan Ibrani yang padat sekaligus menjelaskan bahwa זבח berkaitan dengan persembahan kurban. Terjemahan tidak mempersempit fungsi rumah itu melampaui pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Berfirman’ dipakai untuk ujaran langsung Yahweh; kapitalisasi pronomina ilahi mengikuti konvensi Indonesia. Struktur kalimat tetap dekat dengan urutan narasi Ibrani, sementara ‘pada malam hari’ dan ‘rumah persembahan kurban’ dipilih agar mudah dipahami pembaca umum.
