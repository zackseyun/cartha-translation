revisions:
- from: Pada hari kedua puluh tiga bulan ketujuh, Salomo menyuruh rakyat pulang ke kemah mereka.[a] Mereka bersukacita dan bergembira hati karena kebaikan yang telah Yahweh lakukan bagi Daud, Salomo, dan Israel, umat-Nya.
  to: Pada hari kedua puluh tiga bulan ketujuh, Salomo menyuruh rakyat pulang ke kemah mereka.[a] Mereka bersukacita dan dengan hati yang gembira karena kebaikan yang telah Yahweh tunjukkan kepada Daud, Salomo, dan Israel, umat-Nya.
  rationale: Revisi terbatas pada dua ungkapan yang kurang alami. Struktur dua kalimat, penjelasan subjek sebagai Salomo, nama ilahi Yahweh, dan catatan alternatif untuk “kemah” dipertahankan.
