base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: id
  text: Pada hari kedua puluh tiga bulan ketujuh, Salomo menyuruh rakyat pulang ke kemah mereka.[a] Mereka bersukacita dan dengan hati yang gembira karena kebaikan yang telah Yahweh tunjukkan kepada Daud, Salomo, dan Israel, umat-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke rumah mereka”; secara harfiah, “ke kemah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: Pada hari kedua puluh tiga bulan ketujuh
  rationale: Menggunakan ungkapan tanggal Indonesia yang alami. Waw tidak perlu diterjemahkan sebagai “dan” karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
- source_word: שִׁלַּח
  choice: Salomo menyuruh ... pulang
  rationale: Subjek tersirat dijelaskan sebagai Salomo dari konteks dekat, sedangkan konstruksi ini menyampaikan bahwa ia melepas rakyat untuk kembali ke tempat tinggal mereka.
- source_word: לְאָהֳלֵיהֶם
  choice: ke kemah mereka
  rationale: Mempertahankan citra konkret teks Ibrani; makna idiomatis “ke rumah mereka” dicatat dalam catatan kaki.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: Mereka bersukacita dan bergembira hati
  rationale: Mengungkapkan keadaan rakyat secara alami sambil mempertahankan unsur “hati” dari idiom Ibrani.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: karena kebaikan yang telah ... lakukan
  rationale: Menerjemahkan עשה secara langsung sebagai “lakukan” dan הטובה sebagai “kebaikan”; dalam bahasa Indonesia gabungan ini tetap wajar dan menyatakan tindakan kemurahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: bagi Daud, Salomo, dan Israel, umat-Nya
  rationale: “Bagi” menyatakan pihak-pihak yang menerima manfaat dari kebaikan Yahweh. Aposisi “umat-Nya” dipertahankan dan koma memperjelas bahwa frasa itu menerangkan Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk tradisional lain.
- issue: Hubungan kebaikan Yahweh dengan Daud, Salomo, dan Israel
  choice: kebaikan yang telah Yahweh lakukan bagi Daud, Salomo, dan Israel
  alternative: kebaikan yang telah Yahweh tunjukkan kepada Daud, Salomo, dan Israel
  rationale: Pilihan utama lebih dekat dengan עָשָׂה לְ dan tetap alami dalam bahasa Indonesia, tanpa menentukan secara lebih sempit bentuk kebaikan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dipahami. Nama Salomo dinyatakan secara eksplisit untuk menjernihkan subjek tersirat berdasarkan konteks, tanpa mengubah pelaku tindakan.
