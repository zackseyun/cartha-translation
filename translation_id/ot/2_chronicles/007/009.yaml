base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: id
  text: Pada hari kedelapan mereka mengadakan pertemuan khidmat[a], sebab mereka merayakan[b] pentahbisan mezbah selama tujuh hari dan hari raya itu selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertemuan” atau “pertemuan penutup”. Kata Ibrani עֲצָרֶת menunjuk pada pertemuan khusus dalam konteks hari raya keagamaan, sering kali sebagai pertemuan penutup.
    reason: lexical_alternative
  - marker: b
    text: Atau “melaksanakan”; secara lebih harfiah, “melakukan” pentahbisan mezbah selama tujuh hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Menerjemahkan keterangan waktu secara langsung tanpa menambahkan keterangan tentang hari raya yang tidak terdapat dalam ayat ini.
- source_word: עֲצָרֶת
  choice: pertemuan khidmat
  rationale: Kata ini menunjuk pada pertemuan khusus dalam konteks hari raya keagamaan, biasanya sebagai pertemuan penutup. 'Pertemuan khidmat' mempertahankan bobot sakralnya tanpa membuat fungsi penutup menjadi lebih eksplisit daripada bentuk Ibraninya.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi pertemuan pada hari kedelapan.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: penahbisan mazbah
  rationale: '''Penahbisan'' menyampaikan tindakan meresmikan atau mengkhususkan mazbah untuk penggunaannya, sedangkan ''mazbah'' merupakan istilah Indonesia yang tepat bagi altar persembahan dalam konteks ini.'
- source_word: עָשׂוּ
  choice: merayakan
  rationale: Secara harfiah verba ini berarti 'melakukan' atau 'membuat', tetapi dalam konteks pelaksanaan penahbisan dan hari raya, 'merayakan' menghasilkan bahasa Indonesia yang alami sambil mempertahankan makna kegiatan seremonial.
- source_word: וְהֶחָג
  choice: dan hari raya itu
  rationale: Artikel tertentu dipertahankan dengan 'itu'. 'Hari raya' lebih jelas dan lazim bagi pembaca Indonesia daripada 'perayaan' sebagai nama peristiwa keagamaan tertentu.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Preposisi 'selama' menyatakan durasi secara alami dalam bahasa Indonesia.
