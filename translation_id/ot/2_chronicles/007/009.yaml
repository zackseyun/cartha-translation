translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat serta pengulangan durasi tujuh hari dipertahankan. Terjemahan tidak secara eksplisit menyebut Hari Raya Pondok Daun karena nama itu tidak terdapat dalam ayat ini.
