  text: Then the king and all the people offered sacrifices before Yahweh[a].
translation:
  language: id
  text: Kemudian raja dan seluruh rakyat mempersembahkan kurban di hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “menyembelih sembelihan”, suatu ungkapan dengan kata kerja dan kata benda dari akar yang sama yang berarti mempersembahkan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Kemudian raja
  rationale: Konjungsi וְ melanjutkan urutan narasi; “Kemudian” menyampaikan kelanjutan itu secara alami, sedangkan הַמֶּלֶךְ berarti “raja”.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: עָם berarti “rakyat/umat”; dalam konteks ini menunjuk kepada seluruh rakyat yang hadir bersama raja. “Seluruh rakyat” alami dan tidak mempersempitnya menjadi hanya suatu majelis.
- source_word: זֹבְחִים זֶבַח
  choice: mempersembahkan kurban
  rationale: Bentuk partisipel זֹבְחִים dengan objek serumpun זֶבַח secara harfiah mengulang gagasan “mengurbankan kurban”. Bahasa Indonesia secara alami menyatakannya sebagai “mempersembahkan kurban”; konteks dan bentuk partisipel menggambarkan tindakan yang sedang berlangsung, tanpa perlu konstruksi progresif yang kaku.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini berarti “di depan/di hadapan” dan di sini menandakan tindakan yang dilakukan dalam hadirat Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu dan membedakannya dari gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kurban” dipilih sebagai ejaan baku untuk persembahan sembelihan; konstruksi serumpun Ibrani dibuat alami dalam teks utama dan dijelaskan dalam catatan kaki.
