id: 2CH.16.7
reference: 2 Chronicles 16:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: id
  text: Pada waktu itu, Hanani, sang pelihat, datang menemui Asa, raja Yehuda, dan berkata kepadanya, “Karena engkau mengandalkan raja Aram[a] dan tidak mengandalkan Yahweh, Allahmu, maka pasukan raja Aram telah lolos dari tanganmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raja Suriah.” Teks Ibrani berbunyi “Aram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia; waw penghubung tidak perlu diterjemahkan tersendiri.
- source_word: הָרֹאֶה
  choice: pelihat
  rationale: Mempertahankan gelar kenabian khusus רֹאֶה dan membedakannya dari istilah umum 'nabi'.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: Karena engkau mengandalkan ... dan tidak mengandalkan
  rationale: Menyampaikan makna ketergantungan politis dan teologis dengan jelas serta mempertahankan pengulangan verba Ibrani.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Mempertahankan nama geografis yang terdapat dalam teks Ibrani, bukan menggantinya dengan padanan historis yang lebih kemudian, 'Suriah'.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Menerjemahkan nama perjanjian יְהוָה secara langsung dan mempertahankan hubungan posesif dalam אֱלֹהֶיךָ.
- source_word: עַל כֵּן
  choice: maka
  rationale: Penanda akibat yang ringkas dan wajar setelah anak kalimat sebab dalam bahasa Indonesia.
- source_word: נִמְלַט
  choice: telah lolos
  rationale: Menunjukkan tindakan yang sudah terjadi dengan hasil yang masih relevan; dalam konteks militer, 'lolos' menyatakan terlepas dari penguasaan Asa.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: pasukan raja Aram
  rationale: חֵיל di sini menunjuk kekuatan militer; 'pasukan' alami dan tepat dalam konteks ini.
- source_word: מִיָּדֶךָ
  choice: dari tanganmu
  rationale: Mempertahankan metafora Ibrani yang juga dapat dipahami dalam bahasa Indonesia sebagai kuasa atau kendali.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Hubungan sebab-akibat antara ketergantungan Asa dan lolosnya pasukan Aram
  choice: Karena ... maka ...
  alternative: Ketika engkau mengandalkan ... pasukan ... lolos
  rationale: Konstruksi infinitif dengan ב dan עַל כֵּן menyatakan dasar tuduhan dan akibatnya; hubungan kausal perlu tampak tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' sesuai dengan teguran langsung kepada seorang raja dan menjaga bentuk tunggal. Tanda koma mengapit aposisi agar struktur kalimat mudah dipahami.
