  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: id
  text: Sebab mata Yahweh menjelajahi seluruh bumi untuk menguatkan orang-orang yang hatinya sepenuhnya tertuju kepada-Nya.[a] Dalam hal ini engkau telah bertindak bodoh. Sebab, mulai sekarang engkau akan mengalami peperangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk menunjukkan kekuatan-Nya demi orang-orang yang hatinya tidak bercela terhadap-Nya.”'
    reason: Alternatif leksikal untuk לְהִתְחַזֵּק dan שָׁלֵם, yang dapat menonjolkan tindakan Yahweh menunjukkan kekuatan-Nya serta keadaan hati yang utuh atau tidak bercela.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama perjanjian, bukan menggantinya dengan gelar.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: mata Yahweh menjelajahi
  rationale: Mempertahankan gambaran antropomorfis dan gerak aktif partisip Ibrani dalam bahasa Indonesia yang alami.
- source_word: בְּכָל הָאָרֶץ
  choice: seluruh bumi
  rationale: Ungkapan ini bernada universal; 'bumi' lebih tepat daripada 'negeri' dalam konteks ini.
- source_word: לְהִתְחַזֵּק עִם
  choice: untuk menguatkan
  rationale: Menyampaikan tindakan kuat Yahweh demi orang-orang yang setia; kemungkinan makna refleksif dipertahankan dalam catatan kaki.
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: orang-orang yang hatinya sepenuhnya tertuju kepada-Nya
  rationale: שָׁלֵם di sini menunjuk pada kesetiaan hati yang utuh dan tidak terbagi, bukan kesempurnaan tanpa dosa.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: Dalam hal ini engkau telah bertindak bodoh
  rationale: Teguran profetis diterjemahkan secara langsung, jelas, dan wajar dalam bahasa Indonesia modern.
- source_word: מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: mulai sekarang engkau akan mengalami peperangan
  rationale: Konstruksi eksistensial dengan penanda waktu memiliki daya futuris; 'mengalami peperangan' lebih alami daripada terjemahan harfiah 'peperangan ada bersamamu'.
theological_decisions:
- issue: Makna שָׁלֵם bagi hati yang tertuju kepada Yahweh
  choice: kesetiaan yang sepenuh hati dan tidak terbagi
  alternative: tidak bercela atau sempurna di hadapan-Nya
  rationale: Konteks menyoroti kebergantungan dan kesetiaan perjanjian Asa, bukan tuntutan kesempurnaan tanpa dosa.
- issue: Cakupan הָאָרֶץ
  choice: seluruh bumi
  alternative: seluruh negeri
  rationale: Pernyataan ini bersifat umum dan universal, menegaskan pengawasan Yahweh di segala tempat.
- issue: Daya kausal כִּי sebelum מֵעַתָּה
  choice: Karena itu, mulai sekarang
  alternative: sebab mulai sekarang
  rationale: Dalam konteks teguran, peperangan merupakan akibat dari tindakan bodoh Asa; 'karena itu' menyatakan hubungan tersebut secara alami tanpa menambah isi baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang kedua tunggal 'engkau' mempertahankan sapaan langsung kepada Asa; sufiks ilahi ditulis 'kepada-Nya' sesuai kelaziman ejaan religius Indonesia.
