  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּכְעַ֨ס אָסָ֜א אֶל הָ/רֹאֶ֗ה וַֽ/יִּתְּנֵ֨/הוּ֙ בֵּ֣ית הַ/מַּהְפֶּ֔כֶת כִּֽי בְ/זַ֥עַף עִמּ֖/וֹ עַל זֹ֑את וַ/יְרַצֵּ֥ץ אָסָ֛א מִן הָ/עָ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: id
  text: Lalu Asa menjadi marah kepada pelihat itu dan memasukkannya ke rumah tahanan[a], sebab ia sangat murka kepadanya karena hal itu. Pada waktu itu Asa juga menindas dengan kejam beberapa orang dari rakyat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah pasungan”; ungkapan Ibrani ini tampaknya menunjuk pada tempat penahanan yang menggunakan alat pengekang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, kata Ibrani yang dipakai dapat berarti “meremukkan” atau “menghancurkan”; dalam konteks ini, kata tersebut menyatakan perlakuan yang sangat keras terhadap rakyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: menjadi marah
  rationale: Kata kerja כעס menyatakan kemarahan atau kejengkelan; bentuk naratifnya secara alami diterjemahkan sebagai perubahan keadaan, “menjadi marah”.
- source_word: הָרֹאֶה
  choice: pelihat
  rationale: רֹאֶה secara harfiah berarti “pelihat”, sebutan lama bagi seorang nabi; pilihan ini mempertahankan istilah khusus dalam teks sumber.
- source_word: וַיִּתְּנֵהוּ בֵּית הַמַּהְפֶּכֶת
  choice: memasukkannya ke rumah tahanan
  rationale: נתן dengan tujuan tempat berarti menaruh atau memasukkan seseorang. Ungkapan בֵּית הַמַּהְפֶּכֶת sulit dipastikan, tetapi dalam konteks menunjuk tempat penahanan, mungkin dengan pasungan.
- source_word: בְזַעַף עִמּוֹ עַל זֹאת
  choice: sangat murka kepadanya karena hal itu
  rationale: זַעַף menyatakan amarah atau kemurkaan yang kuat; frasa ini mempertahankan intensitas emosi Asa serta sebabnya.
- source_word: וַיְרַצֵּץ
  choice: menindas dengan kejam
  rationale: Bentuk Piel dari רצץ pada dasarnya menggambarkan tindakan meremukkan atau menghancurkan. Dengan manusia sebagai objek, ungkapan ini menyatakan perlakuan keras dan penuh kekerasan; “menindas dengan kejam” menyampaikan daya katanya tanpa memberi kesan bahwa mereka secara harfiah diremukkan.
- source_word: מִן הָעָם
  choice: beberapa orang dari rakyat
  rationale: Preposisi מִן bersifat partitif di sini, sehingga yang dimaksud bukan seluruh rakyat, melainkan sejumlah orang dari antara mereka.
- source_word: בָּעֵת הַהִיא
  choice: pada waktu itu
  rationale: Padanan temporal yang alami dan tepat dalam bahasa Indonesia modern.
