  text: וְ/הִנֵּה֙ דִּבְרֵ֣י אָסָ֔א הָ/רִאשׁוֹנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֤/ם כְּתוּבִים֙ עַל סֵ֣פֶר הַ/מְּלָכִ֔ים לִ/יהוּדָ֖ה וְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: id
  text: Lihatlah[a], riwayat Asa, dari awal sampai akhir—lihatlah, semuanya tertulis dalam Kitab Raja-Raja Yehuda dan Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Lihatlah, perkara-perkara Asa, yang terdahulu dan yang kemudian—lihatlah, semuanya tertulis.” Dalam rumus penulisan sejarah ini, “riwayat” dan “dari awal sampai akhir” menyampaikan makna idiomatis bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Sesungguhnya
  rationale: Menandai pemberitahuan penutup dan menarik perhatian pembaca tanpa menambahkan unsur waktu yang tidak dinyatakan secara eksplisit.
- source_word: דִּבְרֵי אָסָא
  choice: riwayat Asa
  rationale: Dalam rumus rangkuman kerajaan, דִּבְרֵי mencakup perkara, tindakan, dan peristiwa mengenai seorang raja; 'riwayat' menyampaikan cakupan historiografis itu secara alami.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: dari awal sampai akhir
  rationale: Ungkapan berpasangan ini menunjuk pada keseluruhan rentang riwayat dan diterjemahkan dengan idiom Indonesia yang jelas.
- source_word: הִנָּם כְּתוּבִים
  choice: tertulis
  rationale: Menyatakan bahwa riwayat tersebut terdapat sebagai catatan tertulis; pengulangan unsur deiktis tidak perlu dipertahankan secara kaku karena menghasilkan bahasa Indonesia yang janggal.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara dasar berarti 'di atas', dalam rumus rujukan tertulis bahasa Indonesia secara alami memakai 'dalam'; סֵפֶר diterjemahkan 'Kitab' sebagai judul sumber.
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: Raja-Raja Yehuda dan Israel
  rationale: Mempertahankan judul sumber secara transparan dan memahami ל sebagai penanda hubungan dengan Yehuda dan Israel.
