  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: id
  text: Bukankah orang Kus dan orang Lubim[a] merupakan pasukan yang sangat besar, dengan kereta dan orang-orang berkuda yang sangat banyak? Namun, ketika engkau mengandalkan Yahweh, Ia menyerahkan mereka ke dalam tanganmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Etiopia dan orang Libya.” Bentuk “orang Kus” dan “orang Lubim” dipakai untuk tetap dekat dengan nama-nama bangsa dalam teks Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya; “Bukankah” mempertahankan daya retoris itu secara alami dalam bahasa Indonesia.
- source_word: הַכּוּשִׁים וְהַלּוּבִים
  choice: orang Kus dan orang Lubim
  rationale: Nama kedua kelompok ditampilkan dekat dengan etnonim Ibrani agar tidak menyamakannya secara berlebihan dengan negara atau bangsa modern; alternatif tradisional dicatat dalam catatan kaki.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: merupakan pasukan yang sangat besar
  rationale: Dalam konteks militer, חַיִל menunjuk pada pasukan atau bala tentara, sedangkan לָרֹב menekankan besarnya jumlah.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: dengan kereta dan pasukan berkuda yang amat banyak
  rationale: Ungkapan ini menyebut perlengkapan dan unsur militer mereka serta menekankan jumlah yang sangat banyak. “Pasukan berkuda” terdengar lebih wajar daripada “orang-orang berkuda” dalam konteks ini.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: Namun, ketika engkau mengandalkan
  rationale: Kata kerja tersebut secara kiasan berarti bersandar atau menaruh kepercayaan. “Mengandalkan” menyampaikan ketergantungan itu, sementara “Namun” memperjelas kontras dalam argumen tanpa mengubah hubungan waktunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: Ia menyerahkan mereka ke dalam tanganmu
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang pemberian kemenangan dan kekuasaan atas musuh, dengan bentuk yang masih dapat dipahami pembaca Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; “Yahweh” mempertahankan fungsi tersebut dan tidak menggantinya dengan gelar.
- issue: Hubungan kepercayaan kepada Yahweh dengan kemenangan
  choice: ketika engkau mengandalkan Yahweh, Ia menyerahkan mereka ke dalam tanganmu
  alternative: karena engkau mengandalkan Yahweh, Ia menyerahkan mereka ke dalam tanganmu
  rationale: Konstruksi בְּ + infinitif paling langsung menyatakan keadaan atau waktu terjadinya tindakan. Terjemahan tidak mempersempitnya secara tegas menjadi hubungan sebab-akibat, meskipun hubungan itu tersirat dalam argumen konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan tunggal “engkau” mempertahankan bentuk orang kedua tunggal kepada Asa. Idiom “ke dalam tanganmu” dipertahankan karena jelas dalam konteks kemenangan militer.
