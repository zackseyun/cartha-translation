  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: id
  text: Asa pun tidur bersama leluhurnya[a] dan meninggal pada tahun keempat puluh satu pemerintahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “tidur bersama leluhurnya” adalah ungkapan lazim untuk kematian dan pemakaman bersama para leluhur.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: tidur
  rationale: Mempertahankan gambaran harfiah dalam ungkapan kematian Ibrani dan tidak meleburkannya menjadi ‘meninggal’, sebab verba berikutnya secara tersendiri menyatakan bahwa Asa meninggal.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: ‘Leluhur’ menyampaikan hubungan kekeluargaan dan dinasti secara alami dalam bahasa Indonesia modern; ‘bersama bapak-bapaknya’ terlalu harfiah dan berpotensi disalahpahami.
- source_word: וַיָּמָת
  choice: dan meninggal
  rationale: Menerjemahkan pernyataan eksplisit tentang kematian tanpa menghapus pengulangan yang disengaja dengan ungkapan sebelumnya.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: pada tahun keempat puluh satu
  rationale: Bentuk ordinal ini merupakan ungkapan Indonesia yang alami untuk penanggalan berdasarkan masa pemerintahan.
- source_word: לְמָלְכוֹ
  choice: pemerintahannya
  rationale: Dalam rumus kronologis kerajaan, kata ini secara alami menunjuk pada masa Asa memerintah sebagai raja.
- source_word: אָסָא
  choice: Asa
  rationale: Mengikuti bentuk baku nama tokoh ini dalam Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Ungkapan sumber ‘tidur bersama leluhurnya’ dipertahankan, sedangkan catatan kaki menjelaskan makna budayanya. Kata ‘meninggal’ tetap disebut secara eksplisit sesuai struktur Ibrani.
