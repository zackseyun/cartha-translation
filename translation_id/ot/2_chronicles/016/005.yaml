  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ בַּעְשָׁ֔א וַ/יֶּחְדַּ֕ל מִ/בְּנ֖וֹת אֶת הָ/רָמָ֑ה וַ/יַּשְׁבֵּ֖ת אֶת מְלַאכְתּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/005.yaml
  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: id
  text: Ketika Baesa mendengar hal itu, ia berhenti membangun Rama[a] dan menghentikan pekerjaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperkuat pertahanan Rama”; bahasa Ibrani merujuk pada penghentian kegiatan pembangunan atau pembentengan di Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar hal itu
  rationale: Konstruksi wayyiqtol dengan infinitif membentuk anak kalimat waktu. Ungkapan ini menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia; “hal itu” disuplai dari konteks sebelumnya sebagai isi yang didengar.
- source_word: בַּעְשָׁא
  choice: Baesa
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: ia berhenti membangun
  rationale: Verba חדל dengan מן dan infinitif menyatakan penghentian suatu kegiatan; “berhenti membangun” merupakan padanan Indonesia yang langsung dan alami.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: Kata ini adalah nama tempat. Dalam konteksnya, membangun kota itu mencakup kegiatan pembangunan atau penguatan pertahanannya.
- source_word: וַיַּשְׁבֵּת
  choice: dan menghentikan
  rationale: Bentuk Hifil dari שבת menyatakan tindakan menyebabkan sesuatu berhenti atau mengakhirinya. “Menghentikan” mempertahankan nuansa kausatifnya.
- source_word: מְלַאכְתּוֹ
  choice: pekerjaannya
  rationale: מְלָאכָה menunjuk pada pekerjaan atau kegiatan kerja; sufiks orang ketiga tunggal diterjemahkan dengan bentuk posesif “-nya”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan makna “berhenti/menghentikan” dipertahankan karena mencerminkan dua verba berbeda dalam teks Ibrani, dengan verba kedua berbentuk kausatif.
