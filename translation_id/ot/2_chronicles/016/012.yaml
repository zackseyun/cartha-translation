source:
  edition: WLC
  text: וַ/יֶּחֱלֶ֣א אָסָ֡א בִּ/שְׁנַת֩ שְׁלוֹשִׁ֨ים וָ/תֵ֤שַׁע לְ/מַלְכוּת/וֹ֙ בְּ/רַגְלָ֔י/ו עַד לְ/מַ֖עְלָ/ה חָלְי֑/וֹ וְ/גַם בְּ/חָלְי/וֹ֙ לֹא דָרַ֣שׁ אֶת יְהוָ֔ה כִּ֖י בָּ/רֹפְאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: id
  text: Pada tahun ketiga puluh sembilan pemerintahannya, Asa menderita penyakit pada kakinya, dan penyakitnya menjadi sangat parah.[a] Namun, bahkan dalam penyakitnya itu, ia tidak mencari Yahweh, melainkan para tabib.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penyakitnya sampai ke atas”; ungkapan ini biasanya dipahami sebagai “menjadi sangat parah”, tetapi mungkin juga menggambarkan penyakit yang menjalar ke atas.
    reason: source_ambiguity
  - marker: b
    text: Atau, “ia tidak meminta petunjuk dari Yahweh, melainkan dari para tabib.” Klausa Ibraninya eliptis dan mempertentangkan mencari Yahweh dengan berpaling kepada para tabib.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: menderita penyakit
  rationale: Kata kerja חלה menyatakan menjadi sakit atau lemah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan kata benda חֳלִי yang muncul sesudahnya.
- source_word: בְּרַגְלָיו
  choice: pada kakinya
  rationale: רֶגֶל dapat berarti kaki atau tungkai. 'Kakinya' adalah padanan umum yang tidak mempersempit lokasi penyakit lebih jauh daripada teks Ibrani.
- source_word: עַד לְמַעְלָה
  choice: menjadi sangat parah
  rationale: Dalam konteks ini ungkapan tersebut paling mungkin menyatakan tingkat penyakit yang luar biasa berat. Kemungkinan gambaran harfiah 'sampai ke atas' dipertahankan dalam catatan kaki.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: penyakitnya / dalam penyakitnya itu
  rationale: Pengulangan 'penyakit' mencerminkan pengulangan akar kata dalam bahasa Ibrani dan tetap terdengar wajar dalam bahasa Indonesia.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: mencari Yahweh
  rationale: דרש ketika berobjek Allah dapat berarti mencari atau meminta petunjuk dan pertolongan-Nya. 'Mencari Yahweh' mempertahankan cakupan makna yang luas tanpa membatasinya hanya pada permohonan kesembuhan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: כִּי בָּרֹפְאִים
  choice: melainkan para tabib
  rationale: Klausa Ibrani ini eliptis, secara harfiah memakai preposisi yang dapat berarti 'kepada/dari para tabib'. 'Melainkan para tabib' mempertahankan bentuk ringkas dan kontras dengan Yahweh; unsur verbal 'mencari' dipahami dari klausa sebelumnya.
theological_decisions:
- issue: Apakah ayat ini mengecam pengobatan medis itu sendiri atau kegagalan Asa mencari Allah
  choice: Teks mempertentangkan kegagalan Asa mencari Yahweh dengan tindakannya berpaling kepada para tabib, tanpa menyatakan bahwa penggunaan tabib selalu salah.
  alternative: Menerjemahkan ayat seolah-olah semua penggunaan tabib atau pengobatan medis dilarang.
  rationale: Bahasa Ibrani menyoroti objek pencarian Asa dan tidak merumuskan larangan umum terhadap pengobatan. Terjemahan tidak boleh menambahkan kesimpulan teologis yang tidak dinyatakan teks.
- issue: Makna עַד לְמַעְלָה dalam gambaran penyakit Asa
  choice: Dipahami sebagai penegasan bahwa penyakit itu menjadi sangat parah.
  alternative: Dipahami secara spasial bahwa penyakit itu menjalar ke bagian atas tubuh.
  rationale: Pemaknaan intensif paling sesuai dengan pemakaian kontekstual dan tradisi leksikal, tetapi ungkapan Ibrani secara harfiah memungkinkan gambaran arah ke atas; karena itu alternatif tersebut dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tabib' dipilih karena cocok dengan latar kuno dan tetap mudah dipahami; 'dokter' akan memberi nuansa kelembagaan modern. Susunan kalimat mempertahankan pengulangan 'penyakit' serta kontras tegas antara Yahweh dan para tabib.
