base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: id
  text: Kemudian Raja Asa mengerahkan seluruh Yehuda[a]. Mereka mengangkut batu-batu dari Rama dan kayu-kayunya, yang telah dipakai Baesa untuk membangun[b]. Dengan bahan-bahan itu, Asa membangun Geba dan Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengambil seluruh Yehuda”; maksudnya dapat juga diterjemahkan “memanggil” atau “mengerahkan seluruh Yehuda”.'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, batu dan kayu yang telah dipakai Baesa untuk membangun Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: mengerahkan seluruh Yehuda
  rationale: Secara harfiah berarti ‘mengambil seluruh Yehuda’, tetapi dalam konteks ini ungkapan tersebut menyatakan bahwa Asa mengerahkan rakyat Yehuda untuk pekerjaan itu. Terjemahan ini menyampaikan makna idiomatis dengan wajar.
- source_word: וַיִּשְׂאוּ
  choice: mereka mengangkut
  rationale: Kata kerja נשׂא di sini menggambarkan mengangkat lalu memindahkan bahan bangunan. ‘Mengangkut’ ringkas dan alami dalam bahasa Indonesia.
- source_word: אַבְנֵי הָרָמָה
  choice: batu-batu dari Rama
  rationale: Rangkaian konstruksi Ibrani dapat berarti batu-batu milik atau yang berasal dari bangunan di Rama. ‘Dari Rama’ memperjelas bahwa bahan itu dipindahkan dari lokasi tersebut tanpa mengubah maksud konteks.
- source_word: עֵצֶיהָ
  choice: kayu-kayunya
  rationale: Akhiran pronominal merujuk kepada Rama, yakni kayu yang menjadi bagian dari pekerjaan pembangunan di sana. Bentuk ini mempertahankan rujukan tersebut.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: yang telah dipakai Baesa untuk membangun
  rationale: Klausa relatif ini paling mungkin menerangkan batu dan kayu sebagai bahan yang dipakai Baesa dalam pembangunan. Objek pembangunan tidak dinyatakan secara eksplisit dalam klausa Ibrani, sehingga penjelasannya ditempatkan dalam catatan kaki.
- source_word: וַיִּבֶן בָּהֶם
  choice: Dengan bahan-bahan itu, Asa membangun
  rationale: Kata kerja tunggal merujuk kembali kepada Asa, sedangkan pronomina jamak merujuk kepada batu dan kayu. Nama ‘Asa’ diulangi demi kejelasan dalam bahasa Indonesia.
- source_word: גֶּבַע
  choice: Geba
  rationale: Transliterasi baku nama tempat tersebut dalam bahasa Indonesia.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia; kata sandang Ibrani tidak perlu dipertahankan pada nama diri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Ungkapan idiomatis tentang pengerahan rakyat diterjemahkan menurut konteks, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki. Nama tempat mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
