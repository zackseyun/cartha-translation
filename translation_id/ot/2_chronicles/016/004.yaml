base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: id
  text: Benhadad mendengarkan Raja Asa lalu mengutus para panglima pasukannya ke kota-kota Israel. Mereka menyerang Iyon, Dan, Abel-Maim[a], dan semua kota-kota perbekalan di Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abel-Maim adalah bacaan teks Ibrani di ayat ini; sebagian orang mengidentifikasikannya dengan Abel-Bet-Maaka yang dikenal dari bagian-bagian paralel.
    reason: alternative_identification
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengarkan
  rationale: Dalam konteks ini, Benhadad bukan hanya mendengar, melainkan menanggapi permintaan Asa. 'Mendengarkan' mempertahankan kedua nuansa itu tanpa menyatakannya sebagai ketaatan.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: para panglima pasukannya
  rationale: שָׂרֵי berarti para pemimpin atau panglima, sedangkan הַחֲיָלִים menunjuk pada kekuatan militer; אֲשֶׁר לוֹ menyatakan bahwa pasukan itu milik Benhadad.
- source_word: אֶל עָרֵי יִשְׂרָאֵל
  choice: untuk menyerang kota-kota Israel
  rationale: Preposisi אֶל menyatakan arah pengutusan. Dalam konteks militer, tujuan serangan dibuat eksplisit agar kalimat alami dalam bahasa Indonesia, sementara tindakan berikutnya tetap dinyatakan oleh וַיַּכּוּ.
- source_word: וַיַּכּוּ
  choice: mereka menaklukkan
  rationale: Dalam kisah militer, נכה dapat berarti memukul, menyerang, atau mengalahkan. 'Menaklukkan' menyampaikan keberhasilan serangan terhadap kota-kota tersebut, dengan catatan kaki untuk menjaga keluasan makna sumber.
- source_word: עִיּוֹן
  choice: Iyon
  rationale: Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca menurut ejaan bahasa Indonesia.
- source_word: אָבֵל מָיִם
  choice: Abel-Maim
  rationale: Terjemahan mengikuti langsung bacaan teks Ibrani, tanpa menyelaraskannya dengan nama tempat dalam bagian-bagian paralel.
- source_word: מִסְכְּנוֹת
  choice: kota perbekalan
  rationale: Istilah ini menunjuk pada tempat penyimpanan persediaan. 'Kota perbekalan' alami dan jelas dalam konteks militer-ekonomi.
- source_word: עָרֵי נַפְתָּלִי
  choice: di Naftali
  rationale: Rangkaian konstruksi ini dapat menunjukkan kota-kota yang termasuk wilayah Naftali; 'di Naftali' merupakan ungkapan geografis yang alami dalam bahasa Indonesia.
