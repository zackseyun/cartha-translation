- from: Benhadad mendengarkan Raja Asa, lalu mengutus para panglima pasukannya untuk menyerang kota-kota Israel. Mereka menaklukkan[a] Iyon, Dan, Abel-Maim, dan semua kota perbekalan di Naftali.
  to: Benhadad mendengarkan Raja Asa lalu mengutus para panglima pasukannya ke kota-kota Israel. Mereka menyerang Iyon, Dan, Abel-Maim[a], dan semua kota-kota perbekalan di Naftali.
