base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: id
  text: “Ada perjanjian antara aku dan engkau,[a] dan antara ayahku dan ayahmu. Lihatlah, aku telah mengirimkan kepadamu perak dan emas. Pergilah, batalkanlah perjanjianmu dengan Baesa, raja Israel, agar ia menarik diri dariku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ikatan perjanjian” atau “persekutuan”. Kata Ibrani בְּרִית di sini mengacu pada pakta politik antarraja.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan ia akan naik dari atasku.” Ungkapan ini kemungkinan berarti agar Baesa menarik diri atau menghentikan tekanan maupun tindakan militernya terhadap Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: perjanjian
  rationale: Dalam konteks diplomatik antarraja, kata ini menunjuk pada pakta politik. 'Perjanjian' alami dalam bahasa Indonesia dan tetap cukup luas untuk mempertahankan cakupan makna Ibraninya.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: antara aku dan engkau, dan antara ayahku dan ayahmu
  rationale: Pengulangan 'antara' dipertahankan untuk mencerminkan rumusan diplomatik yang sejajar dalam teks Ibrani.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Penanda ini menarik perhatian kepada perak dan emas yang dikirim; 'Lihatlah' bermartabat dan masih mudah dipahami.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: aku mengirimkan kepadamu perak dan emas
  rationale: Bentuk perfektif menyatakan tindakan pengiriman sebagai fakta yang relevan bagi permintaan berikutnya. Bahasa Indonesia tidak wajib menandai aspek selesai secara eksplisit.
- source_word: הָפֵר
  choice: batalkanlah
  rationale: Bentuk kausatif dari פרר di sini berarti meniadakan atau membatalkan keberlakuan suatu perjanjian; 'batalkanlah' lebih tepat secara diplomatik daripada sekadar 'langgarlah'.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: perjanjianmu dengan Baesa
  rationale: Relasi perjanjian dengan Baesa diungkapkan secara idiomatis dan jelas dalam bahasa Indonesia.
- source_word: וְיַעֲלֶה מֵעָלַי
  choice: supaya ia mundur dari wilayahku
  rationale: Secara harfiah ungkapan ini berarti 'dan ia naik/pergi dari atasku'. Dalam konteks pengepungan Rama dan tekanan militer terhadap Asa, maksudnya adalah agar Baesa menarik diri dari wilayah yang dikuasai Asa; tambahan 'wilayah' membuat idiom tersebut alami tanpa menghilangkan nuansa militer.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan diterjemahkan langsung sesuai pemakaian baku bahasa Indonesia.
