  - severity: low
    issue: “supaya tidak membiarkan” canggung dalam konstruksi Indonesia ini.
    rationale: Konstruksi tujuan negatif dapat diterjemahkan lebih jelas sebagai “untuk menghalangi,” sambil tetap memelihara tujuan pencegahan yang ditandai לְבִלְתִּי.
