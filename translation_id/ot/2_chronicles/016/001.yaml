  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: id
  text: Pada tahun ketiga puluh enam pemerintahan Asa[a], Baesa, raja Israel, maju menyerang Yehuda dan membangun Rama untuk menghalangi siapa pun keluar atau masuk dari wilayah Asa, raja Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “pada tahun ketiga puluh enam pemerintahan Asa.” Keterangan ini menimbulkan ketegangan kronologis dengan urutan waktu pemerintahan Baesa dalam 1 Raja-Raja. Sebagian orang memahaminya sebagai hitungan sejak kerajaan terpecah, sedangkan yang lain mengusulkan penyesuaian teks untuk menyelaraskan kronologinya.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֵׁשׁ לְ/מַלְכוּת אָסָא
  choice: Pada tahun ketiga puluh enam pemerintahan Asa
  rationale: Frasa waktu Ibrani dipertahankan secara langsung dan alami dalam bahasa Indonesia; מַלְכוּת di sini menunjuk pada masa pemerintahan atau kekuasaan raja.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: maju menyerang Yehuda
  rationale: Dalam konteks militer, עָלָה עַל berarti bergerak maju melawan suatu wilayah. Pilihan ini lebih jelas daripada terjemahan harfiah 'naik melawan' tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: וַ/יִּבֶן אֶת הָ/רָמָה
  choice: dan membangun Rama
  rationale: בנה pada dasarnya berarti 'membangun'. Konteks mungkin menyiratkan pembangunan pertahanan, tetapi teks tidak memakai kata kerja khusus 'membentengi', sehingga nuansa itu tidak dimasukkan ke teks utama.
- source_word: לְ/בִלְתִּי תֵּת
  choice: supaya tidak membiarkan
  rationale: Konstruksi לבלתי dengan infinitif menyatakan tujuan negatif atau pencegahan; bentuk ini mempertahankan struktur tujuan sumber dengan bahasa Indonesia yang wajar.
- source_word: יוֹצֵא וָ/בָא
  choice: keluar atau masuk
  rationale: Pasangan kata ini menggambarkan pergerakan atau akses. Urutan dan ungkapan sumber dipertahankan.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: menemui Asa, raja Yehuda
  rationale: Preposisi ל menyatakan arah atau hubungan dengan Asa. 'Menemui' menghasilkan kalimat Indonesia yang jelas sambil tetap menyampaikan pembatasan akses kepada Asa; cakupannya dapat melibatkan pergerakan keluar dan masuk.
theological_decisions:
- issue: Ketegangan kronologis dengan masa pemerintahan Baesa menurut 1 Raja-Raja
  choice: Mempertahankan 'tahun ketiga puluh enam pemerintahan Asa' sesuai teks Masoret
  alternative: Menghitung tahun ketiga puluh enam sejak perpecahan kerajaan, atau mengubah angka menjadi tahun kedua puluh enam sebagai penyelarasan tekstual
  rationale: Teks Ibrani secara eksplisit menyebut tahun ketiga puluh enam pemerintahan Asa. Ketegangan historis tidak diselesaikan diam-diam melalui perubahan atau harmonisasi; kemungkinan penjelasan dicatat dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Asa, Baesa, Yehuda, dan Rama. Struktur sumber dipertahankan sejauh tetap alami dan mudah dipahami.'
