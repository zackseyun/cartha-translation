id: 2CH.16.2
reference: 2 Chronicles 16:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: id
  text: Lalu Asa mengeluarkan perak dan emas dari perbendaharaan rumah Yahweh dan istana raja, kemudian mengirimkannya kepada Ben-Hadad, raja Aram[a] yang tinggal di Damsyik, dengan pesan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara tradisional: Siria.'
    reason: Memberikan padanan geografis tradisional bagi 'Aram' tanpa menggantikan nama yang terdapat dalam teks Ibrani.
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: mengeluarkan
  rationale: Bentuk Hifil dari יצא berarti membuat sesuatu keluar; dalam konteks ini, Asa mengeluarkan logam berharga dari tempat penyimpanan.
- source_word: כֶּסֶף וְזָהָב
  choice: perak dan emas
  rationale: Terjemahan langsung yang mempertahankan kedua jenis logam berharga yang disebutkan secara khusus.
- source_word: מֵאֹצְרוֹת
  choice: dari perbendaharaan
  rationale: Istilah ini menunjuk pada tempat penyimpanan harta. Bahasa Indonesia lazim memakai bentuk kolektif tunggal 'perbendaharaan' meskipun bahasa Ibrani memakai bentuk jamak.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan kata konkret 'rumah' dan menerjemahkan nama ilahi יהוה sebagai 'Yahweh'.
- source_word: וּבֵית הַמֶּלֶךְ
  choice: dan istana raja
  rationale: Secara harfiah 'dan rumah raja'; 'istana raja' menyampaikan rujukannya secara alami dan jelas dalam bahasa Indonesia.
- source_word: וַיִּשְׁלַח
  choice: kemudian mengirimkannya
  rationale: Akhiran '-nya' merujuk secara wajar kepada perak dan emas, yang menjadi objek tersirat dalam bahasa Ibrani.
- source_word: אֶל בֶּן הֲדַד
  choice: kepada Ben-Hadad
  rationale: Nama diri ditransliterasikan, sedangkan preposisi אֶל dalam konteks pengiriman diterjemahkan 'kepada'.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Mempertahankan nama wilayah Ibrani 'Aram' dan tidak menggantinya dalam teks utama dengan padanan tradisional 'Siria'.
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: yang tinggal di Damsyik
  rationale: Frasa partisipial ini menyatakan tempat kediaman Ben-Hadad; 'tinggal' alami dalam bahasa Indonesia dan mempertahankan nuansa keadaan yang berkelanjutan.
- source_word: לֵאמֹר
  choice: dengan pesan,
  rationale: Ungkapan ini memperkenalkan perkataan langsung pada ayat berikutnya. 'Dengan pesan' lebih alami daripada terjemahan kaku 'dengan berkata' dalam konstruksi pengiriman ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu secara langsung tanpa menggantinya dengan gelar.
- issue: Identitas wilayah אֲרָם
  choice: Aram
  alternative: Siria
  rationale: Mempertahankan nama geografis dalam teks sumber menghindari penyamaan tanpa penjelasan dengan sebutan geografis yang lebih kemudian; padanan tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Istana raja' dipilih untuk kealamian, sementara 'rumah Yahweh' mempertahankan ungkapan sumber dan pembedaan sakralnya. Penanda catatan kaki [a] ditempatkan langsung sesudah 'Aram', yaitu unsur yang dijelaskan.
