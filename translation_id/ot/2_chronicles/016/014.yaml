  source_fidelity: Teks draft pada dasarnya setia pada urutan dan unsur-unsur Ibrani. Namun, frasa utama "untuk menghormatinya" menafsirkan לּוֹ sebagai tujuan kehormatan, sedangkan teks hanya menyatakan bahwa pembakaran besar itu dilakukan "baginya". Revisi mempertahankan ungkapan itu tanpa menambahkan fungsi yang tidak dinyatakan.
  naturalness: Bahasa draft umumnya baku dan mudah dipahami. Revisi memakai pronomina enklitik yang lebih alami dalam narasi Indonesia ("menguburkannya", "membaringkannya") dan memperjelas bahwa keahlian peramu menerangkan racikan wewangian.
  terminology: '"Kota Daud," "pembaringan," "rempah-rempah," dan "pembakaran" sesuai dengan register khidmat serta menjaga keluasan istilah Ibrani. "Pembakaran" tetap tidak menentukan apakah yang dibakar adalah jenazah atau bahan-bahan aromatik.'
