  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: id
  text: Mereka menguburkannya di makamnya yang telah ia gali bagi dirinya sendiri di Kota Daud, lalu membaringkannya di atas pembaringan[a] yang dipenuhi rempah-rempah dan berbagai racikan wewangian, yang dibuat menurut keahlian seorang peramu minyak wangi. Mereka mengadakan pembakaran yang sangat besar baginya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tempat tidur" atau "dipan". Kata Ibrani ini berarti tempat untuk berbaring; dalam konteks ini mungkin merupakan pembaringan jenazah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani tidak menyebutkan apa yang dibakar. Dalam konteks pemakaman kerajaan, ungkapan ini mungkin merujuk pada pembakaran rempah-rempah atau bahan harum sebagai penghormatan, tetapi teks tidak menyatakannya secara khusus dan tidak dengan sendirinya berarti bahwa jenazahnya dibakar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ בְקִבְרֹתָיו
  choice: Mereka menguburkan dia di makamnya
  rationale: Bentuk jamak Ibrani dapat menunjuk pada kompleks pemakaman; bentuk tunggal kolektif 'makamnya' lebih alami dalam bahasa Indonesia dan sesuai dengan konteks makam kerajaan.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: yang telah digalinya bagi dirinya sendiri
  rationale: כּרה berarti menggali atau membuat melalui penggalian. Ungkapan ini mempertahankan tindakan dan unsur refleksif tanpa memastikan bahwa makam itu dipahat pada batu.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Padanan baku dan transparan bagi nama tempat tersebut.
- source_word: וַיַּשְׁכִּיבֻהוּ בַּמִּשְׁכָּב
  choice: Mereka membaringkan dia di atas pembaringan
  rationale: Hifil שׁכב berarti membuat atau menempatkan seseorang berbaring. מִשְׁכָּב secara harfiah adalah tempat berbaring; 'pembaringan' menjaga keluasan makna tanpa secara pasti menafsirkannya sebagai usungan jenazah.
- source_word: אֲשֶׁר מִלֵּא
  choice: yang telah dipenuhi
  rationale: Subjek verba maskulin tunggal tidak dinyatakan dengan jelas. Bentuk pasif Indonesia mempertahankan fokus pada pembaringan yang telah dipersiapkan tanpa menambahkan pelaku.
- source_word: בְּשָׂמִים וּזְנִים
  choice: rempah-rempah dan berbagai jenis wewangian racikan
  rationale: בְּשָׂמִים adalah bahan-bahan harum. זְנִים merupakan kata langka dan kemungkinan menunjuk pada jenis atau ragam campuran harum; terjemahan ini menyampaikan makna kontekstual sambil mengakui ketidakpastiannya dalam catatan keputusan.
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: racikan yang dibuat dengan keahlian peramu minyak wangi
  rationale: Akar רקח berkaitan dengan meracik bahan harum atau minyak wangi; frasa berikutnya menekankan pekerjaan atau keahlian sang peramu.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: Lalu mereka mengadakan pembakaran yang luar biasa besar untuk menghormatinya
  rationale: Terjemahan mempertahankan nomina verbal 'pembakaran' dan intensitas עַד לִמְאֹד. Frasa 'untuk menghormatinya' menyampaikan fungsi datif לוֹ dalam konteks upacara pemakaman tanpa menyatakan bahwa jenazahnya dikremasi.
theological_decisions:
- issue: Apa yang dibakar dalam upacara pemakaman Asa
  choice: Teks utama menyebut 'pembakaran' tanpa menentukan objek yang dibakar; catatan menjelaskan kemungkinan pembakaran bahan harum sebagai penghormatan.
  alternative: Jenazah Asa dikremasi, atau sekadar ada api pemakaman tanpa objek yang dapat ditentukan.
  rationale: Ayat terlebih dahulu menyatakan bahwa Asa dikuburkan, sedangkan konstruksi Ibraninya mengatakan bahwa orang-orang 'mengadakan pembakaran baginya' tanpa objek langsung. Karena itu, terjemahan tidak boleh memastikan kremasi maupun menghapus kemungkinan pembakaran upacara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur narasi dibuat alami dengan pemenggalan kalimat, sedangkan istilah 'pembaringan' dan 'pembakaran' dipilih untuk mempertahankan keluasan serta ketegangan makna teks Ibrani.
