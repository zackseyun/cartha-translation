- from: Mereka menguburkan dia di makamnya yang telah digalinya bagi dirinya sendiri di Kota Daud. Mereka membaringkan dia di atas pembaringan[a] yang telah dipenuhi rempah-rempah dan berbagai jenis wewangian racikan yang dibuat dengan keahlian peramu minyak wangi. Lalu mereka mengadakan pembakaran yang luar biasa besar untuk menghormatinya.[b]
