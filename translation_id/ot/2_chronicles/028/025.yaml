  naturalness: Bahasa draf umumnya baku dan jelas. “Ia membangkitkan murka Yahweh” alami dalam register Alkitabiah Indonesia. Menggantikan “sehingga” dengan “dan” membuat alur lebih dekat dengan sumber tanpa mengurangi kelancaran.
