base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: id
  text: Di setiap kota di Yehuda, ia membuat tempat-tempat pemujaan untuk membakar dupa bagi ilah-ilah lain, dan ia membangkitkan murka Yahweh, Allah leluhurnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di setiap kota dan kota di Yehuda”; pengulangan dalam bahasa Ibrani menegaskan bahwa hal itu dilakukan di semua kota Yehuda.
    reason: Menjelaskan ungkapan distributif Ibrani עִיר וָעִיר yang diterjemahkan secara idiomatis dalam teks utama.
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: Di setiap kota di Yehuda
  rationale: Pengulangan distributif עִיר וָעִיר menyatakan cakupan menyeluruh. Dalam bahasa Indonesia modern, “di setiap kota” menyampaikan penekanan itu secara alami tanpa meniru pengulangan Ibrani secara kaku.
- source_word: עָשָׂה בָמוֹת
  choice: ia membuat tempat-tempat pemujaan
  rationale: עָשָׂה berarti luas, yaitu “membuat”, sedangkan בָמוֹת adalah lokasi pemujaan kultis yang secara tradisional disebut “bukit-bukit pengorbanan”. Karena lokasi itu tidak selalu benar-benar berada di bukit, “tempat-tempat pemujaan” lebih jelas bagi pembaca modern dan tidak menambahkan rincian tindakan seperti “membangun”.
- source_word: לְקַטֵּר
  choice: untuk membakar dupa
  rationale: Bentuk piel ini dapat menunjuk pada pembakaran dupa atau pembuatan persembahan menjadi asap. Dalam konteks pemujaan kepada ilah-ilah lain, “membakar dupa” adalah padanan yang jelas dan lazim.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: bagi ilah-ilah lain
  rationale: Frasa ini secara langsung menunjuk kepada dewa-dewa selain Yahweh. “Ilah-ilah lain” mempertahankan bentuk jamak dan tidak menambahkan gagasan “asing” yang tidak dinyatakan oleh אֲחֵרִים.
- source_word: וַיַּכְעֵס אֶת־יְהוָה
  choice: sehingga ia membangkitkan murka Yahweh
  rationale: Hifil כעס berarti menyebabkan marah atau membangkitkan murka. “Membangkitkan murka” menyampaikan hubungan kausatif dengan alami; kata sambung “sehingga” memperjelas akibat dari tindakan sebelumnya tanpa mengubah hubungan wacananya.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Allah leluhurnya
  rationale: אבות dalam ungkapan ini menunjuk kepada para pendahulu atau nenek moyang. “Leluhur” alami dalam bahasa Indonesia modern dan tetap mempertahankan gema hubungan perjanjian lintas generasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה. “Yahweh” mempertahankan nama diri tersebut alih-alih menggantinya dengan gelar.
- issue: Sebutan bagi אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  alternative: dewa-dewa lain
  rationale: “Ilah-ilah lain” cukup netral dan dekat dengan bentuk sumber, tanpa menyiratkan pengakuan bahwa mereka setara atau benar-benar ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan istilah kultis dijelaskan secara ringkas tanpa memasukkan kekhasan denominasi.
