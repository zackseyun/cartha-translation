  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: id
  text: Sebab Yahweh merendahkan Yehuda karena Ahas, raja Israel,[a] karena ia telah menyebabkan Yehuda hidup tanpa kendali[b] dan sungguh-sungguh berlaku tidak setia terhadap Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “Ahas, raja Israel.” Ahas adalah raja Yehuda; sebutan dalam teks dipertahankan dan tidak diselaraskan.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan, “bertindak tanpa kendali di Yehuda” atau “menimbulkan kekacauan di Yehuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: merendahkan
  rationale: Bentuk Hifil dari כנע menyatakan tindakan Yahweh yang membuat Yehuda menjadi rendah atau terpuruk; “merendahkan” mempertahankan makna kausatif tanpa membatasinya pada penaklukan militer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap tampak.
- source_word: בַּעֲבוּר
  choice: karena
  rationale: Dalam konteks ini ungkapan tersebut menyatakan sebab, yaitu Ahas sebagai penyebab Yehuda direndahkan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Teks Masoret secara eksplisit menyebut Ahas “raja Israel”; ungkapan itu dipertahankan dan tidak diselaraskan menjadi “raja Yehuda”.
- source_word: הִפְרִיעַ
  choice: telah membuat keadaan lepas kendali
  rationale: Bentuk Hifil dari פרע dapat menunjuk pada tindakan menyebabkan ketidaktertiban, keliaran, atau hilangnya pengekangan. Pilihan ini mempertahankan nuansa kausatif dan tetap wajar dalam bahasa Indonesia.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Preposisi ב menandai lingkup atau tempat terjadinya tindakan Ahas.
- source_word: וּמָעוֹל מַעַל
  choice: dan sungguh-sungguh berlaku tidak setia
  rationale: Gabungan infinitif absolut dan bentuk verbal dari akar מעל memberi penegasan kuat pada ketidaksetiaan atau pengkhianatan perjanjian.
- source_word: בַּיהוָה
  choice: terhadap Yahweh
  rationale: Dengan מעל, preposisi ini menandai pihak yang menjadi sasaran ketidaksetiaan; “terhadap” merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Ahas disebut “raja Israel”
  choice: Mempertahankan bunyi teks Ibrani “Ahas, raja Israel” dalam teks utama.
  alternative: Mengubahnya secara historis menjadi “Ahas, raja Yehuda”.
  rationale: Walaupun Ahas secara historis memerintah Yehuda, teks sumber menyebutnya “raja Israel”. Terjemahan tidak menyelaraskan ketegangan ini; catatan kaki memberikan penjelasan historis.
- issue: Kadar ketidaksetiaan dalam וּמָעוֹל מַעַל
  choice: Menerjemahkan intensifikasi sebagai “sungguh-sungguh berlaku tidak setia”.
  alternative: “Melakukan pelanggaran besar” atau “berkhianat dengan sangat parah”.
  rationale: Pilihan utama mempertahankan penegasan gramatikal sekaligus tidak mempersempit מעל menjadi satu jenis pelanggaran tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur sebab-akibat yang jelas. Pengulangan “karena” mempertahankan dua klausa כִּי dalam sumber. Istilah teologis dibuat mudah dipahami tanpa menghilangkan ketegangan tekstual atau daya intensif bahasa Ibrani.
