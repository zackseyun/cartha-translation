source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב אָחָ֜ז עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ֤/הוּ בָ/עִיר֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֚י לֹ֣א הֱבִיאֻ֔/הוּ לְ/קִבְרֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יְחִזְקִיָּ֥הֽוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: id
  text: Ahas kemudian mendapat perhentian bersama leluhurnya. Mereka menguburkannya di kota itu, di Yerusalem, sebab mereka tidak membawanya ke makam raja-raja Israel.[a] Hizkia, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “raja-raja Israel.” Karena Ahas adalah raja Yehuda, sebagian orang memahami sebutan ini sebagai makam kerajaan para raja keturunan Daud, atau menduga bahwa yang dimaksud ialah “raja-raja Yehuda.”'
    reason: Mempertahankan bacaan Ibrani sekaligus menjelaskan sebutan yang mungkin tidak terduga dalam konteksnya.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini menyampaikan formula kematian dinasti tanpa menimbulkan kesan bahwa Ahas secara harfiah hanya berbaring atau tidur. “Leluhur” lebih alami dan mencakup makna genealogis אָבוֹת dalam bahasa Indonesia modern.
- source_word: וַיִּקְבְּרֻהוּ
  choice: mereka menguburkannya
  rationale: Mempertahankan bentuk aktif orang ketiga jamak dan akhiran objek dalam bahasa Ibrani.
- source_word: בָעִיר בִּירוּשָׁלִָם
  choice: di kota itu, di Yerusalem
  rationale: 'Mempertahankan kedua unsur tempat dalam teks Ibrani serta penekanannya: ia dimakamkan di dalam kota, tetapi bukan di makam kerajaan.'
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi lokasi pemakaman dengan penghubung kausal yang alami dalam narasi Indonesia.
- source_word: לֹא הֱבִיאֻהוּ לְקִבְרֵי
  choice: tidak membawanya ke makam
  rationale: Mempertahankan gambaran konkret verba kausatif “membawa” dan tidak mereduksinya menjadi sekadar “menguburkan” atau “menempatkan”.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: raja-raja Israel
  rationale: Mengikuti secara langsung teks Masoret yang berbunyi “Israel”, bukan menormalkannya menjadi “Yehuda” berdasarkan konteks.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: menjadi raja menggantikan dia
  rationale: Dalam formula pergantian takhta, ungkapan ini menyampaikan baik kenaikan Hizkia sebagai raja maupun kedudukannya sebagai penerus Ahas secara alami.
theological_decisions:
- issue: Apakah “raja-raja Israel” perlu diubah menjadi “raja-raja Yehuda” karena Ahas adalah raja Yehuda
  choice: Mempertahankan “raja-raja Israel” dalam teks utama
  alternative: raja-raja Yehuda
  rationale: Teks Ibrani Masoret secara eksplisit menyebut Israel. Terjemahan tidak boleh menyelaraskan ketegangan historis tersebut secara diam-diam; catatan kaki menjelaskan persoalannya.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. “Mendapat perhentian” mempertahankan nuansa ungkapan kematian tradisional tanpa memakai “tidur” secara harfiah; “di kota itu, di Yerusalem” sengaja mempertahankan pengulangan lokasi dari teks sumber.
