  text: וַ/יָּקֻ֨מוּ אֲנָשִׁ֜ים מֵ/רָאשֵׁ֣י בְנֵֽי אֶפְרַ֗יִם עֲזַרְיָ֤הוּ בֶן יְהֽוֹחָנָן֙ בֶּרֶכְיָ֣הוּ בֶן מְשִׁלֵּמ֔וֹת וִֽ/יחִזְקִיָּ֨הוּ֙ בֶּן שַׁלֻּ֔ם וַ/עֲמָשָׂ֖א בֶּן חַדְלָ֑י עַל הַ/בָּאִ֖ים מִן הַ/צָּבָֽא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: id
  text: Kemudian, beberapa orang dari antara para pemimpin bani Efraim bangkit menentang orang-orang yang datang dari pasukan itu, yaitu Azarya anak Yohanan, Berekhya anak Mesylemot, Yehizkia anak Salum, dan Amasa anak Hadlai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: bangkit menghadang
  rationale: Kata kerja קום menandai tindakan tegas, sedangkan konstruksi dengan עַל dalam konteks ini menunjukkan perlawanan atau konfrontasi. Gabungan ini menyampaikan makna secara alami tanpa mengharuskan tindakan fisik berdiri.
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: beberapa orang dari antara para pemimpin bani Efraim
  rationale: אֲנָשִׁים memperkenalkan sejumlah orang dari kelompok yang lebih besar; רָאשֵׁי berarti para kepala atau pemimpin. Ungkapan 'bani Efraim' adalah bentuk Indonesia yang lazim bagi konstruksi etnis Ibrani 'anak-anak Efraim'.
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: Azarya ... Berekhya ... Yehizkia ... Amasa
  rationale: Nama-nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Dalam rangkaian nama ayah, 'anak' merupakan padanan patronimik yang jelas dan alami dalam bahasa Indonesia.
- source_word: עַל
  choice: menghadang
  rationale: Bersama קום, preposisi ini menunjukkan bahwa para pemimpin tersebut bangkit untuk menentang atau menghentikan pasukan yang datang. 'Menghadang' cocok dengan tindakan konkret dalam konteks berikutnya.
- source_word: הַבָּאִים מִן הַצָּבָא
  choice: orang-orang yang datang dari pasukan itu
  rationale: Partisipel substantival הַבָּאִים dipertahankan sebagai 'orang-orang yang datang'. צָבָא menunjuk pada pasukan militer yang kembali dari peperangan; kata penunjuk 'itu' membuat rujukannya alami dalam bahasa Indonesia.
