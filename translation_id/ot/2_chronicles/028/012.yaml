translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan penanda 'yaitu' untuk memperkenalkan daftar nama, sambil mempertahankan bahwa keempat orang itu berasal dari jajaran pemimpin Efraim dan menghadang pasukan yang kembali.
