source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: id
  text: Sebab Ahas merampas[a] harta benda dari rumah Yahweh, dari istana raja, dan dari para pejabat[b], lalu memberikannya kepada raja Asyur, tetapi hal itu tidak menolongnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dapat diterjemahkan “membagi” atau “membagi-bagikan”; dalam konteks ini maksudnya ialah mengambil barang-barang berharga dari tempat dan orang yang disebutkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “para pembesar” atau “para pemimpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan sebab atau alasan.
- source_word: חָלַק
  choice: merampas harta benda
  rationale: Makna dasarnya berkaitan dengan membagi atau membagikan, tetapi dalam konteks ini Ahas mengambil barang-barang berharga dari berbagai sumber untuk diberikan kepada raja Asyur. Pilihan ini menyampaikan tindakan konkretnya dengan jelas.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani 'rumah Yahweh' dan nama ilahi secara langsung; dalam konteks ini ungkapan tersebut menunjuk pada bait.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Dalam konteks kerajaan, 'rumah raja' secara idiomatis berarti istana; padanan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: הַשָּׂרִים
  choice: para pejabat
  rationale: Istilah ini menunjuk para pemimpin, pembesar, atau pejabat kerajaan. 'Para pejabat' paling mudah dipahami dalam konteks pemerintahan istana.
- source_word: וַיִּתֵּן
  choice: lalu menyerahkannya
  rationale: Objek yang diserahkan dipahami dari harta yang baru saja disebut. 'Menyerahkan' cocok untuk pemberian harta sebagai pembayaran atau upeti.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: kepada raja Asyur
  rationale: Padanan langsung dan alami bagi penerima pemberian tersebut.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: Namun, hal itu tidak menolongnya
  rationale: Menyatakan hasil bahwa penyerahan harta tersebut tidak menghasilkan pertolongan bagi Ahas, sambil mempertahankan rujukan pronominal yang dapat dipahami dari konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat jelas; 'istana raja' dipakai sebagai padanan idiomatis bagi 'rumah raja', sedangkan 'rumah Yahweh' dipertahankan untuk menjaga bentuk dan resonansi ungkapan sumber.
