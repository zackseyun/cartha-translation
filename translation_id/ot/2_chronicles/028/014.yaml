  source_fidelity: 'Teks secara akurat menerjemahkan unsur-unsur utama Ibrani: הֶחָלוּץ sebagai kelompok bersenjata, הַשִּׁבְיָה sebagai para tawanan, הַבִּזָּה sebagai hasil jarahan, dan לִפְנֵי sebagai tindakan/penempatan di hadapan pihak berwenang serta seluruh perhimpunan. Kata “meninggalkan” sesuai dengan וַיַּעֲזֹב dan tidak menambahkan tindakan resmi seperti “menyerahkan.”'
