  text: וַ/יַּעֲזֹ֣ב הֶֽ/חָל֗וּץ אֶת הַ/שִּׁבְיָה֙ וְ/אֶת הַ/בִּזָּ֔ה לִ/פְנֵ֥י הַ/שָּׂרִ֖ים וְ/כָל הַ/קָּהָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: id
  text: Maka pasukan bersenjata itu meninggalkan para tawanan dan hasil jarahan[a] di hadapan para pemimpin dan seluruh jemaah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rampasan perang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “seluruh umat yang berkumpul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: meninggalkan
  rationale: Kata kerja עזב pada dasarnya berarti meninggalkan atau melepaskan. Dalam konteks ini, pasukan itu melepaskan penguasaan atas para tawanan dan hasil jarahan; “meninggalkan” mempertahankan gambaran tindakan tersebut tanpa menambahkan gagasan penyerahan resmi yang tidak dinyatakan secara eksplisit.
- source_word: הֶחָלוּץ
  choice: pasukan bersenjata itu
  rationale: Bentuk substantival ini menunjuk kepada orang-orang yang diperlengkapi untuk berperang. “Pasukan bersenjata” alami dalam bahasa Indonesia dan sesuai dengan konteks militer.
- source_word: הַשִּׁבְיָה
  choice: para tawanan
  rationale: Walaupun nomina ini dapat berarti keadaan penawanan, di sini yang dimaksud secara konkret ialah orang-orang yang ditawan dalam perang.
- source_word: הַבִּזָּה
  choice: hasil jarahan
  rationale: Nomina ini menunjuk kepada barang-barang yang dirampas dalam perang. “Hasil jarahan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini dapat menyatakan letak di depan maupun tindakan yang dilakukan dalam kehadiran pihak berwenang. “Di hadapan” mempertahankan kedua nuansa itu.
- source_word: הַשָּׂרִים
  choice: para pemimpin
  rationale: שׂרים dapat berarti pejabat, pembesar, atau pemimpin. Dalam konteks ini mereka adalah tokoh berwenang yang mengawasi tindakan tersebut; “para pemimpin” netral dan tidak membatasi mereka pada jabatan kerajaan atau militer.
- source_word: כָל הַקָּהָל
  choice: seluruh jemaah
  rationale: קהל menunjuk kepada komunitas yang berkumpul. “Seluruh jemaah” ringkas dan mempertahankan sifat kolektif kelompok itu tanpa menyiratkan bahwa pertemuan tersebut semata-mata bersifat liturgis.
