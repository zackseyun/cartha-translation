  text: וַ/יֶּאֱסֹ֨ף אָחָ֜ז אֶת כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֗ים וַ/יְקַצֵּץ֙ אֶת כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יִּסְגֹּ֖ר אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וַ/יַּ֨עַשׂ ל֧/וֹ מִזְבְּח֛וֹת בְּ/כָל פִּנָּ֖ה בִּ/ירוּשָׁלִָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: id
  text: Ahas mengumpulkan perlengkapan rumah Allah, lalu memotong-motong perlengkapan rumah Allah itu. Ia menutup pintu-pintu rumah TUHAN dan membuat mezbah-mezbah bagi dirinya di setiap sudut Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי
  choice: perlengkapan
  rationale: Istilah ini mencakup berbagai benda atau perkakas yang digunakan di rumah Allah; 'perlengkapan' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi bejana saja.
- source_word: וַיְקַצֵּץ
  choice: memotong-motong
  rationale: Bentuk intensif dari קצץ menyatakan tindakan memotong menjadi bagian-bagian; pilihan ini mempertahankan daya tindak verba Ibrani.
- source_word: מִזְבְּחוֹת
  choice: mezbah-mezbah
  rationale: Padanan baku dan bermartabat untuk altar persembahan dalam konteks ibadah.
- source_word: בְּכָל־פִנָּה
  choice: di setiap sudut
  rationale: Menerjemahkan ungkapan tempat secara langsung tanpa menentukan apakah yang dimaksud sudut jalan atau lokasi lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal, dengan huruf kapital untuk membedakannya sebagai nama ilahi, tanpa memasukkan tafsiran denominasi.
- issue: Tujuan mezbah-mezbah yang dibuat Ahas
  choice: bagi dirinya
  alternative: untuk dirinya sendiri
  rationale: Mempertahankan pronomina לֹו secara eksplisit dan tidak menambahkan objek penyembahan yang tidak disebutkan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'perlengkapan rumah Allah' dipertahankan karena mencerminkan penekanan dalam teks Ibrani; kalimat dibagi dua agar tetap jelas dan alami.
