source:
  edition: WLC
  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: id
  text: Ia juga membakar dupa di Lembah Ben-Hinom dan membakar anak-anak lelakinya dalam api,[a] sesuai dengan kekejian bangsa-bangsa yang telah diusir Yahweh dari hadapan orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat anak-anak lelakinya melewati api.” Namun, bahasa Ibrani di sini secara lebih langsung berbunyi “membakar anak-anak lelakinya dalam api.”
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: membakar dupa
  rationale: Bentuk Hifil dari קטר menunjuk pada membuat asap persembahan, sering kali dengan membakar dupa. Pilihan ini ringkas, alami, dan sesuai dengan konteks peribadatan.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: di Lembah Ben-Hinom
  rationale: Ungkapan ini adalah nama tempat. Transliterasi Ben-Hinom mempertahankan nama Ibrani dan tidak memasukkan asosiasi teologis yang muncul kemudian pada istilah Gehenna.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: dan membakar anak-anak lelakinya dalam api
  rationale: Bentuk Hifil בער dengan בָּאֵשׁ paling langsung menyatakan pembakaran yang nyata. 'Anak-anak lelakinya' mempertahankan bentuk maskulin jamak בָּנָיו dan tidak melunakkannya menjadi ungkapan ritual yang berbeda.
- source_word: כְּתוֹעֲבוֹת
  choice: sesuai dengan kekejian
  rationale: Pilihan ini mempertahankan daya moral kata תועבות sekaligus menyampaikan bahwa tindakannya mengikuti praktik bangsa-bangsa tersebut.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks sejarah ini, גוים merujuk pada bangsa-bangsa penghuni negeri sebelumnya; 'bangsa-bangsa' alami dan tidak membawa muatan teologis tambahan.
- source_word: הֹרִישׁ
  choice: telah diusir
  rationale: Bentuk Hifil ירש di sini menyatakan bahwa penduduk sebelumnya dibuat kehilangan tempat atau milik mereka. 'Diusir' menyampaikan unsur penghalauan secara jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: dari hadapan keturunan Israel
  rationale: '''Dari hadapan'' mempertahankan gambaran idiom Ibrani tentang penyingkiran, sedangkan ''keturunan Israel'' merupakan padanan Indonesia yang alami bagi בְּנֵי יִשְׂרָאֵל dalam konteks bangsa.'
theological_decisions:
- issue: Apakah gambaran pengurbanan anak perlu diperhalus menjadi ungkapan ritual yang kurang eksplisit
  choice: Teks utama menyatakan bahwa ia 'membakar anak-anak lelakinya dalam api'.
  alternative: ia membuat anak-anak lelakinya melewati api
  rationale: Teks Ibrani memakai בער, bukan rumusan העביר באש yang secara harfiah berarti membuat seseorang melewati api. Terjemahan utama mempertahankan ungkapan yang lebih keras, sementara kemungkinan pengertian ritual yang lazim dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan jelas. Susunan kalimat dibuat alami tanpa menghilangkan kekerasan ungkapan sumber. Nama tempat ditransliterasikan sebagai Ben-Hinom, dan nama ilahi dipertahankan sebagai Yahweh.
