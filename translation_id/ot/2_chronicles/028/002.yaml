base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: id
  text: Ia mengikuti jalan hidup raja-raja Israel dan juga membuat patung-patung tuangan[a] bagi para Baal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “patung-patung leburan.” Istilah Ibrani ini secara khusus menunjuk kepada patung yang dibuat dengan cara menuang bahan cair ke dalam cetakan.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk jamak, “para Baal”; ini mungkin menunjuk kepada berbagai manifestasi lokal atau representasi yang berkaitan dengan penyembahan Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: Ia mengikuti jalan hidup
  rationale: Ungkapan Ibrani secara harfiah berarti “berjalan di jalan-jalan,” sebuah metafora bagi perilaku dan pola hidup. “Mengikuti jalan hidup” mempertahankan metafora itu secara alami dalam bahasa Indonesia modern.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: raja-raja Israel
  rationale: Bentuk jamak dan hubungan kepemilikan dipertahankan secara langsung, dengan rujukan historis kepada para raja kerajaan Israel.
- source_word: וְגַם
  choice: dan juga
  rationale: Ungkapan ini menandai tindakan berikutnya sebagai pelanggaran tambahan.
- source_word: מַסֵּכוֹת
  choice: patung-patung tuangan
  rationale: Kata benda jamak ini menunjuk secara khusus kepada patung yang dibuat dengan proses menuang bahan cair ke dalam cetakan; pilihan ini lebih tepat daripada istilah umum “berhala.”
- source_word: עָשָׂה
  choice: membuat
  rationale: Padanan umum dan alami yang menyampaikan tindakan tersebut tanpa menambahkan nuansa yang tidak terdapat dalam teks.
- source_word: לַבְּעָלִים
  choice: bagi para Baal
  rationale: Bentuk jamak Ibrani dipertahankan. “Para Baal” dapat dipahami sebagai berbagai manifestasi lokal atau bentuk kultis yang terkait dengan penyembahan Baal.
theological_decisions:
- issue: Bentuk jamak בְּעָלִים
  choice: para Baal
  alternative: Baal; berhala-berhala Baal
  rationale: Teks Ibrani secara eksplisit memakai bentuk jamak. Mempertahankannya menghindari penghilangan detail yang mungkin menunjuk kepada berbagai manifestasi lokal atau representasi kultis Baal.
- issue: Metafora berjalan sebagai gambaran perilaku
  choice: mengikuti jalan hidup raja-raja Israel
  alternative: berperilaku seperti raja-raja Israel; mengikuti praktik raja-raja Israel
  rationale: Pilihan ini mempertahankan citra “jalan” dari bahasa Ibrani sekaligus menyampaikan dengan jelas bahwa yang dimaksud ialah pola perilaku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ungkapan “mengikuti jalan hidup” menjaga metafora Ibrani tanpa menghasilkan susunan yang kaku, sedangkan “patung-patung tuangan” dan “para Baal” mempertahankan rincian leksikal sumber.
