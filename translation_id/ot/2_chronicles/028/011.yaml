id: 2CH.28.11
reference: 2 Chronicles 28:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה שְׁמָע֔וּ/נִי וְ/הָשִׁ֨יבוּ֙ הַ/שִּׁבְיָ֔ה אֲשֶׁ֥ר שְׁבִיתֶ֖ם מֵ/אֲחֵי/כֶ֑ם כִּ֛י חֲר֥וֹן אַף יְהוָ֖ה עֲלֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: id
  text: Sekarang, dengarkanlah aku dan pulangkanlah para tawanan yang telah kalian tawan dari saudara-saudara kalian[a], sebab murka Yahweh yang menyala-nyala tertuju kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesama orang Israel.” Teks Ibrani mengatakan “saudara-saudara kalian,” dengan memakai bahasa kekerabatan bagi anggota umat perjanjian yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan yang mendesak dalam seruan langsung. Konjungsi waw tidak perlu dinyatakan tersendiri agar kalimat Indonesia tetap alami.
- source_word: שְׁמָעוּנִי
  choice: dengarkanlah aku
  rationale: Bentuk imperatif dengan akhiran orang pertama tunggal menuntut perhatian, bukan sekadar kemampuan mendengar. Partikel -lah mempertahankan daya seruannya.
- source_word: וְהָשִׁיבוּ
  choice: pulangkanlah
  rationale: Bentuk Hifil dari שׁוב berarti menyebabkan kembali. 'Pulangkanlah' secara alami menyatakan bahwa para tawanan harus dikembalikan ke tempat atau kelompok asal mereka.
- source_word: הַשִּׁבְיָה
  choice: para tawanan
  rationale: Nomina kolektif ini di sini menunjuk kepada orang-orang yang ditawan dalam perang; bentuk konkret 'para tawanan' paling jelas dalam bahasa Indonesia.
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: yang telah kalian tawan
  rationale: Klausa relatif mengidentifikasi para tawanan sebagai orang-orang yang ditangkap oleh para pendengar. Pengulangan akar makna 'tawan' wajar dan jelas dalam bahasa Indonesia.
- source_word: מֵאֲחֵיכֶם
  choice: dari saudara-saudara kalian
  rationale: Mempertahankan bahasa kekerabatan Ibrani. Dalam konteks ini cakupannya adalah sesama anggota umat Israel, yang dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah sebelumnya dengan hubungan penjelas yang jelas dan bermartabat.
- source_word: חֲרוֹן אַף
  choice: murka ... yang menyala-nyala
  rationale: Ungkapan ini menggambarkan panas atau kobaran kemarahan. Pilihan ini mempertahankan metafora dan intensitasnya secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עֲלֵיכֶם
  choice: tertuju kepada kalian
  rationale: Preposisi עַל bersama murka menunjukkan bahwa murka itu diarahkan kepada para pendengar. Ungkapan ini alami tanpa memperlemah ancamannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan 'saudara-saudara kalian'
  choice: Mempertahankan bahasa kekerabatan dalam teks utama
  alternative: sesama orang Israel
  rationale: Kata אָח secara harfiah berarti saudara, tetapi dalam konteks nasional-perjanjian dapat mencakup sesama umat Israel. Teks utama mempertahankan citra kekerabatan, sedangkan catatan menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada seruan yang tegas dan bermartabat. Kata ganti jamak 'kalian' dipakai karena semua bentuk orang kedua dalam bahasa Ibrani bersifat jamak; pilihan ini juga menghindari ketaksaan 'kamu'. Metafora panas dalam murka dipertahankan melalui 'menyala-nyala'.
