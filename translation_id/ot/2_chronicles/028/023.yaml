id: 2CH.28.23
reference: 2 Chronicles 28:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: id
  text: Ia mempersembahkan kurban kepada dewa-dewa Damsyik yang telah mengalahkannya[a]. Katanya, “Karena dewa-dewa raja-raja Aram[b] menolong mereka, aku akan mempersembahkan kurban kepada dewa-dewa itu supaya mereka menolong aku.” Namun, dewa-dewa itu justru mendatangkan kejatuhan baginya dan bagi seluruh Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang sedang mengalahkannya” atau “yang menghantamnya.” Partisipel Ibrani dapat menggambarkan tindakan yang sedang berlangsung atau tindakan yang menjadi ciri.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dewa-dewa raja-raja Aram”; bahasa Ibrani memakai bentuk jamak “raja-raja.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “mereka menjadi baginya untuk menyebabkan dia tersandung, dan bagi seluruh Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Ia mempersembahkan kurban
  rationale: Kata kerja זבח menunjuk pada tindakan mempersembahkan kurban; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kultisnya.
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: kepada dewa-dewa Damsyik
  rationale: Bentuk אֱלֹהֵי adalah konstruksi jamak dalam konteks penyembahan berhala. “Damsyik” merupakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַמַּכִּים בּוֹ
  choice: yang telah mengalahkannya
  rationale: Partisipel berartikel menerangkan dewa-dewa sebagai pihak yang, menurut pemahaman Ahas, mengalahkannya melalui kemenangan Aram. Bentuk lampau sesuai dengan alur narasi, sementara catatan kaki mempertahankan kemungkinan aspek yang sedang berlangsung.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: dewa-dewa raja-raja Aram
  rationale: Terjemahan mempertahankan bentuk jamak מַלְכֵי, “raja-raja,” tanpa menghaluskannya menjadi bentuk tunggal.
- source_word: מַעְזְרִים אוֹתָם
  choice: menolong mereka
  rationale: Partisipel menyatakan tindakan yang dipandang berlangsung atau menjadi ciri; bentuk kini sederhana paling wajar dalam alasan yang dikemukakan Ahas.
- source_word: לָהֶם אֲזַבֵּחַ וְיַעְזְרוּנִי
  choice: aku akan mempersembahkan kurban kepada dewa-dewa itu supaya mereka menolong aku
  rationale: Bentuk imperfek pertama menyatakan niat Ahas, sedangkan klausa berikutnya secara alami mengungkapkan tujuan yang diharapkannya.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  choice: Namun, dewa-dewa itu justru mendatangkan kejatuhan baginya dan bagi seluruh Israel
  rationale: Kata הכשיל dalam Hifil berarti menyebabkan tersandung atau membawa kepada keruntuhan. “Namun” dan “justru” mengungkapkan pertentangan kontekstual, sementara pasangan “baginya dan bagi seluruh Israel” mempertahankan koordinasi Ibraninya.
theological_decisions:
- issue: Dewa-dewa Damsyik disebut sebagai pihak yang mengalahkan Ahas
  choice: Mempertahankan pernyataan itu sebagai cara pandang pagan Ahas yang dilaporkan narator
  alternative: Menambahkan penjelasan dalam teks bahwa Ahas hanya menyangka dewa-dewa itu telah mengalahkannya
  rationale: Teks melaporkan penalaran Ahas tanpa menyatakan bahwa narator mengakui dewa-dewa itu sebagai pelaku ilahi yang nyata. Klausa penutup mempertahankan ironi dan penilaian teologis narasi tanpa memasukkan penjelasan doktrinal ke dalam teks.
- issue: Hubungan וְיַעְזְרוּנִי dengan niat mempersembahkan kurban
  choice: 'Menerjemahkannya sebagai tujuan: “supaya mereka menolong aku”'
  alternative: “dan mereka akan menolong aku”
  rationale: Dalam konteks ujaran Ahas, klausa tersebut paling alami menyatakan tujuan atau hasil yang diharapkannya, tetapi tidak memastikan bahwa pertolongan itu benar-benar akan terjadi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Istilah “dewa-dewa” membedakan ilah-ilah asing dari Allah Israel; “mempersembahkan kurban” mempertahankan nuansa kultis. Bentuk nama “Damsyik” dan “Aram” mengikuti kelaziman Alkitab bahasa Indonesia.
