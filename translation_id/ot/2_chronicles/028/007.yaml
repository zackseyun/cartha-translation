id: 2CH.28.7
reference: 2 Chronicles 28:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יַּהֲרֹ֞ג זִכְרִ֣י גִּבּ֣וֹר אֶפְרַ֗יִם אֶת מַעֲשֵׂיָ֨הוּ֙ בֶּן הַ/מֶּ֔לֶךְ וְ/אֶת עַזְרִיקָ֖ם נְגִ֣יד הַ/בָּ֑יִת וְ/אֶת אֶלְקָנָ֖ה מִשְׁנֵ֥ה הַ/מֶּֽלֶךְ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: id
  text: Zikhri, seorang kesatria Efraim,[a] membunuh Maaseya, anak raja, Azrikam, kepala istana,[b] dan Elkana, orang kedua setelah raja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seorang pejuang Efraim" atau "seorang pahlawan Efraim."
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "pemimpin rumah"; dalam konteks ini kemungkinan merujuk pada istana atau rumah tangga kerajaan.
    reason: lexical_alternative
  - marker: c
    text: Atau "wakil raja" atau "orang kedua dalam pemerintahan raja."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: membunuh
  rationale: Kata kerja הרג secara langsung menyatakan tindakan membunuh; pilihan ini jelas dan wajar dalam narasi Indonesia modern.
- source_word: זִכְרִי
  choice: Zikhri
  rationale: Nama diri ditransliterasikan dengan mempertahankan bunyi konsonan Ibrani כ sebagai kh.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: seorang kesatria Efraim
  rationale: גִּבּוֹר dapat berarti orang perkasa, pahlawan, atau pejuang. 'Kesatria Efraim' menyampaikan kecakapan tempur dan afiliasinya dengan Efraim secara alami tanpa mengharuskan status kebangsawanan.
- source_word: מַעֲשֵׂיָהוּ
  choice: Maaseya
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן הַמֶּלֶךְ
  choice: anak raja
  rationale: Ungkapan konstruksi Ibrani ini secara alami berarti anak laki-laki raja; konteks tidak menuntut penambahan kata 'seorang' atau identifikasi lebih lanjut.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Nama diri ditransliterasikan.
- source_word: נְגִיד הַבָּיִת
  choice: kepala istana
  rationale: נְגִיד menunjuk seorang pemimpin atau pejabat, sedangkan הַבָּיִת dalam konteks kerajaan kemungkinan besar merujuk pada istana atau rumah tangga kerajaan. 'Kepala istana' alami sekaligus tidak terlalu memperinci jabatan.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang mudah dibaca.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: orang kedua setelah raja
  rationale: מִשְׁנֶה menyatakan kedudukan kedua dalam hierarki. Pilihan ini mempertahankan makna peringkat tanpa memasukkan gelar teknis yang tidak terdapat dalam teks.
