  source_fidelity: 'Teks Indonesia secara akurat mengikuti Ibrani: Zikhri sebagai seorang gibbor dari Efraim membunuh tiga pejabat/anggota istana yang disebutkan. Urutan nama dan aposisi jabatan dipertahankan. “Kepala istana” merupakan padanan fungsional yang wajar untuk נְגִיד הַבַּיִת dalam konteks kerajaan, sementara catatan kaki dengan tepat mempertahankan arti harfiahnya dan kemungkinan cakupan ‘rumah tangga kerajaan’.'
