  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: id
  text: Lalu bangkitlah orang-orang yang telah ditetapkan menurut nama. Mereka mengambil tanggung jawab atas para tawanan dan mengenakan pakaian dari hasil jarahan kepada semua orang yang telanjang di antara mereka. Mereka memberi para tawanan itu pakaian dan sandal, makanan dan minuman, serta mengolesi mereka dengan minyak. Mereka mengangkut dengan keledai semua orang yang lemah di antara mereka. Mereka membawa para tawanan itu ke Yerikho, kota pohon kurma, kepada saudara-saudara mereka[a], lalu kembali ke Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sanak saudara mereka” atau “sesama orang Israel.”
    reason: Menjelaskan rentang makna אֲחֵיהֶם tanpa mempersempitnya secara tidak perlu dalam teks utama.
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: telah ditunjuk dengan menyebut nama mereka
  rationale: Bentuk Niphal dengan frasa 'dengan nama-nama' menunjukkan bahwa orang-orang itu secara khusus disebut atau ditetapkan; ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan apakah penyebutan itu merupakan pengangkatan resmi.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: mengambil tanggung jawab atas para tawanan
  rationale: Dalam konteks tindakan belas kasih, החזיק ב menunjuk pada menerima tanggung jawab dan mengurus para tawanan, bukan menangkap mereka secara paksa.
- source_word: מַעֲרֻמֵּיהֶם
  choice: semua orang yang telanjang di antara mereka
  rationale: Merujuk secara distributif kepada anggota kelompok tawanan yang telanjang atau telah dilucuti pakaiannya.
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: mengenakan ... pakaian dari hasil jarahan
  rationale: Menjaga keterangan bahwa pakaian itu berasal dari barang jarahan sambil memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: וַיַּלְבִּשׁוּם וַיַּנְעִלוּם
  choice: memberi para tawanan itu pakaian dan sandal
  rationale: Menyampaikan tindakan mengenakan pakaian dan alas kaki secara alami; 'sandal' cocok dengan lingkungan dunia kuno.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: makanan dan minuman
  rationale: Mewakili bentuk kausatif 'memberi makan' dan 'memberi minum' tanpa menentukan jenis minuman yang tidak disebutkan sumber.
- source_word: וַיְסֻכוּם
  choice: mengolesi mereka dengan minyak
  rationale: סוך di sini kemungkinan menunjuk pada perawatan tubuh dengan minyak, bukan pengurapan seremonial; terjemahan ini mempertahankan tindakan konkretnya.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: Semua orang yang lemah mereka angkut dengan keledai
  rationale: כּוֹשֵׁל secara harfiah adalah orang yang tersandung atau terhuyung, yakni yang lemah; konteks menunjukkan bahwa mereka dibawa dengan keledai, sehingga 'angkut' lebih jelas dan alami daripada 'pimpin ... di atas keledai'.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: Yerikho, kota pohon kurma
  rationale: Menerjemahkan julukan geografis Yerikho secara transparan.
theological_decisions:
- issue: Makna אֲחֵיהֶם dalam konteks kekerabatan umat
  choice: saudara-saudara mereka
  alternative: sanak saudara mereka; sesama orang Israel
  rationale: Kata Ibrani berbentuk maskulin jamak dan secara harfiah berarti 'saudara-saudara mereka', tetapi dalam konteks ini dapat mencakup kerabat atau sesama anggota umat. Teks utama mempertahankan bentuk konkret, sedangkan cakupan yang lebih luas dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan Ibrani tentang pemberian pakaian dipertahankan sebagian untuk menjaga penekanan, tetapi rangkaian tindakan berikutnya dipadatkan secara wajar agar lancar dibaca. Penanda catatan [a] hadir dalam teks utama.
