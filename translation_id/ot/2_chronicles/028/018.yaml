language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: id
  text: Orang Filistin menyerbu kota-kota di dataran rendah dan Negeb di wilayah Yehuda. Mereka merebut Bet-Semes, Ayalon, Gederot, Sokho beserta desa-desanya, Timna beserta desa-desanya, dan Gimzo beserta desa-desanya, lalu menetap di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Etnonim ini secara alami dinyatakan dalam bahasa Indonesia dengan 'orang Filistin'; waw pembuka tidak perlu diterjemahkan secara mekanis karena ayat ini tetap mengalir wajar dalam narasi.
- source_word: פָּשְׁטוּ
  choice: menyerbu
  rationale: Dalam konteks militer, verba ini menunjukkan serangan atau penyerbuan ke suatu wilayah, bukan sekadar menyebar.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: kota-kota di daerah perbukitan rendah dan Tanah Negeb di wilayah Yehuda
  rationale: השפלה menunjuk kawasan geografis perbukitan rendah di sebelah barat Yehuda, sedangkan הנגב dipertahankan sebagai nama kawasan Negeb. Frasa ליהודה menyatakan keterkaitan kedua kawasan itu dengan Yehuda.
- source_word: וַיִּלְכְּדוּ
  choice: Mereka merebut
  rationale: Pilihan ini lazim dan tepat untuk tindakan militer mengambil alih kota-kota.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama tempat ditransliterasikan mengikuti bentuk yang alami dan dikenal dalam bahasa Indonesia.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Transliterasi nama tempat ini mencerminkan konsonan dan vokal Ibrani secara wajar bagi pembaca Indonesia.
- source_word: הַגְּדֵרוֹת
  choice: Gederot
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: שׂוֹכוֹ
  choice: Sokho
  rationale: Transliterasi mempertahankan bunyi frikatif huruf kaf bertanda rafe dalam nama Ibrani ini.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: beserta desa-desanya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', tetapi merupakan idiom bagi permukiman bawahan di sekitar sebuah kota; 'desa-desanya' menyampaikan maknanya secara jelas.
- source_word: תִּמְנָה
  choice: Timna
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang ringkas dan wajar.
- source_word: גִּמְזוֹ
  choice: Gimzo
  rationale: Nama tempat ditransliterasikan tanpa diterjemahkan.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: lalu menetap di sana
  rationale: Dalam konteks sesudah penaklukan, ישב menunjukkan bahwa mereka tinggal dan menduduki wilayah itu; 'menetap' mengungkapkan makna tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama wilayah Negeb dipertahankan sebagai nama geografis, sedangkan Shefela dijelaskan secara semantis sebagai 'daerah perbukitan rendah'. Struktur daftar dibuat lancar tanpa mengurangi pengulangan 'beserta desa-desanya' yang memperjelas cakupan setiap kota.
