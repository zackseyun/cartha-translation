reference: 2 Chronicles 28:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: id
  text: Yahweh, Allahnya, menyerahkan dia ke tangan raja Aram.[a] Mereka memukulnya dan menawan sejumlah besar orang darinya,[b] lalu membawa mereka ke Damsyik. Dia juga diserahkan ke tangan raja Israel, yang menghantamnya dengan pukulan besar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "raja Siria"; dalam bahasa Ibrani: "raja Aram".'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: "menawan darinya tawanan yang besar"; yakni, sejumlah besar tawanan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau "menimpakan kekalahan besar kepadanya". Secara harfiah: "menghantamnya dengan pukulan besar".'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: menyerahkan dia ke tangan
  rationale: Ungkapan נתן בְּיַד menyatakan penyerahan seseorang ke dalam kuasa pihak lain. Bentuk ini mempertahankan citra tangan dalam bahasa Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Bentuk posesif dipertahankan karena teks menyebut Yahweh sebagai Allah dari tokoh yang sedang dihukum.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Aram adalah nama diri Ibrani; bentuk ini dipertahankan, sedangkan 'Siria' dicatat sebagai padanan alternatif.
- source_word: וַיַּכּוּ בוֹ
  choice: Orang-orang Aram mengalahkannya
  rationale: Subjek jamak tersirat merujuk kepada pasukan Aram. Dalam konteks peperangan, נכה menyatakan serangan yang menghasilkan kekalahan; penyebutan subjek secara eksplisit mencegah ambiguitas dalam bahasa Indonesia.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: membawa pergi banyak tawanan dari kerajaannya
  rationale: שׁביה dapat menunjuk pada tawanan atau penawanan. Ungkapan konkret 'banyak tawanan' menyampaikan jumlah besar secara alami. 'Dari kerajaannya' menjelaskan cakupan pronomina מִמֶּנּוּ tanpa menyatakan bahwa Ahaz sendiri dibawa tertawan.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: lalu membawa mereka ke Damsyik
  rationale: Objek yang tidak dinyatakan dalam bahasa Ibrani dipasok dari konteks, yakni para tawanan. 'Damsyik' adalah bentuk nama kota yang lazim dalam bahasa Indonesia Alkitabiah.
- source_word: וְגַם ... נִתָּן
  choice: Dia juga diserahkan
  rationale: Bentuk pasif mempertahankan gema kata נתן pada klausa pertama dan menandai tambahan hukuman yang dialami tokoh tersebut.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: yang menimpakan kekalahan besar kepadanya
  rationale: Secara harfiah frasa ini berbicara tentang 'pukulan besar', tetapi dalam konteks militer ungkapan Indonesia 'menimpakan kekalahan besar' menyampaikan maknanya dengan wajar. Citra harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Peran ilahi dalam kekalahan Ahaz dan Yehuda
  choice: Yahweh secara eksplisit menjadi pihak yang menyerahkan dia kepada raja-raja asing.
  alternative: Menerjemahkan kejadian itu semata-mata sebagai hasil politik atau militer.
  rationale: Teks memakai נתן dua kali, mula-mula aktif dengan Yahweh sebagai pelaku dan kemudian pasif, sehingga kekalahan militer dibingkai sebagai tindakan penghakiman ilahi.
- issue: Rujukan pronomina tunggal
  choice: Pronomina tunggal diterjemahkan sebagai 'dia' dan tidak diganti dengan nama Ahaz atau Yehuda.
  alternative: Menjelaskan rujukannya sebagai 'Ahaz' atau memperluasnya menjadi 'Ahaz dan Yehuda'.
  rationale: Bahasa Ibrani mempertahankan pronomina maskulin tunggal. Terjemahan tidak menghapus ketegangan antara raja sebagai pribadi dan kerajaan yang diwakilinya.
- issue: Nama ilahi
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama perjanjian יהוה; transliterasi mempertahankan nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur kalimat dibuat lancar bagi pembaca umum, sementara nama Yahweh, citra 'ke tangan', pronomina tunggal, dan hubungan sebab-akibat teologis dari teks Ibrani tetap dipertahankan. Semua penanda catatan kaki [a]–[c] muncul dalam teks utama.
