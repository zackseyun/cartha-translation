  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: id
  text: Kemudian Tiglat-Pileser, raja Asyur, datang melawannya dan menekannya, tetapi tidak menguatkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan menekannya, dan tidak menguatkannya.”'
    reason: Bahasa Ibrani menghubungkan kedua klausa dengan “dan”; kata “tetapi” dalam teks utama menyatakan hubungan kontras yang tersirat oleh konteks.
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: datang menyerang dia
  rationale: Dalam konteks militer dan politik, idiom בוא על memiliki nuansa bermusuhan. Terjemahan ini lebih tepat daripada ungkapan netral 'datang kepadanya'.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: Tiglat-Pileser
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Padanan langsung bagi konstruksi Ibrani dan bentuk geografis yang lazim dalam bahasa Indonesia.
- source_word: וַיָּצַר לוֹ
  choice: mendesaknya
  rationale: Kata kerja צרר dapat menyatakan tindakan menekan, mengimpit, atau mendatangkan kesesakan. 'Mendesaknya' mempertahankan keluasan makna tanpa mempersempitnya menjadi pengepungan.
- source_word: וְלֹא חֲזָקוֹ
  choice: tetapi tidak menguatkannya
  rationale: חזק di sini berarti menguatkan atau memberi dukungan. 'Tetapi' menyatakan kontras yang jelas dari konteks, sedangkan 'menguatkannya' tetap dekat dengan bentuk leksikal Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “dia” mempertahankan rujukan kepada Ahas dari konteks, sedangkan bentuk enklitik pada “menguatkannya” menjaga kelancaran kalimat.
