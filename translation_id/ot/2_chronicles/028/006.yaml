  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: id
  text: Pekah anak Remalya membunuh seratus dua puluh ribu orang di Yehuda dalam satu hari[a], semuanya laki-laki yang gagah berani[b], karena mereka telah meninggalkan Yahweh[c], Allah nenek moyang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam sehari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “putra-putra keperkasaan”; maksudnya, laki-laki yang gagah berani.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “ketika mereka meninggalkan Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: membunuh
  rationale: Kata kerja הרג secara langsung menyatakan tindakan membunuh; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Preposisi ב menandai lokasi pembunuhan, sedangkan 'Yehuda' adalah nama baku kerajaan atau wilayah tersebut dalam konteks ini.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: seratus dua puluh ribu orang
  rationale: Ini menerjemahkan bilangan Ibrani secara langsung; 'orang' ditambahkan secara wajar untuk memperjelas benda yang dihitung tanpa mengubah makna.
- source_word: בְּיוֹם אֶחָד
  choice: dalam satu hari
  rationale: Terjemahan dekat dari ungkapan Ibrani yang secara alami menyampaikan bahwa seluruh pembunuhan itu terjadi dalam jangka satu hari.
- source_word: הַכֹּל
  choice: mereka semua
  rationale: Frasa ini merangkum seluruh korban yang baru disebutkan dan menghubungkannya dengan keterangan berikutnya.
- source_word: בְּנֵי חָיִל
  choice: para pejuang yang gagah berani
  rationale: Secara harfiah berarti 'anak-anak kegagahan/kekuatan' dan dalam konteks ini menunjuk kepada laki-laki cakap yang berperang; pilihan ini menyampaikan fungsi militer dan sifat keberanian mereka.
- source_word: בְּעָזְבָם
  choice: karena mereka telah meninggalkan
  rationale: ב dengan infinitif konstruk dapat menyatakan keadaan, waktu, atau sebab. Konteks Tawarikh mendukung hubungan sebab, sementara alternatif temporal dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: Allah nenek moyang mereka
  rationale: Ungkapan ini mempertahankan hubungan historis dan perjanjian dengan generasi-generasi terdahulu dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna בְּעָזְבָם dalam hubungannya dengan pembantaian
  choice: 'kausal: ''karena mereka telah meninggalkan'''
  alternative: 'temporal atau situasional: ''ketika mereka meninggalkan'''
  rationale: Konteks penilaian teologis dalam Tawarikh mendukung makna sebab, tetapi bentuk Ibraninya juga dapat dibaca secara temporal atau situasional; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Dua kalimat dipakai untuk menghindari rangkaian klausa yang berat, sementara hubungan sebab tetap dinyatakan secara eksplisit. Semua penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
