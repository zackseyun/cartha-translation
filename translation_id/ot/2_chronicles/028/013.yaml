source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ/הֶ֗ם לֹא תָבִ֤יאוּ אֶת הַ/שִּׁבְיָה֙ הֵ֔נָּה כִּי֩ לְ/אַשְׁמַ֨ת יְהוָ֤ה עָלֵ֨י/נוּ֙ אַתֶּ֣ם אֹמְרִ֔ים לְ/הֹסִ֥יף עַל חַטֹּאתֵ֖י/נוּ וְ/עַל אַשְׁמָתֵ֑י/נוּ כִּֽי רַבָּ֤ה אַשְׁמָה֙ לָ֔/נוּ וַ/חֲר֥וֹן אָ֖ף עַל יִשְׂרָאֵֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: id
  text: Mereka berkata kepada mereka, “Jangan bawa para tawanan itu ke sini! Sebab maksud kalian untuk menambah dosa-dosa dan kesalahan kami akan mendatangkan atas kami kesalahan terhadap Yahweh[a]. Kesalahan kami sudah sangat besar, dan murka yang menyala-nyala[b] menimpa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendatangkan atas kami kesalahan dari Yahweh.” Frasa Ibraninya padat dan dapat menekankan kesalahan terhadap Yahweh atau tanggungan yang menimpa mereka melalui penghakiman-Nya.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “nyala murka,” yaitu ungkapan Ibrani untuk murka yang sangat hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: para tawanan itu
  rationale: Nomina ini dapat menunjuk pada keadaan tertawan atau kumpulan orang yang ditawan. Karena mereka akan dibawa ke suatu tempat, makna konkret ‘para tawanan’ paling sesuai.
- source_word: הֵנָּה
  choice: ke sini
  rationale: Adverbia deiktis ini menunjukkan gerak menuju tempat para pembicara; ‘ke sini’ alami setelah verba ‘bawa’.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: membuat kami menanggung kesalahan terhadap Yahweh
  rationale: Frasa Ibrani ini padat dan sulit. Terjemahan utama menyatakan kesalahan atau tanggungan di hadapan Yahweh yang akan menimpa mereka, sedangkan catatan kaki mempertahankan kemungkinan nuansa lain.
- source_word: אַתֶּם אֹמְרִים
  choice: kalian bermaksud
  rationale: Secara harfiah berarti ‘kalian mengatakan’, tetapi dalam konteks ini ungkapan tersebut menyatakan maksud untuk melakukan tindakan.
- source_word: לְהֹסִיף עַל
  choice: menambah
  rationale: Mengungkapkan penumpukan dosa dan kesalahan yang sudah ada.
- source_word: חַטֹּאתֵינוּ
  choice: dosa-dosa kami
  rationale: Mempertahankan bentuk jamak dan membedakannya dari istilah untuk kesalahan atau tanggungan.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: kesalahan kami / kesalahan kami sudah sangat besar
  rationale: ‘Kesalahan’ mempertahankan nuansa keadaan bersalah atau tanggungan, berbeda dari perbuatan dosa itu sendiri. ‘Sudah’ tersirat oleh alasan bahwa tindakan baru akan menambah keadaan yang telah ada.
- source_word: וַחֲרוֹן אָף
  choice: murka yang menyala-nyala
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang ‘nyala murka’ sekaligus menyampaikan intensitasnya secara jelas.
- source_word: עַל יִשְׂרָאֵל
  choice: menimpa Israel
  rationale: Preposisi עַל bersama murka dapat menyatakan bahwa murka berada atas atau menimpa Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; bentuk ‘Yahweh’ mempertahankan nama diri tersebut.
- issue: Makna לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: kesalahan terhadap Yahweh yang harus mereka tanggung
  alternative: kesalahan yang berasal dari penghukuman Yahweh dan menimpa mereka
  rationale: Susunan Ibrani memungkinkan hubungan ‘kesalahan’ dengan Yahweh dipahami sebagai kesalahan terhadap-Nya atau sebagai tanggungan yang datang melalui penghakiman-Nya. Teks utama memilih ungkapan yang alami tanpa meniadakan alternatif, yang dicatat dalam catatan kaki.
- issue: Rujukan יִשְׂרָאֵל dalam konteks kerajaan utara
  choice: Israel
  alternative: Efraim; kerajaan utara
  rationale: Nama yang terdapat dalam teks dipertahankan agar cakupan historis dan teologisnya tidak dipersempit secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Pengulangan ‘mereka ... kepada mereka’ dipertahankan karena ayat Ibrani memakai dua kelompok pronominal dan identitas kelompok dijelaskan oleh konteks. Seruan pada larangan mencerminkan desakan para pembicara.
