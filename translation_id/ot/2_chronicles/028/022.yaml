base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: id
  text: Pada waktu ia mengalami kesesakan, ia terus berlaku tidak setia terhadap Yahweh—dialah Raja Ahas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  choice: Pada masa ia terdesak
  rationale: Frasa temporal ini menyatakan keadaan ketika tekanan atau kesesakan menimpa Ahas. Bentuk verbal “ia terdesak” alami dalam bahasa Indonesia dan mempertahankan bahwa ia sedang berada di bawah tekanan.
- source_word: וַיּוֹסֶף לִמְעוֹל
  choice: ia terus berlaku tidak setia
  rationale: Konstruksi יסף dengan infinitif berarti melanjutkan atau berbuat lebih jauh; מעל menunjuk pada pelanggaran kesetiaan, khususnya terhadap Allah. Terjemahan ini menyampaikan idiom Ibrani tanpa kekakuan harfiah “menambahkan untuk”.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Dengan מעל, preposisi menandai pihak yang terhadapnya ketidaksetiaan dilakukan. Dalam bahasa Indonesia, “berlaku tidak setia kepada” merupakan kolokasi yang wajar; nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: dialah Raja Ahas
  rationale: Pronomina mandiri הוּא memberi penekanan pada identitas pelaku. “Dialah” mempertahankan daya emfatis itu, sedangkan “Raja Ahas” adalah susunan gelar dan nama yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian dan mengikuti bukti sumber serta keputusan teologis konsultasi yang diberikan.
- issue: Sifat ketidaksetiaan Ahas
  choice: berlaku tidak setia kepada Yahweh
  alternative: berkhianat terhadap Yahweh atau melakukan pelanggaran terhadap Yahweh
  rationale: מעל mengandung gagasan pelanggaran kepercayaan atau kesetiaan, sering dalam konteks perjanjian dan ibadah. Pilihan ini mempertahankan dimensi relasional-teologis tanpa mempersempitnya hanya pada satu jenis dosa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Tanda pisah mempertahankan kejutan dan penekanan pada identitas pelaku; “dialah” merepresentasikan pronomina Ibrani yang emfatis. Tidak diperlukan catatan kaki karena idiom יסף + infinitif dapat diterjemahkan secara langsung dan alami sebagai “terus” tanpa kehilangan makna penting.
