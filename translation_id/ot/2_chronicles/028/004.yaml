  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: id
  text: Ia mempersembahkan kurban dan membakar dupa di tempat-tempat tinggi[a], di atas bukit-bukit, dan di bawah setiap pohon yang rindang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia mempersembahkan kurban dan membakar persembahan sehingga asapnya naik di tempat-tempat pemujaan di bukit, di atas bukit-bukit, dan di bawah setiap pohon yang rindang.”'
    reason: Alternatif ini mencerminkan cakupan makna וַיְקַטֵּר dan kemungkinan padanan yang lebih umum bagi בַּבָּמוֹת.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Ia mempersembahkan kurban
  rationale: Bentuk piel dari זבח menyatakan tindakan mempersembahkan kurban. Ungkapan ini alami dalam bahasa Indonesia dan lebih jelas daripada sekadar 'berkurban'.
- source_word: וַיְקַטֵּר
  choice: dan membakar dupa
  rationale: Bentuk piel dari קטר dapat berarti membakar dupa atau membuat persembahan naik sebagai asap. Dalam konteks peribadatan ini, 'membakar dupa' merupakan padanan yang alami dan paling mungkin, sementara cakupan makna yang lebih luas dicatat dalam catatan kaki.
- source_word: בַּבָּמוֹת
  choice: di bukit-bukit pengurbanan
  rationale: במות merupakan istilah bagi tempat pemujaan setempat yang biasanya berada di tempat tinggi. 'Bukit-bukit pengurbanan' mempertahankan ciri lokasi sekaligus fungsi kultisnya dan membedakannya dari bukit biasa pada frasa berikutnya.
- source_word: וְעַל הַגְּבָעוֹת
  choice: di atas bukit-bukit
  rationale: גבעות adalah kata biasa untuk bukit-bukit. 'Di atas' mencerminkan עַל dan membedakannya secara wajar dari istilah kultis sebelumnya.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: dan di bawah setiap pohon yang rindang
  rationale: רענן menggambarkan tumbuhan yang segar, hijau, atau lebat. 'Pohon yang rindang' menghasilkan gambaran yang alami dalam bahasa Indonesia sambil mempertahankan ungkapan baku tentang lokasi pemujaan.
theological_decisions:
- issue: Ungkapan lokasi kultis yang berkaitan dengan ibadah terlarang
  choice: Mempertahankan gambaran konkret 'bukit-bukit pengurbanan' dan 'di bawah setiap pohon yang rindang'
  alternative: Menafsirkannya secara langsung sebagai 'tempat-tempat pemujaan berhala'
  rationale: Teks Ibrani menyebut lokasi dan praktik kultis tanpa secara eksplisit memasukkan kata 'berhala' dalam ayat ini. Terjemahan mempertahankan kaitan antarteks dan menghindari penjelasan teologis yang berlebihan.
- issue: Objek tindakan וַיְקַטֵּר
  choice: membakar dupa
  alternative: membakar persembahan sampai asapnya naik
  rationale: Kata kerja itu dapat menunjuk pada pembakaran dupa maupun pembakaran persembahan sebagai asap harum. Konteks mendukung padanan lazim 'membakar dupa', tetapi ambiguitas leksikal dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Ia' dipakai sebagai pronomina naratif; 'kurban' mengikuti ejaan baku. Istilah 'bukit-bukit pengurbanan' dipilih untuk membedakan lokasi kultis במות dari bukit-bukit biasa גבעות yang langsung menyusul.
