  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: id
  text: Pada waktu itu Raja Ahas mengirim kepada raja-raja Asyur untuk meminta bantuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “raja-raja Asyur.” Beberapa terjemahan memakai “raja Asyur” untuk menyelaraskannya dengan keadaan sejarah.
    reason: Menjelaskan bentuk jamak dalam teks Ibrani dan bentuk tunggal sebagai penyelarasan interpretatif, tanpa mengubah teks utama.
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan tepat mempertahankan latar naratif.
- source_word: שָׁלַח
  choice: mengirim utusan
  rationale: Secara harfiah verba ini berarti “mengirim”, tetapi objeknya tidak disebutkan. Bahasa Indonesia memerlukan objek agar kalimat ini alami; “utusan” menyatakan sarana yang tersirat tanpa mengubah maksud tindakan Ahas menjadi verba lain.
- source_word: הַמֶּלֶךְ אָחָז
  choice: Raja Ahas
  rationale: Bentuk ini alami dalam bahasa Indonesia serta mempertahankan gelar dan nama tokoh.
- source_word: עַל
  choice: kepada
  rationale: Dalam konstruksi ini preposisi tersebut menunjukkan pihak yang dituju oleh pengiriman atau permohonan, bukan tindakan melawan mereka.
- source_word: מַלְכֵי אַשּׁוּר
  choice: raja-raja Asyur
  rationale: Teks Masoret berbentuk jamak. Bentuk jamak dipertahankan meskipun bentuk tunggal lebih sesuai dengan rekonstruksi sejarah yang lazim.
- source_word: לַעְזֹר לוֹ
  choice: untuk meminta bantuan
  rationale: Infinitif menyatakan tujuan pengiriman. Ungkapan ini alami dalam bahasa Indonesia dan, dalam konteks pengutusan kepada para penguasa, menyampaikan bahwa Ahas mengharapkan bantuan bagi dirinya tanpa membebani kalimat dengan pronomina yang tidak perlu.
theological_decisions:
- issue: Apakah bentuk jamak “raja-raja Asyur” perlu diselaraskan dengan raja Asyur tunggal yang lebih diharapkan secara historis
  choice: Mempertahankan bentuk jamak Teks Masoret dalam teks utama
  alternative: raja Asyur
  rationale: Persoalan ini bukan pokok doktrin, tetapi merupakan perbedaan tekstual-terjemahan yang penting. Teks Ibrani yang tersedia berbentuk jamak, sehingga tidak diselaraskan secara diam-diam dengan perkiraan keadaan sejarah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Mengirim utusan” dipakai untuk melengkapi objek yang tersirat dalam verba Ibrani, sedangkan bentuk jamak yang agak tidak terduga tetap dipertahankan dan dijelaskan dalam catatan kaki.
