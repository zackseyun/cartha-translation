source:
  edition: WLC
  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: id
  text: Sekarang, kalian berkata bahwa kalian hendak menundukkan orang-orang Yehuda dan Yerusalem[a] menjadi budak laki-laki dan perempuan bagi diri kalian sendiri[b]. Bukankah kalian sendiri pun bersalah terhadap Yahweh, Allah kalian?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Yehuda dan Yerusalem.” Ungkapan maskulin jamak ini menunjuk kepada rakyat atau penduduk secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menaklukkan sebagai budak laki-laki dan budak perempuan bagi kalian.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibraninya padat; kurang lebih secara harfiah, “Bukankah sungguh ada pada kalian kesalahan-kesalahan terhadap Yahweh, Allah kalian?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengalihkan perhatian kepada teguran langsung pada saat itu; bahasa Indonesia tidak memerlukan kata sambung tambahan untuk mempertahankan alurnya.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: orang-orang Yehuda dan Yerusalem
  rationale: Secara harfiah berarti “anak-anak lelaki Yehuda dan Yerusalem”, tetapi dalam konteks ini menunjuk secara kolektif kepada penduduk atau rakyatnya, bukan hanya laki-laki.
- source_word: אַתֶּם אֹמְרִים
  choice: kalian berkata bahwa kalian hendak
  rationale: Pronomina jamak dan bentuk partisip menyampaikan pernyataan atau niat yang sedang mereka kemukakan. “Kalian” mempertahankan jumlah jamak yang tidak tampak dalam kata “Anda” atau “kamu”.
- source_word: לִכְבֹּשׁ
  choice: menundukkan
  rationale: Verba ini berarti menaklukkan atau membawa ke bawah kekuasaan. Konteks perbudakan memperjelas akibat tindakan itu tanpa harus meleburkan seluruh maknanya ke dalam verba “memperbudak”.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: menjadi budak laki-laki dan perempuan
  rationale: Kedua nomina membedakan orang laki-laki dan perempuan yang dipaksa masuk ke dalam status perbudakan; “budak” lebih tepat daripada “pelayan” dalam konteks tawanan perang.
- source_word: לָכֶם
  choice: bagi diri kalian sendiri
  rationale: Datif ini menunjukkan keuntungan atau penguasaan pribadi; bentuk refleksif menonjolkan bahwa mereka bermaksud memperoleh para tawanan itu untuk kepentingan mereka sendiri.
- source_word: הֲלֹא רַק ... עִמָּכֶם אֲשָׁמוֹת
  choice: Bukankah kalian sendiri pun bersalah
  rationale: Ungkapan Ibrani sangat padat, secara harfiah berbicara tentang kesalahan-kesalahan yang “ada pada” mereka. Pertanyaan retoris ini menyatakan bahwa mereka sendiri juga menanggung kesalahan, tanpa menghapus kepadatan teks dari perhatian pembaca karena alternatif harfiahnya dicatat.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: kepada Yahweh, Allah kalian
  rationale: Preposisi menyatakan arah pertanggungjawaban atau pelanggaran terhadap Allah. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Status עֲבָדִים dan שְׁפָחוֹת
  choice: budak laki-laki dan perempuan
  alternative: hamba laki-laki dan perempuan
  rationale: Konteksnya adalah penundukan paksa para tawanan perang, sehingga “budak” menyampaikan hilangnya kebebasan mereka dengan lebih jelas daripada “hamba” atau “pelayan”.
- issue: Bentuk padat pertanyaan tentang kesalahan
  choice: Bukankah kalian sendiri pun bersalah
  alternative: Bukankah pada kalian sendiri ada kesalahan-kesalahan terhadap Yahweh
  rationale: Bacaan utama menyampaikan daya retorisnya dalam bahasa Indonesia yang wajar, sedangkan catatan kaki mempertahankan bentuk harfiahnya dan mengakui bahwa nomina Ibrani berbentuk jamak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang lugas dan bermartabat. “Kalian” dipakai untuk menandai bahwa semua pronomina orang kedua dalam ayat ini berbentuk jamak. Struktur utama dibuat alami, sementara unsur harfiah dan kepadatan pertanyaan terakhir dipertahankan dalam catatan kaki.
