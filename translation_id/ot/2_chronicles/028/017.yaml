  yaml_path: translation/ot/2_chronicles/028/017.yaml
  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: id
  text: Orang-orang Edom juga datang menyerang Yehuda dan membawa pergi para tawanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “datang dan memukul Yehuda serta menawan orang-orang.” Bahasa Ibrani memakai kata kerja umum yang berarti “memukul” dalam konteks militer dan ungkapan serumpun untuk tindakan menawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: juga
  rationale: Ungkapan ini menambahkan serangan Edom sebagai peristiwa lain dalam rangkaian malapetaka yang menimpa Yehuda.
- source_word: אֲדוֹמִים
  choice: orang-orang Edom
  rationale: Bentuk jamak gentilik menunjuk kepada bangsa Edom, bukan hanya wilayahnya.
- source_word: בָּאוּ
  choice: datang
  rationale: Bentuk qatal menyatakan tindakan yang telah terjadi; dalam narasi Indonesia, bentuk lampau tidak perlu ditandai secara khusus.
- source_word: וַיַּכּוּ בִיהוּדָה
  choice: menyerang Yehuda
  rationale: Dalam konteks militer, נכה berarti memukul atau menyerang. Pilihan ini alami dan tidak menyiratkan kemenangan total yang tidak ditegaskan teks.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: membawa pergi para tawanan
  rationale: Gabungan verba שׁבה dan nomina serumpunnya menyatakan tindakan menawan dan membawa orang-orang sebagai tawanan; terjemahan ini alami sambil mempertahankan makna militernya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Penanda waktu lampau tersirat dari konteks, sesuai kelaziman bahasa Indonesia.
