base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: id
  text: Di sana ada seorang nabi TUHAN bernama Oded. Ia keluar menyongsong pasukan yang datang ke Samaria dan berkata kepada mereka, “Lihatlah, karena TUHAN, Allah nenek moyang kalian, murka kepada Yehuda, Ia menyerahkan mereka ke dalam tangan kalian. Tetapi kalian membunuh mereka dengan amarah yang mencapai langit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁם
  choice: Di sana
  rationale: Menerjemahkan penunjuk tempat secara langsung tanpa menambahkan penanda waktu yang tidak ada dalam teks sumber.
- source_word: נָבִיא לַיהוָה
  choice: seorang nabi TUHAN
  rationale: Konstruksi ini menyatakan nabi yang menjadi milik atau melayani YHWH; bentuk baku “nabi TUHAN” alami dan ringkas dalam bahasa Indonesia.
- source_word: וַיֵּצֵא לִפְנֵי הַצָּבָא
  choice: Ia pergi menemui pasukan
  rationale: Secara harfiah ia 'keluar ke hadapan' pasukan; “pergi menemui” menyampaikan gerakan menghadang atau menyongsong tanpa mempersempitnya secara berlebihan.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan seruan yang menarik perhatian pendengar pada penjelasan nabi.
- source_word: בַּחֲמַת יְהוָה
  choice: karena TUHAN ... murka
  rationale: Preposisi בְּ menyatakan dasar atau sebab penyerahan Yehuda; susunan verbal lebih alami dalam bahasa Indonesia.
- source_word: נְתָנָם בְּיֶדְכֶם
  choice: Ia menyerahkan mereka ke dalam tangan kalian
  rationale: Mempertahankan idiom Ibrani tentang penyerahan kepada kuasa pihak lain; “kalian” cocok dengan sapaan kepada kelompok pasukan.
- source_word: בְזַעַף
  choice: dengan amarah yang meluap-luap
  rationale: זַעַף menunjukkan kemarahan atau keganasan yang hebat; ungkapan ini mempertahankan intensitas teguran.
- source_word: עַד לַשָּׁמַיִם הִגִּיעַ
  choice: hingga mencapai langit
  rationale: Mempertahankan gambaran hiperbolis sumber bahwa keganasan mereka telah naik atau mencapai langit.
theological_decisions:
- issue: Hubungan antara murka TUHAN dan kekejaman pasukan Israel
  choice: Memakai “Tetapi” untuk membedakan tindakan penyerahan ilahi dari pembunuhan yang dilakukan dengan amarah berlebihan
  alternative: Menghubungkan kedua klausa hanya dengan “dan”
  rationale: Waw dalam konteks ini dapat bernilai adversatif. Teguran nabi menunjukkan bahwa kemenangan yang diizinkan TUHAN tidak membenarkan keganasan para pemenang.
- issue: Penyebutan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas untuk tetragramaton tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah setelah penyebutan Oded agar mudah dibaca. Sapaan jamak diterjemahkan “kalian” untuk membedakannya dari “mereka” yang menunjuk kepada orang Yehuda.
