  text: וְ/יֶ֤תֶר דְּבָרָי/ו֙ וְ/כָל דְּרָכָ֔י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/026.yaml
  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: id
  text: Selebihnya dari riwayat Ahas dan seluruh jalan hidupnya, dari awal sampai akhir, semuanya tertulis dalam Kitab Raja-Raja Yehuda dan Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: Selebihnya dari riwayat Ahas
  rationale: Dalam rumus penutup riwayat raja, דְּבָרָיו menunjuk pada perkara, tindakan, atau riwayat sang raja, bukan hanya perkataannya. Nama Ahas dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: וְכָל דְּרָכָיו
  choice: dan seluruh jalan hidupnya
  rationale: Ungkapan ini mempertahankan metafora דֶּרֶךְ (‘jalan’) sekaligus menyampaikan makna perilaku dan sepak terjang seseorang secara alami dalam bahasa Indonesia.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: dari awal sampai akhir
  rationale: Pasangan kata ini merupakan merisme kronologis yang mencakup seluruh masa pemerintahan; ungkapan Indonesia ini alami dan tetap mempertahankan cakupan tersebut.
- source_word: הִנָּם כְּתוּבִים
  choice: semuanya tertulis
  rationale: Sufiks jamak pada הִנָּם merujuk kepada hal-hal yang telah disebutkan dan memberi penekanan. ‘Semuanya’ menyampaikan penekanan itu dengan lebih wajar daripada ‘lihatlah, semuanya’ dalam rumus bibliografis Indonesia.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti ‘di atas’, dalam rumus rujukan tulisan bahasa Indonesia memakai ‘dalam’. סֵפֶר diterjemahkan ‘Kitab’ karena menunjuk pada sumber tertulis.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: Raja-Raja Yehuda dan Israel
  rationale: Frasa ini diperlakukan sebagai judul sumber yang dikutip oleh penulis Tawarikh, dengan susunan genitif Ibrani tetap dipertahankan.
