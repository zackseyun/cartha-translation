  text: וַ/יִּשְׁבּוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל מֵֽ/אֲחֵי/הֶ֜ם מָאתַ֣יִם אֶ֗לֶף נָשִׁים֙ בָּנִ֣ים וּ/בָנ֔וֹת וְ/גַם שָׁלָ֥ל רָ֖ב בָּזְז֣וּ מֵ/הֶ֑ם וַ/יָּבִ֥יאוּ אֶת הַ/שָּׁלָ֖ל לְ/שֹׁמְרֽוֹן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: id
  text: Orang Israel menawan dua ratus ribu perempuan, anak laki-laki, dan anak perempuan dari saudara-saudara mereka[a]. Mereka juga merampas banyak barang jarahan dari mereka dan membawa barang jarahan itu ke Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat mereka” atau “sesama orang Israel.” Teks Ibrani secara harfiah mengatakan “saudara-saudara mereka,” yang menekankan hubungan kekerabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: menawan
  rationale: Kata kerja שבה dalam konteks perang berarti membawa orang sebagai tawanan; “menawan” menyampaikan makna militer itu secara ringkas dan wajar.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan ini secara idiomatis menunjuk kepada bangsa Israel. “Orang Israel” alami dalam bahasa Indonesia modern, sementara bahasa kekerabatan pada מֵאֲחֵיהֶם tetap mempertahankan penekanan hubungan mereka.
- source_word: מֵאֲחֵיהֶם
  choice: dari antara saudara-saudara mereka
  rationale: אָח dapat berarti saudara, kerabat, atau sesama anggota bangsa. “Saudara-saudara mereka” mempertahankan gambaran kekerabatan dan bobot moral konflik internal ini; “dari antara” memperjelas bahwa para tawanan berasal dari kelompok tersebut.
- source_word: מָאתַיִם אֶלֶף
  choice: dua ratus ribu
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: perempuan, anak laki-laki, dan anak perempuan
  rationale: Mempertahankan ketiga kelompok yang disebutkan dalam teks. Dalam konteks daftar perempuan dan anak-anak, בָּנִים וּבָנוֹת paling alami dipahami sebagai anak laki-laki dan anak perempuan.
- source_word: שָׁלָל רָב
  choice: banyak jarahan
  rationale: שָׁלָל adalah barang rampasan perang. “Banyak jarahan” alami dan memungkinkan pengulangan nomina yang sama pada klausa berikutnya tetap dipertahankan.
- source_word: בָּזְזוּ
  choice: merampas
  rationale: Kata kerja בזז menunjuk pada tindakan mengambil barang sebagai rampasan perang. “Merampas” merupakan verba Indonesia yang alami dalam konteks ini.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: membawa jarahan itu ke Samaria
  rationale: Terjemahan langsung dan alami; “Samaria” adalah bentuk baku nama tempat שֹׁמְרוֹן dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa kekerabatan dalam konflik internal umat Israel
  choice: saudara-saudara mereka
  alternative: kerabat mereka; sesama orang Israel
  rationale: Pilihan ini mempertahankan metafora keluarga dalam teks Ibrani serta ketegangan etis bahwa orang Israel menawan mereka yang dipandang sebagai saudara sendiri, tanpa mempersempit maknanya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan pengulangan “jarahan” atau bahasa kekerabatan dalam sumber.
