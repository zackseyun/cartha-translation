id: 2CH.28.1
reference: 2 Chronicles 28:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: id
  text: Ahas berumur dua puluh tahun ketika menjadi raja, dan ia memerintah selama enam belas tahun di Yerusalem. Ia tidak melakukan apa yang benar di mata Yahweh seperti Daud, leluhurnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Daud, bapaknya.” Dalam konteks ini, “bapak” berarti leluhur dalam garis kerajaan, bukan ayah langsung.'
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: berumur dua puluh tahun
  rationale: Ungkapan Ibrani ini merupakan rumusan usia yang lazim; terjemahan ini menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: בְּמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Frasa ini menandai waktu naik takhta; pilihan ini alami dan tepat dalam konteks pemberitahuan masa pemerintahan.
- source_word: מָלַךְ
  choice: memerintah
  rationale: Kata kerja ini menyatakan pelaksanaan pemerintahan sebagai raja, bukan sekadar penyandang gelar.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa lokatif yang menunjukkan pusat pemerintahannya.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: tidak melakukan apa yang benar
  rationale: Mempertahankan rumusan penilaian moral yang lazim dalam Kitab Raja-Raja dan Tawarikh dengan bahasa Indonesia yang wajar.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan idiom Ibrani yang menyatakan penilaian ilahi dan nama diri ilahi yang terdapat dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: כְּדָוִיד אָבִיו
  choice: seperti Daud, leluhurnya
  rationale: אָב dapat berarti bapak atau nenek moyang. Dalam silsilah kerajaan ini Daud bukan ayah langsung Ahas, sehingga 'leluhur' menyampaikan acuan historis secara tepat tanpa mempertahankan idiom yang dapat disalahpahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi tersebut.
- issue: Makna אָבִיו bagi hubungan Ahas dengan Daud
  choice: leluhurnya
  alternative: bapaknya
  rationale: Dalam konteks dinasti, istilah 'bapak' mencakup nenek moyang. Daud adalah leluhur kerajaan Ahas, bukan ayah langsungnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan pemerintahan dibuat alami, sedangkan idiom evaluatif 'di mata Yahweh' dipertahankan. Penanda catatan kaki [a] ditempatkan setelah frasa yang dijelaskannya.
