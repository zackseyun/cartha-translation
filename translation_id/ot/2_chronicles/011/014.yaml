source:
  edition: WLC
  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: id
  text: Sebab kaum Lewi meninggalkan tanah penggembalaan mereka[a] dan tanah milik mereka, lalu pergi ke Yehuda dan Yerusalem, karena Yerobeam dan anak-anaknya telah mengucilkan mereka dari tugas sebagai imam bagi Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanah lapang mereka” atau “padang penggembalaan mereka.” Istilah Ibraninya menunjuk pada lahan terbuka yang terkait dengan kota-kota mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah melarang mereka melayani sebagai imam bagi Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: padang-padang penggembalaan mereka
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka yang terkait dengan kota-kota orang Lewi dan lazimnya digunakan untuk menggembalakan ternak. Pilihan ini konkret dan mudah dipahami, sementara cakupan istilah Ibrani dijelaskan dalam catatan kaki.
- source_word: אֲחֻזָּתָם
  choice: tanah milik mereka
  rationale: אֲחֻזָּה di sini menunjuk pada milik atau pegangan berupa tanah. 'Tanah milik' lebih tepat daripada 'harta benda' yang terlalu luas dan tidak memaksakan nuansa 'warisan' yang tidak dinyatakan secara khusus.
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: lalu pergi ke Yehuda dan Yerusalem
  rationale: הלך dengan ל menyatakan gerak menuju tempat tujuan. 'Pergi ke' mengikuti sudut pandang narasi dan terdengar alami dalam bahasa Indonesia.
- source_word: הִזְנִיחָם
  choice: telah menyingkirkan mereka
  rationale: Bentuk hifil dari זנח membawa gagasan menolak, membuang, atau mengucilkan. 'Menyingkirkan' mempertahankan unsur penolakan sekaligus cocok dengan akibat institusional yang dinyatakan oleh frasa berikutnya.
- source_word: מִכַּהֵן
  choice: dari pelayanan sebagai imam
  rationale: מִן dengan infinitif כהן menyatakan pencegahan atau pengucilan dari pelaksanaan tugas imam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi keimaman yang dimaksud.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'. Dalam hubungan dengan pelayanan imam, 'bagi Yahweh' merupakan bentuk Indonesia yang alami untuk לַיהוָה.
- source_word: כִּי ... כִּי
  choice: Sebab ... karena
  rationale: כִּי pertama memberi alasan bagi pernyataan sebelumnya, sedangkan כִּי kedua menerangkan alasan perpindahan kaum Lewi. Pembedaan 'sebab' dan 'karena' memperjelas hubungan wacana tanpa mengubah makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Sifat tindakan Yerobeam terhadap kaum Lewi
  choice: menyingkirkan mereka dari pelayanan sebagai imam
  alternative: melarang mereka melayani sebagai imam
  rationale: Teks dapat menonjolkan penolakan terhadap orang-orang Lewi maupun akibatnya, yaitu pengucilan mereka dari pelayanan keimaman. Teks utama mempertahankan daya penolakan dari זנח, sedangkan catatan memberikan ungkapan yang menonjolkan pencegahan dari tugas imam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kaum Lewi' dipakai sebagai sebutan kolektif yang alami; struktur sebab-akibat dipertahankan, dan ambiguitas antara penolakan pribadi serta pengucilan dari fungsi keimaman tidak dihapus.
