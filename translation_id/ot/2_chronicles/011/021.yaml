source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: id
  text: Rehabeam lebih mengasihi Maakha, anak perempuan Absalom,[a] daripada semua istri dan gundiknya, sebab ia telah mengambil delapan belas istri dan enam puluh gundik, serta memperanakkan dua puluh delapan anak laki-laki dan enam puluh anak perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “keturunan Absalom”; dalam konteks silsilah, kata Ibrani untuk “anak perempuan” kadang-kadang dapat digunakan dengan arti yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: lebih mengasihi
  rationale: Kata kerja אהב menyatakan kasih atau rasa sayang; unsur perbandingan dinyatakan oleh frasa מִכָּל dan secara alami digabungkan menjadi 'lebih mengasihi' dalam bahasa Indonesia.
- source_word: בַת אַבְשָׁלוֹם
  choice: anak perempuan Absalom
  rationale: בַּת pada makna dasarnya berarti 'anak perempuan'. Kemungkinan pemakaian genealogis yang lebih luas dipertahankan dalam catatan kaki.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: daripada semua istri dan gundiknya
  rationale: מִכָּל menandai perbandingan, sedangkan נָשִׁים dan פִּילַגְשִׁים tetap dibedakan sebagai 'istri' dan 'gundik'.
- source_word: כִּי
  choice: Ia telah
  rationale: כִּי memperkenalkan keterangan penjelas. Dalam bahasa Indonesia, hubungan penjelas ini dapat disampaikan secara alami melalui kalimat berikut tanpa konjungsi eksplisit, sehingga tidak memberi kesan bahwa jumlah istri menjadi alasan kasihnya.
- source_word: נָשִׁים ... נָשָׂא
  choice: telah mengambil delapan belas istri
  rationale: נשא dengan נָשִׁים adalah ungkapan untuk mengambil perempuan sebagai istri. 'Mengambil ... istri' mempertahankan citra sumber dan tetap dapat dipahami dalam ragam Alkitab modern.
- source_word: פִּילַגְשִׁים
  choice: gundik
  rationale: Istilah ini mempertahankan pembedaan sosial dalam teks antara istri dan perempuan berstatus sekunder.
- source_word: וַיּוֹלֶד
  choice: menjadi ayah dari
  rationale: Bentuk ini menyatakan bahwa Rehabeam memperanakkan mereka; 'menjadi ayah dari' alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: dua puluh delapan anak laki-laki
  rationale: Terjemahan langsung dan jelas untuk bilangan serta בָּנִים dalam konteks keturunan.
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: enam puluh anak perempuan
  rationale: Terjemahan langsung dan jelas untuk frasa bilangan dan בָּנוֹת.
theological_decisions:
- issue: Sebutan genealogis Maakha sebagai 'anak perempuan Absalom'
  choice: Mempertahankan ungkapan harfiah Ibrani 'anak perempuan Absalom' dalam teks utama
  alternative: Memahaminya sebagai keturunan yang lebih jauh, misalnya 'cucu perempuan Absalom'
  rationale: Teks Ibrani secara langsung memakai בַּת, 'anak perempuan', tetapi istilah kekerabatan dapat digunakan lebih luas dalam konteks silsilah. Terjemahan utama tidak menyelesaikan ketegangan ini secara diam-diam; kemungkinan yang lebih luas dicatat di kaki halaman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim, 'Rehabeam' dan 'Maakha'. Istilah 'gundik' dipertahankan untuk membedakan kategori sosialnya dari 'istri'. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
