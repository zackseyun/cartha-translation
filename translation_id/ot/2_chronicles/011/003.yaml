id: 2CH.11.3
reference: 2 Chronicles 11:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: id
  text: '“Katakanlah kepada Rehabeam anak Salomo, raja Yehuda, dan kepada seluruh Israel yang berada di Yehuda dan Benyamin:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: Katakanlah
  rationale: Bentuk imperatif dari אמר memerintahkan penyampaian pesan ilahi; ‘Katakanlah’ alami dalam bahasa Indonesia dan mempertahankan daya perintah langsung.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi sasaran perkataan.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן שְׁלֹמֹה
  choice: anak Salomo
  rationale: Rangkaian konstruksi ini menunjukkan hubungan keturunan; ‘anak Salomo’ merupakan ungkapan Indonesia yang wajar.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar kerajaan dalam hubungan konstruksi dengan Yehuda, diletakkan sebagai aposisi bagi Rehabeam.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: dan kepada seluruh Israel
  rationale: Mempertahankan sebutan nasional-perjanjian ‘Israel’, bukan mengubahnya menjadi ‘orang Israel’.
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: yang berada di Yehuda dan Benyamin
  rationale: Preposisi ב menyatakan lokasi. Penambahan relatif ‘yang berada’ membuat hubungan sintaksisnya jelas dan alami tanpa mengubah makna.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif ini memperkenalkan isi pesan pada ayat berikutnya. Dalam bahasa Indonesia modern, tanda titik dua secara alami menjalankan fungsi pengantar kutipan tersebut dan menghindari bentuk kaku ‘dengan mengatakan’.
theological_decisions: []
