  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dipertahankan sebagai pengantar langsung kepada firman pada ayat berikutnya; tanda petik pembuka dan titik dua menandai bahwa kutipan berlanjut.
