  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמַֽעְיָ֥הוּ אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/002.yaml
  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: id
  text: 'Lalu firman Yahweh datang kepada Semaya, abdi Allah itu, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu ... datang
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. Dalam bahasa Indonesia, “lalu” menyampaikan peralihan tersebut secara alami tanpa ungkapan kaku “dan terjadilah” dan tanpa menambahkan pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: Ungkapan baku kenabian ini mempertahankan hubungan konstruksi Ibrani dan memakai “firman” sebagai padanan Indonesia yang lazim bagi pesan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai Semaya sebagai penerima firman.
- source_word: שְׁמַעְיָהוּ
  choice: Semaya
  rationale: Nama pribadi disesuaikan dengan bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  rationale: Ungkapan ini merupakan sebutan bagi tokoh kenabian. “Abdi Allah” alami dalam bahasa Indonesia, sedangkan “itu” mencerminkan kehadiran artikel dan mengidentifikasi Semaya dalam perannya.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Bentuk ini memperkenalkan ucapan langsung secara alami dalam bahasa Indonesia; titik dua sesuai karena perkataan yang disampaikan mengikuti pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Makna אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  alternative: orang kepunyaan Allah itu; hamba Allah itu
  rationale: Ungkapan ini dipertahankan sebagai gelar atau sebutan kenabian tanpa mempersempitnya menjadi jabatan tertentu yang tidak disebutkan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan formula kenabian, nama ilahi, serta identifikasi Semaya sebagai abdi Allah.
