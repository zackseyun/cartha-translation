base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: id
  text: Para imam dan orang Lewi yang berada di seluruh Israel berpihak kepadanya dari seluruh wilayah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menempatkan diri di hadapannya” atau “berdiri di hadapannya.” Ungkapan Ibrani ini dapat menunjuk pada kehadiran di hadapan Rehabeam atau pada tindakan memihak kepadanya; konteks mendukung pengertian yang terakhir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: Para imam dan orang Lewi
  rationale: Kedua nomina jamak definit ini menunjuk pada dua kelompok. Dalam bahasa Indonesia, “para imam” dan “orang Lewi” merupakan sebutan yang baku dan alami; konjungsi pembuka tidak perlu diterjemahkan secara mekanis karena ayat dapat berdiri alami dalam alur narasi.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: yang berada di seluruh Israel
  rationale: Klausa relatif ini menyatakan bahwa mereka tersebar di seluruh Israel, bukan hanya berada di Yehuda.
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: berpihak kepadanya
  rationale: Bentuk Hitpael dari יצב dengan עַל secara harfiah dapat menggambarkan menempatkan diri atau berdiri di hadapan seseorang. Dalam konteks ini, tindakan tersebut menyatakan dukungan kepada Rehabeam; “berpihak kepadanya” menyampaikan maksud kontekstual tanpa menghilangkan alternatif idiomatis, yang dicatat dalam catatan kaki.
- source_word: מִכָּל גְּבוּלָם
  choice: dari seluruh wilayah mereka
  rationale: גְּבוּל dapat berarti batas atau daerah yang dibatasi. Di sini bentuk jamak bersufiks menunjuk pada berbagai wilayah tempat mereka tinggal, sehingga “wilayah” lebih alami daripada “perbatasan”.
theological_decisions:
- issue: Apakah הִתְיַצְּבוּ עָלָיו hanya menyatakan kehadiran fisik atau juga kesetiaan kepada Rehabeam
  choice: berpihak kepadanya
  alternative: menghadap dia; berdiri di hadapannya
  rationale: Konteks perpindahan para imam dan orang Lewi ke Yehuda mendukung pengertian kesetiaan atau dukungan. Namun, karena idiom Ibrani juga dapat menunjuk pada tampil atau berdiri di hadapan seseorang, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Berpihak kepadanya” dipilih sebagai ungkapan alami bagi tindakan menyatakan dukungan, sedangkan ambiguitas idiom Ibrani dijaga melalui catatan kaki.
