  text: וְ/אֶת צָרְעָה֙ וְ/אֶת אַיָּל֔וֹן וְ/אֶת חֶבְר֔וֹן אֲשֶׁ֥ר בִּ/יהוּדָ֖ה וּ/בְ/בִנְיָמִ֑ן עָרֵ֖י מְצֻרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/010.yaml
  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: id
  text: serta Zora, Ayalon, dan Hebron di wilayah Yehuda dan Benyamin—kota-kota berbenteng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: Zora
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Nama tempat ditransliterasikan sebagai “Ayalon,” bentuk yang dekat dengan pelafalan Ibrani dan lazim dalam bahasa Indonesia.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nama tempat dipertahankan dalam bentuk konvensional bahasa Indonesia.
- source_word: אֲשֶׁר בִּיהוּדָה וּבְבִנְיָמִן
  choice: di wilayah Yehuda dan Benyamin
  rationale: Ungkapan ini menyatakan lokasi geografis kelompok kota tersebut. “Di wilayah” membuat relasinya jelas dan alami tanpa mengubahnya menjadi pernyataan kepemilikan.
- source_word: עָרֵי מְצֻרוֹת
  choice: kota-kota berbenteng
  rationale: Frasa ini menunjuk pada kota-kota yang diperkuat dengan benteng; pilihan ini jelas, alami, dan mempertahankan bentuk jamak Ibrani.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: serta ... , ... , dan ...
  rationale: Rangkaian ini melanjutkan daftar dari ayat sebelumnya. Bahasa Indonesia secara alami memakai “serta” untuk penghubung awal dan “dan” sebelum unsur terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda pisah menandai “kota-kota berbenteng” sebagai keterangan penutup bagi daftar kota, tanpa menambahkan kopula yang tidak dinyatakan dalam teks Ibrani.
