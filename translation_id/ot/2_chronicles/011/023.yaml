base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: id
  text: Ia bertindak bijaksana[a] dan menempatkan sebagian dari semua anaknya[b] di seluruh wilayah Yehuda dan Benyamin, di semua kota berbenteng. Ia memberi mereka perbekalan yang berlimpah dan mencarikan banyak istri bagi mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menunjukkan pengertian" atau "bertindak dengan penuh pertimbangan."
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani kemungkinan berarti bahwa ia menyebarkan atau menempatkan sebagian dari seluruh anaknya di berbagai kota berbenteng, bukan bahwa setiap anak dikirim ke setiap tempat.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, ia mengatur pernikahan bagi anak-anaknya. Secara harfiah, teks Ibrani berbunyi, "ia mencari sejumlah besar istri." Kata-kata "bagi mereka" tersirat dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: Ia bertindak bijaksana
  rationale: Bentuk dari בין di sini menyatakan bahwa Rehabeam menunjukkan pengertian atau bertindak dengan pertimbangan yang baik dalam pengaturan pemerintahannya. Ungkapan ini alami dalam bahasa Indonesia tanpa membatasi maknanya pada pengetahuan batin.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: menyebarkan sebagian anaknya
  rationale: פרץ dalam konteks tujuan-tujuan geografis dapat berarti menyebarkan atau menempatkan secara terpencar. Frasa מן + כל dipahami secara partitif, sehingga 'sebagian anaknya' tidak menyiratkan bahwa setiap anak dikirim ke setiap tempat.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: ke seluruh wilayah Yehuda dan Benyamin
  rationale: Bentuk jamak אֲרָצוֹת menunjuk pada daerah-daerah teritorial. 'Wilayah' lebih alami daripada 'tanah-tanah' dalam konteks administratif ini.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: ke semua kota berbenteng
  rationale: מְצֻרוֹת menggambarkan kota-kota yang diperkuat untuk pertahanan; 'kota berbenteng' merupakan padanan Indonesia yang langsung dan lazim.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: Ia memberi mereka perbekalan yang berlimpah
  rationale: מָזוֹן dapat berarti makanan, nafkah, atau persediaan. 'Perbekalan' sesuai dengan konteks penempatan administratif, sedangkan לָרֹב menyatakan kelimpahan.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: mencarikan banyak istri bagi mereka
  rationale: שׁאל berarti meminta atau mencari. Dalam konteks ini ungkapan tersebut kemungkinan menunjuk pada upaya Rehabeam mengusahakan atau mengatur banyak istri bagi anak-anaknya. 'Bagi mereka' dijelaskan oleh objek jamak pada klausa sebelumnya, tetapi tidak dinyatakan secara eksplisit dalam klausa Ibrani ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Wilayah' dipilih untuk konteks teritorial, 'kota berbenteng' mempertahankan gambaran konkret teks, dan catatan kaki mempertahankan ambiguitas leksikal serta unsur yang tersirat dari konteks.
