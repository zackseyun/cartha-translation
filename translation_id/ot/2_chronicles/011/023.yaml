  source_fidelity: 'Terjemahan ini pada umumnya mengikuti Ibrani dengan baik: וַיָּבֶן ditangkap sebagai tindakan yang bijaksana, kota-kota dipahami sebagai kota berbenteng, dan pemberian perbekalan serta pencarian istri bagi para putra dipertahankan. Namun, מִכָּל־בָּנָיו secara lebih jelas menyatakan bagian dari keseluruhan putranya. Frasa "sebagian anaknya" dapat dipahami hanya sebagai beberapa anak tanpa menyatakan cakupan "dari semua putranya."'
