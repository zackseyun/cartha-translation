lexical_decisions:
- source_word: וְאֶת
  choice: tidak diterjemahkan tersendiri; diwakili oleh susunan daftar dan kata “dan”
  rationale: Partikel אֵת menandai objek langsung tertentu, sedangkan וְ menghubungkan unsur-unsur dalam rangkaian. Bahasa Indonesia tidak memiliki penanda objek langsung yang sepadan, sehingga fungsinya dinyatakan secara alami melalui susunan daftar dan konjungsi.
- source_word: גַּת
  choice: Gat
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מָרֵשָׁה
  choice: Maresya
  rationale: Nama kota di Yehuda ini ditransliterasikan ke dalam ejaan Indonesia; שׁ diwakili dengan “sy” agar mendekati pelafalan Ibrani.
- source_word: זִיף
  choice: Zif
  rationale: Nama tempat ini ditransliterasikan secara langsung dan disesuaikan dengan ejaan Indonesia.
