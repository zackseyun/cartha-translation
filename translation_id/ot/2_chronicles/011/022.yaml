source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: id
  text: Rehabeam mengangkat Abia anak Maakha menjadi pemimpin utama di antara saudara-saudaranya[a], sebab ia bermaksud menjadikannya raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “atas saudara-saudaranya”; preposisi Ibrani yang dipakai dapat menunjukkan kedudukannya yang lebih tinggi dalam hubungan dengan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: mengangkat
  rationale: Bentuk Hifil dari עמד di sini berarti menempatkan seseorang dalam suatu kedudukan atau jabatan. “Mengangkat” merupakan ungkapan Indonesia yang alami untuk tindakan menetapkan seseorang pada posisi kepemimpinan.
- source_word: לָרֹאשׁ ... לְנָגִיד
  choice: menjadi pemimpin utama
  rationale: רֹאשׁ menyatakan kedudukan terdepan atau tertinggi, sedangkan נָגִיד menunjuk seorang pemimpin atau penguasa yang ditetapkan. Gabungan “pemimpin utama” menyampaikan kedua unsur tersebut tanpa pengulangan yang kaku.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: Abia anak Maakha
  rationale: Nama-nama disesuaikan dengan bentuk Indonesia yang lazim, dan konstruksi בֶן diterjemahkan langsung sebagai “anak”.
- source_word: בְּאֶחָיו
  choice: di antara saudara-saudaranya
  rationale: Preposisi ב dapat menggambarkan kedudukan Abia dalam kelompok saudara-saudaranya. Terjemahan ini mempertahankan konteks kelompok keluarga tanpa memastikan secara berlebihan bahwa preposisi tersebut berarti kekuasaan langsung atas mereka.
- source_word: כִּי לְהַמְלִיכוֹ
  choice: sebab ia bermaksud menjadikannya raja
  rationale: כִּי memperkenalkan alasan, sedangkan infinitif berprefiks ל menyatakan tujuan. Karena klausa Ibrani bersifat eliptis, “ia bermaksud” membuat maksud tindakan Rehabeam jelas dan alami dalam bahasa Indonesia tanpa mengubah isinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pemimpin utama” dipilih untuk mewakili dua sebutan Ibrani, רֹאשׁ dan נָגִיד, secara ringkas dan alami; penanda catatan kaki [a] ditempatkan tepat setelah frasa yang memiliki alternatif terjemahan.
