  text: וַ/יִּֽקַּֽח ל֤/וֹ רְחַבְעָם֙ אִשָּׁ֔ה אֶת מָ֣חֲלַ֔ת בן יְרִימ֖וֹת בֶּן דָּוִ֑יד אֲבִיהַ֕יִל בַּת אֱלִיאָ֖ב בֶּן יִשָֽׁי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: id
  text: Rehabeam memperistri Mahalat, anak perempuan Yerimot, anak Daud, dan Abihail, anak perempuan Eliab, anak Isai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Susunan silsilah dalam teks Ibrani sangat padat dan tidak mudah dipastikan. Secara harfiah urutannya kira-kira berbunyi, “Mahalat, anak laki-laki Yerimot, anak Daud, Abihail, anak perempuan Eliab, anak Isai.” Kemungkinan besar maksudnya ialah bahwa Mahalat berasal dari kedua garis keluarga itu. Ada pula yang memahami Abihail sebagai nama lain dalam keterangan keluarga atau, meskipun kurang mungkin, sebagai istri kedua.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: memperistri
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘mengambil bagi dirinya seorang perempuan/istri’. ‘Memperistri’ menyampaikan tindakan perkawinan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: מָחֲלַת
  choice: Mahalat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: anak perempuan Yerimot bin Daud
  rationale: Teks memakai בֶּן sebelum Yerimot, tetapi Mahalat adalah perempuan dan susunan silsilah menunjukkan bahwa ia diperkenalkan sebagai anak Yerimot. ‘Bin Daud’ mempertahankan hubungan Yerimot dengan Daud secara ringkas dan alami.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: dan Abihail, anak perempuan Eliab bin Isai
  rationale: Abihail paling mungkin merupakan ibu Mahalat dan garis keturunan kedua yang melengkapi keterangan tentang Mahalat. Tanda koma membantu pembaca memahami hubungan ini tanpa menghapus ketidakpastian teks, yang dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Hubungan sintaksis nama-nama dalam silsilah
  choice: Mahalat dipahami sebagai anak perempuan Yerimot dan Abihail; Yerimot berasal dari garis Daud, sedangkan Abihail adalah anak perempuan Eliab bin Isai.
  alternative: Abihail dapat dipahami sebagai nama kedua dalam keterangan keluarga atau, meski kurang mungkin, sebagai istri kedua Rehabeam.
  rationale: Ayat memperkenalkan ‘seorang istri’ dalam bentuk tunggal dan menandai Mahalat sebagai objek langsung. Karena tidak ada kata penghubung sebelum Abihail, nama itu paling wajar dibaca sebagai bagian dari keterangan asal-usul Mahalat. Namun, susunan Ibraninya sangat padat sehingga alternatif tetap dicatat.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Nama-nama memakai bentuk Indonesia yang lazim: Rehabeam, Mahalat, Yerimot, Daud, Abihail, Eliab, dan Isai. Istilah ‘memperistri’ dipilih untuk idiom perkawinan, sedangkan ‘bin’ dipakai dalam rangkaian silsilah laki-laki agar ringkas dan mudah dibaca.'
