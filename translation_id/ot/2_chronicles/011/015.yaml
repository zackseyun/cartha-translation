  text: וַ/יַּֽעֲמֶד ל/וֹ֙ כֹּֽהֲנִ֔ים לַ/בָּמ֖וֹת וְ/לַ/שְּׂעִירִ֑ים וְ/לָ/עֲגָלִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: id
  text: Ia mengangkat bagi dirinya sendiri imam-imam untuk tempat-tempat pemujaan di tempat-tempat tinggi, untuk makhluk-makhluk mirip kambing[a], dan untuk anak-anak lembu yang telah dibuatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh-roh jahat berbentuk kambing,” “satir,” atau “kambing-kambing jantan.” Istilah Ibrani ini dapat menunjuk pada makhluk menyerupai kambing yang dikaitkan dengan pemujaan terlarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: mengangkat
  rationale: Dalam konteks penetapan imam, bentuk verba ini menyatakan tindakan mengangkat atau menetapkan seseorang dalam jabatan, bukan sekadar menyuruh berdiri.
- source_word: לּוֹ
  choice: bagi dirinya sendiri
  rationale: Datif ini menunjukkan bahwa Yerobeam bertindak demi kepentingannya sendiri; bentuk refleksif mempertahankan penekanan tersebut.
- source_word: כֹּהֲנִים
  choice: imam-imam
  rationale: Padanan baku dan alami bagi jabatan keagamaan dalam konteks ini.
- source_word: לַבָּמוֹת
  choice: untuk bukit-bukit pengurbanan
  rationale: Istilah ini menunjuk pada tempat-tempat pemujaan yang lazimnya berada di tempat tinggi. Padanan ini lebih informatif bagi pembaca Indonesia modern daripada terjemahan harfiah 'tempat-tempat tinggi'.
- source_word: לַשְּׂעִירִים
  choice: untuk roh-roh jahat berbentuk kambing
  rationale: Dalam konteks pemujaan terlarang, istilah ini kemungkinan menunjuk pada makhluk atau objek pemujaan menyerupai kambing, bukan kambing biasa. Terjemahan ini menyampaikan makna kultis yang paling mungkin sambil mempertahankan citra kambing.
- source_word: וְלָעֲגָלִים
  choice: dan untuk anak-anak lembu
  rationale: Kata Ibrani secara langsung berarti anak-anak lembu. Walaupun konteks menunjukkan bahwa yang dimaksud ialah patung pemujaan, bentuk nomina yang sederhana dipertahankan agar tidak menambahkan penjelasan ke dalam teks utama.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dibuatnya
  rationale: Bentuk ini secara alami menunjukkan bahwa pembuatan objek-objek pemujaan itu mendahului pengangkatan para imam.
theological_decisions:
- issue: Makna שְׂעִירִים dalam konteks ibadah berhala
  choice: roh-roh jahat berbentuk kambing
  alternative: kambing-kambing jantan; makhluk-makhluk seperti kambing
  rationale: Daftar ini menyebut tempat dan objek pemujaan tidak sah yang didirikan Yerobeam. Karena itu, rujukan kepada makhluk atau objek kultis menyerupai kambing lebih mungkin daripada hewan biasa. Catatan kaki mempertahankan alternatif leksikal tanpa menghilangkan daya teologis konteksnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat tetap dekat dengan struktur Ibrani, tetapi memakai ungkapan yang alami. Istilah 'bukit-bukit pengurbanan' dipakai agar fungsi kultis בָּמוֹת segera dipahami; ambiguitas שְׂעִירִים dijaga melalui catatan kaki.
