  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: id
  text: Sesudah mereka, orang-orang dari semua suku Israel yang menetapkan hati mereka[a] untuk mencari Yahweh, Allah Israel, datang[b] ke Yerusalem untuk mempersembahkan kurban kepada Yahweh, Allah bapak-bapak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memberikan hati mereka”; ungkapan ini berarti mengarahkan atau mengabdikan hati untuk mencari Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pergi”. Kata kerja Ibrani yang sama dapat diterjemahkan “datang” atau “pergi”, bergantung pada sudut pandang narasi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: Sesudah mereka
  rationale: Mempertahankan hubungan urutan dengan ayat sebelumnya; kata ganti 'mereka' merujuk pada kelompok yang disebut sebelumnya.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari semua suku Israel
  rationale: Preposisi מִן menyatakan asal, sedangkan כֹּל mempertahankan cakupan menyeluruh.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: yang menetapkan hati mereka
  rationale: Ungkapan ini mempertahankan citra 'hati' sekaligus menyampaikan pengarahan atau pengabdian kehendak secara sengaja.
- source_word: לְבַקֵּשׁ
  choice: untuk mencari
  rationale: Dalam konteks keagamaan, בּקש menyatakan upaya sungguh-sungguh untuk berpaling kepada dan mencari Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan tidak menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan konstruksi yang alami dalam bahasa Indonesia dan secara khusus mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: datang ke Yerusalem
  rationale: בוא dapat berarti 'datang' atau 'pergi' menurut sudut pandang narasi; 'datang' sesuai dengan fokus narasi pada Yerusalem.
- source_word: לִזְבּוֹחַ
  choice: untuk mempersembahkan kurban
  rationale: Infinitif menyatakan tujuan, dan ungkapan ini menyampaikan tindakan ritual pengurbanan dengan jelas dalam bahasa Indonesia modern.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: '''Nenek moyang'' adalah padanan Indonesia yang alami bagi bentuk jamak אָבוֹת dalam rumusan perjanjian ini dan mencakup para leluhur yang dimaksud tanpa mengubah rujukannya.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Rumusan perjanjian אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  alternative: Allah bapak-bapak mereka
  rationale: Bahasa Indonesia lazim memakai 'nenek moyang' untuk leluhur. Pilihan ini menyampaikan rumusan Ibrani secara alami tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dijaga dekat dengan bahasa Ibrani, sementara ungkapan ritual dan idiom hati dibuat jelas bagi pembaca umum.
