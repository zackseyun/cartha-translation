  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “kota-kota untuk pertahanan” mempertahankan bentuk tujuan dalam teks Ibrani, sedangkan catatan kaki mencantumkan padanan yang lebih idiomatis.
