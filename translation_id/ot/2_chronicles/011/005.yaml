  text: וַ/יֵּ֥שֶׁב רְחַבְעָ֖ם בִּ/ירוּשָׁלִָ֑ם וַ/יִּ֧בֶן עָרִ֛ים לְ/מָצ֖וֹר בִּ/יהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: id
  text: Rehabeam tinggal di Yerusalem, lalu ia membangun kota-kota untuk pertahanan[a] di Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kota-kota benteng” atau “kota-kota sebagai kubu pertahanan.” Secara harfiah, bahasa Ibrani berbunyi “kota-kota untuk pertahanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja יָשַׁב dalam konteks ini menyatakan bahwa Rehabeam berdiam atau menetap di Yerusalem. “Tinggal” alami dalam bahasa Indonesia modern dan tidak menyiratkan perpindahan yang tidak dinyatakan teks.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa preposisional lokatif yang langsung; nama tempat mengikuti bentuk baku bahasa Indonesia.
- source_word: וַיִּבֶן
  choice: lalu ia membangun
  rationale: Kata בנה berarti “membangun”, bukan secara khusus “memperkuat”. “Lalu” menyampaikan kelanjutan naratif dari bentuk wayyiqtol tanpa membebani hubungan antarklausa.
- source_word: עָרִים
  choice: kota-kota
  rationale: Bentuk jamak עִיר secara wajar diterjemahkan “kota-kota” dan sesuai dengan konteks geografis serta administratif kitab Tawarikh.
- source_word: לְמָצוֹר
  choice: untuk pertahanan
  rationale: Frasa ini menyatakan tujuan atau fungsi defensif kota-kota tersebut. Pilihan ini mempertahankan konstruksi tujuan dalam bahasa Ibrani dan tidak mengubah kata kerja “membangun” menjadi “memperkuat”.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Frasa lokatif sederhana yang menunjukkan wilayah tempat kota-kota itu dibangun.
theological_decisions: []
