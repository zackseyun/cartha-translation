  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: id
  text: Maka mereka memperkokoh kerajaan Yehuda dan menguatkan Rehabeam, anak Salomo, selama tiga tahun, sebab selama tiga tahun mereka mengikuti jalan Daud dan Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan di jalan Daud dan Salomo”; maksudnya mengikuti pola hidup mereka.
    reason: Menjelaskan idiom Ibrani sambil mempertahankan metafora dan batas maknanya.
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: mereka memperkokoh
  rationale: Bentuk piel dari חזק menyatakan tindakan membuat kukuh atau kuat. “Memperkokoh” wajar untuk kerajaan dan tidak membatasi maknanya pada pertahanan militer.
- source_word: מַלְכוּת יְהוּדָה
  choice: kerajaan Yehuda
  rationale: מַלְכוּת dapat berarti kekuasaan kerajaan atau kerajaan sebagai entitas politik; konteks ini mendukung “kerajaan Yehuda” tanpa meniadakan nuansa pemerintahan.
- source_word: וַיְאַמְּצוּ
  choice: menguatkan
  rationale: Bentuk piel dari אמץ berarti membuat kuat, menguatkan, atau memberi keteguhan. Objeknya adalah Rehabeam, sehingga “menguatkan” paling tepat dan tetap membedakannya secara wajar dari “memperkokoh” pada klausa sebelumnya.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Rehabeam, anak Salomo
  rationale: Nama-nama ditransliterasikan menurut bentuk Indonesia yang lazim, dan hubungan anak dengan ayah dipertahankan secara langsung.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: selama tiga tahun
  rationale: Ungkapan durasi dengan ל secara alami diterjemahkan “selama”. Pengulangannya dalam teks Ibrani dipertahankan untuk menjaga penekanan dan hubungan antara masa penguatan dan masa kesetiaan.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi penguatan yang disebutkan sebelumnya; “sebab” menyatakan hubungan kausal itu dengan jelas.
- source_word: הָלְכוּ בְּדֶרֶךְ
  choice: mereka mengikuti jalan
  rationale: Secara harfiah berarti “mereka berjalan di jalan”, sebuah idiom mengenai pola hidup atau perilaku. “Mengikuti jalan” mempertahankan metafora jalan sambil terdengar alami dalam bahasa Indonesia.
- source_word: דָּוִיד וּשְׁלֹמֹה
  choice: Daud dan Salomo
  rationale: Kedua nama dipertahankan bersama sebagai teladan pola hidup yang dimaksud teks, tanpa memperluas penilaian itu menjadi pernyataan tentang seluruh kehidupan mereka.
theological_decisions:
- issue: Penilaian terhadap “jalan Daud dan Salomo”
  choice: Mempertahankan ungkapan “mengikuti jalan Daud dan Salomo” tanpa menjabarkannya sebagai kesetiaan menyeluruh kepada TUHAN.
  alternative: “Mereka hidup setia kepada TUHAN seperti Daud dan Salomo.”
  rationale: Ayat ini memberi penilaian positif yang dibatasi pada masa tiga tahun, tetapi tidak menyatakan bahwa seluruh kehidupan Daud dan Salomo menjadi teladan tanpa pengecualian. Terjemahan tidak boleh memperluas penilaian teologis melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Maka” mempertahankan kesinambungan naratif; “memperkokoh” dan “menguatkan” mencerminkan dua verba Ibrani yang berdekatan maknanya tanpa menghasilkan pengulangan yang kaku. Frasa durasi diulang sebagaimana dalam teks sumber.
