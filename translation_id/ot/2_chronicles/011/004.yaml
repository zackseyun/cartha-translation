  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ עִם אֲחֵי/כֶ֗ם שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵֽ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּשְׁמְעוּ֙ אֶת דִּבְרֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֖בוּ מִ/לֶּ֥כֶת אֶל יָרָבְעָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: id
  text: 'Beginilah firman Yahweh: “Janganlah maju dan jangan berperang melawan saudara-saudaramu.[a] Pulanglah, masing-masing ke rumahnya, sebab hal ini berasal dari-Ku.[b]” Maka mereka mendengarkan firman Yahweh, lalu berbalik dan tidak meneruskan perjalanan menuju Yerobeam.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah sesama orang Israel, meskipun pada saat itu mereka berada di pihak yang berlawanan.
    reason: cultural_note
  - marker: b
    text: Atau “sebab perkara ini dari-Ku.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “berbalik dari pergi kepada Yerobeam”; dalam konteks ini perjalanan tersebut berkaitan dengan persiapan untuk berperang melawannya.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan rumusan pembawa pesan kenabian dalam bentuk yang baku, alami, dan khidmat dalam bahasa Indonesia.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Janganlah maju dan jangan berperang
  rationale: עלה secara harfiah berarti ‘naik’, tetapi dalam konteks pengerahan pasukan menunjuk pada gerak maju. ‘Maju’ menyampaikan makna militer secara wajar tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: עִם אֲחֵיכֶם
  choice: melawan saudara-saudaramu
  rationale: Dalam konteks perang, עִם bermakna pihak yang dihadapi. ‘Saudara-saudaramu’ mempertahankan gambaran kekeluargaan yang menegaskan bahwa lawan mereka juga sesama orang Israel.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Pulanglah, masing-masing ke rumahnya
  rationale: שׁוב menyatakan kembali atau berbalik, sedangkan אִישׁ dipakai secara distributif. Susunan ini alami dalam bahasa Indonesia dan tetap mencerminkan perintah kepada setiap orang.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: sebab hal ini berasal dari-Ku
  rationale: Ungkapan ini mempertahankan pernyataan bahwa perkara tersebut bersumber dari Allah, tanpa mempersempitnya menjadi sekadar izin atau mengembangkannya menjadi penjelasan doktrinal tentang cara kerja penyelenggaraan ilahi.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: Maka mereka mendengarkan firman Yahweh
  rationale: שׁמע dapat berarti mendengar maupun menaati. ‘Mendengarkan’ mempertahankan kedua nuansa itu, sementara tindakan berikutnya menunjukkan ketaatan mereka.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: dan berbalik, tidak jadi maju melawan Yerobeam
  rationale: Secara bentuk, frasa ini berarti mereka berbalik dari pergi menuju Yerobeam. Konteksnya adalah gerakan militer, sehingga ‘melawan’ menjelaskan hubungan permusuhan, sedangkan ‘tidak jadi maju’ menyatakan bahwa gerakan tersebut dihentikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Menggunakan nama diri ilahi yang ditunjukkan oleh Tetragramaton dan mengikuti bentuk baku proyek tanpa menggantinya dengan gelar.
- issue: Kausalitas ilahi dalam מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: hal ini berasal dari-Ku
  alternative: hal ini terjadi atas kehendak-Ku
  rationale: Pilihan utama mempertahankan bahasa sumber mengenai asal ilahi dan ketegangan teologisnya tanpa menentukan secara lebih sempit apakah yang dimaksud adalah penyebab langsung, penetapan, atau penyelenggaraan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘janganlah’ dan ‘pulanglah’ memberi bobot pada perintah ilahi tanpa terdengar kuno. Nama ‘Yerobeam’ mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
