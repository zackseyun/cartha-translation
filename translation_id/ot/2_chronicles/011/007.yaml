    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: juga
  rationale: Gabungan וְ dengan penanda objek אֶת melanjutkan daftar dari ayat sebelumnya. Penanda objek tidak diterjemahkan secara tersendiri; “juga” secara alami menandai kelanjutan daftar dalam bahasa Indonesia.
- source_word: בֵּית צ֥וּר
  choice: Bet-Zur
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia, bukan diterjemahkan secara harfiah.
- source_word: שׂוֹכ֖וֹ
  choice: Sokho
  rationale: Nama tempat ini ditransliterasikan langsung dari bentuk Ibrani; “Soko” juga merupakan ejaan yang mungkin dalam bahasa Indonesia.
- source_word: עֲדֻלָּֽם
  choice: Adulam
  rationale: Nama tempat Yehuda ini memakai transliterasi yang lazim dalam bahasa Indonesia.
