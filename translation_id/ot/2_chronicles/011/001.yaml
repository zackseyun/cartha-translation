source:
  edition: WLC
  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: id
  text: Ketika Rehabeam tiba di Yerusalem, ia mengerahkan kaum Yehuda dan Benyamin[a], yaitu 180.000 prajurit pilihan[b], untuk berperang melawan Israel dan mengembalikan kerajaan itu kepada Rehabeam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah Yehuda dan Benyamin”; ungkapan ini menunjuk pada kesatuan suku atau politik.'
    reason: Menjelaskan idiom kolektif Ibrani בֵּית tanpa mempertahankan ungkapan “rumah” yang kurang alami dalam teks utama.
  - marker: b
    text: 'Atau: “orang-orang pilihan yang dapat berperang.”'
    reason: Memperlihatkan bentuk yang lebih harfiah dari בָּחוּר עֹשֵׂה מִלְחָמָה.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: tiba
  rationale: Bentuk naratif Qal dari בוא menyatakan datang atau sampai ke suatu tempat; dengan Yerusalem sebagai tujuan, “tiba” paling alami dalam bahasa Indonesia.
- source_word: וַיַּקְהֵל
  choice: mengerahkan
  rationale: Bentuk Hifil dari קהל berarti mengumpulkan atau menghimpun. Dalam konteks pasukan yang akan berperang, “mengerahkan” menyampaikan tindakan menghimpun mereka untuk tujuan militer.
- source_word: בֵּית יְהוּדָה וּבִנְיָמִן
  choice: kaum Yehuda dan Benyamin
  rationale: בֵּית secara harfiah berarti “rumah”, tetapi bersama nama suku menunjuk pada kesatuan keluarga, suku, atau politik. “Kaum” mempertahankan makna kolektif itu secara alami.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: '180.000'
  rationale: Angka kardinal diterjemahkan langsung dengan format angka baku bahasa Indonesia.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: prajurit pilihan
  rationale: Dalam konteks militer, בָּחוּר dapat menunjuk pada orang terpilih atau terbaik, sedangkan עֹשֵׂה מִלְחָמָה secara harfiah berarti orang yang melakukan peperangan. “Prajurit pilihan” menyampaikan keduanya secara ringkas dan wajar.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: untuk berperang melawan Israel
  rationale: Walaupun עִם biasanya berarti “dengan”, konteks permusuhan menuntut arti “melawan”. Nama “Israel” dipertahankan sebagaimana dalam teks Ibrani.
- source_word: לְהָשִׁיב אֶת הַמַּמְלָכָה לִרְחַבְעָם
  choice: mengembalikan kerajaan itu kepada Rehabeam
  rationale: Hifil dari שוב menyatakan menyebabkan sesuatu kembali. Frasa ini secara langsung menggambarkan tujuan memulihkan kerajaan kepada Rehabeam tanpa menjelaskan lebih jauh sifat kekuasaannya.
theological_decisions:
- issue: Rujukan nama “Israel” setelah perpecahan kerajaan
  choice: Israel
  alternative: suku-suku utara
  rationale: Teks Ibrani sendiri memakai יִשְׂרָאֵל untuk pihak yang akan diperangi. Mempertahankan “Israel” menjaga terminologi penulis dan tidak memasukkan label penafsiran.
- issue: Makna הַמַּמְלָכָה
  choice: kerajaan itu
  alternative: kekuasaan kerajaan itu
  rationale: מַמְלָכָה dapat menunjuk pada kerajaan atau kekuasaan sebagai raja. “Kerajaan itu” merupakan padanan paling langsung dan mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Mengerahkan” dipilih untuk konteks penghimpunan pasukan, sedangkan pengulangan nama Rehabeam pada akhir ayat dipertahankan sesuai teks sumber.
