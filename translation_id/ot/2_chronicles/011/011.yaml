base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: id
  text: Ia memperkuat tempat-tempat berbenteng[a] itu dan menempatkan di sana para komandan[b] serta persediaan[c] makanan, minyak, dan anggur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benteng-benteng” atau “kubu-kubu pertahanan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “para pemimpin,” “para penguasa,” atau “para pejabat.”
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani ini dapat berarti “gudang-gudang” atau barang-barang yang disimpan; di sini maksudnya tampaknya perbekalan yang dicadangkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: Ia memperkuat
  rationale: Bentuk piel dari חזק menyatakan tindakan membuat kuat atau kokoh; 'memperkuat' mempertahankan tindakan verbal tanpa mengulang gagasan benteng secara berlebihan.
- source_word: הַמְּצֻרוֹת
  choice: tempat-tempat berbenteng
  rationale: Kata benda ini menunjuk pada lokasi-lokasi yang diperkuat atau kubu pertahanan; pilihan ini cukup luas dan tidak mengandaikan bahwa semuanya benteng besar.
- source_word: וַיִּתֵּן בָּהֶם
  choice: dan menempatkan ... di dalamnya
  rationale: נתן dengan ב menyatakan penempatan di lokasi-lokasi tersebut. 'Menempatkan' lebih wajar dan bermartabat daripada 'menaruh' untuk orang.
- source_word: נְגִידִים
  choice: para panglima
  rationale: נָגִיד dapat berarti pemimpin, penguasa, atau pejabat. Dalam konteks pertahanan, 'panglima' menyampaikan fungsi kepemimpinan militer tanpa menyiratkan status raja.
- source_word: וְאֹצְרוֹת
  choice: serta menyediakan persediaan
  rationale: אֹצָרוֹת dapat menunjuk pada gudang atau barang yang disimpan. Dalam rangkaian bahan pangan, 'persediaan' secara alami menyampaikan perbekalan yang disimpan; verba 'menyediakan' meneruskan fungsi וַיִּתֵּן secara idiomatis.
- source_word: מַאֲכָל
  choice: makanan
  rationale: Padanan umum dan jelas bagi מַאֲכָל; konteks persediaan sudah menunjukkan fungsinya sebagai perbekalan.
- source_word: שֶׁמֶן
  choice: minyak
  rationale: Padanan baku; kemungkinan besar minyak zaitun, tetapi sumber hanya menyebut minyak.
- source_word: יָיִן
  choice: anggur
  rationale: Padanan Indonesia yang lazim bagi יַיִן dalam konteks daftar bahan persediaan.
