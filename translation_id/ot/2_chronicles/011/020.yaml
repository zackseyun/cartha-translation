base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: id
  text: Setelah itu, ia memperistri Maakha, anak perempuan Absalom[a]. Maakha melahirkan baginya Abia, Atai, Ziza, dan Selomit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak perempuan Absalom”. Dalam silsilah, istilah ini kadang dapat menunjuk kepada keturunan perempuan yang lebih jauh; karena itu, sebagian orang memahaminya sebagai “cucu perempuan Absalom”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: Sesudah perempuan itu
  rationale: Frasa ini secara harfiah berarti “sesudah dia” dengan pronomina feminin tunggal yang merujuk kepada istri yang disebut sebelumnya. “Perempuan itu” membuat rujukannya wajar dan jelas dalam bahasa Indonesia.
- source_word: לָקַח
  choice: ia memperistri
  rationale: Arti dasarnya ialah “mengambil”, tetapi dalam konteks seorang laki-laki mengambil seorang perempuan, ungkapan ini menyatakan pernikahan. “Memperistri” menyampaikan maksud itu secara alami tanpa menambah rincian.
- source_word: מַעֲכָה
  choice: Maakha
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan tetap mencerminkan konsonan Ibrani.
- source_word: בַּת אַבְשָׁלוֹם
  choice: anak perempuan Absalom
  rationale: Kata בַּת secara langsung berarti “anak perempuan”. Kemungkinan pemakaian genealogis yang lebih luas tidak dimasukkan ke teks utama, tetapi dicatat dalam catatan kaki.
- source_word: וַתֵּלֶד לוֹ
  choice: Maakha melahirkan baginya
  rationale: Subjek nama diulang agar kalimat Indonesia jelas setelah pergantian kalimat. “Baginya” mempertahankan unsur לֹו tanpa memberi kesan bahwa anak-anak itu dilahirkan secara fisik untuk diserahkan kepadanya.
- source_word: אֲבִיָּה ... עַתַּי ... זִיזָא ... שְׁלֹמִית
  choice: Abia, Atai, Ziza, dan Selomit
  rationale: Nama-nama diri ditransliterasikan ke dalam ejaan Indonesia; penanda objek berulang dalam bahasa Ibrani tidak perlu dinyatakan.
theological_decisions:
- issue: Hubungan genealogis Maakha dengan Absalom
  choice: anak perempuan Absalom
  alternative: cucu perempuan atau keturunan perempuan Absalom
  rationale: Teks Ibrani secara eksplisit memakai kata “anak perempuan”. Karena istilah kekerabatan dalam silsilah kadang mencakup keturunan yang lebih jauh, kemungkinan itu dipertahankan dalam catatan kaki dan tidak dipaksakan ke teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Memperistri” dipilih sebagai padanan kontekstual bagi “mengambil”, sedangkan pemenggalan menjadi dua kalimat menjaga keterbacaan tanpa mengubah hubungan peristiwa.
