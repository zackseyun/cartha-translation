base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: id
  text: Di setiap kota ia menempatkan perisai dan tombak, lalu ia sangat memperkuat kota-kota itu. Yehuda dan Benyamin berada di bawah kekuasaannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/כָל עִיר וָ/עִיר
  choice: Di setiap kota
  rationale: Pengulangan distributif Ibrani עִיר וָעִיר menekankan setiap kota satu per satu. Dalam bahasa Indonesia modern, “di setiap kota” menyampaikan makna itu secara alami tanpa pengulangan yang janggal.
- source_word: צִנּוֹת
  choice: perisai
  rationale: Kata ini menunjuk pada perisai, mungkin perisai besar; bentuk umum “perisai” jelas dan tidak memberi rincian yang tidak pasti.
- source_word: וּ/רְמָחִים
  choice: tombak
  rationale: Padanan Indonesia yang lazim dan tepat bagi רְמָחִים dalam konteks perlengkapan militer.
- source_word: וַֽ/יְחַזְּקֵם
  choice: memperkuat kota-kota itu
  rationale: Akhiran pronominal jamak merujuk paling wajar kepada kota-kota berkubu dalam konteks sebelumnya. Penyebutan ulang “kota-kota itu” menghindari ketaksaan pronomina Indonesia tanpa mempersempit tindakan menjadi sekadar pembangunan kubu.
- source_word: לְ/הַרְבֵּה מְאֹד
  choice: dengan luar biasa
  rationale: Ungkapan ini memberi penguatan intensif pada tindakan. “Dengan luar biasa” terdengar alami dan tetap mempertahankan tingkat penekanannya.
- source_word: וַ/יְהִי ל֖/וֹ יְהוּדָה וּ/בִנְיָמִן
  choice: Yehuda dan Benyamin berada di bawah kekuasaannya
  rationale: Idiom ויהי לו dapat menyatakan kepemilikan, penguasaan, atau loyalitas. Dalam konteks kerajaan, “berada di bawah kekuasaannya” menyampaikan hubungan politik tersebut secara wajar tanpa menyiratkan kepemilikan pribadi atas wilayah atau suku.
