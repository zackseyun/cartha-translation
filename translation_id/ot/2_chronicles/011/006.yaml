  text: And he built Bethlehem[a], Etam, and Tekoa.
translation:
  language: id
  text: Ia membangun Betlehem, Etam, dan Tekoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Bentuk Qal wayyiqtol dari בנה secara langsung berarti “membangun”. Konteks yang lebih luas menyangkut penguatan kota-kota, tetapi ayat ini sendiri tidak memakai kata kerja khusus yang berarti “membentengi” atau “membangun kembali”.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung dalam bahasa Ibrani ini tidak mempunyai padanan tersendiri yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: בֵּית לֶחֶם
  choice: Betlehem
  rationale: Nama tempat ini memakai bentuk baku dan dikenal luas dalam bahasa Indonesia.
- source_word: עֵיטָם
  choice: Etam
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia.
- source_word: תְּקוֹעַ
  choice: Tekoa
  rationale: Nama tempat ditransliterasikan sebagai “Tekoa”, bentuk yang sesuai dengan bunyi sumber dan lazim dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: וְ...וְ...וְ
  choice: '..., ..., dan ...'
  rationale: Rangkaian waw Ibrani disajikan sebagai daftar alami dalam bahasa Indonesia, dengan kata “dan” sebelum unsur terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina “Ia” mempertahankan rujukan kepada Rehabeam dari konteks sebelumnya tanpa mengulang namanya. Tidak ditambahkan keterangan “membentengi” karena nuansa itu berasal dari konteks, bukan dari kata kerja ayat ini sendiri.
