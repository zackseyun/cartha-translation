  yaml_path: translation/ot/2_chronicles/011/019.yaml
  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: id
  text: 'Ia melahirkan baginya anak-anak laki-laki: Yeush, Semarya, dan Zaham.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Ia melahirkan
  rationale: Bentuk wayyiqtol dari ילד melanjutkan rangkaian peristiwa. 'Melahirkan' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan perempuan sebagai subjek.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל dengan sufiks pronominal menandai sang ayah dalam formula kelahiran. 'Baginya' mempertahankan unsur relasional dalam teks Ibrani tanpa menambahkan nama yang tidak disebutkan dalam ayat ini.
- source_word: בָּנִים
  choice: anak-anak lelaki
  rationale: Kata Ibrani secara khusus berarti anak-anak laki-laki, dan ketiga keturunan yang disebut berikutnya adalah laki-laki.
- source_word: יְעוּשׁ
  choice: Yeus
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁמַרְיָה
  choice: Semarya
  rationale: Nama pribadi ditransliterasikan ke bentuk Indonesia yang mudah dibaca sambil mencerminkan unsur-unsur konsonantal nama Ibrani.
- source_word: זָהַם
  choice: Zaham
  rationale: Nama pribadi ditransliterasikan langsung dalam bentuk yang alami bagi pembaca bahasa Indonesia.
