id: 2CH.20.33
reference: 2 Chronicles 20:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: id
  text: Namun, tempat-tempat pemujaan di bukit tidak disingkirkan, dan rakyat masih belum mengarahkan hati mereka kepada Allah nenek moyang mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: belum mempersiapkan hati mereka bagi Allah nenek moyang mereka.'
    reason: Hifil כון dengan ‘hati’ dapat berarti ‘mengarahkan/menetapkan hati’ maupun ‘mempersiapkan hati’; preposisi ל juga dapat diterjemahkan ‘kepada’ atau ‘bagi’.
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai peralihan yang bersifat pertentangan dari penilaian positif sebelumnya kepada kekurangan yang masih ada.
- source_word: הַבָּמוֹת
  choice: tempat-tempat pemujaan di bukit
  rationale: Menyampaikan istilah kultis bagi lokasi pemujaan di tempat tinggi dengan bahasa Indonesia yang mudah dipahami, tanpa memastikan lebih jauh sifat setiap tempat tersebut.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Walaupun bentuk Ibraninya secara harfiah berarti ‘tidak beralih/berlalu’, dalam konteks ini ungkapan pasif ini secara alami menyatakan bahwa tempat-tempat tersebut tetap dibiarkan ada.
- source_word: וְעוֹד
  choice: masih
  rationale: Menunjukkan bahwa keadaan yang belum beres itu terus berlangsung.
- source_word: הָעָם
  choice: rakyat
  rationale: Kata benda kolektif ini menunjuk kepada penduduk secara umum; ‘rakyat’ alami dalam konteks kerajaan.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: belum mengarahkan hati mereka
  rationale: Hifil כון bersama ‘hati’ dapat berarti mempersiapkan, menetapkan, atau mengarahkan. Pilihan ini mempertahankan unsur kesengajaan dan orientasi batin serta cocok dengan preposisi berikutnya.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: kepada Allah nenek moyang mereka
  rationale: ‘Kepada’ menyatakan arah hati, sedangkan ‘Allah nenek moyang mereka’ mempertahankan rujukan historis-perjanjian tanpa membatasi ‘bapa-bapa’ hanya pada ayah langsung.
theological_decisions:
- issue: Sifat kekurangan rakyat
  choice: Ayat ini menggambarkan pembaruan lahiriah yang belum tuntas sekaligus hati rakyat yang belum diarahkan kepada Allah nenek moyang mereka.
  alternative: Rakyat belum mempersiapkan hati untuk beribadah, atau belum menetapkan diri secara teguh dalam ibadah eksklusif.
  rationale: Teks Ibrani menghubungkan keberadaan tempat-tempat pemujaan dengan keadaan hati. Terjemahan tidak mempersempitnya menjadi emosi semata atau memasukkan rumusan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya, bukan sesudah kata pembuka.
