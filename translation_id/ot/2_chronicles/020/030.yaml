base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: id
  text: Maka kerajaan Yosafat tenteram[a], dan Allahnya mengaruniakan keamanan kepadanya di segala penjuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menjadi tenang.'
    reason: Alternatif ini mencerminkan arti שׁקט yang dapat menekankan keadaan diam, tenang, atau tidak terusik.
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: tenteram
  rationale: Kata kerja שׁקט menyatakan keadaan tenang, tidak terusik, atau damai. Dengan “kerajaan” sebagai subjek, “tenteram” terdengar alami dan tetap mencakup ketenangan serta keamanan.
- source_word: מַלְכוּת
  choice: kerajaan
  rationale: Kata ini menunjuk pada kerajaan atau wilayah kekuasaan Yosafat; “kerajaan” merupakan padanan baku dan alami dalam konteks sejarah ini.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Nama pribadi ini ditulis menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיָּנַח
  choice: mengaruniakan ketenangan kepadanya
  rationale: Bentuk kausatif dari נוח menyatakan bahwa Allah membuat Yosafat memperoleh keadaan tenteram atau bebas dari gangguan. “Mengaruniakan ketenangan” mempertahankan tindakan aktif Allah dan terdengar wajar dalam bahasa Indonesia yang bermartabat.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Bentuk ini berarti “Allahnya,” yakni Allah Yosafat; konteksnya jelas menunjuk kepada Allah dalam arti tunggal.
- source_word: מִסָּבִיב
  choice: di segala penjuru
  rationale: Ungkapan ini menunjukkan ketenangan dari ancaman yang mengelilingi Yosafat. “Di segala penjuru” mempertahankan cakupan menyeluruh dan nuansa spasialnya.
- source_word: וַ
  choice: dan
  rationale: Konjungsi diterjemahkan secara langsung sebagai “dan,” sehingga hubungan antara kedua klausa tidak dibuat lebih kausal daripada yang dinyatakan secara eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Peran Allah dalam ketenteraman kerajaan Yosafat
  choice: Klausa kedua tetap menyatakan secara jelas bahwa Allah Yosafatlah yang mengaruniakan ketenangan kepadanya, tetapi kedua klausa dihubungkan dengan “dan.”
  alternative: Menggunakan “sebab” untuk menjadikan klausa kedua alasan eksplisit bagi klausa pertama.
  rationale: Teks Ibrani menempatkan kedua peristiwa secara berurutan dan jelas menegaskan tindakan Allah, tetapi konjungsinya sendiri tidak harus dinyatakan sebagai hubungan sebab-akibat. “Dan” mempertahankan koordinasi serta ketegangan semantis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tenteram” dipilih agar mudah dipahami sekaligus mencakup kedamaian dan ketiadaan gangguan; “mengaruniakan” menandai tindakan Allah secara alami tanpa menambah hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
