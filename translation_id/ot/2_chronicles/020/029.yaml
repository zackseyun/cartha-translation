id: 2CH.20.29
reference: 2 Chronicles 20:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: id
  text: Lalu ketakutan akan Allah[a] melanda semua kerajaan di berbagai negeri ketika mereka mendengar bahwa Yahweh telah berperang melawan musuh-musuh Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kegentaran dari Allah.” Ungkapan Ibrani ini dapat menunjuk pada ketakutan yang berkaitan dengan kehadiran atau tindakan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu ... melanda
  rationale: Bentuk naratif ini menyatakan munculnya suatu keadaan sebagai akibat peristiwa sebelumnya. Kata “melanda” secara alami menggambarkan ketakutan yang mulai menguasai kerajaan-kerajaan itu.
- source_word: פַּחַד אֱלֹהִים
  choice: ketakutan akan Allah
  rationale: Ungkapan konstruksi Ibrani ini dipertahankan cukup dekat dengan bentuk sumber dan dapat menunjuk pada ketakutan yang berkaitan dengan kehadiran atau tindakan Allah. Catatan kaki mempertahankan kemungkinan makna bahwa kegentaran itu berasal dari Allah.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: melanda semua kerajaan di berbagai negeri
  rationale: Kata עַל tercakup secara idiomatis dalam “melanda,” sedangkan bentuk jamak הָאֲרָצוֹת diterjemahkan sebagai “berbagai negeri,” bukan sebagai seluruh bumi.
- source_word: בְּשָׁמְעָם כִּי
  choice: ketika mereka mendengar bahwa
  rationale: Preposisi dengan infinitif menyatakan waktu, dan כִּי memperkenalkan isi berita yang mereka dengar.
- source_word: נִלְחַם יְהוָה
  choice: Yahweh telah berperang
  rationale: Bentuk perfektif menunjuk pada tindakan yang sudah terjadi dan kemudian didengar oleh kerajaan-kerajaan tersebut. Nama ilahi dipertahankan sebagai Yahweh.
- source_word: עִם אוֹיְבֵי יִשְׂרָאֵל
  choice: melawan musuh-musuh Israel
  rationale: Dalam konstruksi dengan verba “berperang,” עִם menunjuk pada pihak lawan; karena itu “melawan” menyampaikan relasi adversatif dengan jelas.
theological_decisions:
- issue: Makna פַּחַד אֱלֹהִים
  choice: ketakutan akan Allah
  alternative: kegentaran dari Allah
  rationale: Terjemahan utama mempertahankan hubungan genitif yang ambigu dalam bahasa Ibrani, sedangkan catatan kaki menyebut kemungkinan bahwa Allah adalah sumber kegentaran itu.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian יהוה, sehingga nama itu ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan ambiguitas asli pada frasa “ketakutan akan Allah” melalui catatan kaki.
