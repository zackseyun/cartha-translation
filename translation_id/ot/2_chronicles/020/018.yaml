  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: id
  text: Lalu Yosafat membungkuk dengan muka ke tanah. Seluruh Yehuda dan penduduk Yerusalem pun tersungkur di hadapan Yahweh untuk menyembah Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk sujud kepada Yahweh.”'
    reason: Alternatif ini mempertahankan arti fisik לְהִשְׁתַּחֲוֺת, yang juga dapat berarti membungkukkan diri atau sujud dalam penghormatan.
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: membungkuk
  rationale: Kata קָדַד menyatakan tindakan membungkukkan diri dalam penghormatan. Pilihan ini mempertahankan gerak konkret tanpa menambahkan bahwa Yosafat berlutut.
- source_word: אַפַּיִם אָרְצָה
  choice: dengan muka ke tanah
  rationale: Ungkapan Ibrani ini secara idiomatis menggambarkan sikap merendahkan diri dengan wajah diarahkan ke tanah.
- source_word: וְכָל יְהוּדָה
  choice: seluruh Yehuda
  rationale: Nama Yehuda dipakai secara kolektif untuk rakyat Yehuda; bentuk ringkas ini mempertahankan gaya teks sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: penduduk Yerusalem
  rationale: Bentuk partisipial tersebut berarti orang-orang yang tinggal di Yerusalem; 'penduduk' merupakan padanan modern yang alami.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: tersungkur di hadapan Yahweh
  rationale: נָפְלוּ secara konkret berarti 'jatuh', tetapi dalam konteks ibadah menunjuk pada tindakan merebahkan diri. 'Tersungkur' mempertahankan tindakan fisik sekaligus nuansa penghormatan.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: untuk menyembah
  rationale: Bentuk hitpael dari שׁחה dapat berarti sujud atau menyembah. Karena tindakan fisiknya sudah disebutkan, 'menyembah' menyampaikan tujuan tindakan itu tanpa pengulangan yang kaku.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh / kepada Yahweh
  rationale: Nama ilahi muncul dua kali dalam teks Ibrani. Keduanya dipertahankan sebagai nama diri 'Yahweh', termasuk pengulangan pada akhir ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna לְהִשְׁתַּחֲוֺת dalam konteks ibadah
  choice: untuk menyembah Yahweh
  alternative: untuk sujud kepada Yahweh
  rationale: Kata ini mencakup tindakan sujud dan penghormatan ibadah. Terjemahan utama mengungkapkan tujuan religiusnya, sedangkan alternatif di catatan mempertahankan gambaran fisiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Muka' dipilih dalam ungkapan gerak tubuh karena lebih alami daripada 'wajah' dalam frasa ini; 'pun' menandai kelanjutan respons seluruh umat tanpa menambah isi teologis.
