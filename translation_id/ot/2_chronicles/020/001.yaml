  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֡ן בָּ֣אוּ בְנֵי מוֹאָב֩ וּ/בְנֵ֨י עַמּ֜וֹן וְ/עִמָּ/הֶ֧ם מֵֽ/הָ/עַמּוֹנִ֛ים עַל יְהוֹשָׁפָ֖ט לַ/מִּלְחָמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: id
  text: Sesudah itu, orang Moab dan orang Amon, bersama dengan sebagian orang Meunim[a], datang berperang melawan Yosafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani: “sebagian orang Amon.” Berdasarkan konteks dan sejumlah versi kuno, banyak penafsir memahami ungkapan ini sebagai sebutan bagi orang Meunim atau kelompok sekutu serupa, bukan sebagai pengulangan orang Amon.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan peralihan naratif ini menyatakan urutan waktu. Terjemahan ini alami dalam bahasa Indonesia modern tanpa menyalin secara kaku unsur idiomatis ‘dan terjadilah’.
- source_word: בְנֵי מוֹאָב
  choice: orang Moab
  rationale: Dalam konteks ini, konstruksi harfiah ‘anak-anak Moab’ merupakan sebutan etnis. ‘Orang Moab’ menyampaikan maksudnya secara wajar.
- source_word: בְנֵי עַמּוֹן
  choice: orang Amon
  rationale: Sebutan etnis ini diterjemahkan secara idiomatis sebagai ‘orang Amon’, bukan secara harfiah ‘anak-anak Amon’.
- source_word: וְעִמָּהֶם
  choice: bersama dengan
  rationale: Menunjukkan bahwa kelompok tambahan tersebut menyertai orang Moab dan orang Amon.
- source_word: מֵהָעַמּוֹנִים
  choice: sebagian orang Meunim
  rationale: Teks Ibrani Masoret secara tertulis menunjuk kepada ‘sebagian orang Amon’, tetapi pengulangan itu sulit dalam konteks. Sejumlah saksi kuno dan konteks pasal ini mendukung pemahaman bahwa yang dimaksud ialah kelompok sekutu lain, biasanya diidentifikasi sebagai orang Meunim. Bacaan Ibrani dipertahankan dalam catatan kaki.
- source_word: בָּאוּ ... עַל יְהוֹשָׁפָט
  choice: datang menyerang Yosafat
  rationale: Gabungan verba gerak dengan עַל dalam konteks militer menyatakan gerakan bermusuhan terhadap Yosafat. ‘Datang menyerang’ alami dan tidak memperinci strategi militer yang tidak disebutkan.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Menyatakan tujuan kedatangan mereka dengan ungkapan Indonesia yang jelas dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sebutan etnis memakai bentuk ‘orang Moab’, ‘orang Amon’, dan ‘orang Meunim’ agar mudah dipahami pembaca umum. Varian tekstual ditandai tepat pada nama kelompok yang dipersoalkan.
