source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: id
  text: Jika malapetaka menimpa kami—pedang, penghukuman, wabah, atau kelaparan—kami akan berdiri di hadapan rumah ini dan di hadapan-Mu, sebab nama-Mu ada di rumah ini[a]. Kami akan berseru kepada-Mu dari tengah kesesakan kami, dan Engkau akan mendengar serta menyelamatkan kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rumah ini menyandang nama-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam konteks ini kata tersebut menunjuk pada bencana yang menimpa umat, bukan kejahatan moral. “Malapetaka” alami dalam bahasa Indonesia dan menaungi daftar bencana yang menyusul.
- source_word: חֶרֶב
  choice: pedang
  rationale: Gambaran konkret Ibrani dipertahankan, alih-alih ditafsirkan secara lebih abstrak sebagai “perang”.
- source_word: שְׁפוֹט
  choice: penghukuman
  rationale: Dipahami sebagai unsur dalam daftar malapetaka. “Penghukuman” menyampaikan nuansa tindakan menghukum, bukan sekadar proses peradilan, tanpa menjelaskan pelakunya secara berlebihan.
- source_word: דֶבֶר
  choice: wabah
  rationale: Menunjuk pada penyakit menular yang meluas dalam konteks kutuk perjanjian; “wabah” ringkas, jelas, dan lazim dalam bahasa Indonesia modern.
- source_word: רָעָב
  choice: kelaparan
  rationale: Menunjuk pada kelangkaan pangan yang meluas, bukan sekadar rasa lapar pribadi.
- source_word: נַעַמְדָה
  choice: kami akan berdiri
  rationale: Bentuk kohortatif diterjemahkan dengan daya masa depan dalam kalimat bersyarat, yaitu tindakan yang akan dilakukan umat apabila malapetaka datang.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: di hadapan rumah ini
  rationale: “Rumah” mempertahankan sebutan Ibrani bagi rumah TUHAN dan bahasa teologisnya, sedangkan “di hadapan” sesuai dengan sikap umat ketika datang untuk berdoa.
- source_word: וּלְפָנֶיךָ
  choice: dan di hadapan-Mu
  rationale: Mempertahankan kesejajaran antara berdiri di hadapan rumah dan di hadapan Allah, tanpa menyamakan rumah itu dengan Allah.
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: sebab nama-Mu ada di rumah ini
  rationale: Ungkapan Ibrani dipertahankan sedekat mungkin tanpa membatasi maknanya hanya pada kehadiran, kepemilikan, atau penamaan. Alternatif idiomatis dicatat dalam catatan kaki.
- source_word: וְנִזְעַק
  choice: Kami akan berseru
  rationale: “Berseru” menyampaikan doa yang mendesak dari dalam penderitaan, lebih kuat daripada kata netral seperti “berdoa”.
- source_word: מִצָּרָתֵנוּ
  choice: dari tengah kesesakan kami
  rationale: Terjemahan ini menyampaikan bahwa seruan itu timbul dari keadaan terjepit, sambil menghasilkan ungkapan Indonesia yang alami.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: dan Engkau akan mendengar serta menyelamatkan kami
  rationale: Kedua verba dipertahankan secara berbeda dan langsung. Objek “kami” dibuat tersurat pada verba terakhir agar kalimat Indonesia lengkap dan jelas.
theological_decisions:
- issue: Teologi nama dan rumah Allah dalam frasa “nama-Mu ada di rumah ini”
  choice: 'Mempertahankan idiom Ibrani dalam teks utama: “nama-Mu ada di rumah ini.”'
  alternative: “Rumah ini menyandang nama-Mu” atau “nama-Mu ada atas rumah ini.”
  rationale: Idiom tersebut menghubungkan nama Allah dengan rumah-Nya serta dapat mencakup klaim, kepemilikan, dan kehadiran perjanjian. Terjemahan utama tidak mereduksinya menjadi satu penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai pronomina berhuruf kapital. Istilah “rumah” dipertahankan daripada diganti dengan “Bait Allah” agar metafora dan diksi sumber tetap terdengar. Tanda pisah membantu pembaca mengenali daftar malapetaka, sedangkan pemisahan menjadi dua kalimat menjaga kelancaran tanpa mengubah hubungan logis ayat.
