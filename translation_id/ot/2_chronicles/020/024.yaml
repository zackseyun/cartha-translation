base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: id
  text: Ketika orang Yehuda tiba di tempat pengintaian yang menghadap padang gurun, mereka menoleh ke arah pasukan besar itu. Lihatlah, ada mayat-mayat bergelimpangan di tanah; tidak seorang pun selamat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוּדָה
  choice: orang Yehuda
  rationale: Nama Yehuda dipakai secara kolektif bagi pasukan atau rakyat Yehuda; penambahan 'orang' memperjelas makna kolektif secara alami dalam bahasa Indonesia.
- source_word: בָּא
  choice: tiba
  rationale: Bentuk tunggal mengikuti subjek kolektif Yehuda dan menyatakan sampainya mereka di lokasi tersebut.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: di tempat pengintaian yang menghadap padang gurun
  rationale: מִצְפֶּה menunjuk tempat untuk mengamati, sedangkan לַמִּדְבָּר menunjukkan orientasinya ke arah padang gurun. Ungkapan ini mempertahankan gambaran topografis secara wajar.
- source_word: וַיִּפְנוּ
  choice: mereka menoleh
  rationale: פנה secara konkret berarti berbalik atau menoleh; konteksnya menunjukkan bahwa mereka mengarahkan pandangan kepada pasukan itu.
- source_word: אֶל הֶהָמוֹן
  choice: ke arah pasukan besar itu
  rationale: הָמוֹן berarti kumpulan atau massa yang besar. Dalam konteks pertempuran, 'pasukan besar' menyampaikan acuannya tanpa memakai istilah yang terlalu merendahkan seperti 'gerombolan'.
- source_word: וְהִנָּם
  choice: Lihatlah, yang tampak hanyalah
  rationale: Partikel deiktis הִנֵּה menandai penemuan yang mendadak dan mencolok. 'Lihatlah' mempertahankan daya retorisnya, sementara susunan berikutnya dibuat alami dalam bahasa Indonesia.
- source_word: פְּגָרִים
  choice: mayat-mayat
  rationale: פֶּגֶר berarti mayat atau jasad tak bernyawa; 'mayat-mayat' merupakan padanan umum, jelas, dan tepat bagi suasana medan perang.
- source_word: נֹפְלִים אַרְצָה
  choice: bergelimpangan di tanah
  rationale: Secara harfiah frasa ini menggambarkan mayat-mayat yang telah jatuh ke tanah. 'Bergelimpangan di tanah' menyampaikan keadaan hasilnya secara hidup dan idiomatis.
- source_word: וְאֵין פְּלֵיטָה
  choice: tidak seorang pun selamat
  rationale: פְּלֵיטָה dapat menunjuk orang yang lolos atau keadaan lolos. Dalam konteks ini, ungkapan tersebut berarti tidak ada seorang pun yang luput dan tetap hidup.
