base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: id
  text: Lalu ia bersekutu dengannya[a] untuk membuat kapal-kapal guna berlayar ke Tarsis[b]. Mereka membuat kapal-kapal di Ezion-Geber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bekerja sama dengannya” atau “bergabung dengannya”. Kata kerja Ibrani menunjukkan tindakan menjalin hubungan kerja sama atau persekutuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kapal-kapal yang akan berlayar ke Tarsis”. Dalam konteks pelayaran, ungkapan yang berkaitan dengan Tarsis kadang dipahami secara lebih idiomatis, tetapi di sini bahasa Ibraninya paling wajar menyatakan tujuan perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: ia bersekutu dengannya
  rationale: Bentuk Hifil dari חבר dengan עִם menyatakan masuk ke dalam suatu persekutuan atau kerja sama. “Bersekutu dengannya” alami dalam bahasa Indonesia dan mempertahankan nuansa hubungan bersama tanpa membatasinya secara khusus pada ranah politik atau dagang.
- source_word: לַעֲשׂוֹת
  choice: untuk membuat
  rationale: עשה berarti luas “melakukan/membuat”. “Membuat kapal-kapal” tetap wajar dalam bahasa Indonesia dan lebih dekat dengan verba Ibrani daripada “membangun”.
- source_word: אֳנִיּוֹת
  choice: kapal-kapal
  rationale: Nomina ini menunjuk pada kapal laut; “kapal-kapal” merupakan padanan Indonesia yang baku dan tepat dalam konteks pelayaran dagang.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: yang akan pergi ke Tarsis
  rationale: Infinitif הלך paling langsung menyatakan tujuan perjalanan. Klausa relatif “yang akan pergi” membuat hubungan tujuan kapal jelas dan alami dalam bahasa Indonesia, tanpa mengganti verba Ibrani dengan “berlayar” di teks utama.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam tradisi ejaan Alkitab bahasa Indonesia.
- source_word: וַיַּעֲשׂוּ
  choice: Mereka membuat
  rationale: Verba jamak menunjuk pada tindakan bersama kedua pihak. “Mereka membuat” mempertahankan pengulangan akar עשה dari klausa sebelumnya.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: di Ezion-Geber
  rationale: Preposisi ב menandai lokasi pembuatan kapal. “Di” adalah padanan lokatif yang alami, dan nama tempat ditransliterasikan.
