  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: id
  text: Pada hari keempat mereka berkumpul di Lembah Beraka[a], karena di sanalah mereka memuji Yahweh. Itulah sebabnya mereka menamai tempat itu Lembah Beraka sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beraka berarti “berkat”. Kata Ibrani yang diterjemahkan “memuji” berasal dari akar kata yang sama.
    reason: Menjelaskan arti nama tempat dan mempertahankan permainan kata Ibrani antara בְּרָכָה dan בֵּרֲכוּ yang tidak sepenuhnya tampak dalam terjemahan alami bahasa Indonesia.
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: mereka berkumpul
  rationale: Bentuk Nifal di sini menyatakan bahwa orang-orang itu datang bersama dan berhimpun. “Berkumpul” merupakan padanan Indonesia yang alami dan tepat.
- source_word: עֵמֶק בְּרָכָה
  choice: Lembah Beraka
  rationale: עֵמֶק diterjemahkan sebagai “Lembah”, sedangkan בְּרָכָה ditransliterasikan sebagai nama tempat “Beraka”. Makna nama dan permainan katanya dijelaskan dalam catatan kaki.
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: karena di sanalah mereka memuji Yahweh
  rationale: כִּי menyatakan alasan penamaan tempat tersebut. Dalam konteks objeknya adalah Allah, בֵּרֲכוּ secara alami berarti memuji atau mengagungkan-Nya. “Memuji” menghindari kesan keliru bahwa manusia menganugerahkan berkat kepada Allah, sementara hubungan dengan בְּרָכָה dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: mereka menamai tempat itu
  rationale: Ungkapan harfiah “memanggil nama tempat itu” merupakan rumus penamaan dalam bahasa Ibrani. “Menamai tempat itu” menyampaikan maknanya secara wajar dalam bahasa Indonesia modern.
- source_word: עַד הַיּוֹם
  choice: sampai hari ini
  rationale: Ini adalah ungkapan baku Ibrani yang menunjukkan bahwa nama tersebut tetap digunakan hingga masa penulis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks menggunakan nama ilahi YHWH secara langsung. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Makna tindakan בֵּרֲכוּ ketika objeknya Yahweh
  choice: memuji Yahweh
  alternative: memberkati Yahweh
  rationale: Secara leksikal verba ini berhubungan dengan “berkat”, tetapi ketika manusia melakukannya kepada Allah, maksudnya ialah memuji atau mengagungkan Dia. Pilihan “memuji” lebih alami dalam bahasa Indonesia, sedangkan permainan kata Ibraninya dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. Penekanan partikel שָׁם dipertahankan melalui “di sanalah”, dan hubungan sebab-akibat עַל כֵּן dinyatakan dengan “Itulah sebabnya”.
