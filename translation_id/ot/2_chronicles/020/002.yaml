base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: id
  text: Lalu mereka datang dan melaporkan kepada Yosafat, “Sejumlah besar orang sedang datang menyerangmu dari seberang laut[a], dari Aram[b]. Lihat, mereka berada di Hazazon-Tamar, yaitu En-Gedi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari balik laut.”
    reason: lexical_alternative
  - marker: b
    text: Aram adalah nama wilayah dalam bahasa Ibrani yang sering diterjemahkan “Suriah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu mereka datang
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa dalam narasi. “Lalu” menyampaikan perkembangan itu secara alami, sedangkan subjek jamak tetap dinyatakan tanpa menambahkan identitas yang tidak terdapat dalam teks.
- source_word: וַיַּגִּידוּ לִיהוֹשָׁפָט
  choice: dan melaporkan kepada Yosafat
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. “Melaporkan” sesuai dengan suasana penyampaian berita mendesak kepada raja.
- source_word: הָמוֹן רָב
  choice: sejumlah besar orang
  rationale: Frasa ini menunjuk pada kumpulan atau massa yang sangat banyak. Pilihan ini mempertahankan keluasan makna dan tidak mempersempitnya menjadi pasukan resmi, meskipun konteksnya bersifat militer.
- source_word: בָּא עָלֶיךָ
  choice: sedang datang menyerangmu
  rationale: Qatal בָּא dalam laporan langsung menyatakan ancaman yang sedang mendekat, sedangkan עַל dalam konteks permusuhan paling alami diterjemahkan “menyerang”.
- source_word: מֵעֵבֶר לַיָּם
  choice: dari balik laut
  rationale: Ungkapan ini secara harfiah menunjukkan asal dari sisi lain atau seberang laut. “Dari balik laut” alami dalam bahasa Indonesia dan mempertahankan sudut pandang geografis teks.
- source_word: מֵאֲרָם
  choice: dari Aram
  rationale: Aram dipertahankan sebagai nama tempat Ibrani, bukan diganti dengan nama historis yang lebih kemudian, “Suriah”.
- source_word: וְהִנָּם
  choice: Lihatlah, mereka sekarang berada
  rationale: הִנֵּה dengan sufiks menarik perhatian pada lokasi mereka saat laporan disampaikan. “Lihatlah” mempertahankan daya penunjuk dan urgensinya; “sekarang” mengungkapkan kehadiran yang aktual tanpa mengubah makna.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: di Hazazon-Tamar
  rationale: Nama tempat ditransliterasikan, dan preposisi lokatif ב diterjemahkan secara alami dengan “di”.
- source_word: הִיא עֵין גֶּדִי
  choice: (yaitu En-Gedi)
  rationale: Klausa ini mengidentifikasi Hazazon-Tamar sebagai En-Gedi. Bentuk dalam tanda kurung menyampaikan keterangan penjelas secara jelas.
