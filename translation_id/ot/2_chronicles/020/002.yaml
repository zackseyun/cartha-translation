translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “menyerangmu” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani tanpa menambahkan gelar kerajaan. “Sejumlah besar orang” dipilih agar tidak terlalu cepat mengkhususkan הָמוֹן sebagai pasukan resmi.
