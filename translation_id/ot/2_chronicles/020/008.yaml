  text: וַ/יֵּשְׁב֖וּ בָ֑/הּ וַ/יִּבְנ֨וּ לְ/ךָ֧ בָּ֛/הּ מִקְדָּ֖שׁ לְ/שִׁמְ/ךָ֥ לֵ/אמֹֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/008.yaml
  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: id
  text: 'Mereka tinggal di negeri itu[a] dan di sana membangun bagi-Mu sebuah tempat kudus bagi nama-Mu[b]. Mereka berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetap di negeri itu” atau “berdiam di negeri itu.”
    reason: lexical_alternative
  - marker: b
    text: “Tempat kudus bagi nama-Mu” berarti tempat suci yang dipersembahkan bagi nama TUHAN—yakni bagi kehadiran-Nya yang dinyatakan dan kehormatan-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Mereka tinggal
  rationale: Kata kerja ישׁב di sini menyatakan bahwa mereka berdiam dan menetap di negeri itu. “Tinggal” alami dalam bahasa Indonesia modern serta tidak terlalu menonjolkan baik tindakan awal menetap maupun keadaan menetap terus-menerus.
- source_word: בָהּ
  choice: di negeri itu / di sana
  rationale: Akhiran pronomina feminin tunggal mengacu pada negeri yang disebut dalam konteks sebelumnya. Penyebutan “negeri itu” memperjelas acuannya, sedangkan pengulangan kedua diterjemahkan secara alami sebagai “di sana”.
- source_word: וַיִּבְנוּ
  choice: membangun
  rationale: Padanan langsung dan lazim untuk בנה.
- source_word: לְךָ
  choice: bagi-Mu
  rationale: 'Preposisi ל menyatakan peruntukan atau pengabdian: tempat kudus itu dibangun bagi Allah. “Bagi-Mu” mempertahankan nuansa tersebut.'
- source_word: מִקְדָּשׁ
  choice: sebuah tempat kudus
  rationale: מִקְדָּשׁ berarti tempat yang kudus atau dikhususkan. “Tempat kudus” jelas bagi pembaca Indonesia dan tidak mempersempit istilah itu menjadi sebutan institusional “Bait Allah”, meskipun bangunan yang dimaksud adalah Bait Allah.
- source_word: לְשִׁמְךָ
  choice: bagi nama-Mu
  rationale: Terjemahan dekat ini mempertahankan ungkapan teologis Ibrani mengenai tempat yang dipersembahkan bagi nama, kehadiran yang dinyatakan, dan kehormatan Allah, tanpa menyiratkan bahwa Allah dibatasi oleh bangunan itu.
- source_word: לֵאמֹר
  choice: 'Mereka berkata:'
  rationale: Bentuk ini memperkenalkan isi pernyataan pada ayat berikutnya. Pemisahan menjadi kalimat baru menghasilkan bahasa Indonesia yang alami sambil mempertahankan fungsi pengantar kutipan.
theological_decisions:
- issue: Makna “tempat kudus bagi nama-Mu”
  choice: Tempat kudus yang dipersembahkan bagi nama Allah, yang berkaitan dengan kehadiran-Nya yang dinyatakan dan kehormatan-Nya
  alternative: Bait untuk kehormatan-Mu; tempat kudus yang menyandang nama-Mu
  rationale: Ungkapan Ibrani menghubungkan tempat kudus dengan nama Allah tanpa menyatakan bahwa Allah secara ruang terkandung di dalamnya. Terjemahan mempertahankan ketegangan teologis ini dan tidak memperluasnya menjadi tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada akhiran pronomina “-Mu” dipakai untuk rujukan kepada Allah. Pengulangan dua bentuk בָהּ dipertahankan secara alami melalui “di negeri itu” dan “di sana”. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
