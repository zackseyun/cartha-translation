  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: id
  text: Kemudian Eliezer anak Dodawahu, dari Maresya, bernubuat menentang Yosafat, katanya, “Karena engkau telah bersekutu dengan Ahazia, Yahweh telah menghancurkan pekerjaanmu[a].” Kapal-kapal itu pun hancur dan tidak dapat berlayar ke Tarsis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pekerjaan-pekerjaanmu”; dalam konteks ini yang dimaksud ialah usaha pembuatan kapal Yosafat.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibraninya juga dapat diterjemahkan “tidak sanggup pergi” atau “terhalang untuk pergi” ke Tarsis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: bernubuat
  rationale: Bentuk hitpael dari נבא di sini menyatakan penyampaian pesan sebagai nabi; “bernubuat” merupakan padanan Indonesia yang alami dan langsung.
- source_word: עַל
  choice: menentang
  rationale: Dalam konteks nubuat penghukuman yang diarahkan kepada Yosafat, עַל menyatakan sikap melawan atau mengecam, bukan sekadar topik pembicaraan.
- source_word: מִמָּרֵשָׁה
  choice: dari Maresya
  rationale: Preposisi מִן menunjukkan asal; nama tempat ditransliterasikan sebagai “Maresya” sesuai pelafalan yang wajar dalam bahasa Indonesia.
- source_word: כְּהִתְחַבֶּרְךָ עִם
  choice: Karena engkau telah bersekutu dengan
  rationale: Bentuk hitpael חבר menyatakan tindakan menggabungkan atau mengikatkan diri dengan pihak lain. “Bersekutu dengan” alami dalam konteks kerja sama kerajaan tanpa memastikan adanya perjanjian formal.
- source_word: פָּרַץ
  choice: telah menghancurkan
  rationale: Dengan מַעֲשֶׂיךָ sebagai objek, פרץ bermakna merusak atau menggagalkan usaha tersebut. “Menghancurkan” mempertahankan daya ungkap kuat dari verba Ibrani.
- source_word: מַעֲשֶׂיךָ
  choice: hasil pekerjaanmu
  rationale: Secara harfiah berarti “pekerjaan-pekerjaanmu” atau “perbuatanmu”; dalam konteks ini menunjuk pada apa yang dihasilkan oleh proyek pembuatan kapal Yosafat.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: Kapal-kapal itu pun pecah
  rationale: Bentuk nifal menyatakan kapal-kapal tersebut menjadi rusak atau pecah. Pilihan ini dekat dengan bentuk sumber dan cocok untuk kapal yang gagal berlayar.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: dan tidak dapat berlayar
  rationale: Dalam konstruksi ini עצר menyatakan ketidakmampuan atau terhalangnya tindakan. Karena subjeknya kapal, “berlayar” lebih alami daripada “pergi” dalam bahasa Indonesia.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Nama tempat ini ditransliterasikan dalam bentuk Indonesia yang sudah lazim.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan tindakan Yahweh dengan kehancuran proyek
  choice: Yahweh telah menghancurkan hasil pekerjaanmu
  alternative: Yahweh telah menggagalkan usahamu
  rationale: Terjemahan mempertahankan pernyataan sebab-akibat yang tegas dalam nubuat serta citra penghancuran pada verba פרץ, tanpa memperlunaknya menjadi tindakan yang hanya tidak langsung.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama-nama ditulis dalam bentuk Indonesia: Eliezer, Dodawahu, Maresya, Yosafat, Ahazia, dan Tarsis. Kata ganti “engkau” dipakai karena merupakan teguran langsung dalam nubuat.'
