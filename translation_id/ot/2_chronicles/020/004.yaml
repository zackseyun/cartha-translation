base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: id
  text: Orang-orang Yehuda berkumpul untuk mencari pertolongan dari Yahweh[a]. Bahkan, orang-orang dari semua kota di Yehuda datang untuk mencari Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk mencari dari Yahweh.” Yang dicari tidak disebutkan secara tersurat; dalam konteks ini, maksudnya kemungkinan pertolongan atau pembebasan dari-Nya.'
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani memakai konstruksi yang berbeda dari klausa pertama: di sini Yahweh menjadi objek langsung dari kata “mencari”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: Orang-orang Yehuda berkumpul
  rationale: Bentuk Nifal dari קבץ menyatakan tindakan berhimpun atau berkumpul. Penambahan “orang-orang” memperjelas bahwa יְהוּדָה di sini merupakan sebutan kolektif bagi penduduk Yehuda, bukan nama seorang leluhur.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: untuk mencari pertolongan dari Yahweh
  rationale: בקשׁ berarti “mencari”, sedangkan konstruksi dengan מִן menunjuk kepada sesuatu yang dicari dari Yahweh, walaupun objeknya tidak dinyatakan. Dalam konteks ancaman perang, “pertolongan” merupakan pelengkapan idiomatis yang paling wajar, tetapi ketidaktersuratannya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: גַּם
  choice: Bahkan
  rationale: גַּם memberi penekanan pada luasnya keikutsertaan yang dijelaskan dalam klausa berikutnya.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: dari semua kota di Yehuda
  rationale: Ungkapan ini menyatakan cakupan geografis seluruh kota dalam wilayah Yehuda; susunan tersebut alami dalam bahasa Indonesia.
- source_word: בָּאוּ
  choice: datang
  rationale: Kata kerja בוא menyatakan gerak datang dan diterjemahkan langsung dengan bentuk naratif yang sederhana.
- source_word: לְבַקֵּשׁ אֶת יְהוָה
  choice: untuk mencari Yahweh
  rationale: Berbeda dari klausa pertama, אֵת menandai Yahweh sebagai objek langsung. Terjemahan ini mempertahankan perbedaan konstruksi dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi ilahi yang terdapat dalam teks tanpa menggantinya dengan gelar.
- issue: Apakah kedua konstruksi בקשׁ harus diseragamkan
  choice: Klausa pertama diterjemahkan “mencari pertolongan dari Yahweh”, sedangkan klausa kedua “mencari Yahweh”.
  alternative: Menerjemahkan keduanya secara sama sebagai “mencari Yahweh” atau “mencari pertolongan dari Yahweh”.
  rationale: 'Teks Ibrani sengaja memakai konstruksi berbeda: בקשׁ + מִן pada klausa pertama dan בקשׁ + אֵת pada klausa kedua. Pembedaan terjemahan menjaga nuansa bahwa mereka mencari sesuatu dari Yahweh—dalam konteks ini pertolongan—dan juga mencari Yahweh sendiri, tanpa menjadikan perbedaan itu rumusan teologis yang lebih tegas daripada teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang-orang Yehuda” dipakai agar subjek kolektif jelas. Dua kalimat digunakan untuk menjaga kelancaran sekaligus menonjolkan cakupan partisipasi dari seluruh kota Yehuda.
