base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: id
  text: Lalu orang Amon dan orang Moab bangkit menyerang penduduk Pegunungan Seir untuk menyerahkan mereka kepada kebinasaan[a] dan memusnahkan mereka. Setelah menghabisi penduduk Seir, mereka saling membantu untuk membinasakan satu sama lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “menempatkan mereka di bawah larangan,” yaitu mengkhususkan mereka untuk dibinasakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... עַל
  choice: bangkit menyerang
  rationale: Secara harfiah berarti ‘berdiri ... melawan/atas’, tetapi dalam konteks peperangan konstruksi ini menyatakan tindakan memusuhi atau menghadapi sebagai lawan. ‘Bangkit menyerang’ alami dalam bahasa Indonesia dan mempertahankan daya adversatifnya.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: orang Amon dan orang Moab
  rationale: Ungkapan etnis ini menunjuk kepada kedua kelompok bangsa tersebut. Bentuk ‘orang Amon dan orang Moab’ lebih alami daripada terjemahan harfiah ‘anak-anak Amon dan Moab’.
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: penduduk Pegunungan Seir
  rationale: יֹשְׁבֵי berarti orang-orang yang mendiami suatu wilayah. הַר dapat menunjuk gunung atau kawasan pegunungan; dalam konteks wilayah Seir, ‘Pegunungan Seir’ merupakan padanan geografis yang wajar.
- source_word: לְהַחֲרִים
  choice: menumpas mereka sebagai sesuatu yang dikhususkan bagi kebinasaan
  rationale: Bentuk Hifil dari חרם bukan sekadar berarti membunuh, melainkan menyerahkan atau mengkhususkan sesuatu bagi pembinasaan. Rumusan ini mempertahankan bobot kultis-perangnya tanpa memakai istilah teknis yang tidak jelas.
- source_word: וּלְהַשְׁמִיד
  choice: dan memusnahkan mereka
  rationale: שׁמד menyatakan pembinasaan menyeluruh. ‘Memusnahkan’ membedakannya dari חרם sebelumnya sekaligus mempertahankan intensitas ungkapan Ibrani.
- source_word: וּכְכַלּוֹתָם
  choice: setelah menghabisi
  rationale: כְּ dengan infinitif membentuk keterangan waktu, ‘ketika/setelah mereka selesai’. Dalam konteks ini objeknya telah dituntaskan atau dihabisi, sehingga ‘setelah menghabisi’ menyampaikan urutan naratif secara ringkas dan alami.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ לְמַשְׁחִית
  choice: mereka saling membantu untuk membinasakan satu sama lain
  rationale: Ungkapan distributif ‘masing-masing terhadap sesamanya’ menyatakan tindakan timbal balik. Terjemahan ini membuat objek tersirat dari לְמַשְׁחִית jelas berdasarkan konteks perang antarkelompok, tanpa menentukan mekanisme yang tidak disebutkan teks.
theological_decisions:
- issue: Bahasa חרם dalam konteks peperangan
  choice: menumpas mereka sebagai sesuatu yang dikhususkan bagi kebinasaan
  alternative: menempatkan mereka di bawah larangan; menumpas mereka sama sekali
  rationale: חרם memuat gagasan pengkhususan yang berujung pada pembinasaan, bukan hanya penghancuran biasa. Teks utama mempertahankan unsur pengkhususan dan hasil akhirnya, sedangkan istilah teknis alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah peperangan dibuat mudah dipahami, sementara nuansa khusus חרם dipertahankan dalam teks dan diterangkan melalui catatan kaki.
