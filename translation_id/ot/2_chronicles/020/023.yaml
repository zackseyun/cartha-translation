revisions:
- from: Lalu orang Amon dan orang Moab bangkit menyerang penduduk Pegunungan Seir untuk menumpas mereka sebagai sesuatu yang dikhususkan bagi kebinasaan[a] dan memusnahkan mereka. Setelah menghabisi penduduk Seir, mereka saling membantu untuk membinasakan satu sama lain.
  to: Lalu orang Amon dan orang Moab bangkit menyerang penduduk Pegunungan Seir untuk menyerahkan mereka kepada kebinasaan[a] dan memusnahkan mereka. Setelah menghabisi penduduk Seir, mereka saling membantu untuk membinasakan satu sama lain.
  rationale: Revisi mengganti rumusan yang tidak alami untuk להחרים dengan “menyerahkan mereka kepada kebinasaan.” Padanan ini mempertahankan perbedaan dari “memusnahkan” (השמיד), sambil menyampaikan bahwa penduduk Seir dikhususkan bagi kehancuran. Unsur lain, urutan peristiwa, nama, dan tindakan saling menghancurkan dipertahankan.
