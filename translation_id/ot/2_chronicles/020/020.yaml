id: 2CH.20.20
reference: 2 Chronicles 20:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: id
  text: Pagi-pagi mereka bangun dan pergi ke padang gurun Tekoa. Ketika mereka berangkat, Yosafat berdiri dan berkata, “Dengarkanlah aku, hai Yehuda dan penduduk Yerusalem! Percayalah kepada Yahweh[a], Allahmu, maka kamu akan diteguhkan[b]. Percayalah kepada nabi-nabi-Nya[c], maka kamu akan berhasil.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yahweh” adalah nama ilahi yang ditulis יהוה (YHWH) dalam teks Ibrani.
    reason: alternative_reading
  - marker: b
    text: Kata-kata Ibrani yang diterjemahkan “percayalah” dan “akan diteguhkan” berasal dari akar yang sama, אמן, sehingga membentuk permainan kata. Bagian ini juga dapat diterjemahkan, “Percayalah kepada Yahweh, Allahmu, maka kamu akan tetap teguh.”
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan, “Percayailah nabi-nabi-Nya” atau “Andalkanlah nabi-nabi-Nya.” Verba Ibrani yang sama dengan “percayalah” pada klausa sebelumnya diulangi untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Pagi-pagi mereka bangun
  rationale: Bentuk Hifil שׁכם bersama בַבֹּקֶר menyatakan bangun atau mulai bertindak pada pagi-pagi sekali. Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: וַיֵּצְאוּ לְמִדְבַּר תְּקוֹעַ
  choice: dan pergi ke padang gurun Tekoa
  rationale: יצא menyatakan gerak keluar atau berangkat, sedangkan מִדְבָּר menunjuk wilayah liar/kering, tidak harus gurun pasir. 'Padang gurun Tekoa' merupakan padanan geografis yang jelas dan lazim.
- source_word: וּבְצֵאתָם
  choice: Ketika mereka berangkat
  rationale: Preposisi dengan infinitif konstruk dan sufiks membentuk klausa waktu. 'Ketika mereka berangkat' menyampaikan bahwa Yosafat berbicara pada saat rombongan mulai keluar.
- source_word: עָמַד יְהוֹשָׁפָט
  choice: Yosafat berdiri
  rationale: Padanan langsung bagi verba naratif עמד tanpa menambahkan kesan dramatis yang tidak dinyatakan sumber.
- source_word: שְׁמָעוּנִי
  choice: Dengarkanlah aku
  rationale: Imperatif שמע dengan sufiks objek berarti mendengarkan si pembicara. Partikel '-lah' sesuai dengan seruan publik yang tegas namun wajar.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלַם
  choice: hai Yehuda dan penduduk Yerusalem
  rationale: '''Yehuda'' dipakai secara kolektif bagi rakyat negeri itu, sedangkan partisip יֹשְׁבֵי berarti para penghuni atau penduduk. ''Hai'' menandai sapaan langsung.'
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: Percayalah kepada Yahweh, Allahmu
  rationale: Hifil אמן dengan preposisi ב menyatakan percaya atau menaruh kepercayaan kepada. 'Percayalah kepada' alami dalam bahasa Indonesia dan memungkinkan kaitan leksikal dengan וְתֵאָמֵנוּ tetap dijelaskan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: וְתֵאָמֵנוּ
  choice: maka kamu akan diteguhkan
  rationale: Nifal אמן menyatakan dijadikan teguh, berdiri kukuh, atau terbukti mantap. 'Diteguhkan' mempertahankan bentuk pasif dan hubungan akar katanya dengan perintah 'percayalah'.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: Percayalah kepada nabi-nabi-Nya
  rationale: Verba yang sama, אמן, diulang dengan ב untuk menghasilkan kesejajaran retoris. Bentuk jamak 'nabi-nabi-Nya' mengikuti נְבִיאָיו.
- source_word: וְהַצְלִיחוּ
  choice: maka kamu akan berhasil
  rationale: Hifil צלח dalam konteks ini menyatakan mengalami keberhasilan atau memperoleh hasil yang baik. 'Berhasil' tidak mempersempitnya menjadi kemakmuran materi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian YHWH. Transliterasi 'Yahweh' mempertahankan statusnya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna dan permainan kata akar אמן
  choice: Percayalah ... akan diteguhkan
  alternative: Percayalah ... akan tetap teguh; atau Percayakanlah dirimu ... kamu akan berdiri kukuh
  rationale: Sumber dengan sengaja memasangkan bentuk Hifil הַאֲמִינוּ dengan Nifal וְתֵאָמֵנוּ. Terjemahan utama mempertahankan seruan untuk percaya dan nuansa keteguhan pada hasilnya tanpa menjadikannya rumusan doktrinal yang lebih kemudian.
- issue: Objek kepercayaan pada klausa tentang para nabi
  choice: Percayalah kepada nabi-nabi-Nya
  alternative: Percayailah nabi-nabi-Nya; atau Percayakanlah dirimu kepada nabi-nabi-Nya
  rationale: Konstruksi אמן dengan ב dapat menonjolkan percaya, memercayai, atau mengandalkan. Pilihan utama menjaga pengulangan retoris dengan klausa tentang Yahweh tanpa menyamakan para nabi dengan Allah secara teologis; mereka tampil sebagai pembawa firman-Nya dalam konteks ini.
- issue: Hasil yang dijanjikan oleh וְהַצְלִיחוּ
  choice: maka kamu akan berhasil
  alternative: maka perjalananmu akan berhasil; atau maka kamu akan memperoleh keberhasilan
  rationale: Verba tidak menyebut secara eksplisit bidang keberhasilannya. Terjemahan dibiarkan umum agar ambiguitas cakupannya tetap terpelihara dan tidak dibatasi pada kemenangan militer atau kemakmuran materi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat digunakan dengan susunan yang mudah dipahami dalam pembacaan umum. Bentuk sapaan 'hai Yehuda' mempertahankan corak pidato publik. Pronomina 'kamu' dipahami secara kolektif karena Yosafat sedang menyapa Yehuda dan penduduk Yerusalem; 'Allahmu' mengikuti ragam Alkitab Indonesia yang wajar untuk kepunyaan kolektif. Nama 'Yosafat' dan 'Tekoa' mengikuti ejaan Indonesia yang lazim.
