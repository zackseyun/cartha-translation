id: 2CH.20.35
reference: 2 Chronicles 20:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: id
  text: Sesudah itu Yosafat, raja Yehuda, bersekutu dengan Ahazia, raja Israel; ia bertindak jahat dalam apa yang dilakukannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “ia” paling dekat merujuk kepada Ahazia. Namun, susunan Ibraninya juga dapat dipahami sebagai merujuk kepada Yosafat dan tindakannya bersekutu dengan Ahazia. Bagian terakhir secara lebih harfiah berbunyi, “ia bertindak jahat untuk melakukan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Menandai urutan waktu sesudah peristiwa-peristiwa sebelumnya dengan ungkapan Indonesia yang alami dan ringkas.
- source_word: אֶתְחַבַּר
  choice: bersekutu dengan
  rationale: Bentuk Hitpael dari חבר menyatakan bahwa Yosafat mengikatkan diri dalam suatu hubungan atau persekutuan; konteks kerajaan mendukung nuansa persekutuan politis.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Yosafat, raja Yehuda
  rationale: Nama dan gelar kerajaan diterjemahkan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: dengan Ahazia, raja Israel
  rationale: Mempertahankan preposisi dan gelar aposisional sumber dalam susunan Indonesia yang wajar.
- source_word: הוּא
  choice: ia
  rationale: Kata ganti mandiri dipertahankan sebagai kata ganti dan tidak diubah menjadi klausa relatif, sehingga kemungkinan rujukannya tidak ditutup secara diam-diam.
- source_word: הִרְשִׁיעַ
  choice: bertindak jahat
  rationale: Bentuk Hiphil dari רשע di sini menyatakan perilaku yang jahat atau bersalah secara moral; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: לַ/עֲשׂוֹת
  choice: dalam apa yang dilakukannya
  rationale: Infinitif Ibrani ini sangat ringkas, secara harfiah 'untuk melakukan/berbuat'. Terjemahan ini menyampaikan bahwa kejahatan tampak dalam tindakannya tanpa menentukan objek yang tidak disebutkan oleh teks.
theological_decisions:
- issue: Rujukan kata ganti הוּא
  choice: Teks utama memakai kata ganti “ia” dan mempertahankan kemungkinan rujukannya; secara sintaksis, Ahazia adalah anteseden terdekat.
  alternative: Memahami kata ganti itu sebagai Yosafat dan menilai tindakannya bersekutu dengan Ahazia sebagai tindakan jahat.
  rationale: Ahazia merupakan nama yang paling dekat sebelum kata ganti, sehingga ia kemungkinan besar rujukannya. Namun, bentuk Ibrani tidak memakai klausa relatif yang secara mutlak menutup kemungkinan rujukan kepada Yosafat; konteks lanjutan juga mengecam Yosafat karena bersekutu dengan Ahazia. Karena itu, ambiguitas yang nyata dipertahankan dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik koma mempertahankan peralihan klausa Ibrani serta membiarkan kata ganti “ia” tetap ambigu sebagaimana teks sumber.
