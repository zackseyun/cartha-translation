source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: id
  text: Ketika mereka mulai menyanyi dan memuji, Yahweh mengadakan penyergapan[a] terhadap bani Amon, Moab, dan orang-orang dari Gunung Seir yang datang menyerang Yehuda[b]. Mereka pun dikalahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menempatkan para penyergap” atau “menempatkan orang-orang untuk menyergap.” Bentuk Ibraninya dapat menunjuk pada orang-orang yang bersembunyi untuk menyergap maupun pada penyergapan itu sendiri.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang datang ke Yehuda.” Dalam konteks ini, kedatangan mereka bersifat menyerang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: Ketika mereka mulai
  rationale: Mengungkapkan hubungan waktu secara alami dalam bahasa Indonesia sambil mempertahankan bahwa tindakan Yahweh terjadi tepat saat pujian dimulai.
- source_word: בְרִנָּה וּתְהִלָּה
  choice: menyanyi dan memuji
  rationale: רִנָּה dapat menunjuk pada nyanyian atau seruan sukacita, sedangkan תְּהִלָּה berarti pujian. Bentuk verbal ini alami dalam bahasa Indonesia dan sesuai dengan konteks ibadah.
- source_word: נָתַן יְהוָה מְאָרְבִים
  choice: Yahweh mengadakan penyergapan
  rationale: נָתַן secara harfiah berarti 'memberikan/menempatkan', sedangkan מְאָרְבִים dapat menunjuk pada penyergap atau tindakan penyergapan. Ungkapan ini mempertahankan tindakan ilahi tanpa menentukan identitas para pelakunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks Ibrani.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: bani Amon, Moab, dan orang-orang dari Pegunungan Seir
  rationale: Bani Amon merupakan padanan lazim bagi 'anak-anak Amon'; Moab dipertahankan sebagai sebutan bangsa, dan 'Gunung Seir' dipahami secara metonimis sebagai penduduk atau pasukan dari wilayah itu.
- source_word: הַבָּאִים לִיהוּדָה
  choice: yang datang menyerang Yehuda
  rationale: Preposisi ל secara dasar menyatakan arah menuju Yehuda, tetapi konteks penyerbuan menunjukkan maksud bermusuhan. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: וַיִּנָּגֵפוּ
  choice: Mereka pun terpukul kalah
  rationale: Mempertahankan bentuk pasif dan daya ungkap נָגַף, yang dapat berarti dipukul atau dikalahkan, tanpa merinci cara kekalahan itu terjadi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Pelaku penyergapan
  choice: Tidak diidentifikasi secara khusus
  alternative: para penyergap atau orang-orang yang bersembunyi untuk menyergap
  rationale: Teks menyatakan bahwa Yahweh mengadakan atau menempatkan מְאָרְבִים, tetapi tidak dengan jelas mengidentifikasi siapa mereka. Terjemahan utama tidak menambahkan identitas yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar penutup pasif tetap jelas dan alami. Istilah “bani Amon” dipertahankan karena lazim dalam ragam Alkitabiah Indonesia, sedangkan hubungan Gunung Seir dengan para penyerang dinyatakan secara alami sebagai “orang-orang dari Pegunungan Seir”.
