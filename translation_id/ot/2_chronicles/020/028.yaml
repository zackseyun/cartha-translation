  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: id
  text: Lalu mereka datang ke Yerusalem dengan harpa[a], kecapi, dan terompet, lalu pergi ke Bait Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kecapi”; bentuk persis alat musik petik kuno yang disebut נְבָלִים tidak diketahui dengan pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah Yahweh.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu mereka datang
  rationale: Bentuk wayyiqtol melanjutkan rangkaian kisah. 'Lalu' menyatakan urutan peristiwa secara alami, sedangkan 'datang' mempertahankan arti umum verba בוא tanpa mempersempitnya menjadi 'masuk'.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: בִּנְבָלִים
  choice: dengan gambus[a]
  rationale: נבל menunjuk kepada alat musik petik kuno, mungkin sejenis harpa atau gambus. 'Gambus' membedakannya dari כִּנּוֹר dalam daftar ini, sementara ketidakpastian bentuk instrumennya dicatat dalam catatan kaki.
- source_word: וּבְכִנֹּרוֹת
  choice: kecapi
  rationale: כִּנּוֹר adalah alat musik petik yang lazim dipadankan dengan lyre. 'Kecapi' merupakan padanan Indonesia yang mudah dipahami dan tetap dibedakan dari נבל.
- source_word: וּבַחֲצֹצְרוֹת
  choice: dan nafiri
  rationale: חֲצֹצְרָה menunjuk kepada terompet upacara yang digunakan dalam ibadah. 'Nafiri' tepat dalam register Alkitab Indonesia; unsur 'perak' tidak ditambahkan karena tidak dinyatakan dalam ayat ini.
- source_word: אֶל בֵּית יְהוָה
  choice: menuju rumah Yahweh[b]
  rationale: אֶל menyatakan arah atau tujuan, sehingga 'menuju' alami setelah kedatangan ke Yerusalem. 'Rumah Yahweh' mempertahankan ungkapan Ibrani secara formal; padanan kontekstual 'Bait Yahweh' dicatat sebagai alternatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Makna בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: Bait Yahweh
  rationale: Terjemahan utama mempertahankan metafora harfiah 'rumah', sedangkan 'Bait' menyatakan rujukan bangunannya secara lebih eksplisit. Alternatif dicatat tanpa menghapus nuansa ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Istilah musik dibuat berbeda untuk mencerminkan tiga kata Ibrani yang berbeda. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
