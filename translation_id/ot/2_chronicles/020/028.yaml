revisions:
- from: Lalu mereka datang ke Yerusalem dengan gambus[a], kecapi, dan nafiri, menuju rumah Yahweh[b].
  to: Lalu mereka datang ke Yerusalem dengan harpa[a], kecapi, dan terompet, lalu pergi ke Bait Yahweh[b].
  rationale: Revisi mengganti istilah instrumen yang terlalu spesifik atau kurang netral dengan padanan Indonesia modern yang setia pada ketidakpastian leksikal sumber. Frasa tujuan diperjelas agar alami dalam bahasa Indonesia. “Lalu pergi” hanya mengekspresikan gerak menuju Bait Yahweh yang tersirat oleh אֶל בֵּית יְהוָה setelah kedatangan di Yerusalem; tidak menambah peristiwa substantif. Catatan kaki dipasang langsung pada unsur yang dijelaskan dan mempertahankan ketidakpastian instrumen serta bentuk harfiah ungkapan untuk tempat ibadah.
