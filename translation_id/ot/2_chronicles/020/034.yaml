  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יְהוֹשָׁפָ֔ט הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים בְּ/דִבְרֵי֙ יֵה֣וּא בֶן חֲנָ֔נִי אֲשֶׁ֣ר הֹֽעֲלָ֔ה עַל סֵ֖פֶר מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: id
  text: Selebihnya dari riwayat Yosafat, baik yang terdahulu maupun yang kemudian, sesungguhnya semuanya tertulis dalam catatan Yehu anak Hanani,[a] yang dimuat dalam Kitab Raja-Raja Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam riwayat Yehu anak Hanani”; secara harfiah, “dalam perkataan/hal-hal dari Yehu anak Hanani.”
    reason: lexical_alternative
  - marker: b
    text: Klausa Ibraninya secara harfiah berbunyi, “yang ia bawa naik ke atas Kitab Raja-Raja Israel.” Maksudnya kemungkinan besar ialah bahwa catatan Yehu dimasukkan atau dimuat dalam sumber kerajaan yang lebih besar itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Selebihnya dari riwayat Yosafat
  rationale: Dalam rumus penutup pemerintahan seorang raja, דִּבְרֵי mencakup perbuatan, kejadian, dan urusan pemerintahannya. “Riwayat” menyampaikan cakupan tersebut secara alami tanpa membatasinya pada perkataan.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: baik yang terdahulu maupun yang kemudian
  rationale: Ungkapan ini mencakup seluruh rentang riwayat Yosafat dan tetap mempertahankan pasangan istilah Ibrani, tanpa mengubahnya menjadi penjelasan yang lebih sempit.
- source_word: הִנָּם כְּתוּבִים
  choice: sesungguhnya semuanya tertulis
  rationale: “Sesungguhnya” mempertahankan daya penunjuk dan penegasan הִנָּם dalam bahasa Indonesia yang wajar; “semuanya” memperjelas bahwa acuannya ialah seluruh riwayat yang baru disebut.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: dalam catatan Yehu anak Hanani
  rationale: Dalam konteks penyebutan sumber tertulis, דִּבְרֵי paling wajar berarti “catatan”, meskipun secara harfiah dapat berarti “perkataan” atau secara lebih luas “hal-hal”.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: yang dimuat dalam Kitab Raja-Raja Israel
  rationale: Klausa Ibrani ini sulit dan secara harfiah memakai verba kausatif “membawa/menaikkan ke atas”. Dalam konteks sumber pustaka, “dimuat dalam” menyampaikan kemungkinan utama bahwa catatan Yehu dimasukkan ke dalam sumber kerajaan yang lebih besar, sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
