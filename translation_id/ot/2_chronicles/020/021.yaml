  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: id
  text: Setelah berunding dengan rakyat, ia menugaskan para penyanyi untuk Yahweh, yang memuji keagungan kekudusan[a] ketika mereka maju di depan pasukan pelopor[b] dan berkata, “Bersyukurlah kepada Yahweh, sebab kasih setia-Nya tetap untuk selama-lamanya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keindahan kekudusan” atau “kemegahan kudus.” Frasa Ibrani ini memungkinkan lebih dari satu pemahaman.
    reason: lexical_alternative
  - marker: b
    text: Atau “di depan pasukan yang maju” atau “di depan barisan depan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “sebab belas kasih-Nya tetap untuk selama-lamanya.” Kata Ibrani חֶסֶד mencakup kasih yang teguh, kesetiaan, dan belas kasih.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל־הָעָם
  choice: Setelah berunding dengan rakyat
  rationale: Bentuk Niphal dari יעץ menyatakan tindakan meminta atau bertukar nasihat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keterlibatan rakyat dalam perundingan.
- source_word: וַיַּעֲמֵד
  choice: ia menugaskan
  rationale: Bentuk Hifil dari עמד dapat berarti membuat berdiri, menempatkan, atau menunjuk. Dalam konteks pemberian peran kepada para penyanyi, 'menugaskan' menyampaikan fungsi administratifnya dengan jelas.
- source_word: מְשֹׁרֲרִים לַיהוָה
  choice: para penyanyi bagi Yahweh
  rationale: מְשֹׁרֲרִים menunjuk secara khusus kepada para penyanyi, sedangkan ל dapat menandai bahwa pelayanan mereka diperuntukkan bagi Yahweh.
- source_word: וּמְהַלְלִים לְהַדְרַת־קֹדֶשׁ
  choice: yang memuji semarak kekudusan
  rationale: Partisipel מְהַלְלִים dipahami sebagai keterangan bagi para penyanyi. Frasa הַדְרַת־קֹדֶשׁ secara harfiah menghubungkan semarak atau keindahan dengan kekudusan; terjemahan ini tidak menentukan secara berlebihan apakah yang dimaksud ialah sifat kekudusan, kemegahan kudus, atau busana kudus.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: sambil berjalan di depan pasukan terdepan
  rationale: Infinitif dengan ב menandai tindakan yang berlangsung bersamaan, dan הֶחָלוּץ menunjuk kepada pasukan yang maju di bagian depan, bukan seluruh tentara.
- source_word: הוֹדוּ לַיהוָה
  choice: Bersyukurlah kepada Yahweh
  rationale: Dalam konteks ibadah, bentuk Hifil dari ידה lazim berarti mengucap syukur atau memuji. Klausa alasan sesudahnya mendukung pilihan 'bersyukurlah'.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: sebab kasih setia-Nya tetap untuk selama-lamanya
  rationale: חֶסֶד mencakup kasih yang teguh, kesetiaan, dan belas kasih, sering dalam hubungan perjanjian. 'Kasih setia' merupakan padanan Indonesia yang ringkas dan luas; 'tetap' melengkapi klausa Ibrani yang tidak memiliki verba tersurat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar, sedangkan 'TUHAN' tetap merupakan alternatif tradisional dalam bahasa Indonesia.
- issue: Cakupan makna חֶסֶד
  choice: kasih setia
  alternative: belas kasih; kasih yang teguh; kesetiaan perjanjian
  rationale: Pilihan ini mempertahankan perpaduan kasih dan keteguhan relasional tanpa membatasi kata tersebut hanya pada belas kasihan atau menjadikan gagasan perjanjian lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-liturgis yang bermartabat. Struktur kalimat dibuat lancar bagi pembaca umum sambil mempertahankan urutan tindakan, nama ilahi, serta ketaksaan utama dalam frasa הַדְרַת־קֹדֶשׁ dan kata חֶסֶד.
