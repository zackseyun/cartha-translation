  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: id
  text: Ia mengikuti jalan Asa, ayahnya, dan tidak menyimpang darinya, dengan melakukan apa yang benar di mata Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Ia hidup mengikuti jalan
  rationale: Ungkapan harfiah 'berjalan di jalan' secara metaforis menunjuk pada pola hidup atau perilaku. Terjemahan ini mempertahankan citra 'jalan' sambil terdengar alami dalam bahasa Indonesia modern.
- source_word: אָבִיו אָסָא
  choice: Asa, ayahnya
  rationale: Susunan ini secara alami mengidentifikasi Asa sebagai ayah Yosafat dan mempertahankan hubungan kekeluargaan yang dinyatakan teks.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: dan tidak menyimpang darinya
  rationale: Kata סוּר dengan מִן menyatakan berpaling atau menyimpang dari sesuatu. Pilihan ini melanjutkan metafora jalan, sedangkan '-nya' merujuk pada jalan Asa.
- source_word: לַעֲשׂוֹת
  choice: Ia melakukan
  rationale: Infinitif dengan ל dapat menyatakan tindakan yang mencirikan atau menjelaskan perilaku sebelumnya. Kalimat baru menghasilkan bahasa Indonesia yang jelas tanpa mengubah hubungan maknanya.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Dalam rumusan penilaian terhadap raja, יָשָׁר menunjuk pada hal yang benar atau lurus secara moral.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan ini mempertahankan idiom Ibrani mengenai penilaian ilahi, dan nama diri יְהוָה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan לַעֲשׂוֹת dengan klausa sebelumnya
  choice: 'Dipahami sebagai tindakan yang menjelaskan corak hidupnya: ''Ia melakukan apa yang benar'''
  alternative: 'Diterjemahkan sebagai tujuan atau hasil: ''untuk melakukan apa yang benar'''
  rationale: Konstruksi ini dapat bernuansa tujuan, hasil, atau penjelasan cara hidup. Bentuk kalimat mandiri mempertahankan isi evaluatif tanpa memaksakan pembedaan semantis yang terlalu tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'jalan' dipertahankan, tetapi verba 'hidup mengikuti' dipakai agar makna perilakunya jelas bagi pembaca umum.
