  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: id
  text: Yosafat memerintah sebagai raja atas Yehuda. Ia berumur tiga puluh lima tahun ketika mulai memerintah, dan ia memerintah selama dua puluh lima tahun di Yerusalem. Nama ibunya ialah Azuba, anak perempuan Silhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: memerintah
  rationale: Bentuk wayyiqtol dari מלך membuka catatan pemerintahan raja; 'memerintah' alami dalam bahasa Indonesia dan tidak mendahului keterangan berikutnya tentang awal pemerintahannya.
- source_word: עַל
  choice: atas
  rationale: Bersama מלך, עַל menandai wilayah atau rakyat yang diperintah; 'atas Yehuda' mempertahankan relasi sintaksis teks Ibrani dengan jelas.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: berumur tiga puluh lima tahun
  rationale: Ungkapan harfiah 'anak tiga puluh lima tahun' adalah rumus usia Ibrani; padanan Indonesia yang wajar ialah 'berumur tiga puluh lima tahun'.
- source_word: בְּמָלְכוֹ
  choice: ketika mulai memerintah
  rationale: Preposisi ב dengan infinitif konstruk dan sufiks menyatakan waktu naik takhta atau awal pemerintahan.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: ia memerintah selama dua puluh lima tahun
  rationale: '''Selama'' memperjelas bahwa frasa bilangan menyatakan durasi pemerintahan tanpa mengubah maknanya.'
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Preposisi ב menandai tempat kedudukan pemerintahannya; bentuk nama 'Yerusalem' sudah baku dalam bahasa Indonesia.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Susunan ini mempertahankan rumus identifikasi Ibrani dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang wajar bagi pembaca Indonesia.
- source_word: בַּת שִׁלְחִי
  choice: anak perempuan Silhi
  rationale: בַּת menyatakan hubungan anak dengan ayah; bentuk eksplisit 'anak perempuan' jelas dan sesuai konteks silsilah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nuansa catatan kerajaan yang bermartabat. Pengulangan 'memerintah' dipertahankan karena mencerminkan struktur rumus pemerintahan dalam teks Ibrani. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau teologis penting dalam ayat ini.
