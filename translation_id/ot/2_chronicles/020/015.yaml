  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: id
  text: 'Lalu ia berkata, “Dengarkanlah, seluruh Yehuda, penduduk Yerusalem, dan Raja Yosafat! Beginilah firman Yahweh kepada kalian: ‘Jangan takut dan jangan gentar menghadapi pasukan besar ini, sebab pertempuran ini bukan milik kalian, melainkan milik Allah.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Subjek laki-laki tunggal dipertahankan sebagai ‘ia’ karena namanya tersedia dari konteks sebelumnya, bukan dalam ayat ini.
- source_word: הַקְשִׁיבוּ
  choice: Dengarkanlah
  rationale: Imperatif jamak ini menuntut perhatian sungguh-sungguh; ‘Dengarkanlah’ alami, jelas, dan mempertahankan daya perintahnya.
- source_word: כָל יְהוּדָה
  choice: seluruh Yehuda
  rationale: Ungkapan kolektif geografis dan kebangsaan dipertahankan secara ringkas tanpa menambahkan kata ‘rakyat’ yang tidak tersurat.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: penduduk Yerusalem
  rationale: Partisip tersebut menunjuk kepada orang-orang yang tinggal di Yerusalem; ‘penduduk’ merupakan padanan Indonesia modern yang wajar.
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: dan Raja Yosafat
  rationale: Urutan gelar dan nama dialihkan secara alami sebagai sapaan langsung kepada raja bersama rakyat.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan formula utusan kenabian dengan ragam bahasa Indonesia yang dikenal, formal, dan berwibawa.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Jangan takut dan jangan gentar
  rationale: Dua larangan yang berbeda dipertahankan dan dihubungkan secara aditif. ‘Gentar’ menyampaikan keadaan mental yang ciut atau kehilangan keberanian dalam konteks ancaman perang.
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: menghadapi pasukan besar ini
  rationale: מִפְּנֵי menyatakan ancaman yang dihadapi, sedangkan הָמוֹן dalam konteks ini adalah kumpulan besar yang datang berperang; ‘pasukan besar’ lebih alami daripada ‘kerumunan besar’ tanpa melampaui konteks.
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: sebab pertempuran ini bukan milik kalian, melainkan milik Allah
  rationale: Konstruksi datif menyatakan kepemilikan atau tanggung jawab. ‘Melainkan’ menyampaikan kontras dari כי kedua, sementara pengulangan ‘milik’ menghasilkan kalimat Indonesia yang jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; bentuk ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Pernyataan bahwa pertempuran adalah milik Allah
  choice: pertempuran ini bukan milik kalian, melainkan milik Allah
  alternative: kalian tidak perlu bertempur, karena Allah yang akan bertempur
  rationale: Pilihan utama mempertahankan konstruksi kepemilikan dan ketegangan teks. Alternatif akan menambahkan kesimpulan tentang tindakan masing-masing pihak yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘kalian’ dipakai karena sapaan Ibrani berbentuk jamak dan ditujukan kepada seluruh kelompok. Dua larangan dipertahankan secara terpisah. Tidak ada catatan kaki karena tidak ada alternatif tekstual atau ambiguitas yang memerlukan penjelasan publikasi dalam ayat ini.
