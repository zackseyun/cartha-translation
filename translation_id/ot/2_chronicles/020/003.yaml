base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: id
  text: Yosafat menjadi takut[a]. Ia pun bertekad[b] untuk mencari Yahweh dan menyerukan puasa di seluruh Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan "merasa takut" atau "takut". Bentuk kata kerja Ibrani dalam rangkaian cerita dapat menandai mulai timbulnya rasa takut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "menetapkan wajahnya untuk mencari Yahweh", sebuah ungkapan Ibrani yang menyatakan niat atau tekad yang sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: menjadi takut
  rationale: Bentuk naratif dari ירא menyatakan rasa takut dan dalam rangkaian ini wajar dipahami sebagai timbulnya rasa takut; pilihan ini mempertahankan dinamika peristiwa tanpa memperhalusnya menjadi sekadar kekhawatiran.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: bertekad
  rationale: Idiom harfiahnya berarti 'menetapkan wajahnya' dan menyatakan niat yang sengaja serta teguh. 'Bertekad' menyampaikan fungsi idiom itu secara alami dalam bahasa Indonesia modern.
- source_word: לִדְרוֹשׁ
  choice: mencari
  rationale: דרש ketika berobjek Allah mencakup tindakan berpaling kepada-Nya untuk pertolongan atau petunjuk. 'Mencari' mempertahankan cakupan makna yang lebih luas daripada 'meminta petunjuk'.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', selaras dengan bentuk nama diri dalam teks sumber.
- source_word: וַיִּקְרָא צוֹם
  choice: menyerukan puasa
  rationale: Gabungan kata ini menunjuk pada pengumuman atau penetapan puasa secara terbuka. 'Menyerukan puasa' alami dan mempertahankan sifat publik tindakan raja.
- source_word: עַל כָּל יְהוּדָה
  choice: di seluruh Yehuda
  rationale: Preposisi עַל di sini menyatakan lingkup pemberlakuan seruan itu atas seluruh Yehuda; ungkapan Indonesia ini jelas mencakup wilayah beserta masyarakatnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian secara langsung tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar alami. Nama יהושפט ditulis 'Yosafat' dan יהודה 'Yehuda' menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
