  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: id
  text: Lalu orang-orang Lewi dari keturunan Kehat dan keturunan Korah bangkit untuk memuji Yahweh, Allah Israel, dengan suara yang sangat nyaring.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dapat dipahami, “dengan suara nyaring ke atas.” Dalam konteks ini, ungkapan Ibrani tersebut kemungkinan besar menegaskan bahwa suara pujian mereka sangat nyaring.
    reason: Menjelaskan idiom Ibrani לְמָעְלָה dan mempertahankan kemungkinan nuansa spasial dari ungkapan harfiahnya.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: bangkit
  rationale: Bentuk wayyiqtol dari קום menyatakan tindakan berdiri atau bangkit. “Bangkit” alami dalam narasi dan mempertahankan tindakan fisik serta publik mereka.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok suku serta pelayan ibadah ini; bentuk jamaknya dinyatakan secara wajar dalam bahasa Indonesia.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: dari keturunan Kehat
  rationale: Ungkapan harfiah “dari anak-anak orang Kehat” berfungsi sebagai penanda garis keturunan atau kaum. “Keturunan Kehat” menyampaikan maknanya secara alami tanpa mengaburkan hubungan kekerabatan.
- source_word: וּמִן בְּנֵי הַקָּרְחִים
  choice: dan keturunan Korah
  rationale: Diterjemahkan sejajar dengan frasa sebelumnya dan mempertahankan Korah sebagai leluhur kelompok tersebut.
- source_word: לְהַלֵּל
  choice: untuk memuji
  rationale: Infinitif dengan לְ menyatakan tujuan. Kata kerja הלל berarti memuji; “bernyanyi” tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama ilahi dalam teks sumber tetap tampil sebagai nama diri.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini secara alami menjadi “Allah Israel” dan berfungsi sebagai aposisi bagi Yahweh.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: dengan suara yang sangat nyaring
  rationale: בְּקוֹל גָּדוֹל menyatakan volume suara, sedangkan לְמָעְלָה pada konteks ini paling mungkin memperkuat intensitasnya. “Sangat nyaring” mengungkapkan idiom itu dengan jelas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Apakah tindakan memuji harus diterjemahkan sebagai nyanyian
  choice: memuji
  alternative: menyanyikan pujian
  rationale: הלל menyatakan pujian, tetapi ayat ini tidak memakai kata kerja khusus untuk bernyanyi. Terjemahan tidak mempersempit cara pujian itu dilakukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang-orang Lewi” serta “keturunan” dipilih agar mudah dipahami pembaca umum, sedangkan susunan kalimat tetap dekat dengan urutan dan tekanan teks Ibrani.
