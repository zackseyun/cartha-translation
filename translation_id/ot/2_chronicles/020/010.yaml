source:
  edition: WLC
  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: id
  text: 'Dan sekarang, lihatlah: orang Amon, orang Moab, dan orang-orang dari Pegunungan Seir[a], yang tidak Kauizinkan Israel menyerang ketika Israel datang dari tanah Mesir—sebab Israel menjauh dari mereka dan tidak memusnahkan mereka—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bani Amon, Moab, dan Gunung Seir.” Dalam konteks ini rangkaian tersebut menunjuk orang Amon, orang Moab, dan orang-orang dari daerah Pegunungan Seir.
    reason: Ungkapan Ibrani memadukan sebutan etnis dengan nama geografis; teks utama menyatakan rujukan kelompok manusia secara alami tanpa menghilangkan bentuk harfiah dalam catatan kaki.
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: Sekarang, lihatlah
  rationale: Mengungkapkan peralihan kepada keadaan kini sekaligus daya penunjuk dan penegasan הִנֵּה dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: bani Amon, Moab, dan penduduk Pegunungan Seir
  rationale: בְנֵי עַמּוֹן adalah sebutan etnis yang lazim diterjemahkan 'bani Amon'; dalam rangkaian ini Moab menunjuk orang Moab, sedangkan 'penduduk' disuplai bagi Pegunungan Seir agar ketiga unsur secara alami menunjuk kelompok-kelompok yang sama-sama menjadi objek keluhan.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: mereka yang tidak Kauizinkan untuk diserang Israel
  rationale: Ungkapan harfiahnya, 'tidak Kauberikan kepada Israel untuk masuk terhadap mereka,' dalam konteks perjalanan Israel bermakna bahwa Allah tidak mengizinkan tindakan militer terhadap mereka. Bentuk pasif menjaga kemungkinan tata hubungan Israel sebagai pelaku serangan tanpa menghasilkan susunan Indonesia yang janggal.
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: ketika Israel datang dari tanah Mesir
  rationale: Subjek pronominal dijelaskan sebagai Israel untuk mencegah rujukan ambigu dalam bahasa Indonesia; bentuk temporalnya diterjemahkan secara langsung.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: Sebaliknya, Israel menjauh dari mereka
  rationale: כִּי di sini memperkenalkan penjelasan tindakan Israel yang menaati larangan tersebut. 'Menjauh' menyampaikan perubahan arah dan penghindaran, bukan sekadar sikap batin.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: dan tidak memusnahkan mereka
  rationale: Hifil שׁמד dalam konteks perang menyatakan pembinasaan tuntas; 'memusnahkan' mempertahankan kekuatan maknanya.
theological_decisions:
- issue: Sapaan langsung kepada Allah dalam klausa larangan
  choice: tidak Kauizinkan
  alternative: TUHAN tidak mengizinkan
  rationale: Teks Ibrani memakai orang kedua tunggal dalam doa langsung. Bentuk 'Kau-' mempertahankan kedekatan sapaan tanpa menambahkan nama ilahi yang tidak terdapat dalam ayat.
- issue: Makna tindakan yang tidak diizinkan terhadap bangsa-bangsa tersebut
  choice: untuk diserang Israel
  alternative: untuk dimasuki Israel / untuk didatangi Israel
  rationale: Konteks naratif dan frasa 'tidak memusnahkan mereka' menunjukkan tindakan militer, tetapi catatan kaki mempertahankan bentuk harfiah dan memungkinkan pembaca melihat sifat interpretatif pilihan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa yang khidmat. 'Lihatlah' mempertahankan penegasan retoris; 'Kauizinkan' menjaga sapaan langsung kepada Allah. Tanda pisah akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
