base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: id
  text: Dan seluruh Yehuda berdiri di hadapan Yahweh, bahkan anak-anak kecil mereka, istri-istri mereka, dan anak-anak mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak-anak lelaki mereka.” Kata Ibrani yang dipakai dapat secara khusus berarti anak lelaki atau secara lebih luas berarti anak-anak, tergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Dan seluruh
  rationale: וְ menghubungkan ayat ini dengan narasi sebelumnya, sedangkan כָל menyatakan keseluruhan kelompok.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama wilayah/suku ini dipakai secara kolektif untuk rakyat Yehuda; bentuk ringkas ini mempertahankan cara pengungkapan Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: עֹמְדִים
  choice: berdiri
  rationale: Partisip Ibrani menggambarkan keadaan atau sikap yang sedang berlangsung. Kata 'berdiri' dalam konteks ini cukup alami tanpa harus menambahkan penanda aspek.
- source_word: לִ/פְנֵי
  choice: di hadapan
  rationale: Ungkapan ini menunjukkan keberadaan dalam hadirat seseorang dan sesuai dengan suasana perhimpunan yang khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: גַּם
  choice: bahkan
  rationale: גַּם menegaskan bahwa anggota keluarga yang disebut berikutnya juga turut hadir; 'bahkan' mempertahankan penekanan tersebut.
- source_word: טַפָּם
  choice: anak-anak kecil mereka
  rationale: טַף menunjuk pada anak-anak kecil yang masih bergantung pada keluarga, tanpa harus dibatasi hanya pada bayi.
- source_word: נְשֵׁי/הֶם
  choice: istri-istri mereka
  rationale: Dalam daftar rumah tangga dengan bentuk posesif ini, נָשִׁים paling alami dipahami sebagai para istri.
- source_word: וּ/בְנֵי/הֶם
  choice: dan anak-anak mereka
  rationale: בָּנִים dapat berarti 'anak-anak lelaki' secara khusus atau 'anak-anak/keturunan' secara lebih luas. Terjemahan utama memakai bentuk yang luas, sementara kemungkinan yang lebih khusus dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Cakupan gender בְּנֵיהֶם
  choice: anak-anak mereka
  alternative: anak-anak lelaki mereka
  rationale: Bentuk בָּנִים dapat dipakai secara khusus untuk anak lelaki maupun secara lebih luas untuk anak atau keturunan. Konteks daftar keluarga memungkinkan arti luas, tetapi arti khusus tetap merupakan alternatif leksikal yang nyata dan karena itu dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar keluarga dipertahankan dekat dengan teks Ibrani. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar memiliki alternatif leksikal.
