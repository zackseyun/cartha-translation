id: 2CH.20.17
reference: 2 Chronicles 20:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: id
  text: Kalian tidak perlu berperang dalam pertempuran ini. Ambillah posisi kalian, berdirilah teguh, dan lihatlah keselamatan dari Yahweh yang menyertai kalian,[a] hai Yehuda dan Yerusalem. Jangan takut dan jangan gentar. Besok, majulah menghadapi mereka, dan Yahweh menyertai kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pembebasan dari Yahweh.” Kata Ibrani yang dipakai dapat menunjuk pada pertolongan dari bahaya atau kemenangan dalam pertempuran, maupun keselamatan dalam arti yang lebih luas.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Yahweh akan menyertai kalian.” Klausa Ibrani ini tidak memiliki verba eksplisit sehingga dapat dipahami sebagai jaminan untuk saat ini maupun untuk pertempuran yang akan datang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: Kalian tidak perlu berperang dalam pertempuran ini
  rationale: Ungkapan harfiahnya, ‘bukan bagi kalian untuk berperang dalam hal ini,’ menyatakan bahwa mereka tidak dituntut bertempur; bentuk ini alami dalam bahasa Indonesia tanpa mengubah maksud konteksnya.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: Ambillah posisi kalian, berdirilah teguh
  rationale: 'Dua imperatif dipertahankan: yang pertama memerintahkan mereka menempatkan diri, sedangkan yang kedua menekankan agar mereka tetap berdiri dengan teguh.'
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה עִמָּכֶם
  choice: dan lihatlah keselamatan dari Yahweh yang menyertai kalian
  rationale: ‘Keselamatan’ mempertahankan keluasan makna יְשׁוּעָה, termasuk pembebasan dalam pertempuran. Susunan ini juga mempertahankan hubungan erat antara tindakan penyelamatan Yahweh dan kehadiran-Nya bersama umat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’ dan tidak diganti dengan gelar.
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: hai Yehuda dan Yerusalem
  rationale: ‘Hai’ menandai sapaan langsung secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Jangan takut dan jangan gentar
  rationale: Kedua larangan dipertahankan; ‘gentar’ menyampaikan keadaan batin yang terpukul atau kehilangan keberanian.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: Besok, majulah menghadapi mereka
  rationale: Dalam konteks militer, keluar ‘ke hadapan mereka’ berarti maju untuk berhadapan dengan pasukan lawan.
- source_word: וַיהוָה עִמָּכֶם
  choice: dan Yahweh menyertai kalian
  rationale: Klausa Ibrani tidak memiliki verba eksplisit. Bentuk kini menyatakan kehadiran dan dukungan Yahweh tanpa meniadakan penerapannya pada pertempuran esok hari.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan makna יְשׁוּעָה
  choice: keselamatan
  alternative: pembebasan
  rationale: Dalam konteks ini kata tersebut menunjuk pada penyelamatan dari musuh, tetapi ‘keselamatan’ tetap mempertahankan cakupan semantis dan gema teologisnya yang lebih luas.
- issue: Waktu dalam klausa nominal וַיהוָה עִמָּכֶם
  choice: Yahweh menyertai kalian
  alternative: Yahweh akan menyertai kalian
  rationale: Karena bahasa Ibrani tidak menyatakan verba atau waktu secara eksplisit, terjemahan utama memakai bentuk kini, sementara kemungkinan nuansa mendatang dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kalian’, imperatif yang jelas, dan nada luhur tetapi tetap mudah dipahami. Paralelisme perintah Ibrani dipertahankan, sedangkan ungkapan militer dibuat alami tanpa menambahkan rincian yang tidak ada dalam teks.
