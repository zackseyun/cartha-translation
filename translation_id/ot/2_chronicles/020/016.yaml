id: 2CH.20.16
reference: 2 Chronicles 20:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מָחָר֙ רְד֣וּ עֲלֵי/הֶ֔ם הִנָּ֥/ם עֹלִ֖ים בְּ/מַעֲלֵ֣ה הַ/צִּ֑יץ וּ/מְצָאתֶ֤ם אֹתָ/ם֙ בְּ/ס֣וֹף הַ/נַּ֔חַל פְּנֵ֖י מִדְבַּ֥ר יְרוּאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: id
  text: Besok, turunlah menghadapi mereka. Lihat, mereka sedang naik melalui jalur pendakian Ziz. Kalian akan menemukan mereka di ujung wadi[a], di depan padang belantara Yeruel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembah sempit” atau “alur sungai musiman”; kata Ibrani נַחַל dapat menunjuk pada lembah atau alur air yang hanya berair pada musim tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: Besok
  rationale: Adverbia waktu ini secara langsung menyatakan waktu pelaksanaan perintah tanpa menambahkan keterangan 'pagi' yang tidak terdapat dalam teks Ibrani.
- source_word: רְדוּ עֲלֵיהֶם
  choice: turunlah menghadapi mereka
  rationale: Bentuk imperatif jamak רְדוּ mempertahankan gerak menurun, sedangkan עֲלֵיהֶם dalam konteks militer menunjukkan gerak yang bermusuhan. 'Menghadapi' menyampaikan hal itu tanpa secara berlebihan menyatakan bahwa mereka harus langsung menyerang.
- source_word: הִנָּם
  choice: Lihat
  rationale: Partikel penunjuk ini menarik perhatian pada informasi berikutnya. 'Lihat' alami dalam bahasa Indonesia modern dan tidak bernada arkais.
- source_word: עֹלִים
  choice: mereka sedang naik
  rationale: Partisipel עלה menggambarkan gerak naik yang sedang berlangsung atau segera berlangsung; bentuk progresif Indonesia mempertahankan nuansa tersebut.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: melalui jalur pendakian Ziz
  rationale: מַעֲלֶה menunjuk pada tanjakan atau jalan yang menanjak. 'Jalur pendakian' mempertahankan ciri topografis, sedangkan Ziz dipertahankan sebagai nama tempat.
- source_word: וּמְצָאתֶם אֹתָם
  choice: Kalian akan menemukan mereka
  rationale: Bentuk orang kedua jamak dinyatakan dengan 'kalian', dan verba diterjemahkan secara langsung sebagai hasil yang akan terjadi sesudah perintah dilaksanakan.
- source_word: בְּסוֹף הַנַּחַל
  choice: di ujung wadi
  rationale: סוֹף berarti ujung atau batas akhir. נַחַל dapat menunjuk pada lembah sempit atau alur air musiman; 'wadi' mempertahankan ciri geografis khas wilayah tersebut.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: di depan padang belantara Yeruel
  rationale: פְּנֵי dipakai secara spasial untuk lokasi di depan suatu kawasan. מִדְבָּר lebih luas daripada gurun pasir dan cocok diterjemahkan 'padang belantara'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk 'kalian' dipakai untuk memperjelas bahwa sapaan Ibrani berbentuk jamak. Istilah geografis 'wadi' dipertahankan dan dijelaskan dalam catatan kaki.
