  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: id
  text: Kemudian semua laki-laki dari Yehuda dan Yerusalem kembali, dengan Yosafat di depan mereka, untuk pulang ke Yerusalem dengan sukacita, sebab Yahweh telah membuat mereka bersukacita atas musuh-musuh mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: pulang ke Yerusalem
  rationale: Kedua bentuk dari akar שׁוב menegaskan gerak kembali. Dalam bahasa Indonesia, mengulangnya secara harfiah akan terasa janggal; 'pulang ke Yerusalem' menyampaikan gerak kembali ke tempat asal secara alami.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלַם
  choice: semua laki-laki dari Yehuda dan Yerusalem
  rationale: אִישׁ berbentuk maskulin tunggal yang dipakai secara distributif dengan daya kolektif. 'Semua laki-laki' mempertahankan rujukan gender sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: dipimpin oleh Yosafat
  rationale: Ungkapan בְּרֹאשָׁם secara idiomatis menunjukkan bahwa Yosafat berada di depan dan memimpin mereka; bentuk ini alami dan jelas bagi pembaca modern.
- source_word: בְּשִׂמְחָה
  choice: dengan sukacita
  rationale: Mempertahankan bentuk nomina שִׂמְחָה dan register yang bermartabat serta lazim dalam bahasa Alkitab Indonesia.
- source_word: כִּי שִׂמְּחָם
  choice: sebab ... telah membuat mereka bersukacita
  rationale: 'כִּי memperkenalkan alasan, sedangkan bentuk piel שִׂמְּחָם menyatakan kausatif: Yahweh menyebabkan mereka bersukacita.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מֵאֹיְבֵיהֶם
  choice: atas musuh-musuh mereka
  rationale: מן sesudah verba bersukacita dapat menandai hal yang menjadi dasar atau sasaran sukacita; dalam konteks kemenangan, 'atas' menyampaikan sukacita karena musuh telah dikalahkan tanpa mengubahnya menjadi gagasan pembebasan semata.
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan gender dalam כָּל אִישׁ
  choice: semua laki-laki
  alternative: semua orang
  rationale: Kata אִישׁ secara eksplisit maskulin dan dipakai distributif bagi kelompok tersebut; terjemahan mempertahankan penandaan gender yang ada dalam sumber.
- issue: Relasi sukacita dengan para musuh dalam מֵאֹיְבֵיהֶם
  choice: bersukacita atas musuh-musuh mereka
  alternative: bersukacita karena terbebas dari musuh-musuh mereka
  rationale: Pilihan ini mempertahankan keluasan fungsi preposisi מן dan konteks kemenangan tanpa menambahkan secara eksplisit gagasan 'terbebas' yang tidak dinyatakan oleh frasa itu sendiri.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dirapikan agar alami: keterangan kepemimpinan ditempatkan setelah gerak pulang, sementara hubungan sebab-akibat dan pengulangan leksikal antara ''sukacita'' dan ''bersukacita'' dipertahankan.'
