  rationale: Revisi memulihkan dua unsur kembali dari akar שוב melalui “kembali” dan “pulang,” serta menerjemahkan בְּרֹאשָׁם lebih dekat sebagai “di depan mereka.” Makna, register, nama-nama, dan istilah teologis lainnya dipertahankan.
