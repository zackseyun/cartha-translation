  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: id
  text: Lihatlah, mereka membalas kami dengan datang untuk mengusir kami dari milik-Mu[a] yang telah Kauberikan kepada kami sebagai warisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari warisan-Mu yang telah Kaubuat kami warisi.”'
    reason: Alternatif ini mempertahankan kemungkinan bahwa יְרֻשָּׁה berarti “warisan” dan mencerminkan hubungan katanya dengan bentuk kausatif ירשׁ dalam klausa berikutnya.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Ungkapan ini membuka seruan yang tegas dan menarik perhatian pada keadaan yang sedang dihadapi; “Lihatlah” alami dalam bahasa Indonesia modern sekaligus mempertahankan daya retorisnya.
- source_word: הֵם
  choice: mereka
  rationale: Kata ganti mandiri dipertahankan karena memberi penekanan pada pihak yang sedang dikeluhkan oleh Yosafat.
- source_word: גֹּמְלִים עָלֵינוּ
  choice: membalas kami
  rationale: Dalam konteks ini גמל menyatakan balasan atas tindakan sebelumnya. Pilihan ini mempertahankan ironi bahwa bangsa-bangsa yang dahulu dibiarkan Israel kini membalasnya dengan permusuhan.
- source_word: לָבוֹא
  choice: dengan datang
  rationale: Infinitif ini menyatakan cara mereka membalas Israel dan diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: לְגָרְשֵׁנוּ
  choice: untuk mengusir kami
  rationale: גרש berarti menghalau atau mengeluarkan secara paksa; “mengusir” jelas dan sesuai dengan konteks militer serta penguasaan tanah.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: dari milik-Mu
  rationale: Kata benda ini dapat berarti milik atau warisan. “Milik-Mu” menegaskan bahwa tanah itu pada dasarnya kepunyaan Allah, sedangkan klausa berikutnya menyatakan bahwa tanah tersebut dianugerahkan kepada Israel sebagai warisan.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: yang telah Kauberikan kepada kami sebagai warisan
  rationale: Bentuk kausatif dari ירשׁ berarti membuat seseorang memiliki atau mewarisi. Terjemahan ini jelas bagi pembaca modern dan mempertahankan bahwa kepemilikan Israel berasal dari pemberian Allah.
theological_decisions:
- issue: Kepemilikan Allah dan warisan Israel atas tanah itu
  choice: dari milik-Mu yang telah Kauberikan kepada kami sebagai warisan
  alternative: dari warisan-Mu yang telah Kaubuat kami warisi
  rationale: Teks Ibrani memungkinkan istilah pertama dipahami sebagai “milik” atau “warisan”. Teks utama membedakan kepemilikan Allah dari warisan yang diberikan-Nya kepada Israel, sedangkan catatan kaki mempertahankan kemungkinan pengulangan istilah warisan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk “Kauberikan” mengikuti ejaan baku untuk kata ganti ilahi terikat. Seruan “Lihatlah” mempertahankan penekanan teks tanpa memakai ungkapan yang terasa usang.
