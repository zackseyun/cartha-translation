  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: id
  text: Bukankah Engkau, ya Allah kami, telah menghalau penduduk negeri ini dari hadapan umat-Mu Israel dan memberikannya untuk selama-lamanya kepada keturunan Abraham yang mengasihi-Mu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sahabat-Mu.”
    reason: Menampilkan pemaknaan relasional yang lazim bagi אֹהַבְךָ, sementara teks utama mempertahankan arti verbalnya yang lebih langsung.
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya; “Bukankah” menyampaikan daya retoris itu secara alami dalam bahasa Indonesia.
- source_word: אֱלֹהֵינוּ
  choice: ya Allah kami
  rationale: Frasa ini merupakan sapaan langsung dalam doa. Partikel “ya” memperjelas fungsi vokatif tanpa mengubah makna posesifnya.
- source_word: הוֹרַשְׁתָּ
  choice: telah menghalau
  rationale: Bentuk kausatif dari ירשׁ di sini berarti membuat para penghuni sebelumnya kehilangan tempat atau kepemilikan mereka. “Menghalau” mempertahankan unsur pengusiran dan terasa wajar dalam bahasa Indonesia.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: penduduk negeri ini
  rationale: Secara harfiah berarti orang-orang yang mendiami negeri atau tanah ini. “Penduduk negeri ini” jelas, ringkas, dan alami.
- source_word: מִלִּפְנֵי
  choice: dari hadapan
  rationale: Ungkapan ini menggambarkan penyingkiran para penduduk dari hadapan Israel ketika Israel maju. Bentuk ini mempertahankan gambaran spasial teks Ibrani.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: Mempertahankan sebutan perjanjian dan nama Israel sebagai penjelas langsung.
- source_word: וַתִּתְּנָהּ
  choice: dan memberikannya
  rationale: Kata ganti objek feminin merujuk kepada negeri itu. Bentuk ini menghubungkan tindakan tersebut secara alami dengan “telah menghalau” dalam pertanyaan retoris.
- source_word: לְזֶרַע אַבְרָהָם
  choice: kepada keturunan Abraham
  rationale: זֶרַע adalah nomina kolektif yang menunjuk kepada keturunan Abraham. “Keturunan” mempertahankan makna kolektif dan mudah dipahami pembaca modern.
- source_word: אֹהַבְךָ
  choice: orang yang mengasihi-Mu
  rationale: Partisip aktif ini secara langsung berarti orang yang mengasihi Allah. Terjemahan ini mempertahankan arah tindakan kasih dalam teks Ibrani, sedangkan makna relasional “sahabat-Mu” dicatat sebagai alternatif.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan pemberian negeri tersebut. Penempatannya sebelum penerima dalam bahasa Indonesia memperjelas bahwa frasa ini menerangkan tindakan memberi.
theological_decisions:
- issue: Sebutan bagi Abraham dalam אֹהַבְךָ
  choice: orang yang mengasihi-Mu
  alternative: sahabat-Mu
  rationale: Bentuk Ibrani secara gramatikal menampilkan Abraham sebagai pihak yang mengasihi Allah. “Sahabat-Mu” mencerminkan pemaknaan relasional yang dikenal dalam kesaksian Alkitab lainnya, tetapi dapat mengaburkan arah verbal ungkapan ini. Karena itu, terjemahan yang lebih langsung dipakai dalam teks utama dan alternatif relasional dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat untuk konteks doa. “Ya Allah kami” menandai sapaan langsung; “dari hadapan” sengaja mempertahankan citra teks sumber meskipun sedikit lebih formal daripada percakapan sehari-hari.
