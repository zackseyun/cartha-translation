  terminology: “Allah kami,” “umat-Mu Israel,” “keturunan Abraham,” dan “untuk selama-lamanya” sesuai serta konsisten dengan istilah Alkitab bahasa Indonesia. Catatan kaki “sahabat-Mu” dengan tepat menyajikan pemaknaan relasional sebagai alternatif tanpa menggantikannya dalam teks utama.
