source:
  edition: WLC
  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: id
  text: Ya Allah kami, tidakkah Engkau akan menghakimi mereka? Sebab kami tidak berdaya menghadapi kumpulan besar ini yang datang menyerang kami. Kami tidak tahu apa yang harus kami lakukan, tetapi mata kami tertuju kepada-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: sebab kepada-Mulah mata kami tertuju.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: Ya Allah kami
  rationale: Bentuk ini merupakan sapaan langsung dalam doa. Partikel “Ya” wajar dalam bahasa Indonesia dan menandai vokatif tanpa mengubah isi seruan.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: tidakkah Engkau akan menghakimi mereka?
  rationale: Kata שׁפט menggambarkan tindakan Allah sebagai hakim terhadap bangsa-bangsa yang memusuhi umat-Nya. “Menghakimi” mempertahankan cakupan yudisialnya dan tidak mempersempitnya menjadi sekadar “menghukum”.
- source_word: כִּי אֵין בָּנוּ כֹּחַ
  choice: Sebab kami tidak berdaya
  rationale: כֹּחַ dapat berarti kekuatan, kuasa, atau kemampuan. “Tidak berdaya” menyampaikan ketidakmampuan total dalam keadaan militer ini secara alami dan ringkas.
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: menghadapi kumpulan besar ini
  rationale: לִפְנֵי secara harfiah berarti “di hadapan,” tetapi dalam konteks ancaman berarti menghadapi. הָמוֹן adalah kumpulan atau khalayak yang besar; “kumpulan” tidak menambahkan kekhususan “pasukan” yang tidak terkandung langsung dalam nomina itu.
- source_word: הַבָּא עָלֵינוּ
  choice: yang datang menyerang kami
  rationale: Partisipel menandai ancaman yang sedang mendekat, sedangkan עַל dalam konteks ini bersifat bermusuhan. “Datang menyerang” menyampaikan keduanya dengan jelas.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: Kami tidak tahu apa yang harus kami lakukan
  rationale: Terjemahan ini mempertahankan pengakuan sederhana dan mendesak tentang ketidaktahuan serta ketidakberdayaan mereka.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: tetapi mata kami tertuju kepada-Mu
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa mata mereka tertuju kepada Allah, sebuah metafora tentang ketergantungan dan pengharapan. “Tetapi” memperjelas kontras pragmatis dengan pengakuan sebelumnya, sementara catatan kaki mempertahankan nilai penghubung כִּי yang lebih formal.
theological_decisions:
- issue: Hubungan klausa terakhir yang diawali כִּי dengan pengakuan “kami tidak tahu”
  choice: 'Mengungkapkan kontras secara alami: “tetapi mata kami tertuju kepada-Mu”'
  alternative: “sebab kepada-Mulah mata kami tertuju”
  rationale: כִּי biasanya dapat berarti “sebab/karena,” tetapi di sini klausa terakhir menjadi puncak peralihan dari ketidakberdayaan kepada ketergantungan kepada Allah. Terjemahan utama menyatakan fungsi wacananya, sedangkan catatan kaki menjaga bentuk hubungan yang lebih harfiah dan ambiguitas penghubungnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat tetapi mudah dipahami. Kapitalisasi pronomina untuk Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Metafora “mata kami tertuju” dipertahankan karena alami dan penting bagi gambaran ketergantungan penuh kepada Allah.
