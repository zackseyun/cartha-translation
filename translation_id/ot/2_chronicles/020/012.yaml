  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan semua unsur utama Ibrani: sapaan kepada Allah, permohonan agar Ia menghakimi para penyerang, pengakuan bahwa umat tidak mempunyai daya menghadapi kelompok besar yang datang melawan mereka, ketidaktahuan tentang tindakan yang harus diambil, dan pengharapan yang diarahkan kepada Allah. “Tidak berdaya menghadapi” menyampaikan אֵין בָּנוּ כֹּחַ לִפְנֵי secara idiomatis tanpa kehilangan makna.'
