  to: Lalu Yosafat dan rakyatnya datang untuk mengambil jarahan mereka. Mereka menemukan di antara mereka banyak sekali harta benda, mayat[a], dan barang-barang berharga. Mereka mengambil bagi diri mereka sendiri lebih banyak daripada yang sanggup mereka bawa. Selama tiga hari mereka mengambil jarahan itu, karena jumlahnya begitu banyak.
