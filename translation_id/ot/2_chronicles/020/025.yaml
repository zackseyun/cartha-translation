  text: וַ/יָּבֹ֨א יְהוֹשָׁפָ֣ט וְ/עַמּ/וֹ֮ לָ/בֹ֣ז אֶת שְׁלָלָ/ם֒ וַ/יִּמְצְאוּ֩ בָ/הֶ֨ם לָ/רֹ֜ב וּ/רְכ֤וּשׁ וּ/פְגָרִים֙ וּ/כְלֵ֣י חֲמֻד֔וֹת וַ/יְנַצְּל֥וּ לָ/הֶ֖ם לְ/אֵ֣ין מַשָּׂ֑א וַ/יִּֽהְי֞וּ יָמִ֧ים שְׁלוֹשָׁ֛ה בֹּזְזִ֥ים אֶת הַ/שָּׁלָ֖ל כִּ֥י רַב הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: id
  text: Lalu Yosafat dan rakyatnya datang untuk mengambil jarahan mereka. Mereka menemukan di antara mereka banyak sekali harta benda, mayat[a], dan barang-barang berharga. Mereka mengambil bagi diri mereka sendiri lebih banyak daripada yang sanggup mereka bawa. Selama tiga hari mereka mengambil jarahan itu, karena jumlahnya begitu banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani Masoret berbunyi “mayat.” Sejumlah saksi dan terjemahan kuno mencerminkan bacaan seperti “pakaian” atau tidak memuat kata ini, mungkin untuk memperlancar daftar tersebut. Dalam Teks Masoret, kata ini kemungkinan menunjuk pada jenazah musuh yang gugur, di antara mereka jarahan itu ditemukan.
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: untuk merampas jarahan mereka
  rationale: Infinitif menyatakan tujuan kedatangan mereka, sedangkan שָׁלָל menunjuk pada jarahan perang milik pasukan yang kalah.
- source_word: בָהֶם
  choice: di antara mereka
  rationale: Ungkapan ini secara wajar menunjuk pada pasukan musuh yang telah tewas, yakni tempat atau lingkungan tempat barang-barang itu ditemukan.
- source_word: לָרֹב
  choice: banyak sekali
  rationale: Frasa adverbial ini menekankan kelimpahan dan diterjemahkan secara alami dalam bahasa Indonesia modern.
- source_word: רְכוּשׁ
  choice: harta benda
  rationale: Kata ini mencakup milik atau barang bergerak secara umum; 'harta benda' sesuai dengan konteks daftar jarahan.
- source_word: פְגָרִים
  choice: mayat
  rationale: Teks Masoret secara jelas memakai kata yang lazim berarti mayat atau bangkai; dalam konteks pertempuran, 'mayat' adalah padanan paling langsung dan wajar.
- source_word: כְלֵי חֲמֻדוֹת
  choice: barang-barang berharga
  rationale: Frasa ini menunjuk secara luas pada benda-benda yang bernilai atau diinginkan tanpa harus dibatasi pada bejana.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: mereka mengambil bagi diri mereka sendiri
  rationale: Piel נצל di sini menyatakan pengambilan atau pelucutan jarahan, dan לָהֶם menunjukkan manfaat bagi mereka sendiri. Terjemahan ini alami tanpa menghilangkan unsur tersebut.
- source_word: לְאֵין מַשָּׂא
  choice: lebih banyak daripada yang sanggup mereka bawa
  rationale: Ungkapan harfiahnya berkaitan dengan tidak adanya kemampuan memikul; terjemahan idiomatis ini menyampaikan bahwa jumlah jarahan melampaui daya angkut mereka.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: Selama tiga hari mereka merampas
  rationale: Konstruksi ini menyatakan tindakan berkelanjutan selama tiga hari.
- source_word: כִּי רַב הוּא
  choice: karena jumlahnya begitu banyak
  rationale: Klausa ini menjelaskan lamanya penjarahan berdasarkan besarnya jumlah jarahan.
