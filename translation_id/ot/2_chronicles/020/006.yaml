reference: 2 Chronicles 20:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: id
  text: Lalu ia berkata, “Ya Yahweh, Allah nenek moyang kami[a], bukankah Engkau Allah di surga dan berkuasa atas segala kerajaan bangsa-bangsa? Di tangan-Mu ada kuasa dan keperkasaan, dan tidak seorang pun dapat bertahan melawan Engkau.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah bapa-bapa kami”; dapat juga diterjemahkan “Allah leluhur kami.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak seorang pun sanggup melawan Engkau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. Kata ganti orang ketiga disertakan agar kalimat Indonesia tidak terasa terpenggal ketika ayat dibaca tersendiri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Allah nenek moyang kami
  rationale: Ungkapan ini menyatakan hubungan Allah dengan para pendahulu Israel. “Nenek moyang” merupakan padanan Indonesia modern yang alami; bentuk Ibrani yang secara harfiah maskulin dijelaskan dalam catatan kaki.
- source_word: הֲלֹא
  choice: bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban afirmatif.
- source_word: אֱלֹהִים בַּשָּׁמַיִם
  choice: Allah di surga
  rationale: Terjemahan ringkas ini mempertahankan penegasan bahwa Yahweh adalah Allah dalam ranah surgawi tanpa menambahkan penafsiran.
- source_word: מוֹשֵׁל
  choice: berkuasa
  rationale: Partisip ini menunjuk pada pemerintahan yang terus berlangsung. “Berkuasa” alami dalam konteks kedaulatan atas kerajaan-kerajaan.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: kerajaan bangsa-bangsa
  rationale: 'Padanan ini mempertahankan kedua unsur frasa Ibrani: kerajaan-kerajaan dan bangsa-bangsa.'
- source_word: וּבְיָדְךָ
  choice: Di tangan-Mu
  rationale: Citra tangan sebagai tempat kuasa efektif dipertahankan, bukan diubah menjadi ungkapan abstrak.
- source_word: כֹּחַ וּגְבוּרָה
  choice: kuasa dan keperkasaan
  rationale: Pasangan ini menyampaikan kemampuan dan kekuatan yang unggul dengan bobot retoris yang sesuai.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: tidak seorang pun dapat bertahan melawan Engkau
  rationale: Dalam konteks ini, verba tersebut menggambarkan mengambil posisi untuk melawan. “Bertahan melawan” mempertahankan gambaran perlawanan dan tetap jelas bagi pembaca modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama perjanjian ilahi.
- issue: Bahasa kekerabatan dalam אֲבֹתֵינוּ
  choice: nenek moyang kami, dengan catatan harfiah
  alternative: bapa-bapa kami; leluhur kami
  rationale: Nomina Ibrani berbentuk maskulin dan secara harfiah berarti “bapa-bapa kami”, tetapi dalam frasa ini merujuk kepada generasi pendahulu. Terjemahan utama memakai ungkapan Indonesia yang alami, sementara bentuk harfiahnya dipertahankan dalam catatan.
- issue: Cakupan pertanyaan retoris
  choice: satu pertanyaan yang mencakup keberadaan Allah di surga dan pemerintahan-Nya atas kerajaan-kerajaan
  alternative: dua pertanyaan retoris terpisah
  rationale: Partikel tanya הֲלֹא muncul satu kali, lalu klausa berikutnya dihubungkan dengan וְ. Terjemahan mempertahankan koordinasi itu tanpa menambahkan partikel tanya kedua.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai kapital penghormatan. Susunan pertanyaan dibuat alami tanpa menghilangkan cakupan retoris teks Ibrani; metafora “di tangan-Mu” tetap dipertahankan.
