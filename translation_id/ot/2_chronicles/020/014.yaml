  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: id
  text: Lalu Yahaziel anak Zakharia, anak Benaya, anak Yeiel, anak Matanya, orang Lewi dari keturunan Asaf—Roh Yahweh datang atasnya di tengah-tengah jemaah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: Lalu ... Yahaziel
  rationale: Konjungsi waw diterjemahkan sebagai penghubung naratif “Lalu”. Nama pribadi ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: anak Zakharia, anak Benaya, anak Yeiel, anak Matanya
  rationale: Pengulangan בֶּן dipertahankan agar urutan silsilah yang dinyatakan secara eksplisit dalam bahasa Ibrani tidak diringkas menjadi sekadar “keturunan”.
- source_word: הַלֵּוִי
  choice: orang Lewi
  rationale: Bahasa Indonesia tidak memiliki kata sandang tertentu yang langsung sepadan dengan הַ. Dalam aposisi ini, “orang Lewi” secara alami mengidentifikasi Yahaziel sebagai anggota suku Lewi.
- source_word: מִן בְּנֵי אָסָף
  choice: dari keturunan Asaf
  rationale: Ungkapan ini menyatakan asal-usul atau keanggotaan kelompok. “Keturunan Asaf” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “anak-anak Asaf” dan tetap mempertahankan rujukan korporatnya.
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: Roh Yahweh hinggap pada Yahaziel
  rationale: Dalam konteks ini, ungkapan tersebut menggambarkan kehadiran Roh Allah yang datang atas Yahaziel untuk menyampaikan nubuat. “Hinggap pada” adalah idiom Indonesia yang ringkas dan lazim untuk kedatangan Roh, tanpa menambahkan tindakan yang tidak disebutkan teks. Nama Yahaziel diulangi alih-alih memakai “dia” agar kalimat silsilah yang panjang tetap jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar “TUHAN”.
- source_word: בְּתוֹךְ הַקָּהָל
  choice: di tengah-tengah jemaah itu
  rationale: “Di tengah-tengah” mempertahankan nuansa ruang dari בְּתוֹךְ, sedangkan “jemaah itu” merujuk pada kumpulan umat yang sudah hadir dalam konteks.
theological_decisions:
- issue: Rujukan רוּחַ יְהוָה
  choice: Roh Yahweh
  alternative: roh Yahweh
  rationale: Konteksnya menunjukkan Roh ilahi yang datang atas Yahaziel untuk perkataan nubuat, bukan sekadar dorongan batin atau watak manusia. Huruf kapital menandai rujukan tersebut tanpa memperluas isi teks.
- issue: Nuansa הָיְתָה עָלָיו
  choice: hinggap pada
  alternative: ada pada
  rationale: Bentuk Ibrani dapat dibaca secara lebih statis sebagai “ada pada”, tetapi dalam alur narasi ungkapan itu paling wajar menyatakan datangnya Roh atas Yahaziel. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur silsilah sengaja dipertahankan, tetapi susunan kalimat diatur agar subjek teologis dan peristiwa utama segera jelas bagi pembaca umum.
