    rationale: Draf mendahulukan Roh sebelum silsilah, sedangkan sumber terlebih dahulu memperkenalkan Yahaziel secara lengkap. Mengikuti urutan sumber meningkatkan keterlacakan tanpa mengorbankan kelancaran.
  - severity: low
