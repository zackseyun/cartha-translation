source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יְהוֹשָׁפָ֗ט בִּ/קְהַ֧ל יְהוּדָ֛ה וִ/ירוּשָׁלִַ֖ם בְּ/בֵ֣ית יְהוָ֑ה לִ/פְנֵ֖י הֶ/חָצֵ֥ר הַ/חֲדָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: id
  text: Lalu Yosafat berdiri di tengah jemaah Yehuda dan Yerusalem, di rumah Yahweh, di depan pelataran baru[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: halaman baru.'
    reason: Alternatif leksikal untuk חָצֵר; baik “pelataran” maupun “halaman” dapat menunjuk pada ruang terbuka dalam kompleks rumah ibadah.
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Lalu ... berdiri
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan menyatakan tindakan lampau sederhana. “Berdiri” paling langsung; “lalu” mencerminkan kesinambungan waw tanpa membuat tindakan itu lebih dramatis.
- source_word: בִּקְהַל
  choice: di tengah jemaah
  rationale: קהל menunjuk kepada kumpulan umat yang sedang berhimpun. “Jemaah” wajar dalam konteks ibadah, sedangkan “di tengah” menyampaikan ב secara spasial tanpa mengubahnya menjadi “di hadapan”.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: Yehuda dan Yerusalem
  rationale: Nama-nama ini dipertahankan sebagai sebutan bagi komunitas yang berkumpul, tanpa penambahan penjelasan yang tidak terdapat dalam teks.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani harfiah “rumah Yahweh”. “Bait Yahweh” atau “di dalam bait suci Yahweh” lebih idiomatis dalam sebagian tradisi, tetapi kurang langsung mencerminkan בַּיִת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga sifatnya sebagai nama pribadi dalam teks sumber tetap terlihat.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Dalam konteks tata ruang kompleks rumah ibadah, לִפְנֵי menyatakan posisi; “di depan” merupakan padanan Indonesia yang alami dan jelas.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: pelataran baru
  rationale: חָצֵר menunjuk pada ruang terbuka atau pelataran dalam kompleks rumah ibadah. “Pelataran” jelas dalam bahasa Indonesia modern, dan sifat “baru” dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan tempat dipertahankan mengikuti teks Ibrani. Penanda catatan kaki ditempatkan sesudah frasa “pelataran baru”, yakni unsur yang diterangkan oleh catatan tersebut.
