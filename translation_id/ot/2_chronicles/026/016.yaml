  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: id
  text: Namun, ketika ia menjadi kuat, hatinya menjadi tinggi sehingga berakhir dengan kehancurannya.[a] Ia berlaku tidak setia kepada Yahweh, Allahnya, lalu masuk ke bait Yahweh untuk membakar dupa di atas mezbah dupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hingga ia melakukan hal yang merusak.”'
    reason: Frasa Ibrani עַד לְהַשְׁחִית dapat dipahami sebagai akibat berupa kehancuran atau sebagai tindakan yang merusak.
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: Namun, ketika ia menjadi kuat
  rationale: כְּ pada frasa ini berfungsi secara temporal, sedangkan וּ menghubungkannya secara kontras dengan konteks sebelumnya. Ungkapan ini mempertahankan kaitan antara kekuatan Uzia dan kesombongannya.
- source_word: גָּבַהּ לִבּוֹ
  choice: ia menjadi tinggi hati
  rationale: Secara harfiah, 'hatinya menjadi tinggi'. 'Menjadi tinggi hati' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran serta makna moral teks Ibrani.
- source_word: עַד לְהַשְׁחִית
  choice: hingga mendatangkan kehancuran atas dirinya sendiri
  rationale: Frasa ini dapat menunjukkan akibat yang menghancurkan dari kesombongannya. Bentuk refleksif tersirat dijelaskan secara alami dalam bahasa Indonesia, sementara kemungkinan makna 'hingga bertindak rusak' dicatat dalam catatan kaki.
- source_word: וַיִּמְעַל
  choice: Ia berlaku tidak setia
  rationale: Kata מעל menyatakan pelanggaran kepercayaan atau ketidaksetiaan, khususnya terhadap Allah. 'Berlaku tidak setia' menyampaikan sifat relasional dan perjanjian dari pelanggaran itu.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: kepada Yahweh, Allahnya
  rationale: Dengan kata kerja מעל, preposisi ב menandai pihak yang terhadapnya ketidaksetiaan dilakukan. 'Kepada' lebih alami dalam konstruksi Indonesia 'tidak setia kepada'.
- source_word: הֵיכַל יְהוָה
  choice: bait Yahweh
  rationale: הֵיכָל di sini menunjuk pada bangunan bait atau tempat kudus. 'Bait Yahweh' merupakan istilah Indonesia yang ringkas dan sesuai dengan konteks peribadatan.
- source_word: לְהַקְטִיר
  choice: untuk membakar dupa
  rationale: Bentuk Hifil dari קטר dalam konteks ibadah berarti membakar atau mempersembahkan dupa. 'Membakar dupa' secara langsung menggambarkan tindakannya.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: mezbah dupa
  rationale: Frasa ini menunjuk pada mezbah khusus tempat dupa dibakar. 'Mezbah dupa' alami, jelas, dan dekat dengan susunan Ibraninya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara kesombongan dan kehancuran dalam עַד לְהַשְׁחִית
  choice: kesombongannya mendatangkan kehancuran atas dirinya sendiri
  alternative: ia menjadi tinggi hati hingga bertindak rusak
  rationale: Bentuk infinitif Hifil dapat dipahami sebagai akibat yang menghancurkan atau sebagai tindakan yang rusak. Teks utama mengikuti pembacaan akibat, sesuai alur jatuhnya Uzia, tetapi alternatif yang sah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tinggi hati' dipilih sebagai idiom yang umum dan dekat dengan gambaran Ibrani; 'bait', 'mezbah', dan 'dupa' mempertahankan register peribadatan yang dikenal luas.
