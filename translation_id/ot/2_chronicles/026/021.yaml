  text: וַ/יְהִי֩ עֻזִּיָּ֨הוּ הַ/מֶּ֜לֶךְ מְצֹרָ֣ע עַד י֣וֹם מוֹת֗/וֹ וַ/יֵּ֜שֶׁב בֵּ֤ית ה/חפשות מְצֹרָ֔ע כִּ֥י נִגְזַ֖ר מִ/בֵּ֣ית יְהוָ֑ה וְ/יוֹתָ֤ם בְּנ/וֹ֙ עַל בֵּ֣ית הַ/מֶּ֔לֶךְ שׁוֹפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: id
  text: Raja Uzia menderita penyakit kulit sampai hari kematiannya. Ia tinggal di sebuah rumah terpisah[a] dalam keadaan terkena penyakit kulit, karena ia dipisahkan dari rumah Yahweh[b]. Yotam, anaknya, mengepalai istana raja dan mengadili rakyat negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah kebebasan”. Ungkapan Ibrani ini tidak pasti dan tampaknya menunjuk pada tempat tinggal tersendiri, tempat Uzia hidup terpisah karena kondisinya.
    reason: lexical_alternative
  - marker: b
    text: Atau “terputus dari rumah Yahweh”. “Rumah Yahweh” mengacu pada bait.
    reason: alternative_reading
lexical_decisions:
- source_word: מְצֹרָע
  choice: terkena penyakit kulit
  rationale: Istilah Ibrani menunjuk pada kondisi צָרַעַת menurut kategori kemurnian dunia Alkitab dan tidak identik secara pasti dengan penyakit kusta dalam pengertian medis modern. Pilihan ini menghindari diagnosis yang terlalu sempit.
- source_word: בֵּית הַחפשות
  choice: sebuah rumah terpisah
  rationale: Ungkapan Ibrani ini sulit; secara harfiah dapat dipahami sebagai 'rumah kebebasan', tetapi dalam konteks tampaknya menunjuk pada tempat tinggal tersendiri akibat kondisi Uzia.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: dikucilkan dari rumah Yahweh
  rationale: Bentuk נִגְזַר menyatakan bahwa Uzia dipisahkan atau disingkirkan dari rumah Yahweh. 'Dikucilkan' menyampaikan akibat nyata dan beratnya pemisahan itu dalam bahasa Indonesia alami.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora sumber 'rumah' dan menerjemahkan nama ilahi יהוה sebagai 'Yahweh'; dalam konteks, yang dimaksud ialah bait.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: mengurus istana raja
  rationale: Ungkapan ini menyatakan kewenangan administratif atas rumah atau kompleks kerajaan. 'Mengurus istana raja' alami dalam bahasa Indonesia dan tidak menetapkan jabatan teknis yang tidak disebutkan.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: memerintah rakyat negeri itu
  rationale: Partisip שׁוֹפֵט dapat mencakup tindakan mengadili sekaligus menjalankan pemerintahan. Karena Yotam menjalankan fungsi raja selama Uzia terasing, 'memerintah' menyampaikan cakupan kontekstualnya tanpa membatasinya pada perkara pengadilan.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Terjemahan ini mempertahankan arti umum ungkapan tersebut tanpa menganggapnya sebagai sebutan teknis bagi golongan sosial tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan nama perjanjian itu secara langsung.
- issue: Sifat penyakit Uzia
  choice: penyakit kulit
  alternative: kusta
  rationale: צָרַעַת adalah kategori penyakit atau kenajisan kulit dalam dunia Alkitab dan cakupannya tidak dapat disamakan begitu saja dengan kusta modern. Terjemahan yang lebih luas menjaga ketidakpastian medis teks.
- issue: Makna pemisahan dari rumah Yahweh
  choice: dikucilkan dari rumah Yahweh
  alternative: terputus dari rumah Yahweh
  rationale: Pilihan ini menyatakan bahwa Uzia tidak lagi boleh masuk ke bait tanpa menambahkan penjelasan mengenai status rohaninya di hadapan Allah yang tidak dinyatakan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan hubungan sebab-akibat. Nama עֻזִּיָּהוּ dan יוֹתָם ditulis menurut bentuk Indonesia yang lazim, yaitu Uzia dan Yotam. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskannya.
