revisions:
- from: Raja Uzia tetap terkena penyakit kulit sampai hari kematiannya. Ia tinggal di sebuah rumah terpisah[a] karena ia dikucilkan dari rumah Yahweh[b]. Yotam, anaknya, mengurus istana raja dan memerintah rakyat negeri itu.
  to: Raja Uzia menderita penyakit kulit sampai hari kematiannya. Ia tinggal di sebuah rumah terpisah[a] dalam keadaan terkena penyakit kulit, karena ia dipisahkan dari rumah Yahweh[b]. Yotam, anaknya, mengepalai istana raja dan mengadili rakyat negeri itu.
  rationale: Revisi memulihkan predikat kedua מְצֹרָע, memakai “dipisahkan” sebagai padanan yang lebih langsung bagi נִגְזַר, dan menerjemahkan שֹׁפֵט dengan “mengadili” agar fungsi yang dinyatakan sumber tetap terlihat. Catatan kaki dipertahankan pada frasa yang dijelaskan dan diselaraskan dengan teks revisi.
