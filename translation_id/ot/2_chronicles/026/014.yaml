base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: id
  text: Uzia menyiapkan bagi mereka—bagi seluruh pasukan—perisai, tombak, helm, baju zirah, busur, dan batu-batu untuk umban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "batu-batu umban." Secara harfiah: "batu-batu umban."'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: menyiapkan
  rationale: Bentuk Hifil dari כון menyatakan bahwa Uzia membuat perlengkapan itu siap atau tersedia. “Menyiapkan” mempertahankan tindakan tersebut tanpa menyiratkan bahwa Uzia sendiri membuatnya.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Mempertahankan pronomina Ibrani; frasa berikutnya menjelaskan bahwa acuannya ialah seluruh pasukan.
- source_word: לְכָל הַצָּבָא
  choice: bagi seluruh pasukan
  rationale: צָבָא dalam konteks ini menunjuk kepada angkatan militer. “Seluruh pasukan” alami dalam bahasa Indonesia dan mencerminkan cakupan לְכָל.
- source_word: מָגִנִּים
  choice: perisai
  rationale: Padanan baku dan jelas bagi perlengkapan pertahanan militer ini.
- source_word: רְמָחִים
  choice: tombak
  rationale: Padanan umum bagi רֹמַח dalam daftar perlengkapan militer.
- source_word: כּוֹבָעִים
  choice: ketopong
  rationale: Dalam konteks perlengkapan perang, kata ini menunjuk kepada pelindung kepala; “ketopong” merupakan istilah Indonesia yang tepat dan bermartabat.
- source_word: שִׁרְיֹנוֹת
  choice: baju zirah
  rationale: Istilah ini menunjuk kepada pelindung tubuh. “Baju zirah” jelas dan tidak mempersempit jenis konstruksinya menjadi zirah rantai.
- source_word: קְשָׁתוֹת
  choice: busur
  rationale: Padanan langsung bagi bentuk jamak kata untuk busur sebagai senjata.
- source_word: אַבְנֵי קְלָעִים
  choice: batu-batu umban
  rationale: Mencerminkan susunan harfiah “batu-batu umban” dan tetap mudah dipahami; kemungkinan ungkapan fungsional “batu-batu untuk umban” dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan frasa penjelas “bagi seluruh pasukan” tanpa membuat hubungan sintaksisnya kabur. Deretan perlengkapan disajikan secara lugas sesuai bentuk daftar dalam teks Ibrani.
