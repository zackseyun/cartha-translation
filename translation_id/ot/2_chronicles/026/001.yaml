  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֻזִּיָּ֔הוּ וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣יכוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: id
  text: Seluruh rakyat Yehuda memilih Uzia[a], yang berumur enam belas tahun[b], lalu mengangkatnya menjadi raja menggantikan Amazia, ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengambil Uzia”; dalam konteks ini dapat dipahami sebagai memilih atau menetapkannya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan ia berumur enam belas tahun.” Kata penghubung Ibrani juga dapat dipahami secara konsesif: “meskipun ia baru berumur enam belas tahun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: memilih
  rationale: Secara harfiah berarti “mengambil”, tetapi dalam konteks penobatan, “memilih” menyampaikan dengan wajar tindakan rakyat terhadap Uzia sebelum mereka mengangkatnya menjadi raja. Arti harfiahnya dicatat dalam catatan kaki agar bentuk Ibraninya tetap terlihat.
- source_word: כָּל עַם יְהוּדָה
  choice: seluruh rakyat Yehuda
  rationale: Mewakili secara langsung unsur “seluruh”, “rakyat”, dan “Yehuda”, serta mempertahankan penekanan pada rakyat sebagai kelompok.
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Ini adalah bentuk nama yang terdapat dalam ayat ini; “Uzia” merupakan transliterasi Indonesia yang lazim.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: yang saat itu berumur enam belas tahun
  rationale: Ungkapan Ibrani harfiahnya, “dan ia seorang anak enam belas tahun”, secara idiomatis menyatakan usia. Kata “yang” menghubungkan keterangan itu secara netral tanpa memasukkan nuansa konsesif “meskipun” yang tidak diwajibkan oleh waw.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: lalu mengangkatnya menjadi raja
  rationale: Bentuk kausatif verba מלך berarti membuat seseorang menjadi raja. “Mengangkatnya menjadi raja” alami dalam bahasa Indonesia dan tidak menambahkan upacara penobatan yang tidak disebutkan.
- source_word: תַּחַת
  choice: menggantikan
  rationale: Dalam konteks pergantian takhta, kata ini berarti menduduki tempat seseorang; “menggantikan” menyampaikan suksesi dengan jelas.
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: Amazia, ayahnya
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan nama serta hubungan ayah-anak dalam teks sumber.
theological_decisions:
- issue: Nuansa kata penghubung sebelum keterangan usia Uzia
  choice: yang saat itu berumur enam belas tahun
  alternative: meskipun ia baru berumur enam belas tahun
  rationale: Kata penghubung וְ dapat bersifat penghubung biasa dan tidak dengan sendirinya menandakan pertentangan. Terjemahan netral mempertahankan keterbukaan teks dan menghindari kesan bahwa usianya pasti dipandang sebagai hambatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Seluruh rakyat Yehuda” mempertahankan penekanan kolektif; “mengangkatnya menjadi raja” merupakan ungkapan alami untuk tindakan menjadikan seseorang raja. Susunan keterangan usia dibuat netral agar tidak menambahkan nuansa konsesif yang tidak pasti.
