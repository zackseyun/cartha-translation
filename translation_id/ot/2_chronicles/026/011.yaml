translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat. Istilah militer dibuat jelas tanpa mempersempit jabatan administratif yang tidak dirinci oleh teks. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskan.
