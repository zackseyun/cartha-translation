  text: וַ/יְהִ֣י לְ/עֻזִּיָּ֡הוּ חַיִל֩ עֹשֵׂ֨ה מִלְחָמָ֜ה יוֹצְאֵ֧י צָבָ֣א לִ/גְד֗וּד בְּ/מִסְפַּר֙ פְּקֻדָּתָ֔/ם בְּ/יַד֙ יעואל הַ/סּוֹפֵ֔ר וּ/מַעֲשֵׂיָ֖הוּ הַ/שּׁוֹטֵ֑ר עַ֚ל יַד חֲנַנְיָ֔הוּ מִ/שָּׂרֵ֖י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: id
  text: Uzia mempunyai pasukan yang siap berperang, yang berangkat untuk tugas militer menurut kesatuan-kesatuan, menurut jumlah dalam daftar mereka[a], di bawah pimpinan Yeiel[b], juru tulis itu, dan Maaseya, pejabat itu, serta di bawah pengawasan Hananya, salah seorang panglima raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut jumlah hasil pengerahan mereka.” Istilah Ibrani ini menunjuk pada pendataan atau penghitungan resmi pasukan.
    reason: lexical_alternative
  - marker: b
    text: Nama ini ditulis יעואל dalam teks Ibrani di sini; nama tersebut juga dapat dialihaksarakan sebagai Yeuel.
    reason: textual_or_name_clarification
lexical_decisions:
- source_word: חַיִל עֹשֵׂה מִלְחָמָה
  choice: pasukan yang siap berperang
  rationale: Dalam konteks ini חַיִל berarti kekuatan militer, sedangkan frasa partisipial עֹשֵׂה מִלְחָמָה menggambarkan pasukan yang mampu dan siap menjalankan perang.
- source_word: יוֹצְאֵי צָבָא
  choice: mereka maju bertempur
  rationale: Ungkapan ini menunjuk pada pasukan yang keluar untuk tugas perang; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan gerak menuju pertempuran.
- source_word: לִגְדוּד
  choice: menurut kesatuan-kesatuan mereka
  rationale: גְּדוּד di sini merujuk pada unit-unit militer yang menjadi dasar pengorganisasian pasukan.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: sesuai dengan jumlah yang terdaftar
  rationale: פְּקֻדָּה dalam konteks ini adalah pendataan atau pengerahan resmi tentara, bukan sekadar penghitungan biasa.
- source_word: בְּיַד
  choice: di bawah pimpinan
  rationale: Idiom ini menyatakan pelaksanaan atau pengarahan melalui pejabat yang disebutkan.
- source_word: הַסּוֹפֵר
  choice: sang juru tulis
  rationale: סֹפֵר adalah juru tulis atau sekretaris resmi; 'juru tulis' mempertahankan sebutan jabatan yang transparan.
- source_word: הַשּׁוֹטֵר
  choice: sang pejabat
  rationale: שֹׁטֵר menunjuk pada petugas administratif atau militer. 'Pejabat' mempertahankan keluasan makna karena tugas khususnya tidak dijelaskan.
- source_word: עַל יַד
  choice: di bawah pengawasan
  rationale: Ungkapan ini menunjukkan lapisan pengawasan yang lebih tinggi dalam susunan komando.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: salah seorang panglima raja
  rationale: שַׂר dapat berarti pemimpin, pejabat, atau panglima; konteks pengorganisasian tentara mendukung 'panglima'.
