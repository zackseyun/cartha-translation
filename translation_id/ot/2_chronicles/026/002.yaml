base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/002.yaml
  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: id
  text: Ia membangun Elot dan mengembalikannya kepada Yehuda[a], setelah raja itu tidur bersama para leluhurnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membawanya kembali kepada Yehuda.”'
    reason: lexical_alternative
  - marker: b
    text: “Tidur bersama para leluhurnya” adalah ungkapan Ibrani yang berarti meninggal.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא
  choice: Ia
  rationale: Kata ganti orang ketiga dipertahankan tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: בָּנָה
  choice: membangun
  rationale: Makna langsung verba ini adalah ‘membangun’. Nuansa ‘membangun kembali’ mungkin tersirat oleh konteks, tetapi tidak dinyatakan secara eksplisit.
- source_word: אֵילוֹת
  choice: Elot
  rationale: Nama tempat ini ditransliterasikan menurut bentuk Ibrani Alkitab dan kebiasaan ejaan Indonesia, tanpa menggantinya dengan bentuk nama modern.
- source_word: וַיְשִׁיבֶהָ
  choice: mengembalikannya
  rationale: Bentuk Hifil dari שוב menyatakan tindakan menyebabkan Elot kembali, dalam konteks ini kepada kekuasaan Yehuda. Pilihan ini mempertahankan citra verba sumber tanpa menjabarkan implikasi politiknya di dalam teks utama.
- source_word: לִיהוּדָה
  choice: kepada Yehuda
  rationale: Preposisi ל menandai tujuan atau penerima tindakan pengembalian.
- source_word: אַחֲרֵי שְׁכַב
  choice: setelah ... tidur
  rationale: Ungkapan ini secara harfiah memakai verba ‘berbaring/tidur’ dan dalam formula wafat raja merupakan eufemisme untuk kematian. Teks utama mempertahankan ungkapan Ibraninya, sedangkan catatan kaki menjelaskan maknanya.
- source_word: הַמֶּלֶךְ
  choice: raja itu
  rationale: Bahasa Ibrani menyebut ‘raja’ dengan artikel tertentu, bukan nama pribadi. ‘Raja itu’ wajar dalam bahasa Indonesia dan mempertahankan rujukan kontekstual tersebut.
- source_word: עִם אֲבֹתָיו
  choice: bersama para leluhurnya
  rationale: Dalam formula kematian ini, אָבוֹת menunjuk kepada generasi pendahulu. ‘Para leluhur’ menyampaikan maksudnya secara alami dan bermartabat dalam bahasa Indonesia.
