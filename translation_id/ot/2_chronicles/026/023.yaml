base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: id
  text: Uzia mendapat perhentian bersama leluhurnya. Mereka menguburkan dia bersama leluhurnya di ladang pemakaman milik para raja, sebab kata mereka, “Ia menderita penyakit kulit[a].” Lalu Yotam, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia seorang yang kena kusta.” Istilah Ibrani menunjuk kepada orang yang terkena צָרַעַת, yang mungkin mencakup lebih banyak keadaan daripada kusta modern.
    reason: Menjaga padanan tradisional sambil menjelaskan bahwa istilah kuno itu tidak harus menunjuk secara khusus kepada penyakit Hansen.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan rumus berita kematian seorang raja. Terjemahan ini mempertahankan bahasa halus tentang kematian tanpa memakai bentuk harfiah “tidur bersama,” yang dalam bahasa Indonesia modern mudah disalahpahami.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: mereka menguburkan dia
  rationale: Bentuk Ibrani aktif jamak dengan pelaku yang tidak disebutkan secara khusus; “mereka” mempertahankan struktur itu.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Dalam konteks pemakaman, frasa ini menyatakan hubungan dengan tempat pemakaman dinasti, tanpa memastikan bahwa jenazah ditempatkan dalam makam yang persis sama.
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: di ladang pemakaman
  rationale: Mempertahankan arti konkret שָׂדֶה, “ladang,” sekaligus menghasilkan frasa Indonesia yang jelas.
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: milik para raja
  rationale: Menyampaikan hubungan kepemilikan atau peruntukan yang ditandai oleh ל tanpa memperinci lebih jauh.
- source_word: כִּי אָמְרוּ
  choice: sebab kata mereka
  rationale: כִּי memberikan alasan bagi lokasi pemakaman Uzia; susunan ini alami dalam narasi Indonesia.
- source_word: מְצוֹרָע
  choice: menderita penyakit kulit
  rationale: Istilah ini menunjuk kepada orang yang terkena צָרַעַת, kategori kuno yang tidak dapat disamakan begitu saja dengan penyakit Hansen modern. Pilihan ini menghindari diagnosis medis yang terlalu sempit.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: menjadi raja menggantikan dia
  rationale: Dalam berita pergantian takhta, gabungan ini secara alami menyatakan bahwa Yotam mengambil kedudukan kerajaan Uzia.
theological_decisions:
- issue: Makna מְצוֹרָע sebagai kategori ritual dan penyakit
  choice: Ia menderita penyakit kulit
  alternative: Ia seorang yang kena kusta
  rationale: צָרַעַת adalah kategori dalam dunia Alkitab yang cakupannya mungkin lebih luas daripada kusta atau penyakit Hansen dalam pengertian medis modern. Teks utama memakai istilah luas, sedangkan catatan kaki mempertahankan padanan tradisional.
- issue: Ungkapan kematian וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  alternative: tidur bersama leluhurnya; meninggal seperti leluhurnya
  rationale: Pilihan utama menjaga sifat halus dan formula dinastis ungkapan Ibrani, tetapi menghindari kemungkinan salah paham dari terjemahan harfiah “tidur bersama.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Leluhur” dipilih daripada “bapa-bapa” agar rumus dinastis dipahami secara alami. Kalimat tetap mengikuti urutan narasi Ibrani dan mempertahankan pelaku pemakaman yang tidak disebutkan secara khusus.
