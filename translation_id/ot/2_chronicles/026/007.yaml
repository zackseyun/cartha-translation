  text: וַ/יַּעְזְרֵ֨/הוּ הָֽ/אֱלֹהִ֜ים עַל פְּלִשְׁתִּ֧ים וְ/עַל ה/ערביים הַ/יֹּשְׁבִ֥ים בְּ/גוּר בָּ֖עַל וְ/הַ/מְּעוּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: id
  text: Allah menolongnya melawan orang Filistin, orang Arab yang tinggal di Gur-Baal, dan orang Meunim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang Maon". Etnonim Ibrani ini mungkin mencerminkan nama kelompok yang berkerabat atau suatu bentuk nama yang berbeda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: menolongnya
  rationale: Bentuk naratif verba עזר dengan akhiran orang ketiga tunggal maskulin berarti bahwa Allah menolong dia, yakni Uzia. Bentuk "menolongnya" langsung, alami, dan mempertahankan Allah sebagai pelaku.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam narasi ini, bentuk tersebut merupakan sebutan biasa bagi Allah Israel. "Allah" adalah padanan baku dan wajar dalam bahasa Indonesia.
- source_word: עַל
  choice: melawan
  rationale: Bersama verba "menolong" dalam konteks militer, עַל menunjukkan pihak lawan. "Melawan" menyampaikan bahwa Allah membantu Uzia menghadapi bangsa-bangsa tersebut.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini adalah sebutan baku dalam bahasa Indonesia bagi kelompok bangsa פלשתים.
- source_word: הערביים
  choice: orang Arab
  rationale: Etnonim ini menunjuk kepada bangsa-bangsa Arab. "Orang Arab" adalah ungkapan modern yang alami tanpa menambahkan identifikasi politis yang tidak terdapat dalam teks.
- source_word: הַיֹּשְׁבִים
  choice: yang tinggal
  rationale: Partisipel ישב menyatakan keadaan menetap atau berdiam; "yang tinggal" jelas dan alami sebagai pewatas bagi orang Arab.
- source_word: בְּגוּר בָּעַל
  choice: di Gur-Baal
  rationale: Gur-Baal adalah nama tempat, sedangkan preposisi ב dalam konteks tempat tinggal paling wajar diterjemahkan "di".
- source_word: הַמְּעוּנִים
  choice: orang Meun
  rationale: Etnonim ini ditransliterasikan berdasarkan bentuk konsonantal מעונים. Karena identifikasi tepatnya diperdebatkan dan mungkin berkaitan dengan Maon, kemungkinan alternatif dipertahankan dalam catatan kaki.
