base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: id
  text: Ia terus mencari Allah pada zaman Zakharia[a], yang memahami penglihatan-penglihatan dari Allah. Selama ia mencari Yahweh[b], Allah membuatnya berhasil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang mengajar dalam takut akan Allah.” Frasa Ibrani ini sulit; Teks Masoret secara lebih harfiah berbunyi “yang memahami penglihatan-penglihatan dari Allah.”
    reason: alternative_reading
  - marker: b
    text: Atau, “dan pada masa ketika ia mencari Yahweh.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: Ia terus mencari Allah
  rationale: Konstruksi היה dengan infinitif menunjukkan kebiasaan atau tindakan yang berlangsung. “Terus mencari Allah” menyampaikan ketekunan dalam pengabdian dan ketergantungan kepada Allah, bukan sekadar meminta informasi.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: pada zaman Zakharia
  rationale: Ungkapan temporal ini diterjemahkan secara wajar dalam bahasa Indonesia sambil mempertahankan bentuk dasar ungkapan Ibrani.
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  choice: yang berpengertian dalam penglihatan-penglihatan Allah
  rationale: Terjemahan ini mempertahankan makna partisip בין sebagai memiliki pengertian serta bacaan Masoret yang menghubungkan רְאֹת dengan melihat atau penglihatan. Bentuknya sengaja tidak diperlancar menjadi “mengajar dalam takut akan Allah” karena bacaan itu tidak mengikuti vokalisasi Masoret.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: Selama ia mencari Yahweh
  rationale: “Selama” menangkap kurun waktu yang ditandai oleh tindakan mencari Yahweh dan hubungan berkelanjutan antara tindakan itu dan keberhasilannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: Allah membuatnya berhasil
  rationale: Bentuk Hifil dari צלח menyatakan bahwa Allah menyebabkan dia berhasil; terjemahan ini mempertahankan kausalitas ilahi dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna frasa sulit בִּרְאֹת הָאֱלֹהִים
  choice: Zakharia memiliki pengertian dalam penglihatan-penglihatan Allah
  alternative: Zakharia mengajar dalam takut akan Allah
  rationale: Vokalisasi Teks Masoret mendukung makna yang berkaitan dengan melihat atau penglihatan. Karena frasa Ibrani tetap sulit dan tradisi tekstual atau penerjemahan lain mengaitkannya dengan takut akan Allah, bacaan utama mengikuti bukti Masoret sedangkan alternatif dicatat tanpa menyelesaikan ketegangan secara diam-diam.
- issue: Hubungan temporal antara mencari Yahweh dan keberhasilan
  choice: Selama ia mencari Yahweh, Allah membuatnya berhasil
  alternative: Pada masa ketika ia mencari Yahweh, Allah membuatnya berhasil
  rationale: “Selama” secara alami menyampaikan sifat duratif frasa tersebut dan kaitannya dengan keberhasilan, tanpa mengubahnya menjadi pernyataan kausal mutlak yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama ilahi “Yahweh” dipertahankan. Ungkapan yang agak tidak biasa mengenai penglihatan sengaja dipertahankan karena mencerminkan kesulitan teks Ibrani, dengan alternatif dijelaskan dalam catatan kaki.
