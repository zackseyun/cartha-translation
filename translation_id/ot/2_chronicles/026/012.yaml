  text: The total number of the heads of the fathers’ houses, for the mighty men of valor, was two thousand six hundred.
translation:
  language: id
  text: Jumlah seluruh kepala kaum keluarga di antara para pejuang gagah perkasa adalah 2.600 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: kepala kaum keluarga
  rationale: Ungkapan ini menunjuk kepada para pemimpin kelompok keluarga besar atau leluhur; bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “kepala para bapak”.
- source_word: לְגִבּוֹרֵי חָיִל
  choice: yang membawahi para pejuang gagah perkasa
  rationale: Preposisi לְ dipertahankan sebagai hubungan tanggung jawab atau kepemimpinan para kepala kaum keluarga terhadap pasukan, bukan disamakan begitu saja dengan para pejuang itu sendiri.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2.600 orang
  rationale: Angka dinyatakan dengan format angka Indonesia dan “orang” ditambahkan secara wajar karena yang dihitung ialah para kepala kaum keluarga.
theological_decisions:
- issue: Hubungan antara para kepala kaum keluarga dan para pejuang
  choice: yang membawahi para pejuang gagah perkasa
  alternative: dari para pejuang gagah perkasa
  rationale: לְ dapat menandai kaitan atau peruntukan. Konteks ayat 11–13 mendukung bahwa 2.600 orang ini adalah kepala kaum keluarga yang memimpin atau membawahi pasukan, sehingga terjemahan tidak menyamakan jumlah mereka dengan seluruh pasukan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kaum keluarga” mempertahankan latar organisasi kekerabatan Israel, sedangkan “pejuang gagah perkasa” menyampaikan idiom militer גִבּוֹרֵי חָיִל secara alami.
