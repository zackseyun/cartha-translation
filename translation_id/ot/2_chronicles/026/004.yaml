id: 2CH.26.4
reference: 2 Chronicles 26:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh[a], sesuai dengan segala yang telah dilakukan Amazia, ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di hadapan Yahweh.”'
    reason: Alternatif ini menyajikan padanan idiomatis untuk בְּעֵינֵי sambil mempertahankan nama ilahi יהוה sebagai "Yahweh".
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol dari עשה menyampaikan tindakan utama dalam narasi. Dalam bahasa Indonesia, penghubung וַ tidak perlu diterjemahkan secara tersendiri agar kalimat tetap alami.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Dengan עשה, kata sifat יָשָׁר membentuk ungkapan yang berarti melakukan sesuatu yang benar atau lurus secara moral. 'Apa yang benar' merupakan padanan Indonesia yang alami.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Terjemahan ini mempertahankan metafora Ibrani yang menyatakan penilaian dari sudut pandang seseorang dan tetap lazim dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: כְּכֹל אֲשֶׁר
  choice: sesuai dengan segala yang
  rationale: Ungkapan ini menyatakan kesesuaian dengan suatu pola sekaligus mempertahankan cakupan menyeluruh dari כֹל.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Bentuk ini menunjukkan bahwa tindakan Amazia menjadi pola terdahulu bagi tindakan raja yang sedang dibicarakan; 'telah' memperjelas urutan tersebut secara alami dalam bahasa Indonesia.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Dalam konteks sejarah ini, Amazia adalah ayah langsung Uzia, sehingga 'ayahnya' lebih tepat daripada arti yang lebih luas, 'leluhurnya'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama diri, sedangkan 'TUHAN' merupakan penggantian tradisional dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Metafora Ibrani 'di mata' dipertahankan karena mudah dipahami, sedangkan susunan klausa dibuat alami bagi pembaca Indonesia.
