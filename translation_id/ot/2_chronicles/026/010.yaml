translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat mengikuti pembagian sintaksis Ibrani: banyak ternaknya berada di dataran rendah dan dataran, sedangkan para petani serta penggarap kebun anggurnya berada di perbukitan dan tanah subur. Istilah teknis ''perigi'' atau ''tadah air'' dihindari demi kejelasan umum; ''tempat penampungan air'' menyampaikan fungsi בֹּרוֹת secara alami.'
