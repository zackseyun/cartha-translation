source:
  edition: WLC
  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: id
  text: Ia membangun menara-menara[a] di padang belantara dan menggali banyak tempat penampungan air, sebab ia mempunyai banyak ternak, baik di daerah dataran rendah[b] maupun di dataran. Ia juga mempunyai para petani dan penggarap kebun anggur di perbukitan dan di tanah yang subur[c], sebab ia mencintai tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menara-menara pengawas.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Syefela,” yaitu kawasan kaki perbukitan Yehuda.'
    reason: cultural_note
  - marker: c
    text: 'Atau: “di Karmel,” jika kata Ibraninya dipahami sebagai nama tempat.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: menara-menara
  rationale: Kata ini berarti menara. Fungsi khusus sebagai menara pengawas mungkin tersirat oleh konteks, tetapi tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר dapat menunjuk pada belantara, stepa, atau daerah penggembalaan yang jarang dihuni; 'padang belantara' tidak menyiratkan gurun pasir yang sepenuhnya tandus.
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: menggali banyak tempat penampungan air
  rationale: Kata kerja חצב pada dasarnya berarti memahat atau menggali, sedangkan בּוֹרוֹת dalam konteks ini menunjuk pada lubang atau waduk untuk menampung air, bukan semata-mata sumur yang memperoleh air dari mata air.
- source_word: מִקְנֶה רַב
  choice: banyak ternak
  rationale: מִקְנֶה merupakan istilah kolektif bagi hewan ternak dan tidak terbatas pada sapi.
- source_word: שְׁפֵלָה
  choice: daerah dataran rendah
  rationale: Istilah ini menunjuk pada kawasan perbukitan kaki atau dataran rendah Yehuda; terjemahan deskriptif lebih mudah dipahami daripada transliterasi nama wilayah.
- source_word: מִישׁוֹר
  choice: dataran
  rationale: Kata ini menunjuk pada tanah yang rata dan dapat pula berarti tanah tinggi atau plato; 'dataran' mempertahankan keluasan maknanya.
- source_word: אִכָּרִים
  choice: para petani
  rationale: Istilah ini menunjuk pada orang yang mengolah tanah; 'petani' merupakan padanan Indonesia modern dan alami.
- source_word: כֹרְמִים
  choice: penggarap kebun anggur
  rationale: Istilah ini secara khusus menunjuk pada pekerja yang merawat dan membudidayakan kebun anggur.
- source_word: בֶּהָרִים
  choice: di perbukitan
  rationale: Walaupun bentuk ini dapat berarti pegunungan, 'perbukitan' cocok dengan konteks lahan pertanian dan tidak melebih-lebihkan bentuk medan.
- source_word: בַּכַּרְמֶל
  choice: di tanah yang subur
  rationale: כַּרְמֶל dapat dipahami sebagai kata benda umum bagi tanah subur atau lahan kebun. Kesejajarannya dengan 'perbukitan' dan konteks pertanian mendukung pengertian ini, sementara kemungkinan sebagai nama tempat dipertahankan dalam catatan kaki.
- source_word: אֹהֵב אֲדָמָה
  choice: ia mencintai tanah
  rationale: Ungkapan ini secara harfiah menggambarkan dia sebagai pencinta tanah; terjemahan tersebut mempertahankan citra konkretnya tanpa mengubahnya menjadi parafrasa seperti 'gemar bertani'.
