  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: id
  text: Azarya, imam kepala, dan semua imam menoleh kepadanya. Ternyata ia terkena penyakit kulit serius[a] pada dahinya. Mereka pun segera mengeluarkannya dari sana[b], dan ia sendiri juga bergegas keluar[c], sebab Yahweh telah memukulnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dipakai dalam hukum-hukum keimaman mengenai kenajisan ritual untuk berbagai penyakit atau kelainan kulit yang serius; istilah itu tidak selalu sama persis dengan kusta (penyakit Hansen) dalam pengertian medis modern.
    reason: cultural_note
  - marker: b
    text: Atau, “mereka mengusirnya dari sana.” Kata kerja Ibrani dapat menggambarkan tindakan menyingkirkan seseorang dengan segera dan mungkin dengan paksa.
    reason: lexical_alternative
  - marker: c
    text: Atau, “ia sendiri juga didorong untuk keluar.” Bentuk Ibraninya dapat menekankan bahwa ia terdesak atau didorong ke luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: menoleh kepadanya
  rationale: פנה dengan אֶל menyatakan tindakan berbalik atau mengarahkan pandangan kepada seseorang; 'menoleh kepadanya' alami dalam bahasa Indonesia dan mempertahankan gerak fisiknya.
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: Imam kepala Azarya
  rationale: כֹהֵן הָרֹאשׁ secara harfiah berarti imam yang menjadi kepala. 'Imam kepala' mempertahankan ungkapan sumber tanpa mengubahnya menjadi gelar teknis 'imam besar'.
- source_word: וְכָל הַכֹּהֲנִים
  choice: dan semua imam lainnya
  rationale: Frasa ini menyertakan semua imam selain Azarya dalam tindakan tersebut; 'lainnya' membuat hubungan itu jelas dan alami tanpa mengubah makna.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: הִנֵּה menandai penemuan mendadak. 'Ternyata' menyampaikan kejutan naratif secara wajar dalam bahasa Indonesia modern.
- source_word: מְצֹרָע
  choice: terkena penyakit kulit serius
  rationale: Istilah ini berasal dari ranah hukum kenajisan imam dan tidak pasti identik dengan penyakit Hansen modern. Terjemahan deskriptif menghindari penyamaan medis yang terlalu sempit.
- source_word: בְּמִצְחוֹ
  choice: pada dahinya
  rationale: Ini merupakan ungkapan Indonesia yang alami untuk lokasi tanda penyakit yang terlihat.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: mereka pun segera membawanya keluar dari sana
  rationale: Bentuk Hifil בהל menyatakan tindakan menyebabkan seseorang bergegas atau disingkirkan dengan segera. Pilihan ini menjaga urgensi tanpa memastikan adanya kekerasan fisik.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: dan ia sendiri juga bergegas keluar
  rationale: Nifal דחף dapat berarti didorong atau terdesak. Dalam konteks, frasa ini juga dapat menggambarkan Uzia yang dengan mendesak menuju keluar; terjemahan utama dibuat alami, sedangkan kemungkinan pasif dipertahankan dalam catatan.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: sebab Yahweh telah menimpakan penyakit itu kepadanya
  rationale: נגע di sini menyatakan tindakan ilahi yang mendatangkan tulah atau penyakit, bukan sekadar sentuhan netral. Penyebutan 'penyakit itu' menghubungkannya secara jelas dengan kondisi yang baru terlihat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Status jabatan כֹהֵן הָרֹאשׁ
  choice: imam kepala
  alternative: imam besar
  rationale: Ungkapan sumber secara harfiah berarti 'imam kepala'. Pilihan ini tidak memaksakan gelar teknis yang tidak dinyatakan dengan bentuk khusus lain dalam ayat ini.
- issue: Identifikasi medis מְצֹרָע
  choice: terkena penyakit kulit serius
  alternative: berpenyakit kusta
  rationale: Istilah Ibrani terkait kategori kenajisan ritual dan tidak harus sama persis dengan kusta atau penyakit Hansen dalam pengertian medis modern.
- issue: Pelaku dan kadar paksaan dalam נִדְחַף לָצֵאת
  choice: ia sendiri juga bergegas keluar
  alternative: ia sendiri juga didorong untuk keluar
  rationale: Bentuk pasif dapat menonjolkan desakan dari luar, tetapi konteks juga memungkinkan gerak Uzia sendiri yang tergesa-gesa. Ambiguitas dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. Urutan klausa dibuat alami bagi pembaca Indonesia, sementara kejutan naratif, urgensi pengusiran, kemungkinan nuansa pasif, dan latar hukum kenajisan tetap dipertahankan.
