revisions:
- from: Imam kepala Azarya dan semua imam lainnya menoleh kepadanya. Ternyata ia terkena penyakit kulit serius[a] pada dahinya. Mereka pun segera membawanya keluar dari sana[b], dan ia sendiri juga bergegas keluar[c], sebab Yahweh telah menimpakan penyakit itu kepadanya.
  to: Azarya, imam kepala, dan semua imam menoleh kepadanya. Ternyata ia terkena penyakit kulit serius[a] pada dahinya. Mereka pun segera mengeluarkannya dari sana[b], dan ia sendiri juga bergegas keluar[c], sebab Yahweh telah memukulnya.
  rationale: Revisi memperbaiki ketepatan klausa terakhir dengan menerjemahkan tindakan Yahweh sebagai “memukulnya”, tanpa menambahkan objek “penyakit” yang tidak diulang dalam teks Ibrani. Urutan nama dan jabatan dibuat lebih wajar dalam bahasa Indonesia. Catatan a diperjelas agar secara tepat merujuk pada hukum kenajisan ritual dalam tradisi keimaman. Ambiguitas pada tindakan Uzia untuk keluar tetap dipertahankan melalui catatan c.
