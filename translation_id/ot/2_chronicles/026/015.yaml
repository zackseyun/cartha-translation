source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: id
  text: Di Yerusalem ia membuat alat-alat[a] hasil rancangan para ahli untuk ditempatkan di atas menara-menara dan di sudut-sudut, guna melontarkan anak panah dan batu-batu besar. Namanya pun tersiar sampai jauh[b], sebab ia mendapat pertolongan yang luar biasa[c] hingga menjadi kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mesin-mesin” atau “perangkat-perangkat”, yakni alat militer yang dirancang untuk digunakan pada menara dan sudut pertahanan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “namanya keluar sampai jauh.”'
    reason: lexical_alternative
  - marker: c
    text: Teks ini tidak menyebut secara langsung siapa yang menolongnya, meskipun konteksnya mengisyaratkan pertolongan ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: alat-alat
  rationale: Kata ini menunjuk pada hasil reka cipta atau perangkat mekanis. 'Alat-alat' alami dalam bahasa Indonesia modern dan tidak menentukan secara berlebihan bentuk teknologi militernya.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: hasil rancangan para ahli
  rationale: Rangkaian kata yang seakar ini menekankan rancangan yang disengaja oleh perancang atau pengrajin terampil. Bentuk jamak generik 'para ahli' menghasilkan ungkapan Indonesia yang wajar tanpa mengubah pokok maknanya.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: di atas menara-menara dan di sudut-sudut tembok
  rationale: מִגְדָּלִים berarti menara-menara, sedangkan פִּנּוֹת secara harfiah berarti sudut-sudut. Tambahan 'tembok' memperjelas konteks benteng tanpa menafsirkannya secara lebih sempit sebagai kubu atau menara sudut.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: guna melontarkan anak panah dan batu-batu besar
  rationale: Infinitif menyatakan tujuan, dan יָרָה dapat berarti menembakkan atau melemparkan. 'Melontarkan' dapat berlaku bagi anak panah maupun batu dan mempertahankan satu tindakan yang menaungi kedua objek.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: Namanya pun tersiar sampai jauh
  rationale: Terjemahan ini mempertahankan citra Ibrani 'namanya tersebar/keluar' sambil menyampaikan arti idiomatis bahwa kemasyhurannya menjangkau tempat-tempat jauh.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: ia mendapat pertolongan yang luar biasa
  rationale: Bentuk ini menyatakan bahwa ia ditolong secara menakjubkan atau luar biasa. Rumusan ini alami dalam bahasa Indonesia dan tetap tidak menyebut pelaku pertolongan.
- source_word: עַד כִּי חָזָק
  choice: hingga menjadi kuat
  rationale: 'Frasa ini menunjukkan batas atau hasil pertolongan tersebut: ia mencapai keadaan kuat.'
theological_decisions:
- issue: Pelaku yang memberi pertolongan kepada raja
  choice: 'Dibiarkan tidak disebut dalam teks utama: ''ia mendapat pertolongan yang luar biasa'''
  alternative: 'Dinyatakan sebagai Allah atau TUHAN: ''TUHAN menolongnya secara luar biasa'''
  rationale: Bahasa Ibrani ayat ini memakai bentuk pasif dan tidak menyebut pelaku pertolongan. Walaupun konteks yang lebih luas mengisyaratkan pertolongan ilahi, terjemahan tidak menambahkan pelaku yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah teknis dibatasi agar teks tidak mengimpor gambaran teknologi tertentu; susunan kalimat dibuat alami bagi pembaca umum. Semua penanda catatan kaki [a]–[c] tercantum dalam teks utama.
