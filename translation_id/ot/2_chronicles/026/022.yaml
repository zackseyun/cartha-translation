  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: id
  text: Selebihnya dari riwayat Uzia[a], baik yang terdahulu maupun yang kemudian, ditulis oleh Nabi Yesaya bin Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “perkataan-perkataan Uzia, yang terdahulu dan yang kemudian.” Di sini “perkataan-perkataan” adalah ungkapan khas catatan sejarah Ibrani yang berarti peristiwa, tindakan, atau hal-hal yang tercatat mengenai pemerintahannya.
    reason: Menjelaskan arti idiomatis דִּבְרֵי sambil mempertahankan kemungkinan terjemahan yang lebih harfiah.
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Selebihnya dari
  rationale: יֶתֶר menunjuk pada bagian yang masih tersisa. Ungkapan ini menyampaikan rumus penutup riwayat raja secara wajar dalam bahasa Indonesia; waw pembuka tidak perlu diberi kata tersendiri karena hubungan wacananya sudah jelas.
- source_word: דִּבְרֵי
  choice: riwayat
  rationale: Secara leksikal berarti 'perkataan-perkataan' atau 'hal-hal', tetapi dalam rumus ringkasan kerajaan kata ini menunjuk pada catatan tentang peristiwa dan tindakan selama pemerintahan seorang raja. 'Riwayat' menyampaikan fungsi historiografis tersebut tanpa mempersempitnya hanya menjadi perbuatan.
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Bentuk nama dalam ayat ini adalah Uzia; bentuk Azarya yang dipakai di tempat lain tidak dimasukkan ke teks ini.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: baik yang terdahulu maupun yang kemudian
  rationale: Terjemahan ini mempertahankan pasangan kata Ibrani 'yang terdahulu dan yang kemudian' serta cakupan temporalnya tanpa mengubahnya menjadi pernyataan yang lebih tegas tentang keseluruhan dari awal sampai akhir.
- source_word: כָּתַב
  choice: ditulis oleh
  rationale: Bentuk pasif menghasilkan susunan bahasa Indonesia yang alami, sementara tetap menyatakan secara langsung bahwa Yesaya adalah penulisnya.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: Nabi Yesaya bin Amoz
  rationale: Gelar, nama, dan patronimik semuanya dipertahankan. 'Amoz' mengikuti bentuk nama Ibrani dan membedakannya dari Amos sang nabi.
theological_decisions:
- issue: Makna דִּבְרֵי dalam rumus riwayat kerajaan
  choice: riwayat
  alternative: perkataan-perkataan; hal-hal; perbuatan-perbuatan
  rationale: '''Riwayat'' mencakup peristiwa dan tindakan yang dicatat tentang pemerintahan Uzia, namun catatan kaki mempertahankan bentuk harfiahnya agar pergeseran makna dalam ungkapan Ibrani tetap terlihat.'
- issue: Cakupan הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: baik yang terdahulu maupun yang kemudian
  alternative: dari awal sampai akhir; yang pertama dan yang terakhir
  rationale: Pilihan ini dekat dengan struktur sumber dan tidak memaksakan apakah pasangan tersebut menekankan tahap-tahap masa pemerintahan atau keseluruhan rentangnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pasif dipakai agar kalimat mengalir alami; istilah 'riwayat' mudah dipahami dan sesuai dengan konteks catatan sejarah kerajaan.
