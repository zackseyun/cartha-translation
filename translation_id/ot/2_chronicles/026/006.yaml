translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-historis. Kata 'menjebol' dipilih karena mudah dipahami dan tepat untuk tindakan membuka pertahanan tembok. Penanda catatan kaki [a] ditempatkan sesudah klausa yang diterangkannya.
