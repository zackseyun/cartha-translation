  text: וַ/יֵּצֵא֙ וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֔ים וַ/יִּפְרֹ֞ץ אֶת ח֣וֹמַת גַּ֗ת וְ/אֵת֙ חוֹמַ֣ת יַבְנֵ֔ה וְ/אֵ֖ת חוֹמַ֣ת אַשְׁדּ֑וֹד וַ/יִּבְנֶ֣ה עָרִ֔ים בְּ/אַשְׁדּ֖וֹד וּ/בַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: id
  text: Ia keluar dan berperang melawan orang Filistin, lalu menjebol tembok Gat, tembok Yabne, dan tembok Asdod. Ia membangun kota-kota di wilayah Asdod dan di antara orang Filistin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di Asdod dan di antara orang Filistin”; “Asdod” dapat menunjuk pada kota itu atau wilayah di sekitarnya.
    reason: Menjaga ambiguitas geografis dalam frasa Ibrani בְּאַשְׁדּוֹד tanpa menimbulkan kesan bahwa beberapa kota dibangun di dalam satu kota.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Ia maju
  rationale: Secara harfiah berarti 'ia keluar'. Dalam konteks ekspedisi militer, 'ia maju' terdengar alami tanpa menambahkan gagasan khusus seperti berbaris.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: berperang melawan orang Filistin
  rationale: Bentuk Niphal dari לחם berarti berperang atau bertempur; 'melawan' menyatakan arah permusuhan secara alami dalam bahasa Indonesia.
- source_word: וַיִּפְרֹץ אֶת חוֹמַת
  choice: menjebol tembok
  rationale: פרץ dengan tembok sebagai objek menunjuk pada tindakan membuat lubang atau menerobos pertahanan. 'Menjebol' mempertahankan gambaran militer dan dapat mencakup tindakan merusak tembok tanpa menentukan bahwa seluruh tembok diruntuhkan.
- source_word: גַּת / יַבְנֶה / אַשְׁדּוֹד
  choice: Gat / Yabne / Asdod
  rationale: Transliterasi nama tempat Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיִּבְנֶה עָרִים
  choice: Ia membangun kota-kota
  rationale: בנה berarti 'membangun'; teks tidak secara eksplisit mengatakan 'membangun kembali'. Bentuk jamak עָרִים dipertahankan sebagai 'kota-kota'.
- source_word: בְּאַשְׁדּוֹד
  choice: di wilayah Asdod
  rationale: Secara harfiah 'di Asdod'. Karena beberapa kota dibangun, nama Asdod mungkin menunjuk pada daerah yang dikuasai kota itu; 'wilayah' membuat maksud lokatifnya jelas tanpa menutup ambiguitas, yang dicatat dalam catatan kaki.
- source_word: וּבַפְּלִשְׁתִּים
  choice: di tengah-tengah orang Filistin
  rationale: Teks Ibrani memakai nama kelompok bangsa, bukan nama wilayah. Terjemahan ini mempertahankan rujukan kepada orang Filistin sekaligus menyampaikan lokasi.
