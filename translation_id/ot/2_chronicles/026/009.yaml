base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: id
  text: Uzia membangun menara-menara di Yerusalem, di Gerbang Sudut, di Gerbang Lembah, dan di sudut[a], lalu memperkuat menara-menara itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tikungan”; istilah Ibrani ini dapat menunjuk sudut, tikungan, atau titik berbelok pada benteng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Kata kerja בנה secara langsung berarti membangun; bentuk ini alami dalam narasi Indonesia.
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִגְדָּלִים
  choice: menara-menara
  rationale: Bentuk jamak מגדלים berarti menara-menara; unsur pertahanan tidak ditambahkan karena dinyatakan oleh kata kerja terakhir.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Preposisi ב di sini bersifat lokatif dan wajar diterjemahkan 'di'.
- source_word: עַל
  choice: di
  rationale: Dalam konteks letak menara pada gerbang dan benteng kota, 'di' menyatakan lokasi secara alami tanpa memastikan bahwa menara berdiri tepat di atas gerbang.
- source_word: שַׁעַר הַפִּנָּה
  choice: Gerbang Sudut
  rationale: Frasa konstruksi ini merupakan nama gerbang; 'Gerbang Sudut' ringkas dan jelas.
- source_word: שַׁעַר הַגַּיְא
  choice: Gerbang Lembah
  rationale: גיא berarti lembah dan frasa tersebut berfungsi sebagai nama gerbang.
- source_word: הַמִּקְצוֹעַ
  choice: Tikungan
  rationale: Nomina ini menunjuk sudut, tikungan, atau titik berbelok pada benteng. 'Tikungan' mempertahankan makna topografis dan membedakannya dari Gerbang Sudut.
- source_word: וַיְחַזְּקֵם
  choice: lalu memperkuatnya
  rationale: Dalam konteks bangunan pertahanan, חזק bentuk piel berarti memperkuat atau membentengi. Akhiran jamaknya paling wajar mengacu pada menara-menara, sedangkan '-nya' dapat merujuk pada keseluruhan jamak dalam bahasa Indonesia.
