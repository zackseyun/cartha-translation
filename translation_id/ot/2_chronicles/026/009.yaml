translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama-nama tempat memakai kapital sebagai nama diri. 'Tikungan' dipilih untuk menghindari kerancuan dengan Gerbang Sudut sambil mempertahankan ketidakpastian leksikal melalui catatan kaki.
