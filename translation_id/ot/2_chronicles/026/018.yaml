  text: וַ/יַּעַמְד֞וּ עַל עֻזִּיָּ֣הוּ הַ/מֶּ֗לֶךְ וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹא לְ/ךָ֣ עֻזִּיָּ֗הוּ לְ/הַקְטִיר֙ לַֽ/יהוָ֔ה כִּ֣י לַ/כֹּהֲנִ֧ים בְּנֵי אַהֲרֹ֛ן הַ/מְקֻדָּשִׁ֖ים לְ/הַקְטִ֑יר צֵ֤א מִן הַ/מִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְ/לֹֽא לְ/ךָ֥ לְ/כָב֖וֹד מֵ/יְהוָ֥ה אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: id
  text: Mereka menghadapi Raja Uzia[a] dan berkata kepadanya, “Bukan hakmu, Uzia, untuk membakar dupa bagi TUHAN, melainkan hak para imam, keturunan Harun, yang telah dikuduskan untuk membakar dupa. Keluarlah dari tempat kudus, karena engkau telah berlaku tidak setia[b]. Perbuatan ini tidak akan mendatangkan kehormatan bagimu dari TUHAN Allah.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menentang Raja Uzia” atau “berdiri melawan Raja Uzia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “telah melakukan pelanggaran.” Kata Ibrani yang digunakan dapat menyatakan ketidaksetiaan, khususnya dalam perkara sakral atau perjanjian.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan bukan bagimu untuk kehormatan dari TUHAN Allah,” suatu ungkapan eliptis yang berarti bahwa tindakan ini tidak akan menghasilkan kehormatan dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: Mereka menghadang
  rationale: Ungkapan ini menyatakan sikap menentang atau menghadapi seseorang, bukan sekadar berdiri di dekatnya. “Menghadang” menyampaikan tindakan tegas para imam dalam bahasa Indonesia yang alami.
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: Raja Uzia
  rationale: Susunan gelar sebelum nama merupakan bentuk yang alami dalam bahasa Indonesia.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: Bukan hakmu ... untuk membakar dupa
  rationale: Konstruksi ini menyatakan bahwa tindakan tersebut bukan kewenangan atau hak Uzia. “Bukan hakmu” mempertahankan pembatasan itu tanpa memakai istilah birokratis.
- source_word: לְהַקְטִיר
  choice: membakar dupa
  rationale: Dalam konteks ibadah ini, bentuk kausatif dari קטר menunjuk pada pembakaran atau persembahan dupa.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Nama ilahi יהוה diterjemahkan dengan bentuk baku Indonesia “TUHAN”; preposisi menyatakan bahwa dupa dipersembahkan bagi-Nya.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: melainkan hak para imam, keturunan Harun
  rationale: Frasa ini menegaskan bahwa tugas tersebut dikhususkan bagi para imam dari garis Harun. Pengulangan “hak” membuat kontras eliptis Ibrani jelas dalam bahasa Indonesia.
- source_word: הַמְקֻדָּשִׁים
  choice: yang telah dikuduskan
  rationale: Partisip pasif ini menyatakan bahwa mereka telah dikhususkan bagi pelayanan suci. “Dikuduskan” mempertahankan bobot kultisnya.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: Keluarlah dari tempat kudus
  rationale: מקדש menunjuk pada tempat atau kawasan suci. Terjemahan ini langsung dan tidak mempersempit rujukannya menjadi ruang dalam tertentu.
- source_word: מָעַלְתָּ
  choice: engkau telah berlaku tidak setia
  rationale: Dalam konteks sakral, מעל menyatakan pelanggaran kesetiaan terhadap tatanan Allah, lebih berat daripada sekadar kesalahan prosedural.
- source_word: וְלֹא לְךָ לְכָבוֹד
  choice: Perbuatan ini tidak akan mendatangkan kehormatan bagimu
  rationale: Klausa Ibrani bersifat eliptis. Rumusan ini mengungkapkan maksudnya secara alami sambil mempertahankan bahwa tindakan Uzia tidak menghasilkan kehormatan.
- source_word: מֵיְהוָה אֱלֹהִים
  choice: dari TUHAN Allah
  rationale: Frasa ini mempertahankan Allah sebagai sumber kehormatan yang tidak akan diperoleh Uzia melalui perbuatannya.
theological_decisions:
- issue: Kekhususan tugas mempersembahkan dupa bagi imam
  choice: Pembakaran dupa bagi TUHAN dinyatakan sebagai hak para imam keturunan Harun yang telah dikuduskan untuk tugas itu.
  alternative: Ayat ini dipahami hanya sebagai pernyataan umum tentang kepemimpinan ibadah.
  rationale: Teks secara konkret membatasi tindakan membakar dupa kepada para imam keturunan Harun, bukan sekadar membandingkan jabatan raja dan imam secara umum.
- issue: Bobot pelanggaran dalam מָעַלְתָּ
  choice: Uzia telah berlaku tidak setia dalam perkara sakral.
  alternative: Uzia hanya melakukan kesalahan tata cara.
  rationale: Dalam konteks kultis, kata tersebut mengandung gagasan pelanggaran kesetiaan atau penyalahgunaan hal kudus, sehingga terjemahan tidak boleh meringankan keseriusannya.
- issue: Hubungan tindakan Uzia dengan kehormatan dari Allah
  choice: Tindakan tersebut tidak akan mendatangkan kehormatan bagi Uzia dari TUHAN Allah.
  alternative: Uzia sama sekali tidak mempunyai kehormatan apa pun di hadapan Allah.
  rationale: Klausa eliptis terkait dengan tindakan yang sedang ditegur; terjemahan tidak memperluasnya menjadi penilaian mutlak atas seluruh kedudukan atau kehidupan Uzia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan khidmat. Sapaan “engkau” dipakai dalam kutipan langsung untuk mempertahankan register Alkitab yang bermartabat, sedangkan sintaksis dibuat alami bagi pembaca umum. Nama יהוה ditampilkan sebagai “TUHAN” menurut konvensi terjemahan Indonesia.
