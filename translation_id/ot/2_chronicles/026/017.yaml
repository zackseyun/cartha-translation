  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אַחֲרָ֖י/ו עֲזַרְיָ֣הוּ הַ/כֹּהֵ֑ן וְ/עִמּ֞/וֹ כֹּהֲנִ֧ים לַ/יהוָ֛ה שְׁמוֹנִ֖ים בְּנֵי חָֽיִל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: id
  text: Lalu Imam Azarya masuk menyusul dia, dan bersamanya ada delapan puluh imam Yahweh, orang-orang yang gagah berani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang perkasa” atau “orang-orang tangguh.” Ungkapan Ibrani בְּנֵי חָיִל dapat menunjuk kepada orang-orang yang dikenal karena kekuatan, keberanian, atau keperkasaan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Kata kerja בוא dapat berarti datang, pergi, atau masuk. Dalam konteks ini Azarya mengikuti raja ke kawasan tempat suci, sehingga “masuk” menyampaikan gerak yang dimaksud tanpa menambahkan lokasi yang tidak disebutkan dalam ayat.
- source_word: אַחֲרָיו
  choice: menyusul dia
  rationale: Ungkapan ini menunjukkan bahwa Azarya mengikuti orang yang telah masuk lebih dahulu. “Menyusul dia” alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: Imam Azarya
  rationale: Nama עֲזַרְיָהוּ ditransliterasikan menurut bentuk Indonesia yang lazim, dan הַכֹּהֵן menyatakan jabatan tertentu yang dipegangnya.
- source_word: וְעִמּוֹ
  choice: dan bersamanya ada
  rationale: Frasa penyertaan dalam bahasa Ibrani ini tidak memakai verba eksplisit. Kata “ada” ditambahkan agar susunannya wajar dalam bahasa Indonesia tanpa mengubah makna.
- source_word: כֹּהֲנִים לַיהוָה
  choice: imam Yahweh
  rationale: 'Lamed menyatakan hubungan atau pengabdian: mereka adalah imam yang melayani Yahweh. Bentuk ringkas “imam Yahweh” jelas dan alami.'
- source_word: שְׁמוֹנִים
  choice: delapan puluh
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
- source_word: בְּנֵי חָיִל
  choice: orang-orang yang gagah berani
  rationale: Idiom ini menggambarkan orang yang ditandai oleh kekuatan, keberanian, atau keperkasaan. Dalam konteks para imam yang menghadapi raja, “gagah berani” menyampaikan sifat keberanian tanpa menjadikannya sebutan militer teknis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan dan nuansa בְּנֵי חָיִל
  choice: orang-orang yang gagah berani
  alternative: orang-orang perkasa; orang-orang tangguh
  rationale: Ungkapan maskulin ini merujuk kepada para imam laki-laki dan dapat menonjolkan kekuatan maupun keberanian. Terjemahan utama mempertahankan pujian atas keberanian mereka, sedangkan catatan kaki mengakui keluasan nuansanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “masuk menyusul dia” mempertahankan gerak naratif, sedangkan aposisi setelah “imam Yahweh” menjaga penekanan teks pada watak kedelapan puluh imam tersebut.
