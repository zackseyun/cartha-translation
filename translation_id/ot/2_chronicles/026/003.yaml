base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: id
  text: Uzia berumur enam belas tahun ketika ia menjadi raja[a], dan ia memerintah selama lima puluh dua tahun di Yerusalem. Nama ibunya ialah Yekholya[b], yang berasal dari Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat diterjemahkan: “ketika ia mulai memerintah” atau “pada waktu ia menjadi raja.”'
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga dapat ditransliterasikan sebagai Yekhilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: berumur enam belas tahun
  rationale: Ungkapan usia dalam bahasa Ibrani dialihkan ke bentuk Indonesia yang alami dan tepat.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Konstruksi dengan ב menandai waktu naik takhta; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna awal pemerintahannya.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: ia memerintah selama lima puluh dua tahun
  rationale: Kata kerja מָלַךְ menyatakan pelaksanaan kekuasaan sebagai raja selama suatu rentang waktu.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב bersifat lokatif dan menunjukkan tempat pemerintahannya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Bentuk ini menyampaikan formula silsilah Ibrani secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: יכיליה
  choice: Yekholya
  rationale: Transliterasi ini mendekati bentuk konsonantal Ibrani dan mengikuti ejaan Indonesia, termasuk penggunaan Y untuk yod.
- source_word: מִן יְרוּשָׁלִָם
  choice: seorang dari Yerusalem
  rationale: מִן menunjukkan asal; penambahan 'seorang' membuat hubungan frasa dengan sang ibu jelas dan alami tanpa mengubah makna.
