  text: וַ/יִּתְּנ֧וּ הָֽ/עַמּוֹנִ֛ים מִנְחָ֖ה לְ/עֻזִּיָּ֑הוּ וַ/יֵּ֤לֶךְ שְׁמ/וֹ֙ עַד לְ/ב֣וֹא מִצְרַ֔יִם כִּ֥י הֶחֱזִ֖יק עַד לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: id
  text: Orang Amon menyerahkan upeti kepada Uzia. Nama Uzia tersiar[a] sampai ke pintu masuk Mesir[b], sebab ia telah menjadi sangat kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “namanya pergi”; dalam ungkapan Ibrani, “nama” dapat berarti reputasi atau kemasyhuran seseorang.
    reason: lexical_alternative
  - marker: b
    text: “Pintu masuk Mesir” dapat merujuk pada daerah pendekatan ke Mesir atau kawasan perbatasannya.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: Orang Amon
  rationale: Sebutan etnis yang baku dan mudah dipahami dalam bahasa Indonesia Alkitabiah modern.
- source_word: מִנְחָה
  choice: upeti
  rationale: Dalam konteks suatu bangsa asing memberi kepada seorang raja, kata ini menunjuk pada pemberian politis sebagai tanda takluk atau kewajiban, bukan persembahan ibadah.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: Nama Uzia pun menjadi termasyhur
  rationale: Ungkapan Ibrani harfiahnya menyatakan bahwa 'namanya pergi/tersebar'; penggunaan 'nama' dipertahankan, sedangkan makna reputasinya disampaikan secara alami dengan 'menjadi termasyhur'.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: sampai ke jalan masuk menuju Mesir
  rationale: Mempertahankan gambaran 'masuk/menuju Mesir' tanpa memastikan secara berlebihan bahwa yang dimaksud ialah satu garis perbatasan tertentu.
- source_word: הֶחֱזִיק
  choice: telah menjadi ... kuat
  rationale: Bentuk kausatif kata חזק dalam konteks ini menyatakan bahwa Uzia menjadi atau terbukti kuat.
- source_word: עַד לְמַעְלָה
  choice: luar biasa
  rationale: Ungkapan ini berfungsi sebagai penguat tingkat, yakni 'sampai sangat tinggi' atau 'amat sangat'.
