revisions:
- from: Orang Amon menyerahkan upeti kepada Uzia. Nama Uzia pun menjadi termasyhur[a] sampai ke jalan masuk menuju Mesir[b], sebab ia telah menjadi luar biasa kuat.
  to: Orang Amon menyerahkan upeti kepada Uzia. Nama Uzia tersiar[a] sampai ke pintu masuk Mesir[b], sebab ia telah menjadi sangat kuat.
  rationale: Revisi menghapus unsur “jalan” yang tidak terdapat dalam teks Ibrani dan memakai “tersiar sampai” untuk menyampaikan idiom bahwa nama atau kemasyhuran Uzia meluas hingga lokasi tersebut. Catatan kaki diperbarui agar membedakan bentuk harfiah Ibrani dari makna idiomatisnya.
