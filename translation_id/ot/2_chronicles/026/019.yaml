  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: id
  text: Uzia menjadi marah sambil memegang sebuah pedupaan untuk membakar dupa. Ketika ia marah terhadap para imam, penyakit kulit[a] tiba-tiba muncul di dahinya di hadapan para imam, di Bait Yahweh, dekat mezbah pembakaran dupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta”. Istilah Ibrani צָרַעַת dapat merujuk secara lebih luas pada penyakit atau kelainan kulit yang menajiskan, bukan hanya pada penyakit Hansen yang kini disebut kusta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: menjadi marah
  rationale: Menyampaikan perubahan keadaan yang dinyatakan bentuk wayyiqtol tanpa melebih-lebihkan kadar kemarahannya.
- source_word: עֻזִּיָּהוּ
  choice: Uzia
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִקְטֶרֶת
  choice: pedupaan
  rationale: Menunjuk pada wadah yang dipakai untuk membakar atau mempersembahkan dupa dalam ibadah.
- source_word: לְהַקְטִיר
  choice: untuk membakar dupa
  rationale: Infinitif ini menyatakan tujuan dan secara langsung menggambarkan tindakan ritual tersebut.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: sementara ia marah kepada para imam
  rationale: Mempertahankan fungsi temporal-sirkumstansial frasa Ibrani dan sasaran kemarahan Uzia.
- source_word: הַצָּרַעַת
  choice: penyakit kulit[a]
  rationale: צָרַעַת mencakup kondisi kulit yang lebih luas daripada penyakit Hansen modern; ungkapan ini menghindari diagnosis medis yang terlalu sempit.
- source_word: זָרְחָה
  choice: tiba-tiba muncul
  rationale: Kata ini secara harfiah dapat berarti bersinar atau memancar; dalam konteks ini, terjemahan tersebut menyampaikan kemunculan mendadak yang terlihat pada dahi.
- source_word: בְמִצְחוֹ
  choice: di dahinya
  rationale: Padanan anatomis yang lugas dan alami dalam bahasa Indonesia.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: di hadapan para imam
  rationale: Menunjukkan bahwa kejadian itu berlangsung dalam kehadiran dan penglihatan para imam.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Mempertahankan metafora Ibrani 'rumah' bagi tempat suci dan menerjemahkan nama ilahi secara langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: di dekat mezbah pembakaran dupa
  rationale: Menyampaikan hubungan tempat dengan mezbah dupa secara alami tanpa memaksakan konstruksi preposisional Ibrani yang padat.
theological_decisions:
- issue: Makna צָרַעַת
  choice: penyakit kulit
  alternative: kusta
  rationale: Istilah Ibrani tidak harus menunjuk pada penyakit Hansen yang kini disebut kusta. Pilihan ini mempertahankan cakupan kondisi kulit dalam teks tanpa menetapkan diagnosis modern.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dipecah agar mudah dipahami, sementara urutan kejadian, suasana kemarahan, lokasi kultis, dan ketidakpastian medis istilah צָרַעַת tetap dipertahankan.
