translation:
  language: id
  text: Di bawah komando mereka ada pasukan sebanyak 307.500 orang[a], yang siap berperang dengan kekuatan besar untuk membantu raja melawan musuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Di bawah wewenang mereka ada suatu kekuatan tentara sebanyak 307.500 orang, para pelaku perang.” Teks utama menerjemahkan ungkapan-ungkapan militer Ibrani secara alami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Di bawah komando mereka
  rationale: Ungkapan עַל יָד dengan akhiran pronominal menunjukkan pengawasan atau wewenang. Dalam konteks organisasi militer, “di bawah komando mereka” menyampaikan maknanya secara wajar.
- source_word: חֵיל צָבָא
  choice: pasukan
  rationale: Gabungan kata ini menunjuk pada kekuatan militer atau angkatan perang. “Pasukan” ringkas, alami, dan sesuai dengan konteks pendataan tentara.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 307.500 orang
  rationale: Angka ini merupakan jumlah langsung dari bilangan Ibrani. Kata “orang” memperjelas bahwa yang dihitung adalah anggota pasukan.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: yang siap berperang
  rationale: Secara bentuk berarti “orang-orang yang melakukan perang”. Dalam konteks daftar dan pengerahan pasukan, ungkapan ini menunjuk pada orang-orang yang dapat atau siap menjalankan peperangan, bukan semestinya sedang bertempur saat itu.
- source_word: בְּכֹחַ חָיִל
  choice: dengan kekuatan besar
  rationale: Frasa ini menekankan daya atau kemampuan militer yang kuat. “Dengan kekuatan besar” mempertahankan penekanan tersebut tanpa menghasilkan susunan yang kaku.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: untuk membantu raja
  rationale: Terjemahan langsung dan alami dari tujuan yang dinyatakan oleh verba עזר, “membantu”.
- source_word: עַל הָאוֹיֵב
  choice: melawan musuh
  rationale: Dalam konteks militer ini, עַל menyatakan pertentangan terhadap musuh. “Melawan musuh” merupakan ungkapan Indonesia yang alami.
