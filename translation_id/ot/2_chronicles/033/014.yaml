source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֡ן בָּנָ֣ה חוֹמָ֣ה חִֽיצוֹנָ֣ה לְ/עִיר דָּוִ֡יד מַעְרָבָ/ה֩ לְ/גִיח֨וֹן בַּ/נַּ֜חַל וְ/לָ/ב֨וֹא בְ/שַׁ֤עַר הַ/דָּגִים֙ וְ/סָבַ֣ב לָ/עֹ֔פֶל וַ/יַּגְבִּיהֶ֖/הָ מְאֹ֑ד וַ/יָּ֧שֶׂם שָֽׂרֵי חַ֛יִל בְּ/כָל הֶ/עָרִ֥ים הַ/בְּצֻר֖וֹת בִּ/יהוּדָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: id
  text: Sesudah itu, Manasye membangun tembok luar bagi Kota Daud, di sebelah barat Gihon di lembah, hingga ke pintu masuk Gerbang Ikan.[a] Ia mengelilingi Ofel[b] dan membuat tembok itu sangat tinggi.[c] Ia juga menempatkan para panglima militer di semua kota berbenteng di Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan menuju pintu masuk Gerbang Ikan.” Ungkapan Ibrani ini dapat dipahami sebagai penanda jangkauan tembok ke arah gerbang itu.
    reason: lexical_alternative
  - marker: b
    text: Ofel adalah nama suatu kawasan tinggi di Yerusalem, kemungkinan di sebelah selatan kompleks Bait Allah.
    reason: cultural_note
  - marker: c
    text: Kata kerja Ibrani juga dapat berarti “mengepung” atau “mengelilingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Menandai urutan waktu dalam narasi dengan ungkapan Indonesia yang alami dan tetap dekat dengan bahasa sumber.
- source_word: בָּנָה חוֹמָה חִיצוֹנָה
  choice: membangun tembok luar
  rationale: בָּנָה berarti membangun dan tidak dengan sendirinya menuntut arti 'membangun kembali'; חוֹמָה חִיצוֹנָה menunjuk pada tembok bagian luar.
- source_word: לְעִיר דָּוִיד
  choice: bagi Kota Daud
  rationale: Preposisi לְ dipahami sebagai tujuan atau kepentingan pembangunan tembok bagi kota tersebut; 'Kota Daud' adalah bentuk nama tempat yang wajar dalam bahasa Indonesia.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: di sebelah barat Gihon di lembah
  rationale: Menyampaikan arah atau lokasi barat relatif terhadap Gihon, sementara נַחַל dalam konteks topografi ini diterjemahkan secara mudah dipahami sebagai 'lembah'.
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: sampai ke jalan masuk Gerbang Ikan
  rationale: Infinitif dengan לְ berfungsi secara spasial dan menunjukkan jangkauan tembok menuju akses masuk gerbang.
- source_word: וְסָבַב לָעֹפֶל
  choice: Ia mengelilingi Ofel
  rationale: Kata kerja maskulin tunggal paling wajar melanjutkan Manasye sebagai subjek; סבב dapat berarti berkeliling atau mengelilingi. Bentuk ini menjaga struktur Ibrani tanpa menjadikan 'tembok' yang feminin sebagai subjek gramatikal.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: membuat tembok itu sangat tinggi
  rationale: Bentuk kausatif menyatakan membuat atau meninggikan, dan sufiks feminin merujuk kembali kepada tembok. Penyebutan ulang 'tembok itu' memperjelas rujukan dalam bahasa Indonesia.
- source_word: שָׂרֵי חַיִל
  choice: para panglima militer
  rationale: Frasa ini menunjuk kepada pejabat atau komandan pasukan; 'panglima militer' jelas, modern, dan sesuai konteks.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: di semua kota berbenteng
  rationale: Menyatakan penempatan yang tersebar di seluruh kota pertahanan yang dimaksud.
theological_decisions:
- issue: Subjek tindakan mengelilingi Ofel
  choice: 'Manasye tetap menjadi subjek: ''Ia mengelilingi Ofel'''
  alternative: Tembok itu mengelilingi Ofel
  rationale: Kata kerja וְסָבַב berbentuk maskulin tunggal, sedangkan חוֹמָה ('tembok') feminin. Terjemahan mempertahankan petunjuk gramatikal sumber, sambil mencatat bahwa secara konseptual tindakan itu dilakukan melalui pembangunan tembok.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat memakai bentuk yang lazim dalam tradisi Indonesia: Kota Daud, Gihon, Gerbang Ikan, Ofel, dan Yehuda. Struktur naratif dibuat lancar tanpa menghilangkan ketegangan gramatikal mengenai subjek tindakan mengelilingi Ofel.'
