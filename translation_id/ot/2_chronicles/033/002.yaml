  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, sesuai dengan kekejian-kekejian bangsa-bangsa yang telah Yahweh halau dari hadapan anak-anak Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih idiomatis, “orang Israel.” Secara harfiah, “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Bentuk wayyiqtol menyampaikan tindakan lampau dalam narasi. Kata sifat berartikel הָרַע dipakai secara substantival, sehingga diterjemahkan secara alami sebagai “apa yang jahat”.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan Ibrani ini menyatakan penilaian Yahweh. Terjemahan “di mata” mempertahankan metafora sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: כְּתוֹעֲבוֹת
  choice: mengikuti perbuatan-perbuatan keji
  rationale: Prefiks כְּ menyatakan kesesuaian atau peniruan. תוֹעֲבוֹת menunjuk pada hal atau praktik yang sangat menjijikkan secara moral dan keagamaan; “perbuatan-perbuatan keji” menyampaikan makna itu secara jelas tanpa mengaburkan unsur praktik.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks ini, istilah tersebut menunjuk pada bangsa-bangsa non-Israel yang mendiami negeri itu.
- source_word: הוֹרִישׁ
  choice: telah dihalau
  rationale: Bentuk Hifil dari ירשׁ di sini berarti mengusir atau menyingkirkan penduduk dari negeri mereka. “Telah dihalau” sesuai dengan tindakan Yahweh yang mendahului peristiwa utama ayat.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Terjemahan ini mempertahankan ungkapan spasial Ibrani yang menyertai tindakan penghalauan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Pilihan ini mempertahankan bentuk kekerabatan maskulin yang harfiah dalam teks Ibrani, sementara catatan kaki menyediakan padanan kolektif yang lebih idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; bangsa Israel
  rationale: Teks sumber secara harfiah memakai ungkapan kekerabatan “anak-anak Israel”. Terjemahan utama mempertahankan bentuk itu tanpa menyiratkan bahwa yang dimaksud hanya anak-anak kecil; alternatif idiomatis dicatat di kaki halaman.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora “di mata Yahweh” serta ungkapan “dari hadapan” dipertahankan karena mudah dipahami dan mencerminkan bentuk Ibrani. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar dijelaskannya.
