  text: וְ/יֶ֨תֶר דִּבְרֵ֣י מְנַשֶּׁה֮ וּ/תְפִלָּת֣/וֹ אֶל אֱלֹהָי/ו֒ וְ/דִבְרֵי֙ הַֽ/חֹזִ֔ים הַֽ/מְדַבְּרִ֣ים אֵלָ֔י/ו בְּ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל הִנָּ֕/ם עַל דִּבְרֵ֖י מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: id
  text: Selebihnya dari riwayat Manasye, doanya kepada Allahnya, dan perkataan para pelihat yang berbicara kepadanya atas nama Yahweh, Allah Israel—semuanya itu tercatat dalam catatan raja-raja Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Kitab Raja-Raja Israel” atau “Tarikh Raja-Raja Israel”. Ungkapan Ibrani ini menunjuk kepada suatu sumber kerajaan tertulis.
    reason: Menjelaskan keluasan makna rumus rujukan Ibrani dan beberapa padanan yang mungkin bagi nama sumber tersebut.
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Selebihnya dari riwayat Manasye
  rationale: Dalam rumus penutup kerajaan, דִּבְרֵי mencakup perbuatan, peristiwa, dan laporan tentang seorang raja, bukan hanya perkataannya. “Riwayat” menyampaikan cakupan itu secara alami dalam bahasa Indonesia.
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: doanya kepada Allahnya
  rationale: Mempertahankan kedua akhiran posesif serta arah preposisi אֶל; bentuk ini juga mempertahankan penekanan personal dalam teks Ibrani.
- source_word: הַחֹזִים
  choice: para pelihat
  rationale: חֹזֶה adalah sebutan khusus bagi tokoh kenabian. “Para pelihat” mempertahankan istilah sumber tanpa meratakannya menjadi “para nabi”.
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: yang berbicara kepadanya
  rationale: Partisipel berfungsi sebagai klausa relatif atributif; terjemahan ini alami dan tidak menambahkan aspek waktu yang tidak perlu.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Terjemahan langsung yang mempertahankan gagasan bahwa para pelihat berbicara dengan membawa nama dan kewenangan ilahi.
- source_word: הִנָּם
  choice: semuanya itu
  rationale: Mengungkapkan daya tunjuk dan penegasan partikel tersebut secara alami; “lihatlah” akan terasa kaku dalam rumus rujukan tertulis bahasa Indonesia.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: tercatat dalam Catatan Raja-Raja Israel
  rationale: Dalam rumus kutipan penulis Tawarikh, frasa ini menunjuk kepada sumber kerajaan tertulis. “Tercatat” menyatakan implikasi dokumenternya, sedangkan “Catatan” tetap cukup luas untuk kitab, tarikh, atau kumpulan riwayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Identitas “raja-raja Israel” dalam rujukan sumber
  choice: Raja-Raja Israel
  alternative: Raja-Raja Yehuda
  rationale: Walaupun Manasye adalah raja Yehuda, teks Masoret secara eksplisit berbunyi “Israel”. Terjemahan tidak menyelaraskannya secara diam-diam menjadi “Yehuda”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, tetapi partikel penunjuk הִנָּם diungkapkan sebagai “semuanya itu” agar alami. Tanda pisah menandai peralihan dari daftar bahan tentang Manasye kepada pernyataan mengenai sumber tertulisnya.
