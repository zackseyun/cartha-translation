  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: id
  text: Aku tidak akan lagi menyingkirkan orang Israel[a] dari negeri yang telah Kutetapkan bagi nenek moyangmu, asalkan mereka sungguh-sungguh melakukan segala yang Kuperintahkan kepada mereka—seluruh hukum, ketetapan, dan peraturan yang Kusampaikan melalui Musa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kaki Israel”, suatu ungkapan yang menunjuk pada keberadaan Israel di negeri itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan tangan Musa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: tidak akan lagi menyingkirkan
  rationale: Gabungan kata יסף dengan bentuk kausatif הסיר menyatakan bahwa tindakan menyingkirkan tidak akan dilakukan lagi. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan arah makna Ibrani.
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: orang Israel[a]
  rationale: Secara harfiah berarti 'kaki Israel', tetapi merupakan ungkapan yang menunjuk pada keberadaan Israel di negeri itu. Teks utama menyampaikan maknanya secara wajar, sedangkan catatan kaki mempertahankan citra konkret bahasa Ibrani.
- source_word: מֵעַל הָאֲדָמָה
  choice: dari negeri
  rationale: Dalam konteks perjanjian dan tempat tinggal Israel, הָאֲדָמָה paling tepat diterjemahkan 'negeri'. Unsur מֵעַל menyatakan penyingkiran dari tempat mereka berada.
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: yang telah Kutetapkan bagi nenek moyangmu
  rationale: Bentuk kausatif עמד di sini menyatakan penetapan atau penempatan. 'Kutetapkan' mengungkapkan tindakan ilahi tanpa menghasilkan ungkapan Indonesia yang kaku; 'nenek moyangmu' merupakan padanan modern bagi אֲבֹתֵיכֶם.
- source_word: רַק אִם
  choice: asalkan
  rationale: Ungkapan ini memperkenalkan syarat yang tegas. 'Asalkan' alami dalam bahasa Indonesia dan mempertahankan sifat bersyarat dari pernyataan tersebut.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: sungguh-sungguh melakukan
  rationale: Konstruksi ini berarti menjaga atau memperhatikan agar melakukan sesuatu dengan saksama. 'Sungguh-sungguh melakukan' menyampaikan ketaatan yang penuh perhatian, bukan sekadar tindakan biasa.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: segala yang Kuperintahkan kepada mereka
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh serta akhiran pronominal 'kepada mereka' dalam teks Ibrani.
- source_word: לְכָל הַתּוֹרָה וְהַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: yaitu seluruh hukum, ketetapan, dan peraturan
  rationale: Ketiga istilah hukum tetap dibedakan. 'Hukum' menyampaikan תּוֹרָה dalam konteks daftar hukum perjanjian, חֻקִּים menjadi 'ketetapan', dan מִשְׁפָּטִים menjadi 'peraturan'. Kata 'yaitu' memperjelas hubungan frasa ini dengan segala yang diperintahkan tanpa menambah isi baru.
- source_word: בְּיַד מֹשֶׁה
  choice: yang Kusampaikan melalui Musa[b]
  rationale: Ungkapan harfiah 'dengan tangan Musa' menyatakan perantaraan atau keagenan. 'Melalui Musa' menyampaikan maksud itu dengan jelas dalam bahasa Indonesia modern, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat bersyarat dari keberadaan Israel di negeri itu
  choice: Janji untuk tidak lagi menyingkirkan Israel dinyatakan dengan syarat ketaatan mereka.
  alternative: Memahami ayat ini sebagai jaminan tanpa syarat atau sebagai syarat yang hanya bersifat retoris.
  rationale: Frasa רַק אִם secara nyata memperkenalkan syarat. Terjemahan 'asalkan' mempertahankan ketegangan teologis tersebut tanpa menarik kesimpulan yang melampaui konteks perjanjian dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Pilihan 'nenek moyang', 'negeri', 'ketetapan', dan 'peraturan' dimaksudkan agar mudah dipahami pembaca umum sambil mempertahankan corak perjanjian dan pembedaan istilah hukum dalam sumber Ibrani.
