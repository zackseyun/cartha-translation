base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: id
  text: Ia membangun mezbah-mezbah bagi seluruh bala tentara langit[a] di kedua pelataran rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh bala tentara surgawi.” Ungkapan Ibrani ini merujuk pada bala langit yang dipuja dalam agama astral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol Qal dari בנה melanjutkan narasi tentang tindakan Manasye pada masa lampau. Dalam narasi Indonesia, kala lampau dipahami dari konteks sehingga tidak perlu penanda khusus.
- source_word: מִזְבְּחוֹת
  choice: mazbah-mazbah
  rationale: Bentuk jamak dari מזבח. 'Mazbah' merupakan padanan baku dan bermartabat untuk tempat persembahan atau pembakaran dupa; pengulangan menyatakan jamak secara jelas.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: bagi seluruh bala tentara langit
  rationale: Ungkapan ini dapat menunjuk benda-benda atau kuasa-kuasa langit yang menjadi objek pemujaan astral. 'Bala tentara langit' mempertahankan citra dan idiom Ibrani, sedangkan 'bagi' menyatakan bahwa mazbah itu dibangun untuk menghormati mereka.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: di kedua pelataran
  rationale: Kata bilangan secara khusus menunjukkan dua pelataran. 'Kedua pelataran' alami dalam bahasa Indonesia dan tetap eksplisit.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Padanan langsung yang mempertahankan ungkapan Ibrani 'rumah YHWH' dan nama perjanjian ilahi tanpa menafsirkannya lebih jauh sebagai 'Bait Allah'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Identitas צְבָא הַשָּׁמַיִם
  choice: bala tentara langit
  alternative: benda-benda langit; penghuni langit
  rationale: Ungkapan Ibrani dapat mencakup benda atau kuasa surgawi yang dipuja dalam agama astral. Terjemahan idiomatis yang harfiah mempertahankan keluasan dan ketegangan maknanya; catatan menjelaskan konteks kultis tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Pelataran' dipilih untuk konteks bangunan suci, dan susunan kalimat mengikuti alur naratif alami tanpa menerjemahkan waw pembuka secara mekanis.
