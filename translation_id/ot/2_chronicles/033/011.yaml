  text: וַ/יָּבֵ֨א יְהוָ֜ה עֲלֵי/הֶ֗ם אֶת שָׂרֵ֤י הַ/צָּבָא֙ אֲשֶׁר֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וַ/יִּלְכְּד֥וּ אֶת מְנַשֶּׁ֖ה בַּ/חֹחִ֑ים וַ/יַּֽאַסְרֻ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יּוֹלִיכֻ֖/הוּ בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: id
  text: Maka Yahweh mendatangkan para panglima tentara raja Asyur melawan mereka. Para panglima itu menangkap Manasye dengan kait[a], membelenggunya dengan belenggu perunggu, lalu membawanya ke Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat berarti “kait” atau “duri”; dalam konteks ini, sebagian penafsir memahaminya lebih umum sebagai alat pengekang yang dipasang pada tawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: mendatangkan ... untuk menyerang mereka
  rationale: Bentuk kausatif dari בוא menyatakan bahwa Yahweh membuat pasukan itu datang; dalam konteks militer, עַל menunjukkan tindakan bermusuhan terhadap mereka.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: para panglima tentara raja Asyur
  rationale: Menyampaikan kepemimpinan militer serta hubungan para panglima itu dengan raja Asyur secara ringkas dan alami.
- source_word: וַיִּלְכְּדוּ
  choice: menangkap
  rationale: Dalam konteks militer, לכד berarti menangkap atau merebut; objeknya adalah Manasye sebagai tawanan.
- source_word: בַּחֹחִים
  choice: dengan kait-kait
  rationale: חֹחִים berbentuk jamak dan dapat menunjuk pada kait yang dipakai untuk mengekang tawanan; citra konkret teks dipertahankan, sementara ketidakpastian leksikal dicatat dalam catatan kaki.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: membelenggunya dengan belenggu perunggu
  rationale: אסר berarti mengikat atau membelenggu, sedangkan נְחֻשְׁתַּיִם menunjuk pada alat pengekang dari perunggu, kemungkinan sepasang belenggu.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: membawanya ke Babel
  rationale: Bentuk kausatif הלך menyatakan membawa atau menggiring, dan akhiran penunjuk arah pada בָּבֶלָה menyatakan tujuan ke Babel.
theological_decisions:
- issue: Peran Yahweh dalam serangan Asyur
  choice: Yahweh secara aktif mendatangkan para panglima Asyur untuk menyerang mereka.
  alternative: Yahweh sekadar mengizinkan mereka datang.
  rationale: Bentuk kausatif וַיָּבֵא secara langsung mengaitkan datangnya pasukan itu dengan tindakan Yahweh; terjemahan tidak melunakkannya menjadi sekadar izin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan “para panglima itu” memperjelas pelaku verba jamak tanpa menimbulkan ambiguitas. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
