base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: id
  text: Ketika ia berada dalam kesesakan, ia memohon perkenanan[a] Yahweh, Allahnya, dan sangat merendahkan diri di hadapan Allah para leluhurnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memohon belas kasihan kepada Yahweh, Allahnya” atau “bersungguh-sungguh memohon kepada Yahweh, Allahnya”. Secara harfiah, ungkapan Ibrani ini berkaitan dengan “melunakkan wajah” seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Allah bapak-bapaknya”; dalam konteks ini maksudnya adalah Allah para pendahulu atau leluhurnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: Ketika ia berada dalam kesesakan
  rationale: Konstruksi ini menyatakan keadaan pada waktu itu; “berada dalam kesesakan” menyampaikan pengalaman terimpit atau menderita tanpa mempersempitnya pada satu bentuk penderitaan tertentu.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: memohon perkenanan
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan melunakkan atau mengambil hati seseorang, tetapi secara idiomatis berarti memohon belas kasihan atau perkenan. Pilihan ini mempertahankan unsur permohonan dan relasi secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Akhiran pronominal menyatakan kepunyaan atau relasi; bentuk “Allahnya” ringkas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּכָּנַע מְאֹד
  choice: dan sangat merendahkan diri
  rationale: Bentuk Niphal כנע dapat dipahami secara refleksif dalam konteks pertobatan Manasye, sedangkan מְאֹד memberi penegasan tingkat yang kuat.
- source_word: מִלִּפְנֵי
  choice: di hadapan
  rationale: Ungkapan yang secara harfiah berhubungan dengan “muka” berfungsi idiomatis untuk menunjukkan keberadaan di hadapan atau dalam hadirat seseorang.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Allah para leluhurnya
  rationale: Dalam konteks sejarah perjanjian, אבות menunjuk kepada generasi-generasi pendahulu. “Para leluhurnya” alami dan jelas bagi pembaca Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan אֲבֹתָיו dalam ungkapan perjanjian
  choice: para leluhurnya
  alternative: bapak-bapaknya atau nenek moyangnya
  rationale: Bentuk Ibrani secara leksikal berarti “bapak-bapaknya”, tetapi dalam ungkapan ini merujuk kepada generasi pendahulu Israel. “Para leluhurnya” menyampaikan rujukan historis tersebut tanpa memberi kesan bahwa yang dimaksud hanya ayah biologis Manasye.
- issue: Daya tindak bentuk Niphal וַיִּכָּנַע
  choice: merendahkan diri
  alternative: direndahkan atau menundukkan diri
  rationale: Konteks menggambarkan tanggapan Manasye dalam kesesakan. Terjemahan refleksif wajar, tetapi kemungkinan nuansa pasif dalam bentuk Ibrani tetap diakui.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Struktur ayat mengikuti urutan gagasan Ibrani, sementara idiom yang tidak alami dialihkan menurut maknanya. Nama “Yahweh” dipertahankan, dan dua catatan kaki menjelaskan idiom permohonan serta ungkapan leluhur.
