base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: id
  text: Doanya, bagaimana permohonannya dikabulkan, segala dosanya dan ketidaksetiaannya, serta tempat-tempat di mana ia membangun bukit-bukit pengurbanan dan mendirikan benda-benda pemujaan Asyera[a] serta patung-patung pahatan sebelum ia merendahkan diri—lihatlah, semuanya itu tertulis dalam catatan para pelihat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: asyerim, yaitu benda-benda pemujaan yang berkaitan dengan Asyera; bentuknya mungkin berupa tiang-tiang Asyera.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dalam catatan Hozai.” Kata Ibrani terakhir mungkin merupakan nama diri, bukan sebutan bagi para pelihat.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: doanya
  rationale: Padanan langsung dan alami untuk תְּפִלָּה, tanpa mempersempit maknanya menjadi sekadar permohonan tertentu.
- source_word: הֵעָתֶר לוֹ
  choice: bagaimana permohonannya dikabulkan
  rationale: Bentuk ini menyampaikan tanggapan yang baik terhadap doa, tetap pasif, dan tidak menambahkan subjek eksplisit yang tidak disebutkan dalam klausa Ibrani.
- source_word: כָל חַטָּאתוֹ
  choice: segala dosanya
  rationale: Kata benda tunggal Ibrani berfungsi kolektif; ungkapan Indonesia ini menyampaikan keseluruhan dosa secara alami.
- source_word: מַעְלוֹ
  choice: ketidaksetiaannya
  rationale: מעל menyatakan pelanggaran kepercayaan atau ketidaksetiaan, dengan kemungkinan nuansa perjanjian; padanan ini jelas tanpa menjadi terlalu teknis.
- source_word: בָּמוֹת
  choice: bukit-bukit pengurbanan
  rationale: Istilah Indonesia yang lazim untuk tempat pemujaan lokal yang disebut בָּמוֹת, sekaligus mempertahankan citra tradisional 'tempat tinggi' tanpa memakai frasa yang mudah disalahpahami.
- source_word: הָאֲשֵׁרִים
  choice: lambang-lambang Asyera
  rationale: Bentuk jamak ini menunjuk benda-benda kultis yang berkaitan dengan Asyera. 'Lambang-lambang' tetap cukup luas dan tidak memastikan bahwa semuanya berbentuk tiang.
- source_word: הַפְּסִלִים
  choice: patung-patung pahatan
  rationale: Mempertahankan makna konkret פסילים sebagai benda kultis yang dipahat, bukan hanya fungsi teologisnya sebagai berhala.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: sebelum ia merendahkan diri
  rationale: Menangkap makna refleksif/intransitif bentuk Ibrani dan urutan waktunya secara alami.
- source_word: הִנָּם
  choice: lihatlah, semuanya itu
  rationale: Mempertahankan fungsi penunjuk-presentatif dan nada sastra dari הִנָּם tanpa menambah isi.
- source_word: כְּתוּבִים עַל דִּבְרֵי חוֹזָי
  choice: tertulis dalam catatan para pelihat
  rationale: Memahami חוֹזָי sebagai bentuk yang merujuk kepada para pelihat dan דִּבְרֵי sebagai bahan atau catatan tertulis; kemungkinan nama diri dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Sifat perendahan diri Manasye dalam הִכָּנְעוֹ
  choice: sebelum ia merendahkan diri
  alternative: sebelum ia direndahkan
  rationale: Bentuk Ibrani secara wajar mendukung makna refleksif atau intransitif dan sesuai dengan penekanan narasi, tetapi tidak diperluas menjadi rumusan teologis tentang pertobatan atau keselamatan.
- issue: Pelaku yang mengabulkan permohonan
  choice: bagaimana permohonannya dikabulkan
  alternative: bagaimana Allah menjawabnya
  rationale: Konteks mengisyaratkan Allah sebagai pelaku, tetapi klausa ini tidak menyebutkan pelaku secara eksplisit; bentuk pasif menjaga kekompakan dan ketegangan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah kultis dijelaskan tanpa memasukkan tafsiran denominasi. Tanda [a] ditempatkan pada istilah Asyera yang diterangkannya, sedangkan [b] menandai ambiguitas frasa penutup.
