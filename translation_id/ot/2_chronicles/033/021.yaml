  text: בֶּן עֶשְׂרִ֧ים וּ/שְׁתַּ֛יִם שָׁנָ֖ה אָמ֣וֹן בְּ/מָלְכ֑/וֹ וּ/שְׁתַּ֣יִם שָׁנִ֔ים מָלַ֖ךְ בִּֽ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/021.yaml
  text: Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.
translation:
  language: id
  text: Amon berumur dua puluh dua tahun ketika ia menjadi raja, dan ia memerintah selama dua tahun di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: berumur dua puluh dua tahun
  rationale: Ungkapan usia Ibrani ini secara harfiah berarti 'anak dua puluh dua tahun'. Bahasa Indonesia secara alami menyatakannya dengan 'berumur dua puluh dua tahun'.
- source_word: אָמ֣וֹן
  choice: Amon
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Preposisi ב dengan infinitif konstruk dari מלך menunjukkan waktu naik takhta; pilihan ini menyampaikan makna tersebut secara alami.
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: selama dua tahun
  rationale: Keterangan 'selama' memperjelas bahwa dua tahun merupakan durasi pemerintahannya, sebagaimana ditunjukkan oleh konteks sintaksis.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Dalam konteks ini, verba מלך berarti menjalankan pemerintahan sebagai raja selama suatu masa; 'memerintah' merupakan padanan Indonesia yang wajar dan tepat.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi lokatif dan nama tempat menunjukkan lokasi atau pusat pemerintahannya.
