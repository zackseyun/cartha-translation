source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: id
  text: Namun, ia tidak merendahkan diri di hadapan Yahweh seperti Manasye, ayahnya, merendahkan diri.[a] Sebab Amon sendiri memperbanyak kesalahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti Manasye, ayahnya, merendahkan diri di hadapan Yahweh.”
    reason: Ungkapan “di hadapan Yahweh” secara eksplisit mengikuti tindakan Amon, tetapi secara makna dapat pula dipahami sebagai unsur yang diulangi dalam perbandingan dengan tindakan Manasye.
lexical_decisions:
- source_word: נִכְנַע
  choice: merendahkan diri
  rationale: Bentuk Niphal di sini menyatakan tindakan merendahkan atau menundukkan diri, khususnya dalam konteks pertobatan; frasa ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan tindakan Manasye.
- source_word: מִלִּפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menunjuk pada sikap seseorang di hadapan atau dalam kehadiran Allah. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: כְּהִכָּנַע
  choice: seperti ... merendahkan diri
  rationale: Preposisi perbandingan dengan infinitif כנע menjadikan tindakan Manasye sebagai pembanding dan mengulang akar kata yang sama untuk menegaskan kontras.
- source_word: מְנַשֶּׁה אָבִיו
  choice: Manasye, ayahnya
  rationale: Susunan aposisional ini alami dalam bahasa Indonesia dan dengan jelas mengidentifikasi hubungan Manasye dengan Amon.
- source_word: כִּי
  choice: sebaliknya
  rationale: Dalam konteks ini partikel tersebut mengantar pernyataan yang menegaskan kontras antara pertobatan Manasye dan bertambahnya kesalahan Amon; “sebaliknya” menyampaikan hubungan wacana itu secara alami.
- source_word: הוּא אָמוֹן
  choice: Amon sendiri
  rationale: Gabungan pronomina dan nama diri bersifat menegaskan. “Amon sendiri” mempertahankan tekanan pada pribadi Amon tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: הִרְבָּה
  choice: semakin menambah
  rationale: Bentuk Hiphil dari רבה berarti membuat bertambah atau memperbanyak. “Semakin menambah” menyampaikan perkembangan kesalahan Amon dengan bahasa Indonesia yang wajar.
- source_word: אַשְׁמָה
  choice: kesalahannya
  rationale: Dalam konteks penilaian moral ini kata tersebut menunjuk pada kesalahan atau keadaan bersalah, bukan persembahan penebus salah. Bentuk posesif memperjelas bahwa kesalahan itu adalah kesalahan Amon.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Sifat tindakan Amon dan Manasye dalam נכנע
  choice: merendahkan diri
  alternative: menundukkan diri; direndahkan
  rationale: Konteks membandingkan tanggapan pribadi kedua raja di hadapan Allah. Terjemahan refleksif mempertahankan unsur tanggung jawab manusia tanpa memperluasnya menjadi rumusan doktrinal tentang pertobatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “merendahkan diri” dipertahankan demi mencerminkan pengulangan akar Ibrani, sedangkan “Amon sendiri” mempertahankan penegasan tanpa susunan yang kaku.
