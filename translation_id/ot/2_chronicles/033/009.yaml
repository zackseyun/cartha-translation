  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: id
  text: Demikianlah Manasye menyesatkan Yehuda dan penduduk Yerusalem untuk melakukan kejahatan yang lebih besar daripada bangsa-bangsa yang telah dimusnahkan oleh Yahweh di hadapan orang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diungkapkan sebagai “orang Israel” atau “umat Israel.”'
    reason: Menjelaskan bentuk harfiah dan cakupan kolektif ungkapan Ibrani בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיֶּתַע
  choice: menyesatkan
  rationale: Bentuk Hifil dari תעה menyatakan tindakan menyebabkan orang lain menyimpang atau tersesat; “menyesatkan” mempertahankan makna kausatif itu secara ringkas dan alami.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Yehuda dan penduduk Yerusalem
  rationale: Mempertahankan kedua objek kolektif secara eksplisit; “penduduk” merupakan padanan Indonesia yang wajar bagi bentuk partisipial יֹשְׁבֵי.
- source_word: לַעֲשׂוֹת רָע מִן הַגּוֹיִם
  choice: sehingga mereka berbuat lebih jahat daripada bangsa-bangsa
  rationale: מִן menyatakan perbandingan, sehingga tingkat kejahatan perlu dibuat eksplisit. “Sehingga” mengungkapkan akibat dari tindakan Manasye tanpa menghilangkan hubungan erat dengan infinitif Ibrani.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks sejarah ini, istilah tersebut menunjuk kepada bangsa-bangsa terdahulu di negeri itu, bukan kategori teologis yang lebih kemudian seperti “orang bukan Yahudi”.
- source_word: הִשְׁמִיד
  choice: musnahkan
  rationale: Kata ini menyatakan pembinasaan yang kuat; “musnahkan” jelas, bermartabat, dan lazim dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Mempertahankan idiom spasial dalam konteks penaklukan, yaitu bangsa-bangsa disingkirkan atau dimusnahkan dari hadapan Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini secara idiomatis menunjuk kepada bangsa Israel sebagai keturunan Yakub/Israel. “Keturunan Israel” mempertahankan unsur kekerabatan tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama diri dipertahankan agar identitas perjanjian yang dinyatakan teks tetap terlihat, tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan ungkapan korporat בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; bani Israel; orang Israel
  rationale: Walaupun bentuk Ibraninya maskulin secara gramatikal, dalam konteks ini ungkapan tersebut mewakili umat Israel secara kolektif. Pilihan ini menjaga unsur garis keturunan sekaligus tidak membatasi rujukannya pada laki-laki.
- issue: Hubungan infinitif לַעֲשׂוֹת dengan tindakan Manasye
  choice: sehingga mereka berbuat
  alternative: untuk berbuat
  rationale: Konstruksi itu dapat bernuansa tujuan atau hasil. Dalam konteks ini “sehingga” menyampaikan hasil nyata dari penyesatan Manasye, sementara alternatif “untuk” tetap mungkin secara gramatikal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur perbandingan dan kuatnya tindakan penghukuman dipertahankan, sementara ungkapan korporat dibuat alami bagi pembaca masa kini.
