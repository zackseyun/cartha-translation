base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: id
  text: Ia membangun kembali tempat-tempat pemujaan di bukit yang telah dirobohkan oleh Hizkia, ayahnya.[a] Ia mendirikan mazbah-mazbah bagi para Baal[b] dan membuat tiang-tiang Asyera.[c] Ia sujud menyembah segenap bala tentara langit[d] dan beribadah kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kembali lalu membangun”; kedua kata kerja Ibrani itu menyatakan bahwa ia membangun lagi apa yang sebelumnya telah dirobohkan.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibraninya jamak, “para Baal”, kemungkinan menunjuk pada berbagai perwujudan, gelar lokal, atau patung Baal. Sebagian terjemahan memakai bentuk tunggal, “Baal”.
    reason: lexical_alternative
  - marker: c
    text: Atau “Asyera-Asyera”. Istilah Ibrani ini dapat menunjuk pada tiang atau lambang pemujaan yang dikaitkan dengan dewi Asyera.
    reason: lexical_alternative
  - marker: d
    text: Di sini “bala tentara langit” menunjuk pada benda-benda langit yang dijadikan sasaran pemujaan; bandingkan 2 Raja-Raja 21:3.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: membangun kembali
  rationale: Gabungan harfiah ‘kembali lalu membangun’ secara idiomatis menyatakan tindakan membangun lagi atau memulihkan sesuatu yang telah dihancurkan.
- source_word: הַבָּמוֹת
  choice: bukit-bukit pengurbanan
  rationale: Istilah ini mempertahankan sebutan khas bagi lokasi pemujaan kuno, yang sering berada di tempat tinggi, dan lazim dipahami dalam bahasa Alkitab Indonesia.
- source_word: נִתַּץ
  choice: dirobohkan
  rationale: Kata kerja ini menunjuk pada tindakan meruntuhkan atau menghancurkan bangunan maupun sarana pemujaan.
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: Hizkia, ayahnya
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan aposisional dalam teks Ibrani.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: mendirikan mazbah-mazbah bagi para Baal
  rationale: ‘Mendirikan’ menyampaikan makna הקים, sedangkan bentuk jamak ‘para Baal’ mempertahankan bentuk Ibrani yang dapat menunjuk pada berbagai perwujudan atau sebutan lokal Baal.
- source_word: אֲשֵׁרוֹת
  choice: tiang-tiang Asyera
  rationale: Bentuk jamak dipertahankan, sedangkan ‘tiang’ mengomunikasikan bahwa yang dimaksud kemungkinan besar ialah benda-benda pemujaan yang dikaitkan dengan dewi Asyera.
- source_word: וַיִּשְׁתַּחוּ
  choice: sujud menyembah
  rationale: Ungkapan ini mempertahankan tindakan jasmani berupa bersujud sekaligus memperjelas fungsi pemujaannya dalam konteks.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: kepada segenap bala tentara langit
  rationale: Terjemahan ini mempertahankan metafora kolektif dalam bahasa Ibrani; konteks menunjukkan benda-benda langit yang dijadikan sasaran pemujaan.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: beribadah kepada mereka
  rationale: Dalam konteks kultis, עבד berarti melayani sebagai tindakan ibadah. Pilihan ini tetap membedakannya dari tindakan bersujud pada klausa sebelumnya.
theological_decisions:
- issue: Penyebutan unsur-unsur pemujaan kafir secara khusus
  choice: Mempertahankan istilah konkret ‘bukit-bukit pengurbanan’, ‘para Baal’, dan ‘tiang-tiang Asyera’
  alternative: Menggeneralisasikannya sebagai ‘berhala’ atau ‘dewa-dewa palsu’
  rationale: Teks Ibrani merinci bentuk-bentuk kemurtadan tertentu; istilah konkret mempertahankan informasi sejarah dan keagamaan tanpa menggantinya dengan rangkuman teologis.
- issue: Makna ‘bala tentara langit’
  choice: Mempertahankan ungkapan Ibrani dalam teks dan menjelaskan bahwa konteksnya menunjuk pada benda-benda langit
  alternative: Menerjemahkannya langsung sebagai ‘para malaikat’ atau ‘segala benda langit’
  rationale: Dalam rangkaian praktik pemujaan terlarang ini, frasa tersebut paling wajar menunjuk pada benda-benda langit sebagai sasaran pemujaan. Ungkapan sumber dipertahankan, sementara catatan kaki mencegahnya disalahpahami sebagai malaikat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah kultis yang khas dipertahankan untuk ketepatan sejarah, dengan catatan kaki bagi istilah yang dapat terasa asing atau ambigu. Klausa panjang Ibrani dibagi menjadi tiga kalimat agar jelas bagi pembaca umum tanpa mengubah urutan gagasan.
