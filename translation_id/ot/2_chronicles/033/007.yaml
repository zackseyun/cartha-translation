id: 2CH.33.7
reference: 2 Chronicles 33:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: id
  text: Ia menempatkan patung pahatan[a], yaitu berhala yang telah dibuatnya, di rumah Allah. Tentang rumah itu Allah telah berfirman kepada Daud dan kepada Salomo, anaknya, “Di rumah ini dan di Yerusalem, yang telah Kupilih dari antara semua suku Israel, Aku akan menempatkan nama-Ku untuk selama-lamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “patung pahatan berhala itu”; bahasa Ibrani memakai dua istilah yang berdekatan maknanya untuk patung berhala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ia menempatkan
  rationale: Kata kerja שׂים menyatakan tindakan menaruh atau menempatkan; “menempatkan” alami dalam narasi Indonesia dan selaras dengan pengulangan idiom pada akhir ayat.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: patung pahatan, yaitu berhala
  rationale: 'Dua nomina Ibrani yang berdekatan tetap terlihat: פֶּסֶל diterjemahkan “patung pahatan,” sedangkan הַסֶּמֶל dijelaskan secara aposisional sebagai “berhala.”'
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dibuatnya
  rationale: Bentuk ini menunjukkan bahwa pembuatan patung mendahului tindakan menempatkannya, tanpa mengaburkan subjek laki-laki yang sama.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: di rumah Allah
  rationale: Mempertahankan gambaran harfiah בַּיִת, “rumah,” serta sebutan אֱלֹהִים, “Allah,” tanpa menggantinya dengan “Bait Allah” atau “TUHAN.”
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: Tentang rumah itu Allah telah berfirman
  rationale: Klausa relatif Ibrani merujuk pada rumah Allah; pemecahan menjadi kalimat baru menghasilkan bahasa Indonesia yang jelas sambil mempertahankan hubungan tersebut.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: kepada Daud dan kepada Salomo, anaknya
  rationale: Pengulangan “kepada” mencerminkan kedua preposisi Ibrani, dan “anaknya” mempertahankan keterangan hubungan Salomo dengan Daud.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם
  choice: Di rumah ini dan di Yerusalem
  rationale: Mempertahankan pengulangan kata “rumah” dan pasangan lokasi rumah serta kota dalam ucapan ilahi.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: yang telah Kupilih dari antara semua suku Israel
  rationale: “Dari antara” menyampaikan fungsi מִן sebagai pemilihan dari suatu kelompok, sedangkan “telah Kupilih” menandai tindakan yang hasilnya tetap berlaku.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: Aku akan menempatkan nama-Ku
  rationale: Mempertahankan idiom perjanjian yang konkret tentang Allah menempatkan nama-Nya, tanpa menafsirkannya menjadi kehadiran, kediaman, atau pendirian nama.
- source_word: לְעֵילֹום
  choice: untuk selama-lamanya
  rationale: Padanan Indonesia yang wajar dan bermartabat untuk durasi yang tidak berakhir dalam pernyataan ilahi ini.
theological_decisions:
- issue: Penggunaan nama atau gelar ilahi
  choice: Allah
  alternative: TUHAN
  rationale: Teks Ibrani memakai אֱלֹהִים, bukan יהוה; karena itu terjemahan tidak memasukkan nama perjanjian yang tidak terdapat dalam sumber.
- issue: Idiom teologi rumah Allah
  choice: Aku akan menempatkan nama-Ku untuk selama-lamanya
  alternative: Aku akan membuat nama-Ku berdiam di sana untuk selama-lamanya
  rationale: Terjemahan mempertahankan idiom Ibrani tentang penempatan nama Allah dan tidak menyelesaikan maknanya melalui parafrasa teologis.
- issue: Cakupan klausa relatif pemilihan
  choice: Yerusalem, yang telah Kupilih dari antara semua suku Israel
  alternative: rumah ini dan Yerusalem, yang telah Kupilih dari antara semua suku Israel
  rationale: Secara tata bahasa, kata ganti relatif tunggal paling dekat dengan Yerusalem, tetapi ungkapan “dari antara semua suku Israel” melibatkan pemilihan lokasi dari lingkungan kesukuan. Terjemahan mempertahankan susunan sumber dan tidak menambahkan penjelasan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Rumah Allah” dipertahankan untuk mencerminkan בֵּית הָאֱלֹהִים dan pengulangan בַּבַּיִת, sementara pemecahan klausa relatif menjadi kalimat kedua menghindari konstruksi Indonesia yang berat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia.
