  text: וַ/יִּתְפַּלֵּ֣ל אֵלָ֗י/ו וַ/יֵּעָ֤תֶר ל/וֹ֙ וַ/יִּשְׁמַ֣ע תְּחִנָּת֔/וֹ וַ/יְשִׁיבֵ֥/הוּ יְרוּשָׁלִַ֖ם לְ/מַלְכוּת֑/וֹ וַ/יֵּ֣דַע מְנַשֶּׁ֔ה כִּ֥י יְהוָ֖ה ה֥וּא הָֽ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: id
  text: Ia berdoa kepada-Nya, dan Dia berkenan menerima permohonannya[a], mendengarkan permohonannya, serta membawanya kembali ke Yerusalem untuk memerintah sebagai raja[b]. Maka Manasye mengetahui bahwa Yahweh adalah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dia membiarkan diri-Nya dimohon olehnya” atau “Dia menanggapi permohonannya dengan baik.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “kepada kerajaannya,” yakni kepada kekuasaan atau kedudukannya sebagai raja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: Ia berdoa kepada-Nya
  rationale: Bentuk hitpael התפלל lazim berarti 'berdoa'. Pronomina pada אֵלָיו merujuk kepada Allah; huruf kapital memperjelas rujukan tanpa menambahkan nama yang tidak terdapat dalam klausa ini.
- source_word: וַיֵּעָתֶר לוֹ
  choice: Dia berkenan menerima permohonannya
  rationale: Bentuk nifal עתר menyatakan bahwa Allah membiarkan diri-Nya dimohon atau menanggapi permohonan dengan baik. Ungkapan ini mempertahankan tanggapan ilahi yang positif tanpa menggambarkannya secara emosional secara berlebihan.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: mendengarkan permohonannya
  rationale: תחנה adalah permohonan sungguh-sungguh untuk belas kasihan atau kemurahan. 'Mendengarkan' dalam konteks ini menyampaikan perhatian dan tanggapan, bukan sekadar mendengar bunyi.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: membawanya kembali ke Yerusalem untuk memerintah sebagai raja
  rationale: Hifil שוב berarti 'membawa kembali'. מלכותו secara harfiah berkaitan dengan kerajaan atau kekuasaannya sebagai raja; dalam bahasa Indonesia, 'untuk memerintah sebagai raja' menyampaikan pemulihan kepada pemerintahan rajawi secara alami.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: Maka Manasye mengakui
  rationale: ידע berarti 'mengetahui', tetapi dalam konteks pengenalan religius setelah pertolongan Allah, 'mengakui' secara alami menyampaikan pengetahuan yang diinsafi. 'Maka' menunjukkan akibat dalam alur narasi.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: bahwa Yahweh adalah Allah
  rationale: Nama perjanjian יהוה ditransliterasikan 'Yahweh'. Pronomina penegas הוּא tercermin dalam ketegasan pernyataan, tanpa menambahkan 'satu-satunya', yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama perjanjian dan sesuai dengan lapisan konsultasi proyek.
- issue: Daya pengakuan כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: bahwa Yahweh adalah Allah
  alternative: bahwa hanya Yahweh yang adalah Allah
  rationale: Klausa menegaskan bahwa Yahweh adalah Allah, tetapi kata 'hanya' tidak muncul secara tersurat. Terjemahan tidak mempersempit ambiguitas atau menambah eksklusivitas secara diam-diam.
- issue: Makna וַיֵּעָתֶר לוֹ sebagai tanggapan Allah
  choice: Dia berkenan menerima permohonannya
  alternative: Dia tergerak oleh permohonannya; Dia membiarkan diri-Nya dimohon olehnya
  rationale: Pilihan utama menyatakan tanggapan yang penuh kemurahan tanpa menyiratkan perubahan emosi Allah yang tidak diwajibkan oleh bentuk nifal Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rangkaian tiga tindakan Allah dipertahankan sebagai deret paralel. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan umum teks keagamaan Indonesia; nama Manasye mengikuti bentuk Indonesia yang mapan.
