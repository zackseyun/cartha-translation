  yaml_path: translation/ot/2_chronicles/033/001.yaml
  text: Manasseh was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem.
translation:
  language: id
  text: Manasye berumur dua belas tahun ketika ia menjadi raja, dan ia memerintah selama lima puluh lima tahun di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: berumur dua belas tahun
  rationale: Ini merupakan rumusan usia yang lazim dalam bahasa Ibrani. Terjemahan ini menyampaikan maknanya secara tepat dan alami dalam bahasa Indonesia modern.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Menggunakan bentuk nama yang sudah lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Dalam rumusan masa pemerintahan ini, konstruksi tersebut menunjuk pada waktu Manasye naik takhta; ungkapan ini alami dan tidak menambah informasi di luar teks.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: selama lima puluh lima tahun
  rationale: Bilangan majemuk Ibrani dinyatakan menurut susunan bilangan yang wajar dalam bahasa Indonesia; kata 'selama' memperjelas fungsi durasinya.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Dalam konteks kerajaan, verba מלך berarti menjalankan pemerintahan sebagai raja. 'Memerintah' merupakan padanan ringkas dan alami.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב menyatakan lokasi, sehingga 'di Yerusalem' adalah padanan langsung.
