  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: id
  text: Namun, rakyat negeri itu[a] membunuh semua orang yang telah bersekongkol melawan Raja Amon, lalu rakyat negeri itu mengangkat Yosia, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “rakyat negeri itu” dapat menunjuk kepada penduduk negeri secara umum, mungkin dengan nuansa sosial-politik tertentu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: membunuh
  rationale: Dalam konteks ini נכה menyatakan tindakan memukul yang berakibat kematian; konteks penghukuman para persekongkol dan paralelnya dalam 2 Raja-Raja mendukung terjemahan eksplisit 'membunuh'.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Ungkapan ini mempertahankan acuan kepada penduduk negeri sekaligus terdengar alami dalam bahasa Indonesia; nuansa sosial-politiknya dibiarkan terbuka dan dijelaskan dalam catatan kaki.
- source_word: כָּל הַקֹּשְׁרִים
  choice: semua orang yang telah bersekongkol
  rationale: Partisipel קשר menunjuk kepada orang-orang yang bergabung dalam suatu persekongkolan; bentuk klausa ini alami dan mempertahankan aspek tindakan mereka.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: melawan Raja Amon
  rationale: Sesudah קשר, עַל menandai sasaran persekongkolan; 'melawan' menyampaikan hubungan tersebut dengan jelas.
- source_word: וַיַּמְלִיכוּ
  choice: mengangkat ... menjadi raja
  rationale: Bentuk kausatif מלך berarti menjadikan seseorang raja. 'Mengangkat ... menjadi raja' akurat tanpa menambahkan upacara penobatan yang tidak dinyatakan.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: Yosia, anaknya
  rationale: Konstruksi aposisional mengidentifikasi Yosia sebagai anak Amon; tanda koma membuat hubungan itu jelas dalam bahasa Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menandai pergantian atau suksesi; 'menggantikan dia' merupakan ungkapan Indonesia yang alami dalam konteks kerajaan.
- source_word: וַ
  choice: Namun ... lalu
  rationale: Waw pertama menyatakan kontras dengan pembunuhan Amon pada ayat sebelumnya, sedangkan waw kedua melanjutkan urutan tindakan; 'Namun' dan 'lalu' menyampaikan hubungan wacana itu secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Berkomplot' juga mungkin, tetapi 'bersekongkol' mempertahankan nuansa konspirasi. Hanya satu catatan kaki dipakai karena alternatif 'semua persekongkol' tidak menambah informasi penting dalam bahasa Indonesia; marker [a] ditempatkan langsung sesudah ungkapan yang dijelaskan.
