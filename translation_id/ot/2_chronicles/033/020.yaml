  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: id
  text: Manasye kemudian berbaring bersama nenek moyangnya, dan mereka menguburkannya di rumahnya.[a] Amon, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di rumahnya”; dalam konteks kerajaan, kata Ibrani ini dapat merujuk pada istana atau kompleks kediaman kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan halus ini mempertahankan gambaran kematian dalam formula kerajaan Ibrani, tetapi lebih alami dan jelas dalam bahasa Indonesia daripada terjemahan harfiah 'tidur dengan bapak-bapaknya'.
- source_word: וַיִּקְבְּרֻהוּ
  choice: orang-orang menguburkan dia
  rationale: Bentuk Ibraninya aktif jamak dengan Manasye sebagai objek. Subjeknya tidak disebutkan, sehingga 'orang-orang' mempertahankan ketaktentuan itu.
- source_word: בֵּיתוֹ
  choice: di istananya
  rationale: Secara harfiah berarti 'di rumahnya', tetapi dalam konteks seorang raja kata בַּיִת dapat menunjuk pada istana atau kompleks kediaman kerajaan. 'Istana' menyampaikan maksud kontekstual secara alami, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam formula pergantian takhta, bentuk ini secara alami menyatakan bahwa Amon mulai memerintah sebagai raja.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi, ungkapan ini berarti mengambil kedudukan atau memerintah sebagai pengganti seseorang.
