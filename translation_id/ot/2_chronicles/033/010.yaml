  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: id
  text: Yahweh berbicara kepada Manasye dan rakyatnya, tetapi mereka tidak mendengarkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak mengindahkan” atau “tidak memperhatikan.” Kata kerja Ibrani ini dapat menyatakan mendengarkan dengan sungguh-sungguh yang menyiratkan tanggapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Bentuk piel dari דבר dengan אֶל secara wajar berarti “berbicara kepada”; pilihan ini mempertahankan tindakan penyampaian firman tanpa menambahkan isi yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: עַמּוֹ
  choice: rakyatnya
  rationale: Dalam konteks Manasye sebagai raja, עַם dengan sufiks orang ketiga tunggal paling alami menunjuk kepada rakyat yang berada di bawah pemerintahannya; “bangsanya” juga mungkin, tetapi kurang langsung dalam konteks ini.
- source_word: וְלֹא
  choice: tetapi ... tidak
  rationale: Waw di sini menyatakan kontras antara Yahweh yang berbicara dan kegagalan para pendengar untuk menanggapi; “tetapi” menyampaikan alur tersebut secara alami dalam bahasa Indonesia.
- source_word: הִקְשִׁיבוּ
  choice: tidak mengindahkan-Nya
  rationale: Hifil קשב berarti mendengarkan dengan perhatian atau mengindahkan. “Mengindahkan” menangkap unsur mendengar yang semestinya menghasilkan tanggapan, sedangkan objek “-Nya” dibuat eksplisit secara alami dengan merujuk kepada Yahweh.
theological_decisions:
- issue: Acuan subjek jamak dalam הִקְשִׁיבוּ
  choice: “mereka” mencakup Manasye dan rakyatnya
  alternative: Subjek jamak hanya merujuk kepada rakyat, sedangkan Manasye disebut secara terpisah sebagai penerima firman.
  rationale: Dua pihak disebut sebagai penerima perkataan—Manasye dan rakyatnya—lalu diikuti verba jamak. Pembacaan paling langsung mencakup keduanya, sementara pronomina “mereka” tidak memperinci lebih jauh daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Rakyatnya” sesuai dengan konteks kerajaan, sedangkan “mengindahkan” mempertahankan nuansa mendengarkan secara penuh perhatian dan menanggapi. Penanda catatan kaki [a] ditempatkan tepat setelah klausa terkait.
