  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: id
  text: Kemudian ia memulihkan mazbah Yahweh dan mempersembahkan di atasnya korban-korban keselamatan[a] dan korban syukur[b]. Ia menyuruh Yehuda mengabdi kepada Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban-korban kesejahteraan”; dapat juga diterjemahkan “korban-korban persekutuan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ucapan syukur”; dalam konteks persembahan korban, yang dimaksud ialah korban syukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַן
  choice: memulihkan
  rationale: Bentuk Hifil dari כון dapat berarti menyiapkan, menegakkan, atau menata. Dalam konteks pemulihan ibadah setelah mazbah itu sebelumnya disingkirkan atau dinodai, “memulihkan” menyatakan bahwa mazbah dikembalikan ke keadaan dan fungsi yang semestinya.
- source_word: מִזְבַּח יְהוָה
  choice: mazbah Yahweh
  rationale: “Mazbah” merupakan istilah Indonesia yang baku dan ringkas untuk tempat persembahan korban; nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: וַיִּזְבַּח עָלָיו
  choice: mempersembahkan di atasnya
  rationale: זבח menyatakan tindakan mempersembahkan korban, dan עָלָיו merujuk kembali kepada mazbah. Objek korbannya disebut langsung sesudah frasa ini.
- source_word: זִבְחֵי שְׁלָמִים
  choice: korban-korban keselamatan
  rationale: Istilah ini menunjuk jenis korban yang berkaitan dengan keadaan sejahtera atau damai dan persekutuan. “Korban keselamatan” mempertahankan istilah tradisional yang dekat dengan unsur שׁלם, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: וְתוֹדָה
  choice: dan korban syukur
  rationale: תודה dapat berarti ucapan syukur maupun korban syukur. Karena berada dalam konteks tindakan mempersembahkan korban di atas mazbah, “korban syukur” membuat nuansa kultisnya jelas tanpa mengubah makna dasarnya.
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Ia menyuruh Yehuda
  rationale: Secara harfiah berarti “ia berkata kepada Yehuda,” tetapi isi infinitif berikutnya menyampaikan arahan. “Menyuruh” alami dalam bahasa Indonesia dan tidak sekuat “memerintahkan”; “Yehuda” dipertahankan sebagai sebutan kolektif bagi rakyatnya.
- source_word: לַעֲבוֹד
  choice: mengabdi kepada
  rationale: עבד dalam hubungan dengan Allah mencakup pelayanan, ketaatan, dan ibadah. “Mengabdi kepada” mempertahankan cakupan yang lebih luas daripada sekadar kegiatan ibadah ritual.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan konstruksi kepunyaan yang ringkas dan lazim, dengan tetap menonjolkan identitas Yahweh sebagai Allah Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan membedakannya dari gelar umum bagi Tuhan.
- issue: Cakupan makna עבד dalam hubungan dengan Allah
  choice: mengabdi kepada
  alternative: beribadah kepada atau melayani
  rationale: Kata ini dapat mencakup ibadah, pelayanan, dan ketaatan perjanjian. “Mengabdi kepada” tidak membatasi maknanya hanya pada upacara ibadah dan tetap terdengar wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang khidmat tetapi mudah dipahami. Kalimat dibagi menjadi dua agar alami. Istilah “mazbah” dipertahankan karena tepat dan dikenal dalam konteks Alkitab; “mengabdi” dipilih untuk menjaga keluasan makna pelayanan dan ibadah.
