  text: Lalu para abdinya bersekongkol melawannya dan membunuhnya di rumahnya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: bersekongkol
  rationale: Ungkapan קָשַׁר עַל menyatakan persekongkolan melawan seseorang, khususnya dalam konteks pembunuhan raja. “Bersekongkol” alami dan mempertahankan nuansa tindakan bersama yang bermusuhan.
- source_word: עָלָיו
  choice: melawan dia
  rationale: Dengan קָשַׁר, preposisi עַל menandai sasaran persekongkolan. “Melawan dia” menyampaikan relasi tersebut secara jelas dan idiomatis.
- source_word: עֲבָדָיו
  choice: para hambanya
  rationale: Dalam lingkungan kerajaan, עֶבֶד dapat menunjuk para pelayan atau abdi raja. “Para hambanya” mempertahankan istilah umum teks tanpa menentukan bahwa mereka budak atau pejabat.
- source_word: וַיְמִיתֻהוּ
  choice: membunuhnya
  rationale: Bentuk Hifil dari מוּת menyatakan bahwa mereka menyebabkan dia mati. Dalam bahasa Indonesia modern, “membunuhnya” menyampaikan makna kausatif itu secara langsung dan wajar.
- source_word: בְּבֵיתוֹ
  choice: di rumahnya sendiri
  rationale: Preposisi בְּ menyatakan lokasi, sedangkan sufiks posesif menunjuk rumah miliknya. “Sendiri” menegaskan kepemilikan secara alami tanpa mengubah tempat yang disebutkan teks menjadi “istana”.
