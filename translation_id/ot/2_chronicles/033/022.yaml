  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, sama seperti yang telah dilakukan Manasye, ayahnya. Amon mempersembahkan kurban kepada semua patung pahatan[a] yang telah dibuat Manasye, ayahnya, dan melayani patung-patung itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhala.” Kata Ibrani ini secara khusus menunjuk pada patung yang dipahat atau diukir.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyembah patung-patung itu.” Kata kerja Ibraninya secara harfiah berarti “melayani” dan sering dipakai untuk pelayanan keagamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan Ibrani ini berarti melakukan apa yang dinilai jahat. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya penilaian moralnya.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan ini menyatakan penilaian ilahi; bentuk idiomatis Indonesia tersebut tetap dekat dengan gambaran bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: sama seperti yang telah dilakukan
  rationale: Menunjukkan bahwa tindakan Manasye mendahului dan menjadi pola bagi tindakan Amon.
- source_word: מְנַשֶּׁה אָבִיו
  choice: Manasye, ayahnya
  rationale: Mempertahankan hubungan aposisional teks Ibrani dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: הַפְּסִילִים
  choice: patung pahatan
  rationale: Istilah ini secara khusus menunjuk pada benda keagamaan yang dipahat atau diukir; terjemahan konkret ini lebih tepat daripada istilah umum 'berhala'.
- source_word: זִבַּח
  choice: mempersembahkan kurban kepada
  rationale: Dalam konteks ibadah, kata kerja ini menyatakan tindakan mempersembahkan kurban; preposisi Ibrani menunjukkan pihak yang menerima persembahan itu.
- source_word: וַיַּעַבְדֵם
  choice: dan melayani patung-patung itu
  rationale: Kata kerja dasarnya berarti melayani. Dalam konteks patung keagamaan, pelayanan itu merupakan tindakan penyembahan, tetapi terjemahan mempertahankan keluasan makna leksikalnya.
- source_word: אָמֹון
  choice: Amon
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Makna עבד dalam konteks penyembahan berhala
  choice: melayani patung-patung itu
  alternative: menyembah patung-patung itu
  rationale: Makna dasar kata kerja tersebut adalah 'melayani'; konteks keagamaan membuat unsur penyembahan jelas tanpa harus mempersempit terjemahannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur teks Ibrani tanpa menjadi kaku. Penanda catatan kaki ditempatkan tepat setelah istilah yang dijelaskan.
