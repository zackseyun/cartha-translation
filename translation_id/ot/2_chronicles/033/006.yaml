id: 2CH.33.6
reference: 2 Chronicles 33:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: id
  text: Ia membuat anak-anaknya melewati api di Lembah Ben-Hinom[a]. Ia melakukan tenung, membaca pertanda, dan melakukan sihir, serta berurusan dengan para medium dan pemanggil roh[b]. Ia makin banyak melakukan yang jahat di mata Yahweh sehingga membangkitkan murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan maknanya secara lebih eksplisit, “mengurbankan anak-anaknya dalam api.” Ungkapan Ibraninya secara harfiah berbunyi “membuat anak-anaknya melewati api.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “para medium dan pemanggil roh” menunjuk pada pelaku praktik yang berkaitan dengan meminta petunjuk dari orang mati atau roh.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: membuat anak-anaknya melewati api
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah menyatakan bahwa ia membuat anak-anaknya melewati api, tanpa menjadikan implikasi pengurbanan anak sebagai parafrasa utama.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: di Lembah Ben-Hinom
  rationale: Memperlakukan nama tempat itu sebagai nama diri sambil mempertahankan unsur Ibrani Ben-Hinom dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: וְעוֹנֵן
  choice: melakukan tenung
  rationale: Kata ini menunjuk pada praktik meramal atau mencari petunjuk gaib; 'tenung' membedakannya dari tindakan membaca pertanda yang disebut sesudahnya.
- source_word: וְנִחֵשׁ
  choice: membaca pertanda
  rationale: Mengungkapkan praktik menafsirkan tanda atau alamat untuk meramal, sekaligus mempertahankan perbedaannya dari עונן.
- source_word: וְכִשֵּׁף
  choice: melakukan sihir
  rationale: Padanan yang lugas dan mudah dipahami untuk praktik ilmu gaib atau mantra.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: berurusan dengan para pemanggil arwah dan ahli nujum
  rationale: Ungkapan Ibrani dengan עשה tidak menentukan secara sempit apakah ia berkonsultasi, mempekerjakan, atau mempraktikkannya sendiri; 'berurusan dengan' mempertahankan keluasan itu. Kedua sebutan menunjuk pada pelaku praktik gaib yang dikaitkan dengan arwah atau roh.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: semakin banyak melakukan
  rationale: Menyampaikan makna intensifikasi atau pelipatgandaan dalam konstruksi רבה dengan infinitif secara lebih alami dalam bahasa Indonesia daripada terjemahan harfiah yang kaku.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: apa yang jahat di mata Yahweh
  rationale: Mempertahankan rumusan evaluatif Ibrani 'di mata' serta menerjemahkan nama ilahi יהוה sebagai Yahweh.
- source_word: לְהַכְעִיסוֹ
  choice: sehingga membangkitkan murka-Nya
  rationale: Kata penghubung menyampaikan nuansa hasil atau tujuan dari tindakan itu, sedangkan bentuk kausatifnya dinyatakan dengan 'membangkitkan murka'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu dan selaras dengan lapisan konsultasi yang telah diaudit.
- issue: Apakah implikasi pengurbanan anak dibuat eksplisit
  choice: Mempertahankan ungkapan 'membuat anak-anaknya melewati api' dalam teks utama
  alternative: mengurbankan anak-anaknya dalam api
  rationale: Ungkapan itu sangat mungkin merujuk pada ritus pengurbanan anak, tetapi teks Ibraninya memakai idiom 'melewati api'. Terjemahan utama mempertahankan bentuk tersebut, sedangkan tafsiran yang lebih eksplisit diberikan dalam catatan.
- issue: Cakupan tindakan yang dinyatakan oleh וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: berurusan dengan
  alternative: meminta petunjuk kepada; mempekerjakan; bertindak sebagai
  rationale: Konstruksi Ibrani sukar dan tidak secara pasti menetapkan hubungan Manasye dengan para pelaku atau praktik tersebut. Pilihan yang luas menghindari penyelesaian ambigu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah diikuti. 'Ben-Hinom' dipertahankan sebagai nama tempat. Istilah praktik gaib dibuat cukup berbeda satu sama lain tanpa mengklaim batas makna yang lebih pasti daripada sumber Ibraninya. Semua penanda catatan kaki muncul dalam teks utama.
