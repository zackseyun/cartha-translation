- from: Ia membuat anak-anaknya melewati api di Lembah Ben-Hinom[a]. Ia melakukan tenung, membaca pertanda, dan melakukan sihir, serta berurusan dengan para pemanggil arwah dan ahli nujum[b]. Ia semakin banyak melakukan apa yang jahat di mata Yahweh sehingga membangkitkan murka-Nya.
  to: Ia membuat anak-anaknya melewati api di Lembah Ben-Hinom[a]. Ia melakukan tenung, membaca pertanda, dan melakukan sihir, serta berurusan dengan para medium dan pemanggil roh[b]. Ia makin banyak melakukan yang jahat di mata Yahweh sehingga membangkitkan murka-Nya.
