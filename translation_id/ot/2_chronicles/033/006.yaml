review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan utama pada umumnya mengikuti teks Ibrani dengan baik: idiom tentang membuat anak-anak melewati api dipertahankan, nama Yahweh tepat, dan rangkaian praktik gaib tidak dipersempit secara tidak perlu. Namun, “ahli nujum” untuk יִדְּעוֹנִי tumpang tindih dengan tindakan meramal/membaca pertanda yang sudah menerjemahkan istilah sebelumnya dan kurang mencerminkan kaitan khusus istilah itu dengan roh atau arwah.'
  naturalness: Bahasa dasarnya baku dan jelas. “Ia semakin banyak melakukan apa yang jahat” dapat diperhalus menjadi “Ia makin banyak melakukan yang jahat,” yang lebih idiomatis sambil tetap mempertahankan aspek peningkatan/pelipatgandaan dari הִרְבָּה לַעֲשׂוֹת.
  terminology: “Para medium dan pemanggil roh” membedakan dua sebutan Ibrani secara lebih baik daripada “para pemanggil arwah dan ahli nujum,” tanpa mengunci secara berlebihan sifat tepat kedua praktik tersebut. “Yahweh,” “Lembah Ben-Hinom,” “tenung,” “membaca pertanda,” dan “sihir” dapat dipertahankan.
  issues:
