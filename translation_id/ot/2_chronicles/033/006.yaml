    issue: “ahli nujum” untuk יִדְּעוֹנִי kurang tepat dan bertumpang tindih secara semantis.
    rationale: יִדְּעוֹנִי dalam pasangan dengan אוֹב lazim menunjuk pelaku yang terkait roh/familiar spirit, bukan sekadar peramal. Istilah “ahli nujum” juga mengaburkan pembedaan dari עוֹנֵן dan נִחֵשׁ yang telah diterjemahkan sebagai tenung dan membaca pertanda.
  - severity: low
    issue: Frasa “semakin banyak melakukan apa yang jahat” agak kaku.
    rationale: Konstruksi רבה + infinitif menyatakan intensifikasi atau kelimpahan tindakan jahat. “Makin banyak melakukan yang jahat” lebih alami dalam bahasa Indonesia dan tetap mempertahankan nuansa tersebut.
