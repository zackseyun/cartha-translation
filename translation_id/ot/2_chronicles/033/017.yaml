  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: id
  text: Namun, rakyat masih mempersembahkan kurban di tempat-tempat pemujaan di bukit,[a] tetapi hanya kepada Yahweh, Allah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, «tempat-tempat tinggi»; istilah Ibrani ini menunjuk tempat-tempat ibadah setempat, yang sering berada di tempat tinggi.
    reason: Menjelaskan istilah בָּמוֹת tanpa membatasi maknanya menjadi bukit-bukit secara fisik saja.
lexical_decisions:
- source_word: אֲבָל
  choice: Namun
  rationale: Menandai pertentangan dengan pembaruan yang disebut sebelumnya secara alami dan lugas.
- source_word: עוֹד
  choice: masih
  rationale: Menyatakan bahwa praktik tersebut terus berlangsung meskipun pembaruan telah dilakukan.
- source_word: הָעָם
  choice: rakyat
  rationale: Merujuk secara kolektif kepada penduduk atau bangsa dalam konteks naratif.
- source_word: זֹבְחִים
  choice: mempersembahkan kurban
  rationale: Mengungkapkan tindakan ritual זבח dengan bahasa Indonesia yang alami dan jelas.
- source_word: בַּבָּמוֹת
  choice: di bukit-bukit pengurbanan
  rationale: Istilah ini menunjuk tempat-tempat ibadah setempat yang dikenal sebagai bamot; kata depan ב diterjemahkan secara idiomatis sebagai 'di'.
- source_word: רַק
  choice: tetapi hanya
  rationale: Menunjukkan pembatasan terhadap penerima kurban, sekaligus mempertahankan pertentangan bahwa tempat-tempat tersebut masih digunakan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Kata depan ל menandai pihak yang menerima kurban, sedangkan nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Menerjemahkan bentuk berkonstruksi dengan sufiks pronominal secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan pembatas רַק dalam klausa tentang bukit-bukit pengurbanan
  choice: Kurban dipersembahkan hanya kepada Yahweh, meskipun tetap dipersembahkan di bukit-bukit pengurbanan.
  alternative: Rakyat hanya mempersembahkan kurban di bukit-bukit yang dikhususkan bagi Yahweh.
  rationale: Susunan Ibrani mengaitkan pembatasan dengan penerima kurban, לַיהוָה אֱלֹהֵיהֶם, bukan dengan lokasi. Dengan demikian, ketegangan bahwa pembaruan itu belum tuntas tetap terpelihara.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Kalimat mempertahankan kontras ganda dalam teks: praktik di bukit-bukit pengurbanan masih berlangsung, tetapi tujuan ibadahnya dibatasi hanya kepada Yahweh.'
