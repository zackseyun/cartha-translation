  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: id
  text: Ia menyingkirkan dewa-dewa asing dan patung berhala[a] dari Bait Yahweh, serta semua mazbah yang telah dibangunnya di gunung tempat Bait Yahweh berada[b] dan di Yerusalem, lalu melemparkannya ke luar kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "patung" atau "gambar". Kata Ibrani סֶמֶל dapat menunjuk kepada patung atau citra yang digunakan dalam pemujaan.
    reason: lexical_alternative
  - marker: b
    text: Atau "di bukit tempat Bait Yahweh berada"; yaitu kawasan bukit tempat Bait Yahweh berdiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Ia menyingkirkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan menyebabkan sesuatu disingkirkan. 'Menyingkirkan' alami dalam bahasa Indonesia dan sesuai dengan konteks pembaruan ibadah.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: dewa-dewa asing
  rationale: Frasa konstruksi ini menunjuk kepada ilah-ilah yang bukan Yahweh. 'Dewa-dewa asing' jelas dan wajar dalam bahasa Indonesia.
- source_word: הַסֶּמֶל
  choice: patung berhala
  rationale: סֶמֶל adalah patung atau benda visual kultis. 'Patung berhala' menyatakan bentuk benda dan fungsi keagamaannya tanpa mengandaikan bahwa benda itu pasti berupa ukiran.
- source_word: מִבֵּית יְהוָה
  choice: dari Rumah Yahweh
  rationale: בֵּית יְהוָה secara harfiah berarti 'Rumah Yahweh' dan dalam konteks menunjuk kepada Bait Allah. Bentuk ini mempertahankan ungkapan Ibrani serta nama ilahi.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: juga semua mazbah
  rationale: '''Mazbah'' adalah padanan Indonesia yang lazim dan tepat bagi tempat persembahan kurban. ''Juga'' menghubungkan objek tambahan secara alami.'
- source_word: אֲשֶׁר בָּנָה
  choice: yang telah dibangunnya
  rationale: Bentuk perfek merujuk kepada pembangunan yang telah terjadi sebelum tindakan pembuangan. Bentuk enklitik '-nya' secara alami merujuk kepada pelaku yang sama.
- source_word: בְּהַר בֵּית יְהוָה
  choice: di gunung Rumah Yahweh
  rationale: Terjemahan ini mempertahankan הַר sebagai 'gunung' dan hubungan konstruksi dengan Rumah Yahweh. Dalam konteks, tempat itu adalah kawasan bukit tempat Bait Allah berdiri.
- source_word: וּבִירוּשָׁלָם
  choice: dan di Yerusalem
  rationale: Frasa ini memperluas lokasi mazbah dari kawasan Rumah Yahweh ke Yerusalem secara lebih luas.
- source_word: וַיַּשְׁלֵךְ
  choice: lalu membuang semuanya
  rationale: שׁלך menggambarkan pembuangan yang tegas. 'Semuanya' memasok objek tersirat dan secara wajar merangkum dewa-dewa asing, patung berhala, dan mazbah-mazbah.
- source_word: חוּצָה לָעִיר
  choice: ke luar kota
  rationale: Adverbia berarah חוּצָה bersama לָעִיר menunjukkan gerak menuju tempat di luar batas kota; 'ke luar kota' mempertahankan arah tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi dan merupakan transliterasi ilmiah yang umum tanpa menggantinya dengan sebuah gelar.
- issue: Sifat סֶמֶל sebagai benda kultis
  choice: patung berhala
  alternative: patung atau gambar
  rationale: Konteks reformasi keagamaan mendukung nuansa berhala, tetapi istilah Ibrani dapat menunjuk secara lebih umum kepada patung atau citra kultis; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Rumah Yahweh' mempertahankan metafora sumber, sedangkan 'mazbah' menjaga register Kitab Suci yang dikenal luas. Struktur kalimat dibuat mengalir tanpa menghilangkan urutan tindakan atau lokasi dalam bahasa Ibrani.
