  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: id
  text: Ia membangun mezbah-mezbah di rumah Yahweh[a], rumah yang mengenainya Yahweh telah berfirman, “Di Yerusalem nama-Ku akan ada untuk selama-lamanya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bait Yahweh.” Secara harfiah, “di rumah Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi, “nama-Ku akan ada untuk selama-lamanya”; bandingkan ungkapan Alkitab yang umum, “nama-Ku akan ada di sana untuk selama-lamanya.”
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: Ia membangun
  rationale: Bentuk Qal perfektif orang ketiga tunggal maskulin dari בנה berarti “membangun.” Konjungsi וּ tidak perlu diterjemahkan tersendiri karena kesinambungan narasi sudah wajar dalam bahasa Indonesia.
- source_word: מִזְבְּחוֹת
  choice: mezbah-mezbah
  rationale: Bentuk jamak מִזְבֵּחַ; pengulangan nomina merupakan penanda jamak yang jelas dan alami dalam konteks ini.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Secara harfiah בַּיִת berarti “rumah,” dan dalam konteks ini menunjuk pada bait. Terjemahan mempertahankan ungkapan Ibrani, sementara catatan kaki memberikan padanan kontekstual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: yang tentangnya Yahweh telah berfirman
  rationale: אֲשֶׁר menghubungkan firman berikut dengan rumah Yahweh. “Telah berfirman” menyatakan bahwa ucapan itu mendahului tindakan yang sedang diceritakan tanpa menganggap bentuk verba Ibrani sebagai kala lampau sempurna secara tersendiri.
- source_word: בִּירוּשָׁלִַם
  choice: Di Yerusalem
  rationale: Mempertahankan posisi awal frasa tempat dalam kutipan, sesuai urutan dan penekanan teks Ibrani.
- source_word: יִהְיֶה שְּׁמִי
  choice: nama-Ku akan ada
  rationale: היה di sini secara harfiah menyatakan keberadaan, “nama-Ku akan ada.” Terjemahan tidak menambahkan kata “di sana,” yang tidak terdapat dalam teks ayat ini.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk durasi yang terus berlaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan sebuah gelar.
- issue: Apakah “di sana” perlu ditambahkan pada יִהְיֶה שְּׁמִי
  choice: nama-Ku akan ada
  alternative: nama-Ku akan ada di sana
  rationale: Teks Masoret ayat ini tidak memuat שָׁם (“di sana”). Rumusan yang lebih lengkap dikenal dari ayat-ayat sejajar, tetapi tidak dimasukkan ke dalam teks utama agar bentuk ayat ini tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Rumah Yahweh” mempertahankan metafora sumber, dengan “bait” sebagai alternatif dalam catatan. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
