id: 2CH.29.3
reference: 2 Chronicles 29:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ה֣וּא בַ/שָּׁנָה֩ הָ/רִאשׁוֹנָ֨ה לְ/מָלְכ֜/וֹ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן פָּתַ֛ח אֶת דַּלְת֥וֹת בֵּית יְהוָ֖ה וַֽ/יְחַזְּקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: id
  text: Pada tahun pertama pemerintahannya, pada bulan pertama, ia membuka pintu-pintu Bait Yahweh dan memperbaikinya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memperkuatnya” atau “mengokohkannya”, yakni membuat pintu-pintu itu kembali kuat dan layak digunakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: ia
  rationale: Pronomina mandiri ini menegaskan atau menyebut kembali subjek dalam narasi. Dalam bahasa Indonesia, “ia” sudah wajar tanpa perlu menambahkan “sendiri”.
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: pada tahun pertama pemerintahannya
  rationale: Ungkapan waktu ini menunjuk pada tahun pertama masa pemerintahannya sebagai raja. Rumusan ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: pada bulan pertama
  rationale: Terjemahan langsung dan jelas dari ungkapan waktu Ibrani.
- source_word: פָּתַח
  choice: membuka
  rationale: Kata kerja ini secara langsung berarti membuka dan di sini berobjek pintu-pintu Bait.
- source_word: דַּלְתוֹת
  choice: pintu-pintu
  rationale: Bentuk jamak דַּלְתוֹת merujuk pada daun-daun pintu, bukan gerbang kota. “Pintu-pintu” merupakan padanan Indonesia yang alami.
- source_word: בֵּית יְהוָה
  choice: Bait Yahweh
  rationale: Secara harfiah berarti “rumah Yahweh”, tetapi “Bait Yahweh” secara alami menyatakan rumah ibadah atau bangunan suci yang dimaksud tanpa mengaburkan nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: וַיְחַזְּקֵם
  choice: dan memperbaikinya
  rationale: Bentuk piel dari חזק pada dasarnya berarti membuat kuat. Dengan pintu-pintu sebagai objek dalam konteks pemulihan Bait, tindakan yang dimaksud ialah membuatnya kembali kokoh atau layak, sehingga “memperbaikinya” alami; arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber memakai nama diri ilahi יהוה. “Yahweh” mempertahankannya sebagai nama, alih-alih menggantinya dengan sebuah gelar.
- issue: Makna וַיְחַזְּקֵם dalam konteks pemulihan Bait
  choice: memperbaikinya
  alternative: memperkuatnya; mengokohkannya
  rationale: Kata itu dapat diterjemahkan secara formal sebagai “memperkuatnya”, tetapi konteks pintu-pintu yang dibuka kembali mendukung tindakan perbaikan yang menjadikannya kokoh. Catatan kaki mempertahankan nuansa leksikal alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bait” dipilih karena alami untuk bangunan suci dalam konteks ini, sedangkan nama Yahweh dipertahankan. Penanda catatan kaki ditempatkan sesudah kata yang benar-benar diterangkannya.
