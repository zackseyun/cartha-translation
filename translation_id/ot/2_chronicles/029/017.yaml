source:
  edition: WLC
  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: id
  text: Mereka mulai melakukan pengudusan pada hari pertama bulan pertama. Pada hari kedelapan bulan itu, mereka sampai ke serambi Yahweh[a]. Mereka menguduskan rumah Yahweh selama delapan hari, dan pada hari keenam belas bulan pertama mereka selesai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ruang depan Yahweh” atau “beranda Yahweh.”'
    reason: אוּלָם adalah istilah arsitektural bagi bagian depan Bait Suci dan dapat diterjemahkan dengan beberapa istilah Indonesia yang berdekatan maknanya.
lexical_decisions:
- source_word: וַיָּחֵלּוּ לְקַדֵּשׁ
  choice: mereka mulai melakukan pengudusan
  rationale: Ungkapan ini mempertahankan makna 'mulai' dari חלל bentuk Hifil dan tindakan menjadikan kudus dari קדשׁ, tanpa menambahkan objek yang tidak dinyatakan dalam klausa Ibrani.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: pada hari pertama bulan pertama
  rationale: Ini adalah padanan idiomatis dalam bahasa Indonesia untuk rumus tanggal Ibrani yang secara harfiah menyebut 'satu' pada bulan pertama.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: mereka sampai ke serambi Yahweh
  rationale: בוא dengan ל menyatakan gerak menuju atau sampai ke suatu tempat, sedangkan אוּלָם menunjuk pada serambi atau ruang depan bangunan Bait Suci. 'Sampai ke' tidak memastikan bahwa mereka masuk lebih jauh daripada yang dinyatakan teks.
- source_word: וַיְקַדְּשׁוּ אֶת בֵּית יְהוָה
  choice: mereka menguduskan rumah Yahweh
  rationale: קדשׁ di sini menggambarkan penyiapan ritual bagi penggunaan kudus. 'Menguduskan' mempertahankan hubungan leksikal dengan tindakan pengudusan pada awal ayat, sedangkan 'rumah Yahweh' mempertahankan ungkapan Ibrani bagi Bait Suci.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: selama delapan hari
  rationale: Frasa ini menyatakan rentang waktu yang digunakan untuk menguduskan rumah Yahweh; 'selama delapan hari' alami dalam bahasa Indonesia tanpa memaksakan cara menghitung hari-hari tersebut.
- source_word: כִּלּוּ
  choice: mereka selesai
  rationale: כלה bentuk Piel berarti menyelesaikan atau menuntaskan. 'Mereka selesai' ringkas dan sesuai dengan alur narasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan gelar, tanpa menambahkan penafsiran teologis lain.
- issue: Makna pengudusan Bait Suci
  choice: menguduskan
  alternative: menahirkan; menyucikan
  rationale: Konteks mencakup pembersihan ritual, tetapi קדשׁ terutama menekankan penetapan bagi penggunaan kudus. 'Menguduskan' menjaga cakupan istilah itu tanpa menyempitkannya hanya menjadi pembersihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara objek pada tindakan pengudusan pertama tidak ditambahkan karena tidak disebutkan dalam teks Ibrani. Nama Yahweh dipertahankan sebagai nama diri.
