  source_fidelity: 'Teks Indonesia mengikuti urutan dan rincian Ibrani dengan baik: awal pada hari pertama bulan pertama, tiba di serambi pada hari kedelapan, pengudusan rumah Yahweh selama delapan hari, dan selesai pada hari keenam belas. “Sampai ke” secara tepat tidak memaksakan makna bahwa mereka masuk lebih jauh ke dalam bangunan.'
