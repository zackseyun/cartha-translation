base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: id
  text: Ia menempatkan orang-orang Lewi di rumah Yahweh dengan simbal, harpa, dan lira, sesuai dengan perintah Daud, Gad, pelihat raja itu,[a] dan Natan sang nabi, sebab perintah itu berasal dari Yahweh melalui para nabi-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pelihat” menerjemahkan חֹזֶה, gelar yang berbeda dari “nabi” (נָבִיא), meskipun fungsi keduanya berkaitan erat.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “Sebab melalui tangan Yahweh ada perintah itu, melalui tangan nabi-nabi-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Ia menempatkan
  rationale: Bentuk Hifil dari עמד menyatakan bahwa Hizkia menyuruh orang-orang Lewi mengambil tempat mereka. “Menempatkan” menyampaikan tindakan pengaturan itu secara alami tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan baku dan mudah dipahami untuk kelompok suku sekaligus petugas ibadah ini.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan konkret Ibrani “rumah Yahweh”; dalam konteks ini ungkapan tersebut menunjuk pada bait-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dan membedakannya dari gelar “Tuhan”.
- source_word: בִּמְצִלְתַּיִם
  choice: dengan simbal
  rationale: Prefiks ב instrumental menunjukkan alat yang dipakai; “simbal” merupakan padanan modern yang jelas.
- source_word: בִּנְבָלִים
  choice: harpa
  rationale: נבל adalah alat musik berdawai yang bentuk tepatnya tidak pasti. “Harpa” merupakan padanan umum dan tetap dibedakan dari כנור.
- source_word: וּבְכִנֹּרוֹת
  choice: dan lira
  rationale: כנור lazim dipahami sebagai sejenis lira; pilihan ini mempertahankan perbedaan antara kedua alat musik berdawai dalam teks.
- source_word: בְּמִצְוַת
  choice: sesuai dengan perintah
  rationale: Menunjukkan bahwa penataan tersebut dilakukan berdasarkan dan selaras dengan perintah yang disebutkan.
- source_word: גָד חֹזֵה הַמֶּלֶךְ
  choice: Gad—pelihat raja—
  rationale: “Pelihat” mempertahankan istilah חֹזֶה dan tidak menyamakannya begitu saja dengan נָבִיא, sedangkan “raja” mempertahankan hubungan konstruksi dalam bahasa Ibrani.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Bentuk Indonesia yang alami untuk nama dan gelar apposisional tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Menghubungkan klausa terakhir sebagai alasan yang menegaskan sumber ilahi dari perintah itu.
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: berasal dari Yahweh melalui para nabi-Nya
  rationale: 'Menyampaikan idiom “melalui tangan” secara alami: Yahweh adalah sumber perintah, sedangkan para nabi menjadi perantaranya. Bentuk lebih harfiah dicatat dalam catatan kaki.'
theological_decisions:
- issue: Hubungan antara tata ibadah yang diperintahkan Daud dan kewenangan ilahi
  choice: Perintah itu pada akhirnya berasal dari Yahweh dan disampaikan melalui para nabi-Nya.
  alternative: Perintah tersebut semata-mata kebijakan kerajaan Daud yang kemudian diberi pengesahan ilahi.
  rationale: Klausa כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו secara eksplisit menyatakan sumber ilahi sekaligus perantaraan para nabi. Terjemahan mempertahankan kedua lapis pelaku itu tanpa menghapus peran Daud, Gad, atau Natan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Nama ilahi ditulis “Yahweh”. Tanda pisah membantu pembaca mengenali “pelihat raja” sebagai keterangan bagi Gad. Istilah alat musik dibuat jelas bagi pembaca masa kini sambil mempertahankan tiga jenis alat yang berbeda.
