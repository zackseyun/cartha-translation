  - severity: low
    issue: Aposisi untuk Gad dan Natan dapat dibuat lebih alami.
    rationale: Penggunaan koma dan “sang nabi” menghasilkan pembacaan Indonesia yang lebih lancar, sambil tetap mempertahankan gelar “pelihat” yang berbeda dari “nabi”.
