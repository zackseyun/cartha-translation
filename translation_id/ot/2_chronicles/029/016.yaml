  text: וַ/יָּבֹ֣אוּ הַ֠/כֹּהֲנִים לִ/פְנִ֣ימָה בֵית יְהוָה֮ לְ/טַהֵר֒ וַ/יּוֹצִ֗יאוּ אֵ֤ת כָּל הַ/טֻּמְאָה֙ אֲשֶׁ֤ר מָֽצְאוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה לַ/חֲצַ֖ר בֵּ֣ית יְהוָ֑ה וַֽ/יְקַבְּלוּ֙ הַ/לְוִיִּ֔ם לְ/הוֹצִ֥יא לְ/נַֽחַל קִדְר֖וֹן חֽוּצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: id
  text: Kemudian para imam masuk ke bagian dalam rumah TUHAN untuk menahirkannya. Mereka membawa segala kenajisan yang mereka temukan di Bait TUHAN ke pelataran rumah TUHAN. Lalu orang-orang Lewi menerimanya untuk membawanya ke luar, ke Lembah Kidron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: ke bagian dalam rumah TUHAN
  rationale: לִפְנִימָה menunjukkan gerak menuju bagian dalam; ungkapan ini diterjemahkan secara langsung tanpa menentukan ruang tertentu yang tidak disebutkan teks.
- source_word: לְטַהֵר
  choice: untuk menahirkannya
  rationale: Kata kerja ini berarti membersihkan atau menahirkan dari kenajisan; 'menahirkan' mempertahankan nuansa ritual dalam konteks pemulihan Bait Allah.
- source_word: כָּל הַטֻּמְאָה
  choice: segala kenajisan
  rationale: Bentuk tunggal kolektif merujuk pada seluruh kenajisan atau segala hal yang menajiskan; pilihan ini mempertahankan istilah pokok teks tanpa merincinya lebih jauh.
- source_word: הֵיכַל יְהוָה
  choice: Bait TUHAN
  rationale: הֵיכָל dalam konteks ini menunjuk bangunan kudus atau bait, berbeda dari בֵּית yang diterjemahkan 'rumah'.
- source_word: נַחַל קִדְרוֹן
  choice: Lembah Kidron
  rationale: נַחַל dapat menunjuk alur sungai atau lembah berair musiman; 'Lembah Kidron' adalah sebutan geografis Indonesia yang alami dan sesuai konteks.
- source_word: חוּצָה
  choice: ke luar
  rationale: Kata ini menegaskan bahwa kenajisan dibawa keluar dari kawasan Bait; posisinya dipertahankan sebagai keterangan arah.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dengan huruf kapital untuk menandai nama ilahi, tanpa memasukkan rekonstruksi pelafalan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pengulangan 'rumah TUHAN' dan 'Bait TUHAN' dipertahankan karena mencerminkan pembedaan leksikal בֵּית dan הֵיכָל dalam sumber Ibrani. Pronomina '-nya' memiliki rujukan alami kepada rumah TUHAN.
