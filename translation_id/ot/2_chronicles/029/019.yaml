  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: id
  text: “Semua perlengkapan yang Raja Ahas singkirkan[a] selama pemerintahannya dalam ketidaksetiaannya[b] telah kami siapkan dan kami kuduskan. Lihatlah, semuanya ada di hadapan mezbah Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditelantarkan” atau “dikesampingkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ketika ia berlaku tidak setia” atau “dalam pelanggarannya.” Kata Ibrani ini menekankan pelanggaran kepercayaan oleh Ahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: perlengkapan
  rationale: כֵּלִים merupakan istilah luas bagi berbagai benda atau perkakas. Dalam konteks Bait Allah, “perlengkapan” alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada wadah.
- source_word: הִזְנִיחַ
  choice: disingkirkan
  rationale: Bentuk ini menyatakan tindakan menelantarkan atau menyingkirkan sesuatu. “Disingkirkan” mempertahankan unsur tindakan aktif Ahas tanpa menyiratkan bahwa benda-benda itu telah dimusnahkan.
- source_word: בְּמַלְכוּתוֹ
  choice: selama pemerintahannya
  rationale: Preposisi בְּ di sini berfungsi secara temporal; frasa ini merujuk pada masa pemerintahan Ahas.
- source_word: בְּמַעֲלוֹ
  choice: ketika ia berlaku tidak setia
  rationale: מַעַל menunjuk pada pelanggaran kepercayaan atau ketidaksetiaan, khususnya terhadap Allah. Bentuk verbal Indonesia ini menyampaikan hubungan keadaan/sebab secara alami tanpa menghapus bobot moral-religiusnya.
- source_word: הֵכַנּוּ
  choice: telah kami siapkan
  rationale: Hifil כון berarti membuat siap atau menata agar siap digunakan; “siapkan” sesuai dengan pemulihan perlengkapan ibadah.
- source_word: וְהִקְדָּשְׁנוּ
  choice: dan kuduskan
  rationale: Hifil קדשׁ berarti mengkhususkan sebagai kudus. “Kuduskan” mempertahankan makna kultisnya dan lazim dipahami dalam bahasa Indonesia Alkitabiah.
- source_word: וְהִנָּם
  choice: Lihatlah, semuanya ada
  rationale: הִנֵּה dengan pronomina menarik perhatian pada keberadaan dan lokasi perlengkapan itu sekarang. “Lihatlah” mempertahankan daya demonstratif tersebut.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: di hadapan mazbah Yahweh
  rationale: לִפְנֵי menyatakan posisi di depan atau di hadapan; “di hadapan” mempertahankan corak khidmat. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Makna ketidaksetiaan dalam בְּמַעֲלוֹ
  choice: ketika ia berlaku tidak setia
  alternative: dalam pelanggarannya
  rationale: Pilihan utama menyatakan bahwa tindakan Ahas merupakan pelanggaran kepercayaan terhadap Allah, tetapi tidak mempersempitnya menjadi kategori hukum atau doktrin tertentu.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi; “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan objek di awal dipertahankan untuk mengikuti penekanan teks Ibrani, sementara klausa “ketika ia berlaku tidak setia” dibuat idiomatis. “Mazbah” dipakai sebagai istilah ibadah yang ringkas dan mapan.
