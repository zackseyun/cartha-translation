  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: id
  text: Mereka juga menutup pintu-pintu serambi[a], memadamkan pelita-pelita, tidak membakar dupa, dan tidak mempersembahkan kurban bakaran di tempat kudus[b] kepada Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang depan” atau “balai masuk”; kata Ibrani אוּלָם menunjuk pada ruang masuk Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “di kawasan suci”; istilah Ibraninya dapat menunjuk pada tempat atau kawasan yang dikhususkan bagi pelayanan Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: juga
  rationale: Menandai bahwa tindakan ini menambah rangkaian pelanggaran yang disebutkan sebelumnya dan mempertahankan daya kumulatif ayat.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: pintu-pintu serambi
  rationale: אוּלָם menunjuk pada ruang masuk di bagian depan Bait Allah. 'Serambi' alami dalam bahasa Indonesia dan tetap mempertahankan gambaran arsitekturalnya.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: memadamkan pelita-pelita
  rationale: Ungkapan ini menggambarkan dipadamkannya pelita-pelita yang dipakai dalam pelayanan Bait Allah; 'pelita' mempertahankan benda konkret pada latar kuno.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: tidak membakar dupa
  rationale: Bentuk kausatif dari קטר bersama קְטֹרֶת mengacu pada pembakaran dupa secara ritual. Pilihan ini jelas dan tidak menggantinya dengan istilah ibadah yang lebih umum.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: tidak mempersembahkan kurban bakaran
  rationale: עֹלָה adalah istilah teknis bagi kurban yang dibakar seluruhnya. 'Mempersembahkan' menyampaikan fungsi kausatif verba עלה secara wajar dalam bahasa Indonesia.
- source_word: בַקֹּדֶשׁ
  choice: di tempat kudus
  rationale: קֹדֶשׁ dapat menunjuk pada kawasan atau ruang suci dalam Bait Allah. 'Tempat kudus' mempertahankan istilah sumber tanpa menentukan bagian bangunan secara lebih sempit daripada teks.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: kepada Allah Israel
  rationale: Preposisi ל menandai arah atau tujuan persembahan; 'kepada' secara alami menyatakan bahwa kurban itu ditujukan kepada Allah Israel.
theological_decisions:
- issue: Istilah ibadah Bait Allah
  choice: Mempertahankan istilah konkret 'membakar dupa', 'kurban bakaran', dan 'tempat kudus'.
  alternative: Menggeneralisasikannya sebagai 'beribadah' atau 'memberikan persembahan'.
  rationale: Ayat ini merinci kelalaian tertentu dalam pelayanan Bait Allah, bukan sekadar ketidaktaatan beragama secara umum. Istilah konkret menjaga kekhususan historis dan teologis teks.
- issue: Cakupan בַקֹּדֶשׁ
  choice: di tempat kudus
  alternative: di ruang kudus atau di kawasan suci
  rationale: Bahasa Ibrani dapat menunjuk pada tempat suci tanpa memastikan secara mutlak cakupan arsitekturalnya; terjemahan utama dan catatan kaki mempertahankan keluwesan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar tindakan dipertahankan agar kecaman yang bersifat kumulatif tetap terasa. 'Kurban' dipilih sebagai ejaan baku, sedangkan 'pelita' menjaga warna konkret latar Bait Allah tanpa menjadi arkais.
