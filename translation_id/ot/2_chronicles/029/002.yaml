id: 2CH.29.2
reference: 2 Chronicles 29:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh, sesuai dengan segala yang telah dilakukan Daud, bapaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Daud, leluhurnya”; “bapak” di sini menunjukkan garis keturunan dinastis, bukan ayah kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol Qal dari עשה melanjutkan narasi dan berarti ‘ia melakukan’. Konjungsi ו tidak dinyatakan tersendiri karena alur naratifnya sudah alami dalam bahasa Indonesia.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Adjektiva dengan artikel ini berfungsi secara substantival, yakni ‘hal yang benar/lurus’. Ungkapan ‘apa yang benar’ alami dan tepat dalam bahasa Indonesia.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang penilaian dari sudut pandang seseorang dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: כְּכֹל אֲשֶׁר
  choice: sesuai dengan segala yang
  rationale: Pilihan ini menyampaikan kesesuaian sekaligus cakupan menyeluruh yang dinyatakan oleh כ dan כל.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Bentuk perfektum merujuk pada tindakan Daud yang mendahului dan menjadi tolok ukur bagi tindakan Hizkia; ‘telah’ memperjelas hubungan waktu itu.
- source_word: דָּוִיד
  choice: Daud
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: אָבִיו
  choice: bapaknya
  rationale: Kata אָב dapat berarti bapak maupun leluhur. Teks utama mempertahankan bahasa kekerabatan sumber, sedangkan makna dinastisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna ‘Daud, bapaknya’ dalam hubungan dengan Hizkia
  choice: Mempertahankan ‘Daud, bapaknya’ dalam teks utama
  alternative: Daud, leluhurnya
  rationale: Rumus kerajaan Ibrani memakai אָב untuk hubungan garis keturunan dinastis. Terjemahan utama mempertahankan bentuk sumber, sementara catatan kaki mencegah kesan bahwa Daud adalah ayah kandung langsung Hizkia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora ‘di mata’ dipertahankan karena jelas bagi pembaca umum, dan nama ilahi ditampilkan sebagai ‘Yahweh’.
