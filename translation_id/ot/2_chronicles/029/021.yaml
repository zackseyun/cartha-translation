reference: 2 Chronicles 29:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: id
  text: Mereka membawa tujuh ekor sapi jantan, tujuh ekor domba jantan, tujuh ekor anak domba, dan tujuh ekor kambing jantan sebagai kurban penghapus dosa bagi kerajaan, bagi tempat kudus, dan bagi Yehuda. Lalu ia menyuruh keturunan Harun, para imam, mempersembahkan semuanya di atas mazbah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Mereka membawa
  rationale: Bentuk naratif dari בוא menyatakan tindakan membawa hewan-hewan kurban; padanan ini lugas dan tidak menambahkan nuansa seremonial yang tidak dinyatakan secara eksplisit.
- source_word: פָרִים
  choice: sapi jantan
  rationale: Dalam daftar kurban, kata ini menunjuk pada sapi jantan; teks ayat ini tidak secara eksplisit menyebut usianya.
- source_word: אֵילִים
  choice: domba jantan
  rationale: Padanan Indonesia yang jelas bagi domba jantan dalam konteks kurban.
- source_word: כְבָשִׂים
  choice: anak domba
  rationale: Kata ini lazim menunjuk pada anak domba yang dipersembahkan sebagai kurban; jenis kelaminnya tidak perlu ditambahkan karena tidak eksplisit pada bentuk ini.
- source_word: צְפִירֵי עִזִּים
  choice: kambing jantan
  rationale: Frasa konstruksi ini secara khusus menyatakan kambing jantan.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks kultis, חַטָּאת menunjuk pada jenis kurban yang berkaitan dengan dosa atau pemurnian. Istilah Indonesia ini mempertahankan kategori ritual tanpa menguraikan mekanismenya.
- source_word: עַל הַמַּמְלָכָה
  choice: bagi kerajaan
  rationale: עַל dalam konteks persembahan membawa makna demi atau atas nama; 'bagi' menyampaikannya secara alami dan ringkas.
- source_word: הַמִּקְדָּשׁ
  choice: tempat kudus
  rationale: מִקְדָּשׁ menunjuk pada tempat suci/sanctuary. 'Tempat kudus' mempertahankan nuansa kultis dan tidak menyamakannya begitu saja dengan seluruh bangunan Bait Allah.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama baku dalam bahasa Indonesia untuk wilayah dan umat Yehuda.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: keturunan Harun, para imam itu
  rationale: Dalam konteks kelembagaan imam, בְּנֵי dapat menunjuk pada keturunan Harun, bukan hanya anak kandung langsung. Aposisi 'para imam itu' dipertahankan.
- source_word: לְהַעֲלוֹת
  choice: mempersembahkan semuanya
  rationale: Dalam pemakaian kurban, bentuk kausatif עלה berarti menaikkan atau mempersembahkan di atas mazbah. 'Mempersembahkan' alami dalam bahasa Indonesia, sedangkan 'semuanya' memasok objek jamak yang tersirat dari daftar hewan.
- source_word: מִזְבַּח יְהוָה
  choice: mazbah Yahweh
  rationale: Rantai konstruksi diterjemahkan secara alami, dan nama ilahi יהוה ditransliterasikan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankan nama diri tersebut alih-alih menggantinya dengan gelar.
- issue: Makna kultis חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban karena dosa
  rationale: Kata ini di sini menyebut kategori persembahan, bukan dosa sebagai konsep abstrak. Pilihan ini menandai fungsi kultisnya tanpa memasukkan penjelasan teologis tambahan.
- issue: Cakupan בְּנֵי אַהֲרֹן
  choice: keturunan Harun
  alternative: anak-anak Harun
  rationale: Dalam konteks zaman Hizkia, frasa ini merupakan sebutan garis keturunan keimaman. 'Keturunan' menghindari kesan bahwa yang dimaksud ialah putra kandung Harun yang masih hidup.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan angka serta tiga frasa 'bagi' dipertahankan untuk mencerminkan susunan sumber. Istilah 'mazbah' dipakai sebagai istilah Alkitab yang ringkas dan dikenal; tidak ada penanda catatan kaki karena tidak diperlukan.
