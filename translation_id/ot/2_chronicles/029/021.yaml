  naturalness: Bahasa secara umum baku, jelas, dan sesuai register naratif-kultis. Frasa 'keturunan Harun, para imam' lebih alami daripada 'keturunan Harun, para imam itu' serta tetap mempertahankan aposisi Ibrani.
