base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: id
  text: Maka murka TUHAN menimpa Yehuda dan Yerusalem, dan Ia membuat mereka menjadi kengerian, kehancuran, dan sasaran siulan ejekan[a], seperti yang kamu lihat dengan mata kepala sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sasaran siulan”; siulan ini adalah reaksi mengejek atau menghina terhadap kehancuran yang disaksikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: murka
  rationale: Menyampaikan kemarahan ilahi yang hebat dalam penghukuman secara kuat dan wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi bahasa Indonesia yang luas dan bermartabat untuk Tetragramaton, tanpa mengimpor bentuk pengucapan tertentu ke dalam teks utama.
- source_word: וַיְהִי ... עַל
  choice: menimpa
  rationale: Mengungkapkan datangnya murka atas Yehuda dan Yerusalem dengan idiom Indonesia yang alami serta mempertahankan daya tindak ungkapan Ibrani.
- source_word: וַיִּתְּנֵם
  choice: Ia menjadikan mereka
  rationale: Dengan preposisi ל yang memperkenalkan keadaan hasil, verba ini menunjukkan bahwa mereka dibuat atau diserahkan hingga menjadi tontonan yang mengerikan, hancur, dan dicemooh.
- source_word: לְזוֹעָה
  choice: sesuatu yang mengerikan
  rationale: Nomina langka ini menunjuk pada sesuatu yang menimbulkan kegentaran atau rasa ngeri; pilihan ini mempertahankan dampaknya tanpa menentukan secara berlebihan apakah tekanannya pada ketakutan atau kengerian.
- source_word: לְשַׁמָּה
  choice: suatu kehancuran
  rationale: Menyatakan keadaan porak-poranda akibat penghukuman; bentuk konkret ini alami dalam rangkaian predikat bahasa Indonesia.
- source_word: וְלִשְׁרֵקָה
  choice: sasaran siulan cemooh
  rationale: Mempertahankan gambaran konkret orang yang bersiul ketika menyaksikan kehancuran sekaligus menjelaskan bahwa reaksinya bernada ejekan atau penghinaan.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: seperti yang kamu lihat dengan mata kepalamu sendiri
  rationale: Menjaga penegasan Ibrani bahwa para pendengar sendiri menyaksikan bukti penghukuman tersebut.
theological_decisions:
- issue: Bahasa penghukuman ilahi
  choice: murka TUHAN menimpa ... dan Ia menjadikan mereka
  alternative: TUHAN marah kepada ... dan menyerahkan mereka
  rationale: Teks Ibrani secara tegas mengaitkan kehancuran dan penghinaan publik itu dengan murka serta tindakan TUHAN. Terjemahan tidak melunakkan hubungan tersebut dan tidak menambahkan penjelasan doktrinal.
- issue: Rujukan pronomina jamak וַיִּתְּנֵם
  choice: mereka
  alternative: keduanya
  rationale: Bentuk jamak merujuk kepada Yehuda dan Yerusalem. 'Mereka' mempertahankan gramatika sumber dan tidak memaksakan apakah Yehuda dipahami sebagai negeri, rakyat, atau keduanya dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Maka' menghubungkan ayat ini dengan alasan yang baru disebutkan. Kapitalisasi 'Ia' dipakai untuk rujukan kepada Allah sesuai kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
