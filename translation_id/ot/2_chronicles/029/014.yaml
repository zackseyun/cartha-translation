id: 2CH.29.14
reference: 2 Chronicles 29:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִן בְּנֵ֥י הֵימָ֖ן יחואל וְ/שִׁמְעִ֑י וּ/מִן בְּנֵ֣י יְדוּת֔וּן שְׁמַֽעְיָ֖ה וְ/עֻזִּיאֵֽל־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: id
  text: 'dan dari antara keturunan Heman: Yehuel dan Simei; dan dari antara keturunan Yedutun: Semaya dan Uziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: dan dari antara
  rationale: Awalan ו menghubungkan ayat ini dengan daftar sebelumnya, sedangkan מִן menyatakan pemilihan orang dari suatu kelompok; frasa ini mempertahankan alur tambahan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar kaum Lewi, istilah ini dapat menunjuk anggota garis keluarga, bukan hanya anak kandung langsung; 'keturunan' menyampaikan cakupan itu dengan jelas.
- source_word: הֵימָן
  choice: Heman
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יחואל
  choice: Yehuel
  rationale: Transliterasi ini secara dekat mencerminkan bentuk konsonantal Ibrani dan sesuai dengan pola pengindonesiaan nama Ibrani.
- source_word: וְשִׁמְעִי
  choice: dan Simei
  rationale: Konjungsi dipertahankan untuk menjaga struktur daftar; nama ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: יְדוּתוּן
  choice: Yedutun
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Bentuk ini mencerminkan nama Ibrani שְׁמַעְיָה dan mengikuti ejaan nama Alkitab yang wajar dalam bahasa Indonesia.
- source_word: וְעֻזִּיאֵל
  choice: dan Uziel
  rationale: Konjungsi terakhir dipertahankan, dan nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa daftar yang ringkas dan bermartabat dipertahankan. 'Keturunan' dipilih daripada 'anak-anak' agar pembaca modern tidak mengira semua tokoh itu anak kandung langsung. Tidak diperlukan catatan kaki karena variasi ejaan Inggris 'Jehuel/Jahiel' tidak relevan bagi transliterasi Indonesia dari teks Ibrani.
