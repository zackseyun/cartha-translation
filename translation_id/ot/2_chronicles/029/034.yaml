  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: id
  text: Hanya saja, jumlah imam terlalu sedikit sehingga mereka tidak sanggup menguliti semua kurban bakaran. Karena itu, saudara-saudara mereka, yaitu orang-orang Lewi, membantu mereka[a] sampai pekerjaan itu selesai dan sampai para imam menguduskan diri. Sebab, orang-orang Lewi lebih tulus hati[b] dalam menguduskan diri daripada para imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menguatkan mereka.”'
    reason: lexical_alternative
  - marker: b
    text: “Lebih tulus hati” dapat juga diterjemahkan “lebih lurus hati” atau “lebih sepenuh hati.” Ungkapan Ibrani menekankan ketulusan atau kelurusan batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק הַכֹּהֲנִים הָיוּ לִמְעָט
  choice: Hanya saja, jumlah imam terlalu sedikit
  rationale: רַק memberi nuansa pembatas sekaligus kontras, sedangkan לִמְעָט dalam konstruksi dengan היה menyatakan jumlah yang tidak mencukupi.
- source_word: לְהַפְשִׁיט
  choice: menguliti
  rationale: Kata ini menunjuk pada tindakan melepaskan kulit binatang kurban; 'menguliti' merupakan padanan Indonesia yang langsung dan alami.
- source_word: הָעֹלוֹת
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada kurban yang seluruhnya dibakar di atas mezbah; 'kurban bakaran' adalah istilah yang jelas dan lazim dalam bahasa Indonesia Alkitabiah.
- source_word: וַיְחַזְּקוּם
  choice: membantu mereka
  rationale: Secara harfiah berarti 'menguatkan mereka', tetapi dalam konteks pekerjaan fisik yang tidak sanggup ditangani para imam, maknanya adalah memberi bantuan praktis. Nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: saudara-saudara mereka, yaitu orang-orang Lewi
  rationale: Mempertahankan sebutan kekerabatan harfiah sambil menjelaskan bahwa pihak yang dimaksud adalah orang-orang Lewi.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: sampai pekerjaan itu selesai
  rationale: Konstruksi ini menyatakan berlangsungnya bantuan hingga tugas tersebut tuntas.
- source_word: יִתְקַדְּשׁוּ / לְהִתְקַדֵּשׁ
  choice: menguduskan diri
  rationale: Bentuk refleksif קדשׁ dalam konteks ibadah menunjuk pada tindakan mempersiapkan atau mengkhususkan diri secara ritual untuk pelayanan kudus.
- source_word: יִשְׁרֵי לֵבָב
  choice: lebih tulus hati
  rationale: Ungkapan ini menggambarkan kelurusan, kesungguhan, atau ketulusan batin. 'Lebih tulus hati' alami dalam bahasa Indonesia dan tetap mempertahankan penilaian atas sikap batin.
- source_word: מֵהַכֹּהֲנִים
  choice: daripada para imam
  rationale: Preposisi מִן berfungsi komparatif dan membandingkan orang-orang Lewi dengan para imam dalam hal menguduskan diri.
theological_decisions:
- issue: Sifat perbandingan antara orang Lewi dan para imam
  choice: Orang-orang Lewi dinyatakan lebih tulus hati dalam menguduskan diri daripada para imam.
  alternative: Orang-orang Lewi lebih cepat, lebih rajin, atau lebih siap menguduskan diri daripada para imam.
  rationale: יִשְׁרֵי לֵבָב terutama menekankan kelurusan atau ketulusan batin, bukan sekadar kecepatan maupun kesiapan administratif. Perbandingan dipertahankan tanpa menjadikannya kecaman umum terhadap seluruh keimaman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat diperjelas tanpa menghapus hubungan sebab-akibat atau perbandingan yang tegas dalam teks Ibrani. Istilah kultis 'kurban bakaran' dan 'menguduskan diri' dipertahankan karena sesuai konteks pelayanan Bait Allah.
