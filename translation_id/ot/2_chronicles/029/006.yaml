id: 2CH.29.6
reference: 2 Chronicles 29:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: id
  text: Sebab nenek moyang kita telah berlaku tidak setia[a] dan melakukan apa yang jahat di mata Yahweh, Allah kita. Mereka meninggalkan Dia, memalingkan wajah dari tempat kediaman Yahweh[b], dan membelakangi-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berkhianat” atau “melakukan pelanggaran”; kata Ibraninya mengandung pengertian melanggar kesetiaan, sering kali dalam hubungan perjanjian atau ibadah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari kediaman Yahweh”. Dalam konteks ini yang dimaksud adalah bait sebagai tempat kediaman Yahweh, bukan hanya Kemah Suci.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “memberikan tengkuk”. Ungkapan Ibrani ini menggambarkan tindakan berpaling dalam penolakan atau pembangkangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: telah berlaku tidak setia
  rationale: Verba מעל menyatakan pelanggaran kesetiaan, sering dengan nuansa perjanjian atau ibadah. Ungkapan ini mempertahankan bobot relasional dan religiusnya dalam bahasa Indonesia modern.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Bersama verba עשה, frasa ini secara idiomatis berarti melakukan apa yang jahat; terjemahan ini alami sekaligus mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan metafora Ibrani yang jelas dan lazim dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וַיַּעַזְבֻהוּ
  choice: Mereka meninggalkan Dia
  rationale: עזב di sini menunjukkan tindakan meninggalkan Allah secara relasional dan keagamaan. 'Meninggalkan' jelas, wajar, dan tidak berbahasa arkais.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: memalingkan wajah
  rationale: Pilihan ini mempertahankan gambaran konkret tentang penolakan yang disengaja serta berpasangan dengan idiom membelakangi pada klausa berikutnya.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: dari tempat kediaman Yahweh
  rationale: מִשְׁכָּן pada dasarnya berarti tempat kediaman. Dalam konteks ini acuannya adalah bait sebagai tempat kediaman Yahweh, sehingga 'kemah suci' berpotensi menimbulkan kesan keliru.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: membelakangi-Nya
  rationale: Secara harfiah idiom ini berarti 'memberikan tengkuk' dan menyatakan penolakan atau pembangkangan. 'Membelakangi-Nya' menyampaikan gambaran serta maknanya secara alami; objek tersirat dipahami sebagai Yahweh dalam rangkaian klausa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Makna kultis מִשְׁכָּן dalam konteks bait
  choice: tempat kediaman Yahweh
  alternative: kemah suci Yahweh; tempat kudus Yahweh
  rationale: Pilihan ini mempertahankan arti leksikal 'kediaman' dan menghindari penyempitan acuan kepada Kemah Suci zaman Musa, sementara konteks pasal menunjuk pada bait.
- issue: Acuan objek dalam idiom וַיִּתְּנוּ עֹרֶף
  choice: membelakangi-Nya
  alternative: berpaling membelakangi; memberikan tengkuk
  rationale: Bahasa Ibrani tidak menyebut ulang objek pada klausa terakhir, tetapi rangkaian tindakan berpusat pada Yahweh dan kediaman-Nya. Bentuk '-Nya' membuat idiom alami dalam bahasa Indonesia tanpa mengubah arah teologis kalimat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel serta gambaran wajah dan punggung dipertahankan. Huruf kapital pada 'Dia' dan '-Nya' dipakai sesuai kebiasaan umum bahasa Indonesia ketika merujuk kepada Allah.
