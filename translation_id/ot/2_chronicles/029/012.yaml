  text: וַ/יָּקֻ֣מוּ הַ֠/לְוִיִּם מַ֣חַת בֶּן עֲמָשַׂ֞י וְ/יוֹאֵ֣ל בֶּן עֲזַרְיָהוּ֮ מִן בְּנֵ֣י הַ/קְּהָתִי֒ וּ/מִן בְּנֵ֣י מְרָרִ֔י קִ֚ישׁ בֶּן עַבְדִּ֔י וַ/עֲזַרְיָ֖הוּ בֶּן יְהַלֶּלְאֵ֑ל וּ/מִן הַ/גֵּ֣רְשֻׁנִּ֔י יוֹאָח֙ בֶּן זִמָּ֔ה וְ/עֵ֖דֶן בֶּן יוֹאָֽח־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: id
  text: 'Kemudian bangkitlah orang-orang Lewi berikut: Mahat anak Amasai dan Yoel anak Azarya, dari keturunan Kehat; lalu dari keturunan Merari, Kish anak Abdi dan Azarya anak Yehalelel; serta dari kaum Gerson[a], Yoah anak Zima dan Eden anak Yoah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari orang-orang Gerson.” Bahasa Ibrani memakai sebutan kaum di sini, bukan mengulangi formula “dari keturunan” seperti sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: bangkitlah
  rationale: Bentuk wayyiqtol dari קום menandai dimulainya tindakan sebagai tanggapan terhadap perintah raja. 'Bangkitlah' mempertahankan makna berdiri untuk bertindak dan sesuai dengan ragam naratif yang bermartabat.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan alami dalam bahasa Indonesia untuk kelompok suku yang dimaksud; bentuk jamaknya dinyatakan dengan pengulangan 'orang-orang'.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: dari keturunan Kehat
  rationale: Ungkapan harfiah 'dari anak-anak orang Kehat' merupakan idiom silsilah. 'Keturunan Kehat' menyampaikan hubungan kaum serta fungsi perwakilan nama-nama itu secara alami.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: lalu dari keturunan Merari
  rationale: Menerjemahkan formula silsilah yang diulang dengan jelas, sambil memakai penghubung alami untuk daftar bahasa Indonesia.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: serta dari kaum Gerson
  rationale: Kata nisbah tunggal dengan artikel berfungsi kolektif dan menunjuk kaum Gerson. 'Kaum Gerson' mempertahankan bentuk penamaan kelompok tanpa memaksakan formula 'keturunan' yang tidak diulang dalam bahasa Ibrani.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar silsilah ini, 'anak' adalah padanan langsung dan transparan; konteks tidak menuntut perluasan menjadi 'keturunan'.
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: Mahat; Amasai; Yoel; Azarya; Kish; Abdi; Yehalel-El; Yoah; Zima; Eden
  rationale: Nama-nama diri ditransliterasikan menurut bentuk Ibrani dengan ejaan yang sesuai bagi pembaca Indonesia; tanda hubung pada Yehalel-El membantu memperlihatkan unsur ilahi אֵל.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar serta perbedaan formula antarkaum dipertahankan, sedangkan idiom silsilah Ibrani dialihkan secara alami sebagai 'keturunan'. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
