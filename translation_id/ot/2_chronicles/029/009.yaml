source:
  edition: WLC
  text: וְ/הִנֵּ֛ה נָפְל֥וּ אֲבוֹתֵ֖י/נוּ בֶּ/חָ֑רֶב וּ/בָנֵ֨י/נוּ וּ/בְנוֹתֵ֧י/נוּ וְ/נָשֵׁ֛י/נוּ בַּ/שְּׁבִ֖י עַל זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: id
  text: Dan lihatlah[a], bapak-bapak kita telah tewas oleh pedang, dan anak-anak lelaki kita, anak-anak perempuan kita, dan istri-istri kita berada dalam penawanan[b] karena hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini mengarahkan perhatian secara tegas kepada pernyataan yang menyusul.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dalam penawanan”; maksudnya, mereka telah dibawa sebagai tawanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Dan lihatlah
  rationale: Penanda wacana ini mengarahkan perhatian secara tegas kepada pernyataan berikutnya. “Lihatlah” mempertahankan daya serunya dalam bahasa Indonesia modern dan bermartabat.
- source_word: נָפְלוּ
  choice: telah tewas
  rationale: Secara harfiah berarti “telah jatuh”, tetapi dalam konteks kematian oleh pedang, “telah tewas” menyampaikan idiom Ibrani secara alami tanpa menghilangkan nuansa khidmat.
- source_word: אֲבוֹתֵינוּ
  choice: bapak-bapak kita
  rationale: Mempertahankan istilah kekerabatan maskulin yang disebutkan secara khusus dalam teks, bukan memperluasnya menjadi “nenek moyang”.
- source_word: בֶּחָרֶב
  choice: oleh pedang
  rationale: Padanan formal bagi ungkapan Ibrani tentang kematian dengan senjata dalam penghukuman atau peperangan.
- source_word: וּבָנֵינוּ
  choice: anak-anak lelaki kita
  rationale: Mempertahankan pembedaan sumber antara anak lelaki dan anak perempuan.
- source_word: וּבְנוֹתֵינוּ
  choice: anak-anak perempuan kita
  rationale: Padanan langsung yang tetap dibedakan dari anak-anak lelaki.
- source_word: וְנָשֵׁינוּ
  choice: istri-istri kita
  rationale: Dalam daftar anggota keluarga dengan sufiks kepunyaan, “istri-istri” merupakan pilihan kontekstual yang paling tepat.
- source_word: בַּשְּׁבִי
  choice: berada dalam penawanan
  rationale: Mencerminkan konstruksi nominal Ibrani secara alami dan mempertahankan keadaan sebagai tawanan, bukan sekadar peristiwa penangkapan.
- source_word: עַל זֹאת
  choice: karena hal ini
  rationale: Menyatakan hubungan sebab akibat dan merujuk kembali kepada ketidaksetiaan serta akibatnya dalam konteks.
theological_decisions:
- issue: Istilah kekerabatan bergender dalam konteks penghukuman
  choice: bapak-bapak kita ... anak-anak lelaki kita, anak-anak perempuan kita, dan istri-istri kita
  alternative: nenek moyang kita ... anak-anak kita dan kaum perempuan kita
  rationale: Teks Ibrani menyebut kelompok-kelompok keluarga secara khusus; terjemahan mempertahankan pembedaan tersebut dan tidak meratakannya menjadi istilah kolektif netral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Lihatlah” mempertahankan penekanan penanda wacana; “telah tewas oleh pedang” mengungkapkan idiom kematian secara jelas bagi pembaca masa kini.
