- from: Dan lihatlah[a], bapak-bapak kita telah tewas oleh pedang, sedangkan anak-anak lelaki kita, anak-anak perempuan kita, dan istri-istri kita berada dalam penawanan[b] karena hal ini.
  to: Dan lihatlah[a], bapak-bapak kita telah tewas oleh pedang, dan anak-anak lelaki kita, anak-anak perempuan kita, dan istri-istri kita berada dalam penawanan[b] karena hal ini.
  rationale: Mengganti “sedangkan” dengan “dan” untuk menghindari penambahan hubungan pertentangan yang tidak dinyatakan dalam teks Ibrani. Selebihnya, terjemahan dan penanda catatan kaki dipertahankan karena setia pada sumber dan wajar dalam bahasa Indonesia baku.
