source:
  edition: WLC
  text: וַ/יִּשְׁחָטוּ/ם֙ הַ/כֹּ֣הֲנִ֔ים וַֽ/יְחַטְּא֤וּ אֶת דָּמָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה לְ/כַפֵּ֖ר עַל כָּל יִשְׂרָאֵ֑ל כִּ֤י לְ/כָל יִשְׂרָאֵל֙ אָמַ֣ר הַ/מֶּ֔לֶךְ הָ/עוֹלָ֖ה וְ/הַ/חַטָּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: id
  text: Para imam menyembelih kambing-kambing itu, lalu membubuhkan darahnya pada mezbah[a] untuk mengadakan pendamaian bagi seluruh Israel, sebab raja telah mengatakan bahwa kurban bakaran dan kurban penghapus dosa[b] itu diperuntukkan bagi seluruh Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melakukan ritus penyucian pada mezbah dengan darahnya”; kata kerja Ibrani ini dapat menunjuk pada pelaksanaan ritus kurban penghapus dosa atau penyucian.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kurban penyucian.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: menyembelih kambing-kambing itu
  rationale: Dalam konteks kurban, שׁחט berarti menyembelih. Akhiran objek jamak merujuk kepada kambing-kambing jantan dalam ayat sebelumnya; penyebutan eksplisit membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: membubuhkan darahnya pada mezbah
  rationale: Bentuk Hifil חטא di sini menunjuk pada tindakan ritual dengan darah kurban. Terjemahan ini menyatakan tindakan konkretnya tanpa secara keliru menyebut darah itu sendiri sebagai kurban penghapus dosa; nuansa penyucian dipertahankan dalam catatan kaki.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Dalam konteks persembahan kurban, כפר menunjuk pada tindakan ritual yang menghasilkan pendamaian. Ungkapan ini alami, bermartabat, dan mempertahankan bobot teologis istilah tersebut.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: bagi seluruh Israel
  rationale: Preposisi עַל bersama כפר menunjukkan pihak yang menerima manfaat tindakan pendamaian.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan mengapa cakupan persembahan itu meliputi seluruh Israel.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: raja telah menetapkan bahwa ... itu diperuntukkan bagi seluruh Israel
  rationale: Susunan Ibrani bersifat eliptis dan menempatkan 'bagi seluruh Israel' di depan. Bahasa Indonesia memerlukan penataan ulang; 'menetapkan' menyampaikan perkataan raja sebagai ketentuan tanpa menambahkan rincian perintah yang tidak dinyatakan.
- source_word: הָעוֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk persembahan yang dibakar di atas mezbah.
- source_word: וְהַחַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks ritual, חַטָּאת menunjuk pada jenis kurban. Istilah konvensional ini dipakai dalam teks utama, sementara nuansa penyucian dicatat sebagai alternatif.
theological_decisions:
- issue: Makna ritual bentuk חטא dalam tindakan terhadap darah dan mezbah
  choice: 'Menyatakan tindakan konkret: ''membubuhkan darahnya pada mezbah''.'
  alternative: Melakukan ritus penyucian pada mezbah dengan darahnya.
  rationale: Bentuk Hifil dapat membawa nuansa pelaksanaan ritus penghapus dosa atau penyucian. Teks utama tidak memutuskan secara berlebihan apakah objek penyuciannya secara khusus ialah mezbah, sedangkan kemungkinan itu tetap tersedia dalam catatan kaki.
- issue: Penamaan חַטָּאת sebagai jenis persembahan
  choice: kurban penghapus dosa
  alternative: kurban penyucian
  rationale: Kedua nuansa didukung dalam konteks ritual. Istilah 'kurban penghapus dosa' lebih dikenal oleh pembaca umum, tetapi alternatif 'kurban penyucian' menjaga kemungkinan bahwa fungsi pemurnian lebih ditonjolkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-liturgis yang bermartabat. Istilah 'kurban' dipakai secara konsisten; struktur Ibrani yang eliptis diperjelas secukupnya tanpa menghapus ambiguitas ritual yang asli.
