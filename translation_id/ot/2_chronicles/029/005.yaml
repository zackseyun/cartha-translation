source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Dengarkanlah aku, hai orang-orang Lewi! Sekarang, kuduskanlah diri kalian dan kuduskanlah rumah Yahweh, Allah nenek moyang kalian. Dan keluarkanlah kenajisan[a] dari tempat kudus[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketidakmurnian” atau “kotoran”; istilah Ibrani ini menunjuk pada sesuatu yang menajiskan tempat kudus.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari bait suci.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: Dengarkanlah aku
  rationale: Bentuk perintah dengan akhiran orang pertama tunggal. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan seruan langsung.
- source_word: הַלְוִיִּם
  choice: hai orang-orang Lewi
  rationale: Sapaan langsung kepada kaum Lewi; partikel “hai” memperjelas fungsi vokatif tanpa mengubah makna.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Mempertahankan penanda waktu sekaligus dorongan agar tindakan segera dimulai, tanpa menambahkan tingkat urgensi yang tidak dinyatakan.
- source_word: הִתְקַדְּשׁוּ
  choice: kuduskanlah dirimu
  rationale: Imperatif hitpael dari קדשׁ memiliki arti refleksif dalam konteks persiapan ibadah. Ungkapan ini mempertahankan akar “kudus” dan nuansa pengkhususan diri.
- source_word: וְקַדְּשׁוּ
  choice: dan kuduskanlah
  rationale: Imperatif piel dari akar קדשׁ. Akar Indonesia yang sama dipakai untuk mempertahankan pengulangan dan hubungan verbal dalam bahasa Ibrani.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan langsung ungkapan “rumah YHWH”; dalam konteks ini yang dimaksud adalah bait Allah, tetapi metafora “rumah” tetap dipertahankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah nenek moyang kalian
  rationale: “Nenek moyang” menyampaikan rujukan kolektif kepada para leluhur dengan alami dalam bahasa Indonesia; “kalian” mempertahankan sapaan jamak.
- source_word: וְהוֹצִיאוּ
  choice: Keluarkanlah
  rationale: Imperatif kausatif dari יצא menyatakan tindakan membawa atau mengeluarkan sesuatu dari dalam tempat kudus.
- source_word: הַנִּדָּה
  choice: kenajisan
  rationale: Dalam konteks pembersihan bait, istilah ini menunjuk pada sesuatu yang menajiskan atau mencemari tempat kudus; “kenajisan” mempertahankan dimensi ritual tanpa membatasinya pada sampah fisik.
- source_word: מִן הַקֹּדֶשׁ
  choice: dari tempat kudus
  rationale: קֹדֶשׁ di sini menunjuk pada ruang atau kawasan sakral. “Tempat kudus” mempertahankan istilah sumber, sementara “tempat suci” atau “bait” juga mungkin secara kontekstual.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan sebuah gelar.
- issue: Makna pengudusan diri dan rumah Yahweh
  choice: kuduskanlah dirimu dan kuduskanlah rumah Yahweh
  alternative: sucikanlah dirimu dan sucikanlah bait Yahweh
  rationale: Pengulangan akar “kudus” mencerminkan dua bentuk dari akar Ibrani קדשׁ dan mempertahankan kaitan antara persiapan para pelayan dan pengkhususan kembali rumah Yahweh, tanpa mereduksinya menjadi kebersihan fisik semata.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk perintah berakhiran -lah mempertahankan ketegasan pidato, sedangkan “kalian” memperjelas bahwa sapaan kepada orang-orang Lewi berbentuk jamak. Pengulangan “kuduskanlah” sengaja dipertahankan untuk mencerminkan permainan akar קדשׁ dalam teks Ibrani.
