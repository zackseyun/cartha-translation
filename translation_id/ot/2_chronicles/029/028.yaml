  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: id
  text: Seluruh umat itu bersujud, sementara nyanyian dilantunkan dan nafiri-nafiri dibunyikan. Semuanya itu berlangsung sampai kurban bakaran itu selesai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָּהָל
  choice: umat
  rationale: Menunjuk kepada komunitas yang berhimpun untuk beribadah. “Umat” alami dalam konteks ini dan mempertahankan makna kolektif tanpa menyiratkan lembaga tertentu.
- source_word: מִשְׁתַּחֲוִים
  choice: bersujud
  rationale: Mengungkapkan tindakan jasmani membungkuk atau merebahkan diri dalam penghormatan dan ibadah; “bersujud” ringkas, wajar, dan mempertahankan unsur fisiknya.
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: nyanyian dilantunkan
  rationale: Secara harfiah konstruksinya tidak biasa, kira-kira “nyanyian sedang bernyanyi/berbunyi.” Bentuk pasif alami dalam bahasa Indonesia dan menyampaikan bahwa nyanyian sedang dibawakan.
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: nafiri-nafiri dibunyikan
  rationale: חֲצֹצְרוֹת adalah terompet lurus untuk upacara ibadah, lazim diterjemahkan “nafiri.” Bentuk pasif menjelaskan bahwa alat-alat itu sedang ditiup tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: הַכֹּל
  choice: semuanya itu
  rationale: Merangkum seluruh tindakan ibadah yang baru disebutkan.
- source_word: עַד לִכְלוֹת
  choice: sampai ... selesai dipersembahkan
  rationale: Menandai batas waktu berlangsungnya tindakan. Penambahan “dipersembahkan” membuat hubungan dengan kurban bakaran alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan jelas bagi persembahan yang dibakar seluruhnya di atas mazbah.
