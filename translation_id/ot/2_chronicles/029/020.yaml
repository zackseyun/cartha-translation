  text: וַ/יַּשְׁכֵּם֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֶּאֱסֹ֕ף אֵ֖ת שָׂרֵ֣י הָ/עִ֑יר וַ/יַּ֖עַל בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: id
  text: Kemudian Raja Hizkia bangun pagi-pagi, mengumpulkan para pejabat kota, lalu naik ke Rumah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם menyatakan bangun atau mulai bertindak pagi-pagi; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa waktunya.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: Raja Hizkia
  rationale: Susunan gelar sebelum nama lebih wajar dalam bahasa Indonesia dan tetap menyampaikan hubungan aposisional dalam bahasa Ibrani.
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: Kata אָסַף dalam konteks ini berarti menghimpun orang-orang untuk berkumpul.
- source_word: אֵת שָׂרֵי הָעִיר
  choice: para pejabat kota
  rationale: שָׂרִים dapat menunjuk para pemimpin atau pejabat; dalam konteks pemerintahan kota, 'para pejabat kota' jelas dan tidak menyiratkan kebangsawanan turun-temurun.
- source_word: וַיַּעַל
  choice: pergi
  rationale: Secara harfiah עָלָה berarti 'naik', tetapi dalam bahasa Indonesia gerak menuju tempat ibadah lebih alami diungkapkan dengan 'pergi'; konteks tujuan tetap jelas.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora Ibrani 'rumah' dan menyajikan nama ilahi יְהוָה secara langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan fungsi nama perjanjian tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian tindakan naratif dibuat lancar dengan 'kemudian' dan 'lalu', tanpa mengubah urutan peristiwa.
