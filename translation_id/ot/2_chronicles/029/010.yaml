source:
  edition: WLC
  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: id
  text: Sekarang aku berniat mengikat perjanjian[a] dengan Yahweh, Allah Israel, supaya murka-Nya yang menyala-nyala berbalik dari kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memotong perjanjian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Keterangan waktu ini menandai segera dan tegasnya tekad Hizkia.
- source_word: עִם לְבָבִי
  choice: aku berniat
  rationale: Ungkapan Ibrani ini menyatakan maksud atau tekad batin. Pilihan ini alami dalam bahasa Indonesia modern tanpa mengubah maknanya menjadi tindakan yang sudah terlaksana.
- source_word: לִכְרֹת בְּרִית
  choice: mengikat perjanjian
  rationale: Secara harfiah berarti 'memotong perjanjian', tetapi 'mengikat perjanjian' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan bobot perjanjian resmi.
- source_word: לַיהוָה
  choice: dengan Yahweh
  rationale: Preposisi ל setelah ungkapan membuat perjanjian menunjukkan pihak yang dengannya perjanjian diadakan; nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Gelar ini secara langsung mengidentifikasi Yahweh sebagai Allah yang terkait dengan Israel.
- source_word: וְיָשֹׁב
  choice: supaya ... berbalik
  rationale: Dalam konteks ini bentuk tersebut menyatakan hasil atau tujuan yang diharapkan dari pembaruan perjanjian, sambil mempertahankan gambaran bahwa murka itu berbalik menjauh.
- source_word: מִמֶּנּוּ
  choice: dari kita
  rationale: Akhiran pronominalnya adalah orang pertama jamak dan menunjuk kepada umat yang terkena murka.
- source_word: חֲרוֹן אַפּוֹ
  choice: murka-Nya yang menyala-nyala
  rationale: Ungkapan ini menggambarkan kedahsyatan murka ilahi dengan metafora panas; terjemahan ini mempertahankan intensitas dan citra tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan antara pembaruan perjanjian dan surutnya murka ilahi
  choice: supaya murka-Nya ... berbalik dari kita
  alternative: dan murka-Nya akan berbalik dari kita
  rationale: Bentuk Ibrani dapat berhubungan dengan hasil yang diharapkan. 'Supaya' menyampaikan tujuan atau harapan Hizkia tanpa menjadikannya jaminan mekanis bahwa tindakan manusia mengendalikan Allah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan idiomatis dipakai dalam teks utama, sedangkan bentuk harfiah Ibrani yang bermakna dipertahankan dalam catatan kaki.
