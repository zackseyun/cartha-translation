  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: id
  text: Persembahan bakaran pun sangat banyak, disertai lemak persembahan kesejahteraan dan korban curahan untuk persembahan bakaran. Demikianlah pelayanan di Rumah Yahweh ditegakkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Menyampaikan daya aditif yang menghubungkan ayat ini dengan konteks sebelumnya dalam susunan bahasa Indonesia yang alami.
- source_word: עֹלָה
  choice: persembahan-persembahan bakaran
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini dipakai secara kolektif dan, bersama לָרֹב, menunjuk pada banyak persembahan.
- source_word: לָרֹב
  choice: sangat banyak
  rationale: Ungkapan idiomatis bahasa Indonesia untuk jumlah yang berlimpah atau besar.
- source_word: בְּחֶלְבֵי
  choice: disertai lemak dari
  rationale: Preposisi dipahami secara asosiatif; dalam konteks kurban, חלב menunjuk pada bagian lemak yang dipersembahkan.
- source_word: הַשְּׁלָמִים
  choice: persembahan-persembahan keselamatan
  rationale: Mempertahankan kaitan leksikal dengan gagasan damai, keutuhan, atau kesejahteraan tanpa mempersempit istilah itu hanya menjadi persekutuan.
- source_word: וּבַנְּסָכִים
  choice: dan persembahan-persembahan curahan
  rationale: Menunjuk pada persembahan cair yang dicurahkan; istilah ini jelas dan lazim dalam bahasa Indonesia Alkitabiah.
- source_word: לָעֹלָה
  choice: untuk persembahan bakaran
  rationale: Menandai hubungan atau peruntukan persembahan curahan dengan persembahan bakaran.
- source_word: וַתִּכּוֹן
  choice: ditegakkan
  rationale: Menyampaikan makna bahwa pelayanan itu dibuat kokoh, ditata kembali, dan berfungsi sebagaimana mestinya, tanpa secara eksplisit menambahkan gagasan pemulihan yang tidak dinyatakan oleh verba.
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: pelayanan di rumah Yahweh
  rationale: Mempertahankan makna kultis עֲבוֹדָה sebagai pelayanan ibadah di rumah Tuhan serta menyajikan rantai konstruksi secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang dinyatakan langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat Tetragramaton secara langsung; bentuk Yahweh mempertahankan nama perjanjian sebagai nama diri.
- issue: Makna istilah kurban שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan
  rationale: Pilihan utama menjaga keluasan medan makna yang mencakup damai, keutuhan, dan kesejahteraan; alternatif dicatat karena unsur perjamuan bersama dapat menonjol dalam penggunaan istilah tersebut.
- issue: Nuansa וַתִּכּוֹן bagi pelayanan Bait Allah
  choice: ditegakkan
  alternative: ditata kembali
  rationale: Ditegakkan mempertahankan makna resultatif verba כון tanpa memastikan apakah tekanannya pada penataan, kesiapan, atau pemulihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat namun mudah dipahami. Bentuk jamak diulang untuk memperjelas sifat kolektif kurban, sedangkan istilah kultis dipertahankan secara konsisten.
