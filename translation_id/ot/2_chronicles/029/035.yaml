revisions:
- from: Persembahan-persembahan bakaran juga sangat banyak, disertai lemak dari persembahan-persembahan keselamatan[a] dan persembahan-persembahan curahan untuk persembahan bakaran. Demikianlah pelayanan di rumah Yahweh ditegakkan.
  to: Persembahan bakaran pun sangat banyak, disertai lemak persembahan kesejahteraan dan korban curahan untuk persembahan bakaran. Demikianlah pelayanan di Rumah Yahweh ditegakkan.
  rationale: Revisi mengganti istilah yang berpotensi menyempitkan atau menggeser kategori kultis שְׁלָמִים, mengurangi jamak yang berulang agar lebih alami, dan memakai "korban curahan" sebagai istilah Indonesia yang mapan. Hubungan korban curahan dengan persembahan bakaran serta nuansa resultatif וַתִּכּוֹן tetap dipertahankan. Penanda catatan kaki dipindahkan ke "persembahan kesejahteraan" dalam teks revisi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:44:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Makna dasar teks terjaga: banyaknya korban bakaran, lemak korban syelamim, korban curahan yang menyertai korban bakaran, dan penegakan pelayanan Rumah Yahweh. Namun, "persembahan-persembahan keselamatan" berisiko dibaca sebagai persembahan yang berkaitan dengan keselamatan soteriologis, sedangkan שְׁלָמִים menunjuk kategori kurban kesejahteraan/damai. Bentuk jamak berulang juga tidak diperlukan untuk menyatakan makna kolektif Ibrani.'
  naturalness: Teks dapat dipahami, tetapi pengulangan "persembahan-persembahan" membuat kalimat berat. "Persembahan bakaran pun sangat banyak" dan istilah kategori yang konsisten menghasilkan bahasa Indonesia baku yang lebih lancar.
  terminology: '"Yahweh" tepat untuk יְהוָה. "Persembahan kesejahteraan" lebih aman untuk שְׁלָמִים daripada "persembahan keselamatan"; alternatif "persembahan persekutuan" layak dipertahankan dalam catatan kaki. "Korban curahan" adalah istilah kultis Indonesia yang lebih lazim daripada "persembahan curahan" dan selaras dengan kategori-kategori kurban dalam ayat ini.'
  issues:
  - severity: medium
    issue: Istilah "persembahan-persembahan keselamatan" untuk שְׁלָמִים
    rationale: Dalam bahasa Indonesia modern, "keselamatan" lazim diasosiasikan dengan keselamatan rohani. Istilah Ibrani ini adalah kategori kurban yang berhubungan dengan damai/keutuhan/kesejahteraan, bukan pernyataan eksplisit mengenai keselamatan soteriologis.
  - severity: low
    issue: Pengulangan bentuk jamak pada nama-nama kurban
    rationale: Makna kolektif dan jumlah besar sudah disampaikan oleh "sangat banyak"; pengulangan bentuk jamak membuat gaya kurang alami tanpa menambah makna sumber.
  - severity: low
    issue: '"Persembahan curahan" kurang idiomatis sebagai istilah kategori'
    rationale: '"Korban curahan" lebih lazim dalam register Alkitabiah Indonesia untuk נְסָכִים.'
  revised_text: Persembahan bakaran pun sangat banyak, disertai lemak persembahan kesejahteraan dan korban curahan untuk persembahan bakaran. Demikianlah pelayanan di Rumah Yahweh ditegakkan.
  revised_footnotes:
  - marker: a
    text: Atau "persembahan persekutuan."
    reason: lexical_alternative
  revision_rationale: Revisi mengganti istilah yang berpotensi menyempitkan atau menggeser kategori kultis שְׁלָמִים, mengurangi jamak yang berulang agar lebih alami, dan memakai "korban curahan" sebagai istilah Indonesia yang mapan. Hubungan korban curahan dengan persembahan bakaran serta nuansa resultatif וַתִּכּוֹן tetap dipertahankan. Penanda catatan kaki dipindahkan ke "persembahan kesejahteraan" dalam teks revisi.
