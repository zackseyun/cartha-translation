base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: id
  text: Lalu Hizkia berkata, “Sekarang kalian telah menahbiskan diri bagi Yahweh[a]. Datanglah mendekat dan bawalah kurban sembelihan serta persembahan syukur ke rumah Yahweh.” Maka seluruh jemaah membawa kurban sembelihan dan persembahan syukur, dan setiap orang yang rela hati membawa persembahan bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kalian telah memenuhi tangan kalian bagi Yahweh,” sebuah ungkapan Ibrani untuk ditahbiskan atau dikhususkan bagi pelayanan suci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Lalu Hizkia berkata
  rationale: Gabungan harfiah 'menjawab dan berkata' merupakan idiom naratif Ibrani. Dalam konteks ini tidak ada pertanyaan langsung, sehingga 'berkata' menyampaikan fungsinya secara alami dalam bahasa Indonesia.
- source_word: מִלֵּאתֶם יֶדְכֶם
  choice: kalian telah menahbiskan diri
  rationale: Ungkapan harfiahnya 'kalian telah memenuhi tangan kalian', tetapi ini merupakan idiom bagi penahbisan atau pengkhususan untuk pelayanan suci. Terjemahan idiomatis dipakai dalam teks, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai arah pengabdian atau peruntukan dalam ungkapan penahbisan; 'bagi' terdengar alami dan mempertahankan makna dedikasi.
- source_word: גֹּשׁוּ
  choice: Datanglah mendekat
  rationale: Mempertahankan gagasan mendekat dalam konteks ibadah, bukan sekadar datang.
- source_word: זְבָחִים
  choice: kurban sembelihan
  rationale: Istilah ini menunjuk kepada kurban yang disembelih dan membedakannya dari persembahan bakaran yang disebut pada akhir ayat.
- source_word: תוֹדוֹת
  choice: persembahan syukur
  rationale: Menyampaikan jenis persembahan yang mengungkapkan syukur dengan istilah Indonesia yang jelas dan lazim.
- source_word: לְבֵית יְהוָה
  choice: ke rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani 'rumah Yahweh' beserta citra teologisnya, tanpa menggantinya dengan 'Bait Allah'.
- source_word: הַקָּהָל
  choice: seluruh jemaah
  rationale: Menunjuk kepada komunitas yang sedang berkumpul untuk beribadah; 'jemaah' alami dalam konteks keagamaan Indonesia.
- source_word: כָל נְדִיב לֵב
  choice: setiap orang yang rela hati
  rationale: Mempertahankan unsur kesediaan sukarela yang berasal dari hati tanpa mempersempitnya menjadi kemurahan hati dalam arti finansial.
- source_word: עֹלוֹת
  choice: persembahan bakaran
  rationale: Istilah kurban yang dibakar seluruhnya diterjemahkan dengan padanan Indonesia yang baku dan dibedakan dari kurban sembelihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri dan tidak mengubahnya menjadi gelar.
- issue: Makna idiom penahbisan מִלֵּאתֶם יֶדְכֶם
  choice: kalian telah menahbiskan diri
  alternative: kalian telah memenuhi tangan kalian
  rationale: Ungkapan tersebut merupakan formula penahbisan untuk pelayanan suci. Teks utama menyampaikan makna idiomatis, sementara catatan kaki mempertahankan bentuk harfiah agar citra dan kemungkinan nuansa sumber tetap terlihat.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan khidmat. Kata ganti jamak ''kalian'' memperjelas bahwa perkataan Hizkia ditujukan kepada kelompok. Istilah kurban dibedakan secara konsisten: זְבָחִים sebagai ''kurban sembelihan'', תוֹדוֹת sebagai ''persembahan syukur'', dan עֹלוֹת sebagai ''persembahan bakaran''.'
