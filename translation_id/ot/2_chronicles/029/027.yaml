  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: id
  text: Lalu Hizkia memerintahkan supaya persembahan bakaran dipersembahkan di atas mazbah. Ketika persembahan bakaran mulai dipersembahkan, nyanyian Yahweh[a] pun mulai dinyanyikan, diiringi nafiri dan alat-alat musik Daud, raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “nyanyian Yahweh.” Dalam konteks ini dapat juga dipahami sebagai “nyanyian untuk Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: memerintahkan agar ... dinaikkan
  rationale: Secara leksikal אמר berarti “berkata”, tetapi konstruksi dengan infinitif ber־ל menyampaikan arahan. “Memerintahkan agar” mengungkapkan daya direktifnya secara wajar, sedangkan “dinaikkan” mempertahankan nuansa kausatif dan gerak ke atas dari bentuk Hifil עלה dalam konteks kurban.
- source_word: הָעֹלָה
  choice: persembahan bakaran
  rationale: Padanan baku dan jelas bagi עֹלָה, yaitu kurban yang dibakar seluruhnya di atas mazbah.
- source_word: לְהַמִּזְבֵּחַ
  choice: ke atas mazbah
  rationale: Preposisi ל dengan verba “menaikkan” secara alami menyatakan arah menuju mazbah; “ke atas” mempertahankan gambaran spasial teks.
- source_word: וּבְעֵת הֵחֵל הָעוֹלָה
  choice: Ketika persembahan bakaran mulai dipersembahkan
  rationale: Ungkapan eliptis Ibrani secara kontekstual menunjuk pada dimulainya tindakan mempersembahkan kurban; bentuk pasif membuat kalimat Indonesia alami tanpa menentukan pelaku yang tidak disebutkan.
- source_word: שִׁיר יְהוָה
  choice: nyanyian bagi Yahweh
  rationale: Konstruksi genitif secara harfiah dapat berarti “nyanyian Yahweh”, tetapi dalam konteks ibadah kemungkinan besar menunjukkan nyanyian yang diarahkan kepada Yahweh. Ambiguitas bentuk Ibrani dicatat dalam catatan kaki.
- source_word: הַחֲצֹצְרוֹת
  choice: nafiri
  rationale: חֲצֹצְרָה adalah terompet logam liturgis, bukan שׁוֹפָר. “Nafiri” merupakan istilah Indonesia yang tepat dan bermartabat bagi alat tiup seremonial tersebut; bahan perak tidak ditambahkan karena tidak dinyatakan di ayat ini.
- source_word: וְעַל־יְדֵי כְּלֵי דָּוִיד
  choice: diiringi ... alat-alat musik Daud
  rationale: Dalam konteks musikal, כְּלֵי berarti alat musik dan idiom עַל־יְדֵי menyatakan sarana. “Diiringi” mengungkapkan fungsi nafiri dan alat-alat musik itu dengan alami.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan diterjemahkan langsung dan diletakkan sebagai aposisi bagi Daud.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה. Transliterasi “Yahweh” mempertahankan nama diri itu dan tidak menggantinya dengan gelar.
- issue: Makna konstruksi שִׁיר יְהוָה
  choice: nyanyian bagi Yahweh
  alternative: nyanyian Yahweh
  rationale: Konteks ibadah mendukung arah nyanyian kepada Yahweh, tetapi konstruksi Ibrani sendiri secara harfiah berbunyi “nyanyian Yahweh” dan dapat menyiratkan kepunyaan atau hubungan lain. Bentuk alternatif dipertahankan dalam catatan kaki agar ketegangan ini tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-liturgis. “Mazbah”, “persembahan bakaran”, dan “nafiri” dipakai sebagai istilah Alkitabiah yang tetap dikenal, sementara susunan kalimat dibuat alami bagi pembaca masa kini. Penanda catatan kaki ditempatkan setelah klausa yang memuat frasa ambigu.
