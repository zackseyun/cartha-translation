source:
  edition: WLC
  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: id
  text: Jumlah kurban bakaran yang dibawa oleh umat itu adalah tujuh puluh ekor sapi, seratus ekor domba jantan, dan dua ratus ekor anak domba. Semuanya itu dipersembahkan sebagai kurban bakaran kepada TUHAN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: umat itu
  rationale: Dalam konteks ibadah seluruh komunitas Israel, 'umat' terdengar lebih alami daripada 'jemaah' dan tetap menyampaikan makna kumpulan umat.
- source_word: בָּקָר
  choice: sapi
  rationale: Istilah kolektif ini menunjuk ternak lembu tanpa secara eksplisit menentukan jenis kelamin; 'sapi' mempertahankan keluasan maknanya.
- source_word: אֵילִים
  choice: domba jantan
  rationale: Padanan langsung bagi domba jantan dewasa.
- source_word: כְּבָשִׂים
  choice: anak domba
  rationale: Padanan Indonesia yang wajar bagi domba muda dalam konteks kurban.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Menunjuk kurban yang dibakar seluruhnya di atas mazbah; istilah ini lazim dan jelas dalam bahasa Indonesia Alkitabiah.
- source_word: יהוה
  choice: TUHAN
  rationale: Mengikuti konvensi penerjemahan bahasa Indonesia yang menandai nama ilahi YHWH dengan huruf kapital.
theological_decisions:
- issue: Jenis kelamin בָּקָר
  choice: sapi
  alternative: lembu jantan
  rationale: Teks Ibrani memakai istilah generik untuk ternak lembu, bukan istilah yang secara khusus berarti jantan; terjemahan tidak mempersempit makna.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat panjang sumber dibagi menjadi dua agar angka-angka mudah dipahami tanpa mengubah hubungan maknanya.
