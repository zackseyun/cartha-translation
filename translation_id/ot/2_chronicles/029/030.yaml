  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: id
  text: Kemudian Raja Hizkia dan para pemimpin menyuruh orang Lewi memuji Yahweh dengan perkataan Daud dan Asaf, sang pelihat.[a] Mereka pun memuji dengan sukacita,[b] lalu membungkuk dan menyembah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menurut perkataan Daud dan Asaf, sang pelihat.”'
    reason: Preposisi Ibrani dapat menunjukkan sarana yang digunakan atau perkataan yang dijadikan pedoman.
  - marker: b
    text: 'Secara harfiah: “sampai kepada sukacita” atau “menuju sukacita”; maksudnya tampaknya pujian mereka berlangsung dalam sukacita.'
    reason: Ungkapan Ibraninya tidak lazim dan memungkinkan nuansa hasil atau keadaan yang menyertai pujian.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: menyuruh
  rationale: Dalam konstruksi 'berkata kepada ... untuk memuji', verba ini berfungsi sebagai arahan. 'Menyuruh' alami dalam bahasa Indonesia tanpa memperkerasnya menjadi 'memerintahkan'.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: Raja Hizkia dan para pemimpin
  rationale: שָׂרִים menunjuk para pejabat atau pemimpin; 'para pemimpin' jelas, modern, dan sesuai konteks.
- source_word: לְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan baku dan mudah dipahami bagi kelompok suku sekaligus pelayan kultis tersebut.
- source_word: לְהַלֵּל
  choice: memuji
  rationale: הלל dalam konteks ibadah berarti menyampaikan pujian; unsur nyanyian tersirat oleh konteks tetapi tidak harus ditambahkan ke dalam verba.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan membedakannya dari gelar 'Tuhan'.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: dengan perkataan Daud dan Asaf, sang pelihat
  rationale: '''Dengan perkataan'' mempertahankan arti dasar בְּדִבְרֵי dan tidak mempersempitnya menjadi ''nyanyian''; hubungan instrumental atau normatifnya dijelaskan dalam catatan kaki.'
- source_word: הַחֹזֶה
  choice: sang pelihat
  rationale: חֹזֶה adalah gelar kenabian; 'pelihat' mempertahankan nuansa historis-keagamaannya.
- source_word: וַיְהַלְלוּ
  choice: mereka pun memuji
  rationale: Mempertahankan padanan akar הלל secara konsisten; 'pun' menandai respons terhadap arahan sebelumnya.
- source_word: עַד לְשִׂמְחָה
  choice: dengan sukacita
  rationale: Ungkapan Ibrani ini secara harfiah tidak lazim dalam bahasa Indonesia; padanan ini menyampaikan bahwa pujian mereka ditandai sukacita sambil mencatat bentuk harfiahnya.
- source_word: וַיִּקְּדוּ
  choice: berlutut
  rationale: Verba קדד menggambarkan tubuh yang dibungkukkan atau ditundukkan dalam penghormatan; 'berlutut' alami dalam rangkaian tindakan ibadah ini, meskipun 'membungkuk' juga mungkin.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: menyembah
  rationale: Verba ini kerap menyatakan sujud sebagai tindakan penyembahan. Karena tindakan merendahkan tubuh sudah dinyatakan oleh verba sebelumnya, 'menyembah' menjaga pembedaan kedua tindakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari gelar umum.
- issue: Hubungan antara dua tindakan pada klausa terakhir
  choice: 'dua tindakan terkoordinasi: ''berlutut dan menyembah'''
  alternative: satu ungkapan gabungan, misalnya 'sujud menyembah'
  rationale: Bahasa Ibrani memakai dua verba berbeda. Terjemahan mempertahankan keduanya tanpa menentukan bahwa keduanya hanya membentuk satu tindakan.
- issue: Relasi perkataan Daud dan Asaf dengan pujian
  choice: '''dengan perkataan'' dalam teks utama'
  alternative: '''menurut perkataan'''
  rationale: Preposisi ב dapat menyatakan sarana maupun patokan. Teks utama mempertahankan bacaan instrumental yang alami, sedangkan kemungkinan normatif dicatat tanpa menghapus ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan nama Yahweh, gelar kenabian 'pelihat', dua verba penutup, serta ambiguitas pada בְּדִבְרֵי dan עַד לְשִׂמְחָה melalui catatan kaki.
