id: 2CH.29.11
reference: 2 Chronicles 29:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: id
  text: Anak-anakku, sekarang janganlah lalai, sebab Yahweh telah memilih kalian untuk berdiri di hadapan-Nya[a], melayani-Nya, serta menjadi para pelayan-Nya dan pembakar dupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Berdiri di hadapan-Nya” adalah ungkapan yang berkaitan dengan tugas imam, yaitu melayani di hadirat Allah.
    reason: cultural_note
  - marker: b
    text: 'Atau: “serta menjadi para pelayan-Nya dan orang-orang yang mempersembahkan dupa”; secara harfiah, “dan pembakar dupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: Anak-anakku
  rationale: Sapaan harfiah dengan akhiran orang pertama tunggal. Bentuk ini alami dalam bahasa Indonesia dan sesuai dengan sapaan kebapakan Hizkia kepada para imam dan orang Lewi.
- source_word: עַתָּה אַל תִּשָּׁלוּ
  choice: sekarang janganlah lalai
  rationale: עַתָּה mempertahankan desakan waktu, sedangkan bentuk larangan dari שלה dalam konteks tugas peribadatan berarti jangan bersikap lengah, lamban, atau mengabaikan kewajiban.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: Yahweh telah memilih kalian
  rationale: Frasa בָכֶם yang ditempatkan di depan menekankan pihak yang dipilih. 'Kalian' sesuai dengan sapaan jamak dan jelas dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לַעֲמֹד לְפָנָיו
  choice: untuk berdiri di hadapan-Nya
  rationale: Mempertahankan ungkapan imamat Ibrani dan citra mengambil tempat untuk bertugas di hadirat Allah.
- source_word: לְשָׁרְתוֹ
  choice: melayani-Nya
  rationale: שרת dalam konteks bait menunjuk pada pelayanan resmi atau peribadatan; 'melayani-Nya' alami dan tetap memuat nuansa tersebut dalam konteks.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: serta menjadi para pelayan-Nya dan pembakar dupa
  rationale: Mempertahankan kesejajaran kedua partisip Ibrani sebagai sebutan peran. 'Pembakar dupa' dekat dengan bentuk sumber, sementara catatan kaki menyajikan terjemahan fungsional yang lebih idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna berdiri di hadapan Yahweh
  choice: Mempertahankan ungkapan 'berdiri di hadapan-Nya'
  alternative: bertugas di hadapan-Nya
  rationale: Ungkapan itu mempunyai arti pelayanan imamat, tetapi citra harfiahnya tetap dapat dipahami dan tidak perlu dipersempit dalam teks utama.
- issue: Hubungan מְשָׁרְתִים dan מַקְטִרִים
  choice: Diterjemahkan sebagai dua sebutan peran yang sejajar
  alternative: menjadi pelayan-Nya dan membakar dupa
  rationale: Keduanya berbentuk partisip jamak yang dikoordinasikan. Terjemahan utama menjaga kesejajaran itu, tanpa menutup kemungkinan bahwa unsur terakhir lebih alami dipahami sebagai tindakan mempersembahkan dupa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'Anak-anakku' mempertahankan nada kebapakan; 'kalian' menghindari ketidakjelasan jumlah. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
