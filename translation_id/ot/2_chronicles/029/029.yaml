  text: וּ/כְ/כַלּ֖וֹת לְ/הַעֲל֑וֹת כָּרְע֗וּ הַ/מֶּ֛לֶךְ וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: id
  text: Setelah mereka selesai mempersembahkan kurban[a], raja dan semua orang yang hadir bersamanya berlutut, lalu sujud menyembah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “selesai menaikkan.” Dalam konteks persembahan kurban, ungkapan ini berarti menyelesaikan tindakan mempersembahkan kurban.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “bersujud” atau “membungkuk dengan hormat.” Kata Ibrani ini dapat menyatakan gerak tubuh maupun tindakan menyembah dalam konteks ibadah.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: Setelah mereka selesai
  rationale: Gabungan kata penghubung, preposisi, dan infinitif konstruktus dari כלה membentuk anak kalimat waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: לְ/הַעֲלוֹת
  choice: mempersembahkan kurban
  rationale: Bentuk Hifil dari עלה secara harfiah berarti ‘membuat naik’, tetapi dalam konteks ibadah kurban menunjuk pada tindakan mempersembahkan kurban. Kata ‘kurban’ membuat maksud implisitnya jelas tanpa secara tidak perlu mengulang ‘kurban bakaran’, yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: כָּרְעוּ
  choice: berlutut
  rationale: כרע menyatakan tindakan menekuk lutut atau berlutut. Pilihan ini membedakan tindakan tersebut dari tindakan sujud pada kata kerja berikutnya.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung dan wajar bagi nomina definit Ibrani dalam konteks ini.
- source_word: וְכָל הַנִּמְצְאִים אִתּוֹ
  choice: dan semua orang yang hadir bersamanya
  rationale: Partisipel Nifal dari מצא di sini secara idiomatis menunjuk kepada orang-orang yang berada atau hadir bersama raja.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: lalu sujud menyembah
  rationale: Bentuk kata kerja שחה dapat menyatakan tindakan membungkuk atau bersujud dengan hormat dan, dalam konteks ibadah, menyembah. ‘Sujud menyembah’ mempertahankan unsur jasmani sekaligus makna ibadahnya.
theological_decisions:
- issue: Makna שחה dalam konteks ibadah di Bait Allah
  choice: sujud menyembah
  alternative: sujud / membungkuk
  rationale: Konteks penyelesaian persembahan kurban menunjukkan tindakan penghormatan religius. Terjemahan ini tidak menghapus gerak tubuh yang terkandung dalam verba tersebut, tetapi juga tidak mereduksi tindakannya menjadi postur jasmani semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang khidmat namun mudah dipahami. Dua tindakan berurutan dalam bahasa Ibrani dibedakan sebagai ‘berlutut’ dan ‘sujud menyembah’; ‘lalu’ memperjelas urutan tanpa menambah gagasan teologis.
