  text: וַ/יָּב֤וֹאוּ פְנִ֨ימָה֙ אֶל חִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֹּ֣אמְר֔וּ טִהַ֖רְנוּ אֶת כָּל בֵּ֣ית יְהוָ֑ה אֶת מִזְבַּ֤ח הָ/עוֹלָה֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת שֻׁלְחַ֥ן הַֽ/מַּעֲרֶ֖כֶת וְ/אֶת כָּל כֵּלָֽי/ו־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: id
  text: 'Kemudian mereka masuk menghadap Raja Hizkia dan berkata, “Kami telah menahirkan seluruh rumah Yahweh: mezbah kurban bakaran beserta segala perlengkapannya, dan meja tempat roti disusun[a] beserta segala perlengkapannya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meja roti sajian,” yaitu meja untuk roti yang disusun di hadapan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: masuk menghadap
  rationale: Adverbia ini menunjukkan gerak ke dalam. Dalam konteks laporan resmi kepada raja, frasa ini menyampaikan bahwa mereka masuk ke tempat raja berada dan menghadapnya secara alami dalam bahasa Indonesia.
- source_word: טִהַרְנוּ
  choice: telah menahirkan
  rationale: Bentuk verba ini menyatakan tindakan penahiran yang sudah selesai. 'Menahirkan' mempertahankan nuansa ritual dalam konteks rumah ibadah.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora Ibrani 'rumah' dan nama ilahi yang terdapat langsung dalam teks sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: מִזְבַּח הָעוֹלָה
  choice: mezbah kurban bakaran
  rationale: Frasa ini menunjuk pada mezbah untuk kurban yang dibakar seluruhnya; pilihan ini ringkas dan lazim dipahami dalam bahasa Indonesia Alkitabiah.
- source_word: כֵּלָיו
  choice: segala perlengkapannya
  rationale: Dalam konteks tempat kudus, כֵּלִים mencakup berbagai perkakas dan bejana untuk pelayanan. 'Perlengkapan' cukup luas dan alami.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: meja tempat roti disusun
  rationale: Secara harfiah frasa ini adalah meja untuk susunan atau jajaran. Konteks kultis menunjukkan roti yang ditata di hadapan Yahweh; penyebutan 'roti' memperjelas acuannya tanpa memakai istilah tradisional yang kurang transparan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. Bentuk 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Makna שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: meja tempat roti disusun
  alternative: meja roti sajian
  rationale: Pilihan utama mempertahankan gagasan penyusunan yang eksplisit dalam bahasa Ibrani sekaligus menjelaskan benda yang disusun. Catatan kaki mencantumkan istilah tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'menahirkan', 'mezbah', dan 'kurban bakaran' dipertahankan karena konteks peribadatan, sementara struktur kalimat dibuat alami bagi pembaca umum.
