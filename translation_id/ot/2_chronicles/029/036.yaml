base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: id
  text: Hizkia dan seluruh rakyat bersukacita atas apa yang telah Allah siapkan bagi rakyat itu[a], sebab hal itu terjadi dengan tiba-tiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena Allah telah mempersiapkan rakyat itu” atau “karena Allah telah meneguhkan hal ini bagi rakyat itu.”
    reason: Teks Ibrani tidak menyatakan objek הֵכִין secara eksplisit, dan לָעָם dapat dipahami secara benefaktif atau dalam konstruksi yang mengarah pada kesiapan rakyat.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: bersukacita
  rationale: Kata שׂמח menyatakan kegembiraan; “bersukacita” sesuai dengan ragam naratif yang bermartabat dan menunjukkan tanggapan sukacita yang nyata.
- source_word: יְחִזְקִיָּהוּ
  choice: Hizkia
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: עָם menunjuk kepada komunitas Israel secara kolektif; “seluruh rakyat” alami dalam konteks tanggapan bersama terhadap pembaruan ibadah.
- source_word: עַל
  choice: atas
  rationale: Setelah kata kerja yang menyatakan sukacita, עַל memperkenalkan sebab atau pokok sukacita. “Atas” mempertahankan bentuk ungkapan Ibrani secara alami dalam bahasa Indonesia.
- source_word: הֵכִין
  choice: siapkan
  rationale: Bentuk Hifil dari כון dapat berarti menyiapkan, menjadikan siap, atau meneguhkan. “Siapkan” paling sesuai dengan konteks pemulihan ibadah yang terlaksana secara mendadak.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Allah Israel; “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: לָעָם
  choice: bagi rakyat itu
  rationale: Preposisi ל paling langsung menyatakan kepentingan atau manfaat bagi rakyat. Terjemahan ini menghindari anggapan pasti bahwa rakyat sendiri merupakan objek langsung yang dipersiapkan.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan penjelasan tentang alasan mereka bersukacita.
- source_word: בְּפִתְאֹם
  choice: dengan tiba-tiba
  rationale: Adverbia ini menunjukkan bahwa peristiwa tersebut berlangsung secara mendadak atau tidak terduga.
- source_word: הָיָה הַדָּבָר
  choice: hal itu terjadi
  rationale: דָּבָר bersifat luas dan di sini merujuk kepada keseluruhan peristiwa pemulihan ibadah; “hal itu terjadi” alami sekaligus mempertahankan keluasan maknanya.
theological_decisions:
- issue: Peran Allah dalam kesiapan rakyat atau terlaksananya pemulihan
  choice: apa yang telah Allah siapkan bagi rakyat itu
  alternative: Allah telah mempersiapkan rakyat itu; Allah telah meneguhkan hal ini bagi rakyat itu
  rationale: Susunan הֵכִין הָאֱלֹהִים לָעָם memungkinkan pemahaman bahwa Allah menyiapkan sesuatu bagi rakyat, mempersiapkan rakyat, atau meneguhkan keadaan ini bagi mereka. Teks utama mengikuti fungsi benefaktif ל tanpa menentukan objek yang tidak dinyatakan, sedangkan catatan kaki mempertahankan kemungkinan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan alur sebab-akibat serta keumuman הַדָּבָר, sambil menandai ambiguitas sintaksis utama melalui catatan kaki.
