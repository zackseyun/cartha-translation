source:
  edition: WLC
  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: id
  text: Mereka mengumpulkan saudara-saudara mereka[a], menguduskan diri, lalu datang sesuai dengan perintah raja berdasarkan firman Yahweh[b], untuk mentahirkan rumah Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, sesama orang Lewi.
    reason: contextual_clarification
  - marker: b
    text: 'Dapat juga diterjemahkan: “sesuai dengan perintah raja, sesuai dengan firman Yahweh.” Secara harfiah, frasa terakhir berbunyi “dengan perkataan-perkataan Yahweh.”'
    reason: syntactic_and_lexical_alternative
  - marker: c
    text: Yang dimaksud adalah bait Yahweh.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: mengumpulkan
  rationale: Bentuk ini mempertahankan tindakan aktif verba אָסַף, yaitu mengumpulkan atau menghimpun.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Ini mempertahankan istilah kekerabatan maskulin dalam teks; dalam konteks, yang dimaksud ialah sesama orang Lewi.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: menguduskan diri
  rationale: Bentuk hitpael menunjukkan tindakan mempersiapkan atau mengkhususkan diri secara ritual untuk pelayanan kudus.
- source_word: וַיָּבֹאוּ
  choice: lalu datang
  rationale: Verba dasar berarti datang. Terjemahan ini tidak menambahkan objek atau tempat masuk yang tidak dinyatakan langsung.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: sesuai dengan perintah raja
  rationale: Frasa ini menyatakan bahwa tindakan mereka mengikuti instruksi raja.
- source_word: בְּדִבְרֵי יְהוָה
  choice: berdasarkan firman Yahweh
  rationale: Ungkapan ini mempertahankan hubungan perintah raja dengan perkataan ilahi, sambil memakai bentuk Indonesia yang wajar. Catatan kaki mencantumkan susunan alternatif karena cakupan frasa Ibrani dapat dipahami lebih dari satu cara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְטַהֵר
  choice: untuk menahirkan
  rationale: Dalam konteks bait, verba piel ini menunjuk pada pembersihan ritual; 'menahirkan' membedakannya dari tindakan menguduskan diri sebelumnya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan harfiah 'rumah Yahweh'; konteksnya adalah bait.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung, sehingga bentuk nama diri dipertahankan.
- issue: Cakupan frasa בְּדִבְרֵי יְהוָה
  choice: perintah raja berdasarkan firman Yahweh
  alternative: sesuai dengan perintah raja, sesuai dengan firman Yahweh
  rationale: Susunan pilihan utama menghubungkan perintah raja dengan firman Yahweh secara alami, tetapi tata bahasa Ibrani memungkinkan frasa itu dibaca sebagai tolok ukur tindakan mereka secara lebih langsung; alternatif dipertahankan dalam catatan kaki.
- issue: Istilah kekerabatan maskulin אֲחֵיהֶם
  choice: saudara-saudara mereka
  alternative: sesama orang Lewi
  rationale: Pilihan utama mempertahankan istilah kekerabatan yang digunakan teks, sedangkan identitas mereka sebagai sesama orang Lewi dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'menguduskan diri' dan 'menahirkan' dipakai untuk membedakan dua tindakan ritual yang dinyatakan oleh akar Ibrani yang berbeda. Susunan kalimat tetap dekat dengan urutan sumber tanpa mengorbankan keterbacaan.
