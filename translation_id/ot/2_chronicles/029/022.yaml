translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan struktur tindakan dipertahankan untuk mencerminkan irama teks Ibrani. Rujukan pelaku pada dua rangkaian terakhir tidak diperjelas melampaui bentuk jamak dalam sumber, sehingga tidak memaksakan identifikasi pelaku yang tidak dinyatakan ulang.
