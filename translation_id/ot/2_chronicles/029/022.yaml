  terminology: '"Imam", "mezbah", dan "menyembelih" konsisten dengan terminologi Alkitab dan konteks ritual. "Memercikkan" adalah padanan Indonesia yang lazim dan dapat diterima untuk זרק dalam konteks korban; catatan kaki dengan tepat memberi tahu pembaca bahwa tindakan tersebut bukan percikan ringan.'
