  source_fidelity: 'Teks Indonesia secara cermat mengikuti urutan dan pembagian tindakan dalam Ibrani: ternak sapi disembelih, para imam menampung darah dan menerapkannya pada mezbah, lalu domba jantan dan anak domba disembelih dengan darah diterapkan pada mezbah. "Ternak sapi" mempertahankan sifat kolektif בָּקָר tanpa membatasi jenis kelamin. "Domba-domba jantan" dan "anak-anak domba" tepat untuk אֵילִים dan כְּבָשִׂים. Subjek jamak pada dua klausa terakhir tidak dipersempit melampaui teks sumber.'
