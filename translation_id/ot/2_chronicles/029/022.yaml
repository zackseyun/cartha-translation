  text: וַֽ/יִּשְׁחֲטוּ֙ הַ/בָּקָ֔ר וַ/יְקַבְּל֤וּ הַ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וַֽ/יִּזְרְק֖וּ הַ/מִּזְבֵּ֑חָ/ה וַ/יִּשְׁחֲט֣וּ הָ/אֵלִ֗ים וַ/יִּזְרְק֤וּ הַ/דָּם֙ הַ/מִּזְבֵּ֔חָ/ה וַֽ/יִּשְׁחֲטוּ֙ הַ/כְּבָשִׂ֔ים וַ/יִּזְרְק֥וּ הַ/דָּ֖ם הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: id
  text: Kemudian mereka menyembelih ternak sapi[a]. Para imam menampung darahnya dan memercikkannya ke mezbah[b]. Mereka menyembelih domba-domba jantan dan memercikkan darahnya ke mezbah. Mereka juga menyembelih anak-anak domba dan memercikkan darahnya ke mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "lembu-lembu". Kata Ibrani yang dipakai merupakan istilah kolektif bagi hewan jenis sapi dan tidak secara khusus menyatakan bahwa semuanya jantan.
    reason: lexical_alternative
  - marker: b
    text: Atau "menyiramkannya pada mezbah" atau "menghempaskannya ke mezbah". Kata kerja Ibrani ini menunjuk pada penerapan darah secara ritual dengan gerakan yang kuat, bukan sekadar percikan ringan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: mereka menyembelih
  rationale: Dalam konteks persembahan, שׁחט menunjuk pada penyembelihan ritual, bukan sekadar membunuh.
- source_word: הַבָּקָר
  choice: ternak sapi
  rationale: בקר adalah istilah kolektif bagi hewan jenis sapi. Pilihan ini tidak membatasi maknanya menjadi sapi jantan saja.
- source_word: וַיְקַבְּלוּ
  choice: menampung
  rationale: Dalam tata cara persembahan, para imam menerima atau menampung darah agar dapat menerapkannya pada mezbah; 'menampung' menyampaikan tindakan praktis itu secara wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan jelas untuk כהנים dalam konteks ibadah Israel.
- source_word: הַדָּם
  choice: darahnya
  rationale: Akhiran '-nya' secara alami menghubungkan darah dengan hewan yang baru disembelih tanpa mengubah rujukannya.
- source_word: וַיִּזְרְקוּ
  choice: memercikkan
  rationale: Dalam ritus persembahan, זרק menyatakan penerapan darah dengan gerakan melemparkan atau memercikkannya ke mezbah. 'Memercikkan' alami dalam bahasa Indonesia, sedangkan catatan kaki menjelaskan bahwa tindakannya bukan percikan ringan.
- source_word: הַמִּזְבֵּחָה
  choice: ke mezbah
  rationale: Akhiran direktif pada bentuk Ibrani menunjukkan gerak menuju mezbah; dalam konteks ini darah diterapkan pada permukaan mezbah.
- source_word: הָאֵלִים
  choice: domba-domba jantan
  rationale: אֵילִים secara khusus berarti domba jantan.
- source_word: הַכְּבָשִׂים
  choice: anak-anak domba
  rationale: כְּבָשִׂים lazim menunjuk pada domba muda dalam daftar hewan persembahan.
