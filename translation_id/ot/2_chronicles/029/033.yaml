  text: And the consecrated offerings were six hundred cattle and three thousand sheep[a][b].
translation:
  language: id
  text: Persembahan yang dikhususkan[a] itu berjumlah enam ratus ekor sapi dan tiga ribu ekor kambing domba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benda-benda kudus”; dalam konteks ini, hewan-hewan yang dikhususkan sebagai persembahan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kambing domba” menunjuk kepada ternak kawanan secara umum dan dapat mencakup domba maupun kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: Persembahan-persembahan yang dikhususkan
  rationale: Bentuk jamak ini secara harfiah berarti 'hal-hal yang kudus/dikhususkan'. Dalam konteks daftar hewan untuk ibadah, ungkapan ini menunjuk kepada hewan yang telah dikhususkan sebagai persembahan; terjemahan ini alami sekaligus mempertahankan gagasan pengkhususan.
- source_word: בָּקָר
  choice: sapi
  rationale: Kata ini merupakan istilah kolektif bagi ternak besar jenis sapi tanpa menentukan jenis kelamin atau fungsi; 'sapi' adalah padanan Indonesia yang jelas dan wajar.
- source_word: שֵׁשׁ מֵאוֹת
  choice: enam ratus
  rationale: Padanan langsung bagi bilangan kardinal Ibrani.
- source_word: וְצֹאן
  choice: dan ... kambing domba
  rationale: צֹאן adalah istilah kolektif untuk ternak kecil dalam kawanan dan dapat mencakup domba maupun kambing. 'Kambing domba' mempertahankan keluasan makna itu tanpa membatasinya hanya pada domba.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tiga ribu
  rationale: Padanan langsung bagi bilangan kardinal Ibrani.
