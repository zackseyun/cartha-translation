  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: id
  text: Kemudian orang-orang Lewi berdiri dengan alat-alat musik Daud[a], dan para imam berdiri dengan trompet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan alat-alat musik milik Daud.” Frasa Ibrani ini dapat berarti alat-alat yang dimiliki, ditetapkan, atau dikaitkan dengan Daud.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud adalah trompet upacara yang digunakan para imam. Dalam beberapa konteks trompet ini disebut terbuat dari perak, tetapi keterangan itu tidak terdapat dalam ayat ini.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: Kemudian ... berdiri
  rationale: Bentuk wayyiqtol melanjutkan urutan kisah. “Kemudian” menyatakan perkembangan narasi secara alami, sedangkan “berdiri” mempertahankan arti dasar עמד.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk kelompok suku serta pelayan ibadah ini; bentuk jamaknya dinyatakan dengan pengulangan “orang-orang”.
- source_word: בִּכְלֵי דָוִיד
  choice: dengan alat-alat musik Daud
  rationale: Dalam konteks ibadah Bait Allah, כְּלִי menunjuk pada alat musik. Susunan “alat-alat musik Daud” mempertahankan hubungan genitif yang dapat menunjukkan kepunyaan, penetapan, atau keterkaitan dengan Daud.
- source_word: וְהַכֹּהֲנִים
  choice: sedangkan para imam
  rationale: “Para imam” menerjemahkan bentuk jamak takrif. “Sedangkan” secara alami mengoordinasikan kelompok kedua dan menandai pembagian peran tanpa menambahkan pertentangan teologis.
- source_word: בַּחֲצֹצְרוֹת
  choice: dengan trompet
  rationale: חֲצֹצְרוֹת adalah trompet upacara yang dimainkan para imam. “Trompet” merupakan istilah modern yang mudah dipahami; bahan peraknya tidak ditambahkan karena tidak disebutkan dalam ayat ini.
