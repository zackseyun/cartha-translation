  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan struktur paralel Ibrani: “dan dari,” diikuti kelompok Elisafan dan Asaf serta dua nama untuk masing-masing kelompok. “Keturunan” merupakan padanan yang wajar untuk בני dalam konteks daftar keluarga/kaum dan tidak secara keliru membatasi maknanya pada anak kandung. Yeuel sesuai dengan bentuk Ibrani יעואל dalam ayat ini, bukan bentuk nama serupa Yeiel.'
