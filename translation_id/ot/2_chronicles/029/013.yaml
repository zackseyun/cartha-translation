source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ אֱלִ֣יצָפָ֔ן שִׁמְרִ֖י ו/יעואל וּ/מִן בְּנֵ֣י אָסָ֔ף זְכַרְיָ֖הוּ וּ/מַתַּנְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: id
  text: dan dari keturunan Elisafan[a], Simri dan Yeuel[b]; dan dari keturunan Asaf, Zakharia dan Matanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Elisafan”; dalam konteks ini ungkapan Ibrani itu dapat berarti keturunan atau anggota kaum Elisafan.
    reason: lexical_alternative
  - marker: b
    text: Nama Ibrani di sini adalah “Yeuel”; nama-nama serupa di bagian lain kadang dieja “Yeiel”.
    reason: textual_clarity
lexical_decisions:
- source_word: וּ/מִן
  choice: dan dari
  rationale: Mempertahankan kata penghubung dan preposisi Ibrani serta struktur daftar yang berlanjut dari ayat sebelumnya.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar kaum Lewi ini, ungkapan tersebut menunjuk pada garis keluarga atau kelompok keturunan, bukan harus anak kandung langsung; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: אֱלִיצָפָן
  choice: Elisafan
  rationale: Transliterasi nama Ibrani yang sesuai dengan ejaan Indonesia.
- source_word: שִׁמְרִי
  choice: Simri
  rationale: Transliterasi nama Ibrani dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: ו/יעואל
  choice: dan Yeuel
  rationale: Bentuk konsonantal Ibrani pada ayat ini mendukung nama Yeuel; kata penghubungnya juga dipertahankan.
- source_word: בְּנֵי אָסָף
  choice: keturunan Asaf
  rationale: Menunjukkan garis keluarga atau kelompok yang berasal dari Asaf dengan ungkapan Indonesia yang jelas.
- source_word: זְכַרְיָהוּ
  choice: Zakharia
  rationale: Bentuk nama Ibrani yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וּ/מַתַּנְיָהוּ
  choice: dan Matanya
  rationale: Transliterasi Indonesia untuk nama Ibrani, dengan kata penghubung yang terdapat dalam teks sumber.
theological_decisions: []
