  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia. Catatan [b] ditempatkan pada Yeuel, yaitu nama yang benar-benar dibahas, bukan pada Asaf.
