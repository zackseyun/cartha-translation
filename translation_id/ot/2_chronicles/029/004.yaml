  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: id
  text: Kemudian ia menyuruh para imam dan orang Lewi datang, lalu mengumpulkan mereka di lapangan sebelah timur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengumpulkan mereka ke lapangan di sebelah timur.”'
    reason: Alternatif ini mencerminkan kemungkinan bahwa preposisi ל menyatakan arah gerak, bukan semata-mata lokasi.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Kemudian ia menyuruh ... datang
  rationale: Bentuk Hifil dari בוא menyatakan tindakan menyebabkan seseorang datang, sehingga ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan titik asal atau tujuan geraknya.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk bentuk jamak כהנים.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Padanan Indonesia yang lazim bagi kelompok Lewi sebagai pelayan rumah TUHAN yang dibedakan dari para imam.
- source_word: וַיַּאַסְפֵם
  choice: lalu mengumpulkan mereka
  rationale: אסף dengan sufiks orang ketiga jamak berarti mengumpulkan mereka; 'lalu' mencerminkan kelanjutan urutan narasi.
- source_word: לִרְחוֹב
  choice: di lapangan
  rationale: רחוב menunjuk pada tempat terbuka yang luas atau plaza, bukan terutama jalan dalam pengertian modern. Preposisi ל dapat dipahami sebagai arah atau lokasi dalam konteks ini.
- source_word: הַמִּזְרָח
  choice: sebelah timur
  rationale: מזרח berarti timur; susunan ini secara alami dapat dipahami sebagai lapangan yang terletak di sisi timur.
