translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Menyuruh ... datang' menghindari ungkapan kaku 'membawa masuk', sedangkan 'lapangan' menyampaikan tempat terbuka yang luas. Penanda catatan kaki ditempatkan langsung sesudah frasa terkait.
