  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: id
  text: Lalu mereka membawa kambing-kambing jantan untuk korban penghapus dosa itu ke hadapan raja dan jemaah.[a] Mereka meletakkan tangan mereka di atas kambing-kambing itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menghadapkan kambing-kambing jantan korban penghapus dosa itu di hadapan raja dan jemaah.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi, “mereka meletakkan tangan mereka di atas kambing-kambing itu.” Subjeknya paling alami merujuk kepada raja dan jemaah, mungkin melalui wakil-wakil mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: membawa mendekat
  rationale: Bentuk Hifil dari נגשׁ menyatakan tindakan membawa dekat atau mempersembahkan. Pilihan ini mempertahankan gerak konkret dalam konteks kurban, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: kambing-kambing jantan untuk persembahan penghapus dosa
  rationale: שָׂעִיר menunjuk pada kambing jantan, sedangkan חַטָּאת dalam konteks ritual ini menunjuk pada kurban bagi dosa, bukan dosa sebagai gagasan abstrak.
- source_word: לִפְנֵי
  choice: ke hadapan
  rationale: Dalam konteks upacara, kata ini menandai bahwa hewan-hewan tersebut dibawa dan dihadapkan di depan raja serta umat.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: raja dan umat yang berkumpul
  rationale: קָהָל berarti komunitas yang sedang berhimpun. Ungkapan ini jelas bagi pembaca modern dan tidak membawa nuansa kelembagaan gerejawi yang tidak diperlukan.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: mereka meletakkan tangan mereka
  rationale: סמך dengan kata 'tangan' dalam konteks kurban menunjuk pada tindakan ritual meletakkan tangan di atas hewan. Penyebutan 'mereka' dan 'tangan mereka' mempertahankan bentuk serta kemungkinan rujukan dalam bahasa Ibrani.
- source_word: עֲלֵיהֶם
  choice: di atas kambing-kambing itu
  rationale: Pronomina jamak ini merujuk kembali kepada kambing-kambing. Pengulangan nomina menghindari kemungkinan bahwa 'mereka' dalam bahasa Indonesia dibaca sebagai manusia.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban
  choice: persembahan penghapus dosa
  alternative: dosa
  rationale: Konteks hewan yang dibawa mendekat dan dikenai peletakan tangan menunjukkan bahwa חַטָּאת di sini adalah nama jenis kurban. Pilihan ini menyatakan fungsi ritualnya tanpa mengartikannya sebagai dosa abstrak.
- issue: Subjek tindakan meletakkan tangan
  choice: mempertahankan kata ganti 'mereka', yang paling alami merujuk kepada raja dan umat yang berkumpul
  alternative: para imam meletakkan tangan pada kambing-kambing itu
  rationale: Anteseden terdekat ialah raja dan umat yang berkumpul, dan sufiks 'tangan mereka' secara alami merujuk kepada mereka secara kolektif. Namun, teks tidak menjelaskan apakah semua orang bertindak langsung atau melalui wakil; terjemahan tidak memutuskan mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-liturgis yang bermartabat. Istilah 'umat yang berkumpul' dipilih untuk קָהָל agar alami dan tidak terlalu teknis; 'persembahan penghapus dosa' dipakai sebagai istilah ritual yang mudah dipahami.
