  text: יְחִזְקִיָּ֣הוּ מָלַ֗ךְ בֶּן עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ אֲבִיָּ֖ה בַּת זְכַרְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: id
  text: Hizkia menjadi raja ketika berumur dua puluh lima tahun, dan ia memerintah selama dua puluh sembilan tahun di Yerusalem. Nama ibunya ialah Abia, anak perempuan Zakharia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: Hizkia
  rationale: Mengikuti bentuk nama yang sudah baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Kemunculan pertama menyatakan naiknya Hizkia ke takhta; bentuk ingresif ini alami dalam bahasa Indonesia.
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: ketika berumur dua puluh lima tahun
  rationale: Mengungkapkan idiom usia Ibrani secara wajar dan jelas dalam bahasa Indonesia modern.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: ia memerintah selama dua puluh sembilan tahun
  rationale: Kemunculan kedua מָלַךְ menunjuk pada berlangsungnya pemerintahan, sedangkan 'selama' memperjelas durasi.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi lokatif menunjuk Yerusalem sebagai tempat atau pusat pemerintahannya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Padanan alami bagi rumus biografis Ibrani tanpa mengurangi informasinya.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia dan cukup dekat dengan nama Ibrani.
- source_word: בַּת
  choice: anak perempuan
  rationale: Menunjukkan hubungan genealogis secara eksplisit dan alami dalam bahasa Indonesia.
- source_word: זְכַרְיָהוּ
  choice: Zakharia
  rationale: Bentuk nama yang lazim digunakan dalam Alkitab bahasa Indonesia.
