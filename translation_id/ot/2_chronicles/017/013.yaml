  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: id
  text: Ia mempunyai banyak pekerjaan di kota-kota Yehuda, dan di Yerusalem ia mempunyai prajurit-prajurit, orang-orang gagah perkasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: banyak pekerjaan
  rationale: Secara langsung berarti 'banyak pekerjaan' atau 'pekerjaan besar'. Terjemahan ini mengikuti arti leksikal utama tanpa mengubahnya menjadi 'harta milik', meskipun konteks administrasi kerajaan dapat mencakup berbagai kegiatan dan urusan.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: para prajurit
  rationale: Ungkapan harfiahnya 'orang-orang perang'; 'para prajurit' menyampaikan fungsi militernya secara alami dalam bahasa Indonesia.
- source_word: גִּבּוֹרֵי חַיִל
  choice: para kesatria yang gagah perkasa
  rationale: Ungkapan ini menunjuk kepada orang-orang yang menonjol dalam kekuatan, keberanian, dan kecakapan militer. 'Kesatria yang gagah perkasa' mempertahankan nuansa kehormatan dan keperkasaan dalam konteks pasukan.
