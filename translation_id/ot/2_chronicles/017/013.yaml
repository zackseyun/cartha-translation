translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat diperjelas agar frasa 'di Yerusalem' secara alami menerangkan keberadaan pasukan, sambil mempertahankan kesejajaran dua kelompok yang mungkin saling menjelaskan melalui kata 'yakni'.
