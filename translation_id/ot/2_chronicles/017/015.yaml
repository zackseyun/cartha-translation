  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: id
  text: Di bawah komandonya ada Yohanan, sang panglima[a], dan bersamanya ada 280.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di sampingnya ada Yohanan, sang panglima,” atau “Di bawah wewenangnya ada Yohanan, sang panglima.” Ungkapan Ibraninya secara harfiah berbunyi “pada tangannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Di bawah pimpinannya
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'di atas/pada tangannya' dalam daftar militer ini menunjukkan kedudukan di bawah arahan atau wewenang seseorang.
- source_word: יְהוֹחָנָן
  choice: Yohan
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia dengan tetap mencerminkan bentuk Ibraninya.
- source_word: הַשַּׂר
  choice: panglima
  rationale: Dalam konteks pencatatan pasukan, שַׂר menunjuk pemimpin militer; 'panglima' menyampaikan fungsi tersebut secara alami.
- source_word: וְעִמּוֹ
  choice: dan bersama dia ada
  rationale: Frasa ini memperkenalkan jumlah pasukan yang menyertai Yohan; kata 'ada' melengkapi konstruksi bahasa Indonesia.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 280.000 orang
  rationale: Menyatakan jumlah tepat secara jelas; 'orang' ditambahkan sesuai konteks pasukan, tanpa mengubah jumlah.
