reference: 2 Chronicles 17:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: id
  text: Sebaliknya,[a] ia mencari Allah ayahnya dan berjalan menurut perintah-perintah-Nya, bukan menurut perbuatan Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab ia mencari Allah ayahnya.” Kata penghubung Ibrani ini juga dapat berarti “sebab” atau “karena”; “sebaliknya” dipakai dalam teks utama untuk menonjolkan pertentangan dengan ayat sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: “Israel” di sini kemungkinan menunjuk pada kerajaan utara, sebagai lawan dari Yehuda.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebaliknya
  rationale: Dalam konteksnya, kata penghubung ini menonjolkan pertentangan dengan tindakan yang disebut pada ayat sebelumnya. Pilihan ini wajar dalam bahasa Indonesia, sementara arti kausalnya dicatat dalam catatan kaki.
- source_word: לֵאלֹהֵי אָבִיו
  choice: Allah ayahnya
  rationale: Preposisi ל menandai objek dari kata 'mencari' dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia. Frasa ini mempertahankan bentuk tunggal 'ayahnya' dan kesinambungan iman yang tersirat.
- source_word: דָּרָשׁ
  choice: mencari
  rationale: Dalam konteks perjanjian, kata ini menyatakan tindakan berpaling kepada Allah dan mencari-Nya dengan sungguh-sungguh, bukan sekadar meminta informasi.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: berjalan menurut perintah-perintah-Nya
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang 'berjalan' sebagai cara hidup, dengan 'menurut' untuk mengungkapkan hubungan dengan perintah-perintah secara alami dalam bahasa Indonesia.
- source_word: וְלֹא כְּמַעֲשֵׂה
  choice: bukan menurut perbuatan
  rationale: Kata 'bukan' menghubungkan pertentangan ini secara alami dengan frasa sebelumnya, sedangkan 'perbuatan' tetap dekat dengan מַעֲשֶׂה dan menunjuk pada perilaku atau praktik.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani hanya menyebut 'Israel'. Terjemahan mempertahankan sebutan itu tanpa memasukkan penafsiran mengenai kerajaan utara ke dalam teks utama.
theological_decisions:
- issue: Rujukan nama 'Israel'
  choice: Mempertahankan 'Israel' tanpa perluasan penjelas dalam teks utama.
  alternative: kerajaan Israel di utara
  rationale: Dalam konteks Tawarikh, nama ini kemungkinan menunjuk pada kerajaan utara sebagai lawan Yehuda. Namun, teks Ibrani membiarkan rujukannya dalam bentuk 'Israel', sehingga penjelasan kontekstual ditempatkan dalam catatan kaki agar ketegangan dan cakupan istilah sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'berjalan' dipertahankan karena masih dapat dipahami sebagai cara hidup; susunan 'bukan menurut' membuat kontrasnya alami tanpa memperluas makna teks.
