id: 2CH.17.5
reference: 2 Chronicles 17:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: id
  text: Maka Yahweh meneguhkan kerajaan itu dalam kekuasaan Yosafat, dan seluruh Yehuda memberikan upeti[a] kepadanya. Ia memiliki kekayaan dan kehormatan yang berlimpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberian”, “hadiah”, atau “persembahan”; dalam konteks kerajaan ini, kata Ibrani minḥah paling mungkin berarti “upeti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: meneguhkan
  rationale: Bentuk Hifil dari כון berarti membuat teguh atau menetapkan dengan kokoh. “Meneguhkan” sesuai dengan konteks pemerintahan Yosafat yang dibuat kukuh oleh Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: מַמְלָכָה dapat menunjuk pada kerajaan maupun kekuasaan kerajaan. “Kerajaan itu” merupakan padanan alami dalam konteks ini.
- source_word: בְּיָדוֹ
  choice: dalam kekuasaan Yosafat
  rationale: Secara harfiah berarti “di tangannya”; idiom ini menyatakan bahwa kerajaan berada di bawah kuasa atau kendali Yosafat. Nama Yosafat disebut untuk menghindari ketaksaan rujukan kata ganti dalam bahasa Indonesia.
- source_word: וַיִּתְּנוּ כָל יְהוּדָה
  choice: seluruh Yehuda memberikan
  rationale: נתן berarti “memberikan”, sedangkan “seluruh Yehuda” secara kolektif menunjuk kepada rakyat Yehuda.
- source_word: מִנְחָה
  choice: upeti
  rationale: מִנְחָה dapat berarti pemberian, persembahan, atau upeti. Dalam konteks kerajaan dan pengukuhan pemerintahan, “upeti” paling sesuai, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: לִיהוֹשָׁפָט
  choice: kepadanya
  rationale: Acuannya adalah Yosafat, yang telah disebut secara eksplisit dalam klausa sebelumnya; kata ganti menghasilkan bahasa Indonesia yang lebih alami tanpa kehilangan rujukan.
- source_word: וַיְהִי לוֹ
  choice: Ia memiliki
  rationale: Ungkapan Ibrani ini secara idiomatis menyatakan kepemilikan atau keadaan yang dihasilkan.
- source_word: עֹשֶׁר
  choice: kekayaan
  rationale: עֹשֶׁר menunjuk pada kekayaan materi; “kekayaan” adalah padanan Indonesia yang alami dan bermartabat.
- source_word: וְכָבוֹד
  choice: dan kehormatan
  rationale: כָבוֹד dalam konteks istana ini menunjuk pada kehormatan atau kedudukan mulia, bukan secara khusus kemuliaan ilahi.
- source_word: לָרֹב
  choice: yang berlimpah
  rationale: Ungkapan ini menyatakan jumlah atau kadar yang sangat besar; “yang berlimpah” menyampaikan maknanya secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Pelaku dan penerima pengukuhan kerajaan
  choice: Kerajaan diteguhkan oleh Yahweh dalam kekuasaan Yosafat
  alternative: “Yahweh meneguhkan kerajaan itu di tangannya”
  rationale: Kata ganti posesif Ibrani merujuk kepada Yosafat, bukan Yahweh. Penyebutan nama memperjelas rujukan tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Idiom “di tangannya” dialihkan menjadi “dalam kekuasaan Yosafat” agar maknanya jelas bagi pembaca umum. Penanda catatan kaki [a] ditempatkan langsung sesudah kata yang diterangkannya.
