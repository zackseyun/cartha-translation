base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: id
  text: Mereka mengajar di Yehuda, dan bersama mereka ada Kitab[a] Taurat Yahweh. Mereka berkeliling ke semua kota di Yehuda dan mengajar di antara rakyat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Gulungan Taurat Yahweh.” Kata Ibrani yang diterjemahkan “Kitab” dapat menunjuk dokumen tertulis berbentuk gulungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengajar rakyat.” Secara lebih harfiah, teks Ibrani berbunyi “mengajar di antara rakyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: Mereka mengajar
  rationale: Bentuk piel dari למד berarti ‘mengajar’ atau ‘memberi pengajaran’. ‘Mengajar’ merupakan padanan langsung dan alami, serta mempertahankan pengulangan verba yang sama pada akhir ayat.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Preposisi ב menyatakan lokasi. Cakupan kegiatan mereka kemudian diperjelas oleh frasa ‘ke semua kota di Yehuda’.
- source_word: וְעִמָּהֶם
  choice: dan bersama mereka ada
  rationale: Frasa Ibrani ini diikuti klausa tanpa verba, secara harfiah ‘dan bersama mereka [ada] kitab’. Rumusan ini mempertahankan koordinasi serta menegaskan bahwa kitab itu menyertai mereka tanpa mengubahnya menjadi objek verba sebelumnya.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: Kitab Taurat Yahweh
  rationale: סֵפֶר menunjuk dokumen tertulis dan dapat berupa gulungan; ‘Kitab’ alami dalam konteks ini. Dalam konstruksi ini תּוֹרָה menunjuk Taurat atau hukum/pengajaran perjanjian Yahweh, sehingga ‘Taurat’ merupakan istilah Indonesia yang ringkas dan dikenal luas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: וַיָּסֹבּוּ
  choice: Mereka berkeliling
  rationale: Verba סבב dalam konteks ini menggambarkan perjalanan dari satu tempat ke tempat lain. ‘Berkeliling’ menyampaikan gerak itineran itu secara alami.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: ke semua kota di Yehuda
  rationale: Dengan verba gerak ‘berkeliling’, preposisi ב dapat diungkapkan secara idiomatis dengan ‘ke’, yang menunjukkan bahwa mereka mendatangi kota-kota itu dalam perjalanan mereka.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: dan mengajar di tengah-tengah rakyat
  rationale: Preposisi ב pada בָּעָם secara harfiah menempatkan kegiatan mengajar itu ‘di antara/di tengah’ rakyat, bukan menandai objek langsung. Terjemahan ini mempertahankan nuansa lokatif tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. ‘Yahweh’ mempertahankan nama itu, sedangkan ‘TUHAN’ adalah penggantian tradisional dengan gelar.
- issue: Makna תּוֹרָה dalam frasa סֵפֶר תּוֹרַת יְהוָה
  choice: Taurat
  alternative: pengajaran
  rationale: תּוֹרָה dapat berarti ‘pengajaran’, tetapi dalam frasa yang menunjuk dokumen tertulis milik Yahweh di konteks ini, ‘Taurat’ paling jelas menyampaikan kumpulan hukum/pengajaran perjanjian tanpa menentukan lebih jauh luas persis dokumen tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ‘bersama mereka ada’ sengaja dipertahankan untuk mencerminkan klausa nominal Ibrani, sementara ‘berkeliling ke semua kota’ dipilih agar gerak dari kota ke kota terdengar alami. Istilah ‘rakyat’ cocok bagi penduduk Yehuda dalam konteks kerajaan.
