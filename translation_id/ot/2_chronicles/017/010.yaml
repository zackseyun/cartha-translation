base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: id
  text: Ketakutan akan Yahweh menimpa semua kerajaan di negeri-negeri di sekitar Yehuda[a], dan mereka tidak berperang melawan Yosafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kegentaran dari Yahweh” atau “kegentaran yang ditimbulkan Yahweh.” Frasa Ibrani ini dapat berarti ketakutan yang berkaitan dengan Yahweh; dalam konteks ini, kemungkinan besar yang dimaksud ialah kegentaran yang didatangkan-Nya atas kerajaan-kerajaan di sekitar Yehuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: melanda
  rationale: Bersama nomina abstrak פַּחַד dan preposisi עַל, bentuk ini menyatakan timbulnya keadaan yang menimpa pihak tertentu. 'Melanda' alami dalam bahasa Indonesia dan menyampaikan datangnya ketakutan dengan kuat.
- source_word: פַּחַד יְהוָה
  choice: ketakutan akan Yahweh
  rationale: פַּחַד dapat berarti ketakutan, kegentaran, atau kedahsyatan. Frasa konstruksi ini dapat menunjuk pada rasa takut terhadap Yahweh ataupun ketakutan yang berasal dari-Nya; terjemahan utama mempertahankan ambiguitas tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sesuai bukti teks sumber dan lapisan konsultasi yang diberikan.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: semua kerajaan di negeri-negeri
  rationale: עַל menandai pihak yang dilanda ketakutan. Ungkapan Indonesia ini mempertahankan kedua unsur, yaitu 'kerajaan' dan 'negeri-negeri', tanpa menghasilkan susunan yang terlalu kaku.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: sekitar Yehuda
  rationale: Frasa ringkas ini secara alami menyatakan bahwa negeri-negeri tersebut berada di sekeliling Yehuda.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: sehingga mereka tidak berperang melawan
  rationale: Secara harfiah konjungsi dapat diterjemahkan 'dan', tetapi dalam konteks ini klausa kedua menyatakan akibat dari ketakutan tersebut. 'Berperang melawan' menyampaikan makna militer נלחם עם secara jelas.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna פַּחַד יְהוָה dalam konteks
  choice: Mempertahankan frasa 'ketakutan akan Yahweh' dalam teks utama, dengan konteks yang menunjukkan kegentaran yang mencegah perang.
  alternative: '''Kegentaran dari Yahweh'' atau ''kedahsyatan Yahweh'', yang secara eksplisit menyatakan bahwa Yahweh adalah sumber ketakutan itu.'
  rationale: Konteks politik-militer kuat mengarah pada kegentaran yang didatangkan oleh Allah, bukan terutama sikap hormat yang saleh. Namun, bentuk konstruksi Ibrani tidak secara eksplisit menetapkan hubungan genitifnya, sehingga teks utama tidak menutup ambiguitas itu dan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. 'Melanda' dipilih untuk idiom timbulnya ketakutan, sedangkan 'sehingga' memperjelas hubungan akibat yang tersirat tanpa mengubah alur ayat.
