base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/019.yaml
  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: id
  text: Mereka inilah yang melayani raja, selain mereka yang ditempatkan[a] raja di kota-kota berbenteng di seluruh Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: ditugaskan.'
    reason: Alternatif ini mencerminkan bahwa נָתַן secara kontekstual dapat menyatakan penempatan atau penugasan personel.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Ungkapan ini menunjuk kembali secara tegas kepada para pejabat dan pasukan yang baru saja disebutkan, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: yang melayani raja
  rationale: Partisipel dari שׁרת menyatakan pelayanan atau pelaksanaan tugas bagi seseorang, sering dalam kapasitas resmi. 'Melayani raja' mempertahankan makna dasarnya tanpa memberi nuansa keagamaan yang tidak sesuai dengan konteks militer-administratif.
- source_word: מִלְּבַד
  choice: selain
  rationale: Kata ini membedakan kelompok yang telah disebutkan dari kelompok tambahan yang ditempatkan di kota-kota berbenteng.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: mereka yang ditempatkan raja
  rationale: נתן secara harfiah dapat berarti 'memberikan' atau 'menaruh', tetapi dalam konteks penugasan pasukan di kota-kota pertahanan, 'ditempatkan' menyampaikan fungsi kontekstualnya dengan tepat. Susunan aktif dengan 'raja' tetap dekat dengan struktur Ibrani.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: di kota-kota berbenteng
  rationale: Frasa konstruksi ini mengacu pada kota-kota yang diperkuat untuk pertahanan; 'kota-kota berbenteng' merupakan padanan Indonesia yang baku dan jelas.
- source_word: בְּכָל יְהוּדָה
  choice: di seluruh Yehuda
  rationale: Gabungan preposisi dengan כָּל menyatakan cakupan di seluruh wilayah Yehuda.
