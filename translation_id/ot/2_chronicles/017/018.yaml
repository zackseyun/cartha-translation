  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: id
  text: Di sisinya[a] ada Yozabad, dan bersamanya ada 180.000 orang yang diperlengkapi untuk berperang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada tangannya”; ungkapan ini juga dapat berarti berada di bawah arahannya atau ditempatkan di dekatnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “180.000 prajurit yang siap berperang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Di sisinya
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'pada/di tangannya' dan dalam daftar militer dapat menunjukkan posisi di sisi seseorang atau keterkaitan di bawah arahannya. 'Di sisinya' mempertahankan gambaran ungkapan itu tanpa memastikan hubungan komando yang tidak dinyatakan secara tegas.
- source_word: יְהוֹזָבָד
  choice: Yozabad
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang wajar dan lazim bagi pembaca bahasa Indonesia.
- source_word: וְעִמּוֹ
  choice: dan bersamanya ada
  rationale: Kata depan עִם menyatakan penyertaan atau kebersamaan; kata 'ada' melengkapi klausa secara alami dalam bahasa Indonesia.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: '180.000'
  rationale: Bilangan Ibrani berarti seratus delapan puluh ribu; angka ditulis dengan format numerik Indonesia agar mudah dibaca dalam konteks daftar militer.
- source_word: חֲלוּצֵי צָבָא
  choice: orang yang diperlengkapi untuk berperang
  rationale: חֲלוּצֵי menunjuk kepada orang-orang yang diperlengkapi atau bersiap bagi tugas militer, sedangkan צָבָא memberi konteks perang atau pasukan. Pilihan ini menyampaikan kedua unsur tanpa mempersempitnya menjadi jenis pasukan tertentu.
