source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֨ת שָׁל֜וֹשׁ לְ/מָלְכ֗/וֹ שָׁלַ֤ח לְ/שָׂרָי/ו֙ לְ/בֶן חַ֨יִל֙ וּ/לְ/עֹבַדְיָ֣ה וְ/לִ/זְכַרְיָ֔ה וְ/לִ/נְתַנְאֵ֖ל וּ/לְ/מִיכָיָ֑הוּ לְ/לַמֵּ֖ד בְּ/עָרֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: id
  text: Pada tahun ketiga pemerintahannya, ia mengutus para pejabatnya[a]—Ben-Hail, Obaja, Zakharia, Netaneel, dan Mikha—untuk mengajar di kota-kota Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pembesarnya”, “para pemimpinnya”, atau “para pangerannya”; istilah Ibrani ini dapat menunjuk kepada pejabat kerajaan atau pemerintahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ
  choice: Pada tahun ketiga
  rationale: Ungkapan waktu ini diterjemahkan secara alami dalam bahasa Indonesia. Konjungsi waw berfungsi melanjutkan narasi dan tidak harus dinyatakan dengan “dan” pada awal kalimat.
- source_word: לְמָלְכוֹ
  choice: pemerintahannya
  rationale: Bentuk ini menunjuk pada masa ia memerintah sebagai raja; “pemerintahannya” alami dan tetap mempertahankan makna masa kekuasaan.
- source_word: שָׁלַח
  choice: ia mengutus
  rationale: Dalam konteks penugasan resmi, “mengutus” lebih tepat dan bermartabat daripada sekadar “mengirim”.
- source_word: לְשָׂרָיו
  choice: para pejabatnya
  rationale: Kata שַׂר dapat berarti pembesar, pemimpin, pangeran, atau pejabat. Dalam konteks utusan kerajaan yang diberi tugas mengajar, “para pejabatnya” menyampaikan fungsi administratif tanpa menyiratkan bahwa mereka anggota keluarga kerajaan.
- source_word: לְבֶן חַיִל
  choice: Ben-Hail
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan; tanda hubung mempertahankan kejelasan bentuk nama majemuk.
- source_word: וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: Obaja, Zakharia, Netaneel, dan Mikha
  rationale: Nama-nama diri disajikan menurut bentuk yang lazim dan mudah dikenali dalam tradisi bahasa Indonesia, dengan “Netaneel” mencerminkan bentuk Ibrani נְתַנְאֵל.
- source_word: לְלַמֵּד
  choice: untuk mengajar
  rationale: Bentuk piel infinitif dari למד secara langsung berarti “mengajar” atau “memberi pengajaran”; “untuk mengajar” jelas menyatakan tujuan pengutusan.
- source_word: בְּעָרֵי יְהוּדָה
  choice: di kota-kota Yehuda
  rationale: Preposisi בְּ menyatakan lokasi. Terjemahan ini mempertahankan arti langsung tanpa menambahkan nuansa distributif “di seluruh” yang hanya tersirat.
theological_decisions: []
