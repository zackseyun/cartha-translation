base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: id
  text: Hatinya dikuatkan untuk mengikuti jalan-jalan Yahweh,[a] dan selain itu ia menyingkirkan tempat-tempat pemujaan di tempat tinggi serta tiang-tiang Asyera[b] dari Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hatinya menjadi tinggi dalam jalan-jalan Yahweh.” Ungkapan Ibrani ini dapat menggambarkan hati yang terangkat atau menjadi berani; dalam konteks ini maknanya positif, bukan kesombongan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini juga dapat diterjemahkan “Asyerim” atau “benda-benda sakral Asyera”; bentuk persis benda-benda pemujaan tersebut tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: Hatinya menjadi teguh
  rationale: Secara harfiah idiom ini menggambarkan hati yang menjadi tinggi. Dalam konteks positif ini, ungkapan tersebut menunjuk pada keteguhan atau keberanian batin, bukan kesombongan. Terjemahan utama dibuat alami dalam bahasa Indonesia, sedangkan metafora Ibraninya dicatat dalam catatan kaki.
- source_word: בְּדַרְכֵי יְהוָה
  choice: dalam mengikuti jalan-jalan Yahweh
  rationale: Bentuk jamak 'jalan-jalan' dipertahankan sebagai gambaran tentang pola hidup atau perilaku, sementara 'mengikuti' menjadikan hubungan idiomatisnya jelas bagi pembaca Indonesia.
- source_word: וְעוֹד
  choice: dan selain itu
  rationale: Menandai tindakan tambahan yang dilakukan Yosafat dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: הַבָּמוֹת
  choice: bukit-bukit pemujaan
  rationale: Istilah ini menunjuk pada tempat-tempat ibadah kultis yang lazimnya berada di tempat tinggi; pilihan ini lebih mudah dipahami daripada terjemahan harfiah 'tempat-tempat tinggi'.
- source_word: הָאֲשֵׁרִים
  choice: tiang-tiang Asyera
  rationale: Bentuk jamak ini merujuk pada benda-benda kultis yang berkaitan dengan penyembahan Asyera. 'Tiang-tiang Asyera' komunikatif tanpa memastikan secara berlebihan bentuk persis setiap bendanya.
- source_word: מִיהוּדָה
  choice: dari Yehuda
  rationale: Preposisi tersebut menyatakan bahwa benda dan tempat kultis itu disingkirkan dari wilayah Yehuda.
theological_decisions:
- issue: Apakah ungkapan tentang hati Yosafat bermakna kesombongan atau keteguhan yang positif
  choice: Keteguhan dan keberanian batin dalam mengikuti jalan-jalan Yahweh
  alternative: Hatinya meninggi atau menjadi sombong dalam jalan-jalan Yahweh
  rationale: Keterangan 'dalam jalan-jalan Yahweh' dan tindakan reformasi sesudahnya mendukung makna positif. Namun, gambaran harfiah tentang hati yang menjadi tinggi tetap disampaikan dalam catatan kaki agar ambiguitas leksikalnya tidak hilang.
- issue: Seberapa khusus אֲשֵׁרִים harus diterjemahkan
  choice: tiang-tiang Asyera
  alternative: Asyerim; benda-benda sakral
  rationale: Pilihan utama menghubungkan benda tersebut dengan kultus Asyera dan mudah dipahami, sedangkan catatan kaki mengakui bahwa bentuk bendanya tidak dapat ditentukan secara pasti.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi nama pribadi dipertahankan sesuai bukti sumber dan lapisan konsultasi, tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan istilah teologis dan unsur metaforis penting melalui catatan kaki.
