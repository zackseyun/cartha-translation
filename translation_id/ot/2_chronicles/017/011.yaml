base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: id
  text: 'Sebagian orang Filistin membawa kepada Yosafat upeti dan perak sebagai muatan[a]. Orang-orang Arab juga membawa ternak kepadanya: 7.700 ekor domba jantan dan 7.700 ekor kambing jantan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perak, suatu muatan”—yakni perak yang diangkut sebagai upeti. Frasa pembuka juga dapat diterjemahkan, “Dari orang Filistin dibawa kepada Yosafat upeti dan perak sebagai muatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: Sebagian orang Filistin
  rationale: מִן dengan nama kelompok dapat bermakna sumber ('dari orang Filistin') atau partitif ('sebagian orang Filistin'). Terjemahan utama memakai nuansa partitif yang alami, sementara kemungkinan sumber dicatat dalam catatan kaki.
- source_word: מְבִיאִים
  choice: membawa
  rationale: Bentuk partisip Ibrani menunjukkan tindakan yang berlangsung atau berulang. Dalam konteks ringkasan keadaan pemerintahan Yosafat, bentuk Indonesia tanpa penanda aspek khusus tetap alami dan dapat mencakup kebiasaan tersebut.
- source_word: מִנְחָה
  choice: upeti
  rationale: Dalam konteks bangsa asing yang membawa pemberian kepada seorang raja, kata ini menunjuk pada upeti, bukan persembahan ibadah.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: berupa perak yang menjadi muatan
  rationale: כֶסֶף berarti 'perak' dan מַשָּׂא berarti 'muatan/beban'. Ungkapan ini mempertahankan gambaran konkret tentang perak yang diangkut sebagai upeti sambil terdengar jelas dalam bahasa Indonesia.
- source_word: גַּם הָעַרְבִיאִים
  choice: Orang-orang Arab juga
  rationale: Mempertahankan daya tambah גַּם dan memakai sebutan kelompok yang lazim dalam bahasa Indonesia modern.
- source_word: ל/וֹ צֹאן
  choice: ternak kepadanya
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing; rincian berikutnya menyebut domba jantan dan kambing jantan.
- source_word: אֵילִים
  choice: domba jantan
  rationale: Padanan Indonesia modern yang jelas bagi domba jantan dewasa.
- source_word: שִׁבְעַת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: '7.700'
  rationale: Angka Arab dengan tanda titik sebagai pemisah ribuan mengikuti kebiasaan penulisan Indonesia modern.
- source_word: וּ/תְיָשִׁים
  choice: kambing jantan
  rationale: תְיָשִׁים secara khusus berarti kambing jantan, sehingga unsur jenis kelamin dipertahankan.
