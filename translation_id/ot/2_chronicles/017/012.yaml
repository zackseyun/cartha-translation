source:
  edition: WLC
  text: וַ/יְהִ֧י יְהוֹשָׁפָ֛ט הֹלֵ֥ךְ וְ/גָדֵ֖ל עַד לְ/מָ֑עְלָ/ה וַ/יִּ֧בֶן בִּֽ/יהוּדָ֛ה בִּירָנִיּ֖וֹת וְ/עָרֵ֥י מִסְכְּנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: id
  text: Yosafat terus bertambah besar hingga menjadi sangat besar. Ia membangun benteng-benteng[a] dan kota-kota penyimpanan[b] di Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kubu-kubu pertahanan". Kata Ibraninya menunjuk pada bangunan atau tempat pertahanan yang kukuh.
    reason: lexical_alternative
  - marker: b
    text: Atau "kota-kota perbekalan" atau "kota-kota persediaan".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: terus bertambah besar hingga menjadi sangat besar
  rationale: Gabungan verba pengantar dengan partisipel הֹלֵךְ וְגָדֵל menyatakan perkembangan yang terus berlangsung, sedangkan עַד לְמָעְלָה memperkuat tingkat pertumbuhan itu. Ungkapan ini mempertahankan gagasan kebesaran tanpa mempersempitnya secara sepihak menjadi kekuatan militer atau kekayaan.
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Padanan naratif yang langsung dan wajar untuk verba בנה.
- source_word: בִּירָנִיּוֹת
  choice: benteng-benteng
  rationale: Kata ini menunjuk pada bangunan atau tempat pertahanan yang kukuh. 'Benteng-benteng' jelas bagi pembaca modern dan tidak menimbulkan gambaran abad pertengahan seperti 'kastel'.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: kota-kota penyimpanan
  rationale: Frasa ini menunjuk pada kota-kota yang berfungsi menyimpan persediaan atau perbekalan. Pilihan ini mempertahankan fungsi penyimpanan tanpa membatasi isinya pada harta atau kebutuhan militer saja.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Frasa lokatif yang menyatakan tempat pembangunan tersebut.
theological_decisions: []
