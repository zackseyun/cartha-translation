base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: id
  text: 'Inilah daftar mereka[a] menurut kaum keluarga leluhur mereka: untuk Yehuda, para pemimpin pasukan seribu: Adna, sang pemimpin, dan bersamanya tiga ratus ribu pejuang yang gagah perkasa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “daftar mereka” juga dapat berarti “jumlah mereka”, “pendaftaran mereka”, atau susunan pasukan hasil pendataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: pasukan mereka yang terdaftar
  rationale: Dalam konteks militer, kata ini dapat menunjuk pada pendataan, pengerahan, atau susunan orang-orang yang terdaftar. Ungkapan ini menjaga unsur pendataan sekaligus cocok dengan daftar kesatuan dan jumlah prajurit yang menyusul.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: menurut kaum keluarga leluhur mereka
  rationale: Ungkapan administratif-genealogis ini menunjuk pada pengelompokan berdasarkan rumah leluhur atau marga. 'Kaum keluarga leluhur' alami dan jelas dalam bahasa Indonesia modern.
- source_word: לִיהוּדָה
  choice: Dari Yehuda
  rationale: Frasa ini memperkenalkan kelompok militer yang berasal dari Yehuda. 'Dari Yehuda' berfungsi alami sebagai kepala bagian dalam daftar.
- source_word: שָׂרֵי אֲלָפִים
  choice: para pemimpin pasukan seribu
  rationale: Gelar militer ini menunjuk kepada pejabat yang mengepalai kesatuan yang dihitung menurut ribuan; tambahan 'pasukan' memperjelas konteks tanpa menetapkan struktur modern yang terlalu khusus.
- source_word: עַדְנָה הַשָּׂר
  choice: Adna, sang pemimpin
  rationale: הַשָּׂר menandai Adna sebagai pemimpin dalam entri ini. 'Sang pemimpin' mempertahankan hubungan leksikal dengan gelar sebelumnya dan menghindari pangkat modern yang terlalu spesifik.
- source_word: גִּבּוֹרֵי חַיִל
  choice: pejuang yang gagah perkasa
  rationale: Ungkapan idiomatis militer ini menggambarkan prajurit kuat dan teruji. Pilihan ini menyampaikan keberanian serta kemampuan tempur secara alami.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: '300.000'
  rationale: Angka kardinal diterjemahkan langsung dan ditulis dengan format angka Indonesia agar mudah dibaca.
