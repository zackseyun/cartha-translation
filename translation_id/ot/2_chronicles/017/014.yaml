- from: 'Inilah pasukan mereka yang terdaftar menurut kaum keluarga leluhur mereka: Dari Yehuda, para pemimpin pasukan seribu: Adna, sang pemimpin, dan bersamanya 300.000 pejuang yang gagah perkasa.[a]'
  to: 'Inilah daftar mereka[a] menurut kaum keluarga leluhur mereka: untuk Yehuda, para pemimpin pasukan seribu: Adna, sang pemimpin, dan bersamanya tiga ratus ribu pejuang yang gagah perkasa.'
