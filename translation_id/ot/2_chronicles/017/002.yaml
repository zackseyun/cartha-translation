  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: id
  text: Ia menempatkan pasukan di semua kota berbenteng di Yehuda. Ia juga menempatkan garnisun[a] di wilayah Yehuda dan di kota-kota Efraim yang telah direbut oleh Asa, ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pejabat,” “para wakil,” atau “para kepala daerah.” Istilah Ibrani נְצִיבִים dapat menunjuk kepada pejabat yang ditunjuk maupun garnisun; konteks militer di sini mendukung “garnisun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: Ia menempatkan pasukan
  rationale: נתן secara harfiah berarti memberi atau menaruh, tetapi bersama חַיִל dan keterangan tempat, konteksnya menunjukkan pengerahan pasukan. 'Menempatkan pasukan' alami dalam bahasa Indonesia dan mempertahankan makna militernya.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: di semua kota berbenteng di Yehuda
  rationale: Ungkapan ini secara langsung menunjuk kepada seluruh kota Yehuda yang diperkuat pertahanannya; 'kota berbenteng' merupakan padanan yang tepat dan lazim.
- source_word: נְצִיבִים
  choice: garnisun
  rationale: Kata ini dapat menunjuk kepada pejabat yang ditempatkan atau pos/pasukan militer. Konteks pengamanan kota-kota berbenteng dan wilayah taklukan mendukung arti militer, sementara kemungkinan administratif dipertahankan dalam catatan kaki.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: di wilayah Yehuda
  rationale: אֶרֶץ di sini menunjuk kepada kawasan kekuasaan Yehuda secara lebih luas, bukan hanya kota-kotanya. 'Wilayah' menyampaikan cakupan teritorial itu dengan alami.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: dan di kota-kota Efraim
  rationale: Terjemahan langsung yang mempertahankan nama geografis-sukubangsa Efraim.
- source_word: אֲשֶׁר לָכַד
  choice: yang telah direbut
  rationale: לכד lazim berarti merebut atau menaklukkan kota. Bentuk 'telah direbut' menunjukkan bahwa tindakan Asa mendahului penempatan garnisun oleh Yosafat.
- source_word: אָסָא אָבִיו
  choice: Asa, ayahnya
  rationale: Frasa ini mengidentifikasi Asa sebagai ayah Yosafat; aposisi dengan koma jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dibagi menjadi dua kalimat agar rangkaian dua verba וַיִּתֶּן tetap jelas tanpa menghasilkan kalimat Indonesia yang berat. Istilah 'garnisun' dipakai sebagai istilah militer yang ringkas, dengan ambiguitas administratif teks sumber dijaga melalui catatan kaki.
