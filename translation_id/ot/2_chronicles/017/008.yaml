base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: id
  text: Bersama mereka ada orang-orang Lewi, yaitu Semaya, Netanya, Zebaja, Asael, Semiramot, Yonatan[a], Adonia, Tobia[b], dan Tob-Adonia[c]. Bersama mereka juga ada imam-imam Elisama dan Yoram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk nama yang lebih lengkap, Yehonatan; bentuk pendeknya ialah Yonatan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai bentuk nama lengkap Tobiyahu; Tobia adalah bentuk yang lazim dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani menuliskan “Tob Adonia” sebagai dua unsur, tetapi kemungkinan besar keduanya merupakan satu nama majemuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Bersama mereka ada
  rationale: Frasa ini menyatakan penyertaan; kata 'ada' melengkapi kalimat secara alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Bentuk ini lazim dan mudah dipahami untuk anggota golongan Lewi, serta mempertahankan ketakrifan konteks Ibrani.
- source_word: שְׁמַעְיָהוּ וּנְתַנְיָהוּ וּזְבַדְיָהוּ וַעֲשָׂהאֵל וּשְׁמִירָמוֹת
  choice: Semaya, Netanya, Zebaja, Asael, Semiramot
  rationale: Nama-nama diri dialihaksarakan menurut bentuk yang wajar dalam tradisi Alkitab bahasa Indonesia.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk Indonesia yang alami untuk nama Ibrani yang lebih lengkap ini; catatan kaki menjelaskan bentuk sumbernya.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Alih aksara yang wajar dan dikenal dalam bahasa Indonesia.
- source_word: טוֹבִיָּהוּ
  choice: Tobia
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia; unsur akhir nama Ibrani dijelaskan dalam catatan kaki.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: Tob-Adonia
  rationale: Tanda hubung mempertahankan kemungkinan kuat bahwa dua unsur dalam teks Masoret merupakan satu nama majemuk.
- source_word: הַכֹּהֲנִים
  choice: imam-imam
  rationale: Menandai Elisama dan Yoram sebagai kelompok imam yang terpisah dari daftar orang Lewi sebelumnya.
theological_decisions:
- issue: Pembedaan antara orang Lewi dan imam
  choice: Daftar pertama disebut orang-orang Lewi, sedangkan Elisama dan Yoram secara terpisah disebut imam-imam.
  alternative: Menganggap semua nama dalam ayat sebagai orang Lewi tanpa membedakan dua nama terakhir sebagai imam.
  rationale: Sintaksis Ibrani mengulangi 'bersama mereka' lalu secara khusus menerangkan Elisama dan Yoram sebagai para imam; pembedaan kelembagaan ini perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dibuat jelas dengan 'yaitu'; pengulangan 'bersama mereka' dipertahankan untuk mencerminkan susunan Ibrani. Semua penanda catatan kaki ditempatkan langsung setelah nama terkait.
