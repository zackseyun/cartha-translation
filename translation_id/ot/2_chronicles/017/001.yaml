base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: id
  text: Yosafat, anak Asa, menjadi raja menggantikan Asa, dan ia memperkuat diri menghadapi Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Menyampaikan verba Ibrani yang berarti mulai memerintah sebagai raja secara alami dalam bahasa Indonesia.
- source_word: בְּנוֹ תַּחְתָּיו
  choice: anak Asa ... menggantikan ayahnya
  rationale: Pronomina sumber merujuk kepada Asa dalam konteks sebelumnya; penyebutan nama dan 'ayahnya' memperjelas rujukan tanpa menambah informasi baru.
- source_word: וַיִּתְחַזֵּק
  choice: memperkuat kedudukannya
  rationale: Bentuk hitpael menyatakan bahwa Yosafat membuat dirinya atau posisinya kuat; ungkapan ini alami dan tidak terlalu mempersempit cara ia melakukannya.
- source_word: עַל יִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Preposisi עַל di sini dapat bernuansa permusuhan atau pertahanan menghadapi kerajaan Israel. 'Terhadap' mempertahankan keluasan relasi itu tanpa mengartikannya sebagai kekuasaan atas Israel.
theological_decisions:
- issue: Arti עַל dalam hubungan Yosafat dengan Israel
  choice: terhadap Israel
  alternative: melawan Israel; atas Israel
  rationale: Konteks ayat-ayat berikutnya menunjukkan langkah pertahanan terhadap kerajaan utara, sehingga 'atas Israel' dapat keliru menyiratkan bahwa Yosafat memerintah Israel. 'Terhadap' mempertahankan ketegangan semantis tanpa melebihkan tindakan ofensif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama 'Asa' dinyatakan untuk memperjelas anteseden yang tersedia dalam konteks, sedangkan 'kedudukannya' membuat konstruksi refleksif Ibrani terdengar alami.
