  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: id
  text: Di bawah komandonya ada Amasya bin Zikhri, yang dengan sukarela mengabdikan dirinya kepada Yahweh[a]. Bersamanya ada dua ratus ribu prajurit perkasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang dengan sukarela menyerahkan dirinya untuk Yahweh.” Partisipel Ibrani menekankan penyerahan diri secara sukarela, dan preposisinya dapat dipahami sebagai “kepada” atau “untuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Di bawah komandonya ada
  rationale: Ungkapan עַל יָד dengan akhiran pronominal dalam daftar militer menunjukkan kedudukan di bawah wewenang seseorang. Terjemahan ini menyampaikan fungsi idiom tersebut secara alami dalam bahasa Indonesia.
- source_word: עֲמַסְיָה
  choice: Amasya
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: בֶן זִכְרִי
  choice: bin Zikhri
  rationale: Konstruksi genealogis בן diterjemahkan dengan “bin,” bentuk ringkas dan lazim dalam bahasa Indonesia untuk menyatakan hubungan ayah-anak; nama זִכְרִי ditransliterasikan sebagai “Zikhri” untuk mempertahankan bunyi konsonan Ibraninya.
- source_word: הַמִּתְנַדֵּב
  choice: yang dengan sukarela mengabdikan dirinya
  rationale: Partisipel hitpael dari נדב menyatakan tindakan sukarela yang melibatkan penyerahan diri. Klausa relatif ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa refleksif dan dedikatif.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל dapat menandai arah atau peruntukan pengabdian. “Kepada” sesuai dengan pilihan utama “mengabdikan dirinya,” sementara nama perjanjian יהוה ditampilkan sebagai “Yahweh.”
- source_word: וְעִמּוֹ
  choice: Bersamanya ada
  rationale: Frasa ini memperkenalkan pasukan yang menyertai Amasya. Penambahan “ada” menghasilkan kalimat Indonesia yang lengkap dan alami.
- source_word: מָאתַיִם אֶלֶף
  choice: dua ratus ribu
  rationale: Terjemahan langsung konstruksi bilangan Ibrani.
- source_word: גִּבּוֹר חָיִל
  choice: prajurit perkasa
  rationale: Ungkapan militer ini menunjuk kepada orang-orang yang kuat, cakap, dan tangguh dalam pertempuran. “Prajurit perkasa” ringkas, jelas, dan mempertahankan ragam bahasa yang luhur.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Arah atau peruntukan pengabdian dalam לַיהוָה
  choice: mengabdikan dirinya kepada Yahweh
  alternative: menyerahkan dirinya dengan sukarela untuk Yahweh
  rationale: Preposisi ל memungkinkan nuansa “kepada” maupun “untuk.” Teks utama memilih arah pengabdian, sedangkan catatan kaki mempertahankan kemungkinan nuansa peruntukan tanpa memaksakan salah satunya sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sedangkan istilah militer “prajurit perkasa” mempertahankan nada luhur teks. Nama-nama ditransliterasikan sebagai Amasya, Zikhri, dan Yahweh.
