base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: id
  text: Yahweh menyertai Yosafat karena ia hidup menurut jalan-jalan Daud, leluhurnya, pada masa awal Daud[a] dan tidak mencari para Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jalan-jalan Daud, leluhurnya, yang terdahulu.” Bahasa Ibrani menunjuk pada perilaku Daud pada masa awalnya, kemungkinan untuk membedakannya dari kegagalannya kemudian.'
    reason: Alternatif leksikal dan penjelasan atas cakupan הָרִאשֹׁנִים.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: וַיְהִי ... עִם
  choice: menyertai
  rationale: Ungkapan alami dalam bahasa Indonesia untuk kehadiran dan dukungan Yahweh kepada seseorang.
- source_word: כִּי
  choice: karena
  rationale: Menampilkan hubungan sebab yang dinyatakan klausa Ibrani.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: hidup mengikuti jalan-jalan
  rationale: Menyampaikan makna perilaku hidup sambil mempertahankan metafora etis tentang 'jalan'.
- source_word: דָּוִיד אָבִיו
  choice: Daud, leluhurnya
  rationale: אָב dapat menunjuk kepada bapak leluhur dalam garis dinasti; Daud bukan ayah langsung Yosafat. Pilihan ini alami dan akurat bagi pembaca Indonesia.
- source_word: הָרִאשֹׁנִים
  choice: yang dahulu
  rationale: Menunjukkan jalan atau perilaku Daud pada masa terdahulu tanpa mengubahnya menjadi penilaian yang lebih spesifik daripada teks.
- source_word: דָרַשׁ
  choice: mencari
  rationale: 'Mempertahankan keluasan makna religius: mencari, berpaling kepada, atau meminta petunjuk dari suatu ilah.'
- source_word: לַבְּעָלִים
  choice: para Baal
  rationale: Menjaga bentuk jamak Ibrani yang mengacu pada berbagai manifestasi atau kultus Baal.
theological_decisions:
- issue: Daud sebagai teladan meskipun ada kegagalannya pada masa kemudian
  choice: jalan-jalan Daud, leluhurnya, yang dahulu
  alternative: jalan-jalan Daud, leluhurnya, yang pertama
  rationale: Frasa ini mempertahankan pembatasan temporal dalam teks Ibrani dan kemungkinan kontras dengan perilaku Daud pada masa kemudian, tanpa menjelaskan kontras itu secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Hidup mengikuti jalan-jalan' menjaga metafora Ibrani tanpa menghasilkan ungkapan 'berjalan dalam jalan-jalan' yang kaku. Penanda catatan kaki [a] tercantum dalam teks utama.
