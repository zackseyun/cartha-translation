  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: id
  text: 'Dan dari suku Benyamin: Elyada, seorang pejuang yang gagah perkasa, dan bersamanya ada dua ratus ribu orang yang diperlengkapi dengan busur dan perisai.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן בִּנְיָמִן
  choice: Dari suku Benyamin
  rationale: Frasa ini memperkenalkan pasukan tambahan berdasarkan asal sukunya. Kata 'suku' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa Benyamin adalah kelompok asal, sedangkan hubungan dengan daftar sebelumnya tetap tampak dari susunan ayat.
- source_word: גִּבּוֹר חַיִל
  choice: seorang pejuang yang gagah perkasa
  rationale: Ungkapan ini menunjuk kepada seorang yang kuat, cakap, dan berani dalam konteks militer. Pilihan ini mempertahankan pujian personal sekaligus nuansa keprajuritan dengan bahasa Indonesia yang alami.
- source_word: אֶלְיָדָע
  choice: Elyada
  rationale: Nama diri dialihaksarakan menurut bentuk yang wajar dalam tradisi ejaan Alkitab bahasa Indonesia.
- source_word: וְעִמּוֹ
  choice: dan bersamanya
  rationale: Konjungsi dan frasa penyerta dipertahankan untuk menghubungkan panglima yang disebut lebih dahulu dengan pasukan di bawah pimpinannya.
- source_word: נֹשְׁקֵי
  choice: yang diperlengkapi dengan
  rationale: Partisip Ibrani ini dalam konteks militer menggambarkan orang-orang yang dibekali atau dipersenjatai dengan perlengkapan yang disebut sesudahnya. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: קֶשֶׁת וּמָגֵן
  choice: busur dan perisai
  rationale: Kedua nomina tunggal dipakai secara kolektif untuk jenis perlengkapan pasukan; bentuk tunggal generik juga alami dalam bahasa Indonesia.
- source_word: מָאתַיִם אָלֶף
  choice: 200.000 orang
  rationale: Bilangan diterjemahkan langsung sebagai jumlah pasukan. Kata 'orang' memperjelas satuan yang tersirat oleh konteks.
