  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: id
  text: Namun, Hizkia merendahkan diri karena keangkuhan hatinya[a], demikian juga penduduk Yerusalem. Karena itu, murka Yahweh tidak menimpa mereka pada zaman Hizkia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “atas keangkuhan hatinya.” Ungkapan Ibraninya secara harfiah berarti “dalam/atas ketinggian hatinya,” yaitu idiom tentang kesombongan atau keangkuhan batin.
    reason: Menjelaskan idiom גֹבַהּ לִבּוֹ dan mempertahankan kemungkinan nuansa preposisi בְּ tanpa membebani teks utama dengan frasa yang ambigu.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: merendahkan diri
  rationale: 'Bentuk nifal כנע dalam konteks ini bermakna refleksif atau medial: Hizkia menanggapi dosanya dengan merendahkan dirinya, bukan sekadar dibuat rendah secara pasif.'
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: atas keangkuhan hatinya
  rationale: גֹבַהּ berarti 'ketinggian' atau 'keluhuran'; ketika dikaitkan dengan hati, ungkapan ini menunjuk pada kesombongan batin. Kata 'atas' cukup alami dalam bahasa Indonesia dan tetap memberi ruang bagi nuansa pokok perkara maupun sebab, yang dijelaskan dalam catatan kaki.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: demikian juga penduduk Yerusalem
  rationale: Susunan Ibrani menambahkan Hizkia dan penduduk Yerusalem sebagai pihak yang merendahkan diri. Perumusan ini menghindari pengulangan pronomina yang kaku, tetapi tetap menyatakan bahwa penduduk kota turut merendahkan diri.
- source_word: קֶצֶף יְהוָה
  choice: murka Yahweh
  rationale: קֶצֶף menunjuk pada murka atau amarah berat, khususnya dalam konteks penghukuman ilahi. Nama perjanjian יְהוָה dialihaksarakan sebagai 'Yahweh'.
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: tidak menimpa mereka
  rationale: Idiom בוא על menggambarkan sesuatu, khususnya penghukuman, yang datang menimpa orang. 'Tidak menimpa mereka' alami dan tepat dalam bahasa Indonesia.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: pada zaman Hizkia
  rationale: Ungkapan temporal ini menunjuk pada masa hidup atau pemerintahan Hizkia tanpa perlu mempersempitnya secara lebih khusus.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi dan tidak menggantinya dengan gelar.
- issue: Hubungan antara perendahan diri dan tertundanya murka ilahi
  choice: Karena itu, murka Yahweh tidak menimpa mereka pada zaman Hizkia
  alternative: dan murka Yahweh tidak menimpa mereka pada zaman Hizkia
  rationale: Konteks dan urutan klausa mendukung hubungan konsekuensial, tetapi terjemahan tidak menyatakan bahwa murka itu dibatalkan untuk selamanya; batas waktu 'pada zaman Hizkia' dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Namun' menghubungkan ayat ini dengan pembalikan dari kesombongan pada konteks sebelumnya; 'demikian juga' menjernihkan bahwa penduduk Yerusalem turut merendahkan diri. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang dijelaskan.
