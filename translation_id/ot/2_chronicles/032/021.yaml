  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ מַלְאָ֔ךְ וַ/יַּכְחֵ֞ד כָּל גִּבּ֥וֹר חַ֨יִל֙ וְ/נָגִ֣יד וְ/שָׂ֔ר בְּ/מַחֲנֵ֖ה מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּשָׁב֩ בְּ/בֹ֨שֶׁת פָּנִ֜ים לְ/אַרְצ֗/וֹ וַ/יָּבֹא֙ בֵּ֣ית אֱלֹהָ֔י/ו ו/מ/יציא/ו מֵעָ֔י/ו שָׁ֖ם הִפִּילֻ֥/הוּ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: id
  text: TUHAN mengutus seorang malaikat yang melenyapkan semua kesatria perkasa, pemimpin, dan panglima di perkemahan raja Asyur. Maka raja itu pulang ke negerinya dengan muka penuh malu. Ketika ia masuk ke rumah dewanya, beberapa anak kandungnya[a] menewaskannya di sana dengan pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: beberapa orang yang keluar dari isi perutnya; maksudnya, keturunannya sendiri.'
    reason: Menjelaskan ungkapan Ibrani yang sangat jasmaniah dan hubungan keturunan yang tersirat tanpa membebani teks utama.
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian ilahi, dengan huruf kapital penuh.
- source_word: מַלְאָךְ
  choice: malaikat
  rationale: Kata ini dapat berarti utusan atau malaikat; dalam konteks tindakan ilahi yang memusnahkan pasukan Asyur, 'malaikat' merupakan padanan alami tanpa menambahkan identitas yang tidak disebutkan.
- source_word: וַיַּכְחֵד
  choice: melenyapkan
  rationale: Menyampaikan tindakan pemusnahan menyeluruh yang terkandung dalam verba Ibrani.
- source_word: גִּבּוֹר חַיִל
  choice: kesatria perkasa
  rationale: Menggambarkan prajurit yang kuat dan cakap; 'kesatria' memberi nuansa militer yang sesuai bagi konteks perkemahan.
- source_word: נָגִיד וְשָׂר
  choice: pemimpin, dan panglima
  rationale: 'Mempertahankan dua jabatan yang berbeda: nagid sebagai pemimpin dan sar sebagai pejabat militer atau panglima dalam konteks pasukan.'
- source_word: בְּבֹשֶׁת פָּנִים
  choice: dengan muka penuh malu
  rationale: Mempertahankan gambaran konkret 'malu pada muka' dalam ungkapan Indonesia yang alami.
- source_word: בֵּית אֱלֹהָיו
  choice: rumah dewanya
  rationale: Secara harfiah berarti rumah milik dewanya, yakni kuil, tetapi pilihan ini mempertahankan citra dan susunan sumber.
- source_word: מִיצִיאֵי מֵעָיו
  choice: beberapa anak kandungnya
  rationale: Ungkapan harfiah menunjuk kepada orang-orang yang keluar dari tubuhnya, yaitu keturunannya sendiri. 'Anak kandungnya' menyampaikan makna idiomatis dengan jelas; bentuk partitif tidak menentukan jumlah, sehingga 'beberapa' dipakai secara wajar sesuai konteks.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: menewaskannya ... dengan pedang
  rationale: Ungkapan 'menjatuhkan dengan pedang' berarti membunuh; padanan ini alami dan tetap mempertahankan alat pembunuhannya.
theological_decisions:
- issue: Identitas מַלְאָךְ
  choice: malaikat
  alternative: utusan
  rationale: Teks tidak menyebut identitas atau nama malaikat itu. Terjemahan 'malaikat' sesuai konteks agen surgawi yang diutus TUHAN, tanpa menyamakannya dengan tokoh teologis tertentu.
- issue: Sebutan bagi אֱלֹהָיו milik raja Asyur
  choice: dewanya
  alternative: allahnya
  rationale: Huruf kecil dan kata 'dewa' membedakan ilah yang disembah raja Asyur dari TUHAN, sesuai kontras dalam konteks, tanpa menyebut nama dewa yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar dengan menyebut kembali 'raja itu' agar pergantian subjek dari malaikat kepada raja Asyur jelas. Tidak ada rincian identitas malaikat, dewa, atau anak-anak pembunuh yang ditambahkan di luar ayat.
