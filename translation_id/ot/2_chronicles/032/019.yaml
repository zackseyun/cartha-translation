id: 2CH.32.19
reference: 2 Chronicles 32:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: id
  text: Mereka berbicara menentang Allah Yerusalem sebagaimana mereka berbicara menentang allah-allah bangsa-bangsa di bumi, yang adalah buatan tangan manusia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Mereka berbicara
  rationale: Bentuk piel dari דבר di sini berarti ‘berbicara’. Nuansa permusuhan disampaikan melalui pelengkap ‘menentang’, bukan dengan memperkuat verba secara berlebihan.
- source_word: אֶל
  choice: menentang
  rationale: Walaupun אֶל biasanya berarti ‘kepada’, konteks ucapan menghina membuat ‘menentang’ menjadi padanan idiomatis yang tepat.
- source_word: אֱלֹהֵי יְרוּשָׁלָם
  choice: Allah Yerusalem
  rationale: Bentuk konstruk אֱלֹהֵי bermakna tunggal dalam konteks ini, menunjuk kepada Allah Israel dan dikontraskan dengan allah-allah buatan manusia.
- source_word: כְּעַל
  choice: sebagaimana ... menentang
  rationale: Ungkapan ini membandingkan cara mereka berbicara tentang Allah Yerusalem dengan cara mereka berbicara tentang allah bangsa-bangsa; pengulangan ‘berbicara menentang’ menghasilkan bahasa Indonesia yang jelas.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: allah bangsa-bangsa di bumi
  rationale: Di sini אֱלֹהֵי bermakna jamak. ‘Bangsa-bangsa di bumi’ menyampaikan cakupan luas עַמֵּי הָאָרֶץ secara alami.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: buatan tangan manusia
  rationale: Ungkapan ini menyatakan bahwa allah-allah tersebut adalah benda hasil karya manusia. ‘Buatan tangan manusia’ alami dan tetap mempertahankan kontras dengan Allah yang hidup.
theological_decisions:
- issue: Apakah ucapan itu ditujukan ‘kepada’ atau ‘menentang’ Allah Yerusalem
  choice: menentang
  alternative: kepada
  rationale: Konteks langsungnya adalah ucapan yang mengejek dan menghujat. ‘Menentang’ mengungkapkan daya permusuhan אֶל dalam konteks ini tanpa menambahkan gagasan teologis lain.
- issue: Apakah אֱלֹהֵי יְרוּשָׁלָם harus diterjemahkan tunggal atau jamak
  choice: Allah Yerusalem
  alternative: allah-allah Yerusalem
  rationale: Walaupun bentuknya secara morfologis dapat tampak jamak, אֱלֹהִים lazim bermakna tunggal ketika menunjuk kepada Allah Israel. Kontras dengan allah bangsa-bangsa yang dibuat manusia menegaskan pembacaan tunggal.
- issue: Rujukan frasa ‘buatan tangan manusia’
  choice: allah bangsa-bangsa di bumi
  alternative: seluruh pernyataan sebelumnya
  rationale: Secara sintaksis, frasa מַעֲשֵׂה יְדֵי הָאָדָם menerangkan allah-allah bangsa-bangsa, bukan Allah Yerusalem. Kata penghubung ‘yang’ membuat hubungan ini jelas dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Huruf kapital ‘Allah’ dipakai untuk Allah Israel, sedangkan ‘allah’ untuk dewa-dewa bangsa lain. Pengulangan ‘mereka berbicara menentang’ dipertahankan demi memperjelas perbandingan yang tersirat dalam כְּעַל.
