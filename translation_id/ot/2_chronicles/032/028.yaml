  text: storehouses for the produce of grain[a], new wine, and oil, and stalls for all kinds of animals[c][b], and folds for the flocks.
translation:
  language: id
  text: gudang-gudang[a] untuk hasil biji-bijian, anggur baru[b], dan minyak, kandang-kandang untuk segala jenis ternak, serta tempat-tempat berpagar[c] untuk kawanan ternak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kota-kota perbekalan.” Istilah Ibraninya juga dapat menunjuk pada kompleks penyimpanan yang lebih besar, bukan sekadar gudang.'
    reason: lexical_alternative
  - marker: b
    text: “Anggur baru” menerjemahkan תִירוֹשׁ (tiros), istilah yang dalam daftar hasil pertanian sering dibedakan dari kata yang lebih umum untuk anggur.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “kandang-kandang kawanan” atau “tempat-tempat tertutup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: gudang-gudang
  rationale: Dalam konteks penyimpanan hasil pertanian, kata ini menunjuk pada sarana penyimpanan. Bentuk ulang menyatakan jamak secara alami dalam bahasa Indonesia.
- source_word: תְבוּאַת דָּגָן
  choice: hasil gandum
  rationale: Frasa konstruksi ini berarti hasil atau produksi biji-bijian. 'Hasil gandum' ringkas dan mudah dipahami, dengan 'gandum' dipakai dalam arti umum untuk serealia dalam daftar pertanian ini.
- source_word: תִירוֹשׁ
  choice: anggur baru
  rationale: Istilah ini lazim muncul dalam rangkaian hasil pertanian dan dibedakan dari istilah Ibrani yang lebih umum untuk anggur. 'Anggur baru' mempertahankan pembedaan leksikal tersebut.
- source_word: יִצְהָר
  choice: minyak
  rationale: Dalam rangkaian gandum, anggur baru, dan minyak, istilah ini menunjuk pada minyak, biasanya minyak zaitun. Bentuk ringkas 'minyak' mengikuti kadar kekhususan teks.
- source_word: אֻרָוֹת
  choice: kandang-kandang
  rationale: Kata ini menunjuk pada tempat untuk menampung atau memberi makan hewan. 'Kandang-kandang' merupakan padanan Indonesia yang luas dan alami.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: untuk segala jenis ternak
  rationale: Pengulangan kata benda dalam frasa ini bersifat distributif. 'Segala jenis ternak' menyampaikan maknanya secara alami tanpa membatasi rujukan hanya pada sapi.
- source_word: עֲדָרִים
  choice: kawanan ternak
  rationale: Kata ini mengacu pada kawanan, terutama domba atau kambing. 'Kawanan ternak' dapat dipahami pembaca modern tanpa menambahkan jenis hewan yang tidak dinyatakan.
- source_word: אֲוֵרוֹת
  choice: tempat-tempat berpagar
  rationale: Istilah ini menunjuk pada tempat tertutup atau berpagar untuk menahan kawanan. Pilihan ini membedakannya dari kandang-kandang yang disebut sebelumnya.
