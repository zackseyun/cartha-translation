id: 2CH.32.12
reference: 2 Chronicles 32:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: id
  text: Bukankah Hizkia sendiri yang menyingkirkan bukit-bukit pengorbanan-Nya dan mezbah-mezbah-Nya, lalu berkata kepada Yehuda dan Yerusalem, ‘Di hadapan satu mezbah saja kalian harus sujud, dan di atasnya kalian harus membakar dupa[a]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Di hadapan satu mezbah saja kalian harus beribadah, dan di atasnya kalian harus membakar persembahan hingga asapnya naik.”'
    reason: תִּשְׁתַּחֲווּ dapat mencakup tindakan beribadah, dan תַּקְטִירוּ dapat merujuk lebih luas pada pembakaran persembahan, bukan hanya dupa.
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mengungkapkan pertanyaan retoris yang mengharapkan persetujuan dan terdengar alami dalam bahasa Indonesia.
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: Hizkia sendiri
  rationale: Kata ganti yang menyertai nama diri memberi penekanan; 'sendiri' mempertahankannya secara alami.
- source_word: הֵסִיר
  choice: menyingkirkan
  rationale: Menyampaikan tindakan menghapus atau meniadakan tempat dan sarana ibadah.
- source_word: בָּמֹתָיו
  choice: tempat-tempat pemujaan ...-Nya
  rationale: במה menunjuk pada lokasi ibadah setempat yang lazim disebut 'bukit pengorbanan'; ungkapan ini lebih mudah dipahami pembaca umum, sedangkan akhiran posesif tetap dipertahankan sebagai sudut pandang polemis si pembicara.
- source_word: מִזְבְּחֹתָיו
  choice: mezbah-mezbah-Nya
  rationale: Mempertahankan akhiran posesif Ibrani dan istilah kultis yang umum dalam bahasa Indonesia Alkitabiah.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: lalu berkata kepada Yehuda dan Yerusalem
  rationale: Menyampaikan pengantar ujaran dengan wajar; לֵאמֹר tidak perlu digandakan menjadi 'dengan berkata' karena kutipan langsung sudah menjalankan fungsinya.
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: Di hadapan satu mezbah saja
  rationale: '''Di hadapan'' mempertahankan makna spasial לִפְנֵי, sementara ''saja'' menegaskan pembatasan pada satu mezbah yang tersirat dalam tuduhan tersebut.'
- source_word: תִּשְׁתַּחֲווּ
  choice: kalian harus sujud
  rationale: Mempertahankan gambaran jasmani bersujud dalam ibadah; 'kalian' membedakan bentuk jamak orang kedua.
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: dan di atasnya kalian harus membakar dupa
  rationale: קטר dalam bentuk Hifil lazim merujuk pada pembakaran dupa, tetapi dapat pula berarti membuat persembahan naik sebagai asap; alternatif dicatat dalam catatan kaki.
theological_decisions:
- issue: Sudut pandang pembicara dalam akhiran posesif pada 'tempat-tempat pemujaan' dan 'mezbah-mezbah'
  choice: Mempertahankan posesif ilahi sebagai 'tempat-tempat pemujaan dan mezbah-mezbah-Nya'
  alternative: tempat-tempat pemujaan dan mezbah-mezbah itu
  rationale: Akhiran posesif terdapat secara eksplisit dalam bahasa Ibrani. Bentuk ini mempertahankan cara utusan Asyur menggambarkan tempat-tempat tersebut sebagai milik TUHAN, tanpa membenarkan atau mengoreksi tuduhannya.
- issue: Bahasa pemusatan ibadah
  choice: Menyebut 'satu mezbah saja' tanpa menjelaskan reformasi Hizkia dalam teks utama
  alternative: hanya di mezbah Bait Allah
  rationale: Ayat ini melaporkan tuduhan si pembicara, bukan penjelasan teologis narator. Terjemahan tidak boleh diam-diam menyelesaikan ketegangan tersebut.
- issue: Cakupan makna תַּקְטִירוּ
  choice: membakar dupa
  alternative: membakar persembahan hingga asapnya naik
  rationale: Makna dupa lazim dan ringkas, tetapi verba ini juga dapat dipakai lebih luas untuk membuat persembahan naik sebagai asap; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai untuk menandai orang kedua jamak dengan jelas. Kapital pada '-Nya' menunjukkan bahwa posesif tersebut merujuk kepada Allah, tetapi tetap merekam sudut pandang polemis pembicara. Tanda catatan kaki [a] muncul tepat setelah frasa yang dijelaskan.
