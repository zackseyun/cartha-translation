  to: Bukankah Hizkia sendiri yang menyingkirkan bukit-bukit pengorbanan-Nya dan mezbah-mezbah-Nya, lalu berkata kepada Yehuda dan Yerusalem, ‘Di hadapan satu mezbah saja kalian harus sujud, dan di atasnya kalian harus membakar dupa[a]?’
  rationale: Revisi mengganti istilah umum 'tempat-tempat pemujaan' dengan 'bukit-bukit pengorbanan-Nya' agar unsur leksikal בָּמוֹת dan posesifnya terjaga, sambil tetap mempertahankan bahwa ini adalah ujaran polemis pembicara. Revisi juga menormalkan tanda baca kutipan tanpa mengubah makna.
