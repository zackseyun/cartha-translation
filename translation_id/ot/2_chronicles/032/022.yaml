  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: id
  text: Demikianlah Yahweh menyelamatkan Hizkia dan penduduk Yerusalem dari tangan Sanherib, raja Asyur, dan dari tangan semua pihak lainnya.[a] Ia membimbing mereka di segala penjuru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan dari tangan semua”; objek dari “semua” tidak dinyatakan dalam bahasa Ibrani, kemungkinan menunjuk kepada semua pihak atau kuasa lain yang memusuhi mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia menuntun mereka berkeliling.” Ungkapan Ibrani ini juga dapat dipahami lebih luas sebagai pemeliharaan atau pemberian ketenteraman dari segala penjuru.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: menyelamatkan
  rationale: Kata kerja ישׁע menyatakan tindakan menyelamatkan atau melepaskan dari bahaya. “Menyelamatkan” alami dalam bahasa Indonesia dan tetap mempertahankan bobot tindakan ilahi tanpa mempersempitnya menjadi kemenangan militer saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: penduduk Yerusalem
  rationale: Ungkapan partisipial ini secara harfiah menunjuk kepada orang-orang yang tinggal di Yerusalem. “Penduduk Yerusalem” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Metafora Ibrani tentang pelepasan dari “tangan” seseorang menyatakan pembebasan dari kuasa atau kendalinya. Citra sumber tetap dapat dipahami dalam bahasa Indonesia.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Sanherib, raja Asyur
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia dan mempertahankan gelar aposisionalnya.
- source_word: וּמִיַּד כֹּל
  choice: dan dari tangan semua pihak lainnya
  rationale: כֹּל, “semua”, tidak menyebutkan nomina yang diterangkannya. “Semua pihak lainnya” membuat elipsis itu cukup jelas dalam bahasa Indonesia tanpa menentukan secara dogmatis bahwa yang dimaksud hanya musuh; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיְנַהֲלֵם
  choice: Ia membimbing mereka
  rationale: נהל pada dasarnya berarti menuntun atau membimbing. Pilihan ini mempertahankan makna leksikal dan tidak langsung mengubahnya menjadi “memberi ketenteraman” atau “melindungi”.
- source_word: מִסָּבִיב
  choice: di segala penjuru
  rationale: Adverbia ini menyatakan cakupan di sekeliling atau pada setiap sisi. “Di segala penjuru” terdengar alami sekaligus mempertahankan keluasan ungkapan sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Makna וַיְנַהֲלֵם מִסָּבִיב
  choice: Ia membimbing mereka di segala penjuru
  alternative: Ia menuntun mereka berkeliling; atau, Ia memberi mereka ketenteraman/perlindungan dari segala penjuru
  rationale: Makna dasar נהל adalah menuntun atau membimbing, tetapi keseluruhan frasa dapat dipahami sebagai pemeliharaan atau keamanan menyeluruh. Teks utama mempertahankan makna leksikal, sedangkan kemungkinan nuansa keamanan dicatat tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Citra “dari tangan” dipertahankan karena masih jelas, sedangkan elipsis dan kemungkinan makna frasa penutup dijelaskan melalui catatan kaki.
