translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga bagian agar mudah dipahami, tanpa menghilangkan hubungan antarklausa. Nama-nama mengikuti bentuk Indonesia yang lazim: Sanherib, Asyur, Hizkia, Yehuda, Yerusalem, dan Lakhis.'
