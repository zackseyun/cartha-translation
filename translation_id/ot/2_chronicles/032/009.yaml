  text: אַ֣חַר זֶ֗ה שָׁ֠לַח סַנְחֵרִ֨יב מֶֽלֶךְ אַשּׁ֤וּר עֲבָדָי/ו֙ יְר֣וּשָׁלַ֔יְמָ/ה וְ/הוּא֙ עַל לָכִ֔ישׁ וְ/כָל מֶמְשַׁלְתּ֖/וֹ עִמּ֑/וֹ עַל יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/עַל כָּל יְהוּדָ֛ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִַ֖ם לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: id
  text: 'Sesudah itu Sanherib, raja Asyur, mengutus hamba-hambanya ke Yerusalem—sementara ia sedang menghadapi Lakhis[a] bersama seluruh kekuasaannya[b]—untuk melawan Hizkia, raja Yehuda, dan semua orang Yehuda yang berada di Yerusalem, dengan berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sedang melawan Lakhis” atau “sedang mengepung Lakhis”. Secara harfiah, bahasa Ibrani berbunyi “di atas/melawan Lakhis”, sebuah ungkapan dalam konteks militer.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dengan seluruh pasukannya bersamanya”. Ungkapan Ibrani “seluruh kekuasaannya” dapat menunjuk pada kekuasaan atau wilayah kerajaannya, atau, dalam konteks ini, seluruh kekuatan yang berada di bawah perintahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: Sesudah itu
  rationale: Ungkapan peralihan waktu yang alami dan tetap mempertahankan urutan peristiwa.
- source_word: שָׁלַח
  choice: mengutus
  rationale: Dalam konteks seorang raja yang mengirim para bawahannya untuk menyampaikan pesan, 'mengutus' lebih tepat dan wajar daripada sekadar 'mengirim'.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: Mempertahankan arti dasar עבד sekaligus cocok untuk para pelayan atau pejabat kerajaan; 'para pejabatnya' akan lebih interpretatif.
- source_word: יְרוּשָׁלַיְמָה
  choice: ke Yerusalem
  rationale: Akhiran arah menyatakan gerak menuju Yerusalem.
- source_word: וְהוּא עַל לָכִישׁ
  choice: Saat itu Sanherib sedang menghadapi Lakhis
  rationale: עַל dalam konteks militer menunjukkan posisi bermusuhan terhadap kota itu. 'Menghadapi' mempertahankan nuansa tersebut tanpa memastikan bahwa pengepungan sedang berlangsung.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: dengan seluruh kekuasaan kerajaannya menyertainya
  rationale: מֶמְשָׁלָה terutama menunjuk pada kekuasaan, pemerintahan, atau wilayah kekuasaan. Rumusan ini mempertahankan istilah tersebut sambil membiarkan konteks militer menyiratkan sumber daya atau pasukan di bawah kuasanya.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: untuk menentang Hizkia ... dan semua orang Yehuda
  rationale: Pengulangan עַל dalam konteks permusuhan menunjukkan bahwa utusan itu diarahkan melawan Hizkia dan orang Yehuda, bukan sekadar dikirim kepada mereka secara netral.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: yang berada di Yerusalem
  rationale: Menjelaskan bahwa yang dimaksud ialah orang-orang Yehuda yang saat itu berada di Yerusalem.
- source_word: לֵאמֹר
  choice: 'Pesannya demikian:'
  rationale: Secara alami memperkenalkan perkataan langsung pada ayat berikutnya dan memperjelas bahwa para utusan membawa pesan Sanherib.
