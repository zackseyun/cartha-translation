  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: id
  text: Ia juga menulis surat-surat untuk menghina Yahweh[a], Allah Israel, dan mencela Dia dengan berkata, “Seperti ilah-ilah bangsa-bangsa di negeri-negeri itu tidak menyelamatkan bangsa mereka dari tanganku, demikian pula Allah Hizkia tidak akan menyelamatkan umat-Nya dari tanganku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencela” atau “menantang”. Kata kerja Ibrani ini mengandung arti mencaci atau menista.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: Ia juga menulis surat-surat
  rationale: סְפָרִים dalam konteks kisah ini menunjuk pada surat-surat tertulis; וּ melanjutkan tindakan sebelumnya dan secara alami dinyatakan dengan “juga”.
- source_word: לְחָרֵף
  choice: untuk menghina
  rationale: חרף menyatakan tindakan mencela, menista, atau menghujat dengan kata-kata. “Menghina” alami dalam bahasa Indonesia dan mempertahankan permusuhan yang diarahkan kepada Yahweh.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini secara langsung mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: וְלֵאמֹר עָלָיו
  choice: dan berbicara menentang Dia
  rationale: Dalam konteks ujaran bermusuhan, עַל menyampaikan arah pertentangan; terjemahan ini lebih alami daripada bentuk harfiah “berkata tentang Dia”.
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: Seperti ilah-ilah bangsa-bangsa di berbagai negeri
  rationale: כֵּ memperkenalkan perbandingan. “Di berbagai negeri” menyampaikan bentuk jamak הָאֲרָצוֹת secara wajar tanpa ungkapan Indonesia yang kaku.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: tidak menyelamatkan bangsa mereka
  rationale: Hifil נצל berarti melepaskan atau menyelamatkan dari ancaman. Dalam klausa pertama, עַמָּם menunjuk pada kelompok bangsa yang terkait dengan ilah-ilah tersebut.
- source_word: מִיָּדִי
  choice: dari tanganku
  rationale: Metafora Ibrani tentang tangan sebagai kuasa atau kendali dipertahankan dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: כֵּן לֹא יַצִּיל
  choice: demikian pula ... tidak akan menyelamatkan
  rationale: כֵּן menandai akibat sejajar dalam perbandingan. Pengulangan “menyelamatkan” mempertahankan paralelisme retoris teks.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: Allah Hizkia
  rationale: Bentuk konstruksi dipertahankan untuk mencerminkan cara pengejek menyebut Yahweh dalam kaitan dengan Hizkia.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Kata ini menunjuk pada umat milik Allah Hizkia. “Umat” lebih tepat daripada “bangsa” ketika hubungan kepunyaan dengan Allah menjadi fokus.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan membedakannya dari gelar אֲדֹנָי.
- issue: Sebutan אֱלֹהֵי יְחִזְקִיָּהוּ dalam ucapan pengejek
  choice: Allah Hizkia
  alternative: Allahnya Hizkia
  rationale: “Allah Hizkia” mempertahankan konstruksi sumber dan nada ucapan Sanherib tanpa menyiratkan bahwa narator menyetujui penyamaan Yahweh dengan ilah-ilah bangsa lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perbandingan dan metafora “tangan” dipertahankan, sedangkan frasa jamak tentang negeri-negeri dibuat alami bagi pembaca umum. Huruf kapital pada “Dia” dan “umat-Nya” mengikuti rujukan kepada Allah.
