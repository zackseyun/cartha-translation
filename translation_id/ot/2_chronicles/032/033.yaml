  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: id
  text: Hizkia kemudian tidur bersama nenek moyangnya, dan mereka menguburkan dia di bagian atas makam-makam anak-anak Daud.[a] Seluruh Yehuda dan penduduk Yerusalem memberi penghormatan kepadanya pada saat kematiannya. Lalu Manasye, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Daud”; di sini “anak-anak Daud” menunjuk pada garis keturunan kerajaan Daud.
    reason: Menjelaskan cakupan dinastis ungkapan Ibrani tanpa menggantikan bentuk harfiahnya dalam teks utama.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: tidur bersama nenek moyangnya
  rationale: Mempertahankan ungkapan halus baku dalam berita kematian raja-raja Ibrani, sementara konteks penguburan menjelaskan bahwa yang dimaksud ialah kematian. 'Nenek moyang' lebih alami dan tidak rancu dalam bahasa Indonesia modern daripada 'bapa-bapanya'.
- source_word: וַיִּקְבְּרֻהוּ
  choice: mereka menguburkan dia
  rationale: Mempertahankan bentuk aktif jamak dengan subjek tak tentu sebagaimana teks Ibrani, bukan mengubahnya menjadi pasif.
- source_word: בְּמַעֲלֵה
  choice: di bagian atas
  rationale: מַעֲלֵה dapat menunjuk pada tanjakan atau tempat yang lebih tinggi. Pilihan ini menyampaikan arti topografis yang paling mungkin tanpa memastikan rekonstruksi lokasi yang tidak dinyatakan teks.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: kompleks makam anak-anak Daud
  rationale: Bentuk jamak 'makam-makam' disampaikan secara alami sebagai 'kompleks makam', sedangkan ungkapan harfiah 'anak-anak Daud' dipertahankan dan cakupan dinastinya dijelaskan dalam catatan kaki.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: memberi penghormatan kepadanya
  rationale: Padanan Indonesia yang wajar bagi ungkapan Ibrani 'melakukan kehormatan baginya', dengan nuansa penghormatan publik tetap terpelihara.
- source_word: בְּמוֹתוֹ
  choice: pada saat kematiannya
  rationale: Menyampaikan hubungan waktu secara ringkas tanpa menentukan bentuk khusus upacara penghormatan.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: Seluruh Yehuda dan penduduk Yerusalem
  rationale: Padanan alami dan formal yang mempertahankan luasnya kelompok yang memberi penghormatan.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: menjadi raja menggantikan dia
  rationale: Ungkapan suksesi kerajaan ini lebih alami dalam bahasa Indonesia modern daripada bentuk harfiah 'memerintah di tempatnya', sambil mempertahankan arti bahwa Manasye menjadi penerusnya.
theological_decisions:
- issue: Ungkapan halus tentang kematian dalam rumusan kerajaan
  choice: Mempertahankan ungkapan 'tidur bersama nenek moyangnya'.
  alternative: mati; meninggal
  rationale: Ungkapan ini merupakan rumusan berita kematian yang khas dalam narasi kerajaan dan menjaga kesinambungan sastra-teologis dengan bagian-bagian lain, tanpa mengubahnya menjadi pernyataan langsung.
- issue: Cakupan ungkapan 'anak-anak Daud'
  choice: Mempertahankan 'anak-anak Daud' dalam teks utama dengan penjelasan dinastis dalam catatan kaki.
  alternative: keturunan Daud
  rationale: Terjemahan utama mencerminkan bentuk Ibrani, sedangkan catatan kaki memberi tahu pembaca bahwa dalam konteks ini ungkapan tersebut dapat menunjuk pada garis keturunan kerajaan Daud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, tetapi ungkapan kematian kerajaan dan rujukan harfiah kepada anak-anak Daud dipertahankan. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
