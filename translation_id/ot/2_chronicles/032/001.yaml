  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: id
  text: Sesudah peristiwa-peristiwa ini dan kesetiaan ini[a], Sanherib, raja Asyur, datang dan memasuki Yehuda. Ia berkemah melawan kota-kota berbenteng itu dan bermaksud membobol kota-kota itu demi kepentingannya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan kebenaran ini” atau “dan perbuatan-perbuatan setia ini”. Kata Ibrani אֱמֶת dapat berarti “kebenaran” atau “kesetiaan”; di sini kemungkinan besar kata itu mengacu pada kesetiaan Hizkia yang terlihat dalam peristiwa-peristiwa sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “bermaksud membelah kota-kota itu bagi dirinya”. Ungkapan Ibrani ini menyatakan niat Sanherib untuk menerobos pertahanan kota-kota itu dan merebutnya bagi dirinya sendiri.
    reason: idiom_explanation
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: Sesudah semua peristiwa
  rationale: דְּבָרִים dalam narasi dapat menunjuk pada hal-hal atau peristiwa-peristiwa yang baru diceritakan. “Semua peristiwa” alami dalam bahasa Indonesia dan menghubungkan ayat ini dengan konteks sebelumnya.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: dan kesetiaan ini
  rationale: אֱמֶת dapat berarti “kebenaran” maupun “kesetiaan”. Dalam konteks ini, kata tersebut kemungkinan merujuk pada kesetiaan Hizkia yang tampak dalam tindakan-tindakan sebelumnya; catatan kaki mempertahankan alternatif leksikalnya.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: Sanherib, raja Asyur
  rationale: Nama dan gelar kerajaan dialihaksarakan serta diterjemahkan sesuai bentuk Indonesia yang lazim.
- source_word: בָּא ... וַיָּבֹא בִיהוּדָה
  choice: datang dan memasuki Yehuda
  rationale: Dua verba gerak dalam teks Ibrani tetap dinyatakan, sedangkan ב dengan nama wilayah menunjukkan gerak masuk ke Yehuda.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: berkemah untuk menyerang kota-kota berbenteng
  rationale: חנה על menggambarkan pendirian perkemahan melawan suatu sasaran. Ungkapan Indonesia ini menyampaikan sikap bermusuhan tanpa mempersempitnya secara mutlak menjadi pengepungan formal.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: bermaksud membobolnya agar dapat menguasainya
  rationale: וַיֹּאמֶר di sini menyatakan maksud atau tekad, sedangkan בקע berarti membelah atau menerobos pertahanan. אֵלָיו bersifat idiomatis dan menunjukkan keuntungan atau penguasaan bagi Sanherib; terjemahan ini menyampaikan tujuan tersebut secara alami.
