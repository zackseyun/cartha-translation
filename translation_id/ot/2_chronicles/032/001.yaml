  to: Sesudah peristiwa-peristiwa ini dan kesetiaan ini[a], Sanherib, raja Asyur, datang dan memasuki Yehuda. Ia berkemah melawan kota-kota berbenteng itu dan bermaksud membobol kota-kota itu demi kepentingannya sendiri.[b]
  rationale: Revisi menghapus penambahan makna “semua,” memperbaiki representasi hubungan “berkemah melawan,” dan memperjelas objek jamak dalam klausa terakhir. Catatan kaki mempertahankan arti harfiah dan menjelaskan idiom tanpa memaksakan penafsiran di luar konteks.
