  terminology: “Sanherib,” “Asyur,” “Yehuda,” dan “kota-kota berbenteng” sudah tepat dan lazim. “Kesetiaan” merupakan pilihan kontekstual yang wajar untuk אֱמֶת, dengan alternatif leksikal tetap dicatat.
