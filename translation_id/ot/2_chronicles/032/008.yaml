base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: id
  text: Di pihak dia ada lengan manusia[a], tetapi di pihak kita ada Yahweh, Allah kita, untuk menolong kita dan berperang dalam peperangan kita.” Rakyat pun menaruh kepercayaan pada perkataan Hizkia, raja Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekuatan manusia”. Secara harfiah, “lengan daging”; ungkapan Ibrani ini menggambarkan kekuatan yang semata-mata manusiawi, berlawanan dengan pertolongan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: di pihak dia
  rationale: Menyatakan keberpihakan atau dukungan dalam konteks pertentangan militer dan berpadanan alami dengan “di pihak kita”.
- source_word: זְרוֹעַ בָּשָׂר
  choice: lengan manusia
  rationale: Mempertahankan metafora Ibrani tentang kekuatan yang semata-mata manusiawi; “manusia” menyampaikan nilai idiomatis בָּשָׂר dengan jelas dalam bahasa Indonesia.
- source_word: וְעִמָּנוּ
  choice: tetapi di pihak kita
  rationale: Kata sambung memiliki daya kontras yang kuat antara pertolongan manusia dan pertolongan ilahi.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, Allah kita
  rationale: Mempertahankan nama ilahi dan menerjemahkan ungkapan perjanjian secara langsung dan wajar.
- source_word: לְעָזְרֵנוּ
  choice: untuk menolong kita
  rationale: Infinitif berawalan לְ menyatakan tujuan di sini.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: dan berperang dalam pertempuran-pertempuran kita
  rationale: Mempertahankan hubungan etimologis verba dan nomina serta sufiks “kita” tanpa menambahkan gagasan “bagi kita” yang tidak dinyatakan secara terpisah.
- source_word: וַיִּסָּמְכוּ הָעָם עַל דִּבְרֵי
  choice: Rakyat pun menaruh kepercayaan pada perkataan
  rationale: Menyampaikan makna kiasan ‘menopangkan diri pada’ sebagai sikap mengandalkan atau mempercayai ucapan Hizkia.
- source_word: יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Hizkia, raja Yehuda
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan gelar serta wilayahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama pribadi ilahi secara langsung; transliterasi Yahweh mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Kontras antara daya manusia dan pertolongan ilahi
  choice: tetapi di pihak kita
  alternative: dan bersama kita
  rationale: Walaupun וְ secara bentuk dapat diterjemahkan “dan”, susunan paralel ayat ini menyatakan pertentangan retoris yang jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora sumber dipertahankan dalam bentuk yang dapat dipahami, sedangkan catatan kaki menjelaskan bentuk harfiah dan makna idiomatisnya.
