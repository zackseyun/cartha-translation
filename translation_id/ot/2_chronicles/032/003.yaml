  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: id
  text: Ia berunding dengan para pejabat dan para pejuangnya untuk menutup[a] aliran air dari mata-mata air yang berada di luar kota, dan mereka membantunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengenai penutupan aliran air dari mata-mata air di luar kota.”'
    reason: Frasa infinitif לִסְתּוֹם dapat dipahami sebagai tujuan perundingan (“untuk menutup”) atau sebagai pokok yang mereka rundingkan (“mengenai penutupan”).
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Ia berunding
  rationale: Bentuk Niphal dari יעץ menunjukkan tindakan meminta atau mengadakan pertimbangan bersama. “Berunding” alami dalam bahasa Indonesia dan mempertahankan sifat bersama dari tindakan itu.
- source_word: שָׂרָיו
  choice: para pejabat
  rationale: שַׂר dapat berarti pemimpin, pejabat, panglima, atau pembesar. Dalam konteks pemerintahan dan pertahanan ini, “para pejabat” cukup luas tanpa menyiratkan bahwa mereka anggota keluarga kerajaan.
- source_word: גִבֹּרָיו
  choice: para pejuangnya
  rationale: גִּבּוֹר di sini kemungkinan menunjuk kepada orang-orang kuat atau perkasa dengan peran militer. “Para pejuangnya” menyampaikan nuansa militer itu dalam bahasa Indonesia modern tanpa ungkapan yang kaku.
- source_word: לִסְתּוֹם
  choice: untuk menutup aliran
  rationale: Infinitif ini menyatakan tujuan atau isi perundingan. Karena objeknya adalah air dari mata-mata air, “menutup aliran” menyampaikan tindakan menghalangi air secara alami dalam bahasa Indonesia.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: air dari mata-mata air
  rationale: Frasa konstruksi ini secara harfiah berarti “air mata-mata air.” Bentuk “air dari mata-mata air” jelas dan idiomatis dalam bahasa Indonesia.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: yang berada di luar kota
  rationale: Klausa relatif ini menunjukkan bahwa mata-mata air tersebut terletak di luar batas kota.
- source_word: וַיַּעְזְרֻהוּ
  choice: dan mereka membantunya
  rationale: Kata kerja עזר dengan sufiks orang ketiga tunggal maskulin berarti bahwa para pejabat dan pejuang itu memberikan bantuan kepadanya.
