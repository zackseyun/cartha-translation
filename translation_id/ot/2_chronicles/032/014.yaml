base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: id
  text: Siapakah di antara semua dewa bangsa-bangsa ini yang telah para leluhurku khususkan untuk dimusnahkan dan yang sanggup melepaskan umatnya dari tanganku? Masakan Allahmu sanggup melepaskan kamu dari tanganku?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: Siapakah di antara semua dewa dari bangsa-bangsa ini
  rationale: Ungkapan partitif בְּכָל diterjemahkan secara alami dengan “di antara semua”; אֱלֹהֵי tetap diterjemahkan “dewa” tanpa tambahan editorial seperti “yang disebut dewa.”
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: yang telah dikhususkan oleh para leluhurku untuk dimusnahkan[a]
  rationale: Bentuk kausatif חרם mengandung gagasan menyerahkan atau mengkhususkan sesuatu bagi kebinasaan, bukan sekadar mengalahkan. Susunan relatif bahasa Ibrani dapat dikaitkan dengan dewa-dewa atau bangsa-bangsa; terjemahan tidak menambahkan nomina yang akan menutup kemungkinan tersebut.
- source_word: אֲבוֹתַי
  choice: para leluhurku
  rationale: Dalam ucapan seorang raja, istilah ini menunjuk kepada para pendahulu atau nenek moyangnya; “para leluhurku” alami dalam bahasa Indonesia modern.
- source_word: יָכוֹל לְהַצִּיל אֶת עַמּוֹ מִיָּדִי
  choice: sanggup melepaskan umatnya dari tanganku
  rationale: “Sanggup” menyatakan kemampuan dalam tantangan retoris; “melepaskan” mempertahankan gagasan luput dari kuasa, sedangkan “dari tanganku” menjaga metafora sumber.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: Masakan Allahmu sanggup
  rationale: כִּי mengantar kesimpulan bernada tidak percaya dari perbandingan sebelumnya. Kalimat tanya dengan “masakan” menyampaikan ejekan retoris itu secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חרם dalam ejekan kerajaan Asyur
  choice: dikhususkan ... untuk dimusnahkan
  alternative: ditumpas; dikenai larangan pemusnahan
  rationale: Pilihan ini mempertahankan unsur pengkhususan menuju kebinasaan dalam verba Ibrani tanpa mengubahnya menjadi sekadar kemenangan militer atau memasukkan penafsiran teologis tambahan.
- issue: Sebutan bagi ilah bangsa-bangsa
  choice: dewa
  alternative: dewa-dewa palsu; berhala
  rationale: Teks menampilkan ucapan penantang yang menyebut mereka אֱלֹהִים secara langsung. Terjemahan tidak menyisipkan penilaian editorial yang tidak dinyatakan dalam ayat.
- issue: Rujukan klausa relatif אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: mempertahankan susunan relatif tanpa mengulang “dewa” atau “bangsa”
  alternative: secara eksplisit mengaitkannya dengan bangsa-bangsa; secara eksplisit mengaitkannya dengan dewa-dewa
  rationale: Bentuk maskulin jamak memungkinkan hubungan gramatikal dengan אֱלֹהֵי maupun הַגּוֹיִם, meskipun konteks dapat mengarahkan pembaca kepada bangsa-bangsa. Tidak menambahkan nomina mempertahankan ruang ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ejekan kerajaan yang tegas. “Masakan” menyampaikan ketidakpercayaan retoris tanpa terdengar kuno; “dari tanganku” dipertahankan sebagai metafora kuasa yang mudah dipahami.
