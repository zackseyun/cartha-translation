revisions:
- from: Siapakah di antara semua dewa dari bangsa-bangsa ini yang telah dikhususkan oleh para leluhurku untuk dimusnahkan[a], yang sanggup melepaskan umatnya dari tanganku? Masakan Allahmu sanggup melepaskan kamu dari tanganku?
  to: Siapakah di antara semua dewa bangsa-bangsa ini yang telah para leluhurku khususkan untuk dimusnahkan dan yang sanggup melepaskan umatnya dari tanganku? Masakan Allahmu sanggup melepaskan kamu dari tanganku?
  rationale: Revisi ini mengikat klausa relatif secara eksplisit kepada “dewa,” sesuai sintaksis sumber, sambil mempertahankan makna חרם dan bentuk pertanyaan ejekan. Penanda catatan kaki ditempatkan pada ungkapan yang menerjemahkan חרם.
