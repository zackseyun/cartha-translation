base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: id
  text: Ia mengangkat para panglima militer untuk memimpin rakyat, lalu mengumpulkan mereka kepada dirinya di lapangan di pintu gerbang kota. Ia berbicara kepada hati mereka[a], katanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “berbicara kepada hati mereka” berarti berbicara dengan cara yang menguatkan atau meneguhkan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: mengangkat
  rationale: Dalam konstruksi penempatan pejabat atas suatu kelompok, verba yang secara harfiah berarti ‘memberi/menaruh’ menyatakan tindakan menetapkan seseorang dalam jabatan. ‘Mengangkat’ wajar dalam bahasa Indonesia modern.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: para panglima perang
  rationale: Frasa ini secara harfiah menunjuk para pemimpin atau pejabat perang. ‘Para panglima perang’ menyampaikan fungsi kepemimpinan militernya secara jelas dan bermartabat.
- source_word: עַל הָעָם
  choice: untuk memimpin rakyat
  rationale: Preposisi עַל dalam konteks pengangkatan menunjukkan kedudukan berwenang atas rakyat. Ungkapan ini menyampaikan relasi tersebut secara alami tanpa menyiratkan penindasan.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: mengumpulkan mereka di hadapannya
  rationale: Pilihan ini mempertahankan tindakan mengumpulkan serta unsur אֵלָיו, yaitu bahwa Hizkia sendiri menjadi pusat pertemuan. Kata ganti ‘mereka’ juga tidak memaksakan penyelesaian terhadap rujukan yang tidak sepenuhnya eksplisit.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: di lapangan dekat gerbang kota
  rationale: רְחוֹב menunjuk ruang terbuka atau lapangan yang berkaitan dengan gerbang kota. ‘Dekat’ menjaga gambaran lokasi tanpa menentukan secara berlebihan apakah lapangan itu tepat di dalam atau di luar gerbang.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: Ia berbicara kepada hati mereka
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani ‘berbicara kepada/atas hati’, sementara catatan kaki menjelaskan fungsi idiomatisnya sebagai perkataan yang menguatkan atau membesarkan hati.
- source_word: לֵאמֹר
  choice: katanya,
  rationale: Bentuk ini secara alami memperkenalkan ucapan langsung yang berlanjut pada ayat berikutnya.
