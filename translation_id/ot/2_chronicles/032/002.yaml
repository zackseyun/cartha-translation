  text: When Hezekiah saw that Sennacherib had come and that his purpose was to make war against Jerusalem,[a]
translation:
  language: id
  text: Hizkia melihat bahwa Sanherib telah datang dan berniat memerangi Yerusalem,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan wajahnya untuk perang melawan Yerusalem.” Dalam ungkapan ini, “wajah” menyatakan arah niat atau tekadnya untuk menyerang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika ... melihat
  rationale: Bentuk naratif dari ראה menyatakan bahwa Hizkia melihat atau memahami keadaan yang sedang dihadapinya. Dalam hubungan dengan klausa berikut, “Ketika ... melihat” menghasilkan pembukaan kalimat yang alami tanpa menghilangkan makna dasar verba itu.
- source_word: כִּי
  choice: bahwa
  rationale: Partikel ini memperkenalkan isi yang dilihat atau disadari Hizkia, yakni bahwa Sanherib telah datang.
- source_word: בָא
  choice: telah datang
  rationale: Bentuk qatal menyatakan kedatangan Sanherib sebagai keadaan yang sudah terjadi ketika Hizkia melihatnya.
- source_word: סַנְחֵרִיב
  choice: Sanherib
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וּפָנָיו
  choice: bermaksud
  rationale: Secara harfiah berarti “dan wajahnya”, tetapi dalam susunan ini “wajah” menyatakan arah niat atau tekad. “Bermaksud” menyampaikan fungsi idiomatisnya dengan jelas; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: לַמִּלְחָמָה
  choice: memerangi
  rationale: Kata benda “perang/pertempuran” dalam ungkapan ini menunjukkan tujuan tindakan militer. Verba “memerangi” wajar dalam bahasa Indonesia dan mempertahankan daya permusuhannya.
- source_word: עַל
  choice: memerangi
  rationale: Preposisi ini menunjukkan arah permusuhan terhadap Yerusalem; maknanya tercakup secara alami dalam verba transitif “memerangi”.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Nama tempat ini memakai bentuk yang sudah baku dan dikenal luas dalam bahasa Indonesia.
