  text: וְ/עוֹד֙ דִּבְּר֣וּ עֲבָדָ֔י/ו עַל יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/עַ֖ל יְחִזְקִיָּ֥הוּ עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: id
  text: Selain itu, para pegawainya berbicara menentang Yahweh, Allah, dan menentang Hizkia, hamba-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbicara tentang Yahweh, Allah, dan tentang Hizkia, hamba-Nya.” Preposisi Ibrani yang diterjemahkan “menentang” juga dapat dipahami secara lebih netral sebagai “tentang”, tetapi konteksnya mendukung arti yang bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: terus
  rationale: Menandai kelanjutan dan penambahan ujaran yang bermusuhan; dalam konteks naratif ini, “terus” alami dan menyampaikan bahwa mereka berbicara lebih lanjut.
- source_word: דִּבְּרוּ
  choice: berbicara
  rationale: Padanan langsung dan wajar bagi bentuk piel dari דבר dalam konstruksi dengan frasa berpreposisi.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam konteks istana, kata ini menunjuk para pelaksana atau bawahan resmi raja Asyur. “Para pegawai” mempertahankan hubungan pelayanan tanpa menyiratkan status budak secara berlebihan.
- source_word: עַל
  choice: menentang
  rationale: Bersama verba “berbicara,” preposisi ini dapat berarti “tentang” atau “menentang.” Konteks penghujatan dan permusuhan mendukung arti adversatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber dan membedakannya dari gelar.
- source_word: הָאֱלֹהִים
  choice: Allah itu
  rationale: Artikel Ibrani dipertahankan secara alami untuk menampilkan aposisi yang menegaskan identitas Yahweh sebagai Allah, tanpa mengubah nama ilahi menjadi gelar.
- source_word: וְעַל
  choice: dan menentang
  rationale: Pengulangan preposisi dipertahankan untuk menjaga kesejajaran dan daya adversatif terhadap objek kedua.
- source_word: יְחִזְקִיָּהוּ
  choice: Hizkia
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam konteks ini, kata tersebut menyatakan pelayanan Hizkia kepada Yahweh dalam hubungan kerajaan dan kesetiaan, bukan terutama status perbudakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama, bukan menggantinya dengan gelar.
- issue: Nuansa עבד bagi Hizkia
  choice: hamba-Nya
  alternative: budak-Nya
  rationale: Konteks menggambarkan Hizkia sebagai raja yang melayani Yahweh. “Hamba” mempertahankan sebutan teologis dan kerajaan tanpa menonjolkan status sosial perbudakan.
- issue: Daya preposisi עַל setelah דִּבְּרוּ
  choice: menentang
  alternative: tentang
  rationale: Secara leksikal pembacaan netral tetap mungkin, tetapi konteks pidato yang menghina Yahweh dan Hizkia mengunggulkan makna bermusuhan. Kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pegawai” dipilih untuk bawahan resmi raja, sedangkan “hamba” dipertahankan bagi hubungan Hizkia dengan Yahweh. Pengulangan “menentang” menjaga kesejajaran teks Ibrani; penulisan “-Nya” memperjelas bahwa Hizkia adalah hamba Yahweh.
