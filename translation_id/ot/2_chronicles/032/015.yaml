source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: id
  text: Jadi sekarang, jangan biarkan Hizkia memperdaya kalian dan jangan biarkan dia membujuk kalian seperti itu. Jangan percaya kepadanya, sebab tidak ada ilah dari bangsa atau kerajaan mana pun yang sanggup melepaskan bangsanya dari tanganku dan dari tangan leluhurku.[a] Apalagi Allah kalian tidak akan melepaskan kalian dari tanganku!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tangan” merupakan kiasan bagi kuasa atau kendali; “leluhurku” dapat menunjuk kepada para pendahulu kerajaan Asyur.
    reason: cultural_note
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “Apalagi ... tidak akan” menyatakan kesimpulan negatif yang diperkuat; dapat juga diterjemahkan “tentu Allah kalian tidak akan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Menandai peralihan retoris menuju desakan langsung sambil mempertahankan unsur penghubung dan penunjuk waktu.
- source_word: יַשִּׁיא
  choice: memperdaya
  rationale: Menyampaikan makna menyesatkan melalui tipu daya, serta berbeda secara leksikal dari kata kerja berikutnya.
- source_word: יַסִּית
  choice: membujuk
  rationale: Dalam konteks ini menunjuk pada usaha Hizkia memengaruhi rakyat melalui perkataannya; pilihan ini tidak menambahkan gagasan pemberontakan yang tidak harus tersirat.
- source_word: כָּזֹאת
  choice: seperti itu
  rationale: Mempertahankan daya tunjuk ungkapan Ibrani secara alami dalam bahasa Indonesia.
- source_word: תַּאֲמִינוּ לוֹ
  choice: percaya kepadanya
  rationale: Konteksnya adalah menerima atau memercayai perkataan Hizkia; bentuk ini wajar dan langsung.
- source_word: לֹא יוּכַל
  choice: tidak ada ... yang sanggup
  rationale: Menyampaikan klaim ketidakmampuan universal berdasarkan preseden kemenangan Asyur.
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: tidak ada ilah dari bangsa atau kerajaan mana pun
  rationale: Mengungkapkan cakupan universal konstruksi Ibrani dengan jelas tanpa menyamakan ilah bangsa-bangsa dengan Allah Israel.
- source_word: לְהַצִּיל
  choice: melepaskan
  rationale: Cocok untuk konteks pembebasan dari kekuasaan militer atau tangan musuh.
- source_word: עַמּוֹ
  choice: bangsanya
  rationale: Acuannya ialah kelompok bangsa yang dikaitkan dengan ilah masing-masing; 'bangsanya' lebih jelas daripada pronomina yang dapat ambigu.
- source_word: מִיָּדִי וּמִיَّד אֲבוֹתָי
  choice: dari tanganku dan dari tangan leluhurku
  rationale: Mempertahankan pengulangan metafora 'tangan' sebagai kuasa atau kendali; 'leluhur' mencakup para pendahulu dinasti Asyur.
- source_word: אַף כִּי
  choice: Terlebih lagi ... tidak akan
  rationale: 'Mengungkapkan kesimpulan negatif yang diperkuat: menurut ejekan penutur, Allah Yehuda bahkan lebih mustahil melepaskan mereka.'
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Walaupun bentuk katanya secara morfologis plural, konteks dan pemakaian Ibrani menunjuk kepada Allah Israel yang tunggal.
theological_decisions:
- issue: Acuan אֱלֹהֵיכֶם
  choice: Allah kalian, tunggal, yaitu Allah Yehuda/Israel
  alternative: ilah-ilah kalian
  rationale: Bentuk plural morfologis אֱלֹהִים lazim digunakan bagi Allah Israel yang tunggal, dan konteks menunjukkan bahwa Dialah sasaran ejekan pejabat Asyur.
- issue: Status klaim bahwa Allah tidak dapat melepaskan Yehuda
  choice: Dipertahankan sebagai ejekan langsung dari penutur Asyur
  alternative: Dilunakkan atau dikoreksi dalam teks utama
  rationale: Ayat melaporkan perkataan penghujatan tokoh, bukan mendukung kebenaran teologis klaim itu; terjemahan harus mempertahankan ketegangan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Bentuk 'kalian' dipakai karena semua kata ganti orang kedua dalam ayat ini berbentuk jamak. 'Ilah' digunakan bagi dewa bangsa-bangsa, sedangkan 'Allah' bagi Allah Israel, untuk menjaga kejelasan konteks tanpa mengubah isi ejekan penutur.
