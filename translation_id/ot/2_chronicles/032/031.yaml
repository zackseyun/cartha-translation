source:
  edition: WLC
  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: id
  text: Dan demikian pula, mengenai para utusan dari para pemimpin Babel yang dikirim kepadanya untuk menyelidiki tanda[a] yang telah terjadi di negeri itu, Allah meninggalkannya untuk mengujinya, untuk mengetahui segala sesuatu yang ada dalam hatinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keajaiban” atau “pertanda”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “untuk mengetahui segala sesuatu yang ada dalam hatinya” dipertahankan sebagaimana tertulis sehingga ketegangan dalam kisah ini tetap terjaga. Ada yang memahaminya sebagai “untuk menyingkapkan” atau “untuk memperlihatkan” segala sesuatu yang ada dalam hatinya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Demikian pula
  rationale: Mempertahankan fungsi penghubung yang menambahkan keadaan ini kepada uraian sebelumnya, dengan ungkapan Indonesia yang wajar.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל הַמְשַׁלְּחִים עָלָיו
  choice: dalam perkara para utusan yang dikirim para pemimpin Babel kepadanya
  rationale: מְלִיצִים dalam konteks diplomatik menunjuk kepada para perantara atau utusan. Susunan ulang secara terbatas memperjelas hubungan antara para pemimpin Babel, para utusan, dan Hizkia tanpa mengubah isi peristiwa.
- source_word: לִדְרֹשׁ
  choice: untuk menyelidiki
  rationale: דרש di sini menyatakan pencarian keterangan atau pemeriksaan, bukan sekadar mengajukan pertanyaan.
- source_word: הַמּוֹפֵת
  choice: tanda
  rationale: מוֹפֵת dapat berarti tanda, keajaiban, atau pertanda. 'Tanda' mempertahankan cakupan makna yang luas, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: yang telah terjadi di negeri itu
  rationale: Terjemahan ini menyampaikan sifat peristiwa dari klausa tersebut dan memakai 'negeri itu' sebagai rujukan kontekstual kepada negeri tempat kejadian berlangsung.
- source_word: עֲזָבוֹ הָאֱלֹהִים
  choice: Allah membiarkannya
  rationale: עזב dapat berarti meninggalkan, membiarkan, atau menelantarkan. Dalam konteks pengujian, 'membiarkannya' alami dalam bahasa Indonesia dan tidak memperkuat makna menjadi penolakan mutlak.
- source_word: לְנַסּוֹתוֹ
  choice: untuk mengujinya
  rationale: נסה lazim menyatakan tindakan menguji atau mencoba seseorang.
- source_word: לָדַעַת כָּל בִּלְבָבוֹ
  choice: untuk mengetahui segala yang ada di dalam hatinya
  rationale: Terjemahan langsung ini mempertahankan bahasa pengetahuan ilahi dan idiom hati sebagai pusat batin, pikiran, serta motivasi manusia.
theological_decisions:
- issue: Pengujian oleh Allah dan bahasa tentang pengetahuan-Nya
  choice: Allah membiarkannya untuk mengujinya dan untuk mengetahui segala yang ada di dalam hatinya
  alternative: Allah membiarkannya untuk menguji dan menyingkapkan segala yang ada di dalam hatinya
  rationale: Teks Ibrani secara eksplisit memakai לָדַעַת, 'untuk mengetahui'. Terjemahan utama mempertahankan ketegangan teologis itu dan tidak diam-diam menggantinya dengan tafsiran 'menyingkapkan' atau 'membuat diketahui'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. Struktur kalimat mengikuti alur Ibrani sedekat mungkin, tetapi hubungan antarpelaku diperjelas agar wajar dalam bahasa Indonesia.
