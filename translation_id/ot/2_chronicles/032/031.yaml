revisions:
- from: Demikian pula, dalam perkara para utusan yang dikirim para pemimpin Babel kepadanya untuk menyelidiki tanda[a] yang telah terjadi di negeri itu, Allah membiarkannya untuk mengujinya dan untuk mengetahui segala yang ada di dalam hatinya.[b]
  to: Dan demikian pula, mengenai para utusan dari para pemimpin Babel yang dikirim kepadanya untuk menyelidiki tanda[a] yang telah terjadi di negeri itu, Allah meninggalkannya untuk mengujinya, untuk mengetahui segala sesuatu yang ada dalam hatinya.[b]
  rationale: Revisi mengganti “membiarkannya” dengan “meninggalkannya” agar lebih langsung mencerminkan עֲזָבוֹ, memulihkan konjungsi “Dan,” dan meluweskan frasa pembuka. Bentuk pasif “yang dikirim” dipertahankan sesuai pembacaan idiomatis yang juga dicatat dalam jejak audit Inggris. Catatan kaki disesuaikan dengan teks utama tanpa mengubah fungsi atau acuannya.
  reviewer_model: gpt-5.6-terra
