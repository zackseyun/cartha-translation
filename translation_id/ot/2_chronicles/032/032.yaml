source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: id
  text: Selebihnya dari riwayat Hizkia serta perbuatan-perbuatan setianya—sesungguhnya, semuanya itu tertulis dalam penglihatan Nabi Yesaya anak Amos, pada Kitab Raja-Raja Yehuda dan Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hubungan tepat antara “penglihatan Nabi Yesaya” dan “Kitab Raja-Raja Yehuda dan Israel” tidak dinyatakan secara tegas dalam bahasa Ibrani. Frasa terakhir secara harfiah berarti “pada Kitab Raja-Raja Yehuda dan Israel” dan dapat menunjuk pada hubungan bibliografis yang berbeda-beda.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Selebihnya dari riwayat
  rationale: Dalam rumus rangkuman kerajaan, דִּבְרֵי mencakup perbuatan, urusan, dan peristiwa dalam kehidupan raja. 'Riwayat' menyampaikan cakupan historiografis itu secara alami, sedangkan וְיֶתֶר menyatakan bagian selebihnya.
- source_word: יְחִזְקִיָּהוּ
  choice: Hizkia
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַחֲסָדָיו
  choice: perbuatan-perbuatan setianya
  rationale: חֶסֶד dalam bentuk jamak ini menunjuk pada tindakan yang memperlihatkan kesetiaan atau loyalitas. Pilihan ini mempertahankan nuansa etis-relasional tanpa menjadikannya istilah teknis perjanjian.
- source_word: הִנָּם
  choice: sesungguhnya, semuanya
  rationale: Partikel presentasional ini menarik perhatian kepada catatan yang disebut berikutnya. 'Sesungguhnya' mempertahankan penekanannya, sedangkan 'semuanya' merujuk kembali kepada riwayat dan perbuatan tadi.
- source_word: כְּתוּבִים
  choice: tertulis
  rationale: Padanan langsung bagi partisip pasif yang berarti 'ditulis' atau 'tercatat'.
- source_word: בַּחֲזוֹן
  choice: dalam penglihatan
  rationale: חָזוֹן pada dasarnya berarti 'penglihatan'; makna primer ini dipertahankan daripada ditafsirkan sebagai sekadar 'catatan' atau 'nubuat'.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: Nabi Yesaya anak Amos
  rationale: Susunan Indonesia yang alami dan bermartabat, dengan mempertahankan jabatan, nama, serta garis keturunannya.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: dalam Kitab Raja-Raja Yehuda dan Israel
  rationale: Dalam rumus bibliografis ini עַל menghubungkan tulisan Yesaya dengan kitab sumber yang disebutkan. 'Dalam' lebih alami daripada 'di atas', sementara 'Kitab' mempertahankan arti סֵפֶר tanpa menafsirkannya sebagai tawarikh.
theological_decisions:
- issue: Nuansa חֶסֶד ketika dikenakan pada tindakan Hizkia
  choice: perbuatan-perbuatan setianya
  alternative: perbuatan-perbuatan kasih setianya; tindakan-tindakan loyalnya; kebajikan-kebajikannya
  rationale: Ungkapan ini mempertahankan unsur kesetiaan dan loyalitas dalam חֶסֶד, tetapi tidak secara diam-diam menetapkannya sebagai istilah teknis tentang kesetiaan pada perjanjian.
- issue: Hubungan antara penglihatan Yesaya dan Kitab Raja-Raja
  choice: dalam penglihatan ... dalam Kitab
  alternative: dalam penglihatan ... yang tercantum dalam Kitab; pada Kitab
  rationale: Teks Ibrani memakai עַל, yang hubungan bibliografis tepatnya tidak sepenuhnya eksplisit. Terjemahan utama mengikuti fungsi idiomatisnya tanpa menjelaskan apakah penglihatan itu merupakan bagian, sumber, atau lampiran kitab tersebut; ambiguitas ini dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Riwayat' dipakai untuk rumus historiografis kerajaan; 'sesungguhnya' mempertahankan daya presentasional הִנָּם tanpa memakai bentuk arkais seperti 'lihatlah'. Penanda catatan kaki [a] ditempatkan setelah seluruh klausa yang dijelaskannya.
