- from: Selebihnya dari riwayat Hizkia dan perbuatan-perbuatan setianya—sesungguhnya, semuanya tertulis dalam penglihatan Nabi Yesaya anak Amos, dalam Kitab Raja-Raja Yehuda dan Israel.[a]
