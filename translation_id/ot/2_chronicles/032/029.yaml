  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: id
  text: Ia juga membangun kota-kota bagi dirinya sendiri dan memiliki ternak kambing dan domba serta sapi yang sangat banyak, sebab Allah telah memberinya harta benda[a] yang sangat banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekayaan” atau “milik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: Ia juga membangun kota-kota untuk dirinya sendiri
  rationale: Secara harfiah, frasa ini menyatakan bahwa ia ‘membuat’ kota-kota bagi dirinya. Dalam konteks kota, ‘membangun’ merupakan padanan Indonesia yang alami; ‘juga’ menyampaikan hubungan tambahan dengan ayat sebelumnya.
- source_word: וּמִקְנֵה צֹאן וּבָקָר לָרֹב
  choice: dan memiliki sangat banyak kawanan kambing domba serta kawanan sapi
  rationale: מִקְנֶה menunjuk pada ternak atau kepemilikan ternak, sedangkan צֹאן dan בָקָר membedakan ternak kecil dari sapi. ‘Memiliki’ membuat susunan nominal Ibrani alami dalam bahasa Indonesia tanpa menyiratkan secara khusus cara ternak itu diperoleh.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi kelimpahan yang baru disebutkan.
- source_word: נָתַן לוֹ אֱלֹהִים
  choice: Allah telah memberinya
  rationale: Terjemahan ini mempertahankan Allah sebagai pelaku yang menganugerahkan kekayaan kepada Hizkia; ‘telah’ sesuai dengan fungsi penjelas dari bentuk perfektif dalam konteks.
- source_word: רְכוּשׁ
  choice: harta benda
  rationale: Kata ini menunjuk pada milik atau kekayaan material. ‘Harta benda’ mempertahankan nuansa konkret dan luasnya kepemilikan.
- source_word: רַב מְאֹד
  choice: yang amat melimpah
  rationale: Gabungan kata sifat dan penguat ini menyatakan kelimpahan yang luar biasa; ungkapan tersebut terdengar alami dan tetap kuat dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku di balik kemakmuran Hizkia
  choice: Ayat ini secara langsung menyatakan bahwa Allah memberi Hizkia harta benda yang amat melimpah.
  alternative: Menggambarkan kekayaan itu hanya sebagai hasil usaha atau kebijakan Hizkia.
  rationale: Klausa כִּי נָתַן לוֹ אֱלֹהִים secara eksplisit menyebut Allah sebagai pemberi. Terjemahan mempertahankan pernyataan ini tanpa mengembangkannya menjadi ajaran umum tentang kemakmuran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kambing domba’ mewakili istilah kolektif צֹאן untuk ternak kecil tanpa membatasinya hanya pada domba, sedangkan ‘kawanan sapi’ mewakili בָקָר. Penanda catatan kaki ditempatkan langsung pada ‘harta benda’, kata yang diterangkan oleh alternatif leksikal.
