  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: id
  text: Banyak orang membawa persembahan bagi Yahweh ke Yerusalem[a], serta hadiah-hadiah berharga bagi Hizkia, raja Yehuda. Sesudah itu, ia ditinggikan di mata semua bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Yerusalem.” Preposisi Ibrani di sini dapat dipahami sebagai penanda tujuan ataupun lokasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: banyak orang
  rationale: Adjektiva ini berfungsi sebagai nomina dan menunjuk kepada sejumlah besar orang; penyebutan “orang” diperlukan agar alami dan jelas dalam bahasa Indonesia.
- source_word: מְבִיאִים
  choice: terus membawa
  rationale: Partisipel dalam konteks narasi lampau menyiratkan tindakan yang berlangsung atau berulang; “terus membawa” mengungkapkan aspek duratif itu secara alami.
- source_word: מִנְחָה
  choice: persembahan
  rationale: Kata ini dapat berarti pemberian, upeti, atau persembahan. Karena penerimanya Yahweh, “persembahan” paling sesuai tanpa mempersempit jenisnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi menandai Yahweh sebagai penerima atau pihak yang dituju oleh persembahan; nama ilahi dipertahankan sebagai “Yahweh”.
- source_word: לִירוּשָׁלִַם
  choice: ke Yerusalem
  rationale: Preposisi ל secara langsung dapat menandai tujuan gerak. Dalam konteks membawa, “ke Yerusalem” merupakan bacaan yang wajar, sambil mengakui kemungkinan nuansa lokatif dalam catatan kaki.
- source_word: מִגְדָּנוֹת
  choice: hadiah-hadiah berharga
  rationale: Nomina ini menunjuk pada benda-benda pilihan atau bernilai yang diberikan sebagai hadiah; terjemahan ini tidak membatasinya pada makanan lezat.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: bagi Hizkia, raja Yehuda
  rationale: Frasa ini menyatakan Hizkia sebagai penerima hadiah dan mengidentifikasinya melalui aposisi sebagai raja Yehuda.
- source_word: וַיִּנַּשֵּׂא
  choice: ia sangat dihormati
  rationale: Bentuk Nifal menyatakan bahwa Hizkia ditinggikan dalam kedudukan atau penghargaan. Dalam konteks penilaian bangsa-bangsa, “sangat dihormati” menyampaikan hasil sosial dari peninggian itu secara alami.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: oleh semua bangsa
  rationale: Idiom harfiah “di mata semua bangsa” menyatakan penilaian atau penghormatan publik; konstruksi pasif Indonesia dengan “oleh” mengungkapkan maksud kontekstualnya.
- source_word: מֵאַחֲרֵי כֵן
  choice: sesudah itu
  rationale: Ungkapan ini menandai waktu setelah peristiwa-peristiwa yang baru diceritakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna peninggian Hizkia dalam וַיִּנַּשֵּׂא
  choice: ia sangat dihormati
  alternative: ia ditinggikan
  rationale: Konteks “di mata semua bangsa” mendukung peninggian dalam kehormatan atau reputasi. Pilihan ini tidak menyatakan bahwa bangsa-bangsa secara teologis memuliakannya, tetapi bahwa kedudukannya menjadi sangat terhormat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, aspek berkelanjutan dipertahankan melalui “terus membawa,” dan ambiguitas tujuan/lokasi pada Yerusalem dipelihara dalam catatan kaki.
