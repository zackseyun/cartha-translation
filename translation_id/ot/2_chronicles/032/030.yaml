- from: Hizkia sendiri menutup saluran keluar bagian atas dari perairan Gihon[a], lalu mengarahkan air itu[b] ke bawah, ke sebelah barat Kota Daud. Hizkia berhasil dalam segala pekerjaannya.
  to: Hizkia sendirilah yang menutup tempat keluarnya air Gihon yang di bagian atas itu[a], lalu mengarahkan air itu[b] ke bawah, ke arah barat, menuju Kota Daud. Hizkia berhasil dalam segala pekerjaannya.
