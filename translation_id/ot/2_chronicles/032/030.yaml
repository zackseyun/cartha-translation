  text: וְ/ה֣וּא יְחִזְקִיָּ֗הוּ סָתַם֙ אֶת מוֹצָ֞א מֵימֵ֤י גִיחוֹן֙ הָֽ/עֶלְי֔וֹן וַֽ/יַּישְּׁרֵ֥/ם לְ/מַֽטָּה מַּעְרָ֖בָ/ה לְ/עִ֣יר דָּוִ֑יד וַ/יַּצְלַ֥ח יְחִזְקִיָּ֖הוּ בְּ/כָֽל מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: id
  text: Hizkia sendirilah yang menutup tempat keluarnya air Gihon yang di bagian atas itu[a], lalu mengarahkan air itu[b] ke bawah, ke arah barat, menuju Kota Daud. Hizkia berhasil dalam segala pekerjaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mata air Gihon bagian atas.” Istilah Ibrani dapat menunjuk pada tempat air keluar atau, secara lebih luas, pada mata air atau alirannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyalurkannya” atau “membuatnya mengalir lurus.” Kata kerja Ibrani menunjukkan tindakan mengarahkan air itu, dengan nuansa membuat alirannya lurus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: Hizkia sendiri
  rationale: Pronomina yang diikuti nama diri memberi penekanan pada pelaku; bentuk ini alami dalam bahasa Indonesia tanpa memaksakan konstruksi belah.
- source_word: סָתַם
  choice: menutup
  rationale: Kata kerja ini berarti menutup atau menyumbat sebuah bukaan; 'menutup' jelas dan sesuai dengan konteks pekerjaan pengairan.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: saluran keluar bagian atas dari perairan Gihon
  rationale: Terjemahan ini mempertahankan unsur bukaan tempat air keluar, frasa 'perairan Gihon', dan penanda topografis 'bagian atas', tanpa menentukan secara berlebihan jenis sarana hidroliknya.
- source_word: וַיַּישְּׁרֵם
  choice: mengarahkan air itu
  rationale: Bentuk kausatif dari akar ישר menggambarkan tindakan membuat air menempuh arah atau jalur tertentu; 'mengarahkan' alami dan tidak seinterpretatif 'menyalurkan melalui terowongan'.
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: ke bawah, ke sebelah barat Kota Daud
  rationale: Ungkapan ini menyampaikan gerak menurun serta arah barat, sementara hubungan dengan Kota Daud dipahami sebagai letak pada sisi barat kota itu.
- source_word: וַיַּצְלַח
  choice: berhasil
  rationale: Dalam konteks berbagai usaha Hizkia, kata kerja ini menyatakan keberhasilan; 'berhasil' merupakan padanan Indonesia yang alami dan tidak mempersempitnya pada kemakmuran materi.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: dalam segala pekerjaannya
  rationale: Nomina tunggal kolektif ini merangkum seluruh pekerjaan atau usaha Hizkia; 'segala pekerjaannya' idiomatis dalam bahasa Indonesia.
