base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: id
  text: Hizkia memiliki kekayaan dan kehormatan yang sangat besar, dan ia membuat tempat-tempat penyimpanan[a] untuk perak, emas, batu-batu berharga, rempah-rempah, perisai-perisai, dan segala barang berharga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang-ruang perbendaharaan.” Istilah Ibrani ini dapat menunjuk pada tempat penyimpanan secara umum ataupun ruang khusus untuk menyimpan harta kerajaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “segala benda yang diinginkan” atau “segala benda berharga.” Ungkapan Ibrani ini luas dan dapat mencakup berbagai benda bernilai atau mewah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: Hizkia memiliki
  rationale: Ungkapan kepemilikan Ibrani ויהי ל־ paling wajar diterjemahkan dengan 'memiliki' dalam bahasa Indonesia. Kelanjutan narasi dipertahankan melalui struktur kalimat secara keseluruhan tanpa memaksakan kata 'dan' di awal ayat.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: kekayaan dan kehormatan yang sangat besar
  rationale: '''Kekayaan'' menyatakan kemakmuran materi, sedangkan ''kehormatan'' mempertahankan dimensi kedudukan dan penghargaan sosial dari כבוד. Frasa ''yang sangat besar'' menyampaikan penegasan הרבה מאד atas keduanya.'
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: dan ia membuat tempat-tempat penyimpanan
  rationale: אֹצָרוֹת dapat menunjuk pada tempat penyimpanan secara umum maupun ruang perbendaharaan kerajaan. 'Tempat-tempat penyimpanan' mempertahankan keluasan makna itu, sedangkan 'membuat' mencerminkan עשה tanpa mempersempitnya menjadi tindakan membangun.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: untuk perak, emas
  rationale: Preposisi pembuka 'untuk' berlaku secara alami bagi seluruh daftar dalam bahasa Indonesia; mengulanginya pada setiap unsur akan terasa kaku tanpa menambah makna.
- source_word: וּלְאֶבֶן יְקָרָה
  choice: batu-batu berharga
  rationale: Walaupun אבן berbentuk tunggal, bentuk jamak kolektif wajar dalam bahasa Indonesia untuk persediaan batu mulia. 'Berharga' mempertahankan arti יקרה.
- source_word: וְלִבְשָׂמִים
  choice: rempah-rempah
  rationale: בְּשָׂמִים menunjuk pada bahan-bahan aromatik. 'Rempah-rempah' merupakan padanan luas dan alami dalam konteks daftar persediaan.
- source_word: וּלְמָגִנִּים
  choice: perisai-perisai
  rationale: מָגִנִּים secara khusus berarti perisai, bukan perlengkapan perang secara umum. Bentuk ulang menyatakan jamak secara jelas dalam daftar benda.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: dan segala macam barang berharga
  rationale: כְּלֵי dapat berarti perkakas, benda, atau barang, sedangkan חֶמְדָּה menyatakan sesuatu yang diinginkan atau bernilai tinggi. Padanan ini menjaga cakupan luas ungkapan tanpa membatasinya pada bejana.
