base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: id
  text: Bukankah Hizkia menyesatkan kalian[a] untuk menyerahkan kalian supaya mati karena kelaparan dan kehausan, dengan berkata, ‘Yahweh, Allah kita, akan membebaskan kita dari tangan raja Asyur’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperdaya kalian” atau “membujuk kalian agar tersesat.” Kata kerja Ibrani ini dapat berarti menyebabkan seseorang menyimpang atau membujuknya secara keliru.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan sekaligus nada menuduh.
- source_word: מַסִּית
  choice: menyesatkan
  rationale: Bentuk Hifil dari סות menyatakan tindakan menyebabkan orang menyimpang atau terbujuk secara keliru; 'menyesatkan' mempertahankan keluasan maknanya.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: dengan menyerahkan kalian untuk mati
  rationale: Menyampaikan tindakan memberikan orang kepada suatu nasib, yakni kematian, dengan ungkapan Indonesia yang jelas dan wajar.
- source_word: בְּרָעָב וּבְצָמָא
  choice: karena kelaparan dan kehausan
  rationale: Preposisi ב menyatakan sarana atau penyebab kematian; dalam konteks pengepungan, 'kelaparan' dan 'kehausan' paling alami dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Menghubungkan tuduhan menyesatkan dengan isi perkataan Hizkia yang dikutip.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan tidak menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Mempertahankan konstruksi posesif dan pengakuan komunal dalam kutipan.
- source_word: יַצִּילֵנוּ
  choice: akan melepaskan kita
  rationale: Hifil dari נצל berarti melepaskan atau menyelamatkan dari kuasa pihak lain; 'melepaskan' sesuai dengan konteks ancaman militer.
- source_word: מִכַּף
  choice: dari tangan
  rationale: Mempertahankan idiom Ibrani yang berarti keluar dari kuasa atau kendali seseorang dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Padanan Indonesia yang langsung dan alami bagi konstruksi status constructus tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama itu, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Makna tindakan penyelamatan יַצִּילֵנוּ
  choice: akan melepaskan kita
  alternative: akan menyelamatkan kita
  rationale: Konteksnya adalah pembebasan konkret dari kuasa raja Asyur. 'Melepaskan' menjaga nuansa militer-politis tanpa meniadakan makna teologis pernyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada retoris dan menuduh. Kata ganti jamak 'kalian' dipakai karena sapaan Ibrani berbentuk jamak dan konteksnya adalah pidato langsung kepada rakyat. Tanda kutip penutup ganda mencerminkan berakhirnya kutipan di dalam ujaran yang lebih luas.
