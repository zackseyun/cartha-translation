base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: id
  text: Ia menguatkan diri, lalu membangun kembali seluruh tembok yang telah jebol dan meninggikannya sampai ke menara-menara. Di sebelah luar, ia membangun tembok lain. Ia juga memperkuat Milo[a] di Kota Daud serta membuat banyak senjata[b] dan perisai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “teras” atau “timbunan tanah” untuk “Milo”; kemungkinan besar ini adalah struktur pertahanan atau penopang di Yerusalem.
    reason: lexical_alternative
  - marker: b
    text: Atau “senjata lempar”, “proyektil”, atau “tombak”. Istilah Ibraninya lebih luas daripada satu jenis senjata tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: Ia menguatkan diri
  rationale: Bentuk hitpael dari חזק memiliki daya refleksif dan menggambarkan tindakan Hizkia yang meneguhkan serta mempersiapkan dirinya; ungkapan ini mempertahankan bentuk tersebut tanpa mempersempit maknanya menjadi keberanian batin saja.
- source_word: וַיִּבֶן ... כָּל הַחוֹמָה הַפְּרוּצָה
  choice: membangun kembali seluruh tembok yang telah jebol
  rationale: Konteksnya adalah pemulihan kubu pertahanan yang rusak. 'Membangun kembali' menyatakan fungsi restoratif בנה, sedangkan 'jebol' menggambarkan adanya bagian tembok yang terbuka atau diterobos.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: meninggikannya sampai ke menara-menara
  rationale: Ibrani di sini padat dan sintaksisnya sulit. Terjemahan ini memahami tembok dari klausa sebelumnya sebagai objek tersirat dan mempertahankan hubungan dengan menara-menara tanpa merekonstruksi teks secara berlebihan.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: Di sebelah luar, ia membangun tembok lain
  rationale: לַחוּצָה menunjuk ke sisi luar. Kata kerja 'membangun' dilengkapi dari konteks agar kalimat Indonesia jelas dan alami.
- source_word: וַיְחַזֵּק אֶת הַמִּלּוֹא עִיר דָּוִיד
  choice: Ia juga memperkuat Milo di Kota Daud
  rationale: מִלּוֹא adalah istilah teknis bagi suatu tempat atau bangunan di Yerusalem yang arti tepatnya diperdebatkan. Transliterasi menghindari kepastian semu, sementara 'memperkuat' sesuai dengan konteks pertahanan.
- source_word: שֶׁלַח
  choice: senjata
  rationale: Istilah ini dapat menunjuk secara luas pada persenjataan, terutama benda yang dikirim atau dilemparkan. 'Senjata' mempertahankan keluasan maknanya tanpa menentukan satu jenis tertentu.
- source_word: לָרֹב וּמָגִנִּים
  choice: banyak senjata dan perisai
  rationale: לָרֹב menyatakan jumlah besar; susunan 'banyak ... dan ...' merupakan ungkapan Indonesia yang alami. מָגֵן diterjemahkan dengan istilah umum dan tepat, 'perisai'.
