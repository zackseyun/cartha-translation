id: 2CH.32.24
reference: 2 Chronicles 32:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: id
  text: Pada waktu itu Hizkia jatuh sakit sampai hampir mati. Ia berdoa kepada Yahweh, lalu Yahweh menjawabnya[a] dan memberinya suatu tanda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berkata kepadanya.” Dalam konteks ini, perkataan Yahweh merupakan jawaban atas doa Hizkia.'
    reason: lexical_alternative
  - marker: b
    text: Atau “keajaiban” atau “pertanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada waktu itu
  rationale: Ungkapan waktu Ibrani ini menunjuk pada masa yang sedang diceritakan. Bentuk ini alami dalam bahasa Indonesia modern tanpa mengubah acuannya.
- source_word: חָלָה
  choice: jatuh sakit
  rationale: Kata kerja ini menyatakan keadaan menjadi sakit; 'jatuh sakit' menangkap aspek peristiwa tersebut secara alami.
- source_word: עַד לָמוּת
  choice: sampai hampir mati
  rationale: Ungkapan ini menunjukkan parahnya penyakit yang mendekati kematian, bukan bahwa Hizkia benar-benar telah mati.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: Ia berdoa kepada Yahweh
  rationale: Kata kerja tersebut adalah istilah umum untuk berdoa, sedangkan nama perjanjian יהוה dipertahankan sebagai 'Yahweh'.
- source_word: וַיֹּאמֶר לוֹ
  choice: Yahweh menjawabnya
  rationale: Secara harfiah bentuk ini berarti 'berkata kepadanya', tetapi dalam urutan narasi perkataan Yahweh merupakan jawaban atas doa Hizkia. Subjek diulangi agar rujukannya jelas dalam bahasa Indonesia.
- source_word: מוֹפֵת
  choice: tanda
  rationale: Kata ini dapat berarti tanda, keajaiban, atau pertanda. Dalam konteks ini, yang dimaksud ialah tanda ajaib yang meneguhkan jawaban kepada Hizkia; 'tanda' tetap jelas sekaligus mempertahankan keluasan istilah sumber.
- source_word: נָתַן לוֹ
  choice: memberinya
  rationale: Padanan langsung dan alami untuk verba 'memberi' dengan Hizkia sebagai penerima.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Subjek dari וַיֹּאמֶר dan נָתַן
  choice: Yahweh menjawab dan memberi tanda
  alternative: Ia berkata kepadanya dan memberinya tanda
  rationale: Rangkaian kalimat paling wajar memahami Yahweh sebagai pelaku yang menanggapi doa Hizkia. Namun, nuansa harfiah verba 'berkata' dipertahankan dalam catatan kaki agar bentuk sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dipecah menjadi dua agar mudah dibaca. Nama 'Yahweh' dipakai sebagai nama diri, dan pengulangan nama itu menghindari ketidakjelasan rujukan kata ganti.
