  to: Lalu banyak orang berkumpul dan menyumbat semua mata air serta sungai kecil yang mengalir di negeri itu[a], sambil berkata, “Mengapa raja-raja Asyur[b] harus datang dan menemukan air yang melimpah?”
  rationale: Revisi mempertahankan seluruh unsur semantis Ibrani, termasuk bentuk jamak "raja-raja Asyur" dan sifat aliran air yang sedang mengalir. Perbaikan terutama menyasar ketepatan lokasi, daya retoris pertanyaan, kelancaran narasi, dan penempatan penanda catatan kaki tepat pada istilah yang dijelaskan.
