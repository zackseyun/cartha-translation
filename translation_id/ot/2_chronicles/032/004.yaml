base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: id
  text: Lalu banyak orang berkumpul dan menyumbat semua mata air serta sungai kecil yang mengalir di negeri itu[a], sambil berkata, “Mengapa raja-raja Asyur[b] harus datang dan menemukan air yang melimpah?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wadi/batang air yang mengalir di negeri itu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “raja-raja Asyur.” Bentuk jamak ini mungkin menunjuk pada kekuasaan atau dinasti kerajaan Asyur; sesuai konteks langsung, sebagian terjemahan memakai bentuk tunggal, “raja Asyur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: Maka berkumpullah banyak orang
  rationale: Bentuk Nifal menyatakan bahwa sejumlah besar orang berkumpul. Susunan ini alami dalam bahasa Indonesia dan mempertahankan tindakan kolektifnya.
- source_word: וַיִּסְתְּמוּ אֶת כָּל הַמַּעְיָנוֹת
  choice: Mereka menutup semua mata air
  rationale: Dalam konteks pertahanan, סתם berarti menyumbat atau menutup sumber air agar tidak dapat dimanfaatkan musuh. 'Menutup' jelas dan wajar bagi pembaca umum.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: aliran sungai yang mengalir
  rationale: נחל dapat menunjuk pada sungai kecil, batang air, atau wadi, sedangkan participel השוטף menggambarkannya sedang mengalir. Pilihan ini mudah dipahami tanpa mempersempitnya menjadi jenis aliran tertentu.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: melintasi wilayah itu
  rationale: Ungkapan tersebut menggambarkan jalur aliran air di dalam atau melalui daerah yang dimaksud. 'Wilayah itu' lebih kontekstual daripada 'negeri' tanpa menetapkan batas politik tertentu.
- source_word: לָמָּה יָבֹאוּ
  choice: Mengapa ... datang
  rationale: 'Pertanyaan retoris ini menyatakan alasan tindakan mereka: tidak ada gunanya membiarkan pihak Asyur datang dan memperoleh persediaan air.'
- source_word: מַלְכֵי אַשּׁוּר
  choice: raja-raja Asyur
  rationale: Bentuk jamak Ibrani dipertahankan dan tidak diselaraskan secara diam-diam menjadi bentuk tunggal berdasarkan konteks sejarah langsung.
- source_word: מַיִם רַבִּים
  choice: air yang melimpah
  rationale: Frasa ini menyatakan persediaan air dalam jumlah besar; 'air yang melimpah' alami dan mempertahankan bobot strategisnya.
