  terminology: '"Mata air," "menyumbat," "sungai kecil," "negeri," "raja-raja Asyur," dan "air yang melimpah" sesuai dengan konteks serta penggunaan bahasa Indonesia modern. Bentuk jamak מַלְכֵי tetap dipertahankan, dengan catatan kaki yang menjelaskan alternatif kontekstual tanpa mengubah teks utama.'
