base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: id
  text: Mereka berseru dengan suara keras dalam bahasa Yehuda kepada rakyat Yerusalem yang berada di atas tembok, untuk menakuti dan menggentarkan mereka, supaya mereka dapat merebut kota itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: dalam bahasa Yehuda
  rationale: Istilah ini menunjuk pada bahasa setempat dari Yehuda; ungkapan ini alami dalam bahasa Indonesia dan tidak menyamakannya begitu saja dengan sebutan bahasa Ibrani modern.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: untuk menakut-nakuti dan menggentarkan mereka
  rationale: 'Mempertahankan dua verba tujuan yang berdekatan tetapi berbeda nuansa: menimbulkan rasa takut dan membuat mereka gentar atau panik.'
- source_word: יִלְכְּדוּ אֶת־הָעִיר
  choice: mereka dapat merebut kota itu
  rationale: Verba לכד dalam konteks militer berarti menangkap atau merebut sebuah kota; 'merebut' paling alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan tujuan ganda dalam teks Ibrani dipertahankan tanpa menambahkan identitas para pembicara yang tidak disebutkan dalam ayat ini.
