  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֣וּ וְ/אַל תֵּחַ֗תּוּ מִ/פְּנֵי֙ מֶ֣לֶךְ אַשּׁ֔וּר וּ/מִ/לִּ/פְנֵ֖י כָּל הֶ/הָמ֣וֹן אֲשֶׁר עִמּ֑/וֹ כִּֽי עִמָּ֥/נוּ רַ֖ב מֵ/עִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: id
  text: Jadilah kuat dan berani! Jangan takut atau gentar menghadapi raja Asyur maupun seluruh kumpulan besar orang yang menyertainya[a], sebab yang menyertai kita lebih banyak daripada yang menyertainya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh bala tentara yang menyertainya.” Dalam konteks ini, kata Ibrani tersebut dapat menunjuk kepada kumpulan besar pasukan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab bersama kita lebih banyak daripada bersamanya.” Perbandingan yang eliptis ini diperjelas oleh ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Jadilah kuat dan berani
  rationale: Dua bentuk perintah jamak ini merupakan pasangan ungkapan yang menyerukan kekuatan dan keteguhan hati. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan kedua unsur tersebut.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: Jangan takut atau gentar
  rationale: יִרְאוּ menyatakan rasa takut, sedangkan תֵּחַתּוּ dalam konteks ancaman militer menyatakan kegentaran atau hilangnya keteguhan. 'Gentar' ringkas, wajar, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: מִפְּנֵי
  choice: menghadapi
  rationale: Dalam konstruksi dengan kata kerja takut dan gentar, ungkapan harfiah 'dari hadapan' secara idiomatis berarti berhadapan dengan atau menghadapi ancaman seseorang.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Menerjemahkan frasa konstruksi Ibrani secara langsung dan alami.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: seluruh kumpulan besar orang yang menyertainya
  rationale: הָמוֹן dapat berarti kumpulan atau kerumunan besar dan, dalam konteks militer, dapat merujuk kepada pasukan. Pilihan utama mempertahankan keluasan maknanya tanpa menutup kemungkinan militer yang dijelaskan dalam catatan kaki.
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: yang menyertai kita lebih banyak daripada yang menyertainya
  rationale: Bahasa Ibrani bersifat eliptis, secara harfiah 'bersama kita [ada] lebih banyak daripada bersamanya.' Bentuk komparatif ini dibuat wajar dalam bahasa Indonesia tanpa memasukkan penjelasan teologis eksplisit dari ayat berikutnya.
theological_decisions:
- issue: Perbandingan eliptis pada klausa terakhir
  choice: 'Perbandingan kuantitatif: ''yang menyertai kita lebih banyak daripada yang menyertainya'''
  alternative: 'Pembacaan personal tunggal: ''yang bersama kita lebih besar daripada yang bersama dia'''
  rationale: Teks Ibrani memakai רַב dalam konstruksi eliptis dan konteks langsung membandingkan kumpulan besar pihak Asyur dengan pertolongan di pihak Yehuda. Terjemahan mempertahankan perbandingan ayat ini tanpa mendahului penjelasan dalam ayat 8 atau mengimpor rumusan dari teks lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada seruan yang tegas dan bermartabat. 'Menghadapi' dipilih agar idiom ketakutan terdengar alami, sedangkan pengulangan 'yang menyertai' mempertahankan kesejajaran kedua pihak. Semua penanda catatan kaki ditempatkan pada bagian teks yang benar-benar dijelaskannya.
