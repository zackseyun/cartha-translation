  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: id
  text: Kemudian Raja Hizkia dan Nabi Yesaya anak Amoz berdoa mengenai hal itu dan berseru ke surga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke langit.” Kata Ibrani yang diterjemahkan “surga” berbentuk jamak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: berdoa
  rationale: Bentuk hitpael dari פלל lazim berarti “berdoa”. Walaupun verba pertama berbentuk tunggal, subjek gabungan dan verba jamak berikutnya menunjukkan bahwa Hizkia dan Yesaya melakukan tindakan itu bersama-sama.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: Raja Hizkia
  rationale: Nama dan gelar dipertahankan, dengan susunan gelar sebelum nama yang alami dalam bahasa Indonesia.
- source_word: וִישַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: dan Nabi Yesaya anak Amoz
  rationale: Nama, hubungan keturunan, dan gelar kenabian semuanya dipertahankan. “Amoz” digunakan agar tidak dikacaukan dengan nama nabi Amos.
- source_word: עַל זֹאת
  choice: mengenai hal itu
  rationale: Ungkapan ini menunjuk pada perkara yang menjadi pokok atau pendorong doa. “Mengenai hal itu” mempertahankan cakupan maknanya tanpa mempersempitnya menjadi hubungan sebab-akibat semata.
- source_word: וַיִּזְעֲקוּ
  choice: dan berseru
  rationale: זעק menyatakan seruan mendesak, khususnya dalam kesesakan atau permohonan; “berseru” alami dan cukup kuat dalam konteks doa.
- source_word: הַשָּׁמָיִם
  choice: ke surga
  rationale: Dalam konteks doa, kata ini menunjuk ke ranah surgawi sebagai arah seruan. “Ke surga” lebih alami daripada bentuk jamak harfiah dalam bahasa Indonesia, sementara bentuk dan kemungkinan leksikal Ibraninya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna הַשָּׁמָיִם dalam konteks doa
  choice: ke surga
  alternative: ke langit; ke langit-langit
  rationale: Terjemahan ini menyampaikan arah seruan kepada ranah surgawi tanpa menjadikannya pernyataan kosmologis yang lebih terperinci. Catatan kaki mempertahankan fakta bahwa nomina Ibrani berbentuk jamak dan juga dapat diterjemahkan “langit”.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan gelar dibuat alami bagi pembaca Indonesia, sedangkan hubungan antartindakan dan ambiguitas עַל זֹאת dipertahankan.
