base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: id
  text: Namun, Hizkia tidak membalas kebaikan yang diterimanya sebagaimana sepatutnya[a], sebab hatinya sombong. Oleh karena itu, kemurkaan menimpa dirinya, Yehuda, dan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menanggapi kebaikan yang ditunjukkan kepadanya sebagaimana sepatutnya.” Ungkapan Ibrani ini secara luas berarti memberikan balasan yang patut atas kebaikan yang diterima.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: sesuai dengan kebaikan yang telah diterimanya
  rationale: גְּמוּל dapat menunjuk pada perlakuan, balasan, atau kebaikan yang diterima. Dalam konteks kesembuhan dan pertolongan yang dialami Hizkia, frasa ini menunjuk pada kebaikan yang telah diberikan kepadanya, sedangkan כִּ menyatakan kesesuaian atau kadar.
- source_word: הֵשִׁיב
  choice: tidak membalas
  rationale: Bentuk Hifil dari שׁוב berarti mengembalikan atau memberikan kembali; bersama גְּמוּל, ungkapan ini berarti memberikan tanggapan atau balasan yang sepatutnya atas kebaikan yang diterima.
- source_word: גָבַהּ לִבּוֹ
  choice: hatinya menjadi sombong
  rationale: Secara harfiah ungkapan ini menyatakan bahwa hatinya menjadi tinggi. Terjemahan ini menyampaikan idiom Ibrani tentang keangkuhan dengan bahasa Indonesia yang alami sambil mempertahankan fokus pada hati.
- source_word: קֶצֶף
  choice: kemurkaan
  rationale: קֶצֶף menyatakan amarah yang kuat dan dalam konteks ini berkaitan dengan penghukuman. 'Kemurkaan' mempertahankan bobot ungkapan tersebut tanpa menyebut pelakunya secara eksplisit.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: kemurkaan menimpa dia
  rationale: Konstruksi Ibrani menyatakan bahwa kemurkaan ada atau datang atas Hizkia. 'Menimpa dia' alami dalam bahasa Indonesia dan menunjukkan datangnya penghukuman tanpa menambahkan subjek yang tidak disebutkan.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Yehuda dan Yerusalem
  rationale: Menggunakan bentuk nama tempat yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat kegagalan Hizkia dalam menanggapi kebaikan yang diterimanya
  choice: Hizkia tidak memberikan balasan yang sepadan dengan kebaikan yang telah diterimanya, tanpa membatasinya pada tindakan tertentu seperti mengucap syukur secara lisan.
  alternative: Hizkia tidak bersyukur atas kebaikan yang ditunjukkan kepadanya.
  rationale: Bahasa Ibrani berbicara secara luas tentang tidak membalas sesuai dengan kebaikan yang diterima. Terjemahan ini mempertahankan penilaian moral teks tanpa mempersempitnya menjadi satu tindakan ibadah tertentu.
- issue: Sumber kemurkaan
  choice: 'Pelaku dibiarkan tersirat: kemurkaan menimpa Hizkia, Yehuda, dan Yerusalem.'
  alternative: Kemurkaan TUHAN menimpa mereka.
  rationale: Konteks menunjukkan bahwa kemurkaan itu berasal dari Allah, tetapi klausa Ibrani tidak menyebut TUHAN secara eksplisit. Terjemahan mempertahankan ketaktersebutan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Membalas' dipakai dalam arti memberikan balasan yang patut, bukan membalas dendam; catatan kaki menjelaskan cakupan idiomnya. Penanda catatan kaki [a] dicantumkan dalam teks utama.
