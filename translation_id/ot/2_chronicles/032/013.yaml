  to: Tidakkah kalian tahu apa yang telah aku dan nenek moyangku[a] lakukan terhadap semua bangsa di berbagai negeri? Apakah dewa-dewa bangsa-bangsa di negeri-negeri itu benar-benar sanggup menyelamatkan negeri mereka dari tanganku?
