base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: id
  text: Tidakkah kalian tahu apa yang telah aku dan nenek moyangku[a] lakukan terhadap semua bangsa di berbagai negeri? Apakah dewa-dewa bangsa-bangsa di negeri-negeri itu benar-benar sanggup menyelamatkan negeri mereka dari tanganku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: para pendahuluku. Bahasa Ibrani memakai istilah keluarga yang juga dapat menunjuk kepada garis dinasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: Tidakkah kalian tahu
  rationale: Bentuk pertanyaan retoris mengharapkan persetujuan, dan verba Ibrani berbentuk jamak; “kalian” menyatakan bahwa perkataan ini ditujukan kepada lebih dari satu orang.
- source_word: מֶה עָשִׂיתִי אֲנִי וַאֲבוֹתַי
  choice: apa yang telah aku dan nenek moyangku lakukan
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan tindakan sang pembicara bersama garis keluarganya atau para pendahulu dinastinya.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: terhadap semua bangsa di berbagai negeri
  rationale: Dalam konteks penaklukan, לְ sesudah “melakukan” paling alami dinyatakan dengan “terhadap”; bentuk jamak הָאֲרָצוֹת dipertahankan melalui “berbagai negeri.”
- source_word: הֲיָכוֹל יָכְלוּ
  choice: Apakah ... benar-benar sanggup
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan pada kemampuan; “benar-benar sanggup” menyampaikan tekanan retoris itu secara wajar.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: dewa-dewa bangsa-bangsa di negeri-negeri itu
  rationale: Rangkaian kepunyaan ini menunjuk kepada dewa yang disembah bangsa-bangsa dalam berbagai negeri, tanpa menambahkan penilaian teologis ke dalam ucapan sang pembicara.
- source_word: לְהַצִּיל אֶת אַרְצָם
  choice: melepaskan negeri mereka
  rationale: Dalam konteks ancaman militer, נצל berarti menyelamatkan atau melepaskan dari kuasa penyerang; “melepaskan” selaras dengan ungkapan lanjutan “dari tanganku.”
- source_word: מִיָדִי
  choice: dari tanganku
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan sebagai kuasa atau kendali dan tetap mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Sebutan “dewa-dewa” dalam kesombongan raja asing
  choice: Menerjemahkan אֱלֹהֵי secara langsung sebagai “dewa-dewa.”
  alternative: “dewa-dewa yang disebut demikian” atau “yang dianggap dewa”
  rationale: Ayat ini menyampaikan ejekan Sanherib yang membandingkan ilah bangsa-bangsa taklukan dengan Allah Yehuda. Terjemahan harus mempertahankan klaim sang pembicara tanpa menyisipkan sanggahan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak pada תֵדְעוּ, sedangkan “dari tanganku” mempertahankan metafora sumber yang transparan.
