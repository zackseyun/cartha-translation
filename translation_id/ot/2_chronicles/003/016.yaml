  - severity: low
    issue: “Seratus buah delima” berpotensi dibaca sebagai buah sungguhan.
    rationale: Dalam konteks pembuatan dan pemasangan pada rantai, yang dimaksud ialah elemen dekoratif berbentuk delima. Menambahkan “hiasan” meningkatkan kejelasan kontekstual.
