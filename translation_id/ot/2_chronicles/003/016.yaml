  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif Ibrani dipertahankan dalam dua kalimat agar jelas bagi pembaca umum. Istilah 'rantai-rantai hias' menandai bahwa yang dimaksud adalah dekorasi arsitektural, bukan rantai fungsional.
