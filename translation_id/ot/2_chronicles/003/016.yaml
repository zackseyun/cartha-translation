base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: id
  text: Ia membuat rantai-rantai hias[b] di ruang dalam[a] dan memasangnya pada puncak tiang-tiang itu. Ia juga membuat seratus hiasan buah delima dan memasangnya pada rantai-rantai itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di ruang suci bagian dalam”; secara tradisional, “di Ruang Mahakudus”. Istilah Ibrani ini menunjuk pada ruang terdalam Bait Allah, meskipun dalam ayat ini sebagian orang memahami frasa tersebut secara lebih luas dalam kaitannya dengan pekerjaan dekoratif.
    reason: alternative_reading
  - marker: b
    text: Atau “rangkaian rantai” atau “untaian hias” untuk dekorasi ornamental.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: rantai-rantai hias
  rationale: Kata ini menunjuk pada rangkaian ornamen yang menyerupai rantai. Penambahan 'hias' memperjelas fungsi arsitekturalnya tanpa menghilangkan gambaran konkretnya.
- source_word: בַּדְּבִיר
  choice: di ruang mahakudus
  rationale: דְּבִיר lazim menunjuk pada ruang terdalam Bait Allah. Istilah Indonesia ini dikenal luas dan alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki karena frasa tersebut dapat dipahami dalam kaitannya dengan pekerjaan dekoratif.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: puncak tiang-tiang itu
  rationale: Secara harfiah berarti 'kepala tiang-tiang'; 'puncak' menyampaikan letak bagian teratas secara alami dalam konteks arsitektur.
- source_word: רִמּוֹנִים
  choice: buah delima
  rationale: Kata ini secara langsung berarti buah delima dan di sini menunjuk pada ornamen berbentuk buah delima.
- source_word: מֵאָה
  choice: seratus
  rationale: Bilangan Ibrani diterjemahkan langsung dan sesuai dengan gaya inventaris ayat ini.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: memasangnya pada rantai-rantai itu
  rationale: Preposisi ב paling wajar dipahami sebagai penempatan atau pemasangan pada rangkaian rantai; pilihan ini tetap membuka kemungkinan bahwa ornamen tersebut menyatu dengan pekerjaan rantai.
