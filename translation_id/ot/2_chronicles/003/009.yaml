  text: Berat paku-paku itu lima puluh syikal emas. Ia melapisi ruang-ruang atas[a] dengan emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kamar-kamar atas”; istilah Ibrani ini juga dapat menunjuk secara lebih umum pada bagian-bagian atas bangunan Bait Allah.
