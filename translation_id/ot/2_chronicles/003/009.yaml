lexical_decisions:
- source_word: וּמִשְׁקָל
  choice: Berat
  rationale: מִשְׁקָל menyatakan berat atau hasil penimbangan. Hubungan dengan konteks sebelumnya tetap terbaca secara alami tanpa harus menerjemahkan ו sebagai kata penghubung tersendiri pada awal ayat.
- source_word: לְמִסְמְרוֹת
  choice: paku-paku itu
  rationale: מִסְמְרוֹת berarti paku-paku atau pasak-pasak. Dalam konteks pembangunan Bait Allah, “paku-paku” merupakan padanan yang paling wajar; ל dipahami sebagai penanda benda yang beratnya disebutkan.
- source_word: לִשְׁקָלִים חֲמִשִּׁים
  choice: lima puluh syikal
  rationale: Frasa ini menyatakan jumlah hasil penimbangan. “Syikal” mempertahankan satuan berat kuno tanpa konversi spekulatif.
- source_word: זָהָב
  choice: emas
  rationale: Pada klausa pertama, זָהָב menunjukkan emas sebagai bahan atau nilai berat yang disebutkan; susunan “lima puluh syikal emas” alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak ada dalam teks.
- source_word: וְהָעֲלִיּוֹת
  choice: ruang-ruang atas
  rationale: עֲלִיּוֹת lazim menunjuk pada kamar atau ruang di bagian atas, tetapi rujukan arsitekturalnya di sini tidak sepenuhnya pasti. Padanan ini mempertahankan pengertian spasial tanpa mempersempitnya secara berlebihan.
- source_word: חִפָּה
  choice: melapisi
  rationale: Dalam konteks bangunan dan bahan logam, חפה berarti menutupi atau melapisi suatu permukaan dengan bahan lain.
- source_word: זָהָב
  choice: dengan emas
  rationale: Sesudah חִפָּה, bentuk ini menyatakan emas sebagai bahan pelapis dengan idiom Indonesia yang jelas dan alami.
