lexical_decisions:
- source_word: וַיָּחֶל
  choice: Ia mulai
  rationale: Bentuk hifil dengan waw konsekutif menyatakan dimulainya tindakan. Konjungsi naratif tidak perlu diterjemahkan secara eksplisit agar bahasa Indonesia tetap alami.
- source_word: לִבְנוֹת
  choice: membangun
  rationale: Infinitif dari בנה, kata kerja umum untuk kegiatan membangun; terjemahan langsung dan alami.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: pada bulan kedua
  rationale: Frasa waktu yang menunjukkan bulan dimulainya pembangunan. Preposisi 'pada' wajar untuk penanggalan dalam bahasa Indonesia.
- source_word: בַּשֵּׁנִי
  choice: pada hari kedua
  rationale: Ordinal yang diulang sesudah penyebutan bulan bersifat eliptis dan lazim dipahami sebagai tanggal, yakni hari kedua. Kata 'hari' ditambahkan demi kejelasan, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: dalam tahun keempat
  rationale: Rumus penanggalan berdasarkan tahun pemerintahan; terjemahan ini mempertahankan struktur dan maknanya secara alami.
- source_word: לְמַלְכוּתוֹ
  choice: pemerintahannya
  rationale: Menunjuk pada masa kekuasaan raja sebagai patokan kronologis. 'Pemerintahan' merupakan istilah Indonesia yang jelas dan lazim dalam rumus penanggalan kerajaan.
