  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: id
  text: Ia melapisi rumah itu[a] dengan batu-batu berharga untuk memperindahnya, dan emas itu adalah emas dari Parwaim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah itu.” Teks Ibrani secara harfiah berbunyi “rumah itu,” sebutan yang lazim bagi Bait Allah dalam kitab Tawarikh.
    reason: lexical_alternative
  - marker: b
    text: Parwaim adalah nama tempat yang identifikasinya tidak pasti. Ungkapan ini juga dapat diterjemahkan “emas Parwaim.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: Ia melapisi
  rationale: Kata kerja צפה dalam konteks pembangunan menunjuk pada tindakan menutupi permukaan dengan lapisan bahan; “melapisi” alami dan tepat dalam bahasa Indonesia.
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: Teks Ibrani secara harfiah menyebut “rumah”; dalam konteks Tawarikh, sebutan ini merujuk pada rumah TUHAN, yaitu Bait Allah. Terjemahan mempertahankan citra sumber dan memberi penjelasan dalam catatan kaki.
- source_word: אֶבֶן יְקָרָה
  choice: batu-batu berharga
  rationale: Bentuk tunggal dapat dipahami secara kolektif. Bentuk jamak dalam bahasa Indonesia lebih alami untuk bahan hiasan bangunan.
- source_word: לְתִפְאָרֶת
  choice: untuk memperindahnya
  rationale: Frasa ini menyatakan tujuan penghiasan atau kemegahan. “Untuk memperindahnya” menyampaikan fungsi dekoratif secara alami tanpa menambahkan nuansa teologis yang tidak diwajibkan konteks.
- source_word: וְהַזָּהָב
  choice: dan emas yang digunakannya
  rationale: Klausa beralih untuk menjelaskan jenis emas yang dipakai. Tambahan implisit “yang digunakannya” membuat hubungan antarklausa jelas dalam bahasa Indonesia tanpa mengubah makna.
- source_word: זְהַב פַּרְוָיִם
  choice: emas dari Parwaim
  rationale: Rangkaian konstruksi ini paling wajar menyatakan asal atau kaitan. Karena Parwaim tampaknya nama tempat, “dari Parwaim” jelas sekaligus tetap mengakui ketidakpastian identifikasinya.
theological_decisions:
- issue: Makna הַבַּיִת dalam konteks pembangunan rumah TUHAN
  choice: rumah itu
  alternative: Bait Allah itu
  rationale: Mempertahankan istilah konkret teks Ibrani dan hubungan sastrawi dengan konteks, sambil menjelaskan referennya dalam catatan kaki agar pembaca tidak salah memahami sebagai rumah biasa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “Ia” merujuk kepada Salomo dari konteks sebelumnya. Marker catatan kaki ditempatkan langsung dalam teks; [a] menerangkan “rumah itu” dan [b] menerangkan “Parwaim.”
