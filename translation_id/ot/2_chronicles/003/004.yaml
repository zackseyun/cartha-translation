base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: id
  text: Serambi yang berada di depan Bait itu panjangnya dua puluh hasta, sesuai dengan lebar Bait itu, dan tingginya seratus dua puluh hasta.[a] Ia melapisi bagian dalam serambi itu dengan emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menyatakan bahwa tinggi serambi itu “seratus dua puluh hasta”. Uraian sejajar dalam 1 Raja-Raja 6:3 menyebutkan panjang dan lebar serambi, tetapi tidak menyebutkan tingginya. Karena itu, sebagian penafsir menduga adanya kesulitan tekstual di sini; terjemahan ini mengikuti Teks Masoret sebagaimana yang dilestarikan.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: serambi
  rationale: Kata ini menunjuk pada ruang atau bangunan masuk di depan bangunan utama. “Serambi” merupakan padanan arsitektural yang alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: yang berada di depan
  rationale: Ungkapan ini menyatakan letak serambi di hadapan atau di depan Bait tanpa menentukan arah hadapnya secara berlebihan.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: panjangnya ... sesuai dengan lebar Bait itu
  rationale: Teks Ibrani yang padat menghubungkan panjang serambi dengan lebar Bait. “Sesuai dengan” menyampaikan hubungan ukuran tersebut secara jelas tanpa menambah rincian yang tidak dinyatakan.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: dua puluh hasta
  rationale: “Hasta” adalah padanan Indonesia yang lazim untuk satuan panjang kuno אַמָּה dan mempertahankan satuan sumber tanpa konversi modern.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: dan tingginya seratus dua puluh hasta
  rationale: Terjemahan mengikuti angka dalam Teks Masoret. Kata “hasta” ditambahkan secara wajar karena tersirat dari konteks pengukuran dan memperjelas bahwa angka itu menyatakan ukuran tinggi.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: Ia melapisi bagian dalam serambi itu
  rationale: Bentuk verba berarti melapisi dengan suatu bahan. Penyebutan ulang “serambi itu” memperjelas acuan pronomina Ibrani dan menghasilkan kalimat Indonesia yang alami.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan langsung dan alami bagi frasa bahan tersebut.
- source_word: הַבַּיִת
  choice: Bait
  rationale: Dalam konteks ini kata tersebut menunjuk pada bangunan suci utama. “Bait” mempertahankan istilah arsitektural-keagamaan yang lazim tanpa menambahkan nama ilahi yang tidak muncul dalam ayat ini.
