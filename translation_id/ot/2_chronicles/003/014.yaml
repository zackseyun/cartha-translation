  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/כַרְמִ֣יל וּ/ב֑וּץ וַ/יַּ֥עַל עָלָ֖י/ו כְּרוּבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: id
  text: Ia membuat tirai[a] itu dari kain biru, ungu, merah tua[b], dan linen halus, lalu menghiasinya dengan gambar-gambar kerub[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tabir.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “merah kirmizi.”'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “membuat kerub-kerub naik di atasnya,” yaitu menghiasinya dengan gambar-gambar kerub.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: tirai
  rationale: Istilah ini menunjuk pada tirai bagian dalam yang menjadi penyekat di tempat kudus. “Tirai” alami dan jelas dalam bahasa Indonesia modern; “tabir” dipertahankan sebagai alternatif tradisional dalam catatan kaki.
- source_word: תְּכֵלֶת
  choice: kain biru
  rationale: Istilah ini menunjuk pada bahan tekstil yang dicelup biru atau biru keunguan. “Kain biru” memperjelas bahwa daftar ini menyebut bahan berwarna, bukan warna abstrak semata.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Padanan baku bagi bahan berwarna ungu yang bernilai tinggi; dalam rangkaian bahan tekstil ini, nama warnanya menyampaikan makna dengan wajar.
- source_word: כַרְמִיל
  choice: merah tua
  rationale: Kata ini menunjuk pada bahan celupan merah. “Merah tua” alami dalam bahasa Indonesia dan cukup membedakannya dari merah biasa, sementara “merah kirmizi” dicatat sebagai alternatif.
- source_word: בּוּץ
  choice: linen halus
  rationale: בּוּץ menunjuk pada linen bermutu halus, bukan linen secara umum. Padanan ini mempertahankan jenis bahan dan mutunya.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: lalu menghiasinya dengan gambar-gambar kerub
  rationale: Ungkapan harfiahnya adalah “membuat kerub-kerub naik di atasnya,” tetapi dalam konteks pengerjaan tekstil berarti menampilkan atau mengerjakan bentuk kerub pada tirai. Terjemahan ini menyampaikan fungsi dekoratif tanpa menentukan teknik seperti sulaman.
- source_word: כְּרוּבִים
  choice: kerub
  rationale: “Kerub” adalah istilah Alkitab yang lazim dalam bahasa Indonesia. Karena bentuk jamak biasanya tidak perlu ditandai pada nomina setelah “gambar-gambar”, bentuk ini tetap alami.
