  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: id
  text: Ia melapisi ruang besar itu dengan kayu sanobar[a], lalu menyalutinya dengan emas bermutu tinggi dan memasang hiasan pohon kurma serta rantai-rantai padanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu juniper” atau “kayu cemara”. Jenis pohon yang dimaksud oleh kata Ibrani בְּרוֹשׁ diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pohon-pohon kurma dan rantai-rantai”. Dalam konteks ini, keduanya tampaknya merujuk pada motif atau ornamen yang diterapkan pada ruangan.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: ruang besar itu
  rationale: Dalam konteks bangunan Bait Allah, בַּיִת dapat menunjuk pada bagian atau ruang utama bangunan. 'Ruang besar itu' lebih jelas dan alami dalam bahasa Indonesia daripada 'rumah besar', tanpa mempersempitnya menjadi istilah teknis tertentu.
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: melapisi ... dengan kayu sanobar
  rationale: חפה berarti menutupi atau melapisi; dalam urutan konstruksi ini, kayu dipasang sebagai lapisan. Identitas botani בְּרוֹשׁ tidak pasti; 'sanobar' dipakai dalam teks, dengan alternatif dijelaskan dalam catatan.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: lalu menyalutinya dengan emas bermutu tinggi
  rationale: Kata kerja חפה kembali menyatakan pelapisan, kali ini dengan emas. זָהָב טוֹב secara harfiah berarti 'emas yang baik'; 'emas bermutu tinggi' menyampaikan kualitasnya tanpa menambahkan gagasan 'murni' yang tidak dinyatakan.
- source_word: וַיַּעַל עָלָיו
  choice: memasang ... padanya
  rationale: Bentuk kausatif עלה di sini berarti menempatkan atau memasang sesuatu pada permukaan, sesuai dengan konteks ornamen bangunan.
- source_word: תִּמֹרִים
  choice: hiasan berbentuk pohon kurma
  rationale: Secara leksikal berarti pohon-pohon kurma atau bentuk pohon kurma. Konteksnya jelas dekoratif, sehingga 'hiasan berbentuk' membuat maksudnya wajar dalam bahasa Indonesia sambil mempertahankan citranya.
- source_word: שַׁרְשְׁרוֹת
  choice: rantai
  rationale: Kata ini menunjuk pada rantai atau ornamen menyerupai rantai. 'Rantai' mempertahankan ungkapan konkret teks Ibrani; fungsi dekoratifnya diterangkan dalam catatan.
