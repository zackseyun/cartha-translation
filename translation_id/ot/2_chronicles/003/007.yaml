translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dengan tanda pisah mempertahankan hubungan semua unsur bangunan dengan tindakan pelapisan emas. Istilah “bait” dan “kerub” dipilih karena sudah mapan dalam konteks Alkitab, sedangkan catatan kaki mempertahankan alternatif leksikal yang sungguh mungkin.
