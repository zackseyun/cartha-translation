base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: id
  text: Ia melapisi Bait itu[a] dengan emas—balok-baloknya[b], ambang-ambangnya[c], dinding-dindingnya, dan pintu-pintunya—lalu mengukir[d] kerub-kerub pada dinding-dinding itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah itu,” sebutan yang lazim untuk Bait Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kasau-kasaunya.” Kata Ibrani ini menunjuk pada kayu-kayu struktural.'
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani ini juga dapat merujuk pada tiang pintu atau bagian dasar bukaan pintu.
    reason: lexical_alternative
  - marker: d
    text: 'Atau: “memahat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: Ia melapisi ... dengan emas
  rationale: Kata kerja ini menunjuk pada penutupan permukaan dengan suatu bahan; “melapisi ... dengan emas” merupakan ungkapan arsitektural yang alami dan tepat dalam konteks bait.
- source_word: הַבַּיִת
  choice: bait itu
  rationale: Secara harfiah berarti “rumah itu,” tetapi dalam konteks ini menunjuk pada bangunan Bait Allah. “Bait itu” mempertahankan sebutan khas bangunan suci tanpa perlu menambahkan unsur yang tidak tersurat.
- source_word: הַקֹּרוֹת
  choice: balok-baloknya
  rationale: Nomina ini menunjuk pada kayu-kayu struktural. “Balok-balok” cukup luas dan tidak membatasi maknanya secara khusus pada kasau.
- source_word: הַסִּפִּים
  choice: ambang-ambangnya
  rationale: Istilah ini dapat menunjuk pada ambang atau bagian struktur bukaan pintu. “Ambang” mempertahankan cakupan arsitektural yang wajar tanpa menetapkannya sebagai tiang pintu.
- source_word: קִירוֹתָיו
  choice: dinding-dindingnya
  rationale: Bentuk jamak dengan akhiran orang ketiga maskulin tunggal merujuk kembali kepada bait.
- source_word: דַלְתוֹתָיו
  choice: pintu-pintunya
  rationale: Padanan umum dan jelas untuk pintu atau daun pintu dalam konteks bangunan.
- source_word: זָהָב
  choice: dengan emas
  rationale: Bahasa Ibrani menempatkan “emas” sesudah daftar unsur bangunan; dalam bahasa Indonesia, preposisi “dengan” memperjelas bahwa emas adalah bahan pelapis.
- source_word: וּפִתַּח
  choice: lalu mengukir
  rationale: Kata kerja ini berarti mengukir atau memahat hiasan. “Mengukir” alami untuk karya dekoratif pada permukaan dinding.
- source_word: כְּרוּבִים
  choice: kerub-kerub
  rationale: “Kerub” mempertahankan istilah makhluk surgawi dalam konteks Bait Allah; pengulangan menyatakan bentuk jamak secara alami dalam bahasa Indonesia.
- source_word: עַל הַקִּירוֹת
  choice: pada dinding-dinding itu
  rationale: Preposisi עַל paling wajar menunjukkan lokasi hiasan pada permukaan dinding.
