  text: כַּנְפֵי֙ הַ/כְּרוּבִ֣ים הָ/אֵ֔לֶּה פֹּֽרְשִׂ֖ים אַמּ֣וֹת עֶשְׂרִ֑ים וְ/הֵ֛ם עֹמְדִ֥ים עַל רַגְלֵי/הֶ֖ם וּ/פְנֵי/הֶ֥ם לַ/בָּֽיִת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: id
  text: Sayap kerub-kerub ini terbentang sepanjang dua puluh hasta. Mereka berdiri tegak dengan kaki mereka, dan wajah mereka menghadap ke rumah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Bait Allah.” Secara harfiah: “rumah itu,” sebutan yang lazim bagi bangunan Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּנְפֵי
  choice: Sayap
  rationale: Bentuk jamak konstruktus ini menyatakan sayap yang dimiliki kerub-kerub; hubungan kepemilikan tersampaikan secara alami melalui susunan frasa bahasa Indonesia.
- source_word: הַכְּרוּבִים הָאֵלֶּה
  choice: kerub-kerub ini
  rationale: Mempertahankan bentuk jamak dan penunjuk 'ini', serta memakai istilah Alkitabiah yang mapan dalam bahasa Indonesia.
- source_word: פֹּרְשִׂים
  choice: terbentang
  rationale: Partisip ini menggambarkan keadaan atau posisi sayap, bukan terutama tindakan yang sedang dilakukan; 'terbentang' alami dan tepat.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: dua puluh hasta
  rationale: Mempertahankan satuan ukuran kuno yang dinyatakan teks tanpa menambahkan kata dimensi yang tidak eksplisit.
- source_word: וְהֵם עֹמְדִים
  choice: Mereka berdiri
  rationale: Kata ganti eksplisit mengalihkan pokok dari sayap kepada kerub-kerub itu sendiri; kalimat baru memperjelas peralihan tersebut secara alami.
- source_word: עַל רַגְלֵיהֶם
  choice: di atas kaki mereka
  rationale: Mencerminkan ungkapan sumber dan menunjukkan bahwa sosok-sosok itu berada dalam posisi tegak.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: dan wajah mereka menghadap rumah itu
  rationale: Mempertahankan arti dasar בַּיִת, 'rumah', sekaligus menyatakan arah hadap secara idiomatis. Dalam konteks ini rumah tersebut adalah bangunan Bait Allah.
theological_decisions:
- issue: Penerjemahan בַּיִת dalam konteks pembangunan Bait Allah
  choice: rumah itu
  alternative: Bait Allah
  rationale: Bahasa Ibrani memakai kata umum 'rumah', yang dalam Kitab Tawarikh lazim menunjuk kepada bangunan Bait Allah. Teks utama mempertahankan citra sumber, sedangkan catatan kaki menjelaskan rujukannya tanpa menutup alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat lugas bagi pembaca umum sambil mempertahankan istilah 'kerub', satuan 'hasta', dan sebutan sumber 'rumah itu'. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
