source:
  edition: WLC
  text: וּ/כְנַ֨ף הַ/כְּר֤וּב הָ/אֶחָד֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֖יעַ לְ/קִ֣יר הַ/בָּ֑יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ דְּבֵקָ֕ה לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: id
  text: Sayap kerub yang satu panjangnya lima hasta[a] dan mencapai dinding Bait Suci[b]; sayap yang lain juga panjangnya lima hasta dan bersentuhan dengan sayap kerub yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu hasta kira-kira 45 sentimeter.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “rumah itu”; yang dimaksud ialah bangunan Bait Suci.
    reason: translation_note
lexical_decisions:
- source_word: כְנַף
  choice: sayap
  rationale: Dalam konteks kerub di Bait Suci, kata ini menunjuk secara konkret pada sayap, bukan pada arti kiasan seperti sisi atau ujung.
- source_word: כְּרוּב
  choice: kerub
  rationale: Bentuk Ibrani di sini tunggal dan menunjuk pada satu dari dua sosok kerub.
- source_word: אַמּוֹת חָמֵשׁ
  choice: lima hasta
  rationale: Mempertahankan satuan panjang kuno yang digunakan teks sumber dan lazim dikenal dalam terjemahan Alkitab bahasa Indonesia.
- source_word: מַגִּיעַ
  choice: mencapai
  rationale: Menyatakan bahwa sayap itu membentang sampai pada dinding, sesuai fungsi partisip Ibrani dalam gambaran arsitektural ini.
- source_word: קִיר הַבָּיִת
  choice: dinding Bait Suci
  rationale: Secara harfiah berarti 'dinding rumah itu', tetapi dalam konteks pasal ini rumah tersebut adalah bangunan Bait Suci. Pilihan ini membuat rujukannya jelas dalam bahasa Indonesia alami tanpa mengubah acuannya.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: sayap yang lain
  rationale: Menerjemahkan adjektiva feminin yang menerangkan 'sayap' secara alami dan tepat.
- source_word: דְּבֵקָה
  choice: bersentuhan dengan
  rationale: Kata ini menggambarkan kontak erat antara kedua sayap. 'Bersentuhan dengan' mempertahankan gagasan kontak tanpa menyiratkan bahwa keduanya dipasang atau direkatkan.
- source_word: הַכְּרוּב הָאַחֵר
  choice: kerub yang lain
  rationale: Mempertahankan hubungan berpasangan antara kedua kerub dan bentuk tunggal dalam teks sumber.
