  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan kesejajaran kedua sayap, sedangkan pengulangan 'panjangnya' dipakai untuk memperjelas bahwa lima hasta adalah ukuran setiap sayap.
