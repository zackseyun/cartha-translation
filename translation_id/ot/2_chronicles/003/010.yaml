base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/010.yaml
  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: id
  text: Di Ruang Mahakudus ia membuat dua kerub sebagai karya pahatan,[a] lalu kedua kerub itu dilapisi dengan emas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang dipakai di sini sangat jarang dan maknanya tidak pasti; dapat juga diterjemahkan “karya ukiran”, “karya seni”, atau “hasil pekerjaan pemahat”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “lalu mereka melapisi keduanya dengan emas”. Teks Ibrani tidak menyebutkan siapa yang dimaksud dengan “mereka”.
    reason: source_ambiguity
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Di Ruang Mahakudus
  rationale: Ungkapan bertingkat ini menunjuk pada ruang terdalam dan paling kudus dalam Bait Allah. “Ruang Mahakudus” alami dalam bahasa Indonesia dan mempertahankan daya superlatif ungkapan Ibrani.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: dua kerub
  rationale: “Kerub” adalah bentuk tunggal serapan yang lazim dalam bahasa Indonesia; jumlah dua sudah dinyatakan oleh numeralia sehingga tidak perlu pengulangan.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: sebagai karya pahatan
  rationale: צַעֲצֻעִים sangat jarang dan maknanya tidak pasti, tetapi dalam konteks ini paling mungkin menerangkan jenis hasil kriya atau patung, bukan pelakunya. “Karya pahatan” menyampaikan hasil pengerjaan itu tanpa mengubah istilah tersebut menjadi nama seorang perajin.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: lalu kedua kerub itu dilapisi dengan emas
  rationale: Dalam konteks bangunan dan perlengkapan ibadah, צפה berarti melapisi dengan logam. Bentuk pasif Indonesia menjaga kelancaran sekaligus tidak menetapkan siapa subjek jamak yang tidak disebutkan dalam teks Ibrani.
theological_decisions:
- issue: Identitas subjek jamak dalam וַיְצַפּוּ
  choice: Dibiarkan tidak ditentukan melalui bentuk pasif “dilapisi”
  alternative: “lalu mereka melapisi kedua kerub itu dengan emas”
  rationale: Teks beralih dari verba tunggal “ia membuat” ke verba jamak “mereka melapisi” tanpa menyebut siapa “mereka”. Terjemahan tidak boleh menentukannya sebagai Salomo atau para perajin secara tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ruang Mahakudus” memakai istilah arsitektur ibadah yang mudah dipahami; susunan kalimat tetap ringkas dan mengikuti alur tindakan dalam teks sumber.
