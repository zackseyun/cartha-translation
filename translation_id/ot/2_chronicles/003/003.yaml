base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: id
  text: 'Inilah dasar-dasar yang diletakkan Salomo[a] untuk membangun rumah Allah: panjangnya enam puluh hasta menurut ukuran lama,[b] dan lebarnya dua puluh hasta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani pada bagian “dasar-dasar yang diletakkan” agak sulit. Ungkapan ini juga dapat dipahami secara lebih umum sebagai dasar atau rancangan Salomo untuk membangun rumah Allah.
    reason: lexical_alternative
  - marker: b
    text: “Menurut ukuran lama” mungkin merujuk pada standar hasta yang lebih tua.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: dasar yang diletakkan
  rationale: Bentuk dari יסד agak sulit dalam konstruksi ini. Ungkapan ini mempertahankan gagasan peletakan dasar tanpa membatasi maknanya hanya pada rencana atau ukuran bangunan.
- source_word: לִבְנוֹת
  choice: untuk membangun
  rationale: Infinitif dengan ל menyatakan tujuan.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan ini mempertahankan idiom Ibrani dan tetap jelas bahwa yang dimaksud adalah bangunan suci.
- source_word: הָאֹרֶךְ
  choice: panjangnya
  rationale: Istilah arsitektural yang alami dalam bahasa Indonesia; akhiran posesif membuat acuannya kepada rumah Allah jelas.
- source_word: אַמּוֹת
  choice: hasta
  rationale: Mempertahankan satuan panjang kuno yang disebut secara eksplisit dalam teks, tanpa konversi spekulatif.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: menurut ukuran lama
  rationale: Mencerminkan ukuran terdahulu tanpa memastikan secara berlebihan apakah yang dimaksud khususnya standar hasta yang lebih tua.
- source_word: שִׁשִּׁים
  choice: enam puluh
  rationale: Bilangan kardinal untuk panjang bangunan.
- source_word: וְרֹחַב
  choice: dan lebarnya
  rationale: Bentuk posesif menghasilkan kesejajaran yang alami dengan 'panjangnya'.
- source_word: עֶשְׂרִים
  choice: dua puluh
  rationale: Bilangan kardinal untuk lebar bangunan.
