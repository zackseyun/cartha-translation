base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: id
  text: Panjang sayap kedua kerub itu seluruhnya dua puluh hasta. Sayap yang satu panjangnya lima hasta dan mencapai dinding Bait Allah,[a] sedangkan sayap yang lain panjangnya lima hasta dan mencapai sayap kerub yang lain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dinding rumah”; yang dimaksud ialah bangunan Bait Allah.'
    reason: cultural_note
  - marker: b
    text: Kata Ibrani yang diterjemahkan “mencapai” juga dapat berarti “menyentuh”; demikian juga pada pemakaian sebelumnya dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: sayap kedua kerub itu
  rationale: Bentuk jamak konstruksi merujuk pada sayap-sayap milik dua kerub yang sedang digambarkan. Ungkapan Indonesia ini alami dan jelas dalam konteks, tanpa mempertahankan konjungsi awal yang tidak diperlukan.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: panjang ... seluruhnya dua puluh hasta
  rationale: Pronomina jamak pada 'panjangnya' menunjukkan ukuran gabungan sayap-sayap tersebut; 'seluruhnya' memperjelas bahwa dua puluh hasta adalah bentangan total yang kemudian diuraikan per sayap.
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: sayap yang satu panjangnya lima hasta
  rationale: Bahasa Ibrani menyatakan ukuran secara eliptis. Penambahan 'panjangnya' menghasilkan bahasa Indonesia yang wajar tanpa menambah informasi baru.
- source_word: מַגַּעַת / מַגִּיעַ
  choice: mencapai
  rationale: Partisip dari נגע dapat menyatakan sampai kepada atau bersentuhan dengan sesuatu. 'Mencapai' mempertahankan kemungkinan kontak tanpa memaksakannya.
- source_word: לְקִיר הַבַּיִת
  choice: dinding Bait Allah
  rationale: בַּיִת secara harfiah berarti 'rumah', tetapi dalam konteks ini menunjuk pada bangunan Bait Allah. Pilihan ini lebih jelas bagi pembaca Indonesia modern.
- source_word: וְהַכָּנָף הָאַחֶרֶת
  choice: sedangkan sayap yang lain
  rationale: אַחֶרֶת berarti 'yang lain'. 'Sedangkan' menghubungkan uraian pasangan sayap secara alami.
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: sayap kerub yang lain
  rationale: Mempertahankan bentuk tunggal 'kerub' dan makna harfiah הָאַחֵר, yakni 'yang lain', bukan menafsirkannya sebagai 'yang kedua'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ukuran kuno 'hasta' dipertahankan. 'Kerub' digunakan sebagai bentuk tunggal yang lazim dalam bahasa Indonesia, dan 'Bait Allah' memperjelas acuan kontekstual dari 'rumah'.
