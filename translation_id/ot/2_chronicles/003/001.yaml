id: 2CH.3.1
reference: 2 Chronicles 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: id
  text: Kemudian Salomo mulai membangun rumah Yahweh di Yerusalem, di Gunung Moria, tempat Ia menampakkan diri kepada Daud, ayahnya,[a] di lokasi yang telah disiapkan Daud, yaitu di tempat pengirikan Ornan, orang Yebus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyebut subjeknya secara lebih eksplisit, “tempat Yahweh menampakkan diri kepada Daud, ayahnya.” Klausa Ibrani tidak mengulangi nama Yahweh.
    reason: alternative_reading
  - marker: b
    text: Tawarikh memakai bentuk nama Ornan; bandingkan bentuk Arauna dalam 2 Samuel 24:16, 18.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל
  choice: Kemudian ... mulai
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita, sedangkan verba ini dalam konstruksi dengan infinitif berarti ‘mulai’. ‘Kemudian’ menyampaikan perkembangan narasi secara alami.
- source_word: לִבְנוֹת
  choice: membangun
  rationale: Infinitif dengan ל setelah verba ‘mulai’ secara alami diterjemahkan ‘mulai membangun’ dalam bahasa Indonesia.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang bait sebagai ‘rumah’ sekaligus menyajikan nama ilahi יְהוָה sebagai Yahweh.
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: di Gunung Moria
  rationale: Frasa ini menunjuk gunung tertentu yang bernama Moria; ‘di Gunung Moria’ merupakan bentuk Indonesia yang baku dan alami.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: tempat Ia menampakkan diri kepada Daud, ayahnya
  rationale: Nifal ראה dalam konteks penampakan ilahi berarti ‘menampakkan diri’. Subjeknya tidak disebutkan secara eksplisit dalam klausa Ibrani, tetapi konteks menunjuk kepada Yahweh; ‘Ia’ mempertahankan kehematan ungkapan sumber.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: di lokasi yang telah disiapkan Daud
  rationale: Susunan Ibrani padat dan agak canggung secara harfiah. Dalam konteksnya, Daud dipahami telah menyiapkan atau menetapkan lokasi tersebut; susunan Indonesia ini menyampaikan makna itu tanpa menambahkan rincian yang tidak ada.
- source_word: בְּגֹרֶן
  choice: di tempat pengirikan
  rationale: ‘Tempat pengirikan’ adalah padanan Indonesia yang mudah dipahami bagi area terbuka tempat biji-bijian diirik.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornan, orang Yebus
  rationale: Nama Ornan mengikuti bentuk dalam Tawarikh. Sebutan etnis הַיְבוּסִי diterjemahkan secara alami sebagai ‘orang Yebus’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankan fungsi nama diri itu, bukan menggantinya dengan gelar.
- issue: Subjek נִרְאָה (‘menampakkan diri’)
  choice: Ia, dengan rujukan kontekstual kepada Yahweh
  alternative: Yahweh menampakkan diri; atau secara pasif, telah diperlihatkan kepada Daud
  rationale: Klausa Ibrani tidak mengulangi subjek secara eksplisit. Konteks penampakan ilahi paling wajar menunjuk kepada Yahweh, tetapi ‘Ia’ menjaga kehematan dan sedikit ketidaklangsungan bentuk sumber; alternatif eksplisit dicatat dalam catatan kaki.
- issue: Pelaku הֵכִין (‘menyiapkan’) dalam susunan yang padat
  choice: Daud telah menyiapkan lokasi itu
  alternative: Ia telah menyiapkannya di tempat Daud
  rationale: Urutan kata Ibrani secara harfiah padat, tetapi konteks terdekat dan kisah dalam 1 Tawarikh 21 mendukung Daud sebagai orang yang menyiapkan atau menetapkan lokasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. ‘Rumah Yahweh’ dipertahankan untuk menjaga citra konkret teks Ibrani, sedangkan ‘lokasi’ menghindari pengulangan kata ‘tempat’ yang berlebihan sebelum ‘tempat pengirikan’.
