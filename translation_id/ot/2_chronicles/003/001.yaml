  naturalness: Bahasa Indonesia baku, jelas, dan bernada naratif. ‘Rumah Yahweh’, ‘Gunung Moria’, dan ‘tempat pengirikan’ dapat dipahami secara alami dalam register terjemahan Kitab Suci. Susunan aposisional pada bagian akhir juga jelas.
