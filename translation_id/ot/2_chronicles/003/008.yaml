translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rumah' memakai huruf kapital karena dalam konteks ini menunjuk pada Rumah TUHAN, yaitu Bait Allah. Kalimat dipecah agar rincian arsitektural mudah dipahami, sedangkan istilah ukuran kuno 'hasta' dan 'talenta' dipertahankan.
