base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: id
  text: Ia membuat Ruang Mahakudus[a]. Panjangnya dua puluh hasta, sejajar dengan lebar Rumah itu, dan lebarnya dua puluh hasta. Ia melapisinya dengan emas bermutu tinggi, sebanyak enam ratus talenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ruang Yang Paling Kudus” atau “Ruang Kudus dari segala yang kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: Ruang Mahakudus
  rationale: Ungkapan konstruksi ini secara idiomatis menunjuk pada ruang kudus terdalam. 'Ruang Mahakudus' alami dalam bahasa Indonesia dan mempertahankan daya superlatif ungkapan Ibrani.
- source_word: אָרְכּוֹ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: Panjangnya dua puluh hasta, membentang selebar Rumah itu
  rationale: Dalam konteks arsitektur, frasa ini menyatakan bahwa panjang ruang tersebut mengikuti atau bersesuaian dengan lebar bangunan Bait. Susunan ini juga menempatkan ukuran panjang tepat setelah 'panjangnya' agar tidak ambigu.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: dua puluh hasta
  rationale: Hasta mempertahankan satuan ukuran kuno yang spesifik dalam teks sumber tanpa konversi spekulatif.
- source_word: וְרָחְבּוֹ אַמּוֹת עֶשְׂרִים
  choice: dan lebarnya dua puluh hasta
  rationale: Terjemahan langsung, ringkas, dan alami dari keterangan dimensi kedua.
- source_word: וַיְחַפֵּהוּ
  choice: Ia melapisinya
  rationale: Dalam konteks pembangunan Bait, verba ini menunjuk pada tindakan melapisi suatu permukaan dengan bahan seperti emas.
- source_word: זָהָב טוֹב
  choice: emas bermutu tinggi
  rationale: Kata טוֹב menyatakan kualitas emas. Pilihan ini tidak melebihkan maknanya menjadi kemurnian metalurgis mutlak.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: sebanyak enam ratus talenta
  rationale: Preposisi לְ di sini paling wajar dipahami sebagai penanda jumlah; ungkapan Indonesia ini menyampaikan total berat emas tanpa menafsirkannya sebagai nilai uang.
