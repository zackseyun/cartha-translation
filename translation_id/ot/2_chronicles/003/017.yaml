id: 2CH.3.17
reference: 2 Chronicles 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: id
  text: Ia mendirikan tiang-tiang itu di depan ruang utama Bait Allah[a], satu di sebelah kanan dan satu di sebelah kiri. Ia menamai tiang yang di sebelah kanan Yakhin, dan tiang yang di sebelah kiri Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “balai Bait Allah”. Kata Ibrani heikhal di sini menunjuk pada ruang utama bangunan Bait Allah, bukan seluruh kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Ia mendirikan
  rationale: Bentuk Hifil dari קום di sini berarti membuat tiang-tiang itu berdiri pada tempatnya; “mendirikan” alami dalam konteks bangunan.
- source_word: הָעַמּוּדִים
  choice: tiang-tiang itu
  rationale: עַמּוּדִים menunjuk pada tiang atau pilar arsitektural. “Tiang-tiang” jelas dan lazim bagi pembaca Indonesia.
- source_word: עַל פְּנֵי הַהֵיכָל
  choice: di depan ruang utama Bait Allah
  rationale: עַל־פְּנֵי menyatakan posisi “di depan”, sedangkan הֵיכָל di sini menunjuk pada ruang utama bangunan Bait Allah, bukan seluruh kompleksnya.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: satu di sebelah kanan dan satu di sebelah kiri
  rationale: Terjemahan ini mempertahankan arah relatif dalam bahasa Ibrani tanpa mengubahnya menjadi arah mata angin yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּקְרָא שֵׁם
  choice: Ia menamai
  rationale: Ungkapan Ibrani harfiahnya “memanggil nama”; “menamai” menyampaikan idiom tersebut secara alami dan ringkas dalam bahasa Indonesia.
- source_word: הַיְמִינִי
  choice: tiang yang di sebelah kanan
  rationale: Kata sifat ini berarti yang berada di sisi kanan; pengulangan “tiang” memperjelas acuannya dalam bahasa Indonesia.
- source_word: יָכִין
  choice: Yakhin
  rationale: Nama diri ini ditransliterasikan menurut pengucapan Ibrani dan ejaan Indonesia; huruf awal yod diwakili dengan “Y”, dan khaf dengan “kh”.
- source_word: הַשְּׂמָאלִי
  choice: tiang yang di sebelah kiri
  rationale: Kata sifat ini berarti yang berada di sisi kiri dan diterjemahkan sejajar dengan frasa sebelumnya.
- source_word: בֹּעַז
  choice: Boas
  rationale: Bentuk “Boas” merupakan transliterasi yang sudah lazim dalam tradisi Alkitab bahasa Indonesia untuk nama בֹּעַז.
