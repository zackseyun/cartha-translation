  naturalness: Bahasa draft umumnya baku dan jelas. “Kepala tiang yang ada di atas masing-masing tiang” agak berlebihan; “kepala tiang di atas masing-masing tiang” lebih ringkas dan alami. “Berukuran lima hasta” jelas dalam bahasa Indonesia tanpa menentukan dimensi yang tidak disebutkan.
  terminology: “Bait,” “tiang,” dan “hasta” sesuai register Alkitab bahasa Indonesia. “Kepala tiang” merupakan padanan yang mudah dipahami untuk unsur arsitektural הַצֶּפֶת dan dapat dipertahankan.
  issues:
