revisions:
- from: Di depan Bait itu ia membuat dua tiang yang panjangnya tiga puluh lima hasta[a]. Kepala tiang yang ada di atas masing-masing tiang[b] tingginya lima hasta.
  to: Di depan Bait itu ia membuat dua tiang yang panjangnya tiga puluh lima hasta[a], dan kepala tiang di atas masing-masing tiang itu berukuran lima hasta[b].
  rationale: Revisi mempertahankan “panjangnya” untuk ukuran tiga puluh lima hasta, sesuai אֹרֶךְ dan kesulitan tekstual yang perlu dibiarkan terbuka. Ukuran lima hasta dibuat netral dengan “berukuran,” bukan “tingginya,” karena sumber tidak menyebutkan dimensinya secara eksplisit. Catatan kaki diperjelas dan dipersempit agar mencerminkan tingkat kepastian sumber.
