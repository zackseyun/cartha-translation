  text: וַ/יַּ֜עַשׂ לִ/פְנֵ֤י הַ/בַּ֨יִת֙ עַמּוּדִ֣ים שְׁנַ֔יִם אַמּ֕וֹת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ אֹ֑רֶךְ וְ/הַ/צֶּ֥פֶת אֲשֶׁר עַל רֹאשׁ֖/וֹ אַמּ֥וֹת חָמֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: id
  text: Di depan Bait itu ia membuat dua tiang yang panjangnya tiga puluh lima hasta[a], dan kepala tiang di atas masing-masing tiang itu berukuran lima hasta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menyebut “panjangnya tiga puluh lima hasta.” Dalam 1 Raja-raja 7:15, tinggi setiap tiang disebut delapan belas hasta. Karena itu, ada yang memahami angka dalam Tawarikh sebagai ukuran gabungan kedua tiang, sedangkan yang lain melihat adanya masalah tekstual.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “yang ada di atas puncaknya.” Akhiran tunggal dalam bahasa Ibrani kemungkinan dipakai secara distributif untuk masing-masing tiang.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: Di depan Bait itu
  rationale: לִפְנֵי menyatakan letak di depan, sedangkan הַבַּיִת dalam konteks pembangunan ini menunjuk pada Bait Allah. “Bait” mempertahankan gambaran rumah ilahi dan lazim dalam konteks ini.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: dua tiang
  rationale: עַמּוּדִים adalah unsur arsitektural tegak; “tiang” merupakan padanan Indonesia yang alami dan mudah dipahami.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: panjangnya tiga puluh lima hasta
  rationale: אֹרֶךְ secara harfiah menyatakan panjang. Unit kuno “hasta” dipertahankan, dan kesulitan perbandingan dengan 1 Raja-raja 7:15 dijelaskan dalam catatan kaki tanpa mengubah teks sumber menjadi “tinggi”.
- source_word: הַצֶּפֶת
  choice: kepala tiang
  rationale: Dalam konteks arsitektur, istilah ini menunjuk pada bagian berhias di puncak tiang. “Kepala tiang” lebih mudah dipahami pembaca umum daripada istilah teknis “kapitel”.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: yang ada di atas masing-masing tiang
  rationale: רֹאשׁוֹ secara harfiah berarti “di kepalanya/di puncaknya.” Karena akhiran Ibrani berbentuk tunggal setelah penyebutan dua tiang, “masing-masing tiang” menyampaikan pemahaman distributif yang paling wajar, sementara bentuk harfiahnya dicatat.
- source_word: אַמּוֹת חָמֵשׁ
  choice: tingginya lima hasta
  rationale: Ukuran ini menerangkan dimensi vertikal kepala tiang; “tingginya” membuat hubungan arsitekturalnya jelas dalam bahasa Indonesia tanpa mengubah angka atau unit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “Bait” dipakai sesuai konteks bangunan suci, “tiang” dipilih daripada istilah yang lebih teknis, dan “kepala tiang” digunakan agar dapat dipahami pembaca umum. Susunan dipecah menjadi dua kalimat untuk kejernihan tanpa menghilangkan hubungan antarbagiannya.
