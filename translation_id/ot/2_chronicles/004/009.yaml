  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: id
  text: Ia membuat pelataran para imam dan pelataran besar, serta pintu-pintu untuk pelataran itu. Pintu-pintu itu dilapisinya dengan perunggu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tembaga.” Istilah Ibraninya dapat merujuk pada tembaga atau perunggu; “perunggu” sesuai dengan konteks perlengkapan Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Kata kerja עשה bermakna luas, ‘membuat/mengerjakan’. Dalam konteks pembangunan kompleks Bait Allah, ‘membuat’ alami dan tidak mempersempit maknanya menjadi teknik konstruksi tertentu.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: pelataran para imam
  rationale: חָצֵר menunjuk pada pelataran atau halaman, dan bentuk konstruksi dengan הַכֹּהֲנִים dipertahankan secara jelas sebagai ‘para imam’.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: dan pelataran besar
  rationale: Dalam konteks Bait Allah, עֲזָרָה menunjuk pada pelataran atau area tertutup. ‘Pelataran besar’ membedakannya dari pelataran para imam tanpa menambahkan rincian yang tidak terdapat dalam teks.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: serta pintu-pintu untuk pelataran itu
  rationale: דֶּלֶת lazimnya berarti ‘pintu’. Bentuk jamaknya dipertahankan, sementara ‘itu’ membuat rujukan kepada pelataran besar terdengar wajar dalam bahasa Indonesia.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: Pintu-pintu mereka
  rationale: Akhiran pronominal Ibrani berbentuk orang ketiga jamak maskulin, secara harfiah ‘mereka’. Terjemahan mempertahankan bentuk yang tidak biasa ini agar ambiguitas rujukannya tidak diselesaikan secara diam-diam.
- source_word: צִפָּה
  choice: dilapisinya
  rationale: Dalam konstruksi ini, צפה berarti melapisi suatu benda dengan logam. Bentuk ‘dilapisinya’ alami dalam bahasa Indonesia dan tetap menyatakan bahwa tokoh yang sama melakukan tindakan itu.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat mencakup tembaga maupun perunggu. ‘Perunggu’ sesuai dengan penggunaan konvensional untuk perlengkapan Bait Allah, sementara kemungkinan ‘tembaga’ dicatat dalam catatan kaki.
