translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Pelataran’ dipilih sebagai istilah arsitektural yang mudah dipahami. Susunan kalimat dipecah menjadi dua agar alami, tetapi urutan tindakan dalam teks Ibrani tetap dipertahankan. Ambiguitas akhiran jamak pada וְדַלְתוֹתֵיהֶם sengaja dipertahankan dan dijelaskan dalam catatan kaki.
