base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: id
  text: 'Bejana Laut itu berdiri di atas dua belas lembu: tiga menghadap ke utara, tiga menghadap ke barat[a], tiga menghadap ke selatan, dan tiga menghadap ke timur. Bejana Laut itu berada di atas lembu-lembu tersebut, dan bagian belakang semua lembu itu menghadap ke dalam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “tiga menghadap ke arah laut”. Dalam pemakaian penunjuk arah, “ke arah laut” berarti “ke barat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: berdiri
  rationale: Partisipel Qal dari עמד secara predikatif menggambarkan posisi Bejana Laut; bentuk verba ini alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa bejana ditopang oleh lembu-lembu.
- source_word: בָּקָר
  choice: lembu
  rationale: Kata ini menunjuk pada dua belas patung bovina penyangga. 'Lembu' merupakan istilah umum yang wajar dan tidak menentukan jenis kelamin secara berlebihan.
- source_word: פֹנִים
  choice: menghadap
  rationale: Secara harfiah berkaitan dengan 'wajah', tetapi dalam konstruksi arah ini menyatakan orientasi patung-patung tersebut.
- source_word: צָפוֹנָה
  choice: ke utara
  rationale: Akhiran penunjuk arah menyatakan orientasi ke utara; bentuk ini jelas dan alami dalam deskripsi tata ruang.
- source_word: יָמָּה
  choice: ke barat
  rationale: Secara etimologis berarti 'ke arah laut', tetapi dalam pemakaian arah Ibrani lazim menunjuk ke barat. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: נֶגְבָּה
  choice: ke selatan
  rationale: Dalam rangkaian empat penjuru ini kata tersebut menyatakan arah selatan, bukan secara khusus wilayah Negeb.
- source_word: מִזְרָחָה
  choice: ke timur
  rationale: Istilah arah baku yang dalam konteks ini paling alami diterjemahkan sebagai orientasi ke timur.
- source_word: הַיָּם
  choice: Bejana Laut
  rationale: Kata ini merupakan sebutan bagi bejana besar di Bait Allah, bukan laut geografis. Penambahan 'Bejana' memperjelas acuannya bagi pembaca Indonesia sambil mempertahankan nama 'Laut'.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: berada di atas lembu-lembu tersebut
  rationale: Ungkapan ini menyatakan letak Bejana Laut di atas kedua belas penyangga; terjemahan tersebut jelas tanpa mengulang 'berdiri di atas' secara kaku.
- source_word: אֲחֹרֵיהֶם
  choice: bagian belakang semua lembu itu
  rationale: Kata tersebut secara harfiah menunjuk bagian belakang mereka. Pilihan ini netral, jelas, dan sesuai untuk patung-patung binatang.
- source_word: בָּיְתָה
  choice: menghadap ke dalam
  rationale: Bentuk berarah dari kata yang berkaitan dengan bagian dalam menyatakan orientasi ke arah pusat atau sisi dalam susunan.
