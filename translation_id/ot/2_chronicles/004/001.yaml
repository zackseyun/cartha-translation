id: 2CH.4.1
reference: 2 Chronicles 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ מִזְבַּ֣ח נְחֹ֔שֶׁת עֶשְׂרִ֤ים אַמָּה֙ אָרְכּ֔/וֹ וְ/עֶשְׂרִ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: id
  text: Ia membuat sebuah mazbah dari perunggu[a], panjangnya dua puluh hasta, lebarnya dua puluh hasta, dan tingginya sepuluh hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tembaga"; kata Ibrani נְחֹשֶׁת dapat merujuk pada tembaga atau perunggu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan rangkaian narasi dengan tindakan lampau; bahasa Indonesia tidak perlu mempertahankan konjungsi secara eksplisit.
- source_word: מִזְבַּח
  choice: mazbah
  rationale: Istilah baku dan bermartabat dalam bahasa Indonesia untuk tempat persembahan kurban, serta membedakannya dari altar dalam pemakaian umum lainnya.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Bait Allah, 'perunggu' merupakan padanan modern yang lazim; kata Ibrani ini juga dapat merujuk pada tembaga, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: עֶשְׂרִים אַמָּה
  choice: dua puluh hasta
  rationale: Mempertahankan satuan ukuran kuno אַמָּה dengan padanan tradisional Indonesia 'hasta', tanpa konversi yang dapat memberi kesan ketepatan modern yang tidak dimiliki teks.
- source_word: אָרְכּוֹ
  choice: panjangnya
  rationale: Nomina dengan sufiks pronominal secara alami diterjemahkan sebagai ukuran benda tersebut.
- source_word: רָחְבּוֹ
  choice: lebarnya
  rationale: Dalam konteks arsitektural, 'lebar' adalah padanan Indonesia modern yang paling wajar.
- source_word: וְעֶשֶׂר אַמּוֹת
  choice: dan ... sepuluh hasta
  rationale: Menerjemahkan frasa bilangan secara langsung sambil menyesuaikan susunan kalimat Indonesia.
- source_word: קוֹמָתוֹ
  choice: tingginya
  rationale: Dalam konteks bangunan atau benda, קוֹמָה menunjuk pada tinggi, bukan perawakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur tiga ukuran dibuat paralel agar alami dan mudah dipahami, sementara satuan kuno 'hasta' dipertahankan.
