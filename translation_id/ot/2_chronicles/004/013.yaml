  text: וְ/אֶת הָֽ/רִמּוֹנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנַ֨יִם טוּרִ֤ים רִמּוֹנִים֙ לַ/שְּׂבָכָ֣ה הָ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: id
  text: dan empat ratus buah delima untuk kedua kisi-kisi[a] itu—dua baris buah delima untuk setiap kisi-kisi—untuk menutupi kedua bagian kepala tiang yang berbentuk mangkuk[b] di atas tiang-tiang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalinan-jalinan seperti jaring”. Istilah Ibrani menunjuk pada karya hias berjalin yang dipasang pada kepala tiang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kedua mangkuk kepala-kepala tiang”. Ungkapan Ibrani menggambarkan bagian kepala tiang yang membulat seperti mangkuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: buah delima
  rationale: Makna harfiahnya adalah buah delima; dalam konteks perlengkapan Bait Allah, yang dimaksud ialah hiasan berbentuk buah delima.
- source_word: שְּׂבָכוֹת
  choice: kisi-kisi
  rationale: Istilah ini menunjuk pada karya hias berjalin seperti jaring pada kepala tiang; “kisi-kisi” alami dan cukup tepat dalam bahasa Indonesia.
- source_word: שְׁנַיִם טוּרִים
  choice: dua baris
  rationale: טוּרִים menunjuk pada susunan dalam baris-baris.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: untuk setiap kisi-kisi
  rationale: Bentuk Ibrani secara harfiah berarti “untuk kisi-kisi yang satu”, tetapi berfungsi distributif terhadap kedua kisi-kisi.
- source_word: לְכַסּוֹת
  choice: untuk menutupi
  rationale: Infinitif ini menyatakan tujuan dan paling langsung diterjemahkan “untuk menutupi”.
- source_word: גֻּלּוֹת הַכֹּתָרוֹת
  choice: bagian kepala tiang yang berbentuk mangkuk
  rationale: גֻּלּוֹת memakai gambaran bentuk bulat atau seperti mangkuk, sedangkan כֹּתָרוֹת dalam konteks arsitektur berarti kepala tiang.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: di atas tiang-tiang itu
  rationale: Dalam konteks kepala tiang, ungkapan ini menunjukkan letaknya di bagian atas tiang.
theological_decisions: []
