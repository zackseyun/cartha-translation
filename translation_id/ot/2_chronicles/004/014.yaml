  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: id
  text: Ia membuat penyangga-penyangga[a] itu, dan membuat bejana-bejana pembasuhan[b] di atas penyangga-penyangga itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dudukan-dudukan”; istilah Ibrani ini menunjuk pada struktur yang menopang bejana-bejana tersebut.'
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional juga diterjemahkan “bokor-bokor pembasuhan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: penyangga-penyangga
  rationale: Istilah מְכוֹנוֹת dalam konteks perlengkapan Bait Allah menunjuk pada struktur buatan yang menopang bejana-bejana. “Penyangga” jelas dalam bahasa Indonesia modern dan tidak terlalu memperinci bentuk atau mobilitasnya.
- source_word: עָשָׂה
  choice: membuat
  rationale: Kata kerja umum עשה berarti “membuat”. Pilihan ini mempertahankan ungkapan lugas teks Ibrani tanpa menambahkan nuansa artistik yang tidak dinyatakan.
- source_word: הַכִּיֹּרוֹת
  choice: bejana-bejana pembasuhan
  rationale: כִּיּוֹר menunjuk pada wadah yang digunakan untuk pembasuhan. “Bejana pembasuhan” terdengar wajar dan bermartabat serta menjelaskan fungsinya bagi pembaca modern.
- source_word: עַל
  choice: di atas
  rationale: Preposisi עַל di sini menyatakan letak bejana pada penyangga; “di atas” merupakan padanan Indonesia yang langsung dan alami.
- source_word: וְאֶת ... וְאֶת
  choice: dan
  rationale: Partikel objek אֶת tidak perlu diterjemahkan tersendiri. Konjungsi kedua klausa dipertahankan dengan “dan”, sejalan dengan susunan daftar dalam bahasa Ibrani.
