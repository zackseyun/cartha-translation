  yaml_path: translation/ot/2_chronicles/004/020.yaml
  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
translation:
  language: id
  text: tempat-tempat pelita beserta pelita-pelitanya, untuk dinyalakan sesuai dengan ketetapan di hadapan ruang kudus bagian dalam,[a] semuanya dari emas murni;[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan Ruang Mahakudus.” Kata Ibrani דְּבִיר menunjuk pada ruang kudus bagian dalam Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “emas yang telah dimurnikan.” Ungkapan Ibrani זָהָב סָגוּר menunjuk pada emas murni atau emas olahan berkualitas tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: kaki-kaki pelita
  rationale: מְנוֹרָה menunjuk pada penyangga atau kaki pelita. Bentuk ini jelas dan lazim dalam bahasa Indonesia untuk perlengkapan Bait Allah.
- source_word: וְנֵרֹתֵיהֶם
  choice: beserta pelita-pelitanya
  rationale: נֵר di sini adalah pelita yang ditempatkan pada kaki pelita; akhiran pronominal jamak dipertahankan dengan '-nya'.
- source_word: לְבַעֲרָם
  choice: untuk dinyalakan
  rationale: Bentuk infinitif dengan akhiran objek menyatakan tujuan agar pelita-pelita itu menyala. Bentuk pasif ini alami dalam bahasa Indonesia dan mempertahankan fungsi yang dimaksud tanpa menambahkan pelaku.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan ketetapan
  rationale: מִשְׁפָּט dalam konteks tata ibadah menunjuk pada aturan atau tata cara yang telah ditetapkan.
- source_word: לִפְנֵי הַדְּבִיר
  choice: di hadapan ruang kudus bagian dalam
  rationale: דְּבִיר menunjuk pada ruang terdalam Bait Allah. Terjemahan deskriptif ini mempertahankan makna ruang tersebut tanpa menjadikan istilah tafsiran konvensional sebagai satu-satunya padanan.
- source_word: זָהָב סָגוּר
  choice: semuanya dari emas murni
  rationale: Ungkapan ini menunjuk pada emas berkualitas tinggi yang telah dimurnikan. 'Semuanya' memperjelas bahwa keterangan bahan berlaku pada perlengkapan yang baru disebut dalam alur daftar.
- source_word: וְאֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: וְאֶת melanjutkan daftar objek dari ayat sebelumnya. Dalam bahasa Indonesia, kesinambungan itu cukup ditunjukkan oleh susunan daftar tanpa menerjemahkan penanda objek secara mekanis.
theological_decisions:
- issue: Identifikasi הַדְּבִיר
  choice: ruang kudus bagian dalam
  alternative: Ruang Mahakudus
  rationale: Istilah Ibrani menunjuk pada ruang terdalam tempat kudus. Teks utama memakai padanan deskriptif, sedangkan istilah tradisional yang lebih spesifik dicatat sebagai alternatif agar ketegangan leksikal tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dipertahankan sebagai bagian dari daftar yang berlanjut dari ayat sebelumnya; tanda titik koma mencerminkan kesinambungan tersebut.
