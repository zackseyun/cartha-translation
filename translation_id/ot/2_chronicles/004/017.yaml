base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: id
  text: Di dataran Yordan, raja mengecor benda-benda itu di dalam tanah liat yang padat, di antara Sukot dan Zereda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat paralel dalam 1 Raja-raja 7:46 menyebut tempat ini “Zaretan”. Di sini, kitab Tawarikh memakai bentuk “Zereda”, yang kemungkinan merupakan bentuk lain dari nama tempat yang sama.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: Di Dataran Yordan
  rationale: כִּכָּר dalam konteks geografis ini menunjuk pada kawasan datar atau dataran di sekitar Yordan. “Dataran Yordan” alami dalam bahasa Indonesia dan tidak mempersempit maknanya secara berlebihan.
- source_word: יְצָקָם
  choice: mencetak benda-benda itu
  rationale: יצק di sini merujuk pada proses pengecoran logam. “Mencetak” menyampaikan tindakan membentuk perlengkapan perunggu melalui pengecoran, sedangkan akhiran objek jamak dinyatakan dengan “benda-benda itu” berdasarkan konteks dekat.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit ini menunjuk kepada Salomo dalam konteks. Bahasa Indonesia tidak memerlukan kata sandang tersendiri untuk menyatakan definiteness ini.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: dalam tanah liat
  rationale: Ungkapan harfiahnya berkaitan dengan ketebalan atau kepadatan tanah. Dalam konteks pengecoran, ungkapan ini paling wajar dipahami sebagai tanah liat padat yang dipakai dalam proses tersebut; terjemahan tetap menghindari penambahan eksplisit “cetakan”, yang tidak tertulis dalam teks Ibrani.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: di antara Sukot dan Zereda
  rationale: Nama-nama tempat ditransliterasikan dari bentuk dalam Tawarikh. Bentuk צְרֵדָתָה diterjemahkan “Zereda”, sementara perbedaan dengan nama dalam ayat paralel dijelaskan dalam catatan kaki.
