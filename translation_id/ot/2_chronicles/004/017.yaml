translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Susunan kalimat mempertahankan lokasi utama di awal sebagaimana teks Ibrani. Istilah teknis dibuat mudah dipahami tanpa menambahkan rincian yang tidak dinyatakan secara eksplisit.
