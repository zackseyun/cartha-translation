  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: id
  text: Huram-Abi[a] membuat periuk-periuk, sekop-sekop, garpu-garpu, dan segala perlengkapannya bagi Raja Salomo untuk Rumah Yahweh, semuanya dari perunggu yang dipoles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani dapat pula dipahami sebagai “Huram, ayahnya”. Namun, di sini “Huram-Abi” kemungkinan adalah nama atau gelar sang perajin.
    reason: alternative_reading
  - marker: b
    text: Atau, “perunggu yang digosok hingga berkilau”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: periuk-periuk
  rationale: סִירוֹת menunjuk pada wadah atau periuk; 'periuk-periuk' merupakan padanan langsung dan wajar dalam daftar perlengkapan rumah ibadah.
- source_word: הַיָּעִים
  choice: sekop-sekop
  rationale: יָעִים adalah alat untuk menyingkirkan abu atau menangani bara; 'sekop-sekop' jelas dan sesuai konteks.
- source_word: הַמִּזְלָגוֹת
  choice: garpu-garpu
  rationale: מִזְלָגוֹת menunjuk pada perkakas bercabang seperti garpu. Padanan umum ini mempertahankan ketidakpastian mengenai fungsi khususnya.
- source_word: כָּל כְּלֵיהֶם
  choice: segala perlengkapannya
  rationale: כְּלִי adalah istilah luas untuk perkakas, barang, atau perlengkapan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan akhiran pronominal Ibrani tanpa menyiratkan bahwa tiap alat memiliki perangkat tersendiri.
- source_word: חוּרָם אָבִיו
  choice: Huram-Abi
  rationale: Dalam konteks ini bentuk tersebut paling mungkin berfungsi sebagai nama atau gelar majemuk sang perajin. Tanda hubung mencegah pembacaan alami tetapi kemungkinan menyesatkan sebagai 'Huram, ayahnya'.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: bagi Raja Salomo
  rationale: Preposisi ל menandai pihak yang dilayani atau yang memberi penugasan; 'bagi Raja Salomo' menyampaikan hubungan itu secara alami.
- source_word: לְבֵית יְהוָה
  choice: untuk rumah Yahweh
  rationale: '''Rumah Yahweh'' mempertahankan ungkapan konkret בֵּית יְהוָה, sedangkan ''untuk'' menyatakan tujuan pembuatan perlengkapan tersebut.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: נְחֹשֶׁת מָרוּק
  choice: perunggu yang dipoles
  rationale: Dalam konteks pengerjaan logam rumah ibadah, נְחֹשֶׁת lazim menunjuk pada perunggu, sedangkan מָרוּק berarti dipoles atau digosok hingga berkilau.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Pemahaman חוּרָם אָבִיו
  choice: Huram-Abi sebagai nama atau gelar majemuk
  alternative: Huram, ayahnya
  rationale: Konteks menunjuk sang perajin yang juga disebut dengan bentuk serupa dalam Tawarikh. Namun, karena bentuk Ibraninya secara harfiah dapat dibaca 'Huram, ayahnya', kemungkinan itu dicatat dalam catatan kaki dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan bentuk jamak dipertahankan pada tiga jenis perkakas agar daftar terasa jelas; 'segala perlengkapannya' dipilih sebagai ungkapan payung yang alami. Penempatan 'semuanya' memperjelas bahwa bahan perunggu berlaku bagi seluruh daftar tanpa mengubah cakupan teks.
