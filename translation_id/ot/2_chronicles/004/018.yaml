  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: id
  text: Salomo membuat semua perlengkapan itu dalam jumlah yang sangat banyak, sebab berat perunggu itu tidak dapat ditentukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak diselidiki” atau “tidak dipastikan.” Kata Ibrani yang dipakai dapat berarti “diselidiki” atau “dipastikan”; dalam konteks ini, yang dimaksud ialah bahwa berat perunggu itu tidak ditentukan karena jumlahnya sangat banyak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה di sini secara langsung menyatakan pembuatan perlengkapan Bait Allah; “membuat” alami dan tepat dalam bahasa Indonesia.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: semua perlengkapan itu
  rationale: כֵּלִים adalah istilah luas bagi berbagai benda atau perkakas; “perlengkapan” sesuai dengan konteks benda-benda untuk Bait Allah tanpa mempersempit maknanya menjadi bejana saja.
- source_word: לָרֹב מְאֹד
  choice: dalam jumlah yang sangat besar
  rationale: Ungkapan ini menekankan kuantitas yang amat banyak. Pilihan ini mempertahankan penguatan מְאֹד dan terdengar alami dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan penjelasan bagi banyaknya perlengkapan tersebut; “sebab” mempertahankan hubungan penjelas atau kausal secara ringkas.
- source_word: לֹא נֶחְקַר
  choice: tidak dihitung
  rationale: Bentuk Niphal dari חקר secara harfiah berkaitan dengan sesuatu yang tidak diselidiki atau dipastikan. Dalam konteks berat logam, “tidak dihitung” menyampaikan bahwa berat itu tidak ditetapkan, sambil tidak menambahkan gagasan ketidakmampuan yang tidak dinyatakan secara eksplisit.
- source_word: מִשְׁקַל
  choice: berat
  rationale: מִשְׁקַל secara khusus menunjuk pada berat, sehingga makna pengukuran konkret dipertahankan.
- source_word: הַנְּחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Bait Allah, נְחֹשֶׁת lazim menunjuk pada perunggu; istilah ini juga merupakan padanan Indonesia yang umum dalam konteks Alkitab.
