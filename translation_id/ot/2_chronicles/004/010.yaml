  text: וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֧תֶף הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/010.yaml
  text: And he set the Sea at the southeast side[a], facing south.
translation:
  language: id
  text: Ia menempatkan Laut itu di sisi tenggara[a], menghadap ke selatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “di sisi kanan ke arah timur, berhadapan dengan selatan.” Dalam penentuan arah Ibrani, orang biasanya dibayangkan menghadap ke timur sehingga sisi kanan adalah selatan; gabungan ungkapan itu menunjuk pada sisi tenggara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Ia ... Laut itu
  rationale: Waw menghubungkan ayat ini dengan uraian sebelumnya, sedangkan penanda objek אֵת tidak diterjemahkan tersendiri dalam bahasa Indonesia. Hubungan antarkalimat tetap jelas tanpa harus memakai kata pembuka yang kaku.
- source_word: הַיָּם
  choice: Laut itu
  rationale: Istilah ini menunjuk pada bejana perunggu besar di kompleks Bait Allah. Sebutan harfiah "Laut" dipertahankan dan diawali huruf kapital karena berfungsi sebagai nama khusus perlengkapan tersebut.
- source_word: נָתַן
  choice: menempatkan
  rationale: Dalam konteks penataan perlengkapan, kata ini menyatakan tindakan menaruh suatu benda pada lokasi tertentu; "menempatkan" alami dan tepat dalam bahasa Indonesia.
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: di sisi tenggara
  rationale: כָּתֵף secara harfiah berarti "bahu", tetapi dalam keterangan tempat berarti "sisi". Dalam orientasi Ibrani yang mengandaikan orang menghadap ke timur, sisi kanan adalah selatan; bersama קֵדְמָה, "ke arah timur", frasa itu menunjuk pada sisi tenggara. Terjemahan gabungan ini menyampaikan lokasi secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: מִמּוּל נֶגְבָּה
  choice: menghadap ke selatan
  rationale: מִמּוּל menyatakan posisi atau orientasi di hadapan/berseberangan dengan sesuatu, dan נֶגְבָּה berarti ke arah selatan. "Menghadap ke selatan" menyampaikan hubungan arah tersebut secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. "Laut" dipertahankan sebagai nama bejana Bait Allah, bukan diubah menjadi istilah penjelas seperti "kolam". Catatan kaki menjaga bentuk spasial Ibrani yang lebih harfiah dan menjelaskan terjemahan idiomatis "sisi tenggara".
