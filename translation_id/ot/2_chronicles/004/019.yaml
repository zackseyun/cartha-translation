base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: id
  text: 'Salomo membuat segala perlengkapan untuk rumah Allah: mezbah emas, meja-meja, dan di atasnya roti sajian[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti hadirat,” yaitu roti yang disajikan di hadapan Allah.
    reason: Menjelaskan ungkapan kultis Ibrani לֶחֶם הַפָּנִים dan mempertahankan makna harfiahnya.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה secara umum berarti “membuat” atau “melakukan”; dalam daftar perlengkapan ini, “membuat” adalah padanan yang alami dan tepat.
- source_word: כָּל הַכֵּלִים
  choice: segala perlengkapan
  rationale: כֵּלִים menunjuk pada berbagai benda atau perkakas untuk ibadah. “Segala perlengkapan” alami dalam bahasa Indonesia dan sesuai dengan konteks rumah Allah.
- source_word: אֲשֶׁר בֵּית הָאֱלֹהִים
  choice: untuk rumah Allah
  rationale: Konstruksi ringkas bahasa Ibrani ini paling mungkin menyatakan bahwa perlengkapan tersebut diperuntukkan bagi rumah Allah, bukan sekadar berada di dalamnya.
- source_word: מִזְבַּח הַזָּהָב
  choice: mezbah emas
  rationale: Frasa ini secara alami menunjuk pada mezbah yang terbuat dari atau dilapisi emas; “mezbah emas” ringkas dan lazim.
- source_word: הַשֻּׁלְחָנוֹת
  choice: meja-meja
  rationale: Bentuk jamak Ibrani diterjemahkan secara langsung sebagai “meja-meja”.
- source_word: וַעֲלֵיהֶם
  choice: dan di atasnya
  rationale: Bentuk pronomina Ibrani merujuk kembali kepada meja-meja. Bahasa Indonesia dapat memakai “-nya” untuk rujukan jamak yang sudah jelas.
- source_word: לֶחֶם הַפָּנִים
  choice: roti Sajian
  rationale: Ungkapan kultis ini secara harfiah berarti “roti hadirat/wajah,” yakni roti yang disajikan di hadapan Allah. “Roti Sajian” jelas dan alami, sementara makna harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna בֵּית הָאֱלֹהִים
  choice: rumah Allah
  alternative: Bait Allah; rumah Tuhan
  rationale: “Rumah Allah” mempertahankan idiom Ibrani secara transparan tanpa mengubah אֱלֹהִים menjadi nama ilahi yang tidak terdapat dalam teks.
- issue: Terjemahan לֶחֶם הַפָּנִים
  choice: roti Sajian
  alternative: roti Hadirat; roti sajian di hadapan Allah
  rationale: “Roti Sajian” merupakan istilah yang mudah dipahami untuk roti kudus yang ditempatkan di hadapan Allah. Catatan kaki mempertahankan citra harfiah dan arti teologis ungkapan Ibrani tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Perlengkapan” dipilih daripada “bejana” karena cakupan כֵּלִים di sini lebih luas. Kapitalisasi “Sajian” menandai istilah khusus dalam tata ibadah tanpa menjadikannya nama diri.
