base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: id
  text: Ia membuat sepuluh meja dan menempatkannya di dalam Bait Allah, lima di sebelah kanan dan lima di sebelah kiri. Ia juga membuat seratus bokor emas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “baskom emas” atau “mangkuk emas untuk pemercikan”; istilah Ibrani ini menunjuk pada wadah ritual yang digunakan dalam pelayanan di Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: meja
  rationale: Kata benda ini lazim berarti meja; dalam konteks perlengkapan Bait Allah, terjemahan ini jelas tanpa mempersempit fungsinya.
- source_word: וַיַּנַּח
  choice: menempatkannya
  rationale: Kata kerja ini menyatakan tindakan meletakkan atau menempatkan benda pada posisi tertentu. Bentuk dengan -nya merujuk secara alami kepada sepuluh meja.
- source_word: בַּהֵיכָל
  choice: di dalam Bait Allah
  rationale: Dalam konteks ibadah ini, הֵיכָל menunjuk pada bangunan suci, bukan istana. 'Bait Allah' merupakan istilah Indonesia yang wajar untuk bangunan tersebut.
- source_word: מִיָּמִין
  choice: di sebelah kanan
  rationale: Terjemahan ini mempertahankan keterangan posisi tanpa menafsirkannya sebagai arah mata angin.
- source_word: מִשְּׂמֹאול
  choice: di sebelah kiri
  rationale: Terjemahan langsung ini berpasangan secara alami dengan 'di sebelah kanan' dan tidak menambahkan orientasi yang tidak dinyatakan.
- source_word: מִזְרְקֵי זָהָב
  choice: bokor emas
  rationale: מִזְרָק ialah wadah semacam mangkuk atau baskom yang dipakai dalam pelayanan ritual. 'Bokor' menyampaikan bentuk wadah sekaligus register perlengkapan ibadah dengan ringkas.
- source_word: מֵאָה
  choice: seratus
  rationale: Bilangan ini diterjemahkan secara langsung dan sesuai dengan gaya daftar perlengkapan.
