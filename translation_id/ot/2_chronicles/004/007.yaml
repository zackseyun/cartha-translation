    rationale: Istilah ini lazimnya menunjuk pada kaki atau penyangga suatu pelita, sedangkan מְנוֹרָה menunjuk pada perlengkapan tempat menopang pelita secara keseluruhan. “Tempat pelita” lebih idiomatis dan jelas.
  - severity: low
