base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: id
  text: Ia membuat sepuluh tempat pelita dari emas sesuai dengan ketentuan yang telah ditetapkan[a], lalu menempatkannya di ruang utama Bait Allah[b], lima di sebelah kanan dan lima di sebelah kiri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut tata cara yang ditetapkan” atau “menurut polanya.” Kata Ibrani yang dipakai dapat berarti ketetapan, aturan, tata cara, atau pola yang ditentukan.
    reason: lexical_alternative
  - marker: b
    text: Atau “di Bait Allah” atau “di ruang kudus.” Kata Ibrani ini menunjuk pada bangunan atau ruang utama Bait Allah, bukan seluruh kompleksnya.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “lima di kanan dan lima di kiri.” Berdasarkan orientasi Bait Allah, sisi-sisi ini mungkin bersesuaian dengan selatan dan utara.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk naratif Qal dari עשה berarti ‘membuat’; unsur penghubung waw diserap secara alami ke dalam alur kalimat Indonesia.
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: sepuluh kaki pelita dari emas
  rationale: מְנוֹרָה adalah penyangga atau kaki pelita, bukan sekadar pelita; הַזָּהָב menyatakan bahannya, dan עֶשֶׂר menyatakan jumlah sepuluh.
- source_word: כְּמִשְׁפָּטָם
  choice: menurut ketentuan bagi kaki-kaki pelita itu
  rationale: מִשְׁפָּט dapat menunjuk pada ketetapan, aturan, tata cara, atau pola yang ditentukan. ‘Ketentuan’ menjaga keluasan makna tanpa memastikan bahwa yang dimaksud semata-mata desain fisik.
- source_word: וַיִּתֵּן
  choice: lalu menempatkannya
  rationale: נתן secara dasar berarti ‘memberi/menaruh’; dalam konteks penataan perlengkapan, ‘menempatkan’ paling tepat dan alami.
- source_word: בַּהֵיכָל
  choice: di ruang utama Bait Allah
  rationale: הֵיכָל di sini menunjuk pada bangunan atau ruang utama Bait Allah, bukan seluruh kompleksnya. Pilihan ini lebih spesifik daripada hanya ‘di Bait Allah’.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: lima di sebelah kanan dan lima di sebelah kiri
  rationale: Terjemahan mempertahankan arah harfiah ‘kanan’ dan ‘kiri’ tanpa menafsirkannya langsung sebagai selatan dan utara.
