  source_fidelity: 'Makna dasar ayat dipertahankan: pembuatan sepuluh menopang pelita dari emas, menurut ketentuan yang berlaku, lalu penempatannya di hekhal, lima di kanan dan lima di kiri. Namun, “kaki pelita” dalam bahasa Indonesia lebih mudah dipahami sebagai bagian bawah/penopang sebuah pelita, bukan sebagai seluruh perlengkapan yang dimaksud oleh מְנֹרוֹת. Padanan “tempat pelita” lebih jelas dan tidak mengurangi cakupan benda tersebut.'
  naturalness: Kalimatnya sudah lugas, tetapi pengulangan “kaki pelita ... bagi kaki-kaki pelita itu” terasa berat dan tidak alami. “Sesuai dengan ketentuan yang telah ditetapkan” mengungkapkan כְּמִשְׁפָּטָם secara wajar tanpa membatasi maknanya pada rancangan fisik saja.
  terminology: “Tempat pelita” merupakan istilah Indonesia baku yang lebih aman untuk מְנֹרוֹת daripada “kaki pelita.” “Ruang utama Bait Allah” dapat dipertahankan untuk הֵיכָל, dengan catatan alternatif yang menjelaskan cakupan istilah itu. Arah “kanan” dan “kiri” dipertahankan secara harfiah.
  issues:
