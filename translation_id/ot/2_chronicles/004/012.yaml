  text: עַמּוּדִ֣ים שְׁנַ֔יִם וְ/הַ/גֻּלּ֧וֹת וְ/הַ/כֹּתָר֛וֹת עַל רֹ֥אשׁ הָ/עַמּוּדִ֖ים שְׁתָּ֑יִם וְ/הַ/שְּׂבָכ֣וֹת שְׁתַּ֔יִם לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל רֹ֥אשׁ הָֽ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: id
  text: kedua tiang, kedua mangkuk[a] dan kedua kepala tiang di atas tiang-tiang itu, serta kedua kisi-kisi[b] untuk menutupi kedua mangkuk pada kepala-kepala tiang yang berada di atas tiang-tiang itu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bola-bola” atau “bentuk-bentuk bundar”; bentuk arsitektural yang dimaksud oleh kata Ibrani ini tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “jaringan-jaringan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: tiang
  rationale: Kata ini menunjuk pada dua tiang Bait Allah dalam konteks arsitektural; “tiang” merupakan istilah Indonesia yang alami dan tepat.
- source_word: גֻּלּוֹת
  choice: mangkuk
  rationale: Nomina ini tampaknya menunjuk pada bagian berbentuk bulat atau menyerupai mangkuk di puncak tiang. “Mangkuk” mudah dipahami, sementara ketidakpastian bentuk tepatnya dipertahankan dalam catatan kaki.
- source_word: כֹּתָרוֹת
  choice: kepala tiang
  rationale: Dalam konteks arsitektur, kata ini berarti bagian paling atas yang berhias pada sebuah tiang. “Kepala tiang” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: רֹאשׁ
  choice: di atas
  rationale: Secara harfiah berarti “kepala”, tetapi dalam pemakaian arsitektural menunjukkan bagian atas atau puncak; “di atas” alami dalam frasa ini.
- source_word: שְּׂבָכוֹת
  choice: kisi-kisi
  rationale: Kata ini menunjuk pada hiasan berjalin atau berbentuk jaring. “Kisi-kisi” konkret dan alami dalam bahasa Indonesia; alternatif “jaringan” dicatat.
- source_word: לְכַסּוֹת
  choice: untuk menutupi
  rationale: Bentuk infinitif ini menyatakan tujuan atau fungsi kisi-kisi tersebut.
- source_word: אֲשֶׁר
  choice: yang berada
  rationale: Memperkenalkan klausa relatif mengenai kepala tiang atau susunan di puncak tiang tanpa menambahkan penafsiran di luar teks.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: kedua / dua
  rationale: Pengulangan bilangan dalam bahasa Ibrani dipertahankan karena ayat ini merinci perlengkapan Bait Allah satu per satu.
theological_decisions: []
