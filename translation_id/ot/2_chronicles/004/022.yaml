translation_notes:
  register: Bahasa Indonesia modern, formal, dan bermartabat. 'Bait' dipakai sebagai sebutan ringkas bagi Bait Allah dalam konteks yang sudah jelas. Tanda pisah menandai bahwa dua kelompok pintu menjelaskan 'pintu-pintu masuk', tanpa mengubah hubungan sintaksis dasar.
