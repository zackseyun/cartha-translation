  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: id
  text: Sepit pelita, bokor, cawan, dan perbaraan, semuanya dari emas murni. Pintu masuk Bait itu—pintu-pintu bagian dalamnya menuju Ruang Mahakudus dan pintu-pintu Bait menuju ruang utama—terbuat dari emas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: sepit-sepit pelita
  rationale: Dalam daftar perlengkapan Bait, kata ini menunjuk pada alat untuk merapikan atau memadamkan sumbu pelita. Pilihan ini menyatakan fungsi kultisnya dengan bahasa Indonesia yang jelas tanpa mengartikannya secara umum sebagai pisau.
- source_word: מִּזְרָקוֹת
  choice: bokor-bokor
  rationale: Kata ini lazim menunjuk pada wadah ritual untuk menampung atau memercikkan darah korban. 'Bokor' membedakannya dari כַּפּוֹת yang menyusul.
- source_word: כַּפּוֹת
  choice: cawan-cawan
  rationale: Dalam konteks ini kata tersebut menunjuk pada wadah-wadah kecil. 'Cawan' alami dan mempertahankan perbedaannya dari bokor.
- source_word: מַּחְתּוֹת
  choice: perbaraan-perbaraan
  rationale: Istilah ini menunjuk pada wadah untuk membawa bara atau api. 'Perbaraan' tidak membatasi fungsinya khusus sebagai pedupaan.
- source_word: זָהָב סָגוּר
  choice: emas murni
  rationale: Ungkapan ini menunjuk pada emas berkualitas tinggi yang telah dimurnikan; 'emas murni' merupakan padanan Indonesia yang baku dan mudah dipahami.
- source_word: פֶּתַח הַבַּיִת
  choice: pintu-pintu masuk ke Bait itu
  rationale: פֶּתַח berarti bukaan atau jalan masuk. Bentuk Indonesia ini mengaitkannya secara alami dengan dua kelompok pintu yang diperinci sesudahnya.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: pintu-pintu bagian dalam
  rationale: Bentuk jamak Ibrani menunjuk pada pintu atau daun-daun pintu bagian dalam, yang dibedakan dari pintu menuju ruang utama.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: menuju Ruang Mahakudus
  rationale: Padanan ini mempertahankan daya superlatif ungkapan Ibrani sekaligus jelas bagi pembaca Indonesia modern.
- source_word: וְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: dan pintu-pintu Bait menuju ruang utama
  rationale: הֵיכָל di sini adalah ruang utama bangunan Bait, berbeda dari Ruang Mahakudus. 'Ruang utama' jelas dan tidak mengimpor istilah arsitektur gerejawi.
- source_word: זָהָב
  choice: terbuat dari emas
  rationale: Nomina terakhir menyatakan bahan pintu-pintu tersebut; kopula verbal ditambahkan agar kalimat Indonesia alami.
