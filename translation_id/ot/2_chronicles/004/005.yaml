  to: Tebalnya selebar telapak tangan[a], dan bibirnya dibentuk seperti bibir cawan, seperti bunga lili yang mekar. Bejana itu dapat menampung tiga ribu bat[b].
  rationale: Revisi memperjelas ukuran טֶפַח, memakai istilah flora yang lebih tepat dalam bahasa Indonesia modern, dan mengganti “dibuat seperti” dengan “dibentuk seperti” agar perbandingan bentuk pengerjaan pada כְּמַעֲשֵׂה tetap terasa tanpa membuat kalimat kaku. Catatan tentang perbedaan tiga ribu dan dua ribu bat dipertahankan dengan bahasa yang tidak memaksakan penyelesaian tekstual.
