  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: id
  text: Tebalnya selebar telapak tangan[a], dan bibirnya dibentuk seperti bibir cawan, seperti bunga lili yang mekar. Bejana itu dapat menampung tiga ribu bat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ukuran ini adalah satuan panjang kuno, kira-kira selebar telapak tangan (sekitar 7,5 sentimeter).
    reason: cultural_note
  - marker: b
    text: Bat adalah satuan takaran cair Ibrani kuno. Dalam 1 Raja-Raja 7:26, bejana ini dikatakan dapat menampung dua ribu bat, sedangkan di sini tiga ribu bat. Perbedaan itu mungkin menunjuk pada kapasitas penuh dibandingkan isi normal, atau mencerminkan perbedaan dalam tradisi teks.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: tebalnya
  rationale: Nomina ini menunjuk pada ketebalan dinding bejana besar dari logam tuang.
- source_word: טֶפַח
  choice: setelapak tangan
  rationale: Satuan panjang kecil Ibrani kuno; padanan ini alami dalam bahasa Indonesia dan mempertahankan ukuran sumber tanpa konversi di dalam teks.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  choice: bibirnya / bibir cawan
  rationale: Untuk bejana, שָׂפָה berarti bibir atau pinggir. 'Bibir' mempertahankan citra wadah dan pengulangan dalam bahasa Ibrani.
- source_word: כְּמַעֲשֵׂה
  choice: dibuat seperti
  rationale: Ungkapan ini menunjuk pada bentuk atau hasil pengerjaan; pilihan ini alami sekaligus mempertahankan unsur pembuatannya.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: seperti bunga bakung yang mekar
  rationale: Menggambarkan bentuk bibir bejana menyerupai bunga bakung yang terbuka; 'mekar' menyampaikan nuansa פֶּרַח dengan jelas.
- source_word: מַחֲזִיק ... יָכִיל
  choice: dapat menampung
  rationale: Partisip dan verba tersebut bersama-sama menyatakan kapasitas bejana. Satu ungkapan ini menghindari pengulangan kaku dalam bahasa Indonesia.
- source_word: בַּתִּים
  choice: bat
  rationale: Nama satuan takaran cair Ibrani dipertahankan sebagai transliterasi dan dijelaskan dalam catatan kaki.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tiga ribu
  rationale: Padanan langsung untuk bilangan yang menyatakan kapasitas.
