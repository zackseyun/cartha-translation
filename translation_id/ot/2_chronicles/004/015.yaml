  text: the one Sea[a], and the twelve oxen under it.
translation:
  language: id
  text: satu Laut[a] dan kedua belas lembu di bawahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bejana yang disebut Laut”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: Laut
  rationale: יָם secara harfiah berarti “laut”, tetapi dalam konteks perlengkapan Bait Allah menunjuk pada bejana besar dari logam tuangan yang dikenal sebagai “Laut”. Huruf kapital mempertahankan fungsinya sebagai nama benda khusus.
- source_word: אֶחָד
  choice: satu
  rationale: Bilangan ini menerangkan “Laut” dan mempertahankan gaya daftar inventaris dalam konteksnya.
- source_word: הַבָּקָר
  choice: lembu
  rationale: בָּקָר adalah istilah kolektif untuk sapi, dan di sini menunjuk pada dua belas patung penyangga berbentuk lembu. “Lembu” alami dalam bahasa Indonesia dan tidak menentukan jenis kelamin secara lebih tegas daripada teks sumber.
- source_word: שְׁנֵים עָשָׂר
  choice: kedua belas
  rationale: Bentuk ini wajar dalam bahasa Indonesia ketika bilangan tertentu menerangkan kelompok yang sudah dikenal, yakni lembu-lembu penyangga Laut.
- source_word: תַּחְתָּיו
  choice: di bawahnya
  rationale: Akhiran orang ketiga maskulin tunggal merujuk kembali kepada “Laut”; “di bawahnya” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: אֶת ... וְאֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: אֶת menandai objek langsung dan diwakili oleh susunan kalimat bahasa Indonesia.
