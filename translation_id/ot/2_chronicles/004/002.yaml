base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: id
  text: Ia membuat Laut dari logam tuangan[a], berdiameter sepuluh hasta, dari bibir ke bibir, berbentuk bundar seluruhnya. Tingginya lima hasta, dan seutas tali sepanjang tiga puluh hasta mengelilinginya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Laut tuangan.” Dalam bahasa Ibrani, “Laut” adalah nama bejana besar di antara perlengkapan Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan seutas tali sepanjang tiga puluh hasta mengelilinginya.” Teks menggambarkan keliling bejana dengan cara pengukuran yang lazim pada zaman dahulu.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: Laut
  rationale: Secara harfiah berarti 'laut', tetapi dalam konteks perlengkapan Bait Allah merupakan nama bejana besar. Huruf kapital menandainya sebagai nama benda tersebut.
- source_word: מוּצָק
  choice: dari logam tuangan
  rationale: Partisip pasif ini menunjuk pada benda yang dibuat dengan menuangkan logam cair ke dalam cetakan; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: Garis tengahnya sepuluh hasta, dari bibir ke bibir
  rationale: Teks menyatakan ukuran dari satu bibir bejana ke bibir di seberangnya; 'garis tengah' membuat jenis ukuran itu jelas tanpa mengubah nilainya.
- source_word: עָגוֹל סָבִיב
  choice: Bentuknya bundar
  rationale: Menyampaikan bentuk melingkar bejana secara alami dalam bahasa Indonesia tanpa pengulangan yang kaku.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: tingginya lima hasta
  rationale: Mempertahankan ukuran kuno dan menyatakan konstruksi nominal Ibrani dengan wajar.
- source_word: וְקָו
  choice: tali pengukur
  rationale: קַו dapat menunjuk pada tali atau garis untuk mengukur; pilihan ini mempertahankan gambaran konkret alat ukur dalam teks.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: melingkarinya
  rationale: Menyampaikan bahwa tali itu mengitari seluruh bejana secara ringkas dan idiomatis.
