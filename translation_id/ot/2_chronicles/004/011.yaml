  text: וַ/יַּ֣עַשׂ חוּרָ֔ם אֶת הַ֨/סִּיר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חירם לַ/עֲשׂוֹת֙ אֶת הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בְּ/בֵ֥ית הָ/אֱלֹהִֽים־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: id
  text: 'Huram[a] membuat kuali-kuali, sekop-sekop, dan mangkuk-mangkuk. Lalu Huram selesai mengerjakan pekerjaan yang dilakukannya bagi Raja Salomo di rumah Allah:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dieja “Hiram” dalam bagian-bagian terkait.
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: Huram
  rationale: Bentuk pertama dalam ayat ini dibaca Hūrām, sedangkan kemunculan kedua ditulis חירם. “Huram” dipakai secara konsisten dalam teks utama; bentuk “Hiram” dicatat dalam catatan kaki.
- source_word: הַסִּירוֹת
  choice: kuali-kuali
  rationale: סִירוֹת menunjuk pada wadah atau periuk; “kuali-kuali” konkret, alami, dan sesuai dengan konteks perlengkapan rumah Allah tanpa menentukan fungsi yang tidak disebutkan.
- source_word: הַיָּעִים
  choice: sekop-sekop
  rationale: יָעִים adalah alat untuk menyekop atau memindahkan abu dan bahan lain; “sekop-sekop” merupakan padanan Indonesia modern yang jelas.
- source_word: הַמִּזְרָקוֹת
  choice: mangkuk-mangkuk
  rationale: מִזְרָקוֹת adalah mangkuk atau bokor yang dipakai dalam pelayanan ibadah. “Mangkuk-mangkuk” mudah dipahami dan tidak menambahkan fungsi ritual tertentu ke dalam teks.
- source_word: וַיְכַל
  choice: menyelesaikan
  rationale: Bentuk dari כלה menyatakan bahwa pekerjaan itu dituntaskan; “menyelesaikan” wajar dalam narasi Indonesia.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה אֲשֶׁר עָשָׂה
  choice: menyelesaikan pekerjaan yang dilakukannya
  rationale: Ungkapan ini mempertahankan pengulangan gagasan עשה secara alami dalam bahasa Indonesia tanpa terjemahan kaku seperti “membuat pekerjaan”.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: bagi Raja Salomo
  rationale: Preposisi ל menandai penerima atau pihak yang untuknya pekerjaan itu dilakukan; “bagi” menyampaikan hubungan tersebut secara alami.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: di rumah Allah
  rationale: Terjemahan ini mempertahankan secara transparan preposisi בְּ dan ungkapan harfiah “rumah Allah”, tanpa menggantinya dengan istilah interpretatif “Bait Allah” atau “kuil”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk ulang dipakai untuk menyatakan jamak pada daftar benda. Tanda titik dua dipertahankan karena ayat berikutnya melanjutkan perincian pekerjaan Huram.
