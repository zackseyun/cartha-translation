source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ כִּיּוֹרִים֮ עֲשָׂרָה֒ וַ֠/יִּתֵּן חֲמִשָּׁ֨ה מִ/יָּמִ֜ין וַ/חֲמִשָּׁ֤ה מִ/שְּׂמֹאול֙ לְ/רָחְצָ֣ה בָ/הֶ֔ם אֶת מַעֲשֵׂ֥ה הָ/עוֹלָ֖ה יָדִ֣יחוּ בָ֑/ם וְ/הַ/יָּ֕ם לְ/רָחְצָ֥ה לַ/כֹּהֲנִ֖ים בּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: id
  text: Ia membuat sepuluh bejana pembasuhan[a] dan menempatkan lima di sebelah kanan dan lima di sebelah kiri untuk mencuci di dalamnya. Di dalam bejana-bejana itu mereka membilas apa yang digunakan untuk kurban bakaran[b]. Namun, Laut itu[c] digunakan oleh para imam untuk membasuh diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “baskom-baskom besar.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pekerjaan kurban bakaran”; frasa ini tampaknya menunjuk pada benda atau bahan yang berkaitan dengan penyiapan kurban bakaran.
    reason: lexical_alternative
  - marker: c
    text: “Laut” adalah nama wadah perunggu yang sangat besar di kompleks Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: bejana pembasuhan
  rationale: Istilah ini menunjuk pada wadah besar untuk pembasuhan dalam pelayanan Bait Allah. Pilihan ini jelas dalam bahasa Indonesia modern dan membedakannya dari wadah biasa.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: di sebelah kanan / di sebelah kiri
  rationale: Menyampaikan penempatan ruang secara alami tanpa menentukan titik orientasi yang tidak disebutkan dalam teks.
- source_word: לְרָחְצָה
  choice: untuk mencuci / untuk membasuh diri
  rationale: 'Infinitif tujuan diterjemahkan sesuai objek tersiratnya: pencucian perlengkapan pada bagian pertama dan pembasuhan para imam pada bagian kedua.'
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: apa yang digunakan untuk kurban bakaran
  rationale: Frasa Ibrani secara harfiah berarti 'pekerjaan kurban bakaran' dan bersifat eliptis. Terjemahan ini mempertahankan keluasan rujukannya sambil membuat konteks ritualnya dapat dipahami.
- source_word: יָדִיחוּ
  choice: mereka membilas
  rationale: Bentuk Hifil menyatakan tindakan membilas atau membersihkan dengan air; bentuk imperfek di sini wajar dipahami sebagai kegiatan yang biasa dilakukan.
- source_word: וְהַיָּם
  choice: Namun, Laut itu
  rationale: Nama khas wadah perunggu besar dipertahankan secara harfiah. 'Namun' menandai perbedaan fungsi antara bejana-bejana dan Laut.
- source_word: לַכֹּהֲנִים
  choice: digunakan oleh para imam
  rationale: Menyampaikan fungsi atau peruntukan bagi para imam secara alami dalam bahasa Indonesia.
