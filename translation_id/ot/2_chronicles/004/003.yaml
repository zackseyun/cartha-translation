base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: id
  text: Di bawahnya terdapat rupa-rupa lembu[a] yang mengelilinginya, sepuluh pada setiap hasta,[b] mengitari Laut itu seluruhnya. Rupa-rupa lembu itu tersusun dalam dua baris dan dicor menjadi satu dengannya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bentuk-bentuk lembu”; yang dimaksud ialah hiasan yang menyerupai lembu, bukan lembu hidup.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sepuluh dalam satu hasta,” kemungkinan berarti sepuluh bentuk lembu untuk setiap hasta sepanjang kelilingnya.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “dicor dalam pengecorannya”; rupa-rupa lembu itu dibuat dalam pengecoran yang sama dengan Laut tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: bentuk-bentuk lembu
  rationale: דְמוּת menunjuk pada bentuk, rupa, atau representasi, sehingga frasa ini menggambarkan hiasan berbentuk lembu, bukan hewan hidup. Bentuk jamak dalam bahasa Indonesia mengikuti maksud kolektif konteks.
- source_word: תַּחַת לוֹ
  choice: di bawahnya
  rationale: Ungkapan ini menunjukkan letak hiasan pada bagian bawah bejana dan diterjemahkan secara langsung serta wajar.
- source_word: סָבִיב סָבִיב סוֹבְבִים אֹתוֹ
  choice: yang melingkar di sekelilingnya
  rationale: Pengulangan סָבִיב menegaskan bahwa deretan hiasan mengitari bejana. Ungkapan Indonesia ini mempertahankan gambaran melingkar tanpa pengulangan yang kaku.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sepuluh buah setiap hasta
  rationale: Frasa Ibrani menyatakan jumlah sepuluh untuk tiap satuan hasta. Kata 'buah' memperjelas bahwa yang dihitung ialah bentuk-bentuk lembu.
- source_word: מַקִּיפִים אֶת הַיָּם סָבִיב
  choice: mengelilingi Laut itu seluruhnya
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit הַיָּם dan penekanan bahwa hiasan mengitari seluruh bejana. 'Laut' diperlakukan sebagai sebutan khusus bagi bejana besar di Bait Allah.
- source_word: שְׁנַיִם טוּרִים
  choice: tersusun dalam dua baris
  rationale: טוּרִים berarti baris-baris; penambahan 'tersusun' membuat hubungan sintaksisnya jelas dan alami dalam bahasa Indonesia.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: dicetak menyatu dengannya
  rationale: Dalam konteks pengerjaan logam, יצק berarti menuang atau mencetak logam. Frasa ini menunjukkan bahwa hiasan lembu dibuat dalam pengecoran yang sama dengan bejana, bukan dipasang kemudian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan pengulangan gambaran mengelilingi bejana, tetapi menghindari susunan yang kaku. Istilah 'hasta' dipertahankan sebagai ukuran kuno yang lazim dalam teks Alkitab, dan 'Laut' ditulis dengan huruf kapital sebagai nama bejana besar di Bait Allah.
