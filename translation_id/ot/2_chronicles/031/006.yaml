  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: id
  text: Orang Israel dan Yehuda yang tinggal di kota-kota Yehuda juga membawa persepuluhan dari sapi serta kambing dan domba, serta persepuluhan dari benda-benda kudus yang telah dikhususkan bagi Yahweh, Allah mereka. Mereka menaruh semuanya dalam tumpukan demi tumpukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Orang Israel dan Yehuda
  rationale: בני digunakan secara kolektif bagi anggota kedua kelompok, bukan hanya anak laki-laki; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan pembedaan Israel–Yehuda.
- source_word: הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה
  choice: yang tinggal di kota-kota Yehuda
  rationale: Partisipel ישב menyatakan kediaman, sedangkan ערי adalah bentuk jamak dari 'kota'.
- source_word: גַּם הֵם
  choice: juga
  rationale: Menunjukkan bahwa para penduduk ini pun ikut membawa persepuluhan; posisi 'juga' menghasilkan kalimat Indonesia yang wajar.
- source_word: מַעְשַׂר
  choice: persepuluhan
  rationale: Istilah baku dan mudah dipahami untuk bagian sepersepuluh dalam konteks ibadah.
- source_word: בָּקָר וָצֹאן
  choice: sapi dan kambing domba
  rationale: בקר menunjuk ternak besar, khususnya sapi, sedangkan צאן mencakup ternak kecil berupa domba dan kambing; pilihan ini mempertahankan cakupan kata Ibrani lebih baik daripada hanya 'domba'.
- source_word: וּמַעְשַׂר קָדָשִׁים
  choice: serta persepuluhan dari benda-benda kudus
  rationale: קדשים di sini menunjuk benda atau pemberian yang berstatus kudus; terjemahan tidak mempersempitnya menjadi satu jenis persembahan tertentu.
- source_word: הַמְקֻדָּשִׁים לַיהוָה
  choice: yang telah dikhususkan bagi Yahweh
  rationale: Partisipel pasif קדש menyatakan sesuatu yang telah dipisahkan sebagai kudus bagi Allah; 'dikhususkan' jelas dan alami dalam bahasa Indonesia.
- source_word: הֵבִיאוּ
  choice: membawa
  rationale: Bentuk hiphil dari בוא secara langsung bermakna 'membawa' dalam konteks ini.
- source_word: וַיִּתְּנוּ עֲרֵמוֹת עֲרֵמוֹת
  choice: Mereka menaruh semuanya dalam tumpukan demi tumpukan
  rationale: נתן bersama ערמות bermakna menaruh atau menempatkan barang-barang itu; pengulangan nomina menyatakan banyak tumpukan dan dipertahankan secara idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה; bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna קדשים yang dipersembahkan
  choice: benda-benda kudus
  alternative: persembahan-persembahan kudus
  rationale: Bentuk jamak substantival ini cukup luas dan tidak memastikan jenis bendanya. Pilihan 'benda-benda kudus' mempertahankan keluasan dan ketegangan leksikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah menjadi dua agar deretan objek tetap jelas. 'Kambing domba' dipakai sebagai istilah kolektif untuk ternak kecil, dan 'tumpukan demi tumpukan' mempertahankan penekanan pengulangan Ibrani tanpa redundansi yang janggal.
