source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: id
  text: Kore anak Yimna, orang Lewi yang menjadi penjaga pintu di sebelah timur, bertanggung jawab atas persembahan sukarela kepada Allah, untuk membagikan[a] persembahan khusus bagi Yahweh dan benda-benda yang mahakudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberikan”; bentuk infinitif Ibrani secara harfiah berarti “untuk memberikan”, tetapi di sini menunjuk pada pemberian kepada para penerima, yakni pembagian barang yang telah dipersembahkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “benda-benda yang mahakudus”. Ungkapan Ibrani ini berarti hal-hal yang memiliki tingkat kekudusan tertinggi dan di sini tidak menunjuk pada ruang Mahakudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: Kore anak Yimna
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; konstruksi patronimik diterjemahkan secara langsung. Konjungsi pembuka tidak perlu dinyatakan karena ayat ini melanjutkan uraian administratif.
- source_word: הַלֵּוִי הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: orang Lewi yang menjadi penjaga pintu di sebelah timur
  rationale: Menunjukkan status Kore sebagai orang Lewi dan tugasnya sebagai penjaga pintu pada sisi timur. Kata 'pintu' dipertahankan dari jabatan penjaga, tanpa menambahkan 'gerbang timur' sebagai lokasi yang lebih spesifik daripada teks.
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: bertanggung jawab atas persembahan sukarela kepada Allah
  rationale: Dalam konteks administratif, עַל menyatakan tanggung jawab atau pengawasan. נִדְבוֹת adalah persembahan yang diberikan dengan sukarela; 'kepada Allah' menyampaikan arah persembahan secara alami dalam bahasa Indonesia.
- source_word: לָתֵת
  choice: untuk membagikan
  rationale: Secara harfiah berarti 'untuk memberikan', tetapi dalam konteks pengelolaan persediaan kudus, tindakan yang dimaksud ialah memberikannya kepada para penerima atau membagikannya.
- source_word: תְּרוּמַת יְהוָה
  choice: persembahan khusus Yahweh
  rationale: תְּרוּמָה menunjuk pada bagian atau sumbangan yang dikhususkan. Konstruksi ringkas ini mempertahankan hubungan genitif Ibrani tanpa memaksakan apakah nuansanya terutama 'milik', 'dari', atau 'bagi' Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: dan persembahan-persembahan yang mahakudus
  rationale: Ungkapan intensif Ibrani menunjuk pada benda atau persembahan dengan tingkat kekudusan tertinggi dalam konteks ini, bukan pada ruang Mahakudus.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: persembahan-persembahan yang mahakudus
  alternative: tempat Mahakudus
  rationale: Konteks pembagian persembahan menunjukkan bahwa frasa ini merujuk pada barang atau persembahan yang sangat kudus, bukan ruang terdalam tempat kudus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat tetap dekat dengan urutan Ibrani, sementara ungkapan administratif diterjemahkan secara wajar. Istilah kultis yang berpotensi kabur dijelaskan melalui catatan kaki, dan hubungan genitif pada 'persembahan khusus Yahweh' sengaja tidak diperinci secara berlebihan.
