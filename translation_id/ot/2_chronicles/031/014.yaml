  source_fidelity: Struktur utama dan fungsi administratifnya diterjemahkan dengan tepat. Namun, תְּרוּמַת יְהוָה lebih jelas sebagai persembahan/bagian yang dikhususkan bagi Yahweh, bukan frasa yang berpotensi dibaca sebagai persembahan yang berasal dari Yahweh. Selain itu, קָדְשֵׁי הַקֳּדָשִׁים secara harfiah menunjuk pada benda-benda atau hal-hal mahakudus; menerjemahkannya sebagai “persembahan-persembahan” mempersempit rujukan tanpa kebutuhan.
  naturalness: Bahasa draf umumnya baku dan lancar. “Penjaga pintu di sebelah timur” dan “bertanggung jawab atas” wajar dalam konteks ini. “Benda-benda yang mahakudus” tetap alami dalam register kitab suci dan lebih dekat dengan bentuk Ibrani.
  terminology: “Yahweh” tepat untuk יהוה. “Persembahan sukarela” tepat untuk נִדְבוֹת. “Persembahan khusus bagi Yahweh” menyampaikan תְּרוּמָה sebagai bagian/persembahan yang dikhususkan tanpa menyamakan istilah itu dengan kategori kedua, yaitu “benda-benda yang mahakudus.”
