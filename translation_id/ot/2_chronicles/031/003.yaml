source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: id
  text: 'Bagian raja yang berasal dari harta miliknya sendiri diperuntukkan bagi kurban-kurban bakaran: kurban bakaran pagi dan petang, serta kurban-kurban bakaran untuk hari-hari Sabat, perayaan-perayaan bulan baru[a], dan perayaan-perayaan yang ditetapkan[b], seperti yang tertulis dalam Taurat Yahweh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Perayaan-perayaan bulan baru” adalah ibadah bulanan Israel pada awal bulan menurut kalender mereka.
    reason: cultural_note
  - marker: b
    text: Atau “waktu-waktu raya yang ditetapkan” atau “perayaan-perayaan yang ditetapkan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “hukum Yahweh” atau “pengajaran Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: Bagian yang ditetapkan raja
  rationale: מְנָה menunjuk pada bagian atau jatah yang ditentukan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan alokasi khusus dari raja.
- source_word: מִן רְכוּשׁוֹ
  choice: dari harta miliknya sendiri
  rationale: רְכוּשׁ mencakup harta, barang, atau kekayaan. Kata 'sendiri' memperjelas bahwa pembiayaan ini berasal dari milik pribadi raja.
- source_word: לָעֹלוֹת
  choice: untuk kurban-kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi persembahan yang dibakar seluruhnya. 'Kurban bakaran' merupakan padanan Indonesia yang ringkas dan dikenal luas.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: kurban bakaran pagi dan petang
  rationale: Terjemahan ini menyampaikan kedua waktu persembahan dengan wajar tanpa mengaburkan pengulangan istilah עֹלָה dalam teks Ibrani.
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: serta kurban-kurban bakaran untuk hari-hari Sabat, perayaan-perayaan bulan baru, dan hari-hari raya yang ditetapkan
  rationale: Dalam konteks ibadah, חֳדָשִׁים berarti perayaan bulan baru, bukan sekadar bulan; מוֹעֲדִים menunjuk pada waktu atau perayaan yang telah ditetapkan.
- source_word: כַּכָּתוּב
  choice: seperti yang tertulis
  rationale: Formula ini secara alami menyatakan bahwa praktik tersebut sesuai dengan ketentuan tertulis.
- source_word: בְּתוֹרַת יְהוָה
  choice: dalam Taurat Yahweh
  rationale: תּוֹרָה dalam konteks hukum ibadah menunjuk pada Taurat atau hukum tertulis, sedangkan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama ilahi itu, bukan menggantinya dengan gelar.
- issue: Cakupan makna תּוֹרָה
  choice: Taurat
  alternative: hukum; pengajaran
  rationale: Dalam konteks ketentuan kurban yang tertulis, 'Taurat' paling tepat menunjuk pada kumpulan petunjuk hukum ilahi, sambil tetap mempertahankan istilah tradisional yang dikenal pembaca Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dengan titik dua mempertahankan hubungan penjelas antara ringkasan 'kurban-kurban bakaran' dan daftar sesudahnya. Bentuk jamak dipertahankan pada kelompok persembahan dan hari perayaan; istilah ritual diberi catatan singkat agar dapat dipahami pembaca umum.
