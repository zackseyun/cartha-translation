id: 2CH.31.16
reference: 2 Chronicles 31:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/לְּ/בַ֞ד הִתְיַחְשָׂ֣/ם לִ/זְכָרִ֗ים מִ/בֶּ֨ן שָׁל֤וֹשׁ שָׁנִים֙ וּ/לְ/מַ֔עְלָ/ה לְ/כָל הַ/בָּ֥א לְ/בֵית יְהוָ֖ה לִ/דְבַר י֣וֹם בְּ/יוֹמ֑/וֹ לַ/עֲב֣וֹדָתָ֔/ם בְּ/מִשְׁמְרוֹתָ֖/ם כְּ/מַחְלְקוֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: id
  text: Selain mereka yang tercatat menurut silsilah, yakni laki-laki berusia tiga tahun ke atas[a], semua orang yang masuk ke rumah Yahweh, sesuai dengan keperluan setiap hari[b], untuk pelayanan mereka dalam giliran tugas mereka menurut kelompok-kelompok mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “selain pendaftaran menurut silsilah bagi laki-laki berusia tiga tahun ke atas.”
    reason: Bentuk Ibrani dapat dipahami secara nominal, merujuk pada pendaftaran silsilah, bukan hanya pada orang-orang yang tercatat.
  - marker: b
    text: Secara harfiah, “untuk perkara suatu hari pada harinya,” yaitu apa yang diperlukan atau ditetapkan bagi setiap hari.
    reason: Menjelaskan idiom Ibrani yang dipadatkan dalam teks utama.
  - marker: c
    text: Atau, “dalam penjagaan mereka” atau “menurut giliran dinas mereka.”
    reason: מִשְׁמְרוֹתָם dapat menekankan penjagaan, tanggung jawab yang dipercayakan, atau giliran pelayanan.
lexical_decisions:
- source_word: מִלְּבַד הִתְיַחְשָׂם
  choice: Selain mereka yang tercatat dalam daftar silsilah
  rationale: מִלְּבַד menandai golongan tambahan atau tersendiri, sedangkan bentuk hitpael הִתְיַחְשָׂם menunjuk pada pencatatan berdasarkan silsilah. Ungkapan ini mempertahankan nuansa administratif dengan bahasa Indonesia yang wajar.
- source_word: לִזְכָרִים מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: yaitu laki-laki berumur tiga tahun ke atas
  rationale: Teks Ibrani secara khusus menyebut laki-laki dan menetapkan ambang usia mulai tiga tahun. 'Yaitu' memperjelas bahwa frasa ini menerangkan pihak yang dicatat tanpa meniadakan kemungkinan hubungan sintaksis lain yang dicatat dalam catatan kaki.
- source_word: לְכָל הַבָּא לְבֵית יְהוָה
  choice: semua yang datang ke rumah Yahweh
  rationale: Partisipel הַבָּא bersifat kolektif dan dapat berarti datang atau masuk. 'Datang ke' alami dalam bahasa Indonesia serta tidak menambahkan rincian yang tidak dinyatakan teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diteruskan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: sesuai dengan keperluan setiap hari
  rationale: Ungkapan harfiah 'perkara suatu hari pada harinya' merupakan idiom bagi kebutuhan atau ketentuan harian. Pilihan ini menyampaikan fungsi idiom itu sambil mempertahankan unsur hari demi hari.
- source_word: לַעֲבוֹדָתָם
  choice: untuk melaksanakan pelayanan
  rationale: עֲבוֹדָה dalam konteks rumah Yahweh menunjuk pada pekerjaan atau pelayanan yang ditugaskan. 'Pelayanan' sesuai dengan konteks ibadah tanpa memasukkan istilah gerejawi yang lebih kemudian.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: dalam giliran tugas mereka
  rationale: מִשְׁמָרוֹת dapat menunjuk pada penjagaan, tanggung jawab, atau giliran dinas. Dalam susunan petugas rumah Yahweh, 'giliran tugas' menyampaikan nuansa penugasan terjadwal.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: menurut kelompok-kelompok mereka
  rationale: מַחְלְקוֹת menunjuk pada pembagian atau kelompok kerja yang terorganisasi. 'Kelompok-kelompok' lebih mudah dipahami pembaca modern daripada istilah teknis yang arkais.
theological_decisions:
- issue: Bahasa khusus gender bagi petugas rumah Yahweh
  choice: laki-laki
  alternative: orang-orang
  rationale: זְכָרִים secara eksplisit berarti laki-laki; menetralkannya akan menghilangkan informasi yang terdapat dalam teks sumber.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi. Bentuk 'Yahweh' mempertahankannya sebagai nama dan membedakannya dari gelar.
- issue: Hubungan antara pencatatan silsilah dan mereka yang datang ke rumah Yahweh
  choice: Mempertahankan urutan dua kelompok/frasa sebagaimana teks Ibrani
  alternative: Menggabungkan semuanya sebagai satu kelompok tanpa jeda
  rationale: Sintaksis ayat ini padat dan bergantung pada konteks pembagian sebelumnya. Terjemahan tidak memaksakan penjelasan teologis tentang siapa tepatnya yang menerima bagian, sedangkan catatan kaki mengakui kemungkinan pemahaman gramatikal lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur administratif ayat dipertahankan, tetapi ungkapan idiomatis dibuat mudah dipahami. Istilah 'rumah Yahweh' dipilih untuk mempertahankan citra harfiah בֵּית יהוה, bukan menafsirkannya langsung sebagai 'Bait Allah'.
