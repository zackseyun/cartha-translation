  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: id
  text: Pada bulan ketiga mereka mulai menyusun tumpukan-tumpukan itu dari dasarnya[a], dan pada bulan ketujuh mereka selesai menyusunnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka mulai tumpukan-tumpukan itu untuk meletakkan dasar.” Ungkapan ini berarti bahwa mereka mulai menyusun tumpukan-tumpukan itu dari bagian dasarnya. Dalam konteks, tumpukan-tumpukan itu terdiri atas persembahan hasil bumi yang dikumpulkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: Pada bulan ketiga
  rationale: חֹדֶשׁ dalam keterangan waktu ini berarti “bulan”; bentuk dengan preposisi dan kata sandang wajar diterjemahkan “pada bulan”.
- source_word: הֵחֵלּוּ
  choice: mereka mulai
  rationale: Bentuk Hifil orang ketiga jamak dari חלל dalam konstruksi ini menyatakan permulaan suatu tindakan.
- source_word: הָעֲרֵמוֹת
  choice: menumpuk persembahan itu
  rationale: עֲרֵמוֹת secara konkret berarti “tumpukan-tumpukan”. Dalam konteks, tumpukan tersebut terdiri atas persembahan hasil bumi; pengungkapan verbal ini lebih alami dalam bahasa Indonesia sambil mempertahankan gambaran penumpukan.
- source_word: לְיִסּוֹד
  choice: dari dasarnya
  rationale: Infinitif יסד menunjuk pada peletakan dasar atau tahap awal terbentuknya tumpukan. “Dari dasarnya” menyampaikan bahwa penumpukan dimulai pada bagian dasar tanpa mengesankan pembangunan fondasi tersendiri.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: dan pada bulan ketujuh
  rationale: Terjemahan langsung dan alami bagi kelanjutan keterangan waktu dengan ו.
- source_word: כִּלּוּ
  choice: mereka selesai
  rationale: Bentuk Piel dari כלה berarti menyelesaikan atau menuntaskan. Bahasa Ibrani tidak menyebut objek secara eksplisit; “mereka selesai” mempertahankan hal itu secara wajar dalam konteks Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “mulai menumpuk ... dari dasarnya” dipilih agar idiom Ibrani dipahami secara alami, sementara catatan kaki mempertahankan bentuk harfiah dan citra tumpukan.
