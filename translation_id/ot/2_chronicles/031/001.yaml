source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: id
  text: Setelah semuanya itu selesai, seluruh orang Israel yang hadir pergi ke kota-kota di Yehuda. Mereka menghancurkan tugu-tugu pemujaan, menebang benda-benda pemujaan Asyera[a], serta merobohkan bukit-bukit pemujaan dan mezbah-mezbah di seluruh Yehuda dan Benyamin, juga di Efraim dan Manasye, sampai semuanya dimusnahkan. Kemudian seluruh bani Israel pulang, setiap orang ke tanah miliknya, ke kota-kota mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang-tiang Asyera.” Kata Ibrani ini dapat menunjuk kepada benda-benda pemujaan yang berkaitan dengan Asyera, sering kali dipahami sebagai tiang kayu atau pohon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: Setelah semuanya itu selesai
  rationale: Konstruksi infinitif dengan כְּ menyatakan waktu. Bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan pelaku yang tidak disebutkan dalam bahasa Ibrani.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: seluruh orang Israel yang hadir
  rationale: Partisipel הַנִּמְצְאִים secara harfiah berarti 'yang didapati' dan dalam konteks menunjuk kepada orang Israel yang hadir pada perayaan itu.
- source_word: הַמַּצֵּבוֹת
  choice: tugu-tugu pemujaan
  rationale: מַצֵּבוֹת adalah batu atau tugu tegak yang memiliki fungsi kultis; penambahan 'pemujaan' membuat maknanya jelas tanpa menentukan bentuknya secara berlebihan.
- source_word: הָאֲשֵׁרִים
  choice: benda-benda pemujaan Asyera
  rationale: Bentuk jamak ini dapat menunjuk kepada objek kultis yang berkaitan dengan Asyera, mungkin tiang atau pohon. Ungkapan umum mempertahankan ketidakpastian bentuk bendanya.
- source_word: הַבָּמוֹת
  choice: bukit-bukit pemujaan
  rationale: בָּמוֹת menunjuk kepada tempat-tempat kultis yang ditinggikan atau lazim disebut 'bukit pengorbanan'; 'bukit-bukit pemujaan' jelas bagi pembaca modern dan tidak membatasi kegiatannya pada pengorbanan.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: di seluruh Yehuda dan Benyamin, juga di Efraim dan Manasye
  rationale: Terjemahan ini menyampaikan cakupan geografis tindakan tersebut sambil mencerminkan pergantian preposisi dalam teks Ibrani secara wajar.
- source_word: עַד לְכַלֵּה
  choice: sampai semuanya dimusnahkan
  rationale: Ungkapan ini menekankan bahwa pemusnahan objek-objek kultis itu dilakukan sampai tuntas; 'semuanya' merujuk kembali kepada daftar objek sebelumnya.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  rationale: '''Bani Israel'' adalah ungkapan Indonesia yang mapan untuk etnonim harfiah ''anak-anak lelaki Israel'' tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.'
- source_word: אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם
  choice: ke kota mereka masing-masing, setiap orang ke tanah miliknya
  rationale: אֲחֻזָּה menunjuk kepada tanah milik atau tanah pegangan, sering kali turun-temurun. Susunan Indonesia diatur agar hubungan antara kepulangan, kota, dan milik tiap orang terbaca alami.
theological_decisions:
- issue: Etnonim maskulin dan bentuk distributif tunggal
  choice: seluruh bani Israel ... setiap orang ke tanah miliknya
  alternative: seluruh orang Israel ... masing-masing ke tanah milik mereka
  rationale: Pilihan ini mempertahankan bentuk etnonim tradisional dan unsur distributif אִישׁ tanpa menyimpulkan bahwa perempuan dikecualikan dari komunitas yang dimaksud.
- issue: Identitas dan bentuk אֲשֵׁרִים
  choice: benda-benda pemujaan Asyera
  alternative: tiang-tiang Asyera
  rationale: Teks mengaitkan objek-objek tersebut dengan Asyera tetapi tidak memastikan bahwa semuanya berbentuk tiang. Terjemahan utama menjaga ambiguitas ini, sedangkan kemungkinan bentuknya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Istilah kultis diberi penjelas singkat dalam teks agar jelas bagi pembaca umum; ambiguitas bentuk objek Asyera dipertahankan melalui terjemahan umum dan catatan kaki.
