  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: id
  text: Ia juga memerintahkan rakyat, yaitu penduduk Yerusalem, untuk memberikan bagian yang menjadi hak para imam dan orang Lewi, supaya mereka dapat mencurahkan diri pada hukum Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya mereka menjadi kuat dalam hukum Yahweh,” atau “supaya mereka berpegang teguh pada hukum Yahweh.”
    reason: Alternatif leksikal untuk יֶחֶזְקוּ בְּתוֹרַת יְהוָה, yang dapat menyatakan menjadi kuat atau berpegang teguh dalam/pada hukum Yahweh.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia juga memerintahkan
  rationale: Secara leksikal berarti “dan ia berkata,” tetapi dalam konteks titah raja yang diikuti klausa infinitif, “memerintahkan” menyampaikan daya ujarannya secara wajar. “Juga” menandai kelanjutan narasi.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: rakyat, yaitu penduduk Yerusalem
  rationale: Frasa kedua menjelaskan secara lebih khusus siapa yang dimaksud dengan rakyat; “yaitu” membuat hubungan aposisional itu jelas dan alami dalam bahasa Indonesia.
- source_word: לָתֵת מְנָת
  choice: untuk memberikan bagian yang menjadi hak
  rationale: מְנָה menunjuk pada bagian atau jatah yang telah ditetapkan. Ungkapan ini menyampaikan bahwa bagian tersebut merupakan hak yang diperuntukkan bagi para pelayan ibadah.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Kedua kelompok dipertahankan sebagai kelompok yang berbeda. “Orang Lewi” merupakan sebutan Indonesia yang alami dan mapan.
- source_word: לְמַעַן
  choice: supaya
  rationale: Konjungsi ini menyatakan tujuan; “supaya” alami dalam bahasa Indonesia modern.
- source_word: יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: mereka dapat mencurahkan diri pada hukum Yahweh
  rationale: Dalam konteks dukungan materi bagi imam dan orang Lewi, חזק dengan ב dapat menyatakan keteguhan atau keterikatan yang memungkinkan mereka berfokus pada tugas menurut hukum Yahweh. Terjemahan utama menyampaikan maksud kontekstual, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Makna יֶחֶזְקוּ בְּתוֹרַת יְהוָה
  choice: supaya mereka dapat mencurahkan diri pada hukum Yahweh
  alternative: supaya mereka menjadi kuat dalam hukum Yahweh; supaya mereka berpegang teguh pada hukum Yahweh
  rationale: Frasa Ibrani memungkinkan nuansa menjadi kuat, dikuatkan, atau berpegang teguh. Konteks pemberian bagian kepada imam dan orang Lewi mendukung makna bahwa mereka dimampukan untuk mencurahkan diri pada hukum itu, tetapi alternatif yang lebih harfiah tetap dipertahankan dalam catatan kaki.
- issue: Penerjemahan יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; bentuk “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat alami tanpa menghilangkan hubungan aposisional “rakyat—penduduk Yerusalem.” Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
