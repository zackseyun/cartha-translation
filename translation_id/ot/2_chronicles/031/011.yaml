  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: id
  text: Kemudian Hizkia memerintahkan agar kamar-kamar[a] disiapkan di rumah Yahweh, dan mereka pun menyiapkannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang-ruang” atau “gudang-gudang”. Kata Ibrani ini menunjuk pada kamar atau ruang dalam kompleks rumah Yahweh; fungsi penyimpanannya tampak dari konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Kemudian Hizkia berkata untuk menyiapkan kamar-kamar di rumah Yahweh, dan mereka menyiapkannya.” Dalam konteks ini, perkataan Hizkia berfungsi sebagai instruksi kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: memerintahkan
  rationale: Secara harfiah berarti “berkata”, tetapi konstruksi dengan infinitif לְהָכִין dalam konteks tindakan raja menyampaikan suatu instruksi; “memerintahkan agar” mengungkapkan daya pragmatisnya secara wajar.
- source_word: יְחִזְקִיָּהוּ
  choice: Hizkia
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: לְהָכִין
  choice: disiapkan
  rationale: Bentuk Hifil dari כון berarti membuat siap atau menyiapkan. Bentuk pasif setelah “memerintahkan agar” alami dalam bahasa Indonesia dan tidak menambahkan pelaksana yang tidak dinyatakan.
- source_word: לְשָׁכוֹת
  choice: kamar-kamar
  rationale: Menunjuk pada ruang-ruang dalam kompleks rumah ibadah. “Kamar-kamar” mempertahankan arti arsitektural tanpa menjadikan fungsi penyimpanan yang tersirat oleh konteks sebagai bagian eksplisit dari nomina.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani “rumah Yahweh”, yaitu sebutan bagi tempat ibadah tersebut, tanpa menggantinya dengan istilah penjelas “Bait Allah” atau “bait Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: וַיָּכִינוּ
  choice: dan mereka pun menyiapkannya
  rationale: Subjek jamak dinyatakan oleh verba Ibrani, sedangkan objeknya tersirat dan merujuk pada kamar-kamar. Klitik “-nya” membuat hubungan itu alami dalam bahasa Indonesia; “pun” menandai bahwa perintah tersebut dilaksanakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” adalah penggantian tradisional dengan gelar.
- issue: Daya ujar וַיֹּאמֶר dalam instruksi kerajaan
  choice: memerintahkan agar
  alternative: berkata agar
  rationale: Arti leksikal dasarnya ialah “berkata”, tetapi infinitif yang mengikutinya dan konteks raja yang mengatur penyiapan kamar memberi ujaran itu fungsi instruksi. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum. Ungkapan “rumah Yahweh” mempertahankan citra teks Ibrani, sementara dua catatan kaki mencatat rentang arti שָׁכוֹת dan bentuk harfiah וַיֹּאמֶר.
