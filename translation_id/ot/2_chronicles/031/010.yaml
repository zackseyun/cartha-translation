source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: id
  text: Azarya, imam kepala dari keluarga Zadok, berkata kepadanya, “Sejak mereka mulai membawa sumbangan[a] ke dalam rumah Yahweh, kami makan sampai kenyang dan masih banyak yang tersisa. Sebab Yahweh telah memberkati umat-Nya, dan yang tersisa ialah kelimpahan besar ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan”; istilah Ibrani ini menunjuk pada pemberian yang dikhususkan untuk penggunaan kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: imam kepala
  rationale: Secara harfiah berarti imam yang menjadi kepala atau pemimpin. Pilihan ini mempertahankan kedudukan kepemimpinan tanpa memasukkan gelar teknis lain yang tidak dinyatakan secara eksplisit.
- source_word: לְבֵית צָדוֹק
  choice: dari keluarga Zadok
  rationale: Kata בֵּית di sini menunjuk pada garis keluarga atau kaum imam Zadok; 'dari keluarga Zadok' alami dan jelas dalam bahasa Indonesia modern.
- source_word: מֵהָחֵל
  choice: Sejak orang mulai
  rationale: Bentuk infinitif sesudah מִן menandai titik awal suatu tindakan. Subjek umum 'orang' menyampaikan konstruksi Ibrani yang tidak menyebut pelaku secara khusus.
- source_word: הַתְּרוּמָה
  choice: sumbangan
  rationale: Istilah ini menunjuk pada pemberian yang dikhususkan bagi penggunaan kudus. 'Sumbangan' sesuai dengan konteks bahan persediaan yang dibawa, sedangkan kemungkinan 'persembahan' dicatat dalam catatan kaki.
- source_word: לָבִיא בֵית יְהוָה
  choice: membawa ... ke dalam rumah Yahweh
  rationale: Ungkapan ini menggambarkan tindakan membawa sumbangan masuk ke rumah atau kompleks bait Yahweh; 'ke dalam' mempertahankan arah geraknya.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: kami telah makan sampai kenyang
  rationale: Pasangan bentuk verbal ini menyatakan bahwa mereka makan dan memperoleh kecukupan. Ungkapan Indonesia ini alami serta mempertahankan hasil berupa rasa kenyang.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: dan masih tersisa sangat banyak
  rationale: Kata kerja יתר dan ungkapan עַד־לָרֹב menyatakan sisa dalam jumlah besar. Terjemahan ini mempertahankan penekanan pada surplus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: telah memberkati umat-Nya
  rationale: Bentuk perfektif menyatakan berkat yang telah menghasilkan kelimpahan yang sedang terlihat.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: dan yang tersisa adalah kelimpahan yang besar ini
  rationale: הַנּוֹתָר berfungsi substantival, 'yang tersisa', sedangkan הָמוֹן dalam konteks persediaan berarti jumlah atau kelimpahan besar, bukan kerumunan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian sebagai nama, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan ujaran Ibrani yang berulang diringkas menjadi 'menjawabnya' agar alami dalam bahasa Indonesia, sementara isi dan hubungan sebab-akibat tetap dipertahankan. Penanda catatan kaki ditempatkan sesudah istilah yang benar-benar dijelaskan.
