base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: id
  text: Bagi keturunan Harun[a], para imam yang berada di tanah padang rumput di sekitar kota-kota mereka[b], di setiap kota[c] ada orang-orang yang disebut namanya[d] untuk memberikan bagian kepada setiap laki-laki di antara para imam dan kepada setiap orang dari kaum Lewi yang terdaftar menurut silsilah[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Harun.” Dalam ungkapan silsilah, sebutan ini dapat mencakup keturunan Harun pada generasi-generasi berikutnya.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tanah bersama” atau “tanah terbuka” kota-kota mereka. Istilah Ibraninya menunjuk pada tanah di sekeliling kota yang sering digunakan sebagai padang penggembalaan.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “di setiap kota dan kota,” sebuah ungkapan Ibrani yang berarti “di tiap-tiap kota.”'
    reason: lexical_alternative
  - marker: d
    text: Dapat juga diterjemahkan “yang dicatat namanya” atau “yang ditunjuk dengan menyebut nama mereka.” Ungkapan Ibraninya menunjukkan bahwa orang-orang tersebut diidentifikasi secara resmi.
    reason: lexical_alternative
  - marker: e
    text: Maksudnya, setiap orang dari kaum Lewi yang terdaftar dalam catatan silsilah.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: Adapun bagi keturunan Harun, yaitu para imam
  rationale: בני secara harfiah berarti 'anak-anak', tetapi dalam konteks silsilah mencakup keturunan pada generasi-generasi kemudian. 'Keturunan Harun' menyampaikan maksud genealogisnya secara alami, sedangkan frasa aposisional 'yaitu para imam' mempertahankan identifikasi dalam teks.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: di tanah penggembalaan di sekitar kota-kota mereka
  rationale: מגרש menunjuk pada tanah terbuka atau tanah bersama di sekeliling kota, yang lazim digunakan untuk penggembalaan. Pilihan ini menyatakan lokasi dan fungsi tanah tersebut dengan bahasa Indonesia yang jelas.
- source_word: בְּכָל עִיר וָעִיר
  choice: di setiap kota
  rationale: Pengulangan harfiah 'kota dan kota' merupakan ungkapan distributif yang berarti setiap kota tanpa kecuali. 'Di setiap kota' alami dan tetap mencakup seluruh kota yang dimaksud.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: ada orang-orang yang ditetapkan berdasarkan nama
  rationale: Ungkapan ini menunjukkan bahwa orang-orang tertentu diidentifikasi secara resmi menurut nama. 'Ditetapkan berdasarkan nama' mempertahankan nuansa administratif tanpa memastikan apakah tindakan itu terutama berupa penunjukan atau pencatatan.
- source_word: לָתֵת מָנוֹת
  choice: untuk memberikan bagian
  rationale: מנות adalah bagian atau jatah dari persediaan yang dibagikan. 'Memberikan bagian' ringkas dan sesuai dengan konteks pembagian dalam pasal ini.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: kepada setiap laki-laki di antara para imam
  rationale: זכר secara khusus berarti orang berjenis kelamin laki-laki. Frasa 'di antara para imam' menyampaikan hubungan partitif secara alami.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: dan kepada setiap orang yang tercatat menurut silsilah di antara orang Lewi
  rationale: Bentuk התיחש menunjuk pada pencatatan atau pendaftaran berdasarkan silsilah. Terjemahan ini mempertahankan unsur administratif-genealogisnya.
