    rationale: Frasa Ibrani itu menyatakan bahwa orang-orang tersebut ditentukan, ditunjuk, atau dicatat secara spesifik dengan nama. Dalam bahasa Indonesia, “berdasarkan nama” lazimnya berarti nama menjadi dasar suatu keputusan. “Yang disebut namanya” mempertahankan unsur identifikasi resmi tanpa memaksakan apakah tindakan itu terutama penunjukan atau pencatatan.
  - severity: low
    issue: Frasa tentang orang Lewi dapat dibuat lebih alami.
    rationale: “Setiap orang dari kaum Lewi yang terdaftar menurut silsilah” menyatakan cakupan dan hubungan genealogis secara lebih jelas dalam bahasa Indonesia baku.
