  source_fidelity: 'Makna utama tersampaikan dengan baik: keenam nama, hubungan mereka dengan pejabat yang disebut pada ayat sebelumnya, lokasi di kota-kota imam, pelaksanaan tugas secara setia, penerima dari kalangan sesama imam, pembagian menurut kelompok, serta cakupan ''yang besar maupun yang kecil''. Namun, ''jatah'' menambahkan nuansa alokasi yang agak percakapan dan lebih spesifik daripada verba Ibrani ''memberi''; ''bagian'' lebih netral dalam konteks distribusi yang sudah jelas dari ayat-ayat sekitar.'
  naturalness: Susunan dua kalimat baku dan mudah dibaca. 'Dengan setia mereka membagikan ...' merupakan cara yang alami untuk menyatakan infinitif tujuan dengan keterangan cara dalam bahasa Indonesia. 'Di bawah wewenangnya ada' dapat diterima dalam ragam formal.
  terminology: Alih aksara nama-nama sesuai pemakaian Alkitab Indonesia yang lazim. 'Para imam', 'saudara-saudara mereka', dan 'kelompok tugas' sesuai konteks kelembagaan imam. Ungkapan 'yang besar maupun yang kecil' dengan tepat mempertahankan keluasan idiom Ibrani tanpa membatasi artinya pada usia.
