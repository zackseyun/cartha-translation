base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: id
  text: Di bawah wewenangnya[a] ada Eden, Minyamin, Yesua, Semaya, Amarya, dan Sekhanya di kota-kota para imam. Dengan setia mereka membagikan bagian kepada saudara-saudara mereka[b] menurut kelompok tugas, baik kepada yang besar maupun yang kecil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di sisinya” atau “di bawah tanggung jawabnya”; ungkapan Ibrani ini dapat menyatakan perantaraan, pengawasan, atau wewenang.'
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara mereka” di sini adalah sesama anggota komunitas imam.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: Di bawah wewenangnya
  rationale: Ungkapan Ibrani עַל־יָד dapat menyatakan perantaraan, pengawasan, atau wewenang. Dalam konteks administrasi ini, pilihan tersebut menyampaikan bahwa orang-orang yang disebut bekerja di bawah pengawasan pejabat pada ayat sebelumnya.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: Eden, Minyamin, Yesua, Semaya, Amarya, dan Sekhanya
  rationale: Nama-nama pribadi dialihaksarakan dalam bentuk yang wajar bagi pembaca Alkitab berbahasa Indonesia.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: di kota-kota para imam
  rationale: Terjemahan langsung dan alami dari konstruksi genetif Ibrani.
- source_word: בֶּאֱמוּנָה
  choice: Dengan setia
  rationale: Dalam konteks ini אֱמוּנָה menggambarkan pelaksanaan tugas secara dapat dipercaya dan setia.
- source_word: לָתֵת
  choice: membagikan jatah
  rationale: Secara harfiah berarti 'memberikan', tetapi konteksnya ialah penyaluran bagian yang telah ditetapkan; 'membagikan jatah' membuat fungsi administratif itu jelas.
- source_word: לַאֲחֵיהֶם
  choice: kepada saudara-saudara mereka
  rationale: Mempertahankan metafora kekerabatan dalam bahasa Ibrani; konteks menunjukkan sesama anggota komunitas imam.
- source_word: בְּמַחְלְקוֹת
  choice: menurut kelompok tugas
  rationale: מַחְלְקוֹת menunjuk pada kelompok atau giliran pelayanan yang teratur, bukan sekadar pembagian barang.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: baik kepada yang besar maupun yang kecil
  rationale: Mempertahankan ungkapan Ibrani dan cakupannya yang dapat menyangkut kedudukan atau usia tanpa mempersempitnya secara tidak perlu.
theological_decisions:
- issue: Cakupan ungkapan כַּגָּדוֹל כַּקָּטָן
  choice: baik kepada yang besar maupun yang kecil
  alternative: baik kepada yang tua maupun yang muda
  rationale: Teks Ibrani secara harfiah menyebut 'besar' dan 'kecil'. Karena ungkapan itu dapat menunjuk pada kedudukan, usia, atau inklusi menyeluruh, terjemahan mempertahankan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat dipecah menjadi dua agar daftar nama dan tugas administratifnya terbaca alami. Semua penanda catatan kaki muncul dalam teks utama.
