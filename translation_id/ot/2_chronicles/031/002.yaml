revisions:
- from: Hizkia menetapkan kelompok-kelompok para imam dan orang Lewi menurut kelompok mereka masing-masing[a], setiap orang sesuai dengan tugasnya, baik para imam maupun orang Lewi, untuk mempersembahkan kurban bakaran dan kurban damai[b], serta untuk melayani, mengucap syukur, dan memuji di gerbang-gerbang perkemahan-perkemahan Yahweh.[c]
  to: 'Hizkia menetapkan kelompok-kelompok imam dan orang Lewi menurut pembagian mereka masing-masing[a], setiap orang sesuai dengan tugasnya: para imam dan orang Lewi bagi kurban bakaran dan kurban damai[b], untuk melayani, mengucap syukur, dan memuji di gerbang-gerbang perkemahan Yahweh[c].'
