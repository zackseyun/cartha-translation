  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: id
  text: 'Hizkia menetapkan kelompok-kelompok imam dan orang Lewi menurut pembagian mereka masing-masing[a], setiap orang sesuai dengan tugasnya: para imam dan orang Lewi bagi kurban bakaran dan kurban damai[b], untuk melayani, mengucap syukur, dan memuji di gerbang-gerbang perkemahan Yahweh[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “giliran-giliran” atau “pembagian-pembagian tugas”; yang dimaksud ialah kelompok imam dan orang Lewi yang diatur untuk menjalankan tugas mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban persekutuan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “gerbang-gerbang perkemahan-perkemahan Yahweh.” Karena konteksnya adalah ibadah di Bait Allah, sebagian orang memahaminya sebagai “pelataran-pelataran Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: menetapkan
  rationale: Dalam konteks pengaturan ibadah, verba ini menyatakan tindakan menempatkan atau menugaskan orang dalam susunan resmi, bukan sekadar membuat mereka berdiri.
- source_word: מַחְלְקוֹת
  choice: kelompok-kelompok
  rationale: Kata ini menunjuk pada kelompok imam dan orang Lewi yang diatur menurut giliran atau pembagian tugas. Pilihan ini lebih mudah dipahami pembaca Indonesia masa kini daripada istilah teknis yang kurang lazim.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: setiap orang sesuai dengan tugasnya
  rationale: Ungkapan distributif Ibrani dipertahankan secara alami. Dalam konteks ini, yang dimaksud ialah para pemegang jabatan imam dan Lewi.
- source_word: לְעֹלָה
  choice: untuk mempersembahkan kurban bakaran
  rationale: Kata Ibrani menunjuk pada kategori kurban yang dibakar seluruhnya. Verba 'mempersembahkan' dibuat tersurat agar hubungan tujuan dalam kalimat panjang ini jelas dalam bahasa Indonesia.
- source_word: וְלִשְׁלָמִים
  choice: dan kurban damai
  rationale: Pilihan ini mempertahankan kaitan leksikal dengan gagasan damai atau keutuhan tanpa membatasi maknanya hanya pada unsur persekutuan.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Dalam konteks rumah ibadah, kata ini menyatakan pelaksanaan pelayanan kudus; 'melayani' tetap alami dan tidak memasukkan istilah gerejawi yang lebih kemudian.
- source_word: וּלְהוֹדוֹת
  choice: mengucap syukur
  rationale: Dalam rangkaian dengan tindakan memuji, bentuk verba ini paling wajar menunjuk pada ungkapan syukur liturgis.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: di gerbang-gerbang perkemahan-perkemahan Yahweh
  rationale: Terjemahan ini mempertahankan bentuk jamak 'gerbang-gerbang' dan 'perkemahan-perkemahan' serta citra sumber yang tidak lazim, alih-alih menafsirkannya langsung sebagai pelataran Bait Allah.
theological_decisions:
- issue: Makna kategori kurban שְׁלָמִים
  choice: kurban damai
  alternative: kurban persekutuan
  rationale: Kata sumber dapat dikaitkan dengan damai, kesejahteraan, keutuhan, dan persekutuan. 'Kurban damai' menjaga keluasan kategori itu, sedangkan alternatif dicatat dalam catatan kaki.
- issue: Ungkapan מַחֲנוֹת יְהוָה dalam konteks Bait Allah
  choice: perkemahan-perkemahan Yahweh
  alternative: pelataran-pelataran Yahweh
  rationale: Walaupun ungkapan harfiahnya tidak lazim dalam konteks Bait Allah, bentuk jamak dan citra 'perkemahan' benar-benar terdapat dalam teks Ibrani. Terjemahan utama tidak menyelesaikan ketegangan itu secara diam-diam.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri ilahi ditampilkan sebagai 'Yahweh' agar dibedakan dari gelar 'Tuhan' dan agar selaras dengan bukti sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat Ibrani yang panjang dipertahankan sejauh masih jelas, sementara 'untuk mempersembahkan' dibuat eksplisit demi kelancaran. Bentuk jamak yang tidak lazim pada frasa penutup sengaja dipertahankan dan dijelaskan melalui catatan kaki.
