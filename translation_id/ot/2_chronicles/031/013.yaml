base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: id
  text: Yehiel, Azazya, Nahat, Asael, Yerimot, Yozabad, Eliel, Yismakhya, Mahat, dan Benaya adalah para pengawas di bawah wewenang[a] Konanya dan Simei, saudaranya, berdasarkan penugasan[b] Raja Hizkia dan Azarya, pemimpin rumah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari tangan Konanya dan Simei, saudaranya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “atas perintah” atau “di bawah pengawasan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: para pengawas
  rationale: Kata ini menunjuk pada orang-orang yang diberi tanggung jawab administratif. “Para pengawas” wajar dalam bahasa Indonesia dan sesuai dengan konteks pengelolaan persembahan di rumah Allah.
- source_word: מִיַּד
  choice: di bawah wewenang
  rationale: Secara harfiah berarti “dari/oleh tangan”, tetapi di sini merupakan idiom yang menyatakan kendali atau supervisi. “Di bawah wewenang” memperjelas jenjang tanggung jawab tanpa melebih-lebihkan jabatan.
- source_word: אָחִיו
  choice: saudaranya
  rationale: 'Pronomina tunggal dalam bahasa Ibrani paling wajar mengacu kepada Konanya: Simei adalah saudaranya.'
- source_word: בְּמִפְקַד
  choice: atas penugasan
  rationale: Kata ini dapat menyatakan penugasan, perintah, atau pengawasan. “Atas penugasan” mempertahankan gagasan pemberian mandat resmi sekaligus tidak menutup alternatif semantis lainnya.
- source_word: נְגִיד
  choice: pemimpin
  rationale: Istilah ini menunjuk pada seorang pemimpin atau pejabat utama. “Pemimpin” jelas dan tidak memasukkan pangkat kerajaan atau hierarki keimaman yang tidak dinyatakan teks.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ini merupakan sebutan yang dapat dipahami untuk bait Allah dan mempertahankan ungkapan sumber.
- source_word: יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ
  choice: Yehiel, Azazya, Nahat, Asael, Yerimot, Yozabad, Eliel, Yismakhya, Mahat, Benaya, Konanya, Simei, Hizkia, Azarya
  rationale: Nama-nama ditransliterasikan dalam bentuk yang sesuai dengan kebiasaan Alkitab bahasa Indonesia, dengan ejaan yang tetap cukup dekat pada bentuk Ibrani.
theological_decisions:
- issue: Sifat gelar administratif dalam rumah Allah
  choice: Menggunakan istilah kelembagaan biasa, yaitu “para pengawas” dan “pemimpin”.
  alternative: Menggunakan istilah berpangkat lebih tinggi seperti “para pembesar”, “penguasa”, atau “pangeran”.
  rationale: Ayat ini menjelaskan susunan administrasi dan rantai wewenang. Pilihan ini tidak memasukkan hierarki keimaman atau kedudukan kerajaan yang tidak dituntut oleh teks.
- issue: Hubungan Hizkia dan Azarya dengan pengangkatan para pengawas
  choice: “Atas penugasan” keduanya.
  alternative: “Atas perintah” atau “di bawah pengawasan” keduanya.
  rationale: בְּמִפְקַד memiliki rentang makna yang mencakup penugasan, perintah, dan pengawasan. Teks utama memakai ungkapan netral, sedangkan catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar nama dipertahankan, sementara idiom Ibrani dialihkan secara alami. Penanda catatan kaki ditempatkan tepat sesudah frasa yang diterangkannya, bukan mengikuti posisi penanda dalam lapisan konsultasi Inggris.
