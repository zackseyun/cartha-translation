base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: id
  text: Mereka membawa masuk persembahan khusus, persepuluhan, dan barang-barang kudus itu dengan setia. Atas semuanya itu, Konanya, orang Lewi itu, adalah pemimpin, dan Simei, saudaranya, adalah orang kedua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wakil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Mereka membawa masuk
  rationale: Bentuk Hifil dari בוא berarti membawa atau membawa masuk; konteks ruang penyimpanan Bait Allah mendukung ungkapan alami 'membawa masuk' tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: הַתְּרוּמָה
  choice: persembahan khusus
  rationale: תְּרוּמָה menunjuk pada sumbangan yang dipisahkan bagi penggunaan kudus. 'Persembahan khusus' jelas dalam bahasa Indonesia dan tidak memakai istilah ritual yang terlalu teknis.
- source_word: הַמַּעֲשֵׂר
  choice: persepuluhan
  rationale: מַעֲשֵׂר adalah istilah baku bagi sepersepuluh yang diberikan kepada Allah; 'persepuluhan' merupakan padanan Indonesia yang mapan dan tepat.
- source_word: הַקֳּדָשִׁים
  choice: benda-benda kudus
  rationale: Bentuk jamak קֹדֶשׁ di sini menunjuk pada berbagai benda yang dikhususkan bagi penggunaan sakral. Terjemahan ini dekat dengan bentuk sumber dan tetap mudah dipahami.
- source_word: בֶּאֱמוּנָה
  choice: dengan setia
  rationale: Dalam konteks pengelolaan, אֱמוּנָה menyatakan kesetiaan, kejujuran, atau sikap dapat dipercaya. 'Dengan setia' mempertahankan keluasan makna itu.
- source_word: וַעֲלֵיהֶם נָגִיד
  choice: menjadi pemimpin yang mengawasi semuanya
  rationale: Gabungan ini menyatakan bahwa Konanya memegang kedudukan pemimpin atas barang-barang atau urusan yang baru disebutkan. Rumusan tersebut alami dalam bahasa Indonesia dan tidak mengesankan kekuasaan kerajaan.
- source_word: כונניהו
  choice: Konanya
  rationale: Nama ini dialihaksarakan mengikuti bentuk yang lazim dan mudah dibaca dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַלֵּוִי
  choice: orang Lewi itu
  rationale: Artikel dalam bahasa Ibrani dipertahankan secara alami melalui 'itu', yang mengidentifikasi Konanya berdasarkan kedudukannya sebagai orang Lewi.
- source_word: וְשִׁמְעִי אָחִיהוּ
  choice: dan Simei, saudaranya
  rationale: אָחִיהוּ secara wajar berarti saudara laki-lakinya; konteks tidak menuntut arti yang lebih luas seperti kerabat.
- source_word: מִשְׁנֶה
  choice: menjadi orang kedua
  rationale: מִשְׁנֶה menunjuk pada pejabat berperingkat kedua atau wakil. Terjemahan utama mempertahankan bentuk ringkas sumber, sementara arti administratif yang lebih eksplisit dicatat dalam catatan kaki.
