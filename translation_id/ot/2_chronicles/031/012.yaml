  to: Mereka membawa masuk persembahan khusus, persepuluhan, dan barang-barang kudus itu dengan setia. Atas semuanya itu, Konanya, orang Lewi itu, adalah pemimpin, dan Simei, saudaranya, adalah orang kedua.[a]
