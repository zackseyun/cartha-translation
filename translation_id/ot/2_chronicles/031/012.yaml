  source_fidelity: 'Makna pokok tersampaikan dengan baik: barang-barang itu dibawa masuk dengan dapat dipercaya, Konanya orang Lewi bertanggung jawab atasnya, dan Simei adalah pejabat kedua. Namun, "menjadi pemimpin yang mengawasi semuanya" menambahkan nuansa perubahan status melalui "menjadi" dan memperluas objek pengawasan menjadi "semuanya", sedangkan teks Ibrani secara ringkas menyatakan bahwa Konanya adalah pemimpin atas "mereka/hal-hal itu".'
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. Susunan "Atas semuanya itu, ... menjadi pemimpin" lebih dekat pada struktur sumber dan tetap alami. Catatan kaki draf, "orang kedua dalam kepemimpinan," kurang idiomatis; "wakil" adalah alternatif yang lebih ringkas dan lazim.
  terminology: '"Persembahan khusus," "persepuluhan," "barang-barang kudus," dan "orang Lewi" merupakan padanan yang sesuai. Nama "Konanya" dan "Simei" sejalan dengan penggunaan Alkitab Indonesia yang lazim. "Pemimpin" memadai untuk נָגִיד dalam konteks administratif tanpa memberi kesan jabatan kerajaan.'
