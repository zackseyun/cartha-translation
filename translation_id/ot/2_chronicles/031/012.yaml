  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah menjadi dua agar jelas bagi pembaca umum. Istilah keagamaan yang telah mapan, seperti 'persepuluhan' dan 'orang Lewi', dipertahankan; frasa administratif dibuat alami tanpa menghilangkan ambiguitas mengenai apakah pengawasan itu terutama atas barang-barang atau seluruh pengelolaannya.
