  source_fidelity: 'Terjemahan pada dasarnya menangkap unsur-unsur utama: pencatatan silsilah, anak-anak kecil, istri, anak laki-laki dan perempuan, kesetiaan, serta pengudusan diri. Namun, “dan juga” menambahkan nuansa yang tidak dinyatakan oleh waw penghubung, “yakni seluruh umat” mengubah לְכָל קָהָל dari cakupan/preposisi menjadi penjelasan identifikatif, dan “sebagai orang-orang kudus” kurang langsung merepresentasikan nomina abstrak קֹדֶשׁ.'
