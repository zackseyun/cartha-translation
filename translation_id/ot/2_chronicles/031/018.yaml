base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: id
  text: dan untuk mendaftarkan menurut silsilah semua anak kecil mereka, istri-istri mereka, anak-anak lelaki mereka, dan anak-anak perempuan mereka, bagi seluruh jemaat; sebab dalam kesetiaan mereka, mereka menguduskan diri dalam kekudusan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: dan juga untuk mendaftarkan menurut silsilah
  rationale: Bentuk hitpael dari יחס dalam Tawarikh menunjuk pada pencatatan dalam daftar keluarga atau silsilah. Ungkapan ini mempertahankan unsur administratif dan genealogisnya.
- source_word: בְּכָל טַפָּם
  choice: semua anak kecil mereka
  rationale: טַף secara khusus menunjuk pada anak-anak yang masih kecil, bukan sekadar seluruh tanggungan atau rumah tangga.
- source_word: נְשֵׁיהֶם וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: istri, anak laki-laki, dan anak perempuan mereka
  rationale: Daftar rumah tangga ini memakai נָשִׁים dalam arti istri dan secara eksplisit membedakan anak laki-laki dari anak perempuan.
- source_word: לְכָל קָהָל
  choice: yakni seluruh umat
  rationale: קָהָל merujuk pada keseluruhan komunitas yang tercakup dalam pencatatan. 'Yakni' menyampaikan hubungan penjelas yang wajar dalam bahasa Indonesia tanpa memaksakan fungsi preposisi Ibrani yang secara harfiah kaku.
- source_word: בֶאֱמוּנָתָם
  choice: dalam kesetiaan mereka
  rationale: אֱמוּנָה dalam konteks tugas kudus ini terutama menyatakan kesetiaan atau keterandalan, bukan semata-mata iman batin.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: mereka menguduskan diri sebagai orang-orang kudus
  rationale: Terjemahan ini mempertahankan gagasan refleksif dari hitpael serta pengulangan akar kekudusan pada verba dan nomina, meskipun konstruksi Ibraninya dapat dipahami dengan beberapa nuansa.
theological_decisions:
- issue: Makna אֱמוּנָה dalam konteks ibadah dan administrasi
  choice: kesetiaan dalam menjalankan tanggung jawab kudus
  alternative: iman dalam arti keyakinan batin atau devosional
  rationale: Konteks pembagian bagi para imam dan orang Lewi serta keluarga mereka mendukung makna keterandalan atau kesetiaan, tanpa meniadakan keluasan semantis kata tersebut.
- issue: Nuansa יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: menguduskan diri sebagai orang-orang kudus
  alternative: menjaga diri tetap kudus; menguduskan diri dalam kekudusan
  rationale: Bahasa sumber menggabungkan verba refleksif dan nomina dari akar קדש. Pilihan utama mempertahankan penegasan ganda itu, sedangkan catatan kaki menyajikan kemungkinan nuansa lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar dibuat alami, sementara istilah 'menurut silsilah', 'kesetiaan', dan pengulangan gagasan kekudusan dipertahankan untuk mencerminkan rincian leksikal serta ketegangan teks Ibrani.
