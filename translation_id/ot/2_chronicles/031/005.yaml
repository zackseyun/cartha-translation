  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: id
  text: Ketika hal itu tersebar, keturunan Israel[a] membawa hasil pertama dari biji-bijian, anggur baru, minyak, madu[b], dan segala hasil ladang dalam jumlah besar. Mereka membawa persepuluhan dari segala sesuatu dalam jumlah besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; ungkapan Ibrani yang lazim untuk umat Israel secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks tertentu, “madu” dapat berarti cairan manis dari buah, misalnya sirup kurma, dan bukan hanya madu lebah.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: Ketika hal itu mulai tersebar
  rationale: Konstruksi ini menyatakan waktu, sedangkan פרץ menggambarkan sesuatu yang merebak atau tersebar. “Hal itu” mempertahankan keluasan makna דָּבָר tanpa memastikan apakah yang dimaksud ialah perintah, berita, atau perkara tersebut.
- source_word: הִרְבּוּ
  choice: membawa ... dalam jumlah besar
  rationale: Bentuk kausatif רבה menekankan banyaknya sumbangan. Kata kerja “membawa” dipahami dari konteks dan dinyatakan secara wajar dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini menunjuk secara kolektif kepada umat Israel. “Keturunan Israel” alami dalam bahasa Indonesia dan tetap dekat dengan citra hubungan keturunan dalam bahasa Ibrani.
- source_word: רֵאשִׁית
  choice: hasil pertama
  rationale: Dalam konteks persembahan, kata ini menunjuk kepada bagian pertama dari hasil panen yang dikhususkan.
- source_word: דָּגָן
  choice: gandum
  rationale: Dalam daftar hasil pertanian, istilah ini menunjuk pada biji-bijian pangan. “Gandum” merupakan padanan ringkas yang lazim dalam bahasa Indonesia Alkitabiah, meskipun istilah Ibraninya dapat mencakup serealia secara umum.
- source_word: תִּירוֹשׁ
  choice: anggur baru
  rationale: Istilah ini lazim menunjuk pada hasil anggur yang baru, bukan sekadar anggur dalam arti paling umum.
- source_word: יִצְהָר
  choice: minyak
  rationale: Kata ini biasanya mengacu pada minyak segar, terutama minyak zaitun, tetapi teks tidak perlu dibuat lebih khusus daripada sumbernya.
- source_word: דְבַשׁ
  choice: madu
  rationale: Padanan tradisional ini mempertahankan ketidakpastian apakah yang dimaksud adalah madu lebah atau cairan manis dari buah.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: dan segala hasil ladang
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh serta konteks pertanian dari frasa Ibrani.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: Mereka juga membawa persepuluhan dari segala sesuatu
  rationale: מַעֲשֵׂר adalah istilah teknis untuk persepuluhan, dan הַכֹּל menegaskan keseluruhan hasil yang menjadi dasarnya.
- source_word: לָ/רֹב
  choice: dalam jumlah besar
  rationale: Frasa ini menekankan banyaknya persepuluhan yang dibawa dan diterjemahkan secara idiomatis.
theological_decisions:
- issue: Ungkapan kolektif bergender בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Dalam konteks ini ungkapan maskulin tersebut berfungsi sebagai sebutan kolektif bagi umat Israel, bukan hanya bagi laki-laki. “Keturunan Israel” mempertahankan hubungan dengan nama leluhur tanpa menyempitkan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar daftar hasil pertanian dan penekanan pada banyaknya persepuluhan tetap jelas. Ambiguitas דָּבָר dan דְבַשׁ dipertahankan.
