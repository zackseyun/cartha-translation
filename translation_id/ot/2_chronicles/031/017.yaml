  text: וְ/אֵ֨ת הִתְיַחֵ֤שׂ הַ/כֹּהֲנִים֙ לְ/בֵ֣ית אֲבוֹתֵי/הֶ֔ם וְ/הַ֨/לְוִיִּ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑עְלָ/ה בְּ/מִשְׁמְרוֹתֵי/הֶ֖ם בְּ/מַחְלְקוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: id
  text: Pendaftaran silsilah para imam menurut kaum keluarga berdasarkan garis ayah mereka[a], serta pendaftaran orang-orang Lewi yang berusia dua puluh tahun ke atas, dalam tugas dan kelompok-kelompok mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah ayah-ayah mereka.” Ungkapan ini menunjuk pada kelompok keluarga menurut garis ayah yang digunakan untuk pencatatan dan pengaturan pelayanan.
    reason: cultural_note
  - marker: b
    text: Bahasa Ibrani pada ayat ini padat dan eliptis. Frasa ini juga dapat diterjemahkan, “sesuai tugas-tugas dan kelompok-kelompok mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: pendaftaran silsilah
  rationale: Bentuk ini mengacu pada pencatatan resmi berdasarkan garis keturunan. Karena susunan Ibrani padat dan eliptis setelah וְאֵת, frasa nominal ini menyampaikan makna administratif tanpa menambahkan verba yang tidak dinyatakan.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku bagi golongan imam; bentuk jamak dan ketentuannya dinyatakan secara alami dalam bahasa Indonesia.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: menurut kaum keluarga leluhur mereka
  rationale: Ungkapan ini menunjuk pada kelompok keluarga patrilineal yang menjadi dasar pencatatan dan pengorganisasian resmi; pilihan ini lebih mudah dipahami daripada terjemahan harfiah 'rumah-rumah ayah mereka'.
- source_word: וְהַלְוִיִּם
  choice: sedangkan pendaftaran orang-orang Lewi
  rationale: Bahasa Ibrani melanjutkan secara eliptis gagasan pendaftaran silsilah dari klausa sebelumnya. Pengulangan 'pendaftaran' memperjelas kesejajaran tanpa mengubah isinya.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: bagi mereka yang berumur dua puluh tahun ke atas
  rationale: Menyampaikan rumusan batas usia Ibrani secara alami dan tepat dalam bahasa Indonesia modern.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: menurut tugas
  rationale: Nomina ini dapat menunjuk pada tanggung jawab, giliran jaga, atau penugasan pelayanan. Dalam konteks ini, 'tugas' mempertahankan cakupan yang cukup luas.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: kelompok pelayanan mereka
  rationale: Mengacu pada kelompok atau regu terorganisasi tempat orang Lewi menjalankan pelayanan. 'Kelompok pelayanan' lebih jelas bagi pembaca modern daripada sekadar 'bagian-bagian'.
