- from: Pendaftaran silsilah para imam dilakukan menurut kaum keluarga leluhur mereka[a], sedangkan pendaftaran orang-orang Lewi dilakukan bagi mereka yang berumur dua puluh tahun ke atas, menurut tugas dan kelompok pelayanan mereka.[b]
  to: Pendaftaran silsilah para imam menurut kaum keluarga berdasarkan garis ayah mereka[a], serta pendaftaran orang-orang Lewi yang berusia dua puluh tahun ke atas, dalam tugas dan kelompok-kelompok mereka.[b]
  rationale: Revisi mempertahankan arti administratif dan elipsis sumber, sambil memperbaiki kelancaran bahasa Indonesia. Dua nomina terakhir diterjemahkan terpisah agar tugas/penugasan dan kelompok/divisi tidak disamakan. Catatan kaki diperjelas dan jangkar tetap dipertahankan.
