language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ כָּ/זֹ֛את יְחִזְקִיָּ֖הוּ בְּ/כָל יְהוּדָ֑ה וַ/יַּ֨עַשׂ הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ וְ/הָ֣/אֱמֶ֔ת לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: id
  text: Hizkia melakukan semuanya itu di seluruh Yehuda. Ia melakukan apa yang baik, benar, dan setia[a] di hadapan Yahweh, Allahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sesuai dengan kebenaran.” Kata Ibrani אֱמֶת dapat berarti kebenaran, keterandalan, atau kesetiaan; di sini kata itu menggambarkan perilaku yang setia atau dapat dipercaya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: melakukan semuanya itu
  rationale: Ungkapan ini merangkum berbagai pembaruan dan pengaturan yang disebut sebelumnya. “Semuanya itu” menyampaikan daya rujuk bentuk demonstratif Ibrani secara alami.
- source_word: בְּכָל יְהוּדָה
  choice: di seluruh Yehuda
  rationale: Konstruksi ב dengan כָּל dan nama tempat menyatakan cakupan di seluruh wilayah Yehuda.
- source_word: הַטּוֹב
  choice: apa yang baik
  rationale: Kata sifat dengan artikel ini dipakai secara substantival dan menunjuk pada tindakan yang baik.
- source_word: הַיָּשָׁר
  choice: benar
  rationale: Dalam konteks etis, יָשָׁר berarti lurus atau benar secara moral; “benar” paling alami dalam bahasa Indonesia modern.
- source_word: הָאֱמֶת
  choice: setia
  rationale: אֱמֶת dapat berarti kebenaran, keterandalan, atau kesetiaan. Dalam rangkaian sifat etis ini, “setia” mengungkapkan perilaku yang dapat dipercaya, sambil mempertahankan alternatif leksikal dalam catatan kaki.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan tindakan yang dilakukan dalam kehadiran dan penilaian Allah; “di hadapan” mempertahankan kedua nuansa tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Akhiran pronominal maskulin tunggal merujuk kepada Hizkia dan menyatakan hubungan pribadinya dengan Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa etis הָאֱמֶת
  choice: setia
  alternative: benar; sesuai dengan kebenaran
  rationale: Dalam konteks perilaku, kata ini dapat menunjuk pada kesetiaan atau keterandalan, tetapi kemungkinan arti “benar” tetap dinyatakan dalam catatan kaki agar ambiguitas sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua klausa dipisahkan menjadi dua kalimat agar alami dan mudah dipahami, sedangkan pengulangan kata kerja dalam teks Ibrani tetap dipertahankan. Nama “Hizkia” dan “Yehuda” mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
