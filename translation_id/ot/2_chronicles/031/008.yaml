  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani dengan tepat: Hizkia dan para pejabat datang, melihat tumpukan-tumpukan itu, lalu memberkati Yahweh dan umat-Nya, Israel. Bentuk jamak pada הָעֲרֵמוֹת dipertahankan. Rujukan utama akhiran dalam עַמּוֹ secara wajar dipahami sebagai Yahweh, sambil mencatat kemungkinan rujukan kepada Hizkia.'
