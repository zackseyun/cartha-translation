id: 2CH.31.8
reference: 2 Chronicles 31:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ יְחִזְקִיָּ֣הוּ וְ/הַ/שָּׂרִ֔ים וַ/יִּרְא֖וּ אֶת הָ/עֲרֵמ֑וֹת וַֽ/יְבָרֲכוּ֙ אֶת יְהוָ֔ה וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: id
  text: Ketika Hizkia dan para pejabat datang dan melihat tumpukan-tumpukan itu, mereka memberkati Yahweh dan umat-Nya, Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “rakyatnya, yaitu Israel,” jika akhiran “-nya” dipahami merujuk kepada Hizkia, bukan kepada Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Bentuk naratif dari בוא paling wajar diterjemahkan dengan verba lampau kontekstual "datang" dalam bahasa Indonesia.
- source_word: יְחִזְקִיָּהוּ
  choice: Hizkia
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְהַשָּׂרִים
  choice: dan para pejabat
  rationale: שׂרים menunjuk kepada para pemimpin atau pejabat; "para pejabat" jelas dan sesuai dengan konteks pemerintahan.
- source_word: וַיִּרְאוּ
  choice: dan melihat
  rationale: ראה di sini menyatakan persepsi visual secara langsung.
- source_word: הָעֲרֵמוֹת
  choice: tumpukan-tumpukan itu
  rationale: Bentuk jamak עֲרֵמוֹת merujuk pada beberapa tumpukan hasil persembahan yang telah disebut dalam konteks; pengulangan nomina mempertahankan gambaran konkret dan penanda "itu" mewakili keartikelaan Ibrani.
- source_word: וַיְבָרֲכוּ
  choice: mereka memberkati
  rationale: ברך dengan Yahweh sebagai objek berarti mengucapkan berkat atau pujian kepada-Nya. "Memberkati" mempertahankan hubungan leksikal sumber tanpa meniadakan nuansa memuji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri "Yahweh", bukan diganti dengan gelar.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: umat-Nya, Israel
  rationale: Akhiran pronominal pada עַמּוֹ paling mungkin merujuk kepada Yahweh, sedangkan "Israel" menjelaskan identitas umat tersebut.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam עַמּוֹ ("umat-Nya")
  choice: 'Akhiran dipahami merujuk kepada Yahweh: "umat-Nya, Israel."'
  alternative: 'Akhiran mungkin merujuk kepada Hizkia: "rakyatnya, yaitu Israel."'
  rationale: Yahweh adalah anteseden terdekat, dan penyebutan Israel sebagai umat Yahweh sesuai dengan idiom perjanjian yang umum. Namun, secara gramatikal rujukan kepada Hizkia masih mungkin, sehingga alternatif itu dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur naratif Ibrani dengan wajar. Kapitalisasi pada "-Nya" memperjelas bacaan utama bahwa akhiran tersebut merujuk kepada Yahweh, sementara kemungkinan lain dipertahankan dalam catatan kaki.
