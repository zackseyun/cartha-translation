  terminology: “Hizkia,” “para pejabat,” “Yahweh,” dan “umat-Nya, Israel” konsisten dengan register Alkitab Indonesia modern dan keputusan terminologis yang diberikan. “Memberkati Yahweh” mempertahankan pilihan leksikal untuk ברך; dalam konteks ini pembaca dapat memahami nuansa memuji Allah. Catatan kaki secara memadai menjaga ambiguitas anteseden akhiran tanpa memaksakan pembacaan alternatif.
