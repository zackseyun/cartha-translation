id: 2CH.31.21
reference: 2 Chronicles 31:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/כָֽל מַעֲשֶׂ֞ה אֲשֶׁר הֵחֵ֣ל בַּ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים וּ/בַ/תּוֹרָה֙ וּ/בַ/מִּצְוָ֔ה לִ/דְרֹ֖שׁ לֵֽ/אלֹהָ֑י/ו בְּ/כָל לְבָב֥/וֹ עָשָׂ֖ה וְ/הִצְלִֽיחַ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: id
  text: Dalam setiap pekerjaan yang dimulainya dalam pelayanan rumah Allah, dalam hukum[a] dan perintah, untuk mencari[b] Allahnya, ia melakukannya dengan segenap hati[d] dan berhasil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pengajaran” (Ibrani: torah).'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “meminta petunjuk kepada.” Kata Ibrani ini dapat berarti mencari maupun meminta petunjuk atau bertanya.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “menjadi makmur.”'
    reason: lexical_alternative
  - marker: d
    text: Frasa ini juga dapat dipahami sebagai “untuk mencari Allahnya dengan segenap hati.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה אֲשֶׁר הֵחֵל
  choice: Dalam setiap pekerjaan yang dimulainya
  rationale: מַעֲשֶׂה mencakup pekerjaan, perbuatan, atau kegiatan; “pekerjaan” sesuai dengan konteks reformasi dan administrasi Hizkia. הֵחֵל diterjemahkan langsung sebagai “dimulainya”.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: dalam pelayanan rumah Allah
  rationale: עֲבוֹדָה dapat menunjuk pada pekerjaan maupun pelayanan ibadah. “Pelayanan rumah Allah” mempertahankan keluasan makna itu tanpa membatasinya hanya pada ritual imam.
- source_word: וּבַתּוֹרָה
  choice: dalam hukum
  rationale: תּוֹרָה dapat berarti hukum atau pengajaran. Dalam konteks reformasi kerajaan, “hukum” paling sesuai, sedangkan “pengajaran” dicatat sebagai alternatif.
- source_word: וּבַמִּצְוָה
  choice: dan perintah
  rationale: Bentuk tunggal מִצְוָה dipertahankan sebagai “perintah”; kata ini dapat pula berfungsi secara kolektif.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: untuk mencari Allahnya
  rationale: דרשׁ ketika berobjek Allah dapat berarti mencari, meminta petunjuk, atau bertanya kepada-Nya. “Mencari” mempertahankan motif penting dalam Kitab Tawarikh tanpa meniadakan nuansa meminta petunjuk.
- source_word: בְּכָל לְבָבוֹ עָשָׂה
  choice: ia melakukannya dengan segenap hati
  rationale: Urutan dan aksentuasi Masoret mendukung pengaitan “dengan segenap hati” dengan tindakan yang dilakukan Hizkia. Kata ganti objek “-nya” membuat hubungan dengan “setiap pekerjaan” jelas dan alami dalam bahasa Indonesia.
- source_word: וְהִצְלִיחַ
  choice: dan berhasil
  rationale: Bentuk Hifil הצליח di sini dipakai secara intransitif dengan arti berhasil atau menjadi makmur. “Berhasil” paling langsung menyatakan hasil dari segala usahanya tanpa terutama menyiratkan kemakmuran materi.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks reformasi Hizkia
  choice: hukum
  alternative: pengajaran; Taurat
  rationale: Konteks menunjuk pada ketaatan normatif yang mengatur pelayanan rumah Allah. “Hukum” mempertahankan cakupan itu tanpa memastikan bahwa kata tersebut semata-mata merupakan nama diri bagi keseluruhan Taurat.
- issue: Makna mencari Allah dalam לִדְרֹשׁ לֵאלֹהָיו
  choice: mencari Allahnya
  alternative: meminta petunjuk kepada Allahnya; bertanya kepada Allahnya
  rationale: Dalam Kitab Tawarikh ungkapan ini sering menyatakan orientasi perjanjian dan pengabdian kepada Allah, tetapi verba tersebut juga dapat memuat gagasan meminta petunjuk. Alternatif itu dipertahankan dalam catatan kaki.
- issue: Kaitan frasa בְּכָל לְבָבוֹ
  choice: dikaitkan dengan “ia melakukannya”
  alternative: dikaitkan dengan “mencari Allahnya”
  rationale: Urutan kata dan aksentuasi Masoret mendukung pembacaan bahwa Hizkia melakukan semuanya dengan segenap hati. Namun, secara semantis frasa itu dapat dipahami sebagai menerangkan tindakannya mencari Allah; kemungkinan tersebut dicatat tanpa memaksakan penyelesaian.
- issue: Nuansa וְהִצְלִיחַ
  choice: berhasil
  alternative: menjadi makmur
  rationale: “Berhasil” sesuai dengan evaluasi atas pekerjaan Hizkia dan tidak mempersempit hasilnya menjadi kemakmuran material.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Struktur ayat dijaga cukup dekat dengan bahasa Ibrani, sementara objek “-nya” ditambahkan agar klausa “ia melakukannya” alami dan jelas. Istilah “rumah Allah” dipertahankan sebagai sebutan kontekstual bagi bait Allah.
