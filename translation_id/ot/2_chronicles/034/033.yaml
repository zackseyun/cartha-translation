id: 2CH.34.33
reference: 2 Chronicles 34:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: id
  text: Yosia menyingkirkan segala kekejian dari seluruh wilayah milik bani Israel,[a] dan ia membuat semua orang yang berada di Israel mengabdi kepada Yahweh, Allah mereka.[b] Sepanjang hidup Yosia, mereka tidak berpaling dari Yahweh, Allah nenek moyang mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dari semua negeri yang menjadi milik bani Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ia mengharuskan semua orang yang berada di Israel beribadah kepada Yahweh, Allah mereka.” Bentuk kata kerja Ibraninya bersifat kausatif.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “Allah para bapa mereka,” yaitu Allah yang disembah oleh para leluhur mereka.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּסַר
  choice: menyingkirkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan membuang atau menjauhkan sesuatu. “Menyingkirkan” alami dalam bahasa Indonesia dan sesuai dengan konteks pembaruan Yosia.
- source_word: הַתּוֹעֵבוֹת
  choice: segala kekejian
  rationale: Istilah ini menunjuk pada berbagai benda atau praktik yang sangat menjijikkan, khususnya dalam konteks penyembahan berhala. “Kekejian” mempertahankan daya kecaman religius dan moralnya.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: dari seluruh wilayah milik bani Israel
  rationale: Bentuk jamak אֲרָצוֹת dapat berarti negeri-negeri atau wilayah-wilayah. “Seluruh wilayah” lebih alami dalam bahasa Indonesia, sedangkan “milik bani Israel” mencerminkan konstruksi kepunyaan dalam bahasa Ibrani.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan baku Indonesia ini mempertahankan citra kekerabatan dari bentuk harfiah “anak-anak lelaki Israel” tanpa terdengar janggal.
- source_word: וַיַּעֲבֵד
  choice: ia membuat ... mengabdi
  rationale: 'Bentuk Hifil bersifat kausatif: Yosia secara aktif menyebabkan atau mengharuskan rakyat mengabdi. Rumusan ini mempertahankan daya kausatif tanpa menambahkan gagasan kekerasan fisik.'
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: semua orang yang berada di Israel
  rationale: Partisipel Nifal נִמְצָא secara harfiah berarti “yang ditemukan”, tetapi dalam konteks ini menunjuk kepada semua orang yang ada atau berada di Israel. Pilihan ini mencegah kesan bahwa mereka dicari lalu ditemukan.
- source_word: לַעֲבוֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: mengabdi kepada Yahweh, Allah mereka
  rationale: עבד dalam hubungan dengan Allah mencakup pelayanan dan ibadah. “Mengabdi” mempertahankan makna kesetiaan serta pelayanan yang lebih luas daripada kegiatan ritual saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: כָּל יָמָיו
  choice: Sepanjang hidup Yosia
  rationale: Secara harfiah ungkapan ini berarti “sepanjang hari-harinya” dan merujuk pada masa hidup atau pemerintahan Yosia. Menyebut namanya menghindari ketidakjelasan rujukan kata ganti dalam bahasa Indonesia.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: mereka tidak menyimpang dari mengikuti Yahweh
  rationale: Konstruksi ini menggambarkan tindakan berbalik atau menyimpang dari mengikuti seseorang. Terjemahan tersebut mempertahankan gambaran dan makna kesetiaan perjanjian.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: Ini adalah rumusan antargenerasi yang mengaitkan Yahweh dengan para pendahulu Israel. “Nenek moyang” merupakan padanan Indonesia yang alami untuk אֲבוֹת dalam konteks ini.
theological_decisions:
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan statusnya sebagai nama pribadi dalam teks sumber.
- issue: Daya kausatif tindakan pembaruan Yosia dalam וַיַּעֲבֵד
  choice: ia membuat semua orang ... mengabdi
  alternative: ia mengajak semua orang ... mengabdi
  rationale: Bentuk Hifil menunjukkan bahwa Yosia bukan sekadar mengajak, melainkan menyebabkan atau mengharuskan rakyat mengabdi. Terjemahan tidak melunakkan tindakan itu menjadi ajakan sukarela.
- issue: Cakupan makna עבד ketika objeknya adalah Yahweh
  choice: mengabdi
  alternative: beribadah
  rationale: “Mengabdi” mencakup ibadah sekaligus pelayanan dan kesetiaan kepada Allah, sehingga tidak mempersempit istilah hanya pada tindakan ritual.
- issue: Rujukan subjek dalam כָּל יָמָיו לֹא סָרוּ
  choice: Sepanjang hidup Yosia, mereka tidak menyimpang
  alternative: Sepanjang hidupnya, mereka tidak menyimpang
  rationale: Akhiran tunggal pada “hari-harinya” merujuk kepada Yosia, sedangkan verba jamak berikutnya merujuk kepada rakyat. Nama Yosia diulang agar pergantian subjek tetap jelas tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bani Israel” mempertahankan ungkapan kekerabatan yang sudah dikenal; “kekejian” mempertahankan kerasnya penilaian teks; dan “mengabdi” dipilih agar makna pelayanan, ibadah, serta kesetiaan tetap tercakup.
