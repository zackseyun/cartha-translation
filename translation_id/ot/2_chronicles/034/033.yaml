  to: Yosia menyingkirkan segala kekejian dari seluruh wilayah milik bani Israel,[a] dan ia membuat semua orang yang berada di Israel mengabdi kepada Yahweh, Allah mereka.[b] Sepanjang hidup Yosia, mereka tidak berpaling dari Yahweh, Allah nenek moyang mereka.[c]
