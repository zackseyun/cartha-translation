  terminology: “Yahweh,” “Allah,” “bani Israel,” dan “kekejian” sesuai dengan sumber serta register Alkitab bahasa Indonesia. “Mengabdi kepada Yahweh” mempertahankan cakupan עבד yang lebih luas daripada ibadah ritual semata. “Nenek moyang” merupakan padanan alami bagi אֲבוֹת dalam rumusan ini; catatan harfiah mempertahankan istilah “para bapa.”
