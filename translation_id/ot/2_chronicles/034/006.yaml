  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: id
  text: juga di kota-kota Manasye, Efraim, dan Simeon, bahkan sampai ke Naftali, di reruntuhan mereka di daerah sekitarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani terakhir sulit. Frasa itu kemungkinan berarti “di reruntuhan mereka di daerah sekitarnya”; berdasarkan pembacaan konsonannya, bagian tersebut juga dapat dipahami secara lebih harfiah sebagai “di rumah-rumah mereka di sekelilingnya.”
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: juga di kota-kota
  rationale: Gabungan waw dan preposisi dilukiskan secara alami sebagai kelanjutan cakupan tindakan pada ayat sebelumnya. עָרֵי dapat berarti kota-kota atau permukiman; “kota-kota” sesuai dengan ragam narasi sejarah.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: Manasye, Efraim, dan Simeon
  rationale: Nama suku sekaligus wilayah dialihaksarakan menurut bentuk Indonesia yang lazim; rangkaian waw dinyatakan dengan tanda baca dan “dan” yang alami.
- source_word: וְ/עַד נַפְתָּלִי
  choice: bahkan sampai ke Naftali
  rationale: עַד menandai batas jangkauan geografis. “Bahkan sampai ke” menonjolkan luasnya jangkauan tanpa mengubah makna.
- source_word: ב/הר בתי/הם
  choice: di antara reruntuhan mereka
  rationale: Bentuk yang ditampilkan tersegmentasi secara sulit, tetapi paling masuk akal dipahami sebagai bentuk yang menunjuk pada tempat-tempat yang telah runtuh atau telantar. “Di antara reruntuhan mereka” mempertahankan fungsi lokatif dan sufiks orang ketiga jamak tanpa memaksakan penjelasan tekstual ke dalam teks utama.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: סָבִיב menyatakan kawasan yang mengelilingi atau tersebar di sekitar wilayah-wilayah tersebut. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan geografis.
