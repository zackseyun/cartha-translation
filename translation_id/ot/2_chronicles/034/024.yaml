base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: id
  text: 'Beginilah firman Yahweh, “Sesungguhnya, Aku akan mendatangkan malapetaka atas tempat ini dan atas penduduknya: segala kutuk[a] yang tertulis dalam kitab[b] yang telah mereka baca di hadapan raja Yehuda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala kutuk sumpah,” yang menekankan sanksi-sanksi perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kitab” juga dapat berarti “gulungan kitab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum bagi Tuhan.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan baku dan wajar dalam bahasa Indonesia untuk formula pembawa pesan kenabian, dengan nada yang khidmat.
- source_word: הִנְנִי
  choice: Sesungguhnya, Aku akan
  rationale: Menandai pengumuman ilahi yang tegas dan sungguh-sungguh tanpa memakai seruan yang terasa kurang alami dalam bahasa Indonesia modern.
- source_word: מֵבִיא רָעָה
  choice: akan mendatangkan malapetaka
  rationale: Dalam konteks ini רָעָה menunjuk pada bencana penghukuman, bukan kejahatan moral; bentuk futuratif sesuai dengan tindakan yang diumumkan akan datang.
- source_word: הַמָּקוֹם הַזֶּה
  choice: tempat ini
  rationale: Mempertahankan cakupan ungkapan sumber tanpa mempersempitnya secara eksplisit menjadi Yerusalem atau Yehuda.
- source_word: יוֹשְׁבָיו
  choice: penduduknya
  rationale: Padanan ringkas dan alami bagi orang-orang yang mendiami tempat tersebut.
- source_word: אֵת כָּל הָאָלוֹת
  choice: yaitu segala kutuk
  rationale: אָלוֹת adalah bentuk jamak yang dalam konteks kitab hukum menunjuk pada kutuk-kutuk perjanjian; 'segala kutuk' jelas dan menjaga bobot hukumnya.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: yang tertulis dalam kitab
  rationale: Bahasa Indonesia lazim mengatakan isi tertulis 'dalam' kitab; סֵפֶר dapat berarti kitab atau gulungan.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: yang telah mereka bacakan di hadapan
  rationale: Mempertahankan verba aktif jamak Ibrani dan menyatakan bahwa teks dibaca bagi raja dalam suasana resmi.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Padanan langsung dan alami bagi rangkaian konstruksi Ibrani.
theological_decisions:
- issue: Makna רָעָה ketika tindakan itu dikenakan kepada Allah
  choice: malapetaka
  alternative: kejahatan; bencana
  rationale: Konteksnya adalah penghukuman berupa kutuk-kutuk perjanjian. 'Malapetaka' mempertahankan beratnya akibat buruk tanpa menyiratkan bahwa Yahweh melakukan kejahatan moral.
- issue: Nuansa perjanjian pada אָלוֹת
  choice: kutuk dalam teks utama dengan penjelasan alternatif di catatan kaki
  alternative: kutuk sumpah
  rationale: '''Kutuk'' mudah dipahami pembaca umum, sedangkan catatan menjaga nuansa bahwa kutuk itu merupakan sanksi yang dinyatakan dalam kerangka perjanjian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula kenabian dipertahankan secara idiomatis; susunan kalimat dibuat jelas bagi pembaca umum tanpa menghilangkan bentuk aktif jamak pada tindakan membaca.
