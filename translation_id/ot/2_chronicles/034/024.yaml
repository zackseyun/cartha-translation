  to: 'Beginilah firman Yahweh, “Sesungguhnya, Aku akan mendatangkan malapetaka atas tempat ini dan atas penduduknya: segala kutuk[a] yang tertulis dalam kitab[b] yang telah mereka baca di hadapan raja Yehuda.”'
