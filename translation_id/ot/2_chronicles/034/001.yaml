  text: בֶּן שְׁמוֹנֶ֥ה שָׁנִ֖ים יֹאשִׁיָּ֣הוּ בְ/מָלְכ֑/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/001.yaml
  text: Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem.
translation:
  language: id
  text: Yosia berumur delapan tahun ketika ia menjadi raja, dan ia memerintah selama tiga puluh satu tahun di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: berumur delapan tahun
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'anak laki-laki dari delapan tahun' merupakan idiom usia. 'Berumur delapan tahun' menyampaikan maknanya secara alami dan tepat dalam bahasa Indonesia modern.
- source_word: יֹאשִׁיָּהוּ
  choice: Yosia
  rationale: Nama pribadi ini mengikuti bentuk yang sudah lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Konstruksi ini menunjukkan waktu naik takhta. 'Ketika ia menjadi raja' jelas, alami, dan mempertahankan hubungan temporal dengan usia Yosia.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: selama tiga puluh satu tahun
  rationale: Frasa ini menyatakan lamanya pemerintahan. Kata 'selama' memperjelas fungsi duratifnya dalam bahasa Indonesia tanpa menambah makna baru.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja Ibrani ini berarti menjalankan pemerintahan sebagai raja. 'Memerintah' adalah padanan Indonesia yang langsung dan wajar; identitasnya sebagai raja telah dinyatakan pada klausa sebelumnya.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ini bersifat lokatif dan diterjemahkan langsung dengan 'di'; nama tempat mengikuti bentuk Indonesia yang lazim.
