base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: id
  text: Kemudian Safan, juru tulis itu, melaporkan kepada raja, “Imam Hilkia telah memberikan kepadaku sebuah kitab[a].” Lalu Safan membaca dari kitab itu di hadapan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan.” Kata Ibrani ini dapat merujuk secara luas kepada dokumen tertulis atau kitab; pada masa itu bentuk fisiknya sering berupa gulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. “Memberi tahu” alami dalam bahasa Indonesia dan sesuai dengan perkataan langsung yang mengikutinya.
- source_word: הַסּוֹפֵר
  choice: panitera
  rationale: סֹפֵר dapat menunjuk kepada juru tulis atau pejabat sekretariat kerajaan. “Panitera” mempertahankan nuansa jabatan resmi dalam konteks istana tanpa sekadar menggambarkan pekerjaan menyalin tulisan.
- source_word: סֵפֶר
  choice: sebuah kitab
  rationale: סֵפֶר merupakan istilah luas bagi dokumen tertulis atau kitab. Dalam konteks penemuan kitab Taurat, “kitab” alami dan bermartabat, sedangkan bentuk fisiknya tidak ditentukan secara tegas oleh kata ini.
- source_word: נָתַן לִי
  choice: telah memberikan ... kepadaku
  rationale: Bentuk perfektif Ibrani menyatakan tindakan yang sudah selesai dan hasilnya masih relevan karena kitab itu kini berada pada Safan. “Telah memberikan ... kepadaku” menyampaikan hal tersebut secara alami.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: Imam Hilkia
  rationale: Nama diri ditransliterasikan sebagai “Hilkia”, sedangkan gelar הַכֹּהֵן diterjemahkan “Imam”. Susunan ini lebih alami dalam bahasa Indonesia daripada “Hilkia sang imam”.
- source_word: וַיִּקְרָא בוֹ
  choice: membacakan sebagian darinya
  rationale: קרא dalam konteks ini berarti membaca dengan bersuara di hadapan raja, sehingga bentuk kausatif pragmatis “membacakan” alami. Pronomina dengan preposisi בּוֹ secara harfiah berarti membaca ‘di dalam/dari’ kitab itu dan dapat menyiratkan pembacaan dari isinya, bukan harus seluruh kitab; “sebagian darinya” mempertahankan kemungkinan itu.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di hadapan raja
  rationale: Ungkapan ini menunjukkan tindakan yang dilakukan dalam kehadiran raja. “Di hadapan raja” dekat dengan bentuk Ibrani sekaligus wajar dalam register naratif.
