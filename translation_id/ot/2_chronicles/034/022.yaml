base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: id
  text: 'Kemudian Hilkia dan orang-orang suruhan raja pergi menemui Hulda, nabi perempuan itu, istri Salum, anak Tokhat, anak Hasra, penjaga pakaian[a]. Hulda tinggal di Yerusalem, di Kawasan Kedua[b]. Mereka berkata kepadanya demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penjaga gudang pakaian.” Secara harfiah, teks Ibrani berbunyi “penjaga pakaian.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: Mishneh, kemungkinan nama sebuah kawasan di Yerusalem; secara tradisional diterjemahkan “Kawasan Kedua.”'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ חִלְקִיָּהוּ וַאֲשֶׁר הַמֶּלֶךְ
  choice: Kemudian Hilkia dan orang-orang suruhan raja pergi
  rationale: Ungkapan sesudah nama Hilkia bersifat eliptis dan menunjuk kembali kepada utusan raja dalam ayat sebelumnya. “Orang-orang suruhan raja” menyatakan hubungan itu secara alami tanpa menentukan jabatan mereka.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: Hulda, nabi perempuan itu
  rationale: Bentuk feminin נְבִיאָה dipertahankan secara eksplisit. “Nabi perempuan” merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: אֵשֶׁת שַׁלֻּם בֶּן תוקהת בֶּן חַסְרָה
  choice: istri Salum anak Tokhat, cucu Hasra
  rationale: Rantai silsilah dipertahankan, tetapi hubungan generasi kedua dinyatakan dengan “cucu” agar tidak rancu dalam bahasa Indonesia.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: yang bertugas sebagai penjaga pakaian
  rationale: Terjemahan ini mempertahankan arti harfiah “penjaga pakaian” sekaligus menunjukkan bahwa ungkapan tersebut kemungkinan menunjuk pada suatu tugas resmi.
- source_word: וְהִיא יוֹשֶׁבֶת בִּירוּשָׁלִַם
  choice: Hulda tinggal di Yerusalem
  rationale: Partisip Ibrani menyampaikan informasi latar mengenai tempat tinggal. Nama Hulda diulangi demi kejelasan setelah keterangan panjang tentang suaminya.
- source_word: בַּמִּשְׁנֶה
  choice: di Kawasan Kedua
  rationale: מִשְׁנֶה kemungkinan merupakan sebutan bagi distrik tertentu di Yerusalem. “Kawasan Kedua” mempertahankan arti tradisional sambil memakai istilah Indonesia yang alami.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'Mereka berkata kepadanya demikian:'
  rationale: Ungkapan ini memperkenalkan perkataan langsung berikutnya. “Demikian” memberi ragam yang bermartabat dan mempertahankan daya tunjuk כָּזֹאת.
