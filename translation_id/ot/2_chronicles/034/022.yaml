revisions:
- from: 'Kemudian Hilkia dan orang-orang suruhan raja pergi menemui Hulda, nabi perempuan itu. Hulda adalah istri Salum anak Tokhat, cucu Hasra, yang bertugas sebagai penjaga pakaian[a]. Hulda tinggal di Yerusalem, di Kawasan Kedua[b]. Mereka berkata kepadanya demikian:'
  to: 'Kemudian Hilkia dan orang-orang suruhan raja pergi menemui Hulda, nabi perempuan itu, istri Salum, anak Tokhat, anak Hasra, penjaga pakaian[a]. Hulda tinggal di Yerusalem, di Kawasan Kedua[b]. Mereka berkata kepadanya demikian:'
  rationale: Revisi mengganti “cucu” dengan pengulangan “anak” untuk menjaga bentuk dan keterbukaan silsilah Ibrani, serta menempatkan “penjaga pakaian” sebagai aposisi Salum. Catatan jabatan juga diselaraskan dengan arti leksikal frasa Ibrani.
