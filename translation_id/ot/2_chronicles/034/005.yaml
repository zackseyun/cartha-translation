  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: id
  text: Ia membakar tulang-tulang para imam di atas mezbah-mezbah mereka[a], lalu menyucikan Yehuda dan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mezbah-mezbah itu.” Bentuk Ibrani di sini tidak lazim; maksudnya ialah bahwa Yosia membakar tulang-tulang para imam di atas mezbah-mezbah yang berkaitan dengan mereka.'
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: tulang-tulang para imam
  rationale: עַצְמוֹת adalah bentuk jamak konstruktus dari עֶצֶם dan di sini menunjuk pada tulang secara harfiah. כֹּהֲנִים berarti para imam; teks tidak secara eksplisit menambahkan sifat 'penyembah berhala'.
- source_word: שָׂרַף
  choice: membakar
  rationale: Bentuk Qal perfektum orang ketiga tunggal maskulin dari שׂרף menyatakan tindakan membakar yang dilakukan Yosia.
- source_word: עַל מזבחותים
  choice: di atas mazbah-mazbah mereka
  rationale: עַל paling langsung berarti 'di atas'. Bentuk מזבחותים tidak lazim, tetapi dalam konteks kemungkinan menyampaikan 'mazbah-mazbah mereka', yakni mazbah yang terkait dengan para imam tersebut.
- source_word: וַ/יְטַהֵר
  choice: lalu menahirkan
  rationale: Bentuk Piel wayyiqtol dari טהר menunjukkan penahiran dari kenajisan kultis. 'Menahirkan' mempertahankan dimensi ritual dan moral yang lebih khusus daripada sekadar membersihkan secara fisik.
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: Yehuda dan Yerusalem
  rationale: Keduanya adalah objek langsung dan diterjemahkan dengan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Sifat penahiran Yehuda dan Yerusalem
  choice: penahiran negeri dan kota dari kenajisan yang berkaitan dengan penyembahan berhala
  alternative: pemurnian seremonial semata atau pembersihan fisik semata
  rationale: Dalam konteks pembaruan Yosia, טהר mencakup penghapusan kenajisan kultis akibat ibadah terlarang. 'Menahirkan' menjaga nuansa itu tanpa memasukkan konsep teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mazbah' dipilih sebagai istilah kultis yang ringkas dan lazim dalam ragam Alkitab; 'menahirkan' mempertahankan nuansa ritual-kultis. Kata penghubung ו awal tidak diterjemahkan secara tersendiri, sedangkan וַ pada tindakan berikutnya diwujudkan sebagai 'lalu' agar urutan naratif alami.
