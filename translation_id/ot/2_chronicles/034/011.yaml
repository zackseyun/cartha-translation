base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: id
  text: Mereka menyerahkan uang itu kepada para perajin dan tukang bangunan untuk membeli batu dari tambang serta kayu bagi pekerjaan penyambungan[a] dan untuk memasang atap pada bangunan-bangunan yang telah dirusak oleh raja-raja Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini tidak pasti. Istilah tersebut mungkin menunjuk pada pekerjaan penyambungan, pengikat, rangka, atau unsur penyangga bangunan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan "memasang atap" juga dapat berarti menutupi suatu bangunan dengan balok-balok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka menyerahkan uang itu
  rationale: Kata kerja נתן berarti 'memberikan/menyerahkan'. Objeknya tersirat dari konteks sebelumnya, yaitu uang untuk pekerjaan perbaikan; objek tersebut dinyatakan agar kalimat Indonesia alami.
- source_word: לֶחָרָשִׁים
  choice: kepada para perajin
  rationale: חָרָשִׁים menunjuk kepada para pekerja terampil secara luas, sehingga 'perajin' tidak membatasinya pada satu jenis keterampilan.
- source_word: וְלַבֹּנִים
  choice: dan tukang bangunan
  rationale: Bentuk partisip dari בנה menunjuk kepada orang-orang yang mengerjakan pembangunan; 'tukang bangunan' merupakan ungkapan Indonesia yang langsung dan alami.
- source_word: לִקְנוֹת
  choice: untuk membeli
  rationale: Terjemahan langsung dan wajar dari infinitif קנה.
- source_word: אַבְנֵי מַחְצֵב
  choice: batu dari tambang
  rationale: Frasa ini menyatakan batu yang diperoleh dari tambang untuk konstruksi. Pilihan ini menjaga fokus leksikal pada asal batu tanpa memastikan tingkat pemahatannya.
- source_word: וְעֵצִים
  choice: serta kayu
  rationale: Dalam konteks pembangunan, עֵצִים berarti kayu sebagai bahan konstruksi; 'kayu' jelas dan alami dalam bahasa Indonesia.
- source_word: לַמְחַבְּרוֹת
  choice: bagi pekerjaan penyambungan
  rationale: Istilah ini sulit dan berkaitan dengan penyambungan atau pengikatan unsur struktur. Terjemahan ini mempertahankan ketidakpastiannya tanpa menentukan bahwa yang dimaksud pasti penyangga, rangka, atau sambungan tertentu.
- source_word: וּלְקָרוֹת
  choice: untuk memasang atap
  rationale: Dalam konteks bangunan, קרה berarti menutupi atau memberi atap, mungkin dengan balok-balok. Terjemahan verbal ini sesuai dengan bentuk infinitif dan alami dalam bahasa Indonesia.
- source_word: אֶת הַבָּתִּים
  choice: pada bangunan-bangunan
  rationale: Walaupun בַּיִת sering berarti 'rumah', konteksnya adalah perbaikan kompleks Bait TUHAN. 'Bangunan-bangunan' menghindari kesan rumah tinggal dan tidak mempersempitnya menjadi satu bangunan saja.
- source_word: אֲשֶׁר הִשְׁחִיתוּ
  choice: yang telah dirusak
  rationale: Hifil שחת dapat berarti merusak, membinasakan, atau menghancurkan. 'Dirusak' cocok dengan konteks perbaikan dan tidak menyiratkan kehancuran total.
- source_word: מַלְכֵי יְהוּדָה
  choice: oleh raja-raja Yehuda
  rationale: Terjemahan langsung frasa konstruksi Ibrani; bentuk pasif Indonesia mempertahankan raja-raja Yehuda sebagai pelaku perusakan.
