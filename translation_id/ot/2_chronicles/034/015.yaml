  text: וַ/יַּ֣עַן חִלְקִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ אֶל שָׁפָ֣ן הַ/סּוֹפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֧ן חִלְקִיָּ֛הוּ אֶת הַ/סֵּ֖פֶר אֶל שָׁפָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: id
  text: Lalu Hilkia berkata kepada Safan, panitera itu, “Aku telah menemukan Kitab Taurat[a] di rumah Yahweh.” Kemudian Hilkia memberikan kitab itu kepada Safan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan hukum”; kata Ibrani sefer dapat berarti kitab, dokumen, atau gulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: berkata
  rationale: Gabungan formula ujaran Ibrani ini secara harfiah dapat berarti ‘menjawab dan berkata’, tetapi dalam bahasa Indonesia modern ‘berkata’ menyampaikan fungsi naratifnya dengan wajar; tidak ada pertanyaan langsung sebelumnya yang menuntut ‘menjawab’.
- source_word: הַסּוֹפֵר
  choice: panitera
  rationale: סֹפֵר di sini menunjuk pejabat tulis-menulis kerajaan; ‘panitera’ mempertahankan nuansa jabatan administratif tanpa membatasinya hanya sebagai penyalin.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitab Taurat
  rationale: סֵפֶר dapat berarti kitab, dokumen, atau gulungan, sedangkan תּוֹרָה berarti pengajaran atau hukum. ‘Kitab Taurat’ merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks kumpulan hukum perjanjian.
- source_word: מָצָאתִי
  choice: Aku telah menemukan
  rationale: Bentuk perfektif menyatakan tindakan yang sudah selesai dan hasilnya masih relevan pada saat pengumuman.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan harfiah ‘rumah Yahweh’, yang dalam konteks merujuk pada bait-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: memberikan kitab itu kepada Safan
  rationale: Terjemahan langsung dan alami untuk tindakan penyerahan kitab kepada Safan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi; ‘Yahweh’ mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna תּוֹרָה
  choice: Taurat
  alternative: pengajaran
  rationale: ‘Taurat’ sesuai dengan konteks kitab hukum perjanjian yang ditemukan, tetapi istilah Ibrani juga memiliki cakupan dasar ‘pengajaran’; terjemahan tidak menentukan lebih jauh isi atau batas persis kitab tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama tokoh mengikuti bentuk Indonesia yang lazim. ‘Panitera’ dipilih untuk jabatan administratif kerajaan; ‘rumah Yahweh’ mempertahankan citra Ibrani meskipun yang dimaksud ialah bait.
