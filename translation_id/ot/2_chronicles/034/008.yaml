  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: id
  text: Pada tahun kedelapan belas pemerintahannya, setelah ia menyucikan negeri dan rumah itu[a], ia mengutus Safan anak Azalya, Maaseya, kepala kota, dan Yoah anak Yoahas, juru catat, untuk memperbaiki[b] rumah Yahweh, Allahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “negeri dan Bait Allah”; secara harfiah: “negeri dan rumah itu.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “memperkuat”; dalam konteks bangunan, kata ini berarti memperbaiki atau memulihkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: Pada tahun kedelapan belas pemerintahannya
  rationale: Ungkapan penanggalan masa pemerintahan diterjemahkan dengan susunan Indonesia yang alami; waw hanya melanjutkan narasi dan tidak perlu dinyatakan secara tersendiri.
- source_word: לְטַהֵר
  choice: setelah ia menahirkan
  rationale: 'Infinitif berawalan ל dipahami secara temporal berdasarkan urutan kisah: penahiran telah berlangsung sebelum para pejabat diutus untuk memperbaiki rumah Yahweh.'
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: negeri dan rumah itu
  rationale: Terjemahan ini mempertahankan kata konkret 'rumah' dan kaitannya dengan 'rumah Yahweh' pada akhir ayat; 'negeri' sesuai dengan cakupan wilayah kerajaan dalam konteks.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ
  choice: Safan anak Azalya
  rationale: Nama-nama ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, sedangkan בֶּן diterjemahkan 'anak'.
- source_word: מַעֲשֵׂיָהוּ שַׂר הָעִיר
  choice: Maaseya, kepala kota
  rationale: שַׂר menunjuk pejabat yang berwenang; 'kepala kota' menyampaikan jabatan sipilnya tanpa menyamakannya dengan jabatan modern tertentu.
- source_word: יוֹאָח בֶּן יֽוֹאָחָז הַמַּזְכִּיר
  choice: Yoah anak Yoahas, sekretaris kerajaan
  rationale: הַמַּזְכִּיר adalah gelar pejabat istana yang menangani pencatatan atau administrasi; 'sekretaris kerajaan' jelas bagi pembaca modern.
- source_word: לְחַזֵּק
  choice: untuk memperbaiki
  rationale: Makna dasar verba ini ialah 'menguatkan', tetapi ketika objeknya bangunan, makna kontekstualnya adalah memperbaiki atau memulihkan.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: rumah Yahweh, Allahnya
  rationale: בֵּית diterjemahkan konsisten sebagai 'rumah', nama ilahi יְהוָה ditransliterasikan 'Yahweh', dan sufiks posesif pada אֱלֹהָיו dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks secara langsung memakai Tetragramaton; bentuk 'Yahweh' mempertahankan nama diri ilahi tanpa menggantinya dengan gelar.
- issue: Hubungan temporal atau tujuan pada לְטַהֵר
  choice: setelah ia menahirkan
  alternative: untuk menahirkan
  rationale: Konteks dekat menyatakan bahwa penahiran telah dimulai sebelumnya, sedangkan pengutusan dalam ayat ini berfokus pada perbaikan rumah Yahweh. Namun, bentuk Ibraninya sendiri memakai infinitif berawalan ל dan dapat tampak seperti tujuan jika dibaca terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menahirkan' dipakai untuk tindakan pemurnian keagamaan; 'rumah Yahweh' mempertahankan pengulangan leksikal teks Ibrani, sementara catatan kaki menjelaskan bahwa yang dimaksud ialah Bait Allah. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
