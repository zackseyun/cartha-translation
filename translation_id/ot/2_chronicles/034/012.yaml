  text: וְ/הָ/אֲנָשִׁים֩ עֹשִׂ֨ים בֶּ/אֱמוּנָ֜ה בַּ/מְּלָאכָ֗ה וַ/עֲלֵי/הֶ֣ם מֻ֠פְקָדִים יַ֣חַת וְ/עֹבַדְיָ֤הוּ הַ/לְוִיִּם֙ מִן בְּנֵ֣י מְרָרִ֔י וּ/זְכַרְיָ֧ה וּ/מְשֻׁלָּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים לְ/נַצֵּ֑חַ וְ/הַ֨/לְוִיִּ֔ם כָּל מֵבִ֖ין בִּ/כְלֵי שִֽׁיר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: id
  text: Orang-orang itu bekerja dengan setia dalam pekerjaan itu. Yang ditugaskan untuk mengepalai mereka ialah Yahat dan Obaja, orang-orang Lewi dari keturunan Merari, serta Zakharia dan Mesulam dari keturunan kaum Kehat, untuk mengawasi[a]. Dan orang-orang Lewi, semuanya mahir menggunakan alat-alat musik[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mengarahkan”; kata Ibrani ini dapat menunjuk pada kepemimpinan yang bersifat mengawasi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “memahami alat-alat nyanyian,” maksudnya mahir menggunakan alat-alat musik.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: dengan setia
  rationale: Nomina אֱמוּנָה berfungsi secara adverbial dan menyatakan bahwa para pekerja menjalankan tugas dengan dapat dipercaya dan berintegritas, bukan terutama iman sebagai keadaan batin.
- source_word: בַּמְּלָאכָה
  choice: mengerjakan tugas mereka
  rationale: מְלָאכָה menunjuk pada pekerjaan atau tugas dalam proyek perbaikan Bait Allah. Ungkapan ini alami dalam bahasa Indonesia dan menghindari pengulangan kaku 'mengerjakan pekerjaan'.
- source_word: מֻפְקָדִים ... וַעֲלֵיהֶם
  choice: ditugaskan untuk mengepalai mereka
  rationale: Partisipel Hofal dari פקד mempertahankan gagasan pasif bahwa orang-orang ini diberi tanggung jawab atas para pekerja.
- source_word: מִן בְּנֵי מְרָרִי
  choice: dari keturunan Merari
  rationale: בני dalam konteks silsilah atau kaum berarti keturunan; bentuk ini jelas dan alami bagi pembaca Indonesia.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: dari keturunan kaum Kehat
  rationale: הַקְּהָתִים merupakan sebutan bagi kaum Kehat. Terjemahan ini mempertahankan unsur keturunan dan identitas kaumnya tanpa menghasilkan frasa Indonesia yang janggal.
- source_word: לְנַצֵּחַ
  choice: untuk mengawasi
  rationale: Dalam konteks administrasi pekerjaan perbaikan, verba ini menyatakan pengarahan atau pengawasan; 'mengawasi' mempertahankan fungsi kepemimpinan tanpa mengaitkannya khusus dengan musik.
- source_word: כָּל מֵבִין
  choice: yang mahir
  rationale: Partisipel מֵבִין di sini menunjukkan pemahaman atau kecakapan praktis.
- source_word: בִּכְלֵי שִׁיר
  choice: menggunakan alat-alat musik
  rationale: Secara harfiah frasa ini adalah 'dalam/dengan alat-alat nyanyian'; dalam konteksnya, 'alat-alat musik' merupakan padanan Indonesia yang jelas dan tepat.
- source_word: יַחַת וְעֹבַדְיָהוּ ... זְכַרְיָה וּמְשֻׁלָּם
  choice: Yahat dan Obaja ... Zakharia dan Mesulam
  rationale: Nama-nama ditransliterasikan dengan bentuk yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur daftar jabatan dan garis keturunan dipertahankan, sedangkan susunan Ibrani yang kaku dibuat lebih alami. 'Juga ada' memperjelas klausa terakhir yang eliptis tanpa menentukan lebih jauh fungsi para pemusik yang baru dilanjutkan pada ayat berikutnya.
