revisions:
- from: Orang-orang itu mengerjakan tugas mereka dengan setia. Yang ditugaskan untuk mengepalai mereka ialah Yahat dan Obaja, orang-orang Lewi dari keturunan Merari, serta Zakharia dan Mesulam dari keturunan kaum Kehat, untuk mengawasi[a]. Juga ada orang-orang Lewi yang mahir menggunakan alat-alat musik[b].
  to: Orang-orang itu bekerja dengan setia dalam pekerjaan itu. Yang ditugaskan untuk mengepalai mereka ialah Yahat dan Obaja, orang-orang Lewi dari keturunan Merari, serta Zakharia dan Mesulam dari keturunan kaum Kehat, untuk mengawasi[a]. Dan orang-orang Lewi, semuanya mahir menggunakan alat-alat musik[b].
  rationale: Revisi kecil ini menghilangkan tambahan “Juga ada” dan mengganti “tugas mereka” dengan “pekerjaan itu” agar lebih dekat dengan struktur dan rujukan Ibrani. Klausa terakhir tetap dinyatakan secara idiomatis dalam bahasa Indonesia sambil mempertahankan koordinasi dengan klausa sebelumnya. Semua penanda catatan kaki dipertahankan pada unsur yang tepat.
