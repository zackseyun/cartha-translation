  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: id
  text: 'Kemudian raja memerintahkan Hilkia, Ahikam anak Safan, Abdon anak Mikha[a], Safan, juru tulis itu, dan Asaya, hamba raja[b], dengan berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Masoret berbunyi “Abdon anak Mikha”. Bagian sejajar dalam 2 Raja-Raja 22:12 berbunyi “Akhbor anak Mikaya”.
    reason: textual_variant
  - marker: b
    text: 'Secara harfiah: “hamba raja”. Dalam konteks istana, ungkapan Ibrani ini dapat menunjuk seorang pegawai atau pejabat kerajaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Kemudian raja memerintahkan
  rationale: Bentuk naratif וַיְצַו melanjutkan rangkaian peristiwa dan menyatakan perintah yang berwibawa; 'kemudian ... memerintahkan' alami dalam narasi Indonesia.
- source_word: חִלְקִיָּהוּ
  choice: Hilkia
  rationale: Transliterasi nama Ibrani yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam anak Safan
  rationale: בן menyatakan hubungan ayah-anak; bentuk ringkas 'anak' alami untuk identifikasi patronimik.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: Abdon anak Mikha
  rationale: Mengikuti bacaan Teks Masoret kitab Tawarikh serta mempertahankan bentuk nama dan patronimiknya.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: Safan, sang panitera
  rationale: סוֹפֵר dalam lingkungan istana dapat menunjuk penulis atau sekretaris resmi; 'panitera' mempertahankan fungsi tulis-menulis resmi tanpa membatasinya pada arti penyalin.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaya, pegawai raja
  rationale: Secara harfiah עֶבֶד berarti 'hamba', tetapi dalam konteks istana dapat menjadi sebutan bagi pejabat atau pelayan resmi raja; 'pegawai raja' menyampaikan fungsi kontekstual itu secara wajar.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Formula pengantar perkataan ini menunjuk pada isi perintah di ayat berikutnya; 'demikian:' lebih alami dalam bahasa Indonesia daripada 'dengan berkata'.
