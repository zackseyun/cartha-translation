revisions:
- from: Kemudian mereka datang kepada Hilkia, imam besar itu, dan menyerahkan uang yang telah dibawa ke rumah Allah. Uang itu telah dikumpulkan oleh orang-orang Lewi, para penjaga ambang pintu[a], dari Manasye dan Efraim, dari seluruh sisa Israel, dari seluruh Yehuda dan Benyamin, serta dari penduduk Yerusalem.
  to: Kemudian mereka datang kepada Hilkia, imam besar, lalu menyerahkan uang yang telah dibawa ke rumah Allah, yang telah dikumpulkan oleh orang-orang Lewi, para penjaga ambang[a], dari Manasye dan Efraim, dari seluruh sisa Israel, dari seluruh Yehuda dan Benyamin, serta dari penduduk Yerusalem.
  rationale: 'Revisi mempertahankan hubungan sintaktis utama teks Ibrani: uang yang diserahkan ialah uang yang dibawa ke rumah Allah dan dikumpulkan oleh orang Lewi dari kelompok-kelompok yang disebutkan. Demonstratif yang tidak perlu dihilangkan, istilah untuk שֹׁמְרֵי הַסַּף diselaraskan dengan catatan kaki, dan seluruh daftar asal pengumpulan dibuat jelas sebagai pelengkap “dikumpulkan.”'
