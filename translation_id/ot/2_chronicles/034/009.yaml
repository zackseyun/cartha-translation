  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: id
  text: Kemudian mereka datang kepada Hilkia, imam besar, lalu menyerahkan uang yang telah dibawa ke rumah Allah, yang telah dikumpulkan oleh orang-orang Lewi, para penjaga ambang[a], dari Manasye dan Efraim, dari seluruh sisa Israel, dari seluruh Yehuda dan Benyamin, serta dari penduduk Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para penjaga pintu” atau “para penjaga gerbang”; secara harfiah, “para penjaga ambang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kemudian mereka datang
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “kemudian” menyampaikan perkembangan narasi secara alami dalam bahasa Indonesia.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: Hilkia, imam besar itu
  rationale: Nama diri mengikuti bentuk Indonesia yang lazim, sedangkan gelar tersebut diterjemahkan dengan istilah baku “imam besar.”
- source_word: וַיִּתְּנוּ אֶת־הַכֶּסֶף
  choice: dan menyerahkan uang
  rationale: Dalam konteks penyerahan dana, “menyerahkan” lebih tepat daripada sekadar “memberikan”; כֶּסֶף secara harfiah dapat berarti perak, tetapi di sini berfungsi sebagai uang.
- source_word: הַמּוּבָא בֵית אֱלֹהִים
  choice: yang telah dibawa ke rumah Allah
  rationale: Mempertahankan ungkapan sumber “rumah Allah” dan menyatakan bahwa pemasukan uang itu mendahului penyerahannya kepada Hilkia.
- source_word: אֲשֶׁר אָסְפוּ הַלְוִיִּם
  choice: Uang itu telah dikumpulkan oleh orang-orang Lewi
  rationale: Klausa relatif dipecah menjadi kalimat baru agar rujukannya jelas dan wajar dalam bahasa Indonesia tanpa mengubah hubungan maknanya.
- source_word: שֹׁמְרֵי הַסַּף
  choice: para penjaga ambang pintu
  rationale: Terjemahan ini mempertahankan gambaran harfiah Ibrani sekaligus cukup jelas; padanan fungsional dicatat dalam catatan kaki.
- source_word: מִיַּד
  choice: dari
  rationale: Ungkapan harfiah “dari tangan” merupakan idiom sumber yang dalam konteks pengumpulan dana secara alami berarti “dari.”
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: sisa Israel
  rationale: “Sisa” mempertahankan kemungkinan nuansa teologis שְׁאֵרִית tanpa memperkuatnya secara berlebihan.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: serta dari penduduk Yerusalem
  rationale: Preposisi “dari” dipasok sesuai rangkaian sumber-sumber dana dan tuntutan kelancaran sintaksis Indonesia.
theological_decisions:
- issue: Nuansa teologis שְׁאֵרִית (kelompok yang tersisa)
  choice: sisa Israel
  alternative: orang-orang Israel lainnya
  rationale: “Sisa Israel” dapat menunjuk orang-orang yang masih tinggal dari suku-suku utara dan tetap membuka kemungkinan gema perjanjian, tanpa memastikan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah untuk memperjelas anteseden klausa relatif. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya, yaitu “penjaga ambang pintu.”
