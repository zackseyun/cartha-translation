  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: id
  text: Karena mereka telah meninggalkan Aku dan membakar dupa bagi ilah-ilah lain[a], untuk membangkitkan murka-Ku dengan segala perbuatan tangan mereka[b], murka-Ku akan tercurah atas tempat ini dan tidak akan padam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ilah-ilah asing”. Secara lebih harfiah, bahasa Ibraninya berbunyi “ilah-ilah lain”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “segala perbuatan tangan mereka” dapat merujuk secara luas pada apa yang mereka buat atau lakukan, khususnya berhala buatan manusia dan tindakan-tindakan yang berkaitan dengannya.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: Karena
  rationale: Ungkapan ini memperkenalkan alasan bagi penghukuman yang diumumkan; “karena” menyampaikan hubungan sebab secara alami dalam bahasa Indonesia.
- source_word: עֲזָבוּנִי
  choice: mereka telah meninggalkan Aku
  rationale: עזב berarti meninggalkan atau menelantarkan. “Meninggalkan Aku” alami sekaligus mempertahankan bobot ketidaksetiaan kepada Allah.
- source_word: וַיַּקְטִירוּ
  choice: dan membakar dupa
  rationale: Dalam konteks peribadatan, bentuk Hifil dari קטר lazim menunjuk pada pembakaran dupa atau persembahan yang menghasilkan asap; “membakar dupa” paling tepat di sini.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: bagi ilah-ilah lain
  rationale: אֲחֵרִים secara harfiah berarti “lain”. “Ilah-ilah lain” mempertahankan ungkapan sumber dan dalam bahasa Indonesia membedakannya dari Allah yang berbicara.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: untuk membangkitkan murka-Ku
  rationale: Konstruksi ini menyatakan tujuan atau akibat, sedangkan Hifil כעס berarti membuat marah atau membangkitkan murka. Pilihan ini ringkas dan wajar dalam tuturan ilahi.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: melalui segala buatan tangan mereka
  rationale: Ungkapan Ibrani dapat meliputi segala yang mereka buat atau lakukan, khususnya berhala buatan manusia beserta tindakan terkait. Terjemahan mempertahankan citra tangan tanpa membatasi acuannya secara berlebihan.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: murka-Ku akan tercurah
  rationale: נתך bersama חֵמָה menggambarkan murka sebagai sesuatu yang dicurahkan. “Murka-Ku akan tercurah” mempertahankan metafora dan bahasa penghukuman.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: atas tempat ini
  rationale: Preposisi ב dalam konteks murka yang tercurah menyatakan sasaran; “atas tempat ini” mempertahankan arah penghukuman secara alami.
- source_word: וְלֹא תִכְבֶּה
  choice: dan tidak akan padam
  rationale: כבה berarti padam atau dipadamkan. Bentuk “tidak akan padam” mempertahankan citra api yang tersirat dan cocok bagi murka yang terus menyala.
theological_decisions:
- issue: Bahasa penghukuman ilahi tanpa pelunakan atau sistematisasi tambahan
  choice: murka-Ku akan tercurah atas tempat ini dan tidak akan padam
  alternative: amarah-Ku akan ditumpahkan atas tempat ini dan tidak akan dipadamkan
  rationale: Pilihan ini mempertahankan tuturan langsung Allah, kedahsyatan penghukuman, metafora pencurahan, dan citra api dalam kata “padam”, tanpa memasukkan kategori doktrinal yang tidak dinyatakan teks.
- issue: Rujukan kepada Allah dalam tuturan orang pertama
  choice: Aku / -Ku
  alternative: TUHAN
  rationale: Akhiran orang pertama dalam bahasa Ibrani merujuk kepada Allah yang sedang berbicara. Mempertahankan bentuk orang pertama mencerminkan teks secara langsung; kapitalisasi membantu menandai rujukannya secara wajar dalam tradisi penulisan Indonesia.
- issue: Cakupan tujuan atau akibat dalam לְמַעַן
  choice: untuk membangkitkan murka-Ku
  alternative: sehingga mereka membangkitkan murka-Ku
  rationale: לְמַעַן dapat menyampaikan tujuan atau akibat. “Untuk” mempertahankan bentuk tujuan yang paling langsung tanpa menutup kemungkinan bahwa ungkapan itu juga menggambarkan akibat tindakan mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat lancar bagi pembaca umum sambil mempertahankan metafora utama teks Ibrani. “Ilah” dipakai untuk dewa-dewa yang disembah selain Allah; pronomina ilahi ditulis dengan huruf kapital.
