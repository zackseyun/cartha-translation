  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: id
  text: “Sesungguhnya, Aku akan mengumpulkan engkau kepada nenek moyangmu, dan engkau akan dikumpulkan ke makam leluhurmu[a] dengan damai[b]. Matamu tidak akan melihat segala malapetaka yang akan Kudatangkan atas tempat ini dan atas penduduknya.” Lalu mereka menyampaikan jawaban itu kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke makam-makammu.” Bentuk jamak Ibrani mungkin menunjuk pada kompleks makam keluarga atau tempat pemakaman para leluhur.'
    reason: lexical_alternative
  - marker: b
    text: “Dengan damai” terutama dikaitkan oleh klausa berikutnya dengan kenyataan bahwa Yosia tidak akan melihat malapetaka yang akan datang; ungkapan ini tidak harus berarti bahwa kematiannya sendiri tidak disertai kekerasan.
    reason: cross_reference
lexical_decisions:
- source_word: הִנְנִי
  choice: Sesungguhnya, Aku akan
  rationale: Penanda wacana ini memperkenalkan pernyataan ilahi dengan penegasan. Bentuk partisip berikutnya mengarah pada tindakan mendatang yang telah ditetapkan.
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: mengumpulkan engkau kepada nenek moyangmu
  rationale: Mempertahankan metafora Ibrani tentang kematian dan bergabung dengan para leluhur, sambil memakai 'nenek moyang' yang alami dan tidak ambigu dalam bahasa Indonesia modern.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: engkau akan dikumpulkan ke makam leluhurmu
  rationale: Bentuk pasif mempertahankan kaitan leksikal dengan klausa sebelumnya. Bentuk jamak Ibrani dipahami sebagai makam-makam keluarga atau tempat pemakaman leluhur; 'makam leluhurmu' alami dalam bahasa Indonesia tanpa menyiratkan bahwa Yosia memiliki beberapa makam pribadi.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: Mempertahankan keluasan makna שָׁלוֹם dan kaitannya dengan klausa berikut bahwa Yosia tidak akan menyaksikan malapetaka yang diumumkan.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Matamu tidak akan melihat
  rationale: Mempertahankan ungkapan tubuh yang eksplisit dan penekanannya dalam teks Ibrani.
- source_word: בְּכֹל הָרָעָה
  choice: segala malapetaka
  rationale: Dalam konteks penghakiman, רָעָה menunjuk pada bencana atau malapetaka, bukan terutama kejahatan moral.
- source_word: אֲשֶׁר אֲנִי מֵבִיא
  choice: yang akan Kudatangkan
  rationale: Menyatakan tindakan ilahi yang akan terjadi dan sudah ditetapkan; bentuk ini lebih wajar dalam bahasa Indonesia daripada terjemahan progresif yang kaku.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: Lalu mereka menyampaikan jawaban itu kepada raja
  rationale: Idiom ini menyatakan bahwa para utusan membawa kembali jawaban atau laporan kepada raja.
theological_decisions:
- issue: Arti janji 'dengan damai' mengingat Yosia kemudian tewas dalam pertempuran
  choice: Ungkapan itu dibiarkan luas, dengan konteks langsung menekankan bahwa Yosia tidak akan menyaksikan malapetaka yang akan menimpa tempat itu dan penduduknya.
  alternative: Ungkapan itu dapat dipahami sebagai janji bahwa cara kematian Yosia sendiri tidak akan disertai kekerasan, atau terutama bahwa ia akan dimakamkan dengan tenteram.
  rationale: Klausa berikutnya menjelaskan aspek utama dari damai tersebut tanpa meniadakan ketegangan dengan kisah kematian Yosia kemudian. Terjemahan tidak memaksakan harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Aku' untuk Allah dan 'engkau' untuk sapaan tunggal dipakai guna menjaga register Alkitab yang mudah dipahami. Metafora kematian dalam teks sumber dipertahankan, sedangkan bentuk jamak 'makam-makammu' dijelaskan melalui catatan kaki agar teks utama tetap alami.
