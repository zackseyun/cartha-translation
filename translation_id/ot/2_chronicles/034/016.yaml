base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: id
  text: Lalu Safan membawa kitab itu kepada raja dan juga menyampaikan laporan lebih lanjut kepada raja, katanya, “Semua yang dipercayakan kepada para hambamu[a] sedang mereka kerjakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “diberikan ke dalam tangan para hambamu.” Ungkapan Ibrani ini berarti diserahkan ke dalam tanggung jawab mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: membawa
  rationale: Bentuk Hifil dari בוא menyatakan bahwa Safan membawa kitab itu kepada raja.
- source_word: הַסֵּפֶר
  choice: kitab itu
  rationale: סֵפֶר dapat berarti kitab, gulungan, atau dokumen. Dalam konteks kitab Taurat yang ditemukan, “kitab itu” alami dan tidak menentukan bentuk bendanya secara berlebihan.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: juga menyampaikan laporan lebih lanjut kepada raja
  rationale: Ungkapan שוב + דבר berarti menyampaikan kembali atau melaporkan suatu perkara; עוֹד memberi nuansa “juga” atau “lebih lanjut.”
- source_word: לֵאמֹר
  choice: katanya
  rationale: Rumus pengutip yang memperkenalkan perkataan langsung; “katanya” merupakan bentuk Indonesia yang ringkas dan wajar.
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: Segala sesuatu yang dipercayakan kepada para hambamu
  rationale: Bentuk pasif נִתַּן dengan בְיַד merupakan idiom untuk sesuatu yang diserahkan ke dalam tanggung jawab seseorang. Terjemahan ini menyampaikan makna idiom secara alami, sementara gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: עֲבָדֶיךָ
  choice: para hambamu
  rationale: Dalam lingkungan kerajaan, עֶבֶד dapat menunjuk kepada hamba atau pejabat raja. “Para hambamu” mempertahankan bentuk sapaan kepada raja tanpa mempersempitnya menjadi pejabat atau budak.
- source_word: הֵם עֹשִׂים
  choice: sedang mereka kerjakan
  rationale: Pronomina eksplisit הֵם dan partisipel עֹשִׂים menekankan pelaku serta tindakan yang sedang berlangsung. Susunan ini mempertahankan penekanan tersebut dalam bahasa Indonesia.
