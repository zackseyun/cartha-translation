translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kitab” sesuai dengan konteks keagamaan tanpa memastikan bahwa benda itu berkodeks, sedangkan “menyampaikan laporan lebih lanjut” menghindari pengulangan yang kaku tetapi tetap mewakili idiom dan עוֹד.
