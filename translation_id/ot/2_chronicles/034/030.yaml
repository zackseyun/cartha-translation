  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: id
  text: Kemudian raja naik ke Bait Yahweh bersama setiap laki-laki Yehuda[a], penduduk Yerusalem, para imam, orang-orang Lewi, dan seluruh rakyat, dari yang besar sampai yang kecil[b]. Lalu ia membacakan kepada mereka segala perkataan kitab perjanjian yang telah ditemukan di Bait Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua laki-laki Yehuda”. Teks Ibrani memakai bentuk tunggal distributif, “setiap laki-laki Yehuda”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dari yang besar sampai yang kecil” berarti semua lapisan masyarakat, dari yang berkedudukan tinggi sampai yang rendah.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata kerja עלה menyatakan gerak naik. Bentuk “naik ke rumah Yahweh” mempertahankan arah gerak menuju kawasan Bait Allah tanpa terasa asing dalam bahasa Indonesia.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Secara harfiah berarti “rumah YHWH”. Pilihan ini mempertahankan ungkapan Ibrani; dalam konteks ini yang dimaksud ialah Bait Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: כָל אִישׁ יְהוּדָה
  choice: setiap laki-laki Yehuda
  rationale: אִישׁ berbentuk tunggal maskulin dan dipakai secara distributif bersama כָל. Terjemahan ini mempertahankan bentuk maskulin yang nyata dalam teks.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: penduduk Yerusalem
  rationale: Partisip ini secara kolektif menunjuk kepada orang-orang yang tinggal di Yerusalem; “penduduk” merupakan padanan Indonesia yang alami.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku bagi kelompok imam dalam konteks ibadah Israel.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan yang jelas dan lazim bagi kelompok suku dan pelayan ibadah ini.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: Mengungkapkan cakupan kolektif dan menyeluruh dari frasa Ibrani.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: dari yang besar sampai yang kecil
  rationale: Mempertahankan citra idiom Ibrani sambil menyatakan bahwa semua lapisan masyarakat hadir.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: ia membacakan kepada mereka
  rationale: Dalam konteks sebuah kitab, קרא berarti membaca dengan suara nyaring. Ungkapan harfiah “di telinga mereka” dinaturalkan menjadi tindakan membacakan kepada mereka.
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: semua perkataan dalam kitab perjanjian
  rationale: “Semua perkataan” menjaga penekanan teks pada keseluruhan isi dokumen, sedangkan “dalam kitab” terdengar lebih alami daripada konstruksi kepunyaan yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Bentuk “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Bahasa bergender dalam כָל אִישׁ יְהוּדָה
  choice: setiap laki-laki Yehuda
  alternative: semua orang Yehuda
  rationale: Teks memakai אִישׁ, “laki-laki/orang”, dalam bentuk tunggal maskulin yang bersifat distributif. Pilihan utama mempertahankan bentuk tersebut, sementara alternatif yang lebih kolektif dicatat tanpa memutuskan bahwa rujukannya harus mencakup atau mengecualikan perempuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dipertahankan, tetapi “bersama” ditambahkan agar rangkaian peserta terbaca alami. Istilah “rumah Yahweh” dipilih untuk menjaga bentuk sumber, sedangkan tindakan membaca nyaring dinyatakan secara idiomatis dengan “membacakan kepada mereka”.
