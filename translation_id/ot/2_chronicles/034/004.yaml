base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: id
  text: Di hadapannya, orang-orang merobohkan mazbah-mazbah para Baal. Ia menebang tugu-tugu pemujaan matahari[a] yang berada di atas mazbah-mazbah itu. Ia menghancurkan dan melumatkan Asyerim[b], patung-patung pahatan, dan patung-patung tuangan, lalu menyebarkan serpihan-serpihan itu di atas makam orang-orang yang telah mempersembahkan kurban kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mazbah-mazbah dupa.” Istilah Ibraninya tidak pasti dan mungkin menunjuk pada tugu kultis yang berkaitan dengan pemujaan matahari.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tiang-tiang Asyera.” Istilah Ibrani ini dapat menunjuk pada benda-benda kultis yang berkaitan dengan Asyera; bentuk fisiknya tidak dapat dipastikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: orang-orang merobohkan
  rationale: Bentuk verba jamak dipertahankan dengan subjek umum 'orang-orang'; נתץ berarti merobohkan atau menghancurkan bangunan.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Menyatakan bahwa tindakan itu berlangsung dalam kehadiran Yosia.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: mazbah-mazbah bagi para Baal
  rationale: Bentuk jamak בְּעָלִים dipertahankan sebagai 'para Baal', yang dapat menunjuk pada berbagai perwujudan lokal Baal.
- source_word: הַחַמָּנִים
  choice: tugu-tugu pemujaan matahari
  rationale: Istilah ini lazim menunjuk pada benda kultis yang berkaitan dengan pemujaan matahari; ketidakpastian maknanya dipertahankan melalui catatan kaki.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: yang berada di atas mazbah-mazbah itu
  rationale: Klausa relatif dipahami menerangkan החמנים dan hubungan posisinya dengan mazbah-mazbah Baal.
- source_word: גִּדֵּעַ
  choice: ia menebang
  rationale: גדע menyatakan tindakan memotong atau menebang benda yang berdiri.
- source_word: הָאֲשֵׁרִים
  choice: tiang-tiang Asyera
  rationale: Ungkapan ini mudah dipahami pembaca Indonesia, sementara catatan kaki menjaga kemungkinan bahwa istilah Ibrani menunjuk secara lebih umum pada benda-benda kultis yang terkait dengan Asyera.
- source_word: הַפְּסִלִים
  choice: patung-patung pahatan
  rationale: פסילים adalah patung kultis yang dibuat dengan cara dipahat.
- source_word: הַמַּסֵּכוֹת
  choice: patung-patung tuangan
  rationale: מסכות menunjuk pada patung yang dibuat dengan menuangkan logam cair ke dalam cetakan.
- source_word: שִׁבַּר וְהֵדַק
  choice: menghancurkan dan melumatkan
  rationale: Pasangan verba ini menyatakan penghancuran yang dilanjutkan hingga benda-benda itu menjadi serpihan atau bahan halus.
- source_word: וַיִּזְרֹק
  choice: lalu menaburkan serpihannya
  rationale: זרק berarti melempar atau menyebarkan; 'menaburkan' sesuai dengan sisa benda yang telah dilumatkan, sedangkan 'serpihannya' menjelaskan objek implisit secara alami.
- source_word: הַזֹּבְחִים לָהֶם
  choice: orang-orang yang dahulu mempersembahkan kurban kepada semua itu
  rationale: Partisipel menunjuk kepada mereka yang mempersembahkan kurban kepada benda-benda atau ilah-ilah kultis tersebut; 'dahulu' memperjelas bahwa mereka kini berada dalam makam.
theological_decisions:
- issue: Makna הַחַמָּנִים
  choice: tugu-tugu pemujaan matahari
  alternative: mazbah-mazbah dupa
  rationale: Hubungan istilah ini dengan kultus matahari didukung secara leksikal, tetapi jenis tepat bendanya tidak pasti; alternatif kontekstual dicantumkan dalam catatan kaki.
- issue: Makna הָאֲשֵׁרִים
  choice: tiang-tiang Asyera
  alternative: benda-benda pemujaan Asyera
  rationale: Terjemahan utama alami dan dikenal luas, tetapi catatan kaki mencegah pembatasan makna seolah-olah bentuk fisiknya pasti berupa tiang.
- issue: Rujukan pronomina לָהֶם
  choice: kepada semua itu
  alternative: kepada mereka
  rationale: Bahasa Ibrani dapat merujuk pada objek-objek kultis atau ilah-ilah yang diwakilinya. Ungkapan 'semua itu' mempertahankan rujukan kolektif tanpa menentukan ontologi ilah-ilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mazbah' dipakai sebagai istilah ringkas untuk altar kurban; struktur kalimat membedakan tindakan jamak para pelaksana dari tindakan Yosia yang dinyatakan dengan verba tunggal. Semua penanda catatan kaki muncul dalam teks utama.
