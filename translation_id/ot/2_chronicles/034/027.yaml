  to: Karena hatimu lembut[a] dan engkau merendahkan diri di hadapan Allah ketika mendengar firman-Nya menentang tempat ini dan penduduknya, dan karena engkau merendahkan diri di hadapan-Ku, mengoyakkan pakaianmu, dan menangis di hadapan-Ku, Aku pun telah mendengarmu, demikianlah firman Yahweh.
