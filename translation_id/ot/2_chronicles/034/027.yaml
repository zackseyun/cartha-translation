reference: 2 Chronicles 34:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/לִּ/פְנֵ֣י אֱלֹהִ֗ים בְּ/שָׁמְעֲ/ךָ֤ אֶת דְּבָרָי/ו֙ עַל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/עַל יֹ֣שְׁבָ֔י/ו וַ/תִּכָּנַ֣ע לְ/פָנַ֔/י וַ/תִּקְרַ֥ע אֶת בְּגָדֶ֖י/ךָ וַ/תֵּ֣בְךְּ לְ/פָנָ֑/י וְ/גַם אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: id
  text: Karena hatimu lembut[a] dan engkau merendahkan diri di hadapan Allah ketika mendengar firman-Nya menentang tempat ini dan penduduknya, dan karena engkau merendahkan diri di hadapan-Ku, mengoyakkan pakaianmu, dan menangis di hadapan-Ku, Aku pun telah mendengarmu, demikianlah firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hatimu lunak.” Ungkapan Ibrani ini menggambarkan sikap batin yang peka, menerima, dan rendah hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Karena
  rationale: Memperkenalkan alasan bagi tanggapan ilahi dan mempertahankan daya kausal bentuk Ibrani.
- source_word: רַךְ לְבָבְךָ
  choice: hatimu lembut
  rationale: Mempertahankan gambaran harfiah 'hati yang lembut' sekaligus menyatakan sikap batin yang peka, menerima, dan rendah hati.
- source_word: וַתִּכָּנַע
  choice: engkau merendahkan diri
  rationale: Bentuk Niphal dalam konteks ini menyatakan tindakan merendahkan diri; terjemahan yang sama dipertahankan pada kedua kemunculannya.
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  choice: di hadapan Allah / di hadapan-Ku
  rationale: Ungkapan ini menyatakan tindakan dalam hadirat Allah; pengulangan dipertahankan demi tekanan retoris.
- source_word: בְּשָׁמְעֲךָ
  choice: ketika mendengar
  rationale: Preposisi dengan infinitif konstruk berfungsi temporal dan paling alami diterjemahkan demikian dalam bahasa Indonesia.
- source_word: דְּבָרָיו
  choice: firman-Nya
  rationale: Dalam konteks ilahi, 'firman' merupakan padanan Indonesia yang wajar bagi perkataan Allah; sufiks orang ketiga merujuk kepada Allah.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: terhadap tempat ini dan terhadap penduduknya
  rationale: '''Terhadap'' mempertahankan kemungkinan nuansa adversatif dalam konteks penghukuman tanpa menjadikannya lebih tegas daripada preposisi Ibrani; pengulangannya dipertahankan.'
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: mengoyakkan pakaianmu
  rationale: Menyampaikan tindakan lahiriah perkabungan dan pertobatan dengan bahasa Indonesia yang jelas.
- source_word: וַתֵּבְךְּ
  choice: menangis
  rationale: Padanan langsung dan alami bagi tangisan dukacita yang khidmat.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: Aku pun telah mendengarmu
  rationale: '''Pun'' menangkap penekanan timbal balik גם; objek ''mu'' dijelaskan dari konteks, sedangkan ''telah'' menunjukkan tindakan yang sudah terjadi dan kini menghasilkan tanggapan.'
- source_word: נְאֻם יְהוָה
  choice: demikianlah firman Yahweh
  rationale: Formula kenabian yang khidmat dan lazim dalam bahasa Indonesia; nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk 'Yehova'.
- issue: Arah perkataan Allah terhadap tempat dan penduduknya
  choice: terhadap
  alternative: menentang; mengenai
  rationale: Konteksnya adalah penghukuman sehingga ada nuansa adversatif, tetapi עַל sendiri dapat lebih luas; 'terhadap' menjaga ketegangan itu tanpa menghilangkan konteks.
- issue: Makna kelembutan hati
  choice: hatimu lembut
  alternative: hatimu lunak; hatimu peka
  rationale: Pilihan ini mempertahankan metafora Ibrani dan tidak mereduksinya hanya menjadi emosi, kelemahan, atau satu kualitas rohani tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur sebab yang panjang dipertahankan agar hubungan antara respons Yosia dan jawaban Yahweh tetap jelas.
