  naturalness: Bahasa draft pada umumnya baku, jelas, dan bernada khidmat. 'Menentang tempat ini dan penduduknya' tetap alami dalam register Alkitab modern dan lebih langsung daripada pengulangan 'terhadap'.
  terminology: '''Allah'', ''firman-Nya'', ''merendahkan diri'', dan ''Yahweh'' digunakan secara konsisten dan sesuai konteks. Catatan kaki untuk ''lembut'' secara memadai mempertahankan alternatif harfiah ''lunak'' serta makna idiomatiknya.'
