id: 2CH.34.7
reference: 2 Chronicles 34:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: id
  text: Ia merobohkan mezbah-mezbah dan benda-benda pemujaan Asyera[a], meremukkan patung-patung pahatan hingga menjadi serbuk, serta menebang semua tugu pemujaan[b] di seluruh negeri Israel. Kemudian ia kembali ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang-tiang Asyera.” Istilah Ibrani ini menunjuk pada benda-benda pemujaan yang berkaitan dengan dewi Asyera; bentuk persisnya dapat berbeda menurut konteks.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini mungkin menunjuk pada tugu-tugu matahari atau tempat pembakaran dupa; identitas tepatnya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: ia merobohkan
  rationale: Kata נָתַץ menyatakan tindakan meruntuhkan atau menghancurkan bangunan; “merobohkan” alami dan tepat untuk mezbah serta perlengkapan pemujaan.
- source_word: הַמִּזְבְּחוֹת
  choice: mezbah-mezbah
  rationale: Padanan baku dan mudah dipahami untuk bentuk jamak מִזְבֵּחַ dalam konteks tempat persembahan.
- source_word: הָאֲשֵׁרִים
  choice: benda-benda pemujaan Asyera
  rationale: Bentuk jamak ini menunjuk pada objek kultis yang berkaitan dengan Asyera. Ungkapan tersebut mempertahankan kaitan khususnya tanpa memastikan bahwa semua objek itu berbentuk tiang.
- source_word: הַפְּסִלִים
  choice: patung-patung pahatan
  rationale: פְּסִילִים secara khusus menunjuk pada patung atau gambar kultis yang dipahat; pilihan ini lebih tepat daripada istilah umum “berhala”.
- source_word: כִּתַּת לְהֵדַק
  choice: meremukkan ... hingga menjadi serbuk
  rationale: Gabungan kata ini menggambarkan penghancuran sampai menjadi partikel-partikel halus.
- source_word: הַחַמָּנִים
  choice: tugu pemujaan
  rationale: Identitas tepat benda kultis ini diperdebatkan. “Tugu pemujaan” mempertahankan sifat dan kemungkinan bentuknya tanpa memastikan kaitannya dengan matahari atau dupa.
- source_word: גִּדַּע
  choice: menebang
  rationale: גָּדַע berarti memotong atau menebang, sesuai untuk benda-benda kultis yang berdiri.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: di seluruh negeri Israel
  rationale: Mengungkapkan cakupan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: Kemudian ia kembali ke Yerusalem
  rationale: “Kemudian” menyampaikan kelanjutan urutan naratif dari bentuk wayyiqtol.
theological_decisions:
- issue: Penerjemahan istilah-istilah khusus bagi benda pemujaan berhala
  choice: Menyebut mezbah, benda pemujaan Asyera, patung pahatan, dan tugu pemujaan secara tersendiri
  alternative: Meratakan semuanya menjadi istilah umum seperti “berhala dan tempat pemujaan”
  rationale: Pilihan ini mempertahankan rincian konkret dalam tindakan reformasi Yosia dan tidak menambahkan penafsiran doktrinal yang tidak dinyatakan teks.
- issue: Identifikasi הַחַמָּנִים
  choice: tugu pemujaan
  alternative: mezbah dupa atau tugu matahari
  rationale: Makna tepat istilah tersebut tidak pasti. Terjemahan utama dibuat cukup spesifik untuk menunjukkan objek kultis yang berdiri, tetapi tidak menyelesaikan perdebatan mengenai fungsi atau hubungannya dengan matahari secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah kultis yang tidak pasti diterangkan secara deskriptif, sedangkan alternatif penting dipertahankan dalam catatan kaki.
