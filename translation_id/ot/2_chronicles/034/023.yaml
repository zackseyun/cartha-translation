  edition: WLC
  text: וַ/תֹּ֣אמֶר לָ/הֶ֔ם כֹּה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: id
  text: 'Lalu ia berkata kepada mereka, “Beginilah firman Yahweh[a], Allah Israel: Katakanlah kepada orang yang mengutus kalian kepadaku,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: יהוה (YHWH), nama ilahi yang secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan transliterasi nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: Lalu ia berkata kepada mereka
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Lalu” menyampaikan alur tersebut secara alami; “ia” tidak menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ini adalah rumusan baku penyampaian pesan ilahi. “Beginilah firman” alami dalam ragam Alkitab Indonesia dan mempertahankan bobot deklaratif rumusan Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan frasa konstruksi secara ringkas dan alami sebagai sebutan bagi Allah yang terkait dengan Israel.
- source_word: אִמְרוּ
  choice: Katakanlah
  rationale: Imperatif jamak ini ditujukan kepada rombongan utusan. Bahasa Indonesia tidak perlu menandai jumlah pada bentuk imperatifnya.
- source_word: לָאִישׁ אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: kepada orang yang mengutus kalian kepadaku
  rationale: “Orang” merupakan padanan alami bagi אִישׁ dalam konteks rujukan kepada seseorang tertentu, sedangkan “kalian” mempertahankan objek orang kedua jamak אֶתְכֶם.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama itu, sementara kebiasaan tradisional “TUHAN” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk “kalian” dipakai untuk memperjelas bahwa kata ganti Ibrani berbentuk jamak. Tanda koma penutup dipertahankan karena ucapan berlanjut pada ayat berikutnya.
