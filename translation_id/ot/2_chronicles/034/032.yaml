  text: וַ/יַּעֲמֵ֕ד אֵ֛ת כָּל הַ/נִּמְצָ֥א בִ/ירוּשָׁלִַ֖ם וּ/בִנְיָמִ֑ן וַֽ/יַּעֲשׂוּ֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כִּ/בְרִ֥ית אֱלֹהִ֖ים אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: id
  text: Lalu ia menyuruh semua orang yang ada di Yerusalem dan Benyamin berpegang pada perjanjian itu.[a] Penduduk Yerusalem pun bertindak sesuai dengan perjanjian Allah, Allah nenek moyang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyuruh semua orang yang ada di Yerusalem dan Benyamin berdiri.” Dalam konteks ini, tindakan berdiri dapat menyatakan keteguhan atau komitmen pada perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: menyuruh ... berpegang pada perjanjian itu
  rationale: Bentuk Hifil dari עמד secara harfiah berarti ‘membuat/menyuruh berdiri’. Dalam konteks pembaruan perjanjian, tindakan itu menyatakan keteguhan atau komitmen terhadap perjanjian. Terjemahan ini menyampaikan makna kontekstual secara alami, sedangkan catatan kaki mempertahankan gambaran harfiahnya.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: semua orang yang ada
  rationale: Partisip pasif נמצא mencakup seluruh orang yang didapati atau hadir di tempat itu. ‘Semua orang yang ada’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בִירוּשָׁלַם וּבִנְיָמִן
  choice: di Yerusalem dan Benyamin
  rationale: Nama tempat dipertahankan sebagaimana bunyi teks Ibrani. ‘Benyamin’ kemungkinan menunjuk pada wilayah suku Benyamin, tetapi teks tidak menyebut kata ‘wilayah’ secara eksplisit.
- source_word: וַיַּעֲשׂוּ
  choice: bertindak
  rationale: עשה dengan כ dan ‘perjanjian’ menyatakan tindakan yang selaras dengan perjanjian. ‘Bertindak sesuai dengan’ alami dan tidak menambahkan gagasan bahwa mereka telah menaatinya secara sempurna.
- source_word: יֹשְׁבֵי יְרוּשָׁלַם
  choice: Penduduk Yerusalem
  rationale: Ungkapan ini secara langsung menunjuk kepada orang-orang yang tinggal di Yerusalem.
- source_word: כִּבְרִית
  choice: sesuai dengan perjanjian
  rationale: Prefiks כ menandai kesesuaian atau keselarasan; ‘sesuai dengan’ menyampaikan hubungan tersebut dengan jelas.
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah, Allah nenek moyang mereka
  rationale: Pengulangan ‘Allah’ mempertahankan aposisi dan penekanan teks Ibrani. ‘Nenek moyang’ merupakan padanan Indonesia yang wajar untuk אבות dalam konteks sejarah umat.
theological_decisions:
- issue: Makna tindakan Yosia dalam pembaruan perjanjian
  choice: Yosia mengharuskan semua orang yang hadir berpegang pada perjanjian
  alternative: Yosia hanya menyuruh mereka berdiri secara fisik, atau secara formal memasukkan mereka ke dalam perjanjian
  rationale: Konteks mendukung komitmen terhadap perjanjian, tetapi verba Ibrani tetap memakai gambaran ‘berdiri’ dan tidak secara eksplisit menyebut upacara masuk ke dalam perjanjian. Teks utama menyampaikan makna kontekstual, sementara catatan kaki menjaga bentuk dan ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami, dengan pengulangan ‘Allah’ dipertahankan untuk mencerminkan penekanan teks Ibrani.
