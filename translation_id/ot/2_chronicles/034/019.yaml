base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: id
  text: Ketika raja mendengar kata-kata hukum itu[a], ia mengoyakkan pakaiannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengajaran itu”. Kata Ibrani torah dapat berarti pengajaran secara lebih luas, meskipun di sini kata itu menunjuk pada hukum perjanjian yang dibacakan di hadapan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Bentuk naratif ini mengantar peristiwa yang dilanjutkan oleh klausa waktu. Dalam bahasa Indonesia modern, ungkapan harfiah seperti “terjadilah” tidak diperlukan; hubungan waktunya sudah dinyatakan secara alami oleh “ketika”.
- source_word: כִּשְׁמֹעַ
  choice: ketika ... mendengar
  rationale: Preposisi כ dengan infinitif konstruk שׁמע menyatakan keadaan waktu; “ketika ... mendengar” alami dan tetap mempertahankan urutan peristiwa.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tertentu ini dipertahankan sebagai gelar sebagaimana dalam teks Ibrani, tanpa menggantinya dengan nama Yosia yang diketahui dari konteks.
- source_word: דִּבְרֵי
  choice: kata-kata
  rationale: Bentuk jamak konstruk dari דבר di sini menunjuk pada perkataan atau isi yang dibacakan. “Kata-kata” mempertahankan bentuk konkret teks sumber dan mudah dipahami.
- source_word: הַתּוֹרָה
  choice: hukum itu
  rationale: תורה dapat berarti pengajaran secara luas, tetapi dalam konteks ini menunjuk pada kumpulan hukum perjanjian yang dibacakan kepada raja. “Hukum itu” menyampaikan fungsi kontekstualnya, sementara alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: וַיִּקְרַע
  choice: ia mengoyakkan
  rationale: קרע berarti merobek atau mengoyakkan pakaian sebagai tanda dukacita, keguncangan, atau penyesalan. “Mengoyakkan” bernada wajar dan bermartabat dalam narasi Alkitab.
- source_word: בְּגָדָיו
  choice: pakaiannya
  rationale: בגד merupakan istilah umum untuk pakaian. Bentuk ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi jubah atau pakaian kerajaan.
theological_decisions:
- issue: Penerjemahan תורה dalam konteks pembaruan Yosia
  choice: hukum itu
  alternative: pengajaran itu; Taurat itu
  rationale: Konteks menunjuk pada isi kitab perjanjian yang bersifat hukum. “Hukum itu” menyampaikan daya kontekstual tersebut tanpa memastikan secara berlebihan batas atau identitas kanonis kitab yang ditemukan. Makna lebih luas “pengajaran” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. Struktur dibuat alami tanpa ungkapan arkais seperti “maka terjadilah”, dan gelar “raja” dipertahankan sesuai teks sumber.
