source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: id
  text: Mereka menyerahkannya kepada para pekerja yang ditugaskan di rumah Yahweh[a], dan mereka menyerahkannya kepada para pekerja yang melakukan pekerjaan di rumah Yahweh untuk memperbaiki dan memperkuat rumah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah Yahweh” berarti bait tempat ibadah kepada Yahweh.
    reason: cultural_note
  - marker: b
    text: 'Atau: “untuk memugar dan mengokohkan rumah itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: menyerahkannya / menggunakannya
  rationale: נתן berarti memberi, menaruh, atau menyerahkan. Pada klausa pertama, 'menyerahkannya' menyatakan pemindahan dana kepada pihak yang bertanggung jawab; pada klausa kedua, konteks tujuan pekerjaan membuat 'menggunakannya' lebih alami dalam bahasa Indonesia, tanpa mengubah acuan dana tersebut.
- source_word: עַל יַד
  choice: kepada
  rationale: Ungkapan harfiah 'ke atas tangan' menyatakan penyerahan ke dalam kuasa atau tanggung jawab seseorang. 'Kepada' bersama verba 'menyerahkan' menyampaikan idiom itu secara alami.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: para pekerja
  rationale: Partisip tunggal ini dipakai secara kolektif untuk orang-orang yang melaksanakan pekerjaan; bentuk jamak Indonesia memperjelas makna kolektifnya.
- source_word: הַמֻּפְקָדִים
  choice: yang ditugaskan mengawasi
  rationale: Partisip pasif dari פקד menunjukkan orang-orang yang diberi tanggung jawab pengawasan. Pilihan ini mempertahankan unsur penugasan dan fungsi mereka.
- source_word: בְּבֵית יְהוָה
  choice: mengawasi rumah Yahweh / di rumah Yahweh
  rationale: Preposisi ב dapat mengikuti gagasan penugasan atas pekerjaan di bangunan itu, lalu secara langsung menyatakan lokasi pada klausa berikutnya. 'Rumah Yahweh' mempertahankan ungkapan Ibrani.
- source_word: אֹתוֹ
  choice: -nya
  rationale: Pronomina ini mengacu kepada uang dalam konteks sebelumnya. Bentuk enklitik Indonesia mempertahankan rujukan pronominal tanpa menambahkan nomina yang tidak terdapat dalam ayat.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: para pekerja yang bekerja
  rationale: Pilihan ini mempertahankan pengulangan akar עשה secara wajar dan menunjukkan kegiatan yang sedang berlangsung.
- source_word: לִבְדּוֹק
  choice: untuk memperbaiki
  rationale: Dalam konteks pemugaran bait, בדק menunjuk pada perbaikan kerusakan atau cacat bangunan, bukan sekadar pemeriksaan.
- source_word: וּלְחַזֵּק
  choice: dan memperkuat
  rationale: Bentuk piel חזק berarti membuat kuat atau kokoh; 'memperkuat' adalah padanan langsung dan alami.
- source_word: הַבָּיִת
  choice: bangunan tersebut
  rationale: Secara harfiah berarti 'rumah itu' dan mengacu kepada rumah Yahweh. 'Bangunan tersebut' menghindari kesan rumah tinggal sekaligus mempertahankan acuan yang sama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memuat nama diri ilahi. 'Yahweh' mempertahankan nama itu secara transparan tanpa menggantinya dengan gelar atau memilih bentuk alternatif Yehuwa.
- issue: Makna בַּיִת dalam ungkapan rumah Yahweh
  choice: rumah Yahweh, dengan catatan bahwa yang dimaksud ialah bait
  alternative: bait Yahweh
  rationale: Mempertahankan metafora asli 'rumah' sambil menjelaskan acuan budayanya, tanpa mengaburkan bahwa bangunan itu adalah bait.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara pengulangan 'pekerja ... bekerja', nama Yahweh, dan gambaran 'rumah Yahweh' dipertahankan sejauh wajar.
