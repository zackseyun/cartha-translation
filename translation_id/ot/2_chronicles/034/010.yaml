revisions:
- from: Mereka menyerahkannya kepada para pekerja yang ditugaskan mengawasi rumah Yahweh[a]. Kemudian para pekerja yang bekerja di rumah Yahweh itu menggunakannya untuk memperbaiki dan memperkuat bangunan tersebut.[b]
  to: Mereka menyerahkannya kepada para pekerja yang ditugaskan di rumah Yahweh[a], dan mereka menyerahkannya kepada para pekerja yang melakukan pekerjaan di rumah Yahweh untuk memperbaiki dan memperkuat rumah itu.[b]
  rationale: Revisi memulihkan arti kedua kemunculan וַיִּתְּנוּ sebagai tindakan menyerahkan/memberikan dan menerjemahkan penerima pada klausa kedua. Subjek jamak yang tersirat dibiarkan sebagai “mereka” pada kedua klausa agar tidak memaksakan identifikasi pelaku yang diperdebatkan dalam susunan kalimat Ibrani. Catatan kaki dipertahankan dengan jangkar yang ditempatkan pada unsur yang dijelaskannya.
