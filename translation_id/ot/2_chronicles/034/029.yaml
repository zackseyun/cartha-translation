  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: id
  text: Kemudian raja mengutus orang[a] dan mengumpulkan semua tua-tua Yehuda dan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “raja mengutus”; objek kata kerja ini tidak disebutkan dalam bahasa Ibrani.
    reason: Menandai bahwa 'orang' adalah pelengkapan idiomatis bahasa Indonesia dan mempertahankan ketaktertentuan teks sumber.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus orang
  rationale: Bentuk ini mempertahankan arti dasar שׁלח, ‘mengutus’, sekaligus menghasilkan bahasa Indonesia yang wajar dalam konteks pemanggilan para tua-tua. Objek yang diutus tidak dinyatakan dalam bahasa Ibrani sehingga diterjemahkan secara umum sebagai ‘orang’, tanpa menambahkan gagasan eksplisit tentang pesan.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit ini merujuk kepada Yosia dalam konteks, tetapi teks memakai gelar, bukan nama; bahasa Indonesia tidak memerlukan kata sandang tertentu.
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: אָסף berarti mengumpulkan atau menghimpun. ‘Mengumpulkan’ alami dan tepat untuk tindakan menghimpun para tua-tua.
- source_word: אֶת כָּל
  choice: semua
  rationale: אֶת adalah penanda objek langsung dan tidak diterjemahkan, sedangkan כָּל menyatakan keseluruhan kelompok.
- source_word: זִקְנֵי
  choice: tua-tua
  rationale: Dalam konteks ini זִקְנֵי menunjuk kepada para pemimpin masyarakat yang diakui, bukan sekadar orang berusia lanjut. ‘Tua-tua’ mempertahankan istilah jabatan tradisional yang masih dipahami dalam bahasa Alkitab Indonesia.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Yehuda dan Yerusalem
  rationale: Frasa konstruksi ini menyatakan bahwa para tua-tua berasal dari atau mewakili Yehuda dan Yerusalem; susunan Indonesia dapat menyatakannya langsung tanpa mengulang preposisi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Urutan dua tindakan dalam teks Ibrani dipertahankan. ‘Mengutus orang’ dipilih agar וַיִּשְׁלַח tidak dibiarkan tanpa objek secara tidak wajar dalam bahasa Indonesia, tetapi juga tidak diperjelas menjadi ‘mengirim pesan’, yang tidak dinyatakan secara eksplisit.
