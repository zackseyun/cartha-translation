  text: וְ/עַ֣ל הַ/סַּבָּלִ֗ים וּֽ/מְנַצְּחִים֙ לְ/כֹל֙ עֹשֵׂ֣ה מְלָאכָ֔ה לַ/עֲבוֹדָ֖ה וַ/עֲבוֹדָ֑ה וּ/מֵֽ/הַ/לְוִיִּ֔ם סוֹפְרִ֥ים וְ/שֹׁטְרִ֖ים וְ/שׁוֹעֲרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: id
  text: Mereka mengepalai para pengangkut beban dan mengawasi semua orang yang melakukan pekerjaan untuk setiap tugas[a]; di antara orang Lewi ada juru tulis, para pejabat, dan penjaga gerbang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk tugas dan tugas.” Pengulangan ini kemungkinan menyatakan pembagian menurut berbagai tugas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: mengawasi para pengangkut beban
  rationale: Dalam konteks administratif, עַל menunjukkan kewenangan atau pengawasan, sedangkan סַבָּלִים secara khusus menunjuk kepada orang-orang yang mengangkut beban.
- source_word: וּמְנַצְּחִים
  choice: dan memimpin
  rationale: Partisip dari נצח di sini menyatakan pengarahan atau pengawasan atas para pekerja. 'Memimpin' alami dalam bahasa Indonesia dan tidak mengulang 'mengawasi' secara kaku.
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: semua orang yang melakukan pekerjaan
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh כֹל dan nuansa partisip עֹשֵׂה.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: masing-masing menurut tugasnya
  rationale: Pengulangan עֲבוֹדָה paling mungkin bersifat distributif, yakni para pekerja diarahkan menurut berbagai tugas. Ungkapan ini menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia.
- source_word: וּמֵהַלְוִיִּם
  choice: sebagian dari orang Lewi
  rationale: 'Konstruksi מִן bersifat partitif: hanya sebagian orang Lewi yang menjalankan peran-peran yang disebutkan berikutnya.'
- source_word: סוֹפְרִים
  choice: juru tulis
  rationale: Istilah ini menunjuk kepada para penulis atau pencatat resmi; 'juru tulis' merupakan padanan Indonesia yang mapan.
- source_word: שֹׁטְרִים
  choice: pengatur
  rationale: Dalam konteks ini שֹׁטְרִים adalah pejabat yang mengatur atau mengawasi pekerjaan. 'Pengatur' menghindari kesan modern kepolisian atau militer yang dapat muncul dari 'petugas' atau 'perwira'.
- source_word: שׁוֹעֲרִים
  choice: penjaga pintu gerbang
  rationale: Istilah ini secara langsung menunjuk kepada orang-orang yang bertugas menjaga gerbang, khususnya dalam lingkungan Bait Allah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kesinambungan dengan ayat sebelumnya melalui subjek 'mereka'. Pengulangan harfiah 'untuk tugas dan tugas' tidak dipertahankan karena tidak alami dalam bahasa Indonesia; daya distributifnya dinyatakan dengan 'masing-masing menurut tugasnya'.
