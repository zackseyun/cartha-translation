- from: Mereka mengawasi para pengangkut beban dan memimpin semua orang yang melakukan pekerjaan, masing-masing menurut tugasnya; sebagian dari orang Lewi menjadi juru tulis, pengatur, dan penjaga pintu gerbang.
  to: Mereka mengepalai para pengangkut beban dan mengawasi semua orang yang melakukan pekerjaan untuk setiap tugas[a]; di antara orang Lewi ada juru tulis, para pejabat, dan penjaga gerbang.
