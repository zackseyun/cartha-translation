  to: Kemudian raja berdiri di tempatnya dan mengadakan perjanjian di hadapan Yahweh untuk mengikuti Yahweh serta menaati perintah-perintah-Nya, peringatan-peringatan-Nya, dan ketetapan-ketetapan-Nya dengan segenap hati dan segenap jiwanya, dan untuk melaksanakan perkataan perjanjian yang tertulis dalam kitab[a] ini.
