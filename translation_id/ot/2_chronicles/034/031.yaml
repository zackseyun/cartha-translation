  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: id
  text: Kemudian raja berdiri di tempatnya dan mengadakan perjanjian di hadapan Yahweh untuk mengikuti Yahweh serta menaati perintah-perintah-Nya, peringatan-peringatan-Nya, dan ketetapan-ketetapan-Nya dengan segenap hati dan segenap jiwanya, dan untuk melaksanakan perkataan perjanjian yang tertulis dalam kitab[a] ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih sesuai dengan bentuk dokumennya pada masa itu, "gulungan ini." Kata Ibrani yang dipakai dapat menunjuk pada dokumen tertulis berbentuk gulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: raja berdiri di tempatnya
  rationale: Menerjemahkan tindakan berdiri dan idiom עַל־עָמְדוֹ secara alami tanpa menentukan bahwa tempat itu berupa panggung atau lokasi arsitektural tertentu.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani secara harfiah berarti 'memotong perjanjian', tetapi 'mengikat perjanjian' merupakan padanan Indonesia yang alami dan tetap mempertahankan perjanjian tertentu dalam konteks pembaruan ini.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menunjukkan tindakan khidmat dalam hadirat Yahweh dan mempertahankan nama ilahi yang terdapat dalam teks.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: untuk hidup mengikuti Yahweh
  rationale: Mengungkap metafora berjalan sebagai pola hidup dalam bahasa Indonesia yang jelas, sambil mempertahankan unsur mengikuti Yahweh.
- source_word: לִשְׁמוֹר
  choice: menaati
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti memelihara atau menaati kewajiban; 'menaati' paling langsung dan alami bagi pembaca modern.
- source_word: מִצְוֺתָיו
  choice: perintah-perintah-Nya
  rationale: מצוה menunjuk pada hal-hal yang diperintahkan dan dibedakan dari dua istilah hukum berikutnya.
- source_word: עֵדְוֺתָיו
  choice: ketetapan-ketetapan-Nya
  rationale: עדות dalam konteks hukum perjanjian menunjuk pada ketentuan yang menjadi kesaksian; 'ketetapan' terdengar alami, meskipun nuansa leksikalnya bertumpang tindih dengan חקים.
- source_word: חֻקָּיו
  choice: hukum-hukum-Nya
  rationale: חקים adalah ketentuan hukum yang ditetapkan. Pilihan ini mempertahankan deretan tiga kategori hukum tanpa memakai istilah Indonesia yang sama dua kali.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: dengan segenap hati dan segenap jiwanya
  rationale: Mempertahankan rumusan perjanjian yang bergaung dengan Ulangan serta istilah 'hati' dan 'jiwa' yang penting secara tekstual.
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: untuk melaksanakan perkataan-perkataan perjanjian
  rationale: עשה di sini menyatakan pelaksanaan atau ketaatan, sedangkan terjemahan formal 'perkataan-perkataan perjanjian' mempertahankan ungkapan sumber tanpa mengubahnya menjadi 'syarat-syarat'.
- source_word: הַסֵּפֶר הַזֶּה
  choice: kitab ini
  rationale: סֵפֶר dapat berarti kitab, dokumen tertulis, atau gulungan. 'Kitab' alami dalam konteks Indonesia, sedangkan bentuk historis medianya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Metafora perjanjian לָלֶכֶת אַחֲרֵי יְהוָה
  choice: hidup mengikuti Yahweh
  alternative: berjalan mengikuti Yahweh atau mengikuti Yahweh
  rationale: Pilihan ini mempertahankan gagasan perjalanan sebagai pola hidup, tetapi menghindari ungkapan Indonesia yang dapat terdengar terlalu harfiah atau sekadar menunjuk gerak fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur perjanjian serta deretan istilah hukum dipertahankan sejauh mungkin, sambil menggunakan susunan yang mudah dipahami pembaca umum. Penanda catatan kaki [a] ditempatkan langsung sesudah kata yang dijelaskan.
