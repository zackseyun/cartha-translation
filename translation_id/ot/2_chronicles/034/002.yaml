base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh[a] dan mengikuti jalan-jalan Daud, leluhurnya[b]. Ia tidak menyimpang ke kanan atau ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam pandangan TUHAN.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Daud, ayahnya.” Dalam bahasa dinasti Ibrani, “ayah” dapat berarti leluhur.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ia melakukan apa yang benar
  rationale: Ungkapan ini menyampaikan rumusan penilaian moral terhadap seorang raja secara alami dalam bahasa Indonesia, sementara makna dasar עשה, ‘melakukan’, tetap dipertahankan.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani tentang penilaian ilahi dan tetap mudah dipahami oleh pembaca Indonesia.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: mengikuti jalan hidup
  rationale: Secara harfiah ungkapan ini berbicara tentang ‘berjalan di jalan-jalan’. Pilihan ‘mengikuti jalan hidup’ mempertahankan metafora perilaku sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: דָּוִיד אָבִיו
  choice: Daud, bapaknya
  rationale: Kata אָב dapat berarti bapak maupun leluhur. Terjemahan utama mempertahankan sebutan kekeluargaan dan nuansa dinasti teks Ibrani; catatan kaki menjelaskan bahwa Daud adalah leluhur Yosia.
- source_word: וְלֹא סָר
  choice: Ia tidak menyimpang
  rationale: Kata סור menggambarkan tindakan berbelok atau meninggalkan jalur. ‘Tidak menyimpang’ menyampaikan makna etisnya dan tetap selaras dengan gambaran jalan.
- source_word: יָמִין וּשְׂמֹאול
  choice: ke kanan ataupun ke kiri
  rationale: Pilihan ini mempertahankan ungkapan tetap Ibrani yang menegaskan bahwa ia sama sekali tidak menyimpang dari jalan yang benar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk ‘Yahweh’ mempertahankan nama tersebut, sedangkan ‘TUHAN’ dicantumkan sebagai padanan tradisional dalam catatan kaki.
- issue: Makna אָבִיו dalam hubungan Yosia dengan Daud
  choice: bapaknya, dengan penjelasan bahwa maksudnya ialah leluhur dinasti
  alternative: leluhurnya
  rationale: Bahasa kerajaan Ibrani dapat menyebut seorang leluhur sebagai ‘bapak’. Pilihan ini mempertahankan idiom dan hubungan dinasti tanpa menyatakan bahwa Daud adalah ayah kandung Yosia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan ‘di mata’ serta gambaran jalan dipertahankan sejauh tetap alami; ‘mengikuti jalan hidup’ dipilih untuk menghindari susunan harfiah yang kaku.
