  text: וּ/בְ/הוֹצִיאָ֣/ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה מָצָא֙ חִלְקִיָּ֣הוּ הַ/כֹּהֵ֔ן אֶת סֵ֥פֶר תּֽוֹרַת יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: id
  text: Ketika mereka mengeluarkan perak yang telah dibawa masuk ke rumah Yahweh, Imam Hilkia menemukan Kitab Taurat Yahweh yang disampaikan melalui Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “oleh tangan Musa”; ungkapan Ibrani ini dapat menyatakan bahwa Taurat diberikan atau disampaikan melalui Musa.'
    reason: Menjelaskan idiom Ibrani בְּיַד tanpa membatasi maknanya hanya pada kepenulisan.
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: Ketika mereka mengeluarkan
  rationale: Gabungan waw, preposisi בְּ, infinitif konstruk הוֹצִיא, dan sufiks orang ketiga jamak membentuk klausa waktu. Ungkapan ini diterjemahkan secara wajar tanpa menghilangkan hubungan temporalnya.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: כֶּסֶף dapat berarti 'perak' maupun 'uang'. 'Perak' mempertahankan bentuk leksikal Ibrani, sementara konteks menunjukkan bahwa yang dimaksud adalah dana yang dikumpulkan.
- source_word: הַמּוּבָא בֵּית יְהוָה
  choice: yang telah dibawa masuk ke rumah Yahweh
  rationale: Partisipel Hofal הַמּוּבָא menyatakan tindakan pasif, yaitu 'dibawa masuk'. Bentuk 'telah dibawa' memperjelas bahwa pemasukan dana itu mendahului pengeluarannya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora sumber 'rumah' dan nama perjanjian יְהוָה, tanpa menggantinya dengan istilah yang lebih interpretatif seperti 'Bait Allah'.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: Imam Hilkia
  rationale: Susunan ini alami dalam bahasa Indonesia modern dan tetap menyatakan jabatan Hilkia.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: Kitab Taurat Yahweh
  rationale: סֵפֶר dapat menunjuk kitab, gulungan, atau dokumen; 'Kitab' sesuai dengan konteks dan pemakaian Indonesia. תּוֹרָה memiliki cakupan 'pengajaran' dan 'hukum'; 'Taurat' merupakan istilah Indonesia yang mapan dalam konteks ini.
- source_word: בְּיַד מֹשֶׁה
  choice: yang disampaikan melalui tangan Musa
  rationale: Ungkapan harfiah 'melalui tangan Musa' dipertahankan, sedangkan 'disampaikan' membuat hubungannya dengan Kitab Taurat jelas dan wajar dalam bahasa Indonesia. Catatan kaki menjaga akses kepada idiom Ibraninya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama perjanjian tersebut dan membedakannya dari gelar 'Tuhan'.
- issue: Hubungan Musa dengan Kitab Taurat dalam ungkapan בְּיַד מֹשֶׁה
  choice: yang disampaikan melalui tangan Musa
  alternative: yang ditulis oleh Musa
  rationale: Ungkapan Ibrani menyatakan tangan, perantaraan, atau keagenan Musa, tetapi tidak secara eksplisit memakai kata kerja 'menulis'. Terjemahan ini tidak mempersempitnya menjadi pernyataan khusus tentang kepenulisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan 'rumah Yahweh', 'perak', dan metafora 'melalui tangan Musa' yang penting dalam teks sumber.
