  terminology: '"Asyera" dan catatan kaki yang mempertahankan ketidakpastian bentuk אֲשֵׁרִים sudah baik. "Patung-patung pahatan" dan "patung-patung tuangan" membedakan שתי kategori benda dengan tepat. Catatan kaki tentang "bapaknya" dengan tepat menjelaskan idiom dinasti tanpa memaksakan bahwa Daud adalah ayah langsung Yosia.'
