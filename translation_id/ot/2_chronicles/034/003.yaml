source:
  edition: WLC
  text: וּ/בִ/שְׁמוֹנֶ֨ה שָׁנִ֜ים לְ/מָלְכ֗/וֹ וְ/הוּא֙ עוֹדֶ֣/נּוּ נַ֔עַר הֵחֵ֕ל לִ/דְר֕וֹשׁ לֵ/אלֹהֵ֖י דָּוִ֣יד אָבִ֑י/ו וּ/בִ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה שָׁנָ֗ה הֵחֵל֙ לְ/טַהֵ֔ר אֶת יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִן הַ/בָּמוֹת֙ וְ/הָ֣/אֲשֵׁרִ֔ים וְ/הַ/פְּסִלִ֖ים וְ/הַ/מַּסֵּכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: id
  text: Pada tahun kedelapan pemerintahannya, ketika ia masih muda, ia mulai mencari Allah yang disembah oleh Daud, leluhurnya.[a] Pada tahun kedua belas pemerintahannya, ia mulai menyucikan Yehuda dan Yerusalem dari tempat-tempat pemujaan di bukit, lambang-lambang Asyera,[b] patung-patung pahatan, dan patung-patung tuangan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah Daud, bapaknya.” Dalam bahasa kerajaan, “bapak” dapat berarti leluhur.
    reason: lexical_alternative
  - marker: b
    text: Atau “tiang-tiang Asyera.” Istilah Ibrani ini dapat menunjuk kepada tiang, pohon keramat, atau lambang kultis yang berkaitan dengan Asyera.
    reason: lexical_alternative
  - marker: c
    text: Patung-patung yang dibuat dengan menuangkan logam cair ke dalam cetakan.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: Pada tahun kedelapan pemerintahannya
  rationale: Ungkapan tahun dengan ב bersifat temporal, sedangkan לְמָלְכוֹ menetapkan bahwa yang dihitung ialah tahun pemerintahannya.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: ketika ia masih muda
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau orang muda. Dalam konteks usia Yosia, “masih muda” mempertahankan rentang maknanya tanpa memberi kesan bahwa ia masih anak kecil.
- source_word: הֵחֵל לִדְרוֹשׁ
  choice: ia mulai mencari
  rationale: דרשׁ ketika berobjek Allah mencakup tindakan berpaling kepada-Nya dan mencari-Nya secara rohani, bukan sekadar meminta informasi.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: Allah yang disembah Daud, leluhurnya
  rationale: Konstruksi “Allah Daud” menyatakan hubungan ibadah atau kesetiaan Daud kepada Allah. אָבִיו secara harfiah dapat berarti “bapaknya”, tetapi dalam silsilah kerajaan menunjuk kepada leluhur; susunan ini dibuat alami dan tidak menimbulkan kesan keliru bahwa Daud adalah ayah langsung Yosia.
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Pada tahun kedua belas
  rationale: Acuan kepada tahun pemerintahan tetap tersirat dari frasa sebelumnya dan jelas dalam urutan narasi.
- source_word: הֵחֵל לְטַהֵר
  choice: ia mulai menahirkan
  rationale: טהר di sini menunjuk pada pembersihan dari kenajisan kultis. “Menahirkan” mempertahankan dimensi keagamaan dan ritual yang lebih khusus daripada sekadar “membersihkan”.
- source_word: מִן הַבָּמוֹת
  choice: dari tempat-tempat pemujaan di bukit
  rationale: בָּמוֹת adalah lokasi pemujaan setempat yang secara tradisional disebut “tempat-tempat tinggi”. Terjemahan ini menjelaskan fungsi kultisnya dengan bahasa Indonesia yang mudah dipahami.
- source_word: וְהָאֲשֵׁרִים
  choice: lambang-lambang Asyera
  rationale: Bentuk jamak ini dapat menunjuk kepada tiang, pohon keramat, atau benda kultis lain yang berkaitan dengan Asyera. “Lambang-lambang” tidak membatasi bentuk bendanya secara berlebihan.
- source_word: וְהַפְּסִלִים
  choice: patung-patung pahatan
  rationale: פְּסִלִים menunjuk kepada patung atau gambar yang dibentuk dengan memahat; pilihan ini mempertahankan cara pembuatannya.
- source_word: וְהַמַּסֵּכוֹת
  choice: patung-patung tuangan
  rationale: מַסֵּכוֹת menunjuk kepada benda yang dibuat dengan menuangkan bahan cair, khususnya logam, ke dalam cetakan.
theological_decisions:
- issue: Bahasa leluhur dalam frasa “Daud, bapaknya”
  choice: leluhurnya
  alternative: bapaknya
  rationale: אָב dapat berarti bapak maupun leluhur. Karena Daud bukan ayah langsung Yosia, “leluhurnya” menyampaikan hubungan dinasti yang dimaksud tanpa menghapus fakta bahwa bahasa Ibrani memakai istilah kekerabatan “bapak”; alternatif harfiahnya dicatat dalam catatan kaki.
- issue: Identitas אֲשֵׁרִים
  choice: lambang-lambang Asyera
  alternative: tiang-tiang Asyera
  rationale: Bentuk fisik benda-benda kultis itu tidak selalu dapat dipastikan. Istilah yang lebih luas mempertahankan ketidakpastian sumber, sementara kemungkinan berupa tiang dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat mengikuti urutan Ibrani, tetapi frasa “Allah Daud” diperjelas secara alami. Istilah kultis dipilih agar dapat dipahami pembaca umum sambil mempertahankan kekhususan dan ketidakpastian leksikal sumber.
