revisions:
- from: Pada tahun kedelapan pemerintahannya, ketika ia masih muda, ia mulai mencari Allah yang disembah Daud, leluhurnya.[a] Pada tahun kedua belas, ia mulai menahirkan Yehuda dan Yerusalem dari tempat-tempat pemujaan di bukit, lambang-lambang Asyera,[b] patung-patung pahatan, dan patung-patung tuangan.[c]
  to: Pada tahun kedelapan pemerintahannya, ketika ia masih muda, ia mulai mencari Allah yang disembah oleh Daud, leluhurnya.[a] Pada tahun kedua belas pemerintahannya, ia mulai menyucikan Yehuda dan Yerusalem dari tempat-tempat pemujaan di bukit, lambang-lambang Asyera,[b] patung-patung pahatan, dan patung-patung tuangan.[c]
