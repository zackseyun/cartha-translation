  to: “Pergilah dan mintalah petunjuk kepada Yahweh bagi saya dan bagi orang-orang yang masih tersisa di Israel dan Yehuda mengenai perkataan dalam kitab yang telah ditemukan itu.[a] Sebab, besarlah murka Yahweh yang telah tercurah atas kita, karena leluhur kita[b] tidak menaati firman Yahweh dengan melakukan segala yang tertulis dalam kitab ini.”
  rationale: Revisi hanya meningkatkan kejelasan idiomatis dan kelancaran bahasa Indonesia. Frasa “kepada Yahweh” menerjemahkan fungsi semantis verba Ibrani dalam konteks permohonan petunjuk, sedangkan “perkataan” dipakai sebagai nomina kolektif yang alami. Tidak ada perubahan pada cakupan, waktu, atau hubungan logis dalam ayat.
