source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: id
  text: “Pergilah dan mintalah petunjuk kepada Yahweh bagi saya dan bagi orang-orang yang masih tersisa di Israel dan Yehuda mengenai perkataan dalam kitab yang telah ditemukan itu.[a] Sebab, besarlah murka Yahweh yang telah tercurah atas kita, karena leluhur kita[b] tidak menaati firman Yahweh dengan melakukan segala yang tertulis dalam kitab ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan yang telah ditemukan itu.” Kata Ibrani סֵפֶר dapat berarti kitab atau gulungan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak-bapak kita”; maksudnya ialah generasi-generasi pendahulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: mintalah petunjuk Yahweh
  rationale: Dalam konteks perintah raja untuk menanggapi kitab yang ditemukan, verba דרשׁ menunjuk pada meminta petunjuk atau jawaban ilahi. Ungkapan ini lebih jelas daripada sekadar ‘carilah Yahweh’ dan lebih alami daripada ‘tanyakanlah kepada Yahweh’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, sesuai bentuk Ibrani dan kebijakan proyek.
- source_word: בַּעֲדִי
  choice: bagi saya
  rationale: Preposisi בעד menyatakan kepentingan atau perwakilan; ‘bagi saya’ alami dalam ujaran raja.
- source_word: הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: orang-orang yang masih tersisa di Israel dan Yehuda
  rationale: Bentuk partisip הנשאר secara langsung menunjuk kepada mereka yang masih tertinggal atau tersisa. Pilihan ini mempertahankan makna tanpa menjadikan ‘kaum sisa’ sebagai istilah teknis yang kurang lazim.
- source_word: עַל דִּבְרֵי הַסֵּפֶר
  choice: mengenai perkataan-perkataan dalam kitab
  rationale: דברי adalah bentuk jamak ‘perkataan-perkataan’ atau ‘kata-kata’, sedangkan על memperkenalkan pokok permintaan petunjuk.
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: kitab yang telah ditemukan itu
  rationale: ספר dapat berarti kitab atau gulungan. ‘Kitab’ alami dalam konteks Kitab Suci Indonesia, sedangkan alternatif materialnya dicatat dalam catatan kaki.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: besarlah murka Yahweh
  rationale: Susunan predikat di depan mempertahankan penekanan Ibrani pada besarnya murka; חמה diterjemahkan ‘murka’ dengan bobot yang sesuai.
- source_word: נִתְּכָה בָנוּ
  choice: yang tercurah atas kita
  rationale: Nifal נתך menggambarkan murka yang dicurahkan. Bentuk ‘tercurah’ mempertahankan metafora sumber.
- source_word: אֲבוֹתֵינוּ
  choice: leluhur kita
  rationale: Dalam konteks historis, אבות menunjuk pada generasi pendahulu. ‘Leluhur’ jelas dan wajar dalam bahasa Indonesia; bentuk harfiahnya dicatat agar unsur leksikal sumber tetap terlihat.
- source_word: לֹא שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: tidak menaati firman Yahweh
  rationale: שמר dengan ‘firman’ menyatakan menjaga dengan cara mengindahkan dan melaksanakannya. ‘Menaati’ menyampaikan fungsi frasa ini secara alami dalam bahasa Indonesia.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב עַל־הַסֵּפֶר הַזֶּה
  choice: dengan melakukan segala yang tertulis dalam kitab ini
  rationale: Infinitif לעשות menjelaskan pelaksanaan ketaatan, dan ככל mencakup seluruh isi tertulis. Bahasa Indonesia memakai ‘dalam kitab’ secara idiomatis untuk tulisan yang terdapat pada naskah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan אֲבוֹתֵינוּ
  choice: leluhur kita
  alternative: bapak-bapak kita
  rationale: Kata Ibrani berbentuk maskulin dan secara harfiah berarti ‘bapak-bapak kami/kita’, tetapi dalam konteks ini menunjuk pada generasi pendahulu secara kolektif. Catatan kaki mempertahankan bentuk harfiahnya tanpa memaksakan bahwa hanya laki-laki yang dimaksud.
- issue: Hubungan antara tidak menjaga firman dan melakukan yang tertulis
  choice: tidak menaati firman Yahweh dengan melakukan segala yang tertulis
  alternative: tidak memelihara firman Yahweh untuk melakukan segala yang tertulis
  rationale: Infinitif לעשות dapat dipahami sebagai isi atau pelaksanaan dari tindakan ‘menjaga’. Terjemahan utama mempertahankan kaitan itu tanpa menentukan secara sempit apakah nuansanya tujuan atau penjelasan isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Perintah raja dibuat langsung dan mudah dipahami; susunan ‘besarlah murka Yahweh’ mempertahankan penekanan retoris sumber. Pronomina ‘saya’ dipakai dalam ucapan raja, sedangkan ‘kita’ mencakup raja dan umat.
