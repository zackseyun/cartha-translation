  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: id
  text: Mereka telah mengeluarkan perak yang ditemukan di rumah Yahweh dan menyerahkannya kepada para pengawas serta kepada orang-orang yang mengerjakan pekerjaan itu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menuangkan perak itu”; kata kerja Ibrani ini dapat menunjuk pada tindakan menuangkan, mengosongkan, atau mengeluarkan dana, bukan melebur perak secara harfiah dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: “Rumah Yahweh” adalah sebutan untuk bait Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: telah menuangkan
  rationale: Kata kerja ini secara leksikal dapat berkaitan dengan menuangkan, mengosongkan, atau melebur. Dalam konteks dana rumah Yahweh yang kemudian diserahkan kepada para pengawas dan pekerja, makna menuangkan atau mengeluarkan perak dari tempat penyimpanannya lebih sesuai daripada meleburnya.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: כֶּסֶף secara harfiah berarti 'perak' dan juga dapat berarti uang. 'Perak' mempertahankan bentuk konkret dalam teks sumber, sambil tetap dapat dipahami sebagai dana.
- source_word: הַנִּמְצָא
  choice: yang ditemukan
  rationale: Partisipel Nifal menyatakan sesuatu yang telah ditemukan atau didapati; bentuk relatif ini alami dalam bahasa Indonesia.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Terjemahan ini mempertahankan sebutan Ibrani 'rumah Yahweh', yang dalam konteks merujuk kepada bait.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: וַיִּתְּנֻהוּ
  choice: lalu menyerahkannya
  rationale: נתן pada konteks administratif ini menyatakan pemindahan atau penyerahan dana. 'Menyerahkannya' lebih alami daripada 'menaruhnya' dan mempertahankan gagasan bahwa perak dipercayakan kepada pihak yang bertanggung jawab.
- source_word: עַל יַד
  choice: ke tangan
  rationale: Ungkapan ini secara harfiah memakai kata 'tangan' dan secara idiomatis berarti menyerahkan ke dalam tanggung jawab seseorang. Bentuk 'ke tangan' mempertahankan citra Ibrani dan tetap dapat dimengerti.
- source_word: הַמֻּפְקָדִים
  choice: para pengawas
  rationale: Partisipel pasif ini menunjuk kepada orang-orang yang ditetapkan untuk mengawasi atau bertanggung jawab atas pekerjaan.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: orang-orang yang melaksanakan pekerjaan itu
  rationale: Frasa ini menunjuk secara luas kepada mereka yang mengerjakan proyek tersebut tanpa membatasi mereka pada satu jenis profesi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. 'Yahweh' mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan citra 'menuangkan' dan 'ke tangan' dari bahasa Ibrani, sedangkan 'menyerahkannya' memperjelas tindakan administratif tanpa menghilangkan ketegangan leksikal yang dijelaskan dalam catatan kaki.
