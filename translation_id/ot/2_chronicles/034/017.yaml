revisions:
- from: Mereka telah menuangkan perak yang ditemukan di rumah Yahweh, lalu menyerahkannya ke tangan para pengawas dan ke tangan orang-orang yang melaksanakan pekerjaan itu.[a][b]
  to: Mereka telah mengeluarkan perak yang ditemukan di rumah Yahweh dan menyerahkannya kepada para pengawas serta kepada orang-orang yang mengerjakan pekerjaan itu.[a][b]
  rationale: Revisi mengganti metafora yang kurang lazim dalam bahasa Indonesia dengan “mengeluarkan,” yang sesuai dengan konteks penyerahan dana, dan mempertahankan ruang lingkup leksikal verba Ibrani dalam catatan kaki. Struktur penerima dana dibuat lebih idiomatis dengan “kepada,” sedangkan istilah sumber yang penting dipertahankan.
