source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: id
  text: 'Tetapi kepada raja Yehuda, yang mengutus kalian untuk meminta petunjuk kepada Yahweh[a], beginilah harus kalian katakan kepadanya: “Beginilah firman Yahweh, Allah Israel: Adapun perkataan yang telah kaudengar—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencari Yahweh” atau “meminta petunjuk kepada Yahweh.” Kata kerja Ibrani ini dapat berarti “mencari” maupun “meminta petunjuk”, khususnya dalam konteks konsultasi kenabian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: Tetapi kepada
  rationale: 'Kata penghubung וְ di sini mengalihkan perhatian secara kontras kepada pesan khusus bagi raja, sedangkan אֶל menyatakan arah: “kepada”.'
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Bentuk konstruksi Ibrani ini secara alami dan tepat dinyatakan sebagai “raja Yehuda” dalam bahasa Indonesia.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: yang mengutus kalian
  rationale: Partisipel berartikel menerangkan raja sebagai orang yang mengutus rombongan. “Kalian” memperjelas bahwa bentuk Ibraninya jamak.
- source_word: לִדְרֹשׁ בַּיהוָה
  choice: untuk meminta petunjuk kepada Yahweh
  rationale: Dalam konteks konsultasi kenabian, דרשׁ dengan ב menunjuk pada tindakan mencari jawaban atau petunjuk ilahi. Pilihan ini wajar dalam bahasa Indonesia tanpa menghapus kemungkinan nuansa “mencari”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi diterjemahkan secara langsung sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: beginilah harus kalian katakan
  rationale: Ungkapan ini mempertahankan daya perintah dan kata penunjuk כֹּה, sambil menghindari susunan Indonesia yang kaku. Sasaran “kepadanya” sudah jelas dari frasa pembuka kepada raja.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ini adalah rumusan pewartaan kenabian. “Beginilah firman” merupakan ungkapan Indonesia yang ringkas, bermartabat, dan mempertahankan sifat formulaiknya.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini mengidentifikasi Yahweh sebagai Allah yang berhubungan dengan Israel; bentuk tanpa “dari” alami dalam ragam Alkitab Indonesia.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Tentang perkataan yang telah kaudengar—
  rationale: “Tentang” mempertahankan unsur yang dikedepankan sebagai topik dan tanda pisah mempertahankan struktur yang masih menggantung sampai ayat berikutnya. “Perkataan” dipakai secara kolektif agar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar אֲדֹנָי, tanpa memasukkan tafsiran denominasi.
- issue: Nuansa דרשׁ dalam konsultasi kepada Yahweh
  choice: meminta petunjuk kepada Yahweh
  alternative: mencari Yahweh atau meminta keterangan kepada Yahweh
  rationale: Konteksnya adalah utusan yang datang untuk memperoleh jawaban ilahi. Terjemahan utama menyatakan konteks konsultasi itu, sementara catatan kaki menjaga keluasan makna verba yang juga dapat berarti “mencari”.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Kalian” menandai objek jamak dalam bahasa Ibrani, sedangkan “kau-” menandai bahwa perkataan terakhir ditujukan kepada raja seorang diri. Tanda pisah pada akhir ayat sengaja dipertahankan karena kalimat Ibrani berlanjut dan diselesaikan dalam ayat berikutnya.
