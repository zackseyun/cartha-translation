source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: id
  text: Dan di sana Aku telah menempatkan tabut itu, yang di dalamnya terdapat perjanjian Yahweh yang telah diadakan-Nya dengan bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel.” Ungkapan Ibrani ini merupakan sebutan kolektif yang lazim bagi keturunan atau umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: aku telah menempatkan
  rationale: Berasal dari שׂוּם, ‘menaruh/menempatkan’. Bentuk ‘telah menempatkan’ menyatakan tindakan yang sudah selesai dan hasilnya tetap relevan dalam konteks perkataan Salomo.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini merujuk pada rumah Allah atau ruang terdalam yang baru disebutkan.
- source_word: הָאָרוֹן
  choice: tabut itu
  rationale: Dalam konteks ibadah Israel, ‘tabut’ merupakan padanan baku dan tepat bagi אָרוֹן.
- source_word: אֲשֶׁר שָׁם
  choice: Di dalamnya terdapat
  rationale: Ungkapan relatif dan keterangan tempat ini menunjukkan bahwa perjanjian Yahweh berada di dalam tabut; susunan tersebut alami dalam bahasa Indonesia.
- source_word: בְּרִית יְהוָה
  choice: perjanjian Yahweh
  rationale: בְּרִית berarti ‘perjanjian’, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: אֲשֶׁר כָּרַת
  choice: yang diikat-Nya
  rationale: Secara harfiah bahasa Ibrani memakai idiom ‘memotong perjanjian’. ‘Mengikat perjanjian’ merupakan ungkapan Indonesia yang alami dan mempertahankan gagasan pembentukan perjanjian.
- source_word: עִם
  choice: dengan
  rationale: Kata depan ini menunjukkan pihak yang bersama dengannya Yahweh mengikat perjanjian.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: ‘Bani Israel’ adalah sebutan kolektif yang mapan bagi keturunan atau umat Israel, sekaligus cukup dekat dengan bentuk harfiah ‘anak-anak lelaki Israel’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi ‘Yahweh’ mempertahankan nama pribadi ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak lelaki Israel; keturunan Israel; umat Israel
  rationale: Bentuk Ibraninya secara gramatikal maskulin, tetapi juga merupakan nama kolektif baku bagi umat Israel. ‘Bani Israel’ mempertahankan nuansa keturunan tanpa membatasi rujukannya hanya kepada laki-laki.
- issue: Isi yang dikatakan berada di dalam tabut
  choice: perjanjian Yahweh
  alternative: loh-loh perjanjian Yahweh
  rationale: Teks hanya menyebut ‘perjanjian Yahweh’. Terjemahan tidak menambahkan ‘loh-loh’, meskipun konteks yang lebih luas dapat menunjuk kepada loh-loh perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Tabut’, ‘perjanjian’, dan ‘bani Israel’ mempertahankan kosakata Alkitab yang dikenal luas tanpa memakai susunan yang kaku. Penanda catatan kaki ditempatkan langsung setelah ungkapan yang dijelaskannya.
