source:
  edition: WLC
  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: id
  text: setiap doa, setiap permohonan yang dipanjatkan oleh siapa pun atau oleh seluruh umat-Mu Israel, oleh mereka yang masing-masing mengetahui penderitaan dan kepedihannya sendiri serta menadahkan tangannya ke arah rumah ini—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: setiap doa
  rationale: כָּל mencakup segala doa yang mungkin dipanjatkan; pengulangan 'setiap' mempertahankan bentuk dan keluasan ungkapan Ibrani.
- source_word: כָל תְּחִנָּה
  choice: setiap permohonan
  rationale: תְּחִנָּה menunjuk pada permohonan sungguh-sungguh untuk belas kasihan atau pertolongan; 'permohonan' alami dan bermartabat dalam bahasa Indonesia.
- source_word: אֲשֶׁר יִהְיֶה
  choice: yang dipanjatkan
  rationale: Secara harfiah berarti 'yang ada/terjadi', tetapi dalam konteks doa ungkapan ini secara wajar menyatakan doa atau permohonan yang muncul dan disampaikan.
- source_word: לְכָל הָאָדָם
  choice: oleh siapa pun
  rationale: אָדָם dipakai secara generik bagi seorang manusia, sedangkan לְ dalam konteks ini menandai orang yang memiliki atau memanjatkan doa. 'Siapa pun' menyampaikan cakupan distributif tanpa membatasi jenis kelamin.
- source_word: וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: atau oleh seluruh umat-Mu Israel
  rationale: Pasangan ini bergerak dari individu kepada umat secara kolektif; 'atau' menyampaikan hubungan alternatif/distributif yang paling alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: ketika masing-masing menyadari
  rationale: אִישׁ berfungsi distributif, 'masing-masing'; ידע di sini bukan sekadar mengetahui secara abstrak, melainkan mengenali keadaan pribadi yang mendorong doa.
- source_word: נִגְעוֹ
  choice: penderitaannya sendiri
  rationale: נֶגַע dapat berarti pukulan, wabah, atau penderitaan. Konteks pribadi mendukung istilah luas 'penderitaan', sedangkan sufiks milik dinyatakan dengan 'sendiri'.
- source_word: וּמַכְאֹבוֹ
  choice: dan kepedihannya sendiri
  rationale: מַכְאוֹב mencakup rasa sakit atau dukacita. 'Kepedihan' mempertahankan dimensi batin maupun jasmani dan tetap dibedakan dari נֶגַע.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: lalu menadahkan tangannya
  rationale: Ungkapan ini menggambarkan gestur doa dengan membuka atau membentangkan telapak tangan. 'Menadahkan tangan' adalah ungkapan Indonesia yang alami untuk gestur tersebut.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ke arah rumah ini
  rationale: אֶל menyatakan orientasi doa menuju rumah itu; 'ke arah' menghindari kesan bahwa doa ditujukan kepada bangunan.
theological_decisions:
- issue: Makna generik הָאָדָם dalam bentuk tunggal maskulin
  choice: siapa pun
  alternative: setiap orang / setiap manusia
  rationale: Dalam konteks ini אָדָם bersifat generik dan mencakup setiap anggota umat. Bahasa Indonesia tidak memerlukan nomina bergender untuk mempertahankan daya representatif bentuk Ibrani.
- issue: Rujukan 'rumah ini' dalam arah doa
  choice: ke arah rumah ini
  alternative: kepada rumah ini
  rationale: Doa diarahkan secara fisik dan simbolis menuju rumah TUHAN, bukan disampaikan kepada bangunan itu sebagai penerima doa.
- issue: Hubungan antara individu dan seluruh Israel
  choice: atau
  alternative: dan
  rationale: Waw Ibrani memungkinkan hubungan koordinatif, tetapi dalam daftar cakupan ini 'atau' paling jelas mempertahankan pilihan antara doa seorang individu dan doa umat secara kolektif tanpa meniadakan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya. Tidak ada catatan kaki karena pilihan generik 'siapa pun' sudah jelas dan setia pada fungsi אָדָם dalam konteks.
