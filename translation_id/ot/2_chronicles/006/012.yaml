  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: id
  text: Kemudian Salomo berdiri di depan mazbah Yahweh, di hadapan seluruh jemaah Israel, lalu membentangkan kedua tangannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “membentangkan telapak-telapak tangannya”; ungkapan ini menggambarkan sikap tangan ketika berdoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Kemudian Salomo berdiri
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Subjek tersirat dijelaskan sebagai Salomo dari konteks terdekat agar wajar dan jelas dalam bahasa Indonesia.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: di depan mazbah Yahweh
  rationale: לִפְנֵי menyatakan posisi di hadapan atau di depan mazbah; bentuk konstruksi mempertahankan hubungan 'mazbah Yahweh', dan nama ilahi ditransliterasikan sebagai Yahweh.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: di hadapan seluruh jemaah Israel
  rationale: נֶגֶד menunjukkan posisi Salomo terhadap orang-orang yang berkumpul. קָהָל berarti himpunan umat; 'jemaah' merupakan padanan Indonesia yang alami dan bermartabat dalam konteks ibadah bersama.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: lalu menadahkan kedua tangannya
  rationale: Secara harfiah ungkapan ini berarti membentangkan telapak-telapak tangannya. 'Menadahkan kedua tangannya' menyampaikan gerak doa itu secara alami; bentuk dual כַּפָּיו mendukung penyebutan 'kedua tangan'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi יְהוָה. Bentuk 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna gerakan tangan
  choice: menadahkan kedua tangannya
  alternative: membentangkan telapak tangannya
  rationale: Ungkapan Ibrani menggambarkan sikap tubuh dalam doa. Terjemahan ini menyampaikan geraknya tanpa menambahkan isi doa atau makna teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. 'Mazbah' dipertahankan sebagai istilah ringkas yang lazim dalam konteks Alkitab, sedangkan 'di depan' dan 'di hadapan' membedakan dua relasi ruang dalam teks Ibrani. Nama Salomo dieksplisitkan dari konteks untuk menghindari kata ganti tanpa rujukan dalam ayat yang berdiri sendiri.
