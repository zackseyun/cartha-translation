id: 2CH.6.14
reference: 2 Chronicles 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: id
  text: Lalu ia berkata, “Ya Yahweh, Allah Israel, tidak ada Allah seperti Engkau di langit ataupun di bumi. Engkau memegang teguh perjanjian dan menunjukkan kasih setia[a] kepada hamba-hamba-Mu yang berjalan di hadapan-Mu dengan segenap hati mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kesetiaan perjanjian.”
    reason: Alternatif ini menonjolkan dimensi loyalitas perjanjian dalam חֶסֶד, yang cakupan maknanya juga meliputi kasih dan kemurahan yang teguh.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan doa Salomo; “lalu” menyampaikan kesinambungan itu secara alami tanpa memberi urutan waktu yang terlalu tegas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Ungkapan konstruksi ini secara alami menyatakan Yahweh sebagai Allah yang berelasi dengan Israel.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: tidak ada Allah seperti Engkau
  rationale: Menyampaikan pernyataan ketakterbandingan Yahweh secara jelas, tanpa menambahkan penjelasan tentang hakikat אֱלֹהִים.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: di langit ataupun di bumi
  rationale: Dalam kalimat negatif, “ataupun” secara idiomatis menyampaikan cakupan menyeluruh dari pasangan langit dan bumi.
- source_word: שֹׁמֵר הַבְּרִית
  choice: memegang teguh perjanjian
  rationale: Partisipel menggambarkan tindakan yang menjadi ciri Allah; “memegang teguh” menyampaikan tindakan menjaga dan setia melaksanakan perjanjian.
- source_word: וְהַחֶסֶד
  choice: dan menunjukkan kasih setia
  rationale: חֶסֶד mencakup kasih, kemurahan, dan kesetiaan yang teguh, khususnya dalam konteks perjanjian. Penambahan verba “menunjukkan” diperlukan agar ungkapannya alami dalam bahasa Indonesia tanpa menghilangkan hubungan eratnya dengan perjanjian.
- source_word: לַעֲבָדֶיךָ
  choice: kepada hamba-hamba-Mu
  rationale: Preposisi ל menandai pihak yang menerima tindakan Allah; “hamba-hamba” mempertahankan hubungan pengabdian tanpa menyiratkan bahwa perbudakan adalah pokok utama.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: yang berjalan di hadapan-Mu
  rationale: Mempertahankan metafora Ibrani tentang menjalani hidup dan berperilaku dalam hadirat Allah.
- source_word: בְּכָל לִבָּם
  choice: dengan segenap hati mereka
  rationale: Menyampaikan pengabdian yang utuh; bentuk Indonesia ini jelas bahwa setiap hamba mengabdi dengan sepenuh hati.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Nuansa חֶסֶד dalam konteks perjanjian
  choice: kasih setia
  alternative: kesetiaan perjanjian; kemurahan; belas kasih
  rationale: Karena חֶסֶד dipasangkan dengan “perjanjian”, “kasih setia” mempertahankan unsur kasih sekaligus loyalitas yang teguh tanpa menyempitkannya menjadi istilah teknis semata.
- issue: Makna אֱלֹהִים dalam pernyataan ketakterbandingan
  choice: tidak ada Allah seperti Engkau
  alternative: tidak ada yang seperti Engkau di antara para ilah
  rationale: Bacaan yang dipilih menyampaikan ketakterbandingan Yahweh secara alami dalam bahasa Indonesia. Alternatifnya mungkin secara leksikal, tetapi dapat menggeser fokus ayat kepada klasifikasi para ilah yang tidak dijelaskan dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Yahweh” sesuai dengan konteks doa. Kapitalisasi pronomina ilahi mengikuti kebiasaan religius Indonesia. Metafora “berjalan di hadapan-Mu” dipertahankan karena cukup dapat dipahami dan membawa bobot ungkapan sumber.
