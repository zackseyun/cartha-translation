  to: Jika seseorang berdosa terhadap sesamanya, lalu suatu sumpah[a] dibebankan kepadanya supaya ia mengucapkannya, dan ia datang dengan sumpah itu ke hadapan mezbah-Mu di rumah ini,
  rationale: Revisi menjadikan orang yang bersalah sebagai subjek “datang,” sesuai bentuk maskulin verba Ibrani, dan mempertahankan אָלָה sebagai bagian dari tindakan yudisial melalui “dengan sumpah itu.” Karena konstruksi akhir dipahami berbeda dalam tradisi terjemahan, pembacaan yang menjadikan sumpah sebagai subjek dipertahankan dalam catatan kaki. Istilah “sumpah kutuk” juga tetap dicatat agar nuansa sanksi dalam אָלָה tidak hilang.
