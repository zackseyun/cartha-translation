base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: id
  text: Jika seseorang berdosa terhadap sesamanya, lalu suatu sumpah[a] dibebankan kepadanya supaya ia mengucapkannya, dan ia datang dengan sumpah itu ke hadapan mezbah-Mu di rumah ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “sumpah kutuk”. Istilah Ibrani ini dapat menunjuk kepada sumpah yang disertai kutuk apabila sumpah itu dilanggar atau ternyata palsu. Frasa berikutnya juga dapat dipahami: “dan sumpah itu datang ke hadapan mezbah-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ
  choice: Jika seseorang berdosa
  rationale: Konstruksi ini memperkenalkan syarat. “Seseorang” merupakan padanan Indonesia yang alami bagi אִישׁ dalam pemakaian representatif, sedangkan “berdosa” mempertahankan bobot moral dan religius חטא.
- source_word: לְרֵעֵהוּ
  choice: terhadap sesamanya
  rationale: רֵעַ menunjuk kepada sesama, kawan, atau orang yang berhubungan dengannya. “Sesamanya” alami dalam konteks pelanggaran antarorang.
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: lalu kepadanya dikenakan sumpah
  rationale: Ungkapan ini menyatakan bahwa suatu sumpah yang mengandung sanksi dikenakan kepada orang tersebut. Bentuk pasif impersonal mempertahankan ketidakjelasan pelaku dalam bahasa Ibrani.
- source_word: לְהַאֲלֹתוֹ
  choice: untuk menyuruhnya bersumpah
  rationale: Infinitif Hifil dari אלה bersifat kausatif. Terjemahan ini mempertahankan unsur tersendiri ini dan tidak meleburkannya ke dalam klausa sebelumnya.
- source_word: וּבָא אָלָה
  choice: dan sumpah itu sampai
  rationale: Secara sintaksis אָלָה dapat dipahami sebagai subjek kata kerja “datang”. “Sampai” menghasilkan bahasa Indonesia yang alami tanpa menambahkan pelaku manusia yang tidak dinyatakan.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: ke hadapan mezbah-Mu
  rationale: Mempertahankan ungkapan ruang dan peradilan tentang sumpah yang diajukan di hadapan Allah pada mezbah-Nya.
- source_word: בַּבַּיִת הַזֶּה
  choice: di rumah ini
  rationale: בַּיִת secara harfiah berarti “rumah”; dalam konteks ini menunjuk kepada rumah Allah atau Bait Allah. “Rumah” menjaga citra dan istilah sumber.
theological_decisions:
- issue: Makna yudisial אָלָה
  choice: sumpah dalam teks utama, dengan nuansa kutuk dijelaskan dalam catatan kaki
  alternative: kutuk; sumpah kutuk
  rationale: Dalam konteks pengadilan, אָלָה adalah sumpah yang mendatangkan kutuk apabila sumpah itu palsu. “Sumpah” memperjelas tindakan yudisial, sedangkan catatan kaki mempertahankan unsur sanksi kutuk yang sungguh terdapat dalam istilah Ibrani.
- issue: Subjek וּבָא
  choice: sumpah itu sampai ke hadapan mezbah-Mu
  alternative: orang itu datang dan sumpah itu diucapkan di hadapan mezbah-Mu
  rationale: Teks Ibrani menempatkan אָלָה sesudah kata kerja tunggal dan secara wajar dapat menjadikannya subjek. Terjemahan tidak menambahkan kata kerja “diucapkan” yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran pronominal untuk Allah ditulis dengan huruf kapital pada “mezbah-Mu”. Ayat dipertahankan sebagai klausa bersyarat yang berlanjut ke ayat berikutnya.
