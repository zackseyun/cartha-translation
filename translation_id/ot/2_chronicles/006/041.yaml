source:
  edition: WLC
  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: id
  text: Sekarang, bangkitlah, ya Yahweh Allah, ke tempat perhentian-Mu, Engkau dan tabut kekuatan-Mu.[a] Hendaklah imam-imam-Mu, ya Yahweh Allah, mengenakan keselamatan, dan hendaklah orang-orang setia-Mu[b] bersukacita dalam apa yang baik.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabut keperkasaan-Mu” atau “tabut kuasa-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang saleh-Mu” atau “orang-orang kudus-Mu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “bersukacita dalam kebaikan-Mu.” Secara harfiah, teks Ibrani berbunyi “dalam yang baik/kebaikan,” tanpa kata ganti posesif yang eksplisit.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan menuju permohonan puncak. Dalam bahasa Indonesia, “Sekarang” sudah mengungkapkan fungsi wacana ungkapan Ibrani ini secara alami; unsur penghubung waw tidak perlu selalu diterjemahkan tersendiri.
- source_word: קוּמָה
  choice: bangkitlah
  rationale: Bentuk perintah dari קום dalam bahasa doa. “Bangkitlah” mempertahankan citra tindakan dan tetap terdengar khidmat serta wajar dalam bahasa Indonesia.
- source_word: יְהוָה אֱלֹהִים
  choice: ya Yahweh Allah
  rationale: Mempertahankan nama perjanjian יהוה dan gelar אֱלֹהִים dalam sapaan langsung, dengan partikel vokatif Indonesia “ya”.
- source_word: לְנוּחֶךָ
  choice: menuju tempat perhentian-Mu
  rationale: Bentuk ini dapat menunjuk pada perhentian maupun tempat menetap. Konteks bait dan tabut mendukung makna tempat tujuan tanpa menghilangkan gagasan perhentian.
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: Engkau dan tabut kekuatan-Mu
  rationale: Susunan ini mempertahankan penyebutan Allah dan tabut secara berdampingan. עֹז diterjemahkan “kekuatan,” dengan “keperkasaan” dan “kuasa” sebagai kemungkinan leksikal.
- source_word: כֹּהֲנֶיךָ
  choice: para imam-Mu
  rationale: Padanan langsung dan alami untuk bentuk jamak posesif.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: berpakaian keselamatan
  rationale: Mempertahankan metafora pakaian dalam teks Ibrani. תְּשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan; “keselamatan” cukup luas dan sesuai konteks doa.
- source_word: חֲסִידֶיךָ
  choice: orang-orang setia-Mu
  rationale: Mengungkapkan kesetiaan dan kesalehan relasional yang terkandung dalam חָסִיד tanpa memasukkan konotasi gerejawi yang mungkin melekat pada istilah “orang-orang kudus.”
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: bersukacita dalam apa yang baik
  rationale: Menerjemahkan secara alami frasa harfiah “dalam yang baik/kebaikan” dan tidak menambahkan kata ganti posesif yang tidak terdapat secara eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan gelar.
- issue: Apakah בַטּוֹב harus dibuat secara eksplisit merujuk pada kebaikan Allah
  choice: dalam apa yang baik
  alternative: dalam kebaikan-Mu
  rationale: Konteks doa memungkinkan arti “dalam kebaikan-Mu,” tetapi teks Ibrani tidak memiliki akhiran posesif. Terjemahan utama mempertahankan keluasan dan ketegangan ini, sementara alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang khidmat tetapi mudah dipahami. Kapitalisasi akhiran posesif yang merujuk kepada Allah dipakai sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Metafora “berpakaian keselamatan” dan ambiguitas בַטּוֹב dipertahankan.
