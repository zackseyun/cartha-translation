  to: Sekarang, bangkitlah, ya Yahweh Allah, ke tempat perhentian-Mu, Engkau dan tabut kekuatan-Mu.[a] Hendaklah imam-imam-Mu, ya Yahweh Allah, mengenakan keselamatan, dan hendaklah orang-orang setia-Mu[b] bersukacita dalam apa yang baik.[c]
