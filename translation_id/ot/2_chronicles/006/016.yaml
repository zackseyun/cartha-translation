  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: id
  text: 'Sekarang, ya TUHAN, Allah Israel, genapilah bagi hamba-Mu Daud, ayahku, apa yang telah Engkau firmankan kepadanya: “Tidak akan terputus bagimu seorang laki-laki yang duduk di atas takhta Israel di hadapan-Ku, asalkan anak-anakmu menjaga jalan mereka dengan hidup menurut hukum-Ku, sebagaimana engkau telah hidup di hadapan-Ku.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמֹר
  choice: tepatilah
  rationale: Dalam konteks janji ilahi, imperatif ini berarti menjaga atau memelihara janji dengan melaksanakannya; “tepatilah” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: keturunanmu tidak akan pernah terputus
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang tidak terputusnya seorang laki-laki bagi Daud. Pilihan ini mempertahankan citra kesinambungan garis keturunannya tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: מִלְּפָנַי ... עַל כִּסֵּא יִשְׂרָאֵל
  choice: Di hadapan-Ku ... dari takhta Israel
  rationale: “Di hadapan-Ku” mempertahankan unsur relasional-teologis לפני, sedangkan “terputus dari takhta” menyatakan kesinambungan dinasti yang dimaksud.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: menjaga jalan hidup mereka
  rationale: דרך dalam konteks etis menunjuk pada perilaku atau pola hidup; “jalan hidup” mempertahankan metafora sumber sekaligus mudah dipahami.
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: dengan hidup menurut hukum-Ku
  rationale: Secara harfiah “berjalan dalam Taurat/hukum-Ku.” Kata “hidup” menyampaikan idiom berjalan sebagai perilaku, sementara “hukum-Ku” mempertahankan cakupan תּוֹרָה dalam konteks ini.
theological_decisions:
- issue: Sifat bersyarat dari janji dinasti kepada Daud
  choice: asalkan anak-anakmu menjaga jalan hidup mereka
  alternative: jika saja anak-anakmu menjaga jalan mereka
  rationale: רַק אִם menyatakan syarat yang nyata dan tegas. “Asalkan” mempertahankan ketegangan antara janji kesinambungan dinasti dan tuntutan ketaatan tanpa menyelaraskannya secara doktrinal.
- issue: Referen frasa “di hadapan-Ku”
  choice: Ditempatkan pada awal anak kalimat janji
  alternative: Dihubungkan langsung dengan tindakan duduk di takhta
  rationale: Susunan Ibrani memungkinkan hubungan semantis dengan keberadaan penerus di hadapan Allah atau dengan duduk di takhta. Penempatan ini mempertahankan frasa secara eksplisit tanpa penjelasan interpretatif tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “ya TUHAN” serta pronomina ilahi dengan huruf kapital mengikuti register Alkitab Indonesia yang lazim. Kalimat dibuat alami tanpa menghilangkan syarat ketaatan atau citra hidup di hadapan Allah.
