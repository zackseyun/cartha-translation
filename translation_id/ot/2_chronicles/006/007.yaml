source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣יד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: id
  text: Dalam hati Daud, ayahku, ada niat untuk membangun sebuah rumah bagi nama Yahweh[a], Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebuah rumah bagi nama Yahweh,” yaitu Bait Allah sebagai tempat yang dikaitkan dengan nama-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: Dalam hati ... ada niat
  rationale: Ungkapan Ibrani ini menyatakan bahwa suatu maksud atau kehendak ada dalam batin seseorang. Terjemahan ini mempertahankan gambaran tentang hati sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: דָּוִיד אָבִי
  choice: Daud, ayahku
  rationale: Urutan nama lalu hubungan keluarga mengikuti teks Ibrani dan dalam bahasa Indonesia wajar disajikan sebagai aposisi.
- source_word: לִבְנוֹת בַּיִת
  choice: untuk membangun sebuah rumah
  rationale: בנה berarti 'membangun', sedangkan בַּיִת secara harfiah berarti 'rumah'. Kata 'rumah' dipertahankan meskipun yang dimaksud adalah Bait Allah, agar ungkapan khas teks sumber tidak dipersempit.
- source_word: לְשֵׁם
  choice: bagi nama
  rationale: Terjemahan ini mempertahankan rumusan teologis khas Tawarikh bahwa rumah itu dibangun bagi nama Allah, bukan sekadar menggantinya dengan parafrasa seperti 'untuk menghormati'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara alami sebagai gelar perjanjian 'Allah Israel'.
theological_decisions:
- issue: Ungkapan bait suci בַּיִת לְשֵׁם יְהוָה
  choice: sebuah rumah bagi nama Yahweh
  alternative: sebuah bait bagi Yahweh; sebuah rumah untuk menghormati Yahweh
  rationale: Pilihan ini mempertahankan baik kata 'rumah' maupun konsep 'nama', yang penting dalam teologi Ulangan–Tawarikh mengenai hubungan tempat ibadah dengan kehadiran Allah, tanpa menyamakan bangunan itu secara sederhana dengan Allah sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan 'Dalam hati ... ada niat' menjaga citra antropologis bahasa Ibrani tanpa menjadi kaku; aposisi 'Daud, ayahku' memperjelas hubungan sintaksis.
