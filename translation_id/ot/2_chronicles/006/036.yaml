id: 2CH.6.36
reference: 2 Chronicles 6:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: id
  text: Apabila mereka berdosa terhadap-Mu—sebab tidak ada manusia yang tidak berdosa—dan Engkau murka kepada mereka lalu menyerahkan mereka kepada musuh, dan para penawan mereka membawa mereka sebagai tawanan ke negeri yang jauh ataupun dekat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Apabila mereka berdosa terhadap-Mu
  rationale: כִּי membuka keadaan bersyarat yang dipandang sebagai kemungkinan nyata; 'apabila' alami dalam doa ini. חטא dengan ל menyatakan dosa yang dilakukan terhadap seseorang.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: tidak ada manusia yang tidak berdosa
  rationale: אָדָם dipakai secara generik untuk manusia. 'Manusia' mempertahankan bentuk tunggal kolektif dan cakupan universal tanpa menyiratkan hanya laki-laki.
- source_word: וְאָנַפְתָּ בָם
  choice: dan Engkau murka kepada mereka
  rationale: Kata kerja אנף menyatakan kemarahan ilahi; 'murka' merupakan padanan Indonesia yang wajar dan bermartabat dalam konteks ini.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: lalu menyerahkan mereka kepada musuh
  rationale: נתן לפני אויב berarti menyerahkan seseorang ke dalam kuasa musuh. Nomina tunggal אוֹיֵב tidak harus menunjuk satu musuh tertentu; bahasa Indonesia tidak memerlukan artikel tak tentu.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: dan para penawan mereka membawa mereka sebagai tawanan
  rationale: Terjemahan ini mempertahankan hubungan kata serumpun antara tindakan menawan dan para penawan, sekaligus menyampaikan deportasi dengan jelas.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: ke negeri yang jauh ataupun dekat
  rationale: Mempertahankan pasangan kontras jauh-dekat dan ketidakjelasan titik acuannya.
theological_decisions:
- issue: אָדָם generik dalam pernyataan tentang universalitas dosa manusia
  choice: tidak ada manusia yang tidak berdosa
  alternative: tidak ada seorang pun yang tidak berdosa
  rationale: '''Manusia'' langsung mewakili אָדָם generik dan menjaga pernyataan universal tanpa memasukkan pembatasan gender.'
- issue: Hubungan murka Allah, penyerahan kepada musuh, dan pembuangan
  choice: rangkaian tindakan dengan 'dan/lalu'
  alternative: hubungan tujuan dengan 'sehingga'
  rationale: Rangkaian waw Ibrani menyajikan urutan keadaan dan tindakan; terjemahan tidak menambahkan gagasan tujuan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai bentuk hormat 'Engkau/-Mu'. Ayat dibiarkan berakhir dengan koma karena kalimat bersyarat berlanjut ke ayat berikutnya.
