  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: id
  text: Lalu raja berbalik[a] dan memberkati seluruh jemaah Israel[b], sementara seluruh jemaah Israel berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memalingkan wajahnya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “seluruh perhimpunan Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: berbalik
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘memalingkan wajahnya’, tetapi dalam konteks gerakan tubuh, ‘berbalik’ menyampaikan maknanya secara alami dan tepat dalam bahasa Indonesia.
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Kata ברך lazim berarti ‘memberkati’. Bentuk ini ringkas dan mempertahankan tindakan raja tanpa menambahkan penjelasan yang tidak dinyatakan dalam teks.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: seluruh jemaah Israel
  rationale: קהל menunjuk kepada umat yang berhimpun. ‘Jemaah’ merupakan padanan Indonesia yang jelas untuk perhimpunan Israel dalam suasana ibadah dan tidak membatasi rujukannya pada kelompok kecil.
- source_word: עוֹמֵד
  choice: berdiri
  rationale: Partisip Ibrani menggambarkan keadaan yang sedang berlangsung. Dalam klausa dengan ‘sementara’, bentuk ‘berdiri’ secara alami menyatakan postur yang berlangsung pada saat raja memberkati mereka.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: sementara seluruh jemaah Israel berdiri
  rationale: Klausa ini bersifat sirkumstansial. ‘Sementara’ memperjelas bahwa seluruh jemaah sedang berdiri ketika raja memberkati mereka, sekaligus mempertahankan pengulangan frasa sumber.
