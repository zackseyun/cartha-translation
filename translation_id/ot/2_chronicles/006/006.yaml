id: 2CH.6.6
reference: 2 Chronicles 6:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: id
  text: Tetapi Aku telah memilih Yerusalem agar nama-Ku ada di sana[a], dan Aku telah memilih Daud untuk memimpin umat-Ku Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku memilih Yerusalem ... dan Aku memilih Daud.” Bentuk kata kerja Ibrani dapat diterjemahkan sebagai bentuk lampau sederhana; kata «telah» dalam teks utama menonjolkan bahwa pilihan Allah yang sudah ditetapkan itu tetap berlaku dalam konteks ini.
    reason: Alternatif aspek kata kerja Ibrani.
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: Aku telah memilih
  rationale: Kata בחר berarti memilih. Partikel «telah» menyampaikan pilihan yang sudah ditetapkan dan tetap berlaku dalam konteks, sedangkan bentuk lampau sederhana tetap dicatat sebagai kemungkinan dalam catatan kaki.
- source_word: בִּירוּשָׁלִַם
  choice: Yerusalem
  rationale: Nama tempat ini ditulis menurut bentuk baku bahasa Indonesia.
- source_word: לִהְיוֹת
  choice: agar ... ada / untuk memimpin
  rationale: Infinitif היה menyatakan tujuan atau hasil. Dalam klausa pertama, «agar ... ada» merupakan ungkapan Indonesia yang alami. Dalam klausa kedua, bersama עַל, maknanya menyatakan kedudukan berwenang atas umat.
- source_word: שְׁמִי
  choice: nama-Ku
  rationale: Ungkapan harfiah «nama-Ku» dipertahankan karena penting dalam teologi Bait Allah dan tidak boleh diam-diam diparafrasakan menjadi «kehadiran-Ku».
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini dipertahankan secara eksplisit sesuai penekanan teks Ibrani.
- source_word: בְּדָוִיד
  choice: Daud
  rationale: Sesudah בחר, preposisi ב menandai pribadi yang dipilih; bahasa Indonesia secara alami cukup mengatakan «memilih Daud».
- source_word: עַל
  choice: memimpin
  rationale: עַל menyatakan kedudukan atau wewenang atas umat. «Memimpin» mengungkapkan hubungan ini secara alami tanpa menambahkan gelar «raja» yang tidak terdapat dalam ayat.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: umat-Ku Israel
  rationale: Terjemahan ini mempertahankan bahasa perjanjian «umat-Ku» dan nama Israel sebagai aposisi.
- source_word: וְ
  choice: Tetapi
  rationale: Kata penghubung ini menyatakan kontras dengan pernyataan negatif sebelumnya tentang kota yang tidak dipilih.
theological_decisions:
- issue: Teologi Bait Allah dalam ungkapan «nama-Ku ada di sana»
  choice: Mempertahankan ungkapan «nama-Ku ada di sana».
  alternative: «kehadiran-Ku ada di sana» atau «tempat Aku disembah»
  rationale: Teks Ibrani secara khusus berbicara tentang nama Allah. Mempertahankan idiom ini menjaga bobot teologisnya tanpa memasukkan penjelasan tertentu ke dalam teks utama.
- issue: Peran Daud dalam ungkapan «menjadi atas umat-Ku Israel»
  choice: Menerjemahkannya secara alami sebagai «memimpin umat-Ku Israel».
  alternative: «menjadi raja atas umat-Ku Israel» atau bentuk sangat harfiah «berada atas umat-Ku Israel»
  rationale: Konteks memang berkaitan dengan kerajaan, tetapi ayat ini tidak menyebut gelar «raja». «Memimpin» menyatakan wewenang yang dimaksud tanpa menambahkan gelar tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan kesejajaran dua tindakan pemilihan sambil memakai ungkapan yang wajar bagi pembaca masa kini.
