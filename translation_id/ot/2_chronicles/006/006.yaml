  terminology: Yerusalem dan Daud memakai bentuk nama yang baku dalam bahasa Indonesia. Istilah “nama-Ku” dan “umat-Ku Israel” mempertahankan ungkapan perjanjian dan Bait Allah secara tepat. Catatan kaki berjangkar [a] pada pilihan bentuk aspek “telah memilih” dan menjelaskan alternatif lampau sederhana tanpa mengubah makna.
