  text: לִ/הְיוֹת֩ עֵינֶ֨י/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ לָ/שׂ֥וּם שִׁמְ/ךָ֖ שָׁ֑ם לִ/שְׁמ֨וֹעַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: id
  text: Kiranya mata-Mu terbuka ke arah rumah ini siang dan malam,[a] ke arah tempat yang telah Engkau katakan akan menjadi tempat untuk menaruh nama-Mu di sana,[b] untuk mendengarkan doa yang dipanjatkan hamba-Mu ke arah tempat ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kiranya Engkau memperhatikan rumah ini.” Bahasa Ibrani secara harfiah mengatakan “mata-Mu terbuka,” suatu ungkapan tentang perhatian yang berjaga.
    reason: lexical_alternative
  - marker: b
    text: “Menaruh nama-Mu” adalah ungkapan yang berkaitan dengan bait dan menunjuk pada hubungan Allah yang dipilih dengan tempat ini; ungkapan itu tidak berarti bahwa Allah secara harfiah terkurung di sana.
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: Kiranya mata-Mu terbuka
  rationale: Bentuk infinitif dalam konteks doa menyampaikan permohonan. 'Kiranya' mengungkapkan daya permohonan itu, sedangkan 'mata-Mu terbuka' mempertahankan metafora antropomorfis Ibrani.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ke arah rumah ini
  rationale: אֶל menunjukkan arah; 'ke arah' mempertahankan orientasi ruang dengan jelas, dan 'rumah' melestarikan sebutan konkret bagi bait.
- source_word: יוֹמָם וָלַיְלָה
  choice: siang dan malam
  rationale: Ungkapan ini merupakan merisme untuk perhatian yang terus-menerus; terjemahan harfiah juga alami dalam bahasa Indonesia.
- source_word: אֶל הַמָּקוֹם
  choice: ke arah tempat
  rationale: Terjemahan langsung mempertahankan rujukan kepada lokasi yang dipilih Allah tanpa menambahkan tafsiran.
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: yang tentangnya Engkau telah berfirman bahwa Engkau akan menaruh nama-Mu di sana
  rationale: Susunan ini membuat hubungan relatifnya jelas dalam bahasa Indonesia dan mempertahankan ungkapan teologis 'menaruh nama-Mu' tanpa menguraikannya di dalam teks.
- source_word: לִשְׁמֹעַ
  choice: untuk mendengarkan
  rationale: Infinitif menyatakan tujuan; 'mendengarkan' menyampaikan perhatian aktif terhadap doa tanpa mengubah makna menjadi tindakan menjawab.
- source_word: הַתְּפִלָּה אֲשֶׁר יִתְפַּלֵּל
  choice: doa yang dipanjatkan
  rationale: Bentuk pasif alami dalam bahasa Indonesia dan menghindari pengulangan kaku 'doa yang didoakan', sementara tetap menyatakan tindakan berdoa.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam sapaan doa kepada Allah, 'hamba' adalah padanan Indonesia yang wajar dan bermartabat bagi עבד serta menyatakan kerendahan dan pengabdian.
theological_decisions:
- issue: Bahasa antropomorfis tentang mata Allah yang terbuka
  choice: Mempertahankan ungkapan konkret 'mata-Mu terbuka'
  alternative: Kiranya Engkau memperhatikan rumah ini
  rationale: Teks Ibrani memakai gambaran tubuh untuk perhatian ilahi. Mempertahankannya melestarikan retorika dan ketegangan teologis teks tanpa mereduksinya menjadi parafrasa.
- issue: Teologi bait dalam ungkapan 'menaruh nama-Mu'
  choice: Mempertahankan ungkapan 'menaruh nama-Mu di sana'
  alternative: menghadirkan diri-Mu di sana
  rationale: Ungkapan nama Allah berkaitan dengan pemilihan dan hubungan-Nya dengan tempat itu, tetapi tidak menjelaskan secara langsung hakikat kehadiran-Nya. Terjemahan tidak boleh menyelesaikan nuansa itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi dipakai secara konsisten. 'Rumah' dipertahankan, bukan diganti menjadi 'Bait', agar citra leksikal המקור tetap terlihat; catatan kaki menjelaskan dua idiom utama tanpa membebani teks.
