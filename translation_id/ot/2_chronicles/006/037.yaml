  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: id
  text: lalu di negeri tempat mereka ditawan itu mereka tersadar[a], berbalik, dan memohon belas kasihan kepada-Mu di negeri penawanan mereka dengan berkata, “Kami telah berdosa, kami telah bertindak menyimpang, dan kami telah berbuat jahat,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membawanya kembali ke hati mereka”, suatu ungkapan yang berarti merenungkannya sungguh-sungguh atau menyadarinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: mereka sadar kembali
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan sesuatu yang ‘dibawa kembali ke hati’, yakni merenungkan keadaan lalu sampai pada kesadaran batin. ‘Sadar kembali’ menyampaikan daya idiomatisnya dalam bahasa Indonesia yang wajar, sedangkan citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: di negeri tempat mereka ditawan itu
  rationale: Bentuk Nifal dari שׁבה menyatakan bahwa mereka dijadikan tawanan. ‘Ditawan’ ringkas, jelas, dan mempertahankan latar pembuangan tanpa menambahkan gagasan yang tidak dinyatakan langsung.
- source_word: וְשָׁבוּ
  choice: berbalik
  rationale: Kata שׁוּב dapat menunjuk pada kembali secara jasmani maupun berpaling kembali secara batin atau rohani. ‘Berbalik’ mempertahankan metafora dan keluasan makna itu tanpa langsung menggantikannya dengan istilah teologis ‘bertobat’.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: memohon belas kasihan kepada-Mu
  rationale: Bentuk Hitpael dari חנן menyatakan permohonan sungguh-sungguh untuk memperoleh kemurahan. Pilihan ini alami dalam bahasa Indonesia dan membuat unsur mencari belas kasihan tetap jelas.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: di negeri penawanan mereka
  rationale: שְׁבִי menunjuk pada keadaan sebagai tawanan atau penawanan. Ungkapan ini dekat dengan bentuk sumber dan tetap mudah dimengerti.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Bentuk pengantar kutipan ini menyatakan isi pengakuan mereka. ‘Dengan berkata’ menghubungkannya secara alami dengan permohonan yang mendahului.
- source_word: חָטָאנוּ
  choice: Kami telah berdosa
  rationale: Padanan langsung dan lazim bagi formula pengakuan dosa ini.
- source_word: הֶעֱוִינוּ
  choice: kami telah bertindak menyimpang
  rationale: Bentuk Hifil dari עוה menyampaikan gagasan bertindak bengkok atau menyimpang secara moral. ‘Bertindak menyimpang’ mempertahankan nuansa tersebut dengan bahasa Indonesia modern tanpa memakai istilah ‘kedurhakaan’ yang lebih abstrak.
- source_word: וְרָשָׁעְנוּ
  choice: kami telah berbuat jahat
  rationale: Kata dari akar רשע menyatakan tindakan fasik atau jahat. ‘Berbuat jahat’ mempertahankan daya verbalnya dan membentuk puncak pengakuan tiga bagian secara alami.
theological_decisions:
- issue: Bahasa pertobatan dalam konteks pembuangan
  choice: Menerjemahkan וְשָׁבוּ sebagai ‘berbalik’.
  alternative: ‘kembali’ atau ‘bertobat’
  rationale: Ayat ini merangkai kesadaran batin, tindakan berbalik, permohonan, dan pengakuan. ‘Berbalik’ menjaga ketegangan antara arti kembali dan pertobatan rohani, tanpa mempersempit kata itu menjadi satu istilah doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur pengakuan tiga bagian dipertahankan, demikian juga pengulangan ‘negeri’ dan perbedaan antara tempat mereka ditawan dengan keadaan penawanan mereka.
