source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: id
  text: Ya TUHAN Allah, janganlah menolak orang yang Kauurapi[a]; ingatlah kasih setia-Mu kepada Daud, hamba-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “janganlah memalingkan wajah orang yang Kauurapi.” “Orang yang Kauurapi” juga dapat diterjemahkan “Mesias-Mu” atau, sesuai konteks, “raja-Mu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ingatlah belas kasihan kepada Daud, hamba-Mu” atau “ingatlah kesetiaan perjanjian-Mu kepada Daud, hamba-Mu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: TUHAN Allah
  rationale: Nama perjanjian YHWH diterjemahkan menurut konvensi Alkitab bahasa Indonesia sebagai “TUHAN”, sedangkan אֱלֹהִים dalam sapaan langsung diterjemahkan “Allah”.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: janganlah menolak
  rationale: Ungkapan harfiahnya ialah “janganlah memalingkan wajah”; dalam konteks permohonan, idiom ini secara alami berarti jangan menolak atau tidak mengindahkan orang yang datang menghadap.
- source_word: מְשִׁיחֶךָ
  choice: orang yang Kauurapi
  rationale: Pilihan ini mempertahankan arti dasar istilah Ibrani dan konteks rajawi tanpa secara tidak perlu menjadikannya gelar “Mesias” atau sekadar menggantinya dengan “raja”.
- source_word: זָכְרָה
  choice: ingatlah
  rationale: Padanan langsung dan wajar bagi bentuk imperatif זכר dalam bahasa doa perjanjian.
- source_word: לְחַסְדֵי דָּוִיד
  choice: kasih setia-Mu kepada Daud
  rationale: חֶסֶד menyatakan kasih setia atau kesetiaan perjanjian. Konteks mendukung pemahaman bahwa kasih setia itu berasal dari Allah dan ditujukan kepada Daud; unsur “-Mu” dibuat eksplisit agar maksudnya jelas dalam bahasa Indonesia.
- source_word: דָּוִיד עַבְדֶּךָ
  choice: Daud, hamba-Mu
  rationale: Frasa aposisional ini diterjemahkan secara langsung dan alami, dengan tanda koma untuk memperjelas hubungan antara nama dan sebutannya.
theological_decisions:
- issue: Makna מְשִׁיחֶךָ dalam doa kerajaan yang memiliki kemungkinan gema mesianik
  choice: orang yang Kauurapi
  alternative: Mesias-Mu; raja-Mu
  rationale: Dalam konteks langsung, istilah ini menunjuk kepada raja dari garis Daud. Terjemahan “orang yang Kauurapi” mempertahankan makna leksikal serta kemungkinan gema kanonis tanpa memaksakan penggunaan gelar mesianik dalam arti yang lebih kemudian.
- issue: Pelaku kasih setia dalam frasa ringkas לְחַסְדֵי דָּוִיד
  choice: kasih setia-Mu kepada Daud
  alternative: belas kasihan kepada Daud; perbuatan kasih setia Daud
  rationale: Susunan Ibraninya ringkas dan secara bentuk dapat dipahami lebih dari satu cara, tetapi konteks doa paling mendukung permohonan agar Allah mengingat kasih setia perjanjian-Nya kepada Daud. Catatan kaki tetap mengakui kemungkinan padanan lain.
translation_notes:
  register: Bahasa doa dibuat khidmat tetapi tetap modern dan mudah dipahami. Bentuk sapaan “Ya” serta pronomina ilahi berhuruf kapital mengikuti kebiasaan luas dalam terjemahan Alkitab bahasa Indonesia. Idiom wajah dialihkan secara dinamis dalam teks utama, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
