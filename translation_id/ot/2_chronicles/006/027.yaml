  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: id
  text: maka kiranya Engkau mendengar dari surga[a] dan mengampuni dosa hamba-hamba-Mu dan umat-Mu Israel, ketika[b] Engkau mengajarkan kepada mereka jalan yang baik yang harus mereka tempuh, serta menurunkan hujan atas tanah-Mu yang telah Engkau berikan kepada umat-Mu sebagai warisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mendengar langit.” Ini merupakan ungkapan untuk Allah yang mendengar dari kediaman-Nya di surga. Dapat juga diterjemahkan “mendengar di surga.”'
    reason: Menjelaskan idiom Ibrani dan mempertahankan alternatif lokatif.
  - marker: b
    text: 'Atau: “sebab.” Kata Ibrani ini dapat dipahami sebagai penanda waktu atau alasan dalam konteks ini.'
    reason: Mempertahankan ambiguitas sintaksis dan teologis כִּי.
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: mendengar dari surga
  rationale: Teks Ibrani secara harfiah berbunyi “mendengar langit,” tetapi dalam rumusan doa ini ungkapan tersebut berarti bahwa Allah mendengar dari kediaman-Nya di surga. “Dari surga” paling alami dalam bahasa Indonesia; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: dan mengampuni dosa
  rationale: חַטָּאת di sini menunjuk pada dosa atau kesalahan yang memerlukan pengampunan. Pilihan ini langsung, wajar, dan sesuai dengan konteks doa.
- source_word: עֲבָדֶיךָ
  choice: hamba-hamba-Mu
  rationale: Dalam konteks hubungan umat dengan Allah, עֶבֶד paling tepat diterjemahkan “hamba,” bukan istilah yang terutama menonjolkan status perbudakan.
- source_word: כִּי תוֹרֵם
  choice: ketika Engkau mengajarkan kepada mereka
  rationale: כִּי dapat dipahami secara temporal atau kausal dalam konteks ini. Teks utama memakai “ketika,” mengikuti alur permohonan, sementara kemungkinan “sebab” dipertahankan dalam catatan kaki.
- source_word: אֶל־הַדֶּרֶךְ הַטּוֹבָה
  choice: jalan yang baik
  rationale: Terjemahan ini mempertahankan gambaran jalan serta penilaian moral “baik” tanpa mempersempitnya menjadi sekadar jalan yang benar.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: yang harus mereka tempuh
  rationale: Ungkapan berjalan pada suatu jalan merupakan metafora bagi cara hidup. “Tempuh” mempertahankan gambaran jalan secara alami dalam bahasa Indonesia, sedangkan “harus” menyampaikan cara hidup yang diharapkan.
- source_word: וְנָתַתָּה מָטָר
  choice: serta memberikan hujan
  rationale: נָתַן berarti “memberikan.” Bentuk ini mempertahankan pilihan leksikal sumber dan tetap dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: עַל־אַרְצְךָ
  choice: kepada tanah-Mu
  rationale: Kepemilikan ilahi yang dinyatakan oleh akhiran pronominal dipertahankan. “Tanah” sesuai dengan konteks turunnya hujan dan pemberian wilayah kepada Israel.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: yang telah Engkau berikan kepada umat-Mu sebagai milik pusaka
  rationale: נַחֲלָה menunjuk pada milik warisan atau pusaka yang diberikan kepada umat. “Milik pusaka” mempertahankan dimensi pemberian yang berkelanjutan tanpa memasukkan penafsiran denominasi tertentu.
theological_decisions:
- issue: Hubungan klausa כִּי dengan tindakan Allah mendengar dan mengampuni
  choice: ketika Engkau mengajarkan kepada mereka
  alternative: sebab Engkau mengajarkan kepada mereka
  rationale: כִּי dapat menyatakan keadaan/waktu maupun alasan. Teks utama mempertahankan alur temporal yang masuk akal dalam doa ini, sedangkan catatan kaki menjaga kemungkinan pembacaan kausal agar ketegangan sintaksis tidak diselesaikan secara diam-diam.
- issue: Tanah sebagai milik Allah sekaligus pusaka umat
  choice: tanah-Mu ... Engkau berikan kepada umat-Mu sebagai milik pusaka
  alternative: tanah yang Engkau berikan kepada umat-Mu
  rationale: 'Terjemahan mempertahankan kedua pernyataan sumber: tanah itu milik Allah dan sekaligus diberikan kepada umat sebagai pusaka. Tidak satu pun sisi dihilangkan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Hamba-hamba-Mu,” “jalan yang baik,” dan “milik pusaka” menjaga warna bahasa doa serta metafora sumber tanpa terdengar kuno secara berlebihan.
