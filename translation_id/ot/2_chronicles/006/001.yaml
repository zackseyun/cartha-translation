id: 2CH.6.1
reference: 2 Chronicles 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: id
  text: Lalu Salomo berkata, “Yahweh telah berfirman bahwa Ia akan berdiam dalam kegelapan yang pekat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “awan gelap.” Istilah Ibrani ini dapat berarti awan tebal, kesuraman, atau kegelapan pekat, khususnya dalam konteks penampakan ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Lalu
  rationale: Penanda urutan waktu ini secara alami melanjutkan alur narasi dalam bahasa Indonesia.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: Salomo berkata
  rationale: Ini padanan langsung dan netral bagi pengantar perkataan Salomo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אָמַר
  choice: telah berfirman
  rationale: Bentuk perfektif menunjuk pada perkataan Yahweh yang sudah diucapkan dan tetap relevan; 'berfirman' merupakan ungkapan Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: לִשְׁכּוֹן
  choice: bahwa Ia akan berdiam
  rationale: Infinitif berawalan ל menyatakan isi perkataan Yahweh; konstruksi ini mengungkapkannya secara alami dalam bahasa Indonesia tanpa menghilangkan makna kehadiran yang menetap.
- source_word: בָּעֲרָפֶל
  choice: dalam kegelapan yang pekat
  rationale: עֲרָפֶל dapat menunjuk pada kegelapan, kesuraman, atau awan tebal yang gelap; pilihan ini mempertahankan gambaran ketersembunyian dalam penyataan ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Gambaran kehadiran ilahi dalam עֲרָפֶל
  choice: kegelapan yang pekat
  alternative: awan gelap
  rationale: Pilihan utama mempertahankan ketegangan antara kedekatan Yahweh dan ketersembunyian-Nya, sedangkan catatan kaki menjaga kemungkinan gambaran awan dalam konteks penampakan ilahi.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Berkata' dipakai bagi Salomo, sedangkan 'berfirman' dipakai bagi Yahweh sesuai kelaziman bahasa Indonesia. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
