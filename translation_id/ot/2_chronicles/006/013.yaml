  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: id
  text: Sebab Salomo telah membuat sebuah panggung perunggu[a] dan menempatkannya di tengah pelataran. Panjangnya lima hasta, lebarnya lima hasta, dan tingginya tiga hasta. Ia berdiri di atasnya, lalu berlutut di hadapan seluruh jemaah Israel dan menadahkan kedua tangannya ke langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “panggung” biasanya berarti “bejana” atau “bejana pembasuhan”. Namun, di sini ukuran benda itu dan kenyataan bahwa Salomo berdiri di atasnya menunjukkan bahwa benda itu adalah sebuah panggung yang ditinggikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperlihatkan fungsi penjelas ayat ini terhadap tindakan dan posisi Salomo dalam konteks sebelumnya.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: sebuah panggung perunggu
  rationale: Walaupun כִּיּוֹר biasanya berarti bejana atau bokor pembasuhan, ukuran benda ini dan pernyataan bahwa Salomo berdiri di atasnya menunjukkan sebuah struktur tinggi yang berfungsi sebagai panggung. Kejanggalan leksikalnya dicatat dalam catatan kaki.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: di tengah pelataran
  rationale: עֲזָרָה menunjuk pada pelataran kompleks Bait Allah, sedangkan בְּתוֹךְ menyatakan letaknya di tengah atau di dalamnya.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: Panjangnya lima hasta, lebarnya lima hasta, dan tingginya tiga hasta
  rationale: Mempertahankan satuan kuno 'hasta' sambil menyajikan dimensi dalam susunan bahasa Indonesia yang alami.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: Ia berdiri di atasnya
  rationale: Menerjemahkan tindakan naratif secara langsung dan menegaskan bahwa benda tersebut menopang Salomo.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: lalu berlutut
  rationale: Dalam bentuk dan konteks ini, ברך berarti berlutut, bukan memberkati. Unsur 'pada lututnya' sudah terkandung secara alami dalam verba Indonesia 'berlutut'.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: di hadapan seluruh jemaah Israel
  rationale: '''Jemaah'' merupakan padanan yang alami bagi קָהָל dalam konteks pertemuan ibadah umum, dan ''di hadapan'' menyampaikan נֶגֶד.'
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: menadahkan tangannya
  rationale: Ungkapan ini secara alami menggambarkan gerak membuka dan mengulurkan kedua tangan sebagai sikap berdoa, tanpa perlu menerjemahkan כַּף secara kaku sebagai telapak.
- source_word: הַשָּׁמָיְמָה
  choice: ke langit
  rationale: Akhiran direktif menyatakan arah; 'ke langit' menyampaikan orientasi tangan Salomo secara ringkas dan alami.
theological_decisions:
- issue: Makna כִּיּוֹר dalam konteks ini
  choice: Diterjemahkan secara kontekstual sebagai 'panggung'.
  alternative: '''bejana perunggu'' atau ''bokor perunggu'''
  rationale: Makna lazim kata tersebut adalah bejana atau bokor, tetapi ukuran benda dan tindakan Salomo berdiri di atasnya menuntut fungsi seperti panggung. Catatan kaki mempertahankan transparansi terhadap kemungkinan leksikal yang tidak biasa ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. 'Hasta' dipertahankan sebagai satuan Alkitab kuno; 'pelataran' dan 'jemaah' dipilih sebagai istilah yang wajar dalam konteks Bait Allah dan ibadah umum.
