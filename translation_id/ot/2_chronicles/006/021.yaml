source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: id
  text: Dengarkanlah permohonan hamba-Mu dan permohonan umat-Mu, Israel, ketika mereka berdoa ke arah tempat ini. Kiranya Engkau mendengar dari tempat kediaman-Mu, dari surga. Dengarkanlah dan ampunilah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: Dengarkanlah / Kiranya Engkau mendengar / Dengarkanlah
  rationale: Pengulangan verba שׁמע dipertahankan karena membentuk struktur permohonan ini. Bentuk imperatif dan optatif dalam bahasa Indonesia menyampaikan daya permohonan yang tersirat oleh konteks doa.
- source_word: תַּחֲנוּנֵי
  choice: permohonan
  rationale: Kata ini menunjuk pada permintaan sungguh-sungguh untuk belas kasihan atau kemurahan. 'Permohonan' alami, jelas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan Salomo kepada Allah, kata עבד terutama berfungsi sebagai sebutan relasional dan penghormatan; 'hamba-Mu' paling sesuai dengan konteks.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: dan umat-Mu Israel
  rationale: Ungkapan ini menyebut Israel sebagai umat milik Allah dan secara alami berkoordinasi dengan 'hamba-Mu' dalam bahasa Indonesia.
- source_word: יִתְפַּלְלוּ
  choice: mereka berdoa
  rationale: Verba ini berarti 'berdoa'; arah doa dinyatakan oleh frasa preposisional sesudahnya.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: menghadap tempat ini
  rationale: '''Menghadap'' menyampaikan arah doa kepada atau ke arah bait tanpa menyiratkan bahwa orang-orang itu berada di tempat tersebut.'
- source_word: מִמְּקוֹם שִׁבְתְּךָ
  choice: dari tempat kediaman-Mu
  rationale: Terjemahan ini mempertahankan unsur 'tempat' dan 'kediaman' serta cocok dengan penjelasan berikutnya, yaitu 'dari surga'.
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, kata ini lazim merujuk pada surga sebagai tempat kediaman Allah; bentuk tunggal adalah ungkapan Indonesia yang alami.
- source_word: וְסָלָחְתָּ
  choice: dan ampunilah
  rationale: Verba סלח menyatakan pengampunan atas dosa atau kesalahan. Bentuk permohonan 'ampunilah' jelas dan sesuai dengan rangkaian doa.
theological_decisions:
- issue: Transendensi Allah dan teologi bait
  choice: Israel berdoa menghadap bait, tetapi Allah mendengar dari tempat kediaman-Nya di surga.
  alternative: Melokalisasi Allah di dalam bait, atau menjadikan acuan kepada bait semata-mata simbolis.
  rationale: 'Teks Ibrani mempertahankan kedua unsur itu sekaligus: bait menjadi arah doa, sedangkan surga disebut sebagai tempat kediaman Allah. Terjemahan tidak menghapus ketegangan tersebut.'
- issue: Daya gramatikal rangkaian bentuk perfek dan imperfek dalam konteks doa
  choice: 'Menerjemahkannya sebagai permohonan: ''Dengarkanlah'', ''Kiranya Engkau mendengar'', dan ''ampunilah''.'
  alternative: 'Menerjemahkan seluruh bentuk itu sebagai pernyataan masa depan: ''Engkau akan mendengar ... dan mengampuni''.'
  rationale: Dalam konteks doa pentahbisan, bentuk-bentuk tersebut berdaya petitionary. Terjemahan sebagai permohonan menjaga fungsi wacana tanpa mengubah tindakan mendengar dan mengampuni menjadi sekadar pernyataan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital mengikuti kebiasaan penerbitan Alkitab Indonesia. Pengulangan 'dengar' sengaja dipertahankan agar struktur retoris teks Ibrani tetap terasa.
