base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: id
  text: 'maka dengarlah dari surga, bertindaklah, dan hakimilah hamba-hamba-Mu: balaslah orang jahat dengan menimpakan perbuatannya ke atas kepalanya sendiri[a], dan nyatakanlah orang benar benar[b] dengan memberikan kepadanya sesuai dengan kebenarannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan jalannya di atas kepalanya,” sebuah ungkapan Ibrani tentang akibat perbuatan seseorang yang kembali menimpanya dalam penghakiman.
    reason: cultural_note
  - marker: b
    text: Atau “membenarkan orang benar.” Kata Ibraninya merupakan istilah hukum yang berarti menyatakan atau memperlakukan seseorang sebagai pihak yang benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: dengarlah dari surga
  rationale: Dalam bahasa doa, שׁמע mencakup mendengar dengan perhatian dan kesiapan menanggapi. Bentuk tunggal “surga” merupakan ungkapan Indonesia yang alami untuk bentuk Ibrani yang secara morfologis jamak.
- source_word: וְעָשִׂיתָ
  choice: dan bertindaklah
  rationale: Dalam konteks permohonan pengadilan ilahi, kata kerja umum עשה menunjuk pada tindakan nyata Allah; “bertindaklah” lebih jelas daripada “lakukanlah” tanpa menambahkan objek yang tidak ada.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: Hakimilah hamba-hamba-Mu
  rationale: 'שׁפט bersifat yudisial di sini, sebagaimana dijelaskan oleh dua hasil yang berlawanan: pembalasan terhadap orang jahat dan pembenaran orang benar.'
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: balaslah orang jahat
  rationale: Konstruksi ini menyatakan pembalasan setimpal. “Orang jahat” lebih langsung dipahami dalam bahasa Indonesia modern daripada “orang fasik,” tanpa menghilangkan pertentangannya dengan orang benar.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: dengan menimpakan perbuatannya ke atas kepalanya sendiri
  rationale: דֶּרֶךְ secara harfiah berarti “jalan,” tetapi di sini menunjuk pada tingkah laku. Terjemahan mempertahankan gambaran Ibrani tentang akibat perbuatan yang kembali menimpa pelakunya.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: dan nyatakanlah orang benar sebagai pihak yang benar
  rationale: 'Bentuk Hifil הצדיק merupakan istilah forensik: menyatakan atau memperlakukan seseorang sebagai pihak yang benar. Rumusan ini mempertahankan nuansa ruang pengadilan dan menghindari asosiasi doktrinal tambahan yang mungkin dibawa oleh istilah “membenarkan.”'
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: dengan memberikan kepadanya sesuai dengan kebenarannya
  rationale: Terjemahan ini mengikuti bentuk teks yang berbicara tentang pemberian yang sepadan dengan צדקה orang tersebut, tanpa mempersempitnya menjadi “memberi pahala.”
theological_decisions:
- issue: Sifat forensik penghakiman ilahi
  choice: 'Ayat diterjemahkan dengan bahasa pengadilan: Allah menghakimi, membalas orang jahat, dan menyatakan orang benar sebagai pihak yang benar.'
  alternative: Memahami שׁפט secara umum sebagai memerintah atau campur tangan.
  rationale: Pasangan orang jahat dan orang benar, bersama verba שׁפט dan הצדיק, menempatkan permohonan ini dalam kerangka keputusan hukum.
- issue: Makna הצדיק
  choice: nyatakanlah orang benar sebagai pihak yang benar
  alternative: benarkanlah orang benar
  rationale: Keduanya mungkin secara leksikal, tetapi pilihan utama menyatakan makna forensiknya secara jelas dalam bahasa Indonesia dan tidak memasukkan rumusan teologis dari konteks lain.
- issue: Pemberian menurut kebenaran seseorang
  choice: memberikan kepadanya sesuai dengan kebenarannya
  alternative: memberinya pahala sesuai dengan kebenarannya
  rationale: “Memberikan” mempertahankan keluasan לָתֵת, sedangkan “memberi pahala” menentukan sifat pemberian secara lebih khusus daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif mempertahankan corak permohonan doa. Sapaan ilahi ditulis dengan kapital pada enklitik “-Mu” sesuai kebiasaan ejaan teks keagamaan Indonesia.
