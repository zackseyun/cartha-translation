  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: id
  text: Namun, perhatikanlah doa hamba-Mu dan permohonannya untuk memperoleh belas kasihan[a], ya Yahweh, Allahku, untuk mendengarkan seruan[b] dan doa yang dipanjatkan hamba-Mu di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permohonannya.” Kata Ibrani ini menunjuk pada permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasihan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini dapat berarti seruan yang nyaring; di sini kemungkinan besar seruan meminta pertolongan dalam doa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Namun, perhatikanlah
  rationale: Kata kerja פנה secara harfiah berarti ‘berpaling’ atau ‘mengarahkan diri’, tetapi dalam konteks permohonan kepada Allah berarti memberikan perhatian yang baik. ‘Perhatikanlah’ menyampaikan idiom itu secara alami, sedangkan ‘namun’ mencerminkan hubungan ayat ini dengan pernyataan sebelumnya.
- source_word: תְּפִלַּת
  choice: doa
  rationale: Padanan baku dan alami untuk תְּפִלָּה, serta dipertahankan pada kemunculan berikutnya untuk menjaga pengulangan Ibrani.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam bahasa doa kerajaan, עבד menyatakan kerendahan dan pengabdian orang yang berbicara kepada Allah. ‘Hamba-Mu’ merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: תְּחִנָּתוֹ
  choice: permohonannya akan belas kasihan
  rationale: תְּחִנָּה menunjuk pada permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasihan. Frasa ini mempertahankan nuansa tersebut dan membedakannya dari ‘doa’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Bentuk dengan akhiran posesif orang pertama tunggal diterjemahkan langsung sebagai ‘Allahku’ dalam sapaan.
- source_word: לִשְׁמֹעַ
  choice: dan dengarkanlah
  rationale: Infinitif שמע menjelaskan tujuan atau hasil dari tindakan memperhatikan. Susunan koordinatif ini alami dalam bahasa Indonesia dan tetap menyatakan permohonan agar Allah mendengar.
- source_word: הָרִנָּה
  choice: seruan
  rationale: רִנָּה dapat berarti seruan nyaring dan, dalam konteks doa ini, kemungkinan besar merupakan seruan meminta pertolongan. ‘Seruan’ mempertahankan keluasan maknanya.
- source_word: מִתְפַּלֵּל
  choice: dipanjatkan
  rationale: Partisipel menunjukkan tindakan doa yang sedang berlangsung. Bentuk pasif ini menghasilkan ungkapan Indonesia yang alami tanpa menghilangkan pelaku yang disebut sebagai ‘hamba-Mu’.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Padanan langsung dan alami bagi ungkapan yang berarti berada dalam hadirat Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Transliterasi ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa תְּחִנָּה
  choice: permohonan akan belas kasihan
  alternative: permohonan atau permohonan akan kemurahan
  rationale: Pilihan utama menyatakan bahwa permohonan tersebut mengharapkan belas kasihan tanpa menentukan lebih jauh bentuk pertolongan yang diminta.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Kapitalisasi pada akhiran pronominal yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Struktur dibuat alami bagi pembaca masa kini sambil mempertahankan pengulangan ‘doa’, perbedaan antara doa dan permohonan belas kasihan, serta nama ilahi Yahweh.
