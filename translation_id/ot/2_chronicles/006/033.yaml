revisions:
- from: maka dengarkanlah dari surga, dari tempat kediaman-Mu, dan lakukanlah segala yang dimohon orang asing itu kepada-Mu, supaya semua bangsa di bumi mengenal nama-Mu dan takut kepada-Mu, seperti umat-Mu Israel, serta mengetahui bahwa nama-Mu diserukan atas rumah yang telah kubangun ini.[a]
  to: maka dengarlah dari surga, dari tempat kediaman-Mu, dan lakukanlah segala yang dimohon orang asing itu kepada-Mu, supaya semua bangsa di bumi mengenal nama-Mu dan takut kepada-Mu, seperti umat-Mu Israel, serta mengetahui bahwa nama-Mu disebut atas rumah ini yang telah kubangun.[a]
  rationale: Revisi terbatas pada dua ungkapan. “Dengarlah” memberi padanan Indonesia yang lebih langsung bagi תִּשְׁמַע dalam konteks doa. “Disebut atas” menggantikan “diserukan atas” untuk merepresentasikan נִקְרָא עַל secara dekat, lazim, dan tanpa mempersempit idiom itu menjadi satu penafsiran. Catatan kaki mempertahankan alternatif interpretatif.
