  verdict: revise
  source_fidelity: 'Draf pada umumnya mengikuti teks Ibrani dengan baik: permohonan agar Allah mendengar dari surga dan bertindak menurut semua yang dimohon orang asing itu, dengan tujuan agar bangsa-bangsa mengenal nama-Nya, takut kepada-Nya seperti Israel, dan mengetahui hubungan nama-Nya dengan rumah itu. Namun, “diserukan atas rumah” bukan padanan Indonesia yang wajar untuk idiom נִקְרָא עַל dan dapat menggeser makna ke tindakan menyerukan/proklamasi.'
  naturalness: “Dengarkanlah dari surga” kurang alami untuk makna “hear” dalam doa, karena dengarkanlah lazimnya mengundang seseorang untuk menyimak sesuatu. “Dengarlah dari surga” menyampaikan permohonan itu secara lebih idiomatis. “Nama-Mu disebut atas rumah ini” adalah bentuk Indonesia yang alami dan tetap dekat pada idiom sumber.
  terminology: “Surga,” “tempat kediaman-Mu,” “orang asing,” “takut kepada-Mu,” dan “nama-Mu” sesuai register Alkitab Indonesia modern. Kata “disebut” mempertahankan idiom nama Allah atas rumah tanpa memaksakan penafsiran bahwa rumah itu semata-mata ‘menyandang’ nama-Nya.
  issues:
  - severity: medium
    issue: “nama-Mu diserukan atas rumah ini”
    rationale: Kata diserukan biasanya berarti diteriakkan atau diproklamasikan dan bukan bentuk lazim untuk idiom Ibrani ‘nama-Mu disebut/dipanggil atas rumah ini.’ Ganti dengan “disebut” agar dekat dengan sumber dan alami dalam bahasa Indonesia.
  - severity: low
    issue: “dengarkanlah dari surga”
    rationale: Untuk permohonan agar Allah ‘hear,’ bentuk “dengarlah dari surga” lebih alami dalam bahasa Indonesia; dengarkanlah lebih lazim berarti ‘listen to.’
  revised_text: maka dengarlah dari surga, dari tempat kediaman-Mu, dan lakukanlah segala yang dimohon orang asing itu kepada-Mu, supaya semua bangsa di bumi mengenal nama-Mu dan takut kepada-Mu, seperti umat-Mu Israel, serta mengetahui bahwa nama-Mu disebut atas rumah ini yang telah kubangun.[a]
