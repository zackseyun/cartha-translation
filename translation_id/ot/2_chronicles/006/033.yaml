  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: id
  text: maka dengarlah dari surga, dari tempat kediaman-Mu, dan lakukanlah segala yang dimohon orang asing itu kepada-Mu, supaya semua bangsa di bumi mengenal nama-Mu dan takut kepada-Mu, seperti umat-Mu Israel, serta mengetahui bahwa nama-Mu disebut atas rumah ini yang telah kubangun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “rumah ini menyandang nama-Mu.” Secara harfiah, ungkapan Ibraninya berbunyi “nama-Mu disebut atas rumah ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: dengarkanlah
  rationale: Dalam konteks doa, verba ini menyatakan mendengar dengan penuh perhatian dan kesiapan untuk menanggapi; bentuk imperatif Indonesia sesuai dengan fungsi bentuk Ibrani dalam permohonan.
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Walaupun bentuk Ibraninya jamak secara morfologis, 'surga' merupakan padanan kolektif yang alami dalam bahasa Indonesia untuk tempat kediaman Allah.
- source_word: מִמְּכוֹן שִׁבְתֶּךָ
  choice: dari tempat kediaman-Mu
  rationale: Mempertahankan gagasan tentang tempat kediaman yang tetap tanpa memakai ungkapan yang kuno.
- source_word: וְעָשִׂיתָ
  choice: lakukanlah
  rationale: Menjaga keluasan makna עשה sebagai tindakan Allah sebagai jawaban atas doa, tanpa mempersempitnya menjadi 'kabulkanlah'.
- source_word: כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: segala yang dimohon ... kepada-Mu
  rationale: Dalam konteks ini קרא אל menunjuk pada seruan permohonan. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan 'segala'.
- source_word: הַנָּכְרִי
  choice: orang asing
  rationale: Menunjuk kepada orang yang bukan bagian dari Israel; 'orang asing' jelas dan wajar dalam konteks ini.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: semua bangsa di bumi
  rationale: Konteksnya universal, sehingga הארץ berarti bumi, sedangkan bentuk jamak עמים menunjuk pada berbagai bangsa.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: dan takut kepada-Mu
  rationale: Mempertahankan ungkapan Alkitab tentang takut akan Allah, yang mencakup rasa gentar dan hormat, tanpa melemahkannya menjadi sekadar 'menghormati'.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: nama-Mu diserukan atas rumah ... ini
  rationale: Mempertahankan idiom Ibrani secara cukup dekat dan menaruh penjelasan interpretatif yang lebih alami dalam catatan kaki.
theological_decisions:
- issue: Bahasa tentang tempat kediaman Allah
  choice: Mempertahankan 'dari surga, dari tempat kediaman-Mu' serta menyebut bait sebagai 'rumah' yang terkait dengan nama Allah.
  alternative: Memparafrasakan 'dari hadirat-Mu di surga' untuk menghindari kesan lokalisasi.
  rationale: Ayat ini sendiri membedakan surga sebagai tempat kediaman Allah dari rumah di bumi yang menyandang nama-Nya. Terjemahan dekat menjaga ketegangan teologis teks tanpa penjelasan sistematis tambahan.
- issue: Makna takut akan Allah bagi bangsa-bangsa
  choice: takut kepada-Mu
  alternative: menghormati-Mu atau menyegani-Mu
  rationale: Padanan 'takut' mempertahankan daya leksikal dan bobot teologis ירא, termasuk unsur hormat yang penuh rasa gentar.
- issue: Idiom nama Allah atas rumah
  choice: nama-Mu diserukan atas rumah ini
  alternative: rumah ini menyandang nama-Mu
  rationale: Teks utama mempertahankan bentuk idiom yang lebih dekat dengan bahasa sumber, sedangkan catatan kaki memberikan arti interpretatif tanpa menutup kemungkinan nuansa proklamasi atau kepemilikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran pronomina untuk Allah ditulis dengan huruf kapital. Susunan kalimat mengikuti alur doa Ibrani, tetapi dibuat cukup alami bagi pembaca umum.
