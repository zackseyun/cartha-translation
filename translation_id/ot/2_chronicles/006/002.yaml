base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: id
  text: Namun, aku telah membangun bagi-Mu rumah kediaman yang luhur[a], tempat yang tetap bagi-Mu untuk berdiam selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: rumah kediaman yang tinggi atau mulia. Kata Ibrani yang dipakai di sini jarang digunakan dan dapat mengandung nuansa ketinggian, keluhuran, atau kemuliaan.'
    reason: Menandai ketidakpastian leksikal yang nyata pada זְבֻל tanpa membebani teks utama.
lexical_decisions:
- source_word: בֵית זְבֻל (bêt zevul)
  choice: rumah kediaman yang luhur
  rationale: זְבֻל adalah kata langka yang menunjuk pada kediaman yang tinggi, luhur, atau mulia. Pilihan ini mempertahankan nuansa ketinggian/keluhuran tanpa sekadar menyiratkan ukuran fisik bangunan.
- source_word: מָכוֹן (makhon)
  choice: tempat yang tetap
  rationale: Kata ini menunjuk pada tempat yang ditegakkan atau ditetapkan dengan kokoh; 'tempat yang tetap' alami dalam bahasa Indonesia dan membedakannya dari 'rumah kediaman' pada klausa sebelumnya.
- source_word: עוֹלָמִים (olamim)
  choice: selama-lamanya
  rationale: Bentuk ini menyatakan keberlangsungan tanpa batas dalam konteks kediaman Allah dan secara wajar diterjemahkan 'selama-lamanya'.
theological_decisions:
- issue: Bahasa tentang Allah berdiam di rumah yang dibangun manusia
  choice: bagi-Mu untuk berdiam selama-lamanya
  alternative: menjadi lambang kehadiran-Mu selama-lamanya
  rationale: Teks Ibrani secara langsung berbicara tentang kediaman Allah. Terjemahan tidak menambahkan penjelasan teologis yang akan melunakkan atau menafsirkan pernyataan itu, sehingga ketegangan dengan transendensi Allah dalam konteks tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penulisan Alkitab bahasa Indonesia. Konjungsi 'Namun' mempertahankan peralihan kontras dari ayat sebelumnya.
