  source_fidelity: Terjemahan secara akurat mencerminkan וַאֲנִי sebagai peralihan kontras yang sesuai konteks, בָּנִיתִי sebagai tindakan yang sudah dilakukan, בֵּית זְבֻל sebagai rumah/kediaman yang luhur, serta מָכוֹן לְשִׁבְתְּךָ עוֹלָמִים sebagai tempat tetap bagi Allah untuk berdiam selama-lamanya. Nuansa leksikal זְבֻל yang tidak sepenuhnya pasti dipertahankan melalui catatan kaki tanpa dipaksakan menjadi satu arti teknis.
