language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: id
  text: 'Demikian juga mengenai orang asing yang bukan dari antara umat-Mu, Israel, tetapi datang dari negeri yang jauh karena nama-Mu yang agung, tangan-Mu yang kuat, dan lengan-Mu yang terentang: apabila mereka datang dan berdoa menghadap rumah ini[a][b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani beralih dari bentuk tunggal (“orang asing ... datang”) ke bentuk jamak (“mereka datang dan berdoa”), mungkin karena orang asing itu dipakai sebagai contoh yang mewakili orang-orang asing pada umumnya.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “kepada rumah ini”; dalam konteks doa ini, kata depan Ibrani tersebut menyatakan arah, yaitu “menghadap rumah ini”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: orang asing
  rationale: Istilah ini menunjuk kepada orang dari bangsa lain, bukan orang Israel. “Orang asing” merupakan padanan Indonesia modern yang alami dan mempertahankan pembedaan etnis serta umat perjanjian.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: yang bukan berasal dari umat-Mu Israel
  rationale: Frasa ini menyatakan bahwa orang tersebut bukan bagian dari Israel, umat Allah. “Berasal dari umat-Mu” menyampaikan ungkapan sumber/keanggotaan מֵעַמְּךָ secara wajar.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: tetapi datang dari negeri yang jauh
  rationale: 'Kata sambung diterjemahkan “tetapi” agar pertentangan setelah klausa negatif terdengar alami: ia bukan berasal dari Israel, tetapi datang dari negeri jauh.'
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: karena nama-Mu yang agung
  rationale: לְמַעַן di sini menyatakan alasan atau dorongan kedatangan. “Nama” tetap dipertahankan sebagai ungkapan alkitabiah bagi kemasyhuran dan jati diri Allah yang dinyatakan.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: tangan-Mu yang kuat
  rationale: Terjemahan konkret ini mempertahankan gambaran antropomorfis tentang kuasa Allah dalam tindakan.
- source_word: וּזְרוֹעֲךָ הַנְּטוּיָה
  choice: lengan-Mu yang teracung
  rationale: Ungkapan ini mempertahankan citra Ibrani tentang lengan yang dibentangkan sebagai lambang kuasa ilahi yang bertindak.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: apabila mereka datang dan berdoa
  rationale: Bentuk verba jamak dipertahankan sesudah penyebutan tunggal “orang asing”, sehingga pergeseran jumlah dalam bahasa Ibrani tidak dihapuskan.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: menghadap rumah ini
  rationale: Dalam konteks doa Salomo, אֶל menyatakan arah doa. “Menghadap rumah ini” alami dalam bahasa Indonesia, sedangkan “rumah” mempertahankan istilah konkret Ibrani tanpa menggantinya dengan “Bait Allah” atau “temple” secara eksplisit.
theological_decisions:
- issue: Pergeseran dari “orang asing” tunggal ke verba jamak
  choice: Mempertahankan “orang asing” lalu “mereka datang dan berdoa”
  alternative: “apabila ia datang dan berdoa” atau “apabila orang-orang asing datang dan berdoa”
  rationale: Teks Ibrani berpindah dari nomina dan verba tunggal kepada dua verba jamak. Bentuk Indonesia ini mempertahankan ketegangan gramatikal itu dan memungkinkan orang asing tersebut dipahami sebagai kasus perwakilan tanpa memaksakan seluruh kalimat menjadi tunggal atau jamak.
- issue: Bahasa antropomorfis mengenai kuasa Allah
  choice: “tangan-Mu yang kuat, dan lengan-Mu yang teracung”
  alternative: “kuasa-Mu yang besar”
  rationale: Gambaran tubuh dalam teks sumber berkaitan dengan bahasa tindakan Allah yang penuh kuasa. Citra tersebut dipertahankan dan tidak diabstraksikan.
- issue: Arah doa kepada rumah Allah
  choice: “berdoa menghadap rumah ini”
  alternative: “berdoa kepada rumah ini”
  rationale: Rumah itu bukan penerima doa; frasa tersebut menunjukkan arah orang berdoa. Terjemahan ini menjaga agar doa dipahami tertuju kepada Allah sambil tetap mengikuti orientasi kepada rumah-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai kapital hormat. Struktur ayat tetap terbuka dengan tanda koma karena kalimat dan permohonan Salomo berlanjut ke ayat berikutnya.
