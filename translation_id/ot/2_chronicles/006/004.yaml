  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: id
  text: Lalu ia berkata[a], “Terpujilah Yahweh, Allah Israel, yang dengan mulut-Nya telah berfirman kepada Daud, ayahku, dan dengan tangan-Nya telah menggenapinya, demikian:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani sengaja menyejajarkan “dengan mulut-Nya” dan “dengan tangan-Nya”: Allah mengucapkan janji itu dan kemudian mewujudkannya melalui tindakan-Nya.'
    reason: Menjelaskan kesejajaran ungkapan Ibrani dan objek yang tersirat dalam kata “menggenapi”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan perkataan Salomo; “lalu” wajar dalam narasi Indonesia tanpa memberi penekanan berlebihan pada urutan waktu.
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Formula pujian kepada Allah ini paling alami dan khidmat dalam bahasa Indonesia; bentuk ini menyampaikan seruan berkat atau pujian, bukan sekadar pernyataan keadaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi Ibrani ini secara alami menyatakan hubungan Yahweh dengan Israel.
- source_word: דִּבֶּר בְּפִיו
  choice: dengan mulut-Nya telah berfirman
  rationale: “Berfirman” sesuai untuk perkataan Allah, sementara unsur eksplisit “dengan mulut-Nya” dipertahankan agar sejajar dengan “dengan tangan-Nya” dalam klausa berikutnya.
- source_word: אֵת דָּוִיד אָבִי
  choice: kepada Daud, ayahku
  rationale: Dalam konstruksi dengan דִּבֶּר, Daud adalah orang yang menerima firman; aposisi “ayahku” dipertahankan dengan jelas.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: dan dengan tangan-Nya telah menggenapinya
  rationale: Objek tersirat dinyatakan dengan “-nya”, yaitu hal yang telah difirmankan. “Dengan tangan-Nya” mempertahankan gambaran tindakan ilahi dan kesejajarannya dengan “mulut-Nya”.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif pengutip ini memperkenalkan isi firman pada ayat berikutnya; “demikian:” lebih alami daripada terjemahan harfiah “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Bahasa antropomorfis tentang mulut dan tangan Allah
  choice: Mempertahankan “dengan mulut-Nya” dan “dengan tangan-Nya”
  alternative: Menyederhanakannya menjadi “berjanji dan melaksanakannya”
  rationale: Teks sengaja menyejajarkan firman dan tindakan Allah. Mempertahankan kedua gambaran itu menghindari penghilangan unsur puitis dan teologis dari bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penulisan religius Indonesia. Susunan “dengan mulut-Nya … dengan tangan-Nya” sengaja dipertahankan meski agak tinggi ragamnya, karena merupakan kesejajaran penting dalam teks Ibrani.
