base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: id
  text: Maka dengarkanlah dari surga, dari tempat kediaman-Mu, doa dan permohonan mereka; berikanlah keadilan kepada mereka[a], dan ampunilah umat-Mu yang telah berdosa terhadap-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tegakkanlah keadilan bagi mereka” atau “tanganilah perkara mereka dengan adil.” Secara harfiah, frasa Ibraninya berbunyi “lakukanlah penghakiman/keadilan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: maka dengarkanlah
  rationale: Bentuk perfek orang kedua tunggal maskulin berada dalam doa dan berfungsi sebagai permohonan kepada Allah. Kata “maka” meneruskan alur bersyarat dari ayat-ayat sebelumnya.
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, “surga” merupakan padanan idiomatis dan wajar dalam bahasa Indonesia untuk tempat Allah mendengar.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: dari tempat kediaman-Mu
  rationale: מָכוֹן menunjuk pada tempat yang tetap atau ditetapkan, sedangkan שִׁבְתְּךָ menyatakannya sebagai kediaman Allah. Ungkapan ini formal, jelas, dan dekat dengan struktur sumber.
- source_word: תְּפִלָּתָם
  choice: doa mereka
  rationale: Padanan lazim bagi תְּפִלָּה; bentuk tunggal kolektif dipertahankan secara alami.
- source_word: תְּחִנֹּתֵיהֶם
  choice: permohonan mereka
  rationale: Kata ini menunjuk pada permintaan sungguh-sungguh, khususnya untuk belas kasihan. “Permohonan” membedakannya dari istilah umum “doa” tanpa memakai bahasa arkais.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: belalah perkara mereka
  rationale: Idiom ini secara harfiah berbicara tentang melakukan atau menangani penghakiman/perkara mereka. Dalam konteks ini, ungkapan tersebut meminta Allah bertindak secara yudisial bagi mereka. “Belalah perkara mereka” mempertahankan nuansa hukum dalam bahasa Indonesia yang alami.
- source_word: וְסָלַחְתָּ
  choice: dan ampunilah
  rationale: Padanan baku dan alami bagi סלח dalam konteks pengampunan ilahi; bentuk permohonan sesuai dengan konteks doa.
- source_word: לְעַמְּךָ
  choice: umat-Mu
  rationale: Dalam konteks perjanjian dan doa kepada Allah, עַם paling alami diterjemahkan “umat”; akhiran posesif dirender dengan “-Mu”.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: yang telah berdosa terhadap-Mu
  rationale: Preposisi לְ bersama חטא menyatakan pelanggaran yang diarahkan kepada Allah. “Telah berdosa” menyampaikan tindakan lampau yang akibatnya tetap relevan dalam permohonan ini.
theological_decisions:
- issue: Bahasa yudisial dalam מִשְׁפָּטָם
  choice: belalah perkara mereka
  alternative: tegakkanlah keadilan bagi mereka; tanganilah perkara mereka dengan adil
  rationale: Terjemahan utama mempertahankan dimensi hukum dan arah tindakan Allah bagi pihak para pemohon tanpa menyamakan pengampunan dengan pengabaian keadilan. Catatan kaki menjaga kemungkinan bahwa frasa itu lebih umum berarti memberikan atau melaksanakan keadilan bagi mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif halus dengan “-lah” mencerminkan fungsi permohonan dalam doa. Huruf kapital pada pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Tanda titik koma mempertahankan rangkaian satu kalimat sambil memperjelas peralihan dari permohonan agar Allah mendengar kepada permohonan agar Ia bertindak dan mengampuni.
