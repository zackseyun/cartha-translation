language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: id
  text: Jika umat-Mu Israel dikalahkan di hadapan musuh karena mereka berdosa terhadap-Mu, lalu mereka berbalik[a], mengakui nama-Mu[b], berdoa, dan memohon belas kasihan[c] di hadapan-Mu di rumah ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kembali”; dalam konteks perjanjian, kata Ibrani ini juga dapat mengandung arti “bertobat”.
    reason: lexical_alternative
  - marker: b
    text: Atau “memuji nama-Mu”; kata Ibrani ini juga dapat menyatakan ucapan syukur.
    reason: lexical_alternative
  - marker: c
    text: Atau “memohon kemurahan” atau “memohon perkenanan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִנָּגֵף
  choice: dikalahkan
  rationale: Bentuk Nifal menyatakan bahwa Israel mengalami kekalahan di hadapan musuh; pilihan ini mempertahankan makna pasif dan konteks peperangan secara alami dalam bahasa Indonesia.
- source_word: לִפְנֵי אוֹיֵב
  choice: di hadapan musuh
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang menggambarkan kekalahan di hadapan atau dalam kuasa musuh tanpa menjadikan musuh itu tentu tertentu.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: karena mereka berdosa terhadap-Mu
  rationale: כִּי paling wajar menyatakan sebab kekalahan, sedangkan לְ dengan pronomina merujuk kepada Allah sebagai pihak yang terhadap-Nya dosa dilakukan.
- source_word: וְשָׁבוּ
  choice: mereka berbalik
  rationale: שׁוב dapat berarti kembali dan dalam konteks perjanjian mengandung nuansa pertobatan. 'Berbalik' mempertahankan gambaran verbal itu tanpa mengubahnya menjadi istilah teologis yang terlalu khusus.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: mengakui nama-Mu
  rationale: Hifil ידה dapat menyatakan pengakuan, pujian, atau ucapan syukur. Dalam rangkaian berbalik dari dosa dan memohon kepada Allah, 'mengakui nama-Mu' mempertahankan unsur pengakuan akan Allah, sementara ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: וְהִתְפַּלְלוּ
  choice: berdoa
  rationale: Ini merupakan padanan Indonesia yang baku dan alami bagi bentuk Hitpael dari פלל.
- source_word: וְהִתְחַנְּנוּ
  choice: memohon belas kasihan
  rationale: Bentuk Hitpael dari חנן menyatakan permohonan sungguh-sungguh akan kemurahan atau perkenanan; pilihan ini jelas dan alami bagi pembaca modern.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Ungkapan ini mempertahankan idiom Ibrani tentang menghadap Allah secara langsung dalam doa.
- source_word: בַּבַּיִת הַזֶּה
  choice: di rumah ini
  rationale: בַּ berarti 'di dalam/di', bukan 'ke arah', dan בַּיִת secara harfiah berarti 'rumah'. Dalam doa pentahbisan Salomo, acuannya kepada rumah Allah sudah jelas dari konteks.
theological_decisions:
- issue: Nuansa pertobatan dalam וְשָׁבוּ
  choice: berbalik
  alternative: kembali; bertobat
  rationale: '''Berbalik'' membiarkan nuansa pertobatan perjanjian terdengar tanpa mempersempit verba Ibrani yang juga secara umum berarti kembali.'
- issue: Makna וְהוֹדוּ אֶת שְׁמֶךָ
  choice: mengakui nama-Mu
  alternative: memuji nama-Mu; bersyukur kepada-Mu
  rationale: Konteks pemulihan sesudah dosa mendukung makna pengakuan terhadap nama Allah, tetapi rentang makna ידה tetap diakui dalam catatan kaki dan tidak dipaksakan menjadi satu gagasan teologis saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Susunan klausa mengikuti alur Ibrani, tetapi konjungsinya dibuat alami bagi pembaca umum.
