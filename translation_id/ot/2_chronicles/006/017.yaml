  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: id
  text: Sekarang, ya Yahweh, Allah Israel, kiranya firman-Mu yang telah Kauucapkan kepada Daud, hamba-Mu, diteguhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kiranya janji-Mu terlaksana” atau “kiranya firman-Mu terbukti benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda waktu dan wacana yang memperkenalkan permohonan berikutnya. Dalam bahasa Indonesia, “Sekarang” lebih alami daripada “Dan sekarang” tanpa menghilangkan alur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan frasa konstruksi yang mengidentifikasi Yahweh sebagai Allah Israel; bentuk ini baku dan alami dalam bahasa Indonesia.
- source_word: יֵאָמֵן
  choice: kiranya ... diteguhkan
  rationale: Bentuk nifal dari אמן menyatakan permohonan agar firman yang diucapkan terbukti kokoh atau terlaksana. “Kiranya ... diteguhkan” mempertahankan nuansa pasif dan permohonannya.
- source_word: דְּבָרְךָ
  choice: firman-Mu
  rationale: Secara harfiah berarti “perkataan/firman-Mu”. Dalam konteks perkataan ilahi, “firman-Mu” alami dan bermartabat, sekaligus tidak mempersempitnya secara interpretatif menjadi “janji-Mu”.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: yang telah Kauucapkan
  rationale: Mempertahankan hubungan leksikal antara “firman” dan tindakan mengucapkannya. Aspek lampau dibuat jelas dengan “telah”.
- source_word: לְעַבְדְּךָ
  choice: kepada hamba-Mu
  rationale: Preposisi ל dengan דבר menandai pihak yang menerima perkataan. “Hamba” sesuai dengan konteks kerajaan dan perjanjian.
- source_word: לְדָוִיד
  choice: Daud
  rationale: Nama pribadi diterjemahkan menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Apakah דְּבָרְךָ diterjemahkan secara interpretatif sebagai “janji-Mu”
  choice: firman-Mu
  alternative: janji-Mu
  rationale: Konteks memang merujuk kepada janji kepada Daud, tetapi “firman-Mu” lebih dekat dengan bentuk sumber dan membiarkan konteks menyampaikan daya janjinya.
- issue: Makna יֵאָמֵן dalam permohonan Salomo
  choice: kiranya ... diteguhkan
  alternative: kiranya ... terbukti benar atau kiranya janji-Mu terlaksana
  rationale: Pilihan utama mempertahankan bentuk pasif/resultatif dan ketegangan antara kekokohan firman serta pembuktiannya melalui penggenapan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada doa. Partikel vokatif “ya” membuat sapaan kepada Yahweh alami. Kapitalisasi pronomina ilahi mengikuti kebiasaan religius Indonesia tanpa mengubah makna sumber.
