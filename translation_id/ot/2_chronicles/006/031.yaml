base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: id
  text: supaya mereka takut kepada-Mu[a] dan hidup menurut jalan-jalan-Mu selama mereka hidup di negeri yang telah Kauberikan kepada nenek moyang kami.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghormati-Mu” atau “gentar di hadapan-Mu.” Kata Ibrani yang diterjemahkan “takut” mencakup rasa hormat yang dinyatakan melalui ketaatan.
    reason: lexical_alternative
  - marker: b
    text: Atau “selama mereka hidup di negeri yang telah Kauberikan kepada nenek moyang kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya purposif klausa.
- source_word: יִירָאוּךָ
  choice: mereka takut kepada-Mu
  rationale: Mempertahankan keluasan makna ירא, yaitu takut yang mencakup rasa hormat dan ketaatan kepada Allah, tanpa mempersempitnya menjadi sekadar gentar.
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: dan hidup menurut jalan-jalan-Mu
  rationale: Secara harfiah berarti berjalan di jalan-jalan-Mu; dalam bahasa Indonesia, hidup menurut menyampaikan idiom Ibrani tentang perilaku dengan jelas, sedangkan penghubung dan mencerminkan kaitannya dengan takut kepada Allah.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: sepanjang hari mereka hidup
  rationale: Menyampaikan seluruh rentang hidup mereka secara alami tanpa menghilangkan ungkapan konkret tentang hari-hari.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: di negeri
  rationale: Dalam konteks pemberian kepada para leluhur, הָאֲדָמָה menunjuk pada negeri perjanjian; unsur idiomatis על פני tidak perlu diterjemahkan secara kaku sebagai di atas permukaan.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: yang telah Kauberikan kepada nenek moyang kami
  rationale: Menyatakan pemberian ilahi yang telah terlaksana dan mempertahankan acuan perjanjian kepada leluhur Israel.
theological_decisions:
- issue: Makna takut dalam hubungannya dengan ketaatan perjanjian
  choice: takut kepada-Mu
  alternative: menghormati-Mu; gentar di hadapan-Mu
  rationale: Takut mempertahankan bobot teologis ירא. Frasa berikutnya mengenai hidup menurut jalan Allah menunjukkan bahwa yang dimaksud mencakup rasa hormat yang terwujud dalam ketaatan, bukan hanya ketakutan.
- issue: Cakupan הָאֲדָמָה
  choice: negeri
  alternative: bumi; tanah
  rationale: Klausa yang menyebut pemberian kepada nenek moyang menunjukkan bahwa acuannya ialah negeri yang dijanjikan kepada Israel, bukan seluruh bumi atau tanah sebagai material.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai kapital penghormatan. Idiom berjalan diterjemahkan secara maknawi sebagai hidup menurut agar langsung dipahami pembaca umum, sementara catatan kaki mempertahankan informasi bentuk Ibraninya.
