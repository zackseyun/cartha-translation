  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: id
  text: maka dengarkanlah dari surga doa dan permohonan mereka, dan belalah perkara mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lakukanlah keadilan/keputusan hukum mereka”; dapat juga diterjemahkan “tegakkanlah keadilan bagi mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: maka dengarkanlah
  rationale: Bentuk perfektum Qal orang kedua tunggal maskulin berfungsi sebagai permohonan kepada Allah dalam rangkaian bersyarat; “maka” menyatakan hubungan dengan konteks sebelumnya.
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Bentuk Ibrani yang secara tata bahasa jamak lazim dipakai secara idiomatis untuk tempat kediaman Allah; “surga” merupakan padanan Indonesia yang alami.
- source_word: תְּפִלָּתָם
  choice: doa mereka
  rationale: תְּפִלָּה adalah istilah umum untuk doa, dengan akhiran orang ketiga jamak.
- source_word: תְּחִנָּתָם
  choice: permohonan mereka
  rationale: תְּחִנָּה menunjuk pada permohonan sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan; “permohonan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: dan belalah perkara mereka
  rationale: Ungkapan harfiahnya ialah “lakukanlah keadilan/keputusan hukum mereka.” Dalam konteks ini, ungkapan tersebut meminta Allah bertindak secara yudisial demi umat-Nya; “belalah perkara mereka” mempertahankan nuansa hukum secara alami.
theological_decisions:
- issue: Tindakan ilahi sebagai jawaban atas doa dinyatakan dengan bahasa hukum
  choice: belalah perkara mereka
  alternative: tegakkanlah keadilan bagi mereka; laksanakanlah keputusan hukum mereka
  rationale: מִשְׁפָּט dapat berarti keputusan hukum, keadilan, hak, atau perkara. Terjemahan utama mempertahankan gambaran Allah yang bertindak demi umat-Nya tanpa mempersempit makna kepada satu mekanisme hukum tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif sopan “dengarkanlah” sesuai dengan bentuk permohonan dalam doa; “belalah perkara” mempertahankan dimensi yudisial tanpa terdengar terlalu teknis.
