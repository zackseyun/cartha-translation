  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: id
  text: Apabila umat-Mu maju berperang melawan musuh-musuh mereka di jalan yang Kauutus mereka tempuh, lalu mereka berdoa kepada-Mu dengan menghadap ke arah[a] kota ini yang telah Kaupilih dan rumah yang telah kubangun bagi nama-Mu,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai ungkapan "arah/jalan kota ini"; ungkapan itu menunjukkan orientasi doa menghadap Yerusalem.
    reason: lexical_alternative
  - marker: b
    text: '"Rumah" di sini adalah Bait Allah yang dibangun Salomo bagi nama TUHAN.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam rangkaian doa ini, כִּי memperkenalkan keadaan yang mungkin terjadi. “Apabila” mempertahankan sifat bersyarat sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: יֵצֵא ... לַמִּלְחָמָה
  choice: maju berperang
  rationale: Ungkapan ini secara harfiah berarti “keluar untuk berperang”. “Maju berperang” menyampaikan idiom militer tersebut secara alami tanpa menambah gagasan yang tidak ada dalam teks.
- source_word: עַמְּךָ ... עַל אֹיְבָיו
  choice: umat-Mu ... melawan musuh-musuh mereka
  rationale: עם adalah sebutan kolektif bagi umat. Sufiks tunggal pada “musuh-musuhnya” mengikuti nomina kolektif itu; bentuk jamak “mereka” lebih alami dalam bahasa Indonesia.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: melalui jalan yang Kautentukan ketika mengutus mereka
  rationale: דֶּרֶךְ dapat menunjuk jalan, arah, atau jalur perjalanan, sedangkan שׁלח menyatakan bahwa Allah mengutus mereka. Susunan ini mempertahankan kedua unsur tersebut dengan bahasa Indonesia yang jelas.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: lalu mereka berdoa kepada-Mu
  rationale: Bentuk hitpael dari פלל dengan אֶל menyatakan doa yang ditujukan kepada Allah. “Lalu” menghubungkan tindakan ini secara alami dengan keadaan sebelumnya.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: dengan menghadap ke arah kota ... ini
  rationale: Dalam konteks doa, דֶּרֶךְ menyatakan orientasi atau arah menuju suatu tempat. “Dengan menghadap ke arah” membuat unsur spasialnya jelas dalam bahasa Indonesia.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: yang telah Kaupilih
  rationale: Bentuk perfektif menunjuk pada pemilihan kota yang sudah dilakukan dan tetap berlaku.
- source_word: וְהַבַּיִת אֲשֶׁר בָּנִיתִי
  choice: dan rumah yang telah kubangun
  rationale: “Rumah” mempertahankan istilah Ibrani בַּיִת dan gema teologisnya, sementara konteks menjelaskan bahwa yang dimaksud ialah Bait Allah.
- source_word: לִשְׁמֶךָ
  choice: bagi nama-Mu
  rationale: Terjemahan ini mempertahankan rumusan pentahbisan tempat ibadah bagi nama Allah tanpa menafsirkannya secara lebih sempit.
theological_decisions:
- issue: Arah doa menuju Yerusalem dan Bait Allah
  choice: Mempertahankan orientasi ruang yang konkret dengan ungkapan “menghadap ke arah kota ... dan rumah”.
  alternative: Menafsirkannya secara abstrak sebagai berdoa dengan mengingat atau merujuk kepada Yerusalem dan Bait Allah.
  rationale: Teks Ibrani menekankan arah doa dalam kerangka teologi bait pada doa Salomo. Terjemahan tidak menghapus latar historis-teologis ini dan juga tidak menarik kesimpulan doktrinal yang melampaui ayat.
- issue: Makna “rumah”
  choice: Memakai “rumah” dalam teks utama dan menjelaskan acuannya dalam catatan kaki.
  alternative: Menerjemahkan langsung sebagai “Bait Allah”.
  rationale: “Rumah” lebih dekat dengan בַּיִת dan mempertahankan metafora sumber, sedangkan catatan kaki mencegah ketidakjelasan bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Kau-” dan “-Mu” dipakai secara konsisten untuk sapaan kepada Allah. Kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat bersyarat yang dilanjutkan oleh permohonan pada ayat berikutnya.
