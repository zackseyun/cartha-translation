id: 2CH.6.10
reference: 2 Chronicles 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: id
  text: Yahweh telah menggenapi firman yang diucapkan-Nya itu[a]. Aku telah bangkit menggantikan Daud, ayahku, dan kini duduk di atas takhta Israel, seperti yang difirmankan Yahweh. Aku juga telah membangun rumah bagi nama Yahweh[b], Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah meneguhkan firman-Nya” atau “telah melaksanakan firman-Nya.” Kata kerja Ibrani ini secara harfiah berarti “membuat firman-Nya berdiri.”
    reason: lexical_alternative
  - marker: b
    text: “Rumah” di sini merujuk pada bait. Teks Ibrani mempertahankan ungkapan perjanjian “rumah bagi nama Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: telah menggenapi
  rationale: Bentuk Hifil dari קום secara harfiah menyatakan bahwa Yahweh membuat firman-Nya berdiri atau terlaksana. Dalam konteks janji, 'menggenapi' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankan nama diri yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: firman yang diucapkan-Nya itu
  rationale: '''Firman'' mempertahankan hubungan leksikal dengan akar דבר, sedangkan ''yang diucapkan-Nya itu'' menyampaikan klausa relatif secara alami dan merujuk pada firman yang telah disebut sebelumnya.'
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: Aku telah bangkit menggantikan Daud, ayahku
  rationale: '''Bangkit'' mempertahankan gema akar קום dari klausa pertama, dan ''menggantikan'' menyampaikan makna suksesi kerajaan dari תַּחַת tanpa menyiratkan permusuhan.'
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: dan kini duduk di atas takhta Israel
  rationale: Kata 'kini' memperjelas keadaan kini sebagai hasil naik takhta, sementara 'duduk di atas takhta Israel' mempertahankan ungkapan kerajaan dalam bahasa sumber.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: Aku juga telah membangun rumah
  rationale: '''Rumah'' mempertahankan istilah הַבַּיִת dan ungkapan kanonis tentang rumah bagi nama Yahweh; catatan kaki menjelaskan bahwa yang dimaksud ialah bait.'
- source_word: לְשֵׁם יְהוָה
  choice: bagi nama Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan teologis penting bahwa rumah tersebut dibangun bagi nama Yahweh, bukan sebagai tempat yang membatasi keberadaan-Nya.
theological_decisions:
- issue: Penyebutan bangunan ibadah sebagai הַבַּיִת
  choice: rumah
  alternative: bait
  rationale: '''Rumah'' secara langsung mempertahankan metafora Ibrani dan ungkapan ''rumah bagi nama Yahweh''; catatan kaki memberikan rujukan yang jelas kepada bait.'
- issue: Ungkapan לְשֵׁם יְהוָה
  choice: bagi nama Yahweh
  alternative: untuk menghormati Yahweh
  rationale: Terjemahan formal ini mempertahankan teologi 'nama' dalam teks dan tidak mereduksinya menjadi sekadar tujuan penghormatan.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Pemakaian nama diri menjaga bentuk dan fungsi nama perjanjian dalam sumber Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi agar mudah dibaca, sementara pengulangan 'Yahweh', gema kata 'bangkit/membuat berdiri', ungkapan kerajaan, serta teologi 'rumah bagi nama Yahweh' tetap dipertahankan.
