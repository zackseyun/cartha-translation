reference: 2 Chronicles 6:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: id
  text: Sejak hari ketika Aku membawa umat-Ku keluar dari tanah Mesir,[a] Aku tidak pernah memilih sebuah kota dari antara suku-suku Israel untuk membangun sebuah rumah supaya nama-Ku berada di sana.[b] Aku juga tidak pernah memilih seorang laki-laki untuk menjadi penguasa atas umat-Ku Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Mulai dari hari ketika Aku membawa umat-Ku keluar dari tanah Mesir, Aku tidak memilih ….” Bentuk verba Ibrani dapat diterjemahkan dengan bentuk lampau sederhana, tetapi “sejak” dan “tidak pernah” menyampaikan bahwa pernyataan itu berlaku dari saat tersebut hingga waktu yang sedang dibicarakan.
    reason: lexical_alternative
  - marker: b
    text: “Rumah” di sini mengacu pada bait Allah. Bahasa Ibrani memakai kata “rumah”, bukan istilah yang lebih interpretatif, “bait”.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani ini dapat juga diterjemahkan “pemimpin” atau “pangeran”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: Sejak hari
  rationale: Ungkapan ini menandai titik awal waktu bagi kedua tindakan yang dinegasikan. “Sejak hari” alami dalam bahasa Indonesia dan mempertahankan daya berkelanjutan dari titik masa lampau itu.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: Aku membawa umat-Ku keluar dari tanah Mesir
  rationale: Bentuk kausatif verba יצא berarti “membawa keluar” dan mengacu pada peristiwa keluaran. Sebutan perjanjian “umat-Ku” serta ungkapan geografis “tanah Mesir” dipertahankan.
- source_word: לֹא בָחַרְתִּי
  choice: Aku tidak pernah memilih
  rationale: Dalam kerangka waktu yang dimulai dengan “sejak hari”, “tidak pernah memilih” menyatakan bahwa tindakan itu tidak terjadi sepanjang rentang waktu tersebut, tanpa memberi kesan bahwa pemilihan hanya belum terjadi.
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: kota mana pun dari antara semua suku Israel
  rationale: Dengan בחר, preposisi ב menandai objek yang dipilih. Dalam kalimat negatif, “mana pun” menyampaikan cakupan distributifnya dengan jelas.
- source_word: לִבְנוֹת בַּיִת
  choice: untuk membangun sebuah rumah
  rationale: בַּיִת secara harfiah berarti “rumah”. Walaupun yang dimaksud adalah bait Allah, mempertahankan “rumah” menjaga istilah dan resonansi teologis teks sumber.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: supaya nama-Ku berada di sana
  rationale: Terjemahan ini mempertahankan verba “berada/ada” dan bahasa mengenai nama ilahi, tanpa menambahkan gagasan “diam” yang tidak dinyatakan oleh verba Ibrani ini.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: Aku juga tidak pernah memilih seorang laki-laki
  rationale: אִישׁ berbentuk maskulin tunggal dan dalam konteks ini menunjuk kepada seorang penguasa laki-laki. “Juga” menghubungkan penyangkalan kedua dengan yang pertama secara alami.
- source_word: נָגִיד
  choice: penguasa
  rationale: נָגִיד menunjuk kepada orang yang ditempatkan dalam kedudukan berwenang. “Penguasa” menyatakan otoritas itu dengan jelas dalam bahasa Indonesia modern.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: atas umat-Ku Israel
  rationale: Pilihan ini mempertahankan relasi kewenangan yang dinyatakan oleh עַל dan sebutan perjanjian “umat-Ku Israel”.
theological_decisions:
- issue: Istilah bagi tempat ibadah dan bahasa tentang kehadiran ilahi
  choice: “sebuah rumah supaya nama-Ku berada di sana”
  alternative: “sebuah bait supaya hadirat-Ku berdiam di sana”
  rationale: Teks memakai kata biasa “rumah” dan berbicara tentang nama Allah “berada” di sana. Pilihan ini mempertahankan kategori teologis teks tanpa menyamakan nama Allah secara eksplisit dengan hadirat-Nya atau menambahkan verba “berdiam”.
- issue: Jenis kelamin pada אִישׁ
  choice: “seorang laki-laki”
  alternative: “seseorang”
  rationale: Bentuk Ibrani adalah maskulin tunggal dan konteks historisnya mengacu kepada seorang penguasa laki-laki; karena itu bentuk maskulin dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel kedua penyangkalan dipertahankan, sedangkan susunan kata disesuaikan agar alami bagi pembaca Indonesia. Kapitalisasi pada pronomina ilahi mengikuti gaya penerjemahan Alkitab bahasa Indonesia yang lazim.
