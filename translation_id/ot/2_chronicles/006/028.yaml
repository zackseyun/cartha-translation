  naturalness: Bahasanya modern, jelas, dan bernada khidmat. Pengulangan “jika terjadi” dan tanda pisah penutup secara baik mencerminkan struktur ayat yang berlanjut. “Musuh-musuhnya” sedikit lebih eksplisit daripada “musuhnya” untuk mencerminkan bentuk jamak Ibrani, tanpa mengubah acuan tunggal-kolektif pada objek dan kepemilikan.
  terminology: Istilah bencana dan pertanian sesuai register Indonesia modern. “Tulah” untuk נֶגַע dan “penyakit” untuk מַחֲלָה mempertahankan pembedaan umum antara malapetaka/serangan dan penyakit. Catatan kaki b dengan tepat menjelaskan metonimia “gerbang-gerbang” bagi kota-kota berbenteng.
