source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: id
  text: Jika terjadi kelaparan di negeri, jika terjadi wabah, hawar, penyakit kuning tanaman, belalang, atau serangga pelahap[a]; jika musuh-musuhnya mengepungnya di kota-kota negerinya[b]; tulah apa pun atau penyakit apa pun yang terjadi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani חָסִיל menunjuk pada serangga yang melahap tanaman; mungkin sejenis belalang perusak, tetapi spesies tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di negeri gerbang-gerbangnya.” Gerbang di sini mewakili kota-kota, terutama kota berbenteng.
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: kelaparan
  rationale: Dalam daftar bencana yang melanda negeri, kata ini menunjuk pada kelaparan luas, bukan rasa lapar biasa.
- source_word: דֶּבֶר
  choice: wabah
  rationale: Kata ini biasanya menunjuk pada penyakit menular yang merebak dan mematikan; 'wabah' adalah padanan Indonesia modern yang jelas.
- source_word: שִׁדָּפוֹן
  choice: hawar
  rationale: Istilah ini menunjuk pada kerusakan tanaman, mungkin akibat angin panas atau penyakit; 'hawar' ringkas dan sesuai dengan konteks pertanian.
- source_word: יֵרָקוֹן
  choice: penyakit kuning tanaman
  rationale: Kata ini menggambarkan tanaman yang menguning atau memucat. Padanan deskriptif ini lebih jelas daripada menyamakan secara pasti dengan embun tepung atau jenis penyakit tertentu.
- source_word: אַרְבֶּה
  choice: belalang
  rationale: Dalam konteks bencana pertanian, kata ini menunjuk pada belalang perusak yang datang berkelompok.
- source_word: חָסִיל
  choice: serangga pelahap
  rationale: Istilah ini menunjuk pada serangga pemakan tanaman, tetapi spesies tepatnya tidak pasti. Padanan umum mempertahankan ketidakpastian tersebut.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: jika musuhnya mengepungnya
  rationale: Bentuk verba ini menyatakan tindakan mendesak, mengimpit, atau mengepung; konteks kota-kota mendukung arti militer 'mengepung'.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: di kota-kota negerinya
  rationale: '''Gerbang-gerbang'' berfungsi sebagai metonimia bagi kota-kota berbenteng. Terjemahan utama menyampaikan maksud itu secara alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.'
- source_word: כָּל נֶגַע וְכָל מַחֲלָה
  choice: tulah apa pun atau penyakit apa pun
  rationale: '''Tulah'' mempertahankan bobot נֶגַע sebagai pukulan atau malapetaka berat, sedangkan ''penyakit'' menyampaikan מַחֲלָה secara luas. Pengulangan ''apa pun'' mencerminkan כָּל pada kedua unsur.'
theological_decisions:
- issue: Acuan pronomina tunggal pada לוֹ dan sufiks-sufiks berikutnya
  choice: Mempertahankan bentuk orang ketiga tunggal dengan '-nya'
  alternative: Menjelaskan acuannya sebagai 'umat-Mu' atau menggantinya dengan bentuk jamak 'mereka'
  rationale: Teks Ibrani memakai bentuk tunggal yang kemungkinan bersifat kolektif. Mempertahankan '-nya' menghindari penetapan eksplisit atas acuan yang tidak disebutkan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Struktur berulang 'jika terjadi' mempertahankan pola daftar dalam bahasa Ibrani. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
