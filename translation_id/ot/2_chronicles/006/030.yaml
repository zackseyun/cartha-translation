  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: id
  text: maka dengarkanlah dari surga, tempat kediaman-Mu, ampunilah, dan balaslah setiap orang sesuai dengan segala jalan hidupnya, yang hatinya Engkau kenal—sebab hanya Engkaulah yang mengenal hati semua manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak manusia,” suatu ungkapan Ibrani yang berarti umat manusia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: dengarkanlah
  rationale: Dalam konteks doa Salomo, bentuk imperfek ini berfungsi sebagai permohonan; bentuk dengan -lah menyampaikan permohonan yang khidmat dan alami.
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Bentuk Ibrani secara morfologis jamak, tetapi 'surga' adalah padanan idiomatis dalam bahasa Indonesia untuk tempat kediaman Allah.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: tempat kediaman-Mu
  rationale: מָכוֹן menunjuk pada tempat yang tetap atau ditetapkan; frasa ini mempertahankan gagasan tempat kediaman surgawi Allah secara wajar.
- source_word: וְסָלַחְתָּ
  choice: Ampunilah
  rationale: Dalam rangkaian permohonan, bentuk perfek dengan waw meneruskan tindakan yang dimohonkan.
- source_word: וְנָתַתָּה
  choice: balaslah
  rationale: נתן secara dasar berarti 'memberikan', tetapi dalam konteks penghakiman, memberi kepada seseorang menurut jalan hidupnya bermakna membalas atau memperlakukan setimpal dengan perilakunya.
- source_word: לָאִישׁ
  choice: setiap orang
  rationale: Bentuk tunggal ini bersifat distributif. Dalam konteks umum mengenai manusia, 'setiap orang' menyampaikan cakupannya dengan tepat dan alami.
- source_word: כְּכָל דְּרָכָיו
  choice: sesuai dengan segala jalan hidupnya
  rationale: '''Jalan'' merupakan metafora Ibrani bagi perilaku atau cara hidup; ''jalan hidup'' mempertahankan metafora sekaligus memperjelas maknanya.'
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: sebab Engkau mengenal hatinya
  rationale: Relasi klausa dapat dipahami sebagai penjelasan dasar bagi pembalasan yang tepat. 'Sebab' menghasilkan bahasa Indonesia yang alami tanpa mengubah pokok bahwa Allah mengenal batin orang tersebut.
- source_word: לְבָב
  choice: hati
  rationale: Istilah ini menunjuk pada batin, termasuk pikiran dan kehendak; 'hati' adalah padanan biblis yang alami dan luas.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: karena hanya Engkaulah yang mengenal
  rationale: Ungkapan ini menyatakan alasan sekaligus menekankan bahwa pengetahuan batin manusia hanya dimiliki Allah.
- source_word: בְּנֵי הָאָדָם
  choice: semua manusia
  rationale: Secara harfiah ungkapan ini adalah 'anak-anak manusia', tetapi secara idiomatis menunjuk kepada umat manusia secara menyeluruh. Catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Cakupan antropologis בְּנֵי הָאָדָם
  choice: semua manusia
  alternative: anak-anak manusia
  rationale: Ungkapan Ibrani merupakan sebutan representatif bagi manusia pada umumnya, bukan hanya laki-laki. Teks utama menyampaikan cakupan semantisnya, sedangkan catatan kaki menjaga bentuk ungkapan sumber.
- issue: Sifat tindakan וְנָתַתָּ ... כְּכָל דְּרָכָיו
  choice: balaslah setiap orang sesuai dengan segala jalan hidupnya
  alternative: berikanlah kepada setiap orang sesuai dengan segala jalan hidupnya
  rationale: Konteks doa mengenai penghakiman menunjukkan pemberian yang setimpal dengan perilaku. 'Balaslah' mengungkapkan fungsi yudisial tanpa menentukan apakah balasan itu selalu hukuman atau juga dapat berupa ganjaran.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. Tanda pisah mempertahankan tekanan pada alasan bahwa hanya Allah mengenal hati manusia.
