  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/הֵעָצֵ֧ר הַ/שָּׁמַ֛יִם וְ/לֹֽא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: id
  text: Apabila langit tertutup dan hujan tidak turun karena mereka telah berdosa terhadap-Mu, lalu mereka berdoa menghadap tempat ini, mengakui nama-Mu, dan berbalik dari dosa mereka karena Engkau menjawab mereka,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena Engkau menindas mereka” atau “karena Engkau merendahkan mereka.” Berdasarkan konsonannya, kata Ibrani ini dapat dikaitkan dengan makna tersebut, meskipun vokalisasi Masoret mendukung arti “menjawab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: Apabila langit tertutup
  rationale: Infinitif Nifal dengan בְּ membentuk anak kalimat waktu. Dalam bahasa Indonesia, “langit tertutup” mempertahankan gambaran konkret Ibrani dan secara alami menyiratkan tertahannya hujan.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: dan hujan tidak turun
  rationale: Ungkapan ini menyampaikan tidak adanya hujan secara alami dalam bahasa Indonesia, tanpa mengubah hubungan maknanya dengan langit yang tertutup.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: karena mereka telah berdosa terhadap-Mu
  rationale: כִּי bersifat kausal, sedangkan לָךְ menyatakan bahwa dosa itu dilakukan terhadap Allah. Bentuk “telah berdosa” menunjukkan keadaan yang mendahului kekeringan dan doa.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: lalu mereka berdoa menghadap tempat ini
  rationale: אֶל di sini menunjukkan arah doa, bukan bahwa tempat itu menjadi pihak yang disapa. “Menghadap tempat ini” jelas dan wajar dalam bahasa Indonesia.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: mengakui nama-Mu
  rationale: Hifil dari ידה dapat menyatakan pengakuan, pujian, atau ucapan syukur. Dalam rangkaian doa dan pertobatan ini, “mengakui nama-Mu” mempertahankan unsur pengakuan serta objek langsung “nama-Mu” tanpa mempersempitnya menjadi ucapan terima kasih saja.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: berbalik dari dosa mereka
  rationale: שׁוב dengan מִן menggambarkan tindakan berpaling dari dosa. Terjemahan ini mempertahankan metafora gerak dalam teks dan tidak menggantinya dengan istilah teologis yang lebih interpretatif.
- source_word: כִּי תַעֲנֵם
  choice: karena Engkau menjawab mereka
  rationale: Menurut vokalisasi Masoret, bentuk ini paling langsung dibaca dari ענה dalam arti “menjawab.” כִּי dipertahankan sebagai hubungan sebab. Kemungkinan pembacaan “menindas/merendahkan” yang bertumpu pada konsonan dan konteks disiplin ilahi dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna ענה pada anak kalimat terakhir
  choice: karena Engkau menjawab mereka
  alternative: karena Engkau menindas mereka; karena Engkau merendahkan mereka
  rationale: Vokalisasi WLC mendukung arti “menjawab,” selaras dengan penyebutan doa. Namun, tradisi penafsiran juga menghubungkan konsonan yang sama dengan tindakan Allah menindas atau merendahkan umat sehingga mereka berbalik dari dosa. Ketegangan ini tidak dihapus, tetapi alternatifnya disimpan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya.
