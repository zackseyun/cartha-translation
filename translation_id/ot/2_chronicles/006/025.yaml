source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: id
  text: maka dengarlah dari surga dan ampunilah dosa umat-Mu Israel. Bawalah mereka kembali ke tanah yang telah Kauberikan kepada mereka dan kepada nenek moyang mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bapak-bapak mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: dengarlah
  rationale: Dalam konteks doa, bentuk imperfek ini paling alami dipahami sebagai permohonan langsung kepada Allah. “Dengarlah” mempertahankan arti dasar mendengar dengan tanggapan yang tetap tersirat.
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Walaupun bentuk Ibraninya jamak, “surga” adalah ungkapan baku bahasa Indonesia untuk tempat kediaman Allah dalam konteks ini.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: dan ampunilah dosa
  rationale: סלח adalah verba baku bagi pengampunan ilahi, sedangkan bentuk tunggal חטאת dipertahankan sebagai “dosa” yang secara kolektif menunjuk pada pelanggaran Israel.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: “Umat-Mu” menyampaikan sebutan relasional-perjanjian dan diikuti nama diri Israel dalam susunan Indonesia yang wajar.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: Bawalah mereka kembali
  rationale: Bentuk kausatif verba שוב berarti Allah menyebabkan mereka kembali; “bawalah mereka kembali” menyampaikan kausativitas itu secara alami.
- source_word: אֶל הָאֲדָמָה
  choice: ke tanah
  rationale: Dalam konteks pemberian perjanjian, אֲדָמָה menunjuk pada wilayah yang diberikan kepada Israel; “tanah” sesuai dengan ungkapan Indonesia “tanah yang diberikan” dan tetap membedakannya dari istilah אֶרֶץ bila diperlukan.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: yang telah Kauberikan kepada mereka dan kepada nenek moyang mereka
  rationale: Pengulangan “kepada” mempertahankan struktur dua sasaran pemberian. “Nenek moyang” adalah padanan Indonesia alami bagi אבות dalam arti generasi pendahulu, tanpa membatasi rujukan pada ayah kandung.
theological_decisions:
- issue: Nuansa bentuk תִּשְׁמַע dalam doa
  choice: dengarlah
  alternative: maka Engkau akan mendengar
  rationale: Rangkaian verba dalam doa Salomo dapat dibaca sebagai permohonan atau sebagai konsekuensi/futurum. Imperatif Indonesia paling alami dalam konteks permohonan ini, tetapi alternatif futurum tetap mungkin secara gramatikal.
- issue: Cakupan אֲבֹתֵיהֶם
  choice: nenek moyang mereka
  alternative: bapak-bapak mereka
  rationale: Kata Ibrani secara harfiah berbentuk maskulin “bapak-bapak mereka”, tetapi dalam konteks pewarisan tanah menunjuk pada generasi pendahulu atau leluhur. “Nenek moyang” menyampaikan cakupan tersebut secara alami tanpa menetapkan bahwa rujukannya hanya para patriark tertentu.
translation_notes:
  register: Bahasa doa dibuat lugas, khidmat, dan modern. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Ayat dibagi menjadi dua kalimat agar rangkaian permohonan mudah dipahami tanpa mengubah hubungan sintaksisnya.
