id: 2CH.6.18
reference: 2 Chronicles 6:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: id
  text: Namun, benarkah Allah akan tinggal bersama manusia[a] di bumi? Lihatlah, langit, bahkan langit yang tertinggi, tidak dapat menampung Engkau, apalagi rumah yang telah kubangun ini!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “manusia” berbentuk tunggal, tetapi dipakai secara kolektif untuk umat manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: benarkah
  rationale: Bentuk ini memperkenalkan pertanyaan retoris yang mengungkapkan ketakjuban. “Benarkah” alami dalam bahasa Indonesia dan tetap mempertahankan daya pertanyaannya.
- source_word: יֵשֵׁב
  choice: akan tinggal
  rationale: Dalam konteks kehadiran Allah dan rumah ibadah, verba ini menyatakan berdiam atau tinggal, bukan sekadar duduk.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini bermakna tunggal dan menunjuk kepada Allah Israel.
- source_word: אֶת הָאָדָם
  choice: bersama manusia
  rationale: אֶת di sini dipahami dalam fungsi kebersamaan, sedangkan אָדָם merujuk secara kolektif kepada umat manusia. “Manusia” mempertahankan bentuk tunggal kolektif secara alami dalam bahasa Indonesia.
- source_word: עַל הָאָרֶץ
  choice: di bumi
  rationale: Ungkapan lokatif ini paling alami diterjemahkan “di bumi” dalam bahasa Indonesia modern.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dari kata Ibrani dan cocok dengan nada luhur doa Salomo.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: langit, bahkan langit yang tertinggi
  rationale: Ungkapan harfiah “langit dan langit segala langit” merupakan bentuk superlatif. Terjemahan ini menyampaikan peningkatan maknanya dengan jelas dan wajar.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: tidak dapat menampung Engkau
  rationale: Verba ini menyatakan ketidakmampuan suatu ruang untuk memuat atau menampung Allah.
- source_word: אַף כִּי
  choice: apalagi
  rationale: “Apalagi” secara ringkas dan alami menyampaikan argumen dari yang lebih besar kepada yang lebih kecil.
- source_word: הַבַּיִת הַזֶּה
  choice: rumah ... ini
  rationale: “Rumah” mempertahankan metafora rumah bagi bait suci tanpa menggantinya dengan istilah yang lebih khusus.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: yang telah kubangun
  rationale: Bentuk ini menyatakan tindakan pembangunan yang sudah selesai dan tetap relevan pada saat doa diucapkan.
theological_decisions:
- issue: Makna kolektif אָדָם dalam hubungan antara Allah dan manusia
  choice: manusia
  alternative: umat manusia
  rationale: Ayat ini mempertentangkan Allah dengan manusia secara kolektif, bukan dengan seorang laki-laki tertentu. “Manusia” mempertahankan bentuk representatif sumber sekaligus mencakup seluruh umat manusia.
- issue: Ketidakmampuan ciptaan menampung Allah
  choice: tidak dapat menampung Engkau
  alternative: tidak dapat memuat Engkau
  rationale: Terjemahan ini mempertahankan penegasan transendensi Allah tanpa menyimpulkan bahwa kehadiran-Nya di rumah yang dibangun Salomo mustahil dalam setiap pengertian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pertanyaan retoris dipertahankan, pronomina ilahi “Engkau” ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia, dan susunan klausa dibuat alami tanpa menghilangkan peningkatan dari langit kepada rumah yang dibangun Salomo.
