reference: 2 Chronicles 6:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: id
  text: Namun, engkau tidak akan membangun rumah itu[a]; sebaliknya, anakmu yang berasal dari tubuhmu sendiri[b], dialah yang akan membangun rumah itu bagi nama-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Allah itu”; bahasa Ibrani memakai “rumah itu”, sebutan yang lazim untuk Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang keluar dari pinggangmu”, sebuah ungkapan untuk keturunan jasmani langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Kata ini membatasi dan mengontraskan pernyataan sebelumnya; “Namun” menyampaikan daya adversatifnya secara alami dalam bahasa Indonesia.
- source_word: תִבְנֶה הַבָּיִת
  choice: akan membangun rumah itu
  rationale: Bentuk definit dalam bahasa Ibrani menunjuk kepada rumah yang sudah diketahui dari konteks, yakni Bait Allah. “Rumah itu” mempertahankan ungkapan sumber tanpa mempersempitnya di dalam teks utama.
- source_word: כִּי
  choice: melainkan
  rationale: 'Sesudah pernyataan negatif, kata ini memperkenalkan subjek yang berlawanan: bukan Daud, melainkan anaknya.'
- source_word: בִנְךָ
  choice: anakmu
  rationale: Padanan langsung dan alami bagi nomina dengan akhiran orang kedua maskulin tunggal; konteks menunjukkan seorang anak laki-laki.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: yang berasal dari darah dagingmu sendiri
  rationale: Ungkapan sumber secara harfiah menyebut seseorang yang keluar dari pinggang Daud dan berarti keturunan biologis langsung. Idiom “darah dagingmu sendiri” menyampaikan hubungan jasmani itu secara alami dan bermartabat.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini bersifat menegaskan. “Dialah” mempertahankan penekanan bahwa anak itu, bukan Daud, yang akan membangun rumah tersebut.
- source_word: יִבְנֶה הַבַּיִת
  choice: yang akan membangun rumah itu
  rationale: Bentuk verba menyatakan tindakan pada masa mendatang; pengulangan “rumah itu” mempertahankan konsistensi leksikal ayat.
- source_word: לִשְׁמִי
  choice: bagi nama-Ku
  rationale: Padanan ini mempertahankan ungkapan teologis Ibrani mengenai rumah yang dibangun untuk nama Allah, tanpa menjabarkan maknanya secara berlebihan.
theological_decisions:
- issue: Istilah untuk Bait Allah
  choice: rumah itu
  alternative: Bait Allah itu
  rationale: Teks Ibrani berbunyi “rumah itu,” sebutan lazim bagi Bait Allah. Mempertahankan “rumah” menjaga citra dan kesinambungan antarteks, sementara catatan kaki menjelaskan acuannya.
- issue: Ungkapan garis keturunan
  choice: dari darah dagingmu sendiri
  alternative: keluar dari pinggangmu
  rationale: Ungkapan ini menyatakan keturunan jasmani langsung. Padanan yang dipilih menjaga maknanya dalam bahasa Indonesia modern tanpa menambahkan klaim teologis lain.
- issue: Penegasan subjek pembangun
  choice: Dialah
  alternative: dia
  rationale: Pronomina Ibrani הוּא memberi penekanan kontras. Bentuk “Dialah” mempertahankan penegasan bahwa anak Daudlah yang akan membangun rumah itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Struktur kontras “bukan ... melainkan ...” dan bentuk “Dialah” menjaga penekanan teks Ibrani. Kapitalisasi “nama-Ku” mengikuti konvensi penerjemahan Alkitab bahasa Indonesia untuk rujukan ilahi.
