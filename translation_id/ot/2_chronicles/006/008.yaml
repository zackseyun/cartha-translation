base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: id
  text: 'Namun, Yahweh berfirman kepada Daud, ayahku: “Karena dalam hatimu ada niat untuk membangun rumah bagi nama-Ku[a], engkau telah berbuat baik karena niat itu ada dalam hatimu.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bait bagi nama-Ku.” Bahasa Ibrani secara harfiah berbunyi “rumah bagi nama-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau telah berbuat baik dengan memiliki niat itu dalam hatimu.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Bentuk naratif dari אמר berarti ‘berkata’; dalam bahasa Indonesia, ‘berfirman’ merupakan ungkapan alami dan bermartabat ketika Allah menjadi subjek.
- source_word: אָבִי
  choice: ayahku
  rationale: Menerjemahkan secara langsung hubungan Daud dengan Salomo sebagai penutur.
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Pasangan partikel ini memperkenalkan alasan dan secara alami diterjemahkan ‘karena’.
- source_word: הָיָה עִם לְבָבְךָ
  choice: dalam hatimu ada niat
  rationale: Ungkapan Ibrani menunjuk pada maksud batin. Pilihan ini mempertahankan metafora ‘hati’ sekaligus menjelaskan acuannya secara wajar dalam bahasa Indonesia.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: untuk membangun rumah bagi nama-Ku
  rationale: ‘Rumah’ menerjemahkan בַּיִת secara transparan, sedangkan ‘bagi nama-Ku’ mempertahankan ungkapan teologis khas teks tanpa menyiratkan bahwa Allah dapat dibatasi oleh bangunan.
- source_word: הֱטִיבוֹתָ
  choice: engkau telah berbuat baik
  rationale: Bentuk hifil dari יטב di sini menyatakan persetujuan terhadap niat Daud; frasa ini langsung dan alami.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: karena niat itu ada dalam hatimu
  rationale: Mempertahankan pengulangan ungkapan tentang hati dan membaca כִּי dalam arti kausal, sambil membuat acuan implisitnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna בַּיִת לִשְׁמִי dalam konteks pembangunan Bait Allah
  choice: rumah bagi nama-Ku
  alternative: bait bagi nama-Ku
  rationale: Teks Ibrani secara harfiah memakai ‘rumah’. Mempertahankannya menjaga hubungan dengan teologi ‘nama’ Allah dan tidak mempersempit ungkapan menjadi istilah teknis semata.
- issue: Hubungan sintaksis כִּי pada klausa penutup
  choice: karena niat itu ada dalam hatimu
  alternative: bahwa niat itu ada dalam hatimu
  rationale: כִּי dapat dipahami sebagai penanda sebab atau isi. Terjemahan utama memakai makna kausal yang wajar, sedangkan kemungkinan bahwa klausa itu melengkapi pernyataan persetujuan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan tentang niat dalam hati dipertahankan karena menonjol dalam teks Ibrani, meskipun hasilnya sedikit repetitif. Nama ilahi ditulis ‘Yahweh’, dan pronomina yang merujuk kepada Allah memakai huruf kapital sesuai kebiasaan ejaan religius Indonesia.
