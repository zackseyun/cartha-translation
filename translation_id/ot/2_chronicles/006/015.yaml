source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: id
  text: Engkau telah menepati bagi hamba-Mu Daud, ayahku, apa yang telah Engkau katakan kepadanya[a]. Dengan mulut-Mu Engkau telah berfirman, dan dengan tangan-Mu Engkau telah menggenapinya[b], seperti pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa yang telah Engkau janjikan kepadanya.” Secara harfiah, bahasa Ibrani berbunyi “apa yang telah Engkau katakan kepadanya”; makna janji tersirat dari konteks penggenapannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan mulut-Mu ... dan dengan tangan-Mu.” Ini adalah cara ungkap Ibrani yang memasangkan firman yang diucapkan Allah dengan tindakan-Nya yang mewujudkan firman itu.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: telah menepati
  rationale: Dalam konteks janji, verba ini menyatakan kesetiaan dalam memegang dan melaksanakan apa yang dikatakan. 'Menepati' wajar dalam bahasa Indonesia dan menghubungkannya dengan penggenapan tanpa harus menambahkan kata 'janji' ke dalam teks utama.
- source_word: לְעַבְדְּךָ
  choice: bagi hamba-Mu
  rationale: Preposisi ל dengan שׁמר di sini paling alami dipahami sebagai sesuatu yang dipelihara atau ditepati bagi seseorang. 'Hamba' sesuai dengan bahasa doa kerajaan.
- source_word: דָּוִיד אָבִי
  choice: Daud, ayahku
  rationale: Urutan dan aposisi Ibrani dipertahankan dalam bentuk Indonesia yang jelas dan alami.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: apa yang telah Engkau katakan kepadanya
  rationale: Terjemahan ini mempertahankan arti harfiah verba 'berkata/berbicara'; sifatnya sebagai janji tersirat dari konteks penepatan dan penggenapan.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Dengan mulut-Mu Engkau telah mengatakannya
  rationale: Ungkapan konkret tentang mulut dipertahankan agar paralel dengan 'tangan-Mu' dan menonjolkan hubungan antara firman dan tindakan Allah.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: dan dengan tangan-Mu Engkau telah menggenapinya
  rationale: מלא dalam ungkapan ini berarti membawa sesuatu sampai tuntas atau menggenapinya. Citra 'tangan' dipertahankan sebagai gambaran tindakan yang efektif.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang terjadi pada hari ini
  rationale: Ungkapan ini menunjuk pada bukti penggenapan yang nyata pada saat itu. Rumusan Indonesia ini jelas tanpa kehilangan acuan waktunya.
theological_decisions:
- issue: Bahasa antropomorfis bagi Allah ('mulut' dan 'tangan')
  choice: Mempertahankan kedua ungkapan secara konkret
  alternative: Menerjemahkan secara dinamis sebagai 'Engkau berfirman' dan 'Engkau melaksanakannya'
  rationale: Teks sengaja memasangkan perkataan Allah dengan tindakan-Nya. Mempertahankan 'mulut' dan 'tangan' melestarikan retorika teks tanpa menambahkan kesimpulan tentang keberadaan jasmani Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Struktur paralel 'dengan mulut-Mu ... dengan tangan-Mu' sengaja dipertahankan.
