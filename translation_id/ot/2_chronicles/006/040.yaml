  revision_rationale: Revisi ini menghapus pembatasan makna "dipanjatkan di tempat ini" dari teks utama dan menempatkan kemungkinan-kemungkinan penafsirannya dalam catatan kaki. Selain itu, ungkapan untuk telinga Allah diperbaiki agar lebih alami dalam bahasa Indonesia sambil tetap mencerminkan kesiapan untuk mendengar yang dinyatakan teks Ibrani.
