base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: id
  text: Sekarang, ya Allahku, kiranya mata-Mu terbuka dan telinga-Mu siap mendengarkan doa yang terkait dengan tempat ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “doa tempat ini.” Dapat juga dipahami sebagai “doa yang dipanjatkan di tempat ini” atau “doa dari tempat ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Penanda waktu sekaligus peralihan wacana ini mengantar permohonan penutup Salomo. “Sekarang” wajar dalam bahasa Indonesia dan tidak menambahkan kata penghubung yang tidak wajib.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Bentuk dengan akhiran orang pertama tunggal berfungsi sebagai sapaan langsung. Partikel “ya” menyatakan vokatif secara alami dan khidmat dalam bahasa Indonesia.
- source_word: יִהְיוּ נָא
  choice: kiranya ... terbuka ... memperhatikan
  rationale: Bentuk yusif jamak bersama partikel נָא menyatakan permohonan yang santun. “Kiranya” mempertahankan nada permohonan tanpa terdengar kaku.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: mata-Mu terbuka
  rationale: Ungkapan konkret ini menggambarkan perhatian dan kewaspadaan ilahi. Terjemahan mempertahankan citra asli tanpa menggantinya dengan tafsiran abstrak.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: dan telinga-Mu memperhatikan
  rationale: קַשֻּׁבוֹת menyatakan kesiapan atau kesungguhan untuk mendengar. “Telinga-Mu memperhatikan” mempertahankan gambaran pendengaran serta dapat dipahami secara alami dalam konteks doa.
- source_word: לִתְפִלַּת
  choice: doa
  rationale: Nomina tunggal dengan prefiks ל menunjuk kepada doa yang menjadi sasaran perhatian ilahi; hubungan itu sudah diungkapkan oleh verba “memperhatikan” dalam susunan bahasa Indonesia.
- source_word: הַמָּקוֹם הַזֶּה
  choice: yang dipanjatkan di tempat ini
  rationale: Secara harfiah frasa ini menghasilkan hubungan genitif, “doa tempat ini,” yang tidak alami dan tidak jelas dalam bahasa Indonesia. Dalam konteks bait, “yang dipanjatkan di tempat ini” menyampaikan hubungan yang paling mungkin, sementara kemungkinan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa antropomorfis mengenai mata dan telinga Allah
  choice: Mempertahankan gambaran konkret “mata-Mu terbuka” dan “telinga-Mu memperhatikan”
  alternative: Parafrasa interpretatif seperti “jagalah dan dengarkanlah”
  rationale: Teks Ibrani memakai gambaran anggota tubuh untuk perhatian Allah terhadap doa. Mempertahankan metafora menjaga corak sastra dan ketegangan teologis teks tanpa mengharuskan pemahaman jasmaniah yang harfiah.
- issue: Hubungan doa dengan tempat bait
  choice: “doa yang dipanjatkan di tempat ini” dalam teks utama, dengan bentuk harfiah dan alternatif dalam catatan kaki
  alternative: “doa tempat ini” atau “doa dari tempat ini”
  rationale: Konstruksi Ibrani ringkas dan dapat dipahami sebagai doa yang dikaitkan dengan tempat ini, termasuk doa yang dipanjatkan di dalamnya atau berasal darinya. Teks utama dibuat alami, sedangkan ambiguitas yang nyata dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Huruf kapital pada akhiran pronominal “-Mu” mengikuti kebiasaan penulisan religius bahasa Indonesia. Susunan kalimat mempertahankan nada permohonan Salomo serta citra mata dan telinga dalam teks Ibrani.
