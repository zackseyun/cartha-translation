  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: id
  text: dan mereka berbalik kepada-Mu dengan segenap hati dan segenap jiwa di negeri tempat mereka ditawan, lalu berdoa menghadap ke negeri mereka yang telah Kauberikan kepada nenek moyang mereka, ke kota yang telah Kaupilih, dan ke rumah yang telah kubangun bagi nama-Mu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: dan mereka berbalik kepada-Mu
  rationale: שׁוּב dengan אֶל berarti kembali atau berbalik kepada seseorang. Dalam konteks perjanjian, ungkapan ini menyiratkan pertobatan, tetapi “berbalik kepada-Mu” mempertahankan gambaran dasar Ibrani tanpa mempersempitnya menjadi istilah teologis yang lebih eksplisit.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: dengan segenap hati dan segenap jiwa
  rationale: Ungkapan berpasangan ini menyatakan penyerahan diri yang utuh. “Segenap hati dan segenap jiwa” alami, bermartabat, dan mempertahankan idiom perjanjian.
- source_word: בְּאֶרֶץ שִׁבְיָם אֲשֶׁר שָׁבוּ אֹתָם
  choice: di negeri tempat mereka ditawan
  rationale: Terjemahan ini menyampaikan lokasi pembuangan sekaligus tindakan musuh yang menawan mereka, dengan bentuk Indonesia yang ringkas dan alami.
- source_word: וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם
  choice: lalu berdoa menghadap ke negeri mereka
  rationale: דֶּרֶךְ dalam konteks arah doa berarti menuju atau menghadap ke arah. “Menghadap ke” paling jelas dan idiomatis dalam bahasa Indonesia.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: yang telah Kauberikan kepada nenek moyang mereka
  rationale: אָבוֹת di sini menunjuk kepada para leluhur penerima janji. “Nenek moyang” lebih alami daripada “bapa-bapa” dalam bahasa Indonesia modern dan tetap mempertahankan hubungan historis-perjanjian.
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: ke kota yang telah Kaupilih
  rationale: Bentuk perfektif menyatakan pilihan Allah yang telah dibuat dan tetap bermakna. Unsur arah dari דֶּרֶךְ diteruskan secara wajar kepada kota dan rumah.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: dan ke rumah yang telah kubangun bagi nama-Mu
  rationale: “Rumah” mempertahankan בַּיִת dan resonansi teologisnya, tanpa menggantinya dengan “Bait Allah”. “Bagi nama-Mu” mempertahankan idiom dedikasi Ibrani.
theological_decisions:
- issue: Makna pertobatan dalam וְשָׁבוּ אֵלֶיךָ
  choice: berbalik kepada-Mu
  alternative: kembali kepada-Mu; bertobat di hadapan-Mu
  rationale: “Berbalik” mempertahankan arti konkret שׁוּב sekaligus memungkinkan nuansa pertobatan perjanjian terdengar dari konteks. Terjemahan “bertobat” akan menjelaskan implikasinya secara lebih sempit daripada bentuk Ibrani.
- issue: Makna “rumah” dan “nama”
  choice: rumah ... bagi nama-Mu
  alternative: Bait Allah ... untuk menghormati nama-Mu
  rationale: Bentuk yang lebih dekat dengan Ibrani mempertahankan teologi nama ilahi dan tidak menyamakan secara berlebihan rumah itu dengan tempat yang membatasi kehadiran Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang khidmat. Bentuk pronominal ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Ayat dipertahankan sebagai kelanjutan kalimat bersyarat dari konteks sebelumnya dan diakhiri koma.
