translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina ‘Aku’ dan ‘kalian’ mempertahankan tuturan langsung sekaligus membedakan pembicara tunggal dari kelompok yang disapa. Elipsis pada klausa terakhir dilengkapi dengan ‘aku akan menghajar kalian’ agar alami dalam bahasa Indonesia.
