base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: id
  text: Ia berbicara kepada mereka sesuai dengan nasihat orang-orang muda itu, katanya, “Aku akan memperberat kuk kalian dan menambah bebannya. Ayahku menghukum kalian dengan cambuk, tetapi aku akan menghukum kalian dengan kalajengking[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “dengan cambuk kalajengking,” yaitu cambuk yang diberi ujung tajam atau kait. Teks Ibrani secara harfiah berbunyi “dengan kalajengking.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ia berbicara
  rationale: דבר adalah verba umum untuk ‘berbicara’. Dalam konteks ini ucapan tersebut merupakan jawaban Rehabeam, tetapi ‘berbicara’ tetap paling dekat dengan bentuk Ibrani tanpa mempersempitnya menjadi ‘menjawab’.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: sesuai dengan nasihat orang-orang muda itu
  rationale: עֵצָה berarti ‘nasihat/pertimbangan’, sedangkan הַיְלָדִים dalam konteks narasi menunjuk kepada para penasihat yang lebih muda, bukan anak-anak secara harfiah.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: Aku akan memperberat kuk kalian
  rationale: Bentuk kausatif כבד berarti membuat berat atau memperberat. ‘Kuk’ mempertahankan metafora Ibrani bagi beban penindasan atau kerja paksa.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: dan menambah bebannya
  rationale: יסף dengan עַל menyatakan penambahan. Ungkapan ‘menambah bebannya’ mengacu secara alami kepada kuk tadi dan menyampaikan peningkatan beban tanpa menghilangkan citra kuk.
- source_word: יִסַּר
  choice: menghajar
  rationale: יסר dapat berarti mendisiplinkan, menghukum, atau menghajar. Karena alatnya adalah cambuk dan konteksnya berupa ancaman raja, ‘menghajar’ menyampaikan tindakan fisik yang bersifat menghukum dengan jelas dalam bahasa Indonesia modern.
- source_word: בַּשּׁוֹטִים
  choice: dengan cambuk
  rationale: שׁוֹט berarti cambuk atau alat pencambuk; ‘cambuk’ adalah padanan Indonesia yang jelas dan lazim.
- source_word: בָּעֲקְרַבִּים
  choice: dengan kalajengking
  rationale: Secara harfiah עַקְרַבִּים berarti ‘kalajengking’. Istilah harfiah dipertahankan dalam teks utama agar citranya tetap kuat, sementara kemungkinan bahwa istilah itu menunjuk kepada cambuk berduri dijelaskan dalam catatan kaki.
