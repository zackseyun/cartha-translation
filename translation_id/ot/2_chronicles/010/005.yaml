  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Datanglah kembali kepadaku tiga hari lagi.”[a] Lalu rakyat itu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani secara harfiah: “Masih tiga hari, dan kembalilah kepadaku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Lalu ia berkata kepada mereka
  rationale: Bentuk naratif wayyiqtol diterjemahkan secara alami dengan “Lalu”, sedangkan אֶל dengan sufiks jamak dinyatakan sebagai “kepada mereka”.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: Tunggulah tiga hari lagi
  rationale: Secara harfiah ungkapan ini berarti “tiga hari lagi/masih tiga hari”. Penambahan “Tunggulah” membuat maksud penundaan tersampaikan secara wajar dalam bahasa Indonesia tanpa mengubah jangka waktunya.
- source_word: וְשׁוּבוּ אֵלָי
  choice: kemudian kembalilah kepadaku
  rationale: Imperatif jamak שׁוּבוּ diterjemahkan “kembalilah”; אֵלָי secara langsung berarti “kepadaku”. “Kemudian” memperjelas urutan yang tersirat dalam rangkaian perintah.
- source_word: וַיֵּלֶךְ הָעָם
  choice: Maka pergilah rakyat itu
  rationale: הָעָם menunjuk kepada rakyat sebagai kelompok kolektif. Susunan “pergilah rakyat itu” mempertahankan gaya naratif yang ringkas dan bermartabat, sementara “Maka” menyatakan kelanjutan sebagai tanggapan terhadap perintah.
