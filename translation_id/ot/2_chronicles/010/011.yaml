base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: id
  text: Sekarang, ayahku membuat kuk kalian berat, tetapi aku akan menambah beban pada kuk kalian. Ayahku mendisiplinkan kalian dengan cambuk, tetapi aku dengan kalajengking.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dengan cambuk kalajengking,” yaitu cambuk yang dilengkapi ujung tajam atau kait; teks Ibrani secara harfiah berbunyi “dengan kalajengking.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס ... עֹל כָּבֵד
  choice: membuat kuk kalian berat
  rationale: Bentuk kausatif הֶעְמִיס menyatakan bahwa suatu beban dibuat harus ditanggung; bersama עֹל כָּבֵד, ungkapan ini mempertahankan citra kuk yang berat dan mengikuti susunan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: aku akan menambah beban pada kuk kalian
  rationale: Secara harfiah berarti 'aku akan menambah pada kuk kalian'. Penambahan kata 'beban' membuat maksudnya alami dan jelas dalam bahasa Indonesia tanpa menghilangkan metafora kuk.
- source_word: יִסַּר
  choice: mendisiplinkan
  rationale: Kata יסר mencakup tindakan mendidik atau mengoreksi melalui hukuman. 'Mendisiplinkan' mempertahankan nuansa itu dalam bahasa Indonesia modern.
- source_word: בַּשּׁוֹטִים
  choice: dengan cambuk
  rationale: שׁוֹטִים menunjuk pada cambuk; 'cambuk' adalah padanan modern yang jelas dan langsung.
- source_word: בָּעֲקְרַבִּים
  choice: dengan kalajengking
  rationale: Teks Ibrani secara harfiah berbunyi 'dengan kalajengking'. Kemungkinan bahwa istilah ini menunjuk pada jenis cambuk yang tajam dijelaskan dalam catatan kaki agar ambiguitas sumber tetap terjaga.
theological_decisions: []
