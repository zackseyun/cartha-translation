  register: Bahasa Indonesia baku, modern, dan lugas. Pronomina jamak 'kalian' dipakai karena bentuk Ibraninya jamak. Metafora 'kuk' dipertahankan, demikian pula ungkapan harfiah 'kalajengking', dengan kemungkinan makna teknisnya dicatat dalam catatan kaki.
