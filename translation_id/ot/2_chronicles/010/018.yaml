id: 2CH.10.18
reference: 2 Chronicles 10:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: id
  text: Lalu Raja Rehabeam mengutus Hadoram[a], yang mengepalai kerja paksa[b]. Namun, orang Israel[c] merajamnya dengan batu sampai ia mati. Raja Rehabeam pun menguatkan diri[d] untuk naik ke kereta dan melarikan diri ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini memakai nama “Hadoram”; kisah paralelnya dalam 1 Raja-Raja 12:18 memakai “Adoram”.
    reason: alternative_reading
  - marker: b
    text: Atau “yang mengepalai pengerahan tenaga kerja”. Istilah Ibrani ini menunjuk pada kewajiban kerja yang dikenakan oleh penguasa.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak Israel”; ungkapan ini merupakan sebutan kebangsaan bagi orang Israel.
    reason: lexical_alternative
  - marker: d
    text: Atau, sesuai konteks, “bergegas”. Secara lebih harfiah, bahasa Ibrani mengatakan bahwa Rehabeam “menguatkan dirinya” untuk naik ke kereta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam narasi tentang seorang raja yang menugaskan pejabatnya, “mengutus” merupakan padanan yang alami dan tepat.
- source_word: הֲדֹרָם
  choice: Hadoram
  rationale: Mengikuti bentuk nama dalam teks Ibrani Tawarikh; bentuk berbeda dalam bagian paralel dicatat di catatan kaki.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: yang mengepalai kerja paksa
  rationale: מַס di sini menunjuk pada kewajiban kerja yang dikenakan oleh penguasa, bukan sekadar pajak; “mengepalai” menyampaikan tanggung jawab pejabat tersebut.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: merajamnya dengan batu
  rationale: Mempertahankan baik tindakan merajam maupun penyebutan batu yang eksplisit dalam bahasa Ibrani, sambil tetap wajar dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” berfungsi sebagai sebutan kebangsaan; “orang Israel” menyampaikan idiom itu dengan alami dan tidak membatasi pelakunya hanya kepada laki-laki.
- source_word: וַיָּמֹת
  choice: sampai ia mati
  rationale: Menyatakan hasil rajam secara jelas dan alami, tanpa mengubah hubungan naratifnya.
- source_word: הִתְאַמֵּץ
  choice: menguatkan diri
  rationale: Mempertahankan gagasan refleksif dari akar אמץ, yaitu mengerahkan keteguhan atau kekuatan diri, alih-alih menggantinya secara diam-diam dengan kata yang semata-mata berarti cepat.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: untuk naik ke kereta
  rationale: Menyampaikan gerak naik atau menaiki kereta secara langsung dan alami.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: melarikan diri ke Yerusalem
  rationale: נוס berarti lari untuk menyelamatkan diri; frasa ini merupakan padanan Indonesia yang langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Kerja paksa” dipilih karena mudah dipahami pembaca umum, sedangkan “menguatkan diri” mempertahankan nuansa leksikal sumber meskipun ungkapan “bergegas” lebih lazim dalam konteks pelarian.
