base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: id
  text: Ketika Yerobeam anak Nebat mendengar hal itu[a]—ia berada di Mesir setelah melarikan diri dari hadapan Raja Salomo[b]—Yerobeam kembali dari Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mendengar tentang hal itu.” Teks Ibrani tidak menyebutkan secara langsung apa yang didengar Yerobeam; hal itu dipahami dari konteks.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melarikan diri dari hadapan Raja Salomo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Konstruksi היה dengan infinitif שמע memperkenalkan anak kalimat temporal. Dalam bahasa Indonesia modern, 'Ketika ... mendengar' menyampaikan alur narasi secara alami tanpa ungkapan harfiah yang kaku seperti 'terjadilah ketika'.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Nama-nama ditransliterasikan menurut bentuk Indonesia yang lazim, dan frasa patronimik diterjemahkan langsung.
- source_word: וְהוּא בְמִצְרַיִם
  choice: saat itu ia berada di Mesir
  rationale: Klausa ini memberi informasi latar yang bersifat sisipan. 'Saat itu' memperjelas keadaan Yerobeam ketika mendengar tanpa mengubah hubungan sintaksisnya.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: tempat ia melarikan diri dari hadapan Raja Salomo
  rationale: אֲשֶׁר merujuk kepada Mesir sebagai tempat, sedangkan מִפְּנֵי secara harfiah berarti 'dari hadapan'. Terjemahan ini mempertahankan citra bahasa Ibrani sambil tetap dapat dipahami.
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Dalam konteks ini שוב menyatakan gerakan kembali dari suatu tempat, bukan pertobatan atau pemulihan dalam arti teologis.
- source_word: שְׁמֹעַ
  choice: mendengar hal itu
  rationale: Teks Ibrani tidak menyebutkan objek secara eksplisit, tetapi konteks menyediakan isi yang didengar. 'Hal itu' alami dalam bahasa Indonesia sekaligus ditandai dengan catatan kaki untuk menjaga ketakterusterangan sumber.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Preposisi מן menandai tempat asal kepulangan Yerobeam.
