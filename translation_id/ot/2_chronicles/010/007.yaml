translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua tunggal “engkau,” sesuai tuturan langsung kepada raja. Diksi dibuat bermartabat tetapi tetap mudah dipahami; “rakyat” menegaskan konteks politik, sedangkan “hamba-hambamu” mempertahankan citra kesetiaan kepada raja.
