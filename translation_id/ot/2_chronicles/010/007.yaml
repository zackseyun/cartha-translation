  terminology: “Hamba-hambamu” layak untuk עֲבָדִים dalam konteks kesetiaan politik kepada raja dan tidak perlu diganti dengan istilah yang khusus menunjuk perbudakan kepemilikan. Catatan kaki a dan b ditempatkan pada unsur yang relevan dan memberi alternatif leksikal tanpa mengubah makna pokok.
