source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֵלָ֜י/ו לֵ/אמֹ֗ר אִם תִּֽהְיֶ֨ה לְ/ט֜וֹב לְ/הָ/עָ֤ם הַ/זֶּה֙ וּ/רְצִיתָ֔/ם וְ/דִבַּרְתָּ֥ אֲלֵ/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Jika engkau berbuat baik kepada rakyat ini, menyenangkan hati mereka[a], dan mengucapkan kata-kata yang baik kepada mereka, mereka akan menjadi hamba-hambamu sepanjang masa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menunjukkan kemurahan kepada mereka.” Kata kerja Ibrani ini dapat berarti menyenangkan seseorang, berkenan kepadanya, atau memperlakukannya dengan baik.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka akan terus mengabdi kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: engkau berbuat baik kepada rakyat ini
  rationale: Ungkapan היה + לְ + טוֹב menyatakan sikap atau tindakan yang mendatangkan kebaikan bagi pihak lain. “Berbuat baik kepada” terdengar alami dan tetap lebih luas daripada sekadar “bersikap ramah.” Dalam konteks pemerintahan raja, עָם diterjemahkan “rakyat.”
- source_word: וּרְצִיתָם
  choice: menyenangkan hati mereka
  rationale: Dalam konteks ini רצה dengan akhiran objek dapat menunjuk pada tindakan menyenangkan atau mengambil hati rakyat. Pilihan ini sesuai dengan rangkaian nasihat untuk memperoleh kesetiaan mereka, sementara kemungkinan makna “menunjukkan kemurahan kepada mereka” dicatat dalam catatan kaki.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: mengucapkan kata-kata yang baik kepada mereka
  rationale: Terjemahan ini mempertahankan pengulangan akar דבר dalam konstruksi “berbicara ... perkataan” secara wajar dalam bahasa Indonesia, sekaligus menjaga sifat konkret dari דְּבָרִים טוֹבִים.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: mereka akan menjadi hamba-hambamu
  rationale: עֲבָדִים di sini menunjuk pada ketundukan dan pengabdian rakyat kepada raja, bukan secara khusus perbudakan sebagai kepemilikan manusia. “Hamba-hambamu” mempertahankan bentuk nomina dan nuansa kesetiaan politik.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Ungkapan harfiah “seluruh hari-hari” menyatakan keberlangsungan tanpa menetapkan secara eksplisit batas waktunya. “Sepanjang masa” alami dalam bahasa Indonesia dan tidak menambahkan frasa “seumur hidupmu” yang tidak dinyatakan langsung oleh konstruksi ini.
