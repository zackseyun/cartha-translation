base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: id
  text: Raja Rehabeam kemudian meminta nasihat kepada para tua-tua yang dahulu bertugas di hadapan Salomo[a], ayahnya, semasa Salomo masih hidup. Katanya, “Menurut kalian, bagaimana aku harus menjawab[b] rakyat ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “bertugas di hadapan Salomo” secara harfiah berarti “berdiri di hadapan Salomo” dan dapat menunjukkan bahwa mereka melayani atau mendampinginya dalam kedudukan resmi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengembalikan suatu perkataan kepada rakyat ini”; ungkapan Ibrani ini berarti memberikan jawaban atau balasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: meminta nasihat kepada
  rationale: Bentuk Nifal dari יעץ di sini menyatakan tindakan mencari nasihat dari orang lain. Ungkapan ini alami dalam bahasa Indonesia dan tidak memberi kesan bahwa Rehabeam hanya mempertimbangkan sesuatu dalam batinnya.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Istilah ini menunjuk kepada orang-orang senior yang berperan sebagai pemimpin atau penasihat. “Para tua-tua” merupakan padanan Alkitabiah yang tetap mudah dipahami.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: yang dahulu bertugas di hadapan
  rationale: Ungkapan harfiah “berdiri di hadapan” dapat menunjukkan pelayanan atau tugas resmi di hadapan seorang raja. “Bertugas di hadapan” mempertahankan citra sumber sekaligus memperjelas fungsi mereka.
- source_word: שְׁלֹמֹה אָבִיו
  choice: Salomo, ayahnya
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan aposisional dalam bahasa Ibrani.
- source_word: בִּהְיוֹתוֹ חַי
  choice: semasa Salomo masih hidup
  rationale: Frasa ini menyatakan masa ketika Salomo hidup. Nama Salomo diulangi untuk menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Menurut kalian, bagaimana aku harus
  rationale: Partisipel נוֹעָצִים meminta pertimbangan atau nasihat mereka. Bentuk ini menyampaikan maksud pertanyaan secara alami tanpa mengubah isi nasihat yang diminta.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: menjawab
  rationale: Secara harfiah konstruksi ini berarti “mengembalikan suatu perkataan,” tetapi merupakan idiom untuk memberikan jawaban. “Menjawab” adalah padanan Indonesia yang ringkas dan tepat.
- source_word: לָעָם הַזֶּה
  choice: rakyat ini
  rationale: עם menunjuk kepada suatu kelompok kolektif. Dalam konteks permohonan kepada raja, “rakyat ini” lebih wajar dan tepat daripada “bangsa ini” atau “orang-orang ini”.
