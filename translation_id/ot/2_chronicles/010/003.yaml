translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. Nama ditransliterasikan sebagai Yerobeam dan Rehabeam. Struktur dibuat alami tanpa menghilangkan urutan tindakan atau ungkapan kolektif 'seluruh Israel'.
