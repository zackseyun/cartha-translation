base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: id
  text: 'Lalu mereka mengirim utusan dan memanggilnya[a]. Yerobeam dan seluruh Israel datang lalu berbicara kepada Rehabeam, berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mereka mengirim dan memanggilnya.” Objek dari “mengirim” tidak disebutkan dalam bahasa Ibrani; dalam konteks ini, yang dimaksud kemungkinan adalah utusan. Dapat juga diterjemahkan: “mereka mengirim pesan dan memanggilnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: mereka mengirim orang
  rationale: Dalam konteks ini, objek verba שׁלח tersirat. Bahasa Indonesia memerlukan pelengkap agar ungkapannya alami; 'orang' menyampaikan bahwa utusan dikirim tanpa menentukan lebih jauh siapa mereka.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: untuk memanggilnya
  rationale: קרא + ל di sini berarti memanggil atau meminta seseorang datang. Bentuk tujuan ini secara alami menghubungkannya dengan tindakan mengirim orang.
- source_word: וַיָּבֹא
  choice: datang
  rationale: Verba tunggal menempatkan Yerobeam sebagai subjek utama, tetapi dalam bahasa Indonesia bentuk verba tidak menandai jumlah sehingga dapat secara alami diikuti subjek gabungan.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Yerobeam dan seluruh Israel
  rationale: '''Seluruh Israel'' mempertahankan ungkapan nasional-kolektif teks Ibrani, bukan mempersempitnya menjadi sekadar orang-orang Israel.'
- source_word: וַיְדַבְּרוּ אֶל
  choice: lalu berbicara kepada
  rationale: דבר אל secara langsung berarti 'berbicara kepada'; 'lalu' mempertahankan rangkaian naratif waw tanpa membuat susunan Indonesia kaku.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan perkataan langsung pada ayat berikutnya. 'Demikian:' lebih alami dalam narasi Indonesia daripada 'dengan berkata' pada akhir ayat, sekaligus menandai kelanjutan kutipan.
