  yaml_path: translation/ot/2_chronicles/010/017.yaml
  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: id
  text: Namun, Rehabeam memerintah sebagai raja atas orang Israel yang tinggal di kota-kota Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel yang tinggal di kota-kota Yehuda.”'
    reason: Menunjukkan bentuk harfiah sebutan etnis בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: Namun, ... orang Israel
  rationale: בְּנֵי יִשְׂרָאֵל secara harfiah berarti “anak-anak Israel,” tetapi lazim berfungsi sebagai sebutan etnis bagi orang Israel. Kata sambung וּ diterjemahkan “Namun” untuk menyatakan kontras dengan pemberontakan Israel dalam konteks sebelumnya.
- source_word: הַיֹּשְׁבִים
  choice: yang tinggal
  rationale: Partisipel dari ישׁב di sini menyatakan orang-orang yang menetap atau berdiam di suatu tempat; “yang tinggal” alami dalam bahasa Indonesia modern.
- source_word: בְּעָרֵי יְהוּדָה
  choice: di kota-kota Yehuda
  rationale: Ungkapan lokatif ini menunjuk pada berbagai kota di wilayah Yehuda.
- source_word: וַיִּמְלֹךְ עֲלֵיהֶם
  choice: memerintah atas
  rationale: Kata מלך dengan עַל menyatakan pelaksanaan kekuasaan sebagai raja atas suatu kelompok; “memerintah atas” mempertahankan hubungan tersebut dengan jelas.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
