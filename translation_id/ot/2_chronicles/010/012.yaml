  text: וַ/יָּבֹ֨א יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִשִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: id
  text: 'Maka pada hari ketiga, Yerobeam dan seluruh rakyat datang kepada Rehabeam, tepat seperti yang telah dikatakan raja: “Kembalilah[a] kepadaku pada hari ketiga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Datanglah kembali kepadaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata kerja בוא dapat berarti ‘datang’, ‘pergi’, atau ‘tiba’ sesuai sudut pandang. Dengan אֶל רְחַבְעָם (‘kepada Rehabeam’), ‘datang’ paling alami dalam konteks ini.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: עָם menunjuk kepada rakyat yang menyertai Yerobeam, bukan kepada suatu perhimpunan ibadah resmi. ‘Seluruh rakyat’ mempertahankan cakupan frasa Ibrani secara alami.
- source_word: אֶל רְחַבְעָם
  choice: kepada Rehabeam
  rationale: Preposisi אֶל menyatakan arah menuju seseorang; ‘kepada Rehabeam’ merupakan padanan langsung tanpa menambahkan gagasan menghadap secara resmi.
- source_word: בַּיּוֹם הַשְּׁלִשִׁי
  choice: pada hari ketiga
  rationale: Padanan ini mempertahankan ungkapan waktu Ibrani tanpa memperjelas sistem penghitungan hari yang tidak dijabarkan dalam teks.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menandai bahwa tindakan mereka sesuai dengan perkataan raja sebelumnya; ‘tepat seperti’ menyampaikan kesesuaian itu dengan jelas.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: yang telah dikatakan raja
  rationale: דבר di sini adalah kata kerja umum untuk berbicara atau mengatakan. Bentuk ‘telah dikatakan’ menunjukkan bahwa perkataan raja mendahului kedatangan mereka tanpa memperkuatnya menjadi ‘diperintahkan’.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif לֵאמֹר memperkenalkan isi ucapan. Dalam bahasa Indonesia modern, tanda titik dua memperkenalkan kutipan langsung dengan lebih alami daripada menerjemahkannya secara mekanis sebagai ‘dengan berkata’.
- source_word: שׁוּבוּ אֵלַי
  choice: Kembalilah kepadaku
  rationale: שׁוב berarti kembali atau berbalik. Dalam konteks perintah untuk datang lagi setelah tiga hari, ‘Kembalilah kepadaku’ ringkas, alami, dan tetap dekat dengan bentuk sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat sedikit ditata ulang dengan keterangan waktu di awal agar alami, sementara pengulangan ‘pada hari ketiga’ dan hubungan antara tindakan rakyat dengan perkataan raja tetap dipertahankan.
