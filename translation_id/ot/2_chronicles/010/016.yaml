  text: וְ/כָל יִשְׂרָאֵ֗ל כִּ֠י לֹא שָׁמַ֣ע הַ/מֶּלֶךְ֮ לָ/הֶם֒ וַ/יָּשִׁ֣יבוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜יד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י אִ֤ישׁ לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑יד וַ/יֵּ֥לֶךְ כָּל יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: id
  text: Ketika seluruh Israel melihat bahwa raja tidak mau mendengarkan mereka, rakyat menjawab raja, “Apa bagian kita dalam Daud? Tidak ada warisan bagi kita dalam anak Isai. Ke kemahmu masing-masing, hai Israel![a] Sekarang uruslah rumahmu sendiri, Daud!”[b] Lalu seluruh Israel pergi ke kemah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Masing-masing ke kemahmu, hai Israel!” Kata “kemah” di sini merupakan ungkapan untuk pulang atau berpencar ke tempat tinggal masing-masing. Kata Ibrani yang diterjemahkan “masing-masing” berbentuk tunggal maskulin dan dipakai secara distributif.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Secara harfiah, “Sekarang lihatlah rumahmu, Daud!” “Rumah” dapat berarti rumah tangga, keluarga, atau wangsa Daud; seruan ini menyuruh Daud mengurus urusannya sendiri.
    reason: ambiguity_and_idiom
lexical_decisions:
- source_word: שָׁמַע
  choice: mau mendengarkan
  rationale: Dalam konteks ini verba itu berarti mengindahkan atau memenuhi permintaan rakyat, bukan sekadar mendengar bunyi. Penambahan 'mau' menyatakan penolakan raja secara alami dalam bahasa Indonesia.
- source_word: וַיָּשִׁיבוּ
  choice: menjawab
  rationale: Bentuk dari שוב ini berada dalam idiom yang berarti memberikan jawaban; 'menjawab' adalah padanan Indonesia yang langsung dan alami.
- source_word: חֵלֶק
  choice: bagian
  rationale: '''Bagian'' mempertahankan metafora kepemilikan atau kepentingan dalam penolakan politik terhadap wangsa Daud.'
- source_word: נַחֲלָה
  choice: warisan
  rationale: '''Warisan'' mempertahankan nuansa pusaka keluarga dan hak yang diterima turun-temurun.'
- source_word: בְּבֶן יִשַׁי
  choice: dalam keturunan Isai
  rationale: Secara harfiah frasa ini berbunyi 'dalam anak Isai' dan menunjuk kepada Daud; 'keturunan Isai' membuat hubungan dinasti yang tersirat dapat dipahami tanpa menghilangkan metafora warisan.
- source_word: אִישׁ לְאֹהָלֶיךָ
  choice: Pulanglah ke kemahmu masing-masing
  rationale: אִישׁ dipakai secara distributif. 'Masing-masing' menyampaikan daya distributif itu secara wajar, sedangkan 'kemah' mempertahankan citra historis ungkapan Ibrani.
- source_word: רְאֵה בֵיתְךָ
  choice: uruslah keluargamu sendiri
  rationale: Ungkapan ini merupakan penolakan tajam yang menyuruh Daud mengurus 'rumah'-nya sendiri. 'Keluarga' mempertahankan kemungkinan acuan pada wangsa Daud dan lebih alami daripada terjemahan harfiah 'lihatlah rumahmu'.
- source_word: לְאֹהָלָיו
  choice: pulang ke kemah mereka
  rationale: Bentuk Ibrani secara morfologis tunggal, 'ke kemah-kemahnya', karena mengikuti subjek kolektif 'seluruh Israel'. Bahasa Indonesia wajar memakai pronomina jamak 'mereka'.
theological_decisions:
- issue: Ungkapan penolakan politik terhadap Daud
  choice: Apa bagian kita dalam Daud? Tidak ada warisan bagi kita dalam keturunan Isai.
  alternative: Apa bagian kita pada Daud? Tidak ada pusaka bagi kita pada anak Isai.
  rationale: Terjemahan mempertahankan metafora bagian dan warisan serta kaitannya dengan garis keluarga Daud, tanpa mengubahnya menjadi slogan politik modern.
- issue: Makna בֵיתְךָ dalam seruan kepada Daud
  choice: keluargamu sendiri
  alternative: rumahmu sendiri / wangsa sendiri
  rationale: בַּיִת dapat menunjuk rumah tangga, keluarga, atau wangsa. Konteks perpecahan kerajaan memungkinkan gema dinasti, sehingga 'keluarga' menjaga keluasan makna lebih baik daripada bangunan fisik, tanpa menentukan secara sempit bahwa yang dimaksud hanya dinasti.
- issue: אִישׁ sebagai nomina maskulin distributif
  choice: masing-masing
  alternative: setiap orang / setiap laki-laki
  rationale: Dalam seruan kepada Israel, אִישׁ berfungsi distributif dan tidak harus membatasi tindakan hanya kepada laki-laki. Bahasa Indonesia menyatakan fungsi ini dengan alami melalui 'masing-masing', sambil mencatat bentuk sumber dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Seruan rakyat dibuat tajam dan mudah dipahami, sementara citra 'bagian', 'warisan', dan 'kemah' dipertahankan. Penanda catatan kaki [a] dan [b] ditempatkan tepat sesudah klausa yang dijelaskan.
