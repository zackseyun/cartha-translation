  text: Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: id
  text: Rehabeam pergi ke Sikhem, sebab seluruh Israel telah datang ke Sikhem untuk mengangkatnya menjadi raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol menyatakan tindakan naratif berurutan; 'pergi' merupakan padanan alami dan tepat.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini menjelaskan alasan Rehabeam pergi ke Sikhem; 'sebab' mempertahankan hubungan kausal secara jelas.
- source_word: כָל־יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan kolektif ini menunjuk kepada bangsa atau perwakilan umat Israel secara keseluruhan, tanpa perlu mempersempit acuannya.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: untuk mengangkatnya menjadi raja
  rationale: Bentuk kausatif dari מלך berarti menjadikan atau menetapkan seseorang sebagai raja; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna tindakan penobatan/pengakuan.
