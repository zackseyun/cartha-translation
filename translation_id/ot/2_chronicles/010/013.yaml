  text: וַ/יַּעֲנֵ֥/ם הַ/מֶּ֖לֶךְ קָשָׁ֑ה וַֽ/יַּעֲזֹב֙ הַ/מֶּ֣לֶךְ רְחַבְעָ֔ם אֵ֖ת עֲצַ֥ת הַ/זְּקֵנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: id
  text: Lalu raja menjawab mereka dengan kasar, dan Raja Rehabeam mengabaikan nasihat para tua-tua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: menjawab mereka
  rationale: 'Bentuk kata kerja dari ענה berarti menjawab, dan sufiks orang ketiga jamak menyatakan objek secara eksplisit: “mereka”.'
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung bagi מלך dengan kata sandang; dalam bahasa Indonesia kata sandang itu tidak perlu dinyatakan secara terpisah.
- source_word: קָשָׁה
  choice: dengan keras
  rationale: Secara bentuk merupakan kata sifat yang berarti keras atau berat, tetapi di sini berfungsi menerangkan cara raja menjawab. “Dengan keras” alami dan mempertahankan daya ungkap Ibraninya.
- source_word: וַיַּעֲזֹב
  choice: mengabaikan
  rationale: עזב berarti meninggalkan atau menelantarkan; dalam konteks nasihat, “mengabaikan” menyampaikan tindakan menolak untuk mengikuti nasihat itu tanpa terdengar janggal.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Raja Rehabeam
  rationale: Konstruksi aposisional ini mengidentifikasi raja tersebut dengan namanya; “Raja Rehabeam” merupakan susunan yang alami dalam bahasa Indonesia.
- source_word: עֲצַת
  choice: nasihat
  rationale: עצה dapat berarti nasihat, pertimbangan, atau rencana. Di sini yang dimaksud ialah anjuran yang diberikan kepada Rehabeam.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: זקנים di sini menunjuk kepada kelompok pemimpin atau penasihat senior, bukan hanya orang-orang yang lanjut usia; “para tua-tua” mempertahankan peran sosial-politik tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan mengikuti urutan naratif Ibrani sambil memakai ungkapan Indonesia yang wajar. Pengulangan “raja” dipertahankan karena terdapat dua kali dalam teks sumber.
