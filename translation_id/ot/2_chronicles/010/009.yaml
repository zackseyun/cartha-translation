  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Apa nasihat kalian agar kita dapat menjawab rakyat ini, yang telah berkata kepadaku, ‘Ringankanlah kuk[a] yang ayahmu bebankan kepada kami’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beban”. Secara harfiah bahasa Ibraninya menyebut “kuk”, sebagai gambaran tentang kerja berat atau pemerintahan yang menindas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Lalu ia berkata kepada mereka
  rationale: Kata ‘lalu’ menyampaikan kelanjutan narasi wayyiqtol secara wajar dalam bahasa Indonesia.
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Apa nasihat kalian
  rationale: Bentuk dari יעץ meminta pendapat atau nasihat; frasa nominal ini alami dalam percakapan bahasa Indonesia dan mempertahankan sifat konsultatifnya.
- source_word: וְנָשִׁיב דָּבָר
  choice: agar kita dapat menjawab
  rationale: Ungkapan harfiahnya, ‘mengembalikan perkataan’, merupakan idiom untuk memberi jawaban. ‘Agar’ mengungkapkan hubungan tujuan yang tersirat dalam konteks.
- source_word: הָעָם הַזֶּה
  choice: rakyat ini
  rationale: עָם adalah nomina kolektif. Dalam konteks seorang raja yang menanggapi orang-orang di bawah pemerintahannya, ‘rakyat’ paling alami dan tepat.
- source_word: דִּבְּרוּ אֵלַי
  choice: telah berkata kepadaku
  rationale: Bentuk perfektif menunjuk pada permintaan yang sudah disampaikan dan masih menjadi pokok pembahasan; ‘telah berkata’ mempertahankan kaitan itu.
- source_word: הָקֵל
  choice: Ringankanlah
  rationale: Imperatif kausatif ini berarti membuat sesuatu menjadi lebih ringan; bentuk ini juga mempertahankan metafora kuk.
- source_word: מִן הָעֹל
  choice: kuk
  rationale: עֹל secara harfiah berarti kuk dan di sini menjadi metafora bagi kerja atau pemerintahan yang menindas; citra konkret itu dipertahankan.
- source_word: נָתַן ... עָלֵינוּ
  choice: bebankan kepada kami
  rationale: Pilihan ini menyampaikan tindakan menaruh kuk sebagai beban atas mereka dengan bahasa Indonesia yang alami.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Padanan langsung bagi bentuk posesif yang ditujukan kepada Rehabeam.
theological_decisions: []
