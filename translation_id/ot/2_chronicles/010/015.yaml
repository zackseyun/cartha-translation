  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: id
  text: Jadi, raja tidak mendengarkan rakyat, sebab perubahan keadaan ini berasal dari Allah, supaya Yahweh meneguhkan firman yang telah disampaikan-Nya melalui Ahia, orang Silo, kepada Yerobeam anak Nebat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab penyebab hal itu berasal dari Allah.” Kata Ibrani yang dipakai dapat berarti perubahan, keadaan, atau perkembangan yang menjadi sebab.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: mendengarkan
  rationale: Dalam konteks ini berarti mengindahkan permintaan rakyat, bukan sekadar mendengar bunyi. 'Mendengarkan' mempertahankan nuansa itu tanpa mempertegasnya menjadi 'menaati'.
- source_word: נְסִבָּה
  choice: perubahan keadaan
  rationale: Nomina ini dapat menunjuk pada perubahan, keadaan, atau perkembangan yang menjadi sebab. 'Perubahan keadaan' alami dalam bahasa Indonesia dan sesuai dengan perkembangan peristiwa dalam narasi.
- source_word: מֵעִם הָאֱלֹהִים
  choice: berasal dari Allah
  rationale: Frasa ini menyatakan sumber atau asal ilahi secara langsung.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menyampaikan makna tujuan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הָקִים
  choice: meneguhkan
  rationale: Bentuk hiphil dari קום berarti membuat berdiri atau menetapkan. 'Meneguhkan' cocok dengan objek 'firman' dan tidak langsung mempersempit maknanya menjadi 'menggenapi'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: דְּבָרוֹ
  choice: firman
  rationale: '''Firman'' merupakan padanan yang bermartabat dan lazim bagi perkataan ilahi, serta tidak mempersempitnya menjadi ''janji''.'
- source_word: בְּיַד
  choice: melalui
  rationale: Idiom ini menandai perantaraan atau sarana; 'melalui' menyampaikan peran Ahia sebagai penyampai firman secara alami.
- source_word: הַשִּׁלוֹנִי
  choice: orang Silo
  rationale: Menyampaikan nisbah tempat secara jelas bagi pembaca Indonesia modern.
- source_word: בֶּן נְבָט
  choice: anak Nebat
  rationale: Bentuk patronimik diterjemahkan secara langsung dan lazim.
theological_decisions:
- issue: Penyebab ilahi dan tindakan manusia
  choice: raja tidak mendengarkan rakyat, sebab perubahan keadaan ini berasal dari Allah
  alternative: raja tidak mendengarkan rakyat, sebab penyebab hal itu berasal dari Allah
  rationale: Terjemahan mempertahankan penolakan raja sebagai tindakan manusia sekaligus menyatakan bahwa perkembangan peristiwa itu berasal dari Allah, tanpa menjelaskan hubungan keduanya melampaui teks.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi secara langsung; transliterasi mempertahankan nama itu dan membedakannya dari gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Rakyat' dipilih untuk הָעָם dalam konteks kerajaan; 'orang Silo' lebih transparan daripada bentuk nisbah serapan. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan klausa sebab secara keseluruhan.
