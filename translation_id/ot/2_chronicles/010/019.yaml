  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: id
  text: Demikianlah Israel tetap memberontak terhadap keluarga Daud sampai hari ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demikianlah Israel memberontak terhadap keluarga Daud sampai hari ini.” Kata kerja Ibrani dapat diterjemahkan sebagai tindakan lampau sederhana (“memberontak”) atau dengan menekankan keadaan yang berlanjut (“tetap memberontak”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: terus memberontak
  rationale: Kata פשע dalam konteks politik ini menyatakan pemberontakan terhadap kekuasaan. Bentuk ini, bersama frasa 'sampai hari ini', secara alami menyampaikan keadaan yang berlanjut tanpa mengubahnya menjadi sekadar pelanggaran moral.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Di sini nama ini menunjuk kepada suku-suku utara sebagai kesatuan politik, berbeda dari dinasti Daud; nama diri dipertahankan tanpa penjelasan interpretatif dalam teks utama.
- source_word: בְּבֵית דָּוִיד
  choice: terhadap keluarga Daud
  rationale: Dengan פשע, preposisi ב menandai pihak yang dilawan. 'Keluarga Daud' mempertahankan arti dinasti dari בֵּית dalam bahasa Indonesia yang wajar.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan baku ini menunjukkan bahwa keadaan tersebut berlanjut hingga masa penulis.
