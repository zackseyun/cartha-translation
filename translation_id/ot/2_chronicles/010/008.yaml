revisions:
- from: Namun, ia mengabaikan nasihat para tua-tua yang telah mereka berikan kepadanya, lalu meminta nasihat dari orang-orang muda yang tumbuh besar bersamanya dan yang melayani di hadapannya.[a]
  to: Namun, ia meninggalkan nasihat yang diberikan para tua-tua kepadanya, lalu berunding dengan orang-orang muda yang tumbuh besar bersamanya, yang berdiri di hadapannya.[a]
  rationale: Revisi memakai “meninggalkan” untuk mencerminkan daya tolak עזב tanpa menambah nuansa penilaian, “berunding dengan” untuk tindakan konsultasi dalam וַיִּוָּעַץ, dan mempertahankan ungkapan istana secara harfiah dalam teks utama. Catatan kaki menyediakan makna idiomatisnya.
