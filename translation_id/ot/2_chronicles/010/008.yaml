base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: id
  text: Namun, ia meninggalkan nasihat yang diberikan para tua-tua kepadanya, lalu berunding dengan orang-orang muda yang tumbuh besar bersamanya, yang berdiri di hadapannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang melayaninya” atau “yang mendampinginya”; secara harfiah, “yang berdiri di hadapannya,” suatu ungkapan istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: mengabaikan
  rationale: Kata עזב berarti meninggalkan atau menolak. Dalam konteks ini, raja tidak mengikuti nasihat para tua-tua; “mengabaikan” menyampaikan penolakan praktis itu secara wajar dalam bahasa Indonesia.
- source_word: עֲצַת הַזְּקֵנִים
  choice: nasihat para tua-tua
  rationale: עֵצָה berarti nasihat atau pertimbangan, sedangkan זְקֵנִים menunjuk kepada orang-orang yang lebih tua dan berperan sebagai penasihat senior. “Para tua-tua” mempertahankan unsur usia dan kedudukan mereka.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: yang telah mereka berikan kepadanya
  rationale: Karena “nasihat” sudah disebut, ungkapan ini menghindari pengulangan yang kaku dan tetap menyatakan bahwa para tua-tua telah menasihatinya.
- source_word: וַיִּוָּעַץ אֶת
  choice: lalu meminta nasihat dari
  rationale: Bentuk Niphal menggambarkan tindakan berunding atau mencari pertimbangan bersama pihak lain. “Meminta nasihat dari” alami dalam bahasa Indonesia dan cocok dengan kelanjutan ayat berikutnya.
- source_word: הַיְלָדִים
  choice: orang-orang muda
  rationale: Dalam konteks ini, ילד bukan anak-anak kecil, melainkan rekan sebaya raja yang telah tumbuh besar bersamanya.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: yang tumbuh besar bersamanya
  rationale: Terjemahan ini mempertahankan gambaran tentang masa pertumbuhan yang mereka lalui bersama.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: yang melayani di hadapannya
  rationale: Secara harfiah frasa ini berarti “yang berdiri di hadapannya,” tetapi dalam lingkungan istana merupakan ungkapan bagi mereka yang hadir untuk melayani raja. Makna idiomatis ditempatkan dalam teks, sementara bentuk harfiahnya dicatat dalam catatan kaki.
