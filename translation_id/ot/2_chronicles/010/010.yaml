base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: id
  text: 'Orang-orang muda yang tumbuh besar bersamanya berkata kepadanya, “Beginilah yang harus engkau katakan kepada rakyat yang berkata kepadamu, ‘Ayahmu membuat kuk kami berat, tetapi engkau, ringankanlah kuk kami.’ Beginilah yang harus engkau katakan kepada mereka: ‘Jari kelingkingku[a] lebih tebal daripada pinggang ayahku[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kecilku” atau “bagian kecilku”; ungkapan ini biasanya dipahami sebagai “jari kelingkingku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pinggul ayahku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: orang-orang muda
  rationale: Dalam konteks istana dan dengan keterangan bahwa mereka tumbuh besar bersama Rehabeam, kata ini menunjuk kepada rekan-rekan mudanya, bukan anak-anak kecil.
- source_word: גָּדְלוּ אִתּוֹ
  choice: yang tumbuh besar bersamanya
  rationale: Ungkapan ini menunjukkan bahwa mereka bertumbuh atau dibesarkan bersama Rehabeam.
- source_word: כֹּה תֹאמַר
  choice: Beginilah yang harus engkau katakan
  rationale: Menyampaikan formula pengarahan tutur secara alami sekaligus mempertahankan daya perintahnya.
- source_word: לָעָם
  choice: kepada rakyat
  rationale: Kata Ibrani berarti rakyat atau bangsa itu; 'rakyat' sesuai dengan konteks mereka sebagai pihak yang menghadap raja.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: Ayahmu membuat kuk kami berat
  rationale: Mempertahankan metafora konkret 'kuk' dan makna kausatif verba 'membuat berat'.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: ringankanlah kuk itu dari atas kami
  rationale: Objek 'kuk itu' tersirat dari konteks, sedangkan 'dari atas kami' mempertahankan gambaran spasial מֵעָלֵינוּ, meskipun ungkapannya sengaja lebih harfiah.
- source_word: קָטָנִּי
  choice: jari kelingkingku
  rationale: Secara bentuk dapat berarti 'kecilku/kekecilanku', tetapi idiom ini lazim dipahami secara eliptis sebagai jari kelingking, sejalan dengan paralelnya dalam 1 Raja-Raja 12:10.
- source_word: עָבָה
  choice: lebih tebal daripada
  rationale: Menyatakan ketebalan, dengan perbandingan yang ditandai oleh prefiks מִן.
- source_word: מִמָּתְנֵי אָבִי
  choice: daripada pinggang ayahku
  rationale: מָתְנַיִם menunjuk kawasan pinggang atau pangkal paha; 'pinggang' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Metafora 'kuk' dipertahankan. Sapaan 'engkau' dipakai dalam tuturan kerajaan. Bentuk 'ringankanlah kuk itu dari atas kami' mempertahankan gambaran spasial sumber, sementara catatan kaki menjaga keterbukaan pada bentuk harfiah idiom tubuh.
