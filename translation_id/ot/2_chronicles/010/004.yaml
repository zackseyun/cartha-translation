base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: id
  text: Ayahmu telah memberatkan kuk kami[a]. Sekarang, ringankanlah kerja berat yang diwajibkan ayahmu[b] dan kuk berat yang ia bebankan kepada kami, maka kami akan mengabdi kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah membuat kuk kami berat ditanggung.”
    reason: lexical_alternative
  - marker: b
    text: “Kerja” di sini dapat mencakup pekerjaan atau kewajiban yang dikenakan oleh pemerintahan raja; dapat juga diterjemahkan “pelayanan.”
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: telah membuat kuk kami berat
  rationale: Bentuk Hifil הִקְשָׁה menyatakan tindakan menyebabkan kuk menjadi keras, berat, atau berat ditanggung. Ungkapan Indonesia ini mempertahankan daya kausatif dan metafora kuk; catatan kaki mencatat alternatif leksikal sumber.
- source_word: עֻלֵּנוּ
  choice: kuk kami
  rationale: עֹל secara harfiah adalah kuk dan di sini menjadi metafora bagi beban pemerintahan. 'Kuk' mempertahankan gambaran konkret yang diulang dalam ayat ini.
- source_word: הָקֵל
  choice: ringankanlah
  rationale: Imperatif ini meminta Rehabeam mengurangi beban. 'Ringankanlah' alami dalam bahasa Indonesia dan mempertahankan pertentangan berat-ringan.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: pekerjaan berat yang diwajibkan ayahmu
  rationale: עֲבֹדָה dapat berarti pekerjaan, pelayanan, atau kewajiban kerja. Dalam konteks pemerintahan kerajaan, 'yang diwajibkan' menjelaskan bahwa pekerjaan itu dikenakan oleh sang raja tanpa membatasi maknanya hanya pada satu bentuk kerja paksa.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: dan kuk berat
  rationale: Terjemahan ini mempertahankan metafora עֹל dan menerjemahkan כָּבֵד secara langsung sebagai 'berat'.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: yang dipasangnya atas kami
  rationale: Ungkapan ini mempertahankan citra kuk yang ditaruh atau dipasang di atas orang, alih-alih menggantinya sepenuhnya dengan istilah abstrak seperti 'dibebankan'.
- source_word: וְנַעַבְדֶךָּ
  choice: maka kami akan mengabdi kepadamu
  rationale: Bentuk ini menyatakan tanggapan atau janji rakyat apabila beban mereka diringankan. 'Mengabdi' sesuai dengan hubungan rakyat dan raja serta tetap mencerminkan akar עבד.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Sapaan langsung kepada Rehabeam mengenai Salomo diterjemahkan secara lugas dan pengulangannya dipertahankan sejauh diperlukan oleh struktur Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'kuk' dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum. 'Mengabdi' dipilih untuk pelayanan rakyat kepada raja, bukan sebagai istilah ibadah yang khusus.
