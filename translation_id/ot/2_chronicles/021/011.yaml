  edition: WLC
  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: id
  text: Ia juga mendirikan tempat-tempat pemujaan di tempat-tempat tinggi di wilayah perbukitan Yehuda, membuat penduduk Yerusalem melacurkan diri[a], dan menyesatkan Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat penduduk Yerusalem berzina.” Bahasa Ibrani memakai gambaran ketidaksetiaan perjanjian yang dapat merujuk pada percabulan maupun kemurtadan dalam ibadah.
    reason: lexical_alternative
  - marker: b
    text: Atau “membuat Yehuda menyimpang”; dalam konteks ini maksudnya dapat dipahami sebagai menjauhkan Yehuda dari TUHAN.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ia juga
  rationale: Mempertahankan makna tambahan sekaligus penekanan pada pelaku dalam susunan yang alami bagi bahasa Indonesia modern.
- source_word: עָשָׂה בָמוֹת
  choice: mendirikan tempat-tempat pemujaan
  rationale: בָמוֹת menunjuk pada lokasi pemujaan, khususnya tempat ibadah yang tidak sah. 'Mendirikan' menyampaikan tindakan membuat atau mengadakan tempat-tempat tersebut secara idiomatis.
- source_word: בְּהָרֵי יְהוּדָה
  choice: di perbukitan Yehuda
  rationale: הָרִים dapat berarti gunung-gunung atau wilayah perbukitan; dalam konteks geografis Yehuda, 'perbukitan' merupakan ungkapan Indonesia yang alami.
- source_word: וַיֶּזֶן
  choice: membuat ... berzina
  rationale: Bentuk kausatif dari זנה berarti menyebabkan orang berzina atau melacurkan diri. Dalam konteks tempat pemujaan, ungkapan ini juga membawa makna ketidaksetiaan rohani tanpa meniadakan kemungkinan nuansa seksual.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: penduduk Yerusalem
  rationale: Padanan langsung, ringkas, dan alami untuk orang-orang yang tinggal di Yerusalem.
- source_word: וַיַּדַּח
  choice: menyesatkan
  rationale: Bentuk kausatif נדח di sini berarti menyebabkan menyimpang dari kesetiaan yang benar. 'Menyesatkan' mempertahankan objek yang tidak disebutkan secara eksplisit dalam bahasa Ibrani.
- source_word: אֶת יְהוּדָה
  choice: Yehuda
  rationale: Merujuk secara kolektif kepada rakyat atau kerajaan Yehuda.
theological_decisions:
- issue: Apakah ketidaksetiaan penduduk Yerusalem harus dinyatakan secara harfiah atau rohani
  choice: Memakai 'membuat ... berzina' dalam teks utama
  alternative: membuat ... melacurkan diri; membuat ... tidak setia kepada TUHAN
  rationale: Bahasa Ibrani memakai citra perzinaan yang dapat mencakup perbuatan seksual maupun kemurtadan religius. Teks utama mempertahankan ketegangan metaforis itu, sedangkan catatan kaki menjelaskannya.
- issue: Apakah tujuan penyimpangan Yehuda perlu disebutkan secara eksplisit
  choice: menyesatkan Yehuda
  alternative: menjauhkan Yehuda dari TUHAN
  rationale: Konteks menunjukkan bahwa yang dimaksud ialah penyimpangan dari TUHAN, tetapi frasa 'dari TUHAN' tidak dinyatakan dalam ayat Ibrani ini. Karena itu, teks utama tidak menambahkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Tempat-tempat pemujaan' dipilih agar istilah kultis בָמוֹת dipahami pembaca umum; catatan kaki menjaga ambiguitas teologis pada verba זנה dan נדח.
