  source_fidelity: Verba וַיֶּזֶן (Hifil זנה) lebih dekat dengan tindakan menyebabkan penduduk Yerusalem 'melacurkan diri' daripada sekadar 'berzina'; dalam konteks kultis, metafora ini juga dapat menunjuk kepada ketidaksetiaan religius. Selain itu, בָמוֹת adalah istilah kultis 'tempat-tempat tinggi', yang sebaiknya tetap tampak dalam terjemahan, terpisah dari keterangan geografis 'wilayah perbukitan Yehuda'. 'Menyesatkan Yehuda' menyampaikan וַיַּדַּח dengan baik tanpa menambahkan objek tersirat 'dari TUHAN'.
  naturalness: Revisi tetap memakai bahasa Indonesia baku modern. Frasa 'tempat-tempat pemujaan di tempat-tempat tinggi di wilayah perbukitan Yehuda' memang mengulang 'tempat', tetapi secara jelas membedakan situs kultis Ibrani dari wilayah geografisnya dan tetap mudah dipahami.
  terminology: '''Tempat-tempat pemujaan'' menjelaskan fungsi בָמוֹת bagi pembaca umum, sementara ''tempat-tempat tinggi'' mempertahankan istilah kultis sumber. ''Melacurkan diri'' mempertahankan citra זנה yang lebih spesifik daripada ''berzina''; catatan kaki menjelaskan cakupan metaforisnya tanpa memaksakan pembacaan yang hanya seksual atau hanya religius.'
