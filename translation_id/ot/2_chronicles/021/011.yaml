  - severity: medium
    issue: Istilah kultis בָמוֹת tidak tampak secara memadai dalam 'tempat-tempat pemujaan di perbukitan Yehuda'.
    rationale: Frasa draf dapat dibaca hanya sebagai tempat ibadah yang kebetulan berada di daerah berbukit. Teks Ibrani menyebut 'tempat-tempat tinggi' lalu secara terpisah menempatkannya di wilayah pegunungan/perbukitan Yehuda.
