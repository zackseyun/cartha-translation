- from: Ia juga mendirikan tempat-tempat pemujaan di perbukitan Yehuda, membuat penduduk Yerusalem berzina[a], dan menyesatkan Yehuda.[b]
  to: Ia juga mendirikan tempat-tempat pemujaan di tempat-tempat tinggi di wilayah perbukitan Yehuda, membuat penduduk Yerusalem melacurkan diri[a], dan menyesatkan Yehuda.[b]
  rationale: Revisi mengganti 'berzina' dengan 'melacurkan diri' agar citra kausatif זנה dipertahankan, sambil menyimpan alternatif dan nuansa metaforisnya dalam catatan kaki. Revisi juga menambahkan 'di tempat-tempat tinggi' untuk menandai בָמוֹת sebagai istilah kultis, tanpa menghapus keterangan geografis mengenai wilayah perbukitan Yehuda. Klausa terakhir dan catatan kakinya dipertahankan karena sesuai dengan ambiguitas objek tersirat pada וַיַּדַּח.
