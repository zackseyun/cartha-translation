  text: וַ/יָּבֹ֤א אֵלָי/ו֙ מִכְתָּ֔ב מֵֽ/אֵלִיָּ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֱלֹהֵי֙ דָּוִ֣יד אָבִ֔י/ךָ תַּ֗חַת אֲשֶׁ֤ר לֹֽא הָלַ֨כְתָּ֙ בְּ/דַרְכֵי֙ יְהוֹשָׁפָ֣ט אָבִ֔י/ךָ וּ/בְ/דַרְכֵ֖י אָסָ֥א מֶֽלֶךְ יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: id
  text: 'Kemudian sebuah surat dari nabi Elia sampai kepadanya, yang berisi, “Beginilah firman Yahweh, Allah Daud, leluhurmu: Karena engkau tidak mengikuti jalan-jalan Yosafat, ayahmu, ataupun[a] jalan-jalan Asa, raja Yehuda,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “dan.” Sesudah kata ingkar, bahasa Indonesia lebih alami memakai “ataupun”: “tidak … ataupun ….”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: Kemudian datanglah sepucuk surat kepadanya
  rationale: Bentuk verba tunggal diikuti מִכְתָּב sebagai subjek. Susunan ini mempertahankan gambaran surat yang datang kepadanya sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: dari Nabi Elia
  rationale: Nama אֵלִיָּהוּ memakai bentuk Indonesia yang lazim, “Elia,” sedangkan הַנָּבִיא diterjemahkan sebagai gelar “Nabi.”
- source_word: לֵאמֹר
  choice: yang berbunyi
  rationale: Dalam konteks surat, ungkapan ini secara alami memperkenalkan isi tertulis; terjemahan harfiah “dengan mengatakan” kurang idiomatis dalam bahasa Indonesia.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini mempertahankan formula resmi pewartaan kenabian dalam bentuk Indonesia yang alami dan bermartabat.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: Allah Daud, leluhurmu
  rationale: אָב dapat menunjuk kepada bapak atau leluhur. Karena Daud adalah nenek moyang dinasti Yoram, “leluhurmu” menyampaikan hubungan yang dimaksud tanpa memberi kesan bahwa Daud adalah ayah kandungnya.
- source_word: תַּחַת אֲשֶׁר
  choice: Karena
  rationale: Dalam konteks ini frasa tersebut memperkenalkan alasan bagi penghukuman yang diumumkan selanjutnya.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: engkau tidak hidup menurut jalan
  rationale: Metafora Ibrani tentang berjalan dalam suatu jalan menunjuk pada perilaku atau pola hidup. “Hidup menurut jalan” mempertahankan citranya sambil tetap jelas bagi pembaca modern.
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: Yosafat, ayahmu
  rationale: Di sini אָב menunjuk langsung kepada ayah Yoram, sehingga diterjemahkan “ayahmu.” Ejaan “Yosafat” mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: ataupun menurut jalan Asa, raja Yehuda
  rationale: וּ secara bentuk berarti “dan,” tetapi sesudah penyangkalan bahasa Indonesia secara alami memakai “ataupun” untuk menyatakan bahwa kedua teladan itu sama-sama tidak diikuti. Gelar Asa diterjemahkan langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna אָבִיךָ dalam hubungan Yoram dengan Daud dan Yosafat
  choice: “leluhurmu” untuk Daud dan “ayahmu” untuk Yosafat
  alternative: “bapamu” pada kedua tempat
  rationale: 'Kata Ibrani yang sama memiliki cakupan hubungan keluarga yang luas. Konteks silsilah menuntut pembedaan alami: Daud adalah leluhur dinasti Yoram, sedangkan Yosafat adalah ayah kandungnya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang khidmat. Kutipan sengaja berakhir dengan koma karena kalimat dan isi nubuat berlanjut ke ayat berikutnya.
