base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: id
  text: Setelah Yoram berkuasa atas kerajaan ayahnya dan mengokohkan kedudukannya, ia membunuh semua saudara laki-lakinya dengan pedang, juga beberapa pembesar Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat” atau “pemimpin.” Istilah Ibrani ini dapat menunjuk penguasa atau pejabat tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: Setelah Yoram berkuasa atas kerajaan ayahnya
  rationale: Dalam konteks kerajaan, קום dengan עַל menyatakan naik atau tampil untuk memerintah. Ungkapan “berkuasa atas” menyampaikan peralihan kekuasaan sekaligus nuansa otoritas dari עַל secara wajar dalam bahasa Indonesia. “Setelah” menghubungkan rangkaian tindakan tanpa menambahkan kata penanda wacana yang tidak eksplisit.
- source_word: וַיִּתְחַזַּק
  choice: mengokohkan kedudukannya
  rationale: Bentuk hitpael dari חזק bersifat refleksif dan di sini paling wajar dipahami sebagai tindakan memperkuat atau memantapkan diri sesudah naik takhta. “Kedudukannya” menyampaikan implikasi kontekstual tanpa membatasinya hanya pada kekuatan militer.
- source_word: וַיַּהֲרֹג
  choice: ia membunuh
  rationale: Padanan modern dan langsung untuk tindakan membunuh; tidak menggunakan diksi arkais.
- source_word: אֶת כָּל אֶחָיו
  choice: semua saudara laki-lakinya
  rationale: Nomina Ibrani ini secara eksplisit menunjuk saudara kandung laki-laki, sehingga jenis kelaminnya dipertahankan.
- source_word: בֶּחָרֶב
  choice: dengan pedang
  rationale: Mempertahankan makna instrumental dari ungkapan Ibrani dan idiom pembunuhan dengan senjata tajam.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: juga beberapa pembesar Israel
  rationale: Prefiks מִן bersifat partitif, sehingga diterjemahkan “beberapa”. שָׂרִים menunjuk orang-orang berpangkat atau pemegang wewenang; “pembesar” cocok dengan lingkungan istana, sementara “Israel” dipertahankan sebagaimana teks sumber.
theological_decisions:
- issue: Acuan “Israel” dalam frasa מִשָּׂרֵי יִשְׂרָאֵל
  choice: Israel
  alternative: Yehuda; bangsa itu
  rationale: Kitab Tawarikh dapat memakai “Israel” secara lebih luas dalam konteks Yehuda. Terjemahan mempertahankan istilah sumber dan tidak menyelesaikan ketegangan historis-teologis itu melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama יְהוֹרָם ditulis “Yoram”, bentuk yang alami dalam transliterasi Indonesia. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
