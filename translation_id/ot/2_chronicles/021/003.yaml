  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם אֲ֠בִי/הֶם מַתָּנ֨וֹת רַבּ֜וֹת לְ/כֶ֤סֶף וּ/לְ/זָהָב֙ וּ/לְ/מִגְדָּנ֔וֹת עִם עָרֵ֥י מְצֻר֖וֹת בִּֽ/יהוּדָ֑ה וְ/אֶת הַ/מַּמְלָכָ֛ה נָתַ֥ן לִֽ/יהוֹרָ֖ם כִּי ה֥וּא הַ/בְּכֽוֹר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: id
  text: Ayah mereka memberi mereka banyak pemberian berupa perak, emas, dan barang-barang berharga[a], serta kota-kota berbenteng di Yehuda. Namun, ia memberikan kerajaan kepada Yoram karena dialah anak sulung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "barang-barang pilihan" atau "pemberian-pemberian mahal". Istilah Ibrani ini dapat menunjuk secara luas pada barang yang bernilai atau terpilih.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: Ayah mereka memberi mereka
  rationale: Menerjemahkan urutan naratif secara langsung dan mempertahankan ayah sebagai pelaku serta para saudara sebagai penerima.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: banyak pemberian
  rationale: Ungkapan ini terutama menyatakan banyaknya pemberian; pilihan ini alami dalam bahasa Indonesia dan tidak melebihkan maknanya menjadi pemberian yang sangat besar.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: berupa perak, emas
  rationale: Prefiks לְ memperkenalkan jenis pemberian. 'Berupa' menjelaskan hubungan tersebut secara alami tanpa menentukan apakah yang dimaksud uang, benda, atau bahan mentah.
- source_word: וּלְמִגְדָּנוֹת
  choice: dan barang-barang berharga[a]
  rationale: מִגְדָּנוֹת dapat menunjuk pada barang pilihan atau bernilai. Dalam konteks pemberian kerajaan, terjemahan umum ini tepat sekaligus mempertahankan keluasan maknanya; alternatif dicatat dalam catatan kaki.
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: serta kota-kota berbenteng di Yehuda
  rationale: עִם menyatakan tambahan yang menyertai pemberian lain, sedangkan bentuk pasif מְצֻרוֹת paling wajar dinyatakan sebagai 'berbenteng'.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: Namun, ia memberikan kerajaan kepada Yoram
  rationale: Walaupun וְ secara bentuk berarti 'dan', konteks membedakan pemberian kepada para saudara dari kerajaan yang diberikan kepada Yoram. 'Namun' menyatakan pertentangan wacana itu secara wajar.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: karena dialah anak sulung
  rationale: כִּי menyatakan alasan, dan bentuk dengan artikel menunjuk pada status Yoram sebagai anak sulung. 'Dialah' mempertahankan penekanan pada dirinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama יְהוֹרָם ditulis 'Yoram', bentuk yang lazim dalam Alkitab bahasa Indonesia. Struktur kalimat mempertahankan kontras antara pemberian kepada saudara-saudara dan penyerahan kerajaan kepada anak sulung.
