  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: id
  text: Mereka maju menyerang Yehuda dan menerobos masuk ke negeri itu. Mereka membawa pergi semua harta benda yang terdapat di istana raja, serta menawan anak-anak lelakinya dan istri-istrinya. Tidak ada seorang pun anak lelaki yang tersisa baginya selain Yoahas,[a] anaknya yang paling muda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yoahas kemungkinan adalah orang yang sama dengan yang disebut Ahazia di bagian lain (bandingkan 2 Raja-Raja 8:24–26; 2 Tawarikh 22:1).
    reason: Menjelaskan perbedaan bentuk nama antara Teks Masoret pada ayat ini dan bagian-bagian paralel.
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: Mereka maju menyerang Yehuda
  rationale: Kata עלה dengan ב menggambarkan gerakan naik memasuki suatu wilayah; dalam konteks militer, frasa ini menyatakan gerak maju yang bermusuhan. Terjemahan ini menyampaikan konteks serangan secara alami.
- source_word: וַיִּבְקָעוּהָ
  choice: dan menerobos masuk ke negeri itu
  rationale: Kata בקע berarti membelah, mendobrak, atau menerobos. Dengan Yehuda sebagai objek, ungkapan ini menunjukkan bahwa para penyerang menerobos pertahanannya; 'negeri itu' memperjelas rujukan pronominal tanpa menyamakan Yehuda dengan kota.
- source_word: וַיִּשְׁבּוּ
  choice: Mereka mengangkut
  rationale: Kata שבה lazimnya berarti menawan atau membawa sebagai tawanan. Karena kata kerja ini mencakup harta serta anggota keluarga kerajaan, 'mengangkut' secara alami menggambarkan pembawaan jarahan dan orang-orang, sementara konteks tetap menunjukkan bahwa mereka dibawa paksa.
- source_word: כָּל הָרְכוּשׁ
  choice: semua harta benda
  rationale: Kata רכוש menunjuk pada barang milik atau kekayaan bergerak. 'Harta benda' merupakan padanan Indonesia yang luas dan wajar.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: yang terdapat di istana raja
  rationale: נמצא berarti 'didapati' atau 'terdapat', sedangkan בית המלך dalam konteks kerajaan dapat merujuk pada istana. Pilihan ini alami dan tidak menimbulkan kesan rumah biasa.
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: juga anak-anak lelaki dan istri-istrinya
  rationale: גם mempertahankan unsur tambahan atau penegasan. Bentuk jamak 'istri-istrinya' mengikuti נָשָׁיו, dan 'anak-anak lelaki' memperjelas בָּנָיו sesuai kalimat berikutnya.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: Tidak seorang pun anak lelakinya tersisa
  rationale: Bentuk pasif dari שאר menyatakan sesuatu yang tetap tinggal atau tersisa. Susunan ini wajar dalam bahasa Indonesia dan mempertahankan akibat serangan tersebut.
- source_word: כִּי אִם
  choice: selain
  rationale: Ungkapan ini memperkenalkan satu-satunya pengecualian.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Teks Masoret memuat nama יְהוֹאָחָז. Bentuk Indonesia 'Yoahas' dipertahankan dalam teks utama, sedangkan hubungannya dengan Ahazia dijelaskan dalam catatan kaki.
- source_word: קְטֹן בָּנָיו
  choice: anaknya yang paling muda
  rationale: Dalam konteks hubungan keluarga, קטן menyatakan usia termuda, bukan ukuran fisik. Bentuk ini menyampaikan hubungan konstruk secara alami.
theological_decisions:
- issue: Bentuk nama anak Yoram yang tersisa
  choice: Mempertahankan nama Yoahas dari Teks Masoret dalam teks utama
  alternative: Menggunakan Ahazia berdasarkan 2 Raja-Raja 8:24–26 dan 2 Tawarikh 22:1
  rationale: Ini merupakan persoalan tekstual dan identifikasi tokoh, bukan alasan untuk menyeragamkan teks secara diam-diam. Keutamaan sumber Ibrani menuntut 'Yoahas' dalam teks utama, sementara kemungkinan bahwa ia adalah tokoh yang disebut Ahazia di bagian lain dicatat secara transparan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Menerobos masuk ke negeri itu' mempertahankan citra verba Ibrani secara lebih spesifik daripada sekadar 'menyerbu'. Penanda catatan kaki ditempatkan langsung sesudah nama Yoahas, yaitu unsur yang dijelaskan.
