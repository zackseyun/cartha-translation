base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: id
  text: Dan engkau sendiri akan menderita banyak penyakit, dengan penyakit pada ususmu[a], sampai ususmu keluar akibat penyakit itu, hari demi hari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: organ-organ dalammu. Kata Ibrani ini menunjuk bagian-bagian dalam tubuh, terutama usus.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: hari-hari di atas hari-hari; maksudnya, terus-menerus dari hari ke hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Dan engkau sendiri
  rationale: Kata ganti mandiri memberi penekanan dan mengalihkan nubuat secara langsung kepada Yoram; “engkau sendiri” mempertahankan penekanan itu.
- source_word: בָּחֳלָיִים רַבִּים
  choice: akan ditimpa banyak penyakit
  rationale: Ungkapan dengan preposisi ב menyatakan keadaan atau penderitaan yang akan dialami. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan bentuk jamak serta beratnya hukuman.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: termasuk penyakit pada ususmu
  rationale: Frasa ini merinci penyakit yang disebut sebelumnya. “Termasuk” memperjelas hubungan umum-khusus tanpa mengubah ב menjadi makna separatif, sedangkan “pada ususmu” merupakan ungkapan medis yang wajar.
- source_word: מֵעֶיךָ
  choice: ususmu
  rationale: מֵעֶה menunjuk organ-organ dalam, khususnya usus. “Usus” jelas dan alami dalam konteks penyakit ini, sementara keluasan makna Ibrani dicatat dalam catatan kaki.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: sampai ususmu keluar
  rationale: Terjemahan ini mempertahankan gambaran langsung dan mengerikan dari verba יצא, tanpa memperhalus akibat penyakit tersebut.
- source_word: מִן הַחֹלִי
  choice: akibat penyakit itu
  rationale: 'Preposisi מן di sini menyatakan sebab: keluarnya usus merupakan akibat penyakit tersebut.'
- source_word: יָמִים עַל יָמִים
  choice: hari demi hari
  rationale: Ungkapan harfiah “hari-hari di atas hari-hari” menyatakan proses yang terus berlangsung dari hari ke hari; “hari demi hari” adalah padanan Indonesia yang alami.
