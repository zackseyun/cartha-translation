revisions:
- from: Sebaliknya, engkau telah mengikuti jalan raja-raja Israel dan membuat Yehuda serta penduduk Yerusalem berzina[a], seperti keluarga Ahab membuat mereka berzina. Engkau juga telah membunuh saudara-saudaramu dari keluarga ayahmu, yang lebih baik daripada engkau.[b]
