  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: id
  text: Sebaliknya, engkau telah mengikuti jalan raja-raja Israel dan membuat Yehuda serta penduduk Yerusalem berlaku seperti pelacur[a], seperti keluarga Ahab[b] membuat mereka berlaku seperti pelacur. Engkau juga telah membunuh saudara-saudaramu dari keluarga ayahmu, yang lebih baik daripada engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membuat Yehuda dan penduduk Yerusalem berlaku seperti pelacur.” Ini adalah metafora profetis untuk ketidaksetiaan terhadap perjanjian dengan Allah, yang sering terwujud dalam penyembahan berhala.
    reason: lexical_alternative
  - marker: b
    text: “Keluarga Ahab” mengacu pada wangsa atau dinasti Ahab yang berkuasa.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: engkau telah mengikuti jalan
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang 'jalan' sebagai pola hidup, tetapi memakai susunan yang wajar dalam bahasa Indonesia modern.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: raja-raja Israel
  rationale: Konstruksi genitif diterjemahkan langsung karena perbedaan historis antara kerajaan Israel dan Yehuda penting dalam konteks.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: membuat Yehuda serta penduduk Yerusalem berzina
  rationale: Bentuk verba bersifat kausatif dan memakai akar זנה. 'Berzina' mempertahankan metafora profetis yang tajam tanpa mempersempit maknanya hanya menjadi penyembahan berhala atau ketidaksetiaan.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: seperti keluarga Ahab membuat mereka berzina
  rationale: Pengulangan 'membuat ... berzina' mencerminkan pengulangan akar זנה dan menjaga kesejajaran dengan klausa sebelumnya. 'Keluarga Ahab' dalam konteks mencakup wangsa pemerintahannya.
- source_word: וְגַם
  choice: juga
  rationale: Partikel aditif menambahkan pembunuhan saudara sebagai dakwaan berikutnya.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: saudara-saudaramu dari keluarga ayahmu
  rationale: Terjemahan ini menyatakan bahwa saudara-saudara itu merupakan anggota keluarga atau rumah ayahnya, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: yang lebih baik daripada engkau
  rationale: Mempertahankan perbandingan moral atau pribadi dalam teks tanpa menambahkan kualifikasi yang tidak dinyatakan.
- source_word: הָרָגְתָּ
  choice: telah membunuh
  rationale: Dalam konteks pembantaian saudara secara sengaja, 'membunuh' merupakan padanan Indonesia yang langsung dan tidak memerlukan penambahan rincian.
theological_decisions:
- issue: Daya metaforis זנה dalam konteks kemurtadan kerajaan
  choice: Mempertahankan bahasa 'berzina' dalam teks dan menjelaskan metafora ketidaksetiaan perjanjian dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai 'menjadi tidak setia' atau 'melakukan penyembahan berhala'.
  rationale: Akar Ibrani memakai citra seksual sebagai metafora profetis. Menggantikannya dengan 'penyembahan berhala' akan mempersempit ungkapan, sedangkan tanpa catatan pembaca modern dapat memahaminya semata-mata secara harfiah.
- issue: Makna בֵּית אַחְאָב
  choice: keluarga Ahab
  alternative: wangsa Ahab
  rationale: '''Keluarga'' dapat dipahami pembaca umum dan tetap memungkinkan arti rumah tangga sekaligus dinasti; catatan kaki menerangkan fungsi dinastisnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' dipakai karena teguran ditujukan langsung kepada seorang raja. Metafora sumber dipertahankan, sementara catatan kaki mencegah pembacaan yang terlalu sempit.
