  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: id
  text: Namun, Yahweh tidak berkenan memusnahkan keluarga Daud demi perjanjian yang telah dibuat-Nya dengan Daud, dan sebagaimana yang telah Ia katakan, bahwa Ia akan memberikan sebuah pelita[a] kepada Daud dan anak-anaknya sepanjang masa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terang”. Dalam konteks kerajaan, metafora Ibrani ini kemungkinan menunjuk pada kelangsungan garis keturunan atau pemerintahan Daud.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sepanjang segala hari”; dapat juga diterjemahkan “selama-lamanya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Namun, ... tidak berkenan
  rationale: אָבָה menyatakan kemauan atau persetujuan, bukan sekadar keinginan. Dalam konteks ini, “tidak berkenan” menyampaikan keputusan kehendak Yahweh secara alami dan bermartabat; “Namun” menangkap hubungan pertentangan dengan penghukuman sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְהַשְׁחִית
  choice: memusnahkan
  rationale: Bentuk kausatif שׁחת di sini menunjuk pada penghancuran keluarga atau garis kerajaan Daud secara menyeluruh.
- source_word: בֵּית דָּוִיד
  choice: keluarga Daud
  rationale: “Keluarga Daud” mempertahankan idiom rumah tangga/garis keluarga dan dapat mencakup wangsa kerajaan tanpa menggantinya dengan istilah interpretatif “dinasti”.
- source_word: לְמַעַן הַבְּרִית
  choice: demi perjanjian
  rationale: לְמַעַן menyatakan alasan sekaligus pertimbangan yang menjadi dasar tindakan; “demi” ringkas dan alami dalam bahasa Indonesia.
- source_word: כָּרַת ... לְדָוִיד
  choice: yang telah dibuat-Nya dengan Daud
  rationale: Ungkapan harfiah “memotong perjanjian” dialihkan menjadi idiom Indonesia “membuat perjanjian”; “dengan Daud” menyatakan pihak dalam relasi perjanjian.
- source_word: וְכַאֲשֶׁר אָמַר
  choice: dan sesuai dengan firman-Nya
  rationale: Terjemahan ini mempertahankan hubungan antara tindakan Yahweh dan perkataan-Nya terdahulu tanpa mempersempit אָמַר menjadi “berjanji”.
- source_word: לָתֵת לוֹ נִיר וּלְבָנָיו
  choice: Ia akan memberikan sebuah pelita kepada Daud dan anak-anaknya
  rationale: “Pelita” mempertahankan metafora נִיר bagi kelangsungan garis dan pemerintahan Daud. Nama “Daud” dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia, sedangkan “anak-anaknya” mengikuti bentuk sumber dan tidak langsung menafsirkannya sebagai seluruh keturunan.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Ungkapan ini menyampaikan keberlangsungan “segala hari” dengan bahasa Indonesia yang wajar tanpa secara diam-diam menetapkan satu penafsiran metafisik atas durasinya.
theological_decisions:
- issue: Metafora dinasti נִיר dalam konteks perjanjian Daud
  choice: pelita
  alternative: terang; dinasti; garis keturunan
  rationale: “Pelita” mempertahankan citra teks dan kaitan antarteksnya. Makna kelangsungan garis atau pemerintahan Daud tidak dimasukkan langsung ke teks utama agar metafora dan ketegangan teologisnya tetap terbuka.
- issue: Cakupan waktu כָּל הַיָּמִים
  choice: sepanjang masa
  alternative: selama-lamanya; untuk segala hari
  rationale: “Sepanjang masa” alami dan tetap dekat dengan gagasan durasi berkelanjutan, sedangkan catatan kaki mencantumkan bentuk yang lebih harfiah serta kemungkinan terjemahan yang lebih tegas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan antara perjanjian, firman Yahweh, dan kelangsungan keluarga Daud. Nama ilahi “Yahweh” dipertahankan, dan metafora “pelita” tidak diratakan menjadi penjelasan dinastis.
