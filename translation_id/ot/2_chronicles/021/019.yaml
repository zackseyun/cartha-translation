  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: id
  text: Setelah beberapa waktu berlalu, ketika genap dua tahun, ususnya keluar[a] akibat penyakitnya, dan ia mati akibat berbagai penyakit berat. Rakyatnya tidak mengadakan pembakaran[b] baginya seperti pembakaran bagi para leluhurnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani ini menunjuk organ-organ dalamnya dan dapat juga diterjemahkan “isi perutnya keluar”.
    reason: lexical_alternative
  - marker: b
    text: “Pembakaran” ini kemungkinan merupakan penghormatan dalam upacara pemakaman, misalnya pembakaran rempah-rempah, bukan pembakaran jenazah.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: Setelah beberapa waktu berlalu
  rationale: Ungkapan Ibrani ini menandai berlalunya suatu jangka waktu yang tidak ditentukan; terjemahan idiomatis ini alami dalam bahasa Indonesia.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: ketika genap dua tahun
  rationale: Frasa ini menunjuk saat berakhirnya masa dua tahun dan diterjemahkan secara ringkas tanpa menghilangkan nilai waktunya.
- source_word: מֵעָיו / יָצְאוּ מֵעָיו
  choice: ususnya keluar
  rationale: מֵעָיו menunjuk organ-organ dalam, khususnya usus, sedangkan יָצְאוּ mempertahankan arti harfiahnya, 'keluar'. Ungkapan ini tidak memperhalus gambaran fisik yang mengerikan dalam teks.
- source_word: עִם חָלְיוֹ
  choice: akibat penyakitnya
  rationale: Walaupun עִם biasanya berarti 'dengan', dalam konteks ini frasa tersebut menyatakan keadaan yang menyertai atau sebab; 'akibat' menghasilkan bahasa Indonesia yang wajar.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: karena penyakit-penyakit yang parah
  rationale: Bentuk jamak dan tingkat kegawatan penyakit dipertahankan. Preposisi בְּ dalam konteks kematian dinyatakan secara alami dengan 'karena'.
- source_word: שְׂרֵפָה
  choice: pembakaran
  rationale: Pilihan ini tetap transparan terhadap istilah Ibrani dan tidak menentukan objek yang dibakar; catatan kaki menjelaskan kemungkinan fungsi ritusnya.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: seperti pembakaran bagi para leluhurnya
  rationale: Kata אֲבֹתָיו merujuk para pendahulu atau leluhur raja. Preposisi 'bagi' menghindari kesan bahwa tubuh merekalah yang pasti dibakar.
theological_decisions:
- issue: Sifat שְׂרֵפָה dalam konteks pemakaman raja
  choice: Mempertahankan 'pembakaran' dalam teks dan menjelaskan bahwa kemungkinan besar ini merupakan penghormatan pemakaman, bukan kremasi jenazah.
  alternative: Kremasi atau ritus pembakaran yang sama sekali tidak ditentukan.
  rationale: Konteks Tawarikh menyoroti penghormatan yang diberikan kepada raja-raja terdahulu tetapi tidak diberikan kepada Yoram. Namun, kata Ibraninya sendiri hanya menyebut 'pembakaran', sehingga kepastian yang melebihi teks dihindari.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Gambaran medis yang keras dipertahankan, sedangkan istilah ritus pemakaman dibiarkan cukup terbuka dan dijelaskan dalam catatan kaki.
