  source_fidelity: 'Makna pokok draft sesuai dengan teks Ibrani: sesudah semua itu, Yahweh menjadi pelaku langsung yang menimpakan penyakit pada bagian dalam tubuh/usus Yoram, dan penyakit itu tanpa kesembuhan. Namun, “menyerang ususnya dengan penyakit” agak janggal dalam bahasa Indonesia dan dapat terdengar seolah-olah usus, bukan orangnya, yang menjadi objek tindakan langsung.'
  naturalness: “Yahweh menimpanya dengan penyakit pada ususnya” lebih idiomatis dalam bahasa Indonesia modern sambil tetap mempertahankan Yahweh sebagai pelaku langsung dan usus sebagai lokasi penyakit.
  terminology: “Yahweh,” “ususnya,” dan “penyakit yang tidak dapat disembuhkan” tepat untuk register baku dan arti leksikal konteks ini. Catatan kaki perlu menghindari kesan temporal yang terlalu kuat dari “hingga”; frasa Ibrani menyatakan tidak adanya kesembuhan/remedi.
