base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: id
  text: Sesudah semua itu, Yahweh menimpanya dengan penyakit pada ususnya yang tidak dapat disembuhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanpa kesembuhan”; secara harfiah, “tanpa ada kesembuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל זֹאת
  choice: Sesudah semua itu
  rationale: Ungkapan ini menandai urutan waktu dan merangkum seluruh peristiwa sebelumnya. Konjungsi וְ tidak perlu diterjemahkan tersendiri karena hubungan naratifnya sudah wajar dalam bahasa Indonesia.
- source_word: נְגָפוֹ
  choice: menyerang ...-nya
  rationale: Kata kerja ini menyatakan tindakan menghantam atau menimpakan tulah. 'Menyerang' mempertahankan tindakan langsung Yahweh tanpa memberi rincian yang tidak terdapat dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּמֵעָיו
  choice: ususnya
  rationale: מֵעֶה dalam konteks penyakit jasmani menunjuk pada isi perut, terutama usus. 'Ususnya' jelas, alami, dan sesuai dengan perkembangan penyakit dalam konteks dekat.
- source_word: לָחֳלִי
  choice: dengan penyakit
  rationale: Frasa ini menyatakan sarana atau keadaan penyakit yang ditimpakan kepadanya.
- source_word: לְאֵין מַרְפֵּא
  choice: yang tidak dapat disembuhkan
  rationale: Terjemahan ini mengungkapkan secara alami bahwa penyakit tersebut tidak memiliki kesembuhan, sambil mempertahankan keputusasaan yang dinyatakan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan sebuah gelar.
- issue: Yahweh sebagai pelaku langsung penyakit itu
  choice: Yahweh menyerang ususnya dengan penyakit
  alternative: Ia terkena penyakit pada ususnya
  rationale: Bentuk Ibrani secara eksplisit menempatkan Yahweh sebagai subjek tindakan. Terjemahan tidak mengaburkan peranan langsung ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Ususnya' dipilih daripada ungkapan tradisional seperti 'isi perutnya' agar rujukan anatomis jelas. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
