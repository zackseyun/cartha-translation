  - severity: low
    issue: Catatan kaki “hingga tidak ada kesembuhan” kurang jelas sebagai padanan alternatif.
    rationale: לְאֵין מַרְפֵּא terutama menyatakan ketiadaan kesembuhan atau remedi, bukan urutan waktu. “Tanpa kesembuhan” menyampaikan alternatif tersebut dengan lebih jelas.
  revised_text: Sesudah semua itu, Yahweh menimpanya dengan penyakit pada ususnya yang tidak dapat disembuhkan.[a]
