source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: id
  text: Sesungguhnya[a], Yahweh akan segera menghantam rakyatmu, anak-anak lelakimu, istri-istrimu, dan seluruh hartamu dengan tulah besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lihatlah, Yahweh sedang menghantam ... dengan tulah besar.” Partisip Ibrani dapat menyatakan tindakan yang segera terjadi, sedang berlangsung, atau masa depan biasa; מַגֵּפָה dapat berarti wabah, tulah, atau pukulan berat yang ditimpakan.'
    reason: Menjaga ambiguitas aspek partisip נֹגֵף dan rentang makna מַגֵּפָה.
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Kata ini mengundang perhatian sekaligus memberi penekanan khidmat pada pengumuman hukuman; dalam konteks nubuat ini, “Sesungguhnya” lebih wajar dan bermartabat daripada seruan percakapan seperti “Lihatlah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara langsung terdapat dalam teks Ibrani.
- source_word: נֹגֵף
  choice: akan segera menimpakan
  rationale: Partisip dengan הִנֵּה dalam wacana nubuat dapat menyatakan tindakan yang sudah di ambang pelaksanaan. Pilihan ini mempertahankan sifat aktif serta nuansa waktu yang dekat.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: tulah besar
  rationale: מַגֵּפָה dapat menunjuk pada wabah atau pukulan berat yang ditimpakan sebagai hukuman. “Tulah besar” alami dalam ragam Alkitab Indonesia dan tetap cukup luas untuk konteks ini.
- source_word: בְּעַמֶּךָ
  choice: kepada rakyatmu
  rationale: Preposisi ב menandai pihak yang terkena pukulan. “Rakyatmu” sesuai dengan konteks perkataan kepada seorang raja dan membedakannya dari ungkapan umum “umatmu”.
- source_word: וּבְבָנֶיךָ
  choice: anak-anak lelakimu
  rationale: בנים berbentuk jamak maskulin dan di sini menunjuk kepada putra-putra Yoram; terjemahan ini mempertahankan kekhususan gender sumber.
- source_word: וּבְנָשֶׁיךָ
  choice: istri-istrimu
  rationale: Dalam konstruksi posesif ini, נָשִׁים berarti para istri, bukan perempuan secara umum.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: dan seluruh harta milikmu
  rationale: רְכוּשׁ mencakup harta, barang, atau kekayaan yang dimiliki; “seluruh harta milikmu” jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut nama perjanjian ilahi secara langsung; bentuk “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya waktu partisip נֹגֵף dalam pengumuman nubuat
  choice: masa depan dekat (“akan segera menimpakan”)
  alternative: tindakan kini (“sedang menimpakan”) atau masa depan biasa (“akan menimpakan”)
  rationale: Konstruksi הִנֵּה dengan partisip lazim menyajikan tindakan sebagai segera atau sudah di ambang terjadi. Catatan kaki mempertahankan kemungkinan lain yang memang terbuka secara gramatikal.
- issue: Cakupan makna מַגֵּפָה
  choice: tulah
  alternative: wabah atau pukulan berat
  rationale: Kata Ibrani dapat menyatakan wabah maupun pukulan hukuman ilahi yang berat. “Tulah” mempertahankan cakupan hukuman tersebut tanpa memastikan bahwa yang dimaksud hanya penyakit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Sesungguhnya” mempertahankan tekanan profetis tanpa terdengar terlalu percakapan; “rakyatmu” dipilih karena sapaan diarahkan kepada raja; “tulah” menjaga nuansa hukuman ilahi sekaligus tidak mempersempit makna menjadi penyakit saja.
