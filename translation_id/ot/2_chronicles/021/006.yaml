  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: id
  text: Ia menempuh jalan raja-raja Israel, seperti yang telah dilakukan oleh keluarga Ahab, sebab anak perempuan Ahab adalah istrinya, dan ia melakukan apa yang jahat di mata Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Ia menempuh jalan
  rationale: Ungkapan ini menggambarkan perilaku atau pola hidup. “Menempuh jalan” mempertahankan metafora Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: raja-raja Israel
  rationale: Terjemahan langsung yang menunjuk kepada para penguasa kerajaan Israel utara sebagai pola perilaku.
- source_word: בֵּית אַחְאָב
  choice: keluarga Ahab
  rationale: בַּיִת dalam konteks kerajaan dapat berarti keluarga, rumah tangga, atau wangsa. “Keluarga Ahab” alami bagi pembaca modern dan tetap membuka pengertian dinasti.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan yang menjelaskan keterkaitan perilaku sang raja dengan keluarga Ahab.
- source_word: בַּת אַחְאָב
  choice: anak perempuan Ahab
  rationale: Ayat ini memakai sebutan berdasarkan hubungan keluarga dan tidak menyebut nama perempuan tersebut, sehingga bentuk itu dipertahankan.
- source_word: הָיְתָה לּוֹ אִשָּׁה
  choice: adalah istrinya
  rationale: Konstruksi ini menyatakan hubungan perkawinan yang sudah ada, bukan bahwa perkawinan baru berlangsung pada saat itu.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Bentuk הָרַע dengan artikel dinyatakan secara jelas sebagai “apa yang jahat,” dekat dengan susunan dan makna teks Ibrani.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan evaluatif Ibrani yang umum dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan sesuai dengan lapisan konsultasi yang diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora perjalanan dalam ungkapan moral dipertahankan melalui “menempuh jalan”; kalimat tetap sederhana dan mudah dipahami.
