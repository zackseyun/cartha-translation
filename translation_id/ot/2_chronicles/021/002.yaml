  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: id
  text: 'Ia mempunyai saudara-saudara laki-laki, putra-putra Yosafat: Azarya, Yehiel, Zakharia, Azaryahu[a], Mikhael, dan Sefaca. Mereka semua adalah putra-putra Yosafat, raja Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama keempat dieja berbeda dalam bahasa Ibrani dari nama pertama, Azarya; bentuk “Azaryahu” dipakai untuk mempertahankan perbedaan itu.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “raja Israel”. Secara historis Yosafat lebih umum disebut raja Yehuda; di sini Tawarikh mungkin memakai “Israel” dalam arti yang lebih luas bagi umat perjanjian.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֽ/וֹ
  choice: Ia mempunyai
  rationale: Ungkapan Ibrani yang secara harfiah berarti “dan baginya ada” merupakan idiom kepemilikan; “ia mempunyai” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: אַחִים
  choice: saudara-saudara
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk kepada saudara laki-laki tokoh yang dibicarakan. Bentuk bahasa Indonesia ini wajar, sementara frasa berikutnya menjelaskan bahwa mereka adalah anak-anak Yosafat.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: anak-anak Yosafat
  rationale: Mempertahankan hubungan keturunan yang dinyatakan oleh konstruksi Ibrani dan gaya silsilah ayat ini.
- source_word: עֲזַרְיָה / וַעֲזַרְיָהוּ
  choice: Azarya / Azaryahu
  rationale: Dua bentuk nama yang berbeda dalam teks Ibrani dipertahankan agar kedua saudara itu tidak tampil dengan ejaan yang identik.
- source_word: וִֽיחִיאֵל
  choice: Yehiel
  rationale: Transliterasi nama pribadi yang sesuai dengan bentuk Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: וּזְכַרְיָהוּ
  choice: Zakharia
  rationale: Menggunakan bentuk nama Alkitab yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וּמִיכָאֵל
  choice: Mikhael
  rationale: Transliterasi yang mempertahankan unsur bunyi nama Ibrani dan sesuai dengan ejaan bahasa Indonesia.
- source_word: וּשְׁפַטְיָהוּ
  choice: Sefaca
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Padanan alami bagi ungkapan rangkuman Ibrani setelah daftar nama.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Mengikuti secara langsung teks Ibrani tanpa menggantinya dengan “raja Yehuda” demi penyelarasan historis.
theological_decisions:
- issue: Gelar Yosafat sebagai מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  alternative: raja Yehuda
  rationale: Teks sumber secara eksplisit berbunyi “raja Israel”. Meskipun Yosafat biasanya dikenal sebagai raja Yehuda, terjemahan tidak boleh menghapus kemungkinan bahwa Tawarikh memakai “Israel” dalam arti yang lebih luas bagi umat perjanjian atau kerajaan Daud.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan daftar serta pengulangan hubungan keturunan dipertahankan, sedangkan idiom kepemilikan Ibrani diterjemahkan secara alami.
