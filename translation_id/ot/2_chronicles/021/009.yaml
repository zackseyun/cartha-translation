  text: וַ/יַּֽעֲבֹ֤ר יְהוֹרָם֙ עִם שָׂרָ֔י/ו וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַ/יְהִי֙ קָ֣ם לַ֔יְלָה וַ/יַּ֗ךְ אֶת אֱדוֹם֙ הַ/סּוֹבֵ֣ב אֵלָ֔י/ו וְ/אֵ֖ת שָׂרֵ֥י הָ/רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: id
  text: Maka Yoram menyeberang bersama para panglimanya dan seluruh pasukan kereta bersamanya. Pada malam hari ia bangkit dan menyerang orang Edom yang mengepungnya, serta para panglima pasukan kereta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para panglima kereta.” Frasa Ibrani ini dapat secara khusus menunjuk kepada para perwira yang membawahi pasukan kereta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: menyeberang
  rationale: Kata kerja עבר berarti melewati atau menyeberang. Pilihan ini mempertahankan gambaran gerak dalam teks tanpa menentukan tujuan atau siasat yang tidak disebutkan.
- source_word: שָׂרָיו
  choice: para panglimanya
  rationale: Dalam konteks militer ini, שַׂר menunjuk kepada para pemimpin atau perwira; 'panglima' alami dan sesuai dengan penyebutan pasukan kereta.
- source_word: הָרֶכֶב
  choice: pasukan kereta
  rationale: רֶכֶב dapat merujuk secara kolektif kepada kereta-kereta perang atau kesatuan kereta. 'Pasukan kereta' menyampaikan makna kolektifnya secara alami.
- source_word: וַיְהִי קָם לַיְלָה
  choice: Pada malam hari ia bangkit
  rationale: Ungkapan ini menyatakan tindakan Yoram pada malam hari. Terjemahan ini mempertahankan urutan narasi tanpa membuat formulanya terasa kaku dalam bahasa Indonesia.
- source_word: וַיַּךְ
  choice: menyerang
  rationale: נכה berarti memukul atau menyerang. Dalam konteks pertempuran, 'menyerang' wajar dan tidak menyatakan bahwa Yoram menang atau mengalahkan mereka.
- source_word: אֱדוֹם
  choice: orang Edom
  rationale: Nama bangsa ini secara kontekstual mengacu kepada pasukan atau orang-orang Edom yang mengepung Yoram.
- source_word: הַסּוֹבֵב אֵלָיו
  choice: yang mengepungnya
  rationale: Partisip dari סבב menggambarkan Edom berada mengelilingi Yoram; 'mengepungnya' menyampaikan keadaan militer itu dengan jelas.
- source_word: שָׂרֵי הָרֶכֶב
  choice: para panglima pasukan kereta
  rationale: Frasa ini paling alami dipahami sebagai para pemimpin yang membawahi kesatuan kereta, sambil tetap mempertahankan hubungan konstruksi Ibraninya.
