base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: id
  text: Yosafat mendapat perhentian bersama leluhurnya[a] dan dimakamkan bersama leluhurnya di Kota Daud. Kemudian Yoram, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya”; ungkapan Ibrani untuk kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan Ibrani ini merupakan idiom kematian dalam catatan kerajaan. Terjemahan ini mempertahankan gambaran beristirahat tanpa menghasilkan ungkapan Indonesia yang janggal seperti 'tidur bersama nenek moyangnya'.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Padanan pasif yang alami dan bermartabat untuk tindakan penguburan.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Mempertahankan nama tempat alkitabiah yang lazim dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus pergantian takhta ini, bentuk tersebut secara alami menyatakan bahwa Yoram naik menjadi raja, bukan sekadar menjelaskan lamanya pemerintahan.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Menyampaikan suksesi kerajaan secara jelas dan alami, dekat dengan arti 'di tempatnya'.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: יְהוֹרָם
  choice: Yoram
  rationale: Mengikuti bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia untuk יְהוֹרָם.
