  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: id
  text: Pada zamannya, Edom memberontak dan melepaskan diri dari kekuasaan Yehuda, lalu mengangkat seorang raja untuk memerintah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian ini berbunyi “memberontak dari bawah tangan Yehuda”; maksudnya, Edom melepaskan diri dari kekuasaan Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Pada zamannya
  rationale: Ungkapan waktu ini menunjuk pada masa pemerintahan Yoram; bentuk ini alami dalam bahasa Indonesia sekaligus dekat dengan ungkapan Ibrani.
- source_word: פָּשַׁע
  choice: memberontak
  rationale: Dalam konteks politik, verba ini menyatakan pemberontakan atau pemutusan ketundukan, bukan pelanggaran moral secara umum.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Mengikuti bentuk baku nama tempat dan bangsa ini dalam bahasa Indonesia.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: melepaskan diri dari kekuasaan Yehuda
  rationale: Ungkapan Ibrani harfiah 'dari bawah tangan Yehuda' merupakan idiom bagi keadaan di bawah kuasa atau pemerintahan Yehuda. Gabungan dengan 'memberontak' menyampaikan baik tindakan maupun hasil pemisahannya secara alami.
- source_word: וַיַּמְלִיכוּ
  choice: lalu mengangkat
  rationale: Bentuk kausatif verba מלך berarti menjadikan atau menetapkan seseorang sebagai raja; 'mengangkat' adalah ungkapan Indonesia yang wajar untuk penobatan atau penetapan raja.
- source_word: עֲלֵיהֶם
  choice: atas mereka sendiri
  rationale: Sufiks orang ketiga jamak merujuk kepada orang Edom; 'mereka sendiri' memperjelas bahwa raja itu diangkat untuk memerintah mereka.
- source_word: מֶלֶךְ
  choice: seorang raja
  rationale: Nomina ini tidak tentu dalam konteks tersebut, sehingga 'seorang raja' merupakan padanan Indonesia yang alami.
