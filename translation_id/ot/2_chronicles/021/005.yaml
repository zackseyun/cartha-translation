base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/005.yaml
  text: Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: id
  text: Yoram berumur tiga puluh dua tahun ketika menjadi raja, dan ia memerintah selama delapan tahun di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: berumur tiga puluh dua tahun
  rationale: Dalam rumus usia Ibrani, בֶּן yang diikuti bilangan dan שָׁנָה menyatakan usia. Ungkapan ini diterjemahkan dengan idiom Indonesia yang alami, bukan secara harfiah sebagai 'anak laki-laki dari tiga puluh dua tahun'.
- source_word: יְהוֹרָם
  choice: Yoram
  rationale: Bentuk nama Ibrani יְהוֹרָם dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Preposisi בְּ pada infinitif construct dengan sufiks orang ketiga tunggal menyatakan waktu naik takhta; 'ketika menjadi raja' menyampaikan hubungan temporal itu secara alami.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: selama delapan tahun
  rationale: Frasa ini menyatakan lamanya masa pemerintahan. Penambahan 'selama' membuat fungsi duratifnya jelas dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja מָלַךְ berarti memerintah sebagai raja. 'Memerintah' merupakan padanan Indonesia yang alami dalam rumus masa pemerintahan.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi בִּ menyatakan lokasi, yaitu Yerusalem sebagai tempat atau pusat pemerintahannya.
