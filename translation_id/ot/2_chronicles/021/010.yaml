id: 2CH.21.10
reference: 2 Chronicles 21:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: id
  text: Maka Edom memberontak[a] dan melepaskan diri dari kekuasaan Yehuda[b] sampai hari ini. Pada waktu itu Libna juga memberontak dan melepaskan diri dari kekuasaan Yoram, karena[c] Yoram telah meninggalkan Yahweh, Allah para leluhurnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berontak” atau “memisahkan diri.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari bawah tangan Yehuda” dan “dari bawah tangannya”; ini adalah ungkapan untuk terbebas dari pemerintahan atau kendali seseorang.
    reason: cultural_note
  - marker: c
    text: Klausa sebab ini dapat menjelaskan kesusahan Yoram secara umum atau, secara lebih khusus, pemberontakan Libna.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: memberontak
  rationale: Dalam konteks politik, פשע menyatakan pemberontakan terhadap penguasa. “Memberontak” mempertahankan kekuatan maknanya dan wajar dalam bahasa Indonesia modern.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: melepaskan diri dari kekuasaan / kekuasaannya
  rationale: Ungkapan Ibrani harfiahnya berarti keluar “dari bawah tangan” seseorang, yaitu terbebas dari pemerintahan atau kendalinya. Ungkapan “melepaskan diri dari kekuasaan” menyampaikan arti idiom itu secara alami.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama kerajaan dan suku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Mempertahankan rumus waktu Ibrani yang menunjukkan bahwa keadaan tersebut masih berlangsung pada masa penulis.
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai hubungan waktu dengan jelas dan alami.
- source_word: לִבְנָה
  choice: Libna
  rationale: Transliterasi baku nama tempat tersebut dalam bahasa Indonesia.
- source_word: כִּי
  choice: karena
  rationale: Menandai alasan atau sebab secara jelas, tanpa menentukan apakah alasannya hanya menerangkan pemberontakan Libna atau seluruh rangkaian kesusahan Yoram.
- source_word: עָזַב
  choice: telah meninggalkan
  rationale: Menyatakan tindakan meninggalkan Yahweh dengan bobot relasional dan teologis yang memadai, tetapi tetap memakai bahasa Indonesia masa kini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Allah para leluhurnya
  rationale: Menyampaikan bahwa Yahweh adalah Allah yang disembah para pendahulunya; “leluhur” lebih alami dan cakupannya lebih tepat dalam bahasa Indonesia modern daripada “bapa-bapanya”.
theological_decisions:
- issue: Cakupan alasan bagi pemberontakan
  choice: Klausa “karena ia telah meninggalkan Yahweh” dibiarkan pada posisinya sehingga dapat dipahami sebagai penjelasan teologis atas kesusahan Yoram dalam rangkaian ini.
  alternative: Klausa tersebut dapat dipahami lebih sempit sebagai alasan khusus bagi pemberontakan Libna.
  rationale: Sintaksis tidak memastikan cakupannya secara mutlak. Terjemahan tidak menambahkan kata yang akan membatasi alasan itu hanya pada Libna atau memperluasnya secara tegas kepada kedua pemberontakan.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. “Maka” mempertahankan alur naratif, “pun” menunjukkan peristiwa tambahan, dan idiom Ibrani tentang “tangan” dijelaskan secara alami sebagai kekuasaan. Semua penanda catatan kaki ditempatkan dalam teks utama.
