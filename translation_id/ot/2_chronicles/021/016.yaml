  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: id
  text: Lalu Yahweh membangkitkan semangat orang Filistin dan orang Arab yang berada di dekat orang Kush untuk melawan Yoram.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menggerakkan” atau “menghasut”. Kata Ibrani ini menyatakan bahwa Yahweh menyebabkan bangsa-bangsa tersebut bangkit untuk memusuhi Yoram.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “yang berada di sisi orang Kush”; juga dapat berarti “yang berada di dekat orang Kush”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: membangkitkan
  rationale: Kata kerja ini menyatakan tindakan Yahweh yang menggugah atau menggerakkan bangsa-bangsa tersebut untuk bertindak melawan Yoram. 'Membangkitkan' alami dalam bahasa Indonesia dan tetap mempertahankan sebab ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: עַל יְהוֹרָם
  choice: untuk melawan Yoram
  rationale: Dalam konteks permusuhan, עַל menyatakan arah tindakan yang menentang Yoram.
- source_word: רוּחַ
  choice: semangat
  rationale: רוּחַ di sini menunjuk pada daya batin atau dorongan yang menggerakkan bangsa-bangsa itu. 'Semangat' mempertahankan citra Ibrani tanpa mempersempitnya menjadi sekadar 'permusuhan'.
- source_word: הַפְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan etnis yang baku dan alami dalam bahasa Indonesia.
- source_word: וְהָעַרְבִים
  choice: orang Arab
  rationale: Sebutan etnis yang lugas; konteks kuno mencegah penyamaan otomatis dengan entitas politik modern.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: yang tinggal di dekat orang Kush
  rationale: Idiom עַל יַד paling wajar dipahami secara geografis sebagai 'di sisi/dekat'. Penambahan 'tinggal' membuat hubungan lokatif itu alami dalam bahasa Indonesia tanpa mengubah makna pokok.
theological_decisions:
- issue: Sebab ilahi dalam bangkitnya bangsa-bangsa yang memusuhi Yoram
  choice: Ayat ini menyatakan bahwa Yahweh secara aktif membangkitkan semangat mereka untuk melawan Yoram.
  alternative: Yahweh hanya mengizinkan permusuhan yang sudah ada untuk muncul.
  rationale: Bentuk kausatif dalam pernyataan Ibrani secara langsung menghubungkan tindakan itu dengan Yahweh. Terjemahan mempertahankan ketegangan teologis tersebut tanpa mengubahnya menjadi izin pasif atau menjelaskan mekanismenya.
- issue: Makna רוּחַ dalam konteks kolektif
  choice: semangat
  alternative: roh; sikap; permusuhan
  rationale: '''Semangat'' dapat menunjuk pada dorongan kolektif yang menggerakkan tindakan sambil tetap mempertahankan keluasan metafora sumber.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan nama ilahi 'Yahweh' dipertahankan. 'Orang Kush' dipilih untuk nama etnis kuno. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
