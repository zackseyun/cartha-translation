base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: id
  text: Ia berumur tiga puluh dua tahun ketika menjadi raja, dan memerintah selama delapan tahun di Yerusalem. Kemudian ia meninggal tanpa dirindukan.[a] Ia dikuburkan di Kota Daud, tetapi tidak di makam para raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ia pergi tanpa keinginan” atau “tanpa kerinduan.” Ungkapan Ibrani ini sulit; dapat berarti bahwa ia pergi tanpa dirindukan atau tanpa disesali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: berumur tiga puluh dua tahun
  rationale: Ungkapan usia Ibrani ini paling wajar disampaikan dengan idiom usia dalam bahasa Indonesia.
- source_word: בְמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Dalam rumus pencatatan pemerintahan, bentuk ini menunjukkan usia pada saat naik takhta.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: memerintah selama delapan tahun
  rationale: Terjemahan alami untuk rumus masa pemerintahan raja.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Pemakaian lokatif yang langsung.
- source_word: וַיֵּלֶךְ
  choice: kemudian ia meninggal
  rationale: Secara harfiah berarti 'ia pergi', tetapi dalam konteks berita kematian merupakan ungkapan halus bagi kematian; 'meninggal' mengomunikasikan acuannya dengan jelas dalam bahasa Indonesia.
- source_word: בְּלֹא חֶמְדָּה
  choice: tanpa seorang pun merasa kehilangan dirinya
  rationale: חֶמְדָּה berkaitan dengan hasrat, kesukaan, atau sesuatu yang berharga. Dalam konteks ini, ungkapan tersebut menyatakan bahwa kematiannya tidak menimbulkan kerinduan atau rasa kehilangan; catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: וַיִּקְבְּרֻהוּ
  choice: ia dikuburkan
  rationale: Bentuk pasif alami dalam bahasa Indonesia menyampaikan verba jamak Ibrani dengan pelaku tak tentu tanpa menambahkan identitas pelaku.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Bentuk baku nama tempat dalam bahasa Indonesia.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: tetapi tidak di makam para raja
  rationale: '''Makam'' sesuai dengan konteks tempat pemakaman kerajaan dan terdengar alami dalam bahasa Indonesia.'
