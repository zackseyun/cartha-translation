  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וַֽ/יַּעֲשׂ֖וּ אֲר֣וֹן אֶחָ֑ד וַֽ/יִּתְּנֻ֛/הוּ בְּ/שַׁ֥עַר בֵּית יְהוָ֖ה חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: id
  text: Lalu raja memberi perintah, dan mereka membuat satu peti[a] dan menempatkannya di luar, di gerbang rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah peti”; secara harfiah, “satu peti”, yang kemungkinan menekankan satu wadah khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: memberi perintah
  rationale: Secara leksikal berarti “berkata”, tetapi dalam konteks tindakan administratif yang segera dilaksanakan, ungkapan ini berfungsi sebagai perintah. “Memberi perintah” menyampaikan daya pragmatisnya dalam bahasa Indonesia yang alami.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung bagi nomina tertentu ini; bahasa Indonesia tidak memakai kata sandang tertentu.
- source_word: וַיַּעֲשׂוּ
  choice: mereka membuat
  rationale: Mempertahankan subjek jamak yang tidak disebutkan secara khusus dan makna umum עשה untuk pembuatan benda.
- source_word: אֲרוֹן אֶחָד
  choice: satu peti
  rationale: אֲרוֹן di sini menunjuk pada wadah atau peti, bukan tabut perjanjian. Angka אֶחָד diterjemahkan secara eksplisit sebagai “satu”, kemungkinan untuk menekankan satu wadah khusus bagi pengumpulan persembahan.
- source_word: וַיִּתְּנֻהוּ
  choice: menempatkannya
  rationale: Dalam konteks memosisikan sebuah benda, נתן bermakna “menaruh/menempatkan”. Bentuk pronominal objeknya dipertahankan dengan “-nya”.
- source_word: בְּשַׁעַר
  choice: di pintu gerbang
  rationale: Preposisi ב menandai lokasi. “Di pintu gerbang” merupakan ungkapan Indonesia yang alami tanpa menetapkan posisi yang lebih terperinci daripada teks sumber.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan formal ini mempertahankan metafora “rumah” bagi tempat ibadah dan nama ilahi yang tertulis dalam teks Ibrani.
- source_word: חוּצָה
  choice: di luar
  rationale: Adverbia ini menunjukkan bahwa peti ditempatkan pada sisi luar; terjemahan tidak menambahkan keterangan lokasi yang tidak dinyatakan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memuat Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna “rumah” dalam בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: Bait Yahweh
  rationale: “Rumah Yahweh” mengikuti bentuk sumber dengan dekat dan tetap dapat dipahami sebagai tempat ibadah dari konteks, tanpa mengganti metafora Ibrani dengan istilah yang lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami dengan “lalu”, sedangkan unsur penting teks Ibrani—terutama “satu peti”, subjek jamak yang tidak ditentukan, lokasi di luar, dan nama Yahweh—dipertahankan.
