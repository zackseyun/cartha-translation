  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: id
  text: Ketika mereka pergi darinya—sebab mereka meninggalkannya dalam keadaan menderita banyak penyakit—para pegawainya bersekongkol melawan dia karena darah anak-anak Yoyada, imam itu[a]. Mereka membunuhnya di tempat tidurnya, lalu ia mati. Ia dikuburkan di Kota Daud, tetapi tidak di makam raja-raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “darah anak-anak Yoyada, imam itu.” Dalam konteksnya, ungkapan ini mungkin secara khusus merujuk kepada “anak Yoyada, imam itu,” yaitu Zakharia (24:20–22).'
    reason: Mempertahankan bentuk jamak dalam teks Ibrani sekaligus menjelaskan kemungkinan rujukan tunggal berdasarkan konteks.
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: Ketika mereka pergi meninggalkannya
  rationale: Konstruksi ב dengan infinitif menyatakan waktu, sedangkan מִמֶּנּוּ menunjukkan gerak menjauh dari Yoas. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan mundurnya pasukan Aram.
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: sebab mereka meninggalkannya dalam keadaan menderita banyak penyakit
  rationale: כִּי dipahami secara kausal. מַחֳלָיִם berbentuk jamak dan mengacu pada penyakit atau penderitaan jasmani; terjemahan mempertahankan unsur jamak tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: para pegawainya bersekongkol melawan dia
  rationale: Hitpael קשר berarti berkomplot atau bersekongkol. Dalam lingkungan istana, עֲבָדָיו paling wajar dipahami sebagai para pegawai atau pejabat kerajaan, bukan semata-mata pelayan rumah tangga.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: karena darah anak-anak Imam Yoyada
  rationale: בִּדְמֵי menyatakan alasan yang berkaitan dengan darah yang ditumpahkan. Bentuk jamak בְּנֵי dipertahankan sesuai Teks Masoret, dan הַכֹּהֵן diterjemahkan sebagai gelar identifikasi yang alami dalam bahasa Indonesia.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: Mereka membunuhnya di tempat tidurnya, lalu ia mati
  rationale: הרג berarti membunuh, dan עַל מִטָּתוֹ menunjukkan lokasi pembunuhan. Kata 'lalu' menyampaikan urutan naratif ו tanpa menghapus pernyataan eksplisit bahwa ia mati.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: Ia dikuburkan di Kota Daud, tetapi tidak di makam raja-raja
  rationale: Bentuk pasif menghindari pengulangan subjek tak tentu dan tetap menyampaikan tindakan penguburan. Kontras וְלֹא dipertahankan dengan 'tetapi tidak', yang menonjolkan bahwa ia tidak memperoleh kehormatan pemakaman kerajaan.
theological_decisions:
- issue: Bentuk jamak 'anak-anak Yoyada' dalam Teks Masoret dibandingkan konteks yang menyebut Zakharia seorang diri
  choice: Mempertahankan bentuk jamak 'anak-anak Imam Yoyada' dalam teks utama
  alternative: anak Imam Yoyada, yaitu Zakharia
  rationale: Sumber Ibrani yang diberikan secara eksplisit memakai bentuk jamak. Konteks 2 Tawarikh 24:20–22 dapat menunjuk khususnya kepada Zakharia, tetapi ketegangan itu tidak boleh diselesaikan diam-diam dengan mengubah teks utama menjadi tunggal.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama diri mengikuti bentuk Indonesia yang lazim: Yoas tersirat sebagai rujukan pronomina, Yoyada, dan Kota Daud. Istilah ''pegawai'' dipilih untuk konteks istana; ''bersekongkol'' menyampaikan tindakan konspiratif secara jelas. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.'
