  source_fidelity: 'Terjemahan dengan tepat menyampaikan urutan dan isi teks Ibrani: pengumpulan para imam dan orang Lewi, perintah pergi ke kota-kota Yehuda, pengumpulan dana dari seluruh Israel, perbaikan rumah Allah, pengulangan tahunan, desakan untuk segera bertindak, dan kegagalan orang Lewi untuk segera bertindak. “Uang” untuk כֶּסֶף didukung catatan yang mempertahankan makna harfiahnya, “perak.”'
