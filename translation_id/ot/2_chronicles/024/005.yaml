source:
  edition: WLC
  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: id
  text: Lalu ia mengumpulkan para imam dan orang Lewi, lalu berkata kepada mereka, “Pergilah ke kota-kota Yehuda dan kumpulkanlah uang[a] dari seluruh Israel untuk memperbaiki rumah Allahmu[b] dari tahun ke tahun. Laksanakanlah hal ini dengan segera.” Namun, orang-orang Lewi tidak segera melaksanakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perak”; perak digunakan sebagai uang.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “untuk memperkuat rumah Allahmu”; dalam konteks ini maksudnya memperbaiki atau memulihkan bangunannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ia mengumpulkan
  rationale: Bentuk wayyiqtol Qal dari קבץ berarti mengumpulkan atau menghimpun orang; pilihan ini wajar dengan objek para imam dan orang Lewi.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Mempertahankan kedua kelompok pelayanan bait secara eksplisit dan berbeda.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: Pergilah ke kota-kota Yehuda
  rationale: Menyampaikan imperatif dan arah tujuan secara alami dalam bahasa Indonesia.
- source_word: וְקִבְצוּ ... כֶּסֶף
  choice: dan kumpulkanlah uang
  rationale: כֶּסֶף secara konkret berarti perak, tetapi lazim berfungsi sebagai alat pembayaran; 'uang' paling jelas dalam konteks pengumpulan dana, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: dari seluruh Israel
  rationale: Mempertahankan cakupan ungkapan Ibrani tanpa mempersempitnya menjadi Yehuda atau menggantinya dengan tafsiran mengenai kelompok tertentu.
- source_word: לְחַזֵּק אֶת בֵּית אֱלֹהֵיכֶם
  choice: untuk memperbaiki rumah Allahmu
  rationale: Dalam konteks bangunan, חזק menunjuk pada penguatan atau perbaikan struktur. 'Rumah Allah' mempertahankan metafora teks Ibrani, sedangkan alternatif harfiah verba dicatat dalam catatan kaki.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: dari tahun ke tahun
  rationale: Ungkapan alami yang menyatakan kegiatan berulang setiap tahun.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: Laksanakanlah hal ini dengan segera
  rationale: Mengungkapkan daya perintah dan urgensi מהר secara idiomatis.
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: Namun, orang-orang Lewi tidak segera melaksanakannya
  rationale: Menggemakan perintah sebelumnya dan mempertahankan kontras naratif melalui pengulangan gagasan 'segera'.
theological_decisions:
- issue: Cakupan 'seluruh Israel'
  choice: Mempertahankan 'dari seluruh Israel'
  alternative: dari seluruh orang Israel; dari seluruh rakyat Yehuda
  rationale: Teks memakai יִשְׂרָאֵל, yang dalam Tawarikh dapat memiliki cakupan umat perjanjian yang luas. Terjemahan tidak mempersempit cakupan tersebut secara diam-diam.
- issue: Sebutan bangunan kudus
  choice: rumah Allahmu
  alternative: Bait Allahmu
  rationale: Pilihan ini mempertahankan ungkapan formal בֵּית אֱלֹהֵיכֶם dan tidak mengganti metafora 'rumah' dengan istilah yang lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'orang Lewi' dipilih sebagai sebutan alami bagi anggota suku Lewi. Pengulangan gagasan 'segera' dipertahankan untuk mencerminkan permainan verbal dalam teks Ibrani.
