  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: id
  text: Lalu semua pejabat dan seluruh rakyat bersukacita. Mereka membawa sumbangan mereka dan melemparkannya ke dalam peti itu sampai selesai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai peti itu penuh.” Ungkapan Ibrani secara lebih umum berarti “sampai selesai” atau “sampai tuntas,” tanpa menyebutkan secara eksplisit apa yang selesai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: bersukacita
  rationale: Kata kerja שׂמח menyatakan sukacita atau kegembiraan. “Bersukacita” mempertahankan daya aktifnya dan sesuai dengan ragam naratif yang bermartabat.
- source_word: כָל הַשָּׂרִים
  choice: semua pejabat
  rationale: שָׂרִים menunjuk kepada para pemegang wewenang atau pejabat. “Pejabat” lebih jelas bagi pembaca modern daripada “para pangeran,” yang dapat disalahpahami sebagai putra-putra raja.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: Terjemahan langsung yang mempertahankan cakupan kolektif ungkapan Ibrani.
- source_word: וַיָּבִיאוּ
  choice: mereka membawa sumbangan mereka
  rationale: Kata kerjanya berarti “mereka membawa,” sedangkan objeknya tersirat. Dalam konteks pengumpulan dana untuk perbaikan rumah TUHAN, “sumbangan mereka” membuat kalimat wajar dalam bahasa Indonesia tanpa menambahkan gagasan di luar konteks langsung.
- source_word: וַיַּשְׁלִיכוּ
  choice: melemparkannya
  rationale: שלך biasanya berarti “melemparkan.” Pilihan ini mempertahankan gambaran konkret tindakan memasukkan sumbangan ke dalam peti, alih-alih melemahkannya menjadi sekadar “menaruh.”
- source_word: לָאָרוֹן
  choice: ke dalam peti itu
  rationale: אָרוֹן dapat berarti peti, kotak, atau tabut. Di sini yang dimaksud ialah wadah pengumpulan sumbangan, bukan tabut perjanjian.
- source_word: עַד לְכַלֵּה
  choice: sampai selesai
  rationale: Bentuk dari כלה menyatakan tercapainya akhir atau penyelesaian, tetapi teks tidak menyebutkan secara eksplisit apa yang selesai. Terjemahan ini mempertahankan ketidakjelasan tersebut; kemungkinan bahwa petinya menjadi penuh dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. “Seluruh rakyat” dipilih sebagai padanan kolektif yang alami, sedangkan “melemparkannya” mempertahankan kekuatan konkret kata kerja Ibrani. Penanda catatan kaki ditempatkan pada frasa yang memang dijelaskannya.
