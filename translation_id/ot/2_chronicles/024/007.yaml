  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: id
  text: Sebab Atalya, perempuan fasik itu, dan anak-anak lelakinya telah merusak rumah Allah dan bahkan menjadikan segala barang kudus dari rumah Yahweh untuk para Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membuat segala barang kudus dari rumah Yahweh bagi para Baal.” Dalam konteks ini, kata kerja tersebut mungkin berarti bahwa barang-barang kudus itu dialihkan atau digunakan untuk pemujaan para Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan perintah pada konteks sebelumnya.
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: Atalya, perempuan fasik itu
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia serta menyatakan bentuk feminin dan daya penunjuk dari sebutan Ibrani tersebut.
- source_word: בָּנֶיהָ
  choice: anak-anak lelakinya
  rationale: Mempertahankan makna harfiah bentuk Ibrani yang secara khusus berarti anak-anak lelaki.
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: telah membobol rumah Allah
  rationale: Kata kerja פרץ menyatakan tindakan menerobos atau merusak dengan kekerasan; 'membobol' menyampaikan pelanggaran paksa terhadap rumah Allah tanpa mempersempitnya menjadi sekadar masuk.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: segala barang kudus dari rumah Yahweh
  rationale: Merujuk pada benda-benda yang dikhususkan bagi ibadah di bait; 'barang kudus' alami dan cukup dekat dengan bentuk sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis secara langsung dalam teks Ibrani.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: telah menjadikan ... untuk para Baal
  rationale: '''Menjadikan ... untuk'' mempertahankan hubungan dengan arti dasar עשה, sekaligus memungkinkan makna kontekstual bahwa barang-barang itu dialihkan atau dipakai bagi pemujaan Baal. ''Para Baal'' mempertahankan bentuk jamak Ibrani.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankan perbedaannya dari sebutan umum bagi Tuhan.
- issue: Bentuk jamak בְּעָלִים
  choice: para Baal
  alternative: Baal atau berhala-berhala Baal
  rationale: Bentuk jamak dipertahankan agar teks tidak diselaraskan menjadi satu Baal; ungkapan itu dapat menunjuk pada berbagai perwujudan, tempat pemujaan, atau kultus Baal.
- issue: Makna עָשׂוּ dalam konteks barang-barang kudus
  choice: menjadikan ... untuk
  alternative: menggunakan ... untuk atau membuat ... bagi
  rationale: Pilihan ini mempertahankan ketegangan antara arti dasar 'membuat/melakukan' dan makna kontekstual berupa pengalihan barang-barang kudus untuk pemujaan Baal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rumah Allah' dan 'rumah Yahweh' mempertahankan pengulangan leksikal sumber. Struktur dibagi menjadi dua kalimat agar jelas bagi pembaca umum tanpa mengubah hubungan penjelas dan penambahan dalam teks Ibrani.
