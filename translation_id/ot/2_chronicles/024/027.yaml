id: 2CH.24.27
reference: 2 Chronicles 24:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בָנָ֞י/ו ו/רב הַ/מַּשָּׂ֣א עָלָ֗י/ו וִ/יסוֹד֙ בֵּ֣ית הָ/אֱלֹהִ֔ים הִנָּ֣/ם כְּתוּבִ֔ים עַל מִדְרַ֖שׁ סֵ֣פֶר הַ/מְּלָכִ֑ים וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: id
  text: Anak-anaknya[a], banyaknya nubuat yang menentang dia, dan peletakan dasar rumah Allah—semuanya itu tertulis dalam Tafsiran atas Kitab Raja-Raja[b]. Lalu Amazia, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani sesudah “anak-anaknya” sulit ditafsirkan. Frasa itu juga mungkin berarti “besarnya beban yang ditanggungkan kepadanya”, “banyaknya pernyataan mengenai dia”, atau bahkan “upeti berat yang dikenakan kepadanya”. Kata Ibrani yang dipakai dapat berarti “beban”, “nubuat”, atau dalam konteks tertentu sesuatu yang dibebankan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani midras di sini mungkin berarti catatan penafsiran, uraian, atau tafsiran yang berkaitan dengan Kitab Raja-Raja.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: Anak-anaknya
  rationale: Menerjemahkan bentuk jamak dengan akhiran orang ketiga tunggal secara langsung; waw dipahami sebagai penghubung dalam daftar penutup dan tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: banyaknya nubuat yang menentang dia
  rationale: רֹב menyatakan kelimpahan atau banyaknya, sedangkan מַשָּׂא dapat menunjuk pada beban atau ucapan ilahi/nubuat, sering bernada penghakiman. Konteks akhir hidup Yoas mendukung 'nubuat yang menentang dia', tetapi ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: וִיסוֹד
  choice: peletakan dasar
  rationale: Berasal dari יסד, 'meletakkan dasar/mendirikan'. Ungkapan ini mempertahankan gambaran dasar bangunan tanpa menggantinya secara interpretatif dengan 'pembangunan kembali', meskipun konteks pasal membahas pemugaran rumah Allah.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Padanan transparan bagi idiom Ibrani; tetap alami dalam ragam Alkitab bahasa Indonesia dan tidak mempersempitnya menjadi 'Bait Allah'.
- source_word: הִנָּם כְּתוּבִים
  choice: semuanya itu tertulis
  rationale: הִנָּם memberi penegasan deiktis. 'Semuanya itu' secara alami merujuk kembali kepada unsur-unsur dalam daftar dan mempertahankan penekanannya tanpa memakai seruan arkais 'lihatlah'.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: dalam Tafsiran atas Kitab Raja-Raja
  rationale: מִדְרַשׁ di sini kemungkinan berarti catatan interpretatif, uraian, atau tafsiran. Padanan 'Tafsiran' lebih mudah dipahami pembaca Indonesia, sementara catatan kaki menjelaskan istilah Ibraninya.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: Lalu Amazia, anaknya, menjadi raja menggantikan dia
  rationale: 'Menyampaikan rumus suksesi kerajaan secara alami: Amazia naik takhta sebagai pengganti ayahnya.'
theological_decisions:
- issue: Makna מַשָּׂא dalam ringkasan tentang Yoas
  choice: nubuat yang menentang dia
  alternative: beban berat yang ditanggungkan kepadanya; banyaknya pernyataan mengenai dia; upeti berat yang dikenakan kepadanya
  rationale: Makna 'nubuat/ucapan ilahi' sesuai dengan penggunaan מַשָּׂא dalam konteks ucapan penghakiman dan dengan akhir negatif pemerintahan Yoas, tetapi frasa ini memang sulit sehingga pilihan lain tidak boleh disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Semuanya itu tertulis' dipilih daripada seruan yang lebih arkais; 'Tafsiran' dipakai dalam teks utama agar istilah genre dapat dipahami pembaca umum, dengan istilah Ibraninya dijelaskan dalam catatan kaki.
