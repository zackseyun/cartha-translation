  source_fidelity: Terjemahan mempertahankan tiga unsur daftar Ibrani—anak-anak Yoas, banyaknya מַשָּׂא עליו, dan יסוד rumah Allah—serta rujukan kepada Midras Kitab Raja-Raja dan rumus suksesi Amazia. "Nubuat yang menentang dia" merupakan pembacaan yang sah bagi מַשָּׂא dalam konteks ini, sedangkan catatan kaki dengan tepat menjaga alternatif-alternatif yang mungkin bagi frasa sulit tersebut. "Peletakan dasar rumah Allah" mencerminkan יסוד tanpa mengubahnya secara interpretatif menjadi "pembangunan kembali."
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir baik. Susunan daftar yang panjang tetap mudah dipahami karena penutupnya, "semuanya itu tertulis," secara jelas merangkum semua unsur sebelumnya. "Lalu Amazia, anaknya, menjadi raja menggantikan dia" adalah rumus suksesi yang alami.
