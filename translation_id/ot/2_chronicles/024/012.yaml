source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: id
  text: Raja dan Yoyada menyerahkannya[a] kepada orang-orang yang melaksanakan pekerjaan pelayanan di rumah Yahweh[b]. Mereka mengupah para pemahat batu dan para perajin untuk memugar rumah Yahweh, juga para perajin yang bekerja dengan besi dan perunggu[c] untuk memperkuat rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikannya” atau “menyerahkannya”; dalam konteks, yang dimaksud adalah uang yang telah dikumpulkan.
    reason: lexical_alternative
  - marker: b
    text: “Rumah Yahweh” di sini berarti bait Allah.
    reason: lexical_alternative
  - marker: c
    text: Atau “para pandai logam yang mengolah besi dan perunggu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: menyerahkannya
  rationale: Bentuk verba dengan akhiran objek orang ketiga tunggal berarti ‘memberikan/menyerahkannya’. Dalam konteks, objeknya adalah uang yang telah dikumpulkan, tetapi teks ayat ini sendiri tetap memakai pronomina.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: kepada orang-orang yang melaksanakan pekerjaan pelayanan di rumah Yahweh
  rationale: Terjemahan ini mempertahankan unsur ‘pekerjaan’ dan ‘pelayanan’ dalam frasa Ibrani yang berlapis, sambil memakai susunan yang dapat dipahami dalam bahasa Indonesia modern tanpa menambahkan gagasan ‘pengawasan’ yang tidak dinyatakan secara eksplisit.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: ‘Rumah Yahweh’ mencerminkan ungkapan Ibrani secara langsung; dalam konteks, yang dimaksud ialah bait Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama diri dalam teks sumber tetap terlihat.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: Mereka mengupah
  rationale: Konstruksi היה dengan partisip menyatakan tindakan mempekerjakan yang berlangsung; ‘mengupah’ menyampaikan tindakan itu secara ringkas dan alami.
- source_word: חֹצְבִים
  choice: para pemahat batu
  rationale: Dalam konteks pemugaran bangunan, istilah ini menunjuk kepada pekerja yang memotong atau memahat batu.
- source_word: חָרָשִׁים
  choice: para perajin
  rationale: Istilah Ibrani dapat menunjuk secara luas kepada pekerja terampil dan tidak harus dibatasi menjadi tukang kayu.
- source_word: לְחַדֵּשׁ
  choice: untuk memugar
  rationale: Bentuk piel dari חדש berarti membuat baru kembali. ‘Memugar’ secara alami mencakup pembaruan dan perbaikan sebuah bangunan.
- source_word: לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: para perajin besi dan perunggu
  rationale: Ungkapan ini menunjuk kepada pekerja terampil yang mengolah kedua logam tersebut; ‘perajin’ cukup luas dan tidak mempersempitnya secara tidak perlu menjadi pandai besi.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks bahan bangunan dan perkakas pada zaman Alkitab, ‘perunggu’ merupakan padanan kontekstual yang lazim, meskipun kata itu juga dapat merujuk pada tembaga.
- source_word: לְחַזֵּק
  choice: untuk memperkuat
  rationale: Terjemahan ini mencerminkan arti kausatif ‘membuat kuat’ dan sesuai dengan konteks penguatan struktur bangunan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi, sehingga ‘Yahweh’ mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: bait Yahweh
  rationale: ‘Rumah Yahweh’ mempertahankan metafora dan bentuk ungkapan sumber, sedangkan catatan kaki menjelaskan bahwa acuannya adalah bait Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan pengulangan ‘rumah Yahweh’ dan unsur ‘pekerjaan pelayanan’ dari teks Ibrani. Istilah ‘memugar’ dipilih karena sesuai dengan pemulihan bangunan, bukan sekadar perbaikan kecil.
