base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: id
  text: Para pekerja itu bekerja, dan pekerjaan perbaikan itu maju di tangan mereka. Mereka memulihkan rumah Allah kepada keadaannya yang semestinya[a] dan memperkuatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menegakkan kembali rumah Allah menurut tatanan atau susunannya yang tetap"; dapat juga dipahami "ke bentuknya semula."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: Para pekerja pun bekerja
  rationale: Ungkapan Ibrani ini secara harfiah mengulang akar kata 'melakukan/pekerjaan'. Terjemahan ini mempertahankan pengulangan tersebut dalam bentuk Indonesia yang tetap wajar.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: perbaikan itu maju
  rationale: אֲרוּכָה dapat berarti pemulihan atau penyembuhan; dalam konteks renovasi bangunan, maknanya ialah perbaikan. Bersama verba עלה, frasa ini menyatakan bahwa perbaikan mengalami kemajuan.
- source_word: בְּיָדָם
  choice: melalui tangan mereka
  rationale: Idiom ini menunjukkan perantaraan atau pelaku, sementara gambaran konkret 'tangan' tetap dipertahankan.
- source_word: וַיַּעֲמִידוּ
  choice: Mereka memulihkan
  rationale: Bentuk kausatif dari עמד secara harfiah berarti 'membuat berdiri'. Dalam konteks bangunan yang diperbaiki, kata ini menunjuk pada tindakan menegakkan kembali atau memulihkan.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan harfiah ini mempertahankan sebutan Ibrani bagi Bait Allah dan tetap jelas dalam konteks.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: ke bentuknya semula
  rationale: מַתְכֻּנֶת dapat menunjuk pada susunan, bentuk tetap, ukuran, atau keadaan yang semestinya. Dalam konteks pemugaran, 'bentuknya semula' menyampaikan pemulihan bangunan menurut tatanannya.
- source_word: וַיְאַמְּצֻהוּ
  choice: dan memperkuatnya
  rationale: Bentuk intensif אמץ berarti menguatkan atau membuat kukuh; pilihan ini langsung dan sesuai dengan konteks bangunan.
