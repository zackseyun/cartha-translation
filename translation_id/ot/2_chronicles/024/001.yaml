id: 2CH.24.1
reference: 2 Chronicles 24:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: id
  text: Yoas berumur tujuh tahun ketika ia menjadi raja, dan ia memerintah selama empat puluh tahun di Yerusalem. Nama ibunya ialah Zibya, dari Bersyeba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: berumur tujuh tahun
  rationale: Ungkapan usia Ibrani secara harfiah berarti 'anak tujuh tahun'; bahasa Indonesia alami menyatakan maknanya dengan 'berumur tujuh tahun'.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Bentuk dengan preposisi ב menandai waktu naik takhta. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna temporalnya.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini berarti memerintah atau menjadi raja. 'Memerintah' mempertahankan daya verbalnya dan sesuai dengan rumusan ringkasan pemerintahan raja.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב dipakai secara lokatif bersama nama tempat.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Ini merupakan rumusan silsilah yang umum; terjemahan tersebut jelas, wajar, dan tetap mempertahankan susunan informasinya.
- source_word: צִבְיָה
  choice: Zibya
  rationale: Nama pribadi ditransliterasikan dengan bentuk Indonesia yang langsung mencerminkan konsonan Ibrani צִבְיָה.
- source_word: מִבְּאֵר שָׁבַע
  choice: dari Bersyeba
  rationale: Prefiks מ menandakan asal. 'Bersyeba' adalah bentuk nama tempat yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
