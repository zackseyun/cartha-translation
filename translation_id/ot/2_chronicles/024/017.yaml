base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: id
  text: Sesudah Yoyada meninggal, para pemimpin Yehuda[a] datang dan bersujud di hadapan raja. Lalu raja mendengarkan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pejabat Yehuda” atau “para pembesar Yehuda.”
    reason: lexical_alternative
  - marker: b
    text: “Mendengarkan mereka” juga dapat berarti “mengindahkan mereka” atau “menuruti mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: Sesudah Yoyada meninggal
  rationale: Ungkapan waktu dan nomina konstruksi Ibrani dialihkan ke bentuk verbal yang alami dalam bahasa Indonesia, tanpa mengubah urutan peristiwa. Nama יְהוֹיָדָע mengikuti bentuk Indonesia yang lazim, “Yoyada”.
- source_word: בָּאוּ
  choice: datang
  rationale: Makna umum verba gerak ini cukup dinyatakan dengan “datang”; teks tidak perlu diberi tujuan atau arah tambahan yang tidak dinyatakan.
- source_word: שָׂרֵי יְהוּדָה
  choice: para pemimpin Yehuda
  rationale: שָׂרִים dapat menunjuk para pemimpin, pejabat, atau pembesar. “Para pemimpin” jelas bagi pembaca modern dan mempertahankan cakupan makna tanpa menyiratkan bahwa mereka putra raja.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: bersujud di hadapan raja
  rationale: Pilihan ini mempertahankan gerak merendahkan diri secara fisik di hadapan seorang atasan, tanpa secara eksplisit menafsirkannya sebagai penyembahan.
- source_word: אָז
  choice: Lalu
  rationale: Penanda urutan ini menghubungkan tindakan para pemimpin dengan tanggapan raja secara alami dalam narasi Indonesia.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: raja mendengarkan mereka
  rationale: Idiom שׁמע אל dapat berarti mendengarkan atau mengindahkan. “Mendengarkan” mempertahankan makna langsung sekaligus membiarkan kemungkinan bahwa raja mengikuti kemauan mereka dijelaskan oleh konteks.
theological_decisions:
- issue: Sifat tindakan para pemimpin terhadap raja
  choice: bersujud di hadapan raja
  alternative: memberi hormat kepada raja; menyembah raja
  rationale: Verba Ibrani dapat menggambarkan sujud sebagai penghormatan ataupun penyembahan, bergantung pada konteks. Karena objeknya seorang raja manusia, “menyembah” akan terlalu menentukan makna teologis, sedangkan “bersujud” mempertahankan tindakan fisiknya.
- issue: Kadar kepatuhan raja kepada para pemimpin
  choice: mendengarkan mereka
  alternative: mengindahkan mereka; menuruti mereka
  rationale: Konstruksi Ibrani dapat menyiratkan bahwa raja bukan sekadar mendengar, melainkan menerima atau mengikuti perkataan mereka. Terjemahan utama mempertahankan keluwesan itu, dan catatan kaki menyebutkan kemungkinan makna yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. Istilah “bersujud” mempertahankan kekuatan gerak fisik dalam teks sumber, sedangkan catatan kaki menjaga keluasan makna istilah kepemimpinan dan idiom mendengarkan.
