  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: id
  text: Yoas melakukan apa yang benar di mata Yahweh sepanjang hidup Imam Yoyada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה berarti 'melakukan/membuat'; dalam rumusan penilaian ini, 'melakukan apa yang benar' merupakan ungkapan Indonesia yang alami.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Kata יָשָׁר berarti 'lurus, benar, jujur'; di sini kata itu menunjuk kepada tindakan yang dinilai benar.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang penilaian dari sudut pandang seseorang dan lazim dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: כָּל יְמֵי
  choice: sepanjang hidup
  rationale: Secara harfiah berarti 'sepanjang hari-hari'; bersama nama seseorang, ungkapan ini secara alami berarti selama orang itu hidup.
- source_word: יְהוֹיָדָע
  choice: Yoyada
  rationale: Nama diri disesuaikan dengan bentuk yang lazim dalam tradisi ejaan Alkitab bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Gelar definit הַכֹּהֵן menerangkan jabatan Yoyada; dalam bahasa Indonesia, 'Imam Yoyada' menyampaikan hubungan aposisional itu dengan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menggunakan Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Batas waktu kesetiaan Yoas
  choice: sepanjang hidup Imam Yoyada
  alternative: selama masa pelayanan Imam Yoyada
  rationale: כָּל יְמֵי יְהוֹיָדָע secara langsung menunjuk kepada seluruh hari kehidupan Yoyada, tanpa membatasi cakupannya hanya pada masa jabatannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora Ibrani 'di mata' dipertahankan karena alami dan jelas. Susunan gelar dan nama dibuat idiomatis dalam bahasa Indonesia.
