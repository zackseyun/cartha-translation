  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: id
  text: Yoyada mengambilkan dua istri baginya[a], lalu ia memperanakkan anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kemungkinan lain, meskipun kurang mungkin: “Yoyada mengambil dua istri, lalu ia memperanakkan anak-anak lelaki dan perempuan,” jika Yoyada dipahami sebagai subjek seluruh ayat.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ל֥וֹ
  choice: mengambilkan ... baginya
  rationale: Ungkapan ini secara harfiah berarti ‘mengambil bagi dia’. Dalam konteks perkawinan, bentuk ‘mengambilkan ... baginya’ secara alami menyatakan bahwa Yoyada mengatur atau menyediakan istri bagi Yoas, sambil tetap mempertahankan pronomina Ibrani.
- source_word: יְהוֹיָדָע
  choice: Yoyada
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: נָשִׁים שְׁתָּיִם
  choice: dua istri
  rationale: Dalam konteks perkawinan, נָשִׁים berarti ‘istri-istri’, dan bilangan dua dipertahankan secara eksplisit.
- source_word: וַיּוֹלֶד
  choice: lalu ia mendapat anak-anak
  rationale: Hifil ילד dengan subjek laki-laki secara harfiah berarti ‘memperanakkan’. Ungkapan Indonesia ‘mendapat anak-anak’ lebih alami dan bermartabat; pronomina ‘ia’ mempertahankan ketidakjelasan eksplisit mengenai subjeknya.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Terjemahan ini mempertahankan pembedaan eksplisit antara keturunan laki-laki dan perempuan tanpa meratakannya menjadi sekadar ‘anak-anak’.
theological_decisions:
- issue: Rujukan pronomina dan subjek kata kerja dalam ayat ini
  choice: Teks utama mempertahankan bentuk ‘baginya’ dan ‘ia’; dalam konteks, bacaan yang lebih mungkin ialah Yoyada mengambilkan dua istri bagi Yoas, lalu Yoas mendapat anak-anak.
  alternative: Yoyada sendiri mengambil dua istri dan mendapat anak-anak lelaki dan perempuan.
  rationale: Konteks narasi berpusat pada Raja Yoas, dan לּוֹ (‘baginya’) menunjukkan bahwa tindakan Yoyada dilakukan untuk orang lain. Namun, karena Yoyada adalah subjek tersurat terdekat dan bahasa Ibrani tidak mengulangi nama Yoas sebelum וַיּוֹלֶד, kemungkinan gramatikal lainnya tidak boleh disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. ‘Mengambilkan’ mempertahankan nuansa bahwa Yoyada bertindak bagi Yoas. ‘Mendapat anak-anak’ dipilih daripada ‘memperanakkan’ agar alami dalam bahasa Indonesia, sementara catatan kaki menjaga ambiguitas sintaksis sumber.
