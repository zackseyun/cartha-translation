  naturalness: Kalimatnya pada dasarnya baku dan mudah dipahami. “Memperanakkan” lebih formal daripada “mendapat anak,” tetapi merupakan pilihan baku yang tepat dalam register naratif Kitab Suci dan mempertahankan makna verba sumber.
  terminology: Nama “Yoyada” dan “istri” sudah sesuai penggunaan Indonesia yang lazim. “Anak-anak lelaki dan perempuan” mempertahankan pembedaan בניים ובנות. Catatan kaki perlu memakai verba yang sama kuatnya dengan teks utama agar alternatif pembacaan tidak kembali melemahkan makna “fathered.”
