  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: id
  text: Mereka meninggalkan rumah TUHAN, Allah nenek moyang mereka, dan beribadah kepada Asyerim[a] dan berhala-berhala. Lalu murka menimpa Yehuda dan Yerusalem karena kesalahan mereka ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tiang-tiang Asyera.” Istilah Ibrani ini merujuk pada objek-objek kultis yang berkaitan dengan Asyera dan mungkin juga membangkitkan asosiasi dengan dewi Asyera.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: meninggalkan
  rationale: Makna dasarnya ialah meninggalkan atau menelantarkan. Dalam konteks ini, kata tersebut menyatakan ketidaksetiaan kepada TUHAN secara alami tanpa memakai ungkapan arkais.
- source_word: בֵּית יְהוָה
  choice: rumah TUHAN
  rationale: Terjemahan harfiah ungkapan Ibrani ini mempertahankan sebutan khas bagi bait TUHAN dan tetap mudah dipahami dari konteks.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Bentuk huruf kapital mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia untuk menandai nama ilahi YHWH.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: Ungkapan ini mempertahankan dimensi kekeluargaan dan kesinambungan perjanjian, serta lebih alami dalam bahasa Indonesia modern daripada 'Allah para bapa mereka'.
- source_word: וַיַּעַבְדוּ
  choice: beribadah kepada
  rationale: Dalam konstruksi dengan objek-objek ilahi, עבד menyatakan pelayanan religius atau penyembahan. 'Beribadah kepada' menyampaikan makna itu dengan jelas dan alami.
- source_word: הָאֲשֵׁרִים
  choice: patung-patung Asyera
  rationale: Bentuk jamak ini menunjuk benda-benda kultis yang berkaitan dengan Asyera. 'Patung-patung Asyera' cukup jelas bagi pembaca umum, sementara catatan kaki mempertahankan alternatif 'tiang-tiang Asyera' dan ketidakpastian bentuk bendanya.
- source_word: הָעֲצַבִּים
  choice: berhala-berhala
  rationale: Kata ini menunjuk patung atau gambar pujaan dengan nuansa merendahkan; 'berhala-berhala' mempertahankan daya polemis dan acuan religiusnya.
- source_word: וַיְהִי קֶצֶף
  choice: murka menimpa
  rationale: Ungkapan ini mempertahankan rumusan singkat bahasa Ibrani tanpa menambahkan secara eksplisit pemilik murka, yang tersirat sebagai TUHAN dari konteks.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: menimpa Yehuda dan Yerusalem
  rationale: Padanan ini mengungkapkan bahwa murka atau penghukuman jatuh atas kedua tempat tersebut secara alami dalam bahasa Indonesia.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: Karena kesalahan mereka itu
  rationale: Prefiks ב dipahami secara kausal, sedangkan אַשְׁמָה mencakup kesalahan yang mendatangkan pertanggungjawaban. Susunan ini mempertahankan penunjuk 'itu' dan unsur kepunyaan.
theological_decisions:
- issue: Sumber murka
  choice: Dibiarkan tersirat sebagai murka ilahi tanpa menambahkan 'TUHAN' atau 'Allah' dalam teks utama.
  alternative: “murka TUHAN menimpa” atau “murka Allah menimpa”
  rationale: Konteks jelas menunjuk murka TUHAN, tetapi teks Ibrani hanya menyebut 'murka'. Rumusan tersirat mempertahankan ketegangan dan kepadatan teks sumber.
- issue: Acuan אֲשֵׁרִים
  choice: Diterjemahkan sebagai benda-benda kultis, “patung-patung Asyera,” dengan alternatif dalam catatan kaki.
  alternative: “tiang-tiang Asyera” atau transliterasi “Asyerim”
  rationale: Bentuk jamak ini lazim menunjuk objek kultis yang berkaitan dengan dewi Asyera, tetapi bentuk persis objeknya tidak selalu pasti. Terjemahan utama dibuat dapat dipahami pembaca umum tanpa menutup alternatif yang lazim.
- issue: Makna עבד terhadap objek kultis
  choice: “beribadah kepada”
  alternative: “melayani” atau “menyembah”
  rationale: Kata sumber secara harfiah dapat berarti melayani, tetapi dengan objek ilahi atau kultis maknanya bersifat religius. Pilihan ini jelas tanpa mempersempitnya hanya pada satu tindakan ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan urutan tindakan dan akibat dalam teks Ibrani. Istilah 'rumah TUHAN' dipertahankan sebagai ungkapan sumber, sementara 'beribadah kepada' dan 'kesalahan mereka itu' dipilih demi kejelasan bagi pembaca umum.
