  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: id
  text: 'Roh Allah menyelubungi Zakharia, anak Yoyada, sang imam,[a] lalu ia berdiri di atas orang banyak dan berkata kepada mereka, “Beginilah firman Allah: Mengapa kalian melanggar perintah-perintah Yahweh sehingga kalian tidak berhasil?[b] Karena kalian telah meninggalkan Yahweh, Ia pun meninggalkan kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Roh Allah hinggap pada Zakharia”; secara harfiah, “Roh Allah mengenakan Zakharia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dan kalian tidak akan berhasil.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Dalam konteks pemberdayaan untuk bernubuat, frasa ini paling wajar menunjuk pada Roh Allah sebagai pelaku ilahi, bukan sekadar dorongan batin.
- source_word: לָבְשָׁה אֶת
  choice: menyelubungi
  rationale: Kata kerja לבשׁ memakai gambaran pakaian. “Menyelubungi” mempertahankan citra tersebut sekaligus terdengar alami dalam bahasa Indonesia; arti idiomatis “hinggap atas” dicatat dalam catatan kaki.
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: Zakharia, anak Imam Yoyada
  rationale: Bentuk ini mengikuti ejaan nama yang lazim dalam bahasa Indonesia dan mengaitkan gelar imam dengan Yoyada, nomina terdekat dalam bahasa Ibrani.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: ia berdiri di tempat yang lebih tinggi daripada rakyat
  rationale: Terjemahan ini mempertahankan unsur ruang atau ketinggian dalam מֵעַל, yang dapat hilang jika hanya diterjemahkan “di hadapan rakyat”.
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: Beginilah firman Allah
  rationale: Ungkapan ini merupakan rumus pewartaan kenabian yang khidmat dan alami dalam bahasa Indonesia.
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֹת יְהוָה
  choice: Mengapa kalian melanggar perintah-perintah Yahweh
  rationale: Dalam kaitannya dengan perintah, עבר berarti melampaui batas atau melanggar. “Kalian” mempertahankan bentuk jamak orang kedua.
- source_word: וְלֹא תַצְלִיחוּ
  choice: sehingga kalian tidak berhasil
  rationale: Dalam pertanyaan retoris ini, waw dapat dipahami sebagai pengantar akibat. Karena hubungan koordinatif juga mungkin, alternatifnya dipertahankan dalam catatan kaki.
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: Karena kalian telah meninggalkan Yahweh, Ia pun meninggalkan kalian
  rationale: Pengulangan “meninggalkan” mempertahankan simetri sengaja antara tindakan umat dan tanggapan Yahweh. “Pun” menyatakan hubungan timbal balik tanpa menambah gagasan baru.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama perjanjian. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Identitas רוּחַ אֱלֹהִים
  choice: Roh Allah
  alternative: roh Allah atau suatu roh dari Allah
  rationale: Konteks tindakan kenabian menunjukkan pemberdayaan langsung oleh Allah. Huruf kapital menandai rujukan ilahi tanpa menguraikan doktrin yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Sapaan “kalian” dipakai untuk menunjukkan bahwa bentuk Ibraninya jamak. Nama diri mengikuti bentuk Indonesia yang lazim, sedangkan Yahweh dipertahankan sebagai nama ilahi.
