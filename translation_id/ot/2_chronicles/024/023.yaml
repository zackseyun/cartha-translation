id: 2CH.24.23
reference: 2 Chronicles 24:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י לִ/תְקוּפַ֣ת הַ/שָּׁנָ֗ה עָלָ֣ה עָלָי/ו֮ חֵ֣יל אֲרָם֒ וַ/יָּבֹ֗אוּ אֶל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּשְׁחִ֛יתוּ אֶת כָּל שָׂרֵ֥י הָ/עָ֖ם מֵ/עָ֑ם וְ/כָל שְׁלָלָ֥/ם שִׁלְּח֖וּ לְ/מֶ֥לֶךְ דַּרְמָֽשֶׂק׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: id
  text: Pada pergantian tahun[a], pasukan Aram[b] maju menyerangnya. Mereka datang ke Yehuda dan Yerusalem, membinasakan semua pemimpin rakyat dari antara rakyat itu, lalu mengirimkan seluruh jarahan mereka[c] kepada raja Damsyik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada akhir tahun”; ungkapan Ibrani ini merujuk pada berputarnya tahun atau pergantian musim.
    reason: lexical_alternative
  - marker: b
    text: “Aram” adalah nama Ibrani yang juga sering diterjemahkan “Siria.”
    reason: cultural_note
  - marker: c
    text: Atau “seluruh rampasan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: Pada pergantian tahun
  rationale: תְּקוּפָה menunjuk pada perputaran atau pergantian dalam siklus tahun. Ungkapan ini dipertahankan secara wajar tanpa menetapkannya secara lebih sempit sebagai akhir tahun.
- source_word: עָלָה עָלָיו
  choice: maju menyerangnya
  rationale: Dalam konteks militer, עָלָה עַל berarti maju melawan atau menyerang. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan pronomina objek dari teks Ibrani.
- source_word: חֵיל אֲרָם
  choice: pasukan Aram
  rationale: חֵיל di sini berarti kekuatan militer atau pasukan. Nama kuno Aram dipertahankan, bukan diganti dengan nama geopolitik yang lebih kemudian, yaitu Siria.
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: Mereka datang ke Yehuda dan Yerusalem
  rationale: בוא adalah kata kerja umum untuk datang atau masuk. Konteks sekitarnya sudah menunjukkan bahwa kedatangan itu bersifat militer, sehingga tidak perlu diperkuat menjadi 'menyerbu'.
- source_word: וַיַּשְׁחִיתוּ
  choice: membinasakan
  rationale: Bentuk Hifil dari שׁחת dapat berarti menghancurkan atau membinasakan. Karena objeknya manusia, 'membinasakan' menyampaikan kehancuran yang mematikan secara jelas dan bermartabat.
- source_word: כָּל שָׂרֵי הָעָם
  choice: semua pemimpin rakyat
  rationale: שָׂרִים dapat berarti para penguasa, pejabat, atau pemimpin. 'Pemimpin' jelas bagi pembaca modern dan tidak menyiratkan bahwa mereka semua putra raja.
- source_word: מֵעָם
  choice: dari antara rakyat itu
  rationale: Frasa ini dipertahankan meskipun agak berulang karena מן menandai bahwa para pemimpin tersebut dibinasakan dari tengah populasi rakyat.
- source_word: וְכָל שְׁלָלָם
  choice: seluruh jarahan mereka
  rationale: שָׁלָל adalah barang jarahan atau rampasan perang. Akhiran orang ketiga jamak dipertahankan sebagai 'mereka' tanpa mempersempit rujukannya lebih jauh daripada teks.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: mengirimkan ... kepada raja Damsyik
  rationale: Frasa ini paling alami dipahami sebagai pengiriman jarahan kepada penguasa yang berkedudukan di Damsyik. Bentuk nama 'Damsyik' mengikuti pemakaian Alkitab bahasa Indonesia yang mapan.
