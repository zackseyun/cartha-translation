translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan 'dari antara rakyat itu' sengaja dipertahankan untuk mencerminkan unsur מֵעָם dalam teks Ibrani, sedangkan istilah militer dibuat jelas tanpa melebihkan kata kerja sumber.
