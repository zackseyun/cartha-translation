base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: id
  text: Kemudian raja memanggil Yoyada, sang pemimpin, dan berkata kepadanya, “Mengapa engkau tidak menuntut orang-orang Lewi untuk membawa dari Yehuda dan Yerusalem pungutan yang Musa, hamba TUHAN, tetapkan atas jemaah Israel untuk Kemah Kesaksian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: sang pemimpin
  rationale: Secara harfiah berarti ‘kepala/pemimpin’. Bentuk ini mempertahankan gelarnya tanpa menentukan secara lebih khusus jabatan yang tidak dinyatakan dalam teks.
- source_word: דָרַשְׁתָּ עַל
  choice: menuntut
  rationale: Dalam konstruksi ini berarti meminta atau menuntut pertanggungjawaban dari pihak tertentu, bukan sekadar bertanya.
- source_word: מַשְׂאַת
  choice: pungutan yang ditetapkan
  rationale: Kata ini dapat menunjuk pada pungutan atau iuran wajib. Tambahan ‘yang ditetapkan’ memperjelas hubungan genitif dengan Musa tanpa menyiratkan bahwa uang itu milik Musa.
- source_word: אֹהֶל הָעֵדוּת
  choice: Kemah Kesaksian
  rationale: Padanan formal yang mempertahankan istilah kultis dan kaitannya dengan kesaksian perjanjian.
theological_decisions:
- issue: Hubungan frasa ‘Musa ... dan umat Israel’ dengan pungutan
  choice: “pungutan yang ditetapkan Musa, hamba TUHAN, dan umat Israel”
  alternative: “pungutan Musa, hamba TUHAN, yang dikenakan kepada umat Israel”
  rationale: Sintaks Ibrani padat dan dapat dipahami dengan lebih dari satu cara. Teks utama mempertahankan koordinasi Musa dan umat Israel sedekat mungkin dengan sumber, tanpa memasukkan penjelasan teologis tambahan.
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas untuk Tetragramaton, sambil membedakannya secara tipografis sebagai nama ilahi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Orang-orang Lewi’ lebih alami daripada bentuk kolektif kaku, sedangkan ‘Kemah Kesaksian’ dipertahankan sebagai istilah khusus.
