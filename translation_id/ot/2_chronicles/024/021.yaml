source:
  edition: WLC
  text: וַ/יִּקְשְׁר֣וּ עָלָ֔י/ו וַ/יִּרְגְּמֻ֥/הוּ אֶ֖בֶן בְּ/מִצְוַ֣ת הַ/מֶּ֑לֶךְ בַּ/חֲצַ֖ר בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: id
  text: Lalu mereka bersekongkol melawan dia dan merajamnya atas perintah raja di pelataran rumah Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di halaman rumah Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: mereka bersekongkol melawan dia
  rationale: Dalam konstruksi dengan עַל, קשר menyatakan tindakan berkomplot atau bersekongkol melawan seseorang. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat kolektif serta permusuhannya.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: merajamnya
  rationale: רגם berarti merajam, sedangkan אֶבֶן berfungsi secara instrumental. Kata 'merajam' sendiri sudah menyatakan penghukuman dengan lemparan batu, sehingga ungkapan yang berlebihan 'merajamnya dengan batu' tidak diperlukan.
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: atas perintah raja
  rationale: מִצְוָה di sini adalah perintah yang berwenang. 'Atas perintah raja' merupakan ungkapan Indonesia yang wajar dan mempertahankan tanggung jawab langsung sang raja.
- source_word: בַּחֲצַר
  choice: di pelataran
  rationale: חָצֵר menunjuk pada ruang terbuka atau halaman dalam suatu kompleks. 'Pelataran' sesuai dengan lingkungan rumah ibadah dan terdengar alami serta bermartabat.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora Ibrani 'rumah' dan menyajikan nama ilahi יהוה secara langsung sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Tingkat eksplisit kekerasan dalam וַיִּרְגְּמֻהוּ אֶבֶן
  choice: merajamnya
  alternative: melemparinya dengan batu
  rationale: '''Merajamnya'' secara tepat menyampaikan tindakan yang dinyatakan oleh רגם dan konteks eksekusi, tanpa menambah atau mengurangi unsur teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Bersekongkol' menyampaikan tindakan konspiratif; 'merajam' merupakan istilah yang tepat dan mudah dipahami; 'pelataran' mempertahankan latar bangunan ibadah. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
