  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: id
  text: Sesudah itu, Yoas berniat untuk memulihkan[a] rumah Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “memperbarui” atau “memperbaiki”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “rumah Yahweh”; yang dimaksud ialah bait-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Penanda urutan ini memperkenalkan tahap baru dalam kisah. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan peralihan waktunya tanpa menerjemahkan וַיְהִי secara kaku.
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: Yoas berniat
  rationale: Ungkapan Ibrani yang secara harfiah menyebut sesuatu berada ‘dengan hati Yoas’ menyatakan niat batinnya. ‘Yoas berniat’ menyampaikan makna idiom itu secara wajar tanpa memperkuatnya menjadi suatu tekad mutlak.
- source_word: לְחַדֵּשׁ
  choice: memulihkan
  rationale: Kata kerja ini berarti membuat baru kembali, memperbarui, atau memulihkan. Dalam konteks bangunan rumah Yahweh yang telah rusak, ‘memulihkan’ mencakup renovasi secara lebih utuh daripada ‘memperbaiki’, sementara alternatif leksikalnya dipertahankan dalam catatan kaki.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Pilihan ini mempertahankan bentuk konkret ungkapan Ibrani ‘rumah YHWH’ beserta resonansinya, sedangkan pengertian kontekstualnya sebagai bait dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Kekuatan niat batin Yoas
  choice: Yoas berniat
  alternative: Yoas membulatkan tekad dalam hatinya
  rationale: Idiom Ibrani menunjukkan adanya niat dalam hati Yoas, tetapi tidak harus menyiratkan ketetapan hati sekuat ungkapan ‘membulatkan tekad’. Pilihan ini menjaga ketegangan kadar kehendaknya tanpa melebihkan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ungkapan ‘rumah Yahweh’ mempertahankan citra teks Ibrani. Semua penanda catatan kaki ditempatkan langsung sesudah kata atau frasa yang dijelaskan.
