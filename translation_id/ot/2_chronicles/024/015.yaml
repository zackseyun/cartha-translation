  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: id
  text: Yoyada menjadi tua dan berumur panjang, lalu ia meninggal. Ia berumur seratus tiga puluh tahun ketika meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: menjadi tua
  rationale: Kata kerja זקן dalam rangkaian naratif menunjukkan proses bertambah tua; ‘menjadi tua’ mempertahankan nuansa proses itu dalam bahasa Indonesia yang wajar.
- source_word: יְהוֹיָדָע
  choice: Yoyada
  rationale: Nama pribadi ini memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: lanjut usia
  rationale: Ungkapan Ibrani secara harfiah berarti ‘kenyang/penuh dengan hari-hari’ dan menunjuk pada umur yang panjang serta lengkap. ‘Lanjut usia’ menyampaikan maknanya secara alami, sedangkan bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: מות berarti ‘mati/meninggal’; ‘meninggal’ sesuai dengan ragam narasi yang bermartabat, dan ‘lalu’ mencerminkan urutan wayyiqtol.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: umurnya seratus tiga puluh tahun
  rationale: Rumus usia Ibrani secara harfiah memakai ‘anak dari’, tetapi bahasa Indonesia secara idiomatis menyatakan usia dengan ‘umurnya ... tahun’.
- source_word: בְּמוֹתוֹ
  choice: ketika ia meninggal
  rationale: Preposisi ב pada nomina ‘kematian’ dengan sufiks pronominal berfungsi secara temporal; ‘ketika ia meninggal’ adalah padanan Indonesia yang alami dan jelas.
