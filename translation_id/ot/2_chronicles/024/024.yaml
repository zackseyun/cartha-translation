  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: id
  text: Sebab pasukan Aram datang dengan sedikit orang[a], tetapi Yahweh menyerahkan pasukan yang sangat besar ke dalam kekuasaan mereka[b], karena orang Yehuda telah meninggalkan Yahweh, Allah leluhur mereka. Mereka pun menjatuhkan hukuman atas Yoas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan jumlah orang yang sedikit.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “ke dalam tangan mereka,” suatu ungkapan yang berarti “ke dalam kekuasaan mereka.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “melakukan berbagai penghakiman terhadap Yoas.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  choice: dengan jumlah orang yang sedikit
  rationale: Frasa ini menyatakan kecilnya jumlah pasukan; pilihan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan pasukan yang sangat besar.
- source_word: חֵיל אֲרָם
  choice: pasukan Aram
  rationale: Dalam konteks militer, חֵיל menunjuk kepada pasukan atau angkatan perang. Nama asli Aram dipertahankan.
- source_word: נָתַן בְּיָדָם
  choice: menyerahkan ... ke dalam kekuasaan mereka
  rationale: Ungkapan Ibrani harfiah 'memberikan ke dalam tangan mereka' berarti menyerahkan kepada kuasa pihak lain; terjemahan ini menyampaikan idiom tersebut secara wajar.
- source_word: חַיִל לָרֹב מְאֹד
  choice: pasukan yang sangat besar
  rationale: חַיִל kembali bermakna pasukan, sedangkan לָרֹב מְאֹד menegaskan besarnya jumlah.
- source_word: עָזְבוּ
  choice: telah meninggalkan
  rationale: Kata ini mengandung gagasan meninggalkan Yahweh dalam ketidaksetiaan; pilihan ini jelas dan bermartabat tanpa menambahkan tafsiran denominasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah leluhur mereka
  rationale: Dalam bahasa Indonesia modern, 'leluhur' secara alami menyampaikan para pendahulu genealogis yang dimaksud oleh אֲבוֹת, tanpa mengubah makna perjanjian dalam konteks.
- source_word: עָשׂוּ שְׁפָטִים
  choice: melaksanakan penghukuman
  rationale: Bentuk jamak שְׁפָטִים dapat menunjuk pada tindakan-tindakan penghukuman atau penghakiman. Bentuk kolektif 'penghukuman' alami dalam bahasa Indonesia dan tetap menunjukkan pembalasan yudisial.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi secara langsung; transliterasi mempertahankan bentuk nama itu.
- issue: Subjek tersirat dalam עָזְבוּ
  choice: orang Yehuda telah meninggalkan Yahweh
  alternative: mereka telah meninggalkan Yahweh
  rationale: Bentuk orang ketiga jamak merujuk kepada pihak yang meninggalkan Yahweh, yakni umat Yehuda dalam konteks, bukan orang Aram. Subjek diperjelas untuk menghindari ambiguitas pronomina yang menyesatkan dalam bahasa Indonesia.
- issue: Tindakan orang Aram sebagai penghukuman atas Yoas
  choice: orang Aram melaksanakan penghukuman atas Yoas
  alternative: mereka melakukan berbagai penghakiman terhadap Yoas
  rationale: Ungkapan mempertahankan hubungan tindakan pasukan Aram dengan penghukuman ilahi tanpa menjelaskan mekanismenya secara berlebihan; nuansa jamak sumber dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat. Struktur sebab-akibat teks Ibrani dipertahankan, sedangkan rujukan pronomina diperjelas demi keterbacaan. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
