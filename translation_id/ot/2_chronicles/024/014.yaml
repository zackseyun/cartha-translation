  text: וּֽ/כְ/כַלּוֹתָ֡/ם הֵבִ֣יאוּ לִ/פְנֵי֩ הַ/מֶּ֨לֶךְ וִֽ/יהוֹיָדָ֜ע אֶת שְׁאָ֣ר הַ/כֶּ֗סֶף וַ/יַּעֲשֵׂ֨/הוּ כֵלִ֤ים לְ/בֵית יְהוָה֙ כְּלֵ֣י שָׁרֵ֔ת וְ/הַעֲל֣וֹת וְ/כַפּ֔וֹת וּ/כְלֵ֥י זָהָ֖ב וָ/כָ֑סֶף וַ֠/יִּֽהְיוּ מַעֲלִ֨ים עֹל֤וֹת בְּ/בֵית יְהוָה֙ תָּמִ֔יד כֹּ֖ל יְמֵ֥י יְהוֹיָדָֽע־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: id
  text: 'Sesudah mereka selesai, mereka membawa sisa perak itu ke hadapan raja dan Yoyada. Ia membuat sisa perak itu menjadi perlengkapan[a] bagi rumah Yahweh: perlengkapan untuk pelayanan dan untuk mempersembahkan[b], mangkuk-mangkuk, serta perlengkapan dari emas dan perak. Mereka senantiasa mempersembahkan kurban bakaran di rumah Yahweh sepanjang masa hidup Yoyada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani memakai verba tunggal dengan sufiks objek tunggal: "ia membuatnya menjadi perlengkapan." Sufiks objek itu merujuk pada sisa perak. Pelaku tunggalnya tidak disebutkan secara eksplisit.'
    reason: grammatical_ambiguity
  - marker: b
    text: Secara harfiah, "untuk menaikkan" atau "untuk mempersembahkan." Objek tindakan itu tidak disebutkan di sini; kurban bakaran disebutkan secara eksplisit kemudian dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: Setelah mereka selesai
  rationale: Konstruksi temporal dengan subjek jamak diterjemahkan secara alami tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: שְׁאָר הַכֶּסֶף
  choice: sisa perak itu
  rationale: Dalam konteks pembuatan perlengkapan dari logam, כֶּסֶף paling tepat dipahami sebagai bahan 'perak', bukan sekadar 'uang'.
- source_word: וַיַּעֲשֵׂהוּ כֵלִים
  choice: Dengan perak itu, ia membuat berbagai perlengkapan
  rationale: Verba dan sufiks objeknya berbentuk tunggal. Susunan ini mempertahankan pelaku tunggal tanpa mengidentifikasinya lebih jauh daripada yang dinyatakan tata bahasa.
- source_word: כְּלֵי שָׁרֵת
  choice: perlengkapan untuk pelayanan
  rationale: שָׁרֵת menunjuk pada pelayanan dalam lingkungan ibadah; frasa Indonesia ini jelas, wajar, dan tetap cukup luas.
- source_word: וְהַעֲלוֹת
  choice: untuk menaikkan persembahan
  rationale: Infinitif kausatif עלה menyatakan tindakan menaikkan atau mempersembahkan. 'Persembahan' melengkapi ungkapan dalam bahasa Indonesia, sementara catatan kaki menjelaskan bahwa objeknya tidak disebutkan dalam bahasa Ibrani.
- source_word: וְכַפּוֹת
  choice: mangkuk-mangkuk
  rationale: כַּפּוֹת adalah wadah upacara yang bentuk tepatnya tidak pasti; 'mangkuk' merupakan padanan umum yang tidak terlalu khusus.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: Mereka senantiasa mempersembahkan kurban bakaran
  rationale: Konstruksi וַיִּהְיוּ dengan partisip dan תָּמִיד menyatakan kegiatan yang berlangsung secara tetap atau berulang.
- source_word: כֹּל יְמֵי יְהוֹיָדָע
  choice: sepanjang masa hidup Yoyada
  rationale: Ungkapan harfiah 'sepanjang hari-hari Yoyada' secara idiomatis menunjuk pada seluruh masa hidupnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Sifat kegiatan persembahan kurban pada klausa terakhir
  choice: kegiatan tetap dan berulang selama Yoyada hidup
  alternative: satu tindakan lampau yang diringkas
  rationale: Gabungan konstruksi partisipial dan תָּמִיד mendukung makna kebiasaan yang terus berlangsung, tanpa menyatakan bahwa tindakan itu berlangsung tanpa jeda.
- issue: Objek dari וְהַעֲלוֹת
  choice: persembahan, dengan penjelasan bahwa objek tidak dinyatakan
  alternative: kurban bakaran
  rationale: Teks baru menyebut עֹלוֹת secara eksplisit pada klausa berikutnya; terjemahan tidak menyamakan kedua ungkapan itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang khidmat tetapi mudah dipahami. 'Rumah Yahweh' mempertahankan citra Ibrani בֵּית יְהוָה; 'perlengkapan' dipilih sebagai istilah luas untuk כֵּלִים.
