  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: id
  text: Namun, Dia mengutus nabi-nabi ke tengah-tengah mereka untuk membawa mereka kembali kepada Yahweh. Para nabi itu bersaksi menentang mereka,[a] tetapi mereka tidak mau mendengarkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memperingatkan mereka.” Kata kerja Ibrani ini dapat menyatakan peringatan yang sungguh-sungguh, tetapi dalam konteks ini juga mengandung nuansa memberikan kesaksian terhadap mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם
  choice: Dia mengutus ... ke tengah-tengah mereka
  rationale: Bentuk naratif שׁלח berarti ‘mengutus’, sedangkan בָּהֶם dalam konstruksi ini wajar dipahami sebagai pengutusan para nabi ke tengah komunitas itu.
- source_word: נְבִאִים
  choice: nabi-nabi
  rationale: Padanan langsung dan baku bagi bentuk jamak נביאים.
- source_word: לַהֲשִׁיבָם
  choice: untuk membawa mereka kembali
  rationale: Bentuk Hifil dari שׁוב menyatakan tindakan menyebabkan seseorang kembali; frasa ini mempertahankan daya kausatifnya dalam bahasa Indonesia yang alami.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan mempertahankan arah relasional dari אֶל.
- source_word: וַיָּעִידוּ בָם
  choice: memperingatkan mereka dengan sungguh-sungguh
  rationale: Hifil dari עוּד dapat berarti memberi peringatan atau kesaksian yang khidmat. Dalam bahasa Indonesia, pilihan ini alami dan menyampaikan desakan profetis, sementara nuansa forensiknya dicatat dalam catatan kaki.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: tetapi mereka tidak mau mendengarkan
  rationale: Kata הֶאֱזִינוּ menunjuk pada mendengarkan dengan perhatian; konteks pembangkangan mendukung ‘tidak mau’, yang menyampaikan penolakan dan bukan sekadar kegagalan mendengar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi ‘Yahweh’ menyatakan nama ilahi secara langsung dan mengikuti kebijakan proyek tanpa memasukkan ciri denominasi tertentu.
- issue: Daya ungkap וַיָּעִידוּ בָם
  choice: memperingatkan mereka dengan sungguh-sungguh
  alternative: bersaksi menentang mereka
  rationale: Konteksnya adalah teguran para nabi yang bertujuan membawa umat kembali. Terjemahan utama dipilih demi kejelasan alami, sedangkan kemungkinan nuansa kesaksian forensik dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘Dia’ merujuk kepada Yahweh sesuai konteks ayat sebelumnya. Pengulangan ‘Para nabi itu’ menghindari ketidakjelasan rujukan subjek dalam bahasa Indonesia.
