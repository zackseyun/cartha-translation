  register: Bahasa naratif modern, lugas, dan bermartabat. Struktur ayat dipertahankan dekat dengan bahasa Ibrani, sementara nama-nama ditulis menurut pola yang mudah dibaca dalam bahasa Indonesia. Tidak digunakan catatan kaki karena alternatif yang diberikan dalam lapisan konsultasi bahasa Inggris pada dasarnya sama maknanya dengan terjemahan utama dan penempatan penandanya tidak sesuai dengan frasa yang diterangkan.
