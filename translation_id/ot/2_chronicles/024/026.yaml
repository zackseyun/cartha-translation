base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: id
  text: 'Inilah orang-orang yang bersekongkol melawan dia: Zabad, anak Simeat, seorang perempuan Amon, dan Yozabad, anak Simrit, seorang perempuan Moab.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan identitas para pelaku secara alami dalam narasi bahasa Indonesia; konteks sudah menunjukkan bahwa peristiwa itu terjadi pada masa lampau.
- source_word: הַמִּתְקַשְּׁרִים
  choice: orang-orang yang bersekongkol
  rationale: Bentuk partisipel hitpael dari קשר menunjuk kepada orang-orang yang bersama-sama membentuk persekongkolan; pilihan ini jelas, alami, dan mempertahankan nuansa tindakan bersama.
- source_word: עָלָיו
  choice: melawan dia
  rationale: Dengan verba קשר, preposisi עַל menandai sasaran persekongkolan.
- source_word: זָבָד
  choice: Zabad
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Padanan genealogis yang alami dalam bahasa Indonesia dan tidak menambahkan penanda gender yang tidak diperlukan.
- source_word: שִׁמְעָת
  choice: Simeat
  rationale: Transliterasi nama Ibrani yang sesuai dengan pola ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: הָעַמּוֹנִית
  choice: perempuan Amon
  rationale: Bentuk feminin tunggal menunjukkan bahwa Simeat adalah seorang perempuan dari Amon; susunan ini mempertahankan informasi gender dan asal-usulnya tanpa istilah arkais.
- source_word: וִיהוֹזָבָד
  choice: dan Yozabad
  rationale: Konjungsi dipertahankan, sedangkan nama ditransliterasikan secara wajar bagi pembaca Indonesia.
- source_word: שִׁמְרִית
  choice: Simrit
  rationale: Transliterasi ringkas yang mengikuti bentuk konsonantal nama Ibrani.
- source_word: הַמּוֹאָבִית
  choice: perempuan Moab
  rationale: Bentuk feminin tunggal menerangkan Simrit sebagai seorang perempuan dari Moab.
theological_decisions: []
