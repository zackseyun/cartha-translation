source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: id
  text: Mereka menguburkan dia di Kota Daud di antara raja-raja[a], karena ia telah melakukan apa yang baik di Israel, bagi Allah, dan bagi rumah-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersama raja-raja.”'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, bagi Allah dan bagi rumah Allah, yaitu bait.
    reason: clarification
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: Mereka menguburkan dia
  rationale: Bentuk Ibrani adalah verba aktif jamak dengan sufiks objek orang ketiga tunggal maskulin. Subjek jamaknya tidak disebutkan, dan bentuk aktif ini dipertahankan secara alami dalam bahasa Indonesia.
- source_word: בְעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Ungkapan nama tempat yang baku dipertahankan dalam bentuk yang lazim dan mudah dikenali.
- source_word: עִם הַמְּלָכִים
  choice: di antara raja-raja
  rationale: עִם secara harfiah berarti 'bersama dengan', tetapi dalam konteks pemakaman, 'di antara raja-raja' secara alami menyampaikan bahwa ia dimakamkan bersama mereka atau di kawasan makam mereka.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini menyatakan alasan bagi pemakaman terhormat yang baru disebutkan.
- source_word: עָשָׂה טוֹבָה
  choice: ia telah melakukan apa yang baik
  rationale: Ungkapan ini menyatakan perbuatan baik atau bermanfaat. Bentuk ini alami dalam bahasa Indonesia dan tetap cukup luas tanpa mempersempitnya menjadi sekadar kebaikan hati.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi בְ dipertahankan secara lokatif atau sebagai lingkup tempat perbuatan baik itu dilakukan.
- source_word: וְעִם הָאֱלֹהִים
  choice: bagi Allah
  rationale: Walaupun עִם biasanya berarti 'dengan', konstruksi paralel ini menjelaskan pihak yang menerima atau menjadi sasaran kebaikan Yoyada. 'Bagi Allah' lebih alami daripada 'dengan Allah' dalam bahasa Indonesia sambil mempertahankan arah relasional ungkapan tersebut.
- source_word: וּבֵיתוֹ
  choice: dan bagi rumah-Nya
  rationale: Preposisi yang sesuai dipasok dari hubungan paralel sebelumnya. Sufiks orang ketiga tunggal dipertahankan sebagai '-Nya'; konteks paling wajar menunjuk kepada rumah Allah, yakni bait.
theological_decisions:
- issue: Acuan sufiks pada וּבֵיתוֹ ('rumahnya')
  choice: '''rumah-Nya'' mengacu kepada rumah Allah, yaitu bait'
  alternative: '''rumahnya'' mengacu kepada rumah tangga Yoyada sendiri'
  rationale: Allah adalah anteseden langsung, dan konteks naratif berpusat pada pelayanan Yoyada terhadap bait. Terjemahan utama mempertahankan pronomina seperti teks Ibrani, sedangkan catatan kaki menjelaskan acuan yang paling mungkin tanpa mengganti ungkapan itu dengan tafsiran eksplisit.
- issue: Hubungan עִם dengan Allah dan rumah-Nya
  choice: diterjemahkan secara idiomatis sebagai 'bagi Allah, dan bagi rumah-Nya'
  alternative: diterjemahkan lebih harfiah sebagai 'dengan Allah dan rumah-Nya'
  rationale: Ungkapan tersebut menilai kebaikan yang dilakukan Yoyada dalam hubungannya dengan Allah dan bait. Dalam bahasa Indonesia, 'bagi' menyampaikan sasaran manfaat atau pengabdian dengan lebih jelas, sedangkan 'dengan' berisiko menyiratkan kebersamaan yang tidak dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Kota Daud' dan 'rumah-Nya' mempertahankan ungkapan Alkitab yang dikenal, sementara susunan kalimat dibuat alami bagi pembaca umum.
