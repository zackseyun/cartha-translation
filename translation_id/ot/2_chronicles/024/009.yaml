base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: id
  text: Lalu mereka mengumumkan di Yehuda dan Yerusalem agar orang membawa kepada Yahweh pungutan yang ditetapkan Musa, hamba Allah, atas Israel di padang gurun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sumbangan.” Kata Ibrani yang digunakan dapat menunjuk pada persembahan wajib atau pungutan yang telah ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: mereka mengumumkan
  rationale: Ungkapan harfiah 'memberikan suara' dalam konteks ini menunjuk pada penyampaian pengumuman kepada masyarakat. 'Mengumumkan' alami dalam bahasa Indonesia dan mempertahankan sifat publiknya.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִַם
  choice: di seluruh Yehuda dan Yerusalem
  rationale: Preposisi lokatif menyatakan wilayah tempat pengumuman disampaikan. Kata 'seluruh' mengungkapkan cakupan pengumuman secara idiomatis tanpa mengubah kedua nama geografis.
- source_word: לְהָבִיא
  choice: agar orang membawa
  rationale: Infinitif ini menyatakan tujuan atau isi pengumuman. Subjek tak tentu 'orang' menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mempertahankan nama perjanjian יהוה sebagai nama diri, sesuai bentuk sumber dan lapisan konsultasi yang telah diaudit.
- source_word: מַשְׂאַת
  choice: pungutan
  rationale: Nomina ini dapat menunjuk pada kontribusi yang diwajibkan atau dikenakan. 'Pungutan' mempertahankan unsur kewajiban tanpa secara sempit menyamakannya dengan pajak negara modern; alternatif dicatat dalam catatan kaki.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: yang ditetapkan Musa, hamba Allah
  rationale: Hubungan konstruksi mengaitkan pungutan itu dengan Musa. Penambahan relasional 'yang ditetapkan' menjelaskan maksud secara wajar dalam bahasa Indonesia, sementara gelar 'hamba Allah' dipertahankan.
- source_word: עַל יִשְׂרָאֵל
  choice: bagi Israel
  rationale: עַל di sini dapat dipahami sebagai pungutan bagi Israel atau yang dikenakan atas Israel. Teks utama memakai bentuk yang lebih netral, sedangkan kemungkinan nuansa pembebanan dijaga dalam catatan kaki.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: '''Padang gurun'' merupakan padanan baku dan alami untuk lokasi Israel pada zaman Musa.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan pungutan Musa dengan Israel
  choice: bagi Israel
  alternative: yang dikenakan atas Israel
  rationale: Preposisi עַל memungkinkan nuansa rujukan atau pembebanan. Teks utama tidak memaksakan bahwa pungutan itu dikenakan pada Israel, sementara catatan kaki menjaga kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ambiguitas מַשְׂאַת dan עַל dipertahankan melalui catatan kaki.
