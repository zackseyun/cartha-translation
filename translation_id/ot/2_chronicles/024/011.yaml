source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: id
  text: Setiap kali peti itu[a] dibawa oleh orang-orang Lewi ke bawah pengawasan raja, dan ketika mereka melihat bahwa uang di dalamnya sudah banyak, juru tulis raja dan petugas imam kepala datang, lalu mengosongkan peti itu, mengangkatnya, dan mengembalikannya ke tempatnya. Demikianlah yang mereka lakukan hari demi hari, dan mereka mengumpulkan uang[b] dalam jumlah besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, istilah Ibrani ini juga dapat diterjemahkan “tabut”. Di sini yang dimaksud adalah peti pengumpulan persembahan, bukan tabut perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perak”; dalam konteks administratif ini, istilah tersebut menunjuk pada uang yang dikumpulkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: peti
  rationale: Dalam konteks ini, benda tersebut adalah wadah untuk mengumpulkan persembahan, bukan tabut perjanjian. 'Peti' jelas dan alami dalam bahasa Indonesia.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: pengawasan raja
  rationale: פְּקֻדָּה di sini menunjuk pada pengawasan atau tanggung jawab resmi. Ungkapan 'ke bawah pengawasan raja' menyampaikan suasana administratif tanpa menentukan mekanisme pemeriksaan secara berlebihan.
- source_word: בְּיַד הַלְוִיִּם
  choice: orang-orang Lewi membawa
  rationale: Ungkapan בְּיַד menandai perantaraan atau pelaku. Bentuk aktif ini alami dalam bahasa Indonesia dan mempertahankan peran orang Lewi sebagai pembawa peti.
- source_word: וְכִרְאוֹתָם
  choice: ketika mereka melihat
  rationale: Bentuk infinitif dengan akhiran jamak menyatakan waktu. Kata ganti 'mereka' mempertahankan rujukan jamak teks sumber tanpa menggantinya dengan konstruksi pasif.
- source_word: רַב הַכֶּסֶף
  choice: uang di dalamnya sudah banyak
  rationale: כֶּסֶף dapat berarti perak atau uang. Dalam konteks pengumpulan dana, 'uang' paling jelas, sedangkan 'sudah banyak' menyampaikan banyaknya hasil yang telah terkumpul.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: panitera raja
  rationale: סוֹפֵר dalam konteks kerajaan adalah pejabat tulis-menulis atau sekretaris. 'Panitera raja' mempertahankan sifat jabatan historis dan administratifnya.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: petugas imam kepala
  rationale: Rangkaian ini menunjuk pada seorang pejabat atau petugas yang berkaitan dengan dan berada di bawah imam kepala. Pilihan ini tidak menentukan pangkatnya secara lebih khusus daripada teks.
- source_word: וִיעָרוּ
  choice: mengosongkan
  rationale: Kata kerja ini menggambarkan dikeluarkannya isi peti. 'Mengosongkan' merupakan padanan yang tepat dan alami dalam konteks ini.
- source_word: וְיִשָּׂאֻהוּ
  choice: mengangkatnya
  rationale: נשא dapat berarti mengangkat atau membawa. Karena tindakan berikutnya adalah mengembalikan peti ke tempatnya, 'mengangkatnya' menyampaikan urutan tindakan tanpa mengulang gagasan membawa.
- source_word: וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: mengembalikannya ke tempatnya
  rationale: Bentuk kausatif שוב menyatakan tindakan mengembalikan. Padanan ini ringkas dan alami.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: Begitulah yang mereka lakukan hari demi hari
  rationale: Ungkapan לְיוֹם בְּיוֹם menyatakan tindakan yang dilakukan berulang kali. 'Hari demi hari' mempertahankan nuansa iteratif tersebut.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: mereka mengumpulkan uang dalam jumlah besar
  rationale: אָסַף berarti mengumpulkan, dan לָרֹב menekankan kuantitas yang besar. Pilihan ini jelas serta idiomatis dalam bahasa Indonesia.
