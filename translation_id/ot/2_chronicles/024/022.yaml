  rationale: Revisi mengganti ungkapan yudisial yang kurang idiomatis dengan "menuntut pertanggungjawaban", menghilangkan konektor kontras yang tidak dinyatakan secara eksplisit dalam Ibrani, dan menata ulang penanda catatan kaki agar melekat langsung pada unsur yang dijelaskan. Makna, ambiguitas, nama ilahi, serta rujukan anak Yoyada tetap dipertahankan.
