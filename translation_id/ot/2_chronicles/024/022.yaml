source:
  edition: WLC
  text: וְ/לֹא זָכַ֞ר יוֹאָ֣שׁ הַ/מֶּ֗לֶךְ הַ/חֶ֨סֶד֙ אֲשֶׁ֨ר עָשָׂ֜ה יְהוֹיָדָ֤ע אָבִי/ו֙ עִמּ֔/וֹ וַֽ/יַּהֲרֹ֖ג אֶת בְּנ֑/וֹ וּ/כְ/מוֹת֣/וֹ אָמַ֔ר יֵ֥רֶא יְהוָ֖ה וְ/יִדְרֹֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: id
  text: Raja Yoas tidak mengingat kebaikan yang telah ditunjukkan Yoyada, ayahnya[a][b], kepadanya. Ia membunuh anak Yoyada. Menjelang kematiannya, anak itu berkata, “Kiranya Yahweh melihat dan menuntut pertanggungjawaban[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan” atau “kasih setia” yang telah ditunjukkan Yoyada kepadanya.
    reason: lexical_alternative
  - marker: b
    text: Sebutan “ayahnya” kemungkinan mengacu pada peran Yoyada sebagai pelindung dan sosok ayah bagi Yoas, bukan sebagai ayah biologisnya.
    reason: cultural_note
  - marker: c
    text: Kata Ibrani yang diterjemahkan “menuntut pertanggungjawaban” juga dapat berarti menyelidiki suatu kesalahan untuk menuntut pelakunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא זָכַר
  choice: tidak mengingat
  rationale: Mempertahankan ungkapan Ibrani secara langsung; dalam konteks ini tersirat bahwa Yoas tidak menanggapinya dengan rasa syukur dan kesetiaan, tetapi implikasi itu tidak dimasukkan ke dalam terjemahan utama.
- source_word: הַחֶסֶד
  choice: kebaikan
  rationale: חֶסֶד dapat menunjuk pada kebaikan, kesetiaan, atau kasih setia. Dalam hubungan antarmanusia pada ayat ini, 'kebaikan' paling alami dalam bahasa Indonesia modern tanpa menghapus nuansa kesetiaan yang dicatat dalam catatan kaki.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Menerjemahkan bentuk Ibrani secara formal dan mempertahankan gambaran Yoyada sebagai ayah bagi Yoas, sambil menjelaskan dalam catatan kaki bahwa ini kemungkinan bukan hubungan biologis.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: ia membunuh anak Yoyada
  rationale: Kata kerja הרג berarti membunuh. Pengulangan nama Yoyada memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah isi sumber.
- source_word: וּכְמוֹתוֹ
  choice: Saat menjelang ajal
  rationale: Ungkapan temporal ini menggambarkan perkataan yang diucapkan dalam proses kematian; 'saat menjelang ajal' alami, ringkas, dan bermartabat.
- source_word: יֵרֶא יְהוָה
  choice: Kiranya Yahweh melihat
  rationale: Bentuk yiqtol di sini paling wajar dipahami sebagai seruan atau permohonan, bukan sekadar pernyataan masa depan. Nama ilahi dipertahankan sebagai Yahweh.
- source_word: וְיִדְרֹשׁ
  choice: dan meminta pertanggungjawaban
  rationale: דרש dalam konteks pelanggaran dapat berarti menyelidiki atau menuntut pertanggungjawaban. Pilihan ini menyampaikan perhitungan hukum ilahi tanpa mempersempitnya menjadi pembalasan semata.
theological_decisions:
- issue: Sifat seruan terakhir anak Yoyada
  choice: Permohonan agar Yahweh melihat ketidakadilan dan meminta pertanggungjawaban
  alternative: Permohonan langsung untuk membalas dendam, atau pernyataan sederhana bahwa Yahweh akan melihat
  rationale: Bentuk-bentuk verba mendukung seruan jussif, sedangkan דרש memiliki cakupan makna penyelidikan dan tuntutan pertanggungjawaban. Terjemahan mempertahankan bobot penghakiman tanpa menentukan bentuk tindakan ilahi secara lebih sempit daripada teks.
- issue: Sebutan Yoyada sebagai ayah Yoas
  choice: Mempertahankan 'ayahnya' dalam teks utama
  alternative: Mengganti dengan 'pelindungnya', 'pengasuhnya', atau 'yang sudah seperti ayah baginya'
  rationale: Teks Ibrani memakai אָבִיו. Walaupun konteks sejarah menunjukkan peran kebapakan dan bukan paternitas biologis, metafora sumber dipertahankan dan dijelaskan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar hubungan pelaku dan korban jelas bagi pembaca umum. 'Sebaliknya' menampilkan pertentangan yang sudah tersirat antara kebaikan Yoyada dan tindakan Yoas, tanpa menambahkan rincian teologis.
