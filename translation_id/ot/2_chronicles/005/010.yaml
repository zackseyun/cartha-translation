  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: id
  text: Di dalam tabut itu tidak ada apa pun selain kedua loh yang Musa taruh di Horeb.[a] Di sanalah Yahweh mengadakan perjanjian dengan orang Israel[b] ketika mereka keluar dari Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kedua loh yang Musa berikan di Horeb.” Kata Ibrani itu secara harfiah berarti “memberikan,” tetapi dalam konteks ini menunjuk pada tindakan menaruh loh-loh tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Di dalam tabut itu tidak ada apa pun selain
  rationale: Pola Indonesia “tidak ada apa pun selain” menyampaikan negasi eksistensial dan pembatasan רַק secara alami dan tepat.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: kedua loh
  rationale: “Loh” merupakan istilah Indonesia yang lazim untuk לֻחוֹת. Kata “batu” tidak ditambahkan karena tidak dinyatakan dalam ayat ini.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: yang ditaruh Musa di sana
  rationale: Dalam konteks benda yang berada di dalam tabut, נָתַן berfungsi dalam arti menaruh atau menempatkan. “Di sana” memperjelas bahwa kedua loh itu ditaruh di dalam tabut.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Nama tempat Ibrani dipertahankan dan tidak diselaraskan menjadi Sinai.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: Di sanalah Yahweh mengikat perjanjian dengan
  rationale: כָּרַת secara harfiah berarti “memotong”, tetapi bersama gagasan perjanjian merupakan ungkapan baku untuk mengikat atau membuat perjanjian. Perjanjian tersirat dalam teks dan perlu dinyatakan agar alami dalam bahasa Indonesia. “Di sanalah” menghubungkan klausa relatif dengan Horeb.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi diterjemahkan secara langsung sebagai “Yahweh”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel”, tetapi dalam konteks ini menunjuk secara kolektif kepada bangsa atau umat Israel.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: ketika mereka keluar dari Mesir
  rationale: Konstruksi preposisi dengan infinitif menyatakan waktu dan diterjemahkan dengan klausa temporal Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Perjanjian yang tersirat dalam אֲשֶׁר כָּרַת יְהוָה עִם
  choice: mengikat perjanjian
  alternative: secara harfiah, “memotong dengan”
  rationale: Nomina “perjanjian” tidak tertulis dalam klausa ini, tetapi secara idiomatis merupakan objek yang dipahami dari כָּרַת ... עִם. Menyatakannya dalam terjemahan diperlukan agar maksudnya jelas tanpa menambah tafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan klausa relatif Ibrani dibagi menjadi dua kalimat agar hubungan Horeb dengan pengikatan perjanjian jelas dan alami, tanpa menghilangkan isinya.
