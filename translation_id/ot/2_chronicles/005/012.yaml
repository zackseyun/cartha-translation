base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: id
  text: 'Para penyanyi dari antara orang Lewi—semuanya: Asaf, Heman, Yedutun, anak-anak mereka, dan saudara-saudara mereka—mengenakan kain lenan halus, dengan simbal, harpa[a], dan kecapi, berdiri di sebelah timur mazbah[b]. Bersama mereka ada seratus dua puluh imam yang meniup terompet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alat musik sejenis harpa”; perbedaan tepat antara alat-alat musik petik kuno yang disebutkan di sini tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “berdiri di sisi timur mazbah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: Orang-orang Lewi yang menjadi penyanyi
  rationale: Menyatakan kelompok Lewi tertentu berdasarkan peran mereka sebagai penyanyi, sekaligus mempertahankan bentuk definit dan daya deskriptif partisip Ibrani.
- source_word: לְכֻלָּם
  choice: mereka semua
  rationale: Menegaskan bahwa seluruh kelompok yang kemudian dirinci tercakup.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: Asaf, Heman, Yedutun
  rationale: Nama-nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: anak-anak serta saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan dalam teks tanpa mempersempitnya menjadi kategori kelembagaan tertentu.
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: mengenakan lenan halus
  rationale: Mengungkapkan pakaian dari bahan lenan bermutu tinggi dalam bahasa Indonesia yang alami.
- source_word: בִּמְצִלְתַּיִם
  choice: dengan membawa simbal
  rationale: Simbal merupakan padanan yang umum bagi alat musik perkusi ini; 'membawa' membuat hubungan instrumental dalam rangkaian kalimat lebih alami.
- source_word: וּבִנְבָלִים
  choice: harpa
  rationale: Padanan konvensional dan mudah dipahami, sementara ketidakpastian mengenai bentuk tepat alat musik kuno ini dijelaskan dalam catatan kaki.
- source_word: וְכִנֹּרוֹת
  choice: kecapi
  rationale: Membedakannya dari נבל dan memakai nama alat musik petik yang dipahami pembaca Indonesia, meskipun klasifikasi alat musik kunonya tidak sepenuhnya pasti.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: berdiri di sebelah timur mazbah
  rationale: Menyampaikan keterangan tempat secara alami tanpa menentukan jarak dari mazbah.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים
  choice: Bersama mereka ada seratus dua puluh imam
  rationale: Menambahkan kopula eksistensial yang diperlukan dalam bahasa Indonesia sambil mempertahankan jumlah dan hubungan penyertaan.
- source_word: מחצררים בַּחֲצֹצְרוֹת
  choice: yang meniup nafiri
  rationale: Menangkap tindakan memainkan חֲצֹצְרוֹת, yaitu alat tiup logam seremonial yang secara tradisional disebut nafiri.
