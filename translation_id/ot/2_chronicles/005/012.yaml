translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'mazbah' dan 'nafiri' dipertahankan karena ketepatan konteks ibadah kuno, sedangkan susunan kalimat disederhanakan agar mudah dipahami. Penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkannya.
