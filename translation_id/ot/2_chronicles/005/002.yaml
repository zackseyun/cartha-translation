reference: 2 Chronicles 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: id
  text: Kemudian Salomo mengumpulkan para tua-tua Israel dan semua kepala suku, yaitu kepala-kepala kaum leluhur bani Israel[a], di Yerusalem untuk membawa naik tabut perjanjian Yahweh dari kota Daud, yaitu Sion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel.” Secara harfiah, bahasa Ibrani memakai ungkapan “anak-anak Israel,” yang menonjolkan identitas mereka sebagai keturunan Israel.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “yang adalah Sion.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda urutan waktu dalam narasi; “Kemudian” alami dalam bahasa Indonesia dan mempertahankan kesinambungan peristiwa.
- source_word: יַקְהֵיל
  choice: mengumpulkan
  rationale: Bentuk hifil dari קהל berarti menyebabkan orang berkumpul atau menghimpun mereka. “Mengumpulkan” jelas dan wajar dengan Salomo sebagai subjek.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Sebutan baku bagi kelompok pemimpin senior yang diakui di Israel; bentuk jamak ditandai secara alami dengan “para”.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: semua kepala suku
  rationale: Dalam konteks susunan kepemimpinan Israel, מַטּוֹת menunjuk pada suku-suku, bukan tongkat. “Kepala suku” mempertahankan metafora kepemimpinan.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: para pemimpin kaum-kaum leluhur
  rationale: נְשִׂיאֵי menunjuk kepada pemimpin atau kepala, sedangkan הָאָבוֹת merujuk pada kelompok keluarga berdasarkan garis leluhur. Ungkapan ini alami sekaligus mempertahankan struktur kekerabatan teks.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang dikenal dan mempertahankan nuansa keturunan serta identitas perjanjian dalam ungkapan Ibrani “anak-anak Israel,” tanpa membatasinya hanya kepada laki-laki yang hadir.
- source_word: אֶל יְרוּשָׁלָם
  choice: di Yerusalem
  rationale: Walaupun אֶל biasanya menyatakan arah, bersama tindakan menghimpun ungkapan ini secara idiomatis menyatakan tempat mereka dikumpulkan. “Di Yerusalem” paling alami dalam bahasa Indonesia.
- source_word: לְהַעֲלוֹת
  choice: untuk membawa naik
  rationale: Kata עלה memuat arah gerak ke atas menuju tempat yang lebih tinggi. “Membawa naik” mempertahankan unsur arah itu.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Terjemahan ini mempertahankan hubungan konstruksi Ibrani dan makna perjanjian, dengan nama ilahi dinyatakan secara langsung.
- source_word: מֵעִיר דָּוִיד
  choice: dari Kota Daud
  rationale: Padanan lokatif yang langsung dan jelas; kapitalisasi menandai “Kota Daud” sebagai nama tempat.
- source_word: הִיא צִיּוֹן
  choice: yaitu Sion
  rationale: Frasa ini memberi keterangan aposisional yang mengidentifikasi Kota Daud dengan Sion dalam konteks ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memuat Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian ilahi dan membedakannya dari gelar umum “Tuhan”.
- issue: Penggambaran struktur kekerabatan Israel dalam לִבְנֵי יִשְׂרָאֵל dan הָאָבוֹת
  choice: bani Israel dan kaum-kaum leluhur
  alternative: orang Israel dan keluarga-keluarga Israel
  rationale: Konteks menyebut susunan suku dan kelompok keluarga. Pilihan utama mempertahankan dimensi keturunan dan struktur leluhur tanpa membuat bahasa Indonesia menjadi tidak wajar.
- issue: Hubungan הִיא צִיּוֹן dengan Kota Daud
  choice: yaitu Sion
  alternative: yang adalah Sion
  rationale: Kedua bentuk dapat mencerminkan konstruksi Ibrani. “Yaitu Sion” membacanya sebagai penjelasan aposisional tanpa menambahkan kesimpulan geografis atau teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan bermartabat. Istilah “para tua-tua,” “kepala suku,” “tabut perjanjian,” dan “Sion” dipertahankan karena dikenal dalam ragam Alkitabiah, sedangkan susunan kalimat dibuat tetap alami bagi pembaca umum.
