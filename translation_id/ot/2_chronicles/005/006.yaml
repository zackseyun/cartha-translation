base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: id
  text: 'Raja Salomo dan segenap umat Israel yang berhimpun bersamanya[a] di hadapan tabut itu sedang mempersembahkan korban dari kambing domba[b] dan sapi yang tidak dapat dihitung maupun dibilang karena jumlahnya sangat banyak.


    [a] Ungkapan Ibrani ini juga dapat diterjemahkan “yang berhimpun di hadapannya.” Maksudnya dapat dipahami bahwa umat itu berhimpun bersama Salomo atau di hadapannya.


    [b] Kata Ibrani yang diterjemahkan “kambing domba” adalah istilah umum bagi ternak kecil, terutama domba dan kambing.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “yang berhimpun di hadapannya.” Maksudnya dapat dipahami bahwa umat itu berhimpun bersama Salomo atau di hadapannya.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kambing domba” adalah istilah umum bagi ternak kecil, terutama domba dan kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: segenap umat Israel
  rationale: Menunjukkan seluruh komunitas Israel sebagai kelompok yang berhimpun, dengan bahasa Indonesia yang alami dan tidak terlalu bernuansa kelembagaan atau gerejawi.
- source_word: הַנּוֹעָדִים
  choice: yang berhimpun
  rationale: Partisipel Nifal ini menggambarkan umat yang berkumpul atau berhimpun; bentuk “yang berhimpun” mempertahankan fungsi deskriptifnya dengan ragam yang wajar dan bermartabat.
- source_word: עָלָיו
  choice: bersamanya
  rationale: Dalam konteks perhimpunan, preposisi ini dapat menunjukkan bahwa umat berhimpun bersama Salomo. Karena ungkapannya juga mungkin berarti mereka berhimpun di hadapannya, alternatif itu dipertahankan dalam catatan kaki.
- source_word: לִפְנֵי הָאָרוֹן
  choice: di hadapan tabut itu
  rationale: Terjemahan spasial langsung yang jelas. Kata “itu” menandai tabut tertentu yang sudah dikenal dari konteks tanpa menambahkan “perjanjian,” yang tidak terdapat dalam ayat ini.
- source_word: מְזַבְּחִים
  choice: sedang mempersembahkan
  rationale: Partisipel menggambarkan tindakan yang tengah berlangsung. Dalam konteks ini, “mempersembahkan” secara alami menyampaikan tindakan pengurbanan terhadap hewan-hewan tersebut.
- source_word: צֹאן וּבָקָר
  choice: kambing domba dan sapi
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, khususnya domba dan kambing, sedangkan בָּקָר adalah sapi. “Kambing domba dan sapi” cukup alami sekaligus mempertahankan cakupan kedua kelompok hewan.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: yang tidak dapat dihitung ataupun ditentukan jumlahnya
  rationale: Mempertahankan dua verba Ibrani yang hampir bersinonim sebagai penegasan, tanpa menghasilkan pengulangan bahasa Indonesia yang janggal.
- source_word: מֵרֹב
  choice: karena begitu banyak
  rationale: Menyatakan sebab hewan-hewan itu tidak dapat dihitung dengan ungkapan Indonesia yang jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Segenap umat Israel” menghindari kesan teknis atau gerejawi, sedangkan “sedang mempersembahkan” menjaga aspek tindakan yang berlangsung. Ambiguitas עָלָיו dan keluasan makna צֹאן dipertahankan melalui catatan kaki.
