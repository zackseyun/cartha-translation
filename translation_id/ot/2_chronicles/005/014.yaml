  text: וְ/לֹא יָֽכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמ֥וֹד לְ/שָׁרֵ֖ת מִ/פְּנֵ֣י הֶ/עָנָ֑ן כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית הָ/אֱלֹהִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: id
  text: dan para imam tidak dapat berdiri untuk melayani karena awan itu, sebab kemuliaan Yahweh memenuhi rumah Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bait Allah.” Secara harfiah, “rumah Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: dapat
  rationale: Kata kerja ini menyatakan kemampuan; bentuk negatif “tidak dapat” secara alami menyampaikan ketidakmampuan para imam.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Bentuk jamak definit ini menunjuk kepada imam-imam yang bertugas di tempat ibadah.
- source_word: לַעֲמוֹד
  choice: berdiri
  rationale: Mempertahankan gambaran konkret dari עמד tanpa mempersempit maknanya menjadi tafsiran seperti “tetap berada di tempat”.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Dalam konteks keimaman, שרת mengacu pada pelaksanaan pelayanan ibadah; “melayani” alami dan tetap cukup luas dalam bahasa Indonesia.
- source_word: מִפְּנֵי
  choice: karena
  rationale: 'Dalam konteks ini preposisi tersebut menyatakan sebab: awan itu mengakibatkan para imam tidak dapat berdiri untuk melayani.'
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Nomina definit ini merujuk pada awan yang hadir dalam narasi; “itu” menandai rujukan tertentu secara alami.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan bagi ketidakmampuan para imam untuk melayani.
- source_word: מָלֵא
  choice: memenuhi
  rationale: Bentuk aktif ini mempertahankan susunan Ibrani, dengan “kemuliaan Yahweh” sebagai subjek dan rumah Allah sebagai objek.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: Menerjemahkan frasa konstruksi secara langsung dan mempertahankan nama ilahi sebagai nama pribadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi nama ilahi mempertahankan nama yang secara eksplisit terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Mencerminkan ungkapan Ibrani secara langsung; dalam konteks ini ungkapan tersebut merujuk pada Bait Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan fungsi nama pribadi tanpa menggantinya dengan gelar.
- issue: Makna בֵּית הָאֱלֹהִים
  choice: rumah Allah
  alternative: Bait Allah
  rationale: “Rumah Allah” mempertahankan bentuk leksikal teks Ibrani, sedangkan “Bait Allah” menyatakan rujukan kontekstualnya secara lebih khusus; alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konjungsi awal “dan” dipertahankan karena ayat ini melanjutkan kalimat serta rangkaian peristiwa sebelumnya. Istilah “para imam,” “melayani,” dan “kemuliaan” mudah dipahami sekaligus sesuai dengan konteks ibadah.
