source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: id
  text: Kemudian para imam membawa tabut perjanjian Yahweh ke tempatnya, ke ruang terdalam Bait itu, ke Ruang Mahakudus[a], di bawah sayap para kerub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tempat Yang Mahakudus.”
    reason: Alternatif leksikal untuk ungkapan superlatif Ibrani קֹדֶשׁ הַקְּדָשִׁים.
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: membawa
  rationale: Bentuk Hifil dari בוא berarti ‘membawa’ atau ‘membuat masuk’; ‘membawa’ alami dalam urutan narasi ini tanpa menambahkan cara pengangkutannya.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Nomina jamak tentu ini secara langsung menunjuk kepada para imam yang bertugas dalam pemasangan tabut di Bait.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Mempertahankan hubungan konstruksi Ibrani dan menyatakan kaitan tabut itu dengan perjanjian Yahweh secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam Tetragramaton sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: מְקוֹמוֹ
  choice: tempatnya
  rationale: Akhiran pronominal mengacu kepada tabut; pilihan ini ringkas dan tidak menambahkan gagasan ‘yang semestinya’ meskipun tempat yang ditetapkan tersirat oleh konteks.
- source_word: דְּבִיר הַבַּיִת
  choice: ruang terdalam Bait itu
  rationale: דְּבִיר menunjuk kepada ruang paling dalam dari bangunan suci. ‘Bait’ menyampaikan bahwa הַבַּיִת dalam konteks ini adalah rumah ibadah Yahweh, bukan rumah biasa.
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: Ruang Mahakudus
  rationale: Konstruksi harfiah ‘kudusnya segala yang kudus’ berfungsi sebagai ungkapan superlatif, yaitu ruang yang paling kudus. Bentuk ini jelas dan lazim dalam bahasa Indonesia.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: di bawah sayap para kerub
  rationale: Menerjemahkan relasi tempat secara langsung; ‘kerub’ dipertahankan sebagai transliterasi konvensional bagi makhluk surgawi tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Makna superlatif קֹדֶשׁ הַקְּדָשִׁים
  choice: Ruang Mahakudus
  alternative: Tempat Yang Mahakudus atau Yang Kudus dari Segala yang Kudus
  rationale: Ungkapan konstruksi ini paling wajar dipahami sebagai superlatif Ibrani. Terjemahan utama menyampaikan fungsinya sebagai ruang terdalam yang paling kudus tanpa memperluas makna teologisnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Pengulangan frasa berpreposisi ‘ke’ dipertahankan untuk mencerminkan susunan bertahap teks Ibrani: tempat tabut, ruang terdalam Bait, lalu Ruang Mahakudus. ‘Bait’ dipakai sebagai istilah kontekstual bagi rumah ibadah, sedangkan ‘para kerub’ menghindari bentuk jamak berulang yang terasa kurang anggun.'
