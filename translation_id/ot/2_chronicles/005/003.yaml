base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/003.yaml
  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: id
  text: Maka semua orang Israel berkumpul menghadap raja pada hari raya itu, yaitu pada bulan ketujuh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: Maka ... berkumpul
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “maka” menyatakan kesinambungan, sedangkan “berkumpul” menerjemahkan makna nifal dari קהל.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: semua orang Israel
  rationale: Ungkapan ini bersifat kolektif dan secara alami merujuk kepada orang-orang Israel, bukan hanya laki-laki dewasa.
- source_word: אֶל הַמֶּלֶךְ
  choice: menghadap raja
  rationale: Dalam konteks berkumpul kepada seorang raja, “menghadap” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan arah pertemuan.
- source_word: בֶּחָג
  choice: pada hari raya itu
  rationale: חַג menunjuk perayaan keagamaan; artikel tertentu diterjemahkan dengan “itu” tanpa menentukan nama perayaannya, karena teks ayat ini tidak menyebutkannya.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: yaitu pada bulan ketujuh
  rationale: Klausa ini mengidentifikasi waktu hari raya tersebut. Kata depan “pada” ditambahkan secara idiomatis dalam bahasa Indonesia.
