  source_fidelity: 'Makna kausatif וַיַּאֲרִיכוּ, ujung-ujung tiang, kontras antara tampak di depan ruang terdalam dan tidak tampak dari luar, serta idiom keberlanjutan hingga masa penulis sudah pada dasarnya terpelihara. Namun, frasa "terlihat dari tabut di depan" tidak jelas dalam bahasa Indonesia: frasa itu mudah dibaca seolah-olah tabut adalah tempat pengamatan. Susunan perlu diperjelas agar מִן־הָאָרוֹן menyatakan bahwa ujung-ujung tiang itu tampak keluar dari tabut, tanpa menjelaskan mekanisme secara berlebihan.'
