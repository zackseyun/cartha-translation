base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: id
  text: Tiang-tiang pengusung itu dibuat begitu panjang sehingga ujung-ujungnya tampak keluar dari tabut, di depan Ruang Mahakudus,[a] tetapi tidak tampak dari luar. Tiang-tiang itu tetap di sana hingga hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ruang dalam" untuk "Ruang Mahakudus".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: dibuat begitu panjang
  rationale: Bentuk Hifil menyatakan tindakan kausatif, yaitu kayu-kayu pengusung dibuat atau diulurkan menjadi panjang; ungkapan ini alami dalam bahasa Indonesia dan cocok dengan klausa akibat berikutnya.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung
  rationale: Istilah ini menunjuk pada batang-batang yang dipakai untuk mengusung tabut. Pilihan ini lebih jelas daripada sekadar 'kayu-kayu' dan lebih alami daripada istilah arkais.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: ujung-ujungnya terlihat
  rationale: רָאשֵׁי secara harfiah berarti 'kepala-kepala', tetapi untuk benda panjang secara alami berarti ujung-ujungnya; bentuk Nifal dipertahankan sebagai keadaan terlihat.
- source_word: מִן הָאָרוֹן
  choice: dari tabut
  rationale: Preposisi מִן dipertahankan secara langsung sebagai 'dari', tanpa menentukan lebih jauh apakah ujung-ujung itu mencuat keluar atau dilihat dari titik tersebut.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: di depan Ruang Mahakudus
  rationale: עַל פְּנֵי dalam konteks ruang berarti 'di depan', sedangkan דְּבִיר menunjuk pada ruang terdalam Bait Allah, yakni Ruang Mahakudus.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: tetapi tidak terlihat dari luar
  rationale: Terjemahan ini mempertahankan pertentangan mengenai keterlihatan sambil mengungkapkan arah atau lokasi luar secara alami dalam bahasa Indonesia.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: Kayu-kayu itu tetap di sana sampai hari ini
  rationale: Walaupun verba Ibraninya tunggal, konstruksi ini menyatakan keberadaan berkelanjutan. Subjek diperjelas dalam bahasa Indonesia, dan idiom waktunya diterjemahkan secara lazim.
theological_decisions:
- issue: Makna דְּבִיר sebagai istilah ruang kudus terdalam
  choice: Ruang Mahakudus
  alternative: ruang dalam
  rationale: Dalam konteks Bait Allah, istilah ini menunjuk pada ruang terdalam. 'Ruang Mahakudus' menyampaikan rujukan itu dengan jelas, sementara catatan kaki mempertahankan padanan arsitektural yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Kayu-kayu pengusung' dipakai agar fungsi benda jelas, sedangkan struktur kalimat mempertahankan urutan spasial dan kontras keterlihatan dalam teks Ibrani.
