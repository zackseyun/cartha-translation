reference: 2 Chronicles 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: id
  text: Demikianlah seluruh pekerjaan yang dilakukan Salomo untuk rumah Yahweh telah selesai. Kemudian Salomo membawa masuk barang-barang kudus Daud, ayahnya[a], serta perak, emas, dan segala perlengkapan. Ia menaruh semuanya di dalam perbendaharaan rumah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “barang-barang yang dipersembahkan oleh Daud, ayahnya” atau “barang-barang yang dikhususkan oleh Daud, ayahnya.”'
    reason: Alternatif leksikal untuk קָדְשֵׁי דָּוִיד; bentuk genitifnya dapat menunjuk pada benda-benda kudus yang terkait dengan Daud, termasuk benda yang ia persembahkan atau khususkan.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: selesai
  rationale: Bentuk verba dari שלם menyatakan bahwa seluruh pekerjaan itu mencapai penyelesaian; konstruksi “pekerjaan ... selesai” alami dalam bahasa Indonesia dan mempertahankan nuansa resultatif.
- source_word: כָּל הַמְּלָאכָה
  choice: seluruh pekerjaan
  rationale: מְלָאכָה mencakup keseluruhan proyek pembangunan dan perlengkapan rumah ibadah; “seluruh pekerjaan” jelas dan wajar.
- source_word: לְבֵית יְהוָה
  choice: untuk rumah Yahweh
  rationale: “Rumah” mempertahankan citra בַּיִת, sedangkan “Yahweh” menampilkan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: וַיָּבֵא
  choice: membawa masuk
  rationale: Bentuk Hifil dari בוא menyatakan tindakan membawa sesuatu masuk, sesuai dengan pemindahan barang-barang ke perbendaharaan.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: barang-barang kudus milik Daud, ayahnya
  rationale: קָדְשֵׁי menunjuk kepada benda-benda yang dikhususkan bagi penggunaan sakral. Terjemahan utama mempertahankan ungkapan “kudus” dan catatan kaki menjelaskan kemungkinan nuansa “dipersembahkan/dikhususkan”.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: perak, emas
  rationale: Daftar ringkas ini alami dalam bahasa Indonesia; definiteness bahasa Ibrani tidak perlu dinyatakan dengan kata sandang tersendiri.
- source_word: כָּל הַכֵּלִים
  choice: segala perlengkapan
  rationale: כֵּלִים adalah istilah luas bagi benda, perkakas, atau bejana. “Perlengkapan” mencakup beragam barang rumah ibadah tanpa mempersempitnya hanya menjadi wadah.
- source_word: נָתַן
  choice: menaruh
  rationale: Dalam konteks penyimpanan benda berharga, נתן berarti menempatkan atau menaruh; “menaruh” merupakan padanan yang langsung dan alami.
- source_word: בְּאֹצְרוֹת
  choice: di dalam perbendaharaan
  rationale: אֹצָר dapat menunjuk tempat penyimpanan harta. Bentuk Indonesia “perbendaharaan” dapat berfungsi kolektif, meskipun teks Ibrani memakai bentuk jamak.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Padanan ini mempertahankan citra “rumah” serta variasi antara nama Yahweh pada bagian awal dan sebutan Allah pada bagian akhir.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Perbedaan antara בֵּית יְהוָה dan בֵּית הָאֱלֹהִים
  choice: mempertahankan “rumah Yahweh” dan “rumah Allah”
  alternative: menyamakan keduanya menjadi “Bait Allah”
  rationale: Pembedaan ungkapan dalam sumber dipertahankan agar variasi nama ilahi dan citra “rumah” tidak diratakan.
- issue: Makna קָדְשֵׁי sebagai kekudusan atau tindakan pengkhususan
  choice: barang-barang kudus milik Daud
  alternative: barang-barang yang dipersembahkan atau dikhususkan oleh Daud
  rationale: Bentuk Ibrani dapat menyoroti status sakral benda-benda itu, sementara hubungan genitif dengan Daud tidak secara eksplisit menyatakan agen. Terjemahan utama menjaga ambiguitas tersebut dan alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat mudah dibaca sambil mempertahankan citra “rumah”, variasi sebutan ilahi, urutan daftar benda, dan ambiguitas hubungan barang-barang kudus dengan Daud.
