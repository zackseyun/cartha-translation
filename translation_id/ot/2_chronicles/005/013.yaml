  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: id
  text: 'Lalu terjadilah, ketika para peniup terompet dan para penyanyi berpadu menjadi satu untuk memperdengarkan satu suara, untuk memuji dan mengucap syukur kepada Yahweh, dan ketika mereka mengangkat suara dengan terompet, simbal, dan alat-alat musik untuk nyanyian, sambil memuji Yahweh: “Sebab Dia baik, sebab kasih setia-Nya untuk selama-lamanya,” rumah itu, rumah Yahweh, dipenuhi awan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu terjadilah
  rationale: Menandai terjadinya peristiwa dalam alur narasi tanpa memakai ungkapan yang kaku atau arkais.
- source_word: כְאֶחָד
  choice: berpadu menjadi satu
  rationale: Menjaga gambaran kesatuan tindakan dan mengalir secara alami menuju frasa 'satu suara'.
- source_word: למחצצרים ולמשׁררים
  choice: para peniup nafiri dan para penyanyi
  rationale: Membedakan pemain nafiri dari para pelantun vokal; 'nafiri' sesuai dengan חֲצֹצְרוֹת, yakni trompet logam dalam konteks ibadah Israel.
- source_word: להשמיע קול אחד
  choice: untuk memperdengarkan satu suara
  rationale: Mempertahankan unsur kausatif השמיע dan gambaran konkret tentang bunyi yang menyatu.
- source_word: להלל ולהודות
  choice: dalam memuji dan mengucap syukur
  rationale: Mempertahankan kedua tindakan yang berbeda dan fungsi tujuan/cara dalam kalimat.
- source_word: וכהרים קול
  choice: ketika mereka mengangkat suara
  rationale: Ungkapan Indonesia yang wajar, sambil mempertahankan bentuk tunggal kolektif קול.
- source_word: בחצצרות ובמצלתים ובכלי השיר
  choice: dengan nafiri, ceracap, dan alat-alat musik
  rationale: Menghasilkan daftar alat yang jelas dan alami; כלי השיר merujuk secara umum pada alat untuk musik atau nyanyian.
- source_word: כי טוב כי לעולם חסדו
  choice: Sebab Dia baik, sebab kasih setia-Nya untuk selama-lamanya
  rationale: Menjaga bentuk liturgis dan menerjemahkan חֶסֶד sebagai kasih yang teguh dan loyal tanpa membatasinya hanya pada belas kasihan.
- source_word: והבית מלא ענן בית יהוה
  choice: rumah itu, rumah Yahweh, dipenuhi awan
  rationale: Mempertahankan pengulangan aposisional 'rumah ... rumah Yahweh' dan ketakrifan awan yang tidak dinyatakan dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian yang hadir langsung dalam teks dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- issue: Makna חַסְדּוֹ dalam seruan liturgis
  choice: kasih setia-Nya
  alternative: belas kasih-Nya
  rationale: '''Kasih setia'' mempertahankan cakupan kasih, loyalitas, dan keteguhan relasional dari חֶסֶד tanpa mengunci maknanya pada satu nuansa saja.'
- issue: Hubungan ujaran liturgis dengan frasa וּבְהַלֵּל
  choice: kutipan ditempatkan langsung sesudah 'sambil memuji Yahweh'
  alternative: menambahkan 'dan berkata'
  rationale: Bahasa Ibrani tidak memuat verba eksplisit 'berkata'. Susunan langsung menjaga ketegangan sintaksis sumber tanpa memasukkan unsur yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Nafiri' dan 'ceracap' dipakai sebagai istilah alat musik ibadah yang cukup dikenal dalam ragam Alkitab, sedangkan struktur kalimat tetap dibuat dapat dipahami pembaca umum. Pengulangan 'rumah itu, rumah Yahweh' sengaja dipertahankan karena mencerminkan penegasan dalam teks Ibrani.
