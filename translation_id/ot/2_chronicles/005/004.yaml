  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: id
  text: Semua tua-tua Israel datang, dan orang-orang Lewi mengangkat tabut itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah Tabut Perjanjian, sebagaimana jelas dari konteks di sekitarnya.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: pun datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan rangkaian peristiwa. Ungkapan “pun datang” alami dalam narasi Indonesia dan tetap mempertahankan tindakan kedatangan tanpa menambahkan gagasan lain.
- source_word: כֹּל
  choice: semua
  rationale: Menyatakan keseluruhan kelompok tua-tua Israel secara langsung dan wajar.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: tua-tua Israel
  rationale: Istilah “tua-tua” merupakan sebutan Indonesia yang lazim bagi para pemimpin atau wakil resmi suatu umat dan mempertahankan bentuk kelompok dalam konstruksi Ibrani.
- source_word: וַיִּשְׂאוּ
  choice: mengusung
  rationale: Dalam konteks pemindahan tabut, נשׂא berarti membawa dengan mengangkat. “Mengusung” menyampaikan cara membawa benda penting ini secara lebih tepat daripada “membawa” yang terlalu umum.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Bentuk ini jelas dan alami bagi pembaca Indonesia serta menunjuk kelompok keturunan Lewi yang bertugas dalam ibadah.
- source_word: אֶת הָאָרוֹן
  choice: tabut itu
  rationale: אָרוֹן dalam konteks ini menunjuk tabut yang telah disebut sebelumnya. “Tabut itu” mempertahankan bentuk ringkas teks Ibrani tanpa menambahkan “perjanjian” ke dalam teks utama.
theological_decisions:
- issue: Identitas tabut
  choice: tabut itu
  alternative: Tabut Perjanjian
  rationale: Teks Ibrani ayat ini hanya menyebut הָאָרוֹן, “tabut itu”. Konteks mengidentifikasikannya sebagai Tabut Perjanjian, tetapi keterangan tersebut tidak ditambahkan ke teks utama agar terjemahan tidak melampaui bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-khidmat. “Lalu” menandai kelanjutan tindakan kedua, sedangkan “mengusung” cocok untuk pemindahan tabut tanpa memakai ungkapan yang terlalu arkais.
