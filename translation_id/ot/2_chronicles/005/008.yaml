  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: id
  text: Para kerub itu sedang membentangkan sayap mereka di atas tempat tabut itu[a], dan para kerub itu menutupi tabut serta batang-batang pengusungnya dari atas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengembangkan sayap mereka di atas tempat tabut itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: membentangkan
  rationale: Konstruksi היה dengan partisipel menggambarkan keadaan atau tindakan yang sedang berlangsung. Dalam bahasa Indonesia, verba aktif dalam konteks ini secara alami menyampaikan bahwa sayap mereka berada dalam keadaan terbentang.
- source_word: הַכְּרוּבִים
  choice: para kerub
  rationale: “Kerub” adalah bentuk serapan yang mapan bagi makhluk penjaga takhta ini; “para” menandai bentuk jamak Ibrani secara alami.
- source_word: כְּנָפַיִם
  choice: sayap mereka
  rationale: Pronomina “mereka” disediakan secara wajar dalam bahasa Indonesia karena sayap itu milik para kerub.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: di atas tempat tabut itu
  rationale: Terjemahan ini mempertahankan kata מָקוֹם, “tempat,” dan tidak menyederhanakannya menjadi sekadar “di atas tabut,” sebab klausa berikutnya menyebut tabut secara langsung.
- source_word: וַיְכַסּוּ
  choice: menutupi
  rationale: כסה pada dasarnya berarti “menutupi”; pilihan ini lebih langsung daripada “menaungi,” yang dapat menambahkan nuansa tafsiran.
- source_word: בַּדָּיו
  choice: batang-batang pengusungnya
  rationale: Yang dimaksud ialah batang atau galah untuk mengusung tabut. Bentuk ini jelas dalam bahasa Indonesia modern dan membedakannya dari tiang biasa.
- source_word: מִלְמָעְלָה
  choice: dari atas
  rationale: Ungkapan ini mempertahankan arah atau posisi penutupan yang dinyatakan oleh bentuk Ibrani.
