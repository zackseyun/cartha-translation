  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: id
  text: Ketika para imam keluar dari Tempat Kudus—sebab semua imam yang hadir telah menguduskan diri, tanpa memedulikan kelompok-kelompok pelayanan mereka[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanpa mengikuti pembagian-pembagian mereka,” yaitu tanpa mengikuti kelompok atau giliran pelayanan imam yang biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Ketika ... keluar
  rationale: Konstruksi naratif dengan infinitif bertanda בְּ membentuk anak kalimat waktu. Bahasa Indonesia alami tidak perlu menerjemahkan וַיְהִי secara tersendiri.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan wajar bagi bentuk jamak כהנים.
- source_word: מִן הַקֹּדֶשׁ
  choice: dari Tempat Kudus
  rationale: Dalam konteks Bait Allah, הַקֹּדֶשׁ menunjuk pada ruang kudus tertentu, bukan kekudusan sebagai gagasan abstrak.
- source_word: כִּי
  choice: sebab
  rationale: Menandai penjelasan atas keadaan yang disebutkan, dan cocok dalam klausa sisipan.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: semua imam yang hadir
  rationale: Partisipel מצא di sini secara idiomatis menunjuk kepada mereka yang berada atau tersedia di tempat itu.
- source_word: הִתְקַדָּשׁוּ
  choice: telah menguduskan diri
  rationale: Bentuk hitpael menyatakan tindakan mempersiapkan atau mengkhususkan diri secara ritual. Ungkapan ini mempertahankan citra kekudusan dalam teks sumber dan tetap mudah dipahami.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: tanpa mengikuti pembagian kelompok tugas
  rationale: Ungkapan ini secara harfiah menyatakan tidak dipatuhinya pembagian-pembagian yang berlaku. Penambahan 'kelompok tugas' menjernihkan bahwa yang dimaksud ialah kelompok pelayanan imam, bukan pembagian ruang atau benda.
theological_decisions:
- issue: Istilah persiapan ritual para imam
  choice: telah menguduskan diri
  alternative: telah menyucikan diri
  rationale: Konteksnya adalah persiapan ritual untuk pelayanan di Bait Allah. 'Menguduskan diri' mempertahankan hubungan leksikal dengan akar קדש tanpa mengubahnya menjadi pernyataan mengenai kesempurnaan moral.
- issue: Pembagian pelayanan imam
  choice: tanpa mengikuti pembagian kelompok tugas
  alternative: tanpa mengindahkan rombongan mereka
  rationale: Teks menunjukkan bahwa tata kelompok atau giliran imam yang normal tidak diberlakukan pada kesempatan ini. Terjemahan tidak menentukan lebih jauh apakah tekanannya terutama pada jadwal, giliran, atau susunan kelompok.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan struktur klausa penjelas yang belum selesai karena ayat ini berlanjut ke ayat berikutnya. Istilah 'Tempat Kudus' dipakai sebagai nama ruang dalam Bait Allah.
