  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: id
  text: Lalu mereka membawa naik tabut, Kemah Pertemuan, dan semua perlengkapan kudus yang ada di dalam kemah itu. Para imam Lewi[a] membawa semuanya naik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “para imam, orang-orang Lewi.”'
    reason: Mempertahankan kemungkinan pembacaan aposisional dari frasa Ibrani הַכֹּהֲנִים הַלְוִיִּם.
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: membawa naik
  rationale: Bentuk Hifil dari עלה menyatakan tindakan membuat sesuatu naik atau membawanya ke tempat yang lebih tinggi. Ungkapan ini mempertahankan arah gerak dan pengulangan dalam teks Ibrani.
- source_word: הָאָרוֹן
  choice: tabut
  rationale: Teks hanya menyebut 'tabut', bukan frasa lengkap 'tabut perjanjian'; bentuk singkat ini setia kepada sumber dan jelas dari konteks.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan ini mempertahankan unsur 'kemah' dan fungsi tempat pertemuan dalam ungkapan Ibrani, sekaligus merupakan istilah yang wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: semua perlengkapan kudus
  rationale: כְּלִים mencakup berbagai benda, perkakas, atau peralatan. 'Perlengkapan' cukup luas untuk konteks tempat suci dan tidak membatasinya hanya pada bejana.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: yang ada di dalam kemah itu
  rationale: Klausa relatif ini menerangkan lokasi perlengkapan kudus. Kata 'itu' merujuk secara alami kepada Kemah Pertemuan yang baru disebut.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  rationale: Ungkapan ringkas ini dapat dipahami sebagai para imam yang berasal dari suku Lewi tanpa menyamakan semua orang Lewi dengan imam. Catatan kaki mempertahankan bentuk aposisional Ibrani yang lebih harfiah.
- source_word: אֹתָם
  choice: semuanya
  rationale: Pronomina ini merujuk kembali kepada tabut, kemah, dan perlengkapan kudus. 'Semuanya' alami dalam bahasa Indonesia dan memperjelas cakupan jamaknya.
theological_decisions:
- issue: Hubungan antara 'para imam' dan 'orang-orang Lewi' dalam הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  alternative: para imam, orang-orang Lewi
  rationale: Teks utama memakai ungkapan Indonesia yang alami dan dapat menunjuk kepada para imam dari kalangan Lewi, tetapi catatan kaki mempertahankan susunan aposisional sumber. Dengan demikian, perbedaan antara imam dan golongan Lewi secara umum tidak dihapus, sementara ketegangan gramatikal teks tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Istilah tradisional yang masih umum seperti 'tabut' dipertahankan, sedangkan כְּלִים diterjemahkan dengan kata luas 'perlengkapan'. Kapitalisasi 'Kemah Pertemuan' menandai nama yang lazim bagi tempat ibadah tersebut.
