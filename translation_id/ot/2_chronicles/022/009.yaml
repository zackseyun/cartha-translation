  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: id
  text: Lalu Yehu mencari Ahazia. Mereka menangkap Ahazia ketika ia sedang bersembunyi di Samaria, lalu membawanya kepada Yehu dan membunuhnya.[a] Kemudian mereka menguburkannya, sebab mereka berkata, “Ia adalah anak Yosafat, yang mencari Yahweh dengan segenap hatinya.” Keluarga Ahazia tidak mempunyai kekuatan untuk mempertahankan kerajaan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka menyebabkan dia mati”; “membunuhnya” merupakan terjemahan idiomatis.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Keluarga Ahazia tidak mempunyai kekuatan untuk memegang kekuasaan kerajaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ אֶת אֲחַזְיָהוּ
  choice: Lalu Yehu mencari Ahazia
  rationale: בקש berarti mencari atau berusaha menemukan. Subjek tunggalnya secara kontekstual adalah Yehu, meskipun namanya tidak diulang dalam klausa Ibrani.
- source_word: וַיִּלְכְּדֻהוּ
  choice: Mereka menangkap Ahazia
  rationale: Bentuk jamak dipertahankan untuk para pelaksana yang menangkap Ahazia; nama diulang agar pergantian dari subjek tunggal ke jamak tetap jelas dalam bahasa Indonesia.
- source_word: וְהוּא מִתְחַבֵּא בְשֹׁמְרוֹן
  choice: ketika ia sedang bersembunyi di Samaria
  rationale: Partisipel hitpael menggambarkan tindakan bersembunyi yang sedang berlangsung, dan preposisi ב menunjukkan lokasi.
- source_word: וַיְבִאֻהוּ אֶל יֵהוּא
  choice: lalu membawanya kepada Yehu
  rationale: Bentuk hiphil dari בוא berarti membawa seseorang kepada pihak lain.
- source_word: וַיְמִתֻהוּ
  choice: membunuhnya
  rationale: Bentuk kausatif secara harfiah berarti menyebabkan dia mati. 'Membunuhnya' menyampaikan makna itu secara alami tanpa mempersempitnya menjadi eksekusi resmi.
- source_word: וַיִּקְבְּרֻהוּ
  choice: mereka menguburkannya
  rationale: Terjemahan langsung dan wajar dari קבר dalam narasi.
- source_word: כִּי אָמְרוּ
  choice: sebab mereka berkata
  rationale: כִּי memperkenalkan alasan mereka memberikan penguburan kepada Ahazia.
- source_word: בֶּן יְהוֹשָׁפָט הוּא
  choice: Ia adalah anak Yosafat
  rationale: Klausa nominal dipertahankan sebagai ucapan langsung. 'Anak' dapat menyatakan keturunan, sesuai pemakaian silsilah Ibrani.
- source_word: אֲשֶׁר דָּרַשׁ אֶת יְהוָה
  choice: yang mencari Yahweh
  rationale: דרשׁ ketika berobjek Allah menunjuk pada tindakan mencari Dia dalam kesetiaan, ibadah, atau ketergantungan.
- source_word: בְּכָל לְבָבוֹ
  choice: dengan segenap hatinya
  rationale: Ungkapan perjanjian tentang pengabdian yang utuh diterjemahkan dengan idiom Indonesia yang alami dan bermartabat.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: Keluarga Ahazia tidak mempunyai kekuatan untuk mempertahankan kerajaan itu
  rationale: בֵּית menunjuk pada keluarga atau wangsa Ahazia, sedangkan klausa terakhir menyatakan ketidakmampuan dinasti itu untuk mempertahankan kekuasaan kerajaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna klausa terakhir mengenai keluarga Ahazia
  choice: ketidakmampuan keluarga atau dinasti Ahazia mempertahankan kerajaan
  alternative: tidak ada seorang pun yang layak memerintah; atau keluarga itu tidak memiliki kekuatan untuk memegang kerajaan
  rationale: Bahasa Ibrani menghubungkan ketiadaan כֹּחַ pada keluarga Ahazia dengan kerajaan. Terjemahan mempertahankan gagasan ketidakmampuan dinastis tanpa menyimpulkan secara lebih khusus bahwa tidak ada calon raja yang layak.
- issue: Alasan Ahazia dikuburkan
  choice: penghormatan karena ia keturunan Yosafat yang mencari Yahweh
  alternative: penghormatan kepada Ahazia atas kesalehannya sendiri
  rationale: Klausa relatif secara gramatikal menerangkan Yosafat, sehingga pujian atas pencarian Yahweh ditujukan kepada Yosafat, bukan Ahazia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Pergantian subjek tunggal ke jamak dibuat jelas tanpa menghilangkan alur Ibrani. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
