    rationale: Alternatif ini tidak idiomatis dalam bahasa Indonesia dan dapat mengesankan eksekusi atau penghukuman yudisial, sedangkan וַיְמִתֻהוּ hanya menyatakan secara kausatif bahwa mereka menyebabkan ia mati. Catatan perlu menjelaskan nilai kausatif tanpa menambahkan cara kematian.
