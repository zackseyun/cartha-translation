source:
  edition: WLC
  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: id
  text: Lalu ia kembali ke Yizreel untuk memulihkan diri, sebab luka-luka yang ditimpakan kepadanya di Rama ketika ia berperang melawan Hazael, raja Aram. Azarya[a], anak Yoram, raja Yehuda, turun ke Yizreel untuk menemui[b] Yoram, anak Ahab, di Yizreel, karena ia sedang sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama yang tertulis di sini dalam kitab Tawarikh adalah Azarya; raja yang sama disebut Ahazia di bagian lain.
    reason: alternative_reading
  - marker: b
    text: 'Atau: “mengunjungi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב לְהִתְרַפֵּא בְיִזְרְעֶאל
  choice: Lalu ia kembali ke Yizreel untuk memulihkan diri
  rationale: Wayyiqtol וַיָּשָׁב melanjutkan urutan narasi, sedangkan bentuk Hitpael לְהִתְרַפֵּא dalam konteks luka menunjuk pada pemulihan. Sesudah verba gerak, בְיִזְרְעֶאל secara alami dinyatakan sebagai tujuan.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: dari luka-luka yang ditimpakan kepadanya
  rationale: הַמַּכִּים menunjuk pada pukulan atau luka akibat pukulan. Ungkapan Indonesia ini menyampaikan akibat serta hubungan dengan proses pemulihan tanpa menentukan pelaku yang tidak disebutkan secara eksplisit.
- source_word: בָרָמָה בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: di Rama ketika ia berperang melawan Hazael, raja Aram
  rationale: Infinitif dengan בְּ menyatakan keadaan temporal, dan אֶת sesudah לָחַם secara idiomatis berarti pihak yang dilawan.
- source_word: וַעֲזַרְיָהוּ
  choice: Azarya
  rationale: Teks WLC pada ayat ini menuliskan bentuk nama עֲזַרְיָהוּ, sehingga nama itu dipertahankan dan tidak diselaraskan diam-diam dengan nama Ahazia di bagian lain.
- source_word: יָרַד
  choice: pergi ke Yizreel
  rationale: Secara harfiah berarti 'turun'. Dalam bahasa Indonesia modern, arah geografis itu dapat dibiarkan tersirat agar kalimat wajar; tujuan Yizreel dinyatakan secara eksplisit dari konteks sintaksis.
- source_word: לִרְאוֹת אֶת יְהוֹרָם
  choice: untuk menemui Yoram
  rationale: Secara leksikal berarti 'untuk melihat', tetapi dalam konteks perjalanan menjenguk orang sakit, 'menemui' menyampaikan fungsi kunjungan secara alami sambil mempertahankan alternatif yang lebih kontekstual dalam catatan kaki.
- source_word: כִּי חֹלֶה הוּא
  choice: karena ia sedang sakit
  rationale: Klausa nominal menegaskan keadaan Yoram pada saat kunjungan; 'sedang sakit' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Variasi nama raja dalam kisah Tawarikh
  choice: Mempertahankan 'Azarya' dalam teks utama
  alternative: Ahazia
  rationale: Bentuk yang tertulis dalam teks Ibrani ayat ini dipertahankan sesuai prinsip keutamaan sumber asli. Catatan kaki menjelaskan bahwa raja yang sama disebut Ahazia di bagian lain, tanpa menyelaraskan teks secara diam-diam.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Nama Ibrani ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia: Yizreel, Hazael, Aram, Azarya, Yoram, Ahab, dan Yehuda. Penanda catatan kaki [a] dan [b] dicantumkan langsung dalam teks utama.'
