  text: בֶּן אַרְבָּעִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲתַלְיָ֖הוּ בַּת עָמְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: id
  text: Ahazia berumur empat puluh dua tahun ketika ia menjadi raja[a], dan ia memerintah selama satu tahun di Yerusalem. Nama ibunya ialah Atalya[b], anak perempuan Omri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “berumur empat puluh dua tahun.” Bagian paralel dalam 2 Raja-Raja 8:26 berbunyi “berumur dua puluh dua tahun”; karena itu, sebagian orang menganggapnya sebagai masalah tekstual atau mengusulkan cara lain untuk menghitung angka tersebut.
    reason: textual_variant
  - marker: b
    text: Atau “seorang keturunan Omri.” Dalam bahasa Ibrani, “anak perempuan” kadang-kadang dapat dipakai dalam arti yang lebih luas untuk seorang keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: berumur empat puluh dua tahun
  rationale: Ungkapan usia Ibrani secara harfiah berarti 'anak laki-laki dari empat puluh dua tahun'; padanan Indonesia yang alami dan tepat ialah 'berumur empat puluh dua tahun'.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Bentuk dengan preposisi ב menyatakan waktu naik takhta; pilihan ini menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: dan ia memerintah selama satu tahun
  rationale: Terjemahan ini mempertahankan angka satu dan memperjelas bahwa yang dimaksud ialah lamanya pemerintahan.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi ב memiliki fungsi lokatif di sini.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Ini merupakan bentuk Indonesia modern yang wajar untuk formula pemberitahuan kerajaan tersebut.
- source_word: עֲתַלְיָהוּ
  choice: Atalya
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בַּת עָמְרִי
  choice: anak perempuan Omri
  rationale: Makna langsung בַּת ialah 'anak perempuan'. Kemungkinan bahwa istilah kekerabatan ini menunjuk keturunan perempuan yang lebih jauh dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Ketegangan kronologis mengenai usia Ahazia ketika naik takhta
  choice: Mempertahankan bacaan Masoret 'empat puluh dua tahun' dalam teks utama
  alternative: Dua puluh dua tahun, sesuai 2 Raja-Raja 8:26; atau memahami angka itu berdasarkan perhitungan lain yang berkaitan dengan wangsa Omri
  rationale: Teks sumber yang diberikan berbunyi 'empat puluh dua'. Terjemahan tidak boleh diam-diam mengubah atau menyelaraskannya dengan bagian paralel; persoalan tekstualnya dijelaskan dalam catatan kaki.
- issue: Arti genealogis 'anak perempuan Omri'
  choice: Menerjemahkan secara langsung sebagai 'anak perempuan Omri'
  alternative: Keturunan perempuan Omri
  rationale: Teks Ibrani memakai istilah kekerabatan biasa untuk 'anak perempuan'. Agar hubungan genealogisnya tidak dipastikan melampaui yang dikatakan teks, arti langsung dipertahankan dan kemungkinan arti yang lebih luas dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Susunan kalimat mengikuti formula berita kerajaan tanpa menjadi kaku. Bacaan sulit dalam teks Masoret dipertahankan, sedangkan ketegangan tekstual dan kemungkinan arti genealogis yang lebih luas dijelaskan melalui catatan kaki.
