translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang wajar dan bernada khidmat. Nama עֲתַלְיָה ditulis “Atalya” sesuai bentuk yang mudah dibaca dalam bahasa Indonesia. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
