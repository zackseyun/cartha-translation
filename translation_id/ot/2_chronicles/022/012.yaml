base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: id
  text: Ia tinggal bersama mereka di rumah Allah[a], sambil bersembunyi[b] selama enam tahun, sementara Atalya memerintah atas negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, kawasan Bait Allah; secara harfiah, “rumah Allah”.
    reason: cultural_note
  - marker: b
    text: Atau “dalam keadaan tersembunyi”. Partisipel Ibrani dapat dipahami secara refleksif (“bersembunyi”) atau sebagai gambaran bahwa ia berada dalam keadaan tersembunyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִתָּם
  choice: Ia tinggal bersama mereka
  rationale: Dalam konteks ini, bentuk היה menyatakan keberadaan Yoas yang berlanjut bersama orang-orang yang menyembunyikannya. “Tinggal bersama mereka” alami dalam bahasa Indonesia dan menyampaikan keberlanjutan itu.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: di rumah Allah
  rationale: Ungkapan ini secara harfiah berarti “rumah Allah”. Pilihan tersebut mempertahankan gambaran Ibrani, sedangkan konteks menunjukkan kawasan Bait Allah.
- source_word: מִתְחַבֵּא
  choice: sambil bersembunyi
  rationale: Partisipel hitpael ini secara wajar dapat menyatakan tindakan refleksif atau keadaan tersembunyi. “Sambil bersembunyi” mempertahankan nuansa refleksif tanpa menyangkal bahwa orang lain turut menyembunyikannya.
- source_word: שֵׁשׁ שָׁנִים
  choice: selama enam tahun
  rationale: Kata “selama” menyatakan rentang waktu secara alami dalam bahasa Indonesia.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: sementara Atalya memerintah
  rationale: Partisipel feminin menyatakan tindakan yang sedang berlangsung bersamaan dengan masa persembunyian Yoas; “sementara” memperjelas hubungan waktu tersebut.
- source_word: עַל הָאָרֶץ
  choice: atas negeri itu
  rationale: Dalam konteks ini, הָאָרֶץ menunjuk pada negeri atau wilayah kerajaan Yehuda. “Negeri itu” tetap dekat dengan teks tanpa menggantinya secara eksplisit dengan “kerajaan Yehuda”.
