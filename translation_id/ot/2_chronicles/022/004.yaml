base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, seperti keluarga Ahab, sebab sesudah ayahnya meninggal, merekalah penasihatnya, yang membawa kehancuran baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “demi kehancurannya” atau “untuk membinasakannya.” Ungkapan Ibrani ini dapat menunjuk pada akibat nasihat mereka ataupun maksud mereka yang merusak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan evaluatif Ibrani ini diterjemahkan secara alami dalam bahasa Indonesia tanpa menghilangkan makna harfiahnya.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani yang lazim dan menyajikan nama ilahi יהוה sebagai Yahweh.
- source_word: כְּבֵית אַחְאָב
  choice: seperti keluarga Ahab
  rationale: בֵּית di sini menunjuk kepada keluarga atau wangsa Ahab, bukan sekadar bangunan; 'keluarga' paling mudah dipahami pembaca umum.
- source_word: כִּי הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: sebab ... merekalah yang menjadi penasihatnya
  rationale: כִּי menyatakan alasan, sedangkan kata ganti הֵמָּה diberi penegasan melalui 'merekalah'.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: setelah ayahnya meninggal
  rationale: Padanan alami dalam bahasa Indonesia modern bagi ungkapan harfiah 'setelah kematian ayahnya'.
- source_word: לְמַשְׁחִית לוֹ
  choice: sehingga ia binasa
  rationale: Menyampaikan hasil yang merusak bagi dirinya tanpa memastikan bahwa para penasihat itu secara sengaja bermaksud membinasakannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi; 'Yahweh' mempertahankan fungsi nama perjanjian tersebut.
- issue: Tujuan atau hasil dalam לְמַשְׁחִית לוֹ
  choice: 'hasil: sehingga ia binasa'
  alternative: 'tujuan: untuk membinasakannya'
  rationale: Konstruksi Ibrani dapat menyatakan hasil maupun tujuan. Teks utama memakai hasil yang cocok dengan konteks, sementara catatan mempertahankan kemungkinan tujuan yang disengaja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Penasihat' mengikuti ejaan baku. Struktur kalimat dibuat alami sambil mempertahankan penegasan pada para anggota keluarga Ahab dan ambiguitas frasa penutup melalui catatan kaki.
