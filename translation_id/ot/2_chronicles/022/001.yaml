revisions:
- from: Kemudian penduduk Yerusalem mengangkat Ahazia, anak bungsunya, menjadi raja menggantikan dia, sebab gerombolan penyerbu yang datang bersama orang-orang Arab ke perkemahan telah membunuh semua anaknya yang lebih tua. Maka Ahazia anak Yoram, raja Yehuda, menjadi raja.[a]
  to: Kemudian penduduk Yerusalem mengangkat Ahazia, putra Yoram yang bungsu, menjadi raja menggantikan Yoram, sebab gerombolan penyerbu yang datang bersama orang-orang Arab[a] ke perkemahan telah membunuh semua putra Yoram yang lebih tua. Maka Ahazia, putra Yoram, yang adalah raja Yehuda, menjadi raja.
  rationale: Revisi hanya menghilangkan ketaksaan rujukan dalam bahasa Indonesia dengan menyebut Yoram secara eksplisit, memperjelas bahwa "raja Yehuda" menerangkan Yoram, dan memindahkan penanda catatan kaki ke frasa yang relevan. Ambiguitas tekstual mengenai hubungan gerombolan itu dengan orang-orang Arab tetap dipertahankan dalam catatan kaki.
