base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: id
  text: Kemudian penduduk Yerusalem mengangkat Ahazia, putra Yoram yang bungsu, menjadi raja menggantikan Yoram, sebab gerombolan penyerbu yang datang bersama orang-orang Arab[a] ke perkemahan telah membunuh semua putra Yoram yang lebih tua. Maka Ahazia, putra Yoram, yang adalah raja Yehuda, menjadi raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gerombolan yang datang di antara orang-orang Arab ke perkemahan.” Frasa Ibrani ini dapat dipahami secara berbeda, bergantung pada arti preposisi yang menyertai “orang-orang Arab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: mengangkat ... menjadi raja
  rationale: Bentuk Hifil dari מלך menyatakan tindakan menjadikan atau melantik seseorang sebagai raja; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: penduduk Yerusalem
  rationale: Partisip konstruk ini secara harfiah menunjuk kepada orang-orang yang tinggal di Yerusalem; 'penduduk Yerusalem' ringkas dan wajar.
- source_word: בְנוֹ הַקָּטֹן
  choice: anak bungsunya
  rationale: Walaupun קָטֹן berarti kecil atau muda, kontras dengan semua anak yang lebih tua menunjukkan bahwa yang dimaksud adalah putra termuda.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Preposisi ini menyatakan pergantian atau suksesi; 'menggantikan dia' alami dalam konteks naik takhta.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan Ahazia diangkat menjadi raja.
- source_word: כָל הָרִאשֹׁנִים
  choice: semua anaknya yang lebih tua
  rationale: Secara harfiah 'semua yang terdahulu/lebih dahulu'; konteks menunjukkan anak-anak Yoram yang lebih tua daripada Ahazia. Pronomina '-nya' memperjelas hubungan tanpa mengubah rujukan.
- source_word: הָרַג
  choice: telah membunuh
  rationale: Tindakan pembunuhan mendahului dan menjelaskan pengangkatan Ahazia; 'telah' menyatakan urutan tersebut secara alami.
- source_word: הַגְּדוּד
  choice: gerombolan penyerbu
  rationale: גְּדוּד dapat menunjuk pasukan atau gerombolan yang melakukan penyerbuan; pilihan ini menyampaikan nuansa militer-penjarahan dalam konteks.
- source_word: הַבָּא בָעַרְבִים
  choice: yang datang bersama orang-orang Arab
  rationale: Preposisi ב dipahami secara asosiatif, yakni gerombolan itu datang bersama orang-orang Arab; kemungkinan pemahaman lain dipertahankan dalam catatan kaki.
- source_word: לַמַּחֲנֶה
  choice: ke perkemahan
  rationale: Preposisi menunjukkan arah menuju perkemahan. Bahasa Ibrani tidak harus menegaskan masuk ke dalamnya, sehingga 'ke' mempertahankan keluasan makna.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus kenaikan takhta, bentuk Qal ini dapat bersifat ingresif, yaitu mulai memegang kedudukan sebagai raja; pilihan ini juga merangkum tindakan pengangkatan sebelumnya.
- source_word: אֲחַזְיָהוּ בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: Ahazia anak Yoram, raja Yehuda
  rationale: Frasa aposisional mengidentifikasi Ahazia berdasarkan ayahnya dan jabatan sang ayah; tanda koma memperjelas bahwa Yoram adalah raja Yehuda.
