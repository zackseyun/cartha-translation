  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: id
  text: Atalya, ibu Ahazia, melihat bahwa anaknya sudah mati. Lalu ia bangkit dan membinasakan[a] semua keturunan kerajaan dari wangsa Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk kata kerja yang sulit dan secara harfiah tampak berarti “berbicara”. Namun, konteks dan kisah sejajar dalam 2 Raja-Raja 11:1 mendukung arti “membinasakan” atau “membunuh”.
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: Atalya
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia. Waw pembuka tidak diterjemahkan dengan penanda waktu tambahan karena tidak menyatakan ‘sekarang’ secara eksplisit.
- source_word: אֵם אֲחַזְיָהוּ
  choice: ibu Ahazia
  rationale: Hubungan konstruksi Ibrani disampaikan secara alami dan jelas dalam bahasa Indonesia.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: melihat bahwa anaknya sudah mati
  rationale: Konstruksi רָאָה כִּי menyatakan diketahuinya suatu kenyataan; ‘sudah mati’ menyampaikan keadaan yang merupakan hasil dari kematian yang telah terjadi.
- source_word: וַתָּקָם
  choice: ia bertindak
  rationale: Dalam narasi, קוּם kerap menandai dimulainya tindakan tegas, bukan sekadar gerakan berdiri secara harfiah. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan fungsi naratifnya.
- source_word: וַתְּדַבֵּר
  choice: membinasakan
  rationale: Walaupun bentuk konsonantalnya tampak berasal dari דבר, ‘berbicara’, objek langsung dan kisah sejajar dalam 2 Raja-Raja 11:1 menunjukkan tindakan pemusnahan. ‘Membinasakan’ mempertahankan cakupan makna tanpa menentukan caranya.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: semua keturunan raja
  rationale: זֶרַע secara harfiah berarti ‘benih/keturunan’; dalam konteks dinasti, frasa ini menunjuk kepada keturunan kerajaan atau garis keturunan raja.
- source_word: לְבֵית יְהוּדָה
  choice: dari keluarga Yehuda
  rationale: Frasa ini mengidentifikasi keluarga atau wangsa tempat keturunan kerajaan itu berasal; ‘keluarga Yehuda’ jelas bagi pembaca umum tanpa menambahkan penafsiran kelembagaan.
theological_decisions:
- issue: Makna bentuk sulit וַתְּדַבֵּר dalam konteks ini
  choice: Diterjemahkan ‘membinasakan’.
  alternative: ‘berbicara’, ‘berbicara menentang’, atau ‘mengatur pembunuhan’
  rationale: Objek ‘semua keturunan raja’ dan kisah sejajar dalam 2 Raja-Raja 11:1 mendukung makna tindakan pemusnahan, bukan perkataan. Namun, kesulitan bentuk Ibraninya tetap dinyatakan dalam catatan kaki agar ketidakpastian tekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. ‘Ia bertindak’ menghindari ungkapan harfiah ‘ia bangkit’ yang dapat disalahpahami sebagai sekadar perubahan posisi tubuh. Penanda catatan kaki ditempatkan langsung pada kata yang dipersoalkan.
