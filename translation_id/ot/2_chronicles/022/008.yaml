source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: id
  text: Ketika Yehu melaksanakan penghakiman terhadap keluarga Ahab[a], ia mendapati para pejabat Yehuda dan putra-putra para saudara laki-laki Ahazia[b] sedang melayani Ahazia, lalu ia membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghakimi keluarga Ahab.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, para keponakan laki-laki Ahazia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: ketika ... melaksanakan penghakiman
  rationale: Konstruksi כְּ dengan infinitif berfungsi temporal, sedangkan שׁפט mempertahankan nuansa tindakan yudisial yang dalam konteks ini bersifat menghukum.
- source_word: עִם בֵּית אַחְאָב
  choice: terhadap keluarga Ahab
  rationale: עִם di sini menyatakan pihak yang menjadi sasaran tindakan dalam konteks permusuhan. 'Keluarga Ahab' mempertahankan cakupan rumah tangga dan garis keturunan tanpa membatasinya hanya pada dinasti politik.
- source_word: שָׂרֵי יְהוּדָה
  choice: para pejabat Yehuda
  rationale: שָׂרִים dapat menunjuk para pemimpin atau pejabat berpangkat tinggi; 'pejabat' sesuai dengan konteks istana dan tidak menyiratkan bahwa mereka semua pangeran kerajaan.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: putra-putra dari saudara-saudara laki-laki Ahazia
  rationale: Terjemahan ini mempertahankan ungkapan kekerabatan eksplisit dalam bahasa Ibrani; secara hubungan keluarga mereka adalah para keponakan laki-laki Ahazia.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: sedang melayani Ahazia
  rationale: Partisipel menunjukkan kegiatan atau peran yang sedang berlangsung. 'Melayani' cukup luas untuk mencakup pelayanan atau pendampingan di lingkungan istana tanpa memberi nuansa kultis.
- source_word: וַיַּהַרְגֵם
  choice: lalu ia membunuh mereka
  rationale: הרג secara langsung berarti membunuh. 'Lalu' menyampaikan kelanjutan naratif waw-consecutive secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat tindakan Yehu dalam bahasa yudisial
  choice: melaksanakan penghakiman
  alternative: menghakimi; menghukum
  rationale: Pilihan ini mempertahankan daya yudisial שׁפט dan konteks penghukuman, tetapi tidak menambahkan pernyataan bahwa setiap pembunuhan dalam ayat ini secara eksplisit diperkenan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif Ibrani dibuat alami tanpa menghilangkan hubungan waktu, nuansa penghakiman, atau keterangan kekerabatan yang eksplisit.
