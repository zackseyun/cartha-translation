  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: id
  text: Kejatuhan Ahazia karena ia pergi kepada Yoram berasal dari Allah. Ketika ia tiba, ia pergi bersama Yehoram menemui Yehu[a] anak Nimsi, yang telah diurapi Yahweh untuk melenyapkan keluarga Ahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia pergi bersama Yehoram melawan Yehu” atau “untuk menghadapi Yehu”. Secara harfiah, teks Ibrani berbunyi “kepada Yehu”, tetapi konteksnya dapat menyiratkan pertemuan yang bermusuhan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: berasal dari Allah
  rationale: Preposisi מִן menandai sumber atau asal. Ungkapan ini mempertahankan atribusi ilahi tanpa menentukan apakah caranya berupa ketetapan langsung, penyelenggaraan, atau izin.
- source_word: תְּבוּסַת
  choice: kejatuhan
  rationale: Nomina ini dapat menunjuk pada kekalahan, kehancuran, atau keruntuhan. Dalam konteks nasib Ahazia, 'kejatuhan' alami dan cukup luas untuk mencakup hasil akhirnya yang membawa bencana.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: karena ia pergi kepada Yoram
  rationale: Infinitif dengan לְ menyatakan keadaan atau peristiwa yang terkait dengan kejatuhannya. 'Karena' menghasilkan bahasa Indonesia yang wajar, sementara hubungan tepat antara perjalanan itu dan kejatuhannya tetap tidak dijabarkan lebih jauh.
- source_word: וּבְבֹאוֹ
  choice: ketika ia tiba
  rationale: בְּ dengan infinitif konstruk dan sufiks berfungsi temporal. 'Ketika ia tiba' menyampaikan urutan narasi dengan jelas.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: ia pergi bersama Yehoram menemui Yehu
  rationale: יָצָא berarti 'keluar/pergi', dan אֶל secara harfiah berarti 'kepada'. 'Menemui' mempertahankan arah gerakan tanpa memastikan bahwa pertemuan itu bersahabat; kemungkinan nuansa permusuhan dicatat dalam catatan kaki.
- source_word: יְהוֹרָם / יוֹרָם
  choice: Yoram / Yehoram
  rationale: Teks Ibrani memakai dua bentuk nama yang berbeda dalam ayat ini. Terjemahan mempertahankan variasi itu meskipun keduanya menunjuk kepada raja yang sama.
- source_word: מְשָׁחוֹ
  choice: telah diurapi
  rationale: Bentuk qatal dalam klausa relatif menunjuk pada tindakan yang mendahului pertemuan dalam narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: untuk melenyapkan keluarga Ahab
  rationale: Hifil dari כרת berarti menyingkirkan, memusnahkan, atau melenyapkan. 'Keluarga Ahab' menyampaikan בֵּית dalam arti wangsa/keturunan, bukan bangunan fisik.
theological_decisions:
- issue: Penyebab ilahi dalam kejatuhan Ahazia
  choice: Kejatuhan Ahazia 'berasal dari Allah'.
  alternative: Allah menetapkan kejatuhan Ahazia secara langsung; atau Allah mengizinkan keadaan yang menyebabkan kejatuhannya.
  rationale: Teks secara tegas menyatakan bahwa kejatuhan itu berasal dari Allah, tetapi tidak menjelaskan cara kerja sebab ilahi tersebut. Terjemahan mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Variasi nama Yoram/Yehoram dipertahankan sesuai teks Ibrani. Penanda catatan kaki [a] ditempatkan sesudah 'Ahazia' karena catatan menjelaskan frasa tindakan yang terkait dengan kejatuhannya.
