source:
  edition: WLC
  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: id
  text: Ia pun mengikuti jalan hidup keluarga Ahab, sebab ibunya adalah penasihatnya yang menjerumuskannya ke dalam kejahatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ibunya menasihatinya agar berbuat jahat.”
    reason: Alternatif ini mengungkapkan konstruksi Ibrani secara verbal. Bentuk Hifil לְהַרְשִׁיעַ dapat menyatakan bahwa nasihat sang ibu menyebabkan atau mengarahkan dia kepada kejahatan.
lexical_decisions:
- source_word: גַּם הוּא
  choice: Ia pun
  rationale: 'Partikel “pun” secara alami menyampaikan daya aditif dan penekanan גַּם bersama pronomina mandiri: raja ini juga mengikuti pola yang sama.'
- source_word: הָלַךְ בְּדַרְכֵי
  choice: menempuh jalan hidup
  rationale: Ungkapan ini menyatakan perilaku atau pola kehidupan, bukan sekadar gerak fisik. “Menempuh jalan hidup” mempertahankan metafora jalan sekaligus jelas dalam bahasa Indonesia modern.
- source_word: בֵּית אַחְאָב
  choice: keluarga Ahab
  rationale: בֵּית di sini menunjuk keluarga atau wangsa Ahab. “Keluarga Ahab” alami dan tidak mempersempit maknanya hanya pada konsep politik ‘dinasti’.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi perilakunya; “sebab” menyampaikan hubungan kausal dengan register yang wajar dan bermartabat.
- source_word: אִמּוֹ הָיְתָה יוֹעַצְתּוֹ
  choice: ibunya menjadi penasihatnya
  rationale: Pilihan ini mempertahankan konstruksi nominal Ibrani dan menggambarkan peran nasihat yang berlangsung, bukan hanya satu tindakan menasihati.
- source_word: לְהַרְשִׁיעַ
  choice: untuk berbuat jahat
  rationale: Infinitif Hifil ini memberi arah atau hasil dari nasihat tersebut, yakni tindakan yang secara moral jahat. Ungkapan Indonesia ini jelas tanpa menambahkan motif psikologis.
theological_decisions:
- issue: Penilaian moral atas perilaku raja di bawah pengaruh ibunya
  choice: Mempertahankan pernyataan tegas bahwa ibunya menjadi penasihatnya untuk berbuat jahat.
  alternative: “Ibunya mendorongnya melakukan kejahatan.”
  rationale: Teks secara eksplisit memberi penilaian moral melalui לְהַרְשִׁיעַ. Terjemahan tidak melunakkan penilaian itu, tetapi juga tidak menambahkan gagasan tentang tekanan atau dorongan psikologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nuansa naratif yang bermartabat. Metafora “jalan hidup” dipertahankan agar idiom etis Ibrani tetap terasa, sedangkan “keluarga Ahab” menyampaikan cakupan familial-dinastik secara alami.
