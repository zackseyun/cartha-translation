revisions:
- from: Namun, Yosabat, putri raja, mengambil Yoas anak Ahazia dan diam-diam membawanya dari antara anak-anak raja yang sedang dibunuh.[a] Ia menempatkan Yoas bersama perempuan yang menyusuinya di kamar tidur.[b] Demikianlah Yosabat—putri Raja Yoram, istri Imam Yoyada, dan saudara perempuan Ahazia—menyembunyikan Yoas dari Atalya, dan ia tidak membunuhnya.[c]
  to: Namun, Yosabat, putri raja, mengambil Yoas anak Ahazia dan diam-diam membawanya dari antara anak-anak raja yang sedang dibunuh.[a] Ia menempatkan Yoas bersama perempuan yang menyusuinya di kamar tidur.[b] Yosabat, putri Raja Yoram dan istri Imam Yoyada, menyembunyikan Yoas dari Atalya, karena ia adalah saudara perempuan Ahazia, dan ia tidak membunuhnya.[c]
