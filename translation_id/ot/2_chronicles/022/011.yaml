source:
  edition: WLC
  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: id
  text: Namun, Yosabat, putri raja, mengambil Yoas anak Ahazia dan diam-diam membawanya dari antara anak-anak raja yang sedang dibunuh.[a] Ia menempatkan Yoas bersama perempuan yang menyusuinya di kamar tidur.[b] Yosabat, putri Raja Yoram dan istri Imam Yoyada, menyembunyikan Yoas dari Atalya, karena ia adalah saudara perempuan Ahazia, dan ia tidak membunuhnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari antara anak-anak raja yang akan dibunuh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di kamar tempat tidur.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kata “ia” terakhir kemungkinan besar menunjuk kepada Atalya: Yosabat menyembunyikan Yoas agar Atalya tidak membunuhnya. Namun, secara gramatikal kata itu juga dapat dipahami sebagai menunjuk kepada Yosabat.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: mengambil
  rationale: Makna dasar לקח dalam narasi adalah ‘mengambil’. Konteksnya menunjukkan tindakan penyelamatan, tetapi unsur itu tidak dimasukkan ke dalam verba.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: diam-diam membawanya
  rationale: גנב secara harfiah berkaitan dengan mencuri; dalam konteks ini maksudnya ialah membawa anak itu keluar secara tersembunyi. Pilihan ini menyampaikan sifat rahasia tindakan tersebut tanpa kesan bahwa Yoas adalah barang curian.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: dari antara anak-anak raja yang sedang dibunuh
  rationale: Partisip pasif הַמּוּמָתִים dapat menggambarkan mereka sebagai orang-orang yang sedang atau akan dihukum mati. Teks utama memakai nuansa proses yang sedang berlangsung, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: מֵינִקְתּוֹ
  choice: perempuan yang menyusuinya
  rationale: Kata ini menunjuk kepada perempuan yang menyusui anak itu. Ungkapan ini lebih tepat daripada sekadar ‘pengasuh’ dan lebih mudah dipahami daripada istilah yang jarang dipakai.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: di kamar tidur
  rationale: Secara harfiah frasa ini berarti ‘di kamar tempat tidur’. ‘Kamar tidur’ merupakan padanan Indonesia modern yang alami.
- source_word: וַתַּסְתִּירֵהוּ
  choice: menyembunyikan Yoas
  rationale: סתר berarti menyembunyikan atau menyamarkan. Nama Yoas diulangi agar rujukan objek tetap jelas dalam kalimat Indonesia yang panjang.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: dari Atalya
  rationale: Frasa tersebut secara harfiah berarti ‘dari hadapan Atalya’, yakni di luar penglihatan atau jangkauannya. Bentuk singkat ini alami dan tetap mempertahankan maksudnya.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: dan ia tidak membunuhnya
  rationale: Bentuk Ibrani memakai subjek feminin tunggal yang tersirat. Terjemahan ini mempertahankan ketidakjelasan gramatikal mengenai apakah subjeknya Atalya atau Yosabat, sementara catatan kaki menjelaskan pembacaan yang paling mungkin.
theological_decisions:
- issue: Subjek verba terakhir וְלֹא הֱמִיתָתְהוּ
  choice: 'Mempertahankan subjek tersirat dengan ‘ia’: ‘dan ia tidak membunuhnya’.'
  alternative: 'Menyebut Atalya secara eksplisit: ‘sehingga Atalya tidak membunuhnya’. Kemungkinan gramatikal lain adalah Yosabat sebagai subjek.'
  rationale: 'Konteks paling kuat menunjuk kepada Atalya: Yoas disembunyikan darinya sehingga ia tidak membunuh Yoas. Namun, bahasa Ibrani tidak menyebut ulang nama subjek, sehingga teks utama tidak menghapus ambiguitas itu.'
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia: Yosabat, Yoas, Ahazia, Yoram, Yoyada, dan Atalya. Struktur kalimat dipecah agar mudah dibaca, sementara hubungan keluarga dan jabatan tetap lengkap.'
