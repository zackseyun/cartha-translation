  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: id
  text: Ia pun bertindak menurut nasihat mereka[a]. Ia pergi bersama Yoram bin Ahab, raja Israel, untuk berperang melawan Hazael, raja Aram[b], di Ramot-Gilead. Orang-orang Aram melukai Yoram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan menurut nasihat mereka”; maksudnya, ia bertindak dengan mengikuti nasihat mereka.
    reason: lexical_alternative
  - marker: b
    text: Aram secara tradisional juga disebut Siria; demikian pula, orang-orang Aram disebut orang-orang Siria.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: Ia pun bertindak menurut nasihat mereka
  rationale: Ungkapan harfiah 'berjalan menurut nasihat mereka' menyatakan bahwa perilakunya diarahkan oleh nasihat mereka. 'Bertindak menurut' menyampaikan idiom itu secara alami dalam bahasa Indonesia modern, sedangkan 'pun' menandai kesinambungan dengan konteks sebelumnya.
- source_word: וַיֵּלֶךְ אֶת
  choice: Ia pergi bersama
  rationale: Konstruksi ini menyatakan bahwa ia menyertai Yoram; terjemahan tersebut lugas dan wajar.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: Yoram ... Yoram
  rationale: Kedua bentuk Ibrani adalah varian nama yang sama. Pemakaian satu bentuk Indonesia menghindari kesan keliru bahwa yang dimaksud adalah dua orang berbeda; perbedaan bentuk sumber tidak memengaruhi identitas tokoh.
- source_word: לַמִּלְחָמָה עַל
  choice: untuk berperang melawan
  rationale: Frasa ini menyatakan tujuan militer dan pihak yang menjadi lawan secara alami dalam bahasa Indonesia.
- source_word: אֲרָם / הָרַמִּים
  choice: Aram / orang-orang Aram
  rationale: Mempertahankan nama historis dalam teks Ibrani dan tidak menggantinya dengan sebutan geopolitik yang lebih kemudian, 'Siria'.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: di Ramot-Gilead
  rationale: Preposisi 'di' secara alami menyatakan lokasi pertempuran; nama tempat ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיַּכּוּ
  choice: melukai
  rationale: Walaupun kata kerja dasarnya berarti 'memukul/menyerang', konteks langsung menunjukkan bahwa Yoram terluka; 'melukai' menyampaikan hasil serangan tanpa menyiratkan bahwa ia tewas atau seluruh pasukannya dikalahkan.
theological_decisions:
- issue: Penyebutan אֲרָם dan הָרַמִּים
  choice: Aram / orang-orang Aram
  alternative: Siria / orang-orang Siria
  rationale: Pilihan ini mengikuti penamaan historis teks Ibrani dan menghindari penggantian dengan nama wilayah dari masa yang lebih kemudian.
- issue: Metafora הָלַךְ dengan nasihat
  choice: bertindak menurut nasihat mereka
  alternative: berjalan menurut nasihat mereka
  rationale: Makna idiomatisnya adalah mengatur tindakan berdasarkan nasihat pihak lain. Terjemahan alami dipilih tanpa menambahkan penilaian teologis yang tidak dinyatakan di ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat jelas bagi pembaca umum. Metafora Ibrani pada klausa pertama diterjemahkan menurut maknanya dan dijelaskan dalam catatan kaki. Bentuk nama יְהוֹרָם dan יוֹרָם diseragamkan menjadi 'Yoram' karena keduanya menunjuk kepada raja Israel yang sama.
