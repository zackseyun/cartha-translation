source:
  edition: WLC
  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: id
  text: Ia membangun gerbang atas Rumah Yahweh, dan ia banyak membangun di tembok Ofel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini dapat juga diterjemahkan, “ia membangun secara besar-besaran di tembok Ofel.”
    reason: Ungkapan לָרֹב dapat menekankan banyaknya ataupun luasnya pekerjaan pembangunan.
lexical_decisions:
- source_word: בָּנָה
  choice: membangun
  rationale: Makna dasarnya adalah membangun atau mendirikan. Konteks tidak menuntut makna yang lebih khusus seperti membangun kembali.
- source_word: שַׁעַר
  choice: gerbang
  rationale: Kata ini menunjuk pada gerbang dalam konteks bangunan atau kompleks Bait Suci; 'gerbang' adalah padanan Indonesia yang alami.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani secara dekat tanpa mengaburkan bahwa yang dimaksud adalah tempat ibadah bagi Yahweh.
- source_word: הָעֶלְיוֹן
  choice: atas
  rationale: Sebagai kata sifat yang menerangkan 'gerbang', kata ini menunjukkan letaknya sebagai gerbang yang berada di bagian atas.
- source_word: וּבְחוֹמַת
  choice: dan ... pada tembok
  rationale: Dalam konteks pekerjaan bangunan, preposisi ב dapat menunjukkan tempat atau objek tempat pekerjaan dilakukan. 'Pada tembok' mempertahankan keluwesan ini secara alami dalam bahasa Indonesia.
- source_word: הָעֹפֶל
  choice: Ofel
  rationale: Nama kawasan berbenteng yang tinggi di Yerusalem ini ditransliterasikan menurut bentuk yang lazim dan tidak diterjemahkan sebagai kata umum.
- source_word: לָרֹב
  choice: banyak
  rationale: Ungkapan ini menyatakan besarnya jumlah atau luasnya kegiatan pembangunan. 'Banyak membangun' dekat dengan bentuk Ibrani dan tetap wajar dalam bahasa Indonesia; kemungkinan nuansa 'secara besar-besaran' dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama diri tersebut dan tidak menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Susunan 'ia banyak membangun' mempertahankan pengulangan verba בָּנָה serta tekanan kuantitatif לָרֹב, sementara 'rumah Yahweh' menjaga metafora sumber.
