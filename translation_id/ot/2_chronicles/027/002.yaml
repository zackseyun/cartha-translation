  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh, sesuai dengan segala yang telah dilakukan Uzia, ayahnya, hanya saja ia tidak masuk ke Bait Yahweh.[a] Namun, rakyat masih bertindak bejat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia tidak pergi ke dalam Bait Yahweh.” Pernyataan ini tampaknya mengontraskan Yotam dengan Uzia, yang masuk ke Bait itu secara tidak sah (lihat 2 Taw. 26:16–21).
    reason: cross_reference
  - marker: b
    text: Atau “rakyat masih merusak diri sendiri” atau “rakyat masih bertindak secara rusak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ia melakukan apa yang benar
  rationale: Adjektiva berartikel הַיָּשָׁר berfungsi substantival, yakni ‘hal yang benar’. Susunan ini alami dalam bahasa Indonesia dan mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan ini mempertahankan citra idiom Ibrani yang tetap mudah dipahami dalam bahasa Indonesia; nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: sesuai dengan segala yang telah dilakukan Uzia, ayahnya
  rationale: כְּכֹל אֲשֶׁר menyatakan kesesuaian menyeluruh dengan teladan terdahulu. Bentuk ‘telah dilakukan’ menandai bahwa tindakan Uzia mendahului tindakan Yotam.
- source_word: רַק
  choice: hanya saja
  rationale: Partikel ini membatasi perbandingan dengan Uzia tanpa meniadakan penilaian positif sebelumnya.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: ia tidak masuk ke Bait Yahweh
  rationale: בוא אֶל dalam konteks ini berarti masuk ke dalam. הֵיכָל menunjuk pada Bait Allah; ‘Bait Yahweh’ ringkas, bermartabat, dan mempertahankan nama ilahi.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: Namun, rakyat masih bertindak bejat
  rationale: וְעוֹד menandai keadaan buruk yang masih berlanjut sekaligus berkontras dengan perilaku raja. Partisip Hifil מַשְׁחִיתִים menggambarkan perilaku rusak yang berlangsung, tanpa objek yang disebutkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Hubungan tindakan Yotam dengan pelanggaran Uzia
  choice: hanya saja ia tidak masuk ke Bait Yahweh
  alternative: namun ia tidak masuk ke Bait Yahweh
  rationale: רַק memberikan pengecualian terhadap kesamaan Yotam dengan ayahnya. Terjemahan tidak menyatakan secara eksplisit bahwa tindakan masuk itu melanggar hukum, tetapi catatan silang menjelaskan konteks 2 Tawarikh 26:16–21.
- issue: Makna מַשְׁחִיתִים
  choice: bertindak bejat
  alternative: merusak diri; berlaku rusak
  rationale: Bentuk Hifil dapat bernuansa menyebabkan kerusakan atau bertindak secara rusak. Karena objek tidak dinyatakan, teks utama memakai ungkapan moral yang tidak menentukan objek, sedangkan alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah ‘Bait’ dipakai untuk הֵיכָל dalam konteks rumah ibadah Yahweh. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
