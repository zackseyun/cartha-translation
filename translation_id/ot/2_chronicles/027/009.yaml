base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: id
  text: Yotam berbaring bersama para leluhurnya[a], lalu mereka menguburkannya di Kota Daud. Ahas, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama para leluhurnya.” Ini adalah ungkapan baku dalam berita kematian seorang raja, yang berarti bahwa ia meninggal.
    reason: Menjelaskan idiom kematian kerajaan Ibrani sambil mempertahankan metafora verba dalam teks utama.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan rumusan berita kematian raja. Pilihan ini mempertahankan gambaran tidur/perhentian tanpa menghasilkan ungkapan Indonesia yang janggal seperti 'tidur bersama leluhurnya'; makna kematiannya dijelaskan dalam catatan kaki.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: orang menguburkan dia
  rationale: Bentuk Ibrani aktif jamak memiliki pelaku yang tidak disebutkan. Subjek tak tentu 'orang' mempertahankan keaktifan verba dan terdengar alami dalam bahasa Indonesia.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Ini adalah nama tempat konvensional; kapitalisasi menandai pemakaiannya sebagai nama diri.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan pergantian takhta, verba מלך menyatakan bahwa Ahas naik dan memegang kedudukan sebagai raja. 'Menjadi raja' alami dan ringkas dalam bahasa Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi, kata ini menyatakan penggantian kedudukan. Pilihan tersebut lebih alami daripada terjemahan harfiah 'di tempatnya'.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: אָחָז
  choice: Ahas
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Hubungan anak dengan ayah dipertahankan secara eksplisit sebagai bagian dari rumusan suksesi.
theological_decisions:
- issue: Ungkapan kematian וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: Mempertahankan metafora perhentian dalam teks utama dan menjelaskan artinya dalam catatan kaki.
  alternative: 'Menerjemahkan langsung secara interpretatif: ''Yotam meninggal seperti leluhurnya.'''
  rationale: Teks Ibrani memakai ungkapan baku kematian kerajaan yang secara harfiah berbicara tentang berbaring bersama para leluhur. Terjemahan tidak seharusnya menghapus seluruh metafora atau memberinya muatan doktrinal tambahan.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk nama memakai konvensi Indonesia: Yotam, Ahas, dan Kota Daud. Konjungsi naratif Ibrani tidak diterjemahkan secara mekanis pada setiap klausa.'
