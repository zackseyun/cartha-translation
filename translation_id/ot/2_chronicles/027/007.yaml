  text: וְ/יֶתֶר֙ דִּבְרֵ֣י יוֹתָ֔ם וְ/כָל מִלְחֲמֹתָ֖י/ו וּ/דְרָכָ֑י/ו הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: id
  text: Selebihnya dari riwayat Yotam, seluruh peperangan dan jalan hidupnya—semuanya tertulis dalam Kitab Raja-Raja Israel dan Yehuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Selebihnya dari riwayat Yotam
  rationale: Dalam formula rangkuman kerajaan, דִּבְרֵי menunjuk pada perkara, perbuatan, atau riwayat seorang raja, bukan hanya perkataannya. 'Riwayat Yotam' alami dalam bahasa Indonesia dan sesuai dengan konteks catatan sejarah.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: juga semua peperangan
  rationale: מִלְחָמוֹת adalah bentuk jamak yang merujuk pada perang atau konflik yang dijalani Yotam. 'Peperangan' mempertahankan cakupan umum tanpa mempersempitnya menjadi pertempuran atau kampanye tertentu.
- source_word: וּדְרָכָיו
  choice: dan jalan hidupnya
  rationale: דְּרָכָיו secara harfiah berarti 'jalan-jalannya', tetapi di sini menunjuk pada cara hidup atau perilaku. 'Jalan hidupnya' mempertahankan metafora Ibrani sekaligus jelas bagi pembaca modern.
- source_word: הִנָּם כְּתוּבִים
  choice: semuanya tertulis
  rationale: הִנָּם memberi penunjukan atau penegasan terhadap unsur-unsur jamak sebelumnya. Alih-alih memakai seruan arkais seperti 'lihatlah', 'semuanya' menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Secara harfiah ungkapan ini memakai preposisi 'di atas', tetapi idiom Indonesia untuk catatan tertulis adalah 'tertulis dalam kitab'. Huruf kapital menandai rujukan pada judul suatu sumber.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Raja-Raja Israel dan Yehuda
  rationale: Frasa konstruksi ini menamai sumber yang memuat catatan tentang raja-raja Israel dan Yehuda. Bentuk ini ringkas dan alami sebagai judul dokumen.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami tanpa menghilangkan formula rangkuman sumber kerajaan. 'Lihatlah' tidak dipakai karena akan terdengar arkais; daya penegas הִנָּם disampaikan melalui 'semuanya'.
