  text: וַ/יִּתְחַזֵּ֖ק יוֹתָ֑ם כִּ֚י הֵכִ֣ין דְּרָכָ֔י/ו לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: id
  text: Demikianlah Yotam menjadi kuat karena ia menata jalan hidupnya di hadapan TUHAN, Allahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: menjadi kuat
  rationale: Bentuk hitpael dari חזק di sini menyatakan bahwa Yotam bertambah atau menjadi kuat; terjemahan ini mempertahankan cakupan maknanya tanpa menentukan secara sempit apakah kekuatan itu terutama bersifat politik, militer, atau pribadi.
- source_word: הֵכִין
  choice: menata
  rationale: Bentuk hifil dari כון berarti membuat mantap, mempersiapkan, atau mengarahkan dengan teguh. Dalam gabungan dengan 'jalan hidupnya', 'menata' terdengar alami dan menyampaikan tindakan sengaja serta teratur.
- source_word: דְּרָכָיו
  choice: jalan hidupnya
  rationale: Secara harfiah berarti 'jalan-jalannya', tetapi dalam konteks etis menunjuk pada perilaku dan pola hidup. 'Jalan hidupnya' mempertahankan metafora jalan sekaligus jelas bagi pembaca modern.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan TUHAN
  rationale: '''Di hadapan'' mempertahankan ungkapan relasional Ibrani, sedangkan יהוה ditampilkan sebagai TUHAN sesuai konvensi Alkitab bahasa Indonesia.'
theological_decisions:
- issue: Hubungan antara kekuatan Yotam dan cara hidupnya di hadapan Allah
  choice: Mempertahankan hubungan sebab dengan 'karena'
  alternative: Mengaburkan hubungan sebagai urutan waktu atau korelasi saja
  rationale: Partikel כִּי secara langsung memberi alasan mengapa Yotam menjadi kuat. Teks menghubungkan kekuatannya dengan penataan jalan hidupnya di hadapan TUHAN tanpa merinci mekanisme atau menjadikannya rumus universal.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Nama יוֹתָם ditulis 'Yotam'. Metafora 'jalan' dipertahankan dalam bentuk idiomatis 'jalan hidup', dan tidak ada catatan kaki yang diperlukan.
