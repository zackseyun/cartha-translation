  terminology: “Yotam” konsisten dengan bentuk nama Indonesia yang lazim. “TUHAN” tepat untuk יהוה, dan “Allahnya” tepat untuk אֱלֹהָיו. Tidak ada istilah teologis yang ditambahkan atau dipersempit secara tidak perlu.
