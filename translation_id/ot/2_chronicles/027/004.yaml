base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/004.yaml
  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: id
  text: Ia membangun kota-kota di daerah pegunungan Yehuda, dan di kawasan-kawasan berhutan[a] ia membangun benteng-benteng[b] serta menara-menara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hutan-hutan” atau “belukar-belukar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kubu-kubu” atau “bangunan-bangunan pertahanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: kota-kota
  rationale: Bentuk jamak ini menunjuk pada permukiman perkotaan; “kota-kota” merupakan padanan baku dan wajar dalam konteks pembangunan kerajaan.
- source_word: בָּנָה
  choice: membangun
  rationale: Kata kerja ini secara langsung berarti “membangun” dan mempertahankan gaya narasi yang ringkas.
- source_word: בְּהַר יְהוּדָה
  choice: di daerah pegunungan Yehuda
  rationale: הַר di sini menunjuk pada kawasan geografis berbukit atau bergunung, bukan satu gunung tertentu. Ungkapan ini alami dan cukup luas dalam bahasa Indonesia.
- source_word: חֳרָשִׁים
  choice: kawasan-kawasan berhutan
  rationale: Kata ini mengacu pada daerah yang ditumbuhi pepohonan, hutan, atau belukar. Pilihan ini mempertahankan sifat geografis istilah tersebut tanpa menyiratkan hutan lebat secara berlebihan.
- source_word: בִּירָנִיּוֹת
  choice: benteng-benteng
  rationale: Bentuk jamak ini menunjuk pada bangunan berkubu atau bangunan pertahanan. “Benteng-benteng” paling jelas dan alami bagi pembaca modern.
- source_word: מִגְדָּלִים
  choice: menara-menara
  rationale: Padanan langsung dan lazim untuk bangunan tinggi yang dalam konteks ini kemungkinan berfungsi sebagai pertahanan atau pengawasan.
