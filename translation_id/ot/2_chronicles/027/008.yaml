  text: בֶּן עֶשְׂרִ֧ים וְ/חָמֵ֛שׁ שָׁנָ֖ה הָיָ֣ה בְ/מָלְכ֑/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/008.yaml
  text: He was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem.
translation:
  language: id
  text: Ia berumur dua puluh lima tahun ketika mulai memerintah, dan ia memerintah selama enam belas tahun di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Ungkapan Ibrani ini adalah rumusan usia yang lazim. Dalam bahasa Indonesia modern, “berumur dua puluh lima tahun” menyampaikan maknanya secara alami dan tepat.
- source_word: הָיָה בְמָלְכוֹ
  choice: ketika mulai memerintah
  rationale: Secara harfiah ungkapan ini berkaitan dengan keadaan pada saat ia memerintah, tetapi dalam rumusan pemerintahan raja berfungsi untuk menyatakan usia saat naik takhta. “Ketika mulai memerintah” mempertahankan fungsi temporalnya dengan bahasa Indonesia yang wajar.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: selama enam belas tahun
  rationale: Kata “selama” secara alami menandai rentang waktu pemerintahan dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini berarti menjalankan pemerintahan sebagai raja. “Memerintah” merupakan padanan Indonesia yang langsung dan umum dalam rumusan kerajaan.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi בְּ menyatakan tempat; “di Yerusalem” adalah padanan geografis yang langsung.
