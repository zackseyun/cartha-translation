translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah ukuran kuno “talenta” dan “kor” dipertahankan untuk menghindari konversi spekulatif. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
