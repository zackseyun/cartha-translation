  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: id
  text: Ia berperang melawan raja orang Amon dan mengalahkan mereka. Pada tahun itu orang Amon memberikan kepadanya seratus talenta perak, sepuluh ribu kor gandum, dan sepuluh ribu kor jelai.[a] Orang Amon menyerahkan jumlah yang sama kepadanya juga pada tahun kedua dan ketiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “sepuluh ribu kor gandum dan sepuluh ribu jelai”; satuan “kor” juga dipahami berlaku untuk jelai.
    reason: Elipsis satuan ukuran dalam teks sumber perlu dijelaskan karena “kor” disertakan kembali dalam terjemahan demi kejelasan.
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: berperang melawan
  rationale: Bentuk Nifal dari לחם dengan עִם menyatakan keterlibatan dalam peperangan. Dalam konteks permusuhan ini, “melawan” paling alami dan tidak menyiratkan bahwa kedua pihak bersekutu.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: raja bani Amon
  rationale: בְּנֵי עַמּוֹן adalah sebutan baku bagi orang Amon. “Bani Amon” merupakan bentuk yang ringkas, dikenal luas, dan sesuai dengan ragam bahasa Alkitab Indonesia yang bermartabat.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: mengalahkan mereka
  rationale: Dalam konteks militer, חזק dengan עַל berarti menjadi unggul atau menang atas lawan. “Mengalahkan” menyampaikan hasil peperangan secara jelas dan alami.
- source_word: וַיִּתְּנוּ לוֹ
  choice: memberikan kepadanya
  rationale: Terjemahan ini mempertahankan arti dasar נתן, “memberi,” tanpa lebih dahulu menafsirkan pemberian tersebut secara eksplisit sebagai upeti.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: seratus talenta perak
  rationale: כִּכָּר adalah satuan berat kuno yang secara konvensional diterjemahkan “talenta”; transliterasi ini mempertahankan kekhususan ukuran kuno.
- source_word: כֹּרִים
  choice: kor
  rationale: כֹּר adalah satuan takaran bahan kering. Bentuk transliterasi “kor” mempertahankan satuan kuno secara spesifik tanpa memberikan konversi modern yang tidak pasti.
- source_word: חִטִּים
  choice: gandum
  rationale: Ini adalah padanan Indonesia yang baku dan alami bagi חִטִּים.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: dan sepuluh ribu kor jelai
  rationale: Teks Ibrani tidak mengulangi kata “kor” pada jumlah jelai, tetapi satuan itu secara alami diteruskan dari frasa sebelumnya. Kata tersebut disertakan agar jumlah dapat dipahami dengan jelas dalam bahasa Indonesia, sedangkan elipsis sumber dijelaskan dalam catatan kaki.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: menyerahkan jumlah yang sama kepadanya
  rationale: Kata זֹאת menunjuk pada seluruh jumlah yang baru disebutkan, sedangkan bentuk Hifil שוב secara harfiah berarti “mengembalikan” atau “menyerahkan kembali.” Dalam konteks pembayaran berulang, ungkapan ini menyampaikan bahwa upeti yang sama diserahkan lagi tanpa membuat kalimat Indonesia terasa janggal.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: juga pada tahun kedua dan ketiga
  rationale: “Juga” memperjelas bahwa jumlah yang sama diberikan kembali pada masing-masing dari dua tahun berikutnya, sesuai hubungan kalimat dalam bahasa Ibrani.
