base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: id
  text: Yotam berumur dua puluh lima tahun ketika ia menjadi raja, dan ia memerintah selama enam belas tahun di Yerusalem. Nama ibunya ialah Yerusa, anak perempuan Zadok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Rumus usia Ibrani ini diterjemahkan secara idiomatis dan alami dalam bahasa Indonesia, tanpa mengikuti bentuk harfiah 'anak laki-laki dari dua puluh lima tahun'.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Konstruksi dengan preposisi ב menandai waktu naik takhta; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan rumus catatan pemerintahan.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini menyatakan pelaksanaan pemerintahan sebagai raja, bukan sekadar kepemilikan gelar.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi ב digunakan secara lokatif.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Ungkapan ini mempertahankan isi rumus silsilah dalam susunan bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְרוּשָׁה
  choice: Yerusa
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia; konsonan akhir ה tidak perlu direpresentasikan sebagai 'h' yang terdengar.
- source_word: בַּת צָדוֹק
  choice: anak perempuan Zadok
  rationale: Ungkapan kekerabatan ini secara langsung mengidentifikasi garis keturunan dari pihak ibu.
