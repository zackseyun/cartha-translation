source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: id
  text: Kemudian ia membawa serta para kepala pasukan seratus, para pembesar[a], para penguasa rakyat, dan seluruh rakyat negeri itu[b]. Ia membawa raja turun dari rumah Yahweh. Mereka masuk melalui gerbang atas istana raja[c], lalu mendudukkan raja di atas takhta kerajaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang perkasa”. Istilah Ibrani ini dapat menunjuk kepada orang-orang yang terkemuka atau berkuasa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seluruh rakyat negeri”. Dalam kisah-kisah kerajaan, ungkapan ini sering menyebut rakyat sebagai kelompok sosial-politik.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “rumah raja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ia membawa serta
  rationale: Kata kerja לָקַח pada dasarnya berarti “mengambil”, tetapi dalam konteks ini menunjuk pada tindakan mengikutsertakan atau memimpin kelompok-kelompok tersebut. “Membawa serta” menyampaikan fungsi kontekstualnya secara alami tanpa menghilangkan gagasan bahwa mereka dibawa bersamanya.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: para kepala pasukan seratus
  rationale: Ungkapan ini merupakan gelar militer bagi para pemimpin satuan yang secara harfiah dikaitkan dengan seratus orang. Pilihan ini mempertahankan bentuk Ibrani dan menghindari istilah “senturion” yang bernuansa Romawi.
- source_word: הָאַדִּירִים
  choice: para pembesar
  rationale: אַדִּירִים dapat menunjuk kepada orang-orang terkemuka, berkuasa, atau perkasa. Dalam konteks politik dan istana, “para pembesar” paling wajar, sedangkan kemungkinan “orang-orang perkasa” dicatat dalam catatan kaki.
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: para penguasa rakyat
  rationale: Terjemahan ini mempertahankan gagasan orang-orang yang menjalankan wewenang di tengah atau atas rakyat tanpa menentukan jabatan administratif yang tidak disebutkan teks.
- source_word: כָּל עַם הָאָרֶץ
  choice: seluruh rakyat negeri itu
  rationale: Ungkapan tetap Ibrani ini dipertahankan dalam bentuk Indonesia yang alami. Dalam kisah kerajaan, ungkapan tersebut dapat menyebut rakyat sebagai badan sosial-politik, bukan semata-mata semua penduduk tanpa kecuali.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: Ia membawa raja turun
  rationale: Bentuk kausatif dari יָרַד berarti menyebabkan turun atau membawa turun. Terjemahan ini mempertahankan arah pergerakan dari rumah Yahweh menuju istana.
- source_word: מִבֵּית יְהוָה
  choice: dari rumah Yahweh
  rationale: “Rumah Yahweh” mempertahankan ungkapan Ibrani בֵּית יְהוָה dan nama ilahi yang terdapat langsung dalam teks.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: melalui gerbang atas
  rationale: Dalam konteks gerak masuk, frasa yang secara lebih harfiah berarti “di tengah gerbang atas” secara idiomatis menyatakan jalan masuk melalui gerbang tersebut.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah frasa ini berarti “rumah raja”, tetapi dalam konteks kediaman resmi kerajaan, “istana raja” lebih jelas dan alami. Bentuk harfiahnya dicatat sebagai alternatif.
- source_word: וַיּוֹשִׁיבוּ
  choice: mendudukkan
  rationale: Bentuk kausatif ini berarti “menyebabkan duduk” atau “menempatkan dalam posisi duduk”. “Mendudukkan” sesuai dengan tindakan penobatan di atas takhta.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: takhta kerajaan
  rationale: 'Pilihan ini menyampaikan kedua unsur frasa Ibrani secara alami: takhta dan kerajaan atau pemerintahan kerajaan.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Struktur kalimat mengikuti alur Ibrani, sementara ungkapan gerak dan gelar dibuat cukup alami bagi pembaca umum. Pergantian dari subjek tunggal (“ia”) ke subjek jamak (“mereka”) dipertahankan sesuai bentuk verba Ibrani.
