source:
  edition: WLC
  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: id
  text: Ia menempatkan para penjaga pintu di pintu-pintu rumah Yahweh, supaya tidak seorang pun yang najis dalam hal apa pun masuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak seorang pun yang najis untuk hal apa pun boleh masuk”; maksud ungkapan ini ialah siapa pun yang najis dalam hal atau karena sebab apa pun tidak boleh masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Ia menempatkan
  rationale: Bentuk Hifil dari עמד bersifat kausatif dan di sini menyatakan bahwa Yoyada menempatkan para penjaga pada posisi tugas mereka.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu
  rationale: Kata ini menunjuk kepada petugas yang menjaga pintu atau gerbang; dalam konteks rumah ibadah, 'penjaga pintu' tepat dan alami.
- source_word: עַל שַׁעֲרֵי
  choice: di pintu-pintu
  rationale: Dalam konteks penempatan petugas, עַל menunjukkan posisi pada atau di pintu-pintu masuk.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora 'rumah' dari בַּיִת dan menyajikan nama perjanjian יְהוָה secara langsung sebagai Yahweh.
- source_word: וְלֹא יָבֹא
  choice: supaya ... masuk
  rationale: Rangkaian penghubung dan bentuk imperfect negatif di sini paling wajar dipahami sebagai tujuan penempatan para penjaga.
- source_word: טָמֵא
  choice: yang najis
  rationale: Dalam konteks akses ke rumah Yahweh, istilah ini menyatakan keadaan najis secara ritual.
- source_word: לְכָל דָּבָר
  choice: dalam hal apa pun
  rationale: Ungkapan luas ini mencakup segala keadaan atau sebab yang menjadikan seseorang najis, tanpa membatasi pada satu jenis kenajisan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi itu, bukan menggantinya dengan gelar.
- issue: Cakupan kenajisan dalam לְכָל דָּבָר
  choice: dalam hal apa pun
  alternative: karena sebab apa pun
  rationale: Terjemahan utama mempertahankan keluasan ungkapan Ibrani dan tidak menentukan apakah tekanannya pada jenis, keadaan, atau sebab kenajisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Rumah Yahweh' mempertahankan bentuk konkret teks sumber; 'para penjaga pintu' mudah dipahami dalam konteks pelayanan rumah ibadah. Penanda catatan kaki [a] ditempatkan pada klausa yang dijelaskannya.
