base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: id
  text: 'Inilah yang harus kamu lakukan: sepertiga dari antara kamu yang datang pada hari Sabat—dari kalangan para imam dan orang Lewi—harus bertugas menjaga ambang-ambang pintu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harus bertugas sebagai penjaga pintu di ambang-ambang pintu.” Ungkapan Ibrani menyebut penjaga pintu dan ambang-ambang pintu, sehingga menekankan penjagaan tempat-tempat masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Inilah yang harus kamu lakukan
  rationale: Ungkapan pengantar ini diterjemahkan secara idiomatis, dengan tetap mempertahankan daya perintah dari bentuk Ibrani.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: sepertiga dari antara kamu
  rationale: Menyatakan satu bagian dari tiga bagian dalam kelompok yang disapa; “dari antara” memperjelas hubungan partitif.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: yang datang pada hari Sabat
  rationale: Partisip Ibrani menunjuk kepada orang-orang yang datang atau masuk pada hari Sabat. Terjemahan ini tidak menambahkan secara eksplisit gagasan giliran tugas, meskipun konteks mungkin menyiratkannya.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: dari kalangan para imam dan orang Lewi
  rationale: Frasa ini mengidentifikasi kelompok yang dimaksud tanpa memaksakan keputusan apakah hubungannya terutama bersifat aposisional atau partitif.
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: harus bertugas sebagai penjaga pintu di ambang-ambang pintu
  rationale: Terjemahan mempertahankan kedua unsur konkret dalam bahasa Ibrani, yaitu penjaga pintu dan ambang pintu, sambil memakai susunan yang dapat dipahami dalam bahasa Indonesia.
