base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: id
  text: Kemudian Imam Yoyada memberikan kepada para kepala pasukan seratus orang tombak, perisai, dan perisai besar[a], yang adalah milik Raja Daud dan yang berada di rumah Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani membedakan benda ini dari perisai yang disebut sebelumnya. Makna tepatnya tidak pasti; kemungkinan yang dimaksud ialah jenis perisai yang lebih besar.
    reason: lexical_alternative
  - marker: b
    text: 'Atau “Bait Allah”. Secara harfiah: “rumah Allah”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Bentuk naratif dari נתן menyatakan penyerahan benda secara langsung; “memberikan” alami dan tetap dekat dengan sumber.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: Imam Yoyada
  rationale: Gelar yang diikuti nama merupakan susunan yang alami dalam bahasa Indonesia modern; nama Ibrani ditransliterasikan sebagai Yoyada.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: kepada para kepala pasukan seratus orang
  rationale: Ungkapan ini menunjuk para perwira yang mengepalai kesatuan beranggotakan seratus orang; terjemahan ini mempertahankan struktur dan makna militernya tanpa asosiasi Romawi.
- source_word: הַחֲנִיתִים
  choice: tombak-tombak
  rationale: חנית adalah istilah umum untuk tombak; bentuk jamaknya dipertahankan secara jelas.
- source_word: הַמָּגִנּוֹת
  choice: perisai-perisai
  rationale: מגן adalah istilah umum untuk perisai; pilihan ini jelas dalam bahasa Indonesia modern.
- source_word: הַשְּׁלָטִים
  choice: perisai-perisai besar
  rationale: Istilah ini tampaknya menunjuk jenis alat pertahanan yang berbeda dari מגנים, kemungkinan perisai berukuran besar; perbedaan tersebut dipertahankan, dengan catatan atas ketidakpastian leksikal.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: milik Raja Daud
  rationale: Klausa relatif Ibrani menyatakan kepemilikan. “Milik Raja Daud” menyampaikan makna itu secara langsung tanpa menambahkan nuansa aspek waktu yang tidak dinyatakan.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Ini adalah padanan harfiah ungkapan Ibrani dan mempertahankan diksi khas penulis Tawarikh, meskipun yang dimaksud adalah Bait Allah.
