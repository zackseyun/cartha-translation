base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: id
  text: sepertiga lagi di istana raja, sepertiga lagi di Gerbang Fondasi[a], dan seluruh rakyat di pelataran-pelataran rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Gerbang Dasar”. Kata Ibrani yang diterjemahkan “Fondasi” mungkin merupakan nama khusus sebuah gerbang; lokasi tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: sepertiga lagi
  rationale: Bentuk bilangan ini dipakai secara substantival untuk pembagian kelompok. Kata “lagi” menghubungkan bagian-bagian pembagian yang berlanjut dari konteks sebelumnya.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: di istana raja
  rationale: Secara harfiah berarti “di rumah raja”, tetapi dalam konteks ini menunjuk pada kediaman atau kompleks kerajaan; “istana raja” lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: di Gerbang Fondasi[a]
  rationale: שַׁעַר berarti “gerbang”, sedangkan יְסוֹד berarti “fondasi” atau “dasar”. Kapitalisasi memperlakukan frasa ini sebagai nama gerbang, sambil mempertahankan ketidakpastian rujukannya melalui catatan kaki.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: עָם adalah istilah umum untuk rakyat atau orang banyak. “Seluruh rakyat” alami dalam konteks narasi kerajaan ini.
- source_word: בְּחַצְרוֹת
  choice: di pelataran-pelataran
  rationale: Bentuk jamak חָצֵר menunjuk pada beberapa ruang terbuka berpagar dalam kompleks rumah ibadah. “Pelataran-pelataran” mempertahankan bentuk jamaknya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan langsung yang tetap alami untuk frasa “rumah YHWH”; rujukannya adalah kompleks Bait Allah, tetapi kata “rumah” mempertahankan citra bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama diri itu, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur pembagian dipertahankan dengan pengulangan “sepertiga lagi”; istilah “istana” dipilih agar rujukan kediaman kerajaan jelas bagi pembaca umum.
