base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: id
  text: Kemudian seluruh rakyat pergi ke rumah Baal dan merobohkannya. Mereka menghancurkan mezbah-mezbah dan patung-patungnya, lalu membunuh Matan, imam Baal, di depan mezbah-mezbah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: rumah Baal
  rationale: Menerjemahkan istilah Ibrani secara langsung dan wajar; dalam konteks ini berarti bangunan ibadah atau kuil Baal tanpa perlu mempersempitnya di dalam teks.
- source_word: וַיִּתְּצֻהוּ
  choice: merobohkannya
  rationale: Kata kerja ini menunjuk pada tindakan meruntuhkan atau membongkar bangunan; akhiran pronominal mengacu pada rumah Baal.
- source_word: שִׁבֵּרוּ
  choice: menghancurkan
  rationale: Bentuk intensif menyatakan bahwa mezbah dan patung dipecahkan atau dihancurkan, bukan sekadar dirusak ringan.
- source_word: צְלָמָיו
  choice: patung-patungnya
  rationale: Istilah ini merujuk pada rupa atau patung kultis milik Baal; 'patung-patung' adalah padanan Indonesia yang alami dalam konteks tersebut.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: di depan mezbah-mezbah itu
  rationale: Mempertahankan makna spasial לִפְנֵי dan bentuk jamak 'mezbah-mezbah'; 'itu' membuat rujukan kepada mezbah yang baru disebut menjadi jelas secara alami.
theological_decisions: []
