  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עוֹמֵ֨ד עַֽל עַמּוּד֜/וֹ בַּ/מָּב֗וֹא וְ/הַ/שָּׂרִ֣ים וְ/הַ/חֲצֹצְרוֹת֮ עַל הַ/מֶּלֶךְ֒ וְ/כָל עַ֨ם הָ/אָ֜רֶץ שָׂמֵ֗חַ וְ/תוֹקֵ֨עַ֙ בַּ/חֲצֹ֣צְר֔וֹת וְ/הַ/מְשֽׁוֹרֲרִים֙ בִּ/כְלֵ֣י הַ/שִּׁ֔יר וּ/מוֹדִיעִ֖ים לְ/הַלֵּ֑ל וַ/תִּקְרַ֤ע עֲתַלְיָ֨הוּ֙ אֶת בְּגָדֶ֔י/הָ וַ/תֹּ֖אמֶר קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: id
  text: Ia melihat, dan tampaklah raja berdiri di dekat tiangnya di pintu masuk. Para pemimpin dan trompet berada di samping raja[a]. Seluruh rakyat negeri itu bersukacita dan meniup trompet, dan para penyanyi dengan alat-alat musik memimpin puji-pujian[b]. Lalu Atalya mengoyakkan pakaiannya dan berseru, “Makar! Makar!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “para pemimpin dan trompet berada di samping raja.” “Trompet” mungkin dipakai secara metonimis untuk para peniup trompet.
    reason: lexical_alternative
  - marker: b
    text: Atau “mengarahkan puji-pujian” atau “memberi aba-aba untuk memuji.” Ungkapan Ibraninya bersifat idiomatis dalam konteks musik ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Ketika ia melihat, tampaklah
  rationale: Mengungkapkan urutan naratif dan daya penunjuk הִנֵּה secara alami dalam bahasa Indonesia, tanpa menghilangkan kesan bahwa pemandangan itu tiba-tiba tersaji di hadapannya.
- source_word: עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: di dekat tiangnya pada pintu masuk
  rationale: עַל dalam konteks upacara ini menyatakan kedudukan di sisi atau dekat tiang/tempat berdiri kerajaan, sedangkan מָבוֹא menunjuk pada pintu masuk.
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: Para pemimpin dan trompet-trompet berada di samping raja
  rationale: Mempertahankan bunyi teks Masoret yang secara harfiah menyebut para pemimpin dan trompet, sambil memakai keterangan tempat yang wajar. Kemungkinan metonimia dijelaskan dalam catatan kaki.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ
  choice: Seluruh rakyat negeri itu bersukacita
  rationale: עם הארץ di sini menunjuk pada rakyat negeri/kerajaan, dan שָׂמֵחַ menggambarkan perayaan bersama yang sedang berlangsung.
- source_word: וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: dan meniup trompet
  rationale: תקע dengan חצוצרות merupakan ungkapan lazim untuk meniup atau membunyikan trompet.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: para penyanyi, dengan alat-alat musik
  rationale: מְשׁוֹרֲרִים secara khusus berarti para penyanyi, sedangkan כְּלֵי הַשִּׁיר adalah alat-alat yang digunakan untuk musik atau nyanyian.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: memimpin puji-pujian
  rationale: Dalam suasana musikal-liturgis, bentuk kausatif ידע dapat menyatakan tindakan memberi petunjuk, aba-aba, atau arahan untuk memuji. Pilihan ini menyampaikan fungsinya dengan bahasa Indonesia yang alami sambil mencatat alternatifnya.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Makar! Makar!
  rationale: קֶשֶׁר menunjuk pada persekongkolan atau komplotan melawan penguasa. Dalam konteks perebutan takhta, seruan ringkas 'Makar!' paling alami dan kuat dalam bahasa Indonesia.
