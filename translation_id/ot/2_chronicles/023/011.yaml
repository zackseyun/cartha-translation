  to: Kemudian mereka membawa keluar putra raja, mengenakan mahkota itu pada kepalanya, dan memberikan kesaksian[a] itu kepadanya. Mereka mengangkatnya menjadi raja dan mengurapinya. Yoyada dan anak-anaknya berseru, “Hiduplah raja!”
