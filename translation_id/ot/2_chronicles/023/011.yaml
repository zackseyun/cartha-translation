base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: id
  text: Kemudian mereka membawa keluar putra raja, mengenakan mahkota itu pada kepalanya, dan memberikan kesaksian[a] itu kepadanya. Mereka mengangkatnya menjadi raja dan mengurapinya. Yoyada dan anak-anaknya berseru, “Hiduplah raja!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hukum” atau “dokumen perjanjian.” Istilah Ibrani ini kemungkinan menunjuk pada kesaksian tertulis mengenai perjanjian yang berkaitan dengan pemerintahan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: membawa keluar
  rationale: Bentuk hifil dari יצא berarti menyebabkan keluar atau membawa keluar; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan penampilan resmi pewaris kerajaan.
- source_word: בֶּן הַמֶּלֶךְ
  choice: putra raja
  rationale: Menyampaikan hubungan dinasti secara ringkas dan wajar; “putra” sesuai dengan ragam narasi kerajaan yang bermartabat.
- source_word: הַנֵּזֶר
  choice: mahkota
  rationale: Dalam konteks penobatan, נֵזֶר menunjuk pada tanda kerajaan atau mahkota penahbisan; “mahkota” paling jelas bagi pembaca umum.
- source_word: הָעֵדוּת
  choice: kesaksian
  rationale: Terjemahan formal ini mempertahankan cakupan makna dan gema perjanjian dari istilah Ibrani tanpa mempersempitnya secara pasti menjadi hukum atau dokumen tertentu.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: mengangkatnya menjadi raja
  rationale: Hifil dari מלך berarti menjadikan seseorang raja atau menyebabkan dia memerintah. Pilihan ini alami dan membedakannya dari tindakan mengenakan mahkota.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: mengurapinya
  rationale: Mempertahankan istilah baku untuk tindakan pengurapan dalam pelantikan raja.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: Yoyada dan anak-anaknya
  rationale: Subjek majemuk ini diletakkan secara eksplisit bersama verba “mengurapi,” sesuai susunan Ibrani yang menempatkan subjek sesudah verba.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Hiduplah raja!
  rationale: Mencerminkan bentuk yusif Ibrani sebagai seruan aklamasi kerajaan, sekaligus mempertahankan citra verbal “hidup” dari teks sumber.
theological_decisions:
- issue: Makna הָעֵדוּת dalam upacara penobatan
  choice: kesaksian
  alternative: hukum; dokumen perjanjian
  rationale: Istilah Ibrani dapat menunjuk pada kesaksian tertulis yang berkaitan dengan kewajiban perjanjian seorang raja, tetapi teks tidak mengidentifikasi bendanya secara lebih sempit. Terjemahan utama mempertahankan ketegangan tersebut, sedangkan catatan kaki menyajikan kemungkinan maknanya.
- issue: Pelaku tindakan pengurapan
  choice: Yoyada dan anak-anaknya disebut sebagai pihak yang mengurapi raja
  alternative: Membiarkan pelaku pengurapan tidak disebut secara eksplisit dalam klausa sebelumnya
  rationale: Dalam susunan Ibrani, nama Yoyada dan anak-anaknya mengikuti verba jamak “mengurapinya” dan secara alami berfungsi sebagai subjeknya. Kalimat Indonesia dibuat jelas tanpa mengubah urutan tindakan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat dipecah agar rangkaian tindakan serta pelaku pengurapan tidak rancu. “Putra” dipilih untuk konteks kerajaan, sedangkan seruan “Hiduplah raja!” mempertahankan bentuk dan daya aklamasi teks Ibrani.
