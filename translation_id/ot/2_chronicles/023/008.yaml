base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: id
  text: Orang-orang Lewi dan seluruh Yehuda melakukan segala sesuatu sesuai dengan yang diperintahkan Imam Yoyada. Setiap orang membawa orang-orangnya, yaitu mereka yang datang pada hari Sabat bersama mereka yang pergi pada hari Sabat, sebab Imam Yoyada tidak membebastugaskan kelompok-kelompok giliran itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rombongan-rombongan pelayanan” atau “regu-regu”; yaitu kelompok imam dan orang Lewi yang bertugas menurut jadwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ הַלְוִיִּם וְכָל יְהוּדָה
  choice: Orang-orang Lewi dan seluruh Yehuda melakukan
  rationale: Mengungkapkan kepatuhan secara alami dalam bahasa Indonesia sambil mempertahankan sebutan kolektif 'seluruh Yehuda' dari teks Ibrani.
- source_word: כְּכֹל אֲשֶׁר צִוָּה יְהוֹיָדָע הַכֹּהֵן
  choice: segala sesuatu sesuai dengan yang diperintahkan Imam Yoyada
  rationale: Mempertahankan cakupan menyeluruh כְּכֹל אֲשֶׁר; gelar dan nama ditata secara idiomatis dalam bahasa Indonesia.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: Setiap pemimpin mengumpulkan orang-orangnya
  rationale: אִישׁ bersifat distributif. Dalam konteks ini setiap orang tersebut mengepalai personel tertentu; 'pemimpin' membuat relasi itu jelas, sedangkan 'mengumpulkan' menyampaikan tindakan membawa serta orang-orangnya secara wajar.
- source_word: בָּאֵי הַשַּׁבָּת עִם יוֹצְאֵי הַשַּׁבָּת
  choice: baik mereka yang mulai bertugas pada hari Sabat maupun mereka yang selesai bertugas pada hari Sabat
  rationale: Partisip masuk dan keluar merujuk pada pergantian jadwal pelayanan. Rumusan ini alami dan memperjelas implikasi konteks tanpa mengubah dua kelompok yang dikontraskan.
- source_word: כִּי לֹא פָטַר
  choice: sebab ... tidak membebastugaskan
  rationale: כִּי memberi alasan, sementara פטר di sini berarti tidak melepas personel dari kewajiban mereka setelah giliran selesai.
- source_word: הַמַּחְלְקוֹת
  choice: kelompok-kelompok giliran
  rationale: Istilah ini menunjuk kelompok pelayanan imam dan Lewi yang terorganisasi menurut jadwal. Pilihan ini lebih transparan bagi pembaca Indonesia daripada sekadar 'bagian-bagian'.
