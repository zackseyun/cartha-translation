  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: id
  text: Mereka berkeliling di Yehuda dan mengumpulkan orang-orang Lewi dari semua kota di Yehuda serta para kepala kaum keluarga Israel[a]. Kemudian mereka datang ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harfiah, “para kepala leluhur”; yakni para pemimpin kelompok-kelompok keluarga. Dapat juga diterjemahkan “para kepala keluarga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: berkeliling
  rationale: Dalam konteks ini, סבב menggambarkan perjalanan mengitari atau menjelajahi suatu wilayah untuk menjalankan tugas, bukan sekadar berbalik.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Nama wilayah diterjemahkan dengan bentuk baku bahasa Indonesia; preposisi ב menunjukkan tempat perjalanan itu berlangsung.
- source_word: וַיִּקְבְּצוּ
  choice: mengumpulkan
  rationale: קבץ berarti menghimpun orang-orang menjadi satu; pilihan ini alami dengan objek orang-orang Lewi dan para pemimpin.
- source_word: אֶת־הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan kelompok suku dan pelayanan ini dinyatakan dengan bentuk baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: dari seluruh kota di Yehuda
  rationale: Ungkapan ini menunjukkan asal mereka dari kota-kota di seluruh wilayah Yehuda; 'seluruh kota' alami tanpa menyiratkan hanya satu kota.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: serta para kepala kaum keluarga
  rationale: Ungkapan Ibrani harfiah 'kepala para leluhur/ayah' merupakan idiom administratif-genealogis bagi pemimpin kelompok keluarga. 'Kepala kaum keluarga' mempertahankan corak kelembagaannya sekaligus jelas bagi pembaca modern.
- source_word: לְיִשְׂרָאֵל
  choice: Israel
  rationale: Prefiks ל di sini menyatakan hubungan atau kepemilikan; susunan 'kaum keluarga Israel' secara alami menyampaikan bahwa para kepala itu berasal dari Israel.
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: Kemudian mereka datang ke Yerusalem
  rationale: בוא dengan אֶל lazim berarti datang ke suatu tempat. Kalimat baru memperjelas tahap berikutnya dalam alur tanpa mengubah hubungan naratif.
theological_decisions:
- issue: Cakupan sebutan 'Israel' dalam konteks yang berpusat pada Yehuda
  choice: Mempertahankan 'Israel' tanpa mempersempitnya menjadi 'Yehuda'.
  alternative: Yehuda; umat Israel
  rationale: Teks Ibrani secara eksplisit memakai יִשְׂרָאֵל. Dalam Tawarikh, nama ini dapat menunjuk kepada umat perjanjian secara lebih luas meskipun latarnya kerajaan selatan; terjemahan tidak seharusnya menyelesaikan cakupan itu secara diam-diam.
- issue: Ungkapan kekerabatan רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  alternative: para kepala keluarga leluhur; para kepala keluarga
  rationale: Pilihan utama mempertahankan dimensi kelompok kekerabatan dan fungsi kepemimpinan tanpa memaksakan arti rumah tangga inti modern. Catatan kaki menyimpan alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. Pengulangan 'Yehuda' dipertahankan karena mengikuti penekanan sumber. Konjungsi 'serta' mengoordinasikan kedua objek dari verba 'mengumpulkan', sedangkan kalimat berikutnya menjaga urutan tindakan tetap jelas.
