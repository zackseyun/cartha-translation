base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: id
  text: Seluruh jemaat mengikat perjanjian dengan raja di rumah Allah. Yoyada berkata kepada mereka, “Lihatlah, putra raja akan memerintah, sebagaimana TUHAN telah berfirman tentang anak-anak Daud.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani secara harfiah berarti ‘memotong perjanjian’, tetapi padanan baku dan alami dalam bahasa Indonesia ialah ‘mengikat perjanjian’.
- source_word: כָּל־הַקָּהָל
  choice: seluruh jemaat
  rationale: קהל menunjuk pada himpunan atau umat yang berkumpul; ‘seluruh jemaat’ sesuai dengan konteks pertemuan di rumah Allah.
- source_word: בֶן־הַמֶּלֶךְ
  choice: putra raja
  rationale: ‘Putra’ menyatakan anak laki-laki raja secara jelas dan sesuai dengan ragam bahasa naratif yang bermartabat.
- source_word: יִמְלֹךְ
  choice: akan memerintah
  rationale: Bentuk verba menyatakan bahwa putra raja akan menjalankan pemerintahan sebagai raja.
- source_word: עַל־בְּנֵי דָוִיד
  choice: mengenai keturunan Daud
  rationale: Secara harfiah ‘mengenai anak-anak lelaki Daud’; dalam konteks janji dinasti, ‘keturunan Daud’ lebih alami dan mencakup garis kerajaan yang dimaksud.
theological_decisions:
- issue: Identitas subjek pada ‘ia berkata kepada mereka’
  choice: Yoyada berkata kepada mereka
  alternative: ia berkata kepada mereka
  rationale: Dalam konteks langsung ayat sebelumnya, Yoyada adalah pembicara dan pelaku utama. Menyebut namanya menghindari kerancuan dalam bahasa Indonesia tanpa mengubah rujukan naratif.
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH
  rationale: ‘TUHAN’ adalah padanan baku bahasa Indonesia untuk tetragramaton dan mempertahankan pembedaan dari sebutan umum ‘Allah’ dalam ayat yang sama.
- issue: Janji mengenai keluarga Daud
  choice: keturunan Daud
  alternative: anak-anak Daud
  rationale: Pilihan ini menyampaikan cakupan dinastik ungkapan Ibrani tanpa mempersempitnya pada anak-anak kandung Daud saja.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur kalimat dipecah menjadi dua agar jelas bagi pembaca umum, sementara urutan gagasan dan penegasan ‘Lihatlah’ tetap dipertahankan.
