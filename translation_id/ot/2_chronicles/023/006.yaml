id: 2CH.23.6
reference: 2 Chronicles 23:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: id
  text: Tidak seorang pun boleh masuk ke rumah Yahweh[a], kecuali para imam dan orang-orang Lewi yang bertugas. Merekalah yang boleh masuk, karena mereka kudus. Seluruh rakyat harus menunaikan tugas jaga bagi Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Yahweh.” Secara harfiah, “rumah Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini juga dapat diterjemahkan “harus menjalankan kewajiban yang ditetapkan Yahweh” atau “harus berjaga bagi Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: Tidak seorang pun boleh masuk
  rationale: אַל dengan bentuk yusif menyatakan larangan. Rumusan ini menyampaikan daya larangan secara alami dalam bahasa Indonesia.
- source_word: בֵית יְהוָה
  choice: rumah Yahweh
  rationale: Ungkapan ini secara harfiah berarti 'rumah Yahweh'. Bentuk harfiah dipertahankan dalam teks, sedangkan 'Bait Yahweh' dicatat sebagai padanan kontekstual.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Gabungan ini memperkenalkan pihak yang dikecualikan dari larangan masuk.
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: para imam dan orang-orang Lewi yang bertugas
  rationale: Partisip מְשָׁרְתִים menunjuk kepada orang Lewi yang sedang melaksanakan pelayanan atau tugas sakral. 'Yang bertugas' alami dan tidak mempersempitnya menjadi jabatan denominasi tertentu.
- source_word: הֵמָּה יָבֹאוּ
  choice: Merekalah yang boleh masuk
  rationale: Kata ganti eksplisit הֵמָּה memberi penegasan kepada kelompok yang diizinkan masuk; 'boleh' menyampaikan izin yang tersirat oleh konteks larangan dan pengecualian.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: karena mereka kudus
  rationale: קֹדֶשׁ menyatakan status kekudusan atau pengkhususan bagi pelayanan sakral. 'Kudus' mempertahankan istilah sumber tanpa menggantinya dengan tafsiran yang lebih sempit.
- source_word: וְכָל הָעָם
  choice: Seluruh rakyat
  rationale: הָעָם menunjuk kepada keseluruhan umat atau rakyat yang dibedakan dari para imam dan orang Lewi yang bertugas.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: harus menunaikan tugas jaga bagi Yahweh
  rationale: Konstruksi serumpun שׁמר–מִשְׁמֶרֶת dapat mencakup menjaga, melakukan tugas jaga, atau menaati kewajiban yang dipercayakan. Terjemahan ini mempertahankan unsur penjagaan sekaligus tanggung jawab sakral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Kekudusan para imam dan orang Lewi
  choice: kudus
  alternative: dikhususkan
  rationale: Konteksnya adalah kelayakan sakral untuk memasuki rumah Yahweh. 'Kudus' mempertahankan kategori teologis teks tanpa menyiratkan bahwa mereka sempurna secara moral.
- issue: Makna מִשְׁמֶרֶת יְהוָה
  choice: tugas jaga bagi Yahweh
  alternative: kewajiban yang ditetapkan Yahweh
  rationale: Bentuk Ibrani dapat menunjuk baik kepada penjagaan maupun pelaksanaan kewajiban sakral. Teks utama mempertahankan kedua nuansa sejauh mungkin, dan catatan kaki menyajikan alternatifnya tanpa memutuskan hubungan gramatikal secara berlebihan.
- issue: Penyebutan nama ilahi
  choice: Yahweh
  alternative: TUHAN
  rationale: Bentuk יְהוָה adalah nama ilahi; transliterasi mempertahankan fungsi nama tersebut dan menghindari penggantiannya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat jelas bagi pembaca umum. Penegasan pada הֵמָּה dipertahankan dengan 'Merekalah', sedangkan ambiguitas antara tugas, kewajiban, dan penjagaan pada מִשְׁמֶרֶת dijaga melalui teks utama dan catatan kaki.
