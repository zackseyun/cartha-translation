base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: id
  text: Ia menempatkan seluruh rakyat, masing-masing dengan senjatanya di tangan, dari sisi selatan rumah itu sampai sisi utaranya, dekat mazbah dan dekat rumah itu, mengelilingi raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Ia menempatkan
  rationale: Bentuk kausatif ini menyatakan bahwa Yoyada mengatur orang-orang agar berdiri pada posisi masing-masing.
- source_word: שִׁלְחוֹ
  choice: senjatanya
  rationale: Secara harfiah dapat menunjuk pada benda yang diacungkan atau dilemparkan; dalam konteks penjagaan bersenjata, istilah umum 'senjata' paling alami dan tetap mempertahankan cakupan maknanya.
- source_word: כֶּתֶף הַבַּיִת הַיְמָנִית ... כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: sisi selatan rumah itu ... sisi utaranya
  rationale: Secara harfiah 'sisi kanan ... sisi kiri'; orientasi bangunan dan konteks paralel mendukung arah selatan dan utara, yang lebih jelas bagi pembaca modern.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: dekat mazbah dan dekat rumah itu
  rationale: Preposisi ל dalam gambaran penempatan ini paling wajar menyatakan lokasi di dekat atau pada kawasan mazbah dan rumah TUHAN.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: mengelilingi raja
  rationale: Ungkapan ini menunjukkan posisi perlindungan di sekeliling raja.
theological_decisions: []
