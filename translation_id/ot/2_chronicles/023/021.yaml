  naturalness: Bahasa draf pada umumnya baku dan jelas. “Kota itu tenang” lebih langsung dan setia daripada “menjadi tenang,” yang menambahkan nuansa perubahan keadaan. Pengulangan “dan” pada klausa terakhir mempertahankan koordinasi Ibrani dan tetap alami dalam prosa Indonesia.
  terminology: “Bersukacita,” “rakyat negeri itu,” “menghukum mati,” “Atalya,” dan “dengan pedang” sesuai register modern baku dan konteks naratif. “Menghukum mati” dapat dipakai secara idiomatis untuk הֵמִיתוּ dalam konteks eksekusi ini.
