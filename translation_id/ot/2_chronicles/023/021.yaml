  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: id
  text: Seluruh rakyat negeri itu bersukacita, dan kota itu tenang. Dan mereka menghukum mati Atalya dengan pedang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: bersukacita
  rationale: Bentuk dari שׂמח menyatakan kegembiraan; “bersukacita” alami dan sesuai dengan suasana perayaan umum.
- source_word: כָל עַם הָאָרֶץ
  choice: seluruh rakyat negeri itu
  rationale: Ungkapan ini menunjuk kepada penduduk atau rakyat negeri tersebut. “Rakyat negeri itu” mempertahankan cakupan kolektif tanpa mengartikannya sebagai seluruh dunia.
- source_word: וְהָעִיר שָׁקָטָה
  choice: dan kota itu menjadi tenang
  rationale: שׁקט menyatakan keadaan tenang atau bebas dari pergolakan. “Menjadi tenang” sesuai dengan peralihan keadaan dalam konteks narasi.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: Mereka telah menghukum mati Atalya
  rationale: Hifil dari מות berarti menyebabkan mati dan dalam konteks ini menunjuk pada pelaksanaan hukuman mati. Konjungsi waw diterjemahkan secara koordinatif, sedangkan “telah” menunjukkan bahwa kematian Atalya mendahului ketenangan kota secara logis tanpa mengubahnya menjadi hubungan sebab yang dinyatakan eksplisit.
- source_word: בֶחָרֶב
  choice: dengan pedang
  rationale: Penggunaan ב bersifat instrumental dan menyebut sarana pelaksanaan hukuman secara konkret.
theological_decisions:
- issue: Hubungan antara ketenangan kota dan kematian Atalya
  choice: Dipertahankan sebagai dua pernyataan yang dikoordinasikan, dengan urutan logis diperjelas melalui “telah”.
  alternative: “Sebab mereka telah menghukum mati Atalya dengan pedang,” yang menjadikan klausa terakhir sebagai penjelasan sebab.
  rationale: Waw Ibrani secara formal adalah konjungsi sederhana dan tidak dengan sendirinya menetapkan hubungan sebab. Terjemahan tidak seharusnya menutup ambiguitas hubungan antarklausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama עֲתַלְיָהוּ ditulis “Atalya,” bentuk yang ringkas dan dekat dengan bunyi Ibrani. Tidak diperlukan catatan kaki karena hubungan koordinatif dipertahankan dalam teks utama.
