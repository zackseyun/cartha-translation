base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: id
  text: Ketika Atalya mendengar suara rakyat yang berlari dan memuji raja, ia datang menemui rakyat di rumah TUHAN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֹול
  choice: suara
  rationale: Dalam konteks ini menunjuk pada bunyi ramai yang didengar Atalya; 'suara' mempertahankan cakupan umum istilah Ibrani tanpa menambahkan penilaian.
- source_word: הָרָצִים
  choice: yang berlari
  rationale: Menerjemahkan partisip aktif secara langsung dan mempertahankan gambaran gerak rakyat.
- source_word: הַמְהַלְלִים
  choice: memuji
  rationale: Bentuk ini berarti menyatakan pujian; objeknya adalah raja.
- source_word: בֵּית יְהוָה
  choice: rumah TUHAN
  rationale: Ungkapan baku dan mudah dipahami untuk tempat ibadah yang dikaitkan dengan nama ilahi YHWH.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Mengikuti kebiasaan terjemahan Alkitab bahasa Indonesia yang menandai nama ilahi dengan huruf kapital, tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan serta ambiguitas wajar tentang sifat 'suara' dipertahankan; nama Atalya memakai ejaan Indonesia yang lazim.
