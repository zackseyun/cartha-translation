  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: id
  text: Lalu Imam Yoyada membawa keluar para panglima pasukan seratus yang ditugaskan memimpin tentara. Ia berkata kepada mereka, “Bawalah dia keluar melalui sela-sela barisan[a], dan siapa pun yang mengikuti dia harus dibunuh dengan pedang.” Sebab imam itu telah berkata, “Jangan membunuhnya di Bait Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke luar dari barisan-barisan.” Ungkapan Ibraninya sulit dipastikan; kemungkinan besar Atalya harus dibawa keluar melalui atau di antara barisan para penjaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: membawa keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan kausatif, yaitu membuat seseorang keluar atau membawa keluar. Pilihan ini wajar dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: para kepala pasukan seratus
  rationale: Ungkapan ini adalah gelar kemiliteran bagi para pemimpin satuan yang terdiri atas seratus orang. Pilihan ini menghindari istilah yang berkonotasi khusus pada militer Romawi.
- source_word: פְּקוּדֵי הַחַיִל
  choice: yang ditugaskan memimpin tentara
  rationale: Bentuk ini menunjukkan orang-orang yang diberi tugas atau wewenang sehubungan dengan pasukan. Kata 'memimpin' memperjelas fungsi resmi mereka secara alami dalam bahasa Indonesia.
- source_word: הוֹצִיאוּהָ
  choice: Bawalah dia keluar
  rationale: Kata kerja perintah jamak dengan akhiran objek feminin tunggal ini merujuk kepada Atalya dan mempertahankan arti kausatif 'membawa keluar'.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: melalui sela-sela barisan
  rationale: Ungkapan Ibrani ini sulit. Dalam konteks penjagaan militer, הַשְּׂדֵרוֹת kemungkinan menunjuk pada barisan-barisan yang tersusun. Terjemahan ini menyampaikan kemungkinan makna utama tanpa menyembunyikan ketidakpastiannya; alternatif dicatat dalam catatan kaki.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: siapa pun yang mengikuti dia
  rationale: Partisip הבא bersama אַחֲרֶיהָ menunjuk kepada orang yang datang atau mengikuti di belakang Atalya, kemungkinan sebagai pendukungnya.
- source_word: יוּמַת בֶּחָרֶב
  choice: harus dihukum mati dengan pedang
  rationale: Bentuk pasif dalam konteks perintah memiliki daya wajib. Ungkapan ini mempertahankan nada resmi perintah eksekusi.
- source_word: כִּי אָמַר הַכֹּהֵן
  choice: Sebab imam itu telah berkata
  rationale: Klausa ini menjelaskan alasan bagi perintah sebelumnya. 'Telah berkata' menunjukkan bahwa larangan tersebut sudah diberikan sebelumnya.
- source_word: לֹא תְמִיתוּהָ
  choice: Jangan hukum dia mati
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau menghukum mati. Pilihan ini mempertahankan corak resmi, bukan sekadar tindakan membunuh.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora baku 'rumah' untuk בית dan menghadirkan nama ilahi יהוה secara langsung sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama pribadi tersebut dan tidak menggantinya dengan gelar.
- issue: Larangan mengeksekusi Atalya di tempat kudus
  choice: Jangan hukum dia mati di rumah Yahweh
  alternative: Jangan bunuh dia di Bait Yahweh
  rationale: Terjemahan mempertahankan larangan lokasi secara eksplisit tanpa menambahkan alasan teologis yang tidak dinyatakan oleh ayat, sekaligus mempertahankan hubungan leksikal antara בית dan 'rumah'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara istilah jabatan militer dan nada resmi perintah eksekusi tetap dipertahankan. Penanda catatan kaki ditempatkan tepat pada frasa Ibrani yang maknanya tidak pasti.
