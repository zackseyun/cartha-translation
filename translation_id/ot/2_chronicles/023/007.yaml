source:
  edition: WLC
  text: וְ/הִקִּיפוּ֩ הַ/לְוִיִּ֨ם אֶת הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/בַּ֖יִת יוּמָ֑ת וִֽ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֹא֥/וֹ וּ/בְ/צֵאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: id
  text: Orang-orang Lewi harus mengelilingi raja dari segala sisi, masing-masing dengan senjata di tangannya. Siapa pun yang masuk ke dalam rumah itu[a] harus dihukum mati. Hendaklah kalian menyertai raja ketika ia masuk dan ketika ia keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Bait TUHAN"; secara harfiah, "rumah itu." Dalam Kitab Tawarikh, sebutan ini lazim dipakai untuk Bait TUHAN.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ
  choice: harus mengelilingi
  rationale: Bentuk Hifil dalam rangkaian petunjuk Yoyada menyatakan perintah; 'harus mengelilingi' mempertahankan daya direktifnya secara alami.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan langsung bagi kelompok Lewi yang bertugas menjaga raja.
- source_word: סָבִיב
  choice: dari segala sisi
  rationale: Menegaskan bahwa raja harus dikelilingi sepenuhnya, bukan hanya dijaga dari satu arah.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: masing-masing dengan senjata di tangannya
  rationale: אִישׁ dipakai secara distributif, sedangkan כֵלָיו dalam konteks penjagaan bersenjata berarti senjata atau perlengkapan tempur.
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: Siapa pun yang masuk ke dalam rumah itu
  rationale: Partisipel berartikel mempunyai cakupan umum; 'siapa pun' menyampaikan fungsi ketentuan tersebut dengan jelas.
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: Mempertahankan arti harfiah בַּיִת dan penunjukan tertentu oleh artikelnya; konteks bahwa yang dimaksud dapat berupa rumah TUHAN/bait dijelaskan dalam catatan kaki.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal menyatakan tindakan pasif berupa eksekusi, bukan sekadar mengalami kematian.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Hendaklah kalian menyertai raja
  rationale: Ungkapan היה dengan אֶת menyatakan keberadaan bersama atau pendampingan; 'menyertai' sesuai dengan konteks perlindungan dan mempertahankan bentuk perintah jamak.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: ketika ia masuk dan ketika ia keluar
  rationale: Menyampaikan secara wajar pasangan ungkapan Ibrani yang merujuk pada pergerakan raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' memperjelas bahwa perintah terakhir ditujukan kepada kelompok jamak, sedangkan 'hendaklah' mempertahankan nada instruktif. Tanda titik dipakai untuk memecah rangkaian panjang agar mudah dipahami tanpa mengubah hubungan maknanya.
