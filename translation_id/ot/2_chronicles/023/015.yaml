base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: id
  text: Lalu mereka menangkap dia, dan dia pergi ke jalan masuk Gerbang Kuda di istana raja[a]. Di sanalah mereka membunuh dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di rumah raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: mereka menangkap dia
  rationale: Ungkapan harfiahnya adalah “mereka menaruh tangan padanya.” Dalam konteks penahanan yang segera diikuti pembunuhan, ungkapan ini paling wajar berarti menangkap atau memegangnya.
- source_word: מְבוֹא
  choice: jalan masuk
  rationale: Nomina ini menunjuk pada jalan atau tempat masuk; “jalan masuk” alami dalam bahasa Indonesia dan tidak memaksakan apakah yang dimaksud tepat di ambang gerbang atau jalur menuju gerbang.
- source_word: שַׁעַר הַסּוּסִים
  choice: Gerbang Kuda
  rationale: Frasa ini tampaknya merupakan nama sebuah gerbang, sehingga diterjemahkan sebagai nama tempat.
- source_word: בֵּית הַמֶּלֶךְ
  choice: di istana raja
  rationale: Secara harfiah berarti “rumah raja,” tetapi dalam konteks kediaman kerajaan, “istana raja” merupakan padanan Indonesia yang jelas dan alami. Hubungan sintaksisnya dengan gerbang dapat dipahami sebagai lokasi gerbang tersebut.
- source_word: וַיְמִיתוּהָ
  choice: mereka membunuh dia
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati atau membunuh. “Membunuh dia” akurat dan tidak menambahkan nuansa proses hukum yang dapat tersirat oleh “mengeksekusi.”
- source_word: שָׁם
  choice: di sanalah
  rationale: Adverbia tempat ini berarti “di sana”; partikel -lah secara alami memberi penekanan lokasi yang sesuai dengan susunan Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Menangkap dia” dipilih daripada ungkapan harfiah “menaruh tangan padanya,” yang tidak idiomatis dalam bahasa Indonesia. Kalimat kedua dipisahkan untuk menjaga kelancaran dan menegaskan lokasi pembunuhan.
