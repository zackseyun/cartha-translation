  text: וַ/יִּכְרֹ֤ת יְהוֹיָדָע֙ בְּרִ֔ית בֵּינ֕/וֹ וּ/בֵ֥ין כָּל הָ/עָ֖ם וּ/בֵ֣ין הַ/מֶּ֑לֶךְ לִ/הְי֥וֹת לְ/עָ֖ם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: id
  text: Kemudian Yoyada mengadakan perjanjian[a] antara dirinya, seluruh rakyat, dan raja, supaya mereka menjadi umat Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong perjanjian”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “untuk menjadi suatu umat bagi Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת בְּרִית
  choice: mengadakan perjanjian
  rationale: Ungkapan Ibrani ini secara harfiah berarti “memotong perjanjian”, tetapi “mengadakan perjanjian” merupakan padanan bahasa Indonesia yang alami untuk tindakan menetapkan ikatan yang khidmat. “Kemudian” mencerminkan kelanjutan narasi yang ditandai waw-konsekutif.
- source_word: יְהוֹיָדָע
  choice: Yoyada
  rationale: Bentuk nama yang lazim dan mudah dipahami dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֵּינוֹ
  choice: antara dirinya
  rationale: Pronomina ini merujuk kembali kepada Yoyada. “Dirinya” memperjelas bahwa Yoyada sendiri merupakan salah satu pihak dalam perjanjian.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Menerjemahkan cakupan כָּל dan nomina kolektif הָעָם tanpa menambahkan frasa “negeri” yang tidak terdapat dalam ayat ini.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung bagi nomina definit; dalam bahasa Indonesia, definiteness sudah jelas dari konteks dan tidak memerlukan kata sandang tersendiri.
- source_word: לִהְיוֹת לְעָם
  choice: supaya mereka menjadi umat
  rationale: Infinitif menyatakan tujuan atau hasil perjanjian. “Supaya” mempertahankan nuansa tujuan tanpa menutup kemungkinan nuansa hasil, sedangkan “umat” sesuai dengan konteks hubungan perjanjian dengan Allah.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”. Dalam konstruksi “umat Yahweh”, hubungan kepunyaan atau kesetiaan yang dinyatakan oleh ל tersampaikan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut nama perjanjian Allah secara langsung. “Yahweh” mempertahankan nama diri itu dan membedakannya dari gelar umum “Tuhan”.
- issue: Pihak-pihak dalam perjanjian
  choice: Yoyada, seluruh rakyat, dan raja dipahami sebagai pihak-pihak yang disebutkan dalam perjanjian
  alternative: Yahweh dipahami sebagai salah satu pihak yang tersirat dalam daftar tersebut
  rationale: Susunan Ibrani secara eksplisit menyebut “antara dirinya, antara seluruh rakyat, dan antara raja”. Yahweh baru disebut dalam klausa tujuan sebagai Dia yang memiliki umat itu, bukan secara eksplisit sebagai salah satu unsur dalam daftar pihak.
- issue: Nuansa klausa לִהְיוֹת לְעָם לַיהוָה
  choice: supaya mereka menjadi umat Yahweh
  alternative: untuk menjadi suatu umat bagi Yahweh
  rationale: Pilihan utama menyampaikan hubungan kepunyaan perjanjian secara alami. Catatan kaki mempertahankan bentuk yang lebih dekat dengan struktur Ibrani dan menunjukkan bahwa ל dapat menyatakan orientasi, kepunyaan, atau kesetiaan kepada Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mengadakan perjanjian” dipilih sebagai ungkapan alami, sedangkan “umat Yahweh” mempertahankan bobot relasional dan teologis dari rumusan perjanjian tanpa menambahkan unsur yang tidak dinyatakan oleh teks.
