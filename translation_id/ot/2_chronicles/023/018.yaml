revisions:
- from: Yoyada menetapkan pengawasan atas rumah Yahweh di bawah tanggung jawab para imam, yaitu orang-orang Lewi,[a] yang telah dibagi oleh Daud untuk melayani di rumah Yahweh, agar mereka mempersembahkan kurban-kurban bakaran kepada Yahweh sebagaimana tertulis dalam Taurat Musa, dengan sukacita dan nyanyian, menurut petunjuk Daud.[b]
  to: Yoyada menyerahkan pengawasan rumah Yahweh kepada para imam, orang-orang Lewi,[a] yang telah Daud tetapkan untuk bertugas di rumah Yahweh, untuk mempersembahkan kurban-kurban bakaran kepada Yahweh, sebagaimana tertulis dalam Taurat Musa, dengan sukacita dan nyanyian, menurut petunjuk Daud.[b]
  rationale: Revisi menghindari penyelesaian atas ambiguitas yang disengketakan dalam "para imam, orang-orang Lewi", memperbaiki pengungkapan penetapan personel oleh Daud, dan melicinkan idiom administratif tanpa mengubah makna. Kedua jangkar catatan kaki tetap melekat pada unsur yang tepat.
