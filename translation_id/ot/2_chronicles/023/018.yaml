id: 2CH.23.18
reference: 2 Chronicles 23:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: id
  text: Yoyada menyerahkan pengawasan rumah Yahweh kepada para imam, orang-orang Lewi,[a] yang telah Daud tetapkan untuk bertugas di rumah Yahweh, untuk mempersembahkan kurban-kurban bakaran kepada Yahweh, sebagaimana tertulis dalam Taurat Musa, dengan sukacita dan nyanyian, menurut petunjuk Daud.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat dipahami sebagai “para imam Lewi” atau “para imam dan orang-orang Lewi.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “melalui tangan Daud”; maksudnya mungkin menurut pengaturan atau ketetapan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: menetapkan pengawasan
  rationale: שׂים secara harfiah berarti 'menaruh/menetapkan', sedangkan פְּקֻדּוֹת dalam konteks tata pelayanan bait menunjuk pada pengawasan atau tanggung jawab yang ditetapkan.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani secara transparan tanpa menggantinya dengan tafsiran 'bait'.
- source_word: בְּיַד
  choice: di bawah tanggung jawab
  rationale: Ungkapan harfiah 'di tangan' di sini merupakan idiom administratif tentang penyerahan tanggung jawab; padanan ini alami dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam, yaitu orang-orang Lewi
  rationale: Mencerminkan kemungkinan hubungan aposisional dalam teks Ibrani, sambil menandai bahwa konstruksi itu dapat dipahami dengan cara lain melalui catatan kaki.
- source_word: אֲשֶׁר חָלַק דָּוִיד
  choice: yang telah dibagi oleh Daud untuk melayani
  rationale: חלק berarti 'membagi/mengatur dalam kelompok-kelompok'; tambahan 'untuk melayani' membuat fungsi pembagian personel itu jelas dari konteks tanpa menghilangkan citra pembagian.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: agar mereka mempersembahkan kurban-kurban bakaran
  rationale: Ini merupakan istilah baku bagi tindakan mempersembahkan עֹלָה, kurban yang dibakar seluruhnya di mezbah.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: sebagaimana tertulis dalam Taurat Musa
  rationale: Mempertahankan formula rujukan kepada ketetapan tertulis Musa dengan bahasa Indonesia yang wajar.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: dengan sukacita dan nyanyian
  rationale: Mempertahankan bentuk nomina dan nuansa peribadatan dari pasangan kata Ibrani.
- source_word: עַל יְדֵי דָוִיד
  choice: menurut petunjuk Daud
  rationale: Secara harfiah 'melalui tangan Daud'; dalam konteks ini kemungkinan besar menunjuk pada pengaturan atau ketetapan liturgis Daud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam Tetragramaton sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Hubungan antara 'para imam' dan 'orang-orang Lewi'
  choice: para imam, yaitu orang-orang Lewi
  alternative: para imam dan orang-orang Lewi; para imam Lewi
  rationale: Konstruksi Ibrani הַכֹּהֲנִים הַלְוִיִּם dapat dibaca secara aposisional atau sebagai penyebutan kelompok yang berkaitan. Teks utama memakai pembacaan aposisional, sedangkan catatan mempertahankan kemungkinan lain.
- issue: Makna עַל יְדֵי דָוִיד
  choice: menurut petunjuk Daud
  alternative: melalui tangan Daud; dengan perantaraan Daud
  rationale: Dalam konteks pelayanan musik dan kurban yang sudah ditata Daud, ungkapan ini paling alami menunjuk pada pengaturan atau petunjuknya, tetapi nuansa harfiahnya dicatat.
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankan fungsinya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'rumah Yahweh', 'Taurat Musa', dan 'kurban bakaran' mempertahankan tekstur serta istilah keagamaan sumber, sementara idiom administratif dialihkan secara alami.
