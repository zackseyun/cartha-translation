  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: id
  text: Pada tahun ketujuh, Yoyada menguatkan dirinya. Ia membawa para kepala pasukan seratus orang ke dalam perjanjian dengannya[a], yaitu Azarya anak Yeroham, Ismael anak Yohanan, Azarya anak Obed, Maaseya anak Adaya, dan Elisafat anak Zikhri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah memadukan kata “mengambil” dengan “bersamanya” dan “di dalam/ke dalam perjanjian”. Maksudnya, Yoyada mengikutsertakan para perwira ini dalam suatu ikatan perjanjian dengannya; dapat juga diterjemahkan, “mengadakan perjanjian dengan mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: Pada tahun ketujuh
  rationale: Frasa temporal ini diterjemahkan secara wajar dalam bahasa Indonesia; waw penghubung tidak perlu dinyatakan pada awal ayat.
- source_word: הִתְחַזַּק
  choice: menguatkan dirinya
  rationale: 'Bentuk hitpael mempertahankan nuansa refleksif: Yoyada meneguhkan atau memberanikan dirinya untuk bertindak.'
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: Ia membawa ... ke dalam perjanjian dengannya
  rationale: Terjemahan ini mempertahankan verba dasar 'mengambil/membawa' sekaligus menyampaikan bahwa para perwira itu diikutsertakan dalam suatu ikatan perjanjian dengan Yoyada. Pemisahan menjadi dua kalimat menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah urutan tindakan.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: para kepala pasukan seratus orang
  rationale: Istilah ini menunjuk kepada perwira yang memimpin satuan beranggotakan seratus orang; rumusan ini jelas dan tidak memasukkan asosiasi militer Romawi.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: Azarya ... Ismael ... Azarya ... Maaseya ... dan Elisafat
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; dua orang berbeda yang sama-sama bernama Azarya tetap dipertahankan.
- source_word: בֶן
  choice: anak
  rationale: Padanan patronimik yang alami dalam bahasa Indonesia.
