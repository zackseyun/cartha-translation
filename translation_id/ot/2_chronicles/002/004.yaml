  text: וְ/הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֑וֹל כִּֽי גָד֥וֹל אֱלֹהֵ֖י/נוּ מִ/כָּל הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/004.yaml
  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: id
  text: Dan rumah[a] yang sedang kubangun itu besar, sebab Allah kita lebih besar daripada segala allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Bait Allah”. Secara harfiah: “rumah”.'
    reason: lexical_alternative
  - marker: b
    text: Atau “Allah kita besar melebihi segala allah”. Bahasa Ibrani memakai kata “besar” dengan ungkapan “daripada segala allah” untuk menyatakan perbandingan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: Dan rumah
  rationale: בַּיִת secara harfiah berarti “rumah” dan dalam konteks ini menunjuk pada rumah ibadah atau Bait Allah. “Rumah” mempertahankan ungkapan Ibrani serta gaungnya sebagai rumah Allah; alternatif kontekstualnya ialah “Bait Allah”.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: yang sedang kubangun itu
  rationale: Partisipel בוֹנֶה menggambarkan pembangunan sebagai pekerjaan yang sedang berlangsung atau sedang dilaksanakan. Bentuk “kubangun” alami dalam bahasa Indonesia, sedangkan “sedang” memperjelas aspeknya; “itu” menandai pokok kalimat secara wajar.
- source_word: גָּדוֹל
  choice: akan menjadi besar
  rationale: Kata גָּדוֹל mencakup kebesaran ukuran maupun arti penting. Karena klausa Ibrani tidak memakai kopula dan pembangunan belum selesai, “akan menjadi besar” menyampaikan keadaan hasil yang dimaksud tanpa membatasinya hanya pada ukuran fisik.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi kebesaran bangunan tersebut. “Sebab” jelas, alami, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Ini adalah padanan baku bagi bentuk אֱלֹהִים dengan akhiran orang pertama jamak ketika mengacu kepada Allah Israel.
- source_word: גָדוֹל ... מִכָּל
  choice: lebih besar daripada segala
  rationale: Walaupun גָדוֹל tidak memiliki bentuk komparatif khusus, konstruksi dengan מִן menyatakan perbandingan. Bahasa Indonesia secara alami mengungkapkannya dengan “lebih besar daripada”.
- source_word: הָאֱלֹהִים
  choice: allah
  rationale: Dalam perbandingan ini אֱלֹהִים menunjuk kepada ilah-ilah lain. Huruf kecil membedakannya dari “Allah kita” tanpa menjelaskan secara sepihak apakah yang dimaksud adalah berhala, dewa yang dianggap ada, atau makhluk ilahi.
theological_decisions:
- issue: Perbandingan Allah Israel dengan ilah-ilah lain
  choice: Allah kita lebih besar daripada segala allah
  alternative: Allah kita besar mengatasi segala allah
  rationale: Konstruksi Ibrani paling alami dipahami sebagai perbandingan. Terjemahan ini mempertahankan retorika teks tanpa menetapkan hakikat “segala allah” tersebut atau memasukkan penjelasan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kubangun” menjaga kelancaran tuturan orang pertama. Kapitalisasi “Allah” dan “allah” membantu pembaca membedakan Allah Israel dari ilah-ilah yang dibandingkan, tanpa menghapus ketegangan teologis dalam teks.
