base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: id
  text: Lihatlah, untuk para penebang, yaitu orang-orang yang menebang pohon, aku telah memberikan kepada hamba-hambamu dua puluh ribu kor gandum tumbuk[a], dua puluh ribu kor jelai, dua puluh ribu bat anggur, dan dua puluh ribu bat minyak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini tidak biasa; mungkin juga berarti “gandum untuk makanan” atau “gandum yang diremukkan.”
    reason: lexical_alternative
  - marker: b
    text: Kor adalah satuan takaran kering kuno, sedangkan bat adalah satuan takaran cair kuno.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Ketahuilah
  rationale: Menyampaikan fungsi penanda wacana dan penarik perhatian dari הִנֵּה dalam bahasa Indonesia yang alami dan bermartabat; waw penghubung tidak perlu diterjemahkan secara mekanis.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: untuk para penebang, yaitu orang-orang yang menebang pohon
  rationale: Mempertahankan kedua ungkapan partisipial yang hampir bersinonim, dengan 'yaitu' untuk memperjelas hubungan aposisionalnya dalam bahasa Indonesia.
- source_word: נָתַתִּי
  choice: aku telah memberikan
  rationale: Bentuk perfektif dipahami sebagai komitmen yang sudah ditetapkan dalam konteks surat; 'telah memberikan' mempertahankan aspek itu.
- source_word: חִטִּים מַכּוֹת
  choice: gandum tumbuk
  rationale: מַכּוֹת merupakan ungkapan sulit yang kemungkinan menunjuk pada gandum yang telah diproses dengan ditumbuk. Ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: לַעֲבָדֶיךָ
  choice: kepada hamba-hambamu
  rationale: Mengikuti konstruksi pemberian dengan לְ dan mempertahankan arti leksikal עֲבָדִים tanpa mempersempitnya menjadi sekadar pekerja.
- source_word: כֹּרִים
  choice: kor
  rationale: Satuan kering kuno ditransliterasikan dan tidak dikonversi ke ukuran modern yang nilainya dapat diperdebatkan.
- source_word: בַּתִּים
  choice: bat
  rationale: Satuan cair kuno ditransliterasikan agar unsur budaya sumber tetap terpelihara.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan Indonesia yang lazim dalam konteks daftar bahan persediaan.
- source_word: שֶׁמֶן
  choice: minyak
  rationale: Teks hanya menyebut minyak; tidak ditambah keterangan 'zaitun' meskipun hal itu mungkin dimaksudkan dalam konteks.
- source_word: עֶשְׂרִים אֶלֶף
  choice: dua puluh ribu
  rationale: Bilangan diterjemahkan secara langsung dan diulangi untuk setiap jenis persediaan sebagaimana dalam teks sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'aku' dan '-mu' mengikuti tuturan orang pertama dalam surat kepada seorang raja tanpa menambahkan gelar yang tidak terdapat dalam ayat. Istilah ukuran kuno dipertahankan sebagai 'kor' dan 'bat'; satu catatan gabungan menghindari pengulangan yang tidak perlu.
