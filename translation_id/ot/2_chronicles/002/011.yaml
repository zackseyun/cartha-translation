id: 2CH.2.11
reference: 2 Chronicles 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: id
  text: Lalu Huram berkata[a], “Terpujilah Yahweh, Allah Israel, yang menjadikan langit dan bumi, yang telah mengaruniakan kepada Raja Daud seorang anak yang bijaksana, yang memiliki akal budi dan pengertian,[b] dan yang akan membangun sebuah rumah bagi Yahweh serta sebuah rumah bagi kerajaannya.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini ditulis “Hiram” dalam kisah sejajar di 1 Raja-Raja; Kitab Tawarikh memakai bentuk Ibrani “Huram” di sini.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “yang memiliki wawasan dan pengertian” atau “yang memiliki kebijaksanaan dan pengertian.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “rumah bagi kerajaannya,” yaitu bangunan untuk pemerintahan kerajaannya; ungkapan ini mungkin mengacu pada istana atau kompleks kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; ‘lalu’ menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: חוּרָם
  choice: Huram
  rationale: Mengikuti bentuk nama Ibrani חוּרָם dalam Kitab Tawarikh tanpa menyelaraskannya dengan bentuk Hiram dalam kisah sejajar di Kitab Raja-Raja.
- source_word: בָּרוּךְ יְהוָה
  choice: Terpujilah Yahweh
  rationale: Ungkapan pujian yang wajar dan khidmat dalam bahasa Indonesia serta mempertahankan nama ilahi.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: yang menjadikan langit dan bumi
  rationale: Meneruskan ungkapan penciptaan Ibrani secara alami; bahasa Indonesia lazim memakai ‘langit’ sebagai nomina kolektif.
- source_word: נָתַן לְדָוִיד הַמֶּלֶךְ
  choice: telah mengaruniakan kepada Raja Daud
  rationale: ‘Mengaruniakan’ menyampaikan pemberian Allah dengan register yang khidmat, sedangkan ‘telah’ menandai hasil yang tetap relevan.
- source_word: בֵּן חָכָם
  choice: seorang anak yang bijaksana
  rationale: חָכָם mencakup hikmat dan kemampuan praktis; ‘bijaksana’ merupakan padanan Indonesia yang luas dan alami.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: yang memiliki akal budi dan pengertian
  rationale: Ungkapan ini menggambarkan kecakapan batin sang anak. ‘Akal budi’ mempertahankan nuansa pertimbangan yang baik, sementara ‘pengertian’ mewakili kemampuan memahami dan membedakan.
- source_word: בַּיִת לַיהוָה
  choice: sebuah rumah bagi Yahweh
  rationale: Walaupun yang dimaksud ialah bait, teks Ibrani memakai בַּיִת, ‘rumah’; bentuk itu dipertahankan agar hubungan dengan ‘rumah’ berikutnya tetap terlihat.
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: sebuah rumah bagi kerajaannya
  rationale: Terjemahan ini mempertahankan pengulangan בַּיִת dan ungkapan Ibrani yang dapat menunjuk pada bangunan bagi pemerintahan kerajaan, kemungkinan istana.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian secara langsung; transliterasi ‘Yahweh’ mempertahankan nama pribadi itu dan membedakannya dari gelar.
- issue: Makna ‘rumah bagi kerajaannya’
  choice: Mempertahankan ungkapan sumber tanpa menentukannya hanya sebagai istana
  alternative: istana kerajaannya
  rationale: Dalam konteks ini ungkapan tersebut mungkin menunjuk pada istana atau kompleks kerajaan, tetapi kata sumber tetap בַּיִת, ‘rumah’. Terjemahan utama menjaga keluasan ungkapannya dan catatan kaki menjelaskan kemungkinan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur berkat dipertahankan, tetapi kalimat dibagi secara alami dengan ‘Dialah’ agar rangkaian klausa relatif Ibrani mudah dipahami. Pengulangan ‘rumah’ sengaja dipertahankan untuk mencerminkan bentuk sumber dan menjaga kemungkinan maknanya.
