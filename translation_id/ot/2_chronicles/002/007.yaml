translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “hamba-hamba” dipertahankan untuk relasi kerajaan dalam konteks ini. Pengulangan “kayu” memperjelas bahwa ketiga istilah merupakan bahan yang diminta. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
