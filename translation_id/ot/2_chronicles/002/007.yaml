  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: id
  text: Kirimkanlah kepadaku kayu aras, kayu sanobar[a], dan kayu algum[b] dari Lebanon, karena aku tahu bahwa hamba-hambamu pandai menebang pohon-pohon di Lebanon. Dan lihatlah, hamba-hambaku akan bersama hamba-hambamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sipres”, “juniper”, atau “cemara”; jenis pohon yang dimaksud oleh kata Ibrani beroshim tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: “Algum” juga dapat ditulis “almug”. Sebagian orang mengidentifikasikannya sebagai kayu cendana, tetapi jenisnya tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: Kirimkanlah kepadaku
  rationale: Bentuk imperatif diterjemahkan secara langsung dan wajar. Konjungsi prefiks tidak harus dinyatakan dengan “dan” pada awal kalimat karena dalam bahasa Indonesia hubungan wacananya sudah jelas dari konteks.
- source_word: עֲצֵי אֲרָזִים
  choice: kayu aras
  rationale: Frasa konstruksi ini menunjuk pada kayu dari pohon aras sebagai bahan bangunan; “kayu aras” merupakan ungkapan Indonesia yang jelas dan lazim.
- source_word: בְּרוֹשִׁים
  choice: kayu sanobar
  rationale: “Sanobar” merupakan padanan tradisional yang dapat dipahami dalam konteks kayu berharga dari Lebanon, tetapi identifikasi spesies Ibraninya tidak pasti; ketidakpastian itu dipertahankan dalam catatan kaki.
- source_word: אַלְגּוּמִּים
  choice: kayu algum
  rationale: Karena spesiesnya tidak dapat dipastikan, bentuk nama Ibrani dialihaksarakan alih-alih dipaksakan menjadi nama botani tertentu.
- source_word: מֵהַלְּבָנוֹן
  choice: dari Lebanon
  rationale: Nama geografis diberikan dalam bentuk Indonesia modern tanpa menerjemahkan artikel Ibrani secara kaku.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: karena aku tahu
  rationale: Bentuk perfektif menyatakan pengetahuan yang berlaku saat berbicara, sehingga bentuk kini “aku tahu” paling alami.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: bahwa hamba-hambamu pandai menebang
  rationale: Ungkapan “tahu untuk menebang” menyatakan kecakapan. “Pandai menebang” menyampaikan makna itu secara alami tanpa menaikkannya menjadi gelar keahlian khusus.
- source_word: עֲצֵי לְבָנוֹן
  choice: pohon-pohon di Lebanon
  rationale: Dalam konteks verba “menebang”, rujukannya paling alami dipahami sebagai pohon-pohon yang berdiri di wilayah Lebanon, bukan kayu yang sudah dipotong.
- source_word: וְהִנֵּה
  choice: Dan lihatlah
  rationale: Partikel ini menarik perhatian kepada pengaturan yang dinyatakan berikutnya. “Lihatlah” mempertahankan fungsi deiktiknya tanpa mengubahnya menjadi penegasan seperti “sesungguhnya”.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: hamba-hambaku akan bersama hamba-hambamu
  rationale: Klausa Ibrani tidak memiliki verba tersurat. Bahasa Indonesia memerlukan predikat yang jelas; “akan bersama” sesuai dengan konteks rencana kerja yang sedang diajukan, sambil tidak menambahkan bentuk kerja sama yang lebih khusus daripada sumber.
