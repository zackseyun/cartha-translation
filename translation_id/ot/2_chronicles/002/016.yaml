source:
  edition: WLC
  text: וַ/יִּסְפֹּ֣ר שְׁלֹמֹ֗ה כָּל הָ/אֲנָשִׁ֤ים הַ/גֵּירִים֙ אֲשֶׁר֙ בְּ/אֶ֣רֶץ יִשְׂרָאֵ֔ל אַחֲרֵ֣י הַ/סְּפָ֔ר אֲשֶׁ֥ר סְפָרָ֖/ם דָּוִ֣יד אָבִ֑י/ו וַ/יִּמָּצְא֗וּ מֵאָ֤ה וַ/חֲמִשִּׁים֙ אֶ֔לֶף וּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: id
  text: Kemudian Salomo menghitung semua orang asing yang menetap di tanah Israel[a], sesudah pendataan yang telah dilakukan oleh Daud, ayahnya, terhadap mereka. Jumlah mereka didapati seratus lima puluh tiga ribu enam ratus orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendatang” atau “penduduk asing.” Istilah Ibrani ini menunjuk kepada orang bukan Israel yang tinggal di wilayah Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: menghitung
  rationale: Kata kerja ספר dalam konteks ini berarti menghitung atau mendata orang. “Menghitung” alami dalam bahasa Indonesia dan tidak terlalu memperinci makna.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: semua pendatang yang tinggal
  rationale: גֵּרִים menunjuk kepada orang bukan pribumi yang menetap di tengah Israel, bukan sekadar pelancong. Frasa ini menyampaikan status kependudukan mereka dengan bahasa Indonesia yang mudah dipahami.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: di tanah Israel
  rationale: Terjemahan ini mempertahankan nuansa kewilayahan dari אֶרֶץ dan mengikuti bentuk Ibrani secara dekat.
- source_word: אַחֲרֵי הַסְּפָר
  choice: berdasarkan pendataan
  rationale: Frasa ini dapat berarti sesudah atau menurut penghitungan terdahulu. Dalam konteks penghitungan ulang berdasarkan catatan Daud, “berdasarkan pendataan” alami sekaligus mempertahankan kemungkinan keterkaitan dengan daftar sebelumnya.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: yang telah dilakukan oleh Daud, ayahnya, terhadap mereka
  rationale: Ungkapan ini menyatakan bahwa Daud sebelumnya telah mendata kelompok yang sama. Bentuk pasif menghasilkan kalimat Indonesia yang lancar dan jelas.
- source_word: וַיִּמָּצְאוּ
  choice: Jumlah mereka didapati
  rationale: Bentuk Nifal מצא menyampaikan hasil yang diperoleh dari penghitungan. “Didapati” mempertahankan nuansa pasif-resultatifnya.
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: seratus lima puluh tiga ribu enam ratus orang
  rationale: Angka lengkap dipertahankan secara tepat dan ditulis dengan kata-kata agar sesuai dengan teks naratif; “orang” memperjelas satuan yang dihitung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pendatang yang tinggal” dipilih agar kategori sosial גֵּר mudah dipahami tanpa memakai istilah birokratis atau arkais. Penanda catatan kaki [a] dicantumkan langsung setelah frasa terkait.
