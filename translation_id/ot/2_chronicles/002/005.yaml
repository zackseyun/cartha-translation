reference: 2 Chronicles 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: id
  text: Namun, siapakah yang sanggup membangun rumah bagi-Nya? Sebab langit, bahkan langit yang paling tinggi,[a] tidak dapat menampung-Nya. Siapakah aku ini sehingga aku dapat membangun rumah bagi-Nya, selain untuk membakar dupa di hadapan-Nya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “langit dan langit-langit,” suatu ungkapan yang berarti langit yang paling tinggi.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “membakar dupa” juga dapat berarti membuat persembahan naik sebagai asap di hadapan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: sanggup
  rationale: Ungkapan ini menyatakan kemampuan atau kekuatan yang memadai. “Sanggup” alami dalam bahasa Indonesia dan mempertahankan daya retoris pertanyaannya.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: membangun rumah bagi-Nya
  rationale: בַיִת secara harfiah berarti “rumah”. Konteksnya memang Bait Allah, tetapi “rumah” mempertahankan ungkapan Ibrani dan kontras dengan ketidakmungkinan menampung Allah.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: langit, bahkan langit yang tertinggi
  rationale: Ungkapan bertingkat Ibrani “langit dan langitnya langit” berfungsi sebagai penegasan superlatif. Terjemahan ini alami sekaligus mempertahankan susunan dua bagiannya.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: tidak dapat menampung-Nya
  rationale: Dalam konteks pembangunan rumah bagi Allah, kata kerja ini menyatakan ketidakmampuan langit sekalipun untuk memuat atau membatasi-Nya.
- source_word: וּמִי אֲנִי
  choice: Siapakah aku ini
  rationale: Ungkapan ini menyatakan kerendahan diri Salomo di hadapan kebesaran Allah.
- source_word: אֲשֶׁר אֶבְנֶה לוֹ בַיִת
  choice: sehingga aku membangun rumah bagi-Nya
  rationale: Dalam bahasa Indonesia, “sehingga” menghubungkan pertanyaan tentang kelayakan diri dengan tindakan membangun tanpa mengubahnya menjadi pernyataan futuritas sederhana.
- source_word: כִּי אִם
  choice: selain untuk
  rationale: 'Ungkapan ini membatasi tujuan rumah itu: bukan untuk menampung Allah, melainkan untuk pelaksanaan ibadah di hadapan-Nya.'
- source_word: לְהַקְטִיר לְפָנָיו
  choice: membakar dupa di hadapan-Nya
  rationale: הקטיר berarti membuat sesuatu naik sebagai asap dan dalam konteks ibadah dapat merujuk pada pembakaran dupa. “Di hadapan-Nya” mempertahankan makna relasional dan spasial לְפָנָיו.
theological_decisions:
- issue: Transendensi Allah dan keterkaitan-Nya dengan rumah ibadah
  choice: Rumah itu tidak digambarkan sebagai tempat yang dapat menampung Allah, tetapi sebagai tempat mempersembahkan ibadah di hadapan-Nya.
  alternative: Membaca rumah itu sebagai kediaman yang menampung atau membatasi kehadiran Allah.
  rationale: 'Pernyataan bahwa langit tertinggi pun tidak dapat menampung Allah mengendalikan arti bahasa tentang rumah tersebut. Klausa terakhir mempertahankan ketegangan teks: ibadah dilakukan di rumah itu di hadapan Allah, tetapi Allah tidak dibatasi olehnya.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Struktur pertanyaan retoris dan pembatasan tujuan rumah dipertahankan.
