revisions:
- from: anak seorang perempuan dari antara keturunan Dan,[a] sedangkan ayahnya orang Tirus. Ia terampil mengerjakan emas, perak, perunggu, besi, batu, kayu, kain ungu, kain biru, lenan halus, dan kain merah tua.[b] Ia juga pandai membuat segala macam ukiran dan merancang segala macam karya yang dipercayakan kepadanya, bersama para ahli yang ada padamu dan para ahli dari tuanku Daud, ayahmu.
  to: anak seorang perempuan dari keturunan Dan,[a] sedangkan ayahnya orang Tirus. Ia terampil mengerjakan emas, perak, perunggu, besi, batu, kayu, kain ungu, kain biru, lenan halus, dan kain merah tua.[b] Ia juga pandai membuat segala macam ukiran dan merancang segala macam karya yang dipercayakan kepadanya, bersama para ahlimu dan para ahli tuanku, Daud, ayahmu.
  rationale: Revisi hanya memperbaiki kejelasan hubungan maternal pada frasa tentang Dan dan, terutama, relasi posesif "para ahli tuanku, Daud, ayahmu." Daftar bahan, istilah kerajinan, sapaan hormat manusiawi kepada Daud, ambiguitas genealogis, serta kedua jangkar catatan kaki dipertahankan.
