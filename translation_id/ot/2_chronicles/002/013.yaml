id: 2CH.2.13
reference: 2 Chronicles 2:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: id
  text: anak seorang perempuan dari keturunan Dan,[a] sedangkan ayahnya orang Tirus. Ia terampil mengerjakan emas, perak, perunggu, besi, batu, kayu, kain ungu, kain biru, lenan halus, dan kain merah tua.[b] Ia juga pandai membuat segala macam ukiran dan merancang segala macam karya yang dipercayakan kepadanya, bersama para ahlimu dan para ahli tuanku, Daud, ayahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari antara anak-anak perempuan Dan.” Ungkapan ini kemungkinan menunjukkan bahwa ibunya berasal dari suku Dan.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “kain kirmizi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: anak seorang perempuan dari antara keturunan Dan
  rationale: Ungkapan ini mempertahankan keterangan tentang garis keturunan melalui ibu. Secara harfiah בְּנוֹת דָּן berarti 'anak-anak perempuan Dan', tetapi dalam konteks silsilah ungkapan itu menunjuk kepada kaum atau keturunan Dan; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: sedangkan ayahnya orang Tirus
  rationale: צֹרִי menunjukkan orang yang berasal dari Tirus. Bentuk 'orang Tirus' alami dan ringkas dalam bahasa Indonesia.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: terampil mengerjakan
  rationale: Konstruksi ini menyatakan kecakapan praktis seorang perajin, bukan sekadar pengetahuan.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: emas, perak, perunggu, besi, batu, kayu
  rationale: Daftar tersebut menyebut bahan-bahan yang mampu dikerjakannya; bentuk nomina bahan tanpa pengulangan preposisi paling alami dalam bahasa Indonesia.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: kain ungu, kain biru, lenan halus, dan kain merah tua
  rationale: Istilah-istilah ini menunjuk pada bahan tekstil berwarna dan lenan berkualitas. Penambahan 'kain' memperjelas bahwa warna-warna itu adalah bahan kerajinan; כַּרְמִיל dapat menunjuk pada warna merah tua atau kirmizi.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: membuat segala macam ukiran
  rationale: Pasangan verba dan nomina serumpun menekankan pekerjaan mengukir. Ungkapan Indonesia ini mempertahankan cakupan luasnya tanpa pengulangan yang kaku.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: merancang segala macam karya
  rationale: Dalam konteks keahlian seni, חשׁב merujuk pada merancang atau mereka karya, bukan sekadar berpikir secara abstrak.
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: yang dipercayakan kepadanya
  rationale: Bentuk pasif Ibrani berarti sesuatu yang diberikan atau ditugaskan kepadanya. 'Dipercayakan' menyampaikan penugasan tersebut secara alami.
- source_word: עִם חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  choice: bersama para ahli yang ada padamu dan para ahli dari tuanku Daud, ayahmu
  rationale: חֲכָמִים dalam konteks ini adalah orang-orang yang ahli atau terampil. אֲדֹנִי merupakan sapaan hormat manusiawi, sehingga diterjemahkan 'tuanku', bukan gelar ilahi.
theological_decisions:
- issue: Identitas suku melalui garis ibu
  choice: dari antara keturunan Dan
  alternative: dari antara anak-anak perempuan Dan
  rationale: Terjemahan utama menyampaikan fungsi genealogis ungkapan itu, sementara catatan kaki mempertahankan bentuk harfiah dan tidak menentukan lebih jauh bagaimana status kesukuannya harus dipahami.
- issue: Sapaan hormat אֲדֹנִי kepada Daud
  choice: tuanku Daud
  alternative: junjunganku Daud
  rationale: Istilah ini merupakan penghormatan kepada raja manusia, bukan sebutan ilahi. 'Tuanku' sesuai dengan suasana korespondensi kerajaan dan tetap mudah dipahami.
- issue: Bentuk maskulin jamak חֲכָמֶיךָ / חַכְמֵי
  choice: para ahli
  alternative: para pekerja ahli laki-laki
  rationale: Bahasa Indonesia tidak menandai gender gramatikal pada 'para ahli'. Menambahkan 'laki-laki' akan membuat jenis kelamin lebih eksplisit daripada yang diperlukan oleh konteks dan terdengar tidak alami.
translation_notes:
  register: Bahasa yang digunakan modern, wajar, dan bermartabat. Ayat ini diawali dengan huruf kecil karena secara sintaksis melanjutkan pengenalan tokoh pada ayat sebelumnya. Istilah kerajinan dibuat konkret dan mudah dipahami tanpa menghilangkan daftar bahan atau keluasan keahliannya.
