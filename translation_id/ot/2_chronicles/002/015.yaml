  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: id
  text: Kami akan menebang kayu dari Lebanon sebanyak yang kauperlukan, lalu membawanya kepadamu lewat laut sebagai rakit-rakit sampai ke Yafo.[a] Engkau akan membawanya naik ke Yerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yafo adalah kota pelabuhan yang kemudian dikenal sebagai Yafa.
    reason: cultural_note
  - marker: b
    text: Kata “naik” mencerminkan letak Yerusalem yang lebih tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת עֵצִים
  choice: menebang kayu
  rationale: Dalam konteks penyediaan bahan bangunan, כרת berarti menebang, sedangkan עֵצִים menunjuk pada kayu yang akan digunakan. Ungkapan ini alami dalam bahasa Indonesia tanpa membatasi maknanya menjadi jenis potongan tertentu.
- source_word: מִן הַלְּבָנוֹן
  choice: dari Lebanon
  rationale: Nama tempat ini mengikuti bentuk baku bahasa Indonesia; artikelnya dalam bahasa Ibrani tidak perlu dinyatakan secara terpisah.
- source_word: כְּכָל צָרְכֶּךָ
  choice: sebanyak yang kauperlukan
  rationale: Frasa ini menyatakan jumlah yang disesuaikan dengan seluruh kebutuhan penerima. Bentuk ini alami dan mempertahankan gagasan ukurannya.
- source_word: וּנְבִיאֵם לְךָ
  choice: lalu membawanya kepadamu
  rationale: Akhiran Ibrani berbentuk jamak dan merujuk pada potongan-potongan kayu. Dalam bahasa Indonesia, 'kayu' dapat diperlakukan sebagai nomina kolektif sehingga '-nya' terdengar alami.
- source_word: רַפְסֹדוֹת
  choice: sebagai rakit-rakit
  rationale: Kata ini menunjuk pada kayu-kayu yang disatukan agar mengapung untuk diangkut. 'Sebagai rakit-rakit' mempertahankan bahwa kayu itu sendiri dibentuk menjadi rakit, bukan sekadar dimuat di atas rakit.
- source_word: עַל יָם יָפוֹ
  choice: lewat laut ... sampai ke Yafo
  rationale: Ungkapan ini menggambarkan pengangkutan melalui laut dengan Yafo sebagai tujuan. Susunan Indonesia dibuat alami tanpa menghilangkan tujuan perjalanannya.
- source_word: יָפוֹ
  choice: Yafo
  rationale: Bentuk 'Yafo' mendekati nama Ibrani dan lazim digunakan dalam Alkitab bahasa Indonesia.
- source_word: תַּעֲלֶה אֹתָם
  choice: Engkau akan membawanya naik
  rationale: Kata עלה mempertahankan unsur gerak naik menuju Yerusalem. 'Membawanya naik' juga sesuai dengan kayu sebagai nomina kolektif.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Ini adalah bentuk baku nama kota tersebut dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'kau-' dan 'engkau' mempertahankan sapaan orang kedua tunggal. 'Kayu' dipakai secara kolektif, sedangkan bentuk jamak 'rakit-rakit' mencerminkan bentuk jamak dalam teks Ibrani.
