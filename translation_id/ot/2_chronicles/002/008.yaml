  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: id
  text: dan untuk menyiapkan bagiku kayu bangunan dalam jumlah besar, sebab rumah[a] yang sedang kubangun akan besar dan menakjubkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “bait”; Ibrani secara harfiah: “rumah”.'
    reason: lexical_alternative
  - marker: b
    text: Atau “besar dan luar biasa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: dan untuk menyiapkan
  rationale: Infinitif konstruk dengan waw dan le- melanjutkan permintaan dari ayat sebelumnya serta menyatakan tujuan; bentuk ini mempertahankan hubungan sintaksis tersebut.
- source_word: לִי
  choice: bagiku
  rationale: Preposisi dengan sufiks orang pertama tunggal menyatakan penerima manfaat; 'bagiku' ringkas dan wajar dalam register bermartabat.
- source_word: עֵצִים
  choice: kayu bangunan
  rationale: Dalam konteks pembangunan, kata ini menunjuk kayu sebagai bahan konstruksi; 'kayu bangunan' lebih tepat daripada sekadar 'kayu' atau arti harfiah 'pohon-pohon'.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Ungkapan ini menyatakan kuantitas yang banyak; pilihan ini alami dan tidak mengacaukannya dengan sifat rumah pada klausa berikut.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi permintaan sebelumnya.
- source_word: הַבַּיִת
  choice: rumah
  rationale: Terjemahan ini mempertahankan arti harfiah dan idiom Ibrani, sementara catatan kaki menjelaskan bahwa yang dimaksud adalah bait.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: yang sedang kubangun
  rationale: Partisip menunjukkan tindakan pembangunan yang sedang berlangsung atau dipandang sebagai pekerjaan kini; 'sedang kubangun' mempertahankan nuansa aspek tersebut.
- source_word: גָּדוֹל
  choice: besar
  rationale: Kata ini dapat menunjuk ukuran sekaligus keagungan; 'besar' mempertahankan keluasan maknanya.
- source_word: וְהַפְלֵא
  choice: dan menakjubkan
  rationale: Bentuk dari akar פלא menyatakan sesuatu yang luar biasa atau mengagumkan; 'menakjubkan' alami dalam bahasa Indonesia dan mempertahankan penekanan sumber.
theological_decisions:
- issue: Identitas הַבַּיִת sebagai bangunan ibadah
  choice: rumah dalam teks utama, dengan penjelasan 'bait' dalam catatan kaki
  alternative: bait dalam teks utama
  rationale: Sumber secara harfiah memakai 'rumah', tetapi konteks menunjuk bait Allah. Mempertahankan 'rumah' menghindari penggantian leksikal diam-diam, sedangkan catatan membantu pembaca memahami rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan klausa serta hubungan alasan dipertahankan. Enklitik pada 'kubangun' membuat kalimat lebih alami tanpa mengubah persona. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
