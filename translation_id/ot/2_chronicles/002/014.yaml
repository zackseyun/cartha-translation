base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: id
  text: Sekarang, hendaklah tuanku mengirim kepada hamba-hamba tuanku gandum dan jelai, minyak[a] dan anggur, sesuai dengan yang telah tuanku sebutkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks perbekalan ini, “minyak” mungkin secara khusus berarti “minyak zaitun.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang telah tuanku katakan”; bahasa Ibrani tidak mengharuskan arti yang lebih kuat, yaitu “yang telah tuanku janjikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengantar permintaan praktis. Dalam bahasa Indonesia, “Sekarang” secara alami menyampaikan fungsi itu; daya penghubung waw dapat tersirat dari konteks.
- source_word: הַחִטִּים
  choice: gandum
  rationale: Nama komoditas yang tertentu dalam konteks; bahasa Indonesia tidak memakai artikel definit sehingga cukup diterjemahkan “gandum”.
- source_word: וְהַשְּׂעֹרִים
  choice: dan jelai
  rationale: Terjemahan langsung nama komoditas yang sejajar dengan gandum.
- source_word: הַשֶּׁמֶן
  choice: minyak
  rationale: Mempertahankan cakupan umum kata Ibrani tanpa mempersempitnya menjadi minyak zaitun, meskipun konteks perbekalan memungkinkan pengertian tersebut.
- source_word: וְהַיַּיִן
  choice: dan anggur
  rationale: Dalam daftar bahan pangan, יין menunjuk pada minuman anggur; “anggur” merupakan padanan Alkitabiah Indonesia yang wajar dalam konteks ini.
- source_word: אֲשֶׁר אָמַר
  choice: yang telah ia sebutkan
  rationale: Menyatakan bahwa barang-barang itu sudah dibicarakan sebelumnya, tanpa menambahkan makna lebih kuat seperti “dijanjikan” yang tidak dituntut oleh אמר.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat dari Huram kepada Salomo; “tuanku” menyampaikan kesantunan istana dan tidak membingungkannya dengan gelar ilahi.
- source_word: יִשְׁלַח
  choice: hendaklah ... mengirim
  rationale: Bentuk yiqtol berfungsi secara jusif sebagai permintaan, bukan sekadar pernyataan masa depan.
- source_word: לַעֲבָדָיו
  choice: kepada hamba-hambanya
  rationale: Mengikuti pronomina orang ketiga dalam teks Ibrani dan mempertahankan istilah עבד; dalam konteks, mereka adalah para pekerja Huram.
