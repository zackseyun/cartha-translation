  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: id
  text: Dari antara mereka, ia mengangkat tujuh puluh ribu orang sebagai pengangkut beban, delapan puluh ribu orang sebagai pemahat batu di pegunungan[a], dan tiga ribu enam ratus orang sebagai pengawas untuk mengerahkan orang-orang itu bekerja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang yang memahat di gunung.” Objek yang dipahat tidak disebutkan dalam bahasa Ibrani, tetapi konteks pembangunan menunjukkan bahwa yang dimaksud adalah batu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: Dari antara mereka, ia mengangkat
  rationale: Ungkapan ini menyatakan bahwa Salomo memilih dan menetapkan orang-orang dari kelompok yang disebut sebelumnya. ‘Mengangkat’ menyampaikan fungsi penetapan dengan alami dalam bahasa Indonesia.
- source_word: סַבָּל
  choice: pengangkut beban
  rationale: Nomina ini menunjuk kepada orang yang membawa muatan; pilihan ini lebih tepat daripada istilah umum ‘pekerja’.
- source_word: חֹצֵב בָּהָר
  choice: pemahat batu di pegunungan
  rationale: חצב berarti memotong atau memahat, dan dalam konteks pembangunan objek yang tersirat adalah batu. בָּהָר menunjukkan daerah gunung atau pegunungan.
- source_word: מְנַצְּחִים
  choice: pengawas
  rationale: Dalam konteks pengelolaan tenaga kerja, bentuk partisip ini menunjuk kepada orang-orang yang memimpin atau mengawasi pekerjaan.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: untuk mengerahkan orang-orang itu bekerja
  rationale: Bentuk kausatif dari עבד berarti membuat atau mengerahkan orang untuk bekerja. Ungkapan Indonesia ini mempertahankan daya kausatifnya tanpa terdengar kaku.
- source_word: הָעָם
  choice: orang-orang itu
  rationale: Secara harfiah berarti ‘rakyat/orang-orang’. Dalam konteks ini, ‘orang-orang itu’ secara alami merujuk kembali kepada kelompok pekerja yang baru disebut dan tidak menyiratkan status kewargaan tertentu.
