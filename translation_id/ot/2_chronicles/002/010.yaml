id: 2CH.2.10
reference: 2 Chronicles 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: id
  text: Lalu Huram, raja Tirus, menjawab melalui surat yang dikirimnya kepada Salomo, “Karena Yahweh mengasihi umat-Nya, Ia telah mengangkat engkau menjadi raja atas mereka.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Huram; secara tradisional: Hiram.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: menjawab
  rationale: Dalam konteks tanggapan Huram terhadap permintaan Salomo, verba 'berkata' secara wajar diterjemahkan 'menjawab'; waw konsekutif diteruskan dengan 'Lalu' untuk memajukan alur.
- source_word: חוּרָם
  choice: Huram
  rationale: Mengikuti bentuk nama Ibrani חוּרָם dalam ayat ini, bukan bentuk tradisional 'Hiram'.
- source_word: מֶלֶךְ צֹר
  choice: raja Tirus
  rationale: Rangkaian konstruksi ini menyatakan jabatan Huram dan wilayah pemerintahannya.
- source_word: בִּכְתָב וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: melalui surat yang dikirimnya kepada Salomo
  rationale: Menyampaikan kedua unsur, yakni jawaban tertulis dan pengirimannya kepada Salomo, dalam susunan Indonesia yang alami tanpa menghilangkan tindakan mengirim.
- source_word: בְּאַהֲבַת יְהוָה אֶת עַמּוֹ
  choice: Karena Yahweh mengasihi umat-Nya
  rationale: Prefiks ב pada nomina abstrak dapat menyatakan sebab; bentuk verbal menghasilkan bahasa Indonesia yang alami sambil mempertahankan kasih Yahweh sebagai alasan pengangkatan Salomo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Sufiks persona mengacu kepada Yahweh; 'umat' merupakan ungkapan Indonesia yang alami bagi relasi kolektif ini.
- source_word: נְתָנְךָ
  choice: Ia telah mengangkat engkau
  rationale: נתן secara harfiah berarti 'memberikan', tetapi dalam konstruksi dengan jabatan raja menyatakan penetapan atau pengangkatan seseorang.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: menjadi raja atas mereka
  rationale: על menunjukkan pemerintahan atas umat; 'menjadi raja atas mereka' mempertahankan relasi tersebut secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan kasih Yahweh dengan pengangkatan Salomo
  choice: Karena Yahweh mengasihi umat-Nya
  alternative: Oleh kasih Yahweh kepada umat-Nya
  rationale: Konstruksi בְּאַהֲבַת mendukung hubungan kausal, tetapi dapat diungkapkan secara nominal. Terjemahan utama memakai klausa verbal yang alami tanpa menentukan lebih jauh sifat teologis kasih atau pengangkatan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai dalam kutipan langsung kepada raja untuk mempertahankan nuansa tunggal dan formal. Struktur surat dibuat alami, sedangkan nama ilahi dan bentuk nama Huram mengikuti teks Ibrani.
