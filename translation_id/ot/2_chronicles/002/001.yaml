translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan paralel ketiga kelompok tenaga kerja dipertahankan, sementara pengulangan “orang sebagai” digunakan untuk memperjelas fungsi masing-masing kelompok.
