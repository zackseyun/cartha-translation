base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: id
  text: Salomo menghitung tujuh puluh ribu orang sebagai pengangkut beban, delapan puluh ribu orang sebagai pemotong batu di pegunungan[a], dan tiga ribu enam ratus orang sebagai pengawas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang memotong di gunung.” Dapat juga diterjemahkan “penggali batu di pegunungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: menghitung
  rationale: Kata kerja ספר dalam bentuk naratif ini berarti menghitung atau mendata. “Menghitung” mempertahankan arti dasarnya dan sesuai dengan pencatatan tenaga kerja kerajaan.
- source_word: אִישׁ ... סַבָּל
  choice: orang sebagai pengangkut beban
  rationale: סַבָּל menunjuk kepada orang yang membawa beban. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kategori pekerjaan yang disebutkan.
- source_word: חֹצֵב בָּהָר
  choice: pemahat batu di pegunungan
  rationale: חצב berarti memahat atau menebang; dalam konteks tenaga kerja pembangunan, objek yang tersirat adalah batu. בָּהָר menunjukkan lokasi di gunung atau daerah pegunungan. Karena objek tidak dinyatakan secara eksplisit dalam bahasa Ibrani, arti harfiahnya dicatat dalam catatan kaki.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: sebagai pengawas mereka
  rationale: Dalam konteks administrasi tenaga kerja, bentuk partisip dari נצח menunjuk kepada orang-orang yang memimpin atau mengawasi pekerjaan. “Pengawas mereka” menyampaikan fungsi dan hubungan עֲלֵיהֶם secara wajar.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: tiga ribu enam ratus
  rationale: Ini merupakan padanan langsung dan idiomatis bagi bilangan Ibrani tersebut.
- source_word: אִישׁ
  choice: orang
  rationale: Dalam bahasa Indonesia, “orang” merupakan penghitung alami setelah angka dan tidak menghapus fakta kontekstual bahwa yang dimaksud ialah para pekerja laki-laki.
