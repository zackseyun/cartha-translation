  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: id
  text: 'Lalu Salomo mengirim pesan kepada Huram, raja Tirus[a], demikian: “Sebagaimana engkau telah memperlakukan Daud, ayahku, dan mengirimkan kayu aras kepadanya untuk membangun rumah yang akan didiaminya—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini teks Ibrani memakai bentuk nama Huram; bagian sejajar dalam kitab Raja-Raja biasanya memakai nama Hiram.
    reason: Menjelaskan perbedaan bentuk nama dalam tradisi teks sejajar tanpa mengganti bentuk yang terdapat dalam sumber ayat ini.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengirim pesan
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. Karena penerimanya seorang raja dan לֵאמֹר memperkenalkan isi perkataan, ‘mengirim pesan’ lebih alami dalam bahasa Indonesia daripada ‘mengutus kepada’.
- source_word: חוּרָם
  choice: Huram
  rationale: Mengikuti bentuk nama חוּרָם yang dipakai dalam teks Ibrani Tawarikh; bentuk ‘Hiram’ yang lebih dikenal dari kitab Raja-Raja dicatat dalam catatan kaki.
- source_word: מֶלֶךְ צֹר
  choice: raja Tirus
  rationale: Menerjemahkan rangkaian konstruksi sebagai gelar yang diikuti nama tempat dalam bentuk Indonesia yang lazim.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Secara alami memperkenalkan pesan langsung dalam bahasa Indonesia modern tanpa mempertahankan ungkapan kaku ‘dengan berkata’.
- source_word: כַּאֲשֶׁר
  choice: Sebagaimana
  rationale: Mempertahankan hubungan perbandingan yang membuka permintaan Salomo dan berlanjut ke ayat berikutnya.
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: engkau telah memperlakukan Daud, ayahku
  rationale: Ungkapan עשה עם berarti bertindak atau berbuat terhadap seseorang; ‘memperlakukan’ mempertahankan cakupan maknanya tanpa menambahkan jenis tindakan yang tidak dinyatakan.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: dan mengirimkan kayu aras kepadanya
  rationale: Dalam konteks pembangunan, bentuk jamak ‘pohon aras’ menunjuk pada bahan kayu; ‘kayu aras’ merupakan padanan Indonesia yang alami dan tidak terlalu menentukan bentuknya sebagai balok atau gelondongan.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: untuk membangun rumah
  rationale: ‘Rumah’ mempertahankan arti dasar בַיִת dan tidak mempersempitnya menjadi ‘istana’. Kepentingan penerima manfaat tersirat secara alami oleh konteks dan klausa berikutnya.
- source_word: לָשֶׁבֶת בּוֹ
  choice: yang akan didiaminya
  rationale: ישב dalam konteks ini berarti tinggal atau berdiam. Bentuk ini menyatakan bahwa rumah tersebut dibangun untuk menjadi tempat tinggal Daud.
- source_word: akhir ayat yang eliptis
  choice: tanda pisah panjang (—)
  rationale: Teks Ibrani ayat ini berhenti di tengah konstruksi perbandingan yang dilanjutkan dalam ayat berikutnya. Tanda pisah mempertahankan kesinambungan dan ketegangan sintaksis itu tanpa menambahkan anak kalimat ‘lakukanlah demikian kepadaku’ yang tidak terdapat dalam ayat ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘engkau’ dipakai dalam sapaan antarraja agar tetap jelas dan bernuansa resmi. Ayat sengaja diakhiri dengan tanda pisah karena kalimat Ibraninya berlanjut ke ayat berikutnya.
