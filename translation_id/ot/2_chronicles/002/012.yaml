id: 2CH.2.12
reference: 2 Chronicles 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: id
  text: Dan sekarang aku telah mengutus seorang yang bijaksana dan berpengertian, yaitu Huram-Abi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, Huram-Abi. Unsur terakhir secara harfiah berarti “ayahku”, tetapi di sini mungkin merupakan gelar kehormatan atau bagian dari sebutan perajin itu; bandingkan juga “Huram, ayahnya” dalam 2 Tawarikh 4:16.
    reason: Menjelaskan bentuk Ibrani yang ambigu dan kemungkinan fungsi אָבִי sebagai gelar atau bagian dari sebutan, bukan penanda hubungan biologis.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Gabungan kata penghubung dan keterangan waktu ini melanjutkan alur jawaban raja serta memperkenalkan tindakan berikutnya.
- source_word: שָׁלַחְתִּי
  choice: aku telah mengutus
  rationale: Bentuk perfektif Ibrani menyatakan tindakan pengutusan yang telah dilakukan dan masih relevan bagi keadaan saat ini.
- source_word: אִישׁ חָכָם
  choice: seorang yang bijaksana
  rationale: Terjemahan ini mempertahankan arti dasar חָכָם, sementara konteks pekerjaan tangan memberi nuansa kecakapan praktis.
- source_word: יוֹדֵעַ בִּינָה
  choice: berpengertian
  rationale: Ungkapan harfiahnya, 'mengetahui pengertian', menunjuk pada orang yang memiliki wawasan dan kecakapan; 'berpengertian' menyampaikannya secara alami tanpa membatasi makna pada keterampilan teknis semata.
- source_word: לְחוּרָם אָבִי
  choice: yaitu Huram-Abi
  rationale: Dalam konteks ini, frasa tersebut berfungsi sebagai sebutan bagi perajin yang diutus. Transliterasi mempertahankan ketidakpastian apakah אָבִי merupakan gelar kehormatan atau bagian dari sebutannya, sedangkan 'yaitu' membuat fungsi identifikasinya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna אָבִי dalam sebutan לְחוּרָם אָבִי
  choice: 'Diperlakukan sebagai bagian dari nama atau sebutan perajin: ''Huram-Abi'''
  alternative: '''Huram, ayahku'' atau ''Huram, kepala perajinku'''
  rationale: Kata 'ayah' dapat dipakai sebagai gelar kehormatan bagi seorang ahli atau penasihat, bukan hanya untuk hubungan biologis. Transliterasi menghindari penetapan salah satu tafsiran secara tidak semestinya dan mempertahankan ambiguitas teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan istilah 'Huram-Abi' dipertahankan untuk menjaga ambiguitas sumber.
