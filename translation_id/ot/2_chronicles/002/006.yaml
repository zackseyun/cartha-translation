translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ayat dipecah menjadi dua kalimat agar daftar bahan dan rangkaian kualifikasi mudah dipahami. ‘Sekarang’ dipertahankan karena וְעַתָּה memang hadir dalam teks Ibrani. Istilah teknis dijelaskan secukupnya tanpa menetapkan apakah bahan berwarna itu berupa benang atau kain.
