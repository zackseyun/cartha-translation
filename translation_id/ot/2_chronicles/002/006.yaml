revisions:
- from: Sekarang, kirimlah kepadaku seorang ahli yang dapat mengerjakan emas, perak, perunggu, besi, serta bahan berwarna ungu, merah tua[a], dan biru. Ia juga harus tahu mengukir berbagai ukiran[b] dan bekerja bersama para ahli yang ada padaku di Yehuda dan Yerusalem, yang telah disiapkan oleh ayahku Daud.[c]
  to: Sekarang, kirimkanlah kepadaku seorang ahli untuk mengerjakan emas, perak, perunggu, besi, serta bahan ungu, merah tua[a], dan biru, yang tahu mengukir ukiran[b] dan bekerja bersama para ahli yang bersamaku di Yehuda dan Yerusalem, para ahli yang telah disiapkan oleh ayahku Daud.[c]
  rationale: Revisi memperbaiki kelaziman bahasa Indonesia dan menghapus tambahan makna tanpa mengubah isi ayat. “Sekarang” dipertahankan karena ada dalam teks Ibrani. “Yang bersamaku” menerjemahkan עִמִּי secara langsung dan alami. Aposisi “para ahli yang telah disiapkan ...” memperjelas bahwa klausa terakhir menerangkan para ahli, bukan Yehuda atau Yerusalem.
