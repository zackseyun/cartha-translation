  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: id
  text: Sekarang, kirimkanlah kepadaku seorang ahli untuk mengerjakan emas, perak, perunggu, besi, serta bahan ungu, merah tua[a], dan biru, yang tahu mengukir ukiran[b] dan bekerja bersama para ahli yang bersamaku di Yehuda dan Yerusalem, para ahli yang telah disiapkan oleh ayahku Daud.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merah kirmizi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi “mengukir ukiran-ukiran,” suatu ungkapan dengan kata-kata serumpun yang menekankan keahlian mengukir.
    reason: lexical_alternative
  - marker: c
    text: Atau “para ahli yang telah ditetapkan oleh ayahku Daud” atau “para ahli yang telah dibuat siap oleh ayahku Daud”; kata kerja Ibrani dapat mencakup gagasan penyiapan atau penetapan sesuai konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan Ibrani ini secara eksplisit berarti ‘dan sekarang’. Dalam bahasa Indonesia, ‘Sekarang’ secara alami menghubungkan permintaan ini dengan konteks sebelumnya tanpa memerlukan ‘dan’.
- source_word: אִישׁ חָכָם
  choice: seorang ahli
  rationale: Dalam konteks pekerjaan kerajinan, חָכָם menunjuk pada kecakapan teknis, bukan semata-mata kebijaksanaan. ‘Seorang ahli’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: yang dapat mengerjakan emas, perak, perunggu, besi
  rationale: Kata depan ב menandai bahan yang dikerjakan. ‘Mengerjakan’ sesuai dengan konteks keahlian perajin, dan נְחֹשֶׁת diterjemahkan ‘perunggu’ dalam konteks bahan logam kuno ini.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: bahan berwarna ungu, merah tua, dan biru
  rationale: Ketiga istilah ini menunjuk pada bahan atau hasil celupan berwarna yang digunakan dalam kerajinan tekstil. ‘Bahan berwarna’ membuat peralihan dari logam ke tekstil jelas tanpa mempersempitnya menjadi benang atau kain tertentu yang tidak disebutkan secara eksplisit.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: tahu mengukir berbagai ukiran
  rationale: Terjemahan ini mempertahankan hubungan serumpun antara verba dan nomina Ibrani, tetapi ‘berbagai’ membuat ungkapan tersebut lebih alami dalam bahasa Indonesia.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: bekerja bersama para ahli yang ada padaku
  rationale: Konteks menunjukkan kerja sama dalam pembangunan rumah ibadah. ‘Para ahli’ mempertahankan kaitan leksikal dengan sebutan ahli pada awal ayat, sedangkan ‘yang ada padaku’ tidak menambahkan gagasan hierarki yang tidak dinyatakan.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: yang telah disiapkan oleh ayahku Daud
  rationale: Bentuk הֵכִין memiliki arti dasar ‘menyiapkan’ atau ‘membuat siap’. Bentuk pasif Indonesia memperjelas bahwa Daud adalah pelakunya dan bahwa klausa ini menerangkan para ahli.
