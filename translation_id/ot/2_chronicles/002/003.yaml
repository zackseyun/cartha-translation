reference: 2 Chronicles 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: id
  text: Lihatlah, aku sedang membangun sebuah rumah bagi nama Yahweh, Allahku,[a] untuk menguduskannya bagi Dia, untuk membakar dupa harum di hadapan-Nya, untuk menata roti sajian secara tetap,[b] dan untuk mempersembahkan kurban bakaran setiap pagi dan petang, pada hari-hari Sabat, pada bulan baru, dan pada hari-hari raya yang ditetapkan Yahweh, Allah kita. Inilah kewajiban Israel untuk selama-lamanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah” di sini berarti bait; secara harfiah, teks Ibrani berbunyi “sebuah rumah bagi nama Yahweh.”
    reason: Menjelaskan referen sekaligus mempertahankan ungkapan sumber.
  - marker: b
    text: Secara harfiah, “susunan yang tetap.” Dalam konteks pelayanan bait, ini menunjuk kepada roti sajian yang ditata secara teratur di hadapan Yahweh.
    reason: Menandai bahwa kata “roti” tersirat dari konteks, bukan tertulis dalam frasa ini.
  - marker: c
    text: Ungkapan Ibrani ini menyatakan bahwa tata persembahan tersebut merupakan kewajiban yang terus berlaku atas Israel.
    reason: Menjelaskan idiom לְעוֹלָם זֹאת עַל יִשְׂרָאֵל tanpa menghapus nuansa kewajibannya.
lexical_decisions:
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Penanda wacana ini menarik perhatian kepada pernyataan raja. “Ketahuilah” terdengar wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: בּוֹנֶה
  choice: sedang membangun
  rationale: Partisip Ibrani menyatakan tindakan yang sedang berlangsung atau segera dilaksanakan; bentuk progresif dipertahankan tanpa mengubahnya menjadi sekadar niat.
- source_word: בַּיִת לְשֵׁם יְהוָה
  choice: sebuah rumah bagi nama Yahweh
  rationale: “Rumah” mempertahankan ungkapan Ibrani dan kaitan teologisnya dengan nama Yahweh, sementara catatan kaki menjelaskan bahwa yang dimaksud ialah bait.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: untuk menguduskannya bagi Dia
  rationale: Bentuk kausatif dari קדשׁ berarti mengkhususkan sebagai kudus; pronomina objek merujuk kepada rumah yang sedang dibangun.
- source_word: קְטֹרֶת סַמִּים
  choice: dupa harum
  rationale: Ungkapan ini menunjuk kepada dupa berempah yang beraroma; “dupa harum” ringkas, alami, dan sesuai dengan konteks ibadah.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: menata roti sajian secara tetap
  rationale: Secara harfiah ungkapan ini berbicara tentang susunan yang tetap; dalam konteks pelayanan bait, yang disusun adalah roti sajian. Kata “roti” dijelaskan sebagai pengungkapan referen kontekstual, bukan unsur eksplisit dalam frasa ini.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk persembahan yang seluruhnya dibakar di atas mezbah.
- source_word: לַבֹּקֶר וְלָעֶרֶב
  choice: setiap pagi dan petang
  rationale: Menunjukkan irama persembahan harian; “setiap” memperjelas keberulangannya secara alami.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וּלְמוֹעֲדֵי
  choice: pada hari-hari Sabat, bulan-bulan baru, dan hari-hari raya yang ditetapkan
  rationale: Mempertahankan tiga kategori waktu ibadah Israel serta arti מוֹעֵד sebagai waktu perayaan yang telah ditetapkan.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: Inilah kewajiban Israel untuk selama-lamanya
  rationale: Preposisi עַל menyatakan tanggungan atau kewajiban yang berlaku atas Israel; susunan Indonesia ini menyampaikan makna idiomatisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama perjanjian pribadi dalam teks sumber dan membedakannya dari gelar ilahi.
- issue: Makna בַּיִת dalam ungkapan “rumah bagi nama Yahweh”
  choice: rumah, dengan penjelasan bahwa yang dimaksud ialah bait
  alternative: bait
  rationale: Pilihan utama mempertahankan bentuk dan ungkapan teologis Ibrani tanpa membiarkan pembaca salah memahami referennya.
- issue: Seberapa eksplisit referen מַעֲרֶכֶת תָּמִיד
  choice: roti sajian secara tetap
  alternative: susunan yang tetap
  rationale: Teks tidak menyebut “roti” secara eksplisit, tetapi konteks pelayanan bait dan pemakaian istilah ini mendukung referen tersebut. Catatan kaki mempertahankan transparansi terhadap bentuk sumber.
- issue: Daya ikat לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: kewajiban Israel untuk selama-lamanya
  alternative: hal ini berlaku atas Israel untuk selama-lamanya
  rationale: “Kewajiban” mengungkapkan secara idiomatis bahwa tata ibadah itu dibebankan kepada Israel, tanpa menentukan perdebatan teologis mengenai penerapannya di luar cakrawala teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ibadah seperti “dupa,” “roti sajian,” dan “kurban bakaran” dipakai karena cukup dikenal, sedangkan ungkapan khas Ibrani “rumah bagi nama Yahweh” dipertahankan dan dijelaskan melalui catatan kaki.
