  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: id
  text: Namun, aku tidak memercayai perkataan mereka sampai aku datang dan melihatnya dengan mataku sendiri. Ternyata, belum sampai separuh dari kebesaran hikmatmu diceritakan kepadaku.[a] Engkau melampaui kabar yang kudengar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelimpahan hikmatmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau telah melebihi kabar yang kudengar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: aku tidak memercayai
  rationale: Bentuk Hifil dari אמן di sini berarti menganggap suatu kesaksian benar atau dapat dipercaya. “Memercayai” sesuai dengan tanggapan sang ratu terhadap laporan yang diterimanya.
- source_word: לְדִבְרֵיהֶם
  choice: perkataan mereka
  rationale: דבר berarti perkataan atau hal. “Perkataan mereka” dekat dengan bentuk Ibrani dan tetap alami dalam konteks laporan lisan.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: melihatnya dengan mataku sendiri
  rationale: Secara harfiah, “mataku melihat.” Susunan Indonesia ini mempertahankan penekanan pada pembuktian langsung dengan penglihatan sendiri.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: הִנֵּה mengarahkan perhatian kepada penemuan yang mengejutkan. “Ternyata” menyampaikan fungsi wacana tersebut secara alami dalam bahasa Indonesia modern.
- source_word: חֲצִי
  choice: separuh
  rationale: Padanan kuantitatif langsung yang alami dalam konstruksi “belum sampai separuh”.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: kebesaran hikmatmu
  rationale: מַרְבִּית dapat menyatakan kelimpahan atau kebesaran. Pilihan ini mempertahankan gagasan mengenai besarnya hikmat Salomo tanpa mempersempit maknanya hanya pada jumlah.
- source_word: הֻגַּד לִי
  choice: diceritakan kepadaku
  rationale: Bentuk Hofal dari נגד menyatakan bahwa sesuatu diberitahukan atau dilaporkan kepada sang ratu. “Diceritakan kepadaku” alami untuk laporan yang telah ia terima.
- source_word: יָסַפְתָּ עַל
  choice: Engkau jauh melampaui
  rationale: יסף dengan על dalam konteks perbandingan berarti melebihi atau melampaui. Kata “jauh” membantu mengungkapkan penekanan dari pernyataan sebelumnya bahwa separuh pun belum diberitakan.
- source_word: הַשְּׁמוּעָה
  choice: kabar
  rationale: שְׁמוּעָה berarti sesuatu yang didengar, yakni kabar atau laporan. “Kabar” netral dan tidak membawa kesan meragukan seperti “desas-desus”.
- source_word: אֲשֶׁר שָׁמָעְתִּי
  choice: yang kudengar
  rationale: Klausa relatif langsung yang mempertahankan kaitan bunyi dan makna antara “kabar” dan tindakan mendengar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina orang pertama tunggal “aku” sesuai dengan tuturan langsung seorang ratu kepada Salomo; akhiran “-mu” mempertahankan sapaan tunggal dalam teks Ibrani. “Ternyata” dipakai sebagai padanan alami bagi penanda perhatian וְהִנֵּה.
