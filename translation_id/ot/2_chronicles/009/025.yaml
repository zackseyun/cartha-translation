base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: id
  text: Salomo mempunyai empat ribu kandang untuk kuda dan kereta[a], serta dua belas ribu penunggang kuda[b]. Ia menempatkan mereka di kota-kota kereta perang dan bersama raja di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istal”; kata Ibrani אֻרְיוֹת menunjuk pada unit tempat kuda ditempatkan.
    reason: lexical_alternative
  - marker: b
    text: Ayat sejajar dalam 1 Raja-Raja 4:26 menyebut “empat puluh ribu kandang”, sedangkan Tawarikh di sini menyebut “empat ribu”.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomo mempunyai
  rationale: Ungkapan היה + ל menyatakan kepemilikan atau keberadaan; 'Salomo mempunyai' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: empat ribu
  rationale: Padanan langsung untuk bilangan Ibrani tersebut.
- source_word: אֻרְיוֹת
  choice: kandang
  rationale: Kata ini menunjuk pada petak atau unit tempat kuda ditempatkan. 'Kandang' jelas dan wajar dalam bahasa Indonesia, tanpa harus menyiratkan kompleks istal secara keseluruhan.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: untuk kuda dan kereta
  rationale: Frasa ini menerangkan peruntukan kandang. Terjemahan tersebut mempertahankan kedua nomina dalam teks Ibrani dan tidak mempersempitnya menjadi kuda kereta saja.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: serta dua belas ribu
  rationale: Padanan langsung bagi frasa bilangan, dengan 'serta' menghubungkannya secara alami dengan unsur sebelumnya.
- source_word: פָּרָשִׁים
  choice: penunggang kuda
  rationale: Istilah ini berarti orang-orang yang menunggang kuda. 'Penunggang kuda' lebih langsung dan tidak seanakronistis 'pasukan kavaleri'.
- source_word: וַיַּנִּיחֵם
  choice: Ia menempatkan mereka
  rationale: Dalam konteks pengaturan kekuatan kerajaan, verba ini berarti menaruh atau menempatkan. Pilihan ini juga tidak memaksakan apakah pronomina mencakup orang, hewan, atau seluruh unsur yang baru disebut.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: di kota-kota kereta
  rationale: Frasa konstruksi ini menunjuk pada kota-kota yang dikhususkan atau dikaitkan dengan kereta perang; bentuk ringkas ini mempertahankan hubungan tersebut.
- source_word: וְעִם הַמֶּלֶךְ
  choice: dan bersama raja
  rationale: Menerjemahkan teks secara langsung tanpa menambahkan 'sebagian'; pembagian kelompok tetap tersirat sebagaimana dalam bahasa Ibrani.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Bentuk baku nama tempat tersebut dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur dibuat alami sambil mempertahankan semua unsur teks Ibrani. Istilah 'kereta' dipertahankan secara ringkas untuk רֶכֶב; dalam konteks ini yang dimaksud ialah kereta perang.
