base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: id
  text: Lalu Salomo berbaring bersama leluhurnya[a], dan mereka menguburkannya di Kota Daud, ayahnya. Rehabeam, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya”; ungkapan Ibrani yang lazim untuk kematian dan pemakaman bersama para leluhur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan formula wafat dalam pemberitahuan kematian raja. Pilihan ini mempertahankan bahasa halus dan kaitan dengan para leluhur, tetapi lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'tidur bersama bapak-bapaknya'.
- source_word: וַיִּקְבְּרֻהוּ
  choice: ia dikuburkan
  rationale: Bentuk Ibrani secara harfiah berarti 'mereka menguburkan dia', tetapi pelakunya tidak disebutkan. Bentuk pasif Indonesia menyampaikan tindakan tanpa menambahkan identitas para pengubur.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Dipakai sebagai nama tempat yang dikenal dan karena itu ditulis dengan huruf kapital.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Daud disebut dalam hubungan langsung dengan Salomo; 'ayahnya' merupakan arti wajar dan tepat.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam formula pergantian takhta, ungkapan ini secara alami menyatakan bahwa Rehabeam mulai memegang pemerintahan.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Menunjukkan suksesi atau penggantian kedudukan dan terdengar alami dalam bahasa Indonesia modern.
