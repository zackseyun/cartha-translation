lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: memerintah sebagai raja
  rationale: Bentuk naratif lampau dari מלך menyatakan pemerintahan seorang raja. Ungkapan ini alami dalam bahasa Indonesia dan lebih khusus daripada sekadar 'memerintah'.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: בִירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Preposisi ב menandai lokasi; 'di Yerusalem' merupakan padanan Indonesia yang langsung dan alami.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: עַל bersama מלך menyatakan lingkup kekuasaan. 'Seluruh Israel' mempertahankan pengertian korporat dan nasional dari teks Ibrani.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Bilangan dan satuan waktu menyatakan durasi; penambahan 'selama' membuat hubungan duratif jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
