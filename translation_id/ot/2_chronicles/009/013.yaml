base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: id
  text: Berat emas yang datang kepada Salomo dalam satu tahun adalah enam ratus enam puluh enam talenta emas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dibawa kepada Salomo”; secara harfiah bahasa Ibrani berbunyi “yang datang kepada Salomo” tanpa menyebut siapa yang membawanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: adalah
  rationale: Bentuk naratif ini menghubungkan pernyataan dengan konteks sebelumnya. Dalam bahasa Indonesia, kopula “adalah” menyampaikan predikasi secara wajar tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: מִשְׁקַל הַזָּהָב
  choice: Berat emas
  rationale: מִשְׁקַל menunjuk secara khusus pada berat. Dalam bahasa Indonesia, “berat emas” lebih alami daripada “berat dari emas” dan tetap mempertahankan makna sumber.
- source_word: אֲשֶׁר בָּא
  choice: yang datang
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang tidak menyebut pelaku, alih-alih memperjelasnya menjadi bentuk pasif “yang dibawa”.
- source_word: לִשְׁלֹמֹה
  choice: kepada Salomo
  rationale: Preposisi ל menandai arah atau penerima; “kepada Salomo” menyampaikan keduanya secara tepat.
- source_word: בְּשָׁנָה אֶחָת
  choice: dalam satu tahun
  rationale: Frasa ini menyatakan jumlah yang diterima selama rentang satu tahun.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: enam ratus enam puluh enam
  rationale: Angka kardinal diterjemahkan langsung dan lengkap sesuai teks.
- source_word: כִּכְּרֵי זָהָב
  choice: talenta emas
  rationale: כִּכָּר adalah satuan berat besar yang secara baku dikenal sebagai “talenta” dalam bahasa Alkitab Indonesia; frasa ini menunjukkan bahwa satuan tersebut mengukur emas.
theological_decisions:
- issue: Kemungkinan makna simbolis angka 666
  choice: Angka diterjemahkan langsung sebagai jumlah historis tanpa isyarat penafsiran simbolis.
  alternative: Menonjolkan kemungkinan kaitan simbolis dengan kemunculan angka 666 di bagian Alkitab lain.
  rationale: Ayat Ibrani ini hanya menyatakan berat emas tahunan dan tidak memberikan penafsiran simbolis. Terjemahan tidak boleh memasukkan asosiasi teologis dari teks lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat langsung serta mudah dipahami, sementara ungkapan “yang datang” dipertahankan untuk menjaga ketidakjelasan pelaku dalam teks Ibrani.
