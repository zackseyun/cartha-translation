translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Susunan “Ketika ...” sengaja mempertahankan sifat ayat ini sebagai klausa yang berlanjut ke ayat berikutnya. Penanda catatan kaki [a] ditempatkan langsung setelah klausa terkait.
