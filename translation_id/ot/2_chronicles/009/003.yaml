  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/003.yaml
  text: When the queen of Sheba saw Solomon’s wisdom and the house that he had built,[a]
translation:
  language: id
  text: Ketika ratu Syeba melihat hikmat Salomo dan rumah yang telah dibangunnya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istana yang telah dibangunnya.” Teks Ibrani menyebutnya “rumah,” yang dalam konteks kerajaan ini mungkin secara khusus merujuk pada kompleks istana Salomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Ketika ... melihat
  rationale: Bentuk wayyiqtol secara harfiah berarti “dan ia melihat” serta melanjutkan alur cerita. Dalam konteks ini, “Ketika ... melihat” secara alami menghubungkan ayat ini dengan kelanjutan kalimat pada ayat berikutnya.
- source_word: מַלְכַּת שְׁבָא
  choice: ratu Syeba
  rationale: Rangkaian konstruksi ini menyebut sang penguasa berdasarkan negeri atau wilayahnya. “Ratu Syeba” adalah bentuk Indonesia yang alami dan lazim.
- source_word: אֵת
  choice: tidak diterjemahkan tersendiri
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: hikmat Salomo
  rationale: Rangkaian konstruksi diterjemahkan secara alami sebagai “hikmat Salomo.” “Hikmat” mencakup kebijaksanaan, wawasan, dan kecakapan menilai, bukan sekadar pengetahuan.
- source_word: וְהַבַּיִת
  choice: dan rumah
  rationale: בַּיִת secara leksikal berarti “rumah.” Dalam konteks kerajaan, istilah ini mungkin menunjuk pada istana atau kompleks istana Salomo, tetapi teks Ibrani tetap memakai istilah yang lebih luas; karena itu “rumah” dipertahankan dalam teks utama dan “istana” dicatat sebagai alternatif.
- source_word: אֲשֶׁר בָּנָה
  choice: yang telah dibangunnya
  rationale: Klausa relatif ini menerangkan “rumah.” Kata “telah” menyatakan bahwa pembangunan itu sudah selesai sebelum sang ratu melihatnya, sedangkan akhiran “-nya” secara alami merujuk kepada Salomo.
