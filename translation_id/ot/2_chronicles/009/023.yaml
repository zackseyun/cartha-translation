  text: וְ/כֹל֙ מַלְכֵ֣י הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן הָ/אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: id
  text: Semua raja di bumi berusaha menghadap Salomo[a] untuk mendengar hikmat yang telah Allah taruh di dalam hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mencari wajah Salomo,” sebuah ungkapan untuk berusaha hadir atau mendapat kesempatan menghadapnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: Semua raja di bumi
  rationale: Ungkapan ini melanjutkan narasi dan menggambarkan para penguasa secara luas. Dalam konteks kemasyhuran Salomo di antara bangsa-bangsa, הָאָרֶץ paling wajar diterjemahkan 'bumi', bukan dibatasi menjadi satu negeri.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: berusaha menghadap Salomo
  rationale: Secara harfiah, ungkapan ini berarti 'mencari wajah Salomo', tetapi merupakan idiom untuk mencari kesempatan hadir atau memperoleh audiensi di hadapannya. 'Berusaha menghadap' mempertahankan gagasan akses pribadi dan nuansa tindakan yang berlangsung atau berulang.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: untuk mendengar hikmat
  rationale: Infinitif menyatakan tujuan. 'Mendengar hikmat' mengikuti bentuk Ibrani dengan jelas dan alami dalam gaya Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: yang telah Allah taruh di dalam hatinya
  rationale: נָתַן pada dasarnya berarti 'memberikan', tetapi bersama frasa 'di dalam hatinya', padanan 'taruh' alami dan mempertahankan lokasi batin yang dinyatakan teks. Bentuk 'telah' menunjukkan bahwa pemberian hikmat itu mendahului kunjungan para raja.
theological_decisions:
- issue: Allah sebagai sumber hikmat Salomo
  choice: hikmat yang telah Allah taruh di dalam hatinya
  alternative: hikmat yang telah Allah berikan kepadanya
  rationale: Pilihan utama mempertahankan pernyataan eksplisit bahwa Allah adalah sumber hikmat sekaligus menjaga antropologi Ibrani melalui frasa 'di dalam hatinya', tanpa mereduksinya menjadi sekadar kecakapan intelektual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berusaha menghadap' dipilih agar idiom Ibrani dapat dipahami pembaca umum, sementara catatan kaki mempertahankan gambaran harfiahnya.
