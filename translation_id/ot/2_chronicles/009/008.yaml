  to: Terpujilah Yahweh, Allahmu,[a] yang berkenan kepadamu dan menempatkan engkau di takhta-Nya sebagai raja bagi Yahweh, Allahmu. Karena Allahmu mengasihi Israel dan hendak meneguhkannya selama-lamanya,[b] Ia mengangkat engkau menjadi raja atas mereka, supaya engkau menegakkan keadilan dan kebenaran.
