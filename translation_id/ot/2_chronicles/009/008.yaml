id: 2CH.9.8
reference: 2 Chronicles 9:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: id
  text: Terpujilah Yahweh, Allahmu,[a] yang berkenan kepadamu dan menempatkan engkau di takhta-Nya sebagai raja bagi Yahweh, Allahmu. Karena Allahmu mengasihi Israel dan hendak meneguhkannya selama-lamanya,[b] Ia mengangkat engkau menjadi raja atas mereka, supaya engkau menegakkan keadilan dan kebenaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Kiranya Yahweh, Allahmu, dipuji.”
    reason: Bentuk jussif Ibrani dapat dipahami sebagai ucapan berkat atau harapan pujian.
  - marker: b
    text: Secara harfiah, kata ganti Ibraninya berbentuk tunggal dan merujuk kepada Israel sebagai satu umat; dapat juga diterjemahkan “untuk meneguhkan mereka selama-lamanya.”
    reason: Bahasa Ibrani memakai akhiran tunggal bagi Israel secara kolektif, sedangkan sebagian terjemahan dapat memakai bentuk jamak sesuai makna kolektifnya.
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Terpujilah
  rationale: Ungkapan ini mempertahankan bentuk berkat atau pujian yang bersifat jussif dan terdengar wajar serta khidmat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bentuk sumber Ibrani dan tanpa menggantinya dengan gelar.
- source_word: חָפֵץ בְּךָ
  choice: berkenan kepadamu
  rationale: Mengungkapkan kesenangan atau perkenanan Allah terhadap Salomo dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: menempatkan engkau di takhta-Nya
  rationale: Mempertahankan pronomina orang ketiga pada 'takhta-Nya' dan pernyataan teologis bahwa pemerintahan raja dijalankan di bawah otoritas Allah.
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: sebagai raja bagi Yahweh, Allahmu
  rationale: Kata depan ל dipertahankan dengan 'bagi' untuk menyatakan peran raja dalam hubungannya dengan Yahweh tanpa menjelaskannya secara berlebihan.
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: Karena kasih Allahmu kepada Israel
  rationale: Bentuk nominal Ibrani dipertahankan dan hubungan sebab dinyatakan secara alami.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: untuk meneguhkannya selama-lamanya
  rationale: Infinitif tujuan dan akhiran tunggal dipertahankan; '-nya' merujuk kepada Israel sebagai satu umat.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: Ia mengangkat engkau menjadi raja atas mereka
  rationale: Dalam konteks penobatan, נתן menyatakan pengangkatan atau penetapan; 'mengangkat' alami dalam bahasa Indonesia.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: supaya engkau menegakkan keadilan dan kebenaran
  rationale: Menyampaikan fungsi kerajaan secara jelas sambil mempertahankan kedua unsur pasangan istilah Ibrani.
theological_decisions:
- issue: Rujukan כִּסְאוֹ ('takhta-Nya')
  choice: Pronomina dipertahankan sebagai 'takhta-Nya', dengan rujukan kepada Yahweh.
  alternative: Menjadikannya sekadar 'takhta kerajaan' atau 'takhta Salomo'.
  rationale: Susunan ayat menampilkan pemerintahan Salomo sebagai pemerintahan yang dijalankan bagi Yahweh; menghilangkan pronomina akan melemahkan pernyataan sumber.
- issue: Hubungan sintaksis kasih Allah, peneguhan Israel, dan pengangkatan raja
  choice: Mempertahankan frasa tujuan 'untuk meneguhkannya selama-lamanya' tanpa menambahkan verba seperti 'ingin'.
  alternative: Karena Allahmu mengasihi Israel dan ingin meneguhkannya selama-lamanya.
  rationale: Teks Ibrani memakai frasa infinitif yang hubungannya dengan klausa di sekitarnya tidak sepenuhnya tunggal. Terjemahan utama tidak menambahkan kehendak eksplisit atau secara diam-diam menutup ambiguitas tersebut.
- issue: מִשְׁפָּט וּצְדָקָה sebagai rumusan kerajaan
  choice: keadilan dan kebenaran
  alternative: hukum dan keadilan
  rationale: Dua istilah dipertahankan sebagai konsep yang berkaitan tetapi tidak identik, tanpa mereduksi צְדָקָה menjadi pengulangan 'keadilan'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. 'Engkau' dipakai untuk sapaan kerajaan dalam konteks resmi. Kapitalisasi pronomina ilahi digunakan pada 'takhta-Nya' dan 'Ia' demi kejelasan rujukan, sedangkan nama Yahweh dipertahankan sebagai nama diri.
