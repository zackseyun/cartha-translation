  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: id
  text: Selebihnya dari riwayat Salomo[a], dari awal sampai akhir, bukankah semuanya tertulis dalam catatan Nabi Natan, dalam nubuat Ahia orang Silo, dan dalam penglihatan-penglihatan Ido, sang pelihat, mengenai Yerobeam anak Nebat[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang sama, yang diterjemahkan “riwayat” di sini dan “catatan” dalam frasa tentang Nabi Natan, juga dapat berarti “perkataan” atau “riwayat.” Dalam konteks ini, istilah itu tampaknya menunjuk pada sumber tertulis.
    reason: lexical_alternative
  - marker: b
    text: Atau “melawan Yerobeam anak Nebat”. Kata depan Ibrani yang dipakai di sini dapat memiliki beberapa makna yang berkaitan, tetapi “mengenai” paling sesuai dengan konteks penyebutan sumber.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: Selebihnya dari riwayat Salomo
  rationale: Dalam rumus penutup kerajaan, דִּבְרֵי mencakup perbuatan, kejadian, dan perkara mengenai seorang raja, bukan hanya perkataannya. 'Riwayat Salomo' menyampaikan cakupan historiografis itu secara alami dalam bahasa Indonesia.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: dari awal sampai akhir
  rationale: Ungkapan ini merangkum seluruh rentang riwayat Salomo dan lebih alami daripada terjemahan harfiah 'yang terdahulu dan yang kemudian'.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris Ibrani; 'semuanya' mengacu pada keseluruhan riwayat yang baru disebut.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: dalam catatan Nabi Natan
  rationale: Dalam konteks penyebutan sumber, דִּבְרֵי kemungkinan menunjuk pada catatan atau karya tertulis. Kata depan עַל bersama כְּתוּבִים secara idiomatis diterjemahkan 'tertulis dalam'.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: nubuat Ahia, orang Silo
  rationale: נְבוּאָה berarti 'nubuat', sedangkan bentuk nisbah הַשִּׁילוֹנִי secara jelas dan alami menunjukkan bahwa Ahia berasal atau terkait dengan Silo.
- source_word: וּבַחֲזוֹת יעדי הַחֹזֶה
  choice: dan dalam penglihatan-penglihatan Ido, sang pelihat
  rationale: חֲזוֹת menunjuk pada penglihatan-penglihatan visioner. 'Pelihat' mempertahankan pembedaan istilah חֹזֶה dari נָבִיא, 'nabi'. Nama dalam tradisi teks dipahami sebagai Ido.
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: mengenai Yerobeam anak Nebat
  rationale: עַל di sini paling wajar menandai pokok penglihatan Ido, tetapi secara leksikal juga dapat bernuansa 'tentang' atau 'melawan'.
theological_decisions:
- issue: Arah makna עַל dalam hubungan penglihatan Ido dengan Yerobeam
  choice: mengenai Yerobeam anak Nebat
  alternative: melawan Yerobeam anak Nebat
  rationale: Konteks daftar sumber mendukung makna pokok bahasan ('mengenai'), tetapi kemungkinan nuansa adversatif tidak boleh dihapus dan dicatat dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Bentuk pertanyaan retoris sumber dipertahankan. Gelar ''Nabi'' dan ''pelihat'' dibedakan, sedangkan nama-nama mengikuti bentuk Indonesia yang lazim: Salomo, Natan, Ahia, Silo, Ido, Yerobeam, dan Nebat.'
