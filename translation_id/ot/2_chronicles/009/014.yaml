  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat dibuka dengan frasa lanjutan karena ayat ini secara sintaksis meneruskan jumlah pada ayat sebelumnya. Perbedaan antara pedagang keliling dan saudagar dipertahankan.
