  text: לְ/בַ֞ד מֵ/אַנְשֵׁ֧י הַ/תָּרִ֛ים וְ/הַ/סֹּחֲרִ֖ים מְבִיאִ֑ים וְ/כָל מַלְכֵ֤י עֲרַב֙ וּ/פַח֣וֹת הָ/אָ֔רֶץ מְבִיאִ֛ים זָהָ֥ב וָ/כֶ֖סֶף לִ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/014.yaml
  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: id
  text: Selain apa yang dibawa oleh para pedagang keliling dan para saudagar, semua raja Arab dan para gubernur negeri itu membawa emas dan perak kepada Salomo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: para pedagang keliling
  rationale: Secara harfiah menunjuk kepada orang-orang yang berkeliling; dalam konteks ini mereka adalah pedagang yang bepergian.
- source_word: הַסֹּחֲרִים
  choice: para saudagar
  rationale: Membedakan kelompok ini dari pedagang keliling sambil mempertahankan makna komersialnya.
- source_word: מַלְכֵי עֲרַב
  choice: raja Arab
  rationale: עֲרַב di sini paling wajar dipahami sebagai nama kawasan atau bangsa, yaitu Arab/Arabia.
- source_word: פַחוֹת הָאָרֶץ
  choice: para gubernur negeri itu
  rationale: פַחוֹת adalah pejabat pemerintahan wilayah; 'gubernur' merupakan padanan modern yang tepat, sedangkan הָאָרֶץ tetap tidak diperinci.
- source_word: מְבִיאִים
  choice: membawa
  rationale: Partisipel Ibrani menyatakan tindakan yang berlangsung atau berulang dalam uraian tentang pemasukan Salomo; bentuk Indonesia sederhana tetap alami dan tidak memaksakan aspek yang lebih khusus.
