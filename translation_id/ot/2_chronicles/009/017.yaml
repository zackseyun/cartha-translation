  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/017.yaml
  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: id
  text: Raja membuat sebuah takhta besar dari gading[a] dan melapisinya dengan emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “takhta dari gigi”; ungkapan ini berarti takhta dari gading.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Dalam konteks pembuatan perlengkapan kerajaan, עשה secara wajar berarti 'membuat'; pilihan ini langsung dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina tentu ini dipertahankan sebagai gelar. Konteks menunjuk kepada Salomo, tetapi teks Ibrani memakai 'raja', bukan nama pribadinya.
- source_word: כִּסֵּא
  choice: takhta
  rationale: כִּסֵּא dapat berarti tempat duduk, tetapi karena pemiliknya adalah raja, makna kerajaan 'takhta' paling tepat.
- source_word: שֵׁן
  choice: gading
  rationale: Arti harfiahnya adalah 'gigi', tetapi dalam konstruksi כִּסֵּא שֵׁן kata ini menunjuk pada bahan gading. Ungkapan 'dari gading' menyampaikan hubungan bahan secara alami tanpa menentukan apakah seluruh struktur inti terbuat dari gading.
- source_word: גָּדוֹל
  choice: besar
  rationale: גָּדוֹל dapat menyatakan ukuran maupun keagungan. 'Besar' merupakan padanan Indonesia yang alami dan tetap dapat menyiratkan kemegahan dalam konteks ini.
- source_word: וַיְצַפֵּהוּ
  choice: melapisinya
  rationale: Bentuk piel צפה dengan akhiran objek berarti menutupi atau melapisi benda dengan suatu bahan; 'melapisinya' tepat untuk pelapisan dengan logam mulia.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan langsung dan idiomatis bagi frasa yang menyatakan emas berkadar murni.
