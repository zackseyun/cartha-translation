  text: וַ/יְהִ֥י מוֹשֵׁ֖ל בְּ/כָל הַ/מְּלָכִ֑ים מִן הַ/נָּהָר֙ וְ/עַד אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֥וּל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: id
  text: Ia berkuasa atas semua raja dari Sungai itu[a] sampai ke negeri orang Filistin dan sampai ke perbatasan Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sungai itu” kemungkinan besar merujuk kepada Sungai Efrat, sebutan geografis yang lazim dalam Alkitab Ibrani.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: Ia berkuasa
  rationale: Gabungan wayyiqtol היה dengan partisipel משל menyatakan keadaan atau tindakan memerintah pada masa lampau. 'Ia berkuasa' alami dalam bahasa Indonesia dan mempertahankan makna kekuasaan politik.
- source_word: בְּכָל הַמְּלָכִים
  choice: atas semua raja
  rationale: Dengan משל, preposisi ב menandai pihak yang berada di bawah kekuasaan; 'atas semua raja' menyampaikan hubungan kekuasaan tanpa melemahkannya menjadi sekadar 'di antara'.
- source_word: מִן הַנָּהָר
  choice: dari Sungai itu
  rationale: Bentuk definit הַנָּהָר secara harfiah berarti 'Sungai itu' dan dalam rumusan geografis ini lazim menunjuk kepada Sungai Efrat. Teks utama mempertahankan penyebutan Ibrani, sedangkan catatan kaki menjelaskan rujukannya.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: sampai ke negeri orang Filistin
  rationale: Ungkapan ini menandai batas wilayah di sebelah barat. 'Negeri orang Filistin' dekat dengan bentuk Ibrani dan lebih mudah dipahami daripada nama wilayah yang lebih teknis.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: dan sampai ke perbatasan Mesir
  rationale: גְּבוּל berarti batas atau perbatasan. Terjemahan ini mempertahankan gambaran batas teritorial dan menghasilkan rangkaian geografis yang wajar dalam bahasa Indonesia.
