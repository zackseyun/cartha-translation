base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: id
  text: Raja Salomo memberikan kepada ratu Syeba segala yang diinginkannya, apa pun yang dimintanya, selain apa yang telah dibawanya kepada raja.[a] Kemudian ratu itu pulang ke negerinya[b] bersama para pelayannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di samping apa yang telah dibawanya kepada raja.” Frasa Ibrani ini dapat dipahami sebagai membedakan pemberian Salomo dari pemberian yang dibawa ratu itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “berbalik lalu pergi ke negerinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: memberikan
  rationale: Padanan umum dan alami untuk tindakan memberi dalam konteks pertukaran hadiah kerajaan.
- source_word: מַלְכַּת שְׁבָא
  choice: ratu Syeba
  rationale: Gelar diterjemahkan secara langsung, sedangkan nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: כָּל חֶפְצָהּ
  choice: segala yang diinginkannya
  rationale: חֵפֶץ dapat menunjuk pada keinginan atau sesuatu yang diinginkan; ungkapan ini alami sekaligus mempertahankan keluasan maknanya.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: apa pun yang dimintanya
  rationale: Frasa ini menjelaskan bahwa keinginannya dinyatakan sebagai permintaan; bentuk Indonesia ini ringkas dan idiomatis.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: selain apa yang telah dibawanya kepada raja
  rationale: Terjemahan ini mengikuti susunan teks Ibrani tanpa menjelaskan secara spekulatif bagaimana barang yang dibawa sang ratu berkaitan dengan pemberian Salomo.
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  choice: Kemudian ratu itu pulang ke negerinya
  rationale: Secara harfiah rangkaian verba ini berarti 'berbalik lalu pergi ke negerinya', tetapi dalam konteks perjalanan, 'pulang' menyampaikan gerak kembali secara alami.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: bersama para pelayannya
  rationale: עֲבָדִים dapat berarti hamba atau pelayan; untuk rombongan istana seorang ratu, 'para pelayan' paling alami tanpa menetapkan status sosial yang tidak dijelaskan konteks.
