  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: id
  text: Raja membuat perak di Yerusalem sama melimpahnya seperti batu-batu, dan membuat pohon-pohon aras sama melimpahnya seperti pohon-pohon ara sikomor yang tumbuh di daerah kaki bukit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Syefela,” kawasan kaki bukit Yehuda di sebelah barat pegunungan tengah.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: membuat ... menjadi / dibuatnya
  rationale: Secara harfiah berarti “memberi” atau “menempatkan”, tetapi dalam perbandingan ini menyatakan bahwa raja menyebabkan perak dan pohon aras tersedia dengan sangat melimpah.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: Kata ini menunjuk pada logam perak, bukan secara khusus uang atau mata uang.
- source_word: כָּאֲבָנִים
  choice: selimpah batu
  rationale: Perbandingan ini menyatakan kelimpahan dan kelaziman, bukan sekadar kemiripan bentuk; ungkapan ini menyampaikan maksud tersebut secara alami dalam bahasa Indonesia.
- source_word: הָאֲרָזִים
  choice: pohon aras
  rationale: Bentuk jamak Ibrani dapat menunjuk pada pohon atau bahan kayunya. “Pohon aras” mempertahankan gambaran perbandingan dengan pohon ara hutan tanpa secara khusus membatasinya pada kayu olahan.
- source_word: כַּשִּׁקְמִים
  choice: sama melimpahnya dengan pohon ara hutan
  rationale: שִׁקְמִים adalah pohon ara sikomor, bukan pohon sycamore modern dari genus Acer. Istilah Indonesia “pohon ara hutan” mudah dipahami dan menghindari kekeliruan jenis pohon.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: di daerah kaki bukit[a]
  rationale: שְׁפֵלָה menunjuk pada kawasan kaki bukit atau perbukitan rendah di Yehuda. Nama geografis teknis “Syefela” dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: לָרֹב
  choice: melimpahnya
  rationale: Ungkapan ini menegaskan jumlah yang sangat banyak dan diintegrasikan secara alami ke dalam perbandingan.
