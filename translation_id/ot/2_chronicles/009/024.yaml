  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: id
  text: 'Setiap orang membawa upetinya[a]: barang-barang dari perak dan barang-barang dari emas, pakaian[b], senjata[c], rempah-rempah, kuda, dan bagal, tahun demi tahun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberiannya” atau “persembahannya”; kata Ibrani מִנְחָה dapat berarti pemberian atau persembahan, tetapi dalam konteks kerajaan ini kemungkinan besar berarti upeti.
    reason: lexical_alternative
  - marker: b
    text: Atau “jubah”.
    reason: lexical_alternative
  - marker: c
    text: Atau “perlengkapan perang” atau “baju zirah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: membawa
  rationale: Bentuk partisip menyatakan tindakan yang berlangsung atau menjadi kebiasaan; ungkapan penutup “tahun demi tahun” sudah memperjelas pengulangannya secara alami dalam bahasa Indonesia.
- source_word: אִישׁ מִנְחָתוֹ
  choice: masing-masing membawa upetinya
  rationale: אִישׁ dipakai secara distributif, yaitu “masing-masing”. Dalam konteks pemberian teratur kepada raja, מִנְחָה paling tepat diterjemahkan “upeti”, sambil mempertahankan alternatif “pemberian” dalam catatan kaki.
- source_word: כְּלֵי כֶסֶף
  choice: barang-barang dari perak
  rationale: כְּלִי merupakan istilah luas untuk barang, benda, perkakas, atau wadah; “barang-barang” mempertahankan keluasan maknanya.
- source_word: וּכְלֵי זָהָב
  choice: barang-barang dari emas
  rationale: Diterjemahkan sejajar dengan כְּלֵי כֶסֶף dan tidak membatasi jenis bendanya.
- source_word: וּשְׂלָמוֹת
  choice: pakaian
  rationale: Kata ini menunjuk pada barang sandang, kemungkinan pakaian luar yang berharga; “pakaian” cukup luas tanpa menentukan modelnya.
- source_word: נֵשֶׁק
  choice: senjata
  rationale: נֵשֶׁק dapat menunjuk pada senjata atau perlengkapan perang; “senjata” merupakan padanan modern yang jelas, sedangkan alternatif yang lebih luas dicatat.
- source_word: וּבְשָׂמִים
  choice: rempah-rempah
  rationale: Padanan alami dalam daftar hadiah kerajaan dan cukup luas untuk bahan-bahan harum atau aromatik.
- source_word: סוּסִים
  choice: kuda
  rationale: Padanan leksikal langsung.
- source_word: וּפְרָדִים
  choice: bagal
  rationale: Padanan leksikal langsung untuk hewan hasil silang kuda dan keledai.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: tahun demi tahun
  rationale: Ungkapan idiomatis ini menunjukkan pengulangan teratur setiap tahun; “tahun demi tahun” mempertahankan nuansa iteratifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang jelas dan bernada luhur tetapi mudah dipahami. Bentuk “masing-masing” mempertahankan sifat distributif teks Ibrani, sedangkan “tahun demi tahun” menyampaikan kebiasaan berulang tanpa membuat bentuk verbal menjadi kaku.
