    rationale: Dalam Ibrani, objek-objek—jalan/tangga, lira, dan harpa—mengikuti verba tunggal “membuat” dengan “kayu algum” sebagai bahan. Kalimat tambahan “Ia juga membuat” dapat dibaca sebagai tindakan terpisah tanpa bahan tersebut.
  - severity: low
    issue: “Jalan-jalan bertingkat” kurang idiomatis sebagai istilah arsitektural utama.
    rationale: Dalam konteks ini, “tangga-tangga” lebih langsung dan mudah dipahami. Karena makna מְסִלּוֹת diperdebatkan, alternatif yang lebih luas dipertahankan dalam catatan kaki.
