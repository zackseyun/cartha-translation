base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: id
  text: Raja membuat dari kayu algum[b] tangga-tangga[a] untuk Bait Yahweh dan istana raja, serta lira dan harpa bagi para penyanyi. Sebelumnya, benda-benda seperti itu belum pernah terlihat di tanah Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan-jalan penghubung”. Istilah Ibrani ini dapat menunjuk pada jalan masuk, jalur penghubung, atau tangga dalam suatu bangunan.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: “algum”. Dalam bagian sejajar di 1 Raja-Raja 10:12, kayu ini disebut “almug”. Jenis pohonnya tidak dapat dipastikan.'
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִים
  choice: kayu algum
  rationale: Nama jenis kayu langka ini tidak dapat dipastikan. Transliterasi bentuk dalam Kitab Tawarikh menghindari identifikasi spesies yang bersifat dugaan.
- source_word: מְסִלּוֹת
  choice: jalan-jalan bertingkat
  rationale: Kata ini biasanya menunjuk pada jalan yang ditinggikan, tetapi dalam konteks bangunan dapat berarti jalur penghubung atau tangga. Pilihan ini mempertahankan gagasan struktur untuk berjalan tanpa memastikan bentuk arsitekturalnya.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: untuk Bait Yahweh dan istana raja
  rationale: Dalam konteks ini, dua pemakaian 'rumah' menunjuk pada bangunan ibadah dan kediaman kerajaan. Padanan kontekstual ini alami dan jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, sesuai bentuk nama perjanjian dalam teks Ibrani.
- source_word: כִנֹּרוֹת וּנְבָלִים
  choice: lira dan harpa
  rationale: Kedua istilah menunjuk pada alat musik petik yang berbeda, walaupun bentuk persis alat-alat kuno tersebut tidak diketahui.
- source_word: לַשָּׁרִים
  choice: bagi para penyanyi
  rationale: Bentuk partisip dari akar שׁיר secara langsung berarti orang-orang yang bernyanyi.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים בְּאֶרֶץ יְהוּדָה
  choice: Sebelumnya, benda-benda seperti itu belum pernah terlihat di tanah Yehuda
  rationale: Ungkapan ini menyatakan bahwa benda-benda tersebut belum pernah dijumpai sebelumnya, sambil mempertahankan penyebutan eksplisit 'tanah Yehuda'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar alami dan mudah dipahami, tanpa menghilangkan hubungan tindakan raja dengan benda-benda yang dibuat.
