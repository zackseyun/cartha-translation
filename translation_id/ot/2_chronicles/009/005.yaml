  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: id
  text: Lalu ia berkata kepada raja, “Benarlah kabar yang kudengar di negeriku tentang perkataanmu[a] dan hikmatmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentang urusanmu” atau “tentang perkara-perkaramu”.
    reason: Kata Ibrani דְּבָרֶיךָ dapat berarti perkataan, perkara, atau urusan.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu perempuan itu berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Subjek feminin yang tersirat dalam verba dinyatakan sebagai ‘perempuan itu’ agar jelas dan alami dalam bahasa Indonesia berdasarkan konteks ratu Syeba.
- source_word: אֶל־הַמֶּלֶךְ
  choice: kepada raja
  rationale: Terjemahan langsung bagi frasa preposisional yang menunjukkan orang yang diajak bicara.
- source_word: אֱמֶת הַדָּבָר אֲשֶׁר שָׁמַעְתִּי
  choice: Benarlah kabar yang kudengar
  rationale: Ungkapan Ibrani menegaskan kebenaran דבר yang telah didengar. ‘Kabar’ sesuai dengan konteks berita yang sampai kepadanya, sedangkan ‘Benarlah’ mempertahankan penekanan pada אֱמֶת di awal klausa.
- source_word: בְּאַרְצִי
  choice: di negeriku
  rationale: Mempertahankan arti ‘di tanah/negeriku’ beserta sufiks orang pertama tunggal dalam bentuk Indonesia yang alami dan bermartabat.
- source_word: עַל־דְּבָרֶיךָ
  choice: tentang perkataan-perkataanmu
  rationale: דברים dapat berarti perkataan, perkara, atau urusan. Pilihan ini mempertahankan arti leksikal langsung serta ambiguitas konteksnya, dengan alternatif dicatat dalam catatan kaki.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: dan tentang hikmatmu
  rationale: Terjemahan langsung yang mempertahankan tema utama hikmat Salomo dan kesejajaran dengan frasa sebelumnya.
