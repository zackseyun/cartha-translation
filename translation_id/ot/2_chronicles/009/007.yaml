  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ וְ/אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד וְ/שֹׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: id
  text: Betapa bahagianya orang-orangmu,[a] dan betapa bahagianya para hambamu ini, yang senantiasa berdiri di hadapanmu[b] dan mendengarkan hikmatmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Betapa beruntungnya orang-orangmu. Kata Ibrani yang digunakan dapat menyatakan keadaan bahagia, beruntung, atau diberkati.'
    reason: lexical_alternative
  - marker: b
    text: “Berdiri di hadapanmu” adalah ungkapan lingkungan istana untuk hadir menghadap dan melayani seorang raja.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: betapa bahagianya
  rationale: Ungkapan ini menyatakan keadaan yang patut dianggap bahagia, beruntung, atau diberkati. Bentuk seruan “betapa bahagianya” alami dalam bahasa Indonesia dan tidak terdengar seperti perintah.
- source_word: אֲנָשֶׁיךָ
  choice: orang-orangmu
  rationale: אֲנָשִׁים adalah sebutan umum bagi orang-orang atau laki-laki. Dalam konteks ini mereka kemungkinan anggota lingkungan istana, tetapi padanan yang lebih umum mempertahankan keluasan istilah Ibrani.
- source_word: עֲבָדֶיךָ
  choice: para hambamu
  rationale: עֶבֶד dapat berarti budak, hamba, atau pelayan. Dalam lingkungan istana, “hamba” mempertahankan hubungan pelayanan kepada raja tanpa secara khusus menekankan status perbudakan.
- source_word: אֵלֶּה
  choice: ini
  rationale: Kata penunjuk ini mengarahkan perhatian kepada para hamba yang hadir dan kemudian dijelaskan oleh frasa partisipial.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: yang ... berdiri di hadapanmu
  rationale: Terjemahan ini mempertahankan gambaran harfiah ungkapan istana yang berarti hadir untuk melayani atau menghadap seorang raja.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Kata ini menunjukkan kehadiran yang tetap atau teratur; “senantiasa” sesuai dengan nada pujian yang luhur tanpa harus menyatakan keberadaan tanpa jeda secara mutlak.
- source_word: וְשֹׁמְעִים
  choice: dan mendengarkan
  rationale: Dalam konteks menerima hikmat raja, “mendengarkan” lebih alami daripada sekadar “mendengar” dan menyiratkan perhatian tanpa menambahkan gagasan ketaatan secara eksplisit.
- source_word: חָכְמָתֶךָ
  choice: hikmatmu
  rationale: Padanan langsung ini menyatakan hikmat yang dimiliki dan diungkapkan oleh raja.
