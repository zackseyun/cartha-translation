  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: id
  text: Salomo menjawab semua pertanyaannya[a]; tidak ada satu perkara pun yang tersembunyi bagi Salomo dan yang tidak dijelaskannya kepada ratu itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Salomo memberitahukan kepadanya segala hal yang dikemukakannya”; secara lebih harfiah, “segala perkataannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih harfiah, “tidak ada satu perkara pun yang tersembunyi dari Salomo yang tidak diberitahukannya kepada perempuan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לָהּ שְׁלֹמֹה
  choice: Salomo menjawab
  rationale: Secara leksikal, נגד berarti “memberi tahu” atau “menyatakan”, tetapi dalam konteks sang ratu menguji Salomo dengan pertanyaan-pertanyaan sulit, tindakan Salomo merupakan jawaban. “Menjawab” menyampaikan fungsi ungkapan itu secara alami dalam bahasa Indonesia.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: semua pertanyaannya
  rationale: דבר dapat berarti “perkataan”, “hal”, atau “perkara”. Konteks ayat sebelumnya menunjukkan bahwa yang dimaksud ialah berbagai pertanyaan atau persoalan yang diajukan sang ratu.
- source_word: וְלֹא נֶעְלַם דָּבָר מִשְּׁלֹמֹה
  choice: tidak ada satu perkara pun yang tersembunyi bagi Salomo
  rationale: Bentuk Nifal נֶעְלַם berarti “tersembunyi”. Frasa dengan מִן menandai orang yang baginya perkara itu tidak tersembunyi; “bagi Salomo” lebih wajar daripada terjemahan harfiah “dari Salomo” dalam bahasa Indonesia.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: yang tidak dijelaskannya kepadanya
  rationale: הִגִּיד secara harfiah berarti “memberi tahu” atau “menyatakan”. Dalam konteks jawaban atas pertanyaan sulit, “menjelaskan” mengungkapkan maksud kontekstualnya, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
