base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: id
  text: Ia memberikan kepada raja 120 talenta emas, rempah-rempah dalam jumlah yang sangat besar, dan batu-batu berharga. Belum pernah ada rempah-rempah seperti yang diberikan ratu Syeba kepada Raja Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tidak pernah lagi ada rempah-rempah seperti yang diberikan ratu Syeba kepada Raja Salomo.” Teks Ibrani dapat dipahami sebagai pernyataan bahwa hingga saat itu belum pernah ada rempah-rempah yang sebanding, atau secara lebih luas bahwa pemberian itu tetap tidak tertandingi dalam ingatan Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Ia memberikan
  rationale: Bentuk wayyiqtol dari נתן melanjutkan rangkaian narasi. Dalam bahasa Indonesia, urutan peristiwa sudah jelas tanpa harus menambahkan kata penghubung.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: 120 talenta emas
  rationale: כִּכָּר adalah satuan berat kuno yang secara konvensional diterjemahkan sebagai 'talenta'; angka ditulis secara ringkas dan mudah dibaca.
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  choice: rempah-rempah dalam jumlah yang sangat besar
  rationale: בְּשָׂמִים menunjuk pada bahan-bahan harum atau rempah-rempah, sedangkan לָרֹב מְאֹד sangat menegaskan banyaknya.
- source_word: וְאֶבֶן יְקָרָה
  choice: dan batu-batu berharga
  rationale: Walaupun אֶבֶן berbentuk tunggal, kata itu dapat berfungsi secara kolektif; bentuk jamak wajar dalam daftar hadiah ini.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: Belum pernah ada rempah-rempah seperti itu
  rationale: Frasa ini menyatakan bahwa tidak ada rempah-rempah sebanding dengan pemberian tersebut. 'Belum pernah ada' secara alami menyampaikan perbandingan retrospektif dalam narasi.
- source_word: אֲשֶׁר נָתְנָה מַלְכַּת שְׁבָא לַמֶּלֶךְ שְׁלֹמֹה
  choice: yang diberikan ratu Syeba kepada Raja Salomo
  rationale: Klausa relatif ini mengidentifikasi rempah-rempah yang dibandingkan; gelar dan nama dirangkai secara alami sebagai 'Raja Salomo'.
