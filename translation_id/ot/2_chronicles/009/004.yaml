  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: id
  text: makanan di mejanya, tempat duduk para abdinya, tata pelayanan para pelayannya beserta pakaian mereka, para juru minumnya beserta pakaian mereka, dan jalan naik yang digunakannya untuk naik ke rumah Yahweh[a], ia sampai kehilangan napas karena takjub.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian ini juga dapat diterjemahkan, mengikuti bagian paralel dalam 1 Raja-raja 10:5, “korban bakaran yang dipersembahkannya di rumah Yahweh.” Namun, teks Ibrani di sini paling wajar berarti “jalan naik yang digunakannya untuk naik.”
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “tidak ada lagi napas dalam dirinya,” ungkapan yang menggambarkan ketakjuban luar biasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: makanan di mejanya
  rationale: מַאֲכַל berarti makanan atau hidangan yang disediakan untuk dimakan. Ungkapan ini konkret, jelas, dan alami dalam bahasa Indonesia.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: tempat duduk para pegawainya
  rationale: מוֹשָׁב dapat menunjuk tempat duduk atau tata tempat duduk. Dalam konteks istana, עֲבָדָיו menunjuk para abdi atau pejabat kerajaan; 'pegawai' menghindari kesan bahwa yang dimaksud pasti budak.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: para pelayan yang berdiri melayaninya
  rationale: מַעֲמַד mengandung gagasan berdiri atau menempati posisi, sedangkan מְשָׁרְתָיו adalah orang-orang yang melayani raja. Terjemahan ini mempertahankan gambaran lahiriah tentang pelayanan istana yang tertata.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: pakaian mereka
  rationale: Kata ini secara langsung berarti pakaian atau busana; 'pakaian' merupakan padanan modern dan netral.
- source_word: מַשְׁקָיו
  choice: para juru minumnya
  rationale: Dalam lingkungan kerajaan, kata ini menunjuk para petugas yang menyajikan minuman. 'Juru minum' mempertahankan fungsi khusus mereka tanpa memakai istilah budaya modern yang menyesatkan.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: jalan naik yang dilaluinya menuju rumah Yahweh
  rationale: Teks Masoret paling wajar menunjuk jalan, tangga, atau sarana untuk naik menuju rumah Yahweh. 'Jalan naik' mempertahankan keluasan makna עֲלִיָּה tanpa menentukan bahwa bentuknya pasti tangga.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: בֵּית secara harfiah berarti 'rumah', dan יְהוָה adalah nama ilahi. Bentuk ini mempertahankan ungkapan Ibrani dan nama perjanjian tersebut.
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: ia sampai kehilangan napas karena takjub
  rationale: Secara harfiah ungkapan itu menyatakan bahwa tidak ada lagi napas dalam dirinya. Dalam konteks ini, ungkapan tersebut menggambarkan ketakjuban yang luar biasa; terjemahan utama dibuat alami, sedangkan citra harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi, bukan menggantinya dengan gelar, tanpa menambahkan penafsiran denominasi tertentu.
- issue: Makna עֲלִיָּתוֹ dibandingkan bacaan paralel dalam 1 Raja-raja 10:5
  choice: jalan naik yang dilaluinya
  alternative: kurban bakaran yang dipersembahkannya
  rationale: Teks Ibrani WLC untuk ayat ini paling alami dibaca sebagai 'jalan atau sarana naik'. Namun, bacaan tentang kurban bakaran dikenal dari bagian paralel dan layak dicatat tanpa menggantikan teks utama.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada bermartabat. Ayat ini merupakan kelanjutan kalimat dari ayat sebelumnya, sehingga dimulai dengan rangkaian objek tanpa huruf kapital. Istilah-istilah istana dibedakan secara wajar: ''pegawai'', ''pelayan'', dan ''juru minum''. Citra Ibrani yang kurang idiomatis dijelaskan dalam catatan kaki.'
