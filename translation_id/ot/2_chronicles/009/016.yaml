base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: id
  text: Ia juga membuat tiga ratus perisai dari emas tempaan. Sebanyak tiga ratus syikal emas[a] digunakan untuk setiap perisai. Raja menempatkan semuanya di Gedung Hutan Lebanon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi “tiga ratus emas” dan tidak menyebutkan satuan berat. “Syikal” ditambahkan untuk memperjelas maksud yang mungkin tersirat.
    reason: lexical_alternative
  - marker: b
    text: Gedung Hutan Lebanon adalah nama sebuah bangunan kerajaan; dapat juga diterjemahkan “Istana Hutan Lebanon.”
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: perisai
  rationale: מָגֵן adalah istilah umum untuk perisai. “Perisai” merupakan padanan Indonesia modern yang jelas dan tidak mempersempit bentuk atau ukurannya.
- source_word: זָהָב שָׁחוּט
  choice: emas tempaan
  rationale: שָׁחוּט dalam konteks pengerjaan logam menunjuk pada emas yang ditempa atau dipukul hingga menjadi lembaran. “Emas tempaan” ringkas, wajar, dan mempertahankan gagasan tentang logam yang dikerjakan.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: tiga ratus syikal emas
  rationale: Teks Ibrani secara harfiah hanya menyebut “tiga ratus emas” tanpa satuan. “Syikal” disisipkan dalam teks agar jumlah berat dapat dipahami, tetapi ketidaktersuratannya dalam sumber dijelaskan dalam catatan kaki.
- source_word: יַעֲלֶה עַל
  choice: digunakan untuk
  rationale: Ungkapan ini secara konkret menyatakan bahwa jumlah emas tersebut “naik pada” setiap perisai, yakni diterapkan atau dipakai padanya. “Digunakan untuk” menyampaikan fungsi itu secara alami tanpa menyatakan bahwa seluruh perisai pasti terbuat dari emas padat.
- source_word: הַמָּגֵן הָאֶחָת
  choice: setiap perisai
  rationale: Bentuknya secara harfiah tunggal, “perisai yang satu,” tetapi dalam rangkaian tiga ratus perisai berfungsi distributif. “Setiap perisai” adalah padanan Indonesia yang alami.
- source_word: וַיִּתְּנֵם
  choice: menempatkan semuanya
  rationale: Dalam konstruksi dengan keterangan tempat, נתן berarti menaruh atau menempatkan. Akhiran objek jamaknya diungkapkan sebagai “semuanya,” merujuk pada perisai-perisai tersebut.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Gedung Hutan Lebanon
  rationale: Frasa ini merupakan nama sebuah bangunan kerajaan tertentu. “Gedung” mempertahankan arti dasar בֵּית sekaligus lebih alami daripada “rumah” untuk bangunan kerajaan ini; kapitalisasi menandai nama diri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata kerja “membuat” diteruskan dari konteks ayat sebelumnya karena klausa Ibrani ayat ini bergantung secara sintaksis pada kata kerja tersebut. Istilah teknis dan nama bangunan dijelaskan secara singkat melalui catatan kaki.
