  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: id
  text: Raja Salomo melebihi semua raja di bumi dalam hal kekayaan dan hikmat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: melebihi
  rationale: Dalam konstruksi perbandingan dengan מִן, kata kerja גדל menyatakan bahwa Salomo lebih besar atau unggul daripada yang lain. “Melebihi” menyampaikan perbandingan itu secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Frasa ini menyandingkan gelar dan nama. “Raja Salomo” merupakan bentuk yang wajar dan tetap mempertahankan keduanya.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: semua raja di bumi
  rationale: Kata אֶרֶץ dapat berarti “negeri” atau “bumi”. Dalam perbandingan internasional yang luas ini, “bumi” paling sesuai, sedangkan “di bumi” terdengar alami dalam bahasa Indonesia.
- source_word: לְעֹשֶׁר
  choice: dalam hal kekayaan
  rationale: Awalan לְ menunjukkan bidang atau segi yang menjadi dasar perbandingan. “Dalam hal kekayaan” menyatakan fungsi tersebut dengan jelas dan alami.
- source_word: וְחָכְמָה
  choice: dan hikmat
  rationale: Kata חָכְמָה berarti “hikmat”. Kata “dan” menghubungkannya dengan kekayaan sebagai bidang kedua dalam perbandingan tanpa perlu mengulang “dalam hal”.
