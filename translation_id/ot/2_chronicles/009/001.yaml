  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: id
  text: Ratu Syeba mendengar kabar tentang Salomo[a]. Ia datang ke Yerusalem untuk menguji Salomo dengan teka-teki[b], disertai rombongan yang sangat besar dan unta-unta yang mengangkut rempah-rempah, emas dalam jumlah besar, serta batu-batu berharga. Ketika ia datang kepada Salomo, ia berbicara dengannya tentang segala sesuatu yang ada dalam hatinya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendengar tentang kemasyhuran Salomo.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan pertanyaan-pertanyaan sulit.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani “segala sesuatu yang ada dalam hatinya” mencakup seluruh pikiran, pertanyaan, dan hal yang menjadi perhatiannya.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: kabar tentang
  rationale: Dalam ungkapan ini, nomina tersebut menunjuk pada kabar atau laporan mengenai Salomo yang telah tersebar. “Kabar tentang Salomo” alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya menjadi kemasyhuran.
- source_word: לְנַסּוֹת
  choice: untuk menguji
  rationale: Infinitif ini menyatakan maksud sang ratu untuk menguji kemampuan Salomo, khususnya melalui teka-teki.
- source_word: בְחִידוֹת
  choice: dengan teka-teki
  rationale: חִידוֹת berarti teka-teki, perkataan penuh rahasia, atau persoalan yang sukar. “Teka-teki” mempertahankan kekonkretan istilah Ibrani.
- source_word: בִּירוּשָׁלִַם
  choice: ke Yerusalem
  rationale: Walaupun preposisi Ibrani secara harfiah dapat berarti “di”, bersama verba gerak “datang” frasa ini secara alami menyatakan tujuan perjalanan.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: disertai rombongan yang sangat besar
  rationale: חַיִל dapat berarti kekuatan, kekayaan, pasukan, atau rombongan. Konteks perjalanan kerajaan beserta unta dan barang mewah paling mendukung arti rombongan pengiring yang besar.
- source_word: בְּשָׂמִים
  choice: rempah-rempah
  rationale: Bentuk jamak ini menunjuk pada bahan-bahan harum atau rempah, cocok dengan konteks barang berharga kerajaan.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Ungkapan ini menunjukkan banyaknya emas dan diterjemahkan secara alami sebagai kuantitas yang besar.
- source_word: אֶבֶן יְקָרָה
  choice: batu-batu berharga
  rationale: Walaupun berbentuk tunggal dalam bahasa Ibrani, ungkapan ini dapat berfungsi kolektif dalam daftar barang mewah.
- source_word: וַתָּבוֹא אֶל שְׁלֹמֹה
  choice: ketika ia menghadap Salomo
  rationale: Secara harfiah berarti “ia datang kepada Salomo”. Dalam konteks perjumpaan resmi dengan raja, “menghadap Salomo” merupakan ungkapan Indonesia yang alami tanpa mengubah tindakan pokok.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: ia membicarakan dengannya
  rationale: דבר dengan עִם menandakan berbicara bersama seseorang. Dalam gabungan dengan objek berikutnya, “membicarakan dengannya” menyampaikan percakapan mengenai seluruh isi hatinya.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: segala sesuatu yang ada dalam hatinya
  rationale: Terjemahan ini mempertahankan citra antropologis Ibrani tentang hati sebagai pusat pikiran, maksud, pertanyaan, dan keprihatinan.
