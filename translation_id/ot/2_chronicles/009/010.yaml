base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: id
  text: Selain itu, para pelayan Hiram dan para pelayan Salomo, yang membawa emas dari Ofir, juga membawa kayu algum[a] dan batu-batu berharga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis kayu yang dimaksud oleh istilah Ibrani ini tidak diketahui dengan pasti; istilah ini juga diterjemahkan “kayu almug”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “batu berharga”; bentuk tunggal dalam bahasa Ibrani kemungkinan dipakai secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Juga
  rationale: Partikel ini menambahkan informasi pada kisah sebelumnya. Dalam bahasa Indonesia modern, “Juga” secara alami menyampaikan fungsi aditif tanpa perlu meniru dua unsur Ibrani secara kaku.
- source_word: עַבְדֵי חירם וְעַבְדֵי שְׁלֹמֹה
  choice: para pelayan Hiram dan para pelayan Salomo
  rationale: Dalam konteks kerajaan dan pelayaran ini, עבד paling wajar menunjuk kepada orang-orang yang mengabdi atau bekerja bagi raja. Pengulangan frasa dipertahankan untuk mencerminkan kesejajaran teks Ibrani.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: yang membawa emas dari Ofir
  rationale: Klausa relatif ini mengidentifikasi para pelayan tersebut. Bentuk lampau tidak perlu ditandai secara khusus dalam bahasa Indonesia karena urutan narasi dan konteks sudah menjelaskannya.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: kayu algum
  rationale: Jenis pohon yang dimaksud tidak dapat dipastikan. Transliterasi “algum” mempertahankan istilah sumber dan menghindari identifikasi botani yang terlalu pasti.
- source_word: וְאֶבֶן יְקָרָה
  choice: dan batu-batu berharga
  rationale: Walaupun אֶבֶן berbentuk tunggal, kata itu kemungkinan digunakan secara kolektif dalam daftar muatan. Bentuk jamak alami dalam bahasa Indonesia.
