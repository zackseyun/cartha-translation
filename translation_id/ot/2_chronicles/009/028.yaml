translation:
  language: id
  text: Mereka mendatangkan kuda dari Mesir dan dari segala negeri untuk Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka membawa keluar kuda dari Mesir untuk Salomo, dan dari segala negeri.” Kata kerja Ibrani secara harfiah berarti “menyebabkan keluar” atau “membawa keluar”, tetapi dalam konteks ini mengacu pada pemasokan melalui perdagangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: Mereka mendatangkan
  rationale: Bentuk partisipel Hifil jamak dari יצא secara harfiah berarti ‘membawa keluar’ atau ‘menyebabkan keluar’. Dalam konteks perdagangan dan pemasokan kuda kepada Salomo, ‘mendatangkan’ menyampaikan perpindahan dari negeri asal kepada penerima secara alami dalam bahasa Indonesia, sedangkan ‘mereka’ mempertahankan bentuk aktif jamak yang pelakunya tidak disebutkan.
- source_word: סוּסִים
  choice: kuda
  rationale: Padanan langsung untuk nomina jamak ‘kuda’; dalam bahasa Indonesia bentuk tanpa pengulangan sudah dapat menyatakan jenis atau jumlah jamak sesuai konteks.
- source_word: מִ/מִּצְרַיִם
  choice: dari Mesir
  rationale: Preposisi מן menandai sumber atau asal kuda-kuda tersebut.
- source_word: לִ/שְׁלֹמֹה
  choice: untuk Salomo
  rationale: Preposisi ל dapat berarti ‘kepada’ atau ‘untuk’. Dalam konteks pemasokan dagang, ‘untuk Salomo’ secara alami menyatakan penerima atau pihak yang memperoleh manfaat.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: dan dari segala negeri
  rationale: Frasa כָּל dengan bentuk jamak אֶרֶץ menunjuk pada berbagai wilayah atau negeri. ‘Segala negeri’ mempertahankan keluasan ungkapan Ibrani tanpa membatasinya pada konsep negara modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan ‘untuk Salomo dari Mesir’ mengikuti hubungan sintaksis sumber dan penerima dalam bahasa Ibrani, sementara ‘mendatangkan’ lebih mudah dipahami oleh pembaca umum daripada istilah teknis ‘mengimpor’.
