  text: וַ/יַּ֨עַשׂ הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מָאתַ֥יִם צִנָּ֖ה זָהָ֣ב שָׁח֑וּט שֵׁ֤שׁ מֵאוֹת֙ זָהָ֣ב שָׁח֔וּט יַעֲלֶ֖ה עַל הַ/צִּנָּ֥ה הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: id
  text: Raja Salomo membuat dua ratus perisai besar dari emas tempaan; enam ratus syikal[a] emas tempaan digunakan untuk setiap perisai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “enam ratus emas tempaan digunakan untuk setiap perisai.” Satuan berat tidak disebutkan; “syikal” ditambahkan untuk memperjelas maksudnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה secara umum berarti 'membuat/melakukan'; 'membuat' alami dan tepat dalam konteks inventaris ini.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Bentuk ini merupakan ungkapan gelar dan nama yang alami dalam bahasa Indonesia.
- source_word: מָאתַיִם
  choice: dua ratus
  rationale: Padanan langsung bagi bilangan tersebut.
- source_word: צִנָּה
  choice: perisai besar
  rationale: צִנָּה biasanya menunjuk pada perisai besar yang melindungi tubuh, berbeda dari jenis perisai yang lebih kecil.
- source_word: זָהָב שָׁחוּט
  choice: emas tempaan
  rationale: שָׁחוּט menggambarkan emas yang dikerjakan dengan ditempa atau dipipihkan; 'emas tempaan' ringkas dan wajar dalam bahasa Indonesia.
- source_word: שֵׁשׁ מֵאוֹת
  choice: enam ratus
  rationale: Padanan langsung bagi frasa bilangan tersebut.
- source_word: יַעֲלֶה עַל
  choice: digunakan untuk
  rationale: Secara harfiah jumlah emas itu 'naik ke/di atas' perisai; dalam konteks pembuatan, ungkapan ini menyatakan banyaknya emas yang dipakai pada setiap perisai tanpa memastikan teknik pelapisannya.
- source_word: הַצִּנָּה הָאֶחָת
  choice: setiap perisai
  rationale: Secara harfiah 'perisai yang satu'; dalam konstruksi distributif, bahasa Indonesia secara alami memakai 'setiap perisai'.
- source_word: '[satuan tersirat setelah שֵׁשׁ מֵאוֹת]'
  choice: syikal
  rationale: Teks Ibrani tidak menyebut satuan berat secara eksplisit. 'Syikal' menjelaskan satuan yang dipahami dari konteks dan tradisi tekstual paralel, sementara catatan kaki menjaga transparansi.
