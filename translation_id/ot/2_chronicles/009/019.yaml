  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: id
  text: Di sana berdiri dua belas singa pada enam anak tangga itu,[a] di sebelah sini dan di sebelah sana. Yang seperti itu belum pernah dibuat untuk kerajaan mana pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dua belas singa berdiri di sana pada enam anak tangga itu, satu pada setiap sisi setiap anak tangga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: dua belas patung singa
  rationale: Dalam konteks takhta, singa-singa ini merupakan figur atau pahatan, bukan hewan hidup. Kata “patung” memperjelas konteks tanpa mengubah acuannya.
- source_word: עֹמְדִים שָׁם
  choice: Di sana berdiri
  rationale: Partisip Ibrani menggambarkan keadaan atau posisi dalam adegan; susunan ini alami dalam bahasa Indonesia dan mempertahankan unsur lokatif.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: pada keenam anak tangga itu
  rationale: מַעֲלוֹת menunjuk pada anak-anak tangga menuju takhta. “Pada” mempertahankan gambaran bahwa figur-figur itu ditempatkan pada atau di sepanjang tangga.
- source_word: מִזֶּה וּמִזֶּה
  choice: di sebelah sini dan di sebelah sana
  rationale: Ungkapan distributif ini menunjukkan penempatan pada kedua sisi. Terjemahan konkret ini juga mempertahankan kemungkinan sintaksis mengenai pembagian kedua belas singa.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Yang seperti itu belum pernah dibuat
  rationale: Bentuk pasif dan כֵן menyatakan bahwa benda sebanding tidak pernah dibuat; “belum pernah” menyampaikan daya keunikan ungkapan itu secara wajar.
- source_word: לְכָל מַמְלָכָה
  choice: untuk kerajaan mana pun
  rationale: Frasa ini membandingkan takhta tersebut dengan milik kerajaan-kerajaan lain secara umum; “mana pun” tepat menyampaikan cakupan tak tentu.
