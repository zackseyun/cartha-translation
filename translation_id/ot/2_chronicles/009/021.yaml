  text: כִּֽי אֳנִיּ֤וֹת לַ/מֶּ֨לֶךְ֙ הֹלְכ֣וֹת תַּרְשִׁ֔ישׁ עִ֖ם עַבְדֵ֣י חוּרָ֑ם אַחַת֩ לְ/שָׁל֨וֹשׁ שָׁנִ֜ים תָּב֣וֹאנָה אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ נֹֽשְׂאוֹת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קוֹפִ֖ים וְ/תוּכִּיִּֽים־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: id
  text: Sebab raja mempunyai kapal-kapal yang berlayar ke Tarsis bersama para pegawai Huram. Setiap tiga tahun sekali kapal-kapal Tarsis itu datang membawa emas, perak, gading, kera, dan burung merak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “burung nuri”; identitas hewan yang dimaksud oleh istilah Ibrani ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan tentang kekayaan Salomo dalam konteks sebelumnya; “sebab” mempertahankan hubungan wacana tersebut secara alami.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: raja mempunyai kapal-kapal
  rationale: Frasa berpreposisi yang secara harfiah berarti kapal-kapal “bagi/milik raja” diungkapkan sebagai kepemilikan dalam bahasa Indonesia yang wajar.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: yang berlayar ke Tarsis
  rationale: Partisip dengan nama tempat paling alami menunjukkan pelayaran menuju Tarsis; “berlayar” lebih tepat daripada sekadar “pergi” untuk kapal.
- source_word: עִם עַבְדֵי חוּרָם
  choice: bersama para pegawai Huram
  rationale: Dalam konteks kerajaan, עֲבָדִים menunjuk kepada orang-orang yang melayani Huram. “Pegawai” menyampaikan fungsi mereka tanpa menyiratkan bahwa status perbudakan sedang ditekankan.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: setiap tiga tahun sekali
  rationale: Ungkapan distributif ini diterjemahkan dengan idiom waktu bahasa Indonesia yang alami.
- source_word: תָּבֹאנָה
  choice: datang
  rationale: Bentuk imperfek menggambarkan tindakan yang berulang; keterangan “setiap tiga tahun sekali” sudah membuat sifat kebiasaan itu jelas.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: kapal-kapal Tarsis
  rationale: Frasa nominal tradisional ini dipertahankan dan dibedakan dari ungkapan verbal sebelumnya. Sebutan itu dapat berkaitan dengan jenis kapal atau jalur perdagangan Tarsis, bukan semata-mata asal kapal.
- source_word: נֹשְׂאוֹת
  choice: membawa
  rationale: Partisip ini menerangkan muatan yang secara berkala dibawa oleh kapal-kapal tersebut.
- source_word: זָהָב וָכֶסֶף
  choice: emas, perak
  rationale: Padanan langsung dan lazim bagi kedua komoditas tersebut.
- source_word: שֶׁנְהַבִּים
  choice: gading
  rationale: Istilah ini secara konvensional menunjuk kepada gading sebagai komoditas.
- source_word: וְקוֹפִים
  choice: kera
  rationale: Nama hewan ini dapat merujuk pada monyet atau kera. “Kera” dipilih sebagai istilah Indonesia yang lebih luas dan tidak terlalu menentukan spesies.
- source_word: וְתוּכִּיִּים
  choice: burung merak
  rationale: “Burung merak” adalah identifikasi tradisional dan kemungkinan yang kuat, tetapi nama hewan Ibrani ini tidak pasti; alternatifnya dicatat dalam catatan kaki.
