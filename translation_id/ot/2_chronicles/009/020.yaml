id: 2CH.9.20
reference: 2 Chronicles 9:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: id
  text: Semua perlengkapan minum Raja Salomo terbuat dari emas, dan semua perlengkapan di Rumah Hutan Lebanon[a] terbuat dari emas murni.[b] Pada zaman Salomo, perak sama sekali tidak dianggap bernilai.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Istana Hutan Lebanon”; ini adalah nama sebuah bangunan kerajaan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “emas tertutup”; ungkapan Ibrani yang biasanya dipahami sebagai emas murni atau emas yang dimurnikan.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “perak tidak dianggap sebagai apa pun pada zaman Salomo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: perlengkapan minum
  rationale: Kata כְּלֵי mencakup berbagai jenis benda atau perlengkapan, sedangkan מַשְׁקֵה menunjukkan kegunaannya untuk minum. Pilihan ini tidak mempersempit maknanya hanya menjadi cawan.
- source_word: זָהָב
  choice: emas
  rationale: Istilah bahan yang langsung dan jelas; pengulangannya dipertahankan dalam kedua klausa.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Rumah Hutan Lebanon
  rationale: Frasa ini merupakan nama sebuah bangunan kerajaan tertentu. 'Rumah' menerjemahkan בֵּית secara langsung, sedangkan kemungkinan fungsi bangunan itu sebagai istana dijelaskan dalam catatan kaki.
- source_word: זָהָב סָגוּר
  choice: emas murni
  rationale: Secara harfiah סָגוּר berarti 'tertutup', tetapi dalam gabungan ini merupakan ungkapan bagi emas berkualitas tinggi atau yang dimurnikan. 'Emas murni' menyampaikan maksudnya dengan wajar dalam bahasa Indonesia.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: perak sama sekali tidak dianggap bernilai
  rationale: Ungkapan Ibrani menyatakan bahwa perak tidak diperhitungkan sebagai sesuatu yang berarti. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada tidak berharganya perak pada masa itu.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: pada zaman Salomo
  rationale: Menerjemahkan ungkapan harfiah 'pada hari-hari Salomo' secara idiomatis tanpa membatasi maksudnya hanya pada aspek pemerintahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Nama bangunan dipertahankan sebagai nama diri, sementara ungkapan Ibrani yang kurang transparan dijelaskan melalui catatan kaki.
