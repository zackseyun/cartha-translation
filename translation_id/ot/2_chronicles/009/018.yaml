  to: Ada enam anak tangga menuju takhta itu[a], dan sebuah tumpuan kaki emas terpasang pada takhta itu. Pada kedua sisi tempat duduk itu terdapat sandaran tangan, dan dua singa berdiri di samping sandaran tangan itu.
