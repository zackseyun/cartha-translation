  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Susunan kalimat dipecah menjadi dua agar rincian arsitektural tetap jelas. Penanda catatan kaki [a] dicantumkan dalam teks utama.
