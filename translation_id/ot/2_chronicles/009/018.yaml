base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: id
  text: Ada enam anak tangga menuju takhta itu[a], dan sebuah tumpuan kaki emas terpasang pada takhta itu. Pada kedua sisi tempat duduk itu terdapat sandaran tangan, dan dua singa berdiri di samping sandaran tangan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “sebuah pelandaian atau tangga emas terpasang pada takhta itu.” Kata Ibrani כבשׁ juga dapat berarti “pelandaian” atau “tangga”; “tumpuan kaki” sesuai dengan konteks takhta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: anak tangga
  rationale: Dalam konteks arsitektur takhta, kata ini menunjuk pada tingkatan untuk naik menuju takhta. 'Anak tangga' alami dan jelas dalam bahasa Indonesia modern.
- source_word: כֶבֶשׁ
  choice: tumpuan kaki
  rationale: Dalam konteks kursi kerajaan, 'tumpuan kaki' paling sesuai sebagai perlengkapan takhta, meskipun secara leksikal kata ini juga mungkin menunjuk pada pelandaian atau tangga.
- source_word: מָאֳחָזִים
  choice: terpasang
  rationale: Bentuk partisip pasif ini menyatakan bahwa perlengkapan emas tersebut dilekatkan atau dipasang pada takhta.
- source_word: יָדוֹת
  choice: sandaran tangan
  rationale: Secara harfiah berarti 'tangan-tangan', tetapi dalam konteks perabot menunjuk pada bagian di kedua sisi tempat duduk untuk menyangga tangan.
- source_word: מִזֶּה וּמִזֶּה
  choice: di sisi kiri dan kanan
  rationale: Ungkapan ini menyatakan penempatan pada kedua sisi. Terjemahan ini alami dalam bahasa Indonesia dan memperjelas tata letaknya tanpa mengubah makna.
- source_word: מְקוֹם הַשָּׁבֶת
  choice: tempat duduknya
  rationale: Frasa ini secara harfiah mengacu pada tempat untuk duduk; dalam konteks takhta, 'tempat duduknya' merupakan padanan yang ringkas dan wajar.
- source_word: אֲרָיוֹת
  choice: singa
  rationale: Padanan langsung bentuk jamak Ibrani. Konteks mungkin menyiratkan patung singa, tetapi teks hanya menyebut singa sehingga terjemahan tidak memperinci lebih jauh.
- source_word: עֹמְדִים
  choice: berdiri
  rationale: Partisip ini menggambarkan posisi tegak kedua singa dan dapat diterjemahkan langsung secara alami.
- source_word: אֵצֶל
  choice: di samping
  rationale: Preposisi ini menyatakan kedekatan posisi; 'di samping' jelas dan sesuai dengan uraian tata letak takhta.
