base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: id
  text: Maka Raja Rehabeam membuat perisai-perisai dari perunggu sebagai pengganti perisai-perisai itu[b], lalu memercayakannya kepada para kepala pasukan pengawal[a] yang menjaga pintu masuk istana raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para pelari”, kemungkinan sebutan bagi para pengawal atau pesuruh kerajaan yang juga bertugas sebagai penjaga istana.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, perisai-perisai perunggu ini menggantikan perisai-perisai emas yang dirampas oleh Sisak (lihat ayat sebelumnya).
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Makna dasar עשה dalam konteks ini ialah membuat atau menghasilkan; 'membuat' alami dalam narasi Indonesia.
- source_word: תַּחְתֵּיהֶם
  choice: sebagai pengganti perisai-perisai itu
  rationale: תחת dengan sufiks menyatakan penggantian. Penyebutan ulang 'perisai-perisai' memperjelas rujukan tanpa mengubah makna.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: perisai-perisai dari perunggu
  rationale: נְחֹשֶׁת dapat berarti tembaga atau perunggu; dalam konteks persenjataan, 'perunggu' merupakan padanan yang paling mungkin.
- source_word: וְהִפְקִיד עַל יַד
  choice: lalu memercayakannya kepada
  rationale: Bentuk hifil פקד bersama idiom עַל יַד menyatakan penyerahan sesuatu ke dalam tanggung jawab atau pemeliharaan seseorang.
- source_word: שָׂרֵי הָרָצִים
  choice: para kepala pasukan pengawal
  rationale: שָׂרֵי menunjuk para pemimpin, sedangkan הָרָצִים secara harfiah berarti 'para pelari' tetapi dalam lingkungan kerajaan menunjuk korps pelari yang menjalankan fungsi pengawalan.
- source_word: הַשֹּׁמְרִים
  choice: yang menjaga
  rationale: Partisip ini menggambarkan tugas penjagaan yang berlangsung; 'yang menjaga' mempertahankan fungsi tersebut secara alami.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: pintu masuk istana raja
  rationale: פֶּתַח adalah bukaan atau pintu masuk, sedangkan 'rumah raja' dalam konteks ini merujuk pada kediaman atau istana kerajaan.
