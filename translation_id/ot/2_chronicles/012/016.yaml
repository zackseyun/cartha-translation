lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini menyampaikan formula kematian kerajaan dalam bahasa Indonesia yang wajar dan khidmat, sambil mempertahankan gambaran beristirahat serta hubungan dengan garis leluhur. Catatan kaki menjelaskan bentuk harfiah bahasa Ibrani.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk pasif ini mencerminkan verba pasif Ibrani dan merupakan padanan alami untuk pemakaman seseorang yang dihormati.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Ini adalah bentuk baku dan jelas untuk nama tempat tersebut dalam bahasa Indonesia.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Nama ini mengikuti bentuk Ibrani אֲבִיָּה dalam ayat ini dan ejaan Indonesia yang lazim.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Padanan langsung bagi keterangan hubungan ayah-anak dalam teks.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: menjadi raja menggantikan dia
  rationale: Frasa ini menyampaikan kenaikan takhta dan suksesi kerajaan secara alami dalam bahasa Indonesia, tanpa menyiratkan lebih dari teks sumber.
