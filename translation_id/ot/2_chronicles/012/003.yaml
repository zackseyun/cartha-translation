translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-historis. Ayat diawali dengan huruf kecil karena secara sintaksis melanjutkan keterangan tentang Sisak pada ayat sebelumnya. Istilah militer dibuat jelas tanpa mengubah 'orang-orang' menjadi 'tentara'. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
