  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: id
  text: dengan 1.200 kereta perang dan 60.000 prajurit berkuda, serta orang-orang yang datang bersamanya dari Mesir, yang tidak terhitung jumlahnya:[a] orang Libia, orang Suki,[b] dan orang Kush.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada jumlah bagi orang-orang itu”; maksudnya, mereka tidak terhitung banyaknya.
    reason: lexical_alternative
  - marker: b
    text: “Suki” adalah nama suatu kelompok bangsa yang identitas tepatnya tidak diketahui dengan pasti; nama Ibraninya juga dapat ditransliterasikan sebagai “Sukim”.
    reason: cultural_note
  - marker: c
    text: Atau “orang Etiopia”; “orang Kush” lebih langsung mencerminkan istilah etnis-geografis dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: dengan 1.200 kereta perang
  rationale: Prefiks ב pada bilangan menyatakan penyertaan pasukan. רֶכֶב dapat bersifat kolektif, tetapi bersama bilangan paling wajar diterjemahkan sebagai kereta perang yang dapat dihitung.
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: dan 60.000 pasukan berkuda
  rationale: פָּרָשִׁים menunjuk kepada para prajurit berkuda; 'pasukan berkuda' merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks militer.
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: Orang-orang ... tidak terhitung jumlahnya
  rationale: Terjemahan ini menyampaikan idiom Ibrani 'tidak ada jumlah bagi orang-orang itu' secara alami tanpa mengganti עָם dengan istilah yang lebih khusus seperti 'tentara'.
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: yang datang bersamanya dari Mesir
  rationale: Klausa relatif dan asal rombongan dipertahankan secara langsung dan alami.
- source_word: לוּבִים
  choice: orang Libia
  rationale: Nama kelompok ini lazim dihubungkan dengan bangsa Libia; bentuk 'orang Libia' jelas bagi pembaca Indonesia.
- source_word: סֻכִּיִּים
  choice: orang Suki
  rationale: Karena identitas tepat kelompok ini tidak pasti, namanya ditransliterasikan tanpa mengajukan identifikasi yang lebih khusus.
- source_word: וְכוּשִׁים
  choice: dan orang Kush
  rationale: '''Kush'' mempertahankan istilah etnis-geografis Ibrani dan menghindari penyamaan langsung yang mungkin anakronistis dengan Etiopia modern.'
