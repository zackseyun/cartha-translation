  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: id
  text: Ia melakukan yang jahat karena ia tidak menyiapkan hatinya[a] untuk mencari Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “menetapkan hatinya” atau “meneguhkan hatinya.”'
    reason: Rentang makna הֵכִין mencakup menyiapkan, menetapkan, dan meneguhkan. Catatan ini mempertahankan alternatif leksikal tanpa mengubah makna utama.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרָע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan ini menyatakan penilaian moral atas tindakan Rehabeam. Bentuk “apa yang jahat” alami dalam bahasa Indonesia dan tetap mencerminkan הָרָע.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi penilaian dalam klausa sebelumnya.
- source_word: לֹא הֵכִין לִבּוֹ
  choice: tidak mengarahkan hatinya
  rationale: Hifil הֵכִין dapat berarti mempersiapkan, meneguhkan, atau menetapkan. Dalam konstruksi dengan “hati” dan tujuan berikutnya, “mengarahkan hatinya” menyampaikan kesiapan serta ketetapan batin secara wajar dalam bahasa Indonesia.
- source_word: לִדְרוֹשׁ
  choice: untuk mencari
  rationale: דרשׁ dengan Allah sebagai objek mencakup tindakan berpaling kepada-Nya untuk mencari Dia, termasuk dalam kesetiaan dan permohonan petunjuk. “Mencari” mempertahankan keluasan makna itu.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian yang terdapat langsung dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Makna kegagalan batin Rehabeam
  choice: tidak mengarahkan hatinya untuk mencari Yahweh
  alternative: tidak mempersiapkan hatinya untuk mencari Yahweh
  rationale: Terjemahan utama menyatakan kurangnya ketetapan dan arah batin tanpa menentukan apakah kegagalan itu hanya persiapan awal atau sikap yang terus berlangsung. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menggunakan nama diri ilahi. “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar umum untuk Tuhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Hati” dipertahankan sebagai gambaran Ibrani tentang pusat kehendak dan niat, bukan dipersempit menjadi “pikiran”.
