  source_fidelity: Draf dengan tepat menerjemahkan וַיִּלְכֹּד sebagai “merebut,” עָרֵי הַמְּצֻרוֹת sebagai “kota-kota berbenteng,” dan לִיהוּדָה sebagai afiliasi/kepemilikan “milik Yehuda.” Namun, “tiba sampai di” tidak idiomatis dalam bahasa Indonesia. “Sampai ke Yerusalem” dengan aman mempertahankan fungsi עַד sebagai batas tujuan tanpa menambahkan bahwa kota itu dimasuki atau direbut.
