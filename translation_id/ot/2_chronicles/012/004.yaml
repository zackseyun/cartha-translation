translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Pronomina “Ia” mengikuti subjek dari konteks ayat sebelumnya. Ungkapan batas gerak dipertahankan agar teks tidak menyiratkan secara pasti bahwa Yerusalem dimasuki atau direbut.
