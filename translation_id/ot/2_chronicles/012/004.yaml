  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: id
  text: Ia merebut kota-kota berbenteng milik Yehuda, lalu sampai ke Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lalu maju sampai ke Yerusalem.” Secara harfiah, teks Ibrani berbunyi “lalu datang sampai ke Yerusalem,” yang menekankan bahwa ia mencapai Yerusalem setelah merebut kota-kota berbenteng Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: Ia merebut
  rationale: Kata kerja לכד dalam konteks peperangan berarti merebut atau menguasai dengan paksa. “Merebut” alami dalam bahasa Indonesia dan mempertahankan nuansa militer.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: kota-kota berbenteng
  rationale: Frasa ini secara langsung menunjuk pada kota-kota yang dilindungi benteng. “Kota-kota berbenteng” lebih tepat daripada “benteng-benteng” karena עָרֵי secara eksplisit berarti kota-kota.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: milik Yehuda
  rationale: Preposisi ל menyatakan kepemilikan atau afiliasi. “Milik Yehuda” mempertahankan hubungan politik yang dinyatakan teks tanpa membatasinya hanya pada lokasi geografis.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: lalu tiba sampai di Yerusalem
  rationale: Gabungan בוא dengan עַד menunjukkan gerak hingga suatu batas. “Tiba sampai di Yerusalem” mempertahankan penekanan bahwa pasukan itu mencapai Yerusalem, tanpa memastikan bahwa ia memasuki atau merebut kota tersebut.
