id: 2CH.12.11
reference: 2 Chronicles 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: id
  text: Setiap kali raja masuk ke rumah Yahweh, para pengawal[a] datang membawa perisai-perisai itu[b], lalu mengembalikannya ke ruang para pengawal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “para pelari”, yaitu pasukan pengawal raja.'
    reason: lexical_alternative
  - marker: b
    text: Perisai-perisai itu ialah perisai-perisai perunggu yang disebut dalam ayat sebelumnya.
    reason: cross_reference
  - marker: c
    text: 'Atau: “bilik para pengawal” atau “ruang jaga”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: setiap kali ... masuk
  rationale: Ungkapan מִדֵּי + infinitif menyatakan kejadian berulang; bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna iteratif.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: בַּיִת secara harfiah berarti 'rumah' dan di sini menunjuk pada bait; mempertahankan ungkapan Ibrani tanpa mengaburkan acuannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: הָרָצִים
  choice: para pengawal
  rationale: Secara harfiah berarti 'para pelari', tetapi dalam konteks kerajaan istilah ini menunjuk pada satuan pengawal raja; fungsi tersebut paling jelas bagi pembaca modern.
- source_word: וּנְשָׂאוּם
  choice: membawa perisai-perisai itu
  rationale: Kata ganti objek mengacu pada perisai-perisai perunggu dalam ayat sebelumnya. Acuan dibuat eksplisit agar kalimat Indonesia jelas.
- source_word: וֶהֱשִׁיבוּם
  choice: mengembalikannya
  rationale: Bentuk Hifil dari שׁוב menyatakan bahwa benda-benda itu dibawa kembali ke tempat penyimpanannya.
- source_word: תָּא הָרָצִים
  choice: ruang para pengawal
  rationale: תָּא berarti ruang atau bilik; frasa genitif dipertahankan sehingga hubungan ruang itu dengan para pengawal tidak ditafsirkan lebih jauh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan tindakan berulang serta urutan tindakan dalam teks Ibrani. Acuan kata ganti diperjelas menjadi 'perisai-perisai itu' untuk kelancaran dan kejelasan.
