source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: id
  text: 'Kemudian nabi Semaya datang kepada Rehabeam dan para pemimpin Yehuda yang telah berkumpul di Yerusalem karena Sisak[a]. Ia berkata kepada mereka, “Beginilah firman Yahweh: Kalian telah meninggalkan Aku. Aku pun telah meninggalkan kalian ke dalam tangan Sisak.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari hadapan Sisak”; maksudnya dapat menunjuk pada ancaman Sisak atau rasa takut terhadapnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַעְיָה הַ/נָּבִיא
  choice: Kemudian Nabi Semaya
  rationale: Konjungsi waw melanjutkan alur kisah, sehingga 'Kemudian' wajar dalam narasi Indonesia. Gelar definit 'nabi' ditempatkan sebelum nama sesuai idiom Indonesia.
- source_word: בָּא אֶל
  choice: datang kepada
  rationale: Menyatakan kedatangan Semaya menghadap Rehabeam dan para pemimpin; bentuk ini alami dan dekat dengan struktur sumber.
- source_word: וְ/שָׂרֵי יְהוּדָה
  choice: dan para pemimpin Yehuda
  rationale: שָׂרִים menunjuk pejabat, penguasa, atau pemimpin. 'Para pemimpin' mempertahankan cakupan makna tanpa kesan bahwa mereka semua pangeran keturunan raja.
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: yang telah berkumpul di Yerusalem
  rationale: Bentuk Nifal menyatakan mereka berhimpun; 'telah berkumpul di' menyampaikan tindakan sebelumnya beserta lokasi akhirnya secara alami.
- source_word: מִ/פְּנֵי שִׁישָׁק
  choice: karena Sisak
  rationale: Secara harfiah frasa ini berarti 'dari hadapan Sisak', tetapi dalam konteks menyatakan sebab atau ancaman yang membuat mereka berkumpul. Ambiguitas nuansanya dicatat dalam catatan kaki.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Rumusan kenabian baku diterjemahkan dengan ungkapan Indonesia yang alami dan khidmat; nama ilahi dipertahankan sebagai Yahweh.
- source_word: עֲזַבְתֶּם אֹתִי
  choice: Kalian telah meninggalkan Aku
  rationale: עָזַב berarti meninggalkan atau menelantarkan. 'Meninggalkan' jelas bagi pembaca modern dan tetap memuat bobot ketidaksetiaan dalam konteks perjanjian.
- source_word: וְ/אַף אֲנִי עָזַבְתִּי אֶתְ/כֶם
  choice: Karena itu, Aku pun telah meninggalkan kalian
  rationale: '''Karena itu'' dan ''pun'' menyampaikan hubungan pembalasan yang sepadan. Verba yang sama diterjemahkan secara konsisten untuk mempertahankan simetri retoris.'
- source_word: בְּ/יַד שִׁישָׁק
  choice: ke dalam tangan Sisak
  rationale: Mempertahankan idiom Ibrani tentang penyerahan ke bawah kuasa seseorang, yang tetap dapat dipahami dalam bahasa Indonesia alkitabiah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan mengikuti bentuk yang paling luas diterima dalam kajian Ibrani.
- issue: Simetri tindakan meninggalkan antara umat dan Yahweh
  choice: Verba עָזַב diterjemahkan sama sebagai 'meninggalkan' pada kedua kemunculannya
  alternative: meninggalkan / menyerahkan
  rationale: Pengulangan sumber membentuk pernyataan penghakiman yang sengaja simetris. Terjemahan yang sama menjaga ketegangan bahwa Yahweh memperlakukan mereka selaras dengan tindakan mereka terhadap-Nya, tanpa menghapus perbedaan konteks.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. ''Kalian'' dipakai karena sapaan Ibrani berbentuk jamak dan ditujukan kepada Rehabeam beserta para pemimpin. Ejaan nama mengikuti bentuk Indonesia yang lazim: Semaya, Rehabeam, dan Sisak.'
