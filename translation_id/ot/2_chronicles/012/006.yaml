  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: id
  text: Lalu para pemimpin Israel[a] dan raja merendahkan diri serta berkata, “Yahweh itu adil.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “para pemimpin Israel”. Dalam konteks ini, sebagian orang memahami ungkapan tersebut sebagai sebutan khusus bagi para pemimpin Yehuda di bawah pemerintahan Rehabeam, tetapi teksnya sendiri menyebut “Israel”.'
    reason: Menjelaskan ketegangan antara sebutan dalam teks Ibrani dan konteks historis tanpa mengubah bunyi teks.
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: merendahkan diri
  rationale: Bentuk Nifal dari כנע di sini menyatakan tindakan merendahkan atau menundukkan diri sebagai tanggapan terhadap teguran kenabian. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa refleksifnya.
- source_word: שָׂרֵי
  choice: para pemimpin
  rationale: שָׂרִים menunjuk kepada para penguasa atau pejabat utama. “Para pemimpin” jelas, modern, dan sesuai dengan konteks tanpa membatasi maknanya pada gelar kebangsawanan tertentu.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani secara eksplisit menyebut “Israel”. Sebutan ini dipertahankan dan tidak diselaraskan menjadi “Yehuda”, meskipun konteks historisnya berkaitan dengan pemerintahan Rehabeam di Yehuda.
- source_word: וְהַמֶּלֶךְ
  choice: dan raja
  rationale: Terjemahan langsung yang membedakan raja dari para pemimpin yang disebut sebelumnya.
- source_word: וַיֹּאמְרוּ
  choice: serta berkata
  rationale: Kata kerja jamak ini melanjutkan urutan narasi dan mengacu kepada para pemimpin bersama raja. “Serta” menghindari rangkaian kata “dan” yang terasa berat dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: adil
  rationale: Dalam konteks pengakuan atas penghukuman ilahi, צַדִּיק menyatakan bahwa tindakan Yahweh benar dan sesuai dengan keadilan. “Adil” menyampaikan maksud ini dengan lebih jelas dalam bahasa Indonesia daripada “benar”, yang dapat dipahami sekadar sebagai tepat atau tidak keliru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi yang terdapat dalam teks sumber tetap dipertahankan.
theological_decisions:
- issue: Apakah nama ilahi dipertahankan atau diganti dengan gelar
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton יהוה secara langsung. “Yahweh” mempertahankan nama ilahi, bukan menggantinya dengan sebuah gelar.
- issue: Apakah “Israel” diselaraskan menjadi “Yehuda” berdasarkan konteks sejarah
  choice: Israel
  alternative: Yehuda
  rationale: Naskah Ibrani berbunyi “Israel”. Menggantinya dengan “Yehuda” akan menyelesaikan ketegangan historis melalui penafsiran yang tidak dinyatakan oleh teks.
- issue: Nuansa pengakuan צַדִּיק mengenai Yahweh
  choice: Yahweh itu adil
  alternative: Yahweh itu benar
  rationale: Konteksnya adalah pengakuan bahwa penghukuman Yahweh patut dan adil. Pilihan ini menyampaikan daya teologis pernyataan tersebut tanpa menambahkan alasan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nama “Israel”, nama ilahi “Yahweh”, dan ketegangan historis dalam teks sumber dipertahankan.
