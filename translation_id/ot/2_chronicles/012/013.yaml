  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: id
  text: Maka Raja Rehabeam mengukuhkan kedudukannya di Yerusalem dan memerintah.[a] Rehabeam berumur empat puluh satu tahun ketika mulai memerintah, dan ia memerintah selama tujuh belas tahun di Yerusalem, kota yang telah dipilih Yahweh dari antara semua suku Israel untuk menaruh nama-Nya di sana. Nama ibunya ialah Naama, seorang perempuan Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi kuat di Yerusalem dan memerintah.” Kata kerja Ibrani dapat berarti menjadi kuat atau menjadi kukuh dalam kedudukannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: mengukuhkan kedudukannya
  rationale: Bentuk hitpael dari חזק di sini menyatakan bahwa Rehabeam menjadi kuat atau mapan dalam kekuasaannya. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks konsolidasi pemerintahannya.
- source_word: וַיִּמְלֹךְ
  choice: dan memerintah
  rationale: Bentuk naratif ini melanjutkan tindakan sebelumnya tanpa harus ditafsirkan sebagai awal pemerintahannya.
- source_word: בְּמָלְכוֹ
  choice: ketika mulai memerintah
  rationale: Infinitif dengan ב menyatakan waktu naik takhta; terjemahan ini menyampaikan rumus usia raja secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: untuk menaruh nama-Nya di sana
  rationale: Terjemahan mempertahankan ungkapan konkret mengenai pemilihan Yerusalem tanpa mengembangkannya menjadi tafsiran tentang kehadiran atau kediaman ilahi.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari antara semua suku Israel
  rationale: Kata depan מן menyatakan pemilihan dari keseluruhan suku-suku Israel.
- source_word: הָעַמֹּנִית
  choice: seorang perempuan Amon
  rationale: Bentuk feminin nisbah ini menunjukkan asal etnis Naama dengan ungkapan Indonesia yang jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Ungkapan pemilihan tempat ibadah לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: untuk menaruh nama-Nya di sana
  alternative: untuk menghadirkan diri-Nya di sana
  rationale: Ungkapan sumber dipertahankan agar terjemahan tidak memasukkan penjelasan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mengukuhkan kedudukannya” dipilih agar nuansa konsolidasi kekuasaan terasa alami, sedangkan struktur pemberitahuan usia dan masa pemerintahan dibuat jelas bagi pembaca umum.
