reference: 2 Chronicles 12:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: id
  text: Ketika ia merendahkan diri, murka Yahweh pun surut darinya, sehingga Ia tidak membinasakan sampai tuntas.[a] Selain itu, di Yehuda terdapat hal-hal yang baik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan tidak membinasakan hingga tuntas.” Bahasa Ibrani tidak menyebutkan objek yang dibinasakan.
    reason: source_ambiguity
  - marker: b
    text: Ungkapan Ibrani “hal-hal yang baik” bersifat luas dan dapat merujuk pada keadaan, tindakan, atau perkara yang patut dipuji di Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: Ketika ia merendahkan diri
  rationale: 'Prefiks ב pada bentuk infinitif memberi makna waktu, sedangkan bentuk hitpael dari כנע bersifat refleksif: Rehabeam merendahkan dirinya, bukan sekadar dipermalukan.'
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: murka Yahweh pun surut darinya
  rationale: שׁוב dengan מִן menggambarkan murka yang berbalik atau menjauh. 'Surut darinya' wajar dalam bahasa Indonesia dan mempertahankan arah tindakan tanpa menafsirkannya lebih jauh sebagai perubahan keputusan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: sehingga Ia tidak membinasakan sampai tuntas
  rationale: Klausa ini menyatakan akibat atau tujuan dari surutnya murka. לְכָלָה menunjukkan kebinasaan yang menyeluruh; bahasa Ibrani tidak menyebutkan objek secara eksplisit, sehingga terjemahan juga tidak menambahkannya.
- source_word: וְגַם בִּיהוּדָה
  choice: Selain itu, di Yehuda
  rationale: וְגַם menambahkan keterangan lanjutan, dan בִּיהוּדָה paling alami dipahami secara lokatif.
- source_word: הָיָה דְּבָרִים טוֹבִים
  choice: terdapat hal-hal yang baik
  rationale: דְּבָרִים bersifat luas dan dapat menunjuk pada perkara, keadaan, tindakan, atau hal lain. 'Hal-hal yang baik' menjaga keluasan itu tanpa mempersempitnya menjadi kesalehan, perbuatan, atau keadaan tertentu.
theological_decisions:
- issue: Hubungan antara perendahan diri Rehabeam dan meredanya penghakiman ilahi
  choice: murka Yahweh pun surut darinya, sehingga Ia tidak membinasakan sampai tuntas
  alternative: Yahweh menyesal dan tidak membinasakannya sama sekali
  rationale: Teks menyatakan bahwa murka ilahi benar-benar mereda sebagai tanggapan atas kerendahan diri, tetapi tidak mengatakan bahwa seluruh akibat penghakiman dibatalkan. Terjemahan mempertahankan baik kenyataan murka maupun belas kasihan yang membatasi kehancuran.
- issue: Cakupan ungkapan tentang kebaikan di Yehuda
  choice: di Yehuda terdapat hal-hal yang baik
  alternative: keadaan di Yehuda baik
  rationale: Bahasa Ibrani sengaja luas. Terjemahan tidak memutuskan apakah yang dimaksud ialah tindakan terpuji, keadaan yang baik, kesetiaan, atau perkara positif lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Merendahkan diri' mudah dipahami serta tepat untuk tindakan refleksif Rehabeam. 'Murka ... surut' alami dalam bahasa Indonesia dan tidak menghapus gambaran arah dalam teks sumber. Struktur akhir sengaja tetap umum untuk menjaga ambiguitas דְּבָרִים טוֹבִים.
