  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: id
  text: Pada tahun kelima pemerintahan Raja Rehabeam, Sisak, raja Mesir, maju melawan Yerusalem karena mereka telah berlaku tidak setia terhadap TUHAN.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah tidak setia kepada TUHAN” atau “telah berbuat khianat terhadap TUHAN.” Kata kerja Ibrani ini menyatakan pelanggaran kesetiaan atau ketidaksetiaan dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: Pada tahun kelima pemerintahan Raja Rehabeam
  rationale: Ungkapan pembuka naratif dan penanggalan masa kerajaan dialihkan secara alami ke dalam bahasa Indonesia. Kata “pemerintahan” memperjelas bahwa yang dimaksud ialah tahun kelima masa kekuasaan Rehabeam.
- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  choice: maju menyerang Yerusalem
  rationale: Dalam konteks militer, konstruksi עָלָה עַל menyatakan gerakan bermusuhan melawan suatu tempat. “Maju menyerang” mempertahankan unsur gerakan dan tujuan militernya tanpa menyatakan bahwa kota itu sudah direbut.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: Sisak, raja Mesir
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, sedangkan rangkaian konstruksi diterjemahkan langsung.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memberikan alasan teologis bagi serangan tersebut, sehingga hubungan sebab-akibat dinyatakan dengan jelas.
- source_word: מָעֲלוּ
  choice: telah berlaku tidak setia
  rationale: Verba מעל menunjuk pada pelanggaran kepercayaan atau ketidaksetiaan, khususnya dalam hubungan perjanjian. Pilihan ini mempertahankan sifat aktif dan moral-relasional dari tindakan tersebut.
- source_word: בַּיהוָה
  choice: kepada TUHAN
  rationale: Dengan verba מעל, preposisi ב menandai pihak yang menjadi sasaran ketidaksetiaan. “Kepada TUHAN” merupakan ungkapan Indonesia yang alami; nama perjanjian יהוה ditampilkan menurut konvensi Indonesia sebagai “TUHAN”.
theological_decisions:
- issue: Penjelasan perjanjian bagi serangan Sisak
  choice: karena mereka telah berlaku tidak setia kepada TUHAN
  alternative: karena mereka telah berbuat khianat terhadap TUHAN / karena mereka telah melanggar kepercayaan terhadap TUHAN
  rationale: Teks Tawarikh menghubungkan peristiwa politik itu secara langsung dengan ketidaksetiaan umat kepada יהוה. Terjemahan mempertahankan hubungan sebab-akibat dan dimensi perjanjian tanpa mempersempitnya menjadi istilah hukum atau doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan penanggalan kerajaan, gerakan militer, dan penjelasan teologis teks sumber.
