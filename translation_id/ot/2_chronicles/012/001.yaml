  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: id
  text: Setelah Rehabeam meneguhkan kerajaannya dan menjadi kuat, ia meninggalkan hukum[a] Yahweh—dan seluruh Israel bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran Yahweh” atau “petunjuk Yahweh.” Kata Ibrani torah dapat berarti “hukum,” “ajaran,” atau “petunjuk,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Bentuk naratif ini memperkenalkan keadaan waktu; bahasa Indonesia alami cukup memakai “Ketika” tanpa menerjemahkan secara kaku sebagai “terjadilah ketika”.
- source_word: כְּהָכִין מַלְכוּת רְחַבְעָם
  choice: kerajaan Rehabeam telah kokoh
  rationale: כּוּן dalam konteks kerajaan menunjuk pada keadaan yang sudah ditegakkan atau mantap. “Telah kokoh” menyampaikan konsolidasi pemerintahan secara alami, sedangkan מַלְכוּת tetap diterjemahkan “kerajaan”.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: וּכְחֶזְקָתוֹ
  choice: dan ia telah menjadi kuat
  rationale: Frasa ini bersifat temporal dan menunjuk kepada Rehabeam yang telah mencapai keadaan kuat; subjek pronominal dinyatakan agar jelas dalam bahasa Indonesia.
- source_word: עָזַב
  choice: meninggalkan
  rationale: Kata ini menyatakan tindakan berpaling atau menelantarkan kewajiban perjanjian. “Meninggalkan” jelas, wajar, dan tetap mempertahankan bobot tindakan tersebut.
- source_word: תּוֹרַת יְהוָה
  choice: hukum Yahweh
  rationale: Dalam konteks historis-perjanjian ini, תּוֹרָה dapat diterjemahkan “hukum”, tetapi nuansa “ajaran/petunjuk” tetap dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” sesuai bukti teks sumber.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: —dan seluruh Israel bersamanya
  rationale: Ungkapan ringkas ini menunjukkan bahwa seluruh Israel turut dalam tindakan Rehabeam. Tanda pisah mempertahankan daya tambahan frasa Ibrani tersebut.
theological_decisions:
- issue: Cakupan “seluruh Israel” pada masa kerajaan terbagi
  choice: seluruh Israel
  alternative: seluruh Yehuda; seluruh rakyatnya
  rationale: Teks Ibrani secara eksplisit memakai יִשְׂרָאֵל. Terjemahan tidak mempersempitnya menjadi Yehuda atau rakyat Rehabeam, sehingga ketegangan historis dan teologis dalam pemakaian istilah itu tetap terpelihara.
- issue: Makna תּוֹרָה
  choice: hukum
  alternative: ajaran; petunjuk; Taurat
  rationale: “Hukum” sesuai dengan konteks perjanjian dan mudah dipahami, sementara keluasan makna leksikal תּוֹרָה dijaga melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur temporal dibuat alami tanpa formula naratif yang kaku. Tanda pisah mempertahankan penekanan pada keterlibatan seluruh Israel.
