  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: id
  text: Lalu Sisak, raja Mesir, maju menyerang Yerusalem. Ia mengambil perbendaharaan Bait Yahweh[a] dan perbendaharaan istana raja[b]. Ia mengambil semuanya, juga perisai-perisai emas yang dibuat Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “rumah Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Harfiah: “rumah raja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: majulah ... menyerang Yerusalem
  rationale: Dalam konteks militer, עלה dengan עַל menyatakan gerak maju untuk menyerang suatu tempat. Ungkapan ini mempertahankan unsur gerak dalam bahasa Ibrani sekaligus menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: שִׁישַׁק
  choice: Sisak
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Frasa konstruksi ini secara langsung menyatakan jabatan dan wilayah kekuasaan Sisak.
- source_word: אֹצְרוֹת
  choice: segala harta
  rationale: Kata ini dapat menunjuk pada perbendaharaan, tempat penyimpanan, atau harta yang tersimpan. Dalam konteks penjarahan, 'segala harta dari' terdengar alami dan menonjolkan barang berharga yang dirampas tanpa menutup kemungkinan nuansa perbendaharaan.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan gambaran harfiah 'rumah' sebagai sebutan bagi bait, sementara catatan kaki memberi padanan fungsional yang lebih eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בֵּית הַמֶּלֶךְ
  choice: rumah raja
  rationale: Terjemahan harfiah ini mempertahankan kesejajaran dengan 'rumah Yahweh'; makna kontekstual 'istana kerajaan' dicatat sebagai alternatif.
- source_word: אֶת־הַכֹּל לָקָח
  choice: Semuanya diambilnya
  rationale: Susunan ini mempertahankan penekanan resumtif pada keseluruhan hasil rampasan dan terdengar wajar dalam narasi Indonesia.
- source_word: מָגִנֵּי הַזָּהָב
  choice: perisai-perisai emas
  rationale: Bentuk jamak dan bahan perisai dinyatakan secara langsung.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: yang telah dibuat Salomo
  rationale: Bentuk 'telah dibuat' memperjelas bahwa pembuatan perisai berlangsung sebelum penjarahan tanpa menambahkan pelaku lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Makna בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: Bait Yahweh
  rationale: Pilihan utama mempertahankan metafora dan kesejajaran leksikal teks Ibrani dengan 'rumah raja', sedangkan alternatif menjelaskan fungsi bangunan tersebut sebagai bait.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. Inversi ringan dalam 'majulah' dan 'diambilnya' dipakai untuk mempertahankan penekanan serta irama narasi Ibrani tanpa menjadi kuno. Penanda catatan kaki ditempatkan tepat pada frasa yang memiliki alternatif leksikal.
