  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: id
  text: 'Ketika Yahweh melihat bahwa mereka telah merendahkan diri, firman Yahweh datang kepada Semaya: “Mereka telah merendahkan diri. Aku tidak akan memusnahkan mereka, tetapi Aku akan memberi mereka sedikit kelepasan[a]. Murka-Ku tidak akan dicurahkan atas Yerusalem melalui tangan Sisak.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedikit kesempatan untuk lolos” atau “beberapa orang yang selamat.” Ungkapan Ibraninya padat dan mungkin menekankan penyelamatan yang terbatas, bukan pemusnahan total.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: Ketika ... melihat
  rationale: Preposisi ב pada infinitif konstruk ראה membentuk klausa waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נִכְנָעוּ
  choice: mereka telah merendahkan diri
  rationale: Bentuk nifal כנע dalam konteks ini menyatakan bahwa mereka menundukkan atau merendahkan diri sebagai tanggapan terhadap teguran kenabian.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: firman Yahweh datang kepada
  rationale: Mempertahankan rumusan kenabian Ibrani dengan ungkapan Indonesia yang jelas dan lazim.
- source_word: לֹא אַשְׁחִיתֵם
  choice: Aku tidak akan memusnahkan mereka
  rationale: Bentuk hifil שׁחת berarti menyebabkan kehancuran; 'memusnahkan' sesuai dengan konteks penghakiman.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: tetapi Aku akan memberi mereka sedikit kelepasan
  rationale: Ungkapan Ibrani ini padat dan dapat menunjuk pada kelepasan terbatas, kesempatan lolos, atau sejumlah orang yang selamat. 'Sedikit kelepasan' mempertahankan kepadatan serta ambiguitasnya; 'tetapi' menyatakan pertentangan yang tersirat oleh konteks.
- source_word: תִתַּךְ חֲמָתִי
  choice: Murka-Ku tidak akan dicurahkan
  rationale: Mempertahankan metafora Ibrani tentang murka sebagai sesuatu yang dicurahkan serta bentuk pasif kalimat sumber.
- source_word: בִּירוּשָׁלַם
  choice: atas Yerusalem
  rationale: Dalam idiom pencurahan murka, 'atas' secara alami menandai sasaran penghakiman.
- source_word: בְּיַד שִׁישָׁק
  choice: melalui tangan Sisak
  rationale: Mempertahankan ungkapan perantaraan atau sarana dalam bahasa Ibrani tanpa mengaburkan bahwa Sisak adalah pelakunya.
- source_word: שִׁישָׁק
  choice: Sisak
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan kelepasan dalam כִּמְעַט לִפְלֵיטָה
  choice: sedikit kelepasan
  alternative: sedikit kesempatan untuk lolos atau beberapa orang yang selamat
  rationale: Teks menyatakan pembatasan hukuman tanpa menjelaskan secara tegas apakah yang ditekankan ialah tindakan penyelamatan, peluang lolos, atau para penyintas; terjemahan utama dan catatan kaki mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur rumusan kenabian serta metafora pencurahan murka dipertahankan, sedangkan tanda baca disesuaikan agar dialog langsung mengalir alami. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan oleh catatan.
