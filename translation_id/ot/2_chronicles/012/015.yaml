  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: id
  text: Riwayat Rehabeam, dari awal sampai akhir, bukankah semuanya tertulis dalam catatan nabi Semaya dan pelihat Ido, menurut pencatatan silsilah[a]? Peperangan antara Rehabeam dan Yerobeam berlangsung terus-menerus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini sulit dipastikan. Frasa itu juga dapat berarti “dalam catatan silsilah” atau “untuk pencatatan silsilah” dan mungkin menjelaskan bentuk atau tujuan bahan sumber yang disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: Riwayat Rehabeam
  rationale: Dalam rumusan penutup pemerintahan raja, דִבְרֵי menunjuk pada perbuatan dan peristiwa selama pemerintahannya, bukan hanya perkataannya. “Riwayat” wajar dalam bahasa Indonesia dan cocok dengan konteks historiografis.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: dari awal sampai akhir
  rationale: Ungkapan ini merangkum seluruh perjalanan pemerintahan Rehabeam. Bentuk idiomatis Indonesia ini menyampaikan cakupan yang sama tanpa kekakuan “yang pertama dan yang terakhir”.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: Mempertahankan pertanyaan retoris dalam rumusan rujukan sumber; “semuanya” memperjelas bahwa yang dimaksud ialah seluruh riwayat tadi.
- source_word: בְּדִבְרֵי
  choice: dalam catatan
  rationale: Di sini דִבְרֵי menunjuk pada bahan sumber tertulis. “Catatan” menyampaikan fungsi dokumenternya dengan alami.
- source_word: הַנָּבִיא
  choice: Nabi
  rationale: Padanan baku bagi נָבִיא; gelar ditempatkan sebelum nama menurut pemakaian Indonesia yang alami.
- source_word: הַחֹזֶה
  choice: pelihat
  rationale: Mempertahankan perbedaan istilah antara חֹזֶה dan נָבִיא, sekaligus menyatakan gelar profetik yang berkaitan dengan penglihatan.
- source_word: לְהִתְיַחֵשׂ
  choice: menurut pencatatan silsilah
  rationale: Bentuk ini berkaitan dengan pendaftaran atau penggolongan berdasarkan silsilah. Terjemahan utama mempertahankan hubungan umum itu, sementara catatan kaki mengakui ketidakpastian fungsi frasa tersebut.
- source_word: וּמִלְחֲמוֹת רְחַבְעָם וְיָרָבְעָם
  choice: Rehabeam dan Yerobeam terus berperang
  rationale: Teks Ibrani berbentuk frasa nominal, tetapi konteks mengandaikan predikasi. Bentuk verbal ini alami dalam bahasa Indonesia dan “terus” menyampaikan kesinambungan yang dijelaskan oleh frasa waktu berikutnya.
- source_word: כָּל הַיָּמִים
  choice: sepanjang hidup mereka
  rationale: Dalam konteks kedua raja, ungkapan ini berarti selama masa hidup atau pemerintahan mereka. Terjemahan mempertahankan idiom waktu tanpa membatasinya secara tidak perlu hanya pada masa pemerintahan.
