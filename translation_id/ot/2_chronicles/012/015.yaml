  to: Riwayat Rehabeam, dari awal sampai akhir, bukankah semuanya tertulis dalam catatan nabi Semaya dan pelihat Ido, menurut pencatatan silsilah[a]? Peperangan antara Rehabeam dan Yerobeam berlangsung terus-menerus.
