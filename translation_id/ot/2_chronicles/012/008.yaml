id: 2CH.12.8
reference: 2 Chronicles 12:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֥י יִהְיוּ ל֖/וֹ לַ/עֲבָדִ֑ים וְ/יֵדְעוּ֙ עֲב֣וֹדָתִ֔/י וַ/עֲבוֹדַ֖ת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: id
  text: Sebab mereka akan menjadi hambanya, supaya mereka mengenal pengabdian[a] kepada-Ku dan pengabdian kepada kerajaan-kerajaan berbagai negeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pengabdian” dapat mencakup ibadah dan pelayanan kepada Allah, tetapi juga kerja atau penghambaan kepada penguasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan tindakan Allah pada konteks sebelumnya.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: mereka akan menjadi hambanya
  rationale: Konstruksi היה + ל menyatakan keadaan menjadi, sedangkan עֲבָדִים di sini menunjuk pada ketundukan nyata kepada Sisak. 'Hamba' mempertahankan daya makna pelayanan dan perbudakan tanpa memakai istilah modern yang terlalu sempit.
- source_word: וְיֵדְעוּ
  choice: supaya mereka mengenal
  rationale: Bentuk ini dalam konteks dapat menyatakan tujuan atau hasil. 'Mengenal' mempertahankan ידע dan memungkinkan nuansa mengetahui melalui pengalaman.
- source_word: עֲבוֹדָתִי
  choice: pengabdian kepada-Ku
  rationale: '''Pengabdian'' mempertahankan cakupan עֲבוֹדָה yang dapat mencakup pelayanan, kesetiaan, dan ibadah, sekaligus terdengar alami dalam kontras ayat ini.'
- source_word: וַעֲבוֹדַת
  choice: dan pengabdian kepada
  rationale: Pengulangan 'pengabdian' mempertahankan permainan leksikal dan kesejajaran antara melayani TUHAN dan tunduk kepada kerajaan asing.
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: kerajaan-kerajaan berbagai negeri
  rationale: Ungkapan ini mempertahankan bentuk jamak dan menunjuk secara wajar kepada kerajaan-kerajaan asing dari berbagai negeri, tanpa memberi kesan universal seperti 'seluruh bumi'.
theological_decisions:
- issue: Apakah עֲבוֹדָה yang mengacu kepada Allah harus dipersempit menjadi 'ibadah'
  choice: pengabdian
  alternative: ibadah; pelayanan
  rationale: '''Pengabdian'' mempertahankan ketegangan antara ibadah dan kesetiaan/pelayanan kepada Allah serta menegaskan kesejajarannya dengan ketundukan kepada kerajaan-kerajaan dunia.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'hambanya' dipakai untuk ketundukan politik kepada Sisak, sedangkan pengulangan 'pengabdian' menjaga kesejajaran dan ambiguitas leksikal teks Ibrani.
