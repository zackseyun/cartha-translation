base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: id
  text: Asal kuda-kuda Salomo ialah Mesir dan Kue[a]; para saudagar raja memperolehnya dari Kue[b] dengan harga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan dari tempat pengumpulan.” Kata Ibrani מִקְוֵא sulit ditafsirkan dan dapat dipahami sebagai nomina umum, bukan sebagai nama tempat Kue.
    reason: alternative_reading
  - marker: b
    text: Atau, “para saudagar raja membelinya dari tempat pengumpulan dengan harga.” Terjemahan ini memahami מִקְוֵא sebagai tempat pengumpulan, bukan sebagai nama geografis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: Asal
  rationale: Kata מוֹצָא dapat menunjuk pada asal atau sumber. Dalam konteks perdagangan kuda, “asal” mempertahankan makna dasarnya tanpa mempersempitnya menjadi “impor”.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: kuda-kuda Salomo
  rationale: Ungkapan dengan לְ menyatakan kepunyaan atau hubungan; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: מִמִּצְרָיִם
  choice: Mesir
  rationale: Nama tempat yang baku dalam bahasa Indonesia.
- source_word: וּמִקְוֵא
  choice: dan Kue
  rationale: Bentuk yang sulit ini paling mungkin merupakan nama tempat yang sejajar dengan Mesir, meskipun kemungkinan sebagai nomina umum tetap dicatat dalam catatan kaki.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: para saudagar raja
  rationale: Partisip סֹחֲרֵי dipakai sebagai nomina bagi orang-orang yang berdagang; “saudagar” sesuai dengan konteks perdagangan dan bernada wajar serta bermartabat.
- source_word: מִקְוֵא
  choice: dari Kue
  rationale: Kemunculan kedua dipahami secara konsisten sebagai nama tempat yang sama, sambil tetap mengakui pembacaan alternatif dalam catatan kaki.
- source_word: יִקְחוּ
  choice: memperolehnya
  rationale: לקח secara harfiah berarti “mengambil”, tetapi dalam konteks transaksi “memperoleh” menyampaikan tindakan mendapatkan barang tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בִּמְחִיר
  choice: dengan membayar harganya
  rationale: Ungkapan ini menyatakan pemerolehan dengan pembayaran. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan unsur transaksi.
