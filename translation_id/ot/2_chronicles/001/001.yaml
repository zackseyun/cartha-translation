base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: id
  text: Salomo, anak Daud, makin kukuh dalam pemerintahannya[a]. Yahweh[b], Allahnya, menyertainya dan menjadikannya sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menjadi kuat atas kerajaannya”; dapat juga diterjemahkan “mengukuhkan dirinya atas kerajaannya” atau “menjadi teguh dalam pemerintahannya.”'
    reason: lexical_alternative
  - marker: b
    text: Nama ilahi dalam bahasa Ibrani adalah YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: makin kokoh
  rationale: Bentuk Hitpael dari חזק dapat menyatakan menjadi kuat atau menguatkan diri. “Makin kokoh” mempertahankan nuansa proses intransitif/refleksif tanpa menjadikannya pasif.
- source_word: עַל מַלְכוּתוֹ
  choice: memerintah kerajaannya
  rationale: עַל bersama מַלְכוּת menunjuk pada kedudukan atau wewenang atas kerajaan. Ungkapan ini mengalihkan metafora “atas” ke dalam bahasa Indonesia yang wajar sambil mempertahankan gagasan kekuasaan kerajaan.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomo anak Daud
  rationale: Terjemahan langsung yang mempertahankan hubungan keluarga sekaligus kesinambungan dinasti Daud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Bentuk posesif diterjemahkan langsung dan mempertahankan hubungan pribadi-perjanjian yang dinyatakan teks.
- source_word: עִמּוֹ
  choice: menyertai dia
  rationale: Ungkapan idiomatis ini menyatakan kehadiran dan perkenanan ilahi; “menyertai dia” alami dalam bahasa Indonesia.
- source_word: וַיְגַדְּלֵהוּ
  choice: menjadikan dia ... besar
  rationale: Bentuk Piel dengan akhiran objek menyatakan bahwa Yahweh menyebabkan Salomo menjadi besar; pilihan ini mempertahankan kausalitas tersebut.
- source_word: לְמָעְלָה
  choice: sangat
  rationale: Dalam konteks ini kata tersebut berfungsi secara adverbial untuk menguatkan tingkat kebesaran Salomo.
theological_decisions:
- issue: Penulisan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama pribadi YHWH. Transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Pelaku dalam pengokohan dan kebesaran Salomo
  choice: Mempertahankan pengokohan Salomo pada klausa pertama dan tindakan aktif Yahweh pada klausa kedua
  alternative: Menjadikan klausa pertama pasif sehingga seluruh pengokohan secara eksplisit dilakukan Allah
  rationale: Teks menempatkan proses Salomo menjadi kuat berdampingan dengan kehadiran dan tindakan Yahweh yang menjadikannya besar. Terjemahan tidak meleburkan kedua segi itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Makin kokoh memerintah” dipilih agar konstruksi Ibrani yang kaku tetap terbaca alami, sedangkan “menjadikan dia sangat besar” mempertahankan ungkapan teologis dan kausalitas teks sumber.
