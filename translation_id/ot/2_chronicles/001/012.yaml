  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַֽ/חָכְמָ֥ה וְ/הַ/מַּדָּ֖ע נָת֣וּן לָ֑/ךְ וְ/עֹ֨שֶׁר וּ/נְכָסִ֤ים וְ/כָבוֹד֙ אֶתֶּן לָ֔/ךְ אֲשֶׁ֣ר לֹא הָ֣יָה כֵ֗ן לַ/מְּלָכִים֙ אֲשֶׁ֣ר לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹ֥א יִֽהְיֶה כֵּֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: id
  text: Hikmat dan pengetahuan telah diberikan kepadamu, dan Aku akan memberikan kepadamu kekayaan, harta benda, dan kehormatan yang tidak pernah dimiliki raja-raja sebelum engkau dan tidak akan dimiliki raja-raja sesudah engkau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang tidak pernah demikian bagi raja-raja sebelum engkau, dan sesudah engkau tidak akan demikian.”'
    reason: Mempertahankan bentuk ungkapan Ibrani yang lebih harfiah dan ambiguitas gramatikalnya, sedangkan teks utama menyatakan perbandingan itu secara alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: hikmat
  rationale: Padanan baku dan wajar untuk חָכְמָה dalam konteks kemampuan yang dianugerahkan Allah.
- source_word: הַמַּדָּע
  choice: pengetahuan
  rationale: Mencerminkan arti מַדָּע dan mempertahankan pembedaan dari 'hikmat' tanpa menafsirkannya secara berlebihan.
- source_word: נָתוּן לָךְ
  choice: telah diberikan kepadamu
  rationale: Partisip pasif menyatakan keadaan sebagai hasil pemberian; bentuk ini alami dalam bahasa Indonesia dan menunjukkan bahwa anugerah itu telah ditetapkan atau diberikan.
- source_word: עֹשֶׁר
  choice: kekayaan
  rationale: Padanan modern dan jelas untuk kekayaan material, serta dapat dibedakan dari נְכָסִים.
- source_word: נְכָסִים
  choice: harta benda
  rationale: Menunjuk pada milik atau properti; 'harta benda' mudah dipahami dan tidak terlalu teknis.
- source_word: כָבוֹד
  choice: kehormatan
  rationale: Dalam konteks anugerah kerajaan, istilah ini menyatakan martabat atau kehormatan, bukan secara khusus kemuliaan ilahi.
- source_word: אֶתֶּן לָךְ
  choice: Aku akan memberikan kepadamu
  rationale: Bentuk imperfek menyatakan janji pemberian pada masa mendatang; kapitalisasi 'Aku' menandai bahwa pembicara adalah Allah.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ
  choice: yang tidak pernah dimiliki raja-raja sebelum engkau
  rationale: Mengungkapkan perbandingan Ibrani secara alami sambil mempertahankan kaitannya dengan anugerah yang baru disebutkan.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: dan tidak akan dimiliki raja-raja sesudah engkau
  rationale: Konteks menyiratkan bahwa pembandingnya tetap para raja dan hal yang dibandingkan adalah anugerah tersebut; pengulangan 'raja-raja' memperjelasnya dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan keunikan Salomo dalam perbandingan dengan raja-raja lain
  choice: Perbandingan dibatasi pada hikmat, pengetahuan, kekayaan, harta benda, dan kehormatan yang disebutkan dalam ayat.
  alternative: Pernyataan mutlak bahwa Salomo sendiri tidak tertandingi dalam segala hal oleh raja mana pun.
  rationale: Susunan ayat mengaitkan klausa perbandingan dengan pemberian-pemberian yang disebutkan, sehingga terjemahan tidak memperluas klaim melampaui cakupan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hikmat' dipertahankan sebagai istilah Alkitab yang luas dikenal; 'harta benda' dipakai agar berbeda dari 'kekayaan'. Pronomina 'engkau' sesuai dengan sapaan ilahi kepada seorang raja dan mempertahankan register khidmat.
