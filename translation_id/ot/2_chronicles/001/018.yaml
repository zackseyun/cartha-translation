  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה לִ/בְנ֥וֹת בַּ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: id
  text: Kemudian Salomo memutuskan[a] untuk membangun sebuah rumah bagi nama Yahweh dan sebuah rumah bagi kerajaannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berkata”. Dalam konstruksi ini, ungkapan Ibrani juga dapat dipahami sebagai “bermaksud” atau “memerintahkan”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebuah bait bagi nama Yahweh dan sebuah istana bagi kerajaannya”. Teks Ibrani mengulang kata yang secara harfiah berarti “rumah” dalam kedua bagian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... memutuskan
  rationale: Secara leksikal verba ini berarti “berkata”, tetapi ketika diikuti infinitif לִבְנוֹת, konteksnya dapat menyatakan keputusan atau maksud. “Memutuskan” menghasilkan bahasa Indonesia yang alami tanpa menutup alternatif “memerintahkan” atau terjemahan harfiah “berkata”.
- source_word: לִבְנוֹת
  choice: untuk membangun
  rationale: Infinitif konstruk dari בנה secara langsung berarti “membangun”; bentuk infinitif dipertahankan secara alami dalam bahasa Indonesia.
- source_word: בַּיִת ... וּבַיִת
  choice: sebuah rumah ... sebuah rumah
  rationale: Pengulangan kata Ibrani yang sama dipertahankan. Konteks menunjukkan bahwa rumah pertama adalah bait dan rumah kedua merupakan istana, tetapi pilihan utama tidak menghilangkan permainan pengulangan sumber.
- source_word: לְשֵׁם יְהוָה
  choice: bagi nama Yahweh
  rationale: Ungkapan khas mengenai bait ini dipertahankan agar hubungan tempat ibadah dengan nama ilahi tetap tampak, tanpa menyiratkan bahwa Allah dibatasi oleh bangunan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: לְמַלְכוּתוֹ
  choice: bagi kerajaannya
  rationale: מַלְכוּת dapat berarti kerajaan, kekuasaan kerajaan, atau pemerintahan. “Bagi kerajaannya” mempertahankan keluasan makna itu dan mengikuti hubungan sintaksis sumber.
theological_decisions:
- issue: Rumus bait yang memakai nama ilahi
  choice: bagi nama Yahweh
  alternative: untuk nama TUHAN
  rationale: Teks memakai nama יהוה secara langsung dan menghubungkan rumah itu dengan nama-Nya; rumusan tersebut dipertahankan tanpa menguraikan implikasi teologisnya.
- issue: Makna dua pemakaian בַּיִת
  choice: rumah ... rumah
  alternative: bait ... istana
  rationale: Pengulangan leksikal dalam bahasa Ibrani dipertahankan dalam teks utama, sedangkan fungsi khusus kedua bangunan dijelaskan sebagai alternatif dalam catatan kaki.
- issue: Daya ujar וַיֹּאמֶר sebelum infinitif
  choice: memutuskan
  alternative: berkata; memerintahkan; bermaksud
  rationale: Konstruksi ini dapat mengungkapkan keputusan atau perintah, sedangkan verba dasarnya berarti “berkata”. “Memutuskan” paling alami dalam konteks, tetapi ketaksaan yang nyata dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. Pengulangan “sebuah rumah” sengaja dipertahankan meskipun penyebutan kedua sedikit kurang idiomatis, karena pengulangan itu menonjol dalam sumber; catatan kaki menyediakan padanan fungsional yang lebih alami.
