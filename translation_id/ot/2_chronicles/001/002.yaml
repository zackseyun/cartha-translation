  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֣ה לְ/כָל יִשְׂרָאֵ֡ל לְ/שָׂרֵי֩ הָ/אֲלָפִ֨ים וְ/הַ/מֵּא֜וֹת וְ/לַ/שֹּֽׁפְטִ֗ים וּ/לְ/כֹ֛ל נָשִׂ֥יא לְ/כָל יִשְׂרָאֵ֖ל רָאשֵׁ֥י הָ/אָבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: id
  text: Lalu Salomo berbicara[a] kepada seluruh Israel—kepada para pemimpin pasukan seribu dan pasukan seratus, para hakim, dan setiap pemimpin di seluruh Israel, yaitu para kepala kaum keluarga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berkata”.
    reason: lexical_alternative
  - marker: b
    text: “Para kepala kaum keluarga” menunjuk para pemimpin kelompok kekerabatan atau rumah tangga menurut garis ayah. Frasa ini kemungkinan menjelaskan “setiap pemimpin di seluruh Israel”; susunannya juga dapat dipahami sebagai kelompok tambahan.
    reason: cultural_and_syntactic_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berbicara
  rationale: Bentuk dasarnya berarti “berkata”, tetapi dengan rangkaian pihak yang disapa, “berbicara kepada” lebih wajar dalam bahasa Indonesia dan tetap menyampaikan tindakan berupa penyampaian resmi.
- source_word: לְכָל יִשְׂרָאֵל
  choice: kepada seluruh Israel
  rationale: Mempertahankan sebutan kolektif bagi bangsa Israel, bukan mengubahnya menjadi penyebutan individual “semua orang Israel”.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: para pemimpin pasukan seribu dan pasukan seratus
  rationale: שָׂרֵי menunjuk para pejabat atau pemimpin; dalam konteks pembagian menurut seribu dan seratus, “pemimpin pasukan” menyampaikan kemungkinan kuat adanya satuan militer-administratif tanpa mengubah bilangannya.
- source_word: וְלַשֹּׁפְטִים
  choice: para hakim
  rationale: Padanan langsung bagi jabatan administratif yang berasal dari akar שׁפט.
- source_word: וּלְכֹל נָשִׂיא
  choice: dan setiap pemimpin
  rationale: נָשִׂיא dapat berarti pemimpin, kepala, atau penguasa. “Pemimpin” paling luas dan tidak menambahkan kesan bahwa mereka adalah putra raja.
- source_word: לְכָל יִשְׂרָאֵל
  choice: di seluruh Israel
  rationale: Dalam kemunculan kedua, frasa ini paling alami dipahami sebagai penjelas cakupan “setiap pemimpin” di antara seluruh Israel.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum leluhur
  rationale: Ungkapan ini menunjuk para kepala kelompok kekerabatan berdasarkan garis leluhur. “Kaum leluhur” lebih mudah dipahami daripada terjemahan harfiah “rumah-rumah para ayah”, sambil mempertahankan latar sosial patrilineal.
theological_decisions:
- issue: Hubungan רָאשֵׁי הָאָבוֹת dengan וּלְכֹל נָשִׂיא לְכָל יִשְׂרָאֵל
  choice: 'Diterjemahkan sebagai keterangan aposisi: “yaitu para kepala kaum leluhur”'
  alternative: 'Memahaminya sebagai kelompok tambahan: “dan para kepala kaum leluhur”'
  rationale: Teks Ibrani tidak memakai kata penghubung sebelum רָאשֵׁי הָאָבוֹת, sehingga frasa itu kemungkinan menjelaskan siapa “setiap pemimpin di seluruh Israel”. Kata “yaitu” membuat hubungan tersebut jelas, sementara catatan kaki mengakui bahwa susunannya juga dapat dipahami sebagai kelompok tersendiri.
- issue: Istilah kekerabatan הָאָבוֹת
  choice: kaum leluhur
  alternative: keluarga; puak-puak pihak ayah
  rationale: Pilihan ini mempertahankan sifat turun-temurun dan struktur sosial kuno tanpa memakai ungkapan Indonesia yang kaku atau mengimpor pengertian keluarga inti modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah menampilkan daftar sebagai perincian dari “seluruh Israel”. Istilah jabatan dibuat jelas bagi pembaca umum, sedangkan struktur sosial kuno dijelaskan melalui catatan kaki.
