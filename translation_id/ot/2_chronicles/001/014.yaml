  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: id
  text: Salomo mengumpulkan kereta perang dan para penunggang kuda[a]. Ia memiliki 1.400 kereta perang dan 12.000 penunggang kuda. Ia menempatkan semuanya di kota-kota kereta perang[b] dan bersama raja di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pasukan berkuda”. Istilah Ibrani ini menunjuk kepada orang-orang yang menunggang kuda; “para penunggang kuda” merupakan terjemahan yang lebih harfiah.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, kota-kota khusus tempat kereta perang disimpan atau ditempatkan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: Kata kerja אסף berarti mengumpulkan atau menghimpun; bentuk ini alami dalam bahasa Indonesia dan tidak menentukan cara pemerolehannya.
- source_word: רֶכֶב
  choice: kereta perang
  rationale: Dalam konteks kekuatan militer dan penghitungan 1.400 unit, istilah ini menunjuk pada kereta perang, bukan kendaraan secara umum.
- source_word: פָּרָשִׁים
  choice: para penunggang kuda
  rationale: Kata ini pada dasarnya menunjuk kepada orang-orang yang menunggang kuda. Pilihan ini lebih dekat dengan bahasa Ibrani daripada 'pasukan berkuda' dan tidak menyamakan mereka dengan kudanya.
- source_word: וַיְהִי לוֹ
  choice: Ia memiliki
  rationale: Ungkapan Ibrani harfiah 'ada baginya' menyatakan kepemilikan; 'ia memiliki' merupakan padanan Indonesia yang wajar.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1.400 kereta perang
  rationale: Angka dipertahankan secara tepat dengan tata tulis bilangan Indonesia.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12.000 penunggang kuda
  rationale: Angka dipertahankan secara tepat dengan tata tulis bilangan Indonesia.
- source_word: וַיַּנִּיחֵם
  choice: menempatkan mereka
  rationale: Bentuk kausatif ini berarti membuat berada atau menaruh di suatu tempat. 'Menempatkan' menjaga cakupan makna tanpa memaksakan nuansa teknis militer yang tidak dinyatakan secara eksplisit.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: di kota-kota kereta perang
  rationale: Konstruksi ini menunjuk kepada kota-kota yang dikhususkan bagi penyimpanan atau penempatan kereta perang; terjemahan ringkasnya dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: וְעִם הַמֶּלֶךְ
  choice: dan bersama raja
  rationale: Bahasa Ibrani hanya menyatakan 'dan bersama raja'. Terjemahan tidak menambahkan 'sebagian' walaupun pembagian itu tersirat oleh konteks.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Bentuk baku nama tempat dan preposisi dalam bahasa Indonesia.
