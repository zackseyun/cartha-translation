base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: id
  text: Mereka mendatangkan dari Mesir sebuah kereta perang seharga enam ratus syikal perak[a] dan seekor kuda seharga seratus lima puluh syikal. Demikian pula, melalui perantaraan mereka[b], kereta perang dan kuda itu diekspor kepada semua raja orang Het dan raja-raja Aram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka membawa naik dan membawa keluar dari Mesir sebuah kereta perang dengan enam ratus perak.” Dalam konteks ini, verba gerak tersebut menyatakan kegiatan perdagangan; “syikal” adalah satuan yang tersirat.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dengan tangan mereka,” yaitu melalui perantaraan mereka atau para agen mereka. Kata ganti “mereka” tidak menyebutkan pihak yang dirujuk secara tegas dalam ayat ini.'
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: “Aram”; secara tradisional juga disebut “Siria.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: Mereka mendatangkan dari Mesir
  rationale: Dua verba gerak, secara harfiah 'membawa naik dan membawa keluar', dipakai dalam konteks perdagangan. 'Mendatangkan dari Mesir' menyampaikan pergerakan barang tanpa memaksakan istilah teknis modern.
- source_word: מֶרְכָּבָה
  choice: sebuah kereta
  rationale: Dalam konteks perdagangan militer kerajaan, kata ini menunjuk pada kereta perang; bentuk ringkas 'kereta' alami dan sesuai konteks.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: dengan harga enam ratus syikal perak
  rationale: Teks menyebut enam ratus perak; 'syikal' dipasok sebagai satuan berat/nilai yang tersirat, sedangkan 'dengan harga' memperjelas rumus perdagangan.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: dan seekor kuda dengan harga seratus lima puluh syikal
  rationale: סוּס berarti kuda tanpa tuntutan untuk mempersempitnya menjadi kuda jantan. Satuan syikal diteruskan dari frasa harga sebelumnya agar jelas.
- source_word: וְכֵן
  choice: Demikianlah
  rationale: Penghubung ini meneruskan pola perdagangan yang sama kepada para raja asing.
- source_word: בְּיָדָם
  choice: melalui mereka
  rationale: Idiom 'dengan tangan mereka' menyatakan perantaraan atau keagenan; 'melalui mereka' mempertahankan unsur agen dengan bahasa Indonesia alami.
- source_word: יוֹצִיאוּ
  choice: didatangkan
  rationale: Verba ini secara harfiah berarti 'membawa keluar'. Dalam klausa tujuan dengan לְ, bentuk 'didatangkan bagi' menjaga arah penyaluran kepada para raja tanpa memasukkan istilah ekonomi modern secara berlebihan.
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: bagi semua raja orang Het dan raja-raja Aram
  rationale: Nama etnis dan wilayah dipertahankan sebagai Het dan Aram; לְ diterjemahkan 'bagi' karena dapat menyatakan penerima atau kepentingan mereka.
