id: 2CH.1.8
reference: 2 Chronicles 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: id
  text: Salomo berkata kepada Allah, “Engkau telah menunjukkan kasih setia yang besar[a] kepada Daud, ayahku, dan Engkau telah mengangkat aku menjadi raja menggantikan dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menunjukkan kebaikan yang besar” atau “telah menunjukkan kesetiaan yang besar.” Kata Ibrani חֶסֶד sering mencakup kasih, loyalitas, dan kesetiaan dalam suatu hubungan, termasuk hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia, urutan peristiwa sudah jelas tanpa harus menambahkan kata penghubung seperti “lalu”.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: אֱלֹהִים di sini menunjuk kepada Allah yang disapa Salomo; “kepada Allah” merupakan padanan langsung dan wajar.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: telah menunjukkan kasih setia yang besar kepada
  rationale: Ungkapan עשה עם + חֶסֶד menggambarkan tindakan yang lahir dari kasih, kesetiaan, dan komitmen relasional. “Kasih setia” merupakan ungkapan Indonesia yang alami dan mempertahankan keluasan makna חֶסֶד tanpa menjadikan unsur perjanjian lebih eksplisit daripada teks Ibrani.
- source_word: דָּוִיד אָבִי
  choice: Daud, ayahku
  rationale: Urutan ini mengikuti teks Ibrani, sedangkan koma membuat aposisi tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: וְהִמְלַכְתַּנִי
  choice: dan Engkau telah mengangkat aku menjadi raja
  rationale: Bentuk Hifil dari מלך menyatakan bahwa Allah menyebabkan Salomo menjadi raja. “Mengangkat aku menjadi raja” mempertahankan tindakan dan peranan aktif Allah secara jelas.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi kerajaan, תַּחְתָּיו berarti menduduki kedudukan orang sebelumnya. “Menggantikan dia” adalah ungkapan Indonesia yang ringkas dan alami tanpa menyiratkan perebutan kekuasaan.
theological_decisions:
- issue: Makna חֶסֶד dalam hubungan Allah dengan Daud
  choice: kasih setia
  alternative: kebaikan yang besar; kesetiaan pada perjanjian yang besar
  rationale: “Kasih setia” mempertahankan gabungan nuansa kasih, loyalitas, dan kesetiaan dalam חֶסֶד. Konteks hubungan Allah dengan Daud dapat mengandung dimensi perjanjian, tetapi teks ayat ini tidak memakai kata “perjanjian”; karena itu unsur tersebut tidak dibuat lebih eksplisit dalam teks utama.
- issue: Peranan Allah dalam suksesi Salomo
  choice: Engkau telah mengangkat aku menjadi raja menggantikan dia
  alternative: Engkau telah membuat aku memerintah sesudah dia
  rationale: Pilihan ini mempertahankan bentuk kausatif dan menegaskan bahwa Allah adalah pelaku yang menetapkan Salomo sebagai raja, tanpa menambahkan klaim teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan khidmat. Sapaan kepada Allah memakai “Engkau” untuk menjaga kejelasan rujukan dan kelaziman register Alkitabiah Indonesia.
