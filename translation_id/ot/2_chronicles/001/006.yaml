  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: id
  text: Salomo pergi ke sana, ke mezbah perunggu di hadapan Yahweh, yang ada di tempat Kemah Pertemuan, lalu mempersembahkan seribu kurban bakaran di atasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שְׁלֹמֹה שָׁם
  choice: Salomo pergi ke sana
  rationale: Kata kerja עלה secara harfiah menyatakan gerak naik, tetapi dalam bahasa Indonesia konteks ini paling alami diungkapkan dengan “pergi ke sana”; rujukan tempatnya adalah Gibeon dari konteks sebelumnya.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: mezbah perunggu
  rationale: נְחֹשֶׁת dapat menunjuk tembaga atau paduan tembaga; “perunggu” merupakan padanan baku dan mudah dikenali dalam konteks perlengkapan Kemah Suci.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan posisi atau kehadiran di hadapan seseorang, sedangkan nama ilahi dipertahankan sebagai nama diri Yahweh.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: yang berada di Kemah Pertemuan
  rationale: Prefiks לְ dipahami secara lokatif atau asosiatif; terjemahan ini menghubungkan mezbah tersebut dengan Kemah Pertemuan tanpa menambahkan lokasi yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: lalu mempersembahkan ... kurban bakaran di atasnya
  rationale: Pemakaian kedua עלה adalah ungkapan teknis persembahan; “mempersembahkan” menyampaikan fungsi kurban dengan alami, sementara עָלָיו dipertahankan sebagai “di atasnya”.
- source_word: עֹלוֹת אָלֶף
  choice: seribu kurban bakaran
  rationale: עֹלוֹת adalah bentuk jamak istilah kurban yang seluruhnya dibakar, dan אָלֶף secara langsung berarti seribu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi, sehingga “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Hubungan mezbah dengan Kemah Pertemuan
  choice: yang berada di Kemah Pertemuan
  alternative: yang merupakan milik Kemah Pertemuan
  rationale: Frasa Ibrani dengan לְ memungkinkan nuansa lokatif maupun asosiatif. Pilihan utama paling alami dalam bahasa Indonesia, tetapi tidak dimaksudkan untuk menetapkan rincian tata letak secara lebih sempit daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mezbah,” “Kemah Pertemuan,” dan “kurban bakaran” dipakai sebagai istilah keagamaan yang mapan; susunan kalimat dibuat lancar tanpa menghilangkan pengulangan lokasi dan objek mezbah dalam teks Ibrani.
