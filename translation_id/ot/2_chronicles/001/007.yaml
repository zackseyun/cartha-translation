base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: id
  text: Pada malam itu Allah menampakkan diri kepada Salomo dan berfirman kepadanya, “Mintalah apa yang akan Kuberikan kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Pada malam itu
  rationale: Ungkapan ini secara idiomatis menyatakan waktu tertentu dalam narasi. “Pada malam itu” alami dalam bahasa Indonesia dan tetap mempertahankan acuan waktunya.
- source_word: נִרְאָה
  choice: menampakkan diri
  rationale: Bentuk nifal dari ראה dalam konteks penampakan ilahi berarti bahwa Allah tampil atau memperlihatkan diri kepada Salomo. Pilihan ini lebih alami daripada bentuk pasif harfiah “terlihat” tanpa menambahkan cara penampakan yang tidak disebutkan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjukkan bahwa yang dimaksud adalah satu-satunya Allah. “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: לִשְׁלֹמֹה
  choice: kepada Salomo
  rationale: Preposisi ל menandai pihak yang mengalami penampakan tersebut.
- source_word: וַיֹּאמֶר לוֹ
  choice: dan berfirman kepadanya
  rationale: אמר berarti “berkata”; ketika Allah menjadi subjek, “berfirman” merupakan pilihan bahasa Indonesia yang wajar, khidmat, dan tidak mengubah isi ujaran.
- source_word: שְׁאַל
  choice: Mintalah
  rationale: Imperatif tunggal ini menyampaikan undangan langsung untuk meminta. Bentuk “mintalah” alami dan mempertahankan daya perintahnya.
- source_word: מָה אֶתֶּן לָךְ
  choice: apa yang harus Kuberikan kepadamu
  rationale: 'Dalam hubungan dengan imperatif sebelumnya, frasa ini wajar dipahami sebagai pertanyaan tak langsung: apa yang harus Allah berikan kepada Salomo. Bentuk alternatif yang lebih harfiah dengan kala mendatang dicatat dalam catatan kaki.'
theological_decisions:
- issue: Makna אֱלֹהִים dalam konteks penampakan ilahi
  choice: Allah
  alternative: allah-allah
  rationale: Kesesuaian dengan verba tunggal dan konteks narasi memastikan rujukan tunggal. Terjemahan ini mengikuti tata bahasa teks tanpa menambahkan uraian doktrinal.
- issue: Cara menyatakan bahwa Allah tampak kepada Salomo
  choice: menampakkan diri
  alternative: terlihat
  rationale: Pilihan ini menyampaikan fungsi nifal נִרְאָה dalam konteks teofani, tetapi tidak menentukan bentuk, sarana, atau hakikat penampakan yang tidak dijelaskan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berfirman” dipakai secara idiomatis untuk ujaran Allah. Huruf kapital pada “Kuberikan” mengikuti kebiasaan penulisan pronomina yang merujuk kepada Allah; “kepadamu” merujuk kepada Salomo sehingga tidak dikapitalisasi.
