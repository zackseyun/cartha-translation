  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת הַ/כֶּ֧סֶף וְ/אֶת הַ/זָּהָ֛ב בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: id
  text: Raja membuat perak dan emas di Yerusalem berlimpah seperti batu, dan membuat kayu aras berlimpah seperti pohon ara sikamor yang ada di Syefela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Syefela adalah kawasan kaki bukit Yehuda di antara daerah pegunungan dan dataran pesisir.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: membuat ... berlimpah / sebanyak
  rationale: 'Dalam konstruksi ini, נָתַן bermakna kausatif-resultatif: raja menyebabkan komoditas tersebut tersedia dalam jumlah luar biasa, bukan sekadar ''memberikan''.'
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: perak dan emas
  rationale: Nama komoditas dalam bahasa Indonesia alami tidak memerlukan penanda definit.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Frasa lokatif langsung.
- source_word: כָּאֲבָנִים
  choice: seperti batu
  rationale: Mempertahankan perbandingan Ibrani, sementara kata 'berlimpah' menjelaskan bahwa titik perbandingannya ialah jumlah.
- source_word: הָאֲרָזִים
  choice: kayu aras
  rationale: Dalam konteks kekayaan dan bahan bangunan kerajaan, bentuk jamak ini kemungkinan menunjuk pada persediaan kayu aras; 'kayu aras' alami dan jelas dalam bahasa Indonesia.
- source_word: כַּשִּׁקְמִים
  choice: sebanyak pohon ara hutan
  rationale: שִׁקְמָה menunjuk pada sycamore fig (Ficus sycomorus), bukan pohon sycamore Amerika; 'pohon ara hutan' merupakan nama Indonesia yang lebih tepat dan mudah dipahami.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: yang tumbuh di daerah perbukitan rendah
  rationale: שְׁפֵלָה menunjuk pada wilayah kaki bukit Yehuda di antara pegunungan dan dataran pesisir; terjemahan deskriptif ini menghindari kesan bahwa wilayah tersebut sepenuhnya datar.
- source_word: לָרֹב
  choice: sebanyak
  rationale: Mengungkapkan kelimpahan dengan menyatukannya secara alami ke dalam konstruksi perbandingan.
