  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: id
  text: Lalu Salomo dan seluruh umat yang menyertainya pergi ke tempat tinggi yang ada di Gibeon[a], sebab di sanalah terdapat Kemah Pertemuan Allah yang telah dibuat oleh Musa, hamba Yahweh, di padang belantara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “... ke tempat tinggi yang ada di Gibeon, karena Kemah Pertemuan Allah ada di sana.”'
    reason: Alternatif untuk penghubung כִּי dan susunan klausa alasan; keduanya menyatakan bahwa keberadaan Kemah Pertemuan di Gibeon menjadi alasan perjalanan itu.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan alur narasi; “pergi” menyampaikan gerak tanpa menambahkan arah yang tidak dinyatakan.
- source_word: הַקָּהָל
  choice: seluruh umat
  rationale: קהל menunjuk kepada komunitas yang berhimpun. “Umat” alami dalam konteks Israel dan mempertahankan makna kolektif tanpa istilah kelembagaan yang terlalu teknis.
- source_word: עִמּוֹ
  choice: yang menyertainya
  rationale: Menyampaikan hubungan komitatif dengan Salomo secara alami dalam bahasa Indonesia.
- source_word: לַבָּמָה
  choice: ke tempat pemujaan di bukit
  rationale: במה adalah tempat ibadah yang lazimnya berada di tempat tinggi. Pilihan ini lebih mudah dipahami pembaca modern daripada “tempat tinggi” dan tidak dengan sendirinya memberi penilaian negatif.
- source_word: בְּגִבְעוֹן
  choice: di Gibeon
  rationale: Nama tempat ditransliterasikan, sedangkan preposisi lokatif diterjemahkan secara wajar dengan “di”.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan mereka pergi ke Gibeon; “sebab” mempertahankan hubungan kausal dengan ragam bahasa yang bermartabat.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan langsung dan mapan bagi sebutan tempat kudus ini; kapitalisasi menandai nama fungsional bangunan tertentu.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Hubungan konstruksi dengan אֹהֶל מוֹעֵד dinyatakan secara langsung sebagai “Kemah Pertemuan Allah”.
- source_word: עָשָׂה
  choice: telah dibuat
  rationale: Menunjukkan bahwa pembuatan kemah mendahului peristiwa utama, tanpa mengubah arti dasar עשה.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Dalam gelar kehormatan bagi Musa, עבד paling alami diterjemahkan “hamba”, yang menekankan pengabdiannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk wilayah liar dan jarang dihuni; “padang belantara” alami dan tidak menyiratkan hanya gurun pasir.
theological_decisions:
- issue: Makna במה dalam konteks ibadah yang sah sebelum pembangunan Bait Allah
  choice: tempat pemujaan di bukit
  alternative: bukit pengurbanan; tempat tinggi
  rationale: Terjemahan mempertahankan sifat kultis istilah itu tanpa memasukkan kecaman teologis, sebab Kemah Pertemuan berada di Gibeon pada masa tersebut.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum, sementara istilah kultis במה dijelaskan secara transparan dan nama Yahweh dipertahankan.
