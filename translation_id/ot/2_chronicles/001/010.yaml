base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: id
  text: Sekarang, berikanlah kepadaku hikmat dan pengetahuan, supaya aku dapat keluar dan masuk di hadapan bangsa ini[a], sebab siapakah yang sanggup menghakimi umat-Mu yang besar ini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “keluar dan masuk di hadapan bangsa ini” menggambarkan pelaksanaan kepemimpinan di depan umum.
    reason: cultural_note
  - marker: b
    text: 'Atau: “bangsa-Mu yang besar ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Penanda wacana temporal yang membuka permohonan Salomo; padanan ini langsung dan alami dalam bahasa Indonesia.
- source_word: חָכְמָה וּמַדָּע
  choice: hikmat dan pengetahuan
  rationale: Mempertahankan dua istilah Ibrani yang berbeda. 'Hikmat' sesuai dengan konteks kecakapan memerintah, sedangkan 'pengetahuan' merupakan padanan langsung bagi מַדָּע.
- source_word: תֶּן לִי
  choice: berikanlah kepadaku
  rationale: Menyampaikan bentuk permohonan imperatif secara wajar dan bermartabat tanpa menambahkan makna.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: supaya aku dapat keluar dan masuk
  rationale: Bentuk kohortatif menyatakan tujuan permohonan. Ungkapan konkret Ibrani dipertahankan, sementara fungsi kepemimpinannya dijelaskan dalam catatan kaki.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: di hadapan bangsa ini
  rationale: לִפְנֵי secara harfiah berarti 'di hadapan/di depan'. 'Bangsa' cocok untuk kelompok nasional yang dipimpin Salomo.
- source_word: מִי יִשְׁפֹּט
  choice: siapakah yang sanggup menghakimi
  rationale: Pertanyaan retoris menyiratkan kemampuan, sehingga 'sanggup' dibuat eksplisit. 'Menghakimi' mempertahankan arti yudisial שׁפט, yang dalam konteks kerajaan juga mencakup pemerintahan.
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: umat-Mu yang besar ini
  rationale: '''Umat-Mu'' menunjukkan bahwa bangsa itu milik Allah; ''besar'' mempertahankan cakupan makna yang dapat menunjuk pada jumlah maupun keagungan, dan ''ini'' menerjemahkan penunjuk Ibrani.'
theological_decisions:
- issue: Ungkapan kepemimpinan dalam permohonan Salomo
  choice: Mempertahankan ungkapan 'keluar dan masuk di hadapan bangsa ini' serta menjelaskan fungsi idiomatisnya dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai 'memimpin bangsa ini' atau 'memerintah bangsa ini'.
  rationale: Bentuk ini menjaga gambaran dan ketegangan leksikal teks Ibrani tanpa mengaburkan bahwa ungkapan tersebut merujuk pada pelaksanaan kepemimpinan publik.
- issue: Cakupan kata שׁפט dalam konteks kerajaan
  choice: menghakimi
  alternative: memerintah
  rationale: '''Menghakimi'' mempertahankan arti dasar dan unsur penyelenggaraan keadilan, sementara konteks membiarkan pembaca memahami cakupan pemerintahan yang lebih luas tanpa mengganti istilah sumber dengan tafsiran.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'berikanlah' menyampaikan permohonan langsung dengan wajar; kapitalisasi pada '-Mu' mengikuti konvensi penghormatan kepada Allah. Idiom Ibrani dipertahankan dalam teks utama dan diterangkan secara ringkas dalam catatan kaki.
