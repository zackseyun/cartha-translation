  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: id
  text: Sekarang, ya Yahweh Allah, teguhkanlah perkataan-Mu[a] kepada Daud, ayahku, sebab Engkau telah mengangkat aku menjadi raja atas umat yang banyak seperti debu tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “biarlah perkataan-Mu kepada Daud, ayahku, diteguhkan”; dalam konteks ini, “perkataan-Mu” dapat dipahami sebagai “janji-Mu.”
    reason: Alternatif leksikal dan sintaktis untuk יֵאָמֵן דְּבָרְךָ; mempertahankan makna "perkataan" sambil menjelaskan nuansa janji dalam konteks.
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Mempertahankan penanda waktu sekaligus peralihan wacana yang membuka permohonan Salomo.
- source_word: יְהוָה אֱלֹהִים
  choice: ya Yahweh Allah
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהִים diterjemahkan 'Allah'; partikel 'ya' membuat sapaan doa ini alami dalam bahasa Indonesia.
- source_word: יֵאָמֵן
  choice: teguhkanlah
  rationale: Bentuk Nifal dari אמן menyatakan permohonan agar firman itu ditetapkan atau dibuktikan kokoh. Bentuk imperatif doa 'teguhkanlah' alami dan mempertahankan daya permohonannya.
- source_word: דְּבָרְךָ
  choice: perkataan-Mu
  rationale: Secara harfiah berarti 'perkataan-Mu'. Konteksnya memang janji, tetapi pilihan ini tidak mempersempit makna dalam teks utama.
- source_word: עִם דָּוִיד אָבִי
  choice: kepada Daud, ayahku
  rationale: Walaupun עִם biasanya berarti 'dengan', dalam konstruksi mengenai perkataan ilahi ungkapan ini menunjuk pada perkataan yang disampaikan kepada Daud.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar permohonan Salomo dan mempertahankan hubungan logis antarklausa.
- source_word: הִמְלַכְתַּנִי
  choice: Engkau telah mengangkat aku menjadi raja
  rationale: 'Bentuk Hifil dari מלך bersifat kausatif: Allah membuat Salomo menjadi raja. ''Mengangkat ... menjadi raja'' merupakan ungkapan Indonesia yang alami.'
- source_word: עַל עַם רַב
  choice: atas suatu bangsa yang banyaknya
  rationale: רַב di sini bernuansa jumlah karena langsung diikuti perbandingan dengan debu bumi.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: seperti debu di bumi
  rationale: Mempertahankan gambaran Ibrani yang menyatakan jumlah yang amat besar atau tak terhitung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Apakah דְּבָרְךָ perlu dieksplisitkan sebagai 'janji-Mu'
  choice: perkataan-Mu
  alternative: janji-Mu
  rationale: Konteks menunjuk pada janji Allah kepada Daud, tetapi kata Ibraninya secara lebih luas berarti 'perkataan'. Teks utama mempertahankan bentuk itu, sedangkan catatan menjelaskan nuansa janji.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Sapaan 'ya Yahweh Allah' sesuai dengan konteks doa; kapitalisasi pronomina ilahi dipakai sebagai konvensi penghormatan bahasa Indonesia. Catatan kaki [a] ditempatkan sesudah frasa yang dijelaskannya.
