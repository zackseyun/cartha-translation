  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲבָ֗ל אֲר֤וֹן הָ/אֱלֹהִים֙ הֶעֱלָ֤ה דָוִיד֙ מִ/קִּרְיַ֣ת יְעָרִ֔ים בַּֽ/הֵכִ֥ין ל֖/וֹ דָּוִ֑יד כִּ֧י נָֽטָה ל֛/וֹ אֹ֖הֶל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: id
  text: Namun, Daud telah membawa tabut Allah dari Kiryat-Yearim ke tempat yang telah disiapkannya bagi tabut itu[a], sebab ia telah mendirikan sebuah kemah bagi tabut itu di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kepada apa yang telah Daud siapkan baginya.” Ungkapan Ibraninya padat; maksudnya ialah bahwa Daud membawa tabut itu ke tempat yang telah disiapkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Namun
  rationale: 'Menandai kontras dengan ayat sebelumnya: mezbah perunggu berada di Gibeon, sedangkan tabut telah dipindahkan ke Yerusalem.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Padanan langsung dan lazim bagi frasa konstruksi Ibrani ini.
- source_word: הֶעֱלָה
  choice: telah membawa
  rationale: Bentuk Hifil menyatakan bahwa Daud membawa tabut; aspek lampau selesai sesuai dengan fungsi ayat ini sebagai latar bagi peristiwa sebelumnya.
- source_word: מִקִּרְיַת יְעָרִים
  choice: dari Kiryat-Yearim
  rationale: Nama tempat ditransliterasikan dengan bentuk yang jelas dan dekat dengan pelafalan Ibrani.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: ke tempat yang telah disiapkannya bagi tabut itu
  rationale: Ungkapan Ibrani ini padat dan eliptis. Penambahan 'tempat' menyatakan tujuan yang tersirat, sedangkan 'tabut itu' memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan penjelasan tentang tempat yang telah disiapkan Daud.
- source_word: נָטָה לוֹ אֹהֶל
  choice: ia telah mendirikan sebuah kemah bagi tabut itu
  rationale: נטה bersama אהל berarti memasang atau mendirikan kemah; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa lokatif langsung dengan ejaan nama tempat yang baku dalam bahasa Indonesia.
