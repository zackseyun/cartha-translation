  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: id
  text: Lalu Allah berfirman kepada Salomo, “Karena hal ini ada di dalam hatimu dan engkau tidak meminta kekayaan, harta benda, atau kehormatan, ataupun nyawa orang-orang yang membencimu,[a] dan engkau juga tidak meminta umur panjang,[b] melainkan meminta hikmat dan pengetahuan agar engkau menghakimi umat-Ku, yang telah Kuangkat engkau menjadi rajanya,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nyawa musuh-musuhmu”; secara harfiah, “nyawa orang-orang yang membencimu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “banyak hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Mempertahankan hubungan sebab yang memperkenalkan alasan bagi tanggapan Allah.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: hal ini ada dalam hatimu
  rationale: Mempertahankan gambaran Ibrani tentang maksud atau kecenderungan batin tanpa mempersempitnya menjadi sekadar keinginan.
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  choice: kekayaan, harta benda, atau kehormatan
  rationale: Membedakan kekayaan umum dari milik berwujud, sedangkan kehormatan menyatakan kedudukan dan penghargaan dalam konteks kerajaan.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: nyawa orang-orang yang membencimu
  rationale: Mengikuti bentuk tunggal kolektif dan partisip Ibrani secara dekat; maksudnya ialah nyawa mereka dapat diambil.
- source_word: יָמִים רַבִּים
  choice: umur panjang
  rationale: Ungkapan harfiah 'banyak hari' secara idiomatis berarti panjang umur; padanan ini alami dalam bahasa Indonesia, dengan bentuk harfiah dicatat.
- source_word: חָכְמָה וּמַדָּע
  choice: hikmat dan pengetahuan
  rationale: Mempertahankan pembedaan antara hikmat dan pengetahuan serta memakai istilah Indonesia yang jelas dan lazim.
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: agar engkau dapat menghakimi
  rationale: Menyatakan tujuan permintaan Salomo dan mempertahankan arti yudisial kata kerja, yang dalam konteks raja juga mencakup pelaksanaan pemerintahan.
- source_word: אֲשֶׁר הִמְלַכְתִּיךָ עָלָיו
  choice: yang atasnya Aku telah mengangkatmu menjadi raja
  rationale: Mencerminkan tindakan Allah menjadikan Salomo raja atas umat-Nya dan menjaga bentuk relatif sumber.
theological_decisions:
- issue: Sebutan bagi pembicara ilahi אֱלֹהִים
  choice: Allah
  alternative: TUHAN
  rationale: Teks sumber memakai אֱלֹהִים, bukan nama ilahi YHWH; karena itu 'Allah' dipakai.
- issue: Makna תִּשְׁפּוֹט dalam tugas kerajaan
  choice: menghakimi
  alternative: memerintah
  rationale: Pilihan utama mempertahankan arti langsung kata kerja Ibrani tanpa menyangkal bahwa penghakiman merupakan bagian dari pemerintahan raja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan daftar dibuat alami, sementara metafora hati, perbedaan hikmat dan pengetahuan, serta arti yudisial tugas raja dipertahankan.
