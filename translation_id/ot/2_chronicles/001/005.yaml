source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: id
  text: Mazbah perunggu yang dibuat Bezalel, anak Uri, anak Hur, telah ditempatkannya di depan Kemah Suci Yahweh; Salomo dan jemaah itu mencarinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencari-Nya.” Secara harfiah, “mencarinya”; akhiran kata ganti Ibrani itu dapat dipahami merujuk kepada mazbah perunggu atau kepada Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: Mazbah perunggu
  rationale: מִזְבַּח adalah tempat persembahan kurban, dan נְחֹשֶׁת dalam konteks perlengkapan ibadah paling tepat diterjemahkan 'perunggu'. 'Mazbah' merupakan istilah baku Alkitabiah dalam bahasa Indonesia dan tetap mudah dikenali.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang dibuat oleh
  rationale: Klausa relatif ini menerangkan mazbah. Bentuk pasif alami dalam bahasa Indonesia mempertahankan Bezalel sebagai pembuat tanpa susunan yang kaku.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Bezalel bin Uri bin Hur
  rationale: '''Bin'' menyampaikan rangkaian keturunan laki-laki secara ringkas dan wajar dalam bahasa Indonesia; nama-nama ditransliterasikan menurut bentuk yang lazim.'
- source_word: שָׂם
  choice: berada di sana
  rationale: 'Dalam konteks dan tradisi teks, bentuk ini dipahami secara lokatif: mazbah itu ada di tempat tersebut. Terjemahan ini menyatakan hasil keadaan tanpa menambahkan pelaku yang tidak disebutkan.'
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: di depan Kemah Suci Yahweh
  rationale: לִפְנֵי menyatakan lokasi, yakni 'di depan'. מִשְׁכָּן menunjuk pada tempat kediaman portabel untuk ibadah dan diterjemahkan dengan istilah Indonesia yang mapan, 'Kemah Suci'. Nama ilahi יְהוָה ditampilkan sebagai 'Yahweh'.
- source_word: וַיִּדְרְשֵׁהוּ
  choice: mencari-Nya
  rationale: דרשׁ dengan objek pronominal lazim dipakai untuk mencari atau datang menghadap Allah. Akhiran maskulin tunggal dipahami terutama sebagai rujukan kepada Yahweh, tetapi kemungkinan rujukan kepada mazbah dipertahankan dalam catatan kaki.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: Salomo dan jemaah itu
  rationale: קָהָל menunjuk pada komunitas yang berhimpun untuk ibadah. 'Jemaah itu' alami dalam bahasa Indonesia dan mempertahankan sifat definit dari bentuk Ibrani.
theological_decisions:
- issue: Rujukan akhiran pronominal pada וַיִּדְרְשֵׁהוּ
  choice: 'Akhiran dipahami merujuk kepada Yahweh: ''mencari-Nya''.'
  alternative: 'Akhiran dapat dipahami merujuk kepada mazbah perunggu: ''mencari mazbah itu''.'
  rationale: Pemakaian דרשׁ dalam Alkitab sering menjadikan Allah sebagai objek, dan penyebutan Yahweh tepat sebelumnya mendukung pembacaan ini. Namun, 'mazbah' juga merupakan nomina maskulin tunggal yang menonjol dalam kalimat, sehingga ambiguitas gramatikalnya tidak boleh dihapus dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar alurnya alami. Istilah ibadah yang sudah mapan, seperti 'mazbah' dan 'Kemah Suci', dipertahankan tanpa memakai bahasa denominatif.
