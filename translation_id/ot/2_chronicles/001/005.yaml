revisions:
- from: Mazbah perunggu yang dibuat oleh Bezalel bin Uri bin Hur berada di sana, di depan Kemah Suci Yahweh. Salomo dan jemaah itu mencari-Nya.[a]
  to: Mazbah perunggu yang dibuat Bezalel, anak Uri, anak Hur, telah ditempatkannya di depan Kemah Suci Yahweh; Salomo dan jemaah itu mencarinya.[a]
  rationale: Revisi memulihkan tindakan aktif “menempatkan” yang dinyatakan oleh שָׂם, memakai bentuk silsilah yang lebih langsung, dan menghindari kapitalisasi yang memutuskan rujukan pronominal yang diperdebatkan. Catatan kaki sekarang secara eksplisit menjaga kedua pembacaan yang mungkin.
