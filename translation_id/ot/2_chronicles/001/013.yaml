base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: id
  text: Kemudian Salomo kembali ke Yerusalem dari tempat tinggi di Gibeon, dari hadapan Kemah Pertemuan[a], lalu ia memerintah atas Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Susunan keterangan tempat dalam teks Ibrani padat: “Yerusalem” muncul tanpa kata depan sesudah “Gibeon.” Berdasarkan konteks, kalimat ini dipahami sebagai kepulangan Salomo dari tempat tinggi di Gibeon, dari hadapan Kemah Pertemuan, ke Yerusalem.'
    reason: textual_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kembali
  rationale: Kata בוא pada dasarnya berarti ‘datang, pergi, masuk’. Konteks menunjukkan bahwa sesudah pergi ke Gibeon, Salomo kembali ke Yerusalem; ‘kembali’ menyampaikan arah gerak itu secara alami dalam bahasa Indonesia.
- source_word: לַבָּמָה
  choice: di bukit pengurbanan
  rationale: במה menunjuk pada lokasi ibadah di tempat tinggi. ‘Bukit pengurbanan’ merupakan ungkapan Indonesia yang ringkas dan dikenal, tanpa memberi penilaian negatif yang tidak dinyatakan ayat ini.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: yang ada di Gibeon
  rationale: Menerjemahkan klausa relatif dan lokasi secara langsung serta alami.
- source_word: יְרוּשָׁלִַם
  choice: ke Yerusalem
  rationale: Dalam konteks, Yerusalem dipahami sebagai tujuan kepulangan Salomo, walaupun urutan kata Ibrani sangat padat dan sukar.
- source_word: מִלִּפְנֵי
  choice: dari hadapan
  rationale: Mempertahankan gambaran ruang dalam ungkapan Ibrani, yaitu berangkat dari kawasan di depan atau hadapan tempat suci.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan transparan dan lazim bagi אֹהֶל מוֹעֵד, yang mempertahankan bentuk ungkapan Ibrani.
- source_word: וַיִּמְלֹךְ
  choice: ia memerintah
  rationale: Dalam konteks ini Salomo sudah menjadi raja, sehingga bentuk verba tersebut paling wajar dipahami sebagai kelanjutan pemerintahannya, bukan penobatannya.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Mencerminkan konstruksi lazim מלך על, ‘memerintah atas’ suatu bangsa.
theological_decisions:
- issue: Hubungan sintaksis Yerusalem, bukit pengurbanan di Gibeon, dan Kemah Pertemuan
  choice: Salomo kembali ke Yerusalem dari hadapan Kemah Pertemuan yang berada di bukit pengurbanan di Gibeon
  alternative: Salomo datang ke bukit pengurbanan di Gibeon, dengan Yerusalem disebut kemudian dalam urutan yang sulit
  rationale: Urutan kata Masoret sangat padat dan secara harfiah memuat ‘ke bukit pengurbanan’, tetapi konteks ayat 3–6 dan alur sesudah penampakan ilahi menunjukkan gerak pulang dari Gibeon ke Yerusalem. Teks utama menyampaikan alur kontekstual itu, sedangkan catatan kaki mempertahankan kesulitan tekstualnya.
- issue: Status bukit pengurbanan di Gibeon
  choice: Menerjemahkan istilah secara netral sebagai ‘bukit pengurbanan’
  alternative: tempat pemujaan di bukit
  rationale: Ayat ini menghubungkan lokasi tersebut dengan Kemah Pertemuan dan tidak mengecamnya. Karena itu, terjemahan tidak memasukkan penilaian polemis atau denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar hubungan tempat tidak terlalu berat. ‘Kembali’ memperjelas gerak yang dituntut konteks, sedangkan catatan kaki menjaga ketegangan sintaksis teks Masoret.
