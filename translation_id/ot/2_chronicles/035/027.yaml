  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: id
  text: Riwayatnya[a], dari awal sampai akhir, sesungguhnya tercatat dalam Kitab Raja-Raja Israel dan Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "perkataan", "perkara-perkaranya", atau "perbuatannya"; kata Ibrani ini dapat berarti perkataan, perkara, atau perbuatan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "di atas kitab/gulungan Raja-Raja Israel dan Yehuda"; dalam konteks catatan tertulis, bahasa Indonesia lazim memakai "dalam".
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: Riwayatnya
  rationale: דבר dapat berarti perkataan, perkara, atau perbuatan. Dalam rumusan penutup tentang seorang raja, 'riwayatnya' secara alami mencakup segala perkara dan perbuatannya yang dicatat.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: dari awal sampai akhir
  rationale: Ungkapan ini menunjuk pada keseluruhan rentang riwayat Yosia; bentuk idiomatis Indonesia ini mempertahankan cakupan menyeluruhnya.
- source_word: הִנָּם
  choice: sesungguhnya
  rationale: Partikel הִנֵּה memberi penekanan dan mengarahkan perhatian. 'Sesungguhnya' mempertahankan daya penegasnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: כְּתוּבִים
  choice: tercatat
  rationale: '''Tercatat'' menyampaikan makna pasif כתב dengan alami dalam rumusan yang merujuk kepada sumber sejarah tertulis.'
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah berarti 'di atas', dalam konteks isi suatu dokumen bahasa Indonesia secara idiomatis memakai 'dalam'. סֵפֶר dapat berarti kitab atau gulungan.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Raja-Raja Israel dan Yehuda
  rationale: Frasa ini diperlakukan sebagai judul sumber tertulis yang dirujuk oleh penulis Tawarikh.
