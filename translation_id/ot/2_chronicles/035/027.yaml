translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Riwayatnya' dipilih agar rumusan penutup kerajaan terdengar alami tanpa mempersempit דְבָרָיו hanya menjadi ucapan atau tindakan. Penanda penekanan הִנָּם dipertahankan sebagai 'sesungguhnya'.
