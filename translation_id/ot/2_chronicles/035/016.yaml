  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: id
  text: Demikianlah seluruh pelayanan kepada Yahweh dipersiapkan pada hari itu untuk merayakan Paskah dan mempersembahkan kurban-kurban bakaran di atas mezbah Yahweh, sesuai dengan perintah Raja Yosia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: dipersiapkan
  rationale: Bentuk Nifal menyatakan bahwa seluruh pelayanan itu dibuat siap atau ditata sebagaimana mestinya; bentuk pasif “dipersiapkan” alami dalam bahasa Indonesia dan mempertahankan nuansa hasil.
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: seluruh pelayanan bagi Yahweh
  rationale: Dalam konteks peribadatan, עֲבוֹדָה menunjuk pada pekerjaan atau pelayanan ibadah. “Bagi Yahweh” menyampaikan arah pelayanan secara alami tanpa membatasinya hanya pada tugas imam.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal yang langsung, wajar, dan mempertahankan unsur penunjuk dalam bahasa Ibrani.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: untuk merayakan Paskah
  rationale: Ungkapan harfiah “melakukan Paskah” merupakan idiom untuk menjalankan atau merayakan perayaan Paskah; “merayakan” paling alami bagi pembaca Indonesia.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: dan mempersembahkan kurban-kurban bakaran
  rationale: Bentuk Hifil עלה bersama עֹלוֹת adalah ungkapan baku untuk mempersembahkan kurban bakaran. Bentuk jamak dipertahankan.
- source_word: עַל מִזְבַּח יְהוָה
  choice: di atas mezbah Yahweh
  rationale: Frasa lokatif ini menyatakan tempat kurban dipersembahkan; “di atas mezbah” jelas dan dekat dengan bentuk sumber.
- source_word: כְּמִצְוַת
  choice: sesuai dengan perintah
  rationale: מִצְוָה di sini merujuk pada instruksi khusus sang raja, sehingga “perintah” lebih alami daripada “perintah Allah” atau “ketetapan”.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Raja Yosia
  rationale: Susunan gelar di depan nama merupakan bentuk baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “pelayanan” mempertahankan konteks ibadah; “kurban bakaran” memakai istilah Alkitabiah yang tetap mudah dipahami. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual yang perlu ditampilkan.
