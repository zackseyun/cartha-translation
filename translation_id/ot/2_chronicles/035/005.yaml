id: 2CH.35.5
reference: 2 Chronicles 35:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: id
  text: Berdirilah di tempat kudus menurut kelompok-kelompok kaum keluarga saudara-saudaramu, yaitu orang Israel awam,[a] dan menurut kelompok kaum keluarga orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak bangsa itu”; maksudnya orang Israel non-Lewi, yang dibedakan dari orang Lewi.
    reason: Menjelaskan ungkapan idiomatis בְּנֵי הָעָם dan pembedaan sosial-kultis dalam konteks.
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: Berdirilah
  rationale: Bentuk imperatif jamak dari עמד memberi perintah langsung kepada orang Lewi. Konjungsi waw tidak perlu diterjemahkan secara kaku karena ayat ini melanjutkan rangkaian perintah dalam bahasa Indonesia.
- source_word: בַקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Preposisi lokatif dan artikel menunjuk pada kawasan sakral tempat orang Lewi harus mengambil posisi; pilihan ini konkret tanpa mempersempitnya menjadi ruangan tertentu.
- source_word: לִפְלֻגּוֹת / וַחֲלֻקַּת
  choice: menurut kelompok-kelompok / dan menurut kelompok
  rationale: Kedua nomina menunjuk pada pembagian atau pengelompokan yang mengatur posisi mereka. Pengulangan 'menurut' memperjelas kesejajaran sintaksis secara wajar dalam bahasa Indonesia.
- source_word: בֵּית הָאָבוֹת / בֵּית אָב
  choice: kaum keluarga
  rationale: Ungkapan genealogis ini menunjuk pada kelompok rumah tangga berdasarkan garis ayah atau leluhur. 'Kaum keluarga' lebih alami daripada terjemahan harfiah 'rumah ayah' dan tetap mempertahankan struktur sosialnya.
- source_word: לַאֲחֵיכֶם
  choice: saudara-saudaramu
  rationale: Mempertahankan bahasa kekerabatan perjanjian yang dipakai bagi sesama orang Israel.
- source_word: בְּנֵי הָעָם
  choice: orang Israel awam
  rationale: Secara harfiah berarti 'anak-anak bangsa/rakyat', tetapi dalam konteks ini membedakan orang Israel non-Lewi dari orang Lewi. 'Orang Israel awam' menyampaikan fungsi kontekstualnya, sementara bentuk harfiah dicatat dalam catatan kaki.
- source_word: לַלְוִיִּם
  choice: orang Lewi
  rationale: Menunjuk pada kelompok Lewi yang disejajarkan dengan kelompok kaum keluarga orang Israel lainnya.
theological_decisions:
- issue: Pembedaan antara orang Israel non-Lewi dan orang Lewi
  choice: orang Israel awam
  alternative: anak-anak bangsa itu
  rationale: Konteks pelayanan Paskah menuntut pembedaan sosial-kultis, bukan penilaian rohani. Istilah 'awam' dipakai secara deskriptif untuk non-Lewi dan dijelaskan melalui catatan kaki agar ungkapan Ibraninya tetap terlihat.
- issue: Bahasa kekerabatan Israel
  choice: saudara-saudaramu
  alternative: sesama orang Israel
  rationale: Pilihan ini mempertahankan metafora kekeluargaan dalam teks Ibrani tanpa menentukan lebih jauh cakupan gender yang tidak menjadi fokus ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat cukup dekat dengan kesejajaran Ibrani, tetapi ungkapan genealogis dan sosial diterjemahkan secara alami agar mudah dipahami pembaca umum.
