base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/019.yaml
  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: id
  text: Pada tahun kedelapan belas pemerintahan Yosia, Paskah ini dirayakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Paskah ini dilaksanakan”; secara lebih harfiah, “Paskah ini dilakukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Pada tahun kedelapan belas
  rationale: Ungkapan dengan preposisi ב berfungsi sebagai penanda waktu. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan keterangan kronologis teks Ibrani.
- source_word: לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: pemerintahan Yosia
  rationale: מַלְכוּת dalam rumus penanggalan kerajaan menunjuk pada masa Yosia memerintah. 'Pemerintahan Yosia' merupakan padanan Indonesia yang wajar dan tepat.
- source_word: נַעֲשָׂה
  choice: dirayakan
  rationale: Secara harfiah verba ini berarti 'dilakukan' atau 'dibuat', tetapi bersama פֶּסַח secara idiomatis berarti melaksanakan atau merayakan Paskah. 'Dirayakan' jelas dan alami tanpa mengubah acuannya.
- source_word: הַפֶּסַח
  choice: Paskah
  rationale: פֶּסַח adalah istilah baku untuk Paskah. Tidak ditambahkan kata 'perayaan' atau 'hari raya' karena unsur tersebut tidak dinyatakan secara tersendiri dalam teks.
- source_word: הַזֶּה
  choice: ini
  rationale: Kata penunjuk ini mengacu pada Paskah tertentu yang baru saja diuraikan dalam konteks dan dipertahankan secara langsung.
