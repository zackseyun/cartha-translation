  text: וְ/אַחַ֗ר הֵכִ֤ינוּ לָ/הֶם֙ וְ/לַ/כֹּ֣הֲנִ֔ים כִּ֤י הַ/כֹּהֲנִים֙ בְּנֵ֣י אַהֲרֹ֔ן בְּ/הַֽעֲל֛וֹת הָ/עוֹלָ֥ה וְ/הַ/חֲלָבִ֖ים עַד לָ֑יְלָה וְ/הַ/לְוִיִּם֙ הֵכִ֣ינוּ לָ/הֶ֔ם וְ/לַ/כֹּהֲנִ֖ים בְּנֵ֥י אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: id
  text: Sesudah itu, mereka menyiapkan bagi diri mereka sendiri[a] dan bagi para imam, sebab para imam, keturunan Harun, sibuk mempersembahkan kurban bakaran dan bagian-bagian lemak sampai malam. Karena itu, orang-orang Lewi menyiapkan bagi diri mereka sendiri dan bagi para imam, keturunan Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi mereka” pada kedua kemunculan frasa “bagi diri mereka sendiri”. Pronomina Ibraninya tidak secara eksplisit bersifat refleksif, tetapi konteks sangat kuat menunjukkan bahwa orang-orang Lewi juga menyiapkan makanan bagi mereka sendiri, selain bagi para imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai tindakan berikutnya dalam urutan peristiwa dan terdengar alami dalam bahasa Indonesia modern.
- source_word: הֵכִינוּ
  choice: menyiapkan
  rationale: Bentuk Hifil dari כון berarti membuat siap atau menyiapkan; objek berupa makanan tersirat dari konteks tetapi tidak perlu ditambahkan ke teks utama.
- source_word: לָהֶם
  choice: bagi diri mereka sendiri
  rationale: Walaupun pronomina Ibrani tidak secara eksplisit berbentuk refleksif, subjek dan konteks paling wajar menunjuk pada persiapan untuk orang-orang Lewi sendiri.
- source_word: וְלַכֹּהֲנִים
  choice: dan bagi para imam
  rationale: Menyatakan kelompok tambahan yang menerima hasil persiapan.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan mengapa orang-orang Lewi perlu menyiapkan kebutuhan para imam.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: para imam, keturunan Harun
  rationale: Mempertahankan keterangan genealogis yang mengidentifikasi para imam; 'keturunan' lebih alami daripada 'anak-anak' dalam konteks garis keturunan.
- source_word: בְּהַעֲלוֹת
  choice: sibuk mempersembahkan
  rationale: Mengungkapkan kegiatan kurban yang berlangsung terus dan menjadi alasan para imam tidak dapat menyiapkan kebutuhan mereka sendiri.
- source_word: הָעוֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan jelas untuk עֹלָה, yaitu persembahan yang dibakar di atas mazbah.
- source_word: וְהַחֲלָבִים
  choice: dan bagian-bagian lemak
  rationale: Dalam konteks kurban, kata ini menunjuk pada bagian lemak tertentu yang dipersembahkan, bukan lemak secara umum.
- source_word: עַד לָיְלָה
  choice: sampai malam
  rationale: Mempertahankan batas waktu yang dinyatakan teks tanpa memperlemahnya menjadi hanya 'petang'.
- source_word: וְהַלְוִיִּם
  choice: Karena itu, orang-orang Lewi
  rationale: Konjungsi melanjutkan klausa utama sesudah penjelasan kausal; 'Karena itu' memperjelas hubungan akibat dalam bahasa Indonesia.
theological_decisions: []
