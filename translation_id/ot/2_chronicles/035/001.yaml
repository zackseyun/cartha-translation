  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: id
  text: Yosia merayakan Paskah bagi Yahweh di Yerusalem, dan mereka menyembelih kurban Paskah[a] pada hari keempat belas bulan pertama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Paskah”; di sini istilah itu menunjuk pada hewan kurban Paskah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: merayakan
  rationale: Secara harfiah berarti “melakukan/membuat”, tetapi dengan פֶּסַח sebagai objek, ungkapan ini berarti melaksanakan atau merayakan Paskah.
- source_word: פֶּסַח
  choice: Paskah
  rationale: Pada kemunculan pertama, kata ini menunjuk pada perayaan atau pelaksanaan Paskah secara keseluruhan; “Paskah” adalah padanan Indonesia yang baku dan alami.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan peruntukan atau pengabdian kepada Yahweh; “bagi” menyampaikan hubungan itu secara alami tanpa menambah penafsiran.
- source_word: בִירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Padanan lokatif langsung dengan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: וַיִּשְׁחֲטוּ
  choice: mereka menyembelih
  rationale: Kata שׁחט menunjuk pada tindakan menyembelih, khususnya dalam konteks kurban, dan lebih tepat daripada sekadar “membunuh”.
- source_word: הַפֶּסַח
  choice: kurban Paskah
  rationale: Pada kemunculan kedua, “Paskah” secara metonimis menunjuk pada hewan kurban yang disembelih. “Kurban Paskah” memperjelas acuannya tanpa membatasi hewan itu menjadi anak domba saja.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: pada hari keempat belas
  rationale: Ungkapan angka Ibrani ini secara idiomatis menyatakan tanggal dalam bulan.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: bulan pertama
  rationale: Frasa ini menentukan bulan tempat hari keempat belas itu jatuh; susunan ini alami dalam penanggalan bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Acuan הַפֶּסַח pada kemunculan kedua
  choice: kurban Paskah
  alternative: Paskah; anak domba Paskah
  rationale: Dalam konteks kata kerja “menyembelih”, istilah itu menunjuk pada hewan kurban. “Kurban Paskah” mempertahankan metonimi dengan jelas dan tidak mempersempitnya menjadi anak domba, sebab ketentuan Taurat juga memungkinkan kambing.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur koordinatif ayat dipertahankan, sedangkan idiom Ibrani diterjemahkan secara alami. Istilah “kurban” mengikuti ejaan baku bahasa Indonesia.
