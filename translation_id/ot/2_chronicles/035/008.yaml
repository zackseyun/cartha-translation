base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: id
  text: Para pejabatnya juga memberikan sumbangan sukarela bagi rakyat, para imam, dan orang-orang Lewi. Hilkia, Zakharia, dan Yehiel, para pemimpin rumah Allah, memberikan kepada para imam 2.600 ekor hewan untuk kurban Paskah[a] serta 300 ekor ternak sapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “2.600 kurban Paskah.” Bentuk jamak Ibrani dapat merujuk kepada hewan yang digunakan dalam perayaan Paskah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: Para pejabatnya juga
  rationale: שָׂרִים menunjuk para pemegang kedudukan atau pejabat. “Pejabat” alami dalam konteks pemerintahan, sedangkan “juga” menyambungkan tindakan mereka dengan pemberian raja pada ayat sebelumnya.
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: memberikan sumbangan sukarela
  rationale: נְדָבָה adalah pemberian sukarela, dan bentuk kausatif רום dalam konteks ini berarti menyumbangkan atau mempersembahkan. Gabungan ini menghasilkan ungkapan Indonesia yang jelas dan alami.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: bagi rakyat, para imam, dan orang-orang Lewi
  rationale: Pengulangan ל menandai pihak-pihak yang menerima manfaat atau persediaan. “Bagi” mempertahankan relasi tersebut tanpa memaksakan bahwa barang diserahkan langsung kepada setiap orang.
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: Hilkia, Zakharia, dan Yehiel
  rationale: Nama-nama ditransliterasikan mengikuti bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: para pemimpin rumah Allah
  rationale: נָגִיד berarti pemimpin atau orang yang mengepalai. “Rumah Allah” mempertahankan sebutan Ibrani bagi Bait Allah tanpa mengubah metaforanya.
- source_word: לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2.600 ekor domba dan kambing untuk kurban Paskah
  rationale: Secara harfiah, teks menyebut “untuk persembahan-persembahan Paskah, 2.600” tanpa mengulang nama hewannya. Kontras dengan בָקָר dan konteks ayat 7 menunjukkan bahwa bilangan pertama menghitung ternak kecil, yakni domba dan kambing; penyebutan eksplisit diperlukan agar bahasa Indonesia tidak menggantung.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: serta 300 ekor sapi
  rationale: בָּקָר adalah nomina kolektif untuk ternak sapi. Kata bantu bilangan “ekor” merupakan bentuk Indonesia yang alami.
theological_decisions: []
