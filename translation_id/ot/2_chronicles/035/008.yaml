  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti urutan tindakan dalam teks Ibrani, sementara unsur yang tersirat pada jumlah 2.600 dibuat eksplisit berdasarkan kontras leksikal dan konteks langsung agar dapat dipahami pembaca umum.
