base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: id
  text: Ia menetapkan para imam pada tugas-tugas mereka[a] dan menguatkan mereka[b] dalam pelayanan di rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut kelompok-kelompok tugas mereka,” “di tempat tugas mereka,” atau, secara lebih harfiah, “atas giliran-giliran jaga mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menyemangati mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: Ia menempatkan
  rationale: Bentuk Hifil dari עמד berarti membuat berdiri atau menempatkan seseorang pada posisi yang ditetapkan. “Menempatkan” mempertahankan gambaran dasarnya sekaligus terdengar wajar dalam konteks pengaturan para imam.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk bentuk jamak definit כהנים dalam bahasa Indonesia.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: pada tugas mereka
  rationale: מִשְׁמָרוֹת dapat menunjuk pada giliran jaga, tempat tugas, atau kelompok pembagian pelayanan. “Pada tugas mereka” menyampaikan fungsi ungkapan itu secara alami tanpa menutup alternatif leksikalnya.
- source_word: וַיְחַזְּקֵם
  choice: dan menguatkan mereka
  rationale: Bentuk Piel חזק dapat berarti menguatkan, meneguhkan, atau menyemangati. “Menguatkan” menjaga inti leksikal dan membiarkan terbuka apakah dukungan itu bersifat praktis atau batiniah.
- source_word: לַעֲבוֹדַת
  choice: untuk pelayanan
  rationale: עֲבוֹדָה berarti pekerjaan atau pelayanan, khususnya pelayanan ibadah dalam konteks rumah suci. “Pelayanan” merupakan padanan yang alami dan cukup luas.
- source_word: בֵּית יְהוָה
  choice: di rumah Yahweh
  rationale: Ungkapan harfiah “rumah Yahweh” dipertahankan sebagai sebutan bagi bait, dan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” sesuai lapisan konsultasi yang diberikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang alami dan bermartabat. Pronomina “Ia” mengikuti subjek Yosia dari konteks terdekat; istilah “rumah Yahweh” mempertahankan ungkapan Ibrani alih-alih menjelaskannya sebagai “bait.”
