  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: id
  text: Lalu ia berkata kepada orang-orang Lewi yang mengajar seluruh Israel[a], yang kudus bagi Yahweh, “Tempatkanlah tabut kudus itu di dalam rumah yang dibangun oleh Salomo, anak Daud, raja Israel.[b] Kalian tidak perlu lagi mengusungnya di bahu kalian.[c] Sekarang layanilah Yahweh, Allah kalian, dan umat-Nya, Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Lewi yang memberi pengertian kepada seluruh Israel,” atau “orang-orang Lewi yang telah diberi pengertian untuk seluruh Israel.” Bentuk Ibraninya dapat menyatakan bahwa mereka memahami atau bahwa mereka membuat orang lain memahami.
    reason: lexical_alternative
  - marker: b
    text: “Rumah” di sini adalah Bait Allah yang dibangun oleh Salomo.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “tidak ada beban bagi kalian pada bahu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבִינִים
  choice: yang mengajar
  rationale: Partisipel dari בין dalam bentuk Hifil dapat berarti memahami atau membuat orang memahami. Dalam konteks pelayanan orang Lewi kepada seluruh Israel, fungsi mengajar paling mungkin, sementara ambiguitas bentuk Ibrani dicatat dalam catatan kaki.
- source_word: הַקְּדוֹשִׁים לַיהוָה
  choice: yang kudus bagi Yahweh
  rationale: Ungkapan ini menyatakan status kekudusan atau pengkhususan bagi Yahweh. Terjemahan ini mempertahankan bahasa kultis sumber tanpa mempersempitnya menjadi tindakan penahbisan tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: תְּנוּ אֶת־אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: Tempatkanlah tabut kudus itu di dalam rumah
  rationale: נתן dengan objek dan keterangan tempat berarti menempatkan. 'Rumah' mempertahankan בית, sedangkan konteks dan catatan kaki menjelaskan bahwa yang dimaksud ialah Bait Allah.
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: Kalian tidak perlu lagi mengusungnya di atas bahu
  rationale: Ungkapan harfiahnya menyebut tidak adanya beban pada bahu. Terjemahan ini menyampaikan maksud praktisnya secara alami dan mempertahankan gambaran mengusung dengan bahu.
- source_word: עַתָּה עִבְדוּ
  choice: Sekarang layanilah
  rationale: עבד di sini menunjuk pada pelayanan kepada Allah dan umat-Nya. 'Layanilah' cocok dengan kedua objek tersebut dan lebih tepat daripada membatasi maknanya pada ibadah saja.
- source_word: וְאֶת־עַמּוֹ יִשְׂרָאֵל
  choice: dan umat-Nya, Israel
  rationale: Tanda koma memperjelas bahwa Israel merupakan penjelas bagi 'umat-Nya', sambil mempertahankan hubungan perjanjian yang dinyatakan teks.
theological_decisions:
- issue: Makna peran orang Lewi dalam הַמְבִינִים
  choice: orang-orang Lewi yang mengajar seluruh Israel
  alternative: orang-orang Lewi yang berpengertian atau yang telah diajar bagi seluruh Israel
  rationale: Bentuk tersebut dapat menunjuk pada pemahaman maupun tindakan memberi pemahaman. Konteks Tawarikh mendukung fungsi pengajaran orang Lewi, tetapi alternatif leksikal tetap dicantumkan agar ambiguitas tidak dihapus.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama ilahi, sehingga transliterasi 'Yahweh' mempertahankan pembedaan antara nama pribadi dan gelar tanpa memasukkan tafsiran denominasi tertentu.
- issue: Status orang Lewi sebagai הַקְּדוֹשִׁים לַיהוָה
  choice: yang kudus bagi Yahweh
  alternative: yang dikhususkan bagi Yahweh
  rationale: '''Kudus bagi Yahweh'' mempertahankan rumusan sumber dan ketegangan antara status kekudusan serta pengkhususan untuk pelayanan, tanpa memilih hanya salah satu nuansa.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' agar bentuk orang kedua jamak dalam bahasa Ibrani terlihat. Diksi dijaga khidmat tetapi tetap mudah dipahami; 'mengusung' dipilih untuk tindakan membawa beban di atas bahu, dan 'rumah' dipertahankan dari teks sumber dengan penjelasan dalam catatan kaki.
