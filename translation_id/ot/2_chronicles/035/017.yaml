  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: id
  text: Orang Israel yang hadir merayakan Paskah pada waktu itu dan Hari Raya Roti Tidak Beragi selama tujuh hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: merayakan
  rationale: Secara harfiah verba ini berarti ‘melakukan’ atau ‘membuat’, tetapi bila berobjek perayaan keagamaan, maknanya adalah menjalankan atau merayakannya. ‘Merayakan’ alami dalam bahasa Indonesia dan cocok untuk kedua objek dalam ayat ini.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini merupakan sebutan kolektif bagi bangsa Israel. ‘Orang Israel’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַנִּמְצְאִים
  choice: yang hadir
  rationale: Partisipel dari מצא di sini menunjuk kepada mereka yang didapati berada di tempat itu. ‘Yang hadir’ menyampaikan makna kontekstualnya tanpa terjemahan harfiah yang kaku.
- source_word: הַפֶּסַח
  choice: Paskah
  rationale: Dalam konteks ini istilah tersebut menunjuk pada perayaan Paskah secara keseluruhan, bukan hanya hewan kurbannya. ‘Paskah’ merupakan istilah baku dan memadai.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Frasa ini menyatakan waktu secara langsung. Terjemahan ini tidak menambahkan gagasan ‘waktu yang ditetapkan’, yang tidak dinyatakan secara eksplisit.
- source_word: חַג הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: חַג berarti hari raya atau perayaan, sedangkan מַצּוֹת berarti roti tidak beragi. Pilihan ini memakai nama yang mudah dikenali dan tetap dekat dengan bentuk Ibrani.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Kata ‘selama’ menyatakan durasi perayaan dengan jelas dan alami dalam bahasa Indonesia.
