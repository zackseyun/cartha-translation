base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: id
  text: Maka pelayanan itu dipersiapkan[a]. Para imam berdiri di tempat tugas mereka[b], dan orang-orang Lewi berdiri menurut pembagian mereka[c], sesuai dengan perintah raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditata” atau “dibuat siap.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di tempat berdiri mereka,” yaitu pada posisi yang ditetapkan bagi mereka.
    reason: lexical_alternative
  - marker: c
    text: Atau “berdasarkan pembagian mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: dipersiapkan
  rationale: Bentuk dari כון di sini menyatakan bahwa sesuatu dibuat siap atau ditata. Dalam konteks perayaan Paskah, “dipersiapkan” alami dan tetap mencakup gagasan penataan.
- source_word: הָעֲבוֹדָה
  choice: ibadah itu
  rationale: Dalam konteks Bait Allah, עֲבוֹדָה menunjuk pada pelayanan atau kegiatan ibadah. “Ibadah” jelas bagi pembaca Indonesia dan tidak memasukkan istilah liturgis yang lebih sempit.
- source_word: וַיַּעַמְדוּ
  choice: berdiri
  rationale: Padanan langsung עמד; frasa berikutnya menjelaskan bahwa mereka berada pada posisi tugas yang ditetapkan.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk kelompok imam dalam konteks ibadah Israel.
- source_word: עַל עָמְדָם
  choice: di tempat tugas mereka
  rationale: Ungkapan ini secara harfiah berkaitan dengan tempat berdiri; dalam konteks organisasional, yang dimaksud ialah posisi atau pos tugas yang ditetapkan.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan Indonesia yang jelas untuk kelompok suku dan pelayan ibadah ini.
- source_word: עַל מַחְלְקוֹתָם
  choice: menurut kelompok-kelompok mereka
  rationale: מַחְלְקוֹת menunjuk pada pembagian atau kelompok tugas yang terorganisasi. “Menurut kelompok-kelompok mereka” mempertahankan susunan tersebut dengan bahasa alami.
- source_word: כְּמִצְוַת
  choice: sesuai dengan perintah
  rationale: Di sini מִצְוָה adalah perintah khusus dari raja, sehingga “perintah” lebih tepat daripada istilah yang dapat terdengar seperti hukum keagamaan umum.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Rujukan definit kepada raja yang sedang dibicarakan dalam konteks.
theological_decisions:
- issue: Istilah kultis עֲבוֹדָה
  choice: ibadah itu
  alternative: pelayanan itu; tugas ibadah itu
  rationale: Konteksnya adalah tata pelaksanaan Paskah di Bait Allah. “Ibadah” menjaga nuansa sakral tanpa mengimpor konsep liturgi dari tradisi tertentu.
- issue: Ungkapan organisasional bagi posisi imam dan orang Lewi
  choice: di tempat tugas mereka ... menurut kelompok-kelompok mereka
  alternative: di tempat mereka ... berdasarkan pembagian mereka
  rationale: Pilihan ini mempertahankan gambaran tentang tata tugas yang teratur sekaligus mudah dipahami, tanpa menambahkan rincian yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dua kalimat dipakai agar hubungan antarklausa jelas; penanda wacana “Maka ... pun” mewakili kesinambungan narasi Ibrani. Semua alternatif leksikal penting ditaruh dalam catatan kaki.
