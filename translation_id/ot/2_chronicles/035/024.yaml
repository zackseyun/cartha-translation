  text: וַ/יַּֽעֲבִירֻ֨/הוּ עֲבָדָ֜י/ו מִן הַ/מֶּרְכָּבָ֗ה וַֽ/יַּרְכִּיבֻ/הוּ֮ עַ֣ל רֶ֣כֶב הַ/מִּשְׁנֶה֮ אֲשֶׁר ל/וֹ֒ וַ/יּוֹלִיכֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קִבְר֣וֹת אֲבֹתָ֑י/ו וְ/כָל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִֽתְאַבְּלִ֖ים עַל יֹאשִׁיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: id
  text: Para pelayannya mengeluarkannya dari kereta itu, lalu menaikkannya ke kereta kedua yang dimilikinya[a] dan membawanya ke Yerusalem. Ia meninggal dan dimakamkan di makam-makam para leluhurnya. Seluruh Yehuda dan Yerusalem berkabung karena Yosia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kereta yang kedua.” Makna tepat frasa ini tidak pasti; mungkin menunjuk pada kereta kedua atau kereta cadangan milik Yosia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: memindahkan dia
  rationale: Bentuk Hifil dari עבר menyatakan pemindahan dari satu tempat ke tempat lain; dalam konteks ini Yosia dikeluarkan dari kereta perangnya.
- source_word: עֲבָדָיו
  choice: para pelayannya
  rationale: עבד dapat berarti hamba, pelayan, atau pejabat. Di sini yang dimaksud ialah orang-orang yang melayani dan mendampingi raja, tanpa perlu menentukan pangkat mereka.
- source_word: הַמֶּרְכָּבָה
  choice: kereta itu
  rationale: Kata ini menunjuk kepada kereta yang sudah jelas dari konteks, yakni kereta tempat Yosia terluka.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: menaikkan dia
  rationale: Bentuk Hifil dari רכב berarti membuat seseorang naik atau menempatkannya di atas kendaraan; 'menaikkan dia' wajar dalam konteks mengangkut orang yang terluka.
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: kereta kedua
  rationale: Ungkapan ini secara dekat berarti 'kereta yang kedua'. Terjemahan ini mempertahankan bentuk Ibrani tanpa memastikan bahwa kendaraan tersebut adalah kereta cadangan.
- source_word: אֲשֶׁר לוֹ
  choice: miliknya
  rationale: Klausa ini menyatakan bahwa kereta kedua tersebut adalah kepunyaan Yosia.
- source_word: וַיּוֹלִיכֻהוּ
  choice: membawanya
  rationale: Bentuk Hifil dari הלך dapat berarti membawa atau menuntun; karena Yosia sedang diangkut menuju Yerusalem, 'membawanya' paling sesuai.
- source_word: וַיָּמָת
  choice: Ia meninggal
  rationale: Terjemahan langsung dari kata kerja מות dalam rangkaian narasi.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal menyatakan tindakan pasif, yaitu Yosia dikuburkan.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: di makam-makam para leluhurnya
  rationale: Terjemahan ini mempertahankan bentuk jamak קברות dan memakai 'leluhur' untuk ungkapan kekerabatan אבותיו dalam konteks pemakaman dinasti.
- source_word: וְכָל יְהוּדָה וִירוּשָׁלַם
  choice: Seluruh Yehuda dan Yerusalem
  rationale: Teks menyebut wilayah kerajaan dan ibu kotanya sebagai keseluruhan komunitas yang berkabung, tanpa menambahkan 'penduduk' yang tidak tertulis.
- source_word: מִתְאַבְּלִים
  choice: berkabung
  rationale: Partisipel Hitpael menggambarkan keadaan atau tindakan berkabung yang sedang berlangsung; dalam bahasa Indonesia, bentuk 'berkabung' alami dan tidak memaksakan batas waktunya.
