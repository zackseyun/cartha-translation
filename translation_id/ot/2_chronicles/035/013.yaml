  naturalness: Kalimat kedua draf kurang alami karena objek ditempatkan di depan subjek-verba (“Persembahan-persembahan kudus mereka rebus”). Urutan “Mereka merebus persembahan-persembahan kudus ...” jelas dan baku. “Periuk, belanga, dan mangkuk” mempertahankan daftar wadah tanpa mengklaim bentuk tepat yang tidak pasti.
  terminology: “Kurban Paskah” tepat untuk הַפֶּסַח dalam konteks ritual dan menghindari kesan bahwa yang dimasak adalah perayaan Paskah. “Persembahan-persembahan kudus” mempertahankan pembedaan dengan kurban Paskah. “Ketentuan” menyatakan sifat normatif כַּמִּשְׁפָּט dalam bahasa Indonesia modern.
