  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: id
  text: Mereka memasak kurban Paskah itu di atas api sesuai dengan ketentuan[a]. Mereka merebus persembahan-persembahan kudus dalam periuk, belanga, dan mangkuk, lalu segera membawanya kepada seluruh rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus, “memanggang kurban Paskah itu di atas api.” Kata kerja Ibrani yang dipakai dapat berarti “memasak” secara umum, tetapi hukum Paskah menetapkan bahwa daging itu harus dipanggang, bukan direbus (bdk. Kel. 12:8–9).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: memasak
  rationale: Verba בשׁל dapat berarti memasak secara umum maupun merebus. Dalam klausa ini, frasa “dengan api sesuai dengan ketetapan” menunjukkan cara memasak yang ditentukan bagi kurban Paskah tanpa mempersempit arti verba utama secara diam-diam.
- source_word: הַפֶּסַח
  choice: domba Paskah
  rationale: Dalam konteks persiapan makanan kurban, istilah “Paskah” menunjuk secara konkret kepada hewan kurban Paskah. Penambahan “domba” memperjelas rujukannya dalam bahasa Indonesia alami.
- source_word: בָּאֵשׁ
  choice: dengan api
  rationale: Menerjemahkan frasa preposisional secara dekat dan mempertahankan cara memasak kurban tanpa menambahkan rincian teknis yang tidak dinyatakan langsung.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan ketetapan
  rationale: Dalam konteks ini מִשְׁפָּט menunjuk kepada tata cara yang telah ditentukan. “Ketetapan” bernada wajar, bermartabat, dan normatif dalam bahasa Indonesia.
- source_word: וְהַקֳּדָשִׁים
  choice: persembahan-persembahan kudus
  rationale: Bentuk jamak ini menunjuk kepada bagian-bagian kurban yang dikuduskan dan dibedakan dari kurban Paskah dalam klausa sebelumnya.
- source_word: בִּשְּׁלוּ
  choice: mereka rebus
  rationale: Daftar wadah memasak yang menyusul mendukung arti kuliner khusus “merebus” dan membentuk kontras dengan kurban Paskah yang dimasak dengan api.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: dalam periuk, belanga besar, dan mangkuk
  rationale: Tiga istilah ini menunjuk kepada beragam wadah memasak atau penyajian. Pilihan ini memakai kosakata Indonesia modern sambil mempertahankan perbedaan umum ukuran dan bentuk; bentuk persis wadah terakhir tidak pasti.
- source_word: וַיָּרִיצוּ
  choice: lalu segera membawanya
  rationale: Bentuk kausatif verba רוץ menyampaikan gerak yang dilakukan dengan cepat. Ungkapan ini mempertahankan unsur perpindahan dan ketergesaan secara idiomatis.
- source_word: לְכָל בְּנֵי הָעָם
  choice: kepada seluruh rakyat
  rationale: Secara harfiah frasa ini berbunyi “kepada semua anak rakyat,” tetapi secara idiomatis menunjuk kepada rakyat secara keseluruhan.
theological_decisions:
- issue: Ketegangan antara arti luas בשׁל dan hukum Paskah yang mengharuskan pemanggangan
  choice: Memakai verba luas “memasak” dalam teks utama dan membiarkan frasa “dengan api sesuai dengan ketetapan” menentukan caranya.
  alternative: Menerjemahkan secara eksplisit “memanggang domba Paskah dengan api.”
  rationale: Pilihan ini mempertahankan keluasan leksikal verba Ibrani sekaligus menyatakan bahwa persiapannya mengikuti tata cara Paskah. Catatan kaki menjelaskan arti yang lebih khusus tanpa menghapus ketegangan leksikal.
- issue: Rujukan “persembahan-persembahan kudus”
  choice: Memahaminya sebagai persembahan kurban selain domba Paskah.
  alternative: Memahaminya sebagai sebutan umum bagi seluruh makanan kudus, termasuk domba Paskah.
  rationale: Susunan kalimat membedakan “domba Paskah” dari “persembahan-persembahan kudus,” dan cara memasak yang berbeda mendukung pembedaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. Istilah ritual dibuat mudah dipahami tanpa menghilangkan pembedaan antara kurban Paskah dan persembahan kudus lainnya. Penanda catatan kaki [a] ditempatkan langsung sesudah klausa yang dijelaskannya.
