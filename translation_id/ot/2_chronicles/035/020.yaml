  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: id
  text: Sesudah semuanya itu, ketika Yosia telah menyiapkan Bait Allah[a], Nekho, raja Mesir, maju untuk berperang di Karkemis, di tepi Sungai Efrat. Yosia pun keluar untuk menemuinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah itu”; yang dimaksud adalah rumah TUHAN, yaitu Bait Allah.'
    reason: lexical_clarification
  - marker: b
    text: Dalam konteks militer ini, “keluar untuk menemuinya” juga dapat berarti “keluar untuk menghadapinya” atau “keluar melawannya.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: menyiapkan
  rationale: Bentuk Hifil dari כון berarti menyiapkan, menegakkan, atau menata agar siap. “Menyiapkan” dekat dengan makna leksikal dan tetap alami, tanpa membatasi tindakan Yosia pada pembangunan fisik.
- source_word: הַבַּיִת
  choice: Bait Allah
  rationale: Secara harfiah berarti “rumah itu,” tetapi dalam konteks Tawarikh jelas menunjuk pada rumah TUHAN, yaitu Bait Allah. Padanan ini paling jelas dan wajar bagi pembaca Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עָלָה
  choice: maju
  rationale: Secara dasar berarti “naik/pergi naik.” Dalam konteks pergerakan pasukan, “maju” menyampaikan gerakan ekspedisi militer secara alami tanpa menambahkan gagasan yang tidak tersirat dalam konteks.
- source_word: לְהִלָּחֵם
  choice: untuk berperang
  rationale: Infinitif ini menyatakan tujuan untuk bertempur atau berperang. “Untuk berperang” merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks militer.
- source_word: בְּכַרְכְּמִישׁ
  choice: di Karkemis
  rationale: Preposisi ב di sini paling wajar dipahami secara lokatif, yakni pertempuran berlangsung di Karkemis.
- source_word: עַל פְּרָת
  choice: di tepi Sungai Efrat
  rationale: Ungkapan ini menunjukkan letak Karkemis pada atau dekat Sungai Efrat. “Di tepi Sungai Efrat” menyampaikan hubungan geografis itu secara jelas dalam bahasa Indonesia.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: Yosia pun keluar untuk menemuinya
  rationale: לִקְרָאתוֹ dapat berarti menemui, menyongsong, atau menghadapi seseorang. Terjemahan utama mempertahankan ungkapan yang relatif netral, sedangkan nuansa konfrontatif dalam konteks militer dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bait Allah” dipilih agar rujukan הַבַּיִת langsung dipahami, sementara bentuk harfiahnya dipertahankan dalam catatan kaki. Ambiguitas לִקְרָאתוֹ tidak diselesaikan secara sepihak.
