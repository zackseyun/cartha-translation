  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: id
  text: Yosia menyumbangkan kepada rakyat tiga puluh ribu ekor ternak kecil—anak domba dan anak kambing—semuanya sebagai persembahan Paskah bagi semua orang yang hadir, serta tiga ribu ekor sapi. Semuanya itu berasal dari milik raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: menyumbangkan
  rationale: Bentuk Hifil dari רום dalam konteks ini berarti menyediakan atau memberikan sebagai sumbangan, bukan secara harfiah 'mengangkat' dan bukan pula menyatakan bahwa Yosia sendiri mempersembahkannya di mezbah.
- source_word: לִבְנֵי הָעָם
  choice: kepada rakyat
  rationale: Ungkapan harfiah 'kepada anak-anak rakyat' menunjuk kepada kalangan rakyat yang mengikuti perayaan. 'Kepada rakyat' alami dalam bahasa Indonesia dan tidak menambahkan pembatasan yang tidak tegas dalam teks.
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  choice: ternak kecil—anak domba dan anak kambing
  rationale: צֹאן merupakan istilah kolektif untuk ternak kecil, lalu teks merincinya sebagai anak domba dan anak kambing. Tanda pisah memperlihatkan hubungan umum-rincian dengan jelas.
- source_word: הַכֹּל לַפְּסָחִים
  choice: semuanya sebagai persembahan Paskah
  rationale: Bentuk jamak פְּסָחִים di sini paling mungkin merujuk secara kolektif kepada hewan atau persembahan Paskah, bukan kepada beberapa perayaan Paskah.
- source_word: לְכָל הַנִּמְצָא
  choice: bagi semua orang yang hadir
  rationale: Partisipel Nifal מצא dalam konteks perhimpunan ini secara idiomatis menunjuk kepada mereka yang hadir.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: tiga puluh ribu ekor
  rationale: Jumlah ini menerangkan keseluruhan ternak kecil. Penempatannya sebelum jenis hewan menghasilkan susunan Indonesia yang jelas dan alami.
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: serta tiga ribu ekor sapi
  rationale: בָּקָר adalah nomina kolektif untuk ternak besar atau sapi; 'sapi' tidak membatasi jenis kelamin atau fungsi hewan tersebut.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: Semuanya itu berasal dari milik raja
  rationale: רְכוּשׁ berarti milik, harta, atau kekayaan. Ungkapan ini menyatakan bahwa hewan-hewan tersebut diambil dari sumber daya milik raja.
theological_decisions:
- issue: Makna bentuk jamak פְּסָחִים
  choice: persembahan Paskah
  alternative: korban-korban Paskah
  rationale: Pilihan ini menyampaikan fungsi kultis hewan-hewan tersebut tanpa menentukan secara berlebihan jenis teknis korbannya atau menyiratkan adanya beberapa perayaan Paskah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat ditata ulang agar jumlah tiga puluh ribu jelas hanya menerangkan ternak kecil, sedangkan tiga ribu menerangkan sapi. 'Rakyat' dipilih daripada terjemahan harfiah yang janggal 'anak-anak rakyat'.
