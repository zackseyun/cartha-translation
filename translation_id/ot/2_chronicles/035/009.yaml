  source_fidelity: 'Teks Indonesia mengikuti susunan dan makna Ibrani dengan baik: Konanya, Semaya, dan Netaneel disebut sebagai saudara; kemudian Hasabya, Yeiel, dan Yozabad juga disebutkan, dan keseluruhan kelompok dijelaskan sebagai para pemimpin orang Lewi. Kata הֵרִימוּ tepat diterjemahkan “menyumbangkan,” penerima sumbangan dinyatakan jelas, dan dua jumlah—5.000 hewan bagi kurban Paskah serta 500 ekor sapi—dipertahankan tanpa penambahan makna.'
