base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: id
  text: Konanya, bersama saudara-saudaranya, Semaya dan Netaneel, serta Hasabya, Yeiel, dan Yozabad, para pemimpin orang Lewi, menyumbangkan kepada orang-orang Lewi 5.000 hewan untuk kurban Paskah[a] dan 500 ekor sapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “untuk Paskah-Paskah.” Bentuk jamak Ibrani ini tampaknya menunjuk hewan-hewan yang ditetapkan sebagai kurban Paskah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כונניהו
  choice: Konanya
  rationale: Nama diri dialihaksarakan dalam bentuk Indonesia yang lazim untuk nama Ibrani Alkitabiah.
- source_word: שְׁמַעְיָהוּ
  choice: Semaya
  rationale: Alih aksara Indonesia yang natural dan mudah dibaca.
- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Mempertahankan bentuk nama Ibrani dan membedakannya dari bentuk Perjanjian Baru yang lebih dikenal.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Istilah kekerabatan maskulin diterjemahkan secara langsung; susunan kalimat menunjukkan Semaya dan Netaneel sebagai saudara-saudara Konanya.
- source_word: חֲשַׁבְיָהוּ
  choice: Hasabya
  rationale: Alih aksara Indonesia yang natural untuk nama Ibrani.
- source_word: יעיאל
  choice: Yeiel
  rationale: Alih aksara yang mempertahankan bunyi awal nama Ibrani.
- source_word: יוֹזָבָד
  choice: Yozabad
  rationale: Alih aksara yang mempertahankan bunyi awal nama Ibrani.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: para pemimpin orang Lewi
  rationale: שָׂרִים menunjuk para pejabat atau pemimpin; bentuk ini jelas dan wajar dalam bahasa Indonesia modern tanpa nuansa arkais dari 'pangeran'.
- source_word: הֵרִימוּ
  choice: menyumbangkan
  rationale: Bentuk Hifil dari רום dalam konteks ini berarti memberikan sebagai sumbangan; 'menyumbangkan' cocok dengan konteks penyediaan hewan perayaan.
- source_word: לַלְוִיִּם
  choice: kepada orang-orang Lewi
  rationale: Preposisi ל menandai penerima sumbangan.
- source_word: לַפְּסָחִים
  choice: untuk kurban Paskah
  rationale: Bentuk jamak dalam konteks persembahan menunjuk hewan-hewan yang disediakan bagi perayaan atau kurban Paskah, bukan beberapa hari raya yang berbeda.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: 5.000 hewan ... dan 500 ekor sapi
  rationale: 'Mencerminkan dua jumlah dalam teks Ibrani: 5.000 hewan yang diperuntukkan bagi kurban Paskah dan 500 ekor בקר, yaitu sapi.'
