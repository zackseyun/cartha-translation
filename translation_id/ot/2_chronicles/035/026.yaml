base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: id
  text: 'Selebihnya dari riwayat Yosia dan perbuatan-perbuatan kasih setianya[a], seperti yang tertulis dalam Taurat Yahweh:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan-perbuatan setianya,” “tindakan-tindakan loyalnya,” atau “kebaikan-kebaikannya.” Istilah Ibrani yang digunakan dapat menyatakan kebaikan, loyalitas, atau kesetiaan dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: Selebihnya dari riwayat Yosia
  rationale: Dalam rumus rangkuman kerajaan, דִּבְרֵי menunjuk pada perkara, tindakan, atau riwayat seorang raja, bukan hanya perkataannya. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencakup catatan tentang tindakan Yosia.
- source_word: וַחֲסָדָיו
  choice: dan segala perbuatan kasih setianya
  rationale: Bentuk jamak חֲסָדָיו menggambarkan tindakan-tindakan Yosia yang mencerminkan חֶסֶד. 'Kasih setia' mempertahankan cakupan makna kebaikan, loyalitas, dan kesetiaan dalam hubungan perjanjian, sedangkan 'segala perbuatan' menghasilkan ungkapan Indonesia yang wajar.
- source_word: כַּכָּתוּב
  choice: seperti yang tertulis
  rationale: Menerjemahkan gabungan כ dengan partisip pasif secara ringkas dan alami.
- source_word: בְּתוֹרַת
  choice: dalam Taurat
  rationale: Dalam konteks ini תּוֹרָה merujuk pada hukum atau pengajaran tertulis yang berotoritas. 'Taurat' merupakan istilah baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna חֶסֶד ketika dikenakan kepada Yosia
  choice: segala perbuatan kasih setianya
  alternative: segala perbuatan setianya; segala kebaikannya; tindakan-tindakan loyalnya
  rationale: Pilihan ini mempertahankan bobot relasional dan kemungkinan nuansa perjanjian dari חֶסֶד tanpa membatasi maknanya hanya pada kebaikan moral atau secara berlebihan menjelaskan hubungan perjanjian.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi 'Yahweh' mempertahankan fungsi יהוה sebagai nama pribadi Allah Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ayat mempertahankan bentuk rangkuman historiografis serta tanda titik dua karena kalimat berlanjut ke ayat berikutnya.
