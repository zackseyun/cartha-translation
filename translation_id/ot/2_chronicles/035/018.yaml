  terminology: “Paskah,” “Nabi Samuel,” “Yosia,” “orang-orang Lewi,” “Yehuda,” dan “Yerusalem” konsisten, jelas, dan lazim dalam bahasa Indonesia modern. Catatan b dengan tepat menjelaskan “orang-orang Israel yang hadir” tanpa menjadikan penjelasan itu bagian dari teks utama.
