id: 2CH.35.18
reference: 2 Chronicles 35:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: id
  text: Tidak pernah dirayakan Paskah seperti itu di Israel sejak zaman Nabi Samuel[a], dan tidak seorang pun dari semua raja Israel pernah merayakan Paskah seperti yang dirayakan Yosia bersama para imam, orang-orang Lewi, seluruh Yehuda, orang-orang Israel yang hadir[b], dan penduduk Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “Tidak pernah diperingati Paskah seperti ini di Israel sejak zaman Nabi Samuel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Israel yang didapati,” yaitu orang-orang Israel yang hadir pada perayaan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: dirayakan / merayakan
  rationale: Dalam konstruksi dengan פֶסַח, verba עשה secara idiomatis berarti melaksanakan atau merayakan Paskah, bukan membuatnya. Bentuk pasif pada klausa pertama dipertahankan dengan 'dirayakan'.
- source_word: פֶסַח
  choice: Paskah
  rationale: Dalam konteks ini istilah tersebut menunjuk pada perayaan Paskah secara keseluruhan, bukan hanya kurban Paskah.
- source_word: כָּמֹהוּ
  choice: seperti itu
  rationale: Sufiks pronominal merujuk pada perayaan Paskah tersebut. 'Seperti itu' alami dalam bahasa Indonesia dan mempertahankan rujukan komparatifnya.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi ב bersifat lokatif atau korporatif; 'di Israel' mempertahankan cakupan nasionalnya.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: sejak zaman Nabi Samuel
  rationale: מִן bersama 'hari-hari/zaman' menandai titik awal perbandingan retrospektif. 'Sejak zaman' merupakan ungkapan Indonesia yang wajar.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא
  choice: dan tidak seorang pun dari semua raja Israel
  rationale: Susunan Ibrani 'semua ... tidak' menyatakan penyangkalan menyeluruh. Rumusan ini menghindari ambiguitas cakupan yang dapat timbul dari terjemahan harfiah.
- source_word: אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ
  choice: seperti yang dirayakan Yosia
  rationale: Klausa relatif dan perbandingannya dipertahankan secara alami, sementara idiom עשה + פסח diterjemahkan 'merayakan Paskah'.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: bersama para imam, orang-orang Lewi
  rationale: Deretan sesudah Yosia menyebut para peserta perayaan. 'Bersama' memperjelas hubungan mereka dengan Yosia tanpa mengubah isi.
- source_word: וְכָל יְהוּדָה
  choice: seluruh Yehuda
  rationale: Terjemahan langsung dan alami bagi sebutan kolektif wilayah atau bangsa tersebut.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: orang-orang Israel yang hadir
  rationale: Partisipel הַנִּמְצָא menunjuk pada bagian dari Israel yang didapati atau hadir pada kesempatan itu. Bentuk kolektif dijadikan jamak alami dalam bahasa Indonesia.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: dan penduduk Yerusalem
  rationale: Padanan ringkas dan baku bagi ungkapan partisipial yang berarti mereka yang tinggal di Yerusalem.
theological_decisions:
- issue: Perbandingan historis dengan perayaan-perayaan Paskah sebelumnya
  choice: Teks menyatakan bahwa tidak ada Paskah seperti Paskah Yosia sejak zaman Samuel, tanpa menentukan dalam terjemahan apakah perbandingan itu mutlak atau terutama bersifat kualitatif.
  alternative: Memahami pernyataan itu sebagai klaim historis mutlak bahwa tidak ada perayaan yang sebanding sama sekali antara zaman Samuel dan Yosia, atau sebagai penekanan retoris atas keunikan mutunya.
  rationale: Bahasa Ibrani menyatakan perbandingan secara kuat lalu menyebut semua raja Israel. Terjemahan mempertahankan ketegangan tersebut dan tidak memasukkan harmonisasi dengan perayaan Paskah lain, seperti pada zaman Hizkia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Merayakan Paskah' dipilih sebagai ungkapan yang mudah dipahami dan idiomatis. Nama kelompok 'orang-orang Lewi' dan 'orang-orang Israel' digunakan agar alami bagi pembaca umum. Semua penanda catatan kaki muncul dalam teks utama.
