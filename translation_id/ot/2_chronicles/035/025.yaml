revisions:
- from: Yeremia meratapi Yosia. Sampai hari ini, semua penyanyi laki-laki dan perempuan menyebut Yosia dalam nyanyian-nyanyian ratapan mereka. Mereka menetapkan nyanyian-nyanyian itu sebagai suatu ketetapan di Israel. Sesungguhnya, nyanyian-nyanyian itu tercatat dalam Kitab Nyanyian Ratapan.[a]
  to: Yeremia meratapi Yosia. Sampai hari ini, semua penyanyi laki-laki dan perempuan menyebut Yosia dalam ratapan mereka. Mereka menetapkan ratapan- ratapan itu sebagai suatu ketetapan di Israel. Lihatlah, semuanya tercatat di antara nyanyian-nyanyian ratapan[a].
  rationale: Revisi menghindari penyamaan yang tidak pasti dengan kitab kanonik Ratapan, sambil tetap membuka kemungkinan bahwa הַקִּינוֹת adalah nama atau sebutan bagi suatu kumpulan tertentu. “Lihatlah” mempertahankan penanda perhatian dalam Ibrani, dan pengulangan dikurangi agar lebih alami dalam bahasa Indonesia modern.
