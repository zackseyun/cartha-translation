  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan “nyanyian-nyanyian itu” dipakai untuk memperjelas rujukan pronomina jamak Ibrani, sedangkan “Sampai hari ini” ditempatkan di awal kalimat agar keberlanjutan kebiasaan terbaca alami.
