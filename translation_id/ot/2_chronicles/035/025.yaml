  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: id
  text: Yeremia meratapi Yosia. Sampai hari ini, semua penyanyi laki-laki dan perempuan menyebut Yosia dalam ratapan mereka. Mereka menetapkan ratapan- ratapan itu sebagai suatu ketetapan di Israel. Lihatlah, semuanya tercatat di antara nyanyian-nyanyian ratapan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam Ratapan,” jika frasa ini merujuk kepada suatu kumpulan ratapan tertentu yang dikenal, bukan kepada nyanyian-nyanyian ratapan secara umum.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: meratapi
  rationale: Kata kerja קונן menyatakan tindakan mengucapkan atau menyanyikan ratapan bagi orang yang meninggal. “Meratapi” alami dalam bahasa Indonesia dan tidak memastikan apakah Yeremia menggubah atau hanya membawakan ratapan itu.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: Yosia
  rationale: 'Dengan verba “meratapi,” preposisi עַל terserap secara alami ke dalam konstruksi transitif bahasa Indonesia: “meratapi Yosia.”'
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: semua penyanyi laki-laki dan perempuan
  rationale: Kedua bentuk partisip dari שׁיר secara eksplisit membedakan penyanyi laki-laki dan perempuan; terjemahan ini mempertahankan pembedaan tersebut dan menghindari salah tafsir הַשָּׁרִים sebagai para pembesar.
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: Sampai hari ini ... menyebut
  rationale: Walaupun וַיֹּאמְרוּ secara bentuk berada dalam rangkaian naratif, frasa “sampai hari ini” menunjukkan praktik yang terus berlangsung. Susunan dan kala tak bertanda dalam bahasa Indonesia menyampaikan keberlanjutan itu secara alami.
- source_word: בְּקִינוֹתֵיהֶם
  choice: dalam nyanyian-nyanyian ratapan mereka
  rationale: קִינוֹת adalah ratapan atau kidung dukacita bagi orang mati. “Nyanyian-nyanyian ratapan” jelas bagi pembaca modern dan sesuai dengan konteks para penyanyi.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: Mereka menetapkan nyanyian-nyanyian itu sebagai suatu ketetapan di Israel
  rationale: Pronomina jamak diperjelas sebagai nyanyian-nyanyian ratapan. חֹק dapat berarti ketetapan atau kebiasaan yang ditetapkan; “ketetapan” mempertahankan kekuatan formal istilah itu tanpa menentukan bentuk hukumnya.
- source_word: וְהִנָּם
  choice: Sesungguhnya
  rationale: Ungkapan ini menarik perhatian dan menegaskan pernyataan berikutnya. “Sesungguhnya” mempertahankan nuansa tersebut dalam ragam naratif yang bermartabat.
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: tercatat dalam Kitab Nyanyian Ratapan
  rationale: Frasa tersebut mungkin menunjuk kepada suatu kumpulan ratapan yang dikenal, sehingga diterjemahkan sebagai judul koleksi. Kemungkinan bahwa ungkapan itu bersifat umum tetap dipertahankan dalam catatan kaki.
