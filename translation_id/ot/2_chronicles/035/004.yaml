base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: id
  text: Bersiaplah menurut kaum keluarga dari pihak ayah kalian dan sesuai dengan kelompok-kelompok kalian, sebagaimana ditetapkan dalam tulisan Daud, raja Israel, dan dalam tulisan Salomo, anaknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: Bersiaplah
  rationale: Bentuk imperatif jamak Hifil dari כון menuntut tindakan mempersiapkan atau menata diri. “Bersiaplah” alami dalam bahasa Indonesia dan cocok dengan konteks penataan pelayanan.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: menurut kaum keluarga leluhur kalian
  rationale: בֵית אָבוֹת menunjuk pada satuan keluarga berdasarkan garis leluhur pihak ayah. “Kaum keluarga leluhur” menyampaikan struktur sosial historis itu tanpa memakai ungkapan harfiah yang kaku.
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: sesuai dengan kelompok-kelompok tugas kalian
  rationale: מַחְלְקוֹת adalah pembagian atau kelompok yang mendapat giliran/tugas, khususnya dalam organisasi imam dan orang Lewi. Pilihan ini lebih jelas bagi pembaca modern daripada “rombongan-rombongan” atau “giliran-giliran” saja.
- source_word: בִּכְתָב
  choice: sebagaimana ditetapkan dalam tulisan
  rationale: כְּתָב berarti tulisan atau dokumen, sedangkan ב dalam konteks ini menunjukkan kesesuaian dengan sumber tertulis yang berwenang. “Sebagaimana ditetapkan dalam tulisan” mengungkapkan fungsi tersebut tanpa mengubah tulisan itu menjadi sekadar tradisi lisan.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: Daud, raja Israel
  rationale: Terjemahan langsung dan wajar dari gelar kerajaan yang berbentuk aposisi.
- source_word: וּבְמִכְתַּב
  choice: dan dalam tulisan
  rationale: מִכְתָּב juga berarti tulisan atau dokumen. Frasa ini mempertahankan penyebutan sumber tertulis kedua tanpa pengulangan yang berlebihan.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: Salomo, anaknya
  rationale: Aposisi ini menyatakan bahwa Salomo adalah anak Daud; sufiks orang ketiga tunggal dipertahankan secara alami dengan “anaknya”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” sesuai dengan imperatif dan sufiks jamak Ibrani. Diksi dibuat khidmat tetapi mudah dipahami; istilah organisasi Lewi dijelaskan secara fungsional dan alternatif literal dipertahankan dalam catatan kaki.
