base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: id
  text: Para pemanah memanah Raja Yosia, lalu raja berkata kepada hamba-hambanya, “Bawalah aku pergi, sebab aku terluka[a] parah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “terluka” juga dapat berarti menjadi lemah atau sakit; dalam konteks pertempuran ini, makna “terluka” lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ
  choice: memanah
  rationale: Bentuk Hifil dari ירה dalam konteks pertempuran berarti menembak dengan senjata proyektil; bersama הַיֹּרִים, bahasa Indonesia yang alami adalah ‘memanah’.
- source_word: הַיֹּרִים
  choice: para pemanah
  rationale: Partisipel ini secara harfiah menunjuk kepada orang-orang yang menembak; dalam konteks perang kuno, ‘para pemanah’ merupakan padanan idiomatis dan tepat.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: Raja Yosia
  rationale: Preposisi ל menandai sasaran tindakan memanah. Dalam bahasa Indonesia, sasaran itu wajar dinyatakan sebagai objek langsung.
- source_word: הַעֲבִירוּנִי
  choice: Bawalah aku pergi dari sini
  rationale: Bentuk kausatif dari עבר berarti membuat seseorang berpindah atau berlalu. Ungkapan ini menyampaikan permintaan agar Yosia dipindahkan dari tempat pertempuran tanpa menentukan bahwa ia harus digotong.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya; ‘sebab’ sesuai dengan tutur langsung yang bermartabat.
- source_word: הָחֳלֵיתִי מְאֹד
  choice: aku terluka parah
  rationale: חלה dapat berarti menjadi lemah atau sakit, tetapi setelah Yosia terkena tembakan dalam pertempuran, konteks mendukung arti terluka; מְאֹד menyatakan tingkat yang berat.
