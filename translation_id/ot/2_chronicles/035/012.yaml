  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: id
  text: Mereka memisahkan kurban bakaran untuk memberikannya kepada kelompok-kelompok kaum keluarga, kepada anak-anak umat[a], agar mereka mempersembahkannya kepada Yahweh, seperti yang tertulis dalam Kitab Musa. Demikian pula mereka lakukan terhadap ternak sapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berarti “anak-anak lelaki umat.” Ini adalah ungkapan berbasis kekerabatan bagi masyarakat umum, yang dibedakan dari para imam dan orang Lewi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: Mereka memisahkan
  rationale: Bentuk hifil dari סור menyatakan tindakan menyingkirkan atau memisahkan sesuatu dari tempat atau kumpulannya. Dalam konteks penyiapan kurban, “memisahkan” secara alami menunjukkan bahwa bagian kurban bakaran dipisahkan untuk dibagikan.
- source_word: הָעֹלָה
  choice: bagian-bagian kurban bakaran
  rationale: Kata עֹלָה berbentuk tunggal tetapi dapat bermakna kolektif. Konteksnya menunjukkan bagian-bagian yang dipisahkan dari banyak hewan kurban agar kemudian dipersembahkan sebagai kurban bakaran; frasa ini menghindari kesan bahwa seluruh kurban bakaran telah dipersembahkan lalu dibagikan.
- source_word: לְתִתָּם
  choice: untuk dibagikan
  rationale: Secara harfiah berarti “untuk memberikan mereka”; dalam rangkaian prosedural ini, “dibagikan” mengungkapkan tujuan pemberian kepada berbagai kelompok tanpa menambahkan penerima baru.
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: menurut kelompok keluarga leluhur
  rationale: מִפְלַגּוֹת menunjuk pada pembagian atau kelompok, sedangkan בֵית אָבוֹת adalah satuan kekerabatan berdasarkan keluarga leluhur. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan struktur sosial teks.
- source_word: לִבְנֵי הָעָם
  choice: kepada umat
  rationale: Secara harfiah “kepada anak-anak lelaki umat/bangsa,” tetapi ungkapan berbasis kekerabatan ini merujuk secara kolektif kepada masyarakat umum, yang dibedakan dari para imam dan orang Lewi. “Umat” menyampaikan rujukan kolektif tersebut; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְהַקְרִיב לַיהוָה
  choice: supaya dipersembahkan kepada Yahweh
  rationale: Dalam konteks kurban, הקריב berarti membawa mendekat atau mempersembahkan. Bentuk pasif idiomatis ini mempertahankan tujuan pembagian, sedangkan nama ilahi יהוה ditransliterasikan “Yahweh.”
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: seperti yang tertulis dalam Kitab Musa
  rationale: Formula ini menunjuk kepada petunjuk tertulis yang dikaitkan dengan Musa. “Kitab Musa” merupakan padanan langsung dan wajar.
- source_word: וְכֵן לַבָּקָר
  choice: Mereka melakukan hal yang sama dengan sapi-sapi
  rationale: Ibrani menyampaikan klausa eliptis, “dan demikian juga terhadap sapi.” Terjemahan ini melengkapi unsur verbal yang tersirat agar jelas dalam bahasa Indonesia tanpa menentukan lebih jauh rincian tindakannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan mengikuti kebijakan proyek.
- issue: Ungkapan bergender לִבְנֵי הָעָם
  choice: umat, dengan bentuk harfiah dijelaskan dalam catatan kaki
  alternative: anak-anak lelaki umat atau rakyat biasa
  rationale: Walaupun bentuk gramatikalnya maskulin dan secara harfiah berarti “anak-anak lelaki umat,” ungkapan itu bersifat kolektif dan membedakan masyarakat umum dari petugas kultis. Terjemahan utama yang sangat harfiah akan terdengar seolah hanya laki-laki yang dimaksud; catatan kaki mempertahankan bentuk sumber dan nuansa sosialnya.
- issue: Identitas הָעֹלָה dalam prosedur kurban Paskah
  choice: bagian-bagian kurban bakaran
  alternative: kurban-kurban bakaran
  rationale: Konteks dan petunjuk Taurat mendukung pengertian bahwa bagian yang harus dibakar seluruhnya dipisahkan dari hewan-hewan Paskah untuk diberikan kepada kelompok umat agar dipersembahkan. Pilihan ini memperjelas acuan kolektif tanpa menetapkan rincian ritual melebihi teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “kurban bakaran,” “keluarga leluhur,” dan “Kitab Musa” mempertahankan corak kitabiah tanpa menjadi kaku. Klausa terakhir dibuat eksplisit secukupnya agar elipsis Ibrani dapat dipahami pembaca umum.
