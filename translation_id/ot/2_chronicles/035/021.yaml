  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: id
  text: Namun, Nekho mengirim utusan kepadanya dengan pesan, “Apa urusanku denganmu, raja Yehuda? Hari ini aku datang bukan untuk melawanmu, melainkan terhadap rumah yang sedang kuperangi.[a] Allah telah menyuruhku bergegas. Berhentilah melawan Allah yang menyertaiku, supaya Dia tidak membinasakanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat peperanganku”; atau “rumah/kerajaan yang sedang kuperangi.” Frasa Ibraninya sulit dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada wakil manusia yang diutus Nekho, bukan makhluk surgawi.
- source_word: מַה לִּי וָלָךְ
  choice: Apa urusanku denganmu
  rationale: Ungkapan idiomatis ini menyatakan bahwa kedua pihak tidak mempunyai urusan atau pertikaian yang relevan; terjemahan ini alami dalam bahasa Indonesia tanpa menambahkan permusuhan.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: Hari ini aku datang bukan untuk melawanmu
  rationale: Teks Ibrani bersifat eliptis. Penambahan kata 'datang' menjelaskan maksud dalam konteks gerakan militer tanpa mengubah isinya.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: untuk melawan kerajaan yang sedang kuperangi
  rationale: Frasa Ibrani sulit dan secara harfiah memakai 'rumah'. Dalam konteks perang, 'rumah' kemungkinan menunjuk pada kerajaan, dinasti, atau kekuasaan yang menjadi sasaran perang. Ketidakpastian tetap dicatat dalam catatan kaki.
- source_word: וֵאלֹהִים
  choice: Allah
  rationale: Kata kerja tunggal אָמַר mendukung makna tunggal, dan ayat berikutnya membingkai perkataan Nekho sebagai perkataan yang berasal dari Allah.
- source_word: לְבַהֲלֵנִי
  choice: menyuruhku bergegas
  rationale: Bentuk ini menyampaikan desakan untuk bergerak dengan segera; pilihan tersebut alami dan mempertahankan nuansa urgensi.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: Berhentilah melawan Allah
  rationale: Ungkapan ini meminta Yosia berhenti menghalangi atau menentang tindakan Allah. 'Melawan' menyampaikan daya peringatannya secara jelas.
- source_word: אֲשֶׁר עִמִּי
  choice: yang menyertaiku
  rationale: Pilihan ini mempertahankan pernyataan bahwa Allah berada bersama Nekho tanpa menjelaskan lebih jauh sifat dukungan itu.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: supaya Dia tidak membinasakanmu
  rationale: Klausa ini menyatakan akibat yang hendak dihindari. 'Membinasakan' sesuai dengan kerasnya ancaman dalam konteks militer.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam perkataan Nekho
  choice: Diterjemahkan 'Allah' dalam bentuk tunggal
  alternative: allah/dewa atau para dewa
  rationale: Kata kerja tunggal mendukung rujukan tunggal. Selain itu, 2 Tawarikh 35:22 menyatakan bahwa perkataan ini berasal dari mulut Allah, sehingga narator menyajikannya sebagai peringatan ilahi yang nyata.
- issue: Makna בֵּית מִלְחַמְתִּי
  choice: kerajaan yang sedang kuperangi
  alternative: tempat peperanganku; rumah yang sedang kuperangi; dinasti yang sedang kuperangi
  rationale: Konteks mendukung sasaran politik atau militer, tetapi frasa Ibraninya tidak lazim. Teks utama dibuat wajar dalam bahasa Indonesia, sedangkan ketidakpastian leksikal dipertahankan dalam catatan kaki.
- issue: Makna Allah 'menyertai' Nekho
  choice: Mempertahankan ungkapan 'Allah yang menyertaiku'
  alternative: Allah yang memihakku atau Allah yang bersamaku dalam perkara ini
  rationale: Terjemahan ini tidak melampaui klaim teks mengenai kehadiran atau dukungan ilahi dan membiarkan ketegangan naratif tetap ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama Nekho disebut untuk memperjelas subjek pronominal dari konteks ayat sebelumnya. Ungkapan idiomatis dibuat alami, sedangkan ambiguitas frasa tentang sasaran perang dicatat secara terbuka.
