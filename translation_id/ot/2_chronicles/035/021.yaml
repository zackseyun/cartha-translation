    rationale: Konstruksi ini dapat dipahami, tetapi “mengirim utusan kepadanya dengan pesan” lebih idiomatis dalam bahasa Indonesia modern dan tetap mencerminkan pengiriman para utusan yang menyampaikan perkataan.
