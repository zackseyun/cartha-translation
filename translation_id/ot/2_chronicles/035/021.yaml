  naturalness: Teks umumnya baku dan alami. “Mengirim utusan kepadanya untuk berkata” kurang idiomatis dalam bahasa Indonesia; “mengirim utusan kepadanya dengan pesan” lebih lancar. “Rumah yang sedang kuperangi” memang agak tidak lazim, tetapi kelaziman terbatas itu diperlukan untuk tidak menyelesaikan ketidakpastian frasa Ibrani secara berlebihan.
  terminology: “Allah” tepat, karena verba Ibrani berbentuk tunggal dan bingkai naratif ayat berikutnya mendukung pembacaan ini. “Menyertaiku” mempertahankan makna yang tidak terlalu ditafsirkan. Nama “Nekho” dapat dipertahankan sebagai penjelasan subjek dari konteks.
