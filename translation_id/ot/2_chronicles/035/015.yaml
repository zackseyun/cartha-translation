source:
  edition: WLC
  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: id
  text: Para penyanyi, yaitu keturunan Asaf, berada di tempat tugas mereka sesuai dengan perintah Daud, Asaf, Heman, dan Yedutun, pelihat raja[a]. Para penjaga pintu berada di setiap pintu gerbang. Mereka tidak perlu meninggalkan tugas mereka[b], karena saudara-saudara mereka, orang-orang Lewi, telah menyiapkan bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “pelihat raja” paling alami menerangkan Yedutun.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Mereka tidak boleh meninggalkan tugas mereka.” Bahasa Ibraninya dapat dipahami dengan daya yang lebih kuat, tetapi klausa berikutnya mendukung pengertian bahwa mereka tidak perlu pergi karena orang-orang Lewi telah menyiapkan bagi mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: para penyanyi
  rationale: Bentuk partisip dari שׁיר menunjuk kepada orang-orang yang bertugas menyanyi; pilihan ini lebih tepat daripada istilah yang lebih luas seperti “para pemusik”.
- source_word: בְּנֵי אָסָף
  choice: keturunan Asaf
  rationale: Secara harfiah berarti “anak-anak Asaf”, tetapi dalam konteks ini menunjuk kepada garis keturunan atau kelompok pelayanan yang berasal dari Asaf. “Keturunan Asaf” lebih jelas dalam bahasa Indonesia modern.
- source_word: עַל מַעֲמָדָם
  choice: berada di tempat tugas mereka
  rationale: מַעֲמָד dapat berarti tempat berdiri, posisi, atau tempat penugasan. Ungkapan ini menyampaikan penempatan mereka dalam tata pelayanan Bait Allah secara alami.
- source_word: כְּמִצְוַת
  choice: sesuai dengan perintah
  rationale: מִצְוָה di sini adalah arahan yang berwenang; “perintah” mempertahankan kekuatan istilah tersebut.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: pelihat raja
  rationale: חוֹזֶה adalah istilah teknis bagi seorang pelihat. “Pelihat” mempertahankan nuansa historisnya dan tidak menyamakannya begitu saja dengan istilah yang lebih umum, “nabi”.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu
  rationale: Dalam konteks Bait Allah, istilah ini menunjuk kepada petugas yang menjaga pintu-pintu gerbang.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: di setiap pintu gerbang
  rationale: Ungkapan distributif Ibrani ini menunjukkan bahwa para penjaga ditempatkan pada masing-masing pintu gerbang.
- source_word: אֵין לָהֶם לָסוּר
  choice: mereka tidak perlu meninggalkan
  rationale: Konstruksi אֵין dengan infinitif di sini paling wajar menyatakan tidak adanya keperluan untuk pergi, sebagaimana dijelaskan oleh klausa sebab sesudahnya.
- source_word: מֵעַל עֲבֹדָתָם
  choice: tugas mereka
  rationale: עֲבֹדָה dalam konteks ibadah menunjuk kepada pelayanan atau tugas resmi. “Tugas” cocok dengan penempatan kerja yang disebut sebelumnya.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: saudara-saudara mereka, orang-orang Lewi
  rationale: Terjemahan ini mempertahankan sebutan kekerabatan eksplisit “saudara-saudara mereka” serta aposisi “orang-orang Lewi”.
- source_word: הֵכִינוּ לָהֶם
  choice: telah menyiapkan keperluan mereka
  rationale: הכין berarti menyiapkan atau membuat siap. Bahasa Ibrani tidak menyebut objeknya; “keperluan mereka” mengungkapkan objek tersirat secara alami tanpa menentukan secara sempit apa yang disiapkan.
theological_decisions:
- issue: Keterkaitan sintaksis frasa “pelihat raja”
  choice: 'Frasa itu menerangkan Yedutun: “Yedutun, pelihat raja.”'
  alternative: Frasa itu dapat dipahami secara lebih longgar sebagai keterangan yang berkaitan dengan daftar tokoh sebelumnya.
  rationale: Frasa konstruk tunggal חוֹזֵה הַמֶּלֶךְ paling alami melekat pada nama diri tunggal yang langsung mendahuluinya, yaitu Yedutun. Catatan kaki mempertahankan transparansi atas keterkaitan ini.
- issue: Daya ungkap “mereka tidak perlu meninggalkan”
  choice: Klausa tersebut menyatakan tidak adanya keperluan untuk meninggalkan tugas.
  alternative: 'Klausa itu dapat dipahami lebih kuat sebagai larangan atau kewajiban: “Mereka tidak boleh meninggalkan tugas mereka.”'
  rationale: Konstruksi אֵין + ל dengan infinitif dapat mengungkapkan tidak adanya keperluan atau kesempatan. Klausa sebab berikutnya—orang-orang Lewi menyiapkan keperluan mereka—mendukung makna deskriptif bahwa mereka tidak perlu pergi.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Nama-nama ditulis menurut bentuk Indonesia yang lazim: Daud, Asaf, Heman, Yedutun, dan Lewi. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskan.'
