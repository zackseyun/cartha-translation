source:
  edition: WLC
  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: id
  text: Namun, Yosia tidak memalingkan wajahnya darinya[a]. Sebaliknya, ia menyamar untuk berperang melawannya. Ia tidak mendengarkan perkataan Nekho yang berasal dari mulut Allah[b], kemudian ia datang untuk berperang di Lembah Megido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak berpaling darinya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari mulut Allah”; dapat juga diterjemahkan “dari Allah.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “di Dataran Megido.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: tidak memalingkan wajahnya dari dia
  rationale: Mempertahankan gambaran harfiah tentang memalingkan wajah, tetapi tetap mudah dipahami dalam bahasa Indonesia. Ungkapan ini dalam konteks berarti Yosia tidak mengundurkan diri atau berpaling dari Nekho.
- source_word: כִּי
  choice: Sebaliknya
  rationale: 'Dalam konteks ini כִּי menjelaskan tindakan Yosia yang berlawanan dengan berpaling: ia justru menyamar untuk bertempur. ''Sebaliknya'' menyampaikan hubungan wacana itu secara alami.'
- source_word: לְהִלָּחֵם בּוֹ
  choice: untuk berperang melawannya
  rationale: Infinitif menyatakan tujuan, sedangkan pronomina dengan בּ menunjuk kepada Nekho sebagai lawan dalam pertempuran.
- source_word: הִתְחַפֵּשׂ
  choice: menyamar
  rationale: Bentuk Hitpael berarti menyamarkan diri. Dalam bahasa Indonesia, 'ia menyamar' sudah secara alami menyatakan tindakan refleksif.
- source_word: שָׁמַע אֶל
  choice: mendengarkan
  rationale: Pilihan ini mempertahankan cakupan ungkapan Ibrani tanpa mempersempitnya menjadi 'menaati', meskipun konteks menyiratkan bahwa Yosia tidak mengindahkan perkataan itu.
- source_word: דִּבְרֵי נְכוֹ
  choice: perkataan Nekho
  rationale: '''Perkataan'' dekat dengan bentuk jamak דִּבְרֵי dan tidak menambahkan tafsiran seperti ''pesan''.'
- source_word: מִפִּי אֱלֹהִים
  choice: yang berasal dari mulut Allah
  rationale: Mempertahankan idiom Ibrani 'dari mulut Allah' serta menunjukkan hubungan sintaksisnya dengan perkataan Nekho, tanpa menjelaskan lebih jauh cara penyampaian ilahi tersebut.
- source_word: וַיָּבֹא
  choice: lalu datang
  rationale: Menerjemahkan verba בוא secara langsung dan menghubungkannya secara wajar dengan rangkaian narasi.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: di Lembah Megido
  rationale: בִּקְעָה menunjuk pada lembah yang luas atau dataran lembah. 'Lembah Megido' jelas dan mempertahankan istilah geografis sumber.
theological_decisions:
- issue: Apakah perkataan Nekho disajikan sebagai benar-benar berasal dari Allah
  choice: Teks utama menyatakan bahwa perkataan Nekho berasal 'dari mulut Allah'.
  alternative: Ungkapan itu dapat dibuat lebih umum menjadi 'berasal dari Allah'; sebagian penafsir juga mempertanyakan klaim Nekho.
  rationale: Ayat ini sendiri menampilkan perkataan Nekho sebagai berasal dari Allah. Terjemahan mempertahankan pernyataan dan ketegangan teologis tersebut tanpa membenarkan atau menyangkalnya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina dan struktur kalimat dibuat alami, sementara idiom penting 'dari mulut Allah' serta gambaran 'memalingkan wajah' dipertahankan. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
