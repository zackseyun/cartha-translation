  to: Sembelihlah hewan kurban Paskah[a], sucikanlah diri kalian, dan adakanlah persiapan bagi saudara-saudara kalian agar mereka dapat melakukannya sesuai dengan firman Yahweh yang disampaikan melalui Musa.
