  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan penyembelihan kurban Paskah, penyucian ritual, nama ilahi Yahweh, dan idiom perantaraan Musa. Namun, bentuk perintah jamak Ibrani tidak dipertahankan dalam "dirimu" dan "saudara-saudaramu", yang berposisi tunggal. Selain itu, "agar firman Yahweh ... dilaksanakan" menggeser tindakan dari melakukan sesuai dengan firman Yahweh menjadi firman itu sendiri yang dilaksanakan, dan mengaburkan hubungan "bagi saudara-saudara kalian" dengan infinitif "untuk melakukan".
  naturalness: Bahasa draf umumnya baku dan khidmat. "Lakukanlah persiapan" dapat dipahami, tetapi "adakanlah persiapan" lebih alami untuk objek yang memang tidak dinyatakan dalam bahasa sumber. Penggunaan "kalian" diperlukan untuk menyatakan sapaan jamak secara jelas dalam bahasa Indonesia modern.
  terminology: '"Hewan kurban Paskah", "sucikanlah", dan "Yahweh" tepat dan tidak memaksakan pembatasan jenis hewan. Catatan kaki a akurat. Tidak diperlukan catatan untuk "melalui Musa", karena ini merupakan pengungkapan idiom yang wajar dan setia.'
