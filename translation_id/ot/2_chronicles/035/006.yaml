  text: וְ/שַׁחֲט֖וּ הַ/פָּ֑סַח וְ/הִתְקַדְּשׁוּ֙ וְ/הָכִ֣ינוּ לַ/אֲחֵי/כֶ֔ם לַ/עֲשׂ֥וֹת כִּ/דְבַר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: id
  text: Sembelihlah hewan kurban Paskah[a], sucikanlah diri kalian, dan adakanlah persiapan bagi saudara-saudara kalian agar mereka dapat melakukannya sesuai dengan firman Yahweh yang disampaikan melalui Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Paskah”. Istilah Ibrani ini dapat menunjuk pada kurban Paskah secara keseluruhan, tetapi di sini secara khusus berarti hewan yang disembelih.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: Sembelihlah
  rationale: Kata kerja שׁחט menunjuk pada penyembelihan hewan dan sangat sesuai dengan konteks kurban; “sembelihlah” mempertahankan nuansa ritual yang tidak terdapat dalam kata umum “bunuhlah”.
- source_word: הַפָּסַח
  choice: hewan kurban Paskah
  rationale: Secara harfiah istilah ini adalah “Paskah”, tetapi di sini yang disembelih ialah hewan kurbannya. “Hewan kurban Paskah” menyatakan rujukan konkret itu tanpa membatasinya hanya pada anak domba, sebab kurban Paskah juga dapat berasal dari kambing.
- source_word: וְהִתְקַדְּשׁוּ
  choice: sucikanlah dirimu
  rationale: Bentuk refleksif ini menunjuk pada penyucian atau persiapan diri untuk pelayanan kudus. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan makna ritualnya.
- source_word: וְהָכִינוּ לַאֲחֵיכֶם
  choice: lakukanlah persiapan bagi saudara-saudaramu
  rationale: Objek kata kerja “menyiapkan” tidak dinyatakan dalam bahasa Ibrani. Bentuk nominal “lakukanlah persiapan” mempertahankan ketidaktersuratannya dan menghasilkan kalimat Indonesia yang wajar.
- source_word: לַאֲחֵיכֶם
  choice: bagi saudara-saudaramu
  rationale: Bahasa Ibrani memakai bentuk maskulin jamak “saudara-saudaramu”. Dalam konteks ini ungkapan tersebut menunjuk pada sesama orang Israel yang dilayani oleh kaum Lewi.
- source_word: לַעֲשׂוֹת כִּדְבַר יְהוָה
  choice: agar firman Yahweh ... dilaksanakan
  rationale: Infinitif לַעֲשׂוֹת tidak menyebutkan subjek pelaksana secara eksplisit. Konstruksi pasif dalam bahasa Indonesia mempertahankan keterbukaan itu sambil menyampaikan tujuan persiapan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: בְּיַד מֹשֶׁה
  choice: yang disampaikan melalui Musa
  rationale: Ungkapan harfiah “dengan/perantaraan tangan Musa” merupakan idiom untuk penyampaian atau perantaraan. “Melalui Musa” mengungkapkan maknanya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan לַאֲחֵיכֶם yang berbentuk maskulin jamak
  choice: saudara-saudaramu
  alternative: sesama orang Israel
  rationale: Terjemahan utama mempertahankan bentuk kekerabatan maskulin yang ada dalam teks, tanpa menutup kemungkinan bahwa dalam konteksnya ungkapan itu merujuk secara lebih luas kepada komunitas Israel.
- issue: Subjek tersirat dalam לַעֲשׂוֹת
  choice: konstruksi pasif “agar firman ... dilaksanakan”
  alternative: agar mereka melaksanakan firman Yahweh; untuk melaksanakan firman Yahweh
  rationale: Bahasa Ibrani tidak secara tegas menyatakan apakah pelakunya kaum Lewi, saudara-saudara mereka, atau keduanya dalam peran masing-masing. Bentuk pasif menghindari penetapan subjek yang tidak dinyatakan.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memuat nama diri ilahi, sehingga “Yahweh” mempertahankannya sebagai nama dan bukan menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah jamak diterjemahkan dengan akhiran -lah; istilah ritual dipertahankan tanpa memakai ungkapan teknis denominasi tertentu. Susunan pasif pada klausa terakhir sengaja menjaga ketidakjelasan subjek dalam teks Ibrani.
