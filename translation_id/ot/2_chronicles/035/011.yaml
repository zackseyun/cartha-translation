base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: id
  text: Mereka menyembelih kurban Paskah[a], lalu para imam memercikkan darah dari tangan mereka[b], sementara orang-orang Lewi menguliti hewan-hewan itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hewan kurban Paskah.” Istilah Ibrani di sini menunjuk pada kurban Paskah yang sedang disembelih.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para imam memercikkan dari tangan mereka.” Yang dipercikkan adalah darah kurban; “mereka” kemungkinan merujuk kepada orang-orang yang menyembelih dan menyerahkan darah itu kepada para imam.
    reason: textual_clarity
  - marker: c
    text: Maksudnya, orang-orang Lewi melepaskan kulit hewan-hewan kurban yang telah disembelih.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: menyembelih
  rationale: Kata שׁחט merupakan istilah lazim untuk penyembelihan hewan, khususnya dalam konteks kurban; “menyembelih” mempertahankan nuansa ritualnya.
- source_word: הַפָּסַח
  choice: kurban Paskah
  rationale: Dalam konteks ini פֶּסַח menunjuk pada hewan kurban Paskah yang disembelih. “Kurban Paskah” tetap alami dan tidak membatasi hewannya menjadi hanya anak domba.
- source_word: וַיִּזְרְקוּ
  choice: memercikkan darah
  rationale: Dalam tata ibadah kurban, זרק menunjuk pada tindakan imam mengenakan darah pada mazbah dengan melemparkan atau memercikkannya; objek “darah” tersirat oleh konteks dan dinyatakan agar jelas dalam bahasa Indonesia.
- source_word: מִיָּדָם
  choice: yang diterima dari tangan mereka
  rationale: Secara harfiah berarti “dari tangan mereka.” Penambahan “yang diterima” mengungkapkan hubungan tindakan secara alami tanpa menetapkan secara eksplisit siapa yang dirujuk oleh pronomina Ibrani.
- source_word: מַפְשִׁיטִים
  choice: menguliti hewan-hewan itu
  rationale: Dalam konteks penyembelihan kurban, פשט berarti melepaskan kulit hewan. Bentuk partisip menunjukkan tindakan yang sedang berlangsung; “sementara” menyampaikan keberlangsungannya bersamaan dengan tindakan para imam.
theological_decisions:
- issue: Cakupan istilah הַפָּסַח
  choice: kurban Paskah
  alternative: anak domba Paskah
  rationale: Teks Ibrani menyebut kurban Paskah tanpa secara leksikal membatasi referennya pada anak domba; pilihan yang lebih luas mempertahankan cakupan sumber.
- issue: Referen pronomina dalam מִיָּדָם
  choice: mempertahankan “mereka” dalam teks dan menjelaskan kemungkinan referennya dalam catatan kaki
  alternative: dari tangan orang-orang Lewi
  rationale: Referen pronomina tidak disebut secara eksplisit dalam ayat ini. Menetapkannya sebagai orang Lewi akan menghilangkan ambiguitas gramatikal yang asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kurban” dipilih sesuai ejaan baku. Struktur kalimat mempertahankan urutan tindakan dalam teks Ibrani, sedangkan “sementara” menyatakan tindakan orang Lewi yang berlangsung bersamaan. Semua penjelasan yang tidak tersurat—objek darah, kemungkinan referen pronomina, dan objek pengulitan—ditangani secara transparan melalui pilihan terjemahan dan catatan kaki.
