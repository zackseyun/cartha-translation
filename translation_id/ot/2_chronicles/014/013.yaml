  naturalness: Teks draf umumnya baku dan jelas, tetapi “kedahsyatan” lazimnya berarti keagungan atau kemegahan, bukan rasa ngeri/panik. “Kengerian yang ditimbulkan oleh Yahweh” lebih tepat dan tetap alami dalam narasi Indonesia modern.
  terminology: Nama Yahweh dipertahankan dengan tepat. “Menjarah” dan “barang jarahan” merupakan padanan yang baik untuk בזז dan ביזה. “Kengerian” membedakan makna פחד dalam konteks ini dari rasa takut hormat.
