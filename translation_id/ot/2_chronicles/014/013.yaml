  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: id
  text: Mereka mengalahkan semua kota di sekitar Gerar, sebab kengerian yang ditimbulkan oleh Yahweh menimpa penduduk kota-kota itu. Mereka menjarah semua kota itu, sebab di dalamnya terdapat banyak barang jarahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: mereka menaklukkan
  rationale: Bentuk dari נכה dalam konteks perang menyatakan serangan yang mengalahkan sasaran. Karena objeknya ialah kota-kota, bukan orang-orang yang secara eksplisit disebut, 'menaklukkan' menyampaikan kekalahan kota beserta para pembelanya tanpa menghasilkan ungkapan Indonesia yang janggal seperti 'memukul kota'.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: semua kota di sekitar Gerar
  rationale: '''Kota'' merupakan padanan wajar bagi עָרִים dalam kisah peperangan, sedangkan ''di sekitar Gerar'' menyampaikan סְבִיבוֹת secara alami.'
- source_word: פַחַד יְהוָה
  choice: kedahsyatan dari Yahweh
  rationale: פַחַד di sini bukan rasa takut hormat kepada Allah, melainkan kengerian yang berasal dari atau ditimbulkan oleh Yahweh. Kata 'dari' mempertahankan hubungan konstruksi Ibrani tanpa memaksakan bahwa frasa itu berarti Yahweh sendiri merasa takut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri, bukan diganti dengan gelar 'TUHAN'.
- source_word: עֲלֵיהֶם
  choice: melanda penduduknya
  rationale: Secara harfiah keadaan itu 'ada atas mereka'; 'melanda' mengungkapkan daya yang menimpa, sementara 'penduduknya' memperjelas bahwa pronomina jamak mengacu secara semantis kepada orang-orang di kota-kota tersebut.
- source_word: וַיָּבֹזּוּ
  choice: mereka menjarah
  rationale: בזז dalam konteks perang berarti merampas barang sebagai hasil jarahan; 'menjarah' ringkas dan lazim dalam bahasa Indonesia modern.
- source_word: בִּזָּה רַבָּה
  choice: banyak sekali jarahan
  rationale: בִּזָּה menunjuk pada barang rampasan perang. 'Banyak sekali' menyampaikan רַבָּה secara alami dan kuat.
- source_word: בָהֶם
  choice: di dalamnya
  rationale: Pronomina ini paling wajar merujuk kembali kepada kota-kota; bentuk tunggal kolektif Indonesia 'di dalamnya' sesuai dengan frasa 'semua kota itu'.
theological_decisions:
- issue: Makna פַחַד יְהוָה
  choice: kedahsyatan dari Yahweh
  alternative: rasa takut akan Yahweh
  rationale: Konteks pertempuran menunjukkan kengerian yang menimpa masyarakat sekitar, bukan sikap hormat religius mereka. 'Dari Yahweh' tetap membiarkan hubungan genitifnya cukup terbuka, baik sebagai kedahsyatan yang berasal dari-Nya maupun yang ditimbulkan oleh-Nya.
- issue: Penerjemahan nama יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat mempertahankan kesejajaran narasi Ibrani. Tidak diperlukan catatan kaki karena tidak ada varian tekstual atau ambiguitas yang harus dijelaskan di luar teks utama.
