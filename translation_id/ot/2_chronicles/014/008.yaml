id: 2CH.14.8
reference: 2 Chronicles 14:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א אֲלֵי/הֶ֜ם זֶ֣רַח הַ/כּוּשִׁ֗י בְּ/חַ֨יִל֙ אֶ֣לֶף אֲלָפִ֔ים וּ/מַרְכָּב֖וֹת שְׁלֹ֣שׁ מֵא֑וֹת וַ/יָּבֹ֖א עַד מָרֵשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: id
  text: Zerah, orang Kus itu, maju menyerang mereka dengan pasukan sebesar seribu kali seribu orang[a] dan tiga ratus kereta perang. Ia sampai ke Maresya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "satu juta orang". Secara harfiah, teks Ibrani berbunyi "seribu ribu".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: maju menyerang mereka
  rationale: Dalam kisah peperangan, יָצָא dengan אֶל dapat menyatakan gerak maju untuk bertempur. Pilihan ini mengungkapkan arah yang bermusuhan secara wajar dalam bahasa Indonesia.
- source_word: זֶרַח הַכּוּשִׁי
  choice: Zerah, orang Kus itu
  rationale: כּוּשִׁי adalah sebutan etnogeografis yang berasal dari Kus. 'Orang Kus' mempertahankan istilah Ibrani tanpa menyamakannya secara interpretatif dengan Etiopia modern.
- source_word: בְּחַיִל
  choice: dengan pasukan sebesar
  rationale: חַיִל di sini berarti kekuatan atau pasukan militer. Susunan ini juga menghubungkan kata tersebut secara alami dengan jumlah pasukan yang mengikutinya.
- source_word: אֶלֶף אֲלָפִים
  choice: seribu kali seribu orang
  rationale: Ungkapan Ibrani secara harfiah berarti 'seribu ribu'. 'Seribu kali seribu' dapat dipahami pembaca Indonesia, tetap dekat dengan bentuk sumber, dan tidak secara diam-diam meniadakan kemungkinan bahwa ini merupakan ungkapan bilangan besar.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: dan tiga ratus kereta perang
  rationale: מֶרְכָּבָה dalam konteks militer berarti kereta perang; urutan kata disesuaikan dengan bahasa Indonesia yang alami.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: Ia sampai ke Maresya
  rationale: עַד dengan nama tempat menunjukkan bahwa gerakan mencapai batas atau lokasi tersebut. 'Sampai ke' mempertahankan nuansa ini secara ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan naratif. Nama מָרֵשָׁה ditransliterasikan sebagai 'Maresya' agar mendekati pelafalan Ibrani. Istilah 'orang Kus' dipilih sebagai bentuk etnogeografis yang langsung; penjelasan tambahan tidak diperlukan dalam ayat ini.
