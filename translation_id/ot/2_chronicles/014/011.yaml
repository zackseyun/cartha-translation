id: 2CH.14.11
reference: 2 Chronicles 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: id
  text: Yahweh memukul kalah orang-orang Kus[a] di hadapan Asa dan Yehuda, lalu orang-orang Kus itu melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: orang-orang Etiopia. Istilah etnis dalam bahasa Ibrani adalah “orang-orang Kus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: memukul kalah
  rationale: Dalam konteks pertempuran, נָגַף menyatakan tindakan menghantam hingga mengalahkan lawan. Ungkapan ini mempertahankan daya gambarnya sekaligus menjelaskan hasil militernya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: הַכּוּשִׁים
  choice: orang-orang Kus
  rationale: Menerjemahkan etnonim Ibrani secara langsung dan tidak buru-buru menyamakannya dengan sebutan geografis yang lebih kemudian, yaitu Etiopia.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan ungkapan Ibrani yang dalam laporan pertempuran menggambarkan kekalahan musuh ketika berhadapan dengan Asa dan Yehuda.
- source_word: אָסָא
  choice: Asa
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia; dalam konteks ini menunjuk secara kolektif kepada kerajaan atau rakyat Yehuda.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: Menyampaikan arti langsung נוּס, yaitu lari untuk menyelamatkan diri dari lawan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; bentuk “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Narasi modern, ringkas, dan bermartabat. Pengulangan “orang-orang Kus” dipertahankan sesuai bentuk teks Ibrani; “di hadapan” menjaga idiom sumber tanpa menutup nuansa pertempurannya.
