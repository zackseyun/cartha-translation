  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: id
  text: Ia menyingkirkan mazbah-mazbah asing dan tempat-tempat pemujaan di tempat tinggi, menghancurkan tugu-tugu pemujaan, serta menebang asyerim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: asyerim, yaitu benda-benda kultis yang berkaitan dengan pemujaan Asyera; sering diterjemahkan “tiang-tiang Asyera”. Bentuk persis benda-benda itu tidak diketahui dengan pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Ia menyingkirkan
  rationale: Bentuk kausatif ini berarti membuat sesuatu tersingkir atau membuangnya. “Menyingkirkan” alami dalam bahasa Indonesia dan menggambarkan tindakan reformasi yang konkret tanpa menambahkan gagasan penghapusan secara resmi.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: mazbah-mazbah asing
  rationale: נֵכָר menunjuk pada sesuatu yang asing, khususnya yang terkait dengan ibadah bangsa lain atau ibadah yang tidak sah. “Mazbah-mazbah asing” mempertahankan bentuk ringkas dan nuansa keagamaannya.
- source_word: הַבָּמוֹת
  choice: bukit-bukit pengurbanan
  rationale: בָּמוֹת adalah istilah lazim untuk tempat pemujaan atau tempat pengurbanan, yang kerap berada di tempat tinggi. Ungkapan ini sudah dikenal dalam bahasa Indonesia dan lebih jelas daripada terjemahan harfiah “tempat-tempat tinggi”.
- source_word: וַיְשַׁבֵּר
  choice: menghancurkan
  rationale: Kata שׁבר menyatakan tindakan memecahkan atau meremukkan dengan kuat. “Menghancurkan” menyampaikan tindakan pemusnahan yang tegas secara alami.
- source_word: הַמַּצֵּבוֹת
  choice: tugu-tugu pemujaan
  rationale: מַצֵּבוֹת adalah batu atau pilar tegak yang berfungsi dalam pemujaan. “Tugu-tugu pemujaan” menjelaskan fungsi keagamaannya tanpa menentukan bentuknya secara berlebihan.
- source_word: וַיְגַדַּע
  choice: menebang
  rationale: גדע berarti memotong atau menebang, khususnya sesuatu yang berkayu. “Menebang” sesuai dengan sifat benda pemujaan yang kemungkinan terbuat dari kayu.
- source_word: הָאֲשֵׁרִים
  choice: benda-benda pemujaan Asyera
  rationale: Bentuk jamak ini menunjuk pada objek kultis yang berhubungan dengan Asyera, tetapi bentuk persisnya tidak pasti. Pilihan ini menjaga kaitannya dengan Asyera tanpa secara pasti menyebutnya tiang, pohon, atau patung.
theological_decisions:
- issue: Makna הָאֲשֵׁרִים dalam konteks pembaruan ibadah
  choice: benda-benda pemujaan Asyera
  alternative: tiang-tiang Asyera
  rationale: Istilah Ibrani menunjuk pada benda kultis yang terkait dengan Asyera, tetapi dapat merujuk pada tiang kayu, pohon keramat, atau lambang kultis lain. Terjemahan utama mempertahankan ketidakpastian historis itu, sedangkan sebutan tradisional diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “mazbah” serta “bukit pengurbanan” dipertahankan karena merupakan istilah keagamaan yang ringkas dan dikenal, sedangkan objek Asyera dijelaskan secara transparan agar ambiguitas sumber tidak dihilangkan.
