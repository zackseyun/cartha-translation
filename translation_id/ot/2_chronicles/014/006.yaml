source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: id
  text: Lalu ia berkata kepada orang Yehuda, “Marilah kita membangun kota-kota ini dan mengelilingi kota-kota ini dengan tembok, menara, pintu gerbang, dan palang, selagi negeri ini masih ada di hadapan kita[a], sebab kita telah mencari Yahweh, Allah kita. Kita telah mencari Dia, dan Dia telah memberi kita ketenteraman di segala penjuru.” Maka mereka membangun dan berhasil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga dipahami, “sebab negeri ini masih ada di hadapan kita.” Ungkapan ini dapat menyiratkan bahwa kesempatan masih terbuka atau bahwa negeri itu belum terancam.
    reason: Hubungan klausa dan ungkapan idiomatis Ibrani memungkinkan nuansa temporal maupun kausal, sedangkan “di hadapan kita” dapat menyatakan wilayah yang masih tersedia atau tidak terhalang.
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Lalu ia berkata kepada orang Yehuda
  rationale: Nama tempat Yehuda dipakai secara metonimis untuk penduduk atau rakyatnya. Penambahan 'orang' membuat maksud itu jelas dan alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: נִבְנֶה
  choice: Marilah kita membangun
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan atau tekad bersama. 'Marilah kita' mempertahankan daya hortatifnya tanpa menyiratkan bahwa kota-kota itu sedang dibangun kembali.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota ini
  rationale: עָרִים menunjuk pada permukiman perkotaan dan dalam konteks ini kota-kota yang akan diperkuat.
- source_word: וְנָסֵב
  choice: dan mengelilinginya dengan
  rationale: Bentuk kausatif dari סבב di sini berarti membuat keliling atau mengitari. Susunan ini secara alami menghubungkan tindakan tersebut dengan unsur-unsur pertahanan yang menyusul.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: tembok, menara, pintu gerbang, dan palang
  rationale: Daftar ini menyebut sarana pertahanan kota. חוֹמָה yang berbentuk tunggal dapat berfungsi secara kolektif; דְּלָתַיִם dalam konteks kota adalah pintu gerbang, sedangkan בְרִיחִים adalah palang penguncinya.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: selagi negeri ini masih terbentang di hadapan kita
  rationale: Terjemahan ini mempertahankan unsur waktu 'masih' dan gambaran idiomatis 'di hadapan kita', sambil memakai ungkapan Indonesia yang wajar. Hubungan temporal atau kausalnya tetap dicatat dalam catatan kaki.
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: sebab kita telah mencari Yahweh, Allah kita
  rationale: דרשׁ ketika berobjek Allah mencakup tindakan mencari-Nya dengan kesungguhan, pengabdian, dan ketergantungan, bukan hanya meminta informasi. Bentuk perfektif diterjemahkan 'telah mencari'.
- source_word: דָּרַשְׁנוּ
  choice: Kita telah mencari Dia
  rationale: Pengulangan dalam bahasa Ibrani bersifat tegas dan dipertahankan. 'Dia' mengambil acuan dari Yahweh pada klausa sebelumnya.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: dan Dia telah memberi kita ketenteraman di segala penjuru
  rationale: הניח menyatakan pemberian keadaan tenang atau bebas dari gangguan, sedangkan מִסָּבִיב berarti di sekeliling atau di segala penjuru. Terjemahan tidak menambahkan musuh yang tidak disebut secara eksplisit.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: Maka mereka membangun dan berhasil
  rationale: Rangkaian verba melaporkan hasil tindakan mereka. 'Berhasil' menyampaikan keberhasilan usaha secara alami tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', sehingga nama pribadi yang terdapat dalam teks sumber tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan fungsi nama tersebut dan merupakan transliterasi ilmiah yang lazim tanpa menggantinya dengan gelar.
- issue: Makna mencari Allah dan ketenteraman yang menyusul
  choice: 'Mempertahankan urutan: mereka mencari Yahweh, lalu Dia memberi ketenteraman'
  alternative: Menjelaskannya sebagai rumus sebab-akibat mutlak atau sebagai jasa yang memperoleh imbalan
  rationale: Ayat menghubungkan kedua hal itu secara eksplisit, tetapi tidak menguraikan teori tentang jasa manusia atau mekanisme berkat. Terjemahan mempertahankan hubungan teks tanpa menambahkan sistem teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Orang Yehuda' dipakai agar metonimi nama wilayah mudah dipahami; 'pintu gerbang' dan 'palang' sesuai dengan konteks pertahanan kota. Pengulangan 'Kita telah mencari' dipertahankan untuk mencerminkan penekanan teks Ibrani.
