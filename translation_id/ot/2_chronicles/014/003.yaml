  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: id
  text: Ia berkata kepada Yehuda agar mencari TUHAN, Allah nenek moyang mereka, serta menjalankan Taurat dan perintah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: Ia memerintahkan orang Yehuda
  rationale: Dalam konteks titah raja, אָמַר dengan penerima yang ditandai לְ secara alami menyatakan perintah; “orang Yehuda” memperjelas bahwa Yehuda di sini adalah rakyat/wilayah, bukan seorang leluhur.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה
  choice: untuk mencari TUHAN
  rationale: דָּרַשׁ mempertahankan gagasan berpaling kepada dan sungguh-sungguh mencari Allah; nama perjanjian יהוה ditampilkan menurut konvensi Indonesia sebagai “TUHAN”.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: אָבוֹת dalam konteks kebangsaan menunjuk para leluhur; “nenek moyang” lebih alami dan mencakup makna kolektif daripada “bapa-bapa”.
- source_word: וְלַעֲשׂוֹת הַתּוֹרָה וְהַמִּצְוָה
  choice: serta melakukan hukum Taurat dan perintah-Nya
  rationale: עָשָׂה secara harfiah berarti melakukan/melaksanakan. הַתּוֹרָה diterjemahkan “hukum Taurat”; akhiran “-Nya” pada “perintah” tersirat dari rangkaian yang merujuk kepada TUHAN dan menghasilkan bahasa Indonesia yang alami.
theological_decisions:
- issue: Rujukan יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas tanpa menghapus pembedaan dari אֲדֹנָי dalam bentuk tipografis.
- issue: Relasi antara hukum Taurat dan perintah
  choice: mempertahankan keduanya sebagai “hukum Taurat dan perintah-Nya”
  alternative: meringkas menjadi “segala hukum dan perintah-Nya”
  rationale: Teks Ibrani memakai dua nomina tunggal definit, הַתּוֹרָה וְהַמִּצְוָה; keduanya dipertahankan agar rumusan teologisnya tidak dilebur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, dengan tetap mempertahankan struktur perintah untuk mencari TUHAN dan melakukan ketetapan-Nya.
