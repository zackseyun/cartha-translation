id: 2CH.14.1
reference: 2 Chronicles 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: id
  text: Asa melakukan apa yang baik dan benar di mata Yahweh, Allahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di mata Yahweh”; ungkapan ini berarti “menurut pandangan atau penilaian Yahweh.”
    reason: Menjelaskan idiom Ibrani sambil mempertahankan metaforanya dalam teks utama.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Dalam konstruksi evaluatif ini, עשה menunjuk pada tindakan atau perilaku; “melakukan” alami dalam bahasa Indonesia dengan objek “apa yang baik dan benar”.
- source_word: אָסָא
  choice: Asa
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַטּוֹב
  choice: apa yang baik
  rationale: Bentuk berartikel setelah עשה menyatakan perilaku yang dinilai baik; ungkapan ini lebih alami daripada terjemahan harfiah “yang baik itu”.
- source_word: וְהַיָּשָׁר
  choice: dan benar
  rationale: Dalam konteks etis, יָשָׁר berarti benar atau lurus secara moral; “benar” membentuk pasangan evaluatif yang alami dengan “baik”.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Terjemahan ini mempertahankan metafora Ibrani yang menyatakan sudut pandang atau penilaian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Walaupun אֱלֹהִים berbentuk jamak secara morfologis, di sini referennya tunggal dan sufiksnya berarti “miliknya”; “Allahnya” mencerminkan makna dan hubungan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “apa yang baik dan benar” menyampaikan penilaian moral secara alami, sedangkan “di mata” mempertahankan citra bahasa sumber. Koma sebelum “Allahnya” menandai aposisi yang menjelaskan siapa Yahweh bagi Asa.
