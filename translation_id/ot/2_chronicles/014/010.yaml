revisions:
- from: Lalu Asa berseru kepada Yahweh, Allahnya, dan berkata, “Ya Yahweh, tidak ada selain Engkau yang dapat menolong dalam pertarungan antara yang kuat dan yang tidak berdaya.[a] Tolonglah kami, ya Yahweh, Allah kami, sebab kami bersandar kepada-Mu. Dalam nama-Mu kami datang menghadapi pasukan besar ini. Ya Yahweh, Engkaulah Allah kami. Jangan biarkan manusia fana bertahan melawan Engkau.”[b]
  to: Lalu Asa berseru kepada Yahweh, Allahnya, dan berkata, “Ya Yahweh, tidak ada seorang pun selain Engkau yang dapat menolong, baik yang kuat maupun yang tidak berdaya.[a] Tolonglah kami, ya Yahweh, Allah kami, sebab kami bersandar kepada-Mu. Dalam nama-Mu kami datang menghadapi pasukan besar ini. Engkau, ya Yahweh, Allah kami. Jangan biarkan manusia bertahan melawan Engkau.”[b]
  rationale: Revisi menghapus tambahan “dalam pertarungan,” menjaga ambiguitas konstruksi Ibrani melalui teks utama dan catatan a, serta menata ulang penegasan “Engkau” agar lebih dekat dengan bentuk retoris sumber. Catatan b tetap mempertahankan ketidakpastian leksikal pada עצר.
