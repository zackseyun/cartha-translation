source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אָסָ֜א אֶל יְהוָ֣ה אֱלֹהָי/ו֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֵֽין עִמְּ/ךָ֤ לַ/עְזוֹר֙ בֵּ֥ין רַב֙ לְ/אֵ֣ין כֹּ֔חַ עָזְרֵ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ כִּֽי עָלֶ֣י/ךָ נִשְׁעַ֔נּוּ וּ/בְ/שִׁמְ/ךָ֣ בָ֔אנוּ עַל הֶ/הָמ֖וֹן הַ/זֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אַ֔תָּה אַל יַעְצֹ֥ר עִמְּ/ךָ֖ אֱנֽוֹשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: id
  text: Lalu Asa berseru kepada Yahweh, Allahnya, dan berkata, “Ya Yahweh, tidak ada seorang pun selain Engkau yang dapat menolong, baik yang kuat maupun yang tidak berdaya.[a] Tolonglah kami, ya Yahweh, Allah kami, sebab kami bersandar kepada-Mu. Dalam nama-Mu kami datang menghadapi pasukan besar ini. Engkau, ya Yahweh, Allah kami. Jangan biarkan manusia bertahan melawan Engkau.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi-Mu tidak ada perbedaan antara menolong pihak yang banyak atau yang tidak berkekuatan.” Ungkapan Ibraninya padat; kata yang pertama dapat menekankan jumlah, kebesaran, atau kekuatan.
    reason: alternative_reading
  - marker: b
    text: Atau, “Jangan biarkan manusia fana mengalahkan Engkau” atau “mempertahankan kekuatan terhadap Engkau.” Arti kata kerja Ibraninya dalam klausa ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: berseru kepada
  rationale: Dalam konteks doa, קרא אל menyatakan seruan mendesak kepada Allah, bukan sekadar berbicara atau memanggil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, alih-alih menggantinya dengan sebuah gelar.
- source_word: אֱלֹהָיו / אֱלֹהֵינוּ
  choice: Allahnya / Allah kami
  rationale: Mempertahankan konstruksi posesif dan bahasa relasional dalam doa Asa.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: tidak ada selain Engkau yang dapat menolong
  rationale: Mengungkapkan bahwa pertolongan sejati hanya berasal dari Yahweh, sambil menjaga bentuk pernyataan negatif dari teks.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: dalam pertarungan antara yang kuat dan yang tidak berdaya
  rationale: רַב dapat menunjuk kepada pihak yang besar, banyak, atau kuat, sedangkan אֵין כֹּחַ berarti tidak mempunyai kekuatan. Terjemahan ini mempertahankan kontrasnya tanpa menetapkan jumlah pasukan secara berlebihan.
- source_word: עָזְרֵנוּ
  choice: Tolonglah kami
  rationale: Padanan langsung, ringkas, dan wajar untuk imperatif dengan sufiks orang pertama jamak.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: sebab kami bersandar kepada-Mu
  rationale: Mempertahankan metafora harfiah נשען yang tetap alami dalam bahasa Indonesia dan menyatakan kebergantungan.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: Dalam nama-Mu kami datang
  rationale: Mempertahankan ungkapan alkitabiah tentang bertindak dengan mengandalkan nama dan kewenangan Allah.
- source_word: הֶהָמוֹן הַזֶּה
  choice: pasukan besar ini
  rationale: הָמוֹן berarti kerumunan atau kelompok yang besar; konteks pertempuran membuat 'pasukan besar' jelas dan alami.
- source_word: אֱנוֹשׁ
  choice: manusia fana
  rationale: Kata ini menunjuk kepada manusia dengan penekanan pada kelemahan atau kefanaannya; unsur tersebut relevan dalam kontras dengan Yahweh.
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: Jangan biarkan manusia fana bertahan melawan Engkau
  rationale: Dalam konteks pertempuran, עצר dipahami sebagai mampu bertahan atau menghadapi. Catatan kaki mempertahankan kemungkinan leksikal lainnya.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה; transliterasi 'Yahweh' mempertahankannya sebagai nama diri dan tidak mengubahnya menjadi gelar.
- issue: Makna pertolongan dalam frasa אֵין עִמְּךָ לַעְזוֹר בֵּין רַב לְאֵין כֹּחַ
  choice: Tidak ada selain Yahweh yang dapat menolong dalam pertarungan antara pihak kuat dan tidak berdaya
  alternative: Bagi Yahweh tidak ada perbedaan antara menolong pihak yang banyak dan pihak yang tidak berkekuatan
  rationale: Sintaks Ibraninya padat dan dapat menekankan keunikan pertolongan Yahweh atau ketidakbergantungan-Nya pada jumlah dan kekuatan. Teks utama mengikuti pembacaan pertama, sedangkan catatan mempertahankan alternatif yang nyata.
- issue: Daya manusia terhadap Allah dalam אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: jangan biarkan manusia fana bertahan melawan Engkau
  alternative: jangan biarkan manusia fana mengalahkan Engkau atau mempertahankan kekuatan terhadap Engkau
  rationale: Terjemahan utama sesuai dengan konteks pertempuran tanpa menyiratkan bahwa Allah secara hakiki dapat dikalahkan; bentuk permohonan dan ketegangan retoris teks tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Sapaan 'Ya Yahweh' dan kapitalisasi pronomina ilahi mengikuti kebiasaan religius Indonesia yang mudah dipahami. Kalimat panjang Ibrani dibagi menjadi beberapa kalimat agar jelas saat dibaca, tanpa menghilangkan alur permohonan Asa.
