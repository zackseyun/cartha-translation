  terminology: “Pasukan,” “Yehuda,” “Benyamin,” “perisai besar,” “tombak,” dan “pejuang yang gagah perkasa” sesuai dengan konteks serta register naratif-militer. Catatan kaki secara tepat menjelaskan ungkapan Ibrani sebagai sebutan militer baku tanpa memaksakan penafsiran doktrinal.
