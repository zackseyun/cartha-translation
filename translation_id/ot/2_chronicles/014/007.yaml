  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: id
  text: Asa mempunyai pasukan yang terdiri atas 300.000 orang dari Yehuda, yang membawa perisai besar dan tombak, serta 280.000 orang dari Benyamin, yang membawa perisai dan menarik busur. Mereka semua adalah pejuang yang gagah perkasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “prajurit-prajurit yang kuat dan berani.” Ungkapan Ibrani גִּבּוֹרֵי חַיִל merupakan sebutan baku bagi para prajurit yang kuat, berani, dan cakap bertempur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: pasukan
  rationale: Dalam konteks pendataan militer, kata ini menunjuk pada kekuatan bersenjata atau pasukan Asa, bukan kekayaan atau keberanian secara abstrak.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: yang membawa perisai besar dan tombak
  rationale: Bentuk partisipelnya menggambarkan para prajurit yang diperlengkapi dengan senjata. צִנָּה adalah perisai besar yang melindungi tubuh dan dibedakan dari מָגֵן pada bagian berikutnya.
- source_word: מִיהוּדָה
  choice: dari Yehuda
  rationale: Preposisi מִן menyatakan asal kesukuan para prajurit.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: 300.000 orang
  rationale: Angka diterjemahkan langsung; kata 'orang' ditambahkan secara wajar dalam bahasa Indonesia karena yang dihitung adalah anggota pasukan.
- source_word: נֹשְׂאֵי מָגֵן
  choice: yang membawa perisai
  rationale: מָגֵן adalah perisai, kemungkinan lebih kecil daripada צִנָּה. Pembedaan istilah dipertahankan dengan menyebut yang pertama 'perisai besar' dan yang ini 'perisai'.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: dan menarik busur
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan menginjak atau melenturkan busur dan secara idiomatis menggambarkan penggunaan busur. 'Menarik busur' alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 280.000 orang
  rationale: Angka diterjemahkan langsung dengan format penulisan bilangan bahasa Indonesia.
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Padanan alami dalam bahasa Indonesia untuk frasa rangkuman yang merujuk kepada seluruh pasukan yang baru disebutkan.
- source_word: גִּבּוֹרֵי חָיִל
  choice: pejuang yang gagah perkasa
  rationale: Ungkapan militer baku ini menunjuk kepada orang-orang yang kuat, berani, dan cakap bertempur. Padanan ini mempertahankan nuansa keberanian dan keperkasaan tanpa menjadi kaku.
theological_decisions:
- issue: Rujukan maskulin dalam ungkapan גִּבּוֹרֵי חָיִל
  choice: pejuang yang gagah perkasa
  alternative: laki-laki yang gagah perkasa
  rationale: Konteks sensus militer kuno memang menyiratkan prajurit laki-laki, tetapi bahasa Indonesia tidak menandai gender pada kata 'pejuang'. Padanan yang dipilih menyampaikan fungsi dan sifat mereka secara tepat tanpa menambahkan kata gender yang tidak dinyatakan secara leksikal dalam nomina tersendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan 'yang terdiri atas' untuk menjelaskan komposisi pasukan, sementara pembedaan antara perisai besar (צִנָּה) dan perisai (מָגֵן) dipertahankan.
