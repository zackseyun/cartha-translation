  source_fidelity: Teks dengan tepat menyatakan bahwa Asa mempunyai pasukan dari Yehuda berjumlah 300.000, diperlengkapi perisai besar dan tombak, serta dari Benyamin berjumlah 280.000, membawa perisai dan menggunakan busur. Pembedaan צִנָּה sebagai “perisai besar” dan מָגֵן sebagai “perisai” dipertahankan. “Pejuang yang gagah perkasa” menyampaikan dengan baik גִּבּוֹרֵי חָיִל.
