  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: id
  text: Ia menyingkirkan tempat-tempat pemujaan di tempat-tempat tinggi dan tugu-tugu pemujaan[a] dari semua kota Yehuda. Kerajaan itu pun tenteram selama pemerintahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “tugu-tugu matahari” atau “mezbah-mezbah dupa”. Istilah Ibrani ini menunjuk pada benda-benda pemujaan dan dalam beberapa konteks mungkin berkaitan dengan pemujaan matahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: Ia menyingkirkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan menyebabkan sesuatu disingkirkan. “Menyingkirkan” alami dalam bahasa Indonesia dan tidak menambahkan gagasan penghapusan secara resmi.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: dari semua kota Yehuda
  rationale: Terjemahan langsung yang mempertahankan cakupan geografis reformasi Asa.
- source_word: הַבָּמוֹת
  choice: bukit-bukit pengurbanan
  rationale: בָּמוֹת menunjuk pada tempat-tempat peribadatan, sering kali di lokasi tinggi. Ungkapan ini lebih mudah dipahami pembaca Indonesia daripada terjemahan harfiah “tempat-tempat tinggi” dan tetap menunjukkan sifat kultisnya.
- source_word: הַחַמָּנִים
  choice: tugu-tugu pemujaan
  rationale: חַמָּנִים adalah benda-benda kultis yang makna tepatnya tidak pasti dan mungkin berkaitan dengan pemujaan matahari atau dupa. Pilihan umum ini menghindari kepastian semu; kemungkinan yang lebih khusus dicatat dalam catatan kaki.
- source_word: וַתִּשְׁקֹט
  choice: pun tenteram
  rationale: שקט menggambarkan keadaan tenang, tidak terganggu, atau beristirahat. “Tenteram” wajar untuk keadaan sebuah kerajaan.
- source_word: הַמַּמְלָכָה
  choice: Kerajaan itu
  rationale: מַמְלָכָה secara langsung berarti kerajaan atau wilayah kerajaan.
- source_word: לְפָנָיו
  choice: di bawah pemerintahannya
  rationale: Secara harfiah berarti “di hadapannya,” tetapi dalam konteks kerajaan ungkapan ini secara idiomatis menunjuk pada masa atau pemerintahan Asa. Terjemahan harfiah “di hadapannya” akan kabur dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat benda-benda yang disingkirkan dalam reformasi Asa
  choice: Menerjemahkan בָּמוֹת dan חַמָּנִים sebagai instalasi peribadatan konkret tanpa menentukan secara pasti jenis kultusnya.
  alternative: Menafsirkan חַמָּנִים secara khusus sebagai tugu matahari atau mezbah dupa.
  rationale: Ayat ini jelas melaporkan penyingkiran sarana peribadatan, tetapi makna khusus חַמָּנִים diperdebatkan. Terjemahan utama mempertahankan ketidakpastian tersebut dan catatan kaki menyajikan kemungkinan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bukit-bukit pengurbanan” menjelaskan fungsi kultis istilah tanpa memakai ungkapan harfiah yang mudah disalahpahami. “Di bawah pemerintahannya” menyampaikan makna idiomatis לְפָנָיו dalam konteks ini.
