id: 2CH.14.5
reference: 2 Chronicles 14:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: id
  text: Ia membangun kota-kota berbenteng di Yehuda, sebab negeri itu tenteram dan pada tahun-tahun itu tidak ada perang yang melibatkannya[a], karena Yahweh memberinya ketenangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak ada perang melawannya.” Ungkapan Ibrani dapat dipahami secara lebih umum sebagai tidak adanya peperangan yang melibatkan Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol dari בנה melanjutkan narasi tentang tindakan Asa. Konjungsi awal tidak dinyatakan agar alur narasi Indonesia tetap alami.
- source_word: עָרֵי מְצוּרָה
  choice: kota-kota berbenteng
  rationale: Frasa konstruksi ini menunjuk pada kota-kota yang diperlengkapi dengan pertahanan; ungkapan ini alami dan tepat dalam bahasa Indonesia.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Preposisi lokatif בְּ diterjemahkan secara langsung dengan 'di'.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: negeri itu tenteram
  rationale: שׁקט menyatakan keadaan tenang dan bebas dari gangguan. 'Tenteram' menyampaikan keadaan negeri secara alami tanpa menghapus kaitannya dengan ketiadaan perang.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: tidak ada perang yang melibatkannya
  rationale: Ungkapan אֵין + עִם dapat menunjukkan bahwa tidak ada perang yang sedang berlangsung dengan, melawan, atau menyangkut Asa. Rumusan ini mempertahankan keluasan ungkapan Ibrani.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: pada tahun-tahun itu
  rationale: Frasa temporal ini merujuk pada masa yang sedang diceritakan dalam narasi sejarah.
- source_word: הֵנִיחַ ... לוֹ
  choice: memberinya ketenangan
  rationale: Bentuk hiphil dari נוח berarti menyebabkan seseorang menikmati keadaan tenang atau bebas dari konflik. 'Memberinya ketenangan' alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa keadaan itu dianugerahkan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung; transliterasi 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Ketenangan sebagai tindakan ilahi
  choice: karena Yahweh memberinya ketenangan
  alternative: karena Yahweh memberinya kelegaan
  rationale: Rumusan ini mempertahankan pernyataan teologis teks bahwa bebasnya Asa dari perang berasal dari tindakan Yahweh, tanpa menjelaskan lebih jauh sifat atau syarat anugerah itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Negeri itu tenteram' dipilih untuk keadaan Yehuda, sedangkan 'memberinya ketenangan' mempertahankan motif ketenangan yang berasal dari Yahweh. Penanda catatan kaki ditempatkan tepat sesudah frasa yang memiliki kemungkinan terjemahan lain.
