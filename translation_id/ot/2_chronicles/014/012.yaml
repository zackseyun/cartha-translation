reference: 2 Chronicles 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּרְדְּפֵ֨/ם אָסָ֜א וְ/הָ/עָ֣ם אֲשֶׁר עִמּ/וֹ֮ עַד לִ/גְרָר֒ וַ/יִּפֹּ֤ל מִ/כּוּשִׁים֙ לְ/אֵ֣ין לָ/הֶ֣ם מִֽחְיָ֔ה כִּֽי נִשְׁבְּר֥וּ לִ/פְנֵֽי יְהוָ֖ה וְ/לִ/פְנֵ֣י מַחֲנֵ֑/הוּ וַ/יִּשְׂא֥וּ שָׁלָ֖ל הַרְבֵּ֥ה מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: id
  text: Asa dan rakyat yang menyertainya mengejar mereka sampai ke Gerar. Orang-orang Kus[a] berguguran hingga tidak seorang pun tersisa hidup, sebab mereka dihancurkan di hadapan Yahweh dan pasukannya[b]. Lalu mereka membawa pergi jarahan yang sangat banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang-orang Kus” secara tradisional juga diterjemahkan “orang-orang Etiopia”. Kus adalah nama bangsa dan wilayah kuno.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “pasukan” juga dapat berarti “perkemahan”. Akhiran “-nya” mungkin mengacu kepada Asa, tetapi dapat pula dipahami mengacu kepada Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: mengejar mereka
  rationale: Kata רדף lazim berarti mengejar, terutama dalam konteks pengejaran militer.
- source_word: עַד לִגְרָר
  choice: sampai ke Gerar
  rationale: Ungkapan עַד dengan nama tempat menunjukkan batas atau jangkauan pengejaran.
- source_word: מִכּוּשִׁים
  choice: orang-orang Kus
  rationale: כּוּשִׁים menunjuk kepada bangsa atau penduduk Kus; bentuk ini mempertahankan acuan etnogeografis Ibrani tanpa menyamakannya secara anakronistis dengan Etiopia modern.
- source_word: וַיִּפֹּל מִכּוּשִׁים
  choice: Orang-orang Kus berguguran
  rationale: Dalam konteks pertempuran, נפל dengan מן menyatakan jatuhnya korban dari kelompok tersebut. 'Berguguran' merupakan ungkapan Indonesia yang alami untuk banyak orang yang tewas dalam pertempuran.
- source_word: לְאֵין לָהֶם מִחְיָה
  choice: hingga tidak seorang pun tetap hidup
  rationale: Ungkapan ini menyatakan bahwa tidak ada kehidupan atau penyintas yang tersisa; terjemahan ini menyampaikan kedahsyatan kekalahan tanpa memperhalusnya.
- source_word: נִשְׁבְּרוּ
  choice: dihancurkan
  rationale: Bentuk pasif שבר menggambarkan kehancuran militer yang telak. 'Dihancurkan' mempertahankan daya ungkapnya secara alami dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Terjemahan ini mempertahankan nama perjanjian יְהוָה serta ungkapan spasial-teologis 'di hadapan'.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: dan pasukannya
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan. Dalam konteks pertempuran dan pengejaran, 'pasukan' paling alami; bentuk 'pasukannya' mempertahankan pronomina Ibrani, sementara ketidakpastian acuannya dijelaskan dalam catatan kaki.
- source_word: וַיִּשְׂאוּ שָׁלָל
  choice: membawa pergi jarahan
  rationale: נשא bersama שׁלל berarti mengangkut atau membawa pergi barang rampasan perang.
- source_word: הַרְבֵּה מְאֹד
  choice: yang sangat banyak
  rationale: Gabungan ini menegaskan jumlah yang luar biasa besar dan diterjemahkan dengan ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi dan tidak menggantinya dengan gelar.
- issue: Acuan akhiran pronominal dalam מַחֲנֵהוּ
  choice: pasukannya, dengan ambiguitas dijelaskan dalam catatan kaki
  alternative: pasukan Asa; pasukan Yahweh; perkemahannya
  rationale: Akhiran -וֹ berarti 'miliknya', tetapi acuannya tidak dinyatakan secara eksplisit. Asa merupakan calon anteseden manusiawi yang menonjol, sedangkan posisi kata sesudah 'Yahweh' memungkinkan hubungan dengan Yahweh. Terjemahan utama tidak menambahkan nama yang tidak ada dalam teks, dan catatan kaki mempertahankan kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Rakyat yang menyertainya' dipilih untuk הָעָם אֲשֶׁר עִמּוֹ, sedangkan 'orang-orang Asa' pada kalimat terakhir memperjelas subjek jamak yang tersirat tanpa mengubah alur. Penulisan 'pasukannya' dengan huruf kecil sengaja tidak menetapkan acuan ilahinya; ambiguitas sumber dipertahankan melalui catatan kaki.
