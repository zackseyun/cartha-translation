base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: id
  text: Lalu Asa keluar untuk menghadapinya[a], dan mereka menyusun barisan untuk bertempur[b] di Lembah Zefata, dekat Maresa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke hadapannya”; dapat juga diterjemahkan “untuk menemuinya” atau “untuk melawannya”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka menempatkan diri dalam formasi tempur”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: maju
  rationale: Dalam konteks militer, יצא menyatakan gerakan keluar untuk menghadapi lawan. “Maju” alami dalam bahasa Indonesia dan menyampaikan gerakan tersebut tanpa uraian berlebihan.
- source_word: לְפָנָיו
  choice: menghadapinya
  rationale: Secara harfiah berarti “di hadapannya/ke hadapannya”; dalam konteks ini Asa bergerak untuk berhadapan dengan pasukan lawan. “Menghadapinya” mempertahankan acuan pronominal dan implikasi konfrontasi.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: mereka mengatur barisan untuk bertempur
  rationale: Ungkapan ערך מלחמה merujuk pada penataan pasukan dalam formasi tempur. Pilihan ini jelas dan wajar bagi pembaca Indonesia modern.
- source_word: בְּגֵיא
  choice: di Lembah
  rationale: גיא berarti lembah atau jurang; “Lembah” merupakan padanan umum dan sesuai sebagai bagian nama geografis.
- source_word: צְפַתָה
  choice: Zefata
  rationale: Nama tempat ditransliterasikan dalam bentuk yang wajar bagi ejaan Indonesia.
- source_word: לְמָרֵשָׁה
  choice: dekat Maresa
  rationale: Preposisi לְ pada nama tempat ini menunjukkan hubungan lokasi dengan Maresa. “Dekat Maresa” mengungkapkan bahwa Lembah Zefata berada di sekitar Maresa tanpa menyamakan lembah itu dengan kota tersebut.
