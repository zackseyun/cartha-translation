base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: id
  text: Mereka juga menyerang kemah-kemah ternak[a], lalu merampas kambing domba[c] dalam jumlah sangat banyak serta unta sebagai jarahan[b]. Sesudah itu, mereka kembali ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kemah-kemah ternak”. Ungkapan ini mungkin merujuk pada perkemahan yang berkaitan dengan kawanan ternak atau pada kemah para penggembala.'
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani dapat berarti “menawan”; karena objeknya hewan, maksudnya ialah merebut dan membawanya sebagai jarahan.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani ini merupakan istilah kolektif yang dapat mencakup domba dan kambing, yaitu ternak kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Mereka juga
  rationale: Menyampaikan makna tambahan yang menghubungkan tindakan ini dengan rangkaian peristiwa sebelumnya; subjek dinyatakan agar wajar dalam bahasa Indonesia.
- source_word: אָהֳלֵי מִקְנֶה
  choice: perkemahan para peternak
  rationale: Secara harfiah berarti 'kemah-kemah ternak', tetapi ungkapan itu kemungkinan menunjuk pada perkemahan penggembala atau peternak yang berkaitan dengan kawanan ternak.
- source_word: הִכּוּ
  choice: menyerang
  rationale: Dalam konteks militer, נכה dapat berarti menyerang atau menghantam; 'menyerang' paling alami untuk sasaran berupa perkemahan.
- source_word: וַיִּשְׁבּוּ
  choice: membawa pergi ... sebagai jarahan
  rationale: שבה pada dasarnya berarti menawan; karena objeknya hewan, frasa ini menyampaikan bahwa hewan-hewan tersebut dirampas dan dibawa pergi.
- source_word: צֹאן
  choice: kambing domba
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing; 'kambing domba' mempertahankan cakupan itu tanpa membatasinya hanya pada domba.
- source_word: לָרֹב
  choice: sangat banyak
  rationale: Mengungkapkan jumlah besar secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: וּגְמַלִּים
  choice: dan unta
  rationale: Padanan langsung dan wajar bagi nomina Ibrani tersebut.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Sesudah itu, mereka kembali ke Yerusalem
  rationale: Menunjukkan kemajuan urutan narasi yang dinyatakan oleh bentuk wayyiqtol.
