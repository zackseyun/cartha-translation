revisions:
- from: Maka Dia mendatangkan raja orang Kasdim[a] untuk menyerang mereka. Raja itu membunuh para pemuda mereka dengan pedang di rumah tempat suci mereka dan tidak mengasihani pemuda ataupun perawan[b], orang tua ataupun orang yang sangat lanjut usia[c]. Dia menyerahkan semuanya ke dalam tangannya.
  to: Maka Dia mendatangkan raja orang Kasdim[a] untuk menyerang mereka. Raja itu membunuh para pemuda mereka dengan pedang di dalam Bait Suci mereka dan tidak mengasihani[c] pemuda ataupun perawan[b], orang tua maupun orang yang sangat tua. Dia menyerahkan semuanya ke dalam tangan raja itu.
  rationale: Revisi mengganti ungkapan lokasi yang tidak alami dengan "Bait Suci," memperjelas bahwa "tangan" pada klausa terakhir adalah tangan raja Kasdim, dan membetulkan penempatan serta isi catatan kaki. Kontras usia tetap dipertahankan tanpa memaksakan perbedaan teknis di antara kedua istilah Ibrani.
