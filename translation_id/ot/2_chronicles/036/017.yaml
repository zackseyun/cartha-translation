id: 2CH.36.17
reference: 2 Chronicles 36:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: id
  text: Maka Dia mendatangkan raja orang Kasdim[a] untuk menyerang mereka. Raja itu membunuh para pemuda mereka dengan pedang di dalam Bait Suci mereka dan tidak mengasihani[c] pemuda ataupun perawan[b], orang tua maupun orang yang sangat tua. Dia menyerahkan semuanya ke dalam tangan raja itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “raja Babel”; teks Ibrani: “raja orang Kasdim.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “perawan”; dapat menunjuk perempuan muda yang belum menikah.'
    reason: lexical_clarification
  - marker: c
    text: Atau “tidak menyayangkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: Dia mendatangkan ... untuk menyerang mereka
  rationale: Bentuk Hifil dari עלה dengan עַל menyatakan tindakan menyebabkan seseorang maju melawan pihak lain. Ungkapan ini mempertahankan nuansa kausatif dan terdengar alami dalam konteks militer.
- source_word: מֶלֶךְ כשדיים
  choice: raja orang Kasdim
  rationale: כשדים secara langsung menunjuk kepada orang Kasdim; sebutan yang lebih umum dan mudah dipahami, 'orang Babel', dicatat sebagai alternatif.
- source_word: וַיַּהֲרֹג
  choice: Raja itu membunuh
  rationale: Subjek beralih secara wajar kepada raja orang Kasdim. Penyebutan ulang 'Raja itu' menghindari kerancuan pronomina tanpa mengubah hubungan antarklausa.
- source_word: בַּחוּרֵיהֶם
  choice: para pemuda mereka
  rationale: בָּחוּר menunjuk kepada laki-laki muda yang berada pada masa prima; 'para pemuda' ringkas dan alami.
- source_word: בַּחֶרֶב
  choice: dengan pedang
  rationale: Mempertahankan ungkapan instrumental Ibrani secara konkret.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: di rumah tempat suci mereka
  rationale: Terjemahan ini mempertahankan kedua unsur ungkapan Ibrani, בַּיִת dan מִקְדָּשׁ, serta menonjolkan bahwa pembunuhan berlangsung di tempat kudus mereka.
- source_word: וְלֹא חָמַל
  choice: tidak mengasihani
  rationale: חמל menyatakan tidak menahan tindakan karena belas kasihan; 'tidak mengasihani' mempertahankan dimensi belas kasih, sedangkan 'tidak menyayangkan' tetap merupakan alternatif yang sah.
- source_word: בָּחוּר וּבְתוּלָה
  choice: pemuda ataupun perawan
  rationale: Mempertahankan pasangan gender dan arti khusus בְּתוּלָה sebagai perempuan muda yang belum menikah/perawan.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: orang tua ataupun orang yang sangat lanjut usia
  rationale: Membedakan kedua istilah usia dan mempertahankan peningkatan retoris dari tua kepada sangat lanjut usia.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: Dia menyerahkan semuanya ke dalam tangannya
  rationale: נתן ביד adalah idiom penyerahan ke dalam kuasa seseorang. Bentuk 'ke dalam tangannya' mempertahankan citra Ibrani, sedangkan 'semuanya' menjaga keluasan הַכֹּל tanpa mempersempit acuannya.
theological_decisions:
- issue: Subjek verba pembuka dan klausa terakhir
  choice: '''Dia'' merujuk kepada TUHAN dari konteks ayat sebelumnya, sedangkan ''tangannya'' merujuk kepada raja orang Kasdim.'
  alternative: Membiarkan subjek tersirat atau mengulang nama TUHAN dalam ayat ini.
  rationale: Bentuk verba Ibrani adalah orang ketiga maskulin tunggal dan subjeknya diteruskan dari konteks sebelumnya. Pronomina mempertahankan kesinambungan narasi tanpa menambahkan nama yang tidak muncul dalam ayat ini.
- issue: Cakupan הַכֹּל dalam klausa terakhir
  choice: semuanya
  alternative: mereka semua
  rationale: הַכֹּל dapat mencakup semua yang diserahkan, baik orang maupun keseluruhan yang menjadi objek penghakiman. 'Semuanya' mempertahankan keluasan dan ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur kalimat dipecah agar pergantian subjek dari Allah kepada raja Kasdim jelas. Istilah 'Kasdim' dipertahankan karena setia pada leksikon sumber, dengan 'Babel' dalam catatan kaki.
