  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: id
  text: untuk menggenapi firman Yahweh yang disampaikan melalui Yeremia[a], hingga negeri itu memperoleh Sabat-Sabatnya. Selama negeri itu telantar, negeri itu beristirahat[b][c], untuk menggenapi tujuh puluh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui mulut Yeremia.”
    reason: lexical_alternative
  - marker: b
    text: Atau “negeri itu berhenti.” Dalam bahasa Ibrani, kata kerja ini berkaitan dengan “Sabat-Sabatnya” pada bagian sebelumnya, sehingga mempertahankan permainan kata antara Sabat dan perhentian.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini menggemakan peringatan perjanjian bahwa negeri itu akan memperoleh Sabat-Sabatnya selama umat berada dalam pembuangan (lihat Imamat 26:34–35).
    reason: cross_reference
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: untuk menggenapi
  rationale: Infinitif dengan ל menyatakan tujuan atau hasil; “menggenapi” mempertahankan kaitan antara firman nubuat dan perwujudannya.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: “Firman” wajar dalam konteks nubuat dan mempertahankan daya antarteks; nama ilahi ditransliterasikan sebagai Yahweh.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: yang disampaikan melalui Yeremia
  rationale: Ungkapan harfiahnya “melalui mulut Yeremia”; terjemahan ini menyampaikan perantaraan ucapan nabi secara alami dalam bahasa Indonesia.
- source_word: רָצְתָה
  choice: menikmati
  rationale: Dalam konstruksi ini negeri menjadi subjek dan masa-masa Sabat menjadi objek; “menikmati” cocok dengan gagasan negeri memperoleh perhentian yang sebelumnya tidak didapatnya.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Konteks menunjuk pada negeri Yehuda, bukan seluruh bumi.
- source_word: אֶת שַׁבְּתוֹתֶיהָ
  choice: masa-masa Sabatnya
  rationale: Bentuk jamak dan hubungan Sabat dengan negeri dipertahankan, sementara “masa-masa” membuat acuannya alami dan jelas dalam bahasa Indonesia.
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: Sepanjang masa negeri itu telantar
  rationale: Mengungkapkan seluruh periode ketika negeri tersebut berada dalam keadaan sunyi dan tak dihuni; “telantar” alami tanpa membatasi penyebab kehancurannya.
- source_word: שָׁבָתָה
  choice: beristirahat pada hari Sabat
  rationale: Menjaga kaitan leksikal antara verba שׁבת dan kata “Sabat”, sekaligus tetap mudah dimengerti.
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: sampai genap tujuh puluh tahun
  rationale: Dalam konteks durasi, “sampai genap” merupakan ungkapan Indonesia yang alami dan menyampaikan penyelesaian masa tujuh puluh tahun.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH; transliterasi mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Permainan kata Sabat/perhentian dalam שַׁבְּתוֹתֶיהָ dan שָׁבָתָה
  choice: masa-masa Sabatnya ... beristirahat pada hari Sabat
  alternative: masa-masa perhentiannya ... beristirahat
  rationale: Pilihan ini menjaga hubungan verbal yang disengaja dan gema teologi perhentian sabatikal bagi negeri, tanpa mengubahnya menjadi sekadar istirahat umum.
- issue: Hubungan sintaksis עַד רָצְתָה
  choice: sampai negeri itu menikmati masa-masa Sabatnya
  alternative: sehingga negeri itu menikmati masa-masa Sabatnya
  rationale: “Sampai” mempertahankan nilai temporal עַד dan ketegangan sintaksis teks, tanpa memperjelas hubungan kausal secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur dibuat alami bagi pembaca umum, tetapi pengulangan dan permainan kata Sabat/perhentian tetap dijaga. Nama Yeremia memakai bentuk Indonesia yang sudah mapan.
