  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; ambiguitas tindakan terhadap raja dipertahankan melalui catatan kaki, dan istilah finansial diterjemahkan sebagai denda sesuai makna leksikal konteks ini.
