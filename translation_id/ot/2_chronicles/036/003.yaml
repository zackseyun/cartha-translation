base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: id
  text: Raja Mesir menyingkirkannya di Yerusalem[a], lalu mendenda negeri itu[b] sebesar seratus talenta perak dan satu talenta emas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat berarti menyingkirkannya dari kedudukan atau membawanya pergi.
    reason: alternative_reading
  - marker: b
    text: Kata kerja Ibrani menunjuk pada pengenaan hukuman berupa pembayaran uang; dapat juga diterjemahkan “mengenakan denda pada negeri itu”.
    reason: lexical_alternative
  - marker: c
    text: Talenta adalah satuan berat kuno yang besar; satuan aslinya dipertahankan tanpa dikonversi ke ukuran modern.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: menyingkirkannya dari kedudukannya
  rationale: Bentuk kausatif dari סוּר berarti menyingkirkan atau membawa pergi. Dalam konteks kerajaan, frasa ini secara alami menyatakan pencopotan dari kedudukan, sementara catatan kaki mempertahankan kemungkinan bahwa ia dibawa pergi.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: Raja Mesir
  rationale: Terjemahan alami konstruksi kepunyaan Ibrani; tidak menambahkan nama Firaun Nekho yang tidak disebutkan dalam ayat ini.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi בְּ menandai lokasi; 'di Yerusalem' adalah ungkapan baku dalam bahasa Indonesia modern.
- source_word: וַיַּעֲנֹשׁ
  choice: mengenakan denda
  rationale: Kata kerja ענשׁ di sini menunjuk pada pengenaan hukuman berupa pembayaran uang, sebagaimana diperjelas oleh jumlah yang menyusul. 'Mengenakan denda' lebih tepat daripada 'menghukum' dan tidak mengubahnya menjadi upeti rutin.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini אָרֶץ menunjuk kepada wilayah atau kerajaan Yehuda. 'Negeri itu' jelas dan alami bagi pembaca Indonesia.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: seratus talenta perak
  rationale: Mempertahankan satuan berat kuno כִּכָּר sebagai 'talenta' tanpa konversi modern yang tidak pasti.
- source_word: וְכִכַּר זָהָב
  choice: dan satu talenta emas
  rationale: Mempertahankan satuan yang sama dan menyatakan bentuk tunggalnya secara eksplisit.
