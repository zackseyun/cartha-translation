base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: id
  text: 'Pada tahun pertama pemerintahan Koresh, raja Persia, agar firman Yahweh yang disampaikan melalui Yeremia digenapi, Yahweh menggerakkan hati Koresh, raja Persia. Lalu Koresh mengumumkan di seluruh kerajaannya, juga secara tertulis, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ
  choice: Pada tahun pertama pemerintahan Koresh
  rationale: Ungkapan ini merupakan rumus penanggalan berdasarkan tahun pemerintahan raja. Penambahan 'pemerintahan' memperjelas maksudnya secara alami tanpa menambah unsur substantif.
- source_word: מֶלֶךְ פָּרַס
  choice: raja Persia
  rationale: Menerjemahkan gelar kerajaan dan nama wilayah secara langsung dan wajar.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: agar firman Yahweh ... digenapi
  rationale: Infinitif לִכְלוֹת menyatakan tujuan atau hasil berupa tergenapinya firman nubuat; bentuk pasif 'digenapi' alami dalam bahasa Indonesia.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: yang disampaikan melalui Yeremia
  rationale: Ungkapan harfiah 'melalui mulut Yeremia' menyatakan perantaraan nabi. Terjemahan ini mempertahankan fungsi tersebut dalam bahasa Indonesia yang alami.
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כּוֹרֶשׁ
  choice: Yahweh menggerakkan hati Koresh
  rationale: רוּחַ dalam konteks ini menunjuk pada batin, kecenderungan, atau dorongan dalam diri Koresh. 'Menggerakkan hati' menyampaikan tindakan ilahi atas disposisi batinnya secara idiomatis.
- source_word: וַיַּעֲבֶר קוֹל
  choice: Lalu Koresh mengumumkan
  rationale: Idiom Ibrani secara harfiah berarti membuat suara atau seruan beredar. 'Mengumumkan' secara ringkas menyampaikan tindakan penyiaran resmi; subjek Koresh dinyatakan untuk menghindari ambiguitas setelah penyebutan Yahweh.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: ke seluruh kerajaannya
  rationale: Menunjukkan jangkauan pengumuman di seluruh wilayah kekuasaan Koresh.
- source_word: וְגַם בְּמִכְתָּב
  choice: juga secara tertulis
  rationale: Mempertahankan penegasan bahwa maklumat itu bukan hanya diumumkan, tetapi juga dituangkan dalam bentuk tertulis.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Pengantar langsung yang alami menuju isi maklumat pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi; 'Yahweh' mempertahankan nama tersebut secara langsung.
- issue: Makna רוּחַ כּוֹרֶשׁ
  choice: hati Koresh
  alternative: roh Koresh
  rationale: Dalam konteks ini kata רוּחַ menunjuk pada disposisi atau dorongan batin Koresh. 'Hati' lebih alami bagi pembaca Indonesia dan tidak menyiratkan bahwa yang dimaksud ialah suatu entitas rohani tersendiri.
- issue: Perantaraan nubuat dalam בְּפִי יִרְמְיָהוּ
  choice: yang disampaikan melalui Yeremia
  alternative: melalui mulut Yeremia
  rationale: Terjemahan ini mempertahankan bahwa firman berasal dari Yahweh dan disampaikan dengan Yeremia sebagai perantara, tanpa mempertahankan idiom tubuh yang terasa kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah menjadi dua agar mudah dibaca, sedangkan hubungan tujuan antara nubuat Yeremia dan tindakan Yahweh tetap dipertahankan. Tidak ada catatan kaki karena tidak ada alternatif penting yang perlu ditampilkan pada tingkat teks pembaca.
