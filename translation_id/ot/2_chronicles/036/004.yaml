  text: וַ/יַּמְלֵ֨ךְ מֶֽלֶךְ מִצְרַ֜יִם אֶת אֶלְיָקִ֣ים אָחִ֗י/ו עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יוֹאָחָ֤ז אָחִי/ו֙ לָקַ֣ח נְכ֔וֹ וַ/יְבִיאֵ֖/הוּ מִצְרָֽיְמָ/ה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: id
  text: Raja Mesir mengangkat Elyakim, saudara Yoahas, menjadi raja atas Yehuda dan Yerusalem, dan mengganti namanya menjadi Yoyakim. Nekho mengambil Yoahas, saudara Elyakim itu, lalu membawanya ke Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: mengangkat ... menjadi raja
  rationale: Bentuk kausatif verba מלך menunjukkan bahwa raja Mesir menempatkan Elyakim sebagai raja; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan pengangkatan tersebut.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: Raja Mesir
  rationale: Frasa konstruksi ini secara langsung menyebut penguasa Mesir sebagai subjek.
- source_word: אֶלְיָקִים אָחִיו
  choice: Elyakim, saudara Yoahas
  rationale: Pronomina 'saudaranya' secara wacana merujuk kepada Yoahas. Nama rujukannya dinyatakan agar hubungan antartokoh jelas bagi pembaca Indonesia tanpa mengubah makna.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: atas Yehuda dan Yerusalem
  rationale: Preposisi עַל dalam konteks kerajaan menyatakan wilayah yang diperintah; kerajaan dan ibu kotanya sama-sama dipertahankan.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ יְהוֹיָקִים
  choice: lalu mengganti namanya menjadi Yoyakim
  rationale: Idiom Ibrani ini berarti mengubah nama seseorang; 'mengganti namanya menjadi' jelas dan wajar dalam bahasa Indonesia.
- source_word: וְאֶת יוֹאָחָז אָחִיו לָקַח נְכוֹ
  choice: Nekho membawa Yoahas, saudara Elyakim itu
  rationale: לקח dapat berarti mengambil atau membawa sesuai konteks. Hubungan persaudaraan dibuat eksplisit dengan Elyakim untuk mencegah pronomina yang rancu. Konjungsi sederhana tidak dipaksakan menjadi pertentangan.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: ke Mesir
  rationale: Bentuk berakhiran lokatif menunjukkan gerak menuju Mesir. Karena verba sebelumnya diterjemahkan 'membawa', gabungan 'membawa ... ke Mesir' menyampaikan kedua verba Ibrani secara alami tanpa pengulangan yang kaku.
- source_word: נְכוֹ
  choice: Nekho
  rationale: Transliterasi Indonesia yang dekat dengan vokalisasi Ibrani dan membedakannya secara jelas sebagai nama diri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Hubungan kedua saudara diperjelas dengan nama masing-masing karena pronomina posesif Ibrani dapat terasa rancu bila dialihkan secara harfiah. Dua verba לקח dan בוא dirangkum secara alami sebagai 'membawa ... ke Mesir' tanpa kehilangan hasil tindakannya.
