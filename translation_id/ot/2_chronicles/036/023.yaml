  to: Beginilah kata Koresh, raja Persia, “Yahweh, Allah surga, telah memberikan kepadaku segala kerajaan di bumi. Ia telah menugaskan aku untuk membangun rumah bagi-Nya di Yerusalem, yang terletak di Yehuda. Siapa pun di antara kalian yang termasuk umat-Nya, semoga Yahweh, Allahnya, menyertai dia[a]. Hendaklah ia naik[b].”
