  naturalness: Bahasa draf umumnya baku dan jelas. “Allah surga” lebih dekat dengan konstruksi sumber tanpa tambahan makna, sedangkan “hendaklah ia naik” mempertahankan idiom Alkitabiah dan dapat dijelaskan melalui catatan kaki.
  terminology: Koresh, Persia, Yahweh, Yehuda, dan ‘rumah bagi-Nya’ konsisten serta sesuai. Bentuk ‘Allah surga’ mempertahankan relasi konstruksi Ibrani dengan lebih setia daripada ‘Allah penguasa surga’.
