id: 2CH.36.23
reference: 2 Chronicles 36:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: id
  text: Beginilah kata Koresh, raja Persia, “Yahweh, Allah surga, telah memberikan kepadaku segala kerajaan di bumi. Ia telah menugaskan aku untuk membangun rumah bagi-Nya di Yerusalem, yang terletak di Yehuda. Siapa pun di antara kalian yang termasuk umat-Nya, semoga Yahweh, Allahnya, menyertai dia[a]. Hendaklah ia naik[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh, Allahnya, menyertai dia.” Bahasa Ibrani juga dapat dipahami sebagai sebuah pernyataan, meskipun dalam konteks ini ungkapan berkat lebih mungkin.
    reason: alternative_reading
  - marker: b
    text: Dalam bahasa Alkitab, “naik” merupakan ungkapan lazim untuk pergi ke Yerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Beginilah kata
  rationale: Formula pembuka maklumat kerajaan diterjemahkan secara alami dalam bahasa Indonesia sambil mempertahankan bentuk ujaran langsung.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Koresh, raja Persia
  rationale: Koresh adalah bentuk nama yang lazim dalam Alkitab bahasa Indonesia; gelar kerajaan dipertahankan sebagai aposisi.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: segala kerajaan di bumi
  rationale: Dalam konteks geopolitik ini, אֶרֶץ menunjuk secara luas kepada bumi atau dunia, bukan hanya tanah Yehuda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditampilkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Allah penguasa surga
  rationale: Ungkapan konstruksi Ibrani secara harfiah berarti 'Allah surga'; penambahan 'penguasa' membuat hubungan idiomatisnya jelas dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: וְהוּא פָקַד עָלַי
  choice: Ia menugaskan aku
  rationale: Dalam konteks ini פקד menyatakan pemberian amanat atau tugas resmi.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: untuk membangun rumah bagi-Nya
  rationale: Kata בַּיִת dipertahankan sebagai 'rumah', bukan diperjelas menjadi 'Bait Allah', untuk menjaga citra dan pilihan kata sumber.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Siapa pun di antara kalian yang termasuk umat-Nya
  rationale: 'Ungkapan Ibrani yang padat dan partitif dibuat alami dalam bahasa Indonesia: siapa saja dari antara para pendengar yang merupakan anggota umat Yahweh.'
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: semoga Yahweh, Allahnya, menyertainya
  rationale: Dalam konteks undangan penutup, klausa nominal ini paling wajar berfungsi sebagai berkat atau harapan.
- source_word: וְיָעַל
  choice: Biarlah ia pergi ke sana
  rationale: Kekuatan jussif dipertahankan dengan 'biarlah'; tujuan tersirat, yaitu Yerusalem, dinyatakan melalui 'ke sana', sementara nuansa harfiah 'naik' dijelaskan dalam catatan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; bentuk 'Yahweh' mempertahankan pembedaan antara nama ilahi dan gelar אֱלֹהִים.
- issue: Makna בַיִת dalam amanat pembangunan
  choice: rumah
  alternative: Bait Allah
  rationale: Pilihan 'rumah' mempertahankan metafora teologis rumah bagi Allah dan tidak mengganti istilah sumber dengan penjelasan yang lebih khusus.
- issue: Daya klausa יְהוָה אֱלֹהָיו עִמּוֹ
  choice: 'berkat atau harapan: “semoga Yahweh, Allahnya, menyertainya”'
  alternative: 'pernyataan: “Yahweh, Allahnya, menyertainya”'
  rationale: Bahasa Ibrani tidak memuat verba eksplisit dan secara gramatikal memungkinkan pernyataan, tetapi posisinya dalam maklumat keberangkatan lebih mendukung pembacaan sebagai berkat. Alternatif dicatat agar ambiguitas tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'kalian' dipakai karena sapaan Ibrani berbentuk jamak, sedangkan rujukan kepada setiap orang tetap tunggal dengan 'ia/-nya'. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti konvensi Indonesia yang umum.
