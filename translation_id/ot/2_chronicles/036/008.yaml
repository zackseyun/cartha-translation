base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: id
  text: Perbuatan Yehoyakim yang selebihnya, kekejian yang dilakukannya, dan apa yang didapati mengenai dirinya[a]—semuanya itu tertulis dalam Kitab Raja-Raja Israel dan Yehuda. Lalu Yehoyakhin, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: yang didapati menentangnya. Ungkapan Ibrani ini dapat menunjuk secara umum pada hal-hal yang didapati mengenai Yehoyakim, tetapi dalam konteks negatif ini mungkin berarti hal-hal yang memberatkan dia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: Perbuatan-perbuatan Yehoyakim yang lain
  rationale: Dalam rumus ringkasan kerajaan, דִּבְרֵי menunjuk pada peristiwa atau perbuatan dalam masa pemerintahan, bukan hanya 'perkataan'; יֶתֶר menyatakan bagian selebihnya.
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: kekejian-kekejian yang dilakukannya
  rationale: תֹּועֵבָה memiliki penilaian moral dan/atau keagamaan yang kuat. Bentuk jamak dipertahankan, dan אֲשֶׁר עָשָׂה diterjemahkan dengan ungkapan Indonesia yang alami.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: dan apa yang didapati mengenai dirinya[a]
  rationale: Ungkapan partisip pasif dengan עַל dapat berarti hal-hal yang didapati mengenai Yehoyakim, dengan kemungkinan nuansa merugikan atau menentangnya. Terjemahan utama mempertahankan keluasan makna, sedangkan alternatif bernuansa negatif dicatat dalam catatan kaki.
- source_word: הִנָּם כְּתוּבִים
  choice: semuanya itu tertulis
  rationale: הִנָּם menarik perhatian kepada seluruh hal yang baru disebutkan. 'Semuanya itu' menyampaikan fungsi penunjuk tersebut secara alami, sementara כְּתוּבִים diterjemahkan langsung sebagai 'tertulis'.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: Kitab Raja-Raja Israel dan Yehuda
  rationale: Frasa ini merupakan rujukan kepada sebuah catatan atau sumber tertulis; kapitalisasi menandai fungsi judul tanpa menyamakannya secara otomatis dengan kitab kanonik Raja-Raja.
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: Lalu Yoyakhin, anaknya, menjadi raja menggantikan dia
  rationale: וַיִּמְלֹךְ melanjutkan narasi dengan pemberitahuan kenaikan takhta, dan תַּחְתָּיו menyatakan pergantian atau suksesi. 'Menjadi raja menggantikan dia' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Nuansa וְהַנִּמְצָא עָלָיו
  choice: mengenai dirinya
  alternative: menentangnya
  rationale: Konteks negatif memungkinkan arti yang memberatkan Yehoyakim, tetapi konstruksi Ibrani itu sendiri juga dapat menunjuk secara lebih umum kepada apa yang didapati tentang dirinya. Ambiguitas tersebut tidak dipersempit secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan kalimat mempertahankan gaya ringkasan sejarah kerajaan, tetapi menghindari ungkapan harfiah yang kaku. Nama Ibrani ditransliterasikan sebagai Yehoyakim dan Yoyakhin agar kedua nama yang mirip tetap mudah dibedakan.
