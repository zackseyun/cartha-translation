review_pass:
  verdict: revise
  source_fidelity: Draf secara umum setia pada rangkaian partisipel Ibrani dan mempertahankan pengulangan עַד (“sampai”). Namun, “meremehkan” kurang menonjolkan unsur penghinaan/penghinaan penuh dalam בּוֹזִים, dan “firman-firman-Nya” tidak alami dalam bahasa Indonesia modern meskipun nomina Ibraninya jamak.
  naturalness: “Murka Yahweh bangkit terhadap umat-Nya” dapat dipahami, tetapi “murka Yahweh menyala terhadap umat-Nya” lebih lazim dan tetap menyampaikan gambaran meningkatnya murka. “Firman-Nya” lazim dipakai sebagai nomina kolektif dalam bahasa Indonesia dan tidak menghilangkan cakupan jamak sumber.
  terminology: “Yahweh,” “Allah,” “utusan,” “nabi-nabi,” dan “murka” tepat serta konsisten dengan sumber dan kebijakan nama ilahi. Catatan tentang alternatif “malaikat-malaikat Allah” perlu dipertahankan karena מַלְאָךְ secara leksikal dapat berarti demikian, walaupun konteks mendukung utusan manusia.
  issues:
  - severity: medium
    issue: “Meremehkan firman-firman-Nya”
    rationale: בּוֹזִים menyatakan sikap memandang rendah dengan penghinaan, bukan sekadar meremehkan. Selain itu, pengulangan “firman-firman” terdengar tidak idiomatis dalam bahasa Indonesia baku; “firman-Nya” berfungsi kolektif secara wajar.
  - severity: low
    issue: “Murka Yahweh bangkit terhadap umat-Nya”
    rationale: Bentuk ini dekat dengan citra harfiah, tetapi kurang lancar dalam bahasa Indonesia. “Murka Yahweh menyala terhadap umat-Nya” adalah idiom yang lebih alami dan mempertahankan daya ungkap חֲמַת serta kulminasi עֲלוֹת.
  revised_text: Namun, mereka terus mengolok-olok para utusan Allah[a], memandang rendah firman-Nya, dan mencemooh nabi-nabi-Nya, sampai murka Yahweh menyala terhadap umat-Nya, sampai tidak ada lagi pemulihan[b].
  revised_footnotes:
