id: 2CH.36.16
reference: 2 Chronicles 36:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: id
  text: Namun, mereka terus mengolok-olok para utusan Allah[a], memandang rendah firman-Nya, dan mencemooh nabi-nabi-Nya, sampai murka Yahweh menyala terhadap umat-Nya, sampai tidak ada lagi pemulihan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “malaikat-malaikat Allah”; dalam konteks ini, “utusan” lebih mungkin karena klausa berikutnya menyebut “nabi-nabi-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak ada lagi kesembuhan” atau “tidak dapat dipulihkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: mereka terus
  rationale: Dengan tiga bentuk partisipel yang mengikutinya, bentuk ini menyatakan tindakan berulang atau berkelanjutan dalam narasi lampau.
- source_word: מַלְעִבִים
  choice: mengolok-olok
  rationale: Kata ini menyatakan perlakuan yang mengejek dan menghina; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: para utusan Allah
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat, tetapi kesejajarannya dengan 'nabi-nabi-Nya' menunjuk pada utusan manusia yang menyampaikan pesan Allah.
- source_word: וּבוֹזִים
  choice: meremehkan
  rationale: בזה menyatakan sikap memandang rendah atau menolak dengan penghinaan; 'meremehkan' cocok dengan objek berupa firman Allah.
- source_word: דְּבָרָיו
  choice: firman-firman-Nya
  rationale: Bentuk Ibrani adalah jamak dan mengacu pada perkataan-perkataan Allah yang disampaikan melalui para utusan-Nya; 'firman' mempertahankan register Alkitab yang wajar.
- source_word: וּמִתַּעְתְּעִים
  choice: mencemooh
  rationale: Kata ini menyatakan ejekan yang menghina; pilihan berbeda dari 'mengolok-olok' menjaga variasi retoris dalam rangkaian tiga tindakan.
- source_word: בִּנְבִיאָיו
  choice: nabi-nabi-Nya
  rationale: Terjemahan langsung dari bentuk jamak dengan akhiran orang ketiga maskulin tunggal yang merujuk kepada Allah.
- source_word: עַד עֲלוֹת
  choice: sampai ... bangkit
  rationale: Infinitif setelah עַד menandai titik kulminasi; 'bangkit' mempertahankan citra sumber tanpa terdengar janggal.
- source_word: חֲמַת יְהוָה
  choice: murka Yahweh
  rationale: חֵמָה menyatakan amarah yang hebat; 'murka' mempertahankan bobot penghakiman ilahi, sedangkan nama perjanjian diterjemahkan 'Yahweh'.
- source_word: בְּעַמּוֹ
  choice: terhadap umat-Nya
  rationale: Dalam hubungan dengan murka, preposisi ב menandai sasaran penghakiman; 'terhadap' paling alami dalam bahasa Indonesia.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: sampai tidak ada lagi pemulihan
  rationale: מַרְפֵּא dapat berarti penyembuhan, obat, atau pemulihan. Dalam konteks penghakiman nasional, 'pemulihan' alami dan tetap mempertahankan metafora keadaan yang tak dapat disembuhkan.
theological_decisions:
- issue: Rujukan 'para utusan Allah'
  choice: utusan manusia yang bersifat kenabian
  alternative: malaikat-malaikat Allah
  rationale: Kesejajaran langsung dengan 'nabi-nabi-Nya' dan konteks penolakan terhadap peringatan Allah mendukung rujukan kepada para pembawa pesan manusia, sambil mengakui cakupan leksikal kata sumber dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi ilahi dan mengikuti kebijakan proyek tanpa mengubahnya menjadi gelar.
- issue: Makna akhir עַד לְאֵין מַרְפֵּא
  choice: tidak ada lagi pemulihan
  alternative: tidak ada lagi penyembuhan; tidak dapat dipulihkan
  rationale: Ungkapan ini menyatakan finalitas penghakiman melalui metafora penyembuhan. Terjemahan mempertahankan metafora tersebut tanpa menentukan lebih jauh apakah yang dimaksud terutama obat, kesembuhan, atau jalan pemulihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rangkaian 'mengolok-olok ... meremehkan ... mencemooh' mempertahankan peningkatan retoris teks Ibrani. Huruf kapital pada akhiran pronominal ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
