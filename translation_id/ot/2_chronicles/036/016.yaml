- from: Namun, mereka terus mengolok-olok para utusan Allah[a], meremehkan firman-firman-Nya, dan mencemooh nabi-nabi-Nya, sampai murka Yahweh bangkit terhadap umat-Nya, sampai tidak ada lagi pemulihan[b].
  to: Namun, mereka terus mengolok-olok para utusan Allah[a], memandang rendah firman-Nya, dan mencemooh nabi-nabi-Nya, sampai murka Yahweh menyala terhadap umat-Nya, sampai tidak ada lagi pemulihan[b].
  rationale: Revisi menguatkan padanan bagi sikap penghinaan dalam בּוֹזִים, memakai bentuk Indonesia yang lebih alami untuk “firman” sebagai nomina kolektif, dan memperlancar penggambaran murka ilahi tanpa mengurangi pengulangan atau finalitas yang ada dalam teks Ibrani. Ambiguitas leksikal מַלְאָךְ dan מַרְפֵּא tetap tersedia dalam catatan kaki.
