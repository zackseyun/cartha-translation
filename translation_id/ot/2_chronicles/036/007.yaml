  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: id
  text: Nebukadnezar juga membawa sebagian perlengkapan rumah Yahweh ke Babel dan menaruhnya di kuilnya[a] di Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istananya”, sebab kata Ibrani ini dapat berarti kuil atau istana, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/כְּלֵי
  choice: juga membawa sebagian perlengkapan
  rationale: Gabungan וּ dan מִן menyatakan tambahan sekaligus makna partitif. Dalam bahasa Indonesia, “juga membawa sebagian perlengkapan” menyampaikan keduanya secara alami.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani harfiah “rumah Yahweh” dengan bahasa yang tetap jelas dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הֵבִיא
  choice: membawa
  rationale: Bentuk Hifil dari בוא berarti membawa atau menyebabkan datang; “membawa” paling wajar untuk pemindahan perlengkapan ke Babel.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab dan penggunaan bahasa Indonesia.
- source_word: לְ/בָבֶל
  choice: ke Babel
  rationale: Preposisi לְ menandai tujuan perpindahan.
- source_word: וַ/יִּתְּנֵם
  choice: dan menaruhnya
  rationale: נתן dalam konteks ini berarti meletakkan atau menempatkan benda di suatu lokasi; “menaruhnya” alami dalam bahasa Indonesia modern.
- source_word: בְּ/הֵיכָל/וֹ
  choice: di kuilnya
  rationale: הֵיכָל dapat berarti kuil atau istana. Karena konteksnya menyangkut perlengkapan suci, “kuilnya” paling mungkin, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: בְּ/בָבֶל
  choice: di Babel
  rationale: Preposisi בְּ menandai lokasi tempat perlengkapan itu ditaruh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna הֵיכָל untuk bangunan milik Nebukadnezar
  choice: kuilnya
  alternative: istananya
  rationale: Konteks perlengkapan rumah Yahweh mendukung bangunan pemujaan, tetapi makna leksikal “istana” tetap mungkin dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Perlengkapan” dipilih sebagai istilah umum untuk benda-benda yang digunakan di rumah Yahweh. Penanda catatan kaki ditempatkan sesudah klausa yang memuat kata ambigu.
