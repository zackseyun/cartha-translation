base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: id
  text: Ia membuang ke Babel sisa orang yang luput dari pedang. Mereka menjadi budak[a] baginya dan bagi anak-anaknya sampai Kerajaan Persia berkuasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hamba.” Istilah Ibrani dapat berarti hamba atau budak; konteks penaklukan dan pembuangan di sini mendukung “budak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Ia membawa ... ke pembuangan
  rationale: Bentuk kausatif dari גלה menyatakan tindakan membawa orang secara paksa ke pembuangan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan deportasi.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: orang-orang yang tersisa dan luput dari pedang
  rationale: הַשְּׁאֵרִית menunjuk kepada kelompok yang masih tersisa, sedangkan מִן הַחֶרֶב menjelaskan bahwa mereka selamat dari pembunuhan dalam perang. 'Luput dari pedang' mempertahankan citra Ibrani.
- source_word: אֶל בָּבֶל
  choice: di Babel
  rationale: Dalam konstruksi 'ke pembuangan di Babel', pilihan ini menyatakan Babel sebagai tujuan sekaligus tempat pembuangan secara alami dalam bahasa Indonesia.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: Mereka menjadi budak bagi dia dan anak-anaknya
  rationale: עֲבָדִים dapat berarti hamba atau budak. Konteks penaklukan, deportasi paksa, dan penundukan kepada raja Babel mendukung 'budak', sementara catatan kaki mempertahankan alternatif leksikalnya.
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: sampai Kerajaan Persia berkuasa
  rationale: מְלֹךְ adalah infinitif dari מלך dan di sini menandai berkuasanya pemerintahan Persia. Rumusan ini lebih alami daripada terjemahan harfiah 'sampai memerintahnya kerajaan Persia'.
theological_decisions:
- issue: Status עֲבָדִים dalam konteks penaklukan dan pembuangan
  choice: budak
  alternative: hamba
  rationale: Istilah Ibrani memiliki rentang makna yang mencakup hamba dan budak. Karena orang-orang ini adalah penyintas perang yang dideportasi dan ditundukkan kepada penguasa Babel beserta dinastinya, 'budak' paling jelas menyampaikan sifat hubungan yang dipaksakan tanpa menghapus alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Luput dari pedang' mempertahankan citra teks sumber, sedangkan susunan kalimat dipecah menjadi dua agar jelas bagi pembaca umum. Huruf kapital pada 'Kerajaan Persia' memperlakukan frasa itu sebagai nama kekuasaan politik tertentu.
