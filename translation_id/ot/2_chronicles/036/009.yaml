base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: id
  text: Yoyakhin berumur delapan tahun ketika ia mulai memerintah[a], dan ia memerintah tiga bulan dan sepuluh hari di Yerusalem. Ia melakukan apa yang jahat di mata Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 Raja-Raja 24:8 menyebut “delapan belas tahun”, bukan “delapan tahun”.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: berumur delapan tahun
  rationale: Ungkapan usia Ibrani yang secara harfiah berarti 'anak delapan tahun' diterjemahkan dengan ungkapan Indonesia yang alami.
- source_word: יְהוֹיָכִין
  choice: Yoyakhin
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia mulai memerintah
  rationale: Konstruksi dengan ב menandai waktu naik takhta; pilihan ini alami dan mempertahankan rumusan masa pemerintahan.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: selama tiga bulan sepuluh hari
  rationale: Menyatakan lamanya pemerintahan dengan jelas dan alami dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Padanan baku bagi kata kerja מלך dalam catatan tentang pemerintahan raja.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi lokatif diterjemahkan secara langsung.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Mempertahankan pola evaluatif Ibrani sambil tetap wajar dan mudah dipahami.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani tentang penilaian ilahi, yang juga alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Ketegangan kronologis dengan 2 Raja-Raja 24:8, yang menyebut Yoyakhin berumur delapan belas tahun ketika mulai memerintah
  choice: Mempertahankan 'delapan tahun' dalam teks utama
  alternative: delapan belas tahun
  rationale: Teks Masoret yang diberikan berbunyi 'delapan tahun'. Terjemahan mengikuti sumber tersebut dan tidak menyelaraskannya secara diam-diam dengan ayat paralel; perbedaannya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan rumusan masa pemerintahan, metafora evaluatif, nama ilahi, atau ketegangan tekstual.
