  text: וַ/יִּקְחוּ֙ עַם הָ/אָ֔רֶץ אֶת יְהוֹאָחָ֖ז בֶּן יֹאשִׁיָּ֑הוּ וַ/יַּמְלִיכֻ֥/הוּ תַֽחַת אָבִ֖י/ו בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: id
  text: Kemudian rakyat negeri itu mengambil Yoahas, anak Yosia, dan mengangkatnya menjadi raja di Yerusalem menggantikan ayahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rakyat biasa.” Ungkapan Ibrani “rakyat negeri itu” dapat menunjuk pada penduduk negeri tersebut dan, dalam konteks tertentu, pada kelompok sosial tertentu di antara mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mengambil
  rationale: Kata kerja לקח dalam konteks ini menyatakan bahwa rakyat mengambil atau memilih Yoahas untuk dijadikan raja. Pilihan ini tidak menambahkan unsur paksaan yang tidak dinyatakan oleh teks.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Ungkapan ini mempertahankan cakupan istilah Ibrani dan cukup alami dalam bahasa Indonesia. Karena istilah tersebut juga dapat menunjuk pada kelompok sosial tertentu dalam konteks tertentu, alternatifnya dicatat dalam catatan kaki.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Nama pribadi ini ditransliterasikan sesuai bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: anak Yosia
  rationale: Terjemahan langsung ini alami dan jelas dalam bahasa Indonesia.
- source_word: וַיַּמְלִיכֻהוּ
  choice: mengangkatnya menjadi raja
  rationale: Bentuk kausatif dari מלך berarti menjadikan seseorang raja atau menyebabkan dia memerintah. Ungkapan ini menyampaikan makna tersebut tanpa menambahkan upacara penobatan yang tidak disebutkan.
- source_word: תַחַת אָבִיו
  choice: menggantikan ayahnya
  rationale: תחת di sini menyatakan pergantian dalam suksesi kerajaan, bukan posisi ruang. 'Menggantikan ayahnya' menyampaikan hubungan itu secara ringkas dan alami.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב dengan nama tempat secara alami diterjemahkan 'di Yerusalem'.
