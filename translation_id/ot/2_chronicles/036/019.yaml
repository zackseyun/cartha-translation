base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: id
  text: Mereka membakar rumah Allah[a], merobohkan tembok Yerusalem, membakar semua istananya dengan api, dan menghancurkan semua barang berharganya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Bait Allah”. Secara harfiah: “rumah Allah”.'
    reason: lexical_alternative
  - marker: b
    text: Atau “semua perkakasnya yang berharga” atau “semua barangnya yang diinginkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: Mereka membakar
  rationale: Bentuk Qal wayyiqtol dari שׂרף menyatakan tindakan membakar dalam rangkaian naratif. Subjek “mereka” tersirat dalam verba orang ketiga jamak dan dibuat eksplisit agar wajar dalam bahasa Indonesia.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ungkapan Ibrani ini mempertahankan metafora sumber. Dalam konteks, ungkapan tersebut menunjuk kepada Bait Allah.
- source_word: וַיְנַתְּצוּ
  choice: merobohkan
  rationale: נתץ berarti meruntuhkan atau membongkar suatu bangunan. “Merobohkan” alami untuk objek berupa tembok dan menyampaikan penghancuran struktur.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: tembok Yerusalem
  rationale: Bentuk tunggal Ibrani dipertahankan sebagai sebutan bagi struktur pertahanan kota secara keseluruhan.
- source_word: אַרְמְנוֹתֶיהָ
  choice: semua istananya
  rationale: אַרְמוֹן dapat menunjuk istana, benteng, atau bangunan megah yang diperkokoh. “Istana” merupakan padanan umum yang sesuai dengan konteks kehancuran bangunan-bangunan utama Yerusalem; pronomina “-nya” merujuk kepada Yerusalem.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: membakar dengan api
  rationale: Frasa ini mempertahankan penyebutan eksplisit בָאֵשׁ, “dengan api,” serta pengulangan tindakan membakar yang terdapat dalam teks Ibrani.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: semua barang berharganya
  rationale: כְּלִי adalah istilah luas untuk barang, perkakas, peralatan, atau bejana, sedangkan מַחֲמַד menunjuk sesuatu yang berharga atau diinginkan. “Barang berharga” menjaga keluasan istilah dan tidak membatasi benda-benda itu hanya pada bejana ibadah.
- source_word: לְהַשְׁחִית
  choice: memusnahkan
  rationale: Infinitif Hifil ini menyatakan tindakan atau hasil penghancuran. Dalam bahasa Indonesia, verba finit yang dikoordinasikan dengan tindakan sebelumnya membuat rangkaian narasi alami tanpa mengubah maknanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur rangkaian tindakan dibuat lugas, sementara pengulangan “membakar” dan frasa “dengan api” dipertahankan untuk mencerminkan penekanan teks Ibrani. Bentuk pronomina “-nya” secara gramatikal merujuk kepada Yerusalem.
