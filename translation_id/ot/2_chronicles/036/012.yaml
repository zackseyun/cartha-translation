source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, Allahnya. Ia tidak merendahkan diri di hadapan nabi Yeremia, yang berbicara dari mulut Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan Ibrani ini merupakan rumusan penilaian moral yang berarti melakukan apa yang jahat; bentuk ini alami dalam bahasa Indonesia tanpa menghilangkan tindakan yang dinyatakan sumber.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Mempertahankan ungkapan Ibrani yang menyatakan penilaian dari sudut pandang seseorang dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Akhiran pronominal orang ketiga tunggal dipertahankan; teks secara khusus menyebut Yahweh sebagai Allah Zedekia.
- source_word: לֹא נִכְנַע
  choice: Ia tidak merendahkan diri
  rationale: Bentuk Nifal di sini paling wajar dipahami secara refleksif atau medial, yakni penolakan untuk merendahkan diri, bukan semata-mata keadaan pasif.
- source_word: מִלִּפְנֵי
  choice: di hadapan
  rationale: Menyatakan hubungan dengan Yeremia sebagai nabi yang di hadapannya Zedekia seharusnya merendahkan diri.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: Nabi Yeremia
  rationale: Gelar kenabian dipertahankan secara eksplisit dalam susunan yang alami bagi bahasa Indonesia.
- source_word: מִפִּי יְהוָה
  choice: yang berbicara atas perintah Yahweh
  rationale: Ungkapan harfiah 'dari mulut Yahweh' menyatakan bahwa pesan Yeremia berasal dari Yahweh. Kata 'berbicara' dijadikan eksplisit agar hubungan sintaksis dan fungsi kenabiannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Sifat tindakan dalam לֹא נִכְנַע
  choice: tidak merendahkan diri
  alternative: tidak ditundukkan atau tidak mau tunduk
  rationale: Bentuk Nifal dapat memuat nuansa pasif, medial, atau refleksif. Dalam konteks penilaian moral sang penulis, terjemahan refleksif paling sesuai, sambil tidak menambahkan alasan atau ajaran khusus tentang penolakannya.
- issue: Hubungan frasa מִפִּי יְהוָה dengan pelayanan Yeremia
  choice: yang berbicara atas perintah Yahweh
  alternative: dari mulut Yahweh atau menurut firman Yahweh
  rationale: Bahasa 'mulut Yahweh' menggambarkan asal dan otoritas pesan kenabian. Teks Indonesia membuat tindakan berbicara yang tersirat menjadi eksplisit, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'di mata' serta 'merendahkan diri di hadapan' mempertahankan warna Ibrani tanpa terdengar tidak wajar. Kalimat dibagi dua agar alur penilaian moral dan respons terhadap nabi mudah dipahami.
