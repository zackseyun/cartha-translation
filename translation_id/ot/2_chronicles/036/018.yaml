id: 2CH.36.18
reference: 2 Chronicles 36:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: id
  text: Semua perlengkapan Bait Allah, baik yang besar maupun yang kecil, harta benda Bait Yahweh[a], serta harta benda raja dan para pejabatnya—semuanya dibawanya ke Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “harta benda” di sini dan sesudahnya juga dapat berarti “perbendaharaan” atau “gudang penyimpanan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: perlengkapan
  rationale: Dalam konteks penjarahan bait, kata ini mencakup berbagai benda dan perkakas untuk keperluan ibadah. “Perlengkapan” lebih luas dan lebih alami dalam bahasa Indonesia modern daripada “bejana”.
- source_word: בֵּית הָאֱלֹהִים
  choice: Bait Allah
  rationale: Ungkapan ini menunjuk pada tempat ibadah di Yerusalem. “Bait Allah” mempertahankan citra ‘rumah’ dalam istilah Indonesia yang sudah lazim dan bermartabat.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: baik yang besar maupun yang kecil
  rationale: Pasangan ini menyatakan cakupan menyeluruh berdasarkan ukuran atau kepentingan. Bentuk “baik ... maupun ...” alami dalam bahasa Indonesia.
- source_word: אֹצְרוֹת
  choice: harta benda
  rationale: Kata ini dapat menunjuk pada harta maupun tempat penyimpanannya. Karena semuanya dibawa ke Babel, konteks lebih mendukung isi tempat penyimpanan, yaitu harta benda.
- source_word: בֵּית יְהוָה
  choice: Bait Yahweh
  rationale: Menerjemahkan בֵּית secara konsisten sebagai “Bait” dan mempertahankan nama ilahi יהוה sebagai “Yahweh”.
- source_word: שָׂרָיו
  choice: para pejabatnya
  rationale: Istilah ini mencakup pejabat, pemimpin, atau pembesar kerajaan. “Para pejabatnya” jelas dan tidak membatasi maknanya pada keturunan bangsawan.
- source_word: הַכֹּל הֵבִיא בָבֶל
  choice: semuanya dibawanya ke Babel
  rationale: Bentuk resumptif “semuanya” merangkum seluruh daftar. Akhiran “-nya” mempertahankan subjek tunggal tersirat dari konteks tanpa menambahkan nama yang tidak muncul dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan membedakannya dari sebutan umum “Allah” yang juga muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar serta pengulangan penutup “semuanya” dipertahankan untuk mencerminkan penekanan teks Ibrani; tanda pisah membantu pembaca menangkap rangkuman tersebut.
