  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani: semua כלי Bait Allah, besar dan kecil; אֹצרות Bait Yahweh; אֹצרות raja dan para pejabatnya; serta rangkuman bahwa semuanya dibawa ke Babel. Bentuk subjek tunggal tersirat dalam “dibawanya” sejalan dengan הֵבִיא tanpa menambahkan nama pelaku ke dalam ayat.'
