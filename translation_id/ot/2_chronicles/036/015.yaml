base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: id
  text: Yahweh, Allah nenek moyang mereka, berulang-ulang[a] mengirim pesan kepada mereka melalui utusan-utusan-Nya,[b] sebab Ia berbelas kasihan kepada umat-Nya dan kepada tempat kediaman-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bangun pagi-pagi dan mengirim,” sebuah ungkapan Ibrani yang menunjukkan tindakan tekun dan berulang-ulang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan tangan utusan-utusan-Nya.”
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah Bait Allah, yang dipandang sebagai tempat kediaman Allah di tengah umat-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar אֱלֹהִים.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan kaitan historis serta perjanjian dengan para leluhur mereka.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: mengirim pesan kepada mereka
  rationale: Kata kerja berarti 'mengirim/mengutus'; dalam konstruksi dengan para utusan, isi yang dikirim tersirat sebagai pesan. Pilihan ini menyampaikan daya komunikatif konteks tanpa menambahkan 'firman' atau 'peringatan' yang tidak dinyatakan.
- source_word: בְּיַד מַלְאָכָיו
  choice: melalui utusan-utusan-Nya
  rationale: Ungkapan Ibrani 'dengan tangan' menandai perantaraan atau sarana. 'Melalui' merupakan padanan Indonesia yang alami, sedangkan 'utusan-utusan' tidak mengarahkan pembaca secara keliru kepada makhluk surgawi.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: berulang-ulang mengirim
  rationale: Ungkapan idiomatis 'bangun pagi-pagi dan mengirim' menyatakan tindakan yang tekun, mendesak, dan berulang. Makna idiom diberikan dalam teks utama, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כִּי חָמַל
  choice: sebab Ia berbelaskasihan
  rationale: חמל menyatakan rasa iba atau belas kasihan yang mendorong seseorang untuk tidak segera menghukum atau membinasakan.
- source_word: עַל עַמּוֹ
  choice: kepada umat-Nya
  rationale: Setelah 'berbelaskasihan', עַל paling alami dinyatakan dengan 'kepada' dalam bahasa Indonesia.
- source_word: מְעוֹנוֹ
  choice: tempat kediaman-Nya
  rationale: Mempertahankan arti leksikal 'tempat tinggal/kediaman' dan hubungan teologisnya dengan kehadiran Allah, tanpa langsung menggantinya dengan referen kontekstual 'Bait Allah'.
theological_decisions:
- issue: Rujukan utusan-utusan-Nya
  choice: Utusan manusia yang membawa pesan ilahi, terutama para nabi
  alternative: Malaikat atau makhluk surgawi
  rationale: Konteks berbicara tentang peringatan Allah yang terus diberikan kepada Yehuda sebelum penghukuman. Istilah מַלְאָךְ sendiri berarti 'utusan' dan tidak mengharuskan pemahaman sebagai malaikat.
- issue: Belas kasihan terhadap tempat kediaman-Nya
  choice: Mempertahankan ungkapan 'tempat kediaman-Nya'
  alternative: Menjelaskannya langsung sebagai 'Bait Allah-Nya'
  rationale: Teks Ibrani menghubungkan belas kasihan Allah dengan umat-Nya dan kediaman-Nya. Pilihan ini mempertahankan bahasa kehadiran ilahi, sementara referen Bait Allah dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum; idiom Ibrani dijelaskan menurut maknanya dalam teks utama dan bentuk harfiahnya dipertahankan dalam catatan kaki.
