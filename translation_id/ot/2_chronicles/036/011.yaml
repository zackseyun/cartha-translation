  text: בֶּן עֶשְׂרִ֧ים וְ/אַחַ֛ת שָׁנָ֖ה צִדְקִיָּ֣הוּ בְ/מָלְכ֑/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/011.yaml
  text: Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.
translation:
  language: id
  text: Zedekia berumur dua puluh satu tahun ketika ia menjadi raja, dan ia memerintah selama sebelas tahun di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: berumur dua puluh satu tahun
  rationale: Dalam rumus usia Ibrani, בֶּן yang diikuti bilangan menyatakan usia, bukan hubungan anak; ungkapan ini dialihkan secara idiomatis dan jelas dalam bahasa Indonesia.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Nama pribadi ini menggunakan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Preposisi ב pada konstruksi ini menyatakan waktu naik takhta; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna temporalnya.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: selama sebelas tahun
  rationale: Bilangan beserta kata 'tahun' menyatakan lamanya masa pemerintahan; 'selama' memperjelas fungsi duratifnya dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini menunjuk pada tindakan memerintah sebagai raja; 'memerintah' merupakan padanan Indonesia yang ringkas dan wajar dalam konteks kerajaan.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi lokatif dan nama tempat diterjemahkan secara langsung dengan bentuk nama yang lazim dalam bahasa Indonesia.
