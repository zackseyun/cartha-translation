  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֗ה שָׁלַח֙ הַ/מֶּ֣לֶךְ נְבֽוּכַדְנֶאצַּ֔ר וַ/יְבִאֵ֣/הוּ בָבֶ֔לָ/ה עִם כְּלֵ֖י חֶמְדַּ֣ת בֵּית יְהוָ֑ה וַ/יַּמְלֵךְ֙ אֶת צִדְקִיָּ֣הוּ אָחִ֔י/ו עַל יְהוּדָ֖ה וִֽ/ירוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: id
  text: Pada pergantian tahun[a], Raja Nebukadnezar mengutus orang untuk membawa Yoyakhin ke Babel bersama barang-barang berharga dari rumah Yahweh[b]. Lalu ia mengangkat Zedekia, saudara Yoyakhin[c], menjadi raja atas Yehuda dan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada kembalinya tahun,” yaitu ketika tahun berputar atau tiba kembali.
    reason: lexical_alternative
  - marker: b
    text: Atau “perkakas-perkakas berharga dari rumah Yahweh” atau “bejana-bejana berharga dari rumah Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani berbunyi “saudaranya.” Di sini istilah kekerabatan itu dipakai secara luas; menurut silsilah kerajaan, Zedekia lebih tepatnya adalah paman Yoyakhin.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: Pada pergantian tahun
  rationale: Ungkapan ini secara harfiah menunjuk pada kembalinya atau berputarnya tahun. Terjemahan ini mempertahankan ungkapan waktunya tanpa mempersempit makna menjadi musim semi.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: mengutus orang untuk membawa Yoyakhin
  rationale: Rangkaian verba menyatakan bahwa Nebukadnezar mengirim atau mengutus lalu menyebabkan Yoyakhin dibawa. Penyebutan nama Yoyakhin memperjelas acuan pronomina dari ayat sebelumnya.
- source_word: בָבֶלָה
  choice: ke Babel
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Babel.
- source_word: כְּלֵי חֶמְדַּת
  choice: barang-barang berharga
  rationale: כְּלֵי dapat berarti perkakas, bejana, atau barang, sedangkan חֶמְדַּת menyatakan sesuatu yang berharga atau diinginkan. Pilihan ini alami dan tidak membatasi benda-benda itu hanya pada bejana.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora Ibrani 'rumah' dan menyajikan nama ilahi יהוה sebagai Yahweh.
- source_word: וַיַּמְלֵךְ
  choice: mengangkat ... menjadi raja
  rationale: Bentuk kausatif berarti menyebabkan seseorang memerintah atau menjadikannya raja; ungkapan ini wajar dalam bahasa Indonesia.
- source_word: אָחִיו
  choice: saudara Yoyakhin
  rationale: Teks Ibrani secara formal berbunyi 'saudaranya'. Nama Yoyakhin digunakan untuk memperjelas rujukan, sementara hubungan silsilah yang lebih khusus diterangkan dalam catatan kaki.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: atas Yehuda dan Yerusalem
  rationale: Kata depan עַל menandai wilayah kekuasaan Zedekia, yaitu Yehuda beserta ibu kotanya, Yerusalem.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Hubungan Zedekia dengan Yoyakhin dalam אָחִיו
  choice: saudara Yoyakhin, dengan penjelasan bahwa ia lebih tepatnya paman Yoyakhin
  alternative: kerabat Yoyakhin; paman Yoyakhin
  rationale: Terjemahan utama mempertahankan keluasan istilah kekerabatan Ibrani dan ketegangan dengan data silsilah, alih-alih menggantinya secara diam-diam dengan hubungan yang lebih spesifik.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Struktur kalimat dipecah menjadi dua agar mudah dipahami. Nama-nama mengikuti bentuk Indonesia yang lazim: Nebukadnezar, Yoyakhin, Zedekia, Yehuda, dan Yerusalem.'
