  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: id
  text: Juga, semua pemimpin para imam dan rakyat semakin banyak melakukan ketidaksetiaan, sesuai dengan segala kekejian bangsa-bangsa[a]; mereka menajiskan rumah Yahweh[b], yang telah Dia kuduskan di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “seperti segala kekejian bangsa-bangsa” atau “sesuai dengan segala praktik menjijikkan bangsa-bangsa.”'
    reason: lexical_alternative
  - marker: b
    text: Yahweh adalah nama ilahi YHWH, yang secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Juga
  rationale: Menandai kelanjutan sekaligus penambahan terhadap uraian sebelumnya tanpa melebih-lebihkan daya penegasnya.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: semua pemimpin para imam dan rakyat
  rationale: שָׂרֵי menunjuk kepada para pemimpin atau pejabat di kalangan imam; susunan ini mempertahankan struktur Ibrani dan tidak menjadikannya istilah teknis yang lebih kemudian.
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: bertambah-tambah tidak setia
  rationale: Ungkapan verba dan nomina serumpun menegaskan bahwa ketidaksetiaan mereka makin banyak atau parah. Bentuk Indonesia ini alami, kuat, dan mempertahankan nuansa pelanggaran kesetiaan kepada Allah.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: dengan mengikuti segala kekejian bangsa-bangsa lain
  rationale: כְּכֹל menyatakan kesesuaian atau kemiripan; pilihan ini menjelaskan bahwa perilaku mereka mengikuti praktik keji bangsa-bangsa, sementara kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיְטַמְּאוּ
  choice: Mereka menajiskan
  rationale: Dalam konteks bait suci, טמא menyatakan pencemaran ritual dan moral; 'menajiskan' mempertahankan bobot keagamaan tersebut.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: '''Rumah'' mempertahankan ungkapan Ibrani בֵּית, sedangkan nama ilahi ditransliterasikan sebagai Yahweh.'
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: yang telah Dia kuduskan di Yerusalem
  rationale: Klausa relatif secara paling wajar merujuk kepada rumah itu dan menyatakan bahwa Yahweh telah mengkhususkannya sebagai tempat kudus di Yerusalem.
theological_decisions:
- issue: Makna pelanggaran מָעַל dalam konteks perjanjian dan ibadah
  choice: tidak setia
  alternative: berkhianat; melakukan pelanggaran
  rationale: '''Tidak setia'' mencakup pengkhianatan terhadap hubungan dengan Allah tanpa mempersempitnya menjadi pelanggaran hukum semata.'
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi YHWH; 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Rujukan subjek pada הִקְדִּישׁ
  choice: Dia, yaitu Yahweh
  alternative: rumah yang telah dikuduskan di Yerusalem
  rationale: Bentuk verba tunggal maskulin secara alami merujuk kembali kepada Yahweh sebagai pihak yang menguduskan rumah-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang khidmat dan mudah dipahami. Pengulangan 'bertambah-tambah' dipakai untuk membawa penegasan konstruksi Ibrani tanpa menghasilkan frasa nominal yang kaku. 'Dia' dikapitalisasi sesuai kebiasaan umum bahasa Indonesia untuk rujukan kepada Allah.
