review_pass:
  verdict: revise
  source_fidelity: Draf menangkap subjek kolektif, peningkatan pelanggaran kesetiaan, pencemaran rumah Yahweh, dan klausa bahwa Yahweh telah menguduskannya. Namun, “dengan mengikuti” menambahkan gagasan mengikuti yang tidak dinyatakan secara eksplisit oleh כְּכֹל; frasa itu lebih tepat menyatakan kesesuaian/perbandingan dengan kekejian bangsa-bangsa.
  naturalness: “Bertambah-tambah tidak setia” tidak lazim dalam bahasa Indonesia baku. “Semakin banyak melakukan ketidaksetiaan” lebih alami sambil mempertahankan daya intensif konstruksi Ibrani. “Rumah Yahweh” dapat dipertahankan sebagai ungkapan harfiah dan bernuansa Alkitab.
  terminology: “Ketidaksetiaan,” “menajiskan,” “Yahweh,” dan “menguduskan” tepat bagi konteks perjanjian serta bait suci. “Bangsa-bangsa” lebih setia daripada “bangsa-bangsa lain,” karena teks tidak memuat pembatas “lain.”
  issues:
  - severity: medium
    issue: Tambahan makna pada “dengan mengikuti”
    rationale: כְּכֹל menyatakan kesesuaian atau perbandingan dengan segala kekejian bangsa-bangsa; verba “mengikuti” merupakan penjelasan yang mungkin, tetapi menambahkan relasi tindakan yang tidak eksplisit.
  - severity: medium
    issue: Ungkapan “bertambah-tambah tidak setia” kurang idiomatis
    rationale: Bentuk tersebut tidak alami dalam bahasa Indonesia modern. Revisi mempertahankan peningkatan yang ditekankan oleh הִרְבּוּ serta gagasan ketidaksetiaan dari לִמְעָול מַעַל.
  - severity: low
    issue: Catatan kaki a tidak ditambatkan pada frasa yang dibahas
    rationale: Catatan tersebut membahas כְּכֹל תֹּעֲבוֹת הַגּוֹיִם, bukan “tidak setia”; penanda dipindahkan ke frasa padanannya.
  - severity: low
    issue: Kata “lain” tidak ada dalam teks sumber
    rationale: הַגּוֹיִם berarti “bangsa-bangsa”; penambahan “lain” tidak diperlukan.
  revised_text: Juga, semua pemimpin para imam dan rakyat semakin banyak melakukan ketidaksetiaan, sesuai dengan segala kekejian bangsa-bangsa[a]; mereka menajiskan rumah Yahweh[b], yang telah Dia kuduskan di Yerusalem.
