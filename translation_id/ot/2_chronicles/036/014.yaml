revisions:
- from: Juga, semua pemimpin para imam dan rakyat bertambah-tambah tidak setia[a] dengan mengikuti segala kekejian bangsa-bangsa lain. Mereka menajiskan rumah Yahweh[b], yang telah Dia kuduskan di Yerusalem.
  to: Juga, semua pemimpin para imam dan rakyat semakin banyak melakukan ketidaksetiaan, sesuai dengan segala kekejian bangsa-bangsa[a]; mereka menajiskan rumah Yahweh[b], yang telah Dia kuduskan di Yerusalem.
  rationale: Revisi menghilangkan tambahan makna “mengikuti,” memperbaiki kelancaran bahasa Indonesia, menghapus “lain” yang tidak ada dalam sumber, dan memindahkan penanda catatan kaki a agar menambat pada frasa Ibrani yang benar. Klausa relatif tetap menyatakan bahwa Yahweh adalah pihak yang telah menguduskan rumah itu.
