  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: id
  text: Yoyakim berumur dua puluh lima tahun ketika menjadi raja, dan ia memerintah selama sebelas tahun di Yerusalem. Ia melakukan yang jahat di mata Yahweh, Allahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Ungkapan usia Ibrani ini paling wajar disampaikan dalam bahasa Indonesia dengan bentuk idiomatis “berumur ... tahun”, bukan secara harfiah “anak ... tahun”.
- source_word: יְהוֹיָקִים
  choice: Yoyakim
  rationale: Nama pribadi ini memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Preposisi ב pada bentuk yang menyatakan naik takhta menandai waktu; terjemahan ini alami dan tetap mempertahankan makna permulaan pemerintahannya.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: dan ia memerintah selama sebelas tahun
  rationale: מָלַךְ berarti memerintah sebagai raja; “selama” memperjelas bahwa sebelas tahun adalah jangka pemerintahannya.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa lokatif langsung yang menunjukkan tempat pemerintahannya.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Terjemahan ini menyampaikan idiom tindakan jahat dengan bahasa Indonesia yang alami sekaligus mempertahankan unsur verbal עָשָׂה.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan ini dekat dengan idiom Ibrani dan dapat dipahami dalam bahasa Indonesia sebagai penilaian dari sudut pandang seseorang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Akhiran orang ketiga maskulin tunggal mengacu kepada Yoyakim; bentuk posesif ini ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani secara langsung memakai tetragramaton. Bentuk “Yahweh” mempertahankan nama pribadi ilahi dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Acuan akhiran pada אֱלֹהָיו
  choice: Allahnya, dengan akhiran mengacu kepada Yoyakim
  alternative: Allah mereka atau Allah Israel
  rationale: Akhiran Ibrani adalah maskulin tunggal dan secara gramatikal paling langsung mengacu kepada subjek, Yoyakim, tanpa menambahkan penafsiran lain.
translation_notes:
  register: Bahasa Indonesia modern, baku, lugas, dan bermartabat. Formula pemerintahan dibuat alami tanpa menghilangkan susunan pokok teks Ibrani. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu ditampilkan kepada pembaca.
