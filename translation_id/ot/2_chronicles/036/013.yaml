  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: id
  text: Ia juga memberontak terhadap Raja Nebukadnezar, yang telah menyuruhnya bersumpah demi Allah.[a] Ia mengeraskan tengkuknya[b] dan mengeraskan hatinya sehingga tidak berbalik kepada Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang telah mengikatnya dengan sumpah di hadapan Allah.” Bahasa Ibrani dapat menekankan tindakan menyuruhnya bersumpah atau suasana khidmat sumpah itu dalam kaitannya dengan Allah.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “mengeraskan tengkuk” menggambarkan sikap keras kepala dan perlawanan yang membandel.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Ia juga
  rationale: Mempertahankan fungsi aditif dalam alur narasi sekaligus menyatakan subjek secara wajar dalam bahasa Indonesia.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: memberontak terhadap Raja Nebukadnezar
  rationale: Dengan מָרַד, preposisi ב menandai penguasa yang menjadi sasaran pemberontakan; bentuk ini alami dan mempertahankan makna politisnya.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים
  choice: yang telah menyuruhnya bersumpah demi Allah
  rationale: Bentuk Hifil הִשְׁבִּיעוֹ berarti menyebabkan atau menyuruh seseorang bersumpah. 'Demi Allah' mencerminkan בֵּאלֹהִים secara langsung, sementara kemungkinan nuansa sumpah di hadapan Allah dicatat dalam catatan kaki.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: Ia mengeraskan tengkuknya
  rationale: Mempertahankan metafora Ibrani tentang perlawanan yang keras kepala; catatan kaki menjelaskan maknanya bagi pembaca modern.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: mengeraskan hatinya
  rationale: Walaupun אָמֵץ pada dasarnya dapat berarti 'menguatkan', konteks penolakan untuk berbalik menunjukkan keteguhan hati yang membangkang.
- source_word: מִשּׁוּב אֶל
  choice: sehingga tidak berbalik kepada
  rationale: Mengungkapkan daya pemisahan atau pencegahan dari מִן dengan infinitif secara alami dalam bahasa Indonesia tanpa menghilangkan kaitannya dengan kekerasan hati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang hadir langsung dalam teks Ibrani.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan konstruksi genitif yang ringkas dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan namanya tanpa menggantinya dengan gelar.
- issue: Hubungan kekerasan hati dengan tindakan berbalik
  choice: sehingga tidak berbalik
  alternative: menjauhkan dirinya dari berbalik / dengan menolak berbalik
  rationale: Pilihan ini mempertahankan hubungan pencegahan atau akibat yang tersirat oleh מִן dengan infinitif, tanpa menambahkan rumusan doktrinal tentang pertobatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora Ibrani tentang tengkuk dipertahankan demi citra dan resonansi teks, dengan penjelasan singkat dalam catatan kaki.
