  yaml_path: translation/ot/2_chronicles/036/002.yaml
  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
translation:
  language: id
  text: Yoahas berumur dua puluh tiga tahun ketika ia menjadi raja, dan ia memerintah selama tiga bulan di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שָׁלֹושׁ וְעֶשְׂרִים שָׁנָה
  choice: berumur dua puluh tiga tahun
  rationale: Ungkapan Ibrani harfiah 'anak laki-laki dari dua puluh tiga tahun' merupakan idiom baku untuk menyatakan usia. Bentuk Indonesia ini alami dan menyampaikan maknanya secara tepat tanpa memerlukan catatan kaki.
- source_word: יוֹאָחָז
  choice: Yoahas
  rationale: Bentuk 'Yoahas' mengikuti ejaan nama Alkitab yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Preposisi ב dengan bentuk infinitif menandai waktu naik takhta; frasa ini jelas dan alami dalam bahasa Indonesia.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: dan ... selama tiga bulan
  rationale: Numeralia dan nomina diterjemahkan langsung; 'selama' memperjelas bahwa tiga bulan adalah jangka waktu pemerintahannya.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Dalam formula kerajaan, verba מלך berarti menjalankan pemerintahan sebagai raja. 'Memerintah' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב menunjukkan lokasi; 'di Yerusalem' adalah padanan langsung dan alami.
