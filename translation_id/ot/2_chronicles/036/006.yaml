translation:
  language: id
  text: Nebukadnezar, raja Babel, maju melawannya dan membelenggunya dengan belenggu perunggu untuk membawanya ke Babel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan rantai perunggu” atau “dengan pasungan perunggu.” Istilah Ibrani ini merujuk pada alat pengekang dari perunggu yang dikenakan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: maju menyerang dia
  rationale: Ungkapan militer עָלָה עַל menyatakan gerakan maju melawan seseorang. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan tindakan bermusuhan tanpa menyatakan secara khusus bahwa pertempuran telah terjadi.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Frasa konstruksi ini menyatakan gelar Nebukadnezar; bentuk aposisi tanpa kata sandang alami dalam bahasa Indonesia.
- source_word: וַיַּאַסְרֵהוּ
  choice: membelenggunya
  rationale: Kata אָסַר berarti mengikat atau membelenggu seorang tawanan. Pilihan ini selaras dengan penyebutan alat pengekang dari perunggu sesudahnya.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: dengan belenggu perunggu
  rationale: Bentuk ini merujuk pada alat pengekang dari perunggu, kemungkinan sepasang belenggu atau rantai. 'Belenggu perunggu' jelas, bermartabat, dan tidak memaksakan bentuk alat yang lebih spesifik daripada bahasa Ibrani.
- source_word: לְהֹלִיכוֹ
  choice: untuk membawanya
  rationale: Bentuk Hifil dari הלך berarti menyebabkan seseorang pergi; dalam konteks tawanan, 'membawanya' merupakan ungkapan Indonesia yang alami.
- source_word: בָּבֶלָה
  choice: ke Babel
  rationale: Akhiran penunjuk arah menyatakan tujuan gerak menuju Babel; 'ke Babel' adalah padanan ringkas dan tepat.
