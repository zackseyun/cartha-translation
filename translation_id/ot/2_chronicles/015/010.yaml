  text: וַ/יִּקָּבְצ֥וּ יְרוּשָׁלִַ֖ם בַּ/חֹ֣דֶשׁ הַ/שְּׁלִישִׁ֑י לִ/שְׁנַ֥ת חֲמֵשׁ עֶשְׂרֵ֖ה לְ/מַלְכ֥וּת אָסָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/010.yaml
  text: So they gathered at Jerusalem in the third month, in the fifteenth year of Asa's reign.
translation:
  language: id
  text: Maka mereka berkumpul di Yerusalem pada bulan ketiga, pada tahun kelima belas pemerintahan Asa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: Maka mereka berkumpul
  rationale: Bentuk Niphal wayyiqtol dari קבץ menyatakan kelanjutan urutan narasi dan tindakan kolektif. 'Berkumpul' alami dalam bahasa Indonesia serta cukup mempertahankan nuansa refleksif/intransitif Niphal; 'maka' mencerminkan kesinambungan naratif waw.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: pada bulan ketiga
  rationale: Ungkapan waktu ini diterjemahkan secara dekat sekaligus idiomatis; 'pada' merupakan preposisi waktu yang alami dalam bahasa Indonesia.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: pada tahun kelima belas
  rationale: Dalam rumus penanggalan berdasarkan masa pemerintahan, לִשְׁנַת paling alami diterjemahkan 'pada tahun', bukan secara harfiah sebagai 'untuk tahun'.
- source_word: לְמַלְכוּת אָסָא
  choice: pemerintahan Asa
  rationale: מַלְכוּת dalam rumus kronologis ini menunjuk pada masa pemerintahan kerajaan Asa. 'Pemerintahan Asa' jelas, ringkas, dan alami tanpa menambahkan unsur tafsir.
