base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: id
  text: Bangsa yang satu diremukkan oleh bangsa yang lain[a], dan kota yang satu oleh kota yang lain, sebab Allah mengacaukan mereka dengan segala macam kesesakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bangsa yang satu diremukkan melawan bangsa yang lain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: dihancurkan
  rationale: Bentuk Pual dari כתת menyatakan bahwa mereka diremukkan atau dihancurkan. Bentuk pasif dipertahankan, sedangkan konteks memperlihatkan kekerasan antarkelompok.
- source_word: גוֹי בְּגוֹי
  choice: bangsa oleh bangsa
  rationale: Preposisi ב dapat menandai pihak yang melakukan tindakan dalam hubungan bermusuhan. Susunan ringkas ini mempertahankan pola distributif dan paralel bahasa Ibrani.
- source_word: וְעִיר בְּעִיר
  choice: dan kota oleh kota
  rationale: Ungkapan ini dibuat sejajar dengan frasa sebelumnya dan mempertahankan gaya Ibrani yang padat, meskipun dalam bahasa Indonesia frasa 'kota yang satu oleh kota yang lain' juga mungkin.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi kehancuran yang baru disebutkan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjuk kepada Allah yang esa.
- source_word: הֲמָמָם
  choice: mengacaukan mereka
  rationale: Akar המם menyatakan tindakan menimbulkan kekacauan, kebingungan, atau kepanikan. 'Mengacaukan' mempertahankan daya aktif verba dan lebih spesifik daripada sekadar 'menyusahkan'.
- source_word: בְּכָל צָרָה
  choice: dengan segala macam kesesakan
  rationale: Preposisi ב dipahami secara instrumental atau sirkumstansial. 'Segala macam kesesakan' menyampaikan cakupan menyeluruh כָּל secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku di balik berbagai malapetaka
  choice: Allah secara aktif mengacaukan mereka dengan segala macam kesesakan.
  alternative: Allah membiarkan mereka mengalami kekacauan dalam segala kesesakan.
  rationale: Teks Ibrani memakai verba aktif tunggal dengan Allah sebagai subjek. Terjemahan mempertahankan tindakan ilahi yang dinyatakan teks tanpa mengubahnya menjadi sekadar izin dan tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat. Struktur paralel 'bangsa oleh bangsa, dan kota oleh kota' sengaja dipertahankan agar kepadatan retoris teks Ibrani tetap terasa. Istilah 'kesesakan' dipilih untuk צָרָה karena mencakup tekanan, kesulitan, dan malapetaka.
