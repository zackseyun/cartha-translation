language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: id
  text: Seluruh Yehuda bersukacita atas sumpah itu, sebab mereka telah bersumpah dengan segenap hati dan mencari Dia dengan segenap kehendak mereka. Dia membiarkan diri-Nya ditemukan oleh mereka[a], dan Yahweh mengaruniakan ketenteraman kepada mereka di segala penjuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Dia ditemukan oleh mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל יְהוּדָה
  choice: Seluruh Yehuda bersukacita
  rationale: Bentuk kolektif כָל יְהוּדָה menunjuk kepada seluruh rakyat Yehuda, sedangkan שׂמח menyatakan sukacita yang nyata dalam suasana perjanjian.
- source_word: עַל הַשְּׁבוּעָה
  choice: atas sumpah itu
  rationale: Preposisi עַל menyatakan hal atau sebab yang menjadi dasar sukacita; 'atas sumpah itu' alami dalam bahasa Indonesia dan mempertahankan fokus pada sumpah tersebut.
- source_word: בְכָל לְבָבָם נִשְׁבָּעוּ
  choice: mereka telah bersumpah dengan segenap hati
  rationale: '''Dengan segenap hati'' merupakan ungkapan Indonesia yang wajar untuk ketulusan dan kesungguhan penuh; ''telah'' menunjukkan bahwa sumpah itu mendahului sukacita mereka.'
- source_word: וּבְכָל רְצוֹנָם בִּקְשֻׁהוּ
  choice: mencari Dia dengan segenap kehendak mereka
  rationale: רָצוֹן di sini menyatakan kemauan atau kehendak yang sungguh-sungguh. Susunan ini mempertahankan kesejajaran dengan 'dengan segenap hati' dan pronomina objek pada בִּקְשֻׁהוּ.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Dia membiarkan diri-Nya ditemukan oleh mereka
  rationale: Nifal מָצָא secara bentuk berarti 'ditemukan', tetapi dalam konteks pencarian akan Allah dapat menyiratkan bahwa Dia berkenan atau membiarkan diri-Nya ditemukan. Terjemahan utama menyampaikan nuansa relasional itu, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיָּנַח יְהוָה לָהֶם מִסָּבִיב
  choice: Yahweh mengaruniakan ketenteraman kepada mereka di segala penjuru
  rationale: Hifil נוח berarti memberi atau menyebabkan keadaan tenteram. 'Ketenteraman' mencakup keamanan dari gangguan di wilayah sekeliling, dan מִסָּבִיב diterjemahkan secara alami sebagai 'di segala penjuru'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Nuansa ilahi dalam וַיִּמָּצֵא לָהֶם
  choice: Dia membiarkan diri-Nya ditemukan oleh mereka
  alternative: Dia ditemukan oleh mereka
  rationale: Pilihan utama mengungkapkan nuansa bahwa keberhasilan pencarian mereka bergantung pada kesediaan Allah menyatakan diri, tetapi catatan kaki mempertahankan bentuk pasif yang lebih harfiah agar ambiguitas gramatikal tidak hilang.
- issue: Penerjemahan nama יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankan fungsi nama pribadi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibagi dua agar mudah dibaca tanpa mengubah hubungan sebab-akibat dan urutan gagasan Ibrani. Huruf kapital pada 'Dia' dan '-Nya' dipakai sebagai konvensi penghormatan yang lazim dalam teks keagamaan Indonesia.
