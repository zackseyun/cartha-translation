id: 2CH.15.12
reference: 2 Chronicles 15:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: id
  text: Mereka mengikatkan diri dalam perjanjian[a] untuk mencari Yahweh, Allah nenek moyang mereka,[b] dengan segenap hati dan segenap jiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “masuk ke dalam perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Allah bapak-bapak mereka,” yaitu Allah yang disembah oleh para leluhur mereka.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: Mereka mengikatkan diri dalam perjanjian
  rationale: Secara harfiah verba בוא berarti datang atau masuk, tetapi bersama בַבְּרִית ungkapan ini menunjuk pada tindakan memasuki komitmen perjanjian. Terjemahan ini alami dalam bahasa Indonesia dan memperjelas tindakan pengikatan diri tanpa mengubah maknanya menjadi gerak fisik.
- source_word: לִדְרוֹשׁ
  choice: untuk mencari
  rationale: Dalam konteks keagamaan dan perjanjian, דרש berarti berpaling kepada dan mencari Allah dengan sungguh-sungguh, bukan sekadar meminta keterangan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: Ungkapan ini mengenali Yahweh sebagai Allah yang disembah para pendahulu Israel. Dalam bahasa Indonesia modern, 'nenek moyang' merupakan padanan wajar bagi bentuk jamak אבות ketika merujuk pada para leluhur.
- source_word: בְּכָל לְבָבָם
  choice: dengan segenap hati
  rationale: לֵבָב menunjuk pada batin, kehendak, dan maksud; 'segenap hati' mempertahankan rumusan perjanjian yang alami dan dikenal dalam bahasa Indonesia.
- source_word: וּבְכָל נַפְשָׁם
  choice: dan segenap jiwa
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, atau diri. Dalam pasangan formulaik dengan hati, 'jiwa' mempertahankan citra sumber dan menyatakan pengabdian seluruh diri.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Cakupan אֲבוֹתֵיהֶם
  choice: nenek moyang mereka
  alternative: bapak-bapak mereka
  rationale: Dalam konteks ini אבות merujuk kepada para leluhur sebagai kelompok lintas generasi. 'Nenek moyang' menyampaikan rujukan historis itu secara alami tanpa meniadakan latar patriarkal ungkapan Ibrani.
- issue: Makna נֶפֶשׁ dalam rumusan pengabdian
  choice: jiwa
  alternative: seluruh diri
  rationale: '''Jiwa'' mempertahankan pembedaan leksikal antara לֵבָב dan נֶפֶשׁ serta rumusan perjanjian, sementara catatan tidak diperlukan karena konteks sudah menyiratkan totalitas pengabdian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat ringkas dan mudah dibaca; 'mengikatkan diri dalam perjanjian' dipilih untuk menyampaikan idiom Ibrani secara alami, sedangkan istilah teologis utama dan kesejajaran 'hati—jiwa' dipertahankan.
