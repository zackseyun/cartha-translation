  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨הוּ֙ בֶּן עוֹדֵ֔ד הָיְתָ֥ה עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/001.yaml
  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: id
  text: Roh Allah turun atas Azarya anak Oded.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Roh Allah ada pada Azarya anak Oded.”
    reason: Alternatif ini mempertahankan pembacaan yang lebih statis dan harfiah bagi הָיְתָה עָלָיו.
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: Azarya
  rationale: Konjungsi waw meneruskan alur narasi dan tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia. Nama Ibrani עֲזַרְיָהוּ ditransliterasikan dalam bentuk Indonesia yang lazim, “Azarya”.
- source_word: בֶּן עוֹדֵד
  choice: anak Oded
  rationale: בֶּן di sini paling wajar menunjukkan hubungan ayah-anak langsung. Nama עוֹדֵד ditransliterasikan sebagai “Oded”.
- source_word: הָיְתָה עָלָיו
  choice: turun atas
  rationale: Secara harfiah ungkapan ini berarti “ada di atasnya,” tetapi dalam konteks pengilhaman kenabian bersifat peristiwa. “Turun atas” menyampaikan datangnya Roh untuk menggerakkan Azarya, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: רוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Dalam konteks ini frasa tersebut menunjuk kepada Roh milik Allah yang memberi pengilhaman kenabian. Bentuk konstruknya tentu dalam makna meskipun tanpa kata sandang pada רוּחַ.
theological_decisions:
- issue: Apakah רוּחַ אֱלֹהִים diterjemahkan secara personal sebagai “Roh Allah” atau secara tidak personal sebagai “suatu roh dari Allah”
  choice: Roh Allah
  alternative: suatu roh dari Allah; roh ilahi
  rationale: Formula penulis Tawarikh ini memperkenalkan pengilhaman dan pemberdayaan ilahi atas seorang tokoh tertentu. “Roh Allah” paling sesuai dengan konstruksi Ibrani dan konteks kenabian tanpa menambahkan klaim teologis yang melampaui teks.
- issue: Apakah הָיְתָה עָלָיו dipahami secara peristiwa atau keadaan
  choice: turun atas
  alternative: ada pada; berada atas
  rationale: Konteks berikutnya menampilkan Azarya menyampaikan firman kenabian, sehingga nuansa peristiwa masuknya pemberdayaan ilahi paling mungkin. Namun, bentuk verba Ibrani juga dapat dibaca secara statis; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Turun atas” dipilih sebagai ungkapan Alkitabiah yang tetap mudah dipahami; catatan kaki menjaga kemungkinan pembacaan statis dari bahasa Ibrani.
