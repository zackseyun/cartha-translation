  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: id
  text: Namun kamu, kuatlah dan jangan biarkan tanganmu menjadi lemah,[a] sebab ada upah bagi pekerjaanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah tanganmu menjadi lemah.” Ungkapan Ibrani ini berarti kehilangan kekuatan, keteguhan, atau keberanian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Namun kamu
  rationale: Konjungsi dan pronomina mandiri memberi penekanan kontras terhadap konteks sebelumnya. “Namun kamu” menyampaikan peralihan dan penegasan itu secara alami.
- source_word: חִזְקוּ
  choice: kuatlah
  rationale: Bentuk perintah jamak dari חזק merupakan seruan agar tetap kuat dan teguh. “Kuatlah” ringkas, langsung, dan wajar dalam bahasa Indonesia.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: dan jangan biarkan tanganmu menjadi lemah
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang tangan yang menjadi lemah, sebagai kiasan bagi hilangnya kekuatan, keteguhan, atau keberanian. Citra “tangan” dipertahankan, sedangkan bentuk kausatif dalam bahasa Indonesia membuat larangan itu alami.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya. “Sebab” mempertahankan hubungan kausal dengan jelas.
- source_word: יֵשׁ
  choice: ada
  rationale: Partikel eksistensial ini menyatakan keberadaan, bukan secara eksplisit kala mendatang; karena itu “ada” lebih dekat dengan bentuk Ibraninya daripada “akan ada”.
- source_word: שָׂכָר
  choice: upah
  rationale: שָׂכָר dapat berarti upah, ganjaran, atau imbalan. “Upah” sesuai dengan hubungan langsung antara pekerjaan dan balasan dalam ayat ini tanpa menambahkan penjelasan doktrinal.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: bagi pekerjaanmu
  rationale: Kata פְעֻלָּה menunjuk pada pekerjaan, perbuatan, atau jerih payah. “Pekerjaanmu” mempertahankan makna konkret dan cocok dengan kata “upah”.
theological_decisions:
- issue: Hakikat bahasa tentang balasan
  choice: sebab ada upah bagi pekerjaanmu
  alternative: sebab pekerjaanmu akan mendapat ganjaran
  rationale: Teks menjanjikan balasan sebagai dorongan untuk tetap setia, tetapi tidak merumuskan ajaran terperinci mengenai jasa. Terjemahan mempertahankan pernyataan lugas teks tanpa memasukkan kategori teologis yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. “Kamu” mengikuti sapaan orang kedua dalam konteks kolektif dan dapat dipahami sebagai jamak; ungkapan tangan yang melemah dipertahankan agar citra sumber tetap terasa, dengan penjelasan dalam catatan kaki.
