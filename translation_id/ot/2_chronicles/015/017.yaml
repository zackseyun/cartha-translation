revisions:
- from: Namun bukit-bukit pengurbanan tidak disingkirkan dari Israel. Meskipun demikian, hati Asa tetap utuh sepanjang hidupnya.
  to: Namun, tempat-tempat pemujaan di bukit tidak disingkirkan dari Israel; meskipun demikian, hati Asa utuh sepanjang hidupnya.
  rationale: The revision clarifies the technical cultic sense of הַבָּמוֹת in natural modern Indonesian and retains the source's contrast and deliberately broad description of Asa's heart as “whole.”
