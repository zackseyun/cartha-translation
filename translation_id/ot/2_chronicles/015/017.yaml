  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: id
  text: Namun, tempat-tempat pemujaan di bukit tidak disingkirkan dari Israel; meskipun demikian, hati Asa utuh sepanjang hidupnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: bukit-bukit pengurbanan
  rationale: Istilah ini menunjuk tempat-tempat ibadah yang umumnya berada di tempat tinggi, bukan sekadar bentang alam; terjemahan ini menyampaikan bentuk sekaligus fungsi kultisnya.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Bentuk ini secara harfiah berarti tidak beralih atau tidak lenyap; dalam konteks reformasi keagamaan, bentuk pasif alami ini mempertahankan gagasan bahwa tempat-tempat itu tidak dihapuskan.
- source_word: רַק
  choice: meskipun demikian
  rationale: Di sini partikel ini menandai kontras antara kegagalan menyingkirkan bukit-bukit pengurbanan dan penilaian positif atas hati Asa.
- source_word: לְבַב אָסָא הָיָה שָׁלֵם
  choice: hati Asa tetap utuh
  rationale: שָׁלֵם secara dasar berarti utuh, lengkap, atau tidak terbagi. 'Utuh' menjaga metafora Ibrani dan tidak mempersempitnya menjadi gagasan kesempurnaan moral ataupun sekadar ketulusan.
- source_word: כָּל יָמָיו
  choice: sepanjang hidupnya
  rationale: Ungkapan idiomatis 'seluruh hari-harinya' paling alami dinyatakan sebagai seluruh masa hidupnya.
theological_decisions:
- issue: Penilaian atas hati Asa meskipun bukit-bukit pengurbanan tetap ada
  choice: hati Asa tetap utuh
  alternative: hati Asa sepenuhnya mengabdi
  rationale: 'Terjemahan ''utuh'' mempertahankan ketegangan dalam teks: Asa dinilai positif tanpa meniadakan kegagalan reformasinya, dan tidak menambahkan objek pengabdian yang tidak tersurat dalam ayat.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Bukit-bukit pengurbanan' dipilih agar pembaca memahami bahwa yang dimaksud adalah tempat ibadah kultis. Kalimat kedua mempertahankan kontras dan ungkapan antropologis 'hati ... utuh' dari teks Ibrani.
