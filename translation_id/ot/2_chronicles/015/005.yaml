  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan seluruh unsur utama WLC: penanda waktu jamak, ketiadaan shalom, pasangan partisip generik ''yang keluar ... yang masuk'', hubungan kausal, kekacauan yang banyak, dan cakupan semua penduduk negeri-negeri. ''Menimpa'' menyampaikan fungsi עַל secara idiomatis tanpa mengubah makna.'
