id: 2CH.15.5
reference: 2 Chronicles 15:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם אֵ֥ין שָׁל֖וֹם לַ/יּוֹצֵ֣א וְ/לַ/בָּ֑א כִּ֚י מְהוּמֹ֣ת רַבּ֔וֹת עַ֥ל כָּל יוֹשְׁבֵ֖י הָ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: id
  text: Pada masa-masa itu tidak ada kedamaian bagi orang yang keluar maupun yang masuk[a], karena banyak kekacauan[b] menimpa seluruh penduduk negeri-negeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “keluar dan masuk” merupakan idiom Ibrani tentang pergerakan dalam kehidupan sehari-hari, khususnya perjalanan atau kegiatan di ruang publik.
    reason: cultural_note
  - marker: b
    text: Atau “kegemparan besar”; kata Ibrani ini dapat berarti kekacauan, kebingungan, kegemparan, atau kepanikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: Pada masa-masa itu
  rationale: Mempertahankan bentuk jamak עִתִּים dan penunjuk הָהֵם, sekaligus memakai ungkapan waktu yang wajar dalam bahasa Indonesia modern.
- source_word: אֵין שָׁלוֹם
  choice: tidak ada kedamaian
  rationale: שָׁלוֹם dapat berarti damai, kesejahteraan, atau keadaan aman. 'Kedamaian' mempertahankan keluasan maknanya, sedangkan konteks perjalanan dan kekacauan menunjukkan bahwa keamanan juga tercakup.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: bagi orang yang keluar maupun yang masuk
  rationale: Partisip-partisip tunggal ini bersifat generik. Terjemahan tersebut mempertahankan pasangan idiomatis Ibrani sambil menyatakan bahwa siapa pun yang bepergian atau melakukan kegiatan umum tidak aman.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi tidak adanya kedamaian dan paling jelas diterjemahkan sebagai hubungan sebab dalam bahasa Indonesia.
- source_word: מְהוּמֹת רַבּוֹת
  choice: banyak kekacauan
  rationale: מְהוּמָה dapat menunjuk pada kekacauan, kegemparan, kebingungan, atau kepanikan. Bentuk jamak dengan רַבּוֹת diterjemahkan secara langsung dan alami sebagai 'banyak kekacauan' tanpa mempersempit artinya.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: menimpa seluruh penduduk negeri-negeri
  rationale: '''Menimpa'' mengungkapkan gambaran עַל secara alami, yaitu kekacauan yang melanda atau membebani penduduk. Bentuk jamak הָאֲרָצוֹת dipertahankan sebagai ''negeri-negeri'', bukan dijadikan satu negeri.'
