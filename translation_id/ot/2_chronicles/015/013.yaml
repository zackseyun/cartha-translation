  text: וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יִדְרֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל יוּמָ֑ת לְ/מִן קָטֹן֙ וְ/עַד גָּד֔וֹל לְ/מֵ/אִ֖ישׁ וְ/עַד אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: id
  text: Setiap orang yang tidak mau mencari TUHAN, Allah Israel, harus dihukum mati, baik kecil maupun besar[a], baik laki-laki maupun perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “baik yang rendah maupun yang tinggi.” Ungkapan Ibrani ini menyatakan cakupan seluruh komunitas, dari yang kecil hingga yang besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Setiap orang yang
  rationale: Ungkapan ini memperkenalkan klausa relatif yang mencakup semua orang; bentuk ini alami dalam bahasa Indonesia dan mempertahankan cakupan universalnya.
- source_word: לֹא יִדְרֹשׁ
  choice: tidak mau mencari
  rationale: Dalam konteks keagamaan dan perjanjian, דרשׁ berarti mencari atau berpaling kepada Allah. Kata 'mau' menyampaikan nuansa kehendak dalam ketentuan sumpah ini tanpa mengubahnya menjadi sekadar tindakan lampau.
- source_word: לַיהוָה
  choice: TUHAN
  rationale: Nama ilahi יהוה diterjemahkan menurut konvensi Alkitab bahasa Indonesia yang umum dan bermartabat.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruktus ini secara langsung mengidentifikasi TUHAN sebagai Allah Israel.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal dari מות bersifat kausatif-pasif dan menyatakan bahwa orang itu dikenai hukuman mati. 'Harus' mempertahankan daya hukum ketentuan sumpah dalam laporan naratif.
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: baik kecil maupun besar
  rationale: Idiom ini menyatakan keseluruhan komunitas berdasarkan rentang kedudukan atau kepentingan dan tidak boleh dipersempit menjadi usia saja.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: baik laki-laki maupun perempuan
  rationale: Pasangan ini menyatakan cakupan terhadap kedua jenis kelamin; bentuk Indonesia ini alami dan tetap dekat dengan makna sumber.
theological_decisions:
- issue: Hukuman berat dalam ketentuan sumpah perjanjian
  choice: Mempertahankan pernyataan tegas bahwa pelanggar harus dihukum mati.
  alternative: Melunakkannya menjadi 'akan mati' atau menafsirkannya sebagai pengucilan maupun kutuk simbolis.
  rationale: יוּמָת secara eksplisit adalah bentuk kausatif-pasif yang berarti dikenai hukuman mati. Terjemahan tidak boleh mengurangi beratnya pernyataan teks atau menambahkan tafsir yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel 'baik ... maupun ...' membuat cakupan menyeluruh ayat ini jelas. 'Tidak mau mencari' mempertahankan nuansa kehendak dalam sumpah perjanjian, sedangkan 'harus dihukum mati' menyampaikan daya hukum dan bentuk pasif-kausatif sumber.
