  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: id
  text: Ketika Asa mendengar perkataan ini dan nubuat nabi Oded[a], ia memberanikan diri. Ia menyingkirkan benda-benda keji dari seluruh wilayah Yehuda dan Benyamin, serta dari kota-kota di daerah pegunungan Efraim yang telah direbutnya. Ia memperbarui mezbah Yahweh yang berada di depan serambi Bait Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah menurut teks Ibrani: “nubuat Oded, sang nabi.” Berdasarkan konteks sekitarnya, sebagian penafsir dan pembahasan tekstual menghubungkan nubuat ini dengan Azarya anak Oded.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Konstruksi dengan infinitif menyatakan waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan itu
  rationale: Dalam konteks ini דְּבָרִים menunjuk pada pesan yang baru disampaikan kepada Asa, sehingga 'perkataan-perkataan' lebih tepat daripada 'hal-hal'.
- source_word: וְהַנְּבוּאָה עֹדֵד הַנָּבִיא
  choice: dan nubuat Oded, sang nabi
  rationale: Mengikuti teks Masoret sebagaimana tersedia dan mempertahankan Oded sebagai nabi yang dikaitkan dengan nubuat itu, tanpa menyelaraskannya secara diam-diam dengan konteks sekitar.
- source_word: הִתְחַזַּק
  choice: ia menguatkan hatinya
  rationale: Bentuk Hitpael menyampaikan tindakan refleksif berupa meneguhkan atau memberanikan diri; ungkapan Indonesia ini alami dan tetap dekat dengan bentuk sumber.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: Ia menyingkirkan benda-benda yang menjijikkan
  rationale: שִׁקּוּצִים dalam konteks ibadah biasanya menunjuk pada benda-benda kultis atau berhala yang dipandang menjijikkan. 'Benda-benda' memberi kejelasan tanpa memasukkan rincian yang tidak dinyatakan.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: dari seluruh wilayah Yehuda dan Benyamin
  rationale: אֶרֶץ di sini merujuk pada kawasan kekuasaan; 'wilayah' terdengar lebih alami daripada 'tanah' dalam konteks geografis ini.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: serta dari kota-kota yang telah direbutnya di daerah pegunungan Efraim
  rationale: לכד berarti merebut atau menaklukkan. Frasa geografis מֵהַר אֶפְרָיִם diungkapkan secara alami sebagai lokasi kota-kota tersebut, tanpa mengubah identitas wilayahnya.
- source_word: וַיְחַדֵּשׁ
  choice: Ia juga memperbarui
  rationale: Piel dari חדשׁ berarti membuat baru atau memperbarui. Pilihan ini mempertahankan cakupan makna yang dapat mencakup pemulihan atau perbaikan.
- source_word: מִזְבַּח יְהוָה
  choice: mazbah Yahweh
  rationale: '''Mazbah'' adalah istilah Indonesia yang dikenal untuk altar persembahan, sedangkan nama ilahi ditransliterasikan sebagai Yahweh.'
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: yang berada di depan serambi Bait Yahweh
  rationale: אוּלָם menunjuk pada serambi bangunan Bait. Penambahan 'Bait' menjernihkan bahwa serambi itu merupakan bagian dari tempat kudus Yahweh, sebagaimana tersirat oleh konteks arsitektural.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Ketegangan tekstual mengenai Oded sang nabi
  choice: 'Teks utama mengikuti bacaan Masoret: ''nubuat Oded, sang nabi'''
  alternative: Menyelaraskannya menjadi nubuat Azarya anak Oded berdasarkan konteks sekitar
  rationale: Sumber yang diberikan menyebut עֹדֵד הַנָּבִיא. Terjemahan tidak mengharmoniskan bacaan ini secara diam-diam; hubungan dengan Azarya anak Oded dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Kalimat panjang sumber dibagi agar mudah dipahami. Istilah 'mazbah' dipertahankan sebagai kosakata Alkitab yang umum, sedangkan 'serambi Bait' memperjelas latar arsitektur tanpa membuat tafsiran denominatif.
