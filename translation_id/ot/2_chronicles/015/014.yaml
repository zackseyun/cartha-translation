  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: id
  text: Mereka bersumpah kepada Yahweh dengan suara nyaring, dengan sorak-sorai, dan dengan trompet serta sangkakala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: syofar, yaitu alat tiup dari tanduk; alat ini dibedakan dari “trompet” yang disebut sebelumnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: Mereka bersumpah
  rationale: Bentuk Niphal dari שׁבע di sini menyatakan tindakan mengucapkan sumpah; 'bersumpah' ringkas, alami, dan mempertahankan sifat resminya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang kepadanya sumpah diucapkan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: בְּקוֹל גָּדוֹל
  choice: dengan suara nyaring
  rationale: Ungkapan ini menunjuk pada suara yang keras; 'suara nyaring' alami dalam bahasa Indonesia dan mempertahankan penekanan auditif.
- source_word: וּבִתְרוּעָה
  choice: dengan sorak-sorai
  rationale: תְּרוּעָה dapat berarti pekikan atau seruan bersama. Dalam konteks sumpah umum yang diiringi alat musik, 'sorak-sorai' menyampaikan aklamasi kolektif tanpa memberi nuansa peperangan.
- source_word: וּבַחֲצֹצְרוֹת
  choice: dengan trompet
  rationale: חֲצֹצְרוֹת adalah trompet logam lurus yang digunakan dalam ibadah dan perhimpunan Israel; 'trompet' merupakan padanan modern yang jelas.
- source_word: וּבְשׁוֹפָרוֹת
  choice: serta sangkakala
  rationale: שׁוֹפָרוֹת adalah alat tiup dari tanduk yang dibedakan dari חֲצֹצְרוֹת. 'Sangkakala' menjaga pembedaan itu dalam bahasa Indonesia yang wajar, dengan keterangan lebih spesifik dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan mengikuti keputusan istilah yang diberikan tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur berulang 'dengan' dipertahankan secukupnya untuk mencerminkan irama Ibrani, sedangkan 'serta' menghubungkan dua jenis alat musik yang sengaja dibedakan oleh teks.
