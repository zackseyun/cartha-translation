  text: וַ/יִּזְבְּח֤וּ לַ/יהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִן הַ/שָּׁלָ֖ל הֵבִ֑יאוּ בָּקָר֙ שְׁבַ֣ע מֵא֔וֹת וְ/צֹ֖אן שִׁבְעַ֥ת אֲלָפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: id
  text: 'Pada hari itu mereka mempersembahkan kurban kepada Yahweh dari jarahan yang mereka bawa: tujuh ratus ekor ternak sapi dan tujuh ribu ekor domba[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rampasan perang”. Istilah Ibrani ini menunjuk pada barang yang diambil sebagai rampasan dalam perang.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “domba” dapat berarti ternak kecil secara lebih luas, termasuk domba dan kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: mereka mempersembahkan ... sebagai kurban
  rationale: Kata זבח dalam konteks ibadah menunjuk pada penyembelihan atau persembahan kurban. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna ritualnya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima persembahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan temporal yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: מִן הַשָּׁלָל
  choice: sebagian dari jarahan
  rationale: שָׁלָל adalah barang atau ternak hasil rampasan perang. Kata depan מִן di sini bersifat partitif karena hanya sejumlah hewan dari jarahan itu yang dipersembahkan.
- source_word: הֵבִיאוּ
  choice: yang telah mereka bawa
  rationale: Bentuk perfektif menunjukkan bahwa jarahan itu sudah dibawa sebelum dipersembahkan.
- source_word: בָּקָר
  choice: sapi
  rationale: בָּקָר merupakan istilah kolektif bagi ternak jenis sapi; “sapi” adalah padanan umum yang tidak membatasi maknanya pada lembu jantan.
- source_word: שְׁבַע מֵאוֹת
  choice: tujuh ratus ekor
  rationale: Bilangan diterjemahkan langsung; penggolong “ekor” ditambahkan agar alami dalam bahasa Indonesia.
- source_word: וְצֹאן
  choice: dan ... domba
  rationale: צֹאן menunjuk pada ternak kecil secara kolektif dan dapat mencakup domba maupun kambing. “Domba” dipakai dalam teks utama demi kelancaran, sementara cakupan yang lebih luas dijelaskan dalam catatan kaki.
- source_word: שִׁבְעַת אֲלָפִים
  choice: tujuh ribu ekor
  rationale: Bilangan diterjemahkan langsung dengan penggolong hewan yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama יהוה secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan dalam teks Ibrani. Penanda catatan kaki [a] dan [b] ditempatkan setelah frasa yang berkaitan.
