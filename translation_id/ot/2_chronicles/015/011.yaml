  source_fidelity: 'Makna pokok tersampaikan dengan benar: pada hari itu mereka mempersembahkan kurban kepada Yahweh dari jarahan yang dibawa, sejumlah 700 ternak sapi dan 7.000 ternak kecil. Namun, frasa “mempersembahkan kepada Yahweh sebagai kurban sebagian dari jarahan” kurang jelas secara sintaksis dan “sebagian” membuat nuansa partitif lebih eksplisit daripada yang diperlukan oleh מִן. Bentuk perfektif הֵבִיאוּ dapat diterjemahkan secara sederhana sebagai “mereka bawa” tanpa memaksakan urutan pluperfektif.'
  naturalness: 'Usulan revisi memakai susunan Indonesia baku dan langsung: “mempersembahkan kurban kepada Yahweh dari jarahan yang mereka bawa.” Ini menghindari penempatan “sebagai kurban” yang canggung dan memperjelas bahwa hewan-hewan yang disebut merupakan kurban tersebut.'
  terminology: “Yahweh” tepat untuk יהוה sesuai kebijakan yang diberikan. “Kurban,” “jarahan,” “ternak sapi,” dan “domba” sesuai register modern baku. Catatan untuk צֹאן perlu dipertahankan karena istilah itu dapat mencakup domba maupun kambing.
  issues:
