  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: id
  text: Dan tidak ada perang sampai tahun ketiga puluh lima pemerintahan Asa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai tahun tiga puluh lima pemerintahan Asa.” Sebagian penafsir memahami angka ini berdasarkan sistem kronologi yang lebih luas, bukan semata-mata sebagai hitungan tahun pemerintahan Asa, untuk menyelaraskannya dengan bagian-bagian terkait.
    reason: Menjelaskan bentuk alternatif ungkapan angka dan adanya penafsiran kronologis tanpa mengubah teks utama.
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: Tidak ada perang
  rationale: Klausa Ibrani memakai היה secara eksistensial dengan negasi לֹא. Ungkapan Indonesia yang alami dan tepat ialah “tidak ada perang”; waw tidak perlu diterjemahkan secara mekanis karena ayat ini merangkum bagian sebelumnya.
- source_word: עַד
  choice: sampai
  rationale: Menandai batas akhir masa tanpa perang dan secara wajar diterjemahkan “sampai”.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: tahun ketiga puluh lima
  rationale: Bentuk konstruksi yang diikuti angka menyatakan tahun pemerintahan; bilangan tingkat merupakan padanan Indonesia yang alami.
- source_word: לְמַלְכוּת אָסָא
  choice: pemerintahan Asa
  rationale: Dalam rumus penanggalan ini, מַלְכוּת menunjuk pada masa Asa memerintah sebagai raja. “Pemerintahan Asa” jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan kronologis dalam kaitannya dengan kisah-kisah lain tentang Asa
  choice: Menerjemahkan rumus tahun pemerintahan dalam teks Ibrani secara langsung sebagai “tahun ketiga puluh lima pemerintahan Asa”.
  alternative: Menafsirkan angka itu berdasarkan sistem kronologi yang lebih luas, misalnya sejak kerajaan terpecah, atau mengubah angkanya agar selaras dengan bagian lain.
  rationale: Teks Masoret secara eksplisit mengaitkan tahun ketiga puluh lima dengan pemerintahan Asa. Terjemahan mempertahankan pernyataan dan ketegangan kronologis tersebut tanpa harmonisasi atau emendasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan eksistensial “Tidak ada perang” dipilih agar alami; penanda catatan kaki [a] dicantumkan dalam teks utama.
