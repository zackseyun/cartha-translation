base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: id
  text: 'Ia pergi menemui Asa dan berkata kepadanya, “Dengarkanlah aku, Asa dan seluruh Yehuda serta Benyamin: Yahweh menyertai kalian selama kalian menyertai Dia. Jika kalian mencari Dia, Dia akan ditemui oleh kalian; tetapi jika kalian meninggalkan Dia, Dia akan meninggalkan kalian.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: Ia pergi menemui Asa
  rationale: Kata kerja יצא memajukan narasi, sedangkan לִפְנֵי setelah verba gerak dalam konteks ini secara idiomatis menyatakan pergi ke hadapan seseorang untuk menemuinya.
- source_word: שְׁמָעוּנִי
  choice: Dengarkanlah aku
  rationale: Imperatif jamak dengan sufiks orang pertama tunggal. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan seruan langsung bernada kenabian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: menyertai kalian ... kalian menyertai Dia
  rationale: Pilihan ini mempertahankan pengulangan preposisi עם dan hubungan timbal baliknya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בִּהְיוֹתְכֶם
  choice: selama kalian
  rationale: Infinitif konstruk dengan בְּ menandai keadaan yang berlangsung bersamaan; 'selama' menyampaikan nuansa duratif-kondisionalnya.
- source_word: תִּדְרְשֻׁהוּ
  choice: mencari Dia
  rationale: Dalam konteks hubungan umat dengan Allah, דרש berarti bersungguh-sungguh mencari-Nya, bukan sekadar meminta keterangan.
- source_word: יִמָּצֵא לָכֶם
  choice: Dia akan berkenan ditemui oleh kalian
  rationale: Nifal מצא secara bentuk berarti 'ditemukan/ditemui'. 'Berkenan ditemui' mengungkapkan ketersediaan ilahi tanpa mengubah umat menjadi subjek gramatikal; terjemahan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: jika kalian meninggalkan Dia, Dia akan meninggalkan kalian
  rationale: Pengulangan verba 'meninggalkan' mempertahankan timbal balik dan permainan kata dari akar עזב. Dalam bahasa Indonesia modern, pilihan ini lebih wajar daripada 'menelantarkan' atau 'meninggalkan iman kepada'.
theological_decisions:
- issue: Hubungan timbal balik bersyarat dalam bahasa perjanjian
  choice: 'Pernyataan dipertahankan sebagai kondisi nyata: penyertaan Yahweh dikaitkan dengan umat yang menyertai-Nya, dan tindakan mencari atau meninggalkan-Nya diikuti hasil yang sepadan.'
  alternative: Melunakkan pernyataan menjadi sekadar pengalaman subjektif umat tanpa kondisi perjanjian.
  rationale: Teks Ibrani memakai klausa temporal-kondisional dan dua pasangan timbal balik secara eksplisit. Terjemahan tidak memperluasnya menjadi sistem doktrinal tentang ketekunan atau kemurtadan.
- issue: Nuansa Nifal dalam יִמָּצֵא לָכֶם
  choice: Dia akan berkenan ditemui oleh kalian
  alternative: Dia akan ditemui oleh kalian
  rationale: Pilihan utama menjaga bentuk pasif dan mengisyaratkan keterbukaan ilahi, tetapi catatan kaki mempertahankan padanan yang lebih langsung agar ambiguitas antara pasif dan permisif tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak 'kalian' diperlukan karena sapaan Ibrani berbentuk jamak dan mencakup Asa, Yehuda, serta Benyamin. Huruf kapital pada 'Dia' mengikuti kebiasaan penghormatan dalam bahasa Indonesia tanpa menambahkan informasi gramatikal pada teks sumber.
