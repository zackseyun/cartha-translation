  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: id
  text: Lama sekali Israel hidup tanpa Allah yang benar[a], tanpa imam yang mengajar, dan tanpa pengajaran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah kebenaran” atau “Allah yang setia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hukum” atau “petunjuk.” Kata Ibrani torah dapat berarti pengajaran, petunjuk, atau hukum, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: Lama sekali
  rationale: Ungkapan temporal ini secara harfiah berarti 'berhari-hari lamanya/banyak hari', tetapi dalam konteks menyatakan jangka waktu yang panjang; 'lama sekali' alami dan tetap kuat dalam bahasa Indonesia.
- source_word: לְיִשְׂרָאֵל
  choice: Israel hidup
  rationale: Preposisi לְ menyatakan keadaan yang dialami Israel. Penambahan 'hidup' membuat klausa nominal Ibrani wajar dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: tanpa Allah yang benar
  rationale: לְלֹא berarti 'tanpa', sedangkan frasa konstruksi אֱלֹהֵי אֱמֶת dapat berarti 'Allah yang benar' atau secara lebih harfiah 'Allah kebenaran'. Pilihan utama ini paling alami dalam konteks Israel.
- source_word: כֹּהֵן מוֹרֶה
  choice: imam yang mengajar
  rationale: מוֹרֶה adalah bentuk partisip dari ירה, 'mengajar/memberi petunjuk'. Klausa relatif ini lebih alami dan jelas daripada bentuk majemuk yang kaku.
- source_word: תּוֹרָה
  choice: pengajaran
  rationale: תּוֹרָה memiliki cakupan 'pengajaran, petunjuk, hukum'. Dalam konteks imam yang mengajar, 'pengajaran' mempertahankan keluasan makna tanpa membatasinya hanya pada perangkat hukum.
theological_decisions:
- issue: Makna dan ketakrifan אֱלֹהֵי אֱמֶת
  choice: Allah yang benar
  alternative: Allah kebenaran; Allah yang setia
  rationale: Konteksnya adalah keadaan Israel dalam relasi dengan Allah, sehingga 'Allah yang benar' merupakan ungkapan Indonesia yang idiomatis. Catatan kaki mempertahankan bentuk dan nuansa alternatif Ibrani.
- issue: Cakupan makna תּוֹרָה
  choice: pengajaran
  alternative: hukum; Taurat; petunjuk
  rationale: Kata Ibrani ini tidak harus menunjuk secara sempit pada kode hukum atau keseluruhan Pentateukh. 'Pengajaran' sesuai dengan kaitannya pada imam yang mengajar dan tidak menutup kemungkinan nuansa hukum.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan 'tanpa' dipertahankan untuk mencerminkan struktur retoris Ibrani. Semua penanda catatan kaki muncul dalam teks utama.
