  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: id
  text: Ia mengumpulkan seluruh Yehuda dan Benyamin, serta para pendatang yang tinggal bersama mereka dari Efraim, Manasye, dan Simeon, sebab banyak orang Israel telah berpihak kepadanya[a] ketika mereka melihat bahwa Yahweh, Allahnya, menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah jatuh kepadanya”; ungkapan Ibrani ini berarti beralih dan bergabung dengannya atau memihak kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Ia mengumpulkan
  rationale: Bentuk wayyiqtol Qal dari קבץ menyatakan tindakan menghimpun orang. 'Mengumpulkan' alami dalam narasi dan tidak menambahkan kesan sidang resmi.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: seluruh Yehuda dan Benyamin
  rationale: Nama suku atau wilayah dipakai secara metonimis bagi penduduknya. Bentuk ringkas ini mempertahankan ungkapan Ibrani dan tetap mudah dipahami.
- source_word: הַגָּרִים עִמָּהֶם
  choice: para pendatang yang tinggal bersama mereka
  rationale: גֵּר menunjuk kepada orang bukan pribumi yang menetap di tengah suatu masyarakat. Frasa ini menyampaikan status menetap tanpa konotasi negatif dari 'orang asing'.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: dari Efraim, Manasye, dan Simeon
  rationale: Prefiks מִן menunjukkan asal mereka; 'dari' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: נָפְלוּ עָלָיו
  choice: telah berpihak kepadanya
  rationale: Secara harfiah ungkapan ini berarti 'jatuh kepadanya', tetapi dalam konteks politik menyatakan peralihan kesetiaan. 'Berpihak kepadanya' menjaga makna itu tanpa memastikan motif atau proses yang tidak disebutkan.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: banyak orang Israel
  rationale: לָרֹב berfungsi adverbial untuk menunjukkan jumlah besar. Susunan ini alami dalam bahasa Indonesia.
- source_word: בִּרְאֹתָם
  choice: ketika mereka melihat
  rationale: Infinitif konstruk dengan בְּ menandai keadaan atau waktu yang menyertai tindakan; 'ketika' mempertahankan hubungan itu tanpa mempersempitnya menjadi sebab semata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: Allahnya, menyertainya
  rationale: Ungkapan tersebut menyatakan kehadiran atau dukungan ilahi. 'Menyertainya' alami dalam bahasa Indonesia dan tetap menahan diri dari perluasan tafsir.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna kehadiran Allah dalam אֱלֹהָיו עִמּוֹ
  choice: Allahnya, menyertainya
  alternative: Allahnya berada di pihaknya
  rationale: Terjemahan pilihan mempertahankan pernyataan tentang penyertaan ilahi tanpa menguraikannya secara lebih khusus sebagai dukungan politik atau militer.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk alur naratif; nama 'Asa' tidak ditambahkan karena teks Ibrani memakai pronomina. Tanda koma menghindarkan pembacaan 'Yahweh Allahnya' sebagai satu rangkaian nama atau gelar.
