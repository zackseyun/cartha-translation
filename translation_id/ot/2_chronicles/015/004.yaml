base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: id
  text: Namun, dalam kesesakan mereka[a], mereka kembali kepada Yahweh, Allah Israel, mencari Dia, dan Dia ditemukan oleh mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dalam kesesakannya”; bentuk tunggal itu merujuk secara kolektif kepada Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau, secara lebih idiomatis: “Dia membiarkan diri-Nya ditemukan oleh mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: mereka kembali
  rationale: שׁוּב berarti kembali atau berbalik. Subjek tunggal dalam bentuk Ibrani dipahami secara kolektif sebagai Israel, sehingga bentuk jamak alami dalam bahasa Indonesia.
- source_word: בַּצַּר לוֹ
  choice: dalam kesesakan mereka
  rationale: צַר menunjuk pada keadaan terdesak atau mengalami kesusahan. Sufiks tunggal לוֹ secara formal berarti 'dia/-nya', tetapi dalam konteks ini merujuk secara kolektif kepada Israel dan diikuti bentuk-bentuk jamak.
- source_word: עַל יְהוָה
  choice: kepada Yahweh
  rationale: Bersama שׁוּב, preposisi עַל menyatakan arah kembalinya Israel kepada Allah. 'Kepada' merupakan padanan Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung dan alami, dengan tetap mempertahankan identifikasi perjanjian Allah dengan Israel.
- source_word: וַיְבַקְשֻׁהוּ
  choice: mereka mencari Dia
  rationale: בקשׁ dengan Allah sebagai objek berarti mencari-Nya dengan berpaling dan memohon kepada-Nya; 'mencari' mempertahankan ungkapan sumber tanpa mempersempit maknanya.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: Dia berkenan ditemui oleh mereka
  rationale: Bentuk Nifal secara harfiah dapat berarti 'Dia ditemukan oleh mereka'. 'Berkenan ditemui' menghindari kesan penemuan yang kebetulan dan menyampaikan nuansa bahwa Allah membuat diri-Nya dapat ditemukan, sementara catatan kaki mempertahankan bentuk pasif yang lebih formal.
theological_decisions:
- issue: Rujukan tunggal kolektif pada בַּצַּר לוֹ
  choice: Menggunakan bentuk jamak 'dalam kesesakan mereka'
  alternative: dalam kesesakannya
  rationale: Konteks merujuk kepada Israel sebagai satu umat, sedangkan verba dan pronomina berikutnya berbentuk jamak. Terjemahan utama memakai bentuk jamak yang alami sambil mencatat bentuk tunggal sumber.
- issue: Keagenan ilahi dalam וַיִּמָּצֵא לָהֶם
  choice: Dia berkenan ditemui oleh mereka
  alternative: Dia ditemukan oleh mereka
  rationale: Pilihan utama mengungkapkan respons ilahi tanpa menjadikannya penemuan kebetulan. Karena bentuk Ibrani tetap berupa pasif dan dapat diterjemahkan lebih langsung, alternatif itu dicantumkan dalam catatan kaki agar ketegangan gramatikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan khidmat. Struktur kalimat dipecah agar wajar bagi pembaca umum. Huruf kapital pada 'Dia' dipakai sebagai konvensi penghormatan dalam bahasa Indonesia, tanpa menambah penafsiran pada teks sumber.
