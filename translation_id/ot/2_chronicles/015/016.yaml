revisions:
- from: Bahkan Maakha, ibu Raja Asa, dicopotnya dari kedudukan sebagai ibu suri karena perempuan itu telah membuat sebuah benda mengerikan bagi Asyera.[a] Asa menebang benda mengerikan buatannya itu, meremukkannya, lalu membakarnya di Lembah Kidron.[b]
  to: Bahkan Maakha, ibu Raja Asa, dicopot oleh Asa dari kedudukannya sebagai ibu suri karena ia telah membuat sebuah benda mengerikan[a] bagi Asyera. Asa memotong benda mengerikan itu, meremukkannya, lalu membakarnya di Lembah Kidron.[b]
  rationale: Revisi memakai bentuk aktif yang lebih jelas dalam bahasa Indonesia modern, mengganti “menebang” dengan “memotong” agar tidak mengandaikan material atau bentuk benda kultis, dan menyederhanakan rujukan kepada benda tersebut. Catatan [a] diperbaiki agar alternatifnya sungguh berbeda sambil mempertahankan penjelasan tentang Asyera.
  reviewer_model: gpt-5.6-terra
