id: 2CH.15.16
reference: 2 Chronicles 15:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: id
  text: Bahkan Maakha, ibu Raja Asa, dicopot oleh Asa dari kedudukannya sebagai ibu suri karena ia telah membuat sebuah benda mengerikan[a] bagi Asyera. Asa memotong benda mengerikan itu, meremukkannya, lalu membakarnya di Lembah Kidron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Benda mengerikan” juga dapat diterjemahkan “benda menjijikkan” atau “sesuatu yang mengerikan.” Istilah Ibraninya menunjuk pada benda pemujaan yang menimbulkan rasa ngeri atau jijik. “Asyera” dapat merujuk pada dewi itu atau pada lambang pemujaan yang berkaitan dengannya.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Atau “di Wadi Kidron” atau “di aliran Kidron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bahkan
  rationale: 'Menandai tambahan yang diberi penekanan: pembaruan Asa sampai menyentuh kerabat kerajaan sendiri.'
- source_word: מַעֲכָה
  choice: Maakha
  rationale: Nama diri ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: ibu Raja Asa
  rationale: Mempertahankan hubungan keluarga dan gelar kerajaan dengan susunan alami dalam bahasa Indonesia.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: dicopotnya dari kedudukan sebagai ibu suri
  rationale: Kata kerja berarti menyingkirkan atau menghapus, sedangkan גְּבִירָה dalam lingkungan istana Yehuda menunjuk pada status resmi ibu suri. 'Dicopot' menyampaikan hilangnya kedudukan tanpa menambahkan rincian prosedural.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: karena perempuan itu telah membuat ... bagi Asyera
  rationale: Klausa dipahami sebagai alasan pencopotan. Nama Asyera dipertahankan tanpa memaksakan bahwa istilah itu di sini semata-mata berarti tiang pemujaan.
- source_word: מִפְלָצֶת
  choice: sebuah benda mengerikan
  rationale: Istilah langka ini menyatakan suatu benda kultis yang menimbulkan rasa ngeri atau jijik. 'Benda' menjaga ketidakpastian bentuknya, berbeda dari 'patung' yang terlalu spesifik.
- source_word: וַיִּכְרֹת
  choice: menebang
  rationale: Kata kerja berarti memotong atau menebang dan sesuai dengan benda kultis yang kemudian diremukkan serta dibakar.
- source_word: מִפְלַצְתָּהּ
  choice: benda mengerikan buatannya itu
  rationale: Sufiks feminin secara harfiah berarti 'miliknya'; konteks menunjukkan benda yang dibuat Maakha. Ungkapan ini menghindari kemungkinan rujukan yang rancu dalam bahasa Indonesia.
- source_word: וַיָּדֶק
  choice: meremukkannya
  rationale: Menyampaikan tindakan menghancurkan menjadi bagian-bagian kecil atau serbuk.
- source_word: וַיִּשְׂרֹף
  choice: lalu membakarnya
  rationale: Terjemahan langsung dengan 'lalu' untuk memperjelas urutan tindakan dalam bahasa Indonesia.
- source_word: בְּנַחַל קִדְרוֹן
  choice: di Lembah Kidron
  rationale: נחל dapat berarti wadi, lembah berair musiman, atau aliran air. 'Lembah Kidron' alami dan jelas secara geografis bagi pembaca modern.
theological_decisions:
- issue: Makna אֲשֵׁרָה
  choice: Asyera sebagai nama entitas ilahi/kultis kuno
  alternative: tiang Asyera; hutan keramat
  rationale: Teks mengaitkan benda buatan itu dengan Asyera, tetapi tidak memastikan bentuk bendanya. Mempertahankan nama Asyera menjaga latar keagamaan kuno dan ambiguitas antara dewi dengan lambang kultis yang berkaitan dengannya.
- issue: Gelar kerajaan גְּבִירָה
  choice: ibu suri
  alternative: permaisuri; perempuan utama; nyonya besar
  rationale: Dalam konteks kerajaan Yehuda, istilah ini paling wajar menunjuk pada kedudukan resmi ibu raja, termasuk bila seorang nenek menjalankan peranan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Ibu suri' dipakai sebagai istilah kerajaan yang mudah dipahami. Bentuk benda kultis sengaja tidak dipersempit menjadi 'patung' atau 'tiang' karena teks Ibrani tidak menentukannya secara pasti. Semua penanda catatan kaki [a] dan [b] hadir dalam teks utama.
