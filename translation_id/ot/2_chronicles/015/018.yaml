  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: id
  text: 'Ia membawa ke dalam rumah Allah barang-barang kudus milik ayahnya dan barang-barang kudus miliknya sendiri: perak, emas, dan perkakas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו
  choice: persembahan-persembahan kudus milik ayahnya
  rationale: Bentuk jamak terikat dari קֹדֶשׁ menunjuk pada benda-benda yang dikhususkan bagi Allah. 'Persembahan-persembahan kudus' menyampaikan fungsi kultisnya secara alami, sedangkan 'milik ayahnya' mempertahankan hubungan kepemilikan dalam teks.
- source_word: וְקָדָשָׁיו
  choice: dan persembahan-persembahan kudus miliknya sendiri
  rationale: Mempertahankan kesejajaran dengan frasa sebelumnya dan memperjelas bahwa sufiks orang ketiga merujuk kepada subjek, tanpa mengubahnya menjadi tindakan mempersembahkan yang tidak dinyatakan langsung.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Padanan formal dan lazim untuk sebutan tempat ibadah ini; teks memakai אֱלֹהִים dengan artikel, bukan nama ilahi.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: perak, emas, dan berbagai perkakas
  rationale: כֵּלִים adalah istilah luas bagi perkakas, barang, atau bejana. 'Berbagai perkakas' mempertahankan keluasan makna dan cocok dengan inventaris rumah Allah.
theological_decisions:
- issue: Makna benda-benda kudus
  choice: persembahan-persembahan kudus
  alternative: barang-barang kudus
  rationale: Konteks pembawaan perak, emas, dan perkakas ke rumah Allah mendukung pemahaman sebagai barang yang didedikasikan. Namun terjemahan tetap menyebut bendanya sebagai persembahan kudus, bukan menambahkan rincian ritual yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'persembahan-persembahan kudus' dipertahankan demi kesejajaran sumber; 'miliknya sendiri' dipakai untuk membedakan milik sang ayah dari milik subjek.
