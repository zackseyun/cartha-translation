  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: id
  text: Lalu raja Israel memanggil seorang pejabat[a] dan berkata, “Segera bawa Mikha bin Yimla!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang kasim” atau “seorang pejabat istana”; istilah Ibrani ini dapat menunjuk kepada seorang kasim secara harfiah atau, secara lebih umum, kepada seorang pejabat kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Bentuk naratif dari קרא di sini menyatakan bahwa raja memanggil seorang pelayan istana untuk memberinya perintah.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini secara langsung mengidentifikasi orang yang berbicara; konteks sudah membuat acuannya tertentu.
- source_word: אֶל סָרִיס אֶחָד
  choice: seorang pejabat
  rationale: סָרִיס dapat berarti orang yang dikebiri atau, secara lebih umum, pejabat istana. Dalam konteks ini fungsi orang tersebut sebagai petugas kerajaan lebih menonjol, sedangkan ambiguitas leksikal dipertahankan dalam catatan kaki.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Padanan naratif yang wajar dan langsung untuk verba ujaran ini.
- source_word: מַהֵר
  choice: Cepat, panggil
  rationale: Imperatif מהר menyatakan urgensi. Dalam konteks perintah kepada pejabat, 'Cepat, panggil' menyampaikan tuntutan agar Mikha segera didatangkan tanpa menambahkan verba yang tidak tersurat secara berlebihan.
- source_word: מיכהו
  choice: Mikha
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia untuk nabi ini.
- source_word: בֶן יִמְלָא
  choice: bin Yimla
  rationale: Ungkapan patronimik diterjemahkan secara ringkas dan alami dalam bahasa Indonesia dengan 'bin'; nama יִמְלָא ditransliterasikan sebagai 'Yimla'.
