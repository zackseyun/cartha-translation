translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan bermartabat. Rumus “Beginilah firman raja” mempertahankan corak proklamasi kerajaan, sedangkan susunan selebihnya dibuat jelas bagi pembaca umum. Penanda catatan kaki [a] dicantumkan langsung setelah ungkapan pertama yang diterangkannya.
