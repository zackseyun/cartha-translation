  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: id
  text: 'dan katakan, ‘Beginilah kata raja: Masukkan orang ini ke dalam penjara dan beri dia roti kesesakan[a] serta air kesesakan sampai aku kembali dengan selamat.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti penderitaan dan air penderitaan”; ungkapan ini dapat merujuk pada makanan dan minuman yang diberikan dalam keadaan tertekan atau sebagai ransum yang terbatas di penjara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: dan katakan
  rationale: Bentuk orang kedua jamak ini melanjutkan perintah raja. Dalam bahasa Indonesia, bentuk perintah “katakan” menyampaikan fungsinya secara alami.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Beginilah firman raja
  rationale: Ini adalah rumus pembawa pesan resmi. “Beginilah firman raja” mempertahankan nuansa deklarasi berwibawa dan dikenal secara luas dalam ragam Alkitab Indonesia.
- source_word: שִׂימוּ זֶה
  choice: Masukkan orang ini
  rationale: Kata penunjuk זֶה mengacu kepada Mikha. “Orang ini” jelas dan alami, sedangkan “masukkan” sesuai dengan tujuan yang disebut sesudahnya, yaitu penjara.
- source_word: בֵּית הַכֶּלֶא
  choice: ke dalam penjara
  rationale: Secara harfiah berarti “rumah kurungan”; “penjara” adalah padanan modern yang jelas dan idiomatis.
- source_word: וְהַאֲכִלֻהוּ
  choice: dan beri dia
  rationale: Hifil imperatif dengan sufiks orang ketiga tunggal berarti menyebabkan dia makan atau memberinya makan. Karena objeknya mencakup roti dan air, “beri dia” menghasilkan kalimat Indonesia yang alami.
- source_word: לֶחֶם לַחַץ
  choice: roti kesesakan
  rationale: Ungkapan ini menunjuk pada roti yang berkaitan dengan tekanan, penderitaan, atau kekurangan. Bentuk idiomatis dipertahankan agar makna tidak dipersempit secara pasti menjadi sekadar jatah sedikit.
- source_word: וּמַיִם לַחַץ
  choice: air kesesakan
  rationale: Padanan yang sejajar dengan “roti kesesakan” mempertahankan paralelisme Ibrani serta kemungkinan makna penderitaan dan jatah serba kekurangan.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: sampai aku kembali dengan selamat
  rationale: בְשָׁלוֹם dalam konteks kepulangan dari perang menyatakan kembali dalam keadaan aman. “Dengan selamat” alami dalam bahasa Indonesia dan mempertahankan ironi naratifnya.
