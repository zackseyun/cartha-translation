  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת שָׂרֵ֨י הָ/רֶ֤כֶב אֲשֶׁר ל/וֹ֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת הַ/קָּטֹ֖ן אֶת הַ/גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: id
  text: Raja Aram telah memerintahkan para panglima pasukan keretanya, katanya, “Janganlah kalian berperang melawan orang kecil atau orang besar[a], melainkan hanya melawan raja Israel saja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Har. “yang kecil atau yang besar”; maksudnya, siapa pun, tanpa memandang kedudukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Raja Aram
  rationale: Nama diri אֲרָם ditransliterasikan sebagai “Aram”. Konjungsi וּ tidak dinyatakan secara tersendiri karena peralihan naratif sudah wajar dalam bahasa Indonesia dan tidak mengandung kata temporal eksplisit.
- source_word: צִוָּה
  choice: telah memerintahkan
  rationale: Kata kerja ini berarti “memerintahkan”; aspek telah selesai dan latar bagi tindakan berikutnya disampaikan secara alami dengan “telah”.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: para panglima pasukan keretanya
  rationale: שָׂרֵי menunjuk para pemimpin militer, sedangkan הָרֶכֶב dapat menunjuk kereta-kereta perang sebagai satu kesatuan pasukan. Akhiran “-nya” menyampaikan אֲשֶׁר לוֹ secara ringkas tanpa mengubah hubungan kepemilikan atau komando.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan perkataan langsung secara alami sambil mempertahankan fungsi לֵאמֹר.
- source_word: לֹא תִּלָּחֲמוּ
  choice: Janganlah kalian berperang
  rationale: Bentuk ini berfungsi sebagai larangan kepada para panglima dalam bentuk jamak; “kalian” membuat jumlah jamaknya jelas.
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: melawan yang kecil ataupun yang besar
  rationale: Mempertahankan pasangan idiomatis “kecil—besar” dan cakupannya tanpa langsung menggantinya dengan parafrasa.
- source_word: כִּי אִם
  choice: melainkan hanya
  rationale: Gabungan ini menandai pengecualian yang bersifat eksklusif.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: melawan raja Israel seorang
  rationale: “Melawan” melengkapi verba “berperang” secara alami, sedangkan “seorang” mempertahankan penegasan לְבַדּוֹ bahwa raja Israel adalah satu-satunya sasaran.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-militer yang lugas. Ungkapan sumber “yang kecil ataupun yang besar” dipertahankan dalam teks utama, sedangkan makna idiomatisnya dijelaskan dalam catatan kaki.
