base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: id
  text: Lalu Zedekia anak Kenaana mendekat dan memukul Mikha di pipi[a]. Ia berkata, “Lewat jalan mana Roh Yahweh pergi dari aku untuk berbicara kepadamu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rahangnya.”
    reason: Kata Ibrani לֶחִי dapat berarti pipi atau bagian rahang.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: mendekat
  rationale: Kata kerja נגשׁ menyatakan gerak mendekati seseorang; “mendekat” alami dan mempertahankan gerak fisik dalam adegan konfrontatif ini.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekia anak Kenaana
  rationale: Nama-nama ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia, sedangkan בֶן diterjemahkan secara langsung sebagai “anak”.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: memukul Mikha pada pipinya
  rationale: נכה adalah kata umum untuk memukul, bukan secara khusus menampar. לֶחִי dapat menunjuk pipi atau bagian rahang; “pipi” paling sesuai dengan tindakan penghinaan dalam konteks ini, sementara kemungkinan “rahang” dicatat dalam catatan kaki.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Lewat jalan mana
  rationale: Ungkapan ini menanyakan jalan atau rute dan dipakai sebagai tantangan bernada mengejek. Terjemahan ini mempertahankan gambaran spasial tanpa menjadi kaku.
- source_word: עָבַר
  choice: berpindah
  rationale: עבר menggambarkan gerakan melewati atau beralih dari satu tempat kepada tempat lain. “Berpindah” mempertahankan sindiran bahwa Roh telah meninggalkan Zedekia lalu berbicara melalui Mikha.
- source_word: רוּחַ יְהוָה
  choice: Roh Yahweh
  rationale: Dalam konteks nubuat, רוּחַ menunjuk kepada Roh ilahi. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: מֵאִתִּי
  choice: dariku
  rationale: Frasa ini menandai sumber atau titik keberangkatan dan secara langsung berarti “dari aku”.
- source_word: לְדַבֵּר אֹתָךְ
  choice: untuk berbicara kepadamu
  rationale: Walaupun konstruksi Ibraninya tidak lazim, konteksnya jelas menyatakan tindakan berbicara kepada Mikha; bentuk ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian dan membedakannya dari gelar umum bagi Tuhan.
- issue: Rujukan רוּחַ dalam konteks nubuat
  choice: Roh
  alternative: roh
  rationale: Ucapan Zedekia merujuk kepada Roh ilahi yang diklaim berbicara melalui nabi. Huruf kapital memperjelas rujukannya tanpa menyetujui klaim Zedekia bahwa Roh itu sebelumnya berbicara melalui dirinya.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan bermartabat. Susunan pertanyaan mempertahankan metafora jalan dan perpindahan Roh, beserta nada sindiran Zedekia, tanpa menjelaskan atau mengesahkan klaim teologisnya.
