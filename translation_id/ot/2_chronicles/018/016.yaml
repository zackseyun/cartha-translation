  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: id
  text: Lalu Mikha berkata, “Aku melihat seluruh Israel tercerai-berai di pegunungan seperti kawanan domba yang tidak mempunyai gembala.[a] Yahweh berfirman, ‘Mereka ini tidak mempunyai tuan.[b] Biarlah masing-masing pulang ke rumahnya dengan selamat.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan secara lebih ringkas, “seperti kawanan domba tanpa gembala.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bahasa Ibrani memakai bentuk jamak: “Mereka ini tidak mempunyai para tuan.” Maksudnya, mereka tidak mempunyai penguasa atau pemimpin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Mikha berkata
  rationale: Subjek tersirat dijelaskan sebagai Mikha dari konteks langsung agar bahasa Indonesia alami dan rujukannya tidak kabur.
- source_word: נְפוֹצִים
  choice: tercerai-berai
  rationale: Menggambarkan bangsa yang terpencar setelah kehilangan pemimpin dan mempertahankan citra kawanan yang tercerai-berai.
- source_word: עַל הֶהָרִים
  choice: di pegunungan
  rationale: Ungkapan lokatif yang alami dalam bahasa Indonesia dan sesuai dengan bentuk jamak Ibrani.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: seperti kawanan domba yang tidak mempunyai gembala
  rationale: Mempertahankan perumpamaan pastoral dan klausa relatif dari teks Ibrani dalam bahasa yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: Mereka ini tidak mempunyai tuan
  rationale: Kata 'tuan' menyampaikan ketiadaan penguasa atau pemimpin; bentuk tunggal kolektif lebih alami dalam bahasa Indonesia, sedangkan bentuk jamak Ibrani dicatat dalam catatan kaki.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Biarlah masing-masing pulang ke rumahnya
  rationale: '''Biarlah'' menangkap daya yusif, sedangkan ''masing-masing'' mempertahankan pembagian individual אִישׁ tanpa menghasilkan ungkapan kaku.'
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan dari medan perang, ungkapan ini secara idiomatis menyampaikan keadaan aman dan sejahtera yang dimaksud oleh בְּשָׁלוֹם.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi; transliterasi mempertahankan perbedaannya dari gelar.
- issue: Jumlah gramatikal אֲדֹנִים dan maknanya
  choice: tuan, dengan bentuk jamak Ibrani dijelaskan dalam catatan kaki
  alternative: para tuan
  rationale: Bentuk sumber adalah jamak, tetapi 'tidak mempunyai para tuan' terdengar tidak wajar dan dapat menyiratkan beberapa penguasa tertentu. Teks utama menyampaikan keadaan tanpa pemimpin, sementara catatan mempertahankan data gramatikalnya.
- issue: Nuansa בְּשָׁלוֹם
  choice: dengan selamat
  alternative: dalam damai
  rationale: Pilihan ini mempertahankan arti kepulangan dengan aman tanpa menghapus ironi bahwa pasukan yang kalah dibubarkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Nama Mikha diperjelas dari konteks, citra gembala dipertahankan, dan konstruksi yang terlalu harfiah tetapi janggal dihindari.
