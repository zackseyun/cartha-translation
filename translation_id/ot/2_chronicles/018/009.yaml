  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami, sementara pengulangan kata 'duduk' dipertahankan karena terdapat dua kali dalam teks Ibrani dan turut membentuk gambaran adegan.
