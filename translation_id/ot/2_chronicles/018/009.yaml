- from: Raja Israel dan Yosafat, raja Yehuda, masing-masing duduk di atas takhtanya dengan mengenakan pakaian kebesaran[a]. Mereka duduk di tempat pengirikan di depan pintu gerbang Samaria, sementara semua nabi bernubuat di hadapan mereka.
  to: Raja Israel dan Yosafat, raja Yehuda, masing-masing duduk di atas takhtanya dan mengenakan pakaian; mereka duduk di tempat pengirikan di pintu masuk gerbang Samaria, dan semua nabi sedang bernubuat di hadapan mereka.
  rationale: Revisi menghapus nuansa tambahan dalam “pakaian kebesaran,” menerjemahkan lokasi gerbang dengan lebih dekat kepada konstruksi Ibrani, serta mempertahankan pengulangan “duduk” dan aspek adegan yang sedang berlangsung tanpa mengubah makna.
