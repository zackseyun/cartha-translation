  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: id
  text: Raja Israel dan Yosafat, raja Yehuda, masing-masing duduk di atas takhtanya dan mengenakan pakaian; mereka duduk di tempat pengirikan di pintu masuk gerbang Samaria, dan semua nabi sedang bernubuat di hadapan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Raja Israel
  rationale: Konjungsi וּ menghubungkan adegan ini dengan konteks sebelumnya, tetapi dalam bahasa Indonesia modern tidak harus diterjemahkan dengan kata pembuka tersendiri.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: dan Yosafat, raja Yehuda
  rationale: Nama dan gelar aposisional diterjemahkan secara lugas; tanda koma memperjelas bahwa 'raja Yehuda' menerangkan Yosafat.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: duduk ... Mereka duduk
  rationale: Pengulangan partisipel ישׁב dipertahankan untuk mencerminkan cara teks Ibrani membangun adegan, walaupun pengulangan itu sedikit lebih menonjol dalam bahasa Indonesia.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: masing-masing duduk di atas takhtanya
  rationale: אִישׁ bersifat distributif, sedangkan כִּסֵּא dalam konteks dua raja paling tepat berarti 'takhta'.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: mengenakan pakaian kebesaran
  rationale: Ungkapan ini secara harfiah berarti 'mengenakan pakaian'. Dalam konteks penampilan resmi dua raja di atas takhta, 'pakaian kebesaran' menyampaikan nuansa pakaian resmi tanpa menambahkan bahan atau bentuk tertentu; arti harfiahnya dicatat dalam catatan kaki.
- source_word: בְּגֹרֶן
  choice: di tempat pengirikan
  rationale: גֹּרֶן menunjuk pada tempat terbuka untuk mengirik hasil panen; 'tempat pengirikan' merupakan padanan Indonesia yang jelas.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: di depan pintu gerbang Samaria
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk gerbang. Ungkapan 'di depan pintu gerbang' alami dalam bahasa Indonesia dan menyatakan lokasi di area masuk gerbang kota.
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: bernubuat di hadapan mereka
  rationale: Bentuk hitpael dari נבא di sini menyatakan kegiatan bernubuat, dan לִפְנֵיהֶם berarti bahwa kegiatan itu berlangsung di hadapan kedua raja.
