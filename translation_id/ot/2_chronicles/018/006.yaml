  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: id
  text: Namun, Yosafat berkata, “Apakah di sini tidak ada lagi seorang nabi Yahweh agar kita dapat meminta petunjuk kepadanya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun, ... berkata
  rationale: Waw konsekutif melanjutkan narasi, sedangkan “Namun” menyampaikan kontras dengan kesepakatan para nabi dalam konteks sebelumnya.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַאֵין
  choice: Apakah ... tidak ada
  rationale: Mempertahankan bentuk pertanyaan negatif yang mencari penegasan.
- source_word: פֹּה
  choice: di sini
  rationale: Padanan lokatif yang langsung dan alami.
- source_word: נָבִיא לַיהוָה
  choice: nabi Yahweh
  rationale: ל menandai hubungan atau keterikatan nabi dengan YHWH; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nama ilahi.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam konteks ini menanyakan keberadaan nabi tambahan selain para nabi yang telah didengar.
- source_word: וְנִדְרְשָׁה מֵאֹתוֹ
  choice: yang dapat kita mintai petunjuk
  rationale: Kohortatif orang pertama jamak mengusulkan tindakan bersama; דרשׁ dengan מֵאֹתוֹ di sini berarti meminta petunjuk atau jawaban melalui nabi tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; “Yahweh” mempertahankan nama perjanjian dan mengikuti keputusan proyek yang diberikan.
- issue: Peran nabi dalam permintaan petunjuk
  choice: mintai petunjuk
  alternative: meminta petunjuk kepada Yahweh melalui dia
  rationale: Terjemahan utama tidak menambahkan objek ilahi yang hanya tersirat, tetapi tetap menyampaikan bahwa nabi menjadi pihak yang dimintai jawaban dalam konteks konsultasi kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Yosafat” memakai bentuk nama yang telah mapan; “mintai petunjuk” dipilih agar alami bagi pembaca umum tanpa menghilangkan konteks permintaan jawaban ilahi.
