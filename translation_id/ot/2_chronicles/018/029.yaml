  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶל יְהוֹשָׁפָ֗ט הִתְחַפֵּשׂ֙ וָ/ב֣וֹא בַ/מִּלְחָמָ֔ה וְ/אַתָּ֖ה לְבַ֣שׁ בְּגָדֶ֑י/ךָ וַ/יִּתְחַפֵּשׂ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יָּבֹ֖אוּ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: id
  text: Lalu raja Israel berkata kepada Yosafat, “Aku akan menyamar dan maju ke pertempuran, tetapi engkau, kenakanlah pakaian kebesaranmu.” Maka raja Israel menyamar, lalu mereka maju ke pertempuran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Aku akan menyamar
  rationale: Bentuknya secara morfologis adalah infinitif absolut, bukan imperatif biasa. Dalam ujaran yang ringkas ini, konteks, klausa kontras berikutnya, dan narasi sesudahnya menunjukkan bahwa raja Israel berbicara tentang tindakannya sendiri.
- source_word: וָבֹא
  choice: dan maju
  rationale: Kata בוא menyatakan masuk atau bergerak ke dalam pertempuran; 'maju' alami dalam konteks militer Indonesia dan mempertahankan arah geraknya.
- source_word: בַמִּלְחָמָה
  choice: ke pertempuran
  rationale: Preposisi dan nomina ini, bersama verba gerak, paling alami dipahami sebagai gerakan memasuki pertempuran.
- source_word: וְאַתָּה
  choice: tetapi engkau
  rationale: Pronomina eksplisit menandai kontras antara penyamaran raja Israel dan pakaian Yosafat.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: kenakanlah pakaian kebesaranmu
  rationale: בגדים pada dasarnya berarti pakaian, tetapi konteks kerajaan menunjukkan pakaian resmi yang membuat Yosafat dikenali sebagai raja. 'Pakaian kebesaran' menyampaikan implikasi kontekstual itu secara alami.
- source_word: וַיָּבֹאוּ
  choice: mereka maju
  rationale: Verba jamak merujuk pada kedua raja yang bergerak menuju pertempuran; 'maju' sesuai dengan konteks perang.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Padanan langsung dan wajar untuk gelar tersebut.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Bentuk nama yang sudah lazim dalam tradisi Alkitab berbahasa Indonesia.
