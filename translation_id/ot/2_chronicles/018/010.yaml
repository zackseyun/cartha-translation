  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥הוּ בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלּוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: id
  text: 'Kemudian Zedekia bin Kenaana membuat tanduk-tanduk dari besi untuk dirinya sendiri dan berkata, “Beginilah firman Yahweh: Dengan tanduk-tanduk ini engkau akan menanduk[a] Aram[b] sampai mereka binasa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menyeruduk”; kata kerja Ibrani ini menunjuk pada tindakan hewan bertanduk yang menghantam dengan tanduknya.
    reason: lexical_alternative
  - marker: b
    text: “Aram” juga dapat diterjemahkan “orang-orang Aram” atau, dengan istilah geografis yang lebih kemudian dan kurang tepat, “Suriah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: membuat ... untuk dirinya sendiri
  rationale: Konstruksi עשה dengan לוֹ dalam konteks tindakan simbolis Zedekia paling wajar dipahami secara refleksif. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan bahwa tanduk-tanduk itu dibuat untuk dipakainya sendiri.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekia bin Kenaana
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim bagi pembaca Alkitab berbahasa Indonesia; “bin” secara ringkas mempertahankan hubungan patronimik Ibrani.
- source_word: קַרְנֵי בַרְזֶל
  choice: tanduk-tanduk dari besi
  rationale: Bentuk jamak dan bahan bendanya dinyatakan secara jelas, sambil mempertahankan gambaran konkret tanduk sebagai lambang kekuatan.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini merupakan rumusan pembawa pesan kenabian. “Beginilah firman” terdengar wajar dan bermartabat dalam bahasa Indonesia, sedangkan nama ilahi dipertahankan sebagai Yahweh.
- source_word: בְּאֵלֶּה
  choice: Dengan tanduk-tanduk ini
  rationale: Preposisi בְּ menyatakan alat. Pengulangan “tanduk-tanduk” memperjelas acuan demonstratif jamak dalam bahasa Indonesia.
- source_word: תְּנַגַּח
  choice: engkau akan menanduk
  rationale: Verba נגח menggambarkan tindakan hewan bertanduk yang menyeruduk atau menanduk. “Menanduk” mempertahankan hubungan langsung dengan alat peraga berupa tanduk besi.
- source_word: אֶת אֲרָם
  choice: Aram
  rationale: Nama historis bangsa atau wilayah itu dipertahankan secara langsung, tanpa menggantinya dengan istilah geografis yang lebih kemudian, “Suriah”.
- source_word: עַד כַּלּוֹתָם
  choice: sampai mereka habis
  rationale: Ungkapan ini menyampaikan penyelesaian atau kebinasaan pihak yang dirujuk oleh sufiks jamak, tetapi tidak menambahkan pelaku eksplisit yang tidak dinyatakan dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Status ucapan Zedekia sebagai klaim kenabian
  choice: Mempertahankan rumusan langsung “Beginilah firman Yahweh” tanpa mengesahkannya lewat tambahan penjelasan
  alternative: Menambahkan bahwa Zedekia mengaku berbicara atas nama Yahweh
  rationale: Ayat ini melaporkan ucapan Zedekia dalam konteks naratif. Terjemahan tidak boleh lebih dahulu menentukan keabsahan klaim kenabiannya atau menyisipkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-kenabian yang bermartabat. Kalimat dibuat mudah dipahami tanpa menghilangkan tindakan simbolis tanduk besi, nama historis Aram, atau ketegangan bahwa Zedekia sedang mengucapkan rumusan kenabian sebagai sebuah klaim.
