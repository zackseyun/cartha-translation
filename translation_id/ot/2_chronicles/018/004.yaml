  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: id
  text: Lalu Yosafat berkata kepada raja Israel, “Mohon, mintalah petunjuk kepada Yahweh hari ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Carilah firman Yahweh hari ini.”
    reason: Padanan yang lebih harfiah bagi ungkapan Ibrani 'carilah firman Yahweh'; teks utama memakai ungkapan Indonesia yang idiomatis untuk konsultasi ilahi.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif wayyiqtol melanjutkan rangkaian peristiwa; “Lalu” alami dalam narasi Indonesia tanpa memberi hubungan sebab-akibat yang tidak dinyatakan.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Menggunakan bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: kepada raja Israel
  rationale: Terjemahan langsung dan alami yang mempertahankan gelar kerajaan dalam teks sumber.
- source_word: דְּרָשׁ נָא
  choice: Mohon tanyakanlah
  rationale: Dalam konteks konsultasi kenabian, דָּרַשׁ berarti mencari petunjuk atau meminta jawaban ilahi; “tanyakanlah” dapat dipahami pembaca umum, sedangkan “Mohon” mempertahankan pelembutan perintah oleh נָא.
- source_word: כַיּוֹם
  choice: hari ini
  rationale: Ungkapan ini berfungsi secara adverbial dan menekankan agar permintaan petunjuk dilakukan pada hari itu.
- source_word: אֶת דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: Objek langsung דְּבַר יְהוָה dipertahankan secara ringkas sebagai ungkapan kenabian yang lazim; bahasa Indonesia tidak memerlukan preposisi seperti bahasa Inggris.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara eksplisit terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan fungsi nama tersebut dan merupakan transliterasi ilmiah yang umum.
- issue: Ketentuan atau ketaktentuan דְּבַר יְהוָה
  choice: firman Yahweh
  alternative: suatu firman dari Yahweh
  rationale: Konstruksi Ibrani dapat dipahami sebagai ungkapan baku “firman Yahweh”; terjemahan utama mempertahankan bentuk itu tanpa menambahkan penanda tak tentu yang tidak ada dalam bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif dibuat santun dengan “Mohon”, sementara susunan kalimat tetap sederhana dan mudah dipahami.
