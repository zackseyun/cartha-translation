id: 2CH.18.22
reference: 2 Chronicles 18:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: id
  text: Sekarang, lihatlah, TUHAN telah menaruh roh dusta dalam mulut nabi-nabimu ini, dan TUHAN telah menyatakan malapetaka atasmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: Sekarang, lihatlah
  rationale: Mempertahankan penanda peralihan וְעַתָּה dan seruan penarik perhatian הִנֵּה dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi umum Alkitab bahasa Indonesia untuk Tetragramaton.
- source_word: נָתַן
  choice: telah menaruh
  rationale: Menerjemahkan makna dasar verba secara langsung serta menyampaikan tindakan yang sudah dilakukan.
- source_word: רוּחַ שֶׁקֶר
  choice: roh dusta
  rationale: Mempertahankan konstruksi yang dapat menunjuk kepada roh yang mendustakan atau menghasilkan dusta, tanpa mempersempitnya secara berlebihan.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: dalam mulut nabi-nabimu ini
  rationale: Menjaga metafora Ibrani tentang mulut sebagai sarana perkataan, sekaligus mempertahankan sufiks orang kedua dan demonstratif.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: telah menyatakan malapetaka atasmu
  rationale: Dalam konteks nubuat, דִּבֶּר berarti menyatakan atau mengucapkan; רָעָה di sini menunjuk pada bencana atau malapetaka, bukan kejahatan moral yang dilakukan raja.
theological_decisions:
- issue: Peran TUHAN dalam hadirnya roh dusta
  choice: TUHAN telah menaruh roh dusta
  alternative: TUHAN telah mengizinkan roh dusta
  rationale: Teks Ibrani memakai verba נָתַן secara langsung. Terjemahan tidak melunakkannya menjadi sekadar izin, sehingga ketegangan teologis sumber tetap dipertahankan.
- issue: Daya tindak firman penghukuman
  choice: TUHAN telah menyatakan malapetaka atasmu
  alternative: TUHAN telah merencanakan malapetaka terhadapmu
  rationale: Terjemahan mempertahankan verba 'berfirman/berbicara' dan tidak mengubahnya menjadi konsep perencanaan, sambil menyampaikan bahwa ucapan ilahi itu tertuju kepada raja.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Bentuk jamak posesif 'nabi-nabimu' memperjelas bahwa para nabi itu terkait dengan lawan bicara, sedangkan 'lihatlah' mempertahankan daya seru teks sumber.
