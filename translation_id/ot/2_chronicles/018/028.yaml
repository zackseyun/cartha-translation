source:
  edition: WLC
  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: id
  text: Lalu raja Israel dan Yosafat, raja Yehuda, pergi ke Ramot-Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Lalu ... pergi
  rationale: Kata kerja עָלָה secara harfiah berarti ‘naik’, tetapi dalam konteks perjalanan menuju suatu tempat dapat berfungsi sebagai ungkapan gerak. ‘Pergi’ menyampaikan tindakan secara alami tanpa menambahkan nuansa gerakan militer yang tidak dinyatakan oleh kata itu sendiri.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Bentuk ini merupakan padanan Indonesia yang alami dan langsung untuk gelar kerajaan tersebut; konteks telah menunjukkan raja tertentu yang dimaksud.
- source_word: וִיהוֹשָׁפָט
  choice: dan Yosafat
  rationale: Konjungsi diterjemahkan secara aditif, sedangkan nama pribadi memakai bentuk yang lazim dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar aposisional ini dipertahankan sesudah nama Yosafat dan diapit koma agar hubungan sintaksisnya jelas dalam bahasa Indonesia.
- source_word: אֶל
  choice: ke
  rationale: Preposisi ini menandai arah sekaligus tujuan perjalanan; ‘ke’ merupakan padanan Indonesia yang paling langsung.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Nama tempat majemuk ini ditransliterasikan dalam bentuk yang jelas dan lazim dikenali dalam bahasa Indonesia; tanda hubung menunjukkan bahwa kedua unsur membentuk satu nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan susunan kalimat ringkas dan bermartabat. Aposisi ‘raja Yehuda’ diberi koma untuk keterbacaan. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau teologis yang perlu dijelaskan dalam ayat ini.
