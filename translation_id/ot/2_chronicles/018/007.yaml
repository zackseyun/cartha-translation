  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: id
  text: Lalu raja Israel berkata kepada Yosafat, “Masih ada satu orang yang melaluinya kita dapat meminta petunjuk kepada Yahweh,[a] tetapi aku membencinya karena ia tidak pernah menubuatkan yang baik tentang aku, melainkan selalu yang buruk. Dia adalah Mikha anak Yimla.” Yosafat berkata, “Janganlah raja berkata demikian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mencari Yahweh melaluinya.”'
    reason: Alternatif ini mempertahankan arti dasar דרשׁ sebagai “mencari”, sedangkan terjemahan utama menggunakan ungkapan Indonesia yang lebih lazim dalam konteks meminta petunjuk ilahi melalui seorang nabi.
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: Masih ada satu orang
  rationale: Ungkapan ini menunjukkan bahwa masih tersisa satu orang yang dapat dimintai perantaraan; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: yang melalui dia kita dapat meminta petunjuk Yahweh
  rationale: Dalam konteks kenabian, דרשׁ menyatakan tindakan mencari atau meminta petunjuk ilahi, sedangkan מֵאֹתוֹ menunjukkan sang nabi sebagai perantara. Susunan ini mempertahankan kedua unsur tersebut secara wajar.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: tetapi aku membencinya
  rationale: Bentuk perfektif di sini menyatakan sikap yang telah menetap dan masih berlangsung. Kata hubung 'tetapi' menyampaikan pertentangan kontekstual dengan tersedianya nabi itu.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: karena ia tidak pernah menubuatkan yang baik tentang aku
  rationale: Partisipel yang dinegasikan menggambarkan kebiasaan, sehingga 'tidak pernah' sesuai. 'Yang baik' mempertahankan pertentangan leksikal dengan 'yang buruk' tanpa mempersempitnya menjadi sekadar kabar menyenangkan.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: melainkan sepanjang hidupnya hanya yang buruk
  rationale: Terjemahan ini mempertahankan unsur harfiah 'sepanjang hari-harinya' sebagai kebiasaan seumur hidup dan melengkapi verba 'menubuatkan' dari klausa sebelumnya.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: Mikha anak Yimla
  rationale: Nama-nama disajikan dalam bentuk Indonesia yang lazim, sedangkan hubungan patronimik בן dipertahankan secara transparan sebagai 'anak'.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Janganlah Raja berkata demikian
  rationale: Larangan tidak langsung dengan אַל dan bentuk imperfektif dipertahankan. Ungkapan orang ketiga menjaga teguran Yosafat yang hormat kepada raja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dialihaksarakan sebagai nama pribadi, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Makna baik dan buruk dalam nubuat Mikha
  choice: yang baik ... yang buruk
  alternative: hal yang menguntungkan ... malapetaka
  rationale: Istilah לְטוֹבָה dan לְרָעָה dapat menunjuk pada hasil yang baik atau buruk bagi raja, tetapi pasangan 'baik/buruk' menjaga keluasan dan ketegangan bahasa sumber tanpa menambahkan tafsiran moral atau pragmatis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan tidak langsung 'Janganlah Raja' mempertahankan kesantunan istana. Nama 'Mikha' dan 'Yosafat' mengikuti bentuk yang dikenal luas dalam bahasa Indonesia; nama ilahi tetap 'Yahweh'.
