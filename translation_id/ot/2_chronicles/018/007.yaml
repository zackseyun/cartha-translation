  to: Lalu raja Israel berkata kepada Yosafat, “Masih ada satu orang yang melaluinya kita dapat meminta petunjuk kepada Yahweh,[a] tetapi aku membencinya karena ia tidak pernah menubuatkan yang baik tentang aku, melainkan selalu yang buruk. Dia adalah Mikha anak Yimla.” Yosafat berkata, “Janganlah raja berkata demikian.”
