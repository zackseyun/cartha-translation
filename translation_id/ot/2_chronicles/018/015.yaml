  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: id
  text: Lalu raja berkata kepadanya, “Berapa kali aku harus membuatmu bersumpah untuk tidak mengatakan kepadaku apa pun selain kebenaran dalam nama Yahweh?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” alami dalam narasi Indonesia dan tetap menunjukkan kesinambungan peristiwa.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit dalam bahasa Ibrani merujuk kepada tokoh yang sudah diketahui; bahasa Indonesia secara alami tidak memerlukan kata sandang.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Berapa kali
  rationale: Ungkapan idiomatis yang menyampaikan kejengkelan karena tindakan yang dianggap harus diulangi.
- source_word: מַשְׁבִּיעֶךָ
  choice: aku harus menyuruh engkau bersumpah
  rationale: Bentuk hifil dari שבע berarti menyebabkan seseorang bersumpah atau menempatkannya di bawah sumpah. “Harus” menyampaikan daya retoris dan kejengkelan pertanyaan.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: bahwa engkau tidak akan mengatakan kepadaku apa pun selain kebenaran
  rationale: Negasi dengan רַק dipertahankan dalam susunan Indonesia yang alami, sehingga isi sumpah dan penekanan eksklusifnya tetap jelas.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Frasa tersebut menunjukkan otoritas atau lingkup khidmat dari ucapan itu; nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama diri ilahi tanpa menggantinya dengan gelar, sedangkan “TUHAN” dan “Yehova” merupakan tradisi penerjemahan atau pelafalan alternatif.
- issue: Hubungan sumpah dengan perkataan dalam nama Yahweh
  choice: “bersumpah bahwa ... mengatakan ... dalam nama Yahweh”
  alternative: “memperingatkan dengan sungguh-sungguh supaya ... mengatakan ... demi nama Yahweh”
  rationale: Hifil שבע paling langsung menunjukkan tindakan membuat seseorang bersumpah. Cakupan frasa “dalam nama Yahweh” dapat berkaitan dengan tuntutan bersumpah atau dengan penyampaian kebenaran; terjemahan mempertahankan keterkaitan frasa itu tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” dipilih untuk dialog Alkitab yang tetap mudah dipahami; urutan negatif “tidak ... apa pun selain” mempertahankan struktur dan tekanan sumber secara alami.
