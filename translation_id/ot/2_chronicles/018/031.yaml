  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: id
  text: Ketika para panglima pasukan kereta perang melihat Yosafat, mereka berkata, “Dialah raja Israel.” Lalu mereka berbalik untuk berperang melawannya. Yosafat berteriak, Yahweh menolongnya, dan Allah mengalihkan mereka darinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah membuat mereka berbalik menjauh darinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  choice: para panglima pasukan kereta
  rationale: שָׂרֵי menunjuk kepada para pemimpin militer, sedangkan הָרֶכֶב menunjuk kepada pasukan kereta perang. Pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: Dialah raja Israel!
  rationale: Klausa nominal Ibrani ini menyatakan identifikasi yang tegas. “Dialah” secara alami menyampaikan bahwa mereka menyangka Yosafat sebagai raja Israel.
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: mereka berbalik menyerangnya
  rationale: סבב dapat berarti berbalik atau bergerak mengitari. Dalam konteks pertempuran, para panglima mengarahkan gerakan mereka kepada Yosafat sebagai sasaran; “menyerangnya” menyampaikan maksud bermusuhan tanpa menyatakan bahwa mereka sudah mengepungnya.
- source_word: לְהִלָּחֵם
  choice: menyerangnya
  rationale: Infinitif ini menyatakan tujuan, yakni bertempur melawan Yosafat. Dalam susunan Indonesia, maknanya digabungkan secara alami dengan klausa sebelumnya.
- source_word: וַיִּזְעַק
  choice: berteriak
  rationale: זעק menyatakan seruan kuat dalam keadaan terdesak. Terjemahan ini mempertahankan intensitasnya tanpa menambahkan kepada siapa ia berseru.
- source_word: וַיהוָה עֲזָרוֹ
  choice: Yahweh menolongnya
  rationale: עזר berarti menolong, dan nama ilahi יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: Allah mengalihkan mereka darinya
  rationale: Bentuk kausatif סות di sini menyatakan bahwa Allah membuat mereka berpindah atau berbalik menjauh dari Yosafat. “Mengalihkan” mempertahankan tindakan ilahi tanpa memberi nuansa bujukan moral yang tidak dituntut konteks.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ketika ... melihat
  rationale: Ungkapan pembuka naratif Ibrani disampaikan secara alami dengan “Ketika” tanpa mempertahankan formula yang akan terasa kaku dalam bahasa Indonesia.
theological_decisions:
- issue: Pembedaan nama ilahi יְהוָה dan sebutan אֱלֹהִים dalam ayat yang sama
  choice: Yahweh ... Allah
  alternative: TUHAN ... Allah
  rationale: 'Terjemahan mempertahankan perbedaan yang ada dalam teks Ibrani: nama perjanjian יְהוָה diterjemahkan “Yahweh”, sedangkan אֱלֹהִים diterjemahkan “Allah”.'
- issue: Apakah teriakan Yosafat harus dinyatakan secara eksplisit sebagai doa
  choice: Yosafat berteriak
  alternative: Yosafat berseru kepada Yahweh
  rationale: Teks ayat ini tidak menyebutkan pihak yang diseru. Terjemahan tidak menambahkan bahwa teriakan itu secara eksplisit ditujukan kepada Yahweh, meskipun klausa berikutnya menyatakan bahwa Yahweh menolongnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah militer dibuat mudah dipahami, urutan tindakan dipertahankan, dan peralihan dari “Yahweh” kepada “Allah” mengikuti teks Ibrani.
