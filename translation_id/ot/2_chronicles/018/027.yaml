base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: id
  text: Mikha berkata, “Jika engkau benar-benar kembali dengan selamat, maka Yahweh tidak berbicara melalui aku.” Lalu ia berkata, “Dengarlah, hai semua bangsa!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Jika engkau benar-benar kembali
  rationale: Gabungan infinitif absolut dan bentuk verba finit memberi penegasan pada syarat; “benar-benar” menyampaikan tekanan itu secara alami.
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan dari pertempuran, שָׁלוֹם menunjuk pada kembali tanpa cedera; “dengan selamat” lebih alami dan tepat secara kontekstual daripada ungkapan harfiah “dalam damai”.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: berarti Yahweh tidak berbicara melalui aku
  rationale: Kata “berarti” memperjelas implikasi syarat tanpa mengubah logikanya, sedangkan “melalui aku” menyampaikan fungsi instrumental בִּי dalam bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: שִׁמְעוּ
  choice: Dengarlah
  rationale: Bentuk imperatif jamak dipertahankan sebagai seruan profetis yang khidmat dan alami.
- source_word: עַמִּים כֻּלָּם
  choice: hai segala bangsa
  rationale: Bentuk jamak עַמִּים dipertahankan sebagai “bangsa-bangsa” secara semantis; ungkapan idiomatis “segala bangsa” menyampaikan cakupan jamak dan sapaan luas dengan lancar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan bentuk nama itu tanpa menggantinya dengan gelar.
- issue: Penutur klausa terakhir וַיֹּאמֶר שִׁמְעוּ עַמִּים כֻּלָּם
  choice: Kata ganti “ia” merujuk kepada Mikha
  alternative: Membiarkan penutur sepenuhnya tidak ditentukan
  rationale: Subjek terdekat yang disebutkan ialah Mikha, tetapi terjemahan tetap memakai kata ganti sebagaimana teks sumber dan tidak mengulang namanya.
- issue: Cakupan seruan עַמִּים כֻּלָּם
  choice: segala bangsa
  alternative: seluruh rakyat
  rationale: Bentuk jamak “bangsa-bangsa” merupakan seruan profetis yang luas dan tidak boleh dipersempit menjadi satu kelompok pendengar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” cocok dengan ujaran langsung kepada raja dan mempertahankan bentuk tunggal. Struktur dibuat alami tanpa menghilangkan penegasan syarat atau keluasan seruan profetis.
