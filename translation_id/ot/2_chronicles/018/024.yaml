  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: id
  text: Mikha berkata, “Lihatlah, pada hari itu engkau akan melihat[a] ketika engkau masuk ke kamar bagian dalam untuk bersembunyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "kamar ke dalam kamar"; ungkapan ini juga dapat dipahami "dari kamar ke kamar."
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הִנְּךָ רֹאֶה
  choice: Lihatlah, engkau akan mengalaminya
  rationale: הִנְּךָ menarik perhatian dan, bersama partisip רֹאֶה, menyatakan pengalaman yang akan datang. 'Mengalaminya' menyampaikan maksud idiomatis 'melihat' sebagai menyaksikan sendiri terbuktinya perkataan itu.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari ketika
  rationale: Ungkapan waktu ini dihubungkan secara alami dengan anak kalimat berikut tanpa mengubah rujukan kepada hari yang akan datang.
- source_word: אֲשֶׁר תָּבוֹא
  choice: ketika engkau masuk
  rationale: אֲשֶׁר memperkenalkan keadaan saat nubuat itu terbukti, sedangkan בוא dalam konteks ruang tertutup paling alami diterjemahkan 'masuk'.
- source_word: חֶדֶר בְּחֶדֶר
  choice: ke ruang yang paling dalam
  rationale: Ungkapan berulang ini menunjuk pada masuk lebih jauh ke kamar atau ruang bagian dalam; terjemahan ini alami dalam bahasa Indonesia dan cocok dengan tujuan bersembunyi.
- source_word: לְהֵחָבֵא
  choice: untuk bersembunyi
  rationale: Infinitif Nifal menyatakan tujuan menyembunyikan diri; 'bersembunyi' sudah secara alami bersifat refleksif dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' mempertahankan bentuk orang kedua tunggal serta nada konfrontatif langsung. Ambiguitas rujukan objek dalam 'melihat' dijaga dengan pronomina 'mengalaminya' tanpa menambahkan penjelasan doktrinal.
