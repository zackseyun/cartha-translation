base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: id
  text: Lalu roh itu berkata, “Aku akan keluar dan menjadi roh dusta[a] dalam mulut semua nabinya.” TUHAN berkata, “Engkau akan membujuknya[b] dan juga akan berhasil. Keluarlah dan lakukanlah demikian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: roh kebohongan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: memperdayanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu roh itu berkata / TUHAN berkata
  rationale: 'Subjek kedua klausa ditentukan dari konteks penglihatan: roh itu mengajukan rencananya, lalu TUHAN menjawab. Penyebutan subjek membuat pergantian pembicara jelas dalam bahasa Indonesia.'
- source_word: אֵצֵא
  choice: Aku akan keluar
  rationale: Bentuk orang pertama dari יצא menyatakan tindakan yang hendak dilakukan dan mempertahankan gagasan gerak ke luar.
- source_word: וְהָיִיתִי לְרוּחַ שֶׁקֶר
  choice: dan menjadi roh dusta
  rationale: Dalam konstruksi predikatif ini, היה dapat menyatakan peralihan ke suatu peran. 'Menjadi roh dusta' alami dalam bahasa Indonesia dan mempertahankan sifat menipu dari roh tersebut.
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: dalam mulut semua nabinya
  rationale: Terjemahan ini mempertahankan gambaran konkret bahasa Ibrani tentang perkataan yang disampaikan melalui para nabi. Sufiks orang ketiga tunggal merujuk kepada Ahab.
- source_word: תְּפַתֶּה
  choice: Engkau akan membujuknya
  rationale: Piel dari פתה dapat berarti membujuk atau memperdaya. 'Membujuk' mempertahankan keluasan makna, sedangkan unsur penipuannya dijelaskan sebagai alternatif dalam catatan kaki.
- source_word: וְגַם תּוּכָל
  choice: dan juga akan berhasil
  rationale: יכל di sini menyatakan kemampuan yang terbukti efektif dalam menjalankan rencana, bukan sekadar kemungkinan abstrak. 'Akan berhasil' sesuai dengan konteks penugasan tersebut.
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: Keluarlah dan lakukanlah demikian
  rationale: Dua bentuk perintah diterjemahkan secara langsung; 'demikian' merujuk kepada rencana yang baru saja dikemukakan.
theological_decisions:
- issue: Keterlibatan ilahi dalam misi penipuan di dalam penglihatan
  choice: Jawaban TUHAN disampaikan sebagai izin sekaligus perintah agar roh itu menjalankan rencananya.
  alternative: Melunakkan jawabannya sehingga hanya tampak sebagai pengamatan atau izin pasif.
  rationale: Teks Ibrani secara lugas menampilkan rencana roh itu, kepastian bahwa rencana tersebut akan berhasil, dan perintah untuk melaksanakannya. Ketegangan teologis ini dipertahankan tanpa dijelaskan atau dilunakkan oleh parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Roh dusta' singkat dan mudah dipahami, sedangkan 'dalam mulut' sengaja mempertahankan citra bahasa sumber. Nama TUHAN ditambahkan sebagai subjek eksplisit berdasarkan konteks agar pergantian pembicara tidak kabur.
