  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: id
  text: 'Semua nabi itu pun sedang bernubuat demikian: “Majulah ke Ramot-Gilead dan berhasillah! Yahweh akan menyerahkannya[a] ke tangan raja.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh telah menyerahkannya ke tangan raja.” Bentuk Ibraninya dapat menyatakan hasil yang akan datang sebagai sesuatu yang sudah pasti dalam ujaran kenabian ini.
    reason: Menjaga ambiguitas aspek bentuk Ibrani antara masa depan yang dipastikan dan penggambaran profetis sebagai tindakan yang telah terlaksana.
lexical_decisions:
- source_word: וְ/כָל הַנְּבִאִים
  choice: Semua nabi itu pun
  rationale: Menyampaikan subjek kolektif yang tentu dalam konteks serta kesinambungan narasi dari waw tanpa membuat pembukaan ayat terasa kaku.
- source_word: נִבְּאִים
  choice: sedang bernubuat
  rationale: Bentuk partisip Ibrani menggambarkan tindakan yang sedang berlangsung atau terjadi bersamaan.
- source_word: כֵּן
  choice: demikian
  rationale: Menunjukkan cara atau keseragaman isi nubuat mereka dengan ungkapan Indonesia yang ringkas dan bermartabat.
- source_word: לֵאמֹר
  choice: kata mereka
  rationale: Memperkenalkan kutipan langsung secara alami dalam bahasa Indonesia; subjek jamak dipulihkan dari konteks.
- source_word: עֲלֵה
  choice: Majulah ke
  rationale: Mempertahankan arti dasar perintah ‘naik/maju’; dalam konteks militer, ‘majulah ke’ terdengar alami tanpa secara eksplisit menambahkan ‘seranglah’.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Transliterasi nama tempat yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וְ/הַצְלַח
  choice: dan berhasillah
  rationale: Mempertahankan bentuk perintah dan makna berhasil atau memperoleh keberhasilan, tanpa mempersempitnya secara mutlak menjadi ‘menanglah’.
- source_word: וְ/נָתַן
  choice: akan menyerahkannya
  rationale: Dalam rangkaian sesudah perintah dan dalam ujaran kenabian, bentuk ini secara alami menyatakan hasil yang dipastikan pada masa mendatang; akhiran -nya merujuk pada Ramot-Gilead.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: ke dalam tangan raja
  rationale: Mempertahankan citra idiom Ibrani mengenai penyerahan ke bawah kuasa atau kendali raja, dan tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; ‘Yahweh’ mempertahankannya sebagai nama pribadi tanpa memasukkan penggantian tradisional berupa gelar.
- issue: Nilai aspek וְנָתַן dalam ujaran kenabian
  choice: akan menyerahkannya
  alternative: telah menyerahkannya
  rationale: Dalam konteks perintah untuk maju, bentuk qatal berwaw ini paling alami dibaca sebagai hasil mendatang yang dinyatakan dengan kepastian. Catatan kaki mempertahankan kemungkinan bahwa bentuk lampau menampilkan hasil itu sebagai sudah pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘sedang bernubuat’ mempertahankan tindakan berlangsung, sedangkan dua perintah ‘Majulah’ dan ‘berhasillah’ menjaga struktur seruan. Tanda seru membantu memisahkan perintah dari pernyataan kepastian yang mengikutinya.
