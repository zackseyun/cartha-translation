base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: id
  text: Lalu roh itu maju dan berdiri di hadapan Yahweh, serta berkata, “Aku akan membujuknya[a].” Yahweh berkata kepadanya, “Dengan cara apa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan memperdayanya” atau “Aku akan menyesatkannya.” Verba Ibrani ini dapat berarti membujuk, memperdaya, atau menyesatkan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: roh itu
  rationale: Dalam adegan sidang surgawi ini, subjek tersebut maju, berdiri, dan berbicara; tindakan-tindakan personal ini menunjukkan suatu makhluk rohani, bukan angin atau napas.
- source_word: וַיֵּצֵא
  choice: maju
  rationale: Secara harfiah verba ini berarti keluar. Dalam konteks seseorang tampil dari antara sidang untuk menghadap Yahweh, “maju” menyampaikan gerak menuju pusat perhatian secara alami.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: berdiri di hadapan
  rationale: Ungkapan ini menggambarkan seseorang berdiri menghadap pihak berwenang dalam suasana resmi; terjemahan ini mempertahankan latar persidangan surgawi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar TUHAN.
- source_word: אֲפַתֶּנּוּ
  choice: Aku akan membujuknya
  rationale: Bentuk piel dari פתה dapat berarti membujuk, memperdaya, atau menyesatkan. “Membujuk” mempertahankan unsur mendorong Ahab mengambil suatu tindakan tanpa lebih dahulu menjelaskan sarana dusta yang baru dinyatakan pada ayat berikutnya.
- source_word: בַּמָּה
  choice: Dengan cara apa?
  rationale: Pertanyaan ini meminta cara atau sarana yang akan dipakai; bentuk ini alami dalam bahasa Indonesia dan tetap cukup formal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Bentuk “Yahweh” mempertahankan nama pribadi dalam teks Ibrani dan tidak menggantinya dengan suatu gelar.
- issue: Nuansa moral dan teologis verba פתה dalam sidang surgawi
  choice: Aku akan membujuknya
  alternative: Aku akan memperdayanya; Aku akan menyesatkannya
  rationale: Ayat ini menyampaikan usul roh itu, sedangkan sarana dustanya dijelaskan pada ayat berikutnya. Terjemahan utama tidak menyelesaikan ketegangan teologis secara prematur, sementara catatan kaki mempertahankan nuansa penipuan yang dimungkinkan oleh verba Ibrani dan konteksnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Roh itu” mempertahankan kejelasan rujukan dalam adegan, sedangkan “maju” dan “berdiri di hadapan” menyampaikan suasana sidang surgawi secara alami.
