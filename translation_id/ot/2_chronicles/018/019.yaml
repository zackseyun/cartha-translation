reference: 2 Chronicles 18:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: id
  text: Lalu Yahweh berfirman, “Siapa yang akan membujuk[a] Ahab, raja Israel, supaya ia maju dan gugur di Ramot-Gilead?” Yang seorang berkata begini dan yang lain berkata begitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperdaya” atau “memikat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai Yahweh, bukan diganti dengan gelar, untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani.
- source_word: יְפַתֶּה
  choice: membujuk
  rationale: Bentuk piel dari פתה dapat berarti membujuk, memikat, atau memperdaya. “Membujuk” menyampaikan tindakan mendorong Ahab menuju keputusan tertentu tanpa mempersempit maknanya menjadi penipuan secara eksplisit.
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: Ahab, raja Israel
  rationale: Frasa aposisional ini diterjemahkan secara alami dalam bahasa Indonesia dengan koma untuk menandai gelar Ahab.
- source_word: וְיַעַל
  choice: supaya ia maju
  rationale: Rangkaian waw dan bentuk imperfek menyatakan tujuan atau hasil yang dimaksud. Dalam konteks peperangan, “maju” secara alami menggambarkan keberangkatan untuk menyerang.
- source_word: וְיִפֹּל
  choice: dan gugur
  rationale: נפל secara harfiah berarti jatuh, tetapi dalam konteks pertempuran bahasa Indonesia lazim memakai “gugur,” yang tetap mempertahankan gambaran jatuh sekaligus menyampaikan kematian dalam peperangan.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: di Ramot-Gilead
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan preposisi בְ diterjemahkan langsung sebagai “di.”
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: Yang seorang berkata begini dan yang lain berkata begitu
  rationale: Ungkapan ini mempertahankan kesejajaran dan perbedaan usulan dalam sidang surgawi dengan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Keterlibatan ilahi dalam kejatuhan Ahab
  choice: Mempertahankan gambaran langsung bahwa Yahweh menanyakan siapa yang akan membujuk Ahab.
  alternative: Melunakkan peran ilahi dengan ungkapan seperti “membiarkan Ahab terbujuk.”
  rationale: Teks Ibrani menggambarkan Yahweh memulai pertimbangan itu secara langsung. Terjemahan tidak mengurangi daya penyebabnya dan membiarkan ketegangan teologis tetap ada.
- issue: Nuansa moral kata פתה
  choice: Menggunakan “membujuk” dalam teks utama.
  alternative: “Memperdaya” atau “memikat.”
  rationale: Konteks selanjutnya melibatkan nasihat yang menyesatkan, tetapi kata kerjanya sendiri memiliki rentang arti yang lebih luas. “Membujuk” tidak menetapkan secara berlebihan bahwa arti leksikalnya di sini pasti “menipu”; catatan kaki mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara nama Yahweh, struktur pertanyaan, kesejajaran penutup, dan ketegangan moral dalam adegan sidang surgawi dipertahankan.
