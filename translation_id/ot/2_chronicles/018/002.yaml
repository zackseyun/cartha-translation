  text: וַ/יֵּרֶד֩ לְ/קֵ֨ץ שָׁנִ֤ים אֶל אַחְאָב֙ לְ/שֹׁ֣מְר֔וֹן וַ/יִּֽזְבַּֽח ל֨/וֹ אַחְאָ֜ב צֹ֤אן וּ/בָקָר֙ לָ/רֹ֔ב וְ/לָ/עָ֖ם אֲשֶׁ֣ר עִמּ֑/וֹ וַ/יְסִיתֵ֕/הוּ לַ/עֲל֖וֹת אֶל רָמ֥וֹת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: id
  text: Setelah beberapa tahun, ia turun ke Samaria menemui Ahab. Ahab menyembelih domba dan sapi dalam jumlah besar untuk dia dan untuk orang-orang yang menyertainya. Lalu Ahab mendesaknya[a] untuk naik menyerang Ramot-Gilead.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “membujuknya” atau “menghasutnya”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “naik ke Ramot-Gilead”; dalam konteks ini yang dimaksud adalah gerakan militer untuk menyerang kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: ia turun
  rationale: Mempertahankan arah/topografi verba ירד secara wajar dalam bahasa Indonesia.
- source_word: לְקֵץ שָׁנִים
  choice: Setelah beberapa tahun
  rationale: Ungkapan Ibrani harfiahnya berarti 'pada akhir tahun-tahun', tetapi secara idiomatis menunjukkan berlalunya sejumlah tahun tanpa menyebut jumlah tertentu.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: ke Samaria menemui Ahab
  rationale: Menyampaikan Samaria sebagai tujuan perjalanan dan Ahab sebagai orang yang ditemui di sana.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: Ahab menyembelih ... untuk dia
  rationale: זבח di sini paling alami dipahami sebagai penyembelihan hewan untuk jamuan kerajaan; konteks tidak secara tegas menyatakan tindakan ibadah kurban.
- source_word: צֹאן וּבָקָר
  choice: domba dan sapi
  rationale: Padanan yang jelas dan mudah dipahami untuk dua golongan ternak tersebut.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Menyatakan banyaknya hewan yang disembelih dengan bahasa Indonesia yang alami.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: untuk orang-orang yang menyertainya
  rationale: Mempertahankan keluasan makna עָם tanpa mempersempitnya menjadi tentara atau rombongan pejabat.
- source_word: וַיְסִיתֵהוּ
  choice: mendesaknya
  rationale: Menyampaikan dorongan kuat tanpa memastikan apakah nuansanya membujuk, menghasut, atau menghasut secara jahat; berbagai kemungkinan itu dicatat dalam catatan kaki.
- source_word: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד
  choice: untuk maju menyerang Ramot-Gilead
  rationale: Dalam konteks perang, 'naik ke' merupakan gerakan militer terhadap kota itu. 'Maju menyerang' menyampaikan maksud kontekstualnya secara alami.
