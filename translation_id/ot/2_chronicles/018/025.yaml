base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: id
  text: Lalu raja Israel berkata, “Ambillah Mikha dan bawalah dia kembali kepada Amon, penguasa kota[a], dan kepada Yoas, putra raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “komandan kota.” Gelar Ibrani ini dapat menunjuk pejabat sipil ataupun militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Mempertahankan gelar yang dipakai teks Ibrani tanpa menggantinya dengan nama Ahab.
- source_word: קְחוּ אֶת מִיכָיְהוּ
  choice: Bawalah Mikha
  rationale: לקח berarti mengambil atau membawa. Dalam perintah untuk mengantar Mikha kembali kepada para pejabat, “bawalah” paling alami tanpa menambahkan kesan kekerasan seperti “tangkaplah”.
- source_word: וַהֲשִׁיבֻהוּ
  choice: dan kembalikan dia
  rationale: Bentuk Hifil dari שוב menyatakan tindakan menyebabkan seseorang kembali; pilihan ini mempertahankan unsur “kembali” secara eksplisit.
- source_word: שַׂר הָעִיר
  choice: penguasa kota
  rationale: שַׂר dapat menunjuk pejabat sipil, pemimpin, atau komandan. “Penguasa kota” cocok dengan konteks pemerintahan kota, sedangkan kemungkinan nuansa militer dicatat dalam catatan kaki.
- source_word: בֶּן הַמֶּלֶךְ
  choice: putra raja
  rationale: Terjemahan langsung dan alami dari frasa relasional Ibrani tanpa mengubahnya menjadi gelar interpretatif seperti “pangeran”.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan lugas. Nama-nama ditulis menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia: Mikha, Amon, dan Yoas. Struktur perintah mempertahankan kedua tindakan dalam teks Ibrani: membawa Mikha dan mengembalikannya.'
