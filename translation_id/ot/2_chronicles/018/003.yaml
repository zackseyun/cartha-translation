base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: id
  text: Ahab, raja Israel, berkata kepada Yosafat, raja Yehuda, “Maukah engkau pergi bersamaku ke Ramot-Gilead?” Yosafat menjawab, “Aku sama seperti engkau, dan rakyatku sama seperti rakyatmu[a]. Aku bersamamu dalam pertempuran[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan seperti rakyatmu, rakyatku.” Klausa Ibrani tidak memakai verba.'
    reason: lexical_alternative
  - marker: b
    text: 'Klausa terakhir berbentuk eliptis dalam bahasa Ibrani, secara harfiah: “dan bersamamu dalam pertempuran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: Maukah engkau pergi bersamaku
  rationale: Partikel tanya הֲ pada bentuk הלך dengan עִם meminta kesediaan Yosafat untuk menyertai Ahab. ‘Maukah’ menyampaikan pertanyaan tentang kesediaan secara alami, sedangkan ‘pergi bersamaku’ mempertahankan makna gerak dari הלך.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; tanda hubung menunjukkan bahwa kedua unsur membentuk satu nama tempat.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Aku sama seperti engkau
  rationale: Ungkapan komparatif ini menyatakan kesatuan sikap atau solidaritas. Terjemahan ini mempertahankan bentuk perbandingan tanpa mengubahnya menjadi pernyataan identitas mutlak.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: dan rakyatku sama seperti rakyatmu
  rationale: Klausa Ibrani ini tidak memakai verba dan secara harfiah berurutan ‘dan seperti rakyatmu, rakyatku’. Susunan Indonesia dibalik agar wajar sekaligus mempertahankan hubungan perbandingan dan paralelnya dengan klausa sebelumnya.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: Aku bersamamu dalam pertempuran
  rationale: Teks Ibrani berbentuk eliptis, secara harfiah ‘dan bersamamu dalam pertempuran’. Subjek ‘aku’ dilengkapi dari konteks agar menjadi kalimat Indonesia yang jelas, tanpa menambahkan penanda waktu akan.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: berkata ... menjawab
  rationale: אמר adalah verba ujaran umum. Pada ujaran kedua, ‘menjawab’ merupakan padanan kontekstual yang alami karena perkataan Yosafat langsung menanggapi pertanyaan Ahab.
- source_word: עַם
  choice: rakyat
  rationale: Dalam konteks dua raja dan kerajaan mereka, ‘rakyat’ lebih tepat daripada ‘bangsa’ untuk menunjuk orang-orang yang berada di bawah pemerintahan masing-masing raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘engkau’ dipakai dalam dialog antarraja agar tetap alami dalam gaya Alkitab tanpa menjadi terlalu arkais. Struktur perbandingan dipertahankan untuk menjaga ambiguitas antara kesetaraan dan solidaritas; klausa terakhir tidak diberi bentuk masa depan karena teks Ibrani tidak menyatakannya secara eksplisit.
