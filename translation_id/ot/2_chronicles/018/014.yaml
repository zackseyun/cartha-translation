base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: id
  text: Lalu Mikha datang menghadap raja, dan raja bertanya kepadanya, “Mikha, haruskah kita pergi berperang ke Ramot-Gilead, atau haruskah aku menahan diri?” Jawabnya, “Majulah dan berhasil[a]! Mereka akan diserahkan ke dalam tangan kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ayat-ayat sekitarnya, jawaban Mikha kemungkinan besar bernada ironis atau menyindir, tetapi bahasa Ibrani tidak menyatakan nada itu secara eksplisit.
    reason: Menjelaskan kemungkinan pragmatis yang kuat tanpa memasukkannya secara pasti ke dalam teks utama.
lexical_decisions:
- source_word: וַיָּבֹא אֶל־הַמֶּלֶךְ
  choice: Lalu Mikha datang menghadap raja
  rationale: Wayyiqtol melanjutkan urutan narasi. Dalam konteks istana, ‘datang menghadap raja’ menyampaikan gerak menuju hadirat raja secara alami tanpa menambah gagasan baru.
- source_word: מִיכָה
  choice: Mikha
  rationale: Bentuk nama Ibrani מִיכָה secara wajar ditransliterasikan ‘Mikha’ dalam bahasa Indonesia; konteks membedakannya dari nabi dalam kitab Mikha.
- source_word: הֲנֵלֵךְ
  choice: haruskah kita pergi
  rationale: Bentuk interogatif orang pertama jamak menyatakan pertimbangan mengenai tindakan yang akan diambil.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Transliterasi yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: לַמִּלְחָמָה
  choice: berperang
  rationale: Preposisi ל dengan מִלְחָמָה menyatakan tujuan. ‘Pergi berperang’ merupakan ungkapan Indonesia yang alami.
- source_word: אִם־אֶחְדָּל
  choice: atau haruskah aku mengurungkan niat
  rationale: חדל berarti berhenti, menahan diri, atau tidak melanjutkan. Terjemahan ini mempertahankan peralihan penting dari orang pertama jamak ‘kita’ ke tunggal ‘aku’.
- source_word: עֲלוּ
  choice: Majulah
  rationale: Imperatif jamak עלה secara harfiah berarti ‘naiklah’; dalam konteks gerakan militer menuju sasaran, ‘majulah’ menyampaikan perintah dengan alami sambil mempertahankan nuansa gerak penyerangan.
- source_word: וְהַצְלִיחוּ
  choice: dan raihlah kemenangan
  rationale: Hifil צלח di sini menyatakan keberhasilan dalam operasi militer. ‘Raihlah kemenangan’ jelas dan idiomatis dalam konteks peperangan.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: Mereka akan diserahkan ke dalam tangan kalian
  rationale: Bentuk Nifal jamak dipertahankan sebagai pasif dengan subjek jamak tersirat. ‘Ke dalam tangan’ menjaga metafora Ibrani tentang penyerahan ke bawah kuasa seseorang; ‘kalian’ mencerminkan sufiks jamak.
theological_decisions:
- issue: Apakah jawaban awal Mikha harus dibuat secara eksplisit bernada sindiran
  choice: Mempertahankan kata-kata positif pada permukaan teks dan menjelaskan kemungkinan sindiran dalam catatan kaki
  alternative: Menambahkan ‘dengan menyindir’ atau mengubah kata-katanya agar ironi tampak jelas
  rationale: Konteks narasi menunjukkan bahwa jawaban ini kemungkinan besar ironis atau sarkastis, tetapi bahasa Ibrani tidak menandainya secara eksplisit. Teks utama karena itu mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pergantian ‘kita’ menjadi ‘aku’ serta bentuk jamak ‘kalian’ dipertahankan. Penanda catatan kaki [a] ditempatkan pada ujaran Mikha yang kemungkinan ironis.
