  to: Lalu Mikha datang menghadap raja, dan raja bertanya kepadanya, “Mikha, haruskah kita pergi berperang ke Ramot-Gilead, atau haruskah aku menahan diri?” Jawabnya, “Majulah dan berhasil[a]! Mereka akan diserahkan ke dalam tangan kalian.”
