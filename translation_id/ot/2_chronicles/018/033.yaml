  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּךְ֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לָֽ/רַכָּ֗ב הֲפֹ֧ךְ ידי/ך וְ/הוֹצֵאתַ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: id
  text: Namun, seorang laki-laki menarik busurnya tanpa membidik sasaran tertentu[a], lalu mengenai raja Israel di antara sambungan-sambungan zirah dan pelindung dada[b]. Raja itu berkata kepada kusir keretanya, “Putarlah keretamu[c] dan bawalah aku keluar dari perkemahan[d], karena aku terluka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan polos” atau “dengan ketulusan.” Ungkapan Ibrani ini dapat menyatakan ketulusan atau kepolosan, tetapi dalam konteks ini kemungkinan besar berarti bahwa pemanah itu tidak membidik raja secara khusus.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani bagi bagian-bagian perlengkapan perang ini tidak pasti. Maksudnya tampaknya anak panah itu mengenai celah di antara bagian-bagian pelindung tubuh raja.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “Balikkan tanganmu.” Maksudnya ialah memutar atau mengarahkan kereta perang menjauh dari pertempuran.
    reason: lexical_alternative
  - marker: d
    text: Kata Ibrani ini dapat berarti “perkemahan” atau “pasukan/perkemahan militer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Namun, seorang prajurit
  rationale: וְ melanjutkan kisah dengan peralihan yang kontras, sedangkan אִישׁ menunjuk kepada seorang yang tidak disebutkan namanya; dalam konteks pertempuran, 'prajurit' wajar dan jelas.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: menarik busurnya
  rationale: Ungkapan ini menggambarkan tindakan menarik busur untuk melepaskan anak panah; bentuk posesif membuatnya alami dalam bahasa Indonesia.
- source_word: לְתֻמּוֹ
  choice: tanpa membidik
  rationale: Secara leksikal dapat berkaitan dengan ketulusan atau kepolosan, tetapi dalam konteks ini paling mungkin berarti bahwa ia melepaskan panah tanpa sasaran tertentu. Ambiguitas dicatat dalam catatan kaki.
- source_word: וַיַּךְ
  choice: lalu mengenai
  rationale: נכה menyatakan tindakan memukul atau mengenai; 'mengenai' paling alami untuk anak panah dan tidak mendahului keterangan bahwa raja terluka.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: di antara sambungan zirah dan baju besinya
  rationale: Istilah perlengkapan perang ini tidak pasti. Terjemahan ini menyampaikan bahwa anak panah menembus celah di antara bagian-bagian pelindung tubuh tanpa terlalu memastikan bentuk persisnya.
- source_word: לָרַכָּב
  choice: kepada pengemudi keretanya
  rationale: Nomina ini menunjuk kepada orang yang mengemudikan kereta perang; bentuk ini lebih mudah dipahami daripada istilah teknis yang jarang dipakai.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: Putar balik
  rationale: Secara harfiah berarti 'balikkan tanganmu', tetapi dalam konteks mengemudikan kereta merupakan perintah untuk memutar atau mengarahkannya keluar dari pertempuran. Makna harfiahnya dicatat.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: dan bawalah aku keluar dari pertempuran
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan. Dalam adegan pertempuran, yang dimaksud ialah membawa raja menjauh dari medan atau barisan tempur, bukan sekadar keluar dari sebuah perkemahan.
- source_word: כִּי הָחֳלֵיתִי
  choice: karena aku terluka
  rationale: Dalam konteks langsung sesudah terkena anak panah, verba ini menyatakan bahwa raja telah dibuat sakit atau terluka. Teks tidak perlu diberi intensifikasi tambahan.
