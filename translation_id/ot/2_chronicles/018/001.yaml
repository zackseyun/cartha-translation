  text: וַ/יְהִ֧י לִֽ/יהוֹשָׁפָ֛ט עֹ֥שֶׁר וְ/כָב֖וֹד לָ/רֹ֑ב וַ/יִּתְחַתֵּ֖ן לְ/אַחְאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: id
  text: Yosafat memiliki kekayaan dan kehormatan yang berlimpah, lalu ia menjalin persekutuan dengan Ahab melalui perkawinan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi kerabat Ahab melalui perkawinan” atau “mengadakan persekutuan perkawinan dengan Ahab.”
    reason: Alternatif leksikal bagi וַיִּתְחַתֵּן yang mempertahankan nuansa hubungan kekerabatan dan persekutuan dinasti.
lexical_decisions:
- source_word: וַיְהִי
  choice: memiliki
  rationale: Bentuk naratif dari היה memperkenalkan keadaan baru. Dalam bahasa Indonesia modern, keadaan itu dapat disampaikan langsung tanpa ungkapan harfiah yang kaku seperti “terjadilah”.
- source_word: לִיהוֹשָׁפָט
  choice: Yosafat
  rationale: Nama pribadi ini mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עֹשֶׁר
  choice: kekayaan
  rationale: Kata benda ini menunjuk pada kelimpahan materi; “kekayaan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְכָבוֹד
  choice: kehormatan
  rationale: Dalam konteks kerajaan dan sosial ini, כָבוֹד menunjuk pada kehormatan, kedudukan, atau wibawa, bukan kemuliaan ilahi yang tampak.
- source_word: לָרֹב
  choice: yang berlimpah
  rationale: Ungkapan ini menyatakan kadar yang sangat besar dan secara alami dapat menerangkan kekayaan serta kehormatan sekaligus.
- source_word: וַיִּתְחַתֵּן
  choice: menjalin persekutuan ... melalui perkawinan
  rationale: Bentuk hitpael dari חתן menyatakan masuknya seseorang ke dalam hubungan kekerabatan atau persekutuan melalui perkawinan, bukan bahwa Yosafat sendiri menikah dengan Ahab.
- source_word: לְאַחְאָב
  choice: dengan Ahab
  rationale: Preposisi tersebut menyatakan pihak yang dengannya hubungan itu dibentuk; “dengan Ahab” merupakan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat hubungan Yosafat dengan Ahab dalam וַיִּתְחַתֵּן לְאַחְאָב
  choice: Ia menjalin persekutuan dengan Ahab melalui perkawinan
  alternative: Ia menjadi kerabat Ahab melalui perkawinan; ia mengadakan persekutuan perkawinan dengan Ahab
  rationale: Teks menyatakan hubungan dinasti atau politis yang dibentuk melalui perkawinan, tetapi tidak mengatakan bahwa Yosafat secara pribadi menikahi Ahab. Terjemahan utama mempertahankan makna itu tanpa menentukan secara berlebihan susunan keluarganya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Yosafat” dan “Ahab” mengikuti bentuk yang umum bagi pembaca Alkitab Indonesia. Konjungsi “lalu” membawa alur naratif tanpa menambahkan penanda waktu eksplisit seperti “pada waktu itu”.
