  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: id
  text: Namun Mikha berkata[a], “Demi Yahweh yang hidup, apa pun yang Allahku katakan, itulah yang akan kukatakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh hidup; apa yang Allahku katakan, itulah yang akan kukatakan.”
    reason: Alternatif ini mempertahankan bentuk permukaan rumusan Ibrani sebagai pernyataan, bukan mengungkapkan fungsi sumpahnya secara eksplisit.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Bentuk naratif ini melanjutkan kisah, tetapi konteksnya menunjukkan tanggapan yang berlawanan dengan desakan utusan pada ayat sebelumnya; “Namun” menyatakan kontras itu secara alami.
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Nama ini memakai bentuk Indonesia yang lazim bagi nabi tersebut.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan ini merupakan rumusan sumpah Ibrani. Pilihan ini terdengar alami dalam bahasa Indonesia sekaligus mempertahankan daya sumpahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan gelar.
- source_word: אֵת אֲשֶׁר
  choice: apa pun yang
  rationale: Gabungan penanda objek dan partikel relatif menunjuk pada seluruh isi yang akan Allah katakan; “apa pun yang” menyampaikan cakupan tersebut secara wajar.
- source_word: יֹאמַר
  choice: dikatakan
  rationale: Bentuk imperfek merujuk pada apa yang mungkin Allah nyatakan dalam keadaan ini. Konstruksi pasif Indonesia menghindari pengulangan subjek yang kaku dan tetap mempertahankan maknanya.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Akhiran orang pertama tunggal dipertahankan dan menyatakan hubungan serta kesetiaan pribadi Mikha.
- source_word: אֹתוֹ
  choice: itulah
  rationale: Kata ganti objek ini merujuk kembali kepada isi perkataan Allah; “itulah” mempertahankan penegasannya dengan alami.
- source_word: אֲדַבֵּר
  choice: akan kukatakan
  rationale: Kata kerja ini berarti berbicara atau mengatakan. “Akan kukatakan” menjaga kesejajaran dengan perkataan Allah dan cocok untuk pernyataan kenabian yang tegas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam rumusan sumpah
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Daya ungkapan חַי יְהוָה
  choice: 'Dipahami sebagai rumusan sumpah: “Demi Yahweh yang hidup”'
  alternative: 'Dipahami sebagai pernyataan: “Yahweh hidup”'
  rationale: Dalam konteks ini ungkapan tersebut secara lazim berfungsi sebagai sumpah yang menjamin kesungguhan ucapan Mikha. Kemungkinan bentuk pernyataan yang lebih harfiah tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara kontras naratif, nama ilahi, sumpah, dan penegasan pada isi perkataan Allah tetap dipertahankan.
