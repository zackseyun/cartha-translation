  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: id
  text: Lalu raja Israel berkata kepada Yosafat, “Bukankah sudah kukatakan kepadamu bahwa ia tidak akan menubuatkan hal yang baik tentang aku, melainkan hanya hal yang buruk[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia tidak akan menubuatkan sesuatu yang baik tentang aku, melainkan hanya malapetaka.”
    reason: Alternatif ini menampilkan nuansa רָע sebagai bencana atau hasil buruk yang dinubuatkan.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara alami dalam narasi Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Menerjemahkan rangkaian konstruksi secara langsung dan sesuai dengan sebutan naratif yang lazim.
- source_word: אֶל יְהוֹשָׁפָט
  choice: kepada Yosafat
  rationale: Preposisi אֶל menandai orang yang menjadi tujuan perkataan; teks Ibrani tidak menambahkan gelar bagi Yosafat.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Gabungan partikel ini membuka pertanyaan retoris yang mengharapkan persetujuan.
- source_word: אָמַרְתִּי אֵלֶיךָ
  choice: sudah kukatakan kepadamu
  rationale: Ungkapan ini merujuk pada perkataan sebelumnya; “sudah” membuat rujukan lampau itu jelas dan alami dalam bahasa Indonesia.
- source_word: לֹא יִתְנַבֵּא
  choice: ia tidak akan menubuatkan
  rationale: Bentuk imperfek sesudah perkataan lampau menyampaikan apa yang sebelumnya dikatakan raja mengenai pola nubuat Mikha; “tidak akan” mempertahankan nuansa prospektif tersebut.
- source_word: עָלַי
  choice: tentang aku
  rationale: עַל di sini menunjukkan pokok atau orang yang menjadi sasaran isi nubuat, bukan penerima manfaat.
- source_word: טוֹב
  choice: hal yang baik
  rationale: Adjektiva ini dipakai secara substantival. Penambahan “hal” diperlukan agar ungkapannya wajar dan jelas dalam bahasa Indonesia.
- source_word: כִּי אִם
  choice: melainkan hanya
  rationale: Ungkapan ini menyatakan pengecualian sekaligus pertentangan yang kuat.
- source_word: לְרָע
  choice: hal yang buruk
  rationale: Pilihan ini mempertahankan antitesis leksikal dengan “hal yang baik,” sambil menunjukkan bahwa yang dimaksud ialah hasil atau kabar yang merugikan, bukan mutu nubuatnya.
theological_decisions:
- issue: Sifat pesan yang dinubuatkan
  choice: Mempertahankan kontras “hal yang baik ... hanya hal yang buruk.”
  alternative: “hal yang baik ... hanya malapetaka” atau “yang menguntungkan ... yang merugikan”
  rationale: Keluhan raja menyangkut isi nubuat Mikha yang selalu tidak menguntungkan baginya, bukan pernyataan metafisis tentang kejahatan moral. Namun, mempertahankan antitesis baik-buruk menjaga ketegangan dan bentuk ungkapan Ibrani tanpa mempersempit maknanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kukatakan” mempertahankan sapaan langsung secara ringkas; “menubuatkan hal” dipilih agar hubungan antara tindakan bernubuat dan isi nubuat terdengar alami.
