  terminology: “Para nabi,” “Allah,” “Ramot-Gilead,” dan “ke dalam tangan raja” tepat untuk register Alkitab bahasa Indonesia. “Majulah!” merupakan padanan kontekstual yang wajar untuk imperatif עֲלֵה tanpa memaksakan makna ‘seranglah’.
