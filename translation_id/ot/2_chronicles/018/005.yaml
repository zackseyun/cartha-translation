  to: Lalu raja Israel mengumpulkan para nabi, empat ratus orang, dan bertanya kepada mereka, “Haruskah kita pergi ke Ramot-Gilead untuk berperang, atau haruskah aku menahan diri?” Jawab mereka, “Majulah! Allah akan menyerahkannya ke dalam tangan raja[a].”
