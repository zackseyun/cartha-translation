  source_fidelity: 'Draf pada umumnya setia pada teks Ibrani: jumlah empat ratus, pergeseran persona dari “kita” ke “aku”, serta sebutan “raja” yang tidak diperjelas telah dipertahankan. Namun, “mengurungkannya” menambahkan objek tersirat dan dapat menggeser makna dari ‘menahan diri/berhenti’ menjadi membatalkan suatu rencana tertentu. Frasa lokasi-tujuan juga lebih dekat bila diterjemahkan “pergi ke Ramot-Gilead untuk berperang.”'
