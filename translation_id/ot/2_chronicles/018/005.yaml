  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: id
  text: Lalu raja Israel mengumpulkan para nabi, empat ratus orang, dan bertanya kepada mereka, “Haruskah kita pergi ke Ramot-Gilead untuk berperang, atau haruskah aku menahan diri?” Jawab mereka, “Majulah! Allah akan menyerahkannya ke dalam tangan raja[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “ke dalam tangan raja,” suatu ungkapan yang berarti ke dalam kuasa atau kendali raja. Raja yang dimaksud tidak disebutkan secara lebih khusus.
    reason: Mempertahankan idiom Ibrani sekaligus menjelaskan bahwa acuan “raja” dibiarkan tidak ditentukan oleh teks.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: mengumpulkan
  rationale: Kata קבץ berarti mengumpulkan atau menghimpun; bentuk ini alami dalam bahasa Indonesia dan mempertahankan tindakan aktif sang raja.
- source_word: הַנְּבִאִים
  choice: para nabi
  rationale: נביאים adalah istilah baku untuk sekelompok nabi; kata penanda jamak 'para' membuatnya alami dalam bahasa Indonesia.
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: empat ratus orang
  rationale: Teks Ibrani menyebut אִישׁ setelah bilangan. 'Orang' mempertahankan unsur itu tanpa membuat kalimat Indonesia terasa kaku.
- source_word: הֲנֵלֵךְ
  choice: Haruskah kita pergi
  rationale: Bentuk pertanyaan ini adalah orang pertama jamak. 'Haruskah kita pergi' mempertahankan pelibatan pihak-pihak yang akan berangkat.
- source_word: אֶל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: berperang melawan Ramot-Gilead
  rationale: Secara harfiah frasa ini berarti pergi ke Ramot-Gilead untuk pertempuran. Ungkapan Indonesia ini menyampaikan tujuan militernya dengan jelas tanpa menambahkan hasil pertempuran.
- source_word: אִם אֶחְדָּל
  choice: atau haruskah aku mengurungkannya
  rationale: חדל berarti berhenti, menahan diri, atau tidak meneruskan. Terjemahan ini alami dan tetap mempertahankan peralihan yang nyata dari orang pertama jamak 'kita' ke orang pertama tunggal 'aku'.
- source_word: עֲלֵה
  choice: Majulah
  rationale: Imperatif עלה secara dasar berarti naik atau maju. Dalam konteks ekspedisi militer, 'Majulah' ringkas, alami, dan tidak terlalu menafsirkan sebagai perintah untuk langsung menyerang.
- source_word: וְיִתֵּן
  choice: akan menyerahkannya
  rationale: נתן berarti memberi, tetapi bersama ungkapan 'ke dalam tangan' menyatakan penyerahan ke dalam kuasa seseorang. Akhiran '-nya' melengkapi objek tersirat, yakni Ramot-Gilead atau sasaran ekspedisi.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk nomina ini secara morfologis jamak, verba יִתֵּן berbentuk tunggal dan konteks menunjuk kepada satu Pribadi ilahi. 'Allah' adalah padanan baku dan wajar dalam Alkitab bahasa Indonesia.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: ke dalam tangan raja
  rationale: Ungkapan ini secara harfiah menyebut tangan dan secara idiomatis berarti kuasa atau kendali. Bentuk literalnya tetap dapat dipahami dalam bahasa Indonesia dan mempertahankan warna ungkapan sumber.
theological_decisions:
- issue: Acuan 'raja' dalam jawaban para nabi
  choice: Mempertahankan sebutan tak tentu 'raja'
  alternative: Menafsirkannya secara eksplisit sebagai 'tanganmu' atau 'tangan raja Israel'
  rationale: Teks Ibrani hanya mengatakan הַמֶּלֶךְ, 'raja', berbeda dari rumusan yang secara langsung menyebut 'tanganmu'. Terjemahan tidak menetapkan acuan lebih khusus daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Peralihan dari 'kita' ke 'aku' dipertahankan karena terdapat dalam bentuk verba Ibrani. Nama tempat ditransliterasikan sebagai 'Ramot-Gilead'. Satu catatan kaki digunakan untuk menjelaskan idiom tangan dan ambiguitas acuan 'raja' tanpa menyelesaikannya secara sepihak.
