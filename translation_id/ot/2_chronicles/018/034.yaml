base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: id
  text: Pada hari itu pertempuran semakin sengit, dan Raja Israel tetap berdiri di dalam keretanya menghadap Aram sampai petang. Ia mati pada saat matahari terbenam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada waktu matahari terbenam.” Secara harfiah, “pada waktu matahari pergi terbenam.”
    reason: Mempertahankan alternatif yang lebih dekat dengan bentuk verbal Ibrani tanpa memakai ungkapan Indonesia yang tidak alami.
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: pertempuran semakin sengit
  rationale: Secara harfiah pertempuran itu ‘naik’, suatu ungkapan yang dalam konteks ini menunjukkan bahwa pertempuran meningkat atau makin hebat. ‘Semakin sengit’ menyampaikan idiom Ibrani secara alami.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan langsung dan alami bagi ungkapan waktu Ibrani.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Raja Israel
  rationale: Menerjemahkan frasa konstruksi secara langsung; penggunaan huruf kapital sesuai kaidah bahasa Indonesia untuk gelar yang merujuk pada penguasa tertentu dalam konteks ini.
- source_word: הָיָה מַעֲמִיד
  choice: mempertahankan dirinya tetap tegak
  rationale: Konstruksi היה dengan partisipel menyatakan tindakan yang berlangsung, sedangkan bentuk Hifil מַעֲמִיד menunjukkan bahwa raja membuat atau menjaga dirinya tetap berdiri. Terjemahan ini tidak mengubahnya menjadi bentuk pasif ‘ditopang’.
- source_word: בַּמֶּרְכָּבָה
  choice: di dalam kereta
  rationale: ‘Kereta’ dalam konteks pertempuran jelas berarti kereta perang; kata ‘perang’ tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam frasa ini.
- source_word: נֹכַח אֲרָם
  choice: menghadap Aram
  rationale: נֹכַח menunjukkan posisi berhadapan atau menghadap. Nama tempat/bangsa ‘Aram’ dipertahankan.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Padanan waktu yang ringkas, wajar, dan setia pada batas waktu yang dinyatakan teks.
- source_word: וַיָּמָת
  choice: Ia meninggal
  rationale: Meneruskan alur narasi secara lugas. Pronomina memperjelas bahwa subjeknya tetap Raja Israel.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: pada waktu matahari terbenam
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang waktu ‘masuknya’ matahari. ‘Matahari terbenam’ adalah ungkapan Indonesia yang alami dan mempertahankan acuan waktunya.
