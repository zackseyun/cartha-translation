  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א לְ/מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּ֞ה דִּבְרֵ֧י הַ/נְּבִאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ וִֽ/יהִי נָ֧א דְבָרְ/ךָ֛ כְּ/אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: id
  text: Utusan yang telah pergi memanggil Mikha berkata kepadanya, “Perhatikanlah, perkataan para nabi dengan satu suara menyatakan hal yang baik bagi raja.[a] Kiranya perkataanmu juga seperti perkataan salah seorang dari mereka, dan katakanlah hal yang baik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan satu mulut,” yaitu suatu ungkapan yang berarti sepakat sepenuhnya atau berbicara dengan satu suara.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: utusan
  rationale: Dalam konteks ini yang dimaksud ialah orang yang diutus untuk memanggil Mikha, bukan makhluk surgawi.
- source_word: לִקְרֹא
  choice: memanggil
  rationale: Kata ini menyatakan pemanggilan Mikha untuk menghadap; bentuk Indonesia ini alami dan tetap dekat dengan sumber.
- source_word: לְמִיכָיְהוּ
  choice: Mikha
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: הִנֵּה
  choice: Perhatikanlah
  rationale: Mempertahankan fungsi penarik perhatian tanpa memakai ungkapan arkais.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: perkataan para nabi
  rationale: Mempertahankan bentuk jamak dan kaitannya dengan ucapan nubuat mereka.
- source_word: פֶּה אֶחָד
  choice: dengan satu suara
  rationale: Ungkapan Indonesia ini mempertahankan citra idiom Ibrani sekaligus menyampaikan kesepakatan penuh.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: hal yang baik bagi raja
  rationale: Menyampaikan bahwa nubuat mereka menguntungkan atau menyenangkan raja tanpa mempersempit maknanya secara berlebihan.
- source_word: וִיהִי נָא
  choice: Kiranya ... juga
  rationale: Menyampaikan desakan sopan dari bentuk yusif dan partikel נָא.
- source_word: דְבָרְךָ
  choice: perkataanmu
  rationale: Bentuk tunggal dipertahankan sebagai satu ucapan atau pesan kenabian.
- source_word: כְּאַחַד מֵהֶם
  choice: seperti perkataan salah seorang dari mereka
  rationale: Menjelaskan bahwa yang dibandingkan ialah perkataan Mikha dengan perkataan salah seorang nabi tersebut.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: dan katakanlah hal yang baik
  rationale: Mempertahankan pengulangan kata 'baik' dan desakan agar Mikha memberikan nubuat yang positif.
