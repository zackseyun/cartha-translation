id: 2CH.18.32
reference: 2 Chronicles 18:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: id
  text: Ketika para panglima pasukan kereta melihat bahwa dia bukan raja Israel, mereka berbalik dan tidak lagi mengejarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka berbalik dari belakangnya,” suatu ungkapan yang berarti bahwa mereka berhenti mengikuti atau mengejarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ketika ... melihat
  rationale: Rangkaian וַיְהִי dengan infinitif berkata depan כִּ memperkenalkan peristiwa berikutnya sebagai anak kalimat waktu. Dalam bahasa Indonesia, “Ketika ... melihat” menyampaikan fungsi ini dengan wajar tanpa mempertahankan ungkapan harfiah yang kaku.
- source_word: שָׂרֵי הָרֶכֶב
  choice: para panglima pasukan kereta
  rationale: שָׂרֵי menunjuk kepada para pemimpin militer, sedangkan הָרֶכֶב dalam konteks ini mengacu pada pasukan kereta perang, bukan sekadar kendaraan-kendaraan secara terpisah.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: bahwa dia bukan raja Israel
  rationale: Teks Ibrani tidak menyebutkan subjek secara eksplisit, tetapi akhiran pronominal pada מֵאַחֲרָיו merujuk kepada laki-laki yang sedang mereka kejar. Bahasa Indonesia memerlukan subjek yang jelas; “dia” mempertahankan rujukan tersebut tanpa memasukkan nama yang tidak terdapat dalam ayat.
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: mereka berbalik dan tidak lagi mengejarnya
  rationale: שׁוּב menyatakan tindakan berbalik, sedangkan ungkapan מֵאַחֲרָיו dalam konteks pengejaran berarti berhenti mengikuti atau mengejar orang itu. Terjemahan ini mempertahankan gerak berbalik sekaligus menyampaikan makna idiomnya dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Panglima pasukan kereta” dipilih agar jelas bahwa yang dimaksud ialah pemimpin kesatuan kereta perang. Kata ganti “dia” wajar dalam bahasa Indonesia masa kini dan tidak menambahkan identitas yang tidak disebutkan secara eksplisit dalam ayat.
