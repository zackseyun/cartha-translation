  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: id
  text: 'Lalu ia berkata, “Karena itu, dengarkanlah firman Yahweh: Aku melihat Yahweh duduk di atas takhta-Nya, dan segenap bala tentara langit[a] berdiri di sebelah kanan dan kiri-Nya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “segenap bala tentara langit”; dapat juga diterjemahkan “segenap bala tentara surgawi” atau “seluruh pasukan langit.”'
    reason: Alternatif leksikal untuk צְבָא הַשָּׁמַיִם, yang dapat menunjuk kepada kumpulan atau pasukan di langit.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk naratif ini melanjutkan tuturan Mikha dalam konteks. Kata ganti mempertahankan bentuk Ibrani tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan atau peralihan yang timbul dari percakapan sebelumnya dan tetap mempertahankan daya retoris nubuat.
- source_word: שִׁמְעוּ
  choice: dengarkanlah
  rationale: Imperatif jamak yang meminta para pendengar memberi perhatian. Bentuk -lah memberi ketegasan yang wajar dalam bahasa Indonesia.
- source_word: דְבַר יְהוָה
  choice: firman Yahweh
  rationale: “Firman” merupakan padanan Indonesia yang alami dan bermartabat bagi formula kenabian ini, sedangkan nama ilahi dipertahankan sebagai Yahweh.
- source_word: רָאִיתִי
  choice: Aku melihat
  rationale: Bentuk lampau Ibrani melaporkan penglihatan Mikha; bahasa Indonesia tidak memerlukan penandaan kala tambahan.
- source_word: יוֹשֵׁב עַל כִּסְאוֹ
  choice: duduk di atas takhta-Nya
  rationale: Menerjemahkan gambaran Yahweh yang bertakhta secara langsung tanpa memperluas maknanya.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: segenap bala tentara langit
  rationale: צָבָא dapat berarti bala tentara atau kumpulan yang teratur. Pilihan ini mempertahankan citra kolektif dan militer tanpa menentukan secara lebih sempit identitas para anggotanya.
- source_word: עֹמְדִים
  choice: berdiri
  rationale: Mempertahankan arti dasar partisip yang menggambarkan sikap para anggota sidang surgawi di hadapan takhta.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: di sebelah kanan dan kiri-Nya
  rationale: Ungkapan ruang ini alami dalam bahasa Indonesia dan tetap mencerminkan kedua sisi takhta.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam laporan penglihatan bahwa nabi melihat יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama diri ilahi dan tidak menggantinya dengan gelar.
- issue: Identitas כָל צְבָא הַשָּׁמַיִם dalam sidang surgawi
  choice: segenap bala tentara langit
  alternative: segenap bala tentara surgawi; seluruh pasukan langit
  rationale: Teks menyebut kumpulan atau pasukan langit tetapi tidak merinci identitasnya. Terjemahan ini menjaga keluasan ungkapan dan tidak menyamakannya secara eksplisit hanya dengan malaikat atau bintang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur proklamasi kenabian dipertahankan, sementara susunan ruang dibuat alami bagi pembaca Indonesia. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
