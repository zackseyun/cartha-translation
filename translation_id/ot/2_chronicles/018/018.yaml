  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur-unsur utama Ibrani: transisi inferensial לָכֵן (“Karena itu”), imperatif jamak שִׁמְעוּ (“dengarkanlah”), formula kenabian דְבַר יְהוָה (“firman Yahweh”), penglihatan Mikha tentang Yahweh bertakhta, serta seluruh צְבָא הַשָּׁמַיִם yang berdiri pada kedua sisi-Nya. “Segenap bala tentara langit” mempertahankan cakupan kolektif dan nuansa צָבָא tanpa mempersempit identitasnya.'
