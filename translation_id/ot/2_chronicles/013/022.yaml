source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲבִיָּ֔ה וּ/דְרָכָ֖י/ו וּ/דְבָרָ֑י/ו כְּתוּבִ֕ים בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: id
  text: Perbuatan-perbuatan Abia yang lain, jalan hidupnya, dan perkataan-perkataannya tertulis dalam midras[a] Nabi Ido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tafsir,” “uraian,” atau secara lebih umum “catatan.” Istilah Ibrani midras di sini menunjuk pada karya tertulis yang bersifat menjelaskan atau menyelidiki, dan tidak harus berarti ragam tulisan rabinik yang berkembang pada masa kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: Perbuatan-perbuatan Abia yang lain
  rationale: Dalam rumusan penutup riwayat kerajaan, דִּבְרֵי menunjuk secara luas pada perbuatan atau kejadian dalam pemerintahan seseorang, bukan hanya kata-katanya. Susunan ini juga membedakannya dari וּדְבָרָיו pada bagian berikutnya.
- source_word: וּדְרָכָיו
  choice: jalan hidupnya
  rationale: Ungkapan ini mempertahankan citra dasar דֶּרֶךְ sambil menyampaikan makna perilaku atau cara hidup secara wajar dalam bahasa Indonesia modern.
- source_word: וּדְבָרָיו
  choice: dan perkataan-perkataannya
  rationale: Dalam rangkaian ini, דָּבָר paling mungkin mengacu pada ucapan atau pernyataan Abia, berbeda dari perbuatannya yang telah disebut lebih dahulu.
- source_word: כְּתוּבִים
  choice: tertulis
  rationale: Bentuk partisip pasif dari כתב secara langsung menyatakan bahwa hal-hal tersebut terdapat dalam catatan tertulis.
- source_word: בְּמִדְרַשׁ
  choice: dalam midras
  rationale: Istilah 'midras' mempertahankan istilah Ibrani khusus bagi karya penyelidikan atau penjelasan tertulis dan menghindari penyempitan makna menjadi sekadar 'tafsir' atau 'catatan'.
- source_word: הַנָּבִיא עִדּוֹ
  choice: Nabi Ido
  rationale: Nama dan gelar disajikan menurut urutan yang alami dalam bahasa Indonesia; frasa tersebut mengaitkan karya itu dengan Nabi Ido.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ulang pada “perbuatan-perbuatan” dan “perkataan-perkataannya” mencerminkan bentuk jamak Ibrani sekaligus memperjelas pembedaan kedua pemakaian דָּבָר. Nama ditulis menurut bentuk Indonesia yang lazim: Abia dan Ido.'
