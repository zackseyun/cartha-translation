id: 2CH.13.12
reference: 2 Chronicles 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: id
  text: Lihatlah, Allah ada bersama kami sebagai pemimpin kami, dan para imam-Nya bersama kami dengan nafiri-nafiri untuk memberi tanda perang terhadap kalian. Hai anak-anak Israel[a], janganlah berperang melawan Yahweh, Allah nenek moyang kalian, sebab kalian tidak akan berhasil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keturunan Israel.” Secara harfiah, “putra-putra Israel”; ungkapan ini dipakai di sini sebagai sapaan kepada orang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Penanda wacana yang mengarahkan perhatian secara tegas kepada pernyataan berikutnya; bentuk ini alami dalam pidato langsung bahasa Indonesia.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: Allah menyertai kami dan memimpin kami
  rationale: Mengungkapkan kehadiran Allah serta metafora harfiah 'di kepala/di bagian terdepan' sebagai kepemimpinan, tanpa memberi kesan lokasi fisik yang janggal dalam bahasa Indonesia.
- source_word: וְכֹהֲנָיו
  choice: Para imam-Nya pun bersama kami
  rationale: Sufiks orang ketiga tunggal merujuk kepada Allah. Penambahan 'bersama kami' melengkapi konstruksi eliptis Ibrani secara alami.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: dengan nafiri-nafiri untuk pekik perang
  rationale: חֲצֹצְרוֹת menunjuk nafiri, khususnya nafiri kultis/perak, sedangkan תְּרוּעָה di sini merupakan seruan atau sinyal keras dalam konteks perang.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: guna membunyikan tanda bahaya terhadap kalian
  rationale: Infinitif Hifil menyatakan tujuan dan tetap dibedakan dari frasa nominal sebelumnya; עֲלֵיכֶם menyatakan arah tindakan yang bermusuhan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Sapaan perjanjian dan etnis kepada orang Israel; 'keturunan' mencakup makna idiomatis בְּנֵי dalam bahasa Indonesia modern tanpa membatasi sapaan kepada anak laki-laki secara biologis.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: janganlah berperang melawan Yahweh
  rationale: Larangan langsung; sesudah verba 'berperang', עִם memiliki arti adversatif 'melawan'.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah nenek moyang kalian
  rationale: Ungkapan perjanjian yang alami dan jelas; 'nenek moyang' menyampaikan אבות sebagai para leluhur.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: sebab kalian tidak akan berhasil
  rationale: Hifil צלח berarti berhasil atau mencapai hasil; pilihan ini mempertahankan cakupan maknanya tanpa mempersempitnya menjadi sekadar menang dalam pertempuran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Identitas pihak yang memimpin dalam בָרֹאשׁ הָאֱלֹהִים
  choice: Allah ... memimpin kami
  alternative: Allah berada di depan kami; Allah mengepalai kami
  rationale: Metafora 'di kepala' menyatakan posisi utama atau kepemimpinan Allah. Pilihan ini tidak mengidentifikasi pemimpin manusia dan mempertahankan klaim teologis Abia bahwa Allah memimpin pihaknya.
- issue: Cakupan sapaan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; bani Israel; orang Israel
  rationale: Bentuk Ibrani secara harfiah maskulin, tetapi sebagai sapaan etnis merujuk kepada bangsa Israel. Catatan kaki mempertahankan bentuk harfiahnya tanpa membuat teks utama terdengar hanya menyapa laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai karena seluruh sapaan dan verba Ibrani berbentuk jamak. 'Nafiri' dipertahankan untuk membedakan חֲצֹצְרָה dari sangkakala umum, sementara fungsi militernya dijelaskan oleh frasa berikutnya.
