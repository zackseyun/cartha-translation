  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: id
  text: Bukankah kalian tahu bahwa Yahweh, Allah Israel, telah memberikan pemerintahan atas Israel kepada Daud untuk selama-lamanya, kepada dia dan anak-anaknya[b], dengan perjanjian garam[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdasarkan perjanjian garam.” Ungkapan ini tampaknya menunjuk pada perjanjian yang mengikat dan bertahan lama; bandingkan Bilangan 18:19.
    reason: lexical_alternative
  - marker: b
    text: “Anak-anaknya” di sini menunjuk pada garis keturunan kerajaan atau dinasti Daud.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: Bukankah kalian tahu
  rationale: Bentuk ini mempertahankan pertanyaan retoris yang mengharapkan persetujuan, sedangkan “kalian” menyatakan dengan jelas bahwa sapaan Ibraninya jamak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Ini merupakan padanan konstruksi yang alami dan baku dalam bahasa Indonesia.
- source_word: נָתַן מַמְלָכָה ... עַל יִשְׂרָאֵל
  choice: telah memberikan ... kekuasaan sebagai raja atas Israel
  rationale: Dalam konteks ini מַמְלָכָה menunjuk pada pemerintahan atau hak kerajaan Daud atas Israel. Ungkapan ini lebih alami daripada “kerajaan atas Israel” dan tidak menggeser fokus kepada wilayah.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan ini mempertahankan pernyataan mengenai keberlangsungan tanpa membatasi atau menjelaskan implikasi teologisnya.
- source_word: לוֹ וּלְבָנָיו
  choice: bagi dia dan anak-anaknya
  rationale: Terjemahan ini mempertahankan penyebutan harfiah tentang Daud dan anak-anak lelakinya, sementara makna dinastinya dijelaskan dalam catatan kaki.
- source_word: בְּרִית מֶלַח
  choice: berdasarkan perjanjian garam
  rationale: Citra khas Ibrani dipertahankan secara harfiah. “Berdasarkan” menyampaikan bahwa pemberian kerajaan itu diteguhkan melalui perjanjian tersebut, tanpa menghapus kemungkinan nuansa “dengan”.
theological_decisions:
- issue: Kelanggengan pemberian kerajaan kepada Daud
  choice: Mempertahankan “untuk selama-lamanya” dan “perjanjian garam” sebagai dua unsur tersurat
  alternative: Menafsirkan “perjanjian garam” langsung sebagai “perjanjian yang kekal”
  rationale: Teks Ibrani sendiri memuat kedua ungkapan itu. Mempertahankan keduanya menjaga bobot dan ketegangan teologisnya tanpa memasukkan kesimpulan teologis yang lebih jauh ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. “Kalian” dipakai karena lawan bicara dalam bahasa Ibrani berbentuk jamak. Susunan kalimat dibuat alami bagi pembaca umum sambil tetap mempertahankan nama Yahweh, gagasan pemerintahan atas Israel, dan citra “perjanjian garam”.
