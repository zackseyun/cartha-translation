id: 2CH.13.16
reference: 2 Chronicles 13:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּנ֥וּסוּ בְנֵי יִשְׂרָאֵ֖ל מִ/פְּנֵ֣י יְהוּדָ֑ה וַ/יִּתְּנֵ֥/ם אֱלֹהִ֖ים בְּ/יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: id
  text: Orang Israel[a] melarikan diri dari hadapan Yehuda, lalu Allah menyerahkan mereka ke dalam tangan orang Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah berbunyi “ke dalam tangan mereka”, yaitu ke dalam kuasa atau kendali orang Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: melarikan diri
  rationale: Kata נוּס dalam konteks pertempuran menyatakan lari atau mundur untuk menyelamatkan diri; “melarikan diri” alami dan tepat dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah ungkapan ini berbunyi “anak-anak Israel”, tetapi dalam konteks ini berfungsi sebagai sebutan kolektif bagi orang Israel. Padanan idiomatis Indonesia menghindari kesan bahwa yang dimaksud hanya anak-anak secara usia.
- source_word: מִפְּנֵי יְהוּדָה
  choice: dari hadapan Yehuda
  rationale: Ungkapan מִפְּנֵי menyatakan gerakan menjauh dari hadapan lawan. Terjemahan ini mempertahankan citra sumber dan tidak menambahkan “pasukan” atau “orang-orang” yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּתְּנֵם
  choice: menyerahkan mereka
  rationale: Dalam konteks militer, נתן dengan pelengkap “ke dalam tangan” berarti menyerahkan pihak yang kalah ke dalam kuasa lawan. “Menyerahkan” mengungkapkan idiom itu secara wajar tanpa mengurangi tindakan langsung Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Teks memakai אֱלֹהִים, bukan nama ilahi יהוה; padanan Indonesia yang sesuai ialah “Allah”.
- source_word: בְּיָדָם
  choice: ke dalam tangan orang Yehuda
  rationale: Secara harfiah bentuk ini berarti “ke dalam tangan mereka”. Karena pronomina Indonesia “mereka” akan mudah disalahhubungkan dengan orang Israel, antesedennya dinyatakan sebagai “orang Yehuda”; metafora “tangan” tetap dipertahankan sebagai lambang kuasa atau kendali.
theological_decisions:
- issue: Peran Allah dalam hasil pertempuran
  choice: Allah menyerahkan mereka
  alternative: Allah membiarkan mereka jatuh
  rationale: Allah menjadi subjek langsung dari וַיִּתְּנֵם. Terjemahan mempertahankan tindakan ilahi yang dinyatakan teks dan tidak melunakkannya menjadi sekadar izin.
- issue: Identitas penerima penyerahan
  choice: ke dalam tangan orang Yehuda
  alternative: ke dalam tangan mereka
  rationale: Akhiran pronominal jamak merujuk secara konseptual kepada Yehuda sebagai kelompok kolektif. Pengulangan anteseden mencegah tafsiran keliru seolah-olah orang Israel diserahkan ke tangan mereka sendiri.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “dari hadapan Yehuda” mempertahankan nuansa narasi perang Ibrani, sedangkan “orang Yehuda” pada klausa kedua memperjelas rujukan tanpa mengubah makna.
