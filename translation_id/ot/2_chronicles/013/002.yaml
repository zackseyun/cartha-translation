  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: id
  text: Ia memerintah selama tiga tahun di Yerusalem. Nama ibunya ialah Mikhaya, putri Uriel dari Gibea.[a] Dan ada perang antara Abia dan Yerobeam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks paralel, 1 Raja-Raja 15:2 menyebut ibu Abia bernama Maakha. Kata Ibrani yang diterjemahkan “putri” juga dapat dipakai secara lebih luas untuk keturunan perempuan. Karena itu, kedua catatan ini mungkin mencerminkan perbedaan nama atau cara penyajian silsilah.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: memerintah
  rationale: Dalam rumus masa pemerintahan raja, kata kerja ini secara alami berarti “memerintah”; konteks sudah menunjukkan bahwa ia memerintah sebagai raja.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Ungkapan ini mempertahankan rumus silsilah Ibrani dalam bahasa Indonesia modern dan wajar.
- source_word: מִיכָיָהוּ
  choice: Mikhaya
  rationale: Bentuk ini mentransliterasikan nama Ibrani dalam ayat tersebut dan membedakannya dari bentuk nama yang terdapat dalam teks paralel kitab Raja-Raja.
- source_word: בַת אוּרִיאֵל
  choice: putri Uriel
  rationale: Frasa konstruksi ini secara langsung menyatakan hubungan keturunan perempuan. “Putri” ringkas dan alami, tanpa memutuskan apakah pemakaiannya harus dipahami sebagai anak langsung atau keturunan perempuan yang lebih jauh.
- source_word: מִן גִּבְעָה
  choice: dari Gibea
  rationale: Preposisi מִן secara eksplisit menyatakan asal; “dari Gibea” mempertahankan unsur tersebut.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Dan ada perang
  rationale: Klausa eksistensial Ibrani secara sederhana menyatakan adanya perang. Terjemahan ini tidak menambahkan gagasan bahwa perang baru pecah atau terus berlanjut.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan ...
  rationale: Ini adalah padanan Indonesia yang biasa bagi konstruksi Ibrani yang menyatakan pertentangan dua pihak.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Nama dalam Tawarikh dipertahankan sebagai Abia dan tidak diselaraskan dengan bentuk nama dalam tradisi kitab Raja-Raja.
theological_decisions:
- issue: Perbedaan nama ibu Abia antara Tawarikh dan teks paralel dalam 1 Raja-Raja 15:2
  choice: Mempertahankan bunyi teks Tawarikh, “Mikhaya, putri Uriel dari Gibea,” dalam teks utama.
  alternative: Menyelaraskan nama itu dengan Maakha dalam 1 Raja-Raja 15:2, atau menerjemahkan “putri” secara eksplisit sebagai “cucu perempuan/keturunan perempuan.”
  rationale: Terjemahan mengikuti teks Ibrani yang tersedia dan tidak menghapus ketegangan antarteks. Kemungkinan cakupan silsilah yang lebih luas dijelaskan dalam catatan kaki, bukan dimasukkan sebagai kepastian ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan bentuk ringkas laporan pemerintahan dan tanpa menyelaraskan perbedaan dengan kitab Raja-Raja.
