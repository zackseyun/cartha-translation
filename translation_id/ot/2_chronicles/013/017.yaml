base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: id
  text: Abia dan orang-orangnya menimpakan pukulan besar kepada mereka[a], dan lima ratus ribu orang pilihan dari Israel gugur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pukulan yang dahsyat” atau “pembantaian besar.” Ungkapan Ibraninya secara harfiah berarti “pukulan besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: menghantam mereka
  rationale: Kata kerja נכה dalam konteks pertempuran menyatakan tindakan memukul atau menghantam. Pilihan ini mempertahankan gambaran tindakan militer tanpa lebih dahulu menyatakan hasil akhirnya.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: Abia dan rakyatnya
  rationale: עַם secara harfiah berarti 'rakyat' atau 'bangsa'. Dalam konteks ini yang dimaksud ialah orang-orang Abia yang ikut bertempur; 'rakyatnya' mempertahankan keluasan istilah Ibrani tanpa mempersempitnya menjadi 'pasukannya'.
- source_word: מַכָּה רַבָּה
  choice: dengan pukulan yang hebat
  rationale: Ungkapan ini secara harfiah berarti 'pukulan besar/hebat'. Terjemahan tersebut mempertahankan urutan teks, karena kematian para prajurit baru dinyatakan dalam klausa berikutnya.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: gugur
  rationale: Dalam laporan pertempuran, נפל bersama חֲלָלִים berarti jatuh sebagai orang yang terbunuh. 'Gugur' menyampaikan makna kematian dalam pertempuran secara wajar dan ringkas dalam bahasa Indonesia.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Frasa ini menunjukkan kelompok asal para korban, yaitu Israel.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: lima ratus ribu
  rationale: Bilangan ini diterjemahkan langsung sebagaimana tercantum dalam teks Ibrani.
- source_word: אִישׁ בָּחוּר
  choice: orang pilihan
  rationale: אִישׁ dipakai secara distributif bersama bilangan, sedangkan בָּחוּר menunjuk kepada orang yang terpilih atau pilihan, khususnya prajurit pilihan. 'Orang pilihan' mempertahankan makna itu tanpa menambahkan sifat keberanian yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Besarnya jumlah korban dalam kisah pertempuran
  choice: Mempertahankan angka lima ratus ribu sebagaimana dinyatakan dalam teks Ibrani.
  alternative: Menganggap angka itu sebagai hiperbola, mengubah bilangannya, atau menafsirkan אֶלֶף sebagai satuan kelompok/militer.
  rationale: Ayat ini menyebutkan angka tersebut secara langsung tanpa penanda tekstual bahwa angka itu harus dikurangi atau dilambangkan. Terjemahan tidak seharusnya menyelesaikan persoalan historis-kritis dengan mengubah isi teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua klausa dipertahankan agar tindakan menyerang dan akibat mautnya tetap dibedakan seperti dalam teks Ibrani.
