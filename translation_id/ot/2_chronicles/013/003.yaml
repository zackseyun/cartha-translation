  text: וַ/יֶּאְסֹ֨ר אֲבִיָּ֜ה אֶת הַ/מִּלְחָמָ֗ה בְּ/חַ֨יִל֙ גִּבּוֹרֵ֣י מִלְחָמָ֔ה אַרְבַּע מֵא֥וֹת אֶ֖לֶף אִ֣ישׁ בָּח֑וּר וְ/יָרָבְעָ֗ם עָרַ֤ךְ עִמּ/וֹ֙ מִלְחָמָ֔ה בִּ/שְׁמוֹנֶ֨ה מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ בָּח֖וּר גִּבּ֥וֹר חָֽיִל־־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: id
  text: Abia maju bertempur[a] dengan pasukan yang terdiri dari empat ratus ribu prajurit pilihan, para pejuang perkasa. Yerobeam mengatur barisan untuk bertempur melawannya dengan delapan ratus ribu prajurit pilihan, para pejuang yang gagah berani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berarti “mengikat pertempuran”; maksudnya ialah mulai atau terlibat dalam pertempuran.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini merupakan sebutan militer bagi para pejuang yang kuat, cakap, dan berani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: maju bertempur
  rationale: Secara harfiah verba אָסַר berarti ‘mengikat’, tetapi bersama מִלְחָמָה membentuk ungkapan militer untuk mulai atau terlibat dalam pertempuran. ‘Maju bertempur’ menyampaikan idiom itu secara alami tanpa mempertahankan metafora yang tidak lazim dalam bahasa Indonesia.
- source_word: בְּחַיִל
  choice: dengan pasukan
  rationale: Dalam konteks jumlah tentara, חַיִל menunjuk pada kekuatan atau pasukan militer, bukan kekayaan atau keperkasaan.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: para pejuang perkasa
  rationale: Frasa ini menunjuk kepada orang-orang yang kuat dan terbukti dalam peperangan; pilihan ini mempertahankan unsur kekuatan dan fungsi militernya.
- source_word: בָּחוּר
  choice: prajurit pilihan
  rationale: Dalam daftar pasukan ini, בָּחוּר menggambarkan orang-orang yang dipilih atau berkualitas sebagai tentara. ‘Prajurit’ dibuat eksplisit secara wajar dari konteks militer.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: mengatur barisan untuk bertempur melawannya
  rationale: Dalam pemakaian militer, עָרַךְ berarti menyusun atau menata pasukan dalam formasi tempur. ‘Melawannya’ menyatakan hubungan permusuhan yang jelas dalam konteks.
- source_word: גִּבּוֹר חָיִל
  choice: para pejuang yang gagah berani
  rationale: Ungkapan militer ini menggambarkan orang-orang yang cakap, kuat, dan berani dalam pertempuran; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan nuansa keberanian serta kemampuan.
