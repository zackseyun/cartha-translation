source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: id
  text: Yerobeam anak Nebat, seorang hamba Salomo, anak Daud, bangkit dan memberontak terhadap tuannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “majikannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk Qal wayyiqtol dari קום mengawali tindakan Yerobeam dalam menentang penguasanya. “Bangkit” mempertahankan daya naratif tanpa mempersempit maknanya menjadi tindakan militer.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sedangkan hubungan patronimik diterjemahkan secara langsung.
- source_word: עֶבֶד
  choice: hamba
  rationale: Dalam konteks lingkungan kerajaan, kata ini menunjuk pada kedudukan Yerobeam sebagai bawahan atau pelayan Salomo. “Hamba” mempertahankan nuansa hierarkis tanpa harus menyiratkan perbudakan sebagai barang milik.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomo anak Daud
  rationale: Nama-nama memakai bentuk Indonesia yang lazim, dan ungkapan hubungan anak dipertahankan untuk menonjolkan garis dinasti.
- source_word: וַיִּמְרֹד
  choice: memberontak
  rationale: Kata מרד lazim menyatakan pemberontakan terhadap pihak yang berwenang; “memberontak” merupakan padanan Indonesia yang alami dalam konteks politik ini.
- source_word: עַל אֲדֹנָיו
  choice: terhadap tuannya
  rationale: Frasa ini merujuk kepada Salomo sebagai penguasa Yerobeam. “Tuannya” mempertahankan hubungan kewenangan manusiawi dan tidak mengacaukannya dengan sebutan ilahi.
theological_decisions:
- issue: Terjemahan אֲדֹנָיו yang merujuk kepada manusia
  choice: tuannya
  alternative: majikannya
  rationale: Yang dimaksud adalah Salomo sebagai atasan manusia, bukan nama atau gelar ilahi. “Tuannya” mempertahankan makna kewenangan dan cocok dengan hubungan politik kerajaan, sedangkan “majikannya” juga mungkin tetapi lebih mudah dipahami sebagai hubungan kerja atau rumah tangga.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mengikuti gerak narasi Ibrani, sementara “seorang” ditambahkan sebelum “hamba” agar hubungan aposisional terbaca alami. Penanda catatan kaki ditempatkan setelah unsur yang diterangkannya, yaitu “tuannya”.
