  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: id
  text: Tetapi bagi kami, Yahweh adalah Allah kami, dan kami tidak meninggalkan-Nya[a]. Para imam yang melayani Yahweh adalah keturunan Harun, dan orang-orang Lewi menjalankan tugas mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kami tidak menelantarkan-Nya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “orang-orang Lewi dalam pekerjaan itu,” yaitu sedang melaksanakan pelayanan yang ditugaskan kepada mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Tetapi bagi kami
  rationale: Kata sambung dan pronomina mandiri ini menandai kontras antara Yehuda dan kerajaan utara; ungkapan ini menyampaikan fungsi topikal-kontrastifnya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama perjanjian dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Bentuk ini merujuk kepada Yahweh yang tunggal dan secara idiomatis berarti 'Allah kami'.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: dan kami tidak meninggalkan-Nya
  rationale: עזב berarti meninggalkan atau menelantarkan. Bentuk lampau Ibrani dalam konteks ini menyatakan kesetiaan yang tetap berlaku; bahasa Indonesia tidak perlu menandai perbedaan antara simple past dan present perfect.
- source_word: מְשָׁרְתִים לַיהוָה
  choice: yang melayani Yahweh
  rationale: Partisipel menunjukkan pelayanan keimaman yang berlangsung, sedangkan ל menandai pihak yang dilayani.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Terjemahan ini mempertahankan ungkapan genealogis harfiah 'anak-anak Harun', yang dalam konteks mencakup garis keturunannya.
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: dan orang-orang Lewi menjalankan tugas mereka
  rationale: Ungkapan eliptis 'orang-orang Lewi dalam pekerjaan itu' menyatakan bahwa mereka sedang melaksanakan pelayanan atau tugas yang ditetapkan bagi mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi secara langsung; transliterasi 'Yahweh' mempertahankan hal itu tanpa menggantinya dengan gelar.
- issue: Daya waktu עֲזַבְנֻהוּ
  choice: kami tidak meninggalkan-Nya
  alternative: kami dahulu tidak meninggalkan-Nya
  rationale: Pernyataan Abia menyangkut kesetiaan perjanjian yang diklaim masih berlangsung. Bentuk tanpa penanda waktu lampau yang sempit mempertahankan relevansi kini tanpa memaksakan aspek yang tidak wajib dinyatakan dalam bahasa Indonesia.
- issue: Identitas imam sebagai בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  alternative: keturunan Harun
  rationale: Ungkapan formal sumber dipertahankan. Dalam konteks kelembagaan imam, 'anak-anak' secara wajar menunjuk garis keturunan, tanpa mempersempitnya pada putra langsung Harun.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kontras ayat dipertahankan, sementara klausa eliptis terakhir dibuat alami dalam bahasa Indonesia. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
