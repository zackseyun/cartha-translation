  text: וַ/יִּתְחַזֵּ֣ק אֲבִיָּ֔הוּ וַ/יִּ֨שָּׂא ל֔/וֹ נָשִׁ֖ים אַרְבַּ֣ע עֶשְׂרֵ֑ה וַ/יּ֗וֹלֶד עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ בָּנִ֔ים וְ/שֵׁ֥שׁ עֶשְׂרֵ֖ה בָּנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: id
  text: Abia menjadi semakin kuat[a]. Ia mengambil empat belas perempuan sebagai istri[b] dan menjadi ayah bagi dua puluh dua anak laki-laki serta enam belas anak perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi perkasa” atau “menguatkan dirinya.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “mengambil ... perempuan sebagai istri” berarti bahwa ia menikahi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: menjadi semakin kuat
  rationale: Bentuk Hitpael dari חזק menunjukkan bahwa Abia menjadi kuat atau makin kukuh. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada kekuatan militer atau politik.
- source_word: אֲבִיָּהוּ
  choice: Abia
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia, sesuai dengan konvensi penamaan modern.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: Ia mengambil empat belas perempuan sebagai istri
  rationale: Ungkapan נשא ... נשים dengan לוֹ menyatakan bahwa ia mengambil perempuan-perempuan itu bagi dirinya sebagai istri. Terjemahan ini dekat dengan susunan Ibrani sekaligus jelas bagi pembaca modern.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dengan subjek laki-laki berarti menjadi ayah atau memperanakkan. Pilihan ini mempertahankan tindakan kebapakan secara lebih tepat daripada sekadar 'mempunyai'.
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: dua puluh dua anak laki-laki
  rationale: Menerjemahkan bilangan dan kata בָּנִים secara langsung tanpa menggeneralisasikannya menjadi 'anak-anak'.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: serta enam belas anak perempuan
  rationale: Menerjemahkan bilangan dan kata בָּנוֹת secara langsung serta mempertahankan kesejajaran dengan frasa sebelumnya.
theological_decisions:
- issue: Penggambaran perkawinan poligini
  choice: 'Menyampaikan tindakan Abia secara deskriptif: ''Ia mengambil empat belas perempuan sebagai istri.'''
  alternative: Menerjemahkan secara lebih interpretatif sebagai 'Ia menikahi empat belas perempuan' atau menambahkan penilaian moral.
  rationale: Ayat ini melaporkan tindakan Abia dan jumlah keturunannya tanpa secara eksplisit memuji ataupun mengecam praktik tersebut. Terjemahan tidak menambahkan penilaian teologis atau etis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menjadi semakin kuat' mempertahankan keluasan makna verba Ibrani, sedangkan 'memperanakkan' dipilih karena ringkas dan tepat meskipun bernuansa lebih formal. Semua penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
