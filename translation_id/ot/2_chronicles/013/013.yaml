  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: id
  text: Namun, Yerobeam telah mengerahkan pasukan penyergap itu untuk memutar dan datang dari belakang mereka. Dengan demikian, pasukan Yerobeam berada di depan Yehuda, sedangkan pasukan penyergap itu berada di belakang mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הֵסֵב אֶת־הַמַּאְרָב
  choice: telah mengirim pasukan penyergap memutar
  rationale: Hifil הֵסֵב menyatakan tindakan membuat sesuatu bergerak memutar; הַמַּאְרָב secara kontekstual menunjuk pasukan yang ditempatkan untuk menyergap.
- source_word: לָבוֹא מֵאַחֲרֵיהֶם
  choice: untuk mendatangi mereka dari belakang
  rationale: Mempertahankan tujuan gerakan dan orientasi spasial teks Ibrani.
- source_word: וַיִּהְיוּ לִפְנֵי יְהוּדָה
  choice: pasukan Yerobeam berada di depan Yehuda
  rationale: Subjek jamak tersirat dijelaskan secara minimal berdasarkan konteks agar rujukannya alami dalam bahasa Indonesia, tanpa mengubah posisi kedua kelompok.
