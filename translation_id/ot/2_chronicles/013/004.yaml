id: 2CH.13.4
reference: 2 Chronicles 13:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣קָם אֲבִיָּ֗ה מֵ/עַל֙ לְ/הַ֣ר צְמָרַ֔יִם אֲשֶׁ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי יָרָבְעָ֥ם וְ/כָל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: id
  text: Lalu Abia berdiri di atas Gunung Zemaraim[a], yang terletak di pegunungan Efraim, dan berkata, “Dengarkanlah aku, Yerobeam dan seluruh Israel!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang terletak di daerah perbukitan Efraim.” Ungkapan Ibrani dapat menunjuk kawasan perbukitan atau pegunungan Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: berdiri
  rationale: Dalam narasi, קום dapat berarti bangkit atau berdiri. Dalam konteks Abia menyampaikan pidato, “berdiri” alami dan tidak menambahkan gagasan tentang sikap militer resmi.
- source_word: מֵעַל לְהַר
  choice: di atas Gunung
  rationale: Rangkaian preposisi Ibrani secara harfiah rumit, tetapi secara idiomatis menunjukkan posisi Abia di Gunung Zemaraim. “Di atas Gunung” menyampaikan makna lokatif dengan wajar.
- source_word: צְמָרַיִם
  choice: Zemaraim
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: yang terletak di pegunungan Efraim
  rationale: הַר dapat menunjuk gunung atau kawasan bergunung-gunung. Di sini ungkapan tersebut paling alami dipahami sebagai nama kawasan geografis, sementara kemungkinan nuansanya dijelaskan dalam catatan kaki.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: Ini adalah pengantar tuturan naratif biasa; subjeknya sudah jelas dari klausa sebelumnya.
- source_word: שְׁמָעוּנִי
  choice: Dengarkanlah aku
  rationale: Bentuk imperatif שמע dengan akhiran orang pertama tunggal menyampaikan seruan langsung agar para pendengar memperhatikan Abia. Partikel “-lah” mempertahankan daya retoris yang tegas dan bermartabat.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: Yerobeam dan seluruh Israel
  rationale: Sapaan itu ditujukan kepada raja dan seluruh Israel yang hadir. Nama nasional dipertahankan secara langsung agar retorika teks tidak dipersempit menjadi sekadar sebutan etnis.
theological_decisions:
- issue: Penerjemahan יִשְׂרָאֵל dalam konteks kerajaan yang terpecah
  choice: seluruh Israel
  alternative: semua orang Israel; seluruh bangsa Israel
  rationale: Teks Ibrani memakai langsung nama nasional-perjanjian itu. “Seluruh Israel” mempertahankan ketegangan politis dan teologis ketika kerajaan utara tetap disapa dengan nama Israel, tanpa mempersempitnya menjadi etnis atau menjelaskan implikasinya di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif dan retoris yang bermartabat. Nama tokoh memakai bentuk Indonesia yang umum, “Abia” dan “Yerobeam”; nama tempat “Zemaraim” ditransliterasikan. Seruan langsung dibuat tegas tetapi tetap alami.
