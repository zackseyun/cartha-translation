  source_fidelity: 'Revisi diperlukan untuk menghindari pelemahan hasil yang dinyatakan oleh וְהָיָה כֹהֵן: “dapat menjadi imam” menyiratkan kemungkinan, sedangkan teks menyatakan bahwa orang itu menjadi imam. “Negeri-negeri lain” dapat dipertahankan sebagai cara idiomatis untuk plural הָאֲרָצוֹת, tetapi “lain” tidak perlu ditekankan sebagai unsur leksikal terpisah. Terjemahan “yang bukan allah” mempertahankan penyangkalan polemis dalam לְלֹא אֱלֹהִים tanpa mereduksinya menjadi sekadar label “palsu.”'
