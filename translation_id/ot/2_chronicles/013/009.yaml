  terminology: “Yahweh,” “imam,” “orang-orang Lewi,” “ditahbiskan,” dan “allah” (huruf kecil dalam arti dewa) digunakan secara konsisten. Catatan a secara tepat menjelaskan idiom pentahbisan; catatan b mempertahankan alternatif dan penyangkalan eksplisit atas keilahian objek ibadah.
