  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: id
  text: Bukankah kalian telah mengusir para imam Yahweh—anak-anak Harun—dan orang-orang Lewi, lalu mengangkat imam-imam untuk diri kalian sendiri seperti bangsa-bangsa di negeri-negeri lain? Siapa pun yang datang untuk ditahbiskan[a] dengan seekor lembu jantan muda dan tujuh ekor domba jantan menjadi imam bagi yang bukan allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengisi tangannya”, sebuah ungkapan teknis untuk pelantikan atau pentahbisan seorang imam.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “bagi yang bukan dewa-dewa” atau “bagi allah-allah palsu”. Bahasa Ibrani secara harfiah menyangkal bahwa objek-objek sembahan itu benar-benar allah atau dewa.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan sekaligus menyampaikan teguran.
- source_word: הִדַּחְתֶּם
  choice: telah mengusir
  rationale: Bentuk Hifil menyatakan tindakan menyebabkan tersingkir atau terusir; pilihan ini wajar dan cukup kuat dalam bahasa Indonesia.
- source_word: כֹּהֲנֵי יְהוָה
  choice: para imam Yahweh
  rationale: Frasa konstruksi diterjemahkan langsung, dan nama ilahi יהוה dipertahankan sebagai Yahweh.
- source_word: בְּנֵי אַהֲרֹן
  choice: keturunan Harun
  rationale: Dalam konteks garis keimaman, ungkapan 'anak-anak Harun' menunjuk keturunan Harun; 'keturunan' lebih alami dan mencegah kesan bahwa yang dimaksud hanya anak langsung.
- source_word: וְהַלְוִיִּם
  choice: dan orang-orang Lewi
  rationale: Mempertahankan penyebutan tersendiri kaum Lewi di samping para imam keturunan Harun.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: lalu mengangkat imam-imam bagi diri kalian sendiri
  rationale: עשה dalam konteks ini berarti menjadikan atau mengangkat seseorang sebagai imam; 'bagi diri kalian sendiri' mempertahankan nuansa לָכֶם.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: seperti bangsa-bangsa di negeri-negeri lain
  rationale: Menyampaikan perbandingan dengan bangsa-bangsa sekitar secara alami tanpa memasukkan label teologis yang tidak dinyatakan oleh bahasa Ibrani.
- source_word: כָּל הַבָּא
  choice: Siapa pun yang datang
  rationale: Mencerminkan konstruksi tunggal generik dan menonjolkan kritik terhadap akses terbuka kepada jabatan imam.
- source_word: לְמַלֵּא יָדוֹ
  choice: untuk ditahbiskan
  rationale: Secara harfiah berarti 'mengisi tangannya', tetapi merupakan ungkapan teknis bagi pelantikan atau pentahbisan imam. Bentuk pasif Indonesia menghindari kesan bahwa calon itu menahbiskan dirinya sendiri.
- source_word: בְּפַר בֶּן בָּקָר
  choice: dengan membawa seekor sapi jantan muda
  rationale: Ungkapan korban ini menunjuk seekor sapi jantan muda; 'membawa' memperjelas fungsi ב sebagai sarana atau persembahan untuk pentahbisan.
- source_word: וְאֵילִם שִׁבְעָה
  choice: dan tujuh ekor domba jantan
  rationale: Padanan langsung dan mudah dipahami bagi tujuh ekor domba jantan yang dipersembahkan.
- source_word: וְהָיָה כֹהֵן
  choice: dapat menjadi imam
  rationale: Menyatakan hasil prosedur tersebut. 'Dapat' menyampaikan bahwa siapa saja yang memenuhi syarat persembahan diterima sebagai imam, tanpa menjadikannya kewajiban.
- source_word: לְלֹא אֱלֹהִים
  choice: bagi yang bukan Allah
  rationale: Mempertahankan penyangkalan polemis bahwa objek ibadah tersebut bukan Allah, alih-alih sekadar melabelinya sebagai dewa palsu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari gelar.
- issue: Makna לְלֹא אֱלֹהִים
  choice: bagi yang bukan Allah
  alternative: bagi dewa-dewa palsu
  rationale: Bahasa Ibrani secara tajam menyangkal keilahian objek ibadah itu. Terjemahan terpilih menjaga ketegangan dan bentuk penyangkalan tersebut tanpa mengubahnya menjadi label interpretatif.
- issue: Hubungan בְּנֵי אַהֲרֹן dengan כֹּהֲנֵי יְהוָה
  choice: yaitu keturunan Harun
  alternative: para imam Yahweh, keturunan Harun
  rationale: Ungkapan itu mengidentifikasi para imam Yahweh sebagai garis Harun, sementara orang-orang Lewi disebut sebagai kelompok berikutnya. 'Yaitu' membuat hubungan aposisional ini jelas dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang khidmat. Kata ganti jamak 'kalian' dipakai karena verba Ibrani berbentuk orang kedua jamak. Istilah kultis dijelaskan melalui catatan kaki agar teks utama tetap alami dan mudah dipahami.
