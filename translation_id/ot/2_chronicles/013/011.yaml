    text: Atau “roti sajian” atau “roti hadirat”. Secara harfiah, “susunan roti”.
    reason: lexical_alternative
  revision_rationale: Revisi memulihkan koordinasi daftar perlengkapan dan tindakan pelayanan dalam satu kalimat, menerjemahkan infinitif לְבָעֵר sebagai tujuan ('untuk dinyalakan') tanpa menambahkan gagasan bahwa pelita terus menyala, dan menerjemahkan מִשְׁמֶרֶת secara cukup luas sebagai 'kewajiban'. Catatan kaki tetap terikat pada 'susunan roti' dan mempertahankan alternatif yang relevan.
