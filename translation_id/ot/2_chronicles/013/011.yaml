  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: id
  text: Kami mempersembahkan kurban bakaran kepada Yahweh pagi demi pagi dan petang demi petang, juga dupa harum serta susunan roti[a] di atas meja yang tahir, dan kaki pelita emas dengan pelita-pelitanya untuk dinyalakan petang demi petang. Sebab kami memelihara kewajiban Yahweh, Allah kami, sedangkan kalian telah meninggalkan Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti sajian” atau “roti hadirat”. Secara harfiah, “susunan roti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: kami mempersembahkan
  rationale: Bentuk Hifil dari קטר dalam konteks kurban menyatakan tindakan membuat persembahan naik sebagai asap; 'mempersembahkan' menyampaikan tindakan ritual secara alami, sementara objeknya menjelaskan bahwa kurban itu dibakar.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh' agar nama ilahi yang dinyatakan dalam teks tetap tampak.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Istilah baku dan jelas untuk kurban yang dibakar seluruhnya di atas mazbah.
- source_word: בַּבֹּקֶר בַּבֹּקֶר ... וּבָעֶרֶב בָּעֶרֶב
  choice: pagi demi pagi dan petang demi petang
  rationale: Pengulangan distributif Ibrani menunjukkan pelaksanaan teratur setiap hari; bentuk 'demi' mempertahankan irama dan kesejajarannya.
- source_word: וּקְטֹרֶת סַמִּים
  choice: juga dupa harum
  rationale: סַמִּים menunjuk pada rempah-rempah aromatik; 'dupa harum' alami dalam bahasa Indonesia sekaligus mempertahankan sifat aromatiknya.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: dan susunan roti
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang roti yang ditata secara teratur tanpa memasukkan istilah tradisional yang lebih interpretatif ke dalam teks utama.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: di atas meja yang tahir
  rationale: Dalam konteks ibadah, טָהוֹר menyatakan ketahiran ritual, bukan sekadar kebersihan; 'tahir' mempertahankan nuansa tersebut.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: pelita-pelita pada kaki pelita emas tetap menyala
  rationale: Ungkapan ini menyampaikan perlengkapan Bait Allah dan fungsi pelita-pelitanya secara alami dalam bahasa Indonesia.
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: kami tetap menjalankan tugas ibadah kepada Yahweh
  rationale: Frasa idiomatis שׁמר משׁמרת menunjuk pada pelaksanaan tanggung jawab atau tugas yang dipercayakan; konteks ayat secara khusus ialah pelayanan ibadah.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: sedangkan kalian telah meninggalkan Dia
  rationale: Kata ganti orang kedua jamak diterjemahkan 'kalian', dan kontras dengan kesetiaan para imam dipertahankan melalui 'sedangkan'.
theological_decisions:
- issue: Istilah untuk roti di meja kudus
  choice: susunan roti
  alternative: roti sajian; roti hadirat
  rationale: מַעֲרֶכֶת לֶחֶם secara harfiah menekankan roti yang disusun. Istilah tradisional benar berdasarkan fungsi dan konteksnya, tetapi lebih interpretatif, sehingga dicantumkan dalam catatan kaki.
- issue: Penerjemahan nama perjanjian יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יהוה secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari gelar umum.
- issue: Makna מִשְׁמֶרֶת dalam konteks pelayanan Bait Allah
  choice: tugas ibadah
  alternative: ketetapan; kewajiban
  rationale: Konteks ayat merinci pelayanan imam, sehingga 'tugas ibadah' menyampaikan tanggung jawab yang dijaga tanpa membatasi frasa itu pada satu upacara tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'pagi demi pagi' serta 'petang demi petang' dipertahankan untuk mencerminkan irama dan keteraturan dalam teks Ibrani. 'Kalian' dipakai karena sapaan Ibrani berbentuk jamak.
