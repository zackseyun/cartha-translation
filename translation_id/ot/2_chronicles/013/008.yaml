revisions:
- from: Sekarang kalian berkata bahwa kalian akan menguatkan diri untuk menghadapi kerajaan Yahweh yang berada dalam tangan keturunan Daud.[a][b] Kalian adalah pasukan yang sangat besar, dan bersama kalian ada patung-patung anak lembu dari emas yang dibuat Yerobeam bagi kalian sebagai allah.[c]
  to: Sekarang kalian berkata hendak menguatkan diri untuk menghadapi kerajaan Yahweh yang berada dalam tangan keturunan Daud.[a][b] Kalian adalah kelompok yang besar, dan bersama kalian ada patung-patung anak lembu emas yang dibuat Yerobeam bagi kalian sebagai allah-allah.[c]
  rationale: Revisi menghindari pembatasan “kelompok besar” menjadi pasukan, mempertahankan bentuk jamak pada sebutan bagi ilah-ilah buatan, dan memakai konstruksi yang lebih dekat dengan aspek ujaran dalam bahasa Ibrani. Metafora penting bahwa kerajaan Yahweh berada dalam tangan garis Daud tetap dipertahankan.
