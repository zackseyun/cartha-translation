  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: id
  text: Sekarang kalian berkata hendak menguatkan diri untuk menghadapi kerajaan Yahweh yang berada dalam tangan keturunan Daud.[a][b] Kalian adalah kelompok yang besar, dan bersama kalian ada patung-patung anak lembu emas yang dibuat Yerobeam bagi kalian sebagai allah-allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kalian berkata hendak menunjukkan kekuatan di hadapan kerajaan Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam tangan anak-anak Daud”; ungkapan ini menunjuk pada pemerintahan atau penyelenggaraan melalui garis keturunan Daud.
    reason: cultural_note
  - marker: c
    text: Atau, “untuk menjadi allah-allah.” Kata Ibrani yang dipakai berbentuk jamak dan secara polemis menunjuk pada patung-patung anak lembu yang dibuat Yerobeam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: kalian berkata
  rationale: Partisip ini menyatakan ujaran yang sedang atau kini dikemukakan dalam pidato Abia. Terjemahan ini mempertahankan unsur verbal tanpa mengubahnya menjadi sekadar niat batin.
- source_word: לְהִתְחַזֵּק
  choice: akan menguatkan diri
  rationale: Bentuk hitpael menyatakan tindakan menjadikan diri kuat atau menunjukkan kekuatan. Ungkapan refleksif ini mempertahankan citra kekuatan dalam bahasa Ibrani.
- source_word: לִפְנֵי
  choice: untuk menghadapi
  rationale: Secara harfiah berarti ‘di hadapan’, tetapi dalam konteks konfrontasi ini menyatakan sikap berhadapan atau melawan.
- source_word: מַמְלֶכֶת יְהוָה
  choice: kerajaan Yahweh
  rationale: Frasa ini mempertahankan klaim teologis Tawarikh bahwa kerajaan tersebut adalah milik Yahweh. Nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: yang berada dalam tangan keturunan Daud
  rationale: ‘Dalam tangan’ mempertahankan metafora Ibrani tentang kuasa atau penyelenggaraan, sedangkan ‘keturunan Daud’ secara alami menunjukkan garis dinasti, bukan hanya anak kandung Daud.
- source_word: הָמוֹן רָב
  choice: pasukan yang sangat besar
  rationale: Dalam konteks konfrontasi militer, kelompok besar ini adalah kekuatan pasukan. Pilihan ini menyampaikan keunggulan jumlah secara jelas.
- source_word: עֶגְלֵי זָהָב
  choice: patung-patung anak lembu dari emas
  rationale: Terjemahan ini mempertahankan bentuk jamak dan arti עֵגֶל sebagai anak lembu, sekaligus menjelaskan secara alami dalam bahasa Indonesia bahwa yang dimaksud adalah benda-benda kultis.
- source_word: לֵאלֹהִים
  choice: sebagai allah
  rationale: Bentuk Ibrani dapat berarti ‘sebagai allah’ atau ‘untuk menjadi allah’. Pilihan ini mempertahankan polemik terhadap patung-patung yang dijadikan objek sembahan tanpa menyamakan mereka dengan Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian dan mengikuti kebijakan proyek.
- issue: Hubungan kerajaan Yahweh dengan dinasti Daud
  choice: kerajaan Yahweh yang berada dalam tangan keturunan Daud
  alternative: kerajaan Yahweh yang diperintah keturunan Daud
  rationale: 'Rumusan ini mempertahankan ketegangan teologis teks: kerajaan itu milik Yahweh, tetapi pelaksanaannya berada dalam tangan garis keturunan Daud.'
- issue: Status anak-anak lembu emas
  choice: dibuat ... sebagai allah
  alternative: dibuat ... untuk menjadi allah
  rationale: Terjemahan mempertahankan tuduhan polemis dalam bentuk jamak tanpa melunakkan patung-patung itu menjadi sekadar lambang dan tanpa mengakui keilahian sejati mereka.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. ‘Kalian’ menandai bahwa sapaan Ibrani berbentuk jamak. Struktur pidato dibuat langsung dan tegas, sementara metafora ‘dalam tangan’ dipertahankan karena penting bagi gambaran teologis ayat.
