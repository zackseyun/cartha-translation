  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: id
  text: Dan orang-orang tak berguna, anak-anak Belial[a], berkumpul di sekelilingnya dan menunjukkan diri lebih kuat daripada Rehabeam anak Salomo. Pada waktu itu Rehabeam masih muda dan lemah hati serta tidak menguatkan dirinya untuk menghadapi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “anak-anak Belial” dapat berarti “orang-orang bejat” atau “orang-orang tak berguna”. “Belial” dapat dipahami sebagai nama ataupun sebagai istilah bagi kebejatan atau ketidakbergunaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: berkumpul di sekelilingnya
  rationale: Kata kerja קבץ dengan עַל dapat menggambarkan orang-orang yang berhimpun di sekitar seseorang atau melawan seseorang. Dalam konteks ini mereka berhimpun mendukung Yerobeam, sedangkan sifat permusuhan terhadap Rehabeam dinyatakan oleh klausa berikutnya.
- source_word: אֲנָשִׁים רֵקִים
  choice: orang-orang tak berguna
  rationale: רֵקִים secara harfiah berarti 'kosong', tetapi sebagai sebutan bagi orang menyatakan bahwa mereka tidak bernilai atau tidak bermoral. 'Orang-orang tak berguna' mempertahankan penilaian keras teks dan dapat dipahami dalam bahasa Indonesia modern.
- source_word: בְּנֵי בְלִיַּעַל
  choice: anak-anak Belial
  rationale: Terjemahan bentuk ungkapan Ibrani ini mempertahankan kemungkinan bahwa Belial dipahami sebagai nama yang dipersonifikasikan ataupun sebagai istilah bagi kebejatan atau ketidakbergunaan. Makna idiomatis dijelaskan dalam catatan kaki.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: menunjukkan diri lebih kuat daripada
  rationale: Bentuk hitpael dari אמץ dengan עַל menyatakan bahwa mereka memperlihatkan kekuatan dalam perlawanan terhadap Rehabeam. Pilihan ini menyampaikan daya komparatif dalam konteks tanpa mengubahnya menjadi pernyataan kemenangan penuh.
- source_word: נַעַר
  choice: masih muda
  rationale: נַעַר dapat berarti anak, pemuda, atau orang muda. Di sini sebutan itu merupakan penilaian retoris tentang kemudaan atau ketidakmatangan Rehabeam, bukan pernyataan bahwa ia seorang anak kecil.
- source_word: רַךְ לֵבָב
  choice: lemah hati
  rationale: Secara harfiah ungkapan ini berarti 'lembut/lemah hati'. Dalam konteks politik dan perlawanan, maksudnya ialah kurang teguh atau kurang berani, bukan penuh belas kasihan.
- source_word: לֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: belum menguatkan dirinya untuk menghadapi mereka
  rationale: Terjemahan ini mempertahankan gambaran refleksif tentang menguatkan diri dan arti לִפְנֵיהֶם sebagai berada di hadapan atau menghadapi mereka. 'Belum' sesuai dengan bentuk perfektum negatif dalam uraian keadaan pada waktu itu dan tidak memaksakan ketidakmampuan mutlak.
theological_decisions:
- issue: Makna בְּנֵי בְלִיַּעַל
  choice: anak-anak Belial
  alternative: orang-orang bejat / orang-orang tak berguna
  rationale: Mempertahankan bentuk harfiah mencegah terjemahan memutuskan secara diam-diam apakah Belial di sini merupakan nama yang dipersonifikasikan atau kata abstrak bagi kebejatan. Catatan kaki memberikan makna idiomatisnya.
- issue: Hubungan kekuatan para pemberontak dengan kelemahan Rehabeam
  choice: menunjukkan diri lebih kuat daripada ... belum menguatkan dirinya
  alternative: menguatkan diri melawan ... tidak sanggup bertahan melawan
  rationale: Pilihan ini mempertahankan ketegangan antara tindakan aktif para lawan dan kegagalan Rehabeam menguatkan diri, tanpa menafsirkan klausa terakhir sebagai ketidakmampuan mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar mudah dibaca, sambil mempertahankan urutan gagasan, penilaian moral, dan ketegangan leksikal teks Ibrani.
