base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: id
  text: Lalu orang-orang Yehuda bersorak. Ketika orang-orang Yehuda bersorak, Allah mengalahkan Yerobeam dan seluruh Israel di hadapan Abia dan Yehuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ
  choice: bersorak
  rationale: Kata kerja רוע dalam konteks pertempuran menunjuk pada seruan atau pekik nyaring; “bersorak” alami dalam bahasa Indonesia dan sesuai dengan tindakan kolektif pasukan Yehuda.
- source_word: אִישׁ יְהוּדָה
  choice: orang-orang Yehuda
  rationale: Bentuk tunggal אִישׁ dipakai secara kolektif. Terjemahan jamak menyampaikan maksudnya secara wajar tanpa mempersempitnya menjadi kelompok militer tertentu.
- source_word: נָגַף
  choice: mengalahkan
  rationale: Dalam konteks peperangan, נָגַף berarti memukul atau menyebabkan kekalahan. “Mengalahkan” menyatakan hasil tindakan Allah tanpa menyiratkan bahwa Yerobeam sendiri dibunuh dalam peristiwa ini.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan ungkapan relasional sumber, yakni bahwa kekalahan Israel terjadi di hadapan Abia dan Yehuda, tanpa menambahkan rincian kausal yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Peranan Allah dalam kemenangan Yehuda
  choice: Allah mengalahkan Yerobeam dan seluruh Israel
  alternative: Yerobeam dan seluruh Israel dikalahkan
  rationale: Teks Ibrani secara eksplisit menjadikan Allah sebagai pelaku tindakan; bentuk aktif dipertahankan agar penekanan teologis sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “orang-orang Yehuda bersorak” dipertahankan karena mencerminkan struktur dan penekanan teks Ibrani.
