- from: 'Abia mengejar Yerobeam dan merebut beberapa kota darinya: Betel beserta kota-kota kecil di sekitarnya, Yesana beserta kota-kota kecil di sekitarnya, dan Efron beserta kota-kota kecil di sekitarnya.'
  to: 'Abia mengejar Yerobeam dan merebut darinya kota-kota ini: Betel beserta kota-kota bawahannya, Yesana beserta kota-kota bawahannya, dan Efron beserta kota-kota bawahannya.'
