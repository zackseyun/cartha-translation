base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: id
  text: 'Abia mengejar Yerobeam dan merebut darinya kota-kota ini: Betel beserta kota-kota bawahannya, Yesana beserta kota-kota bawahannya, dan Efron beserta kota-kota bawahannya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: kota-kota kecil di sekitarnya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', tetapi dalam konteks permukiman menunjuk pada kota-kota atau desa-desa bawahan yang bergantung pada kota utama. Ungkapan ini menyampaikan relasi tersebut secara wajar dalam bahasa Indonesia.
- source_word: עָרִים
  choice: beberapa kota
  rationale: Bentuk jamak tak tentu diperjelas secara alami sebagai sejumlah kota, lalu diikuti daftar kota yang direbut.
- source_word: עפרון
  choice: Efron
  rationale: Mengikuti bentuk ketiv dalam teks WLC; tradisi pembacaan dan sejumlah saksi lain mendukung bentuk alternatif Efrain, tetapi teks utama mempertahankan Efron.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar serta tindakan berurutan dalam bahasa Ibrani dipertahankan, sedangkan idiom administratif 'anak-anak perempuannya' dialihkan ke ungkapan Indonesia yang mudah dipahami.
