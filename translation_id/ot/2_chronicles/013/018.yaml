  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: id
  text: Pada waktu itu orang Israel ditundukkan, sedangkan orang Yehuda unggul karena mereka bersandar kepada Yahweh, Allah nenek moyang mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: ditundukkan
  rationale: Bentuk Nifal dari כנע menyatakan bahwa mereka dibuat takluk atau berada di bawah kuasa pihak lain. Dalam konteks pertempuran, “ditundukkan” mempertahankan nuansa pasif tanpa melebihkan makna menjadi kehancuran total.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada bangsa atau pasukan kerajaan Israel. “Orang Israel” lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah “anak-anak Israel”, sekaligus mempertahankan kontras dengan orang Yehuda.
- source_word: בָּעֵת הַהִיא
  choice: pada waktu itu
  rationale: Padanan idiomatis dan langsung bagi keterangan waktu Ibrani tersebut.
- source_word: וַיֶּאֶמְצוּ
  choice: menjadi kuat
  rationale: Kata אמץ pada dasarnya menyatakan menjadi kuat atau menunjukkan kekuatan. Pilihan ini tetap dekat dengan bentuk sumber dan, dalam konteks pertempuran, menyiratkan bahwa Yehuda memperoleh keunggulan tanpa menggantinya dengan istilah kemenangan yang lebih spesifik.
- source_word: בְנֵי יְהוּדָה
  choice: orang Yehuda
  rationale: Padanan alami bagi kelompok bangsa atau pasukan Yehuda, serta membentuk kesejajaran yang jelas dengan “orang Israel”.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי memperkenalkan alasan orang Yehuda menjadi kuat; “karena” menyatakan hubungan sebab secara jelas.
- source_word: נִשְׁעֲנוּ עַל
  choice: bersandar kepada
  rationale: Terjemahan ini mempertahankan gambaran dasar שען, yaitu bersandar pada seseorang sebagai tumpuan, sekaligus menyampaikan makna mengandalkan atau menaruh kepercayaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: “Nenek moyang” merupakan ungkapan Indonesia yang alami untuk para leluhur dan mempertahankan hubungan historis-perjanjian yang dimaksud oleh frasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Struktur kontras antara Israel dan Yehuda dipertahankan dengan “sedangkan”. Ungkapan “bersandar kepada” sengaja mempertahankan metafora Ibrani yang tetap mudah dipahami dalam bahasa Indonesia.
