id: 2CH.13.14
reference: 2 Chronicles 13:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְנ֣וּ יְהוּדָ֗ה וְ/הִנֵּ֨ה לָ/הֶ֤ם הַ/מִּלְחָמָה֙ פָּנִ֣ים וְ/אָח֔וֹר וַֽ/יִּצְעֲק֖וּ לַ/יהוָ֑ה וְ/הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: id
  text: Ketika pasukan Yehuda berbalik, ternyata pertempuran menghadang mereka dari depan maupun belakang. Mereka pun berseru kepada Yahweh, dan para imam meniup nafiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: berbalik
  rationale: Bentuk dari פנה menyatakan gerakan berpaling atau berbalik. Dalam konteks pengepungan dari dua arah, “berbalik” alami dan tetap dekat dengan gambaran Ibrani.
- source_word: יְהוּדָה
  choice: pasukan Yehuda
  rationale: Nama Yehuda dipakai secara kolektif untuk orang-orang atau tentara Yehuda. Penambahan “pasukan” memperjelas pelakunya berdasarkan konteks pertempuran tanpa mengubah acuannya.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Kata ini mengarahkan perhatian pada keadaan yang mendadak mereka sadari. “Ternyata” menyampaikan daya kejut itu secara wajar dalam bahasa Indonesia modern.
- source_word: הַמִּלְחָמָה פָּנִים וְאָחוֹר
  choice: pertempuran menghadang mereka dari depan maupun belakang
  rationale: Ungkapan ini menunjukkan bahwa mereka menghadapi pertempuran dari kedua arah. “Menghadang” menghasilkan kalimat Indonesia yang alami tanpa secara eksplisit menambahkan pelaku serangan yang tidak disebutkan dalam frasa Ibrani.
- source_word: וַיִּצְעֲקוּ
  choice: berseru
  rationale: Kata צעק menyatakan seruan mendesak, di sini ditujukan kepada Allah. “Berseru” dapat mencakup intensitas dan permohonan doa.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama yang terdapat dalam teks sumber tetap tampak.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan langsung dan lazim bagi bentuk jamak tersebut.
- source_word: מחצצרים בַּחֲצֹצְרוֹת
  choice: meniup nafiri
  rationale: Partisipel denominatif ini menggambarkan tindakan membunyikan חֲצֹצְרוֹת yang berlangsung bersamaan. “Nafiri” membedakan alat tiup lurus untuk keperluan ibadah dan militer ini dari sangkakala tanduk, sedangkan aspek berlangsung dapat dipahami dari rangkaian adegan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi “Yahweh” mempertahankan nama diri ilahi yang ada dalam teks Ibrani dan mengikuti kebijakan proyek, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Pasukan Yehuda” memperjelas subjek kolektif; “ternyata” membawa fungsi וְהִנֵּה secara alami; koordinasi dengan “dan” dipertahankan antara seruan pasukan dan tindakan para imam.
