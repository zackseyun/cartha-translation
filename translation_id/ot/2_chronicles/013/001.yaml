lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: Pada tahun kedelapan belas pemerintahan
  rationale: Ungkapan ini merupakan rumus penanggalan berdasarkan tahun pemerintahan raja. Penambahan 'pemerintahan' membuat maksudnya jelas dan alami dalam bahasa Indonesia.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: Raja Yerobeam
  rationale: Preposisi ל dalam rumus ini menandai penguasa yang tahun pemerintahannya sedang dihitung; nama יָרָבְעָם ditransliterasikan menurut bentuk Indonesia yang lazim, 'Yerobeam'.
- source_word: וַ/יִּמְלֹךְ
  choice: menjadi raja
  rationale: Bentuk verba ini dalam konteks tersebut menyatakan naik takhta atau mulai memerintah; 'menjadi raja' mempertahankan nuansa ingresif secara jelas dan wajar.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Nama dalam Tawarikh berbentuk אֲבִיָּה dan ditransliterasikan sebagai 'Abia'; bentuk ini dibedakan dari אֲבִיָּם dalam kisah sejajar di 1 Raja-Raja 15:1.
- source_word: עַל יְהוּדָה
  choice: atas Yehuda
  rationale: Dengan verba מלך, עַל menunjukkan wilayah yang diperintah. 'Atas Yehuda' mempertahankan hubungan sintaksis sumber dan tetap dapat dipahami dalam bahasa Indonesia.
