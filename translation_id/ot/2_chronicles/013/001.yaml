  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: id
  text: Pada tahun kedelapan belas pemerintahan Raja Yerobeam[a], Abia menjadi raja atas Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam kisah sejajar di 1 Raja-Raja 15:1, Abia disebut “Abiam”; teks Tawarikh di sini memakai nama “Abia”.
