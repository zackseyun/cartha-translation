  text: וְ/לֹֽא עָצַ֧ר כֹּֽחַ יָרָבְעָ֛ם ע֖וֹד בִּ/ימֵ֣י אֲבִיָּ֑הוּ וַ/יִּגְּפֵ֥/הוּ יְהוָ֖ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: id
  text: Yerobeam tidak lagi mempertahankan kekuatannya pada zaman Abia. Kemudian Yahweh memukulnya[a], lalu ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menimpakan tulah kepadanya” atau “melandanya.” Teks Ibrani hanya menyatakan bahwa Yahweh “memukul” Yerobeam dan tidak menjelaskan caranya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: mempertahankan kekuatannya
  rationale: Gabungan עָצַר dengan כֹּחַ menyatakan bahwa Yerobeam tidak terus memiliki atau mempertahankan kekuatannya. Pilihan ini menjaga unsur leksikal tanpa membatasinya hanya pada kemenangan militer.
- source_word: לֹא ... עוֹד
  choice: tidak lagi
  rationale: Dalam konstruksi negatif ini, עוֹד secara idiomatis berarti ‘tidak lagi’ atau ‘tidak ... lagi’.
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: pada zaman Abia
  rationale: Ungkapan temporal ini berarti pada masa hidup atau pemerintahan Abia; bentuk Indonesia ini alami dan tetap dekat dengan idiom Ibrani.
- source_word: וַיִּגְּפֵהוּ
  choice: memukulnya
  rationale: Kata נגף dapat menunjuk pada pukulan ilahi, tulah, atau kekalahan. ‘Memukulnya’ mempertahankan keluasan makna dan tidak menentukan sarana yang tidak disebutkan teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: וַיָּמֹת
  choice: lalu ia mati
  rationale: Bentuk naratif ini menyampaikan urutan kejadian secara langsung; ‘lalu’ mengalir alami dalam bahasa Indonesia tanpa harus menyatakan hubungan sebab-akibat secara lebih tegas daripada teks.
theological_decisions:
- issue: Sifat tindakan ilahi dalam וַיִּגְּפֵהוּ יְהוָה
  choice: Ayat ini menyatakan bahwa Yahweh memukul Yerobeam, lalu Yerobeam mati, tanpa menyebutkan dengan cara apa pukulan itu terjadi.
  alternative: Yahweh menimpakan penyakit atau tulah kepadanya; atau Yahweh langsung membunuhnya dalam pertempuran maupun penghukuman.
  rationale: Teks menghubungkan kematian Yerobeam dengan tindakan Yahweh, tetapi tidak menentukan apakah sarana-Nya berupa penyakit, luka pertempuran, atau hal lain. Terjemahan mempertahankan ketegangan dan ketidakjelasan tersebut.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama pribadi memakai bentuk Indonesia yang lazim: Yerobeam dan Abia. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskannya.'
