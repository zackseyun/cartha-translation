base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: id
  text: Abia tidur bersama leluhurnya, dan orang-orang menguburkan dia di Kota Daud. Asa, anaknya, menjadi raja menggantikannya. Pada zamannya negeri itu tenteram[a] selama sepuluh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “negeri itu tenang selama sepuluh tahun.”
    reason: Menunjukkan padanan leksikal alternatif bagi שָׁקְטָה, yang dapat menyatakan keadaan tenang atau tenteram.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: tidur bersama leluhurnya
  rationale: Mempertahankan gambaran ungkapan baku Ibrani tentang kematian seorang raja. “Leluhur” lebih alami dan tepat cakupannya dalam bahasa Indonesia modern daripada “bapa-bapanya”.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: orang-orang menguburkan dia
  rationale: Bentuk aktif jamak dengan pelaku yang tidak disebutkan dipertahankan. “Orang-orang” menyatakan subjek tak tentu secara alami tanpa mengidentifikasi pelakunya.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Merupakan bentuk baku dan alami untuk nama tempat ini serta mencerminkan konstruksi Ibrani.
- source_word: וַיִּמְלֹךְ אָסָא בְנוֹ תַּחְתָּיו
  choice: Asa, anaknya, memerintah menggantikan dia
  rationale: Menyampaikan pemerintahan dan pergantian dinasti secara jelas tanpa menambahkan nuansa bahwa ia hanya mulai memerintah.
- source_word: בְּיָמָיו
  choice: Pada zamannya
  rationale: Padanan Indonesia yang alami bagi ungkapan harfiah “pada hari-harinya” dan tetap merujuk pada masa pemerintahan Asa.
- source_word: שָׁקְטָה
  choice: mendapat ketenangan
  rationale: Kata kerja ini menyatakan keadaan tenang dan bebas dari gangguan. Pilihan ini mempertahankan gagasan kelegaan nasional tanpa mempersempitnya secara eksplisit menjadi damai dari perang.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks kerajaan, “negeri itu” terdengar alami dan merujuk pada wilayah atau ranah yang diperintah Asa tanpa mengubahnya menjadi kata yang lebih interpretatif seperti “kerajaan”.
- source_word: עֶשֶׂר שָׁנִים
  choice: selama sepuluh tahun
  rationale: “Selama” secara wajar menandai rentang waktu dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan kematian Abia
  choice: tidur bersama leluhurnya
  alternative: meninggal dan bergabung dengan leluhurnya
  rationale: Terjemahan mempertahankan metafora kematian dalam teks Ibrani dan tidak menjelaskan secara teologis keadaan orang mati melampaui apa yang dikatakan sumber.
- issue: Sifat ketenangan negeri
  choice: mendapat ketenangan
  alternative: berada dalam keadaan damai
  rationale: Pilihan ini tidak memastikan bahwa ketenangan tersebut hanya berarti ketiadaan perang; kata Ibraninya dapat mencakup ketenteraman atau bebas dari gangguan secara lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan kematian tradisional dipertahankan karena dapat dipahami dari konteks, sedangkan susunan lain dibuat alami bagi pembaca masa kini. Penanda catatan kaki ditempatkan pada frasa yang memang memiliki alternatif leksikal.
