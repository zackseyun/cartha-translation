id: 2CH.30.13
reference: 2 Chronicles 30:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּֽאָסְפ֤וּ יְרוּשָׁלִַ֨ם֙ עַם רָ֔ב לַ/עֲשׂ֛וֹת אֶת חַ֥ג הַ/מַּצּ֖וֹת בַּ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י קָהָ֖ל לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: id
  text: Banyak sekali orang berkumpul di Yerusalem untuk merayakan[a] Hari Raya Roti Tidak Beragi[b] pada bulan kedua—sebuah perhimpunan yang sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “melaksanakan” atau “memperingati”; secara harfiah, “melakukan/membuat” hari raya itu.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “Perayaan Roti Tidak Beragi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: berkumpul
  rationale: Bentuk Niphal dari אסף menyatakan datang bersama atau dihimpunkan. “Berkumpul” alami dalam bahasa Indonesia dan mempertahankan fokus pada terjadinya perhimpunan.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: עַם רָב
  choice: banyak sekali orang
  rationale: Frasa ini menekankan jumlah orang yang besar. Pilihan ini alami dan mempertahankan daya penegasan teks Ibrani.
- source_word: לַעֲשׂוֹת
  choice: untuk merayakan
  rationale: Secara harfiah berarti “melakukan/membuat,” tetapi dengan hari raya sebagai objek, ungkapan ini berarti melaksanakan atau merayakannya.
- source_word: חַג הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: חַג menunjuk pada hari raya ziarah, sedangkan מַצּוֹת adalah roti tanpa ragi. Bentuk ini merupakan istilah Indonesia yang jelas dan lazim.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: pada bulan kedua
  rationale: Terjemahan langsung yang mempertahankan keterangan waktu penting dalam konteks perayaan yang ditunda.
- source_word: קָהָל
  choice: perhimpunan
  rationale: קָהָל menunjuk pada komunitas yang berhimpun. “Perhimpunan” mempertahankan arti kolektif tanpa membatasi maknanya pada istilah gerejawi.
- source_word: לָרֹב מְאֹד
  choice: sangat besar
  rationale: Ungkapan ini sangat menegaskan besarnya jumlah orang dalam perhimpunan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan penekanan jumlah besar dalam teks Ibrani, sementara tanda pisah memperjelas bahwa frasa terakhir merupakan penjelasan tambahan tentang orang-orang yang berkumpul.
