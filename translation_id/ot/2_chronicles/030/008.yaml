id: 2CH.30.8
reference: 2 Chronicles 30:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: id
  text: Sekarang janganlah mengeraskan tengkuk kalian seperti nenek moyang kalian. Berikanlah tangan kalian kepada TUHAN[a], datanglah ke tempat kudus-Nya yang telah Ia kuduskan untuk selama-lamanya, dan layanilah TUHAN, Allah kalian, supaya murka-Nya yang menyala-nyala berpaling dari kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berikanlah tangan kepada TUHAN,” suatu ungkapan yang berarti menyerahkan diri atau tunduk kepada TUHAN, dan mungkin juga menyiratkan ikrar kesetiaan.
    reason: Menjelaskan idiom Ibrani yang citranya dipertahankan dalam teks utama.
  - marker: b
    text: Atau, “dan murka-Nya yang menyala-nyala akan berpaling dari kalian.”
    reason: Mencatat kemungkinan bahwa bentuk verba dipahami sebagai hasil yang dinyatakan lebih tegas.
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Kata keterangan temporal ini hadir secara eksplisit dalam teks Ibrani dan karena itu dipertahankan.
- source_word: תַּקְשׁוּ עָרְפְּכֶם
  choice: mengeraskan tengkukmu
  rationale: Mempertahankan gambaran idiom Ibrani tentang sikap keras kepala dan perlawanan, sambil tetap wajar dalam bahasa Indonesia alkitabiah modern.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: seperti nenek moyangmu
  rationale: Dalam konteks ini אָבוֹת menunjuk generasi terdahulu; 'nenek moyang' menyampaikan maknanya secara alami tanpa membatasinya pada ayah kandung.
- source_word: תְּנוּ יָד לַיהוָה
  choice: Berikanlah tanganmu kepada TUHAN
  rationale: Mempertahankan citra konkret idiom Ibrani yang menyatakan penyerahan diri atau ikrar kesetiaan; makna idiomatis dijelaskan dalam catatan kaki.
- source_word: מִקְדָּשׁוֹ
  choice: tempat kudus-Nya
  rationale: Mencerminkan arti umum מִקְדָּשׁ sebagai tempat yang dikhususkan bagi Allah tanpa mempersempitnya secara tidak perlu menjadi istilah bangunan tertentu.
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: telah dikuduskan-Nya untuk selama-lamanya
  rationale: Mengungkapkan tindakan Allah menetapkan tempat itu sebagai kudus dan mempertahankan cakupan temporal לְעוֹלָם.
- source_word: וְעִבְדוּ
  choice: layanilah
  rationale: Arti dasar עבד adalah melayani; dalam hubungan dengan Allah kata ini juga mencakup ibadah, tanpa perlu mempersempitnya hanya menjadi kegiatan ritual.
- source_word: וְיָשֹׁב מִכֶּם
  choice: supaya ... berpaling darimu
  rationale: Dalam rangkaian nasihat ini bentuk verba menyatakan hasil yang diharapkan; 'supaya' mempertahankan nuansa tujuan atau hasil, bukan menjadikannya janji mekanis.
- source_word: חֲרוֹן אַפּוֹ
  choice: murka-Nya yang menyala-nyala
  rationale: Menyampaikan metafora panas dalam ungkapan Ibrani bagi kemarahan yang hebat dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: יהוה
  choice: TUHAN
  rationale: Bentuk huruf kapital membedakan nama perjanjian ilahi יהוה dari sebutan umum 'Tuhan' dalam kebiasaan penerjemahan bahasa Indonesia.
theological_decisions:
- issue: Makna idiom תְּנוּ יָד לַיהוָה
  choice: Citra sumber dipertahankan sebagai 'Berikanlah tanganmu kepada TUHAN'.
  alternative: Serahkanlah dirimu kepada TUHAN; tunduklah kepada TUHAN.
  rationale: Ungkapan itu kemungkinan menyatakan penyerahan diri atau ikrar kesetiaan. Teks utama mempertahankan citranya, sedangkan catatan kaki menjaga makna idiomatisnya agar tidak disalahpahami.
- issue: Daya klausa וְיָשֹׁב מִכֶּם
  choice: supaya murka-Nya yang menyala-nyala berpaling darimu
  alternative: dan murka-Nya yang menyala-nyala akan berpaling darimu
  rationale: Karena klausa ini mengikuti serangkaian bentuk perintah, terjemahan utama mempertahankan nuansa hasil yang diharapkan dan tidak mengubahnya menjadi jaminan otomatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal '-mu' mengikuti sapaan maskulin jamak Ibrani yang ditujukan secara kolektif kepada umat; dalam bahasa Indonesia bentuk ini wajar untuk komunitas yang diperlakukan sebagai satu pihak. Istilah 'TUHAN' dipakai untuk יהוה. Citra penting sumber dipertahankan, dengan catatan kaki saat idiom berpotensi tidak langsung dipahami.
