base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: id
  text: Sebab Hizkia, raja Yehuda, menyumbangkan kepada umat yang berhimpun seribu ekor sapi jantan dan tujuh ribu ekor ternak kecil[a]; para pemimpin menyumbangkan kepada umat itu seribu ekor sapi jantan dan sepuluh ribu ekor ternak kecil[a]; dan para imam menguduskan diri dalam jumlah besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ternak kawanan”; istilah Ibrani ini dapat mencakup domba maupun kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan wacana dengan ayat terdahulu.
- source_word: הֵרִים / הֵרִימוּ
  choice: menyumbangkan
  rationale: Bentuk kausatif dari רום di sini merupakan ungkapan bagi tindakan memberikan atau menyediakan hewan untuk perayaan ibadah bersama, bukan mengangkat secara harfiah.
- source_word: לַקָּהָל
  choice: kepada umat yang berkumpul
  rationale: קָהָל menunjuk kepada komunitas yang sedang berhimpun. Ungkapan ini jelas dalam bahasa Indonesia dan mempertahankan arah pemberian yang dinyatakan oleh preposisi ל.
- source_word: פָּרִים
  choice: lembu jantan
  rationale: Kata ini menunjuk kepada sapi jantan yang dapat dipersembahkan sebagai kurban; 'lembu jantan' merupakan padanan yang lugas dan bermartabat.
- source_word: צֹאן
  choice: kambing dan domba
  rationale: Istilah kolektif ini mencakup ternak kecil dari kawanan, terutama kambing dan domba. Padanan ini mempertahankan cakupan maknanya tanpa membatasinya hanya pada domba.
- source_word: הַשָּׂרִים
  choice: para pemimpin
  rationale: שָׂרִים menunjuk kepada orang-orang berkedudukan tinggi dalam pemerintahan. 'Para pemimpin' alami dan tidak menyiratkan bahwa mereka semua pangeran berdasarkan keturunan.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: Para imam pun menguduskan diri
  rationale: Bentuk refleksif kata קדשׁ menyatakan bahwa para imam mempersiapkan dan mengkhususkan diri secara ritual untuk pelayanan. 'Menguduskan diri' mempertahankan nuansa kultisnya.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Ungkapan ini menekankan banyaknya imam yang menguduskan diri, bukan kadar atau mutu pengudusan mereka.
theological_decisions:
- issue: Makna pengudusan diri para imam
  choice: menguduskan diri
  alternative: menyucikan diri
  rationale: Teks menekankan penetapan atau persiapan ritual untuk pelayanan. 'Menguduskan diri' mempertahankan bahasa kekudusan tanpa mereduksinya hanya menjadi pembersihan moral atau jasmani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan jumlah dan jenis hewan dipertahankan untuk mengikuti penekanan narasi Ibrani. 'Umat yang berkumpul' dipilih agar makna komunal קָהָל jelas tanpa nuansa gerejawi yang terlalu khusus.
