  to: Sebab Hizkia, raja Yehuda, menyumbangkan kepada umat yang berhimpun seribu ekor sapi jantan dan tujuh ribu ekor ternak kecil[a]; para pemimpin menyumbangkan kepada umat itu seribu ekor sapi jantan dan sepuluh ribu ekor ternak kecil[a]; dan para imam menguduskan diri dalam jumlah besar.
