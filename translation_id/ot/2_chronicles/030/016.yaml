review_pass:
  verdict: revise
  source_fidelity: Terjemahan dengan tepat menyampaikan posisi pelayanan, tata ibadah yang diatur, Taurat Musa, dan tindakan imam memercikkan darah. Namun, frasa “yang mereka terima” tidak dinyatakan dalam teks Ibrani; hubungan penyerahan memang mungkin tersirat, tetapi penambahannya mempersempit ungkapan sumber yang hanya berbunyi “dari tangan orang-orang Lewi.”
  naturalness: Bahasa Indonesia modern dan register ibadahnya baik. “Tempat tugas masing-masing,” “tata cara yang ditetapkan,” dan “memercikkan darah” terdengar wajar dan jelas.
  terminology: “Taurat Musa,” “abdi Allah,” “imam,” dan “orang-orang Lewi” tepat serta konsisten dengan penggunaan Alkitab Indonesia. “Memercikkan” cocok untuk זרק dalam konteks ritual tanpa mengesankan tindakan biasa.
  issues:
  - severity: medium
    issue: Penambahan “yang mereka terima” pada frasa tentang darah.
    rationale: Ibrani menyatakan מִיַּד הַלְוִיִּם, secara harfiah “dari tangan orang-orang Lewi,” tanpa verba “menerima.” Walaupun penyerahan kepada imam masuk akal menurut konteks, terjemahan sebaiknya tidak menjadikannya pernyataan eksplisit.
  - severity: low
    issue: Catatan kaki hanya mempertahankan pembacaan harfiah setelah teks utama telah menambahkan unsur penjelas.
    rationale: Setelah unsur tambahan dihapus, catatan kaki tersebut tidak lagi diperlukan untuk mengoreksi atau menyeimbangkan teks utama.
  revised_text: Mereka berdiri di tempat tugas masing-masing sesuai dengan tata cara yang ditetapkan bagi mereka, menurut Taurat Musa, abdi Allah itu. Para imam memercikkan darah dari tangan orang-orang Lewi.
