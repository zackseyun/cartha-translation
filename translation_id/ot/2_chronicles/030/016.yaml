base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: id
  text: Mereka berdiri di tempat tugas masing-masing sesuai dengan tata cara yang ditetapkan bagi mereka, menurut Taurat Musa, abdi Allah itu. Para imam memercikkan darah dari tangan orang-orang Lewi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל־עָמְדָם
  choice: Mereka berdiri di tempat tugas masing-masing
  rationale: Ungkapan ini menunjuk pada posisi atau tempat pelayanan yang telah ditentukan. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan latar tata ibadah.
- source_word: כְּמִשְׁפָּטָם
  choice: sesuai dengan tata cara yang ditetapkan bagi mereka
  rationale: Dalam konteks peribadatan, מִשְׁפָּט menunjuk pada aturan atau prosedur yang berlaku, bukan sekadar kebiasaan maupun keputusan pengadilan.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: menurut Taurat Musa
  rationale: Istilah תּוֹרָה di sini mengacu pada pengajaran atau hukum Musa yang mengatur pelaksanaan ibadah; 'Taurat Musa' merupakan ungkapan Indonesia yang baku dan jelas.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  rationale: Ungkapan tersebut adalah gelar bagi Musa. 'Abdi Allah' menyampaikan kedudukan sebagai orang yang mengabdi dan mewakili Allah secara wajar dalam bahasa Indonesia.
- source_word: זֹרְקִים אֶת־הַדָּם
  choice: memercikkan darah
  rationale: Dalam konteks kurban, זרק menyatakan tindakan ritual mengaplikasikan darah. 'Memercikkan' menghindari kesan tindakan sembarangan yang dapat timbul dari terjemahan dasar 'melemparkan'.
- source_word: מִיַּד הַלְוִיִּם
  choice: yang mereka terima dari tangan orang-orang Lewi
  rationale: 'Secara harfiah frasa ini berarti ''dari tangan orang-orang Lewi''. Penambahan ''yang mereka terima'' menjelaskan hubungan yang tersirat: darah diserahkan oleh orang Lewi kepada para imam.'
theological_decisions:
- issue: Istilah ritual untuk pengaplikasian darah kurban
  choice: memercikkan darah
  alternative: melemparkan atau menyiramkan darah
  rationale: Pilihan ini mencerminkan penggunaan kultis זרק tanpa menambahkan penafsiran teologis di luar tindakan ritual yang disebutkan.
- issue: Makna מִשְׁפָּטָם dalam tata ibadah
  choice: tata cara yang ditetapkan bagi mereka
  alternative: kebiasaan mereka
  rationale: Konteks Taurat Musa menunjukkan prosedur ibadah yang ditentukan, bukan semata-mata kebiasaan yang berkembang secara sosial.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Istilah 'tempat tugas', 'tata cara', dan 'Taurat Musa' mempertahankan suasana resmi peribadatan tanpa menjadi kaku; 'abdi Allah' digunakan sebagai gelar yang alami.
