  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: id
  text: Kemudian Hizkia mengirim pesan kepada seluruh Israel dan Yehuda,[a] dan juga menulis surat kepada Efraim dan Manasye agar mereka datang ke rumah Yahweh di Yerusalem untuk merayakan Paskah untuk Yahweh,[b] Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke seluruh wilayah Israel dan Yehuda.” Kata depan Ibrani yang dipakai dapat menunjuk baik kepada orang-orang yang dituju maupun kepada luas wilayah penyampaian pesan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melakukan Paskah untuk Yahweh,” yaitu memperingati atau melaksanakan perayaan Paskah untuk menghormati-Nya.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim pesan
  rationale: Kata kerja ini secara harfiah berarti 'mengirim'. Dalam konstruksi dengan עַל dan kelompok bangsa, konteks menunjukkan tindakan menyampaikan pesan atau panggilan; 'mengirim pesan' menyatakan maksud itu tanpa menambahkan utusan yang tidak disebutkan.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: kepada seluruh Israel dan Yehuda
  rationale: עַל di sini paling wajar menandai sasaran atau jangkauan pengiriman. 'Kepada seluruh Israel dan Yehuda' tetap dekat dengan bentuk Ibrani dan alami dalam bahasa Indonesia.
- source_word: אִגְּרוֹת כָּתַב
  choice: menulis surat
  rationale: Terjemahan langsung dan alami bagi tindakan menulis korespondensi.
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: kepada Efraim dan Manasye
  rationale: עַל bersama כָּתַב menunjuk kepada penerima atau wilayah tujuan surat, yakni suku-suku utara tersebut.
- source_word: לָבוֹא
  choice: agar mereka datang
  rationale: Infinitif ini menyatakan tujuan atau isi panggilan. Subjek jamak tersirat diperjelas secara wajar dalam bahasa Indonesia.
- source_word: לְבֵית יְהוָה
  choice: ke rumah Yahweh
  rationale: Mempertahankan ungkapan harfiah 'rumah Yahweh'; 'Bait Yahweh' mungkin, tetapi 'rumah Yahweh' lebih transparan bagi pembaca umum dan tidak menghilangkan citra sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: merayakan Paskah
  rationale: Secara harfiah 'melakukan/membuat Paskah', suatu idiom untuk melaksanakan atau merayakan perayaan Paskah. 'Merayakan Paskah' merupakan padanan Indonesia yang alami.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ dapat menyatakan pihak yang menjadi tujuan atau kepentingan perayaan. 'Bagi Yahweh' mempertahankan arah dedikatif tanpa terdengar janggal.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan langsung bagi frasa konstruksi yang mengidentifikasi Yahweh sebagai Allah Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Relasi Paskah dengan Yahweh dalam לַיהוָה
  choice: bagi Yahweh
  alternative: untuk Yahweh; kepada Yahweh
  rationale: לְ memungkinkan nuansa tujuan, kepentingan, atau dedikasi. 'Bagi Yahweh' alami dalam bahasa Indonesia dan tidak mempersempit relasi itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim. Susunan kalimat dibuat alami tanpa menghilangkan cakupan panggilan, citra 'rumah Yahweh', atau nuansa dedikatif pada לַיהוָה.
