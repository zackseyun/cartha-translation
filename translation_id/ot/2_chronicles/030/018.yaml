revisions:
- from: Sebab banyak sekali orang—banyak dari Efraim dan Manasye, Isakhar dan Zebulon—belum menyucikan diri. Meskipun demikian, mereka memakan Paskah tidak sesuai dengan yang tertulis.[a] Namun, Hizkia berdoa bagi mereka, katanya, “Kiranya Yahweh yang baik mengadakan pendamaian bagi—”[b]
  to: Sebab sejumlah besar orang—banyak dari Efraim dan Manasye, Isakhar dan Zebulon—belum menyucikan diri, tetapi mereka makan Paskah tidak sesuai dengan yang tertulis. Namun, Hizkia berdoa bagi mereka, katanya, “Kiranya Yahweh yang baik mengadakan pendamaian bagi—”[b]
  rationale: Revisi menghindari penambahan hubungan konsesif melalui "Meskipun demikian", memperhalus idiom "makan Paskah", dan menghapus catatan kaki a yang tidak diperlukan. Sintaks yang belum selesai pada akhir ayat serta catatan penjelasnya dipertahankan.
