  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: id
  text: Sebab sejumlah besar orang—banyak dari Efraim dan Manasye, Isakhar dan Zebulon—belum menyucikan diri, tetapi mereka makan Paskah tidak sesuai dengan yang tertulis. Namun, Hizkia berdoa bagi mereka, katanya, “Kiranya Yahweh yang baik mengadakan pendamaian bagi—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Doa ini berlanjut dalam ayat 19; kalimat Ibrani belum selesai pada akhir ayat ini.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: banyak sekali orang—banyak
  rationale: Ungkapan ini menekankan besarnya jumlah orang tanpa mengharuskan arti bahwa mereka merupakan mayoritas mutlak. Pengulangan unsur 'banyak' mempertahankan penekanan bahasa Ibrani dalam susunan Indonesia yang wajar.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: dari Efraim dan Manasye, Isakhar dan Zebulon
  rationale: Nama-nama suku dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia, sedangkan urutan dan pengelompokan teks Ibrani dipertahankan.
- source_word: לֹא הִטֶּהָרוּ
  choice: belum menyucikan diri
  rationale: Bentuk hitpael bersifat refleksif dan dalam konteks Paskah menunjuk pada pentahiran ritual. 'Belum' sesuai dengan sudut pandang naratif terhadap keadaan mereka saat makan.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: memakan Paskah
  rationale: Objek harfiahnya adalah 'Paskah', yang dapat merujuk pada kurban atau perjamuan Paskah. Terjemahan tidak menambahkan 'anak domba', yang tidak dinyatakan langsung.
- source_word: בְּלֹא כַכָּתוּב
  choice: tidak sesuai dengan yang tertulis
  rationale: Pilihan ini mempertahankan acuan eksplisit kepada ketetapan tertulis dan terdengar alami dalam bahasa Indonesia.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: berdoa bagi mereka
  rationale: Gabungan kata kerja dan preposisi menyatakan doa yang dipanjatkan demi orang lain tanpa perlu menambahkan istilah yang lebih interpretatif seperti 'menjadi pengantara'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dialihaksarakan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: הַטּוֹב
  choice: yang baik
  rationale: Adjektiva tertentu ini menerangkan Yahweh. Bentuk ini alami dan tidak menaikkan derajat maknanya menjadi 'Mahabaik', yang tidak dinyatakan oleh bentuk Ibrani.
- source_word: יְכַפֵּר
  choice: mengadakan pendamaian
  rationale: Dalam konteks pentahiran dan Paskah, verba piel כפר mempertahankan nuansa kultis pendamaian; menerjemahkannya hanya sebagai 'mengampuni' akan mempersempit makna.
- source_word: בְּעַד־
  choice: bagi—
  rationale: Preposisi berarti 'bagi/demi', tetapi objeknya baru muncul dalam ayat berikutnya. Tanda pisah mempertahankan kalimat yang sengaja terputus pada batas ayat tanpa memasukkan objek yang tidak terdapat dalam ayat 18.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Makna kultis כפר
  choice: mengadakan pendamaian
  alternative: mengampuni
  rationale: Konteksnya menyangkut Paskah dan ketidaksucian ritual. Istilah 'pendamaian' menjaga cakupan teologis-kultis verba itu tanpa menentukan secara berlebihan bagaimana pendamaian tersebut terlaksana.
- issue: Objek doa pada akhir ayat
  choice: membiarkan frasa berakhir dengan 'bagi—'
  alternative: bagi mereka atau bagi setiap orang yang
  rationale: Teks Ibrani ayat 18 berakhir pada preposisi בְּעַד־ dan baru melengkapinya dalam ayat 19. Tidak menambahkan objek mempertahankan ketegangan sintaksis dan batas ayat sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah mengapit keterangan daftar suku agar kalimat panjang mudah dipahami, sedangkan tanda pisah terakhir sengaja menandai bahwa doa berlanjut ke ayat berikutnya. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
