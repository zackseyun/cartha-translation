  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: id
  text: Yahweh mendengarkan Hizkia dan menyembuhkan umat itu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendengar Hizkia.” Dalam konstruksi ini, kata kerja Ibrani tersebut dapat berarti “mendengar” atau “mendengarkan dan menanggapi dengan baik.”
    reason: lexical_alternative
  - marker: b
    text: “Menyembuhkan” dapat merujuk pada tindakan Yahweh menyingkirkan penderitaan atau hukuman yang berkaitan dengan keadaan ritual umat yang tidak semestinya, dan tidak harus terbatas pada kesembuhan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengarkan
  rationale: Dengan preposisi אֶל dan dalam konteks doa Hizkia pada ayat 18–19, verba שׁמע menyatakan bahwa Yahweh bukan sekadar mendengar secara indrawi, melainkan memperhatikan dan menanggapi dengan baik. Bentuk 'mendengarkan' tetap mempertahankan kaitan leksikal dengan tindakan mendengar tanpa menjelaskan tanggapan itu secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' agar nama pribadi Allah dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: אֶל
  choice: kepada (terungkap dalam konstruksi 'mendengarkan Hizkia')
  rationale: Dalam bahasa Indonesia, verba transitif 'mendengarkan' secara alami dapat langsung diikuti objek orang; makna relasional אֶל tetap terwakili tanpa menerjemahkan preposisinya secara kaku.
- source_word: יְחִזְקִיָּהוּ
  choice: Hizkia
  rationale: Dipakai bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיִּרְפָּא
  choice: menyembuhkan
  rationale: Verba רפא pada dasarnya berarti 'menyembuhkan'. Pilihan ini mempertahankan metafora dan keluasan makna teks, tanpa mempersempitnya menjadi hanya pengampunan, pelepasan dari hukuman, atau kesembuhan jasmani.
- source_word: הָעָם
  choice: umat itu
  rationale: עם menunjuk kepada komunitas Israel yang berkumpul dalam konteks perayaan Paskah. 'Umat itu' alami dalam bahasa Indonesia dan menandai kelompok yang telah disebut dalam konteks sebelumnya.
theological_decisions:
- issue: Sifat tindakan Yahweh dalam ungkapan 'menyembuhkan umat itu'
  choice: Mempertahankan bahasa penyembuhan tanpa membatasinya pada kesembuhan jasmani.
  alternative: Mengampuni umat itu; membebaskan umat itu dari hukuman; memulihkan umat itu.
  rationale: Konteks langsung berbicara tentang orang-orang yang makan Paskah tanpa pentahiran yang semestinya dan tentang doa Hizkia agar Yahweh mengampuni mereka. Namun, teks memakai רפא, 'menyembuhkan'. Karena itu, terjemahan mempertahankan istilah tersebut dan catatan kaki menjelaskan cakupan yang mungkin tanpa menghapus ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat singkat mengikuti struktur Ibrani. Nama 'Hizkia' memakai bentuk Indonesia yang lazim; 'Yahweh' mempertahankan nama ilahi. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkan.
