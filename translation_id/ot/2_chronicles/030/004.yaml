base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/004.yaml
  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: id
  text: Hal itu dipandang baik oleh raja dan oleh seluruh jemaah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Hal itu baik di mata raja dan di mata seluruh jemaah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: dipandang baik
  rationale: Bentuk wayyiqtol dari ישר dalam ungkapan evaluatif ini menunjukkan bahwa hal tersebut dinilai baik, patut, atau tepat. “Dipandang baik” alami dalam bahasa Indonesia dan tidak menyatakan bahwa hal itu benar secara mutlak.
- source_word: הַדָּבָר
  choice: hal itu
  rationale: דבר dapat berarti perkataan, perkara, atau hal. Dalam konteks ini, kata tersebut menunjuk pada keputusan atau rencana yang baru dibicarakan; “hal itu” tetap langsung dan tidak mempersempit maknanya menjadi “usul” atau “rencana” saja.
- source_word: בְּעֵינֵי
  choice: dipandang ... oleh
  rationale: Secara harfiah berarti “di mata,” suatu idiom Ibrani untuk penilaian. Bentuk “dipandang ... oleh” menyampaikan fungsi idiom itu secara alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung bagi nomina definit ini; kedefinitan sudah jelas dari konteks bahasa Indonesia.
- source_word: וּבְעֵינֵי
  choice: dan oleh
  rationale: Menghubungkan pihak kedua yang memberikan penilaian yang sama. Pengulangan idiom Ibrani diringkas secara wajar tanpa menghilangkan paralelisme maknanya.
- source_word: כָּל
  choice: seluruh
  rationale: Menyatakan cakupan menyeluruh atas jemaah.
- source_word: הַקָּהָל
  choice: jemaah
  rationale: קהל menunjuk pada komunitas yang berhimpun. “Jemaah” merupakan istilah Indonesia yang jelas dan bermartabat untuk himpunan umat dalam konteks ini, tanpa harus berarti lembaga gerejawi.
