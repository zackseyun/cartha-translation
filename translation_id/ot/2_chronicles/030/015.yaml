source:
  edition: WLC
  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: id
  text: Mereka menyembelih kurban Paskah[a] pada hari keempat belas bulan kedua. Lalu para imam dan orang Lewi merasa malu, menguduskan diri, dan membawa persembahan bakaran ke rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Paskah”; di sini yang dimaksud ialah hewan kurban Paskah.'
    reason: Menjelaskan bahwa istilah Ibrani menyebut “Paskah” tetapi dalam konteks ini secara konkret merujuk pada kurban yang disembelih.
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: mereka menyembelih
  rationale: Kata שׁחט menunjuk pada penyembelihan hewan, khususnya dalam konteks kurban; “menyembelih” mempertahankan nuansa ritualnya.
- source_word: הַפֶּסַח
  choice: kurban Paskah
  rationale: Secara harfiah berarti “Paskah”, tetapi dalam konteks ini menunjuk pada hewan kurban Paskah yang disembelih. “Kurban Paskah” jelas dan tidak membatasi hewan itu hanya pada anak domba.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: pada hari keempat belas bulan kedua
  rationale: Ungkapan penanggalan Ibrani ini diterjemahkan secara alami dalam bahasa Indonesia dengan menambahkan “hari” yang tersirat.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Istilah baku dan mudah dipahami bagi dua kelompok pelayan ibadah yang dibedakan dalam teks.
- source_word: נִכְלְמוּ
  choice: merasa malu
  rationale: Bentuk Niphal ini mengungkapkan rasa malu atau kehinaan; “merasa malu” paling alami dalam konteks tanggapan mereka.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: menguduskan diri
  rationale: Bentuk refleksif dari קדשׁ di sini menunjuk pada tindakan mempersiapkan atau mengkhususkan diri secara ritual untuk pelayanan kudus.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: membawa persembahan bakaran
  rationale: Terjemahan ini mempertahankan istilah kurban עֹלָה dan menyampaikan tindakan membawanya tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בֵּית יְהוָה
  choice: ke rumah Yahweh
  rationale: “Rumah Yahweh” mempertahankan sebutan formal tempat ibadah dalam teks Ibrani, sedangkan preposisinya secara alami diterjemahkan “ke”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna tindakan וַיִּתְקַדְּשׁוּ
  choice: menguduskan diri
  alternative: menyucikan diri; mempersiapkan diri secara ritual
  rationale: Pilihan ini mempertahankan bahasa kekudusan dan sifat refleksif tindakan itu tanpa menentukan secara lebih sempit tata cara ritual yang tidak dijabarkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat lancar bagi pembaca umum sambil mempertahankan istilah ritual “persembahan bakaran”, pembedaan antara imam dan orang Lewi, serta sebutan “rumah Yahweh”.
