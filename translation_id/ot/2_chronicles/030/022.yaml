  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: id
  text: Hizkia menguatkan hati semua orang Lewi[a] yang menunjukkan pengertian yang baik dalam pelayanan kepada Yahweh[b] dengan perkataannya. Mereka makan dalam perayaan itu selama tujuh hari sambil mempersembahkan kurban keselamatan[c] dan mengucap syukur kepada Yahweh[d], Allah nenek moyang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berbicara kepada hati semua orang Lewi.”'
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani ini juga dapat diterjemahkan “yang memiliki pengertian yang baik mengenai Yahweh” atau “yang cakap dalam hal-hal yang berkaitan dengan Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: “kurban keselamatan”; dapat juga dipahami sebagai “kurban persekutuan” atau “kurban kesejahteraan.”'
    reason: lexical_alternative
  - marker: d
    text: Kata kerjanya juga dapat berarti “mengaku” atau “memuji”; dalam konteks ini kemungkinan besar berarti mengucap syukur dalam ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: berbicara untuk menguatkan hati
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘berbicara kepada hati’, yakni berbicara dengan cara yang menguatkan atau membesarkan hati. Terjemahan ini mempertahankan citra ‘hati’ sekaligus menyampaikan fungsi idiomnya secara wajar dalam bahasa Indonesia.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Sebutan baku dalam bahasa Indonesia bagi kelompok suku dan pelayan ibadah ini.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב לַיהוָה
  choice: yang menunjukkan pengertian yang baik dalam pelayanan kepada Yahweh
  rationale: Bentuk partisip aktif dan nomina serumpun menekankan tindakan memperlihatkan kecakapan atau pengertian. Frasa dengan לַיהוָה kemungkinan menghubungkan kecakapan itu dengan pelayanan atau ibadah kepada Yahweh, tetapi catatan kaki mempertahankan keluasan relasinya.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד שִׁבְעַת הַיָּמִים
  choice: Mereka makan selama tujuh hari perayaan itu
  rationale: Susunan ini menghasilkan bahasa Indonesia yang wajar dan tetap mempertahankan tindakan makan, perayaan, serta jangka waktu tujuh hari. Objek Ibrani ‘perayaan’ dipahami sebagai makanan yang disantap dalam rangka perayaan, tanpa menambahkan rincian hidangan yang tidak dinyatakan.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: mempersembahkan kurban keselamatan
  rationale: Istilah ini menunjuk kategori kurban tertentu. ‘Kurban keselamatan’ cukup dikenal dalam bahasa Alkitab Indonesia, sedangkan catatan kaki mencantumkan alternatif yang menonjolkan persekutuan atau kesejahteraan.
- source_word: וּמִתְוַדִּים
  choice: mengucap syukur
  rationale: Dalam konteks perayaan dan persembahan, makna liturgis ‘mengucap syukur’ paling sesuai, tetapi verba yang sama dapat berarti mengaku atau memuji; ambiguitas itu dipertahankan dalam catatan kaki.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: Ungkapan Indonesia yang alami untuk Allah para leluhur mereka serta tetap membawa makna hubungan perjanjian antargenerasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri dan sesuai dengan kebijakan proyek.
- issue: Makna וּמִתְוַדִּים dalam kegiatan ibadah
  choice: mengucap syukur
  alternative: mengaku atau memuji
  rationale: Konteks perayaan dan kurban mendukung ucapan syukur, tetapi rentang makna verba tidak dipersempit secara diam-diam; alternatifnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kaku. Struktur kalimat dibuat mudah dipahami pembaca umum. Istilah kultis ‘kurban keselamatan’ dipertahankan dan dijelaskan melalui catatan kaki; nama ilahi ditulis ‘Yahweh’.
