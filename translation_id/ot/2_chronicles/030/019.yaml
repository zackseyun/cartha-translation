  text: כָּל לְבָב֣/וֹ הֵכִ֔ין לִ/דְר֛וֹשׁ הָ/אֱלֹהִ֥ים יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתָ֑י/ו וְ/לֹ֖א כְּ/טָהֳרַ֥ת הַ/קֹּֽדֶשׁ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: id
  text: setiap orang yang menetapkan hatinya untuk mencari Allah, Yahweh, Allah nenek moyangnya, sekalipun ia tidak memenuhi ketentuan pentahiran bagi tempat kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Suci.” Kata Ibrani קֹדֶשׁ di sini dapat menunjuk pada tempat kudus atau kawasan suci dalam konteks ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: setiap orang yang ... hatinya
  rationale: כָּל dengan bentuk tunggal bersufiks berfungsi distributif. Susunan ini mempertahankan acuan kepada tiap-tiap orang dan tetap wajar dalam bahasa Indonesia.
- source_word: הֵכִין
  choice: menetapkan
  rationale: Bentuk Hifil dari כון dalam ungkapan tentang hati menyatakan tindakan mengarahkan atau memantapkan hati dengan sengaja; “menetapkan hatinya” mempertahankan idiom batiniah tersebut.
- source_word: לִדְרוֹשׁ
  choice: untuk mencari
  rationale: דרש dengan Allah sebagai objek mencakup mencari-Nya dalam ibadah, pengabdian, atau permohonan petunjuk. “Mencari” mempertahankan keluasan makna itu.
- source_word: הָאֱלֹהִים יְהוָה
  choice: Allah, yaitu Yahweh
  rationale: Rangkaian ini bersifat apositif dan mengidentifikasi Allah yang dicari sebagai Yahweh. “Yaitu” membuat hubungan tersebut jelas tanpa menghapus kedua unsur Ibraninya.
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: Allah leluhurnya
  rationale: Akhiran tunggal sesuai dengan konstruksi distributif sebelumnya. “Leluhurnya” menyampaikan hubungan dengan para pendahulu dalam perjanjian secara alami.
- source_word: וְלֹא
  choice: sekalipun ... tidak
  rationale: 'Kata penghubung ini dipahami secara konsesif: kesungguhan mencari Allah tetap dinyatakan berdampingan dengan ketidakpatuhan terhadap ketentuan pentahiran.'
- source_word: כְּטָהֳרַת
  choice: memenuhi ketentuan pentahiran bagi
  rationale: כְּ menyatakan kesesuaian dengan suatu patokan, sedangkan טָהֳרָה menunjuk pada pentahiran ritual. Ungkapan ini menyampaikan adanya standar kultis tanpa menjelaskan lebih jauh daripada teks.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Dalam konteks perayaan kultis ini, קֹדֶשׁ kemungkinan menunjuk pada tempat atau lingkup kudus. “Tempat kudus” cukup transparan, sementara kemungkinan “Bait Suci” dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Kesungguhan hati dan ketidakmurnian ritual
  choice: Keduanya dipertahankan dalam hubungan konsesif
  alternative: Menonjolkan salah satunya atau menjelaskan bahwa kesungguhan meniadakan persyaratan ritual
  rationale: Bahasa Ibrani menempatkan pencarian Allah yang disengaja berdampingan dengan kegagalan memenuhi patokan pentahiran. Terjemahan tidak menyelesaikan ketegangan teologis tersebut.
- issue: Acuan הַקֹּדֶשׁ
  choice: tempat kudus
  alternative: Bait Suci, hal kudus, atau upacara kudus
  rationale: Konteks kultis mendukung acuan tempat suci, tetapi istilah Ibraninya tetap memiliki keluasan tertentu; alternatif utama dicatat tanpa dipaksakan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Karena ayat ini melanjutkan doa dari ayat sebelumnya, teks dipertahankan sebagai klausa yang diawali huruf kecil. Istilah “pentahiran” dipakai untuk menandai konteks ritual, bukan kebersihan biasa.
