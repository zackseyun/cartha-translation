  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י לֹ֧א יָכְל֛וּ לַ/עֲשֹׂת֖/וֹ בָּ/עֵ֣ת הַ/הִ֑יא כִּ֤י הַ/כֹּהֲנִים֙ לֹֽא הִתְקַדְּשׁ֣וּ לְ/מַ דַּ֔י וְ/הָ/עָ֖ם לֹא נֶאֶסְפ֥וּ לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: id
  text: Sebab pada waktu itu mereka tidak dapat merayakannya, karena belum cukup banyak imam yang menguduskan diri[a], dan rakyat belum berkumpul di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para imam belum cukup menguduskan diri.” Ungkapan Ibraninya dapat menunjuk pada jumlah imam yang belum mencukupi atau pada pengudusan mereka yang belum memadai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: dapat
  rationale: Kata kerja ini menyatakan kemampuan; bentuk negatifnya diterjemahkan secara alami sebagai 'tidak dapat'.
- source_word: לַעֲשֹׂתוֹ
  choice: merayakannya
  rationale: Dalam konteks ayat sebelumnya, pronomina ini merujuk pada perayaan Paskah. Terjemahan eksplisit ini lebih alami daripada 'melakukannya' dalam bahasa Indonesia.
- source_word: בָּעֵת הַהִיא
  choice: pada waktu itu
  rationale: Ungkapan ini menunjuk pada waktu tertentu ketika Paskah semestinya dirayakan tanpa menambahkan gagasan 'waktu yang ditetapkan' secara eksplisit.
- source_word: הִתְקַדְּשׁוּ
  choice: menguduskan diri
  rationale: Dalam konteks keimaman, bentuk hitpael ini menunjuk pada persiapan atau pengudusan diri secara ritual.
- source_word: לְמַדַּי
  choice: belum cukup banyak
  rationale: 'Dalam konteks ini, ungkapan mengenai kecukupan paling wajar dipahami secara numerik: jumlah imam yang telah menguduskan diri belum mencukupi. Kemungkinan bahwa pengudusan mereka belum memadai tetap dicatat dalam catatan kaki.'
- source_word: נֶאֶסְפוּ
  choice: berkumpul
  rationale: Nifal di sini secara alami menyatakan bahwa rakyat berhimpun untuk perayaan.
- source_word: לִירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Walaupun preposisinya secara harfiah dapat menyatakan arah 'ke', bersama kata 'berkumpul' bahasa Indonesia secara alami memakai 'di' untuk lokasi perhimpunan; alternatif literal dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan לְמַדַּי terhadap pengudusan para imam
  choice: belum cukup banyak imam yang menguduskan diri
  alternative: para imam belum cukup menguduskan diri
  rationale: Bahasa Ibrani padat dan memungkinkan pengertian jumlah maupun tingkat kecukupan. Konteks kebutuhan akan imam untuk perayaan mendukung pembacaan numerik, tetapi ambiguitasnya dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Rakyat' dipakai untuk הָעָם, sedangkan 'merayakannya' memperjelas rujukan kontekstual kepada Paskah.
