  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: id
  text: Orang-orang Israel yang berada di Yerusalem merayakan Hari Raya Roti Tidak Beragi selama tujuh hari dengan sukacita yang besar. Hari demi hari, orang-orang Lewi dan para imam memuji Yahweh dengan alat-alat musik yang kuat bunyinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan alat-alat kekuatan bagi Yahweh”; frasa Ibraninya juga dapat dipahami sebagai “dengan alat-alat musik yang nyaring.”
    reason: Frasa בִּכְלֵי עֹז לַיהוָה tidak lazim; catatan ini mempertahankan gambaran harfiah dan alternatif leksikal yang mungkin.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: merayakan
  rationale: Dalam gabungan dengan חַג, verba עשה berarti melaksanakan atau merayakan suatu hari raya; pilihan ini alami dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan harfiahnya adalah 'anak-anak Israel', tetapi dalam narasi ini menunjuk kepada bangsa atau umat Israel. 'Orang-orang Israel' jelas, wajar, dan tidak mempersempit rujukannya kepada laki-laki saja.
- source_word: הַנִּמְצְאִים
  choice: yang berada
  rationale: Partisipel מצא secara harfiah berkaitan dengan 'didapati', tetapi di sini menyatakan orang-orang yang hadir atau berada di Yerusalem.
- source_word: חַג הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: Ini nama baku dan mudah dikenali bagi perayaan Israel tersebut.
- source_word: בְשִׂמְחָה גְדוֹלָה
  choice: dengan sukacita yang besar
  rationale: Menyampaikan secara langsung intensitas frasa Ibrani dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: יוֹם בְּיוֹם
  choice: hari demi hari
  rationale: Menjaga daya distributif idiom Ibrani, yakni tindakan yang berlangsung setiap hari sepanjang perayaan.
- source_word: בִּכְלֵי עֹז
  choice: dengan alat-alat musik yang kuat bunyinya
  rationale: כְּלִים dalam konteks pujian dipahami sebagai alat musik, sedangkan עֹז menyatakan kekuatan. Karena frasa Ibraninya tidak lazim dan dapat dipahami dengan beberapa cara, terjemahan utama memakai ungkapan Indonesia yang masuk akal dan catatan kaki mempertahankan arti harfiah serta alternatifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah Israel; 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Hubungan frasa בִּכְלֵי עֹז לַיהוָה dengan tindakan memuji
  choice: memuji Yahweh dengan alat-alat musik yang kuat bunyinya
  alternative: memuji dengan alat-alat kekuatan bagi Yahweh
  rationale: Susunan kalimat paling wajar menghubungkan alat-alat itu dengan tindakan memuji Yahweh. Namun, nuansa tepat עֹז dan fungsi לְ tetap tidak sepenuhnya pasti, sehingga bentuk lebih harfiah dicatat tanpa menjadikannya dasar kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'orang-orang Israel' dan 'yang berada' dipilih daripada terjemahan sangat harfiah yang terdengar kaku. Tanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
