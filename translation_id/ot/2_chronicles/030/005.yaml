reference: 2 Chronicles 30:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: id
  text: Maka mereka menetapkan suatu keputusan untuk menyebarkan pengumuman di seluruh Israel, dari Bersyeba sampai Dan, agar orang-orang datang ke Yerusalem untuk merayakan Paskah bagi Yahweh, Allah Israel. Sebab mereka belum merayakannya dalam jumlah besar sesuai dengan yang tertulis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani pada bagian akhir ayat ini ringkas dan dapat juga dipahami, “sebab hanya sedikit orang yang merayakannya sesuai dengan yang tertulis.” Penekanannya mungkin terletak pada sedikitnya jumlah peserta atau pada kegagalan merayakannya menurut ketentuan tertulis.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: mereka menetapkan keputusan
  rationale: Ungkapan harfiahnya, 'membuat suatu perkara berdiri', dalam konteks ini menunjuk pada penetapan keputusan resmi.
- source_word: לְהַעֲבִיר קוֹל
  choice: untuk menyebarkan pengumuman
  rationale: Secara harfiah berarti 'membuat suara lewat'; dalam konteks administratif, maksudnya ialah mengedarkan pengumuman kepada khalayak.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: ke seluruh Israel
  rationale: Pilihan ini menyatakan cakupan penyebaran pengumuman di seluruh wilayah Israel.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: dari Bersyeba sampai Dan
  rationale: Nama tempat dipertahankan; rangkaian ini merupakan merisme geografis dari selatan sampai utara.
- source_word: לָבוֹא
  choice: agar orang-orang datang
  rationale: Infinitif ini menyatakan isi atau tujuan pengumuman; subjek umum dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: untuk merayakan Paskah
  rationale: Kata עשה secara harfiah berarti 'melakukan/membuat', tetapi bersama פֶּסַח menunjuk pada pelaksanaan atau perayaan Paskah.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan orientasi perayaan kepada atau bagi Yahweh; nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi ini secara wajar diterjemahkan 'Allah Israel'.
- source_word: בִּירוּשָׁלִָם
  choice: ke Yerusalem
  rationale: Yerusalem adalah tujuan kedatangan; penempatan frasa ini bersama verba 'datang' menghasilkan susunan Indonesia yang alami.
- source_word: כִּי לֹא לָרֹב עָשׂוּ
  choice: Sebab, sebelumnya mereka tidak merayakannya dalam jumlah besar
  rationale: לָרֹב paling langsung menyatakan kuantitas atau banyaknya peserta, bukan lamanya waktu. 'Sebelumnya' menjelaskan aspek tindakan lampau dari konteks tanpa menjadikan לָרֹב ungkapan temporal.
- source_word: כַּכָּתוּב
  choice: sesuai dengan yang tertulis
  rationale: Frasa ini menunjuk pada kesesuaian dengan ketentuan tertulis, kemungkinan besar hukum mengenai Paskah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi dan mengikuti lapisan konsultasi yang telah diselaraskan.
- issue: Hubungan sintaksis לָרֹב dan כַּכָּתוּב
  choice: jumlah peserta sedikit, dengan perayaan diukur menurut ketentuan tertulis
  alternative: mereka sudah lama tidak merayakannya sesuai dengan yang tertulis; atau hanya sedikit orang yang merayakannya sesuai dengan yang tertulis
  rationale: Bahasa Ibrani padat dan memungkinkan perbedaan penekanan. Arti kuantitatif לָרֹב dipertahankan dalam teks utama, sedangkan kemungkinan hubungan sintaksis alternatif dicatat tanpa meniadakan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Menetapkan keputusan' dan 'menyebarkan pengumuman' mempertahankan sifat resmi tindakan tersebut. Penanda kaki [a] ditempatkan pada klausa yang ambigu.
