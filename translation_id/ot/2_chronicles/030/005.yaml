  - severity: low
    issue: Penambahan kata “sebelumnya”
    rationale: Kata ini bukan padanan eksplisit unsur Ibrani. Klausa Ibrani cukup menyatakan bahwa perayaan itu belum dilakukan dalam jumlah besar; penghapusan ini mengurangi penambahan yang tidak perlu.
