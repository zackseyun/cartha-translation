  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: id
  text: Di Yehuda juga tangan Allah ada pada mereka untuk memberi mereka satu hati[a] agar mereka melaksanakan perintah raja dan para pejabat sesuai dengan firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hati yang bersatu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: Di Yehuda juga
  rationale: Mempertahankan fungsi aditif גַּם dan makna lokatif preposisi ב dalam susunan Indonesia yang alami.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: tangan Allah bekerja atas mereka
  rationale: Mempertahankan citra Ibrani tentang tangan Allah sekaligus memperjelas bahwa ungkapan itu menunjuk pada kuasa atau pengaruh ilahi yang aktif; unsur 'atas mereka' tersirat dari לָהֶם dan konteks.
- source_word: לָתֵת לָהֶם
  choice: untuk memberi mereka
  rationale: Menyampaikan infinitif tujuan secara langsung dan alami.
- source_word: לֵב אֶחָד
  choice: satu hati
  rationale: Mempertahankan metafora harfiah yang menyatakan kesatuan tekad, tanpa menggantinya dengan tafsiran 'satu pikiran'.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: sehingga mereka melaksanakan perintah
  rationale: Konstruksi tujuan/hasil diterjemahkan secara alami; 'melaksanakan perintah' menyampaikan ketaatan nyata dalam konteks kerajaan dan administrasi.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: raja dan para pejabat
  rationale: שָּׂרִים menunjuk para pemimpin atau pejabat; 'para pejabat' jelas dan sesuai dengan konteks administratif.
- source_word: בִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Menunjukkan bahwa perintah raja dan para pejabat selaras dengan firman Yahweh, bukan sekadar disampaikan melalui firman itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi daripada menggantinya dengan gelar.
theological_decisions:
- issue: Sifat tindakan ilahi dalam ungkapan 'tangan Allah'
  choice: Menyatakan tindakan aktif Allah yang menghasilkan kesatuan hati tanpa menjelaskan mekanisme teologisnya lebih lanjut.
  alternative: Melemahkannya menjadi 'Allah menolong mereka' atau memperkuatnya menjadi rumusan deterministis yang eksplisit.
  rationale: Teks menghubungkan kesatuan tanggapan umat dengan tindakan Allah, tetapi tidak merumuskan mekanisme atau kategori doktrinal lebih lanjut.
- issue: Hubungan perintah kerajaan dengan firman Yahweh
  choice: Menerjemahkan בִּדְבַר sebagai 'sesuai dengan firman Yahweh'.
  alternative: Menerjemahkannya 'melalui firman Yahweh' atau 'atas firman Yahweh'.
  rationale: Dalam konteks ini, frasa tersebut paling wajar menunjukkan keselarasan perintah raja dan para pejabat dengan firman Yahweh, sambil mengakui bahwa preposisi ב dapat memiliki nuansa yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Metafora 'tangan Allah' dan 'satu hati' dipertahankan, dengan sedikit penyesuaian idiomatis agar mudah dipahami pembaca umum.
