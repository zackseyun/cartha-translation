base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: id
  text: Mereka bangkit lalu menyingkirkan mezbah-mezbah yang ada di Yerusalem. Mereka juga menyingkirkan semua mezbah dupa[a] dan melemparkannya ke Lembah Kidron[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua tempat pembakaran dupa” atau “semua penyangga dupa”. Istilah Ibrani ini menunjuk pada sarana peribadatan yang digunakan untuk membakar dupa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “wadi Kidron”; istilah Ibraninya dapat menunjuk pada lembah atau jurang yang dialiri air, sering kali secara musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Mereka bangkit
  rationale: Bentuk dari קום ini mengawali tindakan tegas dalam rangkaian narasi. “Bangkit” mempertahankan gerak naratif Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: menyingkirkan
  rationale: Bentuk kausatif dari סור berarti membuang atau menyingkirkan sesuatu dari tempatnya. “Menyingkirkan” sesuai dengan tindakan pembersihan sarana peribadatan di sini dan dapat dipakai secara konsisten untuk kedua kemunculannya.
- source_word: הַמִּזְבְּחוֹת
  choice: mezbah-mezbah
  rationale: Kata ini adalah bentuk jamak biasa dari מִזְבֵּחַ, “mezbah”. Pengulangan bentuk jamak memperjelas jumlah tanpa mempersempit jenis mezbah melebihi yang dinyatakan teks.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: yang ada di Yerusalem
  rationale: Klausa relatif dipertahankan secara eksplisit dan diterjemahkan dengan susunan alami dalam bahasa Indonesia.
- source_word: הַמְקַטְּרוֹת
  choice: mezbah dupa
  rationale: Kata yang berkaitan dengan akar קטר, “membakar dupa”, menunjuk pada sarana kultis untuk pembakaran dupa. “Mezbah dupa” jelas dan alami, sementara cakupan istilah Ibraninya yang mungkin lebih luas dicatat dalam catatan kaki.
- source_word: וַיַּשְׁלִיכוּ
  choice: melemparkannya
  rationale: שׁלך berarti melempar atau mencampakkan. Pilihan ini mempertahankan tindakan pembuangan yang kuat; akhiran “-nya” secara alami merujuk pada seluruh sarana yang baru disebut.
- source_word: לְנַחַל קִדְרוֹן
  choice: ke Lembah Kidron
  rationale: נחל dapat berarti lembah, jurang beralur air, atau aliran air musiman. “Lembah Kidron” mudah dipahami secara geografis, sedangkan alternatifnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bangkit” mempertahankan corak naratif tanpa menjadi terlalu arkais. Penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskannya.
