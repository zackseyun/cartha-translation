base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: id
  text: Para pembawa pesan[a] itu pun pergi dari kota ke kota di wilayah Efraim dan Manasye, sampai ke Zebulon. Namun, orang-orang terus menertawakan dan mencemooh mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para pelari”; yang dimaksud ialah para petugas pembawa pesan, kemungkinan besar orang-orang yang bepergian dengan cepat.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani memakai dua kata kerja penghinaan: mereka “menertawakan” para pembawa pesan itu dan “mencemooh” mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: para pembawa pesan
  rationale: Secara harfiah istilah ini berkaitan dengan orang-orang yang berlari, tetapi dalam konteks ini menunjuk kepada petugas yang membawa pesan resmi dengan cepat. “Pembawa pesan” alami dan jelas dalam bahasa Indonesia.
- source_word: עֹבְרִים
  choice: pergi
  rationale: Partisip ini menggambarkan perjalanan mereka melintasi daerah itu. “Pergi” menghasilkan narasi Indonesia yang wajar, sedangkan frasa “dari kota ke kota” sudah menyampaikan gerak yang berulang.
- source_word: מֵעִיר לָעִיר
  choice: dari kota ke kota
  rationale: Ungkapan ini mempertahankan makna distributif, yaitu perjalanan berulang dari satu kota ke kota lain.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: di wilayah Efraim dan Manasye, sampai ke Zebulon
  rationale: “Wilayah” menyampaikan arti geografis אֶרֶץ dalam konteks ini, dan “sampai ke” mencerminkan וְעַד dengan jelas.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: terus menertawakan mereka
  rationale: Bentuk ini menyatakan tawa yang merendahkan, bukan kegembiraan biasa. “Terus” membantu mempertahankan nuansa tindakan yang sedang atau berulang dalam konstruksi היה dengan partisip.
- source_word: וּמַלְעִגִים בָּם
  choice: mencemooh mereka
  rationale: Kata לעג menyatakan ejekan penuh penghinaan. “Mencemooh” mempertahankan kekuatan maknanya serta membedakannya dari “menertawakan”.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: itu pun ... Namun, orang-orang terus
  rationale: “Pun” melanjutkan alur narasi, sedangkan “Namun” mengungkapkan kontras kontekstual antara perjalanan para pembawa pesan dan tanggapan penduduk. Subjek tersirat pada klausa kedua dijelaskan sebagai “orang-orang” agar rujukannya tidak membingungkan dalam bahasa Indonesia.
