source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: id
  text: 'Maka para kurir berangkat membawa surat-surat dari raja dan para pejabatnya ke seluruh Israel dan Yehuda, sesuai dengan perintah raja, dengan pesan: “Hai keturunan Israel, kembalilah kepada Yahweh, Allah Abraham, Ishak, dan Israel[a], supaya Ia kembali kepada sisa yang telah lolos dari tangan raja-raja Asyur dan masih tersisa bagi kalian[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Israel”, bukan “Yakub” yang lebih lazim dalam rangkaian nama ini.
    reason: alternative_reading
  - marker: b
    text: 'Dapat juga diterjemahkan: “sisa yang telah lolos, yang masih tersisa bagi kalian.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הָרָצִים
  choice: para kurir
  rationale: Secara harfiah bentuk ini menunjuk kepada para pelari, tetapi dalam konteks pembawa surat kerajaan fungsi mereka adalah kurir. Istilah ini alami dalam bahasa Indonesia modern.
- source_word: בָּאִגְּרוֹת
  choice: membawa surat-surat
  rationale: Preposisi ב dipahami secara instrumental/asosiatif. Terjemahan ini menyampaikan bahwa para kurir membawa dokumen tertulis kerajaan.
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: dari raja dan para pejabatnya
  rationale: Ungkapan 'dari tangan' merupakan idiom asal atau pemberian wewenang. Bahasa Indonesia lebih alami memakai 'dari', sedangkan שָׂרָיו dalam konteks pemerintahan diterjemahkan 'para pejabatnya'.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: ke seluruh Israel dan Yehuda
  rationale: Preposisi dan konteks gerak para kurir menunjukkan cakupan perjalanan mereka di seluruh kedua wilayah.
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: sesuai dengan perintah raja
  rationale: מִצְוָה di sini adalah perintah kerajaan, bukan istilah teknis untuk perintah ilahi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini merupakan sebutan kolektif bagi umat yang berasal dari Israel. 'Keturunan Israel' lebih wajar dan tidak disalahpahami sebagai anak-anak kecil.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: kembalilah kepada Yahweh
  rationale: שׁוב menyatakan tindakan kembali atau berbalik kepada Allah dan sengaja dipadankan dengan tindakan Yahweh pada klausa berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Allah Abraham, Ishak, dan Israel
  rationale: Teks Ibrani secara eksplisit memakai 'Israel', bukan 'Yakub', sehingga bentuk yang kurang lazim ini dipertahankan.
- source_word: וְיָשֹׁב
  choice: supaya Ia kembali
  rationale: Bentuk verba sesudah imperatif dapat menyatakan hasil atau tujuan. 'Supaya' mempertahankan nuansa harapan/kemungkinan tanpa mengubahnya menjadi janji tanpa syarat, sementara 'kembali' menjaga permainan timbal balik dengan שׁוּבוּ.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: kaum tersisa yang telah lolos ... dan masih ada bagi kalian
  rationale: 'Terjemahan ini mempertahankan kedua unsur: kelompok yang lolos dari bencana (פְּלֵיטָה) dan yang tetap tersisa (נִּשְׁאֶרֶת), serta tidak menghilangkan לָכֶם.'
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: dari cengkeraman raja-raja Asyur
  rationale: כַּף secara harfiah berarti telapak tangan, tetapi dalam ungkapan ini melambangkan kuasa yang menindas. 'Cengkeraman' menyampaikan citra dan maknanya secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Transliterasi mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Nama leluhur terakhir dalam rumusan 'Abraham, Ishak, dan Israel'
  choice: Israel
  alternative: Yakub
  rationale: Walaupun rumusan dengan 'Yakub' lebih dikenal, naskah sumber berbunyi יִשְׂרָאֵל. Terjemahan tidak mengharmonisasikannya dengan rumusan yang lebih lazim.
- issue: Hubungan antara kembalinya umat dan kembalinya Yahweh
  choice: supaya Ia kembali
  alternative: dan Ia akan kembali
  rationale: Bentuk Ibrani memungkinkan nuansa tujuan, hasil, atau harapan sesudah imperatif. Pilihan ini tidak mengubahnya menjadi pernyataan kepastian tanpa syarat dan tetap mempertahankan hubungan timbal balik yang disengaja.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Para kurir' dipilih untuk konteks administrasi kerajaan; 'keturunan Israel' menghindari kesan bahwa sapaan hanya ditujukan kepada anak-anak; struktur timbal balik 'kembalilah ... supaya Ia kembali' dipertahankan. Semua penanda catatan kaki ditempatkan tepat pada bagian teks yang dijelaskannya.
