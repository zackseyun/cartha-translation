revisions:
- from: Maka para kurir berangkat membawa surat-surat dari raja dan para pejabatnya ke seluruh Israel dan Yehuda, sesuai dengan perintah raja. Isi surat itu berbunyi, “Hai keturunan Israel, kembalilah kepada Yahweh, Allah Abraham, Ishak, dan Israel[a], supaya Ia kembali kepada kaum tersisa yang telah lolos dari cengkeraman raja-raja Asyur dan masih ada bagi kalian[b].”
  to: 'Maka para kurir berangkat membawa surat-surat dari raja dan para pejabatnya ke seluruh Israel dan Yehuda, sesuai dengan perintah raja, dengan pesan: “Hai keturunan Israel, kembalilah kepada Yahweh, Allah Abraham, Ishak, dan Israel[a], supaya Ia kembali kepada sisa yang telah lolos dari tangan raja-raja Asyur dan masih tersisa bagi kalian[b].”'
  rationale: Revisi hanya memperbaiki penempatan penanda catatan kaki, memperjelas hubungan “telah lolos” dengan “dari tangan raja-raja Asyur”, dan mendekatkan pengantar ujaran kepada konstruksi sumber. Makna, ambiguitas nuansa tujuan/hasil dalam “supaya Ia kembali”, serta istilah utama tetap dipertahankan.
