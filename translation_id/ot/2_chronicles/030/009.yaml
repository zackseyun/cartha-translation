base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: id
  text: Sebab, ketika kalian kembali kepada Yahweh, saudara-saudara laki-laki dan putra-putra kalian akan mendapat belas kasihan di hadapan orang-orang yang menawan mereka dan kembali ke negeri ini. Sebab Yahweh, Allah kalian, pengasih dan penyayang. Ia tidak akan memalingkan wajah-Nya dari kalian jika kalian kembali kepada-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְשׁוּבְכֶם עַל יְהוָה
  choice: jika kalian kembali kepada Yahweh
  rationale: Kata שׁוּב menyatakan tindakan kembali kepada kesetiaan perjanjian. Bentuk bersyarat “jika” sesuai dengan hubungan logis ayat ini dan selaras dengan אִם pada akhir ayat; “kembali” juga mempertahankan pengulangan akar Ibrani tersebut.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: saudara-saudara laki-laki dan anak-anak lelaki kalian
  rationale: Terjemahan ini mempertahankan bentuk kekerabatan maskulin yang secara eksplisit terdapat dalam teks Ibrani, tanpa memperluasnya menjadi istilah netral gender.
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: akan memperoleh belas kasihan dari para penawan mereka
  rationale: Ungkapan ini berarti bahwa mereka akan menjadi penerima belas kasihan di hadapan atau dari pihak yang telah menawan mereka. Bentuk Indonesia ini menyampaikan relasi tersebut secara alami.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: sehingga mereka dapat kembali ke negeri ini
  rationale: Infinitif ini menyatakan hasil atau tujuan dari belas kasihan para penawan. “Sehingga” memperjelas hubungan itu tanpa menentukan apakah kepulangan tersebut sepenuhnya aktif atau diizinkan oleh para penawan.
- source_word: חַנּוּן וְרַחוּם
  choice: penuh rahmat dan belas kasihan
  rationale: Pasangan ungkapan ini menggambarkan Yahweh sebagai pemberi anugerah dan sebagai Pribadi yang berbelas kasih; kedua unsur dipertahankan tanpa dilebur menjadi satu sifat.
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: Ia tidak akan memalingkan wajah-Nya dari kalian
  rationale: Terjemahan ini mempertahankan gambaran wajah dalam idiom Ibrani, yang menyatakan penerimaan dan perhatian relasional.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: jika kalian kembali kepada-Nya
  rationale: Pengulangan “kembali” mempertahankan pengulangan שׁוּב dan tema pertobatan sebagai pemulihan hubungan.
theological_decisions:
- issue: Makna pertobatan dalam pengulangan שׁוּב
  choice: kembali kepada Yahweh / kembali kepada-Nya
  alternative: berpaling kepada Yahweh / berbalik kepada-Nya
  rationale: “Kembali” menjaga motif pemulihan kesetiaan perjanjian serta pengulangan kata dalam teks, tanpa memasukkan istilah teologis yang tidak dinyatakan secara langsung.
- issue: Istilah kekerabatan maskulin
  choice: saudara-saudara laki-laki dan anak-anak lelaki
  alternative: saudara-saudara dan anak-anak
  rationale: Teks sumber secara khusus memakai kata maskulin “saudara laki-laki” dan “anak lelaki”; terjemahan utama mempertahankan bentuk tersebut meskipun kelompok historis yang lebih luas mungkin juga mencakup anggota keluarga lainnya.
- issue: Relasi antara belas kasihan para penawan dan kepulangan
  choice: sehingga mereka dapat kembali
  alternative: dan mereka akan kembali
  rationale: Infinitif Ibrani dapat mengandung nuansa hasil atau tujuan. “Sehingga” menyatakan hubungan yang paling wajar dalam konteks, tetapi tidak menambahkan klaim bahwa para penawan sendiri membawa mereka pulang.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti jamak “kalian” dipakai karena sapaan Ibrani berbentuk jamak. Nama ilahi ditransliterasikan sebagai “Yahweh,” dan citra wajah dipertahankan karena penting bagi nuansa relasional ayat.
