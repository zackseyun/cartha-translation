  text: וַ/תְּהִ֥י שִׂמְחָֽה גְדוֹלָ֖ה בִּֽ/ירוּשָׁלִָ֑ם כִּ֠י מִ/ימֵ֞י שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל לֹ֥א כָ/זֹ֖את בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: id
  text: Maka ada sukacita besar di Yerusalem, sebab sejak zaman Salomo anak Daud, raja Israel, belum pernah terjadi hal seperti itu di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: Maka ada
  rationale: Bentuk wayyiqtol dari היה melanjutkan alur narasi sekaligus menyatakan hasil dari peristiwa sebelumnya; “Maka ada” mempertahankan hubungan itu secara wajar dalam bahasa Indonesia.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: sukacita besar
  rationale: Gabungan nomina dan adjektiva ini menyatakan sukacita yang sangat besar, dengan nuansa emosional dan komunal tanpa mempersempitnya menjadi sekadar perayaan.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi ב berfungsi lokatif; “di Yerusalem” merupakan padanan baku dan alami.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pernyataan tentang sukacita besar.
- source_word: מִימֵי
  choice: sejak zaman
  rationale: Ungkapan ini menunjukkan rentang waktu yang bermula pada masa lampau dan menjadi titik pembanding hingga peristiwa kini; “zaman” lebih alami daripada “hari-hari” dalam konteks pemerintahan Salomo.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: Salomo anak Daud
  rationale: Hubungan konstruksi Ibrani diterjemahkan langsung dan ringkas dengan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Frasa ini merupakan keterangan aposisi yang mengidentifikasi Salomo dan tidak memerlukan kata sandang dalam bahasa Indonesia.
- source_word: לֹא כָזֹאת
  choice: belum pernah terjadi hal seperti itu
  rationale: Secara harfiah berarti “tidak seperti ini”; verba “terjadi” dilengkapi dari konteks agar perbandingan temporalnya jelas dan alami dalam bahasa Indonesia.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Pengulangan keterangan tempat dipertahankan untuk menjaga pembingkaian dan penekanan retoris teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan pengulangan “di Yerusalem” dari teks sumber, sementara “sejak zaman” dan “belum pernah terjadi” menyampaikan perbandingan temporal secara alami.
