  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: id
  text: Namun, beberapa orang dari Asyer, Manasye, dan Zebulon merendahkan diri dan datang ke Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Dalam konteks ini, partikel tersebut menyatakan pertentangan dengan penolakan dan ejekan pada ayat sebelumnya. “Namun” menyampaikan kontras itu secara alami tanpa memberi arti pembatas seperti “hanya”.
- source_word: אֲנָשִׁים
  choice: beberapa orang
  rationale: Nomina maskulin jamak ini menunjuk pada sejumlah orang yang tidak ditentukan dari suku-suku tersebut. Dalam bahasa Indonesia, “beberapa orang” paling alami dan tidak perlu menambahkan “laki-laki” jika jenis kelamin bukan pokok pernyataan.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: dari Asyer, Manasye, dan Zebulon
  rationale: Preposisi menandai asal mereka dari ketiga suku atau wilayah tersebut; bentuk nama mengikuti ejaan Alkitab bahasa Indonesia yang lazim.
- source_word: נִכְנְעוּ
  choice: merendahkan diri
  rationale: Bentuk nifal dari כנע dalam konteks tanggapan sukarela terhadap undangan raja menyatakan bahwa mereka merendahkan diri, bukan semata-mata ditundukkan oleh pihak lain.
- source_word: וַיָּבֹאוּ
  choice: dan datang
  rationale: Kata בוא dalam rangkaian naratif ini menyatakan gerak menuju Yerusalem; “datang” merupakan padanan langsung dan alami.
- source_word: לִירוּשָׁלִָם
  choice: ke Yerusalem
  rationale: Preposisi ל menandai tujuan gerak, dan “Yerusalem” adalah bentuk nama tempat yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah נִכְנְעוּ menyatakan tindakan sukarela atau keadaan pasif?
  choice: merendahkan diri
  alternative: ditundukkan / menjadi rendah hati
  rationale: Bentuk nifal dapat memiliki nuansa refleksif atau pasif. Tindakan berikutnya—datang ke Yerusalem—mendukung nuansa refleksif dan sukarela, tetapi terjemahan tidak menambahkan motif teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan kontras pembuka, asal kelompok, lalu dua tindakan berurutan. Tidak diperlukan catatan kaki karena tidak ada ambiguitas yang perlu dijelaskan kepada pembaca umum.
