  text: וְ/אַל תִּֽהְי֗וּ כַּ/אֲבֽוֹתֵי/כֶם֙ וְ/כַ֣/אֲחֵי/כֶ֔ם אֲשֶׁ֣ר מָעֲל֔וּ בַּ/יהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וַ/יִּתְּנֵ֣/ם לְ/שַׁמָּ֔ה כַּ/אֲשֶׁ֖ר אַתֶּ֥ם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: id
  text: Janganlah kamu menjadi seperti nenek moyangmu dan saudara-saudaramu, yang tidak setia kepada Yahweh, Allah nenek moyang mereka, dan Dia menjadikan mereka tontonan yang mengerikan[a], seperti yang kamu lihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehancuran” atau “sasaran keheranan”; istilah Ibrani ini dapat menunjuk pada kehancuran maupun pada keadaan atau tontonan yang mengerikan atau mengundang keheranan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: Janganlah kamu seperti
  rationale: Larangan אַל dengan bentuk imperfek dinyatakan secara alami dalam bahasa Indonesia; verba penghubung tidak perlu diterjemahkan secara eksplisit sebelum frasa perbandingan.
- source_word: כַאֲבוֹתֵיכֶם
  choice: seperti nenek moyangmu
  rationale: אָבוֹת di sini menunjuk generasi terdahulu; “nenek moyang” lebih jelas dan alami daripada “bapak-bapakmu” dalam bahasa Indonesia modern.
- source_word: וְכַאֲחֵיכֶם
  choice: dan saudara-saudaramu
  rationale: אָח dapat mencakup saudara atau kaum kerabat. “Saudara-saudaramu” mempertahankan bahasa kekeluargaan dan solidaritas umat tanpa mempersempitnya menjadi saudara kandung.
- source_word: מָעֲלוּ בַּיהוָה
  choice: berlaku tidak setia kepada Yahweh
  rationale: מעל menyatakan pelanggaran kesetiaan, khususnya terhadap Allah dalam hubungan perjanjian. Ungkapan ini menyampaikan bobot tersebut dengan bahasa Indonesia yang jelas.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: Terjemahan ini mempertahankan rumusan identitas perjanjian sekaligus menggemakan penyebutan nenek moyang sebelumnya.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: Dia pun menjadikan mereka pemandangan yang mengerikan
  rationale: נתן dengan לְשַׁמָּה menyatakan bahwa Allah membuat mereka berada dalam keadaan yang membangkitkan kengerian. “Pemandangan yang mengerikan” alami dalam bahasa Indonesia dan sesuai dengan seruan kepada sesuatu yang dapat dilihat, sementara nuansa kehancuran dicatat dalam catatan kaki.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים
  choice: seperti yang kamu lihat sendiri
  rationale: Frasa ini menunjuk pada bukti yang sedang tampak bagi para pendengar. “Sendiri” secara wajar menegaskan kata ganti אַתֶּם tanpa mengubah makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Hubungan antara ketidaksetiaan umat dan tindakan Allah
  choice: Mempertahankan urutan dengan “Dia pun”
  alternative: “sehingga Dia” atau “karena itu Dia”
  rationale: Waw pada וַיִּתְּנֵם melanjutkan narasi dan tidak secara eksplisit menandai tujuan atau akibat. Terjemahan ini membiarkan hubungan teologisnya tetap kuat tanpa menambahkan penanda kausal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. Bentuk “kamu” mengikuti sapaan jamak dalam konteks tanpa memakai bentuk arkais; pengulangan “nenek moyang” dipertahankan untuk menjaga kaitan retoris teks.
