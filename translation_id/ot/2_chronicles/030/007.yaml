    text: Atau “kehancuran” atau “sasaran keheranan”; istilah Ibrani ini dapat menunjuk pada kehancuran maupun pada keadaan atau tontonan yang mengerikan atau mengundang keheranan.
    reason: lexical_alternative
  revision_rationale: Revisi memperbaiki keluwesan bahasa dan mengurangi pembatasan semantis pada istilah שַׁמָּה, sambil mempertahankan ambiguitas leksikalnya melalui catatan kaki. Sambungan antarklausa tetap nonkausal, sesuai dengan teks Ibrani.
