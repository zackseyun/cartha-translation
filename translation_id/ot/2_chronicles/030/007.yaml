revisions:
- from: Janganlah kamu seperti nenek moyangmu dan saudara-saudaramu, yang berlaku tidak setia kepada Yahweh, Allah nenek moyang mereka. Dia pun menjadikan mereka pemandangan yang mengerikan[a], seperti yang kamu lihat sendiri.
  to: Janganlah kamu menjadi seperti nenek moyangmu dan saudara-saudaramu, yang tidak setia kepada Yahweh, Allah nenek moyang mereka, dan Dia menjadikan mereka tontonan yang mengerikan[a], seperti yang kamu lihat.
  rationale: Revisi memperbaiki keluwesan bahasa dan mengurangi pembatasan semantis pada istilah שַׁמָּה, sambil mempertahankan ambiguitas leksikalnya melalui catatan kaki. Sambungan antarklausa tetap nonkausal, sesuai dengan teks Ibrani.
