  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּקֻ֜מוּ הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ וַ/יְבָרֲכ֣וּ אֶת הָ/עָ֔ם וַ/יִּשָּׁמַ֖ע בְּ/קוֹלָ֑/ם וַ/תָּב֧וֹא תְפִלָּתָ֛/ם לִ/מְע֥וֹן קָדְשׁ֖/וֹ לַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: id
  text: Kemudian para imam, yaitu orang-orang Lewi[a], berdiri dan memberkati umat itu. Suara mereka didengar[b], dan doa mereka sampai ke tempat kediaman-Nya yang kudus, ke surga[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "para imam Lewi." Frasa Ibrani ini kemungkinan bersifat aposisional, sehingga orang-orang Lewi mengidentifikasi para imam tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau "suara mereka didengarkan," dengan bentuk pasif yang menyiratkan bahwa Allah mendengar mereka.
    reason: alternative_reading
  - marker: c
    text: Atau "ke tempat kediaman-Nya yang kudus, ke langit."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: berdiri
  rationale: Bentuk Qal wayyiqtol dari קום menyatakan bangkit atau berdiri; dalam konteks tindakan sebelum memberkati, 'berdiri' alami dan konkret.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam, yaitu orang-orang Lewi
  rationale: Frasa ini paling mungkin bersifat aposisional, yakni 'orang-orang Lewi' menjelaskan identitas para imam, bukan menyebut dua kelompok terpisah.
- source_word: וַיְבָרֲכוּ אֶת־הָעָם
  choice: memberkati umat itu
  rationale: ברך di sini berarti mengucapkan berkat atas orang-orang yang berkumpul. 'Umat' sesuai dengan konteks peribadatan tanpa mengubah makna dasar עָם.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: Suara mereka didengar
  rationale: Bentuk Nifal dari שמע dipertahankan sebagai pasif, tanpa menambahkan Allah sebagai pelaku yang tidak disebutkan secara eksplisit dalam klausa tersebut.
- source_word: תְפִלָּתָם
  choice: doa mereka
  rationale: Nomina tunggal dengan sufiks jamak ini secara alami menyatakan doa mereka secara kolektif.
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: ke tempat kediaman-Nya yang kudus
  rationale: מָעוֹן menunjuk tempat tinggal atau kediaman; terjemahan ini mempertahankan citra ruang dan sifat kudusnya.
- source_word: לַשָּׁמָיִם
  choice: ke surga
  rationale: Preposisi arah ל dipertahankan, dan frasa ini diletakkan sebagai penjelasan aposisional bagi tempat kediaman-Nya yang kudus.
theological_decisions:
- issue: Apakah Allah perlu dijadikan subjek eksplisit dari tindakan mendengar
  choice: 'Mempertahankan bentuk pasif: ''Suara mereka didengar.'''
  alternative: '''Allah mendengar suara mereka.'''
  rationale: Teks Ibrani memakai bentuk pasif dan tidak menyebut Allah secara eksplisit sebagai subjek, walaupun konteks jelas menyiratkan pendengaran ilahi.
- issue: Hubungan antara 'para imam' dan 'orang-orang Lewi'
  choice: 'Membacanya sebagai aposisi: ''para imam, yaitu orang-orang Lewi.'''
  alternative: '''para imam dan orang-orang Lewi'' atau ''para imam Lewi'''
  rationale: Aposisi menghindari kesan bahwa teks menyebut dua kelompok dan secara jelas menyampaikan bahwa kelompok imam tersebut berasal dari orang-orang Lewi.
- issue: Hubungan 'tempat kediaman-Nya yang kudus' dengan 'surga'
  choice: 'Mempertahankan kedua frasa arah: ''ke tempat kediaman-Nya yang kudus, ke surga.'''
  alternative: '''ke tempat kediaman-Nya yang kudus di surga'''
  rationale: Pilihan ini mempertahankan pengulangan preposisional dalam bahasa Ibrani dan tidak melebur kedua unsur menjadi relasi lokatif yang lebih eksplisit daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Umat' dipilih karena konteks peribadatan, sementara struktur pasif dan aposisi sumber dipertahankan. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
