id: 2CH.30.17
reference: 2 Chronicles 30:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: id
  text: Sebab banyak orang dalam jemaah belum menguduskan diri[a], orang-orang Lewi bertugas menyembelih kurban-kurban Paskah[b] bagi setiap orang yang tidak tahir[c], untuk menguduskannya bagi Yahweh.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belum mengkhususkan diri bagi ibadah.” Bahasa Ibrani memakai istilah pengudusan, meskipun ketahiran ritual menjadi persoalan langsung dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Paskah-Paskah”; maksudnya ialah hewan-hewan kurban Paskah.
    reason: lexical_alternative
  - marker: c
    text: Atau “bagi semua orang yang najis.” Yang dimaksud ialah keadaan tidak tahir secara ritual.
    reason: lexical_alternative
  - marker: d
    text: Bahasa Ibrani tidak menyatakan objek dari “menguduskan” secara eksplisit. Terjemahan ini memahaminya sebagai kurban-kurban Paskah; mungkin juga ungkapan itu dipahami sehubungan dengan orang-orang yang tidak tahir.
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: banyak orang dalam jemaah
  rationale: Ungkapan ini menunjuk pada sejumlah besar orang di tengah komunitas yang sedang berhimpun. “Jemaah” alami dalam bahasa Indonesia dan sesuai dengan konteks peribadatan.
- source_word: הִתְקַדָּשׁוּ
  choice: belum menguduskan diri
  rationale: Bentuk hitpael dari קדשׁ menyatakan tindakan mempersiapkan atau mengkhususkan diri bagi ibadah. “Menguduskan diri” mempertahankan bahasa kekudusan tanpa menyamakannya begitu saja dengan pentahiran ritual.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok suku sekaligus pelayan ibadah ini.
- source_word: עַל שְׁחִיטַת הַפְּסָחִים
  choice: bertugas menyembelih kurban-kurban Paskah
  rationale: עַל dalam konstruksi ini menandai tanggung jawab atas penyembelihan. Bentuk jamak הַפְּסָחִים secara kontekstual menunjuk pada hewan-hewan kurban Paskah, bukan perayaan-perayaannya.
- source_word: לְכֹל לֹא טָהוֹר
  choice: bagi setiap orang yang tidak tahir
  rationale: טָהוֹר di sini berkaitan dengan kelayakan ritual. “Tidak tahir” mempertahankan istilah kultis dan tidak mengaburkannya menjadi ketidakbersihan biasa.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: untuk menguduskannya bagi Yahweh
  rationale: Infinitif קדשׁ menyatakan tujuan tindakan tersebut. Pronomina “-nya” dipahami paling dekat sebagai kurban-kurban Paskah, tetapi catatan kaki mempertahankan fakta bahwa objeknya tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap terlihat.
theological_decisions:
- issue: Bahasa kekudusan קדשׁ dalam konteks kelayakan ritual
  choice: Memakai “menguduskan diri” dan “menguduskannya”, bukan mengganti keduanya dengan bahasa pentahiran saja.
  alternative: “Menyucikan diri” atau “menahirkan diri”, lalu “mempersembahkannya”.
  rationale: Konteks memang menyangkut ketahiran ritual, tetapi akar קדשׁ membawa gagasan pengudusan atau pengkhususan bagi Allah. Pembedaan antara kekudusan dan ketahiran perlu dipertahankan.
- issue: Objek tersirat dari לְהַקְדִּישׁ
  choice: Dalam teks utama, “-nya” mengacu paling wajar kepada kurban-kurban Paskah.
  alternative: Memahami objeknya sebagai orang-orang yang tidak tahir, atau membiarkan tujuan itu sepenuhnya tanpa objek dalam terjemahan.
  rationale: Bahasa Ibrani tidak menyebutkan objek secara eksplisit. Kurban-kurban Paskah merupakan acuan terdekat dan paling masuk akal, tetapi ketidakjelasan gramatikal itu dicatat agar tafsiran tidak disajikan sebagai sesuatu yang eksplisit.
- issue: Hubungan sebab-akibat pada awal ayat
  choice: Menerjemahkan כִּי dengan “Sebab” dan membentuk kalimat utama tanpa menambahkan penghubung kesimpulan yang kuat.
  alternative: “Karena itu” atau “maka” sebelum klausa tentang orang Lewi.
  rationale: כִּי memberi alasan atau penjelasan, sedangkan waw berikutnya tidak harus dipertegas menjadi kesimpulan formal. Susunan Indonesia ini menyampaikan hubungan logis secara alami tanpa berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “jemaah”, “menguduskan diri”, “tahir”, dan “kurban” mempertahankan nuansa peribadatan tanpa menjadi terlalu teknis. Struktur kalimat dibuat alami, sedangkan ketidakjelasan objek dalam klausa terakhir dipertahankan melalui catatan kaki.
