base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: id
  text: Kemudian raja, para pejabatnya, dan seluruh jemaah di Yerusalem memutuskan untuk merayakan Paskah pada bulan kedua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melakukan Paskah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: memutuskan
  rationale: Bentuk nifal dari יעץ di sini menggambarkan perundingan bersama yang menghasilkan suatu keputusan. 'Memutuskan' alami dalam bahasa Indonesia, sedangkan subjek majemuk menunjukkan bahwa keputusan itu diambil bersama.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung bagi nomina tertentu ini. Konteks menunjuk kepada Hizkia, tetapi teks Ibrani memakai gelarnya.
- source_word: וְשָׂרָיו
  choice: para pejabatnya
  rationale: שָׂרִים menunjuk kepada para penguasa atau pejabat tinggi. 'Para pejabatnya' jelas dan tidak memberi kesan bahwa mereka adalah putra-putra raja.
- source_word: וְכָל הַקָּהָל
  choice: dan seluruh jemaah
  rationale: קָהָל berarti komunitas yang berhimpun. 'Jemaah' merupakan istilah Indonesia yang wajar untuk kumpulan umat dalam konteks ini.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Padanan lokatif langsung dari nama tempat tersebut.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: untuk merayakan Paskah
  rationale: Secara harfiah frasa ini berarti 'melakukan Paskah', suatu idiom untuk menjalankan perayaan Paskah. 'Merayakan Paskah' paling alami dan jelas dalam bahasa Indonesia modern.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: pada bulan kedua
  rationale: Padanan temporal langsung. Ayat ini hanya menyatakan waktunya tanpa menambahkan penjelasan bahwa Paskah biasanya dirayakan pada bulan pertama.
theological_decisions:
- issue: Penerjemahan idiom pelaksanaan Paskah tanpa menambahkan rincian tafsiran
  choice: merayakan Paskah
  alternative: melaksanakan Paskah; melakukan Paskah
  rationale: '''Merayakan Paskah'' menyampaikan tindakan menjalankan perayaan yang dimaksud idiom Ibrani secara alami. Catatan kaki mempertahankan bentuk harfiahnya tanpa memasukkan penjelasan teologis tambahan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur daftar subjek dipertahankan, sementara idiom Ibrani dialihkan secara alami. 'Jemaah' dipakai dalam arti komunitas umat yang berhimpun, bukan sebagai istilah denominasi tertentu.
