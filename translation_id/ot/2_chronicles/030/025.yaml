base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: id
  text: Seluruh jemaah Yehuda bersukacita, bersama para imam dan orang-orang Lewi, seluruh jemaah yang datang dari Israel, para penduduk asing[a] yang datang dari tanah Israel, dan mereka yang tinggal di Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pendatang yang menetap.” Kata Ibrani גֵּרִים menunjuk pada orang asing yang tinggal menetap di tengah bangsa Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: bersukacita
  rationale: Kata kerja שׂמח menyatakan kegembiraan atau sukacita. ‘Bersukacita’ alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi bentuk perayaan tertentu.
- source_word: כָּל קְהַל יְהוּדָה
  choice: seluruh jemaah Yehuda
  rationale: קהל menunjuk kepada komunitas yang berhimpun. ‘Jemaah’ mempertahankan gagasan umat yang berkumpul dan sesuai dengan konteks perayaan keagamaan ini.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku bagi כֹּהֲנִים dalam konteks pelayanan Israel.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan baku bagi kelompok suku Lewi yang dibedakan dari para imam.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: seluruh jemaah yang datang dari Israel
  rationale: Frasa ini mempertahankan pengulangan קהל dan menerjemahkan bentuk partisipial הַבָּאִים secara alami sebagai klausa relatif.
- source_word: הַגֵּרִים
  choice: para pendatang
  rationale: גֵּרִים menunjuk kepada orang bukan pribumi yang menetap di tengah masyarakat Israel. ‘Para pendatang’ cukup alami, sedangkan arti sosialnya yang lebih khusus dijelaskan dalam catatan kaki.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: yang datang dari tanah Israel
  rationale: ‘Tanah Israel’ mempertahankan acuan geografis אֶרֶץ יִשְׂרָאֵל dan membedakannya dari Yehuda.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: mereka yang tinggal di Yehuda
  rationale: Terjemahan ini mempertahankan sifat partisipial יֹשְׁבִים dan terdengar alami dalam bahasa Indonesia modern.
