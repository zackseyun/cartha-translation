  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah sebuah pinggan perak[a] seberat seratus tiga puluh syikal, dan sebuah bokor perak seberat tujuh puluh syikal, menurut syikal kudus[b]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak untuk persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “talam”; kata Ibrani קְעָרָה menunjuk pada wadah perak yang relatif dangkal dalam perlengkapan tempat kudus.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, berdasarkan standar berat kudus.
    reason: clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן menunjuk pada persembahan yang dibawa dalam konteks ibadah. Bentuk nominal Ibrani dialihkan secara wajar dengan kopula 'ialah'.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: sebuah pinggan perak
  rationale: קְעָרָה adalah wadah relatif dangkal dalam perlengkapan Kemah Suci; 'pinggan' mempertahankan pembedaan dari bokor yang disebut sesudahnya.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: seberat seratus tiga puluh syikal
  rationale: Ungkapan ini menyatakan berat wadah; konstruksi 'seberat' alami dalam bahasa Indonesia dan tetap ringkas.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: sebuah bokor perak
  rationale: מִזְרָק adalah wadah ritual, bukan sekadar mangkuk rumah tangga. 'Bokor' sesuai dengan laras inventaris peribadatan dan membedakannya dari pinggan.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: seberat tujuh puluh syikal
  rationale: Frasa tersebut menyatakan berat bokor; pengulangan 'seberat' menghilangkan kemungkinan bahwa bilangan menyatakan jumlah benda.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa Ibrani menetapkan standar berat sakral. Terjemahan ini formal tetapi jelas, tanpa menyiratkan bahwa syikal tersebut merupakan benda persembahan.
- source_word: שְׁנֵיהֶם
  choice: Keduanya
  rationale: Pronomina ini secara eksplisit merujuk kepada kedua wadah dan dipertahankan untuk kejelasan.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah baku untuk tepung bermutu halus yang digunakan dalam persembahan.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif menerangkan tepung yang telah dicampur dengan minyak; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה menunjuk khusus pada persembahan berbahan hasil bumi; 'persembahan sajian' mempertahankan istilah kultis yang lebih khusus daripada sekadar 'persembahan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan inventaris dipertahankan, sedangkan pengulangan 'seberat' dipakai demi kejelasan. Istilah 'syikal' dipertahankan sebagai satuan berat kuno, dan 'persembahan sajian' digunakan sebagai istilah kultis khusus.
