  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: id
  text: satu pinggan emas[a] seberat sepuluh syikal, penuh dengan dupa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “satu pinggan emas, sepuluh, penuh dengan dupa”; satuan berat “syikal” tersirat dari rumusan persembahan yang berulang dalam Bilangan 7.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: pinggan
  rationale: Dalam konteks persembahan Kemah Suci, kata ini menunjuk pada wadah upacara berukuran kecil. 'Pinggan' lebih alami daripada 'sendok' dan cocok sebagai wadah dupa.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang sesuai dengan nomina feminin כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: emas seberat sepuluh syikal
  rationale: Teks Ibrani bersifat eliptis dan tidak menyebut satuan berat. Rumusan persembahan yang berulang dalam Bilangan 7 menunjukkan bahwa 'syikal' tersirat; kata 'seberat' memperjelas hubungan tersebut dalam bahasa Indonesia.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Menerjemahkan adjektiva predikatif yang menyatakan isi wadah secara alami dan ringkas.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan Indonesia yang lazim untuk bahan harum yang dipersembahkan dengan dibakar.
