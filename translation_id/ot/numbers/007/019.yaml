  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: id
  text: 'Ia mempersembahkan persembahannya: satu piring perak[a] yang beratnya seratus tiga puluh syikal; satu mangkuk perak[b] yang beratnya tujuh puluh syikal, menurut syikal tempat kudus[c]; keduanya penuh dengan tepung halus yang dicampur dengan minyak untuk persembahan sajian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pinggan perak"; istilah Ibraninya menunjuk wadah yang lebar atau dangkal.
    reason: lexical_alternative
  - marker: b
    text: Atau "bokor perak" atau "baskom perak"; bentuk persis wadah ritual ini tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, "menurut syikal tempat kudus", yaitu berdasarkan standar berat resmi yang digunakan untuk tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks persembahan berarti membawa mendekat atau menyajikan secara seremonial; 'mempersembahkan' alami dalam konteks ibadah.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: Istilah umum bagi sesuatu yang dibawa sebagai persembahan; pilihan ini mempertahankan hubungan bunyi dan makna dengan verba sebelumnya sebagaimana dalam bahasa Ibrani.
- source_word: קַעֲרַת כֶּסֶף
  choice: pinggan perak
  rationale: Menunjuk wadah relatif lebar atau dangkal; 'pinggan' sesuai dengan daftar perlengkapan upacara, sementara bentuk persisnya tidak sepenuhnya pasti.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: Menyatakan berat wadah secara eksplisit dan mempertahankan acuan sufiks feminin kepada pinggan.
- source_word: מִזְרָק
  choice: bokor perak
  rationale: Istilah ini menunjuk wadah ritual, kemungkinan berupa mangkuk atau baskom; 'bokor' merupakan padanan Indonesia yang bermartabat untuk wadah lebar dalam konteks upacara.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menunjukkan bahwa berat dihitung berdasarkan standar syikal resmi yang berlaku bagi tempat kudus.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: keduanya penuh dengan
  rationale: Mempertahankan rujukan eksplisit kepada kedua wadah.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Menunjuk tepung halus bermutu tinggi untuk persembahan; 'tepung terbaik' lebih alami bagi pembaca modern daripada ungkapan teknis yang dapat disalahpahami sebagai ukuran tekstur semata.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Menggambarkan cara tepung itu disiapkan secara langsung dan idiomatis.
- source_word: לְמִנְחָה
  choice: sebagai kurban sajian
  rationale: Dalam konteks imamat, מִנְחָה adalah persembahan berbahan hasil bumi atau tepung, bukan persembahan umum; 'kurban sajian' mempertahankan kekhususan istilah kultis.
