translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur inventaris Ibrani dipertahankan melalui rangkaian bertitik koma, tetapi klausa berat dibuat eksplisit agar alami. Istilah 'syikal' dipertahankan sebagai satuan kuno dan dijelaskan secara kontekstual lewat catatan kaki.
