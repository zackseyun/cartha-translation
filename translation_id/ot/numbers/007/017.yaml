  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: id
  text: 'dan untuk kurban keselamatan[a]: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur setahun. Itulah persembahan Nahason anak Aminadab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan”; istilah Ibrani ini sering menunjuk pada kurban yang jamuannya dinikmati bersama dalam persekutuan dan damai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: dan untuk kurban keselamatan
  rationale: Awalan וּלְ memperkenalkan unsur berikutnya dalam daftar, sedangkan זֶבַח שְׁלָמִים adalah istilah teknis bagi kurban yang berkaitan dengan damai, kesejahteraan, dan persekutuan melalui jamuan kurban.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר merupakan sebutan kolektif untuk ternak sapi dan tidak menentukan jenis kelamin; kata penggolong 'ekor' membuat daftar ini alami dalam bahasa Indonesia.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus menunjuk kepada domba jantan dewasa.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתּוּדִים menunjuk kepada kambing jantan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur setahun
  rationale: כְּבָשִׂים adalah bentuk jamak dari sebutan bagi anak domba jantan, dan בְּנֵי שָׁנָה menyatakan usia satu tahun.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Klausa nominal Ibrani secara harfiah berarti 'inilah/itulah persembahan'; 'Itulah' merangkum daftar yang baru disebutkan secara alami.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nahason anak Aminadab
  rationale: Nama ditransliterasikan dalam bentuk Indonesia yang lazim, dan בֶּן diterjemahkan secara langsung sebagai 'anak'.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan
  rationale: '''Kurban keselamatan'' mempertahankan istilah kultis yang dikenal tanpa membatasi maknanya hanya pada persekutuan atau kesejahteraan; alternatif dicatat karena cakupan kata Ibraninya lebih luas daripada satu padanan Indonesia.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata penggolong 'ekor' dipakai secara konsisten untuk hewan; susunan tetap mempertahankan bentuk daftar kurban dalam teks Ibrani.
