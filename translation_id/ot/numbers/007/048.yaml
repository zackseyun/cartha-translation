base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: id
  text: Pada hari ketujuh, pemimpin bani Efraim[a] ialah Elisama anak Amihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pemimpin bagi bani Efraim.” Preposisi Ibrani yang dipakai di sini dapat menyatakan hubungan atau perwakilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Gabungan preposisi ב dengan יוֹם dan bilangan tingkat menyatakan waktu; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks Bilangan 7, istilah ini menunjuk kepada kepala suku yang mempersembahkan persembahan; “pemimpin” jelas, modern, dan tidak menyiratkan gelar kerajaan seperti “pangeran”.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: bani Efraim
  rationale: Ungkapan ini menunjuk kepada keturunan atau kelompok suku Efraim. “Bani Efraim” mempertahankan unsur keturunan dalam bahasa Ibrani sekaligus merupakan ungkapan Indonesia yang ringkas dan dikenal dalam konteks kesukuan Alkitab.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן עַמִּיהוּד
  choice: anak Amihud
  rationale: Konstruksi patronimik Ibrani ini secara alami diterjemahkan “anak Amihud” dan mempertahankan identifikasi genealogisnya.
