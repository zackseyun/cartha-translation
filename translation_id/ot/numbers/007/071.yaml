  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: id
  text: 'dan untuk kurban persekutuan: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba berumur satu tahun. Itulah persembahan Ahiezer anak Amisyadai.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: dan untuk kurban persekutuan
  rationale: Konstruksi ini memperkenalkan unsur terakhir dalam daftar persembahan. 'Kurban persekutuan' menyampaikan istilah korban שְׁלָמִים secara alami dalam bahasa Indonesia tanpa membatasi maknanya hanya pada keadaan damai.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר menunjuk pada ternak lembu secara umum dan tidak menentukan jenis kelamin; 'sapi' mempertahankan keluasan itu.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus berarti domba jantan.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים secara khusus menunjuk pada kambing jantan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba berumur satu tahun
  rationale: Ungkapan harfiah 'anak-anak satu tahun' menyatakan umur hewan; bentuk Indonesia ini jelas dan alami.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Formula penutup ini menunjuk kembali kepada daftar yang baru disebutkan. 'Persembahan' merupakan padanan wajar bagi קָרְבָּן dalam konteks ini.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiezer anak Amisyadai
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia, dan בֶּן diterjemahkan langsung sebagai 'anak'.
theological_decisions:
- issue: Makna istilah korban שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan; kurban pendamaian; kurban kesejahteraan
  rationale: '''Kurban persekutuan'' adalah istilah yang mudah dipahami dan mencerminkan dimensi jamuan serta relasi dalam korban ini. Pilihan ini tidak menyamakan korban tersebut secara sempit dengan pendamaian dosa.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata penggolong 'ekor' dipakai secara konsisten untuk daftar hewan. Struktur daftar dan formula penutup Ibrani dipertahankan tanpa kekakuan yang tidak perlu.
