translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Istilah ‘syikal’ dipertahankan sebagai satuan berat kuno; pengulangan ‘syikal’ setelah berat masing-masing bejana ditambahkan secara wajar dalam bahasa Indonesia berdasarkan konteks pengukuran yang eksplisit.
