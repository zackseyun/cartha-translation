translation:
  language: id
  text: Setiap pinggan perak beratnya seratus tiga puluh syikal, dan setiap bokor tujuh puluh syikal. Total berat perak dari semua bejana itu adalah dua ribu empat ratus syikal, menurut syikal kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut syikal tempat kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: seratus tiga puluh
  rationale: Urutan angka Ibrani secara harfiah adalah ‘tiga puluh dan seratus’; urutan angka Indonesia yang wajar menyampaikan nilai yang sama.
- source_word: הַקְּעָרָה הָאַחַת
  choice: setiap pinggan
  rationale: Bentuk tunggal dengan kata sandang dan bilangan berfungsi distributif dalam rangkuman inventaris ini, yaitu berat masing-masing pinggan.
- source_word: כֶּסֶף
  choice: perak
  rationale: Dalam konteks ini kata tersebut menunjuk pada bahan bejana, bukan uang.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: setiap bokor
  rationale: מִזְרָק adalah wadah berbentuk mangkuk atau bokor yang digunakan dalam konteks ritual; bentuk tunggalnya bersifat distributif di sini.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: seluruh perak pada bejana-bejana itu
  rationale: כֹּל menyatakan jumlah keseluruhan, sedangkan כֵּלִים menunjuk pada berbagai bejana yang baru dirinci.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: dua ribu empat ratus
  rationale: Bentuk angka baku dan alami dalam bahasa Indonesia modern.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menetapkan standar berat yang dipakai. Terjemahan ini menyatakan kaitannya dengan tempat kudus secara jelas tanpa menambahkan penafsiran.
