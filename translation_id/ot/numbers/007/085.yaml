  - severity: low
    issue: '"Syikal tempat kudus" kurang merupakan istilah baku dibanding "syikal kudus."'
    rationale: Kata הַקֹּדֶשׁ dapat dipahami sebagai "yang kudus" atau "tempat kudus" dalam penetapan standar berat. Teks utama memakai istilah Indonesia yang lazim, dan alternatifnya diberi dalam catatan kaki.
