  terminology: “Kereta” (dengan alternatif “pedati”), “lembu,” “tugas pelayanan,” dan “pengawasan” sesuai konteks pelayanan Kemah Suci. “Anak Harun sang imam” memperjelas bahwa sebutan “imam” menerangkan Harun, sebagaimana struktur frasa Ibrani.
