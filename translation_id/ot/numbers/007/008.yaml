base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: id
  text: Ia memberikan empat kereta[a] dan delapan ekor lembu itu kepada anak-anak Merari, sesuai dengan tugas pelayanan mereka, di bawah pengawasan Itamar[b], anak Harun sang imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pedati”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melalui tangan Itamar”, suatu ungkapan yang menunjukkan perantaraan atau pengawasan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: kereta
  rationale: Kata ini menunjuk pada kendaraan beroda untuk mengangkut barang. “Kereta” alami dalam bahasa Indonesia dan sesuai dengan konteks pengangkutan Kemah Suci.
- source_word: הַבָּקָר
  choice: lembu
  rationale: Dalam konteks ini hewan-hewan tersebut digunakan untuk menarik kereta. “Lembu” menyampaikan fungsi itu dengan jelas tanpa mempersempit makna Ibrani secara berlebihan.
- source_word: נָתַן
  choice: memberikan
  rationale: Pilihan ini mempertahankan arti dasar verba Ibrani. Konteksnya memang berupa pembagian resmi, tetapi verba itu sendiri tidak mengharuskan terjemahan “menetapkan” atau “mengalokasikan”.
- source_word: לִבְנֵי מְרָרִי
  choice: kepada keturunan Merari
  rationale: Ungkapan ini mempertahankan hubungan keluarga atau kaum dalam frasa harfiah “anak-anak Merari”, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: כְּפִי עֲבֹדָתָם
  choice: sesuai dengan tugas pelayanan mereka
  rationale: כְּפִי merupakan idiom yang berarti “sesuai dengan”, sedangkan עֲבֹדָה di sini mengacu pada tugas pelayanan yang berkaitan dengan Kemah Suci.
- source_word: בְּיַד אִיתָמָר
  choice: di bawah pengawasan Itamar
  rationale: Secara harfiah frasa ini berarti “melalui tangan Itamar”, tetapi dalam konteks administratif menyatakan pengawasan atau tanggung jawab.
- source_word: הַכֹּהֵן
  choice: imam itu
  rationale: Frasa ini menerangkan Harun dan mempertahankan bentuk definit dalam bahasa Ibrani.
