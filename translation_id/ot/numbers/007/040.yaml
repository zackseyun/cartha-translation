  text: seekor kambing jantan untuk kurban penghapus dosa—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seekor kambing jantan sebagai kurban penghapus dosa."
    reason: Alternatif ini mencerminkan kemungkinan menerjemahkan לְ sebagai 'sebagai' dalam rumusan daftar kurban.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Ungkapan konstruksi ini secara idiomatis menunjuk kepada kambing jantan. Bentuk 'seekor kambing jantan' jelas, alami, dan mempertahankan kekhususan hewan kurban.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan 'satu' dinyatakan secara alami melalui kata penggolong 'seekor' dalam bahasa Indonesia; dalam konteks daftar ini, bentuk tersebut tetap menyampaikan bahwa jumlahnya satu.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks persembahan, חַטָּאת menunjuk kepada jenis kurban, bukan sekadar dosa sebagai gagasan abstrak. 'Kurban penghapus dosa' merupakan istilah yang jelas dan lazim dalam bahasa Indonesia, sedangkan לְ diterjemahkan 'untuk'.
