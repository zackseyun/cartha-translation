base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] seberat seratus tiga puluh syikal, dan satu bokor perak seberat tujuh puluh syikal menurut syikal kudus. Keduanya penuh dengan tepung halus yang dicampur dengan minyak sebagai persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring” untuk “pinggan” (קְעָרָה), dan “mangkuk” untuk “bokor” (מִזְרָק).
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן menunjuk pada sesuatu yang dibawa sebagai persembahan dalam konteks ibadah; bentuk posesif orang ketiga tunggal dipertahankan.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קְעָרָה adalah wadah yang relatif lebar; 'pinggan' merupakan padanan Indonesia yang wajar, dengan alternatif 'piring' dicatat di catatan kaki.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: seberat seratus tiga puluh syikal
  rationale: Ungkapan ini menyatakan berat wadah; konstruksi 'seberat' alami dalam daftar inventaris Indonesia.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah berbentuk mangkuk yang digunakan dalam pelayanan kurban; 'bokor' mempertahankan nuansa wadah ritual tanpa menentukan fungsi yang tidak dinyatakan ayat ini.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: seberat tujuh puluh syikal
  rationale: Menyatakan berat wadah kedua secara jelas dan sejajar dengan wadah pertama.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  rationale: Frasa ini menentukan standar penimbangan resmi yang terkait dengan tempat kudus; 'syikal kudus' ringkas dan mempertahankan bentuk sumber.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Keduanya penuh dengan
  rationale: Rujukan kepada kedua wadah dinyatakan secara eksplisit sebagaimana dalam bahasa Ibrani.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: סֹלֶת menunjuk pada tepung bermutu tinggi yang telah diolah halus untuk persembahan; 'tepung terbaik' lebih alami daripada ungkapan teknis yang kaku.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur minyak
  rationale: Menyampaikan cara penyiapan tepung secara langsung dan alami.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה menunjuk pada persembahan berbahan hasil bumi/tepung; istilah baku 'persembahan sajian' mempertahankan kekhususan kultisnya.
