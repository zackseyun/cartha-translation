id: NUM.7.87
reference: Numbers 7:87
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: id
  text: Seluruh ternak untuk kurban bakaran itu berjumlah dua belas ekor sapi jantan, dua belas ekor domba jantan, dan dua belas ekor anak domba berumur satu tahun, beserta kurban sajian mereka; juga dua belas ekor kambing jantan untuk kurban penghapus dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian.” Istilah Ibrani חַטָּאת dapat menekankan pemurnian dari kenajisan maupun penghapusan dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: Seluruh ternak
  rationale: Menyampaikan jumlah keseluruhan hewan jenis lembu dalam ringkasan persembahan; rincian berikutnya menyebutnya sebagai sapi jantan.
- source_word: לָעֹלָה
  choice: untuk kurban bakaran
  rationale: Preposisi לְ menyatakan tujuan, sedangkan עֹלָה adalah istilah persembahan yang dibakar seluruhnya.
- source_word: פָּרִים
  choice: sapi jantan
  rationale: Padanan Indonesia yang jelas dan lazim untuk hewan bovina jantan dalam konteks kurban.
- source_word: אֵילִם
  choice: domba jantan
  rationale: Membedakan hewan jantan dewasa ini dari anak-anak domba yang disebut sesudahnya.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: anak domba berumur satu tahun
  rationale: Mempertahankan jenis hewan dan ketentuan usianya secara alami dalam bahasa Indonesia.
- source_word: וּמִנְחָתָם
  choice: beserta kurban sajian mereka
  rationale: מִנְחָה dalam peraturan kurban menunjuk pada kurban sajian, dan akhiran orang ketiga jamak dipertahankan dengan 'mereka', mengacu pada hewan-hewan kurban bakaran.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: juga ... kambing jantan
  rationale: Frasa Ibrani secara khusus menunjuk pada kambing jantan; 'juga' meneruskan daftar dengan wajar.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Padanan ini mempertahankan istilah kurban yang umum dan mudah dipahami, sementara nuansa pemurniannya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah ini dapat menunjuk pada kurban yang berkaitan dengan dosa sekaligus pemurnian dari kenajisan. Teks utama memakai padanan yang lebih dikenal, tanpa menghapus kemungkinan nuansa pemurnian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata bantu bilangan 'ekor' dipakai secara konsisten agar daftar mudah dipahami. Susunan inventaris Ibrani dipertahankan, dengan 'berjumlah' ditambahkan secara wajar untuk memperjelas bahwa ayat ini merangkum total persembahan.
