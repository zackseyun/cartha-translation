  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/069.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: id
  text: seekor sapi jantan muda, seekor domba jantan, dan seekor anak domba jantan berumur satu tahun, untuk kurban bakaran;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: seekor sapi jantan muda
  rationale: פַּר menunjuk pada sapi jantan, lazimnya yang masih muda, sedangkan בֶּן בָּקָר menggolongkannya sebagai ternak sapi. Dalam bahasa Indonesia, gabungan ini paling wajar dan ringkas diterjemahkan “seekor sapi jantan muda” tanpa meniru ungkapan harfiah “anak ternak sapi”.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל adalah istilah baku bagi domba jantan dewasa, khususnya dalam daftar kurban.
- source_word: כֶּבֶשׂ אֶחָד
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ berarti anak domba dan dalam konteks kurban ini merujuk pada hewan jantan; penyebutan “jantan” menjaga ketepatan jenis kelamin secara alami dalam bahasa Indonesia.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Ungkapan Ibrani ini menyatakan umur hewan dan paling alami diterjemahkan “berumur satu tahun”.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: עֹלָה adalah kurban yang dibakar seluruhnya di atas mezbah; “kurban bakaran” merupakan padanan Indonesia yang jelas dan mapan.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia אֶחָד diulang untuk setiap hewan. Penggolong “seekor” secara alami menyatakan jumlah satu dalam bahasa Indonesia dan mempertahankan struktur daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur inventaris persembahan dipertahankan dengan pengulangan “seekor”. Istilah “kurban” dipilih menurut ejaan baku modern. Tidak diperlukan catatan kaki karena makna klasifikasi bovina dan jenis kelamin anak domba dapat disampaikan secara alami dalam teks utama.
