source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: id
  text: Namun, kepada keturunan Kehat ia tidak memberikan apa pun, sebab tugas mengurus benda-benda kudus[a] ada pada mereka; mereka harus memikulnya di atas bahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tugas pelayanan di tempat kudus”. Dalam konteks ini, ungkapan Ibrani tersebut kemungkinan besar menunjuk secara khusus pada benda-benda kudus yang dipercayakan kepada keturunan Kehat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Namun, kepada keturunan Kehat
  rationale: Kata penghubung וְ menyatakan kontras dengan pemberian kepada kaum Lewi lain dalam ayat sebelumnya, sehingga diterjemahkan “Namun”. Dalam konteks kelompok kekerabatan, בְנֵי קְהָת secara alami berarti “keturunan Kehat” dalam bahasa Indonesia modern.
- source_word: לֹא נָתָן
  choice: ia tidak memberikan apa pun
  rationale: Objek verba tidak disebutkan karena sudah jelas dari konteks sebelumnya, yaitu kereta dan lembu. Ungkapan ini mempertahankan implisitnya objek sambil tetap wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan mengapa mereka tidak menerima pemberian tersebut.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: tugas mengurus benda-benda kudus
  rationale: עֲבֹדָה menunjuk pada tugas atau pelayanan, sedangkan הַקֹּדֶשׁ dalam konteks pekerjaan kaum Kehat kemungkinan besar menunjuk pada benda-benda kudus yang dipercayakan kepada mereka. “Mengurus” mencakup tanggung jawab yang dalam konteks ini meliputi pengangkutan.
- source_word: עֲלֵיהֶם
  choice: ada pada mereka
  rationale: Ungkapan ini mempertahankan gambaran Ibrani tentang kewajiban yang berada atau dibebankan pada mereka, tanpa menjadikannya terlalu harfiah.
- source_word: בַּכָּתֵף
  choice: di atas bahu
  rationale: Terjemahan ini mengikuti bentuk tunggal kolektif dalam bahasa Ibrani dan tetap alami sebagai cara pengangkutan yang dilakukan masing-masing orang.
- source_word: יִשָּׂאוּ
  choice: mereka harus mengangkutnya
  rationale: Bentuk imperfek menyatakan kewajiban yang ditetapkan. Pronomina “-nya” melengkapi objek yang tersirat dalam bahasa Ibrani dan merujuk pada benda-benda kudus.
theological_decisions:
- issue: Rujukan הַקֹּדֶשׁ
  choice: benda-benda kudus
  alternative: tempat kudus
  rationale: Konteks tugas keturunan Kehat dalam Bilangan 4 mendukung rujukan kepada perlengkapan kudus yang mereka angkut. Namun, bentuk Ibraninya juga dapat dipahami lebih umum sebagai “tempat kudus”, sehingga alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Keturunan Kehat” dipilih sebagai sebutan kaum yang lebih alami daripada “anak-anak Kehat”, sedangkan struktur sebab-akibat dan kewajiban pengangkutan dipertahankan dengan jelas.
