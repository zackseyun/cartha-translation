    issue: “mengangkutnya” does not specifically express shoulder-bearing.
    rationale: יִשָּׂאוּ means “they were to carry/bear,” and בַּכָּתֵף specifies that this was done on the shoulder. “Memikulnya” conveys this directly; “mengangkut” can denote transportation by a means other than carrying.
