  verdict: revise
  source_fidelity: 'The draft correctly preserves the contrast, the implied object of the gift, the causal relation, and the Kohathites’ assigned responsibility. However, “mengangkutnya” is less precise than the Hebrew נשׂא in this context: it can suggest transport by vehicle, whereas the following phrase explicitly requires carrying on the shoulder.'
