  terminology: “Keturunan Kehat” is an acceptable modern Indonesian clan designation. “Benda-benda kudus” appropriately reflects the likely contextual reference of עֲבֹדַת הַקֹּדֶשׁ, while the footnote responsibly records the alternative sense “tempat kudus.”
  issues:
