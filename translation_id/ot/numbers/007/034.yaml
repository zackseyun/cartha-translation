lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Ungkapan konstruksi Ibrani ini secara harfiah berarti 'yang berbulu dari antara kambing-kambing' dan secara idiomatis menunjuk kepada kambing jantan. 'Seekor kambing jantan' jelas, alami, dan mempertahankan kekhususan hewan kurban.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan 'satu' dinyatakan melalui kata penggolong 'seekor', yang dalam bahasa Indonesia secara alami menyampaikan jumlah satu untuk hewan sambil mempertahankan bentuk daftar persembahan.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks ritual persembahan, חַטָּאת menunjuk kepada jenis kurban, bukan hanya gagasan abstrak tentang dosa. Awalan לְ diterjemahkan 'untuk' sesuai fungsi unsur ini dalam daftar kurban.
theological_decisions:
- issue: Pemaknaan חַטָּאת dalam konteks peribadatan
  choice: kurban penghapus dosa
  alternative: dosa
  rationale: Konteks langsungnya adalah daftar benda dan hewan kurban. Karena itu, nomina tersebut menyatakan kategori kurban. Terjemahan ini mempertahankan arti ritual dalam teks tanpa memasukkan penafsiran teologis yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kurban penghapus dosa' dipakai sebagai istilah ritual yang jelas bagi pembaca umum; penanda [a] ditempatkan sesudah tanda titik koma sesuai bentuk ayat yang merupakan bagian dari daftar.
