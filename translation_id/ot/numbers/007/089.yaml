  source_fidelity: 'Terjemahan secara akurat mengikuti sintaks dan isi Ibrani: Musa memasuki Kemah Pertemuan untuk berbicara dengan Dia, mendengar suara yang berbicara kepadanya dari atas tutup pendamaian di atas tabut Kesaksian, dari antara kedua kerub, lalu terjadi ujaran kepada Musa. Pengulangan nama Musa membantu kejelasan bahasa Indonesia tanpa mengubah makna.'
