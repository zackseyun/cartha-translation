id: NUM.7.89
reference: Numbers 7:89
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: id
  text: Ketika Musa masuk ke Kemah Pertemuan untuk berbicara dengan Dia[a], Musa mendengar suara yang berbicara kepadanya dari atas tutup pendamaian[b] yang berada di atas tabut Kesaksian, dari antara kedua kerub itu. Lalu Dia berbicara kepada Musa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani hanya berbunyi “dengan dia”; dalam konteks ini, pronomina itu dipahami menunjuk kepada Allah.
    reason: referent_clarification
  - marker: b
    text: “Tutup pendamaian” adalah tutup tabut, tempat Allah berbicara dari antara kedua kerub.
    reason: cultural_note
  - marker: c
    text: Subjek klausa terakhir tidak disebutkan secara eksplisit dalam bahasa Ibrani. Klausa itu juga dapat diterjemahkan “lalu suara itu berbicara kepadanya”; sebagian orang memahaminya sebagai “lalu Musa berbicara kepada-Nya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: Ketika Musa masuk
  rationale: Preposisi בְּ dengan infinitif konstruk בוא membentuk anak kalimat waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan alur naratif.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi tempat kudus tempat Allah bertemu dengan Musa dan umat-Nya.
- source_word: לְדַבֵּר אִתּוֹ
  choice: untuk berbicara dengan Dia
  rationale: דבר dengan אֵת menyatakan berbicara dengan atau kepada seseorang. Pronomina itu paling wajar menunjuk kepada Allah dalam konteks tempat kudus, sedangkan catatan kaki menjelaskan bahwa nama-Nya tidak disebutkan secara eksplisit.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: Musa mendengar suara
  rationale: קוֹל dapat berarti bunyi atau suara; bentuk partisipel berikutnya, 'berbicara', menunjukkan bahwa 'suara' merupakan pilihan yang paling tepat. Nama Musa diulangi agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: מִדַּבֵּר
  choice: yang berbicara
  rationale: Bentuk partisipel menggambarkan suara itu sedang berbicara. Terjemahan aktif merupakan pembacaan paling langsung, meskipun bentuk Ibrani ini kadang dipahami bernuansa pasif.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: dari atas tutup pendamaian
  rationale: כַּפֹּרֶת adalah tutup khusus pada tabut. 'Tutup pendamaian' menyampaikan baik wujud bendanya maupun fungsi kultis istilah tersebut tanpa memakai ungkapan Indonesia yang tidak lazim.
- source_word: אֲרֹן הָעֵדֻת
  choice: tabut Kesaksian
  rationale: Istilah ini menunjuk kepada tabut yang berkaitan dengan lempeng-lempeng Kesaksian, yaitu ketetapan perjanjian. Bentuk ringkasnya mempertahankan istilah khas teks Ibrani.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: dari antara kedua kerub itu
  rationale: '''Kerub'' adalah bentuk tunggal serapan yang lazim dalam bahasa Indonesia; kata ''kedua'' sudah menyatakan jamak.'
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Lalu Dia berbicara kepada Musa
  rationale: Subjek verba tunggal tidak dinyatakan. Dalam konteks, pembicara paling mungkin adalah Allah yang suara-Nya berasal dari atas tutup pendamaian. Nama Musa menggantikan pronomina penerima demi kejelasan, sementara alternatif sintaksis dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Rujukan pronomina dalam 'berbicara dengan Dia'
  choice: Pronomina dipahami menunjuk kepada Allah.
  alternative: Secara gramatikal, teks hanya memakai pronomina maskulin tunggal tanpa menyebut nama Allah dalam ayat ini.
  rationale: Konteks Kemah Pertemuan dan suara dari antara kedua kerub dengan kuat menunjukkan bahwa Musa datang untuk berbicara dengan Allah, tetapi catatan kaki menjaga ketepatan formal bahwa nama ilahi tidak tertulis di sini.
- issue: Subjek klausa terakhir וַיְדַבֵּר אֵלָיו
  choice: 'Allah dipahami sebagai subjek: ''Dia berbicara kepada Musa.'''
  alternative: Klausa itu dapat dipahami sebagai 'suara itu berbicara kepadanya'; ada pula yang memahami Musa sebagai subjek, 'Musa berbicara kepada-Nya.'
  rationale: Sumber suara yang disebut tepat sebelumnya dan konteks pewahyuan ilahi mendukung Allah sebagai subjek. Karena bahasa Ibrani tidak menyatakan subjek dengan nomina, alternatif-alternatif tersebut dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah tradisional yang masih mudah dipahami—Kemah Pertemuan, tabut Kesaksian, kerub—dipertahankan. Nama Musa diulangi untuk menghindari rangkaian pronomina Indonesia yang kabur, sedangkan ambiguitas asli yang bermakna dijelaskan melalui catatan kaki.
