translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dipertahankan, sementara pengulangan 'yang beratnya' dipakai demi kejelasan. Istilah 'syikal' dipertahankan sebagai satuan berat kuno; 'tempat kudus' mempertahankan acuan kultis teks sumber.
