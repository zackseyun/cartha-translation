base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] yang beratnya seratus tiga puluh syikal, dan satu bokor perak yang beratnya tujuh puluh syikal, menurut syikal tempat kudus[b]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak sebagai persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nampan”; kata Ibrani ini menunjuk pada wadah yang lebar dan relatif dangkal.
    reason: lexical_alternative
  - marker: b
    text: Artinya, menurut standar berat resmi yang digunakan di tempat kudus.
    reason: cultural_clarification
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן dalam konteks ibadah menunjuk pada persembahan yang dibawa mendekat. Bentuk ini alami dalam daftar persembahan dan tetap mencerminkan hubungan kepunyaan pada sufiks Ibrani.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קַעֲרָה menunjuk pada wadah yang lebar dan relatif dangkal; 'pinggan' mempertahankan bentuk umum itu dan sesuai dengan register Indonesia yang bermartabat.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: Menyampaikan keterangan berat secara alami tanpa mengubah urutan informasi dalam teks Ibrani.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah ritual, tetapi fungsi khususnya tidak dinyatakan dalam ayat ini. 'Bokor' membedakannya dari wadah dangkal sebelumnya tanpa menambahkan fungsi penyiraman darah.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: yang beratnya tujuh puluh syikal
  rationale: Menjelaskan bahwa angka tersebut merupakan berat bokor, sebagaimana dituntut oleh susunan inventaris Ibrani.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Ungkapan ini mempertahankan acuan pada standar berat resmi yang berkaitan dengan tempat kudus.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Keduanya penuh
  rationale: Bentuk dual Ibrani secara eksplisit mengacu pada kedua wadah.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: סֹלֶת adalah tepung bermutu tinggi yang digunakan dalam persembahan; 'tepung terbaik' jelas bagi pembaca modern dan tidak bergantung pada pemahaman teknis tentang tingkat kehalusan gilingan.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Mencerminkan partisip pasif dan menyatakan secara jelas bahwa tepung telah dicampur dengan minyak.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks imamat, מִנְחָה adalah kategori persembahan berbahan hasil tanaman. 'Persembahan sajian' mempertahankan istilah kultis yang lazim sambil membedakannya dari persembahan umum.
