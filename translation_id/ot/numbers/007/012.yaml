  text: וַ/יְהִ֗י הַ/מַּקְרִ֛יב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן אֶת קָרְבָּנ֑/וֹ נַחְשׁ֥וֹן בֶּן עַמִּינָדָ֖ב לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: id
  text: Pada hari pertama, orang yang mempersembahkan persembahannya adalah Nahason anak Aminadab, dari suku Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pada hari pertama, Nahason anak Aminadab dari suku Yehuda mempersembahkan persembahannya.” Partisipel Ibrani dapat diterjemahkan sebagai anak kalimat seperti dalam teks atau sebagai kata kerja utama tanpa mengubah maksudnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ialah
  rationale: Bentuk naratif וַיְהִי mengantar pernyataan tentang siapa yang tampil pada hari pertama; dalam bahasa Indonesia modern, konstruksi dengan 'ialah' menyampaikan fungsi kopulanya tanpa ungkapan arkais seperti 'maka terjadilah'.
- source_word: הַמַּקְרִיב
  choice: yang mempersembahkan
  rationale: Partisipel Hifil dari קרב menunjuk kepada orang yang membawa atau menyajikan persembahan. 'Mempersembahkan' alami dalam konteks ibadah dan mempertahankan nuansa kultisnya.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: pada hari pertama
  rationale: Padanan temporal yang baku dan alami untuk frasa Ibrani ini.
- source_word: אֶת קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן merupakan istilah kultis bagi sesuatu yang dibawa sebagai persembahan; 'persembahan' tepat bagi konteks pentahbisan Kemah Suci.
- source_word: נַחְשׁוֹן
  choice: Nahason
  rationale: Nama ditransliterasikan dalam bentuk Indonesia yang lazim dipakai dalam tradisi Alkitab berbahasa Indonesia.
- source_word: בֶּן עַמִּינָדָב
  choice: bin Aminadab
  rationale: '''Bin'' merupakan bentuk patronimik yang ringkas, jelas, dan lazim dalam bahasa Indonesia untuk ''anak laki-laki dari''.'
- source_word: לְמַטֵּה יְהוּדָה
  choice: mewakili suku Yehuda
  rationale: Prefiks לְ dapat menandai hubungan atau perwakilan. Dalam konteks para pemimpin suku yang membawa persembahan, 'mewakili' menyatakan fungsi Nahason secara alami tanpa meniadakan kemungkinan terjemahan afiliasi.
