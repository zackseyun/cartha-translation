translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mendahulukan keterangan waktu agar narasinya alami. 'Mewakili suku Yehuda' dipilih untuk menjelaskan fungsi לְ dalam konteks, sedangkan kemungkinan hubungan keanggotaan dipertahankan dalam catatan kaki.
