  text: Pada hari kelima, Selumiel anak Zurisyadai, pemimpin bani Simeon,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Pada hari kelima
  rationale: Ungkapan waktu dengan bilangan tingkat ini paling wajar diterjemahkan demikian; konteks seperti 'penahbisan' tidak ditambahkan karena tidak tersurat dalam ayat.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks Bilangan 7, kata ini menunjuk kepada kepala yang diakui dalam suatu suku; 'pemimpin' jelas dan tidak menyiratkan kedudukan raja.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: bani Simeon
  rationale: Ungkapan ini mempertahankan gagasan keturunan sekaligus afiliasi kesukuan dalam bentuk Indonesia yang ringkas dan lazim dalam register Alkitab.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia yang lazim.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian nama patronimik, 'anak' merupakan padanan Indonesia yang alami dan tepat.
- source_word: צוּרִישַׁדָּי
  choice: Zurisadai
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia yang lazim.
