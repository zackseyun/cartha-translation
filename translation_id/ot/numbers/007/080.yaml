  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/080.yaml
  text: one golden dish of ten shekels[a], full of incense[b];
translation:
  language: id
  text: satu cawan emas seberat sepuluh syikal[a], penuh dengan dupa[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “satu cawan emas, sepuluh emas, penuh dengan dupa”; satuan “syikal” dipahami dari rumusan daftar persembahan dalam pasal ini.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani כַּף kadang-kadang diterjemahkan “sendok”; di sini kata itu menunjuk pada cawan atau wadah kecil yang digunakan untuk dupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks persembahan Kemah Suci, kata ini menunjuk pada wadah kecil untuk menampung dupa, bukan telapak tangan. “Cawan” alami dalam bahasa Indonesia dan tidak memberi kesan alat makan seperti “sendok”.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang sesuai dengan nomina feminin כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: seberat sepuluh syikal
  rationale: Rangkaian ini bersifat eliptis; berdasarkan rumusan daftar persembahan yang berulang dalam pasal ini, satuan berat syikal tersirat. Kata “seberat” memperjelas bahwa sepuluh syikal menyatakan berat wadah.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan wadah tersebut.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Adjektiva predikatif yang menerangkan isi wadah; bentuk ini alami dan dekat dengan susunan sumber.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku dan mudah dipahami untuk bahan harum yang dipersembahkan dalam konteks ibadah Israel.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. “Cawan” dipilih sebagai istilah bermartabat serta mudah dipahami untuk wadah upacara kecil; “syikal” dipertahankan sebagai satuan berat kuno yang lazim dalam terjemahan Alkitab Indonesia.
