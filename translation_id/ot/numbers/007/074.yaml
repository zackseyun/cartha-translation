lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks persembahan Kemah Suci, kata ini menunjuk pada wadah kecil, bukan telapak tangan atau alat makan. “Cawan” alami dalam bahasa Indonesia dan sesuai dengan daftar perlengkapan ibadah.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang menerangkan kata benda feminin כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: seberat sepuluh syikal
  rationale: Teks Ibrani secara harfiah menyebut “sepuluh [dari] emas” tanpa satuan. Berdasarkan rumusan persembahan yang berulang dalam konteks ini, satuan berat “syikal” tersirat; “seberat” memperjelas bahwa angka itu menyatakan bobot cawan.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan pembuat cawan; bentuk nomina atributif “emas” paling wajar dalam bahasa Indonesia.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Menggambarkan keadaan cawan beserta isinya secara ringkas dan alami.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku untuk bahan harum yang dipersembahkan dalam ibadah di tempat kudus.
