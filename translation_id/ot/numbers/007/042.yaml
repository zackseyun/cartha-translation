  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: id
  text: 'Pada hari keenam, pemimpin bani Gad adalah Elyasaf, anak Deuel[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani di ayat ini, nama itu tertulis “Deuel”; bandingkan ayat-ayat lain yang memuat bentuk “Reuel”.
