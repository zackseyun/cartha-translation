lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: Pada hari keenam
  rationale: Ungkapan waktu Ibrani ini secara alami menyatakan hari urutan keenam dalam rangkaian persembahan.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks Bilangan 7, kata ini menunjuk kepada kepala resmi suatu suku; 'pemimpin' jelas dan tidak menimbulkan kesan gelar kerajaan.
- source_word: לִבְנֵי גָד
  choice: bani Gad
  rationale: Pilihan ini mempertahankan idiom keturunan/suku dalam bahasa Ibrani sekaligus terdengar wajar dalam ragam Alkitab bahasa Indonesia.
- source_word: אֶלְיָסָף
  choice: Elyasaf
  rationale: Nama pribadi ditransliterasikan dari bentuk Ibrani.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah nama, 'anak' merupakan padanan Indonesia yang alami untuk patronimik Ibrani.
- source_word: דְּעוּאֵל
  choice: Deuel
  rationale: Bentuk teks Ibrani pada ayat ini adalah דְּעוּאֵל, sehingga ditransliterasikan 'Deuel'.
