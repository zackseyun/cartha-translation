  text: satu ekor kambing jantan untuk kurban penghapus dosa;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai kurban penghapus dosa.”
    reason: Prefiks לְ dapat dipahami sebagai penanda tujuan (‘untuk’) atau peran persembahan (‘sebagai’) dalam daftar kurban ini.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: kambing jantan
  rationale: Frasa konstruksi ini secara harfiah berarti ‘yang berbulu dari antara kambing-kambing’ dan secara idiomatis menunjuk pada kambing jantan. Pilihan ini jelas, alami, dan mempertahankan kekhususan hewan kurban.
- source_word: אֶחָד
  choice: satu ekor
  rationale: Bilangan ‘satu’ dinyatakan secara eksplisit dalam teks Ibrani. Kata penggolong ‘ekor’ menghasilkan bentuk Indonesia yang alami sekaligus mempertahankan gaya daftar persembahan yang berulang dalam Bilangan 7.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks persembahan, חַטָּאת menunjuk pada jenis kurban ritual, bukan sekadar dosa secara abstrak. ‘Kurban penghapus dosa’ menyampaikan fungsi dan kategori persembahan tersebut dalam bahasa Indonesia yang lazim.
