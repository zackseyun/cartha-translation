translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan inventaris dipertahankan, sementara pengulangan “mezbah” dipakai untuk menghindari acuan pronomina yang kabur. Istilah wadah dipilih agar mudah dibedakan dan dipahami, dengan ketidakpastian leksikal dijelaskan dalam catatan kaki.
