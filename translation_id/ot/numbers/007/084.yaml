base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: id
  text: 'Inilah persembahan pentahbisan mezbah pada hari mezbah itu diurapi,[a] yang diberikan oleh para pemimpin[b] Israel: dua belas piring perak, dua belas mangkuk perak, dan dua belas sendok emas.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Inilah pentahbisan mezbah.” Dalam konteks ini, ungkapan tersebut merangkum persembahan yang dibawa untuk pentahbisan mezbah.'
    reason: lexical_alternative
  - marker: b
    text: Atau “para kepala suku”. Istilah Ibrani ini menunjuk kepada para pemimpin suku Israel yang diakui.
    reason: lexical_alternative
  - marker: c
    text: Nama-nama ketiga jenis wadah ini tidak dapat dipastikan secara tepat. Istilah-istilahnya juga dapat diterjemahkan “piring besar perak”, “bokor perak”, dan “wadah emas” atau “cedok emas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Inilah persembahan untuk pentahbisan mezbah
  rationale: Secara harfiah frasa ini berarti “Inilah pentahbisan mezbah.” Namun, konteksnya merangkum benda-benda yang dipersembahkan untuk pentahbisan itu. Penambahan “persembahan untuk” menyatakan makna yang tersirat tanpa mengubah fungsi frasa sebagai rangkuman.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: pada hari mezbah itu diurapi
  rationale: Ungkapan waktu diterjemahkan secara alami, dan penyebutan ulang “mezbah” memperjelas acuan pronomina tanpa menambah gagasan baru.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: yang diberikan oleh para pemimpin Israel
  rationale: מֵאֵת menunjukkan sumber pemberian. נָשִׂיא dalam kitab Bilangan menunjuk kepada para pemimpin suku; “pemimpin” lebih jelas dalam bahasa Indonesia modern daripada istilah yang dapat menyiratkan gelar kebangsawanan.
- source_word: קַעֲרֹת כֶּסֶף
  choice: pinggan perak
  rationale: קְעָרָה menunjuk pada wadah lebar seperti pinggan atau piring besar. “Pinggan” membedakannya dari jenis wadah berikutnya.
- source_word: מִזְרְקֵי כֶסֶף
  choice: mangkuk perak
  rationale: מִזְרָק adalah mangkuk atau baskom yang digunakan dalam konteks ibadah. “Mangkuk” merupakan padanan modern yang mudah dipahami.
- source_word: כַּפּוֹת זָהָב
  choice: cawan emas
  rationale: כַּף dapat menunjuk pada wadah kecil berbentuk cekung, termasuk sendok atau cawan. Dalam daftar perlengkapan persembahan ini, “cawan” merupakan padanan yang alami, tetapi bentuk tepat benda itu tidak dapat dipastikan.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: dua belas
  rationale: Bilangan kardinal diterjemahkan langsung; perbedaan gender gramatikal Ibrani tidak perlu dinyatakan dalam bahasa Indonesia.
