  to: 'Inilah persembahan pentahbisan mezbah pada hari mezbah itu diurapi,[a] yang diberikan oleh para pemimpin[b] Israel: dua belas piring perak, dua belas mangkuk perak, dan dua belas sendok emas.[c]'
