source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: id
  text: Jumlah seluruh ternak untuk kurban persekutuan[a] ialah dua puluh empat ekor sapi jantan, enam puluh ekor domba jantan, enam puluh ekor kambing jantan, dan enam puluh ekor anak domba berumur setahun. Itulah pentahbisan mezbah setelah mezbah itu diurapi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban kesejahteraan” atau “kurban damai.”
    reason: Alternatif leksikal bagi שְׁלָמִים, yang dapat menekankan kesejahteraan/keutuhan atau damai; bukan kategori kurban pendamaian.
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: Jumlah seluruh ternak
  rationale: Ungkapan ini memperkenalkan jumlah keseluruhan hewan ternak besar dalam kategori kurban tersebut. 'Jumlah seluruh' menyampaikan fungsi rangkuman וְכֹל secara alami, sedangkan 'ternak' cukup luas untuk kolektif בְּקַר sebelum rinciannya menyebut sapi jantan.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban persekutuan
  rationale: זֶבַח menunjuk kurban sembelihan, sedangkan שְׁלָמִים adalah kategori kurban yang berkaitan dengan damai, kesejahteraan, dan persekutuan. 'Kurban persekutuan' merupakan istilah Indonesia yang alami dan menonjolkan sifat perjamuan bersama tanpa menutup alternatif 'kurban keselamatan' atau 'kurban pendamaian'.
- source_word: פָּרִים
  choice: sapi jantan
  rationale: Dalam konteks kurban, bentuk jamak ini menunjuk sapi jantan; teks tidak mengharuskan tambahan 'muda'.
- source_word: אֵילִם
  choice: domba jantan
  rationale: Padanan Indonesia modern dan jelas bagi domba jantan yang dipersembahkan.
- source_word: עַתֻּדִים
  choice: kambing jantan
  rationale: Kata ini secara khusus menunjuk kambing jantan, sehingga jenis kelaminnya dipertahankan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: anak domba berumur setahun
  rationale: Mempertahankan jenis hewan dan ketentuan usia yang penting dalam konteks kurban.
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Itulah persembahan pentahbisan mezbah
  rationale: Dalam konteks rangkuman daftar persembahan, חֲנֻכָּה menunjuk pentahbisan atau persembahan yang menyertai pentahbisan. Penambahan 'persembahan' membuat acuan demonstratif kepada jumlah hewan menjadi jelas dalam bahasa Indonesia.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: setelah mezbah itu diurapi
  rationale: Bentuk ini menyatakan waktu sesudah pengurapan. Mengulangi 'mezbah' menghindari ambiguitas pronomina Indonesia dan tidak menambahkan pelaku yang tidak dinyatakan oleh teks.
theological_decisions:
- issue: Makna kategori kurban שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan; kurban pendamaian
  rationale: Istilah Ibrani ini dapat menonjolkan damai, kesejahteraan/keutuhan, atau persekutuan. 'Kurban persekutuan' dipilih karena alami dalam terminologi Alkitab bahasa Indonesia dan sesuai dengan aspek perjamuan bersama, sementara alternatif yang sah dicatat agar keluasan maknanya tidak disempitkan secara diam-diam.
- issue: Cakupan חֲנֻכַּת הַמִּזְבֵּחַ
  choice: persembahan pentahbisan mezbah
  alternative: pentahbisan mezbah
  rationale: Secara leksikal frasa itu dapat berarti 'pentahbisan mezbah', tetapi konteks langsung sedang merangkum jumlah persembahan. 'Persembahan pentahbisan' menjaga kaitan demonstratif dengan daftar tersebut tanpa menjadikannya klaim doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bilangan ditulis dengan kata agar alur naratif alami; kata penggolong 'ekor' digunakan untuk kejelasan. 'Mezbah' dipertahankan sebagai istilah Alkitab yang telah dikenal luas.
