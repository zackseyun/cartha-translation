  terminology: “Kurban persekutuan” dapat dipertahankan sebagai istilah kategori kurban yang lazim. Catatan kaki sebaiknya memberi alternatif yang mencerminkan nuansa damai atau kesejahteraan/keutuhan, bukan “pendamaian,” yang dapat menggeser kategori ini ke arah kurban penebus salah.
