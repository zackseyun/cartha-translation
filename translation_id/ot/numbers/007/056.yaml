  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: id
  text: satu cawan emas seberat sepuluh syikal[a], penuh dengan dupa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “satu cawan emas, sepuluh [syikal], penuh dengan dupa.” Teks Ibrani tidak menyebutkan satuan berat di sini, tetapi dalam rumusan persembahan yang berulang ini, yang dimaksud ialah sepuluh syikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks persembahan Kemah Suci, kata ini menunjuk pada wadah kecil untuk dupa. “Cawan” alami dalam bahasa Indonesia dan tidak menyiratkan alat makan seperti “sendok”.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang sesuai dengan nomina feminin כַּף.
- source_word: עֲשָׂרָה
  choice: sepuluh syikal
  rationale: Teks Ibrani menyebut “sepuluh” tanpa menyatakan satuan, tetapi rumusan persembahan yang berulang dalam Bilangan 7 menunjukkan bahwa satuan berat yang dimaksud ialah syikal; satuan itu ditambahkan demi kejelasan.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan pembuat cawan.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Ungkapan predikatif yang secara alami menjelaskan isi wadah.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku dan mudah dipahami untuk bahan harum yang dibakar dalam ibadah.
