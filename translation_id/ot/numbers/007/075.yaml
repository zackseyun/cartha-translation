  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: sapi jantan dari kawanan
  rationale: פַּר menunjuk pada sapi jantan, sedangkan בֶּן בָּקָר secara idiomatis menegaskan bahwa hewan itu berasal dari kawanan ternak; ungkapan ini alami dalam bahasa Indonesia dan tidak mengulang arti secara kaku.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia berulang dipertahankan untuk setiap hewan; penggolong 'ekor' merupakan bentuk alami dalam bahasa Indonesia.
- source_word: אַיִל
  choice: domba jantan
  rationale: Istilah ini secara khusus menunjuk pada domba jantan dewasa dalam daftar kurban.
- source_word: כֶּבֶשׂ
  choice: anak domba jantan
  rationale: כֶּבֶשׂ menunjuk pada anak domba dan dalam rumusan kurban ini berjenis kelamin jantan.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Ungkapan Ibrani ini menyatakan umur hewan; terjemahan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan ringkas dan lazim, sedangkan לְ menyatakan fungsi hewan-hewan tersebut.
