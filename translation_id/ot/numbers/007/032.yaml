  language: id
  text: satu cawan emas seberat sepuluh syikal[a], penuh dengan dupa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah bahasa Ibrani berbunyi, “satu cawan, sepuluh, emas, penuh dengan dupa”; kata “syikal” dilengkapi berdasarkan rumus persembahan yang berulang dalam konteks sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam daftar persembahan untuk Kemah Suci, kata ini menunjuk pada wadah kecil untuk menampung dupa, bukan telapak tangan. “Cawan” alami dan cukup konkret dalam bahasa Indonesia.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang menerangkan kata benda feminin כַּף.
- source_word: עֲשָׂרָה
  choice: seberat sepuluh syikal
  rationale: Teks Ibrani secara harfiah hanya menyebut “sepuluh”, tetapi satuan berat dipahami dari rumus persembahan berulang dalam konteks sekitar. Penambahan “seberat” dan “syikal” memperjelas bahwa angka itu menyatakan bobot.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan wadah tersebut; “cawan emas” merupakan ungkapan Indonesia yang wajar.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Menggambarkan keadaan wadah beserta isinya secara ringkas dan alami.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku bagi bahan harum yang dipersembahkan dalam konteks peribadatan Kemah Suci.
