  register: Bahasa Indonesia baku modern dengan susunan naratif yang lancar. ‘Orang-orang Lewi’ dipilih agar mudah dipahami pembaca umum, dan pengulangan ‘lalu ... kemudian’ mencerminkan urutan tindakan tanpa terasa kaku.
