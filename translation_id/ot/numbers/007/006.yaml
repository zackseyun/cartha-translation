translation:
  language: id
  text: Lalu Musa mengambil gerobak-gerobak[a] dan ternak itu[b], lalu memberikannya kepada orang-orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: pedati-pedati.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: ternak; konteks pasal ini menunjukkan lembu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk Qal wayyiqtol dari לקח pada dasarnya berarti ‘mengambil’. Dalam konteks ini Musa menerima barang-barang yang baru dipersembahkan dengan mengambilnya ke dalam penguasaannya.
- source_word: הָעֲגָלֹת
  choice: kereta-kereta
  rationale: עגלה menunjuk pada kendaraan angkut. ‘Kereta’ merupakan padanan Indonesia yang jelas dan cukup luas; ‘pedati’ juga mungkin, tetapi memberi gambaran bentuk kendaraan yang lebih khusus.
- source_word: הַבָּקָר
  choice: ternak itu
  rationale: בקר adalah kata benda kolektif bagi hewan ternak besar. Terjemahan ini mempertahankan keluasan istilah Ibrani, sedangkan konteks pasal ini menunjukkan bahwa yang dimaksud ialah lembu.
- source_word: וַיִּתֵּן
  choice: memberikannya
  rationale: Bentuk Qal wayyiqtol dari נתן secara langsung berarti ‘memberikan’. Bentuk dengan enklitik ‘-nya’ secara alami merujuk kembali kepada kereta-kereta dan ternak sebagai satu keseluruhan.
- source_word: אֹתָם
  choice: -nya
  rationale: Pronomina objek jamak maskulin ini merujuk secara kolektif kepada kereta-kereta dan ternak. Dalam bahasa Indonesia, enklitik ‘-nya’ merupakan rujukan yang alami tanpa perlu menandai jumlah.
- source_word: אֶל־הַלְוִיִּם
  choice: kepada orang-orang Lewi
  rationale: אֶל menyatakan arah atau penerima pemindahan. ‘Kepada’ mempertahankan gagasan bahwa Musa menyerahkan barang-barang itu kepada kaum Lewi.
