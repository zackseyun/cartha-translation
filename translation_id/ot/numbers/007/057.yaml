  yaml_path: translation/ot/numbers/007/057.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: id
  text: seekor lembu jantan dari kawanan sapi[a], seekor domba jantan, dan seekor anak domba jantan berumur satu tahun, sebagai kurban bakaran;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “seekor lembu jantan, anak kawanan sapi.” Ungkapan ini berarti lembu jantan dari kawanan ternak sapi dan sering diterjemahkan “seekor lembu jantan muda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: lembu jantan
  rationale: Dalam daftar kurban, פַּר menunjuk pada lembu jantan, sering kali yang masih muda. Pilihan ini jelas dan alami dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan satu dinyatakan secara alami melalui kata penggolong seekor pada setiap hewan dalam daftar.
- source_word: בֶּן בָּקָר
  choice: dari kawanan sapi
  rationale: Ungkapan harfiah 'anak kawanan sapi' secara idiomatis menggolongkan hewan itu sebagai ternak sapi; terjemahan ini mempertahankan unsur tersebut tanpa pengulangan yang kaku.
- source_word: אַיִל
  choice: domba jantan
  rationale: Padanan baku dan jelas untuk domba jantan dewasa dalam konteks kurban.
- source_word: כֶּבֶשׂ
  choice: anak domba jantan
  rationale: Kata ini menunjuk pada anak domba, dan konteks kurban mendukung penyebutan jenis kelamin jantan secara eksplisit.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Padanan Indonesia yang alami bagi idiom Ibrani yang menyatakan usia hewan satu tahun.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah kurban yang lazim diterjemahkan 'kurban bakaran'; preposisi לְ menyatakan fungsi hewan-hewan itu sebagai persembahan tersebut.
