    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks perlengkapan ibadah, kata ini menunjuk pada wadah kecil untuk dupa, bukan telapak tangan. “Cawan” terdengar alami dan bermartabat dalam bahasa Indonesia serta tidak menyiratkan alat makan seperti “sendok”.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang sesuai dengan nomina feminin כַּף.
- source_word: עֲשָׂרָה
  choice: seberat sepuluh syikal
  rationale: Teks Ibrani hanya menyatakan “sepuluh”, tetapi rumusan persembahan yang berulang dalam konteks terdekat menunjukkan bahwa satuan berat “syikal” dipahami. Kata “seberat” memperjelas fungsi angka itu dalam bahasa Indonesia.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan pembuat wadah; bentuk pewatas “cawan emas” ringkas dan alami.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Adjektiva predikatif yang menerangkan wadah; “penuh dengan” merupakan padanan Indonesia yang alami sebelum menyebut isinya.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku untuk bahan harum yang dibakar dalam ibadah.
