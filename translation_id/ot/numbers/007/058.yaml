lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa konstruksi ini merupakan ungkapan bagi kambing jantan. Bentuk 'seekor kambing jantan' alami dalam bahasa Indonesia dan tetap menyatakan jenis serta jumlah hewan kurban.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan 'satu' dipadukan secara alami ke dalam penggolong 'seekor', yang tetap mempertahankan jumlah satu dalam gaya daftar persembahan.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks ritual, חַטָּאת menunjuk pada kurban yang menangani dosa atau kenajisan. Kata depan לְ menyatakan tujuan; 'untuk kurban penghapus dosa' jelas dan lazim, sementara nuansa pemurnian dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Pemadanan istilah kurban חַטָּאת dalam konteks ritual
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani ini dapat menyoroti dosa maupun pemurnian dari kenajisan, tetapi dalam rumusan daftar ini jelas menunjuk pada jenis kurban. Padanan utama memakai istilah yang mudah dikenali tanpa meniadakan alternatif yang sah, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur inventaris dipertahankan; tanda titik koma mengikuti konteks daftar berulang dalam Bilangan 7.
