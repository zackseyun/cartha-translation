base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: id
  text: Pada hari kesembilan, pemimpin bani Benyamin[a] ialah Abidan anak Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemimpin bagi bani Benyamin.” Preposisi Ibrani di sini dapat menyatakan hubungan dengan kelompok itu atau perwakilan bagi kelompok itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: Pada hari kesembilan
  rationale: Ungkapan waktu dengan preposisi ב diterjemahkan secara idiomatis dalam bahasa Indonesia dengan “pada”, sedangkan bentuk ordinal הַתְּשִׁיעִי diterjemahkan “kesembilan”.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks Bilangan 7, kata ini menunjuk kepada kepala yang diakui dari suatu suku. “Pemimpin” jelas dan tidak memberi kesan kerajaan seperti “pangeran”.
- source_word: לִבְנֵי בִנְיָמִן
  choice: bani Benyamin
  rationale: “Bani” merupakan istilah Indonesia yang ringkas dan mapan untuk kelompok keturunan melalui garis leluhur, sehingga mempertahankan corak kekeluargaan maskulin dari בְנֵי tanpa terdengar seolah-olah hanya menunjuk kepada anak kandung langsung.
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara langsung dan alami sebagai “anak”.
- source_word: גִּדְעֹנִי
  choice: Gideoni
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Sebutan kesukuan maskulin בְנֵי
  choice: bani Benyamin
  alternative: keturunan Benyamin; orang Benyamin
  rationale: Pilihan ini mempertahankan gambaran kelompok keturunan dari seorang leluhur laki-laki tanpa membatasi rujukannya hanya kepada putra-putra langsung atau menetralkan hubungan kekeluargaan yang dinyatakan teks.
- issue: Fungsi preposisi ל dalam לִבְנֵי בִנְיָמִן
  choice: pemimpin bani Benyamin
  alternative: pemimpin bagi bani Benyamin
  rationale: Preposisi tersebut dapat menandai hubungan dengan kelompok atau perwakilan bagi kelompok itu. Teks utama memakai ungkapan relasional yang alami, sementara kemungkinan representatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ialah” dipakai untuk melengkapi klausa nominal Ibrani secara alami. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar memiliki ambiguitas, yaitu “bani Benyamin”.
