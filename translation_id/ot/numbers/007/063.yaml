  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: id
  text: seekor lembu jantan[a], seekor domba jantan, dan seekor anak domba jantan berumur setahun, sebagai korban bakaran;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seekor lembu jantan muda.” Secara harfiah, frasa Ibrani ini mencakup ungkapan idiomatis “anak kawanan sapi,” yaitu hewan bovine dari kawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: sapi jantan muda
  rationale: Gabungan ini menunjuk pada seekor sapi jantan dari jenis lembu; dalam konteks persembahan, terjemahan ini alami dan menghindari ungkapan harfiah yang janggal, “anak kawanan sapi.”
- source_word: אַיִל
  choice: domba jantan
  rationale: Istilah baku untuk domba jantan dewasa dalam konteks kurban.
- source_word: כֶּבֶשׂ
  choice: anak domba jantan
  rationale: Menunjuk pada anak domba, dengan jenis kelamin jantan yang relevan dalam daftar hewan kurban.
- source_word: בֶּן־שְׁנָתוֹ
  choice: berumur setahun
  rationale: Padanan Indonesia yang jelas dan alami bagi idiom Ibrani yang menyatakan hewan itu berada dalam tahun pertamanya atau berumur satu tahun.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: עֹלָה adalah istilah teknis bagi persembahan yang dibakar seluruhnya; “kurban bakaran” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia ini diulang untuk setiap hewan; kata penggolong “seekor” menyampaikan jumlah satu secara alami dalam bahasa Indonesia.
