language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] yang beratnya seratus tiga puluh syikal, dan satu bokor perak[b] yang beratnya tujuh puluh syikal, menurut syikal kudus[c]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak sebagai persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring”; kata Ibrani ini menunjuk pada wadah perak yang lebar dan relatif dangkal.
    reason: lexical_alternative
  - marker: b
    text: Atau “mangkuk”; kata Ibrani ini menunjuk pada wadah yang digunakan dalam pelayanan kurban.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, menurut standar berat yang berlaku di tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן menunjuk pada sesuatu yang dipersembahkan dalam konteks ibadah. 'Persembahannya' merupakan padanan Indonesia yang baku, dan 'ialah' melengkapi klausa nominal Ibrani secara wajar.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קְעָרָה menunjuk pada wadah yang relatif lebar dan dangkal. 'Pinggan' mempertahankan gambaran bentuk itu serta cocok dengan gaya daftar perlengkapan ibadah.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: Susunan bilangan Ibrani secara harfiah adalah 'tiga puluh dan seratus'; urutannya disesuaikan dengan kaidah Indonesia tanpa mengubah jumlah, sedangkan מִשְׁקָלָהּ dinyatakan eksplisit sebagai 'yang beratnya'.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah yang digunakan dalam pelayanan kurban. 'Bokor' menyatakan wadah seperti mangkuk besar dan terdengar lebih seremonial daripada 'mangkuk' sehari-hari.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: yang beratnya tujuh puluh syikal
  rationale: Frasa ini menyatakan berat bokor; pengulangan 'yang beratnya' menghindari kesan bahwa tujuh puluh syikal adalah nilai atau kapasitasnya.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  rationale: Frasa ini menetapkan standar penimbangan resmi tempat kudus. 'Menurut syikal kudus' ringkas dan alami, dengan penjelasan budaya dalam catatan kaki.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Keduanya penuh dengan
  rationale: שְׁנֵיהֶם secara eksplisit merujuk pada kedua wadah. Klausa tanpa kopula diterjemahkan secara alami sebagai 'Keduanya penuh dengan'.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: סֹלֶת adalah tepung bermutu halus yang lazim dipakai untuk persembahan; 'tepung halus' merupakan padanan yang tepat dan mudah dipahami.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif בְּלוּלָה menyatakan bahwa tepung tersebut telah dicampur dengan minyak; bentuk relatif ini alami dalam bahasa Indonesia.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks hukum kurban, מִנְחָה adalah persembahan bahan pangan, khususnya tepung atau hasil biji-bijian. Istilah baku 'persembahan sajian' mempertahankan kategori ritualnya tanpa menyamakannya dengan persembahan secara umum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar dipertahankan, tetapi kalimat dibagi agar mudah dibaca. Istilah ritual 'persembahan sajian' dipakai secara konsisten; satuan 'syikal' dipertahankan sebagai istilah historis.
