  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: id
  text: 'dan untuk kurban persekutuan: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur satu tahun. Itulah persembahan Eliab anak Helon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים
  choice: dan untuk kurban persekutuan
  rationale: Prefiks וּ dan לְ melanjutkan daftar sebelumnya dan memperkenalkan jenis kurban. זֶבַח diterjemahkan 'kurban', sedangkan שְׁלָמִים diterjemahkan 'persekutuan', istilah yang alami dalam konteks ibadah dan mencerminkan perjamuan serta hubungan damai yang terkait dengan kurban ini.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif bagi ternak sapi dan di sini tidak menentukan jenis kelamin; 'dua ekor sapi' mempertahankan ketidakspesifikan itu secara alami dalam bahasa Indonesia.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus menunjuk pada domba jantan dewasa.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים secara khusus menunjuk pada kambing jantan, sehingga jenis kelaminnya dipertahankan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur satu tahun
  rationale: כְּבָשִׂים berbentuk maskulin dan dalam daftar kurban menunjuk pada anak domba jantan; בְּנֵי שָׁנָה adalah ungkapan usia yang secara alami diterjemahkan 'berumur satu tahun'.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Konstruksi demonstratif Ibrani merangkum daftar yang baru disebutkan. 'Itulah persembahan' alami dalam bahasa Indonesia dan mempertahankan daya tunjuk teks tanpa perlu mengubahnya menjadi bentuk lampau.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Eliab anak Helon
  rationale: Nama-nama ditransliterasikan, dan patronimik בֶּן diterjemahkan ringkas sebagai 'anak'.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan; kurban damai sejahtera
  rationale: Istilah Ibrani dapat menonjolkan kedamaian, kesejahteraan, atau persekutuan. 'Kurban persekutuan' dipilih karena jelas sebagai nama jenis kurban dan mudah dipahami, tanpa menyamakan שְׁלָמִים dengan keselamatan dalam arti soteriologis.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya daftar yang ringkas dan khidmat. Kata penggolong 'ekor' dipakai secara konsisten untuk kealamian. Tidak diperlukan catatan kaki karena alternatif bagi שְׁלָמִים dicatat dalam keputusan penerjemahan dan teks utama tetap jelas.
