  rationale: Dalam konteks persembahan, חַטָּאת lazim berfungsi sebagai istilah teknis bagi kurban yang berkaitan dengan dosa; awalan לְ menyatakan peruntukan atau tujuan.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kultis
  choice: kurban penghapus dosa
  alternative: untuk dosa
  rationale: Dalam daftar persembahan keimaman, חַטָּאת biasanya menunjuk pada jenis kurban, bukan hanya pada dosa secara abstrak. Terjemahan ini mempertahankan fungsi kultisnya tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, alami, ringkas, dan bermartabat. 'Kurban' dipilih sebagai ejaan baku modern; susunan mempertahankan gaya inventaris berulang dalam Bilangan 7.
