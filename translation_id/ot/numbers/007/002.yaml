base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: id
  text: Kemudian para pemimpin Israel, yaitu para kepala kelompok-kelompok keluarga menurut leluhur mereka[b], membawa persembahan[a]. Mereka adalah para pemimpin suku-suku; merekalah yang membawahi orang-orang yang terdaftar dalam sensus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mempersembahkan”. Kata Ibraninya secara harfiah berarti “membawa mendekat” dan dalam konteks ini menunjuk pada penyerahan pemberian untuk pentahbisan.
    reason: lexical_alternative
  - marker: b
    text: “Kelompok-kelompok keluarga menurut leluhur mereka” adalah unit kekerabatan atau klan dalam susunan masyarakat Israel.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “orang-orang yang telah dihitung” atau “orang-orang yang terdaftar”. Ungkapan Ibrani ini menunjuk pada kelompok yang dicatat dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: membawa persembahan
  rationale: Bentuk Hifil dari קרב secara harfiah berarti ‘membawa mendekat’ dan dalam konteks pentahbisan Kemah Suci menunjuk pada tindakan membawa atau mempersembahkan pemberian. ‘Membawa persembahan’ wajar dalam bahasa Indonesia dan menjelaskan objek yang tersirat tanpa menentukan jenisnya.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: para pemimpin Israel
  rationale: נָשִׂיא menunjuk pada pemimpin atau kepala kelompok. ‘Pemimpin’ merupakan padanan modern yang jelas dan tidak menimbulkan kesan bahwa mereka adalah putra raja.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: para kepala kaum keluarga leluhur mereka
  rationale: Ungkapan ini menunjuk pada unit kekerabatan berdasarkan garis leluhur. ‘Kaum keluarga leluhur’ menyampaikan struktur sosialnya secara alami dalam bahasa Indonesia tanpa mempertahankan ungkapan harfiah ‘rumah para ayah’ yang mudah disalahpahami.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: Mereka adalah para pemimpin suku-suku
  rationale: מַטּוֹת secara harfiah berarti ‘tongkat-tongkat’, tetapi di sini merupakan sebutan lazim bagi suku-suku Israel.
- source_word: הֵם הָעֹמְדִים עַל
  choice: merekalah yang membawahi
  rationale: Partisip עמד dengan עַל secara harfiah menggambarkan orang yang ‘berdiri di atas’ dan dalam konteks ini menyatakan tanggung jawab atau pengawasan. ‘Membawahi’ mempertahankan hubungan kewenangan itu dalam ungkapan Indonesia yang alami.
- source_word: הַפְּקֻדִים
  choice: orang-orang yang terdaftar dalam sensus
  rationale: Bentuk ini menunjuk pada mereka yang didata atau dihitung, khususnya dalam pencatatan umat pada pasal-pasal sebelumnya. Padanan ini mempertahankan latar sensus tanpa mempersempitnya secara tidak perlu menjadi pengerahan militer.
