base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] yang beratnya seratus tiga puluh syikal, dan satu bokor perak[b] yang beratnya tujuh puluh syikal, menurut syikal tempat kudus. Keduanya penuh dengan tepung halus yang dicampur dengan minyak sebagai persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mangkuk perak”; kata Ibrani קַעֲרָה menunjuk pada sebuah wadah, tetapi bentuk persisnya tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mangkuk pemercik”; kata Ibrani מִזְרָק menunjuk pada wadah ritual dan dapat menonjolkan fungsi pemercikannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: Dalam konteks kurban, קָרְבָּן berarti sesuatu yang dibawa dan dipersembahkan kepada Allah; 'persembahan' merupakan padanan Indonesia yang alami dan tepat.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קַעֲרָה menunjuk pada wadah, kemungkinan relatif ceper; 'pinggan' membedakannya dari מִזְרָק tanpa menyatakan bentuk yang terlalu spesifik.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: Mengungkapkan secara alami pernyataan Ibrani yang eksplisit tentang berat wadah tersebut.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah ritual, kerap berkaitan dengan pencurahan atau pemercikan; 'bokor' menyampaikan jenis wadah secara wajar tanpa mengunci fungsi tertentu.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: yang beratnya tujuh puluh syikal
  rationale: Frasa ini menyatakan berat bokor; pengulangan 'yang beratnya' memperjelas bahwa angka tersebut bukan kapasitas atau nilai.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  rationale: Formula ini menunjuk pada standar berat resmi yang terkait dengan tempat kudus; bentuk ringkas ini alami dalam bahasa Indonesia, dengan penjelasan dalam catatan kaki.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: keduanya penuh dengan
  rationale: Mempertahankan rujukan eksplisit kepada kedua wadah dan keadaan keduanya.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah baku untuk tepung bermutu dan digiling halus yang digunakan dalam persembahan.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif menyatakan bahwa tepung tersebut telah dicampur dengan minyak.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks imamat, מִנְחָה adalah kategori persembahan tanpa darah yang terutama berupa tepung atau hasil biji-bijian; 'persembahan sajian' merupakan istilah Indonesia yang ringkas dan tidak membatasi bahan hanya pada biji utuh.
