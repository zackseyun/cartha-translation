    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: sapi jantan
  rationale: פַּר menunjuk pada sapi jantan; pilihan ini alami dan tepat dalam konteks hewan kurban.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia yang diulang diterjemahkan dengan penggolong 'seekor' untuk mempertahankan bentuk daftar dan jumlah setiap hewan secara wajar dalam bahasa Indonesia.
- source_word: בֶּן בָּקָר
  choice: dari kawanan sapi
  rationale: Ungkapan harfiahnya 'anak kawanan/sapi' merupakan idiom bagi hewan bovina dari kawanan; terjemahan ini mempertahankan klasifikasinya tanpa ungkapan harfiah yang janggal.
- source_word: אַיִל
  choice: domba jantan
  rationale: Padanan baku dan jelas untuk domba jantan dewasa dalam konteks kurban.
- source_word: כֶּבֶשׂ
  choice: anak domba jantan
  rationale: כֶּבֶשׂ secara khusus menunjuk pada anak domba jantan; unsur jenis kelamin dipertahankan.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Idiom ini menyatakan usia hewan, yakni satu tahun atau berada dalam tahun pertamanya; bentuk utama dipilih karena alami dalam bahasa Indonesia.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya; 'sebagai' menyatakan fungsi hewan-hewan dalam daftar.
