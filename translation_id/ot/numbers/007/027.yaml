  text: seekor sapi jantan dari kawanan[a], seekor domba jantan, dan seekor anak domba jantan berumur satu tahun[b], sebagai kurban bakaran;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seekor sapi jantan, anak sapi.” Ungkapan Ibrani ini adalah idiom untuk hewan dari ternak sapi dan sering dipahami sebagai sapi jantan muda.
