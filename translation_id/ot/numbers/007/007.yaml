  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: id
  text: Ia memberikan dua kereta[a] dan empat ekor lembu[b] kepada keturunan Gerson, sesuai dengan tugas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dua gerobak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “empat ekor sapi jantan.” Bahasa Ibrani memakai istilah kolektif untuk hewan bovine.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: kereta
  rationale: Kata עֲגָלָה menunjuk pada kereta beroda untuk mengangkut barang; 'kereta' alami dalam bahasa Indonesia dan sesuai dengan konteks pengangkutan Kemah Suci.
- source_word: הַבָּקָר
  choice: lembu
  rationale: Kata בָּקָר merupakan istilah kolektif bagi ternak sapi. Dalam konstruksi dengan angka, 'empat ekor lembu' menyampaikan jumlah hewan secara alami tanpa menentukan jenis kelamin atau menambahkan penafsiran bahwa semuanya lembu jantan kebiri.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: kepada keturunan Gerson
  rationale: Secara harfiah berarti 'kepada anak-anak Gerson'; dalam konteks kelompok suku/kaum, 'keturunan Gerson' lebih alami dalam bahasa Indonesia sekaligus mempertahankan hubungan genealogis.
- source_word: כְּפִי עֲבֹדָתָם
  choice: sesuai dengan tugas mereka
  rationale: Ungkapan כְּפִי berarti 'sesuai dengan', sedangkan עֲבֹדָה di sini menunjuk pada pelayanan atau pekerjaan yang ditugaskan dalam Kemah Suci. 'Tugas' jelas dan alami dalam konteks pembagian sarana kerja.
- source_word: נָתַן
  choice: Ia memberikan
  rationale: Menerjemahkan arti lugas verba 'memberikan' tanpa menambahkan gagasan 'menugaskan' atau 'mengalokasikan' yang hanya tersirat oleh konteks.
