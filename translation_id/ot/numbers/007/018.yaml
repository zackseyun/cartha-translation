  yaml_path: translation/ot/numbers/007/018.yaml
  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: id
  text: Pada hari kedua, Netaneel anak Zuar, pemimpin suku Isakhar, mempersembahkan persembahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani hanya mengatakan “mempersembahkan”; kata “persembahannya” dilengkapi berdasarkan konteks berulang dalam Bilangan 7, ketika setiap pemimpin suku mempersembahkan persembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Pada hari kedua
  rationale: Frasa temporal dengan ב dan bilangan bertingkat diterjemahkan secara alami tanpa menambahkan peristiwa yang tidak disebutkan dalam ayat ini.
- source_word: הִקְרִיב
  choice: mempersembahkan persembahannya
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa atau menyajikan sesuatu sebagai persembahan. Objek yang tidak dinyatakan dalam ayat ini dilengkapi dari pola berulang dalam Bilangan 7 agar kalimat Indonesia tidak terasa menggantung, dan penambahan itu dijelaskan dalam catatan kaki.
- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Nama Ibrani ditransliterasikan ke bentuk yang jelas dan lazim dibaca dalam bahasa Indonesia.
- source_word: בֶּן צוּעָר
  choice: anak Zuar
  rationale: Konstruksi silsilah Ibrani diterjemahkan dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: נְשִׂיא
  choice: pemimpin suku
  rationale: Dalam konteks ini נָשִׂיא menunjuk kepada pemimpin resmi suatu suku, bukan pangeran kerajaan. Kata 'suku' memperjelas hubungan dengan Isakhar.
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Nama suku ditransliterasikan dalam bentuk Indonesia yang mudah dikenali.
