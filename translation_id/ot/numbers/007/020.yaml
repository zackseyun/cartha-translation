lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini menunjuk pada wadah kecil, bukan telapak tangan. “Cawan” alami dalam bahasa Indonesia dan tidak memberi kesan sendok makan.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang sesuai dengan nomina feminin כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: emas seberat sepuluh syikal
  rationale: Teks Ibrani secara harfiah menyebut “sepuluh [dari] emas”; satuan berat “syikal” dilesapkan tetapi tersirat oleh rumus persembahan dalam ayat-ayat sekitarnya. Susunan ini memperjelas bahwa sepuluh syikal adalah berat emas pada cawan.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Menerjemahkan adjektiva predikatif yang menyatakan isi wadah secara alami.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Istilah Indonesia yang lazim untuk bahan harum yang dibakar dalam ibadah di Kemah Suci.
