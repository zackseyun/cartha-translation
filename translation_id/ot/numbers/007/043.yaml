base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] yang beratnya seratus tiga puluh syikal, dan satu bokor perak[b] yang beratnya tujuh puluh syikal, menurut syikal tempat kudus[c]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak untuk persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring” (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: Atau “mangkuk”; מִזְרָק adalah wadah ritual.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menurut syikal tempat kudus,” yaitu berdasarkan standar berat yang berlaku di tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן menunjuk pada persembahan yang dibawa dalam konteks ibadah. 'Persembahannya' jelas dan alami; 'ialah' melengkapi klausa nominal Ibrani.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קְעָרָה adalah wadah menyerupai pinggan atau piring. 'Pinggan' merupakan padanan Indonesia yang konkret dan wajar, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: Mengungkapkan secara alami keterangan eksplisit tentang berat wadah, dengan urutan bilangan yang lazim dalam bahasa Indonesia.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah ritual, mungkin untuk menampung atau memercikkan cairan. 'Bokor' membedakannya dari pinggan pertama tanpa menambahkan fungsi yang tidak dinyatakan dalam ayat.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: yang beratnya tujuh puluh syikal
  rationale: Frasa tersebut menyatakan berat bokor; bentuk ini jelas dan sejajar dengan keterangan berat wadah pertama.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Formula ini menunjuk pada standar berat yang berlaku di tempat kudus. Terjemahan mempertahankan istilah konkret 'syikal' dan menjelaskan maksud standarnya melalui catatan kaki.
- source_word: שְׁנֵיהֶם
  choice: Keduanya
  rationale: Mempertahankan rujukan eksplisit kepada kedua wadah.
- source_word: מְלֵאִים
  choice: penuh dengan
  rationale: Padanan langsung dan alami untuk kata sifat Ibrani yang berarti 'penuh'.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: סֹלֶת adalah tepung bermutu tinggi yang dipakai untuk persembahan. 'Tepung terbaik' alami dalam bahasa Indonesia dan tidak memaksakan rincian teknis proses penggilingan.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Mencerminkan bentuk pasif yang menyatakan bahwa tepung telah dicampur dengan minyak.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה menunjuk pada persembahan berbahan hasil bumi atau tepung. 'Persembahan sajian' mempertahankan istilah kultis yang sudah dikenal dan membedakannya dari persembahan secara umum.
