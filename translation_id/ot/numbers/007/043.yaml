  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dipecah menjadi dua agar daftar wadah dan isinya mudah dipahami, tanpa menghilangkan hubungan unsur-unsur dalam teks Ibrani. Istilah 'syikal' dipertahankan sebagai satuan berat kuno.
