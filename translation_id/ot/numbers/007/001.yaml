source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: id
  text: Pada hari ketika Musa selesai mendirikan Kemah Suci[a], ia mengurapi dan menguduskannya, bersama seluruh perlengkapannya, serta mazbah dan seluruh perkakasnya. Ia mengurapi dan menguduskan semuanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika Musa telah selesai mendirikan Kemah Suci.” Ungkapan waktu dalam bahasa Ibrani dapat diterjemahkan secara lebih idiomatis demikian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada hari
  rationale: Dalam bahasa Ibrani, bentuk naratif ini mengantar peristiwa baru. Dalam bahasa Indonesia, fungsi tersebut dapat disampaikan secara alami melalui keterangan waktu pembuka tanpa menerjemahkan secara kaku sebagai 'terjadilah'.
- source_word: בְּיוֹם כַּלּוֹת
  choice: Pada hari ... selesai
  rationale: Gabungan preposisi, 'hari', dan infinitif menyatakan latar waktu. Pilihan ini mempertahankan idiom harfiahnya, sedangkan catatan kaki memberikan kemungkinan temporal yang lebih umum.
- source_word: לְהָקִים
  choice: mendirikan
  rationale: Bentuk Hifil dari קום dalam konteks kemah berarti memasang atau mendirikan bangunan kemah.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah ini jelas dan lazim dipahami dalam bahasa Indonesia untuk tempat kudus Israel di padang gurun, sekaligus mencerminkan fungsi משכן sebagai tempat kediaman suci.
- source_word: וַיִּמְשַׁח
  choice: mengurapi
  rationale: משׁח adalah kata kerja baku untuk pengurapan dengan minyak dalam upacara penahbisan atau pengudusan.
- source_word: וַיְקַדֵּשׁ
  choice: menguduskan
  rationale: Dalam konteks peribadatan, קדשׁ berarti mengkhususkan bagi penggunaan suci; 'menguduskan' mempertahankan kosakata kekudusan sumber.
- source_word: כָּל כֵּלָיו (Kemah Suci)
  choice: seluruh perlengkapannya
  rationale: כֵּלִים di sini mencakup berbagai benda dan peralatan Kemah Suci secara luas, sehingga 'perlengkapan' lebih tepat daripada 'perkakas'.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: '''Mazbah'' merupakan padanan baku dan ringkas dalam bahasa Indonesia untuk tempat mempersembahkan kurban.'
- source_word: כָּל כֵּלָיו (mazbah)
  choice: seluruh perkakasnya
  rationale: Pada kemunculan kedua, kata ini menunjuk secara lebih khusus kepada alat-alat yang digunakan bersama mazbah.
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: Ia juga mengurapi dan menguduskan mazbah beserta seluruh perkakasnya
  rationale: Pengulangan verbal Ibrani dipertahankan, tetapi objek jamak dinyatakan kembali agar rujukannya jelas dalam bahasa Indonesia. Struktur Ibrani paling dekat mengaitkan bentuk jamak ini dengan mazbah dan perkakasnya.
theological_decisions:
- issue: Istilah kekudusan dalam konteks peribadatan
  choice: menguduskan
  alternative: menahbiskan; mengkhususkan sebagai suci
  rationale: Ayat ini berbicara tentang pengkhususan benda-benda tempat suci untuk penggunaan kudus, bukan perubahan moral. 'Menguduskan' mempertahankan hubungan leksikal dengan konsep kudus tanpa menambahkan rincian upacara yang tidak dinyatakan.
- issue: Cakupan kata ganti jamak penutup
  choice: mazbah beserta seluruh perkakasnya
  alternative: semua benda yang telah disebutkan
  rationale: Secara gramatikal, akhiran jamak penutup mengikuti penyebutan mazbah dan segala perkakasnya, meskipun secara wacana dapat dipahami sebagai rangkuman yang lebih luas. Terjemahan mengikuti kaitan sintaksis terdekat dan tidak memperluasnya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat Ibrani yang panjang dibagi menjadi dua demi kejelasan, sementara pengulangan tindakan ritual tetap dipertahankan. Istilah 'Kemah Suci', 'mengurapi', 'menguduskan', dan 'mazbah' dipilih sebagai kosakata Alkitabiah yang masih dapat dipahami pembaca umum.
