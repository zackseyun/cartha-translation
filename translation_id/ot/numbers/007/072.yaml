  text: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: id
  text: Pada hari kesebelas, pemimpin bani Asyer ialah Pagiel anak Okhran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: Pada hari kesebelas
  rationale: Rumus naratif Ibrani mengulang kata 'hari', tetapi bahasa Indonesia yang wajar cukup menyatakannya sekali sebagai penanda waktu.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: kesebelas
  rationale: Dalam rangkaian persembahan Bilangan 7, bentuk bilangan ini berfungsi secara ordinal; 'kesebelas' merupakan padanan Indonesia yang alami.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Kata ini menunjuk kepala yang diakui dari suatu suku. 'Pemimpin' jelas bagi pembaca modern dan tidak memberi kesan kerajaan seperti 'pangeran'.
- source_word: לִ/בְנֵי אָשֵׁר
  choice: bani Asyer
  rationale: Ungkapan ini menyatakan kelompok keturunan atau suku Asyer. 'Bani Asyer' mempertahankan nuansa kekerabatan sekaligus dikenal dalam ragam Alkitab bahasa Indonesia.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן עָכְרָן
  choice: anak Okhran
  rationale: Patronimik Ibrani diterjemahkan secara langsung dengan 'anak'; ejaan 'Okhran' mempertahankan konsonan Ibrani kh (כ) dan sesuai bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah 'bani' digunakan untuk mempertahankan ungkapan kekerabatan/suku tanpa memerlukan catatan kaki. Tidak ada penanda catatan kaki karena tidak ada catatan yang diperlukan untuk ayat ini.
