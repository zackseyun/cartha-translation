source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] yang beratnya seratus tiga puluh syikal, dan satu bokor perak[b] yang beratnya tujuh puluh syikal, menurut syikal tempat kudus[c]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak sebagai persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring” atau “mangkuk”; kata Ibrani קְעָרָה menunjuk pada wadah yang bentuk tepatnya tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mangkuk pemercikan”; kata Ibrani מִזְרָק dapat menunjuk pada wadah yang digunakan untuk pemercikan dalam ibadah.
    reason: lexical_alternative
  - marker: c
    text: “Menurut syikal tempat kudus” berarti berdasarkan standar berat yang berlaku di tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן menunjuk pada sesuatu yang dipersembahkan dalam ibadah; “persembahan” jelas, alami, dan sesuai dengan konteks kurban.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קְעָרָה adalah wadah lebar yang dapat disebut pinggan, piring, atau mangkuk. “Pinggan” mempertahankan gambaran wadah tanpa memastikan bentuknya secara berlebihan.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: 'Ungkapan nominal Ibrani secara harfiah menyatakan “beratnya: seratus tiga puluh”; bentuk relatif ini alami dalam bahasa Indonesia dan mempertahankan informasi berat.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah berbentuk mangkuk yang dipakai dalam pelayanan ibadah, termasuk untuk pemercikan. “Bokor” merupakan istilah Indonesia yang ringkas untuk wadah cekung, sementara fungsi khususnya tidak dipaksakan ke dalam teks utama.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: yang beratnya tujuh puluh syikal
  rationale: Konstruksi ini menyatakan berat bokor; pengulangan “yang beratnya” membuat relasinya jelas dan alami dalam bahasa Indonesia.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menetapkan standar berat resmi yang berkaitan dengan tempat kudus. “Menurut” menyampaikan fungsi standar ukur tersebut tanpa mengubah kekhususan kultisnya.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Bentuk ini secara eksplisit merujuk kepada dua wadah yang baru disebutkan.
- source_word: מְלֵאִים
  choice: penuh dengan
  rationale: Predikat ini menyatakan bahwa kedua wadah berisi penuh bahan persembahan.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk pada tepung berkualitas yang digiling halus dan lazim dipakai dalam persembahan.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Terjemahan ini secara alami menyatakan bahwa tepung tersebut telah dipadukan dengan minyak.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה menunjuk pada persembahan berbahan hasil olahan biji-bijian. “Persembahan sajian” merupakan istilah yang cukup luas untuk mencakup tepung halus dalam ayat ini dan membedakannya dari kurban hewan.
