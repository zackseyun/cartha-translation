base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] seberat seratus tiga puluh syikal, dan satu bokor perak[b] seberat tujuh puluh syikal, menurut syikal tempat kudus[c]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak untuk persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring lebar” untuk קַעֲרָה, yaitu wadah yang relatif dangkal.
    reason: lexical_alternative
  - marker: b
    text: Atau “mangkuk”; מִזְרָק adalah wadah yang digunakan dalam pelayanan tempat kudus.
    reason: lexical_alternative
  - marker: c
    text: “Menurut syikal tempat kudus” berarti menurut standar berat yang berlaku di tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן dalam konteks ibadah menunjuk pada persembahan yang dibawa mendekat; konstruksi nominal Ibrani diungkapkan secara wajar dalam bahasa Indonesia dengan 'ialah'.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קְעָרָה menunjuk pada wadah lebar dan relatif dangkal; 'pinggan' mempertahankan nuansa bentuk dan cocok dengan daftar perlengkapan ibadah.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: seberat seratus tiga puluh syikal
  rationale: Mengungkapkan keterangan berat secara alami sambil mempertahankan angka dan satuan dalam teks sumber.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah yang dipakai dalam pelayanan tempat kudus; 'bokor' membedakannya dari pinggan pertama dan menyampaikan wadah cekung untuk keperluan upacara.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: seberat tujuh puluh syikal
  rationale: Kata 'seberat' dibuat eksplisit dari rumusan inventaris Ibrani agar hubungan angka dengan berat wadah jelas dalam bahasa Indonesia.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menyatakan standar berat resmi yang berlaku di tempat kudus; bentuk ringkas ini mempertahankan istilah sumber tanpa menafsirkan secara berlebihan.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Keduanya penuh dengan
  rationale: Mempertahankan rujukan eksplisit kepada kedua wadah dan keadaan keduanya sebagai penuh.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Padanan baku dan jelas untuk tepung berkualitas halus yang digunakan dalam persembahan.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif feminin tunggal menerangkan tepung; klausa relatif Indonesia mempertahankan hubungan gramatikal tersebut secara alami.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan berbahan hasil gandum; 'persembahan sajian' merupakan istilah ringkas yang membedakannya dari persembahan umum.
