lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: seekor sapi jantan dari kawanan
  rationale: פַּר menunjuk pada sapi jantan, sedangkan בֶּן בָּקָר secara idiomatis menegaskan bahwa hewan itu berasal dari kawanan lembu. Ungkapan ini alami dalam bahasa Indonesia dan menghindari terjemahan harfiah yang janggal.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל adalah domba jantan dewasa; 'seekor' secara alami menyatakan bilangan אֶחָד dalam daftar hewan.
- source_word: כֶּבֶשׂ אֶחָד
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ menunjuk pada anak domba dan dalam konteks kurban ini berjenis kelamin jantan. Jenis kelaminnya dinyatakan agar rincian daftar tetap jelas.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Idiom Ibrani ini menyatakan umur hewan secara wajar dalam bahasa Indonesia.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi persembahan yang dibakar seluruhnya. 'Kurban bakaran' merupakan padanan Indonesia yang ringkas dan dikenal luas.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan yang diulang pada setiap hewan dinyatakan melalui kata penggolong 'seekor', yang secara alami berarti satu ekor dalam bahasa Indonesia.
