  text: satu cawan emas[a] seberat sepuluh syikal, penuh dengan dupa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu bokor emas” atau “satu mangkuk emas”. Terjemahan tradisional sering memakai “sendok”, tetapi istilah Ibraninya lebih luas dan menunjuk pada wadah upacara kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini menunjuk pada wadah upacara kecil. “Cawan” alami dalam bahasa Indonesia dan tidak menyiratkan alat makan seperti “sendok”.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang sesuai dengan kata benda feminin כַּף.
- source_word: עֲשָׂרָה
  choice: seberat sepuluh syikal
  rationale: Satuan “syikal” tersirat dari rumusan inventaris berulang dalam konteks pasal ini; penambahan “seberat” memperjelas bahwa angka tersebut menyatakan bobot.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan wadah tersebut.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Menerjemahkan adjektiva predikatif secara langsung dan alami.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Istilah Indonesia yang lazim untuk bahan harum yang dibakar dalam ibadah.
