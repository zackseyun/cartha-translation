lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: seekor sapi jantan dari kawanan sapi
  rationale: פַּר menunjuk pada sapi jantan, sedangkan idiom בֶּן בָּקָר menyatakan bahwa hewan itu berasal dari kawanan sapi. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan usia yang tidak dinyatakan secara tegas.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל adalah istilah baku bagi domba jantan dewasa, khususnya dalam konteks persembahan.
- source_word: כֶּבֶשׂ אֶחָד
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ menunjuk pada anak domba dan dalam daftar kurban ini berjenis jantan; pilihan ini membedakannya dengan אַיִל.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Idiom Ibrani ini secara alami berarti berumur satu tahun atau masih dalam tahun pertamanya.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: עֹלָה adalah persembahan yang dibakar seluruhnya; 'kurban bakaran' merupakan istilah Indonesia yang ringkas dan jelas dalam konteks ritual.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia yang diulang untuk setiap hewan diterjemahkan dengan penggolong alami bahasa Indonesia, 'seekor'.
