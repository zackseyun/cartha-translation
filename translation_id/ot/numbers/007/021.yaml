  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: seekor sapi jantan muda
  rationale: Ungkapan harfiahnya, 'satu sapi jantan, anak dari kawanan sapi', merupakan idiom bagi sapi jantan muda. Padanan ini alami dalam bahasa Indonesia dan menghindari pengulangan yang terasa janggal.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia untuk hewan diwujudkan dengan penggolong 'seekor'; pengulangannya mempertahankan bentuk daftar persembahan.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל menunjuk pada domba jantan dewasa, khususnya dalam daftar kurban.
- source_word: כֶּבֶשׂ אֶחָד
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ berarti anak domba; bentuk maskulin dan konteks persyaratan kurban mendukung penyebutan jenis kelamin jantan.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Idiom Ibrani ini menyatakan umur hewan; padanan Indonesia ini jelas dan lazim.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah persembahan yang dibakar seluruhnya; 'kurban bakaran' merupakan istilah Indonesia yang ringkas dan mapan, sedangkan 'sebagai' menyampaikan fungsi prefiks לְ dalam daftar ini.
