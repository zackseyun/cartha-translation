  text: one male goat for a sin offering;[a]
translation:
  language: id
  text: seekor kambing jantan untuk kurban penghapus dosa;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kurban pentahiran.” Dalam konteks kurban, kata Ibrani חַטָּאת dapat merujuk pada kurban yang menangani dosa dan kenajisan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: kambing jantan
  rationale: Frasa konstruksi ini merupakan ungkapan bagi kambing jantan. Pilihan ini alami dalam bahasa Indonesia modern dan tetap menyatakan jenis kelamin hewan kurban.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan satu dinyatakan melalui kata penggolong 'seekor', yang secara alami mempertahankan jumlah satu dalam daftar inventaris ini tanpa perlu menambahkan 'satu' secara kaku.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks kurban, חַטָּאת menunjuk pada kurban yang berkaitan dengan dosa dan pentahiran, bukan sekadar pada dosa sebagai konsep abstrak. Ungkapan ini jelas dan lazim dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Pemaknaan חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban pentahiran
  rationale: Konteks daftar persembahan menunjukkan bahwa yang dimaksud ialah jenis kurban. Terjemahan utama mempertahankan kaitannya dengan dosa, sedangkan catatan kaki menjaga kemungkinan penekanan pada fungsi pentahiran ritual.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur inventaris dipertahankan; tanda titik koma mengikuti kedudukan ayat sebagai bagian dari daftar yang berlanjut.
