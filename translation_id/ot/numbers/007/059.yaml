base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: id
  text: 'Dan untuk kurban keselamatan[a]: dua ekor sapi[b], lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba berumur satu tahun. Inilah persembahan[c] Gamliel anak Pedahzur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini juga dapat diterjemahkan “persembahan persekutuan” atau “persembahan kesejahteraan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dua sapi”; secara tradisional juga diterjemahkan “dua lembu”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “Ini persembahan Gamliel”; klausa Ibraninya tidak menyatakan kala waktu.
    reason: source_form
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: Dan untuk kurban persembahan keselamatan
  rationale: Kata penghubung dan preposisi mempertahankan kelanjutan daftar dari ayat sebelumnya. זֶבַח menyatakan kurban sembelihan, sedangkan שְׁלָמִים adalah istilah kurban yang dapat menunjuk pada keselamatan, kesejahteraan, atau persekutuan. Ungkapan ini memakai istilah Indonesia yang dikenal tanpa meniadakan alternatif maknanya.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif bagi ternak sapi dan tidak secara khusus berarti sapi pekerja atau lembu. Kata penggolong 'ekor' membuat inventaris ini wajar dalam bahasa Indonesia.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus menunjuk pada domba jantan dewasa.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים menunjuk pada kambing jantan; jenis kelaminnya dinyatakan secara eksplisit dalam terjemahan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba berumur satu tahun
  rationale: Ungkapan Ibrani harfiah 'anak-anak satu tahun' menyatakan umur hewan. Susunan Indonesia ini alami dan mempertahankan persyaratan umur tersebut.
- source_word: זֶה קָרְבַּן
  choice: Inilah persembahan
  rationale: Klausa Ibrani tidak memiliki verba tersurat. 'Inilah' mempertahankan bentuk formula penunjukan itu tanpa memaksakan kala lampau atau kini.
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: Gamliel anak Pedahzur
  rationale: Nama-nama ditransliterasikan langsung dari bentuk Ibrani, dan בֶּן diterjemahkan dengan ungkapan hubungan keluarga yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna הַשְּׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan; persembahan kesejahteraan
  rationale: Istilah ritual ini memiliki cakupan makna yang tidak sepenuhnya terwakili oleh satu kata Indonesia. Terjemahan utama memakai istilah yang dikenal, sedangkan catatan kaki menjaga alternatif yang sah tanpa menetapkan satu penafsiran teologis secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-liturgis yang lugas. Kata penggolong 'ekor' dipakai secara konsisten untuk daftar hewan. 'Kurban' mengikuti ejaan baku modern, sementara formula penutup 'Inilah persembahan' menjaga keringkasan dan bentuk penunjukan teks Ibrani.
