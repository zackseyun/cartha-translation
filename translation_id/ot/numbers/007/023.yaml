  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: id
  text: 'dan untuk kurban keselamatan[a]: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur satu tahun. Itulah persembahan Netaneel anak Zuar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan”; istilah Ibrani שְׁלָמִים dapat memuat nuansa damai, kesejahteraan, dan persekutuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: dan untuk kurban keselamatan
  rationale: Konjungsi dan preposisi melanjutkan daftar persembahan, sedangkan זֶבַח menunjuk pada kurban sembelihan. Istilah שְׁלָמִים dipertahankan sebagai nama kategori kurban; 'kurban keselamatan' cukup ringkas dan membiarkan nuansa damai, persekutuan, serta kesejahteraan dijelaskan dalam catatan kaki.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif untuk ternak sapi dan tidak menyatakan jenis kelamin. Kata bantu bilangan 'ekor' membuat ungkapan ini alami dalam bahasa Indonesia.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus berarti domba jantan dewasa.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתּוּדִים menunjuk pada kambing jantan; terjemahan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur satu tahun
  rationale: כְּבָשִׂים menunjuk pada anak domba jantan, dan בְּנֵי שָׁנָה menyatakan umur satu tahun.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Ungkapan demonstratif ini menjadi rumus penutup yang mengidentifikasi seluruh daftar sebagai persembahan tokoh tersebut. 'Itulah' terasa alami sesudah pemerincian.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Netaneel anak Zuar
  rationale: Nama-nama ditransliterasikan, dan patronimik בֶּן diterjemahkan secara langsung sebagai 'anak' tanpa menambahkan informasi yang tidak ada dalam teks.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan
  rationale: Istilah Ibrani ini dapat menonjolkan keadaan damai atau sejahtera dan juga persekutuan yang terkait dengan jamuan kurban. Teks utama memakai istilah ringkas yang lazim, sementara catatan kaki mempertahankan keluasan maknanya tanpa menetapkan satu penafsiran teologis secara eksklusif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Penggolong 'ekor' digunakan secara konsisten untuk hewan. Jenis kelamin hanya dinyatakan ketika ditandai oleh istilah Ibrani; בָּקָר tetap netral.
