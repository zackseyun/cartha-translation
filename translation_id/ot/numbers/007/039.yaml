  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: id
  text: Seekor lembu jantan, seekor domba jantan, dan seekor anak domba jantan berumur satu tahun, untuk kurban bakaran;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: seekor lembu jantan muda
  rationale: פַּר menunjuk pada lembu jantan, lazimnya yang masih muda dalam konteks kurban; ungkapan בֶּן בָּקָר menandainya sebagai ternak sapi. Padanan ini alami dalam bahasa Indonesia dan menghindari terjemahan harfiah yang janggal.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia yang berulang menyatakan jumlah tiap hewan. Penggolong 'seekor' merupakan bentuk alami dalam bahasa Indonesia dan mempertahankan struktur daftar.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל adalah domba jantan dewasa, khususnya dalam daftar kurban.
- source_word: כֶּבֶשׂ אֶחָד
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ menunjuk pada anak domba dan dalam terminologi kurban lazimnya berjenis kelamin jantan; penyebutan 'jantan' mempertahankan pembedaan leksikal dari domba jantan dewasa.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Ungkapan Ibrani ini secara idiomatis menyatakan usia hewan, yaitu satu tahun atau berada dalam tahun pertamanya.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: עֹלָה adalah kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan Indonesia yang ringkas dan mapan, sedangkan לְ menyatakan peruntukannya.
theological_decisions: []
