  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: id
  text: seekor lembu jantan muda, seekor domba jantan, dan seekor anak domba jantan berumur satu tahun sebagai kurban bakaran;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: seekor lembu jantan muda
  rationale: Gabungan istilah ini menunjuk kepada seekor sapi jantan muda dari kawanan sapi. Terjemahan ini alami dalam bahasa Indonesia dan tidak mengulang klasifikasi ternak secara kaku.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia ini diulang untuk menghitung tiap hewan. Kata penggolong 'seekor' secara alami menyatakan jumlah satu bagi hewan dalam bahasa Indonesia.
- source_word: אַיִל
  choice: domba jantan
  rationale: Istilah baku bagi domba jantan dewasa dalam konteks persembahan.
- source_word: כֶּבֶשׂ
  choice: anak domba jantan
  rationale: Kata Ibrani ini menunjuk kepada anak domba jantan, sehingga jenis kelaminnya dipertahankan.
- source_word: בֶּן־שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Ungkapan idiomatis ini menyatakan persyaratan umur hewan; terjemahan tersebut jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah persembahan yang dibakar seluruhnya. 'Kurban bakaran' mempertahankan istilah ritual yang mapan, sedangkan 'sebagai' sesuai dengan fungsi hewan dalam daftar.
