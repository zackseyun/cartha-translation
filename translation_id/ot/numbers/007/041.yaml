  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: id
  text: 'dan untuk kurban keselamatan[a]: dua ekor sapi[b], lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur satu tahun. Itulah persembahan Selumiel anak Zurisyadai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan persekutuan” atau “persembahan kesejahteraan.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani בָּקָר adalah istilah umum untuk ternak sapi; beberapa terjemahan memakai “sapi jantan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: dan untuk kurban persembahan keselamatan
  rationale: Gabungan וּלְ memperkenalkan unsur berikutnya dalam daftar, sedangkan זֶבַח שְׁלָמִים adalah istilah teknis bagi kurban yang berkaitan dengan damai, persekutuan, atau kesejahteraan. Pilihan ini mempertahankan kekhususan kultis tanpa menutup alternatif maknanya.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor lembu
  rationale: בָּקָר adalah istilah umum untuk ternak sapi dan tidak secara khusus menyatakan sapi jantan; kata penggolong 'ekor' menghasilkan bahasa Indonesia yang alami.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus menunjuk domba jantan dewasa dalam konteks kurban.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים menunjuk kambing jantan, sehingga jenis kelaminnya dipertahankan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur satu tahun
  rationale: כְּבָשִׂים menunjuk anak domba jantan, dan בְּנֵי שָׁנָה menyatakan umur satu tahun.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Formula penutup ini mengidentifikasi seluruh pemberian yang baru dirinci; 'Itulah persembahan' alami dalam narasi Indonesia dan mempertahankan fungsi demonstratif זֶה.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Selumiel anak Zurisadai
  rationale: Nama-nama ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, dan בֶּן diterjemahkan secara langsung sebagai 'anak'.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan; persembahan kesejahteraan
  rationale: Istilah Ibrani tersebut memiliki rentang makna yang berkaitan dengan damai, keutuhan, kesejahteraan, dan persekutuan. Teks utama memakai padanan kultis yang ringkas, sedangkan catatan kaki mempertahankan alternatif yang sah tanpa menetapkan tafsir denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata penggolong 'ekor' dipakai agar daftar hewan terdengar alami. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
