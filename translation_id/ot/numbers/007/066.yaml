  yaml_path: translation/ot/numbers/007/066.yaml
  text: 'On the tenth day, the leader of the sons of Dan was Ahiezer son of Ammishaddai:'
translation:
  language: id
  text: 'Pada hari kesepuluh, pemimpin bani Dan adalah Ahiezer anak Amisyadai:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הָעֲשִׂירִי
  choice: Pada hari kesepuluh
  rationale: Ungkapan temporal Ibrani ini paling alami diterjemahkan dengan 'pada' dalam bahasa Indonesia, sedangkan bilangan tingkat dipertahankan secara langsung.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Kata ini menunjuk kepada kepala atau wakil resmi suku; 'pemimpin' jelas dalam bahasa Indonesia modern dan tidak menimbulkan kesan kerajaan seperti 'pangeran'.
- source_word: לִבְנֵי דָן
  choice: bani Dan
  rationale: '''Bani Dan'' mempertahankan ungkapan kekerabatan בני sekaligus merupakan bentuk yang ringkas, wajar, dan dikenal dalam bahasa Indonesia Alkitabiah.'
- source_word: אֲחִיעֶזֶר
  choice: Ahiezer
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah atau patronimik, 'anak' menyampaikan hubungan keturunan secara langsung dan alami.
- source_word: עַמִּישַׁדָּי
  choice: Amisyadai
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang mewakili bunyi Ibrani secara wajar.
