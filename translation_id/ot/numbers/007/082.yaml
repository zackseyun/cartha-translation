- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan 'satu' dinyatakan melalui kata penggolong numeralia 'seekor', yang secara alami menyampaikan jumlah satu untuk hewan dalam bahasa Indonesia dan sesuai dengan gaya daftar persembahan.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks ritual, חַטָּאת menunjuk pada jenis kurban, bukan sekadar dosa secara abstrak. 'Kurban penghapus dosa' merupakan istilah yang jelas dan lazim untuk kategori persembahan ini, sedangkan 'untuk' mencerminkan prefiks לְ.
