  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: id
  text: Pada hari kedua belas, pemimpin bani Naftali ialah Ahira bin Enan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: Pada hari kedua belas
  rationale: Ungkapan Ibrani ini merupakan formula waktu dengan bilangan bertingkat; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan kata 'hari'.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks suku, kata ini menunjuk kepada kepala atau pemimpin yang diakui, tanpa harus mengandung makna kebangsawanan atau kerajaan.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: bani Naftali
  rationale: Preposisi ל menandai hubungan sang pemimpin dengan kelompok suku tersebut. 'Bani Naftali' adalah sebutan kesukuan yang ringkas, lazim, dan mempertahankan unsur patronimik בְּנֵי.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Nama orang ditransliterasikan, bukan diterjemahkan.
- source_word: בֶּן עֵינָן
  choice: bin Enan
  rationale: Konstruksi patronimik Ibrani diterjemahkan dengan bentuk Indonesia 'bin', yang secara jelas berarti anak laki-laki Enan.
theological_decisions:
- issue: Sebutan kesukuan bergender בְּנֵי
  choice: bani Naftali
  alternative: keturunan Naftali
  rationale: '''Bani'' mempertahankan corak garis keturunan paternal dan fungsi tradisional sebutan suku tanpa menambahkan penafsiran teologis.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur ayat mengikuti formula daftar persembahan dalam pasal ini; 'ialah' dipakai sebagai kopula formal yang alami.
