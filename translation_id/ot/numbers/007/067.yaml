  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] seberat seratus tiga puluh syikal, dan satu bokor perak[b] seberat tujuh puluh syikal, menurut syikal tempat kudus[c]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak sebagai persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring”; kata Ibrani ini menunjuk pada wadah yang relatif ceper.
    reason: lexical_alternative
  - marker: b
    text: Atau “mangkuk”; yang dimaksud ialah wadah yang digunakan dalam pelayanan ritual.
    reason: lexical_alternative
  - marker: c
    text: Artinya, menurut standar berat yang berlaku di tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן menunjuk pada sesuatu yang dipersembahkan dalam konteks ibadah; 'persembahan' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קְעָרָה adalah wadah ceper seperti pinggan atau piring; 'pinggan' sesuai dengan daftar perlengkapan persembahan dan mempertahankan perbedaannya dari מִזְרָק.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: seberat seratus tiga puluh syikal
  rationale: Mengungkapkan keterangan berat secara alami tanpa menghilangkan angka atau satuannya.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah dalam pelayanan ritual; 'bokor' menyatakan wadah berbentuk mangkuk besar dan membedakannya dari pinggan.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: seberat tujuh puluh syikal
  rationale: Konteks dan kesejajaran dengan berat pinggan menunjukkan bahwa angka ini menyatakan berat bokor.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Mempertahankan ungkapan kultis sumber sambil menunjukkan bahwa ukuran tersebut mengikuti standar resmi tempat kudus.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Keduanya penuh
  rationale: Mencerminkan penekanan Ibrani pada kedua wadah secara ringkas dan alami.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: סֹלֶת menunjuk pada tepung bermutu tinggi yang dipakai dalam persembahan; padanan ini lebih alami daripada ungkapan teknis yang berpotensi kabur.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif tersebut menggambarkan tepung yang telah dicampur dengan minyak.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks imamat, מִנְחָה adalah persembahan berbahan hasil pertanian yang lazim disebut 'persembahan sajian' dalam bahasa Alkitab Indonesia.
