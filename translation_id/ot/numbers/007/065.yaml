  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: id
  text: 'dan untuk kurban persekutuan: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur satu tahun. Itulah persembahan Abidan anak Gideoni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: dan untuk kurban persekutuan
  rationale: Kata penghubung dan preposisi mengaitkan daftar ini dengan ayat sebelumnya. Dalam konteks ibadah, זֶבַח berarti kurban, sedangkan שְׁלָמִים menunjuk kurban yang terkait damai sejahtera dan persekutuan; 'kurban persekutuan' merupakan istilah yang alami dan mudah dipahami.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר merupakan istilah kolektif bagi ternak lembu dan tidak menyatakan jenis kelamin; 'sapi' mempertahankan keluasan maknanya.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus berarti domba jantan.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים menunjuk kambing jantan, sehingga pembedaan jenis kelamin dipertahankan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur satu tahun
  rationale: כְּבָשִׂים menunjuk anak domba jantan dalam daftar kurban ini, dan ungkapan בְּנֵי שָׁנָה berarti berumur satu tahun.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Ungkapan ini merupakan formula penutup daftar. 'Itulah' menyampaikan penunjukan demonstratif tanpa perlu menambahkan penanda waktu yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: Abidan anak Gideoni
  rationale: Nama diri ditransliterasikan, dan patronimik בֶּן diterjemahkan secara alami sebagai 'anak'.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan / kurban damai sejahtera
  rationale: Istilah Ibrani dapat menonjolkan keutuhan, kesejahteraan, damai, atau persekutuan melalui santapan kurban. 'Kurban persekutuan' dipilih sebagai istilah Indonesia yang jelas tanpa membatasi istilah itu pada keselamatan rohani atau perdamaian saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata penggolong 'ekor' digunakan secara konsisten untuk daftar hewan. Susunan daftar dan formula penutup bahasa Ibrani dipertahankan secara alami.
