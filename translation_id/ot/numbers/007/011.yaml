  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Setiap hari satu pemimpin—setiap hari satu pemimpin—harus mempersembahkan persembahannya untuk pentahbisan mazbah.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Satu pemimpin suku per hari.” Bahasa Ibrani mengulang “satu pemimpin, satu hari” untuk menekankan urutan persembahan yang teratur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur narasi. Dalam konteks ketika Yahweh berbicara, “berfirman” merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks ini kata tersebut menunjuk kepada para kepala suku Israel; “pemimpin” jelas dan tidak memberi kesan monarki seperti “pangeran”.
- source_word: אֶחָד לַיּוֹם
  choice: satu pemimpin setiap hari
  rationale: Terjemahan ini mempertahankan pola distributif dan pengulangan Ibrani yang menekankan urutan persembahan.
- source_word: יַקְרִיבוּ
  choice: harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa atau menyajikan sebagai persembahan; “mempersembahkan” paling alami dalam bahasa Indonesia.
- source_word: קָרְבָּנָם
  choice: persembahan mereka
  rationale: Pronomina jamak pada kata Ibrani dipertahankan, merujuk secara kolektif kepada persembahan para pemimpin.
- source_word: לַחֲנֻכַּת
  choice: untuk penahbisan
  rationale: Kata ini menunjuk kepada tindakan atau perayaan peresmian altar bagi fungsi sucinya; “penahbisan” sesuai dengan konteks kultis.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: “Mazbah” adalah istilah Alkitab Indonesia yang mapan dan tepat bagi tempat persembahan korban.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna חֲנֻכָּה dalam kaitannya dengan mazbah
  choice: penahbisan
  alternative: peresmian; pengudusan
  rationale: “Penahbisan” menyampaikan bahwa mazbah mulai dikhususkan dan digunakan bagi fungsi ibadah, tanpa menyamakan kata ini begitu saja dengan istilah teknis lain untuk pengudusan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan sumber dipertahankan meskipun terasa lebih tegas daripada gaya percakapan biasa. Istilah “mazbah” dipilih karena mapan dalam register Alkitab Indonesia.
