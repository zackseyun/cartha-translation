  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: id
  text: Ambillah semuanya itu dari mereka, dan semuanya itu hendaknya digunakan untuk melaksanakan pelayanan Kemah Pertemuan. Berikanlah semuanya itu kepada orang-orang Lewi, masing-masing sesuai dengan tugas pelayanannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: Terimalah semuanya itu dari mereka
  rationale: Imperatif לקח dalam konteks persembahan para pemimpin suku berarti Musa harus mengambil atau menerima barang-barang tersebut. “Terimalah” alami dalam konteks pemberian, sedangkan “semuanya itu” memperjelas bahwa pronomina jamak merujuk pada kereta dan lembu dalam ayat sebelumnya.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: supaya dipakai untuk melaksanakan tugas pelayanan
  rationale: Konstruksi ini menyatakan tujuan bagi benda mati. Bentuk pasif “dipakai” menghindari kesan bahwa kereta dan lembu melayani secara aktif, sementara “melaksanakan tugas pelayanan” mempertahankan pengulangan akar עבד secara wajar dalam bahasa Indonesia.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku dan jelas bagi tempat kudus Israel di padang gurun; kapitalisasi menandai nama khusus.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: Serahkanlah semuanya itu kepada orang Lewi
  rationale: נתן secara dasar berarti memberi, tetapi “serahkanlah” secara alami menyampaikan penyerahan barang untuk digunakan oleh orang Lewi tanpa menyiratkan kepemilikan pribadi.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: masing-masing sesuai dengan tugas pelayanannya
  rationale: אִישׁ berfungsi distributif. Ungkapan כְּפִי menyatakan kesesuaian dengan kadar atau tuntutan tugas yang ditetapkan bagi masing-masing penerima.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi menjadi dua agar perintah dan tujuannya mudah dipahami. Istilah “tugas pelayanan” mempertahankan nuansa pekerjaan resmi yang berkaitan dengan tempat kudus tanpa memakai istilah denominatif.
