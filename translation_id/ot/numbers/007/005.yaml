  terminology: '''Kemah Pertemuan'' tepat dan konsisten untuk אֹהֶל מוֹעֵד. ''Pelayanan'' sesuai untuk עֲבֹדָה dalam konteks tugas kultis tanpa memaksakan istilah denominatif. ''Berikanlah'' mempertahankan arti dasar נתן; konteksnya sendiri cukup menunjukkan pemberian untuk tugas yang ditetapkan.'
