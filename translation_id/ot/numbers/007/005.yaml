  source_fidelity: 'Draf pada dasarnya setia pada teks Ibrani: benda-benda itu diambil dari para pemimpin, dipakai bagi pelayanan Kemah Pertemuan, lalu diberikan kepada orang-orang Lewi menurut tugas masing-masing. Namun, ''supaya'' agak mengubah klausa waw-konsekutif yang menyatakan hasil/penetapan menjadi anak kalimat tujuan. Perbaikan kecil dapat mempertahankan hubungan klausa dengan lebih dekat.'
