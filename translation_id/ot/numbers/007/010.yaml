  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: id
  text: Lalu para pemimpin mempersembahkan persembahan untuk penahbisan mezbah pada hari mezbah itu diurapi[a]. Para pemimpin itu mempersembahkan persembahan mereka di hadapan mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “penahbisan mezbah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: mempersembahkan / membawa
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa mendekat atau mempersembahkan. Pada kemunculan pertama, “mempersembahkan” menonjolkan konteks persembahan; pada kemunculan kedua, “membawa ... ke hadapan” menyampaikan gerak dan lokasi secara alami tanpa pengulangan yang kaku.
- source_word: הַנְּשִׂאִים
  choice: para pemimpin
  rationale: Dalam Kitab Bilangan, נָשִׂיא menunjuk kepada kepala atau pemimpin suku. “Para pemimpin” jelas, modern, dan tidak menyiratkan kedudukan sebagai pangeran kerajaan.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: persembahan untuk penahbisan mezbah
  rationale: חֲנֻכָּה berarti penahbisan atau peresmian. Karena sesuatu ini dipersembahkan oleh para pemimpin, frasa tersebut secara kontekstual menunjuk kepada persembahan yang berkaitan dengan penahbisan mezbah. Terjemahan harfiahnya dicatat dalam catatan kaki untuk mempertahankan bentuk dan kemungkinan nuansa sumber.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: pada hari mezbah itu diurapi
  rationale: Konstruksi infinitif dengan בְּ menyatakan waktu. Penyebutan ulang “mezbah itu” menghindari kata ganti benda yang tidak alami dalam bahasa Indonesia dan memperjelas acuannya.
- source_word: קָרְבָּנָם
  choice: persembahan mereka
  rationale: קָרְבָּן adalah pemberian yang dibawa mendekat dalam konteks ibadah atau kurban. “Persembahan” merupakan padanan Indonesia yang umum dan sesuai dengan konteks Kemah Suci.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: ke hadapan mezbah
  rationale: לִפְנֵי menyatakan posisi di depan atau di hadapan. Dengan verba “membawa”, “ke hadapan mezbah” menyampaikan arah dan suasana ibadah secara wajar.
