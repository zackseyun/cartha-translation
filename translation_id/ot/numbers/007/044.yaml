  text: satu cawan emas seberat sepuluh syikal[a], penuh dengan dupa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “satu cawan emas, sepuluh [emas], penuh dengan dupa”; kata “syikal” ditambahkan untuk memperjelas satuan berat yang tersirat dari rumus berulang dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam daftar persembahan di Bilangan 7, kata ini menunjuk pada wadah kecil untuk dupa. “Cawan” alami, konkret, dan cukup luas tanpa menetapkan bentuknya secara berlebihan.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang menerangkan kata benda feminin כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: seberat sepuluh syikal
  rationale: Dalam rumus inventaris pasal ini, bilangan dan bahan menyatakan berat benda; satuan “syikal” dipahami dari rumus penimbangan yang berulang dalam konteks terdekat.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan cawan.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Mempertahankan bentuk adjektival dan menyatakan isi wadah secara alami dalam bahasa Indonesia.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku untuk bahan harum yang dibakar sebagai persembahan.
