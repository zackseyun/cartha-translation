lexical_decisions:
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: seekor kambing jantan
  rationale: Frasa Ibrani menunjuk pada satu ekor kambing jantan. Dalam bahasa Indonesia, penggolong 'seekor' secara alami menyatakan jumlah satu, sedangkan 'jantan' mempertahankan jenis kelamin hewan yang dinyatakan oleh שְׂעִיר.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks daftar persembahan, חַטָּאת menunjuk pada jenis kurban, bukan semata-mata pada dosa sebagai gagasan abstrak; לְ menyatakan peruntukannya.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks ibadah kurban
  choice: kurban penghapus dosa
  alternative: untuk dosa
  rationale: Konteks langsung berupa daftar hewan dan persembahan menuntut makna kultis. Pilihan ini mengidentifikasi jenis kurban tanpa memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan sesuai dengan gaya inventaris persembahan. 'Kurban' dipilih sebagai ejaan baku modern; tidak diperlukan catatan kaki.
