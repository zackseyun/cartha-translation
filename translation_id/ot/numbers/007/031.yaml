  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] yang beratnya seratus tiga puluh syikal, dan satu bokor perak[b] yang beratnya tujuh puluh syikal, menurut syikal tempat kudus[c]. Keduanya penuh dengan tepung halus yang dicampur dengan minyak sebagai persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “talam perak”. Kata Ibraninya menunjuk pada wadah ritual yang relatif ceper.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mangkuk perak”. Kata Ibraninya menunjuk pada wadah yang digunakan dalam ritual kurban.'
    reason: lexical_alternative
  - marker: c
    text: Artinya, menurut standar berat resmi yang digunakan di tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן menunjuk pada sesuatu yang dibawa dan dipersembahkan dalam ibadah; 'persembahan' merupakan padanan Indonesia yang baku dan jelas dalam konteks ini.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קְעָרָה menunjuk pada wadah ceper seperti pinggan atau talam; 'pinggan' alami dan tetap membedakannya dari bokor berikutnya.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: Ungkapan ini mempertahankan acuan eksplisit pada berat sambil memakai susunan kalimat Indonesia yang wajar.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu bokor perak
  rationale: מִזְרָק adalah wadah yang berkaitan dengan ritual kurban; 'bokor' menyampaikan bentuk wadah sejenis mangkuk besar tanpa memberi kesan sebagai perlengkapan makan biasa.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: yang beratnya tujuh puluh syikal
  rationale: Frasa tersebut menyatakan berat bokor; bentuk eksplisit ini mencegah angka dipahami sebagai jumlah atau nilai.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  rationale: Formula ini menetapkan standar berat kultis. 'Syikal kudus' mempertahankan bentuk konstruksi Ibrani tanpa mengganti 'kudus' dengan tafsiran lokatif.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Keduanya penuh dengan
  rationale: Terjemahan ini mempertahankan rujukan eksplisit kepada kedua wadah dan predikasi bahwa keduanya penuh.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: סֹלֶת adalah tepung bermutu tinggi yang dipakai untuk persembahan; 'tepung terbaik' lebih mudah dipahami dalam bahasa Indonesia modern daripada istilah teknis yang dapat menyiratkan tingkat kehalusan tertentu saja.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif menyatakan bahwa tepung itu telah dicampur dengan minyak; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: לְמִנְחָה
  choice: sebagai persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan berbahan hasil tanaman; istilah baku 'persembahan sajian' membedakannya dari persembahan secara umum.
theological_decisions:
- issue: Makna konstruksi בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  alternative: menurut standar berat tempat kudus
  rationale: Terjemahan utama mempertahankan ungkapan kultis teks, sedangkan catatan menjelaskan bahwa yang dimaksud ialah standar penimbangan resmi tanpa menghapus nuansa 'kudus'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah ukuran kuno 'syikal' dipertahankan, sedangkan dua jenis wadah dibedakan sebagai 'pinggan' dan 'bokor'. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
