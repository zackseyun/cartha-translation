  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: id
  text: 'dan untuk kurban kesejahteraan[a]: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba berumur satu tahun. Itulah persembahan Elyasaf anak Deuel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban keselamatan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: dan untuk kurban persembahan keselamatan
  rationale: Kata sambung dan preposisi membuka unsur berikutnya dalam daftar, sedangkan זֶבַח menunjuk pada kurban yang dipersembahkan. Istilah שְׁלָמִים memiliki cakupan makna damai, keutuhan, dan kesejahteraan; 'persembahan keselamatan' mempertahankan istilah kultis yang lazim tanpa meniadakan alternatif maknanya.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif bagi ternak sapi dan dalam konteks ini tidak menyatakan jenis kelaminnya; 'sapi' menghindari penambahan rincian yang tidak ada dalam teks.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus menunjuk kepada domba jantan.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים secara khusus menunjuk kepada kambing jantan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba berumur satu tahun
  rationale: Ungkapan harfiah 'anak-anak satu tahun' menyatakan umur hewan; bentuk Indonesia ini jelas dan alami.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Kopula tidak dinyatakan dalam bahasa Ibrani. 'Itulah persembahan' merupakan ringkasan demonstratif yang alami dalam rangkaian naratif ini tanpa perlu mengimpor kala gramatikal.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Elyasaf anak Deuel
  rationale: Nama diri ditransliterasikan sesuai bentuk yang wajar dalam bahasa Indonesia, dan patronimik בֶּן diterjemahkan 'anak'.
theological_decisions:
- issue: Makna teknis הַשְּׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan; persembahan kesejahteraan
  rationale: Istilah Ibrani berkaitan dengan damai, keutuhan, atau kesejahteraan dan juga menunjuk pada jenis kurban tertentu. Teks utama memakai istilah tradisional yang dapat dikenali, sementara catatan mempertahankan keluasan semantiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Penggolong 'ekor' digunakan secara konsisten untuk daftar hewan; susunan inventaris Ibrani dipertahankan, dengan penambahan 'dan' sebelum unsur terakhir agar alami dalam bahasa Indonesia.
