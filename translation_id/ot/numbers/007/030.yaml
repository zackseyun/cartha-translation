  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: id
  text: Pada hari keempat, pemimpin[a] bani Ruben[b] adalah Elizur anak Syedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala”; secara tradisional “pangeran”. Kata Ibrani ini menunjuk kepada kepala resmi suatu suku.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagi bani Ruben”; preposisi Ibrani di sini dapat menyatakan hubungan dengan kelompok itu atau perwakilan atas nama mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Pada hari keempat
  rationale: Ungkapan dengan בְּ pada יוֹם berfungsi secara temporal dalam daftar naratif ini; bentuk ordinal diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks Kitab Bilangan, kata ini menunjuk kepada kepala resmi suatu suku. “Pemimpin” jelas dalam bahasa Indonesia modern dan tidak menyiratkan status sebagai putra raja seperti yang mungkin ditimbulkan oleh “pangeran”.
- source_word: לִבְנֵי רְאוּבֵן
  choice: bani Ruben
  rationale: Preposisi לְ menyatakan hubungan atau perwakilan, sedangkan בְּנֵי רְאוּבֵן adalah sebutan kesukuan berdasarkan keturunan. “Bani Ruben” mempertahankan ungkapan kekeluargaan-kesukuan secara ringkas dan lazim.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus patronimik bahasa Ibrani, בֶּן mengidentifikasi seseorang sebagai anak laki-laki dari ayah yang disebutkan; “anak” alami dalam bahasa Indonesia.
- source_word: שְׁדֵיאוּר
  choice: Syedeur
  rationale: Nama diri Ibrani ditransliterasikan ke ejaan Indonesia; שׁ dilambangkan “sy” dan vokalisasi Masoret dipertahankan secara mendekati.
theological_decisions: []
