  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: id
  text: satu cawan[a] emas seberat sepuluh syikal[b], penuh dengan dupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mangkuk”, “wadah”, atau, menurut terjemahan tradisional, “sendok”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah dalam bahasa Ibrani, “satu cawan, sepuluh [dari] emas, penuh dengan dupa”. Kata “syikal” ditambahkan karena dalam konteks ini ungkapan tersebut merupakan rumus berat yang dipersingkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks persembahan Kemah Suci, kata ini menunjuk pada wadah kecil, bukan telapak tangan. “Cawan” terdengar alami dan cukup luas untuk bentuk wadah yang tidak dijelaskan secara pasti.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang menerangkan כַּף, diterjemahkan secara langsung.
- source_word: עֲשָׂרָה זָהָב
  choice: seberat sepuluh syikal
  rationale: Ungkapan Ibrani ini merupakan rumus berat yang dipersingkat. Berdasarkan konteks langsung dan ayat-ayat sejajar dalam pasal ini, satuan yang dimaksud adalah syikal; “seberat” memperjelas bahwa angka tersebut menyatakan bobot wadah.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan wadah; susunan “cawan emas” alami dalam bahasa Indonesia.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Kata sifat predikatif yang menerangkan keadaan cawan dan isinya.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku untuk bahan harum yang dibakar dalam ibadah.
