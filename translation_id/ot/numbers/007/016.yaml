lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa konstruksi ini secara harfiah menunjuk pada 'yang berbulu dari antara kambing-kambing' dan secara idiomatis berarti kambing jantan. 'Seekor kambing jantan' jelas dan wajar dalam bahasa Indonesia modern serta mempertahankan jenis hewan kurban.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan satu dinyatakan melalui penggolong 'seekor', yang secara alami menyampaikan jumlah satu untuk hewan dalam bahasa Indonesia dan sesuai dengan gaya daftar persembahan.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks persembahan, חַטָּאת menunjuk pada jenis kurban, bukan sekadar dosa secara abstrak. 'Untuk kurban penghapus dosa' menyampaikan fungsi prefiks לְ dan istilah kurban secara jelas.
