  verdict: revise
  source_fidelity: Secara umum daftar hewan, jumlah, jenis kelamin pada domba/kambing, umur anak domba, dan formula penutup telah setia pada Ibrani. Namun, istilah utama "persembahan keselamatan" untuk זֶבַח הַשְּׁלָמִים berisiko menyempitkan atau mengarahkan makna kepada konsep soteriologis modern. "Kurban/persembahan damai" adalah padanan kategori ritual yang lebih mapan dan lebih langsung, sementara alternatif makna dapat dijaga dalam catatan kaki. Nama עָכְרָן lebih tepat ditransliterasikan "Akhran" daripada "Okhran" bila mengikuti vokalisasi Ibrani sumber.
  naturalness: Teks inventarisnya alami dan baku. Frasa "kurban persembahan keselamatan" terasa bertumpuk dan kurang idiomatis; "kurban damai" lebih ringkas serta lazim dalam register Alkitab Indonesia. "Itulah" sesuai sebagai penutup rangkuman.
  terminology: Gunakan "kurban damai" untuk זֶבַח הַשְּׁלָמִים, dengan alternatif "persembahan persekutuan" dan "persembahan kesejahteraan" di catatan. "Sapi" dengan catatan bahwa בָּקָר bersifat kolektif dan tidak menandai jenis kelamin sudah tepat. "Domba jantan", "kambing jantan", dan "anak domba jantan berumur setahun" mempertahankan rincian leksikal sumber.
