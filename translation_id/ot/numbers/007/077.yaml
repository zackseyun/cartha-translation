  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: id
  text: 'dan untuk kurban damai[a]: dua ekor sapi[b], lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur setahun. Itulah persembahan Pagiel anak Akhran.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan persekutuan” atau “persembahan kesejahteraan”. Istilah Ibrani ini menunjuk pada suatu kategori kurban ritual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dua sapi”; istilah Ibraninya bersifat kolektif dan tidak menyebutkan jenis kelamin. Sejumlah terjemahan menerjemahkannya secara lebih khusus sebagai “dua lembu jantan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: dan untuk kurban persembahan keselamatan
  rationale: Kata depan dan kata sambung melanjutkan daftar persembahan. Istilah שְׁלָמִים menunjuk pada kategori kurban yang berkaitan dengan keselamatan, kesejahteraan, dan persekutuan; padanan utama dipilih sambil mencatat alternatif yang sah.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif untuk ternak sapi dan tidak menentukan jenis kelamin; karena itu 'sapi' lebih tepat daripada 'lembu jantan'.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus berarti domba jantan dewasa.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים menunjuk pada kambing jantan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur setahun
  rationale: כְּבָשִׂים mempertahankan keterangan jantan, sedangkan בְּנֵי שָׁנָה menyatakan umur satu tahun.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Formula penutup ini secara alami diterjemahkan dengan bentuk penunjuk yang merangkum daftar sebelumnya.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Pagiel anak Okhran
  rationale: Nama-nama ditransliterasikan dari bahasa Ibrani, dan patronimik בֶּן diterjemahkan secara langsung sebagai 'anak'.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan; persembahan kesejahteraan
  rationale: Istilah Ibrani memiliki cakupan makna yang tidak sepenuhnya terwakili oleh satu padanan Indonesia. Teks utama memakai istilah yang mempertahankan hubungan leksikal dengan שָׁלוֹם, sedangkan catatan kaki menjaga alternatif makna ritual dan relasionalnya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Kata penggolong 'ekor' dipakai secara konsisten untuk daftar hewan. Struktur inventaris dan perbedaan jenis hewan dalam bahasa sumber dipertahankan tanpa membuat jenis kelamin בָּקָר menjadi lebih khusus daripada teks Ibrani.
