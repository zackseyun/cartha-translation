    rationale: Ungkapan ini redundan dan "keselamatan" dalam bahasa Indonesia modern mudah dipahami sebagai keselamatan rohani, sedangkan istilah Ibrani menunjuk kategori kurban ritual. "Kurban damai" lebih langsung dan tradisional; alternatif semantis dapat dicantumkan tanpa memaksakan satu penafsiran.
