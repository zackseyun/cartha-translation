  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: id
  text: satu cawan emas seberat sepuluh syikal[a], penuh dengan dupa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “satu cawan, sepuluh emas, penuh dengan dupa”; satuan berat “syikal” dipahami dari rumusan persembahan yang berulang dalam Bilangan 7.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam konteks persembahan Kemah Suci, kata ini menunjuk pada wadah kecil untuk dupa, bukan telapak tangan atau sendok secara harfiah. “Cawan” alami dan sesuai dengan konteks perlengkapan ibadah.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang menyatakan jumlah wadah.
- source_word: עֲשָׂרָה זָהָב
  choice: seberat sepuluh syikal
  rationale: Teks Ibrani menyingkat rumusan berat dengan tidak menuliskan שֶׁקֶל. Rumusan berulang dalam Bilangan 7 menunjukkan bahwa satuan yang dimaksud ialah syikal; “seberat” memperjelas bahwa angka tersebut menyatakan bobot cawan emas.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan cawan.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Menerjemahkan adjektiva predikatif feminin secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan baku dan mudah dipahami untuk bahan harum yang digunakan dalam ibadah.
