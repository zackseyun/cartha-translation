  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: id
  text: dua belas cawan emas yang penuh dengan dupa[a], masing-masing seberat sepuluh syikal menurut standar syikal tempat kudus; seluruh emas cawan-cawan itu seratus dua puluh syikal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mangkuk,” “wadah,” atau, dalam terjemahan tradisional, “sendok” untuk wadah dupa ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: pinggan
  rationale: Dalam konteks persembahan Kemah Suci, kata ini menunjuk pada wadah kecil untuk dupa. 'Pinggan' alami dalam bahasa Indonesia dan tidak menimbulkan kesan alat makan seperti 'sendok'.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: yang penuh dengan dupa
  rationale: Mengungkapkan dengan langsung bahwa setiap wadah berisi penuh dupa.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: masing-masing seberat sepuluh syikal
  rationale: 'Pengulangan bilangan dalam bahasa Ibrani menyatakan pembagian: setiap pinggan berbobot sepuluh syikal.'
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  rationale: Mempertahankan rumusan teknis yang menunjuk pada standar berat resmi tempat kudus.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: seluruh emas pada pinggan-pinggan itu
  rationale: Menyatakan jumlah keseluruhan emas yang terdapat pada atau membentuk wadah-wadah tersebut dengan bahasa Indonesia yang wajar.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: seratus dua puluh syikal
  rationale: Nilainya 120; satuan 'syikal' dipahami dari frasa berat sebelumnya dan dinyatakan kembali agar jelas.
