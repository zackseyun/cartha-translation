  yaml_path: translation/ot/numbers/007/026.yaml
  text: one golden dish of ten shekels[a], full of incense;
translation:
  language: id
  text: satu cawan emas seberat sepuluh syikal[a], penuh dengan dupa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “satu cawan emas, sepuluh, penuh dengan dupa”; kata “syikal” ditambahkan berdasarkan rumusan baku persembahan dalam konteks terdekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: cawan
  rationale: Dalam daftar perlengkapan ibadah Kemah Suci, kata ini menunjuk pada wadah kecil untuk dupa. “Cawan” konkret dan wajar dalam bahasa Indonesia, tanpa memakai arti harfiah lain, “telapak tangan”.
- source_word: אַחַת
  choice: satu
  rationale: Bilangan pokok yang menerangkan kata benda feminin כַּף; diterjemahkan langsung.
- source_word: עֲשָׂרָה
  choice: seberat sepuluh syikal
  rationale: Teks Ibrani hanya menyatakan “sepuluh”, tetapi rumusan persembahan yang berulang dalam konteks langsung menunjukkan bahwa yang dimaksud ialah berat dalam syikal. Penambahan “seberat” memperjelas fungsi ukuran itu secara alami.
- source_word: זָהָב
  choice: emas
  rationale: Menunjukkan bahan pembuat wadah tersebut.
- source_word: מְלֵאָה
  choice: penuh dengan
  rationale: Kata sifat predikatif feminin yang mengacu kepada wadah; ungkapan Indonesia yang alami ialah “penuh dengan”.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Istilah baku dan alami untuk bahan harum yang dibakar dalam ibadah di tempat suci.
