  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Ibrani dengan setia: כף sebagai “cawan” (wadah kultis), אחת sebagai “satu,” זהב sebagai “emas,” dan קטרת sebagai “dupa.” Frasa “seberat sepuluh syikal” dengan tepat menjelaskan elipsis “sepuluh” dalam rumusan persembahan yang paralel di konteks dekat, dan catatan kaki secara jujur menandai penjelasan tersebut.'
