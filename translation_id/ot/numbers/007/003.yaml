  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: id
  text: 'Mereka membawa persembahan mereka ke hadapan Yahweh: enam pedati bertutup[a] dan dua belas ekor lembu—satu pedati untuk setiap dua pemimpin dan satu ekor lembu untuk setiap pemimpin—lalu mereka mempersembahkan semuanya di hadapan Kemah Suci.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “enam pedati bertudung.” Ungkapan Ibrani עֶגְלֹת צָב secara tradisional dipahami sebagai pedati yang bertutup.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: persembahan mereka
  rationale: קָרְבָּן menunjuk pada sesuatu yang dibawa untuk dipersembahkan dalam konteks ibadah; “persembahan” alami dan tepat dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: ke hadapan Yahweh
  rationale: לִפְנֵי menyatakan arah dan posisi di hadapan atau dalam hadirat seseorang; bersama verba “membawa”, “ke hadapan” paling alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: עֶגְלֹת צָב
  choice: kereta bertutup
  rationale: עֲגָלָה berarti kereta atau pedati, sedangkan צָב secara tradisional dipahami sebagai penanda bahwa kendaraan itu bertutup; karena makna unsur kedua tidak sepenuhnya pasti, alternatif dicatat dalam catatan kaki.
- source_word: בָּקָר
  choice: lembu
  rationale: בָּקָר dapat berarti ternak besar, tetapi konteks kendaraan angkut dan bentuk tunggal שׁוֹר dalam klausa berikut menunjukkan lembu penarik.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: satu kereta untuk setiap dua pemimpin
  rationale: 'Ungkapan ini bersifat distributif: satu kereta ditanggung atau diberikan oleh tiap pasangan pemimpin.'
- source_word: הַנְּשִׂאִים
  choice: pemimpin
  rationale: נָשִׂיא di sini merujuk kepada para kepala suku Israel; “pemimpin” jelas dan tidak memberi nuansa monarki yang tidak diperlukan.
- source_word: וְשׁוֹר לְאֶחָד
  choice: dan satu ekor lembu untuk masing-masing pemimpin
  rationale: Frasa ini distributif. Rujukan “masing-masing” dibuat eksplisit sebagai para pemimpin agar mudah dipahami dalam bahasa Indonesia.
- source_word: וַיַּקְרִיבוּ אוֹתָם
  choice: Mereka mempersembahkan semuanya
  rationale: הקריב berarti membawa mendekat atau mempersembahkan. “Mempersembahkan” mempertahankan konteks ibadah tanpa menyiratkan bahwa kereta dan lembu itu disembelih sebagai kurban.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah tempat kediaman kudus portabel Israel; “Kemah Suci” merupakan padanan Indonesia yang jelas dan membedakannya dari אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar, sementara tetap mengikuti bentuk transliterasi yang lazim secara akademis.
- issue: Sifat tindakan terhadap kereta dan lembu
  choice: mempersembahkan
  alternative: membawa mendekat atau mempersembahkan sebagai kurban
  rationale: Verba הקריב memiliki nuansa kultis, tetapi objeknya mencakup kereta angkut. Karena itu terjemahan tidak boleh menyiratkan secara khusus penyembelihan kurban.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur daftar dibuat mengalir, sedangkan pengulangan distributif dipertahankan agar jumlah sumbangan setiap pemimpin tetap jelas.
