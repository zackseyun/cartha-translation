  terminology: '"Persembahan", "Yahweh", "pemimpin", "lembu", dan "Kemah Suci" sesuai register dan konteks. Catatan kaki perlu mempertahankan unsur "bertutup/bertudung" dalam alternatifnya; "kereta angkut" saja menghilangkan unsur leksikal צָב yang sedang dijelaskan.'
