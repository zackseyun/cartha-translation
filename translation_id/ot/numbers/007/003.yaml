  source_fidelity: 'Makna pokok dan distribusi jumlah dipertahankan dengan tepat: enam kendaraan untuk dua belas pemimpin (satu per dua pemimpin) dan dua belas lembu (satu per pemimpin). Nama ilahi Yahweh, tindakan membawa/presentasi, serta מִשְׁכָּן sebagai Kemah Suci juga tepat. Namun, istilah "kereta" dalam bahasa Indonesia modern cenderung ambigu (misalnya kereta api atau kendaraan bermotor) untuk עֶגְלֹת, sehingga "pedati" lebih setia pada kendaraan angkut kuno yang ditarik lembu.'
