  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: id
  text: 'dan untuk kurban keselamatan[a]: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur setahun. Itulah persembahan Elizur anak Syedeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: dan untuk kurban keselamatan
  rationale: Kata sambung dan preposisi melanjutkan daftar persembahan. “Kurban keselamatan” mempertahankan istilah teknis kultis שְׁלָמִים, sementara catatan kaki mencantumkan padanan lain yang mungkin.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif untuk ternak sapi dan tidak menentukan jenis kelaminnya; kata penggolong “ekor” membuat ungkapan alami dalam bahasa Indonesia.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus menunjuk domba jantan dewasa.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים menunjuk kambing jantan, sehingga unsur jenis kelamin dipertahankan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur setahun
  rationale: כְּבָשִׂים adalah bentuk maskulin yang dalam daftar kurban ini menunjuk anak domba jantan, sedangkan בְּנֵי שָׁנָה menyatakan usia satu tahun.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Ungkapan ini merangkum daftar sebelumnya. “Itulah” alami dalam narasi bahasa Indonesia, dan “persembahan” membedakan קָרְבָּן yang umum dari זֶבַח yang lebih khusus.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizur anak Syedeur
  rationale: Nama-nama ditransliterasikan ke pola ejaan Indonesia; patronimik בֶּן diterjemahkan secara langsung sebagai “anak”.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan
  rationale: Istilah Ibrani dapat menonjolkan keutuhan, kesejahteraan, atau persekutuan yang terkait dengan kurban. Terjemahan utama memakai istilah kultis yang lazim tanpa meniadakan alternatif semantiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata penggolong “ekor” dipakai secara konsisten dalam daftar hewan; struktur ringkas mempertahankan corak inventaris kurban.
