lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa ini menunjuk pada kambing jantan. Bentuk “seekor kambing jantan” alami dalam bahasa Indonesia, mempertahankan jenis kelamin hewan, dan sekaligus menyatakan jumlah satu melalui penggolong “seekor”.
- source_word: אֶחָד
  choice: seekor
  rationale: Dalam daftar persembahan ini, אֶחָד menyatakan jumlah satu. Bahasa Indonesia secara alami mengungkapkannya dengan penggolong “seekor”; tidak perlu menambahkan “satu” karena akan terasa berlebihan.
- source_word: לְחַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks ibadah kurban, חַטָּאת adalah nama jenis persembahan, bukan sekadar dosa secara abstrak. “Kurban penghapus dosa” menyampaikan fungsi dan kategori ritualnya dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna istilah kurban חַטָּאת
  choice: kurban penghapus dosa
  alternative: untuk dosa
  rationale: Konteks daftar persembahan dalam Bilangan 7 menunjukkan kategori kurban tertentu. Pilihan ini mempertahankan makna ritual tanpa mereduksinya menjadi gagasan moral yang umum.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat; susunan dipertahankan sebagai unsur dalam daftar persembahan. Tanda titik koma mengikuti kesinambungan daftar.
