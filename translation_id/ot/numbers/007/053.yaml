source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: id
  text: 'dan sebagai kurban persekutuan[a]: dua ekor sapi, lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba berumur setahun. Itulah persembahan Elisama anak Amihud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini juga dapat diterjemahkan “kurban perdamaian” atau “kurban kesejahteraan”; kurban ini biasanya mencakup jamuan bersama yang menyatakan damai, keutuhan, atau persekutuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: dan sebagai kurban persekutuan
  rationale: Prefiks וּלְ memperkenalkan unsur berikutnya dalam daftar. 'Kurban persekutuan' merupakan istilah Indonesia yang alami bagi שְׁלָמִים dan mencerminkan dimensi persekutuan dalam kurban ini tanpa meniadakan nuansa damai atau kesejahteraan.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif untuk ternak sapi; 'sapi' tidak mempersempitnya menjadi lembu jantan, sedangkan penggolong 'ekor' diperlukan dalam bahasa Indonesia yang alami.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִם secara khusus menunjuk kepada domba jantan.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים menunjuk kepada kambing jantan, sehingga jenis kelaminnya dipertahankan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba berumur setahun
  rationale: כְּבָשִׂים berarti anak-anak domba dan בְּנֵי שָׁנָה secara idiomatis berarti 'berumur setahun'. Ayat ini tidak memakai istilah yang secara tegas menyatakan jantan, sehingga terjemahan tidak menambahkannya.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Klausa tanpa verba ini menunjuk kembali kepada daftar yang baru disebutkan. 'Itulah' alami dalam narasi inventaris Indonesia, sedangkan קָרְבַּן diterjemahkan 'persembahan' untuk membedakannya dari זֶבַח, meskipun keduanya berhubungan dengan pemberian kurban.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama anak Amihud
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dan patronimik בֶּן diterjemahkan 'anak'.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan; kurban pendamaian; kurban kesejahteraan
  rationale: '''Kurban persekutuan'' cukup dikenal dan menonjolkan jamuan kurban yang dibagikan, tetapi keluasan makna akar yang berkaitan dengan damai, keutuhan, dan kesejahteraan tetap dicatat dalam catatan kaki agar istilah itu tidak dipersempit secara teologis.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Penggolong 'ekor' digunakan secara konsisten untuk hewan. Susunan daftar dipertahankan, dan titik dua menandai perincian kurban. Tidak ditambahkan jenis kelamin pada anak domba karena teks ayat ini hanya menyebut anak domba berumur setahun.
