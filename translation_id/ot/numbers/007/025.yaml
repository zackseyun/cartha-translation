base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: id
  text: Persembahannya ialah satu pinggan perak[a] yang beratnya seratus tiga puluh syikal dan satu mangkuk perak[b] yang beratnya tujuh puluh syikal, menurut syikal tempat kudus.[c] Keduanya penuh dengan tepung halus yang dicampur dengan minyak untuk persembahan sajian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piring perak”.
    reason: lexical_alternative
  - marker: b
    text: Atau “bokor perak”.
    reason: lexical_alternative
  - marker: c
    text: Artinya, menurut standar berat yang berlaku di tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Persembahannya ialah
  rationale: קָרְבָּן menunjuk pada sesuatu yang dibawa dan dipersembahkan dalam konteks ibadah. “Persembahan” merupakan padanan baku dan jelas; “ialah” melengkapi rumus daftar ini secara wajar dalam bahasa Indonesia.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: satu pinggan perak
  rationale: קַעֲרָה adalah wadah yang relatif lebar atau ceper. “Pinggan” membedakannya dari mangkuk yang disebut sesudahnya dan sesuai dengan konteks perkakas persembahan.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: yang beratnya seratus tiga puluh syikal
  rationale: Susunan bilangan Ibrani secara harfiah adalah “tiga puluh dan seratus”; urutannya disesuaikan dengan kaidah bahasa Indonesia, sedangkan keterangan eksplisit tentang berat tetap dipertahankan.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: satu mangkuk perak
  rationale: מִזְרָק menunjuk pada wadah ritual yang dapat diterjemahkan sebagai mangkuk, bokor, atau bejana. “Mangkuk” adalah istilah Indonesia modern yang paling mudah dipahami tanpa menetapkan bentuk wadah secara terlalu khusus.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: yang beratnya tujuh puluh syikal
  rationale: Konteks menunjukkan bahwa angka ini menyatakan berat wadah kedua. Pengulangan “yang beratnya” membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menyatakan standar berat resmi yang terkait dengan tempat kudus. Bentuk “menurut” mempertahankan fungsi preposisinya dengan bahasa Indonesia yang alami.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Keduanya penuh dengan
  rationale: שְׁנֵיהֶם secara eksplisit merujuk pada kedua wadah, sedangkan מְלֵאִים adalah predikat “penuh”. Bentuk ini mempertahankan penekanan dan rujukannya.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: סֹלֶת adalah tepung bermutu halus yang lazim digunakan dalam persembahan. “Tepung halus” merupakan padanan yang tepat dan mudah dipahami.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif בְּלוּלָה menggambarkan tepung yang telah dicampur dengan minyak. Padanan ini alami dan mempertahankan makna persiapannya.
- source_word: לְמִנְחָה
  choice: untuk persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan berbahan hasil tanaman, khususnya tepung, bukan sekadar persembahan umum. “Persembahan sajian” mempertahankan istilah kultis yang lazim dalam bahasa Indonesia.
