translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur inventaris sumber dipertahankan, tetapi keterangan berat diulang agar hubungan antarbagiannya jelas. Istilah “syikal” dan “persembahan sajian” dipertahankan sebagai kosakata khusus konteks Alkitab, dengan catatan yang menjelaskan standar berat tempat kudus.
