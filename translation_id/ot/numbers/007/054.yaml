  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: id
  text: Pada hari kedelapan, pemimpin keturunan Manasye[a] ialah Gamaliel anak Pedazur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Manasye”; sebutan bagi keturunan atau suku Manasye.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Gabungan preposisi ב dengan יוֹם dan bilangan bertingkat menyatakan waktu. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan konteks yang tidak tersurat dalam ayat.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks persembahan suku-suku, kata ini menunjuk kepada kepala atau wakil resmi kelompok. “Pemimpin” jelas dan tidak menyiratkan kedudukan raja seperti yang mungkin ditimbulkan oleh “pangeran”.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: pemimpin keturunan Manasye
  rationale: Preposisi ל menghubungkan pemimpin dengan kelompok yang diwakilinya, sedangkan בְנֵי secara harfiah berarti “anak-anak” tetapi di sini merupakan sebutan genealogis-sukuis. “Keturunan Manasye” menyampaikan maksud itu secara alami tanpa mengganti ungkapan tersebut secara eksplisit dengan “suku”.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama pribadi sekaligus nama suku dialihaksarakan menurut bentuk Indonesia yang lazim.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Nama pribadi dialihaksarakan dengan bentuk Indonesia yang lazim.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus patronimik, בֶּן menyatakan hubungan ayah-anak. “Anak” merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: פְּדָה צוּר
  choice: Pedazur
  rationale: Nama majemuk ini ditulis sebagai satu nama, mengikuti kebiasaan alih aksara Indonesia.
