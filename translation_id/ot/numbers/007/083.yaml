  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: id
  text: 'Dan untuk kurban keselamatan: dua ekor sapi[a], lima ekor domba jantan, lima ekor kambing jantan, dan lima ekor anak domba jantan berumur satu tahun. Itulah persembahan Ahira, putra Enan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan” untuk “kurban keselamatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: dan untuk kurban keselamatan
  rationale: Kata penghubung dan preposisi melanjutkan daftar persembahan, sedangkan זֶבַח dipertahankan sebagai 'kurban'. Istilah 'kurban keselamatan' merupakan padanan kultis yang ringkas dan tetap membuka cakupan makna שְׁלָמִים.
- source_word: בָּקָר שְׁנַיִם
  choice: dua ekor sapi
  rationale: בָּקָר adalah istilah kolektif untuk ternak sapi dan dalam ayat ini tidak menyatakan jenis kelamin; kata penggolong 'ekor' membuat ungkapan alami dalam bahasa Indonesia.
- source_word: אֵילִם חֲמִשָּׁה
  choice: lima ekor domba jantan
  rationale: אֵילִים secara khusus menunjuk kepada domba jantan dewasa.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: lima ekor kambing jantan
  rationale: עַתֻּדִים secara khusus menunjuk kepada kambing jantan.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: lima ekor anak domba jantan berumur satu tahun
  rationale: Padanan ini mempertahankan jenis hewan, jenis kelamin, dan keterangan usia yang dinyatakan teks Ibrani.
- source_word: זֶה קָרְבַּן
  choice: Itulah persembahan
  rationale: Formula penutup demonstratif dikenali secara alami dengan 'Itulah', sementara קָרְבַּן diterjemahkan 'persembahan' untuk membedakannya secara wajar dari זֶבַח dalam klausa sebelumnya.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: Ahira anak Enan
  rationale: Nama-nama ditransliterasikan, dan patronimik בֶּן diterjemahkan secara langsung sebagai 'anak'.
