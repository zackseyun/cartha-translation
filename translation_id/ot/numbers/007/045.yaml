  yaml_path: translation/ot/numbers/007/045.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: id
  text: seekor sapi jantan dari kawanan, seekor domba jantan, dan seekor anak domba jantan berumur satu tahun, sebagai kurban bakaran;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר
  choice: sapi jantan
  rationale: Dalam konteks kurban, פַּר menunjuk pada sapi jantan; pilihan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia yang diulang menyatakan jumlah masing-masing hewan; penggolong 'seekor' menyampaikan makna 'satu' secara alami dalam daftar bahasa Indonesia.
- source_word: בֶּן בָּקָר
  choice: dari kawanan
  rationale: Ungkapan konstruksi ini secara idiomatis menggolongkan hewan tersebut sebagai ternak sapi; 'dari kawanan' mempertahankan unsur asal atau golongannya tanpa terjemahan harfiah yang kaku.
- source_word: אַיִל
  choice: domba jantan
  rationale: Ini adalah padanan baku dan jelas untuk domba jantan dewasa dalam konteks kurban.
- source_word: כֶּבֶשׂ
  choice: anak domba jantan
  rationale: Kata ini menunjuk pada anak domba berjenis kelamin jantan; unsur 'jantan' dipertahankan agar nilai leksikalnya tersurat.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Ungkapan Ibrani ini menetapkan usia hewan; padanan tersebut jelas dan alami dalam bahasa Indonesia modern.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah bagi kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan ringkas yang sesuai dengan bentuk daftar ayat.
