  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/051.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: id
  text: seekor lembu jantan dari kawanan sapi, seekor domba jantan, dan seekor anak domba jantan berumur satu tahun, sebagai persembahan bakaran;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: seekor lembu jantan dari kawanan sapi
  rationale: פַּר menunjuk pada lembu jantan, sedangkan idiom בֶּן־בָּקָר menggolongkannya sebagai hewan dari kawanan sapi. Ungkapan ini mempertahankan kedua unsur sumber dan tetap alami dalam bahasa Indonesia.
- source_word: אַיִל
  choice: seekor domba jantan
  rationale: Istilah baku bagi domba jantan dewasa dalam konteks kurban.
- source_word: כֶּבֶשׂ
  choice: seekor anak domba jantan
  rationale: כֶּבֶשׂ berarti anak domba dan dalam daftar kurban ini berjenis kelamin jantan; penyebutan 'jantan' membuat informasi itu jelas.
- source_word: בֶּן שְׁנָתוֹ
  choice: berumur satu tahun
  rationale: Idiom Ibrani ini menyatakan umur hewan; terjemahan ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: לְעֹלָה
  choice: sebagai persembahan bakaran
  rationale: עֹלָה adalah istilah kurban bagi persembahan yang dibakar seluruhnya; 'persembahan bakaran' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia ini diulang untuk setiap hewan. Penggolong 'seekor' secara alami menyampaikan jumlah satu bagi masing-masing hewan dalam bahasa Indonesia.
theological_decisions: []
