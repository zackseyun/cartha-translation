  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur inventaris dipertahankan, dengan penggolong 'seekor' untuk kelancaran alami. Tanda titik koma mengikuti fungsi ayat sebagai bagian dari daftar persembahan yang berlanjut.
