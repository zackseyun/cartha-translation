source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: id
  text: Pada hari ketiga, pemimpin keturunan Zebulon[a] ialah Eliab anak Helon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pemimpin bagi keturunan Zebulon.” Preposisi Ibrani yang digunakan dapat menyatakan afiliasi atau perwakilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Ungkapan waktu dengan preposisi ב paling alami diterjemahkan sebagai “pada hari”; הַשְּׁלִישִׁי adalah bilangan bertingkat yang menerangkan “hari”.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks suku-suku Israel di kitab Bilangan, kata ini menunjuk kepada kepala atau pemimpin resmi suku; “pemimpin” jelas dalam bahasa Indonesia modern dan tidak menyiratkan gelar kerajaan seperti “pangeran”.
- source_word: לִבְנֵי זְבוּלֻן
  choice: keturunan Zebulon
  rationale: בְּנֵי dalam konteks kesukuan menunjuk kepada para keturunan atau anggota suku Zebulon. Preposisi ל dapat menandai afiliasi ataupun perwakilan; teks utama memakai konstruksi afiliasi yang alami, sedangkan kemungkinan makna perwakilan dicatat dalam catatan kaki.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Bentuk nama diri yang lazim dalam bahasa Indonesia.
- source_word: בֶּן חֵלֹן
  choice: anak Helon
  rationale: בֶּן adalah rumus patronimik yang secara alami diterjemahkan “anak”; Helon dipertahankan sebagai nama diri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Keturunan Zebulon” dipilih daripada “bani Zebulon” agar mudah dipahami pembaca umum tanpa menghilangkan pengertian genealogis dan kesukuan. Penanda catatan kaki ditempatkan pada frasa yang benar-benar memiliki variasi penafsiran.
