lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa konstruksi ini secara idiomatis menunjuk kepada kambing jantan. Kata penggolong 'seekor' sekaligus menyampaikan jumlah satu secara alami dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan 'satu' menyatakan jumlah hewan. Dalam susunan daftar bahasa Indonesia, 'seekor' secara alami menggabungkan penggolong hewan dengan makna bilangan tersebut.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks persembahan, חַטָּאת menunjuk kepada jenis kurban yang berkaitan dengan penghapusan dosa. Preposisi לְ dapat secara wajar diterjemahkan 'sebagai' dalam daftar persembahan ini.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks peribadatan
  choice: kurban penghapus dosa
  alternative: untuk dosa
  rationale: Konteks daftar kurban menuntut makna teknis suatu jenis persembahan, bukan sekadar pengertian abstrak 'dosa'. Namun, catatan kaki mempertahankan alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan gaya inventaris berulang dalam Bilangan 7. Istilah 'kurban penghapus dosa' dipilih agar fungsi kultisnya jelas bagi pembaca modern.
