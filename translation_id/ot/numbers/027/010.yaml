  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: id
  text: Tetapi jika ia tidak mempunyai saudara laki-laki, haruslah kamu memberikan warisannya kepada saudara-saudara laki-laki ayahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih ringkas, “kepada paman-pamannya dari pihak ayah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Gabungan konjungsi dan partikel syarat memperkenalkan kasus berikutnya dalam rangkaian hukum; “Tetapi jika” menyampaikan peralihan yang bersifat kontras sekaligus mempertahankan unsur syarat.
- source_word: אֵין לוֹ
  choice: ia tidak mempunyai
  rationale: Negasi eksistensial Ibrani dengan preposisi ל dan sufiks pronominal secara wajar dinyatakan sebagai kepemilikan dalam bahasa Indonesia.
- source_word: אַחִים
  choice: saudara laki-laki
  rationale: Bentuk jamak maskulin ini secara harfiah berarti saudara laki-laki dan dalam konteks hukum warisan menunjuk kepada ahli waris laki-laki, bukan saudara secara netral gender.
- source_word: וּנְתַתֶּם
  choice: haruslah kamu memberikan
  rationale: Bentuk orang kedua jamak meneruskan ketetapan hukum yang ditujukan kepada komunitas atau para pelaksana hukum; “haruslah” menyatakan daya wajibnya secara alami.
- source_word: נַחֲלָתוֹ
  choice: warisannya
  rationale: Dalam konteks ini נַחֲלָה menunjuk pada harta atau milik turun-temurun yang diwariskan; “warisannya” ringkas dan lazim.
- source_word: לַאֲחֵי אָבִיו
  choice: kepada saudara-saudara laki-laki ayahnya
  rationale: Pilihan ini mempertahankan susunan kekerabatan eksplisit dari frasa Ibrani, alih-alih langsung menafsirkannya dengan istilah relasional yang lebih ringkas.
