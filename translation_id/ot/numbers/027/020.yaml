  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: id
  text: Berikanlah sebagian dari kewibawaanmu kepadanya[a], supaya seluruh umat Israel[b] menaati dia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebagian dari keagunganmu”, “kehormatanmu”, atau “semarakmu”. Kata Ibrani ini juga dapat menunjuk pada wibawa yang melekat pada suatu jabatan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seluruh jemaat anak-anak lelaki Israel”; maksudnya ialah seluruh umat Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “mendengarkan dia” atau “mengindahkan dia”. Kata Ibrani yang dipakai dapat berarti mendengar dengan tanggapan taat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Berikanlah
  rationale: Bentuk verba ini melanjutkan rangkaian perintah kepada Musa. ‘Berikanlah’ mempertahankan arti dasar נתן sekaligus terdengar wajar dalam konteks pelantikan.
- source_word: מֵהוֹדְךָ
  choice: sebagian dari kewibawaanmu
  rationale: Awalan מִן menunjukkan sebagian dari sesuatu. הוֹד dapat berarti semarak, keagungan, kehormatan, atau wibawa; ‘kewibawaan’ mempertahankan unsur kehormatan yang tampak sekaligus daya otoritatif dalam konteks kepemimpinan.
- source_word: עָלָיו
  choice: kepadanya
  rationale: Dalam bahasa Indonesia, ‘memberikan ... kepadanya’ menyampaikan penganugerahan itu secara alami, meskipun bentuk Ibraninya secara harfiah memakai gambaran ‘di atasnya’.
- source_word: לְמַעַן
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan dari pemberian kewibawaan kepada Yosua.
- source_word: יִשְׁמְעוּ
  choice: menaati dia
  rationale: שׁמע dapat berarti mendengar, mendengarkan, mengindahkan, atau menaati. Dalam konteks pengangkatan seorang pemimpin, yang dimaksud ialah mendengar dengan tanggapan patuh.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: Ungkapan ini menunjuk kepada segenap komunitas Israel. ‘Seluruh umat Israel’ alami dalam bahasa Indonesia dan menghindari kesan bahwa hanya laki-laki yang dimaksud.
theological_decisions:
- issue: Hakikat הוֹד yang diberikan Musa kepada Yosua
  choice: Diterjemahkan ‘kewibawaan’, dengan catatan tentang ‘keagungan’, ‘kehormatan’, dan ‘semarak’.
  alternative: ‘otoritas’, ‘kehormatan’, ‘keagungan’, atau ‘semarak’
  rationale: Konteks pelantikan dan tujuan agar umat menaati Yosua memberi הוֹד fungsi kepemimpinan, tetapi kata itu tidak identik begitu saja dengan otoritas. ‘Kewibawaan’ menjaga kaitan antara martabat yang tampak dan otoritas, sedangkan catatan mempertahankan keluasan maknanya.
- issue: Daya makna שׁמע dalam klausa tujuan
  choice: Diterjemahkan ‘menaati dia’.
  alternative: ‘mendengarkan dia’ atau ‘mengindahkan dia’
  rationale: Dalam konteks ini, mendengar bukan sekadar menerima bunyi, melainkan menanggapi pemimpin yang baru dilantik. Catatan mempertahankan ambiguitas leksikal verba Ibrani.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: Diterjemahkan ‘umat Israel’.
  alternative: Secara harfiah, ‘anak-anak lelaki Israel’; secara idiomatis juga dapat diterjemahkan ‘orang Israel’.
  rationale: Frasa tersebut merupakan sebutan kolektif bagi komunitas keturunan Israel, bukan pembatasan kepada laki-laki saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah ‘Berikanlah’ sesuai dengan tuturan ilahi kepada Musa. ‘Kewibawaan’ dipilih sebagai padanan yang dapat menjembatani martabat, kehormatan, dan otoritas tanpa menyempitkan הוֹד menjadi istilah administratif semata.
