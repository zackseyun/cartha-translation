  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: id
  text: Mengapa nama ayah kami harus hilang dari antara kaumnya karena ia tidak mempunyai anak laki-laki? Berilah kami tanah milik di antara saudara-saudara ayah kami.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkurang” atau “disingkirkan”. Bahasa Ibrani mempertanyakan mengapa “nama” ayah mereka harus hilang dari kaumnya karena ia tidak mempunyai anak laki-laki.
    reason: lexical_alternative
  - marker: b
    text: “Tanah milik” adalah bidang tanah atau jatah warisan yang menjadi milik suatu keluarga di dalam kaumnya.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa ... harus
  rationale: Menyampaikan pertanyaan retoris sekaligus keberatan yang tersirat dalam permohonan itu.
- source_word: יִגָּרַע
  choice: lenyap
  rationale: Bentuk Nifal di sini menyatakan hilangnya nama sang ayah dari lingkup kaum dan warisannya; 'lenyap' mempertahankan dampak ungkapan Ibrani tanpa menjelaskan secara berlebihan.
- source_word: שֵׁם
  choice: nama
  rationale: Diterjemahkan secara harfiah untuk mempertahankan ungkapan Ibrani tentang keberlanjutan garis dan kedudukan ayah.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: dari tengah kaumnya
  rationale: '''Kaum'' menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti dan sesuai dengan konteks pembagian tanah suku.'
- source_word: כִּי אֵין לוֹ בֵּן
  choice: hanya karena ia tidak mempunyai anak laki-laki
  rationale: '''Anak laki-laki'' mempertahankan kekhususan gender dalam persoalan hukum warisan; ''hanya karena'' secara alami menonjolkan keberatan retoris, sedangkan bentuk kini bahasa Ibrani dipertahankan secara idiomatis dalam bahasa Indonesia.'
- source_word: תְּנָה לָּנוּ
  choice: Berilah kami
  rationale: Imperatif langsung yang tetap wajar, santun, dan bermartabat dalam bahasa Indonesia.
- source_word: אֲחֻזָּה
  choice: tanah milik
  rationale: Dalam konteks ini menunjuk bidang tanah yang menjadi milik tetap atau jatah warisan, bukan sekadar barang milik umum.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: di tengah saudara-saudara ayah kami
  rationale: Mempertahankan rujukan khusus kepada saudara laki-laki ayah dalam garis kerabat pihak ayah tanpa memperluasnya menjadi kerabat secara umum.
theological_decisions:
- issue: Bahasa warisan yang spesifik gender
  choice: anak laki-laki / saudara-saudara ayah
  alternative: anak / kerabat ayah
  rationale: Teks Ibrani secara eksplisit memakai istilah laki-laki karena perkara hukumnya menyangkut pewarisan melalui anak laki-laki dan saudara laki-laki sang ayah. Kekhususan ini tidak dinetralkan.
- issue: Makna hilangnya nama ayah
  choice: nama ... lenyap dari tengah kaumnya
  alternative: nama ... dikurangi atau disingkirkan dari tengah kaumnya
  rationale: Terjemahan mempertahankan idiom 'nama' dan ketegangan antara hilangnya garis keluarga, kedudukan, serta ingatan dalam struktur kaum tanpa memilih satu penafsiran teologis secara sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada permohonan hukum yang langsung dan bermartabat. 'Kaum' dipilih untuk kelompok kekerabatan, sedangkan 'tanah milik' memperjelas konteks agraris אֲחֻזָּה tanpa menghapus nuansa warisan.
