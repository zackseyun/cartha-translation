  to: Mengapa nama ayah kami harus hilang dari antara kaumnya karena ia tidak mempunyai anak laki-laki? Berilah kami tanah milik di antara saudara-saudara ayah kami.[a][b]
  rationale: Menghapus “hanya” agar tidak menambah pembatasan pada alasan yang diberikan, dan mengganti “lenyap dari tengah” dengan “hilang dari antara” untuk menyampaikan kehilangan atau penghapusan nama secara lebih proporsional serta alami dalam bahasa Indonesia. Penanda dan isi catatan kaki dipertahankan karena tetap sesuai dengan teks revisi.
