  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: id
  text: 'Mereka berdiri di hadapan Musa, di hadapan Imam Eleazar, di hadapan para pemimpin dan seluruh umat, di pintu masuk Kemah Pertemuan, dan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: Mereka berdiri
  rationale: Bentuk feminin jamak menunjukkan bahwa para perempuan yang disebut sebelumnya mengambil tempat dalam suasana resmi. Terjemahan ini langsung, alami, dan mempertahankan nuansa tampil secara terbuka tanpa menambahkan keterangan yang tidak tersurat.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Pengulangan frasa ini menegaskan suasana publik dan yuridis. 'Di hadapan' lebih tepat daripada sekadar 'di depan' karena menyatakan kehadiran resmi di hadapan pihak-pihak berwenang.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Susunan gelar dan nama ini alami dalam bahasa Indonesia serta tidak memperluas gelarnya menjadi 'imam besar', yang tidak dinyatakan dalam teks.
- source_word: הַנְּשִׂיאִם
  choice: para pemimpin
  rationale: Kata ini menunjuk kepada para kepala atau pemimpin resmi komunitas. 'Para pemimpin' jelas dalam bahasa Indonesia modern dan tidak menimbulkan kesan kebangsawanan seperti 'para pangeran'.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: Dalam kitab Bilangan, עֵדָה menunjuk kepada komunitas Israel yang berhimpun. 'Seluruh umat' mempertahankan dimensi komunal dan keagamaan sekaligus terdengar alami.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: Terjemahan ini menyatakan lokasi dengan jelas dan memakai istilah baku yang sesuai bagi אֹהֶל מוֹעֵד.
- source_word: לֵאמֹר
  choice: lalu berkata
  rationale: Ungkapan ini memperkenalkan ucapan langsung pada ayat berikutnya. Bentuk finit ini lebih alami dalam bahasa Indonesia daripada 'dengan mengatakan' tanpa mengubah fungsi wacananya.
theological_decisions:
- issue: Latar publik dan yuridis permohonan para perempuan
  choice: Mempertahankan pengulangan 'di hadapan' serta seluruh daftar pihak yang hadir
  alternative: Meringkasnya menjadi 'menghadap Musa dan seluruh umat beserta para pemimpinnya'
  rationale: Susunan Ibrani menekankan bahwa perkara itu diajukan secara terbuka di hadapan Musa, imam, para pemimpin, dan komunitas. Struktur tersebut dipertahankan agar bobot hukum dan komunalnya tidak hilang.
- issue: Makna עֵדָה
  choice: seluruh umat
  alternative: seluruh jemaah atau seluruh perhimpunan
  rationale: '''Umat'' menyampaikan identitas komunitas Israel, bukan sekadar kerumunan atau pertemuan prosedural, tanpa memasukkan pengertian denominasi tertentu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'di hadapan' sengaja dipertahankan untuk mencerminkan tekanan retoris dan hukum dalam teks Ibrani; bentuk 'lalu berkata' dipakai agar pengantar menuju ucapan pada ayat berikutnya tetap alami.
