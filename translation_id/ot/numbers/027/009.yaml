  register: Bahasa hukum yang ringkas, bermartabat, dan mudah dipahami. Pronomina “ia” menghindari kekakuan “dia” dalam register hukum, sedangkan “berikanlah” mempertahankan daya perintah tanpa terdengar arkais.
