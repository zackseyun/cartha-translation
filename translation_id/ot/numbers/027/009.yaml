translation:
  language: id
  text: Jika ia tidak mempunyai anak perempuan, berikanlah warisannya kepada saudara-saudara laki-lakinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: Jika
  rationale: Membuka kasus bersyarat berikutnya dalam rangkaian hukum. Dalam bahasa Indonesia, “Jika” secara alami menyampaikan hubungan tersebut tanpa harus menerjemahkan וְ secara tersendiri.
- source_word: אֵין ל֖/וֹ
  choice: ia tidak mempunyai
  rationale: Konstruksi eksistensial dengan לּוֹ secara idiomatis menyatakan ketiadaan kepunyaan; “tidak mempunyai” jelas dan wajar dalam bahasa Indonesia.
- source_word: בַּת
  choice: anak perempuan
  rationale: Mempertahankan bentuk tunggal dan makna gender spesifik dari nomina Ibrani dalam konteks hukum waris.
- source_word: וּ/נְתַתֶּם
  choice: berikanlah
  rationale: Bentuk orang kedua jamak menyampaikan ketetapan kepada pihak-pihak yang bertanggung jawab. Imperatif berakhiran -lah sesuai dengan daya hukum bentuk Ibrani dan alami dalam bahasa Indonesia; hubungan akibat sudah jelas dari susunan kalimat bersyarat.
- source_word: נַחֲלָת֖/וֹ
  choice: warisannya
  rationale: Dalam konteks ini נַחֲלָה menunjuk pada harta atau hak milik turun-temurun yang dialihkan sebagai warisan; “warisannya” ringkas dan tepat.
- source_word: לְ/אֶחָי/ו
  choice: kepada saudara-saudaranya
  rationale: Bentuk Ibrani adalah maskulin jamak dan dalam ketetapan ini menunjuk kepada saudara laki-laki sebagai ahli waris berikutnya. Kata “saudara” dalam pemakaian Indonesia dapat bermakna umum, tetapi dalam konteks urutan ahli waris ayat ini dipahami sebagai saudara laki-laki.
theological_decisions: []
