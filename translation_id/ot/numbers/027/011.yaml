  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: id
  text: Jika ayahnya tidak mempunyai saudara laki-laki, kamu harus memberikan warisannya kepada kerabat sedarahnya yang paling dekat dari kaum keluarganya, dan kerabat itu harus mewarisinya.[a] Ini akan menjadi ketetapan hukum bagi orang Israel, seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kerabat itu harus mengambilnya sebagai milik.” Kata Ibrani yang digunakan dapat berarti “mewarisi” atau “mengambil sebagai milik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: saudara laki-laki
  rationale: Dalam urutan hukum waris ini, kata tersebut menunjuk pada saudara laki-laki dari ayah orang yang meninggal.
- source_word: נַחֲלָתוֹ
  choice: warisannya
  rationale: Istilah ini menunjuk pada harta atau milik turun-temurun yang dialihkan menurut hukum waris.
- source_word: שְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: kerabat sedarahnya yang paling dekat
  rationale: Terjemahan ini mempertahankan unsur hubungan sedarah dalam שְׁאֵר sekaligus tingkat kedekatan kekerabatan dalam הַקָּרֹב אֵלָיו.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: dari kaumnya
  rationale: Dalam struktur sosial Israel, מִשְׁפָּחָה dapat menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti; 'kaum' alami dalam bahasa Indonesia dan mempertahankan nuansa itu.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: dan kerabat itu harus mewarisinya
  rationale: Kata kerja ירשׁ di sini menyatakan penerimaan warisan secara sah; subjek diulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: ketetapan hukum
  rationale: Ungkapan ini menyatakan peraturan hukum yang mengikat; pilihan ini membawa kedua unsur makna secara alami tanpa ungkapan Indonesia yang kaku.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Ini adalah sebutan nasional-kovenantal bagi umat Israel secara keseluruhan, sehingga 'orang Israel' merupakan padanan Indonesia yang wajar dan tidak membatasi rujukan pada laki-laki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Cakupan ungkapan לִבְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Dalam konteks hukum nasional ini, ungkapan tersebut merupakan sebutan kolektif bagi bangsa Israel, bukan pembatasan hukum hanya kepada laki-laki.
translation_notes:
  register: Bahasa hukum yang modern, jelas, dan bermartabat. 'Saudara laki-laki' memperjelas jenis hubungan keluarga yang dimaksud; 'kaum' menunjukkan kelompok kekerabatan yang lebih luas daripada keluarga inti. Penanda catatan kaki [a] ditempatkan sesudah klausa yang diterangkannya.
