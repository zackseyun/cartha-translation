lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur cerita; “lalu” menyatakan urutan secara alami. Karena subjeknya Yahweh, “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar TUHAN.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan langsung dan alami untuk penerima firman.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif ini memperkenalkan isi ucapan. “Kata-Nya” mempertahankan unsur tersebut tanpa menghasilkan bentuk kaku “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Rumusan “berfirman ... kata-Nya” mempertahankan formula ujaran Ibrani sekaligus menghindari susunan yang terlalu harfiah.
