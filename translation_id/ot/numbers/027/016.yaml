  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: id
  text: Kiranya Yahweh[a], Allah segala roh dari semua manusia[b], mengangkat seorang laki-laki untuk memimpin umat ini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah Yahweh, Allah segala roh dari semua manusia, mengangkat seorang laki-laki untuk memimpin umat ini.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Allah segala roh dari segala daging.” “Segala daging” adalah ungkapan Ibrani bagi seluruh umat manusia dalam keadaan mereka sebagai makhluk fana.
    reason: cultural_note
  - marker: c
    text: Atau, “jemaah” atau “himpunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: mengangkat
  rationale: Dalam konteks penetapan penerus Musa, פקד berarti menunjuk atau menetapkan seseorang pada suatu tanggung jawab. “Mengangkat” alami dalam bahasa Indonesia untuk penetapan seorang pemimpin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap tampil sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: Allah atas roh
  rationale: Ungkapan ini mempertahankan “roh” dalam bentuk jamak secara maknawi dan memakai “atas” untuk menyatakan hubungan kuasa yang terkandung dalam konstruksi “Allah dari/atas,” tanpa mempersempitnya menjadi sekadar napas atau watak.
- source_word: לְכָל בָּשָׂר
  choice: semua manusia
  rationale: Secara harfiah ungkapan ini berarti “segala daging,” tetapi dalam konteks ini merujuk kepada seluruh umat manusia sebagai makhluk fana. Padanan maknawi dipakai dalam teks, sedangkan citra Ibraninya dijelaskan dalam catatan kaki.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Kata benda Ibrani ini berbentuk maskulin tunggal dan dalam konteksnya menunjuk kepada seorang pemimpin laki-laki yang akan menggantikan Musa.
- source_word: עַל הָעֵדָה
  choice: untuk memimpin umat ini
  rationale: עַל menyatakan kedudukan di atas umat, sedangkan עֵדָה menunjuk kepada komunitas Israel yang terhimpun. Ungkapan verbal ini menyampaikan fungsi kepemimpinan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan nama ilahi dalam permohonan Musa
  choice: Kiranya Yahweh ... mengangkat
  alternative: Biarlah TUHAN ... mengangkat
  rationale: Teks Ibrani memakai יהוה secara langsung. “Yahweh” mempertahankan nama pribadi ilahi, sedangkan “kiranya” menyampaikan nuansa permohonan dari bentuk verba konteks ini.
- issue: Makna gelar אֱלֹהֵי הָרוּחֹת לְכָל בָּשָׂר
  choice: Allah atas roh semua manusia
  alternative: Allah dari roh segala yang berdaging
  rationale: Pilihan utama mempertahankan rujukan kepada roh setiap manusia dan hubungan kuasa Allah tanpa menghasilkan susunan Indonesia yang sangat kaku. Terjemahan harfiah dicatat untuk menjaga citra dan ketegangan ungkapan sumber.
- issue: Jenis kelamin dalam אִישׁ
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Bentuk maskulin dan konteks penetapan penerus Musa mendukung penyebutan laki-laki secara eksplisit, bukan penetralan menjadi “seseorang.”
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Susunan “Allah atas roh semua manusia” sengaja mempertahankan bentuk gelar yang khas, sedangkan “untuk memimpin umat ini” mengalihkan konstruksi harfiah “atas umat” menjadi ungkapan Indonesia yang alami.
