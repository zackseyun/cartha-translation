  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: id
  text: Lalu Musa menumpangkan kedua tangannya ke atas Yosua dan memberinya perintah[a], tepat seperti yang telah difirmankan Yahweh dengan perantaraan Musa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “memberinya amanat” atau “menugaskannya.” Verba Ibrani ini lazim berarti memberi perintah, tetapi dalam konteks ini tindakan tersebut merupakan bagian dari penetapan resmi Yosua sebagai pemimpin.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melalui tangan Musa,” suatu ungkapan Ibrani yang berarti melalui Musa sebagai perantara atau agen Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: menumpangkan kedua tangannya ke atas Yosua
  rationale: Ungkapan ini menggambarkan tindakan ritual menumpangkan tangan. Bentuk יָדָיו adalah jamak; “kedua tangannya” merupakan ungkapan Indonesia yang alami dalam konteks ini. Nama Yosua dipakai untuk memperjelas acuan pronomina berdasarkan konteks langsung.
- source_word: וַיְצַוֵּהוּ
  choice: memberinya perintah
  rationale: Verba צוה pada dasarnya berarti memberi perintah atau amanat. Pilihan ini dekat dengan makna leksikal sekaligus membiarkan konteks penetapan Yosua memberi nuansa penugasan resmi; alternatifnya dijelaskan dalam catatan kaki.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Pilihan ini menandai kesesuaian tindakan Musa dengan firman Yahweh sebelumnya.
- source_word: דִּבֶּר
  choice: telah difirmankan
  rationale: Aspek lampau dinyatakan secara alami dalam bahasa Indonesia untuk menunjukkan bahwa firman Yahweh mendahului tindakan Musa. “Difirmankan” sesuai dengan tuturan ilahi dalam ragam Alkitab yang tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: dengan perantaraan Musa
  rationale: Ungkapan Ibrani harfiah “melalui tangan Musa” menyatakan bahwa Musa bertindak sebagai perantara atau agen. Padanan ini alami dalam bahasa Indonesia dan mempertahankan gagasan perantaraan.
theological_decisions:
- issue: Makna וַיְצַוֵּהוּ dalam penetapan Yosua
  choice: memberinya perintah
  alternative: memberinya amanat / menugaskannya
  rationale: Makna dasar verba adalah memberi perintah, sedangkan konteks menunjukkan tindakan resmi dalam penetapan Yosua. Teks utama mempertahankan makna leksikal yang lebih terbuka, dan catatan kaki menyebutkan nuansa kontekstual tanpa menyamakannya dengan konsep penahbisan dari tradisi tertentu.
- issue: Ungkapan perantaraan ilahi בְּיַד מֹשֶׁה
  choice: dengan perantaraan Musa
  alternative: melalui tangan Musa
  rationale: Padanan idiomatis menyampaikan bahwa Yahweh berbicara melalui Musa sebagai agen-Nya, tanpa menghilangkan idiom sumber yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap jelas. Nama Musa dan Yosua menggantikan pronomina Ibrani agar acuan tidak kabur dalam bahasa Indonesia. Struktur kalimat tetap dekat dengan urutan sumber, sementara idiom “melalui tangan Musa” dialihkan secara alami dan bentuk harfiahnya dipertahankan dalam catatan kaki.
