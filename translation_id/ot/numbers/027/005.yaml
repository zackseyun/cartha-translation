  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: id
  text: Lalu Musa membawa perkara mereka ke hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengajukan tuntutan hukum mereka di hadapan Yahweh.”
    reason: Alternatif ini menampilkan nuansa hukum מִשְׁפָּט dan nuansa formal וַיַּקְרֵב dengan lebih eksplisit.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: membawa
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau mengajukan. Dalam konteks hukum ini, “membawa” secara alami menyatakan bahwa Musa menyerahkan perkara itu untuk diputuskan.
- source_word: מִשְׁפָּטָן
  choice: perkara mereka
  rationale: מִשְׁפָּט dapat berarti keputusan hukum, keadilan, tuntutan, atau perkara. Dengan sufiks orang ketiga feminin jamak, kata ini menunjuk pada persoalan hukum anak-anak perempuan Zelafehad.
- source_word: לִפְנֵי
  choice: ke hadapan
  rationale: Ungkapan ini berarti “di hadapan” atau “dalam hadirat.” Dalam konteks pengajuan perkara, “ke hadapan” jelas dan idiomatis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: וַ
  choice: Lalu
  rationale: Waw menggerakkan alur narasi. “Lalu” menghubungkan tindakan Musa secara wajar dengan permohonan yang baru disampaikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan merupakan transliterasi yang umum berdasarkan bukti kebahasaan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Perkara” mempertahankan konteks hukum tanpa terdengar terlalu teknis; “ke hadapan” sesuai dengan tindakan membawa perkara kepada pihak yang akan memutuskan.
