base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: id
  text: “Anak-anak perempuan Zelafehad berkata benar.[a] Engkau harus memberikan kepada mereka[b] hak milik atas tanah sebagai warisan di antara saudara-saudara laki-laki ayah mereka, dan engkau harus mengalihkan warisan ayah mereka kepada mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Anak-anak perempuan Zelafehad berbicara benar.” Ungkapan ini menegaskan bahwa tuntutan mereka benar.'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani pada kata ini memakai sufiks jamak maskulin, tetapi konteksnya jelas menunjuk kepada anak-anak perempuan Zelafehad.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: Perkataan ... itu benar
  rationale: Ungkapan ini secara harfiah menyatakan bahwa mereka ‘berkata benar’. Dalam konteks keputusan hukum, terjemahan ini tetap dekat dengan bentuk Ibrani sekaligus menyampaikan bahwa tuntutan mereka dinyatakan sah.
- source_word: נָתֹן תִּתֵּן
  choice: harus memberikan
  rationale: Infinitif absolut yang diikuti verba finit menegaskan kuatnya perintah. ‘Harus memberikan’ menyampaikan ketegasan tersebut secara wajar dalam bahasa Indonesia modern.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Walaupun sufiks dalam bentuk tertulis adalah maskulin jamak, konteksnya jelas menunjuk kepada anak-anak perempuan Zelafehad. Bahasa Indonesia tidak membedakan gender pada pronomina jamak.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: tanah milik sebagai warisan
  rationale: Frasa ini menggabungkan gagasan kepemilikan tetap dan warisan, khususnya dalam konteks pembagian tanah. Pilihan ini jelas bagi pembaca umum dan mempertahankan kedua unsurnya.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: di antara saudara-saudara ayah mereka
  rationale: Terjemahan ini mempertahankan hubungan kekerabatan paternal tanpa menafsirkan lebih jauh sebagai ‘paman-paman’, meskipun itulah hubungan mereka dengan para anak perempuan.
- source_word: וְהַעֲבַרְתָּ
  choice: engkau harus mengalihkan
  rationale: Bentuk Hifil dari עבר di sini bermakna hukum-administratif, yaitu membuat hak waris berpindah kepada pihak lain. ‘Mengalihkan’ alami dan tepat untuk konteks tersebut.
- source_word: נַחֲלַת אֲבִיהֶן
  choice: warisan ayah mereka
  rationale: Ungkapan ini menunjuk pada bagian warisan milik ayah mereka yang telah meninggal dan mempertahankan hubungan hukum-keluarganya secara langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘engkau’ dipertahankan karena TUHAN berbicara langsung kepada Musa. Istilah hukum pertanahan dibuat jelas tanpa menghilangkan corak formal teks.
