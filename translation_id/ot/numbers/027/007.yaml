    rationale: Frasa Indonesia tersebut dapat dipahami, tetapi “hak milik atas tanah sebagai warisan” menyampaikan dengan lebih jelas gabungan אֲחֻזָּה (kepemilikan/pegangan tanah) dan נַחֲלָה (warisan).
  - severity: low
