  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Naiklah ke gunung Abarim ini[a] dan lihatlah negeri yang telah Kuberikan kepada putra-putra Israel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gunung di kawasan Abarim” atau “Gunung Abarim.” Secara harfiah: “gunung Abarim.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang Israel” atau “umat Israel.” Secara harfiah: “putra-putra Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Waw konsekutif melanjutkan alur cerita; 'berfirman' merupakan ungkapan Indonesia yang wajar dan bermartabat untuk tuturan Allah.
- source_word: עֲלֵה
  choice: Naiklah
  rationale: Menyampaikan imperatif dan gerak ke tempat yang lebih tinggi secara ringkas dan alami.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: gunung Abarim ini
  rationale: Mencerminkan frasa konstruksi Ibrani secara alami dalam bahasa Indonesia sambil mempertahankan Abarim sebagai nama tempat; bentuk harfiahnya tetap dicatat.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Mempertahankan imperatif kedua serta hubungan koordinatifnya.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks pemberian wilayah kepada Israel, 'negeri' alami dalam bahasa Indonesia dan menunjuk pada wilayah yang dijanjikan.
- source_word: נָתַתִּי
  choice: telah Kuberikan
  rationale: Bentuk perfektif menyatakan pemberian yang dipandang sudah ditetapkan dengan relevansi kini.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada keturunan Israel
  rationale: Ungkapan ini berfungsi sebagai sebutan kolektif etnis. 'Keturunan Israel' alami, mencakup seluruh umat yang dimaksud, dan tetap dekat dengan metafora garis keturunan; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Nama diri dipertahankan agar tidak diganti dengan gelar dan tanpa memasukkan preferensi denominasi tertentu.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; bani Israel; orang Israel
  rationale: Dalam konteks ini frasa tersebut adalah sebutan kolektif bagi umat Israel, bukan pembatasan eksplisit hanya kepada laki-laki. Terjemahan utama menyampaikan fungsi kolektifnya, sedangkan bentuk harfiahnya disediakan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat namun mudah dipahami. Partikel imperatif -lah digunakan untuk mempertahankan nuansa perintah tanpa terdengar kasar; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia.
