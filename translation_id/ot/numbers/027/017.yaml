  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁר יֵצֵ֣א לִ/פְנֵי/הֶ֗ם וַ/אֲשֶׁ֤ר יָבֹא֙ לִ/פְנֵי/הֶ֔ם וַ/אֲשֶׁ֥ר יוֹצִיאֵ֖/ם וַ/אֲשֶׁ֣ר יְבִיאֵ֑/ם וְ/לֹ֤א תִהְיֶה֙ עֲדַ֣ת יְהוָ֔ה כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: id
  text: yang akan keluar di depan mereka dan masuk di depan mereka,[a] yang akan memimpin mereka keluar dan membawa mereka masuk,[b] supaya umat Yahweh tidak menjadi seperti kawanan domba yang tidak mempunyai gembala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendahului mereka” pada kedua kemunculan frasa ini.
    reason: lexical_alternative
  - marker: b
    text: Rangkaian “keluar … masuk … memimpin mereka keluar … membawa mereka masuk” merupakan ungkapan Ibrani yang menggambarkan kepemimpinan publik secara menyeluruh.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang akan
  rationale: Klausa relatif ini menerangkan pemimpin yang dimohonkan Musa dalam ayat sebelumnya; bentuk prospektif verba-verba berikutnya wajar dinyatakan dengan 'akan' dalam bahasa Indonesia.
- source_word: יֵצֵא ... יָבֹא
  choice: keluar ... masuk
  rationale: Mempertahankan pasangan gerak konkret Ibrani dan tidak mereduksinya menjadi istilah abstrak seperti 'memerintah'.
- source_word: לִפְנֵיהֶם
  choice: di depan mereka
  rationale: Menyampaikan arti spasial 'di hadapan/di depan mereka' sekaligus menyiratkan bahwa pemimpin berjalan mendahului umat.
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: memimpin mereka keluar ... membawa mereka masuk
  rationale: Kedua bentuk Hifil bersifat kausatif. 'Memimpin' cocok dengan konteks kepemimpinan, sedangkan 'membawa' mempertahankan nuansa kausatif dan menghasilkan ungkapan Indonesia yang alami.
- source_word: עֲדַת יְהוָה
  choice: umat Yahweh
  rationale: עֵדָה menunjuk komunitas Israel secara kolektif. 'Umat' alami dan bermartabat dalam bahasa Indonesia serta sesuai dengan konteks komunitas perjanjian; nama ilahi dipertahankan sebagai 'Yahweh'.
- source_word: כַּצֹּאן
  choice: seperti kawanan domba
  rationale: Nomina kolektif צֹאן dinyatakan secara alami sebagai 'kawanan domba', yang juga memperjelas hubungan dengan gambaran gembala.
- source_word: רֹעֶה
  choice: gembala
  rationale: Padanan langsung dan lazim bagi orang yang menggembalakan kawanan, tanpa memasukkan istilah jabatan gerejawi yang lebih kemudian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi itu dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Gambaran kepemimpinan dalam rangkaian keluar–masuk
  choice: Mempertahankan bahasa gerak konkret dan gambaran gembala
  alternative: Merangkum sebagai 'memimpin mereka dalam segala urusan' atau 'memerintah mereka'
  rationale: Rangkaian verba Ibrani menggambarkan kepemimpinan publik secara menyeluruh dan berujung pada perumpamaan kawanan tanpa gembala. Terjemahan konkret menjaga daya sastra dan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur paralel Ibrani dipertahankan sejauh tetap alami. 'Umat' dipilih bagi עֵדָה agar tidak memberi kesan bahwa yang dimaksud hanya pertemuan sesaat; alternatif yang lebih formal ialah 'jemaah' atau 'perkumpulan'.
