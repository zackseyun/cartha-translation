base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Ambillah Yosua bin Nun, seorang laki-laki yang memiliki roh[a], lalu letakkanlah tanganmu di atasnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “roh” tidak memakai kata sandang. Dalam konteks ini, kata itu dapat dipahami sebagai Roh Allah, tetapi juga dapat diterjemahkan secara lebih umum sebagai “roh.”
    reason: Menjaga ambiguitas asli mengenai apakah רוּחַ secara khusus menunjuk kepada Roh Allah.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti ‘Tuhan’.
- source_word: קַח לְךָ
  choice: Ambillah
  rationale: Ungkapan Ibrani ini secara idiomatis merupakan perintah untuk mengambil atau memilih seseorang; unsur לְךָ tidak perlu diterjemahkan secara kaku sebagai ‘bagimu’.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua bin Nun
  rationale: ‘Yosua’ merupakan bentuk nama yang lazim dalam bahasa Indonesia, sedangkan ‘bin Nun’ menyampaikan hubungan anak laki-laki dengan ringkas dan wajar.
- source_word: אִישׁ אֲשֶׁר רוּחַ בּוֹ
  choice: seorang yang di dalam dirinya ada roh
  rationale: Mempertahankan susunan dan ketidakpastian frasa Ibrani sedekat mungkin. Kata רוּחַ tidak memakai kata sandang, sehingga teks utama tidak secara eksplisit menetapkannya sebagai ‘Roh’ ilahi.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: lalu letakkanlah tanganmu di atasnya
  rationale: Menyampaikan tindakan penetapan dengan jelas sambil mempertahankan bentuk tunggal ‘tangan’ dalam bahasa Ibrani.
theological_decisions:
- issue: Apakah רוּחַ menunjuk kepada Roh Allah atau kepada roh/kemampuan batin Yosua
  choice: roh
  alternative: Roh
  rationale: Bahasa Ibrani tidak memakai kata sandang dan tidak menyebut Allah secara eksplisit. Huruf kecil dalam teks utama menjaga bentuk leksikal itu, sedangkan kemungkinan bahwa yang dimaksud adalah Roh Allah dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Berfirman’ dipakai secara wajar untuk perkataan Allah. Frasa ‘di dalam dirinya ada roh’ sengaja sedikit formal agar bentuk dan ambiguitas teks Ibrani tetap tampak; penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
