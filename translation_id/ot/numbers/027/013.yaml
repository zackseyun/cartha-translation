  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: id
  text: Dan setelah engkau melihatnya, engkau pun akan dikumpulkan kepada kaummu,[a] sama seperti Harun, saudaramu, telah dikumpulkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih interpretatif, ungkapan ini dapat diterjemahkan “engkau akan mati” atau “engkau akan dikumpulkan kepada nenek moyangmu.” Ungkapan Ibraninya secara harfiah berbunyi “dikumpulkan kepada kaummu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה
  choice: Dan setelah engkau melihat
  rationale: Bentuk Qal orang kedua tunggal maskulin dari ראה mengikuti perintah untuk memandang negeri itu. Dalam konteks ini, 'setelah engkau melihat' menyampaikan urutan peristiwa secara alami tanpa mengubah maknanya.
- source_word: אֹתָהּ
  choice: -nya
  rationale: Pronomina objek feminin tunggal ini mengacu pada negeri yang akan dilihat Musa. Bahasa Indonesia secara alami memakai akhiran netral '-nya'.
- source_word: וְנֶאֱסַפְתָּ
  choice: engkau pun akan dikumpulkan
  rationale: Bentuk Nifal dari אסף dipertahankan sebagai metafora pasif tentang kematian, bukan diratakan menjadi sekadar 'mati'. Kata 'pun' mewakili penekanan גַּם אַתָּה dan menandai bahwa Musa akan mengalami hal yang sama seperti Harun.
- source_word: אֶל עַמֶּיךָ
  choice: kepada kaummu
  rationale: '''Kaummu'' merupakan padanan langsung yang tetap membawa nuansa ikatan keluarga dan komunitas dalam ungkapan Ibrani tersebut. Pilihan ini tidak mempersempit acuannya hanya menjadi ''nenek moyangmu''.'
- source_word: כַּאֲשֶׁר
  choice: sama seperti
  rationale: Frasa ini menandai perbandingan yang jelas antara nasib Musa dan Harun.
- source_word: נֶאֱסַף
  choice: telah dikumpulkan
  rationale: Padanan yang sama dipakai untuk ungkapan kematian Harun agar pengulangan dan kesejajaran dalam bahasa Ibrani tetap tampak.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Harun, saudaramu
  rationale: Nama tersebut memakai bentuk baku bahasa Indonesia, dan hubungan kekerabatan dipertahankan. Tanda koma menghasilkan susunan aposisi yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan kematian אסף אל־עמיו
  choice: dikumpulkan kepada kaummu
  alternative: mati; dikumpulkan kepada nenek moyangmu; bergabung dengan sanak saudaramu dalam kematian
  rationale: Teks Ibrani memakai ungkapan yang lebih kaya daripada pernyataan langsung tentang kematian. Mempertahankan metafora ini menjaga nuansa kekeluargaan dan komunalnya tanpa menetapkan ajaran terperinci mengenai keadaan sesudah kematian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' sesuai dengan sapaan tunggal langsung dalam konteks ilahi, sedangkan struktur kalimat dibuat alami tanpa menghilangkan pengulangan metaforis teks Ibrani.
