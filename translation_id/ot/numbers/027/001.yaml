base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: id
  text: 'Lalu anak-anak perempuan Zelafehad—anak Hefer, anak Gilead, anak Makhir, anak Manasye, dari kaum-kaum Manasye, anak Yusuf—datang mendekat.[a] Inilah nama anak-anak perempuannya: Mahla, Noa,[b] Hogla, Milka, dan Tirza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “maju” atau “datang menghadap”. Ungkapan ini dapat menyiratkan bahwa mereka maju untuk mengajukan permohonan resmi, seperti yang diceritakan dalam ayat-ayat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Noa di sini adalah nama salah seorang anak perempuan Zelafehad, bukan Nuh, tokoh laki-laki dalam Kitab Kejadian.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: datang menghadap
  rationale: Bentuk verba ini menyatakan bahwa para perempuan itu maju mendekat. Dalam konteks permohonan resmi pada ayat-ayat berikutnya, “datang menghadap” alami dalam bahasa Indonesia dan tetap menyisakan objek yang tidak disebutkan dalam ayat ini.
- source_word: בְּנוֹת
  choice: anak-anak perempuan
  rationale: Konstruksi ini menunjuk kepada putri-putri kandung Zelafehad, sebagaimana ditegaskan oleh daftar nama mereka.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: anak ... anak ... anak ... anak
  rationale: Rangkaian silsilah dipertahankan dan tidak dipadatkan menjadi “keturunan”, sebab garis keluarga tersebut mendasari persoalan warisan dalam perikop ini.
- source_word: לְמִשְׁפְּחֹת
  choice: dari kaum-kaum
  rationale: Dalam konteks kesukuan Israel, מִשְׁפָּחָה menunjuk kepada kelompok kekerabatan di dalam suku. Kata depan ל menyatakan afiliasi; “dari kaum-kaum” mempertahankan bentuk jamak sumber.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: Manasye anak Yusuf
  rationale: Hubungan silsilah dengan Yusuf dipertahankan secara eksplisit.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Nama anak-anak perempuannya ialah
  rationale: Ungkapan pengantar daftar nama dialihkan secara alami dan bermartabat dalam bahasa Indonesia; akhiran pronominal merujuk kepada Zelafehad.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka, dan Tirza
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab berbahasa Indonesia.
