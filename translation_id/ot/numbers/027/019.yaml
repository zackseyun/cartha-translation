base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: id
  text: Hadapkanlah dia di hadapan Imam Eleazar dan di hadapan seluruh umat, lalu berilah dia amanat[a] di hadapan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perintahkanlah dia” atau “berilah dia tugas.” Kata kerja Ibrani ini dapat berarti memerintah; di sini tampaknya menunjuk pada pemberian tanggung jawab kepada Yosua di depan umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Hadapkanlah
  rationale: Bentuk kausatif dari עמד berarti membuat seseorang berdiri atau menempatkannya di hadapan pihak lain. Dalam konteks upacara ini, “hadapkanlah” alami dan tidak menambahkan gagasan penahbisan yang tidak dinyatakan oleh kata tersebut.
- source_word: לִפְנֵי
  choice: kepada ... dan kepada
  rationale: Ungkapan ini menunjukkan bahwa Yosua ditempatkan di hadapan Eleazar dan umat. Dalam konstruksi Indonesia dengan “hadapkanlah,” preposisi “kepada” menyampaikan hubungan tersebut secara alami.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Gelar definit diikuti nama pribadi paling alami diungkapkan sebagai “Imam Eleazar” dalam bahasa Indonesia.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu himpunan. “Seluruh umat” mudah dipahami dan mempertahankan makna kolektifnya.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: lalu berilah dia amanat
  rationale: צוה biasanya berarti memerintah, tetapi dalam konteks penetapan Yosua di depan umum, frasa ini menyatakan pemberian tugas atau tanggung jawab yang berwibawa. “Berilah dia amanat” mempertahankan otoritas sekaligus cocok dengan konteks seremonial.
- source_word: לְעֵינֵיהֶם
  choice: di hadapan mereka
  rationale: Secara harfiah berarti “di depan mata mereka,” yaitu secara terbuka dan disaksikan oleh mereka. “Di hadapan mereka” merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Penyerahan wewenang kepada Yosua di depan umum
  choice: berilah dia amanat
  alternative: perintahkanlah dia; berilah dia tugas
  rationale: Konteksnya adalah tindakan resmi di hadapan imam dan umat. “Berilah dia amanat” menyampaikan penyerahan tanggung jawab yang berwibawa tanpa menyamakan kata ini dengan seluruh tindakan pelantikan atau memasukkan rincian teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif dipakai untuk mencerminkan rangkaian perintah ilahi kepada Musa. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkannya.
