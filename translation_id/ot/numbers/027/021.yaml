revisions:
- from: Ia harus berdiri di hadapan Imam Eleazar. Eleazar akan meminta keputusan baginya melalui keputusan Urim[a] di hadapan Yahweh. Atas titahnya mereka harus keluar, dan atas titahnya mereka harus masuk—ia dan seluruh bani Israel yang menyertainya[b], yakni seluruh umat itu.
  to: Ia harus berdiri di hadapan Imam Eleazar. Eleazar akan meminta petunjuk bagi dia menurut keputusan Urim[a] di hadapan Yahweh. Atas perintahnya mereka harus keluar, dan atas perintahnya mereka harus masuk—ia dan seluruh bani Israel yang menyertainya[b], yakni seluruh umat itu.
  rationale: Revisi membedakan tindakan Eleazar, yaitu meminta petunjuk, dari ‘keputusan Urim’ sebagai istilah yang menerjemahkan מִשְׁפַּט הָאוּרִים. Kata “menurut” mengungkapkan hubungan dengan keputusan/prosedur Urim tanpa menguraikan mekanismenya. “Atas perintahnya” mempertahankan ambiguitas pronomina עַל־פִּיו sambil memakai idiom modern yang alami. Struktur, nama, istilah teknis, dan jangkar catatan kaki dipertahankan.
