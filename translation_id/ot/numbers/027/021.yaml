  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: id
  text: Ia harus berdiri di hadapan Imam Eleazar. Eleazar akan meminta petunjuk bagi dia menurut keputusan Urim[a] di hadapan Yahweh. Atas perintahnya mereka harus keluar, dan atas perintahnya mereka harus masuk—ia dan seluruh bani Israel yang menyertainya[b], yakni seluruh umat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut penetapan Urim.” Ungkapan ini merujuk pada permintaan petunjuk keimaman di hadapan Yahweh dengan memakai Urim.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “anak-anak lelaki Israel”; maksudnya, orang-orang Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: 'Ungkapan ini mempertahankan makna ruang dan hubungan resmi: Yosua berdiri di hadapan Eleazar, dan permintaan keputusan dilakukan di hadapan Yahweh.'
- source_word: יַעֲמֹד
  choice: harus berdiri
  rationale: Bentuk imperfek dalam konteks penetapan ini berdaya perintah atau ketentuan, sehingga 'harus berdiri' alami dan tegas dalam bahasa Indonesia.
- source_word: וְשָׁאַל לוֹ
  choice: Eleazar akan meminta keputusan baginya
  rationale: Konteks menunjukkan bahwa subjeknya beralih kepada Eleazar, yang meminta keputusan demi Yosua. Nama 'Eleazar' diulang agar pergantian subjek jelas dalam bahasa Indonesia.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: melalui keputusan Urim
  rationale: מִשְׁפָּט di sini menunjuk pada keputusan atau prosedur penetapan, sedangkan Urim dipertahankan sebagai istilah teknis keimaman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עַל פִּיו
  choice: atas titahnya
  rationale: Idiom harfiahnya 'menurut mulutnya' menyatakan arahan yang berwenang. Bentuk '-nya' mempertahankan ketidakjelasan terbatas mengenai rujukan langsung pronomina itu.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: mereka harus keluar ... mereka harus masuk
  rationale: Pasangan kata Ibrani dipertahankan karena dapat menunjuk pada gerak atau kegiatan umat di bawah kepemimpinan, termasuk tetapi tidak terbatas pada konteks militer.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: '''Bani Israel'' merupakan ungkapan Indonesia yang ringkas dan bermartabat bagi keturunan atau umat Israel, sambil tetap dekat dengan bentuk sumber.'
- source_word: הָעֵדָה
  choice: umat itu
  rationale: Dalam konteks Pentateukh, istilah ini menunjuk kepada komunitas Israel sebagai keseluruhan. 'Umat itu' lebih alami bagi pembaca modern daripada 'jemaah' yang dapat terdengar hanya sebagai perkumpulan ibadah.
theological_decisions:
- issue: Rujukan pronomina dalam עַל פִּיו ('atas titahnya')
  choice: Pronomina tunggal dipertahankan tanpa menyebut secara eksplisit siapa rujukannya.
  alternative: Menafsirkannya secara khusus sebagai titah Eleazar, titah Yosua, atau titah ilahi yang disampaikan melalui keputusan Urim.
  rationale: Susunan Ibrani padat dan memungkinkan beberapa cara memahami rujukan langsungnya. Terjemahan tidak menyisipkan penjelasan yang akan menutup ketegangan itu.
- issue: Fungsi Urim dalam permintaan keputusan
  choice: Eleazar meminta keputusan bagi Yosua melalui keputusan Urim di hadapan Yahweh.
  alternative: Menerjemahkan מִשְׁפַּט sebagai 'penghakiman', 'ketetapan', atau 'tata cara' Urim.
  rationale: Konteksnya adalah pencarian arahan ilahi melalui sarana keimaman, bukan penghakiman moral terhadap Yosua. 'Keputusan' menyampaikan hasil berwenang tanpa menjelaskan mekanismenya melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah untuk memperjelas pergantian subjek dari Yosua kepada Eleazar. Istilah teknis 'Urim' dan nama 'Yahweh' dipertahankan; ungkapan 'atas titahnya' sengaja menjaga ambiguitas pronomina sumber.
