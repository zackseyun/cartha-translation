  - severity: low
    issue: “Atas titahnya” cenderung arkais.
    rationale: Istilah ini tidak salah, tetapi “atas perintahnya” lebih lazim dalam bahasa Indonesia modern baku dan tetap mempertahankan pronomina tunggal yang ambigu dalam teks Ibrani.
