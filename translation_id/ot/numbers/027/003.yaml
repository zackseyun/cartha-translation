revisions:
- from: Ayah kami mati di padang belantara. Ia tidak termasuk dalam kumpulan orang yang berhimpun menentang Yahweh bersama kelompok Korah. Sebaliknya, ia mati karena dosanya sendiri,[a] dan ia tidak mempunyai anak laki-laki.
  to: Ayah kami mati di padang belantara, dan ia tidak termasuk di antara kumpulan orang yang berhimpun menentang Yahweh dalam kelompok Korah. Sebaliknya, ia mati karena dosanya sendiri,[a] dan ia tidak mempunyai anak laki-laki.
  rationale: Preposisi “bersama” diganti menjadi “dalam” untuk mencerminkan bahwa ayah mereka bukan anggota kelompok Korah. Koordinasi awal “dan” juga dipulihkan untuk mengikuti alur Ibrani tanpa mengurangi kelancaran bahasa Indonesia. Catatan kaki dipertahankan karena secara tepat mencatat alternatif yang sah bagi בְחֶטְאוֹ.
