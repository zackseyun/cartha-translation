  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: id
  text: Ayah kami mati di padang belantara, dan ia tidak termasuk di antara kumpulan orang yang berhimpun menentang Yahweh dalam kelompok Korah. Sebaliknya, ia mati karena dosanya sendiri,[a] dan ia tidak mempunyai anak laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ia mati dalam dosanya sendiri.” Teks Ibrani tidak menyebutkan dosa tertentu; yang ditegaskan ialah bahwa ia tidak mati sebagai bagian dari pemberontakan Korah.
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: Ayah kami
  rationale: Sapaan langsung para anak perempuan kepada ayah kandung mereka; 'ayah' adalah makna yang wajar dan dituntut konteks.
- source_word: מֵת בַּמִּדְבָּר
  choice: mati di padang belantara
  rationale: Qal perfektum diterjemahkan sebagai peristiwa lampau; 'padang belantara' mempertahankan latar pengembaraan Israel tanpa menyiratkan hanya gurun pasir.
- source_word: בְּתוֹךְ הָעֵדָה
  choice: termasuk dalam kumpulan
  rationale: בְּתוֹךְ bermakna 'di tengah/di antara', sedangkan עֵדָה menunjuk kelompok atau perhimpunan; ungkapan ini alami dalam bahasa Indonesia.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: orang yang berhimpun menentang Yahweh
  rationale: Partisipel Niphal dari יעד menyatakan tindakan berkumpul atau berhimpun, dan עַל dalam konteks ini menunjukkan sikap bermusuhan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בַּעֲדַת קֹרַח
  choice: bersama kelompok Korah
  rationale: Frasa ini mengidentifikasi kelompok pemberontak yang terkait dengan Korah; 'kelompok' menghindari pengulangan yang kaku.
- source_word: כִּי
  choice: Sebaliknya
  rationale: Di sini כִּי memperkenalkan penjelasan korektif yang mengontraskan kematiannya dengan keterlibatan dalam pemberontakan Korah.
- source_word: בְחֶטְאוֹ
  choice: karena dosanya sendiri
  rationale: בְ dapat dipahami secara kausal dalam konteks ini; 'sendiri' menegaskan sufiks orang ketiga dan kontras dengan kesalahan kelompok Korah tanpa menentukan dosa tertentu.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: dan ia tidak mempunyai anak laki-laki
  rationale: Terjemahan idiomatis konstruksi eksistensial היה + לְ; 'anak laki-laki' dipertahankan karena konteks menyangkut ahli waris laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; transliterasi mempertahankan fungsi tersebut.
- issue: Hubungan dosa pribadi dengan kematian ayah mereka
  choice: ia mati karena dosanya sendiri
  alternative: ia mati dalam dosanya sendiri
  rationale: Terjemahan utama menyampaikan kemungkinan kausal dari בְ dan mempertahankan kontras dengan pemberontakan Korah, tetapi tidak menentukan dosa apa yang dimaksud. Kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar alur permohonan lisan tetap jelas. 'Ia' dipakai untuk register Alkitab yang netral; 'anak laki-laki' dipertahankan karena penting bagi perkara warisan dalam konteks.
