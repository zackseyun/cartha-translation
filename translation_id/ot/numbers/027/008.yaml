base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: id
  text: Dan katakanlah kepada orang Israel[a], “Jika seorang laki-laki mati dan tidak mempunyai anak laki-laki, hendaklah kamu mengalihkan harta pusakanya kepada anak perempuannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diterjemahkan “anak-anak Israel” atau “orang Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: Katakanlah kepada orang Israel
  rationale: Ungkapan בְּנֵי יִשְׂרָאֵל secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi dalam konteks sapaan kepada umat secara keseluruhan, ‘orang Israel’ merupakan padanan bahasa Indonesia yang alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: Katakanlah
  rationale: Gabungan דבר + לאמר adalah rumus pengantar perkataan. ‘Katakanlah’ menyampaikan fungsinya secara alami tanpa mempertahankan pengulangan kaku ‘berbicaralah dengan berkata’.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: אִישׁ berbentuk maskulin tunggal dan dalam hukum warisan ini secara khusus merujuk kepada laki-laki; terjemahan mempertahankan penandaan gender sumber.
- source_word: כִּי יָמוּת
  choice: Jika ... mati
  rationale: כִּי dengan bentuk imperfek dalam rumusan hukum kasuistis memperkenalkan suatu kondisi; ‘jika’ paling tepat mempertahankan struktur hukum tersebut.
- source_word: וּבֵן אֵין לוֹ
  choice: dan tidak mempunyai anak laki-laki
  rationale: Ungkapan harfiahnya ‘dan tidak ada anak laki-laki baginya’. Bentuk Indonesia ini alami dan mempertahankan fokus pada tidak adanya ahli waris laki-laki.
- source_word: וְהַעֲבַרְתֶּם
  choice: kamu harus mengalihkan
  rationale: Bentuk Hifil dari עבר di sini menyatakan tindakan hukum menyebabkan hak waris berpindah. ‘Mengalihkan’ sesuai dengan nuansa administratif tersebut, sedangkan ‘harus’ menyampaikan daya wajib dari bentuk hukum Ibrani.
- source_word: נַחֲלָתוֹ
  choice: milik pusakanya
  rationale: נַחֲלָה dalam konteks ini menunjuk pada harta atau tanah turun-temurun beserta hak warisnya. ‘Milik pusaka’ mempertahankan nuansa kepemilikan warisan, bukan sekadar tindakan mewarisi.
- source_word: לְבִתּוֹ
  choice: kepada anak perempuannya
  rationale: Preposisi לְ menandai penerima pengalihan; bentuk ini adalah padanan langsung dan alami.
