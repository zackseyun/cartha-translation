  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: id
  text: karena kamu berdua memberontak terhadap perintah-Ku di padang gurun Zin, ketika umat itu berbantah, dengan tidak menyatakan Aku kudus di depan mata mereka pada air itu.[a] Itulah air Meriba-Kadesh di padang gurun Zin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk menguduskan Aku” atau “untuk menyatakan Aku kudus di depan mata mereka.” Bentuk Ibraninya positif, tetapi konteks menunjukkan bahwa Musa dan Harun gagal melakukannya.
    reason: lexical_alternative
  - marker: b
    text: Meriba-Kadesh dapat juga diterjemahkan “Meriba di Kadesh” atau, secara lebih harfiah, “perselisihan di Kadesh.”
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: karena
  rationale: Dalam konteks ini partikel tersebut menyatakan alasan Musa dan Harun tidak diizinkan memasuki negeri itu.
- source_word: מְרִיתֶם
  choice: kamu berdua memberontak
  rationale: Bentuk verba orang kedua jamak merujuk kepada Musa dan Harun; 'memberontak' mempertahankan daya makna מרה.
- source_word: פִּי
  choice: perintah-Ku
  rationale: Secara harfiah berarti 'mulut-Ku', tetapi secara idiomatis menunjuk pada perintah yang Allah ucapkan.
- source_word: בְּמִדְבַּר צִן
  choice: di padang gurun Zin
  rationale: '''Padang gurun'' merupakan padanan geografis yang wajar bagi מִדְבָּר, sedangkan Zin dipertahankan sebagai nama tempat.'
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: ketika umat itu berbantah
  rationale: Ungkapan ini menunjuk pada perselisihan umat dalam peristiwa tersebut; 'umat' alami dalam bahasa Indonesia dan sesuai dengan עֵדָה.
- source_word: לְהַקְדִּישֵׁנִי
  choice: dan tidak menyatakan kekudusan-Ku
  rationale: Infinitif Ibrani berbentuk positif, 'untuk menguduskan Aku', tetapi kegagalan melakukannya tersirat oleh konteks. Rumusan ini menyampaikan fungsi kausatifnya tanpa menyiratkan bahwa manusia membuat Allah menjadi kudus.
- source_word: בַמַּיִם
  choice: melalui air itu
  rationale: Preposisi dapat menyatakan keadaan atau sarana dalam peristiwa di air tersebut. 'Melalui air itu' mengaitkan kegagalan mereka menyatakan kekudusan Allah dengan tindakan di sana.
- source_word: לְעֵינֵיהֶם
  choice: di depan mata mereka
  rationale: Mempertahankan gambaran idiom Ibrani dan menekankan bahwa peristiwa itu disaksikan secara terbuka.
- source_word: הֵם
  choice: Itulah
  rationale: Kata tunjuk ini memperkenalkan identifikasi tempat atau sumber air yang baru disebut.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: mata air Meriba-Kadesh
  rationale: מֵי secara harfiah berarti 'air-air dari', tetapi dalam penyebutan geografis ini 'mata air' terdengar alami. Meriba-Kadesh mempertahankan nama tempat sekaligus kaitannya dengan מריבה, 'perselisihan'.
theological_decisions:
- issue: Makna kegagalan dalam לְהַקְדִּישֵׁנִי
  choice: dan tidak menyatakan kekudusan-Ku
  alternative: untuk menguduskan Aku / untuk menyatakan Aku kudus
  rationale: Teks Ibrani memakai infinitif positif, tetapi konteks sintaksis dan kisahnya menunjukkan bahwa Musa dan Harun gagal melakukannya. Negasi dibuat eksplisit dalam teks agar hubungan maknanya jelas, sementara bentuk sumber dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan kapital sesuai kelaziman penerbitan Alkitab Indonesia. 'Kamu berdua' memperjelas bahwa bentuk jamak Ibrani menyapa Musa dan Harun. Semua penanda catatan kaki muncul dalam teks utama.
