  naturalness: Bahasa draf pada umumnya baku dan jelas. Susunan yang direvisi lebih langsung mengaitkan kegagalan menyatakan Allah kudus dengan peristiwa di air itu dan tetap terdengar alami dalam bahasa Indonesia modern.
