lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berbicara
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan secara alami, sedangkan “berbicara” mencerminkan דִּבֵּר dan tetap berbeda dari formula לֵאמֹר yang mengikutinya.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah pembicaraan Musa kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Formula infinitif Ibrani ini memperkenalkan perkataan langsung. “Katanya” merupakan ungkapan naratif Indonesia yang alami tanpa menambah isi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memuat Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu, sementara catatan kaki menjelaskan bentuk Ibraninya dan tradisi penerjemahannya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan “Lalu ... berbicara ..., katanya” mempertahankan urutan serta formula pengantar ujaran Ibrani tanpa terdengar terlalu kaku.
