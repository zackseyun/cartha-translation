  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: id
  text: Musa melakukan seperti yang diperintahkan Yahweh kepadanya. Ia membawa Yosua dan menempatkannya di hadapan Imam Eleazar dan di hadapan seluruh umat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuatnya berdiri di hadapan”; kata kerja Ibrani ini juga dapat diterjemahkan “menghadirkannya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר
  choice: melakukan seperti
  rationale: Ungkapan ini menyatakan bahwa Musa menaati perintah sebelumnya secara langsung; bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan susunan Ibrani.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk pasif dengan Yahweh sebagai pelaku dan Musa sebagai penerima perintah menghasilkan ungkapan Indonesia yang alami tanpa mengubah hubungan sintaksis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: Ia membawa Yosua
  rationale: Dalam konteks penahbisan publik ini, לקח berarti Musa mengambil Yosua untuk membawanya ke hadapan imam dan umat; 'membawa' lebih alami daripada 'mengambil' dalam bahasa Indonesia.
- source_word: וַיַּעֲמִדֵהוּ
  choice: menempatkannya
  rationale: Bentuk kausatif dari עמד dapat berarti membuat seseorang berdiri, menempatkan, atau menghadirkannya. 'Menempatkannya' mempertahankan unsur posisi fisik sekaligus cocok dengan konteks upacara.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Frasa ini menyatakan penempatan seseorang dalam kehadiran publik Eleazar dan umat.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Dalam bahasa Indonesia, gelar jabatan secara alami ditempatkan sebelum nama diri.
- source_word: כָּל־הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה di sini menunjuk kepada komunitas Israel yang berkumpul. 'Seluruh umat' jelas dan alami bagi pembaca Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa tindakan terhadap Yosua dalam upacara penugasan
  choice: menempatkannya di hadapan
  alternative: membuatnya berdiri di hadapan; menghadirkannya di hadapan
  rationale: Pilihan utama mempertahankan tindakan konkret tanpa mempersempitnya hanya menjadi tindakan seremonial; alternatif harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat kedua memakai 'Ia' untuk menghindari pengulangan nama Musa. 'Imam Eleazar' mengikuti urutan gelar-nama yang alami dalam bahasa Indonesia; 'seluruh umat' mengomunikasikan komunitas Israel yang berkumpul.
