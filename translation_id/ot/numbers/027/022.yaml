  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani dengan tepat: Musa menaati perintah Yahweh, membawa Yosua, lalu menempatkannya di hadapan Imam Eleazar dan seluruh umat. “Membawa” merupakan padanan kontekstual yang wajar bagi וַיִּקַּח, dan “menempatkannya di hadapan” secara memadai mencerminkan bentuk kausatif וַיַּעֲמִדֵהוּ tanpa menghilangkan nuansa penempatan/penghadiran publik.'
