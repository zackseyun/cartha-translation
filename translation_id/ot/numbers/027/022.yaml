  terminology: “Yahweh” konsisten dengan kebijakan nama ilahi yang diberikan. “Musa,” “Yosua,” dan “Imam Eleazar” adalah bentuk nama serta gelar yang lazim. Catatan kaki secara tepat memelihara alternatif leksikal bagi וַיַּעֲמִדֵהוּ.
