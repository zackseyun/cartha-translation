  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: id
  text: Leluhur kami pergi[a] ke Mesir, dan kami tinggal di Mesir selama waktu yang lama[b]. Orang Mesir memperlakukan kami dan leluhur kami dengan buruk[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “turun”; ungkapan ini dapat menunjuk perjalanan ke Mesir.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “banyak hari”; ini adalah ungkapan untuk suatu masa yang panjang.
    reason: lexical_alternative
  - marker: c
    text: Atau “berbuat jahat kepada kami dan leluhur kami” atau “mencelakakan kami dan leluhur kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: pergi
  rationale: Secara harfiah berarti ‘turun/pergi turun’. Dalam bahasa Indonesia, ‘pergi ke Mesir’ paling alami; arah geografis ‘turun’ tidak perlu dipaksakan karena dapat terdengar janggal.
- source_word: אֲבֹתֵינוּ
  choice: leluhur kami
  rationale: Bentuk Ibrani secara harfiah berarti ‘bapa-bapa kami’, tetapi dalam kilas balik sejarah ini merujuk kepada para pendahulu bangsa; ‘leluhur kami’ menyampaikan maksudnya secara wajar dan bermartabat.
- source_word: מִצְרַיְמָה
  choice: ke Mesir
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mesir; ‘ke Mesir’ merupakan padanan Indonesia yang alami.
- source_word: וַנֵּשֶׁב
  choice: kami tinggal
  rationale: ישׁב di sini menyatakan menetap atau berdiam; ‘tinggal’ jelas dan alami dalam bahasa Indonesia modern.
- source_word: יָמִים רַבִּים
  choice: berhari-hari lamanya
  rationale: Ungkapan ini secara harfiah berarti ‘banyak hari’ dan secara idiomatis menunjuk masa yang lama. ‘Berhari-hari lamanya’ mempertahankan unsur ‘hari’ tanpa terdengar kaku.
- source_word: וַיָּרֵעוּ
  choice: berbuat jahat terhadap
  rationale: Bentuk kausatif רעע mencakup tindakan berbuat buruk atau mendatangkan celaka. ‘Berbuat jahat terhadap’ mempertahankan bobot moral dan keluasan makna sumber; ‘memperlakukan dengan buruk’ juga mungkin.
- source_word: מִצְרַיִם
  choice: orang Mesir
  rationale: Walaupun bentuk katanya adalah nama negeri ‘Mesir’, verba berbentuk jamak menunjukkan bahwa penduduk Mesirlah pelakunya. Bahasa Indonesia secara alami menyatakannya sebagai ‘orang Mesir’.
- source_word: לָנוּ
  choice: terhadap kami
  rationale: Preposisi ל menandai pihak yang terkena tindakan; ‘terhadap kami’ sesuai dengan konstruksi ‘berbuat jahat’.
- source_word: וְלַאֲבֹתֵינוּ
  choice: dan leluhur kami
  rationale: Pengulangan objek dalam bahasa Ibrani dipertahankan untuk menegaskan bahwa perlakuan itu menimpa generasi sekarang maupun para leluhur mereka.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. ‘Leluhur’ dipilih daripada ungkapan harfiah ‘bapa-bapa’ agar rujukan antargenerasi segera jelas. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
