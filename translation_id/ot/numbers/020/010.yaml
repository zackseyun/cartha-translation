base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: id
  text: Kemudian Musa dan Harun mengumpulkan umat itu di depan batu itu. Musa berkata kepada mereka, “Dengarlah sekarang, hai para pemberontak! Apakah kami akan mengeluarkan air bagi kalian dari batu ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: mengumpulkan
  rationale: Bentuk Hifil dari קהל menyatakan tindakan menyebabkan orang berkumpul. ‘Mengumpulkan’ alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: הַקָּהָל
  choice: umat itu
  rationale: קָהָל menunjuk kepada komunitas yang sedang berhimpun. ‘Umat itu’ wajar dalam konteks Israel dan menghindari pengulangan kaku ‘mengumpulkan kumpulan’, tanpa memasukkan nuansa gerejawi.
- source_word: אֶל פְּנֵי הַסָּלַע
  choice: di depan batu tersebut
  rationale: Ungkapan ini berarti ‘di hadapan/di depan’. ‘Di depan’ merupakan bentuk modern yang alami; ‘tersebut’ mengacu pada batu yang telah disebut dalam konteks.
- source_word: וַיֹּאמֶר
  choice: Musa berkata
  rationale: Kata kerja berbentuk tunggal dan secara alami merujuk kepada Musa setelah subjek majemuk Musa dan Harun. Penyebutan nama menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: שִׁמְעוּ נָא
  choice: Dengarlah sekarang
  rationale: Imperatif שׁמע berarti mendengar atau menyimak, sedangkan נָא di sini memberi tekanan atau urgensi. Pilihan ini mempertahankan seruan yang tegas.
- source_word: הַמֹּרִים
  choice: hai para pemberontak
  rationale: Partisip substantival dari מרה menyebut mereka sebagai orang-orang yang memberontak. Sapaan ‘hai para pemberontak’ langsung, tegas, dan bermartabat.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: dari batu ini
  rationale: Partikel tanya הֲ dan preposisi מִן menandai sumber, yaitu ‘dari batu ini’.
- source_word: נוֹצִיא
  choice: Haruskah kami mengeluarkan
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau mengeluarkan. Dalam pertanyaan retoris ini, ‘haruskah kami mengeluarkan’ alami dan tetap mempertahankan orang pertama jamak.
- source_word: מָיִם
  choice: air
  rationale: Padanan baku bagi מַיִם dalam konteks ini.
theological_decisions:
- issue: Orang pertama jamak dalam pertanyaan Musa
  choice: Haruskah kami mengeluarkan air bagi kalian dari batu ini?
  alternative: Akankah kami mengeluarkan air bagi kalian dari batu ini?
  rationale: נוֹצִיא secara eksplisit berbentuk orang pertama jamak. Terjemahan mempertahankan ‘kami’ dan tidak menjelaskan atau mengurangi ketegangan mengenai peran Musa dan Harun dibandingkan dengan tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai karena sapaan jelas bersifat jamak. Tanda seru sesudah sapaan mencerminkan kerasnya teguran, sementara pertanyaan berikutnya tetap dipertahankan sebagai pertanyaan retoris.
