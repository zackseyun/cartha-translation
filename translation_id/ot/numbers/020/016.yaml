  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: id
  text: Kami berseru kepada Yahweh, dan Dia mendengar suara kami. Dia mengutus seorang malaikat[a] dan membawa kami keluar dari Mesir. Lihat, kami berada di Kadesh, sebuah kota di tepi perbatasanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang utusan.” Kata Ibrani yang dipakai dapat merujuk kepada utusan manusia maupun utusan surgawi; dalam konteks ini banyak orang memahaminya sebagai malaikat yang diutus Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: kami berseru
  rationale: Kata kerja צעק menyatakan seruan mendesak untuk meminta pertolongan. “Berseru” alami dalam bahasa Indonesia dan mempertahankan kuatnya permohonan itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: Dia mendengar suara kami
  rationale: Terjemahan ini mempertahankan ungkapan eksplisit “mendengar suara kami”, yang dalam konteks berarti mendengarkan seruan mereka.
- source_word: מַלְאָךְ
  choice: seorang malaikat
  rationale: מַלְאָךְ dapat menunjuk kepada utusan manusia atau surgawi. Dalam konteks tindakan Allah pada peristiwa keluaran, “malaikat” merupakan padanan yang wajar, sedangkan kemungkinan “utusan” dipertahankan dalam catatan kaki.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: membawa kami keluar dari Mesir
  rationale: Bentuk kausatif יצא berarti “membawa keluar”; pilihan ini jelas, alami, dan sesuai dengan bahasa keluaran.
- source_word: וְהִנֵּה
  choice: Lihatlah, sekarang
  rationale: הִנֵּה menarik perhatian kepada keadaan mereka saat itu. “Lihatlah, sekarang” mempertahankan fungsi tersebut dalam ragam modern yang bermartabat.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: sebuah kota di tepi perbatasanmu
  rationale: Frasa ini menempatkan Kadesh pada bagian terluar batas wilayah Edom. “Di tepi perbatasanmu” mempertahankan gambaran spasialnya secara alami.
theological_decisions:
- issue: Identitas מַלְאָךְ dalam rujukan kepada keluaran
  choice: Diterjemahkan “seorang malaikat” tanpa menetapkan identitasnya secara lebih khusus.
  alternative: “seorang utusan”; atau penafsiran bahwa sosok ini adalah manifestasi ilahi khusus.
  rationale: Ayat ini hanya menyatakan bahwa Yahweh mengutus מַלְאָךְ dan tidak mengidentifikasi sosok itu lebih jauh. Terjemahan tidak menambahkan kesimpulan teologis, sedangkan keluasan makna katanya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kami” dipakai karena kelompok Israel tidak mencakup pihak Edom yang sedang disapa. Huruf kapital pada “Dia” dipakai sebagai konvensi hormat untuk rujukan kepada Allah.
