  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: id
  text: Harun akan dikumpulkan kepada kaumnya[a], sebab ia tidak akan masuk ke tanah yang telah Kuberikan kepada anak-anak Israel, karena kamu telah memberontak terhadap titah-Ku[b] di perairan Meriba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan dikumpulkan kepada kaumnya.” Ini adalah ungkapan Ibrani untuk kematian; teks tidak merincikan keadaan sesudah kematian.
    reason: idiom_clarification
  - marker: b
    text: Secara harfiah, “terhadap mulut-Ku”, yakni terhadap perintah yang Kuucapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף ... אֶל־עַמָּיו
  choice: akan dikumpulkan kepada kaumnya
  rationale: Mempertahankan ungkapan Ibrani tentang kematian dan kebersamaan dengan kaum sendiri tanpa mereduksinya menjadi sekadar “akan mati” atau mempersempitnya menjadi “leluhur”.
- source_word: יָבֹא אֶל־הָאָרֶץ
  choice: masuk ke negeri
  rationale: “Masuk ke negeri” merupakan ungkapan Indonesia yang alami untuk verba gerak ini; “negeri” menunjuk wilayah yang dianugerahkan Allah tanpa menambahkan kata “perjanjian” atau “terjanji” yang tidak ada dalam teks.
- source_word: אֲשֶׁר נָתַתִּי
  choice: yang telah Kuberikan
  rationale: Bentuk perfektif menyatakan pemberian ilahi sebagai tindakan yang sudah ditetapkan atau terlaksana dan tetap berlaku.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada anak-anak Israel
  rationale: Mempertahankan bentuk formulaik Ibrani secara transparan; dalam konteks ini ungkapan tersebut menunjuk bangsa keturunan Israel secara keseluruhan.
- source_word: מְרִיתֶם
  choice: kalian memberontak
  rationale: Verba מרה menyatakan pembangkangan terhadap otoritas. “Kalian” mempertahankan bentuk jamak yang mengacu kepada Musa dan Harun.
- source_word: אֶת־פִּי
  choice: terhadap titah-Ku
  rationale: Secara harfiah berarti “terhadap mulut-Ku”, tetapi secara idiomatis menunjuk perintah yang Allah ucapkan. “Titah-Ku” mempertahankan bobot otoritatifnya dalam bahasa Indonesia yang wajar dan khidmat.
- source_word: לְמֵי מְרִיבָה
  choice: di mata air Meriba
  rationale: Meriba dipertahankan sebagai nama tempat/peristiwa, sedangkan “mata air” memberi padanan Indonesia yang lazim bagi perairan yang dimaksud dalam konteks.
theological_decisions:
- issue: Ungkapan kematian “dikumpulkan kepada kaumnya”
  choice: Mempertahankan ungkapan sumber dalam teks utama
  alternative: Harun akan mati
  rationale: Ungkapan Ibrani menyampaikan kematian sekaligus keterhubungan dengan kaumnya. Bentuk ini mempertahankan nuansa sastra dan teologis tanpa menetapkan ajaran terperinci tentang keadaan sesudah mati.
- issue: Identitas penerima negeri dalam בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: umat Israel / orang Israel
  rationale: Bentuk formulaik sumber dipertahankan, tetapi dipahami secara kolektif sebagai bangsa keturunan Israel, bukan hanya laki-laki.
- issue: Sasaran pemberontakan dalam אֶת־פִּי
  choice: titah-Ku
  alternative: mulut-Ku / firman-Ku
  rationale: Pilihan ini menyampaikan bahwa Musa dan Harun menentang perintah lisan Allah, sambil menghindari ungkapan harfiah yang tidak alami dan tanpa menyamakan istilah ini secara otomatis dengan pengertian teologis khusus dari “Firman”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Kuberikan” dan “titah-Ku” menandai ujaran ilahi secara jelas. “Kalian” dipakai untuk mempertahankan subjek jamak dalam bahasa Ibrani, sedangkan ungkapan kematian dan nama Meriba dipertahankan agar nuansa sumber tidak diratakan.
