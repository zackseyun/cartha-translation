  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל כָּל הָ/עֵדָ֖ה הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: id
  text: Mereka berangkat dari Kadesh, lalu orang Israel[a], yakni segenap umat itu, tiba di Gunung Hor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel,” suatu ungkapan Ibrani untuk orang Israel sebagai satu bangsa.'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: “Hor, gunung itu,” yang berfungsi sebagai nama tempat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: mereka berangkat
  rationale: Kata kerja נסע dalam rangkaian narasi ini menyatakan tindakan membongkar perkemahan lalu memulai perjalanan. “Berangkat” alami dalam bahasa Indonesia dan tetap memuat gagasan meninggalkan tempat persinggahan.
- source_word: מִקָּדֵשׁ
  choice: dari Kadesh
  rationale: Teks Ibrani hanya menyebut Kadesh; nama yang lebih panjang, Kadesh-Barnea, tidak ditambahkan.
- source_word: וַיָּבֹאוּ
  choice: tiba di
  rationale: Dengan nama tempat sebagai tujuan, בוא secara alami berarti datang atau tiba. “Tiba di” lebih jelas dan wajar dalam bahasa Indonesia daripada terjemahan mekanis “datang ke”.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani secara harfiah berbunyi “anak-anak lelaki Israel,” tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” merupakan padanan modern yang alami tanpa membatasi rujukannya pada laki-laki.
- source_word: כָּל הָעֵדָה
  choice: segenap umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu himpunan. “Segenap” mencerminkan כָּל, sedangkan “umat itu” mempertahankan sifat kolektif dan definit dari frasa tersebut.
- source_word: הֹר הָהָר
  choice: Gunung Hor
  rationale: Frasa ini berfungsi sebagai nama tempat dan secara konvensional serta alami diterjemahkan “Gunung Hor,” bukan secara mekanis “Hor, gunung itu.”
