  source_fidelity: 'Terjemahan dengan tepat menyampaikan dua tindakan naratif: mereka berangkat dari Kadesh dan seluruh komunitas Israel tiba di Gunung Hor. “Orang Israel” merupakan padanan idiomatis yang tepat untuk בְנֵי יִשְׂרָאֵל, dan aposisi “segenap umat itu” merepresentasikan כָּל־הָעֵדָה tanpa menambah makna substantif.'
