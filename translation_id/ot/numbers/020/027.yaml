  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: id
  text: Musa melakukan sebagaimana yang Yahweh perintahkan, lalu mereka naik ke Gunung Hor di depan mata seluruh umat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di depan mata seluruh umat”; maksudnya, secara terbuka dan disaksikan oleh umat yang berkumpul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה
  choice: Musa melakukan seperti yang diperintahkan
  rationale: Ungkapan ini menyatakan bahwa Musa menaati perintah yang telah diberikan. Terjemahan ini mengikuti susunan dan daya perintah teks Ibrani sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיַּעֲלוּ
  choice: lalu mereka naik
  rationale: Bentuk jamak dipertahankan tanpa menjelaskan siapa saja yang ikut, karena ayat ini sendiri hanya menyatakan 'mereka'. Kata 'lalu' menyampaikan kelanjutan narasi dari waw.
- source_word: אֶל הֹר הָהָר
  choice: ke Gunung Hor
  rationale: Ini adalah bentuk nama tempat yang alami dalam bahasa Indonesia dan menyampaikan gerak menuju serta mendaki gunung tersebut.
- source_word: לְעֵינֵי כָּל הָעֵדָה
  choice: di depan mata seluruh umat itu
  rationale: Terjemahan ini mempertahankan gambaran harfiah 'di depan mata' yang menekankan bahwa peristiwa tersebut terlihat oleh seluruh komunitas Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Identitas subjek jamak dalam וַיַּעֲלוּ
  choice: mereka
  alternative: Musa, Harun, dan Eleazar
  rationale: Walaupun konteks ayat sebelumnya menjelaskan para pelakunya, teks ayat ini memakai subjek tersirat berbentuk jamak. 'Mereka' mempertahankan bentuk dan ketergantungan pada konteks itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Ungkapan 'di depan mata' sengaja dipertahankan untuk membawa citraan Ibrani, sedangkan 'seluruh umat itu' menunjuk kepada komunitas Israel dalam konteks.
