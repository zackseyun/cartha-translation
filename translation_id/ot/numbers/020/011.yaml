base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: id
  text: Lalu Musa mengangkat tangannya dan memukul batu itu dengan tongkatnya dua kali. Maka keluarlah air yang berlimpah, lalu umat itu minum dan ternak mereka pun minum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: mengangkat
  rationale: Bentuk Hifil dari רום menyatakan tindakan mengangkat; pilihan ini alami dan tepat untuk gerakan tangan Musa.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Menerjemahkan secara langsung nomina tunggal dengan sufiks orang ketiga maskulin tunggal.
- source_word: וַיַּךְ
  choice: memukul
  rationale: נכה berarti memukul atau menghantam. 'Memukul' jelas, wajar, dan tetap bermartabat dalam narasi modern.
- source_word: הַסֶּלַע
  choice: batu itu
  rationale: סֶלַע menunjuk pada batu besar atau bukit batu; 'batu itu' sesuai dengan objek tertentu yang telah disebut dalam konteks.
- source_word: בְּמַטֵּהוּ
  choice: dengan tongkatnya
  rationale: מַטֶּה dapat berarti tongkat atau gada; 'tongkat' paling alami dan sesuai untuk benda yang dibawa Musa.
- source_word: פַּעֲמָיִם
  choice: dua kali
  rationale: Bentuk dual ini secara idiomatis berarti 'dua kali'.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: Maka keluarlah air yang berlimpah
  rationale: רַבִּים menyatakan jumlah air yang sangat banyak. Susunan ini mempertahankan penekanan pada keluarnya air sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וַתֵּשְׁתְּ
  choice: lalu ... minum
  rationale: Verba feminin tunggal bersesuaian dengan nomina kolektif עֵדָה; bahasa Indonesia tidak memerlukan penandaan jumlah pada verba.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה merujuk pada komunitas Israel yang berhimpun. 'Umat itu' alami dalam konteks Pentateukh dan mempertahankan sifat kolektifnya.
- source_word: וּבְעִירָם
  choice: demikian juga ternak mereka
  rationale: בְּעִירָם mencakup hewan ternak milik mereka secara umum; 'ternak' lebih luas dan tepat daripada hanya 'lembu' atau 'sapi'.
theological_decisions:
- issue: Cara menarasikan tindakan Musa terhadap batu
  choice: Menyatakan secara lugas bahwa Musa memukul batu itu dua kali dengan tongkatnya.
  alternative: Menambahkan dalam baris terjemahan bahwa tindakan itu merupakan ketidaktaatan.
  rationale: Ayat ini sendiri menarasikan tindakan dan hasilnya. Penilaian ilahinya muncul dalam konteks berikutnya, sehingga tidak boleh disisipkan ke dalam terjemahan ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif Ibrani dipertahankan tanpa membuat rangkaian 'dan' menjadi kaku; 'lalu' dan 'maka' digunakan untuk alur yang alami. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal penting yang harus ditampilkan kepada pembaca.
