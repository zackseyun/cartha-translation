source:
  edition: WLC
  text: קַ֚ח אֶֽת אַהֲרֹ֔ן וְ/אֶת אֶלְעָזָ֖ר בְּנ֑/וֹ וְ/הַ֥עַל אֹתָ֖/ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: id
  text: Bawalah Harun dan Eleazar, anaknya, lalu bawalah mereka naik ke Gunung Hor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Hor, gunung itu”; secara konvensional diterjemahkan “Gunung Hor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Bawalah
  rationale: Bentuk imperatif Qal dari לקח berarti ‘ambil’ atau ‘bawa’. Karena objeknya adalah orang-orang yang harus menyertai Musa, ‘bawalah’ terdengar alami dalam bahasa Indonesia.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Transliterasi nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Akhiran pronominal orang ketiga maskulin tunggal paling wajar merujuk kepada Harun, sehingga Eleazar diidentifikasi sebagai anak Harun.
- source_word: וְהַעַל
  choice: lalu bawalah ... naik
  rationale: Imperatif Hifil dari עלה bersifat kausatif, yakni ‘buatlah naik’ atau ‘bawalah naik’. Pilihan ini mempertahankan nuansa kausatif sekaligus alami dalam bahasa Indonesia.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek ini merujuk bersama-sama kepada Harun dan Eleazar.
- source_word: הֹר הָהָר
  choice: Gunung Hor
  rationale: Secara harfiah susunannya adalah ‘Hor, gunung itu’, tetapi ‘Gunung Hor’ merupakan bentuk nama tempat yang alami dan konvensional dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘bawalah’ mencerminkan dua imperatif Ibrani, sedangkan ‘naik ke’ menyampaikan gerakan menuju gunung secara alami. Penanda catatan kaki ditempatkan setelah ‘Gunung Hor’ karena catatan itu menjelaskan bentuk nama tempat tersebut.
