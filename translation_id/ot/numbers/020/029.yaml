  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: id
  text: Ketika seluruh umat melihat bahwa Harun telah meninggal[a], seluruh kaum Israel[b] menangisi Harun selama tiga puluh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyadari bahwa Harun telah meninggal.” Secara harfiah, bahasa Ibrani berbunyi “melihat bahwa Harun telah meninggal”; kata “melihat” dapat mencakup pengertian mengenali atau menyadari kenyataan tersebut.
    reason: lexical_alternative
  - marker: b
    text: “Seluruh kaum Israel” merupakan ungkapan kolektif yang berarti seluruh umat Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: melihat
  rationale: Makna dasar ראה adalah ‘melihat’. Dalam konteks ini kata tersebut juga dapat mencakup pengertian menyadari atau mengetahui kenyataan bahwa Harun telah meninggal; catatan kaki mempertahankan kemungkinan itu.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel secara kolektif. ‘Seluruh umat’ alami dalam bahasa Indonesia modern dan sesuai dengan konteks naratif Pentateukh.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi dari apa yang dilihat atau disadari umat, yaitu bahwa Harun telah meninggal.
- source_word: גָוַע
  choice: telah meninggal
  rationale: גוע menyatakan kematian atau berembusnya napas terakhir. ‘Telah meninggal’ bernada hormat, jelas, dan menunjukkan bahwa kematian itu sudah terjadi ketika umat mengetahuinya.
- source_word: וַיִּבְכּוּ
  choice: menangisi
  rationale: בכה berarti menangis atau meratap. Dengan objek pribadi, ‘menangisi Harun’ menyampaikan kesedihan berkabung secara alami.
- source_word: אֶת אַהֲרֹן
  choice: Harun
  rationale: Penanda objek אֶת memperkenalkan orang yang ditangisi; bahasa Indonesia cukup memakai objek langsung ‘Harun’ setelah ‘menangisi’.
- source_word: שְׁלֹשִׁים יוֹם
  choice: selama tiga puluh hari
  rationale: Frasa ini merupakan akusatif durasi. Penambahan ‘selama’ membuat hubungan waktunya jelas dan alami dalam bahasa Indonesia.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: seluruh kaum Israel
  rationale: בֵּית יִשְׂרָאֵל adalah ungkapan korporatif bagi seluruh bangsa Israel. ‘Kaum Israel’ mempertahankan nuansa kolektif tanpa terdengar kaku.
theological_decisions: []
