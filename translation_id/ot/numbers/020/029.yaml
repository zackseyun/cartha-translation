  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti alur Ibrani, sedangkan ‘selama’ ditambahkan untuk menyatakan durasi secara alami. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
