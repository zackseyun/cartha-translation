base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: id
  text: Tidak ada air bagi umat[a], lalu mereka berkumpul menentang Musa dan Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jemaah” atau “komunitas”. Kata Ibrani עֵדָה menunjuk kepada umat Israel yang terhimpun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: Tidak ada
  rationale: Konstruksi היה dengan nomina tak tentu menyatakan keberadaan; bentuk Indonesia ini alami dan tepat. Konjungsi ו tidak perlu ditampilkan sebagai penanda wacana tersendiri pada awal ayat.
- source_word: מַיִם
  choice: air
  rationale: Bentuk jamak Ibrani ini merupakan bentuk lazim untuk zat; bahasa Indonesia memakai nomina massa 'air'.
- source_word: לָ/עֵדָה
  choice: bagi umat
  rationale: עֵדָה menunjuk kepada kelompok Israel sebagai satu komunitas yang terhimpun. 'Umat' alami dalam konteks Pentateukh dan mempertahankan dimensi kolektifnya; alternatif leksikal dicatat dalam catatan kaki.
- source_word: וַ/יִּקָּהֲלוּ
  choice: lalu mereka berkumpul
  rationale: Verba קהל menyatakan tindakan berhimpun sebagai kelompok. 'Lalu' membawa urutan naratif dari waw konsekutif secara alami.
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: menentang Musa dan Harun
  rationale: Dalam konteks perselisihan ini, עַל bermakna adversatif. Satu verba 'menentang' dengan dua objek alami dalam bahasa Indonesia, sementara cakupan terhadap kedua pemimpin tetap jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Umat' dipilih agar mudah dipahami pembaca umum tanpa mengimpor istilah denominasi tertentu.
