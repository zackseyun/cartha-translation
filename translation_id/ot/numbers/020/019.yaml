  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: id
  text: Orang Israel[a] berkata kepadanya, “Kami akan menempuh jalan raya[b]. Jika aku dan ternakku minum airmu, aku akan membayar harganya. Izinkan aku hanya lewat dengan berjalan kaki[c], tidak lebih dari itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “jalan utama.” Istilah Ibraninya dapat menunjuk pada jalan besar atau jalan yang ditinggikan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dengan kakiku aku akan lewat,” yaitu sekadar melintasi negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak Israel’, tetapi ‘orang Israel’ adalah sebutan kolektif yang alami dalam bahasa Indonesia modern.
- source_word: בַּמְסִלָּה
  choice: melalui jalan raya
  rationale: מְסִלָּה menunjuk pada jalan besar atau jalan yang ditinggikan; ‘jalan raya’ mempertahankan gagasan tentang jalur perjalanan utama.
- source_word: נַעֲלֶה
  choice: kami akan berjalan
  rationale: Kata kerjanya secara harfiah berarti ‘kami akan naik’, tetapi dalam konteks ini menyatakan perjalanan menyusuri wilayah; ‘berjalan’ lebih alami tanpa mengubah maksud permohonan.
- source_word: מֵימֶיךָ
  choice: airmu
  rationale: Bentuk jamak Ibrani untuk ‘air’ bersifat idiomatis; bentuk tunggal massal ‘air’ wajar dalam bahasa Indonesia.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: aku dan ternakku minum
  rationale: Peralihan dari ‘kami’ kepada ‘aku’ dipertahankan karena teks Ibrani memakai orang pertama tunggal, dengan Israel sebagai pembicara kolektif. ‘Ternak’ mencakup seluruh hewan milik mereka.
- source_word: וְנָתַתִּי מִכְרָם
  choice: aku akan membayar harganya
  rationale: מֶכֶר menyatakan harga atau pembayaran; akhiran pronominalnya secara kontekstual merujuk pada air yang diminum.
- source_word: רַק אֵין דָּבָר
  choice: tidak lebih dari itu
  rationale: 'Ungkapan ini membatasi dan mengecilkan permintaan: mereka tidak meminta apa pun selain izin melintas.'
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: Aku hanya akan lewat dengan berjalan kaki
  rationale: Terjemahan ini menyampaikan penyebutan ‘kaki’ dalam teks serta daya permohonan dari bentuk kata kerjanya secara alami.
theological_decisions:
- issue: Peralihan dari orang pertama jamak ke tunggal
  choice: Mempertahankan ‘kami’ lalu ‘aku’
  alternative: Menyeragamkan semuanya menjadi ‘kami’
  rationale: Teks Ibrani beralih dari נַעֲלֶה (‘kami akan berjalan/naik’) kepada אֲנִי, נִשְׁתֶּה, וְנָתַתִּי, dan אֶעֱבֹרָה dalam konstruksi tunggal. Mempertahankan peralihan itu menjaga bentuk kolektif-personal Israel tanpa menafsirkannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan orang kedua tunggal dipertahankan melalui bentuk posesif ‘airmu’. Peralihan ‘kami’ ke ‘aku’ sengaja dipertahankan agar ketegangan gramatikal teks sumber tetap terlihat.
