base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: id
  text: Tanggalkanlah pakaian Harun, lalu pakaikanlah pakaian itu kepada Eleazar, anaknya.[a] Harun akan dikumpulkan[b] dan mati di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, yang dimaksud ialah pakaian keimamannya. Teks Ibrani hanya mengatakan “pakaiannya”.
    reason: lexical_alternative
  - marker: b
    text: “Dikumpulkan” merupakan idiom Ibrani yang dipakai sehubungan dengan kematian. Di bagian lain terdapat bentuk yang lebih lengkap, “dikumpulkan kepada kaumnya”.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן אֶת־בְּגָדָיו
  choice: Tanggalkanlah pakaian Harun
  rationale: Bentuk Hifil imperatif dari פשט memerintahkan agar pakaian dilepaskan dari Harun. “Tanggalkanlah pakaian Harun” langsung, wajar, dan mempertahankan pakaian sebagai objek yang dilepaskan.
- source_word: בְּגָדָיו
  choice: pakaian Harun
  rationale: בגד berarti pakaian atau jubah. Konteks menunjukkan pakaian keimaman, tetapi kata Ibraninya sendiri hanya menyebut “pakaiannya”; nama Harun diulangi dalam bahasa Indonesia untuk menghindari rujukan pronomina yang kaku.
- source_word: וְהִלְבַּשְׁתָּם אֶת־אֶלְעָזָר בְּנוֹ
  choice: lalu kenakanlah pakaian itu kepada Eleazar, anaknya
  rationale: Bentuk Hifil menyatakan tindakan mengenakan pakaian itu pada Eleazar. “Pakaian itu” memperjelas sufiks jamak Ibrani dalam ungkapan Indonesia yang alami, sedangkan “anaknya” mempertahankan hubungan yang dinyatakan teks.
- source_word: יֵאָסֵף
  choice: akan dikumpulkan
  rationale: Bentuk Nifal dari אסף dipertahankan sebagai idiom pasif “dikumpulkan”. Teks ayat ini tidak memuat pelengkap “kepada kaumnya”, sehingga pelengkap tersebut tidak ditambahkan ke dalam teks utama.
- source_word: וּמֵת שָׁם
  choice: dan mati di sana
  rationale: Ungkapan ini secara langsung menyatakan bahwa Harun akan mati di tempat itu; “di sana” mempertahankan keterangan tempat שָׁם.
theological_decisions:
- issue: Idiom kematian dalam יֵאָסֵף
  choice: Mempertahankan ungkapan “akan dikumpulkan” tanpa menambahkan tujuan pengumpulan.
  alternative: “akan dikumpulkan kepada kaumnya” atau “akan meninggal”
  rationale: Walaupun bentuk yang lebih lengkap muncul di bagian lain sebagai idiom kematian, ayat ini hanya mengatakan “akan dikumpulkan”. Terjemahan utama mempertahankan bentuk singkat dan ketegangan sastranya, sementara catatan kaki membantu pembaca memahami idiom tersebut tanpa memasukkan kata-kata yang tidak ada dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang khidmat. Susunan kalimat dibuat alami bagi pembaca umum, tetapi idiom Ibrani “akan dikumpulkan” sengaja dipertahankan dan dijelaskan melalui catatan kaki.
