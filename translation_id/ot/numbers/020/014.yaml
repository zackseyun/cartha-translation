base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: id
  text: 'Lalu Musa mengirim utusan-utusan dari Kadesh kepada raja Edom: “Beginilah kata saudaramu Israel:[a] Engkau tahu segala kesukaran[b] yang telah menimpa kami.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabatmu Israel.” Bahasa Ibrani secara harfiah memakai ungkapan kekeluargaan, “saudaramu Israel,” yang mengingatkan hubungan leluhur antara Edom dan Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “segala kesusahan” atau “segala penderitaan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “yang menemukan kami”; maksudnya, “yang telah menimpa kami” atau “yang telah terjadi atas kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengirim
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. “Lalu” menyatakan urutan secara wajar dalam bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: Dalam konteks diplomatik ini, kata tersebut menunjuk kepada para wakil manusia, bukan makhluk surgawi. Bentuk ulang menyatakan jamak dengan jelas.
- source_word: מִקָּדֵשׁ
  choice: dari Kadesh
  rationale: Teks Ibrani hanya menyebut Kadesh; nama yang lebih panjang tidak ditambahkan.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: kepada raja Edom
  rationale: Padanan langsung dan alami bagi frasa tujuan serta susunan konstruksi Ibrani.
- source_word: כֹּה אָמַר
  choice: Beginilah kata
  rationale: Ungkapan ini mempertahankan rumusan baku seorang utusan yang menyampaikan pesan atas nama pihak lain.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: saudaramu Israel
  rationale: Terjemahan ini mempertahankan bahasa kekerabatan yang sengaja dipakai untuk mengingatkan hubungan leluhur antara Israel dan Edom.
- source_word: אַתָּה יָדַעְתָּ
  choice: Engkau tahu
  rationale: Bentuk perfektif menyatakan keadaan pengetahuan yang berlaku sekarang. Pronomina eksplisit dipertahankan melalui “Engkau”.
- source_word: כָּל הַתְּלָאָה
  choice: segala kesukaran
  rationale: Kata benda ini mencakup penderitaan, kesusahan, dan kesukaran. “Segala kesukaran” alami, bermartabat, dan sesuai dengan konteks pengalaman Israel.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: yang telah menimpa kami
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang kesukaran yang “menemukan” mereka. “Telah menimpa kami” menyampaikan idiom itu secara jelas tanpa menjadi kaku.
theological_decisions:
- issue: Bahasa kekerabatan antara Israel dan Edom
  choice: saudaramu Israel
  alternative: kerabatmu Israel
  rationale: Ayat ini membingkai permohonan Israel dengan bahasa kekeluargaan yang berakar pada hubungan leluhur kedua bangsa. Metafora “saudara” dipertahankan dan tidak diperlemah menjadi hubungan sosial yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pesan diplomatik dipertahankan, sementara idiom Ibrani diterjemahkan secara alami. Pronomina “Engkau” dipakai untuk sapaan tunggal kepada raja dan untuk mempertahankan penekanan pronomina Ibrani.
