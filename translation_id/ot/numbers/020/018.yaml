  yaml_path: translation/ot/numbers/020/018.yaml
  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: id
  text: Tetapi Edom berkata kepadanya, “Engkau tidak boleh melintasi wilayahku.[a] Jika tidak, aku akan keluar menghadangmu[b] dengan pedang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui aku.” Karena Edom berbicara sebagai bangsa sekaligus wilayah, maksudnya ialah melintasi wilayah Edom.
    reason: lexical_alternative
  - marker: b
    text: Atau “menemuimu” atau “menyongsongmu.” Dalam konteks ini, ungkapan tersebut bermakna datang untuk melawan dengan senjata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר paling wajar diterjemahkan dengan verba ujaran umum “berkata”.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Menerjemahkan frasa berpreposisi אֶל secara langsung dan mempertahankan rujukan pronominal maskulin tunggal sebagaimana dalam teks sumber.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama bangsa sekaligus wilayah dipertahankan sebagai nama diri; dalam ujaran ini Edom dipersonifikasikan sebagai pembicara.
- source_word: לֹא תַעֲבֹר
  choice: Engkau tidak boleh melintasi
  rationale: Bentuk imperfek orang kedua tunggal menyatakan penolakan atau larangan tegas. “Tidak boleh” alami dalam bahasa Indonesia modern, sedangkan “melintasi” sesuai dengan konteks perjalanan melalui suatu wilayah.
- source_word: בִּי
  choice: wilayahku
  rationale: Secara harfiah berarti “melalui aku/di dalam aku”, tetapi karena Edom berbicara sebagai bangsa-wilayah, yang dimaksud ialah melintasi wilayah Edom. Pilihan ini membuat metonimia tersebut jelas tanpa mengubah pelaku yang dipersonifikasikan.
- source_word: פֶּן
  choice: Jika tidak
  rationale: Dalam ancaman ini פֶּן memperkenalkan akibat yang akan terjadi bila larangan dilanggar. “Jika tidak” menyampaikan daya ancamnya dengan bahasa Indonesia yang alami.
- source_word: אֵצֵא
  choice: aku akan keluar
  rationale: Imperfek orang pertama tunggal memiliki acuan mendatang dalam ancaman; “akan keluar” mempertahankan gambaran pasukan Edom yang bergerak keluar.
- source_word: לִקְרָאתֶךָ
  choice: menghadangmu
  rationale: Makna dasarnya ialah “menemuimu/menyongsongmu”, tetapi konteks bersenjata memberi nuansa permusuhan. “Menghadangmu” menyampaikan gerak menyongsong sekaligus perlawanan tanpa melebih-lebihkan menjadi serangan yang sudah berlangsung.
- source_word: בַּחֶרֶב
  choice: dengan pedang
  rationale: Menerjemahkan ungkapan instrumental secara langsung dan mempertahankan idiom militer kolektif dalam bentuk tunggal.
