  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: id
  text: Itulah air Meriba,[a] tempat orang Israel bertengkar dengan Yahweh, dan Ia menyatakan diri-Nya kudus di antara mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba berarti “pertengkaran” atau “perselisihan”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “dan Ia dinyatakan kudus di antara mereka” atau “dan Ia membuktikan diri-Nya kudus melalui mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Itulah
  rationale: Kata ganti penunjuk ini mengidentifikasi mata air yang baru diceritakan; “Itulah” alami dalam bahasa Indonesia untuk rumusan penamaan retrospektif.
- source_word: מֵי מְרִיבָה
  choice: mata air Meriba
  rationale: Frasa konstruksi ini menunjuk pada tempat bernama Meriba. Dalam konteks peristiwa di padang gurun, “mata air” lebih alami daripada terjemahan harfiah “air-air”, sementara nama tempatnya dipertahankan.
- source_word: רָבוּ
  choice: bertengkar
  rationale: Verba ריב menyatakan perselisihan atau pertengkaran; “bertengkar” jelas, modern, dan mempertahankan kaitan makna dengan nama Meriba.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani ini berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” merupakan padanan Indonesia yang alami tanpa menyiratkan bahwa hanya laki-laki yang terlibat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh agar nama pribadi dalam teks sumber tidak diganti dengan gelar.
- source_word: וַיִּקָּדֵשׁ
  choice: Ia menyatakan kekudusan-Nya
  rationale: Bentuk nifal dapat menyatakan bahwa Yahweh tampil atau terbukti kudus. Rumusan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa manusia menjadikan Allah kudus.
- source_word: בָּם
  choice: di tengah-tengah mereka
  rationale: Preposisi ב dengan sufiks jamak dapat berarti “di antara/di tengah mereka”, meskipun “melalui mereka” juga mungkin; ambiguitas itu dicatat dalam catatan kaki.
theological_decisions:
- issue: Cara menerjemahkan bentuk nifal וַיִּקָּדֵשׁ
  choice: dan Ia menyatakan kekudusan-Nya di tengah-tengah mereka
  alternative: dan Ia dinyatakan kudus di antara mereka / dan Ia membuktikan diri-Nya kudus melalui mereka
  rationale: 'Bentuk Ibrani membuka nuansa pasif-refleksif: kekudusan Yahweh dinyatakan atau terbukti melalui peristiwa tersebut. Pilihan utama menghindari kesan bahwa manusia membuat Yahweh menjadi kudus, sedangkan catatan kaki mempertahankan kemungkinan bentuk pasif dan instrumental.'
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel / putra-putra Israel
  rationale: Dalam konteks ini ungkapan tersebut adalah etnonim kolektif bagi umat Israel. Padanan “orang Israel” menyampaikan rujukannya secara tepat dan alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama Yahweh dan Meriba dipertahankan; susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan ketaksaan pada klausa terakhir melalui catatan kaki.
