base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: id
  text: Lalu Musa dan Harun pergi dari hadapan jemaah[a] ke pintu masuk Kemah Pertemuan. Mereka sujud dengan muka ke tanah, lalu kemuliaan Yahweh menampakkan diri kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari hadapan jemaah,” yaitu dari hadapan orang-orang yang sedang berhimpun.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pergi
  rationale: Kata בוא dapat berarti datang, pergi, atau masuk menurut sudut pandang. Dalam alur Indonesia, Musa dan Harun bergerak menjauh dari umat menuju Kemah Pertemuan, sehingga 'pergi' paling alami.
- source_word: מִפְּנֵי הַקָּהָל
  choice: meninggalkan hadapan umat yang berkumpul
  rationale: Ungkapan ini secara harfiah berarti 'dari hadapan perkumpulan'. Terjemahan ini mempertahankan citra ruang Ibrani sambil menjelaskan bahwa mereka meninggalkan orang-orang yang sedang berhimpun.
- source_word: הַקָּהָל
  choice: umat yang berkumpul
  rationale: קהל menunjuk kepada komunitas yang berhimpun. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur perkumpulan tanpa memakai istilah gerejawi yang lebih sempit.
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: פתח adalah bukaan atau tempat masuk suatu bangunan; 'pintu masuk' jelas dan wajar dalam konteks kemah.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan baku dan dekat dengan bentuk Ibrani untuk nama tempat kudus tersebut.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: mereka sujud dengan muka sampai ke tanah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan jatuh di atas muka. Bentuk Indonesia ini menyampaikan postur merendahkan diri tanpa menyiratkan secara pasti bahwa tindakan itu hanya penyembahan.
- source_word: וַיֵּרָא
  choice: tampak
  rationale: Bentuk nifal dari ראה di sini menyatakan manifestasi yang dapat dilihat; 'tampak' ringkas dan alami.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: כבוד dalam konteks ini menunjuk pada manifestasi kemuliaan ilahi, sedangkan nama יהוה dipertahankan sebagai nama diri Yahweh.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Preposisi אל mengarah kepada pihak yang mengalami penampakan; 'tampak kepada mereka' merupakan ungkapan Indonesia yang tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna tindakan jatuh dengan muka ke tanah
  choice: sujud dengan muka sampai ke tanah
  alternative: menyembah
  rationale: Teks menyatakan postur jasmani, tetapi tidak secara eksplisit memakai kata kerja 'menyembah'. Pilihan ini menjaga keterbukaan apakah tindakan tersebut terutama merupakan permohonan, kerendahan diri, atau penyembahan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibagi agar alur gerak, tindakan sujud, dan penampakan kemuliaan mudah diikuti. Istilah 'Kemah Pertemuan' diperlakukan sebagai nama khusus.
