lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif wayyiqtol dari דבר memperkenalkan tindakan berikutnya. “Lalu” menyampaikan kesinambungan narasi, sedangkan “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan langsung dan alami bagi arah perkataan kepada Musa.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Ungkapan ini menandai bahwa isi firman menyusul. “Kata-Nya” mempertahankan fungsi formula Ibrani tanpa menghasilkan susunan Indonesia yang kaku seperti “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehovah; TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut; catatan kaki memberi tahu pembaca tentang bentuk Ibrani dan alternatif alih aksaranya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula “berfirman ... kata-Nya” sengaja mempertahankan pola pengantar ujaran Ibrani, sementara “Lalu” menjaga alur naratif.
