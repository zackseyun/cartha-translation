source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: id
  text: Mengapa kalian membawa umat Yahweh[a] ke padang gurun ini hingga kami dan ternak kami mati di sana?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jemaat Yahweh.”'
    reason: alternatif leksikal untuk קְהַל יְהוָה, yang menunjuk pada komunitas/kelompok yang berhimpun.
lexical_decisions:
- source_word: וְלָמָה
  choice: Mengapa
  rationale: Kata tanya menyampaikan keluhan lanjutan; dalam bahasa Indonesia, hubungan dengan ayat sebelumnya tetap jelas tanpa harus menerjemahkan וְ secara kaku sebagai “dan”.
- source_word: הֲבֵאתֶם
  choice: kalian membawa
  rationale: Bentuk Hifil dari בוא berarti “membawa”; “kalian” menyatakan subjek orang kedua jamak secara jelas dan wajar.
- source_word: קְהַל יְהוָה
  choice: umat Yahweh
  rationale: קָהָל menunjuk pada komunitas yang berhimpun. “Umat” alami dalam bahasa Indonesia dan mempertahankan gagasan komunitas milik Yahweh; alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: ke padang gurun ini
  rationale: מִדְבָּר menunjuk wilayah liar atau tandus; “padang gurun” merupakan padanan Indonesia yang luas dan lazim, sedangkan אֶל menyatakan arah gerak.
- source_word: לָמוּת שָׁם
  choice: sehingga ... mati di sini
  rationale: Infinitif dapat menyatakan tujuan atau akibat; “sehingga” sengaja mempertahankan keterbukaan antara hasil yang dituduhkan dan tujuan retoris. שָׁם secara deiktis berarti “di sana”, tetapi dari sudut para pengeluh lokasi itu adalah tempat mereka sedang berada, sehingga “di sini” lebih alami dalam tuturan langsung Indonesia.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: kami dan ternak kami
  rationale: Pronomena eksplisit dan nomina kolektif diterjemahkan langsung; בְּעִיר mencakup hewan ternak secara umum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan infinitif לָמוּת dengan tindakan membawa
  choice: sehingga kami dan ternak kami mati
  alternative: supaya kami dan ternak kami mati
  rationale: Konstruksi dapat dipahami sebagai tujuan yang dituduhkan atau akibat. “Sehingga” tidak menetapkan bahwa Musa dan Harun benar-benar berniat membunuh umat, tetapi tetap memelihara daya tuduhan mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk orang kedua jamak agar sasaran tuduhan jelas; “umat Yahweh” menghindari nuansa kelembagaan atau gerejawi yang dapat timbul dari “jemaat”.
