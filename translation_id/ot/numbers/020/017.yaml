  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: id
  text: Izinkanlah kami melewati negerimu. Kami tidak akan melintasi ladang atau kebun anggur dan tidak akan minum air dari sumur. Kami akan melalui Jalan Raja[a]; kami tidak akan menyimpang ke kanan ataupun ke kiri sampai kami melewati batasmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jalan sang raja”; atau “jalan raya raja.”
    reason: lexical_alternative
  - marker: b
    text: Atau “wilayahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: Izinkanlah kami melewati
  rationale: Bentuk kohortatif dengan נָא menyatakan permohonan yang sopan; ungkapan ini mempertahankan daya permohonan dalam bahasa Indonesia yang wajar.
- source_word: בְאַרְצֶךָ
  choice: negerimu
  rationale: Dengan verba עבר, preposisi ב menunjuk gerak melintasi suatu wilayah; 'negeri' sesuai untuk tanah kekuasaan Edom dalam konteks ini.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Kami tidak akan melintasi ladang atau kebun anggur
  rationale: Nomina tunggal Ibrani dipakai secara generik dan janji tersebut menyatakan bahwa mereka tidak akan memasuki lahan pertanian.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: dan tidak akan minum air dari sumur
  rationale: Frasa konstruksi מֵי בְאֵר secara alami berarti air yang berasal dari sumur.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: Jalan Raja
  rationale: Secara harfiah berarti 'jalan sang raja' dan dalam konteks menunjuk rute resmi yang dikenal; kapitalisasi membantu menandainya sebagai sebutan rute tanpa menghilangkan arti harfiahnya.
- source_word: נֵלֵךְ
  choice: Kami akan berjalan melalui
  rationale: הלך di sini mengacu pada perjalanan melalui rute tertentu, bukan semata-mata berjalan kaki.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: kami tidak akan menyimpang ke kanan ataupun ke kiri
  rationale: '''Menyimpang'' menangkap idiom tentang tidak meninggalkan rute, sementara pasangan arah sumber tetap dipertahankan.'
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: sampai kami melewati wilayahmu
  rationale: גְּבוּל dapat berarti batas atau wilayah. Dalam konteks perjalanan menembus negeri Edom, 'melewati wilayahmu' menyampaikan bahwa rombongan akan terus berjalan hingga keluar dari daerah kekuasaannya.
