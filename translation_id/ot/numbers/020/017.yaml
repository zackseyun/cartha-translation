- from: Izinkanlah kami melewati negerimu. Kami tidak akan melintasi ladang atau kebun anggur dan tidak akan minum air dari sumur. Kami akan berjalan melalui Jalan Raja[a]; kami tidak akan menyimpang ke kanan ataupun ke kiri sampai kami melewati wilayahmu[b].
  to: Izinkanlah kami melewati negerimu. Kami tidak akan melintasi ladang atau kebun anggur dan tidak akan minum air dari sumur. Kami akan melalui Jalan Raja[a]; kami tidak akan menyimpang ke kanan ataupun ke kiri sampai kami melewati batasmu[b].
