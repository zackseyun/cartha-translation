review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada permohonan sopan, larangan melintasi lahan budidaya dan memakai air sumur, serta janji untuk tidak menyimpang dari rute. Namun, גְּבוּלֶךָ terutama berarti “batasmu”; teks utama “wilayahmu” menghilangkan acuan eksplisit pada batas, sedangkan catatan kaki menambahkan penjelasan spesifik tentang Edom dan “batas terluar” yang tidak dinyatakan dalam ayat.
  naturalness: Bahasa draf baku dan mudah dipahami. “Kami akan melalui Jalan Raja” lebih idiomatis dan lebih tepat untuk perjalanan pada suatu jalan daripada “Kami akan berjalan melalui Jalan Raja,” tanpa menyiratkan perjalanan kaki.
  terminology: “Jalan Raja” merupakan padanan yang baik untuk דֶּרֶךְ הַמֶּלֶךְ. Kapitalisasi dapat dipertahankan sebagai nama/sebutan rute. Catatan kaki hendaknya menyajikan alternatif leksikal secara netral, bukan dugaan tentang status resmi rute atau penjelasan geografis yang terlalu khusus.
  issues:
  - severity: medium
    issue: “wilayahmu” menggantikan “batasmu” dalam teks utama.
    rationale: גְּבוּלֶךָ secara langsung menunjuk batas/boundary. Dalam konteks, istilah itu dapat meluas pada wilayah, tetapi padanan utama “batasmu” lebih setia dan mempertahankan ketegasan ungkapan sumber.
  - severity: medium
    issue: Catatan kaki b menambahkan “wilayah Edom” dan “batas terluar.”
    rationale: Tambahan ini bersifat penafsiran kontekstual dan tidak diperlukan untuk menjelaskan bentuk Ibrani. Catatan sebaiknya hanya menyatakan alternatif leksikal yang relevan.
  - severity: low
    issue: Catatan kaki a menyatakan bahwa jalan itu “mungkin” rute resmi.
    rationale: Keterangan tersebut melampaui makna leksikal dasar “jalan raja.” Alternatif padanan dapat diberikan tanpa spekulasi.
  revised_text: Izinkanlah kami melewati negerimu. Kami tidak akan melintasi ladang atau kebun anggur dan tidak akan minum air dari sumur. Kami akan melalui Jalan Raja[a]; kami tidak akan menyimpang ke kanan ataupun ke kiri sampai kami melewati batasmu[b].
  revised_footnotes:
