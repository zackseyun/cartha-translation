  terminology: '"Yahweh," "Musa," "Harun," dan "Gunung Hor" konsisten dengan nama dan register yang diharapkan. "Berfirman" sesuai untuk ujaran ilahi tanpa menambahkan isi teologis. Tidak diperlukan catatan kaki Indonesia; tidak ada ambiguitas tekstual yang perlu dijelaskan dalam ayat ini.'
