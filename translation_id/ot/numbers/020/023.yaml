  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa dan kepada Harun di Gunung Hor, di perbatasan tanah Edom, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam konteks perkataan ilahi, verba אמר secara alami dan bermartabat diterjemahkan “berfirman”; לֵאמֹר sesudahnya tetap menandai pengantar isi ucapan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan membedakannya dari gelar umum “Tuhan”.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan kepada Harun
  rationale: Pengulangan preposisi אֶל dipertahankan agar sejalan dengan struktur Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: בְּהֹר הָהָר
  choice: di Gunung Hor
  rationale: ב bersifat lokatif, sedangkan הֹר הָהָר adalah nama tempat yang secara konvensional dinyatakan sebagai Gunung Hor.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: di perbatasan tanah Edom
  rationale: עַל dengan גְּבוּל menunjuk lokasi pada atau di batas wilayah; “di perbatasan” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi ucapan yang menyusul pada ayat berikut; “demikian:” menjalankan fungsi tersebut secara alami tanpa pengulangan janggal setelah “berfirman”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama pribadi ilahi YHWH. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar, tanpa memasukkan tafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur berulang “kepada ... dan kepada ...” dipertahankan; tanda titik dua menunjukkan bahwa perkataan langsung berlanjut pada ayat berikutnya.
