  source_fidelity: 'Teks Indonesia secara setia mencerminkan Ibrani: Yahweh sebagai subjek, Musa dan Harun sebagai dua penerima, lokasi di Gunung Hor pada perbatasan tanah Edom, serta pengantar tuturan yang berlanjut ke ayat berikutnya. "Di perbatasan" merupakan padanan idiomatis yang memadai untuk עַל גְּבוּל.'
