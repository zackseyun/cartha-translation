  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: id
  text: Lalu Musa menanggalkan pakaian Harun dan memakaikannya pada Eleazar, anak Harun itu[a]. Harun mati di sana, di puncak gunung itu[b]. Kemudian Musa dan Eleazar turun dari gunung itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pakaian ini adalah pakaian resmi Harun sebagai imam; pemindahannya kepada Eleazar menandai pergantian jabatan yang dijelaskan dalam konteks sekitarnya.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “di bagian paling atas gunung itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: menanggalkan
  rationale: Bentuk Hifil dari פשט di sini berarti melepaskan pakaian dari seseorang. 'Menanggalkan pakaian Harun' alami dalam bahasa Indonesia dan menyatakan tindakan konkret tanpa nuansa merendahkan yang dapat timbul dari pilihan lain.
- source_word: בְּגָדָיו
  choice: pakaian Harun
  rationale: בגד adalah istilah umum untuk pakaian. Penyebutan nama Harun menghindari ketaksaan pronomina dalam bahasa Indonesia, sedangkan sifat keimaman pakaian tersebut dijelaskan dalam catatan berdasarkan konteks.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: mengenakannya kepada Eleazar, anaknya
  rationale: Hifil לבש berarti mengenakan pakaian kepada seseorang. Bentuk ini ringkas dan mempertahankan rujukan bahwa pakaian yang dilepas dari Harun dikenakan kepada Eleazar.
- source_word: וַיָּמָת
  choice: mati
  rationale: מות adalah kata kerja biasa untuk mati; terjemahan langsung ini tidak memakai eufemisme.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat dipertahankan secara eksplisit sebagaimana dalam teks Ibrani.
- source_word: בְּרֹאשׁ הָהָר
  choice: di puncak gunung itu
  rationale: רֹאשׁ secara harfiah berarti 'kepala' dan secara idiomatis berarti bagian paling atas atau puncak. 'Di puncak gunung itu' alami dan tepat.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: ירד berarti bergerak turun. 'Turun' merupakan bentuk naratif Indonesia yang lugas dan tidak perlu menentukan sudut pandang 'pergi' atau 'datang'.
- source_word: מִן הָהָר
  choice: dari gunung itu
  rationale: Frasa ini diterjemahkan secara langsung; artikel tertentu pada הָהָר secara wajar dinyatakan dengan 'itu'.
theological_decisions:
- issue: Sifat pakaian Harun yang dialihkan kepada Eleazar
  choice: Pakai istilah umum 'pakaian' dalam teks utama
  alternative: pakaian imam; jubah keimaman
  rationale: Ayat ini memakai kata umum בגד, meskipun konteks menunjukkan bahwa yang dimaksud adalah pakaian resmi imam. Terjemahan utama tidak menambahkan unsur yang tidak dinyatakan oleh nomina itu sendiri, sementara makna pergantian jabatan dijelaskan dalam catatan.
- issue: Makna tindakan mengenakan pakaian Harun kepada Eleazar
  choice: Biarkan tindakan konkret berbicara dalam teks utama dan jelaskan konteks suksesi dalam catatan
  alternative: Parafrase sebagai pengangkatan Eleazar menjadi imam besar
  rationale: Teks menyebut pemindahan pakaian, bukan rumusan abstrak mengenai pengangkatan. Pilihan ini menjaga ketegangan dan simbolisme narasi tanpa memasukkan formulasi teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Pakaian' dipilih daripada istilah teknis agar tetap setia pada keluasan makna kata Ibrani, sedangkan 'puncak' menyampaikan idiom tempat secara alami.
