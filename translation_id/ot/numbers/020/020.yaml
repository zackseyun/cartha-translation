  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: id
  text: Namun ia berkata, “Engkau tidak boleh melintas.” Lalu Edom keluar untuk menemuinya[a] dengan sejumlah besar orang[b] dan dengan tangan yang kuat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyongsongnya.” Ungkapan Ibraninya sendiri berarti pergi menemui seseorang; dalam konteks ini, pertemuan itu jelas bersifat bermusuhan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan rakyat yang berat,” yaitu dengan kumpulan orang yang besar atau mengesankan.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “dengan tangan yang kuat” berarti dengan kuasa atau kekuatan besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ia berkata
  rationale: 'Waw-konsekutif melanjutkan narasi, sedangkan “Namun” menyatakan pertentangan kontekstual: Edom tetap menolak permintaan Israel. Subjek dibiarkan sebagai kata ganti karena jelas dari konteks sebelumnya.'
- source_word: לֹא תַעֲבֹר
  choice: Engkau tidak boleh melintas
  rationale: Bentuk imperfek menyatakan larangan atau penolakan tegas. “Melintas” secara alami menggambarkan perjalanan melewati wilayah Edom.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: Lalu Edom keluar
  rationale: יצא berarti keluar. “Lalu” menandai kelanjutan peristiwa tanpa menambahkan gagasan ‘berbaris’ yang tidak dinyatakan langsung oleh verba.
- source_word: לִקְרָאתוֹ
  choice: menghadapinya
  rationale: Ungkapan ini pada dasarnya berarti pergi menemui atau menyongsong seseorang. Dalam konteks bermusuhan ini, “menghadapinya” mempertahankan keluwesan makna sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּעַם כָּבֵד
  choice: dengan pasukan yang besar
  rationale: Secara harfiah, frasa ini berarti “dengan rakyat/orang-orang yang berat”; כבד di sini menyampaikan besarnya atau kuatnya kumpulan orang. Konteks menunjukkan suatu kekuatan bersenjata, sehingga “pasukan yang besar” menyampaikan idiom tersebut secara wajar.
- source_word: וּבְיָד חֲזָקָה
  choice: dan dengan tangan yang kuat
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani tentang kuasa atau kekuatan, tanpa mereduksinya hanya menjadi kata abstrak “kekuatan”.
