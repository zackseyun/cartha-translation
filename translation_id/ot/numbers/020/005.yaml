  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: id
  text: Mengapa kalian membawa kami keluar dari Mesir untuk membawa kami ke tempat yang buruk ini? Ini bukan tempat untuk menabur[a]; tidak ada pohon ara, tanaman anggur, ataupun pohon delima, dan tidak ada air untuk diminum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bukan tempat benih”; ungkapan ini dapat berarti tempat yang tidak cocok untuk menabur atau tempat yang tidak menghasilkan biji-bijian atau tanaman pangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Mengapa
  rationale: Kata tanya ini melanjutkan keluhan sebelumnya. Dalam bahasa Indonesia, hubungan wacananya tetap jelas tanpa harus mengawali kalimat dengan 'Dan'.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: membawa kami keluar dari Mesir
  rationale: Bentuk kausatif dari עלה berarti 'membawa naik/keluar'. 'Keluar dari Mesir' alami dalam bahasa Indonesia dan mempertahankan acuan kepada peristiwa keluaran.
- source_word: לְהָבִיא אֹתָנוּ
  choice: dan membawa kami
  rationale: Infinitif ini menyatakan maksud atau akibat. Pengulangan 'membawa kami' mempertahankan susunan retoris keluhan Ibrani.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: ke tempat yang buruk ini
  rationale: רַע di sini menilai tempat itu sebagai tidak menyenangkan atau merugikan, bukan terutama jahat secara moral; 'buruk' mempertahankan kekuatan keluhan tanpa memberi nuansa moral yang berlebihan.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Ini bukan tempat untuk menabur
  rationale: Secara harfiah frasa ini berarti 'bukan tempat benih'. Dalam konteks pertanian, frasa itu paling wajar dipahami sebagai tempat yang tidak cocok untuk menabur, sambil mempertahankan kemungkinan hasil tanaman dalam catatan kaki.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: tidak ada pohon ara, tanaman anggur, ataupun pohon delima
  rationale: Nama-nama tunggal kolektif ini menunjuk tanaman atau hasilnya. Penyebutan tanamannya menghasilkan daftar yang jelas dan alami dalam bahasa Indonesia.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: dan tidak ada air untuk diminum
  rationale: Menerjemahkan konstruksi eksistensial אַיִן dan infinitif secara alami dan tepat.
