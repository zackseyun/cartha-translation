translation_notes:
  register: Bahasa Indonesia baku modern dengan nada keluhan yang kuat namun tetap bermartabat. Kata ganti jamak 'kalian' dipakai karena perkataan ini ditujukan kepada Musa dan Harun (ayat 3), sedangkan 'kami' mewakili umat yang mengeluh.
