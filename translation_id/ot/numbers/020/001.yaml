id: NUM.20.1
reference: Numbers 20:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: id
  text: Kemudian orang Israel[a], yaitu seluruh umat itu[b], tiba di padang gurun Zin pada bulan pertama. Bangsa itu tinggal di Kadesh. Miryam meninggal di sana dan dikuburkan di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini dapat berarti “keturunan Israel” atau “orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “seluruh jemaah itu” atau “seluruh perhimpunan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi dalam konteks ini menunjuk kepada bangsa keturunan Israel secara kolektif. ‘Orang Israel’ menyampaikan makna tersebut secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kesatuan, sering kali sebagai kelompok yang berhimpun. ‘Seluruh umat itu’ mempertahankan cakupan כָּל dan hubungan aposisionalnya dengan ‘orang Israel’.
- source_word: מִדְבַּר צִן
  choice: padang gurun Zin
  rationale: מִדְבָּר adalah kawasan liar atau gersang; ‘padang gurun’ merupakan padanan Indonesia yang lazim dan sesuai dengan latar perjalanan Israel.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: pada bulan pertama
  rationale: Terjemahan langsung dan alami bagi keterangan waktu Ibrani; teks tidak menyebutkan tahunnya.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dengan הָעָם sebagai subjek kolektif, verba ini menyatakan bahwa bangsa itu berdiam atau menetap untuk suatu waktu di Kadesh. ‘Tinggal’ tidak menyiratkan pemukiman permanen.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם di sini menunjuk kepada Israel sebagai kelompok bangsa. ‘Bangsa itu’ juga menghubungkannya dengan seluruh umat yang baru disebut.
- source_word: בְּקָדֵשׁ
  choice: di Kadesh
  rationale: Preposisi lokasi בְּ diterjemahkan secara alami dengan ‘di’.
- source_word: מִרְיָם
  choice: Miryam
  rationale: Nama Ibrani ditransliterasikan dalam bentuk ‘Miryam’, yang dekat dengan pelafalan sumber dan dikenal dalam bahasa Indonesia.
- source_word: וַתָּמָת
  choice: meninggal
  rationale: Menyampaikan secara langsung kematian Miryam tanpa eufemisme tambahan.
- source_word: וַתִּקָּבֵר
  choice: dikuburkan
  rationale: Bentuk pasif Ibrani dipertahankan dan pelaku penguburan tidak ditambahkan karena tidak dinyatakan dalam teks.
- source_word: שָׁם ... שָׁם
  choice: di sana ... di sana
  rationale: Pengulangan dalam bahasa Ibrani dipertahankan untuk mengaitkan baik kematian maupun penguburan Miryam dengan tempat yang sama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan aposisional ‘orang Israel, yaitu seluruh umat itu’ mempertahankan kedua sebutan Ibrani tanpa terasa seperti pengulangan yang tidak disengaja. Pengulangan ‘di sana’ sengaja dipertahankan sesuai teks sumber.
