source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa dan Harun, “Karena kalian tidak percaya kepada-Ku[a] dan tidak mengakui Aku sebagai Yang Kudus[b] di hadapan anak-anak Israel[c], maka kalian tidak akan membawa jemaah ini masuk ke negeri yang telah Kuberikan kepada mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak memercayai-Ku” atau “tidak menaruh kepercayaan kepada-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak memperlakukan Aku sebagai Yang Kudus,” “tidak menguduskan Aku,” atau “tidak menjunjung kekudusan-Ku.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “putra-putra Israel”; ungkapan ini merupakan sebutan kolektif bagi bangsa Israel.
    reason: source_idiom
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang diwakili oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: kalian tidak percaya kepada-Ku
  rationale: Bentuk jamak dan konstruksi dengan ב menyatakan bahwa Musa dan Harun tidak memercayai atau tidak menaruh kepercayaan kepada Yahweh; alternatif maknanya dicatat tanpa mempersempit tuduhan.
- source_word: לְהַקְדִּישֵׁנִי
  choice: menyatakan kekudusan-Ku
  rationale: Hifil קדש dalam konteks publik ini berarti memperlihatkan atau menjunjung Yahweh sebagai kudus. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan dimensi tindakan di hadapan umat.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Mempertahankan idiom Ibrani yang menekankan bahwa kegagalan itu terjadi secara terbuka dan disaksikan umat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Dalam konteks ini ungkapan tersebut merupakan sebutan kolektif bagi bangsa keturunan Israel; 'umat Israel' alami dan tidak membatasi rujukannya hanya pada laki-laki.
- source_word: הַקָּהָל הַזֶּה
  choice: jemaah ini
  rationale: Menyatakan kumpulan umat yang sedang berhimpun tanpa memberi nuansa gerejawi yang tidak diperlukan.
- source_word: תָבִיאוּ
  choice: kalian tidak akan membawa ... masuk
  rationale: Hifil בוא berarti menyebabkan masuk atau membawa masuk. Bentuk ini menyampaikan keputusan ilahi yang tegas kepada dua orang.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Merujuk pada wilayah yang dijanjikan dan diberikan Yahweh kepada Israel; 'negeri' terdengar alami dalam bahasa Indonesia untuk tanah sebagai wilayah.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: yang telah Kuberikan kepada mereka
  rationale: Bentuk perfektif menyajikan pemberian itu sebagai kenyataan yang sudah ditetapkan dan pasti.
theological_decisions:
- issue: Sifat kegagalan Musa dan Harun
  choice: 'Mempertahankan dua unsur tuduhan: tidak percaya kepada Yahweh dan tidak menyatakan kekudusan-Nya di hadapan Israel.'
  alternative: Menafsirkan seluruh kegagalan hanya sebagai ketidaktaatan, kurangnya kepercayaan, atau kegagalan menghormati Allah.
  rationale: Teks sendiri menghubungkan ketidakpercayaan dengan kegagalan memperlihatkan kekudusan Yahweh, tetapi tidak menjelaskan secara rinci bagaimana tindakan mereka mewujudkan kedua hal itu.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel; putra-putra Israel; orang Israel
  rationale: Ini adalah etnonim kolektif bagi bangsa Israel. Pilihan utama menyampaikan cakupan kolektif secara wajar tanpa menghapus hubungan dengan Israel.
- issue: Kepastian pemberian negeri
  choice: yang telah Kuberikan kepada mereka
  alternative: yang akan Kuberikan kepada mereka; yang sedang Kuberikan kepada mereka
  rationale: Perfek Ibrani mempertahankan ketegangan antara negeri yang belum dimasuki dan pemberian ilahi yang dipandang sudah pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak 'kalian' dipakai karena firman ini ditujukan kepada Musa dan Harun sekaligus. Kapitalisasi pada bentuk terikat '-Ku' mengikuti rujukan kepada Yahweh.
