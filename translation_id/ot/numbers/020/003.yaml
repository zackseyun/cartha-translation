  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: id
  text: Lalu bangsa itu bertengkar dengan Musa dan berkata, “Seandainya saja kami mati ketika saudara-saudara kami mati di hadapan Yahweh!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶב
  choice: bertengkar
  rationale: Bentuk dari ריב menyatakan pertikaian atau perselisihan langsung; “bertengkar” mempertahankan daya konfrontatifnya dalam bahasa Indonesia yang wajar.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עַם menunjuk kepada umat Israel secara luas; “bangsa itu” alami dalam konteks narasi dan membedakannya dari istilah teknis untuk jemaah.
- source_word: עִם מֹשֶׁה
  choice: dengan Musa
  rationale: עִם secara langsung berarti “dengan”; konstruksi “bertengkar dengan Musa” sudah menyampaikan sifat permusuhannya tanpa memperkuatnya menjadi “melawan”.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: dan berkata
  rationale: Rumus pengantar ucapan Ibrani ini paling alami diterjemahkan sebagai satu verba dalam bahasa Indonesia; pengulangan “berkata, demikian” akan terasa kaku.
- source_word: וְלוּ
  choice: Seandainya saja
  rationale: Partikel ini mengungkapkan harapan yang tidak terpenuhi sekaligus ratapan; “seandainya saja” menyampaikan nuansa tersebut secara jelas.
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: kami mati ketika ... mati
  rationale: Pengulangan “mati” mempertahankan pengulangan akar גוע, sedangkan בִּגְוַע dipahami sebagai penanda keadaan atau waktu.
- source_word: אַחֵינוּ
  choice: saudara-saudara kami
  rationale: Bentuk Ibraninya maskulin jamak dan menunjuk kepada sesama orang Israel; pilihan ini mempertahankan bentuk sumber tanpa mempersempitnya menjadi saudara kandung.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan/dalam kehadiran,” dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Rujukan אַחֵינוּ
  choice: saudara-saudara kami
  alternative: kaum kerabat kami; saudara-saudari kami
  rationale: Bentuk sumber adalah maskulin jamak. Terjemahan mempertahankan bentuk gramatikal tersebut sambil membiarkan cakupan sosialnya tetap terbuka sesuai konteks.
- issue: Identitas mereka yang mati di hadapan Yahweh
  choice: tidak dijelaskan dalam teks
  alternative: menentukan bahwa mereka adalah kelompok tertentu dari peristiwa sebelumnya
  rationale: Ayat ini hanya menyebut “saudara-saudara kami” dan tidak mengidentifikasi secara eksplisit peristiwa atau kelompok yang dimaksud; ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan akar “mati” yang menonjol dalam bahasa Ibrani. Tidak ada penanda catatan kaki karena tidak diperlukan untuk draf ini.
