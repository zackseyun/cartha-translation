base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: id
  text: Ambillah tongkat itu. Kumpulkanlah umat itu, engkau bersama Harun, saudaramu. Berbicaralah kamu berdua kepada batu karang itu di depan mata mereka[a], dan batu karang itu akan memberikan airnya. Lalu engkau akan mengeluarkan air bagi mereka dari batu karang itu serta memberi minum umat itu dan ternak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di hadapan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: tongkat itu
  rationale: מַטֶּה dapat berarti tongkat atau gada. “Tongkat” paling alami dalam bahasa Indonesia dan sesuai dengan benda yang dibawa Musa dalam konteks narasi.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel yang berkumpul. “Umat” jelas, alami, dan mempertahankan sifat komunal istilah itu.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: Berbicaralah kalian kepada batu karang itu
  rationale: Bentuk verba Ibrani adalah jamak dan mencakup Musa serta Harun. Kata “kalian” mempertahankan peralihan penting dari perintah tunggal kepada Musa ke perintah jamak kepada keduanya.
- source_word: לְעֵינֵיהֶם
  choice: di hadapan mereka
  rationale: Ungkapan ini secara harfiah berarti “di depan mata mereka” dan menekankan bahwa tindakan tersebut harus disaksikan umat. “Di hadapan mereka” lebih alami dalam bahasa Indonesia tanpa menghilangkan unsur kesaksian publik.
- source_word: וְנָתַן מֵימָיו
  choice: maka batu karang itu akan memberikan airnya
  rationale: Batu karang adalah subjek verba tunggal, dan sufiks posesif pada מֵימָיו dipertahankan sebagai “airnya”. Ungkapan “memberikan airnya” juga mempertahankan personifikasi ringan dalam teks Ibrani.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: Lalu engkau harus mengeluarkan air dari batu karang itu bagi mereka
  rationale: Bentuk kausatif verba יצא berarti membuat keluar atau mengeluarkan. Kata ganti “engkau” mempertahankan kembalinya teks kepada bentuk tunggal yang ditujukan kepada Musa.
- source_word: וְהִשְׁקִיתָ
  choice: memberi minum
  rationale: Bentuk kausatif שקה berarti memberi minum atau menyebabkan minum. “Memberi minum” merupakan padanan Indonesia yang alami dan dekat dengan bentuk sumber.
- source_word: בְּעִירָם
  choice: ternak mereka
  rationale: בְּעִיר merujuk pada hewan peliharaan atau hewan ternak. “Ternak” merupakan istilah modern yang luas dan tepat dalam konteks ini.
theological_decisions:
- issue: Sifat publik dari perintah untuk berbicara kepada batu karang
  choice: di hadapan mereka
  alternative: di depan mata mereka
  rationale: Terjemahan mempertahankan penekanan bahwa Musa dan Harun harus berbicara kepada batu karang dengan disaksikan umat, tanpa membuat ungkapan Indonesia terasa kaku.
- issue: Peralihan antara bentuk tunggal dan jamak
  choice: “engkau” untuk Musa dan “kalian” untuk Musa serta Harun
  alternative: Menggunakan bentuk “kamu” tanpa membedakan jumlah
  rationale: Bahasa Ibrani mula-mula memberi perintah tunggal kepada Musa, kemudian memakai verba jamak untuk tindakan berbicara, dan kembali ke bentuk tunggal untuk mengeluarkan air serta memberi minum. Pembedaan ini dipertahankan karena dapat berpengaruh pada pembacaan tanggung jawab para tokoh tanpa menyelesaikan ketegangan naratif secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Engkau” dipakai untuk menjaga kejelasan bentuk tunggal, sedangkan “kalian” menandai bentuk jamak secara eksplisit. Struktur kalimat dibuat lancar bagi pembaca umum sambil mempertahankan urutan perintah dan peralihan jumlah gramatikal dalam bahasa Ibrani.
