source:
  edition: WLC
  text: וַ/יְמָאֵ֣ן אֱד֗וֹם נְתֹן֙ אֶת יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּ/גְבֻל֑/וֹ וַ/יֵּ֥ט יִשְׂרָאֵ֖ל מֵ/עָלָֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: id
  text: Namun, Edom menolak mengizinkan Israel melewati wilayahnya. Karena itu, Israel berbelok menjauhinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: menolak
  rationale: Verba מאן menyatakan penolakan atau ketidaksediaan; “menolak” paling alami dan tepat dalam narasi ini.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama bangsa dipertahankan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: נְתֹן
  choice: mengizinkan
  rationale: Dalam rangkaian dengan מאן, נתן berfungsi idiomatis dengan arti memberi izin; “menolak mengizinkan” menyampaikan maknanya secara alami.
- source_word: עֲבֹר
  choice: melewati
  rationale: עבר dalam konteks perjalanan melalui suatu kawasan menunjuk pada tindakan melintas atau lewat.
- source_word: בִּגְבֻלוֹ
  choice: wilayahnya
  rationale: גְּבוּל dapat berarti batas atau wilayah; konteks permintaan untuk melintas mendukung arti “wilayah,” sedangkan pronomina tunggal sumber dipertahankan dengan “-nya.”
- source_word: וַיֵּט
  choice: berbelok
  rationale: נטה berarti beralih arah atau menyimpang dari jalur; “berbelok” menggambarkan perubahan rute Israel secara alami.
- source_word: מֵעָלָיו
  choice: menjauhinya
  rationale: Frasa ini menyatakan gerakan menjauh dari Edom; digabungkan secara idiomatis dengan verba menjadi “berbelok menjauhinya.”
