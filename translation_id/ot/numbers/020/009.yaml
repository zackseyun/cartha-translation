  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: id
  text: Maka Musa mengambil tongkat itu[a] dari hadapan Yahweh, tepat seperti yang diperintahkan-Nya kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “batang itu.”
    reason: מַטֶּה dapat menunjuk pada tongkat atau batang; catatan ini mempertahankan alternatif leksikal tanpa mengaburkan arti utama dalam konteks.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk wayyiqtol Qal dari לקח menyatakan tindakan naratif lampau yang sederhana; “mengambil” merupakan padanan Indonesia yang alami tanpa menambahkan nuansa mengangkat atau menerima.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: הַמַּטֶּה
  choice: tongkat itu
  rationale: מַטֶּה dalam konteks ini menunjuk pada benda fisik yang diambil Musa. “Tongkat” paling alami dalam bahasa Indonesia; artikel tertentu Ibrani dinyatakan dengan “itu” karena tongkat tersebut sudah diketahui dari konteks.
- source_word: מִלִּפְנֵי
  choice: dari hadapan
  rationale: Ungkapan ini mempertahankan gambaran ruang yang konkret dalam bahasa Ibrani sekaligus sesuai dengan latar peribadatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Frasa ini menyatakan kesesuaian tindakan Musa dengan perintah sebelumnya; “tepat seperti” menyampaikan kecocokan tersebut secara alami.
- source_word: צִוָּהוּ
  choice: yang diperintahkan-Nya kepadanya
  rationale: Bentuk verba menyatakan bahwa subjek laki-laki tunggal telah memerintah Musa. Akhiran “-Nya” merujuk pada Yahweh, sedangkan “kepadanya” merujuk pada Musa; susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan pelaku-sasaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehova” mencerminkan bentuk pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Maka” menjaga kesinambungan naratif, sedangkan “dari hadapan” mempertahankan corak spasial dan kultis teks Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskannya.
