  text: Mereka berangkat dari Refidim dan berkemah di padang belantara Sinai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan, verba נסע menyatakan keberangkatan dari satu tempat persinggahan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan gagasan bergerak meninggalkan tempat itu.
- source_word: מֵרְפִידִם
  choice: dari Refidim
  rationale: Preposisi מ menandai asal. Nama tempat רְפִידִם ditransliterasikan menurut bentuk Indonesia yang lazim, 'Refidim'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam konteks perjalanan di padang belantara berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan modern yang konkret; 'lalu' secara alami menyampaikan urutan naratif dari waw konsekutif.
- source_word: בְּמִדְבַּר סִינָי
  choice: di Padang Belantara Sinai
  rationale: מִדְבָּר menunjuk kawasan liar yang jarang dihuni dan tidak selalu semata-mata gurun pasir. 'Padang belantara' menghindari pembatasan pada medan yang sepenuhnya tandus. Hubungan konstruksi dengan סִינָי dinyatakan secara alami sebagai nama geografis 'Padang Belantara Sinai'.
