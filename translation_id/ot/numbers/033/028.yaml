  text: They set out from Terah and camped at Mithkah.
translation:
  language: id
  text: Mereka berangkat dari Tarah dan berkemah di Mitka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari suatu tempat persinggahan. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan urutan perjalanan.
- source_word: מִתָּרַח
  choice: dari Terah
  rationale: Prefiks מִן menyatakan asal atau titik keberangkatan. תָּרַח adalah nama tempat dan ditransliterasikan sebagai “Terah”.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam konteks daftar perjalanan berarti berhenti dan mendirikan perkemahan. “Berkemah” mempertahankan gambaran konkret itu; “lalu” secara alami menyatakan kelanjutan urutan yang ditandai waw konsekutif.
- source_word: בְּמִתְקָה
  choice: di Mitka
  rationale: Prefiks בְּ menandai lokasi. Dalam bahasa Indonesia, “di” merupakan preposisi lokasi yang wajar untuk tempat perkemahan. מִתְקָה ditransliterasikan sebagai “Mitka” sesuai pelafalan Ibrani yang mendekati bentuk tersebut.
