  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: id
  text: Mereka berangkat dari Mara dan tiba di Elim. Di Elim terdapat dua belas mata air dan tujuh puluh pohon kurma, lalu mereka berkemah di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan, verba נסע menyatakan tindakan membongkar perkemahan lalu melanjutkan perjalanan; 'berangkat' alami dalam bahasa Indonesia dan mempertahankan urutan perjalanan.
- source_word: מִמָּרָה
  choice: dari Mara
  rationale: Nama tempat ditransliterasikan; preposisi מִן menyatakan titik asal.
- source_word: וַיָּבֹאוּ
  choice: dan tiba
  rationale: בוא dapat berarti datang atau tiba. Dalam catatan rute, 'tiba' secara alami menyatakan tercapainya tujuan tanpa menambah informasi.
- source_word: אֵילִמָה / בְאֵילִם
  choice: di Elim / Di Elim
  rationale: Bentuk berakhiran ה pertama menunjukkan arah menuju Elim, tetapi bersama 'tiba' bahasa Indonesia secara idiomatis memakai 'di'; frasa kedua juga menunjukkan lokasi. Nama tempat ditransliterasikan.
- source_word: שְׁתֵּים עֶשְׂרֵה עֵינֹת מַיִם
  choice: dua belas mata air
  rationale: עַיִן dalam konteks sumber air berarti mata air alami; ungkapan Indonesia 'mata air' sudah mencakup unsur מַיִם dan tidak perlu diterjemahkan secara kaku sebagai 'mata air air'.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: dan tujuh puluh pohon kurma
  rationale: תָּמָר menunjuk pohon palem, lazimnya pohon kurma. 'Pohon kurma' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: וַיַּחֲנוּ שָׁם
  choice: lalu mereka berkemah di sana
  rationale: חנה dalam catatan perjalanan berarti mendirikan perkemahan. 'Berkemah' adalah ungkapan modern yang alami; 'lalu' menyampaikan kelanjutan naratif waw.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur catatan perjalanan dipertahankan, dengan pengulangan 'Elim' mengikuti teks sumber. Tidak diperlukan catatan kaki karena tidak ada ambiguitas penting yang perlu ditampilkan kepada pembaca.
