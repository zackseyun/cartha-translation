  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: id
  text: Mereka berangkat dari Kadesh[a], lalu berkemah di Gunung Hor[b], di tepi tanah Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Kadesh”; berdasarkan konteks yang lebih luas, beberapa terjemahan menuliskannya “Kadesh-Barnea,” tetapi nama yang tercantum di ayat ini hanya “Kadesh.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi “di Hor, gunung itu”; secara lazim diterjemahkan “Gunung Hor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan perjalanan di padang gurun, נסע menunjuk pada tindakan meninggalkan tempat perkemahan. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan urutan perjalanan.
- source_word: מִקָּדֵשׁ
  choice: dari Kadesh
  rationale: Teks Ibrani hanya menyebut קָדֵשׁ, sehingga nama tempat itu tidak diperluas menjadi “Kadesh-Barnea”.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה adalah verba konkret untuk mendirikan atau menempati perkemahan. “Berkemah” merupakan padanan Indonesia yang langsung dan wajar; “lalu” menyampaikan kelanjutan naratif waw-consecutive.
- source_word: בְּהֹר הָהָר
  choice: di Gunung Hor
  rationale: Secara harfiah susunannya “di Hor, gunung itu,” tetapi “Gunung Hor” adalah bentuk nama tempat yang alami dan lazim dalam bahasa Indonesia.
- source_word: בִּקְצֵה
  choice: di tepi
  rationale: קצה berarti ujung, tepi, atau bagian terluar. “Di tepi” mempertahankan gambaran spasial tanpa memastikan bahwa yang dimaksud harus berupa perbatasan politis.
- source_word: אֶרֶץ אֱדֹם
  choice: tanah Edom
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. “Tanah Edom” merupakan padanan ringkas dan langsung yang sesuai dengan konteks geografis.
