  source_fidelity: 'Revisi diperlukan untuk memilih “tanah” bagi הָאָרֶץ. Dalam ayat ini אֶרֶץ menunjuk wilayah tanah perjanjian; “tanah itu” lebih langsung dan konsisten dengan rujukan tersebut daripada “negeri itu,” yang dalam pemakaian Indonesia modern dapat terutama merujuk pada negara. “Menduduki” bagi וְהוֹרַשְׁתֶּם tetap dapat dipertahankan: dengan objek “tanah,” bentuk Hifil ini menyatakan pengambilalihan/penguasaan atas tanah itu, dalam konteks yang lebih luas mencakup penyingkiran penduduk sebelumnya. “Menetap di sana” menangkap וִישַׁבְתֶּם בָּהּ dengan baik. Pemberian yang telah dilakukan/ditetapkan dalam נָתַתִּי dipertahankan oleh “telah memberikan.”'
