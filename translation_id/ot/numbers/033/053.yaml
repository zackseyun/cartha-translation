  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: id
  text: Kalian harus menduduki tanah itu dan menetap di sana, sebab Aku telah memberikan tanah itu kepada kalian untuk memilikinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mewarisinya.” Kata Ibrani ירשׁ dapat berarti memiliki atau mengambil alih; dalam konteks janji perjanjian, kata ini juga dapat berarti mewarisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Kamu harus menduduki
  rationale: Bentuk Hifil dari ירשׁ diikuti objek langsung 'negeri'. Dalam konteks ini, verba tersebut menyatakan pengambilalihan negeri hingga menjadi tempat tinggal Israel. 'Menduduki' menyampaikan penguasaan nyata tanpa memberi kesan janggal bahwa negerinya sendiri diusir.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: אֶרֶץ menunjuk pada wilayah yang dijanjikan. 'Negeri itu' merupakan ungkapan Indonesia yang alami dan cukup jelas dalam konteks tersebut.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: dan tinggal di sana
  rationale: ישׁב menyatakan tinggal atau menetap. 'Tinggal di sana' alami dalam bahasa Indonesia modern dan menunjukkan bahwa negeri itu benar-benar dihuni.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi perintah sebelumnya. 'Sebab' mempertahankan hubungan kausal dalam ragam yang wajar dan bermartabat.
- source_word: לָכֶם
  choice: kepadamu
  rationale: Preposisi ל menandai Israel sebagai penerima pemberian ilahi. Bentuk tunggal kolektif 'kamu' mengikuti sapaan Ibrani jamak kepada umat sebagai satu kelompok dan terasa alami dalam kalimat ini.
- source_word: נָתַתִּי
  choice: Aku telah memberikan
  rationale: Bentuk perfektum menggambarkan pemberian Allah sebagai tindakan yang sudah ditetapkan atau diselesaikan dan menjadi dasar perintah. 'Telah memberikan' mempertahankan aspek tersebut.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: untuk kamu miliki
  rationale: Infinitif ירשׁ menyatakan tujuan pemberian negeri itu. 'Untuk kamu miliki' ringkas dan alami, serta mempertahankan gagasan kepemilikan/penguasaan; nuansa 'mewarisi' dicatat sebagai alternatif.
theological_decisions:
- issue: Makna ירשׁ dalam konteks janji mengenai negeri
  choice: menduduki / miliki
  alternative: mewarisi; menghalau penduduk lalu menduduki
  rationale: Konteks terdekat menekankan penguasaan dan penghunian nyata atas negeri yang Allah berikan. Namun, ירשׁ juga dapat bernuansa menerima sebagai warisan dalam konteks perjanjian; kemungkinan itu dipertahankan dalam catatan kaki dan tidak dijadikan satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Menduduki' dipilih daripada 'mengusir negeri itu' karena objek verba adalah negeri, bukan penduduknya. Pronomina 'Aku' merujuk kepada Allah dan ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
