  yaml_path: translation/ot/numbers/033/013.yaml
  text: They set out from Dophkah and camped at Alush.
translation:
  language: id
  text: Mereka berangkat dari Dofka, lalu berkemah di Alus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע menyatakan meninggalkan tempat perkemahan untuk meneruskan perjalanan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan nuansa gerak.
- source_word: מִדָּפְקָה
  choice: dari Dofka
  rationale: Prefiks מִן menyatakan asal, yaitu 'dari'. Nama tempat דָּפְקָה dialihaksarakan menjadi 'Dofka' sesuai bentuk Ibrani dan kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam daftar perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' jelas dan wajar; 'lalu' mengungkapkan urutan naratif yang dibawa oleh waw konsekutif tanpa membuat hubungan itu terlalu berat.
- source_word: בְּאָלוּשׁ
  choice: di Alus
  rationale: Preposisi בְּ menandai lokasi. 'Di' merupakan padanan Indonesia yang alami, sedangkan nama אָלוּשׁ dialihaksarakan menjadi 'Alus'.
