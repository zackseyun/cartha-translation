base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: id
  text: Mereka berangkat dari Moserot, lalu berkemah di Bene-Yaakan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, Bene-Yaakan secara harfiah berarti “anak-anak Yaakan”, tetapi di sini ungkapan itu berfungsi sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, נסע berarti membongkar perkemahan dan mulai bergerak. 'Berangkat' alami dalam bahasa Indonesia modern dan sesuai dengan pola berulang dalam Bilangan 33.
- source_word: מִמֹּסֵרֹות
  choice: dari Moserot
  rationale: Preposisi מִן diterjemahkan 'dari'. Nama tempat מֹסֵרוֹת ditransliterasikan sebagai 'Moserot', dengan akhiran Ibrani -ot dipertahankan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata חנה dalam konteks daftar perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan Indonesia modern yang jelas; 'lalu' menyampaikan urutan tindakan yang dinyatakan oleh waw berurutan secara alami.
- source_word: בִּבְנֵי יַעֲקָן
  choice: di Bene-Yaakan
  rationale: Walaupun secara harfiah berarti 'anak-anak Yaakan', frasa ini berfungsi sebagai nama tempat dalam daftar perjalanan. Preposisi ב diterjemahkan secara idiomatis sebagai 'di', dan nama tempat ditransliterasikan.
