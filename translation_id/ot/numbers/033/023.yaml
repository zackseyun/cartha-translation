  yaml_path: translation/ot/numbers/033/023.yaml
  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: id
  text: Mereka berangkat dari Kehelata, lalu berkemah di Gunung Syafer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam daftar perjalanan, bentuk dari נסע menyatakan tindakan membongkar perkemahan dan mulai bergerak. 'Berangkat' alami dalam bahasa Indonesia modern dan sesuai dengan rumus perjalanan yang berulang.
- source_word: מִקְּהֵלָתָה
  choice: dari Kehelata
  rationale: Nama tempat קְהֵלָתָה ditransliterasikan sebagai 'Kehelata', sedangkan prefiks מִן diterjemahkan 'dari'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata חנה dalam rangkaian persinggahan berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan Indonesia yang ringkas dan wajar; 'lalu' memperjelas urutan tindakan yang dinyatakan bentuk naratif Ibrani.
- source_word: בְּהַר
  choice: di Gunung
  rationale: Dalam konteks nama sebuah tempat persinggahan, הַר diikuti nama diri paling wajar diterjemahkan 'Gunung', dan preposisi בְּ diterjemahkan 'di'.
- source_word: שָׁפֶר
  choice: Sefer
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Masoret שָׁפֶר (šāfer) menurut ejaan Indonesia, dengan 'sy' tidak diperlukan karena konsonannya adalah שׁ /sy/; namun konvensi Indonesia lazim menulis bunyi tersebut 'sy'. Bentuk 'Sefer' dipilih agar sederhana, sedangkan bentuk yang lebih eksplisit secara fonetis dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumus perjalanan dipertahankan secara ringkas. Nama-nama tempat ditransliterasikan, bukan diterjemahkan.
