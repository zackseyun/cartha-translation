  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: id
  text: Mereka berangkat dari Pegunungan Abarim, lalu berkemah di dataran Moab[a], di tepi Sungai Yordan dekat Yerikho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di padang stepa Moab.” Istilah Ibrani ini dapat menunjuk pada tanah stepa atau dataran terbuka.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tepi Sungai Yordan, di seberang Yerikho.” Frasa Ibraninya ringkas; sebagian terjemahan memahaminya secara lebih khusus sebagai wilayah yang berhadapan dengan Yerikho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan daftar perjalanan, נסע menunjuk pada tindakan membongkar perkemahan dan bergerak menuju tempat berikutnya. “Berangkat” alami dalam bahasa Indonesia modern.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: dari Pegunungan Abarim
  rationale: הָרֵי adalah bentuk jamak konstruksi dari הַר, yakni gunung atau perbukitan. “Pegunungan Abarim” menyampaikan bentang geografis sekaligus mempertahankan nama tempat.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה dalam daftar perjalanan berarti mendirikan atau menempati perkemahan. “Berkemah” jelas dan wajar; “lalu” menandai urutan tindakan yang dinyatakan oleh waw konsekutif.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עֲרָבוֹת dapat menunjuk pada tanah datar terbuka atau stepa. “Dataran” paling mudah dipahami dalam konteks geografis ini tanpa menutup alternatif “padang stepa” yang dicatat dalam catatan kaki.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: di tepi Sungai Yordan dekat Yerikho
  rationale: עַל bersama nama sungai menyatakan lokasi di tepi atau sepanjang sungai. Hubungan יְרֵחוֹ dengan frasa itu padat dan dapat dipahami sebagai kawasan Yerikho; “dekat Yerikho” menghasilkan bahasa Indonesia yang alami sambil mempertahankan kemungkinan “di seberang Yerikho” dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif perjalanan yang ringkas dan bermartabat. Nama geografis ditransliterasikan dalam bentuk Indonesia yang lazim: Abarim, Moab, Yordan, dan Yerikho. Kata “Sungai” ditambahkan untuk memperjelas Yordan bagi pembaca umum.'
