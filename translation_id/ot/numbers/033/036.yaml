  yaml_path: translation/ot/numbers/033/036.yaml
  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: id
  text: Mereka berangkat dari Ezion-Geber, lalu berkemah di padang belantara Zin, yaitu[a] Kadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang adalah Kadesh.” Kata ganti Ibrani itu mengidentifikasi lokasi tersebut dengan Kadesh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rangkaian catatan perjalanan, נסע menunjuk pada tindakan membongkar perkemahan dan melanjutkan perjalanan. 'Berangkat' alami dan ringkas dalam bahasa Indonesia.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: dari Ezion-Geber
  rationale: Nama tempat ditransliterasikan; tanda hubung mempertahankan bentuk nama majemuk yang lazim dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה berarti mendirikan atau menempati perkemahan. 'Berkemah' menyampaikan tindakan konkret itu dalam bahasa Indonesia modern; 'lalu' menandai urutan perjalanan secara alami.
- source_word: בְמִדְבַּר צִן
  choice: di Padang Belantara Zin
  rationale: מִדְבָּר menunjuk wilayah liar atau tandus, tidak selalu gurun pasir. 'Padang belantara' menjaga cakupan geografisnya tanpa mempersempit jenis medannya.
- source_word: הִוא
  choice: yaitu
  rationale: Pronomina feminin ini berfungsi mengidentifikasi tempat yang baru disebut. 'Yaitu' menyampaikan fungsi aposisional tersebut, sementara catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
- source_word: קָדֵשׁ
  choice: Kadesh
  rationale: Nama tempat ditransliterasikan tanpa diterjemahkan.
