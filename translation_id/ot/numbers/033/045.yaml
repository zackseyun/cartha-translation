base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/045.yaml
  text: They set out from Iyyim and camped at Dibon-gad[a][b].
translation:
  language: id
  text: Mereka berangkat dari Iyim, lalu berkemah di Dibon-Gad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di Bilangan, verba נסע menunjuk pada keberangkatan dari tempat perkemahan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan nuansa perpindahan.
- source_word: מֵעִיִּים
  choice: dari Iyim
  rationale: Prefiks מֵ diterjemahkan 'dari'. Nama tempat עִיִּים ditransliterasikan sebagai 'Iyim', bentuk yang wajar dalam ejaan Indonesia dan tetap mencerminkan konsonan yod.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam catatan perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' jelas dan alami; 'lalu' menyampaikan urutan naratif dari waw konsekutif tanpa membuat hubungan lebih kuat daripada teks.
- source_word: בְּדִיבֹן גָּד
  choice: di Dibon-Gad
  rationale: Preposisi בְּ dengan nama tempat secara alami diterjemahkan 'di'. דִיבֹן גָּד dipertahankan sebagai satu nama tempat majemuk, 'Dibon-Gad', bukan diuraikan sebagai frasa kepunyaan.
