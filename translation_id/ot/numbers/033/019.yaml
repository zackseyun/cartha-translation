base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: id
  text: Mereka berangkat dari Ritma, lalu berkemah di Rimon-Peres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע berarti membongkar perkemahan dan mulai bergerak. "Berangkat" merupakan padanan Indonesia modern yang alami dan ringkas.
- source_word: מֵרִתְמָה
  choice: dari Ritma
  rationale: Prefiks מִן menyatakan titik asal, sehingga diterjemahkan "dari". Nama tempat רִתְמָה ditransliterasikan sebagai "Ritma" sesuai pelafalan yang wajar dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה adalah istilah baku dalam daftar perjalanan untuk mendirikan atau menempati perkemahan. "Berkemah" jelas dan alami; "lalu" menyatakan urutan naratif dari waw konsekutif tanpa membuat hubungan yang lebih kuat daripada teks.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: di Rimon-Peres
  rationale: Prefiks בְּ menyatakan lokasi dan secara alami diterjemahkan "di". Nama majemuk רִמֹּן פָּרֶץ ditransliterasikan sebagai "Rimon-Peres" dan diberi tanda hubung untuk menunjukkan satu nama tempat yang terdiri dari dua unsur.
