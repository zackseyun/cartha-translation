  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur ringkas mempertahankan pola berulang daftar perjalanan dalam Bilangan 33. Tidak diperlukan catatan kaki karena alternatif seperti "melanjutkan perjalanan" atau "mendirikan kemah" tidak membawa perbedaan makna penting dalam bahasa Indonesia.
