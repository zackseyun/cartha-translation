  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: id
  text: Kalian harus mengusir semua penduduk negeri itu dari hadapan kalian. Kalian harus memusnahkan semua batu-batu bergambar mereka[a], menghancurkan semua patung-patung tuangan mereka[b], dan merobohkan semua tempat-tempat pemujaan mereka di tempat tinggi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua patung ukiran mereka.” Kata Ibrani מַשְׂכִּיּוֹת menunjuk kepada representasi bergambar; bentuk dan bahan tepatnya diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua patung logam tuangan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Kamu harus mengusir
  rationale: Bentuk Hifil dari ירשׁ di sini menyatakan menyebabkan para penghuni tersingkir atau kehilangan penguasaan atas negeri itu. 'Mengusir' alami dalam bahasa Indonesia dan tidak memperlemah perintah.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: semua penduduk negeri itu
  rationale: Konstruksi partisipial menunjuk kepada semua orang yang mendiami negeri tersebut; 'penduduk' ringkas dan lazim.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapanmu
  rationale: Mempertahankan citra ungkapan Ibrani sambil tetap wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: וְאִבַּדְתֶּם
  choice: Kamu harus memusnahkan
  rationale: Bentuk Piel dari אבד menyatakan penghancuran benda-benda kultis. 'Memusnahkan' menyampaikan penghilangan menyeluruh.
- source_word: מַשְׂכִּיֹּתָם
  choice: semua batu bergambar mereka
  rationale: Istilah ini menunjuk kepada representasi bergambar atau berukir, kemungkinan pada batu, tetapi bentuk dan bahannya tidak sepenuhnya pasti. Terjemahan konkret dipakai dengan catatan alternatif.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: semua patung tuangan mereka
  rationale: צֶלֶם adalah patung atau gambar, sedangkan מַסֵּכָה menunjukkan benda yang dibuat dengan menuang bahan cair, lazimnya logam. 'Patung tuangan' alami dan mempertahankan cara pembuatannya.
- source_word: תְּאַבֵּדוּ
  choice: menghancurkan
  rationale: Pengulangan akar אבד tetap tercermin melalui verba penghancuran, dengan variasi Indonesia yang menghindari susunan kaku tanpa mengurangi daya perintah.
- source_word: בָּמֹתָם
  choice: semua bukit pemujaan mereka
  rationale: בָּמוֹת adalah tempat kultis, sering berada di tempat tinggi. 'Bukit pemujaan' lebih langsung dipahami pembaca Indonesia daripada terjemahan harfiah 'tempat-tempat tinggi'.
- source_word: תַּשְׁמִידוּ
  choice: merobohkan
  rationale: Bentuk Hifil dari שׁמד diterapkan pada situs kultis; 'merobohkan' cocok bagi tempat atau bangunan dan menyatakan penghancuran fisik.
theological_decisions:
- issue: Perintah mengenai penduduk Kanaan dan sarana pemujaan mereka
  choice: Menerjemahkan secara langsung sebagai perintah untuk mengusir para penduduk serta memusnahkan benda dan tempat pemujaan mereka.
  alternative: Memperlemah verba pertama menjadi hanya 'mencabut hak milik' atau menggeneralisasi istilah kultis sebagai 'praktik penyembahan berhala'.
  rationale: Teks Ibrani secara eksplisit memerintahkan penyingkiran para penduduk dan penghancuran benda serta situs kultis tertentu. Terjemahan tidak melunakkan kerasnya perintah maupun menambahkan pembenaran teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak Ibrani diterjemahkan dengan 'kamu' yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak; konteks menunjukkan umat secara kolektif. Struktur perintah dibuat tegas, sedangkan istilah kultis dijelaskan secara cukup konkret tanpa memasukkan terminologi denominasi tertentu.
