  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: id
  text: Mereka berangkat dari Dibon-Gad, lalu berkemah di Almon-Diblataim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di Bilangan 33, נסע menunjuk pada tindakan membongkar perkemahan dan mulai bergerak menuju tempat berikutnya. “Berangkat” alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִדִּיבֹן גָּד
  choice: dari Dibon-Gad
  rationale: מִן menyatakan titik asal dan diterjemahkan “dari”. Nama tempat ditransliterasikan, sedangkan tanda hubung menyajikan rangkaian itu sebagai satu nama majemuk tanpa menafsirkannya menjadi “Dibon milik Gad”.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה dalam konteks perjalanan berarti mendirikan atau menempati perkemahan. “Berkemah” merupakan padanan modern yang alami; “lalu” mengungkapkan urutan naratif waw tanpa membuat hubungan yang lebih kuat daripada teks sumber.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: di Almon-Diblataim
  rationale: Prefiks ב menandai lokasi dan diterjemahkan “di”. Akhiran arah -ָה pada nama tempat, bersama konteks verba חנה, tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia. Nama tempat ditransliterasikan sebagai satu toponim majemuk.
