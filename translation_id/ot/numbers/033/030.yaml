  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: id
  text: Mereka berangkat dari Hasmona, lalu berkemah di Moserot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di padang gurun, נסע menyatakan keberangkatan dari suatu tempat persinggahan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan urutan perjalanan.
- source_word: מֵחַשְׁמֹנָה
  choice: dari Hasmona
  rationale: Prefiks מֵ diterjemahkan 'dari'. חַשְׁמֹנָה adalah nama tempat dan ditransliterasikan sebagai 'Hasmona' menurut kaidah ejaan Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Dalam konteks daftar perjalanan, חנה berarti mendirikan atau menetap di perkemahan. 'Berkemah' merupakan padanan modern yang konkret; 'lalu' mengungkapkan urutan naratif waw beruntun secara alami.
- source_word: בְּמֹסֵרוֹת
  choice: di Moserot
  rationale: Prefiks בְּ pada tempat persinggahan secara alami diterjemahkan 'di'. מֹסֵרוֹת adalah nama tempat dan ditransliterasikan sebagai 'Moserot'.
