base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/014.yaml
  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: id
  text: Mereka berangkat dari Alus, lalu berkemah di Refidim. Namun, di sana tidak ada air untuk diminum oleh bangsa itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע menunjuk pada tindakan membongkar perkemahan dan melanjutkan perjalanan. “Berangkat” alami dalam bahasa Indonesia modern.
- source_word: מֵאָלוּשׁ
  choice: dari Alus
  rationale: Nama tempat dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה berarti mendirikan atau menempati perkemahan. “Berkemah” merupakan padanan modern yang jelas; “lalu” menyampaikan urutan naratif dari waw konsekutif.
- source_word: בִּרְפִידִם
  choice: di Refidim
  rationale: Nama tempat dialihaksarakan; preposisi בְּ secara wajar diterjemahkan “di” untuk lokasi perkemahan.
- source_word: וְלֹא הָיָה שָׁם
  choice: Namun, di sana tidak ada
  rationale: Waw memperkenalkan keadaan yang berlawanan dengan harapan sesudah mereka berkemah. “Namun” menyatakan hubungan adversatif itu tanpa menambahkan sebab.
- source_word: מַיִם
  choice: air
  rationale: Padanan langsung dan lazim bagi מַיִם.
- source_word: לָעָם
  choice: oleh bangsa itu
  rationale: עָם menunjuk kepada umat Israel secara kolektif. Dalam konstruksi Indonesia “air untuk diminum oleh bangsa itu,” bentuk ini mempertahankan hubungan antara air, tindakan minum, dan pelakunya.
- source_word: לִשְׁתּוֹת
  choice: untuk diminum
  rationale: 'Infinitif לִשְׁתּוֹת menyatakan kegunaan atau tujuan: air yang dapat diminum oleh bangsa itu.'
