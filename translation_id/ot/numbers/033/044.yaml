base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: id
  text: Mereka berangkat dari Obot, lalu berkemah di Iye-Abarim[a], di perbatasan Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Iye-Haabarim”; nama Ibrani ini mungkin berkaitan dengan kata yang berarti “reruntuhan” dan “Abarim/daerah-daerah di seberang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע menunjuk pada tindakan membongkar perkemahan lalu melanjutkan perjalanan; “berangkat” menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: מֵאֹבֹת
  choice: dari Obot
  rationale: Prefiks מֵ menandai asal, sedangkan אֹבֹת adalah nama tempat; bentuk “Obot” mengikuti transliterasi yang wajar dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה adalah istilah lazim untuk mendirikan atau menempati perkemahan. “Lalu” menyatakan urutan naratif waw-konsekutif dengan alami.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: di Iye-Abarim
  rationale: Ungkapan ini berfungsi sebagai nama tempat dalam daftar perjalanan. Transliterasi mempertahankan nama itu tanpa memastikan arti etimologis unsur-unsurnya.
- source_word: בִּגְבוּל
  choice: di perbatasan
  rationale: גְּבוּל dapat berarti batas, daerah perbatasan, atau wilayah. Dalam catatan lokasi ini, “di perbatasan” mempertahankan makna lokatif tanpa menyatakan bahwa tempat itu berada jauh di dalam wilayah Moab.
- source_word: מוֹאָב
  choice: Moab
  rationale: Bentuk baku nama tempat dan bangsa ini dalam bahasa Indonesia.
theological_decisions: []
