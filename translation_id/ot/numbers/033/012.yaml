  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: id
  text: Mereka berangkat dari Padang Gurun Sin dan berkemah di Dofka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע berarti membongkar perkemahan lalu melanjutkan perjalanan; “berangkat” menyampaikan makna itu secara alami dan ringkas dalam bahasa Indonesia.
- source_word: מִמִּדְבַּר
  choice: dari Padang Gurun
  rationale: מִדְבָּר menunjuk pada wilayah liar atau gersang. “Padang Gurun” merupakan padanan yang jelas dan lazim untuk nama kawasan dalam kisah perjalanan Israel.
- source_word: סִין
  choice: Sin
  rationale: Ini adalah nama tempat, sehingga dialihaksarakan dan tidak diterjemahkan.
- source_word: וַיַּחֲנוּ
  choice: dan berkemah
  rationale: Verba חנה adalah istilah baku dalam rangkaian perjalanan untuk mendirikan atau menempati perkemahan; “berkemah” alami dalam bahasa Indonesia modern.
- source_word: בְּדָפְקָה
  choice: di Dofka
  rationale: Preposisi ב menandai lokasi. “Di” merupakan padanan idiomatis dalam bahasa Indonesia, sedangkan דָפְקָה dialihaksarakan sebagai Dofka.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dua tindakan berurutan dalam rumus perjalanan Ibrani dipertahankan. Kapitalisasi “Padang Gurun Sin” menandai nama geografis; tidak diperlukan catatan tentang homonimi bahasa Inggris karena dalam bahasa Indonesia nama Sin tidak menyerupai kata umum untuk dosa.
