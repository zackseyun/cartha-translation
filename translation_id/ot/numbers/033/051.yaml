  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: id
  text: Berbicaralah kepada orang Israel dan katakanlah kepada mereka, ‘Ketika kalian menyeberangi Sungai Yordan ke tanah Kanaan,’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Bentuk imperatif piel dari דבר menyampaikan perintah langsung untuk berbicara; pilihan ini juga mempertahankan pembedaan dengan verba אמר yang menyusul.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini menunjuk kepada umat Israel secara kolektif; 'orang Israel' merupakan padanan Indonesia yang alami dan inklusif tanpa mengubah acuannya.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakan kepada mereka
  rationale: Mempertahankan verba kedua אמר beserta objek tak langsungnya, alih-alih meleburkannya dengan perintah sebelumnya.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Ketika kalian menyeberangi
  rationale: Dalam konteks instruksi yang akan berlaku saat penyeberangan, כִּי bersama pronomina dan partisip menyatakan keadaan yang segera akan terjadi. Klausa temporal ini alami dalam bahasa Indonesia dan tidak memaksakan aspek progresif.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama הַיַּרְדֵּן merujuk pada sungai; penambahan jenis geografis 'Sungai' membuat acuannya jelas dan idiomatis dalam bahasa Indonesia.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: untuk masuk ke tanah Kanaan
  rationale: Konstruksi ini menyatakan arah menuju sekaligus masuk ke wilayah Kanaan; 'untuk masuk ke' menghubungkan penyeberangan sungai dengan tujuannya secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina jamak 'kalian' dipakai untuk membedakan אַתֶּם yang jamak dari 'Anda/kamu' yang dapat dipahami tunggal. Kutipan dibiarkan terbuka karena kalimat langsung berlanjut ke ayat berikutnya.
