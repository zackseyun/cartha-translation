  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: id
  text: Inilah tahap-tahap perjalanan orang Israel[a] yang keluar dari tanah Mesir menurut kelompok-kelompok mereka[b], di bawah pimpinan Musa dan Harun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dalam konteks ini maksudnya orang Israel atau bangsa Israel.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menurut bala tentara mereka” atau “menurut pasukan mereka.” Kata Ibraninya menggambarkan susunan yang teratur dan dapat bernuansa militer.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dengan perantaraan tangan Musa dan Harun,” yaitu melalui pengarahan atau kepemimpinan mereka.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Pembukaan demonstratif yang wajar dalam bahasa Indonesia untuk memperkenalkan daftar yang menyusul.
- source_word: מַסְעֵי
  choice: tahap-tahap perjalanan
  rationale: Bentuk ini menyampaikan rangkaian tahap atau tempat keberangkatan dalam suatu rute perjalanan, bukan sejumlah perjalanan yang tidak berkaitan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam konteks kebangsaan kolektif, ungkapan Ibrani ini secara alami berarti bangsa atau orang Israel; pilihan ini lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'anak-anak lelaki Israel'.
- source_word: אֲשֶׁר יָצְאוּ
  choice: yang keluar
  rationale: Klausa relatif ini menerangkan orang Israel dan mempertahankan makna dasar verba יצא.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Mempertahankan unsur eksplisit אֶרֶץ, 'tanah/negeri', dengan ungkapan Indonesia yang jelas.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: Menjaga nuansa kelompok yang teratur dan bernuansa militer dalam צָבָא tanpa menyatakan bahwa mereka sedang bertempur.
- source_word: בְּיַד
  choice: di bawah pimpinan
  rationale: Mengungkapkan idiom Ibrani tentang perantaraan, pengarahan, atau kepemimpinan secara alami dalam bahasa Indonesia.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
