base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: id
  text: Mereka berangkat dari Sukot dan berkemah di Etam, yang terletak di tepi padang gurun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam daftar perjalanan, verba נסע menyatakan tindakan meninggalkan tempat untuk melanjutkan perjalanan. 'Berangkat' alami dalam bahasa Indonesia modern.
- source_word: מִסֻּכֹּת
  choice: dari Sukot
  rationale: Nama tempat ditransliterasikan dari bentuk Ibrani סֻכּוֹת dengan ejaan Indonesia yang wajar.
- source_word: וַיַּחֲנוּ
  choice: dan berkemah
  rationale: Verba חנה berarti mendirikan atau menempati perkemahan; 'berkemah' merupakan padanan modern yang tepat.
- source_word: בְאֵתָם
  choice: di Etam
  rationale: Preposisi ב menandai lokasi persinggahan. 'Di' adalah bentuk alami dalam bahasa Indonesia; nama tempat ditransliterasikan sebagai Etam.
- source_word: אֲשֶׁר
  choice: yang terletak
  rationale: Kata relatif אֲשֶׁר memperkenalkan keterangan lokasi Etam. Penambahan 'terletak' membuat hubungan klausa alami tanpa menambah isi substantif.
- source_word: בִּקְצֵה
  choice: di tepi
  rationale: קָצֶה menunjuk bagian paling luar, ujung, atau batas suatu wilayah. 'Di tepi' mempertahankan gambaran geografis tanpa mengkhususkan maknanya menjadi perbatasan politis.
- source_word: הַמִּדְבָּר
  choice: padang gurun
  rationale: מִדְבָּר menunjuk wilayah liar atau gersang yang tidak dibudidayakan, bukan semata-mata gurun berpasir. 'Padang gurun' adalah padanan Indonesia yang lazim dalam konteks perjalanan ini.
