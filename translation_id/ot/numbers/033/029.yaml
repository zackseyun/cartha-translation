  yaml_path: translation/ot/numbers/033/029.yaml
  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: id
  text: Mereka berangkat dari Mitka, lalu berkemah di Hasmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari satu tempat persinggahan menuju tempat berikutnya. “Berangkat” alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִמִּתְקָה
  choice: dari Mitka
  rationale: Preposisi מִן diterjemahkan “dari,” sedangkan nama tempat מִתְקָה ditransliterasikan sebagai “Mitka” sesuai pelafalan Ibrani dan ejaan Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה berarti mendirikan atau menempati perkemahan. “Berkemah” merupakan padanan Indonesia yang ringkas dan wajar; “lalu” menyampaikan urutan naratif waw-konsekutif secara alami.
- source_word: בְּחַשְׁמֹנָה
  choice: di Hasmona
  rationale: Preposisi בְּ pada lokasi persinggahan secara alami diterjemahkan “di.” Nama tempat חַשְׁמֹנָה ditransliterasikan sebagai “Hasmona” dalam ejaan Indonesia.
