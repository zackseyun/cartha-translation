  text: They set out from Tahath and camped at Terah.
translation:
  language: id
  text: Mereka berangkat dari Tahat dan berkemah di Tarah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, נסע berarti membongkar perkemahan dan mulai bergerak. 'Berangkat' alami dalam bahasa Indonesia modern dan menyampaikan perpindahan ke tempat berikutnya.
- source_word: מִתָּחַת
  choice: dari Tahat
  rationale: Preposisi מִן diterjemahkan 'dari'. Nama tempat תָּחַת ditransliterasikan langsung dari bahasa Ibrani sebagai 'Tahat'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Dalam konteks daftar perjalanan, חנה berarti mendirikan atau menempati perkemahan. 'Berkemah' jelas dan wajar; 'lalu' menyatakan urutan tindakan yang dibawa oleh bentuk naratif Ibrani.
- source_word: בְּתָרַח
  choice: di Terah
  rationale: Preposisi בְּ pada lokasi persinggahan secara alami diterjemahkan 'di'. Nama tempat תָּרַח ditransliterasikan sebagai 'Terah'.
