base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: id
  text: Mereka berangkat dari Laut Merah[a], lalu berkemah di Padang Gurun Sin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Laut Teberau.” Nama Ibrani yam suf secara tradisional diterjemahkan “Laut Merah,” tetapi secara lebih harfiah sering dipahami sebagai “Laut Teberau.”
    reason: lexical_alternative
  - marker: b
    text: “Sin” adalah nama sebuah kawasan padang gurun.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Kata kerja נסע dalam rumusan perjalanan di Bilangan 33 menunjuk pada keberangkatan dari tempat persinggahan; “berangkat” alami dalam bahasa Indonesia modern dan mempertahankan urutan perjalanan.
- source_word: מִיַּם סוּף
  choice: dari Laut Merah
  rationale: Frasa Ibrani yam suf merupakan nama geografis yang secara tradisional diterjemahkan “Laut Merah”; kemungkinan arti yang lebih harfiah, “Laut Teberau,” dicantumkan dalam catatan kaki.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata חנה berarti mendirikan atau menempati perkemahan. “Berkemah” ringkas dan wajar; “lalu” menyatakan urutan naratif dari waw beruntun tanpa membuat hubungan kausal.
- source_word: בְּמִדְבַּר סִין
  choice: di Padang Gurun Sin
  rationale: מִדְבָּר menunjuk pada kawasan gurun atau belantara, sedangkan סִין adalah nama tempat. “Padang Gurun Sin” jelas dan sesuai dengan ragam geografis Alkitab dalam bahasa Indonesia.
