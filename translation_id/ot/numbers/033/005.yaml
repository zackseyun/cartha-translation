  text: וַ/יִּסְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל מֵ/רַעְמְסֵ֑ס וַֽ/יַּחֲנ֖וּ בְּ/סֻכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/005.yaml
  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: id
  text: Orang Israel berangkat dari Raamses, lalu berkemah di Sukot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Raamses juga dapat ditulis “Rameses”, dan Sukot juga dapat ditulis “Sukkot”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Dalam konteks daftar perjalanan, verba נסע menunjuk pada tindakan membongkar perkemahan dan mulai bergerak menuju tempat berikutnya. 'Berangkat' alami dan ringkas dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi sebagai sebutan kolektif bagi bangsa itu, 'Orang Israel' paling alami, jelas, dan tidak memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: מֵרַעְמְסֵס
  choice: dari Raamses
  rationale: Prefiks מִן menyatakan titik keberangkatan. 'Raamses' dipakai sebagai bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה berarti mendirikan atau menempati perkemahan. 'Lalu' menyatakan urutan naratif dari waw beruntun secara alami.
- source_word: בְּסֻכֹּת
  choice: di Sukot
  rationale: Preposisi בְּ menyatakan lokasi. 'Di' merupakan padanan lokasi yang wajar, dan 'Sukot' adalah transliterasi Indonesia yang dekat dengan bentuk Ibrani.
