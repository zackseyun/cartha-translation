base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/024.yaml
  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: id
  text: Mereka berangkat dari Gunung Sefer, lalu berkemah di Harada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari satu tempat persinggahan menuju tempat berikutnya. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan nuansa perpindahan.
- source_word: מֵהַר
  choice: dari Gunung
  rationale: Gabungan preposisi מן dan הַר berarti 'dari gunung'. Diikuti nama tempat, 'Gunung' menjadi konstruksi nama geografis yang wajar dalam bahasa Indonesia.
- source_word: שָׁפֶר
  choice: Sefer
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan. 'Sefer' mencerminkan pelafalan Ibrani שָׁפֶר secara wajar dalam ejaan Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Dalam konteks daftar perjalanan, חנה berarti mendirikan atau menempati perkemahan. 'Berkemah' jelas dan alami; 'lalu' menyampaikan urutan naratif waw-konsekutif tanpa membuat hubungan logis tambahan.
- source_word: בַּחֲרָדָה
  choice: di Harada
  rationale: Preposisi ב dengan nama tempat persinggahan secara alami diterjemahkan 'di'. Nama חֲרָדָה ditransliterasikan sebagai 'Harada' sesuai ejaan Indonesia.
theological_decisions: []
translation_notes:
