lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari suatu tempat persinggahan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan pola urutan perjalanan.
- source_word: מִבְּנֵי יַעֲקָן
  choice: dari Bene-Yaakan
  rationale: Bentuk ini berfungsi sebagai nama tempat dalam daftar perjalanan, sehingga ditransliterasikan. Preposisi מִ diterjemahkan 'dari'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam rumusan perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' jelas dan alami; 'lalu' mengungkapkan urutan naratif waw-konsekutif tanpa memberi makna tambahan yang tidak perlu.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: di Hor-Hagidgad
  rationale: Ini nama tempat, sehingga ditransliterasikan. Preposisi בְּ menyatakan lokasi dan secara alami diterjemahkan 'di'.
