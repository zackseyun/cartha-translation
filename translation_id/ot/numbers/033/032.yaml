  text: Mereka berangkat dari Bene-Yaakan[a] lalu berkemah di Hor-Hagidgad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bene-Yaakan tampaknya merupakan nama tempat, meskipun bentuk Ibraninya secara harfiah berarti “anak-anak Yaakan”.
