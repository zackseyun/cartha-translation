  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: id
  text: Mereka berangkat dari Harada, lalu berkemah di Makhelot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di padang gurun, נסע menyatakan berangkat dari tempat perkemahan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan gagasan meninggalkan lokasi sebelumnya.
- source_word: מֵחֲרָדָה
  choice: dari Harada
  rationale: Prefiks מֵ menandai asal atau pemisahan, sehingga diterjemahkan 'dari'. Nama tempat חֲרָדָה ditransliterasikan sebagai 'Harada'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Dalam konteks perjalanan, חנה berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan modern dan wajar; 'lalu' mengungkapkan urutan naratif waw-konsekutif secara alami.
- source_word: בְּמַקְהֵלֹת
  choice: di Makhelot
  rationale: Preposisi בְ dengan nama tempat menunjukkan lokasi perkemahan dan secara alami diterjemahkan 'di'. Nama tempat מַקְהֵלֹת ditransliterasikan sebagai 'Makhelot'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang ringkas, alami, dan bermartabat. Struktur formula perjalanan dipertahankan tanpa membuat diksi terasa kaku. Tidak diperlukan catatan kaki karena alternatif seperti 'melanjutkan perjalanan' dan 'mendirikan perkemahan' tidak menambahkan ambiguitas penting dari teks sumber.
