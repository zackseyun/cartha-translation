    rationale: 'Konstruksi ini dapat diterima, tetapi teks Ibrani menyatakan konsekuensi dengan “akan terjadi: apa yang Aku maksudkan ... akan Aku lakukan ...”, bukan terutama perbandingan retoris. Revisi mengikutinya lebih dekat dan tetap alami.'
  - severity: low
    issue: “telah Kurencanakan”
    rationale: Perfek Ibrani di sini menyatakan maksud yang telah ditetapkan, tetapi “Aku maksudkan” lebih dekat dengan ambiguitas leksikal דמה dan tidak menambah nuansa perencanaan yang terlalu spesifik.
