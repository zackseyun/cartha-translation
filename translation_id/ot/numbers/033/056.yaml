translation:
  language: id
  text: 'Maka akan terjadi: apa yang Kumaksudkan untuk Kulakukan kepada mereka akan Kulakukan kepada kamu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Maka
  rationale: Dalam konteks ini, ungkapan tersebut memperkenalkan akibat dari peringatan sebelumnya; “Maka” menyampaikan hubungan konsekuensial secara alami dan ringkas dalam bahasa Indonesia modern.
- source_word: כַּאֲשֶׁר
  choice: seperti yang ... demikianlah
  rationale: Pasangan korelatif ini mempertahankan perbandingan langsung dalam bahasa Ibrani antara tindakan yang direncanakan terhadap mereka dan tindakan yang akan dilakukan terhadap Israel.
- source_word: דִּמִּיתִי
  choice: telah Kurencanakan
  rationale: Bentuk piel di sini menyatakan maksud atau rencana yang pasti, bukan sekadar pikiran. “Kurencanakan” jelas, wajar, dan sesuai dengan bobot ancaman dalam konteks.
- source_word: לַעֲשׂוֹת
  choice: untuk Kulakukan
  rationale: Terjemahan dengan “lakukan” mempertahankan keluasan makna עשה serta kesejajaran leksikal dengan אֶעֱשֶׂה.
- source_word: לָהֶם
  choice: terhadap mereka
  rationale: Dalam bahasa Indonesia, “terhadap mereka” secara alami menandai sasaran tindakan tanpa menambahkan rincian hukuman yang tidak dinyatakan dalam ayat.
- source_word: אֶעֱשֶׂה
  choice: akan Kulakukan
  rationale: Pilihan ini mempertahankan pengulangan kata kerja עשה dan ketegasan bentuk masa depan dalam ancaman tersebut.
- source_word: לָכֶם
  choice: terhadap kamu
  rationale: “Terhadap kamu” sejajar dengan “terhadap mereka” dan mempertahankan bentuk orang kedua jamak secara kolektif tanpa memakai ragam regional.
theological_decisions:
- issue: Daya ancaman ilahi dan prinsip pembalikan hukuman
  choice: Ayat diterjemahkan sebagai peringatan langsung bahwa tindakan yang Allah rencanakan terhadap penduduk negeri itu akan Ia lakukan terhadap Israel.
  alternative: Pernyataan akibat yang lebih lunak tanpa penekanan pada rencana dan tindakan langsung Allah.
  rationale: Struktur orang pertama דִּמִּיתִי ... אֶעֱשֶׂה menyatakan maksud serta tindakan Allah secara eksplisit. Terjemahan mempertahankan ketegangan dan bobot penghakiman itu tanpa merinci bentuk hukumannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat berhuruf kapital “Kurencanakan” dan “Kulakukan” menandai pembicara ilahi sesuai konvensi penerbitan Alkitab Indonesia. Pasangan “seperti ... demikianlah” mempertahankan kesejajaran retoris sumber dan menghindari susunan yang terasa seperti terjemahan harfiah yang kaku.
