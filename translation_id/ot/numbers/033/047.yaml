  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: id
  text: Mereka berangkat dari Almon-Diblataim, lalu berkemah di pegunungan Abarim, di hadapan Nebo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di seberang Nebo” atau “di depan Nebo.” Kata depan Ibrani menunjukkan hubungan ruang tanpa menentukan nuansa letaknya secara persis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan daftar perjalanan Bilangan 33, verba נסע menunjuk pada tindakan membongkar perkemahan dan melanjutkan perjalanan. 'Berangkat' alami dalam bahasa Indonesia modern.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: dari Almon-Diblataim
  rationale: Nama tempat ditransliterasikan. Tanda hubung mempertahankan pemahaman nama lokasi majemuk yang lazim.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה adalah istilah baku dalam daftar perjalanan untuk mendirikan atau menetap di perkemahan. 'Lalu' menyampaikan urutan naratif waw konsekutif secara alami.
- source_word: בְּהָרֵי
  choice: di pegunungan
  rationale: Bentuk jamak konstruksi dari הַר menunjuk pada kawasan bergunung-gunung. 'Di pegunungan' lebih alami dan tidak mengharuskan perkemahan berada tepat di atas puncak.
- source_word: הָעֲבָרִים
  choice: Abarim
  rationale: Dalam konteks ini kata tersebut berfungsi sebagai nama geografis, sehingga ditransliterasikan dan tidak diterjemahkan menurut makna akar katanya.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini mempertahankan gambaran spasial harfiah 'di depan/di hadapan' tanpa menentukan orientasi geografis yang tidak dinyatakan oleh teks.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang telah lazim dalam bahasa Indonesia.
