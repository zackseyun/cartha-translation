  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: id
  text: Mereka berangkat dari Risa, lalu berkemah di Kehelata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan daftar perjalanan di padang gurun, verba נסע menunjuk pada tindakan meninggalkan suatu tempat untuk meneruskan perjalanan. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan pola perjalanan tersebut.
- source_word: מֵרִסָּה
  choice: dari Risa
  rationale: Nama tempat רִסָּה ditransliterasikan sebagai “Risa”; prefiks מֵ־ diterjemahkan “dari”.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam konteks ini berarti mendirikan atau menempati perkemahan. “Berkemah” merupakan padanan modern yang konkret; “lalu” menyampaikan kelanjutan urutan naratif waw tanpa membuat kedua tindakan berlangsung serentak.
- source_word: בִּקְהֵלָתָה
  choice: di Kehelata
  rationale: Nama tempat קְהֵלָתָה ditransliterasikan sebagai “Kehelata”; prefiks בְּ־ secara wajar diterjemahkan “di” untuk lokasi tempat berkemah.
