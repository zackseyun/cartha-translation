  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: id
  text: Musa mencatat tempat-tempat keberangkatan mereka menurut perjalanan mereka atas perintah Yahweh[a][b][c], dan inilah perjalanan mereka menurut tempat-tempat keberangkatan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Yahweh,” suatu ungkapan yang berarti “atas perintah Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: “Tempat-tempat keberangkatan” juga dapat diterjemahkan “keberangkatan-keberangkatan” atau “keluarnya mereka.”
    reason: lexical_alternative
  - marker: c
    text: 'Ayat ini dengan sengaja membalik urutan kedua istilah tersebut: “tempat-tempat keberangkatan mereka menurut perjalanan mereka” ... “perjalanan mereka menurut tempat-tempat keberangkatan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: mencatat
  rationale: Bentuk naratif ini menyatakan tindakan lampau; 'mencatat' secara wajar menyampaikan tindakan menuliskan suatu catatan perjalanan.
- source_word: מוֹצָאֵיהֶם
  choice: tempat-tempat keberangkatan mereka
  rationale: מוֹצָא dapat menunjuk tindakan atau tempat keluar/berangkat. Dalam daftar perjalanan ini, frasa tersebut secara konkret menunjuk tempat mereka mulai berangkat, tanpa menghilangkan nuansa keberangkatan.
- source_word: לְמַסְעֵיהֶם
  choice: menurut perjalanan-perjalanan mereka
  rationale: לְ dipahami secara relasional, sedangkan מַסָּע menunjuk perjalanan atau tahap perpindahan. Bentuk ini mempertahankan susunan paralel dan pembalikan pada akhir ayat.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan harfiah 'menurut mulut Yahweh' merupakan idiom untuk perintah atau pengarahan Yahweh.
- source_word: וְאֵלֶּה
  choice: dan inilah
  rationale: Ungkapan ini memperkenalkan daftar yang menyusul dan terdengar alami sebagai pengantar dalam bahasa Indonesia.
- source_word: מַסְעֵיהֶם
  choice: perjalanan-perjalanan mereka
  rationale: Bentuk jamak dipertahankan untuk menunjuk rangkaian perjalanan atau tahap perpindahan dalam daftar perjalanan.
- source_word: לְמוֹצָאֵיהֶם
  choice: menurut tempat-tempat keberangkatan mereka
  rationale: 'Pilihan ini mencerminkan frasa pertama dan mempertahankan pembalikan yang disengaja: tempat keberangkatan menurut perjalanan, lalu perjalanan menurut tempat keberangkatan.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan serta struktur silang teks Ibrani dipertahankan meskipun terasa lebih formal daripada percakapan sehari-hari. Penanda catatan kaki ditempatkan setelah klausa terkait dan semuanya muncul dalam teks utama.
