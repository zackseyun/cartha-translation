  text: וַ/יַּחֲנ֤וּ עַל הַ/יַּרְדֵּן֙ מִ/בֵּ֣ית הַיְשִׁמֹ֔ת עַ֖ד אָבֵ֣ל הַשִּׁטִּ֑ים בְּ/עַֽרְבֹ֖ת מוֹאָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: id
  text: Mereka berkemah di tepi Sungai Yordan, dari Bet-Yesimot sampai Abel-Sitim, di dataran Moab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "di stepa Moab." Istilah Ibrani ini menunjuk pada kawasan datar berupa stepa di Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: Mereka berkemah
  rationale: Bentuk wayyiqtol dari חנה melanjutkan urutan perjalanan Israel. 'Berkemah' alami dan jelas dalam bahasa Indonesia modern.
- source_word: עַל הַיַּרְדֵּן
  choice: di tepi Sungai Yordan
  rationale: Dengan nama sungai, עַל menyatakan lokasi di dekat atau di sepanjang sungai, bukan secara harfiah di atasnya. Penyebutan 'Sungai' memperjelas nama geografis bagi pembaca Indonesia.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: dari Bet-Yesimot
  rationale: Nama tempat ditransliterasikan; prefiks מִן menandai titik awal bentangan perkemahan.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: sampai Abel-Sitim
  rationale: עַד menandai batas akhir bentangan geografis. Nama tempat dipertahankan melalui transliterasi.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עֲרָבוֹת menunjuk pada kawasan datar atau stepa di Moab; 'dataran' merupakan padanan Indonesia yang jelas dan lazim, sedangkan בְּ bersifat lokatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama-nama tempat ditransliterasikan secara wajar untuk pembaca Indonesia.
