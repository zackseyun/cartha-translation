lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di Bilangan 33, verba נסע menyatakan tindakan meninggalkan suatu tempat untuk melanjutkan perjalanan. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan fungsi rumus tersebut.
- source_word: מִמִּדְבַּר סִינָי
  choice: dari Padang Gurun Sinai
  rationale: מִדְבָּר menunjuk wilayah liar atau gurun; “Padang Gurun Sinai” merupakan nama geografis yang jelas dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה adalah istilah baku dalam daftar perjalanan untuk mendirikan atau menempati perkemahan. “Berkemah” ringkas, modern, dan tepat; “lalu” menyampaikan urutan naratif waw beruntun secara alami.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: di Kibrot-Taawa
  rationale: Ungkapan ini berfungsi sebagai nama tempat, sehingga ditransliterasikan dalam teks utama. Unsur בְּ diterjemahkan “di”, sedangkan arti nama tersebut dijelaskan dalam catatan kaki.
