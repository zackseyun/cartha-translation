  yaml_path: translation/ot/numbers/033/021.yaml
  text: They set out from Libnah and camped at Rissah.
translation:
  language: id
  text: Mereka berangkat dari Libna, lalu berkemah di Risa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, נסע menyatakan meninggalkan suatu tempat perkemahan untuk meneruskan perjalanan. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan gagasan awal pergerakan.
- source_word: מִלִּבְנָה
  choice: dari Libna
  rationale: Preposisi מִן menandai asal keberangkatan, sedangkan לִבְנָה adalah nama tempat yang ditransliterasikan sebagai “Libna” sesuai ejaan Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata חנה adalah verba baku dalam daftar perjalanan untuk mendirikan atau menempati perkemahan. “Berkemah” jelas dan wajar; “lalu” menyampaikan urutan naratif dari waw beruntun secara alami.
- source_word: בְּרִסָּה
  choice: di Risa
  rationale: Preposisi בְּ menandai lokasi. “Di” merupakan padanan lokasi yang idiomatis, dan nama tempat רִסָּה ditransliterasikan sebagai “Risa” sesuai ejaan Indonesia.
