base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: id
  text: Mereka berangkat dari hadapan Hahirot[a], lalu menyeberangi laut melalui bagian tengahnya menuju padang gurun. Mereka menempuh perjalanan tiga hari[b] di padang gurun Etam, lalu berkemah di Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Hahirot.” Dalam kitab Keluaran, tempat ini lebih sering disebut “Pi-Hahirot”; unsur “Pi-” tidak terdapat dalam teks ayat ini, sehingga bentuk yang lebih pendek dipertahankan.
    reason: alternative_reading
  - marker: b
    text: 'Atau: “Mereka melakukan perjalanan selama tiga hari di padang gurun Etam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam daftar perjalanan, נסע berarti membongkar perkemahan lalu melanjutkan perjalanan. “Berangkat” menyampaikan hal itu secara alami dalam bahasa Indonesia.
- source_word: מִפְּנֵי הַחִירֹת
  choice: dari depan Hahirot
  rationale: Terjemahan ini mempertahankan unsur מִפְּנֵי, “dari depan,” serta bentuk nama tempat yang lebih pendek dalam teks ayat ini tanpa menyelaraskannya dengan Pi-Hahirot dalam Keluaran.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: melintasi tengah laut
  rationale: עבר menyatakan gerak menyeberang atau melintas, sedangkan בְּתוֹךְ secara khusus menunjuk bagian tengah; ungkapan ini mempertahankan gambaran perjalanan melalui tengah laut.
- source_word: הַמִּדְבָּרָה
  choice: menuju padang gurun
  rationale: Akhiran penunjuk arah -ָה menyatakan gerak ke arah padang gurun. “Menuju” mempertahankan arah gerak tanpa memastikan lebih dari yang dinyatakan bentuk Ibraninya.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: Mereka menempuh perjalanan tiga hari
  rationale: Ungkapan Ibrani secara idiomatis menunjuk perjalanan yang berlangsung atau berjarak tempuh tiga hari. Rumusan Indonesia ini alami dan tetap mempertahankan ungkapan “perjalanan tiga hari.”
- source_word: בְּמִדְבַּר אֵתָם
  choice: di padang gurun Etam
  rationale: Rangkaian konstruksi Ibrani menyatakan padang gurun yang dikaitkan dengan nama tempat Etam.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: berkemah di Mara
  rationale: חנה dalam daftar perjalanan berarti mendirikan kemah atau berhenti untuk berkemah; “di” lazim digunakan bersama nama lokasi dalam bahasa Indonesia.
theological_decisions: []
