  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama-nama tempat ditransliterasikan sebagai Hahirot, Etam, dan Mara. Struktur kalimat dibagi dua agar alur perjalanan mudah dipahami tanpa menghilangkan urutan tindakan dalam bahasa Ibrani.
