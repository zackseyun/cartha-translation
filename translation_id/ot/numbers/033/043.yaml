base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/043.yaml
  text: They set out from Punon and camped at Oboth.
translation:
  language: id
  text: Mereka berangkat dari Punon, lalu berkemah di Obot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan perjalanan di padang gurun, verba נסע menyatakan tindakan membongkar perkemahan lalu melanjutkan perjalanan. 'Berangkat' menyampaikan makna itu secara alami dalam bahasa Indonesia modern.
- source_word: מִפּוּנֹן
  choice: dari Punon
  rationale: Preposisi מִן menyatakan asal keberangkatan. Nama tempat פּוּנֹן ditransliterasikan sebagai 'Punon'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam daftar perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan yang alami; 'lalu' mengungkapkan urutan naratif waw tanpa menjadikannya sekadar tambahan simultan.
- source_word: בְּאֹבֹת
  choice: di Obot
  rationale: Preposisi בְּ menandai lokasi perkemahan dan secara alami diterjemahkan 'di'. Nama tempat אֹבֹת ditransliterasikan sebagai 'Obot', sesuai bentuk Ibrani dan kebiasaan ejaan Indonesia.
