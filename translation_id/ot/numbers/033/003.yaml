id: NUM.33.3
reference: Numbers 33:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: id
  text: Mereka berangkat dari Rameses pada bulan pertama, tepat pada hari kelima belas bulan itu. Sehari sesudah Paskah, orang Israel[a] keluar dengan tangan terangkat[b] di depan mata seluruh orang Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; maksudnya, orang Israel.
    reason: lexical_alternative
  - marker: b
    text: “Dengan tangan terangkat” adalah ungkapan Ibrani yang berarti bertindak secara terbuka dan berani, di depan umum.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam daftar perjalanan, נסע berarti meninggalkan tempat persinggahan dan mulai menempuh perjalanan; “berangkat” alami dan tepat dalam bahasa Indonesia.
- source_word: מֵרַעְמְסֵס
  choice: dari Rameses
  rationale: Nama tempat ditransliterasikan dengan bentuk “Rameses” yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן ... בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: pada bulan pertama, tepat pada hari kelima belas bulan itu
  rationale: Mengungkapkan tanggal Ibrani secara alami tanpa menghilangkan pengulangan rujukan kepada bulan pertama; “bulan itu” menghindari kekakuan yang tidak perlu.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: Sehari sesudah Paskah
  rationale: מָחֳרַת menunjuk pada hari berikutnya, sedangkan הַפֶּסַח menunjuk pada Paskah yang sudah dikenal dalam konteks.
- source_word: יָצְאוּ
  choice: keluar
  rationale: Mempertahankan verba utama motif keluaran, yaitu pergi keluar dari Mesir.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan kolektif ini secara harfiah berbentuk “anak-anak lelaki Israel,” tetapi dalam konteks menunjuk kepada bangsa Israel; “orang Israel” jelas dan wajar, sementara bentuk sumber dijelaskan dalam catatan kaki.
- source_word: בְּיָד רָמָה
  choice: dengan tangan terangkat
  rationale: Mempertahankan gambaran konkret idiom Ibrani tanpa mempersempit artinya hanya menjadi “dengan berani,” “dengan kemenangan,” atau “dengan menantang.”
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: di depan mata seluruh orang Mesir
  rationale: Terjemahan dekat dari idiom penglihatan ini menegaskan bahwa keberangkatan tersebut terjadi secara terbuka dan disaksikan umum.
theological_decisions:
- issue: Terjemahan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; bani Israel
  rationale: Bentuk Ibrani memang maskulin secara gramatikal, tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. Teks utama memakai ungkapan Indonesia yang alami, sedangkan bentuk harfiahnya tetap tersedia dalam catatan agar ciri sumber tidak disembunyikan.
- issue: Terjemahan idiom בְיָד רָמָה
  choice: dengan tangan terangkat
  alternative: dengan berani; dengan penuh kemenangan; dengan sikap menantang
  rationale: Idiom tersebut menyiratkan tindakan yang terbuka dan berani, mungkin juga bernada menantang, tetapi teks tidak mengharuskan satu nuansa khusus. Gambaran sumber dipertahankan dan cakupan maknanya diterangkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara idiom penting dan bentuk kolektif Ibrani dipertahankan atau dijelaskan melalui catatan kaki.
