  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: id
  text: Sementara orang Mesir menguburkan orang-orang yang telah dipukul mati oleh Yahweh di antara mereka, yaitu semua anak sulung, Yahweh telah melaksanakan penghakiman atas ilah-ilah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: sementara orang Mesir menguburkan
  rationale: Konjungsi yang diikuti nomina dan partisipel membentuk keterangan keadaan yang berlangsung bersamaan dengan keberangkatan Israel; “sementara” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם כָּל בְּכוֹר
  choice: semua anak sulung yang telah dipukul mati oleh Yahweh di antara mereka
  rationale: Susunan relatif Ibrani diungkapkan secara wajar dengan menempatkan “semua anak sulung” sebagai objek. “Dipukul mati” mempertahankan citra נכה sekaligus menjelaskan akibat fatal dalam konteks tulah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בָּהֶם
  choice: di antara mereka
  rationale: Preposisi dengan sufiks jamak menunjuk pada lingkungan orang Mesir tempat para anak sulung terkena tulah.
- source_word: וּבֵאלֹהֵיהֶם
  choice: atas ilah-ilah mereka
  rationale: 'Dengan idiom עשה שפטים, preposisi ב paling alami menyatakan sasaran penghukuman: “atas” ilah-ilah Mesir.'
- source_word: עָשָׂה ... שְׁפָטִים
  choice: telah menjatuhkan hukuman
  rationale: Idiom ini berarti melaksanakan tindakan penghakiman; “menjatuhkan hukuman” alami, jelas, dan tetap bernada yudisial.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memuat Tetragramaton sebagai nama diri; transliterasi mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Rujukan אֱלֹהֵיהֶם
  choice: ilah-ilah mereka
  alternative: berhala-berhala mereka atau penguasa-penguasa mereka
  rationale: Dalam konteks penghukuman atas Mesir, kata tersebut secara langsung menunjuk kepada ilah-ilah Mesir. Terjemahan tidak menafsirkannya ulang sebagai penguasa manusia ataupun sekadar benda berhala.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua klausa dipisahkan menjadi dua kalimat agar hubungan maknanya jelas tanpa menghilangkan keterkaitan naratif. Istilah “ilah-ilah” membedakan dewa-dewa Mesir dari nama diri Yahweh.
