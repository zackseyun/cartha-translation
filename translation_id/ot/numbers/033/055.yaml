source:
  edition: WLC
  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: id
  text: Namun, jika kamu tidak menghalau penduduk negeri itu dari hadapanmu, mereka yang kamu biarkan tinggal akan menjadi benda-benda tajam di matamu[a] dan duri di sisi tubuhmu[b]. Mereka akan menyusahkan kamu[c] di negeri yang kamu diami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “benda-benda tajam” jarang dipakai dan menunjuk pada sesuatu yang tajam serta menusuk. Atau “duri di matamu” atau “cucukan di matamu”.
    reason: lexical_alternative
  - marker: b
    text: Atau “duri di sisimu” atau “kait di sisi tubuhmu”. Kedua gambaran ini melukiskan penderitaan yang menyakitkan dan terus-menerus akibat penduduk yang dibiarkan tinggal.
    reason: lexical_alternative
  - marker: c
    text: Atau “memusuhi kamu”, “mengusik kamu”, atau “menindas kamu”. Verba Ibrani ini mencakup berbagai bentuk tindakan bermusuhan yang mendatangkan kesusahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: menghalau
  rationale: Bentuk Hifil dari ירשׁ di sini menyatakan tindakan menyingkirkan penduduk yang sedang menguasai negeri itu. “Menghalau” alami dalam bahasa Indonesia dan mempertahankan unsur pemindahan paksa tanpa menambahkan gagasan belas kasihan.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Menerjemahkan konstruksi partisipial secara langsung dan alami; “negeri itu” sesuai dengan konteks wilayah yang telah disebutkan.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapanmu
  rationale: Mempertahankan gambaran ruang dalam idiom Ibrani, yaitu tersingkir dari hadapan Israel.
- source_word: תּוֹתִירוּ
  choice: kamu biarkan tetap tinggal
  rationale: Menangkap makna kausatif ‘membiarkan tersisa’ tanpa memasukkan nuansa ‘menyayangkan’ atau ‘mengampuni’ yang tidak dinyatakan oleh verba.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: duri di matamu
  rationale: Nomina שִׂכִּים jarang dan menunjuk pada sesuatu yang tajam serta menusuk. “Duri” mempertahankan metafora tubuh yang gamblang dan mudah dipahami.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: duri di lambungmu
  rationale: Ungkapan ini menggambarkan benda tajam yang terus-menerus menusuk bagian sisi tubuh. “Lambung” lebih konkret daripada “sisi” dalam metafora tubuh bahasa Indonesia.
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: mereka akan memusuhi kamu
  rationale: Verba צרר mencakup tindakan bermusuhan, menyusahkan, atau menindas. “Memusuhi” mempertahankan unsur permusuhan tanpa mempersempitnya menjadi satu bentuk penindasan tertentu.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: di negeri yang kamu diami
  rationale: Walaupun עַל secara harfiah dapat berarti ‘di atas’, bahasa Indonesia secara alami memakai “di negeri”. “Kamu diami” mempertahankan makna partisipial dalam bentuk yang ringkas dan bermartabat.
