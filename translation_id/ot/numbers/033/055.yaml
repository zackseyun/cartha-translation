translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang tegas dan bermartabat. Pronomina tunggal “-mu/kamu” mengikuti bentuk orang kedua jamak Ibrani secara idiomatis dalam bahasa Indonesia dan merujuk kepada umat Israel secara kolektif. Dua metafora tubuh dipertahankan tanpa diperhalus.
