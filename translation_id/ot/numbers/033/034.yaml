  text: They set out from Jotbathah and camped at Abronah.
translation:
  language: id
  text: Mereka berangkat dari Yotbata dan berkemah di Abrona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di padang gurun, נסע menyatakan keberangkatan dari satu tempat persinggahan. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan arah geraknya.
- source_word: מִיָּטְבָתָה
  choice: dari Yotbata
  rationale: Prefiks מִן berarti “dari”. Nama tempat ditransliterasikan langsung dari bentuk Ibrani יָטְבָתָה; “Yotbata” mencerminkan bunyi sumber dan gaya ejaan Indonesia.
- source_word: וַיַּחֲנוּ
  choice: dan berkemah
  rationale: Dalam konteks daftar perjalanan, חנה berarti mendirikan atau menempati perkemahan di lokasi berikutnya. “Berkemah” jelas, ringkas, dan wajar dalam bahasa Indonesia modern.
- source_word: בְּעַבְרֹנָה
  choice: di Abrona
  rationale: Prefiks בְּ bersifat lokatif dan secara alami diterjemahkan “di”. Nama עַבְרֹנָה ditransliterasikan “Abrona” sesuai pelafalan sumber dan ejaan Indonesia.
