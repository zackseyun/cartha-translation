  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: id
  text: Mereka berangkat dari Hazerot, lalu berkemah di Ritma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan daftar perjalanan di padang gurun, verba נסע menyatakan tindakan membongkar perkemahan lalu memulai perjalanan. 'Berangkat' alami dalam bahasa Indonesia modern dan ringkas.
- source_word: מֵחֲצֵרֹת
  choice: dari Hazerot
  rationale: Nama tempat חֲצֵרֹת ditransliterasikan sebagai 'Hazerot'; prefiks מִן menyatakan asal, sehingga diterjemahkan 'dari'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה adalah istilah baku dalam daftar perjalanan untuk mendirikan atau menempati perkemahan. 'Berkemah' jelas dan wajar; 'lalu' mengungkapkan urutan naratif waw-konsekutif secara alami.
- source_word: בְּרִתְמָה
  choice: di Ritma
  rationale: Nama tempat רִתְמָה ditransliterasikan sebagai 'Ritma'; prefiks בְּ menandai lokasi dan secara alami diterjemahkan 'di'.
