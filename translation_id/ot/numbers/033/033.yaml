  yaml_path: translation/ot/numbers/033/033.yaml
  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: id
  text: Mereka berangkat dari Hor-Hagidgad, lalu berkemah di Yotbata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari suatu tempat persinggahan. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan urutan perjalanan.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: dari Hor-Hagidgad
  rationale: Preposisi מִן menyatakan titik asal. Nama tempat dialihaksarakan, dengan tanda hubung untuk mempertahankan hubungan kedua unsurnya.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam konteks daftar perjalanan berarti mendirikan atau menempati perkemahan. “Berkemah” merupakan padanan Indonesia modern yang jelas; “lalu” menyampaikan kelanjutan naratif waw secara alami.
- source_word: בְּיָטְבָתָה
  choice: di Yotbata
  rationale: Preposisi בְּ bersifat lokatif. “Di” adalah padanan alami dalam bahasa Indonesia, dan nama tempat dialihaksarakan dari bentuk Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk formula daftar perjalanan. Nama-nama tempat ditransliterasikan langsung dari teks Ibrani, bukan melalui bentuk Inggris.
