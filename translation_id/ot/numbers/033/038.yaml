  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: id
  text: Imam Harun naik ke Gunung Hor atas perintah Yahweh[a], lalu ia meninggal di sana pada tahun keempat puluh setelah orang Israel keluar dari tanah Mesir, pada bulan kelima, pada hari pertama bulan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut firman Yahweh”; secara harfiah, “di atas mulut Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata kerja עלה menyatakan gerak naik; “naik” alami dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: Imam Harun
  rationale: Gelar הַכֹּהֵן dipertahankan untuk menyatakan jabatan Harun; susunan gelar sebelum nama paling alami dalam bahasa Indonesia.
- source_word: אֶל הֹר הָהָר
  choice: ke Gunung Hor
  rationale: Ungkapan ini menunjuk nama tempat Gunung Hor; preposisi אֶל diterjemahkan “ke” agar tujuan gerak dinyatakan jelas.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Secara harfiah idiom ini berarti “menurut mulut Yahweh,” tetapi dalam konteks menyatakan tindakan yang dilakukan sesuai perintah-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: וַיָּמָת שָׁם
  choice: lalu ia meninggal di sana
  rationale: Menerjemahkan tindakan berikutnya dan keterangan tempat secara langsung; “meninggal” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: pada tahun keempat puluh
  rationale: Ini adalah bentuk penanggalan ordinal yang alami dalam bahasa Indonesia.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: setelah orang Israel keluar
  rationale: Infinitif dengan לְ menetapkan keluarnya Israel sebagai titik acuan waktu; “orang Israel” merujuk kepada bangsa itu secara kolektif.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ, “tanah/negeri,” serta preposisi sumber מִן.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: pada bulan kelima
  rationale: Terjemahan langsung dan alami bagi rumusan kalender Ibrani.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: tanggal satu bulan itu
  rationale: Ungkapan penanggalan Ibrani berarti hari pertama pada bulan yang telah disebutkan; bentuk ini jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Makna idiom עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  alternative: menurut firman Yahweh; secara harfiah, menurut mulut Yahweh
  rationale: Dalam konteks ini idiom tersebut menyatakan ketaatan kepada perintah ilahi. Catatan kaki mempertahankan bentuk dan alternatif leksikalnya tanpa mengubah makna teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan peristiwa, jabatan Harun, nama tempat, nama ilahi, dan rumusan tanggal dalam teks Ibrani.
