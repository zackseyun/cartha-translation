  text: וַ/יִּסְע֖וּ מֵ/אֵילִ֑ם וַֽ/יַּחֲנ֖וּ עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: id
  text: Mereka berangkat dari Elim, lalu berkemah di tepi Laut Merah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Laut Gelagah”. Nama Ibrani Yam Suf secara tradisional diterjemahkan “Laut Merah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari satu tempat persinggahan; 'berangkat' alami dalam bahasa Indonesia modern.
- source_word: מֵאֵילִם
  choice: dari Elim
  rationale: Preposisi מִן menyatakan asal, sedangkan אֵילִם adalah nama tempat dan ditransliterasikan sebagai 'Elim'.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה adalah istilah baku dalam daftar perjalanan untuk mendirikan atau menempati perkemahan; 'berkemah' ringkas dan jelas. 'Lalu' menyampaikan urutan naratif waw-konsekutif secara alami.
- source_word: עַל
  choice: di tepi
  rationale: Dalam konteks berkemah dekat perairan, עַל menunjukkan lokasi di sisi atau dekat laut, bukan secara harfiah di atasnya.
- source_word: יַם סוּף
  choice: Laut Merah
  rationale: Nama Ibrani Yam Suf secara tradisional diterjemahkan 'Laut Merah'. Kemungkinan arti leksikal 'Laut Gelagah' dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Koma sebelum 'lalu' menjaga kelancaran urutan perjalanan; penanda catatan kaki ditempatkan langsung sesudah nama geografis yang diterangkan.
