  yaml_path: translation/ot/numbers/033/026.yaml
  text: They set out from Makheloth and camped at Tahath.
translation:
  language: id
  text: Mereka berangkat dari Makhelot, lalu berkemah di Tahat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע menyatakan meninggalkan tempat perkemahan untuk melanjutkan perjalanan. “Berangkat” alami dalam bahasa Indonesia modern dan tepat menyampaikan perpindahan dari satu persinggahan.
- source_word: מִמַּקְהֵלֹת
  choice: dari Makhelot
  rationale: Preposisi מִן diterjemahkan “dari,” sedangkan nama tempat מַקְהֵלֹת ditransliterasikan sebagai “Makhelot,” mengikuti pelafalan Ibrani dan pola ejaan nama Semitik yang mudah dibaca dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam daftar persinggahan berarti mendirikan atau menempati perkemahan. “Berkemah” merupakan padanan modern dan wajar; “lalu” mengungkapkan urutan naratif waw tanpa membuat hubungan yang lebih kuat daripada teks sumber.
- source_word: בְּתָחַת
  choice: di Tahat
  rationale: Preposisi בְּ pada lokasi perkemahan secara alami diterjemahkan “di.” Nama tempat תָחַת ditransliterasikan “Tahat,” bukan diterjemahkan berdasarkan kemungkinan makna bentuk katanya.
