  yaml_path: translation/ot/numbers/033/035.yaml
  text: They set out from Abronah and camped at Ezion-geber.
translation:
  language: id
  text: Mereka berangkat dari Abrona, lalu berkemah di Ezion-Geber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumusan perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari suatu tempat perkemahan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan nuansa perpindahan.
- source_word: מֵעַבְרֹנָה
  choice: dari Abrona
  rationale: Prefiks מֵ diterjemahkan 'dari'. עַבְרֹנָה adalah nama tempat dan ditransliterasikan sebagai 'Abrona' sesuai bentuk nama Ibrani.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Dalam konteks daftar perjalanan, חנה berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan modern yang ringkas; 'lalu' mengungkapkan urutan naratif waw-konsekutif secara alami.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: di Ezion-Geber
  rationale: Prefiks בְּ menandai lokasi dan diterjemahkan 'di'. עֶצְיוֹן גָּבֶר adalah nama tempat majemuk yang ditransliterasikan sebagai 'Ezion-Geber'.
