  text: Harun berumur seratus dua puluh tiga tahun ketika ia meninggal di Gunung Hor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: Harun
  rationale: Konjungsi ו melanjutkan narasi, tetapi dalam bahasa Indonesia tidak perlu diterjemahkan secara eksplisit pada awal kalimat ini. Nama אַהֲרֹן memakai bentuk baku Alkitab bahasa Indonesia, “Harun”.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: berumur seratus dua puluh tiga tahun
  rationale: Ungkapan Ibrani בן + bilangan + שנה menyatakan usia. “Berumur ... tahun” menyampaikan maknanya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְּ/מֹת/וֹ
  choice: ketika ia meninggal
  rationale: Preposisi ב pada bentuk nominal “kematian” dengan sufiks orang ketiga berfungsi secara temporal; ungkapan ini paling alami diterjemahkan “ketika ia meninggal”.
- source_word: בְּ/הֹר הָ/הָר
  choice: di Gunung Hor
  rationale: הֹר הָהָר adalah nama tempat Gunung Hor. Preposisi ב diterjemahkan “di”, pilihan lokasi yang alami dalam bahasa Indonesia tanpa menentukan lebih jauh posisi tepatnya di gunung itu.
