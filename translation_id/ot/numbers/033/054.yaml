  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: id
  text: Bagilah tanah itu sebagai milik pusaka dengan undian menurut kaum-kaum kalian. Kepada kaum yang lebih banyak jumlahnya, berikanlah bagian pusaka yang lebih besar; kepada kaum yang lebih sedikit jumlahnya, berikanlah bagian pusaka yang lebih kecil. Ke mana pun undian itu jatuh bagi seseorang, tempat itu akan menjadi miliknya.[a] Terimalah bagian-bagian pusaka kalian menurut suku-suku nenek moyang kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ke tempat mana undian itu keluar baginya, di sanalah itu akan menjadi miliknya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: Kamu harus membagi-bagikan ... sebagai milik pusaka
  rationale: Bentuk hitpael dari נחל dalam konteks ini menunjuk pada pembagian tanah pusaka di antara kelompok-kelompok Israel. Ungkapan ini mempertahankan gagasan milik pusaka sekaligus menyatakan tindakan pembagian secara alami dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: Dalam konteks perjalanan dan janji kepada Israel, הָאָרֶץ menunjuk pada wilayah tertentu yang akan mereka duduki; 'tanah itu' alami dan tepat.
- source_word: בְּגוֹרָל
  choice: dengan undian
  rationale: גורל adalah sarana penetapan bagian melalui undian. 'Dengan undian' merupakan padanan Indonesia yang ringkas dan jelas.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: menurut kaum-kaummu
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di dalam suku, lebih luas daripada keluarga inti. 'Kaum' mempertahankan struktur sosial tersebut.
- source_word: לָרַב ... וְלַמְעַט
  choice: kepada kelompok yang lebih besar ... kepada kelompok yang lebih kecil
  rationale: Dalam konteks pembagian wilayah, pasangan istilah ini membandingkan kelompok berdasarkan jumlah anggotanya. Penyebutan 'kelompok' membuat acuannya jelas tanpa menambahkan identitas yang tidak dinyatakan.
- source_word: תַּרְבּוּ אֶת נַחֲלָתוֹ ... תַּמְעִיט אֶת נַחֲלָתוֹ
  choice: memberikan bagian milik pusaka yang lebih besar ... memberikan bagian milik pusaka yang lebih kecil
  rationale: Ungkapan ini menyampaikan tindakan memperbesar dan memperkecil נַחֲלָה secara idiomatis. 'Bagian milik pusaka' mempertahankan makna perjanjian sekaligus konteks penjatahan tanah.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  choice: Di mana pun undian jatuh bagi seseorang
  rationale: Ungkapan Ibrani menggambarkan hasil undian yang menetapkan lokasi. 'Undian jatuh' adalah idiom Indonesia yang alami, sedangkan 'di mana pun' mempertahankan unsur tempat.
- source_word: לוֹ יִהְיֶה
  choice: tempat itu menjadi miliknya
  rationale: Klausa ini menyatakan bahwa lokasi yang ditentukan undian menjadi hak penerimanya. 'Tempat itu' memperjelas acuan spasial yang terdapat dalam klausa sebelumnya.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: menurut suku-suku leluhurmu
  rationale: מַטּוֹת menunjuk pada suku-suku Israel dan אֲבֹתֵיכֶם pada garis leluhur. Padanan ini alami serta tidak membatasi makna pada keluarga inti.
- source_word: תִּתְנֶחָלוּ
  choice: Kamu harus menerima milik pusaka
  rationale: Pemakaian penutup dari נחל menekankan penerimaan tanah sebagai pusaka menurut susunan suku. Terjemahan ini mempertahankan tema pusaka tanpa mengulang ungkapan pembagian pada awal ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' mempertahankan sapaan orang kedua yang langsung kepada umat sebagai satu kesatuan, sedangkan bentuk ulang pada 'kaum-kaum' dan 'suku-suku' menyatakan kelompok-kelompok penerima. Istilah 'milik pusaka' dipakai secara konsisten untuk menjaga bobot נַחֲלָה sebagai tanah warisan yang ditetapkan bagi Israel.
