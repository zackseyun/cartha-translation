revisions:
- from: Kamu harus membagi-bagikan tanah itu sebagai milik pusaka dengan undian menurut kaum-kaummu. Kepada kelompok yang lebih besar, kamu harus memberikan bagian milik pusaka yang lebih besar, dan kepada kelompok yang lebih kecil, kamu harus memberikan bagian milik pusaka yang lebih kecil. Di mana pun undian jatuh bagi seseorang, tempat itu menjadi miliknya.[a] Kamu harus menerima milik pusaka menurut suku-suku leluhurmu.
  to: Bagilah tanah itu sebagai milik pusaka dengan undian menurut kaum-kaum kalian. Kepada kaum yang lebih banyak jumlahnya, berikanlah bagian pusaka yang lebih besar; kepada kaum yang lebih sedikit jumlahnya, berikanlah bagian pusaka yang lebih kecil. Ke mana pun undian itu jatuh bagi seseorang, tempat itu akan menjadi miliknya.[a] Terimalah bagian-bagian pusaka kalian menurut suku-suku nenek moyang kalian.
  rationale: Revisi menyelaraskan sapaan dengan orang kedua jamak dalam bahasa Ibrani, memperjelas bahwa besar-kecilnya bagian mengikuti jumlah kaum, menyatakan jamak pada bagian pusaka terakhir, dan membetulkan catatan kaki agar tetap mencerminkan klausa kepemilikan Ibrani. Tidak ada penambahan tafsir teologis.
