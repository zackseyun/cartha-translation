  yaml_path: translation/ot/numbers/033/041.yaml
  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: id
  text: Mereka berangkat dari Gunung Hor, lalu berkemah di Zalmona.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam daftar perjalanan, verba נסע biasanya menyatakan pembongkaran perkemahan dan keberangkatan menuju persinggahan berikutnya. “Berangkat” alami dan tepat dalam bahasa Indonesia modern.
- source_word: מֵהֹר הָהָר
  choice: dari Gunung Hor
  rationale: הֹר הָהָר adalah nama tempat yang lazim dipadankan sebagai “Gunung Hor”; bentuk ini alami dalam tata nama geografis bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam catatan perjalanan padang gurun berarti mendirikan atau menempati perkemahan. “Berkemah” mempertahankan maknanya dalam bahasa Indonesia yang wajar; “lalu” mengungkapkan urutan naratif dari dua bentuk wayyiqtol.
- source_word: בְּצַלְמֹנָה
  choice: di Zalmona
  rationale: Preposisi בְּ di sini bersifat lokatif. “Di” merupakan pilihan idiomatis bahasa Indonesia untuk tempat mereka berkemah, sedangkan צַלְמֹנָה ditransliterasikan “Zalmona”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan alami, sesuai formula daftar perjalanan. Nama tempat ditransliterasikan secara konsisten dan tidak diperlukan catatan kaki.
