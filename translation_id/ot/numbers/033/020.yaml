  yaml_path: translation/ot/numbers/033/020.yaml
  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: id
  text: Mereka berangkat dari Rimon-Peres, lalu berkemah di Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus catatan perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari suatu tempat persinggahan. 'Berangkat' alami dalam bahasa Indonesia modern dan tepat bagi konteks ini.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: dari Rimon-Peres
  rationale: Preposisi מִן berarti 'dari', sedangkan nama tempat ditransliterasikan menurut bentuk Ibrani. Tanda hubung mempertahankan kesatuan nama majemuk tersebut.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam daftar perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan modern yang jelas; 'lalu' menyampaikan urutan naratif dari waw konsekutif secara alami.
- source_word: בְּלִבְנָה
  choice: di Libna
  rationale: Dalam keterangan tempat persinggahan, preposisi בְּ secara alami diterjemahkan 'di'. Libna dipertahankan sebagai transliterasi nama tempat.
