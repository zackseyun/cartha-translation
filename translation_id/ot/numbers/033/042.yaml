  yaml_path: translation/ot/numbers/033/042.yaml
  text: They set out from Zalmonah and camped at Punon.
translation:
  language: id
  text: Mereka berangkat dari Zalmona, lalu berkemah di Punon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, verba נסע menunjuk pada tindakan membongkar perkemahan lalu melanjutkan perjalanan. 'Berangkat' merupakan padanan Indonesia modern yang alami dan ringkas.
- source_word: מִצַּלְמֹנָה
  choice: dari Zalmona
  rationale: Prefiks מִן menyatakan asal, sehingga diterjemahkan 'dari'. Nama tempat צַלְמֹנָה ditransliterasikan sebagai 'Zalmona' sesuai kaidah ejaan Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam daftar perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' jelas dan wajar dalam bahasa Indonesia; 'lalu' menyampaikan urutan naratif waw konsekutif tanpa membuat hubungan yang lebih kuat daripada teks.
- source_word: בְּפוּנֹן
  choice: di Punon
  rationale: Preposisi בְּ menandai lokasi perkemahan dan secara alami diterjemahkan 'di'. Nama tempat פוּנֹן ditransliterasikan sebagai 'Punon'.
theological_decisions: []
