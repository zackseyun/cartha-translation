source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵֽ/אֵתָ֔ם וַ/יָּ֨שָׁב֙ עַל פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽ/יַּחֲנ֖וּ לִ/פְנֵ֥י מִגְדֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: id
  text: Mereka berangkat dari Etam, lalu berbalik ke Pi-Hahirot[a], yang berhadapan dengan Baal-Zefon, dan berkemah di depan Migdol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kembali ke Pi-Hahirot.” Kata kerja Ibrani dapat berarti kembali atau berbalik arah; dalam konteks ini tampaknya yang dimaksud adalah perubahan rute.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: Mereka berangkat dari Etam
  rationale: Dalam rumus perjalanan di padang gurun, נסע menunjukkan tindakan membongkar perkemahan dan melanjutkan perjalanan. 'Berangkat' alami dalam bahasa Indonesia modern, sedangkan Etam dipertahankan sebagai nama tempat.
- source_word: וַיָּשָׁב
  choice: lalu berbalik
  rationale: שׁוב dapat berarti kembali atau berbalik. Dalam uraian rute ini, 'berbalik' secara alami menyatakan perubahan arah tanpa memastikan bahwa mereka kembali ke tempat yang telah dilalui.
- source_word: עַל פִּי הַחִירֹת
  choice: ke Pi-Hahirot
  rationale: Walaupun konstruksi ini memakai עַל, konteks daftar perjalanan menunjukkan tujuan gerak. 'Ke' menyampaikan fungsi tersebut secara wajar, dan Pi-Hahirot ditransliterasikan sebagai nama tempat.
- source_word: אֲשֶׁר עַל פְּנֵי בַּעַל צְפֹן
  choice: yang berhadapan dengan Baal-Zefon
  rationale: עַל־פְּנֵי di sini menyatakan hubungan letak. 'Berhadapan dengan' mempertahankan gambaran spasial tanpa menentukan jarak atau orientasi lebih jauh; Baal-Zefon dipertahankan sebagai nama.
- source_word: וַיַּחֲנוּ לִפְנֵי מִגְדֹּל
  choice: dan berkemah di depan Migdol
  rationale: חנה berarti mendirikan atau menempati perkemahan, dan לִפְנֵי menunjukkan posisi di depan atau di hadapan. 'Berkemah di depan' jelas dan alami; Migdol diperlakukan sebagai nama tempat, bukan diterjemahkan menjadi 'menara'.
