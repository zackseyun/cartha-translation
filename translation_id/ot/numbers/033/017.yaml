  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: id
  text: Mereka berangkat dari Kibrot-Taawa, lalu berkemah di Hazerot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Kibrot-Taawa kemungkinan berarti “Kuburan Keinginan” atau “Kuburan Hawa Nafsu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus daftar perjalanan di padang gurun, verba נסע menyatakan keberangkatan dari suatu persinggahan. 'Berangkat' alami dalam bahasa Indonesia modern dan sesuai dengan konteks.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: dari Kibrot-Taawa
  rationale: Nama tempat dipertahankan melalui transliterasi, sedangkan prefiks מִן diterjemahkan 'dari'. Arti unsur-unsur nama dijelaskan dalam catatan kaki.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה dalam konteks perjalanan berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan modern yang ringkas; 'lalu' menyampaikan urutan naratif waw tanpa membuat hubungan yang lebih kuat daripada teks.
- source_word: בַּחֲצֵרֹת
  choice: di Hazerot
  rationale: Nama tempat ditransliterasikan, dan preposisi ב diterjemahkan 'di' karena menunjuk lokasi mereka berkemah.
