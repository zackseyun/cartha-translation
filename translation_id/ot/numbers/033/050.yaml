id: NUM.33.50
reference: Numbers 33:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa di dataran Moab[a], di tepi Sungai Yordan dekat Yerikho, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di padang-padang Moab.”'
    reason: Kata Ibrani עֲרָבוֹת dapat menunjuk pada dataran terbuka atau daerah padang/stepa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam konteks perkataan ilahi, “berfirman” merupakan ungkapan Indonesia yang alami dan bermartabat; bentuk penghubung naratif waw tidak perlu selalu dinyatakan dengan “dan” dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan tidak menggantinya dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Menyatakan penerima perkataan dengan susunan Indonesia yang baku.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עֲרָבוֹת menunjuk pada wilayah datar atau padang terbuka; “dataran Moab” alami sebagai sebutan geografis Indonesia, sementara kemungkinan “padang-padang Moab” dicatat dalam catatan kaki.
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: di tepi Sungai Yordan dekat Yerikho
  rationale: עַל dalam keterangan geografis ini menunjukkan lokasi di sisi Yordan, sedangkan יְרֵחוֹ memperjelas bagian sungai yang berada dekat Yerikho.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Secara alami memperkenalkan perkataan langsung yang dimulai pada ayat berikutnya tanpa memakai bentuk Indonesia yang kaku seperti “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi; “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Tanda titik dua mempertahankan fungsi לֵאמֹר sebagai pengantar bagi firman langsung pada ayat selanjutnya.
