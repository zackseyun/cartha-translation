base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: id
  text: Raja Arad, orang Kanaan yang tinggal di Negeb[a] di tanah Kanaan, mendengar ketika orang Israel[b] datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Negeb” juga dapat diterjemahkan “selatan” atau “wilayah selatan.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak lelaki Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk Qal wayyiqtol dari שׁמע secara langsung berarti “mendengar.” Objek yang didengar tidak dinyatakan, sedangkan frasa infinitif berikutnya menyebut keadaan yang didengarnya.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: Raja Arad, orang Kanaan
  rationale: Susunan ini mempertahankan Arad sebagai wilayah kekuasaan sang raja dan identitasnya sebagai orang Kanaan, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וְהוּא יֹשֵׁב
  choice: yang tinggal
  rationale: Pronomina dan partisipel memberi keterangan latar tentang sang raja; klausa relatif merupakan padanan Indonesia yang alami.
- source_word: בַּנֶּגֶב
  choice: di Tanah Negeb
  rationale: נֶגֶב di sini menunjuk kawasan geografis di selatan Kanaan. “Tanah Negeb” mempertahankan nama wilayah dan menghindari kesan bahwa yang dimaksud hanya arah mata angin.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di negeri Kanaan
  rationale: Menerjemahkan unsur אֶרֶץ secara eksplisit dan membedakannya secara wajar dari sebutan kawasan Negeb.
- source_word: בְּבֹא
  choice: bahwa ... sedang datang
  rationale: ב dengan infinitif konstruk בוא menandai keadaan atau waktu kedatangan. Dalam hubungan dengan “mendengar,” bahasa Indonesia alami memakai klausa isi “bahwa ... sedang datang”; aspek “sedang” menyajikan kedatangan itu sebagai peristiwa yang berlangsung tanpa menambahkan tujuan yang tidak disebutkan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak lelaki Israel” berfungsi sebagai nama kolektif bangsa. “Orang Israel” adalah padanan modern yang alami dan mencakup komunitas yang dimaksud; bentuk harfiah dicatat dalam catatan kaki.
