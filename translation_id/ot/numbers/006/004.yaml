  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: id
  text: Selama seluruh masa kenazirannya, ia tidak boleh makan apa pun yang dihasilkan oleh tanaman anggur, mulai dari biji sampai kulitnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “dari biji-biji sampai kulit”; ungkapan ini mencakup setiap bagian buah anggur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי נִזְרוֹ
  choice: selama seluruh masa kenazirannya
  rationale: Frasa ini menunjuk pada keseluruhan jangka waktu status atau ikrar nazir. Bentuk “masa kenazirannya” mempertahankan istilah teknis lembaga nazir sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: apa pun yang dihasilkan
  rationale: Konstruksi ini menyatakan seluruh golongan hasil tanaman anggur yang dilarang. “Apa pun yang dihasilkan” alami dalam bahasa Indonesia dan memperoleh daya larang dari “tidak boleh makan”.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: oleh tanaman anggur
  rationale: Ungkapan Ibrani yang secara harfiah berarti ‘dari sulur/pohon anggur untuk minuman anggur’ menunjuk pada tanaman anggur. Pilihan ini jelas bagi pembaca modern dan sesuai dengan gagasan hasil tanaman tersebut.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: mulai dari biji sampai kulitnya
  rationale: Merisme ini menyebut dua bagian buah untuk menyatakan cakupan menyeluruh. Terjemahan mempertahankan rentang ungkapan Ibrani tanpa menambahkan penafsiran ke dalam teks utama.
- source_word: לֹא יֹאכֵל
  choice: ia tidak boleh makan
  rationale: Bentuk tak selesai yang dinegasikan dalam konteks hukum menyampaikan larangan. “Tidak boleh makan” mempertahankan daya perintah dan lebih alami daripada bentuk futur dalam bahasa Indonesia.
theological_decisions: []
