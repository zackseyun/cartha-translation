  register: Bahasa Indonesia baku, modern, dan bermartabat dengan corak hukum yang jelas. Istilah teknis “kenaziran” dipertahankan karena konteks Bilangan 6 telah memperkenalkan lembaga nazir; susunan kalimat dibuat alami bagi pembaca umum.
