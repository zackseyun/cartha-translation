  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: id
  text: serta sebuah keranjang roti tidak beragi, yaitu kue dari tepung halus yang dicampur dengan minyak[a] dan roti tipis tidak beragi yang diolesi dengan minyak[b], beserta persembahan sajian mereka dan persembahan curahan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kue tidak beragi”; istilah Ibraninya luas, lalu ayat ini merinci kue dan roti tipis sebagai bagian dari kategori itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “diurapi dengan minyak”; kata kerja Ibraninya lazim berarti “mengurapi”, tetapi di sini menggambarkan pengolesan minyak pada roti tipis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַל
  choice: keranjang
  rationale: Kata ini menunjuk pada wadah yang berisi berbagai olahan tidak beragi; 'keranjang' merupakan padanan Indonesia yang langsung dan alami.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Istilah ini secara luas menunjuk pada roti atau olahan tanpa ragi. Padanan umum dipakai pada kemunculan pertama karena ayat selanjutnya merinci kue dan roti tipis dalam kategori tersebut.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Ini merupakan istilah baku bagi tepung bermutu yang digiling halus dalam konteks persembahan.
- source_word: חַלֹּת
  choice: kue
  rationale: Dalam konteks persembahan, kata ini menunjuk pada olahan roti yang dibentuk; 'kue' membedakannya secara wajar dari roti tipis yang disebut sesudahnya.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: dicampur dengan minyak
  rationale: Bentuk partisip pasif menunjukkan bahwa bahan kue dicampurkan dengan minyak; ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: רְקִיקֵי מַצּוֹת
  choice: roti tipis tidak beragi
  rationale: רְקִיקִים menunjuk pada olahan roti yang tipis. 'Roti tipis' lebih mudah dipahami pembaca Indonesia daripada istilah teknis atau kata serapan.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: diolesi dengan minyak
  rationale: Walaupun משׁח lazim berarti 'mengurapi', dalam konteks penyiapan makanan tindakan konkretnya ialah mengoleskan minyak. Pilihan ini alami tanpa memberi kesan teologis yang tidak dimaksudkan.
- source_word: מִנְחָתָם
  choice: persembahan sajian
  rationale: Dalam peraturan kurban, מִנְחָה adalah persembahan berbahan hasil bumi atau tepung. 'Persembahan sajian' merupakan istilah ringkas yang dapat mencakup kategori ritual tersebut.
- source_word: נִסְכֵּיהֶם
  choice: persembahan curahannya
  rationale: Kata ini menunjuk pada persembahan cair yang dicurahkan. Bentuk tunggal kolektif dengan sufiks dipertahankan sedekat mungkin dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ritual משׁח ketika dikenakan pada roti tipis
  choice: diolesi dengan minyak
  alternative: diurapi dengan minyak
  rationale: Konteksnya adalah penyiapan bahan persembahan, bukan pengurapan seseorang atau benda untuk jabatan kudus. Padanan konkret menghindari penambahan muatan teologis, sementara alternatif literal dicatat dalam catatan kaki.
- issue: Acuan sufiks jamak pada מִנְחָתָם dan נִסְכֵּיהֶם
  choice: beserta persembahan sajian dan persembahan curahannya
  alternative: beserta persembahan sajian mereka dan persembahan-persembahan curahan mereka
  rationale: Sufiks Ibrani mengacu pada korban-korban terkait dalam konteks yang lebih luas. Bentuk Indonesia yang dipilih tetap mempertahankan hubungan itu tanpa menghasilkan frasa yang kaku atau menyiratkan bahwa roti-roti tersebut adalah pemilik persembahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur daftar Ibrani dipertahankan, tetapi 'yaitu' ditambahkan untuk memperjelas bahwa kue dan roti tipis adalah isi keranjang. Istilah ritual dipilih secara konsisten dan tidak terlalu teknis.
