base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: id
  text: Kiranya Yahweh memberkatimu dan menjagamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Kiranya ... memberkati engkau
  rationale: Bentuk piel jussif orang ketiga maskulin tunggal dengan akhiran orang kedua maskulin tunggal menyatakan harapan atau permohonan dalam konteks berkat; “kiranya” menyampaikan daya volitif itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: וְיִשְׁמְרֶךָ
  choice: dan menjagamu
  rationale: Bentuk qal jussif orang ketiga maskulin tunggal dengan akhiran orang kedua maskulin tunggal. “Menjagamu” mempertahankan makna perlindungan dan pemeliharaan dengan ungkapan yang ringkas serta alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu, sementara bentuk tradisional “TUHAN” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Kiranya” mempertahankan nuansa berkat atau permohonan, bukan mengubahnya menjadi pernyataan masa depan atau perintah.
