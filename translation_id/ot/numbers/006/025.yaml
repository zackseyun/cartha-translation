  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: id
  text: Kiranya Yahweh membuat wajah-Nya bersinar atasmu dan bermurah hati kepadamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya Yahweh membuat wajah-Nya bercahaya ke arahmu dan menunjukkan kemurahan kepadamu.”'
    reason: Terjemahan alternatif yang mempertahankan arah harfiah אֵלֶיךָ (“ke arahmu”) dan menyatakan חנן sebagai “menunjukkan kemurahan.”
lexical_decisions:
- source_word: יָאֵר
  choice: Kiranya ... membuat ... bersinar
  rationale: 'Bentuk Hifil yusif menyatakan harapan dalam berkat sekaligus nuansa kausatif: Yahweh dimohon membuat wajah-Nya bersinar.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: פָּנָיו
  choice: wajah-Nya
  rationale: Terjemahan konkret ini mempertahankan gambaran antropomorfis Ibrani; makna kehadiran dan perkenanan tidak dijadikan parafrasa dalam teks utama.
- source_word: אֵלֶיךָ
  choice: kepadamu
  rationale: Preposisi אֶל menyatakan arah kepada orang yang menerima berkat; 'kepadamu' alami dalam bahasa Indonesia dan tetap mempertahankan arah tersebut.
- source_word: וִיחֻנֶּךָּ
  choice: dan bermurah hati kepadamu
  rationale: Kata חנן berarti menunjukkan kemurahan atau perkenanan. 'Bermurah hati' menyampaikan tindakan penuh anugerah tanpa mempersempitnya menjadi rasa iba.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Ungkapan antropomorfis tentang wajah Yahweh yang bersinar
  choice: Mempertahankan gambaran wajah yang bersinar dalam teks utama
  alternative: Kiranya Yahweh memandangmu dengan penuh perkenanan
  rationale: Ungkapan Ibrani menghubungkan cahaya wajah dengan perkenanan ilahi. Gambaran puitis itu dipertahankan tanpa mereduksinya menjadi tafsiran abstrak.
- issue: Cakupan makna חנן
  choice: bermurah hati kepadamu
  alternative: menunjukkan kemurahan kepadamu atau mengasihani engkau
  rationale: Pilihan utama mempertahankan makna kemurahan/perkenanan dan tidak membatasi kata itu pada belas kasihan terhadap penderitaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Kiranya' menandai sifat berkat atau harapan; kapitalisasi '-Nya' mengikuti kebiasaan hormat dalam bahasa Indonesia. Pengulangan 'kepadamu' dipertahankan agar kedua tindakan ilahi dalam teks Ibrani tetap jelas.
