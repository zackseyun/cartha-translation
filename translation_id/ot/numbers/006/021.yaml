id: NUM.6.21
reference: Numbers 6:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: id
  text: '“Inilah hukum bagi seorang nazir yang mengucapkan nazar: persembahannya kepada Yahweh sehubungan dengan kenazirannya, selain apa yang mampu diberikannya.[a] Sesuai dengan nazar yang diucapkannya, demikianlah harus dilakukannya menurut hukum kenazirannya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “selain apa yang dapat dicapai tangannya.”'
    reason: Ungkapan Ibrani memakai gambaran tangan yang dapat mencapai sesuatu untuk menyatakan kemampuan atau sarana yang tersedia.
lexical_decisions:
- source_word: תּוֹרַת הַנָּזִיר
  choice: hukum bagi seorang nazir
  rationale: תּוֹרָה dalam konteks ini menunjuk pada ketentuan yang mengatur kehidupan dan persembahan seorang nazir. Istilah teknis נָזִיר dipertahankan sebagai “nazir”, bentuk yang sudah dikenal dalam bahasa Indonesia.
- source_word: אֲשֶׁר יִדֹּר
  choice: yang mengucapkan nazar
  rationale: Ungkapan ini mempertahankan hubungan langsung antara נָזִיר dan tindakan bernazar, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: קָרְבָּנוֹ לַיהוָה
  choice: persembahannya kepada Yahweh
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dipersembahkan kepada Allah; ל menyatakan arah atau peruntukan persembahan itu.
- source_word: עַל נִזְרוֹ
  choice: sehubungan dengan kenazirannya
  rationale: נֵזֶר di sini menunjuk pada keadaan atau masa pengkhususan sebagai nazir. “Sehubungan dengan” mempertahankan cakupan preposisi עַל tanpa mempersempitnya secara tidak perlu.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: selain apa yang mampu diberikannya
  rationale: Idiom harfiah “yang dapat dicapai tangannya” menunjuk pada kemampuan atau sarana seseorang. Pilihan ini menyampaikan maknanya secara wajar, sementara gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: Sesuai dengan nazar yang diucapkannya
  rationale: Pengulangan akar נדר dipertahankan melalui “nazar” dan “diucapkannya”, sehingga sifat mengikat dari nazar tetap tampak tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: כֵּן יַעֲשֶׂה
  choice: demikianlah harus dilakukannya
  rationale: Bentuk imperfek dalam rumusan hukum ini menyatakan kewajiban; “harus” membuat daya normatifnya jelas dalam bahasa Indonesia.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: menurut hukum kenazirannya
  rationale: עַל pada penutup ayat dipahami sebagai kesesuaian dengan ketentuan yang mengatur kenaziran. Terjemahan ini menjaga kaitan dengan תּוֹרַת pada awal ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Makna נִזְרוֹ sebagai status atau nazar kenaziran
  choice: kenazirannya
  alternative: nazar kenazirannya
  rationale: Bentuk Ibrani dapat menunjuk pada pengkhususan atau keadaan sebagai nazir, bukan hanya ucapan nazarnya. “Kenazirannya” mempertahankan keluasan ini dan membedakannya dari נִדְרוֹ, “nazarnya”, dalam klausa berikut.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan bercorak hukum tanpa menjadi kaku. Istilah teknis “nazir” dan “kenaziran” dipertahankan. Tanda titik dua menandai bahwa bagian berikutnya menjabarkan kewajiban orang yang bernazar, sedangkan pengulangan gagasan nazar tetap dipertahankan sesuai susunan Ibrani.
