  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: id
  text: Kemudian orang nazir itu harus mencukur habis rambut kepalanya di pintu masuk Kemah Pertemuan. Ia harus mengambil rambut kenazirannya itu, lalu menaruhnya di atas api yang ada di bawah kurban keselamatan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kurban persekutuan” atau “kurban kesejahteraan.”
    reason: Alternatif leksikal untuk שְׁלָמִים, yang dapat menyiratkan kedamaian, keutuhan, kesejahteraan, atau persekutuan.
lexical_decisions:
- source_word: הַנָּזִיר
  choice: orang nazir
  rationale: Istilah teknis bagi orang yang menjalani nazar khusus dalam pasal ini dipertahankan melalui transliterasi yang lazim, bukan digeneralisasi menjadi sekadar 'orang yang ditahbiskan'.
- source_word: וְגִלַּח
  choice: harus mencukur rambut
  rationale: Kata kerja ini menyatakan tindakan mencukur dalam rangkaian petunjuk ritual. 'Harus' menyampaikan daya instruktif konteks, sedangkan objek 'rambut' dinyatakan agar ungkapannya alami dalam bahasa Indonesia.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: Menyampaikan lokasi ritual secara langsung dan memakai nama tempat yang jelas serta lazim dalam bahasa Indonesia.
- source_word: רֹאשׁ נִזְרוֹ
  choice: rambut di kepalanya yang menjadi tanda kenazirannya
  rationale: Secara harfiah ungkapan ini adalah 'kepala kenazirannya/pengkhususannya'. Dalam konteks, rambut kepala merupakan tanda nyata status nazir; terjemahan ini membuat maksudnya dapat dipahami tanpa menghilangkan kaitannya dengan kenaziran.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: rambut di kepalanya yang menjadi tanda kenazirannya
  rationale: Mempertahankan pengulangan dan hubungan ritual antara rambut, kepala, dan masa kenaziran sambil menghindari ungkapan Indonesia yang kaku seperti 'rambut kepala kenazirannya'.
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: api yang ada di bawah
  rationale: Menerjemahkan hubungan ruang secara langsung tanpa mencoba menentukan lebih jauh susunan altar atau tempat memasaknya.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: kurban keselamatan
  rationale: Istilah ini mempertahankan nama kategori kurban yang sudah dikenal dalam bahasa Alkitab Indonesia. Karena שְׁלָמִים juga dapat menonjolkan persekutuan atau kesejahteraan, alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan atau kurban kesejahteraan
  rationale: Istilah Ibrani menunjuk kategori kurban tertentu dan memiliki rentang makna yang berkaitan dengan kedamaian, keutuhan, kesejahteraan, serta persekutuan. Pilihan utama memakai istilah Indonesia yang mapan, sementara catatan kaki menjaga kemungkinan nuansa lainnya tanpa mempersempit maknanya secara teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'orang nazir' dipakai sebagai istilah teknis; 'Kemah Pertemuan' dipertahankan sebagai nama tempat ibadah. Penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskannya.
