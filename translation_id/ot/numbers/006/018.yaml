revisions:
- from: Kemudian orang nazir itu harus mencukur rambut di kepalanya yang menjadi tanda kenazirannya di pintu masuk Kemah Pertemuan. Ia harus mengambil rambut di kepalanya yang menjadi tanda kenazirannya itu, lalu menaruhnya di atas api yang ada di bawah kurban keselamatan.[a]
  to: Kemudian orang nazir itu harus mencukur habis rambut kepalanya di pintu masuk Kemah Pertemuan. Ia harus mengambil rambut kenazirannya itu, lalu menaruhnya di atas api yang ada di bawah kurban keselamatan[a].
  rationale: Revisi menghapus penambahan interpretatif “tanda,” merapikan ungkapan tindakan mencukur ke bentuk Indonesia yang idiomatis, dan mempertahankan hubungan ritual rambut dengan kenaziran melalui “rambut kenazirannya.” Istilah tempat dan kategori kurban dipertahankan; catatan kaki tetap menyajikan alternatif yang sah untuk שְׁלָמִים.
  reviewer_model: gpt-5.6-terra
