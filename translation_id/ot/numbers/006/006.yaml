id: NUM.6.6
reference: Numbers 6:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: id
  text: Sepanjang masa pengkhususannya bagi TUHAN[a], ia tidak boleh mendekati mayat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “masa kenazirannya” atau “pentahbisannya.” Istilah Ibrani ini menunjuk pada keadaan atau masa seseorang dipisahkan sebagai nazir.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “nefesy yang mati”; maksudnya ialah mayat atau jasad manusia yang telah mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Sepanjang masa
  rationale: Ungkapan ini menyatakan keseluruhan jangka waktu pengkhususan; bentuk Indonesia ini alami dan tetap mempertahankan daya cakup כָּל.
- source_word: הַזִּירוֹ
  choice: pengkhususannya
  rationale: Kata dari akar נזר menunjuk pada keadaan atau masa seseorang dipisahkan sebagai nazir. Pilihan ini dekat dengan makna sumber tanpa menambahkan kata 'nazar' yang tidak dinyatakan oleh nomina tersebut.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Preposisi ל menandai arah atau tujuan pengabdian kepada YHWH. 'Bagi TUHAN' secara alami menyampaikan makna dedikasi dalam bahasa Indonesia.
- source_word: עַל ... לֹא יָבֹא
  choice: tidak boleh mendekati
  rationale: Dalam konstruksi ini, בוא dengan עַל menyatakan datang mendekat kepada sesuatu. Bentuk larangan 'tidak boleh' sesuai dengan konteks hukum.
- source_word: נֶפֶשׁ מֵת
  choice: mayat
  rationale: Secara harfiah berarti 'nefesy yang mati', tetapi dalam konteks hukum kenajisan ungkapan ini menunjuk pada jasad manusia yang telah mati. 'Mayat' ringkas, jelas, dan alami.
theological_decisions:
- issue: Istilah bagi keadaan atau masa kenaziran
  choice: pengkhususannya
  alternative: masa kenazirannya; nazarnya sebagai nazir; pentahbisannya
  rationale: Teks Ibrani terkait langsung dengan lembaga nazir, tetapi nomina di sini terutama menyatakan keadaan atau masa dipisahkan. Pilihan utama mempertahankan keluasan itu dan tidak menyisipkan 'nazar' ke dalam teks utama.
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh; Yehuwa
  rationale: TUHAN merupakan bentuk baku dan bermartabat dalam tradisi Alkitab bahasa Indonesia untuk nama perjanjian YHWH, sekaligus membedakannya secara tipografis dari gelar Tuhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sepanjang masa' menghindari ungkapan kaku 'sepanjang seluruh hari-hari', sedangkan 'tidak boleh' menyampaikan larangan hukum secara jelas bagi pembaca umum.
