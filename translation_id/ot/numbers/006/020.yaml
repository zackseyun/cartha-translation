  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: id
  text: Imam harus mengunjukkan semuanya sebagai persembahan unjukan di hadapan Yahweh. Semuanya itu menjadi bagian kudus bagi imam, selain dada persembahan unjukan dan paha persembahan khusus[a]. Sesudah itu, orang nazir boleh minum anggur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “paha persembahan yang diangkat.” Istilah Ibrani תְּרוּמָה menunjuk pada bagian yang dipisahkan atau diserahkan sebagai persembahan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang nazir akan minum anggur.” Bentuk Ibraninya dapat diterjemahkan demikian secara lebih harfiah, tetapi konteksnya menunjukkan bahwa setelah nazarnya selesai ia kembali diperbolehkan minum anggur.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: mengunjukkan ... sebagai persembahan unjukan
  rationale: Bentuk Hifil dari נוּף dan nomina serumpunnya menunjuk pada tindakan ritual mempersembahkan dengan unjukan. Ungkapan ini mempertahankan hubungan kata dalam bahasa Ibrani dan memakai istilah kurban yang dikenal dalam bahasa Indonesia.
- source_word: אוֹתָם
  choice: semuanya
  rationale: Kata ganti jamak ini merujuk kembali pada paha depan yang direbus, roti bundar tidak beragi, dan roti tipis dalam ayat sebelumnya. 'Semuanya' membuat rujukan jamaknya jelas dan alami.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: '''Di hadapan'' merupakan padanan alami bagi ungkapan kultis לִפְנֵי, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ''Yahweh''.'
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Persembahan itu kudus bagi imam
  rationale: Kata ganti tunggal הוּא dipertahankan melalui rujukan kolektif 'persembahan itu'; frasa ini menyatakan bahwa bagian tersebut dikhususkan bagi imam.
- source_word: עַל
  choice: di samping
  rationale: Dalam rumusan pembagian kurban ini, עַל menyatakan tambahan pada bagian-bagian yang sudah menjadi hak imam, bukan posisi fisik.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: dada persembahan unjukan
  rationale: Ini adalah sebutan teknis bagi bagian dada kurban yang dipersembahkan dengan ritus unjukan.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: paha persembahan khusus
  rationale: שׁוֹק menunjuk pada bagian kaki atas atau paha, sedangkan תְּרוּמָה adalah bagian yang diangkat, dipisahkan, atau diserahkan sebagai persembahan. 'Persembahan khusus' jelas dalam bahasa Indonesia dan menandai bagian yang dikhususkan.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Ungkapan ini menandai urutan waktu setelah selesainya ritus pelepasan nazar.
- source_word: יִשְׁתֶּה הַנָּזִיר יָיִן
  choice: orang nazir boleh minum anggur
  rationale: Dalam konteks berakhirnya pantangan nazar, bentuk imperfek menyatakan bahwa izin untuk minum anggur telah dipulihkan. 'Orang nazir' adalah sebutan yang ringkas dan lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה. 'Yahweh' mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Daya modal יִשְׁתֶּה pada klausa penutup
  choice: boleh minum anggur
  alternative: akan minum anggur
  rationale: Konteks hukum ini membahas berakhirnya larangan selama masa kenaziran. Terjemahan 'boleh' menyampaikan izin yang dipulihkan tanpa menjadikannya perintah untuk minum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang bermartabat. Istilah 'persembahan unjukan', 'persembahan khusus', dan 'orang nazir' dipakai secara konsisten; struktur kalimat dibuat jelas bagi pembaca umum tanpa menghapus istilah kultis sumber.
