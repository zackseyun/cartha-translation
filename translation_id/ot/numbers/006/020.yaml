    issue: '"Persembahan itu kudus bagi imam"'
    rationale: Ungkapan ini dapat dipahami, tetapi "menjadi bagian kudus bagi imam" secara lebih idiomatis menyatakan bahwa bagian tersebut dikhususkan sebagai hak imam, sesuai rumusan hukum Ibrani.
