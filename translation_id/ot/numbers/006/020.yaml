  naturalness: Bahasa ritualnya baku dan mudah dipahami. "Mengunjukkan," "persembahan unjukan," dan "persembahan khusus" adalah istilah yang wajar dalam register Alkitab Indonesia. Penggantian "di samping" dengan "selain" menghilangkan kemungkinan salah paham.
  terminology: '"Yahweh," "imam," "orang nazir," "anggur," "persembahan unjukan," dan "persembahan khusus" digunakan secara konsisten. Catatan a secara tepat memberi padanan alternatif "persembahan yang diangkat" bagi תְּרוּמָה; catatan b dengan tepat menandai pembacaan yang lebih harfiah atas bentuk imperfek.'
