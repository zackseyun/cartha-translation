lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר melanjutkan alur narasi dan memperkenalkan perkataan ilahi. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang menerima firman; “kepada Musa” adalah susunan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Infinitif לֵאמֹר memperkenalkan kutipan langsung yang dimulai pada ayat berikutnya. Fungsi ini sudah tersirat secara alami oleh koma setelah “berfirman kepada Musa”; menerjemahkannya sebagai “demikian” akan menambah unsur yang tidak eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Bentuk “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” adalah penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula ujaran Ibrani dialihkan secara alami; koma mempertahankan keterkaitannya dengan perkataan langsung dalam ayat berikutnya.
