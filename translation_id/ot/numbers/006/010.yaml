  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: id
  text: Pada hari kedelapan ia harus membawa dua ekor burung tekukur atau dua ekor burung merpati muda[a] kepada imam di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "dua anak merpati"; ungkapan Ibrani ini dapat merujuk kepada merpati atau burung dara yang muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Ungkapan waktu ini secara alami diterjemahkan demikian dalam bahasa Indonesia. Konjungsi ו dapat tidak dinyatakan secara eksplisit karena kesinambungan dengan ayat sebelumnya sudah jelas.
- source_word: יָבִא
  choice: ia harus membawa
  rationale: Bentuk Hifil imperfek dalam konteks hukum menyatakan kewajiban; 'harus membawa' mempertahankan daya preskriptifnya dalam bahasa Indonesia modern.
- source_word: שְׁתֵּי תֹרִים
  choice: dua ekor burung tekukur
  rationale: תֹרִים menunjuk pada burung tekukur, bukan sekadar burung merpati secara umum; kata penggolong 'ekor' menghasilkan ungkapan Indonesia yang alami.
- source_word: אוֹ
  choice: atau
  rationale: Konjungsi disjungtif ini menyatakan pilihan persembahan yang diizinkan.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dua ekor anak burung merpati
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'dua anak merpati' merupakan sebutan idiomatis bagi burung merpati yang masih muda.
- source_word: אֶל הַ/כֹּהֵן
  choice: kepada imam
  rationale: Preposisi אֶל menandai pihak yang menerima hewan-hewan tersebut; 'kepada imam' jelas dan alami.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ke pintu Kemah Pertemuan
  rationale: פֶּתַח berarti pintu atau jalan masuk. 'Kemah Pertemuan' adalah padanan baku dan transparan bagi אֹהֶל מוֹעֵד.
