  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: id
  text: Demikianlah mereka akan menaruh nama-Ku atas orang Israel[a], dan Aku sendiri akan memberkati mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel.” Ungkapan “menaruh nama-Ku atas” kemungkinan menunjuk pada penyeruan nama TUHAN atas mereka dan penandaan mereka sebagai umat milik-Nya.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: Demikianlah mereka harus menaruh
  rationale: Kata שׂוּם berarti ‘menaruh, menempatkan’. ‘Demikianlah’ menghubungkan ayat ini dengan berkat imam sebelumnya, sedangkan ‘harus menaruh’ menyampaikan daya instruktif bentuk verba Ibrani.
- source_word: אֶת שְׁמִי עַל
  choice: nama-Ku atas
  rationale: Terjemahan ini mempertahankan metafora konkret dalam bahasa Ibrani tanpa mempersempit maknanya menjadi sekadar pengucapan, wewenang, atau kepemilikan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan harfiahnya ‘anak-anak lelaki Israel’, tetapi dalam konteks ini merupakan sebutan kolektif bagi umat Israel. ‘Keturunan Israel’ alami dalam bahasa Indonesia, tetap mencerminkan hubungan dengan leluhur Israel, dan mencakup seluruh komunitas.
- source_word: וַאֲנִי
  choice: dan Aku sendiri
  rationale: Pronomina mandiri אֲנִי memberi penekanan; ‘Aku sendiri’ menyampaikan penegasan bahwa TUHANlah yang memberkati.
- source_word: אֲבָרֲכֵם
  choice: akan memberkati mereka
  rationale: Bentuk ini menyatakan tindakan ilahi yang dijanjikan; ‘mereka’ mengacu kepada keturunan Israel secara kolektif.
theological_decisions:
- issue: Makna menaruh nama Allah atas Israel
  choice: Mempertahankan ungkapan konkret ‘menaruh nama-Ku atas’
  alternative: ‘menyerukan nama-Ku atas’ atau ‘menandai mereka sebagai milik-Ku’
  rationale: Ungkapan itu dapat mencakup pemanggilan nama perjanjian TUHAN, identitas umat sebagai milik-Nya, dan berkat-Nya. Terjemahan utama mempertahankan keluasan makna tersebut tanpa menetapkan hanya satu tafsiran.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: ‘anak-anak Israel’, ‘orang Israel’, atau ‘umat Israel’
  rationale: Dalam konteks ini, bentuk maskulin jamak berfungsi sebagai sebutan kolektif bagi seluruh umat perjanjian, bukan hanya kaum laki-laki. Pilihan ini alami sekaligus dekat dengan citra kekerabatan dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi ‘nama-Ku’ dan ‘Aku’ mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah. Susunan kalimat mempertahankan penekanan pada tindakan para imam dan pada Allah sebagai pemberi berkat.
