source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: id
  text: Selama seluruh masa nazarnya sebagai seorang nazir[a], pisau cukur tidak boleh menyentuh kepalanya.[b] Hingga genap hari-hari ketika ia mengkhususkan diri kepada Yahweh, ia harus kudus; ia harus membiarkan rambut kepalanya tumbuh panjang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nazar pengkhususannya.” Kata Ibrani yang mendasari istilah “nazir” mengandung gagasan pemisahan atau pengkhususan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pisau cukur tidak boleh melintas di atas kepalanya,” yaitu ia tidak boleh mencukur rambut kepalanya.
    reason: idiom_explanation
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: masa nazarnya sebagai nazir
  rationale: Ungkapan ini mempertahankan istilah teknis ‘nazir’ sekaligus memperjelas bahwa yang dimaksud ialah masa berlakunya nazar pengkhususan.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: pisau cukur tidak boleh menyentuh kepalanya
  rationale: Terjemahan ini mempertahankan gambaran pisau cukur sebagai subjek, tetapi mengungkapkan larangan tersebut secara wajar dalam bahasa Indonesia; arti praktisnya dijelaskan dalam catatan kaki.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: sampai genap hari-hari
  rationale: ‘Genap’ menyampaikan gagasan penuh atau selesainya masa yang ditentukan, sedangkan ‘hari-hari’ mempertahankan bentuk konkret teks Ibrani.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: selama ia mengkhususkan diri bagi Yahweh
  rationale: Bentuk kausatif dari נזר menyatakan tindakan memisahkan atau mengkhususkan diri. ‘Mengkhususkan diri’ alami dalam bahasa Indonesia dan tetap menunjukkan arah pengabdian kepada Yahweh.
- source_word: קָדֹשׁ יִהְיֶה
  choice: ia harus kudus
  rationale: ‘Kudus’ mempertahankan istilah teologis utama קָדֹשׁ, sedangkan ‘harus’ sesuai dengan daya wajib ketentuan hukum dalam konteks ini.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: ia harus membiarkan rambut kepalanya tumbuh panjang
  rationale: Ungkapan ini menyampaikan bahwa rambut dibiarkan tumbuh tanpa dipangkas, dengan susunan yang alami dan jelas bagi pembaca Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama perjanjian יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יהוה secara langsung; ‘Yahweh’ mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Mempertahankan istilah קדוש
  choice: ia harus kudus
  alternative: ia harus dikhususkan
  rationale: Karena teks secara eksplisit memakai קָדֹשׁ, ‘kudus’ mempertahankan bobot leksikal dan teologisnya. Konteks nazar sudah menerangkan aspek pengkhususan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis ‘nazir’ dipertahankan, sedangkan susunan kalimat dibuat cukup alami bagi pembaca umum. Pengulangan ‘hari-hari’ sengaja dipertahankan untuk mencerminkan bentuk konkret teks Ibrani.
