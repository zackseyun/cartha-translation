id: NUM.6.2
reference: Numbers 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: id
  text: '“Berbicaralah kepada bani Israel dan katakan kepada mereka: Apabila seorang laki-laki atau perempuan mengucapkan nazar khusus[a], yaitu nazar orang nazir, untuk mengkhususkan dirinya bagi Yahweh[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memisahkan dirinya dengan mengucapkan nazar seorang nazir.”'
    reason: lexical_alternative
  - marker: b
    text: “Nazir” adalah orang yang secara khusus dipisahkan bagi Yahweh berdasarkan suatu nazar.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Mempertahankan ungkapan kekeluargaan Ibrani secara ringkas dan wajar dalam ragam Alkitab Indonesia; sapaan ini mencakup umat Israel secara keseluruhan.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: seorang laki-laki atau perempuan
  rationale: Teks Ibrani secara eksplisit menyebut kedua jenis kelamin, sehingga keduanya dipertahankan.
- source_word: כִּי
  choice: apabila
  rationale: Dalam rumusan hukum kasuistik, 'apabila' menyampaikan kondisi dengan alami tanpa menyiratkan bahwa hal itu pasti terjadi.
- source_word: יַפְלִא לִנְדֹּר נֶדֶר
  choice: mengucapkan nazar khusus
  rationale: Bentuk Hifil יַפְלִא menunjukkan tindakan yang istimewa atau khusus, sedangkan konstruksi verba dan nomina serumpun berikutnya menyatakan tindakan bernazar.
- source_word: נֶדֶר נָזִיר
  choice: nazar orang nazir
  rationale: Mempertahankan hubungan konstruksi Ibrani dan istilah teknis נָזִיר, dengan ejaan Indonesia 'nazir'.
- source_word: לְהַזִּיר
  choice: untuk mengkhususkan dirinya
  rationale: Verba ini menyatakan pemisahan atau pengkhususan diri bagi tujuan keagamaan. 'Mengkhususkan dirinya' mempertahankan unsur pemisahan sekaligus dedikasi.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'; preposisi לְ menyatakan arah atau peruntukan pengkhususan itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi dan sejalan dengan lapisan konsultasi yang diberikan.
- issue: Cakupan gender dalam ketentuan nazar
  choice: seorang laki-laki atau perempuan ... dirinya
  alternative: seseorang ... dirinya
  rationale: Penyebutan eksplisit laki-laki dan perempuan dipertahankan. Pronomina Indonesia 'dirinya' tidak menambahkan gender dan secara alami merujuk kepada siapa pun dari kedua pihak yang bernazar.
- issue: Makna pengkhususan seorang nazir
  choice: mengkhususkan dirinya bagi Yahweh
  alternative: memisahkan dirinya untuk Yahweh
  rationale: '''Mengkhususkan'' menyampaikan dedikasi religius tanpa menghilangkan gagasan dipisahkan bagi suatu tujuan; catatan menjelaskan istilah teknisnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dipertahankan dengan 'apabila'; istilah 'nazar' dan 'nazir' dipakai sebagai istilah keagamaan yang mapan. Tanda koma penutup menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
