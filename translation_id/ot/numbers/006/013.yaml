base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: id
  text: 'Dan inilah hukum tentang nazir: pada hari berakhirnya masa kenazirannya[a], ia harus dibawa[b] ke pintu masuk Kemah Pertemuan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pada hari genapnya hari-hari pemisahan dirinya.” Ungkapan ini juga dapat diterjemahkan “pada hari berakhirnya masa nazarnya” atau “pada hari berakhirnya masa pengkhususannya.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, verba Ibrani berbentuk aktif: “ia akan/harus membawa dia.” Namun, subjek yang membawa tidak dinyatakan dengan jelas dalam ayat ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת
  choice: Dan inilah hukum mengenai
  rationale: Ungkapan ini memperkenalkan ketentuan ritual. “Dan” mempertahankan daya penghubung וְ, sedangkan “hukum mengenai” menyampaikan fungsi תּוֹרָה dalam konteks hukum keimaman dengan bahasa Indonesia yang wajar.
- source_word: הַנָּזִיר
  choice: seorang nazir
  rationale: “Nazir” dipertahankan sebagai istilah teknis bagi orang yang menjalani ketentuan khusus dalam Bilangan 6, bukan diganti dengan sebutan umum yang dapat mengaburkan lembaganya.
- source_word: בְּיוֹם מְלֹאת יְמֵי נִזְרוֹ
  choice: Pada hari masa kenazirannya genap
  rationale: Rumusan ini mempertahankan ungkapan temporal formal dan gagasan bahwa seluruh jangka waktu kenaziran telah lengkap, tanpa memaksakan apakah נִזְרוֹ terutama menunjuk pada nazar, pemisahan diri, atau pengkhususan.
- source_word: יָבִיא אֹתוֹ
  choice: ia harus dibawa
  rationale: Bentuk Ibrani secara tata bahasa aktif, tetapi subjek yang membawa tidak dinyatakan dengan jelas. Bentuk pasif Indonesia menyampaikan tindakan prosedural secara alami sambil mempertahankan fokus pada orang nazir; bentuk aktif dicatat dalam catatan kaki.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ke pintu masuk Kemah Pertemuan
  rationale: “Pintu masuk” merupakan padanan alami bagi פֶּתַח, dan “Kemah Pertemuan” adalah padanan baku serta tepat bagi nama tempat kudus אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Makna istilah נָזִיר dan נִזְרוֹ
  choice: Memakai istilah teknis “nazir” dan “masa kenazirannya”
  alternative: “orang yang dikhususkan” dan “masa pengkhususannya”, atau “masa nazarnya”
  rationale: Istilah “nazir” menjaga kekhususan pranata Israel dalam Bilangan 6. “Masa kenazirannya” juga mempertahankan cakupan makna yang dapat meliputi nazar, pemisahan diri, dan pengkhususan tanpa memilih salah satunya secara sepihak.
- issue: Diatesis יָבִיא אֹתוֹ
  choice: 'Menerjemahkannya secara pasif: “ia harus dibawa”'
  alternative: 'Menerjemahkannya secara aktif: “ia harus membawa orang itu” atau “seseorang harus membawanya”'
  rationale: Teks Ibrani memakai verba aktif dengan objek “dia”, tetapi identitas subjeknya tidak eksplisit. Bentuk pasif menghasilkan bahasa Indonesia yang alami dan tidak menambahkan pelaku yang tidak disebutkan, sedangkan bentuk formal Ibraninya tetap dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa yang digunakan bersifat modern, formal, dan mudah dipahami. “Nazir” serta “Kemah Pertemuan” dipertahankan sebagai istilah teknis Alkitabiah, sementara susunan kalimat dibuat alami dalam bahasa Indonesia. Ambiguitas mengenai masa kenaziran dan pelaku tindakan membawa dijaga melalui catatan kaki.
