base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: id
  text: Bahkan terhadap ayahnya, ibunya, saudara laki-lakinya, atau saudara perempuannya, ia tidak boleh menjadi najis ketika mereka mati,[a] sebab tanda bahwa ia dikhususkan bagi Allahnya ada di atas kepalanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak boleh menajiskan dirinya karena mereka pada waktu mereka mati.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani nezer dalam konteks nazir menunjuk pada tanda atau keadaan pengkhususan bagi Allah, yang dilambangkan oleh rambut di kepalanya.
    reason: cultural_note
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: bahkan karena ayahnya atau ibunya, saudara laki-lakinya atau saudara perempuannya
  rationale: Frasa-frasa berpreposisi ditempatkan setelah larangan agar penekanannya alami dalam bahasa Indonesia. Istilah kekerabatan tunggal dan pembedaan gender dipertahankan.
- source_word: לֹא יִטַּמָּא
  choice: Ia tidak boleh menajiskan dirinya
  rationale: Bentuk Hitpael bernuansa refleksif. Ungkapan ini mempertahankan tindakan terhadap diri sendiri; konteks dan catatan register menegaskan bahwa kenajisan yang dimaksud bersifat ritual, bukan penilaian moral.
- source_word: לָהֶם בְּמֹתָם
  choice: karena kematian mereka
  rationale: Merujuk kembali kepada kerabat yang disebutkan dan menyatakan kematian mereka sebagai keadaan yang dapat mendatangkan kenajisan. Bentuk nominal bahasa Ibrani dipertahankan secara alami.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi larangan tersebut dengan penghubung kausal yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: נֵזֶר אֱלֹהָיו
  choice: tanda pengkhususannya bagi Allah
  rationale: Dalam konteks nazir, נֵזֶר menunjuk pada status atau tanda pengkhususan bagi Allah, yang tampak melalui rambut di kepala. Rumusan ini menghindari kesan bahwa yang dimaksud semata-mata mahkota fisik dan menyampaikan hubungan personal melalui akhiran posesif pada 'pengkhususannya'.
- source_word: עַל רֹאשׁוֹ
  choice: ada di kepalanya
  rationale: Mempertahankan gambaran konkret dan singkat tentang tanda pengkhususan yang berada di kepala seorang nazir.
theological_decisions:
- issue: Sifat kenajisan dalam hukum nazir
  choice: Larangan diterjemahkan sebagai kenajisan ritual akibat bersentuhan dengan kematian.
  alternative: Memakai ungkapan yang terutama menyiratkan pencemaran atau dosa moral.
  rationale: Konteksnya adalah hukum kemurnian ritual bagi seorang nazir. Teks tidak menyatakan bahwa kematian kerabat atau tindakan berkabung itu sendiri merupakan dosa moral.
- issue: Makna נֵזֶר dalam konteks nazir
  choice: Dipahami sebagai tanda atau keadaan pengkhususan bagi Allah yang terkait dengan rambut di kepala.
  alternative: Diterjemahkan hanya sebagai 'mahkota' atau hanya sebagai rambut fisik.
  rationale: Kata tersebut mempertahankan hubungan antara pengkhususan dan tanda yang terlihat tanpa menyamakan seluruh maknanya dengan benda fisik semata.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tanda pisah mengapit daftar kerabat untuk mempertahankan penekanannya tanpa menghasilkan susunan yang kaku. 'Najis' dipakai dalam arti ritual sesuai konteks hukum Taurat.
