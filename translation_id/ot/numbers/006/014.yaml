id: NUM.6.14
reference: Numbers 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: id
  text: 'dan ia harus mempersembahkan persembahannya kepada Yahweh: seekor anak domba jantan berumur satu tahun yang tidak bercacat sebagai kurban bakaran, seekor anak domba betina berumur satu tahun yang tidak bercacat sebagai kurban dosa[a], dan seekor domba jantan yang tidak bercacat sebagai kurban kesejahteraan[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian.” Istilah Ibrani חַטָּאת dapat merujuk pada dosa dan juga pada kurban yang berkaitan dengan pemurnian dari kenajisan atau pelanggaran.
    reason: alternative_reading
  - marker: b
    text: Atau “kurban damai” atau “kurban persekutuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: dan ia harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa mendekat atau mempersembahkan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan corak ketentuan ritual.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: Menunjuk pada pemberian kurban yang dibawa kepada Allah; 'persembahan' merupakan padanan umum dan jelas.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai 'Yahweh' dan mempertahankan arah persembahan yang ditandai oleh ל.
- source_word: כֶּבֶשׂ ... בֶּן שְׁנָתוֹ
  choice: seekor anak domba jantan berumur satu tahun
  rationale: כֶּבֶשׂ menunjukkan anak domba jantan, sedangkan idiom בֶּן שְׁנָתוֹ menunjukkan usia satu tahun. Jenis kelamin dibuat eksplisit karena dibedakan dari hewan betina berikutnya.
- source_word: תָמִים / תְּמִימָה
  choice: yang tidak bercacat
  rationale: Dalam peraturan kurban, istilah ini menyatakan hewan yang bebas dari cacat; padanan yang sama digunakan untuk bentuk maskulin dan feminin.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah kategori kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan istilah Indonesia yang ringkas dan dikenal.
- source_word: וְכַבְשָׂה ... בַּת שְׁנָתָהּ
  choice: seekor anak domba betina berumur satu tahun
  rationale: כַבְשָׂה secara khusus menunjukkan anak domba betina, dan בַּת שְׁנָתָהּ adalah bentuk feminin untuk usia satu tahun.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: חַטָּאת dalam konteks ini menunjuk pada jenis kurban. Padanan utama mempertahankan kaitan leksikalnya dengan dosa, sementara fungsi pemurniannya dicatat dalam catatan kaki.
- source_word: וְאַיִל אֶחָד
  choice: dan seekor domba jantan
  rationale: אַיִל berarti domba jantan dewasa; 'seekor' secara alami menyampaikan bilangan אֶחָד dalam daftar ini.
- source_word: לִשְׁלָמִים
  choice: sebagai kurban keselamatan
  rationale: שְׁלָמִים adalah kategori kurban yang berkaitan dengan keadaan damai, kesejahteraan, dan persekutuan. 'Kurban keselamatan' mempertahankan istilah tradisional tanpa menutup alternatif maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah tersebut dapat menonjolkan dosa maupun fungsi pemurnian. Teks utama mempertahankan hubungan transparan dengan dosa, sementara alternatif fungsional dicatat agar ketegangan maknanya tidak dihapus.
- issue: Makna שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban kesejahteraan atau kurban persekutuan
  rationale: Istilah Ibrani mencakup nuansa damai, kesejahteraan, dan persekutuan. Pilihan utama memakai istilah yang ringkas dan dikenal, sedangkan keluasan maknanya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum-ritual yang tetap wajar bagi pembaca umum. Konjungsi awal 'dan' dipertahankan untuk mencerminkan kesinambungan teks Ibrani. Penggolong 'seekor' digunakan secara alami, dan istilah kurban dibuat konsisten.
