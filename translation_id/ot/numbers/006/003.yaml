source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: id
  text: ia harus menjauhkan diri dari anggur dan minuman memabukkan; ia tidak boleh minum cuka yang dibuat dari anggur ataupun cuka yang dibuat dari minuman memabukkan. Ia juga tidak boleh minum cairan apa pun dari rendaman buah anggur[a] atau makan buah anggur, baik yang segar maupun yang kering[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "cairan apa pun dari buah anggur" atau "jus anggur apa pun"; istilah Ibraninya dapat menunjuk cairan yang berasal dari buah anggur yang direndam atau diolah.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: "buah anggur yang segar dan yang kering"; buah anggur kering adalah kismis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: ia harus menjauhkan diri dari anggur dan minuman memabukkan
  rationale: Bentuk Hifil יַזִּיר dalam hukum nazir menyatakan tindakan berpantang atau menjauhkan diri. 'Menjauhkan diri' alami dalam bahasa Indonesia dan tetap mempertahankan gagasan pemisahan. יַיִן berarti anggur, sedangkan שֵׁכָר adalah minuman yang memabukkan selain anggur biasa.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: cuka yang dibuat dari anggur ataupun cuka yang dibuat dari minuman memabukkan
  rationale: חֹמֶץ dapat menunjuk minuman yang menjadi asam atau cuka. Frasa 'yang dibuat dari' memperjelas hubungan konstruksi Ibrani tanpa menentukan proses pembuatannya secara berlebihan.
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  choice: cairan apa pun dari rendaman buah anggur
  rationale: מִשְׁרָה menunjuk cairan hasil perendaman atau pengolahan dengan merendam. Terjemahan ini lebih dekat daripada sekadar 'jus anggur' dan mempertahankan keluasan kemungkinan maknanya.
- source_word: וַעֲנָבִים לַחִים וִיבֵשִׁים
  choice: buah anggur, baik yang segar maupun yang kering
  rationale: Secara harfiah, teks menyebut buah anggur 'segar dan kering'. Dalam konteks larangan, pasangan 'baik ... maupun ...' menyampaikan cakupan kedua jenis tersebut secara alami.
- source_word: לֹא יִשְׁתֶּה ... לֹא יֹאכֵל
  choice: tidak boleh minum ... atau makan
  rationale: Bentuk imperfek dengan לֹא dalam perundang-undangan menyatakan larangan. 'Tidak boleh' merupakan padanan Indonesia modern yang jelas.
