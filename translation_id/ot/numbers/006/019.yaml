  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: id
  text: Kemudian imam harus mengambil bahu yang direbus dari domba jantan itu, satu roti tidak beragi dari keranjang, dan satu roti tipis tidak beragi, lalu meletakkan semuanya di atas kedua telapak tangan orang nazir itu setelah ia mencukur rambut kenazirannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setelah ia mencukur kenazirannya.” Dalam konteks ini, yang dimaksud ialah rambut yang menjadi tanda kenazirannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Waw dengan bentuk perfektif dalam rangkaian ketentuan ritual menyatakan langkah berikutnya; bentuk ini menyampaikan urutan dan sifat instruksionalnya secara alami dalam bahasa Indonesia.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: paha depan yang sudah dimasak
  rationale: זְרוֹעַ menunjuk bagian kaki depan/bahu hewan dalam konteks kurban. Istilah 'paha depan' lazim dipahami sebagai potongan daging ritual, sedangkan בְּשֵׁלָה menyatakan bahwa bagian itu telah dimasak; kata Ibrani dapat mencakup memasak atau merebus.
- source_word: מִן הָאַיִל
  choice: dari domba jantan itu
  rationale: מִן menyatakan asal potongan tersebut, dan artikel tentu pada אַיִל dipertahankan dengan 'itu'.
- source_word: חַלַּת מַצָּה אַחַת
  choice: satu roti bundar tidak beragi
  rationale: חַלָּה adalah roti atau kue roti, kemungkinan berbentuk bundar; 'roti bundar' membedakannya dari רְקִיק yang tipis tanpa memberi kesan kue manis modern.
- source_word: מִן הַסַּל
  choice: dari keranjang
  rationale: Terjemahan langsung dan alami dari frasa yang menyatakan tempat asal roti.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: dan satu roti tipis tidak beragi
  rationale: רְקִיק menunjuk roti yang tipis. 'Roti tipis' lebih jelas bagi pembaca Indonesia modern daripada istilah serapan yang dapat mengesankan biskuit manis.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: lalu meletakkan semuanya di atas kedua telapak tangan
  rationale: כַּפֵּי adalah bentuk yang menunjuk kedua telapak tangan. 'Semuanya' memperjelas bahwa ketiga benda yang baru disebut menjadi objek tindakan וְנָתַן, tanpa menambah unsur ritual baru.
- source_word: הַנָּזִיר
  choice: orang nazir
  rationale: Istilah 'nazir' mempertahankan sebutan khusus bagi orang yang menjalani nazar kenaziran, dengan 'orang' agar frasa alami dalam bahasa Indonesia.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: setelah ia mencukur
  rationale: Konstruksi infinitif dengan אַחַר membentuk keterangan waktu dan menunjukkan tindakan mencukur yang mendahului tindakan imam.
theological_decisions:
- issue: Makna נִזְרוֹ dalam tindakan pencukuran orang nazir
  choice: rambut kenazirannya
  alternative: kenazirannya; tanda kenazirannya; rambut yang dikhususkan itu
  rationale: Secara harfiah נִזְרוֹ berarti 'kenazirannya/pengkhususannya', tetapi sebagai objek tindakan mencukur dalam konteks ini kata itu merujuk secara metonimis pada rambut yang menjadi tanda pengkhususan orang nazir. Terjemahan ini membuat tindakan fisiknya jelas sambil mempertahankan kaitannya dengan status kenaziran; catatan kaki mencatat bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ritual yang bermartabat tetapi tetap mudah dipahami. Istilah khusus 'nazir' dipertahankan, sedangkan jenis-jenis roti dibedakan dengan kata sehari-hari 'bundar' dan 'tipis'. Istilah 'sudah dimasak' mempertahankan keluasan makna sumber; 'direbus' juga mungkin, tetapi lebih sempit.
