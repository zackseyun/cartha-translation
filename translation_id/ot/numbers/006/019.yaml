  to: Kemudian imam harus mengambil bahu yang direbus dari domba jantan itu, satu roti tidak beragi dari keranjang, dan satu roti tipis tidak beragi, lalu meletakkan semuanya di atas kedua telapak tangan orang nazir itu setelah ia mencukur rambut kenazirannya.[a]
