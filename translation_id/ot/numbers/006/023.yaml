  text: 'Berbicaralah kepada Harun dan kepada putra-putranya dengan mengatakan: “Beginilah kalian harus memberkati orang Israel. Katakanlah kepada mereka,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif piel 2ms yang memerintahkan Musa menyampaikan firman secara langsung; bentuk ini wajar dalam rumusan pengutusan ilahi.
- source_word: וְאֶל בָּנָיו
  choice: dan anak-anaknya
  rationale: Dalam konteks ini menunjuk kepada putra-putra Harun yang menjalankan tugas keimaman. Bahasa Indonesia lazim memakai “anak-anaknya” tanpa harus menghilangkan makna kontekstual tersebut.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif pengutip ini secara alami diwakili tanda titik dua dalam bahasa Indonesia, tanpa pengulangan kaku seperti “dengan mengatakan”.
- source_word: כֹּה
  choice: Beginilah
  rationale: Memperkenalkan cara atau rumusan berkat yang ditetapkan; lebih alami daripada “demikianlah” sambil mempertahankan daya preskriptif.
- source_word: תְבָרֲכוּ
  choice: kamu harus memberkati
  rationale: Imperfek piel 2mp berada dalam konteks instruksi. “Harus” menyampaikan daya direktif, bukan sekadar tindakan masa depan.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” berfungsi sebagai sebutan kebangsaan kolektif; “orang Israel” merupakan padanan Indonesia yang alami dan mencakup seluruh umat.
- source_word: אָמֹר לָהֶם
  choice: Katakanlah kepada mereka
  rationale: Imperatif yang memperkenalkan kata-kata persis dari berkat pada ayat berikutnya; daya perintah dan pengulangan sumber dipertahankan.
theological_decisions:
- issue: Ungkapan perjanjian yang berjenis kelamin בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Di sini frasa tersebut adalah etnonim konvensional bagi seluruh umat, bukan hanya laki-laki. Padanan idiomatis menghindari kesan pembatasan gender tanpa mengubah identitas perjanjian mereka.
- issue: Daya direktif rumusan berkat imam
  choice: Beginilah kamu harus memberkati
  alternative: Demikianlah kamu akan memberkati
  rationale: Konteks dan bentuk verbal menyatakan tata cara yang diperintahkan. “Harus” mempertahankan sifat preskriptif dan tidak membacanya sebagai ramalan sederhana.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur pengutipan Ibrani dipertahankan secara alami dengan titik dua; koma penutup menunjukkan bahwa isi perkataan berlanjut pada ayat 24.
