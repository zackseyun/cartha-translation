  text: 'Lalu Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”. Nama ini juga ditransliterasikan “Yehuwa”.'
