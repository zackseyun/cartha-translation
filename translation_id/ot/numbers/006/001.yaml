lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur dengan wajar sebagai “Lalu”. Karena subjeknya Yahweh dan ucapan ilahi formal akan diperkenalkan, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל
  choice: kepada
  rationale: Menandai pihak yang menjadi sasaran firman; “kepada” adalah padanan Indonesia modern yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk nama yang telah mapan dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: (tercermin dalam tanda koma)
  rationale: Dalam formula pembuka ucapan, infinitif ini memperkenalkan isi perkataan. Bahasa Indonesia alami tidak memerlukan “dengan mengatakan”; koma cukup menandai bahwa isi firman segera menyusul.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar, sementara catatan kaki memberi tahu pembaca tentang tradisi penerjemahan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Lalu” mengalirkan narasi secara alami; “berfirman” sesuai untuk ucapan ilahi. Formula לֵאמֹר tidak diterjemahkan secara kaku karena isi firman langsung mengikuti pada ayat berikutnya.
