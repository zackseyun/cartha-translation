  to: Lalu imam harus mempersembahkan satu ekor sebagai kurban penghapus dosa[a] dan satu ekor lagi sebagai kurban bakaran. Imam harus mengadakan pendamaian baginya karena ia telah berdosa berkenaan dengan orang mati itu[b], dan pada hari itu juga ia harus menguduskan kepalanya.
