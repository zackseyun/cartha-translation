  naturalness: Bahasa pada umumnya baku dan jelas. “Satu ekor” lebih alami daripada “yang seekor” dalam paralel dua kurban. “Pada hari itu juga” merupakan padanan idiomatis yang baik untuk בַּיּוֹם הַהוּא.
