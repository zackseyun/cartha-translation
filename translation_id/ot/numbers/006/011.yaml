  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: id
  text: Lalu imam harus mempersembahkan satu ekor sebagai kurban penghapus dosa[a] dan satu ekor lagi sebagai kurban bakaran. Imam harus mengadakan pendamaian baginya karena ia telah berdosa berkenaan dengan orang mati itu[b], dan pada hari itu juga ia harus menguduskan kepalanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban pemurnian.” Istilah Ibrani חַטָּאת dapat menunjuk pada kurban penghapus dosa atau kurban pemurnian, khususnya dalam konteks kenajisan ritual.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berkenaan dengan nefesh.” Dalam konteks ini, kata Ibrani נֶפֶשׁ menunjuk kepada orang yang sudah mati, yaitu jenazah yang menyebabkan kenajisan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: imam harus mempersembahkan
  rationale: Dalam konteks kurban, עשה secara idiomatis berarti melaksanakan atau mempersembahkan kurban; bentuk kewajiban hukum dinyatakan dengan 'harus'.
- source_word: אֶחָד לְחַטָּאת
  choice: yang seekor sebagai kurban penghapus dosa
  rationale: חטאת menunjuk pada jenis kurban yang secara tradisional disebut kurban penghapus dosa; nuansa pemurniannya dipertahankan dalam catatan kaki.
- source_word: וְאֶחָד לְעֹלָה
  choice: yang seekor lagi sebagai kurban bakaran
  rationale: עֹלָה adalah kurban yang seluruhnya dibakar; 'kurban bakaran' merupakan istilah Indonesia yang jelas dan lazim.
- source_word: וְכִפֶּר עָלָיו
  choice: mengadakan pendamaian baginya
  rationale: Ungkapan ini mempertahankan cakupan kultis כפר tanpa menentukan teori pendamaian tertentu.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: karena ia telah berdosa berkenaan dengan orang mati itu
  rationale: מֵאֲשֶׁר dipahami secara kausal, sedangkan נֶפֶשׁ dalam konteks kenaziran ini merujuk kepada orang yang sudah mati atau jenazah. 'Berkenaan dengan' menjaga hubungan yang agak umum dari עַל.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: ia harus menguduskan kepalanya kembali
  rationale: Secara leksikal berarti menguduskan kepalanya; 'kembali' menjelaskan pemulihan pengudusan rambut kenaziran setelah kenajisan, sebagaimana dituntut konteks ayat 9–12.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu juga
  rationale: Menyatakan tindakan pada hari yang disebut tersebut dan secara alami menyampaikan kedekatan waktunya dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kenajisan ritual
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani dapat menamai kurban yang berkaitan dengan dosa sekaligus pemurnian. Istilah tradisional ditempatkan dalam teks, sedangkan alternatif yang penting secara kontekstual dicatat agar ketegangan leksikal tidak dihilangkan.
- issue: Referen הַנָּפֶשׁ
  choice: orang mati
  alternative: jenazah
  rationale: Dalam konteks langsung, נֶפֶשׁ bukan 'jiwa' yang terpisah dari tubuh, melainkan orang yang mati dan menimbulkan kenajisan. 'Orang mati' mempertahankan referen manusianya.
- issue: Sifat dosa orang nazir
  choice: berdosa berkenaan dengan orang mati itu
  alternative: menjadi najis karena jenazah itu
  rationale: Teks memakai verba חטא, sehingga unsur 'berdosa' dipertahankan, tetapi frasa preposisional tidak diperjelas secara berlebihan menjadi kesalahan moral yang disengaja; konteksnya adalah kenajisan akibat kematian mendadak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dibuat konsisten dan mudah dipahami; konstruksi hukum Ibrani diterjemahkan dengan 'harus'. Pengulangan 'imam' pada kalimat kedua memperjelas subjek, sedangkan penanda catatan kaki ditempatkan langsung dalam teks.
