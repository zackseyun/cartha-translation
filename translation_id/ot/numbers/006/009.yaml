  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: id
  text: Jika seseorang mati tiba-tiba di dekatnya dan hal itu menajiskan kepalanya yang dikhususkan sebagai nazir,[a] ia harus mencukur kepalanya pada hari pentahirannya; pada hari ketujuh ia harus mencukurnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala kenazirannya,” yaitu kepalanya dalam kaitan dengan pengkhususannya sebagai nazir.
    reason: lexical_alternative
  - marker: b
    text: Penyebutan mencukur dua kali menegaskan bahwa hari pentahiran yang dimaksud ialah hari ketujuh.
    reason: clarification
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Memperkenalkan kasus bersyarat dalam hukum kenaziran. Dalam bahasa Indonesia, “Jika” secara alami menyampaikan fungsi kondisional; hubungan dengan ayat sebelumnya tetap jelas tanpa harus menerjemahkan waw secara kaku.
- source_word: יָמוּת מֵת
  choice: seseorang ... mati
  rationale: Gabungan verba dan nomina serumpun ini merupakan ungkapan idiomatis tentang kematian seseorang; terjemahan alami Indonesia tidak mengulang unsur “mati” secara harfiah.
- source_word: עָלָיו
  choice: di dekatnya
  rationale: Dalam konteks kenajisan karena mayat, frasa ini menunjukkan kedekatan langsung dengan orang nazir, tanpa memastikan bahwa mayat itu secara fisik jatuh menimpanya.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: tiba-tiba
  rationale: Pasangan kata ini menekankan kematian yang mendadak dan tidak terduga. “Tiba-tiba” menyampaikan intinya secara wajar dalam bahasa Indonesia.
- source_word: וְטִמֵּא
  choice: sehingga menajiskan
  rationale: Bentuknya transitif dan akibat kematian mendadak itu ialah ternajiskannya kepala kenaziran. “Sehingga” memperjelas hubungan akibat tanpa menentukan secara berlebihan apakah subjek gramatikalnya orang yang mati atau peristiwa kematian tersebut.
- source_word: רֹאשׁ נִזְרוֹ
  choice: kepala kenazirannya
  rationale: Ungkapan ini secara harfiah menghubungkan kepala dengan status atau pengkhususan kenaziran. Bentuk ini mempertahankan kaitan tersebut dan menghindari pengertian yang terlalu umum dari “kepala yang ditahbiskan”.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: ia harus mencukur kepalanya
  rationale: Menyatakan tindakan wajib sesudah kenajisan dalam gaya hukum yang alami dan jelas.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: pada hari pentahirannya
  rationale: טָהֳרָה di sini menunjuk pada pentahiran ritual, bukan kebersihan biasa. “Pentahiran” mempertahankan ranah ritual dan tetap dikenal dalam register Alkitab Indonesia.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Padanan temporal yang langsung dan alami.
- source_word: יְגַלְּחֶנּוּ
  choice: ia harus mencukurnya
  rationale: Akhiran pronominal merujuk kembali pada kepala atau rambut kepala. Kata “mencukurnya” mempertahankan rujukan anaforis Ibrani; catatan menjelaskan pengulangan tindakan dalam susunan ayat.
theological_decisions:
- issue: Makna kenajisan pada kepala orang nazir
  choice: kepala kenazirannya
  alternative: kepalanya yang dikhususkan; kepala pengkhususannya
  rationale: Ayat ini berbicara tentang kenajisan ritual yang mengganggu masa kenaziran, khususnya sebagaimana dilambangkan oleh rambut yang tidak dicukur. Terjemahan mempertahankan istilah ritual “kenaziran” tanpa memasukkan konsep teologis yang tidak dinyatakan teks.
- issue: Hubungan kematian mendadak dan penajisan
  choice: sehingga menajiskan
  alternative: dan ia menajiskan; lalu ternajislah
  rationale: Bentuk Ibrani transitif dipertahankan secara semantis, tetapi ungkapan Indonesia menghindari penetapan subjek yang terlalu tegas pada orang yang meninggal ketika peristiwa kematian mendadak itu sendiri menjadi penyebab kenajisan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “kenaziran” dipertahankan karena konteks hukumnya khusus, sedangkan “pentahiran” dipilih untuk menyatakan kemurnian ritual. Struktur kalimat dibuat alami tanpa menghapus hubungan sebab-akibat dan pengulangan yang terdapat dalam teks Ibrani.
