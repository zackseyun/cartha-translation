  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: id
  text: Kiranya Yahweh mengangkat wajah-Nya ke arahmu dan memberimu damai sejahtera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “damai sejahtera” (shalom) juga dapat mencakup keutuhan dan kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: mengangkat
  rationale: Kata kerja נשׂא berarti ‘mengangkat’ atau ‘membawa’. Pilihan ini mempertahankan gambaran konkret dalam idiom Ibrani, yang dalam konteks berkat menyatakan perhatian dan perkenanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap dipertahankan.
- source_word: פָּנָיו
  choice: wajah-Nya
  rationale: פָּנִים secara harfiah berarti ‘wajah’. Bentuk ini mempertahankan metafora antropomorfis dan lebih alami dalam bahasa Indonesia modern daripada ungkapan arkais.
- source_word: אֵלֶיךָ
  choice: ke arahmu
  rationale: Kata depan אֶל menunjukkan arah, yaitu ‘kepada’ atau ‘ke arah’. Dalam gabungan dengan ‘mengangkat wajah’, ‘ke arahmu’ mempertahankan unsur arah secara jelas.
- source_word: וְיָשֵׂם
  choice: dan memberimu
  rationale: שׂים secara leksikal berarti ‘menaruh’ atau ‘menempatkan’, tetapi ungkapan ‘menempatkan damai bagimu’ secara idiomatis berarti menganugerahkan atau memberikan damai. ‘Memberimu’ menyampaikan hasilnya secara wajar.
- source_word: לְךָ
  choice: -mu
  rationale: Awalan לְ menandai penerima atau pihak yang memperoleh manfaat; dalam ‘memberimu’, makna tersebut tersampaikan secara alami.
- source_word: שָׁלוֹם
  choice: damai sejahtera
  rationale: שָׁלוֹם mencakup kedamaian, keselamatan, keutuhan, dan kesejahteraan. ‘Damai sejahtera’ merupakan ungkapan Indonesia yang alami dan cukup luas, sementara catatan kaki menjelaskan cakupan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menggunakan nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang berasal dari tradisi pelafalan lain.
- issue: Idiom antropomorfis ‘mengangkat wajah-Nya’
  choice: Mempertahankan bahasa tentang wajah
  alternative: menunjukkan perkenanan-Nya kepadamu; memandangmu dengan penuh perkenanan
  rationale: Bahasa Ibrani memakai gambaran jasmani yang menyiratkan perhatian dan perkenanan ilahi. Metafora itu dipertahankan agar tekstur sastra dan ketegangan teologis teks tidak dihilangkan melalui parafrasa abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pengharapan ‘Kiranya’ sesuai dengan konteks berkat. Kapitalisasi pada ‘-Nya’ mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah. Metafora Ibrani dipertahankan, sedangkan ‘memberimu’ dipilih demi kewajaran idiomatis.
