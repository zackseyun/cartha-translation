base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: id
  text: Ia harus mempersembahkan domba jantan itu sebagai korban keselamatan kepada Yahweh, bersama dengan keranjang roti tidak beragi. Imam itu harus mempersembahkan korban sajiannya dan korban curahannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: domba jantan itu
  rationale: Dalam konteks kurban, אַיִל secara khusus menunjuk pada domba jantan; bentuk tentu diterjemahkan dengan “itu”.
- source_word: יַעֲשֶׂה
  choice: harus mempersembahkan
  rationale: Walaupun עשה pada dasarnya berarti “melakukan/membuat”, dalam peraturan kurban kata ini merujuk pada pelaksanaan atau persembahan kurban.
- source_word: זֶבַח שְׁלָמִים
  choice: kurban keselamatan
  rationale: Ungkapan ini menunjuk pada jenis kurban שְׁלָמִים. “Kurban keselamatan” mempertahankan istilah tradisional dan tidak mempersempit maknanya hanya pada persekutuan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau peruntukan persembahan, sedangkan nama ilahi יהוה ditransliterasikan sebagai Yahweh.
- source_word: עַל סַל הַמַּצּוֹת
  choice: bersama dengan bakul berisi roti tidak beragi
  rationale: עַל di sini menyatakan penyertaan dalam tindakan ritual, bukan semata-mata posisi di atas. “Bakul berisi” memperjelas hubungan alami antara wadah dan isinya dalam bahasa Indonesia.
- source_word: מִנְחָתוֹ
  choice: kurban sajian ... yang menyertainya
  rationale: מִנְחָה dalam teks keimaman adalah kurban sajian. Sufiks orang ketiga dipahami sebagai kurban pelengkap yang terkait dengan kurban domba jantan tersebut.
- source_word: נִסְכּוֹ
  choice: kurban curahan yang menyertainya
  rationale: נֶסֶךְ menunjuk pada persembahan cair yang dicurahkan. “Kurban curahan” merupakan padanan Indonesia yang jelas dan mempertahankan sifat ritualnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Penerjemahan שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban pendamaian
  rationale: Istilah Ibrani dapat menonjolkan kesejahteraan, kedamaian, atau persekutuan. “Kurban keselamatan” mempertahankan nama kategori yang luas, sementara alternatif “kurban persekutuan” dicatat agar ambiguitas leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-ritual. Struktur kalimat dibagi dua agar mudah dibaca, tanpa menghilangkan urutan tindakan dalam teks Ibrani. Istilah “kurban” digunakan secara konsisten untuk persembahan ritual.
