    reason: lexical_alternative
  revision_rationale: Revisi hanya menormalkan pilihan leksikal Indonesia dan memperjelas bahwa baik korban sajian maupun korban curahan adalah persembahan yang menyertai korban domba jantan. Makna, urutan tindakan, nama ilahi, serta alternatif leksikal tetap dipertahankan.
