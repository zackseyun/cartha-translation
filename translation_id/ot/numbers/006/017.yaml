  revised_text: Ia harus mempersembahkan domba jantan itu sebagai korban keselamatan kepada Yahweh, bersama dengan keranjang roti tidak beragi. Imam itu harus mempersembahkan korban sajiannya dan korban curahannya.
  revised_footnotes:
