  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: id
  text: Sepanjang masa kenazirannya, ia kudus bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masa pemisahannya sebagai nazir” atau “masa pengkhususannya.” Istilah Ibrani ini menunjuk pada keadaan seseorang yang dikhususkan sebagai nazir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: Selama masa
  rationale: Gabungan ini mencakup seluruh rentang waktu yang dimaksud. Dalam bahasa Indonesia, “selama masa” lebih alami daripada terjemahan harfiah “segenap hari-hari” tanpa mengurangi daya cakup כֹּל.
- source_word: נִזְרוֹ
  choice: kenazirannya
  rationale: Dalam konteks peraturan orang nazir, kata ini menunjuk pada keadaan atau masa pengkhususannya sebagai nazir, bukan semata-mata pada tindakan mengucapkan nazar.
- source_word: קָדֹשׁ
  choice: kudus
  rationale: “Kudus” mempertahankan bobot teologis dan makna keterkhususan dari kata Ibrani, tanpa mereduksinya menjadi fungsi biasa.
- source_word: הוּא
  choice: ia
  rationale: Pronomina ini menjadi subjek klausa nominal; kopula kala kini tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל di sini menyatakan hubungan pengabdian atau peruntukan. “Bagi” terdengar alami dan menunjukkan bahwa kekudusannya diarahkan kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama diri itu, bukan menggantinya dengan gelar.
- issue: Makna נִזְרוֹ dalam peraturan kenaziran
  choice: kenazirannya
  alternative: pemisahannya; nazarnya sebagai nazir; pengkhususannya
  rationale: Pilihan ini mempertahankan rujukan khusus kepada status dan masa seseorang sebagai nazir. Catatan kaki menyediakan padanan yang menonjolkan unsur pemisahan atau pengkhususan tanpa menyamakan istilah ini hanya dengan nazar yang diucapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Kenaziran” dipilih sebagai istilah kontekstual yang jelas, sedangkan alternatif leksikal dijelaskan dalam catatan kaki.
