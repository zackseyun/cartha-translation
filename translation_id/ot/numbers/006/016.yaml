  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: id
  text: Lalu imam itu harus menghadapkan semuanya di hadapan Yahweh[a] dan mempersembahkan kurban penghapus dosanya[b] serta kurban bakarannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membawa semuanya mendekat ke hadapan Yahweh.” Kata kerja Ibrani dapat menekankan tindakan membawa dan menghadapkan kurban kepada Allah sebelum kurban itu dipersembahkan.
    reason: lexical_alternative
  - marker: b
    text: “Kurban penghapus dosa” juga dapat dipahami sebagai “kurban pemurnian” dalam bahasa peribadatan para imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: harus mempersembahkan
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau mempersembahkan di hadapan Allah. Di sini tindakan ini dibedakan dari pengolahan kurban yang kemudian dinyatakan dengan וְעָשָׂה.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi כֹּהֵן dalam konteks peribadatan Israel.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan kehadiran atau tempat di hadapan Allah, sedangkan nama ilahi יהוה ditransliterasikan sebagai Yahweh.
- source_word: וְעָשָׂה
  choice: dan mengolah
  rationale: Secara harfiah berarti melakukan atau membuat, tetapi dalam ungkapan ritual menunjuk pada pelaksanaan atau pengolahan kurban. 'Mengolah' membedakannya dari tindakan membawa atau mempersembahkan sebelumnya.
- source_word: אֶת חַטָּאתוֹ
  choice: kurban penghapus dosanya
  rationale: חַטָּאת dalam peraturan kurban menunjuk pada kurban yang berkaitan dengan dosa dan pemurnian. Pilihan ini alami dalam bahasa Indonesia dan tetap membuka penjelasan alternatif 'kurban pemurnian' melalui catatan kaki.
- source_word: וְאֶת עֹלָתוֹ
  choice: serta kurban bakarannya
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya.
- source_word: implicit object of וְהִקְרִיב
  choice: semuanya
  rationale: Objek tidak dinyatakan dalam ayat Ibrani, tetapi dipasok oleh benda-benda kurban pada ayat sebelumnya. 'Semuanya' mempertahankan ketergantungan kontekstual tanpa merinci lebih jauh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna ritual חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah ini secara tradisional dipahami sebagai kurban terkait dosa, tetapi dalam bahasa keimaman juga dapat menonjolkan fungsi pemurnian. Terjemahan utama memakai ungkapan yang lazim, sementara alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Istilah 'kurban' dipakai secara konsisten untuk konteks persembahan ritual; 'mengolah' menjaga pembedaan antara tindakan menghadapkan kurban dan pelaksanaan ritus kurban.
