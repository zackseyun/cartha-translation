id: NUM.6.12
reference: Numbers 6:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: id
  text: Ia harus kembali mengkhususkan kepada TUHAN hari-hari kenazirannya[a] dan membawa seekor anak domba jantan berumur setahun sebagai kurban penebus salah. Namun, hari-hari yang terdahulu tidak lagi terhitung[b], karena kenazirannya telah menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “hari-hari pemisahannya” atau “hari-hari pengkhususannya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hari-hari yang terdahulu akan jatuh”; maksudnya, hari-hari kenaziran yang telah dijalani sebelumnya tidak lagi diperhitungkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: Ia harus mengkhususkan kembali
  rationale: Bentuk Hifil dari נזר dalam konteks ini menunjuk pada dimulainya kembali masa pengkhususan seorang nazir setelah kenajisan memutus masa sebelumnya.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Preposisi ל menandai arah pengkhususan kepada YHWH; nama ilahi diterjemahkan dengan bentuk baku Indonesia 'TUHAN'.
- source_word: יְמֵי נִזְרוֹ
  choice: masa kenazirannya
  rationale: Ungkapan ini menunjuk pada hari-hari atau jangka waktu status nazir. 'Masa kenazirannya' ringkas, alami, dan mempertahankan kekhususan pranata dalam Bilangan 6.
- source_word: וְהֵבִיא
  choice: dan membawa
  rationale: Ini merupakan ungkapan umum untuk membawa hewan sebagai persembahan.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: seekor anak domba jantan berumur setahun
  rationale: כֶּבֶשׂ menunjuk pada anak domba jantan, sedangkan idiom בֶּן שְׁנָתוֹ menyatakan umur satu tahun atau masih dalam tahun pertamanya.
- source_word: לְאָשָׁם
  choice: sebagai kurban penebus salah
  rationale: אָשָׁם adalah kategori kurban yang berkaitan dengan kesalahan dan pemulihan; istilah ini membedakannya dari kurban penghapus dosa.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים
  choice: hari-hari yang terdahulu
  rationale: Yang dimaksud ialah hari-hari masa kenaziran yang telah dijalani sebelum kenajisan terjadi.
- source_word: יִפְּלוּ
  choice: tidak lagi terhitung
  rationale: Secara harfiah berarti 'akan jatuh', tetapi dalam ketentuan ini menyatakan bahwa hari-hari sebelumnya gugur dan tidak diperhitungkan dalam masa nazar.
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: karena kenazirannya telah menjadi najis
  rationale: Terjemahan ini mempertahankan konsep kenajisan ritual dan membiarkan נִזְרוֹ menunjuk pada keadaan atau masa pengkhususan sebagai nazir, bukan semata-mata tindakan bernazar.
theological_decisions:
- issue: Makna נזר dalam peraturan tentang nazir
  choice: kenaziran
  alternative: nazar kenaziran; pengkhususan; pemisahan
  rationale: Dalam Bilangan 6, akar ini berfungsi sebagai istilah teknis bagi status pengkhususan seorang nazir. 'Kenaziran' mempertahankan pranata tersebut tanpa mempersempitnya hanya menjadi ucapan nazar.
- issue: Penerjemahan יהוה
  choice: TUHAN
  alternative: YHWH; Yahweh
  rationale: Bentuk 'TUHAN' merupakan konvensi terjemahan Alkitab berbahasa Indonesia yang dikenal luas untuk nama ilahi, sambil tetap membedakannya secara tipografis dari gelar biasa.
- issue: Dampak יִפְּלוּ terhadap hari-hari sebelumnya
  choice: tidak lagi terhitung
  alternative: gugur; menjadi batal; jatuh
  rationale: Dalam konteks hukum ritual, frasa itu menyatakan bahwa masa sebelum kenajisan tidak diperhitungkan. Catatan kaki mempertahankan gambaran harfiah 'jatuh'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah teknis 'kenaziran' dipakai karena konteks pasal telah menjelaskan pranata nazir; 'kurban penebus salah' dipilih untuk membedakan אָשָׁם dari jenis kurban lain. Struktur Ibrani dipertahankan sejauh tetap alami dalam bahasa Indonesia.
