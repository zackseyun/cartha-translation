translation:
  language: id
  text: Kalian harus mengambil satu pemimpin dari setiap suku untuk mewarisi tanah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk membagikan tanah itu sebagai milik pusaka.” Dalam konteks pembagian tanah, kata kerja ini kadang dipahami dengan nuansa penetapan bagian pusaka; namun bentuk Ibraninya paling langsung berarti “mewarisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks administratif ini, נָשִׂיא menunjuk kepada pemimpin atau kepala yang diakui; “pemimpin” alami dalam bahasa Indonesia modern dan tidak menyiratkan gelar kerajaan.
- source_word: אֶחָד נָשִׂיא אֶחָד מִמַּטֶּה
  choice: satu pemimpin dari setiap suku
  rationale: Pengulangan אֶחָד menegaskan satu wakil bagi tiap suku; susunan distributif ini paling wajar diungkapkan demikian dalam bahasa Indonesia.
- source_word: תִּקְחוּ
  choice: kamu harus mengambil
  rationale: Bentuk imperfek orang kedua jamak berfungsi sebagai instruksi; “harus” menyampaikan daya perintah dengan jelas.
- source_word: לִנְחֹל
  choice: untuk membagikan ... sebagai milik pusaka
  rationale: Dalam konteks penetapan batas dan para pemimpin yang ditunjuk untuk urusan tanah, verba ini dapat bersifat kausatif, yakni membuat orang menerima warisan atau menetapkan bagiannya. Terjemahan ini menyampaikan fungsi administratif tersebut sambil mempertahankan gagasan pusaka.
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: Kata ini merujuk kepada tanah tertentu yang akan diberikan kepada Israel; “tanah itu” sesuai dengan acuan kontekstualnya.
theological_decisions:
- issue: Peran para pemimpin dalam לִנְחֹל אֶת־הָאָרֶץ
  choice: membagikan tanah itu sebagai milik pusaka
  alternative: mewarisi tanah itu
  rationale: Bentuk dan ranah makna verba memungkinkan nuansa menerima warisan maupun menyebabkan warisan diterima. Konteks langsung tentang orang-orang yang ditunjuk untuk menangani pembagian tanah lebih mendukung fungsi penetapan atau pembagian, tetapi ambiguitas leksikal tetap dicatat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kamu” dipakai sebagai sapaan jamak yang tersirat dari bentuk verba Ibrani; konteks menentukan bahwa perintah ditujukan kepada kelompok, bukan satu orang.
