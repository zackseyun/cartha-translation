    rationale: Penilaian itu melampaui bentuk kata yang ditampilkan dan menggeser teks utama dari arti langsungnya. Jika alternatif kontekstual dipertahankan, catatan harus menyajikannya sebagai kemungkinan penafsiran, bukan sebagai dasar untuk mengganti terjemahan utama.
