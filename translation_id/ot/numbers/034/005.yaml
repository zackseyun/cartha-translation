  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: id
  text: Lalu perbatasan itu akan berbelok dari Azmon menuju Wadi Mesir[a] dan berakhir di laut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ke alur air Mesir." Kata Ibrani נחל sering menunjuk pada alur air musiman atau wadi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "ujung-ujungnya"; bahasa Ibrani memakai bentuk jamak untuk titik berakhirnya perbatasan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Lalu ... akan berbelok
  rationale: Dalam uraian batas wilayah, נסב menunjukkan perubahan arah garis perbatasan. Bentuk Indonesia ini alami dan mempertahankan urutan serta nuansa prospektif konteks.
- source_word: הַגְּבוּל
  choice: perbatasan itu
  rationale: גְּבוּל di sini menunjuk pada garis batas wilayah; 'perbatasan' merupakan padanan geografis yang wajar dalam bahasa Indonesia modern.
- source_word: מֵעַצְמוֹן
  choice: dari Azmon
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: נַחְלָה מִצְרָיִם
  choice: ke Wadi Mesir
  rationale: נחל lazimnya menunjuk pada alur sungai musiman atau wadi, bukan sungai besar yang mengalir sepanjang tahun. Pilihan ini juga menghindari kesan keliru bahwa yang dimaksud ialah Sungai Nil.
- source_word: וְהָיוּ
  choice: akan berada
  rationale: Ungkapan kopulatif ini memperkenalkan titik akhir perbatasan; 'akan berada' alami dalam konstruksi Indonesia.
- source_word: תּוֹצְאֹתָיו
  choice: ujungnya
  rationale: Dalam teks batas wilayah, bentuk ini menunjuk pada titik akhir atau terminus garis perbatasan. Bahasa Indonesia secara idiomatis memakai bentuk tunggal, sementara bentuk jamak Ibraninya dicatat dalam catatan kaki.
- source_word: הַיָּמָּה
  choice: di laut
  rationale: Secara harfiah berarti 'ke arah laut/ke laut'; dalam konteks ini menunjukkan tempat berakhirnya garis perbatasan. Teks Ibrani hanya menyebut 'laut', sehingga laut tertentu tidak ditambahkan ke teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. 'Wadi' dipakai sebagai istilah geografis yang lebih tepat, disertai alternatif deskriptif dalam catatan kaki. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
