  - severity: low
    issue: Ungkapan "suku keturunan Ruben/Gad" redundan dalam register Indonesia modern.
    rationale: '"Suku Ruben" dan "suku Gad" menyampaikan rujukan kelompok tribal secara alami; unsur genealogis bahasa sumber tidak perlu direplikasi dengan gabungan yang canggung.'
