  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: id
  text: Sebab suku Ruben menurut keluarga-keluarga besar mereka, dan suku Gad menurut keluarga-keluarga besar mereka,[a] serta setengah suku Manasye telah mengambil milik pusaka mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Keluarga-keluarga besar" menerjemahkan ungkapan yang merujuk pada pembagian keluarga atau klan berdasarkan garis leluhur di dalam setiap suku.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal-eksplanatoris yang menghubungkan ayat ini dengan pernyataan sebelumnya.
- source_word: לָקְחוּ
  choice: telah mengambil
  rationale: Menerjemahkan bentuk perfek Qal secara dekat sebagai tindakan yang sudah selesai tanpa melunakkannya menjadi 'menerima'.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pembagian tanah, kata ini menunjuk pada kelompok suku, bukan tongkat.
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: keturunan Ruben / keturunan Gad
  rationale: '''Keturunan'' merupakan ungkapan genealogis yang alami dalam bahasa Indonesia dan tetap mencerminkan unsur ''anak-anak/keturunan'' dalam bahasa Ibrani.'
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum leluhur mereka
  rationale: Menunjukkan pembagian berdasarkan unit keluarga besar atau klan leluhur di dalam setiap suku.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: serta setengah suku Manasye
  rationale: Menyatakan secara jelas bahwa hanya separuh dari suku Manasye yang dimaksud, sambil mengikuti susunan Ibrani.
- source_word: נַחֲלָתָם
  choice: milik pusaka mereka
  rationale: '''Milik pusaka'' secara alami menyampaikan tanah warisan yang menjadi bagian tetap mereka.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat cukup dekat dengan bahasa Ibrani, tetapi 'keturunan Ruben/Gad' dipilih agar lebih alami daripada 'anak-anak Ruben/Gad'. Istilah tradisional 'milik pusaka' dipertahankan karena masih mudah dipahami dan tepat untuk konteks pembagian tanah.
