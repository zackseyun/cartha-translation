  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: id
  text: 'Lalu Musa memberi perintah kepada orang Israel, demikian: “Inilah negeri yang akan kamu terima sebagai warisan dengan undi, yang diperintahkan TUHAN untuk diberikan kepada sembilan suku dan setengah suku.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan baku dan ringkas dalam bahasa Indonesia untuk keturunan atau umat Israel dalam konteks kolektif.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: akan kamu terima sebagai milik pusaka
  rationale: Bentuk verbal hitpael dari נחל menyatakan penerimaan atau penguasaan tanah sebagai warisan; terjemahan ini mempertahankan gagasan pusaka tanpa terasa janggal.
- source_word: בְּגוֹרָל
  choice: melalui pengundian
  rationale: Menunjukkan sarana pembagian tanah dengan undi, bukan bahwa tanah itu diperoleh secara kebetulan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk Tetragramaton dengan huruf kapital.
- source_word: לָתֵת
  choice: untuk diberikan
  rationale: Infinitif 'memberikan' dipertahankan, sementara bentuk pasif menghasilkan hubungan yang alami dengan 'negeri' sebagai sesuatu yang diberikan kepada suku-suku.
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: sembilan suku dan setengah suku
  rationale: Menerjemahkan struktur Ibrani secara langsung dan mempertahankan cara penghitungan suku dalam konteks pembagian tanah.
theological_decisions:
- issue: Pelaku tersirat dalam frasa אֲשֶׁר צִוָּה יְהוָה לָתֵת
  choice: “yang diperintahkan TUHAN untuk diberikan” tanpa menyebut pelaku pemberian
  alternative: “yang diperintahkan TUHAN kepadamu untuk diberikan” atau “yang TUHAN perintahkan untuk diberikan-Nya”
  rationale: Teks Ibrani tidak menyatakan secara eksplisit subjek infinitif לָתֵת. Rumusan pasif mempertahankan ketaktertentuan itu dan tidak memaksakan apakah TUHAN, Musa, atau Israel dipandang sebagai pelaku langsung.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah “milik pusaka” mempertahankan nuansa hukum-teologis pewarisan tanah, sedangkan “melalui pengundian” memperjelas mekanisme pembagiannya.
