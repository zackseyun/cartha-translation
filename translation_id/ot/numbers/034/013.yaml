  to: 'Lalu Musa memberi perintah kepada orang Israel, demikian: “Inilah negeri yang akan kamu terima sebagai warisan dengan undi, yang diperintahkan TUHAN untuk diberikan kepada sembilan suku dan setengah suku.”'
  rationale: 'Revisi ini meningkatkan kelancaran bahasa Indonesia modern sambil mempertahankan seluruh unsur sumber: perintah Musa, penerima kolektif Israel, tanah sebagai warisan, pembagian dengan undi, perintah TUHAN, serta sembilan suku dan setengah suku. Klausa “yang diperintahkan TUHAN untuk diberikan” tetap tidak menyatakan pelaku infinitif secara eksplisit, sehingga mempertahankan ambiguitas gramatikal teks Ibrani.'
