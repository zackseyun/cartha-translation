  text: וּ/לְ/מַטֵּ֥ה בְנֵי אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן שְׁלֹמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: id
  text: 'Dan untuk suku keturunan Asyer: seorang pemimpin, Ahihud, putra Selomi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Untuk suku
  rationale: Dalam konteks pembagian tanah, מַטֶּה berarti kelompok suku, bukan tongkat. Prefiks וּ dan לְ diungkapkan secara alami dengan “Untuk” dalam rangkaian daftar ini; וּ tidak harus diterjemahkan tersendiri sebagai “dan” dalam bahasa Indonesia.
- source_word: בְנֵי אָשֵׁר
  choice: keturunan Asyer
  rationale: Secara harfiah berarti “anak-anak lelaki Asyer”, tetapi dalam konteks ini menunjuk kepada seluruh kelompok keturunan yang membentuk suku Asyer. “Keturunan Asyer” alami, tepat, dan tidak mempersempit rujukannya kepada putra langsung.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: Istilah ini menunjuk kepada pemimpin atau wakil resmi suku yang ditunjuk untuk pembagian tanah. “Pemimpin” jelas dalam bahasa Indonesia modern dan menghindari kesan gelar kerajaan dari “pangeran”.
- source_word: אֲחִיהוּד
  choice: Ahihud
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang dekat dengan bunyi dan tradisi ejaan nama Ibrani.
- source_word: בֶּן שְׁלֹמִי
  choice: anak Selomi
  rationale: Konstruksi patronimik Ibrani ini secara alami diterjemahkan “anak Selomi” dalam bahasa Indonesia.
