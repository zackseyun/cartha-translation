  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur bertitik dua mempertahankan bentuk daftar eliptis teks Ibrani. Nama Asyer dan Selomi memakai ejaan yang wajar dalam tradisi Alkitab bahasa Indonesia.
