  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: id
  text: Bagi kalian, batas itu akan berbelok dari sebelah selatan Pendakian Akrabim[a], lalu melintasi Zin. Ujung-ujungnya akan berada di sebelah selatan Kadesh-Barnea. Kemudian batas itu akan terus ke Hazar-Adar, lalu melintasi Azmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akrabim kemungkinan berarti “kalajengking”; nama tempat ini juga dapat diterjemahkan sebagai “Pendakian Kalajengking” atau “Lintasan Kalajengking.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: akan berbelok
  rationale: Dalam uraian batas wilayah, נָסַב menunjukkan garis batas yang berbelok atau melengkung; 'akan berbelok' alami dan tetap dekat dengan gambaran Ibrani.
- source_word: לָכֶם הַגְּבוּל
  choice: batas itu ... bagi kalian
  rationale: גְּבוּל adalah batas wilayah, sedangkan לָכֶם dipertahankan sebagai 'bagi kalian' untuk menyatakan bahwa batas tersebut ditetapkan bagi umat yang diajak bicara.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: di sebelah selatan Pendakian Akrabim
  rationale: מִנֶּגֶב menunjukkan sisi selatan suatu lokasi. מַעֲלֵה diterjemahkan 'Pendakian', sedangkan Akrabim dipertahankan sebagai nama tempat.
- source_word: וְעָבַר צִנָה
  choice: lalu melintasi Zin
  rationale: עָבַר dalam rute batas menyatakan garis yang melintas atau melewati suatu kawasan; akhiran arah pada צִנָה menunjukkan gerak menuju Zin, tetapi konteks memungkinkan ungkapan alami 'melintasi Zin'.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: Ujungnya akan berada
  rationale: תּוֹצְאוֹת berbentuk jamak secara morfologis, tetapi dalam rumusan batas dapat berfungsi sebagai istilah bagi ujung atau titik akhir garis batas. Bentuk tunggal kolektif 'ujungnya' paling alami dalam bahasa Indonesia.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: di sebelah selatan Kadesh-Barnea
  rationale: Frasa ini menempatkan ujung batas pada sisi selatan Kadesh-Barnea, bukan sekadar menuju atau tepat di kota itu.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: Dari sana batas itu akan terus ke Hazar-Adar
  rationale: יָצָא dalam uraian batas berarti garis itu keluar atau berlanjut menuju titik berikutnya. 'Akan terus ke' menyampaikan fungsi geografisnya secara alami; subjek 'batas itu' dinyatakan kembali demi kejelasan.
- source_word: וְעָבַר עַצְמֹנָה
  choice: lalu melintasi Azmon
  rationale: עָבַר kembali menggambarkan jalur batas yang melintas, dan akhiran arah pada nama tempat menunjukkan gerak menuju Azmon.
