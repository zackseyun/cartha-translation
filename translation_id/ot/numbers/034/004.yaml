  register: Bahasa Indonesia baku modern dengan gaya geografis yang jelas dan bermartabat. Nama-nama tempat ditransliterasikan, sementara istilah topografis מַעֲלֵה diterjemahkan. Tanda baca dibagi menjadi tiga kalimat agar rangkaian batas mudah diikuti tanpa mengubah urutan unsur dalam teks Ibrani.
