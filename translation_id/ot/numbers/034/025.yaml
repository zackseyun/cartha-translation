  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן פַּרְנָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: id
  text: 'Dan untuk suku keturunan Zebulon, seorang pemimpin: Elizafan anak Parnakh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Dan untuk suku
  rationale: Dalam konteks pembagian wilayah antarsuku, מַטֶּה berarti “suku,” bukan “tongkat.” Gabungan וּ dan לְ diterjemahkan secara alami sebagai “Dan untuk” sesuai bentuk daftar.
- source_word: בְנֵי זְבוּלֻן
  choice: keturunan Zebulon
  rationale: Secara harfiah berarti “anak-anak lelaki Zebulon,” tetapi dalam sebutan kesukuan frasa ini menunjuk secara kolektif kepada keturunannya. “Keturunan Zebulon” mempertahankan hubungan genealogis sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: Kata ini menunjuk pejabat atau kepala yang diakui dalam suatu suku. “Pemimpin” jelas dan tidak menimbulkan kesan monarki seperti “pangeran.”
- source_word: אֱלִיצָפָן
  choice: Elizafan
  rationale: Nama pribadi ditransliterasikan ke bentuk yang mudah dibaca dalam bahasa Indonesia dengan mempertahankan bunyi dasar Ibraninya.
- source_word: בֶּן פַּרְנָךְ
  choice: anak Parnakh
  rationale: בֶּן adalah penanda silsilah “anak laki-laki dari.” Dalam penyebutan nama Indonesia, “anak Parnakh” alami dan cukup jelas; ejaan Parnakh mempertahankan konsonan akhir Ibrani.
