id: NUM.34.3
reference: Numbers 34:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: id
  text: Sisi selatan wilayahmu harus membentang dari padang gurun Zin di sepanjang sisi Edom, dan batas selatanmu harus mulai dari ujung[a] Laut Asin[b] ke arah timur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tepi” atau “bagian terluar.”
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional disebut “Laut Mati”; bahasa Ibraninya berbunyi “Laut Asin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: sisi selatan wilayahmu
  rationale: פֵּאָה dalam uraian batas menunjuk pada sisi suatu wilayah, sedangkan נֶגֶב dipakai secara terarah sebagai ‘selatan’, bukan sebagai nama daerah Negeb.
- source_word: מִמִּדְבַּר צִן
  choice: dari padang gurun Zin
  rationale: מִדְבָּר menunjuk pada daerah belantara atau gurun; ‘padang gurun’ merupakan istilah geografis yang alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: עַל יְדֵי אֱדוֹם
  choice: di sepanjang sisi Edom
  rationale: Ungkapan geografis ini berarti ‘di sisi’ atau ‘berdampingan dengan’; pilihan ini mempertahankan nuansa kedekatan tanpa menganggapnya secara eksplisit sebagai garis perbatasan resmi Edom.
- source_word: גְּבוּל נֶגֶב
  choice: batas selatanmu
  rationale: גְּבוּל adalah batas wilayah, dan נֶגֶב di sini menunjukkan arah selatan.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: dari ujung Laut Asin
  rationale: קָצֶה berarti ujung atau bagian terluar. Nama Ibrani יָם הַמֶּלַח diterjemahkan langsung sebagai ‘Laut Asin’.
- source_word: קֵדְמָה
  choice: ke arah timur
  rationale: Adverbia berarah ini menyatakan orientasi ke timur; frasa Indonesia ini mempertahankan bentuk arah tanpa diam-diam menafsirkannya sebagai ‘ujung timur’.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: harus membentang ... harus mulai
  rationale: Kedua bentuk tersebut memperkenalkan penetapan batas. Variasi alami dalam bahasa Indonesia menghindari pengulangan kaku sambil mempertahankan daya legal-deskriptifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada geografis-legal yang tetap wajar bagi pembaca umum. ‘Harus’ mempertahankan daya penetapan batas, sedangkan ‘membentang’ dan ‘mulai’ membuat rumusan dapat dipahami tanpa mengubah arah atau titik acuannya.
