  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי אֶפְרַ֖יִם נָשִׂ֑יא קְמוּאֵ֖ל בֶּן שִׁפְטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: id
  text: 'Dan untuk suku Efraim[a], seorang pemimpin: Kemuel anak Siftan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “anak-anak lelaki Efraim”; maksudnya, para keturunan atau anggota suku Efraim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Dan untuk suku
  rationale: Dalam daftar administratif ini, מַטֶּה secara idiomatis berarti ‘suku’, bukan tongkat; awalan וּ dan לְ diterjemahkan bersama sebagai ‘Dan untuk’.
- source_word: בְנֵי אֶפְרַיִם
  choice: keturunan Efraim
  rationale: Secara harfiah berarti ‘anak-anak lelaki Efraim’, tetapi dalam rumusan kesukuan menunjuk kepada para keturunan atau anggota suku Efraim. ‘Keturunan Efraim’ alami dalam bahasa Indonesia dan mempertahankan hubungan genealogis tanpa menyiratkan bahwa hanya anak langsung yang dimaksud.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: Dalam konteks ini, kata tersebut menunjuk kepada kepala atau wakil suku yang ditunjuk. ‘Pemimpin’ jelas dan tidak membawa nuansa kerajaan yang mungkin timbul dari ‘pangeran’.
- source_word: קְמוּאֵל
  choice: Kemuel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: בֶּן
  choice: anak
  rationale: Dalam nama patronimik bahasa Indonesia, ‘anak’ merupakan padanan alami untuk ‘son of’ dan menyatakan hubungan ayah-anak.
- source_word: שִׁפְטָן
  choice: Siftan
  rationale: Nama diri ditransliterasikan dari שִׁפְטָן dengan שׁ sebagai s dan פ tanpa dages sebagai f, sesuai pendekatan transliterasi ke bahasa Indonesia.
