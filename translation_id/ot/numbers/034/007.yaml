  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: id
  text: 'Dan inilah yang akan menjadi batas utara kalian: dari Laut Besar[b] kamu harus menarik garis batas menuju Gunung Hor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “kamu harus menandai batas menuju Gunung Hor.” Kata kerjanya dapat berarti menelusuri atau menandai garis batas dalam konteks geografis ini.
    reason: lexical_alternative
  - marker: b
    text: “Laut Besar” mengacu pada Laut Tengah.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: Inilah ... utaramu
  rationale: Ungkapan pembuka memperkenalkan ketentuan batas berikutnya. Bentuk “Inilah” menyampaikan fungsi penunjukan dan ketetapan secara alami dalam bahasa Indonesia; pronomina jamak kolektif diterjemahkan dengan bentuk milik tunggal kolektif yang lazim.
- source_word: גְּבוּל צָפוֹן
  choice: batas utaramu
  rationale: גְּבוּל berarti batas wilayah, sedangkan צָפוֹן menunjuk sisi utara. Susunan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: dari Laut Besar
  rationale: Nama geografis harfiah dipertahankan dalam teks utama, tanpa menggantinya dengan nama modern Laut Tengah.
- source_word: תְּתָאוּ לָ/כֶם
  choice: kamu harus menarik garis batas
  rationale: Dalam konteks penetapan wilayah, verba ini menunjuk tindakan menelusuri atau menetapkan jalur batas. “Menarik garis batas” mengungkapkan tindakan tersebut secara wajar, sedangkan לָכֶם tercakup oleh konteks kepemilikan dan pihak yang diperintah.
- source_word: הֹר הָ/הָר
  choice: Gunung Hor
  rationale: Bentuk Ibrani yang secara harfiah menyerupai “Hor, gunung itu” diperlakukan sebagai nama tempat dan disajikan menurut susunan nama geografis Indonesia.
