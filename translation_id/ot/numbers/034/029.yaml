base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: id
  text: Inilah orang-orang yang Yahweh perintahkan untuk membagikan tanah sebagai milik pusaka kepada orang Israel di tanah Kanaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Inilah orang-orang yang Yahweh perintahkan untuk memberikan tanah itu sebagai milik pusaka kepada orang Israel di tanah Kanaan.”'
    reason: Alternatif ini mempertahankan kemungkinan bahwa לְנַחֵל terutama menekankan tindakan menyebabkan Israel menerima tanah sebagai pusaka, bukan proses pembagiannya.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Mereka inilah yang
  rationale: Ungkapan ini menunjuk kembali kepada para pemimpin yang baru saja disebutkan dan secara wajar mengidentifikasi mereka sebagai kelompok yang dimaksud.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk aktif Ibrani, secara harfiah 'Yahweh memerintahkan mereka', dialihkan menjadi pasif alami dalam bahasa Indonesia tanpa mengubah hubungan pelaku dan penerima perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְנַחֵל
  choice: untuk membagikan tanah pusaka
  rationale: Bentuk Hifil dari נחל dalam konteks pembagian Kanaan menyatakan tindakan membagikan atau menetapkan tanah sebagai milik pusaka; pilihan ini mempertahankan unsur pembagian dan pewarisan.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: kepada orang Israel
  rationale: Dalam konstruksi dengan לְנַחֵל, frasa ini adalah pihak yang menerima pembagian pusaka. 'Orang Israel' merupakan padanan Indonesia yang alami dan mencakup umat Israel secara kolektif.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Padanan ini mempertahankan unsur geografis אֶרֶץ dan nama tempat Kanaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi; transliterasi 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna kausatif לְנַחֵל
  choice: membagikan tanah pusaka kepada orang Israel
  alternative: memberikan tanah itu sebagai milik pusaka kepada orang Israel
  rationale: Konteks para pemimpin yang ditugaskan dalam pembagian tanah mendukung nuansa pengalokasian, tetapi alternatif 'memberikan sebagai milik pusaka' tetap mungkin secara leksikal dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan 'Mereka inilah' memberi penegasan penutup yang sesuai dengan אֵלֶּה, sedangkan 'tanah pusaka' mempertahankan konsep warisan komunal tanpa terdengar terlalu teknis.
