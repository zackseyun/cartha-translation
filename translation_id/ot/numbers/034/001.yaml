lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “Kemudian” menyampaikan urutan itu secara alami. Karena subjeknya Yahweh dan konteksnya adalah penyampaian firman ilahi, “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Padanan Indonesia yang alami untuk preposisi yang menandai pihak yang dituju dalam tindakan berbicara.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Infinitif ini memperkenalkan isi ujaran berikutnya. Dalam bahasa Indonesia, fungsi tersebut sudah tersampaikan secara alami oleh tanda koma setelah “berfirman kepada Musa”; menerjemahkannya sebagai “demikian” atau “kata-Nya” akan menambah unsur yang tidak perlu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Formula pembuka ujaran dibuat alami dalam bahasa Indonesia tanpa menghilangkan fungsi naratifnya.
