base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: id
  text: Kemudian batas itu akan turun ke Sungai Yordan, dan ujung-ujungnya akan berada di Laut Asin[a]. Inilah negeri kalian, beserta batas-batasnya di sekeliling.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani "Laut Asin"; yaitu perairan yang sekarang lazim disebut Laut Mati.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Kemudian ... akan turun
  rationale: Kata kerja ירד berarti 'turun'. Dalam rangkaian penelusuran batas, bentuk futurum sesuai dengan uraian wilayah yang ditetapkan, sedangkan 'Kemudian' menyampaikan urutan secara alami.
- source_word: הַגְּבוּל
  choice: batas itu
  rationale: גְּבוּל menunjuk pada garis batas wilayah; 'batas' merupakan istilah geografis yang ringkas dan alami dalam bahasa Indonesia.
- source_word: הַיַּרְדֵּנָה
  choice: ke Sungai Yordan
  rationale: Akhiran direktif menyatakan gerak menuju Yordan. Penambahan 'Sungai' memperjelas nama geografis secara alami tanpa mengubah acuannya.
- source_word: תוֹצְאֹתָיו
  choice: ujungnya
  rationale: Dalam teks-teks penetapan batas, bentuk ini menunjuk pada titik akhir atau tempat berakhirnya garis batas. Walaupun bentuk katanya jamak, sufiksnya merujuk secara tunggal kepada batas; 'ujungnya' paling alami dalam konteks ini.
- source_word: יָם הַמֶּלַח
  choice: Laut Asin
  rationale: Ungkapan Ibrani secara harfiah berarti 'Laut Asin'. Bentuk ini mempertahankan nama dalam teks sumber; catatan menjelaskan nama modern yang lazim.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Itulah negeri yang akan menjadi milik kalian
  rationale: לָכֶם secara kontekstual menyatakan negeri yang diperuntukkan bagi umat. Rumusan ini alami dan tetap mempertahankan fungsi ringkasan penetapan wilayah.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: dengan batas-batasnya di sekelilingnya
  rationale: Frasa ini menggambarkan negeri tersebut berdasarkan batas-batas yang mengelilinginya, tanpa menambahkan rincian yang tidak ada dalam sumber.
