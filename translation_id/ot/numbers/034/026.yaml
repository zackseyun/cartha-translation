  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי יִשָׂשכָ֖ר נָשִׂ֑יא פַּלְטִיאֵ֖ל בֶּן עַזָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/026.yaml
  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: id
  text: 'dan untuk suku bani Isakhar, seorang pemimpin: Paltiel anak Azzan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: dan untuk suku
  rationale: Dalam konteks pembagian wilayah menurut suku, מַטֶּה berarti 'suku'; awalan וּ dan לְ diterjemahkan 'dan untuk' sesuai bentuk daftar ini.
- source_word: בְנֵי יִשָׂשכָר
  choice: keturunan Isakhar
  rationale: Secara harfiah berarti 'anak-anak lelaki Isakhar', tetapi dalam penamaan suku frasa ini menunjuk kepada keturunannya; 'keturunan Isakhar' alami dan tidak mengubah cakupan kelompok.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: Istilah ini menunjuk pemimpin atau wakil suku yang ditunjuk; 'pemimpin' jelas dalam bahasa Indonesia modern dan tidak memberi kesan gelar kerajaan.
- source_word: פַּלְטִיאֵל
  choice: Paltiel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Penanda patronimik ini secara langsung menyatakan hubungan ayah-anak; dalam bahasa Indonesia, 'anak Azan' merupakan bentuk yang ringkas dan alami.
- source_word: עַזָּן
  choice: Azan
  rationale: Nama diri ditransliterasikan dengan satu z sesuai pengucapan konsonan Ibrani dan bentuk Indonesia yang sederhana.
