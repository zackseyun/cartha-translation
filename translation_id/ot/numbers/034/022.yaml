  text: וּ/לְ/מַטֵּ֥ה בְנֵי דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן יָגְלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/022.yaml
  text: 'And for the tribe of the sons of Dan[a], a leader: Bukki son of Jogli.'
translation:
  language: id
  text: Dan bagi suku keturunan Dan, pemimpinnya ialah Bukki anak Yogli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Dan untuk suku
  rationale: Dalam konteks pembagian tanah di Bilangan, מַטֶּה berarti 'suku', bukan arti dasarnya 'tongkat'. Awalan וּ dan לְ diterjemahkan secara alami sebagai 'Dan untuk'.
- source_word: בְנֵי דָן
  choice: keturunan Dan
  rationale: Secara harfiah ungkapan ini berarti 'anak-anak lelaki Dan', tetapi dalam rumusan kesukuan menunjuk kepada seluruh keturunan atau anggota suku Dan. 'Keturunan Dan' alami dalam bahasa Indonesia dan tetap mempertahankan gagasan kekerabatan.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: Istilah ini menunjuk kepada wakil atau kepala suku yang ditunjuk untuk pembagian tanah; 'pemimpin' jelas, modern, dan tidak menyiratkan gelar kerajaan.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Nama pribadi dialihaksarakan secara wajar ke dalam ejaan bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Ungkapan patronimik ini secara langsung mengidentifikasi Buki sebagai anak Yogli; 'anak' merupakan bentuk alami dalam bahasa Indonesia.
- source_word: יָגְלִי
  choice: Yogli
  rationale: Nama Ibrani diawali yod dan dialihaksarakan dengan Y sesuai kebiasaan ejaan bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur nominal singkat teks Ibrani dipertahankan, termasuk tanda titik dua sebelum nama pemimpin. Tidak diperlukan catatan kaki karena 'keturunan Dan' menyampaikan fungsi ungkapan Ibrani dengan alami tanpa kehilangan makna penting.
