base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: id
  text: Dari Gunung Hor, kalian harus menarik garis batas sampai ke Lebo-Hamat[a], dan titik-titik akhir batas itu akan berada di Zedad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “ke pintu masuk Hamat”; kemungkinan besar ini adalah nama tempat tetap, Lebo-Hamat.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: Dari Gunung Hor
  rationale: Konstruksi Ibrani ini merupakan nama tempat baku untuk Gunung Hor, dengan prefiks מִן yang berarti 'dari'.
- source_word: תְּתָאוּ
  choice: kamu harus menarik garis batas
  rationale: Dalam konteks penetapan wilayah, verba ini menunjuk pada tindakan menarik atau menetapkan jalur batas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran garis geografis.
- source_word: לְבֹא חֲמָת
  choice: sampai ke Lebo-Hamat
  rationale: Secara harfiah berarti 'ke jalan masuk Hamat', tetapi kemungkinan berfungsi sebagai nama geografis tetap. Bentuk nama tempat dipakai dalam teks, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: וְהָיוּ
  choice: dan ... akan berada
  rationale: Dalam rangkaian petunjuk batas ini, bentuk tersebut secara alami menyatakan hasil atau lokasi batas selanjutnya.
- source_word: תּוֹצְאֹת
  choice: ujung
  rationale: Dalam uraian wilayah, nomina ini menunjuk pada titik akhir atau batas terluar. Bentuk tunggal kolektif 'ujung batas itu' lebih alami dalam bahasa Indonesia.
- source_word: הַגְּבֻל
  choice: batas
  rationale: Padanan umum dan alami untuk batas wilayah dalam bahasa Indonesia.
- source_word: צְדָדָה
  choice: di Zedad
  rationale: Nama tempat ini menyatakan lokasi ujung batas; 'di Zedad' menyampaikan fungsi geografis tersebut secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan lugas. Bentuk 'kamu' mengikuti sapaan tunggal dalam sumber Ibrani, sementara istilah batas dibuat mudah dipahami tanpa menghilangkan fungsi geografisnya.
