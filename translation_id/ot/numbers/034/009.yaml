  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: id
  text: Lalu, batas itu akan berlanjut ke Zifron, dan titik akhirnya[a] akan di Hazar-Enan. Inilah batas utara kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tempat-tempat berakhirnya.” Bahasa Ibrani menggunakan bentuk jamak untuk titik akhir batas itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא הַגְּבֻל
  choice: Lalu batas itu akan memanjang
  rationale: Dalam uraian batas wilayah, יצא menggambarkan jalur batas yang berlanjut atau memanjang, bukan gerak harfiah.
- source_word: זִפְרֹנָה
  choice: sampai Zifron
  rationale: Akhiran direktif menunjukkan arah menuju tempat tersebut; 'sampai' sesuai dengan konteks penelusuran garis batas.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: dan ujungnya akan berada
  rationale: Ungkapan Ibrani berbentuk jamak secara gramatikal, tetapi dalam konteks batas menunjuk pada tempat berakhirnya garis tersebut; bentuk tunggal kolektif lebih alami dalam bahasa Indonesia.
- source_word: חֲצַר עֵינָן
  choice: Hazar-Enan
  rationale: Nama tempat ditransliterasikan dan unsur-unsurnya dihubungkan dengan tanda hubung.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל צָפוֹן
  choice: Inilah yang akan menjadi batas utara kalian
  rationale: Menyampaikan fungsi rangkuman klausa Ibrani dengan bahasa Indonesia modern serta mempertahankan sapaan jamak לָכֶם melalui 'kalian'.
