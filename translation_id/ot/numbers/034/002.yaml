  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kamu” dipertahankan sebagai sapaan kolektif kepada Israel; konteks memperjelas bahwa acuannya jamak. Susunan kalimat mengikuti bentuk perintah dan penetapan wilayah dalam teks Ibrani tanpa mempertahankan idiom yang akan terdengar janggal dalam teks utama.
