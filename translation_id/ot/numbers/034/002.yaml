    rationale: לָכֶם berarti "kepada kalian/untuk kamu sekalian." Walaupun "kamu" dapat bersifat kolektif, "-mu" mudah dibaca secara tunggal. Menggunakan "kalian" menjaga rujukan jamak dengan jelas.
