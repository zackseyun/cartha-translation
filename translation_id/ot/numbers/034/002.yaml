base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: id
  text: 'Perintahkanlah orang Israel dan katakan kepada mereka: ‘Ketika kalian memasuki tanah Kanaan, inilah tanah yang akan menjadi milik kalian sebagai warisan: tanah Kanaan menurut batas-batasnya.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַו
  choice: Perintahkanlah
  rationale: Bentuk imperatif dari צוה menyatakan perintah yang tegas dan berwibawa; “perintahkanlah” mempertahankan kekuatan tersebut secara wajar dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk kepada umat yang berasal dari Israel. “Keturunan Israel” mempertahankan hubungan asal-usul tanpa memberi kesan bahwa hanya anak laki-laki yang disapa.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakan kepada mereka
  rationale: Terjemahan langsung dan alami untuk rangkaian perintah kepada Musa.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Ketika kamu memasuki
  rationale: כִּי di sini memperkenalkan keadaan waktu, sedangkan bentuk partisip בָּאִים mengarah pada peristiwa masuk yang akan terjadi. “Ketika kamu memasuki” menyampaikan maksud itu secara alami.
- source_word: הָאָרֶץ כְּנָעַן
  choice: tanah Kanaan
  rationale: Padanan baku dan jelas bagi penyebutan wilayah Kanaan.
- source_word: זֹאת הָאָרֶץ
  choice: inilah negeri
  rationale: “Inilah” mempertahankan daya penunjuk זֹאת, sedangkan “negeri” di sini menandai wilayah yang batas-batasnya akan ditetapkan dan menghindari pengulangan “tanah” yang kaku.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם בְּנַחֲלָה
  choice: yang akan menjadi bagian warisanmu
  rationale: Secara harfiah tanah itu akan “jatuh” kepada mereka sebagai נחלה. Dalam konteks pembagian wilayah, ungkapan ini berarti menjadi bagian yang ditetapkan sebagai warisan; pilihan ini menyampaikan idiom tersebut secara alami sambil mempertahankan gagasan bagian warisan.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: tanah Kanaan menurut batas-batasnya
  rationale: Frasa ini menetapkan wilayah Kanaan berdasarkan batas-batas yang segera diuraikan; “menurut batas-batasnya” mempertahankan bentuk dan fungsi pembatasan wilayah tersebut.
