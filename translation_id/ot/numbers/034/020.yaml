  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: id
  text: 'Dan untuk suku bani Simeon: Semuel anak Amihud.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibraninya שְׁמוּאֵל (Shemu'el); bentuk tradisionalnya adalah "Samuel".
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: dan untuk suku
  rationale: Dalam konteks penetapan administratif ini, מַטֶּה berarti kelompok suku, bukan tongkat atau cabang; prefiks וּ dan לְ diterjemahkan secara alami sebagai 'dan untuk'.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Secara harfiah berarti 'anak-anak lelaki', tetapi dalam rumusan kesukuan menunjuk kepada para keturunan; 'keturunan Simeon' lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁמוּאֵל
  choice: Semuel
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani; catatan kaki mencantumkan bentuk tradisional yang lebih dikenal.
- source_word: בֶּן
  choice: anak
  rationale: Penanda silsilah ini secara langsung menyatakan hubungan ayah-anak dalam daftar pemimpin.
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Transliterasi nama Ibrani yang sesuai dengan ejaan Indonesia.
