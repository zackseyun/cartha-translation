  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumusan 'suku keturunan Simeon' dipilih agar idiom kesukuan Ibrani jelas bagi pembaca modern tanpa mengubah hubungan genealogis pada nama berikutnya.
