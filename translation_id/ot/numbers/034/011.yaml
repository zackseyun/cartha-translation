  register: 'Bahasa Indonesia baku modern dengan gaya uraian geografis yang lugas dan bermartabat. Pengulangan ‘batas itu turun’ dipertahankan karena mencerminkan struktur teks Ibrani. Nama tempat mengikuti transliterasi Indonesia: Sefam, Ribla, Ain, dan Kineret.'
