  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: id
  text: Kemudian batas itu turun dari Sefam ke Ribla, di sebelah timur Ain[a]. Lalu batas itu turun dan mencapai lereng di sisi timur Danau Kineret[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya juga dapat diterjemahkan ‘di timur Ain’ atau ‘ke arah timur dari Ain’.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ‘menyentuh bahu Danau Kineret ke arah timur’. Dalam bahasa geografis, ‘bahu’ menunjuk pada sisi atau lereng medan di dekat danau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: turun
  rationale: Kata kerja ירד berarti ‘turun’. Dalam uraian batas wilayah, kata ini menggambarkan arah pergerakan garis batas dan dapat dipertahankan secara alami dalam bahasa Indonesia.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: batas itu
  rationale: גְּבוּל menunjuk pada batas wilayah. ‘Batas itu’ ringkas, jelas, dan sesuai dengan konteks penetapan wilayah.
- source_word: מִשְּׁפָם
  choice: dari Sefam
  rationale: Nama tempat ditransliterasikan ke dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: הָרִבְלָה
  choice: ke Ribla
  rationale: Nama tempat ditransliterasikan, sedangkan arah tujuan yang tersirat dalam bentuk Ibrani dinyatakan dengan kata depan ‘ke’.
- source_word: מִקֶּדֶם לָעָיִן
  choice: di sebelah timur Ain
  rationale: Ungkapan ini menempatkan Ribla di sebelah timur Ain. Terjemahan tersebut jelas dan alami tanpa menghilangkan hubungan geografisnya.
- source_word: וּמָחָה
  choice: mencapai
  rationale: Dalam konteks topografi, kata kerja ini menyatakan bahwa garis batas menyentuh atau sampai pada suatu bagian medan. ‘Mencapai’ menyampaikan makna itu secara alami.
- source_word: עַל כֶּתֶף
  choice: lereng di sisi
  rationale: כֶּתֶף secara harfiah berarti ‘bahu’, tetapi dalam pemakaian geografis dapat menunjuk pada sisi atau lereng suatu bentang alam. ‘Lereng di sisi’ mempertahankan unsur topografis tanpa memakai ungkapan harfiah yang kabur.
- source_word: יָם כִּנֶּרֶת
  choice: Danau Kineret
  rationale: יָם dapat menyebut perairan besar dan di sini merujuk pada danau yang dikenal sebagai Kineret. Nama Ibraninya dipertahankan, sedangkan ‘Danau’ lebih alami dan akurat secara geografis dalam bahasa Indonesia.
- source_word: קֵדְמָה
  choice: timur
  rationale: Kata arah ini menunjukkan sisi atau orientasi timur; dalam susunan bahasa Indonesia paling alami dinyatakan sebagai ‘di sisi timur’.
theological_decisions: []
