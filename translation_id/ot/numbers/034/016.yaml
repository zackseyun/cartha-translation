  text: Kemudian Yahweh berfirman kepada Musa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol meneruskan urutan narasi. “Kemudian” menyatakan perkembangan itu secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek verba דִּבֶּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam tindakan berbicara; “kepada Musa” adalah ungkapan Indonesia modern yang tepat.
- source_word: לֵאמֹר
  choice: '[diwakili oleh tanda koma]'
  rationale: Dalam formula pengantar ujaran ini, לֵאמֹר menandai bahwa tuturan langsung segera menyusul. Dalam bahasa Indonesia, fungsi tersebut paling alami dinyatakan dengan verba “berfirman” dan tanda koma, tanpa menambahkan ungkapan kaku “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Formula Ibrani dibuat alami dalam bahasa sasaran sambil mempertahankan urutan narasi dan fungsi pengantar bagi firman langsung pada ayat berikutnya.
