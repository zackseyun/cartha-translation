  text: שְׁנֵ֥י הַ/מַּטּ֖וֹת וַ/חֲצִ֣י הַ/מַּטֶּ֑ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֛בֶר לְ/יַרְדֵּ֥ן יְרֵח֖וֹ קֵ֥דְמָ/ה מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: id
  text: Kedua suku dan setengah suku itu telah mengambil milik pusaka mereka di seberang Sungai Yordan, dekat Yerikho[a], ke arah timur[b], ke arah matahari terbit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di kawasan Yerikho.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani memakai ungkapan ganda, “ke arah timur, ke arah matahari terbit,” untuk menekankan sisi timur.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: kedua suku
  rationale: Dalam konteks pembagian tanah, מַטֶּה secara idiomatis berarti ‘suku’, bukan tongkat; bentuk dengan bilangan menunjuk kepada dua suku yang sudah disebutkan.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: dan setengah suku itu
  rationale: Ungkapan ini menunjuk kepada unit yang dikenal sebagai setengah suku, yakni setengah suku Manasye dalam konteks tersebut.
- source_word: לָקְחוּ
  choice: telah mengambil
  rationale: Bentuk perfektif menyatakan tindakan yang sudah selesai; ‘telah mengambil’ mempertahankan arti langsung לקח tanpa mengubahnya menjadi ‘menerima’.
- source_word: נַחֲלָתָם
  choice: milik pusaka mereka
  rationale: ‘Milik pusaka’ merupakan ungkapan Indonesia yang alami dan bermartabat untuk tanah warisan yang menjadi bagian mereka.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini menunjuk kepada wilayah di sisi lain Yordan dari sudut pandang pembicara; ‘di seberang’ mempertahankan sifat relasionalnya.
- source_word: יְרֵחוֹ
  choice: dekat Yerikho
  rationale: Nama tempat ini berfungsi secara adverbial untuk menentukan bagian Sungai Yordan yang berada di sekitar Yerikho; ‘dekat Yerikho’ alami dan tidak memberi kesan bahwa sungainya berada di dalam kota.
- source_word: קֵדְמָה
  choice: ke arah timur
  rationale: Akhiran lokatif menyatakan arah; frasa Indonesia ini mempertahankan daya adverbialnya.
- source_word: מִזְרָחָה
  choice: ke arah matahari terbit
  rationale: Pilihan ini mempertahankan citra etimologis ‘terbit’ sekaligus membedakannya dari קֵדְמָה, sehingga penggandaan penekanan dalam bahasa Ibrani tidak diratakan.
