  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. ‘Kedua suku’ dipilih daripada ‘dua suku’ karena merujuk kembali kepada kelompok tertentu. Pengulangan arah dipertahankan agar penekanan teks Ibrani tetap terasa.
