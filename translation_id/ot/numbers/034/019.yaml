  yaml_path: translation/ot/numbers/034/019.yaml
  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: id
  text: 'Dan inilah nama para lelaki itu: dari suku Yehuda, Kaleb anak Yefune.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Kata sambung וְ meneruskan konteks sebelumnya, sedangkan אֵלֶּה memperkenalkan identitas orang-orang yang ditunjuk. Dalam bahasa Indonesia, “Inilah” menyampaikan fungsi pengenalan itu secara alami tanpa perlu meniru klausa tanpa verba bahasa Ibrani secara kaku.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: nama orang-orang itu
  rationale: Bentuk konstruksi שְׁמוֹת mengikat “nama” dengan הָאֲנָשִׁים. “Orang-orang” tetap merujuk pada para laki-laki tertentu dalam konteks daftar wakil, sementara ungkapan ini lebih wajar dalam bahasa Indonesia daripada “nama para pria”.
- source_word: לְמַטֵּה יְהוּדָה
  choice: untuk suku Yehuda
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti “suku,” bukan tongkat. Prefiks לְ menandai suku yang diwakili oleh orang yang disebut.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah atau patronimik Ibrani, בֶּן menyatakan hubungan sebagai putra. Bahasa Indonesia secara alami memakai “anak” dalam rangkaian nama seperti ini.
- source_word: יְפֻנֶּה
  choice: Yefune
  rationale: Transliterasi Indonesia yang mendekati bentuk Ibrani dan selaras dengan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
