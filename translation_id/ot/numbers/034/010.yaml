  text: וְ/הִתְאַוִּיתֶ֥ם לָ/כֶ֖ם לִ/גְב֣וּל קֵ֑דְמָ/ה מֵ/חֲצַ֥ר עֵינָ֖ן שְׁפָֽמָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: id
  text: Kalian harus menandai garis batas sebelah timur bagi diri kalian sendiri, dari Hazar-Enan sampai Sefam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menarik garis batas sebelah timur bagi diri kalian sendiri.” Verba Ibrani di sini tidak lazim dan dalam konteks ini mengacu pada penandaan atau penarikan garis batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: harus menetapkan
  rationale: Dalam konteks penentuan wilayah, bentuk verba yang tidak lazim ini menunjuk pada tindakan menandai atau menarik garis batas. 'Menetapkan' terdengar alami dalam bahasa Indonesia untuk konteks hukum-geografis.
- source_word: לָכֶם
  choice: bagimu
  rationale: Mempertahankan nuansa datif bahwa batas itu ditetapkan bagi umat Israel; bentuk jamak Ibrani diungkapkan secara idiomatis melalui pronomina kolektif Indonesia.
- source_word: לִגְבוּל קֵדְמָה
  choice: batas timur
  rationale: גְּבוּל adalah batas wilayah, sedangkan קֵדְמָה menentukan sisi timur; susunan ini alami dan jelas dalam bahasa Indonesia.
- source_word: מֵחֲצַר עֵינָן
  choice: dari Hazar-Enan
  rationale: Nama tempat ditransliterasikan dan preposisi sumber dipertahankan sebagai titik awal garis batas.
- source_word: שְׁפָמָה
  choice: sampai ke Sefam
  rationale: He lokatif pada nama tempat menyatakan arah atau tujuan; 'sampai ke' melengkapi rentang yang dimulai dengan 'dari' tanpa mengubah nama tempat.
