  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: id
  text: 'Dan untuk suku keturunan Naftali[a], seorang pemimpin: Pedael anak Amihud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “anak-anak lelaki Naftali,” sebutan baku bagi suku yang berarti keturunan Naftali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: Dan untuk suku
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti suku, bukan tongkat; prefiks וּ dan לְ diterjemahkan secara alami sebagai 'Dan untuk'.
- source_word: בְנֵי נַפְתָּלִי
  choice: keturunan Naftali
  rationale: Secara harfiah berarti 'anak-anak lelaki Naftali', tetapi sebagai sebutan baku suatu suku, frasa ini secara idiomatis menunjuk kepada para keturunan Naftali. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: Dalam daftar administratif ini, נָשִׂיא menunjuk kepada kepala atau pemimpin suku yang ditunjuk; 'pemimpin' jelas dan tidak memberi kesan monarki.
- source_word: פְּדַהְאֵל
  choice: Pedael
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Rumus patronimik baku; 'anak' merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
