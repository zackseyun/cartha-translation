  register: Bahasa Indonesia baku, lugas, dan bermartabat. Bentuk tunggal berakhiran “-mu” digunakan secara kolektif untuk komunitas Israel. Pengulangan “batas” dipertahankan agar mencerminkan susunan dan penegasan teks sumber.
