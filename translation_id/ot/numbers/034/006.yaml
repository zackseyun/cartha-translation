  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: id
  text: Batas sebelah baratmu[a] adalah Laut Besar, yang menjadi batasmu; itulah batas sebelah baratmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “batas laut” atau “batas yang menghadap laut.” Dalam konteks penetapan wilayah ini, kata Ibrani יָם (yam, “laut”) juga dipakai untuk menunjukkan arah barat, yaitu sisi yang menghadap laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: batas
  rationale: Dalam konteks penetapan wilayah, nomina ini menunjuk pada garis batas suatu daerah; “batas” adalah padanan Indonesia yang alami dan tepat.
- source_word: יָם
  choice: sebelah barat
  rationale: Dalam frasa גְּבוּל יָם, kata yang secara harfiah berarti “laut” berfungsi sebagai penunjuk arah ke sisi laut, yaitu barat.
- source_word: הַיָּם הַגָּדוֹל
  choice: Laut Besar
  rationale: Ungkapan ini merupakan sebutan geografis bagi Laut Tengah; terjemahan mempertahankan bentuk sebutan Ibraninya.
- source_word: וְהָיָה לָכֶם
  choice: -mu adalah
  rationale: Bentuk ini menyatakan apa yang menjadi batas bagi umat yang disapa secara kolektif; akhiran “-mu” mempertahankan sapaan orang kedua jamak secara wajar dalam bahasa Indonesia.
- source_word: וּגְבוּל
  choice: sebagai batasnya
  rationale: Frasa ini menjelaskan fungsi Laut Besar sebagai batas wilayah, sambil mempertahankan pengulangan unsur “batas” dalam teks Ibrani.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: itulah
  rationale: Kata tunjuk ini merangkum dan menegaskan kembali ketentuan batas yang baru disebutkan.
- source_word: גְּבוּל יָם
  choice: batas sebelah barat
  rationale: Dalam daftar batas wilayah ini, “laut” memiliki fungsi arah dan secara kontekstual berarti sisi barat.
