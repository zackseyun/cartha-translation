  naturalness: Kalimat draf umumnya baku, tetapi “Laut Besar sebagai batasnya” terasa kurang alami dan “-nya” ambigu. Klausa relatif “yang menjadi batasmu” lebih jelas dan alami dalam bahasa Indonesia modern.
