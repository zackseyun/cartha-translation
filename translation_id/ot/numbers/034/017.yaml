  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: id
  text: 'Inilah nama-nama orang-orang yang akan membagikan negeri itu kepadamu sebagai milik pusaka: Imam Eleazar dan Yosua anak Nun.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberikan negeri itu kepadamu sebagai milik pusaka” atau “membuat kamu mewarisi negeri itu.” Kata kerja Ibrani yang digunakan mengandung pengertian menyebabkan seseorang menerima warisan atau menetapkan negeri itu sebagai milik pusaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Inilah nama
  rationale: Ungkapan penunjuk dalam klausa Ibrani tanpa kopula diterjemahkan secara alami sebagai pengantar daftar identitas.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Merujuk kepada para laki-laki tertentu yang ditunjuk; dalam bahasa Indonesia, 'orang-orang' alami dan tidak mengaburkan bahwa tokoh yang kemudian disebut adalah laki-laki.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif yang memperkenalkan tugas orang-orang tersebut.
- source_word: יִנְחֲלוּ לָכֶם אֶת־הָאָרֶץ
  choice: akan membagikan negeri itu kepadamu sebagai milik pusaka
  rationale: Bentuk Hifil dari נחל bersifat kausatif dan dalam konteks ini menunjuk pada tindakan mengalokasikan negeri agar Israel menerimanya sebagai warisan; 'membagikan ... sebagai milik pusaka' mempertahankan unsur administratif dan pewarisan.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Susunan gelar sebelum nama lebih alami dalam bahasa Indonesia dan tetap menyatakan jabatan Eleazar.
- source_word: וִיהוֹשֻׁעַ בִּן־נוּן
  choice: dan Yosua anak Nun
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia serta mempertahankan ungkapan patronimik.
theological_decisions:
- issue: Nuansa kausatif dan administratif verba נחל
  choice: membagikan negeri itu kepadamu sebagai milik pusaka
  alternative: memberikan negeri itu kepadamu sebagai milik pusaka; membuat kamu mewarisi negeri itu
  rationale: Pilihan utama menyatakan bahwa Eleazar dan Yosua bertugas mengalokasikan tanah, bukan menjadi sumber ilahi warisan itu atau mewarisinya bagi Israel; catatan kaki mempertahankan keluasan makna verba.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Negeri' dipilih untuk wilayah tanah perjanjian, sedangkan 'milik pusaka' mempertahankan istilah warisan yang lazim dan bermuatan kontekstual. Bentuk tunggal 'kepadamu' mengikuti sapaan kolektif kepada Israel dan terdengar alami dalam register Alkitab Indonesia.
