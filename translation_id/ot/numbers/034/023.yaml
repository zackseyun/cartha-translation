base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: id
  text: 'Bagi keturunan Yusuf, bagi suku keturunan Manasye: seorang pemimpin, Haniel anak Efod.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Dari keturunan Yusuf
  rationale: Dalam konteks daftar suku, בְּנֵי secara harfiah berarti 'anak-anak lelaki', tetapi merujuk pada keturunan atau kelompok suku. 'Keturunan Yusuf' menyampaikan maksud genealogis secara alami dalam bahasa Indonesia; prefiks לְ dipahami dalam hubungan penunjukan wakil dari kelompok tersebut.
- source_word: לְמַטֵּה
  choice: untuk suku
  rationale: מַטֶּה secara idiomatis berarti 'suku' dalam konteks administratif dan pembagian tanah; לְ diterjemahkan 'untuk'.
- source_word: בְנֵי מְנַשֶּׁה
  choice: keturunan Manasye
  rationale: Ungkapan konstruksi ini menunjuk kepada keturunan atau kelompok suku Manasye. 'Keturunan' lebih alami daripada 'anak-anak lelaki' dalam bahasa Indonesia modern.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: Kata ini menunjuk kepala atau wakil suku yang ditunjuk. 'Pemimpin' jelas dan tidak menimbulkan kesan gelar kerajaan seperti 'pangeran'.
- source_word: חַנִּיאֵל
  choice: Haniel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן אֵפֹד
  choice: anak Efod
  rationale: Konstruksi patronimik Ibrani berarti bahwa Haniel adalah putra Efod. Efod di sini adalah nama orang, bukan pakaian imam.
theological_decisions: []
