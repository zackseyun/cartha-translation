base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: id
  text: Segala hasil pertama dari segala yang ada di negeri mereka yang mereka bawa kepada TUHAN akan menjadi milikmu. Setiap orang di rumahmu yang tahir[a] boleh memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, tahir secara ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: hasil pertama
  rationale: Menunjuk pada hasil awal panen yang dipersembahkan. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan hasil yang pertama.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: segala ... dari negeri mereka
  rationale: Menyatakan cakupan dan asal hasil tersebut tanpa menambahkan rincian pertanian yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: yang mereka bawa kepada TUHAN
  rationale: Mempertahankan arti langsung verba 'membawa'; konteksnya sudah menunjukkan bahwa yang dibawa itu merupakan persembahan.
- source_word: לְךָ יִהְיֶה
  choice: akan menjadi milikmu
  rationale: Mengungkapkan penetapan hak atas bagian persembahan kepada Harun secara jelas dan idiomatis.
- source_word: יהוה
  choice: TUHAN
  rationale: Mengikuti bentuk baku bahasa Indonesia untuk nama ilahi dalam konteks Kitab Suci, dengan huruf kapital yang membedakannya dari gelar biasa.
- source_word: כָּל טָהוֹר
  choice: setiap orang ... yang tahir
  rationale: Dalam peraturan keimaman, טָהוֹר terutama menyatakan status kesucian ritual. 'Tahir' ringkas dan sesuai dengan konteks, sedangkan catatan kaki memperjelas maksudnya.
- source_word: בְּבֵיתְךָ
  choice: di rumahmu
  rationale: Terjemahan dekat yang dalam konteks merujuk kepada anggota rumah tangga Harun.
- source_word: יֹאכֲלֶנּוּ
  choice: boleh memakannya
  rationale: Bentuk imperfek di sini menyatakan izin atau hak untuk makan, bukan sekadar tindakan pada masa mendatang.
theological_decisions:
- issue: Makna ketahiran dalam peraturan keimaman
  choice: Anggota rumah tangga Harun yang tahir secara ritual boleh memakan bagian imam tersebut.
  alternative: Orang yang bersih atau murni secara moral dalam arti umum.
  rationale: Konteks Bilangan 18 membahas hak imam dan ketentuan kesucian ritual; karena itu טָהוֹר menunjuk terutama pada status ritual, bukan penilaian moral secara umum.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. 'Hasil pertama' lebih mudah dipahami pembaca umum daripada istilah teknis yang kurang lazim, sedangkan 'tahir' mempertahankan nuansa peraturan ritual dan dijelaskan melalui catatan kaki.
