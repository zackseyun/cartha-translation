  source_fidelity: Frasa בְּאַרְצָם secara harfiah berarti “di negeri mereka,” sedangkan draf “dari negeri mereka” sedikit menggeser penanda lokasi/asalan. Dalam konteks hasil pertama, pergeseran ini tidak besar, tetapi dapat diperbaiki tanpa mengurangi kejelasan. Unsur-unsur lain—pembawaan kepada TUHAN, kepemilikan bagi Harun, dan izin bagi orang yang tahir—tersampaikan dengan tepat.
  naturalness: Bahasa draf umumnya wajar, modern, dan cukup khidmat. “Hasil pertama” dan “tahir” cocok untuk konteks peraturan keimaman. “Dari segala yang ada di negeri mereka” mempertahankan cakupan ungkapan Ibrani tanpa memaksakan rincian jenis hasil.
  terminology: “TUHAN” merupakan padanan baku yang konsisten untuk יהוה. “Tahir” tepat bagi טָהוֹר dalam konteks ritual; catatan kaki secara tepat menjelaskan bahwa ini adalah ketahiran ritual, bukan terutama kemurnian moral. “Boleh memakannya” dengan baik menyampaikan izin/hak yang tersirat dalam konteks.
