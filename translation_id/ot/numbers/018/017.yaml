id: NUM.18.17
reference: Numbers 18:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: id
  text: Namun, anak sulung sapi, anak sulung domba, atau anak sulung kambing tidak boleh kamu tebus; semuanya itu kudus. Darahnya harus kamu percikkan pada mazbah, dan lemaknya harus kamu bakar sebagai persembahan yang dibakar[a], suatu aroma yang menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan melalui api.”
    reason: Mencatat padanan formal yang lazim bagi אִשֶּׁה tanpa menyatakan sebagai makna langsung suatu etimologi yang diperselisihkan.
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pembatasan atau pengecualian terhadap ketentuan sebelumnya dengan penghubung pertentangan yang alami dalam bahasa Indonesia.
- source_word: בְּכוֹר
  choice: anak sulung
  rationale: Mengungkapkan keturunan pertama yang memiliki kedudukan khusus dalam hukum peribadatan ini.
- source_word: שׁוֹר
  choice: sapi
  rationale: Kata Ibrani ini menunjuk pada jenis hewan bovina secara umum di sini; 'sapi' lebih alami dan tidak menentukan jenis kelamin secara berlebihan.
- source_word: כֶּשֶׂב
  choice: domba
  rationale: Dalam daftar sejajar dengan sapi dan kambing, istilah ini paling tepat dipahami sebagai kategori jenis hewan, bukan dibatasi menjadi anak domba.
- source_word: עֵז
  choice: kambing
  rationale: Padanan langsung untuk jenis hewan dalam daftar kurban.
- source_word: לֹא תִפְדֶּה
  choice: tidak boleh kamu tebus
  rationale: פדה dalam konteks hukum keimaman berarti membebaskan melalui pembayaran atau penggantian; bentuk ini mempertahankan larangan yang tegas.
- source_word: קֹדֶשׁ הֵם
  choice: semuanya itu kudus
  rationale: Pernyataan predikatif ini memberikan alasan mengapa hewan-hewan tersebut tidak boleh ditebus; 'kudus' mempertahankan nuansa peribadatan.
- source_word: תִּזְרֹק
  choice: harus kamu percikkan
  rationale: זרק menunjuk pada tindakan ritual mengenakan darah pada mazbah. 'Percikkan' adalah ungkapan Indonesia yang lazim, meskipun tindakan aslinya dapat berupa melemparkan atau menyiramkan darah.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dan ringkas untuk tempat persembahan kurban, sekaligus mempertahankan register peribadatan.
- source_word: חֶלֶב
  choice: lemak
  rationale: Menunjuk pada bagian lemak kurban yang dikhususkan untuk dibakar.
- source_word: תַּקְטִיר
  choice: harus kamu bakar
  rationale: Bentuk kausatif קטר dalam konteks kurban berarti membakar di atas mazbah sehingga asapnya naik.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Menyampaikan idiom tentang aroma kurban yang diterima dengan berkenan tanpa menambahkan penafsiran teologis di luar teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama diri itu dan membedakannya dari gelar 'Tuhan'.
- issue: Makna istilah kurban אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan berupa makanan
  rationale: Istilah ini secara tradisional dihubungkan dengan api dan dapat merujuk pada persembahan yang diproses dengan pembakaran, sedangkan sebagian analisis leksikal mengaitkannya dengan sajian atau makanan bagi Allah. Teks utama memakai ungkapan yang sesuai dengan tindakan membakar dalam ayat ini, dan alternatif dicatat tanpa memaksakan penyelesaian atas ketidakpastian leksikal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan hukum dipertahankan, tetapi kewajiban Ibrani diungkapkan secara alami dengan 'tidak boleh' dan 'harus'. Istilah 'mazbah' dipakai untuk ketepatan konteks peribadatan; nama ilahi ditulis 'Yahweh'.
