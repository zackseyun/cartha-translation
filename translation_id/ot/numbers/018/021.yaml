  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: id
  text: Kepada bani Lewi, sesungguhnya, Aku telah memberikan seluruh persepuluhan di Israel sebagai milik pusaka, sebagai imbalan[a] atas pelayanan yang mereka lakukan, yaitu pelayanan di Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai pengganti” atau “sebagai balasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי לֵוִי
  choice: Kepada bani Lewi
  rationale: Ungkapan ini mempertahankan bentuk genealogis harfiah ‘anak-anak Lewi’ melalui istilah Indonesia yang wajar dan bermartabat, ‘bani Lewi’, tanpa mengubahnya menjadi sebutan kelompok yang lebih interpretatif.
- source_word: הִנֵּה
  choice: sesungguhnya
  rationale: Kata ini menandai penegasan dan mengarahkan perhatian kepada ketetapan yang diumumkan. ‘Sesungguhnya’ menyampaikan daya penegasannya secara alami dalam ragam Alkitab Indonesia modern.
- source_word: נָתַתִּי
  choice: Aku telah memberikan
  rationale: Bentuk perfektif menyatakan pemberian yang telah ditetapkan dan berlaku. ‘Telah memberikan’ mempertahankan aspek keputusan yang sudah terlaksana.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: segala persembahan persepuluhan di Israel
  rationale: מַעֲשֵׂר menunjuk pada sepersepuluh yang dipersembahkan. ‘Segala persembahan persepuluhan’ jelas bagi pembaca Indonesia dan mencerminkan cakupan כָּל.
- source_word: לְנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נַחֲלָה adalah bagian atau kepemilikan yang dialokasikan sebagai warisan. ‘Milik pusaka’ cocok dengan konteks pembagian hak Israel dan tidak membatasi maknanya pada tanah.
- source_word: חֵלֶף
  choice: sebagai imbalan
  rationale: חֵלֶף menyatakan penggantian, pertukaran, atau balasan. ‘Sebagai imbalan’ dengan jelas menunjukkan hubungan antara pemberian persepuluhan dan pelayanan orang Lewi tanpa menjadikannya bahasa upah komersial.
- source_word: עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים
  choice: atas tugas yang mereka kerjakan
  rationale: Akar עבד diulang dalam bahasa Ibrani. Ungkapan Indonesia ini menyampaikan baik tugas maupun pelaksanaannya tanpa pengulangan yang kaku.
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: yaitu tugas di Kemah Pertemuan
  rationale: Frasa ini menjelaskan bahwa tugas tersebut berkaitan dengan אֹהֶל מוֹעֵד. ‘Kemah Pertemuan’ adalah padanan langsung dan mapan, sedangkan ‘di’ menghasilkan hubungan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan persepuluhan dengan pelayanan bani Lewi
  choice: Persepuluhan diberikan sebagai milik pusaka sekaligus sebagai imbalan atas tugas mereka di Kemah Pertemuan.
  alternative: Persepuluhan hanya dipandang sebagai jatah bagi bani Lewi, tanpa penekanan pada sifatnya sebagai imbalan pelayanan.
  rationale: Teks secara eksplisit menggabungkan לְנַחֲלָה (‘sebagai milik pusaka’) dan חֵלֶף עֲבֹדָתָם (‘sebagai imbalan atas tugas mereka’). Keduanya dipertahankan tanpa menyamakan milik pusaka itu semata-mata dengan upah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Bani Lewi’, ‘milik pusaka’, dan ‘Kemah Pertemuan’ mempertahankan warna historis-teologis teks, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
