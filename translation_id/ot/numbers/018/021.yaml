  to: Kepada bani Lewi, sesungguhnya, Aku telah memberikan seluruh persepuluhan di Israel sebagai milik pusaka, sebagai imbalan[a] atas pelayanan yang mereka lakukan, yaitu pelayanan di Kemah Pertemuan.
  rationale: Revisi menghilangkan “persembahan,” yang tidak ada dalam teks sumber, dan mengganti “tugas” dengan “pelayanan” untuk mencerminkan עֲבֹדָה secara lebih setia dalam konteks kultis. “Di Kemah Pertemuan” menyatakan secara idiomatis dalam bahasa Indonesia tempat atau lingkup pelayanan yang dimaksud oleh konstruksi Ibrani.
