  naturalness: Susunan kalimat pada dasarnya baik dan ragamnya modern-baku. “Seluruh persepuluhan” dan pengulangan “pelayanan” menghasilkan padanan yang lebih langsung serta tetap alami.
  terminology: “Bani Lewi,” “milik pusaka,” dan “Kemah Pertemuan” sesuai dan konsisten dengan register Alkitab Indonesia. “Pelayanan” lebih tepat daripada “tugas” untuk עֲבֹדָה dalam konteks ini.
