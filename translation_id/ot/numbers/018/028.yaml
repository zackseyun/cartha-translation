  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: id
  text: Demikianlah kamu juga harus mempersembahkan persembahan khusus bagi Yahweh dari segala persepuluhanmu yang kamu terima dari bani Israel[a]. Dari persepuluhan itu kamu harus memberikan persembahan khusus bagi Yahweh kepada Imam Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; ungkapan Ibrani ini lazim menunjuk kepada bani atau umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikian juga
  rationale: Menghubungkan perintah ini dengan perintah sebelumnya dan, bersama גַם אַתֶּם, menegaskan bahwa kaum Lewi juga wajib menyisihkan bagian persembahan.
- source_word: תָּרִימוּ
  choice: harus mempersembahkan
  rationale: Bentuk Hifil dari רום dalam konteks תְּרוּמָה menunjuk pada tindakan menyisihkan dan menyerahkan bagian yang dikhususkan; pilihan ini alami dalam bahasa Indonesia tanpa memakai ungkapan harfiah 'mengangkat'.
- source_word: תְּרוּמַת יְהוָה
  choice: persembahan khusus bagi Yahweh
  rationale: תְּרוּמָה adalah bagian yang dipisahkan dan dipersembahkan. 'Persembahan khusus' mempertahankan gagasan bagian yang dikhususkan, sedangkan 'bagi Yahweh' menyatakan peruntukannya tanpa menyiratkan bahwa Yahweh adalah pemilik yang secara langsung menyerahkannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi diterjemahkan secara langsung sebagai 'Yahweh'.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: dari segala persepuluhanmu
  rationale: '''Persepuluhan'' adalah istilah Indonesia yang lazim untuk מַעֲשֵׂר; ''segala'' mempertahankan כֹּל dan bentuk jamaknya.'
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: yang kamu terima dari bani Israel
  rationale: Dalam konteks penetapan ibadah dan pengelolaan ini, לקח berarti menerima persepuluhan yang menjadi hak kaum Lewi. 'Bani Israel' mempertahankan corak rumusan Ibrani tanpa terdengar seolah-olah mereka merampasnya.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: Dari persepuluhan itu kamu harus memberikan
  rationale: Mengungkapkan makna partitif מִמֶּנּוּ dengan jelas. Pengulangan 'persepuluhan itu' menghindari rujukan pronominal yang kabur dalam bahasa Indonesia.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: kepada Imam Harun
  rationale: לְ menandai penerima. Susunan 'Imam Harun' lebih alami dalam bahasa Indonesia daripada 'Harun sang imam' dan tetap mempertahankan gelarnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel atau anak-anak Israel
  rationale: '''Bani Israel'' merupakan ungkapan Indonesia yang dikenal luas dan mempertahankan corak genealogis serta kolektif dari ungkapan Ibrani. Catatan kaki menjelaskan bentuk harfiahnya tanpa memaksakan ungkapan yang kurang alami ke dalam teks utama.'
- issue: Hubungan תְּרוּמָה dengan Yahweh dan Harun
  choice: persembahan khusus bagi Yahweh ... kepada Imam Harun
  alternative: persembahan khusus milik Yahweh ... untuk Harun
  rationale: 'Rumusan ini menjaga ketegangan dalam teks: bagian itu dikhususkan bagi Yahweh, tetapi diberikan kepada Harun sebagai imam, tanpa melebur kedua hubungan tersebut.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kata ganti 'kamu' mempertahankan sapaan jamak kepada kaum Lewi sesuai konteks, meskipun bahasa Indonesia tidak menandai jumlah. Kalimat Ibrani yang panjang dibagi menjadi dua agar jelas, tanpa mengubah urutan logisnya.
