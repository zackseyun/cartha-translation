  naturalness: Teksnya umumnya baku dan jelas. Namun, pembuka 'Demikian juga' kurang langsung mencerminkan gabungan כֵּן dan גַּם אַתֶּם. 'Demikianlah kamu juga harus' lebih alami dan lebih dekat pada susunan serta penekanan sumber.
