  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: id
  text: Namun, orang Lewi itu sendiri harus melaksanakan pelayanan di Kemah Pertemuan, dan mereka akan menanggung kesalahan mereka.[a] Ini adalah ketetapan untuk selama-lamanya bagi kamu turun-temurun. Di antara orang Israel,[b] mereka tidak akan memperoleh milik pusaka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idiom Ibrani ini dapat berarti menanggung kesalahan, keadaan bersalah, atau tanggung gugat maupun akibat yang melekat padanya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di antara anak-anak Israel,” suatu ungkapan kolektif bagi bangsa Israel.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “mereka tidak akan mewarisi warisan.” Bahasa Ibrani memakai kata kerja dan kata benda yang seakar untuk menegaskan bahwa mereka tidak mendapat bagian tanah pusaka kesukuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: harus melaksanakan
  rationale: Bentuk verba dalam konteks hukum menyatakan kewajiban. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya preskriptifnya.
- source_word: הַלֵּוִי הוּא
  choice: orang Lewi itu sendiri
  rationale: Kata ganti mandiri הוּא memberi penekanan; “itu sendiri” menyampaikan penekanan tersebut tanpa menambahkan makna eksklusif.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: pelayanan di Kemah Pertemuan
  rationale: עֲבֹדָה di sini menunjuk pada tugas atau pelayanan kultis. “Pelayanan” lebih wajar daripada pengulangan harfiah dengan verba “melayani,” sedangkan “Kemah Pertemuan” merupakan padanan yang jelas bagi אֹהֶל מוֹעֵד.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: dan mereka harus menanggung kesalahan mereka
  rationale: Ungkapan נשא עון dipertahankan sebagai idiom “menanggung kesalahan,” tanpa membatasi maknanya hanya pada rasa bersalah, hukuman, atau akibat. Pergeseran dari subjek tunggal ke jamak juga dipertahankan.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan yang berlaku untuk selamanya
  rationale: Padanan ini menyampaikan daya tahan ketetapan tersebut dalam tata perjanjian Israel dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: לְדֹרֹתֵיכֶם
  choice: bagi kamu turun-temurun
  rationale: Ungkapan ini menunjukkan keberlakuan bagi generasi-generasi berikutnya; “turun-temurun” merupakan idiom Indonesia yang alami.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: di antara orang Israel
  rationale: בתוך bermakna “di antara” dalam konteks ini. “Orang Israel” menyampaikan rujukan etnis kolektif secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: mereka tidak akan memperoleh milik pusaka
  rationale: Padanan ini menyatakan penolakan atas bagian tanah pusaka dengan bahasa Indonesia yang alami. Pengulangan serumpun dalam bahasa Ibrani dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna idiom hukum-kultis נשא עון
  choice: menanggung kesalahan mereka
  alternative: menanggung kesalahan atau akibat yang timbul darinya
  rationale: Terjemahan utama mempertahankan ketegangan semantis antara kesalahan, tanggung jawab, dan konsekuensinya, tanpa menetapkan salah satu sebagai satu-satunya arti.
- issue: Cakupan חֻקַּת עוֹלָם dalam tata perjanjian Israel
  choice: ketetapan yang berlaku untuk selamanya bagi kamu turun-temurun
  alternative: ketetapan tetap bagi generasi-generasimu
  rationale: Terjemahan mempertahankan bahasa duratif teks tanpa menambahkan kesimpulan teologis mengenai penerapannya di luar pihak yang disapa dan tata perjanjian dalam konteks ini.
- issue: Ungkapan etnis בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan sumber secara harfiah berarti “anak-anak lelaki Israel,” tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. Bentuk alami dipakai dalam teks, sementara bentuk harfiah dicatat agar detail sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “Kemah Pertemuan” dan “milik pusaka” dipertahankan sebagai kosakata Alkitab yang masih mudah dipahami. Struktur tunggal “orang Lewi itu sendiri” lalu jamak “mereka” mengikuti sumber dan tidak diselaraskan secara diam-diam.
