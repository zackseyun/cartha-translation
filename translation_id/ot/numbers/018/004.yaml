base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: id
  text: Mereka harus bergabung dengan engkau dan menjalankan tugas penjagaan Kemah Pertemuan dalam seluruh pelayanan di Kemah itu. Namun, orang yang tidak berwenang[a] tidak boleh mendekati kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang luar” atau “orang asing”; di sini maksudnya ialah orang yang tidak berwenang menjalankan atau mendekati pelayanan tempat kudus, bukan orang asing berdasarkan etnis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְוּוּ עָלֶיךָ
  choice: Mereka harus bergabung dengan engkau
  rationale: Nifal לוה dengan עַל menyatakan keterikatan kepada Harun untuk membantu pelayanannya. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan arah keterikatan kepada orang kedua tunggal.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: dan menjalankan tugas penjagaan
  rationale: Gabungan שׁמר dan מִשְׁמֶרֶת menunjuk pada pelaksanaan tanggung jawab yang dipercayakan, dengan nuansa menjaga. 'Menjalankan tugas penjagaan' mempertahankan kedua unsur tersebut.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku dan jelas untuk tempat kudus Israel, sekaligus mencerminkan unsur 'kemah' dan 'pertemuan' dalam bahasa sumber.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: dalam seluruh pelayanan di Kemah itu
  rationale: עֲבֹדָה dalam konteks Kemah Suci berarti pelayanan atau pekerjaan resmi yang ditugaskan. 'Di Kemah itu' lebih alami daripada konstruksi posesif yang dapat terdengar seolah-olah Kemah melakukan pelayanan.
- source_word: וְזָר
  choice: Namun, orang yang tidak berwenang
  rationale: זָר dalam hukum tempat kudus menunjuk kepada orang di luar peran yang diizinkan, bukan terutama orang asing secara etnis. 'Tidak berwenang' menyatakan batas akses ritual secara langsung.
- source_word: יִקְרַב אֲלֵיכֶם
  choice: tidak boleh mendekati kalian
  rationale: קרב menyatakan mendekat ke lingkungan kudus. Bentuk אֲלֵיכֶם jamak, sehingga 'kalian' mempertahankan peralihan dari sapaan tunggal kepada Harun ke kelompok yang mencakup Harun dan para pelayan yang berwenang.
theological_decisions:
- issue: Makna זָר dalam peraturan tempat kudus
  choice: orang yang tidak berwenang, yakni orang di luar peran pelayanan tempat kudus yang diizinkan
  alternative: orang asing; orang luar
  rationale: Konteks membahas kewenangan untuk mendekati dan melayani di tempat kudus, bukan asal etnis. Terjemahan ini menghindari kesan bahwa larangan tersebut ditentukan semata-mata oleh kebangsaan.
- issue: Peralihan dari pronomina tunggal ke jamak
  choice: '''engkau'' untuk עָלֶיךָ dan ''kalian'' untuk אֲלֵיכֶם'
  alternative: memakai 'kamu' untuk keduanya
  rationale: Bahasa Ibrani mula-mula menyapa Harun secara tunggal, lalu memakai bentuk jamak. Mempertahankan peralihan ini menjaga keluasan rujukan akhir tanpa menetapkan lebih jauh siapa saja yang tercakup.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Engkau' dipakai bagi sapaan tunggal kepada Harun, sedangkan 'kalian' mempertahankan bentuk jamak pada akhir ayat. Istilah 'tugas penjagaan' menjaga nuansa tanggung jawab resmi sekaligus tindakan menjaga.
