  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: id
  text: Dan persembahanmu akan diperhitungkan bagimu[a][b] seperti hasil biji-bijian dari tempat pengirikan dan seperti seluruh hasil dari tempat pemerasan anggur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan dianggap bagimu” atau “akan dihitung bagimu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sumbanganmu”; secara tradisional, “persembahan unjukanmu.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kepenuhan dari tempat pemerasan anggur,” yaitu seluruh hasil atau produk dari tempat pemerasan anggur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: akan diperhitungkan bagimu
  rationale: Bentuk Nifal dari חשׁב menyatakan bahwa sesuatu dianggap atau dinilai sebagai sesuatu yang setara. Ungkapan ini mempertahankan nuansa hukum dan ibadah dalam konteks.
- source_word: תְּרוּמַתְכֶם
  choice: persembahanmu
  rationale: תְּרוּמָה menunjuk pada sumbangan yang dikhususkan bagi penggunaan suci. 'Persembahan' merupakan istilah Indonesia yang alami dan sesuai konteks; nuansa 'sumbangan' dicatat dalam catatan kaki.
- source_word: כַּדָּגָן
  choice: seperti gandum
  rationale: דָּגָן berarti biji-bijian atau hasil serealia; dalam konteks pertanian Israel, 'gandum' merupakan padanan Indonesia yang jelas dan alami.
- source_word: מִן הַגֹּרֶן
  choice: dari tempat pengirikan
  rationale: גֹּרֶן adalah lokasi hasil panen diirik. Terjemahan ini mempertahankan gambaran pertanian dan metonimia hasil yang berasal dari tempat pengirikan.
- source_word: וְכַמְלֵאָה
  choice: dan seperti hasil penuh
  rationale: מְלֵאָה secara harfiah menyatakan 'kepenuhan', tetapi di sini sejajar dengan gandum dan menunjuk pada seluruh hasil tempat pemerasan. 'Hasil penuh' mempertahankan unsur kepenuhan sekaligus menjelaskan acuannya.
- source_word: מִן הַיָּקֶב
  choice: dari tempat pemerasan anggur
  rationale: יֶקֶב menunjuk pada tempat pemerasan anggur atau bak penampungnya. Pilihan ini jelas bagi pembaca modern dan sesuai dengan paralel pertanian dalam ayat.
