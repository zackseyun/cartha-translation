base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: id
  text: Katakanlah kepada mereka, ‘Ketika kamu menyerahkan bagian terbaiknya[a] darinya sebagai persembahan, hal itu akan diperhitungkan bagi orang Lewi sebagai hasil tempat pengirikan dan sebagai hasil tempat pemerasan anggur.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lemaknya”; di sini ungkapan itu menunjuk pada bagian hasil bumi yang paling kaya atau terbaik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: Katakanlah kepada mereka
  rationale: Bentuk orang kedua tunggal ditujukan kepada Musa dan menyampaikan perintah langsung secara wajar dalam bahasa Indonesia.
- source_word: בַּהֲרִימְכֶם
  choice: Setelah kamu mengkhususkan
  rationale: Infinitif Hifil dari רום dalam konteks persembahan menunjuk pada tindakan memisahkan atau mempersembahkan suatu bagian; 'mengkhususkan' menyampaikan fungsi kultisnya tanpa menuntut gambaran mengangkat secara harfiah.
- source_word: חֶלְבּוֹ
  choice: bagian terbaiknya
  rationale: Secara harfiah berarti 'lemaknya', tetapi dalam konteks hasil bumi merupakan ungkapan untuk bagian yang paling kaya atau terbaik.
- source_word: מִמֶּנּוּ
  choice: dari persembahan itu
  rationale: Pronomina merujuk pada persembahan persepuluhan dalam konteks sebelumnya; nomina diperjelas agar rujukannya alami dalam bahasa Indonesia.
- source_word: וְנֶחְשַׁב
  choice: akan diperhitungkan
  rationale: 'Bentuk pasif dari חשב memuat nuansa legal atau akuntansi: sesuatu diakui atau dinilai sebagai hasil milik mereka.'
- source_word: לַלְוִיִּם
  choice: bagi orang Lewi
  rationale: Preposisi ל menyatakan hubungan atau kepentingan orang Lewi; 'bagi' terdengar alami dan mempertahankan makna tersebut.
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: sebagai hasil dari tempat pengirikan
  rationale: תבואה berarti hasil atau panen, sedangkan גרן adalah tempat pengirikan; terjemahan mempertahankan citra pertanian dan konstruksi perbandingannya.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: dan sebagai hasil dari tempat pemerasan anggur
  rationale: יקב menunjuk pada tempat pemerasan atau bak anggur; ungkapan ini jelas bagi pembaca modern dan mempertahankan paralelisme.
