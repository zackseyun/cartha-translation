    issue: Konstruksi “anak sulung yang membuka rahim” dapat dibaca secara agentif dan tidak idiomatis.
    rationale: פֶּטֶר רֶחֶם adalah idiom bagi keturunan pertama yang keluar dari rahim, bukan tindakan aktif anak itu membuka rahim. Perumusan eksplisit menghindari salah baca sambil mempertahankan makna.
  - severity: medium
    issue: Jangkar catatan b ditempatkan setelah “Yahweh,” sedangkan isi catatan menjelaskan verba “serahkan.”
    rationale: Jangkar harus ditempatkan langsung setelah unsur yang dijelaskan agar rujukan catatan tidak ambigu.
