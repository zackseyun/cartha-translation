  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: id
  text: Setiap anak sulung—yang pertama keluar dari rahim[a]—dari segala makhluk hidup yang mereka serahkan[b] kepada Yahweh, baik manusia maupun hewan, akan menjadi milikmu. Namun, anak sulung manusia haruslah kautebus, dan anak sulung hewan najis haruslah kautebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “setiap yang membuka rahim.” Ungkapan Ibrani ini menunjuk pada keturunan pertama yang keluar dari rahim.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “persembahkan kepada Yahweh.” Kata Ibraninya dapat berarti “membawa mendekat” atau “mempersembahkan” dalam konteks persembahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: anak sulung yang membuka rahim
  rationale: Ungkapan Ibrani ini menunjuk pada keturunan pertama yang keluar dari rahim. Pilihan ini mempertahankan gambaran sumber sekaligus menjelaskan bahwa yang dimaksud ialah anak sulung.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: setiap ... dari segala makhluk hidup
  rationale: Ungkapan ini memberi cakupan menyeluruh atas manusia dan hewan. 'Makhluk hidup' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'daging' dalam konteks ini.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: yang mereka serahkan kepada Yahweh
  rationale: Dalam konteks persembahan, verba ini berarti membawa mendekat atau mempersembahkan. 'Serahkan' tetap cukup luas karena ayat ini mencakup anak sulung manusia dan hewan, yang tidak semuanya dikurbankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: baik manusia maupun hewan
  rationale: Frasa ini secara alami menyatakan dua kelompok yang tercakup oleh ketentuan tersebut.
- source_word: יִהְיֶה לָּךְ
  choice: akan menjadi milikmu
  rationale: Bentuk ini menyatakan hak imam atas yang diserahkan.
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini memperkenalkan pembatasan penting terhadap pernyataan sebelumnya.
- source_word: פָּדֹה תִפְדֶּה
  choice: haruslah kautebus
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kewajiban untuk menebus. Bentuk 'haruslah' menyampaikan perintah yang tegas secara alami.
- source_word: בְּכוֹר הָאָדָם
  choice: anak sulung manusia
  rationale: אָדָם di sini menunjuk pada manusia sebagai lawan dari hewan; pilihan ini tepat dan inklusif secara leksikal.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: anak sulung hewan najis
  rationale: Frasa ini menunjuk pada hewan yang secara ritual tidak layak dipersembahkan sebagai kurban dan karena itu harus ditebus.
theological_decisions:
- issue: Arti אָדָם dalam pertentangannya dengan hewan
  choice: manusia
  alternative: orang; umat manusia
  rationale: Dalam ayat ini kata tersebut menyebut kategori manusia secara umum, berlawanan dengan kategori hewan, bukan khusus laki-laki.
- issue: Sifat penyerahan anak sulung kepada Yahweh
  choice: serahkan kepada Yahweh
  alternative: persembahkan kepada Yahweh; bawa mendekat kepada Yahweh
  rationale: Konteksnya bersifat kultis, tetapi pembatasan dalam ayat yang sama menunjukkan bahwa anak sulung manusia dan hewan najis ditebus, bukan dikurbankan. Karena itu, terjemahan utama tidak mempersempit semua penyerahan menjadi tindakan pengurbanan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Bentuk terikat 'kautebus' digunakan secara konsisten dan alami. Pengulangan 'haruslah kautebus' dipertahankan pada kedua objek agar penekanan serta struktur sumber tetap jelas.
