revisions:
- from: 'Katakanlah juga kepada orang-orang Lewi: Ketika kamu menerima dari keturunan Israel persembahan persepuluhan yang telah Kuberikan kepadamu dari mereka sebagai milik pusakamu, kamu harus mempersembahkan sebagian darinya sebagai persembahan khusus bagi Yahweh,[a] yakni sepersepuluh dari persembahan persepuluhan itu.[b]'
  to: 'Berbicaralah kepada orang-orang Lewi dan katakanlah kepada mereka: Ketika kamu menerima dari orang Israel persembahan persepuluhan yang telah Kuberikan kepadamu dari mereka sebagai bagian pusaka kalian, kamu harus mempersembahkan dari padanya persembahan khusus bagi Yahweh,[a] yaitu sepersepuluh dari persembahan persepuluhan itu.[b]'
  rationale: Revisi memulihkan kedua verba dalam formula perintah, menghapus penambahan 'juga', dan memakai 'orang Israel' untuk fungsi kolektif ungkapan Ibrani. Istilah kultis dan ambiguitas hubungan 'persembahan khusus bagi/milik Yahweh' dipertahankan, dengan alternatif tetap di catatan kaki. Penanda catatan kaki tetap melekat pada unsur yang dijelaskan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:48:54Z'
review_pass:
  verdict: revise
  source_fidelity: Perlu revisi ringan. Draf menyampaikan alur utama, yaitu orang Lewi menerima persepuluhan dari Israel dan harus mempersembahkan sepersepuluh darinya kepada Yahweh. Namun, formula dua verba תְּדַבֵּר ... וְאָמַרְתָּ ('berbicaralah ... dan katakanlah') direduksi menjadi 'Katakanlah juga'; kata 'juga' tidak terdapat dalam ayat ini. Selain itu, 'keturunan Israel' dapat terutama dipahami sebagai para keturunan Israel secara genealogis, sedangkan idiom בְּנֵי יִשְׂרָאֵל di sini adalah sebutan kolektif bagi umat/orang Israel.
  naturalness: Teks draf umumnya baku dan mudah dipahami. Revisi mempertahankan register khidmat-modern sambil memulihkan formula instruksional Ibrani. 'Bagian pusaka kalian' lebih alami dan lebih tepat daripada 'milik pusakamu' dalam konteks bagian yang dialokasikan.
  terminology: '''Orang-orang Lewi,'' ''persembahan persepuluhan,'' dan ''Yahweh'' sesuai. ''Persembahan khusus bagi Yahweh'' merupakan pemahaman yang wajar untuk תְּרוּמַת יְהוָה; catatan alternatif dengan tepat menjaga kemungkinan genitif ''milik Yahweh.'''
  issues:
  - severity: medium
    issue: Formula 'berbicaralah ... dan katakanlah' tidak dipertahankan; 'juga' ditambahkan.
    rationale: Teks Ibrani secara eksplisit memakai dua verba tutur, תְּדַבֵּר dan וְאָמַרְתָּ, dan tidak memuat padanan untuk 'juga'. Memulihkan keduanya meningkatkan kesetiaan tanpa membuat bahasa Indonesia tidak alami.
  - severity: low
    issue: '''keturunan Israel'' kurang tepat untuk idiom kolektif בְּנֵי יִשְׂרָאֵל.'
    rationale: Dalam konteks hukum ini ungkapan tersebut menunjuk kepada komunitas Israel yang menyerahkan persepuluhan, bukan terutama garis keturunan. 'Orang Israel' menyampaikan rujukan kolektif dengan alami.
  - severity: low
    issue: '''milik pusakamu'' kurang idiomatis dan berpotensi memberi kesan benda milik, bukan bagian yang dialokasikan.'
    rationale: בְּנַחֲלַתְכֶם menyatakan persepuluhan itu diberikan sebagai bagian pusaka/warisan bagi orang Lewi.
