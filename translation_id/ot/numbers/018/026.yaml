language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: id
  text: 'Berbicaralah kepada orang-orang Lewi dan katakanlah kepada mereka: Ketika kamu menerima dari orang Israel persembahan persepuluhan yang telah Kuberikan kepadamu dari mereka sebagai bagian pusaka kalian, kamu harus mempersembahkan dari padanya persembahan khusus bagi Yahweh,[a] yaitu sepersepuluh dari persembahan persepuluhan itu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan khusus milik Yahweh”; secara tradisional, “persembahan unjukan bagi Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “persepuluhan dari persepuluhan,” yaitu sepersepuluh dari persembahan persepuluhan yang diterima orang-orang Lewi.
    reason: clarification
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan alami dalam bahasa Indonesia bagi anggota suku Lewi.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: Katakanlah juga
  rationale: Dua verba dalam formula perintah Ibrani menyampaikan satu tindakan tutur; penggabungan ini menghasilkan bahasa Indonesia yang alami tanpa menghilangkan daya perintahnya. Kata 'juga' menghubungkannya dengan perintah sebelumnya.
- source_word: כִּי תִקְחוּ
  choice: Ketika kamu menerima
  rationale: כִּי memperkenalkan keadaan berlakunya perintah. Dalam konteks ini לקח menunjuk pada penerimaan persepuluhan dari Israel, sehingga 'menerima' lebih alami daripada 'mengambil'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Mempertahankan gagasan hubungan keturunan dalam ungkapan harfiah 'anak-anak lelaki Israel' sambil memakai bentuk kolektif yang wajar dan mencakup umat Israel dalam bahasa Indonesia.
- source_word: הַמַּעֲשֵׂר
  choice: persembahan persepuluhan
  rationale: Istilah Indonesia yang mapan untuk bagian sepersepuluh yang diwajibkan dalam hukum ibadah.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: yang telah Kuberikan kepadamu dari mereka
  rationale: Mempertahankan bahwa Allah adalah pemberi, sedangkan persepuluhan itu berasal dari umat Israel.
- source_word: בְּנַחֲלַתְכֶם
  choice: sebagai milik pusakamu
  rationale: Menyatakan bagian yang ditetapkan bagi orang Lewi sebagai pusaka mereka, sebagai ganti kepemilikan wilayah.
- source_word: וַהֲרֵמֹתֶם
  choice: kamu harus mempersembahkan sebagian darinya
  rationale: Dalam konteks ibadah, bentuk Hifil dari רום berarti menyerahkan atau mempersembahkan bagian yang dikhususkan; 'sebagian darinya' memperjelas sumber persembahan tanpa menentukan jumlah sebelum frasa penutup.
- source_word: תְּרוּמַת יְהוָה
  choice: persembahan khusus bagi Yahweh
  rationale: תְּרוּמָה adalah bagian yang dipisahkan dan diserahkan. 'Bagi Yahweh' mempertahankan kemungkinan genitif tujuan, sedangkan catatan kaki mencatat kemungkinan kepunyaan.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: sepersepuluh dari persembahan persepuluhan itu
  rationale: 'Mengungkapkan secara jelas hubungan partitif מן: orang Lewi menyerahkan sepersepuluh dari persepuluhan yang mereka terima.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian dan membedakannya dari gelar umum.
- issue: Hubungan genitif dalam תְּרוּמַת יְהוָה
  choice: persembahan khusus bagi Yahweh
  alternative: persembahan khusus milik Yahweh
  rationale: Konstruksi Ibrani dapat menunjuk pada persembahan yang diperuntukkan bagi Yahweh atau yang menjadi milik-Nya. Teks utama memakai tujuan yang alami dalam konteks tindakan mempersembahkan, sementara alternatif dicatat agar ambiguitas tidak dihapus.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang-orang Israel atau anak-anak lelaki Israel
  rationale: Ungkapan Ibrani secara bentuk berarti 'anak-anak lelaki Israel', tetapi lazim berfungsi sebagai sebutan kolektif bagi umat Israel; 'keturunan Israel' menjaga unsur genealogis tanpa membatasi rujukannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal pada 'Katakanlah' ditujukan kepada Musa, sedangkan 'kamu' dalam klausa berikutnya bersifat jamak dan ditujukan kepada orang-orang Lewi; perbedaan ini mengikuti bentuk Ibrani meskipun bahasa Indonesia tidak menandainya secara morfologis.
