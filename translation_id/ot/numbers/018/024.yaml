source:
  edition: WLC
  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: id
  text: Sebab persepuluhan dari umat Israel, yang mereka persembahkan kepada TUHAN sebagai persembahan khusus, telah Kuberikan kepada orang Lewi sebagai milik pusaka. Itulah sebabnya Aku berkata kepada mereka, ‘Di tengah-tengah umat Israel, mereka tidak akan mendapat milik pusaka.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: persepuluhan
  rationale: Istilah baku dan mudah dipahami untuk bagian sepersepuluh yang diberikan dalam ketentuan ini.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Dalam konteks kolektif ini, frasa idiomatis Ibrani menunjuk kepada bangsa Israel secara keseluruhan; 'umat Israel' lebih alami daripada terjemahan harfiah 'anak-anak Israel'.
- source_word: יָרִימוּ ... תְּרוּמָה
  choice: mereka persembahkan ... sebagai persembahan khusus
  rationale: Kata kerja secara harfiah berarti 'mengangkat', tetapi dalam konteks ibadah berarti menyerahkan atau mempersembahkan; תְּרוּמָה dibedakan sebagai persembahan yang dikhususkan.
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Mempertahankan gagasan bagian warisan yang ditetapkan, baik untuk persepuluhan yang menjadi bagian orang Lewi maupun tanah pusaka yang tidak mereka terima.
- source_word: יהוה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk merepresentasikan nama ilahi YHWH dengan huruf kapital.
theological_decisions:
- issue: Sifat persepuluhan sebagai pusaka orang Lewi
  choice: Persepuluhan disebut sebagai milik pusaka yang Allah berikan kepada orang Lewi.
  alternative: Menjelaskannya hanya sebagai upah atau nafkah pelayanan.
  rationale: Teks memakai נַחֲלָה secara eksplisit dan menghubungkannya dengan tidak adanya milik pusaka di tengah Israel; terjemahan tidak menambahkan penafsiran mengenai upah.
- issue: Cakupan pernyataan bahwa orang Lewi tidak memperoleh pusaka
  choice: Mempertahankan pernyataan umum 'tidak akan mendapat milik pusaka' tanpa menambahkan 'tanah'.
  alternative: Menerjemahkan 'tidak akan mendapat tanah pusaka'.
  rationale: Walaupun konteksnya terutama menyangkut pusaka teritorial, teks hanya mengulangi נַחֲלָה; membiarkannya tanpa tambahan menjaga hubungan dan ketegangan dengan persepuluhan yang justru diberikan sebagai pusaka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Susunan kalimat dibentuk secara alami sambil mempertahankan hubungan sebab-akibat dan pengulangan istilah 'milik pusaka'. Pronomina ilahi ditulis dengan kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
