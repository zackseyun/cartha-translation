  to: Namun, engkau dan anak-anakmu yang bersamamu harus menjaga jabatan imam kalian dalam segala hal yang berkaitan dengan mezbah dan dengan yang di balik tabir; kamu harus menjalankan pelayanan itu. Aku memberikan kepada kalian jabatan imam sebagai karunia untuk menjalankan pelayanan.[a] Tetapi orang yang tidak berwenang[b] yang mendekat harus dihukum mati.
