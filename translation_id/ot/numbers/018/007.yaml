  naturalness: 'Registernya umumnya baku dan sesuai. Revisi memperjelas cakupan tugas serta memakai susunan yang lebih alami: “yang di balik tabir” dan “sebagai karunia untuk menjalankan pelayanan.”'
  terminology: “Jabatan imam” secara alami menyatakan כְּהֻנָּה sebagai jabatan/fungsi, “mezbah” dan “tabir” tepat, dan “orang yang tidak berwenang” dengan catatan tetap menghindari salah paham etnis atas זָר.
  issues:
