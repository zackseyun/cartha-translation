    rationale: עֲבֹדַת מַתָּנָה adalah frasa padat yang menerangkan pemberian keimaman dalam kaitannya dengan pelayanan. Dalam bahasa Indonesia, “pelayanan karunia” terdengar tidak lazim dan dapat disalahpahami.
  - severity: low
    issue: “dengan apa yang ada di sebelah dalam tabir” kurang idiomatis.
    rationale: Ungkapan Ibrani menunjuk pada yang berada di dalam/di balik tabir. “Yang di balik tabir” menyampaikan acuan ruang itu dengan lebih jelas.
  - severity: low
    issue: Pronomina pada “tugas keimamanmu” dapat tampak hanya merujuk kepada Harun, meskipun perintah mencakup Harun dan anak-anaknya.
    rationale: Bentuk Ibrani untuk “keimaman kalian” adalah jamak. “Jabatan imam kalian” mempertahankan cakupan kolektifnya.
  revised_text: Namun, engkau dan anak-anakmu yang bersamamu harus menjaga jabatan imam kalian dalam segala hal yang berkaitan dengan mezbah dan dengan yang di balik tabir; kamu harus menjalankan pelayanan itu. Aku memberikan kepada kalian jabatan imam sebagai karunia untuk menjalankan pelayanan.[a] Tetapi orang yang tidak berwenang[b] yang mendekat harus dihukum mati.
