  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: id
  text: Namun, engkau dan anak-anakmu yang bersamamu harus menjaga jabatan imam kalian dalam segala hal yang berkaitan dengan mezbah dan dengan yang di balik tabir; kamu harus menjalankan pelayanan itu. Aku memberikan kepada kalian jabatan imam sebagai karunia untuk menjalankan pelayanan.[a] Tetapi orang yang tidak berwenang[b] yang mendekat harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku memberikan kepada kalian jabatan imam sebagai pelayanan yang diberikan sebagai karunia.” Ungkapan Ibraninya dapat menekankan bahwa pelayanan itu merupakan karunia atau bahwa jabatan imam dikaruniakan untuk dijalankan sebagai pelayanan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang luar” atau “orang asing.” Di sini istilah Ibraninya menunjuk kepada siapa pun yang tidak diberi wewenang untuk menjalankan tugas keimaman, bukan khusus kepada orang dari bangsa lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: harus menjaga
  rationale: Kata שׁמר di sini berarti menjaga dan mengemban tanggung jawab yang dipercayakan; “menjaga” mempertahankan unsur pengawasan, bukan sekadar melakukan.
- source_word: כְּהֻנַּתְכֶם
  choice: tugas keimamanmu
  rationale: Bentuk ini menunjuk pada jabatan dan fungsi keimaman. “Tugas keimaman” lebih wajar dalam bahasa Indonesia modern daripada “keimamanmu” saja dan sesuai dengan konteks tanggung jawab pelayanan.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: dalam segala hal yang berkenaan dengan mezbah
  rationale: דבר dalam konstruksi ini mencakup seluruh urusan atau perkara terkait mezbah tanpa membatasinya pada satu jenis upacara.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: dan dengan apa yang ada di sebelah dalam tabir
  rationale: Ungkapan ini menunjuk pada wilayah di sisi dalam tabir tempat kudus. Terjemahan mempertahankan acuan ruang tanpa menambahkan identifikasi yang tidak dinyatakan.
- source_word: וַעֲבַדְתֶּם
  choice: dan kamu harus melayani
  rationale: עבד dalam konteks ibadah berarti menjalankan pelayanan; “melayani” cukup luas dan alami tanpa memasukkan istilah gerejawi kemudian.
- source_word: עֲבֹדַת מַתָּנָה
  choice: suatu pelayanan karunia
  rationale: Frasa konstruksi Ibrani ini padat dan dapat menekankan pelayanan sebagai karunia atau jabatan keimaman yang dikaruniakan untuk pelayanan. Bentuk ini mempertahankan kedua nomina dan ambiguitas dasarnya, dengan penjelasan dalam catatan.
- source_word: אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: Aku memberikan tugas keimamanmu
  rationale: Imperfek dalam firman ilahi ini menyatakan tindakan Allah mengaruniakan jabatan tersebut; kala kini bahasa Indonesia sesuai dengan konteks langsung.
- source_word: הַזָּר
  choice: orang yang tidak berwenang
  rationale: Dalam hukum keimaman, זָר adalah orang di luar pihak yang diberi wewenang untuk tugas suci, bukan khusus orang asing secara etnis.
- source_word: הַקָּרֵב
  choice: yang mendekat
  rationale: קרב mempertahankan makna mendekati ruang atau pelayanan kudus yang dibatasi.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal bersifat pasif-kausatif dan menyatakan hukuman mati, bukan sekadar bahwa orang itu akan mati.
theological_decisions:
- issue: Arti זָר dalam hukum keimaman
  choice: orang yang tidak berwenang
  alternative: orang luar; orang asing
  rationale: Istilah ini membatasi pelaksanaan tugas keimaman kepada pihak yang ditetapkan. Terjemahan menghindari kesan bahwa larangan tersebut terutama didasarkan pada kebangsaan.
- issue: Hubungan sintaksis עֲבֹדַת מַתָּנָה dengan pemberian keimaman
  choice: pelayanan karunia
  alternative: pelayanan yang diberikan sebagai karunia; keimaman sebagai karunia untuk melayani
  rationale: Susunan Ibraninya dapat menonjolkan pelayanan sebagai pemberian ataupun keimaman yang diberikan untuk pelayanan. Teks utama mempertahankan kepadatan ungkapan, sedangkan catatan menyajikan kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal “engkau/bersamamu/tugas keimamanmu” mengikuti sapaan kepada Harun, lalu “kamu” mencakup Harun dan anak-anaknya. “Mezbah” dan “tabir” dipertahankan sebagai istilah ibadah yang umum dipahami.
