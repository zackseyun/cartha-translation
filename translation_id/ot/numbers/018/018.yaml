  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: id
  text: Namun, dagingnya akan menjadi bagianmu, sama seperti dada persembahan unjukan[a] dan paha kanan akan menjadi bagianmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Persembahan unjukan adalah bagian korban yang disajikan di hadapan TUHAN dengan gerakan ritual; istilah ini juga dapat diterjemahkan “persembahan penyajian”.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: Dagingnya
  rationale: בָּשָׂר secara harfiah dapat berarti 'daging' atau 'tubuh jasmani'; dalam konteks korban, yang dimaksud ialah daging korban yang dapat dimakan. Bentuk -ם merujuk secara kolektif kepada hewan-hewan yang disebut sebelumnya.
- source_word: יִהְיֶה לָּךְ
  choice: akan menjadi bagianmu
  rationale: Idiom היה + ל menyatakan kepemilikan atau jatah yang menjadi hak seseorang. 'Menjadi bagianmu' terdengar alami dalam konteks pembagian korban dan mempertahankan nuansa penetapan hak.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: sama seperti dada persembahan unjukan
  rationale: חָזֶה berarti bagian dada, sedangkan תְּנוּפָה menunjuk pada persembahan yang disajikan dengan gerakan ritual. 'Persembahan unjukan' mempertahankan istilah konkret yang lazim dipakai dalam bahasa Indonesia Alkitabiah, dengan penjelasan singkat dalam catatan kaki.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: dan paha kanan
  rationale: שׁוֹק menunjuk pada bagian kaki, khususnya paha atau tungkai korban. 'Paha kanan' merupakan ungkapan yang jelas dan sesuai dengan konteks pembagian bagian korban.
- source_word: לְךָ יִהְיֶה
  choice: akan menjadi bagianmu
  rationale: Rumus kepemilikan yang diulang dipertahankan untuk mencerminkan penekanan Ibrani bahwa bagian-bagian ini ditetapkan bagi orang yang disapa.
theological_decisions:
- issue: Perbedaan gender pada dua bentuk kata ganti orang kedua tunggal
  choice: Keduanya diterjemahkan dengan bentuk netral bahasa Indonesia, 'bagianmu', tanpa menentukan perbedaan referen.
  alternative: Menjelaskan secara eksplisit 'bagianmu, Harun' atau mengalihkannya menjadi bentuk jamak bagi para imam.
  rationale: Teks Ibrani memakai sufiks feminin pada לָּךְ dan maskulin pada לְךָ. Bahasa Indonesia tidak menandai gender pada '-mu', sehingga kejanggalan gramatikal sumber tidak perlu diselesaikan secara spekulatif. Konteks tetap menunjukkan hak imam yang disampaikan kepada Harun.
- issue: Hubungan perbandingan dengan bagian-bagian korban
  choice: Menerjemahkan כְּ sebagai 'sama seperti', sehingga daging itu disamakan statusnya dengan dada persembahan unjukan dan paha kanan yang sudah menjadi jatah imam.
  alternative: 'Menerjemahkan secara lebih harfiah dan kaku: ''seperti dada unjukan dan seperti paha kanan''.'
  rationale: Ungkapan 'sama seperti' menyampaikan fungsi perbandingan secara alami tanpa mengubah status hukum-kultis bagian-bagian tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Daging' dipilih daripada istilah yang lebih arkais. Pengulangan 'akan menjadi bagianmu' dipertahankan untuk mengikuti penekanan legal dalam teks Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah istilah yang dijelaskan.
