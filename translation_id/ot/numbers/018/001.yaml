base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Harun, “Engkau, anak-anakmu, dan kaum keluarga ayahmu yang bersamamu akan menanggung kesalahan yang berkaitan dengan tempat kudus[a]. Engkau dan anak-anakmu yang bersamamu akan menanggung kesalahan yang berkaitan dengan jabatan keimaman kalian[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “menanggung keadaan bersalah sehubungan dengan tempat kudus,” atau dapat dipahami sebagai menanggung tanggung jawab atas pelanggaran yang berkaitan dengan tempat kudus.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “menanggung keadaan bersalah sehubungan dengan jabatan keimaman kalian,” atau dapat dipahami sebagai menanggung tanggung jawab atas pelanggaran yang berkaitan dengan pelayanan keimaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Waw-konsekutif melanjutkan alur narasi; 'kemudian' menyampaikan urutan secara wajar, sedangkan 'berfirman' merupakan padanan bermartabat bagi perkataan Allah.
- source_word: בֵית אָבִיךָ
  choice: kaum keluarga ayahmu
  rationale: Ungkapan kekerabatan ini menunjuk kepada keluarga besar atau kaum dari garis ayah, bukan bangunan rumah.
- source_word: אִתָּךְ
  choice: yang bersamamu
  rationale: Mempertahankan keterangan penyertaan yang diulang dalam kedua klausa.
- source_word: תִּשְׂאוּ אֶת עֲוֺן
  choice: harus menanggung kesalahan yang berkaitan dengan
  rationale: Mempertahankan metafora 'menanggung' dan keluasan עָוֹן, sambil membuat hubungan dengan tempat kudus dan jabatan imam terbaca alami dalam bahasa Indonesia.
- source_word: הַמִּקְדָּשׁ
  choice: tempat kudus
  rationale: Padanan Indonesia yang lazim bagi kawasan atau tempat suci yang menjadi lingkup tanggung jawab Harun.
- source_word: כְּהֻנַּתְכֶם
  choice: jabatan imammu
  rationale: Menunjuk pada kedudukan dan pelayanan keimaman milik Harun dan anak-anaknya; bentuk tunggal posesif kolektif alami dalam konteks ini.
theological_decisions:
- issue: Makna idiom 'menanggung kesalahan' dalam konteks keimaman
  choice: Menjaga ungkapan 'menanggung kesalahan yang berkaitan dengan' tanpa menentukan hanya satu nuansa
  alternative: menanggung kesalahan / menanggung akibat kesalahan / bertanggung jawab atas pelanggaran
  rationale: Bahasa Ibrani dapat mencakup kesalahan, keadaan bersalah, akibat hukuman, dan tanggung jawab atas pelanggaran. Teks utama serta catatan kaki mempertahankan ketegangan makna tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel kedua klausa dipertahankan. 'Kaum keluarga ayahmu' memperjelas idiom kekerabatan, sedangkan 'menanggung kesalahan' menjaga metafora dan ambiguitas teologis sumber.
