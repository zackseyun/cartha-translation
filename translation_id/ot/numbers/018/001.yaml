  to: Kemudian Yahweh berfirman kepada Harun, “Engkau, anak-anakmu, dan kaum keluarga ayahmu yang bersamamu akan menanggung kesalahan yang berkaitan dengan tempat kudus[a]. Engkau dan anak-anakmu yang bersamamu akan menanggung kesalahan yang berkaitan dengan jabatan keimaman kalian[b].”
