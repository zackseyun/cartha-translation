  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: id
  text: Segala yang terbaik[a] dari minyak, dan segala yang terbaik dari anggur baru dan biji-bijian—hasil sulungnya, yang mereka berikan kepada Yahweh—telah Kuberikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lemak” dari minyak, anggur baru, dan biji-bijian; suatu ungkapan untuk bagian yang paling kaya atau terbaik.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: yang terbaik dari
  rationale: Secara harfiah berarti 'lemak', tetapi dalam konteks hasil bumi merupakan ungkapan bagi bagian yang paling kaya atau terbaik. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan maksud idiomatisnya.
- source_word: יִצְהָר
  choice: minyak
  rationale: Kata ini menunjuk pada minyak segar, biasanya minyak zaitun. 'Minyak' jelas dan tidak menambahkan jenis yang tidak dinyatakan secara eksplisit.
- source_word: תִּירוֹשׁ
  choice: anggur baru
  rationale: Kata ini lazimnya menunjuk pada hasil anggur yang baru, berbeda dari istilah Ibrani lain untuk anggur secara umum.
- source_word: דָגָן
  choice: gandum
  rationale: Kata ini mencakup biji-bijian atau hasil serealia. 'Gandum' merupakan padanan Alkitabiah yang mudah dipahami dalam bahasa Indonesia, meski cakupan kata sumber lebih luas.
- source_word: רֵאשִׁיתָם
  choice: hasil pertamanya
  rationale: Bentuk ini berarti bagian pertama dari hasil-hasil tersebut. 'Hasil pertamanya' mempertahankan hubungan pronominal dengan minyak, anggur baru, dan gandum tanpa mempersempitnya menjadi istilah teknis yang lebih khusus.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: yang mereka berikan kepada Yahweh
  rationale: Menerjemahkan נתן secara langsung sebagai 'berikan' dan mempertahankan nama ilahi יהוה sebagai 'Yahweh' sesuai lapisan konsultasi yang diberikan.
- source_word: לְךָ נְתַתִּים
  choice: telah Kuberikan kepadamu
  rationale: Bentuk perfek menyatakan pemberian sebagai ketetapan yang telah ditetapkan. Objeknya sudah jelas dari unsur-unsur yang disebut sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama pribadi ilahi dipertahankan secara transparan sebagai 'Yahweh', selaras dengan teks konsultasi POB dan tanpa mengimpor penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pengulangan 'segala yang terbaik' mengikuti penekanan teks Ibrani. Tanda pisah mempertahankan aposisi dan penekanan pada hasil pertama serta deklarasi pemberian.
