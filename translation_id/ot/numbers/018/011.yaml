  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: id
  text: 'Inilah yang menjadi bagianmu: persembahan khusus[a] dari pemberian mereka, yaitu semua persembahan unjukan orang Israel. Aku telah memberikan semuanya kepadamu serta kepada anak-anakmu, baik laki-laki maupun perempuan, yang bersamamu, sebagai ketetapan untuk selamanya. Setiap orang dalam rumah tanggamu yang tahir[b] boleh memakannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “persembahan angkatan”; istilah Ibrani ini menunjuk pada bagian yang dipisahkan untuk penggunaan kudus.
    reason: lexical_alternative
  - marker: b
    text: “Tahir” di sini berarti tahir secara ritual, bukan sekadar bersih secara jasmani atau baik secara moral.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: persembahan khusus dari pemberian mereka
  rationale: תְּרוּמָה menunjuk pada bagian yang dikhususkan bagi penggunaan kudus, sedangkan מַתָּנָה berarti ‘pemberian’. Ungkapan ini mempertahankan kedua unsur tanpa memakai istilah Indonesia yang terlalu teknis atau kuno.
- source_word: תְּנוּפֹת
  choice: persembahan unjukan
  rationale: Istilah ini menunjuk pada persembahan yang disajikan melalui tindakan ritual mengunjukkannya di hadapan TUHAN. ‘Persembahan unjukan’ merupakan padanan teknis yang ringkas dan dikenal dalam bahasa Indonesia Alkitabiah.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah ‘anak-anak Israel’ berfungsi sebagai sebutan kolektif bagi bangsa Israel; ‘orang Israel’ menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: נְתַתִּים
  choice: Aku telah memberikan semuanya
  rationale: Bentuk perfektif menyatakan pemberian yang telah ditetapkan dan tetap berlaku. ‘Semuanya’ mewakili akhiran objek jamak yang merujuk pada bagian-bagian persembahan sebelumnya.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: serta kepada anak-anakmu, baik laki-laki maupun perempuan, yang bersamamu
  rationale: Teks secara eksplisit menyebut anak laki-laki dan anak perempuan. Rumusan ini mempertahankan keduanya dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: לְחָק עוֹלָם
  choice: sebagai ketetapan untuk selamanya
  rationale: חֹק menyatakan ketetapan atau hak yang ditetapkan, dan עוֹלָם menekankan keberlangsungannya. Terjemahan ini mempertahankan daya hukum dan sifat berkelanjutannya.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Setiap orang dalam rumah tanggamu yang tahir
  rationale: Dalam konteks hukum keimaman, טָהוֹר berarti tahir secara ritual. ‘Rumah tangga’ menyampaikan lingkup keluarga Aaron dengan lebih tepat daripada sekadar bangunan rumah.
- source_word: יֹאכַל אֹתוֹ
  choice: boleh memakannya
  rationale: Bentuk ini menyatakan izin atau hak untuk makan. Akhiran objek tunggal memandang bagian persembahan tersebut secara kolektif; ‘memakannya’ mempertahankan bentuk itu secara alami.
theological_decisions:
- issue: Makna ketahiran
  choice: ‘Tahir’ dipakai dalam arti ritual menurut hukum keimaman.
  alternative: Bersih secara jasmani atau murni secara moral.
  rationale: Konteksnya mengatur kelayakan anggota rumah tangga imam untuk memakan bagian kudus, sehingga kategori yang dimaksud adalah ketahiran ritual.
- issue: Cakupan penerima dalam keluarga imam
  choice: Anak laki-laki dan anak perempuan disebut secara eksplisit.
  alternative: Diringkas menjadi ‘anak-anakmu’.
  rationale: Teks Ibrani dengan sengaja menyebut kedua kelompok; terjemahan mempertahankan rincian ini tanpa menambahkan syarat yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah teknis ‘persembahan unjukan’ dan ‘tahir’ dipertahankan karena penting dalam konteks hukum keimaman, dengan penjelasan catatan kaki untuk istilah yang berpotensi disalahpahami.
