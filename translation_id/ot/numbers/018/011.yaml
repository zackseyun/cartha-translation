  naturalness: Teksnya umumnya alami dan memakai register hukum-keagamaan yang wajar. "Anak-anakmu, baik laki-laki maupun perempuan" dengan jelas mempertahankan penyebutan kedua kelompok. "Tahir" dan "persembahan unjukan" tepat untuk konteks ini.
