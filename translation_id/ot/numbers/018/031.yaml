base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: id
  text: Kalian dan seisi rumah kalian boleh memakannya di mana saja, sebab itu adalah upah bagi kalian sebagai imbalan atas pelayanan kalian di Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: boleh memakannya
  rationale: Dalam konteks hukum ini, bentuk Ibrani menyatakan tindakan yang diizinkan atau diarahkan, bukan sekadar peristiwa lampau. “Boleh memakannya” paling jelas menyampaikan izin untuk mengonsumsi bagian tersebut.
- source_word: בְּכָל מָקוֹם
  choice: di mana saja
  rationale: Ungkapan ini menunjukkan bahwa makanan tersebut tidak dibatasi pada kawasan tempat kudus; pilihan ini alami dalam bahasa Indonesia dan mempertahankan cakupan maknanya.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: kamu dan seisi rumahmu
  rationale: בַּיִת dalam konteks domestik menunjuk kepada seluruh rumah tangga, bukan bangunan rumah saja. “Seisi rumahmu” mencakup unit keluarga atau orang-orang dalam rumah tangga.
- source_word: שָׂכָר
  choice: upah
  rationale: Kata ini menunjuk pada imbalan atas pekerjaan atau pelayanan. “Upah” jelas dan sesuai dengan konteks pelayanan orang Lewi.
- source_word: חֵלֶף
  choice: sebagai imbalan atas
  rationale: Di sini kata tersebut menyatakan balasan atau kompensasi yang berhubungan dengan pelayanan yang dilakukan, bukan sekadar penggantian.
- source_word: עֲבֹדַתְכֶם
  choice: pelayananmu
  rationale: Nomina ini merujuk pada tugas pelayanan khusus yang dijalankan orang Lewi; “pelayanan” mempertahankan nuansa resmi dan keagamaannya.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi kemah suci. Preposisi “di” sesuai dengan bahasa sumber dan mencakup pelayanan yang berkaitan dengan tempat tersebut.
theological_decisions:
- issue: Sifat bagian yang diterima orang Lewi
  choice: Bagian itu dapat dimakan di mana saja sebagai upah yang sah atas pelayanan orang Lewi di Kemah Pertemuan.
  alternative: Bagian itu dapat dipahami sebagai santapan kudus yang hanya boleh dimakan di kawasan peribadatan.
  rationale: Frasa eksplisit בְּכָל מָקוֹם, “di mana saja,” menunjukkan bahwa makanan ini tidak dikenai pembatasan tempat seperti persembahan kudus tertentu. Terjemahan mempertahankan perbedaan hukum-teologis tersebut tanpa menambahkan batasan yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti tunggal “kamu” mengikuti sapaan kolektif kepada orang Lewi sebagai kelompok, sedangkan sufiks jamak Ibrani tercermin secara kontekstual dalam “seisi rumahmu” dan pelayanan bersama mereka. Nama “Kemah Pertemuan” dipertahankan sebagai istilah Alkitab yang lazim.
