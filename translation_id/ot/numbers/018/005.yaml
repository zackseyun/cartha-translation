  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: id
  text: Kalian harus melaksanakan tugas menjaga tempat kudus dan tugas menjaga mazbah, supaya tidak ada lagi murka yang menimpa orang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Israel” atau “umat Israel.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak Israel.”
    reason: Menjelaskan bentuk idiomatis Ibrani בְּנֵי יִשְׂרָאֵל sambil memberikan padanan kolektif Indonesia yang alami.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: Kalian harus menjalankan tugas menjaga
  rationale: Gabungan שׁמר dan מִשְׁמֶרֶת merupakan ungkapan tentang pelaksanaan tugas penjagaan resmi. Terjemahan ini mempertahankan unsur kewajiban sekaligus menghasilkan bahasa Indonesia yang wajar.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Dalam konteks pelayanan imam dan penyebutannya bersama mazbah, istilah ini menunjuk pada kawasan atau tempat suci, bukan pada kekudusan sebagai gagasan abstrak.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah ini secara tepat menunjuk pada tempat persembahan korban dan sudah dikenal dalam ragam Alkitab bahasa Indonesia.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: supaya tidak ada lagi
  rationale: Dalam konteks ini, klausa tersebut menyatakan tujuan atau hasil dari penjagaan yang dilakukan dengan benar. 'Lagi' menerjemahkan עוֹד.
- source_word: קֶצֶף
  choice: murka
  rationale: Kata ini menyatakan kemarahan berat dalam konteks penghukuman; 'murka' mempertahankan bobotnya tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: '''Bani Israel'' merupakan ungkapan kolektif yang wajar dalam bahasa Indonesia dan masih mencerminkan bentuk harfiah Ibrani, yaitu ''anak-anak lelaki Israel''.'
theological_decisions:
- issue: Hubungan klausa terakhir dengan tugas penjagaan para imam
  choice: Dinyatakan sebagai tujuan atau hasil dengan 'supaya'.
  alternative: 'Diterjemahkan sebagai ramalan sederhana: ''dan tidak akan ada lagi murka''.'
  rationale: Konteks menetapkan tugas penjagaan untuk mencegah pelanggaran terhadap kekudusan dan penghukuman berikutnya. Namun, terjemahan tidak menjelaskan mekanismenya lebih jauh daripada yang dinyatakan teks.
- issue: Sumber murka
  choice: Pelaku ilahi tetap tersirat.
  alternative: Menambahkan 'murka Allah'.
  rationale: Konteks menunjukkan bahwa murka itu berasal dari Allah, tetapi klausa Ibrani tidak menyebutkan Allah secara eksplisit; karena itu, terjemahan mempertahankan ketidaktersuratannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' menandai sapaan jamak kepada Harun dan para imam tanpa membuat kalimat terlalu kaku. Pengulangan 'tugas menjaga' dipertahankan untuk mencerminkan pengulangan מִשְׁמֶרֶת pada kedua objek.
