  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: id
  text: Orang yang harus ditebus, sejak berumur satu bulan, harus kautebus menurut nilai yang kautetapkan, yaitu lima syikal perak menurut syikal tempat kudus; syikal itu dua puluh gera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “itu dua puluh gera.” Kata ganti “itu” merujuk pada syikal tempat kudus sebagai standar berat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: orang yang harus ditebus
  rationale: Bentuk partisip pasif dengan sufiks orang ketiga tunggal sulit dialihkan secara harfiah. Dalam konteks hukum tentang anak sulung, ungkapan ini menunjuk secara generik kepada setiap orang yang wajib ditebus.
- source_word: מִבֶּן חֹדֶשׁ
  choice: sejak berumur satu bulan
  rationale: Ungkapan usia ini menetapkan ambang yang mulai berlaku ketika seseorang berumur satu bulan.
- source_word: תִּפְדֶּה
  choice: harus kautebus
  rationale: Bentuk imperfek orang kedua tunggal berfungsi sebagai ketentuan hukum. Bentuk terikat “kau-” mempertahankan sapaan tunggal kepada imam.
- source_word: בְּעֶרְכְּךָ
  choice: menurut nilai yang kautetapkan
  rationale: ערך dalam konteks keimaman dan hukum berarti nilai taksiran atau penetapan nilai; terjemahan ini juga mempertahankan sufiks orang kedua tunggal.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: lima syikal perak
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan jumlah berat serta bahannya.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menunjuk pada standar berat resmi yang terkait dengan tempat kudus, bukan pada jenis logam yang berbeda.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: syikal itu dua puluh gera
  rationale: Kata ganti Ibrani secara gramatikal merujuk pada syikal sebagai standar berat. Menyebut “syikal” secara eksplisit menghasilkan bahasa Indonesia yang jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat dipertahankan. Istilah ukuran kuno “syikal” dan “gera” ditransliterasikan karena keduanya merupakan satuan berat khusus dalam teks. Pengulangan “tebus” mencerminkan akar kata Ibrani dan memperjelas hubungan antara orang yang wajib ditebus dan kewajiban penebusannya.
