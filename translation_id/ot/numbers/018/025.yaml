base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/025.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol menandai langkah berikut dalam narasi. Dalam konteks perkataan Allah, “berfirman” merupakan padanan bahasa Indonesia yang alami dan bermartabat untuk דִּבֵּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi אֶל menandai pihak yang dituju oleh firman dan secara alami diterjemahkan “kepada”.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama מֹשֶׁה dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: '[tidak dinyatakan secara terpisah]'
  rationale: Dalam formula Ibrani yang mengantar perkataan langsung, לֵאמֹר secara idiomatis sudah tercakup oleh tanda baca setelah “berfirman kepada Musa”; menerjemahkannya sebagai “demikian” atau “kata-Nya” akan menambah unsur yang tidak diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Lalu” mengalir alami sebagai penghubung naratif; “berfirman” sesuai dengan konteks ujaran ilahi. Koma akhir dipertahankan karena ayat ini mengantar firman langsung pada ayat berikutnya.
