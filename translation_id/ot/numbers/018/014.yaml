  text: Segala yang dikhususkan di Israel akan menjadi milikmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala yang berada di bawah larangan di Israel.” Istilah Ibrani חֵרֶם menunjuk pada sesuatu yang dikhususkan secara tidak dapat ditarik kembali bagi Allah dan, dalam konteks tertentu, dikhususkan untuk dimusnahkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Segala sesuatu
  rationale: Menyatakan keseluruhan kategori dan terdengar alami dalam bahasa Indonesia dengan nomina kolektif yang tersirat.
- source_word: חֵרֶם
  choice: yang dikhususkan sepenuhnya bagi Allah
  rationale: Istilah teknis ini menunjuk pada sesuatu yang diserahkan secara tidak dapat ditarik kembali kepada Allah dan tidak lagi boleh digunakan secara biasa. Pilihan ini mempertahankan arti luasnya tanpa memasukkan unsur pemusnahan ke dalam teks utama.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi ב menandai lingkup atau tempat; 'di Israel' merupakan padanan paling langsung dan alami.
- source_word: לְךָ
  choice: milikmu
  rationale: Menunjukkan kepemilikan atau penetapan bagi Harun secara langsung dan idiomatis.
- source_word: יִהְיֶה
  choice: akan menjadi
  rationale: Bentuk imperfek היה di sini menyatakan penetapan hukum yang berlaku ke depan.
theological_decisions:
- issue: Makna istilah kultis חֵרֶם
  choice: yang dikhususkan sepenuhnya bagi Allah
  alternative: segala sesuatu yang terkena larangan pemusnahan
  rationale: חֵרֶם dapat berarti sesuatu yang diserahkan secara mutlak kepada Allah dan, dalam konteks tertentu, sesuatu yang dikhususkan untuk dimusnahkan. Ayat ini sendiri tidak menegaskan pemusnahan, sehingga teks utama mempertahankan pengertian yang lebih luas dan catatan kaki menyimpan alternatif yang lebih keras.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-kultis yang tetap wajar dan mudah dipahami. Frasa eksplisit 'bagi Allah' menjelaskan sasaran pengkhususan yang terkandung dalam istilah teknis Ibrani, sementara catatan kaki mempertahankan rentang maknanya.
