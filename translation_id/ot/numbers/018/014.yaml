  naturalness: Kalimat draf alami, tetapi “yang dikhususkan sepenuhnya bagi Allah” agak panjang dan eksplikatif untuk ketentuan hukum yang singkat. “Segala yang dikhususkan di Israel” baku, lebih padat, dan tetap dapat dijelaskan dalam catatan kaki.
