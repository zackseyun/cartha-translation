revisions:
- from: Dan Aku sendiri—sesungguhnya, Aku telah mengambil saudara-saudaramu, orang-orang Lewi, dari antara umat Israel[a] sebagai pemberian bagimu. Mereka diserahkan kepada Yahweh untuk melaksanakan pelayanan di Kemah Pertemuan.
  to: Dan Aku sendiri—sesungguhnya—telah mengambil saudara-saudaramu, orang-orang Lewi, dari antara umat Israel[a], untuk menjadi pemberian kepadamu, diberikan kepada Yahweh untuk melaksanakan pelayanan di Kemah Pertemuan.
  rationale: 'Revisi mempertahankan seluruh unsur sumber dan urutannya secara lebih rapat: kaum Lewi adalah pemberian kepada pihak yang disapa dan orang-orang yang diberikan kepada Yahweh, dengan tujuan melaksanakan pelayanan Kemah Pertemuan. "Diberikan" mempertahankan gema leksikal antara מַתָּנָה (pemberian) dan נְתֻנִים (diberikan), sementara struktur satu kalimat menghindari kesan adanya tindakan terpisah yang tidak dinyatakan sumber.'
