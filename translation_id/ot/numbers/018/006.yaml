id: NUM.18.6
reference: Numbers 18:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: id
  text: Dan Aku sendiri—sesungguhnya—telah mengambil saudara-saudaramu, orang-orang Lewi, dari antara umat Israel[a], untuk menjadi pemberian kepadamu, diberikan kepada Yahweh untuk melaksanakan pelayanan di Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel.”
    reason: Menunjukkan bentuk ungkapan Ibrani בְּנֵי יִשְׂרָאֵל di balik padanan idiomatis “umat Israel”.
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Dan Aku sendiri—sesungguhnya
  rationale: Menjaga kesinambungan waw, penegasan pada pronomina orang pertama, dan daya tekan הִנֵּה dengan bahasa Indonesia yang khidmat namun tetap wajar.
- source_word: לָקַחְתִּי
  choice: Aku telah mengambil
  rationale: Mempertahankan arti dasar לקח dan aspek tindakan yang hasilnya masih berlaku; 'memilih' akan menambahkan tafsiran.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: saudara-saudaramu, orang-orang Lewi
  rationale: Mempertahankan bahasa kekerabatan serta menjelaskan bahwa saudara yang dimaksud ialah kaum Lewi.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dari antara umat Israel
  rationale: Mengungkapkan pemisahan dari komunitas Israel secara alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לָכֶם מַתָּנָה נְתֻנִים לַיהוָה
  choice: sebagai pemberian bagimu. Mereka diserahkan kepada Yahweh
  rationale: 'Mempertahankan dua arah relasi dalam teks: kaum Lewi merupakan pemberian bagi Harun dan anak-anaknya sekaligus diserahkan kepada Yahweh. Pemisahan menjadi dua kalimat memperjelas susunan yang padat tanpa menghapus pengulangan gagasan memberi.'
- source_word: לַעֲבֹד אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: untuk melaksanakan pelayanan di Kemah Pertemuan
  rationale: Mengungkapkan konstruksi verba-nomina serumpun secara alami dan mempertahankan konteks pelayanan kudus; 'Kemah Pertemuan' adalah padanan baku dan jelas untuk אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian yang terdapat langsung dalam teks dipertahankan sebagai nama diri, tanpa menggantinya dengan gelar.
- issue: Hubungan kaum Lewi dengan Harun dan Yahweh
  choice: pemberian bagi penerima manusia sekaligus diserahkan kepada Yahweh
  alternative: hanya ditugaskan kepada Harun atau hanya dipersembahkan kepada Yahweh
  rationale: Susunan Ibrani mempertahankan kedua relasi tersebut; terjemahan tidak meleburkan salah satunya.
- issue: Ungkapan maskulin בְּנֵי יִשְׂרָאֵל
  choice: umat Israel dengan catatan bentuk harfiah
  alternative: anak-anak Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk komunitas Israel, bukan anak-anak dalam arti usia. Catatan kaki mempertahankan bentuk dan metafora kekerabatan sumber.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. 'Sesungguhnya' mempertahankan tekanan deklaratif tanpa memakai bentuk arkais 'lihatlah'. Tanda pisah menandai penegasan pada 'Aku sendiri'. Istilah 'orang-orang Lewi', 'Yahweh', dan 'Kemah Pertemuan' dipakai secara konsisten.
