language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: id
  text: Mereka harus menjalankan tugasmu dan tugas menjaga seluruh Kemah[a]. Namun, mereka tidak boleh mendekati perlengkapan tempat kudus[b] ataupun mezbah, supaya mereka maupun kamu tidak mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Kemah Suci.
    reason: Menjelaskan rujukan kontekstual הָאֹהֶל tanpa mengganti arti dasar “Kemah” dalam teks.
  - marker: b
    text: 'Atau: “perkakas kudus” atau “benda-benda suci.”'
    reason: כְּלֵי הַקֹּדֶשׁ dapat dipahami sebagai perlengkapan tempat kudus atau sebagai perkakas/benda yang kudus.
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: Mereka harus menjalankan tugas yang dipercayakan kepadamu
  rationale: Konstruksi שׁמר dengan מִשְׁמֶרֶת menunjuk pada pelaksanaan atau penjagaan kewajiban yang dipercayakan. Ungkapan ini menyampaikan hubungan dengan tanggung jawab Harun tanpa memakai susunan yang kaku.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: dan tugas yang berkaitan dengan seluruh Kemah
  rationale: Pengulangan מִשְׁמֶרֶת dipertahankan melalui kata 'tugas', sedangkan כָּל dan הָאֹהֶל diterjemahkan langsung sebagai 'seluruh Kemah'. Huruf kapital menandai bahwa Kemah tertentu dalam konteks ibadah sedang dimaksudkan.
- source_word: אַךְ
  choice: Namun
  rationale: Kata ini menandai pembatasan tegas terhadap tugas yang baru disebutkan. 'Namun' alami dalam bahasa Indonesia dan mempertahankan daya pertentangannya.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: mendekati perlengkapan tempat kudus
  rationale: כְּלֵי dapat berarti berbagai perkakas, wadah, atau benda perlengkapan; 'perlengkapan' cukup luas untuk mempertahankan cakupan itu. הַקֹּדֶשׁ dipahami sebagai tempat atau lingkup kudus, tanpa menentukan benda tertentu.
- source_word: וְאֶל הַמִּזְבֵּחַ
  choice: ataupun mazbah
  rationale: Dalam larangan negatif, 'ataupun' secara alami menunjukkan bahwa kedua sasaran pendekatan sama-sama dilarang. 'Mazbah' merupakan istilah Indonesia yang ringkas dan lazim untuk mezbah korban.
- source_word: לֹא יִקְרָבוּ
  choice: mereka tidak boleh mendekati
  rationale: Bentuk ini menyampaikan larangan mendekati wilayah atau benda suci yang dibatasi, dengan tetap mempertahankan makna spasial קרב.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: agar mereka maupun kamu tidak mati
  rationale: Dalam konteks negatif, גַם...גַם mencakup kedua kelompok. 'Mereka maupun kamu' mempertahankan cakupan itu, sementara 'agar ... tidak mati' menyatakan akibat yang hendak dihindari tanpa menghilangkan daya peringatannya.
theological_decisions:
- issue: Pihak yang disapa dan pihak yang dibatasi
  choice: Akhiran orang kedua tunggal dipertahankan sebagai sapaan kepada Harun, sedangkan 'mereka' menunjuk kepada orang Lewi yang menjalankan tugas tetapi tidak boleh mendekati perlengkapan tempat kudus atau mazbah.
  alternative: Memahami sapaan itu secara lebih umum sebagai ditujukan kepada para imam.
  rationale: Bentuk מִשְׁמַרְתְּךָ adalah maskulin tunggal dan konteks langsung menyapa Harun. Terjemahan mempertahankan pembedaan tugas orang Lewi dan batas pelayanan imam tanpa menambahkan rincian doktrinal.
- issue: Cakupan ancaman kematian
  choice: Ancaman mencakup baik orang Lewi maupun Harun dan pihak imam yang diwakilinya.
  alternative: Ancaman kematian hanya berlaku bagi orang Lewi.
  rationale: Ungkapan גַם הֵם גַּם אַתֶּם secara eksplisit melibatkan kedua pihak; terjemahan 'mereka maupun kamu' mempertahankan cakupan bersama tersebut.
- issue: Hubungan larangan dengan akibat kematian
  choice: 'Klausa terakhir diterjemahkan sebagai akibat yang harus dihindari: ''agar ... tidak mati''.'
  alternative: 'Menerjemahkannya lebih harfiah sebagai dua klausa koordinatif: ''dan mereka tidak akan mati, baik mereka maupun kamu''.'
  rationale: Dalam konteks larangan, hubungan maksud atau akibat tersirat secara wajar, tetapi terjemahan tetap mempertahankan ketegangan bahwa pelanggaran batas kudus membahayakan kedua pihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat alami bagi pembaca umum, tetapi pengulangan gagasan 'tugas', pembatasan ruang suci, serta cakupan ancaman bagi kedua pihak tetap dipertahankan.
