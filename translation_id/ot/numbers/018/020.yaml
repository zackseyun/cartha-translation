  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: id
  text: Yahweh berfirman kepada Harun, “Di tanah mereka engkau tidak akan mendapat warisan, dan engkau tidak akan mempunyai bagian di antara mereka. Akulah bagianmu dan warisanmu di antara orang Israel.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel.”'
    reason: Menjelaskan bentuk harfiah idiom Ibrani בְּנֵי יִשְׂרָאֵל, yang dalam teks utama diterjemahkan secara idiomatis sebagai “orang Israel”.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti ‘Tuhan’.
- source_word: בְּאַרְצָם
  choice: di tanah mereka
  rationale: Kata אֶרֶץ dalam konteks ini menunjuk pada wilayah yang menjadi milik pusaka Israel; ‘tanah’ mempertahankan nuansa teritorial itu.
- source_word: תִנְחָל
  choice: engkau tidak akan mendapat warisan
  rationale: Bentuk verba נחל menyatakan menerima atau memperoleh milik pusaka. Ungkapan ini alami dalam bahasa Indonesia dan tetap terkait dengan ‘warisanmu’ pada klausa terakhir.
- source_word: חֵלֶק
  choice: bagian
  rationale: ‘Bagian’ dapat menunjuk pada jatah atau hak yang dialokasikan dan memungkinkan pengulangan istilah yang sama dalam pernyataan ‘Akulah bagianmu’.
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Mempertahankan gambaran keberadaan di antara komunitas Israel tanpa membatasinya pada letak fisik semata.
- source_word: אֲנִי חֶלְקְךָ
  choice: Akulah bagianmu
  rationale: Mempertahankan penekanan pada אֲנִי dan metafora bahwa Yahweh sendiri menjadi bagian yang diterima Harun.
- source_word: נַחֲלָתְךָ
  choice: warisanmu
  rationale: Menjaga makna legal-kovenantal נַחֲלָה serta kaitannya dengan verba נחל sebelumnya.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: di tengah-tengah orang Israel
  rationale: Dalam bahasa Indonesia, ‘orang Israel’ merupakan ungkapan kolektif yang alami bagi idiom Ibrani ‘anak-anak Israel’; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna pernyataan אֲנִי חֶלְקְךָ וְנַחֲלָתְךָ
  choice: Akulah bagianmu dan warisanmu
  alternative: Aku akan memberikan bagian dan warisan kepadamu
  rationale: 'Terjemahan mempertahankan identifikasi langsung dalam bahasa Ibrani: Yahweh sendiri adalah bagian dan warisan Harun, tanpa mengubahnya menjadi sekadar janji pemberian.'
- issue: Penerjemahan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Ungkapan Ibrani berfungsi sebagai sebutan kolektif bagi umat Israel. ‘Orang Israel’ menyampaikan fungsi itu secara wajar, sedangkan bentuk harfiahnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan tunggal ‘engkau’ mempertahankan bahwa perkataan ini ditujukan langsung kepada Harun. Pengulangan ‘bagian’ dan hubungan antara ‘mendapat warisan’ serta ‘warisanmu’ dipertahankan untuk menampilkan pola leksikal sumber.
