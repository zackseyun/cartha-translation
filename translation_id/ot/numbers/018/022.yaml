id: NUM.18.22
reference: Numbers 18:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: id
  text: Orang Israel tidak boleh lagi mendekati Kemah Pertemuan, supaya mereka tidak menanggung dosa lalu mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menanggung kesalahan dan mati.” Ungkapan Ibrani secara harfiah berarti “menanggung dosa,” yaitu menanggung kesalahan atau tanggung jawab atas pelanggaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: mendekati
  rationale: Kata קרב berarti datang dekat atau mendekati; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa mendekati ruang kudus.
- source_word: עוֹד
  choice: tidak ... lagi
  rationale: Bersama negasi לֹא, kata ini secara idiomatis berarti 'tidak lagi' atau 'jangan lagi'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan Ibrani harfiah 'anak-anak lelaki Israel' di sini menunjuk secara kolektif kepada umat Israel; 'Orang Israel' merupakan padanan Indonesia modern yang alami tanpa mempersempit rujukannya hanya kepada laki-laki.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan ini transparan terhadap unsur leksikal Ibrani dan merupakan istilah tempat kudus yang jelas serta bermartabat dalam bahasa Indonesia.
- source_word: לָשֵׂאת חֵטְא
  choice: menanggung dosa
  rationale: Terjemahan ini mempertahankan ungkapan konkret Ibrani 'memikul/menanggung dosa', yang dalam konteks hukum-imamat dapat berarti menanggung kesalahan atau tanggung jawab akibat dosa.
- source_word: לָמוּת
  choice: lalu mati
  rationale: Kata ini menyatakan akibat fatal yang mengikuti tindakan menanggung dosa; 'lalu mati' menjaga urutan gagasan Ibrani secara alami.
theological_decisions:
- issue: Apakah larangan ini perlu dijelaskan secara eksplisit sebagai larangan mendekati ruang kudus tanpa wewenang
  choice: Mempertahankan rumusan ringkas bahwa orang Israel tidak boleh lagi mendekati Kemah Pertemuan supaya tidak menanggung dosa lalu mati
  alternative: Orang Israel tidak boleh lagi mendekati Kemah Pertemuan tanpa wewenang, supaya mereka tidak bersalah dan mati
  rationale: Konteks langsung menunjukkan pembagian tanggung jawab bagi orang Lewi dan imam, tetapi ayat ini sendiri tidak memuat kata 'tanpa wewenang'. Terjemahan tidak menambahkannya dan mempertahankan ketegangan hukum-teologis dalam ungkapan 'menanggung dosa'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tidak boleh lagi' menyampaikan larangan secara alami; 'Kemah Pertemuan' dipertahankan sebagai istilah tempat kudus. Penanda catatan kaki ditempatkan setelah seluruh klausa yang dijelaskannya.
