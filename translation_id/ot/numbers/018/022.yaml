  source_fidelity: 'Teks Indonesia secara setia menerjemahkan unsur-unsur utama Ibrani: negasi dengan עוֹד sebagai “tidak boleh lagi,” בני ישראל secara kolektif sebagai “Orang Israel,” אהל מועד sebagai “Kemah Pertemuan,” serta לשאת חטא למות sebagai peringatan agar mereka tidak menanggung dosa dan mati. Bentuk larangan “tidak boleh lagi” menyampaikan daya normatif dari konteks dan tidak menambahkan syarat “tanpa wewenang” yang tidak dinyatakan dalam ayat.'
