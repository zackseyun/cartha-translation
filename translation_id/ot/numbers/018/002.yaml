  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: id
  text: Bawalah juga saudara-saudaramu, yakni suku Lewi, suku ayahmu, mendekat kepadamu, supaya mereka bergabung denganmu[a] dan melayanimu, sementara engkau dan anak-anakmu yang bersamamu berada di hadapan Kemah Kesaksian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyertaimu” atau “melekat kepadamu”; kata kerja Ibrani ini juga menggemakan nama Lewi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Kemah Kesaksian”. Banyak terjemahan memakai “Kemah Pertemuan” karena ungkapan itu lebih umum dalam bagian-bagian lain tentang Kemah Suci, tetapi teks Ibrani di sini memakai kata “kesaksian”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Bawalah juga
  rationale: Kata “juga” mempertahankan daya tambah dari gabungan konjungsi dan adverbia pada awal perintah.
- source_word: אַחֶיךָ
  choice: saudara-saudaramu
  rationale: Mempertahankan bahasa kekerabatan Ibrani; dalam konteks, yang dimaksud ialah sesama anggota suku Lewi.
- source_word: מַטֵּה לֵוִי
  choice: suku Lewi
  rationale: מַטֶּה di sini merupakan sebutan bagi suku, bukan tongkat secara harfiah.
- source_word: שֵׁבֶט אָבִיךָ
  choice: suku ayahmu
  rationale: Mempertahankan ungkapan apposisional Ibrani yang mengidentifikasi Lewi sebagai suku leluhur Harun tanpa memperluasnya menjadi tafsiran.
- source_word: הַקְרֵב אִתָּךְ
  choice: bawalah ... mendekat bersamamu
  rationale: Bentuk kausatif dari קרב menyatakan membawa mendekat, dengan nuansa penghadapan untuk pelayanan; אִתָּךְ menyatakan kebersamaan dengan Harun.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: supaya mereka bergabung denganmu
  rationale: Bentuk Niphal dari לוה berarti bergabung atau melekat pada seseorang dan juga menggemakan nama Lewi.
- source_word: וִישָׁרְתוּךָ
  choice: dan melayanimu
  rationale: שרת menyatakan pelayanan atau tugas melayani; “melayanimu” jelas, alami, dan tetap menunjukkan bahwa pelayanan orang Lewi diarahkan untuk membantu Harun.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: sementara engkau dan anak-anakmu yang bersamamu
  rationale: “Sementara” menyatakan hubungan antara pelayanan orang Lewi dan kedudukan Harun beserta anak-anaknya, tanpa mengubah perbedaan peran yang ada dalam ayat.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: berada di hadapan Kemah Kesaksian
  rationale: Mengikuti bunyi teks Ibrani, yang secara khusus memakai עֵדוּת, “kesaksian,” bukan מוֹעֵד, “pertemuan.”
theological_decisions:
- issue: Penerjemahan אֹהֶל הָעֵדֻת
  choice: Kemah Kesaksian
  alternative: Kemah Pertemuan
  rationale: Teks Masoret ayat ini secara eksplisit berbunyi “kemah kesaksian.” Terjemahan tidak menyelaraskannya dengan ungkapan “Kemah Pertemuan” yang lebih umum, sehingga nuansa kesaksian perjanjian tetap terpelihara.
- issue: Hubungan peran orang Lewi dengan Harun dan anak-anaknya
  choice: orang Lewi bergabung dengan Harun dan melayaninya, sementara Harun dan anak-anaknya berada di hadapan Kemah Kesaksian
  alternative: menyamakan seluruh pelayanan orang Lewi dengan pelayanan imam
  rationale: Susunan ayat mempertahankan perbedaan antara tugas membantu dari suku Lewi dan kedudukan Harun beserta anak-anaknya, tanpa menambahkan uraian doktrinal yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “engkau” dipakai untuk sapaan tunggal kepada Harun. “Di hadapan” mempertahankan nuansa ruang dan pelayanan dari לִפְנֵי, sedangkan kapitalisasi “Kemah Kesaksian” menandai nama tempat kudus. Penanda catatan ditempatkan langsung pada frasa yang dijelaskannya.
