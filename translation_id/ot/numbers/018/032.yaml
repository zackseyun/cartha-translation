source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: id
  text: Kamu tidak akan menanggung dosa karenanya ketika kamu mempersembahkan bagian terbaik dari persepuluhan itu.[a] Janganlah kamu mencemarkan hal-hal kudus umat Israel,[b] dan kamu tidak akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lemaknya”. Dalam konteks persembahan, kata Ibrani ini sering berarti bagian yang paling kaya atau terbaik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hal-hal kudus bani Israel”. Dalam konteks ini, ungkapan itu mencakup hal-hal yang telah dikhususkan sebagai kudus, termasuk persembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: menanggung dosa
  rationale: Ungkapan נשׂא חטא menyatakan memikul dosa atau kesalahan beserta tanggungannya. Pilihan ini mempertahankan citra Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: עָלָיו
  choice: karena persembahan itu
  rationale: Pronomina ini menunjuk kembali pada persembahan persepuluhan dalam konteks sebelumnya dan menyatakan perkara yang dapat menimbulkan tanggungan dosa. Penyebutan 'persembahan itu' memperjelas rujukannya.
- source_word: בַּהֲרִימְכֶם
  choice: apabila kamu mengkhususkan
  rationale: Bentuk Hifil dari רום dalam konteks ibadah berarti mengangkat atau menyisihkan sesuatu sebagai persembahan. 'Mengkhususkan' menyampaikan tindakan memisahkan bagian itu bagi TUHAN tanpa memakai ungkapan harfiah yang kaku.
- source_word: חֶלְבּוֹ
  choice: bagian terbaik
  rationale: חלב secara harfiah berarti 'lemak', tetapi dalam konteks hasil bumi dan persembahan menunjuk secara idiomatis pada bagian yang paling kaya atau terbaik.
- source_word: מִמֶּנּוּ
  choice: darinya
  rationale: Kata ini menunjuk pada persembahan persepuluhan yang darinya bagian terbaik dipisahkan.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: persembahan-persembahan kudus umat Israel
  rationale: Dalam konteks ini קָדְשֵׁי menunjuk pada benda-benda yang dikuduskan, khususnya persembahan. 'Umat Israel' merupakan padanan kolektif yang alami bagi ungkapan etnis בְּנֵי יִשְׂרָאֵל.
- source_word: תְחַלְּלוּ
  choice: menajiskan
  rationale: Bentuk Piel dari חלל berarti memperlakukan sesuatu yang kudus sebagai tidak kudus atau biasa. 'Menajiskan' mempertahankan pertentangan antara kudus dan cemar dalam konteks ini.
- source_word: וְלֹא תָמֻתוּ
  choice: dan kamu tidak akan mati
  rationale: Terjemahan ini mempertahankan koordinasi langsung dalam bahasa Ibrani dan tidak memaksakan apakah klausa tersebut terutama menyatakan akibat, tujuan, atau jaminan yang terkait dengan ketaatan.
theological_decisions:
- issue: Makna חֶלֶב dalam konteks persembahan hasil bumi
  choice: bagian terbaik
  alternative: lemaknya; bagian pilihannya
  rationale: Ayat ini membahas bagian dari persepuluhan, bukan secara khusus lemak hewan. 'Bagian terbaik' menyampaikan tuntutan untuk mempersembahkan mutu tertinggi tanpa menimbulkan kesan bahwa yang dimaksud adalah lemak hewan.
- issue: Cakupan קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: persembahan-persembahan kudus umat Israel
  alternative: hal-hal kudus milik keturunan Israel
  rationale: Konteks langsung berbicara tentang persepuluhan dan bagian yang dipersembahkan. Padanan utama dibuat alami dan kontekstual, sedangkan catatan kaki mempertahankan keluasan ungkapan harfiahnya.
- issue: Hubungan klausa וְלֹא תָמֻתוּ dengan larangan sebelumnya
  choice: dan kamu tidak akan mati
  alternative: supaya kamu tidak mati; agar kamu tidak mati
  rationale: Konjungsi Ibrani hanya mengoordinasikan klausa. Terjemahan langsung mempertahankan kemungkinan nuansa akibat, tujuan, atau jaminan tanpa menetapkan salah satunya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak 'kamu' mengikuti sapaan kepada orang-orang Lewi dalam konteks. 'Mengkhususkan' dipilih daripada 'mengangkat' agar tindakan mempersembahkan dapat dipahami secara alami, sementara catatan kaki mempertahankan nuansa leksikal yang penting.
