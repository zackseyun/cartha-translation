source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Harun, “Lihatlah, Aku sendiri telah memberikan kepadamu tanggung jawab untuk mengurus persembahan-persembahan-Ku[a], yaitu segala pemberian kudus dari bani Israel[c]. Aku telah memberikannya kepadamu sebagai bagianmu berdasarkan pengurapan[b], dan kepada putra-putramu sebagai ketetapan untuk selamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan-persembahan-Ku”; secara lebih teknis, “persembahan-persembahan unjukan-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk pengurapan.” Kemungkinan besar, ungkapan Ibrani ini menunjuk pada bagian yang menjadi hak Harun berdasarkan jabatannya sebagai imam yang diurapi.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bani/anak-anak Israel”; “bani Israel” adalah sebutan perjanjian yang lazim bagi umat Israel.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam pengantar perkataan ilahi, “berfirman” merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: וַאֲנִי הִנֵּה
  choice: Lihatlah, Aku sendiri
  rationale: “Lihatlah” mempertahankan daya penarik perhatian הִנֵּה, sedangkan “Aku sendiri” menyampaikan penekanan pronomina וַאֲנִי secara alami.
- source_word: נָתַתִּי לְךָ
  choice: telah menyerahkan kepadamu
  rationale: Menyampaikan tindakan pemberian yang menghasilkan tanggung jawab berkelanjutan; “menyerahkan” sesuai dengan konteks amanat keimaman.
- source_word: מִשְׁמֶרֶת
  choice: tanggung jawab
  rationale: Menunjukkan amanat untuk menjaga dan mengurus sesuatu yang dipercayakan, dengan bahasa Indonesia modern.
- source_word: תְּרוּמֹתַי
  choice: persembahan-persembahan khusus bagi-Ku
  rationale: תְּרוּמָה adalah sumbangan atau persembahan yang dikhususkan bagi Yahweh; pilihan ini jelas tanpa memakai istilah ritual yang terlalu teknis.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: segala pemberian kudus dari bani Israel
  rationale: “Pemberian kudus” menyampaikan benda-benda yang dikhususkan dalam konteks bagian imam, sedangkan “bani Israel” mempertahankan sebutan perjanjian yang lazim.
- source_word: נְתַתִּים
  choice: Aku telah memberikannya
  rationale: Mempertahankan pengulangan verba נתן dan akibat pemberian yang tetap berlaku.
- source_word: לְמָשְׁחָה
  choice: sebagai bagianmu berdasarkan pengurapan
  rationale: Menghubungkan bagian Harun dengan pengurapannya untuk jabatan imam tanpa menyatakan bahwa ayat ini memerintahkan tindakan pengurapan baru.
- source_word: וּלְבָנֶיךָ
  choice: dan kepada anak-anakmu
  rationale: Terjemahan langsung yang mempertahankan perluasan hak keimaman kepada putra-putra Harun dalam konteks ini.
- source_word: לְחָק עוֹלָם
  choice: sebagai ketetapan untuk selamanya
  rationale: Mempertahankan sifat hukum yang tetap dan berkelanjutan dari ketentuan tersebut.
theological_decisions:
- issue: Makna hak keimaman dalam לְמָשְׁחָה
  choice: sebagai bagianmu berdasarkan pengurapan
  alternative: untuk pengurapan; sebagai bagian yang berkenaan dengan pengurapan
  rationale: Konteks mendukung bagian yang menjadi hak Harun berdasarkan kedudukannya sebagai imam yang diurapi, tetapi catatan kaki tetap mempertahankan kemungkinan bentuk yang lebih harfiah.
- issue: Penyebutan בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak Israel; orang Israel
  rationale: “Bani Israel” merupakan sebutan kolektif perjanjian yang mapan dalam bahasa Indonesia dan dekat dengan bentuk Ibrani tanpa mengubahnya menjadi istilah etnis yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman,” “bani Israel,” dan “ketetapan untuk selamanya” mempertahankan corak teks hukum-keimaman, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini.
