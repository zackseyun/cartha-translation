id: NUM.18.9
reference: Numbers 18:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: id
  text: 'Inilah yang menjadi bagianmu dari persembahan-persembahan maha kudus, yaitu yang disisihkan dari api[a]: setiap kurban mereka, setiap persembahan sajian mereka, setiap persembahan penghapus dosa[b] mereka, dan setiap persembahan penebus kesalahan[c] mereka, yang mereka kembalikan kepada-Ku. Semuanya itu maha kudus bagimu dan bagi anak-anak lelakimu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari api”. Frasa ini dapat menunjuk pada bagian persembahan yang disisihkan bagi para imam dari persembahan yang dipersembahkan dengan api.'
    reason: lexical_alternative
  - marker: b
    text: “Persembahan penghapus dosa” juga dapat diterjemahkan “persembahan pemurnian”.
    reason: lexical_alternative
  - marker: c
    text: “Persembahan penebus kesalahan” juga dapat diterjemahkan “persembahan ganti rugi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: dari persembahan-persembahan maha kudus
  rationale: Ungkapan superlatif ini menunjuk pada golongan persembahan yang tingkat kekudusannya paling tinggi, bukan pada ruang Mahakudus. Kata 'persembahan-persembahan' ditambahkan secara kontekstual agar rujukannya jelas.
- source_word: מִן הָאֵשׁ
  choice: yang disisihkan dari api
  rationale: Secara harfiah berarti 'dari api'. Dalam konteks pembagian kurban kepada imam, ungkapan ini menunjuk pada bagian yang tidak dibakar dan diperuntukkan bagi imam; kata 'disisihkan' mengungkapkan elipsis Ibrani tanpa menghilangkan citra api.
- source_word: קָרְבָּנָם
  choice: setiap kurban mereka
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa mendekat sebagai persembahan kepada Allah. 'Kurban' merupakan padanan Indonesia yang ringkas dan lazim dalam konteks ritual.
- source_word: מִנְחָתָם
  choice: setiap persembahan sajian mereka
  rationale: Dalam hukum imamat, מִנְחָה lazimnya menunjuk pada persembahan berbahan hasil bumi atau tepung. 'Persembahan sajian' adalah istilah Alkitabiah Indonesia yang cukup dikenal dan tidak membatasi bahannya hanya pada biji-bijian utuh.
- source_word: חַטָּאתָם
  choice: setiap persembahan penghapus dosa mereka
  rationale: Dalam daftar kurban ini חַטָּאת menunjuk pada jenis persembahan, bukan hanya pada dosa itu sendiri. Padanan ini mempertahankan hubungan dengan dosa, sedangkan nuansa pemurnian ritual dicatat dalam catatan kaki.
- source_word: אֲשָׁמָם
  choice: setiap persembahan penebus kesalahan mereka
  rationale: אָשָׁם menunjuk pada persembahan yang berkaitan dengan kesalahan dan sering juga dengan ganti rugi. 'Penebus kesalahan' mempertahankan kategori tradisional tanpa menutup nuansa pemulihan yang dicatat sebagai alternatif.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: yang mereka kembalikan kepada-Ku
  rationale: Bentuk Hifil dari שׁוב mempertahankan gagasan mengembalikan atau memulihkan. Terjemahan ini sengaja menjaga metafora tersebut dan tidak mempersempitnya menjadi pembayaran saja.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: maha kudus
  rationale: Dalam posisi predikatif, ungkapan ini menyatakan taraf kekudusan tertinggi dari bagian kurban tersebut. 'Maha kudus' alami, ringkas, dan tidak mengesankan nama sebuah ruang kudus.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: bagimu dan bagi anak-anak lelakimu
  rationale: Yang disapa ialah Harun, dan בָּנִים secara eksplisit menunjuk pada anak-anak lelaki yang turut memegang jabatan imam. Terjemahan tidak menetralkan penanda gender yang relevan secara ritual.
theological_decisions:
- issue: Istilah kekudusan imamat dapat disalahpahami sebagai rujukan pada ruang Mahakudus.
  choice: persembahan-persembahan maha kudus / maha kudus
  alternative: tempat Mahakudus / yang kudus dari segala yang kudus
  rationale: Konteksnya adalah penggolongan bagian-bagian kurban, bukan lokasi dalam Kemah Suci. Terjemahan mempertahankan tingkat kekudusan tertinggi tanpa mengubahnya menjadi rujukan spasial.
- issue: Cakupan gender keturunan Harun
  choice: anak-anak lelakimu
  alternative: anak-anakmu / keturunanmu
  rationale: Teks Ibrani secara khusus menyebut anak-anak lelaki Harun dalam konteks hak imam. Bentuk yang eksplisit menghindari perluasan yang tidak dinyatakan dalam ayat.
- issue: Makna ritual חַטָּאת dan אָשָׁם
  choice: persembahan penghapus dosa dan persembahan penebus kesalahan
  alternative: persembahan pemurnian dan persembahan ganti rugi
  rationale: Padanan utama mempertahankan kaitan leksikal dengan dosa dan kesalahan yang mudah dipahami pembaca, sedangkan catatan kaki menjaga nuansa pemurnian ritual dan pemulihan/ganti rugi tanpa menetapkan satu teori pendamaian tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar Ibrani dipertahankan, tetapi elipsis pada frasa 'dari api' dijelaskan secara singkat dalam teks dan diberi bentuk harfiah dalam catatan kaki. Bentuk 'anak-anak lelakimu' dipilih demi ketepatan gender dalam konteks keimaman.
