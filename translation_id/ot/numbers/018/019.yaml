source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: id
  text: Segala persembahan khusus dari hal-hal kudus yang dipersembahkan orang Israel kepada TUHAN[a] telah Kuberikan kepadamu, juga kepada anak-anakmu laki-laki dan perempuan yang bersamamu, sebagai ketetapan untuk selamanya. Itulah perjanjian garam untuk selamanya[b] di hadapan TUHAN, bagimu dan bagi keturunanmu yang bersamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang diangkat orang Israel kepada TUHAN”; tindakan mengangkat di sini merupakan cara menyerahkan persembahan.'
    reason: Menunjukkan bentuk konkret ungkapan Ibrani sekaligus menjelaskan makna ritualnya.
  - marker: b
    text: “Perjanjian garam” adalah ungkapan yang menekankan sifat perjanjian yang tetap dan mengikat; teks mempertahankan garam sebagai lambang tanpa menjelaskan seluruh latar kebiasaannya.
    reason: Metafora ini mungkin tidak langsung dipahami pembaca modern, tetapi tidak sebaiknya diganti dengan satu penafsiran saja.
lexical_decisions:
- source_word: תְּרוּמֹת
  choice: persembahan khusus
  rationale: Istilah ini menunjuk pada bagian yang dikhususkan dan diserahkan sebagai persembahan; pilihan ini lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah yang menonjolkan gerakan mengangkat.
- source_word: הַקֳּדָשִׁים
  choice: benda-benda kudus
  rationale: Bentuk jamak substantival mengacu pada berbagai hal yang telah dikhususkan bagi Allah; 'benda-benda kudus' mempertahankan keluasan rujukannya.
- source_word: יָרִימוּ
  choice: dipersembahkan
  rationale: Secara harfiah berarti 'diangkat', tetapi dalam konteks ritual merupakan idiom untuk menyerahkan sesuatu sebagai persembahan. Makna harfiahnya dicatat dalam catatan kaki.
- source_word: חָק עוֹלָם
  choice: ketetapan untuk selamanya
  rationale: Menyampaikan ketentuan yang tetap dan berkelanjutan tanpa menambahkan batas waktu yang tidak terdapat dalam teks.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: Padanan kolektif yang alami bagi kata Ibrani 'benih', yang di sini berarti garis keturunan.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: Mengikuti konvensi terjemahan Alkitab bahasa Indonesia yang luas dikenal, dengan huruf kapital untuk menandai nama perjanjian ilahi tanpa menentukan pelafalannya.
- issue: Metafora בְּרִית מֶלַח
  choice: perjanjian garam
  alternative: perjanjian yang kekal dan tidak dapat dibatalkan
  rationale: Metafora sumber dipertahankan agar citra dan kemungkinan nuansa budayanya tidak dipersempit menjadi satu tafsiran.
- issue: Daya berlaku עוֹלָם
  choice: untuk selamanya
  alternative: turun-temurun
  rationale: Terjemahan ini mempertahankan pernyataan durasi yang kuat dalam teks; cakupan teologisnya tidak dibatasi atau dijelaskan lebih lanjut dalam tubuh ayat.
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan mudah dipahami. Bentuk 'Kuberikan' mempertahankan tuturan langsung Allah. Pengulangan 'yang bersamamu' dipertahankan karena muncul dua kali dalam teks Ibrani dan menghubungkan hak pemberian itu dengan keluarga serta keturunan Harun.
