  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: id
  text: Engkau harus memakannya di tempat yang mahakudus[a]; setiap laki-laki boleh memakannya. Itu haruslah kudus bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “di dalam yang mahakudus” (secara harfiah, “kudus dari segala yang kudus”). Dalam konteks ini, ungkapan tersebut menunjuk pada tempat atau kawasan yang ditetapkan untuk memakan bagian yang mahakudus, bukan harus pada ruang terdalam Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: di tempat yang mahakudus
  rationale: Ungkapan superlatif Ibrani ini secara harfiah berbunyi 'di kekudusan segala kekudusan'. Dalam konteks ketetapan mengenai bagian imam, frasa tersebut menunjukkan tempat atau kawasan yang berstatus sangat kudus untuk memakan persembahan, tanpa harus dipahami sebagai ruang terdalam Kemah Suci.
- source_word: תֹּאכֲלֶנּוּ
  choice: Engkau harus memakannya
  rationale: Bentuk orang kedua maskulin tunggal dengan akhiran objek orang ketiga maskulin tunggal ditujukan kepada Harun sebagai wakil keimaman. 'Harus' menyampaikan daya preskriptif dalam ragam hukum.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: Frasa ini menyatakan pembatasan berdasarkan jenis kelamin dalam lingkup imam yang dimaksud konteks. 'Setiap laki-laki' merefleksikan זָכָר secara tepat.
- source_word: יֹאכַל אֹתוֹ
  choice: boleh memakannya
  rationale: Dalam konteks ini bentuk imperfek menyatakan kelayakan atau izin bagi setiap laki-laki yang termasuk dalam kelompok terkait, bukan kewajiban bahwa masing-masing harus makan.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: Itu haruslah kudus bagimu
  rationale: Terjemahan ini mempertahankan istilah kultis קֹדֶשׁ dan menyatakan status kudus persembahan dalam hubungannya dengan Harun.
theological_decisions:
- issue: Rujukan dan cakupan perintah keimaman
  choice: Kata ganti tunggal 'engkau' mempertahankan sapaan kepada Harun sebagai wakil keimaman, sedangkan izin makan meluas kepada setiap laki-laki yang memenuhi syarat dalam lingkup imam menurut konteks.
  alternative: Sapaan tunggal dipahami hanya berlaku secara pribadi bagi Harun.
  rationale: Konteks langsung membahas bagian kudus yang diberikan kepada Harun dan anak-anaknya. Bentuk tunggal dipertahankan tanpa membatasi penerapannya hanya kepada Harun, sebab klausa berikutnya secara eksplisit memperluas kelayakan makan.
- issue: Arti tempat yang mahakudus
  choice: Frasa tersebut dipahami secara lokatif sebagai tempat atau kawasan berstatus mahakudus yang ditetapkan untuk memakan bagian imam.
  alternative: Frasa tersebut menunjuk secara khusus pada ruang Mahakudus di dalam tempat suci.
  rationale: Preposisi בְּ mendukung arti lokatif, tetapi konteks konsumsi imam tidak mengharuskan—dan secara praktis tidak mendukung—rujukan eksklusif kepada ruang terdalam tempat suci.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan ragam ketetapan hukum. 'Engkau' mempertahankan sapaan tunggal kepada Harun; 'mahakudus' menjaga hubungan leksikal dengan istilah kekudusan sekaligus menyampaikan superlatif Ibrani.
