  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: id
  text: 'Dari semua pemberian kalian, kalian harus mengangkat sebagai persembahan seluruh persembahan bagi Yahweh: dari semua bagian terbaiknya[a], bagian kudusnya[b] dari padanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari semua lemaknya”; “lemak” di sini dapat berarti bagian yang paling baik atau paling berharga.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagian yang dikhususkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: Dari semua pemberian yang menjadi bagian kalian
  rationale: מִכֹּל menunjukkan sumber atau pemisahan, sedangkan sufiks orang kedua jamak pada מַתְּנֹתֵיכֶם menyatakan bahwa pemberian-pemberian itu menjadi milik atau bagian kaum Lewi. Ungkapan ini menghindari kesan keliru bahwa merekalah yang memberikan semuanya.
- source_word: תָּרִימוּ
  choice: kalian harus mengangkat sebagai persembahan
  rationale: Bentuk Hifil dari רוּם secara harfiah berarti 'mengangkat' dan dalam bahasa peribadatan menunjuk pada tindakan memisahkan serta mempersembahkan bagian tertentu. Gabungan ini mempertahankan citra Ibrani sekaligus menjelaskan maknanya dalam bahasa Indonesia.
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: setiap persembahan khusus bagi Yahweh
  rationale: תְּרוּמָה adalah istilah bagi sumbangan atau bagian yang diangkat dan dikhususkan. 'Persembahan khusus' menyampaikan fungsi kultisnya, sedangkan 'bagi Yahweh' secara alami menyatakan peruntukannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap terlihat.
- source_word: מִכָּל חֶלְבּוֹ
  choice: dari segala yang terbaik di dalamnya
  rationale: חֵלֶב secara harfiah berarti 'lemak', tetapi secara idiomatis dapat berarti bagian terbaik atau terpilih. Karena acuannya mencakup berbagai pemberian, 'yang terbaik' menyampaikan maksud konteks tanpa membatasinya pada lemak hewan.
- source_word: מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: bagian kudus yang diambil darinya
  rationale: מִקְדָּשׁ dengan sufiks di sini menunjuk pada bagian milik pemberian itu yang dikuduskan, dan מִמֶּנּוּ menegaskan bahwa bagian tersebut diambil darinya. Terjemahan ini mempertahankan kedua unsur itu secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan antara bagian terbaik dan bagian kudus
  choice: Bagian kudus diambil dari segala yang terbaik dalam pemberian
  alternative: Bagian terbaik dan bagian kudus dipahami sebagai dua bagian terpisah
  rationale: Susunan Ibrani paling wajar memperlakukan 'bagian kudus' sebagai penjelasan tentang apa yang harus diambil dari bagian terbaik, tetapi terjemahan tetap mempertahankan pengulangan 'darinya' dan tidak merinci lebih jauh identitas bagian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai dengan bentuk orang kedua jamak dalam bahasa Ibrani. Ungkapan 'mengangkat sebagai persembahan' sengaja mempertahankan metafora ritual sumber sambil tetap mudah dipahami. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar alami dan jelas dalam bahasa Indonesia.
