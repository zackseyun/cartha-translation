revisions:
- from: Dari semua pemberian yang menjadi bagian kalian, kalian harus mengangkat sebagai persembahan setiap persembahan khusus bagi Yahweh. Dari segala yang terbaik[a] di dalamnya, angkatlah bagian kudus yang diambil darinya.[b]
