  rationale: Revisi menghapus penambahan interpretatif, memulihkan cakupan “seluruh” dan bentuk orang kedua jamak, serta menempatkan jangkar catatan pada unsur yang dijelaskannya. Pengulangan “dari padanya” dipertahankan karena ada dalam teks Ibrani, meskipun agak repetitif dalam bahasa Indonesia.
