  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: id
  text: Tetapi, jika engkau telah menyimpang ketika berada dalam ikatan dengan suamimu[a], dan jika engkau telah menjadi najis, dan seorang laki-laki lain, bukan suamimu, telah bersetubuh denganmu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah menyimpang di bawah suamimu.” Ungkapan ini menggambarkan penyimpangan dalam ikatan perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂטִית
  choice: telah menyimpang dari kesetiaan
  rationale: Mempertahankan gambaran dasar verba שׂטה, yaitu menyimpang, sambil menjelaskan bahwa dalam konteks ini penyimpangan itu menyangkut kesetiaan perkawinan.
- source_word: תַּחַת אִישֵׁךְ
  choice: kepada suamimu
  rationale: Ungkapan harfiah 'di bawah suamimu' menunjuk pada ikatan perkawinan. Dalam bahasa Indonesia modern, maknanya paling wajar disampaikan sebagai kesetiaan kepada suami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: נִטְמֵאת
  choice: telah menajiskan diri
  rationale: Bentuk Nifal טמא dalam konteks hukum-ritual ini menyatakan keadaan tercemar akibat hubungan seksual terlarang. 'Menajiskan diri' mempertahankan bobot ritual dan moral tanpa mereduksinya menjadi sekadar keadaan fisik.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: seorang laki-laki ... telah bersetubuh denganmu
  rationale: Ini adalah ungkapan halus Ibrani bagi hubungan seksual. 'Bersetubuh denganmu' jelas, bermartabat, dan sesuai dengan bahasa Indonesia Alkitabiah modern.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: selain suamimu
  rationale: מִבַּלְעֲדֵי menyatakan pengecualian; 'selain suamimu' secara alami menunjukkan bahwa laki-laki itu bukan sang suami.
theological_decisions:
- issue: Cara menerjemahkan ungkapan penyimpangan dalam ikatan perkawinan tanpa melebihkan makna teks
  choice: telah menyimpang dari kesetiaan kepada suamimu
  alternative: telah tidak setia kepada suamimu; telah menyimpang ketika berada di bawah suamimu
  rationale: Pilihan ini mempertahankan metafora 'menyimpang' sekaligus membuat ranah kesetiaan perkawinan jelas. Terjemahan tidak menambahkan penilaian doktrinal di luar konteks hukum yang dinyatakan teks.
- issue: Hubungan antara 'menajiskan diri' dan klausa persetubuhan
  choice: Menyusun klausa persetubuhan sebagai penjelas keadaan najis
  alternative: 'Mempertahankan rangkaian koordinatif secara kaku: ''dan engkau telah menajiskan diri, dan seorang laki-laki...'''
  rationale: 'Dalam bahasa Indonesia, ''karena'' membuat hubungan semantis yang tersirat menjadi jelas tanpa mengubah isi: kenajisan yang dimaksud dalam ayat ini terkait dengan persetubuhan bersama laki-laki selain suami.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' dipertahankan karena konteksnya adalah tuturan langsung dalam rumusan hukum. Tanda pisah pada akhir ayat mempertahankan struktur kalimat yang berlanjut ke ayat berikutnya.
