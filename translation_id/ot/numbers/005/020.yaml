  source_fidelity: Draf menangkap konteks ketidaksetiaan perkawinan dan hubungan seksual dengan laki-laki selain suami. Namun, klausa Ibrani untuk 'telah menjadi najis' berdiri secara koordinatif, bukan dinyatakan secara eksplisit sebagai akibat dengan 'karena'. Selain itu, bentuk Nifal נִטְמֵאת lebih tepat diterjemahkan sebagai keadaan pasif/intransitif ('telah menjadi najis') daripada refleksif ('telah menajiskan diri').
  naturalness: Bahasa draf pada umumnya baku dan jelas. Revisi mempertahankan register hukum yang bermartabat serta alur bersyarat yang lebih dekat dengan sumber tanpa menjadi kaku.
  terminology: '''Menyimpang'' mempertahankan metafora שׂטה; catatan kaki menjelaskan idiom ''di bawah suamimu''. ''Menjadi najis'' menjaga istilah kenajisan ritual-seksual tanpa menambahkan sebab gramatikal yang tidak dinyatakan secara eksplisit. ''Bersetubuh'' adalah padanan modern yang jelas dan layak untuk eufemisme Ibrani tersebut.'
  issues:
