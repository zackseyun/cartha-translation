revisions:
- from: Namun, jika engkau telah menyimpang dari kesetiaan kepada suamimu[a], dan engkau telah menajiskan diri karena seorang laki-laki selain suamimu telah bersetubuh denganmu—
  to: Tetapi, jika engkau telah menyimpang ketika berada dalam ikatan dengan suamimu[a], dan jika engkau telah menjadi najis, dan seorang laki-laki lain, bukan suamimu, telah bersetubuh denganmu—
  rationale: Revisi mengembalikan tiga klausa koordinatif dalam teks Ibrani dan mengganti ungkapan refleksif 'menajiskan diri' dengan 'menjadi najis'. Frasa 'ketika berada dalam ikatan dengan suamimu' menyampaikan idiom תחת אִישֵׁךְ secara alami, sementara catatan kaki mempertahankan bentuk harfiahnya. Penjelasan 'lain, bukan suamimu' membuat daya kecualian מִבַּלְעֲדֵי tanpa mengubah makna.
