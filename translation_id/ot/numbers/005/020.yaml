    rationale: 'Teks Ibrani memakai rangkaian koordinatif: menyimpang, menjadi najis, dan seorang laki-laki memberi ''pembaringannya'' kepadamu selain suamimu. Walaupun kaitannya jelas dari konteks, ''karena'' mempersempit hubungan sintaksis yang tidak dieksplisitkan sumber.'
  - severity: medium
    issue: '''Telah menajiskan diri'' memberi nuansa refleksif/agensi yang tidak langsung dinyatakan oleh bentuk Nifal נִטְמֵאת.'
    rationale: Padanan 'telah menjadi najis' lebih dekat dengan bentuk dan tetap menyampaikan kenajisan seksual-ritual dalam konteks ayat.
  revised_text: Tetapi, jika engkau telah menyimpang ketika berada dalam ikatan dengan suamimu[a], dan jika engkau telah menjadi najis, dan seorang laki-laki lain, bukan suamimu, telah bersetubuh denganmu—
