base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: id
  text: Kemudian imam harus mengambil segenggam dari persembahan sajian itu, yaitu bagian peringatannya, lalu membakarnya di atas mezbah. Sesudah itu, ia harus memberi perempuan itu minum air itu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “air pahit itu.” Konteks yang lebih luas menyebut air itu demikian, tetapi ayat ini sendiri hanya mengatakan “air itu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמַץ
  choice: harus mengambil segenggam
  rationale: Dalam konteks persembahan, קמץ menunjuk pada tindakan mengambil satu genggam sebagai bagian yang akan dibakar. Bentuk berawalan waw dipahami sebagai langkah berikutnya dalam petunjuk ritual.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku dan wajar bagi כֹּהֵן dalam konteks ibadah Israel.
- source_word: מִן הַמִּנְחָה
  choice: dari persembahan sajian itu
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan berbahan hasil tanaman, bukan sekadar pemberian umum. 'Persembahan sajian' merupakan istilah Indonesia yang ringkas dan lazim untuk jenis kurban ini.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: sebagai bagian pengingatnya
  rationale: אַזְכָּרָה menunjuk pada bagian persembahan sajian yang dibakar di atas mazbah sebagai bagian pengingat. Akhiran feminin tunggal merujuk kembali kepada persembahan sajian.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: dan membakarnya di atas mazbah
  rationale: Dalam pemakaian kurban, הקטיר berarti membakar persembahan sehingga asapnya naik. Objek 'nya' merujuk pada bagian pengingat, sedangkan bentuk berakhiran arah pada מִזְבֵּחָה diterjemahkan secara idiomatis 'di atas mazbah'.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Ungkapan ini menandai urutan waktu setelah pembakaran bagian pengingat.
- source_word: יַשְׁקֶה אֶת הָאִשָּׁה
  choice: ia harus memberi perempuan itu minum
  rationale: Bentuk Hifil יַשְׁקֶה bersifat kausatif. Ungkapan Indonesia 'memberi ... minum' mempertahankan makna bahwa imam membuat atau menyebabkan perempuan itu meminum air tanpa terdengar kaku.
- source_word: אֶת הַמָּיִם
  choice: air tersebut
  rationale: Teks Ibrani ayat ini hanya menyebut 'air'. Kata 'tersebut' menandai air tertentu yang telah disebut dalam konteks, tanpa menambahkan sifat yang tidak terdapat dalam ayat ini.
theological_decisions:
- issue: Apakah air itu perlu disebut 'air pahit' berdasarkan konteks ritual yang lebih luas
  choice: Mempertahankan sebutan sederhana 'air tersebut' dalam teks utama
  alternative: air pahit itu
  rationale: Ayat ini sendiri hanya memuat הַמָּיִם, 'air itu'. Menambahkan 'pahit' ke dalam teks utama akan memasukkan keterangan dari ayat-ayat sekitar dan mengurangi ketepatan terhadap bentuk ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah ritual 'persembahan sajian', 'bagian pengingat', dan 'mazbah' dipertahankan agar unsur teknis teks tetap terlihat. Penanda catatan kaki ditempatkan sesudah 'air tersebut', yaitu pada frasa yang dijelaskan.
