id: NUM.5.8
reference: Numbers 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: id
  text: Namun, jika orang itu tidak mempunyai kerabat penebus yang kepadanya ganti rugi atas kesalahan itu dapat dikembalikan[a], ganti rugi atas kesalahan yang dikembalikan kepada TUHAN menjadi milik imam[b], di samping domba jantan untuk pendamaian, yang dengannya diadakan pendamaian baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penebus” atau “kerabat terdekat”. Kata Ibrani גֹּאֵל menunjuk kepada anggota keluarga yang mempunyai tanggung jawab hukum dalam urusan penebusan atau penerimaan ganti rugi.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani אָשָׁם di sini menunjuk pada ganti rugi atau kompensasi akibat kesalahan, bukan pada domba jantan itu sendiri; domba tersebut disebut secara terpisah sesudahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: kerabat penebus
  rationale: Istilah ini menunjuk kepada anggota keluarga yang memiliki tanggung jawab hukum dalam urusan penebusan atau penerimaan ganti rugi; frasa ini mempertahankan unsur kekerabatan dan fungsi hukumnya.
- source_word: הָאָשָׁם
  choice: ganti rugi atas kesalahan
  rationale: Dalam konteks ini kata tersebut menunjuk pada pembayaran kompensasi akibat kesalahan, bukan pada domba jantan kurban yang disebut secara terpisah sesudahnya.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: ganti rugi atas kesalahan yang dikembalikan
  rationale: Terjemahan ini mempertahankan tindakan restoratif yang dinyatakan oleh bentuk pasif dari שוב.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Nama ilahi יהוה diterjemahkan dengan bentuk konvensional Indonesia, TUHAN.
- source_word: לַכֹּהֵן
  choice: menjadi milik imam
  rationale: Predikat eksplisit diperlukan dalam bahasa Indonesia untuk menyatakan tujuan hukum dari ganti rugi tersebut.
- source_word: מִלְּבַד
  choice: di samping
  rationale: Ungkapan ini menandakan bahwa domba jantan merupakan tambahan pada ganti rugi, bukan barang yang sama.
- source_word: אֵיל הַכִּפֻּרִים
  choice: domba jantan pendamaian
  rationale: Pilihan ini menyatakan jenis hewan dan fungsi ritualnya secara ringkas serta wajar.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: yang dengannya pendamaian diadakan bagi orang itu
  rationale: Bentuk pasif tidak menambahkan pelaku secara eksplisit ketika klausa Ibrani berfokus pada domba sebagai sarana pendamaian.
- source_word: לָאִישׁ
  choice: orang itu
  rationale: Konteks mengacu pada pihak yang bersalah; bahasa Indonesia tidak perlu menandai gender gramatikal sebagaimana bahasa Ibrani.
theological_decisions:
- issue: Hubungan antara ganti rugi dan kurban
  choice: Ganti rugi dan domba jantan pendamaian dipahami sebagai dua hal yang berbeda dan keduanya disebut dalam ketentuan ini.
  alternative: Kata אָשָׁם dapat dipahami sebagai persembahan penebus salah itu sendiri.
  rationale: מִלְּבַד ('di samping') memisahkan ganti rugi dari domba jantan yang dipakai untuk pendamaian.
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: Bentuk TUHAN merupakan padanan konvensional yang bermartabat dalam Alkitab bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hukum-ritual yang jelas dan bermartabat. Struktur kalimat mempertahankan hubungan bersyarat serta pembedaan antara pembayaran ganti rugi dan kurban pendamaian.
