  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: id
  text: Kemudian imam harus menuliskan kutuk-kutuk ini[a] pada gulungan, lalu melunturkan tulisan itu ke dalam air pahit itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kutuk-kutuk sumpah ini.” Istilah Ibrani yang dipakai dapat menunjuk pada kutuk yang berkaitan dengan sumpah.
    reason: lexical_alternative
  - marker: b
    text: Atau “menghapusnya,” “mengusapkannya sampai hilang,” atau “melunturkan tulisan itu.” Kata kerja Ibrani menunjuk pada tindakan mengusap atau menghapus kata-kata yang tertulis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: Kemudian ... harus menuliskan
  rationale: Bentuk perfektum dengan waw dalam rangkaian petunjuk ritual menyatakan tindakan berikutnya yang harus dilakukan; ungkapan ini alami dalam bahasa Indonesia hukum-prosedural.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: kutuk-kutuk ini
  rationale: אָלָה dapat berarti kutuk yang terkait dengan sumpah. Dalam konteks ini yang ditulis ialah sanksi kutuk yang baru diucapkan; nuansa sumpah dipertahankan dalam catatan kaki.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi petugas keimaman yang memimpin ritual ini.
- source_word: בַּסֵּפֶר
  choice: pada gulungan
  rationale: סֵפֶר di sini menunjuk pada bahan atau dokumen tulis, bukan buku berjilid modern. Preposisi Indonesia 'pada' sesuai karena kata-kata ditulis di permukaannya.
- source_word: וּמָחָה
  choice: lalu menghapusnya
  rationale: מחה berarti mengusap, menghapus, atau melenyapkan tulisan. 'Menghapusnya' mempertahankan tindakan terhadap kata-kata tertulis tanpa menentukan secara berlebihan cara fisiknya.
- source_word: אֶל
  choice: ke dalam
  rationale: Preposisi ini menyatakan arah atau pemindahan; dalam konteks penghapusan tulisan dari gulungan menuju air, 'ke dalam' menyampaikan hasil tindakan secara alami.
- source_word: מֵי הַמָּרִים
  choice: air pahit itu
  rationale: Frasa konstruksi ini secara harfiah berarti 'air kepahitan' atau 'air pahit'. Bentuk singular massal 'air' alami dalam bahasa Indonesia, dan kata tunjuk menandai cairan ritual yang telah disebutkan.
