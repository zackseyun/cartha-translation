  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: id
  text: Mereka harus mengakui dosa yang telah mereka perbuat. Orang itu harus mengganti kerugian yang menjadi tanggungannya secara penuh[a], menambahkan seperlimanya, lalu menyerahkan semuanya kepada orang yang telah dirugikannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “kerugian yang menjadi tanggungannya” juga dapat berarti kewajiban atau tanggungan karena kesalahan. Dalam konteks ini, yang dimaksud ialah pembayaran jumlah pokok, bukan kurban penebus salah.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “kepada orang yang terhadapnya ia bersalah,” yaitu orang yang telah dirugikannya.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Mereka harus mengakui
  rationale: Bentuk hitpael dari ידה menyatakan pengakuan terbuka atas kesalahan. “Harus” menyampaikan daya preskriptif dalam konteks hukum, sedangkan bentuk jamak Ibrani dipertahankan.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: dosa yang telah mereka perbuat
  rationale: חַטָּאת menunjuk pada dosa atau pelanggaran yang menjadi objek pengakuan; “perbuat” merupakan ungkapan Indonesia yang wajar untuk עשה dalam konstruksi ini.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: harus membayar kembali jumlah pokok ganti rugi atas kesalahannya
  rationale: Dalam konteks pembayaran kepada pihak yang dirugikan, שוב hiphil berarti mengembalikan atau membayar kembali, אָשָׁם menunjuk pada kewajiban/ganti rugi akibat kesalahan, dan בְּרֹאשׁוֹ menunjuk pada jumlah pokok sebelum tambahan seperlima.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: menambahkan seperlimanya
  rationale: Menyatakan tambahan sebesar seperlima dari jumlah pokok, yakni dua puluh persen, dengan tetap mengikuti bentuk pecahan dalam teks sumber.
- source_word: וְנָתַן
  choice: lalu menyerahkan semuanya
  rationale: נתן berarti memberikan atau menyerahkan. “Semuanya” memperjelas bahwa jumlah pokok beserta tambahan seperlima diserahkan kepada penerima, tanpa mengubah isi ketentuan.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  choice: kepada orang yang telah dirugikannya
  rationale: Ungkapan ini secara harfiah menggambarkan orang yang terhadapnya pelaku menanggung kesalahan atau kewajiban. Padanan ini alami dalam bahasa Indonesia dan mengenali pihak penerima sebagai pihak yang dirugikan.
theological_decisions:
- issue: Makna אָשָׁם dalam konteks penggantian kerugian
  choice: kewajiban atau ganti rugi yang timbul akibat kesalahan, bukan kurban penebus salah
  alternative: kurban penebus salah
  rationale: Konteks langsung berbicara tentang pengakuan, pembayaran jumlah pokok, tambahan seperlima, dan penyerahan kepada pihak yang dirugikan. Karena itu, אָשָׁם di sini terutama menunjuk pada tanggungan akibat kesalahan, meskipun istilah Ibraninya juga dapat dipakai untuk kurban penebus salah dalam konteks lain.
- issue: Peralihan dari subjek jamak ke tunggal
  choice: mempertahankan “mereka” untuk pengakuan dan memakai “orang itu” untuk kewajiban masing-masing pelaku
  alternative: menyeragamkan seluruh ayat menjadi bentuk jamak
  rationale: Teks Ibrani beralih dari verba jamak וְהִתְוַדּוּ kepada verba tunggal וְהֵשִׁיב dan וְנָתַן. Terjemahan mempertahankan peralihan ini sebagai ketentuan distributif bagi setiap orang yang bersalah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum-ekonomi dibuat jelas bagi pembaca umum tanpa menghilangkan hubungan antara kesalahan moral dan kewajiban mengganti kerugian. Pergantian jumlah gramatikal dari jamak ke tunggal dipertahankan secara alami.
