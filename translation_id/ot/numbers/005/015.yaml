id: NUM.5.15
reference: Numbers 5:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: id
  text: Lalu laki-laki itu harus membawa istrinya kepada imam dan membawa persembahan baginya, yaitu sepersepuluh efa tepung jelai. Ia tidak boleh menuangkan minyak ke atas persembahan itu ataupun menaruh kemenyan di atasnya, sebab itu adalah persembahan sajian kecemburuan, persembahan peringatan[a] yang mengingatkan akan kesalahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "persembahan pengingat"; frasa Ibrani ini secara lebih harfiah dapat diterjemahkan "persembahan ingatan".
    reason: lexical_alternative
  - marker: b
    text: Atau "yang mengingatkan akan kesalahan dan tanggungannya"; kata Ibrani עָוֹן dapat berarti kesalahan, kejahatan, keadaan bersalah, atau tanggungan akibat pelanggaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת־אִשְׁתּוֹ
  choice: laki-laki itu harus membawa istrinya
  rationale: Bentuk verbal dalam konteks hukum menyatakan kewajiban. 'Laki-laki itu' mempertahankan הָאִישׁ, sedangkan 'istrinya' memperjelas hubungan perkawinan.
- source_word: אֶל־הַכֹּהֵן
  choice: kepada imam
  rationale: Padanan langsung bagi jabatan kultis הַכֹּהֵן.
- source_word: וְהֵבִיא אֶת־קָרְבָּנָהּ עָלֶיהָ
  choice: dan membawa persembahan baginya
  rationale: Ungkapan ini menyatakan persembahan yang berkaitan dengan perempuan itu dan dibawa untuk atau atas namanya; 'baginya' alami dalam bahasa Indonesia tanpa menentukan lebih jauh relasinya.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: sepersepuluh efa
  rationale: Mempertahankan satuan ukur kuno dan menyampaikan pecahan secara ringkas.
- source_word: קֶמַח שְׂעֹרִים
  choice: tepung jelai
  rationale: קֶמַח adalah tepung dan שְׂעֹרִים adalah jelai; susunan ini alami dalam bahasa Indonesia modern.
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן
  choice: Ia tidak boleh menuangkan minyak ke atas persembahan itu
  rationale: Larangan hukum diterjemahkan dengan 'tidak boleh'; rujukan pronomina diperjelas sebagai persembahan agar tidak kabur.
- source_word: וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: ataupun menaruh kemenyan di atasnya
  rationale: לְבֹנָה menunjuk resin dupa frankincense; 'kemenyan' merupakan padanan Indonesia yang umum, dan 'menaruh' sesuai dengan makna luas נָתַן.
- source_word: מִנְחַת קְנָאֹת
  choice: persembahan sajian karena kecemburuan
  rationale: מִנְחָה dalam konteks kurban adalah persembahan sajian. Frasa 'karena kecemburuan' menyatakan kaitan ritual itu dengan kecemburuan tanpa menganggap perempuan tersebut sudah bersalah.
- source_word: מִנְחַת זִכָּרוֹן
  choice: persembahan pengingat
  rationale: זִכָּרוֹן berarti pengingat atau sesuatu yang menimbulkan ingatan. Pilihan ini ringkas dan mempertahankan fungsi yang dinyatakan teks.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: yang mengingatkan akan kesalahan
  rationale: Partisipel מַזְכֶּרֶת menyatakan fungsi mengingatkan, sedangkan עָוֹן dapat mencakup kesalahan, kejahatan, rasa bersalah, atau tanggungan akibat pelanggaran.
theological_decisions:
- issue: Apakah persembahan ini mengandaikan bahwa perempuan itu bersalah
  choice: Ayat diterjemahkan sebagai uraian fungsi ritual tanpa menyatakan putusan bersalah atau tidak bersalah.
  alternative: Menerjemahkan seolah-olah persembahan itu sejak awal membuktikan kesalahan perempuan tersebut.
  rationale: Teks menyebut persembahan yang mengingatkan akan עָוֹן, tetapi ayat ini sendiri belum menetapkan status perempuan itu. Ketegangan tersebut dipertahankan.
- issue: Makna kecemburuan dalam מִנְחַת קְנָאֹת
  choice: persembahan sajian karena kecemburuan
  alternative: persembahan sajian kecurigaan cemburu
  rationale: Terjemahan pilihan mempertahankan istilah sumber yang luas dan tidak mempersempitnya menjadi sekadar kecurigaan psikologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Gaya hukum dinyatakan dengan 'harus' dan 'tidak boleh'. Istilah kurban 'persembahan sajian' dipertahankan, sedangkan pronomina yang berpotensi kabur diperjelas seperlunya.
