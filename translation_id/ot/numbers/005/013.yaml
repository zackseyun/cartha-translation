source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: id
  text: dan seorang laki-laki bersetubuh dengannya dengan mengeluarkan mani[a], dan hal itu tersembunyi dari mata suaminya, perempuan itu tersembunyi[b] dan telah menjadi najis, sementara tidak ada saksi terhadapnya, dan dia tidak tertangkap[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pembaringan benih,” yaitu hubungan seksual yang disertai keluarnya air mani.
    reason: lexical_alternative
  - marker: b
    text: Atau, “perempuan itu menyembunyikan diri”; bentuk Ibraninya dapat bernuansa pasif atau refleksif.
    reason: alternative_reading
  - marker: c
    text: Atau, “dia tidak disergap” atau “tidak ditangkap.” Sebagian orang memahami ungkapan ini sebagai menyiratkan bahwa dia tidak dipaksa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: lalu seorang laki-laki bersetubuh dengannya
  rationale: Ungkapan שׁכב ... אֹתָהּ dalam konteks ini secara khusus menyatakan hubungan seksual. “Bersetubuh dengannya” jelas, wajar, dan tidak terlalu eufemistis.
- source_word: שִׁכְבַת זֶרַע
  choice: dengan mengeluarkan mani
  rationale: Frasa ini secara harfiah berkaitan dengan “pembaringan benih” dan menunjuk pada hubungan seksual yang disertai keluarnya air mani. Terjemahan ini mempertahankan unsur fisik yang penting dalam konteks hukum kenajisan.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: tetapi hal itu luput dari pandangan suaminya
  rationale: Mempertahankan gambaran Ibrani “dari mata suaminya” dalam bentuk Indonesia yang alami serta menyatakan bahwa peristiwa itu tidak diketahui suami.
- source_word: וְנִסְתְּרָה
  choice: perempuan itu melakukannya secara tersembunyi
  rationale: Bentuk nifal feminin dapat menggambarkan perempuan itu berada atau bertindak secara tersembunyi. Pilihan ini alami dalam bahasa Indonesia, sedangkan ambiguitas pasif/refleksif dicatat dalam catatan kaki.
- source_word: וְהִיא נִטְמָאָה
  choice: dan telah menjadi najis
  rationale: “Menjadi najis” mempertahankan istilah hukum-kemurnian טמא tanpa mempersempitnya menjadi sekadar rasa malu atau pencemaran sosial.
- source_word: וְעֵד אֵין בָּהּ
  choice: Tidak ada saksi yang memberatkan dia
  rationale: Ungkapan ini menyatakan tidak adanya kesaksian yang dapat membuktikan perbuatannya. “Memberatkan dia” menyampaikan daya hukum בָּהּ dengan jelas.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: dan dia tidak tertangkap
  rationale: Dalam alur hukum ini, נתפשׂ paling wajar berarti tertangkap atau kedapatan. Kemungkinan arti “ditangkap/dipegang paksa” tetap dicatat agar ambiguitas tidak dihapus.
theological_decisions:
- issue: Bahasa kenajisan dalam נִטְמָאָה
  choice: telah menjadi najis
  alternative: telah tercemar
  rationale: “Najis” mempertahankan kategori hukum-kemurnian dalam konteks Taurat dan tidak menambahkan muatan retoris yang lebih kuat daripada teks.
- issue: Makna לֹא נִתְפָּשָׂה
  choice: dia tidak tertangkap
  alternative: dia tidak ditangkap atau dipegang paksa
  rationale: Konteks menekankan tidak adanya bukti atau saksi, sehingga arti “tidak tertangkap” paling mungkin. Namun, bentuk katanya dapat dipahami sebagai “tidak ditangkap/dipegang,” yang oleh sebagian orang dikaitkan dengan paksaan; kemungkinan itu dipertahankan dalam catatan.
- issue: Subjek dan nuansa וְנִסְתְּרָה
  choice: perempuan itu melakukannya secara tersembunyi
  alternative: perempuan itu tersembunyi atau menyembunyikan diri
  rationale: Bentuk feminin menunjuk kembali kepada perempuan itu, tetapi nifal dapat bernuansa pasif atau refleksif. Teks utama menyampaikan rahasianya tindakan tanpa menetapkan secara berlebihan bagaimana persembunyian itu terjadi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tetap bermartabat. Istilah “bersetubuh,” “mani,” “najis,” dan “saksi” dipilih karena jelas bagi pembaca umum serta dekat dengan ranah hukum dan kemurnian teks. Tanda pisah dipertahankan karena kalimat bersyarat berlanjut ke ayat berikutnya.
