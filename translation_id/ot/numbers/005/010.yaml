translation:
  language: id
  text: Persembahan kudus setiap orang menjadi miliknya; apa pun yang diberikan seseorang kepada imam menjadi milik imam itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Hal-hal kudus setiap orang menjadi miliknya; seseorang yang memberikan sesuatu kepada imam—itu menjadi miliknya.” “Miliknya” yang terakhir merujuk kepada imam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: setiap orang / seseorang
  rationale: Dalam konteks hukum ini, אִישׁ dipakai secara distributif dan umum. Bahasa Indonesia secara alami menggunakan “setiap orang” dan “seseorang” tanpa menghilangkan cakupan maknanya.
- source_word: קֳדָשָׁיו
  choice: persembahan-persembahan kudusnya
  rationale: Bentuk jamak ini menunjuk kepada benda-benda yang dikhususkan sebagai persembahan suci; “persembahan-persembahan kudus” menyampaikan fungsi kultisnya dengan jelas dan wajar.
- source_word: לוֹ יִהְיוּ
  choice: tetap menjadi miliknya
  rationale: Konstruksi ini menyatakan kepemilikan. “Tetap menjadi miliknya” sesuai dengan konteks bahwa benda kudus itu berada di bawah hak pemilik sampai diserahkan, tanpa mengubah rumusan hukum ayat.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: apa pun yang diberikan seseorang kepada imam
  rationale: Klausa relatif ini bersifat umum; “apa pun” mempertahankan daya hukum yang terbuka, sedangkan bentuk pasif menghasilkan bahasa Indonesia yang alami.
- source_word: לוֹ יִהְיֶה
  choice: menjadi milik imam itu
  rationale: Pronomina Ibrani secara harfiah berarti “menjadi miliknya” dan rujukannya dalam konteks adalah imam. Penyebutan eksplisit menghindari ketaksaan pronomina yang tidak dapat dipertahankan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan dua bentuk לוֹ dalam ayat
  choice: Bentuk pertama merujuk kepada setiap orang; bentuk terakhir merujuk kepada imam.
  alternative: Mempertahankan kedua bentuk sebagai “menjadi miliknya,” sehingga rujukan bentuk terakhir tersirat.
  rationale: Susunan Ibrani menempatkan imam sebagai anteseden terdekat pada klausa kedua, dan konteks hukum menyatakan bahwa pemberian yang telah diberikan kepada imam menjadi hak imam. Bahasa Indonesia membutuhkan rujukan yang lebih eksplisit agar tidak membingungkan.
translation_notes:
  register: Bahasa hukum yang ringkas, modern, dan bermartabat. “Persembahan-persembahan kudus” dipilih untuk menjelaskan קֳדָשָׁיו secara alami, sedangkan “imam itu” memperjelas rujukan pronomina terakhir.
