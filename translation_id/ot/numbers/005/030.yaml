  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: id
  text: atau apabila roh kecemburuan meliputi seorang laki-laki[a] dan ia cemburu terhadap istrinya, ia menghadapkan perempuan itu kepada Yahweh, dan imam harus menjalankan seluruh ketetapan ini terhadap perempuan itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “datang atas”; secara harfiah, “melintas atasnya.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “seluruh hukum ini”, “seluruh petunjuk ini”, atau “seluruh tata cara ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: atau apabila
  rationale: Menandai alternatif kedua dalam rangkaian ketentuan dari ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya disjungtif א֣וֹ.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: roh kecemburuan meliputi
  rationale: Mempertahankan ungkapan 'roh kecemburuan' dan menggambarkan dorongan yang datang menguasai seseorang tanpa menentukan apakah sumbernya psikologis atau rohani.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Menerjemahkan istilah umum untuk laki-laki secara langsung; hubungan sebagai suami menjadi jelas dari frasa berikutnya, 'istrinya'.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: dan ia cemburu kepada istrinya
  rationale: Mempertahankan pengulangan akar קנא dan hubungan sintaksis yang langsung dengan 'istrinya'.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: lalu ia menghadapkan perempuan itu ke hadapan Yahweh
  rationale: Bentuk kausatif עמד berarti membuat berdiri atau menghadapkan; 'menghadapkan' alami untuk penyajian resmi dalam konteks ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: maka imam harus melaksanakan terhadap perempuan itu
  rationale: Menyampaikan daya prosedural bentuk verba dalam konteks hukum sekaligus mempertahankan bahwa tindakan ritual dikenakan kepada perempuan itu.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: seluruh ketetapan ini
  rationale: תּוֹרָה di sini menunjuk kepada rangkaian petunjuk atau tata cara yang baru diuraikan. 'Ketetapan' menjaga nuansa hukum tanpa membatasinya semata-mata pada hukum abstrak.
theological_decisions:
- issue: Hakikat 'roh kecemburuan'
  choice: roh kecemburuan
  alternative: dorongan kecemburuan; rasa cemburu yang meluap
  rationale: Teks Ibrani tidak memastikan apakah ungkapan itu hanya menunjuk pada keadaan batin atau pada kuasa rohani. Terjemahan literal mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-ritual. Konjungsi 'lalu' dan 'maka' memperjelas alur prosedural tanpa mengubah hubungan antarklausa; istilah 'roh kecemburuan' dipertahankan agar ambiguitas sumbernya tidak diselesaikan oleh terjemahan.
