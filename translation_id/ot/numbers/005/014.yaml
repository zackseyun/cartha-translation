base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: id
  text: dan roh kecemburuan menguasainya, dan ia cemburu terhadap istrinya, dan istrinya itu telah menjadi najis[a]; atau jika roh kecemburuan menguasainya, dan ia cemburu terhadap istrinya, padahal istrinya itu tidak menjadi najis[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menajiskan dirinya.” Bahasa Ibrani memakai istilah kenajisan; dalam konteks ini istilah tersebut menunjuk pada dugaan pelanggaran seksual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan istrinya itu tidak menjadi najis.” Kata “padahal” memperjelas pertentangan dalam kemungkinan hukum yang kedua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: menguasainya
  rationale: Ungkapan עָבַר עַל bersama רוּחַ menggambarkan dorongan atau keadaan batin yang datang atas seseorang. “Menguasainya” alami dalam bahasa Indonesia dan menyampaikan kuatnya dorongan itu tanpa mengartikannya semata-mata sebagai gerakan fisik.
- source_word: רוּחַ קִנְאָה
  choice: roh kecemburuan
  rationale: רוח dapat berarti roh, angin, atau dorongan batin, sedangkan קנאה di sini berarti kecemburuan. Terjemahan ini mempertahankan keluasan makna dan citra Ibrani, alih-alih langsung mereduksinya menjadi sekadar “rasa cemburu”.
- source_word: וְקִנֵּא אֶת־אִשְׁתּוֹ
  choice: sehingga ia cemburu terhadap istrinya
  rationale: Bentuk Piel קנא menyatakan reaksi cemburu sang suami. “Terhadap istrinya” merupakan susunan yang wajar dalam bahasa Indonesia; “sehingga” memperjelas hubungan akibat yang tersirat dalam rangkaian klausa Ibrani.
- source_word: נִטְמָאָה
  choice: telah menjadi najis
  rationale: Kata ini memakai bahasa kenajisan dan secara harfiah menyatakan keadaan menjadi najis. Pilihan ini mempertahankan tumpang tindih makna ritual, moral, dan seksual dalam konteks hukum ini, tanpa menambahkan unsur refleksif yang tidak dinyatakan secara eksplisit oleh bentuk Ibraninya.
- source_word: אוֹ
  choice: atau jika
  rationale: אוֹ memperkenalkan kemungkinan hukum yang lain. Penambahan “jika” membuat fungsi bersyaratnya jelas dan alami dalam bahasa Indonesia.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: padahal istrinya itu tidak menjadi najis
  rationale: 'Konjungsi Ibrani secara harfiah berarti “dan”, tetapi di sini mengandung pertentangan: kecemburuan suami mungkin tidak berdasar. “Padahal” mengungkapkan pertentangan kontekstual itu dengan jelas.'
theological_decisions:
- issue: Sifat kenajisan dalam hukum mengenai dugaan perzinaan
  choice: Menerjemahkan נִטְמָאָה sebagai “telah menjadi najis”.
  alternative: “telah menajiskan dirinya” atau “telah mencemarkan dirinya”.
  rationale: Konteks menunjuk pada dugaan hubungan seksual yang melanggar kesetiaan perkawinan, tetapi istilah Ibrani tetap memakai kategori kenajisan. “Menjadi najis” mempertahankan ketegangan moral-ritual tersebut dan tidak memastikan refleksivitas atau nuansa teologis yang melampaui teks.
- issue: Hubungan antara kecemburuan suami dan kenyataan perkara
  choice: Memakai “padahal” dalam kemungkinan kedua.
  alternative: Mempertahankan konjungsi secara formal sebagai “dan”.
  rationale: Ayat ini secara sengaja mencakup dua kemungkinan—istri memang menjadi najis atau tidak. “Padahal” menandai bahwa kecemburuan suami dapat muncul meski dugaan itu tidak benar, tanpa menilai motif atau kesalahannya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel ayat dipertahankan. “Roh kecemburuan” mempertahankan citra serta ambiguitas רוח, sedangkan “menguasainya” membuat idiom itu wajar bagi pembaca masa kini. Tanda koma akhir dipertahankan karena ayat ini merupakan bagian dari kalimat hukum yang berlanjut ke ayat berikutnya.
