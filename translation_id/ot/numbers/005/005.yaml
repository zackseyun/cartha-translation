  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/005.yaml
  text: And Yahweh spoke to Moses, saying,
translation:
  language: id
  text: Yahweh berfirman kepada Musa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר membuka satu unit firman baru. Dalam bahasa Indonesia, “berfirman” merupakan padanan alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai orang yang menjadi tujuan penyampaian firman; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: (dinyatakan melalui tanda koma)
  rationale: Infinitif לֵאמֹר memperkenalkan isi firman yang menyusul. Dalam bahasa Indonesia modern, fungsi ini paling alami diwakili oleh tanda koma, tanpa ungkapan redundan seperti “demikian” atau “kata-Nya”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula Ibrani harfiah “berfirman ... dengan berkata” diungkapkan secara alami sebagai “berfirman ...,” karena isi perkataan berlanjut pada ayat berikutnya.
