base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: id
  text: '“Berbicaralah kepada anak-anak Israel[a] dan katakanlah kepada mereka: Jika istri seseorang menyimpang dan melakukan pengkhianatan terhadap suaminya[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini merupakan sebutan kolektif bagi umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata kerja dan kata benda yang seakar untuk menegaskan tindakan tidak setia atau berkhianat.
    reason: source_form
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Bentuk imperatif yang membuka perintah ilahi kepada Musa; pilihan ini mempertahankan rumusan pembuka yang langsung dan resmi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi sebagai sebutan kolektif menunjuk kepada umat Israel. ‘Keturunan Israel’ mempertahankan citra kekerabatan tanpa memberi kesan bahwa yang dimaksud hanya anak-anak atau hanya laki-laki.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakanlah kepada mereka
  rationale: Menerjemahkan lanjutan rumusan penyampaian hukum secara lugas dan mempertahankan kesejajaran kedua perintah.
- source_word: אִישׁ אִישׁ
  choice: seseorang
  rationale: Pengulangan ‘laki-laki, laki-laki’ bersifat distributif, yakni ‘siapa pun’ atau ‘setiap laki-laki’. Dalam susunan ‘istri seseorang’, makna distributif itu tersampaikan secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik ini, kata tersebut memperkenalkan keadaan bersyarat, bukan terutama keterangan waktu.
- source_word: תִשְׂטֶה
  choice: menyimpang
  rationale: Mempertahankan gambaran berbelok atau menyimpang tanpa lebih dahulu mempersempitnya menjadi tindakan seksual tertentu sebelum ayat berikutnya menjelaskan kasusnya.
- source_word: אִשְׁתּוֹ
  choice: istri seseorang
  rationale: Akhiran posesif Ibrani disampaikan melalui konstruksi alami bahasa Indonesia yang terkait dengan unsur distributif sebelumnya.
- source_word: וּמָעֲלָה ... מָעַל
  choice: melakukan tindakan pengkhianatan
  rationale: Ungkapan serumpun verba-nomina menegaskan tindakan tidak setia atau berkhianat. Pilihan ini mempertahankan bobot tindakan tersebut lebih baik daripada sekadar ‘tidak setia’, meski pengulangan morfologis Ibrani tidak dapat ditiru secara alami.
- source_word: בּוֹ
  choice: terhadap suaminya
  rationale: Preposisi menandai sang suami sebagai pihak yang dikhianati; penyebutan ‘suaminya’ lebih jelas dan alami daripada pronomina ‘dia’ dalam bahasa Indonesia.
theological_decisions:
- issue: Sapaan kolektif yang secara harfiah bergender
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Ungkapan Ibrani memakai istilah kekerabatan maskulin tetapi berfungsi sebagai nama kolektif umat. Terjemahan utama menjaga unsur keturunan sekaligus menghindari pembatasan makna yang tidak dimaksudkan konteks.
- issue: Sifat pelanggaran istri
  choice: melakukan tindakan pengkhianatan terhadap suaminya
  alternative: berlaku tidak setia kepada suaminya
  rationale: Ungkapan Ibrani menekankan pengkhianatan relasional melalui pasangan kata serumpun. Terjemahan tidak langsung menyebut perzinaan, sehingga ketegangan dan perkembangan uraian hukum dalam ayat-ayat berikut tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. ‘Menyimpang’ sengaja dipertahankan sebagai ungkapan umum, sedangkan ‘melakukan tindakan pengkhianatan’ mencerminkan penegasan ungkapan Ibrani tanpa menjadi terlalu arkais.
