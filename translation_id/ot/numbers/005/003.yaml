base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: id
  text: Baik laki-laki maupun perempuan harus kamu suruh keluar dari perkemahan; kamu harus menyuruh mereka pergi supaya mereka tidak menajiskan perkemahan-perkemahan mereka[a], di tengah-tengah mereka Aku berdiam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkemahan mereka”; bahasa Ibrani memakai bentuk jamak, yang mungkin menunjuk pada bagian-bagian atau lingkungan-lingkungan perkemahan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang di tengah-tengahnya Aku berdiam.” Bahasa Ibrani dapat mengacu kepada perkemahan-perkemahan itu atau kepada orang-orang yang berada di dalamnya.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: Baik laki-laki maupun perempuan
  rationale: Ungkapan Ibrani menyatakan cakupan inklusif dari laki-laki sampai perempuan. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan pasangan biologis dalam teks.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: harus kamu suruh pergi ... kamu harus menyuruh mereka pergi
  rationale: Pengulangan bentuk intensif dari שלח dipertahankan untuk menjaga penekanan sumber. 'Menyuruh pergi' menyampaikan pengeluaran dari perkemahan tanpa menambahkan kesan hukuman yang tidak dinyatakan.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Terjemahan ini alami dan mempertahankan arah gerak melampaui batas perkemahan.
- source_word: יְטַמְּאוּ
  choice: menajiskan
  rationale: Dalam konteks kemurnian ritual imamat, 'menajiskan' mempertahankan dimensi kultis kata טמא dengan lebih tepat daripada istilah umum seperti 'mengotori'.
- source_word: מַחֲנֵיהֶם
  choice: perkemahan-perkemahan mereka
  rationale: Bentuk jamak Ibrani dengan akhiran orang ketiga jamak dipertahankan. Bentuk ini mungkin menunjuk pada bagian-bagian perkemahan atau beberapa lingkungan perkemahan Israel.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: tempat Aku berdiam di tengah-tengah mereka
  rationale: Rumusan ini menjaga kemungkinan bahwa akhiran jamak mengacu kepada orang-orang yang terkait dengan perkemahan, sekaligus menyatakan kehadiran Allah dalam lingkungan perkemahan tanpa memaksakan satu acuan secara mutlak.
theological_decisions:
- issue: Acuan akhiran jamak dalam בְּתוֹכָם dan klausa relatif terakhir
  choice: tempat Aku berdiam di tengah-tengah mereka
  alternative: yang di tengah-tengahnya Aku berdiam
  rationale: Bahasa Ibrani memungkinkan acuan kepada orang-orang maupun perkemahan-perkemahan sebagai keseluruhan korporat. Teks utama mempertahankan penekanan kehadiran Allah di antara umat, sedangkan catatan kaki menyebut kemungkinan acuan lokatif kepada perkemahan-perkemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan perintah dipertahankan, sedangkan istilah 'menajiskan' dipilih untuk konteks kemurnian ritual. Semua penanda catatan kaki muncul dalam teks utama.
