  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: id
  text: 'Katakanlah kepada orang Israel: Apabila seorang laki-laki atau perempuan melakukan salah satu dosa yang dilakukan manusia dengan berlaku tidak setia terhadap TUHAN, orang itu bersalah.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Katakanlah kepada orang Israel
  rationale: Bentuk perintah Piel דַּבֵּר diterjemahkan secara wajar sebagai “Katakanlah”. בְּנֵי יִשְׂרָאֵל adalah sebutan kolektif-kovenantal yang dalam bahasa Indonesia modern paling alami dinyatakan “orang Israel”.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: seorang laki-laki atau perempuan
  rationale: Mempertahankan pasangan eksplisit laki-laki/perempuan serta cakupan hukum terhadap masing-masing orang.
- source_word: כִּי יַעֲשׂוּ
  choice: Apabila ... melakukan
  rationale: כִּי memperkenalkan perkara hukum kasuistik. Walau verba Ibrani berbentuk jamak, acuannya distributif kepada seorang laki-laki atau perempuan, sehingga konstruksi tunggal alami dalam bahasa Indonesia.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: salah satu dosa yang biasa dilakukan manusia
  rationale: חַטֹּאת berarti dosa atau pelanggaran, sedangkan הָאָדָם bersifat generik. Ungkapan ini mempertahankan kemungkinan makna dosa yang lazim dilakukan manusia tanpa membatasi אָדָם kepada laki-laki.
- source_word: לִמְעֹל מַעַל
  choice: sehingga berlaku tidak setia
  rationale: Infinitif dan nomina serumpun menekankan tindakan pengkhianatan atau pelanggaran kesetiaan. “Berlaku tidak setia” menyampaikan nuansa relasional-kovenantal dalam bahasa Indonesia modern.
- source_word: בַּיהוָה
  choice: terhadap TUHAN
  rationale: Preposisi ב dalam idiom dengan מעל menunjukkan pihak yang menjadi sasaran ketidaksetiaan. Nama יהוה ditampilkan dengan konvensi Indonesia “TUHAN”.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: orang itu menjadi bersalah
  rationale: נֶפֶשׁ di sini menunjuk kepada pribadi, bukan ‘jiwa’ sebagai unsur tak berjasad. Verba אָשַׁם menyatakan masuknya orang tersebut ke dalam keadaan bersalah atau menanggung kesalahan.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: “TUHAN” merupakan konvensi Alkitab bahasa Indonesia yang luas dikenal untuk Tetragramaton dan menjaga pembedaan tipografis dari אֲדֹנָי.
- issue: Cakupan הָאָדָם dalam ungkapan hukum
  choice: manusia
  alternative: Adam / laki-laki
  rationale: Dengan artikel dan dalam konteks ini, הָאָדָם merujuk generik kepada umat manusia, bukan tokoh Adam atau hanya jenis kelamin laki-laki.
- issue: Hubungan לִמְעֹל מַעַל dengan klausa dosa
  choice: sehingga berlaku tidak setia
  alternative: dengan berlaku tidak setia / untuk melakukan pelanggaran kesetiaan
  rationale: Konstruksi dapat dipahami sebagai penjelasan sifat atau akibat pelanggaran itu. “Sehingga” menjaga kaitan erat antara dosa terhadap sesama dalam konteks berikutnya dan ketidaksetiaan terhadap TUHAN, tanpa menjadikannya dua tindakan terpisah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Katakanlah” mempertahankan nada perintah ilahi; “orang Israel” menghindari ungkapan kaku “anak-anak Israel”; “berlaku tidak setia” mempertahankan dimensi relasional dari מעל.
