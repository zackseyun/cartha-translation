source:
  edition: WLC
  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: id
  text: Kemudian imam harus menghadapkan perempuan itu di hadapan Yahweh, menguraikan rambutnya[a], dan menaruh di telapak tangannya persembahan sajian pengingat—itu adalah persembahan sajian kecemburuan. Sementara itu, di tangan imam harus ada air pahit yang mendatangkan kutuk[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyingkapkan kepala perempuan itu” atau “membiarkan rambut perempuan itu tergerai.” Secara harfiah, idiom Ibrani menyebut tindakan terhadap “kepala” perempuan itu; dalam konteks ini, kemungkinan besar hal itu menunjuk pada penguraian atau pelepasan ikatan rambut sebagai bagian dari ritual.
    reason: lexical_alternative
  - marker: b
    text: Atau “air pahit yang mendatangkan kutuk itu.” Partisipel Ibrani dapat dipahami sebagai keterangan bahwa air tersebut membawa atau memberlakukan suatu kutuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: harus menghadapkan
  rationale: Bentuk Hifil dari עמד menyatakan tindakan membuat seseorang berdiri atau menghadirkannya secara resmi. Dalam konteks ritual, “menghadapkan” alami dalam bahasa Indonesia dan tetap mempertahankan tindakan formal itu.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan kultis ini menunjuk pada kehadiran Yahweh; nama ilahi יְהוָה dialihaksarakan sebagai “Yahweh”.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: menguraikan rambutnya
  rationale: Idiom Ibrani secara harfiah menyebut “kepala” perempuan itu dan dapat berarti membiarkannya tidak tertutup atau terurai. Dalam konteks ritual, “menguraikan rambutnya” menyampaikan kemungkinan bahwa rambutnya dilepas dari ikatan, tanpa menutupi alternatif leksikal yang dicatat dalam catatan kaki.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: menaruh di telapak tangannya
  rationale: Terjemahan ini mempertahankan gambaran konkret כַּף, yaitu telapak tangan, dan tetap alami dalam bahasa Indonesia.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: persembahan sajian pengingat
  rationale: מִנְחָה dalam konteks keimaman adalah persembahan sajian, sedangkan זִכָּרוֹן menyatakan sesuatu yang mengingatkan atau menjadi peringatan. “Pengingat” mempertahankan fungsi istilah itu tanpa menentukan secara eksplisit siapa yang diingatkan.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: itu adalah persembahan sajian kecemburuan
  rationale: Bentuk jamak קְנָאֹת berfungsi secara abstrak. “Kecemburuan” adalah padanan Indonesia yang wajar, dan pengulangan “persembahan sajian” mempertahankan aposisi Ibrani.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: Sementara itu, di tangan imam harus ada
  rationale: Klausa ini bersifat sirkumstansial dan menjelaskan apa yang berada dalam tangan imam selama tindakan tersebut. Bentuk tunggal “tangan” mengikuti teks Ibrani.
- source_word: מֵי הַמָּרִים
  choice: air pahit
  rationale: Bahasa Ibrani memakai bentuk yang secara harfiah dapat disebut “air-air pahit”, tetapi “air pahit” adalah bentuk nomina massa yang alami dalam bahasa Indonesia.
- source_word: הַמְאָרֲרִים
  choice: yang mendatangkan kutuk
  rationale: Partisipel dari ארר menggambarkan air itu sebagai sarana yang membawa atau memberlakukan kutuk. “Mendatangkan kutuk” jelas dan tidak melampaui daya kausatif ungkapan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna ritual frasa tentang kepala atau rambut perempuan
  choice: menguraikan rambutnya
  alternative: menyingkapkan kepalanya; membiarkan rambutnya tergerai
  rationale: Bukti leksikal memungkinkan lebih dari satu pemahaman. Teks utama memilih tindakan menguraikan rambut sebagai bacaan kontekstual yang kuat, sedangkan catatan kaki mempertahankan ambiguitas asli agar implikasi ritual tidak dipastikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ritual yang khidmat tetapi mudah dipahami. Istilah “persembahan sajian” dipakai secara konsisten untuk מִנְחָה; struktur kalimat dipecah secukupnya agar jelas tanpa menghilangkan urutan tindakan dalam bahasa Ibrani.
