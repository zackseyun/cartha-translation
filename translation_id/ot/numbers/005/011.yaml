lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam formula pembuka sabda ilahi, דִּבֵּר paling alami dan bermartabat diterjemahkan dengan “berfirman”; waw konsekutif mengawali unit tuturan baru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menerima firman; “kepada” merupakan padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam formula וידבר ... לאמר, fungsi לֵאמֹר ialah memperkenalkan isi tuturan berikutnya. Bahasa Indonesia secara alami cukup memakai “berfirman kepada”; menerjemahkannya sebagai “dengan mengatakan” akan terasa kaku dan berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar; vokalisasi historisnya tidak sepenuhnya pasti dan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula “Yahweh berfirman kepada Musa” alami untuk pembuka sabda ilahi; koma menandakan bahwa isi firman berlanjut pada ayat berikutnya.
