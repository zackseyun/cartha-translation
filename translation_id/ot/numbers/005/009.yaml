  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: id
  text: Setiap persembahan dari segala pemberian kudus bani Israel[a] yang mereka persembahkan kepada imam akan menjadi milik imam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “orang Israel” atau “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: persembahan
  rationale: Kata ini menunjuk pada sesuatu yang dikhususkan dan diserahkan sebagai pemberian, sering kali sebagai hak imam. “Persembahan” alami dalam bahasa Indonesia dan sesuai dengan konteks ibadah.
- source_word: קָדְשֵׁי
  choice: pemberian kudus
  rationale: Bentuk jamak konstruksi ini menunjuk pada benda atau pemberian yang telah dikhususkan bagi Allah. “Pemberian kudus” mempertahankan unsur kekudusan sekaligus memperjelas bahwa yang dimaksud ialah sesuatu yang diserahkan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan bentuk kekeluargaan Ibrani secara ringkas dan lazim dipahami dalam bahasa Indonesia sebagai keturunan atau umat Israel, tanpa membatasinya hanya kepada laki-laki dewasa.
- source_word: יַקְרִיבוּ
  choice: mereka persembahkan
  rationale: Bentuk kausatif dari קרב secara harfiah berarti “membawa dekat,” tetapi dalam konteks ibadah lazim berarti membawa atau mempersembahkan suatu pemberian. “Mempersembahkan” menyampaikan nuansa kultisnya dengan wajar.
- source_word: לַכֹּהֵן
  choice: kepada imam
  rationale: Preposisi tersebut menandai imam sebagai penerima persembahan.
- source_word: לוֹ יִהְיֶה
  choice: akan menjadi milik imam itu
  rationale: Ungkapan ini menyatakan kepemilikan secara hukum. Pengulangan “imam itu” lebih jelas dan alami daripada pronomina yang dapat terasa kabur dalam bahasa Indonesia.
theological_decisions:
- issue: Sebutan bagi komunitas perjanjian בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: “Bani Israel” mempertahankan citra keturunan dalam bahasa sumber, namun tetap dapat menunjuk kepada komunitas Israel secara keseluruhan. Alternatif “orang Israel” lebih idiomatis tetapi menghilangkan bentuk kekeluargaan; “anak-anak Israel” lebih harfiah tetapi dalam bahasa Indonesia modern mudah disalahpahami sebagai anak yang belum dewasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-ibadah. Struktur kalimat dijaga dekat dengan bahasa Ibrani, sementara “mempersembahkan” dipakai agar ungkapan kultis יַקְרִיבוּ terdengar alami. Penanda catatan kaki [a] ditempatkan langsung setelah istilah yang dijelaskan.
