  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: id
  text: Maka laki-laki itu akan bebas dari kesalahan, tetapi perempuan itu akan menanggung kesalahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “menanggung kesalahannya” juga dapat mencakup menanggung akibat dari kesalahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: akan bebas
  rationale: Bentuk Nifal dari נקה dengan מִן menyatakan bebas atau lepas dari kesalahan maupun tanggung jawab; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: הָאִישׁ
  choice: laki-laki itu
  rationale: Menerjemahkan arti formal אִישׁ, sementara konteks menunjukkan bahwa ia adalah sang suami.
- source_word: מֵעָוֺן
  choice: dari kesalahan
  rationale: עָוֹן di sini mencakup kesalahan moral dan tanggung jawab yang timbul darinya; pilihan ini menjaga hubungan dengan pemakaian kata yang sama pada klausa berikutnya.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: tetapi perempuan itu
  rationale: וְ memiliki fungsi kontras dalam konteks ini, sedangkan הַהִוא dipertahankan melalui demonstratif 'itu'.
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: akan menanggung kesalahannya
  rationale: Mempertahankan idiom Ibrani secara ringkas; maknanya dapat mencakup tanggungan atas kesalahan sekaligus akibatnya.
theological_decisions:
- issue: Makna עָוֹן dalam kedua klausa
  choice: kesalahan
  alternative: dosa; hukuman akibat kesalahan
  rationale: Pemakaian istilah yang sama mempertahankan kesejajaran hukum-moral antara laki-laki yang bebas dari tanggungan dan perempuan yang menanggung kesalahannya, tanpa membatasi makna hanya pada hukuman.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Laki-laki itu' mempertahankan bentuk teks sumber, sedangkan 'perempuan itu' menjaga penekanan demonstratif. Kontras antarklausa dibuat eksplisit dengan 'tetapi'.
