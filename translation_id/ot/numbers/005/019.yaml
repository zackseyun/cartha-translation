  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: id
  text: Lalu imam harus menyuruh perempuan itu bersumpah dan berkata kepadanya, “Jika tidak ada laki-laki yang bersetubuh denganmu, dan jika engkau tidak menyimpang kepada kenajisan dalam ikatan perkawinan dengan suamimu,[a] bebaslah dari air pahit ini yang mendatangkan kutuk.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di bawah suamimu,” suatu idiom yang merujuk pada status dan ikatan perkawinan perempuan itu.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “dari air-air pahit ini, yang mendatangkan kutuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: harus menyuruh perempuan itu bersumpah
  rationale: Bentuk Hifil dari שבע menyatakan tindakan membuat atau menyuruh seseorang bersumpah; pilihan ini mempertahankan daya kausatifnya dalam bahasa Indonesia yang wajar.
- source_word: וְאָמַר אֶל הָאִשָּׁה
  choice: dan berkata kepadanya
  rationale: Ungkapan ini melanjutkan prosedur hukum; pronomina 'kepadanya' menghindari pengulangan yang kaku tanpa menghilangkan rujukan kepada perempuan itu.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: Jika tidak ada laki-laki yang bersetubuh denganmu
  rationale: שכב dengan objek orang dalam konteks ini merupakan ungkapan bagi hubungan seksual. 'Bersetubuh' jelas, bermartabat, dan tidak lebih eksplisit daripada konteks hukumnya.
- source_word: וְאִם לֹא שָׂטִית טֻמְאָה
  choice: dan jika engkau tidak menyimpang dengan menajiskan diri
  rationale: שׂטה mempertahankan gambaran penyimpangan, sedangkan טֻמְאָה menyatakan kenajisan. Rumusan ini menghubungkan keduanya secara alami tanpa membatasi kenajisan itu hanya pada kategori ritual atau moral.
- source_word: תַּחַת אִישֵׁךְ
  choice: selama menjadi istri suamimu
  rationale: Secara harfiah ungkapan itu berarti 'di bawah suamimu', tetapi dalam konteks ini menunjuk pada status dan ikatan perkawinan. Terjemahan utama menyampaikan idiom tersebut secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הִנָּקִי
  choice: engkau akan bebas dari akibat
  rationale: Bentuk ini dapat berfungsi sebagai pernyataan pembebasan dalam rumusan sumpah. Penambahan 'akibat' memperjelas bahwa perempuan yang tidak bersalah tidak akan terkena dampak air itu, bukan tidak perlu meminumnya.
- source_word: מִמֵּי הַמָּרִים
  choice: air pahit
  rationale: Bentuk jamak Ibrani 'air-air' dapat berfungsi kolektif; bentuk tunggal massal 'air' lebih alami dalam bahasa Indonesia.
- source_word: הַמְאָרֲרִים הָאֵלֶּה
  choice: yang mendatangkan kutuk ini
  rationale: Partisip dari ארר menggambarkan air itu sebagai pembawa atau pelaksana kutuk. 'Mendatangkan kutuk' mempertahankan daya kausatif tanpa menjelaskan mekanismenya secara berlebihan.
theological_decisions:
- issue: Sifat pelanggaran yang dimaksud
  choice: Mempertahankan bahasa hubungan seksual, penyimpangan, dan kenajisan dalam ikatan perkawinan.
  alternative: Menerjemahkannya langsung sebagai 'berzina'.
  rationale: Konteksnya adalah dugaan ketidaksetiaan seksual, tetapi teks Ibrani mengungkapkannya melalui beberapa unsur tersendiri. Terjemahan tidak melebur semuanya menjadi satu istilah teologis-hukum yang lebih khusus.
- issue: Makna תַּחַת אִישֵׁךְ
  choice: Menyampaikan makna idiomatis sebagai status perempuan selama berada dalam ikatan perkawinan.
  alternative: Menerjemahkan secara harfiah 'di bawah suamimu'.
  rationale: Bentuk harfiah berisiko dipahami terutama sebagai lokasi atau hierarki sosial dalam bahasa Indonesia modern. Catatan kaki tetap menjaga bentuk dan nuansa sumber.
- issue: Dampak air pahit
  choice: Menyatakan bahwa air itu mendatangkan kutuk, tanpa merinci cara atau akibat jasmaninya dalam ayat ini.
  alternative: Menjelaskannya sebagai air yang secara otomatis menghukum atau menyebabkan akibat tertentu.
  rationale: Partisip Ibrani mengaitkan air dengan pelaksanaan kutuk, tetapi ayat ini sendiri belum merinci mekanismenya.
- issue: Daya ujar הִנָּקִי
  choice: 'Merendernya sebagai pernyataan hasil: ''engkau akan bebas dari akibat''.'
  alternative: 'Merendernya sebagai imperatif harfiah: ''bebaslah''.'
  rationale: Dalam rumusan sumpah, bentuk imperatif itu menyatakan pembebasan perempuan yang tidak bersalah dari dampak air. Bahasa Indonesia lebih alami dengan pernyataan hasil, sementara ketegangan bentuknya dijaga dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang khidmat. 'Bersetubuh' dipilih sebagai istilah yang jelas namun bermartabat; idiom perkawinan Ibrani dijelaskan tanpa mengimpor gagasan denominasi tertentu.
