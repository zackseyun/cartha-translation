    text: Secara harfiah, “di bawah suamimu,” suatu idiom yang merujuk pada status dan ikatan perkawinan perempuan itu.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “dari air-air pahit ini, yang mendatangkan kutuk.”
    reason: lexical_alternative
