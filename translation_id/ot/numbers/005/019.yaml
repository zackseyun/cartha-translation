review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya menangkap prosedur sumpah, hubungan seksual, dan kaitan air pahit dengan kutuk. Namun, “engkau akan bebas dari akibat air pahit” mengubah imperatif הִנָּקִי menjadi prediksi serta menambahkan “akibat,” yang tidak dinyatakan dalam teks dan dapat mempersempit pembebasan hanya pada efek air.
  naturalness: Bahasanya umumnya baku, tetapi “selama menjadi istri suamimu” terasa tautologis dan kurang lancar. “Dalam ikatan perkawinan dengan suamimu” menyampaikan idiom secara lebih alami.
  terminology: “Bersetubuh” sesuai dengan register hukum-ritual dan eufemisme sumber. “Kenajisan” lebih langsung mencerminkan טֻמְאָה daripada frasa verbal “dengan menajiskan diri,” tanpa memutuskan apakah nuansanya terutama ritual atau moral.
  issues:
  - severity: medium
    issue: Daya ujar הִנָּקִי digeser dan diperluas.
    rationale: Bentuk ini adalah seruan pembebasan (“bebaslah”), bukan terutama pernyataan masa depan. Tambahan “akibat” tidak ada dalam bahasa Ibrani dan berisiko memberi penjelasan yang melampaui ayat.
  - severity: low
    issue: Terjemahan idiom תַּחַת אִישֵׁךְ kurang alami.
    rationale: “Selama menjadi istri suamimu” bersifat tautologis. Makna status/ikatan perkawinan dapat disampaikan lebih jelas sebagai “dalam ikatan perkawinan dengan suamimu.”
  - severity: low
    issue: Catatan kaki b tidak berfungsi sebagai alternatif leksikal yang memadai.
    rationale: Catatan itu mengulang terjemahan utama dan menambahkan penjelasan “akibat.” Catatan sebaiknya memberikan bentuk harfiah yang menunjukkan konstruksi Ibrani “air-air pahit, yang mendatangkan kutuk.”
  revised_text: Lalu imam harus menyuruh perempuan itu bersumpah dan berkata kepadanya, “Jika tidak ada laki-laki yang bersetubuh denganmu, dan jika engkau tidak menyimpang kepada kenajisan dalam ikatan perkawinan dengan suamimu,[a] bebaslah dari air pahit ini yang mendatangkan kutuk.[b]”
  revised_footnotes:
