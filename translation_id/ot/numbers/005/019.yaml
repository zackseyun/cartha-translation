revisions:
- from: Lalu imam harus menyuruh perempuan itu bersumpah dan berkata kepadanya, “Jika tidak ada laki-laki yang bersetubuh denganmu, dan jika engkau tidak menyimpang dengan menajiskan diri selama menjadi istri suamimu,[a] engkau akan bebas dari akibat air pahit yang mendatangkan kutuk ini.[b]”
  to: Lalu imam harus menyuruh perempuan itu bersumpah dan berkata kepadanya, “Jika tidak ada laki-laki yang bersetubuh denganmu, dan jika engkau tidak menyimpang kepada kenajisan dalam ikatan perkawinan dengan suamimu,[a] bebaslah dari air pahit ini yang mendatangkan kutuk.[b]”
  rationale: 'Revisi mempertahankan ambiguitas dan metafora sumber: perempuan itu tidak “menyimpang kepada kenajisan” dalam ikatan perkawinannya. Imperatif pembebasan dipulihkan sebagai “bebaslah,” tanpa menambahkan “akibat.” Catatan kaki diperbaiki agar benar-benar menampilkan bentuk harfiah dan fungsi idiomatis sumber.'
