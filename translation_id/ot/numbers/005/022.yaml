id: NUM.5.22
reference: Numbers 5:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: id
  text: Biarlah air pembawa kutuk ini masuk ke dalam tubuhmu[a], untuk membuat perutmu membengkak dan pahamu menyusut. Lalu perempuan itu harus berkata, “Amin, amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ke bagian-bagian dalammu, untuk membengkakkan perut dan membuat paha jatuh.” Ungkapan Ibrani ini sulit dan mungkin merupakan bahasa halus untuk gangguan pada organ reproduksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: Biarlah ... masuk
  rationale: Dalam konteks sumpah-kutuk, bentuk ini menyatakan kutuk atau harapan performatif, bukan sekadar kejadian pada masa depan.
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: air pembawa kutuk ini
  rationale: Dalam bahasa Indonesia, 'air' lazim dipakai sebagai nomina massa; 'pembawa kutuk' mempertahankan fungsi partisipel yang menunjukkan bahwa air itu membawa atau melaksanakan kutuk.
- source_word: בְּמֵעַיִךְ
  choice: ke dalam tubuhmu
  rationale: מֵעֶה menunjuk bagian-bagian dalam tubuh. Pilihan ini alami dalam bahasa Indonesia dan tidak terlalu klinis, meski rincian harfiahnya dijelaskan dalam catatan kaki.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: untuk membuat perutmu membengkak
  rationale: Mempertahankan klausa hasil dan arti langsung בֶּטֶן sebagai 'perut' tanpa secara pasti menafsirkannya sebagai rahim.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: dan pahamu menyusut
  rationale: Ungkapan Ibrani ini sulit dan mungkin bersifat eufemistis. 'Menyusut' menyampaikan kerusakan tubuh secara wajar tanpa memaksakan diagnosis tertentu.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: Lalu perempuan itu harus berkata
  rationale: Menyampaikan kelanjutan ketentuan ritual secara jelas dan alami dalam bahasa Indonesia modern.
- source_word: אָמֵן אָמֵן
  choice: Amin, amin
  rationale: Mempertahankan jawaban liturgis ganda sebagai penegasan khidmat.
theological_decisions:
- issue: Makna tepat akibat jasmani dari kutuk
  choice: Memakai ungkapan relatif harfiah 'perutmu membengkak dan pahamu menyusut' tanpa menentukan akibat medis tertentu.
  alternative: rahimmu keguguran; alat kelaminmu menyusut; pahamu jatuh
  rationale: Teks Ibrani tampaknya memakai bahasa eufemistis dan tidak secara tegas menetapkan apakah akibatnya adalah keguguran, kemandulan, atau gangguan reproduksi lain. Terjemahan mempertahankan ketidakpastian itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Diksi ritual dipertahankan tanpa menjadi arkais; ambiguitas anatomi dalam teks sumber tidak diselesaikan secara spekulatif.
