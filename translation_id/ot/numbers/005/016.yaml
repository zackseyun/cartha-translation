  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: id
  text: Kemudian imam harus membawa perempuan itu mendekat dan membuatnya berdiri di hadapan Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH.” Nama ini secara tradisional diterjemahkan “TUHAN”; dalam terjemahan ini ditransliterasikan “Yahweh.”'
    reason: Menjelaskan bentuk nama ilahi dalam bahasa Ibrani, kebiasaan penerjemahan tradisional, dan pilihan transliterasi yang digunakan dalam teks utama.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: membawa perempuan itu mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau menghadapkan. Pilihan ini mempertahankan nuansa ruang dalam bahasa Ibrani tanpa menjadikannya istilah teknis persembahan.
- source_word: אֹתָהּ
  choice: perempuan itu
  rationale: Penanda objek langsung dengan akhiran orang ketiga feminin tunggal merujuk kepada perempuan dalam konteks sebelumnya. Penyebutan nomina lebih jelas dan alami dalam bahasa Indonesia daripada hanya memakai pronomina objek.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כֹּהֵן dalam konteks hukum dan peribadatan Israel.
- source_word: וְהֶעֱמִדָהּ
  choice: membuatnya berdiri
  rationale: Bentuk Hifil dari עמד bersifat kausatif, yaitu membuat atau menyebabkan seseorang berdiri. Pilihan ini mempertahankan daya kausatif teks sumber.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini menyatakan posisi di depan sekaligus dalam kehadiran seseorang; 'di hadapan' merupakan padanan Indonesia yang ringkas dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sambil memberi catatan tentang bentuk Ibrani dan tradisi penerjemahannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi dalam teks utama, sedangkan kebiasaan menerjemahkannya sebagai 'TUHAN' dijelaskan dalam catatan kaki tanpa memaksakan penyelesaian atas perbedaan tradisi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan dua tindakan kausatif imam serta hubungan ruang dan kehadiran yang dinyatakan oleh teks Ibrani.
