  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: id
  text: Maka orang Israel melakukan demikian. Mereka menyuruh orang-orang itu pergi ke luar perkemahan. Tepat seperti yang difirmankan Yahweh kepada Musa, demikianlah orang Israel melakukannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Maka ... melakukannya
  rationale: Ungkapan עשה + כן menyatakan bahwa perintah sebelumnya dilaksanakan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan kesinambungan narasi melalui “Maka”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak Israel,” tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” merupakan padanan Indonesia modern yang jelas dan wajar.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: Mereka menyuruh orang-orang itu pergi
  rationale: Kata שׁלח di sini menyatakan tindakan menyuruh atau mengirim orang-orang yang dimaksud supaya meninggalkan perkemahan. Frasa ini mempertahankan tindakan aktif tanpa menambahkan gagasan yang tidak tersurat.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Padanan langsung dan alami bagi arah pemindahan menuju tempat di luar batas perkemahan.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: Tepat seperti yang difirmankan
  rationale: כַּאֲשֶׁר menekankan kesesuaian tindakan Israel dengan perkataan ilahi sebelumnya. “Difirmankan” sesuai dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi dipertahankan sebagai “Yahweh,” bukan diganti dengan gelar.
- source_word: כֵּן עָשׂוּ
  choice: demikianlah dilakukan
  rationale: Pengulangan penutup dalam bahasa Ibrani dipertahankan untuk menegaskan ketaatan Israel, meskipun isinya mengulang pernyataan pembuka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama diri ilahi. Bentuk “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Pengulangan yang menekankan ketaatan Israel
  choice: Mempertahankan pernyataan pembuka dan penutup
  alternative: Meringkasnya menjadi satu pernyataan
  rationale: Struktur Ibrani sengaja mengapit tindakan pengusiran dengan dua pernyataan bahwa Israel melaksanakan perintah. Pengulangan itu dipertahankan agar tekanannya tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar mudah dibaca, sementara hubungan naratif, arah tindakan, nama ilahi, dan pengulangan penegas pada akhir ayat tetap dipertahankan.
