  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: id
  text: Lalu imam harus membuat perempuan itu meminum air pahit yang mendatangkan kutuk itu, dan air yang mendatangkan kutuk itu akan masuk ke dalam dirinya sehingga menimbulkan kepahitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan air yang mendatangkan kutuk itu akan masuk ke dalam dirinya untuk kepahitan.” Bahasa Ibrani memakai bentuk jamak untuk “air”, sebagaimana lazim dalam bahasa Ibrani.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: Lalu imam harus membuat ... meminum
  rationale: Bentuk Hifil dari שׁקה menyatakan tindakan menyebabkan atau memberi seseorang minum. Subjek 'imam' dipulihkan dari konteks terdekat agar bahasa Indonesia jelas dan alami.
- source_word: מֵי הַמָּרִים
  choice: air pahit
  rationale: Frasa konstruksi ini secara harfiah berarti 'air kepahitan'. 'Air pahit' lebih alami dalam bahasa Indonesia dan tetap mempertahankan sifat air tersebut.
- source_word: הַמְאָרֲרִים
  choice: yang mendatangkan kutuk
  rationale: Partisip dari ארר dipahami sebagai penjelasan tentang air yang membawa atau menghasilkan kutuk dalam ritual ini, bukan sekadar air yang telah dikutuk.
- source_word: וּבָאוּ בָהּ
  choice: akan masuk ke dalam tubuhnya
  rationale: בוא dengan ב menyatakan masuk ke dalam perempuan itu. Penambahan 'tubuh' memperjelas maksud ungkapan dalam bahasa Indonesia tanpa menentukan akibat fisiologis tertentu.
- source_word: לְמָרִים
  choice: sehingga menimbulkan kepahitan
  rationale: לְ dapat menyatakan hasil atau akibat. Terjemahan ini mempertahankan istilah 'kepahitan' dan tidak mempersempitnya menjadi gejala jasmani tertentu.
theological_decisions:
- issue: Sifat kutuk yang berkaitan dengan air dalam ritual
  choice: Air digambarkan sebagai 'yang mendatangkan kutuk'.
  alternative: air terkutuk
  rationale: Partisip Ibrani lebih wajar menggambarkan fungsi air sebagai pembawa kutuk dalam pengujian ini. Pilihan ini menghindari kesan bahwa air tersebut secara intrinsik bersifat magis, sambil tetap mempertahankan daya hukum-ritual kutuk itu.
- issue: Makna akibat akhir לְמָרִים
  choice: sehingga menimbulkan kepahitan
  alternative: dengan pahit / menjadi pahit
  rationale: Ungkapan Ibrani padat dan dapat menunjuk pada hasil yang berupa kepahitan atau penderitaan. Terjemahan utama mempertahankan ketegangan itu tanpa menjelaskan bentuk akibatnya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'yang mendatangkan kutuk' dipertahankan karena terdapat dalam teks Ibrani dan menegaskan fungsi ritual air tersebut.
