id: NUM.5.29
reference: Numbers 5:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: id
  text: Inilah hukum tentang kecemburuan[a], ketika seorang istri menyimpang sementara ia terikat kepada suaminya[b], lalu menjadi najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kecemburuan-kecemburuan”; bentuk jamak Ibraninya tampaknya berfungsi sebagai sebutan teknis bagi tata hukum ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di bawah suaminya,” suatu ungkapan tentang ikatan atau status perkawinan.
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Inilah hukum tentang
  rationale: Rumus penutup hukum ini diperkenalkan secara alami dalam bahasa Indonesia dengan “Inilah hukum tentang,” sambil mempertahankan fungsi yuridis תּוֹרָה.
- source_word: הַקְּנָאֹת
  choice: kecemburuan
  rationale: Bentuk Ibrani ini jamak, tetapi di sini tampaknya menjadi sebutan teknis bagi tata hukum yang berkaitan dengan kecemburuan; bentuk tunggal lebih wajar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: אֲשֶׁר תִּשְׂטֶה אִשָּׁה
  choice: ketika seorang istri menyimpang
  rationale: אֲשֶׁר memperkenalkan keadaan yang dicakup hukum ini. “Menyimpang” mempertahankan metafora שׂטה mengenai ketidaksetiaan tanpa mempersempitnya menjadi istilah eksplisit untuk perzinaan.
- source_word: תַּחַת אִישָׁהּ
  choice: sementara ia terikat kepada suaminya
  rationale: Terjemahan ini menyampaikan idiom harfiah “di bawah suaminya” sebagai keadaan berada dalam ikatan perkawinan, bukan sebagai lokasi fisik atau penggantian.
- source_word: וְנִטְמָאָה
  choice: lalu menjadi najis
  rationale: “Menjadi najis” mempertahankan bahasa kenajisan dalam verba Niphal dan tidak menafsirkannya semata-mata sebagai kenajisan ritual ataupun menggantinya dengan tuduhan eksplisit berzina.
theological_decisions:
- issue: Sifat kenajisan dalam hukum mengenai istri yang dicurigai tidak setia
  choice: menjadi najis
  alternative: berzina; mencemarkan diri
  rationale: Konteksnya menyangkut ketidaksetiaan seksual, tetapi teks memakai bahasa kenajisan. Terjemahan mempertahankan kategori teks dan ketegangannya tanpa mengubahnya menjadi tuduhan yang lebih eksplisit.
- issue: Makna idiom תַּחַת אִישָׁהּ
  choice: sementara ia terikat kepada suaminya
  alternative: di bawah suaminya; di bawah kekuasaan suaminya
  rationale: Ungkapan ini dipahami sebagai ikatan atau status perkawinan. “Terikat kepada” menghindari kesan spasial dari terjemahan harfiah dan tidak mempersempit maknanya hanya pada kekuasaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Inilah hukum tentang” cocok untuk rumus ringkasan legal; “menyimpang” dan “menjadi najis” mempertahankan metafora serta istilah teologis sumber tanpa penjelasan berlebihan di dalam ayat.
