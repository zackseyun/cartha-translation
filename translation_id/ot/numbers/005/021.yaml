language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: id
  text: Kemudian imam harus membuat perempuan itu bersumpah dengan sumpah kutuk[a]. Imam harus berkata kepada perempuan itu, “Kiranya Yahweh menjadikan engkau suatu kutuk dan sumpah di tengah-tengah bangsamu[b], ketika Yahweh membuat pahamu menyusut[c] dan perutmu membengkak[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sumpah kutuk” ialah sumpah yang disertai kutuk.
    reason: clarification
  - marker: b
    text: 'Ungkapan ini dapat dipahami secara idiomatis: engkau akan menjadi contoh yang disebut orang ketika mengutuk atau bersumpah.'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “pahamu jatuh.” Ungkapan Ibrani ini sulit; mungkin menggambarkan paha yang menyusut atau layu, atau menjadi eufemisme yang berkaitan dengan organ reproduksi.
    reason: lexical_alternative
  - marker: d
    text: Kata yang diterjemahkan “perut” juga dapat berarti “rahim”. Dampak jasmani atau reproduktif yang dimaksud oleh kutuk ini diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: menyuruh ... bersumpah
  rationale: 'Bentuk hifil dari שׁבע bersifat kausatif: imam menyebabkan perempuan itu mengucapkan sumpah. Ungkapan ini jelas dan alami dalam bahasa Indonesia serta mempertahankan nuansa hukum-ritual.'
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: dengan sumpah kutuk
  rationale: Frasa konstruksi ini menggabungkan 'sumpah' dan 'kutuk'. Pilihan ini mempertahankan kedua unsur dengan susunan Indonesia yang ringkas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: suatu kutuk dan sumpah
  rationale: Terjemahan ini dekat dengan bentuk Ibrani dan mempertahankan rumusan ritual, sedangkan fungsi idiomatisnya sebagai contoh yang disebut dalam kutukan dijelaskan dalam catatan kaki.
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: di tengah-tengah bangsamu
  rationale: Mempertahankan dimensi komunal dan publik dari ungkapan Ibrani.
- source_word: בְּתֵת
  choice: ketika ... membuat
  rationale: Infinitif dengan ב dipahami sebagai penanda keadaan atau waktu; bentuk ini alami dalam bahasa Indonesia tanpa menghilangkan hubungan dengan tindakan Yahweh.
- source_word: יְרֵךְ
  choice: paha
  rationale: Makna dasarnya ialah paha atau bagian atas tungkai, meskipun kata ini kadang dipakai sebagai eufemisme bagi organ reproduksi. Terjemahan utama tidak mempersempit maknanya.
- source_word: נֹפֶלֶת
  choice: menyusut
  rationale: Secara harfiah bentuk ini berasal dari kata 'jatuh', tetapi dalam konteks kutuk tampaknya menggambarkan kemerosotan, pelayuan, atau penyusutan anggota tubuh. 'Menyusut' dapat dipahami pembaca modern tanpa menetapkan diagnosis tertentu.
- source_word: בִּטְנֵךְ
  choice: perutmu
  rationale: בטן dapat berarti perut, bagian dalam perut, atau rahim. 'Perut' adalah padanan umum yang tidak secara dini membatasi rujukannya pada rahim.
- source_word: צָבָה
  choice: membengkak
  rationale: Kata ini menggambarkan pembengkakan atau penggelembungan. 'Membengkak' alami dan tepat untuk gambaran fisik dalam rumusan kutuk.
theological_decisions:
- issue: Seberapa khusus dampak jasmani kutuk ini harus diterjemahkan
  choice: Mempertahankan gambaran tubuh sebagai paha yang menyusut dan perut yang membengkak, tanpa menyatakannya secara khusus sebagai keguguran atau kemandulan.
  alternative: Menerjemahkannya secara khusus sebagai rahim yang gugur, keguguran, atau hilangnya kesuburan.
  rationale: Bahasa Ibraninya sulit dan diperdebatkan. Pilihan utama mempertahankan ketegangan serta ketidakpastian teks dan tidak memasukkan diagnosis medis atau reproduktif yang tidak dinyatakan secara tegas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Struktur ritual dipertahankan, tetapi kalimat panjang dibagi dua agar mudah dipahami. Istilah tubuh diterjemahkan secara konkret tanpa menetapkan tafsiran medis atau denominasi tertentu.
