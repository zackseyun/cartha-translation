  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: id
  text: Ketika imam menyuruh perempuan itu meminum air tersebut, jika ia memang telah menajiskan dirinya dan berlaku tidak setia terhadap suaminya, air yang mendatangkan kutuk itu akan masuk ke dalam dirinya dan menjadi pahit[a]; perutnya akan membengkak dan pahanya akan merosot[b]. Perempuan itu akan menjadi kutuk di tengah-tengah bangsanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “air yang mendatangkan kutuk itu akan masuk ke dalam dirinya untuk mendatangkan kepahitan.” Ungkapan Ibraninya sulit dan dapat menggambarkan akibat ataupun sifat air tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pahanya akan jatuh.” Ungkapan ini mungkin merupakan bahasa halus untuk penderitaan berat yang memengaruhi organ reproduksinya, tetapi arti tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Sesudah imam menyuruh perempuan itu meminum air tersebut
  rationale: Bentuk Hifil menyatakan tindakan kausatif, yaitu menyuruh atau membuat seseorang minum. Hubungan dengan akibat berikutnya dinyatakan secara temporal; subjek 'imam' dan objek 'perempuan itu' diperjelas dari konteks dekat.
- source_word: נִטְמְאָה
  choice: telah menajiskan dirinya
  rationale: Pilihan ini mempertahankan unsur kenajisan moral dan ritual dalam konteks dugaan perzinaan, tanpa membatasinya hanya pada salah satu ranah.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: berlaku tidak setia terhadap suaminya
  rationale: Konstruksi serumpun dari מעל menekankan pelanggaran kesetiaan; ungkapan Indonesia ini alami dan mempertahankan dimensi pengkhianatan relasional.
- source_word: וּבָאוּ בָהּ הַמַּיִם הַמְאָרֲרִים
  choice: air yang mendatangkan kutuk itu akan masuk ke dalam dirinya
  rationale: Partisip dari ארר menggambarkan air sebagai pembawa atau pelaksana kutuk, sedangkan בוא dengan ב menyatakan masuk ke dalam tubuhnya.
- source_word: לְמָרִים
  choice: dan menimbulkan kepahitan
  rationale: Frasa Ibrani ini sulit dan dapat menyatakan akibat atau sifat air. Terjemahan utama membacanya secara resultatif sambil mempertahankan alternatif dalam catatan kaki.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: perutnya akan membengkak
  rationale: בטן secara langsung berarti perut atau bagian perut. Pilihan ini tidak mempersempit maknanya menjadi rahim.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: pahanya akan menyusut
  rationale: Secara harfiah ungkapan ini berbunyi 'pahanya akan jatuh', tetapi kemungkinan merupakan ungkapan halus tentang penderitaan tubuh, mungkin pada organ reproduksi. 'Menyusut' dapat dipahami dalam bahasa Indonesia tanpa memastikan anatomi atau diagnosis tertentu.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: Perempuan itu akan menjadi kutuk di tengah-tengah bangsanya
  rationale: Terjemahan ini mempertahankan gagasan bahwa perempuan tersebut menjadi contoh atau rumusan kutuk dalam komunitasnya.
theological_decisions:
- issue: Makna tepat penderitaan tubuh dalam rumusan ujian ini
  choice: Mempertahankan gambaran 'perutnya akan membengkak dan pahanya akan menyusut'
  alternative: Rahimnya akan gugur; organ kelaminnya akan mengerut; atau terjemahan harfiah 'pahanya akan jatuh'
  rationale: Bahasa Ibrani konkret tetapi sebagian bersifat eufemistis, dan rujukan fisiologisnya tidak pasti. Teks utama tidak menetapkan keguguran, kemandulan, atau diagnosis khusus.
- issue: Fungsi לְמָרִים
  choice: 'Membacanya sebagai akibat: ''menimbulkan kepahitan'''
  alternative: Air itu masuk sebagai air pahit, atau masuk untuk mendatangkan penderitaan pahit
  rationale: Bentuk tersebut dapat menunjuk pada kualitas maupun efek. Catatan kaki menjaga ketidakpastian leksikal itu agar tidak diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur kalimat disederhanakan secukupnya, tetapi urutan syarat dan akibat serta ketidakpastian dua ungkapan Ibrani utama tetap dipertahankan.
