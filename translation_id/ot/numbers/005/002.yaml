  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: id
  text: Perintahkanlah orang Israel agar mereka mengeluarkan dari perkemahan setiap orang yang menderita penyakit kulit[a], setiap orang yang mengalami cairan keluar dari tubuh, dan setiap orang yang najis karena mayat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap orang yang terkena kusta.” Istilah Ibrani ini mencakup berbagai gangguan kulit serius dalam hukum kemurnian ritual dan tidak selalu menunjuk pada penyakit Hansen.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “najis karena seorang/jiwa.” Dalam hukum Taurat, ungkapan ini menunjuk pada kenajisan yang berkaitan dengan mayat manusia.
    reason: idiom_explanation
lexical_decisions:
- source_word: צַו
  choice: Perintahkanlah
  rationale: Bentuk imperatif tunggal yang ditujukan kepada Musa menuntut perintah tegas; bentuk ini tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel; 'orang Israel' menyampaikan fungsi idiomatisnya secara alami tanpa membatasi perintah hanya kepada laki-laki.
- source_word: וִישַׁלְּחוּ
  choice: agar mereka menyuruh keluar
  rationale: Verba שלח di sini menyatakan tindakan mengeluarkan atau menyuruh pergi dari perkemahan. Ungkapan ini mempertahankan pelaku jamak dan tidak menambahkan nuansa hukuman yang tidak dinyatakan.
- source_word: מִן הַמַּחֲנֶה
  choice: dari perkemahan
  rationale: Menunjukkan gerak keluar dari kawasan tempat umat berkemah; 'perkemahan' adalah padanan alami bagi מַחֲנֶה dalam konteks perjalanan Israel.
- source_word: כָּל צָרוּעַ
  choice: setiap orang yang menderita penyakit kulit
  rationale: צָרוּעַ menunjuk pada orang yang terkena צָרַעַת dalam hukum kenajisan. Istilah itu mencakup gangguan kulit serius dan tidak dapat begitu saja disamakan dengan penyakit Hansen modern.
- source_word: וְכָל זָב
  choice: setiap orang yang mengeluarkan lelehan tubuh
  rationale: זָב adalah orang yang mengalami keluarnya cairan tubuh dalam konteks hukum kemurnian. Penambahan 'tubuh' memperjelas maksud tanpa menentukan jenis cairan lebih jauh daripada teks.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: setiap orang yang najis karena mayat
  rationale: Dalam hukum Taurat, frasa ini merupakan idiom bagi kenajisan yang berkaitan dengan mayat manusia. 'Karena mayat' ringkas, alami, dan mempertahankan fokus pada status ritual.
theological_decisions:
- issue: Makna kenajisan dalam frasa טָמֵא לָנָפֶשׁ
  choice: najis karena mayat
  alternative: cemar karena menyentuh jenazah
  rationale: '''Najis'' di sini menyatakan status ritual dalam kaitannya dengan kekudusan perkemahan, bukan penilaian bahwa orang itu secara moral berdosa. Terjemahan tidak menambahkan tindakan ''menyentuh'', sebab ayat ini sendiri hanya menyatakan hubungan dengan mayat.'
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Ungkapan Ibrani ini berfungsi secara korporat bagi bangsa perjanjian dalam perintah yang pelaksanaannya menyangkut seluruh perkemahan. Padanan idiomatis menghindari kesan teologis yang keliru bahwa hanya laki-laki Israel yang diperintah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur tiga kelompok dipertahankan agar irama hukum sumber tetap terasa. Istilah 'najis' digunakan dalam arti ritual, sedangkan penjelasan kaki mencegah pembaca memahami istilah penyakit kulit secara terlalu sempit.
