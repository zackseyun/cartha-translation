    issue: “menyuruh keluar” untuk וְשַׁלְּחוּ
    rationale: Ungkapan ini dapat berarti menyuruh orang lain melakukan pengeluaran atau menyuruh mereka pergi. Dalam ayat ini subjek “orang Israel” melakukan pengeluaran dari perkemahan; “mengeluarkan” menyampaikan tindakan tersebut secara langsung.
  - severity: medium
    issue: “yang mengeluarkan lelehan tubuh” untuk זָב
    rationale: Terjemahan tersebut memberi kesan tindakan aktif dan memakai kolokasi yang tidak alami. Istilah sumber menyatakan seseorang yang mengalami keluarnya cairan tubuh dalam konteks kenajisan ritual.
  - severity: low
    issue: Rumusan catatan kaki a
    rationale: “Dalam hukum kenajisan” kurang presisi sebagai konteks. “Dalam hukum kemurnian ritual” lebih jelas dan menghindari kesan bahwa istilah itu sendiri hanya sebuah kategori penyakit medis.
