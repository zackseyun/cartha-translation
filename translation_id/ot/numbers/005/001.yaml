base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”. Bentuk lain ialah “Yehuwa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu … berfirman
  rationale: Bentuk wayyiqtol membuka peristiwa tutur berikutnya dalam alur narasi. “Lalu” menyatakan kelanjutan narasi, sedangkan “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat untuk דבר ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Kata depan ini menandai pihak yang menerima firman; “kepada” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama tersebut menggunakan bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dalam rumus pengantar perkataan Ibrani ini, fungsi לֵאמֹר ialah memperkenalkan ucapan langsung yang menyusul. Tanda titik dua menyampaikan fungsi itu secara alami tanpa ungkapan Indonesia yang kaku seperti “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu dalam bentuk alih aksara yang umum, sementara catatan kaki memberi tahu pembaca tentang tradisi penggantian dengan gelar dan bentuk alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Rumus tutur Ibrani disampaikan secara alami dengan “berfirman” dan titik dua sebagai pengantar ucapan langsung pada ayat berikutnya.
