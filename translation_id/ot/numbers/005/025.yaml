  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: id
  text: Kemudian imam harus mengambil dari tangan perempuan itu persembahan sajian kecemburuan. Ia harus mengayunkan persembahan sajian itu di hadapan Yahweh, lalu membawanya mendekat ke mazbah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Bentuk waw + qatal melanjutkan urutan prosedur ritual; 'kemudian' dan 'harus' menyampaikan langkah berikut yang diwajibkan secara wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi pejabat kultis; ketakrifan sudah jelas dari konteks dan konstruksi kalimat Indonesia.
- source_word: מִיַּד הָאִשָּׁה
  choice: dari tangan perempuan itu
  rationale: Mempertahankan gambaran konkret bahwa imam menerima persembahan langsung dari tangan perempuan tersebut.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: persembahan sajian karena kecemburuan
  rationale: מִנְחָה menunjuk persembahan berbahan hasil tanaman dalam konteks keimaman, sedangkan bentuk jamak abstrak הַקְּנָאֹת menunjuk perkara atau keadaan kecemburuan yang melatarbelakangi ritual. 'Karena kecemburuan' lebih alami daripada 'dari kecemburuan' tanpa menghapus kaitan genitifnya.
- source_word: וְהֵנִיף
  choice: harus mengayunkan
  rationale: Hifil dari נוף dalam konteks korban menunjuk tindakan ritual mengayunkan persembahan; pilihan ini mempertahankan tindakan fisiknya.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Padanan alami bagi ungkapan kultis yang berarti di hadapan atau dalam kehadiran Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagaimana tampil langsung dalam teks Ibrani.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: lalu membawanya mendekati mazbah
  rationale: Hifil קרב secara harfiah menyatakan tindakan membawa sesuatu mendekat. Rumusan ini mempertahankan nuansa kultis dan preposisi אֶל tanpa menyiratkan bahwa persembahan itu sudah dibakar pada tahap ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memuat Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna מִנְחַת הַקְּנָאֹת
  choice: persembahan sajian karena kecemburuan
  alternative: persembahan sajian kecemburuan
  rationale: Konstruksi Ibrani dapat dipahami sebagai nama ritual yang berkaitan dengan kecemburuan. 'Karena kecemburuan' terdengar alami dalam bahasa Indonesia sekaligus tidak menentukan secara sempit apakah kecemburuan itu dibenarkan atau tidak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'persembahan sajian' dipakai untuk מִנְחָה dan 'mazbah' dipertahankan sebagai istilah kultis yang ringkas serta lazim dalam bahasa Alkitab Indonesia. Pengulangan 'persembahan sajian' mengikuti penegasan leksikal teks Ibrani.
