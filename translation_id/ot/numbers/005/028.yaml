  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: id
  text: Namun, jika perempuan itu tidak menajiskan dirinya dan ia tahir, ia akan dinyatakan tidak bersalah dan akan mengandung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “akan ditaburi benih,” suatu ungkapan yang menunjuk pada pembuahan atau kehamilan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Konjungsi bersyarat ini memperkenalkan keadaan yang berlawanan dengan akibat dalam ayat sebelumnya; “Namun, jika” menyampaikan pertentangan kontekstual tersebut secara alami.
- source_word: לֹא נִטְמְאָה הָאִשָּׁה
  choice: perempuan itu tidak menajiskan dirinya
  rationale: Bentuk Nifal dari טמא dapat berarti menjadi najis atau tercemar. Dalam konteks dugaan perzinaan, ungkapan ini menunjuk pada kenajisan seksual-moral dan wajar dinyatakan secara refleksif dalam bahasa Indonesia.
- source_word: וּטְהֹרָה הִוא
  choice: dan ia tahir
  rationale: טָהוֹר berarti bersih atau tahir. “Tahir” mempertahankan nuansa kemurnian ritual-moral dalam konteks Taurat tanpa menyatakan lebih dari teks.
- source_word: וְנִקְּתָה
  choice: ia akan dinyatakan bebas
  rationale: Nifal dari נקה mencakup arti bebas, lepas, atau dinyatakan tidak bersalah. “Dinyatakan bebas” menyampaikan pembebasan dari tuduhan dan akibat hukuman tanpa mempersempitnya menjadi istilah ruang sidang modern.
- source_word: וְנִזְרְעָה זָרַע
  choice: dan ia akan mengandung keturunan
  rationale: Secara harfiah, ungkapan ini berarti “akan ditaburi benih” dan merupakan bahasa idiomatis tentang pembuahan atau memperoleh keturunan. Terjemahan ini mempertahankan pernyataan langsung teks tanpa menambahkan gagasan “akan mampu” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Sifat hasil yang dijanjikan sesudah perempuan itu terbukti tidak bersalah
  choice: Perempuan itu dibebaskan dan akan mengandung keturunan.
  alternative: Perempuan itu hanya dinyatakan tetap subur atau akan mampu mengandung.
  rationale: Ungkapan Ibrani וְנִזְרְעָה זָרַע paling langsung menunjuk pada pembuahan atau kehamilan. Terjemahan tidak menambahkan modalitas kemampuan, tetapi catatan kaki mempertahankan gambaran harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tahir” dipakai untuk menjaga nuansa ritual-moral kitab Bilangan; struktur kalimat dibuat jelas bagi pembaca umum. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
