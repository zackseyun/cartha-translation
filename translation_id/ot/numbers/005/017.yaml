translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat, dengan corak instruksi ritual. 'Kemah Suci' dipakai sebagai padanan מִשְׁכָּן yang mudah dipahami. Semua alternatif bermakna yang relevan dipertahankan dalam catatan kaki.
