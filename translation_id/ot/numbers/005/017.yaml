  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: id
  text: Kemudian imam harus mengambil air kudus[a] dalam sebuah wadah tanah liat[b]. Imam itu harus mengambil sebagian dari debu yang ada di lantai Kemah Suci[c], lalu memasukkannya ke dalam air itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “air suci”, yaitu air yang dikhususkan untuk penggunaan ritual.
    reason: lexical_alternative
  - marker: b
    text: Atau “bejana tembikar”.
    reason: lexical_alternative
  - marker: c
    text: Atau “tanah Kemah Suci”. Kata Ibraninya dapat berarti “tanah” atau “lantai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: air kudus
  rationale: Secara langsung menyatakan air yang dikhususkan sebagai kudus untuk penggunaan ritual; catatan kaki mencegah asosiasi gerejawi yang lebih kemudian menguasai konteks ini.
- source_word: בִּכְלִי חָרֶשׂ
  choice: dalam sebuah wadah tanah liat
  rationale: כְּלִי adalah wadah atau bejana, sedangkan חָרֶשׂ menunjuk pada bahan tanah liat atau tembikar. Ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִן הֶעָפָר
  choice: sedikit debu
  rationale: 'עָפָר mencakup debu atau tanah gembur, dan מִן di sini bersifat partitif: imam mengambil sebagian, bukan seluruh debu.'
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: di lantai Kemah Suci
  rationale: קַרְקַע dapat berarti tanah atau lantai. Dalam ruang Kemah Suci, 'lantai' menyampaikan permukaan bagian dalam secara alami, sementara alternatifnya tetap dicatat.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: harus mengambil ... harus mengambil ... lalu memasukkannya
  rationale: Rangkaian bentuk verba ini menyampaikan petunjuk ritual yang diwajibkan. 'Harus' cocok bagi bahasa Indonesia prosedural, dan נָתַן אֶל secara kontekstual berarti memasukkan ke dalam air.
- source_word: הַמָּיִם
  choice: air itu
  rationale: Artikel menunjuk kembali kepada air kudus yang baru disebut; 'air itu' memberikan rujukan anaforis yang jelas.
