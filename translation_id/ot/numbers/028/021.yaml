  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: id
  text: Haruslah kamu menyiapkan sepersepuluh efa[a] untuk setiap anak domba, untuk ketujuh anak domba itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “sepersepuluh, sepersepuluh harus kamu siapkan untuk anak domba yang satu, untuk ketujuh anak domba itu.” Pengulangan tersebut menyatakan makna distributif: satu bagian sepersepuluh untuk setiap anak domba. Dalam konteks ini, satuan itu dipahami sebagai sepersepuluh efa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: untuk setiap ... sepersepuluh efa
  rationale: Pengulangan bentuk tunggal menyatakan pembagian distributif, yaitu satu bagian sepersepuluh bagi masing-masing anak domba. Dalam konteks kurban sajian, satuan yang dimaksud secara konvensional adalah sepersepuluh efa.
- source_word: תַּעֲשֶׂה
  choice: haruslah kamu menyiapkan
  rationale: Secara harfiah berarti 'membuat/melakukan'; dalam petunjuk persembahan, 'menyiapkan' menyampaikan tindakan yang diperintahkan tanpa mempersempit maknanya menjadi 'mempersembahkan'.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk setiap anak domba
  rationale: Bentuk tunggal dengan artikel dan bilangan, bersama pengulangan distributif sebelumnya, menunjuk pada jatah bagi masing-masing hewan.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: dari ketujuh anak domba itu
  rationale: Frasa ini mengidentifikasi seluruh kelompok tujuh anak domba yang masing-masing menerima takaran tersebut; susunan ini alami dalam bahasa Indonesia.
