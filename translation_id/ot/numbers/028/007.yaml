source:
  edition: WLC
  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: id
  text: Persembahan curahannya haruslah seperempat hin untuk setiap anak domba.[a] Di tempat kudus[b] haruslah kamu mencurahkan minuman memabukkan[c] sebagai persembahan curahan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk seekor anak domba”; secara harfiah, “untuk anak domba yang satu itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di dalam tempat suci.”
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah minuman memabukkan selain anggur; jenisnya tidak disebutkan secara pasti.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: Persembahan curahannya haruslah
  rationale: Kata נִסְכּוֹ menunjuk pada persembahan cair yang menyertai kurban, sedangkan sufiks orang ketiga tunggalnya dipertahankan dengan bentuk -nya. Istilah “persembahan curahan” jelas dan sesuai dengan tindakan menuangkan cairan dalam ibadah.
- source_word: רְבִיעִת הַהִין
  choice: seperempat hin
  rationale: Ungkapan ini menyatakan takaran yang tepat. Satuan kuno “hin” dipertahankan agar teks sumber tetap transparan dan tidak diberi konversi yang belum tentu pasti.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk setiap anak domba
  rationale: Secara harfiah berarti “untuk anak domba yang satu itu.” Dalam konteks dua anak domba pada persembahan harian, frasa ini menyatakan jumlah bagi masing-masing anak domba; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בַּקֹּדֶשׁ
  choice: Di tempat kudus
  rationale: Dalam konteks peribadatan, frasa ini paling wajar menunjuk pada kawasan atau tempat yang dikhususkan sebagai kudus. “Tempat kudus” mempertahankan bentuk sumber tanpa mempersempitnya secara berlebihan menjadi bangunan tertentu.
- source_word: הַסֵּךְ
  choice: haruslah kamu mencurahkan
  rationale: Bentuk ini memerintahkan tindakan menuangkan persembahan cair. Susunan “haruslah kamu” menyampaikan daya perintah dengan ragam Indonesia yang wajar dan bermartabat.
- source_word: נֶסֶךְ
  choice: sebagai persembahan curahan
  rationale: Nomina נֶסֶךְ diungkapkan secara eksplisit dan dibedakan dari cairan yang dicurahkan. Kata “sebagai” memperjelas fungsi cairan itu tanpa mengubah isi perintah.
- source_word: שֵׁכָר
  choice: minuman memabukkan
  rationale: שֵׁכָר menunjuk pada minuman beralkohol atau memabukkan selain anggur, tetapi jenis persisnya tidak disebutkan. Pilihan ini menghindari penentuan yang terlalu khusus seperti “bir”.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menunjukkan bahwa persembahan itu ditujukan atau diperuntukkan bagi Yahweh. “Bagi” terdengar alami dalam konteks persembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna בַּקֹּדֶשׁ dalam konteks ibadah
  choice: Di tempat kudus
  alternative: Di dalam tempat suci; dalam kekudusan
  rationale: Konteks persembahan mendukung pengertian lokatif, tetapi cakupan tepat tempat itu tidak diperinci. Karena itu, “tempat kudus” dipilih tanpa mengidentifikasikannya secara lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam perintah yang khidmat tetapi mudah dipahami. Istilah teknis “hin” dipertahankan sebagai satuan kuno, sedangkan “persembahan curahan” digunakan secara konsisten untuk istilah kultis נֶסֶךְ.
