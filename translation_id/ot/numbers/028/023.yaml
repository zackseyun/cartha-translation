  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: id
  text: Di samping persembahan bakaran pagi yang tetap, persembahkanlah semuanya ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: Di samping
  rationale: Menandai bahwa kurban-kurban hari raya ini dipersembahkan sebagai tambahan atas persembahan yang tetap.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: persembahan bakaran pagi yang tetap
  rationale: Frasa relatif ini mengidentifikasi persembahan pagi sebagai bagian dari persembahan bakaran tetap, bukan sebagai persembahan yang dilakukan untuk persembahan lain. Bentuk ringkas ini alami dalam bahasa Indonesia dan sesuai dengan konteks persembahan harian.
- source_word: תַּעֲשׂוּ
  choice: persembahkanlah
  rationale: Dalam konteks petunjuk kurban, verba 'melakukan/membuat' secara idiomatis berarti mempersembahkan.
- source_word: אֶת אֵלֶּה
  choice: semuanya ini
  rationale: Merujuk kepada seluruh persembahan yang baru saja ditetapkan; ungkapan ini wajar dan jelas dalam bahasa Indonesia.
