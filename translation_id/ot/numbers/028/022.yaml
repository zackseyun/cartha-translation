  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: id
  text: dan seekor kambing jantan sebagai kurban penghapus dosa[a] untuk mengadakan pendamaian bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban penyucian dari dosa.” Istilah Ibrani yang diterjemahkan “kurban penghapus dosa” dalam konteks persembahan juga dapat dipahami sebagai “kurban penyucian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: dan seekor kambing jantan
  rationale: שָׂעִיר menunjuk pada kambing jantan; וּ diterjemahkan “dan,” sedangkan אֶחָד diwujudkan secara alami melalui penggolong bilangan “seekor” dalam bahasa Indonesia.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks ritual persembahan, חַטָּאת menunjuk pada kurban, bukan sekadar konsep dosa. Ungkapan ini jelas dan lazim dalam bahasa Indonesia, sementara kemungkinan makna kurban penyucian dicatat dalam catatan kaki.
- source_word: לְ/כַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: כפר dalam konteks imamat menyatakan tindakan ritual pendamaian. Pilihan ini mempertahankan bobot teologisnya tanpa menentukan teori tertentu tentang cara pendamaian itu bekerja.
- source_word: עֲלֵי/כֶם
  choice: bagi kalian
  rationale: עַל dengan sufiks orang kedua jamak di sini menyatakan manfaat atau tindakan atas nama umat. “Bagi kalian” alami dan mempertahankan bentuk jamaknya.
theological_decisions:
- issue: Penerjemahan istilah ritual כפר
  choice: untuk mengadakan pendamaian bagi kalian
  alternative: untuk mendamaikan kalian; untuk mengadakan penebusan bagi kalian
  rationale: “Mengadakan pendamaian” mempertahankan cakupan luas bahasa ritual Ibrani dan tidak mempersempit mekanismenya kepada suatu rumusan doktrinal tertentu.
- issue: Makna חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban penyucian
  rationale: Terjemahan utama memakai istilah yang mudah dikenali pembaca dan sesuai dengan fungsi kurban dalam konteks ini, tetapi kemungkinan nuansa penyucian tetap dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk menampilkan dengan jelas bahwa sufiks Ibrani berbentuk jamak. Susunan kalimat dibuat ringkas sesuai bentuk daftar persembahan dalam konteks pasal.
