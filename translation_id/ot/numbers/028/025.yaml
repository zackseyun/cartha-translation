translation:
  language: id
  text: Pada hari ketujuh harus ada pertemuan kudus bagi kamu[a]. Kamu tidak boleh melakukan pekerjaan biasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pertemuan suci” atau “perhimpunan kudus.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pekerjaan kerja/pelayanan”; yaitu pekerjaan rutin atau pekerjaan untuk mata pencaharian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Ungkapan ini menyatakan waktu. Kata sambung וּ tidak perlu diterjemahkan tersendiri karena bahasa Indonesia secara alami dapat memulai kalimat dengan keterangan waktu.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Ungkapan kultis ini menunjuk pada pertemuan suci yang diserukan secara resmi. 'Pertemuan kudus' alami dan mudah dipahami, sementara nuansa alternatifnya dicatat dalam catatan kaki.
- source_word: יִהְיֶה לָכֶם
  choice: kamu harus mengadakan
  rationale: Secara harfiah berarti 'akan menjadi bagimu'; dalam konteks ketetapan, bentuk ini secara wajar menyatakan kewajiban untuk menyelenggarakan pertemuan tersebut.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan sehari-hari
  rationale: Dalam konstruksi negatif, כָּל berarti 'apa pun/segala'. Frasa מְלֶאכֶת עֲבֹדָה menunjuk pada pekerjaan rutin atau pekerjaan untuk mata pencaharian, bukan larangan mutlak atas setiap kegiatan.
- source_word: לֹא תַעֲשׂוּ
  choice: Kamu tidak boleh melakukan
  rationale: Bentuk imperfek dengan negasi dalam konteks hukum menyampaikan larangan dan secara alami diterjemahkan dengan 'tidak boleh'.
