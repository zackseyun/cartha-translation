translation_notes:
  register: Bahasa Indonesia modern yang wajar dan khidmat. Struktur ayat dibuat sebagai ketentuan dengan 'harus dipersembahkan' untuk mengungkapkan daya perintah dari konteks, sementara hubungan gramatikal dan pengulangan Sabat tetap dipertahankan.
