  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: id
  text: Kurban bakaran Sabat pada setiap hari Sabat, di samping kurban bakaran yang tetap serta persembahan curahannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: kurban bakaran
  rationale: עֹלָה adalah kurban yang seluruhnya dibakar. 'Kurban bakaran' merupakan padanan Indonesia yang baku, jelas, dan sesuai dengan konteks peribadatan.
- source_word: שַׁבַּת
  choice: hari Sabat
  rationale: Dalam kalender persembahan ini, שַׁבָּת menunjuk kepada hari Sabat, bukan kepada pekan secara umum.
- source_word: בְּשַׁבַּתּוֹ
  choice: pada hari Sabatnya
  rationale: Padanan ini mempertahankan sufiks orang ketiga tunggal dalam teks Ibrani dan menyampaikan bahwa kurban Sabat dipersembahkan pada Sabat yang bersangkutan.
- source_word: עַל
  choice: sebagai tambahan pada
  rationale: Dalam petunjuk mengenai persembahan, עַל di sini menyatakan penambahan atau penyertaan terhadap kurban yang disebut sesudahnya, bukan posisi fisik 'di atas'.
- source_word: הַתָּמִיד
  choice: yang tetap
  rationale: תָּמִיד berarti terus-menerus atau teratur. 'Yang tetap' secara ringkas menyatakan kurban bakaran rutin yang diwajibkan dan tidak membatasi artinya secara eksplisit menjadi 'harian'.
- source_word: וְנִסְכָּהּ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ adalah persembahan cair yang dicurahkan. Sufiks feminin tunggal merujuk kepada kurban bakaran yang tetap.
