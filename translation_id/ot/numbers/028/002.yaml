  variant: modern standard Indonesian
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: id
  text: “Perintahkanlah orang Israel dan katakan kepada mereka, ‘Persembahan-Ku, makanan-Ku, persembahan yang dibakar bagi-Ku, aroma yang menyenangkan bagi-Ku[a]—harus kamu persembahkan kepada-Ku pada waktu yang telah ditetapkan.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aroma yang menyenangkan” adalah ungkapan tetap dalam tata kurban bagi persembahan yang diterima dengan berkenan oleh Allah.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Perintahkanlah
  rationale: Bentuk imperatif dari צוה menyampaikan perintah yang tegas kepada Musa; ‘perintahkanlah’ mempertahankan kekuatannya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah ‘anak-anak lelaki Israel’ berfungsi sebagai sebutan kolektif bagi umat Israel. ‘Orang Israel’ alami dalam bahasa Indonesia dan mencakup keseluruhan umat tanpa mengubah acuannya.
- source_word: קָרְבָּנִי
  choice: Persembahan-Ku
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa mendekat dan dipersembahkan kepada Allah.
- source_word: לַחְמִי
  choice: makanan-Ku
  rationale: לֶחֶם secara harfiah dapat berarti ‘roti’, tetapi dalam konteks kurban menunjuk lebih luas kepada makanan persembahan; ‘makanan’ menghindari kesan bahwa yang dimaksud hanya roti.
- source_word: לְאִשַּׁי
  choice: berupa kurban bakaran bagi-Ku
  rationale: אִשֶּׁה adalah istilah kultis bagi persembahan yang dibakar di atas mazbah. ‘Kurban bakaran’ mengungkapkan unsur api secara wajar, meski istilah ini tidak harus identik dengan kategori khusus עֹלָה.
- source_word: רֵיחַ נִיחֹחִי
  choice: yang menjadi aroma yang menyenangkan bagi-Ku
  rationale: Ungkapan kurban yang tetap ini mempertahankan gambaran konkret tentang aroma yang berkenan kepada Allah tanpa mereduksinya menjadi abstraksi.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב
  choice: harus kamu persembahkan
  rationale: שמר dengan infinitif menyatakan kewajiban untuk menjaga ketepatan pelaksanaan. ‘Harus’ menyampaikan daya perintahnya secara alami; ketelitian waktunya dijelaskan oleh frasa berikut.
- source_word: בְּמוֹעֲדוֹ
  choice: pada waktu yang telah ditetapkan
  rationale: מוֹעֵד di sini menunjuk waktu yang ditentukan bagi persembahan tersebut.
theological_decisions:
- issue: Bahasa antropomorfis dalam ‘makanan-Ku’ dan ‘aroma yang menyenangkan bagi-Ku’
  choice: Mempertahankan ungkapan konkret dari tata kurban
  alternative: Memparafrasekannya sebagai ‘persembahan yang berkenan kepada-Ku’
  rationale: Teks Ibrani sengaja memakai bahasa konkret. Terjemahan mempertahankannya tanpa menyimpulkan bahwa Allah secara harfiah membutuhkan makanan.
- issue: Cakupan sebutan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Dalam konteks ini ungkapan tersebut adalah sebutan korporat bagi umat Israel, bukan pembatasan perintah hanya kepada laki-laki; padanan Indonesia yang idiomatis mempertahankan cakupan itu.
- issue: Hubungan sintaksis rangkaian ‘persembahan-Ku, makanan-Ku, untuk persembahan api-Ku, aroma-Ku yang menyenangkan’
  choice: Membaca unsur-unsurnya sebagai keterangan yang saling menjelaskan tentang persembahan yang sama
  alternative: Memperlakukan semuanya sebagai beberapa objek persembahan yang terpisah
  rationale: Rangkaian nomina dan frasa berakhiran orang pertama tunggal paling wajar dipahami sebagai uraian bertumpuk mengenai persembahan yang wajib dibawa pada waktunya, sambil tetap mempertahankan kepadatan ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada sufiks pronomina yang merujuk kepada Allah mengikuti kebiasaan ejaan religius Indonesia. Struktur sumber dipertahankan sejauh tetap alami; istilah kultis dijelaskan secukupnya melalui catatan kaki.
