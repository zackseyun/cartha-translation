review_pass:
  verdict: revise
  source_fidelity: Makna ritual dan hubungan tambahan dengan kurban bakaran tetap pada dasarnya tepat. Namun, “Yang seperti ini” tidak wajar sebagai pembuka bahasa Indonesia dan kurang jelas merujuk pada persembahan-persembahan yang telah disebutkan. “Semuanya itu” dengan “Demikianlah” menyampaikan daya komparatif כָּאֵלֶּה secara lebih idiomatis. Frasa penutup diperjelas agar sufiks pada “kurban curahannya” jelas merujuk kepada kurban bakaran tetap.
  naturalness: Revisi menghilangkan pembuka yang canggung, memperbaiki struktur aposisional bagian ritual, dan memakai “selain” untuk hubungan penambahan yang lebih lancar dalam bahasa Indonesia baku.
  terminology: “Kurban bakaran tetap”, “kurban curahan”, dan “Yahweh” dipertahankan. “Persembahan yang dibakar dengan api” lebih jelas daripada “persembahan dengan api” tanpa mengubah cakupan istilah אִשֶּׁה.
  issues:
  - severity: medium
    issue: Pembuka “Yang seperti ini harus kamu persembahkan” tidak idiomatis dan rujukannya kabur.
    rationale: כָּאֵלֶּה menunjuk secara komparatif kepada ketentuan/persembahan yang baru disebutkan, bukan terutama kepada sebuah benda tunggal yang dapat disebut “yang seperti ini”.
  - severity: low
    issue: “Persembahan dengan api” dapat terdengar seperti persembahan yang sekadar disertai api.
    rationale: אִשֶּׁה secara ritual menunjuk pada persembahan yang dipersembahkan melalui pembakaran; bentuk revisi lebih transparan bagi pembaca modern.
  - severity: low
    issue: “Beserta kurban curahannya” setelah “di samping” kurang langsung memperjelas hubungan gramatikalnya.
    rationale: “Selain kurban bakaran tetap dan kurban curahannya” menunjukkan bahwa kurban curahan itu menyertai kurban bakaran tetap.
  revised_text: 'Demikianlah harus kamu mempersembahkan semuanya itu setiap hari selama tujuh hari: makanan sebagai persembahan yang dibakar dengan api, sebagai aroma yang menyenangkan bagi Yahweh.[a] Hal itu harus dipersembahkan selain kurban bakaran tetap dan kurban curahannya.'
  revised_footnotes:
