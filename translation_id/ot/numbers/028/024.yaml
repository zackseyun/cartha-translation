language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: id
  text: 'Demikianlah harus kamu mempersembahkan semuanya itu setiap hari selama tujuh hari: makanan sebagai persembahan yang dibakar dengan api, sebagai aroma yang menyenangkan bagi Yahweh.[a] Hal itu harus dipersembahkan selain kurban bakaran tetap dan kurban curahannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti/makanan dari suatu persembahan dengan api”. Di sini “makanan” menunjuk pada sajian kurban, bukan hanya roti biasa.
    reason: Menjelaskan ungkapan ritual Ibrani yang dapat disalahpahami sebagai roti harfiah saja.
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: Yang seperti ini
  rationale: Awalan כ menyatakan perbandingan dengan persembahan yang baru saja diperinci. Ungkapan ini mempertahankan daya banding teks Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: תַּעֲשׂוּ
  choice: harus kamu persembahkan
  rationale: Secara umum berarti 'melakukan/membuat', tetapi dalam konteks kurban tindakan yang dimaksud ialah mempersembahkan. Bentuk 'harus' menyampaikan fungsi instruktif yiqtol.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: setiap hari selama tujuh hari
  rationale: Menyampaikan makna distributif bahwa tindakan itu diulangi pada masing-masing dari ketujuh hari.
- source_word: לֶחֶם אִשֵּׁה
  choice: makanan, persembahan dengan api
  rationale: לֶחֶם dapat menunjuk pada makanan atau sajian kurban, bukan hanya roti; אִשֶּׁה ialah persembahan yang diserahkan melalui api. Susunan aposisional mempertahankan kedua unsur tanpa menyamakannya dengan kurban bakaran seluruhnya.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Padanan alami bagi rumusan kurban yang menggambarkan aroma yang berkenan atau menyenangkan bagi Allah, sambil mempertahankan metafora penciumannya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'; preposisi ל menyatakan arah atau penerima dari aroma yang menyenangkan itu.
- source_word: עַל עֹלַת הַתָּמִיד
  choice: di samping kurban bakaran tetap
  rationale: Dalam petunjuk kurban ini עַל menyatakan penambahan, sedangkan הַתָּמִיד menunjuk pada kurban rutin yang terus dipersembahkan.
- source_word: יֵעָשֶׂה
  choice: Itu harus dipersembahkan
  rationale: Bentuk pasif עשה dalam konteks ritual paling alami diterjemahkan sebagai tindakan mempersembahkan; 'itu' merujuk pada persembahan yang baru disebutkan.
- source_word: וְנִסְכּוֹ
  choice: beserta kurban curahannya
  rationale: נֶסֶךְ ialah persembahan cair yang dicurahkan. Sufiks orang ketiga tunggal merujuk pada kurban bakaran tetap.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan bagi Yahweh
  alternative: aroma yang menenangkan bagi Yahweh
  rationale: Terjemahan ini mempertahankan bahasa antropomorfis dan gagasan keberkenanan kurban tanpa mengembangkan teori tertentu tentang bagaimana kurban memengaruhi Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'kurban bakaran', 'kurban curahan', dan 'persembahan dengan api' dipakai secara konsisten untuk membedakan jenis-jenis persembahan. Susunan aposisional pada bagian tengah sengaja dipertahankan agar kepadatan rumusan ritual Ibrani tetap terasa tanpa menjadi tidak alami.
