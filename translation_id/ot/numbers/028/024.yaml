revisions:
- from: Yang seperti ini harus kamu persembahkan setiap hari selama tujuh hari:[a] makanan[b], persembahan dengan api, aroma yang menyenangkan bagi Yahweh. Itu harus dipersembahkan di samping kurban bakaran tetap beserta kurban curahannya.
  to: 'Demikianlah harus kamu mempersembahkan semuanya itu setiap hari selama tujuh hari: makanan sebagai persembahan yang dibakar dengan api, sebagai aroma yang menyenangkan bagi Yahweh.[a] Hal itu harus dipersembahkan selain kurban bakaran tetap dan kurban curahannya.'
  rationale: Revisi mempertahankan perintah untuk melakukan persembahan yang telah ditetapkan itu setiap hari selama tujuh hari, rumusan “makanan” dan persembahan api, aroma yang menyenangkan bagi Yahweh, serta statusnya sebagai tambahan pada kurban bakaran tetap dengan kurban curahannya. Catatan alternatif sebelumnya tidak diperlukan karena revisi teks utama sudah menyampaikan fungsi komparatif dan tindakan ritual secara jelas.
  reviewer_model: gpt-5.6-terra
