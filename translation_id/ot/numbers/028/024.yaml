    text: Secara harfiah, “roti/makanan dari suatu persembahan dengan api”. Di sini “makanan” menunjuk pada sajian kurban, bukan hanya roti biasa.
    reason: Menjelaskan ungkapan ritual Ibrani yang dapat disalahpahami sebagai roti harfiah saja.
  revision_rationale: Revisi mempertahankan perintah untuk melakukan persembahan yang telah ditetapkan itu setiap hari selama tujuh hari, rumusan “makanan” dan persembahan api, aroma yang menyenangkan bagi Yahweh, serta statusnya sebagai tambahan pada kurban bakaran tetap dengan kurban curahannya. Catatan alternatif sebelumnya tidak diperlukan karena revisi teks utama sudah menyampaikan fungsi komparatif dan tindakan ritual secara jelas.
