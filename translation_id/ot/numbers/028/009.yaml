revisions:
- from: Pada hari Sabat, persembahkanlah dua ekor anak domba jantan berumur setahun yang tidak bercacat, serta dua persepuluh efa[a] tepung terbaik sebagai persembahan sajian, yang dicampur dengan minyak, beserta persembahan curahannya.[b]
  to: Pada hari Sabat, persembahkanlah dua ekor anak domba jantan berumur setahun yang tidak bercacat, serta dua persepuluh efa[a] tepung halus sebagai persembahan sajian, yang dicampur dengan minyak, beserta persembahan curahan.[b]
  rationale: Revisi mengganti padanan yang kurang presisi bagi סֹלֶת dengan “tepung halus” dan memperbaiki kelaziman istilah bagi נֶסֶךְ menjadi “persembahan curahan.” Kata kerja perintah yang tersirat oleh konteks sebelumnya, satuan efa, dan ambiguitas praktis mengenai acuan sufiks pada וְנִסְכּוֹ tetap dipertahankan tanpa penambahan tafsiran.
