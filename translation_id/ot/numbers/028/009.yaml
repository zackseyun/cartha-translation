  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: id
  text: Pada hari Sabat, persembahkanlah dua ekor anak domba jantan berumur setahun yang tidak bercacat, serta dua persepuluh efa[a] tepung halus sebagai persembahan sajian, yang dicampur dengan minyak, beserta persembahan curahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi “dua persepuluh”; dalam peraturan persembahan, yang dimaksud ialah dua persepuluh efa.
    reason: cultural_note
  - marker: b
    text: 'Atau: “kurban curahan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: Pada hari Sabat
  rationale: Frasa ini menandai waktu bagi persembahan tambahan pada hari Sabat. Konjungsi Ibrani menghubungkannya dengan petunjuk sebelumnya, tetapi dalam bahasa Indonesia hubungan itu sudah wajar tersirat oleh kesinambungan konteks.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: dua ekor anak domba jantan berumur setahun
  rationale: כְבָשִׂים menunjuk kepada anak domba dan berbentuk maskulin; idiom בְּנֵי שָׁנָה menyatakan umur satu tahun. Kata penggolong “ekor” menghasilkan ungkapan Indonesia yang alami.
- source_word: תְּמִימִם
  choice: yang tidak bercacat
  rationale: Dalam peraturan kurban, istilah ini menyatakan bahwa hewan harus bebas dari cacat, bukan kesempurnaan abstrak.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dua persepuluh efa
  rationale: עִשָּׂרוֹן adalah ukuran sepersepuluh yang dalam peraturan persembahan dipahami sebagai sepersepuluh efa. Satuan kuno dipertahankan agar tidak memberi padanan volume modern yang terlalu pasti.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Istilah ini menunjuk kepada tepung bermutu tinggi yang digiling halus untuk persembahan. “Tepung terbaik” alami dalam bahasa Indonesia dan menyampaikan mutu bahan tanpa menyiratkan jenis biji-bijian tertentu.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan berbahan tepung atau hasil bumi, bukan sekadar pemberian umum. “Persembahan sajian” merupakan istilah ringkas dan lazim untuk kategori kurban ini.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip feminin ini menerangkan tepung atau persembahan sajian sebagai bahan yang telah dicampur dengan minyak.
- source_word: וְנִסְכּוֹ
  choice: beserta persembahan curahannya
  rationale: נֶסֶךְ adalah cairan yang dicurahkan sebagai bagian dari persembahan. Akhiran orang ketiga tunggal dipertahankan dengan “-nya”, tanpa menentukan lebih jauh apakah acuannya adalah persembahan sajian atau keseluruhan kurban Sabat.
theological_decisions:
- issue: Kata kerja untuk tindakan mempersembahkan tidak tertulis dalam ayat ini.
  choice: persembahkanlah
  alternative: 'mempertahankan susunan nominal: “Pada hari Sabat: dua ekor ...”'
  rationale: Bahasa Ibrani melanjutkan perintah persembahan dari konteks sebelumnya sehingga kata kerja dapat dilesapkan. Bahasa Indonesia memerlukan kata kerja agar kalimat berdiri alami; penambahannya menyatakan daya perintah yang sudah terkandung dalam konteks tanpa mengubah isi ritual.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami, sementara satuan kuno serta ketidakpastian acuan akhiran pada וְנִסְכּוֹ tetap dipertahankan.
