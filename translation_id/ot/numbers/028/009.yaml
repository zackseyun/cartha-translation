    issue: “tepung terbaik” untuk סֹלֶת
    rationale: Sֹלֶת menunjuk tepung yang digiling/dihaluskan secara khusus. “Terbaik” menggeser fokus leksikal kepada kualitas evaluatif dan kurang presisi dibanding “tepung halus.”
  - severity: low
    issue: “persembahan curahannya” untuk וְנִסְכּוֹ
    rationale: Bentuk berakhiran -nya memang mencoba mencerminkan sufiks Ibrani, tetapi frasa tersebut tidak alami. “Persembahan curahan” sudah memadai dalam bahasa Indonesia dan tidak menentukan acuan sufiks secara berlebihan.
