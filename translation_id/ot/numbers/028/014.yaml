  terminology: “Persembahan curahan” dan “kurban bakaran” sesuai untuk נֶסֶךְ dan עֹלָה. “Hin” patut dipertahankan sebagai satuan kuno. “Bulan baru” adalah pilihan kontekstual yang wajar untuk חֹדֶשׁ, dengan catatan alternatif “bulan” dalam catatan kaki.
