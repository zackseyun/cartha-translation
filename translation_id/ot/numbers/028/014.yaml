base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: id
  text: Persembahan curahan mereka ialah setengah hin untuk lembu jantan, sepertiga hin untuk domba jantan, dan seperempat hin untuk anak domba, semuanya anggur. Inilah kurban bakaran bulan baru[a] pada bulannya, untuk bulan-bulan dalam setahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “bulan baru” juga dapat berarti “bulan”. Frasa ini dapat diterjemahkan, “Inilah kurban bakaran bulan pada bulannya, untuk bulan-bulan dalam setahun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: persembahan curahan mereka
  rationale: Istilah ini menunjuk pada persembahan cair yang dicurahkan dalam ibadah kurban. “Persembahan curahan” jelas dan lazim dipahami dalam konteks Alkitab.
- source_word: חֲצִי הַהִין
  choice: setengah hin
  rationale: Satuan kuno dipertahankan agar transparan terhadap teks sumber dan tidak bergantung pada perkiraan konversi modern.
- source_word: לַפָּר
  choice: untuk setiap lembu jantan
  rationale: Bentuk tunggal berartikel mengacu secara distributif pada lembu-lembu kurban yang disebut dalam konteks sebelumnya; “setiap” mencegah kesan bahwa takaran itu berlaku hanya bagi satu dari dua lembu.
- source_word: וּשְׁלִישִׁת הַהִין לָאַיִל
  choice: sepertiga hin untuk domba jantan
  rationale: Menerjemahkan pecahan dan hewan kurban secara langsung dan alami; konteks sebelumnya hanya menyebut satu domba jantan.
- source_word: וּרְבִיעִת הַהִין לַכֶּבֶשׂ
  choice: seperempat hin untuk setiap anak domba
  rationale: Bentuk tunggal berfungsi distributif karena konteks menyebut tujuh anak domba; “setiap” menyatakan penerapan takaran pada masing-masing hewan.
- source_word: יָיִן
  choice: berupa anggur
  rationale: Kata yang muncul sesudah daftar takaran dalam bahasa Ibrani menjelaskan isi persembahan curahan. Penempatannya sebelum daftar menghasilkan bahasa Indonesia yang lebih alami tanpa mengubah makna.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: Inilah kurban bakaran bulan baru
  rationale: Dalam konteks ketetapan kurban pada awal bulan, חֹדֶשׁ secara wajar menunjuk pada bulan baru. Makna alternatif “bulan/bulanan” tetap dicatat karena kata Ibrani itu memiliki kedua kemungkinan.
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: pada setiap bulan sepanjang tahun
  rationale: Ungkapan ini menyatakan pengulangan perayaan itu pada bulan masing-masing dalam seluruh siklus tahunan; terjemahan ini alami sekaligus mempertahankan cakupan waktunya.
theological_decisions:
- issue: Apakah חֹדֶשׁ berarti “bulan baru” atau “bulan/bulanan”
  choice: bulan baru
  alternative: kurban bakaran bulanan pada setiap bulan sepanjang tahun
  rationale: Konteks langsung mengenai kurban pada permulaan bulan mendukung “bulan baru”, tetapi cakupan leksikal kata tersebut dan pengulangan kata “bulan” membuat pembacaan “bulanan” tetap mungkin; alternatif dicatat tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “berupa anggur” dipindahkan ke depan daftar takaran agar alami. Kata “setiap” digunakan secara distributif untuk lembu jantan dan anak domba berdasarkan jumlah hewan dalam ayat sebelumnya.
