revisions:
- from: 'Persembahan curahan mereka haruslah berupa anggur: setengah hin untuk setiap lembu jantan, sepertiga hin untuk domba jantan, dan seperempat hin untuk setiap anak domba. Inilah kurban bakaran bulan baru[a] pada setiap bulan sepanjang tahun.'
  to: Persembahan curahan mereka ialah setengah hin untuk lembu jantan, sepertiga hin untuk domba jantan, dan seperempat hin untuk anak domba, semuanya anggur. Inilah kurban bakaran bulan baru[a] pada bulannya, untuk bulan-bulan dalam setahun.
  rationale: Revisi mempertahankan satuan, hewan, dan sifat anggur dari persembahan curahan, sambil mengembalikan posisi penjelas “anggur” sesudah daftar sebagaimana dalam sumber. Frasa penutup dibuat lebih dekat dengan “di/pada bulannya, untuk bulan-bulan dalam setahun”, tanpa menghapus pembacaan kontekstual “bulan baru”; ambiguitas leksikalnya dipelihara dalam catatan kaki.
