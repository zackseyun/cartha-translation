base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: id
  text: 'Dan persembahan sajian mereka ialah tepung halus yang dicampur dengan minyak: tiga persepuluh efa untuk setiap sapi jantan[a] dan dua persepuluh efa untuk setiap domba jantan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: "tiga takaran sepersepuluh" dan "dua takaran sepersepuluh". Dalam konteks persembahan ini, takaran tersebut umumnya dipahami sebagai sepersepuluh efa.'
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Sebagai persembahan sajian mereka
  rationale: Dalam konteks kurban, מִנְחָה menunjuk pada persembahan berbahan hasil bumi, khususnya tepung. 'Persembahan sajian' merupakan istilah Indonesia yang ringkas dan lazim untuk membedakannya dari kurban hewan; klausa nominal Ibrani dipertahankan secara alami tanpa menambahkan modalitas.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: סֹלֶת ialah tepung bermutu tinggi yang dipakai dalam persembahan. 'Tepung terbaik' lebih mudah dipahami pembaca modern daripada istilah teknis yang dapat mengisyaratkan tingkat kehalusan penggilingan secara terlalu spesifik.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif בְּלוּלָה menyatakan bahwa tepung itu disiapkan dengan mencampurkannya dengan minyak.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tiga persepuluh efa
  rationale: עִשָּׂרוֹן adalah satu takaran sepersepuluh yang dalam peraturan persembahan dipahami sebagai sepersepuluh efa. Unitnya dinyatakan dalam teks agar jumlahnya jelas bagi pembaca Indonesia.
- source_word: לַפָּר הָאֶחָד
  choice: untuk setiap sapi jantan
  rationale: פַּר berarti sapi jantan muda atau sapi jantan untuk kurban. Dalam daftar pembagian takaran, הָאֶחָד bersifat distributif—jumlah tersebut berlaku bagi masing-masing hewan—sehingga 'setiap' paling alami dan jelas.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dua persepuluh efa
  rationale: Frasa ini menyebut dua unit sepersepuluh; 'efa' dieksplisitkan berdasarkan satuan yang berlaku dalam hukum persembahan.
- source_word: לָאַיִל הָאֶחָד
  choice: untuk setiap domba jantan
  rationale: אַיִל berarti domba jantan. Seperti pada sapi jantan, הָאֶחָד dipahami secara distributif dalam resep persembahan.
theological_decisions: []
