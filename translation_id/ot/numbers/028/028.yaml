revisions:
- from: 'Sebagai persembahan sajian mereka: tepung terbaik yang dicampur dengan minyak, tiga persepuluh efa untuk setiap sapi jantan[a] dan dua persepuluh efa untuk setiap domba jantan.'
  to: 'Dan persembahan sajian mereka ialah tepung halus yang dicampur dengan minyak: tiga persepuluh efa untuk setiap sapi jantan[a] dan dua persepuluh efa untuk setiap domba jantan.'
  rationale: Revisi mengganti padanan yang terlalu umum "tepung terbaik" dengan "tepung halus," membentuk ulang pembuka menjadi klausa Indonesia yang lengkap sambil mempertahankan kata sambung sumber, dan mengganti penjelasan volume yang tidak pasti dengan catatan satuan yang lebih dekat kepada ungkapan Ibrani. Takaran distributif serta istilah hewan dipertahankan.
