  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan berupa kelanjutan daftar dari ayat sebelumnya dipertahankan. Istilah ritual 'persembahan sajian' digunakan secara konsisten, sedangkan ukuran kuno 'efa' dipertahankan dan dijelaskan dalam catatan kaki.
