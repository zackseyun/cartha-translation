    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Pada hari pertama
  rationale: Menerjemahkan frasa waktu berartikel dan bentuk ordinal secara langsung tanpa menambahkan 'perayaan', yang hanya tersirat dari konteks.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Ungkapan kultis ini menunjuk pada pertemuan sakral yang diserukan atau ditetapkan; 'pertemuan kudus' alami dan mudah dipahami dalam bahasa Indonesia, sementara nuansa alternatif dicatat dalam catatan kaki.
- source_word: כָּל ... לֹא
  choice: apa pun ... jangan
  rationale: Susunan larangan ini menyatakan pelarangan menyeluruh dan diterjemahkan secara idiomatis dalam bahasa Indonesia.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan sehari-hari
  rationale: Frasa ini merujuk pada pekerjaan biasa atau pekerjaan mata pencaharian yang dilarang pada hari raya, bukan pada setiap tindakan tanpa kecuali.
- source_word: לֹא תַעֲשׂוּ
  choice: Janganlah kamu melakukan
  rationale: Bentuk orang kedua jamak dalam konteks hukum diterjemahkan sebagai larangan yang tegas; 'kamu' di sini bersifat jamak dan komunal.
theological_decisions:
- issue: Cakupan larangan kerja
  choice: pekerjaan sehari-hari apa pun
  alternative: segala pekerjaan berat
  rationale: Teks Ibrani memakai מְלֶאכֶת עֲבֹדָה, yang secara khusus menunjuk pada pekerjaan biasa/pekerjaan pelayanan atau mata pencaharian. Terjemahan ini tidak memperluas larangan menjadi semua jenis tindakan dan tidak membatasinya hanya pada kerja yang berat secara fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dua kalimat mempertahankan ketegasan ketentuan hukum dan membuat ayat mudah dibaca. Istilah 'pertemuan kudus' dipilih daripada 'pertemuan raya' agar unsur kekudusan tetap eksplisit.
