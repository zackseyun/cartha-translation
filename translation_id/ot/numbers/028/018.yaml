  text: Pada hari pertama harus ada pertemuan kudus[a]. Janganlah kamu melakukan pekerjaan biasa apa pun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pertemuan suci”; ungkapan Ibrani ini juga mengandung gagasan tentang pertemuan yang diserukan secara resmi.'
