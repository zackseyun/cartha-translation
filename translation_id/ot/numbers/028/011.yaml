  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: id
  text: 'Pada awal setiap bulan[a], kalian harus mempersembahkan kurban bakaran kepada Yahweh: dua ekor sapi jantan dari kawanan, seekor domba jantan, dan tujuh ekor anak domba jantan berumur setahun, semuanya tidak bercacat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada awal bulan-bulan kalian”; maksudnya, pada perayaan bulan baru.'
    reason: Ungkapan Ibrani adalah idiom bagi awal tiap bulan dan secara ritual menunjuk pada perayaan bulan baru.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: Pada awal setiap bulanmu
  rationale: Ungkapan harfiah 'pada kepala-kepala bulanmu' adalah idiom bagi awal tiap bulan, yaitu perayaan bulan baru. Terjemahan utama dibuat alami dalam bahasa Indonesia, sementara latar bulan baru dicatat dalam catatan kaki.
- source_word: תַּקְרִיבוּ
  choice: kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa ke hadapan atau mempersembahkan. 'Mempersembahkan' jelas dan wajar untuk konteks ibadah.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada kurban yang dibakar seluruhnya. 'Kurban bakaran' adalah padanan Indonesia yang mapan dan tepat.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau peruntukan persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dua ekor sapi jantan dari kawanan
  rationale: Frasa Ibrani menyebut sapi-sapi jantan dari ternak besar. Pilihan ini tidak memaksakan makna 'muda', yang tidak dituntut oleh teks.
- source_word: וְאַיִל אֶחָד
  choice: seekor domba jantan
  rationale: Padanan langsung dan alami bagi istilah hewan kurban אַיִל beserta bilangannya.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: tujuh ekor anak domba jantan berumur setahun
  rationale: כְּבָשִׂים secara khusus menunjuk anak domba jantan, sedangkan idiom 'anak-anak setahun' berarti berumur sekitar satu tahun atau masih dalam tahun pertamanya.
- source_word: תְּמִימִם
  choice: semuanya tidak bercacat
  rationale: Dalam konteks kurban, kata ini menyatakan bahwa hewan bebas dari cacat. 'Semuanya' memperjelas bahwa sifat tersebut berlaku pada seluruh hewan yang disebut.
theological_decisions:
- issue: Ungkapan waktu untuk perayaan bulanan
  choice: Pada awal setiap bulanmu
  alternative: Pada perayaan bulan barumu
  rationale: Teks secara leksikal berbicara tentang 'awal bulan-bulanmu', sedangkan konteksnya adalah perayaan bulan baru. Terjemahan utama mempertahankan bentuk idiomatis sumber secara alami dan catatan kaki menjelaskan rujukan ritualnya.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יהוה. Transliterasi 'Yahweh' mempertahankan nama perjanjian itu, alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal 'kamu' mengikuti bentuk jamak kolektif Ibrani yang ditujukan kepada umat; konstruksi dengan 'ekor' dibuat alami bagi pembaca umum. Ejaan 'kurban' mengikuti bentuk baku modern.
