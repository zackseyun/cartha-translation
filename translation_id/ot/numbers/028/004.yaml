  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: id
  text: Anak domba yang satu haruslah kamu persembahkan pada pagi hari, dan anak domba yang kedua haruslah kamu persembahkan di antara dua waktu petang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “di antara dua petang”, suatu ungkapan tradisional yang dapat menunjuk pada waktu menjelang petang atau sekitar senja.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: anak domba
  rationale: כֶּבֶשׂ menunjuk pada domba muda, biasanya jantan dalam konteks kurban. 'Anak domba' merupakan padanan Indonesia yang alami tanpa menambahkan keterangan 'jantan' yang tidak dinyatakan kembali secara eksplisit dalam ayat ini.
- source_word: אֶחָד
  choice: yang satu
  rationale: Bilangan pokok אֶחָד berarti 'satu'. Bentuk 'yang satu' mempertahankan perbedaan sumber antara אֶחָד dan kata urutan 'kedua' pada klausa berikutnya.
- source_word: תַּעֲשֶׂה
  choice: haruslah kamu persembahkan
  rationale: Secara harfiah עשה berarti 'melakukan/membuat', tetapi dalam petunjuk kurban kata ini secara idiomatis berarti menyiapkan atau mempersembahkan kurban. Pilihan ini menyampaikan tindakan ritual secara jelas dan mempertahankan daya perintah bentuk Ibrani.
- source_word: בַבֹּקֶר
  choice: pada pagi hari
  rationale: בֹּקֶר berarti 'pagi'; dengan preposisi, 'pada pagi hari' adalah ungkapan waktu yang wajar dalam bahasa Indonesia.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: שֵׁנִי adalah bilangan urutan 'kedua'. Padanan ini langsung dan mempertahankan urutan kedua anak domba.
- source_word: בֵּין הָעַרְבָּיִם
  choice: di antara kedua petang
  rationale: Ungkapan Ibrani ini secara formal berarti 'di antara kedua petang'. Karena batas waktunya merupakan ungkapan budaya kuno yang ditafsirkan dengan beberapa cara, teks utama mempertahankan bentuknya dan catatan kaki memberi penjelasan waktu yang lebih alami.
