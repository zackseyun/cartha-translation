  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: id
  text: 'Katakanlah kepada mereka, ‘Inilah persembahan dengan api[a] yang harus kamu persembahkan kepada Yahweh: dua ekor anak domba jantan berumur setahun, tanpa cacat, setiap hari, sebagai kurban bakaran yang teratur.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan oleh api” atau “persembahan santapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: persembahan dengan api
  rationale: Istilah ini menunjuk pada persembahan yang dipersembahkan melalui api. Pilihan ini mempertahankan unsur api dalam istilah Ibrani tanpa menyiratkan bahwa persembahan itu secara harfiah memberi makan Allah; alternatif kultisnya dicatat dalam catatan kaki.
- source_word: תַּקְרִיבוּ
  choice: harus kamu persembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa ke hadapan atau mempersembahkan; frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa ritual.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai Yahweh, sesuai bentuk nama diri dalam sumber Ibrani.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: anak domba jantan berumur setahun
  rationale: Bentuk maskulin dan ungkapan idiomatis 'anak-anak satu tahun' dinyatakan secara jelas dan alami dalam bahasa Indonesia.
- source_word: תְמִימִם
  choice: tidak bercacat
  rationale: Dalam hukum kurban, kata ini menyatakan bahwa hewan harus bebas dari cacat, bukan sempurna dalam arti abstrak.
- source_word: לַיּוֹם
  choice: setiap hari
  rationale: 'Dengan jumlah dua dan konteks jadwal kurban, frasa ini bersifat distributif: dua ekor pada tiap-tiap hari.'
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Ini adalah istilah kultis baku untuk kurban yang dibakar seluruhnya di atas mazbah; terjemahan etimologis 'kurban yang naik' kurang jelas.
- source_word: תָמִיד
  choice: yang tetap
  rationale: Dalam konteks keimaman, kata ini menunjukkan pelaksanaan yang teratur dan berkesinambungan, bukan tindakan yang berlangsung tanpa jeda.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu, sedangkan 'TUHAN' mewakili tradisi pembacaan pengganti.
- issue: Makna kultis אִשֶּׁה
  choice: persembahan dengan api
  alternative: persembahan santapan
  rationale: Etimologi dan cakupan tepat istilah ini tidak sepenuhnya pasti. Terjemahan utama mempertahankan kaitannya yang jelas dengan ritual api, sedangkan alternatif mencerminkan pemakaiannya sebagai sajian kultis bagi Allah tanpa mengajarkan bahwa Allah secara harfiah membutuhkan makanan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang khidmat. Susunan 'setiap hari dua ekor' dibuat jelas untuk menonjolkan jumlah harian, sementara 'yang tetap' mempertahankan sifat teratur dan berkelanjutan dari kurban tersebut.
