  to: 'Katakanlah kepada mereka, ‘Inilah persembahan dengan api[a] yang harus kamu persembahkan kepada Yahweh: dua ekor anak domba jantan berumur setahun, tanpa cacat, setiap hari, sebagai kurban bakaran yang teratur.’'
