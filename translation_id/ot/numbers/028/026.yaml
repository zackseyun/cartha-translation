  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: id
  text: Pada hari buah sulung, ketika kamu mempersembahkan persembahan sajian baru kepada Yahweh pada Perayaan Tujuh Minggu, kamu harus mengadakan pertemuan kudus[a]. Kamu tidak boleh melakukan pekerjaan sehari-hari apa pun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “perhimpunan kudus.” Frasa Ibraninya merupakan istilah khusus bagi pertemuan sakral yang diserukan untuk beribadah.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “pekerjaan berat apa pun” atau “pekerjaan untuk mencari nafkah apa pun.” Ungkapan ini menunjuk pada pekerjaan biasa yang berkaitan dengan kegiatan sehari-hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: Pada hari hasil pertama
  rationale: Ungkapan waktu ini menunjuk pada hari raya yang berkaitan dengan hasil pertama. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan langsung dengan hasil panen pertama.
- source_word: בְּהַקְרִיבְכֶם
  choice: ketika kamu mempersembahkan
  rationale: Infinitif dengan prefiks ב menandai tindakan yang berlangsung pada kesempatan tersebut; dalam konteks kurban, קרב berarti membawa atau mempersembahkan kepada Allah.
- source_word: מִנְחָה חֲדָשָׁה
  choice: persembahan sajian yang baru
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan dari hasil tanaman, bukan sekadar pemberian umum. 'Persembahan sajian' mempertahankan istilah ritual yang lazim, sedangkan 'yang baru' menunjuk pada hasil panen baru.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה dialihaksarakan sebagai 'Yahweh', sesuai bentuk nama diri dalam teks sumber.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: dalam perayaan Hari Raya Tujuh Minggu
  rationale: Bentuk jamak ini menunjuk pada perayaan yang dikenal sebagai Hari Raya Tujuh Minggu. Terjemahan ini menyampaikan fungsi kalender dan perayaannya tanpa menghasilkan ungkapan kepunyaan yang kaku dalam bahasa Indonesia.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Frasa teknis ini menunjuk pada pertemuan sakral yang diserukan atau dihimpunkan untuk ibadah. 'Pertemuan kudus' jelas bagi pembaca modern dan tetap mempertahankan sifat khusus pertemuan itu.
- source_word: יִהְיֶה לָכֶם
  choice: kamu harus mengadakan
  rationale: Konstruksi היה + ל secara harfiah berarti bahwa pertemuan itu harus ada bagi mereka. Dalam konteks ketetapan, 'kamu harus mengadakan' menyampaikan daya perintahnya secara alami.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: Kamu tidak boleh melakukan pekerjaan sehari-hari apa pun
  rationale: Larangan ini menyangkut pekerjaan rutin atau pekerjaan mata pencaharian pada hari raya, bukan setiap bentuk kegiatan tanpa kecuali. Susunan ini mempertahankan cakupan כָּל dan larangan langsungnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan larangan כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan sehari-hari apa pun
  alternative: segala pekerjaan berat; segala pekerjaan untuk mencari nafkah
  rationale: Ungkapan keimaman ini dapat dipahami sebagai pekerjaan rutin, berat, atau pekerjaan jabatan/mata pencaharian. Terjemahan utama tidak memperluas larangan menjadi semua kegiatan, dan catatan kaki mempertahankan ragam nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan jamak Ibrani diterjemahkan dengan 'kamu' yang dapat berfungsi kolektif dalam bahasa Indonesia. Istilah ritual 'persembahan sajian' dan nama perayaan dipertahankan, sementara struktur kalimat dibuat alami dan mudah dipahami.
