  terminology: “Yahweh,” “persembahan sajian,” “pertemuan kudus,” dan “pekerjaan sehari-hari” sesuai konteks dan register. Istilah “buah sulung” mempertahankan rujukan pada hasil pertama tanpa mengubahnya menjadi penafsiran yang lebih spesifik.
