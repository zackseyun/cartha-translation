    issue: Makna הָעֲשֻׂיָה dibatasi menjadi “yang dipersembahkan.”
    rationale: Partisip pasif ini berarti “yang dibuat/dilakukan.” Dalam konteks kurban tetap di Bilangan 28, rujukannya sangat mungkin pada penetapan tata kurban di Sinai. “Dipersembahkan” menyatakan tindakan kultis tertentu yang tidak dinyatakan oleh verba ini.
  - severity: low
    issue: Padanan תָּמִיד “tetap” kurang spesifik.
    rationale: Maknanya dalam konteks ini adalah keteraturan yang berkelanjutan. “Yang teratur” lebih jelas dalam bahasa Indonesia modern.
  - severity: medium
    issue: Jangkar catatan kaki d ditempatkan setelah “Yahweh,” bukan setelah padanan אִשֶּׁה.
    rationale: Catatan d menjelaskan “persembahan dengan api,” sehingga penanda harus langsung mengikuti istilah itu agar jangkar catatan kaki tidak ambigu.
  - severity: low
