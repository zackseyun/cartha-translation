base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: id
  text: Itulah kurban bakaran yang teratur[a], yang ditetapkan di Gunung Sinai[b], untuk menjadi aroma yang menyenangkan[c], suatu persembahan api[d] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban bakaran yang terus-menerus.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang dibuat/dilakukan di Gunung Sinai”; frasa ini mungkin merujuk pada kurban yang ditetapkan di sana.
    reason: alternative_reading
  - marker: c
    text: Atau “untuk menjadi aroma yang menenangkan” atau “untuk menjadi aroma yang harum.”
    reason: lexical_alternative
  - marker: d
    text: Secara tradisional, “persembahan yang dipersembahkan dengan api bagi Yahweh.” Sebagian memahami istilah Ibraninya sebagai persembahan makanan bagi Allah yang disajikan melalui api.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk kurban yang seluruhnya dibakar di atas mezbah; lebih jelas daripada terjemahan etimologis seperti 'kurban yang naik'.
- source_word: תָּמִיד
  choice: tetap
  rationale: Dalam konteks ibadah, kata ini menunjuk pada kurban yang dipersembahkan secara teratur dan terus berlaku, bukan tindakan yang berlangsung tanpa henti.
- source_word: הָעֲשֻׂיָה
  choice: yang dipersembahkan
  rationale: Partisip pasif ini secara harfiah berarti 'yang dibuat/dilakukan'. Dalam konteks kurban, 'dipersembahkan' merupakan ungkapan Indonesia yang alami, sementara kemungkinan bahwa kurban itu ditetapkan di Sinai dicatat dalam catatan kaki.
- source_word: בְּהַר סִינַי
  choice: di Gunung Sinai
  rationale: Preposisi בְּ secara wajar menyatakan lokasi; 'di Gunung Sinai' mempertahankan bentuk sumber tanpa memutuskan apakah yang dimaksud pelaksanaan atau penetapan kurban di sana.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Mempertahankan gambaran indrawi dari ungkapan kurban Ibrani dan menyampaikan penerimaan ilahi tanpa mengubahnya menjadi pernyataan teologis yang lebih eksplisit.
- source_word: אִשֶּׁה
  choice: persembahan dengan api
  rationale: Padanan ini mempertahankan kaitan tradisional dan kontekstual istilah tersebut dengan api, tanpa mengulang bahwa kurban itu sendiri adalah kurban bakaran.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mempertahankan nama perjanjian יהוה dan arah atau peruntukan persembahan yang ditandai oleh preposisi לְ.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menyebut Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi dalam bentuk yang lazim dalam kajian modern.
- issue: Ungkapan kultis רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenangkan atau aroma yang harum
  rationale: Pilihan ini mempertahankan metafora kurban dan gagasan penerimaan tanpa menyelesaikan secara berlebihan apakah נִיחֹחַ menekankan kesenangan atau efek menenangkan.
- issue: Makna הָעֲשֻׂיָה בְּהַר סִינַי
  choice: yang dipersembahkan di Gunung Sinai
  alternative: yang ditetapkan di Gunung Sinai
  rationale: Bentuk Ibrani secara langsung menyatakan sesuatu yang dibuat atau dilakukan di Sinai, tetapi konteks dapat menunjuk pada penetapan tata kurban di sana. Teks utama memakai ungkapan kultis yang alami dan catatan kaki mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti alur teks Ibrani, sedangkan istilah ritual dibuat cukup alami bagi pembaca umum. Ambiguitas mengenai tindakan di Sinai dan istilah אִשֶּׁה dipertahankan melalui catatan kaki.
