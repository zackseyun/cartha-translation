  to: Itulah kurban bakaran yang teratur[a], yang ditetapkan di Gunung Sinai[b], untuk menjadi aroma yang menyenangkan[c], suatu persembahan api[d] bagi Yahweh.
  rationale: Revisi ini mengganti pembatasan makna “dipersembahkan di Gunung Sinai” dengan “ditetapkan di Gunung Sinai,” yang paling sesuai dengan konteks sambil mempertahankan pembacaan literal dalam catatan kaki. Padanan “yang teratur” memperjelas תָּמִיד. Frasa tujuan bagi aroma dipulihkan, dan penanda catatan kaki untuk אִשֶּׁה dipindahkan ke istilah yang dijelaskannya.
