id: NUM.28.12
reference: Numbers 28:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: id
  text: dan tiga persepuluh efa tepung terbaik sebagai persembahan sajian[a], yang dicampur dengan minyak, untuk setiap lembu jantan; serta dua persepuluh efa tepung terbaik sebagai persembahan sajian, yang dicampur dengan minyak[b], untuk domba jantan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi “tiga persepuluh” dan kemudian “dua persepuluh”; yang dimaksud ialah persepuluh efa.
    reason: cultural_note
  - marker: b
    text: 'Atau: “yang diaduk bersama minyak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: dan tiga persepuluh efa
  rationale: עֶשְׂרוֹן adalah satuan sepersepuluh yang dalam peraturan kurban dipahami sebagai sepersepuluh efa; penyebutan efa membuat ukurannya jelas.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Istilah ini menunjuk pada tepung bermutu tinggi yang dipakai dalam persembahan; pilihan ini alami dalam bahasa Indonesia dan tidak secara keliru menekankan tingkat kehalusan modern.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks ibadah ini, מִנְחָה adalah persembahan berbahan hasil bumi, khususnya tepung, bukan pemberian umum; istilah baku ini mempertahankan fungsi kultisnya.
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Ungkapan partisipial ini menerangkan cara tepung dipersiapkan; 'dicampur dengan minyak' merupakan padanan modern yang langsung dan tepat.
- source_word: לַ/פָּר הָ/אֶחָד
  choice: untuk setiap lembu jantan
  rationale: Artikel bersama אֶחָד di sini bersifat distributif dalam ketentuan bagi beberapa lembu pada ayat sebelumnya, bukan ordinal 'yang pertama'.
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: serta dua persepuluh efa
  rationale: Seperti pada frasa sebelumnya, satuan yang tersirat dinyatakan sebagai efa demi kejelasan bagi pembaca.
- source_word: לָ/אַיִל הָ/אֶחָד
  choice: untuk domba jantan itu
  rationale: Karena ayat sebelumnya menyebut satu domba jantan, bentuk definit ini secara alami merujuk kepada hewan tersebut; tidak diterjemahkan sebagai ordinal.
theological_decisions: []
