  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: id
  text: dan sepersepuluh efa tepung halus sebagai kurban sajian, dicampur dengan minyak hasil tumbukan sebanyak seperempat hin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa dan hin adalah satuan takaran Israel kuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: dan sepersepuluh efa
  rationale: Kata penghubung וַ mengaitkan takaran ini dengan ketentuan kurban pada ayat sebelumnya. Nama satuan kuno efa dipertahankan agar kekhususan teks sumber tidak hilang.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk pada tepung bermutu yang digiling halus dan digunakan dalam persembahan.
- source_word: לְמִנְחָה
  choice: sebagai kurban sajian
  rationale: Dalam peraturan ibadah ini, מִנְחָה adalah jenis kurban yang dibuat dari hasil tanaman, terutama tepung; 'kurban sajian' merupakan istilah Indonesia yang alami dan tidak membatasi maknanya secara tidak perlu hanya pada biji-bijian.
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: dicampur dengan ... minyak
  rationale: Partisip pasif בְּלוּלָה menyatakan bahwa tepung tersebut dicampur dengan minyak; susunan ini alami dalam bahasa Indonesia.
- source_word: כָּתִית
  choice: minyak tumbuk
  rationale: Kata sifat ini menerangkan minyak yang diperoleh dari buah zaitun yang ditumbuk atau dihancurkan. 'Minyak tumbuk' mempertahankan gambaran cara pengolahannya.
- source_word: רְבִיעִת הַהִין
  choice: seperempat hin
  rationale: Terjemahan ini menyampaikan pecahan secara alami sambil mempertahankan nama satuan kuno hin.
