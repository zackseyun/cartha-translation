translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama satuan kuno dipertahankan, sedangkan struktur kalimat dibuat ringkas dan alami. Penanda catatan kaki ditempatkan setelah frasa yang memuat kedua satuan.
