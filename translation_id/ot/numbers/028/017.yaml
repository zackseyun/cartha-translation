  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר י֛וֹם לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה חָ֑ג שִׁבְעַ֣ת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: id
  text: Pada hari kelima belas bulan ini ada perayaan[a]; selama tujuh hari roti tidak beragi harus dimakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hari raya.” Kata Ibrani חָג dapat menunjuk pada perayaan keagamaan, termasuk hari raya ziarah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Pada hari kelima belas
  rationale: Gabungan kata penghubung dan preposisi membuka keterangan waktu. Dalam bahasa Indonesia, kata penghubung awal tidak perlu dinyatakan, sedangkan bilangan tingkat diterjemahkan secara idiomatis sebagai “hari kelima belas”.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: bulan ini
  rationale: Dalam konteks penanggalan, חֹדֶשׁ berarti “bulan”; konstruksi Ibraninya secara alami menjadi “bulan ini” dalam bahasa Indonesia.
- source_word: חָג
  choice: ada perayaan
  rationale: חָג menunjuk pada perayaan keagamaan, khususnya hari raya ziarah. “Perayaan” alami dan cukup luas untuk mempertahankan nuansa kegiatan hari raya, tanpa menyempitkannya menjadi sekadar jamuan.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Frasa ini menyatakan rentang waktu. “Selama tujuh hari” merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: מַצּוֹת adalah roti yang dibuat tanpa ragi. Ungkapan ini transparan dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: יֵאָכֵל
  choice: harus dimakan
  rationale: Bentuk Nifal imperfek bersifat pasif dan, dalam konteks ketetapan ibadah, menyampaikan kewajiban. “Harus dimakan” mempertahankan bentuk pasif sekaligus menyatakan daya perintah konteksnya.
