revisions:
- from: Persembahan sajian yang menyertai semuanya harus berupa tepung halus yang dicampur dengan minyak. Harus kamu siapkan tiga persepuluh[a] untuk lembu jantan dan dua persepuluh untuk domba jantan.
  to: Persembahan sajian mereka berupa tepung halus yang dicampur dengan minyak. Tiga persepuluh[a] untuk lembu jantan dan dua persepuluh untuk domba jantan harus kamu siapkan.
  rationale: Revisi menghapus tambahan interpretatif yang tidak eksplisit dalam teks sumber, mempertahankan sufiks jamak melalui “mereka,” dan memperjelas keterangan mengenai satuan ukuran. Makna, tingkat kepastian, dan sifat instruksional ayat tetap dipertahankan.
