base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: id
  text: Persembahan sajian mereka berupa tepung halus yang dicampur dengan minyak. Tiga persepuluh[a] untuk lembu jantan dan dua persepuluh untuk domba jantan harus kamu siapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani “tiga persepuluh” dan “dua persepuluh” menyingkat satuan sepersepuluh efa, yaitu takaran bahan kering yang digunakan dalam peraturan kurban.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Persembahan sajian yang menyertai semuanya
  rationale: Dalam peraturan kurban, מִנְחָה menunjuk pada persembahan berbahan biji-bijian atau tepung. Akhiran orang ketiga jamak merujuk secara kolektif pada hewan-hewan yang baru disebut; ungkapan ini menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa hewan-hewan itu pemilik persembahan.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk pada tepung bermutu yang digiling halus dan lazim dipakai untuk persembahan.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif ini menyatakan bahwa tepung tersebut disiapkan dengan mencampurkannya dengan minyak.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tiga persepuluh
  rationale: עִשָּׂרוֹן adalah satuan sepersepuluh, yang dalam peraturan kurban dipahami sebagai sepersepuluh efa. Bentuk ringkas teks dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: לַפָּר
  choice: untuk lembu jantan
  rationale: Nomina tunggal dengan kata sandang merujuk pada lembu jantan tertentu dalam ketentuan kurban sebelumnya.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: dan dua persepuluh
  rationale: Terjemahan ini mempertahankan kesejajaran dengan 'tiga persepuluh' dan tidak menambahkan satuan yang hanya tersirat dalam teks.
- source_word: לָאַיִל
  choice: untuk domba jantan
  rationale: Nomina tunggal dengan kata sandang merujuk pada domba jantan dalam rangkaian kurban tersebut.
- source_word: תַּעֲשׂוּ
  choice: harus kamu siapkan
  rationale: Dalam konteks petunjuk kurban, עשה menyatakan tindakan menyiapkan atau melaksanakan ketentuan. 'Siapkan' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi tindakan mempersembahkan.
