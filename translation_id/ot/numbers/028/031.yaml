  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: id
  text: Di samping kurban bakaran yang tetap[a] dan kurban sajian yang menyertainya, kamu harus mempersembahkan semuanya itu. Hewan-hewan itu harus tanpa cacat[b], beserta kurban curahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban bakaran terus-menerus” atau “kurban bakaran harian.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mereka harus tanpa cacat bagi kamu.” Yang dimaksud ialah hewan-hewan kurban yang harus bebas dari cacat.'
    reason: lexical_clarification
lexical_decisions:
- source_word: מִלְּבַד
  choice: Di samping
  rationale: Menunjukkan bahwa persembahan dalam ayat ini merupakan tambahan pada persembahan rutin yang sudah diwajibkan.
- source_word: עֹלַת הַתָּמִיד
  choice: kurban bakaran tetap
  rationale: תָּמִיד menunjuk pada kurban bakaran yang dipersembahkan secara teratur dan terus-menerus; 'tetap' ringkas dan mempertahankan sifat rutinnya.
- source_word: וּמִנְחָתוֹ
  choice: dan kurban sajian yang menyertainya
  rationale: Dalam peraturan kurban, מִנְחָה adalah persembahan berbahan hasil biji-bijian yang menyertai kurban bakaran. Frasa 'yang menyertainya' mengungkapkan pronomina posesif Ibrani secara alami.
- source_word: תַּעֲשׂוּ
  choice: kamu harus mempersembahkan semuanya itu
  rationale: Dalam konteks ibadah kurban, עשה dapat berarti menyiapkan atau melaksanakan persembahan. 'Mempersembahkan' paling jelas dalam bahasa Indonesia, sedangkan 'semuanya itu' menyatakan objek jamak yang tersirat.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Hewan-hewan itu harus tidak bercacat
  rationale: תְּמִימִם berbentuk maskulin jamak dan dalam hukum kurban menerangkan hewan yang bebas dari cacat. Unsur לָכֶם tidak diterjemahkan secara harfiah karena 'bagi kamu' terasa janggal, tetapi dicatat dalam catatan kaki.
- source_word: וְנִסְכֵּיהֶם
  choice: dan harus disertai kurban-kurban curahannya
  rationale: נֶסֶךְ adalah persembahan cair yang dicurahkan. Bentuk jamak dan pronomina jamak dipertahankan; struktur predikatif membuat hubungannya dengan persembahan sebelumnya jelas.
