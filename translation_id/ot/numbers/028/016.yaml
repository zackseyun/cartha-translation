  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: id
  text: Pada bulan pertama, pada hari keempat belas bulan itu, adalah Paskah bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Paskah milik Yahweh.” Kata depan Ibrani dapat menyatakan peruntukan atau kepunyaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: Pada bulan pertama
  rationale: Keterangan waktu Ibrani diterjemahkan secara langsung dan wajar. Konjungsi pembuka וּ tidak perlu dinyatakan karena bahasa Indonesia tidak memerlukan “dan” pada awal ketentuan ini.
- source_word: בְּ/אַרְבָּעָה עָשָׂר י֖וֹם לַ/חֹדֶשׁ
  choice: pada hari keempat belas bulan itu
  rationale: Mencerminkan rumus penanggalan Ibrani dengan bahasa Indonesia yang alami; “bulan itu” merujuk kembali kepada bulan pertama.
- source_word: פֶּסַח
  choice: Paskah
  rationale: “Paskah” adalah padanan Indonesia yang mapan dan tidak mempersempit makna menjadi korban saja atau perayaan saja.
- source_word: לַ/יהוָה
  choice: bagi Yahweh
  rationale: Kata depan לְ dapat menyatakan peruntukan, hubungan, atau kepunyaan. “Bagi Yahweh” mempertahankan gagasan bahwa Paskah itu ditujukan atau dikhususkan kepada Yahweh tanpa memaksakan satu nuansa saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Hubungan yang dinyatakan oleh לְ dalam לַיהוָה
  choice: bagi Yahweh
  alternative: milik Yahweh
  rationale: “Bagi” paling alami untuk menyatakan peruntukan atau pengkhususan, sedangkan kemungkinan nuansa kepunyaan tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “ada Paskah” mempertahankan sifat klausa Ibrani yang tidak memakai verba eksplisit, sedangkan istilah “Paskah” dibiarkan cukup luas untuk mencakup peringatan atau persembahan tanpa menentukan salah satunya.
