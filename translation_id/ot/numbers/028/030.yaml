  source_fidelity: 'Teks Indonesia menerjemahkan seluruh klausa Ibrani secara setia: שְׂעִיר עִזִּים אֶחָד sebagai “seekor kambing jantan,” לְכַפֵּר sebagai “untuk mengadakan pendamaian,” dan עֲלֵיכֶם sebagai “bagi kamu.” Tidak menambahkan kategori korban penghapus dosa ke teks utama, sehingga elipsis sumber dipertahankan.'
