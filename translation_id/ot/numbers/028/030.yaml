  text: and one male goat to make atonement for you[a].
translation:
  language: id
  text: dan seekor kambing jantan untuk mengadakan pendamaian bagi kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani berbentuk eliptis: “dan seekor kambing jantan untuk mengadakan pendamaian bagi kamu.” Berdasarkan konteks korban di bagian ini, fungsinya sebagai korban penghapus dosa tersirat.'
    reason: Menjelaskan kategori korban yang tersirat dalam konteks tetapi tidak disebutkan secara eksplisit dalam ayat.
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa konstruksi ini menunjuk pada kambing jantan. Bentuk 'seekor' secara alami memadukan penggolong bahasa Indonesia dengan אֶחָד, sedangkan 'kambing jantan' jelas dan lazim.
- source_word: אֶחָד
  choice: seekor
  rationale: Numeralia ini menyatakan satu ekor hewan; dalam bahasa Indonesia, 'seekor' merupakan bentuk alami dalam konteks ini.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Dalam konteks korban keimaman, כפר menunjuk pada tindakan ritual pendamaian. Ungkapan ini mempertahankan makna kultis tanpa menetapkan teori teologis tertentu.
- source_word: עֲלֵיכֶם
  choice: bagi kamu
  rationale: Bersama כפר, עַל menandai orang-orang yang menerima manfaat pendamaian; 'bagi kamu' wajar dan tidak terlalu menafsirkan.
theological_decisions:
- issue: Kategori korban tersirat tetapi tidak dinyatakan dalam klausa Ibrani
  choice: Tidak menambahkan 'sebagai korban penghapus dosa' ke dalam teks utama
  alternative: Menambahkan 'sebagai korban penghapus dosa' berdasarkan konteks daftar korban
  rationale: Teks Ibrani hanya menyebut seekor kambing jantan dan tujuan untuk mengadakan pendamaian. Konteks memang menyiratkan fungsi korban penghapus dosa, tetapi mempertahankannya dalam catatan kaki lebih setia pada bentuk eliptis sumber dan tidak menghapus ambiguitas yang asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konjungsi 'dan' dipertahankan karena ayat ini melanjutkan daftar pada konteks sebelumnya. Istilah 'pendamaian' mempertahankan corak ritual-teologis tanpa mempersempit makna כפר.
