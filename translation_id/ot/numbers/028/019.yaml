  naturalness: Bahasa draf umumnya alami dan jelas. “Kurban api, yaitu kurban bakaran” merupakan rumusan Indonesia modern yang lebih ringkas dan membedakan kedua istilah kurban. “Tanpa cacat” lebih idiomatis daripada “tidak bercacat” dalam konteks syarat hewan kurban.
  terminology: “Yahweh,” “kurban bakaran,” “lembu jantan,” “domba jantan,” dan “anak domba jantan” sesuai dengan teks dan register. “Kurban api” untuk אִשֶּׁה, dengan catatan penjelas, menghindari penetapan makna yang terlalu sempit.
