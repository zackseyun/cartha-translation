  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: id
  text: 'Kamu harus mempersembahkan kepada Yahweh kurban api[a], yaitu kurban bakaran: dua ekor lembu jantan, seekor domba jantan, dan tujuh ekor anak domba jantan berumur satu tahun; semuanya harus tanpa cacat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan yang dipersembahkan dengan api.” Istilah Ibrani ini adalah istilah teknis untuk persembahan yang berhubungan dengan api.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sebagai persembahan; 'mempersembahkan' alami dan tepat dalam bahasa Indonesia.
- source_word: אִשֶּׁה
  choice: kurban yang dibakar
  rationale: Istilah teknis ini menunjuk pada persembahan yang diserahkan melalui api. Pilihan ini mempertahankan unsur api tanpa menyamakannya dengan עֹלָה, yang langsung menyusul.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku Indonesia untuk kurban yang seluruhnya dibakar di atas mazbah.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai pihak yang menerima atau kepada siapa kurban itu dikhususkan; nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dua ekor sapi jantan
  rationale: Ungkapan Ibrani mengacu pada dua hewan jantan dari jenis lembu; bahasa Indonesia alami cukup menyatakannya sebagai 'sapi jantan' tanpa memasukkan usia yang tidak dinyatakan tegas.
- source_word: וְאַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל secara khusus berarti domba jantan dewasa dalam daftar kurban.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: dan tujuh ekor anak domba jantan berumur satu tahun
  rationale: כְבָשִׂים menunjukkan anak domba jantan, sedangkan בְּנֵי שָׁנָה menyatakan umur satu tahun.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Semuanya harus tidak bercacat
  rationale: Dalam konteks kurban, תְּמִימִם berarti bebas dari cacat. לָכֶם menyatakan tanggung jawab umat atas pemilihan hewan; nuansa ini tersampaikan secara alami oleh bentuk kewajiban 'harus'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan fungsi nama perjanjian tanpa menggantinya dengan gelar.
- issue: Hubungan אִשֶּׁה dan עֹלָה
  choice: '''kurban yang dibakar, yaitu kurban bakaran'''
  alternative: '''persembahan makanan, suatu kurban bakaran'''
  rationale: אִשֶּׁה adalah istilah kurban yang berkaitan dengan api, sedangkan עֹלָה menentukan jenis kurbannya. Rumusan dengan 'yaitu' membaca עֹלָה sebagai penjelas apposisional, sambil catatan kaki mempertahankan alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam hormat dan mudah dipahami. Penggolong 'ekor' dipakai secara alami dalam daftar hewan. Kalimat terakhir dipisahkan agar daftar panjang tetap jelas; 'semuanya' merujuk pada seluruh hewan yang disebutkan.
