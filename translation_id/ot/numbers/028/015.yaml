  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: id
  text: Dan seekor kambing jantan harus dipersembahkan kepada Yahweh sebagai kurban penghapus dosa[a], di samping kurban bakaran yang tetap beserta kurban curahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban penahiran.” Istilah Ibrani חַטָּאת dapat menunjuk kepada kurban yang berkaitan dengan kenajisan maupun dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa ini menunjuk kepada kambing jantan; penggolong 'seekor' dan keterangan jenis kelamin menghasilkan ungkapan Indonesia yang alami sekaligus mempertahankan rincian Ibrani.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan satu dipertahankan secara idiomatis melalui penggolong bilangan 'seekor'.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam peraturan persembahan, חַטָּאת menunjuk kepada kurban yang berkaitan dengan dosa dan penahiran. Terjemahan yang lazim dan mudah dipahami ditempatkan dalam teks, sedangkan alternatif sah dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה dialihaksarakan sebagai 'Yahweh'; preposisi ל dalam konteks persembahan menyatakan pihak yang menerima atau menjadi tujuan persembahan.
- source_word: עַל
  choice: di samping
  rationale: Dalam konteks ritual ini, עַל menyatakan tambahan terhadap kurban bakaran tetap, bukan posisi harfiah 'di atas'.
- source_word: עֹלַת הַתָּמִיד
  choice: kurban bakaran yang tetap
  rationale: Terjemahan ini mempertahankan gagasan persembahan yang berlangsung secara teratur tanpa mempersempit תָּמִיד menjadi keterangan yang tidak dinyatakan langsung di sini.
- source_word: יֵעָשֶׂה
  choice: harus dipersembahkan
  rationale: Walaupun bentuk dasarnya berarti 'dibuat/dilakukan', konteks kultis menuntut ungkapan Indonesia alami 'dipersembahkan'; 'harus' menyampaikan daya wajib bentuk imperfek instruksional.
- source_word: וְנִסְכּוֹ
  choice: beserta kurban curahannya
  rationale: נֶסֶךְ ialah persembahan cair yang dicurahkan. 'Kurban curahan' merupakan istilah Indonesia yang jelas, dan sufiks orang ketiga diterjemahkan dengan '-nya' untuk mengaitkannya dengan kurban bakaran tetap.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna חַטָּאת dalam konteks persembahan
  choice: kurban penghapus dosa
  alternative: kurban penahiran
  rationale: Istilah Ibrani dapat dipahami dengan penekanan pada dosa atau pada penahiran. Bacaan yang lebih dikenal digunakan dalam teks utama, sementara nuansa alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, dengan istilah ritual yang konsisten dan tanpa meniadakan ambiguitas leksikal חַטָּאת.
