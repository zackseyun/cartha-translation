  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif dari דבר menyatakan bahwa Yahweh berbicara. Dalam bahasa Indonesia Alkitabiah yang tetap modern, “berfirman” merupakan padanan wajar ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menunjukkan arah penerima ujaran, dan “kepada Musa” adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif לֵאמֹר memperkenalkan isi perkataan yang menyusul. “Demikian:” menghindari pengulangan kaku “berfirman ... dengan berkata” dan secara alami mengantar kutipan pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar, sementara vokalisasi historisnya tidak sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur formula ujaran Ibrani dipertahankan secara alami dengan “demikian:” sebagai pengantar bagi perkataan langsung pada ayat berikutnya.
