  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: id
  text: 'Kamu harus mempersembahkan kurban bakaran sebagai aroma yang menyenangkan[a] bagi Yahweh: dua ekor lembu jantan, seekor domba jantan, dan tujuh ekor anak domba jantan berumur setahun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai aroma yang menenangkan.” Rumusan kurban Ibrani לְרֵיחַ נִיחֹחַ juga dapat diterjemahkan “sebagai aroma yang menyenangkan” atau “sebagai aroma yang menenangkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa untuk dipersembahkan atau mempersembahkan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa ritual.
- source_word: עוֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk kurban yang dibakar seluruhnya; terjemahan etimologis seperti 'kurban kenaikan' akan mengaburkan jenis kurban tersebut.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Menyampaikan rumusan kurban yang menunjukkan bahwa persembahan itu diterima dengan senang oleh Allah, sambil tetap mempertahankan citra aromanya. Kemungkinan arti 'menenangkan' dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai 'Yahweh' dan memakai 'bagi' karena aroma kurban tersebut diarahkan kepada-Nya.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dua ekor sapi jantan dari kawanan sapi
  rationale: Mempertahankan jenis kelamin hewan dan klasifikasinya sebagai ternak sapi tanpa menambahkan keterangan usia muda yang tidak dinyatakan secara eksplisit.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: Padanan langsung dan alami bagi nama hewan kurban dalam bentuk tunggal.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: tujuh ekor anak domba jantan
  rationale: כְבָשִׂים menunjuk kepada anak domba jantan; jenis kelaminnya dipertahankan agar perincian kurban tetap tepat.
- source_word: בְּנֵי שָׁנָה
  choice: berumur setahun
  rationale: Ungkapan usia yang alami dalam bahasa Indonesia dan sesuai dengan penetapan umur hewan kurban.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna rumusan kurban לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  alternative: sebagai aroma yang menenangkan
  rationale: Pilihan utama mengungkapkan keberkenanan ilahi tanpa meniadakan citra aroma. Karena נִיחֹחַ juga dapat dipahami sebagai 'menenangkan', alternatif itu dipertahankan dalam catatan kaki dan tidak diputuskan secara tersembunyi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual 'kurban bakaran' dipertahankan karena sudah jelas bagi pembaca umum. Penggolong 'ekor' digunakan secara alami, dan susunan daftar mengikuti teks Ibrani.
