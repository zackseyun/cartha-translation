  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: id
  text: dan sepersepuluh efa tepung halus sebagai persembahan sajian yang dicampur dengan minyak untuk setiap anak domba, suatu kurban bakaran, aroma yang menyenangkan, persembahan yang dipersembahkan dengan api[a] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan makanan.”
    reason: Alternatif leksikal untuk אִשֶּׁה. Istilah ini secara harfiah berkaitan dengan persembahan melalui api, tetapi dalam penggunaan kultis juga dapat dipahami sebagai persembahan makanan.
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: dan sepersepuluh efa
  rationale: 'Pengulangan istilah ukuran memberi nuansa distributif dalam rangkaian kurban ini: sepersepuluh efa untuk setiap anak domba. Satuan ''efa'' dinyatakan agar ukuran tersirat itu jelas.'
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Istilah ini menunjuk pada tepung bermutu tinggi yang digunakan dalam persembahan; 'tepung terbaik' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks ibadah ini, kata tersebut adalah istilah teknis bagi persembahan dari hasil tanaman atau tepung, bukan sekadar pemberian umum.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Menyatakan bahwa tepung untuk persembahan itu dicampurkan dengan minyak.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk setiap anak domba
  rationale: Dalam konteks jumlah kurban yang telah ditetapkan, frasa ini bersifat distributif dan menentukan takaran bagi masing-masing anak domba.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah teknis bagi kurban yang dibakar seluruhnya; 'kurban bakaran' ringkas dan lazim dipahami.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Ungkapan kultis ini menyatakan bahwa kurban tersebut berkenan atau dapat diterima, dengan tetap mempertahankan citra aroma dalam teks Ibrani.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Kata kultis ini berkaitan dengan persembahan yang dipersembahkan melalui api. Pilihan ini mempertahankan unsur api tanpa menyiratkan secara berlebihan bahwa Allah memerlukan makanan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi. 'Yahweh' mempertahankan fungsi nama itu dan mengikuti bentuk transliterasi yang diterima secara luas.
- issue: Makna istilah kultis אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan berupa makanan
  rationale: Hubungan istilah ini dengan api paling langsung didukung oleh konteks kurban, tetapi kemungkinan pemahaman sebagai persembahan makanan tetap dicatat agar ketegangan leksikal tidak dihapus.
- issue: Ungkapan antropomorfis רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenteramkan
  rationale: Terjemahan mempertahankan citra indrawi teks tanpa menjelaskan secara dogmatis mekanisme penerimaan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan tetap mempertahankan hubungan antarklausa dan istilah teknis kurban. Ayat ini melanjutkan daftar ketentuan dari ayat sebelumnya, sehingga diawali dengan 'dan'.
