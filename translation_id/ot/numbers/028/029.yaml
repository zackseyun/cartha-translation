  text: sepersepuluh efa untuk setiap anak domba[a], untuk ketujuh anak domba itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepersepuluh, sepersepuluh untuk anak domba yang satu, untuk ketujuh anak domba itu.” Bahasa Ibrani memakai rumusan distributif yang berarti satu takaran sepersepuluh efa untuk masing-masing dari ketujuh anak domba tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: sepersepuluh efa
  rationale: 'Pengulangan bentuk tunggal ini secara harfiah berarti “sepersepuluh, sepersepuluh” dan berfungsi secara distributif: satu takaran sepersepuluh bagi tiap-tiap hewan. Dalam peraturan persembahan ini, takaran yang dimaksud ialah sepersepuluh efa; penyebutan “efa” membuat satuannya jelas dalam bahasa Indonesia.'
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk setiap anak domba
  rationale: Secara harfiah, “untuk anak domba yang satu.” Dalam rumusan distributif ini, “setiap anak domba” menyampaikan dengan wajar bahwa jumlah tersebut berlaku untuk masing-masing hewan.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: bagi ketujuh anak domba itu
  rationale: Frasa ini menunjuk pada keseluruhan kelompok yang menerima takaran per ekor. Kata “itu” mencerminkan artikel Ibrani dan menghubungkannya dengan tujuh anak domba yang telah disebutkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas yang sesuai dengan konteks daftar persembahan. Istilah ukuran “efa” dipertahankan sebagai istilah Alkitab yang umum, sedangkan ungkapan distributif Ibrani dialihkan secara alami menjadi “setiap”.
