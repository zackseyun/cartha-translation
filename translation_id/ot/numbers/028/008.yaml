source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: id
  text: 'Persembahkanlah anak domba yang kedua antara dua petang[a]. Sama seperti kurban sajian pagi dan kurban curahannya, demikianlah harus kaulakukan: sebagai persembahan api[b], aroma yang menyenangkan bagi Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “antara dua petang”; ungkapan tradisional ini sering dipahami sebagai “pada waktu senja”.
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban makanan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: anak domba yang kedua
  rationale: Dalam konteks kurban, כֶּבֶשׂ lazim menunjuk kepada anak domba; bentuk 'yang kedua' mempertahankan urutan dengan persembahan pagi.
- source_word: תַּעֲשֶׂה
  choice: persembahkanlah
  rationale: Walaupun secara dasar berarti 'melakukan/membuat', dalam petunjuk kurban padanan Indonesia yang alami ialah 'mempersembahkan'.
- source_word: בֵּין הָעַרְבָּיִם
  choice: pada waktu antara dua petang
  rationale: Ungkapan Ibrani dipertahankan secara cukup formal karena batas waktu tepatnya diperdebatkan; padanan idiomatis dicatat dalam catatan kaki.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: dengan kurban sajian ... seperti pada pagi hari
  rationale: מִנְחָה dalam konteks keimaman menunjuk khusus pada kurban sajian; susunan Indonesia dibuat alami sambil mempertahankan perbandingan dengan persembahan pagi.
- source_word: וּכְנִסְכּוֹ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ adalah persembahan cair yang dicurahkan; 'kurban curahan' jelas dan lazim dalam ragam Alkitab Indonesia.
- source_word: אִשֵּׁה
  choice: kurban yang dibakar
  rationale: Istilah ini menunjuk pada persembahan yang diberikan melalui api. Terjemahan ini mempertahankan unsur api tanpa menganggapnya sebagai makanan secara eksplisit.
- source_word: רֵיחַ נִיחֹחַ
  choice: suatu aroma yang menyenangkan
  rationale: Padanan ini mempertahankan metafora penciuman dan gagasan bahwa persembahan berkenan, dengan bahasa Indonesia modern.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sesuai bentuk nama perjanjian dalam sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menggunakan Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Ungkapan waktu בֵּין הָעַרְבָּיִם
  choice: antara dua petang
  alternative: pada waktu senja
  rationale: Arti temporal persis ungkapan ini diperdebatkan. Bentuk yang lebih harfiah dipertahankan dalam teks utama, sementara pemahaman idiomatis diberikan dalam catatan kaki.
- issue: Makna אִשֵּׁה
  choice: kurban yang dibakar
  alternative: kurban makanan; persembahan dengan api
  rationale: Padanan utama mempertahankan unsur api yang melekat pada istilah dan menghindari penetapan yang terlalu sempit bahwa istilah itu harus dipahami sebagai makanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif digunakan agar petunjuk ritual terdengar alami; istilah teknis 'kurban sajian' dan 'kurban curahan' dipertahankan demi ketepatan konteks keimaman.
