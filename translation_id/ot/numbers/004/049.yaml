base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: id
  text: Atas perintah Yahweh[a], mereka didata melalui Musa, masing-masing menurut tugas pelayanannya dan beban yang harus diangkutnya. Demikianlah mereka didata[b], seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Yahweh,” yaitu menurut perintah-Nya.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibrani di sini sulit. Dapat juga dipahami sebagai “penugasannya” atau “orang-orang yang didata/ditetapkan olehnya.”
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Atas titah Yahweh
  rationale: Ungkapan yang secara harfiah berarti “menurut mulut Yahweh” menyatakan bahwa tindakan itu dilakukan berdasarkan perintah-Nya. “Titah” ringkas, wajar, dan sesuai dengan suasana resmi ayat ini.
- source_word: פָּקַד אֹתָם
  choice: mereka didata
  rationale: Dalam konteks sensus dan penetapan pekerjaan orang Lewi, פקד menunjuk pada pencatatan atau pendataan resmi. Bentuk pasif mempertahankan subjek pelaku yang tidak dinyatakan secara eksplisit dalam bentuk verba Ibrani.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Secara harfiah “dengan tangan Musa”; ungkapan ini menunjukkan perantaraan atau pelaksanaan melalui Musa. Terjemahan idiomatis menghindari kesan bahwa yang dimaksud terutama ialah tangan secara fisik.
- source_word: אִישׁ אִישׁ
  choice: masing-masing
  rationale: Pengulangan distributif menekankan bahwa setiap laki-laki mendapat tugas dan beban angkutannya sendiri. Dalam konteks yang sudah jelas menunjuk kepada para laki-laki Lewi, “masing-masing” menyampaikan daya distributifnya secara alami.
- source_word: עַל עֲבֹדָתוֹ
  choice: menurut tugas pelayanannya
  rationale: עֲבֹדָה di sini adalah pekerjaan pelayanan yang ditetapkan dalam kaitan dengan Kemah Suci. “Menurut” mempertahankan hubungan distributif antara setiap orang dan pelayanannya.
- source_word: וְעַל מַשָּׂאוֹ
  choice: dan beban angkutannya
  rationale: מַשָּׂא adalah beban atau muatan yang harus dibawa. Gabungan “beban angkutan” memperjelas makna konkret dalam pemindahan perlengkapan Kemah Suci tanpa menghilangkan gagasan beban.
- source_word: וּפְקֻדָיו
  choice: Demikianlah mereka didata olehnya
  rationale: Bentuk yang sulit ini berasal dari פקד dan dalam konteks paling mungkin merujuk kembali kepada orang-orang yang didata oleh Musa. Terjemahan ini mempertahankan kaitannya dengan pendataan pada awal ayat, sementara catatan kaki mencatat kemungkinan makna penugasan.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: seperti yang diperintahkan Yahweh kepada Musa
  rationale: Klausa ini menyatakan bahwa pendataan dan pengaturan tugas dilaksanakan sesuai dengan perintah Yahweh kepada Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Hubungan pendataan dengan penugasan pelayanan
  choice: Teks utama memakai “didata”, dengan kemungkinan “ditugaskan” dijelaskan dalam catatan kaki
  alternative: mereka ditugaskan; orang-orang yang ditetapkan olehnya
  rationale: Akar פקד dapat mencakup pencatatan, pemeriksaan, dan penetapan tugas. Konteks pasal ini adalah sensus para pelayan yang sekaligus menerima tugas, sehingga ketegangan maknanya tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan khidmat. “Didata” dipilih sebagai istilah administratif yang mudah dipahami; “tugas pelayanan” dan “beban angkutan” menjaga konteks pekerjaan orang Lewi secara konkret. Nama ilahi ditransliterasikan sebagai “Yahweh”.
