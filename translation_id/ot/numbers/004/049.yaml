  naturalness: “Atas titah” dapat dipahami, tetapi bernuansa kerajaan/arkais dalam bahasa Indonesia modern. “Atas perintah” lebih baku dan langsung. “Beban angkutannya” juga agak berat dan berlebihan; “beban yang harus diangkutnya” lebih alami serta tetap konkret.
