  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: id
  text: Hitunglah juga keturunan Gerson[a] menurut rumah nenek moyang mereka, menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah, “Angkatlah kepala keturunan Gerson”; ungkapan ini berarti menghitung mereka atau mengadakan sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Hitunglah
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘angkatlah kepala’, tetapi dalam konteks administratif berarti menghitung atau mengadakan sensus. ‘Hitunglah’ menyampaikan perintah itu dengan alami dan tepat dalam bahasa Indonesia.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: keturunan Gerson
  rationale: Secara bentuk berarti ‘anak-anak lelaki Gerson’, tetapi dalam konteks silsilah dan sensus menunjuk kepada para keturunannya; ‘keturunan Gerson’ mencegah kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: גַּם הֵם
  choice: juga
  rationale: Menandai bahwa kelompok ini turut dihitung sesudah kelompok sebelumnya; ‘juga’ mempertahankan hubungan tambahan tersebut secara ringkas.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum leluhur mereka
  rationale: Ungkapan ini menunjuk kepada susunan kekerabatan berdasarkan garis ayah atau rumah leluhur. ‘Kaum leluhur’ mempertahankan dimensi genealogis tanpa memakai frasa Indonesia yang kaku.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Dalam konteks kesukuan, מִשְׁפָּחָה menunjuk kepada kelompok kekerabatan yang lebih luas daripada keluarga inti. ‘Kaum’ sesuai dengan struktur sosial yang dimaksud dan membedakannya dari keluarga modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif ‘Hitunglah’ dipilih agar jelas bagi pembaca umum; istilah kekerabatan dibuat alami sambil mempertahankan dua tingkat pengelompokan dalam teks Ibrani.
