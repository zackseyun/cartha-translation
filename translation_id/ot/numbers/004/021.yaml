  text: 'Lalu Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat ketika Allah menjadi subjek ujaran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap terlihat dan tidak diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל memperkenalkan orang yang dituju dalam tindakan berbicara; “kepada Musa” adalah bentuk Indonesia yang alami.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Rumus Ibrani yang secara harfiah berarti “dengan mengatakan” membuka isi perkataan langsung. “Kata-Nya” mempertahankan penanda pengantar ujaran dalam bahasa Indonesia yang wajar dan menyiapkan kelanjutan pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama, tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami sebagai pengantar firman yang berlanjut ke ayat berikutnya; tidak diperlukan catatan kaki karena nama “Yahweh” ditampilkan langsung dalam teks.
