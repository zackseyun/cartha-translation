  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: id
  text: Di atas meja Hadirat[a] haruslah mereka membentangkan sehelai kain biru, lalu di atasnya mereka harus menaruh pinggan-pinggan, cawan-cawan, mangkuk-mangkuk, dan kendi-kendi untuk persembahan curahan. Roti yang senantiasa tersedia[b] harus ada di atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meja Hadirat”; secara tradisional disebut “meja roti sajian.”
    reason: alternative_reading
  - marker: b
    text: Atau “roti yang terus-menerus.” Ini merujuk pada roti yang secara tetap tersedia di hadapan TUHAN di atas meja itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: meja Hadirat
  rationale: Secara harfiah berarti 'meja wajah/hadirat'. 'Meja Hadirat' mempertahankan ungkapan Ibrani dan makna peribadatannya tanpa memasukkan penafsiran tradisional ke dalam teks utama.
- source_word: יִפְרְשׂוּ
  choice: haruslah mereka membentangkan
  rationale: Kata kerja ini berarti membentangkan atau menghamparkan di atas sesuatu; 'membentangkan' wajar untuk tindakan menaruh kain di atas meja.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: sehelai kain biru
  rationale: תְּכֵלֶת menunjuk pada warna biru atau biru keunguan khas perlengkapan Kemah Suci. 'Biru' jelas dan tidak menentukan corak secara berlebihan.
- source_word: הַקְּעָרֹת
  choice: pinggan-pinggan
  rationale: Istilah ini menunjuk pada wadah saji yang relatif datar; 'pinggan' sesuai dengan konteks perlengkapan meja.
- source_word: הַכַּפֹּת
  choice: cawan-cawan
  rationale: Nama wadah ini dapat merujuk pada perkakas kecil dengan bentuk yang tidak sepenuhnya pasti. 'Cawan' dapat dipahami pembaca dan tidak terlalu mempersempit bentuknya.
- source_word: הַמְּנַקִּיֹּת
  choice: mangkuk-mangkuk
  rationale: Identitas tepat wadah ini tidak pasti dan terjemahan kuno maupun modern beragam. 'Mangkuk' merupakan padanan umum yang wajar di antara perkakas meja.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: kendi-kendi untuk persembahan curahan
  rationale: Frasa ini menyebut wadah yang berkaitan dengan pencurahan persembahan. 'Kendi-kendi' menyampaikan fungsi menuang, sedangkan 'persembahan curahan' mempertahankan makna kultis נֶסֶךְ.
- source_word: לֶחֶם הַתָּמִיד
  choice: roti yang senantiasa tersedia
  rationale: Frasa ini menunjuk pada roti yang terus tersedia di hadapan TUHAN. Bentuk ini lebih alami daripada 'roti senantiasa' dan mempertahankan gagasan keberadaan yang terus-menerus.
- source_word: עָלָיו יִהְיֶה
  choice: harus tetap ada di atas meja itu
  rationale: Secara dasar berarti 'harus ada di atasnya'. Dalam konteks roti yang senantiasa tersedia, 'tetap ada' menyampaikan keberadaan berkelanjutan yang tersirat, dan 'meja itu' memperjelas acuan pronomina.
