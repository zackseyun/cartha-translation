  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: id
  text: Lalu mereka harus menyingkirkan abu dari mezbah itu[a] dan membentangkan kain ungu di atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membersihkan mezbah itu” atau “menyingkirkan sisa abu berlemak dari mezbah itu.” Kata kerja Ibrani ini secara khusus mengacu pada penyingkiran sisa abu dari mezbah dalam konteks persembahan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: membersihkan ... dari abu
  rationale: Bentuk Piel dari דשׁן dalam konteks ibadah menunjuk pada penyingkiran sisa abu, termasuk residu berlemak, dari mezbah. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan tindakan pembersihan dengan menyingkirkan abu.
- source_word: הַמִּזְבֵּחַ
  choice: mezbah itu
  rationale: מִזְבֵּחַ secara baku berarti mezbah; penanda definit Ibrani diwakili secara alami oleh 'itu' dalam konteks benda kemah suci yang telah dikenal.
- source_word: וּפָרְשׂוּ
  choice: dan membentangkan
  rationale: פרשׂ berarti membentangkan atau menghamparkan. 'Membentangkan' sesuai untuk tindakan menaruh kain hingga menutupi suatu benda.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Preposisi עַל dengan sufiks pronominal merujuk pada penempatan kain di atas mezbah sebagai penutup.
- source_word: בֶּגֶד
  choice: kain
  rationale: Walaupun בגד sering berarti pakaian, di sini yang dimaksud ialah bahan tekstil untuk menutupi perlengkapan ibadah, sehingga 'kain' paling sesuai.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: אַרְגָּמָן menunjuk pada bahan berwarna ungu. Karena unsur tekstil sudah dinyatakan oleh 'kain', 'kain ungu' menyampaikan makna tanpa spesifikasi berlebihan.
