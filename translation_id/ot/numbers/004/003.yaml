  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: id
  text: dari usia tiga puluh tahun ke atas sampai lima puluh tahun, setiap orang yang datang[a] untuk menjalankan dinas[b] dan melakukan pekerjaan di Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masuk.” Kata Ibrani ini terutama berarti “datang,” tetapi dalam konteks tertentu dapat diterjemahkan “masuk.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “dinas” juga dapat berarti “tugas,” “pasukan,” atau “kelompok yang terorganisasi.” Di sini kata itu menunjuk pada dinas orang Lewi yang teratur.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: dari umur tiga puluh tahun ke atas
  rationale: Ungkapan Ibrani בֶּן + bilangan + שָׁנָה menyatakan usia; וָמַעְלָה menetapkan rentang mulai dari usia tersebut ke atas.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: sampai umur lima puluh tahun
  rationale: Terjemahan ini menyampaikan batas atas rentang usia secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כָּל בָּא
  choice: setiap orang yang masuk
  rationale: Partisip בָּא dapat berarti datang atau masuk; dalam konteks ini, 'masuk' berpadu secara alami dengan gagasan memasuki dinas yang ditetapkan.
- source_word: לַצָּבָא
  choice: dinas
  rationale: צָבָא dapat menunjuk kepada pasukan, kewajiban, atau dinas yang terorganisasi. Di sini konteksnya adalah dinas orang Lewi, bukan peperangan.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: untuk melakukan pekerjaan
  rationale: Gabungan infinitif dan nomina menyatakan tujuan, yaitu melaksanakan pekerjaan yang ditugaskan.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Ini mempertahankan sebutan baku bagi אֹהֶל מוֹעֵד serta cakupan lokasi pelayanan yang berkaitan dengan tempat kudus.
