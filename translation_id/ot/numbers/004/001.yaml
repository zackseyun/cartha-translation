  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa dan kepada Harun demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה), nama ilahi yang ditransliterasikan di sini sebagai “Yahweh”.'
    reason: Menjelaskan bentuk Ibrani di balik transliterasi nama ilahi.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif dari דבר memperkenalkan perkataan ilahi. “Berfirman” merupakan padanan Indonesia yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: kepada Musa dan kepada Harun
  rationale: Pengulangan preposisi אֶל di depan kedua nama dipertahankan untuk menunjukkan dengan jelas bahwa keduanya menjadi penerima firman.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Rumus Ibrani ini memperkenalkan isi perkataan yang menyusul. Dalam bahasa Indonesia, “demikian:” menyampaikan fungsi tersebut secara alami tanpa konstruksi yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Transliterasi “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar atau memilih bentuk “Yehova” yang didasarkan pada pembacaan gabungan yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “kepada” mengikuti koordinasi teks Ibrani, sedangkan “demikian:” berfungsi sebagai pengantar alami bagi perkataan langsung pada ayat berikutnya.
