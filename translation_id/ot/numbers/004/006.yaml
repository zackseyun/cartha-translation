  to: Mereka harus meletakkan di atasnya penutup dari kulit tahas[a], lalu membentangkan di atasnya sehelai kain yang seluruhnya berwarna biru, dan memasang tongkat-tongkat pengusungnya.
  rationale: Revisi mengganti “kayu-kayu pengusungnya” dengan “tongkat-tongkat pengusungnya” untuk mencerminkan בַּדָּיו secara lebih tepat dan alami. Frasa lokasi diperjelas menjadi “di atasnya” agar hubungan antara lapisan kulit dan kain biru tersampaikan langsung tanpa menambah rincian di luar teks. Catatan kaki dipertahankan karena makna tahas tetap diperdebatkan.
