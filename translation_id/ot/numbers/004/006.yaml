  terminology: “Kulit tahas” dengan catatan kaki merupakan pilihan yang baik karena identitas תַּחַשׁ tidak pasti. “Kain yang seluruhnya berwarna biru” memadai untuk בֶגֶד כְּלִיל תְּכֵלֶת. “Tongkat-tongkat pengusung” adalah padanan yang lebih tepat bagi בַּדָּיו.
