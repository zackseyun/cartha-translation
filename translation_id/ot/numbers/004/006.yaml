  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: id
  text: Mereka harus meletakkan di atasnya penutup dari kulit tahas[a], lalu membentangkan di atasnya sehelai kain yang seluruhnya berwarna biru, dan memasang tongkat-tongkat pengusungnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani תַּחַשׁ (tahas) tidak pasti artinya; mungkin menunjuk pada kulit hewan tertentu. Secara tradisional kata ini antara lain diterjemahkan sebagai kulit kambing, kulit lumba-lumba, atau kulit duyung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Mereka harus menaruh di atasnya
  rationale: Bentuk verba dalam rangkaian petunjuk ritual menyatakan kewajiban prosedural; frasa ini mempertahankan tindakan meletakkan penutup di atas tabut.
- source_word: כְּסוּי עוֹר תַּחַשׁ
  choice: penutup dari kulit tahas
  rationale: כְּסוּי berarti penutup, sedangkan identitas תַּחַשׁ tidak pasti. Transliterasi menghindari penetapan jenis hewan atau mutu kulit secara spekulatif, dengan ketidakpastian dijelaskan dalam catatan kaki.
- source_word: וּפָרְשׂוּ
  choice: lalu membentangkan
  rationale: Verba ini berarti membentangkan atau menghamparkan. 'Lalu' menyampaikan urutan prosedural secara alami.
- source_word: בֶגֶד כְּלִיל תְּכֵלֶת
  choice: sehelai kain yang seluruhnya berwarna biru
  rationale: בֶגֶד berfungsi sebagai kain penutup dalam konteks ini; כְּלִיל menekankan keseluruhan, dan תְּכֵלֶת menunjuk warna celupan biru hingga biru-ungu khas perlengkapan Kemah Suci.
- source_word: מִלְמָעְלָה
  choice: di bagian paling atas
  rationale: Ungkapan ini menunjukkan bahwa kain biru menjadi lapisan teratas. Pilihan ini mempertahankan urutan lapisan tanpa menyisipkan objek yang tidak dinyatakan.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: dan memasang kayu-kayu pengusungnya
  rationale: בַּדִּים adalah kayu-kayu pengusung. Dalam konteks petunjuk, 'memasang' secara alami mengungkapkan tindakan menempatkannya pada posisi yang semestinya.
