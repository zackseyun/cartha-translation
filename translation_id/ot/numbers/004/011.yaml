base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: id
  text: Di atas mezbah emas itu hendaklah mereka membentangkan sehelai kain biru, menutupinya dengan penutup dari kulit takhas[a], dan memasang tongkat-tongkat pengusungnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani takhas menunjuk pada hewan atau bahan yang identifikasinya tidak pasti. Usulan terjemahan mencakup “kulit halus,” “kulit duyung,” dan sebutan lain bagi kulit yang tahan lama.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: mazbah emas
  rationale: Frasa konstruksi ini secara harfiah berarti 'mazbah dari emas'. 'Mazbah emas' alami dalam konteks Kemah Suci dan mempertahankan istilah ritual yang lazim.
- source_word: יִפְרְשׂוּ
  choice: harus mereka bentangkan
  rationale: Verba פרשׂ berarti membentangkan atau menghamparkan. Susunan ini menyampaikan instruksi ritual dan mempertahankan subjek jamak.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: sehelai kain biru
  rationale: בגד di sini menunjuk pada kain, sedangkan תכלת adalah warna biru hingga biru-ungu khas perlengkapan Kemah Suci. 'Biru' jelas tanpa memastikan rona kunonya secara berlebihan.
- source_word: וְכִסּוּ אֹתוֹ
  choice: lalu menutupinya
  rationale: Bentuk perfektum berwaw melanjutkan urutan instruksi. 'Lalu' secara alami menunjukkan tindakan berikutnya.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: dengan penutup dari kulit yang halus
  rationale: מכסה berarti penutup dan עור berarti kulit. Identitas תחש tidak pasti; 'kulit yang halus' menghasilkan bahasa yang wajar tanpa menetapkan jenis hewan tertentu, sementara ketidakpastian dijelaskan dalam catatan kaki.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: dan memasang kayu-kayu pengusungnya pada tempatnya
  rationale: בדים ialah kayu atau galah untuk mengusung perlengkapan Kemah Suci. 'Memasang ... pada tempatnya' menyatakan tindakan yang dimaksud secara jelas.
