  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: id
  text: Mereka harus membungkus kandil itu beserta semua perkakasnya dengan penutup dari kulit takhas[a], lalu meletakkannya di atas tongkat pengusung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arti kata Ibrani תַּחַשׁ (takhas) tidak pasti. Kata ini mungkin menunjuk pada kulit hewan tertentu atau sejenis kulit samak yang tahan lama; terjemahan tradisional mengusulkan berbagai jenis kulit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: harus memasukkan
  rationale: Dalam rangkaian petunjuk ritual, bentuk ini menyatakan tindakan yang diwajibkan. Dengan אֶל מִכְסֵה, 'memasukkan ... ke dalam penutup' menyampaikan tindakan membungkus atau menempatkan di dalamnya secara alami.
- source_word: אֹתָהּ
  choice: kandil itu
  rationale: Pronomina feminin tunggal merujuk kepada kandil pada ayat sebelumnya. Menyebut kembali acuannya menghindari ketidakjelasan dalam bahasa Indonesia.
- source_word: כָּל כֵּלֶיהָ
  choice: semua perkakasnya
  rationale: כֵּלִים mencakup berbagai alat atau perlengkapan. 'Perkakas' sesuai dengan benda-benda yang digunakan bersama kandil.
- source_word: עוֹר תַּחַשׁ
  choice: kulit takhas
  rationale: Identitas תַּחַשׁ tidak pasti. Transliterasi mempertahankan ketidakpastian leksikal tanpa menebak jenis hewan atau mutu kulitnya.
- source_word: וְנָתְנוּ
  choice: lalu menaruhnya
  rationale: Pengulangan verba menandai langkah berikutnya dalam prosedur; 'lalu' menyatakan urutan, dan 'menaruh' wajar untuk penempatan di atas alat pengusung.
- source_word: עַל הַמּוֹט
  choice: di atas kayu pengusung
  rationale: מוֹט berbentuk tunggal dan menunjuk batang atau palang untuk mengusung. 'Kayu pengusung' mempertahankan bentuk tunggal serta fungsi pengangkutannya tanpa mengubahnya menjadi rangka.
