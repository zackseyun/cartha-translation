  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: id
  text: Mengenai keturunan Merari[a], daftarlah mereka menurut kaum-kaum mereka, menurut kelompok-kelompok keluarga dari pihak ayah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Merari”; dapat juga berarti “orang-orang Merari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “menurut rumah para ayah mereka,” suatu ungkapan genealogis untuk kelompok-kelompok keluarga berdasarkan garis ayah.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: keturunan Merari
  rationale: Secara harfiah berarti “anak-anak lelaki Merari,” tetapi dalam konteks pendataan suku menunjuk kepada garis keturunannya. “Keturunan Merari” menyampaikan makna kontekstual secara wajar tanpa membatasi rujukan pada anak-anak langsung Merari.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan dalam struktur suku. “Kaum” membedakannya dari keluarga inti dan cocok dengan konteks pendataan Israel.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut puak leluhur mereka
  rationale: Ungkapan Ibrani harfiahnya “menurut rumah bapa-bapa mereka” dan mengacu pada kelompok genealogis berdasarkan garis ayah. “Puak leluhur” mempertahankan gagasan unit kekerabatan turun-temurun dalam bahasa Indonesia yang lebih alami.
- source_word: תִּפְקֹד
  choice: daftarlah
  rationale: Dalam konteks sensus ini, פקד berarti menghitung dengan mencatat atau mendata. “Daftarlah” lebih jelas menunjukkan tindakan pencatatan resmi daripada sekadar menghitung.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek ini merujuk kembali kepada keturunan Merari dan dinyatakan secara eksplisit dalam terjemahan.
