translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Daftarlah” dipilih untuk konteks sensus resmi; “kaum” dan “puak leluhur” membedakan dua tingkat pengelompokan kekerabatan dalam teks Ibrani.
