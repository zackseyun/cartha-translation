  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: id
  text: dari usia tiga puluh tahun ke atas hingga usia lima puluh tahun, setiap orang yang datang untuk bertugas melakukan pekerjaan di Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: dari yang berumur tiga puluh tahun ke atas
  rationale: Ungkapan usia Ibrani ini menyatakan batas awal tiga puluh tahun; bentuk Indonesia ini alami dan tetap mempertahankan unsur 'ke atas'.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: sampai yang berumur lima puluh tahun
  rationale: Menyampaikan batas atas rentang usia secara jelas tanpa menambahkan penafsiran tentang inklusivitas batas tersebut.
- source_word: כָּל הַבָּא
  choice: setiap orang yang datang
  rationale: Mempertahankan arti partisip verba בוא dan tidak menggantinya dengan gagasan 'masuk' yang lebih interpretatif.
- source_word: לַצָּבָא
  choice: untuk menjalankan tugas
  rationale: Dalam konteks sensus orang Lewi, צָבָא menunjuk pada tugas atau dinas yang terorganisasi, bukan peperangan; 'menjalankan tugas' alami dalam bahasa Indonesia.
- source_word: לַעֲבֹדָה
  choice: dalam pekerjaan
  rationale: Membedakannya dari צָבָא yang mendahului sambil tetap menyampaikan pekerjaan pelayanan praktis; 'pelayanan' dapat menimbulkan nuansa gerejawi yang tidak diperlukan.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Padanan baku dan transparan bagi nama tempat kudus tersebut; preposisi 'di' menyatakan lingkup pekerjaan.
