translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pembedaan antara tugas terorganisasi (צָבָא) dan pekerjaan (עֲבֹדָה). Tidak diperlukan catatan kaki karena alternatif leksikal tidak menentukan tafsir teologis ayat ini.
