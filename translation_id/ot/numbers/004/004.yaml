  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: id
  text: Inilah tugas bani Kehat di dalam Kemah Pertemuan sehubungan dengan benda-benda yang mahakudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ruang Mahakudus.” Di sini frasa Ibraninya kemungkinan besar menunjuk pada benda-benda suci yang paling kudus, bukan hanya pada ruang terdalam Kemah Suci.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: Inilah
  rationale: Kata tunjuk feminin tunggal ini memperkenalkan dan menegaskan tugas yang akan dijabarkan; “Inilah” secara alami menyampaikan kopula yang tersirat dalam bahasa Ibrani.
- source_word: עֲבֹדַת
  choice: tugas
  rationale: Dalam konteks ini עֲבֹדָה menunjuk pada pekerjaan atau pelayanan khusus yang ditetapkan bagi bani Kehat. “Tugas” jelas dan wajar dalam bahasa Indonesia serta menonjolkan tanggung jawab yang diberikan.
- source_word: בְּנֵי קְהָת
  choice: bani Kehat
  rationale: Ungkapan ini mempertahankan gagasan keturunan atau kaum Kehat dengan bentuk Indonesia yang ringkas dan lazim dalam register Alkitab.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di dalam Kemah Pertemuan
  rationale: Preposisi ב menandai lingkup atau lokasi tugas mereka. “Kemah Pertemuan” merupakan padanan yang jelas bagi nama kemah suci tersebut.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: benda-benda yang mahakudus
  rationale: Dalam konteks pasal ini, frasa tersebut terutama menunjuk pada perlengkapan kudus yang harus ditangani dan diangkut bani Kehat. Penambahan “benda-benda” memperjelas rujukan kontekstual tanpa meniadakan kemungkinan bentuk frasa itu dipahami secara spasial.
theological_decisions:
- issue: Rujukan קֹדֶשׁ הַקֳּדָשִׁים
  choice: Benda-benda suci yang paling kudus dan dipercayakan kepada bani Kehat
  alternative: Ruang Mahakudus sebagai lokasi
  rationale: Konteks Bilangan 4 membahas penanganan dan pengangkutan perlengkapan Kemah Suci. Karena itu, rujukan kepada benda-benda mahakudus paling sesuai dengan alur langsung, sedangkan kemungkinan pengertian spasial tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bani Kehat” mempertahankan ungkapan kekerabatan secara ringkas; “sehubungan dengan” menghubungkan lingkup tugas dengan benda-benda mahakudus tanpa menjadikannya aposisi.
