lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: adalah
  rationale: Dalam konteks penyajian hasil sensus, bentuk ini berfungsi sebagai kopula yang memperkenalkan jumlah keseluruhan; “adalah” wajar dan jelas dalam bahasa Indonesia.
- source_word: פְּקֻדֵיהֶם
  choice: jumlah laki-laki yang terdaftar dari antara mereka
  rationale: Kata ini berasal dari פקד dalam konteks pendataan dan menunjuk kepada orang-orang yang didaftarkan dalam sensus. Konteks Bilangan 4 secara khusus menghitung laki-laki Lewi yang memenuhi syarat untuk pelayanan.
- source_word: שְׁמֹנַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וּשְׁמֹנִים
  choice: 8.580 orang
  rationale: Rangkaian bilangan Ibrani dijumlahkan menjadi delapan ribu lima ratus delapan puluh; angka dan kata “orang” menghasilkan ungkapan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Istilah sensus yang bergender
  choice: laki-laki yang terdaftar
  alternative: orang-orang yang terdaftar / mereka yang terhitung
  rationale: Konteks dekatnya menyatakan bahwa yang dihitung ialah laki-laki Lewi dalam rentang usia tertentu untuk pelayanan Kemah Pertemuan. Penyebutan “laki-laki” mempertahankan referen aktual tanpa mengubahnya menjadi ungkapan netral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami untuk laporan hasil sensus, sementara istilah “terdaftar” mempertahankan nuansa pendataan resmi dari teks Ibrani.
