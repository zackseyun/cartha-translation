  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: id
  text: dari yang berumur tiga puluh tahun ke atas sampai lima puluh tahun, setiap orang yang datang[a] untuk menjalankan tugas[b], untuk melakukan pekerjaan di Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang masuk untuk bertugas.” Bentuk partisip dalam bahasa Ibrani dapat menekankan orang-orang yang datang atau menghadirkan diri untuk tugas yang ditetapkan.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “tugas” dapat menunjuk pada dinas yang terorganisasi dan kadang-kadang bernuansa militer; di sini yang dimaksud ialah tugas orang Lewi.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: yang berumur tiga puluh tahun ke atas
  rationale: Ungkapan בֶּן + bilangan + שָׁנָה menyatakan umur; “berumur ... tahun” merupakan padanan Indonesia yang alami. “Ke atas” mempertahankan batas bawah yang inklusif.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: sampai lima puluh tahun
  rationale: Menyatakan batas atas rentang umur secara ringkas dan alami dalam bahasa Indonesia.
- source_word: כָּל הַבָּא
  choice: setiap orang yang datang
  rationale: Partisip בוא dipertahankan dengan arti dasarnya, yakni orang yang datang atau menghadirkan diri, tanpa mempersempitnya menjadi gerak masuk secara harfiah.
- source_word: לַצָּבָא
  choice: untuk menjalankan tugas
  rationale: Dalam konteks orang Lewi, צָבָא menunjuk pada tugas atau dinas yang terorganisasi, bukan pasukan militer dalam arti sempit.
- source_word: לַעֲבֹדָה
  choice: dan melakukan pekerjaan
  rationale: עֲבֹדָה berarti pekerjaan atau pelayanan. Rumusan ini membedakannya dari tugas terorganisasi yang dinyatakan oleh צָבָא, sambil menghasilkan kalimat Indonesia yang wajar.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: “Kemah Pertemuan” adalah padanan baku dan jelas untuk אֹהֶל מוֹעֵד; “di” mencerminkan preposisi בְּ tanpa memaksakan apakah pekerjaan berlangsung tepat di dalam atau pada kompleks kemah.
