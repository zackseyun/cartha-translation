base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: id
  text: Lalu Musa, Harun, dan para pemimpin umat itu menghitung keturunan Kehat menurut kaum-kaum mereka dan menurut rumah leluhur mereka.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendata” atau “melakukan sensus terhadap.” Kata kerja Ibrani ini dalam konteks lain juga dapat berarti “mengangkat,” tetapi di sini menunjuk pada penghitungan untuk tugas pelayanan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak orang Kehat,” yaitu kelompok keturunan Kehat.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani yang secara harfiah berarti “rumah leluhur” merupakan istilah kekerabatan tradisional Israel bagi rumah tangga leluhur atau kelompok keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: menghitung
  rationale: Dalam konteks sensus untuk tugas pelayanan di Bilangan 4, verba פקד menunjuk pada tindakan menghitung atau mendata orang, bukan mengangkat mereka ke suatu jabatan.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: para pemimpin umat itu
  rationale: נְשִׂיאִים adalah para pemimpin yang diakui dalam komunitas Israel, sedangkan הָעֵדָה menunjuk kepada umat atau komunitas Israel yang telah disebutkan dalam konteks.
- source_word: בְּנֵי הַקְּהָתִי
  choice: keturunan Kehat
  rationale: Ungkapan harfiahnya berkaitan dengan 'anak-anak orang Kehat'; dalam bahasa Indonesia, 'keturunan Kehat' menyampaikan hubungan genealogis itu secara alami dan jelas.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum
  rationale: מִשְׁפָּחָה dalam konteks sensus genealogis adalah kelompok kekerabatan di bawah tingkat suku; 'kaum' mempertahankan pembedaan dari unit rumah leluhur berikutnya.
- source_word: וּלְבֵית אֲבֹתָם
  choice: dan puak leluhur mereka
  rationale: בֵית אָבוֹת adalah istilah kekerabatan Israel bagi rumah atau kelompok keluarga berdasarkan garis leluhur. 'Puak leluhur' terdengar wajar dalam bahasa Indonesia dan tetap menandai unit genealogis tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ayat mengikuti alur Ibrani, tetapi idiom genealogis dialihkan secara alami. Istilah 'kaum' dan 'puak leluhur' dipakai untuk mempertahankan dua tingkat pengelompokan kekerabatan yang berbeda.
