source:
  edition: WLC
  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: id
  text: Seluruh pelayanan keturunan Gerson harus dilakukan menurut perintah Harun dan anak-anaknya[a], dalam segala barang yang mereka angkut dan dalam segala pekerjaan mereka. Kamu harus menugaskan kepada mereka, sebagai tanggung jawab[b], segala barang yang mereka angkut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Harun dan anak-anaknya”; ungkapan Ibrani ini berarti menurut perintah atau pengarahan mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebagai kewajiban yang dipercayakan kepada mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: menurut perintah
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'menurut mulut' menyatakan bahwa pekerjaan dilakukan sesuai perintah atau pengarahan Harun dan anak-anaknya.
- source_word: תִּהְיֶה כָּל עֲבֹדַת
  choice: seluruh tugas ... harus dilaksanakan
  rationale: Konstruksi kopular ini bersifat administratif-direktif. Rumusan Indonesia ini alami sekaligus mempertahankan nada kewajiban.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: keturunan Gerson
  rationale: Frasa harfiahnya 'anak-anak orang Gerson' menunjuk kepada kaum atau keturunan Gerson; 'keturunan Gerson' jelas dan wajar dalam bahasa Indonesia.
- source_word: לְכָל מַשָּׂאָם
  choice: dalam mengangkut
  rationale: Dalam konteks pemindahan Kemah Suci, מַשָּׂא berkaitan dengan barang bawaan atau tindakan mengangkut. Bentuk verbal Indonesia menghindari frasa kaku tanpa menghilangkan maknanya.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: dalam melakukan segala pekerjaan mereka
  rationale: עֲבֹדָה mencakup pekerjaan atau pelayanan yang ditugaskan. 'Pekerjaan' di sini membedakannya secara alami dari 'tugas' pada awal ayat sambil mempertahankan cakupannya.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: Kamu harus menetapkan bagi mereka
  rationale: פקד dalam konstruksi ini berarti menetapkan atau membebankan tanggung jawab. Bentuk 'kamu' mengikuti orang kedua jamak Ibrani yang merujuk kepada Harun dan anak-anaknya dalam konteks dekat.
- source_word: בְּמִשְׁמֶרֶת
  choice: sebagai tanggung jawab mereka
  rationale: מִשְׁמֶרֶת dapat berarti tugas, kewajiban, atau tanggung jawab yang dipercayakan. Pilihan ini jelas dalam bahasa Indonesia modern dan menjaga gagasan penugasan resmi.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: semua yang harus mereka angkut
  rationale: Frasa ini adalah objek langsung dari penetapan tugas dan menunjuk secara konkret kepada seluruh barang yang menjadi bagian angkutan mereka.
theological_decisions:
- issue: Pihak yang disapa oleh bentuk orang kedua jamak וּפְקַדְתֶּם
  choice: diterjemahkan 'Kamu' tanpa menambahkan nama pihak yang disapa
  alternative: menyebut secara eksplisit 'kalian, yaitu Harun dan anak-anaknya'
  rationale: Konteks mendukung Harun dan anak-anaknya sebagai pihak yang memberi penugasan, tetapi teks ayat tidak mengulang identitas subjek. Terjemahan tidak menambahkan penafsiran eksplisit yang melampaui bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dipecah menjadi dua kalimat agar instruksi administratif mudah dipahami. Istilah 'mengangkut' dan 'semua yang harus mereka angkut' mempertahankan konteks konkret pemindahan perlengkapan Kemah Suci; penanda catatan kaki [a] dan [b] ditempatkan dalam teks utama.
