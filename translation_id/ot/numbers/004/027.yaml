revisions:
- from: Seluruh tugas keturunan Gerson harus dilaksanakan menurut perintah Harun dan anak-anaknya[a], baik dalam mengangkut maupun dalam melakukan segala pekerjaan mereka. Kamu harus menetapkan bagi mereka semua yang harus mereka angkut sebagai tanggung jawab mereka[b].
  to: Seluruh pelayanan keturunan Gerson harus dilakukan menurut perintah Harun dan anak-anaknya[a], dalam segala barang yang mereka angkut dan dalam segala pekerjaan mereka. Kamu harus menugaskan kepada mereka, sebagai tanggung jawab[b], segala barang yang mereka angkut.
  rationale: Revisi memulihkan dua penyebutan מַשָּׂא sebagai “barang yang mereka angkut,” bukan sekadar kegiatan mengangkut. Struktur juga diperjelas agar “segala barang yang mereka angkut” menjadi objek yang ditugaskan kepada mereka sebagai tanggung jawab, sesuai dengan konstruksi וּפְקַדְתֶּם עֲלֵיהֶם בְּמִשְׁמֶרֶת אֵת כָּל מַשָּׂאָם. Catatan kaki tetap terjangkar tepat pada idiom עַל־פִּי dan istilah מִשְׁמֶרֶת.
