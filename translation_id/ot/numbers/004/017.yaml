  text: Lalu Yahweh berfirman kepada Musa dan kepada Harun, kata-Nya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol memajukan rangkaian narasi. Dalam konteks firman ilahi, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: אֶל menandai orang yang disapa; “Musa” ialah bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: וְאֶל אַהֲרֹן
  choice: dan kepada Harun
  rationale: Preposisi yang diulang dipertahankan agar kedua orang tersebut jelas menjadi penerima firman secara langsung; “Harun” ialah bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Rumus Ibrani ini memperkenalkan isi ucapan yang menyusul. “Kata-Nya” alami dalam narasi Indonesia dan menghindari bentuk kaku “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi YHWH. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “kepada” mempertahankan struktur sumber, sedangkan “kata-Nya” secara alami mengantar perkataan langsung pada ayat berikutnya.
