  to: Setelah Harun dan anak-anaknya selesai menutupi barang-barang kudus dan segala perlengkapan kudus[a], ketika perkemahan berangkat, sesudah itu bani Kehat datang untuk mengangkutnya. Namun, mereka tidak boleh menyentuh barang-barang kudus itu[b], supaya mereka tidak mati.[c] Inilah tugas pengangkutan bani Kehat di Kemah Pertemuan.
