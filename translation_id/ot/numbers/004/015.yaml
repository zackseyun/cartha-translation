  naturalness: Teksnya umumnya baku dan jelas. Namun, "Inilah muatan bani Kehat di Kemah Pertemuan" terdengar kurang idiomatis dan dapat mengaburkan bahwa מַשָּׂא juga menunjuk pada tanggung jawab pelayanan/pengangkutan. "Inilah tugas pengangkutan bani Kehat di Kemah Pertemuan" lebih alami serta sesuai konteks.
  terminology: '"Harun," "bani Kehat," dan "Kemah Pertemuan" konsisten dan layak. "Barang-barang kudus" secara konsisten dipakai untuk הַקֹּדֶשׁ dalam konteks larangan menyentuh dan juga dapat dipakai pada kemunculan pertama. Alternatif makna yang lebih luas dipelihara dalam catatan kaki.'
