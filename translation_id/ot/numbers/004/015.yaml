  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: id
  text: Setelah Harun dan anak-anaknya selesai menutupi barang-barang kudus dan segala perlengkapan kudus[a], ketika perkemahan berangkat, sesudah itu bani Kehat datang untuk mengangkutnya. Namun, mereka tidak boleh menyentuh barang-barang kudus itu[b], supaya mereka tidak mati.[c] Inilah tugas pengangkutan bani Kehat di Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "tempat kudus dan segala perlengkapannya." Istilah Ibrani pada bagian pertama dapat dipahami secara kolektif sebagai barang-barang kudus atau lebih luas sebagai tempat kudus.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: "tempat kudus." Kata Ibrani ini dapat merujuk secara kolektif kepada benda-benda kudus atau lebih luas kepada tempat kudus.'
    reason: alternative_reading
  - marker: c
    text: 'Secara lebih harfiah: "dan mereka akan mati." Teks Ibrani menyatakan akibat larangan itu secara langsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: selesai menutupi
  rationale: Gabungan verba dan infinitif menyatakan selesainya tindakan menutupi; bentuk ini alami dalam bahasa Indonesia dan mempertahankan aspek penyelesaian.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Pada kemunculan pertama, istilah ini paling wajar menunjuk kepada tempat suci yang beserta perlengkapannya sedang dipersiapkan untuk perjalanan.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: segala perlengkapan tempat kudus
  rationale: כְּלֵי mencakup berbagai perkakas, perabot, dan benda pelayanan; 'perlengkapan' menyampaikan cakupan itu secara alami.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: pada waktu perkemahan berangkat
  rationale: Konstruksi temporal ini menunjukkan saat perkemahan mulai berpindah; 'berangkat' merupakan ungkapan Indonesia modern yang jelas.
- source_word: וְאַחֲרֵי כֵן
  choice: barulah
  rationale: 'Kata ini menegaskan urutan prosedural: bani Kehat datang hanya setelah pekerjaan penutupan selesai.'
- source_word: בְנֵי קְהָת
  choice: bani Kehat
  rationale: '''Bani'' secara ringkas dan lazim menyatakan keturunan atau kelompok kekerabatan, bukan hanya anak kandung langsung.'
- source_word: לָשֵׂאת
  choice: untuk mengangkut semuanya
  rationale: Verba berarti membawa atau mengangkut. 'Semuanya' disuplai dari perlengkapan dan benda suci yang disebut sebelumnya agar rujukannya jelas dalam bahasa Indonesia.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: Namun, mereka tidak boleh menyentuh benda-benda kudus
  rationale: Dalam konteks pengangkutan, הַקֹּדֶשׁ dapat dipahami secara kolektif sebagai benda-benda sakral yang telah ditutupi. Catatan kaki mempertahankan kemungkinan rujukan yang lebih luas.
- source_word: וָמֵתוּ
  choice: supaya mereka tidak mati
  rationale: Dalam konteks larangan, akibat langsung dalam bahasa Ibrani berfungsi sebagai peringatan. Rumusan ini menyampaikan fungsi tersebut secara alami, sementara bentuk yang lebih harfiah dicatat.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Inilah muatan bani Kehat
  rationale: מַשָּׂא dapat berarti muatan yang diangkut maupun tanggung jawab pengangkutan. 'Muatan' mempertahankan gambaran konkret, dan alternatif tugas dicatat.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Preposisi בְּ paling langsung dipahami secara lokatif atau dalam lingkup pelayanan Kemah Pertemuan.
theological_decisions:
- issue: Rujukan הַקֹּדֶשׁ dalam larangan menyentuh
  choice: benda-benda kudus
  alternative: tempat kudus
  rationale: Konteks terdekat membicarakan perlengkapan sakral yang ditutupi untuk diangkut. Namun, nomina Ibrani itu juga dapat dipahami lebih luas sebagai tempat kudus, sehingga alternatifnya dipertahankan dalam catatan kaki.
- issue: Daya ungkap וָמֵתוּ sebagai akibat larangan
  choice: supaya mereka tidak mati
  alternative: dan mereka akan mati
  rationale: Pilihan utama menyampaikan fungsi peringatan secara idiomatis tanpa meniadakan bahwa teks Ibrani menyatakan akibat itu secara langsung; bentuk langsung diberikan dalam catatan kaki.
- issue: Makna מַשָּׂא sebagai objek atau tugas
  choice: muatan
  alternative: tugas pengangkutan
  rationale: Kata tersebut memuat ketegangan antara barang yang dipikul dan tanggung jawab memikulnya. Teks utama mempertahankan sisi konkret, sedangkan catatan menunjukkan sisi tugas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Bani Kehat' mempertahankan nuansa kelompok keturunan tanpa menimbulkan kesan bahwa yang dimaksud hanya anak kandung langsung. 'Kemah Pertemuan' dipakai sebagai istilah kultis yang jelas dan mapan.
