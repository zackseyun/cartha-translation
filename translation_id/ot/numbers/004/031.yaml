base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: id
  text: 'Inilah tanggung jawab pengangkutan mereka dalam seluruh pelayanan mereka di Kemah Pertemuan: papan-papan Kemah Suci,[a] palang-palangnya, tiang-tiangnya, dan alas-alasnya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerangka-kerangka Kemah Suci.” Istilah Ibrani ini dapat menunjuk pada papan atau bagian-bagian struktural Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Atau “soket-soketnya,” yaitu bagian dasar tempat tiang atau papan dipasang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Inilah
  rationale: Bentuk presentatif ini secara alami memperkenalkan perincian tugas dalam bahasa Indonesia; hubungan dengan konteks sebelumnya tetap tersirat.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: tanggung jawab mereka untuk mengangkut
  rationale: Gabungan ini menyatakan tanggung jawab yang ditetapkan mengenai barang-barang yang harus dibawa. Ungkapan verbal lebih alami daripada terjemahan harfiah 'tanggung jawab beban mereka'.
- source_word: לְכָל עֲבֹדָתָם
  choice: dalam seluruh pelayanan mereka
  rationale: Menunjukkan cakupan tugas mereka dalam pekerjaan Kemah Pertemuan, sambil mempertahankan nuansa pelayanan dari עֲבֹדָה.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Sebutan baku dan jelas bagi tempat kudus tersebut; 'di' menyatakan lingkup pelayanan.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: papan-papan rangka Kemah Suci
  rationale: קֶרֶשׁ menunjuk pada bagian kayu struktural. 'Papan-papan rangka' mempertahankan bentuk bendanya sekaligus menjelaskan fungsinya.
- source_word: וּבְרִיחָיו
  choice: kayu-kayu palangnya
  rationale: בְּרִיחַ adalah batang pengikat pada struktur Kemah Suci; 'kayu palang' jelas dan konkret dalam bahasa Indonesia.
- source_word: וְעַמּוּדָיו
  choice: tiang-tiangnya
  rationale: עַמּוּד menunjuk pada penyangga tegak; 'tiang' merupakan padanan Indonesia yang alami dalam konteks bangunan portabel.
- source_word: וַאֲדָנָיו
  choice: alas-alasnya
  rationale: אֶדֶן adalah bagian dasar tempat tiang atau papan rangka bertumpu atau terpasang. 'Alas' mudah dipahami tanpa kehilangan fungsi strukturalnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat inventaris dipertahankan, tetapi gabungan nomina Ibrani pada מִשְׁמֶרֶת מַשָּׂאָם diungkapkan secara idiomatis sebagai tanggung jawab untuk mengangkut. Istilah Kemah Pertemuan dan Kemah Suci dibedakan sesuai אֹהֶל מוֹעֵד dan מִשְׁכָּן.
