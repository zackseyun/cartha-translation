  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: id
  text: Inilah orang-orang yang terdaftar dari keluarga-keluarga keturunan Merari, yang dihitung oleh Musa dan Harun sesuai dengan perintah Yahweh[a] yang disampaikan melalui Musa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut mulut Yahweh,” yaitu “sesuai dengan perintah Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dengan tangan Musa,” yaitu “melalui Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Inilah orang-orang yang terdaftar
  rationale: Ungkapan pembuka ini memperkenalkan hasil pendataan. Dalam konteks sensus, פְקוּדֵי menunjuk kepada orang-orang yang didata; bentuk ini alami dalam bahasa Indonesia dan tidak menjadikannya suatu istilah abstrak.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: dari kaum-kaum keturunan Merari
  rationale: מִשְׁפְּחֹת menunjuk pada kelompok-kelompok kekerabatan, sehingga 'kaum-kaum' lebih tepat daripada keluarga inti. בְּנֵי secara harfiah berarti 'anak-anak laki-laki', tetapi dalam silsilah kelompok berarti 'keturunan'.
- source_word: פָּקַד
  choice: dihitung
  rationale: Dalam konteks pendataan orang Lewi, verba ini berarti menghitung atau mendata. 'Dihitung' mempertahankan hubungan maknanya dengan hasil pendaftaran yang disebut sebelumnya.
- source_word: עַל פִּי יְהוָה
  choice: sesuai dengan perintah Yahweh
  rationale: Secara harfiah ungkapan ini berarti 'menurut mulut Yahweh', tetapi sebagai idiom menyatakan bahwa tindakan itu dilakukan berdasarkan perintah Yahweh. Terjemahan idiomatis dipakai dalam teks utama, sedangkan citra Ibraninya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' dan tidak diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Secara harfiah berarti 'dengan/perantaraan tangan Musa'. Dalam pemakaian ini, בְּיַד menandai perantaraan atau penyampaian melalui Musa; 'melalui Musa' menyampaikan maksud idiom secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama יהוה, bukan kata benda atau gelar 'Tuhan'. Transliterasi 'Yahweh' mempertahankan perbedaan tersebut tanpa menambahkan penafsiran denominatif.
- issue: Hubungan antara perintah Yahweh dan perantaraan Musa
  choice: sesuai dengan perintah Yahweh melalui Musa
  alternative: menurut mulut Yahweh, dengan tangan Musa
  rationale: 'Dua idiom Ibrani dipertahankan maknanya tanpa menyiratkan bahwa Musa adalah sumber perintah itu: perintah berasal dari Yahweh dan disampaikan atau dilaksanakan melalui Musa. Bentuk harfiahnya dicatat agar citra teks sumber tetap dapat diaudit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kaum-kaum keturunan' menjaga latar kesukuan tanpa terdengar teknis, sedangkan idiom Ibrani dialihkan secara alami dalam teks utama dan bentuk harfiahnya disediakan dalam catatan kaki.
