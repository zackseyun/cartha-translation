base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: id
  text: Inilah tugas kaum-kaum bani Merari dalam seluruh pelayanan mereka di Kemah Pertemuan, di bawah pengawasan Itamar, anak imam Harun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “di tangan Itamar”, sebuah ungkapan yang berarti di bawah pengawasan atau pengarahan administratifnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Inilah tugas
  rationale: Konstruksi ini memperkenalkan ringkasan tugas yang ditetapkan. 'Inilah tugas' alami dalam bahasa Indonesia dan lebih tepat bagi konteks administratif daripada 'pelayanan' pada kemunculan pertama.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: kaum-kaum keturunan Merari
  rationale: מִשְׁפְּחֹת menunjuk kelompok-kelompok kekerabatan dalam susunan suku, sedangkan בְּנֵי dipakai secara kolektif bagi garis keturunan. 'Kaum-kaum keturunan' menyampaikan keduanya secara wajar.
- source_word: לְכָל עֲבֹדָתָם
  choice: dalam seluruh pelayanan mereka
  rationale: Ungkapan ini mencakup keseluruhan pelayanan atau kewajiban yang dipercayakan kepada mereka. 'Seluruh pelayanan mereka' mempertahankan kaitan leksikal dengan עֲבֹדָה tanpa menyiratkan pekerjaan umum semata.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Nama tempat ibadah ini diterjemahkan dengan padanan baku dan bermartabat; בְּ menyatakan lingkup atau lokasi pelayanan.
- source_word: בְּיַד
  choice: di bawah pengawasan
  rationale: Secara harfiah berarti 'di tangan', tetapi dalam konteks administratif idiom ini menyatakan pengawasan atau pengarahan. Padanan ini jelas dan alami tanpa mengubah fungsi Itamar.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Itamar, anak Imam Harun
  rationale: Urutan ini secara alami menunjukkan bahwa הַכֹּהֵן menerangkan Harun, sambil mempertahankan hubungan keturunan dan jabatan yang disebut teks.
