  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “haruslah kamu” mempertahankan nada instruktif teks serta dapat berfungsi sebagai sapaan kolektif; pengulangan bentuk jamak pada alas, patok, dan tali mengikuti rincian sumber.
