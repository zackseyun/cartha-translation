base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: id
  text: serta tiang-tiang di sekeliling pelataran, dengan alas-alasnya, patok-patoknya, dan tali-talinya, beserta segala perlengkapannya dan semua tugas yang terkait dengannya. Dengan menyebut nama, haruslah kamu menetapkan perlengkapan yang menjadi tanggung jawab mereka untuk diangkut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perlengkapan untuk tanggung jawab atas muatan mereka.”'
    reason: Frasa Ibrani כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם padat dan hubungan tepat antarunsurnya diperdebatkan; alternatif ini mempertahankan unsur perlengkapan, tanggung jawab, dan muatan tanpa memaksakan satu analisis sintaksis.
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: tiang-tiang pelataran di sekelilingnya
  rationale: עַמּוּדִים menunjuk pada tiang struktural, הֶחָצֵר pada pelataran, dan סָבִיב pada letaknya yang mengelilingi Kemah Suci. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi adverbial סָבִיב.
- source_word: אַדְנֵיהֶם
  choice: alas-alasnya
  rationale: Dalam konteks Kemah Suci, אֶדֶן ialah alas atau dudukan bagi tiang. 'Alas' lebih mudah dipahami pembaca umum daripada istilah teknis 'soket'.
- source_word: יְתֵדֹתָם
  choice: patok-patoknya
  rationale: יָתֵד menunjuk pada patok yang dipakai untuk menambatkan struktur tenda; 'patok' merupakan padanan Indonesia yang tepat dan lazim.
- source_word: מֵיתְרֵיהֶם
  choice: tali-talinya
  rationale: מֵיתָר berarti tali atau tambang, khususnya tali penambat tenda. 'Tali' alami dan sesuai dengan pasangan katanya, yaitu patok.
- source_word: לְכָל כְּלֵיהֶם
  choice: beserta segala perlengkapan
  rationale: כְּלִים memiliki cakupan luas—barang, alat, atau perlengkapan. Di sini yang dimaksud ialah perlengkapan terkait struktur pelataran, bukan khusus perkakas ibadah.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: segala pekerjaan yang berkaitan dengannya
  rationale: עֲבֹדָה dapat berarti pekerjaan, pelayanan, atau tugas. Dalam konstruksi ini, terjemahan tersebut menyatakan seluruh pekerjaan yang berkaitan dengan barang-barang yang baru disebut tanpa memberi kesan bahwa benda mati melakukan pelayanan.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: Menurut nama masing-masing, haruslah kamu menetapkan
  rationale: פקד dengan בְשֵׁמֹת menunjuk pada penetapan tanggung jawab secara individual, bukan sekadar penghitungan. 'Menurut nama masing-masing' mempertahankan unsur pembagian berdasarkan nama.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: barang-barang yang menjadi tanggung jawab mereka untuk diangkut
  rationale: Frasa Ibrani yang padat ini menggabungkan barang/perlengkapan, tanggung jawab penjagaan, dan muatan yang diangkut. Pilihan ini menyampaikan hubungan ketiganya secara alami tanpa menghilangkan gagasan tentang tanggung jawab individual.
