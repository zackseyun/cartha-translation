  yaml_path: translation/ot/numbers/004/040.yaml
  text: And those counted from them[a], by their clans, by their fathers’ houses, were two thousand six hundred and thirty.
translation:
  language: id
  text: Orang-orang dari antara mereka yang terdaftar, menurut kaum dan keluarga pihak ayah mereka, berjumlah 2.630 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: adalah
  rationale: Dalam rumusan sensus ini, היה berfungsi sebagai kopula yang menghubungkan kelompok terhitung dengan jumlah akhirnya; bentuk kini menghasilkan bahasa Indonesia yang alami.
- source_word: פְּקֻדֵיהֶם
  choice: jumlah orang yang dihitung dari antara mereka
  rationale: Bentuk dari פקד menunjuk kepada orang-orang yang didaftarkan atau dihitung dalam sensus. Frasa ini mempertahankan hubungan dengan kelompok yang baru disebut, sementara 'orang' memperjelas bahwa yang dihitung adalah anggota kelompok.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum
  rationale: Dalam konteks sensus Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah suku; 'kaum' adalah padanan Indonesia yang ringkas dan lazim dalam konteks silsilah.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga pihak ayah mereka
  rationale: Ungkapan ini menyatakan unit kekerabatan patrilineal. Pilihan ini lebih transparan bagi pembaca modern daripada terjemahan harfiah 'rumah leluhur mereka'.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: 2.630 orang
  rationale: Bilangan diterjemahkan secara langsung dengan format angka baku bahasa Indonesia; 'orang' menjelaskan satuan hitung secara alami.
