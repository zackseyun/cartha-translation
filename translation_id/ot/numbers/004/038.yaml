  yaml_path: translation/ot/numbers/004/038.yaml
  text: 'And the numbered men of the sons of Gershon, by their clans and by their fathers'' houses:'
translation:
  language: id
  text: 'Orang-orang dari keturunan Gerson yang terhitung, menurut kaum mereka dan menurut keluarga pihak ayah mereka:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Orang-orang ... yang terhitung
  rationale: Bentuk pasif substantival ini menunjuk kepada mereka yang didaftarkan atau dihitung dalam sensus; konteks ayat-ayat berikutnya menunjukkan bahwa yang dimaksud ialah para lelaki yang memenuhi syarat.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: dari keturunan Gerson
  rationale: Secara harfiah 'anak-anak lelaki Gerson', tetapi dalam konteks silsilah suku ungkapan ini secara alami berarti keturunan Gerson.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה menunjuk pada kelompok kekerabatan yang lebih besar daripada keluarga inti; 'kaum' mempertahankan pembedaan dari בית אב.
- source_word: וּלְבֵית אֲבֹתָם
  choice: dan menurut keluarga pihak ayah mereka
  rationale: Ungkapan ini secara harfiah berarti 'rumah para ayah mereka' dan merujuk pada unit keluarga patrilineal; rumusan Indonesia ini menyampaikan struktur tersebut dengan jelas.
