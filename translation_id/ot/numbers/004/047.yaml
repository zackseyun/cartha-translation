  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּ֗א לַ/עֲבֹ֨ד עֲבֹדַ֧ת עֲבֹדָ֛ה וַ/עֲבֹדַ֥ת מַשָּׂ֖א בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/047.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: id
  text: dari yang berumur tiga puluh tahun ke atas sampai yang berumur lima puluh tahun, yaitu setiap orang yang datang untuk melaksanakan pekerjaan pelayanan dan tugas mengangkut beban di Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “pekerjaan pelayanan dan pekerjaan mengangkut beban.” Bahasa Ibrani mengulangi bentuk dari kata benda yang sama untuk penekanan atau penggolongan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: dari yang berumur tiga puluh tahun ke atas
  rationale: Ungkapan ini menetapkan batas usia bawah. Bentuk Indonesia ini alami sekaligus mempertahankan gagasan 'ke atas' dalam idiom Ibrani.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: sampai yang berumur lima puluh tahun
  rationale: Frasa ini menetapkan batas usia atas dan menyambung secara alami dengan batas usia bawah.
- source_word: כָּל הַבָּא
  choice: setiap orang yang datang
  rationale: Partisip בוא dipertahankan secara cukup formal sebagai orang yang datang untuk menjalankan tugas, tanpa menafsirkannya sebagai kelayakan atau penugasan.
- source_word: לַעֲבֹד
  choice: untuk melaksanakan
  rationale: Infinitif ini menyatakan tujuan kedatangan. 'Melaksanakan' cocok dengan istilah pekerjaan berikutnya dan tidak meleburkan verba ini dengan nomina עֲבֹדָה.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: pekerjaan pelayanan
  rationale: Konstruksi berulang diterjemahkan dengan dua unsur yang wajar dalam bahasa Indonesia, sambil mempertahankan hubungan antara pekerjaan dan pelayanan.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: dan tugas mengangkut beban
  rationale: מַשָּׂא menunjuk pada beban atau muatan yang dibawa. 'Mengangkut beban' menyatakan tugas konkret itu dengan jelas; 'tugas' menghindari pengulangan 'pekerjaan' yang kaku namun tetap mewakili עֲבֹדַת.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi tempat suci tersebut; 'di' sesuai dengan preposisi Ibrani dan mencakup lingkup pelayanannya.
