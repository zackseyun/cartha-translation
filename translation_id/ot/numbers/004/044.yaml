  yaml_path: translation/ot/numbers/004/044.yaml
  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: id
  text: Jumlah orang yang dihitung dari antara mereka menurut kaum-kaum mereka adalah 3.200 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: adalah
  rationale: Bentuk wayyiqtol dari היה melanjutkan laporan hasil sensus. Dalam bahasa Indonesia, kopula "adalah" menyampaikan hasil tersebut secara alami tanpa perlu menerjemahkan waw sebagai "dan".
- source_word: פְקֻדֵיהֶם
  choice: jumlah orang yang dihitung dari antara mereka
  rationale: Dalam konteks sensus ini, bentuk dari פקד menunjuk kepada anggota kelompok yang telah didata. Ungkapan ini mempertahankan kaitan pronominal dengan kelompok yang baru disebut.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kekerabatan di bawah suku. "Kaum" merupakan istilah Indonesia yang wajar dalam konteks silsilah dan sensus, sedangkan bentuk ulang menyatakan jamak.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: 3.200 orang
  rationale: Angka tersebut secara langsung berarti tiga ribu dua ratus. Penambahan "orang" membuat satuan hitungan jelas dan alami dalam bahasa Indonesia tanpa mengkhususkan jenis kelamin yang tidak dinyatakan dalam ayat ini.
