  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקֹ֣ד אוֹתָ֑/ם כָּל הַ/בָּא֙ לִ/צְבֹ֣א צָבָ֔א לַ/עֲבֹ֥ד עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: id
  text: Dari yang berumur tiga puluh tahun ke atas sampai yang berumur lima puluh tahun, daftarkanlah mereka, yaitu setiap orang yang datang untuk menjalankan tugas[a] dan melakukan pekerjaan di Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjalani dinas”; ungkapan Ibrani memakai bahasa dinas militer secara kiasan untuk tugas yang terorganisasi di Kemah Pertemuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Dari yang berumur tiga puluh tahun ke atas sampai yang berumur lima puluh tahun
  rationale: Ungkapan Ibrani dengan בֶּן dan bilangan usia menyatakan rentang umur, bukan hubungan anak; bentuk Indonesia ini alami dan mempertahankan batas bawah serta batas atas.
- source_word: תִּפְקֹד אֹתָם
  choice: daftarlah mereka
  rationale: Dalam konteks pendataan orang Lewi, פקד menunjuk pada pencatatan atau penghitungan resmi. 'Daftarlah' menyampaikan tindakan administratif itu dengan jelas.
- source_word: כָּל הַבָּא
  choice: setiap orang yang datang
  rationale: Partisip dengan כָּל dipakai secara substantival dan distributif bagi setiap orang yang memenuhi syarat.
- source_word: לִצְבֹא צָבָא
  choice: untuk menjalankan tugas
  rationale: Konstruksi serumpun dari צבא menggambarkan pelaksanaan tugas yang teratur dan mengandung nuansa dinas, tetapi konteksnya adalah pelayanan Kemah Pertemuan, bukan peperangan harfiah.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: dan melakukan pekerjaan
  rationale: Infinitif dan nomina serumpun menekankan pelaksanaan pekerjaan yang ditetapkan. Terjemahan ini alami sekaligus mempertahankan kesejajaran dengan frasa sebelumnya.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Sebutan baku dan jelas bagi tempat suci tempat pertemuan; preposisi 'di' sesuai dengan בְּ.
theological_decisions:
- issue: Apakah bahasa צבא harus diterjemahkan dengan istilah militer yang eksplisit
  choice: Menampilkan makna dinas terorganisasi sebagai 'menjalankan tugas', dengan alternatif leksikal dijelaskan dalam catatan kaki
  alternative: menjalani dinas; bertugas dalam pasukan; berperang
  rationale: Konteks Bilangan 4 menetapkan pekerjaan orang Lewi di Kemah Pertemuan, bukan pertempuran. Pilihan ini menghindari kesan perang harfiah tanpa menghapus nuansa tugas atau dinas yang terdapat dalam kata Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kemah Pertemuan' dipertahankan sebagai istilah yang dikenal luas. Bentuk imperatif 'daftarlah' mencerminkan perintah orang kedua tunggal dalam teks Ibrani.
