  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: id
  text: Mereka harus mengangkut kain-kain Kemah Suci, Kemah Pertemuan beserta penutupnya, penutup dari kulit tahas[a] yang terletak paling atas, dan tirai pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis kulit atau bahan yang dimaksud oleh kata Ibrani tahas tidak diketahui dengan pasti. Terjemahan tradisional dan modern mengusulkan beberapa jenis kulit yang berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Mereka harus mengangkut
  rationale: Dalam konteks pemindahan perlengkapan tempat suci, נשׂא berarti membawa atau mengangkut. “Mengangkut” menyampaikan tugas logistik ini secara alami.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: kain-kain Kemah Suci
  rationale: יְרִיעֹת menunjuk pada lembaran atau bentangan kain pembentuk kemah, bukan terutama tirai jendela. “Kemah Suci” merupakan padanan Indonesia yang jelas dan bermartabat untuk מִשְׁכָּן.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan ini mempertahankan unsur fisik אֹהֶל, “kemah”, dan fungsi מוֹעֵד sebagai tempat pertemuan yang ditetapkan.
- source_word: מִכְסֵהוּ
  choice: beserta penutupnya
  rationale: Akhiran pronominal merujuk pada Kemah Pertemuan. “Beserta” mengalir alami dalam daftar benda yang harus diangkut.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: penutup dari kulit tahas
  rationale: Makna zoologis atau bahan תַּחַשׁ tidak pasti. Transliterasi “tahas” mempertahankan ketidakpastian sumber tanpa menebak spesies atau mutu kulit.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: yang terletak paling atas
  rationale: Ungkapan Ibrani menandai posisi penutup tersebut di atas lapisan lain. Padanan ini alami dan tidak menghasilkan pengulangan kaku seperti “di atasnya dari atas”.
- source_word: מָסַךְ פֶּתַח
  choice: tirai pintu masuk
  rationale: מָסָךְ adalah kain gantung yang menutupi atau menyekat bukaan. “Tirai pintu masuk” jelas dan sesuai konteks kemah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah tempat suci ditulis dengan huruf kapital sebagai nama atau sebutan khusus. Struktur daftar dipertahankan, sedangkan urutan lapisan dibuat alami tanpa menghilangkan keterangan bahwa kulit tahas berada paling atas.
