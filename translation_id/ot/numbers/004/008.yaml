  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: id
  text: Mereka harus membentangkan di atas semuanya itu sehelai kain merah tua, menutupinya dengan penutup dari kulit tahas[a], lalu memasang kayu-kayu pengusungnya pada tempatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: tahas; jenis hewan atau bahan yang dimaksud tidak diketahui dengan pasti. Terjemahan tradisional antara lain “kulit lumba-lumba,” “kulit teledu,” atau secara lebih umum “kulit bermutu tinggi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ
  choice: Mereka harus membentangkan
  rationale: Kata kerja פרשׂ dalam konteks ini menggambarkan tindakan membentangkan kain penutup di atas benda-benda kudus.
- source_word: עֲלֵיהֶם
  choice: di atas semuanya itu
  rationale: Akhiran jamak merujuk pada berbagai perlengkapan yang disebut dalam ayat sebelumnya; ungkapan ini mempertahankan acuan jamaknya secara alami dalam bahasa Indonesia.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: sehelai kain merah tua
  rationale: בגד dalam konteks ini adalah kain penutup, bukan pakaian. תולעת שני menunjuk pada bahan berwarna merah tua; kata 'benang' tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: וְכִסּוּ אֹתוֹ
  choice: menutupinya
  rationale: Bentuk objek tunggal dipertahankan dan paling wajar dipahami merujuk pada meja sebagai satu kesatuan, berbeda dari acuan jamak sebelumnya.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: dengan penutup dari kulit tahas
  rationale: מכסה adalah lapisan penutup. Identitas תחש tidak pasti, sehingga bentuk transliterasi 'tahas' menghindari identifikasi hewan atau bahan yang terlalu spesifik.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: lalu memasang kayu-kayu pengusungnya pada tempatnya
  rationale: בדים adalah batang atau kayu untuk mengusung perabot kudus. 'Memasang ... pada tempatnya' menyampaikan tindakan penempatan untuk pengangkutan yang tersirat dalam konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tindakan ritual dibuat jelas tanpa menghilangkan peralihan dari objek jamak ke objek tunggal dalam teks Ibrani. Istilah 'kayu-kayu pengusung' dipilih agar mudah dipahami sebagai batang pembawa, sedangkan 'tahas' mempertahankan ketidakpastian leksikal sumber.
