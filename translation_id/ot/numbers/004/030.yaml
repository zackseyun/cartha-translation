base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: id
  text: Hitunglah semua orang yang berusia tiga puluh sampai lima puluh tahun, yang datang untuk menjalankan tugas pelayanan[a], guna melakukan pekerjaan di Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “tugas pelayanan” juga dapat berarti “pasukan” atau “kelompok yang terorganisasi”; dalam konteks ini istilah itu menunjuk tugas pelayanan yang teratur, bukan pertempuran.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: yang berumur tiga puluh tahun ke atas sampai lima puluh tahun
  rationale: Ungkapan Ibrani ini menyatakan rentang usia. Bentuk Indonesia ini alami, jelas, dan tetap mempertahankan batas bawah serta batas atas yang disebutkan.
- source_word: תִּפְקְדֵם
  choice: Hitunglah mereka
  rationale: Dalam konteks pendataan orang Lewi, פקד berarti menghitung atau mendaftarkan mereka yang memenuhi syarat. 'Hitunglah mereka' mempertahankan bentuk perintah dan makna dasar tanpa memberi nuansa militer yang berlebihan.
- source_word: כָּל הַבָּא
  choice: setiap orang yang datang
  rationale: Partisip dengan כָּל menunjuk secara distributif kepada tiap orang yang memenuhi syarat. 'Setiap orang yang datang' alami dalam bahasa Indonesia dan dekat dengan bentuk sumber.
- source_word: לַצָּבָא
  choice: untuk bertugas
  rationale: צָבָא dapat menunjuk pasukan atau kelompok yang terorganisasi, tetapi dalam konteks ini mengacu pada tugas resmi orang Lewi. 'Untuk bertugas' menyampaikan fungsi tersebut tanpa menyiratkan pertempuran.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: melaksanakan pekerjaan
  rationale: Gabungan kata kerja dan nomina serumpun ini secara harfiah berkaitan dengan melakukan pelayanan atau pekerjaan. 'Melaksanakan pekerjaan' menghindari pengulangan yang janggal sambil mempertahankan maknanya.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi tempat kudus tersebut. Huruf kapital menandai nama khusus dalam bahasa Indonesia.
theological_decisions:
- issue: Kemungkinan nuansa militer dalam לַצָּבָא
  choice: untuk bertugas
  alternative: masuk dalam pasukan; menjalani dinas
  rationale: Ayat ini membicarakan pekerjaan orang Lewi di Kemah Pertemuan, bukan pertempuran. Pilihan ini mempertahankan gagasan tugas yang teratur dan resmi tanpa memasukkan gambaran militer yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan perintah untuk menghitung, rentang usia, dan tujuan tugas, sambil menghindari ungkapan harfiah yang kaku.
