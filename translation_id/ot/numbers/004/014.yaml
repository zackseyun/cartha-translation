  source_fidelity: 'Sebagian besar draf mengikuti teks Ibrani dengan baik: urutan tindakan, daftar perlengkapan, tindakan membentangkan penutup, dan pemasangan batang pengusung tetap terpelihara. Namun, “kulit tahan lama” menambahkan sifat daya tahan yang tidak dinyatakan oleh עוֹר תַּחַשׁ; identitas maupun sifat tepat bahan itu tidak pasti.'
  naturalness: Bahasanya umumnya baku dan mudah dipahami. “Bejana” lebih netral dan lebih lazim secara luas daripada “bokor” untuk מִזְרָקוֹת, sedangkan “batang-batang pengusung” lebih langsung daripada “kayu-kayu pengusung.”
  terminology: “Mezbah,” “perkakas,” “wadah bara,” “garpu,” dan “sekop” sesuai dengan register dan konteks. Istilah “kulit tahas” mempertahankan istilah Ibrani yang tidak pasti tanpa menetapkan sifat atau spesies secara spekulatif; penjelasannya ditempatkan dalam catatan kaki.
  issues:
