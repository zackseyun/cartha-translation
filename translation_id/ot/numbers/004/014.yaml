    issue: “Kulit tahan lama” menafsirkan עוֹר תַּחַשׁ sebagai kulit yang berciri tahan lama.
    rationale: Teks hanya menyebut kulit tahas; makna taḥash diperselisihkan. Terjemahan tersebut menambahkan kualitas bahan yang tidak eksplisit dalam sumber dan tidak sepenuhnya selaras dengan catatan kaki yang mengakui ketidakpastian.
  - severity: low
    issue: “Bokor-bokor” terlalu khusus secara budaya untuk מִזְרָקוֹת.
    rationale: Istilah Ibrani menunjuk bejana/baskom ritual, tetapi tidak mengharuskan jenis wadah khusus yang diasosiasikan dengan “bokor.” “Bejana-bejana” menjaga keluasan makna dan register formal.
