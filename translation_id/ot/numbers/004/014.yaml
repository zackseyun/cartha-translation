  to: 'Kemudian mereka harus menaruh di atasnya segala perkakasnya yang dipakai untuk melayani di mezbah itu: wadah-wadah bara, garpu-garpu, sekop-sekop, dan bejana-bejana—segala perkakas mezbah. Sesudah itu, mereka harus membentangkan di atasnya penutup dari kulit tahas[a] dan memasang batang-batang pengusungnya.'
