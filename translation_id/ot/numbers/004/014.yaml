  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: id
  text: 'Kemudian mereka harus menaruh di atasnya segala perkakasnya yang dipakai untuk melayani di mezbah itu: wadah-wadah bara, garpu-garpu, sekop-sekop, dan bejana-bejana—segala perkakas mezbah. Sesudah itu, mereka harus membentangkan di atasnya penutup dari kulit tahas[a] dan memasang batang-batang pengusungnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis kulit yang dimaksud oleh kata Ibrani taḥash tidak diketahui dengan pasti. Kata itu juga pernah dipahami sebagai kulit kambing, kulit lumba-lumba atau dugong, maupun jenis kulit bermutu lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: Kemudian mereka harus menaruh
  rationale: Bentuk ini melanjutkan urutan petunjuk. 'Menaruh' alami dalam bahasa Indonesia dan tepat untuk penempatan perkakas di atas mezbah.
- source_word: כָּל כֵּלָיו
  choice: segala perkakasnya
  rationale: כְּלִי mencakup berbagai alat atau perlengkapan. 'Perkakas' konkret dan sesuai bagi alat-alat pelayanan mezbah.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: yang dipakai untuk melayani di mezbah itu
  rationale: שרת dalam konteks ini menunjuk pada pelayanan ibadah. Pengulangan pronomina Ibrani diperjelas secara alami dengan 'mezbah itu'.
- source_word: הַמַּחְתֹּת
  choice: wadah-wadah bara
  rationale: מַחְתָּה adalah wadah untuk membawa bara atau api; pilihan ini lebih tepat daripada 'pedupaan', yang dapat membatasi fungsinya pada dupa.
- source_word: הַמִּזְלָגֹת
  choice: garpu-garpu
  rationale: Istilah ini menunjuk pada alat bercabang menyerupai garpu; terjemahan sederhana ini tetap konkret tanpa menambahkan fungsi yang tidak dinyatakan.
- source_word: הַיָּעִים
  choice: sekop-sekop
  rationale: יעים adalah alat untuk menyekop atau memindahkan abu, sehingga 'sekop' merupakan padanan modern yang jelas.
- source_word: הַמִּזְרָקֹת
  choice: bokor-bokor
  rationale: מִזְרָק menunjuk pada bejana upacara, antara lain untuk darah atau cairan. 'Bokor' mempertahankan nuansa bejana ritual dan menghindari kesan terlalu domestik dari 'mangkuk'.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: segala perkakas mezbah
  rationale: Frasa ini merangkum daftar sebelumnya. Pengulangan 'perkakas' menjaga konsistensi dengan כֵּלָיו.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: mereka harus membentangkan di atasnya penutup
  rationale: פרשׂ berarti membentangkan. Susunan ini mempertahankan tindakan membentangkan dan nomina 'penutup' secara eksplisit.
- source_word: עוֹר תַּחַשׁ
  choice: kulit tahan lama
  rationale: Identitas תַּחַשׁ tidak pasti. Padanan umum ini menyampaikan fungsi kulit sebagai bahan pelindung tanpa menetapkan jenis hewan secara spekulatif; ketidakpastian dicatat dalam catatan kaki.
- source_word: וְשָׂמוּ בַדָּיו
  choice: dan memasang kayu-kayu pengusungnya
  rationale: בַּדִּים dalam konteks perabot Kemah Suci adalah batang atau kayu untuk mengusung. 'Memasang' sesuai dengan penempatannya agar mezbah siap diangkut.
