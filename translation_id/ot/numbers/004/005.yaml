base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: id
  text: Ketika perkemahan berangkat, datanglah Harun dan anak-anaknya, lalu mereka harus menurunkan tirai penyekat itu dan menutupi tabut kesaksian[a] dengan tirai itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih tradisional: “tabut perjanjian”. Namun, kata Ibrani di sini berarti “kesaksian”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: harus masuk
  rationale: Kata kerja tunggal ini diikuti subjek gabungan dan verba-verba jamak; dalam konteks petunjuk ritual, bahasa Indonesia wajar memakai 'harus masuk' bagi Harun dan anak-anaknya.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Ketika perkemahan berangkat
  rationale: Infinitif dengan בְּ menyatakan keadaan waktu. 'Perkemahan berangkat' mempertahankan metonimia Ibrani dan jelas menunjuk awal perjalanan.
- source_word: וְהוֹרִדוּ
  choice: menurunkan
  rationale: Bentuk kausatif dari ירד menyatakan tindakan menurunkan atau melepaskan tirai dari tempatnya dalam proses pembongkaran.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: tirai penyekat
  rationale: פָּרֹכֶת adalah tirai bagian dalam, sedangkan הַמָּסָךְ menekankan fungsinya sebagai penyekat. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan kekhususan bendanya.
- source_word: וְכִסּוּ בָהּ
  choice: lalu menutupi ... dengan tirai itu
  rationale: כסה berarti 'menutupi'; penyebutan ulang 'tirai itu' memperjelas acuan pronomina feminin dan fungsi instrumentalnya.
- source_word: אֲרֹן הָעֵדֻת
  choice: tabut kesaksian
  rationale: Teks Ibrani memakai עֵדוּת, 'kesaksian', bukan בְּרִית, 'perjanjian'; karena itu terjemahan mengikuti istilah sumber.
theological_decisions:
- issue: Istilah tradisional bagi אֲרֹן הָעֵדֻת
  choice: tabut kesaksian
  alternative: tabut perjanjian
  rationale: Terjemahan mempertahankan kata עֵדוּת ('kesaksian') yang benar-benar terdapat dalam ayat dan tidak menggantinya dengan ungkapan tradisional yang memakai konsep leksikal berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Harus' menyampaikan daya instruksional konteks; 'tirai penyekat' lebih alami daripada konstruksi harfiah yang kaku. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
