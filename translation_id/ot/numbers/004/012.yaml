revisions:
- from: Kemudian mereka harus mengambil semua perlengkapan pelayanan yang mereka gunakan untuk melayani di tempat kudus. Mereka harus menaruh semuanya di atas kain biru, menutupinya dengan penutup dari kulit takhas[a], lalu meletakkannya di atas batang pengusung[b].
  to: Kemudian mereka harus mengambil semua perlengkapan pelayanan yang mereka gunakan untuk melayani di tempat kudus. Mereka harus menaruh semuanya ke dalam kain biru, menutupinya dengan penutup dari kulit takhas[a], lalu menaruh semuanya pada galah pengusung[b].
  rationale: Revisi membetulkan relasi “ke dalam kain biru” sesuai preposisi Ibrani dan memperhalus istilah pengangkutan. Transliterasi “takhas” serta catatan ketidakpastian maknanya dipertahankan. Pengulangan “semuanya” pada tindakan terakhir menjelaskan bahwa yang diletakkan pada galah ialah perlengkapan yang telah dibungkus, selaras dengan rujukan jamak dalam terjemahan audit bahasa Inggris.
