base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: id
  text: Kemudian mereka harus mengambil semua perlengkapan pelayanan yang mereka gunakan untuk melayani di tempat kudus. Mereka harus menaruh semuanya ke dalam kain biru, menutupinya dengan penutup dari kulit takhas[a], lalu menaruh semuanya pada galah pengusung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani תָּחַשׁ (takhas) tidak diketahui secara pasti. Kata itu mungkin menunjuk pada kulit hewan tertentu atau pada sejenis kulit olahan yang bermutu atau tahan lama.
    reason: lexical_alternative
  - marker: b
    text: Atau “di atas usungan.” Bahasa Ibrani memakai bentuk tunggal yang berarti “batang” atau “galah,” tetapi dalam konteks ini istilah tersebut mungkin menunjuk pada perangkat untuk mengusung barang-barang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Kemudian mereka harus mengambil
  rationale: Bentuk waw berurutan dalam rangkaian petunjuk ritual menyatakan tindakan berikutnya; “kemudian” memperjelas urutan, sedangkan “harus” menyampaikan sifat perintah.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: semua perlengkapan pelayanan
  rationale: כְּלִי dapat berarti perkakas, wadah, atau perlengkapan. Dalam konteks ini, “perlengkapan pelayanan” mencakup berbagai benda yang dipakai dalam pelayanan kemah suci tanpa membatasi bentuknya.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: yang mereka gunakan untuk melayani
  rationale: Ungkapan ini secara harfiah menunjuk kepada benda-benda yang dengannya mereka melayani. Rumusan Indonesia ini alami serta mempertahankan fungsi benda-benda tersebut dalam pelayanan kudus.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: קֹדֶשׁ di sini menunjuk kepada ruang atau kawasan suci tempat perlengkapan itu digunakan. “Tempat kudus” mempertahankan cakupan istilah tanpa secara khusus menyamakannya dengan ruang terdalam.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: kain biru
  rationale: בֶּגֶד dalam konteks pembungkusan berarti kain, sedangkan תְּכֵלֶת menunjuk pada bahan berwarna biru atau biru keunguan khas perlengkapan kemah suci. “Kain biru” jelas dan wajar dalam bahasa Indonesia.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: penutup dari kulit takhas
  rationale: Identitas תָּחַשׁ tidak pasti. Transliterasi “takhas” menghindari penetapan jenis hewan atau mutu kulit yang tidak dapat dipastikan, sementara catatan kaki menjelaskan persoalan leksikalnya.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: lalu meletakkannya di atas batang pengusung
  rationale: מוֹט berbentuk tunggal dan berarti batang atau galah untuk membawa beban. “Batang pengusung” mempertahankan bentuk tunggal dan fungsi pengangkutannya; kemungkinan bahwa istilah itu menunjuk pada perangkat pengusung dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada petunjuk ritual yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dipahami. Istilah “takhas” dipertahankan karena jenis kulitnya tidak pasti, dan ketidakpastian itu dijelaskan dalam catatan kaki.
