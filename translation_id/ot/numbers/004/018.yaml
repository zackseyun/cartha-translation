  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: id
  text: Janganlah kamu melenyapkan suku kaum keluarga orang Kehat dari antara orang Lewi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Janganlah kamu membinasakan suku kaum keluarga orang Kehat dari antara orang Lewi.” Kata kerja Ibrani dapat berarti “melenyapkan” atau “membinasakan”; “kaum keluarga” juga dapat diterjemahkan “kelompok-kelompok keluarga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּכְרִיתוּ
  choice: Janganlah kamu membuat ... terputus
  rationale: Bentuk larangan dengan verba Hifil dari כרת menyatakan tindakan menyebabkan kelompok itu terputus atau binasa. Susunan ini mempertahankan unsur kausatif dan ambiguitas ungkapan Ibrani.
- source_word: שֵׁבֶט
  choice: suku
  rationale: Dalam konteks silsilah dan pembagian orang Lewi, kata ini menunjuk pada kelompok kesukuan.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Bentuk jamak konstruktus menunjuk pada kelompok-kelompok kekerabatan dalam garis Kehat. 'Kaum-kaum' lebih tepat daripada keluarga inti dan tetap mudah dipahami.
- source_word: הַקְּהָתִי
  choice: Kehat
  rationale: Bentuk nisbah tunggal dipakai secara kolektif bagi kelompok keturunan Kehat; dalam frasa 'kaum-kaum Kehat', nama leluhur secara alami menyatakan afiliasi kelompok.
- source_word: מִתּוֹךְ
  choice: dari antara
  rationale: Menyatakan pemisahan dari dalam kelompok yang lebih besar.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Padanan baku dan alami dalam bahasa Indonesia untuk kelompok keturunan Lewi.
theological_decisions:
- issue: Daya larangan mengenai nasib kaum Kehat
  choice: Larangan agar para penerima perintah tidak menyebabkan kelompok Kehat terputus dari antara orang Lewi.
  alternative: Larangan umum agar kaum Kehat tidak dimusnahkan.
  rationale: Ayat ini tidak menyebut secara langsung bagaimana mereka dapat terputus; konteks berikutnya mengaitkannya dengan bahaya kematian saat menangani benda-benda kudus. Terjemahan tidak memasukkan mekanisme tersebut ke dalam ayat dan mempertahankan cakupan ungkapan Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat. Bentuk 'Janganlah kamu' mempertahankan larangan yang tegas kepada penerima jamak tanpa menjadi terlalu arkais. Istilah 'kaum-kaum' dipilih untuk kelompok kekerabatan yang lebih luas daripada keluarga inti.
