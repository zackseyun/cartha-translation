  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: id
  text: Orang-orang yang terhitung di antara mereka menurut kaum-kaum mereka berjumlah dua ribu tujuh ratus lima puluh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: adalah
  rationale: Bentuk wayyiqtol dari היה meneruskan laporan hasil sensus. Dalam bahasa Indonesia, kopula “adalah” menghasilkan kalimat yang alami tanpa menambahkan penekanan yang tidak ada dalam teks.
- source_word: פְקֻדֵיהֶם
  choice: jumlah orang yang terhitung dari antara mereka
  rationale: Dalam konteks sensus, bentuk ini menunjuk kepada mereka yang didaftarkan atau dihitung. Ungkapan ini mempertahankan nuansa pasif/resultatif; “orang” dipakai sebagai unsur generik yang diperlukan agar konstruksi Indonesia jelas.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kekerabatan atau kaum dalam susunan suku Israel. “Kaum-kaum” membedakannya dari keluarga inti dan sesuai dengan konteks pencatatan sensus.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: dua ribu tujuh ratus lima puluh
  rationale: Bilangan Ibrani diterjemahkan utuh dalam bentuk kata dan mempertahankan jumlah tepat 2.750.
