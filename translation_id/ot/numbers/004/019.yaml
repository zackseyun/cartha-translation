review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama karena יָבֹאוּ berarti “datang,” bukan secara spesifik “masuk”; terjemahan “harus masuk” menambahkan arah/gerak yang tidak dinyatakan. “Tetap hidup” juga menambahkan nuansa keberlanjutan yang tidak eksplisit dalam וְחָיוּ. Revisi mempertahankan fungsi preskriptif bentuk imperfek melalui “harus datang.”
  naturalness: 'Teks revisi memakai susunan yang lebih alami dan jelas dalam bahasa Indonesia baku: “menetapkan setiap orang pada tugasnya dan muatannya.” Ini menghindari susunan draft “menugaskan mereka masing-masing pada tugasnya,” yang kurang lancar dan kurang jelas dalam cakupan distributifnya.'
  terminology: “Benda-benda yang paling kudus” sesuai konteks perlengkapan kudus yang diangkut dan mempertahankan alternatif spasial dalam catatan kaki. “Muatan” mempertahankan arti konkret מַשָּׂא dalam konteks pengangkutan. Nama Harun serta istilah tugas dipertahankan.
  issues:
  - severity: medium
    issue: “Harun dan anak-anaknya harus masuk” menerjemahkan יָבֹאוּ terlalu sempit.
    rationale: Kata kerja בוא berarti “datang” dan ayat ini sendiri tidak menyebut lokasi yang harus dimasuki. “Masuk” mungkin cocok menurut konteks lebih luas, tetapi bukan tuntutan teks ayat ini.
  - severity: low
    issue: “Tetap hidup” menambahkan aspek keberlanjutan.
    rationale: וְחָיוּ berarti “mereka hidup/akan hidup”; tambahan “tetap” tidak diperlukan untuk menyampaikan kontras dengan “tidak mati.”
  - severity: low
    issue: Konstruksi “menugaskan mereka masing-masing pada tugasnya dan barang yang harus diangkutnya” kurang idiomatis.
    rationale: Ungkapan tersebut dapat diperjelas dengan “menetapkan setiap orang pada tugasnya dan muatannya,” yang tetap mencerminkan penetapan individual atas pelayanan dan beban angkut.
  revised_text: Namun, lakukanlah hal ini bagi mereka agar mereka hidup dan tidak mati ketika mereka mendekati benda-benda yang paling kudus:[a] Harun dan anak-anaknya harus datang dan menetapkan setiap orang[b] pada tugasnya dan muatannya.
