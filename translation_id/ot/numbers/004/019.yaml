  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: id
  text: Namun, lakukanlah hal ini bagi mereka agar mereka hidup dan tidak mati ketika mereka mendekati benda-benda yang paling kudus:[a] Harun dan anak-anaknya harus datang dan menetapkan setiap orang[b] pada tugasnya dan muatannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “Ruang Mahakudus” atau “tempat yang paling kudus”. Dalam konteks ini, kemungkinan besar yang dimaksud ialah benda-benda kudus yang harus diangkut.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “orang demi orang”, yaitu setiap orang secara individual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Namun, lakukanlah hal ini bagi mereka
  rationale: 'Konjungsi dan demonstrativa membuka petunjuk yang berlawanan dengan bahaya pada ayat sebelumnya. Frasa dengan ל dipahami secara benefaktif: tindakan ini dilakukan bagi orang Kehat.'
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: agar mereka tetap hidup dan tidak mati
  rationale: Rangkaian ini menyatakan tujuan atau hasil dari perintah tersebut; 'tetap hidup' wajar dalam konteks ancaman kematian.
- source_word: בְּגִשְׁתָּם
  choice: ketika mereka mendekati
  rationale: Infinitif dengan בְּ menyatakan keadaan temporal, sedangkan 'mendekati' mempertahankan nuansa mendekat dalam konteks ibadah.
- source_word: אֶת קֹדֶשׁ הַקֳּדָשִׁים
  choice: benda-benda yang paling kudus
  rationale: Dalam konteks pengangkutan oleh bani Kehat, ungkapan ini paling mungkin menunjuk pada perlengkapan kudus yang harus mereka angkut, bukan semata-mata sebuah ruang.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: Harun dan anak-anaknya harus masuk
  rationale: Bentuk imperfek berfungsi sebagai ketentuan, sehingga 'harus' menyampaikan daya preskriptifnya; 'masuk' cocok dengan tindakan para imam memasuki area untuk mengatur tugas.
- source_word: וְשָׂמוּ אוֹתָם
  choice: dan menugaskan mereka
  rationale: Secara idiomatis, tindakan 'menempatkan' setiap orang pada pelayanan dan muatannya berarti memberikan penugasan tertentu.
- source_word: אִישׁ אִישׁ
  choice: masing-masing
  rationale: Pengulangan distributif berarti setiap laki-laki secara individual; konteks dan pronomina 'mereka' sudah menunjukkan kelompok laki-laki Lewi.
- source_word: עַל עֲבֹדָתוֹ
  choice: pada tugasnya
  rationale: עֲבֹדָה dalam konteks Lewi menunjuk pada pelayanan atau pekerjaan yang ditetapkan; 'tugas' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: וְאֶל מַשָּׂאוֹ
  choice: dan barang yang harus diangkutnya
  rationale: מַשָּׂא di sini konkret, yakni muatan yang menjadi tanggung jawab seseorang dalam pengangkutan; frasa ini lebih jelas daripada 'beban', yang dapat terdengar kiasan.
theological_decisions:
- issue: Rujukan קֹדֶשׁ הַקֳּדָשִׁים
  choice: benda-benda yang paling kudus
  alternative: Ruang Mahakudus / tempat yang paling kudus
  rationale: Konteks terdekat membahas perlengkapan kudus yang telah ditutupi para imam dan kemudian diangkut bani Kehat. Namun, karena ungkapan Ibraninya juga dapat dipakai secara spasial, kemungkinan itu dicatat dalam catatan kaki.
- issue: Jenis kelamin dalam אִישׁ אִישׁ
  choice: mereka masing-masing
  alternative: masing-masing laki-laki
  rationale: Rujukannya memang laki-laki Lewi. Dalam bahasa Indonesia, pronomina sebelumnya sudah mengacu pada kelompok itu, sedangkan 'masing-masing' menyampaikan daya distributif tanpa menghasilkan ungkapan yang kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'lakukanlah' mempertahankan nada perintah, sedangkan 'harus masuk' menyampaikan ketentuan resmi tanpa memakai gaya hukum yang terlalu arkais. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
