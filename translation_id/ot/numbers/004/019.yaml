revisions:
- from: Namun, lakukanlah hal ini bagi mereka agar mereka tetap hidup dan tidak mati ketika mereka mendekati benda-benda yang paling kudus:[a] Harun dan anak-anaknya harus masuk dan menugaskan mereka masing-masing[b] pada tugasnya dan barang yang harus diangkutnya.
  to: Namun, lakukanlah hal ini bagi mereka agar mereka hidup dan tidak mati ketika mereka mendekati benda-benda yang paling kudus:[a] Harun dan anak-anaknya harus datang dan menetapkan setiap orang[b] pada tugasnya dan muatannya.
  rationale: Revisi menghapus penambahan makna “masuk” dan “tetap,” sambil mempertahankan nada ketentuan dalam “harus datang.” Frasa penugasan disusun ulang agar alami dalam bahasa Indonesia dan tetap menyatakan bahwa Harun serta anak-anaknya menetapkan tiap laki-laki Lewi pada pelayanan dan muatan masing-masing. Catatan kaki dan penandanya tetap mencatat alternatif yang relevan.
