  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibagi menjadi dua agar jelas bagi pembaca umum, tanpa menghilangkan hubungan antara pelayanan kaum Gerson dan pengawasan Itamar.
