base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: id
  text: Inilah pelayanan keluarga-keluarga keturunan Gerson di Kemah Pertemuan. Tanggung jawab mereka[a] berada di bawah pengawasan Itamar[b], anak Harun sang imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tugas mereka”; istilah Ibrani yang dipakai dapat menunjuk pada kewajiban atau tanggung jawab yang dipercayakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di tangan Itamar,” suatu ungkapan yang berarti di bawah pengawasan atau wewenangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Inilah pelayanan
  rationale: Ungkapan ini memperkenalkan penetapan tugas. “Pelayanan” menyampaikan pekerjaan yang ditugaskan dalam konteks Kemah Pertemuan tanpa nuansa gerejawi yang tidak terdapat dalam teks.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: kaum-kaum keturunan Gerson
  rationale: מִשְׁפְּחֹת menunjuk pada kelompok-kelompok kekerabatan, sedangkan בְּנֵי menyatakan garis keturunan. “Kaum-kaum keturunan Gerson” alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: “Kemah Pertemuan” merupakan padanan baku bagi אֹהֶל מוֹעֵד; preposisi “di” dapat menyatakan tempat sekaligus lingkup pelayanan.
- source_word: וּמִשְׁמַרְתָּם
  choice: Tanggung jawab mereka
  rationale: מִשְׁמֶרֶת dalam konteks ini berarti kewajiban, tugas, atau tanggung jawab yang dipercayakan kepada seseorang. “Tanggung jawab” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּיַד אִיתָמָר
  choice: di bawah pengawasan Itamar
  rationale: Secara harfiah berarti “di tangan Itamar,” tetapi ungkapan Ibrani ini menyatakan pengawasan atau wewenang. Padanan idiomatis dipakai dalam teks utama, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Itamar, anak Imam Harun
  rationale: Padanan ini mempertahankan nama, hubungan ayah-anak, dan identifikasi Harun sebagai imam secara ringkas dan alami.
