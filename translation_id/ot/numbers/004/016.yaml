revisions:
- from: Yang menjadi tanggung jawab Eleazar, anak Imam Harun, ialah minyak untuk penerangan,[a] dupa harum, persembahan sajian yang tetap,[b] dan minyak pengurapan. Ia juga bertanggung jawab atas seluruh Kemah Suci dan segala yang ada di dalamnya, yakni tempat kudus[c] dan segala perlengkapannya.[d]
  to: Tugas pengawasan yang dipercayakan kepada Eleazar, anak Imam Harun, meliputi minyak untuk penerangan,[a] dupa harum, persembahan sajian yang tetap,[b] dan minyak pengurapan, serta pengawasan atas seluruh Kemah Suci dan segala yang ada di dalamnya—tempat kudus[c] dan segala perlengkapannya.[d]
