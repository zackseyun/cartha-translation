  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: id
  text: Tugas pengawasan yang dipercayakan kepada Eleazar, anak Imam Harun, meliputi minyak untuk penerangan,[a] dupa harum, persembahan sajian yang tetap,[b] dan minyak pengurapan, serta pengawasan atas seluruh Kemah Suci dan segala yang ada di dalamnya—tempat kudus[c] dan segala perlengkapannya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “minyak penerangan”; maksudnya minyak yang dipakai untuk penerangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan sajian yang terus-menerus.” Kata Ibrani yang dipakai dapat menyatakan sesuatu yang tetap, teratur, atau terus berlangsung.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di tempat kudus.” Preposisi Ibrani dapat bernuansa tempat; dalam susunan kalimat ini frasa tersebut juga dapat dipahami sebagai perincian tentang Kemah Suci dan isinya.
    reason: source_ambiguity
  - marker: d
    text: “Perlengkapan” juga dapat diterjemahkan “bejana-bejana” atau “perkakas-perkakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: tanggung jawab / bertanggung jawab atas
  rationale: Kata ini menunjuk pada tugas pengawasan yang dipercayakan kepada seseorang. Ungkapan Indonesia ini wajar dan mencakup unsur penugasan serta pengawasan.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: minyak untuk penerangan
  rationale: Mempertahankan hubungan tujuan dalam frasa Ibrani tanpa mempersempit rujukannya secara eksplisit menjadi minyak pelita.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: dupa harum
  rationale: Mengungkapkan dupa yang dibuat dari bahan-bahan aromatik dalam bahasa Indonesia yang ringkas dan alami.
- source_word: מִנְחַת הַתָּמִיד
  choice: persembahan sajian yang tetap
  rationale: מִנְחָה adalah persembahan sajian, sedangkan תָּמִיד menyatakan keberlangsungan atau keteraturan; 'tetap' tidak menambahkan frekuensi 'setiap hari' yang tidak dinyatakan langsung oleh frasa ini.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak pengurapan
  rationale: Padanan Indonesia yang lazim dan tepat bagi minyak yang dipakai dalam pengurapan kudus.
- source_word: כָּל הַמִּשְׁכָּן
  choice: seluruh Kemah Suci
  rationale: Dalam konteks Bilangan, מִשְׁכָּן menunjuk pada Kemah Suci; 'seluruh' menyampaikan cakupan כָּל.
- source_word: בְּקֹדֶשׁ וּבְכֵלָיו
  choice: yakni tempat kudus dan segala perlengkapannya
  rationale: Penutup ini dipahami sebagai perincian tentang lingkup tanggung jawab atas Kemah Suci. 'Perlengkapan' cukup luas untuk mencakup bejana, perkakas, dan benda-benda pelayanan.
theological_decisions:
- issue: Struktur nominal dan pengulangan פְקֻדַּת
  choice: Kalimat pertama memakai 'yang menjadi tanggung jawab ... ialah', lalu pengulangan istilah itu dinyatakan dengan 'Ia juga bertanggung jawab atas'.
  alternative: 'Pengulangan kedua dapat dibaca secara aposisional sebagai rangkuman: ''tanggung jawab atas seluruh Kemah Suci ...''.'
  rationale: Bahasa Ibrani tidak menyatakan kopula dan susunannya agak aposisional. Pemecahan menjadi dua kalimat memperjelas hubungan sintaksis tanpa mengubah lingkup tugas Eleazar atau menambahkan gagasan teologis.
- issue: Hubungan בְּקֹדֶשׁ וּבְכֵלָיו dengan klausa sebelumnya
  choice: 'Dipahami sebagai penjelasan cakupan: ''yakni tempat kudus dan segala perlengkapannya''.'
  alternative: Preposisi בְּ dapat diterjemahkan lebih harfiah sebagai 'di tempat kudus dan pada/dengan perlengkapannya'.
  rationale: Dalam konteks daftar tanggung jawab, pembacaan penjelas menghasilkan bahasa Indonesia yang alami. Catatan kaki mempertahankan bentuk preposisional dan kemungkinan nuansa lokatif dari teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Kemah Suci', 'persembahan sajian', dan 'minyak pengurapan' dipakai sebagai istilah ibadah yang mapan. Struktur Ibrani yang padat dipecah menjadi dua kalimat agar jelas, sementara ambiguitas penting dipertahankan dalam catatan kaki.
