  - severity: low
    issue: Kata 'yakni' terlalu tegas menetapkan hubungan penutup sebagai identifikasi semata.
    rationale: Frasa בְּקֹדֶשׁ וּבְכֵלָיו memiliki preposisi dan sintaks yang padat. Pembacaan 'tempat kudus dan segala perlengkapannya' dapat dipakai dalam teks utama, tetapi catatan perlu menjelaskan bahwa bentuk Ibrani juga dapat bernuansa lokatif.
