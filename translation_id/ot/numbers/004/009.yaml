base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: id
  text: Kemudian mereka harus mengambil sehelai kain biru[a] dan menutupi kaki pelita untuk penerangan, beserta pelita-pelitanya, penjepit-penjepitnya, wadah-wadah baranya, dan segala perkakas minyaknya yang mereka gunakan untuk melayaninya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain biru-ungu”. Kata Ibrani תְּכֵלֶת menunjuk pada bahan celup khas yang digunakan dalam perlengkapan Kemah Suci; corak warnanya dapat dipahami sebagai biru hingga biru-ungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: sehelai kain biru
  rationale: בֶּגֶד berarti kain atau pakaian; dalam konteks pembungkusan perlengkapan Kemah Suci, 'kain' paling tepat. תְּכֵלֶת menunjuk pada bahan berwarna biru hingga biru-ungu yang khas bagi tekstil tempat kudus.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: kaki pelita untuk penerangan itu
  rationale: מְנוֹרָה adalah kaki atau penyangga pelita, sedangkan הַמָּאוֹר dapat menyatakan fungsi penerangan. Rumusan ini mempertahankan hubungan genitif yang mungkin bersifat fungsional dan membedakannya dari pelita-pelita yang disebut sesudahnya.
- source_word: נֵרֹתֶיהָ
  choice: pelita-pelitanya
  rationale: נֵרֹת menunjuk pada masing-masing pelita yang terpasang atau berhubungan dengan kaki pelita.
- source_word: מַלְקָחֶיהָ
  choice: penjepit-penjepitnya
  rationale: Istilah ini menunjuk pada alat penjepit, kemungkinan untuk menangani sumbu. 'Penjepit' alami dalam bahasa Indonesia dan tidak mengunci fungsi yang tidak sepenuhnya pasti.
- source_word: מַחְתֹּתֶיהָ
  choice: penadah-penadah baranya
  rationale: מַחְתָּה dapat berarti wadah bara atau perbaraan. Dalam konteks perawatan pelita, penadah bara lebih sesuai daripada 'pedupaan', yang dapat keliru menyiratkan fungsi pembakaran dupa.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: segala perkakas minyaknya
  rationale: כְּלֵי mencakup wadah maupun peralatan, sehingga 'perkakas' mempertahankan keluasan maknanya; שַׁמְנָהּ mengaitkan semuanya dengan minyak bagi kaki pelita itu.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: yang mereka gunakan untuk melayaninya
  rationale: שׁרת memiliki nuansa pelayanan ibadah, לָהּ merujuk kepada kaki pelita, dan בָּהֶם menunjukkan bahwa perkakas-perkakas itu merupakan sarana pelayanan. Rumusan ini menyampaikan kedua hubungan tersebut secara alami.
