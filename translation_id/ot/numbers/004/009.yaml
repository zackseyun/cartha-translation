- from: Kemudian mereka harus mengambil sehelai kain biru[a] dan menutupi kaki pelita untuk penerangan itu, beserta pelita-pelitanya, penjepit-penjepitnya, penadah-penadah baranya, dan segala perkakas minyaknya yang mereka gunakan untuk melayaninya.
  to: Kemudian mereka harus mengambil sehelai kain biru[a] dan menutupi kaki pelita untuk penerangan, beserta pelita-pelitanya, penjepit-penjepitnya, wadah-wadah baranya, dan segala perkakas minyaknya yang mereka gunakan untuk melayaninya.
