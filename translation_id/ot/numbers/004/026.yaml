  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: id
  text: juga tirai-tirai pelataran, tirai untuk pintu masuk gerbang pelataran—pelataran yang mengelilingi Kemah Suci dan mazbah—tali-talinya[a], segala perlengkapan untuk pelayanan yang berkaitan dengannya, serta segala sesuatu yang harus dilakukan dengan semua itu[b]; dan mereka harus melayani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tambang-tambangnya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “segala sesuatu yang harus dilakukan untuk semua itu.” Bahasa Ibrani dapat merujuk pada pekerjaan yang dilakukan dengan benda-benda tersebut atau pada pekerjaan yang dilakukan untuk benda-benda itu dalam pelaksanaan pelayanan.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: tirai-tirai
  rationale: Istilah ini menunjuk pada lembaran kain yang membentuk pagar pelataran; “tirai-tirai” alami dalam bahasa Indonesia dan sesuai dengan konteks Kemah Suci.
- source_word: חָצֵר
  choice: pelataran
  rationale: Dalam tata ruang Kemah Suci, kata ini menunjuk pada area luar yang berpagar; “pelataran” merupakan istilah Indonesia yang jelas dan lazim.
- source_word: מָסַךְ
  choice: tirai
  rationale: Dalam konteks tempat kudus, kata ini menunjuk pada kain penutup pada jalan masuk; “tirai” lebih alami daripada “tabir” untuk pintu gerbang pelataran.
- source_word: פֶּתַח שַׁעַר
  choice: pintu gerbang
  rationale: Rangkaian Ibrani secara harfiah berarti bukaan atau jalan masuk gerbang. “Pintu gerbang” menyampaikan fungsi itu secara wajar tanpa pengulangan yang kaku.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: yang mengelilingi Kemah Suci dan mazbah
  rationale: Ungkapan ini menggambarkan pelataran beserta gerbangnya sebagai lingkungan di sekeliling Kemah Suci dan mazbah; terjemahan ini mempertahankan hubungan ruang secara alami.
- source_word: מֵיתְרֵיהֶם
  choice: tali-talinya
  rationale: Kata ini merujuk pada tali atau tambang yang terkait dengan tirai-tirai tersebut. “Tali” paling jelas dan alami dalam bahasa Indonesia modern.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: segala perlengkapan untuk pelayanan yang berkaitan dengannya
  rationale: כְּלֵי mencakup berbagai perlengkapan atau peralatan, sedangkan עֲבֹדָה di sini adalah tugas pelayanan Kemah Suci. Frasa relatif menjernihkan rujukan pronomina jamak yang kurang alami bila diterjemahkan secara mekanis.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: segala sesuatu yang harus dilakukan dengan semua itu
  rationale: Bentuk Ibrani dapat menunjuk pada pekerjaan yang dilakukan dengan benda-benda tersebut, tetapi preposisinya juga memungkinkan makna “untuk semuanya”; ambiguitas ini dicatat dalam catatan kaki.
- source_word: וְעָבָדוּ
  choice: Demikianlah mereka harus melayani
  rationale: Kata kerja עבד dalam konteks ini menyatakan pelaksanaan tugas pelayanan. “Demikianlah” menghubungkannya secara alami dengan daftar tanggung jawab sebelumnya tanpa mengubah isi pokok.
theological_decisions:
- issue: Cakupan כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: pekerjaan yang dilakukan dengan benda-benda tersebut
  alternative: pekerjaan yang dilakukan untuk benda-benda tersebut
  rationale: Konteks pengangkutan dan penggunaan perlengkapan mendukung “dengan”, tetapi konstruksi לָהֶם tidak menutup kemungkinan “untuk”; karena itu alternatif dipertahankan dalam catatan kaki dan tidak diputuskan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Istilah “Kemah Suci”, “mazbah”, “pelataran”, dan “pelayanan” dipakai secara konsisten untuk konteks peribadatan Israel. Ayat ini melanjutkan struktur kalimat dari ayat sebelumnya, sehingga dibuka dengan “juga”.
