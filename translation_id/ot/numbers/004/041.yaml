  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: id
  text: Inilah orang-orang yang terdaftar dari kaum-kaum keturunan Gerson, yaitu semua orang yang bertugas di Kemah Pertemuan, yang dihitung oleh Musa dan Harun atas perintah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Inilah orang-orang yang dihitung
  rationale: Ungkapan penunjuk ini memperkenalkan ringkasan hasil sensus. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan fokus pada orang-orang yang telah didata.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam susunan sosial Israel, istilah ini menunjuk kelompok kekerabatan di dalam suku. 'Kaum-kaum' lebih tepat daripada 'keluarga-keluarga', yang dalam bahasa Indonesia modern cenderung dipahami sebagai rumah tangga inti.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: keturunan Gerson
  rationale: Secara harfiah berarti 'anak-anak Gerson', tetapi dalam konteks sensus menunjuk para keturunannya; pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: כָּל הָעֹבֵד
  choice: semua orang yang bertugas
  rationale: Partisip Ibrani menunjuk semua orang yang menjalankan pelayanan atau pekerjaan yang ditetapkan. 'Bertugas' sesuai dengan konteks kewajiban orang Lewi.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Mempertahankan sebutan baku tempat suci dan preposisi dasar 'di', yang dapat mencakup pelayanan terkait kemah tersebut.
- source_word: אֲשֶׁר פָּקַד
  choice: yang dihitung oleh
  rationale: Klausa relatif pasif menghasilkan kalimat Indonesia yang alami serta mempertahankan hubungan leksikal dengan tindakan sensus.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan harfiah 'menurut mulut Yahweh' merupakan idiom yang berarti berdasarkan perintah-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang muncul secara langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara eksplisit; 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat jelas sebagai ringkasan sensus, dengan istilah 'kaum-kaum' untuk kelompok kekerabatan dan 'bertugas' untuk pelayanan orang Lewi.
