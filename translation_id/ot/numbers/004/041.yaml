  rationale: Revisi kecil ini memakai “terdaftar” untuk ringkasan hasil sensus (פקודי) dan mempertahankan “dihitung” untuk tindakan Musa dan Harun (פקד). Semua unsur sumber—kelompok kekerabatan Gerson, seluruh pelayan di Kemah Pertemuan, Musa dan Harun, serta perintah Yahweh—tetap eksplisit.
