  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: id
  text: 'Inilah pelayanan keluarga-keluarga orang Gerson: melayani dan mengangkut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melayani dan memikul beban.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Inilah tugas
  rationale: Klausa nominal Ibrani memperkenalkan jenis pekerjaan yang menjadi tanggung jawab mereka. 'Inilah tugas' alami dalam bahasa Indonesia dan menyampaikan עֲבֹדָה sebagai tugas pelayanan dalam konteks orang Lewi.
- source_word: מִשְׁפְּחֹת הַגֵּרְשֻׁנִּי
  choice: kaum-kaum keturunan Gerson
  rationale: מִשְׁפְּחֹת menunjuk kelompok-kelompok kekerabatan, sedangkan bentuk gentilik kolektif הַגֵּרְשֻׁנִּי menunjuk keturunan Gerson. Ungkapan ini lebih jelas daripada transliterasi 'orang Gerson' dan tetap mempertahankan bentuk jamaknya.
- source_word: לַעֲבֹד
  choice: melayani
  rationale: Infinitif dengan ל menyatakan fungsi atau tujuan. 'Melayani' sesuai dengan konteks pelayanan orang Lewi dan menghindari pengulangan kaku 'bertugas untuk bekerja'.
- source_word: וּלְמַשָּׂא
  choice: dan mengangkut
  rationale: מַשָּׂא dapat berarti beban, barang yang dibawa, atau tindakan pengangkutan. Dalam konteks perlengkapan Kemah Suci, 'mengangkut' menyampaikan tugas praktisnya tanpa menambahkan objek yang tidak disebutkan pada ayat ini.
