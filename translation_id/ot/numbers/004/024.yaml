  register: Bahasa Indonesia baku, modern, dan lugas. 'Kaum-kaum keturunan Gerson' menjaga gagasan beberapa kelompok keluarga, sementara 'melayani dan mengangkut' mempertahankan kesejajaran dua fungsi dalam teks Ibrani.
