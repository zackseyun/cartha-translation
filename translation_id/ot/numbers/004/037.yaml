revisions:
- from: Inilah orang-orang yang dihitung dari kaum-kaum keturunan Kehat, yaitu semua orang yang bertugas di Kemah Pertemuan, yang dihitung oleh Musa dan Harun sesuai dengan perintah Yahweh melalui Musa.[a]
  to: Inilah orang-orang yang dihitung dari kelompok-kelompok keluarga keturunan Kehat, yaitu semua orang yang bertugas di Kemah Pertemuan, yang dihitung oleh Musa dan Harun menurut perintah Yahweh yang disampaikan melalui Musa.[a]
  rationale: 'Revisi hanya memperjelas dua hal: kelompok yang dimaksud adalah kelompok-kelompok keluarga, dan perintah Yahweh disampaikan melalui Musa. Pengulangan ''dihitung'' dipertahankan karena mencerminkan pengulangan פקד dalam bahasa Ibrani. Catatan kaki diperbarui agar bentuk harfiah בְּיַד מֹשֶׁה dicatat dengan lebih tepat dalam bahasa Indonesia.'
