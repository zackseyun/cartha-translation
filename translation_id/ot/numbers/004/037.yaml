  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: id
  text: Inilah orang-orang yang dihitung dari kelompok-kelompok keluarga keturunan Kehat, yaitu semua orang yang bertugas di Kemah Pertemuan, yang dihitung oleh Musa dan Harun menurut perintah Yahweh yang disampaikan melalui Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: orang-orang yang dihitung
  rationale: Bentuk ini berasal dari פקד dalam konteks pendataan untuk pelayanan. Ungkapan tersebut menunjukkan orang-orang yang termasuk dalam hasil penghitungan, bukan sekadar tindakan sensus secara abstrak.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: kaum-kaum keturunan Kehat
  rationale: מִשְׁפְּחֹת menunjuk pada kelompok-kelompok kekerabatan atau kaum. Bentuk kolektif הַקְּהָתִי diterjemahkan secara alami sebagai keturunan Kehat.
- source_word: כָּל הָעֹבֵד
  choice: semua orang yang bertugas
  rationale: Partisip עֹבֵד menggambarkan mereka yang menjalankan pelayanan. 'Bertugas' wajar dalam bahasa Indonesia dan sesuai dengan konteks pelayanan orang Lewi.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Terjemahan ini mempertahankan nama tempat ibadah tersebut dan mencerminkan preposisi בְּ sebagai lingkup pelaksanaan tugas.
- source_word: אֲשֶׁר פָּקַד
  choice: yang dihitung oleh
  rationale: Dalam konteks ini פקד kembali berarti menghitung atau mendata, bukan mengangkat. Konstruksi pasif alami dalam bahasa Indonesia dan memperjelas bahwa Musa serta Harun adalah pelaku penghitungan.
- source_word: עַל פִּי יְהוָה
  choice: sesuai dengan perintah Yahweh
  rationale: Ungkapan harfiah 'menurut mulut Yahweh' merupakan idiom yang berarti menurut perintah atau titah-Nya. Terjemahan ini menyampaikan maknanya dengan jelas tanpa menjadi kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Idiom 'dengan tangan Musa' menyatakan perantaraan atau keagenan. 'Melalui Musa' merupakan padanan Indonesia yang alami; alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara perintah Yahweh dan perantaraan Musa
  choice: sesuai dengan perintah Yahweh melalui Musa
  alternative: sesuai dengan perintah Yahweh dengan perantaraan Musa / menurut titah Yahweh lewat tangan Musa
  rationale: Teks membedakan sumber perintah, yaitu Yahweh, dari sarana penyampaiannya, yaitu Musa. Terjemahan ini mempertahankan kedua unsur tersebut tanpa menyiratkan bahwa Musa adalah sumber perintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kaum-kaum' dipakai untuk kelompok kekerabatan, 'bertugas' untuk pelayanan orang Lewi, dan 'Kemah Pertemuan' sebagai istilah baku. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskan.
