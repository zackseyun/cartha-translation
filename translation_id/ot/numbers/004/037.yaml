  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya setia: פְּקוּדֵי diterjemahkan sebagai orang-orang yang dihitung, מִשְׁפְּחֹת הַקְּהָתִי sebagai kelompok-kelompok kekerabatan Kehat, pelayanan ditempatkan di Kemah Pertemuan, dan Yahweh dipertahankan sebagai nama ilahi. Namun, frasa akhir perlu diperjelas agar ''melalui Musa'' menerangkan penyampaian perintah Yahweh, bukan secara canggung tampak menerangkan tindakan Musa dan Harun menghitung.'
