  terminology: '''Kemah Pertemuan'' dan ''Yahweh'' konsisten serta tepat. ''Bertugas'' merupakan padanan yang wajar untuk pelayanan Lewi dalam konteks ini. Catatan kaki tetap melekat pada unsur ''melalui Musa'' dan mencatat bentuk harfiahnya.'
