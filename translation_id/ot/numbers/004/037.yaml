  revised_text: Inilah orang-orang yang dihitung dari kelompok-kelompok keluarga keturunan Kehat, yaitu semua orang yang bertugas di Kemah Pertemuan, yang dihitung oleh Musa dan Harun menurut perintah Yahweh yang disampaikan melalui Musa.[a]
