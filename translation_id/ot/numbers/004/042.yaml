lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: Orang-orang yang dihitung
  rationale: Bentuk ini menunjuk kepada mereka yang terdaftar dalam penghitungan; 'orang-orang' wajar dalam bahasa Indonesia dan sesuai dengan konteks sensus.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: kaum-kaum keturunan Merari
  rationale: מִשְׁפָּחָה menunjuk kelompok kekerabatan atau kaum, sedangkan בְּנֵי dalam silsilah lebih alami diterjemahkan 'keturunan' daripada dibatasi pada anak kandung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Preposisi לְ di sini menyatakan pengelompokan atau klasifikasi menurut kaum.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga pihak ayah mereka
  rationale: Ungkapan Ibrani secara harfiah berarti 'rumah para ayah mereka' dan menunjuk unit keluarga berdasarkan garis ayah; pilihan ini mempertahankan unsur patrilineal tanpa terjemahan harfiah yang janggal.
