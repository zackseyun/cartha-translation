  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: id
  text: Namun, mereka tidak boleh masuk untuk melihat benda-benda kudus itu walau sesaat pun[a], atau mereka akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika benda-benda kudus itu sedang ditutupi.” Ungkapan Ibraninya sulit dan dapat berarti melihatnya hanya sekejap atau melihatnya pada saat benda-benda itu ditutupi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Namun, ... tidak boleh
  rationale: Konjungsi dan negasi melanjutkan petunjuk sebelumnya dengan daya larangan; “Namun” menyatakan peralihan kepada peringatan secara alami.
- source_word: יָבֹאוּ
  choice: masuk
  rationale: Dalam konteks ini verba tersebut berarti datang atau masuk ke tempat benda-benda kudus berada; bersama “tidak boleh,” bentuk ini menyampaikan larangan dengan jelas.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Padanan ini mempertahankan arti dasar verba tanpa memastikan apakah tindakan melihat itu disengaja atau sekadar terjadi.
- source_word: כְבַלַּע
  choice: walau sesaat pun
  rationale: Ungkapan Ibrani ini sulit dan idiomatis. Dalam konteksnya, ungkapan tersebut dapat menunjuk pada pandangan yang sangat singkat, sedangkan kemungkinan bahwa maksudnya ialah saat benda-benda itu ditutupi dijelaskan dalam catatan kaki.
- source_word: אֶת הַקֹּדֶשׁ
  choice: benda-benda kudus itu
  rationale: Bentuk tunggal dengan artikel dipahami secara kolektif berdasarkan konteks langsung, yakni perlengkapan kudus Kemah Suci yang baru disebutkan.
- source_word: וָמֵתוּ
  choice: supaya mereka tidak mati
  rationale: Dalam rangkaian larangan, klausa ini secara alami menyatakan akibat yang hendak dihindari; padanan tersebut mempertahankan daya peringatan dari konstruksi Ibrani.
theological_decisions:
- issue: Rujukan הַקֹּדֶשׁ
  choice: benda-benda kudus, secara kolektif
  alternative: tempat kudus atau sesuatu yang kudus dalam arti abstrak
  rationale: Konteks Bilangan 4 membahas perlengkapan Kemah Suci yang ditutupi dan diangkut. Padanan kolektif paling sesuai dengan rujukan konkret tanpa mengubahnya menjadi nama lokasi.
- issue: Makna כְבַלַּע
  choice: walau sesaat pun, dengan alternatif tekstual dicatat
  alternative: ketika benda-benda kudus itu sedang ditutupi
  rationale: Ungkapan ini memiliki kesulitan leksikal yang nyata. Teks utama memakai makna idiomatis yang terbaca alami, tetapi catatan mempertahankan kemungkinan bahwa ungkapan itu menunjuk pada waktu penutupan benda-benda kudus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada larangan yang tegas dan bermartabat. “Benda-benda kudus” konkret dan mudah dipahami dalam konteks perlengkapan Kemah Suci; “walau sesaat pun” alami bagi pembaca umum sambil mempertahankan alternatif sumber dalam catatan.
