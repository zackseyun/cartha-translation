  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: id
  text: Hitunglah[a] keturunan Kehat dari antara keturunan Lewi, menurut kaum mereka dan menurut kelompok keluarga leluhur mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Angkatlah kepala keturunan Kehat,” sebuah ungkapan Ibrani yang berarti menghitung atau mengadakan sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Hitunglah
  rationale: Ungkapan Ibrani ini secara harfiah berarti “angkatlah kepala,” tetapi dalam konteks administratif berarti menghitung atau mengadakan sensus. “Hitunglah” menyampaikan maksud perintah secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי קְהָת
  choice: keturunan Kehat
  rationale: בְּנֵי dapat berarti anak-anak atau keturunan. Dalam konteks sensus suku, “keturunan Kehat” lebih jelas dan wajar daripada “anak-anak Kehat,” sebab yang dimaksud ialah kelompok genealogis.
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: dari antara keturunan Lewi
  rationale: מִתּוֹךְ menandai pemilihan suatu kelompok dari dalam kelompok yang lebih besar; terjemahan ini mempertahankan hubungan genealogis antara keturunan Kehat dan keturunan Lewi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Dalam konteks kesukuan dan sensus Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan atau kaum, bukan sekadar keluarga inti.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut puak leluhur mereka
  rationale: Ungkapan ini menunjuk pada unit kekerabatan patrilineal. “Puak leluhur” menyampaikan struktur genealogis tersebut dengan bahasa Indonesia yang ringkas dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “keturunan” menghindari kesan bahwa yang dihitung hanya anak kandung langsung, sedangkan “kaum” dan “puak leluhur” membedakan dua tingkat pengelompokan kekerabatan dalam teks.
