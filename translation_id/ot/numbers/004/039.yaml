  source_fidelity: 'Terjemahan dengan setia menyampaikan rentang usia “dari ... sampai ...”, partisip “setiap orang yang datang”, וכן dua unsur tujuan/tugas: לצבא sebagai bertugas dan לעבדה sebagai melakukan pekerjaan. “di Kemah Pertemuan” tepat untuk באהל מועד. Tanda pisah pada akhir mempertahankan sifat ayat sebagai kelanjutan kalimat daftar/sensus.'
