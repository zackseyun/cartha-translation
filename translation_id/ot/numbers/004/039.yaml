source:
  edition: WLC
  text: מִ/בֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וְ/עַ֖ד בֶּן חֲמִשִּׁ֣ים שָׁנָ֑ה כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/039.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: id
  text: dari yang berumur tiga puluh tahun ke atas sampai yang berumur lima puluh tahun, setiap orang yang datang untuk bertugas melakukan pekerjaan di Kemah Pertemuan[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap orang yang masuk dalam dinas untuk pekerjaan di Kemah Pertemuan.”
    reason: Teks Ibrani dapat dipahami dengan mempertahankan secara lebih harfiah pembedaan antara masuk ke dalam tugas terorganisasi (צָבָא) dan pekerjaan/pelayanan (עֲבֹדָה).
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: dari yang berumur tiga puluh tahun ke atas
  rationale: Ungkapan Ibrani secara harfiah berarti ‘dari seorang berumur tiga puluh tahun dan ke atas’; pilihan ini menyatakan batas usia minimum secara alami dalam bahasa Indonesia.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: sampai yang berumur lima puluh tahun
  rationale: Menyampaikan batas atas rentang usia dengan jelas dan tetap mengikuti susunan teks Ibrani.
- source_word: כָּל הַבָּא
  choice: setiap orang yang datang
  rationale: Partisip verba בוא pada dasarnya berarti ‘yang datang/masuk’. ‘Yang datang’ mempertahankan arti luasnya tanpa memaksakan gagasan penerimaan resmi ke dalam dinas.
- source_word: לַצָּבָא
  choice: untuk bertugas
  rationale: Dalam konteks orang Lewi, צבא menunjuk pada tugas yang terorganisasi, bukan peperangan. Bentuk verbal ini alami dalam bahasa Indonesia dan tetap membedakannya dari pekerjaan yang disebut sesudahnya.
- source_word: לַעֲבֹדָה
  choice: melakukan pekerjaan
  rationale: עֲבֹדָה berarti pekerjaan atau pelayanan. Pilihan ini membedakannya dari צבא dan menyatakan tujuan tugas tersebut dengan jelas.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Ini adalah sebutan baku bagi kemah suci; ‘di’ sesuai dengan preposisi Ibrani dan cakupan pekerjaan yang berkaitan dengan tempat itu.
