  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת הַ/לְוִיִּ֑ם לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: id
  text: Semua orang yang terhitung[a], yang dihitung oleh Musa, Harun, dan para pemimpin Israel dari antara orang Lewi, menurut kaum dan keluarga pihak ayah mereka[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang terdaftar” atau “yang tercatat”. Bahasa Ibrani memakai istilah sensus dari kata kerja פקד.
    reason: lexical_alternative
  - marker: b
    text: “Keluarga pihak ayah” merujuk pada rumah tangga leluhur atau kelompok keluarga berdasarkan garis ayah di dalam suatu kaum.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Semua orang yang terhitung
  rationale: Mengungkapkan keseluruhan kelompok yang masuk dalam pencatatan resmi, sambil mempertahankan bentuk pasif partisipial dan konteks sensus.
- source_word: אֲשֶׁר פָּקַד
  choice: yang dihitung
  rationale: Klausa relatif ini menerangkan orang-orang yang terhitung; 'dihitung' alami dalam bahasa Indonesia dan mempertahankan pengulangan akar פקד.
- source_word: מֹשֶׁה וְאַהֲרֹן וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: Musa, Harun, dan para pemimpin Israel
  rationale: נְשִׂיאִים menunjuk kepada para kepala atau pemimpin suku; 'para pemimpin' jelas dan tidak menimbulkan kesan kerajaan seperti 'para pangeran'.
- source_word: אֶת הַלְוִיִּם
  choice: dari antara orang Lewi
  rationale: Penanda objek אֶת memperkenalkan kelompok yang dihitung. Dalam susunan kalimat Indonesia ini, 'dari antara orang Lewi' menjelaskan bahwa mereka yang terhitung berasal dari kelompok Lewi tanpa mengubah acuannya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum
  rationale: מִשְׁפָּחָה dalam rumusan sensus menunjuk pada kelompok kekerabatan setingkat klan. 'Kaum' merupakan istilah ringkas dan bermartabat dalam konteks silsilah Israel.
- source_word: וּלְבֵית אֲבֹתָם
  choice: dan keluarga pihak ayah mereka
  rationale: בֵּית אָבוֹת adalah satuan rumah tangga atau kelompok keturunan berdasarkan garis ayah. Pilihan ini lebih mudah dipahami pembaca modern daripada terjemahan harfiah 'rumah-rumah ayah'.
