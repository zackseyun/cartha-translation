  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: id
  text: Lalu seorang pemuda berlari dan memberitahu Musa,[a] “Eldad dan Medad sedang bernubuat di perkemahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Lalu pemuda itu berlari dan melaporkan kepada Musa.” Kata sandang Ibrani pada “pemuda” dapat diterjemahkan lebih harfiah sebagai “pemuda itu”; kata kerja untuk pemberitahuan itu juga dapat diterjemahkan “melaporkan” atau “memberi tahu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: berlari
  rationale: Kata kerja רוץ secara langsung menyatakan tindakan berlari dan mempertahankan hidupnya alur narasi.
- source_word: הַנַּעַר
  choice: seorang pemuda
  rationale: נַעַר dapat berarti anak laki-laki, orang muda, atau pemuda. Dalam konteks ini ia menjalankan tugas sebagai pembawa laporan; 'seorang pemuda' alami dalam bahasa Indonesia dan memperkenalkan tokoh yang belum disebutkan.
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: menemui Musa dan melaporkan kepadanya
  rationale: נגד bentuk Hifil berarti memberitahukan atau melaporkan. Unsur לְ menandai penerima laporan; 'menemui' membuat gerak menuju Musa tersirat secara alami setelah kata 'berlari', sedangkan 'melaporkan kepadanya' menyampaikan fungsi verba dengan jelas.
- source_word: וַיֹּאמַר
  choice: “... ”
  rationale: Verba אמר memperkenalkan ucapan langsung. Dalam bahasa Indonesia, fungsi ini dapat disampaikan secara alami langsung dengan tanda petik setelah verba 'melaporkan', tanpa mengulang 'dan berkata'.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Eldad dan Medad
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִתְנַבְּאִים
  choice: sedang bernubuat
  rationale: Partisipel Hitpael menunjukkan kegiatan kenabian yang tengah berlangsung; 'sedang bernubuat' mempertahankan aspek progresif itu tanpa menjelaskan sifat nubuatnya lebih jauh.
- source_word: בַּמַּחֲנֶה
  choice: di perkemahan
  rationale: מַחֲנֶה menunjuk pada perkemahan Israel. 'Di perkemahan' merupakan padanan Indonesia yang jelas dan idiomatis.
theological_decisions:
- issue: Sifat kegiatan kenabian Eldad dan Medad
  choice: bernubuat
  alternative: berlaku seperti nabi / berbicara secara kenabian
  rationale: Teks hanya menyatakan aktivitas dengan bentuk Hitpael dari נבא. Padanan 'bernubuat' menjaga istilah teologis dan tidak menentukan isi, bentuk, atau penilaian atas kegiatan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dibuat alami dalam narasi Indonesia, sementara alternatif yang lebih formal untuk kata sandang dan verba pelaporan dipertahankan dalam catatan kaki.
