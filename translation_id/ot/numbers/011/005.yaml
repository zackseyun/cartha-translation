base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: id
  text: Kami teringat akan ikan yang dahulu kami makan di Mesir tanpa membayar[a], mentimun, melon, bawang prei, bawang bombai, dan bawang putih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara cuma-cuma.” Para pembicara mengenang Mesir dari sudut pandang keluhan mereka, meskipun mereka sebenarnya hidup sebagai budak di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Kita teringat
  rationale: Bentuk Qal perfektif orang pertama jamak dalam keluhan langsung ini menyatakan ingatan yang kini muncul; “kita teringat” alami dalam bahasa Indonesia dan mempertahankan sudut pandang para pembicara.
- source_word: הַדָּגָה
  choice: ikan
  rationale: Kata ini merujuk secara kolektif kepada ikan sebagai makanan; bahasa Indonesia tidak memerlukan penanda jamak.
- source_word: אֲשֶׁר נֹאכַל
  choice: yang dahulu kita makan
  rationale: Bentuk yiqtol berada dalam konteks kebiasaan masa lalu. “Dahulu” memperjelas nuansa habitual tanpa membuat kalimat kaku.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Padanan lokatif langsung dan alami.
- source_word: חִנָּם
  choice: dengan cuma-cuma
  rationale: Adverbia ini berarti tanpa pembayaran atau biaya. Pilihan ini mempertahankan klaim para pengeluh serta ironi yang timbul dari kenyataan bahwa mereka dahulu diperbudak.
- source_word: הַקִּשֻּׁאִים
  choice: mentimun
  rationale: Identifikasi umum hasil tanaman ini; bentuk tunggal kolektif alami untuk daftar bahan makanan dalam bahasa Indonesia.
- source_word: הָאֲבַטִּחִים
  choice: melon
  rationale: Istilah sumber menunjuk sejenis melon; “melon” tidak mempersempitnya secara tidak pasti menjadi semangka.
- source_word: הֶחָצִיר
  choice: daun bawang
  rationale: Dalam daftar makanan ini, kata tersebut paling mungkin menunjuk sayuran kebun yang secara tradisional dipahami sebagai leek; “daun bawang” merupakan padanan Indonesia yang umum dan mudah dipahami.
- source_word: הַבְּצָלִים
  choice: bawang merah
  rationale: Padanan Indonesia yang lazim untuk bawang jenis onion dalam konteks bahan makanan, serta membedakannya dari bawang putih yang disebut berikutnya.
- source_word: הַשּׁוּמִים
  choice: bawang putih
  rationale: Padanan leksikal baku untuk garlic.
theological_decisions:
- issue: Pemaknaan חִנָּם dengan latar perbudakan Israel di Mesir
  choice: dengan cuma-cuma
  alternative: dengan bebas; tanpa membayar
  rationale: Ayat ini menyampaikan kenangan dari sudut pandang keluhan bangsa itu, bukan penilaian objektif tentang kehidupan mereka di Mesir. Terjemahan lugas mempertahankan retorika dan ironinya tanpa menyisipkan koreksi tafsir ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata “kita” sesuai dengan ucapan kelompok yang mencakup para pembicara dan sesamanya. Daftar makanan dibuat alami tanpa menghilangkan unsur apa pun dari teks Ibrani.
