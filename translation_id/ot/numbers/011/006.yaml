  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: id
  text: Namun sekarang nafsu makan kami sudah hilang[a]; sama sekali tidak ada apa-apa selain manna di depan mata kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jiwa kami kering”; kata Ibrani נֶפֶשׁ (nefesh) dapat berarti “jiwa”, “kehidupan”, atau, dalam konteks makanan, “nafsu makan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Kata sambung dan keterangan waktu ini menyatakan kontras dengan keadaan sebelumnya; “Namun sekarang” alami dalam konteks keluhan.
- source_word: נַפְשֵׁנוּ
  choice: selera makan kami
  rationale: נֶפֶשׁ dapat berarti jiwa atau kehidupan, tetapi dalam konteks makanan dan hasrat menunjuk pada selera makan; pilihan ini menyampaikan makna kontekstual tanpa menghapus alternatif harfiahnya.
- source_word: יְבֵשָׁה
  choice: sudah kering
  rationale: Kata sifat ini menggambarkan keadaan kering atau layu; “sudah kering” mempertahankan gambaran konkret dan menyuarakan kejenuhan mereka.
- source_word: אֵין כֹּל
  choice: sama sekali tidak ada apa-apa
  rationale: Ungkapan negatif dengan כֹּל bersifat menegaskan; susunan ini mempertahankan penekanan tersebut dalam bahasa Indonesia.
- source_word: בִּלְתִּי אֶל
  choice: selain
  rationale: Konstruksi ini mengecualikan semua hal kecuali satu, sehingga “selain” merupakan padanan yang ringkas dan wajar.
- source_word: הַמָּן
  choice: manna ini
  rationale: Artikel menunjuk pada manna tertentu yang sudah dikenal dalam konteks; “ini” juga secara alami mencerminkan nada keluhan, meskipun unsur demonstratif tidak dinyatakan secara tersendiri dalam bahasa Ibrani.
- source_word: עֵינֵינוּ
  choice: di depan mata kami
  rationale: Ungkapan ini mempertahankan citra konkret tentang satu-satunya makanan yang terus mereka lihat.
