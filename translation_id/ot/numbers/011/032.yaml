  text: וַ/יָּ֣קָם הָ/עָ֡ם כָּל הַ/יּוֹם֩ הַ/ה֨וּא וְ/כָל הַ/לַּ֜יְלָה וְ/כֹ֣ל י֣וֹם הַֽ/מָּחֳרָ֗ת וַ/יַּֽאַסְפוּ֙ אֶת הַ/שְּׂלָ֔ו הַ/מַּמְעִ֕יט אָסַ֖ף עֲשָׂרָ֣ה חֳמָרִ֑ים וַ/יִּשְׁטְח֤וּ לָ/הֶם֙ שָׁט֔וֹחַ סְבִיב֖וֹת הַֽ/מַּחֲנֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: id
  text: Lalu orang-orang itu bangun dan mengumpulkan burung puyuh sepanjang hari itu, sepanjang malam, dan sepanjang hari berikutnya. Orang yang mengumpulkan paling sedikit mengumpulkan sepuluh homer[a]. Kemudian mereka menghamparkannya untuk diri mereka sendiri di sekeliling perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Homer adalah satuan takaran kering yang besar. Nilai tepatnya dalam satuan modern tidak pasti; maksud ayat ini ialah bahwa orang yang mengumpulkan paling sedikit pun mengumpulkan jumlah yang sangat banyak. Kata Ibraninya juga dapat dikaitkan secara etimologis dengan muatan seekor keledai, sehingga frasa ini mungkin diterjemahkan “sepuluh muatan keledai.”
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: Lalu bangsa itu bangkit
  rationale: קום menggambarkan dimulainya tindakan dengan giat; 'bangkit' mempertahankan warna ungkapan Ibrani, sedangkan 'bangsa itu' merupakan padanan naratif yang wajar bagi הָעָם dalam konteks komunitas Israel.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: sepanjang hari itu, sepanjang malam, serta sepanjang hari berikutnya
  rationale: Susunan ini mempertahankan penekanan pada lamanya kegiatan yang berlangsung terus-menerus, sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: וַיַּאַסְפוּ אֶת הַשְּׂלָו
  choice: mereka mengumpulkan burung puyuh
  rationale: אָסף berarti 'mengumpulkan', dan שְּׂלָו menunjuk kepada burung puyuh dalam konteks sebelumnya.
- source_word: הַמַּמְעִיט אָסַף
  choice: Orang yang mengumpulkan paling sedikit mendapat
  rationale: Partisip Hifil הַמַּמְעִיט secara idiomatis berarti orang yang mengumpulkan paling sedikit. 'Mendapat' menghindari pengulangan yang kaku tanpa mengubah maksud bahwa itulah jumlah yang dikumpulkannya.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: sepuluh homer
  rationale: חֹמֶר lazim dipahami sebagai satuan takaran kering. Transliterasi 'homer' menghindari ketepatan modern yang semu dan diberi penjelasan dalam catatan kaki.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: Kemudian mereka menghamparkannya bagi diri mereka sendiri
  rationale: Konstruksi verba dengan infinitif serumpun menegaskan tindakan menghamparkan. 'Bagi diri mereka sendiri' mempertahankan לָהֶם tanpa menyimpulkan tujuan seperti pengeringan yang tidak dinyatakan langsung.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: di sekeliling perkemahan
  rationale: Padanan ini menyampaikan bahwa burung-burung itu dihamparkan pada kawasan yang mengitari perkemahan.
