    rationale: 'Teks Ibrani mengulangi אָסַף: ''yang paling sedikit mengumpulkan sepuluh homer.'' Penggantian dengan ''mendapat'' melemahkan penegasan naratif bahwa jumlah tersebut dikumpulkan.'
  - severity: low
