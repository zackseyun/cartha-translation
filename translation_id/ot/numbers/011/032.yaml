  register: Bahasa Indonesia baku, modern, dan bermartabat. Irama pengulangan durasi dipertahankan, sedangkan susunan kalimat disesuaikan agar jelas bagi pembaca umum. Marker [a] ditempatkan langsung setelah satuan kuno yang dijelaskan.
