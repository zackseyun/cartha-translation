  text: וְ/הָֽ/אסַפְסֻף֙ אֲשֶׁ֣ר בְּ/קִרְבּ֔/וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַ/יָּשֻׁ֣בוּ וַ/יִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖/נוּ בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: id
  text: Gerombolan[a] yang ada di tengah-tengah mereka memiliki keinginan yang sangat kuat[b]. Orang Israel[c] pun kembali menangis dan berkata, “Siapa yang akan memberi kita daging untuk dimakan?”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini langka dan bernada merendahkan. Dapat juga diterjemahkan “kumpulan campuran,” yakni kelompok noninti yang berada di tengah umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menginginkan suatu keinginan,” suatu pengulangan kata seakar yang menegaskan kuatnya hasrat mereka.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak Israel”; maksudnya adalah orang-orang Israel.
    reason: lexical_alternative
  - marker: d
    text: Dapat juga diterjemahkan “Siapa yang akan memberi kita makan daging?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: gerombolan
  rationale: Kata kolektif yang langka ini bernada merendahkan dan menunjuk pada kelompok noninti di tengah umat. “Gerombolan” mempertahankan nuansa negatif tanpa menentukan asal-usul etnis mereka.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: yang ada di tengah-tengah mereka
  rationale: Ungkapan ini secara harfiah berarti “yang ada di tengah-tengahnya.” Acuan kontekstualnya adalah komunitas Israel; bentuk Indonesia ini wajar dan tetap menyatakan bahwa kelompok tersebut berada di dalam perkemahan.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: memiliki keinginan yang sangat kuat
  rationale: Gabungan verba dan nomina seakar memberi penekanan pada kuatnya hasrat. Terjemahan ini menyampaikan intensitasnya dalam bahasa Indonesia alami tanpa menambahkan objek yang tidak dinyatakan dalam klausa Ibrani.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: pun kembali menangis
  rationale: 'שׁוּב di sini paling wajar dipahami sebagai pengulangan tindakan: mereka menangis lagi. “Kembali menangis” mempertahankan unsur pengulangan itu secara ringkas.'
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel pun
  rationale: Secara harfiah ungkapan ini berbunyi “anak-anak lelaki Israel,” tetapi berfungsi sebagai sebutan kolektif etnis. “Orang Israel” adalah padanan Indonesia yang alami dan mencakup komunitas yang dimaksud; “pun” menerjemahkan גַּם.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Siapa yang akan memberi kita daging untuk dimakan?
  rationale: Bentuk kausatif אכל berarti “membuat makan” atau “memberi makan.” Rumusan ini alami dalam bahasa Indonesia dan mempertahankan daging sebagai makanan.
