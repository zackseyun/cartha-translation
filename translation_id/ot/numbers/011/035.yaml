  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: id
  text: Dari Kibrot-Taawa[a] bangsa itu berangkat menuju Hazerot, lalu mereka tinggal di Hazerot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibrot-Taawa berarti “kuburan-kuburan keinginan” atau “kuburan-kuburan nafsu.”
    reason: Nama tempat Ibrani ini tersusun dari kata yang berarti “kuburan-kuburan” dan “keinginan/nafsu.” Catatan ini mempertahankan makna nama tersebut.
lexical_decisions:
- source_word: מִקִּבְרוֹת הַתַּאֲוָה
  choice: Dari Kibrot-Hataawa
  rationale: Frasa ini berfungsi sebagai nama tempat dalam narasi, sehingga ditransliterasikan. Unsur מִן diterjemahkan dengan “dari,” sedangkan makna harfiah nama tersebut dipertahankan dalam catatan kaki.
- source_word: נָסְעוּ
  choice: berangkat
  rationale: Dalam kisah perjalanan, נסע lazim berarti membongkar perkemahan lalu bergerak meninggalkan suatu tempat. “Berangkat” menyampaikan nuansa itu secara alami dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם menunjuk secara kolektif kepada umat Israel yang sudah jelas dari konteks. “Bangsa itu” wajar dalam narasi perjalanan dan mempertahankan sifat kolektif istilah sumber.
- source_word: חֲצֵרוֹת
  choice: Hazerot
  rationale: Nama tempat ini ditransliterasikan ke dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: וַיִּהְיוּ בַּחֲצֵרוֹת
  choice: lalu mereka tinggal di Hazerot
  rationale: Secara harfiah klausa ini berarti “dan mereka berada di Hazerot.” Dalam konteks daftar perjalanan, היה + ב menunjukkan bahwa mereka berhenti dan menetap sementara di lokasi tersebut; “tinggal” menyampaikan maksud itu tanpa menentukan lamanya.
