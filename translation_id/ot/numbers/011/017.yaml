  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: id
  text: Aku akan turun dan berbicara denganmu di sana. Aku akan mengambil sebagian dari Roh[a] yang ada padamu dan menaruhnya pada mereka. Mereka akan turut memikul beban bangsa itu bersamamu, sehingga engkau tidak memikulnya seorang diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh”. Kata Ibrani רוּחַ dapat berarti roh, angin, atau napas; di sini konteksnya menunjuk pada Roh yang memberi Musa kemampuan untuk memimpin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: Aku akan turun
  rationale: Mempertahankan bahasa teofanik-antropomorfis dari verba ירד dengan ungkapan Indonesia yang alami.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: dan berbicara denganmu di sana
  rationale: Menjaga makna berbicara bersama Musa dan keterangan tempat yang eksplisit.
- source_word: וְאָצַלְתִּי
  choice: Aku akan mengambil sebagian
  rationale: Verba langka אצל dalam konteks ini menunjuk pada pengambilan dari apa yang ada pada Musa untuk ditempatkan pada para tua-tua; 'sebagian' menyampaikan daya partitif מן tanpa memastikan apakah milik Musa berkurang.
- source_word: מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: dari Roh yang ada padamu
  rationale: Konteks ayat 25 menunjukkan pemberdayaan ilahi untuk kepemimpinan. 'Ada padamu' terdengar alami sambil mempertahankan gambaran sesuatu yang berada atas Musa.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: dan menaruhnya pada mereka
  rationale: Mempertahankan metafora penempatan Roh pada para tua-tua dalam bahasa Indonesia modern.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: Mereka akan turut memikul beban bangsa itu bersamamu
  rationale: '''Memikul beban'' menyampaikan metafora נשא dan משא, sedangkan ''turut'' serta ''bersamamu'' menegaskan tanggung jawab yang dibagi.'
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: sehingga engkau tidak memikulnya seorang diri
  rationale: Menyatakan hasil atau tujuan pengaturan tersebut dan mempertahankan penekanan bahwa Musa tidak lagi menanggung beban sendirian.
theological_decisions:
- issue: Apakah רוּחַ diterjemahkan sebagai 'Roh' atau 'roh'
  choice: Roh
  alternative: roh
  rationale: Konteks langsung, terutama Bilangan 11:25, menunjuk pada pemberdayaan yang berasal dari Allah, bukan sekadar watak atau semangat manusia. Huruf kapital menandai referen ilahi tanpa merinci doktrin yang melampaui teks.
- issue: Apakah pemindahan Roh menyiratkan bahwa pemberdayaan Musa berkurang
  choice: Menggunakan 'mengambil sebagian dari' tanpa menjelaskan adanya pengurangan
  alternative: membagikan atau melimpahkan Roh
  rationale: Teks menggambarkan pengambilan dari Roh yang ada pada Musa dan penempatannya pada para tua-tua, tetapi tidak secara eksplisit menyatakan apakah pemberdayaan Musa berkurang. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pronomina 'Aku' dan 'engkau' dipakai sesuai tuturan langsung Allah kepada Musa. Struktur ayat dibagi menjadi tiga kalimat agar mudah dibaca tanpa mengubah urutan gagasan sumber.
