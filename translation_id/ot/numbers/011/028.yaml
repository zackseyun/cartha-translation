  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: id
  text: Lalu Yosua bin Nun, pelayan Musa sejak masa mudanya,[a] menanggapi, “Tuanku Musa, cegahlah mereka!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari antara orang-orang mudanya,” atau mungkin “dari antara orang-orang pilihannya.” Ungkapan Ibraninya padat dan agak ambigu.
    reason: lexical_alternative
  - marker: b
    text: Atau “tahanlah mereka” atau “laranglah mereka.” Kata Ibraninya dapat berarti menahan, menghalangi, atau melarang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Lalu ... menanggapi
  rationale: Gabungan verba naratif ini memperkenalkan tanggapan Yosua. “Menanggapi” menyampaikan fungsi keduanya secara alami dalam bahasa Indonesia tanpa ungkapan berulang “menjawab dan berkata”.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua bin Nun
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia; “bin” secara ringkas menyatakan hubungan anak laki-laki dengan ayahnya.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: pelayan Musa
  rationale: מְשָׁרֵת menunjuk kepada orang yang membantu dan melayani seorang atasan. “Pelayan” mempertahankan hubungan pelayanan pribadi tanpa harus menyiratkan perbudakan.
- source_word: מִבְּחֻרָיו
  choice: sejak masa mudanya
  rationale: Ungkapan Ibrani ini padat dan tidak sepenuhnya pasti. Dalam konteks, “sejak masa mudanya” merupakan bacaan idiomatis dan alami, sedangkan kemungkinan “salah seorang pemudanya” atau “salah seorang pilihannya” dipertahankan dalam catatan kaki.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Tuanku Musa
  rationale: Sapaan ini menyatakan rasa hormat kepada atasan manusia. “Tuanku” mempertahankan nada hormat tanpa menjadikannya gelar ilahi.
- source_word: כְּלָאֵם
  choice: cegahlah mereka
  rationale: Imperatif כלא dapat berarti menahan, menghalangi, atau melarang. “Cegahlah mereka” alami dalam konteks permintaan agar Eldad dan Medad tidak meneruskan tindakan mereka, tanpa menentukan cara pencegahannya.
theological_decisions:
- issue: Apakah permintaan Yosua berarti penahanan fisik atau pelarangan untuk bernubuat
  choice: cegahlah mereka
  alternative: tahanlah mereka; laranglah mereka
  rationale: Teks tidak menjelaskan cara yang diminta Yosua. Terjemahan utama mempertahankan keluasan makna verba dan catatan kaki menyebutkan alternatif yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. “Tuanku” mempertahankan penghormatan Yosua kepada Musa; ambiguitas leksikal utama dijaga melalui catatan kaki.
