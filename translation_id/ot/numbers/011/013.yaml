translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata 'aku' sesuai dengan tuturan langsung Musa. 'Bangsa' dipilih untuk nomina kolektif עָם, sedangkan konstruksi 'menangis mendesak aku' mempertahankan tekanan idiom עָלַי dan disertai catatan kaki karena cakupan maknanya ambigu.
