base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: id
  text: Dari mana aku dapat memperoleh daging untuk kuberikan kepada seluruh bangsa ini? Sebab mereka menangis di hadapanku[a], sambil berkata, ‘Berilah kami daging supaya kami dapat makan.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka menangis kepadaku” atau “mereka mendesak aku dengan tangisan mereka.” Ungkapan Ibrani secara harfiah berbunyi “mereka menangis atasku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: Dari mana aku dapat memperoleh
  rationale: Ungkapan ini menanyakan sumber untuk mendapatkan sesuatu sekaligus menyiratkan ketidakmampuan Musa; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan nuansa keluhannya.
- source_word: בָּשָׂר
  choice: daging
  rationale: Dalam konteks penyediaan makanan, kata ini menunjuk pada daging untuk dimakan, bukan sekadar tubuh atau 'daging' dalam arti ragawi.
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: untuk diberikan kepada seluruh bangsa ini
  rationale: Infinitif menyatakan tujuan, sedangkan עָם adalah nomina kolektif tunggal; 'seluruh bangsa ini' menyampaikan cakupan kolektif secara wajar.
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi pertanyaan dan keluhan Musa.
- source_word: יִבְכּוּ עָלַי
  choice: mereka menangis mendesak aku
  rationale: Secara harfiah ungkapan Ibrani berbunyi 'mereka menangis atasku'; dalam konteks ini tangisan mereka diarahkan kepada Musa dan membebaninya dengan desakan. Rumusan utama menyampaikan tekanan tersebut tanpa menyiratkan permusuhan secara berlebihan.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Infinitif kutipan memperkenalkan isi permintaan mereka; 'dengan berkata' menghubungkan tangisan dan ujaran secara alami.
- source_word: תְּנָה לָּנוּ
  choice: Berilah kami
  rationale: Bentuk imperatif dengan pronomina penerima paling alami diterjemahkan sebagai permintaan langsung ini.
- source_word: וְנֹאכֵלָה
  choice: supaya kami dapat makan
  rationale: Bentuk kohortatif menyatakan hasil atau tujuan yang dikehendaki setelah permintaan; 'supaya' mempertahankan nuansa tersebut.
