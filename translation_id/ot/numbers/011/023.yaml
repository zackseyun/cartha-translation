  naturalness: Perbaikan kecil diperlukan agar kalimat terakhir baku dan alami tanpa mengurangi ketaksaan dasar bahwa perkataan Yahweh itu akan dialami atau terbukti bagi Musa.
  terminology: “Yahweh,” “Musa,” dan “firman-Ku” tepat dan konsisten. Metafora “tangan Yahweh” patut dipertahankan; catatan kaki menjelaskan makna idiomatisnya tanpa menggantikannya dalam teks.
