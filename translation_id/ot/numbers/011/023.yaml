  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: id
  text: Lalu Yahweh berkata kepada Musa, “Apakah tangan Yahweh sudah menjadi pendek?[a] Sekarang engkau akan melihat apakah firman-Ku akan terlaksana bagimu atau tidak.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “tangan Yahweh menjadi pendek” berarti kuasa atau kemampuan Yahweh menjadi terbatas.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan, “apakah yang telah Kufirmankan akan terjadi bagimu atau tidak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: Apakah tangan Yahweh sudah menjadi pendek?
  rationale: Mempertahankan ungkapan antropomorfis Ibrani dan daya retoris pertanyaannya; kata 'tangan' menggambarkan kuasa atau kemampuan.
- source_word: עַתָּה תִרְאֶה
  choice: Sekarang engkau akan melihat
  rationale: Menyampaikan penegasan waktu dan pembuktian yang segera dengan bahasa Indonesia yang alami serta bermartabat.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: apakah firman-Ku akan terjadi bagimu
  rationale: קרה dapat berarti terjadi, menimpa, atau sampai; terjemahan ini mempertahankan sufiks orang kedua dan ketaksaan mengenai apakah perkataan itu akan terlaksana bagi Musa atau dialami olehnya.
- source_word: דְבָרִי
  choice: firman-Ku
  rationale: Dalam konteks ucapan ilahi, 'firman-Ku' secara alami menunjuk pada apa yang telah Yahweh nyatakan, sambil mempertahankan bentuk tunggal.
- source_word: אִם לֹא
  choice: atau tidak
  rationale: Melengkapi konstruksi pertanyaan tidak langsung 'apakah ... atau tidak' secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa antropomorfis tentang kuasa ilahi
  choice: Mempertahankan ungkapan 'tangan Yahweh ... menjadi pendek'
  alternative: Apakah kuasa Yahweh sudah terbatas?
  rationale: Metafora tubuh dalam teks sumber menyatakan kemampuan Yahweh tanpa perlu diratakan menjadi pernyataan abstrak.
- issue: Makna הֲיִקְרְךָ דְבָרִי
  choice: apakah firman-Ku akan terjadi bagimu
  alternative: apakah yang telah Kufirmankan akan terjadi kepadamu
  rationale: Pilihan utama mempertahankan kata 'firman' dan unsur orang kedua, sekaligus tidak menutup ketaksaan antara terlaksana bagi Musa dan terjadi kepadanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' untuk menjaga nada langsung dan khidmat. Metafora Ibrani dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
