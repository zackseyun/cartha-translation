lexical_decisions:
- source_word: לֹא
  choice: bukan
  rationale: Diulang untuk menyangkal setiap jangka waktu dalam urutan retoris; pengulangan “bukan” mempertahankan tekanan teks Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: יוֹם אֶחָד
  choice: satu hari
  rationale: Padanan langsung yang mempertahankan urutan bilangan.
- source_word: תֹּאכְלוּ/ן
  choice: kalian akan makan
  rationale: Bentuk Qal imperfek orang kedua jamak menyatakan tindakan yang akan terjadi; “kalian” memperjelas bahwa sapaan bersifat jamak.
- source_word: יוֹמָיִם
  choice: dua hari
  rationale: Bentuk dual secara eksplisit berarti dua hari.
- source_word: חֲמִשָּׁה יָמִים
  choice: lima hari
  rationale: Diterjemahkan langsung untuk mempertahankan peningkatan urutan retoris.
- source_word: עֲשָׂרָה יָמִים
  choice: sepuluh hari
  rationale: Padanan langsung mempertahankan susunan dan penekanan sumber.
- source_word: עֶשְׂרִים יוֹם
  choice: dua puluh hari
  rationale: Diterjemahkan sesuai tata bahasa Indonesia, tanpa meniru bentuk tunggal idiomatis pada kata Ibrani.
- source_word: וְ
  choice: dan
  rationale: Waw dalam rangkaian negatif ini diterjemahkan “dan”; pengulangan “bukan” membuat hubungan antaranggotanya jelas dan mempertahankan bentuk retoris Ibrani.
