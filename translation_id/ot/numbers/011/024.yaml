  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: id
  text: Kemudian Musa keluar dan menyampaikan firman Yahweh kepada bangsa itu. Ia mengumpulkan tujuh puluh laki-laki dari antara para tetua bangsa itu, lalu menempatkan[a] mereka di sekeliling kemah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menyuruh mereka berdiri” atau “membuat mereka berdiri”. Kata kerja Ibraninya secara harfiah berarti “menyebabkan mereka berdiri”.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “kemah”; menurut konteks, kemungkinan yang dimaksud adalah Kemah Pertemuan.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Kata kerja יצא menyatakan gerak keluar dari tempat sebelumnya; “keluar” merupakan padanan langsung dan alami dalam narasi Indonesia.
- source_word: וַיְדַבֵּר אֶל הָעָם אֵת דִּבְרֵי יְהוָה
  choice: menyampaikan firman Yahweh kepada bangsa itu
  rationale: Susunan ini mengungkapkan tindakan berbicara kepada bangsa itu secara alami dalam bahasa Indonesia. “Firman Yahweh” mempertahankan gagasan דִּבְרֵי יְהוָה sebagai perkataan yang berasal dari Yahweh tanpa memakai bentuk jamak yang kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: אסף di sini berarti menghimpun atau mengumpulkan sejumlah orang; “mengumpulkan” tepat dan lazim.
- source_word: שִׁבְעִים אִישׁ
  choice: tujuh puluh laki-laki
  rationale: אִישׁ dalam konteks ini menunjuk kepada laki-laki. Padanan ini mempertahankan rujukan gender yang terdapat dalam teks sumber.
- source_word: מִזִּקְנֵי הָעָם
  choice: dari antara para tetua bangsa itu
  rationale: Bentuk partitif מִן diterjemahkan “dari antara”, sedangkan זִקְנֵי menunjuk kepada para tetua yang memiliki kedudukan dalam masyarakat, bukan sekadar orang lanjut usia.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: menempatkan mereka
  rationale: Bentuk Hifil dari עמד secara harfiah berarti menyebabkan seseorang berdiri. Dalam konteks pengaturan posisi, “menempatkan” menyampaikan maknanya secara wajar; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: di sekeliling kemah
  rationale: סְבִיבֹת berarti di sekitar atau di sekeliling, dan הָאֹהֶל secara harfiah berarti “kemah”. Terjemahan tidak menambahkan “pertemuan”, yang tidak dinyatakan dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian itu, alih-alih menggantinya dengan sebuah gelar.
- issue: Rujukan gender dalam שִׁבְעִים אִישׁ
  choice: tujuh puluh laki-laki
  alternative: tujuh puluh orang
  rationale: אִישׁ bersifat maskulin dan dalam konteks ini merujuk kepada laki-laki yang dipilih dari kalangan para tetua; karena itu, gender sumber dipertahankan.
- issue: Identitas הָאֹהֶל
  choice: kemah
  alternative: Kemah Pertemuan
  rationale: Konteks kemungkinan besar menunjuk kepada Kemah Pertemuan, tetapi ayat ini sendiri hanya mengatakan “kemah”. Terjemahan utama mempertahankan ketidaktersuratan itu dan menjelaskan konteks dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Para tetua” dipilih sebagai istilah peran sosial yang lebih alami bagi pembaca masa kini, sedangkan “firman Yahweh” mempertahankan nuansa religius tanpa susunan jamak yang kaku.
