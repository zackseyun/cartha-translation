source:
  edition: WLC
  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: id
  text: Namun, dua orang laki-laki tetap tinggal di perkemahan. Yang seorang bernama Eldad, dan yang kedua bernama Medad. Roh itu hinggap pada mereka. Mereka termasuk orang-orang yang tercatat[a], tetapi mereka belum pergi ke kemah[b], dan mereka bernubuat di perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka termasuk orang-orang yang terdaftar.” Secara harfiah, bahasa Ibrani menyebut mereka termasuk orang-orang yang “tertulis” atau “tercatat”.'
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks peristiwa ini, yang dimaksud kemungkinan besar adalah Kemah Pertemuan.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: tetap tinggal
  rationale: Kata kerja שׁאר menyatakan bahwa kedua orang itu tetap berada atau tertinggal di perkemahan. “Tetap tinggal” alami dalam bahasa Indonesia dan tidak menentukan alasan mereka tidak pergi.
- source_word: בַּמַּחֲנֶה
  choice: di perkemahan
  rationale: מַחֲנֶה menunjuk pada perkemahan Israel; “di perkemahan” merupakan padanan lokatif yang wajar pada kedua kemunculannya.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dua orang
  rationale: Dalam konteks ini אֲנָשִׁים menunjuk pada dua laki-laki, tetapi bahasa Indonesia lazim memakai “dua orang” ketika identitas mereka segera dijelaskan dengan nama.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Yang seorang bernama ... dan yang kedua bernama ...
  rationale: Rumusan ini mempertahankan pembedaan Ibrani antara “yang seorang” dan “yang kedua” sambil tetap mengalir secara alami.
- source_word: אֶלְדָּד / מֵידָד
  choice: Eldad / Medad
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: Roh itu hinggap pada mereka
  rationale: נוּחַ menyatakan bahwa Roh datang untuk berdiam atau hinggap pada mereka. “Hinggap pada” mempertahankan gambaran sesuatu yang datang lalu berada di atas/pada mereka tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: Mereka termasuk orang-orang yang tercatat
  rationale: כְּתֻבִים secara harfiah berarti orang-orang yang “tertulis” atau “tercatat”; konteksnya menunjukkan bahwa nama mereka masuk dalam daftar para tua-tua.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: tetapi mereka tidak pergi ke kemah
  rationale: Akhiran arah pada אֹהֱלָה menunjukkan gerak menuju kemah. “Tidak pergi ke kemah” menyampaikannya secara alami tanpa memperluas “kemah” menjadi “Kemah Pertemuan” di dalam teks utama.
- source_word: וַיִּתְנַבְּאוּ
  choice: dan mereka bernubuat
  rationale: Bentuk hitpael dari נבא menyatakan kegiatan bernubuat; tidak ada keharusan gramatikal untuk menambahkan nuansa “mulai”.
theological_decisions:
- issue: Apakah הָרוּחַ diterjemahkan sebagai Roh ilahi atau roh biasa
  choice: Roh itu
  alternative: roh itu
  rationale: Konteks langsung menyebut Roh ilahi yang juga dicurahkan kepada para tua-tua. Huruf kapital menandai rujukan tersebut tanpa menjelaskan lebih jauh hakikat Roh.
- issue: Apakah הָאֹהֱלָה diperjelas menjadi “Kemah Pertemuan”
  choice: kemah
  alternative: Kemah Pertemuan
  rationale: Konteks sangat mungkin menunjuk pada Kemah Pertemuan, tetapi ayat ini sendiri hanya memakai kata “kemah”. Teks utama mempertahankan bentuk sumber, sedangkan identifikasi kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat cukup dekat dengan urutan Ibrani, tetapi tanda baca dan pembagian kalimat disesuaikan agar mudah dibaca. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
