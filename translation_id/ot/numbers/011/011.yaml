id: NUM.11.11
reference: Numbers 11:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: id
  text: Lalu Musa berkata kepada Yahweh, “Mengapa Engkau memperlakukan hamba-Mu dengan buruk?[a] Mengapa aku tidak mendapat perkenanan di mata-Mu,[b] sehingga Engkau meletakkan beban seluruh bangsa ini[c] ke atasku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa Engkau melakukan yang buruk terhadap hamba-Mu?” Verba Ibrani itu secara lebih harfiah berarti “melakukan yang buruk/jahat” dan mengungkapkan keluhan Musa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mendapat perkenanan di mata-Mu,” sebuah ungkapan Ibrani yang berarti menerima perkenanan dari seseorang.
    reason: cultural_note
  - marker: c
    text: 'Bahasa Ibrani memakai kata “bangsa” dalam bentuk tunggal dengan makna kolektif: “seluruh bangsa ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam bentuk transliterasi yang lazim, bukan menggantinya dengan gelar.
- source_word: הֲרֵעֹתָ לְעַבְדֶּךָ
  choice: Engkau memperlakukan hamba-Mu dengan buruk
  rationale: Mengungkapkan keluhan Musa secara alami dalam bahasa Indonesia sambil mempertahankan daya ungkap verba Ibrani yang secara lebih harfiah berarti melakukan yang buruk atau jahat terhadap seseorang.
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: aku tidak mendapat perkenanan di mata-Mu
  rationale: Mempertahankan gambaran idiom Ibrani sambil tetap dapat dipahami oleh pembaca Indonesia modern.
- source_word: מַשָּׂא
  choice: beban
  rationale: Mempertahankan metafora tentang muatan berat sekaligus menyampaikan beratnya tanggung jawab Musa.
- source_word: כָּל הָעָם הַזֶּה
  choice: seluruh bangsa ini
  rationale: Menerjemahkan kata benda kolektif tunggal הָעָם secara alami dan tidak mengubahnya menjadi kumpulan individu.
- source_word: לָשׂוּם ... עָלָי
  choice: meletakkan ... ke atasku
  rationale: Mempertahankan citra spasial dari beban yang ditaruh pada Musa.
theological_decisions:
- issue: Verba הֲרֵעֹתָ dengan Yahweh sebagai subjek dapat terdengar seolah-olah menuduhkan kejahatan moral kepada Allah.
  choice: memperlakukan hamba-Mu dengan buruk
  alternative: melakukan yang jahat terhadap hamba-Mu
  rationale: Pilihan utama mempertahankan keluhan tajam Musa tanpa secara tidak perlu mengubah keluhan tentang perlakuan yang dirasakannya menjadi pernyataan bahwa Allah melakukan kejahatan moral. Catatan kaki tetap menunjukkan kekuatan ungkapan Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai huruf kapital. Susunan pertanyaan mempertahankan nada keluhan Musa, sedangkan idiom dan metafora sumber dipertahankan sejauh tetap jelas dalam bahasa Indonesia.
