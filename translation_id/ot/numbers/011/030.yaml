  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: id
  text: Lalu Musa, bersama para tua-tua Israel, kembali ke perkemahan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lalu Musa dikumpulkan kembali ke perkemahan, bersama para tua-tua Israel.” Kata kerja Ibrani ini dapat diterjemahkan lebih harfiah demikian, tetapi dalam konteks ini berarti bahwa Musa kembali ke perkemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: kembali
  rationale: Bentuk Nifal dari אסף secara harfiah dapat dipahami sebagai “dikumpulkan,” tetapi dalam konteks ini menyatakan gerak Musa kembali ke perkemahan. “Kembali” menyampaikan makna kontekstual secara alami tanpa menghapus kemungkinan bentuk harfiahnya, yang dicatat dalam catatan kaki.
- source_word: אֶל הַמַּחֲנֶה
  choice: ke perkemahan
  rationale: Preposisi אֶל paling langsung berarti “ke,” sedangkan מַחֲנֶה menunjuk pada perkemahan Israel. Pilihan ini dekat dengan susunan Ibrani dan tidak menambahkan gagasan “masuk ke dalam” secara eksplisit.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: ia dan para tua-tua Israel
  rationale: Kata ganti הוּא bersifat penegas atau aposisional dan memperjelas bahwa Musa kembali bersama para tua-tua. Susunan ini mempertahankan penekanan dan struktur sumber.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Ini adalah padanan baku dan bermartabat untuk konstruksi status terikat tersebut, serta jelas bagi pembaca Indonesia modern.
