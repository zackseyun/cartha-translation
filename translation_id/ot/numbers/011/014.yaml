  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: id
  text: Aku tidak sanggup memikul seluruh bangsa ini seorang diri, sebab bangsa ini terlalu berat bagiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אוּכַל
  choice: Aku tidak sanggup
  rationale: Menyampaikan ketidakmampuan Musa secara alami dan tegas dalam bahasa Indonesia.
- source_word: אָנֹכִי לְבַדִּי
  choice: aku seorang diri
  rationale: Mempertahankan penekanan eksplisit pada subjek dan kesendirian Musa, bukan sekadar keterangan umum 'sendirian'.
- source_word: לָשֵׂאת
  choice: menanggung
  rationale: Kata sumber secara harfiah berarti membawa atau memikul; dalam konteks tanggung jawab atas bangsa, 'menanggung' mempertahankan metafora beban.
- source_word: אֶת כָּל הָעָם הַזֶּה
  choice: seluruh bangsa ini
  rationale: '''Bangsa'' sesuai untuk עָם sebagai komunitas Israel, dan ''seluruh'' mencerminkan כָּל.'
- source_word: כִּי כָבֵד מִמֶּנִּי
  choice: sebab beban itu terlalu berat bagiku
  rationale: Menjadikan subjek implisit dalam klausa Ibrani jelas secara wajar dalam bahasa Indonesia sambil mempertahankan metafora berat dan makna melampaui kemampuan Musa.
theological_decisions:
- issue: Penekanan bahwa Musa seorang diri tidak mampu memikul bangsa itu
  choice: aku seorang diri
  alternative: sendirian
  rationale: Bentuk yang dipilih menjaga penekanan ganda אָנֹכִי ... לְבַדִּי tanpa menambahkan kesimpulan teologis tentang kemampuan Musa jika dibantu orang lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'Aku ... aku seorang diri' disengaja untuk mempertahankan penekanan teks Ibrani.
