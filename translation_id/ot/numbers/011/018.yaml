revisions:
- from: Katakanlah kepada bangsa itu, ‘Kuduskanlah dirimu[a] untuk menyambut hari esok. Kamu akan makan daging, karena kamu telah menangis di hadapan Yahweh dengan berkata, “Siapa yang akan memberi kami daging untuk dimakan? Dahulu hidup kami enak di Mesir.” Yahweh akan memberi kamu daging, dan kamu akan memakannya.’”
  to: 'Katakanlah kepada bangsa itu: “Kuduskanlah diri kalian[a] untuk besok, dan kalian akan makan daging, karena kalian telah menangis sehingga Yahweh mendengarnya, dengan berkata, ‘Siapa yang akan memberi kami daging untuk dimakan? Sebab keadaan kami baik di Mesir.’ Yahweh akan memberi kalian daging, dan kalian akan makan.”'
  rationale: Revisi membetulkan bentuk tunggal menjadi jamak, menghilangkan tambahan makna yang tidak diperlukan dalam keluhan tentang Mesir, dan mengungkapkan idiom “di telinga Yahweh” sebagai tangisan yang didengar Yahweh. Tanda baca kutipan luar dan kutipan di dalamnya juga dinormalkan. Susunan “keadaan kami baik di Mesir” mempertahankan predikasi sumber tanpa memasukkan perbandingan eksplisit atau penilaian nostalgia yang lebih kuat.
