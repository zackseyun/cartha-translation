language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: id
  text: 'Katakanlah kepada bangsa itu: “Kuduskanlah diri kalian[a] untuk besok, dan kalian akan makan daging, karena kalian telah menangis sehingga Yahweh mendengarnya, dengan berkata, ‘Siapa yang akan memberi kami daging untuk dimakan? Sebab keadaan kami baik di Mesir.’ Yahweh akan memberi kalian daging, dan kalian akan makan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sucikanlah diri kalian untuk besok.” Kata Ibrani ini menyatakan tindakan mengkhususkan atau menguduskan diri sebagai persiapan bagi tindakan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: Katakanlah
  rationale: Bentuk imperfek orang kedua maskulin tunggal ditujukan kepada Musa dan berfungsi sebagai perintah; imperatif Indonesia menyampaikannya dengan alami.
- source_word: הִתְקַדְּשׁוּ
  choice: Kuduskanlah dirimu
  rationale: Imperatif hitpael dari קדשׁ menyatakan tindakan menguduskan atau mempersiapkan diri secara khusus bagi tindakan Yahweh; bentuk ini mempertahankan bobot religiusnya.
- source_word: לְמָחָר
  choice: untuk menyambut hari esok
  rationale: Preposisi לְ mengarahkan pengudusan itu kepada hari yang akan datang; ungkapan ini lebih alami dalam bahasa Indonesia daripada 'untuk besok' setelah 'kuduskanlah dirimu'.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: Kamu akan makan daging
  rationale: בָּשָׂר dalam konteks ini berarti daging sebagai makanan, sedangkan bentuk verbal sesudah imperatif menunjukkan hasil atau kejadian mendatang.
- source_word: בְּכִיתֶם
  choice: kamu telah menangis
  rationale: Bentuk qatal menunjuk kepada tindakan terdahulu yang menjadi alasan bagi respons Yahweh, sehingga bentuk perfektif Indonesia sesuai.
- source_word: בְּאָזְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Secara harfiah berarti 'di telinga Yahweh', yakni dalam jangkauan pendengaran-Nya. 'Di hadapan Yahweh' merupakan ungkapan Indonesia yang wajar tanpa menyangkal bahwa Yahweh mendengar keluhan itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Siapa yang akan memberi kami daging untuk dimakan?
  rationale: Hifil אכל bersifat kausatif, 'membuat atau memungkinkan makan'. Ungkapan Indonesia ini jelas dan dekat dengan maksud sumber.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Dahulu hidup kami enak di Mesir
  rationale: Secara harfiah, 'sebab baik bagi kami di Mesir'. Rumusan ini menyampaikan penilaian nostalgia bangsa itu tanpa menambahkan perbandingan eksplisit yang tidak terdapat dalam bahasa Ibrani.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: Yahweh akan memberi kamu daging
  rationale: Konjungsi sederhana diterjemahkan melalui kesinambungan kalimat, tanpa menambahkan 'oleh karena itu' yang akan mempertegas hubungan kausal melebihi bentuk sumber.
- source_word: וַאֲכַלְתֶּם
  choice: dan kamu akan memakannya
  rationale: Pengulangan tindakan makan dipertahankan demi penekanan; akhiran '-nya' merujuk secara alami kepada daging yang baru disebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Nuansa הִתְקַדְּשׁוּ
  choice: Kuduskanlah dirimu
  alternative: Persiapkanlah dirimu
  rationale: '''Kuduskanlah'' mempertahankan dimensi religius dan tindakan mengkhususkan diri, sedangkan ''persiapkanlah'' saja terlalu umum.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kamu' dipilih agar alami bagi pembaca umum; konteks menjelaskan bahwa seluruh bangsa disapa. Kutipan bertingkat dipertahankan dengan tanda baca Indonesia yang jelas.
