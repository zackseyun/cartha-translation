  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי שָׁם֙ קָֽבְר֔וּ אֶת הָ/עָ֖ם הַ/מִּתְאַוִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: id
  text: Maka tempat itu dinamai Kibrot-Hataawa[a], sebab di sanalah mereka menguburkan orang-orang yang sangat menginginkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibrot-Hataawa kemungkinan berarti “Kuburan Keinginan yang Kuat” atau “Kuburan Keinginan yang Rakus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: Maka tempat itu dinamai
  rationale: Rumus penamaan Ibrani secara harfiah menyebut 'memanggil nama tempat itu'. Bentuk pasif alami dalam bahasa Indonesia tidak menetapkan subjek yang tidak dinyatakan secara eksplisit dalam ayat ini, sekaligus mempertahankan alur narasi.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Kibrot-Hataawa
  rationale: Nama tempat ditransliterasikan dari bahasa Ibrani. Makna unsur-unsurnya dijelaskan dalam catatan kaki agar permainan makna dengan tindakan menguburkan dan nafsu keinginan tetap terlihat.
- source_word: כִּי שָׁם
  choice: sebab di sanalah
  rationale: כִּי memberikan alasan bagi nama tempat itu, sedangkan שָׁם menunjuk lokasi. Partikel '-lah' secara alami menegaskan bahwa penguburan terjadi di tempat tersebut.
- source_word: קָבְרוּ אֶת הָעָם
  choice: mereka menguburkan orang-orang
  rationale: Bentuk jamak קָבְרוּ diterjemahkan tanpa menambahkan identitas pelaku yang tidak disebutkan. הָעָם dalam konteks ini menunjuk kelompok tertentu, sehingga 'orang-orang' lebih alami daripada 'bangsa itu'.
- source_word: הַמִּתְאַוִּים
  choice: yang dikuasai nafsu keinginan
  rationale: Partisipel hitpael menggambarkan orang-orang yang menyerahkan diri pada keinginan kuat atau tamak. Ungkapan ini mempertahankan bobot negatif konteks tanpa menyempitkannya menjadi hawa nafsu seksual.
theological_decisions:
- issue: Sifat keinginan orang-orang yang dikuburkan
  choice: dikuasai nafsu keinginan
  alternative: yang sangat menginginkan; yang bernafsu
  rationale: Konteks berbicara tentang hasrat rakus akan makanan, bukan secara khusus hasrat seksual. Pilihan ini mempertahankan kecaman moral dalam bentuk refleksif/partisipial Ibrani tanpa memasukkan kategori dosa yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Nama tempat ditransliterasikan, sedangkan maknanya disediakan dalam catatan kaki. Struktur kalimat dibuat alami tanpa menghilangkan hubungan sebab-akibat dan permainan kata Ibrani.
