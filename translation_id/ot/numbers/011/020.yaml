base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: id
  text: selama sebulan penuh, sampai daging itu keluar dari lubang hidung kalian dan menjadi memuakkan bagi kalian,[a] sebab kalian telah menolak Yahweh yang ada di tengah-tengah kalian dan menangis di hadapan-Nya, seraya berkata, ‘Mengapa kita sampai keluar dari Mesir?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi sesuatu yang menjijikkan bagi kalian.” Ungkapan Ibrani ini menyatakan rasa jijik yang kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: selama sebulan penuh
  rationale: Ungkapan harfiah 'sampai satu bulan hari-hari' menyatakan jangka waktu satu bulan penuh; bentuk Indonesia ini alami dan mempertahankan penekanannya.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: daging itu keluar dari lubang hidung kalian
  rationale: אַף menunjuk pada hidung atau lubang hidung dalam gambaran jasmani yang sengaja dibuat tajam. Subjek tersirat diperjelas sebagai 'daging itu' dari konteks ayat sebelumnya.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: menjadi sesuatu yang menjijikkan bagi kalian
  rationale: זָרָא menyampaikan rasa jijik atau muak yang kuat; frasa ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: מְאַסְתֶּם
  choice: kalian telah menolak
  rationale: Kata kerja ini dapat berarti menolak atau memandang hina. 'Menolak' mempertahankan gagasan penolakan terhadap Yahweh tanpa menambahkan nuansa emosi yang belum pasti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi sebagaimana tampil dalam teks Ibrani, bukan diganti dengan gelar.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: yang ada di tengah-tengah kalian
  rationale: Ungkapan ini menunjuk pada kehadiran Yahweh di tengah komunitas, bukan keberadaan batin dalam setiap individu.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: dan menangis di hadapan-Nya
  rationale: Terjemahan ini mempertahankan tindakan menangis serta latar relasionalnya di hadapan Yahweh.
- source_word: לָמָּה זֶּה יָצָאנוּ מִמִּצְרָיִם
  choice: Mengapa kita keluar dari Mesir?
  rationale: Pertanyaan langsung ini mempertahankan keluhan dalam sumber tanpa menambahkan kata penegas yang tidak diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Makna penolakan terhadap Yahweh
  choice: telah menolak Yahweh
  alternative: telah menghina Yahweh
  rationale: מְאַסְתֶּם mencakup penolakan yang dapat bernuansa penghinaan. 'Menolak' menjaga tuduhan utama secara langsung tanpa mempersempitnya menjadi satu sikap emosional.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti jamak 'kalian' dipakai karena bentuk Ibraninya jamak. 'Daging itu' ditambahkan untuk menjelaskan subjek tersirat berdasarkan konteks langsung, sedangkan gambaran tajam 'keluar dari lubang hidung' dipertahankan.
