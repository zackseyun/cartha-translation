- from: Bangsa itu seperti orang-orang yang mengeluhkan kesusahan sehingga terdengar oleh Yahweh.[a] Yahweh mendengarnya, lalu murka-Nya menyala. Api Yahweh[b] pun berkobar di antara mereka dan melalap apa yang ada di tepi perkemahan.[c]
  to: Bangsa itu seperti orang-orang yang mengeluhkan kesusahan di telinga Yahweh.[a] Yahweh mendengarnya, lalu murka-Nya menyala; api Yahweh[b] pun berkobar di antara mereka dan melalap di bagian tepi perkemahan.[c]
  rationale: Revisi terutama memulihkan idiom Ibrani “di telinga Yahweh” dan menghindari konjungsi kausal yang tidak ada dalam sumber. Objek kata “melalap” tetap dibiarkan tersirat, seperti dalam teks Ibrani, sementara catatan kaki menjelaskan ketidakpastian itu. Tidak ada perubahan pada atribusi api kepada Yahweh atau pada gambaran murka ilahi.
