id: NUM.11.1
reference: Numbers 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: id
  text: Bangsa itu seperti orang-orang yang mengeluhkan kesusahan di telinga Yahweh.[a] Yahweh mendengarnya, lalu murka-Nya menyala; api Yahweh[b] pun berkobar di antara mereka dan melalap di bagian tepi perkemahan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di telinga Yahweh,” sebuah ungkapan yang berarti keluhan mereka sampai kepada perhatian Yahweh. Bentuk Ibraninya langka dan agak sulit. Dapat juga diterjemahkan, “Bangsa itu menjadi para pengeluh,” “Bangsa itu mengeluh,” atau mungkin, “Bangsa itu seolah-olah mengeluh.” Kata yang diterjemahkan “kesusahan” juga dapat berarti “hal buruk” atau “kemalangan.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “api dari Yahweh.”
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “melalap di tepi perkemahan.” Bahasa Ibrani tidak menyebutkan secara tersurat apa atau siapa yang dilalap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים
  choice: Bangsa itu seperti orang-orang yang mengeluhkan
  rationale: Mempertahankan unsur perbandingan pada prefiks כְּ dalam bentuk Ibrani yang langka dan sulit, sambil memakai susunan bahasa Indonesia yang wajar.
- source_word: רַע
  choice: kesusahan
  rationale: Dalam konteks keluhan Israel, kata ini paling mungkin menunjuk pada keadaan buruk, kemalangan, atau kesukaran yang mereka alami, bukan menyebut keluhan itu sebagai kejahatan moral.
- source_word: בְּאָזְנֵי יְהוָה
  choice: sehingga terdengar oleh Yahweh
  rationale: Menyampaikan idiom harfiah 'di telinga Yahweh' secara alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan tindakan Yahweh yang kemudian mendengar.
- source_word: וַיִּחַר אַפּוֹ
  choice: murka-Nya menyala
  rationale: Mempertahankan metafora panas dalam idiom Ibrani tanpa menerjemahkan secara kaku unsur harfiahnya, yaitu 'hidung-Nya'.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: Api Yahweh pun berkobar di antara mereka
  rationale: Mempertahankan konstruksi 'api Yahweh' dan arti lokatif בָּם tanpa menentukan lebih jauh apakah genitif itu terutama menyatakan kepunyaan atau asal.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: melalap apa yang ada di tepi perkemahan
  rationale: Objek kata kerja tidak dinyatakan dalam bahasa Ibrani. Ungkapan umum 'apa yang ada' menghindari pembatasan yang tidak pasti pada orang atau benda, sedangkan 'tepi perkemahan' menerjemahkan lokasi tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar umum.
- issue: Hubungan api dengan Yahweh
  choice: Api Yahweh
  alternative: api dari Yahweh
  rationale: Konstruksi genitif Ibrani dipertahankan agar atribusi langsung kepada Yahweh tetap jelas tanpa mempersempit hubungan itu hanya menjadi asal api.
- issue: Gambaran murka ilahi
  choice: murka-Nya menyala
  alternative: Ia menjadi murka
  rationale: Pilihan ini mempertahankan citra Ibrani tentang murka yang berkobar dan hubungannya dengan api penghakiman dalam klausa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Kalimat dibuat jelas bagi pembaca umum, tetapi perbandingan yang tidak lazim, metafora murka yang menyala, dan ketidakpastian mengenai objek yang dilalap tetap dipertahankan atau dijelaskan dalam catatan kaki.
