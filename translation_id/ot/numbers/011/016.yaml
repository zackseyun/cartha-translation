id: NUM.11.16
reference: Numbers 11:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Kumpulkanlah bagi-Ku[a] tujuh puluh laki-laki dari antara para tua-tua Israel, yang kauketahui sebagai tua-tua bangsa itu dan para petugasnya[b]. Bawalah mereka ke Kemah Pertemuan, lalu biarlah mereka berdiri di sana bersamamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Himpunkanlah bagi-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “para pejabatnya”; istilah Ibrani ini menunjuk kepada petugas administratif di bawah para tua-tua.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan ungkapan yang wajar dan bermartabat untuk ujaran langsung Allah.
- source_word: אֶסְפָה לִּי
  choice: Kumpulkanlah bagi-Ku
  rationale: Menjaga tindakan mengumpulkan orang serta nuansa kepentingan atau tujuan pada לִּי.
- source_word: שִׁבְעִים אִישׁ
  choice: tujuh puluh orang
  rationale: “Orang” alami sesudah bilangan dalam bahasa Indonesia; konteks para tua-tua menunjukkan bahwa yang dimaksud adalah laki-laki dewasa.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: dari antara para tua-tua Israel
  rationale: “Dari antara” menyatakan pemilihan sejumlah orang dari kelompok para tua-tua Israel.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: yang kauketahui sebagai
  rationale: Mengungkapkan secara alami bahwa Musa telah mengenal mereka dalam kedudukan tersebut.
- source_word: זִקְנֵי הָעָם
  choice: tua-tua bangsa itu
  rationale: Mempertahankan sebutan kepemimpinan sosial-politik dan rujukan kembali kepada Israel.
- source_word: וְשֹׁטְרָיו
  choice: dan para petugasnya
  rationale: שֹׁטֵר menunjuk kepada pejabat atau petugas administratif; akhiran pronominal merujuk kepada bangsa itu.
- source_word: וְלָקַחְתָּ אֹתָם
  choice: Bawalah mereka
  rationale: Dalam perintah bergerak menuju tempat yang ditentukan, “bawalah” lebih alami daripada “ambillah” tanpa kehilangan makna.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan langsung dan lazim bagi nama tempat kudus tersebut.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: lalu biarlah mereka berdiri di sana bersamamu
  rationale: Mempertahankan daya direktif serta makna mengambil tempat atau berdiri di hadapan pihak berwenang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama diri ilahi; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kauketahui” dan “bersamamu” menjaga kelancaran tuturan langsung. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
