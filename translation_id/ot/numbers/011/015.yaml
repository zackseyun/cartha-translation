  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: id
  text: Jika Engkau memperlakukan aku seperti ini, bunuhlah aku saja, jika aku mendapat perkenanan di mata-Mu, dan jangan biarkan aku melihat kemalanganku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesusahanku” atau “malapetaka yang menimpaku.” Kata Ibrani ini dapat berarti keadaan buruk, kesusahan, atau bencana, bukan hanya kejahatan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Memperkenalkan klausa bersyarat; waw penghubung wajar diserap tanpa harus diterjemahkan sebagai “dan” pada awal kalimat.
- source_word: כָּכָה
  choice: seperti ini
  rationale: Ungkapan Indonesia yang alami untuk adverbia yang menunjuk pada cara Allah bertindak terhadap Musa.
- source_word: אַתְּ ... עֹשֶׂה לִּי
  choice: Engkau memperlakukan aku
  rationale: Konstruksi עשה dengan ל dalam konteks ini menyatakan cara Allah bertindak terhadap Musa; “memperlakukan aku” alami sekaligus mempertahankan daya relasionalnya.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: bunuhlah aku sekarang juga
  rationale: Infinitif absolut bersama imperatif memberi penegasan kuat, sedangkan נָא menandai permohonan. “Sekarang juga” menyampaikan desakan itu secara alami.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: jika aku mendapat perkenanan di mata-Mu
  rationale: Mempertahankan gambaran idiom Ibrani tentang dipandang dengan baik, dalam bahasa Indonesia yang bermartabat dan dapat dipahami.
- source_word: וְאַל אֶרְאֶה
  choice: dan jangan biarkan aku melihat
  rationale: Larangan ini berbentuk permohonan kepada Allah agar Musa tidak perlu menyaksikan atau mengalami akibat yang dimaksud.
- source_word: בְּרָעָתִי
  choice: kemalanganku
  rationale: רָעָה di sini dapat menunjuk pada kesusahan, malapetaka, atau keadaan buruk, bukan hanya kejahatan moral. “Kemalanganku” menjaga cakupan adversitas pribadi dalam konteks keputusasaan Musa.
theological_decisions:
- issue: Makna בְּרָעָתִי dalam permohonan Musa
  choice: kemalangan atau kesusahan pribadi, bukan kejahatan moral
  alternative: kejahatanku; malapetaka yang akan menimpaku; kesusahanku
  rationale: Konteksnya adalah keputusasaan Musa karena beban memimpin umat, bukan pengakuan akan keburukan moral. Pilihan ini tidak memasukkan klaim teologis yang tidak dinyatakan teks, sambil mempertahankan kemungkinan nuansa kesusahan atau bencana.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Penegasan konstruksi Ibrani disampaikan dengan “sekarang juga,” dan ambiguitas רָעָה dijaga melalui catatan kaki.
