id: NUM.11.21
reference: Numbers 11:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ רַגְלִ֔י הָ/עָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּ/קִרְבּ֑/וֹ וְ/אַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָ/הֶ֔ם וְ/אָכְל֖וּ חֹ֥דֶשׁ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: id
  text: Namun Musa berkata, “Rakyat yang di tengah-tengahnya aku berada berjumlah enam ratus ribu orang yang berjalan kaki[a], tetapi Engkau telah berfirman, ‘Aku akan memberi mereka daging, dan mereka akan memakannya selama sebulan penuh[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “enam ratus ribu laki-laki yang berjalan kaki.” Ungkapan Ibrani ini dapat menunjuk kepada orang-orang yang dihitung sebagai pejalan kaki atau sebagai pasukan berjalan kaki.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “sebulan hari-hari,” yaitu satu bulan penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Musa berkata
  rationale: Bentuk naratif ini secara dasar melanjutkan kisah, tetapi dalam konteks Musa menyampaikan keberatan terhadap firman sebelumnya; “Namun” mengungkapkan hubungan pertentangan itu secara alami.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: enam ratus ribu
  rationale: Konstruksi bilangan ini diterjemahkan secara langsung.
- source_word: רַגְלִי הָעָם
  choice: Rakyat ... berjumlah enam ratus ribu orang yang berjalan kaki
  rationale: רַגְלִי berkaitan dengan “kaki” dan dapat menunjuk kepada orang-orang yang berjalan kaki atau pasukan berjalan kaki. Terjemahan ini mempertahankan gambaran sumber tanpa menjadikannya secara pasti istilah militer.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: yang di tengah-tengahnya aku berada
  rationale: Ungkapan בְּקֶרֶב dengan akhiran pronominal berarti “di tengah-tengahnya” atau “di antara mereka.” Pilihan ini dekat dengan bentuk Ibrani dan tetap jelas dalam bahasa Indonesia.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: tetapi Engkau telah berfirman
  rationale: Kata ganti אַתָּה dinyatakan secara tegas dan bersifat kontras. “Engkau” mempertahankan penekanan tersebut, sedangkan “berfirman” sesuai karena Musa berbicara kepada Allah.
- source_word: בָּשָׂר
  choice: daging
  rationale: Dalam konteks ini kata tersebut berarti daging hewan sebagai makanan.
- source_word: אֶתֵּן לָהֶם
  choice: Aku akan memberi mereka
  rationale: Bentuk verba menyatakan tindakan Allah yang akan dilakukan.
- source_word: וְאָכְלוּ
  choice: dan mereka akan memakannya
  rationale: Verba ini dikoordinasikan dengan janji sebelumnya dan menyatakan hasil yang akan terjadi. Akhiran “-nya” memperjelas bahwa yang dimakan ialah daging tersebut.
- source_word: חֹדֶשׁ יָמִים
  choice: selama sebulan penuh
  rationale: Secara harfiah ungkapan ini berbunyi “sebulan hari-hari,” sebuah idiom untuk satu bulan penuh. Terjemahan idiomatis dipakai dalam teks, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Rakyat” dipilih untuk הָעָם, “Engkau” memakai huruf kapital karena sapaan langsung kepada Allah, dan susunan kalimat mempertahankan penekanan Musa pada besarnya jumlah rakyat serta kontras dengan firman Allah.
