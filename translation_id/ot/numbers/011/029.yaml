  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: id
  text: Namun Musa berkata kepadanya, “Apakah engkau cemburu demi aku?[a] Ah, sekiranya seluruh umat Yahweh menjadi nabi, dan kiranya Yahweh menaruh Roh-Nya atas mereka![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah engkau begitu bersemangat membela aku?”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “memberikan Roh-Nya atas mereka.” Ungkapan ini meneruskan harapan Musa: “dan kiranya Yahweh menaruh Roh-Nya atas mereka.”'
    reason: source_ambiguity
lexical_decisions:
- source_word: הַמְקַנֵּא
  choice: apakah engkau cemburu
  rationale: Bentuk partisip dari קנא di sini menanyakan sikap Yosua yang membela kedudukan Musa. ‘Cemburu’ menyampaikan nuansa perlindungan pribadi atau rasa tersaingi, sementara kemungkinan arti ‘bersemangat membela’ dicatat dalam catatan kaki.
- source_word: לִי
  choice: demi aku
  rationale: Preposisi ל dengan akhiran orang pertama menunjukkan kepentingan Musa sebagai sasaran sikap Yosua. ‘Demi aku’ alami dalam bahasa Indonesia dan mempertahankan unsur kepentingan pribadi tersebut.
- source_word: וּמִי יִתֵּן
  choice: Ah, sekiranya
  rationale: Ungkapan idiomatis ini menyatakan harapan kuat, bukan pertanyaan harfiah ‘siapa yang akan memberi’. ‘Ah, sekiranya’ mempertahankan daya optatif sekaligus terdengar wajar dan bermartabat.
- source_word: כָּל עַם יְהוָה
  choice: seluruh umat Yahweh
  rationale: Rangkaian konstruksi ini berarti segenap umat yang menjadi milik Yahweh. ‘Seluruh umat Yahweh’ jelas, ringkas, dan mempertahankan nama ilahi.
- source_word: נְבִיאִים
  choice: nabi
  rationale: Nomina ini secara langsung berarti para nabi. Dalam konstruksi predikatif bahasa Indonesia, ‘menjadi nabi’ merupakan bentuk yang alami tanpa perlu penanda jamak tambahan.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: karena Yahweh menaruh Roh-Nya atas mereka
  rationale: כִּי dapat menghubungkan keadaan kenabian dengan tindakan Yahweh sebagai dasar atau sarana pemberdayaannya. ‘Menaruh ... atas mereka’ mempertahankan gambaran Ibrani tentang Roh yang berada atas seseorang, sedangkan hubungan sintaksisnya yang dapat dipahami sebagai isi lanjutan dari harapan dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: רוּחוֹ
  choice: Roh-Nya
  rationale: Dalam konteks orang-orang yang bernubuat karena pemberdayaan ilahi, רוּחַ merujuk pada Roh milik Yahweh, bukan angin atau napas. Huruf kapital memperjelas referennya dalam ejaan Indonesia.
theological_decisions:
- issue: Makna רוּחוֹ dalam konteks pemberdayaan untuk bernubuat
  choice: Roh-Nya
  alternative: roh-Nya
  rationale: Konteks langsung menghubungkan Roh Yahweh dengan kemampuan bernubuat. Kapitalisasi membantu pembaca mengenali referen ilahi tanpa menambahkan penjelasan dogmatis yang tidak dinyatakan ayat.
- issue: Hubungan כִּי dengan harapan Musa
  choice: karena Yahweh menaruh Roh-Nya atas mereka
  alternative: dan kiranya Yahweh menaruh Roh-Nya atas mereka
  rationale: כִּי secara wajar dapat menyatakan alasan atau dasar mereka menjadi nabi, tetapi dalam lingkup ungkapan harapan וּמִי יִתֵּן unsur ini juga dapat dipahami sebagai bagian kedua dari harapan Musa. Teks utama memilih hubungan kausal yang alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan sintaksis lainnya.
- issue: Penyajian nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal ‘engkau’ yang sesuai bagi percakapan langsung dalam narasi Alkitab. Ungkapan ‘Ah, sekiranya’ menyampaikan harapan yang kuat tanpa terdengar usang; susunan kalimat tetap dekat dengan gerak teks Ibrani.
