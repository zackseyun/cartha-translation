  to: Orang-orang itu pergi ke sana kemari dan memungutnya, lalu menggilingnya dengan batu giling atau menumbuknya dalam lesung. Mereka merebusnya dalam periuk dan membuatnya menjadi kue-kue. Rasanya seperti rasa minyak yang kaya.[a]
