base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: id
  text: Orang-orang itu pergi ke sana kemari dan memungutnya, lalu menggilingnya dengan batu giling atau menumbuknya dalam lesung. Mereka merebusnya dalam periuk dan membuatnya menjadi kue-kue. Rasanya seperti rasa minyak yang kaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti rasa minyak segar.” Ungkapan Ibrani לְשַׁד הַשָּׁמֶן sulit dipastikan artinya; kemungkinan menunjuk pada kekayaan atau kesegaran minyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: berjalan ke sana kemari
  rationale: Mengungkapkan gerak bolak-balik di suatu kawasan secara alami dalam bahasa Indonesia, dalam konteks kebiasaan mengumpulkan manna.
- source_word: לָקְטוּ
  choice: memungutnya
  rationale: Sesuai dengan tindakan mengumpulkan bahan makanan yang tersebar di tanah dan lebih konkret daripada sekadar 'mengumpulkannya'.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: menggilingnya dengan batu giling
  rationale: Mempertahankan alat konkret רֵחַיִם serta menyampaikan fungsi instrumental preposisi secara wajar.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: menumbuknya dalam lesung
  rationale: Pasangan kata 'menumbuk dalam lesung' alami dan tepat untuk tindakan menghancurkan bahan dengan alat tersebut.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: merebusnya dalam periuk
  rationale: בשל dapat berarti memasak atau merebus; 'merebus' mempertahankan cara pengolahan yang kemungkinan dimaksud, sedangkan 'periuk' cocok untuk wadah פָּרוּר.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: membuatnya menjadi kue-kue
  rationale: Menyampaikan perubahan manna menjadi עֻגוֹת secara langsung tanpa menambahkan bentuk yang tidak dinyatakan dalam teks.
- source_word: טַעְמוֹ
  choice: rasanya
  rationale: Padanan Indonesia yang langsung dan idiomatis bagi nomina 'rasa' dengan pronomina kepunyaan.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: sari minyak yang kaya
  rationale: Ungkapan Ibrani ini sulit; 'sari' mempertahankan gagasan esensi atau kandungan, sementara 'yang kaya' menyampaikan nuansa kepekatan atau kegurihan tanpa memaksakan satu arti yang pasti.
