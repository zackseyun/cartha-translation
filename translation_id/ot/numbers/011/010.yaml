id: NUM.11.10
reference: Numbers 11:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: id
  text: Musa mendengar umat itu menangis menurut kelompok-kelompok keluarga mereka[a], setiap orang di pintu kemahnya. Murka Yahweh menyala dengan hebat, dan hal itu buruk dalam pandangan Musa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut keluarga-keluarga mereka.” Istilah Ibrani ini dapat menunjuk kepada keluarga atau kelompok kekerabatan yang lebih besar.
    reason: lexical_alternative
  - marker: b
    text: Atau “hal itu tidak menyenangkan Musa.” Secara harfiah, “hal itu buruk dalam pandangan Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk ini menyatakan bahwa Musa menangkap suara tangisan mereka; 'mendengar' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk kepada umat Israel sebagai keseluruhan kolektif; 'bangsa itu' sesuai dengan konteks dan mempertahankan acuan definitnya.
- source_word: בֹּכֶה
  choice: menangis
  rationale: Partisip ini menggambarkan tindakan yang sedang berlangsung. 'Menangis' alami dalam bahasa Indonesia dan tetap menyampaikan suasana keluhan.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה dapat menunjuk kepada kelompok kekerabatan, yakni kaum atau keluarga besar. 'Menurut kaum mereka' mempertahankan gagasan pengelompokan.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Bentuk tunggal ini dipakai secara distributif, sehingga 'setiap orang' menyampaikan bahwa masing-masing individu menangis di kemahnya tanpa membuat bahasa Indonesia terasa kaku.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: di pintu kemahnya
  rationale: פֶּתַח berarti bukaan atau pintu masuk. Ungkapan ini ringkas, alami, dan mempertahankan gambaran tempat dalam teks.
- source_word: וַיִּחַר אַף יְהוָה
  choice: kemarahan Yahweh menyala
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang murka yang menyala sekaligus tetap mudah dimengerti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: מְאֹד
  choice: dengan sangat hebat
  rationale: מְאֹד memperkuat intensitas kemarahan. Ungkapan ini sesuai dengan metafora 'menyala' dan menyampaikan derajat yang kuat.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: hal itu buruk dalam pandangan Musa
  rationale: Terjemahan ini mempertahankan idiom evaluatif teks Ibrani dan tidak menetapkan secara berlebihan apa tepatnya yang menjadi anteseden dari 'hal itu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Acuan dan nuansa וּבְעֵינֵי מֹשֶׁה רָע
  choice: hal itu buruk dalam pandangan Musa
  alternative: hal itu tidak menyenangkan Musa
  rationale: Teks Ibrani membiarkan acuan subjek tersirat dan memakai kata רָע, 'buruk/jahat'. Terjemahan utama mempertahankan ketegangan evaluatif dan ambiguitas itu; catatan memberikan padanan idiomatis yang mungkin.
- issue: Bentuk distributif אִישׁ
  choice: setiap orang
  alternative: setiap laki-laki
  rationale: Dalam konteks ini אִישׁ berfungsi distributif untuk tiap anggota rumah tangga yang tampak di pintu kemahnya. 'Setiap orang' menyampaikan fungsi tersebut secara alami tanpa memastikan bahwa fokus semantisnya ialah jenis kelamin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur ayat mempertahankan urutan pengamatan Musa, murka Yahweh, lalu penilaian Musa. Metafora kemarahan yang 'menyala' dan idiom 'dalam pandangan Musa' sengaja dipertahankan karena penting bagi warna teks sumber.
