  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: id
  text: Kemudian Yahweh turun dalam awan dan berbicara kepada Musa. Ia mengambil sebagian dari Roh yang ada pada Musa dan menaruhnya pada tujuh puluh orang tua-tua itu. Ketika Roh itu hinggap pada mereka, mereka bernubuat, tetapi mereka tidak terus bernubuat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka tidak berhenti bernubuat.” Ungkapan Ibrani ini singkat dan telah dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Menyampaikan gerak ke bawah secara alami dan mempertahankan gambaran teofanis dalam teks.
- source_word: בֶּעָנָן
  choice: dalam awan
  rationale: Kata sandang Ibrani menunjuk pada awan yang dikenal dalam konteks kehadiran Yahweh di padang gurun.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: berbicara kepadanya
  rationale: Mempertahankan pronomina sumber dan merupakan padanan Indonesia yang alami untuk דבר אל.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: mengambil sebagian dari Roh yang ada pada Musa
  rationale: Kata kerja yang jarang dipakai ini menyatakan pengambilan atau pembagian dari Roh. Nama “Musa” dipakai pada penyebutan kedua untuk menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia, tanpa menyiratkan bahwa Roh berkurang.
- source_word: רוּחַ
  choice: Roh
  rationale: Konteksnya ialah kuasa ilahi yang memungkinkan kegiatan kenabian, sehingga “Roh” paling tepat; huruf kapital menandai rujukan kepada Roh Allah.
- source_word: וַיִּתֵּן עַל
  choice: menaruhnya pada
  rationale: Mempertahankan gambaran Roh yang ditempatkan pada para tua-tua dengan ungkapan Indonesia yang wajar.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: ketujuh puluh tua-tua itu
  rationale: Ungkapan Ibrani menunjuk kepada tujuh puluh orang yang merupakan para tua-tua. Bentuk ini alami dalam bahasa Indonesia dan tetap menyampaikan jumlah serta kedudukan mereka.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: ketika Roh itu hinggap pada mereka
  rationale: “Hinggap pada” merupakan ungkapan Indonesia yang lazim untuk kehadiran Roh yang turun dan menetap pada seseorang, serta mempertahankan citra נוח על.
- source_word: וַיִּתְנַבְּאוּ
  choice: mereka bernubuat
  rationale: Padanan baku dan jelas untuk tindakan berbicara atau bertindak sebagai nabi.
- source_word: וְלֹא יָסָפוּ
  choice: tetapi tidak meneruskannya
  rationale: Dalam konteks ini ungkapan singkat tersebut kemungkinan besar berarti bahwa kegiatan bernubuat itu tidak berlanjut. Ambiguitasnya dipertahankan melalui catatan kaki.
theological_decisions:
- issue: Apakah רוּחַ merujuk kepada Roh ilahi atau sekadar roh
  choice: Roh ilahi
  alternative: roh
  rationale: Roh yang ada pada Musa dibagikan kepada para tua-tua dan menghasilkan kegiatan kenabian, sehingga konteks kuat menunjuk kepada Roh Allah.
- issue: Makna וְלֹא יָסָפוּ
  choice: mereka tidak meneruskan kegiatan bernubuat itu
  alternative: mereka tidak berhenti
  rationale: Ungkapan Ibrani ini padat dan dapat dipahami dengan lebih dari satu cara. Makna bahwa nubuat itu tidak berlanjut dipakai dalam teks utama, sedangkan pembacaan “tidak berhenti” dicatat agar ketegangan asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Pronomina pertama dipertahankan sebagai “kepadanya”, lalu “Musa” disebut secara eksplisit untuk mencegah rangkaian pronomina yang membingungkan. Istilah “tua-tua” dipakai sebagai sebutan jabatan yang sudah dikenal dalam bahasa Alkitab Indonesia.
