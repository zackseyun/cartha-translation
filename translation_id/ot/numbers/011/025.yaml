revisions:
- from: Kemudian Yahweh turun dalam awan dan berbicara kepadanya. Dia mengambil sebagian dari Roh yang ada pada Musa dan menaruhnya pada ketujuh puluh tua-tua itu. Ketika Roh itu hinggap pada mereka, mereka bernubuat, tetapi tidak meneruskannya.[a]
  to: Kemudian Yahweh turun dalam awan dan berbicara kepada Musa. Ia mengambil sebagian dari Roh yang ada pada Musa dan menaruhnya pada tujuh puluh orang tua-tua itu. Ketika Roh itu hinggap pada mereka, mereka bernubuat, tetapi mereka tidak terus bernubuat.[a]
  rationale: Revisi membetulkan bentuk bilangan, menghilangkan ketidakjelasan pada verba «meneruskannya», dan memulihkan secara alami unsur «orang» dalam frasa Ibrani tentang tujuh puluh tua-tua. Catatan kaki dipertajam dengan menyebut kegiatan bernubuat agar alternatifnya jelas, sambil tetap menjaga ambiguitas teks sumber.
