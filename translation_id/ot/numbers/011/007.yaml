  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: id
  text: Manna itu seperti biji ketumbar, dan rupanya seperti rupa bedolah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bedolah biasanya dipahami sebagai damar atau getah yang harum. Namun, arti tepat istilah Ibraninya tidak pasti; ada juga yang memahaminya sebagai bahan menyerupai batu permata, misalnya mutiara atau kristal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: Manna itu
  rationale: Nomina definit menunjuk pada makanan di padang gurun yang sudah dikenal dalam konteks. Kata “itu” menyampaikan ketakrifan secara alami dalam bahasa Indonesia.
- source_word: כִּזְרַע גַּד
  choice: seperti biji ketumbar
  rationale: Partikel כִּ menyatakan perbandingan, sedangkan גַּד lazim diidentifikasi sebagai ketumbar. Susunan ini alami dan konkret dalam bahasa Indonesia.
- source_word: וְעֵינוֹ
  choice: dan rupanya
  rationale: עַיִן secara harfiah berarti “mata”, tetapi dalam ungkapan ini menunjuk pada rupa atau penampakan yang terlihat.
- source_word: כְּעֵין
  choice: seperti rupa
  rationale: Pengulangan istilah עַיִן dalam bahasa Ibrani dipertahankan melalui “rupa ... rupa”, meskipun hasilnya agak repetitif, agar kesejajaran visual sumber tidak dihilangkan.
- source_word: הַבְּדֹלַח
  choice: damar bedolah
  rationale: Identifikasi benda ini tidak pasti. “Bedolah” mempertahankan istilah tradisional/transliterasi, sedangkan “damar” membantu pembaca memahami identifikasi yang umum tanpa menutup kemungkinan lain; ketidakpastiannya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Repetisi “rupanya seperti rupa” sengaja dipertahankan untuk mencerminkan pengulangan עַיִן dalam teks Ibrani. Penanda catatan kaki ditempatkan sesudah istilah yang dijelaskannya.
