base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: id
  text: Apakah kambing dan domba serta sapi akan disembelih untuk mereka dan cukup untuk mereka? Atau, jika semua ikan di laut dikumpulkan untuk mereka, apakah itu akan cukup untuk mereka?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲ
  choice: Apakah
  rationale: Partikel tanya ini membuka pertanyaan retoris Musa; “apakah” menyampaikan bentuk interogatif secara alami tanpa menentukan sendiri apakah nuansanya kemungkinan atau masa depan.
- source_word: צֹאן וּבָקָר
  choice: domba dan sapi
  rationale: Pasangan ini menunjuk ternak kecil dan ternak besar. Pilihan konkret ini mudah dipahami dan sesuai dengan konteks penyediaan daging.
- source_word: יִשָּׁחֵט
  choice: akan disembelih
  rationale: Bentuk Nifal dari שׁחט menyatakan penyembelihan hewan. Bentuk pasif dan unsur hipotetis/futural dipertahankan.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Preposisi tersebut menyatakan tindakan atau penyediaan untuk kepentingan umat.
- source_word: וּמָצָא לָהֶם
  choice: dan cukup bagi mereka
  rationale: Dalam konstruksi ini מצא menyatakan kecukupan, bukan sekadar ditemukan. Terjemahan idiomatis menghindari arti harfiah yang menyesatkan.
- source_word: אִם
  choice: Atau, jika
  rationale: Kata ini memperkenalkan kemungkinan kedua dalam rangkaian pertanyaan retoris; “atau, jika” membuat hubungan alternatifnya jelas dalam bahasa Indonesia.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: semua ikan di laut
  rationale: Menyampaikan cakupan menyeluruh כָּל dan hubungan konstruksi secara alami dalam bahasa Indonesia.
- source_word: יֵאָסֵף
  choice: dikumpulkan
  rationale: Bentuk Nifal dari אסף berarti dikumpulkan atau dihimpun. Pilihan ini tidak menambahkan gagasan khusus seperti ditangkap.
- source_word: וּמָצָא לָהֶם
  choice: apakah itu akan cukup bagi mereka
  rationale: Idiom tentang kecukupan diterjemahkan konsisten; pronomina “itu” merujuk secara alami pada seluruh ikan yang dikumpulkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua pertanyaan retoris serta pengulangan gagasan “cukup bagi mereka” dipertahankan. Tidak diperlukan catatan kaki karena idiom Ibrani וּמָצָא לָהֶם dapat diterjemahkan langsung dan jelas sebagai “cukup bagi mereka” tanpa kehilangan ambiguitas penting.
