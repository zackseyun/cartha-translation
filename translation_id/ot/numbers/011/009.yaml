  text: וּ/בְ/רֶ֧דֶת הַ/טַּ֛ל עַל הַֽ/מַּחֲנֶ֖ה לָ֑יְלָה יֵרֵ֥ד הַ/מָּ֖ן עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/009.yaml
  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: id
  text: Ketika embun turun di atas perkemahan pada malam hari[a], manna pun turun di atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan ketika embun turun di atas perkemahan pada malam hari, manna turun di atasnya.” Bahasa Ibrani memakai kata kerja yang sama (“turun”) untuk embun dan manna, sehingga menegaskan kesejajarannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: Ketika ... turun
  rationale: Gabungan konjungsi, preposisi, dan infinitif konstruktus dari ירד membentuk anak kalimat waktu. 'Ketika ... turun' wajar dalam bahasa Indonesia dan mempertahankan hubungan temporalnya.
- source_word: הַטַּל
  choice: embun
  rationale: Padanan langsung untuk nomina definit ini; bahasa Indonesia tidak memiliki kata sandang definit yang harus dinyatakan tersendiri.
- source_word: עַל הַמַּחֲנֶה
  choice: di atas perkemahan
  rationale: עַל menyatakan posisi atau gerak ke atas permukaan. 'Di atas perkemahan' mempertahankan gambaran Ibrani tanpa menyatakan secara berlebihan bahwa embun hanya melayang di atasnya.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Nomina ini berfungsi adverbial sebagai keterangan waktu; padanan tersebut alami dalam bahasa Indonesia modern.
- source_word: יֵרֵד
  choice: turun
  rationale: Bentuk imperfek dalam konteks narasi ini menggambarkan kejadian yang lazim atau berulang. Bentuk 'turun' dalam bahasa Indonesia tidak perlu dibatasi secara morfologis sebagai lampau dan mempertahankan pengulangan verba yang sama dengan klausa pertama.
- source_word: הַמָּן
  choice: manna
  rationale: Istilah yang lazim dalam bahasa Indonesia untuk makanan ajaib yang telah dikenal dalam konteks ini.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Pronomina maskulin tunggal paling alami merujuk kembali kepada perkemahan. Bentuk pronominal dipertahankan agar teks tidak memperjelas hubungan manna dan embun melampaui bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Partikel 'pun' menandai hubungan yang erat antara kedua klausa tanpa menghilangkan kesejajaran verba 'turun'. Istilah 'perkemahan' dipilih untuk המחנה dalam konteks komunitas Israel yang berkemah.
