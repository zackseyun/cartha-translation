  - severity: low
    issue: Catatan kaki memakai “dilenyapkan” sebagai alternatif harfiah.
    rationale: יִכָּרֵת secara harfiah berarti “dipotong/diputus,” bukan terutama “dilenyapkan.” Dalam konteks ini maknanya memang daging belum habis dimakan, tetapi alternatif harfiah sebaiknya tidak memperluas makna secara tidak perlu.
