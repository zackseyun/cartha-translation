  rationale: Revisi memperbaiki kelaziman bahasa Indonesia dan memperjelas nuansa מַכָּה sebagai tulah penghukuman yang ditimpakan, sambil mempertahankan agen ilahi yang eksplisit, metafora murka yang menyala, dan alternatif leksikal untuk יִכָּרֵת.
