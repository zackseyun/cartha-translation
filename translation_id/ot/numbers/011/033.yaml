  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: id
  text: Sementara daging itu masih di antara gigi mereka, sebelum habis dimakan[a], murka Yahweh menyala terhadap bangsa itu, dan Yahweh menimpakan tulah yang sangat dahsyat kepada bangsa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sebelum daging itu dipotong” atau “diputus”; dalam konteks ini, maksudnya sebelum daging itu habis dimakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: daging itu
  rationale: Dalam konteks burung puyuh yang dimakan, בָּשָׂר berarti daging sebagai makanan; bentuk definitnya dipertahankan dengan 'itu'.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: masih ada di antara gigi mereka
  rationale: Mempertahankan gambaran konkret bahwa daging belum tertelan, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: טֶרֶם יִכָּרֵת
  choice: sebelum habis dimakan
  rationale: כרת secara harfiah berarti 'diputuskan/dilenyapkan', tetapi dalam konteks makan menunjuk pada daging yang belum dihabiskan. Catatan kaki mempertahankan alternatif harfiahnya.
- source_word: וְאַף יְהוָה חָרָה
  choice: murka Yahweh menyala
  rationale: Mempertahankan metafora Ibrani tentang murka yang menyala, bukan meratakannya menjadi sekadar 'Yahweh marah'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיַּךְ
  choice: menghantam
  rationale: Menyampaikan daya tindakan penghukuman נכה dengan bahasa Indonesia modern dan kuat.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: wabah yang sangat dahsyat
  rationale: מַכָּה di sini menunjuk pada malapetaka atau wabah penghukuman; רַבָּה מְאֹד menekankan kedahsyatannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH secara langsung; 'Yahweh' mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Ungkapan antropopatik tentang murka ilahi
  choice: murka Yahweh menyala terhadap bangsa itu
  alternative: Yahweh menjadi marah kepada bangsa itu
  rationale: Pilihan ini mempertahankan metafora חרה אף dan ketegangan kuat dalam gambaran penghukuman ilahi.
- issue: Agen penghukuman
  choice: Yahweh menghantam mereka
  alternative: mereka ditimpa wabah
  rationale: Klausa aktif Ibrani secara eksplisit menyatakan Yahweh sebagai pelaku; terjemahan tidak mengaburkan hal itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan gambaran Ibrani yang tetap kuat. 'Bangsa itu' menerjemahkan הָעָם pada penyebutan pertama, lalu 'mereka' menghindari pengulangan yang kaku. Penanda catatan kaki [a] ditempatkan langsung pada frasa yang dijelaskan.
