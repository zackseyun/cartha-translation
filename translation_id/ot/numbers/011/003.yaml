  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: id
  text: Lalu ia menamai tempat itu Tabera[a], karena api Yahweh berkobar di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tabera berarti “pembakaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: Lalu ia menamai tempat itu
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa ia 'menyebut nama tempat itu'. Dalam bahasa Indonesia modern, 'menamai tempat itu' menyampaikan rumus penamaan tersebut secara alami tanpa kehilangan maknanya.
- source_word: תַּבְעֵרָה
  choice: Tabera
  rationale: Nama tempat ditransliterasikan menurut pelafalan Ibrani yang lazim dalam bahasa Indonesia. Hubungan katanya dengan tindakan membakar dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: karena
  rationale: Menyampaikan hubungan sebab secara langsung dan wajar.
- source_word: בָעֲרָה
  choice: menyala
  rationale: Kata בער berarti membakar atau menyala. 'Menyala' cocok dengan subjek 'api' dan tetap mempertahankan kaitan bunyi-makna dengan nama Tabera.
- source_word: בָם
  choice: di tengah-tengah mereka
  rationale: Menyatakan bahwa api itu berkobar di antara komunitas mereka, bukan bahwa mereka terbakar secara batiniah.
- source_word: אֵשׁ יְהוָה
  choice: api Yahweh
  rationale: Mempertahankan konstruksi ringkas Ibrani dan nama ilahi yang dinyatakan dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Hubungan api dengan umat dalam בָם
  choice: di tengah-tengah mereka
  alternative: membakar mereka; di dalam mereka
  rationale: Bentuk preposisional ini memungkinkan pengertian lokasi di antara komunitas. Terjemahan tidak mempertegas bahwa semua orang secara langsung terbakar, sehingga ketegangan naratif tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Lalu' menjaga alur naratif; 'menamai' lebih alami daripada mempertahankan idiom harfiah 'menyebut nama'. Nama ilahi ditulis 'Yahweh' sesuai bentuk sumber.
