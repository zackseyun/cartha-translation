reference: Numbers 11:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: id
  text: Lalu bangsa itu berseru kepada Musa, dan Musa berdoa kepada Yahweh. Maka api itu pun mereda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “api itu tenggelam” atau “surut”; maksudnya, api itu berkurang atau mereda.
    reason: Alternatif leksikal bagi וַתִּשְׁקַע, yang menggambarkan api seolah-olah tenggelam atau surut dan tidak dengan sendirinya menegaskan bahwa api itu padam seketika.
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: berseru
  rationale: Kata צעק menyatakan seruan mendesak dalam kesusahan atau permohonan pertolongan; “berseru” menyampaikan urgensi itu secara wajar dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Dalam konteks kisah ini, עָם menunjuk secara kolektif kepada bangsa Israel. “Bangsa itu” jelas, alami, dan mempertahankan acuan yang sudah hadir dalam konteks.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Kata depan אֶל menandai arah seruan kepada seseorang; “kepada Musa” merupakan padanan Indonesia yang idiomatis dan tepat.
- source_word: וַיִּתְפַּלֵּל
  choice: berdoa
  rationale: Bentuk hitpael dari פלל lazim berarti “berdoa”. Konteks menyiratkan doa syafaat, tetapi “berdoa” mempertahankan cakupan leksikal tanpa mempersempit maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton dialihaksarakan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וַתִּשְׁקַע
  choice: mereda
  rationale: Kata שקע secara harfiah berkaitan dengan tenggelam atau surut. Dengan api sebagai subjek, “mereda” secara alami menyatakan bahwa kobarannya berkurang tanpa memastikan bahwa api itu langsung padam sepenuhnya.
- source_word: הָאֵשׁ
  choice: api itu
  rationale: Kata אֵשׁ berarti “api”; bentuk definitnya menunjuk kepada api yang disebut dalam konteks sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi tersebut dan tidak menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan nama Musa dipertahankan untuk mencerminkan susunan Ibrani, sedangkan “Maka” dan partikel “pun” menyampaikan kelanjutan narasi secara alami.
