reference: Numbers 11:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: id
  text: Lalu angin bertiup dari Yahweh[a] dan menghalau burung-burung puyuh dari laut, lalu menghamburkannya di sekitar perkemahan—kira-kira sejauh perjalanan sehari ke arah yang satu dan sejauh perjalanan sehari ke arah yang lain, di sekeliling perkemahan—dan kira-kira dua hasta di atas permukaan tanah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lalu keluarlah suatu roh dari Yahweh.” Kata Ibrani yang sama dapat berarti “angin” atau “roh”; konteks burung puyuh yang dibawa dari laut lebih mendukung arti “angin”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kira-kira dua hasta di atas muka tanah.” Frasa ini mungkin menggambarkan ketinggian burung-burung itu ketika tersebar atau terbang, bukan ketebalan tumpukannya di tanah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: angin
  rationale: רוּחַ dapat berarti ‘angin’, ‘napas’, atau ‘roh’. Dalam konteks ini, angin menjadi sarana yang membawa burung puyuh dari laut, sehingga ‘angin’ paling sesuai.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: bertiuplah ... dari Yahweh
  rationale: נָסַע biasanya menyatakan gerak atau keberangkatan. Bersama רוּחַ dan מֵאֵת, frasa ini menggambarkan angin yang bergerak dengan Yahweh sebagai sumbernya; ‘bertiup ... dari’ terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיָּגָז שַׂלְוִים
  choice: yang membawa burung-burung puyuh
  rationale: גוז merupakan verba langka yang di sini menggambarkan angin mendatangkan puyuh. ‘Membawa’ menyampaikan tindakan itu secara jelas tanpa memaksakan nuansa yang tidak pasti.
- source_word: מִן הַיָּם
  choice: dari laut
  rationale: Terjemahan langsung ini mempertahankan asal geografis burung-burung tersebut.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: dan menghamburkannya di sekitar perkemahan
  rationale: נטשׁ dapat bermakna membentangkan, meninggalkan, atau melemparkan. Konteks pengukuran di sekeliling perkemahan mendukung gambaran puyuh yang disebarkan atau dihamburkan di kawasan sekitar perkemahan, tanpa menyiratkan bahwa semuanya jatuh tepat di atas tenda-tenda.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: kira-kira sejauh satu hari perjalanan ke arah yang satu dan sejauh satu hari perjalanan ke arah yang lain
  rationale: Ungkapan ini mempertahankan struktur berulang bahasa Ibrani dan menyampaikan luas penyebaran dari perkemahan.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: di sekeliling perkemahan
  rationale: Frasa ini merangkum bahwa penyebaran tersebut mengitari perkemahan.
- source_word: וּכְאַמָּתַיִם
  choice: kira-kira dua hasta
  rationale: ‘Hasta’ mempertahankan satuan kuno, sedangkan ‘kira-kira’ mencerminkan prefiks perbandingan כ.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: di atas permukaan tanah
  rationale: Secara harfiah berarti ‘di atas muka tanah’. Bentuk ini mempertahankan kemungkinan bahwa ukuran tersebut menunjuk pada ketinggian burung ketika tersebar atau terbang, bukan pasti pada ketebalan tumpukan.
theological_decisions:
- issue: Asal dan perantaraan angin
  choice: Angin berasal dari Yahweh dan menjadi sarana yang membawa burung puyuh.
  alternative: Frasa ini dapat diparafrasakan secara lebih dinamis bahwa Yahweh secara langsung mendatangkan puyuh dengan angin.
  rationale: Bahasa Ibrani menyatakan bahwa angin bergerak dari Yahweh, sehingga tindakan ilahi dan sarana alamiah dipertahankan bersama tanpa menjelaskan mekanismenya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. ‘Burung-burung puyuh’ memperjelas bentuk jamak, ‘perkemahan’ sesuai konteks Israel di padang gurun, dan satuan kuno ‘hasta’ dipertahankan.
