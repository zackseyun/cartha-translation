  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: id
  text: Akukah yang mengandung seluruh bangsa ini? Akukah yang melahirkannya,[a] sehingga Engkau berkata kepadaku, “Gendonglah dia dalam dekapanmu, seperti seorang pengasuh[b] menggendong anak yang masih menyusu,” menuju negeri yang telah Kaujanjikan dengan sumpah kepada nenek moyangnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk tunggal—“dia” dan “nenek moyangnya”—karena memandang bangsa itu sebagai satu kesatuan. Secara kontekstual dapat juga diterjemahkan “mereka” dan “nenek moyang mereka”.
    reason: alternative_reading
  - marker: b
    text: 'Atau: “bapak asuh”; kata Ibrani ini menunjuk kepada orang yang merawat seorang anak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָנֹכִי
  choice: Akukah yang
  rationale: Partikel tanya dan pronomina mandiri memberi tekanan pada orang pertama dalam pertanyaan retoris. Bentuk “Akukah yang” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: הָרִיתִי
  choice: mengandung
  rationale: Kata kerja הרה merujuk pada mengandung atau menjadi hamil; pilihan ini mempertahankan metafora keibuan secara langsung.
- source_word: כָּל הָעָם הַזֶּה
  choice: seluruh bangsa ini
  rationale: עָם adalah nomina kolektif tunggal. “Seluruh bangsa ini” alami dalam bahasa Indonesia dan memungkinkan gambaran bangsa itu sebagai satu anak tetap terasa.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: Akukah yang melahirkannya
  rationale: ילד meneruskan metafora persalinan, sedangkan akhiran tunggal merujuk kembali kepada bangsa sebagai satu kesatuan. Akhiran “-nya” mempertahankan hubungan itu tanpa terasa kaku.
- source_word: שָׂאֵהוּ
  choice: Gendonglah dia
  rationale: נשא berarti membawa atau mengangkat; dalam gambaran perawatan anak, “menggendong” adalah padanan Indonesia yang paling tepat dan konkret.
- source_word: בְחֵיקֶךָ
  choice: dalam dekapanmu
  rationale: חֵיק menunjuk pada dada, pangkuan, atau ruang dalam pelukan. “Dalam dekapanmu” mempertahankan kedekatan fisik gambaran itu dengan ungkapan Indonesia yang alami.
- source_word: הָאֹמֵן
  choice: seorang pengasuh
  rationale: Partisipel אמן di sini menunjuk kepada orang yang merawat dan menopang seorang anak. “Pengasuh” tidak mempersempit jenis kelamin atau tugasnya secara berlebihan.
- source_word: הַיֹּנֵק
  choice: anak yang masih menyusu
  rationale: Bentuk partisipel ini menggambarkan anak yang berada pada tahap menyusu. Ungkapan ini jelas dan modern tanpa memakai istilah yang terasa usang.
- source_word: עַל הָאֲדָמָה
  choice: menuju negeri
  rationale: Dalam konteks tindakan membawa umat ke tujuan yang dijanjikan, עַל dipahami secara idiomatis sebagai arah tujuan; אֲדָמָה di sini menunjuk pada negeri yang dijanjikan.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: yang telah Kaujanjikan dengan sumpah kepada nenek moyangnya
  rationale: נשבע menyatakan bersumpah. Rumusan ini mempertahankan unsur sumpah sekaligus mengungkapkan secara alami dalam bahasa Indonesia bahwa negeri itulah yang dijanjikan kepada para leluhur.
theological_decisions:
- issue: Rujukan tunggal kolektif kepada Israel
  choice: Mempertahankan bangsa itu sebagai satu tokoh kolektif melalui “-nya”, “dia”, dan “nenek moyangnya”
  alternative: Memakai bentuk jamak kontekstual seperti “mereka” dan “nenek moyang mereka”
  rationale: Teks Ibrani memakai עָם dalam bentuk tunggal dan secara konsisten merujuk kepadanya dengan akhiran tunggal. Hal ini menopang metafora Israel sebagai satu anak yang dikandung, dilahirkan, dan digendong oleh Musa.
- issue: Makna הָאֹמֵן
  choice: pengasuh
  alternative: bapak asuh; perawat; penjaga
  rationale: Istilah sumber cukup luas untuk seorang laki-laki yang bertanggung jawab merawat anak. “Pengasuh” mempertahankan fungsi perawatan tanpa menetapkan peran yang lebih khusus daripada teks.
- issue: Isi sumpah mengenai negeri
  choice: yang telah Kaujanjikan dengan sumpah
  alternative: yang tentangnya Engkau telah bersumpah
  rationale: Bahasa Ibrani menyatakan bahwa Allah bersumpah kepada para leluhur, dengan negeri sebagai isi yang dipahami dari sumpah itu. Rumusan utama mengungkapkan relasi tersebut secara alami tanpa menghilangkan unsur sumpah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Akukah” mempertahankan tekanan retoris; kapitalisasi “Engkau” mengikuti kebiasaan hormat untuk sapaan kepada Allah. Metafora kehamilan, persalinan, dan pengasuhan dipertahankan secara utuh.
