  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: id
  text: Di sana kami melihat Nefilim[a]—keturunan Enak yang berasal dari Nefilim—; di mata kami sendiri kami seperti belalang, dan demikian pula kami di mata mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini secara tradisional diterjemahkan “raksasa”; maknanya tidak pasti, sehingga dipertahankan dalam bentuk transliterasi.
    reason: Mencatat padanan tradisional tanpa menafsirkan istilah Ibrani yang makna dan referennya diperdebatkan.
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: orang-orang Nefilim
  rationale: Istilah Ibrani ini ditransliterasikan karena rujukan dan etimologinya tidak pasti. Penambahan 'orang-orang' membuatnya alami dalam bahasa Indonesia tanpa menetapkan bahwa mereka adalah raksasa.
- source_word: בְּנֵי עֲנָק
  choice: keturunan Enak
  rationale: Ungkapan harfiah 'anak-anak Enak' dalam konteks ini menyatakan garis keturunan atau kelompok suku; 'keturunan Enak' menyampaikan maknanya secara alami.
- source_word: מִן הַנְּפִלִים
  choice: yang berasal dari kaum Nefilim
  rationale: Preposisi מִן dapat menunjukkan asal atau hubungan kelompok. Frasa ini mempertahankan hubungan yang dinyatakan teks tanpa menjelaskannya secara berlebihan.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: Di mata kami sendiri, kami seperti
  rationale: Idiom ini menyatakan penilaian atau persepsi diri, bukan perubahan hakikat. Susunan Indonesia ini mempertahankan metafora 'di mata' dan kesejajarannya dengan klausa berikut.
- source_word: כַּחֲגָבִים
  choice: seperti belalang
  rationale: חָגָב menunjuk pada belalang atau serangga sejenis; dalam perbandingan ini tekanannya adalah ukuran yang sangat kecil.
- source_word: וְכֵן ... בְעֵינֵיהֶם
  choice: dan demikian juga kami di mata mereka
  rationale: Terjemahan ini mempertahankan kesejajaran retoris dengan 'di mata kami sendiri' serta klaim para pengintai tentang persepsi pihak lain.
theological_decisions:
- issue: Penerjemahan נְפִילִים
  choice: Nefilim
  alternative: raksasa
  rationale: Teks memakai istilah yang makna dan rujukannya diperdebatkan, juga muncul dalam Kejadian 6:4. Transliterasi menghindari penetapan tafsiran tertentu, sedangkan padanan tradisional dicatat dalam catatan kaki.
- issue: Hubungan keturunan Enak dengan Nefilim
  choice: yang berasal dari kaum Nefilim
  alternative: yang termasuk kaum Nefilim
  rationale: מִן dapat menyatakan asal-usul atau hubungan dengan suatu kelompok. Rumusan utama menjaga unsur asal-usul tanpa menentukan lebih jauh sifat hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Nefilim' dipertahankan sebagai nama kelompok yang ditransliterasikan; 'Enak' mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia. Kesejajaran idiomatis antara 'di mata kami sendiri' dan 'di mata mereka' dipertahankan.
