base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: id
  text: Mereka naik ke Negeb, lalu ia sampai ke Hebron.[a] Di sana ada Ahiman, Sesai, dan Talmai, keturunan Anak. Hebron dibangun tujuh tahun lebih dahulu daripada Zoan di Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani beralih dari bentuk jamak, “mereka naik,” ke bentuk tunggal, “ia sampai.” Sejumlah terjemahan menyelaraskannya menjadi “mereka sampai.”
    reason: Menjelaskan peralihan jumlah gramatikal yang sengaja dipertahankan dari teks sumber.
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: ke Negeb
  rationale: Diperlakukan sebagai nama kawasan geografis; bentuk ini mempertahankan rujukan tempat tanpa menggantinya dengan arti umum “selatan”.
- source_word: יְלִידֵי הָעֲנָק
  choice: keturunan Anak
  rationale: Ungkapan ini menunjuk orang-orang yang berasal dari garis Anak; “keturunan” alami dalam bahasa Indonesia dan tidak mempersempit hubungan tersebut secara berlebihan.
- source_word: לִפְנֵי
  choice: lebih dahulu daripada
  rationale: 'Dalam keterangan pembangunan dua kota, preposisi ini menyatakan urutan waktu: Hebron dibangun tujuh tahun sebelum Zoan.'
theological_decisions:
- issue: Peralihan subjek dari bentuk jamak וַיַּעֲלוּ ke bentuk tunggal וַיָּבֹא
  choice: “Mereka naik … lalu ia tiba” dipertahankan sesuai teks Masoret
  alternative: “Mereka naik … lalu mereka tiba” dengan penyelarasan jumlah
  rationale: Peralihan jumlah terdapat dalam sumber Ibrani dan merupakan ambiguitas tekstual/naratif yang nyata; terjemahan tidak menyelaraskannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Nama tempat serta nama orang ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia. Susunan kalimat mempertahankan peralihan subjek yang tidak biasa tanpa membuat teks utama menjadi kaku.
