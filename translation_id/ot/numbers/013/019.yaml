  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: id
  text: Bagaimana keadaan negeri tempat bangsa itu tinggal? Apakah negeri itu baik atau buruk? Bagaimana keadaan kota-kota yang mereka diami? Apakah kota-kota itu berupa perkemahan atau tempat-tempat berbenteng?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di permukiman terbuka ... di kubu-kubu.” Bahasa Ibrani membedakan permukiman bercorak perkemahan dari tempat-tempat berbenteng.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: Bagaimana keadaan
  rationale: Dalam konteks penyelidikan tentang sifat atau kondisi negeri dan kota-kotanya, ungkapan ini menyampaikan daya tanya bahasa Ibrani secara alami dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks pengintaian Kanaan, 'negeri' menunjuk wilayah beserta kondisi permukimannya dan terdengar alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: tempat bangsa itu tinggal
  rationale: Pronomina maskulin tunggal Ibrani dipakai secara kolektif untuk penduduk yang sedang dibicarakan. 'Bangsa itu' membuat acuan kolektif tersebut jelas tanpa mempertahankan bentuk tunggal yang membingungkan dalam bahasa Indonesia.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: Apakah negeri itu baik atau buruk?
  rationale: Mempertahankan penilaian luas dari kata sifat Ibrani dan tidak mempersempit maknanya hanya pada kesuburan tanah.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: Padanan umum yang sesuai bagi permukiman yang kemudian dibedakan menurut ada atau tidaknya pertahanan.
- source_word: הַבְּמַחֲנִים
  choice: di perkemahan
  rationale: מחנה berarti kemah atau perkemahan; di sini menunjuk permukiman terbuka atau bercorak perkemahan, berlawanan dengan tempat berbenteng.
- source_word: בְּמִבְצָרִים
  choice: di tempat-tempat berbenteng
  rationale: Ungkapan ini mempertahankan arti lokasi yang memiliki pertahanan dan menghasilkan kontras yang jelas dengan perkemahan.
theological_decisions:
- issue: Acuan pronomina tunggal הוּא kepada penghuni negeri
  choice: bangsa itu / mereka
  alternative: ia
  rationale: Bentuk Ibrani tunggal berfungsi secara kolektif bagi penduduk yang dibicarakan dalam konteks ayat 18. Bahasa Indonesia modern lebih jelas memakai nomina kolektif lalu pronomina jamak; pilihan ini tidak mengubah isi teologis.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pertanyaan berulang dipertahankan untuk mengikuti struktur pemeriksaan dalam teks Ibrani. 'Negeri' dipilih daripada 'tanah' karena keseluruhan wilayah dan permukimannya sedang dinilai.
