  naturalness: '"Naik untuk menyelidiki" lebih alami dan lebih jelas daripada koordinasi "naik dan mengintai," sambil tetap mempertahankan nuansa arah עלה. "Jalan masuk ke Hamat" juga merupakan konstruksi Indonesia yang lebih lengkap.'
  terminology: '"Negeri," "Padang Gurun Zin," "Rehob," dan "Hamat" sesuai register Alkitab Indonesia yang lazim. "Menyelidiki" lebih tepat secara leksikal dan kurang bernuansa pengintaian rahasia daripada "mengintai."'
