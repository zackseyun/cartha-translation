  - severity: low
    issue: '"jalan masuk Hamat" kurang idiomatis.'
    rationale: Dalam bahasa Indonesia modern, "jalan masuk ke Hamat" menyatakan hubungan arah/tempat secara lebih lengkap.
  - severity: low
