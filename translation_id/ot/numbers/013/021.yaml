    rationale: Alternatifnya bukan sekadar frasa tambahan "di Lebo-Hamat," melainkan pembacaan לְבֹא חֲמָת sebagai nama tempat Lebo-Hamat.
  revised_text: Kemudian mereka naik untuk menyelidiki negeri itu, dari Padang Gurun Zin sampai ke Rehob, ke arah jalan masuk ke Hamat.[a]
