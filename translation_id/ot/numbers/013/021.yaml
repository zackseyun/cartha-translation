  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Padang Gurun' dipakai sebagai istilah geografis, sedangkan nama-nama tempat ditransliterasikan secara konvensional. Ambiguitas לְבֹא חֲמָת dipertahankan melalui catatan kaki.
