base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: id
  text: Kemudian mereka naik untuk menyelidiki negeri itu, dari Padang Gurun Zin sampai ke Rehob, ke arah jalan masuk ke Hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai ke Rehob, di Lebo-Hamat.” Ungkapan Ibrani ini dapat dipahami sebagai nama tempat, “Lebo-Hamat,” bukan sebagai “jalan masuk ke Hamat.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: mereka naik
  rationale: Mempertahankan nuansa arah verba עלה secara alami dalam konteks perjalanan.
- source_word: וַיָּתֻרוּ
  choice: mengintai
  rationale: Dalam konteks pengutusan para pengintai, תור menunjuk pada peninjauan untuk memperoleh keterangan; 'mengintai' jelas dan wajar dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Yang dimaksud ialah negeri Kanaan yang sedang ditinjau; 'negeri itu' alami dalam konteks naratif dan tidak mempersempitnya menjadi sekadar tanah.
- source_word: מִמִּדְבַּר צִן
  choice: dari Padang Gurun Zin
  rationale: מִדְבָּר adalah daerah liar dan gersang; 'padang gurun' merupakan padanan geografis yang lazim dan mudah dipahami.
- source_word: עַד רְחֹב
  choice: sampai ke Rehob
  rationale: עַד menandai batas jangkauan peninjauan, sedangkan Rehob dipertahankan sebagai nama tempat.
- source_word: לְבֹא חֲמָת
  choice: ke arah jalan masuk Hamat
  rationale: Konstruksi לְבֹא חֲמָת secara langsung dapat dipahami sebagai penanda arah menuju jalan masuk ke wilayah Hamat; ambiguitas dengan kemungkinan nama tempat dipertahankan dalam catatan kaki.
theological_decisions: []
