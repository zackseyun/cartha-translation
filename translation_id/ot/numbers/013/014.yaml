  text: לְ/מַטֵּ֣ה נַפְתָּלִ֔י נַחְבִּ֖י בֶּן וָפְסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/014.yaml
  text: from the tribe of Naphtali[a], Nahbi the son of Vophsi;
translation:
  language: id
  text: dari suku Naftali, Nahbi anak Wofsi[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Wafsi.” Transliterasi nama Ibrani ini dapat berbeda-beda.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam daftar para wakil suku ini, לְ yang melekat pada מַטֶּה menyatakan asal atau afiliasi kesukuan. Frasa “dari suku” alami dan jelas dalam bahasa Indonesia.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נַחְבִּי
  choice: Nahbi
  rationale: Nama diri ditransliterasikan secara dekat dengan bentuk Ibrani dan sesuai dengan kelaziman Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumusan silsilah Ibrani, בֶּן menunjukkan hubungan anak laki-laki dengan ayahnya. “Anak” mempertahankan makna itu dalam bahasa Indonesia modern tanpa memakai istilah arkais “bin”.
- source_word: וָפְסִי
  choice: Wofsi
  rationale: Nama diri ini ditransliterasikan mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; “Wafsi” juga mungkin jika vokal Ibrani dialihaksarakan secara lebih langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat untuk sebuah daftar nama. Tanda catatan kaki ditempatkan pada “Wofsi,” yakni nama yang memang memiliki variasi transliterasi.
