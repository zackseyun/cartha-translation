base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: id
  text: Mereka pergi, lalu datang kepada Musa, Harun, dan seluruh umat Israel[a] di padang gurun Paran, ke Kadesh. Mereka menyampaikan laporan kepada Musa dan Harun serta kepada seluruh umat itu, lalu memperlihatkan kepada mereka buah negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh jemaat anak-anak Israel.”'
    reason: Menunjukkan bentuk harfiah עֲדַת בְּנֵי יִשְׂרָאֵל tanpa membebani teks utama dengan ungkapan yang kurang alami dalam bahasa Indonesia modern.
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Mereka pergi, lalu datang
  rationale: Mempertahankan dua verba berurutan dalam narasi Ibrani tanpa menambahkan gagasan ‘kembali’ yang tidak dinyatakan secara eksplisit.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: ‘Umat’ merupakan padanan Indonesia yang alami bagi עֵדָה dalam konteks perhimpunan Israel; ‘Israel’ menyampaikan frasa בְּנֵי יִשְׂרָאֵל secara wajar, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: מִדְבַּר פָּארָן
  choice: padang gurun Paran
  rationale: ‘Padang gurun’ adalah padanan baku dan sesuai konteks bagi מִדְבָּר dalam kisah perjalanan Israel.
- source_word: קָדֵשָׁה
  choice: di Kadesh
  rationale: Akhiran direktif menunjukkan arah menuju Kadesh, tetapi setelah verba kedatangan, bahasa Indonesia secara alami menyatakan lokasi tibanya dengan ‘di Kadesh’.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Mereka menyampaikan laporan kepada mereka
  rationale: Ungkapan Ibrani secara idiomatis berarti membawa kembali kabar atau laporan. ‘Menyampaikan laporan’ jelas dalam bahasa Indonesia dan cocok dengan konteks pengintaian, sedangkan pronomina ‘mereka’ mempertahankan bentuk rujukan dalam teks sumber.
- source_word: וַיַּרְאוּם
  choice: memperlihatkan kepada mereka
  rationale: Bentuk Hifil dari ראה di sini berarti menyebabkan orang melihat, yakni ‘memperlihatkan’.
- source_word: פְּרִי הָאָרֶץ
  choice: buah negeri itu
  rationale: Mempertahankan gambaran konkret ‘buah’ dan memakai ‘negeri’ untuk הָאָרֶץ karena yang dimaksud ialah wilayah yang baru saja diintai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tempat dibuat alami bagi pembaca Indonesia (‘di Kadesh, di padang gurun Paran’) sambil mempertahankan hubungan geografis dalam teks Ibrani. Pengulangan ‘kepada mereka’ dipertahankan untuk mencerminkan struktur dan rujukan pronominal sumber.
