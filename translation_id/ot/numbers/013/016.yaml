base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: id
  text: Inilah nama-nama orang-orang yang diutus Musa untuk mengintai negeri itu.[a] Musa menamai Hosea, anak Nun, Yosua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjelajahi negeri itu.” Kata Ibrani yang digunakan dapat menunjuk pada kegiatan menjelajah, mengamati, atau melakukan pengintaian.
    reason: lexical_alternative
  - marker: b
    text: Hosea adalah bentuk nama yang dipakai sebelumnya; di sini Musa memberinya nama Yosua.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Itulah nama
  rationale: Ungkapan penunjuk ini merangkum daftar yang baru disebutkan; bentuk “Itulah nama” alami dalam bahasa Indonesia dan tetap dekat dengan fungsi teks Ibrani.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Konteks sudah menunjukkan para wakil laki-laki yang disebutkan sebelumnya; “orang-orang” merupakan ungkapan Indonesia yang wajar tanpa mengubah rujukannya.
- source_word: שָׁלַח
  choice: diutus
  rationale: Bentuk pasif dalam klausa relatif menghasilkan susunan Indonesia yang alami sambil mempertahankan Musa sebagai pelaku pengutusan.
- source_word: לָתוּר
  choice: untuk mengintai
  rationale: Kata kerja תור di sini menunjuk pada penjelajahan untuk memperoleh keterangan atau pengamatan medan; “mengintai” mempertahankan nuansa pengintaian tanpa mengharuskan arti spionase rahasia.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks, yang dimaksud ialah wilayah Kanaan yang hendak diamati; “negeri itu” lebih alami daripada “tanah itu” untuk suatu kawasan berpenduduk.
- source_word: וַיִּקְרָא ... יְהוֹשֻׁעַ
  choice: Musa menamai ... Yosua
  rationale: Dalam konstruksi ini קרא menyatakan pemberian atau pemakaian nama; “menamai” menyampaikan tindakan tersebut secara jelas tanpa menjelaskan lebih dari teks.
- source_word: הוֹשֵׁעַ
  choice: Hosea
  rationale: “Hosea” adalah transliterasi Indonesia yang lazim untuk הוֹשֵׁעַ dan tetap membedakannya dari bentuk nama Yosua.
- source_word: בִּן נוּן
  choice: anak Nun
  rationale: “Anak Nun” adalah bentuk patronimik yang alami dan baku dalam terjemahan nama-nama Alkitab berbahasa Indonesia.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: “Yosua” adalah bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
