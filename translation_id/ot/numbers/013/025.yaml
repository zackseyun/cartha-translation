  text: וַ/יָּשֻׁ֖בוּ מִ/תּ֣וּר הָ/אָ֑רֶץ מִ/קֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: id
  text: Setelah menjelajahi negeri itu selama empat puluh hari, mereka kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Setelah menyelidiki negeri itu” atau “Setelah mengintai negeri itu.” Kata kerja Ibrani merujuk pada pemeriksaan suatu wilayah dalam sebuah misi pengintaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: mereka kembali
  rationale: Bentuk wayyiqtol Qal orang ketiga jamak dari שׁוב melanjutkan alur cerita. Urutan peristiwa dinyatakan secara alami dalam bahasa Indonesia tanpa harus menerjemahkan וַ sebagai “dan”.
- source_word: מִתּוּר
  choice: setelah menjelajahi
  rationale: Infinitif konstruk תור dengan מִן secara harfiah menunjukkan kembalinya mereka dari kegiatan meneliti atau menjelajahi negeri itu. Dalam susunan Indonesia, “setelah menjelajahi” secara wajar mengungkapkan bahwa kegiatan tersebut telah selesai sebelum mereka kembali.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: אָרֶץ di sini menunjuk pada wilayah tertentu yang sedang mereka selidiki, bukan bumi secara keseluruhan. “Negeri itu” alami dalam konteks dan mempertahankan rujukan khusus tersebut.
- source_word: מִקֵּץ
  choice: selama ... hari
  rationale: Ungkapan מִקֵּץ menandai berakhirnya suatu jangka waktu. Karena struktur kalimat Indonesia menempatkan kegiatan penjelajahan terlebih dahulu, “selama empat puluh hari” menyampaikan bahwa mereka kembali ketika masa itu berakhir.
- source_word: אַרְבָּעִים יוֹם
  choice: empat puluh hari
  rationale: Ungkapan bilangan ini secara langsung menyatakan jangka waktu empat puluh hari.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Susunan klausa diubah agar alami dalam bahasa Indonesia tanpa mengubah urutan logis: penjelajahan berlangsung empat puluh hari, lalu mereka kembali. Penanda catatan kaki ditempatkan langsung sesudah kalimat.'
