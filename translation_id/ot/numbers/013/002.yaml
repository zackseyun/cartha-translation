id: NUM.13.2
reference: Numbers 13:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: id
  text: “Utuslah beberapa laki-laki[a] untuk menyelidiki[b] tanah Kanaan, yang sedang Kuberikan kepada keturunan Israel.[c] Dari setiap suku leluhur mereka harus kamu utus satu orang, masing-masing seorang pemimpin di antara mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Utuslah bagimu beberapa laki-laki.” Kata “bagimu” dapat memberi penekanan atau menyiratkan bahwa Musa diberi wewenang untuk melakukan hal itu.
    reason: textual_transparency
  - marker: b
    text: Atau “menjelajahi” atau “mengintai.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak lelaki Israel,” ungkapan Ibrani yang lazim untuk umat Israel sebagai keturunan Israel.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Utuslah
  rationale: Kata kerja imperatif diterjemahkan dengan bentuk perintah yang wajar dan bermartabat dalam bahasa Indonesia. Unsur לְךָ tidak dimasukkan secara kaku sebagai ‘bagimu’ karena hasilnya tidak alami dan dapat memberi kesan manfaat pribadi; keberadaan serta kemungkinan nuansanya dicatat dalam catatan kaki [a].
- source_word: אֲנָשִׁים
  choice: beberapa laki-laki
  rationale: Dalam konteks ini kata tersebut menunjuk kepada para wakil laki-laki yang dipilih dari suku-suku Israel. ‘Beberapa’ menyampaikan bentuk jamak tak tentu tanpa menentukan jumlah di luar keterangan berikutnya.
- source_word: וְיָתֻרוּ
  choice: untuk menyelidiki
  rationale: Kata תור di sini berarti menjelajahi atau mengamati suatu wilayah guna memperoleh pengetahuan. ‘Menyelidiki’ sesuai dengan konteks peninjauan tanpa membatasi maknanya hanya pada kegiatan mata-mata.
- source_word: אֶרֶץ כְּנַעַן
  choice: tanah Kanaan
  rationale: Terjemahan ini mempertahankan אֶרֶץ secara eksplisit dan merupakan ungkapan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: yang sedang Kuberikan
  rationale: Partisipel נֹתֵן menggambarkan pemberian ilahi sebagai tindakan yang berlangsung atau sedang diwujudkan; ‘sedang Kuberikan’ mempertahankan aspek tersebut.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada keturunan Israel
  rationale: ‘Keturunan Israel’ mempertahankan unsur hubungan keluarga dalam ungkapan Ibrani, tetapi dalam bahasa Indonesia modern jelas menunjuk kepada umat Israel seluruhnya. Bentuk harfiahnya dijelaskan dalam catatan kaki [c].
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: dari setiap ... satu orang
  rationale: 'Susunan ini menyampaikan daya distributif dari pengulangan Ibrani: satu wakil untuk tiap-tiap suku.'
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: dari setiap suku leluhur mereka
  rationale: מַטֶּה berarti ‘suku’ dalam konteks ini, sedangkan אֲבֹתָיו mengacu pada garis leluhur pihak ayah. Bentuk jamak ‘mereka’ membuat acuannya kepada orang Israel jelas dalam bahasa Indonesia.
- source_word: תִּשְׁלָחוּ
  choice: harus kamu utus
  rationale: Bentuk imperfek ini berfungsi sebagai instruksi lanjutan. ‘Harus kamu utus’ menyampaikan daya perintah dengan jelas.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: masing-masing seorang pemimpin di antara mereka
  rationale: נָשִׂיא dapat berarti pemimpin, kepala, atau pangeran. ‘Pemimpin’ merupakan padanan modern yang luas dan menunjukkan bahwa setiap orang yang dipilih memiliki kedudukan yang diakui di antara bangsanya.
theological_decisions:
- issue: Nuansa לְךָ dalam perintah ilahi
  choice: Tidak diterjemahkan secara kaku dalam teks utama, tetapi dipertahankan dalam catatan kaki [a] sebagai ‘bagimu’.
  alternative: ‘Utuslah bagimu beberapa laki-laki’ atau memahami לְךָ sebagai unsur idiomatis tanpa padanan tersendiri.
  rationale: Terjemahan ‘bagimu’ dalam teks utama terdengar tidak alami dan cenderung menafsirkan frasa itu sebagai manfaat pribadi. Catatan kaki mempertahankan data sumber dan membiarkan terbuka apakah unsur tersebut menyatakan penekanan, keterlibatan pribadi Musa, atau pemberian izin.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: ‘keturunan Israel’ dalam teks utama dengan bentuk harfiah dalam catatan kaki [c].
  alternative: ‘anak-anak lelaki Israel’, ‘anak-anak Israel’, atau ‘orang Israel’.
  rationale: Ungkapan Ibrani berbentuk maskulin dan bersifat kekeluargaan serta perjanjian, tetapi merujuk kepada umat Israel secara keseluruhan. ‘Keturunan Israel’ menjaga unsur garis keturunan tanpa memberi kesan bahwa hanya anak laki-laki atau anak kecil yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang khidmat tetapi mudah dipahami. Pronomina ilahi ditulis dengan kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat kedua mempertahankan penekanan distributif teks Ibrani tanpa menjadi kaku.
