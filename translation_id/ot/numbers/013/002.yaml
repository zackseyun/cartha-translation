  source_fidelity: 'Teks Indonesia menyampaikan semua unsur pokok Ibrani: perintah mengutus para laki-laki, tujuan meninjau tanah Kanaan, pemberian tanah oleh Allah kepada keturunan Israel, satu wakil dari setiap suku leluhur, dan status mereka sebagai pemimpin. Nuansa לְךָ (''bagimu'') tidak dimasukkan secara harfiah dalam teks utama demi kelancaran, tetapi dipertahankan dengan tepat dalam catatan [a].'
  naturalness: Bahasanya baku, modern, dan mengalir. “Dari setiap suku leluhur mereka harus kamu utus satu orang” secara alami menyatakan distribusi satu wakil per suku, tanpa mengubah makna dasar frasa Ibrani yang secara harfiah berpusat pada garis leluhur/paternal.
  terminology: “Tanah Kanaan,” “keturunan Israel,” dan “pemimpin” merupakan padanan yang wajar dan setia konteks. “Keturunan Israel” dengan catatan bentuk harfiah menjaga cakupan komunal בני ישראל tanpa menyempitkannya hanya kepada laki-laki. Catatan [b] secara memadai mencatat alternatif untuk תור.
