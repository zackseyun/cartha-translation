lexical_decisions:
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam daftar para wakil suku ini, לְ yang melekat pada מַטֶּה menunjukkan afiliasi Palti dengan suku Benyamin. Ungkapan “dari suku” alami dalam bahasa Indonesia dan mempertahankan fungsi konstruksi tersebut.
- source_word: בִנְיָמִן
  choice: Benyamin
  rationale: Nama suku ini memakai bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: פַּלְטִי
  choice: Palti
  rationale: Nama diri ditransliterasikan secara langsung dari bahasa Ibrani.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar nama, “anak” merupakan padanan ringkas dan alami bagi konstruksi silsilah Ibrani.
- source_word: רָפוּא
  choice: Rafu
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani רָפוּא dengan ejaan yang sesuai bagi pembaca bahasa Indonesia.
