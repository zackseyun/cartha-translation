base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: id
  text: Maka Musa mengutus mereka dari padang gurun Paran atas perintah Yahweh.[a] Mereka semua adalah laki-laki, para pemimpin bani Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan firman Yahweh.” Ungkapan Ibraninya secara harfiah berarti “menurut mulut Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau “para pemimpin orang Israel.” Secara harfiah: “kepala-kepala anak-anak Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֹתָם מֹשֶׁה
  choice: Maka Musa mengutus mereka
  rationale: Bentuk naratif וַיִּשְׁלַח menyatakan tindakan lampau yang melanjutkan alur. “Mengutus” secara alami menyampaikan pengiriman dengan tugas tertentu.
- source_word: מִמִּדְבַּר פָּארָן
  choice: dari Padang Gurun Paran
  rationale: מִדְבָּר menunjuk wilayah liar atau tidak dibudidayakan; “padang gurun” merupakan padanan geografis yang lazim dan Paran dipertahankan sebagai nama tempat.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan Ibrani yang secara harfiah berarti “menurut mulut Yahweh” secara idiomatis menyatakan bahwa tindakan itu dilakukan sesuai perintah atau arahan ilahi.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: Mereka semua adalah laki-laki
  rationale: כֻּלָּם menegaskan keseluruhan kelompok, sedangkan אֲנָשִׁים dalam konteks para wakil suku ini merujuk kepada laki-laki.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: kepala-kepala bani Israel
  rationale: “Kepala-kepala” mempertahankan gambaran konkret רָאשֵׁי, sementara “bani Israel” merupakan ungkapan Indonesia yang ringkas dan tetap mencerminkan sebutan kekeluargaan בְנֵי יִשְׂרָאֵל.
- source_word: הֵמָּה
  choice: adalah
  rationale: Pronomina penegas ini tercakup secara alami dalam susunan “Mereka semua adalah ...” tanpa pengulangan yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Bahasa bergender dan sebutan kekeluargaan dalam אֲנָשִׁים / בְנֵי יִשְׂרָאֵל
  choice: laki-laki ... bani Israel
  alternative: orang-orang ... orang Israel; para pemimpin Israel
  rationale: Konteks menunjuk para wakil suku yang laki-laki. “Bani Israel” juga mempertahankan nuansa keturunan atau kekeluargaan dari ungkapan Ibrani tanpa memaksakan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Mengutus” dipilih karena menyiratkan penugasan; “kepala-kepala bani Israel” mempertahankan citra dan sebutan kekeluargaan teks sumber, sedangkan catatan kaki menyediakan bentuk yang lebih idiomatis.
