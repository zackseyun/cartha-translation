  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: id
  text: Orang Amalek tinggal di tanah Negeb[a]. Orang Het, orang Yebus, dan orang Amori tinggal di daerah pegunungan, dan orang Kanaan tinggal di tepi laut dan di sepanjang Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tanah selatan”; Negeb adalah nama wilayah kering di bagian selatan Kanaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: orang Amalek
  rationale: Nama kelompok etnis dipertahankan melalui transliterasi; penambahan 'orang' membuat rujukan kolektifnya alami dalam bahasa Indonesia.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: tinggal
  rationale: Partisip Ibrani ini menyatakan keberadaan menetap di suatu wilayah; 'tinggal' alami dan tepat dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: di tanah Negeb
  rationale: Mencerminkan אֶרֶץ dan mempertahankan Negeb sebagai nama wilayah selatan yang khas.
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: orang Het / orang Yebus / orang Amori / orang Kanaan
  rationale: Bentuk tunggal kolektif Ibrani diterjemahkan sebagai nama kelompok bangsa dengan pola yang alami dalam bahasa Indonesia.
- source_word: בָּהָר
  choice: di daerah pegunungan
  rationale: Dalam konteks geografis, הַר menunjuk kawasan perbukitan atau pegunungan, bukan hanya sebuah gunung tertentu.
- source_word: עַל הַיָּם
  choice: di tepi laut
  rationale: Menyampaikan hubungan spasial 'di dekat/pada sisi laut' tanpa mempersempitnya secara berlebihan menjadi istilah teknis 'pesisir'.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: di sepanjang Sungai Yordan
  rationale: Ungkapan harfiah 'pada sisi Yordan' merupakan idiom lokasi; 'di sepanjang Sungai Yordan' alami dan mempertahankan gagasan wilayah yang berdekatan dengannya.
