  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: id
  text: Mereka melapor kepadanya, “Kami telah memasuki negeri yang engkau suruh kami datangi. Negeri itu memang berlimpah susu dan madu,[a] dan inilah buahnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan memang negeri itu mengalir dengan susu dan madu.” Kata Ibrani וְגַם memberi penekanan pada pernyataan tentang kelimpahan negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: Mereka menyampaikan laporan
  rationale: Bentuk piel dari ספר berarti menceritakan atau melaporkan; ungkapan ini cocok dengan suasana resmi ketika para pengintai memberikan laporan.
- source_word: לוֹ
  choice: kepadanya
  rationale: Mempertahankan pronomina Ibrani; acuannya adalah Musa dalam konteks.
- source_word: וַיֹּאמְרוּ
  choice: dengan berkata
  rationale: Mengungkapkan kelanjutan naratif tanpa menghasilkan rangkaian 'dan ... dan berkata' yang kaku dalam bahasa Indonesia.
- source_word: בָּאנוּ אֶל הָאָרֶץ
  choice: Kami telah memasuki negeri
  rationale: בוא dapat berarti datang atau masuk; dalam konteks perjalanan pengintaian ke dalam wilayah itu, 'memasuki' alami dan tepat.
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: yang engkau suruh kami datangi
  rationale: Menyatakan bahwa Musa mengutus mereka dengan negeri itu sebagai tujuan, dalam susunan Indonesia yang alami.
- source_word: וְגַם
  choice: memang
  rationale: Partikel gabungan ini menegaskan kebenaran laporan positif mengenai kesuburan negeri.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: berlimpah susu dan madu
  rationale: Idiom Ibrani menggambarkan kelimpahan dan kesuburan. 'Berlimpah' menyampaikan maknanya secara alami tanpa gambaran harfiah yang janggal.
- source_word: הִוא
  choice: Negeri itu
  rationale: Pronomina feminin mengacu kepada negeri; pengulangan nomina memperjelas acuan dalam bahasa Indonesia.
- source_word: וְזֶה פִּרְיָהּ
  choice: dan inilah buahnya
  rationale: Demonstratif menunjuk buah yang dibawa sebagai bukti nyata dari negeri tersebut.
