base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: id
  text: Lalu Kaleb menenangkan[a] orang-orang itu di hadapan Musa dan berkata, “Mari kita sungguh maju[b] dan menguasai negeri itu, sebab kita pasti sanggup melakukannya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendiamkan.” Kata Ibrani ini dapat berarti membuat orang menjadi tenang, diam, atau berhenti berbicara.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “naik, kita sungguh akan naik,” suatu susunan bahasa Ibrani yang memberi penegasan kuat.
    reason: lexical_alternative
  - marker: c
    text: Atau “sebab kita sungguh mampu mengatasinya.” Kata ganti dalam bahasa Ibrani mengacu kepada negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: menenangkan
  rationale: Kata kerja ini berarti membuat orang banyak menjadi tenang atau diam. “Menenangkan” sesuai dengan adegan tersebut tanpa menyiratkan tindakan keras seperti yang mungkin terkandung dalam “membungkam”.
- source_word: אֶת־הָעָם
  choice: rakyat itu
  rationale: עָם merujuk kepada umat Israel yang sedang berkumpul. “Rakyat itu” alami dalam konteks bangsa Israel dan mempertahankan penunjukan definit dari bahasa Ibrani.
- source_word: אֶל־מֹשֶׁה
  choice: di hadapan Musa
  rationale: Walaupun אֶל biasanya berarti “kepada” atau “ke arah,” dalam konteks ini frasa tersebut menggambarkan Kaleb menenangkan rakyat dalam kehadiran Musa. “Di hadapan Musa” menyampaikan adegan itu secara alami.
- source_word: עָלֹה נַעֲלֶה
  choice: Mari kita maju
  rationale: Infinitif absolut yang diikuti bentuk imperfek orang pertama jamak memberi penegasan kuat. Dalam bahasa Indonesia, bentuk ajakan “Mari kita maju” mengungkapkan desakan Kaleb secara alami; unsur penegasannya dijelaskan dalam catatan kaki agar konstruksi sumber tidak dibebani dengan tambahan temporal.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: dan mengambil negeri itu menjadi milik kita
  rationale: יָרַשׁ dalam konteks memasuki Kanaan berarti memperoleh dan menduduki negeri itu sebagai milik. Ungkapan ini mempertahankan unsur perolehan kepemilikan dengan bahasa Indonesia yang jelas.
- source_word: כִּי יָכוֹל נוּכַל
  choice: sebab kita pasti sanggup
  rationale: Pengulangan melalui infinitif absolut dan bentuk imperfek menegaskan kemampuan mereka. “Pasti sanggup” menyampaikan keyakinan kuat Kaleb secara ringkas dan alami.
- source_word: לָהּ
  choice: melakukannya
  rationale: Akhiran feminin tunggal mengacu kepada negeri itu, tetapi setelah “sanggup” bahasa Indonesia memerlukan pelengkap yang alami. “Melakukannya” merujuk pada tindakan maju dan mengambil negeri tersebut tanpa mempersempit maknanya menjadi sekadar mengalahkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk ajakan “Mari kita maju” mempertahankan nada seruan Kaleb, sedangkan “pasti sanggup” menyampaikan penegasan kuat dari konstruksi Ibrani. Catatan kaki mempertahankan pilihan leksikal dan bentuk penegasan yang tidak dapat ditampilkan sepenuhnya tanpa membuat kalimat utama terasa kaku.
