  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: id
  text: Perhatikanlah bagaimana keadaan negeri itu[a] dan apakah penduduknya kuat atau lemah, sedikit atau banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani secara harfiah, “negeri itu, apakah itu.” Maksudnya ialah menilai sifat atau keadaan negeri tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Perhatikanlah
  rationale: Bentuk dari ראה berfungsi sebagai perintah dalam konteks pengutusan para pengintai. 'Perhatikanlah' menyampaikan tindakan mengamati dan menilai, bukan sekadar melihat sepintas.
- source_word: הָאָרֶץ מַה הִוא
  choice: bagaimana keadaan negeri itu
  rationale: Secara harfiah berarti 'negeri itu, apakah/apa itu'; dalam konteks ini frasa tersebut meminta penilaian mengenai sifat atau kondisi negeri. Ungkapan pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan pertanyaannya.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: penduduknya
  rationale: Frasa Ibrani berarti 'bangsa/orang-orang yang tinggal di atasnya'. Dalam konteks sebuah negeri, 'penduduknya' merupakan padanan Indonesia yang ringkas dan alami untuk orang-orang yang menetap di sana.
- source_word: הֶחָזָק
  choice: kuat
  rationale: חזק menunjukkan kekuatan; 'kuat' mempertahankan pertentangannya dengan 'lemah' dan sesuai dengan penilaian kemampuan penduduk.
- source_word: הֲרָפֶה
  choice: lemah
  rationale: רפה di sini merupakan lawan dari חזק dan menunjukkan tidak adanya kekuatan; 'lemah' adalah padanan Indonesia yang langsung dan jelas.
- source_word: הַמְעַט
  choice: sedikit
  rationale: Kata ini mengacu pada jumlah dan berlawanan dengan רָב. 'Sedikit' secara alami menyatakan bahwa jumlah penduduk tidak besar.
- source_word: רָב
  choice: banyak
  rationale: Dalam pertentangan dengan הַמְעַט, רָב berarti berjumlah besar; 'banyak' adalah padanan paling langsung.
- source_word: אִם
  choice: atau
  rationale: אִם menghubungkan pilihan dalam pertanyaan tidak langsung berpasangan. Dalam susunan Indonesia 'apakah ... atau ...', unsur ini paling alami diterjemahkan 'atau'.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan lugas. ''Negeri'' dipilih untuk הָאָרֶץ dalam konteks wilayah Kanaan; ''penduduknya'' menghindari ungkapan harfiah yang kurang alami, ''orang-orang yang tinggal di atasnya''. Struktur pertanyaan dibuat ringkas tanpa menghilangkan dua pasangan penilaian: kuat/lemah dan sedikit/banyak.'
