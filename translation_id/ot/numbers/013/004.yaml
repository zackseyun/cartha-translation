  yaml_path: translation/ot/numbers/013/004.yaml
  text: 'And these were their names: from the tribe of Reuben, Shammua son of Zaccur.'
translation:
  language: id
  text: 'Dan inilah nama-nama mereka: dari suku Ruben, Syamua anak Zakur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Dalam bahasa Indonesia, “Inilah” secara alami memperkenalkan daftar yang melanjutkan ayat sebelumnya; fungsi penghubung ו dipertahankan melalui kesinambungan wacana tanpa perlu diterjemahkan secara kaku sebagai “dan”.
- source_word: שְׁמוֹתָם
  choice: nama-nama mereka
  rationale: Bentuk jamak dan sufiks orang ketiga jamak diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam konteks daftar para wakil, frasa ini menyatakan asal atau afiliasi kesukuan; “dari suku” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שַׁמּוּעַ
  choice: Syamua
  rationale: Nama pribadi ditransliterasikan ke ejaan Indonesia dengan “sy” untuk bunyi שׁ dan mempertahankan bentuk nama Ibraninya.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumusan silsilah atau identifikasi nama, “anak” adalah padanan Indonesia yang alami bagi בֶּן.
- source_word: זַכּוּר
  choice: Zakur
  rationale: Nama pribadi ditransliterasikan secara ringkas sesuai kaidah ejaan Indonesia, dengan konsonan rangkap Ibrani tidak digandakan.
