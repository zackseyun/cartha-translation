  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: id
  text: 'Dan bagaimana keadaan tanah itu: subur atau tandus[a]; apakah di sana ada pohon[b] atau tidak? Kuatkanlah diri kalian dan ambillah sebagian buah dari tanah itu.” Saat itu adalah masa anggur pertama mulai masak.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “gemuk atau kurus,” suatu gambaran tentang tanah yang subur atau tidak subur.
    reason: lexical_note
  - marker: b
    text: Atau “kayu”; kata Ibrani yang sama dapat berarti pohon maupun kayu.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “hari-hari itu adalah hari-hari anggur pertama masak,” yaitu awal musim panen anggur.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה הִוא אִם רָזָה
  choice: tanah itu subur atau kurus
  rationale: Pasangan harfiah 'gemuk atau kurus' menggambarkan mutu tanah. 'Subur atau kurus' mempertahankan citra Ibrani sekaligus memakai ungkapan pertanian Indonesia yang dapat dipahami.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: apakah di sana ada pohon atau tidak
  rationale: עֵץ dapat berarti pohon atau kayu. 'Pohon' paling langsung dalam uraian tentang keadaan tanah, sedangkan kemungkinan makna 'kayu' dipertahankan dalam catatan kaki.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: Kuatkanlah diri kalian
  rationale: Bentuk refleksif menyampaikan seruan agar para pengintai meneguhkan diri. Ungkapan ini dekat dengan bentuk sumber dan alami dalam bahasa Indonesia.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: ambillah sebagian buah dari tanah itu
  rationale: Preposisi מִן menyatakan sebagian dari buah atau hasil tanah. 'Buah' menjaga hubungan leksikal dengan konteks buah anggur tanpa menambahkan gagasan 'membawa pulang' yang hanya tersirat.
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: buah anggur yang pertama mulai masak
  rationale: Frasa ini menunjuk buah anggur awal yang mulai matang, yakni permulaan musim anggur, tanpa harus memberinya nuansa persembahan keagamaan.
- source_word: וְהַיָּמִים יְמֵי
  choice: Pada waktu itu
  rationale: Ungkapan waktu naratif Ibrani diringkas secara wajar dalam bahasa Indonesia; bentuk harfiahnya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan jamak 'kalian' memperjelas bahwa perintah ditujukan kepada para pengintai. Metafora tanah 'kurus' dipertahankan dengan bantuan catatan kaki, sedangkan catatan waktu penutup dibuat alami tanpa menghilangkan bentuk harfiahnya.
