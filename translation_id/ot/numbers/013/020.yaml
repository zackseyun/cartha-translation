  naturalness: '"Dan bagaimana keadaan tanah itu: subur atau tandus" alami dan tetap mempertahankan pertanyaan pembuka Ibrani. "Kuatkanlah diri kalian" dapat dipertahankan sebagai seruan jamak yang jelas. "Saat itu adalah masa anggur pertama mulai masak" menyampaikan catatan waktu naratif secara wajar.'
  terminology: '"Pohon" tepat sebagai terjemahan utama עֵץ, dengan alternatif "kayu" di catatan kaki. "Anggur pertama mulai masak" secara netral menyatakan בִּכּוּרֵי עֲנָבִים tanpa memasukkan nuansa persembahan. Catatan tentang makna harfiah "gemuk atau kurus" mempertahankan citra leksikal tanpa memaksakannya ke dalam teks utama.'
