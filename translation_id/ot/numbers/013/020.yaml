revisions:
- from: dan apakah tanah itu subur atau kurus[a], serta apakah di sana ada pohon[b] atau tidak. Kuatkanlah diri kalian dan ambillah sebagian buah dari tanah itu.” Pada waktu itu, buah anggur yang pertama mulai masak.[c]
  to: 'Dan bagaimana keadaan tanah itu: subur atau tandus[a]; apakah di sana ada pohon[b] atau tidak? Kuatkanlah diri kalian dan ambillah sebagian buah dari tanah itu.” Saat itu adalah masa anggur pertama mulai masak.[c]'
  rationale: Revisi mengganti metafora yang tidak lazim "kurus" dengan "tandus" sambil mempertahankan padanan harfiahnya dalam catatan kaki. Pertanyaan pembuka dibuat eksplisit sesuai struktur sumber, dan catatan penutup dipulihkan sebagai keterangan tentang masa anggur pertama masak. Pilihan "pohon," "Kuatkanlah diri kalian," dan "sebagian buah dari tanah itu" dipertahankan karena setia pada sumber dan dapat dipahami dalam bahasa Indonesia modern.
