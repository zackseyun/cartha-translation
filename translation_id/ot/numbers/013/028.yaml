  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pilihan “berkubu” ringkas serta mempertahankan nuansa pertahanan militer. Tanda catatan kaki ditempatkan langsung setelah “Enak” karena menjelaskan keseluruhan ungkapan garis keturunan.
