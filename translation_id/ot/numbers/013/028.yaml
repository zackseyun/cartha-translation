language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶ֚פֶס כִּֽי עַ֣ז הָ/עָ֔ם הַ/יֹּשֵׁ֖ב בָּ/אָ֑רֶץ וְ/הֶֽ/עָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְ/גַם יְלִדֵ֥י הָֽ/עֲנָ֖ק רָאִ֥ינוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: id
  text: Namun, bangsa yang tinggal di negeri itu kuat, dan kota-kotanya berkubu serta sangat besar. Kami juga melihat keturunan Enak[a] di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Enak”; ungkapan Ibrani ini menunjuk kepada orang-orang yang berasal dari garis keturunan Enak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Namun
  rationale: Gabungan ini memberikan pembatasan tegas terhadap laporan positif pada ayat sebelumnya; “Namun” alami dalam bahasa Indonesia dan mempertahankan daya adversatifnya.
- source_word: עַז
  choice: kuat
  rationale: Kata ini menggambarkan kekuatan atau keadaan penduduk yang sukar dihadapi tanpa menambahkan kesan kebuasan yang tidak harus terkandung dalam teks.
- source_word: הָעָם
  choice: bangsa
  rationale: Dalam konteks laporan mengenai penduduk negeri, “bangsa” menyampaikan kelompok penduduk secara kolektif dengan gaya naratif yang wajar.
- source_word: הַיֹּשֵׁב בָּאָרֶץ
  choice: yang tinggal di negeri itu
  rationale: Konstruksi partisipial diterjemahkan sebagai klausa relatif yang alami; “negeri itu” menunjuk kembali kepada negeri yang sedang dilaporkan.
- source_word: וְהֶעָרִים בְּצֻרוֹת
  choice: dan kota-kotanya berkubu
  rationale: “Berkubu” menyampaikan bahwa kota-kota tersebut dilindungi oleh pertahanan, sesuai dengan makna militer בְּצֻרוֹת.
- source_word: גְּדֹלֹת מְאֹד
  choice: serta sangat besar
  rationale: Terjemahan ini mempertahankan ukuran kota-kota dan penguatan מְאֹד, sekaligus mengalir alami setelah “berkubu”.
- source_word: וְגַם
  choice: Kami juga
  rationale: Partikel tambahan menandai rincian menggentarkan berikutnya; subjek “kami” dinyatakan sesuai bentuk verba orang pertama jamak.
- source_word: יְלִדֵי הָעֲנָק
  choice: keturunan Enak
  rationale: Ungkapan konstruksi ini menyatakan garis keturunan; “keturunan Enak” lebih alami daripada terjemahan harfiah “anak-anak Enak” dan tetap menjaga makna genealogis.
- source_word: רָאִינוּ שָׁם
  choice: melihat ... di sana
  rationale: Bentuk qatal dalam laporan naratif ini paling wajar diterjemahkan dengan verba lampau yang secara kontekstual sudah jelas dalam bahasa Indonesia; keterangan lokasi dipertahankan.
theological_decisions: []
