  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. “Kita” dipakai karena para pembicara mencakup diri mereka dan orang Israel yang mereka ajak bicara. Ungkapan militer dibuat jelas tanpa menghilangkan keterangan harfiah dalam catatan kaki.
