  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: id
  text: Tetapi orang-orang yang telah pergi bersama dia berkata, “Kita tidak sanggup maju melawan bangsa itu,[a] sebab mereka lebih kuat daripada kita.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah bahasa Ibrani berbunyi “naik kepada bangsa itu”; dalam konteks ini maksudnya ialah maju melawan bangsa itu dalam pertempuran.
    reason: lexical_alternative
  - marker: b
    text: 'Dalam bahasa Ibrani, “bangsa itu” dan pronomina yang merujuk kepadanya berbentuk tunggal: “bangsa itu ... ia lebih kuat daripada kita.” Terjemahan memakai “mereka” sesuai dengan makna kolektifnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Tetapi orang-orang
  rationale: Kata penghubung וְ dalam konteks ini menandai pertentangan dengan perkataan Kaleb pada ayat sebelumnya, sehingga diterjemahkan secara wajar sebagai “Tetapi”. אֲנָשִׁים tetap diterjemahkan konkret sebagai “orang-orang”.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: yang telah pergi bersama dia
  rationale: Klausa relatif ini menunjuk kepada para pengintai yang menyertai Kaleb. Bentuk “telah pergi” menyatakan tindakan yang mendahului perkataan mereka tanpa memaksakan ungkapan “naik” yang kurang alami dalam bahasa Indonesia pada bagian ini.
- source_word: אָמְרוּ
  choice: berkata
  rationale: Bentuk qatal dalam alur narasi ini menyatakan tindakan lampau sederhana.
- source_word: לֹא נוּכַל
  choice: Kita tidak sanggup
  rationale: יכל menyatakan kemampuan. “Tidak sanggup” alami dalam bahasa Indonesia dan mempertahankan pengakuan mereka mengenai ketidakmampuan.
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: maju melawan bangsa itu
  rationale: עלה secara harfiah berarti “naik”, tetapi dalam konteks konfrontasi militer berarti bergerak maju. אֶל di sini secara kontekstual bersifat adversatif, yaitu maju menghadapi atau melawan bangsa tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” jelas, ringkas, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: mereka lebih kuat daripada kita
  rationale: Pronomina Ibrani berbentuk tunggal karena merujuk kepada הָעָם, nomina kolektif. Bahasa Indonesia secara alami memakai “mereka” untuk para penduduk yang dimaksud, sedangkan “lebih kuat daripada” mempertahankan bentuk perbandingan.
