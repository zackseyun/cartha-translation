  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר menyatakan peristiwa berikut dalam narasi. Dalam bahasa Indonesia, “berfirman” merupakan padanan wajar dan bermartabat ketika subjeknya Allah, serta tetap dapat dibedakan dari formula אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai orang yang menjadi tujuan firman dan secara alami diterjemahkan “kepada”.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk nama משה yang baku dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif לֵאמֹר merupakan formula pengantar bagi perkataan langsung yang menyusul. “Demikian:” menyampaikan fungsi itu secara alami tanpa menghasilkan ungkapan Indonesia yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menggunakan Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik dua menandai bahwa isi firman langsung menyusul pada ayat berikutnya. Tidak ada penanda catatan kaki karena draf ini tidak memerlukan catatan.
