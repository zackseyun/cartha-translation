lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: dari suku
  rationale: Dalam daftar para wakil suku ini, לְ yang melekat pada מַטֶּה memperkenalkan suku yang diwakili oleh orang yang disebutkan. Ungkapan 'dari suku' alami dalam bahasa Indonesia dan menyampaikan hubungan asal atau keanggotaan.
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Transliterasi nama suku yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: יִגְאָל
  choice: Yigal
  rationale: Transliterasi yang cukup dekat dengan bentuk Ibrani dan mengikuti ejaan Indonesia, dengan huruf Y untuk bunyi awal yod.
- source_word: בֶּן
  choice: anak
  rationale: Dalam identifikasi genealogis ini, בֶּן secara langsung menunjukkan hubungan anak laki-laki dengan ayahnya. Bahasa Indonesia lazim memakai 'anak' tanpa perlu menambahkan penanda gender.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia untuk יוֹסֵף.
