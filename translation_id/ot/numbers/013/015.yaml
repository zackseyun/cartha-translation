lexical_decisions:
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam daftar para pengintai, לְ dengan מַטֶּה menunjukkan asal atau afiliasi suku. Ungkapan “dari suku” alami dalam bahasa Indonesia dan sesuai dengan fungsi frasa ini dalam konteks.
- source_word: גָד
  choice: Gad
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: גְּאוּאֵל
  choice: Geuel
  rationale: Nama orang ditransliterasikan secara langsung dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian nama silsilah, בֶּן menyatakan hubungan anak laki-laki dengan ayahnya. Bahasa Indonesia lazim memakai “anak” tanpa kata sandang.
- source_word: מָכִי
  choice: Makhi
  rationale: Huruf כ bertanda dagesh-free dibaca sebagai frikatif /kh/; bentuk “Makhi” mempertahankan ciri bunyi Ibrani sambil tetap mudah dibaca.
