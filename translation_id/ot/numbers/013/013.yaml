  rationale: Nama suku ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: סְתוּר
  choice: Setur
  rationale: Nama diri ini ditransliterasikan langsung dari bentuk Ibrani dengan ejaan yang alami bagi pembaca bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah atau penyebutan patronimik, בֶּן secara alami diterjemahkan “anak” dalam bahasa Indonesia.
- source_word: מִיכָאֵל
  choice: Mikhael
  rationale: Nama diri ini ditransliterasikan dengan mempertahankan konsonan kh dari huruf Ibrani כ dan bentuk yang mudah dikenali dalam bahasa Indonesia.
