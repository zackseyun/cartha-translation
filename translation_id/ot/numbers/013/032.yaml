source:
  edition: WLC
  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: id
  text: Lalu mereka menyampaikan kepada anak-anak Israel[c] laporan buruk[a] tentang negeri yang telah mereka jelajahi[b]. Kata mereka, “Negeri yang telah kami lalui untuk menjelajahinya itu adalah negeri yang melahap penduduknya[d], dan semua orang yang kami lihat di sana adalah laki-laki bertubuh besar[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menyebarkan laporan buruk,” atau dengan makna yang lebih kuat, “memfitnah negeri itu.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “mengintai” atau “menyelidiki.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak lelaki Israel”; ini merupakan sebutan baku bagi keturunan atau umat Israel secara keseluruhan.
    reason: cultural_note
  - marker: d
    text: Dapat juga diterjemahkan “negeri yang menghabiskan penduduknya.”
    reason: lexical_alternative
  - marker: e
    text: Atau “laki-laki berperawakan besar”; ungkapan ini merujuk pada ukuran fisik yang mengesankan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: menyampaikan ... laporan buruk
  rationale: Gabungan kata ini menggambarkan dikeluarkan atau disebarkannya laporan yang mencemarkan. ‘Menyampaikan laporan buruk’ alami dalam bahasa Indonesia dan tidak memaksakan tuduhan ‘fitnah’ ke dalam teks utama.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: ‘Negeri’ sesuai untuk wilayah Kanaan sebagai suatu kawasan berpenduduk dan terdengar alami dalam konteks laporan para pengintai.
- source_word: תָּרוּ / לָתוּר
  choice: telah mereka jelajahi / untuk menjelajahinya
  rationale: Kata kerja Ibrani ini menunjuk pada kegiatan menyelidiki atau meninjau suatu wilayah. ‘Menjelajahi’ mempertahankan cakupan makna tanpa membatasinya pada kegiatan mata-mata.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kepada anak-anak Israel
  rationale: Ungkapan ini mempertahankan bentuk sebutan kolektif Ibrani bagi keturunan atau umat Israel; catatan kaki menjelaskan pemakaiannya.
- source_word: עָבַרְנוּ בָהּ
  choice: telah kami lalui
  rationale: Pilihan ini menyampaikan gerak melewati atau melintasi negeri tersebut secara ringkas dan wajar.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: negeri yang melahap penduduknya
  rationale: ‘Melahap’ mempertahankan metafora yang kuat dan mengancam dalam ujaran para pengintai.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: laki-laki bertubuh besar
  rationale: Ungkapan ini merujuk pada ukuran atau perawakan fisik yang luar biasa. ‘Bertubuh besar’ lebih jelas daripada ‘berperawakan tinggi’, yang dapat disalahpahami sebagai kedudukan sosial.
theological_decisions:
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel / umat Israel
  rationale: Bentuk sumber dipertahankan sebagai sebutan perjanjian bagi keturunan Israel, tanpa menyiratkan bahwa kelompok itu hanya terdiri atas anak kecil atau hanya laki-laki.
- issue: Sifat laporan para pengintai
  choice: laporan buruk
  alternative: fitnah tentang negeri itu
  rationale: Teks menyatakan bahwa laporan itu buruk atau mencemarkan, tetapi teks utama tidak mempertegasnya menjadi tuduhan dusta mutlak; kemungkinan makna yang lebih kuat dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Metafora ‘melahap penduduknya’ dipertahankan karena hidup dan mudah dipahami, sedangkan pengulangan ‘menjelajahi’ mengikuti pengulangan dalam sumber Ibrani.
