- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: yaitu dari suku Manasye
  rationale: Pengulangan frasa Ibrani dipertahankan, sementara “yaitu” memperjelas secara alami bahwa Manasye adalah cabang Yusuf yang dimaksud.
- source_word: גַּדִּי
  choice: Gadi
  rationale: Transliterasi nama Ibrani yang alami dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Padanan genealogis yang ringkas dan lazim dalam daftar nama bahasa Indonesia.
- source_word: סוּסִי
  choice: Susi
  rationale: Transliterasi nama Ibrani yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara suku Yusuf dan suku Manasye
  choice: Mempertahankan kedua sebutan dan menambahkan “yaitu” sebagai penghubung penjelas
  alternative: “dari suku Yusuf, dari suku Manasye” tanpa penghubung
  rationale: Teks Ibrani menyebut keduanya secara berurutan; “yaitu” menyampaikan bahwa Manasye merupakan suku/cabang Yusuf yang khusus dimaksud tanpa menghapus pengulangan sumber.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur daftar dipertahankan; nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
