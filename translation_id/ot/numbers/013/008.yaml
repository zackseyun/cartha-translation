lexical_decisions:
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam daftar para wakil suku ini, לְ yang menyertai מַטֶּה menunjukkan asal atau afiliasi orang tersebut. Frasa “dari suku” alami dalam bahasa Indonesia dan mempertahankan pola daftar.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Nama suku ditulis menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הוֹשֵׁעַ
  choice: Hosea
  rationale: Bentuk nama Ibrani ini secara lazim ditransliterasikan “Hosea” dalam bahasa Indonesia. Konteks dan catatan kaki membedakannya dari nabi Hosea.
- source_word: בִּן
  choice: anak
  rationale: Dalam penyebutan silsilah ringkas, “anak” merupakan padanan Indonesia yang alami untuk בִּן.
- source_word: נוּן
  choice: Nun
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
