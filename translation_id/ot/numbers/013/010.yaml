lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: dari suku
  rationale: Dalam rumusan daftar ini, preposisi לְ dengan מַטֶּה menyatakan asal atau afiliasi kesukuan wakil yang disebut. 'Dari suku' alami dan tepat dalam bahasa Indonesia.
- source_word: זְבוּלֻן
  choice: Zebulon
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: גַּדִּיאֵל
  choice: Gadiel
  rationale: Nama diri ditransliterasikan secara wajar ke dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar nama, בֶּן menyatakan hubungan keturunan. 'Anak' merupakan padanan Indonesia yang ringkas dan alami tanpa menambahkan kata sandang.
- source_word: סוֹדִי
  choice: Sodi
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
