  terminology: “Lembah Eskol” dapat diterima sebagai terjemahan utama untuk נַחַל אֶשְׁכֹּל, dengan alternatif wadi dan alur sungai musiman dalam catatan. “Ranting pohon anggur,” “setandan buah anggur,” “buah delima,” dan “buah ara” tepat dan jelas. Nama tempat “Eskol” dipertahankan secara konsisten.
