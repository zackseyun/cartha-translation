base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: id
  text: Mereka sampai di Lembah Eskol[a], lalu dari sana mereka memotong satu ranting pohon anggur dengan setandan buah anggur. Dua orang di antara mereka memikulnya dengan sebuah galah[b]. Mereka juga mengambil beberapa buah delima dan buah ara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Wadi Eskol” atau “Alur Sungai Eskol.” Kata Ibrani נַחַל dapat merujuk pada jurang atau alur sungai musiman, selain lembah.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan sebuah galah pemikul” atau “pada sebuah tongkat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: Lembah Eskol
  rationale: נַחַל dapat menunjuk pada lembah, jurang, atau alur sungai musiman. “Lembah” paling mudah dipahami dalam bahasa Indonesia, sedangkan alternatif geografisnya dijelaskan dalam catatan kaki.
- source_word: זְמוֹרָה
  choice: ranting pohon anggur
  rationale: Kata ini secara khusus merujuk pada ranting atau sulur tanaman anggur. Penyebutan “pohon anggur” membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: setandan buah anggur
  rationale: Ungkapan ini berarti satu tandan buah anggur. Bentuk “setandan” secara alami mempertahankan jumlah tunggalnya.
- source_word: וַיִּשָּׂאֻהוּ
  choice: mengangkutnya
  rationale: Akhiran tunggal merujuk pada ranting beserta tandan anggur sebagai satu muatan. “Mengangkutnya” sesuai dengan gambaran pemindahan benda berat.
- source_word: בַמּוֹט
  choice: dengan sebatang kayu
  rationale: מוֹט adalah galah, batang, atau kayu pemikul. “Sebatang kayu” jelas bagi pembaca umum tanpa menentukan bentuk alat lebih jauh daripada teks sumber.
- source_word: בִּשְׁנָיִם
  choice: dua orang di antara mereka
  rationale: Secara harfiah berarti “oleh/dengan dua.” Konteks menunjukkan dua anggota rombongan pengintai; ungkapan ini membuat pelaku tersirat menjadi jelas tanpa menyebut mereka laki-laki secara eksplisit.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: Mereka juga mengambil beberapa buah delima dan buah ara
  rationale: Tindakan mengambil diteruskan secara tersirat dalam bahasa Ibrani dan dibuat eksplisit agar alami dalam bahasa Indonesia. “Beberapa” tidak menetapkan jumlah tertentu.
