revisions:
- from: Mereka tiba di Lembah Eskol[a]. Di sana mereka memotong satu ranting pohon anggur dengan setandan buah anggur, lalu dua orang di antara mereka mengangkutnya dengan sebatang kayu[b]. Mereka juga mengambil beberapa buah delima dan buah ara.
  to: Mereka sampai di Lembah Eskol[a], lalu dari sana mereka memotong satu ranting pohon anggur dengan setandan buah anggur. Dua orang di antara mereka memikulnya dengan sebuah galah[b]. Mereka juga mengambil beberapa buah delima dan buah ara.
  rationale: Revisi mengganti istilah umum “sebatang kayu” dengan “sebuah galah” untuk mencerminkan מוֹט secara lebih tepat, sambil mempertahankan pelaku tersirat “dua orang di antara mereka” dan objek tunggal yang dibawa. Penghubung “lalu dari sana” juga dipulihkan agar hubungan antarklausa lebih dekat dengan sumber. Tidak ada isu teologis atau ambiguitas tekstual yang memerlukan penandaan tambahan.
