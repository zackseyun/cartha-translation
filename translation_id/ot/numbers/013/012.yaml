lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: dari suku
  rationale: Dalam daftar para utusan ini, לְמַטֵּה menunjukkan asal atau keterkaitan perwakilan dengan suatu suku. Bahasa Indonesia secara alami memakai “dari suku”, sedangkan מַטֶּה di sini berarti kelompok suku, bukan tongkat secara harfiah.
- source_word: דָן
  choice: Dan
  rationale: Nama suku ini dipertahankan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: עַמִּיאֵל
  choice: Amiel
  rationale: Nama orang ditransliterasikan ke bentuk Indonesia yang wajar; konsonan rangkap dalam ejaan sumber tidak perlu dipertahankan.
- source_word: בֶּן
  choice: anak
  rationale: Dalam susunan silsilah atau identifikasi nama, בֶּן secara ringkas dan alami diterjemahkan “anak”.
- source_word: גְּמַלִּי
  choice: Gemali
  rationale: Nama orang ditransliterasikan secara langsung ke ejaan Indonesia yang mudah dibaca.
