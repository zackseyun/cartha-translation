  to: Musa mengutus mereka untuk menyelidiki tanah Kanaan[a], dan ia berkata kepada mereka, “Naiklah ke Negeb[b] lewat sini, lalu naiklah ke daerah perbukitan[c].”
  rationale: Revisi memulihkan makna gerak “naik” pada kedua verba עלה, menerjemahkan petunjuk menuju Negeb tanpa menyatakan secara berlebihan bahwa perjalanan itu harus “melalui” seluruh wilayah tersebut, dan memakai “lewat sini” untuk fungsi זֶה. Catatan kaki c dibalik agar teks utama “daerah perbukitan” menyampaikan arti kawasan dataran tinggi/hill country, sedangkan “pegunungan” tetap tersedia sebagai alternatif yang sah.
