base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: id
  text: Musa mengutus mereka untuk menyelidiki tanah Kanaan[a], dan ia berkata kepada mereka, “Naiklah ke Negeb[b] lewat sini, lalu naiklah ke daerah perbukitan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengintai tanah Kanaan.”
    reason: lexical_alternative
  - marker: b
    text: Negeb adalah kawasan kering di bagian selatan Kanaan.
    reason: cultural_note
  - marker: c
    text: Atau “pegunungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Bentuk wayyiqtol dari שׁלח menuturkan tindakan Musa; “mengutus” alami untuk pengiriman dengan tugas tertentu.
- source_word: לָתוּר
  choice: untuk menyelidiki
  rationale: תור menunjuk pada pengamatan atau peninjauan wilayah. “Menyelidiki” menyampaikan tujuan pengintaian tanpa harus menekankan kegiatan mata-mata yang rahasia.
- source_word: אֶרֶץ כְּנָעַן
  choice: tanah Kanaan
  rationale: Mempertahankan ungkapan geografis lengkap dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: עֲלוּ זֶה בַּנֶּגֶב
  choice: Pergilah melalui Negeb lewat jalan ini
  rationale: עלה dalam petunjuk perjalanan dapat dinaturalkan sebagai “pergilah”, זֶה dipahami secara adverbial sebagai “lewat jalan ini”, dan ב dapat menandai jalur melalui kawasan Negeb.
- source_word: וַעֲלִיתֶם
  choice: lalu naiklah
  rationale: Walaupun berbentuk qatal dengan waw, dalam rangkaian perintah bentuk ini meneruskan daya imperatif; “lalu” memperjelas urutan rute.
- source_word: הָהָר
  choice: daerah pegunungan
  rationale: Dalam konteks geografis, bentuk tunggal kolektif ini menunjuk pada kawasan dataran tinggi atau perbukitan, bukan semata-mata satu gunung.
