  text: Tempat itu dinamai Lembah Eskol[a] karena tandan yang dipotong dari sana oleh orang Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani naḥal dapat berarti alur sungai musiman, lembah yang dilaluinya, atau jurang. Eskol adalah kata Ibrani yang berarti “tandan” atau “gerombol”; nama tempat ini berkaitan dengan tandan yang dipotong di sana.
