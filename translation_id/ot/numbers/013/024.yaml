    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: Tempat itu
  rationale: Mempertahankan acuan tertentu dan daya demonstratif frasa Ibrani dengan ungkapan Indonesia yang alami.
- source_word: קָרָא
  choice: dinamai
  rationale: Bentuk Ibraninya aktif orang ketiga tunggal dengan pelaku yang tidak disebutkan; konstruksi pasif bahasa Indonesia paling alami untuk tindakan pemberian nama.
- source_word: נַחַל
  choice: Lembah
  rationale: נַחַל dapat menunjuk pada alur sungai musiman atau lembah yang terkait dengannya. Dalam nama geografis ini, 'Lembah' jelas dan lazim; alternatifnya dicatat dalam catatan kaki.
- source_word: אֶשְׁכּוֹל
  choice: Eskol
  rationale: Di sini kata tersebut berfungsi sebagai nama tempat dan ditransliterasikan menurut bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: עַל אֹדוֹת
  choice: karena
  rationale: Frasa ini menyatakan alasan penamaan; 'karena' menyampaikan hubungan sebab secara ringkas dan alami.
- source_word: הָאֶשְׁכּוֹל
  choice: gugusan buah
  rationale: Kata itu berarti gugusan atau tandan. Konteks ayat sebelumnya menunjukkan buah anggur, tetapi ayat ini sendiri tidak mengulang kata 'anggur'; 'gugusan buah' tetap alami tanpa menambahkan rincian tersebut secara langsung.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: yang dipotong
  rationale: כרת berarti memotong atau memutuskan. Bentuk pasif menjaga susunan Indonesia yang alami dan tetap menghubungkan tindakan dengan orang Israel.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Mempertahankan acuan lokatif langsung dari teks Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini merupakan sebutan etnis-kovenantal yang secara harfiah berarti 'anak-anak lelaki Israel'. Dalam bahasa Indonesia modern, 'orang Israel' jelas, alami, dan tidak menimbulkan kesan bahwa yang dimaksud adalah putra-putra langsung Yakub; bentuk harfiahnya dicatat sebagai alternatif.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Tidak ada persoalan doktrinal utama. Frasa Ibrani memakai bahasa kekerabatan sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' menyampaikan fungsi etnonimnya secara alami, sedangkan bentuk harfiah dipertahankan dalam catatan kaki agar tekstur sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan pasif dipakai secara wajar dalam kalimat penamaan. Permainan bunyi antara nama Eskol dan kata untuk 'gugusan/tandan' dijelaskan dalam catatan kaki tanpa dipaksakan ke dalam teks utama.
