  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam daftar wakil suku ini, מַטֶּה berarti “suku”. Prefiks לְ berfungsi menandai keterkaitan wakil dengan sukunya; “dari suku” alami dalam bahasa Indonesia dan sesuai dengan konteks daftar.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Nama diri leluhur sekaligus nama suku, ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שָׁפָט
  choice: Safat
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; huruf שׁ diwakili dengan “s” dan פ tanpa dagesh dengan “f”.
- source_word: בֶּן
  choice: anak
  rationale: Konstruksi genealogis Ibrani yang menyatakan hubungan keturunan; “anak” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: חוֹרִי
  choice: Hori
  rationale: Nama diri ditransliterasikan secara langsung dalam bentuk yang alami bagi pembaca Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, mengikuti bentuk daftar pada konteks sekitarnya. Tanda titik koma dipertahankan karena ayat ini merupakan satu unsur dalam rangkaian nama.
