base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: id
  text: 'Kemudian ia melihat orang Keni, lalu menyampaikan ucapannya[a], katanya:


    “Tempat kediamanmu kokoh,

    dan tempatkanlah sarangmu di batu karang.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “ucapan” dapat berarti amsal, sindiran, atau ucapan nubuat; di sini kata itu menunjuk pada ucapan puitis Bileam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: orang Keni
  rationale: Bentuk Ibrani ini tunggal dengan kata sandang, tetapi mewakili suatu kelompok bangsa. Ungkapan “orang Keni” mempertahankan bentuk kolektif tunggal dan terdengar alami dalam bahasa Indonesia.
- source_word: מְשָׁלוֹ
  choice: syairnya
  rationale: Dalam rangkaian ucapan Bileam, מָשָׁל menunjuk pada tuturan puitis yang berbobot dan bersifat profetis. “Syairnya” mempertahankan bentuk puitis konteks ini tanpa mempersempitnya menjadi amsal biasa; cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: אֵיתָן
  choice: kokoh
  rationale: Kata ini menyatakan keteguhan, kekuatan, atau ketahanan. “Kokoh” paling alami untuk menggambarkan keamanan tempat kediaman dalam gambaran puitis ini.
- source_word: מוֹשָׁבֶךָ
  choice: tempat kediamanmu
  rationale: Terjemahan ini menyampaikan arti tempat tinggal atau permukiman sekaligus mempertahankan sapaan orang kedua tunggal kepada orang Keni sebagai kelompok kolektif.
- source_word: וְשִׂים
  choice: terletak
  rationale: Dalam baris puitis ini bentuk tersebut menggambarkan keadaan sarang yang ditempatkan atau berada dengan aman. “Terletak” menghasilkan predikasi yang alami dalam bahasa Indonesia tanpa mengubahnya menjadi perintah.
- source_word: בַּסֶּלַע
  choice: di bukit batu
  rationale: סֶלַע dapat berarti batu besar, tebing batu, atau bukit batu. “Bukit batu” menampilkan tempat tinggi berbatu yang sesuai dengan gambaran sarang yang aman dan lebih konkret daripada sekadar “batu”.
- source_word: קִנֶּךָ
  choice: sarangmu
  rationale: Arti harfiahnya adalah “sarang”. Metafora burung yang membuat sarang di tempat berbatu dipertahankan.
theological_decisions:
- issue: Sifat profetis מָשָׁל dalam ucapan Bileam
  choice: Teks utama memakai “syairnya”, dengan penjelasan sifat profetis dalam catatan kaki.
  alternative: “ucapan nubuatnya”
  rationale: “Ucapan nubuat” sesuai dengan konteks, tetapi dapat membuat fungsi profetis lebih eksplisit daripada istilah Ibraninya sendiri. “Syair” mempertahankan bentuk sastranya, sedangkan catatan kaki menjaga kemungkinan makna profetis.
translation_notes:
  register: Bahasa dibuat modern, lugas, dan tetap puitis. Paralelisme dua baris dipertahankan. “Orang Keni” dan akhiran “-mu” menjaga penggambaran suatu bangsa melalui wakil kolektif tunggal.
