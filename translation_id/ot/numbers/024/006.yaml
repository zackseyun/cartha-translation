  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: id
  text: 'Mereka terbentang seperti lembah-lembah,

    seperti kebun-kebun di tepi sungai,

    seperti pohon-pohon gaharu[a] yang ditanam Yahweh,

    seperti pohon-pohon aras di tepi air.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu gaharu”; kata Ibrani di sini menunjuk pada pohon atau kayu harum, bukan pada kemah.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: lembah-lembah
  rationale: Kata ini dapat menunjuk pada lembah atau palung sungai yang dialiri air pada musim tertentu. “Lembah-lembah” alami dalam bahasa Indonesia dan mempertahankan gambaran bentang alam yang subur.
- source_word: נִטָּיוּ
  choice: mereka terbentang
  rationale: Bentuk dari נטה menggambarkan sesuatu yang direntangkan atau meluas. “Mereka terbentang” mempertahankan acuan jamak kepada Israel/perkemahannya dari konteks sebelumnya dan menghasilkan gambaran yang jelas.
- source_word: גַנֹּת
  choice: kebun-kebun
  rationale: Padanan langsung yang mempertahankan gambaran tempat yang ditanami dan subur.
- source_word: עֲלֵי נָהָר
  choice: di tepi sungai
  rationale: Dalam ungkapan ini, עלי menyatakan kedekatan dengan sungai. “Di tepi sungai” merupakan ungkapan Indonesia yang alami.
- source_word: אֲהָלִים
  choice: pohon-pohon gaharu
  rationale: Dalam konteks puitis ini kata tersebut menunjuk pada pohon atau kayu harum, yang lazim dikenal dalam bahasa Indonesia sebagai gaharu, bukan pada kemah.
- source_word: נָטַע
  choice: ditanam
  rationale: Bentuk aktif Ibrani dengan Yahweh sebagai pelaku diterjemahkan secara alami dalam konstruksi relatif bahasa Indonesia; pelakunya tetap dinyatakan dengan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֲרָזִים
  choice: pohon-pohon aras
  rationale: “Aras” adalah padanan baku untuk pohon cedar dan mempertahankan citra kekuatan serta kemegahan.
- source_word: עֲלֵי מָיִם
  choice: di tepi aliran air
  rationale: “Aliran air” menyampaikan secara alami gambaran air yang melimpah atau sumber-sumber air dalam bentuk jamak Ibrani tanpa menimbulkan kesan laut yang dapat muncul dari kata “perairan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi Allah dalam teks Ibrani dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan “seperti” serta susunan empat perbandingan dipertahankan. Penanda catatan kaki ditempatkan sesudah istilah yang diterangkannya.
