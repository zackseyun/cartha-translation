  terminology: “Bileam” dan “Balak” merupakan bentuk nama yang lazim dalam bahasa Indonesia. “Para utusanmu” tepat bagi konteks diplomatik manusia dan tidak menimbulkan ambiguitas tidak perlu dengan “malaikat.” Tidak ada istilah teologis yang memerlukan penyesuaian.
