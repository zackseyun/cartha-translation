lexical_decisions:
- source_word: וַיֹּאמֶר בִּלְעָם אֶל בָּלָק
  choice: Bileam berkata kepada Balak
  rationale: Wayyiqtol dari אמר merupakan bentuk naratif lazim untuk memperkenalkan ujaran langsung. Nama-nama mengikuti bentuk Indonesia yang umum.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Pertanyaan negatif ini mengharapkan jawaban ya; “Bukankah” menyampaikan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: גַּם
  choice: pun
  rationale: Partikel ini memberi penekanan tambahan pada para utusan Balak. Posisi “pun” setelah frasa sasaran terasa alami dan tetap mempertahankan penekanannya.
- source_word: מַלְאָכֶיךָ
  choice: para utusanmu
  rationale: Dalam konteks diplomatik manusia ini, מַלְאָך berarti utusan, bukan malaikat. “Para utusanmu” jelas, alami, dan sesuai dengan konteks.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: yang kauutus kepadaku
  rationale: Klausa relatif ini menerangkan para utusan. Bentuk “kauutus” ringkas dan wajar dalam ujaran langsung yang ditujukan kepada seorang raja.
- source_word: דִּבַּרְתִּי
  choice: aku sudah berkata
  rationale: Bentuk perfektif menunjuk pada ucapan terdahulu. “Sudah berkata” menyatakan aspek retrospektifnya secara alami tanpa memutus hubungan dengan isi kutipan pada ayat berikutnya.
- source_word: לֵאמֹר
  choice: ditandai dengan koma pembuka menuju kutipan lanjutan
  rationale: Infinitif ini memperkenalkan isi perkataan yang baru muncul pada ayat berikutnya. Dalam bahasa Indonesia, fungsi tersebut paling alami dinyatakan melalui verba “berkata” dan tanda baca, bukan dengan “dengan mengatakan” yang terasa kaku.
