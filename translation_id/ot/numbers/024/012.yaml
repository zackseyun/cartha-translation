  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: id
  text: Bileam berkata kepada Balak, “Bukankah kepada para utusanmu yang kauutus kepadaku pun aku sudah berkata,[a]”
  philosophy: optimal-equivalence
