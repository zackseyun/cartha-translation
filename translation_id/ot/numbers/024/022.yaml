translation:
  language: id
  text: Sebab, jika Kain[a] ditentukan untuk dibakar, berapa lama lagi sebelum Asyur[b] membawa engkau pergi sebagai tawanan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kain di sini kemungkinan besar menunjuk kepada orang Keni, bukan kepada Kain sebagai individu.
