translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nubuat yang ringkas dan bermartabat. Bentuk “engkau” dipertahankan karena sapaan tunggal dalam teks sumber, sedangkan catatan kaki menjaga kemungkinan rujukan kolektif dan geopolitik.
