  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: id
  text: 'Lalu ia mengucapkan syairnya dan berkata,

    “Pernyataan Bileam, anak Beor,

    pernyataan lelaki yang matanya tertutup.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang matanya terbuka.” Bentuk Ibrani lebih langsung menyiratkan mata yang tertutup, tetapi konteks penglihatan kenabian dan tradisi penafsiran kuno mendukung pemahaman “terbuka”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Lalu ia mengucapkan syairnya
  rationale: Ungkapan ini memperkenalkan tuturan puitis yang resmi. “Mengucapkan syairnya” mempertahankan sifat puitis מָשָׁל dan terdengar wajar dalam bahasa Indonesia.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Terjemahan langsung bentuk naratif אָמַר, sekaligus mempertahankan susunan pendahuluan dalam bahasa Ibrani.
- source_word: נְאֻם
  choice: pernyataan
  rationale: Kata ini menandai tuturan resmi atau kenabian. “Pernyataan” menjaga bobot formulanya tanpa menyamakan kata ini dengan מָשָׁל pada awal ayat.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: בְּנוֹ בְעֹר
  choice: anak Beor
  rationale: Rangkaian konstruksi ini menyatakan hubungan keturunan.
- source_word: הַגֶּבֶר
  choice: lelaki
  rationale: גֶּבֶר menunjuk kepada seorang laki-laki; “lelaki” ringkas, jelas, dan sesuai dengan gaya puitis pernyataan diri ini.
- source_word: שְׁתֻם הָעָיִן
  choice: yang matanya tertutup
  rationale: Bentuk Masoret dan arti leksikal yang lebih langsung mendukung gagasan “tertutup”. Karena frasa ini sulit dan dapat dipahami sebagai “terbuka” berdasarkan konteks penglihatan kenabian serta tradisi kuno, alternatif itu dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Makna gambaran penglihatan Bileam שְׁתֻם הָעָיִן
  choice: yang matanya tertutup
  alternative: yang matanya terbuka
  rationale: Teks utama mengikuti arti yang lebih langsung dari bentuk Ibrani tanpa menyelaraskannya secara diam-diam dengan konteks penglihatan kenabian. Pembacaan alternatif dipertahankan dalam catatan kaki agar ketaksaan tekstual tetap transparan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Baris-baris puitis mempertahankan pengulangan formula נְאֻם serta irama tuturan Bileam tanpa memakai istilah denominasi tertentu.
