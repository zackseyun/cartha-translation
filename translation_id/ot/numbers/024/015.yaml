  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: id
  text: 'Lalu ia menyampaikan ucapan puitisnya dan berkata:


    “Pernyataan Bileam, anak Beor,


    pernyataan orang yang matanya terbuka[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang matanya tertutup/terpejam.” Ungkapan Ibrani ini sulit dan telah dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Lalu ia mengucapkan sajaknya
  rationale: Gabungan נשׂא dengan מָשָׁל merupakan ungkapan untuk memulai tuturan puitis resmi. 'Mengucapkan sajaknya' menyampaikan fungsi idiom itu secara wajar dan mempertahankan bentuk puitis perkataan Bileam.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: Bentuk naratif ini memperkenalkan kutipan langsung; 'katanya' ringkas dan alami setelah klausa pembuka.
- source_word: נְאֻם
  choice: pernyataan
  rationale: Kata ini menandai tuturan yang khidmat dan berwibawa. 'Pernyataan' mempertahankan corak resmi tanpa bahasa yang usang, dan dipakai konsisten pada kedua kemunculannya.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Bileam anak Beor
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sedangkan patronimik diterjemahkan langsung.
- source_word: הַגֶּבֶר
  choice: orang
  rationale: Dalam konteks ini גֶּבֶר menunjuk kepada seorang laki-laki; 'orang' paling alami dalam formula pengenalan diri ini tanpa menambahkan gagasan kekuatan yang tidak ditonjolkan.
- source_word: שְׁתֻם הָעָיִן
  choice: yang matanya terbuka
  rationale: Ungkapan Ibrani ini sulit. Konteks penglihatan ilahi, terutama ayat berikutnya, mendukung pengertian persepsi yang dibukakan. Karena bentuk katanya juga dapat dipahami sebagai mata yang tertutup, alternatif itu dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna gambaran diri Bileam, שְׁתֻם הָעָיִן
  choice: yang matanya terbuka
  alternative: yang matanya tertutup/terpejam
  rationale: Konteks dekat menggambarkan Bileam menerima penglihatan Allah dan matanya tersingkap, sehingga bacaan 'terbuka' cocok secara sastra. Namun, karena ungkapan Ibraninya memang diperdebatkan, kemungkinan sebaliknya tidak dihapus dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan baris mempertahankan watak puitis serta pengulangan formula נְאֻם. Istilah 'sajak' dipilih untuk מָשָׁל sebagai tuturan puitis resmi, bukan sebagai perumpamaan.
