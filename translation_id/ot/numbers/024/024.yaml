id: NUM.24.24
reference: Numbers 24:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: id
  text: Namun kapal-kapal akan datang dari arah Kitim[a]. Mereka akan menindas Asyur[b] dan menindas Eber[c]; dia[d] pun akan berakhir dalam kebinasaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitim dapat menunjuk secara khusus pada Siprus atau secara lebih luas pada bangsa-bangsa maritim di sebelah barat.
    reason: alternative_reading
  - marker: b
    text: Asyur dapat menunjuk pada bangsa atau negeri Asyur.
    reason: lexical_alternative
  - marker: c
    text: Eber dapat menunjuk pada Eber sebagai nama bangsa, pada orang Ibrani, atau pada bangsa-bangsa yang berada “di seberang” suatu batas, misalnya Sungai Efrat.
    reason: alternative_reading
  - marker: d
    text: Teks Ibrani memakai kata ganti tunggal maskulin, “dia pun”. Acuannya tidak pasti; sebagian orang memahaminya secara kolektif sebagai kekuatan dari Kitim atau sebagai penguasa yang mewakilinya.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: kapal-kapal
  rationale: Kata ini menunjuk pada kapal laut dan dipakai secara kolektif. Bentuk jamak dalam bahasa Indonesia menyampaikan makna itu secara alami tanpa menambahkan gagasan khusus tentang armada perang.
- source_word: מִיַּד
  choice: dari arah
  rationale: Secara harfiah berarti 'dari tangan/sisi', tetapi dalam ungkapan geografis menunjuk pada arah atau kawasan asal. 'Dari arah' alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada garis pantai.
- source_word: כִּתִּים
  choice: Kitim
  rationale: Nama ini dipertahankan dalam bentuk transliterasi karena dapat menunjuk secara khusus pada Siprus atau secara lebih luas pada bangsa-bangsa maritim di sebelah barat.
- source_word: וְעִנּוּ
  choice: mereka akan menindas
  rationale: Bentuk piel dari ענה dapat berarti menindas, merendahkan, atau membuat menderita. 'Menindas' mempertahankan unsur penaklukan dan penderitaan tanpa menentukan caranya.
- source_word: אַשּׁוּר
  choice: Asyur
  rationale: Asyur adalah bentuk nama yang lazim dalam bahasa Indonesia dan tetap dapat menunjuk pada leluhur, bangsa, atau wilayah, sesuai konteks.
- source_word: עֵבֶר
  choice: Eber
  rationale: Transliterasi mempertahankan ketidakpastian apakah yang dimaksud ialah Eber sebagai nama bangsa, orang Ibrani, atau bangsa-bangsa di seberang suatu batas.
- source_word: וְגַם הוּא
  choice: dia pun
  rationale: Kata ganti Ibrani berbentuk tunggal maskulin. 'Dia pun' mencerminkan tata bahasanya tanpa menetapkan siapa acuannya.
- source_word: עֲדֵי אֹבֵד
  choice: akan berakhir dalam kebinasaan
  rationale: Ungkapan ini menyatakan gerak atau hasil akhir menuju kebinasaan. Terjemahan ini alami dan tidak menambahkan gagasan tentang hukuman kekal yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Identitas Kitim, Asyur, Eber, dan acuan kata ganti tunggal pada akhir ayat
  choice: Nama Kitim, Asyur, dan Eber dipertahankan, sedangkan kata ganti terakhir diterjemahkan dalam bentuk tunggal 'dia' tanpa menentukan tokoh atau kekuasaan historis tertentu.
  alternative: Kitim dapat ditafsirkan sebagai Siprus atau kekuatan maritim barat; Asyur sebagai negeri Asyur; Eber sebagai orang Ibrani atau bangsa-bangsa di seberang Sungai Efrat; kata ganti terakhir dapat dipahami secara kolektif sebagai Kitim atau sebagai penguasanya.
  rationale: Nubuat ini memiliki sejumlah identifikasi historis yang diperdebatkan. Terjemahan mempertahankan ketegangan dan ketidakjelasan yang benar-benar terdapat dalam teks Ibrani, bukan menyelesaikannya melalui tafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara nama-nama dan kata ganti yang ambigu tetap dipertahankan. Pengulangan 'menindas' mengikuti penekanan paralel dalam teks Ibrani.
