revisions:
- from: Sekarang, lihatlah, aku hendak pergi kepada bangsaku. Mari, aku akan menasihati engkau tentang apa yang akan dilakukan bangsa ini kepada bangsamu[b] pada hari-hari terakhir[a].
  to: Sekarang, lihatlah, aku hendak pergi kepada bangsaku. Mari, aku akan memberi nasihat kepadamu tentang apa yang akan dilakukan bangsa ini terhadap bangsamu[b] pada hari-hari terakhir[a].
  rationale: Revisi terbatas pada padanan preposisi untuk menghasilkan sintaksis Indonesia yang wajar dan jelas. Pilihan ‘terhadap’ tidak menambahkan rincian tindakan ataupun memaksakan penafsiran doktrinal; kemungkinan padanan literal ‘kepada’ dan implikasi kontekstualnya dipelihara dalam catatan kaki.
