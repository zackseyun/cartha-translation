  source_fidelity: 'Terjemahan mempertahankan unsur-unsur utama teks Ibrani: penanda waktu, penegasan הִנְנִי, kepergian Bileam kepada bangsanya, ajakan לְכָה, pemberian nasihat, tindakan masa depan oleh ‘bangsa ini’, dan cakrawala בְּאַחֲרִית הַיָּמִים. Namun, ‘dilakukan ... kepada bangsamu’ tidak wajar dalam bahasa Indonesia untuk tindakan yang diprediksikan terhadap suatu kelompok dan kurang jelas menyampaikan hubungan sintaktis yang dimaksud. ‘Terhadap bangsamu’ adalah padanan Indonesia yang alami tanpa harus menyatakan jenis tindakan secara lebih spesifik daripada sumber.'
