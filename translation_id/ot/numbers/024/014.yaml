source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: id
  text: Sekarang, lihatlah, aku hendak pergi kepada bangsaku. Mari, aku akan memberi nasihat kepadamu tentang apa yang akan dilakukan bangsa ini terhadap bangsamu[b] pada hari-hari terakhir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di kemudian hari” atau “pada hari-hari yang akan datang.” Ungkapan Ibrani ini dapat menunjuk secara luas pada masa depan, meskipun “pada hari-hari terakhir” mempertahankan bobot profetisnya.
    reason: alternative_reading
  - marker: b
    text: Atau, “kepada bangsamu.” Preposisi Ibraninya secara harfiah dapat berarti “kepada bangsamu”; dalam konteks ini, frasa itu dapat menunjuk pada bangsamu sebagai pihak yang terkena tindakan, bahkan tindakan yang bersifat bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana temporal ini memperkenalkan pernyataan Bileam berikutnya. Dalam bahasa Indonesia, “Sekarang” sudah menyampaikan peralihan tersebut secara alami tanpa perlu mempertahankan waw secara mekanis.
- source_word: הִנְנִי
  choice: lihatlah, aku
  rationale: Partikel deiktis ini memberi penekanan pada keadaan atau tindakan pembicara yang segera terjadi. “Lihatlah” mempertahankan penekanan yang ditandai dalam bahasa Ibrani.
- source_word: הוֹלֵךְ
  choice: hendak pergi
  rationale: Partisipel Qal menyatakan tindakan yang segera dilakukan. “Hendak pergi” alami dalam bahasa Indonesia dan mempertahankan nuansa imminennya.
- source_word: לְעַמִּי
  choice: kepada bangsaku
  rationale: Frasa ini menunjuk pada kepulangan Bileam kepada kelompok bangsanya sendiri tanpa menambahkan identitas etnis yang tidak dinyatakan di sini.
- source_word: לְכָה
  choice: Mari
  rationale: Imperatif ini berfungsi secara idiomatis sebagai ajakan untuk memperhatikan atau melanjutkan percakapan. “Mari” alami dan sesuai dengan fungsi wacananya.
- source_word: אִיעָצְךָ
  choice: aku akan menasihati engkau
  rationale: Kata kerja יעץ pada dasarnya berarti memberi nasihat atau pertimbangan. Terjemahan ini mempertahankan arti leksikalnya, meskipun isi nasihat berikutnya berbentuk nubuat tentang tindakan yang akan terjadi.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: tentang apa yang akan dilakukan
  rationale: Klausa relatif ini menyatakan isi nasihat Bileam. Bentuk “apa yang akan dilakukan” alami dalam bahasa Indonesia dan mempertahankan orientasi ke masa depan.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם adalah nomina kolektif tunggal. “Bangsa ini” menjaga bentuk kolektif dan cocok dengan konteks hubungan antarkelompok.
- source_word: לְעַמְּךָ
  choice: kepada bangsamu
  rationale: Preposisi ל secara harfiah menyatakan arah atau pihak yang terkena tindakan. “Kepada” mempertahankan bentuk sumber, sementara konteks tetap memungkinkan tindakan yang bersifat bermusuhan.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: pada hari-hari terakhir
  rationale: Ungkapan Ibrani ini menunjuk pada suatu masa mendatang dan dapat membawa bobot profetis, tetapi tidak selalu menuntut skema akhir zaman yang terperinci. Pilihan ini mempertahankan idiom dan ketegangannya.
theological_decisions:
- issue: Jangkauan waktu profetis dalam בְּאַחֲרִית הַיָּמִים
  choice: pada hari-hari terakhir
  alternative: di kemudian hari / pada hari-hari yang akan datang
  rationale: Ungkapan itu dapat menunjuk secara luas pada masa depan sekaligus membawa kemungkinan nuansa eskatologis. Terjemahan utama mempertahankan bobot profetisnya, sedangkan catatan kaki mencegah pembaca menganggap bahwa frasa tersebut selalu berarti akhir sejarah dalam arti teknis.
- issue: Sifat tindakan bangsa Israel terhadap bangsa Balak
  choice: kepada bangsamu
  alternative: terhadap bangsamu / melawan bangsamu
  rationale: Bahasa Ibrani memakai preposisi ל, bukan penanda permusuhan yang eksplisit. Terjemahan utama mempertahankan bentuk relasional itu, sedangkan catatan kaki mengakui bahwa konteks nubuat dapat menyiratkan tindakan bermusuhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku/engkau” dipakai untuk dialog langsung sesuai register naratif Alkitab. Susunan kalimat dijaga cukup dekat dengan bahasa Ibrani, tetapi dibuat alami bagi pembaca Indonesia masa kini.
