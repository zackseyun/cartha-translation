  terminology: ‘Bangsa ini’, ‘bangsaku’, dan ‘pada hari-hari terakhir’ tepat. Ungkapan terakhir dipertahankan karena mencerminkan bobot profetis אֲחֲרִית הַיָּמִים, sementara catatan kaki secara tepat mencatat cakupan masa depan yang lebih luas. Catatan untuk לְעַמְּךָ perlu diselaraskan dengan terjemahan utama yang direvisi.
