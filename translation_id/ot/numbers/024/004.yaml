  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: id
  text: 'ucapan khidmat orang yang mendengar perkataan Allah[a],

    yang melihat penglihatan Yang Mahakuasa,

    yang rebah dengan mata tersingkap[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ucapan orang yang mendengar perkataan Allah.” Kata Ibrani נְאֻם adalah istilah resmi dalam bahasa kenabian untuk suatu ucapan atau pernyataan yang khidmat.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan mata terbuka.” Secara harfiah, “dengan mata tersingkap”; ungkapan ini mempertahankan gambaran tentang penglihatan yang tidak lagi terselubung.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: tutur
  rationale: Kata ini merupakan istilah pengantar kenabian untuk ucapan yang khidmat. “Tutur” mempertahankan bentuk nominal dan nuansa puitis tanpa memberi kesan ramalan gaib yang dapat muncul dari kata “orakel”.
- source_word: שֹׁמֵעַ
  choice: orang yang mendengar
  rationale: Partisipel ini berfungsi sebagai nomina dan menggambarkan orang tersebut berdasarkan tindakannya mendengar; bentuk Indonesia ini alami dan tetap mencerminkan ciri yang sedang atau terus berlaku.
- source_word: אִמְרֵי אֵל
  choice: perkataan Allah
  rationale: Bentuk jamak konstruksi אִמְרֵי berarti perkataan atau ucapan. “Perkataan Allah” jelas dan wajar dalam bahasa Indonesia, sedangkan אֵל dipahami di sini sebagai sebutan ilahi, bukan nama diri.
- source_word: מַחֲזֵה שַׁדַּי
  choice: penglihatan dari Yang Mahakuasa
  rationale: מַחֲזֵה menunjuk pada penglihatan yang bersifat pewahyuan. Kata “dari” menyampaikan bahwa penglihatan itu berasal dari Yang Mahakuasa dan menghasilkan ungkapan Indonesia yang alami.
- source_word: יֶחֱזֶה
  choice: melihat
  rationale: Walaupun berupa imperfek, verba ini dalam uraian diri yang puitis menyatakan pengalaman atau ciri yang berlaku, sejajar dengan “mendengar”.
- source_word: נֹפֵל
  choice: rebah
  rationale: Partisipel ini menggambarkan keadaan atau gerakan tubuh dalam pengalaman pewahyuan. “Rebah” mempertahankan ketidakpastian apakah ia sedang jatuh atau telah terbaring, tanpa mempersempitnya menjadi sikap sujud.
- source_word: וּגְלוּי עֵינָיִם
  choice: tetapi matanya tersingkap
  rationale: Secara harfiah ungkapan ini menggambarkan mata yang tidak tertutup atau terselubung. “Tersingkap” mempertahankan citra pewahyuan, sedangkan “tetapi” menyatakan kontras kontekstual dengan keadaan rebah.
theological_decisions:
- issue: Penerjemahan שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Shaddai
  rationale: Dalam konteks ini שַׁדַּי merupakan gelar ilahi. Menerjemahkannya sebagai “Yang Mahakuasa” menyampaikan fungsi gelar itu bagi pembaca Indonesia tanpa menjadikannya nama diri.
- issue: Hubungan antara keadaan rebah dan mata yang tersingkap
  choice: yang rebah, tetapi matanya tersingkap
  alternative: yang rebah dan matanya tersingkap
  rationale: Bahasa Ibrani memakai penghubung umum ו, tetapi susunan puitisnya menampilkan kontras antara tubuh yang rebah dan mata yang tetap mampu melihat secara pewahyuan. “Tetapi” mengungkapkan hubungan kontekstual itu tanpa menjelaskan penyebab atau sifat pengalaman tersebut.
translation_notes:
  register: Bahasa puitis, khidmat, dan mudah dipahami. Susunan baris mempertahankan kesejajaran tiga klausa Ibrani. “Tutur” dipilih sebagai formula pembuka yang ringkas dan bermartabat; “tersingkap” mempertahankan metafora pewahyuan tanpa menerangkannya secara denominatif.
