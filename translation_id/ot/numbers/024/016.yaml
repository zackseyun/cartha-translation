revisions:
- from: 'firman dari orang yang mendengar perkataan-perkataan Allah[a], dan yang mengetahui pengetahuan Yang Mahatinggi, yang melihat penglihatan dari Yang Mahakuasa, rebah[b], tetapi matanya tersingkap:'
  to: 'Ucapan orang yang mendengar perkataan Allah[a], yang mengetahui pengetahuan Yang Mahatinggi, yang melihat penglihatan Yang Mahakuasa, rebah[b], tetapi dengan mata tersingkap:'
  rationale: Revisi mengganti “firman dari” dengan “Ucapan” untuk menerjemahkan formula נְאֻם secara setia tanpa konotasi bahwa Allah sendiri menjadi penutur. “Perkataan Allah” dibuat lebih idiomatis dalam bahasa Indonesia. Relasi padat dalam “penglihatan Yang Mahakuasa” dipertahankan tanpa menambahkan arah “dari,” dan penutup dihaluskan menjadi “dengan mata tersingkap.” Catatan kaki a diperbarui agar alternatifnya mencakup formula keseluruhan secara tepat; catatan b mempertahankan alternatif dan penafsiran yang diperselisihkan di luar teks utama.
