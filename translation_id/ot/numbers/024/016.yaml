  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: id
  text: 'Ucapan orang yang mendengar perkataan Allah[a], yang mengetahui pengetahuan Yang Mahatinggi, yang melihat penglihatan Yang Mahakuasa, rebah[b], tetapi dengan mata tersingkap:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ucapan orang yang mendengar ucapan-ucapan Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “rebah dengan mata tersingkap”; sebagian orang memahaminya sebagai keadaan ekstase dalam menerima penglihatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: firman dari
  rationale: Menandai ucapan kenabian yang khidmat. Dalam konteks formula puitis ini, “firman dari” alami dan berbobot, tanpa menjadikannya seolah-olah perkataan Allah sendiri.
- source_word: שֹׁמֵעַ
  choice: orang yang mendengar
  rationale: Partisipel Qal yang berfungsi substantival; bentuk ini mempertahankan sifat yang sedang atau terus berlangsung.
- source_word: אִמְרֵי אֵל
  choice: perkataan-perkataan Allah
  rationale: Bentuk jamak konstruksi menunjuk kepada ucapan-ucapan Allah; pengulangan “perkataan-perkataan” mempertahankan bentuk jamak dan corak puitis.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: dan yang mengetahui pengetahuan Yang Mahatinggi
  rationale: 'Mempertahankan susunan padat dan ambiguitas genitif Ibrani: pengetahuan yang dimiliki, berkaitan dengan, atau diberikan oleh Yang Mahatinggi.'
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Padanan baku bagi gelar ilahi dengan daya superlatif.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: yang melihat penglihatan dari Yang Mahakuasa
  rationale: Mencerminkan pengulangan akar penglihatan dalam bahasa Ibrani dan menghubungkan klausa verbal dengan rangkaian deskripsi orang tersebut.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi diterjemahkan menurut maknanya, bukan ditransliterasikan.
- source_word: נֹפֵל
  choice: rebah
  rationale: Mempertahankan gambaran harfiah tentang jatuh atau terbaring tanpa memasukkan tafsiran keadaan ekstase ke dalam teks utama.
- source_word: וּגְלוּי עֵינָיִם
  choice: tetapi matanya tersingkap
  rationale: Mempertahankan citra harfiah mata yang tersingkap; “tetapi” menyatakan hubungan kontras yang wajar dengan keadaan rebah.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל, עֶלְיוֹן, dan שַׁדַּי
  choice: Allah / Yang Mahatinggi / Yang Mahakuasa
  alternative: El / Elyon / Shaddai
  rationale: Dalam ayat ini bentuk-bentuk tersebut berfungsi sebagai sebutan atau gelar ilahi; penerjemahan menyampaikan maknanya secara langsung kepada pembaca Indonesia.
- issue: Keadaan נֹפֵל dalam pengalaman penglihatan
  choice: rebah
  alternative: dalam keadaan ekstase
  rationale: Teks Ibrani secara langsung menyebut tindakan atau keadaan jatuh/rebah. Penafsiran sebagai keadaan ekstase mungkin, tetapi tidak boleh menggantikan ungkapan sumber dalam teks utama.
- issue: Hubungan דַּעַת dengan עֶלְיוֹן
  choice: pengetahuan Yang Mahatinggi
  alternative: pengetahuan dari Yang Mahatinggi
  rationale: Konstruksi Ibrani dapat menyatakan pengetahuan milik atau tentang Yang Mahatinggi, maupun pengetahuan yang berasal dari-Nya. Bentuk ringkas mempertahankan ketegangan semantis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Paralelisme rangkaian klausa dipertahankan, sedangkan istilah interpretatif seperti “ekstase” ditempatkan dalam catatan kaki agar ambiguitas sumber tidak hilang.
