  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: id
  text: Lalu Bileam mengangkat matanya dan melihat Israel berkemah menurut suku-sukunya, dan Roh Allah datang atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Roh Allah ada padanya”; mungkin juga, “roh dari Allah ada padanya.”
    reason: Mempertahankan kemungkinan pembacaan yang lebih statis untuk וַתְּהִי עָלָיו serta ketidakpastian tingkat ketentuan dalam frasa רוּחַ אֱלֹהִים.
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: mengangkat matanya
  rationale: Mempertahankan ungkapan Ibrani yang berarti mengarahkan pandangan ke atas atau memandang, dan tetap mengungkapkan unsur eksplisit 'matanya'.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Padanan langsung bagi verba ראה yang menyatakan apa yang diamati Bileam.
- source_word: שֹׁכֵן
  choice: berkemah
  rationale: Dalam konteks Israel yang tersusun menurut suku-suku di padang gurun, bentuk partisip ini secara alami menunjuk pada keadaan menetap dalam perkemahan; 'berkemah' lebih wajar dalam bahasa Indonesia daripada 'berdiam' tanpa menjadikannya gambaran militer.
- source_word: לִשְׁבָטָיו
  choice: menurut suku-sukunya
  rationale: Preposisi ל menunjukkan susunan atau pembagian berdasarkan suku; akhiran tunggal merujuk kepada Israel sebagai kesatuan kolektif.
- source_word: וַתְּהִי עָלָיו
  choice: turun atasnya
  rationale: Mengungkapkan secara alami kehadiran yang mulai meliputi atau memperlengkapi Bileam dalam konteks nubuat, meskipun secara lebih harfiah dapat diterjemahkan 'ada padanya'.
- source_word: רוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Dalam konteks ucapan nubuat, frasa ini paling wajar menunjuk kepada Roh yang berasal dari atau merupakan milik Allah. Huruf kapital mengikuti kebiasaan bahasa Indonesia bagi sebutan ilahi tanpa menambahkan rincian doktrinal yang tidak dinyatakan ayat.
theological_decisions:
- issue: Makna רוּחַ אֱלֹהִים dalam konteks Bileam menyampaikan nubuat
  choice: Roh Allah
  alternative: roh Allah / roh dari Allah
  rationale: Konteks mendukung kehadiran ilahi yang memperlengkapi Bileam untuk bernubuat. Namun, karena bahasa Ibrani tidak memakai kata sandang dan bentuk וַתְּהִי עָלָיו secara harfiah dapat bersifat statis, catatan kaki mempertahankan kemungkinan terjemahan yang kurang menentukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti rangkaian naratif Ibrani, sedangkan 'berkemah menurut suku-sukunya' menyampaikan penataan perkemahan secara alami. Penanda catatan kaki ditempatkan tepat sesudah klausa yang dijelaskannya.
