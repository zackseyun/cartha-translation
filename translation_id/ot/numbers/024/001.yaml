language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: id
  text: Ketika Bileam melihat bahwa Yahweh berkenan memberkati Israel, ia tidak pergi, seperti pada waktu-waktu sebelumnya, untuk mencari pertanda-pertanda[a], tetapi mengarahkan wajahnya ke padang gurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “untuk menemui pertanda-pertanda” atau “untuk menjumpai tanda-tanda ramalan.” Ungkapan Ibrani ini menunjuk pada kebiasaan Bileam sebelumnya dalam mencari pertanda melalui praktik ramalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Mempertahankan verba dasar ראה dan idiom Ibrani, sambil dalam konteks menyiratkan bahwa Bileam memahami atau menyadari apa yang dilihatnya.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: bahwa Yahweh berkenan
  rationale: Ungkapan harfiah 'baik di mata Yahweh' menyatakan sesuatu yang menyenangkan atau diterima oleh-Nya. 'Yahweh berkenan' menyampaikan makna idiomatis itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, alih-alih menggantinya dengan gelar.
- source_word: לְבָרֵךְ
  choice: memberkati
  rationale: Padanan langsung dan wajar bagi infinitif ברך dalam konteks ini.
- source_word: וְלֹא הָלַךְ
  choice: ia tidak pergi
  rationale: Menerjemahkan verba umum הלך secara langsung dan mempertahankan urutan narasi.
- source_word: כְּפַעַם בְּפַעַם
  choice: seperti pada waktu-waktu sebelumnya
  rationale: Mengungkapkan kebiasaan yang berulang pada kesempatan terdahulu tanpa mengikuti susunan Ibrani secara kaku.
- source_word: לִקְרַאת נְחָשִׁים
  choice: untuk mencari pertanda
  rationale: נְחָשִׁים merujuk pada pertanda atau praktik tenung, bukan ular. Dalam konteks, frasa ini menggambarkan tindakan Bileam yang pergi untuk memperoleh tanda-tanda ramalan.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: menghadapkan wajahnya
  rationale: Mempertahankan citra idiom Ibrani tentang tindakan sengaja mengarahkan diri ke suatu tempat, tetapi dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: אֶל הַמִּדְבָּר
  choice: ke arah padang gurun
  rationale: מִדְבָּר menunjuk kawasan liar atau gurun; 'padang gurun' merupakan padanan Indonesia yang lazim, dan 'ke arah' menyampaikan orientasi geraknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. Bentuk 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Sikap Yahweh terhadap berkat bagi Israel
  choice: Yahweh berkenan memberkati Israel
  alternative: memberkati Israel itu baik di mata Yahweh
  rationale: Pilihan ini menerjemahkan idiom כִּי טוֹב בְּעֵינֵי יְהוָה secara alami tanpa menambahkan alasan teologis atau mengubah Israel sebagai penerima berkat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara citra 'menghadapkan wajah' dipertahankan untuk mencerminkan kesengajaan dalam idiom sumber.
