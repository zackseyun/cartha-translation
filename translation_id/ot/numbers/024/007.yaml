base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: id
  text: Air akan mengalir dari timba-timbanya[a], dan benihnya[b] akan berada dalam air yang melimpah; rajanya akan lebih tinggi daripada Agag, dan kerajaannya akan ditinggikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “dari cabang-cabangnya,” jika kata ini dipahami secara metaforis dan bukan menurut arti lazimnya, “timba-timba.”
    reason: lexical_alternative
  - marker: b
    text: “Benihnya” juga dapat dipahami sebagai “keturunannya” atau “anak cucunya”; kata Ibrani ini dapat menggemakan sekaligus gambaran keturunan dan kesuburan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: akan mengalir
  rationale: Kata kerja ini menggambarkan air yang mengalir atau menetes. Dalam konteks kelimpahan, “mengalir” alami dalam bahasa Indonesia dan tidak memperlemah gambaran tersebut.
- source_word: מַיִם
  choice: Air
  rationale: Bentuk Ibraninya jamak, tetapi “air” sebagai nomina massa merupakan ungkapan Indonesia yang paling wajar.
- source_word: מִדָּלְיוֹ
  choice: dari timba-timbanya
  rationale: דְּלִי lazimnya berarti timba atau ember untuk mengambil air. “Timba” mempertahankan arti konkret dan cocok dengan gambaran air; kemungkinan metaforis dicatat dalam catatan kaki.
- source_word: וְזַרְעוֹ
  choice: dan benihnya
  rationale: זֶרַע dapat berarti benih maupun keturunan. “Benih” mempertahankan keluasan makna dan memungkinkan gema kesuburan serta keturunan tetap hadir.
- source_word: בְּמַיִם רַבִּים
  choice: di tengah air yang melimpah
  rationale: Frasa ini secara harfiah mengandung preposisi ב dan “air yang banyak.” “Di tengah air yang melimpah” mempertahankan hubungan lokatif sekaligus menyampaikan kelimpahan secara alami.
- source_word: וְיָרֹם מֵאֲגַג
  choice: akan lebih tinggi daripada Agag
  rationale: רוּם menyatakan ketinggian atau keluhuran, sedangkan מִן di sini bersifat komparatif. Terjemahan ini mempertahankan perbandingan langsung dengan Agag.
- source_word: מַלְכּוֹ
  choice: rajanya
  rationale: מֶלֶךְ berarti raja. Bentuk posesif dipertahankan tanpa menentukan identitas raja yang tidak disebutkan oleh ayat.
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  choice: dan kerajaannya akan ditinggikan
  rationale: Bentuk verba pasif/refleksif ini menyatakan diangkat atau ditinggikan, sedangkan מַלְכוּת dapat berarti kerajaan, pemerintahan, atau kekuasaan raja. “Kerajaan” paling alami dan tetap mencakup ranah politik.
theological_decisions:
- issue: Rujukan dan cakupan makna זַרְעוֹ
  choice: Diterjemahkan “benihnya” tanpa membatasi makna pada benih harfiah atau keturunan.
  alternative: “keturunannya” atau “anak cucunya”
  rationale: Puisi Ibrani dapat memadukan gambaran kesuburan tanah dan banyaknya keturunan. Terjemahan utama mempertahankan ambiguitas tersebut.
- issue: Identitas “rajanya” dan hubungannya dengan Agag
  choice: Identitas raja tidak ditentukan; perbandingan dengan Agag diterjemahkan sebagaimana bunyi teks.
  alternative: Menjelaskannya sebagai Saul, Daud, Mesias, atau raja Israel tertentu
  rationale: Teks menyatakan keunggulan raja Israel tetapi tidak secara eksplisit mengidentifikasi raja itu. Penafsiran historis atau mesianik tidak dimasukkan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. Bentuk “timba-timbanya” mempertahankan bentuk jamak distributif sumber; “benihnya” sengaja menjaga ambiguitas leksikal. Semua penanda catatan kaki muncul dalam teks utama.
