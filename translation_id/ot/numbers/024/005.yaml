  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: id
  text: Betapa baiknya kemah-kemahmu, hai Yakub, dan tempat-tempat tinggalmu, hai Israel!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: Betapa
  rationale: Di sini מַה membuka seruan kekaguman, bukan pertanyaan. “Betapa” menyampaikan daya seru itu secara alami dalam bahasa Indonesia.
- source_word: טֹּבוּ
  choice: indah
  rationale: טוֹב mencakup makna baik, menyenangkan, dan elok. Dalam seruan puitis tentang perkemahan Israel, “indah” terdengar alami dan menyampaikan kekaguman, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: אֹהָלֶיךָ
  choice: kemah-kemahmu
  rationale: אֹהֶל biasanya berarti kemah. Bentuk ulang menyatakan jamak dengan jelas dan sesuai dengan gambaran perkemahan Israel.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama ini ditransliterasikan menurut bentuk baku bahasa Indonesia dan di sini menjadi sebutan puitis bagi umat Israel.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: tempat-tempat kediamanmu
  rationale: מִשְׁכָּן dapat berarti tempat tinggal atau kediaman. Pilihan ini mempertahankan kesejajaran dengan “kemah-kemahmu” tanpa memberi kesan khusus tentang Kemah Suci.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama ini ditransliterasikan menurut bentuk baku bahasa Indonesia dan, sejajar dengan “Yakub,” menyapa umat itu secara puitis.
theological_decisions:
- issue: Apakah istilah tradisional yang berkonotasi tempat ibadah perlu dipertahankan
  choice: Menggunakan “kemah-kemah” dan “tempat-tempat kediaman”
  alternative: Menggunakan istilah yang dapat dipahami sebagai Kemah Suci atau tabernakel
  rationale: Konteksnya adalah perkemahan dan tempat tinggal Israel, bukan secara khusus tempat kudus. Pilihan ini menghindari masuknya asosiasi kultis yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa puitis yang modern dan bermartabat. “Betapa” serta tanda seru mempertahankan nada kagum; sapaan “hai” menjaga bentuk puitis tanpa terdengar terlalu kuno.
