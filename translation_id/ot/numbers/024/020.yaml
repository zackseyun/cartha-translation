base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: id
  text: "Kemudian ia melihat Amalek, lalu menyampaikan ucapannya[a] dan berkata:\n\n“Amalek adalah yang pertama di antara bangsa-bangsa,[b]\n tetapi kesudahannya adalah kebinasaan total.”[c]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyampaikan ucapan nubuatnya” atau “mengucapkan peribahasanya”; istilah Ibrani ini dapat berarti ujaran puitis, peribahasa, sindiran, atau ucapan kenabian.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang terutama di antara bangsa-bangsa”; frasa Ibrani ini dapat menunjuk pada yang pertama dalam waktu atau yang terkemuka dalam kedudukan.
    reason: lexical_alternative
  - marker: c
    text: Atau “kesudahannya ialah binasa” atau “akhirnya adalah kebinasaan”; ungkapan Ibraninya ringkas dan menekankan kehancuran yang tuntas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: Kemudian ia melihat Amalek
  rationale: Bentuk waw-konsekutif melanjutkan urutan kisah, sedangkan ראה secara lugas berarti ‘melihat’. ‘Kemudian’ menghasilkan urutan alami dalam bahasa Indonesia.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: lalu mengucapkan syairnya
  rationale: Ungkapan harfiah ‘mengangkat mashal-nya’ berarti mulai menyampaikan suatu tuturan puitis. מָשָׁל dapat menunjuk pada peribahasa, syair, sindiran, atau ucapan kenabian; ‘syair’ sesuai dengan bentuk puitis perkataan Bileam tanpa terlalu mempersempit genrenya.
- source_word: רֵאשִׁית גּוֹיִם
  choice: yang pertama di antara bangsa-bangsa
  rationale: רֵאשִׁית dapat berarti yang pertama dalam waktu atau yang terutama dalam kedudukan. Rumusan Indonesia ini cukup alami dan tetap membuka kedua kemungkinan tersebut.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama diri ditransliterasikan secara lazim; dalam konteks ini nama tersebut mewakili bangsa Amalek.
- source_word: וְאַחֲרִיתוֹ
  choice: tetapi kesudahannya
  rationale: אַחֲרִית menunjuk pada akhir, hasil akhir, atau nasib kemudian. ‘Tetapi’ menyatakan pertentangan yang tersirat antara kedudukan awal Amalek dan akhir hidupnya.
- source_word: עֲדֵי אֹבֵד
  choice: adalah kebinasaan total
  rationale: Ungkapan Ibrani ini ringkas dan eliptis, dengan gagasan menuju kebinasaan atau lenyap sama sekali. ‘Kebinasaan total’ menyampaikan finalitasnya tanpa menambahkan gagasan ‘selama-lamanya’ yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna kedudukan Amalek dalam רֵאשִׁית גּוֹיִם
  choice: Mempertahankan kemungkinan bahwa Amalek adalah yang pertama dalam waktu ataupun yang terutama dalam kedudukan.
  alternative: Menerjemahkan secara tegas ‘bangsa yang paling awal’ atau ‘bangsa yang terutama’.
  rationale: Teks Ibrani tidak memastikan apakah yang dimaksud ialah prioritas kronologis atau keunggulan. Terjemahan utama dan catatan kaki mempertahankan ketegangan tersebut tanpa memasukkan kesimpulan historis atau teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. ‘Mengucapkan syairnya’ alami dalam konteks rangkaian perkataan puitis Bileam. Pronomina ‘ia’ dan sufiks ‘-nya’ dibiarkan mengikuti bentuk gramatikal teks, sementara ‘Amalek’ dipahami sebagai nama bangsa. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
