  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: id
  text: 'Lalu ia menyampaikan ucapannya[a], katanya,


    “Aduh! Siapa yang dapat tetap hidup ketika Allah melakukan ini?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ucapannya” juga dapat diterjemahkan “nubuatnya”, “peribahasanya”, atau “perumpamaannya”.
    reason: lexical_alternative
  - marker: b
    text: Klausa Ibrani terakhir sulit dipahami. Terjemahan lain yang mungkin ialah “ketika Allah menetapkan hal ini” atau, dengan pembagian sintaksis yang berbeda, “ketika Dia menegakkan hal ini, ya Allah”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: ia menyampaikan ucapannya
  rationale: Gabungan נָשָׂא dan מָשָׁל merupakan ungkapan untuk menyampaikan suatu perkataan puitis atau nubuat. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi perumpamaan saja.
- source_word: אֹוי
  choice: Aduh!
  rationale: Kata seru ini menyatakan ratapan atau kengerian. “Aduh!” mempertahankan nada emosionalnya tanpa harus menjadikannya rumusan penghukuman formal.
- source_word: מִי יִחְיֶה
  choice: Siapa yang dapat tetap hidup
  rationale: Secara harfiah berarti “siapa yang akan hidup,” tetapi konteks ancaman memberi nuansa sanggup bertahan hidup. Kata “dapat” menyampaikan daya retoris pertanyaan tersebut.
- source_word: מִשֻּׂמוֹ
  choice: ketika ... menetapkan hal itu
  rationale: Bentuk yang sangat padat ini berasal dari שׂוּם, “menaruh, menetapkan.” Terjemahan temporal ini masuk akal dalam konteks, sementara ketidakpastian konstruksinya dicatat dalam catatan kaki.
- source_word: אֵל
  choice: Allah
  rationale: אֵל dipahami sebagai sebutan ilahi dan subjek klausa terakhir; “Allah” adalah padanan Indonesia yang wajar dan jelas.
theological_decisions:
- issue: Penafsiran klausa sulit מִשֻּׂמוֹ אֵל
  choice: ketika Allah menetapkan hal itu
  alternative: ketika Allah melakukan hal itu; ketika Dia menegakkan hal ini, ya Allah
  rationale: Teks Ibrani sangat ringkas dan hubungan sintaksisnya tidak pasti. Terjemahan utama memahami אֵל sebagai subjek dan מִשֻּׂמוֹ secara temporal, tanpa menentukan lebih jauh apa yang ditetapkan. Catatan kaki mempertahankan kemungkinan lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Susunan “katanya” menghindari pengulangan kaku antara “menyampaikan” dan “berkata”, sedangkan “tetap hidup” mengungkapkan nuansa bertahan hidup tanpa menghilangkan verba dasar “hidup”.
