  naturalness: “Seorang dari Yakub akan memerintah” adalah bahasa Indonesia baku modern yang lebih langsung dan alami daripada “Dari Yakub akan muncul seorang yang berkuasa.” Penempatan penanda catatan kaki setelah unsur yang diterangkannya juga diperjelas.
  terminology: “Memerintah” mencerminkan רדה dengan baik; “berkuasa” layak dipertahankan sebagai alternatif. “Membinasakan orang yang tersisa” menyampaikan hifil אבד dan nomina personal שָׂרִיד tanpa menafsirkan tokoh ini secara mesianik.
