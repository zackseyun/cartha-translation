base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: id
  text: Seorang dari Yakub akan memerintah,[a] dan ia akan membinasakan orang yang tersisa[b] dari kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Seorang dari Yakub akan berkuasa.” Kata kerja Ibrani dapat berarti “memerintah” atau “berkuasa.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kaum yang tersisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: akan muncul seorang yang berkuasa
  rationale: Bentuk ini paling mungkin berasal dari רדה, “berkuasa/memerintah.” Karena subjek tidak dinyatakan dalam klausa Ibrani, “seorang” dipakai secara wajar dan mengacu pada tokoh penguasa dalam konteks nubuat Bileam. Kata “muncul” bersama “dari Yakub” mengungkapkan asal tokoh itu tanpa memilih pembacaan yang kurang mungkin, “turun.”
- source_word: מִיַּעֲקֹב
  choice: Dari Yakub
  rationale: Preposisi מן menyatakan asal atau sumber; ungkapan ini mempertahankan gambaran bahwa sang penguasa berasal dari Yakub/Israel.
- source_word: וְהֶאֱבִיד
  choice: dan ia akan membinasakan
  rationale: Bentuk hifil dari אבד berarti menyebabkan binasa atau menghancurkan. “Membinasakan” menyampaikan kekuatan verba itu dalam ragam bahasa yang lugas dan bermartabat.
- source_word: שָׂרִיד
  choice: orang yang tersisa
  rationale: Nomina tunggal ini menunjuk kepada orang yang tetap hidup atau tersisa. Pilihan ini mempertahankan rujukan personal dan tetap memungkinkan makna kolektif menurut konteks.
- source_word: מֵעִיר
  choice: dari kota itu
  rationale: עִיר berarti “kota,” sedangkan מן menyatakan asal atau ranah tempat orang yang tersisa itu akan dilenyapkan. “Itu” membuat frasa Indonesia alami tanpa menambahkan gagasan “kota berbenteng” yang tidak dinyatakan oleh katanya.
theological_decisions:
- issue: Rujukan kerajaan atau mesianik dalam nubuat Bileam
  choice: Menerjemahkan tokoh itu sebagai seorang penguasa yang berasal dari Yakub tanpa secara eksplisit menyebutnya Mesias.
  alternative: Menetapkan tokoh itu hanya sebagai raja historis langsung, atau secara eksplisit menyebutnya Mesias.
  rationale: Konteksnya bersifat kerajaan dan membuka kemungkinan pembacaan mesianik, tetapi ayat ini sendiri tidak secara eksplisit mengidentifikasi tokoh tersebut sebagai Mesias. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Susunan awal “Dari Yakub” mempertahankan penekanan sumber Ibrani, sementara “seorang yang berkuasa” mengatasi subjek tersirat secara alami. Semua penanda catatan kaki dicantumkan dalam teks utama.
