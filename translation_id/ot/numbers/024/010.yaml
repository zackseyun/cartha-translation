base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: id
  text: Lalu kemarahan Balak berkobar terhadap Bileam, dan ia menepukkan kedua tangannya. Balak berkata kepada Bileam, “Aku memanggilmu untuk mengutuk musuh-musuhku, tetapi lihatlah, engkau malah sungguh-sungguh memberkati mereka sudah tiga kali![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk “engkau telah memberkati, memberkati,” yaitu konstruksi penegasan yang menyatakan berkat yang kuat atau berulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: kemarahan Balak berkobar terhadap Bileam
  rationale: Mempertahankan gambaran idiom Ibrani tentang amarah yang menyala, dengan ungkapan Indonesia yang alami dan arah permusuhan dari אֶל.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: ia menepukkan kedua tangannya
  rationale: Menggambarkan gerakan memukulkan kedua telapak tangan dalam kemarahan tanpa memberi kesan tepuk tangan sebagai pujian.
- source_word: לָקֹב
  choice: untuk mengutuk
  rationale: Menyatakan tujuan pemanggilan Bileam secara langsung dan sesuai konteks.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan alami bagi bentuk jamak posesif Ibrani.
- source_word: קְרָאתִיךָ
  choice: Aku memanggilmu
  rationale: Padanan sederhana dan wajar; klausa tujuan menjelaskan maksud pemanggilan tersebut.
- source_word: וְהִנֵּה
  choice: tetapi lihatlah
  rationale: Menyampaikan kontras sekaligus seruan untuk memperhatikan hasil yang tidak diharapkan Balak.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: engkau malah sungguh-sungguh memberkati mereka
  rationale: Kata 'malah' menyatakan kontras, sedangkan 'sungguh-sungguh' mencerminkan penegasan konstruksi verba finit dengan infinitif absolut tanpa memperluasnya menjadi tafsiran berlebihan.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: sampai tiga kali ini
  rationale: Ungkapan alami dalam bahasa Indonesia yang menunjukkan pengulangan hingga saat itu serta mempertahankan daya tunjuk זֶה.
