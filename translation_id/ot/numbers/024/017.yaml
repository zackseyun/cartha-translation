id: NUM.24.17
reference: Numbers 24:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: id
  text: 'Aku melihatnya[a], tetapi bukan sekarang;

    aku memandangnya, tetapi tidak dekat.

    Sebuah bintang akan muncul dari Yakub,

    dan sebuah tongkat kerajaan akan bangkit dari Israel.

    Ia akan meremukkan penjuru-penjuru Moab[b]

    dan menghancurkan seluruh keturunan Set.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan melihatnya.” Bentuk Ibrani dapat menyatakan penglihatan nubuat pada masa mendatang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “penjuru-penjuru Moab”; ungkapan puitis ini mungkin menunjuk pada sisi-sisi, batas-batas, atau kekuatan Moab.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “semua anak Set.” Nama Ibrani שֵׁת dapat dibaca sebagai nama diri Set; sebagian penafsir memahaminya secara lebih luas sebagai sebutan puitis bagi umat manusia atau suatu bangsa yang bermusuhan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: Aku melihat dia
  rationale: Bentuk imperfek orang pertama tunggal dengan akhiran objek maskulin tunggal. Kala kini memberi daya penglihatan nubuat yang hidup, sedangkan kemungkinan makna mendatang dicatat dalam catatan kaki.
- source_word: אֲשׁוּרֶנּוּ
  choice: aku memandang dia
  rationale: Mempertahankan kesejajaran puitis dengan 'melihat' sekaligus membedakan verba yang bermakna memandang atau menatap.
- source_word: דָּרַךְ כּוֹכָב
  choice: Sebuah bintang telah tampil
  rationale: דָּרַךְ secara harfiah berkaitan dengan melangkah atau maju; bersama 'bintang', 'telah tampil' menyampaikan kemunculan tokoh simbolis secara wajar dan mempertahankan bentuk perfektif nubuat.
- source_word: וְקָם שֵׁבֶט
  choice: dan sebuah tongkat kerajaan telah bangkit
  rationale: שֵׁבֶט dapat berarti tongkat, suku, atau tongkat kerajaan. Dalam kesejajaran dengan bintang dan konteks pemerintahan serta penaklukan, 'tongkat kerajaan' paling tepat tanpa menafsirkan langsung siapa penguasanya.
- source_word: פַּאֲתֵי מוֹאָב
  choice: penjuru-penjuru Moab
  rationale: פֵּאָה berarti sudut, sisi, tepi, atau penjuru. Terjemahan ini mempertahankan metafora Ibrani yang sukar tanpa menggantinya dengan tafsiran seperti 'para pemimpin'.
- source_word: וְקַרְקַר
  choice: merobohkan
  rationale: Verba langka ini tidak pasti maknanya; usulan mencakup merobohkan, menghancurkan, dan membinasakan. 'Merobohkan' sesuai dengan konteks penaklukan sambil tidak menyatakan kepastian leksikal yang berlebihan.
- source_word: כָּל בְּנֵי שֵׁת
  choice: seluruh keturunan Set
  rationale: Secara harfiah 'semua anak Set'. 'Keturunan Set' alami dalam bahasa Indonesia dan mempertahankan pembacaan nama diri, sedangkan kemungkinan cakupan puitis yang lebih luas dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Daya mesianik nubuat Bileam
  choice: Mempertahankan citra kerajaan berupa 'bintang' dan 'tongkat kerajaan' tanpa secara eksplisit menyebut Mesias.
  alternative: Menafsirkan tokoh itu secara langsung sebagai Mesias, atau membatasinya hanya pada seorang raja historis seperti Daud.
  rationale: Teks Ibrani menyajikan citra seorang penguasa yang akan datang, tetapi tidak menyebut identitasnya secara langsung. Terjemahan mempertahankan ruang bagi penggenapan historis dan mesianik tanpa memasukkan identifikasi teologis ke dalam teks utama.
- issue: Hubungan antara objek personal dan lambang kerajaan
  choice: Menggunakan 'dia' pada penglihatan pembuka dan 'Ia' pada tindakan penaklukan, sementara lambang bintang dan tongkat kerajaan tetap utuh.
  alternative: Menjadikan seluruh ayat impersonal dengan 'bintang itu' atau menjelaskan tokoh tersebut secara eksplisit sebagai seorang raja tertentu.
  rationale: Akhiran objek maskulin tunggal pada dua verba pembuka menunjuk kepada sosok personal, sedangkan bagian tengah menggambarkannya melalui lambang. 'Ia' memungkinkan kedua lapisan tersebut tetap terdengar tanpa menetapkan identitas tokoh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Baris-baris disusun untuk mempertahankan paralelisme puisi Ibrani. Istilah 'tongkat kerajaan' mudah dipahami dan tetap menjaga citra pemerintahan; 'penjuru-penjuru' sengaja mempertahankan metafora sumber yang tidak pasti.
