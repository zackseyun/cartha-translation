  terminology: '''Tongkat kerajaan'', ''Moab'', ''Yakub'', dan ''Set'' tepat serta netral secara teologis. ''Ia'' dipertahankan untuk menghubungkan sosok maskulin dalam pembukaan dengan lambang kerajaan, tanpa mengidentifikasinya secara doktrinal.'
