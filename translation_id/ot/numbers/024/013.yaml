id: NUM.24.13
reference: Numbers 24:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: id
  text: “Jika Balak memberiku perak dan emas sebanyak seisi rumahnya, aku tidak dapat melampaui firman Yahweh[a] untuk berbuat baik ataupun jahat dari hatiku sendiri. Apa pun yang Yahweh firmankan, itulah yang akan kusampaikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melampaui mulut Yahweh.”
    reason: Ungkapan Ibrani memakai ‘mulut’ untuk merujuk pada perkataan atau titah Yahweh.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Jika ... memberiku
  rationale: אִם dengan bentuk imperfek membuka keadaan bersyarat atau hipotetis. Bentuk ini alami dalam bahasa Indonesia tanpa menetapkan nuansa waktu yang tidak dinyatakan.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: perak dan emas sebanyak seisi rumahnya
  rationale: Frasa ini menggambarkan jumlah perak dan emas yang dapat memenuhi rumah Balak; susunan Indonesia ini mempertahankan gambaran kelimpahan secara alami.
- source_word: לֹא אוּכַל
  choice: aku tidak dapat
  rationale: Bentuk יכל menyatakan ketidakmampuan dalam kerangka pengandaian yang dibuka pada awal kalimat.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: melampaui firman Yahweh
  rationale: Ungkapan harfiahnya adalah ‘melampaui mulut Yahweh’. ‘Firman’ menyampaikan maksud perkataan atau ketetapan ilahi sambil mempertahankan gambaran tentang batas yang tidak boleh dilampaui.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: untuk berbuat baik ataupun jahat
  rationale: Terjemahan langsung ini mempertahankan pasangan yang berlawanan dalam bahasa Ibrani tanpa mempersempit cakupannya.
- source_word: מִלִּבִּי
  choice: dari hatiku sendiri
  rationale: Terjemahan ini mempertahankan citra ‘hati’ sebagai sumber niat atau prakarsa pribadi Bileam dan menonjolkan kontras dengan firman Yahweh.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ
  choice: Apa pun yang Yahweh firmankan, itulah
  rationale: Susunan ini mempertahankan cakupan terbuka אֲשֶׁר dan struktur resumptif yang menunjuk kembali kepada isi yang difirmankan Yahweh.
- source_word: אֲדַבֵּר
  choice: yang akan kusampaikan
  rationale: Bentuk imperfek di sini secara alami menyatakan tindakan yang akan dilakukan. ‘Sampaikan’ menghindari pengulangan yang kaku tanpa mengubah maksud berbicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama ilahi secara langsung. Transliterasi ‘Yahweh’ mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Batas kemampuan Bileam
  choice: Bileam tidak dapat bertindak atas prakarsanya sendiri dengan melampaui firman Yahweh
  alternative: Pernyataan ini hanya merujuk secara khusus pada perubahan berkat menjadi kutuk atau sebaliknya
  rationale: Ayat itu sendiri menyatakan ketidakmampuan Bileam melampaui firman Yahweh dan berbuat baik atau jahat dari hatinya sendiri. Terjemahan tidak memperluas klaim ini menjadi doktrin umum tentang semua nubuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam langsung dan bermartabat. Kata ganti ‘aku’ sesuai dengan ujaran langsung Bileam. Bentuk ‘kusampaikan’ dipilih agar penutup terdengar alami, sementara hubungan verbal dengan apa yang Yahweh firmankan tetap jelas.
