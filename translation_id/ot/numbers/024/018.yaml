source:
  edition: WLC
  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: id
  text: Edom akan menjadi milik; Seir juga akan menjadi milik musuh-musuhnya,[a] sedangkan Israel bertindak dengan gagah perkasa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “musuh-musuhnya”; dalam bahasa Ibrani, akhiran ini berbentuk maskulin tunggal. Rujukannya mungkin kepada penguasa yang disebut dalam nubuat di sekitarnya; ada juga yang memahaminya sebagai rujukan kepada Seir atau Edom.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “melakukan kekuatan/keperkasaan”; ini adalah ungkapan yang berarti memperlihatkan kekuatan atau bertindak dengan gagah perkasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: akan menjadi
  rationale: Bentuk perfek dengan waw dalam tuturan nubuat menyatakan keadaan yang akan terwujud; “akan menjadi” menyampaikan peralihan itu secara wajar.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama bangsa dan wilayah ini dipertahankan sebagai nama diri.
- source_word: יְרֵשָׁה
  choice: milik taklukan
  rationale: Nomina ini menunjuk pada sesuatu yang dikuasai atau diduduki. “Milik taklukan” mempertahankan gagasan kepemilikan sekaligus konteks penaklukan militer.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Nama tempat yang sejajar dengan Edom; teks Ibrani tidak mencantumkan kata “gunung” pada ayat ini.
- source_word: אֹיְבָיו
  choice: di antara musuh-musuhnya
  rationale: Bentuk Ibrani secara harfiah berarti “musuh-musuhnya,” dengan akhiran maskulin tunggal. Ungkapan “di antara” membuat hubungan aposisionalnya dengan Seir dapat dipahami tanpa mengubah musuh menjadi pihak yang memiliki Seir.
- source_word: וְיִשְׂרָאֵל
  choice: sedangkan Israel
  rationale: Kata sambung tersebut mengalihkan perhatian dari nasib Edom dan Seir kepada tindakan Israel; “sedangkan” menyatakan hubungan antarklausa secara alami.
- source_word: עֹשֶׂה חָיִל
  choice: menunjukkan keperkasaannya
  rationale: Idiom ini berarti memperlihatkan kekuatan atau bertindak dengan gagah; pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kemiliterannya.
theological_decisions:
- issue: Acuan akhiran tunggal dalam אֹיְבָיו (“musuh-musuhnya”)
  choice: Akhiran dipertahankan sebagai “-nya” dan dipahami dapat merujuk kepada tokoh penguasa tunggal dalam nubuat di sekitarnya.
  alternative: Akhiran itu dapat dikaitkan dengan Seir/Edom, sehingga dipahami sebagai “musuh-musuh Seir/Edom.”
  rationale: Bentuk Ibrani memakai akhiran maskulin tunggal, sementara ayat 17–19 berbicara tentang seorang penguasa yang tampil dari Israel. Terjemahan dan catatan mempertahankan bentuk serta ketegangan penafsirannya tanpa menetapkan identifikasi teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Milik taklukan” dipakai untuk mempertahankan baik unsur kepemilikan maupun latar penaklukan; struktur kalimat dijaga ringkas sesuai gaya nubuat puitis.
