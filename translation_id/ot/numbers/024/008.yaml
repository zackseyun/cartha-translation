  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: id
  text: Allah membawa dia keluar dari Mesir; ia memiliki tanduk seperti lembu liar.[a] Ia akan melahap bangsa-bangsa yang menjadi lawannya, menggerogoti tulang-tulang mereka,[b] dan menghancurkan mereka dengan anak-anak panahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia memiliki kekuatan seperti lembu liar.” Frasa Ibrani כְּתוֹעֲפֹת רְאֵם sulit dipastikan; sejumlah terjemahan kuno dan modern mengungkapkan gambaran ini secara lebih umum sebagai kekuatan, bukan tanduk secara eksplisit.
    reason: lexical_alternative
  - marker: b
    text: Atau “meremukkan tulang-tulang mereka” atau “menelanjangi tulang-tulang mereka.” Kata kerja Ibrani יְגָרֵם jarang dipakai sehingga nuansa tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Allah
  rationale: Dalam bahasa Indonesia standar, “Allah” merupakan sebutan umum yang wajar bagi God dalam teks Alkitab dan di sini jelas menjadi subjek yang membebaskan.
- source_word: מוֹצִיאוֹ
  choice: membawa dia keluar
  rationale: Bentuk partisip dengan akhiran pronominal dipertahankan dengan daya kini yang hidup dalam puisi, tanpa mengubahnya menjadi peristiwa lampau eksplisit.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Ungkapan ini secara alami menyatakan gerak keluar dari Mesir dalam bahasa Indonesia.
- source_word: כְּתוֹעֲפֹת רְאֵם
  choice: tanduk seperti tanduk lembu liar
  rationale: Frasa Ibrani ini sulit. Terjemahan utama mempertahankan citra bagian tubuh yang menjulang dan daya serang hewan tersebut; רְאֵם dipahami sebagai lembu liar, bukan unicorn. Kemungkinan makna yang lebih umum, “kekuatan,” dicatat dalam catatan kaki.
- source_word: לוֹ
  choice: ia memiliki
  rationale: Konstruksi dengan לוֹ menyatakan kepunyaan atau sesuatu yang tersedia baginya; bentuk idiomatis Indonesia “ia memiliki” mengungkapkan hubungan itu dengan jelas.
- source_word: יֹאכַל
  choice: akan melahap
  rationale: Arti harfiahnya berkaitan dengan makan, tetapi dalam puisi perang menunjuk pada pembinasaan. “Melahap” mempertahankan metafora tersebut.
- source_word: גּוֹיִם צָרָיו
  choice: bangsa-bangsa yang menjadi lawannya
  rationale: Terjemahan ini mempertahankan גּוֹיִם sebagai bangsa-bangsa dan menjelaskan צָרָיו sebagai bangsa-bangsa yang memusuhinya.
- source_word: וְעַצְמֹתֵיהֶם
  choice: tulang-tulang mereka
  rationale: Padanan langsung dan alami untuk nomina jamak dengan akhiran orang ketiga jamak.
- source_word: יְגָרֵם
  choice: menggerogoti
  rationale: Kata kerja langka ini muncul dengan objek “tulang-tulang.” “Menggerogoti” cocok dengan gambaran melahap, sedangkan ketidakpastian antara menggerogoti, meremukkan, dan menelanjangi tulang dipertahankan dalam catatan kaki.
- source_word: וְחִצָּיו יִמְחָץ
  choice: dan menghancurkan mereka dengan anak-anak panahnya
  rationale: Terjemahan ini memahami anak-anak panah sebagai sarana penghancuran dan mengisi objek tersirat dari konteks, selaras dengan citra peperangan serta makna umum מחץ, yakni meremukkan atau menghancurkan.
theological_decisions:
- issue: Acuan kata ganti tunggal dalam ucapan Bileam
  choice: Kata ganti tunggal “dia/ia/-nya” dipertahankan tanpa menentukan acuannya lebih jauh daripada teks.
  alternative: Acuannya dapat dipahami sebagai Israel secara kolektif, raja atau wakil Israel, atau—dalam penafsiran kemudian—seorang tokoh Mesianik.
  rationale: Bahasa Ibrani memakai bentuk-bentuk tunggal, sedangkan konteks memungkinkan pengertian kolektif ataupun representatif. Terjemahan tidak mempersempit ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. “Melahap” serta “menggerogoti” mempertahankan rangkaian citra ganas dari teks, sementara kata ganti tunggal sengaja dibiarkan tanpa penjelasan referensial dalam tubuh ayat.
