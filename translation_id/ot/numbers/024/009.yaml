  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: id
  text: Ia merunduk, ia berbaring seperti singa, dan seperti singa betina[a]—siapa yang akan membangunkannya? Mereka yang memberkati engkau diberkati, dan mereka yang mengutuk engkau dikutuk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan seperti singa yang perkasa.” Kata Ibrani ini dapat menunjuk pada singa yang kuat atau dewasa; “singa betina” mempertahankan perbedaan katanya dari kata sebelumnya yang diterjemahkan “singa”.
    reason: lexical_alternative
  - marker: b
    text: Rumusan berkat dan kutuk ini menggemakan Kejadian 12:3 dan 27:29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: merunduk
  rationale: Dalam kesejajaran dengan שָׁכַב dan gambaran singa, verba ini menunjuk pada gerak merendahkan tubuh atau berjongkok, bukan tindakan penyembahan atau penundukan diri.
- source_word: שָׁכַב
  choice: berbaring
  rationale: Pilihan alami dalam bahasa Indonesia untuk keadaan berbaring dan mempertahankan gambaran singa yang telah mengambil posisi istirahat.
- source_word: כַּאֲרִי
  choice: seperti singa
  rationale: Menerjemahkan simile secara langsung dan mempertahankan citra puitis Ibrani.
- source_word: וּכְלָבִיא
  choice: dan seperti singa betina
  rationale: לָבִיא dapat menunjuk singa yang kuat atau dewasa tanpa selalu memastikan jenis kelamin. 'Singa betina' mempertahankan perbedaan leksikal dari אֲרִי; alternatif dicatat dalam catatan kaki.
- source_word: מִי יְקִימֶנּוּ
  choice: siapa yang berani membangunkannya?
  rationale: Bentuk kausatif קום dalam konteks singa yang berbaring berarti membuatnya bangkit atau mengusiknya. 'Berani' tersirat secara pragmatis dalam pertanyaan retoris dan menghasilkan ungkapan Indonesia yang hidup.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: orang yang memberkati engkau diberkati
  rationale: Partisip dengan sufiks orang kedua tunggal diterjemahkan secara substantival. Bentuk tunggal kolektif dipertahankan agar sejalan dengan konstruksi Ibrani dan gema rumusan berkat leluhur.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: dan orang yang mengutuk engkau dikutuk
  rationale: Mempertahankan paralelisme langsung antara memberkati/diberkati dan mengutuk/dikutuk, beserta sapaan orang kedua tunggal.
theological_decisions:
- issue: Rujukan sufiks orang kedua dalam rumusan berkat dan kutuk
  choice: Sapaan tunggal 'engkau' dipertahankan, dengan Israel/Yakub sebagai rujukan korporatif dalam konteks nubuat Bileam.
  alternative: Menentukan rujukannya secara lebih sempit sebagai raja Israel atau menggantinya dengan sapaan jamak kepada bangsa itu.
  rationale: Teks Ibrani memakai bentuk tunggal dalam puisi yang berbicara tentang Yakub/Israel. Terjemahan tidak mempersempit rujukan atau menghapus daya representatif-korporatif bentuk tersebut.
- issue: Gema rumusan berkat para leluhur
  choice: Rumusan berkat dan kutuk diterjemahkan langsung tanpa penjelasan teologis di dalam teks.
  alternative: Memperluas terjemahan agar kaitannya dengan perjanjian Abraham dinyatakan secara eksplisit.
  rationale: Gema Kejadian 12:3 dan 27:29 layak dicatat, tetapi tidak boleh dimasukkan sebagai tafsiran tambahan ke dalam tubuh ayat.
translation_notes:
  register: Bahasa Indonesia baku yang modern, puitis, dan bermartabat. Pengulangan 'ia' mempertahankan gerak paralel puisi. 'Engkau' dipakai untuk menjaga bentuk orang kedua tunggal dan nuansa luhur. Penanda catatan ditempatkan tepat pada unsur yang dijelaskannya.
