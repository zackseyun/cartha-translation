  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: id
  text: Kemudian Bileam bangkit, pergi, dan kembali ke tempatnya. Balak pun pergi menurut jalannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk Qal wayyiqtol dari קום menandai tindakan bangun atau mulai berangkat; “bangkit” mempertahankan gerak naratif Ibrani dengan ragam yang bermartabat.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: הלך dalam urutan naratif sederhana paling wajar diterjemahkan “pergi”, tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: שׁוב dengan frasa tujuan לִמְקֹמוֹ menyatakan kembali ke tempat sebelumnya.
- source_word: לִמְקֹמוֹ
  choice: ke tempatnya
  rationale: מקום secara langsung berarti “tempat”. Pilihan ini tidak mempersempit maknanya menjadi “rumah”, yang hanya merupakan kemungkinan tersirat.
- source_word: וְגַם
  choice: pun
  rationale: Partikel “pun” secara alami menyampaikan daya aditif dan kesejajaran tindakan Balak dalam bahasa Indonesia.
- source_word: בָּלָק
  choice: Balak
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָלַךְ
  choice: pergi
  rationale: Qal perfektum ini merangkum tindakan Balak; “pergi” mempertahankan hubungan leksikal dengan וַיֵּלֶךְ sebelumnya.
- source_word: לְדַרְכּוֹ
  choice: menempuh jalannya sendiri
  rationale: דרך berarti “jalan”; dalam konstruksi ini frasa tersebut secara idiomatis menyatakan bahwa Balak meneruskan perjalanan ke arahnya sendiri. “Jalannya sendiri” juga mempertahankan sufiks orang ketiga tunggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Koordinasi verba pada bagian pertama dipertahankan, sedangkan “pun” menyatakan kesejajaran keberangkatan Balak. Tidak ada penjelasan tambahan bahwa “tempatnya” adalah rumah atau negeri asal Bileam.
