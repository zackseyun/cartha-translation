base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: id
  text: Jadi sekarang, larilah ke tempatmu. Aku telah berkata, ‘Aku pasti akan sangat menghormatimu,’ tetapi lihatlah, Yahweh telah mencegahmu menerima kehormatan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mempertahankan unsur penghubung dan waktu sekaligus menyampaikan peralihan menuju kesimpulan Balak secara alami dalam bahasa Indonesia.
- source_word: בְּרַח
  choice: larilah
  rationale: Bentuk imperatif ini menyatakan kepergian dengan segera dan kuat; ‘larilah’ mempertahankan nada pengusiran Balak.
- source_word: לְךָ אֶל־מְקוֹמֶךָ
  choice: ke tempatmu
  rationale: Terjemahan langsung yang tidak mempersempit makna menjadi ‘rumahmu’, meskipun konteks menyiratkan tempat asal Bileam.
- source_word: אָמַרְתִּי
  choice: Aku telah berkata
  rationale: Menunjuk kepada pernyataan Balak sebelumnya dengan bentuk lampau yang alami dalam bahasa Indonesia.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Aku pasti akan sangat menghormatimu
  rationale: Infinitif absolut bersama verba finit memberi penegasan; gabungan ‘pasti’ dan ‘sangat’ menyampaikan kepastian serta bobot penghormatan yang dijanjikan.
- source_word: וְהִנֵּה
  choice: tetapi lihatlah
  rationale: ‘Tetapi’ menyatakan kontras dengan janji sebelumnya, sedangkan ‘lihatlah’ mempertahankan daya tunjuk dan kehadiran langsung הִנֵּה.
- source_word: מְנָעֲךָ
  choice: telah mencegahmu menerima
  rationale: Dalam konstruksi dengan מִן, verba ini berarti menghalangi seseorang dari memperoleh sesuatu; bentuk ini alami dan menjernihkan relasinya tanpa mengubah pelaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מִכָּבוֹד
  choice: kehormatan
  rationale: Dalam konteks ini כָּבוֹד adalah kehormatan dan kedudukan yang dijanjikan Balak, bukan kemuliaan ilahi atau secara eksplisit upah materi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama ilahi secara langsung; ‘Yahweh’ mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Peran Yahweh dalam hilangnya kehormatan yang dijanjikan
  choice: Yahweh telah mencegah Bileam menerima kehormatan
  alternative: Yahweh telah menahan kehormatan dari Bileam
  rationale: Konstruksi מנע + objek orang + מן mendukung pengertian bahwa Yahweh menghalangi Bileam memperoleh kehormatan. Terjemahan tidak menilai benar-tidaknya tuduhan Balak, melainkan mempertahankannya sebagai ucapan Balak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nada Balak dibuat tegas melalui ‘larilah’, sementara ‘lihatlah’ mempertahankan daya retoris teks. Tidak digunakan catatan kaki karena alternatif sintaksis dan leksikal tidak diperlukan untuk memahami ayat ini; tidak ada penanda catatan kaki dalam teks utama.
