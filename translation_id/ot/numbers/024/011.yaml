  source_fidelity: 'Terjemahan mengikuti teks Ibrani dengan baik: וְעַתָּה diterjemahkan sebagai peralihan diskursif “Jadi sekarang”; imperatif בְּרַח dipertahankan dengan tegas dalam “larilah”; dan מְקוֹמֶךָ tidak dispesifikkan secara berlebihan. Penegasan infinitif absolut dalam כַּבֵּד אֲכַבֶּדְךָ tersampaikan melalui “pasti akan sangat.” Konstruksi מְנָעֲךָ מִכָּבוֹד diterjemahkan secara tepat sebagai Yahweh mencegah Bileam menerima kehormatan. Ucapan itu tetap jelas sebagai ucapan Balak, tanpa mengesahkan penilaiannya.'
