base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: id
  text: Orang yang membakar sapi itu harus mencuci pakaiannya dengan air dan membasuh tubuhnya dengan air[a], dan ia menjadi najis sampai petang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kedua frasa itu berbunyi “dalam air”.
    reason: lexical_alternative
  - marker: b
    text: “Najis” di sini menunjuk pada ketidaktahiran ritual, bukan dengan sendirinya pada kesalahan moral.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: orang yang membakar sapi itu
  rationale: Partisipel berartikel berfungsi sebagai nomina bagi pelaku. Objek feminin merujuk kepada sapi betina merah; menyebut 'sapi itu' lebih jelas dalam bahasa Indonesia daripada pronomina yang berpotensi kabur.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk imperfek dalam hukum ritual bersifat preskriptif. 'Harus' menyampaikan kewajiban secara alami, sedangkan 'mencuci pakaian' tepat bagi כבס.
- source_word: בַּמַּיִם
  choice: dengan air
  rationale: Walaupun bentuk Ibraninya secara harfiah memakai preposisi yang dapat diterjemahkan 'di dalam air', dalam konteks pencucian sarana yang dimaksud secara alami dinyatakan 'dengan air' dalam bahasa Indonesia.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: dan membasuh tubuhnya
  rationale: רחץ menunjuk pada pembasuhan tubuh dan dibedakan dari כבס untuk pakaian. בשר dalam konteks ini berarti tubuh, bukan sekadar daging.
- source_word: וְטָמֵא
  choice: dan ia menjadi najis
  rationale: Rangkaian tindakan ini menghasilkan status kenajisan ritual. 'Menjadi najis' menyatakan hasil tersebut dengan jelas tanpa menyiratkan kesalahan moral.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Terjemahan ini dekat dengan frasa Ibrani dan tidak mempersempitnya secara interpretatif menjadi saat matahari terbenam.
theological_decisions:
- issue: Makna טמא dalam hukum ritual
  choice: najis
  alternative: tidak tahir; najis secara ritual
  rationale: '''Najis'' adalah padanan ringkas dan lazim dalam konteks hukum pentahiran. Catatan menjelaskan bahwa status ini bersifat ritual dan tidak dengan sendirinya menyatakan kesalahan moral.'
- issue: Status sesudah pembakaran
  choice: ia menjadi najis
  alternative: ia akan najis; ia tetap najis
  rationale: Konteks menyatakan status yang timbul bagi pelaku. Pilihan ini tidak menambahkan gagasan bahwa ia telah najis sebelumnya ataupun bahwa kenajisan itu merupakan hukuman moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dibuat jelas dengan 'harus'; 'sapi itu' menghindari rujukan pronominal yang kabur. Kedua penanda catatan kaki muncul dalam teks utama.
