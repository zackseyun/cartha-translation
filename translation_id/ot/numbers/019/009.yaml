id: NUM.19.9
reference: Numbers 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: id
  text: Seorang laki-laki yang tahir harus mengumpulkan abu sapi betina itu dan menaruhnya di suatu tempat yang tahir di luar perkemahan. Abu itu harus disimpan bagi umat Israel untuk air pentahiran[a]. Itulah kurban penghapus dosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk air kenajisan”; maksudnya air yang digunakan untuk menghilangkan kenajisan ritual.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Itulah kurban pentahiran.” Kata Ibrani חַטָּאת dapat berarti kurban penghapus dosa dan, dalam konteks keimaman, kurban untuk pentahiran.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: seorang laki-laki yang tahir
  rationale: אִישׁ berbentuk tunggal dan secara eksplisit berarti laki-laki; טָהוֹר dalam konteks ini menunjuk pada ketahiran ritual. Kata “tahir” mempertahankan nuansa keagamaan dengan ringkas.
- source_word: וְאָסַף
  choice: harus mengumpulkan
  rationale: Bentuk verba ini melanjutkan rangkaian petunjuk ritual. “Harus” menyampaikan daya instruktifnya secara wajar dalam bahasa Indonesia.
- source_word: אֵפֶר הַפָּרָה
  choice: abu sapi betina itu
  rationale: אֵפֶר adalah abu sebagai benda kolektif, sedangkan פָּרָה secara khusus berarti sapi betina. Unsur definit mempertahankan rujukan kepada sapi betina yang telah disebut sebelumnya.
- source_word: וְהִנִּיחַ
  choice: dan menaruhnya
  rationale: Verba ini berarti meletakkan atau menaruh. Pronomina “-nya” memperjelas bahwa objeknya adalah abu tersebut tanpa membuat kalimat kaku.
- source_word: מִחוּץ לַמַּחֲנֶה בְּמָקוֹם טָהוֹר
  choice: di suatu tempat yang tahir di luar perkemahan
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan lokasi di luar perkemahan serta syarat bahwa tempat itu tahir secara ritual.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: bagi umat Israel
  rationale: עֲדָה menunjuk pada perhimpunan atau komunitas Israel. “Umat Israel” merupakan ungkapan Indonesia yang alami dan mencakup keseluruhan komunitas tanpa mengaburkan identitasnya.
- source_word: לְמִשְׁמֶרֶת
  choice: harus disimpan
  rationale: Nomina ini menyatakan sesuatu yang dijaga atau disimpan sebagai persediaan. Pengungkapan verbal menghasilkan bahasa Indonesia yang lebih alami.
- source_word: לְמֵי נִדָּה
  choice: untuk air pentahiran
  rationale: Secara harfiah frasa ini dekat dengan “air kenajisan,” tetapi dalam konteks ritual air tersebut dipakai untuk menangani atau menyingkirkan kenajisan. “Air pentahiran” menyampaikan fungsi itu dengan jelas, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: חַטָּאת הִוא
  choice: Itulah kurban penghapus dosa
  rationale: חַטָּאת dapat berarti dosa, kurban penghapus dosa, atau kurban pentahiran dalam teks ritual. Terjemahan utama mempertahankan istilah kurban yang lazim, sementara nuansa pentahiran dicatat sebagai alternatif.
theological_decisions:
- issue: Makna חַטָּאת dalam ritual pentahiran
  choice: Itulah kurban penghapus dosa
  alternative: Itulah kurban pentahiran
  rationale: Istilah Ibrani ini memiliki rentang makna yang mencakup kurban yang berkaitan dengan dosa dan fungsi pemurnian ritual. Bacaan utama mempertahankan padanan tradisional tanpa meniadakan fungsi pentahiran yang menonjol dalam konteks ini.
- issue: Makna לְמֵי נִדָּה
  choice: untuk air pentahiran
  alternative: untuk air kenajisan
  rationale: Konstruksi Ibrani mempertahankan ketegangan antara kenajisan yang ditangani dan fungsi air untuk mentahirkan. Teks utama mengutamakan fungsi ritual yang jelas bagi pembaca Indonesia, sementara bentuk yang lebih harfiah disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “tahir” dipakai secara konsisten untuk kemurnian ritual; struktur kalimat dipecah agar petunjuk hukum-ritual tetap jelas bagi pembaca umum.
