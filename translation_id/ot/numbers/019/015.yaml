  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: id
  text: Dan setiap bejana terbuka yang tidak memiliki penutup yang terikat padanya adalah najis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tutup yang terpasang erat” atau “penutup yang tersegel”; ungkapan Ibrani menunjuk pada penutup yang diamankan pada bejana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Dan setiap
  rationale: וְ menghubungkan ketentuan ini dengan konteks sebelumnya, sedangkan כֹל dengan nomina tunggal paling wajar diterjemahkan secara distributif sebagai “setiap”.
- source_word: כְּלִי
  choice: bejana
  rationale: כְּלִי dapat berarti perkakas atau wadah; dalam ketentuan kenajisan ini, “bejana” secara tepat menunjuk pada wadah yang dapat dibiarkan terbuka.
- source_word: פָתוּחַ
  choice: terbuka
  rationale: Terjemahan langsung ini mempertahankan keadaan bejana; klausa berikutnya menjelaskan bahwa penutupnya tidak terpasang.
- source_word: אֲשֶׁר אֵין
  choice: yang tidak memiliki
  rationale: Ungkapan ini menyatakan tidak adanya sesuatu dan diterjemahkan secara alami dalam bahasa Indonesia tanpa mengubah hubungan relatifnya.
- source_word: צָמִיד פָּתִיל
  choice: penutup yang terikat
  rationale: Gabungan kata Ibrani ini menunjuk pada penutup yang diamankan dengan ikatan. Pilihan ini mempertahankan gambaran konkret tanpa memastikan mekanisme kunonya secara berlebihan.
- source_word: עָלָיו
  choice: padanya
  rationale: Bentuk ini menyatakan bahwa penutup tersebut terpasang pada bejana dan menghasilkan susunan bahasa Indonesia yang ringkas.
- source_word: טָמֵא הוּא
  choice: adalah najis
  rationale: Terjemahan ini menyatakan status kenajisan secara langsung tanpa menambahkan kata “ritual” yang tidak hadir dalam teks Ibrani.
theological_decisions:
- issue: Sifat kenajisan
  choice: najis
  alternative: najis secara ritual
  rationale: Konteksnya menyangkut ketahiran seremonial, tetapi teks Ibrani hanya menyatakan טָמֵא, “najis.” Teks utama tidak diberi penjelasan teologis tambahan.
- issue: Bentuk penutup bejana
  choice: penutup yang terikat
  alternative: tutup yang terpasang erat; penutup yang tersegel
  rationale: Ungkapan Ibrani tidak memastikan apakah benda itu berupa tutup keras, penutup yang diikat, atau segel. Terjemahan utama mempertahankan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bejana” dipakai sebagai istilah umum yang sesuai dengan konteks hukum ketahiran; struktur kalimat dibuat jelas tanpa menghilangkan nuansa ungkapan Ibrani yang tidak pasti.
