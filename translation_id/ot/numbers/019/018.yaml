id: NUM.19.18
reference: Numbers 19:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: id
  text: Seorang laki-laki yang tahir[a] harus mengambil hisop, mencelupkannya ke dalam air itu, lalu memercikkan air itu pada kemah, pada semua barang, pada orang-orang yang ada di sana, dan pada orang yang telah menyentuh tulang, mayat orang yang terbunuh[b], orang mati, atau kuburan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang laki-laki tahir.” Kata Ibraninya berbentuk tunggal maskulin.
    reason: Menjelaskan bentuk gramatikal sumber dan bahwa 'tahir' merupakan kualifikasi ritual.
  - marker: b
    text: Atau “orang yang terbunuh.” Istilah Ibrani ini secara khusus menunjuk kepada orang yang mati karena kekerasan, berbeda dari istilah yang lebih umum untuk “orang mati” dalam frasa berikutnya.
    reason: Mempertahankan kemungkinan ungkapan alternatif dan perbedaan leksikal antara חָלָל dan מֵת.
lexical_decisions:
- source_word: אֵזוֹב
  choice: hisop
  rationale: Istilah botani ritual yang lazim dalam tradisi Alkitab Indonesia; lebih tepat daripada sebutan umum seperti 'tanaman' atau 'ranting'.
- source_word: בַּמַּיִם
  choice: ke dalam air itu
  rationale: Artikel tentu dalam bahasa Ibrani dipertahankan; air tersebut merujuk pada air pentahiran yang telah disiapkan dalam konteks sebelumnya.
- source_word: אִישׁ טָהוֹר
  choice: seorang laki-laki yang tahir
  rationale: Bentuk tunggal maskulin diterjemahkan secara eksplisit, sedangkan 'tahir' menunjukkan status ritual dan tidak memberi kesan utama tentang kemurnian moral.
- source_word: וְהִזָּה
  choice: memercikkan air itu
  rationale: Mengungkapkan tindakan ritual menyebarkan tetesan air; objek 'air itu' dibuat eksplisit dalam bahasa Indonesia agar tindakan tersebut jelas dan alami.
- source_word: הָאֹהֶל
  choice: kemah
  rationale: Konteksnya ialah kemah tempat kematian terjadi, bukan Kemah Suci.
- source_word: הַכֵּלִים
  choice: semua barang
  rationale: כְּלִי mencakup perkakas, wadah, dan berbagai benda; 'barang' paling mudah dipahami dan tidak mempersempit rujukannya.
- source_word: הַנְּפָשׁוֹת
  choice: orang-orang
  rationale: Dalam konteks ini נֶפֶשׁ berarti orang yang hadir, bukan 'jiwa' sebagai unsur antropologis yang terpisah.
- source_word: הַנֹּגֵעַ
  choice: orang yang telah menyentuh
  rationale: Partisipel substantival menunjuk kepada orang yang terkena kenajisan karena kontak; bentuk perfektif Indonesia sesuai dengan kontak yang telah terjadi.
- source_word: בָּעֶצֶם
  choice: tulang
  rationale: Konteks menunjukkan tulang manusia sebagai sumber kenajisan; bahasa Indonesia tidak memerlukan kata sandang untuk mempertahankan makna ini.
- source_word: בֶחָלָל
  choice: mayat orang yang terbunuh
  rationale: חָלָל secara khusus menunjuk kepada orang yang tewas karena kekerasan. 'Mayat' memperjelas bahwa kontak dengan jenazah dimaksudkan, sambil membedakannya dari istilah umum מֵת berikutnya.
- source_word: בַמֵּת
  choice: orang mati
  rationale: Istilah umum bagi manusia yang telah mati, dipertahankan berbeda dari חָלָל yang secara khusus menyiratkan kematian karena kekerasan.
- source_word: בַקָּבֶר
  choice: kuburan
  rationale: Padanan Indonesia modern yang langsung dan alami bagi tempat penguburan.
theological_decisions:
- issue: Istilah ketahiran ritual
  choice: tahir
  alternative: suci; bersih
  rationale: Ayat ini membahas status ritual akibat kenajisan karena kematian, bukan kebersihan jasmani atau keluhuran moral. 'Tahir' mempertahankan kerangka ritual Taurat.
- issue: Bahasa maskulin dalam אִישׁ
  choice: laki-laki
  alternative: orang
  rationale: Teks Ibrani secara eksplisit memakai nomina tunggal maskulin. Terjemahan mempertahankan bentuk itu tanpa menyimpulkan ketentuan teologis tambahan di luar teks.
- issue: Pembedaan חָלָל dan מֵת
  choice: mayat orang yang terbunuh; orang mati
  alternative: mayat; orang mati
  rationale: Pembedaan antara kematian karena kekerasan dan kematian secara umum dipertahankan, tanpa menentukan cara kekerasan atau keadaan kematian lebih lanjut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar sumber dipertahankan, tetapi objek 'air itu' diulang setelah 'memercikkan' demi kejelasan alami. Istilah ritual 'tahir' dan 'hisop' dipertahankan karena telah dikenal dan lebih tepat daripada parafrasa umum.
