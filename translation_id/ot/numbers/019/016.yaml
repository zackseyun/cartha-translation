id: NUM.19.16
reference: Numbers 19:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: id
  text: Setiap orang yang di tempat terbuka[a] menyentuh orang yang tewas oleh pedang[b], mayat[c], tulang manusia, atau kuburan, menjadi najis selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas permukaan padang”; maksudnya di tempat terbuka.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang tertikam pedang.”
    reason: lexical_alternative
  - marker: c
    text: Atau “orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: Setiap orang yang ... menyentuh
  rationale: Frasa ini bersifat distributif dan menyatakan ketentuan umum bagi siapa pun yang menyentuh hal-hal yang disebutkan.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: di tempat terbuka
  rationale: Secara harfiah berarti 'di atas permukaan padang,' tetapi merupakan ungkapan untuk lokasi terbuka di luar bangunan.
- source_word: בַּחֲלַל חֶרֶב
  choice: orang yang tewas oleh pedang
  rationale: חָלָל menunjuk kepada orang yang terbunuh atau tertikam, sedangkan חֶרֶב menyebut alat penyebabnya. Pilihan ini alami dan tetap mempertahankan rujukan kepada seseorang.
- source_word: אוֹ בְמֵת
  choice: mayat
  rationale: מֵת dapat menunjuk kepada orang mati atau jasadnya; dalam konteks kenajisan akibat sentuhan, 'mayat' ringkas dan jelas.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: tulang manusia
  rationale: אָדָם di sini bersifat umum dan menunjuk kepada manusia, bukan khusus laki-laki.
- source_word: אוֹ בְקָבֶר
  choice: atau kuburan
  rationale: קֶבֶר berarti kubur, kuburan, atau tempat pemakaman; 'kuburan' merupakan padanan umum yang jelas.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: menjadi najis selama tujuh hari
  rationale: Bentuk verbal menyatakan status kenajisan ritual yang timbul akibat sentuhan dan berlangsung tujuh hari.
theological_decisions:
- issue: Makna umum אָדָם dalam frasa עֶצֶם אָדָם
  choice: tulang manusia
  alternative: tulang seorang laki-laki
  rationale: Dalam hukum kenajisan ini, kata tersebut menunjuk kepada sisa jasad manusia secara umum, tanpa pembatasan jenis kelamin.
- issue: Sifat kenajisan dalam יִטְמָא
  choice: menjadi najis
  alternative: akan najis
  rationale: Pilihan ini menunjukkan perubahan status akibat sentuhan tanpa menambahkan penjelasan teologis yang tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan dengan jelas, sedangkan idiom Ibrani dialihkan secara alami. Istilah 'najis' mempertahankan register hukum ritual tanpa penjelasan tambahan di dalam teks.
