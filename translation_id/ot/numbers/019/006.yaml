  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: id
  text: Kemudian imam harus mengambil kayu aras, hisop, dan benang merah tua, lalu melemparkan semuanya ke tengah api yang membakar sapi betina itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lembu betina muda.” Kata Ibrani פָּרָה berarti hewan sapi betina; dalam banyak terjemahan tradisional di bagian ini diterjemahkan “lembu betina muda.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Waw dengan bentuk qatal meneruskan urutan tindakan dalam ketentuan ritual. “Kemudian” menyatakan urutan, sedangkan “harus” mempertahankan daya preskriptifnya dalam bahasa Indonesia alami.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku bagi כֹּהֵן dalam konteks peribadatan; ketakrifan dinyatakan secara alami oleh konteks bahasa Indonesia.
- source_word: עֵץ אֶרֶז
  choice: kayu aras
  rationale: Frasa konstruksi ini secara harfiah berarti kayu dari pohon aras. “Kayu aras” adalah padanan Indonesia yang alami dan tetap menyatakan bahannya.
- source_word: וְאֵזוֹב
  choice: hisop
  rationale: “Hisop” merupakan padanan konvensional bagi אֵזוֹב. Identifikasi botanisnya tidak sepenuhnya pasti, sehingga nama tradisional dipertahankan tanpa mempersempitnya pada spesies tertentu.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: benang merah tua
  rationale: Frasa ini menunjuk pada bahan yang diwarnai merah tua dengan zat pewarna yang terkait dengan serangga penghasil warna tersebut. “Benang merah tua” sesuai dengan benda ritual yang dimaksud dan tidak menerjemahkan unsur “ulat” secara menyesatkan.
- source_word: וְהִשְׁלִיךְ
  choice: lalu melemparkannya
  rationale: Bentuk hifil dari שלך berarti melemparkan. Pronomina “-nya” secara alami merujuk pada ketiga bahan yang baru disebutkan, dan “lalu” melanjutkan urutan ritual.
- source_word: אֶל תּוֹךְ
  choice: ke tengah-tengah
  rationale: Ungkapan ini menandakan gerakan masuk ke bagian dalam atau tengah, bukan sekadar mendekati sesuatu.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: pembakaran sapi betina itu
  rationale: שְׂרֵפָה menunjuk pada tindakan atau proses pembakaran, bukan hanya api, sedangkan פָּרָה ialah sapi betina. Kata “itu” menandai hewan tertentu yang telah disebut dalam konteks sebelumnya.
theological_decisions:
- issue: Penerjemahan פָּרָה dalam ritual penyucian dengan sapi betina merah
  choice: sapi betina
  alternative: lembu betina muda
  rationale: Kata Ibrani itu menyatakan hewan bovina betina dan tidak dengan sendirinya menuntut penekanan pada usia muda. “Sapi betina” jelas bagi pembaca modern, sementara padanan tradisional dicatat tanpa menjadikannya lebih khusus daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan urutan prosedural hukum ritual tanpa memakai ungkapan yang arkais. Penanda catatan kaki ditempatkan sesudah “sapi betina itu,” yakni pada unsur yang diterangkan oleh catatan.
