  text: וְ/כִבֶּ֨ס בְּגָדָ֜י/ו הַ/כֹּהֵ֗ן וְ/רָחַ֤ץ בְּשָׂר/וֹ֙ בַּ/מַּ֔יִם וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/טָמֵ֥א הַ/כֹּהֵ֖ן עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: id
  text: Kemudian imam itu harus mencuci pakaiannya dan membasuh tubuhnya dengan air. Sesudah itu ia boleh masuk ke perkemahan, tetapi imam itu tetap najis sampai petang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Najis” di sini menunjuk pada kenajisan ritual, bukan berarti imam itu berdosa atau bersalah secara moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Bentuk Piel כבס berarti mencuci pakaian. Dalam konteks hukum ritual, 'harus' menyampaikan kewajiban prosedural secara wajar dalam bahasa Indonesia.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: membasuh tubuhnya dengan air
  rationale: בשר menunjuk pada tubuh dalam konteks pembasuhan ritual. 'Membasuh tubuhnya dengan air' alami dan tidak menimbulkan nuansa lain dari terjemahan harfiah 'dagingnya'.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai urutan tindakan ritual secara jelas dan alami.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: ia boleh masuk ke perkemahan
  rationale: Bentuk imperfek dalam urutan ini paling wajar dipahami sebagai izin untuk masuk kembali setelah pembasuhan, bukan sebagai perintah mandiri; unsur izin tetap menyisakan status najis hingga petang.
- source_word: וְטָמֵא הַכֹּהֵן עַד־הָעָרֶב
  choice: tetapi imam itu tetap najis sampai petang
  rationale: '''Tetap najis'' memperjelas bahwa pembasuhan dan masuknya kembali ke perkemahan tidak langsung mengakhiri status kenajisan ritual. ''Sampai petang'' alami untuk עַד־הָעָרֶב.'
theological_decisions:
- issue: Sifat kenajisan
  choice: kenajisan ritual, bukan kesalahan moral
  alternative: kenajisan moral
  rationale: Dalam konteks Bilangan 19, טמא menyatakan status ritual sementara. Kata 'najis' dipertahankan dalam teks, sedangkan catatan kaki mencegahnya disalahpahami sebagai dosa atau kesalahan moral.
- issue: Masuk ke perkemahan sebelum berakhirnya masa kenajisan
  choice: diizinkan masuk setelah membasuh diri meskipun tetap najis sampai petang
  alternative: baru masuk sesudah petang
  rationale: Urutan Ibrani menempatkan masuk ke perkemahan setelah pembasuhan, lalu secara eksplisit menyatakan bahwa imam masih najis sampai petang. Terjemahan mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pakaian', 'tubuh', dan 'perkemahan' dipilih agar mudah dipahami; istilah tradisional 'najis' dipertahankan karena tepat bagi konteks ritual dan dijelaskan melalui catatan kaki.
