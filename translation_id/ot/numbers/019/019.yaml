  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: id
  text: Orang yang tahir harus memercikkan air itu kepada orang yang najis pada hari ketiga dan pada hari ketujuh. Dengan demikian, ia harus menyucikannya[a] pada hari ketujuh. Kemudian, orang yang disucikan itu harus mencuci pakaiannya dan membasuh tubuhnya dengan air; ia akan menjadi tahir pada waktu petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: membersihkannya dari kenajisan. Kata kerja Ibrani ini berakar sama dengan kata yang sering berkaitan dengan dosa, tetapi di sini menunjuk pada penyucian ritual dari kenajisan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: harus memercikkan
  rationale: Bentuk Hifil dari נזה dalam konteks ritual menunjuk pada tindakan memercikkan air pemurnian. 'Memercikkan' alami dalam bahasa Indonesia dan mempertahankan tindakan ritualnya.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: orang yang tahir / orang yang najis
  rationale: Kedua kata sifat dipakai sebagai nomina dan menunjuk pada status ritual. 'Orang' mempertahankan cakupan umum hukum ini, sedangkan 'tahir' dan 'najis' membedakan status ritual tanpa menyiratkan penilaian moral.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketiga dan pada hari ketujuh
  rationale: Pengulangan 'pada' mencerminkan struktur Ibrani dan menegaskan kedua waktu pelaksanaan ritual.
- source_word: וְחִטְּאוֹ
  choice: Dengan demikian, ia harus menyucikannya
  rationale: Bentuk Piel dari חטא dalam konteks kenajisan karena mayat berarti memurnikan atau menyucikan dari kenajisan, bukan mengampuni dosa moral. 'Dengan demikian' menyampaikan hubungan hasil dalam rangkaian tindakan.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: '''Mencuci pakaiannya'' merupakan padanan langsung dan wajar dalam bahasa Indonesia modern.'
- source_word: וְרָחַץ בַּמַּיִם
  choice: membasuh tubuhnya dengan air
  rationale: Kata רחץ dalam rangkaian ritual ini menyiratkan pembasuhan diri. Penyebutan 'tubuhnya' membuat makna refleksif itu jelas dan alami dalam bahasa Indonesia.
- source_word: וְטָהֵר בָּעָרֶב
  choice: ia akan menjadi tahir pada waktu petang
  rationale: Ungkapan ini menunjukkan tercapainya kembali status tahir ketika petang tiba. 'Menjadi tahir' menyatakan perubahan status, dan 'pada waktu petang' sesuai dengan laras hukum-ritual.
theological_decisions:
- issue: Sifat penyucian dalam pemakaian חטא dan טהר
  choice: Diterjemahkan sebagai penyucian ritual dari kenajisan
  alternative: Membersihkan dari dosa atau mengadakan pendamaian baginya
  rationale: Konteksnya ialah kenajisan karena mayat dan pemakaian air pemurnian. Bahasa yang secara eksplisit menyatakan pengampunan dosa atau pendamaian akan memasukkan klaim moral-teologis yang tidak dinyatakan ayat ini.
- issue: Cakupan gender הַטָּהֹר dan הַטָּמֵא
  choice: orang yang tahir / orang yang najis
  alternative: laki-laki yang tahir / laki-laki yang najis
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam materi hukum bentuk ini bersifat representatif dan tidak membatasi ritual tersebut hanya kepada laki-laki.
- issue: Pelaku pencucian setelah pemercikan
  choice: orang yang disucikan itu
  alternative: mempertahankan pronomina 'ia' yang dapat merujuk kepada orang tahir atau orang najis
  rationale: Konteks dekat dan rangkaian ketentuan pemurnian menunjukkan bahwa orang yang semula najis dan kini disucikanlah yang mencuci pakaian serta tubuhnya. Penyebutan ini mencegah ambiguitas pronomina Indonesia tanpa mengubah alur ritual.
translation_notes:
  register: Bahasa Indonesia modern dengan laras hukum-ritual yang bermartabat. Istilah 'tahir' dan 'najis' dipertahankan karena tepat dan lazim dalam konteks ritual. Rujukan tersirat kepada air pemurnian dinyatakan sebagai 'air itu' agar tindakan memercikkan lengkap dan jelas.
