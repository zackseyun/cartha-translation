  source_fidelity: 'Terjemahan mengikuti urutan dan fungsi verba Ibrani dengan baik: orang yang tahir memercikkan air yang tersirat dalam konteks kepada orang yang najis pada hari ketiga dan ketujuh, lalu melakukan penyucian ritual pada hari ketujuh. Tindakan mencuci pakaian dan membasuh diri dipahami, sesuai konteks langsung hukum pemurnian, sebagai kewajiban orang yang semula najis. Frasa "air itu" secara wajar melengkapi objek yang tersirat dari konteks tanpa mengubah makna.'
