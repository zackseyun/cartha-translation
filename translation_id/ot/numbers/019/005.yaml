  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: id
  text: Ia harus membakar sapi betina itu di hadapannya; kulitnya, dagingnya, darahnya, beserta kotorannya harus dibakarnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Ia harus membakar
  rationale: Bentuk waw + qatal dalam rangkaian petunjuk ritual menyatakan tindakan yang diwajibkan; “harus membakar” wajar dan tegas dalam bahasa Indonesia.
- source_word: הַפָּרָה
  choice: sapi betina itu
  rationale: פָּרָה menunjuk pada lembu/sapi betina. Pilihan ini menyatakan jenis kelaminnya tanpa menambahkan gagasan bahwa hewan itu harus muda.
- source_word: לְעֵינָיו
  choice: di depan matanya
  rationale: Ungkapan harfiah ini berarti dalam penglihatan atau kehadirannya; terjemahan tersebut mempertahankan gambaran konkret bahasa Ibrani.
- source_word: עֹרָהּ
  choice: kulitnya
  rationale: עוֹר berarti kulit atau belulang; “kulitnya” merupakan padanan Indonesia yang langsung dan alami dalam konteks tubuh hewan.
- source_word: בְּשָׂרָהּ
  choice: dagingnya
  rationale: בָּשָׂר berarti daging; dalam konteks tubuh hewan, “dagingnya” lebih alami daripada “tubuhnya” dan tetap spesifik.
- source_word: דָּמָהּ
  choice: darahnya
  rationale: Padanan langsung bagi דָּם dengan akhiran pronominal feminin.
- source_word: עַל פִּרְשָׁהּ
  choice: beserta kotorannya
  rationale: פֶּרֶשׁ menunjuk pada kotoran atau tinja hewan, sedangkan עַל dalam daftar ini menyatakan penyertaan; “beserta” mengomunikasikan bahwa kotoran itu ikut dibakar.
- source_word: יִשְׂרֹף
  choice: harus dibakarnya
  rationale: Bentuk imperfek dalam petunjuk hukum menyatakan kewajiban. Susunan ini mempertahankan pengulangan kata kerja penutup dan penekanannya dalam bahasa Ibrani.
theological_decisions: []
