  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: id
  text: Yahweh berfirman kepada Musa dan kepada Harun,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר membuka peristiwa tutur baru. Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan padanan wajar dan bermartabat untuk tindakan berbicara oleh Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang disapa; “kepada Musa” adalah ungkapan Indonesia yang alami dan tepat.
- source_word: וְאֶל אַהֲרֹן
  choice: dan kepada Harun
  rationale: Konjungsi dan preposisi yang diulang dipertahankan untuk menunjukkan bahwa Harun adalah pihak kedua yang disapa secara eksplisit.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri; ditandai dengan koma
  rationale: Dalam formula pengantar ujaran Ibrani, לֵאמֹר menghubungkan verba berbicara dengan kutipan yang menyusul. Dalam bahasa Indonesia modern, fungsi ini lebih alami dinyatakan dengan tanda baca daripada “dengan berkata” atau “demikian” pada akhir ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan “kepada” mempertahankan struktur koordinatif Ibrani. Koma akhir menunjukkan bahwa ujaran berlanjut pada ayat berikutnya.
