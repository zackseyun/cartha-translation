  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: id
  text: Kalian harus menyerahkan sapi betina itu kepada Imam Eleazar. Ia harus membawanya ke luar perkemahan, lalu sapi itu harus disembelih di hadapannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai verba aktif dengan subjek yang tidak dinyatakan secara eksplisit. Secara gramatikal, subjeknya juga dapat dipahami tetap Eleazar: “lalu Eleazar menyembelihnya di hadapannya sendiri.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: Kamu harus menyerahkan
  rationale: Bentuk jamak orang kedua dalam rangkaian ketetapan berfungsi sebagai perintah. “Harus menyerahkan” menyampaikan daya perintah secara wajar dalam bahasa Indonesia modern.
- source_word: אֹתָהּ
  choice: sapi betina itu / -nya
  rationale: Pronomina feminin tunggal mengacu kepada sapi betina merah yang disebut dalam konteks sebelumnya. Penyebutan eksplisit pada awal ayat memperjelas rujukan, sedangkan “-nya” digunakan secara alami pada kemunculan berikutnya.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: kepada Imam Eleazar
  rationale: Urutan gelar di depan nama merupakan bentuk Indonesia yang alami untuk menyatakan Eleazar sebagai imam.
- source_word: וְהוֹצִיא
  choice: Ia harus membawanya ke luar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar, sehingga “membawa ... ke luar” mempertahankan makna kausatifnya.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Ungkapan ini menyatakan gerak menuju tempat di luar batas perkemahan. “Ke luar perkemahan” ringkas dan alami.
- source_word: וְשָׁחַט
  choice: lalu sapi itu harus disembelih
  rationale: Verba Ibrani berbentuk aktif orang ketiga maskulin tunggal tetapi subjeknya tidak disebutkan. Bentuk pasif Indonesia menghindari penambahan pelaku yang tidak dinyatakan sekaligus tidak memastikan bahwa Eleazar sendiri menyembelihnya.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Terjemahan alami untuk ungkapan yang berarti di depan atau dalam kehadiran seseorang; akhiran pronomina maskulin tunggal paling wajar mengacu kepada Eleazar.
theological_decisions:
- issue: Identitas orang yang menyembelih sapi betina
  choice: Pelaku tidak disebutkan; penyembelihan berlangsung di hadapan Eleazar.
  alternative: Eleazar sendiri membawanya ke luar dan menyembelihnya.
  rationale: Rangkaian verba orang ketiga maskulin tunggal dapat mempertahankan Eleazar sebagai subjek, tetapi frasa “di hadapannya” dapat menunjukkan bahwa orang lain menyembelih sapi itu sementara Eleazar hadir. Terjemahan pasif mempertahankan ketidakjelasan pelaku tanpa meniadakan kemungkinan gramatikal bahwa Eleazar terlibat langsung.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kamu” mewakili sapaan jamak kepada umat dalam konteks ketetapan; “harus” mempertahankan daya perintah. Bentuk pasif pada klausa terakhir digunakan untuk menjaga ambiguitas sumber mengenai pelaku penyembelihan.
