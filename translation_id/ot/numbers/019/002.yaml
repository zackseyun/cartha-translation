source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: id
  text: '“Inilah ketetapan hukum yang diperintahkan TUHAN[a]: Katakanlah kepada orang Israel supaya mereka membawa kepadamu seekor sapi betina merah yang sempurna, yang tidak memiliki cacat, dan yang belum pernah dipasangi kuk.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai nama ilahi יהוה (YHWH), yang secara tradisional diterjemahkan “TUHAN”.
    reason: Menjelaskan dasar tekstual dan konvensi penerjemahan nama ilahi.
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: ketetapan hukum
  rationale: חֻקָּה menunjuk ketetapan yang mengikat, sedangkan תּוֹרָה dalam konteks ini berarti hukum atau petunjuk; ungkapan ini dibuat alami dalam bahasa Indonesia tanpa mempersempitnya menjadi istilah denominasi tertentu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi dalam pemakaian ini menunjuk bangsa Israel; 'orang Israel' lebih alami dalam bahasa Indonesia modern.
- source_word: פָרָה אֲדֻמָּה
  choice: sapi betina merah
  rationale: פָרָה secara khusus adalah sapi betina, dan אֲדֻמָּה menyatakan warna merah.
- source_word: תְּמִימָה
  choice: yang utuh
  rationale: Kata ini dapat berarti utuh, lengkap, atau tanpa cela. 'Utuh' mempertahankan nuansanya dan tidak meleburkannya dengan frasa berikutnya tentang tidak adanya cacat.
- source_word: אֵין בָּהּ מוּם
  choice: yang tidak memiliki cacat
  rationale: Menerjemahkan secara langsung pernyataan bahwa tidak ada cacat fisik padanya, sambil mempertahankan pembedaan dari תְּמִימָה.
- source_word: לֹא עָלָה עָלֶיהָ עֹל
  choice: yang belum pernah dipasangi kuk
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa kuk belum pernah naik ke atasnya; padanan Indonesia ini menyampaikan bahwa hewan itu belum pernah dikenai kuk.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Memakai konvensi Alkitab bahasa Indonesia yang dikenal luas, dengan catatan kaki yang secara terbuka menunjukkan bentuk nama dalam teks Ibrani.
- issue: Hubungan antara תְּמִימָה dan מוּם
  choice: Mempertahankan keduanya sebagai 'utuh' dan 'tidak memiliki cacat'
  alternative: Menggabungkannya menjadi satu ungkapan seperti 'tanpa cela'
  rationale: Teks sumber memakai dua keterangan yang berdekatan namun tidak identik; mempertahankan keduanya menghindari penghapusan penekanan dan kemungkinan nuansa masing-masing.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk perintah disampaikan dengan jelas, sedangkan pengulangan kualifikasi sapi dipertahankan untuk mencerminkan struktur dan penekanan teks Ibrani.
