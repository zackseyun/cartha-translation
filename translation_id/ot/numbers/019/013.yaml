id: NUM.19.13
reference: Numbers 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: id
  text: Setiap orang yang menyentuh mayat, yaitu tubuh manusia yang telah mati, tetapi tidak menyucikan dirinya, telah menajiskan Kemah Suci TUHAN. Orang itu harus diputuskan dari Israel. Karena air penghapus kenajisan[a] tidak dipercikkan kepadanya, ia tetap najis; kenajisannya masih melekat padanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air kenajisan”; maksudnya air yang dipakai untuk menghapus kenajisan akibat bersentuhan dengan mayat. Dapat juga diterjemahkan “air penyucian.”
    reason: Menjelaskan ungkapan ritual מֵי נִדָּה dan mempertahankan alternatif yang lebih harfiah.
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: menyentuh mayat
  rationale: Kata נגע menyatakan kontak fisik, sedangkan מֵת dalam konteks ini menunjuk kepada orang yang sudah mati. Frasa ini langsung, alami, dan sesuai dengan konteks kenajisan akibat mayat.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: yaitu tubuh manusia yang telah mati
  rationale: Dalam hukum kenajisan karena mayat, נֶפֶשׁ secara konkret menunjuk kepada tubuh atau jenazah. אָדָם bersifat generik, sehingga 'manusia' mencakup setiap orang tanpa mengubah maknanya.
- source_word: יִתְחַטָּא
  choice: menyucikan dirinya
  rationale: Bentuk hitpael dari חטא di sini mengacu pada proses penyucian ritual, bukan pertobatan moral. 'Menyucikan dirinya' jelas dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: מִשְׁכַּן יְהוָה
  choice: Kemah Suci TUHAN
  rationale: מִשְׁכָּן adalah tempat kediaman kudus atau tabernakel. 'Kemah Suci' merupakan istilah Indonesia yang alami dan tepat dalam konteks perjalanan Israel.
- source_word: טִמֵּא
  choice: telah menajiskan
  rationale: Bentuk piel menyatakan bahwa orang itu menyebabkan tempat kudus menjadi najis. 'Menajiskan' mempertahankan bobot ritual dan keseriusan tindakan tersebut.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל
  choice: Orang itu harus dilenyapkan dari Israel
  rationale: נֶפֶשׁ di sini berarti orang atau individu. 'Dilenyapkan dari Israel' mempertahankan rumusan sanksi perjanjian tanpa secara eksplisit menentukan apakah pelaksanaannya berupa kematian, pengucilan, atau hukuman ilahi lainnya.
- source_word: מֵי נִדָּה
  choice: air penghapus kenajisan
  rationale: Frasa harfiahnya adalah 'air kenajisan', tetapi air ini digunakan untuk menghapus kenajisan akibat mayat. Pilihan ini mencegah kesan keliru bahwa air itu sendiri najis, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: זֹרַק עָלָיו
  choice: tidak dipercikkan kepadanya
  rationale: Dalam upacara ini, זרה berarti memercikkan cairan kepada seseorang. Bentuk pasif Indonesia mencerminkan konstruksi sumber dan berfokus pada tidak dilakukannya ritus itu terhadap orang tersebut.
- source_word: טָמֵא יִהְיֶה
  choice: ia tetap najis
  rationale: Klausa ini menyatakan berlanjutnya status najis. 'Tetap najis' alami dalam bahasa Indonesia dan selaras dengan klausa penutup.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: kenajisannya masih melekat padanya
  rationale: עוֹד menandakan keberlanjutan, sedangkan ungkapan טֻמְאָתוֹ בוֹ menggambarkan kenajisan yang masih ada pada orang itu. 'Masih melekat padanya' mempertahankan metafora tersebut secara alami.
theological_decisions:
- issue: Makna sanksi וְנִכְרְתָה, 'dilenyapkan' atau 'diputuskan'
  choice: Memakai rumusan 'harus dilenyapkan dari Israel' tanpa menentukan cara atau pelaksana hukumannya.
  alternative: Harus dihukum mati; harus dikucilkan dari umat.
  rationale: Rumusan Ibrani memiliki bobot hukum dan perjanjian, tetapi ayat ini tidak menjelaskan apakah sanksinya berupa kematian, pengucilan, atau tindakan hukuman ilahi. Terjemahan tidak boleh menyelesaikan ketegangan itu secara sepihak.
- issue: Cakupan אָדָם dalam bentuk tunggal generik
  choice: Menerjemahkannya sebagai 'manusia'.
  alternative: Laki-laki; seseorang.
  rationale: אָדָם di sini menunjuk kepada manusia secara generik, bukan khusus kepada laki-laki. 'Manusia' mempertahankan cakupan sumber dengan jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual seperti 'menyucikan', 'menajiskan', dan 'najis' dipertahankan karena tepat secara konteks dan dikenal luas. Tanda baca membagi rangkaian Ibrani yang panjang menjadi kalimat-kalimat yang mudah dipahami tanpa mengubah hubungan sebab-akibatnya.
