  terminology: “Kemah Suci TUHAN,” “menyucikan dirinya,” “menajiskan,” “najis,” dan “kenajisan” tepat dan konsisten. Rumusan sanksi perlu diganti dengan “diputuskan dari Israel” agar istilah perjanjian itu tetap terbuka tanpa mengimpor penafsiran tertentu.
