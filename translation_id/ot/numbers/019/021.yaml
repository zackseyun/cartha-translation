  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: id
  text: 'Ketetapan ini berlaku bagi mereka untuk selama-lamanya: orang yang memercikkan air penghapus kenajisan[a] harus mencuci pakaiannya, dan orang yang menyentuh air penghapus kenajisan menjadi najis sampai petang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air kenajisan”; dalam konteks ini, air untuk menghapus kenajisan. Secara tradisional, “air pemisahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: Ketetapan ini harus berlaku bagi mereka untuk selamanya
  rationale: Menyatakan daya berlaku hukum yang terus-menerus. Bentuk feminin tunggal dipahami dengan חֻקָּה sebagai ketetapan yang tersirat, sedangkan עוֹלָם diterjemahkan secara alami sebagai 'untuk selamanya' dalam konteks hukum perjanjian.
- source_word: וּמַזֵּה
  choice: orang yang memercikkan
  rationale: Partisipel ini berfungsi sebagai nomina dan menunjuk kepada pelaksana tindakan ritual.
- source_word: מֵי הַנִּדָּה
  choice: air penghapus kenajisan
  rationale: Secara harfiah ungkapan ini berarti 'air kenajisan', tetapi dalam konteks Bilangan 19 menunjuk kepada air yang dipakai untuk menghapus kenajisan akibat mayat. Pilihan ini jelas dalam bahasa Indonesia tanpa mengubah kenajisan ritual menjadi kesalahan moral; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: כִּבֵּס berarti mencuci pakaian; 'pakaian' merupakan padanan Indonesia modern dan alami. Bentuk kewajiban hukum dinyatakan dengan 'harus'.
- source_word: וְהַנֹּגֵעַ
  choice: dan orang yang menyentuh
  rationale: Partisipel substantival ini sejajar dengan 'orang yang memercikkan'.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: menjadi najis sampai petang
  rationale: יִטְמָא menyatakan keadaan atau akibat kenajisan ritual. 'Sampai petang' adalah ungkapan Indonesia yang alami dan tepat untuk עַד הָעֶרֶב.
theological_decisions:
- issue: Istilah kenajisan ritual dalam Bilangan 19
  choice: Menggunakan 'najis' dan 'air penghapus kenajisan' dalam arti ritual
  alternative: Menerjemahkan secara harfiah sebagai 'air kenajisan' atau secara tradisional sebagai 'air pemisahan'
  rationale: Ayat ini membahas status kemurnian ritual, bukan kesalahan moral. Terjemahan utama memperjelas fungsi air berdasarkan konteks langsung, sementara konstruksi Ibrani yang lebih harfiah dipertahankan dalam catatan kaki.
- issue: Nuansa יִטְמָא setelah menyentuh air
  choice: menjadi najis
  alternative: akan tetap najis atau harus dianggap najis
  rationale: Bentuk verba paling wajar menyatakan bahwa sentuhan tersebut mengakibatkan status najis sampai petang, tanpa menambahkan penafsiran teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'najis' dipertahankan sebagai istilah ritual yang lazim; susunan kalimat dibuat alami bagi pembaca umum sambil menjaga paralelisme kedua partisipel Ibrani.
