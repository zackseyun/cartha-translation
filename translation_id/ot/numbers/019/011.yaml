  text: הַ/נֹּגֵ֥עַ בְּ/מֵ֖ת לְ/כָל נֶ֣פֶשׁ אָדָ֑ם וְ/טָמֵ֖א שִׁבְעַ֥ת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: id
  text: Siapa pun yang menyentuh mayat[a] manusia mana pun[b] akan menjadi najis selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang mati.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “setiap jiwa manusia,” yakni setiap manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Siapa pun yang menyentuh
  rationale: Partisipel dengan kata sandang berfungsi secara substantival dan umum. Ungkapan ini menyampaikan ketentuan yang berlaku bagi siapa saja dengan bahasa Indonesia yang alami.
- source_word: בְּמֵת
  choice: mayat
  rationale: מֵת menunjuk kepada orang yang telah mati. Dalam konteks tindakan menyentuh dan kenajisan ritual, “mayat” merupakan padanan konkret, ringkas, dan wajar.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: manusia mana pun
  rationale: Frasa ini menegaskan bahwa ketentuan tersebut mencakup jenazah setiap manusia, bukan hanya laki-laki. “Manusia mana pun” mempertahankan cakupan umum sumber Ibrani.
- source_word: וְטָמֵא
  choice: akan menjadi najis
  rationale: Bentuk ini menyatakan akibat hukum/ritual dari tindakan tersebut. “Akan menjadi najis” lebih alami dalam bahasa Indonesia daripada mempertahankan konjungsi secara harfiah.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Kata “selama” memperjelas bahwa tujuh hari merupakan jangka waktu kenajisan, sebagaimana dimaksud oleh frasa Ibrani.
theological_decisions:
- issue: Cakupan אָדָם dalam ketentuan hukum ritual
  choice: manusia
  alternative: laki-laki / orang
  rationale: אָדָם di sini bersifat generik dan merujuk kepada manusia tanpa pembatasan jenis kelamin. “Manusia” menyampaikan cakupan tersebut tanpa menambahkan kekhususan yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah “najis” dipertahankan sebagai istilah baku untuk status ritual dalam konteks hukum Taurat.
