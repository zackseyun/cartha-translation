  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: id
  text: Bagi orang yang najis itu, mereka harus mengambil sedikit debu dari pembakaran kurban pemurnian[a], lalu seseorang harus menuangkan air hidup[b] ke atasnya di dalam sebuah bejana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan yang lebih tradisional, “abu bekas pembakaran kurban penghapus dosa.” Kata Ibrani yang diterjemahkan “debu” memang berarti debu atau bahan halus, sedangkan חטאת dalam konteks ritual dapat berarti “kurban penghapus dosa” atau, berdasarkan fungsinya, “kurban pemurnian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “air hidup,” yaitu air segar dari mata air atau aliran air.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: haruslah diambil
  rationale: Bentuk jamak dalam ketentuan hukum menyatakan tindakan yang diwajibkan. Bentuk pasif Indonesia menjaga kealamian tanpa menetapkan pelaku yang tidak disebutkan.
- source_word: לַטָּמֵא
  choice: untuk orang yang najis itu
  rationale: Adjektiva berartikel menunjuk kepada orang yang berada dalam keadaan najis secara ritual; kata 'itu' mencerminkan ketakrifannya.
- source_word: מֵעֲפַר
  choice: sedikit debu
  rationale: עפר secara leksikal berarti debu atau bahan halus, bukan istilah Ibrani yang lazim untuk abu; 'sedikit' menyampaikan nuansa partitif מן.
- source_word: שְׂרֵפַת
  choice: bekas pembakaran
  rationale: Dalam konteks ini frasa menunjuk pada bahan halus yang dihasilkan dari pembakaran. Pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan proses pembakaran yang dinyatakan teks.
- source_word: הַחַטָּאת
  choice: kurban pemurnian
  rationale: Dalam hukum imamat, חטאת dapat menamai kurban yang berfungsi menghapus kenajisan ritual. Terjemahan tradisional 'kurban penghapus dosa' dicatat dalam catatan kaki.
- source_word: וְנָתַן
  choice: lalu seseorang harus menuangkan
  rationale: Peralihan dari verba jamak ke tunggal paling wajar dipahami sebagai pelaku tunggal tak tentu. 'Seseorang' mempertahankan ketidaktentuan itu, sedangkan 'menuangkan' sesuai dengan penempatan air ke atas bahan dalam bejana.
- source_word: עָלָיו
  choice: ke atasnya
  rationale: Pronomina tunggal paling mungkin merujuk pada debu atau bahan bekas pembakaran yang baru disebutkan.
- source_word: מַיִם חַיִּים
  choice: air hidup
  rationale: Terjemahan harfiah mempertahankan ungkapan Ibrani dan gema alkitabiahnya; makna idiomatisnya dijelaskan sebagai air segar dari sumber yang mengalir.
- source_word: אֶל כֶּלִי
  choice: di dalam sebuah bejana
  rationale: Preposisi menunjukkan bahwa pencampuran berlangsung dalam wadah. 'Bejana' sesuai dengan ragam ritual yang bermartabat.
theological_decisions:
- issue: Makna חטאת dalam konteks kenajisan ritual
  choice: kurban pemurnian
  alternative: kurban penghapus dosa
  rationale: Konteks lembu betina merah berhubungan dengan pemulihan dari kenajisan ritual. 'Kurban pemurnian' menyatakan fungsi ritus tanpa meniadakan terjemahan tradisional, yang dipertahankan dalam catatan kaki.
- issue: Makna idiom מַיִם חַיִּים
  choice: air hidup
  alternative: air segar atau air mengalir
  rationale: Pilihan harfiah mempertahankan bentuk dan resonansi ungkapan sumber, sedangkan catatan kaki menjelaskan rujukan praktisnya tanpa mempersempitnya secara berlebihan.
- issue: Perubahan jumlah pelaku dari jamak ke tunggal
  choice: pasif jamak tak tersurat, lalu pelaku tunggal tak tentu
  alternative: mereka harus mengambil ... lalu ia harus menuangkan
  rationale: Bahasa Ibrani beralih dari לָקְחוּ yang jamak ke וְנָתַן yang tunggal. Rumusan Indonesia mempertahankan peralihan tersebut tanpa menentukan identitas atau jenis kelamin pelaku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum-ritual yang bermartabat. Bentuk pasif pada klausa pertama dan 'seseorang' pada klausa kedua menjaga kealamian sekaligus mempertahankan perubahan dari verba jamak ke tunggal dalam bahasa Ibrani. Semua penanda catatan kaki muncul dalam teks utama.
