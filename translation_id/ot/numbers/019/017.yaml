  terminology: “Najis” tepat dalam register hukum-ritual. “Kurban pemurnian” adalah pilihan yang dapat dipertahankan untuk חטאת dalam konteks ini, asalkan alternatif tradisional “kurban penghapus dosa” tetap dicatat. “Bejana” sesuai untuk כֶּלִי.
