id: NUM.19.10
reference: Numbers 19:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: id
  text: Orang yang mengumpulkan abu sapi betina itu harus mencuci pakaiannya dan akan menjadi najis sampai petang. Ketentuan ini berlaku bagi orang Israel[a] dan bagi pendatang yang tinggal di tengah-tengah mereka sebagai ketetapan untuk selamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; ungkapan Ibrani ini merupakan sebutan kolektif bagi orang Israel.'
    reason: Bentuk harfiah dan fungsi kolektif ungkapan sumber perlu tersedia bagi pembaca.
  - marker: b
    text: 'Atau: “sebagai ketetapan tetap.”'
    reason: Memberikan alternatif untuk rumusan durasi לְחֻקַּת עוֹלָם tanpa mempersempit cakupan maknanya.
lexical_decisions:
- source_word: הָאֹסֵף
  choice: orang yang mengumpulkan
  rationale: Partisipel Qal berartikel dipakai sebagai nomina untuk menunjuk pelaku. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan sifat partisipialnya.
- source_word: אֵפֶר הַפָּרָה
  choice: abu sapi betina itu
  rationale: אֵפֶר merupakan nomina kolektif, yang secara alami diterjemahkan 'abu'. פָּרָה secara khusus menunjuk sapi betina; kata penentu pada bahasa Ibrani tercermin dalam 'itu' karena hewan tersebut telah dibahas dalam konteks sebelumnya.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: harus mencuci pakaiannya
  rationale: Dalam peraturan kenajisan ritual, verba ini berarti mencuci pakaian. 'Harus' menyampaikan daya wajib dari ketentuan hukum secara wajar dalam bahasa Indonesia modern.
- source_word: וְטָמֵא
  choice: dan akan menjadi najis
  rationale: Ungkapan ini menyatakan status kenajisan ritual sebagai akibat dari tindakan tersebut, bukan keburukan moral. 'Menjadi najis' membuat perubahan status itu jelas tanpa menambah penilaian etis.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Padanan ringkas dan alami bagi batas waktu yang dinyatakan oleh teks Ibrani.
- source_word: וְהָיְתָה
  choice: Ketentuan ini berlaku
  rationale: Bentuk feminin tunggal merujuk pada ketentuan ritual yang tersirat dalam peraturan sebelumnya. 'Ketentuan ini berlaku' memperjelas rujukannya secara alami.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Secara harfiah ungkapan ini berbunyi 'bagi anak-anak Israel', tetapi berfungsi sebagai sebutan kolektif bagi umat Israel. 'Orang Israel' mempertahankan rujukan kolektif tanpa menimbulkan kesan bahwa hanya anak laki-laki yang dimaksud; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: dan bagi pendatang yang tinggal di tengah-tengah mereka
  rationale: גֵּר menunjuk orang bukan pribumi yang menetap dalam masyarakat Israel. 'Pendatang yang tinggal' mencerminkan pengulangan akar kata dalam bahasa Ibrani dan menghindari konotasi politis modern dari istilah lain.
- source_word: לְחֻקַּת עוֹלָם
  choice: sebagai ketetapan untuk selamanya
  rationale: חֻקָּה adalah ketetapan yang tetap atau resmi, sedangkan עוֹלָם dalam rumusan hukum menyatakan keberlakuan yang terus berlangsung. Pilihan ini mempertahankan kuatnya rumusan durasi tanpa menentukan lebih jauh cakupan teologisnya.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; umat Israel
  rationale: Ungkapan maskulin jamak ini merupakan sebutan perjanjian yang bersifat kolektif. Terjemahan utama menyatakan fungsi kolektifnya, sedangkan bentuk harfiah dipertahankan dalam catatan kaki agar bentuk sumber tetap terlihat.
- issue: Makna kenajisan ritual
  choice: najis
  alternative: tidak tahir
  rationale: Konteksnya adalah status ritual, bukan kesalahan atau kecemaran moral. 'Najis' merupakan istilah yang jelas dan lazim dalam bahasa Indonesia untuk ranah hukum pentahiran ini.
- issue: Durasi dalam חֻקַּת עוֹלָם
  choice: ketetapan untuk selamanya
  alternative: ketetapan tetap; ketetapan turun-temurun
  rationale: עוֹלָם menyatakan keberlangsungan yang tidak dibatasi dalam rumusan perjanjian, tetapi teks ini sendiri tidak menjelaskan hubungan ketetapan tersebut dengan perkembangan teologis selanjutnya. Terjemahan tidak menyelesaikan ketegangan itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan hukum yang jelas. Istilah 'najis' dipakai secara ritual, 'pendatang' dipilih agar mudah dipahami, dan pengulangan sumber dipertahankan secara alami dalam frasa 'pendatang yang tinggal'.
