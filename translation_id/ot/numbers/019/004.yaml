base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: id
  text: Kemudian Imam Eleazar harus mengambil sebagian dari darah lembu betina itu dengan jarinya dan memercikkan sebagian darahnya tujuh kali ke arah bagian depan Kemah Pertemuan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan Kemah Pertemuan.” Ungkapan Ibrani menunjukkan arah menuju bagian depan Kemah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kemudian ... harus mengambil
  rationale: Waw yang diikuti bentuk qatal dalam rangkaian petunjuk ritual menyatakan langkah berikutnya; bentuk ini diterjemahkan sebagai instruksi berurutan.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Nama diri ditransliterasikan secara lazim, dan gelar ditempatkan sebelum nama sesuai ungkapan Indonesia yang alami.
- source_word: מִדָּמָהּ
  choice: sebagian dari darah sapi itu / sebagian darahnya
  rationale: Prefiks מִן dipahami secara partitif. Acuan pronominal kepada sapi betina dari konteks sebelumnya dibuat jelas pada penyebutan pertama, sedangkan pengulangan kedua tetap mempertahankan penekanan Ibrani pada darah.
- source_word: בְּאֶצְבָּעוֹ
  choice: dengan jarinya
  rationale: 'Preposisi בְּ di sini paling alami dipahami secara instrumental: jari dipakai untuk mengambil dan kemudian memercikkan darah.'
- source_word: וְהִזָּה
  choice: dan memercikkan
  rationale: Dalam konteks ritual keimaman, נזה menunjuk pada tindakan memercikkan darah atau air.
- source_word: אֶל נֹכַח פְּנֵי
  choice: ke arah bagian depan
  rationale: Ungkapan ini menyatakan orientasi menuju sisi depan Kemah, bukan tindakan masuk ke dalamnya.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan cukup harfiah bagi nama tempat kudus ini; huruf kapital menandai sebutan khusus.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan langsung yang mempertahankan jumlah ritual secara tepat.
theological_decisions:
- issue: Arah pemercikan darah terhadap Kemah Pertemuan
  choice: ke arah bagian depan Kemah Pertemuan
  alternative: di hadapan Kemah Pertemuan
  rationale: Terjemahan utama mempertahankan nuansa spasial dan arah dari אֶל נֹכַח פְּנֵי tanpa menyimpulkan bahwa Eleazar berada tepat di depan atau di dalam Kemah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur instruksional ritual dipertahankan, sementara acuan pronominal dibuat jelas bagi pembaca Indonesia.
