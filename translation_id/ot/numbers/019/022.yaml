base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: id
  text: Apa pun yang disentuh oleh orang yang najis akan menjadi najis, dan orang yang menyentuhnya[a] akan menjadi najis sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang menyentuh”; objek sentuhannya tidak dinyatakan lagi dalam bahasa Ibrani. Kata Ibrani nefesy dapat berarti “jiwa” atau “nyawa”, tetapi di sini menunjuk kepada seorang pribadi.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Apa pun yang
  rationale: Ungkapan ini menyatakan cakupan menyeluruh dan secara alami memperkenalkan klausa relatif dalam bahasa Indonesia.
- source_word: יִגַּע בּוֹ
  choice: disentuh oleh
  rationale: Bentuk aktif Ibrani dialihkan menjadi pasif agar hubungan antara objek yang disentuh dan orang najis tetap jelas dan alami dalam bahasa Indonesia.
- source_word: הַטָּמֵא
  choice: orang yang najis
  rationale: Adjektiva ini dipakai secara substantival untuk seseorang dalam keadaan kenajisan ritual; 'orang yang najis' membuat rujukannya jelas tanpa memberi kesan kesalahan moral.
- source_word: יִטְמָא
  choice: akan menjadi najis
  rationale: Verba ini menyatakan akibat berupa masuknya sesuatu ke dalam keadaan najis.
- source_word: וְהַנֶּפֶשׁ
  choice: dan orang
  rationale: נֶפֶשׁ secara harfiah dapat berarti 'jiwa' atau 'nyawa', tetapi dalam konteks hukum ini menunjuk kepada pribadi secara utuh.
- source_word: הַנֹּגַעַת
  choice: yang menyentuhnya
  rationale: Partisip ini menggambarkan orang yang melakukan sentuhan. Akhiran '-nya' dipasok dari konteks sebagai rujukan pada sesuatu yang telah menjadi najis, sementara ketiadaan objek tersurat dicatat dalam catatan kaki.
- source_word: תִּטְמָא
  choice: akan menjadi najis
  rationale: Terjemahan ini mempertahankan akibat hukum ritual berupa keadaan najis.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Ini merupakan ungkapan waktu baku dalam peraturan kenajisan dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat istilah kenajisan dalam hukum ritual
  choice: Menerjemahkan טמא sebagai 'najis'.
  alternative: '''cemar'' atau ''berdosa'''
  rationale: Ayat ini membahas kenajisan ritual yang menular melalui sentuhan, bukan dengan sendirinya kesalahan moral. 'Najis' mempertahankan kategori hukum-ritual tersebut.
- issue: Rujukan objek pada הַנֹּגַעַת
  choice: Memasok '-nya' berdasarkan konteks.
  alternative: Menerjemahkan secara lebih harfiah sebagai 'orang yang menyentuh' tanpa objek tersurat.
  rationale: Teks Ibrani tidak menyatakan objek pada partisip kedua, tetapi konteks paling alami menghubungkannya dengan sesuatu yang telah menjadi najis. Catatan kaki mempertahankan keterbukaan bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Istilah 'najis' dipertahankan sebagai istilah hukum-ritual, sedangkan 'petang' memberi nuansa yang bermartabat tanpa menjadi arkais.
