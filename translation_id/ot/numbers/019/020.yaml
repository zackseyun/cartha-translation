id: NUM.19.20
reference: Numbers 19:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: id
  text: Namun, orang yang menjadi najis dan tidak menyucikan dirinya, orang itu harus disingkirkan dari tengah-tengah umat[a], sebab ia telah menajiskan tempat kudus TUHAN. Air pemurnian belum dipercikkan kepadanya[b]; ia najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa itu harus disingkirkan.” Dalam rumusan hukum Ibrani, “jiwa” dapat menunjuk kepada orang seutuhnya, bukan hanya bagian tak berwujud dari manusia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “air kenajisan”; secara tradisional, “air pemisahan.” Ungkapan ini menunjuk kepada air pemurnian yang disiapkan dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: orang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam hukum ini kata tersebut merujuk secara umum kepada seorang anggota umat; 'orang' paling alami dan tepat dalam bahasa Indonesia.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Bentuk qal ini menyatakan masuk ke dalam keadaan kenajisan ritual, bukan tindakan moral mencemarkan diri.
- source_word: יִתְחַטָּא
  choice: menyucikan dirinya
  rationale: Dalam konteks pemurnian, hitpael חטא berarti menjalani tindakan penyucian dari kenajisan, bukan menghapus dosa dalam arti moral biasa.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: orang itu harus disingkirkan
  rationale: נפש dalam rumusan hukum ini menunjuk kepada pribadi seutuhnya. 'Disingkirkan' mempertahankan ketidakjelasan mengenai apakah hukumannya berupa pengucilan, kematian, atau penghukuman ilahi.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: dari tengah-tengah umat
  rationale: קהל menunjuk kepada komunitas perjanjian; 'umat' terdengar alami sekaligus mempertahankan lingkup komunalnya.
- source_word: מִקְדַּשׁ יְהוָה
  choice: tempat kudus TUHAN
  rationale: מקדש adalah tempat atau kawasan suci. Nama ilahi יהוה ditampilkan dengan konvensi Indonesia 'TUHAN'.
- source_word: טִמֵּא
  choice: telah menajiskan
  rationale: Bentuk piel menyatakan bahwa orang tersebut menyebabkan tempat kudus menjadi tercemar secara ritual.
- source_word: מֵי נִדָּה
  choice: air pemurnian
  rationale: Ungkapan ini menunjuk kepada air khusus yang disiapkan dalam pasal ini untuk menghapus kenajisan akibat mayat. Pilihan ini mengungkapkan fungsinya tanpa memakai ungkapan tradisional yang berpotensi membingungkan.
- source_word: זֹרַק עָלָיו
  choice: belum dipercikkan kepadanya
  rationale: Dalam tindakan ritual, זרק mengacu pada pemercikan atau penghamburan cairan kepada seseorang.
- source_word: טָמֵא הוּא
  choice: ia najis
  rationale: Klausa tanpa verba ini memberikan pernyataan langsung mengenai status ritual orang tersebut.
theological_decisions:
- issue: Sifat hukuman dalam ungkapan וְנִכְרְתָה
  choice: orang itu harus disingkirkan
  alternative: orang itu harus dikucilkan; orang itu harus dihukum mati
  rationale: Rumusan perjanjian Ibrani ini tidak menjelaskan mekanisme hukumannya dalam ayat ini. Terjemahan mempertahankan bobot hukum dan ketidakpastian aslinya tanpa menentukan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat dan jelas. Struktur hukum ayat dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum. Istilah ritual 'najis', 'menyucikan', dan 'tempat kudus' dipakai secara konsisten.
