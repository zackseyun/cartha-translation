  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: id
  text: Ia harus menyucikan dirinya dengan air itu[a] pada hari ketiga dan pada hari ketujuh, lalu ia akan menjadi tahir. Tetapi jika ia tidak menyucikan dirinya pada hari ketiga dan pada hari ketujuh[b], ia tidak akan menjadi tahir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu, dengan air pentahiran yang telah disiapkan sebelumnya dalam pasal ini.
    reason: cross_reference
  - marker: b
    text: Atau, “membersihkan dirinya.” Kata kerja Ibrani di sini menunjuk pada tindakan menjalani penyucian ritual dari kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: menyucikan dirinya
  rationale: Bentuk hitpael dari חטא dalam konteks ritual ini menunjuk pada tindakan menjalani penyucian dari kenajisan, bukan pada pengampunan dosa. Ungkapan refleksif ini alami dalam bahasa Indonesia dan mempertahankan perbedaan dengan hasil akhirnya, yaitu menjadi tahir.
- source_word: בּוֹ
  choice: dengan air itu
  rationale: Pronomina ini paling wajar merujuk kepada air pentahiran yang telah disiapkan sebelumnya. Penyebutan 'air' memperjelas rujukannya bagi pembaca Indonesia tanpa mengubah makna kontekstual.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Padanan temporal yang baku, alami, dan dekat dengan bentuk Ibrani.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: dan pada hari ketujuh
  rationale: Mempertahankan koordinasi dan urutan ritual dalam teks sumber.
- source_word: יִטְהָר
  choice: ia akan menjadi tahir
  rationale: טהר menyatakan status tahir sebagai hasil ritus tersebut. 'Menjadi tahir' membedakannya dari יתחטא, tindakan menyucikan diri.
- source_word: וְאִם לֹא
  choice: Namun, jika ia tidak
  rationale: Konjungsi tersebut memperkenalkan syarat yang berlawanan; 'namun' menyampaikan kontras itu secara alami.
- source_word: הוּא
  choice: Ia
  rationale: Mempertahankan subjek tunggal yang eksplisit. Dalam konteks, kata ini menunjuk kepada orang najis yang sedang dibicarakan.
theological_decisions:
- issue: Sifat bahasa penyucian dalam Bilangan 19
  choice: Menggunakan istilah penyucian ritual dan status tahir.
  alternative: Menggunakan bahasa pengampunan moral atau pengudusan batin.
  rationale: Konteks membahas kenajisan akibat mayat dan air pentahiran yang ditetapkan. Kata-kata Ibrani menyatakan proses serta status kemurnian ritual, bukan secara langsung pengampunan moral atau pengudusan batin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'tahir' dipertahankan karena secara ringkas dan lazim membedakan status kemurnian ritual dari kebersihan jasmani biasa; 'menyucikan dirinya' menyatakan proses ritusnya.
