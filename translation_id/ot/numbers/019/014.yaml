base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: id
  text: 'Inilah hukumnya: Apabila seseorang mati di dalam sebuah kemah, setiap orang yang masuk ke dalam kemah itu dan setiap orang yang ada di dalam kemah itu[a] menjadi najis selama tujuh hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan segala sesuatu yang ada di dalam kemah itu.” Frasa Ibrani ini dapat dipahami lebih luas daripada orang-orang. Terjemahan utama mengikuti kesejajarannya dengan “setiap orang yang masuk ke dalam kemah itu”; bejana dibahas secara khusus dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Inilah hukumnya
  rationale: תּוֹרָה memperkenalkan ketentuan yang mengikat tentang kenajisan akibat mayat; “hukum” ringkas, alami, dan sesuai dengan konteks ritual-legal.
- source_word: אָדָם כִּי יָמוּת
  choice: Apabila seseorang mati
  rationale: אָדָם dipakai secara generik bagi manusia tanpa menegaskan jenis kelamin, sehingga “seseorang” paling alami dalam bahasa Indonesia. כִּי dengan bentuk imperfek memperkenalkan suatu kasus hukum; “apabila” mempertahankan nuansa bersyarat-situasional dengan register yang bermartabat.
- source_word: בְּאֹהֶל
  choice: di dalam sebuah kemah
  rationale: Kemunculan pertama אֹהֶל tidak memakai artikel dan memperkenalkan tempat kejadian, sehingga bentuk tak tentu “sebuah kemah” tepat.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: setiap orang yang masuk ke dalam kemah itu
  rationale: Partisip dengan כָּל menunjuk secara umum kepada siapa pun yang masuk. “Kemah itu” merujuk kembali kepada kemah yang baru disebut.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: dan setiap orang yang berada di dalamnya
  rationale: Paralel dengan orang yang masuk dan verba tunggal יִטְמָא mendukung acuan kepada orang-orang yang hadir, tetapi keluasan אֲשֶׁר tetap dicatat dalam catatan kaki.
- source_word: יִטְמָא
  choice: menjadi najis
  rationale: Dalam ketentuan pentahiran, verba ini menyatakan peralihan ke status najis. “Menjadi najis” alami dalam bahasa Indonesia dan mempertahankan akibat ritual yang ditetapkan.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Penambahan “selama” menyatakan durasi secara jelas dan alami tanpa mengubah makna sumber.
