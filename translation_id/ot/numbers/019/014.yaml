translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hukum-ritual yang jelas dan bermartabat. “Seseorang” dipilih sebagai padanan generik yang alami bagi אָדָם, sedangkan “apabila” mempertahankan bentuk pengajuan kasus. Penanda catatan kaki ditempatkan langsung setelah frasa yang ambigu.
