id: NUM.16.3
reference: Numbers 16:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: id
  text: Mereka berkumpul menentang Musa dan Harun, lalu berkata kepada keduanya, “Kalian sudah keterlaluan![a] Seluruh umat—mereka semua—kudus, dan Yahweh ada di tengah-tengah mereka.[b] Jadi, mengapa kalian meninggikan diri di atas jemaat Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Terlalu banyak bagi kalian,” atau “Cukuplah bagi kalian.” Ungkapan ini merupakan teguran tajam.'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” menerjemahkan nama ilahi YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: berkumpul menentang
  rationale: Bentuk Niphal dari קהל menyatakan tindakan berkumpul, sedangkan עַל dalam konteks konfrontasi ini menunjukkan perlawanan.
- source_word: אֲלֵהֶם
  choice: kepada keduanya
  rationale: Acuannya ialah Musa dan Harun; bentuk ini alami dalam bahasa Indonesia dan mempertahankan bahwa perkataan itu ditujukan kepada mereka berdua.
- source_word: רַב לָכֶם
  choice: Kalian sudah keterlaluan!
  rationale: Ungkapan Ibrani ini merupakan teguran tajam. Pilihan ini menyampaikan daya tuduhnya secara alami tanpa mempersempitnya menjadi klaim khusus tentang jabatan atau kewenangan.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: Seluruh umat—mereka semua—
  rationale: Mengungkapkan penegasan ganda tentang keseluruhan kelompok. Tanda pisah mempertahankan tekanan retoris כֻּלָּם.
- source_word: קְדֹשִׁים
  choice: kudus
  rationale: Padanan baku bagi קדוש yang mempertahankan bobot teologis pernyataan para pemberontak.
- source_word: וּבְתוֹכָם יְהוָה
  choice: dan Yahweh ada di tengah-tengah mereka
  rationale: Menyatakan kehadiran ilahi di tengah komunitas; 'di tengah-tengah' dekat dengan gambaran spasial idiom Ibrani dan tetap alami.
- source_word: וּמַדּוּעַ תִּתְנַשְּׂאוּ
  choice: Jadi, mengapa kalian meninggikan diri
  rationale: וּמַדּוּעַ menarik kesimpulan dari alasan sebelumnya, sedangkan bentuk Hitpael תִּתְנַשְּׂאוּ bersifat refleksif dan menuduh mereka mengangkat diri sendiri.
- source_word: עַל קְהַל יְהוָה
  choice: di atas jemaat Yahweh
  rationale: Dengan verba 'meninggikan diri', עַל menunjukkan posisi di atas; קהל diterjemahkan 'jemaat' untuk kelompok umat yang berhimpun.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi YHWH. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan mengikuti lapisan konsultasi yang diberikan.
- issue: Status klaim bahwa seluruh umat kudus
  choice: Dinyatakan langsung sebagai ucapan para penentang
  alternative: Menambahkan penanda seperti 'mengaku kudus' atau kualifikasi lain
  rationale: Ayat ini melaporkan klaim mereka. Terjemahan tidak mendukung ataupun menyangkalnya melalui tambahan interpretatif; penilaian dibiarkan pada konteks naratif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina 'kalian' dipakai karena teguran ditujukan kepada Musa dan Harun. 'Umat' dan 'jemaat' membedakan עֵדָה dari קהל tanpa menjadikannya perbedaan teknis yang berlebihan.
