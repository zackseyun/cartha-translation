  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: id
  text: Mereka masing-masing mengambil perbaraannya[a], menaruh api di dalamnya, lalu menaruh dupa di atasnya. Kemudian mereka berdiri di pintu masuk Kemah Pertemuan bersama Musa dan Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pedupaannya.” Kata Ibrani ini menunjuk pada wadah untuk membawa bara api yang digunakan dalam pembakaran dupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: masing-masing mengambil perbaraannya
  rationale: אִישׁ dipakai secara distributif, dan akhiran milik tunggal menunjukkan bahwa setiap orang mengambil perbaraannya sendiri. מַחְתָּה adalah wadah untuk membawa bara api dalam pembakaran dupa; "perbaraan" mempertahankan nuansa ritual dengan ringkas.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: menaruh api di dalamnya
  rationale: עַל secara harfiah berarti "di atas", tetapi dalam konteks wadah, bahasa Indonesia secara alami menyatakan api ditaruh "di dalamnya". Bentuk tunggal mengikuti konstruksi distributif "masing-masing".
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: lalu menaruh dupa di atasnya
  rationale: Terjemahan ini mempertahankan preposisi "di atas" dan urutan tindakan ritual tanpa secara eksplisit menentukan apakah dupa itu berada di atas wadah atau bara di dalamnya.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan Indonesia yang baku dan mudah dipahami untuk bahan harum yang dibakar dalam ibadah.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח menunjuk pada bukaan atau pintu masuk. "Kemah Pertemuan" merupakan padanan yang jelas dan mapan bagi אֹהֶל מוֹעֵד.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: bersama Musa dan Harun
  rationale: Tambahan tanpa verba sesudah keterangan tempat paling wajar dipahami bahwa Musa dan Harun juga berada di sana. "Bersama" membuat hubungan tersebut jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah ritual "perbaraan" dipertahankan dalam teks utama, sedangkan padanan tradisional "pedupaan" dicantumkan dalam catatan kaki. Susunan distributif "masing-masing" memungkinkan pronomina tunggal yang alami dalam bahasa Indonesia.
