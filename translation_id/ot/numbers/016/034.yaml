  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: id
  text: Lalu seluruh Israel yang berada di sekeliling mereka melarikan diri ketika mendengar suara mereka[a], sebab mereka berkata, “Jangan-jangan bumi menelan kita!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketika mendengar jeritan mereka.” Kata Ibrani qōl dapat berarti “suara”, “bunyi”, atau “jeritan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: Lalu seluruh orang Israel
  rationale: Menerjemahkan ungkapan kolektif ‘seluruh Israel’ secara wajar dalam bahasa Indonesia, sementara ‘Lalu’ menghubungkan tindakan ini dengan peristiwa sebelumnya.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: yang berada di sekeliling mereka
  rationale: Menunjukkan bahwa yang melarikan diri ialah orang-orang Israel yang berada di sekitar mereka.
- source_word: נָסוּ
  choice: melarikan diri
  rationale: Padanan langsung dan alami bagi verba yang berarti lari karena bahaya.
- source_word: לְ/קֹלָם
  choice: ketika mendengar suara mereka
  rationale: Preposisi לְ menyatakan pemicu pelarian, sedangkan קוֹל tetap diterjemahkan secara luas sebagai ‘suara’ agar tidak mempersempitnya hanya menjadi jeritan.
- source_word: כִּי אָמְרוּ
  choice: sebab mereka berkata
  rationale: כִּי memperkenalkan alasan mereka melarikan diri.
- source_word: פֶּן
  choice: Jangan-jangan
  rationale: Mengungkapkan akibat yang ditakuti dalam ujaran langsung dengan bahasa Indonesia modern dan alami.
- source_word: תִּבְלָעֵנוּ
  choice: menelan kita juga
  rationale: Mempertahankan gambaran hidup tentang bumi yang menelan; ‘juga’ menyatakan ketakutan bahwa nasib yang baru menimpa orang lain akan menimpa mereka.
- source_word: הָ/אָרֶץ
  choice: bumi
  rationale: Menjaga kaitan dengan konteks sebelumnya, ketika bumi terbelah dan menelan para pemberontak.
