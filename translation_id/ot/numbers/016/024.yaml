  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: id
  text: Berbicaralah kepada umat itu, dengan berkata, ‘Naiklah dari sekitar tempat kediaman Korah, Datan, dan Abiram.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: umat
  rationale: Dalam konteks Israel yang sedang berhimpun, ‘umat’ terdengar alami dan bermartabat dalam bahasa Indonesia, serta menyampaikan kelompok perjanjian tanpa istilah teknis yang kaku.
- source_word: הֵעָלוּ
  choice: menjauhlah
  rationale: Bentuk ini secara harfiah dapat berarti ‘naiklah’, tetapi di sini berfungsi sebagai perintah untuk beranjak atau menarik diri dari sekitar kediaman para pemberontak. ‘Menjauhlah’ menyampaikan maksud kontekstual dengan jelas tanpa menyiratkan arah geografis yang tidak pasti.
- source_word: מִשְׁכַּן
  choice: tempat kediaman
  rationale: Pilihan ini mempertahankan arti umum ‘tempat tinggal/kediaman’ dan menghindari ‘Kemah Suci’, yang dalam konteks ini dapat menimbulkan asosiasi keliru dengan tempat ibadah resmi.
theological_decisions:
- issue: Lingkup istilah מִשְׁכַּן
  choice: tempat kediaman
  alternative: kemah
  rationale: Teks menunjuk kediaman yang dikaitkan dengan Korah, Datan, dan Abiram, bukan sedang menetapkan status sakralnya. Terjemahan netral menjaga konteks penghakiman tanpa menambahkan muatan teologis.
translation_notes:
  register: Bahasa perintah dibuat langsung, modern, dan bermartabat. Susunan ‘Berbicaralah ... katakan’ mempertahankan formula ujaran Ibrani, sedangkan ‘dari sekeliling’ mempertahankan gambaran spasial teks sumber.
