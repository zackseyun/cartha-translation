id: NUM.16.8
reference: Numbers 16:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: id
  text: Lalu Musa berkata kepada Korah, “Dengarlah sekarang, hai anak-anak Lewi!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dengarkanlah, hai anak-anak lelaki Lewi,” atau “Dengarlah sekarang, hai orang-orang Lewi.”
    reason: Alternatif leksikal dan idiomatis untuk שִׁמְעוּ נָא בְּנֵי לֵוִי, termasuk nuansa desakan pada נָא dan bentuk maskulin בְּנֵי.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai orang yang menjadi sasaran perkataan; “kepada” merupakan padanan Indonesia yang wajar.
- source_word: שִׁמְעוּ
  choice: Dengarlah
  rationale: Imperatif jamak dari שׁמע. “Dengarlah” mempertahankan seruan langsung dan tegas, sekaligus terdengar lebih bermartabat daripada ungkapan percakapan biasa.
- source_word: נָא
  choice: sekarang
  rationale: Partikel נָא dapat memperhalus atau memperkuat desakan. Dalam konteks konfrontatif ini, “sekarang” menyampaikan urgensi tanpa mengubahnya menjadi permohonan sopan yang eksplisit.
- source_word: בְּנֵי לֵוִי
  choice: anak-anak Lewi
  rationale: Ungkapan konstruksi harfiah berarti “anak-anak lelaki Lewi,” tetapi dalam bahasa Indonesia “anak-anak Lewi” merupakan ungkapan keturunan/kelompok yang alami dan tetap dekat dengan bentuk Ibrani; alternatif idiomatisnya ialah “orang-orang Lewi.”
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama diri memakai bentuk baku dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah kekerabatan bergender dalam sapaan langsung
  choice: hai anak-anak Lewi
  alternative: hai orang-orang Lewi; hai anak-anak lelaki Lewi
  rationale: בְּנֵי secara morfologis maskulin jamak, dan konteksnya menyapa kaum lelaki Lewi. Namun, “anak-anak lelaki Lewi” mudah disalahpahami sebagai putra biologis langsung Lewi, sedangkan “anak-anak Lewi” secara idiomatis menunjuk keturunannya dan tidak meniadakan konteks maskulin. Catatan kaki mempertahankan alternatif yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel sapaan “hai” menandai seruan langsung kepada kelompok tanpa terdengar terlalu percakapan; tanda seru mencerminkan daya retoris imperatif.
