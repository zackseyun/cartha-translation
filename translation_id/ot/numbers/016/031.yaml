translation:
  language: id
  text: Segera setelah ia selesai mengucapkan semua perkataan itu, tanah di bawah mereka terbelah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ
  choice: Segera setelah ia selesai
  rationale: Konstruksi ini menandai bahwa peristiwa berikut terjadi tepat ketika tindakan berbicara selesai; 'segera setelah' menyampaikan urutan yang langsung secara alami dalam bahasa Indonesia.
- source_word: לְדַבֵּר אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: mengucapkan semua perkataan itu
  rationale: '''Mengucapkan'' sesuai untuk tindakan menyampaikan perkataan secara lisan, sedangkan ''semua perkataan itu'' mempertahankan cakupan dan penunjukan teks sumber.'
- source_word: וַתִּבָּקַע
  choice: terbelah
  rationale: Bentuk nifal menyatakan tanah itu terbelah atau terbuka; 'terbelah' mempertahankan gambaran tindakan tanpa menambahkan penyebab yang tidak dinyatakan dalam ayat.
- source_word: הָאֲדָמָה אֲשֶׁר תַּחְתֵּיהֶם
  choice: tanah di bawah mereka
  rationale: Ungkapan ringkas ini alami dalam bahasa Indonesia dan tepat menyampaikan lokasi tanah yang terbelah.
