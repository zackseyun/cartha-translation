source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: id
  text: Korah anak Yizhar, anak Kehat, anak Lewi, bersama Datan dan Abiram, anak-anak Eliab, serta On anak Pelet—semuanya keturunan Ruben—mengambil sejumlah orang[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “lalu ia mengambil.” Objek verba itu tidak disebutkan; “sejumlah orang” dilengkapi berdasarkan konteks ayat berikutnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengajak sejumlah orang
  rationale: Secara harfiah berarti “lalu ia mengambil,” tetapi objeknya tidak dinyatakan. Berdasarkan ayat berikutnya, yang dimaksud kemungkinan sejumlah orang. “Mengajak” menghasilkan bahasa Indonesia yang alami tanpa menafsirkan tindakan itu terlalu jauh sebagai pemberontakan atau persekongkolan.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: anak Yizhar, anak Kehat, anak Lewi
  rationale: Mempertahankan rantai silsilah dan pengulangan בֶּן dalam bentuk yang wajar serta transparan.
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: bersama Datan dan Abiram, anak-anak Eliab
  rationale: Kata penghubung mengaitkan Datan dan Abiram dengan tindakan Korah; bentuk jamak בְּנֵי diterjemahkan langsung sebagai “anak-anak.”
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: serta On anak Pelet
  rationale: Mempertahankan nama dan hubungan genealogis secara langsung.
- source_word: בְּנֵי רְאוּבֵן
  choice: semuanya keturunan Ruben
  rationale: Dalam konteks ini frasa tersebut menerangkan Datan, Abiram, dan On sebagai anggota suku Ruben, bukan sebagai putra langsung Ruben. “Keturunan Ruben” lebih jelas dalam bahasa Indonesia, sedangkan “semuanya” memperjelas cakupan frasa penutup.
theological_decisions:
- issue: Elipsis pada klausa pembuka
  choice: Melengkapi objek tersirat sebagai “sejumlah orang,” dengan verba alami “mengajak”
  alternative: Menerjemahkan secara harfiah “mengambil,” atau secara lebih interpretatif “bersekongkol/ memberontak”
  rationale: Teks Ibrani hanya menyatakan “ia mengambil” tanpa objek. Ayat 2 mendukung pemahaman bahwa orang-orang menjadi objek tersirat, tetapi sifat tepat tindakannya tidak perlu dipastikan sebagai persekongkolan dalam ayat ini.
- issue: Cakupan frasa בְּנֵי רְאוּבֵן
  choice: Memahaminya sebagai keterangan garis keturunan bagi Datan, Abiram, dan On
  alternative: Membiarkan bentuk “anak-anak Ruben” yang dapat terdengar seolah-olah mereka putra langsung Ruben
  rationale: Susunan genealogis dan identitas tokoh-tokoh tersebut menunjukkan keanggotaan dalam garis/suku Ruben; terjemahan ini menghindari salah pengertian kronologis tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab Indonesia. Tanda pisah membantu memperjelas bahwa “keturunan Ruben” menerangkan Datan, Abiram, dan On; koma akhir mempertahankan kesinambungan kalimat menuju ayat 2.
