id: NUM.16.19
reference: Numbers 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: id
  text: Lalu Korah mengumpulkan seluruh umat untuk melawan mereka di pintu masuk Kemah Pertemuan, dan kemuliaan Yahweh[a] menampakkan diri kepada seluruh umat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Memberikan bentuk nama ilahi dalam bahasa sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: mengumpulkan
  rationale: 'Bentuk Hifil dari קהל menyatakan tindakan kausatif: Korah menyebabkan umat berkumpul. “Mengumpulkan” alami dalam bahasa Indonesia dan mempertahankan peran aktif Korah.'
- source_word: עֲלֵיהֶם
  choice: untuk melawan mereka
  rationale: Dalam konteks pemberontakan terhadap Musa dan Harun, עַל memiliki nuansa permusuhan. Ungkapan ini menyatakan arah tindakan umat tanpa mengaburkan pertentangan dalam adegan tersebut.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kesatuan. “Seluruh umat” jelas dan alami bagi pembaca Indonesia serta mempertahankan כָּל.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח berarti bukaan atau pintu masuk. Dalam konteks berkumpul, “di pintu masuk” menyampaikan lokasi tujuan secara alami.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ini adalah padanan harfiah dan lazim bagi nama tempat kudus tersebut; huruf kapital menandai sebutan khusus.
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Nifal dari ראה di sini menggambarkan manifestasi yang dapat terlihat. “Menampakkan diri” merupakan ungkapan Indonesia yang wajar tanpa menentukan bagaimana manifestasi itu terjadi.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: כָּבוֹד dalam konteks ini menunjuk pada manifestasi kehadiran ilahi, sedangkan nama perjanjian יְהוָה dipertahankan sebagai nama diri.
- source_word: אֶל כָּל הָעֵדָה
  choice: kepada seluruh umat
  rationale: Preposisi אֶל menandai pihak yang menyaksikan atau menerima penampakan itu. “Kepada” mempertahankan arah relasional tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu, sedangkan catatan kaki memberi tahu pembaca tentang penggantian tradisional dengan gelar “TUHAN” tanpa memasukkannya ke dalam teks utama.
- issue: Sifat kemuliaan ilahi yang tampak
  choice: kemuliaan Yahweh menampakkan diri
  alternative: kemuliaan Yahweh terlihat
  rationale: Pilihan ini mengikuti bentuk Nifal וַיֵּרָא dan bahasa manifestasi dalam teks tanpa menjelaskan wujud atau mekanisme penampakannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur satu kalimat mempertahankan alur narasi Ibrani, sementara istilah “umat” dan “Kemah Pertemuan” dibuat mudah dipahami serta konsisten dengan konteks Taurat.
