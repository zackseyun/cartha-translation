  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur utama Ibrani: Korah sebagai pelaku yang menghimpunkan seluruh עֵדָה, orientasi permusuhan עֲלֵיהֶם (“untuk melawan mereka”), lokasi di pintu masuk Kemah Pertemuan, serta kemuliaan Yahweh yang menampakkan diri kepada seluruh umat. “Mereka” dengan tepat mempertahankan rujukan jamak tersirat dalam teks tanpa menambahkan nama Musa dan Harun.'
  naturalness: Kalimatnya baku, jelas, dan mengalir secara alami dalam bahasa Indonesia modern. “Seluruh umat,” “pintu masuk Kemah Pertemuan,” dan “menampakkan diri” sesuai register naratif-khidmat.
  terminology: “Kemah Pertemuan” merupakan padanan yang mapan untuk אֹהֶל מוֹעֵד. “Kemuliaan Yahweh” secara tepat menerjemahkan כְבוֹד יְהוָה, dan “Yahweh” konsisten dengan kebijakan nama ilahi. Catatan kaki berjangkar tepat pada Yahweh dan menyampaikan bentuk Ibrani serta padanan tradisional tanpa memengaruhi teks utama.
