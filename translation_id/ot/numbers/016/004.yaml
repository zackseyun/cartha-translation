base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: id
  text: Ketika Musa mendengar hal itu, ia tersungkur dengan wajah ke tanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia sujud.” Secara harfiah, “ia jatuh pada wajahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar hal itu
  rationale: Kata שׁמע dalam rangkaian naratif ini berarti “mendengar”. Frasa “hal itu” menyatakan objek yang tersirat dari perkataan para pemberontak pada ayat sebelumnya tanpa menambahkan tafsiran baru.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama מֹשֶׁה dalam bahasa Indonesia.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: sujud dengan wajah ke tanah
  rationale: Ungkapan Ibrani ini secara harfiah berarti “jatuh pada wajahnya” dan menggambarkan tindakan merebahkan diri dengan wajah menghadap tanah. “Sujud dengan wajah ke tanah” alami dalam bahasa Indonesia sekaligus mempertahankan gambaran fisiknya.
theological_decisions:
- issue: Makna sikap tubuh Musa
  choice: Menyatakan tindakan fisiknya tanpa menjelaskan apakah itu doa, kesedihan, kerendahan hati, atau permohonan kepada Allah.
  alternative: Musa bersujud dalam doa; Musa tersungkur karena sedih.
  rationale: Teks Ibrani hanya menyebut tindakannya dan tidak menerangkan maksud atau emosinya. Terjemahan ini mempertahankan ketegangan tafsir tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata “sujud” dipakai dalam arti umum sebagai sikap merendahkan diri dengan wajah ke tanah, tanpa menetapkan secara eksplisit bahwa Musa sedang berdoa.
