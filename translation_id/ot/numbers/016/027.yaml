  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: id
  text: Maka mereka menjauh[a] dari sekitar tempat kediaman Korah, Datan, dan Abiram. Datan dan Abiram keluar dan berdiri di pintu masuk kemah-kemah mereka, bersama istri-istri mereka, anak-anak laki-laki mereka,[b] dan anak-anak kecil mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani ini secara harfiah berarti “naik”; dalam konteks ini, kemungkinan dipakai secara idiomatis untuk menjauh dari kawasan tersebut.
    reason: lexical_alternative
  - marker: b
    text: “Anak-anak laki-laki” menerjemahkan kata Ibrani yang dibedakan dari istilah berikutnya, yaitu “anak-anak kecil.”
    reason: lexical_note
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: menjauh dari sekeliling
  rationale: Secara harfiah verba ini berarti ‘naik’, tetapi bersama מֵעַל dan מִסָּבִיב dalam konteks ini menyatakan gerakan meninggalkan atau menjauhi kawasan tersebut. Pilihan ini alami dalam bahasa Indonesia tanpa menambahkan arah vertikal yang belum tentu dimaksudkan.
- source_word: מִשְׁכַּן
  choice: tempat kediaman
  rationale: Di sini kata tersebut menunjuk tempat tinggal atau kawasan perkemahan yang dikaitkan dengan Korah, Datan, dan Abiram, bukan Kemah Suci TUHAN.
- source_word: יָצְאוּ נִצָּבִים
  choice: keluar lalu berdiri
  rationale: Terjemahan ini mempertahankan tindakan keluar dan keadaan berdiri tanpa mempertegas sikap menantang yang mungkin tersirat dalam konteks tetapi tidak wajib terkandung dalam katanya sendiri.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: di pintu kemah mereka
  rationale: ‘Pintu kemah’ merupakan ungkapan Indonesia yang alami bagi bukaan atau jalan masuk kemah; bentuk jamak kepemilikan tetap tercermin melalui konteks Datan dan Abiram.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: bersama istri, anak laki-laki, dan anak-anak kecil mereka
  rationale: בנים diterjemahkan ‘anak laki-laki’ agar tetap dibedakan dari טף, yaitu anak-anak kecil atau tanggungan muda. Kata ‘bersama’ menyampaikan kehadiran keluarga secara alami.
theological_decisions:
- issue: Identitas מִשְׁכַּן sebagai kediaman biasa atau Kemah Suci
  choice: tempat kediaman
  alternative: Kemah Suci
  rationale: Nama Korah, Datan, dan Abiram serta konteks perintah menjauh menunjukkan kawasan kediaman mereka; menerjemahkannya ‘Kemah Suci’ akan mengarahkan pembaca kepada tempat ibadah TUHAN secara keliru.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Korah, Datan, dan Abiram. Penanda catatan kaki ditempatkan tepat sesudah bagian yang dijelaskannya.'
