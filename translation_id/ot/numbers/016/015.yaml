  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: id
  text: Lalu Musa menjadi sangat marah dan berkata kepada Yahweh, “Jangan mengindahkan persembahan mereka.[a] Aku tidak pernah mengambil seekor keledai pun dari mereka dan tidak pernah berbuat jahat kepada seorang pun dari mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan memperhatikan persembahan mereka” atau “Jangan menerima persembahan mereka.” Secara harfiah, teks Ibrani berbunyi, “Jangan berpaling kepada persembahan mereka.”
    reason: Menjelaskan metafora Ibrani פנה אל dan kemungkinan nuansa perhatian atau penerimaan yang berkenan.
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Lalu Musa menjadi sangat marah
  rationale: Ungkapan Ibrani חרה ל menyatakan kemarahan yang berkobar pada seseorang; bentuk alami bahasa Indonesia mempertahankan perubahan keadaan dan intensitas מְאֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Jangan mengindahkan persembahan mereka
  rationale: פנה אל secara harfiah berarti ‘berpaling kepada’, tetapi dalam permohonan ini menyiratkan memberi perhatian atau perkenanan. ‘Mengindahkan’ alami dalam bahasa Indonesia dan tidak secara eksplisit menentukan apakah tindakan yang dimaksud sekadar memperhatikan atau menerima; metafora harfiahnya dicatat dalam catatan kaki.
- source_word: מִנְחָתָם
  choice: persembahan mereka
  rationale: מִנְחָה dapat berarti pemberian, upeti, atau persembahan. ‘Persembahan’ cocok dengan konteks ibadah tanpa mempersempitnya menjadi persembahan sajian.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Aku tidak pernah mengambil seekor keledai pun dari mereka
  rationale: נשא dengan objek langsung di sini berarti mengambil atau merampas milik orang. ‘Seekor keledai pun’ mempertahankan contoh konkret dan penekanan אֶחָד.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: dan tidak pernah berbuat jahat kepada seorang pun dari mereka
  rationale: Bentuk Hifil רעע berarti berbuat buruk, jahat, atau merugikan seseorang. Pilihan ini mempertahankan cakupan moral yang lebih luas daripada hanya kerugian material.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri Allah.
- issue: Makna permohonan אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Jangan mengindahkan persembahan mereka
  alternative: Jangan menerima persembahan mereka
  rationale: Kata kerja פנה אל dapat menyiratkan perhatian yang berkenan, tetapi teks tidak memakai kata kerja khusus ‘menerima’. Karena itu, terjemahan tidak menjadikan penerimaan sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mengindahkan’ dipilih sebagai ungkapan yang alami namun tetap cukup luas; ‘seekor keledai pun’ mempertahankan daya retoris pernyataan Musa. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkan.
