  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: id
  text: Masukkanlah api ke dalam perbaraan-perbaraan itu, lalu taruhlah dupa di atas perbaraan-perbaraan itu di hadapan Yahweh besok. Orang yang dipilih Yahweh, dialah orang yang kudus. Kalian sudah keterlaluan, hai anak-anak Lewi![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sudah cukup bagi kalian, hai anak-anak Lewi!”; secara harfiah, “Banyak bagi kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: Masukkanlah api ke dalam perbaraan-perbaraan itu
  rationale: Kata kerja נתן dengan ב menunjuk pada menaruh api ke dalam wadah yang disebut pada ayat sebelumnya. Penyebutan ulang 'perbaraan-perbaraan' memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: lalu taruhlah dupa di atas api itu
  rationale: Secara harfiah pronomina jamak merujuk pada perbaraan, tetapi tindakan ritualnya ialah menaruh dupa di atas api di dalam perbaraan. Rumusan ini alami dan tidak mengubah tindakan yang dimaksud.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan idiom kehadiran ilahi serta nama perjanjian YHWH sebagai 'Yahweh'.
- source_word: מָחָר
  choice: besok
  rationale: Padanan temporal langsung dan alami.
- source_word: וְהָיָה
  choice: Orang yang ... dialah
  rationale: Konstruksi hasil diekspresikan secara alami dalam bahasa Indonesia melalui kalimat identifikasi berfokus tanpa menerjemahkan kopula secara kaku.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: Orang yang dipilih Yahweh
  rationale: Bentuk singular dipertahankan. Pasif 'dipilih' alami dalam bahasa Indonesia dan menyatakan tindakan pemilihan oleh Yahweh tanpa perlu menandai waktu secara berlebihan.
- source_word: הוּא הַקָּדוֹשׁ
  choice: dialah orang yang kudus
  rationale: Kata sandang pada הַקָּדוֹשׁ dan pronomina penegas הוּא dipertahankan melalui 'dialah orang yang kudus', yakni orang yang ditetapkan sebagai kudus dalam pengujian itu.
- source_word: רַב לָכֶם
  choice: Kalian sudah keterlaluan
  rationale: Ungkapan idiomatis ini menyampaikan teguran bahwa mereka telah melampaui batas, sambil mempertahankan daya retoris sumber.
- source_word: בְּנֵי לֵוִי
  choice: hai anak-anak Lewi
  rationale: Mempertahankan ungkapan kekerabatan Ibrani dan fungsi sapaan langsung; 'hai' menandai vokatif secara wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Makna הוּא הַקָּדוֹשׁ
  choice: dialah orang yang kudus
  alternative: dialah yang kudus atau ia kudus
  rationale: Pilihan ini mempertahankan penekanan pronominal dan bentuk definit sumber, tanpa menjelaskan lebih jauh apakah kekudusan di sini terutama berarti pemilihan untuk jabatan imam atau status kultis.
- issue: Daya teguran רַב לָכֶם
  choice: Kalian sudah keterlaluan
  alternative: Sudah cukup bagi kalian atau Terlalu banyak bagi kalian
  rationale: Dalam konteks perselisihan, frasa tersebut berfungsi sebagai teguran terhadap tindakan melampaui batas. Alternatif literal tetap dicatat karena bentuk Ibraninya secara leksikal berarti 'banyak bagi kalian'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif -lah mempertahankan nada instruksi; 'kalian' cocok dengan sapaan jamak. Rujukan implisit pada perbaraan diperjelas dari konteks ayat sebelumnya agar kalimat mandiri mudah dipahami.
