id: NUM.16.16
reference: Numbers 16:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: id
  text: Lalu Musa berkata kepada Korah, “Engkau dan seluruh kelompokmu, hadirlah di hadapan Yahweh besok—engkau, mereka, dan Harun.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw berurutan melanjutkan rangkaian peristiwa; “lalu” wajar dalam narasi Indonesia tanpa memberi hubungan sebab-akibat yang tidak dinyatakan.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַתָּה וְכָל־עֲדָתְךָ
  choice: Engkau dan seluruh kelompokmu
  rationale: עֵדָה menunjuk pada kelompok atau perhimpunan yang menyertai Korah. “Kelompokmu” alami dalam konteks ini dan tidak menyamakan mereka dengan seluruh umat Israel.
- source_word: הֱיוּ לִפְנֵי יְהוָה
  choice: hadirlah di hadapan Yahweh
  rationale: Imperatif jamak הֱיוּ secara harfiah berarti “beradalah,” tetapi dalam konteks pemanggilan untuk tampil, “hadirlah” menyampaikan maksudnya secara alami; לִפְנֵי tetap tercermin dalam “di hadapan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: engkau, mereka, dan Harun
  rationale: Daftar eksplisit dan berulang dalam bahasa Ibrani dipertahankan untuk menegaskan semua pihak yang harus hadir.
- source_word: מָחָר
  choice: besok
  rationale: Padanan langsung dan alami bagi keterangan waktu tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian yang hadir secara eksplisit tanpa menggantinya dengan gelar.
- issue: Makna hadir “di hadapan Yahweh”
  choice: hadirlah di hadapan Yahweh
  alternative: menghadaplah kepada Yahweh
  rationale: Pilihan ini mempertahankan ungkapan ruang/kehadiran לִפְנֵי dan tidak mempersempitnya menjadi sekadar arah menghadap atau tindakan ibadah tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “engkau” sesuai untuk sapaan tunggal langsung dalam konteks Alkitab. Tanda pisah mempertahankan penegasan daftar pihak yang diulang dalam teks Ibrani.
