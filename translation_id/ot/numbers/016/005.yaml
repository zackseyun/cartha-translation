revisions:
- from: Lalu Musa berbicara kepada Korah dan seluruh kelompoknya, katanya, “Besok pagi Yahweh akan menyatakan[a] siapa yang menjadi milik-Nya dan siapa yang kudus, lalu Ia akan membawa orang itu mendekat kepada-Nya.[b] Orang yang dipilih-Nya akan dibawa-Nya mendekat kepada-Nya.”
  to: Lalu Musa berbicara kepada Korah dan seluruh kelompoknya. Ia berkata, “Pada pagi hari Yahweh akan menyatakan[a] siapa yang menjadi milik-Nya dan siapa yang kudus; Ia akan membawa orang itu mendekat kepada-Nya.[b] Orang yang dipilih-Nya akan Ia bawa mendekat kepada-Nya.”
  rationale: Revisi menghapus penambahan “besok,” memperlancar pengantar ujaran, dan memulihkan bentuk aktif dalam pengulangan terakhir. Istilah kunci serta ambiguitas hubungan antara orang yang menjadi milik Yahweh, yang kudus, dan yang dipilih tetap dipertahankan.
