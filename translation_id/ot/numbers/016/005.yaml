reference: Numbers 16:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: id
  text: Lalu Musa berbicara kepada Korah dan seluruh kelompoknya. Ia berkata, “Pada pagi hari Yahweh akan menyatakan[a] siapa yang menjadi milik-Nya dan siapa yang kudus; Ia akan membawa orang itu mendekat kepada-Nya.[b] Orang yang dipilih-Nya akan Ia bawa mendekat kepada-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Yahweh akan mengetahui.” Kata Ibrani ini secara harfiah berarti “mengetahui”, tetapi dalam konteks ini kemungkinan menunjuk pada tindakan memperlihatkan atau menyatakan di depan umum.
    reason: lexical_alternative
  - marker: b
    text: “Membawa ... mendekat” adalah ungkapan yang berkaitan dengan ibadah dan pelayanan suci, yang menunjuk pada pendekatan yang sah ke hadapan Yahweh untuk pelayanan tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר ... לֵאמֹר
  choice: Lalu Musa berbicara ... katanya
  rationale: Subjek tersirat dijelaskan sebagai Musa dari konteks langsung agar narasi alami dalam bahasa Indonesia; perbedaan antara verba ‘berbicara’ dan formula pengantar ‘katanya’ tetap dipertahankan.
- source_word: עֲדָתוֹ
  choice: seluruh kelompoknya
  rationale: עֵדָה menunjuk kelompok atau perhimpunan yang berpihak kepada Korah. ‘Kelompoknya’ jelas bagi pembaca modern dan tidak menyiratkan bahwa seluruh umat Israel terlibat.
- source_word: בֹּקֶר
  choice: Besok pagi
  rationale: Dalam konteks ujaran mengenai pembuktian yang akan terjadi pada pagi berikutnya, ungkapan nominal ‘pagi’ secara idiomatis berarti ‘besok pagi’ dalam bahasa Indonesia.
- source_word: וְיֹדַע יְהוָה
  choice: Yahweh akan menyatakan
  rationale: Secara bentuk ידע berarti ‘mengetahui’, tetapi dalam konteks pengujian terbuka ini hasilnya ialah identitas orang pilihan dibuat nyata di hadapan umat. Catatan kaki mempertahankan terjemahan yang lebih harfiah.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: siapa yang menjadi milik-Nya
  rationale: Mempertahankan makna kepunyaan dalam frasa harfiah ‘siapa yang bagi-Nya/milik-Nya’ tanpa menentukan lebih jauh sifat hubungan itu.
- source_word: הַקָּדוֹשׁ
  choice: siapa yang kudus
  rationale: Adjektiva bersubstantif ini menunjuk orang yang dikhususkan bagi pelayanan suci. Terjemahan ini mempertahankan kesejajaran dengan frasa sebelumnya.
- source_word: וְהִקְרִיב אֵלָיו / יַקְרִיב אֵלָיו
  choice: membawa ... mendekat kepada-Nya
  rationale: Bentuk kausatif קרב menyatakan bahwa Yahweh mengizinkan atau membawa seseorang mendekat, dengan nuansa akses yang sah untuk pelayanan kudus. Pengulangan sumber dipertahankan.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Orang yang dipilih-Nya
  rationale: Ungkapan ini menyampaikan pilihan Yahweh secara langsung dan tetap membuka identitas orang tersebut sampai pembuktian berlangsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
theological_decisions:
- issue: Makna וְיֹדַע dalam tindakan Yahweh
  choice: akan menyatakan
  alternative: akan mengetahui
  rationale: Konteks menekankan pengungkapan di depan umum mengenai siapa yang menjadi milik Yahweh dan kudus. Namun, karena bentuk Ibraninya secara leksikal berarti ‘mengetahui’, alternatif harfiah dicatat dan ketegangannya tidak dihapus.
- issue: Hubungan antara ‘milik-Nya’, ‘kudus’, dan orang yang dibawa mendekat
  choice: Mempertahankan rangkaian klausa tanpa menyamakan istilah-istilah itu secara eksplisit
  alternative: Menafsirkan semuanya sebagai satu gelar jabatan imam
  rationale: Teks menghubungkan kepunyaan, kekudusan, pilihan, dan akses kepada Yahweh, tetapi tidak menjelaskan secara sistematis apakah setiap ungkapan sepenuhnya identik. Terjemahan tidak menambahkan kesimpulan doktrinal.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi. Transliterasi mempertahankan unsur tersebut dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kelompoknya’ dipilih daripada ‘jemaahnya’ agar rujukannya kepada kelompok Korah jelas. Pengulangan ‘mendekat kepada-Nya’ dipertahankan karena penting dalam struktur dan tema ayat Ibrani.
