base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: id
  text: '“Lakukanlah ini: ambillah perbaraan bagi kalian, hai Korah dan seluruh kumpulannya.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Lakukanlah ini
  rationale: Ungkapan perintah ini menunjuk ke petunjuk yang segera diberikan; bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan susunan Ibrani.
- source_word: קְחוּ לָכֶם
  choice: ambillah bagi dirimu sendiri
  rationale: Imperatif jamak קְחוּ diterjemahkan sebagai perintah, sedangkan לָכֶם dipertahankan dengan nuansa refleksif. Karena sapaan berikutnya menempatkan Korah bersama kelompoknya, bentuk tunggal kolektif 'dirimu' menghindari kesan bahwa perintah hanya ditujukan kepada Korah seorang.
- source_word: מַחְתּוֹת
  choice: perbaraan
  rationale: Istilah ini menunjuk pada wadah untuk membawa bara, khususnya dalam pembakaran dupa. 'Perbaraan' merupakan istilah Indonesia yang ringkas dan sesuai dengan konteks ritual.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְכָל עֲדָתוֹ
  choice: dan seluruh kumpulanmu
  rationale: עֵדָה dapat berarti kumpulan, himpunan, atau jemaah. 'Kumpulanmu' alami dalam konteks kelompok Korah dan mempertahankan sufiks orang kedua yang tersirat secara pragmatis dalam sapaan langsung, meski bentuk Ibraninya secara gramatikal adalah orang ketiga, 'kumpulannya'.
theological_decisions:
- issue: Rujukan sufiks pada עֲדָתוֹ
  choice: kumpulanmu
  alternative: kumpulannya
  rationale: Teks Ibrani memakai sufiks orang ketiga tunggal ('kumpulannya'), lalu menyapa 'Korah dan seluruh kumpulannya' secara vokatif. Dalam bahasa Indonesia, peralihan ke orang kedua membuat sapaan langsung lebih jelas tanpa mengubah pihak yang dimaksud. Alternatif formal 'Korah dan seluruh kumpulannya' tetap mungkin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Perbaraan' dipilih sebagai istilah ritual yang cukup dikenal, dengan penjelasan konkret dalam catatan kaki. Sapaan 'Korah dan seluruh kumpulanmu' dipertahankan pada akhir kalimat agar mengikuti fokus dan struktur sumber.
