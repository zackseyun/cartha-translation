  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Struktur dua kalimat dipakai agar rangkaian tindakan tetap jelas; istilah "para tua-tua Israel" mempertahankan sebutan kepemimpinan tradisional, sedangkan catatan kaki menjelaskan nilai idiomatis frasa arah Ibrani.
