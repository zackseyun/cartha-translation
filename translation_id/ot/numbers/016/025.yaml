  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: id
  text: Kemudian Musa bangkit lalu pergi menemui Datan dan Abiram, dan para tua-tua Israel pergi mengikutinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pergi di belakangnya.” Secara lebih harfiah, teks Ibrani berbunyi “pergi setelah dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk wayyiqtol dari קום menyatakan tindakan berikutnya dalam narasi, yaitu Musa bangun untuk bertindak. "Bangkit" ringkas, wajar, dan tidak menentukan apakah ia sebelumnya duduk atau berbaring.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: הלך pada konteks ini menyatakan gerak menuju seseorang; "pergi" alami dalam narasi Indonesia tanpa menambahkan cara bergerak.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah gerak menuju Datan dan Abiram. "Kepada" mempertahankan arah tersebut tanpa menambahkan gagasan bahwa Musa pasti bertemu dengan mereka.
- source_word: דָּתָן וַאֲבִירָם
  choice: Datan dan Abiram
  rationale: Nama-nama pribadi dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיֵּלְכוּ
  choice: berjalan
  rationale: Bentuk jamak dari הלך berarti pergi atau berjalan. Di sini "berjalan" berpadu dengan frasa berikutnya dan mempertahankan gambaran gerak dalam teks Ibrani.
- source_word: אַחֲרָיו
  choice: di belakangnya
  rationale: Frasa ini secara harfiah menggambarkan para tua-tua bergerak di belakang Musa; makna idiomatisnya ialah mengikuti dia. Terjemahan utama mempertahankan gambaran sumber, sedangkan padanan idiomatis dicatat dalam catatan kaki.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Frasa konstruksi ini menunjuk kepada para tua-tua atau pemimpin yang diakui di Israel. Bentuk ini jelas dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: וַ
  choice: Kemudian / pun
  rationale: Waw naratif memajukan rangkaian peristiwa. "Kemudian" dan "pun" menyampaikan kesinambungan narasi secara alami tanpa mengulang "dan" secara mekanis.
