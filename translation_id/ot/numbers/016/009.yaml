id: NUM.16.9
reference: Numbers 16:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: id
  text: Belum cukupkah[a] bagi kalian bahwa Allah Israel telah memisahkan kalian dari umat Israel untuk mendekatkan kalian kepada-Nya, supaya kalian melaksanakan pelayanan di Kemah Suci Yahweh dan berdiri di hadapan umat untuk melayani mereka?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Apakah terlalu kecil artinya bagi kalian ...?” Ungkapan Ibrani ini juga dapat dipahami sebagai “Apakah kalian menganggap sepele ...?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Belum cukupkah
  rationale: Ungkapan tanya retoris ini menegur para pendengar karena menganggap hak istimewa yang telah diberikan belum memadai. Bentuk ini alami dalam bahasa Indonesia modern; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: כִּי
  choice: bahwa
  rationale: Konjungsi ini memperkenalkan isi pertanyaan retoris, bukan menyatakan sebab secara langsung.
- source_word: הִבְדִּיל
  choice: telah memisahkan
  rationale: Bentuk Hifil dari בדל menyatakan tindakan membuat terpisah. Pilihan ini mempertahankan kontras antara orang Lewi dan umat Israel lainnya tanpa menambahkan nuansa kultis yang tidak harus dinyatakan.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: umat Israel
  rationale: עֵדָה menunjuk kepada komunitas atau himpunan Israel. 'Umat Israel' merupakan padanan Indonesia yang alami dan cukup luas untuk konteks ini.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: untuk mendekatkan kalian kepada-Nya
  rationale: קרב di sini menjadikan orang-orang Lewi sebagai objek yang dibawa mendekat kepada Allah. Terjemahan ini mempertahankan dimensi relasional dan kultis tanpa menggambarkan mereka secara eksplisit sebagai persembahan.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: supaya kalian melaksanakan pelayanan di Kemah Suci Yahweh
  rationale: Konstruksi kata kerja עבד dan nomina seakar עֲבֹדָה menekankan tugas pelayanan. Ungkapan Indonesia ini menyampaikan makna tersebut secara alami tanpa pengulangan yang kaku.
- source_word: מִשְׁכַּן יְהוָה
  choice: Kemah Suci Yahweh
  rationale: מִשְׁכָּן adalah tempat kediaman suci portabel Israel di padang gurun. 'Kemah Suci' adalah istilah Indonesia yang jelas dan lazim bagi bangunan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: dan berdiri di hadapan umat
  rationale: Terjemahan ini mempertahankan gambaran sikap resmi orang Lewi ketika melaksanakan pelayanan bagi komunitas Israel.
- source_word: לְשָׁרְתָם
  choice: untuk melayani mereka
  rationale: שרת menyatakan pelayanan sebagai pelayan atau petugas. Dalam konteks ini, 'melayani mereka' alami dan menjaga objek jamak yang eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Arah pelayanan dalam לְשָׁרְתָם
  choice: melayani mereka, yaitu umat
  alternative: melayani bagi mereka dalam pengertian pelayanan kepada Allah
  rationale: Akhiran pronominal maskulin jamak pada לְשָׁרְתָם secara gramatikal menunjuk kembali kepada umat. Terjemahan tidak menghapus ketegangan antara pelayanan kudus kepada Allah dan pelayanan orang Lewi bagi umat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti jamak 'kalian' dipakai karena teguran ditujukan kepada sekelompok orang. 'Kemah Suci' dipilih sebagai istilah yang mudah dipahami bagi מִשְׁכָּן, sedangkan nama 'Yahweh' dipertahankan.
