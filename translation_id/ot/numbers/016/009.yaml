  source_fidelity: 'Terjemahan dengan tepat menyampaikan pertanyaan retoris הַמְעַט melalui “Belum cukupkah,” isi yang diperkenalkan oleh כִּי (“bahwa”), tindakan Allah yang memisahkan orang Lewi dari umat Israel, serta tujuan rangkapnya: mendekatkan mereka kepada-Nya, menjalankan pelayanan Kemah Suci Yahweh, dan berdiri di hadapan umat untuk melayani mereka. Arah objek pada לְשָׁרְתָם tetap jelas melalui “mereka.”'
