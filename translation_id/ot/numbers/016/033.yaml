base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: id
  text: Maka mereka turun hidup-hidup ke Syeol[a]—mereka dan semua yang menjadi milik mereka—lalu bumi menutupi mereka, dan mereka binasa dari tengah-tengah jemaah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Syeol; dapat juga diterjemahkan “kubur” atau “alam orang mati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: turunlah mereka
  rationale: Kata kerja ירד berarti ‘turun’; bentuk ini mempertahankan gerak naratif dan terdengar wajar dalam bahasa Indonesia.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: mereka dan segala sesuatu yang menjadi milik mereka
  rationale: Ungkapan Ibrani ini bersifat luas dan tidak dipersempit hanya kepada orang atau hanya kepada harta benda.
- source_word: חַיִּים
  choice: hidup-hidup
  rationale: Ungkapan ini secara alami menegaskan bahwa mereka turun dalam keadaan masih hidup.
- source_word: שְׁאֹלָה
  choice: ke dunia orang mati
  rationale: שְׁאוֹל menunjuk pada ranah orang mati, bukan semata-mata satu liang kubur; akhiran penunjuk arah tercermin dalam ‘ke’.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: bumi menutupi mereka
  rationale: Terjemahan langsung dan alami yang mempertahankan bumi sebagai subjek tindakan.
- source_word: וַיֹּאבְדוּ
  choice: mereka pun lenyap
  rationale: Dalam konteks ini אבד dapat menyatakan bahwa mereka hilang atau lenyap dari komunitas; pilihan ini selaras dengan frasa berikutnya tanpa menambahkan cara kebinasaan yang tidak dinyatakan oleh kata tersebut.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: dari tengah-tengah umat itu
  rationale: קהל adalah himpunan atau komunitas yang sedang disebut; ‘umat itu’ jelas bagi pembaca umum, sedangkan ‘dari tengah-tengah’ mempertahankan gambaran spasial teks.
theological_decisions:
- issue: Pemaknaan שְׁאוֹל
  choice: dunia orang mati
  alternative: Syeol; kubur
  rationale: ‘Dunia orang mati’ mempertahankan cakupan konseptual istilah Ibrani tanpa menyamakannya dengan neraka dalam pengertian teologis yang lebih kemudian atau membatasinya pada satu kubur. Istilah Ibraninya dan alternatif yang lebih sempit dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Hidup-hidup’ memberi penekanan idiomatis; tanda pisah mempertahankan sisipan penjelas dalam ayat. Istilah ‘dunia orang mati’ dipilih agar mudah dipahami tanpa menghilangkan ketegangan konseptual istilah Ibrani.
