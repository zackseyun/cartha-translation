  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: id
  text: Hendaklah setiap orang mengambil pedupaannya[a], menaruh dupa di atasnya, dan membawa pedupaannya ke hadapan Yahweh—dua ratus lima puluh pedupaan—dan engkau serta Harun, masing-masing dengan pedupaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: perbaraan, yaitu wadah yang digunakan untuk membakar dupa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ אִישׁ מַחְתָּתוֹ
  choice: Hendaklah masing-masing mengambil perbaraannya
  rationale: Bentuk perintah jamak diikuti אִישׁ yang distributif. Ungkapan ini menyampaikan bahwa setiap orang harus mengambil satu wadah miliknya; akhiran orang ketiga tunggal dipertahankan melalui bentuk -nya.
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: perbaraannya / perbaraan
  rationale: מַחְתָּה menunjuk pada wadah bara yang dipakai untuk membakar dupa. 'Perbaraan' merupakan istilah Indonesia yang tepat bagi wadah bara dan lebih konkret daripada istilah ritual 'pedupaan'.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: menaruh dupa di atasnya
  rationale: Terjemahan mempertahankan preposisi עַל, 'di atas', yang kemungkinan menggambarkan dupa ditaruh di atas bara dalam wadah. Rujukan jamak Ibrani dialihkan menjadi distributif tunggal agar selaras secara alami dengan 'masing-masing'.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Padanan Indonesia yang baku dan mudah dipahami untuk bahan harum yang dibakar dalam ibadah.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: lalu membawa ... ke hadapan Yahweh
  rationale: Hifil קרב menyatakan membawa atau mendekatkan dalam konteks ritual. 'Ke hadapan' mempertahankan idiom kehadiran ilahi dalam לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar, sehingga membedakannya dari אֲדֹנָי.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: semuanya dua ratus lima puluh perbaraan
  rationale: Bilangan tersebut menerangkan jumlah perbaraan milik kelompok yang diperintah. 'Semuanya' memperjelas fungsi aposisional frasa bilangan tanpa menambah gagasan baru.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: Engkau dan Harun juga harus membawa perbaraan masing-masing
  rationale: Klausa Ibrani bersifat eliptis dan mengambil tindakan dari perintah sebelumnya. Bahasa Indonesia mengulang 'harus membawa' agar hubungan sintaksis jelas, sedangkan אִישׁ ...־וֹ diterjemahkan secara distributif dengan 'masing-masing'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar; bentuk vokalisasi historisnya tidak sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur distributif Ibrani dibuat alami dengan 'masing-masing'; elipsis pada bagian akhir diperjelas secukupnya tanpa mengubah peserta atau tindakan.
