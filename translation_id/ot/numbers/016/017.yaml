  to: Hendaklah setiap orang mengambil pedupaannya[a], menaruh dupa di atasnya, dan membawa pedupaannya ke hadapan Yahweh—dua ratus lima puluh pedupaan—dan engkau serta Harun, masing-masing dengan pedupaannya.
