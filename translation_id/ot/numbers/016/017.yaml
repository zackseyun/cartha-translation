  naturalness: Susunan revisi mempertahankan perintah distributif dan elipsis penutup secara idiomatis dalam bahasa Indonesia baku. “Masing-masing dengan pedupaannya” menyatakan bahwa Musa dan Harun juga harus hadir dengan wadah mereka sendiri.
  terminology: “Pedupaan” tepat untuk wadah ritual pembakaran dupa; “dupa,” “ke hadapan Yahweh,” dan nama “Yahweh” dipertahankan. Catatan alternatif mempertahankan kemungkinan “perbaraan” tanpa menjadikannya istilah utama yang kurang lazim.
