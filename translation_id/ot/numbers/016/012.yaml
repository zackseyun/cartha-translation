  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֹשֶׁ֔ה לִ/קְרֹ֛א לְ/דָתָ֥ן וְ/לַ/אֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַ/יֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: id
  text: Lalu Musa menyuruh orang memanggil Datan dan Abiram, anak-anak Eliab. Namun mereka berkata, “Kami tidak mau datang menghadap.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kami tidak akan naik.” Kata kerja Ibrani yang dipakai berarti “naik” dan mungkin merujuk pada pergi ke tempat Musa atau datang menghadap dia ketika dipanggil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: menyuruh orang
  rationale: Dalam konstruksi ini, Musa mengutus seseorang untuk melakukan pemanggilan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan siapa utusannya.
- source_word: לִקְרֹא
  choice: memanggil
  rationale: קרא dengan ל pada orang yang dipanggil berarti memanggil atau menyuruh datang; konteks pertikaian memberinya daya panggilan resmi tanpa perlu memakai istilah yang terlalu administratif.
- source_word: דָתָן וְלַאֲבִירָם
  choice: Datan dan Abiram
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּנֵי אֱלִיאָב
  choice: anak-anak Eliab
  rationale: Bentuk jamak konstruksi ini menyatakan hubungan keturunan langsung dan mengidentifikasi Datan serta Abiram sebagai anak Eliab.
- source_word: וַיֹּאמְרוּ
  choice: Namun mereka berkata
  rationale: Waw secara bentuk dapat diterjemahkan 'dan', tetapi di sini tanggapan mereka berlawanan dengan panggilan Musa; 'namun' menyatakan hubungan wacana itu secara alami.
- source_word: לֹא נַעֲלֶה
  choice: Kami tidak mau datang menghadap
  rationale: Imperfek dengan negasi dalam jawaban langsung menyatakan penolakan tegas. עלה secara harfiah berarti naik, tetapi dalam konteks panggilan dapat berarti datang atau tampil menghadap pihak yang memanggil. Terjemahan utama menyampaikan fungsi kontekstualnya, sementara gambaran harfiahnya dipertahankan dalam catatan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tidak mau' menangkap penolakan yang disengaja; 'datang menghadap' menyatakan maksud kontekstual tanpa menghapus arti harfiah 'naik', yang dicatat dalam catatan kaki.
