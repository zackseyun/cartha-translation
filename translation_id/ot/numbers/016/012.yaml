  source_fidelity: Terjemahan dengan tepat menyampaikan bahwa Musa mengirim/menyuruh seseorang untuk memanggil Datan dan Abiram, yang diidentifikasi sebagai anak-anak Eliab, lalu mencatat penolakan mereka. “Kami tidak mau datang menghadap” secara wajar mengungkapkan daya penolakan dari לֹא נַעֲלֶה, sementara catatan kaki mempertahankan arti harfiah “naik” dan kemungkinan nuansa kontekstualnya.
  naturalness: Bahasa Indonesia baku, lancar, dan sesuai register naratif. “Menyuruh orang memanggil” tidak menyebut identitas utusan yang tidak disebutkan teks, dan “Namun mereka berkata” mengalir baik sebagai respons yang kontras.
  terminology: Nama Datan, Abiram, Eliab serta istilah “anak-anak” konsisten dengan pemakaian Alkitab bahasa Indonesia. “Datang menghadap” sesuai dalam konteks panggilan resmi tanpa memaksakan penafsiran lokasi. Jangkar catatan kaki ditempatkan pada akhir ucapan yang dijelaskannya.
