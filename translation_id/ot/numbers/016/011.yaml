base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: id
  text: Karena itu, engkau dan seluruh kelompokmu telah berkumpul menentang Yahweh[a]. Dan Harun itu siapa sehingga kalian bersungut-sungut terhadapnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh adalah nama ilahi yang dalam bahasa Ibrani ditulis YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan Musa berdasarkan tuduhan dalam ayat sebelumnya dan mempertahankan daya inferensial ungkapan Ibrani.
- source_word: עֲדָתְךָ
  choice: seluruh kelompokmu
  rationale: Dalam konteks ini kata tersebut menunjuk kepada kelompok Korah. 'Kelompokmu' alami dalam bahasa Indonesia modern dan tidak memberi kesan bahwa seluruh umat Israel terlibat.
- source_word: הַנֹּעָדִים
  choice: telah berkumpul
  rationale: Partisipel Nifal dari יעד menunjuk kepada orang-orang yang berhimpun; bentuk ini mempertahankan tindakan bersama tanpa menambahkan motif yang tidak dinyatakan.
- source_word: עַל
  choice: menentang
  rationale: Konteks pemberontakan menuntut nuansa adversatif, bukan sekadar berkumpul di hadapan atau mengenai Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH yang terdapat langsung dalam teks sumber.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: Siapakah Harun
  rationale: Mengungkapkan pertanyaan retoris yang mengecilkan kedudukan pribadi Harun dibandingkan dengan Yahweh, sasaran utama pemberontakan mereka.
- source_word: תלונו
  choice: kalian bersungut-sungut
  rationale: Bentuk verba ini berorang kedua jamak. 'Bersungut-sungut' mempertahankan nada keluhan yang berulang dan memberontak dalam kisah pengembaraan di padang gurun.
- source_word: עָלָיו
  choice: terhadap dia
  rationale: Menunjukkan bahwa sungut-sungut itu diarahkan kepada Harun; bentuk ini jelas tanpa membuat bahasa Indonesia terlalu kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sasaran utama pemberontakan
  choice: Kelompok Korah telah berkumpul menentang Yahweh, sedangkan Harun disebut dalam pertanyaan retoris.
  alternative: Kelompok itu menentang Yahweh dan Harun sebagai dua sasaran yang setara.
  rationale: Susunan Ibrani lebih dahulu menyatakan bahwa mereka berkumpul menentang Yahweh, lalu menambahkan pertanyaan 'Harun, apakah dia?' untuk menekankan bahwa sungut-sungut terhadap Harun pada akhirnya merupakan pemberontakan terhadap Yahweh.
- issue: Peralihan dari orang kedua tunggal ke jamak
  choice: '''engkau'' untuk Korah, lalu ''kalian'' untuk seluruh kelompok'
  alternative: Memakai satu bentuk sapaan yang sama di seluruh ayat.
  rationale: Teks Ibrani membedakan אַתָּה yang tunggal dari תַלִּינוּ yang jamak. Pembedaan ini penting karena Musa mula-mula menyapa Korah, kemudian mencakup para pengikutnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Engkau' mempertahankan sapaan tunggal kepada Korah, sedangkan 'kalian' mencerminkan bentuk jamak pada verba berikutnya. Kalimat Ibrani yang panjang dibagi menjadi dua agar pertanyaan retoris terdengar alami tanpa menghilangkan hubungan logisnya.
