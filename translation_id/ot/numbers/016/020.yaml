base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: id
  text: Lalu Yahweh[a] berfirman kepada Musa dan kepada Harun,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: יהוה (YHWH), nama ilahi yang ditransliterasikan “Yahweh”.'
    reason: Menjelaskan bentuk Ibrani di balik transliterasi nama ilahi.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang menerima firman; “kepada” adalah padanan Indonesia yang wajar.
- source_word: וְאֶל אַהֲרֹן
  choice: dan kepada Harun
  rationale: Pengulangan preposisi dipertahankan untuk mencerminkan bahwa Musa dan Harun disebut sebagai dua penerima firman.
- source_word: לֵאמֹר
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Dalam formula pengantar ucapan Ibrani, לֵאמֹר memperkenalkan kutipan langsung yang menyusul. Bahasa Indonesia alami cukup memakai “berfirman ...,” tanpa tambahan kaku “demikian” atau “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Lalu” menandai kelanjutan narasi; “berfirman” sesuai dengan konteks ujaran ilahi. Koma akhir menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
