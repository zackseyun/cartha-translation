  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol memajukan rangkaian narasi; “lalu” menyampaikan urutannya secara wajar. Dalam konteks perkataan ilahi, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan Indonesia yang alami bagi preposisi אֶל dan nama מֹשֶׁה.
- source_word: לֵאמֹר
  choice: '[ditandai dengan koma pembuka kutipan lanjutan]'
  rationale: Infinitif ini memperkenalkan isi perkataan pada ayat berikutnya. Dalam bahasa Indonesia, fungsi tersebut paling alami dinyatakan dengan tanda baca, tanpa menambahkan kata “kata-Nya” yang akan mengulang verba ujaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Verba ujaran ilahi דִּבֵּר
  choice: berfirman
  alternative: berbicara
  rationale: “Berfirman” adalah ungkapan Indonesia yang lazim bagi tindakan Allah menyampaikan perkataan, tanpa menambahkan isi teologis yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami untuk formula ujaran yang berlanjut ke ayat berikutnya; catatan kaki mempertahankan bentuk Ibrani dan alternatif bagi kata penghubung.
