base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: id
  text: Lalu ia berbicara kepada umat itu, katanya, “Menjauhlah, kiranya, dari kemah-kemah orang-orang fasik ini dan jangan sentuh apa pun yang menjadi milik mereka, supaya kalian tidak turut dilenyapkan dalam segala dosa mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “supaya kalian tidak dilenyapkan akibat segala dosa mereka.” Bahasa Ibrani dapat dipahami dengan nuansa sebab yang lebih tegas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה menunjuk kepada umat Israel sebagai kelompok yang berhimpun. ‘Umat itu’ alami dalam narasi Pentateukh dan mempertahankan makna kolektifnya.
- source_word: סוּרוּ נָא
  choice: Menjauhlah kiranya
  rationale: Imperatif סוּר memerintahkan mereka beranjak atau menjauh, sedangkan נָא memberi nada permohonan yang mendesak, bukan sekadar arti waktu ‘sekarang’.
- source_word: מֵעַל אָהֳלֵי
  choice: dari kemah
  rationale: מֵעַל dalam konteks ini secara idiomatis menyatakan gerakan menjauh dari sekitar kemah-kemah tersebut. Bahasa Indonesia wajar memakai bentuk kolektif ‘kemah’.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: orang-orang fasik ini
  rationale: רְשָׁעִים memiliki nuansa moral dan yudisial. ‘Orang-orang fasik’ mempertahankan penilaian tersebut serta rujukan jamak yang spesifik.
- source_word: וְאַל תִּגְּעוּ
  choice: dan jangan sentuh
  rationale: נגע secara langsung berarti menyentuh atau bersentuhan. Terjemahan ini mempertahankan larangan sederhana tanpa menafsirkan bentuk kontaknya lebih jauh.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: apa pun yang menjadi milik mereka
  rationale: Ungkapan ini mencakup seluruh kepunyaan mereka; sesudah larangan negatif, ‘apa pun’ menyampaikan cakupan distributifnya secara alami.
- source_word: פֶּן תִּסָּפוּ
  choice: supaya kalian tidak turut dilenyapkan
  rationale: פֶּן memperkenalkan akibat yang harus dihindari, sedangkan bentuk Nifal ספה menyatakan dilenyapkan atau tersapu dalam penghukuman. ‘Turut’ menangkap bahaya ikut terkena penghukuman yang mendatang.
- source_word: בְּכָל חַטֹּאתָם
  choice: dalam segala dosa mereka
  rationale: Preposisi ב dapat menyatakan keterkaitan atau keadaan, bukan hanya sebab. Bentuk ini sengaja mempertahankan keluasan makna Ibrani meskipun alternatif kausal dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Keikutsertaan dalam penghukuman karena kedekatan dengan orang fasik
  choice: Peringatan itu mengharuskan umat menjauh dari orang-orang tersebut dan milik mereka agar tidak turut dilenyapkan dalam penghukuman yang berkaitan dengan dosa mereka.
  alternative: 'Klausa terakhir dapat diterjemahkan secara kausal: ‘supaya kalian tidak dilenyapkan akibat segala dosa mereka.’'
  rationale: Teks Ibrani menghubungkan bahaya yang dihadapi umat dengan kedekatan mereka dan penghukuman yang akan datang, tetapi tidak menjelaskan hubungan itu semata-mata sebagai pemindahan kesalahan atau sebab-akibat. Terjemahan utama mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Kiranya’ mempertahankan nada permohonan mendesak נָא tanpa menjadikannya sekadar penanda waktu; ‘kalian’ memperjelas bahwa perintah ditujukan kepada umat secara jamak. Penanda catatan kaki ditempatkan pada klausa yang benar-benar dijelaskannya.
