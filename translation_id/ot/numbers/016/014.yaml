  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: id
  text: Sungguh, engkau tidak membawa kami ke negeri yang berlimpah dengan susu dan madu, dan tidak pula memberi kami tanah pusaka berupa ladang dan kebun anggur. Apakah engkau hendak mencungkil mata orang-orang ini?[a] Kami tidak akan naik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah engkau hendak membutakan orang-orang ini?” Ungkapan Ibrani secara harfiah berbunyi “mencungkil mata” dan mungkin juga menyiratkan perlakuan atau penipuan seolah-olah mereka buta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: Bahkan, ... tidak
  rationale: אַף menegaskan dan meneruskan keluhan. “Bahkan” menyampaikan daya retoris itu secara alami bersama negasi berikutnya.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: ke negeri yang berlimpah susu dan madu
  rationale: Ungkapan Ibrani ini menggambarkan kelimpahan negeri; “berlimpah” mempertahankan maknanya dalam bahasa Indonesia yang wajar.
- source_word: הֲבִיאֹתָנוּ
  choice: engkau tidak membawa kami
  rationale: Bentuknya berada dalam rangkaian keluhan retoris dan bersama לֹא menyatakan tuduhan tegas bahwa Musa gagal membawa mereka ke negeri tersebut.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: dan tidak pula memberi kami tanah pusaka berupa ladang dan kebun anggur
  rationale: נַחֲלָה adalah milik atau bagian warisan; “tanah pusaka” sesuai konteks pembagian tanah. Nomina tunggal שָׂדֶה dan כֶּרֶם dipertahankan secara distributif dan alami.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Apakah engkau hendak mencungkil mata orang-orang ini?
  rationale: Piel נקר secara konkret berarti mencungkil atau membutakan. Citra keras dalam teks dipertahankan, sementara kemungkinan makna kiasannya dijelaskan dalam catatan kaki.
- source_word: לֹא נַעֲלֶה
  choice: Kami tidak mau datang menghadap
  rationale: עלה harfiah berarti naik, tetapi di sini menunjuk pada penolakan memenuhi panggilan Musa. “Datang menghadap” menyampaikan arah menuju pemanggil dan fungsi ungkapan dalam konteks.
theological_decisions:
- issue: Apakah pencungkilan mata dimaksudkan secara harfiah atau sebagai tuduhan penipuan
  choice: Mempertahankan gambaran harfiah “mencungkil mata” dalam teks utama
  alternative: “Membutakan orang-orang ini” atau mengungkapkannya langsung sebagai penipuan
  rationale: Bahasa sumber memakai citra konkret yang mungkin berfungsi secara kiasan. Terjemahan tidak menetapkan satu tafsiran secara diam-diam; kemungkinan kiasan dicatat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” mempertahankan tuturan langsung tunggal kepada Musa. “Tanah pusaka” dipakai sebagai istilah umum yang dapat dipahami, sedangkan “datang menghadap” menghindari terjemahan spasial yang kaku tanpa menghilangkan konteks panggilan.
