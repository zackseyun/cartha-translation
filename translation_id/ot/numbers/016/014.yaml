    issue: “Bahkan” untuk אַף לֹא
    rationale: “Bahkan” dapat terdengar sebagai tambahan atau kontras, sedangkan konteks ini menegaskan tuduhan yang menyusul. “Sungguh” menyampaikan daya penegasnya lebih tepat.
  - severity: medium
    issue: “Kami tidak mau datang menghadap” untuk לֹא נַעֲלֶה
    rationale: Padanan ini menjelaskan konteks, tetapi menghilangkan verba עלה (“naik”). Karena ungkapan tetap jelas dalam bahasa Indonesia, “Kami tidak akan naik” sebaiknya dipertahankan.
  - severity: low
    issue: Catatan kaki menyebut “kenyataan”
    rationale: Teks tidak menentukan objek yang tidak dilihat. Rumusan yang lebih umum menjaga ambiguitas idiom Ibrani.
