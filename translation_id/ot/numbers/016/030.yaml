source:
  edition: WLC
  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: id
  text: Namun, jika Yahweh menciptakan sesuatu yang baru[a], dan tanah itu membuka mulutnya serta menelan mereka dan segala sesuatu yang menjadi milik mereka, dan mereka turun hidup-hidup ke Syeol[b], maka kamu akan tahu bahwa orang-orang ini telah memandang hina Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menciptakan suatu hal yang belum pernah terjadi” atau, secara harfiah, “menciptakan suatu ciptaan.” Bahasa Ibrani memakai kata benda dan kata kerja yang seakar untuk menekankan tindakan Allah yang luar biasa.
    reason: lexical_alternative
  - marker: b
    text: Syeol adalah istilah Ibrani bagi alam orang mati; dalam arti yang lebih konkret, dapat juga diterjemahkan “kubur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: menciptakan sesuatu yang baru
  rationale: Gabungan nomina dan verba serumpun menekankan tindakan penciptaan ilahi yang luar biasa. Ungkapan ini alami dalam bahasa Indonesia, sedangkan bentuk harfiah 'menciptakan suatu ciptaan' dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: tanah membuka mulutnya
  rationale: אֲדָמָה menunjuk pada tanah di bawah mereka, dan gambaran antropomorfis 'membuka mulutnya' dipertahankan.
- source_word: וּבָלְעָה
  choice: menelan
  rationale: Padanan langsung dan wajar untuk tindakan tanah yang mengengulf mereka.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: segala milik mereka
  rationale: Mempertahankan cakupan luas frasa tanpa menentukan secara berlebihan apa saja yang termasuk di dalamnya.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: mereka turun hidup-hidup ke Syeol
  rationale: Bentuk 'hidup-hidup' memberi penekanan alami dalam bahasa Indonesia, sedangkan Syeol mempertahankan istilah Ibrani yang lebih luas daripada sekadar kubur.
- source_word: וִידַעְתֶּם
  choice: maka kamu akan tahu
  rationale: Kata 'maka' menyatakan hasil dari syarat yang diawali dengan 'jika'.
- source_word: נִאֲצוּ
  choice: telah menghina
  rationale: Mengungkapkan sikap meremehkan dan menolak dengan penuh penghinaan terhadap Yahweh.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: orang-orang ini
  rationale: Dalam bahasa Indonesia, 'orang-orang ini' merupakan padanan alami bagi bentuk jamak yang merujuk kepada kelompok laki-laki dalam konteks, tanpa mengubah referennya.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: Syeol
  alternative: kubur; dunia orang mati
  rationale: Transliterasi mempertahankan keluasan konsep Ibrani dan tidak membatasinya hanya pada tempat penguburan; penjelasan dan alternatif diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. Struktur bersyarat Ibrani dipertahankan secara alami melalui pasangan 'jika ... maka'. Nama Yahweh dan istilah Syeol ditransliterasikan secara konsisten.
