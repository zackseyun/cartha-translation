revisions:
- from: Namun, jika Yahweh menciptakan sesuatu yang baru[a], lalu tanah membuka mulutnya dan menelan mereka beserta segala milik mereka, dan mereka turun hidup-hidup ke Syeol[b], maka kamu akan tahu bahwa orang-orang ini telah menghina Yahweh.
  to: Namun, jika Yahweh menciptakan sesuatu yang baru[a], dan tanah itu membuka mulutnya serta menelan mereka dan segala sesuatu yang menjadi milik mereka, dan mereka turun hidup-hidup ke Syeol[b], maka kamu akan tahu bahwa orang-orang ini telah memandang hina Yahweh.
  rationale: Revisi memperluas ‘segala milik mereka’ agar mencerminkan cakupan כָּל אֲשֶׁר לָהֶם, serta mengganti ‘menghina’ dengan ‘memandang hina’ untuk menyampaikan nuansa contemptuous rejection dari נִאֲצוּ. Penyesuaian kecil pada penghubung dan ‘tanah itu’ meningkatkan kelancaran tanpa mengubah struktur atau makna.
  reviewer_model: gpt-5.6-terra
