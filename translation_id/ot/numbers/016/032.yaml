base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: id
  text: Lalu bumi membuka mulutnya dan menelan mereka, seisi rumah mereka[a], semua orang yang termasuk pihak Korah[b], serta seluruh harta benda mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rumah-rumah mereka.” Kata Ibrani ini dapat menunjuk pada bangunan rumah atau, dalam arti yang lebih luas, pada rumah tangga beserta anggotanya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seluruh orang yang bagi Korah.” Bahasa Ibrani memakai אָדָם dalam arti kolektif; preposisi yang dipakai menyatakan hubungan dengan Korah tanpa merinci sifat hubungan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: bumi membuka mulutnya
  rationale: Mempertahankan personifikasi dan gambaran harfiah bahasa Ibrani; פתח berarti ‘membuka’, tanpa perlu menambahkan nuansa ‘terbelah’.
- source_word: וַתִּבְלַע
  choice: menelan
  rationale: Padanan langsung dan wajar untuk בלע, sekaligus mempertahankan gambaran bumi yang bermulut.
- source_word: בָּתֵּיהֶם
  choice: seisi rumah mereka
  rationale: בַּיִת dalam bentuk ini dapat menunjuk pada rumah secara fisik atau keluarga/rumah tangga. Dalam konteks orang-orang yang ikut ditelan, ‘seisi rumah’ menyampaikan pengertian rumah tangga secara alami tanpa menghapus arti dasar ‘rumah’.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: semua orang yang termasuk pihak Korah
  rationale: אָדָם berbentuk tunggal tetapi dipakai secara kolektif dengan כָּל. Ungkapan ‘termasuk pihak Korah’ mencerminkan hubungan yang dinyatakan secara luas oleh לְ tanpa mempersempitnya menjadi kepemilikan, kedekatan fisik, atau jenis keanggotaan tertentu.
- source_word: כָּל־הָרֲכוּשׁ
  choice: seluruh harta benda mereka
  rationale: רְכוּשׁ menunjuk pada milik atau harta, khususnya barang-barang kepunyaan; ‘harta benda’ merupakan ungkapan Indonesia yang jelas dan luas.
theological_decisions:
- issue: Cakupan kolektif אָדָם dan hubungan orang-orang itu dengan Korah
  choice: semua orang yang termasuk pihak Korah
  alternative: setiap laki-laki yang menjadi milik Korah; semua orang yang bersama Korah
  rationale: Bentuk Ibrani memakai אָדָם tunggal secara kolektif, bukan ungkapan yang dengan sendirinya menegaskan bahwa hanya laki-laki yang dimaksud. Preposisi לְ menyatakan hubungan dengan Korah secara ringkas dan terbuka. Terjemahan utama mempertahankan cakupan kolektif serta tidak menentukan apakah hubungan itu berupa kepemilikan, rumah tangga, keanggotaan, atau keberpihakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Metafora ‘bumi membuka mulutnya’ dipertahankan, sedangkan susunan daftar dibuat alami dengan ‘serta’ pada unsur terakhir.
