    rationale: Bentuk Ibrani menyusun pertanyaan retoris dengan „satu orang berdosa” lalu pertanyaan tentang murka atas seluruh jemaat. Terjemahan dapat mempertahankan hubungan retoris itu secara lebih langsung.
