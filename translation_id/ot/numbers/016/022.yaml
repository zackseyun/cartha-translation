  to: Lalu mereka tersungkur dengan muka ke tanah dan berkata, “Ya Allah, Allah bagi roh semua manusia,[a] satu orang saja berdosa, tetapi apakah Engkau akan murka kepada seluruh umat?”
  rationale: Revisi menghapus tambahan penafsiran „berkuasa atas” dan memakai „Allah bagi roh semua manusia” untuk menyampaikan gelar Ibrani secara lebih netral dalam bahasa Indonesia. Klausa retoris tentang satu orang yang berdosa juga dibuat lebih langsung. Catatan b dihapus dari teks karena tidak ada lagi penanda yang ditempatkan sesudah „satu orang”; isinya tidak diperlukan untuk memahami teks utama dan tidak boleh dibiarkan tanpa jangkar.
