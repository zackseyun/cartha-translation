base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: id
  text: Lalu mereka tersungkur dengan muka ke tanah dan berkata, “Ya Allah, Allah bagi roh semua manusia,[a] satu orang saja berdosa, tetapi apakah Engkau akan murka kepada seluruh umat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Allah, Allah roh-roh segala daging.” Kata “roh” juga dapat berarti “napas”; gelar ini dapat pula menekankan Allah sebagai pemberi kehidupan kepada semua makhluk hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: mereka sujud dengan muka sampai ke tanah
  rationale: Mengungkapkan tindakan merendahkan diri dan memohon dengan mempertahankan gambaran konkret ungkapan Ibrani, tetapi tetap alami dalam bahasa Indonesia.
- source_word: אֵל
  choice: Ya Allah
  rationale: Partikel 'Ya' menyatakan fungsi vokatif dalam seruan langsung kepada Allah.
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Allah yang berkuasa atas roh semua manusia
  rationale: Konstruksi Ibrani secara harfiah berbunyi 'Allah dari roh-roh segala daging'. Ungkapan relasional 'berkuasa atas' menyampaikan otoritas dan pengetahuan Allah atas batin setiap manusia, yang sesuai dengan permohonan agar Ia membedakan kesalahan pribadi dari umat secara keseluruhan.
- source_word: בָּשָׂר
  choice: manusia
  rationale: Dalam ungkapan 'segala daging', kata ini mengacu secara kolektif kepada manusia. 'Semua manusia' lebih mudah dipahami pembaca modern daripada idiom harfiah 'segala daging'.
- source_word: הָאִישׁ אֶחָד
  choice: satu orang saja
  rationale: Kata אִישׁ berbentuk maskulin tunggal, tetapi dalam konteks ini menunjuk seorang individu sebagai lawan seluruh umat. Bahasa Indonesia lazim memakai 'orang'; 'saja' menegaskan kontras yang dinyatakan oleh אֶחָד.
- source_word: יֶחֱטָא
  choice: jika ... berdosa
  rationale: Bentuk imperfek berada dalam pertanyaan yang bernuansa pengandaian. 'Jika' menghasilkan pertanyaan Indonesia yang alami tanpa menetapkan waktu atau aspek secara berlebihan.
- source_word: כָּל־הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk komunitas Israel yang berhimpun. 'Umat' alami dan sesuai dengan latar komunal ini.
- source_word: תִּקְצֹף
  choice: akan murka
  rationale: '''Murka'' mempertahankan bobot kemarahan ilahi yang terkandung dalam קצף dan tetap merupakan bahasa Indonesia modern yang bermartabat.'
theological_decisions:
- issue: Makna antropologis אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Gelar yang menekankan kuasa dan pengetahuan Allah atas roh atau batin setiap manusia.
  alternative: Gelar yang menekankan Allah sebagai pemberi napas dan kehidupan kepada semua makhluk hidup.
  rationale: Konteksnya adalah permohonan agar Allah membedakan kesalahan individu dari seluruh umat. Namun, kemungkinan makna 'napas' sebagai sumber kehidupan dipertahankan dalam catatan kaki.
- issue: Rujukan gender הָאִישׁ אֶחָד
  choice: satu orang saja
  alternative: satu laki-laki saja
  rationale: Walaupun אִישׁ berbentuk maskulin, fokus kontrasnya adalah seorang individu dibandingkan seluruh umat. Terjemahan 'orang' tidak mengubah identitas tokoh dalam konteks dan lebih alami dalam pertanyaan bahasa Indonesia.
- issue: Hubungan dosa seorang individu dengan murka terhadap umat
  choice: 'Pertanyaan retoris dibiarkan terbuka: ''jika satu orang saja berdosa ...?'''
  alternative: Menjelaskan secara eksplisit bahwa dosa pemimpin tidak boleh mendatangkan hukuman atas semua orang.
  rationale: Teks menyampaikan permohonan dalam bentuk pertanyaan dan tidak merumuskan prinsip teologis secara lengkap; terjemahan mempertahankan ketegangan antara kesalahan pribadi dan tanggung jawab bersama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Sujud dengan muka sampai ke tanah' mempertahankan gerak tubuh konkret; 'murka' mempertahankan bobot religius tanpa menjadi arkais. Semua penanda catatan kaki ditempatkan dalam teks utama.
