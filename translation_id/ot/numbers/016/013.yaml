source:
  edition: WLC
  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: id
  text: Belum cukupkah bahwa engkau telah membawa kami keluar dari negeri yang berlimpah susu dan madu[a] untuk membunuh kami di padang belantara? Apakah engkau juga benar-benar hendak berkuasa atas kami?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Para pembicara secara ironis menyebut Mesir “negeri yang berlimpah susu dan madu”, ungkapan yang di bagian lain dipakai untuk negeri yang dijanjikan.
    reason: cultural_note
  - marker: b
    text: 'Atau: “menjadikan dirimu penguasa atas kami” atau “memerintah kami.” Pengulangan bentuk verba dalam bahasa Ibrani memberi penegasan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Belum cukupkah
  rationale: Ungkapan tanya retoris ini menyatakan kejengkelan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya tuduhnya.
- source_word: הֶעֱלִיתָנוּ
  choice: engkau telah membawa kami keluar
  rationale: Bentuk kausatif verba עלה secara harfiah menyatakan 'membawa naik'. Dalam konteks perpindahan dari Mesir, 'membawa ... keluar' lebih alami dalam bahasa Indonesia tanpa menghilangkan acuan kepada peristiwa keluaran.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: dari negeri yang berlimpah susu dan madu
  rationale: Mempertahankan gambaran kelimpahan dan ironi tajam ketika para pemberontak menerapkan kepada Mesir ungkapan yang biasanya menggambarkan negeri perjanjian.
- source_word: לַהֲמִיתֵנוּ
  choice: untuk membunuh kami
  rationale: Infinitif tujuan diterjemahkan secara langsung dan tegas.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Menggambarkan wilayah liar dan tandus tempat Israel mengembara, tanpa membatasinya pada gurun pasir.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: hendak berkuasa sewenang-wenang
  rationale: Verba ini berarti menjalankan kekuasaan atau bertindak sebagai penguasa. Gabungan infinitif absolut dan verba finit memberi penekanan; 'berkuasa sewenang-wenang' menangkap nada tuduhan bahwa Musa memaksakan kekuasaan atas mereka.
- source_word: גַּם
  choice: juga
  rationale: 'Menandai keluhan tambahan: selain dituduh membawa mereka menuju kematian, Musa dituduh hendak menguasai mereka.'
theological_decisions:
- issue: Sebutan ironis bagi Mesir sebagai negeri yang berlimpah susu dan madu
  choice: Mempertahankan ungkapan itu dalam teks utama dan menjelaskan ironinya dalam catatan kaki
  alternative: Menambahkan penanda sarkasme secara eksplisit dalam teks utama
  rationale: Bahasa Ibrani menyampaikan ironi melalui konteks. Penanda sarkasme tambahan akan mempersempit cara pembaca memahami ucapan para pemberontak.
- issue: Sifat kekuasaan yang dituduhkan kepada Musa
  choice: berkuasa sewenang-wenang atas kami
  alternative: menjadikan dirimu penguasa atas kami
  rationale: Pilihan utama menyampaikan arti menjalankan kekuasaan dan nada negatif yang melekat pada tuduhan tersebut, sedangkan alternatif lebih mempertahankan gambaran menjadi penguasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tuduhan yang tegas. Kata ganti 'engkau' dipakai karena ucapan ditujukan kepada satu orang, yaitu Musa. Struktur dibagi menjadi dua pertanyaan agar alami dan jelas, sementara pengulangan retoris serta keluhan tambahan dalam bahasa Ibrani tetap terasa.
