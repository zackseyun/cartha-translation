id: NUM.16.21
reference: Numbers 16:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: id
  text: “Pisahkanlah diri kalian dari tengah-tengah umat ini, supaya Aku menghabisi mereka dalam sekejap.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Pisahkanlah diri kalian
  rationale: Bentuk imperatif jamak Nifal dari בדל menyatakan tindakan memisahkan diri; pilihan ini mempertahankan nuansa refleksif dan sapaan kepada beberapa orang.
- source_word: מִתּוֹךְ
  choice: dari tengah-tengah
  rationale: Gabungan מן dan תוך menunjuk pada gerakan keluar dari bagian dalam suatu kelompok, sehingga daya spasial teks sumber tetap terpelihara.
- source_word: הָעֵדָה הַזֹּאת
  choice: umat ini
  rationale: עֵדָה di sini menunjuk pada komunitas Israel sebagai kelompok bersama. 'Umat' alami dalam bahasa Indonesia dan sesuai dengan konteks Pentateukh.
- source_word: וַאֲכַלֶּה
  choice: supaya Aku menghabisi
  rationale: Bentuk orang pertama ini sesudah perintah menyampaikan maksud atau hasil yang dikehendaki. 'Menghabisi' mempertahankan kekuatan כלה sebagai tindakan menuntaskan atau memusnahkan, tanpa memperlunak ancaman penghakiman.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek langsung ini merujuk kepada umat yang berada di bawah ancaman penghakiman.
- source_word: כְּרָגַע
  choice: dalam sekejap
  rationale: רֶגַע berarti waktu yang amat singkat; 'dalam sekejap' menyampaikan kecepatan dan ketiba-tibaan tindakan tersebut secara wajar.
theological_decisions:
- issue: Sifat ancaman atau pernyataan penghakiman ilahi
  choice: Mengungkapkannya sebagai maksud nyata untuk menghabisi umat dengan segera.
  alternative: Memperlunaknya menjadi 'menangani mereka' atau 'menyingkirkan mereka'.
  rationale: כלה dalam konteks ini memiliki daya penghakiman yang kuat. Terjemahan mempertahankan kerasnya tindakan yang dinyatakan tanpa menyelesaikan atau mengurangi ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan khidmat. Bentuk 'kalian' dipakai karena perintah Ibrani berjumlah jamak, sedangkan kapitalisasi 'Aku' menandai pembicara ilahi.
