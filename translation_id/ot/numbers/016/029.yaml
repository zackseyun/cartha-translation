id: NUM.16.29
reference: Numbers 16:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: id
  text: Jika orang-orang ini mati sebagaimana semua manusia mati, dan apa yang menimpa semua manusia menimpa mereka[a], maka Yahweh tidak mengutus aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai kata benda dan kata kerja dari akar yang sama, yang dapat mengandung arti sesuatu yang ditetapkan, didatangkan, atau menimpa seseorang. Terjemahan lain: “dan nasib semua manusia berlaku juga atas mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Memperkenalkan syarat yang diajukan Musa secara langsung dan wajar dalam bahasa Indonesia.
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: orang-orang ini mati sebagaimana semua manusia mati
  rationale: Ungkapan ini menyatakan kematian menurut keadaan umum manusia. 'Sebagaimana' mempertahankan unsur perbandingan, sedangkan 'semua manusia' menyampaikan אָדָם sebagai sebutan kolektif dan generik.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: dan apa yang menimpa semua manusia menimpa mereka
  rationale: Pengulangan 'menimpa ... menimpa' mencerminkan pengulangan akar פקד dalam bentuk kata benda dan kata kerja, sambil mempertahankan keluasan maknanya tanpa membatasinya menjadi hukuman.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: berarti bukan Yahweh yang mengutus aku
  rationale: '''Berarti'' menandai kesimpulan dari syarat sebelumnya; konstruksi ''bukan Yahweh yang'' mempertahankan penekanan Ibrani pada identitas pihak yang mengutus.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Makna פקד dalam konteks tanda yang diajukan Musa
  choice: apa yang menimpa ... menimpa
  alternative: nasib ... dialami; mendapat perlakuan yang biasa diterima
  rationale: Akar ini dapat menunjuk pada pemeriksaan, penetapan, atau sesuatu yang mendatangi seseorang. Pilihan tersebut tidak secara dini menentukan bahwa yang dimaksud pasti hukuman, dan tetap memperlihatkan pengulangan akar dalam bahasa sumber.
- issue: Makna kolektif כָּל הָאָדָם
  choice: semua manusia
  alternative: semua orang; seluruh umat manusia
  rationale: אָדָם di sini menunjuk pada keadaan manusia secara umum, bukan hanya laki-laki.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Bentuk ini mempertahankan nama perjanjian yang terdapat secara langsung dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Susunan kalimat mempertahankan bentuk pengandaian dan penekanan kesimpulan Musa, sementara pengulangan 'menimpa' sengaja dipakai untuk mencerminkan permainan akar kata Ibrani.
