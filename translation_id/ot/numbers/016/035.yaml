  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: id
  text: Lalu api keluar dari Yahweh dan menghanguskan dua ratus lima puluh orang yang sedang mempersembahkan dupa itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: Lalu ... api
  rationale: אֵשׁ berarti 'api'. Konjungsi וְ dalam rangkaian naratif diterjemahkan 'Lalu' agar urutan peristiwa terdengar alami dalam bahasa Indonesia.
- source_word: יָצְאָה
  choice: keluarlah
  rationale: Bentuk dari יצא menyatakan gerak keluar. 'Keluarlah' mempertahankan tindakan tersebut dan memberi alur naratif yang wajar.
- source_word: מֵ/אֵת יְהוָה
  choice: dari hadapan Yahweh
  rationale: מֵאֵת secara lebih formal menunjuk asal dari sisi atau hadapan seseorang. 'Dari hadapan Yahweh' mempertahankan bentuk khas frasa Ibrani tanpa mengaburkan bahwa Yahweh adalah sumber api itu.
- source_word: וַ/תֹּאכַל
  choice: dan menghanguskan
  rationale: אכל secara harfiah berarti 'memakan', tetapi dengan api sebagai subjek bermakna menghabiskan atau membinasakan oleh api. 'Menghanguskan' alami dan konkret dalam konteks ini.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: kedua ratus lima puluh orang
  rationale: Frasa bilangan Ibrani menyebut kelompok tertentu yang berjumlah 250 orang. Bentuk 'kedua ratus lima puluh orang' menandai kelompok definit yang sudah dikenal dari konteks.
- source_word: מַקְרִיבֵי
  choice: yang sedang mempersembahkan
  rationale: Partisipel hiphil dari קרב menggambarkan tindakan yang dilakukan kelompok itu pada saat kejadian. 'Yang sedang mempersembahkan' mempertahankan aspek tindakan yang berlangsung.
- source_word: הַ/קְּטֹרֶת
  choice: dupa itu
  rationale: קְטֹרֶת adalah dupa ritual. Kata tunjuk 'itu' menyampaikan kejelasan artikel Ibrani dan rujukan kepada dupa tertentu dalam peristiwa tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Nuansa frasa מֵאֵת יְהוָה
  choice: dari hadapan Yahweh
  alternative: dari Yahweh
  rationale: Pilihan utama mempertahankan ungkapan relasional-spasial מֵאֵת, sedangkan alternatif lebih idiomatis dan menekankan sumber. Catatan kaki menjaga keduanya tanpa memaksakan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Inversi ringan 'keluarlah api' mempertahankan tekanan naratif tanpa terasa usang; istilah ritual 'dupa' mudah dipahami pembaca umum.
