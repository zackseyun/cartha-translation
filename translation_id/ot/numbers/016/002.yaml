  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: id
  text: lalu mereka bangkit di hadapan Musa, bersama dengan dua ratus lima puluh orang dari kalangan orang Israel, para pemimpin umat, orang-orang yang dipanggil untuk menghadiri sidang[a], orang-orang ternama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang dipanggil ke pertemuan.” Frasa Ibraninya dapat menunjuk orang-orang yang secara resmi dipanggil untuk menghadiri sidang umat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: lalu bangkitlah mereka
  rationale: Bentuk wayyiqtol dari קום melanjutkan alur narasi. 'Bangkitlah' mempertahankan gambaran tindakan tanpa memasukkan arti 'memberontak' ke dalam verba itu sendiri.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan arti spasial-relasional 'di depan/di hadapan'. Konteks dapat menyiratkan konfrontasi tanpa menerjemahkannya secara eksplisit sebagai 'melawan'.
- source_word: וַאֲנָשִׁים
  choice: bersama dengan ... orang
  rationale: Susunan Ibrani bersifat eliptis sesudah verba; ungkapan ini menghubungkan 250 orang itu dengan mereka yang bangkit secara wajar dalam bahasa Indonesia.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dari antara keturunan Israel
  rationale: בְּנֵי secara harfiah berarti 'anak-anak lelaki/putra-putra', tetapi dalam sebutan komunal ini menunjuk anggota umat Israel. 'Keturunan Israel' alami dalam bahasa Indonesia dan tetap menjaga nuansa asal-usul perjanjian.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: dua ratus lima puluh
  rationale: Bentuk bilangan baku dalam bahasa Indonesia modern.
- source_word: נְשִׂיאֵי עֵדָה
  choice: para pemimpin umat
  rationale: נָשִׂיא menunjuk pemimpin atau kepala, sedangkan עֵדָה di sini adalah komunitas Israel. 'Umat' jelas dan bermartabat dalam konteks ini.
- source_word: קְרִאֵי מוֹעֵד
  choice: orang-orang yang dipanggil menghadiri pertemuan
  rationale: Frasa ini kemungkinan menunjuk orang-orang yang dipanggil atau ditunjuk untuk pertemuan resmi umat. Terjemahan ini mempertahankan unsur panggilan dan fungsi kelembagaannya.
- source_word: אַנְשֵׁי שֵׁם
  choice: orang-orang ternama
  rationale: Idiom harfiah 'orang-orang bernama' berarti orang yang bereputasi atau terkenal. 'Orang-orang ternama' menyampaikan maknanya secara alami.
theological_decisions:
- issue: Apakah לִפְנֵי harus diterjemahkan sebagai tindakan melawan Musa
  choice: di hadapan Musa
  alternative: melawan Musa
  rationale: Preposisi itu sendiri berarti 'di hadapan/di depan'. Walaupun konteksnya konfrontatif, terjemahan tidak menambahkan penafsiran permusuhan ke dalam kata tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Ayat ini melanjutkan kalimat dari ayat sebelumnya, sehingga dibuka dengan huruf kecil. Struktur daftar dipertahankan, sementara ungkapan eliptis Ibrani dibuat alami tanpa menghilangkan ketegangan makna.
