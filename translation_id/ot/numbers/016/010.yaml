  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: id
  text: Ia telah mendekatkan engkau, bersama semua saudaramu, keturunan Lewi[a]. Namun kalian juga mencari jabatan imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang Lewi.”'
    reason: Alternatif leksikal untuk “keturunan Lewi” (בני לוי).
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: telah membawa ... mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa atau membuat seseorang mendekat. Ungkapan ini mempertahankan makna kedekatan sekaligus hak istimewa untuk melayani di hadapan Allah.
- source_word: אֹתְךָ
  choice: engkau
  rationale: Objek tunggal maskulin yang ditujukan kepada Korah secara pribadi; 'engkau' sesuai dengan ragam yang bermartabat.
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: juga semua saudaramu, keturunan Lewi
  rationale: '''Saudaramu'' menerjemahkan אַחֶיךָ secara langsung, sedangkan ''keturunan Lewi'' menjelaskan aposisi בְנֵי לֵוִי tanpa membatasi maknanya pada saudara kandung.'
- source_word: אִתָּךְ
  choice: bersama engkau
  rationale: Menunjukkan bahwa sesama keturunan Lewi dibawa mendekat bersama Korah.
- source_word: וּבִקַּשְׁתֶּם
  choice: Namun, kalian ... mencari
  rationale: Kata kerja berbentuk jamak, sehingga sapaan beralih dari Korah seorang diri kepada kelompoknya. 'Namun' menyatakan pertentangan kontekstual, sementara 'mencari' mempertahankan gambaran keinginan untuk memperoleh sesuatu.
- source_word: גַּם
  choice: juga
  rationale: Menandai bahwa jabatan imam merupakan tambahan atas kedudukan pelayanan yang telah diberikan kepada mereka.
- source_word: כְּהֻנָּה
  choice: jabatan imam
  rationale: Mengacu pada kedudukan atau fungsi kelembagaan para imam, bukan sekadar kegiatan pelayanan secara umum.
theological_decisions:
- issue: Pembedaan kedudukan ibadah antara orang Lewi dan imam
  choice: jabatan imam
  alternative: keimaman; pelayanan imam
  rationale: Pilihan ini mempertahankan pembedaan dalam konteks antara pelayanan yang telah dipercayakan kepada orang Lewi dan jabatan imam yang mereka cari.
- issue: Daya retoris klausa penutup
  choice: pertanyaan retoris
  alternative: 'pernyataan: ''Namun, kalian juga mencari jabatan imam.'''
  rationale: Dalam konteks teguran Musa, klausa penutup paling wajar dipahami sebagai pertanyaan retoris. Bahasa Ibrani dapat menyampaikan pertanyaan demikian tanpa partikel tanya eksplisit, tetapi ketidakjelasan bentuknya tetap dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pergeseran dari 'engkau' (tunggal, Korah) ke 'kalian' (jamak, Korah dan kelompoknya) dipertahankan agar jumlah gramatikal bahasa Ibrani terlihat jelas.
