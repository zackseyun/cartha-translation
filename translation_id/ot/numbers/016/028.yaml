  source_fidelity: 'Terjemahan dengan setia mencerminkan unsur-unsur utama Ibrani: pengantar naratif, demonstratif instrumental "Dengan inilah", masa depan jamak "kamu akan mengetahui", nama ilahi Yahweh, pengutusan Musa, "segala perbuatan ini", dan penegasan bahwa tindakan tersebut tidak berasal dari hati atau prakarsa Musa sendiri. Klausa terakhir secara wajar mengambil כִּי sebagai isi kedua dari apa yang akan diketahui, suatu pilihan yang sah tanpa meniadakan ambiguitas sintaksisnya.'
