  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: id
  text: Lalu Musa berkata, “Dengan inilah kamu akan mengetahui bahwa Yahweh telah mengutus aku untuk melakukan segala perbuatan ini, dan bahwa semuanya itu bukan berasal dari hatiku sendiri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Lalu Musa berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam bahasa Indonesia dan tidak memberi tafsiran berlebihan.
- source_word: בְּזֹאת
  choice: Dengan inilah
  rationale: Preposisi בְּ berfungsi instrumental dan menunjuk pada peristiwa atau tanda yang akan membuktikan pengutusan Musa.
- source_word: תֵּדְעוּן
  choice: kamu akan mengetahui
  rationale: Bentuk imperfek orang kedua jamak menyatakan hasil yang akan diketahui; “kamu” dapat dipahami secara kolektif sesuai konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan langsung sebagai Yahweh, sejalan dengan bentuk nama perjanjian dalam teks sumber.
- source_word: שְׁלָחַנִי
  choice: telah mengutus aku
  rationale: Bentuk perfektif menunjuk pada pengutusan yang sudah terjadi dan tetap relevan bagi pembuktian yang akan menyusul.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: untuk melakukan segala perbuatan ini
  rationale: מַעֲשִׂים berarti tindakan atau perbuatan; ungkapan ini mempertahankan keluasan makna tanpa membatasinya pada mukjizat tertentu.
- source_word: כִּי לֹא מִלִּבִּי
  choice: dan bahwa semuanya itu bukan berasal dari hatiku sendiri
  rationale: כִּי dipahami sebagai pengantar isi kedua dari “kamu akan mengetahui.” Ungkapan “dari hatiku” dipertahankan dengan tambahan “sendiri” agar idiomnya jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan klausa terakhir כִּי לֹא מִלִּבִּי
  choice: dan bahwa semuanya itu bukan berasal dari hatiku sendiri
  alternative: sebab semuanya itu bukan berasal dari hatiku sendiri
  rationale: כִּי dapat memperkenalkan isi tambahan ataupun alasan. Pilihan ini mengikuti struktur “kamu akan mengetahui bahwa ... dan bahwa ...” serta mempertahankan klaim Musa bahwa tindakannya tidak berasal dari prakarsanya sendiri.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan dua hal yang akan diketahui para pendengar: Yahweh mengutus Musa dan tindakan itu bukan berasal dari prakarsa Musa sendiri. Tidak diperlukan catatan kaki karena idiom dijelaskan secara cukup jelas dalam teks utama.'
