  terminology: '"Yahweh" konsisten dengan kebijakan yang diberikan untuk יְהוָה. "Mengutus", "melakukan", dan "perbuatan" merupakan padanan yang tepat dan tidak menambahkan penafsiran teologis tertentu.'
