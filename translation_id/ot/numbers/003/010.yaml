review_pass:
  verdict: approve
  source_fidelity: Terjemahan setia pada Ibrani. “Tetapkanlah” menyampaikan תִּפְקֹד dalam arti penugasan/penetapan jabatan; “menjaga jabatan imam mereka” mencerminkan וְשָׁמְרוּ אֶת־כְּהֻנָּתָם; dan “harus dihukum mati” dengan tepat menyampaikan daya hukum-pasif dari יוּמָת. “Orang luar” dipahami secara kontekstual sebagai pihak yang tidak berwenang, bukan kategori etnis.
  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register khidmat. Susunan kalimat serta penggunaan “Namun” alami dalam konteks peringatan kontrasif. “Jabatan imam mereka” idiomatis dan cukup spesifik untuk fungsi כְּהֻנָּתָם.
  terminology: Nama Harun konsisten. “Jabatan imam” secara tepat menyatakan kantor/fungsi keimaman. Catatan kaki pada “orang luar” menjaga makna זָר tanpa mengesankan bahwa yang dimaksud khusus orang asing berdasarkan etnis. Penanda catatan kaki ditempatkan dengan benar.
