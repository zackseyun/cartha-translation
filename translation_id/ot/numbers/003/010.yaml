  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: id
  text: Tetapkanlah Harun dan anak-anaknya, dan mereka harus menjaga jabatan imam mereka. Namun, orang luar[a] yang mendekat harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang tidak berwenang.” Dalam konteks ini, bahasa Ibrani menunjuk pada siapa pun yang tidak memiliki wewenang untuk memasuki ranah atau menjalankan pelayanan imam, bukan khususnya orang asing berdasarkan suku atau bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: tetapkanlah
  rationale: Dalam konteks ini, פקד menunjuk pada penetapan Harun dan anak-anaknya untuk suatu jabatan, bukan pada penghitungan atau pendataan.
- source_word: וְשָׁמְרוּ
  choice: mereka harus menjaga
  rationale: שׁמר menyatakan tanggung jawab untuk menjaga dan memelihara tugas serta batas-batas jabatan imam.
- source_word: כְּהֻנָּתָם
  choice: jabatan imam mereka
  rationale: Istilah ini menunjuk pada kedudukan dan fungsi keimaman mereka, bukan sekadar status abstrak.
- source_word: הַזָּר
  choice: orang luar
  rationale: Dalam konteks ini, זָר berarti orang yang berada di luar kewenangan keimaman, bukan terutama orang asing berdasarkan suku atau bangsa. Ungkapan sumber dipertahankan, lalu diperjelas dalam catatan kaki.
- source_word: הַקָּרֵב
  choice: yang mendekat
  rationale: Bentuk partisip ini menggambarkan tindakan mendekati ranah atau pelayanan kudus yang aksesnya dibatasi.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal dari מות bersifat kausatif-pasif dan dalam konteks hukum menyatakan hukuman mati, bukan sekadar bahwa orang itu akan mati.
theological_decisions:
- issue: Batas kewenangan dalam pelayanan keimaman
  choice: Ayat ini menetapkan Harun dan anak-anaknya sebagai pihak yang bertanggung jawab atas jabatan imam serta mengancam orang yang tidak berwenang dan mendekat dengan hukuman mati.
  alternative: Ayat ini dapat dipahami secara lebih umum sebagai larangan bagi setiap orang nonimam untuk mendekati hal-hal kudus, tanpa menentukan semua batas ritualnya dalam ayat ini saja.
  rationale: Terjemahan mempertahankan penekanan Ibrani pada kewenangan keimaman dan akibat mematikan dari pendekatan yang tidak sah, tanpa menambahkan rincian ritual atau ajaran denominasi yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tetapkanlah” menyampaikan perintah penugasan resmi; “jabatan imam” lebih alami daripada bentuk abstrak “keimaman” sambil tetap mempertahankan fungsi institusionalnya. Penanda catatan kaki ditempatkan pada “orang luar”, yaitu istilah yang dijelaskannya.
