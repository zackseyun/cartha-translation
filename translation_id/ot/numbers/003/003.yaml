source:
  edition: WLC
  text: אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/כֹּהֲנִ֖ים הַ/מְּשֻׁחִ֑ים אֲשֶׁר מִלֵּ֥א יָדָ֖/ם לְ/כַהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: id
  text: Inilah nama anak-anak Harun, para imam yang diurapi, yang telah ditahbiskan[a] untuk melayani sebagai imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang tangan mereka telah ia penuhi,” sebuah ungkapan Ibrani yang berarti melantik atau menahbiskan seseorang untuk pelayanan sebagai imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Inilah nama
  rationale: Rumus pengenalan ini diterjemahkan secara alami dalam bahasa Indonesia; bentuk tunggal “nama” lazim dipakai sesudah “inilah” meskipun bahasa Ibrani memakai bentuk jamak.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Rantai konstruksi diterjemahkan dengan susunan kepunyaan Indonesia. Konteks langsung menunjukkan bahwa yang dimaksud ialah putra-putra Harun.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Kata sandang dan bentuk jamak dinyatakan secara wajar dengan “para”; frasa ini menjadi aposisi yang menerangkan anak-anak Harun.
- source_word: הַמְּשֻׁחִים
  choice: yang diurapi
  rationale: Mempertahankan tindakan ritual pengurapan yang dinyatakan oleh bentuk partisip pasif, tanpa menggantinya dengan istilah yang lebih umum seperti “dikuduskan”.
- source_word: מִלֵּא יָדָם
  choice: yang telah ditahbiskan
  rationale: Ungkapan harfiah “memenuhi tangan mereka” merupakan idiom pelantikan ke dalam jabatan imam dan tidak komunikatif bila disalin mentah-mentah ke bahasa Indonesia. Makna idiom ditempatkan dalam teks utama, sedangkan citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: לְכַהֵן
  choice: untuk melayani sebagai imam
  rationale: Infinitif ini menyatakan tujuan atau fungsi pelayanan imamat; pilihan ini lebih jelas daripada sekadar “menjadi imam”.
theological_decisions:
- issue: Penerjemahan idiom pelantikan מִלֵּא יָדָם
  choice: yang telah ditahbiskan
  alternative: yang tangannya telah dipenuhi / yang tangan mereka telah ia penuhi
  rationale: “Ditahbiskan” menyampaikan fungsi teknis idiom dalam konteks keimaman dengan bahasa Indonesia yang alami. Bentuk pasif juga tidak menetapkan identitas pelaku yang hanya tersirat dalam verba Ibrani, sedangkan bentuk harfiahnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan aposisional dipertahankan, tetapi idiom teknis Ibrani diterjemahkan menurut maknanya agar mudah dipahami; unsur harfiahnya tersedia dalam catatan kaki.
