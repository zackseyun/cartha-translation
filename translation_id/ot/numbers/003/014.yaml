  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa di padang gurun Sinai, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif dari דבר memperkenalkan perkataan ilahi. Dalam bahasa Indonesia Alkitabiah yang tetap wajar dan bermartabat, “berfirman” secara tepat menandai tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: אֶל menandai pihak yang dituju dalam tindakan berbicara; “kepada Musa” merupakan padanan Indonesia yang alami.
- source_word: בְּמִדְבַּר סִינַי
  choice: di padang gurun Sinai
  rationale: מִדְבָּר menunjuk wilayah belantara atau padang gurun, dan bentuk konstruksi dengan סִינַי paling alami diterjemahkan “padang gurun Sinai”.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini merupakan rumus pengantar bagi isi perkataan yang menyusul. “Demikian:” menghindari pengulangan janggal “berfirman ... dengan mengatakan” dan secara alami mengarahkan pembaca ke ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehovah” mencerminkan bentuk pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman” dipakai secara khusus untuk perkataan Allah; tanda titik dua sesudah “demikian” menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
