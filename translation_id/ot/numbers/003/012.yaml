  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: id
  text: Dan Aku, sesungguhnya, telah mengambil orang-orang Lewi dari antara bani Israel sebagai ganti setiap anak sulung yang membuka kandungan di antara bani Israel. Orang-orang Lewi itu akan menjadi milik-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Dan Aku, sesungguhnya
  rationale: Mempertahankan kata ganti orang pertama yang tegas dan daya penegasan הִנֵּה dalam ungkapan Indonesia yang khidmat tetapi tetap wajar.
- source_word: לָקַחְתִּי
  choice: telah mengambil
  rationale: Bentuk perfektif menyatakan tindakan ilahi yang sudah dilakukan dan tetap berakibat pada keadaan sekarang.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan mudah dipahami bagi anggota suku Lewi.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dari antara bani Israel
  rationale: Menyatakan pemilihan dari tengah kelompok yang lebih besar serta mempertahankan ungkapan formulaik בְּנֵי יִשְׂרָאֵל secara alami dalam bahasa Indonesia.
- source_word: תַּחַת
  choice: sebagai ganti
  rationale: Menunjukkan hubungan substitusi secara jelas dalam konteks hukum dan peribadatan.
- source_word: כָּל בְּכוֹר פֶּטֶר רֶחֶם
  choice: setiap anak sulung yang pertama membuka rahim
  rationale: Mempertahankan kategori anak sulung dan gambaran harfiah ungkapan Ibrani tanpa menghilangkan fungsi penjelasnya.
- source_word: וְהָיוּ לִי
  choice: akan menjadi milik-Ku
  rationale: Mengungkapkan hasil berupa kepunyaan atau pengkhususan bagi Allah tanpa menambahkan kategori teologis yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: “Bani Israel” mempertahankan ungkapan keturunan yang formulaik sekaligus sudah mapan dalam ragam Alkitab bahasa Indonesia; ayat ini tidak perlu dipersempit hanya kepada laki-laki Israel.
- issue: Hubungan orang Lewi dengan Allah dalam וְהָיוּ לִי
  choice: orang-orang Lewi itu akan menjadi milik-Ku
  alternative: orang-orang Lewi itu akan menjadi kepunyaan-Ku
  rationale: Terjemahan ini menyatakan klaim ilahi secara langsung dan menjaga konteks penggantian serta pengkhususan tanpa memasukkan penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada pronomina ilahi mengikuti konvensi penerbitan Alkitab Indonesia. Pengulangan “orang-orang Lewi” dipertahankan karena teks Ibrani mengulang nomina itu untuk penegasan dan kejelasan.
