  source_fidelity: 'Draf pada dasarnya setia pada urutan dan makna Ibrani: tindakan pengambilan orang Lewi, asal mereka dari bani Israel, fungsi penggantian, dan klaim ilahi semuanya terpelihara. Namun, frasa "anak sulung yang pertama membuka rahim" berlebihan dan kurang idiomatis. פֶּטֶר רֶחֶם sudah menyatakan pihak yang membuka kandungan/rahim untuk pertama kali; unsur "pertama" tidak perlu ditambahkan lagi setelah "anak sulung".'
