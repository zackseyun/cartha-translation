  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: id
  text: juga tirai-tirai pelataran[a], tirai untuk pintu masuk ke pelataran yang mengelilingi Kemah Suci dan mazbah, serta tali-talinya[b], untuk segala pekerjaan yang berkaitan dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain-kain pelataran.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tambang-tambangnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: tirai-tirai
  rationale: Menunjuk pada lembaran kain yang membentuk batas pelataran; bentuk ulang menyampaikan jamak Ibrani dan istilah ini alami dalam konteks Kemah Suci.
- source_word: חָצֵר
  choice: pelataran
  rationale: Menunjuk pada kawasan berpagar di sekeliling Kemah Suci; 'pelataran' jelas dan lazim dalam konteks rumah ibadah.
- source_word: מָסַךְ
  choice: tirai
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada kain penutup di jalan masuk. Bahasa Indonesia tidak memerlukan istilah berbeda yang kaku dari tirai-tirai pembatas.
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: Menyampaikan bukaan atau jalan masuk tanpa menyiratkan adanya pintu atau gerbang yang keras.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: yang mengelilingi Kemah Suci dan mazbah
  rationale: 'Mengungkapkan hubungan ruang yang ditandai oleh עַל ... סָבִיב secara alami: pelataran berada di sekeliling Kemah Suci dan mazbah.'
- source_word: מִשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah Indonesia yang jelas dan mapan untuk tempat kudus portabel Israel; kapitalisasi menandai rujukan khusus.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dalam bahasa Alkitab Indonesia untuk tempat persembahan korban, tetap dapat dipahami dalam register religius yang bermartabat.
- source_word: מֵיתָרָיו
  choice: tali-talinya
  rationale: Menunjuk pada tali-tali penopang struktur; pilihan konkret dan alami, sambil mencatat alternatif dekat dalam catatan kaki.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: untuk segala pekerjaan yang berkaitan dengannya
  rationale: Menjaga cakupan seluruh tugas atau pekerjaan yang berhubungan dengan perlengkapan tersebut tanpa memaksakan tafsiran sempit tentang pemakaian.
