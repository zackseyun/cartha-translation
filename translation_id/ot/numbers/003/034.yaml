  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: id
  text: Jumlah orang yang terdaftar di antara mereka, yaitu semua laki-laki yang berumur satu bulan ke atas, adalah 6.200 orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka yang terdaftar” atau “jumlah mereka yang tercatat.” Bahasa Ibrani merujuk pada orang-orang atau jumlah sensus kelompok ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: yang terdaftar di antara mereka
  rationale: Bentuk nominal dari פקד dengan akhiran orang ketiga jamak menunjuk kepada orang-orang dalam kelompok itu yang dicatat dalam sensus. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gagasan pendaftaran, bukan sekadar angka abstrak.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: Jumlah semua laki-laki
  rationale: בְּמִסְפַּר memperkenalkan penghitungan, sedangkan כָּל זָכָר mencakup setiap orang berjenis kelamin laki-laki. Susunan Indonesia ini menyampaikan rumusan sensus dengan jelas dan wajar.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: dari yang berumur satu bulan ke atas
  rationale: Ungkapan ini menetapkan batas usia mulai satu bulan dan mencakup semua usia di atasnya; terjemahan tersebut merupakan rumusan Indonesia modern yang tepat.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: 6.200 orang
  rationale: Bilangan Ibrani berarti enam ribu dua ratus. Angka ditulis dengan format Indonesia, dan 'orang' ditambahkan secara wajar untuk memperjelas bahwa total itu adalah jumlah laki-laki yang didata.
