translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Syikal' dipertahankan sebagai istilah ukuran berat kuno. Angka memakai konvensi Indonesia dengan titik sebagai pemisah ribuan. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
