  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: id
  text: Dari anak-anak sulung bani Israel ia mengambil perak itu, sebanyak 1.365 syikal, menurut standar syikal tempat kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, menurut standar berat syikal yang berlaku di tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: Dari
  rationale: Menandai pihak yang menjadi sumber pengambilan perak; bentuk sederhana ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: anak-anak sulung orang Israel
  rationale: Nomina tunggal kolektif בְּכוֹר dipahami merujuk kepada kelompok anak sulung. Ungkapan ini mempertahankan acuan kepada keturunan Israel dengan bahasa Indonesia yang wajar dalam konteks sensus dan penebusan.
- source_word: לָקַח
  choice: ia mengambil
  rationale: Mempertahankan arti dasar verba 'mengambil'; konteks sebelumnya menjelaskan bahwa Musa adalah pelakunya.
- source_word: הַכָּסֶף
  choice: perak itu
  rationale: כֶּסֶף secara harfiah berarti perak dan dalam konteks ini merupakan perak pembayaran penebusan. Kata penunjuk 'itu' mencerminkan kejelasan artikel Ibrani dan kaitan dengan konteks.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: sebanyak 1.365
  rationale: Komponen bilangan Ibrani dinyatakan dalam susunan angka Indonesia yang baku; 'sebanyak' memperjelas bahwa frasa ini menyatakan jumlah keseluruhan perak.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  rationale: Preposisi בְּ menyatakan standar yang dipakai. 'Syikal kudus' mempertahankan bentuk konstruksi Ibrani secara ringkas dan dipahami sebagai standar syikal yang ditetapkan bagi tempat kudus, bukan sebagai klaim tentang kesucian logamnya.
