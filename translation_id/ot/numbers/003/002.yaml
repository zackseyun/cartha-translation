  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: id
  text: 'Inilah nama anak-anak Harun: Nadab, anak sulungnya, Abihu, Eleazar, dan Itamar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Gabungan konjungsi dan kata tunjuk ini memperkenalkan daftar. “Inilah” merupakan bentuk Indonesia yang alami dan tetap mempertahankan fungsi deiktiknya; konjungsi pembuka tidak perlu diterjemahkan secara tersendiri.
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: nama anak-anak Harun
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara alami dalam bahasa Indonesia sebagai “nama anak-anak Harun”.
- source_word: הַבְּכֹר נָדָב
  choice: Nadab, anak sulungnya
  rationale: בְּכוֹר menyatakan status sebagai anak sulung, bukan sekadar yang paling tua. Susunan appositif ini paling jelas dan alami dalam bahasa Indonesia, meskipun nama ditempatkan lebih dahulu.
- source_word: וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: lalu Abihu, Eleazar, dan Itamar
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia. “Lalu” membantu meneruskan daftar setelah keterangan appositif tentang Nadab, sedangkan “dan” mempertahankan konjungsi pada unsur terakhir.
theological_decisions: []
