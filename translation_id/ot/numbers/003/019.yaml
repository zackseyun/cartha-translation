  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: id
  text: 'Dan anak-anak Kehat menurut kaum mereka: Amram, Yizhar, Hebron, dan Uziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: Inilah anak-anak Kehat
  rationale: בְּנֵי secara harfiah berarti 'anak-anak laki-laki dari' dan dalam daftar silsilah ini menunjuk kepada anak-anak Kehat yang menjadi leluhur kaum-kaum berikutnya. Kata 'anak-anak' mempertahankan bentuk Ibrani secara wajar. Konjungsi וּ berfungsi melanjutkan daftar; dalam bahasa Indonesia, kesinambungan itu dinyatakan secara alami dengan 'Inilah' tanpa harus memakai 'dan' pada awal kalimat.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan atau subdivisi suku, bukan sekadar keluarga inti. 'Kaum' sesuai dengan konteks pengelompokan Israel dan tetap mudah dipahami.
- source_word: עַמְרָם
  choice: Amram
  rationale: Nama diri, dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְיִצְהָר
  choice: Yizhar
  rationale: Nama diri. Bentuk 'Yizhar' cukup dekat dengan bunyi Ibrani יִצְהָר dan selaras dengan konvensi nama Alkitab bahasa Indonesia.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nama diri; konteks menunjukkan bahwa ini nama orang, meskipun bentuknya sama dengan nama tempat Hebron.
- source_word: וְעֻזִּיאֵל
  choice: Uziel
  rationale: Nama diri, dialihaksarakan dalam bentuk Indonesia yang ringkas dan lazim; konjungsi וְ dinyatakan dengan 'dan' sebelum unsur terakhir daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur daftar dipertahankan, dengan titik dua untuk memperkenalkan nama-nama. Istilah 'kaum' dipilih untuk satuan kekerabatan Israel agar tidak disalahpahami sebagai keluarga inti.
