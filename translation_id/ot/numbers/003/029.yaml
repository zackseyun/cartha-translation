translation:
  language: id
  text: Kaum-kaum Kehat[a] harus berkemah di sisi selatan Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Kehat”; dapat juga diterjemahkan “keturunan Kehat” atau “orang-orang Kehat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks pendataan suku dan pengaturan perkemahan, istilah ini menunjuk pada kelompok-kelompok kekerabatan, bukan sekadar keluarga inti. 'Kaum-kaum' menyampaikan pembagian sosial tersebut secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי קְהָת
  choice: keturunan Kehat
  rationale: Secara harfiah berarti 'anak-anak lelaki Kehat', tetapi dalam konteks silsilah ungkapan ini mencakup para keturunannya. 'Keturunan Kehat' jelas dan alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יַחֲנוּ
  choice: harus berkemah
  rationale: Bentuk imperfek di sini menyatakan pengaturan yang diperintahkan bagi perkemahan. 'Harus berkemah' mempertahankan daya preskriptifnya tanpa memakai bentuk arkais.
- source_word: עַל יֶרֶךְ
  choice: di sisi
  rationale: Gabungan preposisi dan nomina ini menyatakan letak pada sisi atau bagian samping Kemah Suci. 'Di sisi' merupakan ungkapan lokatif yang wajar dalam bahasa Indonesia.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam Kitab Bilangan, istilah ini menunjuk pada tempat kediaman kudus berbentuk kemah. 'Kemah Suci' adalah istilah yang jelas dan lazim bagi pembaca Indonesia.
- source_word: תֵּימָנָה
  choice: selatan
  rationale: Bentuk berarah ini menunjukkan lokasi ke arah selatan; bersama 'sisi', terjemahan alami ialah 'sisi selatan'.
