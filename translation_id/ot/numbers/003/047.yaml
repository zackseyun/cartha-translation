  text: וְ/לָקַחְתָּ֗ חֲמֵ֧שֶׁת חֲמֵ֛שֶׁת שְׁקָלִ֖ים לַ/גֻּלְגֹּ֑לֶת בְּ/שֶׁ֤קֶל הַ/קֹּ֨דֶשׁ֙ תִּקָּ֔ח עֶשְׂרִ֥ים גֵּרָ֖ה הַ/שָּֽׁקֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/047.yaml
  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: id
  text: haruslah engkau mengambil lima syikal untuk setiap orang[a], menurut syikal tempat kudus[b]; satu syikal sama dengan dua puluh gera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lima syikal per kepala.”
    reason: lexical_alternative
  - marker: b
    text: Artinya, menurut standar berat yang berlaku di tempat kudus; satu syikal setara dengan dua puluh gera.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: haruslah engkau mengambil
  rationale: Bentuk perfek Qal dengan waw dalam konteks petunjuk berfungsi sebagai perintah. Ungkapan ini mempertahankan nada hukum yang wajar dalam bahasa Indonesia.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים
  choice: lima syikal untuk setiap orang
  rationale: Pengulangan kata 'lima' menyatakan pembagian kepada tiap-tiap orang; bahasa Indonesia alami mengungkapkannya dengan 'untuk setiap orang'.
- source_word: לַגֻּלְגֹּלֶת
  choice: untuk setiap orang
  rationale: Secara harfiah berarti 'menurut/untuk kepala', tetapi di sini merupakan idiom distributif yang menunjuk kepada tiap orang. Bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menetapkan standar syikal yang berlaku di tempat kudus. Terjemahan ini mempertahankan rujukan kultis tanpa menyiratkan bahwa kesucian melekat pada sebuah koin tertentu.
- source_word: תִּקָּח ... הַשָּׁקֶל
  choice: satu syikal sama dengan
  rationale: Walaupun תִּקָּח secara formal berarti 'engkau harus mengambil', susunan klausa menjelaskan nilai syikal tersebut. Ungkapan ekuivalensi menghasilkan bahasa Indonesia yang jelas dan sesuai fungsi kontekstualnya.
- source_word: עֶשְׂרִים גֵּרָה
  choice: dua puluh gera
  rationale: Nama satuan berat Ibrani dipertahankan sebagai istilah teknis; dalam bahasa Indonesia nama satuan tidak perlu dijamakkan setelah bilangan.
