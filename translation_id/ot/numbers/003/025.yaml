  source_fidelity: 'Terjemahan dengan tepat menyampaikan מִשְׁמֶרֶת sebagai tanggung jawab/penugasan, בני גרשון sebagai keturunan Gerson, serta daftar objek yang menjadi lingkup tugas mereka. Urutan unsur Ibrani dipertahankan: Kemah Suci (המשכן), kemah (האהל), penutupnya, dan tirai pada pintu masuk Kemah Pertemuan. Frasa ''tirai pintu masuk'' secara wajar mewakili מָסַךְ פֶּתַח tanpa memaksakan perbedaan teknis yang tidak dinyatakan secara eksplisit dalam bahasa Indonesia.'
