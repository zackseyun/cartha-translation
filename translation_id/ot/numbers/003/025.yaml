  terminology: Istilah 'Kemah Pertemuan' konsisten untuk אֹהֶל מוֹעֵד pada kedua kemunculan. 'Kemah Suci' dan 'kemah' mempertahankan pembedaan leksikal antara המשכן dan האהל. Nama Gerson dan kapitalisasi istilah kultis digunakan secara konsisten.
