  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: id
  text: Tanggung jawab keturunan Gerson di Kemah Pertemuan meliputi Kemah Suci, kemah beserta penutupnya, dan tirai pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: tanggung jawab
  rationale: Dalam konteks pembagian tugas orang Lewi, kata ini menunjuk pada hal-hal yang dipercayakan untuk dijaga dan diurus; 'tanggung jawab' alami dalam bahasa Indonesia dan sesuai dengan daftar benda sesudahnya.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: keturunan Gerson
  rationale: Ungkapan ini mempertahankan gagasan hubungan keluarga tanpa memberi kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Preposisi ב dipahami secara lokatif atau sebagai lingkup pelayanan; 'di' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Ini adalah istilah teknis yang lazim dan mudah dipahami untuk tempat kediaman kudus, sekaligus membedakannya dari אֹהֶל dalam daftar komponen.
- source_word: וְהָאֹהֶל מִכְסֵהוּ
  choice: kemah beserta penutupnya
  rationale: Susunan ini menjaga kemah dan penutupnya sebagai dua unsur terkait dalam inventaris serta menghasilkan bahasa Indonesia yang alami.
- source_word: מָסַךְ פֶּתַח
  choice: tirai pintu masuk
  rationale: מָסַךְ menunjuk pada kain gantung atau tirai penyekat di bukaan; 'tirai pintu masuk' menyatakan fungsi dan lokasinya secara jelas.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan teknis yang transparan dan diterapkan secara konsisten pada kedua kemunculannya.
