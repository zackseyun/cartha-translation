  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: id
  text: Mereka harus menjalankan tanggung jawabnya[a] dan tanggung jawab seluruh umat di hadapan Kemah Pertemuan, untuk melakukan pelayanan Kemah Suci.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “menjaga tanggung jawabnya” atau “memelihara tugasnya”; pasangan kata kerja dan kata bendanya mencakup tanggung jawab untuk menjaga maupun menunaikan amanat.
    reason: lexical_alternative
  - marker: b
    text: Artinya, orang Lewi menjalankan tanggung jawab yang berkaitan dengan Harun dan seluruh umat dalam pelayanan di tempat suci.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתּוֹ
  choice: menunaikan tugas yang dipercayakan kepadanya
  rationale: Pasangan kata שׁמר dan מִשְׁמֶרֶת menyatakan tanggung jawab untuk menjaga sekaligus melaksanakan amanat. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan akhiran orang ketiga tunggal yang dalam konteks paling mungkin merujuk kepada Harun.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: tugas seluruh umat
  rationale: Terjemahan ini mempertahankan kesejajaran dengan tugas yang disebut sebelumnya dan menyatakan tanggung jawab yang berkaitan dengan, atau dijalankan demi, seluruh komunitas Israel.
- source_word: הָעֵדָה
  choice: umat
  rationale: Dalam konteks kitab Bilangan, עֵדָה menunjuk kepada komunitas Israel. 'Umat' jelas, wajar, dan sesuai dengan konteks keagamaan tanpa mengharuskan makna bahwa mereka sedang berhimpun.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: di hadapan Kemah Pertemuan
  rationale: '''Di hadapan'' mempertahankan nuansa ruang dan ibadah dari לִפְנֵי, sedangkan ''Kemah Pertemuan'' merupakan padanan baku dan transparan bagi אֹהֶל מוֹעֵד.'
- source_word: לַעֲבֹד אֶת־עֲבֹדַת הַמִּשְׁכָּן
  choice: melaksanakan pelayanan Kemah Suci
  rationale: Kata kerja dan kata benda yang seakar dalam bahasa Ibrani menyatakan pelaksanaan pekerjaan atau pelayanan yang berkaitan dengan tempat suci. 'Melaksanakan pelayanan' menghindari pengulangan yang kaku, sedangkan 'Kemah Suci' merupakan istilah Indonesia yang mudah dipahami bagi מִשְׁכָּן.
theological_decisions:
- issue: Acuan akhiran orang ketiga tunggal dalam מִשְׁמַרְתּוֹ
  choice: Kata 'kepadanya' dipertahankan dan paling wajar dipahami sebagai merujuk kepada Harun.
  alternative: Akhiran itu dapat dipahami secara lebih umum sebagai tugas tempat suci atau tugas keimaman secara kolektif.
  rationale: Konteks langsung menempatkan orang Lewi di bawah Harun dan anak-anaknya, sehingga Harun merupakan acuan terdekat dan paling alami. Namun, terjemahan tidak mengganti pronomina itu dengan nama Harun sehingga bentuk sumber dan sedikit ruang ambiguitasnya tetap terpelihara.
- issue: Hubungan tugas orang Lewi dengan seluruh umat
  choice: Diterjemahkan 'tugas seluruh umat' tanpa menambahkan 'mewakili' atau 'demi'.
  alternative: Dapat dijelaskan sebagai tugas yang dilaksanakan orang Lewi atas nama seluruh umat.
  rationale: Teks Ibrani menyatakan hubungan tersebut secara ringkas dan tidak menentukan secara eksplisit apakah nuansanya kepemilikan, perwakilan, atau kepentingan. Terjemahan utama mempertahankan ketegangan itu, sementara catatan kaki memberi konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menunaikan tugas yang dipercayakan' dipilih agar tanggung jawab penjagaan dan pelaksanaan tetap terasa tanpa menghasilkan ungkapan Indonesia yang kaku. Istilah 'Kemah Pertemuan' dan 'Kemah Suci' dibedakan sesuai dua istilah Ibrani, אֹהֶל מוֹעֵד dan מִשְׁכָּן.
