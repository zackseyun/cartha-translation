  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: id
  text: Lalu Musa mengambil uang tebusan[a] dari mereka yang jumlahnya melebihi orang-orang yang ditebus melalui orang Lewi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “uang penebusan.” Istilah Ibrani ini dapat menunjuk pada pembayaran yang diberikan untuk penebusan.'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, dari anak-anak sulung Israel yang jumlahnya melebihi jumlah orang Lewi yang diperhitungkan sebagai pengganti mereka dalam penghitungan penebusan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu Musa mengambil
  rationale: Bentuk wayyiqtol dari לקח melanjutkan alur narasi dan secara langsung berarti “mengambil”; “lalu” menyatakan kesinambungan naratif secara alami.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: uang tebusan
  rationale: כֶּסֶף secara kontekstual berarti uang, sedangkan פִּדְיוֹם menunjuk pada pembayaran untuk penebusan. “Uang tebusan” alami dalam bahasa Indonesia dan mempertahankan nuansa hukum-kultisnya.
- source_word: מֵאֵת
  choice: dari
  rationale: Preposisi ini menandai sumber; “dari” cukup tepat tanpa memperluasnya menjadi ungkapan harfiah “dari tangan”.
- source_word: הָעֹדְפִים עַל
  choice: mereka yang jumlahnya melebihi jumlah
  rationale: Partisipel עודף bersama עַל menyatakan kelebihan secara komparatif. Penyebutan “jumlah” membuat hubungan numeriknya jelas dalam bahasa Indonesia tanpa menambahkan identitas yang tidak dinyatakan secara eksplisit dalam klausa.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: orang yang ditebus oleh orang Lewi
  rationale: Frasa konstruk partisipel pasif ini merujuk kepada orang-orang yang tercakup dalam penebusan melalui penggantian oleh kaum Lewi. “Oleh orang Lewi” menyampaikan hubungan itu secara alami, sementara catatan kaki menjelaskan konteks penghitungan agar tidak dipahami sebagai tindakan pembayaran individual.
theological_decisions:
- issue: Hubungan orang Lewi dengan orang-orang yang ditebus dalam פְּדוּיֵי הַלְוִיִּם
  choice: orang yang ditebus oleh orang Lewi
  alternative: orang-orang tebusan milik orang Lewi
  rationale: Konstruk Ibrani dapat menyatakan hubungan yang lebih luas daripada pelaku langsung. Terjemahan utama mengikuti pengertian kontekstual bahwa orang Lewi menggantikan anak-anak sulung Israel, sedangkan catatan kaki menjaga ketepatan konsep penghitungan dan penggantian tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan urutan sumber, tetapi hubungan perbandingan dibuat alami dengan pengulangan kata “jumlah”. Semua penjelasan kontekstual yang melampaui bunyi eksplisit klausa ditempatkan dalam catatan kaki.
