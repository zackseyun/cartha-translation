  source_fidelity: Terjemahan utama menyampaikan tindakan Musa mengambil uang penebusan dari kelompok yang jumlahnya berlebih. Namun, “orang yang ditebus oleh orang Lewi” terlalu mempersempit konstruksi Ibrani פְּדוּיֵי הַלְוִיִּם menjadi agen langsung (“oleh”), padahal konstruksi itu dapat menyatakan mereka yang ditebus/diwakili dalam kaitannya dengan orang Lewi. Dalam konteksnya, yang dibandingkan adalah kelebihan anak sulung Israel atas jumlah orang Lewi yang menjadi pengganti mereka.
  naturalness: Kalimatnya umumnya alami, tetapi pengulangan “jumlahnya melebihi jumlah orang” dapat diringankan tanpa kehilangan ketepatan. “Orang-orang yang ditebus melalui orang Lewi” lebih lancar dan tidak menyatakan orang Lewi sebagai pelaku langsung penebusan.
  terminology: “Uang tebusan” adalah padanan yang baik untuk כֶּסֶף הַפִּדְיוֹם. Catatan a memberikan alternatif yang sah. Istilah “orang Lewi” dan “anak sulung” dalam catatan b sesuai dengan konteks perikop.
