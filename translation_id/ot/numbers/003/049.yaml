    rationale: Penjelasan konteks ini pada dasarnya tepat, tetapi dapat dinyatakan lebih langsung sebagai kelebihan jumlah anak sulung Israel dibandingkan jumlah orang Lewi, tanpa ungkapan “termasuk dalam” yang agak berbelit.
