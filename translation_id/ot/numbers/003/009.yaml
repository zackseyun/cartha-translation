  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: id
  text: Serahkanlah orang-orang Lewi kepada Harun dan kepada putra-putranya. Mereka benar-benar diserahkan[a] kepadanya dari antara keturunan Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, kata “diserahkan” diulang untuk memberi penekanan: “diserahkan, diserahkan,” atau “sungguh-sungguh diserahkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau “dari antara orang Israel.” Secara harfiah: “dari antara anak-anak Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Serahkanlah
  rationale: Bentuk perfek dengan waw dalam konteks perintah menyatakan instruksi. Kata “serahkanlah” menyampaikan tindakan memberikan orang-orang Lewi untuk pelayanan Harun dan putra-putranya secara alami dalam bahasa Indonesia.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Ini adalah sebutan baku bagi anggota suku Lewi dan lebih mudah dipahami daripada bentuk transliterasi “kaum Lewi” atau “orang Lewi” tanpa penanda jamak.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kepada Harun dan kepada putra-putranya
  rationale: Preposisi ל menandai penerima atau pihak yang mendapat penugasan itu. “Putra-putranya” mempertahankan makna maskulin בָנָיו dalam konteks keimaman.
- source_word: נְתוּנִם נְתוּנִם
  choice: benar-benar diserahkan
  rationale: Pengulangan partisip pasif menegaskan bahwa penyerahan itu sungguh dan penuh. Ungkapan “benar-benar diserahkan” mempertahankan penekanan tersebut tanpa pengulangan yang janggal dalam bahasa Indonesia.
- source_word: הֵמָּה
  choice: mereka
  rationale: Pronomina mandiri memberi tekanan pada orang-orang Lewi sebagai subjek. Dalam bahasa Indonesia, tekanan utama sudah terbawa oleh “benar-benar” pada predikat.
- source_word: לוֹ
  choice: kepadanya
  rationale: Pronomina tunggal ini paling wajar merujuk kembali kepada Harun, penerima utama yang baru disebut.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dari antara keturunan Israel
  rationale: מֵאֵת menyatakan sumber, yakni orang-orang Lewi dipilih dari kelompok Israel yang lebih luas. “Keturunan Israel” mempertahankan unsur kekerabatan dalam ungkapan Ibrani dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Cakupan dan bentuk ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi berfungsi sebagai sebutan kolektif bagi keturunan Israel. “Keturunan Israel” mempertahankan dimensi silsilah dan perjanjian tanpa memberi kesan bahwa yang dimaksud hanya anak-anak kecil atau hanya laki-laki.
- issue: Penekanan dalam נְתוּנִם נְתוּנִם
  choice: benar-benar diserahkan
  alternative: diserahkan, ya, diserahkan; diserahkan sepenuhnya
  rationale: Pengulangan Ibrani menegaskan status orang Lewi sebagai pemberian atau penyerahan kepada Harun. Terjemahan tidak menentukan lebih jauh apakah penekanannya terutama pada kepastian atau kelengkapan, dan catatan kaki membuka bentuk sumbernya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Serahkanlah” dipilih sebagai perintah langsung; “orang-orang Lewi” memakai sebutan yang lazim; dan “putra-putranya” mempertahankan rujukan maskulin dalam garis keimaman. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
