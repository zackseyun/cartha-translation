  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: id
  text: Dan, untuk uang tebusan bagi 273 anak sulung Israel yang jumlahnya melebihi jumlah orang Lewi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk ke-273 orang yang ditebus”; bentuk Ibraninya dapat dipahami secara lebih harfiah demikian. Namun, konteks langsung membahas pembayaran yang diwajibkan bagi anak-anak sulung yang jumlahnya berlebih (ay. 47–48), sehingga “uang tebusan” paling tepat menyampaikan maksudnya di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: uang tebusan bagi
  rationale: Dalam konteks ayat 47–48, bentuk dari פדה menunjuk pada tebusan yang harus dibayarkan bagi anak-anak sulung yang jumlahnya berlebih. Pilihan ini menyampaikan maknanya secara alami sambil tetap mengakui kemungkinan bentuk Ibrani dipahami sebagai sebutan bagi orang-orang yang ditebus.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: Bilangan Ibrani disusun secara aditif, tetapi angka 273 menyatakan jumlah yang sama dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הָעֹדְפִים
  choice: yang melebihi jumlah
  rationale: Partisip ini menunjuk kepada orang-orang yang menjadi kelebihan dibandingkan jumlah orang Lewi; frasa ini mempertahankan hubungan perbandingan tersebut secara jelas.
- source_word: עַל הַלְוִיִּם
  choice: orang Lewi
  rationale: Bersama הָעֹדְפִים, preposisi עַל menyatakan kelebihan dalam perbandingan dengan orang Lewi, yang secara idiomatis diungkapkan melalui 'melebihi jumlah orang Lewi'.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: di antara anak-anak sulung bani Israel
  rationale: Frasa ini mengidentifikasi kelompok asal ke-273 orang itu. 'Di antara' mencerminkan makna partitif מִן, sedangkan 'bani Israel' mempertahankan ungkapan perjanjian בְּנֵי יִשְׂרָאֵל dalam ragam Alkitab yang lazim.
