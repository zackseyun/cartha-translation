lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol Piel dari דבר melanjutkan narasi dan memperkenalkan perkataan ilahi. Dalam bahasa Indonesia Alkitabiah yang tetap wajar, “berfirman” secara tepat menandai tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju oleh perkataan; “kepada Musa” merupakan padanan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif לֵאמֹר memperkenalkan isi perkataan yang menyusul. “kata-Nya” merupakan rumusan Indonesia yang alami dan menghindari bentuk kaku “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani menggunakan Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar atau memilih bentuk pelafalan alternatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Lalu” mengalir lebih alami daripada “Dan” sebagai penghubung naratif. Tanda koma di akhir menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
