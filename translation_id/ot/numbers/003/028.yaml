base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: id
  text: Jumlah semua laki-laki yang berumur satu bulan ke atas adalah 8.600 orang; mereka bertugas menjaga tempat kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hal-hal kudus.”'
    reason: Bahasa Ibrani dapat menunjuk pada tempat kudus atau, secara lebih umum, pada hal-hal kudus.
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: Jumlah semua laki-laki
  rationale: Dalam rumusan sensus ini, בְּמִסְפַּר memperkenalkan jumlah yang dihitung. Ungkapan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia, sementara כָּל זָכָר tetap diterjemahkan secara khusus sebagai semua laki-laki.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: yang berumur satu bulan ke atas
  rationale: Ini adalah ungkapan baku untuk batas usia minimum dan terdengar alami dalam bahasa Indonesia modern.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 8.600 orang
  rationale: Angka sumber dipertahankan tepat. Kata 'orang' memperjelas bahwa angka tersebut adalah jumlah laki-laki yang didata.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: mereka bertugas menjaga
  rationale: Gabungan partisip dan nomina serumpun ini menyatakan tanggung jawab penjagaan yang dipercayakan kepada mereka. Terjemahan ini menghindari pengulangan kaku seperti 'menjaga penjagaan'.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Dalam konteks tugas orang Lewi, istilah ini menunjuk pada ranah atau tempat suci yang berada dalam penjagaan mereka. 'Tempat kudus' dekat dengan bentuk Ibrani tanpa mempersempitnya menjadi bagian tertentu dari Kemah Suci.
theological_decisions:
- issue: Cakupan הַקֹּדֶשׁ
  choice: tempat kudus
  alternative: barang-barang kudus
  rationale: Bentuk Ibrani dapat menunjuk pada tempat atau ranah kudus, dan dalam konteks lain dapat mencakup benda-benda kudus. Teks utama memakai referen tempat yang paling sesuai dengan konteks, sedangkan kemungkinan lainnya dicatat tanpa memaksakan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda titik koma mempertahankan hubungan erat antara jumlah sensus dan tanggung jawab kelompok tersebut.
