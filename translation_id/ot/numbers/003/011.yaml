  text: 'Lalu Yahweh berfirman kepada Musa, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sehingga 'Lalu' wajar dalam bahasa Indonesia. Dalam konteks perkataan ilahi, 'berfirman' merupakan padanan Indonesia yang alami dan bermartabat bagi דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menyatakan arah perkataan kepada penerimanya; 'kepada Musa' adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perkataan yang menyusul pada ayat berikutnya. 'Demikian:' menghindari konstruksi 'berfirman ... dengan mengatakan' yang kaku dan memberi isyarat jelas bahwa kutipan berlanjut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumus pembuka dibuat alami sebagai pengantar langsung kepada firman pada ayat berikutnya.
