id: NUM.3.13
reference: Numbers 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: id
  text: Sebab setiap anak sulung adalah milik-Ku.[a] Pada hari Aku membunuh setiap anak sulung di tanah Mesir, Aku menguduskan bagi diri-Ku setiap anak sulung di Israel, dari manusia sampai hewan.[b] Mereka akan menjadi milik-Ku. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagi-Ku”; ungkapan ini menyatakan bahwa setiap anak sulung adalah kepunyaan Yahweh dan diulang tiga kali dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari manusia sampai hewan,” suatu ungkapan yang mencakup kedua golongan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan pernyataan sebelumnya tentang orang Lewi.
- source_word: לִי
  choice: milik-Ku / bagi diri-Ku / menjadi milik-Ku
  rationale: Mengungkapkan klaim kepemilikan ilahi dan mempertahankan pengulangannya dalam bentuk bahasa Indonesia yang wajar.
- source_word: כָּל בְּכוֹר
  choice: setiap anak sulung
  rationale: Mencakup semua yang lahir pertama tanpa menambahkan unsur 'laki-laki' yang tidak dinyatakan dalam ayat ini.
- source_word: בְּיוֹם
  choice: Pada hari
  rationale: Mempertahankan penanda waktu formal yang mengacu pada peristiwa historis di Mesir.
- source_word: הַכֹּתִי
  choice: Aku membunuh
  rationale: Dalam konteks tulah atas anak sulung Mesir, verba נכה menunjuk pada tindakan memukul yang menyebabkan kematian; pilihan ini menyatakan akibat mematikan secara jelas.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ secara eksplisit dengan ungkapan Indonesia yang lazim dalam narasi Alkitab.
- source_word: הִקְדַּשְׁתִּי
  choice: Aku menguduskan
  rationale: Bentuk hifil dari קדשׁ berarti menjadikan atau menetapkan sebagai kudus, yakni dikhususkan bagi Allah.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Mengikuti bentuk ringkas sumber dan menunjukkan lingkup umat tempat anak-anak sulung itu dikhususkan.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: dari manusia sampai hewan
  rationale: Menyampaikan merisme yang mencakup anak sulung manusia maupun hewan dengan bahasa Indonesia modern dan inklusif secara semantis.
- source_word: יִהְיוּ
  choice: Mereka akan menjadi
  rationale: Menyampaikan bentuk imperfek sebagai pernyataan tentang klaim ilahi yang terus berlaku.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Partikel penegas pada kopula Indonesia mencerminkan formula identitas dan otoritas ilahi, sedangkan nama perjanjian dipertahankan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi ilahi dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Arti pengudusan anak sulung
  choice: menguduskan bagi diri-Ku
  alternative: mengkhususkan bagi diri-Ku
  rationale: Pilihan 'menguduskan' mempertahankan dimensi kultis קדשׁ, sedangkan 'bagi diri-Ku' menjaga kaitannya dengan klaim kepemilikan berulang tanpa menerangkan lebih jauh bagaimana status itu diterapkan.
- issue: Cakupan אָדָם dalam merisme manusia-hewan
  choice: manusia
  alternative: orang
  rationale: Di sini אָדָם merupakan nomina kolektif yang dikontraskan dengan בְּהֵמָה, bukan penunjuk khusus pada laki-laki; 'manusia' menjaga cakupan kategoris tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah dipakai sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan klaim kepemilikan dipertahankan, dan formula penutup dibuat tegas tanpa menambahkan tafsiran denominasi.
