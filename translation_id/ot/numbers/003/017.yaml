  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: id
  text: 'Inilah anak-anak lelaki Lewi menurut nama mereka: Gerson, Kehat, dan Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ אֵלֶּה
  choice: Inilah
  rationale: Dalam konteks daftar silsilah, gabungan kopula lampau dan kata penunjuk ini secara alami memperkenalkan nama-nama yang menyusul. Bahasa Indonesia tidak memerlukan kopula lampau eksplisit.
- source_word: בְנֵי לֵוִי
  choice: anak-anak lelaki Lewi
  rationale: Yang dimaksud adalah tiga putra langsung Lewi; bentuk ini mempertahankan kekhususan gender dari konteks genealogis.
- source_word: בִּשְׁמֹתָם
  choice: menurut nama mereka
  rationale: Mempertahankan makna harfiah preposisi ב dan rumusan penamaan, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: גֵּרְשׁוֹן
  choice: Gerson
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: קְהָת
  choice: Kehat
  rationale: Transliterasi yang lazim dan dekat dengan bentuk Ibrani.
- source_word: מְרָרִי
  choice: Merari
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
theological_decisions: []
