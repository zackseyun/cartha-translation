  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumusan genealogis dipertahankan tanpa menambahkan penafsiran. Tidak diperlukan catatan kaki karena 'menurut nama mereka' langsung mewakili ungkapan Ibrani בִּשְׁמֹתָם.
