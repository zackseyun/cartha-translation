  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: id
  text: 'Anak-anak Merari menurut kaum mereka: Mahli dan Musi. Itulah kaum-kaum orang Lewi[a] menurut rumah-rumah leluhur mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibr. “orang Lewi” (tunggal). Bentuk ini dapat dipakai secara kolektif atau dapat menunjuk kepada Lewi sebagai leluhur suku itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: בְּנֵי secara harfiah berarti ‘anak-anak laki-laki/anak-anak’; dalam daftar silsilah, ‘anak-anak’ mempertahankan bahasa garis keturunan tanpa perlu menerjemahkan waw penghubung secara tersendiri.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Ungkapan ini menggolongkan keturunan Merari berdasarkan unit kekerabatan; ‘kaum’ lebih tepat daripada ‘keluarga’ karena menunjuk kelompok di bawah suku.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Mahli dan Musi
  rationale: Nama-nama diri ditransliterasikan dalam bentuk Indonesia, dan waw pada nama kedua diterjemahkan ‘dan’.
- source_word: אֵלֶּה הֵם
  choice: Itulah
  rationale: Gabungan kata tunjuk dan pronomina membentuk pernyataan identifikasi; ‘Itulah’ alami dalam konteks penutup daftar.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: kaum-kaum orang Lewi
  rationale: Bentuk jamak מִשְׁפְּחֹת diterjemahkan ‘kaum-kaum’, sedangkan bentuk gentilik tunggal הַלֵּוִי diterjemahkan dengan ungkapan Indonesia yang secara wajar dapat dipahami secara kolektif.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga pihak ayah mereka
  rationale: בֵּית אָבוֹת adalah istilah kekerabatan-administratif yang secara harfiah berhubungan dengan ‘rumah ayah’; pilihan ini mempertahankan garis pihak ayah sekaligus terdengar jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan bentuk tunggal הַלֵּוִי
  choice: orang Lewi
  alternative: Lewi, yaitu leluhur suku itu
  rationale: Bentuk gentilik tunggal dapat berfungsi secara kolektif bagi orang-orang Lewi atau menunjuk kembali kepada Lewi sebagai leluhur suku. Teks utama mempertahankan keluasan makna itu, dan catatan kaki menyatakan alternatifnya tanpa memutuskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ringkas berupa daftar dipertahankan; ‘kaum’ membedakan unit kekerabatan suku dari ‘keluarga pihak ayah’ sebagai unit rumah tangga garis ayah.
