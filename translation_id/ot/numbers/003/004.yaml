  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: id
  text: Namun, Nadab dan Abihu mati di hadapan Yahweh ketika mereka mempersembahkan api asing[a] di hadapan Yahweh di padang gurun Sinai. Mereka tidak mempunyai anak laki-laki, dan Eleazar serta Itamar melayani sebagai imam di hadapan Harun, ayah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “api yang tidak diperintahkan” atau “api yang tidak sah.” Kata Ibrani ini secara harfiah dapat berarti “asing” dan dalam konteks ini kemungkinan menunjuk pada api yang tidak diperkenankan untuk persembahan itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “semasa hidup Harun, ayah mereka.” Ungkapan Ibrani juga dapat menyiratkan bahwa Eleazar dan Itamar melayani sebagai imam ketika Harun masih hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מות secara langsung menuturkan kematian Nadab dan Abihu; predikat bahasa Indonesia tidak berubah meskipun subjeknya majemuk.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan keberadaan di hadapan atau dalam hadirat Yahweh dan tetap alami dalam konteks penghukuman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּהַקְרִבָם
  choice: ketika mereka mempersembahkan
  rationale: Infinitif dengan בְּ menyatakan keadaan atau waktu; dalam konteks ibadah korban, 'mempersembahkan' merupakan padanan Indonesia yang alami.
- source_word: אֵשׁ זָרָה
  choice: api asing
  rationale: Padanan ini mempertahankan gambaran dan ketidakpastian leksikal זָרָה tanpa langsung menetapkannya sebagai 'tidak sah'; kemungkinan maksud kultisnya dijelaskan dalam catatan kaki.
- source_word: בְּמִדְבַּר סִינַי
  choice: di padang gurun Sinai
  rationale: Terjemahan langsung dan lazim untuk penunjuk tempat tersebut.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: mereka tidak mempunyai anak laki-laki
  rationale: בָנִים berarti 'anak laki-laki' dan hal itu relevan dengan kelanjutan garis pelayanan imam.
- source_word: וַיְכַהֵן
  choice: melayani sebagai imam
  rationale: Kata kerja כהן berarti menjalankan fungsi atau pelayanan imam.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: di hadapan Harun, ayah mereka
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani dan tidak membatasi maknanya hanya pada pengawasan ataupun urutan waktu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memuat Tetragramaton sebagai nama ilahi; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Sifat api yang dipersembahkan Nadab dan Abihu
  choice: api asing
  alternative: api yang tidak diperintahkan atau api yang tidak sah
  rationale: Konteks menunjukkan ketidaktepatan kultis, tetapi kata זָרָה sendiri dapat berarti asing atau bukan pada tempatnya. Teks utama mempertahankan ketegangan itu dan catatan menjelaskan kemungkinan maknanya.
- issue: Makna pelayanan Eleazar dan Itamar עַל־פְּנֵי Harun
  choice: di hadapan Harun
  alternative: semasa hidup Harun atau di bawah pengawasan Harun
  rationale: Ungkapan Ibrani dapat menunjukkan kehadiran di hadapan Harun dan mungkin juga bahwa mereka melayani semasa hidupnya; terjemahan tidak memilih salah satu implikasi secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi dua agar mudah dipahami, sementara pengulangan 'di hadapan Yahweh' dan ambiguitas dua ungkapan penting tetap dipertahankan.
