  text: וּ/מִשְׁמַרְתָּ֗/ם הָ/אָרֹ֤ן וְ/הַ/שֻּׁלְחָן֙ וְ/הַ/מְּנֹרָ֣ה וְ/הַֽ/מִּזְבְּחֹ֔ת וּ/כְלֵ֣י הַ/קֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּ/הֶ֑ם וְ/הַ֨/מָּסָ֔ךְ וְ/כֹ֖ל עֲבֹדָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: id
  text: Tugas mereka[a] ialah mengurus tabut, meja, kaki pelita, mezbah-mezbah, perlengkapan tempat kudus[b] yang digunakan dalam pelayanan, tirai pintu[c], dan segala pelayanan yang berkaitan dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tanggung jawab mereka” atau “tugas yang dipercayakan kepada mereka.”'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “perkakas-perkakas kudus.”
    reason: lexical_alternative
  - marker: c
    text: Yaitu tirai penutup jalan masuk, bukan tirai pemisah bagian dalam.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: Tanggung jawab mereka ialah mengurus
  rationale: Dalam konteks Kemah Suci, מִשְׁמֶרֶת menunjuk pada tugas atau tanggung jawab yang dipercayakan. Penambahan verba 'mengurus' membuat hubungan dengan daftar benda terdengar alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: הָאָרֹן
  choice: tabut
  rationale: Dalam konteks Kemah Suci, אָרוֹן secara konvensional menunjuk pada tabut suci. Teks Ibrani tidak menambahkan keterangan 'perjanjian' atau 'kesaksian', sehingga terjemahan juga tidak menambahkannya.
- source_word: הַשֻּׁלְחָן
  choice: meja
  rationale: Teks sumber hanya menyebut 'meja'; konteks sudah cukup untuk mengenalinya sebagai perabot Kemah Suci.
- source_word: הַמְּנֹרָה
  choice: kaki pelita
  rationale: מְנוֹרָה adalah tempat atau penyangga lampu dalam Kemah Suci. 'Kaki pelita' merupakan istilah Indonesia yang jelas dan lazim.
- source_word: הַמִּזְבְּחֹת
  choice: mezbah-mezbah
  rationale: Bentuk Ibrani adalah jamak, sehingga jumlahnya dipertahankan secara eksplisit.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: perlengkapan tempat kudus
  rationale: כְּלִים dapat berarti perkakas, peralatan, atau perlengkapan; הַקֹּדֶשׁ di sini menunjuk pada tempat kudus. Pilihan ini lebih alami daripada 'bejana-bejana' karena cakupan bendanya tidak harus terbatas pada wadah.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: yang digunakan untuk melayani
  rationale: Klausa ini menyatakan bahwa perlengkapan tersebut menjadi sarana pelayanan ibadah. Bentuk pasif alami dalam bahasa Indonesia dan tidak memaksakan subjek yang tidak dinyatakan secara spesifik.
- source_word: הַמָּסָךְ
  choice: tirai pintu
  rationale: מָסָךְ dalam konteks Kemah Suci adalah tirai penutup jalan masuk, berbeda dari tirai pemisah bagian dalam (פָּרֹכֶת). 'Tirai pintu' menyampaikan fungsi itu secara ringkas.
- source_word: וְכָל עֲבֹדָתוֹ
  choice: dan segala pelayanan yang berkaitan dengannya
  rationale: עֲבֹדָה dalam konteks ini adalah pekerjaan pelayanan suci. Sufiks tunggal maskulin memiliki rujukan yang tidak sepenuhnya tegas; frasa 'yang berkaitan dengannya' mempertahankan kelonggaran rujukan tanpa menentukan satu benda secara dogmatis.
theological_decisions:
- issue: Istilah bagi pelayanan Kemah Suci
  choice: melayani; pelayanan
  alternative: bekerja; pekerjaan
  rationale: Akar שׁרת dan nomina עֲבֹדָה berada dalam konteks ibadah Kemah Suci. 'Melayani' dan 'pelayanan' mempertahankan nuansa sakral tanpa memasukkan jabatan atau konsep gerejawi yang lebih kemudian.
- issue: Rujukan sufiks pada עֲבֹדָתוֹ
  choice: yang berkaitan dengannya
  alternative: segala tugas untuk tirai itu; seluruh pelayanan Kemah Suci
  rationale: Sufiks orang ketiga tunggal maskulin dalam bahasa Ibrani dapat dipahami terkait dengan unsur terdekat atau secara lebih luas dengan urusan tempat kudus. Terjemahan tidak mempersempit ambiguitas itu secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, sementara pembukaan dibuat idiomatis. Istilah kultis diterjemahkan secara jelas tanpa menambahkan keterangan yang tidak terdapat dalam teks Ibrani.
