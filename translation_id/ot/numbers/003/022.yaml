base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: id
  text: Jumlah mereka yang terdaftar[a], menurut hitungan semua laki-laki yang berumur satu bulan ke atas, adalah tujuh ribu lima ratus orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka yang dihitung”; kata Ibrani yang sama untuk pendataan sensus muncul dua kali dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: mereka yang terdaftar
  rationale: Bentuk dari פקד dalam konteks sensus menunjuk kepada orang-orang yang didata atau dihitung. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa pencatatan resmi.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: yaitu semua laki-laki
  rationale: בְּמִסְפַּר memperkenalkan rincian kelompok yang dihitung. Dalam bahasa Indonesia, 'yaitu' menyampaikan hubungan penjelas itu dengan alami; כָּל זָכָר tetap diterjemahkan secara khusus sebagai 'semua laki-laki'.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: yang berumur satu bulan ke atas
  rationale: Ini adalah rumus batas usia dalam sensus. Terjemahan tersebut jelas, wajar, dan setia pada arti harfiahnya.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: tujuh ribu lima ratus orang
  rationale: Bilangan ditulis dengan kata-kata dalam prosa; 'orang' ditambahkan secara wajar untuk memperjelas bahwa angka itu adalah jumlah laki-laki yang terdaftar.
