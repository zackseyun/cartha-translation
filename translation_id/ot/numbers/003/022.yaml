  to: Jumlah mereka yang terdaftar[a], menurut hitungan semua laki-laki yang berumur satu bulan ke atas, adalah tujuh ribu lima ratus orang.
  rationale: Mengganti “yaitu” dengan “menurut hitungan” agar hubungan yang dinyatakan oleh בְּמִסְפַּר diterjemahkan lebih setia. Istilah sensus, batas usia, jenis kelamin, dan jumlah tetap dipertahankan; catatan kaki tetap menandai pengulangan istilah sensus dalam bahasa Ibrani.
