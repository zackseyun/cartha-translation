base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: id
  text: Lalu Musa menghitung semua anak sulung di antara orang Israel[a], sebagaimana Yahweh telah memerintahkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “anak-anak Israel”; atau “putra-putra Israel” atau “keturunan Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: menghitung
  rationale: Dalam konteks pendataan ini, פקד berarti menghitung atau mendata orang. “Menghitung” jelas, alami, dan tepat.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menyatakan bahwa tindakan Musa sepenuhnya sesuai dengan perintah ilahi.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: Konstruksi relatif ini alami dalam bahasa Indonesia dan tetap menunjukkan bahwa perintah mendahului tindakan Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֹתוֹ
  choice: kepadanya
  rationale: Pronomina ini merujuk kepada Musa sebagai penerima perintah.
- source_word: אֶת כָּל בְּכֹר
  choice: semua anak sulung
  rationale: Terjemahan ini mempertahankan cakupan keseluruhan frasa tanpa menambahkan kata “laki-laki”, yang tidak tersurat dalam ayat ini.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: di antara keturunan Israel
  rationale: Dalam bahasa Indonesia, “keturunan Israel” merupakan ungkapan alami yang mencakup komunitas yang berasal dari Israel; “di antara” mencerminkan prefiks ב dalam konteks penghitungan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan fungsi nama pribadi itu.
- issue: Cakupan gender בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Dalam konstruksi kolektif ini, בְּנֵי יִשְׂרָאֵל menunjuk kepada komunitas keturunan Israel, bukan hanya laki-laki. Catatan kaki mempertahankan bentuk harfiahnya tanpa membuat teks utama kaku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Lalu” meneruskan rangkaian cerita, sedangkan “tepat seperti” menegaskan kesesuaian tindakan Musa dengan perintah Yahweh.
