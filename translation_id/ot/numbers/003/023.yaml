  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: id
  text: Keluarga-keluarga Gerson harus berkemah di belakang Kemah Suci, di sebelah barat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani secara harfiah: “ke arah laut”, ungkapan baku untuk arah barat dalam bahasa Ibrani Alkitab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks pembagian suku dan sensus di Kitab Bilangan, istilah ini menunjuk pada kelompok-kelompok kekerabatan dalam kelompok Lewi yang lebih besar. 'Kaum-kaum' menyampaikan cakupan tersebut dengan lebih tepat daripada 'keluarga-keluarga', yang dapat terdengar sebagai rumah tangga inti.
- source_word: הַגֵּרְשֻׁנִּי
  choice: keturunan Gerson
  rationale: Bentuk gentilisia tunggal dengan kata sandang ini dipakai secara kolektif untuk kelompok yang berasal dari Gerson. 'Keturunan Gerson' alami dan jelas dalam bahasa Indonesia.
- source_word: אַחֲרֵי
  choice: di belakang
  rationale: Kata depan ini bersifat spasial dalam uraian tata letak perkemahan, bukan temporal.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks ini istilah tersebut menunjuk pada tempat kudus berbentuk kemah. 'Kemah Suci' merupakan padanan Indonesia yang jelas, wajar, dan membedakannya dari kemah biasa.
- source_word: יַחֲנוּ
  choice: harus berkemah
  rationale: Bentuk imperfek ini menyatakan tata perkemahan yang ditetapkan. 'Harus berkemah' menyampaikan daya preskriptifnya secara alami dalam bahasa Indonesia.
- source_word: יָמָּה
  choice: di sebelah barat
  rationale: Bentuk berarah yang secara harfiah berasal dari kata 'laut' ini merupakan ungkapan baku untuk arah barat dalam bahasa Ibrani Alkitab. Dalam konteks posisi perkemahan, 'di sebelah barat' paling alami dan jelas.
