  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: id
  text: Pemimpin[a] kelompok keluarga leluhur[b] dari kaum-kaum Merari adalah Zuriel anak Abihail. Mereka harus berkemah di sisi utara Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepala”. Kata Ibrani yang dipakai dapat menunjuk pada pemimpin, kepala, atau orang berkedudukan utama.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “rumah ayah”, yaitu satuan kekerabatan berdasarkan garis leluhur laki-laki.'
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: Pemimpin
  rationale: נָשִׂיא menunjuk pada pemimpin atau kepala yang diakui. Dalam konteks pengaturan kaum Lewi, “pemimpin” terdengar alami dan tidak menimbulkan kesan monarki seperti “pangeran”. Konjungsi ו tidak diterjemahkan tersendiri karena ayat ini tetap berkesinambungan secara wajar dalam bahasa Indonesia.
- source_word: בֵית אָב
  choice: kaum leluhur
  rationale: Secara harfiah berarti “rumah ayah”, tetapi merupakan istilah kekerabatan bagi satuan keluarga besar berdasarkan garis leluhur laki-laki. “Kaum leluhur” mempertahankan gagasan asal-usul keluarga tanpa menyiratkan sebuah bangunan.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: bagi kaum-kaum keturunan Merari
  rationale: מִשְׁפָּחוֹת di sini adalah kelompok-kelompok kekerabatan dalam garis Merari. Prefiks ל dipertahankan sebagai “bagi”, yang menyatakan lingkup kepemimpinan. Pengulangan “kaum” membedakan satuan בית אב dari kelompok-kelompok מִשְׁפָּחוֹת.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: Zuriel anak Abihail
  rationale: Nama-nama diri ditransliterasikan menurut bentuk yang lazim, sedangkan בֶּן diterjemahkan “anak” dalam rumus silsilah.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: di sisi utara Kemah Suci
  rationale: יֶרֶךְ berarti sisi atau bagian samping, dan צָפֹנָה menentukan arah utara. מִשְׁכָּן dalam konteks ini diterjemahkan “Kemah Suci”, istilah Indonesia yang jelas bagi tempat kudus portabel Israel.
- source_word: יַחֲנוּ
  choice: Mereka harus berkemah
  rationale: Bentuk imperfek menyatakan penempatan perkemahan yang ditetapkan, sehingga “harus berkemah” menyampaikan daya preskriptifnya dengan alami.
