source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה פְּקֹ֨ד כָּל בְּכֹ֤ר זָכָר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה וְ/שָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Hitunglah setiap anak laki-laki sulung di antara bani Israel yang berumur satu bulan ke atas, dan catatlah jumlah mereka menurut nama masing-masing.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan ambillah jumlah nama-nama mereka.”
    reason: Menunjukkan bentuk ungkapan Ibrani di balik terjemahan idiomatis ‘catatlah jumlah mereka menurut nama masing-masing’.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH secara langsung dan membedakannya dari gelar umum seperti ‘Tuhan’.
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; ‘kemudian’ alami dalam bahasa Indonesia, sedangkan ‘berfirman’ merupakan padanan bermartabat ketika Allah menjadi subjek.
- source_word: פְּקֹד
  choice: Hitunglah
  rationale: Dalam konteks sensus, verba ini memerintahkan penghitungan atau pendataan. ‘Hitunglah’ jelas dan wajar bagi pembaca modern.
- source_word: כָּל בְּכֹר זָכָר
  choice: setiap anak laki-laki sulung
  rationale: בכור menyatakan yang sulung dan זכר secara khusus menyatakan laki-laki; frasa ini mempertahankan kedua unsur tersebut dengan susunan Indonesia yang alami.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: di antara bani Israel
  rationale: Secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi dalam ungkapan kebangsaan merujuk pada keturunan Israel. ‘Bani Israel’ mempertahankan bentuk tradisional yang masih dipahami, dan ‘di antara’ sesuai dengan konteks sensus.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: yang berumur satu bulan ke atas
  rationale: Ungkapan Ibrani menetapkan batas usia terendah. Padanan ini alami dalam bahasa Indonesia dan mempertahankan cakupan inklusif mulai usia satu bulan.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: dan catatlah jumlah mereka menurut nama masing-masing
  rationale: Secara bentuk berarti ‘angkat/ambillah jumlah nama-nama mereka’, tetapi merupakan idiom pendataan berdasarkan nama. Terjemahan ini menyampaikan tindakan pencatatan tanpa menghilangkan unsur penghitungan individual menurut nama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk perintah memakai akhiran -lah; istilah ‘bani Israel’ dipertahankan karena ringkas, lazim dalam register Kitab Suci, dan tetap mudah dipahami. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
