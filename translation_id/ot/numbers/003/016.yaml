id: NUM.3.16
reference: Numbers 3:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְקֹ֥ד אֹתָ֛/ם מֹשֶׁ֖ה עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צֻוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: id
  text: Lalu Musa menghitung mereka atas perintah Yahweh[a], tepat seperti yang diperintahkan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: menghitung
  rationale: Dalam konteks sensus orang Lewi, פקד menunjuk pada tindakan menghitung atau mendata orang. 'Menghitung' jelas dan alami dalam bahasa Indonesia.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek ini mengacu kepada orang-orang Lewi dalam konteks sebelumnya.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan עַל־פִּי secara harfiah berarti 'menurut mulut', tetapi secara idiomatis menyatakan tindakan yang dilakukan berdasarkan perintah atau titah Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menyatakan kesesuaian tindakan Musa dengan perintah yang telah diberikan; 'tepat seperti' menonjolkan kesesuaian itu secara alami.
- source_word: צֻוָּה
  choice: yang diperintahkan kepadanya
  rationale: Bentuk pasif Pual berarti bahwa Musa telah menerima perintah. Rumusan ini alami dalam bahasa Indonesia dan tidak menyebut pelaku secara berlebihan, sebagaimana teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Pelaku tersirat dalam צֻוָּה
  choice: tidak dinyatakan secara eksplisit
  alternative: yang diperintahkan Yahweh kepadanya
  rationale: Bentuk Ibrani bersifat pasif dan tidak menyebut pelaku dalam klausa ini. Terjemahan mempertahankan ketakterusterangan tersebut meskipun konteks menunjukkan bahwa Yahweh adalah pemberi perintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' menyambungkan ayat ini dengan konteks naratif; susunan kalimat tetap ringkas dan mudah dipahami.
