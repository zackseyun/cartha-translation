  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: id
  text: Pemimpin[a] kaum keluarga[b] dari puak-puak keturunan Kehat ialah Elisafan bin Uziel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kepala” atau “pemuka” (Ibrani: נָשִׂיא, nasi).'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah ayah,” yaitu satuan keluarga besar atau kaum berdasarkan garis keturunan ayah.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Pemimpin
  rationale: נָשִׂיא menunjuk pada orang yang memiliki wewenang sebagai pemimpin atau kepala. Dalam konteks pengaturan suku, “pemimpin” terdengar alami dan tidak menyiratkan kedudukan raja. Konjungsi ו tidak dinyatakan tersendiri karena ayat ini merupakan kelanjutan langsung dari kalimat sebelumnya dan bahasa Indonesia tidak memerlukannya.
- source_word: בֵית אָב
  choice: kaum leluhur
  rationale: Ungkapan harfiah “rumah ayah” merupakan istilah kekerabatan bagi satuan keluarga besar berdasarkan garis ayah. “Kaum leluhur” menyampaikan fungsi sosialnya secara wajar sambil mempertahankan unsur keturunan.
- source_word: לְמִשְׁפְּחֹת
  choice: dari puak-puak
  rationale: מִשְׁפָּחוֹת merujuk pada kelompok-kelompok kekerabatan atau klan. “Puak-puak” membedakannya dari satuan “kaum leluhur” dan mempertahankan bentuk jamak.
- source_word: הַקְּהָתִי
  choice: keturunan Kehat
  rationale: Bentuk nisbah tunggal berartikel ini dipakai secara kolektif untuk kelompok keturunan Kehat. “Keturunan Kehat” jelas dan alami dalam bahasa Indonesia.
- source_word: אֶלִיצָפָן
  choice: Elisafan
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: בֶּן עֻזִּיאֵל
  choice: bin Uziel
  rationale: Rumus silsilah Ibrani diterjemahkan secara ringkas dengan “bin,” yang berarti anak laki-laki dari dan lazim dipahami dalam nama silsilah.
