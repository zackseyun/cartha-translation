base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu Musa memberikan uang tebusan itu[a] kepada Harun dan anak-anaknya, sesuai dengan perintah Yahweh, tepat seperti yang telah diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perak orang-orang yang ditebus”; maksudnya, pembayaran yang dikumpulkan untuk penebusan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Lalu ... memberikan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi lampau. “Memberikan” menyampaikan arti dasar נתן secara alami; “lalu” menandai kesinambungan narasi.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: uang tebusan itu
  rationale: כֶּסֶף secara harfiah berarti “perak”, tetapi dalam konteks pembayaran dapat berarti uang. Rangkaian dengan הַפְּדֻיִם menunjuk pada pembayaran yang telah dipungut untuk penebusan; “uang tebusan” merupakan padanan Indonesia yang alami, sedangkan “itu” mengacu pada uang yang disebut dalam ayat-ayat sebelumnya.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kepada Harun dan anak-anaknya
  rationale: Preposisi לְ menyatakan penerima. Sufiks pada בָנָיו merujuk secara khusus kepada anak-anak Harun.
- source_word: עַל פִּי יְהוָה
  choice: sesuai dengan perintah Yahweh
  rationale: Ungkapan ini secara harfiah berarti “menurut mulut Yahweh”, tetapi secara idiomatis menyatakan tindakan yang dilakukan berdasarkan perintah-Nya.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang telah diperintahkan Yahweh kepada Musa
  rationale: כַּאֲשֶׁר menyatakan kesesuaian dengan perintah terdahulu. “Tepat seperti” mempertahankan penekanan pada ketaatan Musa, dan “telah diperintahkan” cocok dengan urutan peristiwa dalam narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan merupakan transliterasi yang lazim berdasarkan bukti kebahasaan.
- issue: Makna כֶּסֶף הַפְּדֻיִם
  choice: uang tebusan
  alternative: perak orang-orang yang ditebus
  rationale: Konteks langsung menunjukkan pembayaran penebusan bagi kelebihan jumlah anak sulung Israel. Terjemahan idiomatis dipakai dalam teks utama, sementara bentuk harfiahnya dicatat agar hubungan dengan “orang-orang yang ditebus” tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. Pengulangan “perintah/diperintahkan” dipertahankan karena mencerminkan pengulangan dalam teks Ibrani dan menegaskan kesesuaian tindakan Musa dengan perintah Yahweh.
