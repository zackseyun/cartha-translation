  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: id
  text: “Bawalah suku Lewi mendekat dan tempatkanlah mereka di hadapan Imam Harun, dan mereka harus melayaninya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “melayani” dapat menunjuk pada pelayanan sebagai pembantu maupun pelayanan dalam kegiatan ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: Bawalah ... mendekat
  rationale: Bentuk Hifil imperatif dari קרב menyatakan tindakan menyebabkan seseorang datang dekat. Ungkapan ini mempertahankan nuansa konkret dan kultis dalam bahasa Indonesia yang wajar.
- source_word: מַטֵּה לֵוִי
  choice: suku Lewi
  rationale: Dalam konteks kelompok keturunan Israel, מַטֶּה berarti ‘suku’, bukan tongkat atau marga.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: dan tempatkanlah mereka
  rationale: Bentuk Hifil dari עמד berarti membuat berdiri, menempatkan, atau menugaskan pada suatu posisi. Bahasa Indonesia secara alami memakai pronomina jamak ‘mereka’ untuk anggota suku Lewi, meskipun bahasa Ibrani mula-mula memakai objek tunggal kolektif.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: di hadapan Imam Harun
  rationale: לִפְנֵי secara langsung berarti ‘di hadapan’ atau ‘di depan’. Susunan ‘Imam Harun’ terdengar alami dalam bahasa Indonesia dan tetap menunjukkan jabatan Harun.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: supaya mereka melayani dia
  rationale: שרת menunjuk pada pelayanan sebagai pembantu atau pelayan, termasuk pelayanan dalam lingkungan ibadah. Pronomina objek paling alami merujuk kepada Harun. Hubungan tujuan dibuat jelas dengan ‘supaya’, sesuai rangkaian imperatif yang diikuti tindakan pelayanan.
theological_decisions:
- issue: Sifat pelayanan orang Lewi kepada Harun
  choice: Orang Lewi ditempatkan di hadapan Harun untuk melayani dia dalam tugas keimamannya.
  alternative: Orang Lewi melayani bersama Harun, bukan melayani dia.
  rationale: Pronomina objek langsung dalam וְשֵׁרְתוּ אֹתוֹ paling wajar merujuk kepada Harun. Terjemahan tidak mengubah hubungan itu menjadi sekadar pelayanan bersama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Bawalah ... mendekat’ mempertahankan citra sumber, sedangkan ‘tempatkanlah mereka’ mengungkapkan makna kolektif suku Lewi secara alami. Penanda catatan kaki [a] ditempatkan langsung sesudah klausa terkait.
