  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: id
  text: Ambillah orang-orang Lewi sebagai pengganti setiap anak sulung di antara keturunan Israel[a], dan ternak orang-orang Lewi sebagai pengganti ternak mereka. Orang-orang Lewi itu akan menjadi milik-Ku. Akulah Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di antara anak-anak lelaki Israel”; ungkapan ini lazim menunjuk kepada keturunan atau umat Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Ambillah
  rationale: Bentuk imperatif dari לקח menyampaikan perintah langsung kepada Musa. Dalam konteks ini, “ambillah” mencakup tindakan menetapkan orang Lewi sebagai pengganti.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan alami dalam bahasa Indonesia untuk kelompok suku Lewi.
- source_word: תַּחַת
  choice: sebagai pengganti
  rationale: Dalam konteks ini, kata tersebut menyatakan substitusi, bukan posisi secara ruang; pilihan ini juga mempertahankan kesejajaran antara manusia dan ternak.
- source_word: כָּל בְּכוֹר
  choice: setiap anak sulung
  rationale: כָּל dengan nomina tunggal בְּכוֹר bersifat distributif, sehingga “setiap anak sulung” tepat dan alami.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: di antara keturunan Israel
  rationale: Preposisi בְּ dipahami secara partitif. “Keturunan Israel” mempertahankan hubungan genealogis ungkapan Ibrani tanpa memberi kesan bahwa yang dimaksud hanya anak-anak langsung.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: ternak orang-orang Lewi
  rationale: בְּהֵמָה di sini merupakan sebutan kolektif bagi hewan peliharaan; “ternak” ringkas dan lazim.
- source_word: בְּהֶמְתָּם
  choice: ternak mereka
  rationale: Akhiran orang ketiga jamak merujuk kepada keturunan Israel dalam konteks, sedangkan nomina tetap dipertahankan dalam arti kolektif.
- source_word: וְהָיוּ לִי
  choice: akan menjadi milik-Ku
  rationale: Ungkapan ini menyatakan kepemilikan ilahi. Bentuk ini jelas dalam bahasa Indonesia dan mempertahankan daya deklaratifnya.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Konstruksi tersebut merupakan rumusan pengenalan diri dan penegasan kewenangan ilahi; “Akulah” memberi penekanan yang alami, sedangkan nama perjanjian ditransliterasikan “Yahweh”.
theological_decisions:
- issue: Makna penggantian dalam תַּחַת
  choice: sebagai pengganti
  alternative: menggantikan
  rationale: Pilihan nominal yang sama pada kedua kemunculan mempertahankan kesejajaran formal dan gagasan substitusi tanpa menjelaskan lebih jauh sifat teologis penggantian itu.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat nama diri ilahi YHWH. “Yahweh” mempertahankannya sebagai nama, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “orang-orang Lewi” serta “ternak” dipertahankan untuk mencerminkan kesejajaran teks Ibrani. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia.
