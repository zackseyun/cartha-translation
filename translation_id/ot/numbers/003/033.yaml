base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: id
  text: 'Keturunan Merari: kaum Mahli dan kaum Musi. Inilah kaum-kaum Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: Keturunan Merari terdiri atas
  rationale: Prefiks לְ memperkenalkan kelompok yang berada di bawah Merari dalam daftar silsilah. Rumusan ini menyampaikan fungsi klasifikasinya secara alami dalam bahasa Indonesia.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks silsilah dan sensus, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah tingkat suku. 'Kaum' lebih tepat daripada 'keluarga' yang dapat dipahami sebagai keluarga inti.
- source_word: הַמַּחְלִי
  choice: Mahli
  rationale: 'Bentuk nisbah ini menunjuk pada kelompok keturunan Mahli. Sesudah kata ''kaum'', nama leluhur dapat dipakai secara alami sebagai sebutan kelompok: ''kaum Mahli''.'
- source_word: וּמִשְׁפַּחַת הַמּוּשִׁי
  choice: dan kaum Musi
  rationale: Konjungsi menghubungkan kelompok kedua dengan kelompok pertama; bentuk nisbahnya dinyatakan secara alami sebagai 'kaum Musi'.
- source_word: אֵלֶּה הֵם
  choice: Itulah
  rationale: Gabungan kata penunjuk dan pronomina menegaskan identifikasi. 'Itulah' mempertahankan penegasan itu dengan ringkas dan wajar.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: kaum-kaum keturunan Merari
  rationale: Bentuk jamak merangkum dua kelompok yang baru disebut. 'Keturunan Merari' memperjelas hubungan genealogis tanpa menyamakan Merari dengan nama suku.
