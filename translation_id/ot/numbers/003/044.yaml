  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh berfirman kepada Musa, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Untuk ujaran ilahi, "berfirman" merupakan padanan Indonesia yang alami dan bermartabat, sementara "lalu" menandai kemajuan narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai "Yahweh" agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan ujaran; "kepada" adalah padanan Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi firman yang menyusul. "Demikian:" menghindari konstruksi Indonesia yang kaku seperti "dengan berkata" dan tetap mempertahankan fungsi formula Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi "Yahweh" mempertahankan nama itu, sedangkan "TUHAN" merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula ujaran Ibrani dipertahankan secara fungsional tanpa menghasilkan ungkapan yang terasa kaku dalam bahasa Indonesia.
