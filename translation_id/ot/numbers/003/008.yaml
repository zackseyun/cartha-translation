id: NUM.3.8
reference: Numbers 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: id
  text: Mereka harus menjaga seluruh perlengkapan Kemah Pertemuan dan menjalankan tugas bani Israel[a] untuk melaksanakan pelayanan Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanggung jawab bani Israel”; dapat juga dipahami, “tanggung jawab terhadap bani Israel.”
    reason: Alternatif leksikal dan kemungkinan relasi genitif dalam מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Mereka harus menjaga ... dan menjalankan tanggung jawab
  rationale: Dalam konteks peribadatan, שׁמר mencakup menjaga sesuatu yang dipercayakan sekaligus menunaikan tugas. Ungkapan Indonesia disesuaikan dengan kedua objeknya agar tetap alami.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: seluruh perlengkapan Kemah Pertemuan
  rationale: כְּלִים mencakup berbagai perkakas, perabot, dan benda yang digunakan di tempat kudus; “perlengkapan” tidak mempersempit artinya menjadi bejana saja.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku dan jelas bagi kemah tempat pertemuan yang ditetapkan.
- source_word: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: tanggung jawab bani Israel
  rationale: מִשְׁמֶרֶת menunjuk pada tanggung jawab atau tugas yang dipercayakan. “Bani Israel” mempertahankan bentuk korporatif בְּנֵי יִשְׂרָאֵל secara wajar dalam bahasa Indonesia.
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: dengan melaksanakan pelayanan di Kemah Suci
  rationale: Konstruksi עבד—עבדה menekankan pelaksanaan pelayanan atau pekerjaan yang ditetapkan, sedangkan הַמִּשְׁכָּן menunjuk pada tempat kudus portabel itu.
theological_decisions:
- issue: Cakupan “tanggung jawab bani Israel”
  choice: tanggung jawab bani Israel
  alternative: tanggung jawab terhadap bani Israel
  rationale: Genitif Ibrani dapat dipahami sebagai tugas yang semestinya menjadi bagian bani Israel atau sebagai tanggung jawab yang berkaitan dengan mereka. Teks utama mempertahankan hubungan genitif tanpa menambahkan penjelasan teologis, sedangkan catatan kaki menyebut alternatifnya.
- issue: Ungkapan korporatif maskulin בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: “Bani Israel” mempertahankan bentuk harfiah dan identitas korporatif ungkapan Ibrani tanpa mengesankan bahwa ayat ini hanya berbicara tentang individu laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kemah Pertemuan” dan “Kemah Suci” dipakai sebagai istilah yang mudah dipahami; struktur kalimat dibuat alami tanpa menghilangkan nuansa penjagaan dan tugas yang dipercayakan.
