  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: id
  text: 'Dan inilah nama-nama putra Gerson menurut kaum-kaum mereka: Libni dan Simei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan daftar dalam bahasa Indonesia. Hubungan dengan konteks sebelumnya tetap tersirat tanpa memakai bentuk kaku seperti 'Dan inilah'.
- source_word: שְׁמוֹת
  choice: nama
  rationale: Nomina bentuk konstruksi ini menjadi bagian dari frasa alami 'nama anak-anak Gerson'; bahasa Indonesia tidak memerlukan penanda konstruksi tersendiri.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: anak-anak Gerson
  rationale: בְּנֵי secara harfiah menunjuk kepada anak-anak laki-laki; karena nama yang didaftarkan adalah dua putra Gerson, 'anak-anak Gerson' wajar dan jelas dalam bahasa Indonesia.
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: menurut kaum mereka
  rationale: Dalam konteks sensus dan silsilah, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan atau kaum. 'Menurut kaum mereka' mempertahankan fungsi pengelompokan preposisi לְ.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְ/שִׁמְעִי
  choice: dan Simei
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia, sementara וְ diterjemahkan sebagai 'dan'.
