base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: id
  text: Inilah keturunan Harun dan Musa[a] pada waktu[b] Yahweh berbicara dengan Musa[c] di Gunung Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai juga dapat diterjemahkan “riwayat keluarga” atau, secara lebih harfiah, “generasi-generasi.” Rumusan ini dapat memperkenalkan garis keluarga atau apa yang berasal dari seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada hari ketika,” sebuah ungkapan Ibrani yang berarti “pada waktu ketika” atau sekadar “ketika.”
    reason: lexical_alternative
  - marker: c
    text: Atau “berbicara kepada Musa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Formula penunjuk ini membuka bagian baru. “Inilah” alami dalam bahasa Indonesia dan tetap menandai struktur teks.
- source_word: תּוֹלְדֹת
  choice: keturunan
  rationale: Dalam konteks ini istilah tersebut menjadi judul bagi garis keluarga yang dilanjutkan dengan daftar anak-anak Harun. “Keturunan” lebih alami daripada “generasi-generasi,” sementara cakupan dan ketegangan judul dijelaskan dalam catatan.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Harun dan Musa
  rationale: Kedua nama dipertahankan sesuai teks Ibrani, sekalipun uraian berikut terutama berpusat pada anak-anak Harun.
- source_word: בְּיוֹם
  choice: pada waktu
  rationale: Secara harfiah “pada hari,” tetapi konstruksi idiomatis ini berarti “ketika” atau “pada waktu.”
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: berbicara dengan Musa
  rationale: Konstruksi דִּבֶּר dengan אֶת dapat dipahami sebagai berbicara dengan atau kepada seseorang. Pilihan ini mempertahankan kemungkinan nuansa interaksi tanpa menutup alternatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri dan tidak diganti dengan gelar.
- source_word: בְּהַר סִינָי
  choice: di Gunung Sinai
  rationale: “Di Gunung Sinai” merupakan ungkapan geografis yang alami dalam bahasa Indonesia; konteks tidak mengharuskan pemaksaan nuansa lokasi yang lebih sempit.
theological_decisions:
- issue: Cakupan תּוֹלְדֹת dalam judul yang menyebut Harun dan Musa
  choice: Mempertahankan kedua nama dalam frasa “keturunan Harun dan Musa”
  alternative: riwayat Harun dan Musa; garis keturunan Harun
  rationale: Teks Ibrani secara eksplisit menyebut keduanya, walaupun ayat-ayat berikut terutama mencantumkan anak-anak Harun. Terjemahan tidak menghapus ketegangan tersebut.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Bentuk sumber adalah nama ilahi, sehingga nama itu dipertahankan melalui transliterasi yang lazim secara akademis.
- issue: Arah ujaran dalam דִּבֶּר ... אֶת
  choice: berbicara dengan Musa
  alternative: berbicara kepada Musa
  rationale: Konstruksi Ibrani memungkinkan kedua ungkapan; pilihan utama mempertahankan nuansa “dengan,” sedangkan alternatif dicatat agar ambiguitas tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Inilah” mempertahankan fungsi judul, sedangkan catatan kaki menjaga bentuk formal serta ambiguitas leksikal sumber.
