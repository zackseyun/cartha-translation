base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: id
  text: Dari Gerson berasal kaum Libni dan kaum Simei; inilah kaum-kaum keturunan Gerson.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: Bagi Gerson terdapat
  rationale: Prefiks לְ menyatakan hubungan atau kepunyaan dalam daftar sensus. Ungkapan ini alami dalam bahasa Indonesia dan memperkenalkan kaum-kaum yang termasuk dalam cabang Gerson.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: kaum / kaum-kaum
  rationale: Dalam konteks silsilah dan sensus, מִשְׁפָּחָה menunjuk kelompok kekerabatan di bawah suku. 'Kaum' lebih luas daripada keluarga inti dan tidak sebesar 'suku'.
- source_word: הַלִּבְנִי
  choice: kaum Libni
  rationale: Bentuk nisbah ini menunjuk kelompok keturunan Libni. Dalam bahasa Indonesia, 'kaum Libni' menyampaikan identitas kelompok secara ringkas dan wajar.
- source_word: הַשִּׁמְעִי
  choice: kaum Simei
  rationale: Bentuk nisbah ini menunjuk kelompok keturunan Simei; pola 'kaum Simei' mempertahankan kesejajaran dengan kaum Libni.
- source_word: אֵלֶּה הֵם
  choice: Itulah
  rationale: Formula identifikasi ini secara idiomatis merangkum dua kelompok yang baru disebut tanpa mengubah fungsi pernyataannya.
- source_word: הַגֵּרְשֻׁנִּי
  choice: keturunan Gerson
  rationale: Bentuk nisbah menunjuk cabang besar yang berasal dari Gerson. 'Keturunan Gerson' jelas bagi pembaca Indonesia dan menghindari bentuk serapan gentilik yang kaku.
