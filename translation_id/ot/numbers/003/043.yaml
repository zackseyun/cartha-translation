base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: id
  text: Jumlah semua anak sulung laki-laki yang didaftarkan menurut nama, yang berumur satu bulan ke atas, berdasarkan hasil pencacahan mereka, adalah 22.373 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: adalah
  rationale: Dalam konteks ini bentuk היה menyatakan hasil akhir sensus; kopula ini menghasilkan kalimat Indonesia yang alami tanpa menambahkan makna.
- source_word: כָל בְּכוֹר זָכָר
  choice: semua anak sulung laki-laki
  rationale: Mempertahankan cakupan menyeluruh, urutan kelahiran, dan jenis kelamin yang dinyatakan teks Ibrani.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: yang didaftarkan menurut nama
  rationale: Ungkapan sensus ini menunjuk pada pencatatan orang seorang berdasarkan nama; terjemahan ini lebih alami daripada terjemahan harfiah 'menurut jumlah nama'.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: yang berumur satu bulan ke atas
  rationale: Menyampaikan batas usia sensus secara jelas dan lazim dalam bahasa Indonesia modern.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut penghitungan mereka
  rationale: Mempertahankan rujukan kepada pencacahan resmi kelompok tersebut tanpa meleburkannya sepenuhnya dengan angka total.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: 22.373 orang
  rationale: Urutan bilangan Ibrani bernilai dua puluh dua ribu tiga ratus tujuh puluh tiga; format angka Indonesia memakai titik sebagai pemisah ribuan, dan 'orang' memperjelas bahwa angka itu menghitung manusia.
