  source_fidelity: 'Klausa pertama diterjemahkan dengan setia: perintah kepada Musa, pengambilan orang Lewi bagi Yahweh, dan relasi penggantian bagi setiap anak sulung di antara anak-anak Israel semuanya terpelihara. Klausa kedua juga mempertahankan paralelisme dan kepemilikan ternak itu. Namun, “setiap ternak yang lahir pertama” kurang tepat dan kurang idiomatis untuk Ibrani כָּל־בְּכוֹר, yang menunjuk pada setiap hewan sulung, bukan pada “ternak” sebagai kolektif yang “lahir pertama.”'
