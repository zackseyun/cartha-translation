  terminology: “Yahweh” tepat untuk יהוה; “orang-orang Lewi,” “anak sulung,” “ternak,” dan “sebagai ganti” konsisten dengan istilah sumber serta konteks sensus/penggantian. Catatan kaki pada “anak-anak Israel” tepat dan jangkar [a] ditempatkan pada ungkapan yang dijelaskan.
