id: NUM.3.41
reference: Numbers 3:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: id
  text: Haruslah engkau mengambil orang-orang Lewi bagi-Ku—Akulah Yahweh—sebagai ganti setiap anak sulung di antara anak-anak Israel,[a] dan ternak orang-orang Lewi sebagai ganti setiap anak sulung dari ternak anak-anak Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “di antara anak-anak Israel.”
    reason: Menjelaskan bahwa ungkapan kekerabatan Ibrani juga berfungsi sebagai sebutan nasional bagi orang Israel.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Haruslah engkau mengambil
  rationale: Bentuk Qal perfektum orang kedua maskulin tunggal dengan waw berfungsi sebagai arahan kepada Musa dalam rangkaian perintah. Bentuk ini mempertahankan daya wajib sekaligus ragam hukum yang khidmat.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Istilah baku dalam bahasa Indonesia untuk kelompok suku keturunan Lewi; artikel tentu tercermin melalui konteks kelompok yang sudah dikenal.
- source_word: לִי
  choice: bagi-Ku
  rationale: Preposisi ini menyatakan bahwa orang Lewi dikhususkan atau diperuntukkan bagi Yahweh. 'Bagi-Ku' ringkas dan mempertahankan nuansa penyerahan tanpa mempersempitnya menjadi kepemilikan semata.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Partikel penegas '-lah' menyampaikan tekanan pada pronomina אֲנִי, sedangkan nama ilahi dipertahankan sebagai Yahweh. Tanda pisah mempertahankan fungsi formula itu sebagai penegasan di tengah kalimat.
- source_word: תַּחַת
  choice: sebagai ganti
  rationale: Dalam konteks penggantian anak sulung oleh orang Lewi, kata ini menunjukkan substitusi, bukan posisi fisik 'di bawah'.
- source_word: כָּל בְּכֹר
  choice: setiap anak sulung
  rationale: כָּל dengan nomina tunggal bernilai distributif. 'Setiap anak sulung' alami dalam bahasa Indonesia dan cocok untuk manusia dalam klausa pertama.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: di antara anak-anak Israel
  rationale: Ungkapan ini mempertahankan citra kekerabatan Ibrani בְּנֵי יִשְׂרָאֵל tanpa mengabaikan bahwa dalam pemakaian nasional ungkapan tersebut menunjuk kepada umat Israel.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: ternak orang-orang Lewi
  rationale: בְּהֵמָה di sini mencakup hewan peliharaan milik orang Lewi. 'Ternak' adalah istilah kolektif modern yang paling wajar.
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: setiap ternak yang lahir pertama di antara ternak anak-anak Israel
  rationale: Untuk hewan, 'ternak yang lahir pertama' lebih alami daripada 'anak sulung' dan tetap menyampaikan konsep בְּכוֹר serta hubungan distributif dalam kumpulan ternak Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memuat nama diri perjanjian, bukan gelar אֲדֹנָי. Bentuk 'Yahweh' mempertahankan nama tersebut dan mengikuti bukti bentuk yang lazim direkonstruksi, tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; keturunan Israel
  rationale: Terjemahan utama mempertahankan ungkapan kekerabatan dalam sumber. Catatan kaki menjelaskan padanan idiomatis nasionalnya agar pembaca tidak keliru menganggap acuan itu hanya kepada anak-anak kecil.
- issue: Sifat penggantian yang dinyatakan oleh תַּחַת
  choice: sebagai ganti
  alternative: menggantikan; sebagai pengganti
  rationale: Konteks sensus dan pengkhususan orang Lewi menunjukkan substitusi bagi anak sulung Israel. Terjemahan ini menyatakan relasi tersebut tanpa menambahkan teori tentang mekanisme atau makna teologis penggantian.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat digunakan dengan sapaan tunggal 'engkau' karena perintah ditujukan kepada Musa. Struktur paralel kedua bagian dipertahankan, sementara ungkapan tentang hewan dibuat wajar dalam bahasa Indonesia. Tanda pisah menonjolkan formula ilahi tanpa memutus alur utama.
