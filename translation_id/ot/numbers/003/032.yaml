  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: id
  text: Dan kepala para pemimpin orang Lewi ialah Eleazar, anak Harun yang adalah imam itu, yang mengawasi mereka yang menjalankan tugas menjaga tempat kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “benda-benda kudus.” Kata Ibrani הַקֹּדֶשׁ dapat menunjuk pada tempat kudus itu sendiri atau pada benda-benda kudus yang berkaitan dengannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: Pemimpin tertinggi para pemimpin orang Lewi
  rationale: Ungkapan Ibrani secara harfiah menyatakan ‘pemimpin para pemimpin orang Lewi’. ‘Pemimpin tertinggi’ menyampaikan kedudukan Eleazar atas para pemimpin Lewi tanpa nuansa kerajaan yang dapat ditimbulkan oleh ‘pangeran’.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Eleazar, anak Imam Harun
  rationale: Gelar הַכֹּהֵן secara gramatikal menerangkan Harun. Susunan ‘anak Imam Harun’ alami dalam bahasa Indonesia dan mempertahankan hubungan tersebut.
- source_word: פְּקֻדַּת
  choice: Ia mengawasi
  rationale: Nomina ini dapat menyatakan pengawasan, tanggung jawab, atau jabatan. Bentuk verbal menghasilkan kalimat Indonesia yang wajar sambil mempertahankan fungsi pengawasan Eleazar.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: orang-orang yang bertanggung jawab menjaga
  rationale: Gabungan partisip dan nomina serumpun menekankan tugas penjagaan yang dipercayakan. Terjemahan ini mempertahankan baik unsur tanggung jawab maupun penjagaan.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Dalam konteks Kemah Suci, istilah ini dapat menunjuk pada kawasan kudus atau benda-benda kudus. ‘Tempat kudus’ merupakan pilihan utama yang alami, sedangkan ambiguitas leksikalnya dicatat dalam catatan kaki.
