translation:
  language: id
  text: Hitunglah anak-anak Lewi[a] menurut kelompok keluarga dari pihak ayah mereka, menurut suku-suku mereka. Hitunglah setiap laki-laki yang berumur satu bulan ke atas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Lewi”; ungkapan ini juga dapat diterjemahkan “keturunan Lewi” atau “orang-orang Lewi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: Hitunglah / Hitunglah
  rationale: Dalam konteks sensus administratif ini, פקד berarti menghitung atau mendata. Pengulangan “Hitunglah” mempertahankan perintah pada awal dan akhir ayat tanpa menambahkan nuansa militer.
- source_word: בְּנֵי לֵוִי
  choice: anak-anak Lewi
  rationale: Ungkapan ini secara harfiah berarti “anak-anak Lewi” dan menonjolkan garis keturunan. Dalam konteks ini cakupannya adalah keturunan Lewi, bukan hanya putra-putra langsungnya; hal itu dijelaskan dalam catatan kaki.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga leluhur dari pihak ayah
  rationale: Pilihan ini menyampaikan struktur kekerabatan patrilineal dalam ungkapan Ibrani, tetapi tetap jelas bagi pembaca Indonesia masa kini.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: “Kaum” membedakan מִשְׁפָּחָה dari unit “keluarga leluhur dari pihak ayah” yang disebut sebelumnya.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: Teks menyebut jenis kelamin, bukan kedewasaan; karena itu “laki-laki” mencakup juga bayi yang disebut dalam batas usia berikutnya.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: yang berumur satu bulan ke atas
  rationale: Ungkapan ini menyatakan batas usia minimum secara alami dan tepat dalam bahasa Indonesia modern.
