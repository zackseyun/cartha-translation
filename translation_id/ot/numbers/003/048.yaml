  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: id
  text: Berikanlah perak itu kepada Harun dan putra-putranya sebagai uang tebusan bagi mereka yang jumlahnya melebihi jumlah orang Lewi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “bagi orang-orang yang ditebus, yaitu mereka yang berlebih di antara mereka.” Bahasa Ibrani memakai rangkaian kata yang padat. Dalam konteksnya, yang dimaksud ialah anak-anak sulung Israel yang jumlahnya melebihi jumlah orang Lewi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Berikanlah
  rationale: Bentuk perfektum Qal orang kedua tunggal maskulin dengan waw, dalam rangkaian perintah, berfungsi sebagai arahan. Imperatif Indonesia menyampaikan fungsi itu secara alami.
- source_word: הַכֶּסֶף
  choice: uang perak itu
  rationale: כֶּסֶף secara harfiah berarti perak dan juga dapat menunjuk pada uang. 'Uang perak' mempertahankan bahan pembayaran sekaligus menjelaskan fungsinya dalam konteks penebusan.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kepada Harun dan anak-anaknya
  rationale: Frasa ini menunjuk kepada Harun dan putra-putranya dalam peranan keimaman. 'Anak-anaknya' merupakan ungkapan Indonesia yang alami dalam konteks silsilah ini.
- source_word: פְּדוּיֵי
  choice: sebagai uang tebusan bagi
  rationale: Bentuk konstruksi jamak dari פדה secara padat menghubungkan pembayaran dengan orang-orang yang ditebus. Karena objek kalimatnya adalah uang perak, ungkapan ini menyatakan fungsi pembayaran secara jelas tanpa mengubah gagasan dasarnya.
- source_word: הָעֹדְפִים
  choice: mereka yang jumlahnya melebihi jumlah orang Lewi
  rationale: Partisipel dari עודף menunjuk kepada orang-orang yang tersisa sebagai kelebihan dalam perbandingan jumlah. Penyebutan 'jumlah orang Lewi' mengungkap acuan kontekstual yang jelas dari ayat-ayat sebelumnya.
- source_word: בָּהֶם
  choice: mereka
  rationale: Pronomina dengan ב menunjukkan kelompok tempat kelebihan itu terdapat. Dalam susunan Indonesia, hubungan tersebut tersampaikan melalui 'bagi mereka yang jumlahnya melebihi'.
theological_decisions:
- issue: Acuan kelompok pembanding dalam הָעֹדְפִים בָּהֶם
  choice: jumlah orang Lewi
  alternative: orang-orang yang berlebih di antara mereka
  rationale: Konteks langsung membandingkan jumlah anak sulung Israel dengan jumlah orang Lewi. Teks utama mengungkap pembanding agar logika sensus mudah dipahami, sedangkan catatan kaki mempertahankan bentuk Ibrani yang lebih padat dan ambigu secara sintaksis.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Imperatif 'Berikanlah' cocok untuk perintah ilahi yang disampaikan kepada Musa. 'Uang perak' dipilih daripada sekadar 'uang' untuk mempertahankan unsur leksikal Ibrani, sedangkan catatan kaki menjaga konstruksi sumber yang padat.
