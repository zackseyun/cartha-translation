base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/037.yaml
  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: id
  text: dan tiang-tiang di sekeliling pelataran, alas-alasnya[a], patok-patoknya, serta tali-talinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dudukan-dudukannya.” Istilah Ibrani ini dapat menunjuk pada alas struktural, khususnya dalam uraian tentang Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Atau “tambang-tambangnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: tiang-tiang
  rationale: Bentuk jamak konstruktus ini menunjuk pada penyangga tegak bagi pagar pelataran. “Tiang-tiang” alami dalam bahasa Indonesia dan sesuai dengan konteks bangunan Kemah Suci.
- source_word: הֶחָצֵר
  choice: pelataran
  rationale: Kata ini menunjuk pada kawasan terbuka yang mengelilingi Kemah Suci. “Pelataran” merupakan istilah arsitektural yang jelas dan bermartabat.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Kata ini menerangkan letak tiang-tiang pada seluruh keliling pelataran. Susunan ini mempertahankan hubungan yang paling wajar dalam bahasa Ibrani.
- source_word: אַדְנֵיהֶם
  choice: alas-alasnya
  rationale: Dalam uraian Kemah Suci, istilah ini menunjuk pada alas atau dudukan struktural bagi tiang. “Alas-alas” mudah dipahami, sedangkan kemungkinan teknis “dudukan” dicatat dalam catatan kaki.
- source_word: יְתֵדֹתָם
  choice: patok-patoknya
  rationale: Istilah ini menunjuk pada pasak atau patok yang ditancapkan untuk meneguhkan bangunan. “Patok” tepat dan lazim dalam bahasa Indonesia.
- source_word: מֵיתְרֵיהֶם
  choice: tali-talinya
  rationale: Kata ini menunjuk pada tali pengikat yang digunakan bersama patok. “Tali-tali” jelas bagi pembaca umum; “tambang” tetap dicatat sebagai alternatif leksikal.
- source_word: וְ / וִ / וּ
  choice: dan / serta
  rationale: Konjungsi-konjungsi yang berulang menandai kelanjutan daftar. “Dan” pada awal ayat mempertahankan kaitannya dengan ayat sebelumnya, sedangkan “serta” pada unsur terakhir menghasilkan daftar yang alami tanpa mengubah makna.
