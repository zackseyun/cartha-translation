  register: Bahasa Indonesia baku modern dengan corak daftar inventaris yang ringkas. Konjungsi awal dipertahankan karena ayat ini melanjutkan kalimat sebelumnya. Semua akhiran kepunyaan jamak dalam bahasa Ibrani dinyatakan dengan “-nya” sesuai konteks.
