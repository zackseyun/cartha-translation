  text: וְ/לִ/קְהָ֗ת מִשְׁפַּ֤חַת הַֽ/עַמְרָמִי֙ וּ/מִשְׁפַּ֣חַת הַ/יִּצְהָרִ֔י וּ/מִשְׁפַּ֨חַת֙ הַֽ/חֶבְרֹנִ֔י וּ/מִשְׁפַּ֖חַת הָֽ/עָזִּיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַ/קְּהָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: id
  text: Bagi Kehat ada kaum Amram, kaum Yizhar, kaum Hebron, dan kaum Uziel. Itulah kaum-kaum keturunan Kehat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: Bagi Kehat ada
  rationale: Gabungan kata penghubung dan preposisi memperkenalkan pengelompokan silsilah berikutnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi penggolongannya.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus dan silsilah, kata ini menunjuk pada kelompok kekerabatan di bawah suku atau kelompok besar; 'kaum' jelas dan sesuai dengan ragam Alkitab Indonesia yang bermartabat.
- source_word: הַֽ/עַמְרָמִי
  choice: Amram
  rationale: Bentuk nisbah Ibrani menunjuk kepada keturunan Amram. Setelah kata 'kaum', nama leluhur secara alami menyatakan kaum keturunannya.
- source_word: הַ/יִּצְהָרִי
  choice: Yizhar
  rationale: Bentuk nisbah ini menunjuk kepada keturunan Yizhar; ejaan 'Yizhar' mendekati bentuk Ibrani יִצְהָר dan membedakannya dengan jelas sebagai nama diri.
- source_word: הַֽ/חֶבְרֹנִי
  choice: Hebron
  rationale: Bentuk nisbah menunjuk kepada keturunan Hebron; konstruksi 'kaum Hebron' ringkas dan alami.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: Uziel
  rationale: Bentuk nisbah menunjuk kepada keturunan Uziel; nama leluhur sesudah 'kaum' menyampaikan hubungan keturunan secara jelas.
- source_word: אֵלֶּה הֵם
  choice: Itulah
  rationale: Gabungan demonstratif dan pronomina memberi pernyataan identifikasi atau rangkuman; 'Itulah' merupakan padanan Indonesia yang wajar.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: kaum-kaum keturunan Kehat
  rationale: Bentuk jamak konstruksi diikuti nisbah merangkum semua kelompok sebagai keturunan Kehat. 'Keturunan Kehat' menjelaskan nilai nisbah tanpa menghasilkan bentuk gentilik Indonesia yang kaku.
