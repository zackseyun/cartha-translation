  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: id
  text: Jumlah semua orang Lewi yang didata oleh Musa dan Harun atas perintah Yahweh[a], menurut kaum mereka, yaitu semua laki-laki yang berumur satu bulan ke atas, adalah 22.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut mulut Yahweh,” sebuah ungkapan yang berarti “atas perintah Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: yang didata / didata
  rationale: Dalam konteks ini akar פקד menunjuk pada pendataan sensus. “Didata” jelas dalam bahasa Indonesia modern dan tidak menambahkan nuansa militer.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Sebutan baku dalam bahasa Indonesia untuk anggota suku Lewi.
- source_word: עַל־פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan Ibrani ini secara harfiah berarti “menurut mulut Yahweh,” tetapi berfungsi sebagai idiom untuk perintah atau penetapan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: “Kaum” menyampaikan kelompok kekerabatan yang lebih luas daripada keluarga inti dan cocok dengan konteks sensus.
- source_word: כָּל זָכָר
  choice: semua laki-laki
  rationale: Terjemahan ini mempertahankan penandaan jenis kelamin yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: מִבֶּן־חֹדֶשׁ וָמַעְלָה
  choice: yang berumur satu bulan ke atas
  rationale: Ungkapan ini menyampaikan batas usia sensus secara alami dan tepat dalam bahasa Indonesia modern.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: 22.000 orang
  rationale: Angka Ibrani diterjemahkan langsung; “orang” ditambahkan secara wajar untuk memperjelas satuan jumlah tanpa mengubah makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Jumlah akhir sensus orang Lewi
  choice: 22.000 orang
  alternative: Menyelaraskannya dengan jumlah subtotal dalam ayat-ayat sebelumnya
  rationale: Angka yang tertulis dalam ayat ini dipertahankan apa adanya; terjemahan tidak menyelesaikan secara diam-diam ketegangan antara angka ini dan subtotal kelompok-kelompok Lewi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibentuk secara alami untuk menyatakan jumlah sensus, sambil mempertahankan cakupan menurut kaum, jenis kelamin, batas usia, nama ilahi, dan angka dalam teks Ibrani.
