  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: id
  text: Tugas yang dipercayakan kepada keturunan Merari ialah mengurus rangka-rangka Kemah Suci[a], palang-palangnya, tiang-tiangnya, alas-alasnya[b], seluruh perlengkapannya, dan segala pekerjaan yang berkaitan dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “papan-papan Kemah Suci.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “soket-soketnya,” yaitu dudukan tempat tiang atau rangka dipasang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: tugas yang dipercayakan
  rationale: Gabungan kedua nomina menunjuk pada tanggung jawab resmi yang diserahkan kepada suatu kelompok. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur penugasan serta amanat.
- source_word: בְּנֵי מְרָרִי
  choice: keturunan Merari
  rationale: Secara harfiah berarti 'anak-anak Merari', tetapi dalam konteks kelompok suku, 'keturunan Merari' lebih alami dan tidak mengesankan hanya anak kandung langsung.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: rangka-rangka Kemah Suci
  rationale: קֶרֶשׁ menunjuk pada bagian tegak struktural kemah. 'Rangka-rangka' menyampaikan fungsi konstruksinya, sedangkan 'Kemah Suci' merupakan istilah Indonesia yang jelas bagi הַמִּשְׁכָּן dalam konteks ini.
- source_word: בְרִיחָיו
  choice: palang-palangnya
  rationale: Istilah ini menunjuk pada batang melintang yang mengikat bagian-bagian rangka; 'palang' tepat dan mudah dipahami.
- source_word: עַמֻּדָיו
  choice: tiang-tiangnya
  rationale: Kata ini menunjuk pada penyangga tegak. 'Tiang' merupakan padanan Indonesia yang alami dalam konteks bangunan kemah.
- source_word: אֲדָנָיו
  choice: alas-alasnya
  rationale: Istilah ini menunjuk pada bagian dasar atau dudukan tempat unsur struktural dipasang. 'Alas' mudah dipahami, sementara kemungkinan teknis 'soket' dicatat dalam catatan kaki.
- source_word: כָל כֵּלָיו
  choice: seluruh perlengkapannya
  rationale: כְּלִי adalah istilah luas untuk benda, peralatan, atau perkakas. 'Perlengkapan' mempertahankan keluasan maknanya tanpa membatasinya pada perkakas kecil.
- source_word: כֹל עֲבֹדָתוֹ
  choice: segala pekerjaan yang berkaitan dengannya
  rationale: Pronomina tunggal dapat merujuk secara kolektif pada tanggung jawab atau perlengkapan yang baru disebut. Ungkapan ini menyampaikan pekerjaan pelayanan terkait tanpa membuat frasa Indonesia yang janggal.
