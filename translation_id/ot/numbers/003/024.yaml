  text: וּ/נְשִׂ֥יא בֵֽית אָ֖ב לַ/גֵּרְשֻׁנִּ֑י אֶלְיָסָ֖ף בֶּן לָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: id
  text: Kepala kaum keluarga orang Gerson[a] ialah Elyasaf, putra Lael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah ayah”, istilah kekerabatan Israel untuk satu kelompok keluarga atau bagian dari suatu kaum.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: Pemimpin
  rationale: נָשִׂיא dalam konteks administratif ini menunjuk kepada kepala atau pemimpin kelompok, bukan penguasa kerajaan. Konjungsi וּ tidak diterjemahkan secara tersendiri karena ayat ini merupakan lanjutan alami dari susunan daftar dalam bahasa Indonesia.
- source_word: בֵית אָב
  choice: kaum keluarga
  rationale: Ungkapan harfiah 'rumah bapa' adalah istilah kekerabatan Israel untuk kelompok keluarga patrilineal. 'Kaum keluarga' menyampaikan fungsi sosialnya dengan bahasa Indonesia yang alami; nuansa harfiahnya dijelaskan dalam catatan kaki.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: orang Gerson
  rationale: Bentuk ini merujuk secara kolektif kepada kelompok keturunan Gerson. 'Orang Gerson' adalah ungkapan Indonesia yang ringkas dan wajar untuk kelompok tersebut.
- source_word: אֶלְיָסָף
  choice: Elyasaf
  rationale: Nama diri Ibrani ditransliterasikan ke dalam bentuk yang jelas dan lazim dibaca dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah, בֶּן menyatakan hubungan anak laki-laki dengan ayahnya; 'anak' merupakan padanan Indonesia yang alami dan cukup tepat dalam konteks ini.
- source_word: לָאֵל
  choice: Lael
  rationale: Nama diri ditransliterasikan secara langsung.
