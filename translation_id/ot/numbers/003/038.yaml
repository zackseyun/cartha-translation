revisions:
- from: Yang berkemah di depan Kemah Suci, di sebelah timur[a]—di depan Kemah Pertemuan, ke arah matahari terbit—ialah Musa, Harun, dan anak-anak Harun. Mereka menjalankan tugas penjagaan tempat kudus bagi bani Israel. Namun, orang yang tidak berwenang[b] yang mendekat harus dihukum mati.
  to: Orang-orang yang berkemah di depan Kemah Suci, di sebelah timur[a]—di depan Kemah Pertemuan, ke arah matahari terbit—ialah Musa, Harun, dan anak-anak Harun. Mereka menjalankan tugas penjagaan tempat kudus demi memenuhi kewajiban orang Israel. Namun, orang yang tidak berwenang[b] yang mendekat harus dihukum mati.
  rationale: Revisi mengganti 'bani Israel' dengan 'orang Israel' demi pemakaian modern, serta menerjemahkan hubungan tugas itu sebagai pelaksanaan kewajiban Israel. Ini mencerminkan konteks representatif dari frasa Ibrani tanpa menyatakan teori kultis atau doktrinal yang lebih khusus. Catatan kaki dan penanda tetap tepat.
