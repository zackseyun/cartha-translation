id: NUM.3.38
reference: Numbers 3:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: id
  text: Orang-orang yang berkemah di depan Kemah Suci, di sebelah timur[a]—di depan Kemah Pertemuan, ke arah matahari terbit—ialah Musa, Harun, dan anak-anak Harun. Mereka menjalankan tugas penjagaan tempat kudus demi memenuhi kewajiban orang Israel. Namun, orang yang tidak berwenang[b] yang mendekat harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “ke arah timur ... di sebelah timur”; bahasa Ibrani memakai dua ungkapan arah yang berkaitan untuk memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud bukan khusus orang asing secara etnis, melainkan siapa pun yang tidak diberi kewenangan untuk mendekati pelayanan tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: Yang berkemah
  rationale: Partisipel substantival ini menunjuk kepada orang-orang yang ditempatkan untuk berkemah di lokasi tersebut; bentuk ini alami dalam uraian tata letak perkemahan.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: di depan Kemah Suci
  rationale: לִפְנֵי berarti 'di hadapan/di depan'. 'Kemah Suci' membedakan מִשְׁכָּן dari 'Kemah Pertemuan' yang langsung menyusul.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: di sebelah timur ... ke arah matahari terbit
  rationale: Dua ungkapan arah yang berkaitan dipertahankan dengan padanan berbeda agar penekanan Ibrani tidak diratakan.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan jelas bagi nama bangunan kudus ini.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: Musa, Harun, dan anak-anak Harun
  rationale: Akhiran pronominal maskulin tunggal pada וּבָנָיו paling wajar merujuk kepada Harun. Pengulangan nama dalam bahasa Indonesia mencegah ambiguitas rujukan.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  choice: menjalankan tugas penjagaan tempat kudus
  rationale: Konstruksi serumpun שֹׁמְרִים מִשְׁמֶרֶת menyatakan pelaksanaan tanggung jawab menjaga; terjemahan ini mempertahankan unsur tugas dan penjagaan.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: bagi bani Israel
  rationale: Ungkapan ringkas ini mempertahankan hubungan tugas tersebut dengan Israel tanpa memaksakan apakah nuansanya terutama perwakilan, kewajiban, atau manfaat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan Indonesia yang mapan untuk sebutan kolektif keturunan/persekutuan Israel dan tetap dekat dengan bentuk familial Ibrani.
- source_word: וְהַזָּר
  choice: orang yang tidak berwenang
  rationale: Dalam konteks hukum tempat kudus, זָר menunjuk kepada orang yang tidak memiliki kewenangan untuk mendekati pelayanan kudus, bukan khusus orang asing secara etnis.
- source_word: הַקָּרֵב
  choice: yang mendekat
  rationale: Menerjemahkan partisipel secara langsung dan mempertahankan gagasan mendekati wilayah atau pelayanan kudus.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal menyatakan hukuman mati yang dikenakan, bukan sekadar bahwa orang itu akan mati.
theological_decisions:
- issue: Rujukan akhiran 'anak-anaknya'
  choice: '''Anak-anak Harun'''
  alternative: '''Anak-anaknya'' dengan rujukan yang dibiarkan tersirat, atau keturunan Musa dan Harun bersama-sama'
  rationale: Akhiran tunggal sesudah nama Harun paling alami merujuk kepada Harun, dan tugas keimaman dalam konteks ini dijalankan oleh Harun beserta anak-anaknya.
- issue: Makna זָר dalam hukum tempat kudus
  choice: Orang yang tidak berwenang mendekati pelayanan kudus
  alternative: Orang asing secara etnis atau orang asing dalam pengertian sosial umum
  rationale: Konteks terdekat membahas kewenangan dan tugas di Kemah Suci, sehingga batasannya bersifat kultis, bukan etnis.
- issue: Hubungan tugas penjagaan dengan bani Israel
  choice: Diterjemahkan secara terbuka sebagai 'bagi bani Israel'
  alternative: '''Mewakili bani Israel'' atau ''untuk memenuhi kewajiban bani Israel'''
  rationale: Preposisi dan pengulangan מִשְׁמֶרֶת memungkinkan nuansa manfaat, perwakilan, atau kewajiban; rumusan ini tidak menutup ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Nama 'Kemah Suci' dan 'Kemah Pertemuan' dibedakan, susunan arah Ibrani dipertahankan tanpa pengulangan yang kaku, dan hubungan tugas penjagaan dengan bani Israel sengaja tidak dijelaskan secara berlebihan.
