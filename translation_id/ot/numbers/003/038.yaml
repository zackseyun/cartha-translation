  naturalness: Bahasa draft umumnya baku dan jelas. 'Bani Israel' cenderung bercorak lama dan kurang alami dalam bahasa Indonesia standar modern; 'orang Israel' lebih lazim. Kalimat tentang penjagaan juga dapat dibuat lebih langsung dan mengalir.
  terminology: '''Kemah Suci'' untuk מִשְׁכָּן dan ''Kemah Pertemuan'' untuk אֹהֶל מוֹעֵד dibedakan dengan baik. ''Tempat kudus'' dan ''orang yang tidak berwenang'' akurat dalam konteks kultis; catatan b dengan tepat menolak pembacaan etnis bagi זָר.'
