id: NUM.32.11
reference: Numbers 32:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: id
  text: Tidak seorang pun dari antara laki-laki yang keluar dari Mesir, yang berumur dua puluh tahun ke atas, akan melihat negeri[a] yang telah Kujanjikan dengan sumpah kepada Abraham, Ishak, dan Yakub, sebab mereka tidak mengikuti Aku sepenuhnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani secara harfiah memakai rumusan sumpah dengan kata “jika”: “jika laki-laki itu ... akan melihat negeri itu.” Dalam konteks ini rumusan tersebut menyiratkan penyangkalan yang tegas.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ini adalah idiom Ibrani yang berarti “mereka tidak mengikuti Aku secara penuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Tidak seorang pun ... akan
  rationale: Dalam konteks sumpah, אִם membuka rumusan sumpah eliptis yang menyiratkan penyangkalan tegas. Ungkapan ini disampaikan secara idiomatis dalam bahasa Indonesia tanpa mempertahankan kata 'jika' yang dapat mengaburkan maksud.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Dalam konteks ini istilah maskulin jamak menunjuk kelompok laki-laki usia sensus; 'orang-orang' alami dalam bahasa Indonesia, sedangkan batas umur dan konteks memperjelas kelompok yang dimaksud.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: yang telah keluar dari Mesir
  rationale: Secara harfiah berarti 'yang naik dari Mesir', tetapi 'keluar dari Mesir' merupakan ungkapan Indonesia yang alami untuk peristiwa eksodus tanpa mengubah acuannya.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Menyampaikan rumusan ambang usia Ibrani secara tepat dan wajar dalam bahasa Indonesia modern.
- source_word: יִרְאוּ
  choice: akan melihat
  rationale: Mempertahankan verba 'melihat', yang dalam konteks ini mencakup mengalami atau memasuki negeri itu, tanpa mempersempit maknanya dalam teks utama.
- source_word: הָאֲדָמָה
  choice: negeri
  rationale: Dalam konteks janji kepada para leluhur, kata ini menunjuk wilayah yang dijanjikan, bukan sekadar tanah atau permukaan tanah.
- source_word: נִשְׁבַּעְתִּי
  choice: telah Kujanjikan dengan sumpah
  rationale: Menampilkan unsur sumpah ilahi dengan jelas dan alami; 'bersumpah kepada negeri' tidak idiomatis, sehingga hubungan datif dengan para leluhur dinyatakan secara wajar.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kepada Abraham, Ishak, dan Yakub
  rationale: Mempertahankan ketiga penerima janji perjanjian dengan susunan formal yang alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Menunjukkan alasan bagi keputusan dalam sumpah tersebut.
- source_word: לֹא מִלְאוּ אַחֲרָי
  choice: mereka tidak mengikuti Aku dengan sepenuh hati
  rationale: Idiom harfiahnya berkaitan dengan 'memenuhi sesudah Aku' dan bermakna mengikuti sepenuhnya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gagasan pengikutan yang utuh.
theological_decisions:
- issue: Rumusan sumpah eliptis yang diawali אִם
  choice: Tidak seorang pun ... akan melihat
  alternative: Jika orang-orang itu ... akan melihat
  rationale: Dalam sumpah Ibrani, syarat yang tidak diselesaikan berfungsi sebagai penyangkalan yang sangat tegas. Terjemahan utama menyampaikan daya sumpah itu, sementara catatan kaki mencatat bentuk harfiahnya.
- issue: Cakupan idiom לֹא מִלְאוּ אַחֲרָי
  choice: tidak mengikuti Aku dengan sepenuh hati
  alternative: tidak mengikuti Aku sepenuhnya
  rationale: Pilihan ini mempertahankan citra mengikuti Tuhan dan tuntutan keutuhan tanggapan, tanpa mengubahnya menjadi kategori doktrinal abstrak.
- issue: Makna 'melihat negeri'
  choice: akan melihat negeri
  alternative: akan memasuki atau memiliki negeri
  rationale: Terjemahan mempertahankan ungkapan sumber dan tidak secara diam-diam membatasi ketegangan semantis antara melihat, mengalami, dan memasuki negeri itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pada pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Rumusan sumpah dibuat idiomatis, sedangkan bentuk Ibraninya dipertahankan dalam catatan kaki.
