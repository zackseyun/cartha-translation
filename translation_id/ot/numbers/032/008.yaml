translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Kapitalisasi 'Aku' dipakai bagi pembicara ilahi sesuai konvensi umum Alkitab bahasa Indonesia. Susunan kalimat mempertahankan perbandingan dengan tindakan generasi terdahulu dan tidak mempersempit arti לִרְאוֹת dalam teks utama.
