  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: id
  text: Demikianlah yang dilakukan bapa-bapamu ketika Aku mengutus mereka dari Kadesh-Barnea untuk melihat negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meninjau” atau “mengintai negeri itu.” Kata kerja Ibraninya secara harfiah berarti “melihat”, tetapi dalam konteks ini menunjuk pada kegiatan menjelajahi negeri tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Begitulah
  rationale: Menunjukkan bahwa tindakan generasi terdahulu menjadi pembanding bagi keadaan sekarang; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya demonstratifnya.
- source_word: עָשׂוּ
  choice: yang dilakukan
  rationale: Menerjemahkan tindakan lampau secara langsung dan menyatu secara idiomatis dengan pembuka 'Begitulah'.
- source_word: אֲבֹתֵיכֶם
  choice: leluhurmu
  rationale: Dalam konteks, ungkapan ini menunjuk kepada generasi terdahulu yang menjadi asal komunitas yang sedang disapa. 'Leluhurmu' lebih alami daripada 'bapa-bapamu' dalam bahasa Indonesia modern tanpa menghilangkan hubungan antargenerasi; akhiran tunggal '-mu' sesuai dengan sapaan kolektif Indonesia.
- source_word: בְּשָׁלְחִי
  choice: ketika Aku mengutus
  rationale: Preposisi ב dengan infinitif konstruk dan sufiks orang pertama tunggal berfungsi temporal. 'Mengutus' sesuai untuk pengiriman orang dengan suatu tugas.
- source_word: אֹתָם
  choice: mereka
  rationale: Kata ganti objek ini merujuk kepada generasi terdahulu yang baru disebut.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: dari Kadesh-Barnea
  rationale: Nama tempat ditransliterasikan, dengan tanda hubung untuk mencerminkan nama majemuk.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Mempertahankan arti dasar verba ראה, 'melihat', sementara nuansa menjelajahi atau mengintai dijelaskan dalam catatan kaki agar teks utama tidak menjadi lebih spesifik daripada sumber.
- source_word: אֶת הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks geografis ini, 'negeri' lebih alami daripada 'tanah', sedangkan 'itu' menyampaikan ketakrifan dan rujukan kepada negeri yang telah diketahui dalam wacana.
