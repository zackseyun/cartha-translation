  terminology: ‘Umat Israel’, ‘Yahweh’, ‘hamba-hambamu’, dan ‘ternak’ sesuai register dan makna konteks. Catatan kaki asli ‘negeri peternakan’ tidak merupakan padanan alternatif yang jelas untuk אֶרֶץ מִקְנֶה; ‘tanah untuk ternak’ menyatakan alternatif itu dengan lebih setia.
