  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: id
  text: Tanah yang Yahweh pukul di hadapan umat Israel adalah tanah yang cocok untuk ternak[a], dan hamba-hambamu mempunyai ternak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanah untuk ternak.” Istilah Ibrani yang dipakai mencakup ternak secara umum, bukan hanya sapi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: Negeri
  rationale: Dalam konteks wilayah geografis yang telah ditaklukkan, אֶרֶץ secara alami diterjemahkan sebagai “negeri” dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini memperkenalkan klausa yang menerangkan negeri tersebut.
- source_word: הִכָּה
  choice: dipukul
  rationale: Bentuk hiphil dari נכה menyatakan tindakan memukul atau mengalahkan. “Dipukul” mempertahankan metafora militer teks Ibrani tanpa mempersempitnya menjadi “dikalahkan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini menunjukkan bahwa tindakan Yahweh berlangsung di depan atau dalam kesaksian umat Israel.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: umat Israel
  rationale: עֵדָה menunjuk pada komunitas Israel secara kolektif. “Umat” alami dan bermartabat dalam bahasa Indonesia; alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: אֶרֶץ מִקְנֶה
  choice: negeri yang cocok untuk ternak
  rationale: Gabungan ini menggambarkan negeri yang sesuai bagi pemeliharaan ternak, bukan negeri yang terdiri dari atau hanya memiliki ternak.
- source_word: הִוא
  choice: itu adalah
  rationale: Pronomina mandiri berfungsi sebagai unsur kopulatif dengan penekanan ringan; “itu adalah” mempertahankan rujukan kepada negeri tadi.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: dan hamba-hambamu mempunyai ternak
  rationale: Konstruksi dengan ל menyatakan kepemilikan. “Mempunyai” mengungkapkan maknanya secara wajar sambil mempertahankan sebutan merendahkan diri para pembicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi. Bentuk “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar.
- issue: Makna tindakan Yahweh dalam הִכָּה
  choice: dipukul Yahweh
  alternative: dikalahkan Yahweh
  rationale: “Dipukul” mempertahankan keluasan dan daya metaforis verba sumber; “dikalahkan” akan secara eksplisit membatasi tindakan itu pada kemenangan militer.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan “ternak” dalam teks Ibrani. Sebutan “hamba-hambamu” mempertahankan ragam hormat para pembicara kepada Musa.
