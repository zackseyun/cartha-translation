  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: id
  text: Keturunan Makhir anak Manasye pergi ke Gilead dan merebutnya, lalu menghalau[a] orang-orang Amori[b] yang tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, verba ini berbentuk tunggal (‘lalu ia menghalau’), sesudah verba-verba sebelumnya berbentuk jamak. Bentuk itu mungkin memandang garis keturunan Makhir sebagai satu kesatuan, atau mencerminkan peralihan tekstual maupun gaya bahasa. Dalam bahasa Indonesia, bentuk verba ‘menghalau’ sendiri tidak menunjukkan tunggal atau jamak.
    reason: textual_variant
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal, ‘orang Amori’, sebagai sebutan kolektif bagi para penduduk Amori.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Bentuk naratif dari הלך secara wajar berarti ‘pergi’; teks tidak mengharuskan nuansa ‘naik’ atau ‘berbaris’.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Keturunan Makhir anak Manasye
  rationale: בני secara harfiah berarti ‘anak-anak’, tetapi dalam konteks suku dan marga dapat menunjuk kepada keturunan atau anggota garis keluarga. ‘Keturunan’ menghindari kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: גִּלְעָדָה
  choice: ke Gilead
  rationale: Akhiran penunjuk arah menyatakan gerak menuju suatu tempat; ‘ke Gilead’ adalah ungkapan Indonesia yang alami.
- source_word: וַיִּלְכְּדֻהָ
  choice: dan merebutnya
  rationale: לכד lazim dipakai untuk merebut atau menaklukkan suatu tempat. ‘Merebutnya’ mempertahankan pronomina feminin yang merujuk kepada Gilead tanpa mengulang nama tempat.
- source_word: וַיּוֹרֶשׁ
  choice: lalu menghalau
  rationale: Bentuk Hifil ירש berarti membuat pihak lain kehilangan kepemilikan atau tempat tinggal, yakni menghalau atau menyingkirkan. Bahasa Indonesia tidak menandai jumlah pada verba, sehingga ‘menghalau’ memungkinkan bentuk tunggal Ibrani tetap dicatat tanpa memaksakan subjek tunggal atau jamak dalam teks utama.
- source_word: הָאֱמֹרִי
  choice: orang-orang Amori
  rationale: Walaupun bentuk Ibraninya tunggal, nama etnis ini berfungsi secara kolektif untuk penduduk Amori. Bentuk jamak Indonesia menyampaikan makna kolektif itu dengan jelas.
- source_word: אֲשֶׁר בָּהּ
  choice: yang tinggal di sana
  rationale: Secara harfiah berarti ‘yang ada di dalamnya’. Karena acuannya adalah penduduk suatu wilayah, ‘yang tinggal di sana’ alami dan memperjelas maksud tanpa mengubah isinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. ‘Keturunan’ dipilih daripada ‘anak-anak’ agar ungkapan silsilah dipahami secara alami dalam konteks marga. Ketidakselarasan jumlah pada verba Ibrani tidak diselesaikan secara paksa karena verba Indonesia tidak menandai jumlah; persoalannya dijelaskan dalam catatan kaki.
