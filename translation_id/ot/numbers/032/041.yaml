  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: id
  text: Yair, anak Manasye, pergi dan merebut perkampungan mereka[a], lalu menamai semuanya Hawot-Yair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hawot-Yair berarti “perkampungan Yair” atau “permukiman Yair.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Yair
  rationale: Transliterasi nama pribadi Ibrani yang lazim dan sesuai dengan ejaan Indonesia.
- source_word: בֶּן מְנַשֶּׁה
  choice: anak Manasye
  rationale: Mempertahankan ungkapan harfiah 'anak Manasye'; konteks silsilah dapat mencakup keturunan, tetapi teks tidak menyatakannya secara eksplisit.
- source_word: הָלַךְ
  choice: pergi
  rationale: Padanan naratif yang langsung dan alami tanpa menambahkan arah atau tujuan yang tidak dinyatakan.
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: Dalam konteks penaklukan wilayah, kata ini menyatakan tindakan mengambil atau menguasai dengan kekuatan.
- source_word: חַוֺּתֵיהֶם
  choice: perkampungan mereka
  rationale: Menunjuk pada kelompok permukiman kecil; 'perkampungan' alami dalam bahasa Indonesia dan tetap membedakannya dari kota berbenteng.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: lalu menamainya
  rationale: Dalam konstruksi ini קרא berarti memberi nama. Bentuk tunggal kolektif '-nya' merujuk pada perkampungan-perkampungan itu secara keseluruhan.
- source_word: חַוֺּת יָאִיר
  choice: Hawot-Yair
  rationale: Nama tempat ditransliterasikan karena berfungsi sebagai toponim; makna unsur namanya dijelaskan dalam catatan kaki.
