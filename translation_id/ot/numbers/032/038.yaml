base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: id
  text: juga Nebo dan Baal-Meon (yang namanya telah diubah), serta Sibma. Lalu mereka memberi nama kepada kota-kota yang telah mereka bangun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meon
  rationale: Nama tempat majemuk ditransliterasikan dengan tanda hubung agar komponennya tetap jelas.
- source_word: מוּסַבֹּת שֵׁם
  choice: '[nama Nebo dan Baal-Meon] telah diubah (dinyatakan dalam catatan kaki)'
  rationale: Frasa partisip pasif ini menerangkan perubahan nama, kemungkinan besar nama kedua kota yang mendahuluinya. Karena penyisipannya canggung dalam kalimat Indonesia, keterangan dipertahankan melalui penanda catatan kaki pada Nebo.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang alami dalam bahasa Indonesia.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת
  choice: mereka memberi nama
  rationale: Ungkapan idiomatis Indonesia yang menyampaikan tindakan menetapkan nama.
- source_word: אֶת שְׁמוֹת הֶעָרִים
  choice: kepada kota-kota
  rationale: Secara harfiah 'nama-nama kota-kota'; susunan Indonesia ini menghindari pengulangan yang kaku tanpa mengubah makna.
- source_word: אֲשֶׁר בָּנוּ
  choice: yang telah mereka bangun
  rationale: בנה berarti 'membangun'; kata 'telah' menandai bahwa pembangunan mendahului pemberian nama tanpa mengubahnya menjadi 'membangun kembali'.
