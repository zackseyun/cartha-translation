source:
  edition: WLC
  text: וּ/מִקְנֶ֣ה רַ֗ב הָיָ֞ה לִ/בְנֵ֧י רְאוּבֵ֛ן וְ/לִ/בְנֵי גָ֖ד עָצ֣וּם מְאֹ֑ד וַ/יִּרְא֞וּ אֶת אֶ֤רֶץ יַעְזֵר֙ וְ/אֶת אֶ֣רֶץ גִּלְעָ֔ד וְ/הִנֵּ֥ה הַ/מָּק֖וֹם מְק֥וֹם מִקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: id
  text: Keturunan Ruben dan keturunan Gad[a] mempunyai ternak yang sangat banyak. Mereka melihat tanah Yaezer dan tanah Gilead, dan ternyata tempat itu cocok untuk ternak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Ruben dan anak-anak Gad.” Dalam konteks ini ungkapan tersebut menunjuk pada keturunan atau anggota suku Ruben dan Gad.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tempat itu adalah tempat untuk ternak.” Bahasa Ibrani mengulang kata “tempat” sebagai penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: ternak yang sangat banyak
  rationale: מִקְנֶה mencakup hewan ternak sebagai harta bergerak, bukan hanya sapi. Gabungan רַב dan עָצוּם מְאֹד menekankan jumlah atau kelimpahan yang luar biasa; ungkapan Indonesia ini menyampaikan penekanan tersebut secara alami.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: keturunan Ruben dan keturunan Gad
  rationale: בְּנֵי secara harfiah berarti 'anak-anak', tetapi dalam konteks ini menunjuk pada kelompok suku. 'Keturunan' mempertahankan hubungan leluhur tanpa memberi kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: וַיִּרְאוּ
  choice: Mereka melihat
  rationale: Bentuk wayyiqtol meneruskan alur narasi dengan konjungsi sederhana. Kalimat baru menghasilkan bahasa Indonesia yang wajar tanpa menambahkan hubungan waktu atau sebab yang tidak dinyatakan secara eksplisit.
- source_word: אֶרֶץ יַעְזֵר וְאֶרֶץ גִּלְעָד
  choice: tanah Yaezer dan tanah Gilead
  rationale: אֶרֶץ dapat berarti tanah, daerah, atau wilayah. 'Tanah' merupakan padanan langsung dan mempertahankan pengulangan struktur Ibrani.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: הִנֵּה menarik perhatian pada keadaan yang mereka dapati. 'Ternyata' menyampaikan daya penemuan itu secara wajar dalam narasi Indonesia modern.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: tempat itu cocok untuk ternak
  rationale: Secara harfiah bahasa Ibrani mengulang מָקוֹם, tetapi maksud idiomatisnya ialah bahwa tempat tersebut sesuai untuk memelihara ternak. Terjemahan utama dibuat alami, sedangkan pengulangan aslinya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah 'keturunan' menghindari salah pengertian biologis langsung, sedangkan 'ternak' mempertahankan cakupan luas istilah Ibrani. Tanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
