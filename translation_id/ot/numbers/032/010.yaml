  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: id
  text: 'Pada hari itu, murka Yahweh[a] menyala, dan Ia bersumpah demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; dapat juga ditransliterasikan sebagai “Yehovah”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Gabungan חרה dan אַף merupakan ungkapan tentang kemarahan yang menjadi panas atau berkobar. 'Murka ... menyala' mempertahankan metafora sumber dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan temporal yang alami dalam narasi bahasa Indonesia modern.
- source_word: וַיִּשָּׁבַע
  choice: lalu Ia bersumpah
  rationale: Bentuk Niphal dari שבע berarti bersumpah atau mengangkat sumpah. 'Bersumpah' merupakan padanan langsung dan alami; 'lalu' menyampaikan kesinambungan naratif waw.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif ini memperkenalkan isi sumpah pada ayat berikutnya. 'Kata-Nya' lebih alami daripada 'dengan mengatakan' dalam bahasa Indonesia, sambil tetap menandai pengantar ujaran langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar; catatan kaki memberi informasi tentang bentuk Ibraninya dan kemungkinan transliterasi lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa dibuat alami bagi pembaca umum, sedangkan metafora Ibrani tentang murka yang menyala dipertahankan. Huruf kapital pada 'Ia' dan akhiran '-Nya' mengikuti kebiasaan penghormatan dalam bahasa Indonesia.
