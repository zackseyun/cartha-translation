base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: id
  text: Bangunlah bagi kalian sendiri kota-kota untuk anak-anak kalian yang masih kecil dan kandang-kandang[a] untuk kawanan ternak kalian; dan lakukanlah apa yang telah keluar dari mulut kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pagar-pagar ternak.” Kata Ibrani ini menunjuk kepada tempat berpagar atau kandang bagi ternak.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, “laksanakanlah apa yang telah kalian janjikan.” Secara harfiah bahasa Ibraninya berbunyi, “lakukanlah apa yang telah keluar dari mulut kalian,” yaitu ungkapan untuk menepati perkataan yang telah diucapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ לָכֶם
  choice: Bangunlah bagi kalian sendiri
  rationale: Bentuk imperatif jamak בְּנוּ diterjemahkan sebagai perintah langsung, sedangkan לָכֶם dipertahankan dengan ungkapan refleksif-praktis “bagi kalian sendiri”.
- source_word: עָרִים לְטַפְּכֶם
  choice: kota-kota untuk anak-anak kecil kalian
  rationale: עָרִים berbentuk jamak dan dapat berarti kota atau permukiman; “kota-kota” mempertahankan padanan lazim. טַף menunjuk terutama kepada anak-anak kecil atau anggota keluarga yang masih kecil, sehingga diterjemahkan secara konkret.
- source_word: וּגְדֵרֹת לְצֹנַאֲכֶם
  choice: dan kandang-kandang untuk kawanan ternak kalian
  rationale: גְּדֵרֹת menunjuk kepada tempat berpagar bagi ternak; “kandang-kandang” alami dalam bahasa Indonesia. צֹאן adalah ternak kecil yang hidup berkawanan, khususnya domba dan kambing; “kawanan ternak” menjaga cakupan kolektifnya.
- source_word: וְהַיֹּצֵא מִפִּיכֶם תַּעֲשׂוּ
  choice: lalu lakukanlah apa yang telah keluar dari mulut kalian
  rationale: Ungkapan Ibrani dipertahankan secara dekat agar citra perkataan yang keluar dari mulut tetap terasa. Dalam konteks, ungkapan ini berarti melaksanakan ucapan atau janji yang telah disampaikan.
