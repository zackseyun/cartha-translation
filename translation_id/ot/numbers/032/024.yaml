translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang lugas dan bermartabat. Idiom Ibrani pada bagian akhir dipertahankan dalam teks utama, lalu dijelaskan dalam catatan kaki agar makna janjinya jelas tanpa menghapus gambaran asli.
