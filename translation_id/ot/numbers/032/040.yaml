  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: id
  text: Lalu Musa memberikan Gilead kepada Makhir, anak Manasye, dan Makhir menetap di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tinggal di sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Kata נָתַן dalam konteks pembagian wilayah berarti “memberikan”; pilihan ini mempertahankan daya verbal yang sederhana tanpa menambahkan nuansa administratif.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Nama tempat ini secara wajar ditulis “Gilead” dalam bahasa Indonesia; artikel Ibrani tidak perlu dinyatakan di depan nama wilayah.
- source_word: לְמָכִיר
  choice: kepada Makhir
  rationale: Preposisi לְ menandai penerima pemberian, sehingga “kepada Makhir” merupakan padanan langsung dan alami.
- source_word: בֶּן מְנַשֶּׁה
  choice: anak Manasye
  rationale: Kata בֵּן paling langsung berarti “anak”; ayat ini sendiri tidak mengharuskan perluasan menjadi “keturunan”.
- source_word: וַיֵּשֶׁב
  choice: menetap
  rationale: Dalam konteks pemberian wilayah, יָשַׁב menyatakan tinggal atau membangun kediaman di suatu tempat; “menetap” menangkap nuansa tersebut secara alami.
- source_word: בָּהּ
  choice: di sana
  rationale: Akhiran feminin tunggal mengacu pada Gilead sebagai wilayah. “Di sana” alami dalam bahasa Indonesia dan menghindari ungkapan kaku “di dalamnya”.
