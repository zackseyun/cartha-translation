  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: id
  text: Mereka naik sampai ke Lembah Eskol dan melihat negeri itu, lalu membuat tawar hati bani Israel[a] sehingga bani Israel tidak masuk ke negeri yang telah Yahweh[b] berikan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “membuat bani Israel enggan” atau “menyebabkan hati bani Israel berpaling.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi yang di sini diterjemahkan “Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Mereka naik
  rationale: Kata kerja עלה menyatakan gerak naik. Pilihan ini mempertahankan arah dalam bahasa Ibrani dan tetap alami dalam narasi perjalanan.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: sampai ke Lembah Eskol
  rationale: עַד berarti ‘sampai’, sedangkan נַחַל dapat menunjuk pada lembah aliran air atau wadi. ‘Lembah’ mudah dipahami pembaca Indonesia; nama tempat אֶשְׁכּוֹל ditransliterasikan ‘Eskol’.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: dan melihat negeri itu
  rationale: רָאָה secara langsung berarti ‘melihat’. ‘Negeri’ cocok untuk הָאָרֶץ dalam konteks wilayah yang hendak dimasuki, sedangkan ‘itu’ menandai bentuk tertentu dalam bahasa Ibrani.
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: lalu membuat hati bani Israel tawar
  rationale: Bentuk kausatif וַיָּנִיאוּ menyatakan bahwa mereka menyebabkan Israel kehilangan kemauan atau berpaling dari tindakan yang seharusnya dilakukan. Ungkapan Indonesia ‘membuat hati ... tawar’ mempertahankan gambaran ‘hati’ sebagai tekad batin dan singular kolektif dalam sumber.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: sehingga mereka tidak masuk ke negeri
  rationale: לְבִלְתִּי dengan infinitif menyatakan akibat atau pencegahan. ‘Sehingga mereka tidak masuk’ menyampaikan hubungan tersebut secara alami tanpa menentukan secara berlebihan apakah tekanannya terutama pada maksud atau hasil.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: yang telah Yahweh berikan kepada mereka
  rationale: Bentuk perfect נָתַן dipandang retrospektif dalam tuturan Musa, sehingga ‘telah ... berikan’ sesuai. Nama ilahi יְהוָה ditransliterasikan ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian YHWH. ‘Yahweh’ mempertahankan nama tersebut secara langsung, sedangkan catatan kaki memberi tahu pembaca tentang bentuk Ibraninya.
- issue: Gambaran kolektif ‘hati bani Israel’
  choice: mempertahankan ‘hati’ dalam bentuk tunggal
  alternative: membuat orang Israel kehilangan semangat
  rationale: Bahasa Ibrani memakai לֵב tunggal untuk tekad batin bangsa itu secara kolektif. Terjemahan mempertahankan gambaran dan ketegangan sumber tanpa mengubahnya menjadi uraian psikologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. ‘Bani Israel’ dipakai sebagai sebutan nasional-perjanjian yang ringkas dan masih luas dipahami. Susunan klausa mengikuti alur naratif Ibrani, sementara ‘lalu’ menyatakan kelanjutan peristiwa tanpa memasukkan pertentangan yang tidak terdapat dalam teks sumber.
