lexical_decisions:
- source_word: וְאֶת
  choice: juga / dan
  rationale: Konjungsi וְ menghubungkan nama-nama ini dengan daftar sebelumnya; אֶת adalah penanda objek langsung dan tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia.
- source_word: עַטְרֹת שׁוֹפָן
  choice: Atarot-Syofan
  rationale: Nama tempat majemuk ini ditransliterasikan menurut ejaan Indonesia; huruf שׁ diwakili oleh “sy”, dan bentuk vokal Ibrani עַטְרֹת dipertahankan sebagai “Atarot”.
- source_word: יַעְזֵר
  choice: Yaezer
  rationale: Nama tempat ini ditransliterasikan langsung dari bentuk Ibrani dengan “Y” untuk י, bukan mengikuti bentuk Inggris “Jazer”.
- source_word: יָגְבֳּהָה
  choice: Yogbeha
  rationale: Nama tempat ini ditransliterasikan dari bentuk Ibrani ke ejaan Indonesia; akhiran ה tidak perlu ditampilkan sebagai konsonan h yang terdengar.
