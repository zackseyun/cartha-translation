  text: וְ/נֹ֣בַח הָלַ֔ךְ וַ/יִּלְכֹּ֥ד אֶת קְנָ֖ת וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יִּקְרָ֧א לָ֦/ה נֹ֖בַח בִּ/שְׁמֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: id
  text: Nobah pergi dan merebut Kenat beserta desa-desanya[a], lalu menamai kota itu Nobah, menurut namanya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya,” yaitu ungkapan Ibrani untuk permukiman-permukiman kecil yang bergantung pada Kenat.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Nobah
  rationale: Nama diri orang ditransliterasikan; bentuk yang sama dipertahankan ketika menjadi nama baru bagi kota itu.
- source_word: הָלַךְ
  choice: pergi
  rationale: Dalam rangkaian narasi, verba ini menyatakan gerak secara sederhana tanpa perlu ditambah makna seperti 'berangkat'.
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: Dalam konteks penaklukan militer, לכד berarti merebut atau menaklukkan sebuah tempat; 'merebut' alami dan tepat dalam bahasa Indonesia.
- source_word: קְנָת
  choice: Kenat
  rationale: Nama tempat ditransliterasikan ke bentuk yang wajar dalam ejaan bahasa Indonesia.
- source_word: בְּנֹתֶיהָ
  choice: desa-desanya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', tetapi merupakan ungkapan bagi permukiman kecil yang bergantung pada kota utama. 'Desa-desanya' menyampaikan acuannya dengan jelas.
- source_word: וַיִּקְרָא לָהּ
  choice: lalu menamai kota itu
  rationale: Konstruksi קרא + ל menyatakan pemberian nama. 'Kota itu' memperjelas objek feminin yang dalam bahasa Indonesia tidak ditandai secara gramatikal.
- source_word: בִּשְׁמוֹ
  choice: menurut namanya sendiri
  rationale: Frasa ini menyatakan bahwa nama kota diambil dari nama Nobah; 'sendiri' memperjelas rujukan pronomina tanpa mengubah makna.
