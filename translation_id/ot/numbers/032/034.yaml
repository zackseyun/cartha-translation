  text: Keturunan Gad[b] membangun[a] Dibon, Atarot, dan Aroer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membangun kembali” atau “memperkuat” sesuai konteks; kata kerja Ibraninya sendiri hanya berarti “membangun”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Gad”; maksudnya, para anggota suku Gad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: membangun
  rationale: Kata kerja בנה secara langsung berarti ‘membangun’. Dalam konteks pendudukan kota, makna ‘membangun kembali’ atau ‘memperkuat’ mungkin tersirat, tetapi tidak dinyatakan secara khusus oleh kata Ibraninya.
- source_word: בְנֵי גָד
  choice: Keturunan Gad
  rationale: Secara harfiah berarti ‘anak-anak Gad’, tetapi dalam konteks kesukuan ungkapan ini menunjuk kepada anggota atau keturunan suku Gad. ‘Keturunan Gad’ mempertahankan citra kekerabatan Ibrani sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin melalui susunan kalimat.
- source_word: דִּיבֹן
  choice: Dibon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עֲטָרֹת
  choice: Atarot
  rationale: Nama tempat ditransliterasikan dari bentuk Ibrani dengan ejaan yang sesuai bagi pembaca bahasa Indonesia.
- source_word: עֲרֹעֵר
  choice: Aroer
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
