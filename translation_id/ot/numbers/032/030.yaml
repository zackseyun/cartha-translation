  to: Namun, jika mereka tidak menyeberang bersama kalian sebagai orang-orang bersenjata, mereka akan mendapat tanah milik di tengah-tengah kalian di tanah Kanaan.[a]
  rationale: Revisi memperbaiki idiom Indonesia untuk status bersenjata, memakai “akan” untuk konsekuensi syarat dalam teks Ibrani, dan mempertahankan makna bahwa mereka akan memperoleh kepemilikan tanah di dalam komunitas Israel di Kanaan. Ambiguitas leksikal kata kerja Niphal tetap dicatat tanpa memaksakan satu penafsiran.
