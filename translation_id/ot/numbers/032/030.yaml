review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan struktur syarat-konsekuensi, kontras pembuka, penyeberangan, dan lokasi di Kanaan. Namun, “mereka harus mendapat” memberi nuansa kewajiban yang tidak diperlukan oleh bentuk imperfect konsekuensial Ibrani; bentuk masa depan lebih dekat. Frasa חֲלוּצִים lebih tepat diterjemahkan sebagai orang-orang yang bersenjata/siap berperang daripada “dengan bersenjata.”
  naturalness: “Dengan bersenjata” tidak idiomatis dalam bahasa Indonesia baku. “Menyeberang bersama kalian sebagai orang-orang bersenjata” jelas dan alami. “Di tengah-tengah kalian” lebih langsung mencerminkan בְּתוֹכְכֶם daripada “di antara kalian,” dan tetap wajar dalam register Alkitab modern.
  terminology: “Tanah milik” sesuai untuk konteks אחז dan pembagian tanah. Catatan kaki direvisi agar alternatif “menetap” alami dalam bahasa Indonesia serta tidak menghilangkan nuansa kepemilikan yang terkandung dalam kata kerja Ibrani.
  issues:
  - severity: medium
    issue: Frasa “dengan bersenjata” tidak gramatikal/idiomatis.
    rationale: Bersenjata sudah berfungsi sebagai predikat atau keterangan keadaan; bentuk “dengan bersenjata” tidak lazim. Ibrani חֲלוּצִים menunjuk pada orang-orang yang diperlengkapi untuk berperang.
  - severity: low
    issue: “Harus mendapat” dapat memberi kesan kewajiban normatif.
    rationale: 'וְנֹאחֲזוּ adalah bentuk imperfect sebagai akibat dari syarat sebelumnya: mereka akan memperoleh atau ditempatkan dalam kepemilikan, bukan terutama perintah bahwa mereka wajib mendapatkannya.'
  - severity: low
    issue: Catatan kaki “ditempatkan sebagai pemilik tanah” kurang alami dan terlalu parafrastis.
    rationale: Alternatif “menetap” menyampaikan kemungkinan makna leksikal secara lebih wajar, sementara penjelasan mempertahankan kaitannya dengan kepemilikan.
