  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: id
  text: Namun, jika mereka tidak menyeberang bersama kalian sebagai orang-orang bersenjata, mereka akan mendapat tanah milik di tengah-tengah kalian di tanah Kanaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka akan menetap di tengah-tengah kalian di tanah Kanaan.” Kata kerja Ibrani ini dapat menunjuk pada keadaan diteguhkan dalam suatu kepemilikan, bukan hanya tindakan menerimanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Namun, jika
  rationale: Kata penghubung ini memperkenalkan syarat yang berlawanan dengan ayat sebelumnya; “Namun, jika” menyampaikan hubungan kontras itu secara wajar.
- source_word: יַעַבְרוּ
  choice: menyeberang
  rationale: Dalam konteks perjalanan dari sebelah timur Sungai Yordan menuju Kanaan, kata ini secara alami berarti menyeberang.
- source_word: חֲלוּצִים
  choice: dengan bersenjata
  rationale: Bentuk ini menggambarkan orang yang diperlengkapi atau disusun untuk berperang; pilihan ini ringkas dan sesuai dengan konteks militer pasal tersebut.
- source_word: אִתְּ/כֶם
  choice: bersama kalian
  rationale: Menunjukkan bahwa mereka harus menyertai suku-suku Israel lainnya dalam penyeberangan.
- source_word: וְ/נֹאחֲזוּ
  choice: mereka harus mendapat tanah milik
  rationale: Bentuk Nifal dalam konteks pembagian tanah menyatakan bahwa mereka memperoleh atau diteguhkan dalam suatu kepemilikan. Ungkapan ini mempertahankan hasil pasif tanpa memberi kesan bahwa mereka merebutnya sendiri.
- source_word: בְ/תֹכְ/כֶם
  choice: di antara kalian
  rationale: Menunjukkan tempat mereka memperoleh bagian bersama umat Israel di sebelah barat Sungai Yordan.
- source_word: בְּ/אֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan ungkapan geografis lengkap dari teks Ibrani.
