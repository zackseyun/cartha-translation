id: NUM.32.19
reference: Numbers 32:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: id
  text: Sebab kami tidak akan menerima milik pusaka bersama mereka di seberang Sungai Yordan dan lebih jauh lagi, karena milik pusaka kami telah menjadi bagian kami di sebelah timur Sungai Yordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena milik pusaka kami telah jatuh kepada kami di seberang Sungai Yordan, ke arah timur.”'
    reason: Mempertahankan alternatif yang lebih harfiah bagi idiom בָאָה ... אֵלֵינוּ serta kemungkinan pengungkapan spasial מֵעֵבֶר ... מִזְרָחָה.
lexical_decisions:
- source_word: נִנְחַל
  choice: menerima milik pusaka
  rationale: Bentuk Qal dari נחל dalam konteks pembagian tanah berarti menerima atau memperoleh bagian warisan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa penjatahan tanah.
- source_word: אִתָּם
  choice: bersama mereka
  rationale: Menunjukkan bahwa suku-suku tersebut tidak akan turut menerima bagian bersama suku-suku Israel lainnya.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: di seberang Sungai Yordan dan lebih jauh lagi
  rationale: Mempertahankan sudut pandang ruang dari para penutur serta unsur וָהָלְאָה, 'dan seterusnya/lebih jauh lagi'.
- source_word: בָאָה נַחֲלָתֵנוּ אֵלֵינוּ
  choice: milik pusaka kami telah menjadi bagian kami
  rationale: Secara harfiah berarti 'milik pusaka kami telah datang kepada kami', tetapi ungkapan Indonesia ini menyampaikan idiom perolehan secara wajar tanpa menyiratkan proses tertentu yang tidak dinyatakan.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: di sebelah timur Sungai Yordan
  rationale: Menjelaskan lokasi yang dimaksud secara alami dan tidak ambigu dalam bahasa Indonesia; מִזְרָחָה menentukan sisi timur.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Milik pusaka” dipilih untuk konteks pembagian tanah perjanjian; penyebutan “Sungai Yordan” menghindari ketidakjelasan bagi pembaca umum.
