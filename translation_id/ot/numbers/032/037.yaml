  text: וּ/בְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת חֶשְׁבּ֖וֹן וְ/אֶת אֶלְעָלֵ֑א וְ/אֵ֖ת קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: id
  text: Keturunan Ruben membangun Hesybon, Eleale, dan Kiryataim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: Keturunan Ruben
  rationale: Ungkapan harfiah 'anak-anak Ruben' dalam konteks suku menunjuk kepada para keturunan atau anggota suku Ruben. 'Keturunan Ruben' mempertahankan hubungan garis keturunan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בָּנוּ
  choice: membangun
  rationale: Bentuk qal perfektum dari בנה pada dasarnya berarti 'membangun'. Konteksnya mungkin mencakup pembangunan kembali atau penataan kota, tetapi teks tidak menyatakannya secara khusus.
- source_word: אֶת / וְאֶת / וְאֵת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung bahasa Ibrani tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin melalui susunan kalimat.
- source_word: חֶשְׁבּוֹן
  choice: Hesybon
  rationale: Nama tempat ditransliterasikan ke bentuk Indonesia yang mencerminkan bunyi konsonan Ibrani dan mengikuti pola ejaan nama Alkitab yang lazim.
- source_word: אֶלְעָלֵא
  choice: Eleale
  rationale: Nama tempat ditransliterasikan secara langsung dari bentuk Masoretik dengan ejaan yang wajar bagi pembaca Indonesia.
- source_word: קִרְיָתָיִם
  choice: Kiryataim
  rationale: Nama tempat ditransliterasikan dengan 'y' untuk yod dan mempertahankan unsur akhir nama Ibrani dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. 'Keturunan Ruben' dipilih daripada bentuk sangat harfiah 'anak-anak Ruben' karena dalam konteks ini ungkapan tersebut menyebut kelompok suku, bukan hanya putra langsung Ruben. Konjungsi pembuka וּ tidak diungkapkan sebagai 'Dan' karena ayat ini melanjutkan daftar secara alami dalam bahasa Indonesia.
