id: NUM.32.29
reference: Numbers 32:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: id
  text: Musa berkata kepada mereka, “Jika bani Gad dan bani Ruben menyeberangi Sungai Yordan bersama kamu—setiap orang yang bersenjata untuk berperang di hadapan Yahweh—dan negeri itu ditaklukkan di hadapan kamu, maka berikanlah tanah Gilead kepada mereka sebagai milik mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Musa berkata
  rationale: Bentuk naratif wayyiqtol diterjemahkan secara wajar dalam bahasa Indonesia; nama subjek dipertahankan tanpa menambahkan urutan waktu yang tidak wajib.
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan syarat nyata yang harus dipenuhi sebelum tanah Gilead diberikan.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: bani Gad dan bani Ruben
  rationale: ‘Bani’ merupakan ungkapan Indonesia yang ringkas dan dikenal untuk keturunan atau kelompok suku, sekaligus mempertahankan bentuk kekerabatan Ibrani.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan
  rationale: Ungkapan Indonesia alami untuk tindakan melintasi Yordan; kata ‘Sungai’ memperjelas nama geografis bagi pembaca umum.
- source_word: אִתְּכֶם
  choice: bersama kamu
  rationale: Menyatakan penyertaan secara langsung tanpa memperluas makna.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: setiap orang yang bersenjata untuk berperang
  rationale: Dalam konteks militer, חָלוּץ menunjuk orang yang diperlengkapi atau siap tempur. Rumusan ini jelas dan alami dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan ungkapan relasional-teologis Ibrani dan nama ilahi secara langsung.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: dan negeri itu ditaklukkan
  rationale: Bentuk pasif mempertahankan nifal כבש, yakni negeri tersebut dibuat takluk atau dikuasai, tanpa menyiratkan pemusnahan.
- source_word: לִפְנֵיכֶם
  choice: di hadapan kamu
  rationale: Mempertahankan idiom Ibrani yang menggambarkan negeri itu menjadi takluk seiring gerak maju Israel.
- source_word: וּנְתַתֶּם לָהֶם
  choice: maka berikanlah ... kepada mereka
  rationale: ‘Maka’ menandai akibat dari syarat sebelumnya. Bentuk imperatif Indonesia menyampaikan daya perintah dari bentuk Ibrani dalam konteks instruksi Musa.
- source_word: אֶרֶץ הַגִּלְעָד לַאֲחֻזָּה
  choice: tanah Gilead ... sebagai milik mereka
  rationale: אֲחֻזָּה menunjuk kepemilikan tanah yang tetap; ‘sebagai milik mereka’ menyampaikannya dengan jelas tanpa memasukkan gagasan tambahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah. ‘Yahweh’ mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Makna ‘di hadapan Yahweh’ dalam tindakan perang
  choice: Ungkapan dipertahankan tanpa penjelasan tambahan
  alternative: atas perintah Yahweh
  rationale: לִפְנֵי berarti ‘di hadapan’ dan dapat memuat nuansa kehadiran, pengawasan, atau kepemimpinan ilahi. Terjemahan tidak memilih satu penafsiran secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Bani’ mempertahankan bahasa identitas kesukuan dengan bentuk yang lazim. Tanda pisah menandai bahwa ‘setiap orang yang bersenjata untuk berperang’ menerangkan siapa dari bani Gad dan bani Ruben yang harus menyeberang, tanpa mengubah syarat utama kalimat.
