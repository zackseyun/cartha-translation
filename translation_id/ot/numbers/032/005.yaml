  text: וַ/יֹּאמְר֗וּ אִם מָצָ֤אנוּ חֵן֙ בְּ/עֵינֶ֔י/ךָ יֻתַּ֞ן אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לַ/עֲבָדֶ֖י/ךָ לַ/אֲחֻזָּ֑ה אַל תַּעֲבִרֵ֖/נוּ אֶת הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: id
  text: Mereka berkata, “Jika kami mendapat perkenanan di matamu, biarlah tanah ini diberikan kepada hamba-hambamu sebagai milik. Janganlah membawa kami menyeberangi Sungai Yordan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Janganlah membuat kami menyeberangi Sungai Yordan.” Kata kerja Ibraninya berbentuk kausatif dan dapat diterjemahkan dengan beberapa ungkapan yang maknanya berdekatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: jika kami mendapat perkenanan di matamu
  rationale: Ungkapan Ibrani ini menyatakan bahwa seseorang dipandang dengan baik. ‘Mendapat perkenanan di matamu’ mempertahankan citra ungkapan sumber sekaligus tetap jelas dalam bahasa Indonesia modern.
- source_word: יֻתַּן
  choice: biarlah ... diberikan
  rationale: Bentuk pasif ini mengungkapkan permohonan yang sopan. ‘Biarlah ... diberikan’ mempertahankan struktur permohonan tanpa mengubahnya menjadi perintah langsung.
- source_word: הָאָרֶץ הַזֹּאת
  choice: tanah ini
  rationale: Dalam konteks pembagian wilayah sebagai milik tetap, ‘tanah ini’ merupakan padanan langsung dan alami bagi אֶרֶץ.
- source_word: לַעֲבָדֶיךָ
  choice: kepada hamba-hambamu
  rationale: עבד di sini merupakan sebutan diri yang merendah dalam permohonan kepada Musa, bukan penekanan pada status perbudakan. ‘Hamba-hambamu’ mempertahankan nada hormat itu.
- source_word: לַאֲחֻזָּה
  choice: sebagai milik
  rationale: אֲחֻזָּה menunjuk pada tanah pegangan atau milik tetap. ‘Sebagai milik’ jelas dan tidak menambahkan gagasan warisan yang tidak dinyatakan secara eksplisit.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: Janganlah membawa kami menyeberangi Sungai Yordan
  rationale: Bentuk Hifil dari עבר bersifat kausatif. ‘Membawa kami menyeberangi’ menyampaikan bahwa Musa diminta untuk tidak menyebabkan atau membawa mereka menyeberang, dengan susunan yang alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘biarlah’ menjaga kesantunan permohonan, sedangkan ‘hamba-hambamu’ mempertahankan ungkapan hormat kepada Musa. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
