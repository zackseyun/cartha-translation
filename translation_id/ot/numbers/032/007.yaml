  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: id
  text: Lalu, mengapa kamu melemahkan semangat bani Israel[a] untuk menyeberang ke negeri yang telah Yahweh berikan kepada mereka?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melemahkan hati bani Israel”; maksudnya ialah melemahkan keberanian atau tekad mereka.
    reason: Menjelaskan idiom Ibrani yang diterjemahkan secara wajar sebagai “melemahkan semangat”.
lexical_decisions:
- source_word: וְלָמָּה
  choice: Jadi, mengapa
  rationale: Kata penghubung וְ mengaitkan pertanyaan ini dengan teguran sebelumnya; “jadi” menyampaikan hubungan wacana itu secara alami dalam bahasa Indonesia.
- source_word: תנואון אֶת־לֵב
  choice: mematahkan semangat
  rationale: Ungkapan kausatif dengan “hati” menunjuk pada tindakan melemahkan keberanian atau tekad. “Mematahkan semangat” menyampaikan makna idiomatisnya dengan jelas, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” mempertahankan ungkapan kekeluargaan-nasional Ibrani secara ringkas dan tetap lazim dipahami dalam ragam bahasa Indonesia yang bermartabat.
- source_word: מֵעֲבֹר
  choice: sehingga mereka tidak menyeberang
  rationale: Preposisi מִן dengan infinitif menyatakan akibat berupa pencegahan. Bentuk ini mengungkapkan bahwa semangat mereka dilemahkan sehingga mereka enggan atau gagal menyeberang.
- source_word: אֶל־הָאָרֶץ
  choice: ke negeri
  rationale: “Ke negeri” secara alami menyatakan gerak menuju dan memasuki wilayah yang dijanjikan.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: yang telah ... berikan kepada mereka
  rationale: Bentuk perfektif dipahami sebagai pemberian ilahi yang sudah ditetapkan dan tetap berlaku; “telah ... berikan” mempertahankan relevansi kini tanpa menambah tafsiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Ungkapan antropologis “hati” sebagai pusat keberanian dan tekad
  choice: mematahkan semangat
  alternative: melemahkan hati
  rationale: Pilihan utama menyampaikan daya ungkap idiom Ibrani secara alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk dan cakupan gambaran aslinya.
- issue: Hubungan sintaksis מֵעֲבֹר dengan tindakan melemahkan semangat
  choice: sehingga mereka tidak menyeberang
  alternative: menghalangi mereka untuk menyeberang
  rationale: Pilihan ini mempertahankan fokus pada dampak psikologis terhadap bani Israel dan tidak mempersempit tindakan itu menjadi hambatan fisik langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Bani Israel” mempertahankan corak kekeluargaan-nasional teks Ibrani, sedangkan “mematahkan semangat” menghindari ungkapan harfiah yang kurang alami tanpa menutupi metafora sumber karena metafora itu dijelaskan dalam catatan kaki.
