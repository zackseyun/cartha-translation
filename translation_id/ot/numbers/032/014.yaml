  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: id
  text: Lihatlah, kalian telah bangkit menggantikan leluhur kalian, sebagai keturunan orang-orang berdosa[a], untuk semakin menambah murka Yahweh yang menyala-nyala[b] terhadap Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “keturunan” juga dapat berarti “pertambahan” atau kelompok yang dihasilkan; dalam konteks ini ungkapan tersebut bernada mencela.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ungkapan Ibrani berbicara tentang “nyala hidung Yahweh”, suatu ungkapan untuk kemarahan yang sangat hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan daya seru dan penekanan retoris dalam teguran Musa. Kata penghubung וְ tidak perlu diterjemahkan tersendiri karena pembukaan ini lebih alami dalam bahasa Indonesia tanpa “dan”.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: kalian telah bangkit menggantikan nenek moyang kalian
  rationale: קום mempertahankan gambaran ‘bangkit’, sedangkan תַּחַת dalam konteks pergantian generasi berarti mengambil tempat generasi sebelumnya. “Nenek moyang” menyatakan generasi para ayah yang dimaksud tanpa membatasi pada ayah kandung.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: sebagai keturunan orang-orang berdosa
  rationale: תַּרְבּוּת dapat menunjuk pada hasil pertambahan atau keturunan. “Keturunan” paling jelas menyampaikan kesinambungan generasi, sedangkan “orang-orang berdosa” mempertahankan dakwaan moral tanpa ungkapan Indonesia yang janggal.
- source_word: לִסְפּוֹת עוֹד
  choice: untuk semakin menambah
  rationale: Gabungan ini menyatakan penambahan atau peningkatan lebih lanjut atas murka yang telah ada; “semakin menambah” alami dan mempertahankan unsur intensifikasi עוֹד.
- source_word: עַל חֲרוֹן אַף
  choice: murka ... yang menyala-nyala
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan ‘nyala hidung’ dan secara idiomatis menyatakan kemarahan yang sangat hebat. Pilihan ini mempertahankan citra panas atau nyala tanpa menghasilkan bahasa Indonesia yang tidak wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל יִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dalam konstruksi dengan murka, אֶל menandai sasaran kemarahan; “terhadap” merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. Bentuk “Yahweh” menjaga perbedaan antara nama perjanjian ini dan gelar umum bagi Tuhan.
- issue: Hubungan generasi dalam תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: keturunan orang-orang berdosa
  alternative: sekumpulan orang-orang berdosa / pertambahan orang-orang berdosa
  rationale: Pilihan “keturunan” mempertahankan kaitan dengan generasi sebelumnya dan nada teguran, tetapi catatan kaki mengakui rentang makna nomina Ibrani yang jarang ini tanpa memaksakan satu nuansa sebagai satu-satunya kemungkinan.
- issue: Rujukan manusia dalam אֲנָשִׁים
  choice: orang-orang
  alternative: laki-laki
  rationale: אֲנָשִׁים dapat berarti para laki-laki atau orang-orang menurut konteks. Bahasa Indonesia “orang-orang” alami dalam frasa ini dan tidak mengubah pokok dakwaan; konteks tetap menunjukkan kelompok yang sedang Musa tegur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian”, sesuai dengan kelompok yang ditegur. Nada dibuat tegas dan khidmat tanpa memakai ungkapan kuno. Susunan kalimat mempertahankan seruan pembuka, pergantian generasi, tujuan yang dituduhkan, serta gambaran murka yang menyala.
