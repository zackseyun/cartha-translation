  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: id
  text: Lalu bani Gad dan bani Ruben berkata kepada Musa, “Hamba-hambamu akan melakukan seperti yang tuanku perintahkan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: bani Gad dan bani Ruben
  rationale: Dalam konteks kelompok suku, בְּנֵי paling alami diterjemahkan dengan istilah Indonesia yang lazim dalam bahasa Alkitab, yaitu “bani,” bukan semata-mata anak laki-laki biologis.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Sesudah verba “berkata,” bentuk pengantar kutipan Ibrani ini bersifat formulaik; penghilangan “dengan berkata” menghasilkan bahasa Indonesia yang alami tanpa kehilangan isi.
- source_word: עֲבָדֶיךָ
  choice: Hamba-hambamu
  rationale: Bentuk jamak dengan akhiran orang kedua tunggal dipertahankan dan menyatakan kerendahan diri para pembicara di hadapan Musa.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti yang
  rationale: Menegaskan kesesuaian tindakan mereka dengan perintah Musa, sejalan dengan fungsi komparatif ungkapan sumber.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat orang pertama kepada Musa, bukan nama atau gelar ilahi; huruf kecil menjaga pembedaan itu.
- source_word: מְצַוֶּה
  choice: perintahkan
  rationale: Partisip Ibrani menyajikan tindakan memerintah dalam konteks kini; bahasa Indonesia idiomatis cukup menyatakannya dengan verba “perintahkan”.
theological_decisions:
- issue: Rujukan אֲדֹנִי
  choice: 'Dipahami sebagai sapaan kepada Musa: “tuanku.”'
  alternative: “Tuhanku” atau sebutan ilahi
  rationale: Konteks sintaksis dan dialog menunjukkan bahwa Musa adalah lawan bicara; bentuk ini merupakan sapaan hormat, bukan rujukan kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah “bani” dipertahankan karena secara ringkas dan lazim menunjuk kelompok keturunan/suku. Formula לֵאמֹר tidak ditiru secara kaku agar kutipan langsung terdengar alami.
