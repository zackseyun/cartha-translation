  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: id
  text: kecuali Kaleb anak Yefune, orang Kenas, dan Yosua anak Nun, sebab mereka mengikuti Yahweh dengan sepenuh hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berbunyi “memenuhi sesudah Yahweh”; maksudnya ialah mengikuti-Nya sepenuhnya atau dengan kesetiaan penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: kecuali
  rationale: Partikel ini memperkenalkan Kaleb dan Yosua sebagai satu-satunya pengecualian dari hukuman yang disebut sebelumnya.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Kaleb anak Yefune
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan בֶּן diterjemahkan sebagai 'anak' dalam hubungan silsilah.
- source_word: הַקְּנִזִּי
  choice: orang Kenas itu
  rationale: Bentuk nisbah ini menunjukkan hubungan Kaleb dengan Kenas, kemungkinan sebagai sebutan kaum atau garis keturunan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan lebih jauh sifat hubungan tersebut.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: dan Yosua anak Nun
  rationale: Konjungsi menghubungkan pengecualian kedua; nama-nama memakai bentuk Indonesia yang lazim.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי menyatakan alasan Kaleb dan Yosua dikecualikan.
- source_word: מִלְאוּ אַחֲרֵי
  choice: mengikuti ... dengan sepenuh hati
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'memenuhi sesudah' menyatakan kesetiaan penuh dalam mengikuti; terjemahan idiomatis ini jelas dan alami tanpa mengubahnya menjadi sekadar ketaatan umum.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi tersebut.
- issue: Makna kesetiaan dalam מִלְאוּ אַחֲרֵי
  choice: mengikuti Yahweh dengan sepenuh hati
  alternative: mengikuti Yahweh sepenuhnya
  rationale: Pilihan ini menyampaikan kelengkapan dan ketulusan loyalitas yang terkandung dalam idiom Ibrani, tanpa mempersempitnya menjadi konsep doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ayat diawali huruf kecil karena secara sintaksis melanjutkan kalimat dari ayat sebelumnya. Sebutan 'orang Kenas itu' mempertahankan penanda nisbah tanpa memaksakan apakah hubungan tersebut terutama bersifat etnis atau garis keturunan.
