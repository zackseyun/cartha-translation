  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: id
  text: Kami sendiri akan menyeberang sebagai orang-orang bersenjata di hadapan Yahweh ke tanah Kanaan, dan kami akan memiliki tanah warisan di seberang Sungai Yordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sebelah sini Sungai Yordan” atau “di sisi lain Sungai Yordan.” Ungkapan Ibrani ini bergantung pada sudut pandang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחְנוּ
  choice: Kami sendiri
  rationale: Kata ganti mandiri ini memberi penekanan tambahan pada pelaku jamak; “kami sendiri” mempertahankan penekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: נַעֲבֹר
  choice: akan menyeberang
  rationale: Bentuk imperfek orang pertama jamak dari עבר menyatakan komitmen untuk menyeberangi Sungai Yordan pada waktu mendatang.
- source_word: חֲלוּצִים
  choice: dengan bersenjata
  rationale: Dalam konteks militer, kata ini menunjuk pada keadaan siap dan diperlengkapi untuk berperang; “dengan bersenjata” ringkas dan jelas.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי memiliki arti spasial-relasional “di hadapan”, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: אֶרֶץ כְּנָעַן
  choice: menuju tanah Kanaan
  rationale: Walaupun tidak ada preposisi tersurat sebelum frasa ini, verba gerak menuntut ungkapan tujuan yang alami dalam bahasa Indonesia; “menuju” tidak melebihkan gagasan masuk ke dalam wilayah itu.
- source_word: וְאִתָּנוּ
  choice: akan tetap menjadi milik kami
  rationale: Klausa Ibrani ini tidak memiliki verba tersurat. Penambahan “akan tetap menjadi milik kami” mengungkapkan hubungan kepemilikan dan kesinambungan yang tersirat dalam ikrar tersebut.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: tanah milik yang menjadi warisan kami
  rationale: 'Ungkapan ini mempertahankan kedua unsur rangkaian konstruksi: milik atau pegangan tetap (אֲחֻזָּה) dan warisan turun-temurun (נַחֲלָה), sambil terdengar wajar dalam bahasa Indonesia.'
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: di sebelah sini Sungai Yordan
  rationale: Ungkapan tersebut bergantung pada sudut pandang. Dalam konteks ini para penutur berada di sebelah timur Yordan dan meminta wilayah itu sebagai warisan, sehingga “di sebelah sini” menyampaikan perspektif mereka; alternatif harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian yang dinyatakan dalam teks tanpa menggantinya dengan gelar.
- issue: Makna לִפְנֵי יְהוָה dalam ikrar militer
  choice: di hadapan Yahweh
  alternative: di depan Yahweh; dalam hadirat Yahweh
  rationale: Terjemahan ini mempertahankan kemungkinan unsur spasial sekaligus relasional-perjanjian tanpa menentukan bahwa frasa itu hanya berarti urutan barisan atau semata-mata kehadiran rohani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Susunan kalimat mempertahankan penekanan “kami sendiri”, kesiapan militer, nama ilahi, dan ketegangan perspektif dalam ungkapan geografis. “Tanah milik yang menjadi warisan kami” dipilih agar dua unsur semantis dalam rangkaian Ibrani tidak dilebur menjadi satu.
