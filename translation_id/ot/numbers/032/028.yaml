  text: וַ/יְצַ֤ו לָ/הֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֵ֖ת יְהוֹשֻׁ֣עַ בִּן נ֑וּן וְ/אֶת רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: id
  text: Lalu Musa memberi perintah mengenai mereka[a] kepada Imam Eleazar, Yosua anak Nun, dan para kepala kaum leluhur dari suku-suku bani Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lalu Musa memerintahkan mereka, yaitu Imam Eleazar ...” Dalam pembacaan ini, “mereka” menunjuk kepada para pemimpin yang disebut dalam ayat ini, bukan kepada orang-orang dari suku-suku yang disebut sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “para kepala [kelompok] leluhur dari suku-suku bani Israel,” suatu ungkapan administratif bagi para pemimpin kelompok-kelompok leluhur dan suku-suku Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: memberikan perintah
  rationale: Bentuk verba צוה menyatakan tindakan memerintah dengan kewenangan. Ungkapan ini alami dalam bahasa Indonesia dan cocok dengan konteks administratif.
- source_word: לָהֶם
  choice: mengenai mereka
  rationale: Pronomina ini paling mungkin menunjuk kembali kepada orang Ruben dan orang Gad, sedangkan para pemimpin yang disebut sesudahnya merupakan penerima perintah. Terjemahan ini mempertahankan acuan tersebut tanpa menutupi kemungkinan sintaksis lain.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: kepada Imam Eleazar
  rationale: Penanda objek אֵת memperkenalkan orang yang diperintahkan. Dengan konstruksi 'memberikan perintah', bahasa Indonesia secara alami memakai 'kepada'.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua anak Nun
  rationale: Memakai bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan menerjemahkan patronimik Ibrani secara ringkas.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: para kepala kaum dalam suku-suku
  rationale: Ungkapan administratif yang padat ini merujuk kepada para pemimpin kelompok leluhur atau kaum dalam tatanan suku. 'Kepala kaum' lebih mudah dipahami daripada terjemahan harfiah 'kepala para leluhur'.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: Israel
  rationale: Dalam konteks struktur kesukuan, idiom 'anak-anak Israel' menunjuk kepada bangsa Israel. Bentuk ringkas ini alami dan tidak mengubah cakupan acuannya.
theological_decisions:
- issue: Acuan לָהֶם dan hubungannya dengan orang-orang yang disebut sesudahnya
  choice: mengenai mereka
  alternative: kepada mereka
  rationale: Konteks terdekat mendukung pemahaman bahwa Musa memberi para pemimpin petunjuk mengenai suku Ruben dan Gad. Namun, bentuk Ibraninya secara gramatikal juga dapat dibaca sebagai 'kepada mereka', sehingga alternatif itu dicatat dalam catatan kaki dan tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Imam Eleazar' mengikuti susunan gelar yang alami dalam bahasa Indonesia. Struktur kalimat mempertahankan sifat resmi perintah Musa, sedangkan istilah administratif yang padat dijelaskan melalui catatan kaki.
