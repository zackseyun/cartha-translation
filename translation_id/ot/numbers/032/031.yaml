  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: id
  text: Lalu bani Gad dan bani Ruben menjawab, “Apa yang telah Yahweh firmankan kepada hamba-hambamu, itulah yang akan kami lakukan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: menjawab
  rationale: Bentuk wayyiqtol dari ענה dalam narasi memperkenalkan tanggapan lisan; “menjawab” merupakan padanan langsung dan alami.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: bani Gad dan bani Ruben
  rationale: “Bani” mempertahankan ungkapan kekerabatan בְּנֵי sekaligus menjadi sebutan kolektif yang lazim dan ringkas dalam bahasa Indonesia Alkitabiah.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Fungsinya sebagai pengantar ujaran sudah terwakili secara alami oleh verba “menjawab” dan tanda petik; menerjemahkannya sebagai “dengan berkata” akan terasa berlebihan dalam bahasa Indonesia modern.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: Apa yang ... itulah yang
  rationale: Konstruksi korelatif ini secara alami menyatakan bahwa tindakan mereka akan sesuai dengan firman Yahweh; susunan “apa yang ... itulah yang” juga mempertahankan objek eksplisit dari אֵת אֲשֶׁר.
- source_word: דִּבֶּר
  choice: telah ... firmankan
  rationale: Bentuk perfektum menunjuk pada perkataan Yahweh yang sudah disampaikan dan masih berlaku. “Berfirman” sesuai dengan subjek ilahi tanpa mengubah isi tindakan berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi dipertahankan melalui transliterasi, bukan diganti dengan gelar.
- source_word: אֶל עֲבָדֶיךָ
  choice: kepada hamba-hambamu
  rationale: Para penutur menyebut diri mereka secara rendah hati di hadapan Musa. “Hamba” menangkap sapaan hormat kontekstual tanpa menonjolkan arti “budak”.
- source_word: נַעֲשֶׂה
  choice: akan kami lakukan
  rationale: Padanan langsung untuk verba עשה dalam bentuk orang pertama jamak; penempatan “kami” mempertahankan kontras penutur dan lawan bicara secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Bani” dipakai untuk mempertahankan bentuk kekerabatan kolektif Ibrani, sedangkan formula harfiah לֵאמֹר tidak ditampilkan tersendiri agar dialog tetap alami. Tidak diperlukan catatan kaki karena konstruksi korelatif Ibrani dapat diwakili dengan jelas dalam teks utama.
