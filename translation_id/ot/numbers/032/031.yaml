  source_fidelity: 'Teks secara setia menerjemahkan unsur-unsur utama Ibrani: kedua kelompok disebut terpisah, jawaban mereka diperkenalkan dengan tepat, nama ilahi יהוה dipertahankan sebagai “Yahweh,” sebutan merendahkan diri “hamba-hambamu” dipertahankan dalam bentuk jamak, dan komitmen melakukan apa yang telah difirmankan dinyatakan jelas. Korelasi אֵת אֲשֶׁר ... כֵּן diungkapkan dengan baik melalui “Apa yang ... itulah yang ...”.'
