base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/002.yaml
  text: Then the sons of Gad and the sons of Reuben came and spoke to Moses, to Eleazar the priest, and to the leaders of the congregation, saying,
translation:
  language: id
  text: Kemudian keturunan Gad dan keturunan Ruben datang dan berkata kepada Musa, Imam Eleazar, dan para pemimpin umat itu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי גָד / בְנֵי רְאוּבֵן
  choice: keturunan Gad / keturunan Ruben
  rationale: Dalam konteks suku Israel, בְּנֵי menunjuk kepada kelompok keturunan atau anggota suku, bukan hanya anak laki-laki langsung.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: berkata ...
  rationale: Rangkaian formula ini secara alami mengantar tuturan langsung dalam bahasa Indonesia. Satu bentuk 'berkata' cukup untuk menyampaikan fungsinya tanpa pengulangan yang kaku.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Gelar ini melekat pada nama Eleazar; susunan 'Imam Eleazar' alami dan jelas dalam bahasa Indonesia.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: para pemimpin umat itu
  rationale: נְשִׂיאִים berarti para kepala atau pemimpin, sedangkan הָעֵדָה di sini adalah umat Israel sebagai perhimpunan.
