  source_fidelity: 'Terjemahan secara akurat mencerminkan unsur-unsur utama Ibrani: mereka mendekat kepada Musa, berbicara, berniat membangun kandang bagi ternak di tempat itu, serta kota-kota bagi anak-anak mereka. Penyebutan eksplisit “Musa” wajar karena anteseden אֵלָיו jelas dalam konteks langsung dan tidak mengubah makna.'
