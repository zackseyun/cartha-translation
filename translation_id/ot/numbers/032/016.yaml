  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: id
  text: Lalu mereka mendekati Musa dan berkata, “Kami akan membangun kandang-kandang domba di sini untuk ternak kami dan kota-kota untuk anak-anak kami.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak kecil kami” atau “orang-orang yang menjadi tanggungan kami.” Kata Ibrani טַף menunjuk kepada anak-anak kecil atau para tanggungan, khususnya anggota komunitas yang rentan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: mereka mendekati Musa
  rationale: Verba נגשׁ menyatakan gerakan mendekat. Nama “Musa” dipakai sebagai acuan alami dalam bahasa Indonesia karena pronomina Ibrani berarti “kepadanya” dan mengacu kepada Musa dalam konteks.
- source_word: וַיֹּאמְרוּ
  choice: dan berkata
  rationale: Bentuk naratif ini memperkenalkan perkataan langsung dan diterjemahkan dengan urutan yang wajar dalam bahasa Indonesia.
- source_word: גִּדְרֹת צֹאן
  choice: kandang-kandang domba
  rationale: Frasa konstruksi ini menunjuk pada tempat berpagar untuk kawanan domba; pilihan ini jelas dan lazim bagi pembaca Indonesia.
- source_word: נִבְנֶה
  choice: kami akan membangun
  rationale: Bentuk imperfek orang pertama jamak dalam konteks ini mengungkapkan niat atau rencana mereka.
- source_word: לְמִקְנֵנוּ
  choice: untuk ternak kami
  rationale: מִקְנֶה mencakup hewan ternak secara umum, bukan hanya sapi.
- source_word: פֹּה
  choice: di sini
  rationale: Padanan langsung dan alami bagi adverbia tempat ini.
- source_word: וְעָרִים
  choice: dan kota-kota
  rationale: עָרִים secara leksikal berarti kota-kota, meskipun dalam konteks kuno ukurannya dapat lebih kecil daripada kota modern.
- source_word: לְטַפֵּנוּ
  choice: untuk anak-anak kami
  rationale: טַף menunjuk kepada anak-anak kecil atau anggota keluarga yang menjadi tanggungan. “Anak-anak” paling alami dalam teks utama, sementara cakupan nuansanya dijelaskan dalam catatan kaki.
