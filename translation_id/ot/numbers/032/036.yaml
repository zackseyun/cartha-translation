  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: id
  text: serta Bet-Nimra dan Bet-Haran, kota-kota berbenteng[a], dan kandang-kandang domba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kota-kota pertahanan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tempat-tempat berpagar untuk kawanan ternak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Bet-Nimra
  rationale: Nama tempat ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; unsur בֵּית dipertahankan sebagai bagian nama, bukan diterjemahkan menjadi 'rumah'.
- source_word: בֵּית הָרָן
  choice: Bet-Haran
  rationale: Nama kota ditransliterasikan, karena frasa ini berfungsi sebagai toponim dan bukan sekadar ungkapan 'rumah Haran'.
- source_word: עָרֵי מִבְצָר
  choice: kota-kota berbenteng
  rationale: Ungkapan konstruksi ini secara harfiah menunjuk pada kota-kota dengan pertahanan; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan nuansa militernya.
- source_word: גִדְרֹת צֹאן
  choice: kandang-kandang domba
  rationale: Frasa ini menunjuk pada tempat berpagar untuk menampung domba atau ternak kecil; bentuk jamak Ibrani dipertahankan.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: serta ... dan ... dan
  rationale: Rangkaian konjungsi melanjutkan daftar dari ayat sebelumnya. 'Serta' menandai kesinambungan itu, sedangkan penanda objek אֵת tidak diterjemahkan tersendiri.
