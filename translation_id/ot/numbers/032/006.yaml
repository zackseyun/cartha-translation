base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: id
  text: Lalu Musa berkata kepada keturunan Gad dan keturunan Ruben, “Haruskah saudara-saudaramu pergi berperang[a], sedangkan kamu tinggal di sini?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masuk ke dalam pertempuran.” Dalam bahasa Ibrani, frasa ini secara harfiah berarti “datang/masuk ke dalam perang” dan merupakan idiom untuk pergi berperang.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudaramu” mengacu pada sesama orang Israel dari suku-suku lain.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Musa berkata
  rationale: Bentuk wayyiqtol melanjutkan narasi. Konteks pertanyaan teguran mendukung penghubung kontras alami “Namun”, sementara “berkata” mempertahankan pengantar ujaran.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: kepada bani Gad dan bani Ruben
  rationale: בני secara harfiah berarti “anak-anak laki-laki/keturunan”, tetapi di sini menunjuk kelompok suku. “Bani” merupakan ungkapan Indonesia yang ringkas dan bermartabat bagi keturunan atau suku.
- source_word: הַאַחֵיכֶם
  choice: saudara-saudaramu
  rationale: Mempertahankan metafora kekerabatan Ibrani; dalam konteks, sebutan ini mengacu pada sesama orang Israel dari suku-suku lain.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: maju berperang
  rationale: Gabungan verba “datang/masuk” dengan “perang” merupakan idiom untuk memasuki konflik militer. “Maju berperang” alami dalam bahasa Indonesia dan mempertahankan gerak menuju pertempuran.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: sedangkan kamu tinggal di sini
  rationale: ישב dapat berarti duduk, menetap, atau tinggal. Di sini Musa mempertentangkan keterlibatan suku-suku lain dalam perang dengan tetap tinggalnya bani Gad dan Ruben; “sedangkan” menyatakan kontras itu secara alami tanpa menghilangkan daya teguran.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk “bani” mempertahankan corak kesukuan secara ringkas; pertanyaan retoris dan kontras tajam dalam teguran Musa dipertahankan.
