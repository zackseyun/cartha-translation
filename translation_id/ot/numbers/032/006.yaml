  to: Lalu Musa berkata kepada keturunan Gad dan keturunan Ruben, “Haruskah saudara-saudaramu pergi berperang[a], sedangkan kamu tinggal di sini?”[b]
  rationale: Revisi mengganti penghubung kontras yang tidak dinyatakan dalam teks sumber dengan penghubung naratif, memakai istilah kesukuan yang lebih lazim dalam bahasa Indonesia baku modern, dan memilih padanan idiomatis yang lebih langsung untuk ‘masuk ke dalam perang’. Letak serta rujukan kedua catatan kaki dipertahankan dan isi catatan a diperjelas.
