  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: id
  text: Tetapi jika kamu tidak berbuat demikian, sungguh, kamu telah berdosa terhadap Yahweh. Ketahuilah bahwa dosamu akan menemukanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dosamu akan mendapati kamu” atau “kesalahanmu akan menyusulmu.” Ungkapan Ibrani ini menyampaikan bahwa dosa itu pasti tersingkap dan mendatangkan akibat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Penghubung ini memperkenalkan syarat yang berlawanan dengan kewajiban dalam konteks sebelumnya; “Tetapi jika” menyampaikan fungsi tersebut secara alami.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: kamu tidak berbuat demikian
  rationale: Ungkapan ini menunjuk kembali pada tindakan yang diwajibkan dalam konteks sebelumnya dan mempertahankan bentuk jamak orang kedua tanpa menambahkan rincian.
- source_word: הִנֵּה
  choice: sungguh
  rationale: Partikel ini memberi penekanan dan nada peringatan. “Sungguh” terdengar wajar dalam bahasa Indonesia sambil mempertahankan kekhidmatan teks.
- source_word: חֲטָאתֶם
  choice: kamu berdosa
  rationale: Bentuk perfektif menyatakan akibat yang pasti terjadi jika syarat itu tidak dipenuhi. Kala tidak perlu ditandai secara eksplisit dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: terhadap Yahweh
  rationale: Dengan verba חטא, preposisi ini menandai pihak yang terhadapnya dosa dilakukan; nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: וּדְעוּ
  choice: Ketahuilah
  rationale: Imperatif jamak ini menyerukan agar para pendengar menyadari dengan pasti akibat yang disebutkan berikutnya.
- source_word: חַטַּאתְכֶם
  choice: dosamu
  rationale: Nomina ini dapat menunjuk pada dosa atau kesalahan/guilt. “Dosamu” mempertahankan kaitan langsung dengan verba “berdosa” sebelumnya dan personifikasi dalam klausa berikut.
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: akan mendapati kamu
  rationale: Terjemahan ini dekat dengan gambaran Ibrani bahwa dosa itu sendiri akan “menemukan” pelakunya, sekaligus dapat menyiratkan tersingkapnya dosa dan datangnya akibatnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Personifikasi dosa sebagai sesuatu yang mendapati pelakunya
  choice: 'Mempertahankan personifikasi: “dosamu akan mendapati kamu”'
  alternative: “dosamu akan terbongkar” atau “akibat dosamu akan menimpa kamu”
  rationale: Teks Ibrani membiarkan hubungan antara penyingkapan dosa dan akibat hukumnya tetap padat dan tidak dirinci. Personifikasi dipertahankan agar ketegangan dan keluasan maknanya tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “kamu” mempertahankan sapaan orang kedua jamak menurut konteks tanpa memakai bentuk arkais. Tanda baca memisahkan dua seruan peringatan agar kalimat tetap jelas.
