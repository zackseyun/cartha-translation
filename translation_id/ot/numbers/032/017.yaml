revisions:
- from: Tetapi kami sendiri akan segera mempersenjatai diri dan maju di depan orang Israel[a] sampai kami membawa mereka ke tempat mereka. Sementara itu, anak-anak dan tanggungan kami[b] akan tinggal di kota-kota berbenteng agar terlindung dari penduduk negeri ini.
  to: Tetapi kami sendiri akan segera mempersenjatai diri dan maju di depan orang Israel[a] sampai kami membawa mereka ke tempat mereka; anak-anak kami[b] akan tinggal di kota-kota berbenteng karena penduduk negeri itu.
  rationale: Revisi menghilangkan perluasan makna tujuan perlindungan dan deiksis tambahan, serta membatasi terjemahan utama טַף pada “anak-anak” sambil mempertahankan penjelasan nuansa kolektifnya dalam catatan. Semua jangkar catatan kaki tetap ditempatkan pada istilah yang dijelaskan.
