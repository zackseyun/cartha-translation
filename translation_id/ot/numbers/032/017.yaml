  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: id
  text: Tetapi kami sendiri akan segera mempersenjatai diri dan maju di depan orang Israel[a] sampai kami membawa mereka ke tempat mereka; anak-anak kami[b] akan tinggal di kota-kota berbenteng karena penduduk negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan anak-anak Israel”; dalam konteks ini kemungkinan berarti maju di barisan depan mereka dalam pertempuran.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini terutama menunjuk anak-anak kecil dan dapat dipakai secara kolektif bagi anak-anak dalam keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: akan mempersenjatai diri
  rationale: 'Bentuk Nifal di sini paling wajar dipahami secara refleksif atau medial: para pembicara berjanji memperlengkapi diri untuk berperang.'
- source_word: חֻשִׁים
  choice: segera
  rationale: Kata ini menyampaikan kesiapan yang tangkas atau tindakan dengan cepat. Terjemahan adverbial menghindari pengulangan dengan gagasan mempersenjatai diri pada kata sebelumnya.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: maju di depan orang Israel
  rationale: Secara harfiah berarti 'di hadapan anak-anak Israel'; dalam konteks militer, frasa ini kemungkinan menunjukkan bergerak di barisan depan. 'Orang Israel' merupakan ungkapan Indonesia yang alami dan kolektif.
- source_word: עַד אֲשֶׁר אִם
  choice: sampai
  rationale: Gabungan ini secara idiomatis menandai batas akhir tindakan dan cukup diterjemahkan secara alami dengan 'sampai'.
- source_word: הֲבִיאֹנֻם
  choice: kami membawa mereka
  rationale: Bentuk Hifil dari בוא berarti menyebabkan datang, yaitu membawa. Akhiran objek merujuk kepada orang Israel lainnya.
- source_word: אֶל מְקוֹמָם
  choice: ke tempat mereka
  rationale: Terjemahan langsung ini mempertahankan keluasan rujukan, yang dapat berarti tempat tujuan atau wilayah permukiman mereka.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: anak-anak dan tanggungan kami akan tinggal
  rationale: טף adalah kata kolektif yang terutama menunjuk anak-anak kecil, tetapi dalam konteks dapat mencakup anggota keluarga yang menjadi tanggungan. Pilihan ini mengungkapkan cakupannya tanpa membatasinya hanya pada anak kecil.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: di kota-kota berbenteng
  rationale: Frasa konstruksi ini menunjuk kota-kota yang memiliki pertahanan atau benteng; ungkapan Indonesia ini alami dan tepat.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: agar terlindung dari penduduk negeri ini
  rationale: מִפְּנֵי menyatakan ancaman atau alasan untuk berlindung. Konteks kota berbenteng mendukung pengungkapan nuansa perlindungan secara eksplisit; 'negeri ini' memperjelas deiksis yang tersirat dalam konteks ujaran.
