  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat memperjelas kontras antara kaum pria yang maju berperang dan keluarga yang tinggal dalam perlindungan, tanpa menambahkan penafsiran teologis.
