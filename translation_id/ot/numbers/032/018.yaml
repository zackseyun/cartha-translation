  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: id
  text: Kita tidak akan kembali ke rumah-rumah kita sampai setiap orang dari bani Israel memperoleh milik pusakanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: Kita tidak akan kembali
  rationale: Bentuk imperfek Qal orang pertama jamak menyatakan tindakan mendatang yang mereka janjikan tidak akan dilakukan sebelum syarat berikutnya terpenuhi.
- source_word: אֶל בָּתֵּינוּ
  choice: ke rumah kita
  rationale: Preposisi arah dan bentuk jamak bersufiks diterjemahkan secara alami dalam bahasa Indonesia; nomina kolektif tanpa pengulangan tetap mencakup rumah-rumah mereka.
- source_word: עַד
  choice: sampai
  rationale: Menandai batas waktu bagi tindakan tidak kembali.
- source_word: הִתְנַחֵל
  choice: memperoleh
  rationale: Hitpael dari נחל dalam konteks pembagian tanah menunjuk pada memperoleh atau menerima bagian sebagai milik pusaka; pilihan ini alami dan tetap terkait erat dengan נַחֲלָתוֹ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan Indonesia yang mapan dan bermartabat untuk idiom Ibrani 'anak-anak lelaki Israel', sekaligus mempertahankan corak kekerabatan tanpa terdengar janggal.
- source_word: אִישׁ נַחֲלָתוֹ
  choice: setiap orang ... milik pusakanya
  rationale: אִישׁ berfungsi distributif, sedangkan נַחֲלָתוֹ adalah bagian tanah warisan masing-masing; susunan Indonesia dibuat alami dengan menempatkan 'setiap orang' sesudah nama kelompok.
theological_decisions:
- issue: Ungkapan kovenantal yang secara harfiah berarti 'anak-anak lelaki Israel'
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: '''Bani Israel'' mempertahankan idiom keturunan/keluarga dalam bentuk Indonesia yang lazim tanpa mempersempit rujukan secara tidak perlu hanya kepada laki-laki dewasa.'
- issue: Makna נחל sebagai pewarisan sekaligus penguasaan tanah bagian
  choice: memperoleh milik pusakanya
  alternative: menduduki milik pusakanya; menerima warisannya
  rationale: Pilihan ini mempertahankan gagasan bahwa tiap orang mendapat bagian tanah warisan yang ditetapkan, tanpa menambahkan penekanan militer yang tidak harus terkandung dalam verba tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Bani Israel' dipakai sebagai idiom mapan, sedangkan 'milik pusaka' mempertahankan nuansa bagian tanah warisan. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting yang harus ditampilkan.
