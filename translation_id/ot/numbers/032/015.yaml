  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: id
  text: Sebab jika kalian berpaling dari mengikuti Dia[a], Ia akan sekali lagi membiarkannya tinggal di padang gurun[b], dan kalian akan membinasakan seluruh bangsa ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari belakang-Nya,” sebuah ungkapan yang berarti berhenti mengikuti-Nya.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai kata ganti tunggal, “membiarkannya tinggal di padang gurun,” yang kemungkinan merujuk secara kolektif kepada Israel atau bangsa itu. Terjemahan lain dapat mengungkapkannya sebagai “membiarkan mereka” atau “membiarkan Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab, jika
  rationale: Dalam konteks ini כִּי menghubungkan ayat tersebut dengan peringatan sebelumnya sekaligus memperkenalkan syarat. “Sebab, jika” mempertahankan kedua fungsi itu.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: kalian berbalik dan tidak lagi mengikuti Dia
  rationale: שׁוב bersama מֵאַחֲרָיו menyatakan tindakan berbalik dari mengikuti seseorang, bukan sekadar kembali secara fisik. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan gagasan berhenti mengikuti TUHAN.
- source_word: וְיָסַף עוֹד
  choice: Ia akan kembali
  rationale: Gabungan יסף dan עוד menyatakan pengulangan tindakan, sehingga “akan kembali” menyampaikan arti ‘akan melakukannya lagi’ secara ringkas.
- source_word: לְהַנִּיחוֹ
  choice: membiarkannya tinggal
  rationale: Bentuk Hifil dari נוח di sini berarti membiarkan seseorang atau suatu kelompok tetap tinggal. Akhiran pronomina tunggal dipertahankan melalui “-nya”.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: “Padang gurun” adalah padanan Indonesia yang lazim bagi מִדְבָּר dan sesuai dengan latar perjalanan Israel.
- source_word: וְשִׁחַתֶּם
  choice: kalian akan menyebabkan ... binasa
  rationale: Bentuk ini menyatakan akibat merusak atau membinasakan. Konstruksi kausatif Indonesia mempertahankan bahwa tindakan para pendengar akan mendatangkan kebinasaan atas bangsa itu tanpa membatasi maknanya pada pembunuhan langsung.
- source_word: לְכָל הָעָם הַזֶּה
  choice: seluruh bangsa ini
  rationale: הָעָם adalah nomina kolektif tunggal. “Seluruh bangsa ini” mempertahankan sifat kolektifnya dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan akhiran pronomina tunggal pada לְהַנִּיחוֹ
  choice: Mempertahankan bentuk tunggal/ kolektif dengan “membiarkannya” dan menjelaskan rujukannya dalam catatan kaki.
  alternative: Menghaluskan menjadi “membiarkan mereka” atau memperjelas menjadi “membiarkan Israel.”
  rationale: Teks Ibrani memakai akhiran tunggal yang tampaknya merujuk secara kolektif kepada Israel atau bangsa itu. Bentuk “-nya” menjaga bentuk sumber tanpa menetapkan rujukan yang lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai bahwa sapaan Ibrani berbentuk jamak; pronomina yang merujuk kepada TUHAN ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
