  terminology: '"Padang gurun" sesuai untuk מִדְבָּר, "seluruh bangsa ini" menyampaikan nomina kolektif הָעָם dengan baik, dan kapitalisasi Dia/Ia mengikuti konvensi penerbitan Alkitab Indonesia. Akhiran "-nya" dengan catatan kaki secara tepat mempertahankan ambiguitas tunggal-kolektif teks Ibrani.'
