  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: id
  text: Musa memberikan kepada keturunan Gad, kepada keturunan Ruben, dan kepada setengah suku Manasye, anak Yusuf, kerajaan Sihon, raja orang Amori, dan kerajaan Og, raja Basan—negeri itu beserta kota-kotanya dan wilayah-wilayahnya, kota-kota negeri di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan negeri itu, kota-kotanya dengan batas-batas wilayahnya, serta kota-kota negeri di sekelilingnya.” Frasa Ibrani pada bagian akhir ayat ini sangat padat secara sintaksis sehingga memungkinkan beberapa terjemahan yang hampir serupa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Kata kerja נתן dalam konteks ini menyatakan pemberian atau penyerahan wilayah; “memberikan” mempertahankan gaya naratif yang lugas.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: kepada keturunan Gad, keturunan Ruben
  rationale: Dalam konteks suku Israel, “keturunan” menyampaikan idiom בני secara alami dan jelas dalam bahasa Indonesia modern tanpa mengaburkan hubungan kesukuan.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: dan setengah suku Manasye
  rationale: Terjemahan langsung dan wajar yang menunjukkan bahwa hanya separuh suku Manasye yang dimaksud.
- source_word: בֶן יוֹסֵף
  choice: anak Yusuf
  rationale: Mempertahankan keterangan silsilah Manasye sebagaimana terdapat dalam teks Ibrani.
- source_word: מַמְלֶכֶת
  choice: kerajaan
  rationale: ממלכה menunjuk pada kerajaan atau wilayah kekuasaan; “kerajaan” merupakan padanan langsung dan lazim.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihon, raja orang Amori
  rationale: Mempertahankan susunan nama dan gelar, sekaligus mengungkap bentuk kolektif הָאֱמֹרִי secara alami.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, raja Basan
  rationale: Padanan langsung untuk rangkaian nama dan gelar dalam bahasa Ibrani.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada wilayah yang baru disebutkan; “negeri itu” jelas dan sesuai dengan konteks teritorial.
- source_word: לְעָרֶיהָ
  choice: beserta kota-kotanya
  rationale: Ungkapan Ibrani bersifat eliptis; “beserta” secara alami menyatakan bahwa negeri tersebut diberikan bersama kota-kotanya.
- source_word: בִּגְבֻלֹת
  choice: dalam batas-batas wilayahnya
  rationale: גְּבוּלֹת dapat berarti batas-batas atau wilayah-wilayah. Pilihan ini mempertahankan unsur batas teritorial sambil menghasilkan bahasa Indonesia yang dapat dipahami.
- source_word: עָרֵי הָאָרֶץ סָבִיב
  choice: kota-kota di negeri sekitarnya
  rationale: Menyampaikan frasa penutup yang padat sebagai keterangan tentang kota-kota yang berada di negeri sekelilingnya.
