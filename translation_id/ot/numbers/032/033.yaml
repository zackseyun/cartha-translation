  to: Musa memberikan kepada keturunan Gad, kepada keturunan Ruben, dan kepada setengah suku Manasye, anak Yusuf, kerajaan Sihon, raja orang Amori, dan kerajaan Og, raja Basan—negeri itu beserta kota-kotanya dan wilayah-wilayahnya, kota-kota negeri di sekelilingnya.[a]
