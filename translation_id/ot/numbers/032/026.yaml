  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: id
  text: Anak-anak kami[a], istri-istri kami, ternak kami, dan semua hewan kami akan tetap tinggal[b] di sana, di kota-kota Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak kecil kami.” Kata Ibrani טַף sering menunjuk terutama kepada anak-anak yang masih kecil atau yang masih menjadi tanggungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan berada di sana.” Kata kerja Ibrani secara harfiah berarti “akan ada/berada,” tetapi dalam konteks ini menyiratkan bahwa mereka akan tinggal di sana sementara yang lain pergi berperang.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: anak-anak kami
  rationale: טַף menunjuk terutama kepada anak-anak yang masih kecil atau yang masih menjadi tanggungan. Dalam bahasa Indonesia, 'anak-anak kami' paling alami; nuansa usia mudanya dicatat dalam catatan kaki.
- source_word: נָשֵׁינוּ
  choice: istri-istri kami
  rationale: Dalam konteks rumah tangga dan suku ini, bentuk jamak נָשִׁים dengan akhiran orang pertama jamak secara alami berarti para istri dari para pembicara.
- source_word: מִקְנֵנוּ
  choice: ternak kami
  rationale: מִקְנֶה lazim menunjuk kepada kawanan hewan sebagai milik bergerak. 'Ternak' merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: dan semua hewan peliharaan kami
  rationale: בְּהֵמָה merupakan istilah luas bagi binatang, terutama binatang domestik. 'Hewan peliharaan' mempertahankan keluasan istilah sekaligus membedakannya dari 'ternak' sebelumnya.
- source_word: יִהְיוּ שָׁם
  choice: akan tetap tinggal di sana
  rationale: Secara harfiah יִהְיוּ berarti 'akan berada/ada', tetapi dalam konteks keberangkatan para laki-laki untuk berperang, frasa ini menyatakan bahwa keluarga dan hewan mereka tetap tinggal di tempat itu.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: di kota-kota Gilead
  rationale: עָרִים dapat berarti kota-kota atau permukiman berkubu. 'Kota-kota Gilead' merupakan ungkapan modern yang alami dan tetap dekat dengan bentuk Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan 'kami' dipertahankan untuk mencerminkan susunan daftar dalam bahasa Ibrani. 'Tetap tinggal' mengungkapkan daya kontekstual יִהְיוּ tanpa menjadikannya istilah teologis.
