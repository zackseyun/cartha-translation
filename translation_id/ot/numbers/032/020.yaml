lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: Lalu Musa berkata kepada mereka
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara wajar dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak ada.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: Jika kalian melakukan hal ini
  rationale: דָּבָר di sini menunjuk pada usul atau komitmen yang baru dibicarakan. “Hal ini” alami dan tetap cukup luas.
- source_word: אִם תֵּחָלְצוּ
  choice: jika kalian mempersenjatai diri
  rationale: Nifal חלץ dalam konteks militer berarti diperlengkapi atau tampil sebagai orang bersenjata. Bentuk refleksif Indonesia menyampaikan persiapan aktif mereka untuk perang.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan berada di hadapan atau dalam kehadiran; frasa ini mempertahankan bahwa tindakan mereka berlangsung dalam kehadiran dan di bawah otoritas Yahweh.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Ungkapan ini secara alami menyampaikan tujuan militer dari persenjataan mereka dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna teologis לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  alternative: di depan Yahweh
  rationale: “Di hadapan” mempertahankan dimensi kehadiran dan otoritas ilahi tanpa menentukan lebih jauh bagaimana kehadiran itu dipahami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” agar orang kedua jamak dalam teks sumber terlihat jelas. Kalimat dibiarkan terbuka dengan koma karena ayat ini merupakan bagian awal dari syarat yang berlanjut pada ayat berikutnya.
