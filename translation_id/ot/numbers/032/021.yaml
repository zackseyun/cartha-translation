  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: id
  text: dan setiap orang bersenjata di antara kalian menyeberangi Sungai Yordan di hadapan Yahweh, sampai ia menghalau[a] musuh-musuhnya dari hadapannya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengambil alih milik musuh-musuhnya.” Kata kerja Ibrani ini dapat berarti “menghalau” atau “mengambil alih milik.”
    reason: lexical_alternative
  - marker: b
    text: Pronomina dalam frasa “ia menghalau musuh-musuhnya dari hadapannya” paling wajar merujuk kepada Yahweh, meskipun sebagian orang memahaminya sebagai rujukan kepada Israel atau pasukan bersenjatanya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: dan ... menyeberangi
  rationale: Bentuk perfektum dengan waw dalam konteks persyaratan yang berlanjut dari ayat sebelumnya menyatakan tindakan yang harus terjadi; bentuk kini bahasa Indonesia secara alami menyampaikan isi syarat itu tanpa menambah modalitas yang tidak tersurat.
- source_word: לָכֶם
  choice: di antara kalian
  rationale: Dalam gabungan dengan כָּל חָלוּץ, frasa ini menunjukkan orang-orang yang berasal dari kelompok yang disapa. 'Di antara kalian' lebih alami daripada terjemahan harfiah 'bagi kalian'.
- source_word: כָּל חָלוּץ
  choice: setiap orang bersenjata
  rationale: חָלוּץ menunjuk kepada orang yang diperlengkapi atau disiapkan untuk berperang. Pilihan ini mempertahankan daya distributif כָּל dan makna militernya tanpa mempersempitnya menjadi gelar khusus seperti 'pahlawan'.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama geografis ini paling jelas dan alami bagi pembaca Indonesia bila unsur 'Sungai' dinyatakan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan atau gerak di hadapan seseorang, sedangkan יהוה dipertahankan sebagai nama ilahi Yahweh.
- source_word: עַד
  choice: sampai
  rationale: Menandai batas waktu atau keadaan yang harus tercapai.
- source_word: הוֹרִישׁוֹ
  choice: ia menghalau
  rationale: Bentuk Hifil dari ירשׁ dalam konteks penaklukan dapat berarti menghalau atau mencabut kepemilikan. 'Menghalau' alami dalam bahasa Indonesia dan alternatif leksikalnya dicatat.
- source_word: אֹיְבָיו
  choice: musuh-musuhnya
  rationale: Akhiran pronominal orang ketiga tunggal dipertahankan. Bentuk huruf kecil sengaja mempertahankan kemungkinan rujukannya dalam teks utama.
- source_word: מִפָּנָיו
  choice: dari hadapannya
  rationale: Terjemahan ini mempertahankan gambaran harfiah 'dari hadapan/wajahnya' serta kaitannya dengan לִפְנֵי, tanpa menghapus ambiguitas pronominal.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan fungsinya sebagai nama perjanjian, bukan menggantinya dengan gelar.
- issue: Rujukan pronomina orang ketiga tunggal dalam הוֹרִישׁוֹ, אֹיְבָיו, dan מִפָּנָיו
  choice: Teks utama mempertahankan pronomina yang ambigu; catatan menyatakan bahwa rujukan paling wajar ialah Yahweh
  alternative: Pronomina merujuk kepada Israel secara kolektif atau pasukan bersenjatanya
  rationale: Frasa terdekat 'di hadapan Yahweh' dan pola penaklukan dalam Taurat mendukung Yahweh sebagai pelaku yang menghalau. Namun, rangkaian bentuk tunggal Ibrani juga pernah dipahami dengan mengacu kepada Israel atau pasukannya, sehingga ambiguitas asli tidak disingkirkan dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak diterjemahkan 'kalian' agar hubungan לָכֶם dengan kelompok yang disapa jelas. Pronomina orang ketiga sengaja ditulis dengan huruf kecil untuk tidak meniadakan ambiguitas rujukan dalam bahasa sumber.
