translation:
  language: id
  text: Atarot, Dibon, Yaezer, Nimra, Hesbon, Eleale, Sebam[a], Nebo, dan Beon[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani: "Sebam"; di tempat lain nama tempat yang berkaitan muncul sebagai "Sibma".'
    reason: lexical_alternative
  - marker: b
    text: 'Dalam bahasa Ibrani: "Beon"; di tempat lain nama tempat yang berkaitan muncul dalam bentuk yang lebih panjang, "Baal-Meon".'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Nama tempat ditransliterasikan menurut ejaan Indonesia; huruf akhir Ibrani taw diwakili dengan t, tanpa bentuk Inggris -th.
- source_word: דִיבֹן
  choice: Dibon
  rationale: Transliterasi langsung yang alami dalam bahasa Indonesia.
- source_word: יַעְזֵר
  choice: Yaezer
  rationale: Nama tempat ditransliterasikan dari bentuk Ibrani; yod diwakili dengan y dalam ejaan Indonesia, dan rangkaian vokal dipertahankan tanpa mengikuti bentuk Inggris Jazer.
- source_word: נִמְרָה
  choice: Nimra
  rationale: Bentuk pendek yang terdapat dalam ayat ini dipertahankan dan tidak diselaraskan dengan bentuk terkait Bet-Nimra.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Transliterasi Indonesia yang lazim; shin direpresentasikan sebagai s dalam bentuk nama Alkitab Indonesia yang mapan.
- source_word: אֶלְעָלֵה
  choice: Eleale
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam bahasa Indonesia; he akhir tidak diberi bunyi tambahan.
- source_word: שְׂבָם
  choice: Sebam
  rationale: Mengikuti bentuk konsonantal dan vokalisasi dalam ayat ini, bukan menormalkannya menjadi Sibma; bentuk terkait dicatat dalam catatan kaki.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Transliterasi langsung dan bentuk yang mapan dalam bahasa Indonesia.
- source_word: בְּעֹן
  choice: Beon
  rationale: Mempertahankan bentuk pendek yang benar-benar terdapat dalam teks ayat ini, bukan menggantinya dengan bentuk terkait Baal-Meon.
- source_word: וְ / וּ
  choice: koma dalam daftar dan "dan" sebelum unsur terakhir
  rationale: Bahasa Indonesia modern secara alami menyusun daftar dengan koma dan satu konjungsi sebelum nama terakhir; struktur daftar tetap jelas tanpa pengulangan 'dan' yang kaku.
