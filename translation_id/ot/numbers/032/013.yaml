  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: id
  text: Maka murka Yahweh menyala terhadap Israel[a], dan Ia membuat mereka mengembara di padang belantara selama empat puluh tahun[b], sampai habis seluruh generasi yang melakukan apa yang jahat di mata Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh murka terhadap Israel.” Secara harfiah, idiom Ibraninya menggambarkan murka Yahweh sebagai sesuatu yang menyala.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia menyebabkan mereka mengembara di padang belantara selama empat puluh tahun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: murka Yahweh menyala
  rationale: Mempertahankan gambaran idiom Ibrani tentang murka yang menyala, sekaligus memakai ungkapan Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dalam konstruksi dengan murka, preposisi ini menandai Israel sebagai sasaran murka; 'terhadap' alami dalam bahasa Indonesia.
- source_word: וַיְנִעֵם
  choice: Ia membuat mereka mengembara
  rationale: 'Bentuk kausatif dipertahankan: Yahweh menyebabkan mereka mengembara, bukan sekadar menyatakan bahwa mereka mengembara.'
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Menggambarkan wilayah liar tempat pengembaraan Israel tanpa mempersempit makna menjadi padang pasir semata.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: '''Selama'' menyatakan rentang waktu secara alami dalam bahasa Indonesia.'
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: sampai seluruh generasi ... itu habis
  rationale: '''Habis'' menyampaikan berakhir atau lenyapnya generasi tersebut dalam konteks penghukuman, dengan susunan Indonesia yang ringkas.'
- source_word: הָעֹשֶׂה הָרַע
  choice: yang melakukan apa yang jahat
  rationale: Partisipel yang menerangkan generasi dialihkan menjadi klausa relatif alami; unsur substantif 'yang jahat' tetap terpelihara.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga jelas dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber secara langsung memakai nama perjanjian ilahi; transliterasi 'Yahweh' mempertahankan statusnya sebagai nama pribadi.
- issue: Penggambaran murka ilahi
  choice: murka Yahweh menyala terhadap Israel
  alternative: Yahweh murka terhadap Israel
  rationale: Pilihan ini tidak melunakkan metafora antropomorfis teks sumber dan mempertahankan daya ungkapnya tanpa menambahkan penafsiran doktrinal.
- issue: Peran Yahweh dalam pengembaraan
  choice: Ia membuat mereka mengembara
  alternative: Ia membawa mereka berkeliling
  rationale: Bentuk kausatif Ibrani menyatakan bahwa Yahweh menyebabkan pengembaraan itu; terjemahan mempertahankan ketegangan teologis tersebut secara langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Kapitalisasi 'Ia' dipakai untuk rujukan pronominal kepada Yahweh. Metafora sumber dipertahankan bila tetap alami dalam bahasa sasaran.
