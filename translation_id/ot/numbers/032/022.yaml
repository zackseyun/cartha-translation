source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: id
  text: dan setelah tanah itu ditundukkan di hadapan Yahweh[a], kamu boleh kembali dan bebas dari kewajiban kepada Yahweh dan Israel[b]. Tanah ini akan menjadi tanah milikmu di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh adalah nama ilahi yang dalam banyak terjemahan ditampilkan sebagai “TUHAN”.
    reason: divine_name
  - marker: b
    text: Atau “tidak bersalah di hadapan Yahweh dan Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה
  choice: telah ditundukkan
  rationale: Bentuk Nifal menyatakan bahwa tanah itu sudah dibawa ke bawah kekuasaan. Pilihan ini mempertahankan bentuk pasif dan hasil tindakan tersebut.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan לִפְנֵי berarti 'di hadapan/dalam kehadiran' dan di sini juga mengandung nuansa pertanggungjawaban kepada Allah.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: sesudah itu kamu boleh kembali
  rationale: 'Penanda waktu menunjukkan urutan: mereka dapat kembali setelah syarat sebelumnya terpenuhi. ''Boleh'' menyampaikan izin dalam konteks ini tanpa meniadakan nilai futur bentuk Ibrani.'
- source_word: וִהְיִיתֶם נְקִיִּים
  choice: bebas dari tanggungan
  rationale: נָקִי dapat berarti bersih, tidak bersalah, atau bebas dari kewajiban/tanggung jawab. Dalam konteks pemenuhan janji ini, 'bebas dari tanggungan' alami dalam bahasa Indonesia dan mempertahankan nuansa pertanggungjawaban.
- source_word: מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: terhadap Yahweh dan Israel
  rationale: Dengan נָקִי, preposisi מן menyatakan pihak yang terhadapnya seseorang tidak lagi menanggung kewajiban atau kesalahan.
- source_word: וְהָיְתָה הָאָרֶץ הַזֹּאת לָכֶם לַאֲחֻזָּה
  choice: Tanah ini akan menjadi milikmu sebagai tanah milik
  rationale: אֲחֻזָּה menunjuk kepada tanah pegangan atau milik tetap. 'Tanah milik' mempertahankan unsur kepemilikan lahan tanpa memaksakan arti 'warisan' yang tidak dinyatakan secara eksplisit di sini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga identitas nama perjanjian dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi 'Yahweh' mempertahankan nama pribadi yang terdapat dalam teks sumber, sedangkan 'TUHAN' merupakan penggantian dengan gelar.
- issue: Makna נְקִיִּים dalam konteks janji kepada Allah dan Israel
  choice: bebas dari tanggungan
  alternative: tidak bersalah atau tidak bercela
  rationale: Konteksnya adalah kewajiban yang harus dipenuhi, tetapi istilah Ibrani juga dapat menyatakan keadaan tidak bersalah. Terjemahan utama menampilkan nuansa kewajiban, sementara catatan kaki mempertahankan kemungkinan forensik-moralnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti urutan syarat dan hasil dalam bahasa Ibrani, sementara 'terhadap' dipakai agar hubungan tanggungan dengan Yahweh dan Israel terdengar alami. Pengulangan 'tanah ... tanah milik' sengaja mempertahankan unsur lahan dalam אֲחֻזָּה.
