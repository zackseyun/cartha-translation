id: NUM.32.27
reference: Numbers 32:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: id
  text: Namun hamba-hambamu akan menyeberang, yakni setiap orang yang diperlengkapi untuk bertempur[a], di hadapan Yahweh[b] untuk berperang[c], seperti yang tuanku katakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “setiap orang yang bersenjata untuk bertempur” atau “setiap orang yang siap menjalani tugas militer.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di hadapan Yahweh” menunjukkan bahwa mereka mengikuti peperangan itu dalam kehadiran dan di bawah kewenangan Yahweh.
    reason: cultural_note
  - marker: c
    text: 'Secara lebih harfiah: “menuju peperangan”; dapat juga diterjemahkan “untuk pertempuran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Namun hamba-hambamu
  rationale: עֶבֶד dalam konteks ini adalah sebutan merendah ketika berbicara kepada Musa. Waw diterjemahkan “Namun” untuk menandai hubungan kontras dengan kekhawatiran yang baru dibahas.
- source_word: יַעַבְרוּ
  choice: akan menyeberang
  rationale: עבר di sini menunjuk pada tindakan menyeberangi batas menuju wilayah tempat operasi militer berlangsung.
- source_word: כָּל חֲלוּץ צָבָא
  choice: setiap orang yang diperlengkapi untuk bertempur
  rationale: כָּל dengan bentuk tunggal bersifat distributif, sedangkan חֲלוּץ צָבָא menunjuk kepada setiap orang yang diperlengkapi atau disiapkan bagi tugas tempur. Rumusan ini mempertahankan cakupan makna tanpa membatasi persenjataan secara berlebihan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan/dalam kehadiran”; bentuk harfiah yang alami ini mempertahankan gagasan kehadiran dan kewenangan ilahi. Nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Preposisi ל menyatakan arah atau tujuan, dan מִלְחָמָה berarti perang/pertempuran. “Untuk berperang” terdengar alami dalam bahasa Indonesia serta menyampaikan tujuan gerakan tersebut.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: seperti yang tuanku katakan
  rationale: כַּאֲשֶׁר menyatakan kesesuaian; אֲדֹנִי adalah sapaan hormat kepada Musa, bukan gelar ilahi; partisip דֹּבֵר mengacu pada perkataan yang sedang menjadi acuan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat nama diri ilahi, bukan אֲדֹנָי. “Yahweh” mempertahankan fungsi nama perjanjian itu dan membedakannya dari אֲדֹנִי (“tuanku”) pada akhir ayat.
- issue: Makna לִפְנֵי יְהוָה dalam konteks perang
  choice: di hadapan Yahweh
  alternative: di bawah pimpinan Yahweh
  rationale: Terjemahan yang dipilih mempertahankan metafora ruang dan ketegangan maknanya—kehadiran, pengawasan, serta kewenangan Yahweh—tanpa mengubahnya menjadi satu penafsiran khusus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan naratif. Bentuk “hamba-hambamu” mempertahankan kesantunan sosial para penutur kepada Musa, sementara “tuanku” membedakan sapaan kepada Musa dari nama ilahi Yahweh. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
