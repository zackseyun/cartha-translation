lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam bahasa Indonesia Alkitabiah yang tetap wajar dan bermartabat, “berfirman” secara alami menyatakan tindakan Allah berbicara dan memperkenalkan ujaran yang menyusul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama pribadi, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang dituju dalam tindakan berbicara; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: ditandai dengan koma tanpa diterjemahkan secara terpisah
  rationale: Dalam formula pembuka ujaran bahasa Ibrani, לֵאמֹר mengantar isi perkataan berikutnya. Bahasa Indonesia modern secara alami menyatakannya dengan tanda baca; menerjemahkannya sebagai “dengan mengatakan” akan terasa kaku dan berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan fungsi nama pribadi itu, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” mencerminkan bentuk pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula Ibrani diterjemahkan secara alami sebagai “berfirman kepada Musa,” dengan isi firman berlanjut pada ayat berikutnya.
