  text: וְ/הֶ/עָרִ֖ים אֲשֶׁ֣ר תִּתֵּ֑נוּ שֵׁשׁ עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֥ינָה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/013.yaml
  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: id
  text: Kota-kota yang kamu berikan itu haruslah menjadi enam kota perlindungan bagimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: Kota-kota ... itu
  rationale: Nomina jamak definit dengan konjungsi. Dalam bahasa Indonesia, kesinambungan wacana dan sifat definitnya dinyatakan secara alami dengan pengulangan nomina dan penunjuk “itu”; konjungsi Ibrani tidak perlu selalu diterjemahkan tersendiri.
- source_word: אֲשֶׁר תִּתֵּנוּ
  choice: yang kamu berikan
  rationale: Partikel relatif dan verba Qal imperfek orang kedua jamak diterjemahkan sebagai klausa relatif yang alami. “Kamu” dalam konteks ini bersifat jamak dan prospektif, tanpa menambahkan makna teknis “menetapkan”.
- source_word: שֵׁשׁ
  choice: enam
  rationale: Bilangan kardinal diterjemahkan secara langsung.
- source_word: עָרֵי מִקְלָט
  choice: kota perlindungan
  rationale: Rangkaian konstruksi ini secara harfiah menyatakan kota-kota yang berfungsi sebagai tempat berlindung. “Kota perlindungan” ringkas, jelas, dan mempertahankan istilah hukum dalam konteks.
- source_word: תִּהְיֶינָה
  choice: haruslah menjadi
  rationale: Bentuk imperfek dari היה dalam konteks ketetapan hukum menyampaikan daya direktif. “Haruslah menjadi” mempertahankan unsur kewajiban sekaligus makna ‘menjadi/berfungsi sebagai’.
- source_word: לָ/כֶם
  choice: bagimu
  rationale: Preposisi ל dengan sufiks orang kedua jamak menyatakan kepentingan atau peruntukan; “bagimu” merupakan padanan yang alami dan cukup formal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk “kamu” mengikuti sapaan orang kedua jamak dalam sumber, sedangkan “bagimu” dipilih agar kalimat tetap ringkas; tidak ada penanda khusus pluralitas karena bahasa Indonesia tidak membedakannya secara gramatikal.
