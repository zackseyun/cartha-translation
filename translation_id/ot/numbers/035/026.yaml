  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: id
  text: Namun, jika orang yang membunuh itu benar-benar keluar[a] melewati batas kota perlindungannya, ke mana ia melarikan diri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar ia keluar.” Bahasa Ibrani memakai infinitif absolut diikuti verba finit untuk memberi penegasan.
    reason: Menjelaskan konstruksi penegasan Ibrani yang tidak dapat ditiru secara harfiah dengan wajar dalam bahasa Indonesia.
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menyatakan syarat yang berkontras dengan ketentuan hukum sebelumnya; bentuk ini wajar dan jelas dalam bahasa Indonesia modern.
- source_word: יָצֹא יֵצֵא
  choice: benar-benar keluar
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan keluar; 'benar-benar' mempertahankan penekanan itu secara alami.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh itu
  rationale: Dalam konteks kota perlindungan, istilah ini menunjuk kepada orang yang telah menyebabkan kematian tanpa dengan sendirinya menetapkan bahwa ia seorang pembunuh yang bersalah; pilihan ini menjaga kenetralan hukum tersebut.
- source_word: אֶת גְּבוּל
  choice: melewati batas
  rationale: Dengan verba 'keluar', frasa ini menyatakan tindakan melintasi batas wilayah, bukan sekadar berada di dekat batas.
- source_word: עִיר מִקְלָטוֹ
  choice: kota perlindungannya
  rationale: Menerjemahkan istilah hukum bagi kota suaka serta mempertahankan sufiks pronominal orang ketiga.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: tempat ia melarikan diri
  rationale: Klausa relatif menjelaskan kota tersebut sebagai tujuan pelariannya; 'tempat' menyampaikan שָׁמָּה secara idiomatis.
theological_decisions:
- issue: Status moral הָרֹצֵחַ dalam hukum kota perlindungan
  choice: orang yang membunuh itu
  alternative: pembunuh itu
  rationale: Konteks tidak mengizinkan terjemahan yang sejak awal menyatakan pembunuhan sengaja atau kesalahan moral; frasa deskriptif mempertahankan ketegangan hukum dalam perikop.
