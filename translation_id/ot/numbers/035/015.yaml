id: NUM.35.15
reference: Numbers 35:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֤ר וְ/לַ/תּוֹשָׁב֙ בְּ/תוֹכָ֔/ם תִּהְיֶ֛ינָה שֵׁשׁ הֶ/עָרִ֥ים הָ/אֵ֖לֶּה לְ/מִקְלָ֑ט לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: id
  text: Keenam kota ini harus menjadi kota-kota perlindungan bagi orang Israel[a], bagi pendatang dan bagi penduduk sementara yang ada di tengah-tengah mereka[b], supaya siapa pun yang menewaskan seseorang[c] tanpa sengaja dapat melarikan diri ke sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini juga dapat diterjemahkan “keturunan Israel” atau “bangsa Israel.”
    reason: lexical_alternative
  - marker: b
    text: “Pendatang” dan “penduduk sementara” menerjemahkan dua istilah Ibrani yang berbeda (גֵּר dan תּוֹשָׁב) bagi orang bukan penduduk asli yang hidup dalam masyarakat Israel.
    reason: cultural_note
  - marker: c
    text: Atau “siapa pun yang menyebabkan kematian seseorang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Ungkapan ini merupakan sebutan baku bagi bangsa Israel. “Orang Israel” menyampaikan makna kolektifnya secara wajar dalam bahasa Indonesia tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak secara usia.
- source_word: גֵּר
  choice: pendatang
  rationale: Istilah ini menunjuk kepada orang bukan pribumi yang tinggal di tengah masyarakat Israel. “Pendatang” cukup alami dan mempertahankan statusnya sebagai orang yang berasal dari luar komunitas asli.
- source_word: תּוֹשָׁב
  choice: penduduk sementara
  rationale: Istilah ini menunjuk kepada orang yang menetap dalam masyarakat itu tanpa memiliki status penuh sebagai warga asli. Pilihan ini membedakannya dari גֵּר sambil tetap mudah dipahami.
- source_word: בְּתוֹכָם
  choice: yang tinggal di tengah-tengah mereka
  rationale: Frasa ini menyatakan keberadaan kedua kelompok nonpribumi tersebut di dalam masyarakat Israel; bentuk relatif ini alami dalam susunan kalimat bahasa Indonesia.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: Keenam kota ini harus menjadi tempat perlindungan
  rationale: “Harus menjadi” mempertahankan nada penetapan hukum, sedangkan “tempat perlindungan” menyampaikan fungsi khusus kota-kota tersebut.
- source_word: לָנוּס שָׁמָּה
  choice: dapat melarikan diri ke sana
  rationale: Infinitif Ibrani menyatakan tujuan. “Dapat melarikan diri ke sana” mengungkapkan tersedianya perlindungan secara jelas dan alami.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: siapa pun yang menewaskan seseorang
  rationale: Secara harfiah ungkapan ini menggambarkan orang yang memukul atau menyerang seorang manusia hingga mati. Dalam konteks hukum pembunuhan, “menewaskan seseorang” jelas tanpa memakai istilah teknis yang kurang lazim.
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Di sini נֶפֶשׁ berarti manusia sebagai korban, bukan “jiwa” sebagai bagian nonjasmani.
- source_word: בִּשְׁגָגָה
  choice: tanpa sengaja
  rationale: Istilah ini menandai tidak adanya niat, yakni pembedaan hukum yang mendasari ketentuan tentang kota perlindungan.
theological_decisions:
- issue: Sebutan perjanjian yang berbentuk maskulin dalam בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Dalam konteks ini bentuk tersebut berfungsi sebagai nama kolektif bangsa, bukan pembatasan kepada laki-laki atau anak-anak. “Orang Israel” mempertahankan cakupan etnis-perjanjiannya dalam bahasa Indonesia modern tanpa menambahkan pembedaan gender yang tidak dimaksudkan.
- issue: Cakupan perlindungan bagi גֵּר dan תּוֹשָׁב
  choice: 'Mempertahankan keduanya sebagai dua golongan berbeda: “pendatang” dan “penduduk sementara”'
  alternative: Menggabungkannya menjadi satu golongan umum, misalnya “orang asing”
  rationale: Teks Ibrani dengan sengaja menyebut dua istilah hukum-sosial yang berbeda. Mempertahankan keduanya menunjukkan bahwa perlindungan ini tidak hanya berlaku bagi orang Israel, tanpa menyamakan status kedua golongan tersebut.
- issue: Sifat kematian dalam בִּשְׁגָגָה
  choice: tanpa sengaja
  alternative: karena keliru; secara tidak disengaja
  rationale: Pilihan ini mempertahankan pembedaan antara kematian yang tidak diniatkan dan pembunuhan yang disengaja, tanpa menentukan lebih jauh tingkat kelalaian yang tidak dijelaskan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nada ketentuan hukum. Susunan kalimat diatur agar alami dalam bahasa Indonesia, sementara ketiga kelompok penerima perlindungan, perbedaan dua status nonpribumi, dan unsur ketidaksengajaan tetap dipertahankan.
