base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: id
  text: 'Kamu harus mengukur di luar kota: sisi timur 2.000 hasta, sisi selatan 2.000 hasta, sisi barat[a] 2.000 hasta, dan sisi utara 2.000 hasta, dengan kota itu di tengah-tengah. Itulah yang akan menjadi lahan penggembalaan[b] kota-kota itu bagi mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai kata “laut” untuk sisi barat, menurut ungkapan arah yang mengacu pada Laut Tengah.
    reason: lexical_alternative
  - marker: b
    text: Atau “tanah bersama” atau “tanah terbuka”; istilah Ibrani menunjuk pada lahan di sekeliling kota, yang sering digunakan untuk penggembalaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם מִחוּץ לָעִיר
  choice: Kamu harus mengukur di luar kota
  rationale: Bentuk verba dalam konteks hukum menyampaikan perintah, sedangkan frasa preposisional menunjukkan bahwa pengukuran dilakukan di luar batas kota.
- source_word: פְּאַת
  choice: sisi
  rationale: Dalam konteks pengukuran wilayah, kata ini menunjuk pada tiap sisi menurut arah mata angin; 'sisi' lebih alami daripada 'sudut'.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: timur / selatan / barat / utara
  rationale: Keempat istilah berfungsi sebagai arah mata angin. יָם secara harfiah berarti 'laut', tetapi secara idiomatis menunjuk ke barat.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: 2.000 hasta
  rationale: Ukuran asli dipertahankan tanpa konversi agar ketepatan dan kekhususan teks tetap terjaga.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: dengan kota itu di tengah-tengah
  rationale: Ungkapan ini secara alami menyatakan susunan ruang, yaitu kota berada di tengah wilayah yang diukur.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: Itulah yang akan menjadi ... mereka
  rationale: Konstruksi ini menyatakan penetapan atau peruntukan tanpa mempertegas konsep kepemilikan melebihi teks sumber.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: tanah penggembalaan kota-kota mereka
  rationale: Istilah מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota, yang antara lain digunakan untuk menggembalakan ternak. Bentuk jamak 'kota-kota' dipertahankan.
