  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: id
  text: Semua ini harus menjadi ketetapan hukum[a] bagi kamu dari generasi ke generasi di seluruh tempat tinggalmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketetapan peradilan.” Frasa Ibrani ini menggabungkan istilah untuk ketetapan yang ditetapkan dengan istilah untuk keputusan atau prosedur hukum.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di seluruh permukimanmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ אֵלֶּה
  choice: Semua ini harus menjadi
  rationale: Bentuk jamak demonstratif merujuk pada ketentuan-ketentuan sebelumnya. Dalam konteks hukum, konstruksi verbal ini menyatakan keberlakuan yang bersifat mengikat; “harus menjadi” menyampaikan daya preskriptifnya secara wajar dalam bahasa Indonesia.
- source_word: לָכֶם
  choice: bagi kamu
  rationale: Preposisi menyatakan acuan atau pihak yang dikenai ketetapan. “Bagi kamu” mempertahankan sapaan jamak kolektif kepada Israel.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: ketetapan hukum
  rationale: Gabungan חֻקָּה dan מִשְׁפָּט menunjuk pada ketetapan yang bersifat yudisial atau tata hukum. “Ketetapan hukum” alami dalam bahasa Indonesia dan mempertahankan kedua unsur tanpa membatasinya pada satu putusan tertentu.
- source_word: לְדֹרֹתֵיכֶם
  choice: dari generasi ke generasi
  rationale: Ungkapan ini menyatakan keberlakuan yang berlanjut sepanjang generasi-generasi Israel. Padanan tersebut jelas dan idiomatis dalam bahasa Indonesia modern.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: di seluruh tempat tinggalmu
  rationale: Frasa ini menyatakan cakupan geografis pada semua tempat kediaman atau permukiman mereka. Bentuk “-mu” mempertahankan orang kedua jamak kolektif menurut kebiasaan bahasa Indonesia.
theological_decisions:
- issue: Cakupan frasa חֻקַּת מִשְׁפָּט
  choice: ketetapan hukum
  alternative: ketetapan penghakiman
  rationale: Konteksnya adalah prosedur dan ketentuan yudisial mengenai pembunuhan, bukan terutama tindakan penghakiman teologis. Pilihan ini mempertahankan sifat legal tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Semua ini” merujuk secara alami pada rangkaian ketentuan sebelumnya, sedangkan “dari generasi ke generasi” menyampaikan keberlakuan berkelanjutan tanpa gaya yang terlalu arkais.
