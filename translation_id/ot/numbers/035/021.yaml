  source_fidelity: 'Terjemahan dengan setia mencerminkan unsur-unsur pokok teks Ibrani: tindakan memukul dengan tangan dalam konteks permusuhan, kematian korban, hukuman mati yang tegas bagi pelaku, kategorinya sebagai pembunuh, serta tindakan penuntut darah ketika bertemu pembunuh itu. “Karena permusuhan” secara wajar menyampaikan בְּאֵיבָה dalam konteks hukum ini, tanpa mengubah kategori pembunuhan sengaja.'
