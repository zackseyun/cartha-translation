  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: id
  text: Atau jika karena permusuhan ia memukul orang itu dengan tangannya, lalu orang itu mati, orang yang memukulnya harus dihukum mati; ia adalah pembunuh. Penuntut darah[a] harus menghukum mati pembunuh itu ketika ia bertemu dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penuntut balas darah”; yang dimaksud ialah kerabat yang bertindak sebagai penuntut atas darah orang yang terbunuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: karena permusuhan
  rationale: Nomina אֵיבָה menyatakan permusuhan atau kebencian. Dalam konstruksi ini, 'karena permusuhan' secara alami menyampaikan niat bermusuhan yang menjadi unsur penting dalam perkara hukum tersebut.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: ia memukul orang itu dengan tangannya
  rationale: נכה adalah istilah umum untuk memukul, sedangkan 'dengan tangannya' dipertahankan karena sarana serangan merupakan bagian dari pembedaan kasus hukum.
- source_word: וַיָּמֹת
  choice: lalu orang itu mati
  rationale: Terjemahan berurutan mempertahankan bentuk naratif Ibrani tanpa mempertegas hubungan sebab akibat melebihi teks sumber.
- source_word: מוֹת יוּמַת
  choice: harus dihukum mati
  rationale: Infinitif absolut bersama verba pasif menegaskan kepastian hukuman. 'Harus dihukum mati' menyampaikan daya wajib dan yudisial secara wajar dalam bahasa Indonesia modern.
- source_word: הַמַּכֶּה
  choice: orang yang memukulnya
  rationale: Partisipel itu secara harfiah menunjuk kepada pihak yang memukul; bentuk klausal ini lebih alami daripada nomina pelaku yang kaku.
- source_word: רֹצֵחַ הוּא
  choice: ia adalah pembunuh
  rationale: Konteks permusuhan membedakan pembunuhan sengaja dari kematian yang tidak disengaja, sehingga 'pembunuh' tepat untuk kategori hukum dan moral ini.
- source_word: גֹּאֵל הַדָּם
  choice: Penuntut darah
  rationale: Istilah ini mempertahankan ungkapan hukum tentang orang yang berwenang menuntut pembalasan atas darah kerabat tanpa memasukkan penjelasan kekerabatan ke dalam teks utama.
- source_word: יָמִית
  choice: harus menghukum mati
  rationale: Ungkapan ini menjaga ragam hukum-yudisial dan menghindari kesan bahwa tindakan tersebut hanyalah pembunuhan pribadi tanpa dasar hukum dalam perikop.
- source_word: בְּפִגְעוֹ בוֹ
  choice: ketika ia bertemu dengannya
  rationale: Frasa ini menyatakan perjumpaan atau saat seseorang mendapati pihak lain; pilihan ini alami dan tidak menambahkan keadaan yang tidak dinyatakan.
theological_decisions:
- issue: Kategori hukum bagi pembunuhan yang disengaja
  choice: pembunuh
  alternative: orang yang menyebabkan kematian
  rationale: Permusuhan yang disebutkan dalam ayat menunjukkan niat jahat, sehingga istilah ini mempertahankan pembedaan antara pembunuhan sengaja dan kematian tidak disengaja dalam pasal tersebut.
- issue: Makna גֹּאֵל הַדָּם
  choice: Penuntut darah
  alternative: penuntut balas darah; kerabat penuntut darah
  rationale: Pilihan utama mempertahankan lembaga hukum Israel kuno secara ringkas. Unsur kerabat memang terkait dengan גֹּאֵל, tetapi tidak dinyatakan secara eksplisit dalam frasa langsung ini dan karena itu dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat dengan ragam hukum yang sesuai konteks. Pronomina diperjelas seperlunya sebagai 'orang itu' untuk menghindari kerancuan rujukan, sementara urutan dan ketegangan hukum teks Ibrani dipertahankan.
