  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: id
  text: Namun, jika ia memukul orang itu dengan perkakas besi[a] dan orang itu mati, ia adalah pembunuh; pembunuh itu haruslah dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alat besi” atau “benda dari besi.” Istilah Ibraninya luas dan tidak menyebut jenis senjata tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Membuka kasus hukum bersyarat yang berlanjut dari ketentuan sebelumnya; “Namun, jika” menyampaikan peralihan kasus secara wajar dalam bahasa Indonesia.
- source_word: בִּכְלִי בַרְזֶל
  choice: dengan perkakas besi
  rationale: כְּלִי adalah istilah luas untuk barang, alat, atau perkakas. “Perkakas besi” menggambarkan benda yang digunakan untuk memukul tanpa menentukannya sebagai jenis senjata tertentu.
- source_word: הִכָּהוּ
  choice: ia memukul orang itu
  rationale: Bentuk verba נכה berarti memukul atau menghantam. Objek pronominal dibuat eksplisit sebagai “orang itu” agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וַיָּמֹת
  choice: dan orang itu mati
  rationale: Mempertahankan urutan tindakan dan akibat dalam bahasa Ibrani tanpa menambahkan rumusan sebab-akibat yang lebih tegas daripada teks sumber.
- source_word: רֹצֵחַ הוּא
  choice: ia adalah pembunuh
  rationale: Dalam konteks hukum ini, רֹצֵחַ menyatakan status pelaku sebagai orang yang bersalah atas pembunuhan, berbeda dari pembunuhan tidak disengaja yang dibahas dalam pasal ini.
- source_word: מוֹת יוּמַת
  choice: haruslah dihukum mati
  rationale: Gabungan infinitif absolut dan bentuk pasif menyatakan kewajiban hukuman dengan penegasan. Partikel “-lah” mempertahankan nada hukum yang tegas tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: הָרֹצֵחַ
  choice: pembunuh itu
  rationale: Bentuk definit mengulangi status hukum pelaku; “pembunuh itu” alami dan tetap mengacu kepada orang yang baru disebutkan.
theological_decisions:
- issue: Klasifikasi hukum רֹצֵחַ dalam ayat ini
  choice: pembunuh
  alternative: orang yang membunuh; pembantai
  rationale: Ayat ini menetapkan kesalahan yang membawa hukuman mati dalam rangkaian hukum yang membedakan pembunuhan dari kematian tidak disengaja. “Pembunuh” paling tepat menyampaikan status hukum dan moral tersebut tanpa menambahkan ciri motif yang tidak dinyatakan secara eksplisit di ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk hukum bersyarat dan pengulangan “pembunuh” dari teks Ibrani; istilah teknis atau bernuansa denominasi dihindari.
