  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: id
  text: Penuntut darah[a] itu sendirilah yang harus membunuh si pembunuh. Ketika ia bertemu dengannya, dialah yang harus membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembalas darah.” Ungkapan Ibrani ini merupakan istilah hukum tetap bagi anggota keluarga yang bertanggung jawab menuntut pembalasan atas penumpahan darah yang tidak sah.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: penuntut darah
  rationale: Dalam konteks hukum pembunuhan di Bilangan 35, ungkapan tetap ini menunjuk kepada anggota keluarga yang bertanggung jawab menuntut pembalasan atas darah yang ditumpahkan. Pilihan ini mempertahankan istilah hukum tersebut tanpa memasukkan makna teologis 'penebus' yang tidak dimaksudkan di sini.
- source_word: הוּא
  choice: itu sendirilah / dialah
  rationale: Kata ganti mandiri ini bersifat menegaskan. Bentuk 'sendirilah' dan 'dialah' menyampaikan bahwa penuntut darah tersebut secara pribadi menjadi pelaksana tindakan itu.
- source_word: יָמִית / יְמִיתֶנּוּ
  choice: harus membunuh / harus membunuhnya
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati atau membunuh. Dalam konstruksi hukum ini, 'harus membunuh' menyampaikan kewajiban yang dinyatakan teks tanpa memberi kesan bahwa penuntut darah hanya menjatuhkan vonis.
- source_word: הָרֹצֵחַ
  choice: si pembunuh
  rationale: Dalam konteks langsung, istilah ini menunjuk kepada orang yang melakukan pembunuhan dan harus menanggung hukuman mati. 'Si pembunuh' jelas, alami, dan mempertahankan rujukan tertentu dari bentuk Ibrani.
- source_word: בְּפִגְעוֹ בוֹ
  choice: ketika ia bertemu dengannya
  rationale: Frasa ini menyatakan saat penuntut darah berjumpa atau berhadapan dengan pembunuh. Terjemahan ini mempertahankan arti temporal dan tidak menambahkan rincian tentang tempat atau cara perjumpaan.
theological_decisions:
- issue: Peran hukum גֹּאֵל הַדָּם
  choice: Dipahami sebagai anggota keluarga yang bertindak sebagai penuntut darah dalam kerangka hukum Israel.
  alternative: Penebus darah atau pembalas darah.
  rationale: Konteksnya adalah hukum pembunuhan, bukan tema penebusan teologis. 'Penuntut darah' mempertahankan fungsi hukum-kekerabatan itu, sedangkan alternatif 'pembalas darah' dicatat agar unsur pembalasan dalam istilah aslinya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pengulangan tindakan serta penegasan pelakunya dipertahankan karena keduanya menonjol dalam teks Ibrani.
