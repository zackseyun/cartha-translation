source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa di dataran Moab, di tepi Sungai Yordan dekat Yerikho, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam rumus naratif tentang perkataan ilahi, bentuk ini secara alami dan bermartabat diterjemahkan “berfirman” dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Terjemahan langsung dan wajar untuk penerima firman.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עֲרָבוֹת menunjuk kawasan dataran atau stepa; “dataran Moab” jelas dan sesuai dengan sebutan geografis yang lazim.
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: di tepi Sungai Yordan dekat Yerikho
  rationale: Ungkapan geografis ini menyatakan lokasi di sisi Yordan yang berhadapan dengan atau berada dekat Yerikho; “dekat Yerikho” menghindari kesan keliru bahwa Yerikho menerangkan nama sungai.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perkataan yang menyusul; dalam bahasa Indonesia, “demikian:” menghubungkan rumus pembuka dengan kutipan secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani menggunakan Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan formula pembuka firman ilahi, sementara keterangan geografis dibuat alami dan tidak ambigu bagi pembaca umum.
