  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: id
  text: Sebab ia harus tetap tinggal di kota perlindungannya sampai imam besar meninggal. Setelah imam besar meninggal, orang yang membunuh itu[a] boleh kembali ke tanah miliknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang menyebabkan kematian itu.” Istilah Ibrani di sini merupakan kategori hukum dalam ketentuan tentang kota-kota perlindungan dan tidak dengan sendirinya berarti orang yang membunuh dengan sengaja.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke tanah yang menjadi hak miliknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ketentuan hukum sebelumnya; “Sebab” wajar sebagai penghubung penjelas pada awal kalimat.
- source_word: בְעִיר מִקְלָטוֹ
  choice: di kota perlindungannya
  rationale: Menyampaikan frasa posesif Ibrani secara ringkas dan mempertahankan istilah hukum “kota perlindungan” dalam konteks ini.
- source_word: יֵשֵׁב
  choice: harus tetap tinggal
  rationale: Dalam konteks hukum, verba ini bukan sekadar menyatakan tempat tinggal, melainkan kewajiban untuk menetap dan tidak meninggalkan kota perlindungan.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: sampai imam besar meninggal
  rationale: Ungkapan verbal ini lebih alami dalam bahasa Indonesia modern daripada bentuk nominal “sampai kematian imam besar,” tanpa mengubah batas waktu yang dinyatakan teks.
- source_word: וְאַחֲרֵי מוֹת הַכֹּהֵן הַגָּדֹל
  choice: Setelah imam besar meninggal
  rationale: Mempertahankan urutan waktu dan pengulangan sebutan “imam besar” yang terdapat dalam rumusan hukum Ibrani.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh itu
  rationale: Pilihan ini menyatakan bahwa orang tersebut telah menyebabkan kematian tanpa otomatis menetapkannya sebagai pembunuh dengan niat jahat; bentuk definit mempertahankan rujukan kepada pelaku yang sedang dibahas.
- source_word: יָשׁוּב
  choice: boleh kembali
  rationale: Dalam konteks ini, kembalinya orang itu merupakan izin hukum yang dipulihkan setelah sebelumnya ia diwajibkan menetap di kota perlindungan.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: ke tanah miliknya
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arti tanah yang menjadi milik atau pegangan tetap orang tersebut, tanpa memasukkan nuansa teologis tambahan dari kata “warisan.”
theological_decisions:
- issue: Apakah הָרֹצֵחַ harus diterjemahkan sebagai “pembunuh” atau dengan istilah yang tidak langsung menetapkan pembunuhan berencana
  choice: orang yang membunuh itu
  alternative: pembunuh
  rationale: Hukum kota perlindungan membedakan pembunuhan dengan niat jahat dari tindakan membunuh tanpa sengaja. “Pembunuh” dalam pemakaian Indonesia mudah dipahami sebagai vonis moral atau pidana yang lebih tegas, sedangkan frasa yang dipilih mempertahankan kategori hukum yang lebih terbuka dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan “harus tetap tinggal” menegaskan kewajiban hukum, sedangkan “boleh kembali” menegaskan izin yang berlaku setelah imam besar meninggal. Penanda catatan kaki ditempatkan langsung pada ungkapan yang dijelaskannya.
