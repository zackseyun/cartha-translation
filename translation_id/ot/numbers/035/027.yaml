base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: id
  text: dan pembalas darah[a] menemukan orang itu di luar batas kota perlindungannya, lalu pembalas darah itu membunuh orang yang menyebabkan kematian itu, pembalas darah itu tidak menanggung kesalahan darah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penuntut balas darah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tidak ada darah baginya,” suatu ungkapan yang berarti bahwa pembalas darah itu tidak menanggung kesalahan atas penumpahan darah tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: penuntut balas darah
  rationale: Dalam hukum kota perlindungan, ungkapan ini menunjuk kepada orang yang berwenang menuntut pembalasan atas darah orang yang terbunuh. Pilihan ini jelas dalam bahasa Indonesia dan tidak menambahkan hubungan kekerabatan yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: מִחוּץ לִגְבוּל
  choice: di luar batas
  rationale: Ungkapan ini menyatakan bahwa orang tersebut berada di luar wilayah kota perlindungan yang memberi perlindungan hukum. 'Batas' mempertahankan makna ruang sekaligus hukum.
- source_word: עִיר מִקְלָטוֹ
  choice: kota perlindungannya
  rationale: Ini merupakan sebutan institusional bagi kota tempat orang yang telah menyebabkan kematian dapat mencari perlindungan. Bentuk posesif mencerminkan sufiks Ibrani.
- source_word: וְרָצַח
  choice: membunuh
  rationale: Kata kerja diterjemahkan secara netral karena klausa terakhir menyatakan bahwa tindakan ini tidak mendatangkan kesalahan darah. 'Membunuh' tidak dengan sendirinya menetapkan tindakan itu sebagai pembunuhan kriminal.
- source_word: הָרֹצֵחַ
  choice: orang yang telah membunuh
  rationale: Dalam konteks hukum kota perlindungan, istilah ini dapat menunjuk kepada orang yang menyebabkan kematian tanpa sengaja. Frasa deskriptif ini menghindari kesan bahwa ia pasti seorang pembunuh yang bertindak dengan niat jahat.
- source_word: אֵין לוֹ דָּם
  choice: ia tidak menanggung kesalahan darah
  rationale: Terjemahan ini menyampaikan arti hukum dari idiom Ibrani, yakni penuntut balas darah itu tidak dikenai tanggung jawab atas darah yang ditumpahkan, sementara catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Daya moral dan hukum kata רצח dalam konteks pembunuhan yang tidak mendatangkan kesalahan darah
  choice: Menerjemahkan kata kerja secara netral dengan 'membunuh'.
  alternative: Menerjemahkannya sebagai 'membunuh secara keji' atau dengan istilah yang secara langsung menyatakan pembunuhan kriminal.
  rationale: Ayat ini secara eksplisit menyatakan bahwa penuntut balas darah tidak menanggung kesalahan darah. Istilah yang selalu menyiratkan kejahatan akan menciptakan pertentangan yang tidak terdapat dalam konteks hukum Ibrani.
- issue: Acuan pronomina dalam אֵין לוֹ דָּם
  choice: Mempertahankan pronomina 'ia' dalam teks, dengan urutan klausa yang membuat penuntut balas darah menjadi acuan paling wajar.
  alternative: Mengganti pronomina dengan 'penuntut balas darah itu' demi menghilangkan seluruh kemungkinan ambiguitas.
  rationale: Bentuk Ibrani memakai pronomina, tetapi konteks hukum menunjukkan bahwa orang yang membunuh si pelarian itulah yang tidak menanggung kesalahan darah. Terjemahan mempertahankan bentuk pronominal tanpa mengaburkan acuan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan rangkaian hukum ayat sumber yang melanjutkan ketentuan sebelumnya. Pengulangan 'penuntut balas darah' dipertahankan karena terdapat dalam bahasa Ibrani dan membantu memperjelas pelaku tindakan.
