  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: id
  text: Perintahkanlah orang Israel[a] untuk memberikan kepada orang Lewi, dari milik pusaka mereka, kota-kota untuk didiami; dan tanah terbuka[b] di sekeliling kota-kota itu harus kalian berikan kepada orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; maksudnya bangsa Israel.'
    reason: lexical_alternative
  - marker: b
    text: “Tanah terbuka” adalah lahan di sekeliling sebuah kota, antara lain untuk menggembalakan ternak dan keperluan bersama.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Perintahkanlah
  rationale: Bentuk imperatif kepada Musa menuntut perintah yang tegas; bentuk ini tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti 'anak-anak lelaki Israel', tetapi di sini menunjuk secara kolektif kepada bangsa Israel; 'orang Israel' alami dan tidak mempersempit acuannya hanya kepada laki-laki.
- source_word: וְנָתְנוּ
  choice: untuk memberikan
  rationale: Sesudah verba 'perintahkanlah', bentuk ini menyatakan isi atau hasil yang diperintahkan secara alami dalam bahasa Indonesia.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Menandai penerima pemberian secara langsung dan sesuai pemakaian modern.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: dari milik pusaka mereka
  rationale: Frasa ini mempertahankan gagasan kepemilikan sekaligus warisan tanah turun-temurun tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: עָרִים לָשָׁבֶת
  choice: kota-kota untuk didiami
  rationale: Infinitif menyatakan tujuan; bentuk pasif ini ringkas, jelas, dan sesuai register teks hukum.
- source_word: מִגְרָשׁ
  choice: tanah terbuka
  rationale: Istilah ini menunjuk lahan terbuka milik kota di sekelilingnya, termasuk untuk penggembalaan dan keperluan bersama; 'tanah terbuka' tidak membatasi fungsinya hanya sebagai padang rumput.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: di sekeliling kota-kota itu
  rationale: Menjelaskan bahwa lahan tersebut mengelilingi kota-kota yang baru disebut; akhiran pronominal Ibrani secara gramatikal merujuk kepada kota-kota.
- source_word: תִּתְּנוּ
  choice: harus kalian berikan
  rationale: Mempertahankan peralihan dari orang ketiga jamak pada bagian awal kepada orang kedua jamak dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas tetapi tetap mudah dipahami. Peralihan subjek dari orang ketiga jamak ('mereka') ke orang kedua jamak ('kalian') dipertahankan karena terdapat dalam teks Ibrani. Semua penanda catatan kaki ditempatkan dalam teks utama.
