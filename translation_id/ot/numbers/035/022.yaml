id: NUM.35.22
reference: Numbers 35:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: id
  text: Namun, jika ia tiba-tiba mendorong orang itu tanpa rasa permusuhan, atau melemparkan benda apa pun kepadanya tanpa mengintai[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tanpa menyergap"; maksudnya, tanpa menunggu kesempatan untuk menyerangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Dalam konteks hukum ini, frasa tersebut memperkenalkan keadaan yang berlawanan dengan kasus yang disengaja pada ayat-ayat sebelumnya.
- source_word: בְּפֶתַע
  choice: tiba-tiba
  rationale: Kata ini menyatakan tindakan yang terjadi secara mendadak; padanan ini alami dan tepat dalam bahasa Indonesia.
- source_word: בְּלֹא אֵיבָה
  choice: tanpa rasa permusuhan
  rationale: אֵיבָה menunjuk pada permusuhan atau kebencian antarpribadi. Frasa ini jelas bagi pembaca modern tanpa mempersempit maknanya menjadi sekadar emosi sesaat.
- source_word: הֲדָפוֹ
  choice: mendorong orang itu
  rationale: Verba ini berarti mendorong atau mendesak. Penyebutan 'orang itu' menghindari ambiguitas pronomina bahasa Indonesia.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: melemparkan ... kepadanya
  rationale: Gabungan verba dengan עַל menunjukkan benda dilemparkan ke arah atau mengenai orang tersebut; 'kepadanya' mempertahankan cakupan itu secara alami.
- source_word: כָּל כְּלִי
  choice: benda apa pun
  rationale: כְּלִי adalah istilah luas untuk barang, alat, atau benda; padanan ini menjaga keluasan makna dalam konteks hukum.
- source_word: בְּלֹא צְדִיָּה
  choice: tanpa mengintai
  rationale: צְדִיָּה menggambarkan tindakan menunggu atau mengintai untuk menyerang. Padanan konkret ini tidak memasukkan kategori hukum modern yang lebih luas seperti 'tanpa perencanaan'.
