  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: id
  text: Semua kota yang harus kamu berikan kepada orang Lewi berjumlah empat puluh delapan kota, beserta tanah lapang di sekeliling kota-kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “padang penggembalaan” atau “tanah umum”; yaitu lahan di sekitar kota-kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Semua kota
  rationale: כָּל mencakup keseluruhan kota yang dimaksud, sedangkan עִיר secara wajar diterjemahkan 'kota' dalam konteks hukum ini.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: yang harus kamu berikan
  rationale: Bentuk imperfek orang kedua jamak berada dalam konteks perintah, sehingga 'harus ... berikan' menyampaikan daya wajibnya secara alami. Bahasa Indonesia memakai 'kamu' tanpa membedakan tunggal dan jamak.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Menunjuk kelompok keturunan Lewi sebagai penerima; 'orang Lewi' merupakan sebutan Indonesia yang lazim.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: empat puluh delapan kota
  rationale: Ungkapan bilangan Ibrani secara idiomatis dinyatakan dengan susunan bilangan modern Indonesia.
- source_word: אֶתְהֶן
  choice: berjumlah ... kota
  rationale: Penanda objek dengan pronomina ini mengulang kota-kota yang dihitung. Susunan 'berjumlah empat puluh delapan kota' menyampaikan penegasan jumlah tanpa menghasilkan frasa Indonesia yang janggal.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: beserta tanah lapang di sekelilingnya
  rationale: מִגְרָשׁ ialah lahan terbuka di sekitar kota yang dapat berfungsi sebagai padang penggembalaan atau tanah bersama. Terjemahan utama mempertahankan cakupan ruangnya; catatan kaki memberi alternatif fungsional.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada hukum yang bermartabat. 'Tanah lapang di sekelilingnya' dipilih agar tidak mempersempit מִגְרָשׁ hanya pada satu fungsi.
