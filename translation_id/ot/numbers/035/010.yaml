base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: id
  text: '“Berbicaralah kepada orang Israel[a] dan katakanlah kepada mereka: ‘Ketika kalian menyeberangi Sungai Yordan ke tanah Kanaan,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak Israel.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif piel ini memerintahkan Musa untuk menyampaikan perkataan secara langsung; pilihan ini mempertahankan daya perintah dan pola ‘berbicara ... mengatakan’ dalam bahasa sumber.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan harfiah ‘anak-anak lelaki Israel’ berfungsi sebagai sebutan kolektif bagi umat Israel. ‘Keturunan Israel’ tetap mempertahankan citra kekerabatan tanpa memberi kesan bahwa yang disapa hanya laki-laki.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakanlah kepada mereka
  rationale: Kedua verba dalam rangkaian perintah Ibrani dipertahankan agar struktur dan irama sumber tetap tampak.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Apabila kalian menyeberangi
  rationale: כִּי di sini memperkenalkan keadaan yang akan terjadi, sedangkan konstruksi pronomina dan partisip menyatakan tindakan mendatang yang segera. ‘Apabila’ sesuai dengan konteks ketetapan dan tidak menekankan ketidakpastian.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama geografis ini secara idiomatis diperjelas sebagai sungai dalam bahasa Indonesia, tanpa mengubah referennya.
- source_word: אַרְצָה כְּנָעַן
  choice: dan memasuki tanah Kanaan
  rationale: Akhiran arah pada אַרְצָה menunjukkan gerak masuk atau menuju wilayah Kanaan. ‘Memasuki’ menyampaikan arah yang tersirat secara alami setelah tindakan menyeberangi Yordan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. ‘Kalian’ dipakai karena sapaan Ibrani berbentuk jamak. Struktur ganda ‘Berbicaralah ... dan katakanlah’ dipertahankan, sementara gerak arah dalam frasa terakhir diungkapkan secara idiomatis.
