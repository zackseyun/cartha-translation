base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: id
  text: Atau, jika ia memukul orang itu dengan batu genggam[a] yang dapat mematikan, lalu orang itu mati, ia adalah seorang pembunuh. Pembunuh itu harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “dengan batu tangan”, yaitu batu yang dipegang atau yang cocok digunakan dengan tangan sebagai senjata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Atau jika
  rationale: Memperkenalkan kasus hukum berikutnya dalam rangkaian ketentuan; “Atau jika” menyampaikan hubungan alternatif secara alami dalam bahasa Indonesia.
- source_word: בְּאֶבֶן יָד
  choice: dengan batu yang ada di tangannya
  rationale: Ungkapan Ibrani harfiah “dengan batu tangan” menunjuk pada batu yang dipegang atau cocok digunakan dengan tangan sebagai senjata; pilihan ini mempertahankan gambaran konkretnya.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: yang dapat menyebabkan kematian
  rationale: Klausa ini menerangkan daya mematikan batu tersebut, tanpa membatasi kemungkinan kematian hanya pada korban tertentu.
- source_word: הִכָּהוּ
  choice: ia memukul orang itu
  rationale: נכה berarti memukul atau menghantam; “memukul” wajar dalam bahasa Indonesia dan tidak mendahului pernyataan kematian yang disebut sesudahnya.
- source_word: וַיָּמֹת
  choice: lalu orang itu mati
  rationale: Menyampaikan urutan akibat dalam bahasa Indonesia secara jelas tanpa menambahkan unsur kesengajaan yang tidak dinyatakan dalam klausa ini.
- source_word: רֹצֵחַ הוּא
  choice: ia adalah seorang pembunuh
  rationale: Dalam konteks hukum ini, רצח menyatakan pembunuhan yang menimbulkan kesalahan pidana, bukan sekadar tindakan membunuh secara netral.
- source_word: מוֹת יוּמַת
  choice: harus dihukum mati
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kepastian hukuman; “harus dihukum mati” mempertahankan daya wajib dan khidmat hukum secara alami.
- source_word: הָרֹצֵחַ
  choice: Pembunuh itu
  rationale: Mengulang subjek hukum sebagaimana teks Ibrani dan mempertahankan penekanannya.
theological_decisions:
- issue: Klasifikasi hukum pelaku dalam ketentuan kota perlindungan
  choice: Menerjemahkan רצח sebagai “pembunuh”.
  alternative: “orang yang membunuh” atau “pembantai”
  rationale: Konteks sekitarnya membedakan pembunuhan yang menimbulkan kesalahan dari kematian yang tidak disengaja. “Pembunuh” menyampaikan penilaian hukum dan moral teks tanpa memasukkan doktrin tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum dipertahankan, tetapi pronomina objek diperjelas menjadi “orang itu” agar rujukannya alami dan tidak rancu. Penanda catatan kaki [a] dicantumkan langsung sesudah frasa terkait.
