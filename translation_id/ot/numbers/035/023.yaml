base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: id
  text: atau dengan batu apa pun yang dapat menyebabkan kematian, tanpa melihat[a], ia menjatuhkan batu itu menimpa orang itu sehingga orang itu mati, padahal ia bukan musuhnya dan tidak berusaha mencelakakannya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tanpa melihat.” Ungkapan ini menunjukkan bahwa pelaku tidak menyadari keadaan tersebut, tetapi tidak harus berarti bahwa ia sama sekali tidak melihat secara fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: atau
  rationale: Mempertahankan hubungan disjungtif dengan kemungkinan-kemungkinan hukum pada ayat sebelumnya.
- source_word: בְּכָל אֶבֶן
  choice: dengan batu apa pun
  rationale: Preposisi בְּ berfungsi instrumental, sedangkan כָל menyatakan cakupan yang luas.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: yang dapat menyebabkan kematian
  rationale: Mengungkapkan bahwa batu tersebut mampu mengakibatkan kematian tanpa membuat subjek generik yang terasa janggal dalam bahasa Indonesia.
- source_word: בְּלֹא רְאוֹת
  choice: tanpa melihat
  rationale: Mempertahankan ungkapan konkret dan ambiguitas bahasa Ibrani; unsur ketidaksengajaan tidak dimasukkan secara eksplisit ke dalam teks utama.
- source_word: וַיַּפֵּל עָלָיו
  choice: ia menjatuhkan batu itu ke atas orang tersebut
  rationale: 'Bentuk Hifil dari נפל bersifat kausatif: pelaku menyebabkan batu itu jatuh menimpa orang lain. Penyebutan nomina memperjelas rujukan dalam bahasa Indonesia.'
- source_word: וַיָּמֹת
  choice: sehingga orang itu mati
  rationale: Menampilkan kematian sebagai akibat tindakan sebelumnya dan memperjelas siapa yang mati.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: padahal ia bukan musuhnya
  rationale: Kata 'padahal' menyampaikan fungsi penjelas-konsesif klausa tersebut dalam konteks perkara kematian tanpa permusuhan.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: dan tidak berusaha mencelakakannya
  rationale: רָעָה dalam konteks hukum antarpribadi menunjuk pada celaka atau bahaya; frasa ini menyampaikan ketiadaan niat merugikan secara alami.
