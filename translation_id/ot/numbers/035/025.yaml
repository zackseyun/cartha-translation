source:
  edition: WLC
  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: id
  text: Lalu sidang umat harus melepaskan orang yang membunuh itu dari tangan pembalas darah[a]. Sidang umat harus mengembalikannya ke kota perlindungan tempat ia melarikan diri, dan ia harus tinggal di sana[b] sampai imam besar itu meninggal—imam yang telah diurapi dengan minyak kudus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penebus darah.” Ungkapan Ibrani ini menunjuk kepada orang yang memiliki tanggung jawab hukum untuk membalas penumpahan darah, sering kali seorang kerabat dekat.
    reason: lexical_alternative
  - marker: b
    text: Atau “tetap berada di sana” atau “menetap di sana.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “imam yang ia urapi dengan minyak kudus.” Teks Ibrani memakai bentuk aktif, tetapi tidak menyebutkan secara eksplisit siapa pelaku pengurapan. Terjemahan utama memakai bentuk pasif agar kata ganti itu tidak keliru dipahami merujuk kepada orang yang membunuh.
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: menyelamatkan
  rationale: Bentuk Hifil dari נצל menyatakan pembebasan seseorang dari kuasa pihak lain; “menyelamatkan” wajar dalam bahasa Indonesia dan sesuai dengan tindakan perlindungan hukum dalam konteks ini.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: Dalam Bilangan, istilah ini menunjuk kepada komunitas Israel yang bertindak sebagai badan pengadil. “Umat itu” mempertahankan makna komunal tanpa memberi kesan bahwa yang dimaksud hanya sebuah pertemuan sesaat.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh tersebut
  rationale: Istilah ini dapat menunjuk kepada orang yang menyebabkan kematian, termasuk tanpa sengaja. Pilihan ini tidak langsung menetapkan bahwa ia bersalah melakukan pembunuhan berencana.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan konkret Ibrani dipertahankan karena dapat dipahami secara alami dalam bahasa Indonesia sebagai pelepasan dari kuasa seseorang.
- source_word: גֹּאֵל הַדָּם
  choice: penuntut darah
  rationale: Frasa ini menunjuk kepada orang yang memiliki tanggung jawab hukum-kekerabatan untuk menuntut balas atas darah yang tertumpah. “Penuntut darah” ringkas, dekat dengan bentuk Ibrani, dan cocok dengan konteks hukum kuno.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: harus mengembalikannya
  rationale: Bentuk Hifil dari שוב berarti menyebabkan seseorang kembali; pilihan ini menyampaikan tindakan umat yang membawa orang itu kembali ke tempat perlindungannya.
- source_word: עִיר מִקְלָטוֹ
  choice: kota perlindungan
  rationale: Ini adalah sebutan kelembagaan bagi kota tempat orang yang membunuh tanpa sengaja dapat mencari perlindungan. Bentuk posesif tidak dinyatakan secara kaku karena “kota perlindungannya” dapat terdengar seolah-olah kota itu miliknya.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: tempat ia melarikan diri
  rationale: Klausa ini secara alami menerangkan kota sebagai tujuan pelariannya.
- source_word: וְיָשַׁב בָּהּ
  choice: ia harus tinggal di sana
  rationale: ישב di sini berarti menetap atau tetap tinggal. “Tinggal di sana” merupakan ungkapan Indonesia modern yang jelas.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: sampai imam besar itu meninggal
  rationale: Konstruksi nominal Ibrani dialihkan menjadi klausa verbal yang lebih alami dalam bahasa Indonesia tanpa mengubah batas waktunya.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: imam yang telah ia urapi
  rationale: Teks Ibrani memakai verba aktif orang ketiga tunggal maskulin dan menjadikan imam besar sebagai objek, tetapi tidak menyebutkan secara eksplisit siapa pelaku pengurapan. Bentuk aktif dipertahankan agar ketidakjelasan itu tidak diam-diam diubah menjadi pasif.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: dengan minyak kudus
  rationale: Ungkapan ini menunjuk kepada minyak khusus untuk pengudusan; “minyak kudus” dekat dengan teks sumber dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Status hukum הָרֹצֵחַ dalam ketentuan kota perlindungan
  choice: orang yang membunuh
  alternative: pembunuh; pembunuh manusia
  rationale: Pasal ini membedakan pembunuhan sengaja dari perbuatan yang menyebabkan kematian tanpa sengaja. “Pembunuh” dalam pemakaian umum dapat menyiratkan kesalahan pidana yang sudah pasti, sedangkan “orang yang membunuh” mempertahankan keterbukaan status hukumnya.
- issue: Subjek tersirat dalam מָשַׁח אֹתוֹ
  choice: 'Mempertahankan bentuk aktif: “imam yang telah ia urapi”'
  alternative: imam yang telah diurapi; imam yang diurapi dengan minyak kudus
  rationale: Bahasa Ibrani menggunakan verba aktif dengan subjek orang ketiga tunggal yang tidak disebutkan namanya. Bentuk pasif akan memperlancar kalimat, tetapi juga menghapus ketegangan sintaksis yang benar-benar ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-naratif yang bermartabat. Kalimat dibagi menjadi dua agar mudah dipahami. Istilah “orang yang membunuh” dipilih untuk menghindari penetapan kesalahan yang tidak dinyatakan teks, sedangkan bentuk aktif yang janggal pada klausa terakhir sengaja dipertahankan dan dijelaskan dalam catatan kaki.
