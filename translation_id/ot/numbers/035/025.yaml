revisions:
- from: Lalu umat itu harus menyelamatkan orang yang membunuh tersebut dari tangan penuntut darah[a]. Umat itu harus mengembalikannya ke kota perlindungan tempat ia melarikan diri, dan ia harus tinggal di sana[b] sampai imam besar itu meninggal—imam yang telah ia urapi dengan minyak kudus[c].
  to: Lalu sidang umat harus melepaskan orang yang membunuh itu dari tangan pembalas darah[a]. Sidang umat harus mengembalikannya ke kota perlindungan tempat ia melarikan diri, dan ia harus tinggal di sana[b] sampai imam besar itu meninggal—imam yang telah diurapi dengan minyak kudus[c].
  rationale: Revisi terutama diperlukan untuk mencegah salah-rujuk yang diciptakan oleh kata ganti “ia” dalam bahasa Indonesia. Bentuk pasif tidak mengidentifikasi pelaku pengurapan, sedangkan catatan kaki mempertahankan data sintaksis Ibrani dan ambiguitasnya. Istilah bagi avenger of blood dan congregation juga diperbaiki agar lebih alami serta lebih tepat dalam konteks hukum kuno.
  reviewer_model: gpt-5.6-terra
