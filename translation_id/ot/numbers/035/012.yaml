  - severity: low
    issue: Ungkapan catatan kaki “menuntut balas atas darah yang tertumpah” kurang idiomatis.
    rationale: “Menuntut balas atas pertumpahan darah” lebih lazim dalam bahasa Indonesia dan tetap menjelaskan fungsi go'el tanpa menambah makna.
