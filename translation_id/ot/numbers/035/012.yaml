base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: id
  text: Kota-kota itu hendaklah menjadi tempat perlindungan bagimu dari penuntut balas[a], supaya orang yang membunuh itu tidak mati sampai ia menghadap umat untuk diadili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penuntut balas darah” atau “kerabat penuntut balas”; istilah Ibrani go’el adalah istilah kekerabatan yang di sini menunjuk kepada orang yang menuntut balas atas pertumpahan darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: harus menjadi
  rationale: Bentuk perfektum dengan waw dalam ketetapan hukum ini memiliki daya futur-preskriptif. Pilihan ini menyampaikan fungsi ketetapan secara wajar dalam bahasa Indonesia.
- source_word: הֶעָרִים
  choice: Kota-kota itu
  rationale: Merujuk kembali kepada kota-kota perlindungan yang ditetapkan dalam konteks sebelumnya; bentuk "itu" memperjelas rujukan tersebut.
- source_word: לְמִקְלָט
  choice: tempat perlindungan
  rationale: מִקְלָט menunjuk pada tempat untuk berlindung atau memperoleh perlindungan. Ungkapan ini alami dan tidak memasukkan nuansa kelembagaan modern dari "suaka".
- source_word: מִגֹּאֵל
  choice: dari penuntut balas
  rationale: Dalam hukum mengenai pembunuhan, גֹאֵל adalah kerabat yang menuntut pembalasan atas darah yang tertumpah. Teks utama dibuat ringkas, sedangkan unsur kekerabatan dan darah dijelaskan dalam catatan kaki.
- source_word: וְלֹא יָמוּת
  choice: supaya ... tidak mati
  rationale: Klausa ini menyatakan tujuan atau hasil dari penyediaan tempat perlindungan. Terjemahan ini tidak mempersempit cara atau pelaku kematian.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh itu
  rationale: Istilah רֹצֵחַ di sini mencakup orang yang menyebabkan kematian sebelum kadar kesalahannya diputuskan. Ungkapan verbal ini lebih netral daripada "pembunuh", yang dapat mengisyaratkan vonis bersalah.
- source_word: עַד עָמְדוֹ
  choice: sebelum ia berdiri
  rationale: Infinitif dengan sufiks setelah עַד membentuk batas waktu. Dalam struktur negatif bahasa Indonesia, "tidak mati sebelum" menyampaikan hubungan temporal itu dengan alami.
- source_word: לִפְנֵי הָעֵדָה
  choice: di hadapan umat
  rationale: עֵדָה menunjuk kepada komunitas Israel yang bertindak secara bersama, di sini dalam kapasitas yudisial. "Umat" mempertahankan sifat korporatnya tanpa membatasinya pada sidang pejabat tertentu.
- source_word: לַמִּשְׁפָּט
  choice: untuk diadili
  rationale: מִשְׁפָּט di sini menunjuk pada proses atau keputusan hukum. Bentuk pasif ini idiomatis dalam bahasa Indonesia dan jelas menyatakan tujuan menghadap umat.
theological_decisions:
- issue: Status hukum הָרֹצֵחַ sebelum putusan
  choice: orang yang membunuh itu
  alternative: pembunuh; pembunuh manusia
  rationale: Ayat ini menunda akibat akhir sampai orang tersebut menghadap umat untuk diadili. Pilihan ini tidak lebih dahulu memutuskan apakah pembunuhan itu disengaja atau tidak.
- issue: Makna khusus גֹאֵל dalam hukum pembunuhan
  choice: penuntut balas dalam teks utama, dengan penjelasan tentang pembalasan darah dan hubungan kekerabatan dalam catatan kaki
  alternative: penuntut balas darah; kerabat penuntut balas
  rationale: Istilah Ibrani tersebut mengandung unsur kewajiban kerabat dan dalam konteks ini berfungsi menuntut balas atas darah. Susunan ini menjaga keterbacaan sekaligus mempertahankan nuansa hukum-kekerabatannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi hukum dibuat jelas bagi pembaca umum tanpa memakai istilah teknis modern yang dapat mempersempit cakupan teks. Penanda catatan kaki [a] ditempatkan langsung setelah istilah terkait.
