  source_fidelity: 'Terjemahan pada dasarnya mengikuti struktur dan makna Ibrani dengan baik: kota-kota berfungsi sebagai perlindungan dari go''el, dan orang yang telah membunuh tidak boleh mati sebelum proses pengadilan komunitas berlangsung. Namun, “sebelum ia berdiri” tidak menyatakan batas temporal עַד secara setepat “sampai ia menghadap”; bentuk terakhir juga lebih idiomatis dalam konteks hukum Indonesia.'
  naturalness: Bahasa draf umumnya baku dan jelas. “Tidak mati sebelum ia berdiri di hadapan umat” dapat dipahami, tetapi terdengar terlalu harfiah dan berpotensi menggeser arti “sampai ia menghadap.” “Menghadap umat untuk diadili” menyampaikan tindakan yudisial yang dimaksud secara alami.
  terminology: “Penuntut balas” adalah padanan utama yang dapat diterima bagi גֹאֵל, dengan catatan kaki yang mempertahankan unsur pembalasan darah dan kekerabatan. “Umat” dapat dipakai untuk הָעֵדָה, meskipun konteksnya adalah umat/komunitas yang bertindak dalam kapasitas peradilan. “Orang yang membunuh itu” tidak memvonisnya sebagai pembunuh berencana dan karenanya menjaga status hukumnya sebelum pengadilan.
