base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: id
  text: Janganlah kamu menerima uang tebusan[a] bagi seseorang untuk melarikan diri ke kota perlindungannya[b] dan kembali tinggal di negeri itu sebelum imam itu meninggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembayaran pengganti”; kata Ibrani כֹּפֶר berarti harga tebusan atau pembayaran sebagai pengganti.
    reason: lexical_alternative
  - marker: b
    text: Susunan bahasa Ibrani sangat padat dan juga dapat dipahami sebagai larangan menerima pembayaran yang berkaitan dengan tinggalnya di kota perlindungan atau kepulangannya dari sana sebelum imam meninggal.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: uang tebusan
  rationale: Kata ini menunjuk pada harga tebusan atau pembayaran pengganti yang diterima sebagai ganti konsekuensi hukum. “Uang tebusan” alami dalam bahasa Indonesia dan lebih tepat daripada “suap,” yang terlalu menilai motif.
- source_word: לָנוּס
  choice: bagi orang yang telah melarikan diri
  rationale: Infinitif נוּס berarti “melarikan diri.” Dalam konteks kota perlindungan, bentuk ini secara wajar merujuk kepada orang yang telah melarikan diri ke sana, meskipun konstruksi Ibraninya ringkas.
- source_word: עִיר מִקְלָטוֹ
  choice: kota perlindungannya
  rationale: Mempertahankan istilah hukum bagi kota suaka yang ditetapkan serta sufiks milik orang tersebut.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: kembali dan tinggal di negeri itu
  rationale: Dua infinitif menyatakan kembali lalu menetap lagi; ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: sebelum imam itu meninggal
  rationale: Dalam larangan ini, frasa tersebut menetapkan bahwa kepulangan tidak boleh terjadi hingga kematian imam; “sebelum ... meninggal” menyampaikan batas hukum itu tanpa kesan bahwa kepulangan diizinkan selama masa tersebut.
theological_decisions:
- issue: Cakupan larangan pembayaran sehubungan dengan kota perlindungan dan kepulangan pembunuh tak sengaja
  choice: Ayat ini melarang penerimaan pembayaran yang memungkinkan orang yang telah lari ke kota perlindungan kembali dan tinggal di negeri itu sebelum imam meninggal.
  alternative: Pembayaran itu dapat dipahami lebih khusus sebagai tebusan yang berkaitan dengan pelariannya ke kota perlindungan atau dengan tetap tinggal di sana.
  rationale: Sintaks Ibrani sangat padat. Teks utama mengikuti hubungan tujuan/hasil yang paling wajar dalam konteks, sedangkan catatan kaki mempertahankan kemungkinan cakupan lain tanpa menetapkan tafsir doktrinal yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” mengikuti sapaan jamak kepada umat, sedangkan “imam itu” mempertahankan bentuk tertentu dalam teks Ibrani. Istilah “kota perlindungan” dipakai sebagai ungkapan hukum yang mudah dipahami.
