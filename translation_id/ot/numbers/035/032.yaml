revisions:
- from: Janganlah kamu menerima uang tebusan[a] bagi orang yang telah melarikan diri ke kota perlindungannya[b], agar ia dapat kembali dan tinggal di negeri itu sebelum imam itu meninggal.
  to: Janganlah kamu menerima uang tebusan[a] bagi seseorang untuk melarikan diri ke kota perlindungannya[b] dan kembali tinggal di negeri itu sebelum imam itu meninggal.
  rationale: Revisi mempertahankan infinitif לָנוּס sebagai “untuk melarikan diri,” tidak mengubahnya menjadi pelarian yang telah terjadi. Koordinasi “dan kembali tinggal” merepresentasikan hubungan sintaktis yang padat tanpa menambahkan hubungan tujuan yang dapat disalahpahami sebagai izin. Catatan kaki b diselaraskan dengan pembacaan alternatif atas sintaks Ibrani dan tetap mempertahankan ambiguitasnya.
