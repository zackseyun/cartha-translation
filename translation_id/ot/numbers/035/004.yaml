base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: id
  text: Tanah terbuka di sekeliling kota-kota yang kamu berikan kepada orang Lewi harus membentang dari tembok kota ke arah luar sejauh seribu hasta pada setiap sisi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama” atau “tanah lapang”; yang dimaksud ialah lahan di sekeliling kota-kota itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari tembok kota”; sebagian orang memahaminya secara lebih umum sebagai “dari batas kota.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: tanah-tanah terbuka di sekeliling
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka yang menyertai kota-kota orang Lewi dan dapat digunakan antara lain untuk ternak. Pilihan ini mempertahankan cakupan istilah tanpa membatasinya hanya pada fungsi penggembalaan.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עִיר dapat berarti kota atau permukiman; 'kota-kota' sesuai dengan konteks kota-kota orang Lewi dan pemakaian Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: yang kamu berikan
  rationale: Klausa relatif ini menyatakan tindakan yang diperintahkan dalam konteks mendatang; bentuk Indonesia ini alami dan tetap memelihara daya instruksional konteks.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Menunjukkan penerima kota-kota beserta lahan di sekelilingnya secara langsung dan alami dalam bahasa Indonesia.
- source_word: מִקִּיר הָעִיר
  choice: dari tembok kota
  rationale: קִיר pada arti lugasnya adalah 'tembok'. Terjemahan ini mempertahankan titik awal pengukuran yang disebutkan dalam teks Ibrani.
- source_word: וָחוּצָה
  choice: ke arah luar
  rationale: Bentuk ini menyatakan arah menuju bagian luar, yang diterjemahkan secara idiomatis tanpa menghilangkan unsur arahnya.
- source_word: אֶלֶף אַמָּה
  choice: seribu hasta
  rationale: Ukuran kuno dalam teks dipertahankan, bukan dikonversi, agar ketepatan dan latar historisnya terjaga.
- source_word: סָבִיב
  choice: pada setiap sisi
  rationale: סָבִיב menunjukkan bahwa ukuran itu berlaku mengelilingi kota; 'pada setiap sisi' menyampaikan daya distributif tersebut dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan susunan yang mudah dipahami. Istilah ukuran kuno 'hasta' dipertahankan. Bentuk 'kamu' mengikuti sapaan jamak dalam konteks, sementara makna jamaknya ditentukan oleh konteks Indonesia.
