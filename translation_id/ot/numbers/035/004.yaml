  to: Tanah terbuka di sekeliling kota-kota yang kamu berikan kepada orang Lewi harus membentang dari tembok kota ke arah luar sejauh seribu hasta pada setiap sisi.[a][b]
  rationale: Revisi mengganti ungkapan pengukuran yang kurang idiomatis dengan "harus membentang ... sejauh," sehingga tanah terbuka dipahami sebagai area yang ukurannya dihitung dari tembok kota ke arah luar. Istilah "tanah terbuka" juga dinaturalkan tanpa mempersempit cakupan leksikal מִגְרָשׁ. Catatan kaki tetap mempertahankan alternatif leksikal dan ambiguitas mengenai titik awal pengukuran.
