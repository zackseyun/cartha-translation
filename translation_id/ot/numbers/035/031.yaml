  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: id
  text: Janganlah kamu menerima uang tebusan untuk nyawa seorang pembunuh yang patut dihukum mati, sebab ia pasti harus dihukum mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebab ia pasti harus dihukum mati.” Konstruksi Ibrani menegaskan kepastian dan kewajiban hukuman ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: menerima
  rationale: Dalam konteks hukum bersama כֹּפֶר, verba ini berarti menerima suatu pembayaran, bukan sekadar mengambil.
- source_word: כֹּפֶר
  choice: uang tebusan
  rationale: Istilah ini menunjuk pada pembayaran untuk menghindarkan hukuman atau memperoleh pembebasan; 'uang tebusan' menyampaikan fungsi hukumnya dengan jelas.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: untuk nyawa seorang pembunuh
  rationale: נֶפֶשׁ di sini mengacu pada nyawa yang hendak diselamatkan melalui pembayaran; ungkapan ini mempertahankan bentuk dan maksud teks Ibrani.
- source_word: רֹצֵחַ
  choice: pembunuh
  rationale: Konteks Bilangan 35 membedakan pembunuhan tidak disengaja dari pembunuhan yang mendatangkan kesalahan hukuman mati.
- source_word: רָשָׁע לָמוּת
  choice: patut dihukum mati
  rationale: Dalam konteks peradilan, frasa ini menyatakan bahwa orang tersebut secara hukum layak atau wajib menerima hukuman mati.
- source_word: כִּי מוֹת יוּמָת
  choice: sebab ia harus dihukum mati
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kepastian dan kewajiban hukuman; 'harus' menyampaikan daya wajibnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya hukum putusan mati
  choice: Ayat ini melarang penggantian hukuman mati dengan pembayaran bagi pembunuh yang patut dihukum mati.
  alternative: Ayat ini hanya menggambarkan kebiasaan hukum tanpa menetapkan kewajiban yang tegas.
  rationale: Larangan לֹא תִקְחוּ dan konstruksi penegas מוֹת יוּמָת menunjukkan perintah hukum yang mengikat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum. 'Uang tebusan' dipilih agar pembayaran yang dimaksud tidak disalahpahami sebagai tebusan bagi korban; 'patut dihukum mati' menyampaikan tanggung jawab hukum tanpa ungkapan yang kaku.
