  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: id
  text: Janganlah kamu menajiskan negeri yang kamu diami, yang di tengah-tengahnya Aku berdiam, sebab Aku, Yahweh, berdiam di tengah-tengah umat Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tengah-tengah anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְטַמֵּא
  choice: menajiskan
  rationale: Bentuk Piel dari טמא berarti membuat najis atau mencemarkan. “Menajiskan” mempertahankan nuansa ritual sekaligus moral dalam konteks penumpahan darah.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Di sini אֶרֶץ menunjuk pada wilayah tempat Israel menetap, bukan seluruh bumi; “negeri” alami dalam konteks geografis-kovenantal ini.
- source_word: יֹשְׁבִים בָּהּ
  choice: yang kamu diami
  rationale: Ungkapan ini menyatakan tempat tinggal atau menetap dan mempertahankan kaitannya dengan “negeri” secara ringkas dan wajar.
- source_word: שֹׁכֵן
  choice: berdiam
  rationale: Kata שכן menyatakan kehadiran yang menetap. “Berdiam” mempertahankan gema teologis kehadiran ilahi tanpa menambahkan gagasan teknis yang tidak dinyatakan langsung.
- source_word: בְּתוֹכָהּ
  choice: tempat Aku berdiam
  rationale: Secara harfiah berarti “di tengah-tengahnya.” Dalam bahasa Indonesia, klausa “tempat Aku berdiam” menyampaikan kehadiran Allah di negeri itu secara alami tanpa mengubah rujukannya.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi larangan sebelumnya; “sebab” menyatakan hubungan penjelas itu dengan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan suatu gelar.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: di tengah-tengah umat Israel
  rationale: בני ישראל secara harfiah “anak-anak lelaki Israel,” tetapi sebagai sebutan kolektif menunjuk seluruh bangsa keturunan Israel. “Umat Israel” menyampaikan rujukan kolektif itu dengan alami; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung, sehingga transliterasi “Yahweh” mempertahankan statusnya sebagai nama pribadi.
- issue: Makna kolektif בני ישראל
  choice: umat Israel
  alternative: anak-anak Israel; orang-orang Israel
  rationale: Walaupun bentuk Ibraninya secara gramatikal maskulin dan harfiahnya “anak-anak lelaki Israel,” ungkapan baku ini merujuk secara kolektif kepada bangsa Israel. Terjemahan utama memakai ungkapan Indonesia yang alami, sementara bentuk harfiah dipertahankan dalam catatan.
- issue: Kehadiran Allah di negeri dan di tengah Israel
  choice: mempertahankan kedua pernyataan tentang Allah yang berdiam
  alternative: menggabungkannya menjadi satu pernyataan umum tentang kehadiran Allah
  rationale: Pengulangan שכן dan תוך menegaskan bahwa larangan menajiskan negeri beralasan pada kehadiran Yahweh di sana dan di tengah umat-Nya; kedua unsur tersebut perlu tetap terdengar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan larangan, alasan yang diperkenalkan oleh “sebab,” pengulangan “berdiam,” serta nama ilahi Yahweh.
