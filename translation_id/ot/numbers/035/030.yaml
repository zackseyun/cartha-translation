source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: id
  text: Siapa pun yang membunuh seseorang, pembunuh itu harus dihukum mati berdasarkan kesaksian saksi-saksi[a]; tetapi satu orang saksi saja tidak boleh memberikan kesaksian terhadap seseorang sehingga ia dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut para saksi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: yang membunuh seseorang
  rationale: Secara harfiah frasa ini menunjuk kepada orang yang memukul suatu nefesy; dalam konteks hukum ini, tindakan tersebut mengakibatkan kematian. Pilihan ini alami dalam bahasa Indonesia dan diperjelas oleh sebutan 'pembunuh' pada klausa berikutnya.
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Dalam kedua pemakaiannya, kata ini merujuk kepada manusia atau nyawa manusia, bukan 'jiwa' sebagai unsur yang terpisah dari tubuh.
- source_word: לְפִי עֵדִים
  choice: berdasarkan kesaksian beberapa saksi
  rationale: Ungkapan harfiah 'menurut mulut para saksi' merupakan idiom hukum yang berarti berdasarkan kesaksian mereka. Bentuk jamak dipertahankan, sedangkan klausa berikut menegaskan bahwa satu saksi tidak cukup.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: pembunuh itu harus dihukum mati
  rationale: Bahasa Ibrani memakai akar רצח baik untuk pelaku maupun tindakan menjatuhkan kematian kepadanya. Terjemahan ini menyampaikan hukuman yudisial tanpa memberi kesan bahwa pengadilan melakukan pembunuhan melawan hukum.
- source_word: הָרֹצֵחַ
  choice: pembunuh
  rationale: Konteks membicarakan pelaku pembunuhan yang dapat dikenai hukuman mati, sehingga 'pembunuh' lebih tepat daripada istilah umum seperti 'orang yang membunuh'.
- source_word: וְעֵד אֶחָד
  choice: tetapi satu orang saksi saja
  rationale: Kata sambung dipahami secara kontras. Partikel 'saja' menyatakan dengan alami bahwa kesaksian tunggal tidak memadai.
- source_word: לֹא יַעֲנֶה
  choice: tidak boleh memberikan kesaksian
  rationale: Dalam konteks peradilan, ענה berarti memberi kesaksian. Modalitas 'tidak boleh' mengungkapkan larangan hukum.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: yang menyebabkan seseorang dihukum mati
  rationale: Frasa hukum yang padat ini menunjuk pada kesaksian terhadap seseorang yang berujung pada hukuman mati. Rumusan Indonesia ini mempertahankan akibat yudisial tanpa menyiratkan bahwa saksi sendiri membunuh orang itu.
theological_decisions:
- issue: Syarat pembuktian dalam perkara yang berujung pada hukuman mati
  choice: Kesaksian beberapa saksi menjadi dasar hukuman, sedangkan satu saksi tidak memadai.
  alternative: Menerjemahkan bentuk jamak hanya sebagai 'saksi-saksi' tanpa memperjelas kontras dengan satu saksi.
  rationale: Kontras eksplisit antara עֵדִים dan עֵד אֶחָד menunjukkan pluralitas saksi yang memadai, tetapi ayat ini sendiri tidak menyatakan angka tertentu selain menolak satu orang saksi.
translation_notes:
  register: Bahasa hukum yang modern, lugas, dan bermartabat. 'Dihukum mati' dipilih daripada 'dieksekusi' agar mudah dipahami secara luas. Ambiguitas mengenai jumlah tepat saksi tidak diselesaikan melampaui bentuk jamak dalam teks Ibrani.
