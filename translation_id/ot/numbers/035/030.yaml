  to: Siapa pun yang membunuh seseorang, pembunuh itu harus dihukum mati berdasarkan kesaksian saksi-saksi[a]; tetapi satu orang saksi saja tidak boleh memberikan kesaksian terhadap seseorang sehingga ia dihukum mati.
