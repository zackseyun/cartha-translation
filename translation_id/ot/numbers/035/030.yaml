  verdict: revise
  source_fidelity: Terjemahan menangkap konteks hukum dan hukuman mati dengan tepat. Namun, “beberapa saksi” dapat dalam pemakaian modern menyiratkan jumlah yang relatif lebih banyak atau tidak tentu, sedangkan Ibrani hanya memakai bentuk jamak dan mengontraskannya dengan “satu saksi”; teks tidak menentukan jumlah tepatnya.
  naturalness: Bahasa Indonesia pada umumnya jelas, formal, dan sesuai register hukum. “Berdasarkan kesaksian saksi-saksi” alami dan lebih netral daripada “berdasarkan kesaksian beberapa saksi.”
  terminology: “Pembunuh” dan “dihukum mati” tepat untuk konteks ini. “Memberikan kesaksian terhadap seseorang sehingga ia dihukum mati” menyatakan arah kesaksian serta konsekuensi kapital tanpa menyiratkan bahwa saksi sendiri menjatuhkan atau melaksanakan hukuman.
  issues:
