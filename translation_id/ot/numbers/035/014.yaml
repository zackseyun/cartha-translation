id: NUM.35.14
reference: Numbers 35:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: id
  text: Tiga dari kota-kota itu harus kamu tetapkan di seberang Sungai Yordan[a], dan tiga dari kota-kota itu harus kamu tetapkan di tanah Kanaan. Kota-kota itu akan menjadi kota-kota perlindungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “harus kamu berikan”; dalam konteks ini maksudnya ialah menetapkan atau mengkhususkan kota-kota tersebut untuk tujuan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: harus kamu tetapkan
  rationale: Secara harfiah berarti 'memberikan', tetapi dalam konteks hukum-administratif ini menunjuk pada penetapan kota-kota bagi suatu fungsi tertentu. 'Tetapkan' menyampaikan maksud itu secara alami dan tepat.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini menunjukkan sisi lain Yordan tanpa menetapkan sudut pandang secara lebih khusus; 'di seberang Sungai Yordan' merupakan ungkapan geografis Indonesia yang alami.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan unsur אֶרֶץ ('tanah/negeri') dan penekanan teritorial ungkapan Ibrani.
- source_word: עָרֵי מִקְלָט
  choice: kota-kota perlindungan
  rationale: Istilah ini jelas dan sesuai bagi kota-kota yang ditetapkan untuk melindungi orang yang membunuh tanpa sengaja, tanpa asosiasi politik modern dari istilah 'suaka'.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: tiga dari kota-kota itu ... dan tiga dari kota-kota itu
  rationale: Nomina tertentu הֶעָרִים menunjuk pada kota-kota dari kelompok yang telah dibicarakan, sehingga frasa partitif 'dari kota-kota itu' mempertahankan ketentuannya.
- source_word: תִּהְיֶינָה
  choice: akan menjadi
  rationale: Bentuk imperfek היה menyatakan status atau fungsi yang dihasilkan bagi keenam kota tersebut; 'akan menjadi' wajar dalam bahasa Indonesia dan mempertahankan nuansa prospektif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang tegas namun tetap mudah dipahami. Pronomina tunggal 'kamu' mengikuti sapaan Ibrani kepada Israel sebagai satu kesatuan. Nama 'Sungai Yordan' dibuat eksplisit secara alami dalam bahasa Indonesia.
