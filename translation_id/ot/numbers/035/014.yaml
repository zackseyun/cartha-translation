  source_fidelity: Terjemahan dengan tepat mempertahankan pembagian tiga kota di seberang Yordan dan tiga kota di tanah Kanaan, serta tujuan keenamnya sebagai kota-kota perlindungan. Frasa "di seberang Sungai Yordan" secara wajar mempertahankan relasi geografis Ibrani tanpa memaksakan lokasi sudut pandang tertentu.
