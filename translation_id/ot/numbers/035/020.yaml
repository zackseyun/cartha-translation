  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: id
  text: Tetapi jika ia mendorong orang itu karena benci, atau dengan sengaja[a] melemparkan sesuatu kepadanya, sehingga orang itu mati,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan niat jahat” atau “dengan maksud menyergap”; istilah Ibraninya menyiratkan maksud bermusuhan yang disengaja dan mungkin mencakup tindakan menyergap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Membuka kasus bersyarat yang berlawanan dengan kejadian tidak disengaja dalam konteks sebelumnya.
- source_word: בְּשִׂנְאָה
  choice: karena benci
  rationale: Menyatakan kebencian sebagai motif tindakan dalam bahasa Indonesia yang alami.
- source_word: יֶהְדָּפֶנּוּ
  choice: ia mendorong orang itu
  rationale: Kata kerja ini menunjuk pada tindakan mendorong atau mendesak; 'mendorong' tidak melebihkan jenis kekerasannya.
- source_word: אוֹ
  choice: atau
  rationale: Menandai tindakan alternatif dalam rumusan hukum.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: melemparkan sesuatu kepadanya
  rationale: Objek lemparan tersirat dalam bahasa Ibrani dan dilengkapi dengan 'sesuatu' agar jelas dan alami dalam bahasa Indonesia.
- source_word: בִּצְדִיָּה
  choice: dengan sengaja
  rationale: Menyampaikan inti tindakan bermaksud jahat atau terencana, sementara kemungkinan nuansa mengadang dipertahankan dalam catatan kaki.
- source_word: וַיָּמֹת
  choice: sehingga orang itu mati
  rationale: Mengungkapkan akibat tindakan secara alami sekaligus memperjelas bahwa yang mati ialah orang yang menjadi sasaran.
