  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: id
  text: Kota-kota yang harus kamu berikan kepada orang Lewi ialah enam kota perlindungan. Kota-kota itu harus kamu berikan agar orang yang membunuh melarikan diri ke sana.[a] Selain kota-kota itu, kamu harus memberikan empat puluh dua kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembunuh.” Istilah Ibrani dalam konteks hukum kota perlindungan ini tidak dengan sendirinya menyatakan apakah pembunuhan itu disengaja atau tidak disengaja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עִיר dapat berarti kota atau permukiman; “kota-kota” merupakan padanan baku dan sesuai dengan konteks pembagian wilayah.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Frasa ini menunjukkan penerima kota-kota tersebut; bentuk “orang Lewi” alami dan lazim dalam bahasa Indonesia.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: enam kota perlindungan
  rationale: מִקְלָט menunjuk tempat berlindung atau suaka; “kota perlindungan” menyampaikan fungsi hukum lembaga tersebut dengan jelas.
- source_word: לָנוּס שָׁמָּה
  choice: dapat melarikan diri ke sana
  rationale: נוּס berarti melarikan diri, dan שָׁמָּה menyatakan arah, “ke sana.” Kata “dapat” mengungkapkan tujuan atau kemungkinan yang dibuka oleh pemberian kota-kota itu.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh
  rationale: Dalam konteks hukum kota perlindungan, istilah ini menyebut pelaku pembunuhan tanpa dengan sendirinya memastikan apakah tindakannya disengaja atau tidak; frasa Indonesia ini mempertahankan keluasan tersebut.
- source_word: וַעֲלֵיהֶם
  choice: Selain kota-kota itu
  rationale: על dalam ungkapan ini menyatakan penambahan, bukan posisi fisik. Penyebutan ulang “kota-kota” memperjelas acuannya dalam bahasa Indonesia.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: empat puluh dua kota
  rationale: Bentuk tunggal עִיר setelah bilangan merupakan konstruksi hitungan Ibrani; bahasa Indonesia secara alami memakai “empat puluh dua kota.”
theological_decisions:
- issue: Apakah הָרֹצֵחַ menyatakan pembunuhan sengaja atau tidak sengaja
  choice: orang yang membunuh
  alternative: pembunuh; orang yang membunuh tanpa sengaja
  rationale: Kata Ibraninya sendiri dalam ayat ini tidak menentukan niat pelaku. Terjemahan tidak mempersempit makna menjadi pembunuhan berencana ataupun secara dini menetapkannya sebagai kecelakaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami, tanpa mengubah hubungan perintah, tujuan, dan penambahan jumlah kota.
