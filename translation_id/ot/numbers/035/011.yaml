  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: id
  text: maka kamu akan menetapkan[a] kota-kota bagi dirimu; kota-kota itu akan menjadi kota-kota perlindungan bagimu. Ke sanalah orang yang menewaskan seseorang tanpa sengaja akan melarikan diri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan "menunjuk" atau "mengkhususkan" kota-kota bagi dirimu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "seorang pembunuh, yang menewaskan seseorang tanpa sengaja." Dalam konteks ini yang dimaksud ialah orang yang menyebabkan kematian tanpa sengaja, bukan pembunuhan yang disengaja.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: kamu harus menetapkan
  rationale: Bentuk Hifil dari קרה dalam konteks hukum ini berarti menyebabkan kota-kota tertentu dipilih atau ditetapkan. “Menetapkan” alami dalam bahasa Indonesia dan mempertahankan daya preskriptif kalimat.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: kota-kota ... kota-kota perlindungan
  rationale: Pengulangan Ibrani dipertahankan demi penekanan dan kejelasan hukum. “Kota-kota perlindungan” menyatakan tempat aman yang ditetapkan secara resmi.
- source_word: מִקְלָט
  choice: perlindungan
  rationale: Dalam konteks ini kata tersebut menunjuk pada tempat aman bagi orang yang melarikan diri, bukan sekadar tempat berteduh biasa.
- source_word: וְנָס שָׁמָּה
  choice: Ke sanalah ... harus melarikan diri
  rationale: Rangkaian verbal dalam ketentuan hukum ini memiliki daya preskriptif atau resultatif. Susunan dengan “ke sanalah” juga mempertahankan penekanan arah dalam bahasa sumber.
- source_word: רֹצֵחַ מַכֵּה נֶפֶשׁ
  choice: orang yang menewaskan seseorang
  rationale: Ungkapan dipadatkan secara alami dalam bahasa Indonesia tanpa menyebut pelaku sebagai “pembunuh”, yang mudah menyiratkan pembunuhan sengaja. “Menewaskan seseorang” menyampaikan akibat fatal dari tindakan tersebut.
- source_word: נֶפֶשׁ
  choice: seseorang
  rationale: Di sini נֶפֶשׁ menunjuk pada manusia sebagai korban tindakan mematikan, bukan pada “jiwa” sebagai unsur nonjasmani.
- source_word: בִּשְׁגָגָה
  choice: tanpa sengaja
  rationale: Ungkapan ini secara jelas menandai tidak adanya kesengajaan dan membedakan kasus tersebut dari pembunuhan yang disengaja.
theological_decisions:
- issue: Klasifikasi hukum orang yang menyebabkan kematian
  choice: orang yang menewaskan seseorang tanpa sengaja
  alternative: pembunuh; orang yang membunuh
  rationale: Pilihan ini tidak lebih dahulu memberi cap sebagai pelaku pembunuhan sengaja, sebab teks sendiri membatasi kasusnya dengan בִּשְׁגָגָה, “tanpa sengaja”. Catatan kaki mempertahankan bentuk ungkapan Ibrani yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada hukum yang tetap mudah dipahami. Pengulangan “kota-kota” dipertahankan dari bahasa Ibrani, sedangkan frasa pelaku kematian dirumuskan secara alami agar tidak mengaburkan perbedaan antara kematian tanpa sengaja dan pembunuhan sengaja.
