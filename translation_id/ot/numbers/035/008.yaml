  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: id
  text: 'Kota-kota yang kamu berikan dari tanah milik orang Israel: dari pihak yang memiliki lebih banyak, kamu harus memberikan lebih banyak kota, dan dari pihak yang memiliki lebih sedikit, lebih sedikit.[a] Masing-masing harus memberikan sebagian dari kota-kotanya kepada orang Lewi, sebanding dengan bagian warisan yang mereka peroleh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari yang banyak harus kamu perbanyak, dan dari yang sedikit harus kamu kurangi.” Maksudnya ialah bahwa pihak dengan tanah milik atau bagian warisan yang lebih besar memberikan lebih banyak kota, sedangkan pihak dengan bagian yang lebih kecil memberikan lebih sedikit.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal distributif dalam “masing-masing” dan “bagiannya,” tetapi verba “mereka peroleh” berbentuk jamak. Peralihan ini dapat merujuk kepada setiap kelompok Israel secara distributif beserta anggotanya.
    reason: source_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עִיר dapat berarti kota atau permukiman; “kota-kota” merupakan istilah yang wajar dan konsisten untuk kota-kota orang Lewi dalam konteks ini.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: tanah milik orang Israel
  rationale: אֲחֻזָּה menunjuk pada tanah milik atau tanah pegangan yang diwariskan. “Orang Israel” menyampaikan arti kolektif בְּנֵי יִשְׂרָאֵל secara alami dalam bahasa Indonesia modern.
- source_word: מֵאֵת הָרַב תַּרְבּוּ
  choice: jumlahnya harus kamu perbanyak dari pihak yang memiliki banyak
  rationale: Terjemahan ini mempertahankan permainan akar רבה (“banyak—memperbanyak”) dan tidak secara tegas menambahkan “suku,” meskipun pembagian suku-suku tersirat oleh konteks.
- source_word: וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: kamu kurangi dari pihak yang memiliki sedikit
  rationale: Ungkapan ini mempertahankan kesejajaran מעט (“sedikit—mengurangi”) dan menyatakan pembagian kota secara proporsional.
- source_word: אִישׁ
  choice: Masing-masing
  rationale: אִישׁ berfungsi distributif di sini. “Masing-masing” mempertahankan cakupan yang tidak dinyatakan secara eksplisit tanpa membatasinya pada laki-laki perseorangan.
- source_word: כְּפִי נַחֲלָתוֹ
  choice: sebanding dengan bagian warisan
  rationale: כְּפִי adalah idiom ukuran atau proporsi; “sebanding dengan” memperjelas bahwa jumlah kota ditentukan menurut besarnya warisan.
- source_word: אֲשֶׁר יִנְחָלוּ
  choice: yang mereka peroleh
  rationale: Bentuk verba Ibrani ini jamak dan berhubungan dengan warisan. “Peroleh” menghindari pengulangan janggal “warisan yang mereka warisi” sambil mempertahankan gagasan penerimaan tanah warisan.
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: harus memberikan sebagian dari kota-kotanya kepada orang Lewi
  rationale: מִן bersifat partitif, sehingga “sebagian dari” menyampaikan bahwa bukan semua kota diberikan. לְוִיִּם secara baku diterjemahkan “orang Lewi.”
theological_decisions:
- issue: Rujukan bentuk tunggal אִישׁ dan sufiks tunggal, diikuti verba jamak יִנְחָלוּ
  choice: Mempertahankan ungkapan distributif “Masing-masing” dan bentuk jamak “mereka,” disertai catatan
  alternative: Menafsirkan semuanya secara eksplisit sebagai “setiap suku ... yang diterimanya”
  rationale: Teks Ibrani beralih dari bentuk tunggal distributif ke verba jamak. Terjemahan utama tidak memaksakan penyelesaian atas peralihan itu; catatan menjelaskan bahwa yang dimaksud kemungkinan adalah setiap kelompok atau suku di antara orang Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pilihan “orang Israel” dan “orang Lewi” mudah dipahami pembaca umum. Struktur paralel “memiliki banyak ... memiliki sedikit” mempertahankan gaya hukum-puitis sumber tanpa menjadi kaku.
