base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: id
  text: Atau, jika ia memukul orang itu dengan benda kayu yang dapat mematikan dan dipegang di tangan[a], lalu orang itu mati, ia adalah pembunuh; pembunuh itu harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan alat kayu di tangan” atau “dengan benda kayu yang dapat digenggam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: dengan benda kayu yang dipegang di tangan
  rationale: כְּלִי adalah istilah luas untuk benda atau alat; dalam rangkaian hukum ini benda tersebut berfungsi sebagai alat pemukul. יָד menunjukkan bahwa benda kayu itu dipegang atau digunakan dengan tangan. Terjemahan ini mempertahankan keluasan istilah dan gambaran Ibrani tanpa mengharuskannya sebagai senjata khusus.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: yang dapat menyebabkan kematian
  rationale: Klausa ini menerangkan kemampuan benda tersebut untuk mematikan, bukan hanya hasil pukulan dalam kasus yang sedang dibicarakan.
- source_word: הִכָּהוּ
  choice: ia memukul orang itu
  rationale: נכה berarti memukul atau menghantam. 'Memukul' jelas dan tidak mendahului klausa berikutnya dengan menyiratkan kematian.
- source_word: וַיָּמֹת
  choice: lalu orang itu mati
  rationale: Bentuk berurutan Ibrani menyatakan bahwa kematian terjadi setelah pukulan. Penyebutan 'orang itu' memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: רֹצֵחַ
  choice: pembunuh
  rationale: Dalam konteks hukum yang membedakan pembunuhan bersalah dari kematian tidak disengaja, istilah ini memberi klasifikasi hukum-moral sebagai pembunuh.
- source_word: מוֹת יוּמַת
  choice: harus dihukum mati
  rationale: Gabungan infinitif absolut dan bentuk pasif menegaskan kepastian serta kewajiban hukuman mati. 'Harus dihukum mati' menyampaikan daya hukum dan penekanannya secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Klasifikasi hukum רֹצֵחַ dalam ketentuan tentang pembunuhan
  choice: pembunuh
  alternative: orang yang membunuh; pembantai
  rationale: Konteks langsung menetapkan pembunuhan yang bersalah dan membedakannya dari pembunuhan tidak disengaja. 'Pembunuh' menyampaikan putusan hukum-moral teks tanpa menambahkan ajaran tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Pengulangan 'pembunuh' dipertahankan untuk mencerminkan penegasan teks Ibrani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
