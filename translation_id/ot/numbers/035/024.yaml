translation:
  language: id
  text: maka umat itu akan mengadili antara orang yang memukul dan penebus darah[a] menurut ketentuan-ketentuan ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penuntut darah.” Secara harfiah, “penebus darah”; yakni orang yang bertugas menuntut pembalasan atas darah seorang kerabat.
    reason: lexical_alternative
  - marker: b
    text: Atau “putusan-putusan ini” atau “peraturan-peraturan ini.” Istilah Ibrani dapat menunjuk putusan maupun ketentuan hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: maka ... harus mengadili perkara
  rationale: Bentuk verba dengan waw dalam rangkaian hukum menyatakan langkah prosedural berikutnya. 'Harus mengadili perkara' menyampaikan daya yudisial שׁפט secara alami dalam bahasa Indonesia.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה menunjuk komunitas Israel sebagai suatu badan bersama. 'Umat itu' alami bagi pembaca Indonesia dan tetap mempertahankan fungsi korporatifnya dalam konteks pengadilan.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan
  rationale: Pasangan preposisi Ibrani ini secara wajar diterjemahkan dengan konstruksi Indonesia 'antara ... dan'.
- source_word: הַמַּכֶּה
  choice: orang yang memukul
  rationale: Partisipel dari נכה secara harfiah menunjuk orang yang memukul. Pilihan ini tidak menambahkan objek yang tidak tersurat dan tidak terlebih dahulu menyatakannya sebagai pembunuh.
- source_word: גֹּאֵל הַדָּם
  choice: penuntut darah
  rationale: Ungkapan ini merupakan sebutan hukum bagi orang yang bertugas menuntut pembalasan atas darah kerabat. 'Penuntut darah' mempertahankan idiom dan peran hukumnya tanpa memasukkan unsur kekerabatan yang tidak tersurat dalam ayat ini.
- source_word: עַל
  choice: menurut
  rationale: Dalam konteks hukum, עַל menyatakan patokan yang menjadi dasar pengadilan; 'menurut' menyampaikannya dengan ringkas dan alami.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: ketentuan-ketentuan ini
  rationale: מִשְׁפָּטִים dapat berarti putusan, aturan, atau ketentuan hukum. Dalam konteks ini, 'ketentuan-ketentuan' jelas menunjuk norma hukum yang mengatur pengadilan.
theological_decisions:
- issue: Peran yudisial umat dalam perkara kematian
  choice: Ayat ini menugaskan umat untuk mengadili perkara antara orang yang memukul dan penuntut darah tanpa lebih dahulu menyatakan orang itu sebagai pembunuh.
  alternative: Menyebut umat sebagai badan pengadilan yang lebih sempit atau menyebut orang yang memukul sebagai pembunuh.
  rationale: Teks Ibrani menggambarkan proses pengadilan komunal dan tetap netral mengenai klasifikasi kesalahan orang tersebut pada tahap ini.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Susunan kalimat mempertahankan urutan prosedural dan kenetralan hukum teks sumber; kedua penanda catatan kaki dicantumkan dalam teks utama.
