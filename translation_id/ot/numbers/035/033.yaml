  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: id
  text: Janganlah kamu mencemari negeri yang kamu diami, sebab darah itulah yang mencemari negeri itu. Bagi negeri itu tidak dapat diadakan pendamaian berkenaan dengan darah yang telah ditumpahkan di dalamnya,[a] kecuali dengan darah orang yang menumpahkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tidak dapat dilakukan penebusan bagi negeri itu berkenaan dengan darah yang telah ditumpahkan di dalamnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: mencemari
  rationale: Dalam konteks penumpahan darah, verba ini menyatakan pencemaran moral dan sakral terhadap negeri. “Mencemari” alami dalam bahasa Indonesia modern dan dapat dipakai secara konsisten pada kedua kemunculannya.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Yang dimaksud ialah wilayah tempat umat itu berdiam, bukan seluruh bumi. “Negeri” mempertahankan nuansa teritorial dengan bahasa Indonesia yang wajar.
- source_word: כִּי הַדָּם הוּא
  choice: sebab darah
  rationale: הוּא menegaskan subjek, tetapi penambahan “itu sendiri” terasa berlebihan dalam bahasa Indonesia; susunan ini tetap menempatkan darah sebagai penyebab langsung pencemaran.
- source_word: יְכֻפַּר
  choice: pendamaian dapat diadakan
  rationale: Bentuk pasif כפר menunjuk pada penghapusan kesalahan darah yang membebani negeri. “Pendamaian” mempertahankan dimensi kultis-moral dan tetap mudah dipahami.
- source_word: שֻׁפַּךְ
  choice: telah ditumpahkan
  rationale: Ungkapan baku dan wajar untuk darah yang dicurahkan dalam konteks hukum.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Frasa ini memperkenalkan satu-satunya pengecualian atau sarana yang disebutkan.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: dengan darah orang yang menumpahkannya
  rationale: Menjelaskan secara alami bahwa yang dimaksud ialah darah si penumpah darah, sambil mempertahankan rujukan pronominal kepada darah yang ditumpahkan.
theological_decisions:
- issue: Pencemaran negeri oleh penumpahan darah
  choice: Bahasa terjemahan menyatakan bahwa penumpahan darah benar-benar mencemari negeri secara moral-sakral dan bahwa beban darah itu tidak dapat didamaikan selain dengan darah pelakunya.
  alternative: Memahami bahasa ini hanya sebagai metafora bagi kekacauan sosial atau semata-mata sebagai ketentuan hukum sipil.
  rationale: Pengulangan חנף dan pemakaian כפר menggabungkan ranah hukum, moral, dan sakral. Terjemahan mempertahankan ketegangan itu tanpa menambahkan kerangka doktrinal dari luar ayat.
- issue: Makna pendamaian bagi negeri
  choice: Negeri diperlakukan sebagai pihak yang terkena pencemaran dan memerlukan pendamaian berkenaan dengan darah yang ditumpahkan.
  alternative: Menerjemahkan seolah-olah pendamaian hanya berlaku langsung bagi pelaku atau korban.
  rationale: Sintaks Ibrani secara eksplisit menghubungkan לָאָרֶץ dengan יְכֻפַּר dan לַדָּם; karena itu negeri tetap menjadi pihak yang disebut menerima pendamaian, sedangkan darah adalah perkara yang menimbulkannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kamu” mempertahankan sapaan jamak kolektif yang lazim dalam gaya Alkitab Indonesia; “negeri” dipilih untuk wilayah yang didiami Israel; “pendamaian diadakan” mempertahankan bobot hukum-kultis tanpa memakai istilah teknis yang lebih sukar.
