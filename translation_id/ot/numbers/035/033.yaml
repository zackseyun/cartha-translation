  source_fidelity: 'Terjemahan secara umum setia pada struktur dan makna Ibrani: pencemaran negeri oleh darah, kebutuhan pendamaian bagi negeri berkenaan dengan darah yang tertumpah, dan pengecualian melalui darah penumpahnya. Namun, penegasan הוּא setelah “darah” sebaiknya dinyatakan, dan hubungan לַדָּם lebih tepat diungkapkan sebagai “berkenaan dengan” daripada “atas.”'
