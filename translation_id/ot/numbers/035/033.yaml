  terminology: “Mencemari,” “negeri,” dan “pendamaian” layak untuk konteks moral-sakral dan hukum ini. “Pendamaian” dipertahankan tanpa mempersempitnya menjadi pengampunan bagi pelaku atau sekadar pembersihan fisik.
