  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: id
  text: Kota-kota itu harus menjadi tempat tinggal mereka, dan tanah lapang mereka di sekitar kota-kota itu[a] harus menjadi tempat bagi ternak, harta benda[b], dan semua hewan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah penggembalaan mereka.” Istilah Ibrani ini menunjuk pada kawasan terbuka milik mereka di sekitar kota-kota itu, yang khususnya cocok untuk penggembalaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “milik mereka” atau “barang-barang mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: kota-kota itu
  rationale: עִיר menunjuk pada kota atau permukiman; bentuk jamak tentu diterjemahkan secara wajar sebagai “kota-kota itu” dalam konteks pembagian wilayah.
- source_word: לָשָׁבֶת
  choice: menjadi tempat tinggal mereka
  rationale: Infinitif dari ישׁב menyatakan tujuan untuk dihuni; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi kota sebagai tempat tinggal.
- source_word: מִגְרְשֵׁיהֶם
  choice: tanah lapang di sekelilingnya
  rationale: מִגְרָשׁ adalah kawasan terbuka di sekitar kota yang disediakan bagi kebutuhan penduduk, khususnya penggunaan oleh hewan; terjemahan ini tidak mempersempit maknanya hanya menjadi padang rumput.
- source_word: לִבְהֶמְתָּם
  choice: untuk ternak
  rationale: בְּהֵמָה di sini merupakan istilah kolektif bagi hewan peliharaan atau ternak.
- source_word: לִרְכֻשָׁם
  choice: harta benda
  rationale: רְכוּשׁ berarti milik, harta, atau barang kepunyaan; “harta benda” alami dan cukup luas dalam konteks pengaturan lahan.
- source_word: וּלְכֹל חַיָּתָם
  choice: dan semua hewan mereka
  rationale: חַיָּה dapat berarti makhluk hidup atau hewan; dalam rangkaian dengan ternak, “semua hewan mereka” mempertahankan cakupan yang lebih luas tanpa terdengar arkais.
