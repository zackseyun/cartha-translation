id: NUM.17.25
reference: Numbers 17:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Kembalikanlah tongkat Harun ke hadapan Kesaksian,[a] untuk disimpan sebagai tanda bagi orang-orang yang memberontak,[b] agar engkau mengakhiri gerutuan mereka terhadap-Ku sehingga mereka tidak mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kesaksian” kemungkinan menunjuk pada kesaksian perjanjian yang berkaitan dengan tabut; teks Ibrani sendiri hanya mengatakan “Kesaksian”.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “anak-anak pemberontakan”; dapat juga diterjemahkan “para pemberontak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan fungsi nama perjanjian dalam teks Ibrani.
- source_word: הָשֵׁב
  choice: Kembalikanlah
  rationale: Bentuk Hifil imperatif dari שוב memerintahkan Musa mengembalikan tongkat itu ke tempat semula.
- source_word: מַטֵּה
  choice: tongkat
  rationale: Padanan Indonesia yang alami bagi benda yang menjadi tanda kesukuan dan keimaman dalam konteks ini.
- source_word: לִפְנֵי הָעֵדוּת
  choice: ke hadapan Kesaksian
  rationale: Mempertahankan ungkapan Ibrani yang ringkas tanpa menambahkan 'tabut'; huruf kapital menandai pemakaian teknis dalam konteks Kemah Suci.
- source_word: לְמִשְׁמֶרֶת
  choice: untuk disimpan
  rationale: Menyatakan tujuan pemeliharaan atau penjagaan benda tersebut secara alami dalam bahasa Indonesia.
- source_word: לְאוֹת
  choice: sebagai tanda
  rationale: אוֹת berarti tanda atau penanda; 'sebagai tanda' paling wajar dalam konteks ini.
- source_word: לִבְנֵי מֶרִי
  choice: bagi orang-orang yang memberontak
  rationale: Idiom harfiah 'anak-anak pemberontakan' menyatakan orang yang bercirikan pemberontakan; terjemahan utama dibuat alami, sementara bentuk harfiahnya dicatat.
- source_word: וּתְכַל
  choice: engkau akan mengakhiri
  rationale: Hifil dari כלה berarti menyebabkan sesuatu berakhir. Bentuk verba orang kedua tunggal dipertahankan sehingga Musa tetap menjadi subjek gramatikal.
- source_word: תְּלוּנֹּתָם
  choice: gerutuan mereka
  rationale: '''Gerutuan'' mempertahankan nuansa keluhan berulang dalam kisah pengembaraan di padang gurun.'
- source_word: מֵעָלַי
  choice: terhadap-Ku
  rationale: Dalam konstruksi ini gerutuan diarahkan kepada Yahweh; 'terhadap-Ku' merupakan padanan idiomatis.
- source_word: וְלֹא יָמֻתוּ
  choice: supaya mereka tidak mati
  rationale: Menyampaikan hasil atau tujuan yang dimaksud oleh tindakan tersebut secara jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi mempertahankan nama yang disebutkan, bukan menggantinya dengan gelar.
- issue: Rujukan הָעֵדוּת
  choice: Kesaksian
  alternative: tabut Kesaksian
  rationale: Bahasa Ibrani hanya menyebut 'Kesaksian'. Terjemahan tidak memperluasnya menjadi tabut, meskipun konteks Kemah Suci mungkin mengacu pada kesaksian perjanjian yang berkaitan dengan tabut.
- issue: Subjek וּתְכַל dan hubungan antarklausa
  choice: engkau akan mengakhiri
  alternative: gerutuan mereka akan berakhir
  rationale: Bentuk Ibrani adalah orang kedua tunggal dan secara gramatikal menunjuk kepada Musa. Susunan Indonesia mempertahankan hal itu tanpa menutup kemungkinan nuansa tujuan atau hasil dalam rangkaian perintah.
- issue: Idiom gendered לִבְנֵי מֶרִי
  choice: orang-orang yang memberontak
  alternative: anak-anak pemberontakan
  rationale: Ungkapan Semitis ini menggolongkan para pemberontak menurut sifat mereka, bukan terutama menekankan jenis kelamin atau hubungan biologis. Padanan alami digunakan dalam teks dan bentuk harfiah dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan khidmat. Kalimat langsung dipertahankan; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Istilah teknis 'Kesaksian' dipertahankan secara ringkas dan dijelaskan melalui catatan kaki.
