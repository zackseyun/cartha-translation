base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Memberi tahu pembaca bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyatakan kesinambungan itu secara wajar, sedangkan “berfirman” merupakan padanan Indonesia yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan perkataan; “kepada” adalah padanan Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama tokoh diterjemahkan menurut bentuk baku yang telah umum dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak dinyatakan secara terpisah
  rationale: Rumus infinitif Ibrani ini memperkenalkan isi perkataan. Dalam bahasa Indonesia, fungsi tersebut sudah tersampaikan secara alami oleh verba “berfirman” dan tanda baca sebelum tuturan langsung; menerjemahkannya secara harfiah sebagai “dengan mengatakan” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehova” mencerminkan bentuk pelafalan yang berkembang kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Koma akhir dipertahankan karena ayat ini berfungsi sebagai pengantar bagi firman langsung pada ayat berikutnya.
