source:
  edition: WLC
  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: id
  text: Katakanlah kepada Eleazar, anak Harun, imam itu, agar ia mengangkat perbaraan-perbaraan itu dari tengah-tengah kobaran api[a], lalu menghamburkan api itu ke tempat yang jauh, sebab perbaraan-perbaraan itu telah menjadi kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari tengah-tengah pembakaran itu” atau “dari tengah-tengah tempat yang terbakar.” Kata Ibrani dapat menunjuk pembakaran, kobaran, atau area yang terbakar.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebab perbaraan-perbaraan itu kudus.” Bentuk perfek Ibrani dapat menekankan keadaan yang dihasilkan: “telah menjadi kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Katakanlah
  rationale: Bentuk imperatif dari אמר yang memperkenalkan perintah kepada Musa untuk disampaikan kepada Eleazar; bentuk ini alami dan tetap dekat dengan struktur Ibrani.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Eleazar, anak Imam Harun
  rationale: Dalam rangkaian Ibrani, sebutan 'imam' paling wajar menerangkan Harun. Susunan Indonesia ini menyatakan hubungan tersebut dengan jelas tanpa menyangkal bahwa Eleazar juga seorang imam.
- source_word: וְיָרֵם
  choice: agar ia mengangkat
  rationale: Bentuk yusif setelah imperatif menyampaikan isi perintah yang harus dikatakan kepada Eleazar. 'Agar ia' menghasilkan kalimat Indonesia yang alami.
- source_word: הַמַּחְתֹּת
  choice: perbaraan-perbaraan
  rationale: מחתה menunjuk wadah untuk membawa bara dan dupa. 'Perbaraan' merupakan istilah Indonesia yang ringkas dan cocok dengan konteks ibadah; bentuk ulang menyatakan jamak.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: dari tengah-tengah bekas kebakaran
  rationale: שׂרפה dapat menunjuk pembakaran atau tempat/hasil yang terbakar. Dalam konteks sesudah api ilahi membinasakan orang-orang itu, 'bekas kebakaran' alami dan tidak mengandaikan bahwa nyala masih berlangsung.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: lalu menghamburkan apinya jauh-jauh
  rationale: זרה berarti menghamburkan atau menyerakkan, sedangkan הָלְאָה menyatakan arah menjauh. Akhiran '-nya' mengaitkan api dengan perbaraan tanpa menggantinya secara interpretatif dengan 'bara'.
- source_word: כִּי קָדֵשׁוּ
  choice: sebab perbaraan-perbaraan itu telah menjadi kudus
  rationale: 'Perfek jamak paling alami merujuk kembali kepada perbaraan-perbaraan dan menonjolkan keadaan hasil: benda-benda itu kini kudus.'
theological_decisions:
- issue: Acuan verba jamak dalam כִּי קָדֵשׁוּ
  choice: Perbaraan-perbaraan itu
  alternative: Perbaraan dan api bersama-sama, atau benda-benda persembahan secara lebih luas
  rationale: 'Anteseden jamak yang paling sesuai adalah הַמַּחְתֹּת. Alur kisah juga mendukungnya: perbaraan dipertahankan karena telah menjadi kudus, sedangkan api harus dihamburkan.'
- issue: Nuansa aspek perfektif קָדֵשׁוּ
  choice: telah menjadi kudus
  alternative: adalah kudus
  rationale: Terjemahan utama menampilkan keadaan yang dihasilkan oleh tindakan sebelumnya, tetapi bentuk Ibrani juga dapat dinyatakan sebagai keadaan kini; alternatif itu dicatat agar ambiguitas aspek tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Perbaraan' dipilih sebagai istilah kultis yang masih mudah dipahami; pengulangan dipertahankan untuk memperjelas jamak dan acuan verba. Kalimat mengikuti hubungan sintaksis Ibrani sambil menghindari susunan yang kaku.
