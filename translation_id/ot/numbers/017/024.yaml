  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: id
  text: Lalu Musa membawa semua tongkat itu keluar dari hadapan Yahweh kepada seluruh umat Israel[a]. Mereka melihatnya[b], lalu masing-masing mengambil tongkatnya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada seluruh anak laki-laki Israel”; ungkapan Ibrani ini lazim menunjuk kepada umat Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mereka melihat”; objeknya tersirat dari konteks.'
    reason: source_transparency
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: membawa ... keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan kausatif, yaitu membawa sesuatu keluar; susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan makna sumber.
- source_word: הַמַּטֹּת
  choice: semua tongkat itu
  rationale: Dalam konteks ini מַטֶּה menunjuk kepada benda fisik yang sebelumnya ditempatkan di hadapan Yahweh, bukan kepada suku.
- source_word: מִלִּפְנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Ungkapan ini mempertahankan gambaran ruang dalam idiom Ibrani sekaligus menerjemahkan nama perjanjian יְהוָה sebagai Yahweh.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kepada seluruh umat Israel
  rationale: Ini merupakan sebutan kebangsaan bagi orang Israel. 'Umat Israel' lebih alami dalam bahasa Indonesia modern, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּרְאוּ
  choice: mereka melihatnya
  rationale: ראה pada dasarnya berarti 'melihat'. Akhiran '-nya' memasok objek yang tersirat dari konteks, yakni tongkat-tongkat tersebut, tanpa menambahkan gagasan pemeriksaan yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: masing-masing mengambil tongkatnya sendiri
  rationale: אִישׁ dipakai secara distributif, sehingga 'masing-masing' menyampaikan maksudnya secara alami. 'Sendiri' memperjelas bahwa setiap orang mengambil tongkat miliknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Bentuk 'Yahweh' mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Umat Israel' dipilih agar sebutan kebangsaan itu mudah dipahami, dan struktur rangkaian tindakan dalam bahasa Ibrani dipertahankan dengan 'lalu'.
