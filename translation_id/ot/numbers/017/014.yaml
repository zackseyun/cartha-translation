  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: id
  text: Orang-orang yang mati dalam wabah itu berjumlah 14.700, belum termasuk mereka yang mati sehubungan dengan perkara Korah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena Korah” atau “karena perkara Korah.” Frasa ini merujuk kepada mereka yang sebelumnya mati sehubungan dengan pemberontakan Korah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הַמֵּתִים
  choice: Jumlah orang yang mati ... 14.700 orang
  rationale: Konstruksi ini menyampaikan hasil penghitungan korban. Susunan dengan “jumlah” alami dalam bahasa Indonesia dan tetap mempertahankan fungsi naratif serta angka sebagai predikat.
- source_word: בַּמַּגֵּפָה
  choice: dalam wabah itu
  rationale: מַגֵּפָה menunjuk pada wabah atau tulah mematikan; preposisi ב paling dekat disampaikan dengan “dalam,” yakni kematian yang terjadi selama wabah tersebut.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 14.700 orang
  rationale: Bilangan Ibrani diterjemahkan secara langsung dengan format angka baku Indonesia; “orang” ditambahkan secara wajar untuk memperjelas satuan korban.
- source_word: מִלְּבַד
  choice: belum termasuk
  rationale: Ungkapan ini menandai bahwa kelompok berikutnya tidak termasuk dalam jumlah 14.700; “belum termasuk” jelas dan alami untuk konteks penghitungan.
- source_word: הַמֵּתִים
  choice: mereka yang mati
  rationale: Partisipel substantival diterjemahkan sebagai kelompok orang, lebih alami daripada ungkapan nominal “orang-orang mati” dalam konteks ini.
- source_word: עַל דְּבַר קֹרַח
  choice: karena perkara Korah
  rationale: Ungkapan עַל דְּבַר dapat menyatakan sebab atau kaitan dengan suatu perkara. Pilihan ini mempertahankan unsur kausal sekaligus ketidakpastian mengenai tepatnya bagaimana kematian itu berkaitan dengan Korah.
theological_decisions:
- issue: Cakupan kematian yang berkaitan dengan Korah
  choice: Ayat membedakan 14.700 korban wabah dari mereka yang sebelumnya mati karena perkara Korah tanpa merinci kelompok-kelompoknya.
  alternative: “mereka yang mati karena Korah” atau “mereka yang mati dalam perkara Korah”
  rationale: Teks Ibrani menunjuk kembali kepada penghukuman yang berkaitan dengan Korah, tetapi tidak menjelaskan cakupan korban secara lebih terperinci. Terjemahan tidak menambahkan kategorisasi yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Angka memakai pemisah ribuan menurut kebiasaan Indonesia. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
