review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena imperatif Ibrani הֵרֹמּוּ berbentuk jamak dan ditujukan kepada Musa dan Harun. Teks revisi menandai jamak itu secara eksplisit dengan “kalian”. “Membinasakan ... dalam sekejap” menyampaikan dengan tepat וַאֲכַלֶּה ... כְּרָגַע, dan “tersungkur dengan muka ke tanah” mempertahankan tindakan fisik וַיִּפְּלוּ עַל־פְּנֵיהֶם tanpa menetapkan motifnya.
  naturalness: “Menjauhlah kalian dari tengah umat ini” jelas, modern, dan mendesak. “Tersungkur dengan muka ke tanah” lebih alami dan lebih netral daripada “bersujud dengan muka sampai ke tanah”, yang dapat lebih mudah menyiratkan tindakan ibadah atau motif tertentu.
  terminology: “Umat ini” merupakan padanan yang wajar untuk הָעֵדָה הַזֹּאת dalam konteks komunitas Israel. Kapitalisasi “Aku” dipertahankan sebagai register Alkitab Indonesia. Catatan kaki a direvisi agar tidak keliru memakai bentuk tunggal “dirimu” untuk perintah jamak.
  issues:
  - severity: medium
    issue: Jumlah pada perintah dan catatan kaki a tidak konsisten dengan teks sumber.
    rationale: הֵרֹמּוּ adalah imperatif jamak. Draf utama tidak menandai jumlah, yang masih mungkin dalam bahasa Indonesia, tetapi catatan kaki memakai “dirimu” (tunggal), sehingga secara eksplisit mengubah penerima perintah. Revisi memakai “kalian”.
  - severity: low
    issue: “Bersujud” dapat menambahkan nuansa motif yang tidak dinyatakan secara eksplisit.
    rationale: וַיִּפְּלוּ עַל־פְּנֵיהֶם secara harfiah menyatakan bahwa mereka jatuh/tersungkur pada wajah mereka. “Tersungkur dengan muka ke tanah” mempertahankan ambiguitas mengenai apakah tindakannya takut, doa syafaat, atau penyembahan.
  revised_text: “Menjauhlah kalian dari tengah umat ini[a], agar Aku membinasakan mereka dalam sekejap[b].” Lalu mereka tersungkur dengan muka ke tanah.
