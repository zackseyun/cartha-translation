base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: id
  text: “Menjauhlah kalian dari tengah umat ini[a], agar Aku membinasakan mereka dalam sekejap[b].” Lalu mereka tersungkur dengan muka ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Bangkitlah dari tengah umat ini”; atau: “Pisahkanlah diri kalian dari antara umat ini.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menghabisi mereka dalam sesaat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Menjauhlah
  rationale: Bentuk imperatif jamak Nifal dari רום secara harfiah memuat gambaran mengangkat diri, tetapi dalam konteks ini berfungsi sebagai perintah mendesak untuk menyingkir dari tengah umat sebelum penghukuman.
- source_word: מִתּוֹךְ
  choice: dari tengah-tengah
  rationale: Mengungkapkan pemisahan dari dalam suatu kelompok dan mempertahankan struktur serta gambaran spasial bahasa Ibrani.
- source_word: הָעֵדָה הַזֹּאת
  choice: umat ini
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai kelompok bersama. 'Umat' alami dalam bahasa Indonesia dan tidak membatasi makna pada pertemuan ibadah.
- source_word: וַאֲכַלֶּה
  choice: supaya Aku membinasakan
  rationale: Piel כלה berarti menghabisi, membinasakan, atau mengakhiri. 'Membinasakan' menyampaikan penghukuman total secara jelas dan wajar.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek langsung ini merujuk kepada umat yang disebut sebelumnya.
- source_word: כְּרָגַע
  choice: dalam sekejap
  rationale: Ungkapan ini menunjukkan waktu yang amat singkat; 'dalam sekejap' dekat dengan makna dan alami dalam bahasa Indonesia.
- source_word: וַיִּפְּלוּ
  choice: Lalu mereka bersujud
  rationale: Wayyiqtol melanjutkan urutan narasi. Dalam gabungan dengan עַל־פְּנֵיהֶם, tindakan jatuh diterjemahkan secara idiomatis sebagai bersujud.
- source_word: עַל פְּנֵיהֶם
  choice: dengan muka sampai ke tanah
  rationale: Menggambarkan posisi tersungkur atau bersujud. Rumusan ini alami dan mempertahankan gambaran jasmaniah tindakan tersebut.
theological_decisions:
- issue: Sifat perintah ilahi kepada Musa dan Harun
  choice: Perintah diterjemahkan sebagai desakan agar mereka menjauh dari umat sebelum penghukuman ilahi yang segera.
  alternative: “Angkatlah dirimu” atau “Pisahkanlah dirimu” secara lebih harfiah.
  rationale: Konteks menuntut makna menyingkir dari tengah umat, tetapi ancaman penghukuman tetap disampaikan tanpa diperhalus atau diberi penjelasan teologis tambahan.
- issue: Makna tindakan Musa dan Harun jatuh dengan muka ke tanah
  choice: Diterjemahkan sebagai tindakan bersujud tanpa menentukan apakah motifnya terutama takut, menyembah, atau memohon.
  alternative: “Lalu mereka tersungkur” atau “Lalu mereka jatuh dengan muka ke tanah.”
  rationale: Konteks dapat menyiratkan doa syafaat, tetapi teks ayat ini sendiri hanya menyatakan tindakan jasmaniah; terjemahan tidak menambahkan motif tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk jamak pada perintah dipahami dari konteks sebagai ditujukan kepada Musa dan Harun, meskipun bahasa Indonesia tidak menandai jumlah pada kata kerja. Kapitalisasi “Aku” mengikuti rujukan kepada Allah.
