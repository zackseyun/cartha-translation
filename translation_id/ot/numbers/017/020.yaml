base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: id
  text: Maka tongkat milik orang yang Kupilih akan bertunas, dan Aku akan menghentikan dari hadapan-Ku keluhan orang Israel yang mereka tujukan terhadap kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Maka
  rationale: Menandai hasil atau perkembangan yang akan terjadi dalam rangkaian perintah sebelumnya secara alami dalam bahasa Indonesia.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: orang yang Kupilih
  rationale: Menyampaikan pemilihan ilahi dengan wajar; konteks menunjukkan seorang pemimpin laki-laki, tetapi kata 'orang' menghindari kekakuan tanpa mengubah acuannya.
- source_word: מַטֵּהוּ
  choice: tongkat milik orang
  rationale: Sufiks orang ketiga dipertahankan secara eksplisit dan hubungan tongkat dengan orang yang dipilih dibuat jelas.
- source_word: יִפְרָח
  choice: akan bertunas
  rationale: Akar פרח dapat menunjuk pada bertunas atau berbunga; 'bertunas' paling tepat untuk tanda awal kehidupan, sementara ayat berikutnya merinci perkembangan selanjutnya.
- source_word: וַהֲשִׁכֹּתִי
  choice: Aku akan meredakan
  rationale: Bentuk kausatif menyatakan bahwa Allah membuat sungut-sungut itu surut atau berhenti; 'meredakan' juga cocok dengan מֵעָלַי.
- source_word: מֵעָלַי
  choice: terhadap-Ku
  rationale: Secara idiomatis menyatakan bahwa sungut-sungut itu membebani atau diarahkan kepada Allah, tanpa memakai gambaran harfiah 'dari atas-Ku' yang janggal.
- source_word: תְּלֻנּוֹת בְּנֵי יִשְׂרָאֵל
  choice: sungut-sungut orang Israel
  rationale: '''Sungut-sungut'' mempertahankan nada keluhan berulang, sedangkan ''orang Israel'' merupakan padanan kolektif alami bagi ungkapan Ibrani ''anak-anak Israel''.'
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: yang mereka lontarkan terhadap kalian
  rationale: Klausa relatif dipertahankan dan objek jamak 'kalian' dibuat jelas; 'lontarkan' menghindari pengulangan kaku kata 'bersungut-sungut' sambil menjaga arah permusuhan keluhan.
theological_decisions:
- issue: Arah sungut-sungut dalam מֵעָלַי dan עֲלֵיכֶם
  choice: terhadap-Ku ... terhadap kalian
  alternative: menjauh dari-Ku ... mengenai kalian
  rationale: 'Dua frasa preposisional dipertahankan agar ketegangan sumber tidak dihapus: Allah menanggung sungut-sungut itu, sementara umat melontarkannya terhadap Musa dan Harun.'
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan itu bersifat kolektif bagi bangsa Israel, bukan pembatasan pada anak laki-laki; pilihan ini alami dalam bahasa Indonesia modern dan tidak menambahkan tafsir denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. 'Kalian' dipakai untuk menandai bentuk jamak עֲלֵיכֶם secara terang.
