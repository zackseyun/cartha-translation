base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: id
  text: Keesokan harinya, Musa masuk ke dalam Kemah Kesaksian[a]. Lihatlah, tongkat Harun untuk keluarga Lewi[b] telah bertunas; tongkat itu mengeluarkan kuntum, menghasilkan bunga, dan menghasilkan buah badam yang matang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kemah Persaksian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bagi keluarga Lewi,” yaitu sebagai wakil kaum atau suku Lewi.'
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini menunjuk pada hari berikutnya. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan urutan waktu dalam narasi.
- source_word: אֹהֶל הָעֵדוּת
  choice: Kemah Kesaksian
  rationale: Terjemahan formal yang mempertahankan nuansa kesaksian yang bersifat perjanjian dan hukum dalam עֵדוּת.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan daya penunjuk yang hidup dalam narasi Ibrani serta mengarahkan perhatian pembaca kepada peristiwa ajaib itu.
- source_word: מַטֵּה
  choice: tongkat
  rationale: Dalam konteks ini kata tersebut menunjuk pada tongkat pemimpin yang mewakili kelompoknya; 'tongkat' jelas dan alami dalam bahasa Indonesia.
- source_word: פָּרַח
  choice: telah bertunas
  rationale: Menggambarkan tahap awal pertumbuhan pada tongkat itu dan membedakannya dari kuntum, bunga, serta buah yang disebut sesudahnya.
- source_word: לְבֵית לֵוִי
  choice: bagi kaum Lewi
  rationale: Mengungkapkan secara alami bahwa tongkat Harun mewakili kelompok keturunan Lewi, sambil tetap mempertahankan hubungan yang dinyatakan oleh frasa Ibrani.
- source_word: וַיֹּצֵא פֶרַח
  choice: mengeluarkan kuntum
  rationale: Menerjemahkan gambaran bahwa tongkat itu mengeluarkan pertumbuhan bunga dan mempertahankan perkembangan bertahap menuju bunga mekar serta buah.
- source_word: וַיָּצֵץ צִיץ
  choice: menghasilkan bunga
  rationale: Mempertahankan unsur pembungaan sebagai tahap tersendiri sesudah tunas dan kuntum.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: menghasilkan buah badam yang matang
  rationale: Kata kerja menyatakan bahwa buah mencapai kematangan, bukan sekadar mulai muncul. 'Buah badam' jelas bagi pembaca Indonesia dan menghindari anggapan bahwa yang dimaksud hanya biji olahan.
