  - severity: low
    issue: Frasa “tongkat Harun bagi kaum Lewi” agak kurang langsung.
    rationale: “Untuk keluarga Lewi” lebih dekat dengan לְבֵית לֵוִי dan tetap membiarkan catatan b menjelaskan fungsi perwakilannya.
