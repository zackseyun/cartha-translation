  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וַ/יִּתְּנ֣וּ אֵלָ֣י/ו כָּֽל נְשִֽׂיאֵי/הֶ֡ם מַטֶּה֩ לְ/נָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְ/נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּ/מַטֵּ֥ה אַהֲרֹ֖ן בְּ/ת֥וֹךְ מַטּוֹתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: id
  text: Lalu Musa berbicara kepada orang Israel[a]. Semua pemimpin mereka menyerahkan kepadanya masing-masing satu tongkat menurut kaum keluarga leluhur mereka, seluruhnya dua belas tongkat. Tongkat Harun ada di antara tongkat-tongkat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel,” sebutan baku dalam bahasa Ibrani bagi bangsa Israel secara kolektif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Kata kerja ini berarti berbicara atau menyampaikan perkataan; “berbicara kepada” sesuai dengan pengantar narasi dan objek berpreposisi dalam bahasa Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiahnya “anak-anak lelaki Israel,” tetapi secara baku menunjuk kepada bangsa Israel secara kolektif. “Orang Israel” alami dan jelas dalam bahasa Indonesia modern, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: נְשִׂיאֵיהֶם
  choice: pemimpin mereka
  rationale: Dalam konteks suku-suku Israel, נָשִׂיא menunjuk kepada pemimpin resmi tiap suku. “Pemimpin” jelas dan tidak menimbulkan kesan monarki seperti “pangeran.”
- source_word: מַטֶּה
  choice: tongkat
  rationale: Yang diserahkan ialah benda fisik berupa tongkat yang menjadi tanda perwakilan. “Tongkat” merupakan padanan Indonesia yang wajar dan konsisten.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד ... מַטֶּה לְנָשִׂיא אֶחָד
  choice: satu tongkat untuk setiap pemimpin
  rationale: Pengulangan Ibrani menyatakan pembagian satu demi satu. Rumusan ini mempertahankan makna distributifnya tanpa pengulangan yang kaku dalam bahasa Indonesia.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum leluhur mereka
  rationale: Ungkapan ini mengacu pada kelompok kekerabatan menurut garis leluhur pihak ayah. “Kaum leluhur” menyampaikan susunan sosial tersebut secara ringkas dan wajar.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: seluruhnya dua belas tongkat
  rationale: “Seluruhnya” memperjelas bahwa frasa bilangan ini menyatakan jumlah total tongkat yang diserahkan.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: Tongkat Harun ada di antara tongkat-tongkat mereka
  rationale: Klausa tanpa verba dalam bahasa Ibrani dinyatakan secara alami dengan “ada.” “Di antara” mempertahankan arti bahwa tongkat Harun termasuk di tengah kumpulan tongkat tersebut.
