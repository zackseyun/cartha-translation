translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur ayat dibagi menjadi tiga kalimat agar daftar panjang dalam bahasa Ibrani tetap mudah dipahami, tanpa mengubah urutan tindakan atau hubungan antarklausanya.
