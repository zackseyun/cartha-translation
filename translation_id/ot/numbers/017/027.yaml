  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: id
  text: Lalu orang Israel berkata kepada Musa, “Lihatlah, kami sedang sekarat! Kami binasa! Kami semua binasa!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara idiomatis menunjuk kepada bangsa Israel; 'orang Israel' alami dalam bahasa Indonesia modern dan mempertahankan identitas kolektifnya.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: berkata
  rationale: Dalam formula naratif Ibrani ini, לֵאמֹר memperkenalkan kutipan langsung dan tidak perlu diterjemahkan terpisah menjadi 'demikian' atau 'katanya' dalam bahasa Indonesia.
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel penarik perhatian ini menyampaikan seruan mendesak dan rasa gentar; 'Lihatlah' tetap bermartabat sekaligus mudah dipahami.
- source_word: גָּוַעְנוּ
  choice: kami sedang sekarat
  rationale: Kata kerja ini menyatakan mati atau mengembuskan napas terakhir. Bentuk progresif menangkap kepanikan yang sedang mereka rasakan serta membedakannya dari אבד.
- source_word: אָבַדְנוּ
  choice: kami binasa
  rationale: אבד menyatakan kebinasaan atau kehancuran. 'Binasa' mempertahankan intensitas seruan dan berbeda secara leksikal dari 'sekarat'.
- source_word: כֻּלָּנוּ
  choice: kami semua
  rationale: Pilihan ini alami dalam bahasa Indonesia dan menegaskan bahwa ancaman tersebut, menurut ketakutan mereka, mencakup seluruh umat.
- source_word: אָבָדְנוּ
  choice: binasa
  rationale: Pengulangan padanan yang sama mempertahankan repetisi retoris bahasa Ibrani dan kepanikan ucapan itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Perbedaan antara גוע dan אבד serta pengulangan אבד dipertahankan. Tidak ada catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat ini.
