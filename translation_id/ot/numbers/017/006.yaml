id: NUM.17.6
reference: Numbers 17:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: id
  text: Namun, keesokan harinya seluruh umat Israel bersungut-sungut terhadap Musa dan Harun, sambil berkata, “Kalian telah membunuh umat Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: bersungut-sungut
  rationale: Kata kerja ini menggambarkan keluhan bersama yang bernada menentang dalam kisah perjalanan di padang gurun. “Bersungut-sungut” mempertahankan nada permusuhan itu tanpa mengubahnya menjadi keluhan biasa.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk pada komunitas atau jemaah sebagai satu kesatuan, sedangkan בְּנֵי יִשְׂרָאֵל merupakan sebutan kolektif bagi bangsa Israel. “Seluruh umat Israel” alami dalam bahasa Indonesia dan mencakup seluruh komunitas yang dimaksud.
- source_word: מִמָּחֳרָת
  choice: keesokan harinya
  rationale: Ungkapan ini secara idiomatis berarti hari berikutnya. Pilihan ini ringkas dan alami dalam bahasa Indonesia modern.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: terhadap Musa dan terhadap Harun
  rationale: Pengulangan “terhadap” mencerminkan pengulangan preposisi עַל dan menegaskan bahwa keluhan itu diarahkan kepada kedua pemimpin secara khusus.
- source_word: לֵאמֹר
  choice: Mereka berkata
  rationale: Infinitif Ibrani ini memperkenalkan perkataan langsung. Menjadikannya kalimat baru menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan maknanya.
- source_word: אַתֶּם הֲמִתֶּם
  choice: Kalian telah membunuh
  rationale: Kata ganti dan bentuk verba sama-sama jamak serta menyampaikan tuduhan langsung bahwa Musa dan Harun menyebabkan kematian itu. “Kalian” memperjelas bentuk jamak, sedangkan “telah membunuh” mempertahankan ketajaman tuduhannya.
- source_word: עַם יְהוָה
  choice: umat Yahweh
  rationale: עַם adalah umat sebagai komunitas, dan יְהוָה adalah nama ilahi. Susunan “umat Yahweh” mempertahankan hubungan kepunyaan/perjanjian secara ringkas dan khidmat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak lelaki Israel; bani Israel
  rationale: Dalam konteks ini ungkapan tersebut adalah sebutan kolektif bagi komunitas Israel, bukan pembatasan eksplisit hanya kepada laki-laki. “Umat Israel” menyampaikan cakupan referennya dalam bahasa Indonesia modern tanpa menambahkan pembedaan gender yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Bersungut-sungut” mempertahankan warna khas narasi padang gurun; “kalian” dipakai karena tuduhan diarahkan kepada Musa dan Harun sekaligus. Tidak diperlukan catatan kaki karena pilihan utama dapat menyampaikan teks sumber tanpa kehilangan ambiguitas penting.
