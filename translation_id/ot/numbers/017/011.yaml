    issue: '"Bawalah segera kepada umat itu" menggantikan perintah untuk pergi cepat dengan perintah membawa sesuatu.'
    rationale: וְהוֹלֵךְ מְהֵרָה berarti Harun harus segera pergi/bergegas kepada jemaat. Walaupun perbaraan tersirat dibawa, verba sumber tidak terutama memerintahkan tindakan membawa wadah itu.
  - severity: low
    issue: '"tulah sudah mulai" terdengar agak eliptis dalam bahasa Indonesia modern.'
    rationale: Penambahan "itu" dan "melanda" membuat predikasi wabah/tulah lebih alami serta menyatakan implikasi konteks tanpa menambahkan rincian teologis.
