source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: id
  text: Lalu Musa berkata kepada Harun, “Ambillah perbaraan[a], taruhlah di dalamnya api dari mezbah, lalu bubuhkanlah dupa. Segeralah pergi kepada umat itu dan adakanlah pendamaian bagi mereka, sebab murka telah keluar dari hadapan Yahweh[b]; tulah itu sudah mulai melanda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: pedupaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari hadapan Yahweh,” yakni dari hadirat-Nya.'
    reason: lexical_clarification
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: perbaraan
  rationale: Istilah ini menunjuk pada wadah untuk membawa bara api dan dupa dalam pelayanan ritual. “Perbaraan” mempertahankan fungsi wadah tersebut dan lazim dipahami dalam konteks ibadah.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: taruhlah di dalamnya api dari mezbah
  rationale: Ungkapan ini mempertahankan sumber api, yaitu mezbah, sambil memakai bentuk Indonesia yang wajar untuk menaruh api ke dalam sebuah wadah.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: “Dupa” adalah padanan baku dan alami untuk bahan harum yang dibakar dalam pelayanan ritual.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: bawalah segera
  rationale: Bentuk verba menyatakan agar perbaraan itu dibawa, sedangkan מְהֵרָה menegaskan urgensi tindakan.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: Dalam kitab Bilangan, istilah ini menunjuk kepada umat Israel sebagai kesatuan yang berhimpun. “Umat itu” terdengar alami dan tetap mempertahankan makna kolektifnya.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: adakanlah pendamaian bagi mereka
  rationale: Dalam konteks keimaman, כפר adalah istilah ritual-teologis untuk tindakan pendamaian. Pilihan ini mempertahankan bobot istilah tanpa menentukan teori pendamaian tertentu.
- source_word: הַקֶּצֶף
  choice: murka
  rationale: Kata ini menggambarkan pecahnya amarah dan penghukuman ilahi; “murka” sesuai dengan suasana yang khidmat dan berat.
- source_word: מִלִּפְנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang sesuatu yang keluar dari hadapan atau hadirat Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: הֵחֵל הַנָּגֶף
  choice: tulah sudah mulai
  rationale: Dalam konteks ini נֶגֶף menunjuk pada pukulan mematikan dari Allah yang sedang melanda umat; “tulah” merupakan padanan yang ringkas dan kontekstual.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; “Yahweh” mempertahankan fungsi nama perjanjian itu.
- issue: Makna kultis verba כפר
  choice: adakanlah pendamaian bagi mereka
  alternative: adakanlah penghapusan dosa bagi mereka
  rationale: “Pendamaian” mempertahankan keluasan istilah ritual tersebut dan tidak mempersempitnya menjadi satu penjelasan teologis tentang cara kerjanya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Imperatif dibuat tegas untuk mempertahankan keadaan darurat dalam tuturan Musa; istilah ritual utama tetap dipertahankan tanpa bahasa denominatif.
