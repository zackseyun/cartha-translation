id: NUM.17.5
reference: Numbers 17:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: id
  text: sebagai pengingat bagi orang Israel[a], supaya tidak ada orang luar[b]—yaitu orang yang bukan keturunan Harun—mendekat untuk membakar dupa di hadapan Yahweh, dan supaya ia tidak menjadi seperti Korah dan kelompoknya, sebagaimana Yahweh telah berfirman melalui Musa kepadanya[d][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peringatan” atau “kenang-kenangan.”
    reason: lexical_alternative
  - marker: b
    text: “Orang luar” di sini berarti orang yang tidak berwenang menjalankan pelayanan imam, bukan orang asing berdasarkan suku atau bangsa.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “dengan tangan Musa,” sebuah ungkapan Ibrani yang berarti “melalui Musa.”
    reason: lexical_alternative
  - marker: d
    text: Kata “kepadanya” kemungkinan besar mengacu kepada Harun.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: tanda pengingat
  rationale: Menyatakan sesuatu yang berfungsi untuk mengingatkan atau menjadi peringatan; frasa ini alami dalam bahasa Indonesia dan tetap membuka nuansa 'tanda peringatan'.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Ungkapan Indonesia yang wajar bagi kelompok Israel secara keseluruhan tanpa memberi kesan bahwa yang dimaksud hanya anak laki-laki.
- source_word: אִישׁ זָר
  choice: orang luar
  rationale: Dalam konteks pelayanan imam, istilah ini menunjuk kepada orang di luar garis keimaman yang berwenang, bukan terutama orang asing secara etnis; catatan kaki menjelaskan batas maknanya.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: keturunan Harun
  rationale: Padanan alami bagi gagasan garis keturunan yang terkandung dalam זֶרַע.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: membakar dupa
  rationale: Mencerminkan tindakan ritual membuat dupa berasap di hadapan Yahweh dengan ungkapan Indonesia yang jelas.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan makna ruang-kehadiran dari לִפְנֵי serta menerjemahkan nama ilahi secara langsung.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: dan supaya ia tidak menjadi seperti Korah dan kelompoknya
  rationale: Mempertahankan bentuk perbandingan dan verba tunggal tanpa secara eksplisit menentukan apakah keserupaan itu terutama dalam tindakan atau nasib.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Mengungkapkan idiom Ibrani harfiah 'dengan tangan Musa' secara alami sebagai perantaraan Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Makna זָר dalam konteks keimaman
  choice: orang luar
  alternative: orang asing; orang yang tidak berwenang
  rationale: Larangan ini didasarkan pada ketiadaan hubungan dengan garis keturunan Harun, bukan pada etnisitas. Catatan kaki mencegah pembacaan etnis yang keliru.
- issue: Acuan pronomina לוֹ
  choice: kepadanya, tanpa menyebut nama dalam teks utama
  alternative: kepada Harun
  rationale: Harun kemungkinan besar merupakan acuannya, tetapi teks Ibrani hanya menyatakan pronomina maskulin tunggal. Ketidakpastian itu dipertahankan dalam teks dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Susunan tujuan ganda dipertahankan dengan dua klausa 'supaya'. Istilah ritual dibuat mudah dipahami tanpa menghapus tekstur keimaman ayat.
