lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol memajukan alur narasi. Dalam bahasa Indonesia, “lalu” menyatakan kelanjutan, sedangkan “berfirman” merupakan padanan wajar dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam komunikasi; “kepada Musa” adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Dalam formula Ibrani ini, לֵאמֹר mengantar isi firman yang menyusul. Bahasa Indonesia secara alami cukup memakai koma setelah “berfirman kepada Musa”; menerjemahkannya menjadi “demikian” atau “kata-Nya” akan menambah unsur yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama tersebut, sementara catatan kaki menjelaskan bentuk Ibraninya dan alternatif transliterasinya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Lalu” lebih idiomatis daripada memulai dengan “Dan” untuk kesinambungan naratif. Koma akhir mempertahankan fungsi ayat sebagai pengantar langsung kepada isi firman pada ayat berikutnya.
