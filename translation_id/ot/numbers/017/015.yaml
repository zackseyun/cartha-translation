  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: id
  text: Lalu Harun kembali kepada Musa di pintu masuk Kemah Pertemuan, dan tulah itu dihentikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditahan” atau “dibuat berhenti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Lalu Harun kembali
  rationale: Waw konsekutif melanjutkan urutan cerita, sedangkan שׁוּב menyatakan gerak kembali. “Lalu” memberi alur naratif yang wajar dalam bahasa Indonesia.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: אֶל menandai arah gerak menuju Musa. Kata “kembali” sudah menyiratkan arah kembali sehingga tidak perlu ditambah unsur lain.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח berarti pintu masuk atau bukaan. Dalam susunan kalimat ini, “di” secara alami menunjukkan lokasi Musa dan Harun, tanpa mengulang penanda arah. “Kemah Pertemuan” menerjemahkan אֹהֶל מוֹעֵד secara transparan dan lazim.
- source_word: הַמַּגֵּפָה
  choice: tulah itu
  rationale: מַגֵּפָה dalam konteks ini menunjuk pada bencana mematikan sebagai hukuman. “Tulah” merupakan padanan Indonesia yang jelas dan sesuai dengan konteks kitab ini.
- source_word: נֶעֱצָרָה
  choice: dihentikan
  rationale: Bentuk Nifal dari עצר menyatakan bahwa tulah tersebut dibuat berhenti. Bentuk pasif “dihentikan” mempertahankan bentuk sumber tanpa menyebut pelaku secara eksplisit.
theological_decisions:
- issue: Pelaku ilahi yang tersirat dalam berhentinya tulah
  choice: Mempertahankan bentuk pasif “dihentikan” tanpa menyebut Allah atau TUHAN sebagai subjek.
  alternative: “TUHAN menghentikan tulah itu” atau “tulah itu berhenti”
  rationale: Konteks menyiratkan tindakan ilahi, tetapi klausa Ibrani memakai bentuk pasif dan tidak menyebut pelakunya. Terjemahan tidak menjadikan pelaku tersirat itu eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kemah Pertemuan” dipertahankan sebagai istilah transparan yang sudah dikenal. Penanda catatan kaki ditempatkan sesudah “dihentikan,” yaitu kata yang diterangkannya.
