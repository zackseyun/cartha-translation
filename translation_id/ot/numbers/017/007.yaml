  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: id
  text: Ketika umat itu berhimpun menentang Musa dan Harun, mereka berpaling ke arah Kemah Pertemuan, dan lihatlah, awan itu menutupi Kemah Pertemuan[a], lalu kemuliaan Yahweh tampak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “awan itu menutupinya”; kata ganti itu paling alami merujuk kepada Kemah Pertemuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Dalam konstruksi וַיְהִי בְּהִקָּהֵל, unsur naratif dan klausa temporal paling alami dipadukan dalam bahasa Indonesia menjadi “Ketika ...”; tidak perlu diterjemahkan secara kaku sebagai “Dan terjadilah ketika”.
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: umat itu berhimpun
  rationale: Infinitif Nifal dengan בְּ menyatakan keadaan temporal, sedangkan עֵדָה menunjuk komunitas Israel secara kolektif. “Umat” lebih wajar dalam narasi Indonesia modern daripada “jemaat”, yang dapat terdengar terlalu gerejawi.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: menentang Musa dan Harun
  rationale: Dalam konteks perselisihan, עַל menyatakan sikap bermusuhan atau perlawanan, bukan sekadar arah gerak.
- source_word: וַיִּפְנוּ אֶל
  choice: mereka berpaling ke arah
  rationale: פנה menggambarkan tindakan mengarahkan diri atau pandangan secara fisik; “berpaling ke arah” mempertahankan tindakan tersebut tanpa menambahkan motif.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan langsung dan mapan bagi nama tempat kudus ini; huruf kapital menandai sebutan khusus.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: הִנֵּה menarik perhatian kepada pemandangan yang mendadak atau mencolok. “Tampaklah” mempertahankan daya deiktis dan nada khidmat secara alami.
- source_word: כִסָּהוּ הֶעָנָן
  choice: awan menutupi kemah itu
  rationale: כסה berarti “menutupi”, dan sufiks maskulin tunggal -הוּ paling wajar merujuk kepada אֹהֶל, “kemah”, anteceden maskulin tunggal terdekat.
- source_word: וַיֵּרָא כְּבוֹד
  choice: kemuliaan ... terlihat
  rationale: Bentuk Nifal ראה menyatakan bahwa kemuliaan itu menjadi tampak. “Terlihat” mempertahankan bentuk pasif/refleksif sumber dan menghindari penafsiran tambahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterakan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Rujukan sufiks pada כִסָּהוּ
  choice: awan menutupi Kemah Pertemuan
  alternative: awan menutupi umat atau seluruh tempat itu
  rationale: Sufiks maskulin tunggal paling alami merujuk kepada אֹהֶל, “kemah”, yang merupakan anteceden maskulin tunggal terdekat. Namun, karena rujukan pronominal tidak mengulang nomina secara eksplisit dalam bahasa Ibrani, hal ini dijelaskan dalam catatan.
- issue: Makna kemuliaan Yahweh yang terlihat
  choice: kemuliaan Yahweh terlihat
  alternative: Yahweh hadir dalam kemuliaan-Nya
  rationale: Terjemahan mempertahankan pernyataan visual teks tanpa menyamakan atau memisahkan “kemuliaan” dari kehadiran ilahi melalui rumusan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan, nuansa perlawanan, penanda perhatian הִנֵּה, serta ketegangan teologis dalam ungkapan “kemuliaan Yahweh terlihat”.
