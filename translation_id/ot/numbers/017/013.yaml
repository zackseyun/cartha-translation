  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: id
  text: Ia berdiri di antara orang-orang yang mati dan orang-orang yang hidup, lalu wabah itu berhenti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Ia berdiri
  rationale: Kata kerja עמד pada bentuk naratif ini secara konkret berarti “berdiri”; pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan perlawanan atau sikap militer.
- source_word: בֵּין ... וּבֵין
  choice: di antara ... dan ...
  rationale: Pasangan preposisi ini menunjukkan posisi di tengah dua kelompok yang dibedakan secara spasial.
- source_word: הַמֵּתִים
  choice: orang-orang yang mati
  rationale: Bentuk substantival ini menunjuk kepada mereka yang telah mati; ungkapan tersebut mempertahankan kontras yang tegas dengan mereka yang hidup.
- source_word: הַחַיִּים
  choice: orang-orang yang hidup
  rationale: Bentuk substantival ini menunjuk kepada mereka yang masih hidup dan menjadi pasangan kontras langsung bagi “orang-orang yang mati”.
- source_word: וַתֵּעָצַר
  choice: lalu ... berhenti
  rationale: Bentuk pasif dari עצר menyatakan bahwa laju wabah ditahan atau dihentikan. Dalam bahasa Indonesia, “wabah itu berhenti” menyampaikan hasil tersebut dengan wajar tanpa perlu mempertahankan bentuk pasif secara mekanis.
- source_word: הַמַּגֵּפָה
  choice: wabah
  rationale: מגפה di sini menunjuk kepada serangan mematikan yang menjalar dalam konteks penghukuman; “wabah” merupakan padanan Indonesia yang ringkas dan lazim.
theological_decisions:
- issue: Sifat מַגֵּפָה dalam konteks penghukuman ini
  choice: wabah
  alternative: malapetaka; tulah
  rationale: Konteks langsung menggambarkan kejadian mematikan yang meluas dan kemudian berhenti. “Wabah” mempertahankan sifat peristiwanya tanpa menambahkan penjelasan teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kontras antara yang mati dan yang hidup dipertahankan, sedangkan penghubung “lalu” mencerminkan urutan naratif wayyiqtol secara alami.
