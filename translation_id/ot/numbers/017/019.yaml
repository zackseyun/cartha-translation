  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: id
  text: Lalu engkau harus menaruh semua itu di dalam Kemah Pertemuan, di hadapan kesaksian[a], di tempat Aku bertemu dengan kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan saksi perjanjian”; “kesaksian” mungkin merujuk pada kesaksian perjanjian yang berkaitan dengan loh-loh di tempat kudus.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tempat Aku menyatakan diri kepada kalian” atau “di tempat Aku menetapkan pertemuan dengan kalian.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: Lalu engkau harus menaruh semuanya
  rationale: Bentuk Hifil orang kedua tunggal dengan sufiks jamak menyatakan tindakan menyebabkan benda-benda itu diletakkan. 'Menaruh' alami dalam bahasa Indonesia, sedangkan 'semuanya' memperjelas sufiks objek jamak tanpa mengulang nomina dari konteks.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di dalam Kemah Pertemuan
  rationale: Ungkapan ini merupakan sebutan baku bagi tempat kudus. Kapitalisasi menandainya sebagai nama khusus, dan 'di dalam' menyampaikan lokasi secara alami.
- source_word: לִפְנֵי הָעֵדוּת
  choice: di hadapan kesaksian
  rationale: לִפְנֵי berarti 'di hadapan/di depan', sedangkan הָעֵדוּת secara harfiah berarti 'kesaksian'. Terjemahan ini mempertahankan ketidakjelasan apakah yang dimaksud ialah loh-loh, tabut yang terkait dengannya, atau kesaksian perjanjian secara lebih luas.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: di tempat Aku bertemu
  rationale: Bentuk Nifal dari יעד dalam konteks tempat kudus menunjuk pada pertemuan yang ditetapkan. Gabungan אֲשֶׁר dan שָׁמָּה diterjemahkan secara lokatif sebagai 'di tempat'.
- source_word: לָכֶם
  choice: dengan kalian
  rationale: Walaupun preposisinya secara bentuk dapat berarti 'kepada/bagi kalian', dalam idiom bersama יעד maknanya adalah bertemu dengan pihak lain. Bentuk 'kalian' mempertahankan jumlah jamak.
- source_word: שָׁמָּה
  choice: di tempat
  rationale: Adverbia 'ke sana/di sana' diserap ke dalam frasa relatif lokatif 'di tempat ...' agar bahasa Indonesia tidak menjadi berulang.
theological_decisions:
- issue: Rujukan 'kesaksian'
  choice: Mempertahankan frasa harfiah 'kesaksian' tanpa menetapkan rujukannya secara khusus.
  alternative: loh-loh kesaksian; tabut kesaksian; kesaksian perjanjian
  rationale: Bahasa Ibrani memakai istilah yang sarat makna tetapi tidak menjelaskan rujukannya dalam ayat ini. Mempertahankan istilah tersebut menghindari penyempitan makna yang melampaui teks.
- issue: Nuansa אִוָּעֵד
  choice: Aku bertemu dengan kalian
  alternative: Aku menyatakan diri kepada kalian; Aku menetapkan pertemuan dengan kalian
  rationale: Dalam konteks Kemah Pertemuan, bentuk ini paling langsung menyatakan perjumpaan ilahi yang ditetapkan, tetapi kemungkinan nuansa penetapan atau penyataan diri dicatat tanpa dimasukkan secara dogmatis ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Engkau' mencerminkan penerima tunggal pada verba utama, sedangkan 'kalian' mempertahankan objek jamak לָכֶם. Penanda catatan kaki ditempatkan langsung dalam teks utama.
