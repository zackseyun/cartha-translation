translation:
  language: id
  text: Musa melakukan seperti yang Yahweh perintahkan kepadanya; demikianlah ia melakukannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה bermakna luas, ‘melakukan/membuat’. Dalam konteks menaati perintah, ‘melakukan’ paling alami dan memungkinkan pengulangan verba sumber dipertahankan.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti yang
  rationale: Ungkapan ini menyatakan kesesuaian tindakan Musa dengan perintah; ‘tepat seperti yang’ menyampaikan penekanan pada kecocokan tersebut secara alami.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Verba צוה menyatakan perintah yang berwibawa. Bentuk pasif ini menghasilkan susunan Indonesia yang alami tanpa mengurangi Yahweh sebagai pemberi perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֹתוֹ
  choice: kepadanya
  rationale: Penanda objek dengan sufiks orang ketiga tunggal maskulin merujuk kepada Musa; konstruksi Indonesia ‘memerintahkan ... kepadanya’ menyampaikan relasi gramatikal itu secara idiomatis.
- source_word: כֵּן
  choice: demikianlah
  rationale: כֵּן merangkum sekaligus menegaskan kesesuaian yang baru dinyatakan. ‘Demikianlah’ mempertahankan fungsi penegasnya dalam ragam yang bermartabat.
- source_word: עָשָׂה
  choice: dilakukannya
  rationale: Pengulangan עשה dipertahankan untuk mencerminkan penegasan Ibrani bahwa Musa sungguh melaksanakan perintah tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan ‘melakukan/dilakukannya’ sengaja dipertahankan karena mencerminkan struktur penegasan teks Ibrani; titik koma menandai klausa rangkuman yang erat kaitannya dengan klausa pertama.
