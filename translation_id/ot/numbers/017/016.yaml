  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Kemudian” alami dalam bahasa Indonesia, sedangkan “berfirman” merupakan pilihan baku dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam tindakan berbicara; “kepada Musa” adalah ungkapan Indonesia yang wajar.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan tersendiri
  rationale: Infinitif לֵאמֹר berfungsi sebagai formula pengantar bagi ucapan langsung yang menyusul. Dalam bahasa Indonesia, fungsi itu sudah tersampaikan secara alami oleh koma setelah “berfirman”; menerjemahkannya sebagai “dengan mengatakan” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian dengan gelar.
- issue: Pembedaan דבר dan אמר dalam formula pewahyuan
  choice: berfirman
  alternative: berbicara
  rationale: “Berfirman” secara wajar menandai ujaran ilahi dalam bahasa Indonesia tanpa menambahkan isi teologis di luar tindakan berbicara; fungsi לֵאמֹר sebagai pengantar ucapan berikutnya dinyatakan melalui tanda baca.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan gerak naratif dan nama ilahi dari teks Ibrani.
