  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: id
  text: Kemudian Musa dan Harun datang ke hadapan Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “ke muka Kemah Pertemuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan alur narasi dengan makna lampau. Kata 'datang' tidak menyiratkan bahwa mereka masuk ke dalam kemah.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Menggunakan bentuk nama yang baku dan umum dalam bahasa Indonesia. Verba Ibrani berbentuk tunggal meskipun subjeknya majemuk, suatu konstruksi yang wajar ketika verba mendahului subjek.
- source_word: אֶל־פְּנֵי
  choice: ke depan
  rationale: Ungkapan ini secara harfiah berarti 'ke muka/wajah' dan dalam konteks ruang menunjukkan gerak menuju bagian depan atau hadapan sesuatu. 'Ke depan' mempertahankan unsur arah tanpa menyatakan bahwa mereka masuk.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan Indonesia yang mapan bagi istilah tempat kudus ini serta mempertahankan hubungan konstruksi antara 'kemah' dan 'pertemuan'.
