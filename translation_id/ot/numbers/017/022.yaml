  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: id
  text: Lalu Musa meletakkan tongkat-tongkat itu di hadapan Yahweh, di dalam Kemah Kesaksian.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batang-batang itu.” Kata Ibrani מַטּוֹת di sini menunjuk pada tongkat-tongkat fisik yang mewakili suku-suku.
    reason: lexical_alternative
  - marker: b
    text: Atau “di dalam Tabernakel Kesaksian.” Secara harfiah, “di dalam kemah kesaksian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: meletakkan
  rationale: Bentuk Hifil dari נוח dalam rangkaian narasi menyatakan tindakan menaruh atau menempatkan sesuatu. “Meletakkan” konkret dan alami dalam bahasa Indonesia modern.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: הַמַּטֹּת
  choice: tongkat-tongkat itu
  rationale: מַטֶּה dapat berarti tongkat, batang, atau suku. Dalam konteks ini yang dimaksud ialah benda fisik yang mewakili suku-suku; pengulangan kata menyatakan bentuk jamak secara alami dalam bahasa Indonesia, sedangkan “itu” menandai tongkat-tongkat yang telah disebut.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini mempertahankan makna spasial sekaligus nuansa berada dalam hadirat Yahweh, tanpa menentukan lebih jauh bagaimana tongkat-tongkat itu disajikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi nama ilahi mempertahankan nama diri yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בְּאֹהֶל הָעֵדֻת
  choice: di dalam Kemah Kesaksian
  rationale: Terjemahan ini mengikuti unsur harfiah אֹהֶל, “kemah,” dan עֵדוּת, “kesaksian,” sebagai sebutan bagi tempat suci tersebut. Huruf kapital menandai nama atau sebutan khusus bangunan suci dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama diri ilahi YHWH. “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar, sementara tetap mengakui bahwa pelafalan kunonya tidak diketahui dengan kepastian mutlak.
- issue: Makna הָעֵדֻת dalam sebutan tempat suci
  choice: Kesaksian
  alternative: ketetapan perjanjian atau loh kesaksian
  rationale: “Kesaksian” mempertahankan keluasan istilah Ibrani dan hubungan tradisionalnya dengan kesaksian perjanjian, tanpa mempersempit rujukannya secara eksplisit hanya kepada dokumen atau loh tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani tanpa terasa kaku. Istilah “Kemah Kesaksian” dipertahankan sebagai sebutan khusus, sedangkan catatan kaki memberi padanan yang lebih interpretatif.
