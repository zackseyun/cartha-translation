  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: id
  text: Tuliskanlah nama Harun pada tongkat suku Lewi, sebab harus ada satu tongkat untuk kepala rumah leluhur mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “satu tongkat untuk setiap kepala rumah leluhur mereka.” Ungkapan Ibrani ini dapat dipahami secara distributif: setiap kepala rumah leluhur diwakili oleh satu tongkat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת֙ שֵׁ֣ם אַהֲרֹ֔ן תִּכְתֹּ֖ב
  choice: Tuliskanlah nama Harun
  rationale: Bentuk imperfek orang kedua tunggal berfungsi sebagai perintah dalam rangkaian petunjuk kepada Musa. Konjungsi Ibrani tidak perlu dinyatakan tersendiri agar perintah terdengar alami dalam bahasa Indonesia.
- source_word: עַל מַטֵּ֣ה לֵוִ֑י
  choice: pada tongkat suku Lewi
  rationale: מַטֶּה menunjuk pada tongkat nyata yang mewakili suatu suku. Penambahan 'suku' menjelaskan fungsi representatif nama Lewi secara wajar tanpa mengubah maksud sumber.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan nama Harun harus dituliskan pada tongkat Lewi.
- source_word: מַטֶּה אֶחָד
  choice: satu tongkat
  rationale: Terjemahan langsung yang mempertahankan penekanan pada satu tongkat sebagai wakil.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: untuk setiap kepala kaum leluhur mereka
  rationale: רֹאשׁ berarti kepala atau pemimpin, sedangkan בֵּית אָבוֹת adalah satuan kekerabatan berdasarkan garis leluhur. 'Setiap' menyatakan pembacaan distributif yang paling wajar dalam konteks pengumpulan tongkat dari para kepala, sementara catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
theological_decisions:
- issue: Hubungan tongkat Lewi dengan kepemimpinan Harun
  choice: tongkat suku Lewi
  alternative: tongkat Lewi
  rationale: Ungkapan ini dijelaskan sebagai tongkat yang mewakili suku Lewi, tanpa menambahkan klaim teologis mengenai cakupan jabatan Harun.
- issue: Makna distributif לְרֹאשׁ
  choice: untuk setiap kepala
  alternative: untuk kepala
  rationale: Konteks mendukung arti distributif, tetapi teks Ibrani tidak memiliki kata eksplisit yang berarti 'setiap'; karena itu bentuk lebih harfiah dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Tongkat' dipilih daripada 'gada'; 'kaum leluhur' dipakai untuk satuan kekerabatan paternal, dan 'kepala' mempertahankan metafora sosial bahasa sumber.
