  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kaum leluhur’ dipilih untuk בית אב agar struktur kekerabatan kuno tetap tampak tanpa memakai istilah yang terlalu arkais. Tanda pisah membantu menampilkan ‘dua belas tongkat’ sebagai jumlah keseluruhan.
