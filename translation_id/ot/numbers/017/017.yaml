base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: id
  text: Berbicaralah kepada orang Israel[a] dan ambillah dari mereka satu tongkat[b] untuk setiap kaum leluhur, dari setiap pemimpin mereka menurut kaum leluhur mereka—dua belas tongkat semuanya. Tuliskanlah nama masing-masing orang pada tongkatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang sama dapat berarti “tongkat” atau “batang”; di sini yang dimaksud ialah benda fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan kolektif ini secara harfiah berarti ‘anak-anak Israel’, tetapi ‘orang Israel’ menyampaikan rujukannya secara alami dan jelas dalam bahasa Indonesia modern tanpa mengubah cakupannya.
- source_word: מַטֶּה
  choice: tongkat
  rationale: Dalam konteks ini kata tersebut menunjuk pada benda fisik yang dapat ditulisi dan kemudian bertunas; ‘tongkat’ merupakan padanan Indonesia yang paling alami.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: satu tongkat untuk setiap kaum leluhur
  rationale: Pengulangan מַטֶּה bersifat distributif dan dinyatakan dengan ‘satu ... untuk setiap’. ‘Kaum leluhur’ mempertahankan gagasan kelompok kekerabatan patrilineal, bukan sekadar keluarga inti.
- source_word: נְשִׂיאֵיהֶם
  choice: pemimpin mereka
  rationale: Kata ini menunjuk pada para kepala atau pemimpin kelompok Israel; ‘pemimpin’ jelas dan tidak menimbulkan kesan gelar kerajaan.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum leluhur mereka
  rationale: Frasa ini menunjukkan dasar pengelompokan para pemimpin dan tongkat, yaitu kelompok kekerabatan leluhur.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: semuanya dua belas tongkat
  rationale: ‘Semuanya’ memperjelas bahwa dua belas adalah jumlah total tongkat tanpa menambahkan informasi baru.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: Tuliskanlah nama masing-masing orang
  rationale: ‘Masing-masing orang’ mempertahankan daya distributif אִישׁ dan perintah langsung dalam bahasa Indonesia yang alami.
- source_word: עַל מַטֵּהוּ
  choice: pada tongkatnya
  rationale: Bentuk posesif tunggal menghubungkan setiap nama dengan tongkat orang yang bersangkutan.
