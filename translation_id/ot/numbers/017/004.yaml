base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: id
  text: Lalu Imam Eleazar mengambil perbaraan-perbaraan[a] dari perunggu[b] yang telah dipersembahkan oleh orang-orang yang terbakar itu[c], dan semuanya ditempa[d] menjadi pelapis[e] bagi mazbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pedupaan-pedupaan” atau “wadah-wadah bara.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tembaga.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “orang-orang yang dibakar itu”; yang dimaksud ialah mereka yang dimakan api dalam kisah sebelumnya.
    reason: lexical_and_contextual_clarification
  - marker: d
    text: Secara harfiah, “mereka menempa benda-benda itu”; pelaku penempaan tidak disebutkan.
    reason: grammatical_ambiguity
  - marker: e
    text: Atau “lapisan penutup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: perbaraan-perbaraan
  rationale: Istilah ini menunjuk pada wadah untuk membawa bara dan membakar dupa; “perbaraan” mempertahankan fungsi ibadahnya, sedangkan “pedupaan” merupakan alternatif yang wajar.
- source_word: הַנְּחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat menunjuk pada tembaga atau perunggu; dalam konteks perlengkapan Kemah Suci, “perunggu” merupakan padanan yang paling mungkin.
- source_word: הִקְרִיבוּ
  choice: telah dipersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa ke hadapan atau mempersembahkan; “telah” memperjelas bahwa tindakan itu mendahului tindakan Eleazar.
- source_word: הַשְּׂרֻפִים
  choice: orang-orang yang terbakar itu
  rationale: Partisip pasif dari שׂרף secara harfiah menyebut mereka sebagai orang-orang yang dibakar atau terbakar, dengan rujukan pada orang-orang yang dimakan api dalam kisah sebelumnya.
- source_word: וַיְרַקְּעוּם
  choice: semuanya ditempa
  rationale: רקע berarti menempa atau memipihkan logam dengan pukulan. Bentuk Ibrani secara harfiah aktif jamak dengan akhiran objek jamak, tetapi pelakunya tidak disebutkan; bentuk pasif Indonesia menjaga ketidakjelasan pelaku sambil mempertahankan objeknya.
- source_word: צִפּוּי
  choice: pelapis
  rationale: Kata ini menunjuk pada bahan yang dipasang sebagai lapisan penutup; “pelapis” alami dalam bahasa Indonesia dan sesuai dengan hasil penempaan logam.
- source_word: לַמִּזְבֵּחַ
  choice: bagi mazbah
  rationale: 'Preposisi ל menyatakan tujuan atau peruntukan: logam yang ditempa itu dijadikan pelapis bagi mazbah.'
