review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada umumnya setia kepada teks Ibrani. Objek tersirat pada “mengambilnya” tepat. Namun, וַיִּתֵּן אֶת־הַקְּטֹרֶת dalam konteks ritual ini lebih jelas dan alami bila menyatakan bahwa dupa diletakkan di atas api; “menaruh dupa itu” tanpa pelengkap tempat terdengar seolah-olah hanya meletakkannya di suatu tempat.
  naturalness: Bahasa baku dan alur naratifnya baik. “Umat yang berkumpul” dapat dipahami, tetapi “umat” sudah cukup alami untuk הַקָּהָל dalam konteks ini. “Meletakkan dupa itu di atas api” memperbaiki kelancaran dan kejelasan tindakan ritual.
  terminology: “Tulah” tepat untuk נֶגֶף, dan “mengadakan pendamaian bagi umat” mempertahankan istilah kultis untuk כפר tanpa penafsiran doktrinal tambahan. “Dupa” tepat untuk קְטֹרֶת.
  issues:
  - severity: medium
    issue: Tindakan menaruh dupa kurang lengkap secara idiomatis
    rationale: Frasa “ia menaruh dupa itu” tidak menyebutkan tempat atau sasaran tindakan dan dalam bahasa Indonesia dapat berarti sekadar meletakkan dupa. Konteks langsung yang dirujuk ayat sebelumnya adalah api dalam pedupaan; “di atas api” menjelaskan tindakan yang dimaksud tanpa mengubah makna.
  revised_text: Maka Harun mengambilnya, seperti yang dikatakan Musa, lalu berlari ke tengah-tengah umat. Ternyata tulah itu sudah mulai melanda umat. Kemudian ia meletakkan dupa itu di atas api dan mengadakan pendamaian bagi umat.
