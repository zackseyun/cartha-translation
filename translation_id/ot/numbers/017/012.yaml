  to: Maka Harun mengambilnya, seperti yang dikatakan Musa, lalu berlari ke tengah-tengah umat. Ternyata tulah itu sudah mulai melanda umat. Kemudian ia meletakkan dupa itu di atas api dan mengadakan pendamaian bagi umat.
  rationale: Revisi terbatas pada kejelasan tindakan ritual “menaruh dupa” dan penyederhanaan “umat yang berkumpul” menjadi “umat.” Urutan narasi, objek tersirat, fungsi וְהִנֵּה, makna tulah, dan istilah pendamaian tetap dipertahankan.
