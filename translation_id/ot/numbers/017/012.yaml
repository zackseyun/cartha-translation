  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: id
  text: Maka Harun mengambilnya, seperti yang dikatakan Musa, lalu berlari ke tengah-tengah umat. Ternyata tulah itu sudah mulai melanda umat. Kemudian ia meletakkan dupa itu di atas api dan mengadakan pendamaian bagi umat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambilnya
  rationale: Verba ini berarti 'mengambil'. Akhiran -nya memasok objek yang tersirat dari ayat sebelumnya, sebagaimana diperlukan dalam bahasa Indonesia yang alami.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: seperti yang dikatakan Musa
  rationale: דבר berarti 'berbicara/mengatakan', bukan secara khusus 'memerintahkan'; bentuk ini mempertahankan cakupan makna sumber.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: lalu berlari ke tengah-tengah umat yang berkumpul
  rationale: רוץ diterjemahkan langsung sebagai 'berlari', sedangkan קהל menunjuk kepada umat Israel yang sedang berhimpun; frasa ini alami dan tidak memberi asosiasi kelembagaan gerejawi.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Partikel ini mengarahkan perhatian pembaca kepada perkembangan yang nyata dan mengejutkan dalam adegan; 'ternyata' menyampaikan fungsi wacananya secara alami.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: tulah itu sudah mulai melanda umat
  rationale: נֶגֶף dalam konteks ini adalah tulah penghukuman. 'Sudah mulai' menyatakan tindakan yang telah bermula, dan 'melanda' mengungkapkan secara idiomatis bahwa tulah terjadi di tengah umat.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: ia menaruh dupa itu
  rationale: נתן secara harfiah berarti 'memberikan/menaruh'. 'Menaruh' mempertahankan tindakan konkret tanpa menafsirkannya langsung sebagai 'mempersembahkan'.
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: mengadakan pendamaian bagi umat
  rationale: Dalam konteks ritual keimaman, כפר menyatakan tindakan pendamaian yang menangani pelanggaran dan berpalingnya penghukuman; padanan ini mempertahankan bobot kultis-teologisnya dalam bahasa Indonesia yang dikenal luas.
theological_decisions:
- issue: Pemadanan verba kultis כפר
  choice: mengadakan pendamaian bagi umat
  alternative: mengadakan penebusan bagi umat
  rationale: '''Pendamaian'' mempertahankan tindakan ritual imam tanpa menyempitkan mekanismenya. ''Penebusan'' dapat mengisyaratkan pembayaran atau pembebasan secara lebih khusus daripada yang dinyatakan verba ini dalam konteks.'
- issue: Pemadanan קָהָל
  choice: umat yang berkumpul
  alternative: jemaah
  rationale: Pilihan ini menggambarkan kumpulan umat Israel secara jelas sambil menghindari kesan bahwa istilah sumber menunjuk kepada lembaga keagamaan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Struktur narasi dibuat alami dengan 'lalu', 'ternyata', dan 'kemudian', tanpa menghapus urutan tindakan atau bobot ritual teks sumber.
