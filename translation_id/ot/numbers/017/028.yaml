base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: id
  text: Setiap orang yang mendekat—yang mendekat ke Kemah Suci Yahweh—akan mati. Apakah kami semua akan binasa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah kami semua akan mati?” Dalam bahasa Ibrani, kata kerja di sini berbeda dari kata yang diterjemahkan “akan mati” sebelumnya; kata ini dapat berarti mati atau binasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: setiap orang
  rationale: Dalam konteks ini kata tersebut mencakup siapa pun yang mendekat; “setiap orang” menyampaikan cakupan menyeluruh secara alami dalam bahasa Indonesia.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: yang mendekat, yang mendekat
  rationale: Pengulangan partisip Ibrani dipertahankan untuk mencerminkan penekanan dan kegentaran dalam ucapan bangsa itu, tanpa menghaluskannya menjadi satu ungkapan saja.
- source_word: מִשְׁכַּן
  choice: Kemah Suci
  rationale: Istilah ini menunjuk pada tempat kediaman kudus Yahweh di padang gurun. “Kemah Suci” merupakan ungkapan Indonesia yang jelas dan lazim untuk bangunan ibadah tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: יָמוּת
  choice: akan mati
  rationale: Bentuk imperfek di sini menyatakan akibat yang akan dialami oleh orang yang mendekat; “akan mati” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַאִם
  choice: apakah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengungkapkan ketakutan bangsa itu.
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: kami semua akan binasa
  rationale: תמם membawa gagasan menjadi habis atau mencapai kesudahan, sedangkan גוע berarti mati atau binasa. “Akan binasa” menyampaikan ancaman kehancuran menyeluruh dan mempertahankan perbedaan ungkapan dari יָמוּת.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi.
- issue: Cakupan kata ganti orang pertama jamak dalam pertanyaan penutup
  choice: kami
  alternative: kita
  rationale: Bangsa itu sedang berbicara kepada Musa, sehingga “kami” paling alami untuk suara kelompok tersebut. Namun, bahasa Ibrani tidak membedakan bentuk inklusif dan eksklusif seperti bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan “yang mendekat” sengaja dipertahankan untuk mencerminkan tekanan retoris teks Ibrani. Istilah “Kemah Suci” dipakai sebagai sebutan yang mudah dipahami bagi מִשְׁכָּן dalam konteks perjalanan di padang gurun.
