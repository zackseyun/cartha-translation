  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: id
  text: Pedupaan milik orang-orang yang berdosa sehingga kehilangan nyawa mereka[a] itu harus ditempa menjadi lempengan-lempengan untuk melapisi mazbah. Sebab, mereka telah mempersembahkan pedupaan itu di hadapan Yahweh sehingga pedupaan itu menjadi kudus.[b] Semuanya akan menjadi tanda bagi umat Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang berdosa itu dengan nyawa mereka”; dapat juga dipahami, “yang berdosa dengan taruhan nyawa mereka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pedupaan itu telah dikuduskan.” Subjek yang paling wajar adalah pedupaan-pedupaan tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: pedupaan
  rationale: Kata ini menunjuk pada wadah untuk membawa bara dan membakar dupa dalam konteks ibadah; “pedupaan” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: orang-orang yang berdosa sehingga kehilangan nyawa mereka
  rationale: Bentuk partisip menyoroti tindakan dosa mereka, sedangkan frasa בְּנַפְשֹׁתָם dalam konteks ini menyatakan akibat yang mematikan. “Sehingga kehilangan nyawa mereka” menyampaikan hubungan itu secara alami tanpa mengembangkan dikotomi jiwa-tubuh.
- source_word: וְעָשׂוּ אֹתָם
  choice: harus ditempa
  rationale: Klausa ini meneruskan perintah dari ayat sebelumnya. Bentuk pasif alami dalam bahasa Indonesia juga menghindari pengulangan pronomina yang kaku dan tetap menyampaikan daya perintah.
- source_word: רִקֻּעֵי פַחִים
  choice: lempengan-lempengan
  rationale: Ungkapan ini menggambarkan logam yang dipukul atau ditempa hingga menjadi lembaran/lempengan. Verba “ditempa” sudah menyatakan prosesnya, sehingga nomina “lempengan-lempengan” cukup jelas.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: untuk melapisi mazbah
  rationale: Ungkapan ini menyatakan fungsi lempengan tersebut sebagai lapisan penutup mazbah. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada “sebagai penutup bagi mazbah”.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: Sebab, mereka telah mempersembahkan pedupaan itu di hadapan Yahweh
  rationale: הקריב di sini merupakan istilah kultis untuk membawa atau mempersembahkan sesuatu ke hadapan Allah. Objek dinyatakan ulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama pribadi dalam teks sumber.
- source_word: וַיִּקְדָּשׁוּ
  choice: pedupaan itu menjadi kudus
  rationale: Rujukan paling wajar dari verba jamak ini adalah pedupaan-pedupaan yang telah dipersembahkan. “Menjadi kudus” mempertahankan hasilnya tanpa menentukan pelaku yang menguduskannya.
- source_word: וְיִהְיוּ לְאוֹת
  choice: Semuanya akan menjadi tanda
  rationale: Subjeknya tetap benda-benda yang diolah menjadi lapisan mazbah. “Menjadi tanda” mempertahankan fungsi peringatan tanpa menambahkan tafsiran.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi umat Israel
  rationale: Secara harfiah berarti “bagi anak-anak Israel”, tetapi sebagai sebutan kolektif bagi seluruh komunitas, “umat Israel” lebih alami, inklusif, dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan pernyataan pengudusan
  choice: Pedupaan-pedupaan itu menjadi kudus setelah dipersembahkan di hadapan Yahweh.
  alternative: Orang-orang yang memberontak itu menjadi kudus dalam pengertian ritual tertentu.
  rationale: Pedupaan merupakan anteseden terdekat dan menjadi pokok seluruh perintah. Alur ayat menjelaskan mengapa benda yang terkait dengan dosa para pemberontak tidak dibuang, melainkan dipakai untuk tujuan kudus. Terjemahan mempertahankan ketegangan bahwa benda milik para pendosa dapat memperoleh status kudus.
- issue: Makna בְּנַפְשֹׁתָם
  choice: Dosa mereka berakibat pada hilangnya nyawa mereka sendiri.
  alternative: Mereka berdosa terhadap nyawa atau jiwa mereka sendiri.
  rationale: Dalam konteks hukuman mati atas pemberontakan, frasa ini paling wajar menyatakan akibat yang mereka tanggung. Catatan kaki mempertahankan bentuk ungkapan sumber serta kemungkinan nuansa “dengan taruhan nyawa mereka”.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Mazbah” dipertahankan sebagai istilah khusus bagi altar persembahan, sedangkan “umat Israel” dipilih sebagai padanan kolektif alami untuk בְּנֵי יִשְׂרָאֵל. Struktur kalimat dipecah agar perintah, alasannya, dan fungsi tandanya mudah dipahami.
