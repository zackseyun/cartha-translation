  text: וּ/מִ/בָּמ֗וֹת הַ/גַּיְא֙ אֲשֶׁר֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַ/פִּסְגָּ֑ה וְ/נִשְׁקָ֖פָה עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: id
  text: dan dari Bamot ke lembah yang terletak di wilayah Moab, sampai ke puncak Pisga yang menghadap ke kawasan tandus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yeshimon”, jika istilah Ibrani ini dipahami sebagai nama suatu kawasan, bukan sebagai kata umum yang berarti daerah tandus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan [puncak itu] menghadap ke permukaan kawasan tandus”; ungkapan Ibrani ini berarti menghadap atau memandang ke arah kawasan tandus itu.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: dan dari Bamot
  rationale: Konjungsi dan preposisi diterjemahkan secara langsung. בָּמוֹת berfungsi sebagai nama tempat dalam rangkaian perjalanan, sehingga ditransliterasikan sebagai “Bamot”, bukan diterjemahkan sebagai “bukit-bukit pengurbanan” atau “tempat-tempat tinggi”.
- source_word: הַגַּיְא
  choice: lembah
  rationale: גַּיְא dapat berarti lembah atau jurang; “lembah” paling wajar dalam urutan geografis ini.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: yang terletak di wilayah Moab
  rationale: שָׂדֶה secara harfiah berarti “ladang”, tetapi dalam pemakaian geografis dapat menunjuk pada daerah atau wilayah terbuka. “Wilayah Moab” menyampaikan maksudnya secara alami dalam bahasa Indonesia.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: sampai ke puncak Pisga
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi dalam konteks topografi berarti puncak. Pisga dipertahankan sebagai nama tempat.
- source_word: וְנִשְׁקָפָה
  choice: yang menghadap
  rationale: Bentuk ini menggambarkan puncak Pisga sebagai tempat yang menghadap atau memandang ke arah kawasan di bawahnya. Klausa relatif menghasilkan bahasa Indonesia yang alami dan mempertahankan kaitannya dengan puncak Pisga.
- source_word: עַל־פְּנֵי
  choice: menghadap ke
  rationale: Ungkapan Ibrani ini secara harfiah memakai kata “muka/permukaan”, tetapi secara idiomatis berarti menghadap atau memandang ke arah suatu kawasan.
- source_word: הַיְשִׁימֹן
  choice: kawasan tandus
  rationale: יְשִׁימוֹן menunjuk pada daerah gersang atau tandus. Karena kata ini mungkin juga berfungsi sebagai nama kawasan, alternatif “Yeshimon” dicantumkan dalam catatan kaki.
