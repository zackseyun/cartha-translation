id: NUM.21.28
reference: Numbers 21:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: id
  text: 'Sebab api telah keluar dari Hesybon,

    nyala api dari kota Sihon;

    api itu melalap Ar-Moab,

    para penguasa tempat-tempat tinggi Arnon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pemilik ketinggian-ketinggian Arnon.” Kata Ibrani yang diterjemahkan “para penguasa” dapat juga berarti “para tuan” atau “para pemilik,” sedangkan “tempat-tempat tinggi” dapat dipahami lebih umum sebagai “ketinggian-ketinggian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai bahwa baris ini memberikan alasan atau penjelasan bagi perkataan dalam nyanyian sebelumnya.
- source_word: אֵשׁ יָצְאָה
  choice: api keluar
  rationale: Mempertahankan gambaran puitis tentang api yang berasal dan bergerak keluar dari suatu tempat.
- source_word: מֵחֶשְׁבּוֹן
  choice: dari Hesybon
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: לֶהָבָה
  choice: nyala api
  rationale: Padanan konkret dan alami yang mempertahankan kesejajaran puitis dengan 'api'.
- source_word: מִקִּרְיַת סִיחֹן
  choice: dari kota Sihon
  rationale: קִרְיָה merupakan kata benda umum 'kota', sedangkan Sihon menyatakan pemilik atau penguasanya.
- source_word: אָכְלָה
  choice: melalap
  rationale: Menyampaikan metafora Ibrani tentang api yang 'memakan' secara alami dan kuat dalam bahasa Indonesia.
- source_word: עָר מוֹאָב
  choice: Ar-Moab
  rationale: עָר dipahami sebagai nama tempat Ar, bukan diterjemahkan sebagai kata umum 'kota'; tanda hubung memperjelas kesatuan nama geografis.
- source_word: בַּעֲלֵי
  choice: para penguasa
  rationale: Mewakili arti harfiah 'tuan-tuan/pemilik-pemilik' dengan diksi Indonesia yang wajar, tanpa menggantinya secara interpretatif dengan 'penduduk'.
- source_word: בָּמוֹת אַרְנֹן
  choice: tempat-tempat tinggi di Arnon
  rationale: Mempertahankan kemungkinan bahwa בָּמוֹת menunjuk tempat-tempat tinggi tertentu, termasuk kemungkinan nuansa kultis, sambil mengaitkannya dengan wilayah Arnon.
theological_decisions:
- issue: Makna frasa בַּעֲלֵי בָּמוֹת אַרְנֹן
  choice: para penguasa tempat-tempat tinggi di Arnon
  alternative: ketinggian-ketinggian Arnon
  rationale: Teks utama mengikuti susunan konsonantal Ibrani secara lebih langsung dengan mempertahankan בַּעֲלֵי sebagai 'para penguasa'. Karena frasa puitis ini sukar dan בָּמוֹת juga dapat bersifat geografis, alternatif yang tidak menyebut para penguasa dicatat tanpa menjadikannya satu-satunya penafsiran.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan susunan baris puitis. 'Melalap' dipilih untuk daya ungkap alami; nama-nama geografis dipertahankan. Ambiguitas frasa penutup tidak diselesaikan secara diam-diam, melainkan dijelaskan dalam catatan kaki.
