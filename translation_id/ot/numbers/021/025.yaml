  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: id
  text: Israel mengambil semua kota itu, lalu menetap di semua kota orang Amori, di Hesbon dan di semua permukiman bawahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan di semua anak-anak perempuannya”; ini adalah ungkapan untuk permukiman-permukiman yang bergantung pada sebuah kota utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: merebut
  rationale: Dalam konteks peperangan, לקח berarti mengambil atau merebut. 'Merebut' menyampaikan penguasaan kota-kota melalui penaklukan secara alami dalam bahasa Indonesia.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: semua kota itu
  rationale: עָרִים dapat berarti kota-kota atau permukiman. 'Kota' merupakan padanan umum, sedangkan הָאֵלֶּה dipertahankan dengan 'itu' sesuai rujukan dalam konteks.
- source_word: וַיֵּשֶׁב
  choice: lalu menetap
  rationale: ישׁב di sini menyatakan bahwa Israel tinggal atau bermukim di tempat-tempat yang telah direbut. 'Menetap' menangkap peralihan menuju pemukiman.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: di semua kota orang Amori
  rationale: Frasa konstruksi ini dipertahankan secara transparan sebagai kota-kota yang dihuni atau dikuasai orang Amori.
- source_word: בְּחֶשְׁבּוֹן
  choice: termasuk Hesbon
  rationale: Secara sintaksis, Hesbon merupakan kota utama dalam cakupan kota-kota orang Amori. 'Termasuk' membuat hubungan ini jelas dan alami tanpa mengubah cakupan makna.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: dan semua kota kecil di bawah kekuasaannya
  rationale: Secara harfiah, בנותיה berarti 'anak-anak perempuannya', tetapi sebagai idiom geografis menunjuk pada permukiman bawahan yang bergantung pada kota induk, yaitu Hesbon.
