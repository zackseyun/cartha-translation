  source_fidelity: 'Teks menerjemahkan seluruh unsur utama Ibrani dengan setia: perubahan arah (וַיִּפְנוּ), gerak naik (וַיַּעֲלוּ), rute yang berkaitan dengan Basan, Og sebagai raja Basan, keluarnya Og untuk menemui mereka, cakupan ''ia dan seluruh rakyatnya,'' tujuan berperang, dan lokasi Edrei. ''Menemui mereka'' dengan catatan alternatif ''menghadapi mereka'' secara tepat mempertahankan kenetralan leksikal לִקְרָאתָם sambil membiarkan konteks perang menyatakan permusuhan.'
