  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְנוּ֙ וַֽ/יַּעֲל֔וּ דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתָ֜/ם ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: id
  text: Lalu mereka berbalik dan berjalan naik melalui jalan menuju Basan. Og, raja Basan, keluar menemui mereka[a], bersama seluruh rakyatnya, untuk berperang di Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghadapi mereka”. Ungkapan Ibrani ini pada dirinya sendiri dapat berarti sekadar “menemui mereka”, tetapi frasa berikutnya, “untuk berperang”, menunjukkan bahwa pertemuan ini bersifat bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: mereka berbalik
  rationale: Kata פנה dalam rangkaian narasi menunjukkan perubahan arah; “berbalik” ringkas, alami, dan tidak menambahkan alasan bagi perubahan itu.
- source_word: וַיַּעֲלוּ
  choice: berjalan naik
  rationale: Kata עלה mempertahankan unsur arah atau topografi “naik”; “berjalan naik” terdengar alami dalam bahasa Indonesia dan tidak menyiratkan pendakian terjal.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: melalui jalan menuju Basan
  rationale: Konstruksi דרך dengan nama tempat menunjuk rute yang berkaitan dengan Basan. “Jalan menuju Basan” jelas bagi pembaca modern, sementara “melalui” menyatakan bahwa itulah rute perjalanan mereka.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, raja Basan
  rationale: Nama diri ditransliterasikan sebagai “Og” dan “Basan”; aposisi gelarnya disajikan secara wajar dengan tanda koma.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: יצא berarti keluar atau pergi keluar. Dalam konteks militer, “keluar” cukup menyampaikan gerakan menyongsong lawan tanpa menambahkan gagasan “berbaris” yang tidak dinyatakan.
- source_word: לִקְרָאתָם
  choice: menemui mereka
  rationale: Ungkapan ini secara leksikal berarti bergerak untuk menemui atau menyongsong mereka dan pada dirinya sendiri dapat netral; maksud bermusuhan dijelaskan oleh frasa berikutnya, “untuk berperang”.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: bersama seluruh rakyatnya
  rationale: עם secara harfiah berarti “rakyat” atau “bangsa,” bukan secara eksplisit “pasukan.” Kata “bersama” menghasilkan susunan Indonesia yang alami tanpa mengubah cakupan ungkapan Ibrani.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Frasa ini menyatakan tujuan pertemuan tersebut. Bentuk verbal “untuk berperang” lebih alami dalam bahasa Indonesia modern daripada “untuk pertempuran.”
- source_word: אֶדְרֶעִי
  choice: di Edrei
  rationale: Nama tempat ditransliterasikan, dan “di” menyatakan lokasi pertempuran tanpa memaksakan nuansa arah yang tidak ditandai secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas dan bermartabat. Unsur topografis pada “berjalan naik” dipertahankan, dan istilah “rakyatnya” dipilih agar teks tidak mempersempit makna menjadi pasukan saja. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
