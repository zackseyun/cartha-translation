lexical_decisions:
- source_word: וַנִּירָם
  choice: Kita memanah mereka
  rationale: Bentuk Ibrani ini sangat sulit. Pembacaan sebagai verba yang berkaitan dengan ירה menghasilkan gambaran perang yang hidup dan sesuai dengan bentuk orang pertama jamak beserta akhiran orang ketiga jamak; ketidakpastiannya dipertahankan dalam catatan kaki.
- source_word: אָבַד
  choice: telah binasa
  rationale: Menyampaikan makna musnah atau lenyap dengan aspek perfektif dan tetap sesuai dengan ragam nyanyian kemenangan.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עַד דִּיבוֹן
  choice: sampai ke Dibon
  rationale: עַד menunjukkan batas atau jangkauan wilayah; ungkapan ini alami dalam bahasa Indonesia.
- source_word: וַנַּשִּׁים
  choice: Kita memusnahkan
  rationale: Bentuknya tidak pasti, tetapi dalam rangkaian penaklukan pada nyanyian ini, pengertian verba penghancuran paling cocok dengan konteks. Ketidakpastian dicatat dalam catatan kaki.
- source_word: עַד נֹפַח
  choice: sampai ke Nofah
  rationale: עַד menyatakan batas jangkauan; Nofah dipertahankan sebagai nama tempat.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: yang membentang sampai ke Medeba
  rationale: Menerjemahkan klausa relatif sebagai keterangan jangkauan geografis tanpa menghapus kemungkinan keterkaitannya dengan Nofah.
- source_word: מֵידְבָא
  choice: Medeba
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
