source:
  edition: WLC
  text: וַ/יָּבֹא֩ הָ/עָ֨ם אֶל מֹשֶׁ֜ה וַ/יֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי דִבַּ֤רְנוּ בַֽ/יהוָה֙ וָ/בָ֔/ךְ הִתְפַּלֵּל֙ אֶל יְהוָ֔ה וְ/יָסֵ֥ר מֵ/עָלֵ֖י/נוּ אֶת הַ/נָּחָ֑שׁ וַ/יִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: id
  text: Lalu bangsa itu datang kepada Musa dan berkata, “Kami telah berdosa karena kami telah berbicara menentang Yahweh dan menentang engkau. Berdoalah kepada Yahweh supaya Ia menyingkirkan ular itu[a] dari kami.” Lalu Musa berdoa bagi bangsa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani berbentuk tunggal, tetapi dapat merujuk secara kolektif kepada tulah ular itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Lalu bangsa itu datang
  rationale: Waw-konsekutif melanjutkan urutan narasi. “Lalu” alami dalam narasi Indonesia, sedangkan הָעָם diterjemahkan “bangsa itu” sebagai sebutan kolektif bagi orang Israel.
- source_word: חָטָאנוּ
  choice: Kami telah berdosa
  rationale: Bentuk perfektif menyatakan tindakan yang telah dilakukan dan kini diakui dalam pengakuan dosa.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan atau isi konkret yang mendasari pengakuan dosa.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: kami telah berbicara menentang Yahweh dan menentang engkau
  rationale: דבר dengan preposisi ב dalam konteks ini berarti berbicara secara bermusuhan atau menentang. Pengulangan “menentang” mempertahankan kesejajaran kedua objek dan mencegah ambiguitas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Berdoalah kepada Yahweh
  rationale: Bentuk hitpael dari פלל di sini merupakan permintaan agar Musa berdoa atau memohon kepada Yahweh; nuansa syafaat dijelaskan oleh konteks.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: supaya Ia menyingkirkan ... dari kami
  rationale: Bentuk verba setelah imperatif menyatakan isi atau tujuan permintaan. “Menyingkirkan ... dari kami” menyampaikan tindakan mengangkat ancaman itu dengan bahasa Indonesia yang wajar.
- source_word: אֶת הַנָּחָשׁ
  choice: ular itu
  rationale: נָחָשׁ secara konkret berarti “ular”. Bentuk tunggal Ibrani dipertahankan dalam teks utama, sementara kemungkinan makna kolektif dicatat dalam catatan kaki.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: Lalu Musa berdoa bagi bangsa itu
  rationale: בְּעַד menandai tindakan atas nama atau demi pihak lain. “Berdoa bagi” menyampaikan syafaat dengan jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Ruang lingkup bentuk tunggal הַנָּחָשׁ
  choice: ular itu, dengan catatan kemungkinan kolektif
  alternative: ular-ular itu
  rationale: Teks Ibrani berbentuk tunggal, tetapi dalam konteks tulah ular bentuk itu dapat mewakili ancaman ular secara kolektif. Teks utama mempertahankan ketegangan ini tanpa memaksakan bentuk jamak.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur pengakuan, permohonan, serta tanggapan Musa dibuat lugas; pengulangan “menentang” dipertahankan demi kejelasan dan kesejajaran sumber.
