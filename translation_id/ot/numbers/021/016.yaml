base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: id
  text: Dari sana mereka pergi ke Beer[a]. Itulah sumur yang dimaksud Yahweh ketika Dia berfirman kepada Musa, “Kumpulkanlah bangsa itu, dan Aku akan memberi mereka air.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer adalah nama tempat; dalam bahasa Ibrani, nama ini berbunyi sama dengan kata yang berarti “sumur”.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Dari sana
  rationale: Ungkapan ini melanjutkan urutan perjalanan. Kata sambung Ibrani tidak perlu diterjemahkan secara mekanis karena alur narasi sudah jelas dalam bahasa Indonesia.
- source_word: בְּאֵרָה
  choice: mereka pergi ke Beer
  rationale: Beer dipahami sebagai nama tempat. Akhiran penunjuk arah pada bentuk Ibrani dinyatakan secara alami dengan frasa verbal “pergi ke”; subjek dan verba yang tersirat dipulihkan dari konteks perjalanan.
- source_word: הִוא הַבְּאֵר
  choice: Tentang sumur itulah
  rationale: Susunan ini secara alami mengidentifikasi Beer sebagai sumur tertentu dan sekaligus menghubungkannya dengan perkataan Yahweh yang menyusul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱסֹף אֶת הָעָם
  choice: Kumpulkanlah bangsa itu
  rationale: Bentuk imperatif dipertahankan. “Bangsa itu” menyatakan Israel sebagai kelompok kolektif yang sudah diketahui dalam konteks.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: dan Aku akan memberi mereka air
  rationale: Bentuk kohortatif sesudah perintah menyatakan kehendak atau maksud ilahi; bentuk futur “akan memberi” alami dalam bahasa Indonesia tanpa menghapus nuansa tekad.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa kohortatif וְאֶתְּנָה
  choice: Aku akan memberi mereka air
  alternative: supaya Aku memberi mereka air
  rationale: Konstruksi ini dapat mengungkapkan maksud atau hasil sesudah imperatif. Pilihan utama menyampaikan janji dan kehendak ilahi secara wajar tanpa menutup sepenuhnya hubungan maksud tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Verba “pergi” serta subjek “mereka” ditambahkan karena gerak menuju Beer tersirat dalam bentuk Ibrani dan konteks perjalanan. Tidak digunakan catatan alternatif pada “bangsa itu” karena sumber Ibrani tidak mendukung catatan bahasa Inggris yang tampaknya salah tempat.
