  text: וַ/יִּסְע֖וּ מֵ/אֹבֹ֑ת וַֽ/יַּחֲנ֞וּ בְּ/עִיֵּ֣י הָֽעֲבָרִ֗ים בַּ/מִּדְבָּר֙ אֲשֶׁר֙ עַל פְּנֵ֣י מוֹאָ֔ב מִ/מִּזְרַ֖ח הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: id
  text: Mereka berangkat dari Obot, lalu berkemah di Iye-Abarim[a], di padang belantara yang berhadapan dengan Moab, ke arah matahari terbit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Iye-Abarim juga dapat dipahami menurut artinya sebagai “reruntuhan Abarim” atau “timbunan puing Abarim”, tetapi di sini frasa itu berfungsi sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam rumus perjalanan di padang belantara, נסע menunjuk pada tindakan membongkar perkemahan dan melanjutkan perjalanan; 'berangkat' alami dalam bahasa Indonesia dan mempertahankan makna tahap perjalanan.
- source_word: מֵאֹבֹת
  choice: dari Obot
  rationale: Nama tempat ditransliterasikan; bentuk 'Obot' mengikuti pelafalan Ibrani secara wajar dalam ejaan Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה berarti berkemah. 'Lalu' menyampaikan urutan naratif dari waw beruntun secara alami.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: di Iye-Abarim
  rationale: Frasa ini berfungsi sebagai nama tempat dalam daftar perjalanan, sehingga ditransliterasikan. Makna leksikalnya tetap dicatat dalam catatan kaki.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר dapat menunjuk wilayah liar, tandus, atau stepa, bukan semata-mata gurun pasir; 'padang belantara' jelas dan sesuai dengan konteks perjalanan Israel.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: yang berhadapan dengan Moab
  rationale: Dalam keterangan geografis, עַל־פְּנֵי menyatakan lokasi yang menghadap atau berada di seberang wilayah tertentu. 'Berhadapan dengan' mempertahankan gambaran spasial tanpa menentukan jarak secara berlebihan.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: ke arah matahari terbit
  rationale: Ungkapan harfiahnya memakai matahari terbit untuk menunjukkan arah timur. Pilihan ini mempertahankan citra Ibrani dan tetap mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama tempat ditransliterasikan, sedangkan ungkapan arah Ibrani 'matahari terbit' dipertahankan karena alami dan mudah dimengerti.
