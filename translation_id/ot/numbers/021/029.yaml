id: NUM.21.29
reference: Numbers 21:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: id
  text: Celakalah engkau, Moab! Engkau binasa, hai umat Kamos! Kamos telah menjadikan anak-anak lelakinya pelarian dan anak-anak perempuannya tawanan Sihon, raja orang Amori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia telah menjadikan anak-anak lelaki Moab pelarian dan anak-anak perempuannya tawanan.” Akhiran kata ganti dalam bahasa Ibrani dapat dipahami merujuk kepada Moab, bukan Kamos.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: Celakalah engkau
  rationale: Ungkapan ini mempertahankan daya ratapan sekaligus seruan malapetaka dalam nyanyian ejekan, dengan bentuk yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אָבַדְתָּ
  choice: Engkau binasa
  rationale: Bentuk ini menyampaikan kehancuran besar yang dinyatakan langsung kepada Moab tanpa mempersempitnya menjadi satu cara kehancuran tertentu.
- source_word: עַם כְּמוֹשׁ
  choice: umat Kamos
  rationale: Frasa konstruksi ini menyatakan umat yang dikaitkan dengan Kamos, dewa Moab. 'Kamos' memakai bentuk nama yang dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: נָתַן
  choice: telah menjadikan
  rationale: 'Walaupun arti dasarnya ''memberikan'', di sini kata kerja tersebut diikuti keadaan hasil: anak-anak lelaki sebagai pelarian dan anak-anak perempuan sebagai tawanan. ''Menjadikan'' menyampaikan konstruksi resultatif itu secara alami.'
- source_word: בָּנָיו פְּלֵיטִם
  choice: anak-anak lelakinya pelarian
  rationale: '''Pelarian'' mempertahankan gagasan orang-orang yang lolos atau melarikan diri akibat kekalahan; bentuk kepunyaan tetap mengikuti personifikasi puitis Kamos.'
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: anak-anak perempuannya tawanan
  rationale: Susunan nominal yang sejajar dengan 'anak-anak lelakinya pelarian' mempertahankan keseimbangan puisi dan makna keadaan dalam penawanan.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: Sihon, raja orang Amori
  rationale: Terjemahan ini menyampaikan Sihon sebagai pihak yang menerima atau menguasai para tawanan dan mempertahankan keterangan aposisional tentang kedudukannya.
theological_decisions:
- issue: Rujukan akhiran orang ketiga tunggal maskulin pada בָּנָיו dan וּבְנֹתָיו
  choice: 'Dipahami terutama merujuk kepada Kamos: ''anak-anak lelakinya'' dan ''anak-anak perempuannya''.'
  alternative: 'Dipahami merujuk secara kolektif kepada Moab: anak-anak lelaki dan perempuan Moab.'
  rationale: Kamos adalah anteseden tunggal maskulin yang paling dekat, dan personifikasi ini cocok dengan ejekan terhadap ketidakmampuan dewa Moab. Namun, rujukan kepada Moab tetap mungkin dan dicatat tanpa menghapus ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan 'hai umat Kamos' menandai vokatif dengan jelas; pengulangan nama 'Kamos' menghindari ketidakjelasan kata ganti Indonesia sambil mempertahankan bacaan utama. Penanda catatan kaki ditempatkan setelah klausa yang mengandung ambiguitas.
