  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: id
  text: Dari sana mereka berangkat lalu berkemah di seberang Sungai Arnon[a], di padang gurun yang terbentang dari perbatasan bangsa Amori.[b] Sebab Sungai Arnon adalah batas wilayah Moab, antara Moab dan bangsa Amori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat berarti “di seberang Sungai Arnon” atau “di kawasan di balik Sungai Arnon”; sisi yang dimaksud bergantung pada sudut pandang geografis.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “yang keluar dari perbatasan bangsa Amori.” Dalam konteks ini ungkapan tersebut menggambarkan padang gurun yang membentang dari perbatasan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Ungkapan adverbial ini menandai keberangkatan dari tempat sebelumnya; bentuk ini alami dan mempertahankan urutan narasi.
- source_word: נָסָעוּ
  choice: mereka berangkat
  rationale: Dalam kisah perjalanan, נסע berarti meninggalkan perkemahan dan melanjutkan perjalanan; 'berangkat' menyampaikan unsur keberangkatan dengan wajar.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata ini berarti mendirikan atau menempati perkemahan. 'Lalu' mengalirkan urutan tindakan dalam bahasa Indonesia tanpa mengubah hubungan naratif.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: di seberang Sungai Arnon
  rationale: עֵבֶר menunjuk sisi atau kawasan di seberang suatu batas. Nama Arnon merujuk pada sungai, sehingga penambahan penjelas 'Sungai' membuat rujukan geografis jelas bagi pembaca Indonesia.
- source_word: אֲשֶׁר בַּמִּדְבָּר הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: di padang gurun yang terbentang dari perbatasan bangsa Amori
  rationale: Terjemahan ini memahami partisipel הַיֹּצֵא sebagai gambaran kawasan padang gurun yang membentang dari batas bangsa Amori, sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: גְּבוּל
  choice: perbatasan / batas wilayah
  rationale: 'Kata ini menunjukkan batas teritorial. Variasi Indonesia dipakai sesuai konteks: ''perbatasan'' sebagai titik asal bentangan dan ''batas wilayah'' sebagai garis pemisah.'
- source_word: הָאֱמֹרִי
  choice: bangsa Amori
  rationale: Bentuk Ibrani tunggal berfungsi secara kolektif untuk kelompok etnis; 'bangsa Amori' mempertahankan fungsi kolektif itu secara alami.
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan penjelasan atas keterangan geografis sebelumnya.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: Sungai Arnon adalah batas wilayah Moab
  rationale: Klausa nominal ini menyatakan fakta geografis; kopula 'adalah' diperlukan dalam bahasa Indonesia untuk kejelasan.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: antara Moab dan bangsa Amori
  rationale: Pengulangan בֵּין menandai kedua pihak yang dipisahkan oleh batas tersebut; susunan ini mempertahankan pernyataan geografis secara langsung.
