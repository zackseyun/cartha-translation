  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: id
  text: Kemudian Yahweh berkata kepada Musa, “Buatlah bagimu seekor ular berapi[a] dan pasanglah ular itu pada sebuah tiang[b]. Setiap orang yang digigit, apabila memandangnya, akan hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seraf”; istilah Ibrani ini berarti “yang menyala” atau “yang terbakar” dan dalam konteks ini merujuk pada ular mematikan yang gigitannya menimbulkan rasa terbakar.
    reason: lexical_alternative
  - marker: b
    text: Atau “tiang tanda”; kata Ibrani ini juga dapat berarti panji atau tanda yang ditinggikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti ‘Tuhan’.
- source_word: עֲשֵׂה לְךָ
  choice: Buatlah bagimu
  rationale: Mempertahankan imperatif beserta pronomina datif yang secara khusus mengarahkan Musa untuk membuat benda itu.
- source_word: שָׂרָף
  choice: ular berapi
  rationale: Mempertahankan citra dasar ‘yang menyala/terbakar’ sekaligus memperjelas dari konteks bahwa yang dimaksud ialah ular; pilihan ini tidak mempersempit makna menjadi ‘berbisa’ saja.
- source_word: נֵס
  choice: tiang
  rationale: Dalam konteks ini menunjuk pada penyangga tinggi tempat ular itu dipasang. Alternatif ‘panji’ atau ‘tiang tanda’ dicatat karena kata Ibrani biasanya berkaitan dengan tanda yang ditinggikan.
- source_word: הַנָּשׁוּךְ
  choice: setiap orang yang digigit
  rationale: Partisip pasif berartikel berfungsi secara umum, sehingga frasa ini wajar diterjemahkan sebagai siapa pun yang mengalami gigitan.
- source_word: וְרָאָה אֹתוֹ
  choice: apabila memandangnya
  rationale: ‘Memandang’ menyampaikan tindakan melihat dengan sengaja, sedangkan ‘apabila’ mengungkapkan hubungan kondisi-hasil dalam rangkaian klausa tanpa menambahkan syarat baru.
- source_word: וָחָי
  choice: akan hidup
  rationale: Menyampaikan hasil yang dijanjikan secara langsung, sambil membiarkan konteks menentukan apakah nuansanya hidup kembali, sembuh, atau tetap hidup.
theological_decisions:
- issue: Rujukan dan citra שָׂרָף
  choice: ular berapi
  alternative: seraf; makhluk yang menyala; ular berbisa
  rationale: Konteks menuntut rujukan kepada ular, tetapi unsur leksikal ‘menyala/terbakar’ tetap dipertahankan. ‘Seraf’ terlalu kabur bagi pembaca umum dan dapat mengundang asosiasi makhluk surgawi, sedangkan ‘ular berbisa’ menjelaskan akibat gigitannya tetapi menghilangkan citra sumber.
- issue: Arti kehidupan dalam וָחָי
  choice: akan hidup
  alternative: akan tetap hidup; akan pulih
  rationale: Ungkapan yang lebih umum menjaga keluasan makna Ibrani dan tidak memutuskan secara berlebihan apakah hasilnya terutama kesembuhan atau terhindar dari kematian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ‘Buatlah bagimu’ sengaja mempertahankan arah personal dalam bahasa Ibrani meskipun sedikit bercorak sastra. Penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskan.
