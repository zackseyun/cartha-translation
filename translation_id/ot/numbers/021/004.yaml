id: NUM.21.4
reference: Numbers 21:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: id
  text: Lalu mereka berangkat dari Gunung Hor melalui jalan menuju Laut Merah[a] untuk mengelilingi negeri Edom. Dalam perjalanan itu, orang-orang menjadi tidak sabar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “melalui jalan menuju Laut Teberau.” Ibrani: yam suf.'
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang menjadi tawar hati” atau “kehilangan semangat dalam perjalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: mereka berangkat
  rationale: Dalam rumus perjalanan di padang gurun, נסע menunjuk pada tindakan meninggalkan tempat perkemahan dan meneruskan perjalanan. “Berangkat” alami dalam bahasa Indonesia dan mempertahankan nuansa tersebut.
- source_word: מֵהֹר הָהָר
  choice: dari Gunung Hor
  rationale: הֹר הָהָר adalah nama tempat yang lazim dialihaksarakan sebagai “Gunung Hor”; terjemahan harfiah “Hor, gunung itu” tidak alami dalam bahasa Indonesia.
- source_word: דֶּרֶךְ יַם סוּף
  choice: melalui jalan menuju Laut Merah[a]
  rationale: דֶּרֶךְ menyatakan jalan atau rute, dan dalam konstruksi ini dapat menunjukkan arah tujuan. Nama tradisional “Laut Merah” dipertahankan dalam teks utama, sedangkan arti alternatif יַם סוּף dicatat dalam catatan kaki.
- source_word: לִסְבֹב
  choice: untuk mengelilingi
  rationale: Bentuk infinitif ini menyatakan tujuan perjalanan, yaitu mengambil rute yang memutari wilayah Edom.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: negeri Edom
  rationale: אֶרֶץ dengan nama tempat atau bangsa dapat berarti negeri, tanah, atau wilayah. “Negeri Edom” jelas dan wajar dalam konteks geografis ini.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: orang-orang menjadi tidak sabar[b]
  rationale: Ungkapan idiomatis קצר נפש secara harfiah menggambarkan ‘jiwa/napas yang menjadi pendek’ dan dapat menyatakan ketidaksabaran, kejengkelan, atau hilangnya semangat. “Menjadi tidak sabar” paling langsung dalam konteks ini, sementara kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: בַּדָּרֶךְ
  choice: dalam perjalanan itu
  rationale: ב dengan דֶּרֶךְ paling langsung menyatakan keadaan atau lokasi selama perjalanan. Ungkapan ini juga mungkin menyiratkan bahwa beratnya perjalanan menjadi penyebab ketidaksabaran mereka, tetapi nuansa kausal itu tidak dipaksakan ke dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat sederhana dan bermartabat. “Lalu” mempertahankan kesinambungan narasi; “orang-orang” dipakai untuk הָעָם agar tidak memberi kesan bahwa seluruh bangsa diperlakukan sebagai gagasan abstrak. Penanda catatan kaki ditempatkan tepat pada ungkapan yang diterangkannya.
