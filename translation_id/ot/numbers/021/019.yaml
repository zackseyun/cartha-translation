  text: וּ/מִ/מַּתָּנָ֖ה נַחֲלִיאֵ֑ל וּ/מִ/נַּחֲלִיאֵ֖ל בָּמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: id
  text: Dari Matana mereka pergi ke Nahaliel, dan dari Nahaliel ke Bamot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Bamot. Kata ini juga dapat berarti “tempat-tempat tinggi”, tetapi di sini kemungkinan besar merupakan nama sebuah lokasi dalam rute perjalanan Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: Dari Matana
  rationale: Konjungsi וּ tidak perlu diterjemahkan secara tersendiri pada awal ayat dalam bahasa Indonesia, sedangkan מִן diterjemahkan “dari”. מַתָּנָה diperlakukan sebagai nama tempat dan ditransliterasikan “Matana”.
- source_word: נַחֲלִיאֵל
  choice: mereka pergi ke Nahaliel
  rationale: Teks Ibrani memakai gaya rencana perjalanan yang eliptis tanpa kata kerja atau preposisi sebelum nama ini. “Mereka pergi ke” ditambahkan agar hubungan perjalanan dari satu persinggahan ke persinggahan berikutnya jelas dan alami dalam bahasa Indonesia.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: dan dari Nahaliel
  rationale: וּ diterjemahkan “dan”, מִן diterjemahkan “dari”, dan nama tempat ditransliterasikan secara konsisten sebagai “Nahaliel”.
- source_word: בָּמֽוֹת
  choice: Bamot
  rationale: Dalam konteks daftar persinggahan ini, בָּמוֹת paling wajar dipahami sebagai nama tempat. Bentuk Indonesianya ditulis “Bamot”; kemungkinan makna leksikal “tempat-tempat tinggi” dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur eliptis Ibrani diperjelas dengan “mereka pergi ke” tanpa menambahkan rincian yang tidak ada dalam teks sumber. Ejaan nama mengikuti bentuk yang alami dalam bahasa Indonesia.
