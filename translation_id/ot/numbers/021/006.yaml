  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: id
  text: Lalu Yahweh mengirim ular-ular berapi[a] ke tengah-tengah bangsa itu. Ular-ular itu menggigit bangsa itu, dan banyak orang Israel mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ular-ular berbisa.” Secara harfiah, “ular-ular, yang membakar” atau “ular-ular berapi”; sebutan ini mungkin menggambarkan rasa terbakar akibat gigitannya.
    reason: Mempertahankan gambaran harfiah dan ambiguitas הַנְּחָשִׁים הַשְּׂרָפִים, sambil mencatat penafsiran kontekstual “berbisa”.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: mengirim
  rationale: Bentuk naratif dari שׁלח secara langsung menyatakan bahwa Yahweh mengirim ular-ular itu; 'mengirim' alami dan tetap dekat dengan teks sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: בָּעָם
  choice: ke tengah-tengah bangsa itu
  rationale: Preposisi ב di sini menunjukkan lingkungan atau lokasi tempat ular-ular itu dikirim. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan 'melawan' yang lebih interpretatif.
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: ular-ular berbisa
  rationale: נְחָשִׁים berarti ular-ular, sedangkan שְׂרָפִים secara harfiah berkaitan dengan 'membakar'. Dalam konteks gigitan yang mematikan, 'berbisa' menyampaikan kemungkinan maksud deskriptifnya secara alami, sementara arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: וַיְנַשְּׁכוּ
  choice: menggigit
  rationale: נשׁך berarti 'menggigit'; pilihan ini langsung dan tepat dalam konteks ular.
- source_word: וַיָּמָת
  choice: mati
  rationale: מות adalah verba umum untuk 'mati'; terjemahan ini jelas dan tidak interpretatif.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: banyak orang Israel
  rationale: Ungkapan ini secara alami menyatakan sejumlah besar orang dari Israel. 'Banyak orang Israel' idiomatis dalam bahasa Indonesia tanpa mengubah cakupan kelompok tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna הַשְּׂרָפִים sebagai keterangan bagi ular-ular
  choice: berbisa
  alternative: yang berapi-api; yang membakar
  rationale: Kata Ibrani secara harfiah menyiratkan sifat membakar, tetapi dalam konteks ini mungkin menggambarkan efek gigitan. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan metafora dan ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi dua agar jelas bagi pembaca umum. Kata ganti 'mereka' menghindari pengulangan 'bangsa itu' tanpa mengubah rujukannya; 'sehingga' mengungkapkan hubungan akibat yang tersirat oleh urutan peristiwa.
