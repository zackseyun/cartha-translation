  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: id
  text: 'Karena itu dikatakan dalam Kitab Peperangan Yahweh:


    “Waheb[a] di Sufa[b],

    dan lembah-lembah Arnon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani pada baris kutipan ini sulit dipahami. Sebagian penafsir memahami “Waheb” secara berbeda, bahkan sebagai bagian dari klausa verbal dan bukan sebagai nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin, “dalam badai,” jika Sufa dipahami sebagai kata benda umum dan bukan nama tempat.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan penghubung ini menyatakan kesimpulan atau alasan dan secara alami mengantar kutipan dalam bahasa Indonesia.
- source_word: יֵאָמַר
  choice: dikatakan
  rationale: Bentuk nifal ini dipakai secara impersonal untuk memperkenalkan kutipan dari suatu sumber.
- source_word: בְּסֵפֶר
  choice: dalam Kitab
  rationale: Frasa konstruksi ini merujuk pada sebuah sumber tertulis yang dikenal; “Kitab” sesuai dengan konteks kuno dan tetap mudah dipahami.
- source_word: מִלְחֲמֹת יְהוָה
  choice: Peperangan Yahweh
  rationale: “Peperangan” mempertahankan bentuk jamak Ibrani, sedangkan nama ilahi ditransliterasikan sebagai “Yahweh”.
- source_word: אֶת וָהֵב
  choice: Waheb
  rationale: Dalam baris yang sangat sulit ini, וָהֵב paling mungkin diperlakukan sebagai nama tempat. Transliterasi menjaga ketidakpastian teks tanpa memaksakan tafsiran verbal.
- source_word: בְּסוּפָה
  choice: di Sufa
  rationale: סוּפָה diperlakukan sebagai nama tempat dan disesuaikan dengan ejaan Indonesia; kemungkinan bahwa kata ini merupakan nomina umum tetap dicatat dalam catatan kaki.
- source_word: וְאֶת הַנְּחָלִים
  choice: serta lembah-lembah sungai
  rationale: נחל dalam konteks geografis dapat menunjuk lembah aliran air musiman atau wadi. Ungkapan ini lebih mudah dipahami pembaca Indonesia daripada peminjaman istilah “wadi” saja.
- source_word: אַרְנוֹן
  choice: Arnon
  rationale: Nama geografis ini dipertahankan dengan transliterasi yang lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama diri ilahi dalam judul sumber yang dikutip dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan baris mempertahankan sifat puitis kutipan. “Lembah-lembah sungai” dipilih sebagai padanan yang mudah dipahami untuk aliran musiman atau wadi, sementara ketidakjelasan nama Waheb dan Sufa dipertahankan melalui transliterasi dan catatan kaki.
