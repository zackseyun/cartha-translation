source:
  edition: WLC
  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: id
  text: Sebab Hesbon adalah kota Sihon, raja orang Amori. Dialah yang telah berperang melawan raja Moab yang terdahulu dan merebut seluruh negerinya dari tangannya[a] sampai ke Sungai Arnon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari kekuasaannya”; ungkapan Ibraninya secara harfiah berarti “dari tangannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan bagi pernyataan sebelumnya tentang Hesbon dan mempertahankan hubungan argumentatif teks.
- source_word: עִיר סִיחֹן
  choice: kota Sihon
  rationale: Mengikuti konstruksi kepunyaan Ibrani secara alami; maksudnya ialah kota yang berada di bawah kekuasaan Sihon.
- source_word: הִוא
  choice: adalah
  rationale: Klausa nominal Ibrani tidak menandai kala secara eksplisit; bentuk kini dalam bahasa Indonesia tetap wajar dalam keterangan naratif dan tidak memaksakan kala yang tidak dinyatakan.
- source_word: נִלְחַם
  choice: telah berperang melawan
  rationale: Menyatakan tindakan yang mendahului keadaan yang sedang dijelaskan; 'melawan' memperjelas pihak lawan tanpa mengubah makna.
- source_word: הָרִאשׁוֹן
  choice: yang terdahulu
  rationale: Dalam konteks ini menunjuk kepada raja Moab pada masa sebelumnya; 'terdahulu' mempertahankan kemungkinan arti 'sebelumnya' tanpa menyiratkan secara pasti bahwa ia raja pertama sepanjang sejarah.
- source_word: וַיִּקַּח
  choice: dan merebut
  rationale: Menunjukkan pengambilan wilayah melalui peperangan; 'merebut' lebih tepat secara kontekstual daripada sekadar 'mengambil'.
- source_word: כָּל אַרְצוֹ
  choice: seluruh negerinya
  rationale: Merujuk kepada wilayah milik raja Moab; enklitik orang ketiga tetap dipertahankan, sebagaimana dalam sumber.
- source_word: מִיָּדוֹ
  choice: dari tangannya
  rationale: Mempertahankan citra idiom Ibrani tentang wilayah yang dilepaskan dari tangan atau kekuasaan seseorang; alternatif maknawi dicatat dalam catatan kaki.
- source_word: עַד אַרְנֹן
  choice: sampai ke Sungai Arnon
  rationale: Menandai batas wilayah yang direbut. Penambahan klasifikasi 'Sungai' membantu pembaca Indonesia mengenali Arnon sebagai unsur geografis yang menjadi batas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi dua agar jelas. Kata ganti dalam 'negerinya' dan 'tangannya' secara gramatikal merujuk kepada raja Moab, sedangkan 'Dialah' menegaskan bahwa pelaku perang adalah Sihon.
