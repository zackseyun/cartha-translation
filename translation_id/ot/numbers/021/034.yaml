source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Jangan takut kepadanya, sebab Aku telah menyerahkan dia, seluruh rakyatnya, dan negerinya ke dalam tanganmu.[a] Engkau akan memperlakukan dia seperti engkau memperlakukan Sihon, raja orang Amori, yang tinggal di Hesbon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah memberikan dia ke dalam tanganmu”; ungkapan ini berarti menyerahkan dia ke dalam kekuasaanmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama perjanjian ilahi secara langsung dan membedakannya dari gelar umum untuk Tuhan.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Jangan takut kepadanya
  rationale: Larangan langsung ini dekat dengan susunan Ibrani sekaligus wajar dalam bahasa Indonesia modern.
- source_word: כִּי בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: sebab Aku telah menyerahkan dia ... ke dalam tanganmu
  rationale: Bentuk perfektif נָתַתִּי dipertahankan dengan 'telah', sedangkan 'menyerahkan ... ke dalam tanganmu' mengungkapkan tindakan pemberian ke bawah kuasa seseorang sambil mempertahankan citra Ibraninya.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: seluruh rakyatnya, dan negerinya
  rationale: Menjaga ketiga objek yang diserahkan—raja itu sendiri, seluruh rakyatnya, dan negerinya—dengan koordinasi yang alami.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Perlakukanlah dia seperti engkau memperlakukan
  rationale: Ungkapan עשה ל berarti melakukan sesuatu terhadap atau memperlakukan seseorang. Bentuk imperatif Indonesia menyampaikan daya perintah dalam konteks ini dan menghindari ungkapan harfiah yang kaku.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihon, raja orang Amori
  rationale: Mempertahankan nama diri serta hubungan gelar dan bangsanya secara jelas.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: yang tinggal di Hesbon
  rationale: Partisipel יוֹשֵׁב menunjukkan tempat kediaman; 'tinggal' merupakan padanan Indonesia modern yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar dan tanpa memasukkan kekhasan denominasi.
- issue: Aspek janji ilahi dalam נָתַתִּי
  choice: Aku telah menyerahkan
  alternative: Aku akan menyerahkan atau Aku menyerahkan
  rationale: Bentuk perfektif menyajikan penyerahan itu sebagai hal yang sudah pasti dari sudut pandang Sang Pembicara. Terjemahan dengan 'telah' mempertahankan ketegangan antara kepastian ilahi dan pelaksanaannya dalam peristiwa berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Citra 'ke dalam tanganmu' dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
