  - severity: low
    issue: Frasa penjelasan catatan kaki kurang alami
    rationale: “Menyerahkan dia ke bawah kuasamu” dapat dipahami, tetapi bukan kolokasi baku yang paling alami. “Menyerahkan dia ke dalam kekuasaanmu” menyampaikan makna idiom Ibrani dengan lebih jelas.
