  source_fidelity: 'Draf ini setia pada semua unsur utama teks Ibrani: Yahweh berbicara kepada Musa; larangan untuk takut kepada Og; penyerahan Og, seluruh rakyatnya, dan negerinya; serta perbandingan dengan tindakan terhadap Sihon di Hesbon. Bentuk perfektif נָתַתִּי diterjemahkan dengan tepat sebagai “telah menyerahkan.” Namun, וְעָשִׂיתָ lebih baik dinyatakan sebagai kepastian/perintah prospektif (“Engkau akan ...”) daripada imperatif langsung “Perlakukanlah.”'
