  terminology: “Yahweh,” “Musa,” “Sihon,” “orang Amori,” dan “Hesbon” konsisten serta tepat. “Seluruh rakyatnya” secara wajar menyampaikan כָּל־עַמּוֹ, dan “negerinya” memadai untuk אַרְצוֹ dalam konteks ini.
