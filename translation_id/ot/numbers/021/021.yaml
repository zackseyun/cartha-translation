  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: id
  text: Kemudian Israel mengutus para utusan kepada Sihon, raja orang Amori, dengan pesan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kemudian ... mengutus
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. 'Kemudian' menyatakan urutan naratif secara alami, sedangkan 'mengutus' sesuai untuk pengiriman wakil manusia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri yang di sini merujuk kepada bangsa Israel; bentuk baku dipertahankan.
- source_word: מַלְאָכִים
  choice: para utusan
  rationale: Dalam konteks diplomatik ini, kata tersebut menunjuk kepada wakil manusia, bukan makhluk surgawi. 'Para utusan' alami dan tidak mempersempit makna menjadi jabatan diplomatik tertentu.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi arah ini paling alami diterjemahkan 'kepada' karena para utusan dikirim untuk menghadap dan menyampaikan pesan kepada Sihon.
- source_word: סִיחֹן
  choice: Sihon
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: raja orang Amori
  rationale: Frasa konstruksi menyatakan Sihon sebagai raja atas kelompok etnis Amori. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan pemerintahan tersebut.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Infinitif ini memperkenalkan perkataan langsung pada ayat berikutnya. 'Dengan pesan' lebih alami daripada 'dengan berkata' ketika subjeknya mengutus para utusan.
