  source_fidelity: Setia pada teks Ibrani. עַל־כֵּן diterjemahkan dengan baik sebagai “Itulah sebabnya”; יֹאמְרוּ berfungsi sebagai rumus kutipan umum; dan bentuk volitif puitis תִּבָּנֶה וְתִכּוֹנֵן tersampaikan melalui “Biarlah ... dibangun dan ditegakkan.” “Kota Sihon” mempertahankan hubungan konstruksi עִיר סִיחוֹן. “Para pelantun peribahasa” merupakan pilihan yang dapat dipertanggungjawabkan untuk הַמֹּשְׁלִים dalam konteks nyanyian/sindiran dan tidak keliru mengidentifikasi mereka sebagai penguasa.
