  terminology: Transliterasi “Hesbon” lazim. Istilah “pelantun peribahasa” dan catatan alternatifnya menjaga rentang makna הַמֹּשְׁלִים tanpa memaksakan salah satu tafsiran yang diperselisihkan. Tidak ada istilah teologis bermasalah.
