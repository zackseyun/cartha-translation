  text: עַל כֵּ֛ן יֹאמְר֥וּ הַ/מֹּשְׁלִ֖ים בֹּ֣אוּ חֶשְׁבּ֑וֹן תִּבָּנֶ֥ה וְ/תִכּוֹנֵ֖ן עִ֥יר סִיחֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: id
  text: Itulah sebabnya para pelantun peribahasa berkata[a], “Datanglah ke Hesbon! Biarlah kota Sihon dibangun dan ditegakkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang mengucapkan peribahasa” atau “para penyair”; secara tradisional, “para penguasa”. Partisipel Ibrani ini agaknya menunjuk di sini kepada para penggubah atau pelantun nyanyian berbentuk peribahasa, bukan penguasa politik.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Mengungkapkan hubungan penjelasan atau kesimpulan dengan kisah sebelumnya secara alami dalam bahasa Indonesia.
- source_word: יֹאמְרוּ
  choice: berkata
  rationale: Bentuk imperfek dalam rumus pengutipan ini menyatakan kebiasaan atau pernyataan umum; bentuk kini leksikal bahasa Indonesia tidak memerlukan penandaan kala khusus.
- source_word: הַמֹּשְׁלִים
  choice: para pelantun peribahasa
  rationale: Partisipel dari משל dalam konteks ini menunjuk kepada orang yang menggubah atau melantunkan ucapan berbentuk peribahasa atau nyanyian sindiran, bukan terutama penguasa. Pilihan ini mempertahankan kaitan dengan genre ucapan tersebut.
- source_word: בֹּאוּ
  choice: Datanglah
  rationale: Imperatif orang kedua jamak diterjemahkan sebagai ajakan atau perintah langsung; sufiks -lah memberi nada seruan yang wajar.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: תִּבָּנֶה
  choice: Biarlah ... dibangun
  rationale: Bentuk puitis yang bernuansa jusif diterjemahkan secara volitif dengan 'biarlah' dan verba pasif.
- source_word: וְתִכּוֹנֵן
  choice: dan ditegakkan
  rationale: Verba dari כון menyatakan dibuat kokoh atau mapan. 'Ditegakkan' mempertahankan paralelisme dengan 'dibangun' dan tetap alami dalam konteks pendirian kota.
- source_word: עִיר סִיחוֹן
  choice: kota Sihon
  rationale: Rangkaian konstruksi menyatakan hubungan kepunyaan atau kaitan; bentuk ringkas 'kota Sihon' jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kutipan dibuat bernada puitis melalui dua seruan yang berimbang. Istilah 'pelantun peribahasa' dipilih untuk menjaga hubungan leksikal dengan משל sekaligus menghindari penyempitan makna menjadi 'penyair' saja.
