  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: id
  text: Kemudian orang Israel berangkat dan berkemah di Obot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Dalam catatan perjalanan di padang gurun, נסע menunjuk pada tindakan membongkar perkemahan dan bergerak menuju tempat berikutnya. “Berangkat” alami dalam bahasa Indonesia dan sesuai dengan urutan perjalanan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi sebagai etnonim ungkapan ini merujuk secara kolektif kepada bangsa Israel. “Orang Israel” menyampaikan fungsi tersebut secara alami tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Kata חנה adalah verba baku untuk mendirikan atau menetap di perkemahan dalam kisah perjalanan Israel. “Berkemah” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּאֹבֹת
  choice: di Obot
  rationale: אֹבֹת adalah nama tempat dan ditransliterasikan sebagai “Obot.” Preposisi ב dalam rumus perjalanan ini secara alami diterjemahkan “di.”
- source_word: וַ
  choice: Kemudian
  rationale: Waw pada verba pertama melanjutkan rangkaian narasi. “Kemudian” menandai urutan peristiwa dengan jelas dan alami.
