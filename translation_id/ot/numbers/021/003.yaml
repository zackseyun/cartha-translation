  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: id
  text: Yahweh mendengar seruan Israel dan menyerahkan bangsa Kanaan itu kepada mereka. Israel mengkhususkan mereka beserta kota-kota mereka untuk dimusnahkan. Karena itu, tempat tersebut dinamai Horma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Horma terdengar mirip dengan kata Ibrani yang berarti “dikhususkan untuk dimusnahkan” atau “ditempatkan di bawah larangan.”
    reason: Menjelaskan permainan bunyi dan hubungan etimologis antara nama חָרְמָה dan verba חָרַם.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: mendengarkan seruan
  rationale: Ungkapan Ibrani secara harfiah berarti “mendengar suara”, tetapi dalam konteks permohonan Israel menyatakan bahwa Yahweh mendengar dan menanggapinya. “Mendengarkan seruan” menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: menyerahkan bangsa Kanaan itu kepada mereka
  rationale: Kata נָתַן dengan objek musuh berarti menyerahkan ke dalam kuasa pihak lain. Sebutan tunggal kolektif הַכְּנַעֲנִי dinyatakan secara alami sebagai “bangsa Kanaan itu”; penerima yang tersirat dari konteks dijelaskan sebagai “kepada mereka”.
- source_word: וַיַּחֲרֵם
  choice: mengkhususkan ... untuk dimusnahkan
  rationale: Bentuk ini menyatakan tindakan menempatkan orang atau barang di bawah ḥerem, yakni dikhususkan secara tak dapat ditarik kembali untuk dimusnahkan. Pilihan ini mempertahankan unsur pengkhususan sekaligus menjelaskan akibat konkretnya.
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: mereka beserta kota-kota mereka
  rationale: Terjemahan langsung dan alami bagi kedua objek, dengan “beserta” menghubungkan penduduk dan kota-kotanya.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: tempat tersebut dinamai
  rationale: Subjek verba tunggal tidak disebutkan secara eksplisit. Bentuk pasif Indonesia mempertahankan ketidakjelasan itu tanpa menentukan apakah penamanya Israel, seseorang, atau pemakaian umum.
- source_word: חָרְמָה
  choice: Horma
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim. Hubungan bunyinya dengan akar ח־ר־ם dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Istilah peperangan חֵרֶם
  choice: mengkhususkan mereka beserta kota-kota mereka untuk dimusnahkan
  alternative: menumpas mereka beserta kota-kota mereka sampai tuntas; menempatkan mereka dan kota-kota mereka di bawah larangan
  rationale: Rumusan ini tidak melunakkan tindakan pemusnahan, tetapi tetap mempertahankan dimensi teknis bahwa sasaran dikhususkan bagi kebinasaan. Alternatif “menumpas sampai tuntas” menghilangkan dimensi pengkhususan, sedangkan “di bawah larangan” terlalu kabur bagi pembaca umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Seruan” dipilih daripada terjemahan harfiah “suara” agar idiomnya jelas. Subjek “Israel” dinyatakan pada kalimat kedua karena verba Ibrani beralih ke bentuk jamak dan konteks ayat sebelumnya menunjukkan Israel sebagai pelaku, sementara bentuk pasif pada penamaan tempat mempertahankan subjek yang tidak disebutkan.
