translation:
  language: id
  text: 'Lalu Israel menyanyikan nyanyian ini:


    “Memancarlah[a], hai sumur!

    Bersahutlah kepadanya!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Naiklah, hai sumur! Bersahutlah kepadanya!” Ungkapan Ibrani ini kemungkinan mencerminkan rumusan nyanyian responsorial atau antifonal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Lalu
  rationale: Menandai urutan tindakan dalam narasi secara alami dalam bahasa Indonesia.
- source_word: יָשִׁיר
  choice: menyanyikan
  rationale: Walaupun bentuk Ibraninya imperfek, sesudah אָז dalam narasi bentuk ini menyatakan tindakan lampau; bahasa Indonesia tidak perlu menandai kala pada verba.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama baku bangsa itu dipertahankan.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: nyanyian ini
  rationale: Mengacu pada syair yang langsung dikutip; 'nyanyian' cocok dengan tindakan menyanyi dan bentuk puitisnya.
- source_word: עֲלִי
  choice: Memancarlah
  rationale: Imperatif feminin tunggal ini ditujukan kepada sumur dan secara harfiah berarti 'naiklah/muncullah'; dalam konteks air, 'memancarlah' menyampaikan gambaran itu secara alami.
- source_word: בְאֵר
  choice: hai sumur
  rationale: Partikel 'hai' menandai sapaan langsung dalam larik puitis.
- source_word: עֱנוּ לָהּ
  choice: Sahutlah kepadanya
  rationale: Menjaga arti dasar 'jawablah/tanggapilah' serta kemungkinan bahwa perintah ini merupakan aba-aba nyanyian berbalasan, tanpa mengubahnya secara tegas menjadi 'bernyanyilah'.
theological_decisions: []
