review_pass:
  verdict: revise
  source_fidelity: Frasa "sampai tidak seorang pun dibiarkan hidup" menyampaikan hasil pemusnahan, tetapi tidak menyatakan unsur לּוֹ ("baginya") dan memasukkan bentuk pasif dengan pelaku tersirat yang tidak dinyatakan secara sama dalam teks Ibrani. "Mengalahkan" untuk וַיַּכּוּ mempertahankan keluasan verba militer itu; konteks klausa berikutnya tetap menunjukkan bahwa tidak ada yang selamat.
  naturalness: Teks revisi tetap baku, lugas, dan alami dalam bahasa Indonesia modern. "Tidak ada seorang pun yang tersisa baginya" adalah cara idiomatis untuk mempertahankan konstruksi sumber tanpa memaksakan siapa subjek eksplisit dari "menyisakan".
  terminology: '"Anak-anak lelakinya," "seluruh rakyatnya," dan "negerinya" sesuai dengan בָּנָיו, כָּל־עַמּוֹ, dan אַרְצוֹ. "Mengambil alih" secara jelas mengungkapkan penguasaan wilayah dalam konteks ירשׁ tanpa menyiratkan warisan damai.'
  issues:
