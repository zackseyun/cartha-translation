    rationale: Klausa draft menyatakan bahwa tidak seorang pun dibiarkan hidup, tetapi menghilangkan pronomina tidak langsung לוֹ. Revisi mempertahankan unsur ini sambil tidak menetapkan secara berlebihan pelaku subjek yang tersirat dalam konstruksi Ibrani.
  - severity: low
    issue: '"Menewaskan" mempersempit וַיַּכּוּ menjadi kematian yang dinyatakan secara leksikal.'
    rationale: Dalam konteks ini hasil akhirnya memang tiada penyintas, tetapi verba נכה sendiri adalah verba militer yang lebih luas. "Mengalahkan" mempertahankan cakupan sumber, sedangkan klausa berikut menyatakan hasil totalnya.
  revised_text: Maka mereka mengalahkan dia, anak-anak lelakinya, dan seluruh rakyatnya, hingga tidak ada seorang pun yang tersisa baginya; lalu mereka mengambil alih negerinya.
