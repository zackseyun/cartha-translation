  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: id
  text: Maka mereka mengalahkan dia, anak-anak lelakinya, dan seluruh rakyatnya, hingga tidak ada seorang pun yang tersisa baginya; lalu mereka mengambil alih negerinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: menewaskan
  rationale: Dalam konteks peperangan, נכה berarti memukul atau mengalahkan, sering kali hingga mati. Kelanjutan ayat menegaskan pemusnahan total, sehingga “menewaskan” alami dan tepat dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk maskulin jamak בנים secara khusus menunjuk kepada anak-anak lelaki Og, bukan anak-anak secara umum.
- source_word: כָּל עַמּוֹ
  choice: seluruh rakyatnya
  rationale: עַם menunjuk kepada rakyat atau bangsa di bawah kekuasaan Og dan tidak perlu dipersempit menjadi pasukannya saja.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: sampai tidak seorang pun dibiarkan hidup
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa tidak ada penyintas yang ditinggalkan baginya. Terjemahan ini menyampaikan hasilnya secara alami tanpa menentukan subjek tersirat dari הִשְׁאִיר.
- source_word: שָׂרִיד
  choice: seorang pun ... hidup
  rationale: Dalam konteks militer ini, שָׂרִיד berarti orang yang selamat. Rumusan idiomatis ini lebih jelas daripada istilah “sisa,” yang dapat membawa nuansa teologis yang tidak diwajibkan konteks.
- source_word: וַיִּירְשׁוּ
  choice: menduduki
  rationale: ירשׁ di sini menggambarkan Israel mengambil dan menguasai wilayah sesudah kemenangan. “Menduduki” menyampaikan pengambilalihan wilayah secara ringkas tanpa memberi kesan warisan yang diterima secara damai.
- source_word: אַרְצוֹ
  choice: negerinya
  rationale: אֶרֶץ menunjuk kepada wilayah yang dikuasai Og. “Negerinya” alami untuk wilayah kerajaan dalam konteks ini.
