base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: id
  text: Lalu bangsa itu berbicara melawan Allah dan Musa, “Mengapa kamu membawa kami keluar dari Mesir untuk mati di padang belantara? Tidak ada roti dan tidak ada air, dan kami muak akan roti yang hina ini[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roti yang tercela ini” atau “roti yang tidak berharga ini.” Kata sifat Ibrani yang dipakai di sini jarang ditemukan dan mengungkapkan penghinaan terhadap makanan yang Allah sediakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: Lalu bangsa itu berbicara melawan Allah dan Musa
  rationale: דבר dengan ב dalam konteks tuduhan ini bersifat menentang. 'Berbicara melawan' mempertahankan unsur ujaran dan sikap bermusuhan tanpa mempersempitnya menjadi sekadar keluhan.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: kamu membawa kami keluar dari Mesir
  rationale: Bentuk kausatif עלה berarti 'membawa naik/keluar'. Dalam bahasa Indonesia, 'membawa ... keluar dari Mesir' alami dan mempertahankan motif eksodus.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: untuk mati di padang belantara
  rationale: Infinitif menyatakan tujuan atau akibat yang dituduhkan bangsa itu; מִדְבָּר lebih luas daripada gurun pasir dan cocok diterjemahkan 'padang belantara'.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Tidak ada makanan dan tidak ada air
  rationale: לֶחֶם dapat berarti roti atau makanan pada umumnya. 'Makanan' menghindari kesan kontradiktif yang tidak disengaja dengan penyediaan yang mereka hina pada klausa berikutnya, sambil tetap menyampaikan keluhan mereka.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: dan kami muak
  rationale: Ungkapan yang secara harfiah menyebut נֶפֶשׁ menyatakan rasa jijik atau muak yang kuat; 'kami muak' adalah padanan Indonesia yang alami.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: terhadap makanan yang tidak layak ini
  rationale: קְלֹקֵל adalah kata sifat langka yang mengungkapkan penghinaan terhadap makanan yang disediakan. 'Tidak layak' mempertahankan penilaian merendahkan; 'ini' membuat rujukan deiktisnya alami dalam ujaran Indonesia.
theological_decisions:
- issue: Sifat perkataan bangsa itu terhadap Allah dan Musa
  choice: berbicara melawan Allah dan Musa
  alternative: berbicara kepada Allah dan Musa; berbicara tentang Allah dan Musa
  rationale: Isi kutipan bersifat menuduh dan memberontak, sehingga arti adversatif paling sesuai konteks tanpa menambahkan penilaian doktrinal.
- issue: Hubungan antara pengakuan tidak adanya makanan dan makanan yang mereka tolak
  choice: Mempertahankan kedua pernyataan sebagaimana ketegangan retoris dalam keluhan mereka
  alternative: Menjelaskan bahwa yang dimaksud ialah tidak adanya makanan biasa selain manna
  rationale: Teks Ibrani tidak memberikan penjelasan tersebut secara eksplisit; terjemahan tidak boleh diam-diam menyelaraskan keluhan bangsa itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Padang belantara' dipilih untuk מִדְבָּר, dan bentuk sapaan 'kamu' mengikuti verba Ibrani tunggal yang ditujukan kepada Musa. Penanda catatan kaki [a] ditempatkan setelah kalimat yang dijelaskannya.
