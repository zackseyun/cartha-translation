  naturalness: Susunan kalimat dipertahankan dalam bahasa Indonesia baku yang lugas. “Roti yang hina ini” menyampaikan evaluasi merendahkan dalam ujaran mereka; walaupun bernada formal, frasa ini wajar dalam register naratif kitab suci. Penanda catatan kaki dipindahkan tepat setelah frasa yang diterangkannya.
  terminology: “Allah,” “Musa,” dan “padang belantara” tepat. “Bangsa itu” dapat dipertahankan untuk הָעָם dalam konteks kelompok Israel. “Roti” perlu dipakai konsisten untuk לֶחֶם.
