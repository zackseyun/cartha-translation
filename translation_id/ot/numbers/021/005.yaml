  to: Lalu bangsa itu berbicara melawan Allah dan Musa, “Mengapa kamu membawa kami keluar dari Mesir untuk mati di padang belantara? Tidak ada roti dan tidak ada air, dan kami muak akan roti yang hina ini[a].”
