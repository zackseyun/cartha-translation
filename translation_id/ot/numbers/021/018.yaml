  text: בְּאֵ֞ר חֲפָר֣וּ/הָ שָׂרִ֗ים כָּר֨וּ/הָ֙ נְדִיבֵ֣י הָ/עָ֔ם בִּ/מְחֹקֵ֖ק בְּ/מִשְׁעֲנֹתָ֑/ם וּ/מִ/מִּדְבָּ֖ר מַתָּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: id
  text: 'sumur yang digali para pemimpin,

    yang digali para bangsawan bangsa itu

    dengan tongkat penguasa, dengan tongkat mereka.[a]

    Lalu, dari padang belantara mereka pergi ke Matana.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “oleh pemberi hukum.” Kata Ibrani yang sama dapat menunjuk kepada seorang penguasa atau pemberi hukum, maupun tongkat kekuasaannya.'
    reason: alternative_reading
  - marker: b
    text: Teks Ibrani secara ringkas berbunyi, “dan dari padang belantara, Matana”; konteksnya menunjukkan perpindahan dari padang belantara ke Matana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: sumur
  rationale: Nomina umum yang merujuk kepada sumur tertentu yang baru saja dirayakan dalam ayat sebelumnya; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: חֲפָרוּהָ
  choice: digali
  rationale: Berasal dari חפר, 'menggali'; sufiks feminin merujuk kembali kepada בְּאֵר. Bentuk pasif Indonesia mempertahankan pemfokusan puitis pada sumur.
- source_word: שָׂרִים
  choice: para pemimpin
  rationale: Menunjuk orang-orang berkedudukan tinggi. 'Para pemimpin' alami dalam bahasa Indonesia modern dan tidak secara sempit menyiratkan keturunan kerajaan seperti 'para pangeran'.
- source_word: כָּרוּהָ
  choice: dikorek
  rationale: Berasal dari כרה, verba penggalian kedua. 'Dikorek' membedakannya dari חפר sambil mempertahankan paralelisme dan gambaran melubangi tanah.
- source_word: נְדִיבֵי הָעָם
  choice: para bangsawan bangsa itu
  rationale: Dalam kesejajaran dengan שָׂרִים, נְדִיבִים paling mungkin menunjuk orang-orang terpandang atau berkedudukan tinggi, bukan sekadar orang-orang yang murah hati.
- source_word: בִּמְחֹקֵק
  choice: dengan tongkat penguasa
  rationale: מְחֹקֵק dapat berarti penguasa/pemberi hukum atau tongkat kekuasaan. Kesejajarannya dengan 'tongkat-tongkat mereka' mendukung pengertian alat, tetapi ambiguitasnya dicatat.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: dengan tongkat-tongkat mereka
  rationale: מִשְׁעֵנָה berarti tongkat atau penopang. Pengulangan 'tongkat' mempertahankan gambaran puitis dan bentuk jamaknya.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: Kemudian dari padang belantara mereka pergi ke Matana
  rationale: Secara harfiah frasa ini ringkas, 'dan dari padang belantara Matana', tetapi konteks ayat 18–20 merupakan urutan tempat perjalanan. Unsur gerak disediakan agar alami dalam bahasa Indonesia dan dijelaskan dalam catatan.
theological_decisions:
- issue: Makna בִּמְחֹקֵק dalam frasa puitis
  choice: dengan tongkat penguasa
  alternative: oleh pemberi hukum; dengan tongkat kerajaan; menurut ketetapan
  rationale: Kesejajaran langsung dengan 'dengan tongkat-tongkat mereka' lebih mendukung alat kekuasaan daripada seorang pelaku atau sarana abstrak. Karena bentuk Ibraninya sungguh ambigu, bacaan personal dicatat tanpa mengaitkannya dengan tokoh atau doktrin tertentu.
- issue: Daya sintaksis וּמִמִּדְבָּר מַתָּנָה
  choice: 'transisi perjalanan: ''Kemudian dari padang belantara mereka pergi ke Matana'''
  alternative: 'secara harfiah: ''dan dari padang belantara, Matana'''
  rationale: Konteks berikutnya mencatat tahap-tahap perjalanan. Terjemahan utama menyatakan gerak yang tersirat, sedangkan ketiadaan verba dan preposisi tujuan dalam bahasa Ibrani dipertahankan melalui catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Baris-baris pertama mempertahankan paralelisme nyanyian; kalimat terakhir beralih secara jelas ke catatan perjalanan. Nama tempat מתנה ditransliterasikan sebagai 'Matana' menurut pelafalan yang wajar dalam bahasa Indonesia.
