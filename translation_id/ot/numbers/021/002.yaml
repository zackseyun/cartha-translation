  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: id
  text: Lalu Israel mengucapkan nazar kepada TUHAN, katanya, “Jika Engkau benar-benar menyerahkan[a] bangsa ini ke dalam tanganku, aku akan mengkhususkan kota-kota mereka untuk dimusnahkan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika Engkau sungguh-sungguh menyerahkan bangsa ini ke dalam tanganku.” Bahasa Ibrani menegaskan verba “menyerahkan” dengan infinitif absolut yang diikuti verba finit.
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku akan menempatkan kota-kota mereka di bawah larangan pemusnahan.” Istilah Ibrani ḥerem menunjuk pada pengkhususan sesuatu secara tidak dapat ditarik kembali untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: mengucapkan nazar
  rationale: Konstruksi serumpun Ibrani secara harfiah berarti ‘menazarkan nazar’. ‘Mengucapkan nazar’ menyampaikan tindakan ikrar resmi secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Nama perjanjian יהוה diterjemahkan dengan bentuk baku ‘TUHAN’, sesuai konvensi Alkitab bahasa Indonesia dan dibedakan dari sebutan umum ‘Tuhan’.
- source_word: אִם נָתֹן תִּתֵּן
  choice: Jika Engkau benar-benar menyerahkan
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. ‘Benar-benar’ mempertahankan intensitas itu tanpa meniru susunan Ibrani secara kaku.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם adalah kelompok kolektif tunggal. Dalam konteks peperangan antarkelompok, ‘bangsa ini’ lebih alami daripada ‘rakyat ini’ dan tetap mempertahankan sifat kolektifnya.
- source_word: בְּיָדִי
  choice: ke dalam tanganku
  rationale: Ungkapan ini berarti menyerahkan ke dalam kuasa seseorang. Citra tangan dipertahankan karena masih mudah dipahami dalam bahasa Indonesia dan mencerminkan personifikasi Israel sebagai pembicara tunggal.
- source_word: וְהַחֲרַמְתִּי
  choice: aku akan mengkhususkan ... untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם menunjuk pada penetapan sesuatu secara tidak dapat ditarik kembali bagi kebinasaan. Terjemahan ini mempertahankan dimensi pengkhususan dan hasil berupa pemusnahan, bukan meratakannya menjadi sekadar ‘menghancurkan’.
- source_word: עָרֵיהֶם
  choice: kota-kota mereka
  rationale: עִיר secara langsung berarti kota atau permukiman; ‘kota-kota’ sesuai dengan konteks militer dan bentuk jamaknya.
theological_decisions:
- issue: Makna חרם dalam nazar peperangan
  choice: mengkhususkan kota-kota mereka untuk dimusnahkan
  alternative: menumpas kota-kota mereka sama sekali; menempatkan kota-kota mereka di bawah larangan
  rationale: Pilihan ini mempertahankan bahwa tindakan tersebut merupakan pengkhususan resmi dan tidak dapat ditarik kembali yang berujung pada pemusnahan. Terjemahan ini tidak mengurangi חרם menjadi penghancuran militer biasa dan juga tidak memasukkan penjelasan etis atau doktrinal yang tidak dinyatakan ayat.
- issue: Israel berbicara sebagai pribadi kolektif
  choice: tanganku ... aku akan
  alternative: tangan kami ... kami akan
  rationale: Teks Ibrani memakai bentuk orang pertama tunggal meskipun subjeknya Israel. Bentuk tunggal dipertahankan agar personifikasi kolektif dan ketegangan gramatikal teks sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Struktur nazar bersyarat dipertahankan, demikian pula metafora ‘ke dalam tanganku’ dan penggunaan orang pertama tunggal bagi Israel. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
