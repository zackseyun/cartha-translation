  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: id
  text: dan lereng wadi-wadi[a] yang membentang hingga ke tempat Ar berada[b] dan bersandar pada perbatasan Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembah-lembah” atau “jurang-jurang”; kata Ibrani נְחָלִים kerap merujuk pada alur sungai musiman (wadi).
    reason: lexical_alternative
  - marker: b
    text: Atau “hingga ke tempat kediaman Ar.” Frasa Ibraninya sulit dan mungkin menunjuk pada lokasi atau permukiman Ar.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: lereng
  rationale: Nomina ini menunjuk pada lereng atau bagian tanah yang menurun; pilihan ini ringkas, alami, dan sesuai dengan konteks topografis.
- source_word: הַנְּחָלִים
  choice: wadi-wadi
  rationale: נחל kerap menunjuk pada alur sungai musiman, bukan sekadar lembah. Istilah 'wadi' mempertahankan ciri geografis tersebut, sedangkan padanan yang lebih umum diberikan dalam catatan kaki.
- source_word: אֲשֶׁר נָטָה
  choice: yang membentang
  rationale: נטה dapat berarti merentang, memanjang, atau condong. Dalam uraian geografis ini, 'membentang' menyampaikan arah spasial dengan wajar.
- source_word: לְשֶׁבֶת עָר
  choice: sampai ke tempat Ar berada
  rationale: Frasa Ibrani ini sulit dan dapat menunjuk pada lokasi atau tempat kedudukan Ar. Terjemahan ini alami dalam bahasa Indonesia tanpa memastikan lebih dari yang dinyatakan teks.
- source_word: עָר
  choice: Ar
  rationale: Nama tempat dipertahankan melalui transliterasi.
- source_word: וְנִשְׁעַן
  choice: dan bersandar pada
  rationale: שען secara harfiah berarti bersandar atau bertumpu. Pilihan ini mempertahankan metafora topografis teks.
- source_word: לִגְבוּל מוֹאָב
  choice: perbatasan Moab
  rationale: גבול berarti batas atau perbatasan; 'perbatasan Moab' jelas dan wajar dalam konteks wilayah.
