  register: Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. 'Rakyatnya' dipertahankan agar tidak mengubah עַמּוֹ menjadi 'pasukannya'. Nama tempat ditulis 'Yahas' sesuai bentuk Indonesia.
