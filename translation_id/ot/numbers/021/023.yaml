  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: id
  text: Namun, Sihon tidak mengizinkan Israel melewati wilayahnya.[a] Lalu Sihon mengumpulkan seluruh rakyatnya dan keluar ke padang gurun untuk menemui Israel. Ia tiba di Yahas dan berperang melawan Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melewati perbatasannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: mengizinkan
  rationale: Dalam konstruksi ini, arti idiomatisnya adalah memberi izin, bukan sekadar 'memberikan'.
- source_word: עֲבֹר
  choice: melewati
  rationale: Infinitif ini menyatakan perjalanan melintasi wilayah pihak lain.
- source_word: בִּגְבֻלוֹ
  choice: wilayahnya
  rationale: גְּבוּל dapat berarti batas atau wilayah; konteks permohonan lintas menunjukkan wilayah kekuasaan Sihon.
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: mengumpulkan seluruh rakyatnya
  rationale: Teks menyebut 'seluruh rakyatnya', bukan secara eksplisit 'pasukannya', meskipun konteksnya bersifat militer.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: untuk menghadapi Israel
  rationale: Ungkapan ini secara leksikal berarti pergi untuk menemui Israel; dalam konteks pengerahan rakyat dan pertempuran, 'menghadapi' menyampaikan perjumpaan yang bermusuhan tanpa mendahului pernyataan bahwa mereka berperang.
- source_word: הַמִּדְבָּרָה
  choice: ke padang gurun
  rationale: Akhiran direktif menyatakan gerak menuju padang gurun; 'ke' wajar dalam bahasa Indonesia dan tidak menentukan apakah ia masuk jauh ke dalamnya.
- source_word: יָהְצָה
  choice: Yahas
  rationale: Transliterasi nama tempat Ibrani יַהַץ/יָהְצָה yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: berperang melawan Israel
  rationale: Bentuk verba לחם dengan ב menyatakan keterlibatan perang yang bermusuhan terhadap Israel.
- source_word: וְלֹא
  choice: Namun, ... tidak
  rationale: Konjungsi ini mengontraskan penolakan Sihon dengan permintaan Israel pada konteks sebelumnya.
