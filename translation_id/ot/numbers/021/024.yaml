  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: id
  text: Israel memukulnya dengan mata pedang dan mengambil alih negerinya, dari Sungai Arnon sampai Sungai Yabok, hingga ke wilayah orang Amon[a], sebab perbatasan orang Amon kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hingga bani Amon”; demikian pula selanjutnya, “perbatasan bani Amon kuat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: menewaskan dia
  rationale: Dalam konteks pertempuran dan perebutan seluruh wilayah, נכה menyatakan tindakan memukul atau mengalahkan secara mematikan; 'menewaskan dia' alami dalam bahasa Indonesia tanpa menyatakan rincian kematian yang tidak disebutkan.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Ungkapan harfiah 'dengan mulut pedang' secara idiomatis merujuk pada mata pedang; bentuk ini mempertahankan citra Ibrani dan tetap dapat dipahami.
- source_word: וַיִּירַשׁ
  choice: menduduki
  rationale: ירש di sini berarti mengambil dan menguasai wilayah sesudah mengalahkan penguasanya. 'Menduduki' menyampaikan penguasaan teritorial dalam konteks militer dengan wajar.
- source_word: אַרְצוֹ
  choice: negerinya
  rationale: אֶרֶץ menunjuk wilayah kekuasaan Sihon; 'negeri' lebih alami daripada 'tanah' dalam konteks teritorial ini dan tidak harus menyiratkan negara-bangsa modern.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: dari Sungai Arnon sampai Sungai Yabok
  rationale: Penambahan 'Sungai' memperjelas bahwa kedua nama itu adalah batas geografis tanpa mengubah makna sumber.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: hingga wilayah bani Amon
  rationale: Frasa sumber secara harfiah berarti 'sampai bani Amon', yakni sampai pada daerah mereka. Kata 'wilayah' melancarkan bahasa Indonesia dan memperjelas fungsi frasa sebagai batas teritorial.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan mengapa penaklukan Israel berhenti pada batas tersebut.
- source_word: עַז
  choice: kuat
  rationale: עַז berarti kuat atau kokoh. 'Kuat' mempertahankan keluasan makna dan tidak secara khusus menafsirkan perbatasan itu sebagai benteng.
- source_word: גְּבוּל
  choice: perbatasan
  rationale: Dalam konteks batas antardaerah yang mampu menghalangi perluasan militer, 'perbatasan' merupakan padanan Indonesia yang alami.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: '''Bani Amon'' mempertahankan ungkapan kekerabatan Ibrani, sudah dikenal dalam ragam Alkitab bahasa Indonesia, dan di sini merujuk secara kolektif kepada orang Amon.'
theological_decisions:
- issue: Makna kolektif בְּנֵי עַמּוֹן
  choice: bani Amon
  alternative: orang Amon
  rationale: Bentuk 'bani Amon' menjaga citra genealogis teks sumber, sedangkan catatan kaki menjelaskan padanan etnisnya yang lebih idiomatis. Tidak ada pembedaan doktrinal yang dipaksakan.
- issue: Sifat kuatnya גְּבוּל
  choice: perbatasan bani Amon kuat
  alternative: perbatasan bani Amon berkubu kuat
  rationale: Teks hanya memakai kata sifat 'kuat' dan tidak menyebut benteng secara eksplisit; terjemahan tidak mempersempit ambiguitas mengenai apakah kekuatan itu berasal dari pertahanan, keadaan alam, atau faktor lain.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. 'Bani Amon' dipertahankan sebagai istilah kekerabatan-etnis yang lazim dalam ragam Alkitab, sementara 'Sungai' ditambahkan pada Arnon dan Yabok demi kejelasan geografis. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
