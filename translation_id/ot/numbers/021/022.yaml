    issue: Kata “tetap” dalam “Kami akan tetap menempuh jalan raja” tidak memiliki padanan eksplisit dalam נֵלֵךְ.
    rationale: Kontras dengan larangan berbelok sudah cukup disampaikan oleh urutan kalimat. Menghapus “tetap” menghindari penambahan penegasan sambil mempertahankan maksud rute yang dijanjikan.
  - severity: low
    issue: Catatan kaki “jalan raya kerajaan” kurang dekat dengan frasa sumber dan alternatif audit bahasa Inggris.
    rationale: הַמֶּלֶךְ berarti “raja,” bukan “kerajaan.” “Jalan raya raja” mempertahankan unsur leksikal tersebut dan mencatat ragam tradisional dengan lebih akurat.
