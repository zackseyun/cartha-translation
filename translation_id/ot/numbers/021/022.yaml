  to: Izinkanlah aku melewati negerimu. Kami tidak akan menyimpang ke ladang atau kebun anggur, dan kami tidak akan minum air dari sumur. Kami akan berjalan di jalan raja[a] sampai kami melewati perbatasanmu.
