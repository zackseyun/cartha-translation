base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: id
  text: Izinkanlah aku melewati negerimu. Kami tidak akan menyimpang ke ladang atau kebun anggur, dan kami tidak akan minum air dari sumur. Kami akan berjalan di jalan raja[a] sampai kami melewati perbatasanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara tradisional: “jalan raya raja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Izinkanlah aku melewati
  rationale: Bentuk kohortatif orang pertama tunggal menyatakan permohonan dalam konteks diplomatik; terjemahan ini mempertahankan bentuk tunggal dan nada sopan.
- source_word: בְאַרְצְךָ
  choice: negerimu
  rationale: אֶרֶץ di sini menunjuk negeri atau wilayah yang berada di bawah kekuasaan raja; “negerimu” wajar dalam bahasa Indonesia dan sesuai dengan konteks politik-geografis.
- source_word: לֹא נִטֶּה
  choice: kami tidak akan menyimpang
  rationale: נטה dalam konteks perjalanan berarti berbelok atau keluar dari rute; “menyimpang” menyampaikan komitmen untuk tetap berada pada jalan yang ditentukan.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: ke ladang atau kebun anggur
  rationale: Kedua nomina tunggal digunakan secara generik untuk lahan pertanian; “ke” sesuai dengan gerakan menyimpang memasuki lahan tersebut.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: tidak akan minum air sumur
  rationale: Frasa konstruksi harfiahnya berarti “air dari sumur”; bentuk ringkas “air sumur” alami dan jelas dalam bahasa Indonesia.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: menempuh jalan raja
  rationale: Frasa ini secara harfiah berarti “di jalan raja” dan dapat menunjuk jalan utama kerajaan. “Menempuh” menyatakan perjalanan melalui rute itu, sedangkan alternatif idiomatis dicatat dalam catatan kaki.
- source_word: נֵלֵךְ
  choice: kami akan tetap menempuh
  rationale: הלך adalah verba umum untuk pergi atau berjalan. Kata “tetap” secara alami menegaskan kontras dengan janji untuk tidak menyimpang tanpa mengubah arah makna.
- source_word: עַד אֲשֶׁר נַעֲבֹר
  choice: sampai kami melewati
  rationale: Klausa ini menyatakan titik akhir perjalanan melalui wilayah tersebut.
- source_word: גְּבֻלֶךָ
  choice: batas wilayahmu
  rationale: גְּבוּל dapat berarti batas maupun wilayah. Dalam konteks keluar dari negeri itu, “batas wilayahmu” mempertahankan gambaran konkret tentang melintasi perbatasan dan tetap jelas bagi pembaca modern.
