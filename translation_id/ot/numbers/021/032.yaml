  naturalness: Kalimat draf umumnya jelas dan modern. “Permukiman-permukiman di bawah kekuasaannya” agak berat dan tidak jelas rujukan pronominanya pada pembacaan cepat. “Permukiman-permukimannya” lebih lancar, dengan idiom sumber dijelaskan dalam catatan. “Mengusir” merupakan padanan modern yang lebih langsung untuk tindakan menyingkirkan penduduk dalam konteks ini.
  terminology: “Musa,” “Yaazer,” dan “orang Amori” sesuai register Alkitab bahasa Indonesia. “Mengusir” menyampaikan Hifil ירש dalam konteks penaklukan tanpa memaksakan rincian mengenai siapa subjek tunggal itu. Catatan tentang perubahan jumlah subjek perlu dipertahankan.
