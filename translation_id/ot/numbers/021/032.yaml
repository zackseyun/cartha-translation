  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: id
  text: Kemudian Musa mengutus orang-orang untuk mengintai Yaazer. Mereka merebut permukiman-permukimannya[a], lalu ia mengusir orang Amori yang ada di sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”, sebuah ungkapan Ibrani untuk kota-kota kecil atau permukiman yang bergantung pada sebuah kota induk.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani beralih dari “mereka merebut” (jamak) ke “ia mengusir” (tunggal); siapa yang dimaksud dengan “ia” tidak dinyatakan secara eksplisit.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam narasi, bentuk ini menyatakan bahwa Musa mengirim orang-orang untuk suatu tugas tertentu; “mengutus” alami dan sesuai dengan konteks penugasan.
- source_word: לְרַגֵּל
  choice: untuk mengintai
  rationale: Bentuk piel ini menunjuk pada kegiatan penyelidikan atau pengamatan untuk kepentingan militer; “mengintai” mempertahankan nuansa tersebut dalam bahasa Indonesia.
- source_word: יַעְזֵר
  choice: Yaezer
  rationale: Transliterasi nama tempat Ibrani yang cukup dekat dengan bentuk sumber dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיִּלְכְּדוּ
  choice: Mereka merebut
  rationale: Kata לכד lazim berarti menangkap atau merebut dalam konteks militer; objeknya adalah permukiman-permukiman yang berada di bawah kota Yaezer.
- source_word: בְּנֹתֶיהָ
  choice: permukiman-permukiman di bawah kekuasaannya
  rationale: Secara harfiah berarti “anak-anak perempuannya”, tetapi dalam pemakaian geografis Ibrani menunjuk pada kota kecil atau permukiman bawahan yang bergantung pada sebuah kota induk. Pilihan ini menyampaikan hubungan administratif tanpa mempertahankan idiom yang akan membingungkan pembaca modern.
- source_word: ויירש
  choice: ia menghalau
  rationale: Dalam konteks penaklukan, ירש dapat menyatakan mengambil alih wilayah dengan menyingkirkan penduduk sebelumnya. “Menghalau” menonjolkan tindakan menyingkirkan orang Amori; subjek tunggal dalam teks Ibrani dipertahankan sebagai “ia”.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk tunggal kolektif Ibrani menunjuk pada kelompok etnis; “orang Amori” merupakan ungkapan kolektif yang alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר שָׁם
  choice: yang ada di sana
  rationale: Frasa ini menerangkan orang Amori yang berada di lokasi tersebut.
theological_decisions:
- issue: Peralihan subjek dari bentuk jamak pada וַיִּלְכְּדוּ ke bentuk tunggal pada ויירש
  choice: Mempertahankan peralihan itu dengan “Mereka ... lalu ia ...”
  alternative: Menyelaraskan kedua verba sebagai “mereka merebut ... lalu menghalau ...” atau menyebut “Musa” secara eksplisit
  rationale: Teks Ibrani beralih dari verba jamak ke verba tunggal. Terjemahan tidak menetapkan secara diam-diam apakah subjek tunggal itu Musa, Israel sebagai kesatuan, atau tokoh yang tersirat dalam narasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat dibagi dua agar peralihan pelaku mudah diikuti. Istilah “permukiman-permukiman di bawah kekuasaannya” dipilih untuk menjelaskan idiom geografis tanpa memasukkan struktur administratif yang lebih spesifik daripada teks sumber.
