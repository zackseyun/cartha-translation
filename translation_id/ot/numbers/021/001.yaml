  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: id
  text: Ketika raja Arad, seorang Kanaan, yang tinggal di Negeb, mendengar bahwa Israel sedang datang melalui jalan Atarim[a], ia berperang melawan Israel dan menawan beberapa orang dari antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “melalui jalan Atarim.” Arti “Atarim” tidak pasti; sebagian memahaminya sebagai nama tempat, sedangkan yang lain, dengan mengikuti beberapa versi kuno, memahaminya sebagai “para pengintai.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Dalam narasi, שׁמע lazim berarti menerima kabar; “mendengar” mempertahankan urutan sebab-akibat dalam ayat ini.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: raja Kanaan dari Arad
  rationale: Frasa ini mengidentifikasi sang raja menurut kelompok etnis/politiknya dan wilayah kekuasaannya. Susunan ini alami dalam bahasa Indonesia dan tidak menjadikan “orang Kanaan” sebagai nama diri.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: yang tinggal di Negeb
  rationale: Partisip יֹשֵׁב menyatakan tempat tinggal. “Negeb” dipertahankan sebagai nama kawasan geografis, bukan digeneralisasi menjadi “selatan”.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: bahwa Israel sedang datang
  rationale: כִּי memperkenalkan isi kabar, sedangkan konteks menggambarkan gerak mendekat Israel yang memicu tanggapan sang raja.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: melalui jalan Atarim
  rationale: דֶּרֶךְ berarti jalan atau rute. Karena אֲתָרִים tidak pasti, bentuknya dipertahankan secara konservatif sebagai nama Atarim dan ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: ia berperang melawan Israel
  rationale: Ungkapan ini menyatakan keterlibatan dalam pertempuran melawan Israel tanpa menentukan skala konflik lebih jauh.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: menawan beberapa orang dari antara mereka
  rationale: שׁבה dan שֶׁבִי membentuk ungkapan tentang pengambilan tawanan perang. מִמֶּנּוּ merujuk secara partitif kepada Israel sebagai kelompok, sehingga diterjemahkan alami sebagai “beberapa orang dari antara mereka”.
