  source_fidelity: 'Makna keseluruhan diterjemahkan dengan setia: raja itu mendengar kabar tentang kedatangan Israel melalui rute Atarim, lalu berperang dan mengambil tawanan. Namun, “raja Kanaan dari Arad” dapat dibaca sebagai raja yang memerintah seluruh Kanaan, sedangkan Ibrani mengidentifikasinya sebagai seorang Kanaan yang adalah raja Arad.'
