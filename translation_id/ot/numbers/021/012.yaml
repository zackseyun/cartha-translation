  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: id
  text: Dari sana mereka berangkat, lalu berkemah di Wadi Zered.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembah Zered”, “jurang Zered”, atau “sungai Zered”; kata Ibrani naḥal dapat merujuk pada wadi, lembah, jurang, atau alur sungai musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Ungkapan keterangan ini menunjukkan perpindahan dari lokasi sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan narasi.
- source_word: נָסָעוּ
  choice: mereka berangkat
  rationale: Dalam kisah perjalanan, נסע lazim berarti membongkar perkemahan lalu bergerak ke tempat lain. 'Berangkat' menyampaikan makna itu secara ringkas dan wajar.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה berarti berkemah. 'Lalu' menyatakan kelanjutan peristiwa dari bentuk naratif Ibrani secara alami.
- source_word: בְּנַחַל
  choice: di Wadi
  rationale: נחל dapat menunjuk pada wadi, jurang atau lembah aliran, maupun dasar sungai musiman. 'Wadi' mempertahankan ciri geografis kawasan kering, sedangkan preposisi ב diterjemahkan secara netral sebagai 'di' karena hubungan lokasi tepatnya tidak dirinci.
- source_word: זָרֶד
  choice: Zered
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan.
