source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: id
  text: Maka Musa membuat seekor ular dari perunggu[a] dan menaruhnya pada sebuah tiang[b]. Apabila seekor ular menggigit seseorang[c], dan orang itu memandang ular perunggu tersebut[d], ia tetap hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tembaga.” Istilah Ibrani untuk logam ini dapat merujuk pada tembaga atau perunggu.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat berarti “panji” atau “tiang panji.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “seorang laki-laki”; di sini digunakan secara representatif untuk siapa pun yang digigit.
    reason: lexical_alternative
  - marker: d
    text: Peristiwa ini kemudian digunakan sebagai gambaran tipologis dalam Yohanes 3:14–15.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: ular
  rationale: Dalam bahasa Indonesia modern, “ular” merupakan padanan alami yang mencakup hewan hidup maupun bentuk buatannya; “serpent” tidak memerlukan padanan khusus yang lebih arkais.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Istilah Ibrani dapat menunjuk pada tembaga atau perunggu; “perunggu” mengikuti pemakaian umum dalam terjemahan Alkitab Indonesia, dengan alternatifnya dicatat.
- source_word: הַנֵּס
  choice: sebuah tiang
  rationale: Dalam konteks ini benda tersebut berfungsi sebagai penyangga tegak tempat ular dipasang. Kata sandang Ibrani tidak harus diterjemahkan sebagai “tiang itu” karena tiang ini belum disebut sebelumnya.
- source_word: וְהָיָה אִם
  choice: apabila
  rationale: Gabungan ini memperkenalkan keadaan yang berulang atau berlaku setiap kali seseorang digigit; “apabila” menyampaikannya secara wajar tanpa ungkapan naratif yang kaku.
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: apabila seekor ular menggigit seseorang
  rationale: Kata אִישׁ berbentuk maskulin tunggal tetapi berfungsi mewakili siapa pun yang digigit. “Seseorang” mempertahankan bentuk tunggal dan menyampaikan cakupan generiknya secara alami dalam bahasa Indonesia.
- source_word: וְהִבִּיט אֶל
  choice: memandang
  rationale: “Memandang” menyatakan tindakan melihat dengan sengaja tanpa memasukkan makna teologis tambahan seperti berharap atau beriman.
- source_word: וָחָי
  choice: ia tetap hidup
  rationale: Dalam konteks gigitan yang mengancam nyawa, ungkapan ini berarti orang itu hidup dan tidak mati. “Tetap hidup” lebih tepat daripada “sembuh,” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Bahasa maskulin representatif dalam אִישׁ
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, konteksnya menyatakan setiap orang yang digigit. Bahasa Indonesia “seseorang” mempertahankan ketunggalan dan daya representatif tanpa mempersempitnya hanya kepada laki-laki.
- issue: Kemungkinan pembacaan tipologis pada tindakan memandang
  choice: memandang
  alternative: berpaling dan berharap kepada
  rationale: Bilangan 21:9 hanya menyatakan tindakan memandang ular perunggu. Makna tipologis dalam Yohanes 3:14–15 tidak dimasukkan ke dalam teks utama, tetapi dicatat sebagai rujukan silang.
- issue: Hasil tindakan melihat
  choice: ia tetap hidup
  alternative: ia sembuh
  rationale: Teks Ibrani memakai חיה, “hidup,” bukan kata khusus untuk penyembuhan. Terjemahan mempertahankan ketegangan antara bertahan hidup dan kemungkinan pemulihan tanpa menyatakan lebih dari sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dan hasil dalam bahasa Ibrani. Semua penanda catatan kaki ditempatkan pada unsur teks yang diterangkannya.
