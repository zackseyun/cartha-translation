  text: So Israel lived in the land of the Amorites[a].
translation:
  language: id
  text: Maka Israel tinggal di tanah orang Amori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Maka Israel berdiam di tanah orang Amori.”
    reason: Alternatif yang lebih formal bagi וַיֵּשֶׁב; “berdiam” mempertahankan makna tinggal atau mendiami.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja יָשַׁב dapat berarti duduk, berdiam, tinggal, atau menetap. Dalam ringkasan naratif ini, “tinggal” merupakan ungkapan Indonesia yang alami dan tetap menunjukkan bahwa Israel mendiami wilayah itu tanpa menekankan sifat permanen secara berlebihan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama bangsa dipertahankan dengan bentuk baku dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ
  choice: di negeri
  rationale: אֶרֶץ di sini menunjuk pada wilayah milik suatu bangsa. “Negeri” alami dalam konstruksi “negeri orang Amori” dan sesuai dengan konteks geografis-politis.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk Ibrani bersifat tunggal kolektif/gentilis dan dalam konteks ini menunjuk kepada kelompok etnis beserta wilayahnya. “Orang Amori” adalah bentuk kolektif yang wajar dalam bahasa Indonesia.
- source_word: וַ
  choice: Demikianlah
  rationale: Waw konsekutif menghubungkan ayat ini dengan hasil peristiwa sebelumnya. “Demikianlah” menyampaikan nuansa kesimpulan atau akibat secara alami dalam bahasa Indonesia.
