  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: id
  text: Lalu malaikat Yahweh berkata kepada Bileam, “Pergilah bersama orang-orang itu, tetapi hanya perkataan yang akan Kusampaikan kepadamu itulah yang harus kaukatakan.” Maka Bileam pergi bersama para pejabat Balak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat. Dalam konteks narasi ini sosok tersebut bersifat adikodrati, sehingga “malaikat” paling tepat; nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: Pergilah bersama orang-orang itu
  rationale: Imperatif dan frasa עִם diterjemahkan langsung. “Orang-orang itu” secara alami merujuk kepada rombongan laki-laki yang telah disebutkan tanpa perlu memakai ungkapan Indonesia yang kaku.
- source_word: וְאֶפֶס
  choice: Namun, hanya
  rationale: Ungkapan ini membatasi izin yang baru diberikan. Gabungan “namun, hanya” menyampaikan baik pertentangan maupun pembatasannya.
- source_word: הַדָּבָר
  choice: perkataan
  rationale: Dalam konteks tindakan berbicara, דָּבָר menunjuk pada perkataan atau pesan. “Perkataan” mempertahankan bentuk tunggal dan kaitan leksikal dengan verba דבר.
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: yang akan Kusampaikan kepadamu
  rationale: Bentuk imperfek berorientasi ke depan. “Kusampaikan” terdengar alami dalam bahasa Indonesia dan mencakup pengertian bahwa perkataan itu akan diucapkan kepada Bileam.
- source_word: אֹתוֹ תְדַבֵּר
  choice: itulah yang harus kaukatakan
  rationale: Objek yang dikedepankan bersifat emfatis dan membatasi Bileam pada perkataan tersebut saja. “Itulah” mempertahankan penekanan, sedangkan “harus” menyampaikan daya instruksinya secara wajar.
- source_word: שָׂרֵי בָלָק
  choice: para pejabat Balak
  rationale: שָׂרִים dapat berarti pemimpin, pembesar, pangeran, atau pejabat. Dalam konteks rombongan diplomatik Balak, “para pejabat” jelas dan tidak menyiratkan bahwa mereka semua putra raja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi יהוה. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Konteks menggambarkan sosok adikodrati yang menghadang Bileam. Terjemahan “malaikat” sesuai dengan konteks tanpa menetapkan lebih jauh hakikat teologis sosok itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur ujaran dibuat alami, sambil mempertahankan pembatasan dan penekanan kuat pada perkataan yang boleh disampaikan Bileam.
