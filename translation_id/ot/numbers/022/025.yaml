  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: id
  text: Ketika keledai betina itu melihat malaikat Yahweh[a], ia mendesakkan diri ke tembok dan menjepit kaki Bileam ke tembok itu. Lalu Bileam memukulnya lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “utusan Yahweh.” Dalam konteks ini sosok tersebut jelas bersifat adikodrati, sehingga teks utama memakai “malaikat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: keledai betina itu
  rationale: אָתוֹן secara khusus menunjuk pada keledai betina. Penyebutan eksplisit wajar dalam bahasa Indonesia dan sesuai dengan bentuk feminin dalam teks Ibrani.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti 'utusan' atau 'malaikat'; konteks narasi ini menunjukkan sosok adikodrati, sehingga 'malaikat' dipakai, sementara nama ilahi יְהוָה dipertahankan sebagai 'Yahweh'.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: ia merapat ke tembok
  rationale: Bentuk ini menggambarkan keledai mendesakkan tubuhnya rapat ke tembok; 'merapat' menyampaikan gerakan tersebut secara alami tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: sehingga kaki Bileam terjepit pada tembok
  rationale: Klausa transitif dengan akar לחץ menunjukkan bahwa gerakan keledai menekan atau menjepit kaki Bileam pada tembok. Susunan kausal ini alami dalam bahasa Indonesia dan mempertahankan hubungan tindakan dengan akibat.
- source_word: רֶגֶל
  choice: kaki
  rationale: רֶגֶל dapat menunjuk kaki secara umum; bahasa Indonesia tidak mengharuskan pembedaan telapak kaki dan tungkai dalam konteks ini.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: Lalu Bileam memukulnya lagi
  rationale: יָסַף dengan infinitif menyatakan pengulangan tindakan. Subjek 'Bileam' dibuat eksplisit agar rujukan pronominal tetap jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Bentuk 'Yahweh' mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Makna מַלְאַךְ dalam frasa מַלְאַךְ יְהוָה
  choice: malaikat
  alternative: utusan
  rationale: Kata tersebut pada dasarnya dapat berarti 'utusan', tetapi dalam konteks ini sosok yang dilihat keledai adalah makhluk adikodrati. Catatan kaki mempertahankan alternatif leksikal tanpa menentukan identitas teologisnya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Keledai betina' mempertahankan ketepatan jenis kelamin hewan; 'merapat' dan 'terjepit' menyampaikan gerakan serta akibatnya dengan jelas. Nama Bileam diulang pada klausa terakhir untuk menghindari ambiguitas pelaku.
