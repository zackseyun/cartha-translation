  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: id
  text: Sebab aku akan sangat menghormatimu[a] dan akan melakukan apa pun yang kau katakan kepadaku. Jadi, datanglah kiranya dan kutuklah bangsa ini bagiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “aku pasti akan sangat menghormatimu” atau “aku akan memberimu upah yang besar.” Dalam bahasa Ibrani, kata kerja “menghormati” ditegaskan dengan bentuk khusus untuk menyatakan kepastian atau penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan janji Balak sebagai alasan yang mendasari permintaannya kembali.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: aku akan sangat menghormatimu
  rationale: Mempertahankan makna dasar akar כבד, yaitu menghormati, sedangkan 'sangat' menyampaikan penegasan konstruksi infinitif absolut dengan verba finit serta מְאֹד.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: dan akan melakukan apa pun yang kaukatakan kepadaku
  rationale: Menyampaikan cakupan luas כֹל אֲשֶׁר dalam susunan bahasa Indonesia yang alami tanpa mempersempit janji tersebut.
- source_word: וּלְכָה נָּא
  choice: Jadi, datanglah kiranya
  rationale: Imperatif gerak diterjemahkan langsung, sementara נָא disampaikan dengan 'kiranya' untuk mempertahankan nuansa permohonan mendesak dan sopan dalam ragam bermartabat.
- source_word: קָבָה לִּי
  choice: kutuklah ... bagiku
  rationale: Verba ini menunjuk pada tindakan mengucapkan kutuk; לִי mempertahankan kepentingan pribadi Balak sebagai penerima manfaat tindakan tersebut.
- source_word: אֵת הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם merupakan nomina kolektif tunggal; 'bangsa ini' alami dalam bahasa Indonesia dan sesuai dengan kelompok Israel yang dimaksud.
