  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: id
  text: Malaikat Yahweh berkata kepadanya, “Mengapa engkau memukul keledaimu tiga kali ini? Lihat, Aku datang sebagai lawanmu[a], sebab engkau menempuh jalanmu dengan gegabah di hadapan-Ku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שָׂטָן di sini berarti “lawan” atau “penentang”; kata itu tidak harus dipahami sebagai nama diri “Satan.”
    reason: lexical_alternative
  - marker: b
    text: Verba Ibrani yang diterjemahkan “gegabah” sangat jarang dan maknanya tidak pasti; ungkapan ini juga dapat dipahami bahwa jalan Bileam “menyimpang” atau “bertentangan” di hadapan-Ku.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat; dalam konteks penampakan adikodrati ini, “malaikat” paling tepat. Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: עַל מָה
  choice: Mengapa
  rationale: Padanan interogatif yang alami dan langsung dalam bahasa Indonesia.
- source_word: הִכִּיתָ אֶת אֲתֹנְךָ
  choice: engkau memukul keledaimu
  rationale: נכה berarti memukul atau menghantam. אֲתוֹן secara khusus adalah keledai betina, tetapi “keledai” lebih alami dan jenis kelaminnya tidak ditekankan dalam ayat ini.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: sampai tiga kali
  rationale: Ungkapan Ibrani ini secara idiomatis berarti tiga kali; “sampai” menyampaikan nada teguran atas tindakan yang berulang.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: Lihat, Aku telah keluar
  rationale: “Lihat” mempertahankan fungsi הִנֵּה sebagai penarik perhatian, sedangkan “telah keluar” mengikuti verba יצא tanpa menghilangkan gambaran bahwa sang malaikat tampil menghadang di jalan.
- source_word: לְשָׂטָן
  choice: sebagai lawanmu
  rationale: שָׂטָן di sini berfungsi sebagai nomina umum, “lawan” atau “penentang,” bukan harus sebagai nama diri. Akhiran “-mu” dinyatakan secara kontekstual agar hubungan perlawanannya alami dalam bahasa Indonesia.
- source_word: יָרַט הַדֶּרֶךְ
  choice: jalanmu gegabah
  rationale: Verba ירט sangat jarang dan maknanya tidak pasti. “Gegabah” menyampaikan kemungkinan makna tindakan yang melaju secara ceroboh, sambil mempertahankan evaluasi terhadap jalan atau tindakan Bileam.
- source_word: לְנֶגְדִּי
  choice: di hadapan-Ku
  rationale: Padanan ini mempertahankan kemungkinan nuansa spasial maupun evaluatif dari ungkapan Ibrani, tanpa mempertegasnya menjadi “melawan Aku”.
theological_decisions:
- issue: Apakah שָׂטָן merupakan nama diri atau nomina umum
  choice: 'Nomina umum: “sebagai lawanmu”'
  alternative: “sebagai Satan” atau “untuk menentangmu”
  rationale: Konteks menggambarkan malaikat Yahweh sebagai pihak yang menghadang Bileam. Bentuk Ibrani tidak menuntut identifikasi dengan Satan sebagai nama diri; terjemahan nomina umum menghindari memasukkan gagasan demonologis yang tidak dinyatakan teks.
- issue: Makna verba langka יָרַט
  choice: “gegabah”
  alternative: “menyimpang,” “sesat,” atau “bertentangan”
  rationale: Makna verba ini diperdebatkan. “Gegabah” mempertahankan kemungkinan bahwa perjalanan Bileam dinilai ceroboh atau terburu-buru, sedangkan catatan kaki menyajikan pembacaan alternatif tanpa menutup ketidakpastian sumber.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina “engkau” sesuai untuk ujaran langsung bernada teguran dalam narasi Alkitab. Kapitalisasi “Aku” dan “-Ku” mengikuti rujukan kepada penutur ilahi, tanpa menambahkan penafsiran mengenai identitas malaikat Yahweh.
