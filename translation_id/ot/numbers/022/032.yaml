revisions:
- from: Malaikat Yahweh berkata kepadanya, “Mengapa engkau memukul keledaimu sampai tiga kali? Lihat, Aku telah keluar sebagai lawanmu[a], sebab jalanmu gegabah di hadapan-Ku[b].”
  to: Malaikat Yahweh berkata kepadanya, “Mengapa engkau memukul keledaimu tiga kali ini? Lihat, Aku datang sebagai lawanmu[a], sebab engkau menempuh jalanmu dengan gegabah di hadapan-Ku[b].”
  rationale: Revisi membetulkan penunjukan “tiga kali ini,” memperlancar predikasi “gegabah” dengan menjadikannya cara Bileam menempuh jalannya, dan mempertahankan bentuk orang pertama dalam catatan kaki. “Datang sebagai lawanmu” menyampaikan kemunculan malaikat untuk menghadang serta fungsi לְשָׂטָן tanpa menjadikannya nama diri atau memaksakan pembacaan teologis.
