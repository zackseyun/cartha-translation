  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: id
  text: Lalu Allah datang kepada Bileam dan berkata, “Siapakah orang-orang yang bersamamu ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk wayyiqtol Qal dari בוא melanjutkan urutan narasi dan dalam konteks ini secara alami berarti ‘datang’, tanpa memperinci bahwa Allah memasuki suatu tempat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dengan verba tunggal dan dalam konteks narasi ini, אֱלֹהִים menunjuk kepada Allah yang berbicara secara pribadi kepada Bileam.
- source_word: אֶל בִּלְעָם
  choice: kepada Bileam
  rationale: אֶל menyatakan arah menuju seseorang; ‘kepada’ merupakan padanan Indonesia yang alami. Nama בִּלְעָם ditransliterasikan menurut bentuk baku bahasa Indonesia, ‘Bileam’.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: אמר sebagai pengantar perkataan langsung paling alami diterjemahkan ‘berkata’; konjungsi mempertahankan kesinambungan tindakan dalam bahasa Ibrani.
- source_word: מִי
  choice: Siapakah
  rationale: Kata tanya ini meminta identitas orang-orang tersebut; ‘siapakah’ sesuai dengan ragam narasi yang bermartabat.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: orang-orang ... ini
  rationale: Frasa ini menunjuk kepada sekelompok laki-laki tertentu yang hadir. Dalam bahasa Indonesia, ‘orang-orang ini’ alami dan tidak menghilangkan referen laki-laki yang sudah jelas dari konteks, sedangkan ‘para pria’ terdengar kurang alami dalam pertanyaan ini.
- source_word: עִמָּךְ
  choice: yang bersamamu
  rationale: עם dengan sufiks orang kedua tunggal menyatakan kebersamaan atau penyertaan; klausa relatif menghasilkan susunan Indonesia yang alami.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada wayyiqtol pembuka memajukan urutan narasi; ‘Lalu’ menyampaikan hubungan berurutan secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam kisah Bileam
  choice: Allah
  alternative: suatu allah; sosok ilahi
  rationale: Keselarasan dengan verba tunggal dan konteks narasi menunjukkan bahwa yang mendatangi Bileam ialah Allah, bukan sosok ilahi yang tidak ditentukan. Pilihan ini tidak menambahkan penjelasan doktrinal di luar teks.
- issue: Pertanyaan Allah mengenai identitas para utusan
  choice: Dibiarkan sebagai pertanyaan langsung tanpa penjelasan tambahan
  alternative: Menafsirkannya sebagai permintaan informasi atau pertanyaan retoris
  rationale: Teks hanya mencatat pertanyaan Allah. Terjemahan mempertahankan ketegangan mengenai fungsi pertanyaan itu tanpa menentukan apakah Allah sedang mencari informasi atau menguji Bileam.
translation_notes:
  register: Bahasa Indonesia baku, modern, alami, dan bermartabat. ‘Bileam’ mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas leksikal yang harus ditampilkan dalam teks terbitan.
