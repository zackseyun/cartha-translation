  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: id
  text: Balak anak Zipor melihat semua yang telah dilakukan Israel terhadap orang Amori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk tunggal kolektif, “orang Amori,” yang merujuk kepada bangsa Amori.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk wayyiqtol dari ראה melanjutkan alur narasi. Dalam bahasa Indonesia, bentuk lampau dipahami dari konteks tanpa penanda waktu tambahan.
- source_word: בָּלָק
  choice: Balak
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן צִפּוֹר
  choice: anak Zipor
  rationale: Rangkaian konstruksi menyatakan hubungan keturunan; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: אֵת כָּל אֲשֶׁר
  choice: semua yang
  rationale: Mengungkapkan keseluruhan hal yang menjadi objek tindakan melihat.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Konstruksi pasif diperlukan karena Israel adalah pelaku dalam klausa relatif, sedangkan semua yang menjadi objek. Kata 'telah' secara alami menunjukkan bahwa tindakan itu mendahului pengamatan Balak.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama bangsa dipertahankan dalam bentuk baku bahasa Indonesia dan di sini berfungsi secara kolektif.
- source_word: לָאֱמֹרִי
  choice: terhadap orang Amori
  rationale: Preposisi ל dalam konteks ini menyatakan pihak yang dikenai tindakan. Nomina tunggal gentilik Ibrani dipakai secara kolektif; 'orang Amori' juga dapat dipahami sebagai nama kelompok dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan fokus naratif pada apa yang dilihat Balak tanpa menambahkan penanda wacana seperti 'Lalu' atau 'Adapun' yang tidak dinyatakan secara eksplisit dalam sumber.
