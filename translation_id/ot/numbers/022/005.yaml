source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: id
  text: Lalu ia mengirim utusan kepada Bileam anak Beor ke Petor, yang terletak di tepi Sungai[a], di negeri anak-anak bangsanya[b], untuk memanggilnya dengan berkata, “Lihat, sebuah bangsa telah keluar dari Mesir! Lihat, bangsa itu telah menutupi permukaan negeri[c] dan tinggal berhadapan denganku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Sungai”; kemungkinan besar yang dimaksud ialah Sungai Efrat.
    reason: cross_reference
  - marker: b
    text: Atau “di negeri bangsanya.” Ungkapan Ibrani “negeri anak-anak bangsanya” sulit, dan acuan akhiran “-nya” dapat dipahami dengan cara yang berbeda.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “mata negeri”, sebuah ungkapan yang menunjuk pada permukaan negeri yang tampak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ia mengirim
  rationale: Bentuk naratif wayyiqtol melanjutkan rangkaian peristiwa; “lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks diplomatik ini kata tersebut menunjuk kepada pembawa pesan manusia, bukan malaikat.
- source_word: בִּלְעָם בֶּן־בְּעוֹר
  choice: Bileam anak Beor
  rationale: Nama-nama diri mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: פְּתוֹרָה
  choice: di Petor
  rationale: Akhiran direktif menyatakan arah menuju Petor, sedangkan keseluruhan klausa secara alami mengidentifikasi tempat Bileam berada.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: yang terletak di tepi Sungai
  rationale: Teks menyebut “Sungai” dengan kata sandang; identifikasinya sebagai Sungai Efrat diberikan dalam catatan kaki tanpa dimasukkan secara interpretatif ke dalam teks utama.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: di negeri anak-anak bangsanya
  rationale: Ungkapan Ibrani ini sulit. Terjemahan mempertahankan unsur “anak-anak” dan ketidakjelasan acuan pronomina, sementara catatan kaki memberi bentuk yang lebih luwes.
- source_word: לִקְרֹא־לוֹ
  choice: untuk memanggil dia
  rationale: Infinitif menyatakan tujuan; “memanggil” cukup netral dan tidak menambahkan nuansa perintah yang lebih kuat dari teks.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini muncul dua kali dan menuntut perhatian secara tegas; pengulangannya dipertahankan.
- source_word: עַם יָצָא מִמִּצְרַיִם
  choice: suatu bangsa telah keluar dari Mesir
  rationale: “Bangsa” sesuai untuk kelompok etnis-nasional yang dimaksud, dan bentuk “telah keluar” menyampaikan peristiwa lampau yang masih relevan bagi pembicara.
- source_word: כִסָּה אֶת־עֵין הָאָרֶץ
  choice: telah menutupi permukaan negeri
  rationale: Secara leksikal עֵין berarti “mata”, tetapi dalam ungkapan ini menunjuk pada permukaan negeri yang tampak. Terjemahan utama menyampaikan makna idiomatis, sedangkan citra harfiahnya dicatat.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: dan sekarang tinggal di hadapanku
  rationale: Pronomina tunggal kolektif diterjemahkan dengan mengulang “bangsa itu”; “di hadapanku” mempertahankan arti spasial bahwa bangsa tersebut berada berseberangan atau tepat di depan Balak. “Sekarang” menyatakan keadaan yang sedang berlangsung secara alami dalam bahasa Indonesia.
