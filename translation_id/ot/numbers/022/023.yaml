  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: id
  text: Ketika keledai betina itu melihat malaikat Yahweh berdiri di jalan dengan pedang terhunus di tangannya[a], keledai itu menyimpang dari jalan dan masuk ke ladang. Lalu Bileam memukul keledai itu untuk membelokkannya kembali ke jalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “utusan Yahweh.”'
    reason: מַלְאָךְ dapat berarti “malaikat” maupun “utusan”; catatan ini mempertahankan alternatif leksikal yang sah.
lexical_decisions:
- source_word: הָאָתוֹן
  choice: keledai betina itu
  rationale: אָתוֹן secara khusus menunjuk pada keledai betina. Penyebutan jenis kelamin ini alami dalam bahasa Indonesia dan mempertahankan informasi leksikal Ibrani.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat; dalam konteks sosok adikodrati yang memegang pedang terhunus, 'malaikat' merupakan padanan utama yang paling wajar. Nama ilahi יְהוָה dipertahankan sebagai Yahweh.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: berdiri di tengah jalan
  rationale: Partisipel נִצָּב menggambarkan posisi berdiri, sedangkan בַּדֶּרֶךְ di sini menunjukkan bahwa sosok itu berada di jalan sebagai penghalang. 'Di tengah jalan' menyampaikan fungsi adegan tersebut secara alami.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: dengan pedang terhunus di tangannya
  rationale: שְׁלוּפָה berarti ditarik keluar dari sarungnya atau terhunus. Susunan dengan 'dengan' alami dalam bahasa Indonesia dan mempertahankan gambaran aslinya.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: keledai itu menyimpang dari jalan
  rationale: נָטָה dalam konteks ini berarti berbelok atau menyimpang dari jalur. 'Menyimpang dari jalan' tepat dan sesuai dengan ragam naratif.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: masuk ke ladang
  rationale: שָׂדֶה berarti ladang atau tanah terbuka. Gerak menuju tempat itu disampaikan secara idiomatis dengan 'masuk ke ladang'.
- source_word: וַיַּךְ
  choice: memukul
  rationale: נכה adalah verba umum untuk memukul atau menghantam. 'Memukul' tidak menambahkan gagasan tindakan berulang yang tidak dinyatakan secara eksplisit oleh bentuk verba ini.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: untuk membelokkannya kembali ke jalan
  rationale: Infinitif kausatif dengan sufiks feminin menyatakan upaya membuat keledai itu berbelok. Karena keledai tersebut baru saja meninggalkan jalan, 'kembali ke jalan' memperjelas arah yang tersirat oleh konteks tanpa menambahkan peristiwa baru.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi יְהוָה. Bentuk 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna מַלְאַךְ dalam frasa מַלְאַךְ יְהוָה
  choice: malaikat
  alternative: utusan
  rationale: Konteks naratif menggambarkan sosok adikodrati yang terlihat oleh keledai dan berdiri dengan pedang terhunus, sehingga 'malaikat' menjadi pembacaan utama; kemungkinan leksikal 'utusan' tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. 'Keledai betina' mempertahankan jenis kelamin yang dinyatakan oleh nomina Ibrani; penyebutan berikutnya dipersingkat menjadi 'keledai itu'. Nama Yahweh dipertahankan secara langsung.
