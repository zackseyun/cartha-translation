id: NUM.22.41
reference: Numbers 22:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: id
  text: Keesokan paginya, Balak membawa Bileam dan mengajaknya naik ke Bamot-Baal[a]. Dari sana, Bileam melihat bagian terluar dari bangsa itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukit-bukit pemujaan Baal,” jika ungkapan ini dipahami sebagai sebutan deskriptif, bukan nama tempat Bamot-Baal.
    reason: lexical_alternative
  - marker: b
    text: Artinya, dari sana hanya bagian paling luar dari bangsa Israel yang terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Keesokan paginya
  rationale: Rangkaian naratif menunjukkan peristiwa pada pagi berikutnya; ungkapan ini alami dalam bahasa Indonesia modern tanpa menerjemahkan formula naratif secara kaku.
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam konteks ini Balak mengikutsertakan Bileam menuju lokasi lain; 'membawa' menyampaikan makna לקח secara alami.
- source_word: וַיַּעֲלֵהוּ
  choice: mengajaknya naik
  rationale: Bentuk Hifil dari עלה bersifat kausatif, yakni membuat atau membawa seseorang naik. Pilihan ini menjaga gagasan pendakian dan menghindari pengulangan 'membawa'.
- source_word: בָּמוֹת בָּעַל
  choice: Bamot-Baal
  rationale: Ungkapan tersebut berfungsi sebagai nama tempat dalam konteks ini dan karena itu ditransliterasikan; kemungkinan pembacaan deskriptif dicatat dalam catatan kaki.
- source_word: וַיַּרְא
  choice: Bileam melihat
  rationale: ראה berarti 'melihat'. Subjek gramatikalnya tersirat dan secara konteks paling wajar adalah Bileam; nama disebutkan untuk mencegah ketidakjelasan dalam bahasa Indonesia.
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Padanan lokatif langsung yang menunjukkan titik pandang.
- source_word: קְצֵה הָעָם
  choice: bagian terluar dari bangsa itu
  rationale: קצה berarti ujung, tepi, atau bagian paling luar. Frasa ini menyampaikan bahwa yang terlihat hanyalah bagian pinggir bangsa Israel tanpa menambahkan kata 'perkemahan' yang tidak terdapat dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Nama tempat ditransliterasikan sebagai Bamot-Baal. Subjek tersirat pada וַיַּרְא diperjelas menjadi Bileam demi keterbacaan, sedangkan catatan kaki mempertahankan alternatif leksikal yang sungguh ada.
