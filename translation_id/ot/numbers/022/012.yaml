  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: id
  text: Lalu Allah berfirman kepada Bileam, “Jangan pergi bersama mereka. Jangan kutuk bangsa itu, sebab bangsa itu diberkati.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, teks Ibrani memakai bentuk tunggal: “sebab ia diberkati,” dengan “ia” merujuk kepada bangsa itu sebagai satu kesatuan kolektif. Secara idiomatis dapat juga diterjemahkan, “sebab mereka diberkati.”'
    reason: Menjelaskan bentuk tunggal kolektif dalam bahasa Ibrani dan alternatif idiomatisnya.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur cerita. “Lalu” wajar dalam narasi Indonesia, sedangkan “berfirman” sesuai untuk perkataan langsung Allah dalam ragam Alkitab yang modern dan bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah yang berbicara langsung kepada Bileam; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: לֹא תֵלֵךְ
  choice: Jangan pergi
  rationale: Bentuk imperfek dengan לֹא berfungsi sebagai larangan. “Jangan pergi” menyampaikan daya larangan secara langsung dan alami dalam bahasa Indonesia modern.
- source_word: עִמָּהֶם
  choice: bersama mereka
  rationale: Padanan langsung yang merujuk kepada para utusan Balak.
- source_word: לֹא תָאֹר
  choice: Jangan kutuk
  rationale: אָאַר berarti “mengutuk”; dalam konteks ini bentuknya merupakan larangan. “Jangan kutuk” tegas dan alami.
- source_word: אֶת הָעָם
  choice: bangsa itu
  rationale: הָעָם menunjuk kepada Israel sebagai satu bangsa atau kelompok kolektif. “Bangsa itu” mempertahankan acuan kolektif tunggal tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan tersebut. “Sebab” jelas, alami, dan sesuai dengan ragam bermartabat.
- source_word: בָרוּךְ הוּא
  choice: bangsa itu diberkati
  rationale: Adjektiva dan pronomina Ibrani berbentuk maskulin tunggal dan kembali kepada הָעָם sebagai nomina kolektif tunggal. Pengulangan “bangsa itu” dalam bahasa Indonesia memperjelas acuannya sekaligus mempertahankan pengertian kolektif tunggal.
theological_decisions:
- issue: Acuan dan jumlah gramatikal dalam klausa “diberkati”
  choice: 'Klausa itu merujuk kepada Israel secara kolektif: “sebab bangsa itu diberkati.”'
  alternative: “sebab mereka diberkati”
  rationale: Teks Ibrani memakai bentuk tunggal בָרוּךְ הוּא dengan הָעָם, nomina kolektif tunggal. Bahasa Indonesia tidak menandai jumlah pada “diberkati”, sehingga “bangsa itu diberkati” secara alami mempertahankan struktur kolektif tunggal tanpa menjadikannya seorang individu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Larangan diterjemahkan dengan “jangan” agar tegas tanpa bernada arkais. “Berfirman” dipakai bagi tuturan langsung Allah; “bangsa itu” menjaga acuan Israel sebagai kesatuan kolektif.
