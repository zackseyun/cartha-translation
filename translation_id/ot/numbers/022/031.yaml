id: NUM.22.31
reference: Numbers 22:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: id
  text: Lalu Yahweh membuka mata Bileam[a], dan ia melihat malaikat Yahweh[b] berdiri di jalan dengan pedang terhunus di tangannya. Bileam pun membungkuk lalu bersujud dengan muka ke tanah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyingkapkan mata Bileam.”
    reason: lexical_alternative
  - marker: b
    text: Atau “utusan Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Atau “menjatuhkan diri dengan muka ke tanah.” Kata Ibrani yang diterjemahkan “bersujud” juga dapat menggambarkan tindakan penghormatan atau penyembahan.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: וַיְגַל
  choice: membuka
  rationale: Secara harfiah verba גלה berarti “menyingkapkan,” tetapi dalam ungkapan mengenai mata, “membuka mata” merupakan bahasa Indonesia yang alami dan tetap menyampaikan bahwa Yahweh membuat Bileam mampu melihat apa yang sebelumnya tidak dilihatnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: עֵינֵי בִלְעָם
  choice: mata Bileam
  rationale: Bentuk konstruksi Ibrani dialihkan secara alami sebagai hubungan kepunyaan dalam bahasa Indonesia.
- source_word: וַיַּרְא
  choice: ia melihat
  rationale: Bentuk naratif ini menyatakan hasil langsung setelah Yahweh membuka mata Bileam.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ secara leksikal dapat berarti “utusan,” tetapi dalam konteks penampakan adikodrati ini “malaikat” adalah padanan yang paling alami; kemungkinan leksikal “utusan” dicatat dalam catatan kaki.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: berdiri di jalan
  rationale: Partisipel נִצָּב menggambarkan posisi tetap atau berdiri, sedangkan דֶּרֶךְ dalam konteks perjalanan menunjuk pada jalan yang sedang dilalui.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: dengan pedang terhunus di tangannya
  rationale: Terjemahan ini mempertahankan gambaran konkret bahwa pedang malaikat itu telah dicabut dari sarung dan berada di tangannya.
- source_word: וַיִּקֹּד
  choice: membungkuk
  rationale: Verba ini menggambarkan gerakan menunduk atau membungkukkan tubuh sebagai penghormatan tanpa menentukan secara berlebihan posisi tubuhnya.
- source_word: וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: bersujud dengan muka ke tanah
  rationale: Ungkapan ini mempertahankan tindakan jasmani berupa sujud dan gambaran muka menghadap tanah, tanpa secara eksplisit menetapkannya sebagai tindakan penyembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Apakah וַיִּשְׁתַּחוּ harus diterjemahkan sebagai tindakan tubuh atau secara eksplisit sebagai penyembahan
  choice: 'bahasa tindakan tubuh: “bersujud”'
  alternative: “menyembah”
  rationale: Verba tersebut dapat dipakai untuk sujud sebagai penghormatan atau penyembahan. Konteks ini secara jelas menggambarkan respons jasmani Bileam, sehingga “bersujud” mempertahankan tindakan tersebut tanpa menutup kemungkinan makna penghormatan religius.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama בִלְעָם memakai bentuk Indonesia yang lazim, “Bileam.” Susunan kalimat dibuat lancar sebagai narasi, sementara gambaran konkret tentang jalan, pedang terhunus, dan sujud tetap dipertahankan.
