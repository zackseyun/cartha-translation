  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: id
  text: Kemudian malaikat Yahweh melanjutkan perjalanan[a] dan berdiri di tempat sempit yang tidak ada jalan untuk berbelok ke kanan atau ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terus berjalan” atau “berjalan lebih jauh.” Secara harfiah, idiom Ibrani ini menyatakan gagasan meneruskan perjalanan ke depan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: melanjutkan perjalanannya
  rationale: Konstruksi יסף dengan infinitif עבר menyatakan bahwa malaikat itu terus bergerak maju. Pilihan ini wajar dalam bahasa Indonesia dan mempertahankan gagasan kelanjutan gerak.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: Dalam kisah supernatural ini, מַלְאַךְ paling alami diterjemahkan sebagai 'malaikat', sedangkan nama ilahi יהוה dipertahankan sebagai 'Yahweh'.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: עמד secara langsung berarti berdiri atau mengambil posisi; 'berdiri' cukup jelas dalam konteks ini.
- source_word: בְּמָקוֹם צָר
  choice: di suatu tempat sempit
  rationale: Ungkapan ini menunjuk lokasi yang terhimpit atau sempit dan dipertahankan sebagai gambaran ruang yang konkret.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: yang tidak memberi jalan untuk menyimpang
  rationale: Frasa ini bukan menyatakan tidak adanya jalan sama sekali, melainkan tidak adanya ruang atau jalur untuk berbelok ke samping.
- source_word: יָמִין וּשְׂמֹאול
  choice: ke kanan ataupun ke kiri
  rationale: Kedua arah dipertahankan secara eksplisit; 'ataupun' secara alami menegaskan bahwa tidak ada pilihan di kedua sisi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama ilahi dan mengikuti kebijakan proyek tanpa menyamarkannya sebagai gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dan gambaran tempat yang sempit dalam teks Ibrani.
