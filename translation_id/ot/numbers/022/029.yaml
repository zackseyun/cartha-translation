  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: id
  text: Lalu Bileam berkata kepada keledai betina itu, “Sebab engkau telah mempermainkan aku! Seandainya ada pedang di tanganku, tentu sekarang juga aku sudah membunuhmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” wajar dalam narasi Indonesia dan tidak memberi penafsiran berlebihan.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לָאָתוֹן
  choice: kepada keledai betina itu
  rationale: אָתוֹן secara khusus menunjuk keledai betina. Bahasa Indonesia dapat menyatakan jenis kelamin ini secara alami tanpa kejanggalan berarti.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan Bileam atas kemarahannya; “Sebab” sesuai dengan tuturan langsung yang bernada keras.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: engkau telah mempermainkan aku
  rationale: Bentuk hitpael dari עלל dapat menyatakan perlakuan sewenang-wenang, penghinaan, atau tindakan mempermainkan seseorang. Pilihan ini mempertahankan cakupan makna tanpa membatasi pada ejekan verbal.
- source_word: לוּ
  choice: Seandainya
  rationale: Menyatakan keinginan atau keadaan yang berlawanan dengan kenyataan saat itu.
- source_word: יֶשׁ חֶרֶב בְּיָדִי
  choice: ada pedang di tanganku
  rationale: Mempertahankan gambaran keberadaan pedang secara konkret di tangan Bileam, sesuai susunan Ibrani.
- source_word: כִּי עַתָּה
  choice: sekarang juga
  rationale: Mengungkapkan tindakan segera dan ancaman untuk membunuh di tempat saat itu.
- source_word: הֲרַגְתִּיךְ
  choice: aku akan membunuhmu
  rationale: Dalam konstruksi pengandaian dengan לוּ, bentuk ini menyatakan akibat yang tidak terlaksana tetapi dimaksudkan segera. “Akan membunuhmu” alami dalam bahasa Indonesia dan menjaga daya ancamannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau/aku” mempertahankan ketegangan tuturan langsung, sedangkan “keledai betina” menyampaikan informasi gender yang eksplisit dalam kata dan bentuk gramatikal Ibrani.
