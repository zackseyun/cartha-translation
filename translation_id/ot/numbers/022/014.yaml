base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/014.yaml
  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: id
  text: Lalu para pemimpin Moab bangkit dan pergi menghadap Balak. Mereka berkata, “Bileam menolak pergi bersama kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: para pemimpin Moab
  rationale: Kata שָׂרִים menunjuk para pejabat atau pemuka berwenang; 'para pemimpin' alami dalam bahasa Indonesia dan tidak mempersempit jabatan mereka.
- source_word: וַיָּק֨וּמוּ֙
  choice: bangkit
  rationale: Mempertahankan tindakan 'bangun/bangkit' sebelum keberangkatan, bukan hanya menjadikannya penanda urutan.
- source_word: וַיָּבֹאוּ אֶל־בָּלָק
  choice: pergi menghadap Balak
  rationale: Dalam konteks utusan yang kembali kepada raja, 'menghadap' menyampaikan gerak menuju Balak secara alami dan hormat tanpa menambah isi.
- source_word: מֵאֵן
  choice: menolak
  rationale: Secara langsung menyatakan penolakan atau ketidaksediaan Bileam.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: pergi bersama kami
  rationale: Mewakili konstruksi infinitif Ibrani secara idiomatis dan tepat.
