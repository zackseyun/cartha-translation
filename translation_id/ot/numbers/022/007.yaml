base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: id
  text: Lalu pergilah para tua-tua Moab dan para tua-tua Midian dengan membawa upah penenungan[a]. Mereka datang kepada Bileam dan berbicara kepadanya perkataan Balak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan membawa sarana-sarana tenung”; ungkapan Ibrani ini dapat menunjuk kepada sarana atau pertanda untuk menenung, tetapi dalam konteks ini kemungkinan besar berarti bayaran yang dibawa untuk mendapatkan jasa penenungan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: para tua-tua
  rationale: Dalam bentuk konstruksi dengan nama bangsa, istilah ini menunjuk kepada para tua-tua yang diakui sebagai pemimpin masyarakat. Pilihan ini mempertahankan jabatan sosial-politiknya.
- source_word: וּקְסָמִים בְּיָדָם
  choice: dengan membawa upah untuk tenung
  rationale: קְסָמִים dapat berarti praktik, sarana, atau pertanda tenung, tetapi dalam konteks utusan yang hendak memakai jasa Bileam, ungkapan ini kemungkinan besar merujuk secara metonimis kepada bayaran untuk penenungan. 'Membawa' mengungkapkan idiom harfiah 'di tangan mereka' secara alami dalam bahasa Indonesia.
- source_word: וַיָּבֹאוּ אֶל
  choice: mereka tiba di tempat
  rationale: בוא אֶל berarti datang atau tiba kepada seseorang. Setelah 'pergilah', 'tiba di tempat Bileam' menyampaikan urutan gerak dengan jelas dan alami.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: menyampaikan kepadanya
  rationale: Secara leksikal berarti 'berbicara kepadanya'; dalam konstruksi dengan 'perkataan Balak', 'menyampaikan' secara alami menunjukkan bahwa para utusan mengutarakan kata-kata yang dipercayakan kepada mereka tanpa mengubah isinya menjadi sekadar ringkasan pesan.
- source_word: דִּבְרֵי בָלָק
  choice: perkataan Balak
  rationale: Terjemahan ini mempertahankan bentuk harfiah 'kata-kata/perkataan Balak' dan tidak menentukan apakah isinya merupakan kutipan langsung atau pesan yang diamanatkan.
- source_word: וַיֵּלְכוּ
  choice: Lalu pergilah
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. 'Lalu' merupakan penghubung naratif yang alami tanpa menambahkan hubungan sebab-akibat yang terlalu tegas.
