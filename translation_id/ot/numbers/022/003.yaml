  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: id
  text: Moab sangat takut kepada bangsa itu karena jumlah mereka besar. Moab merasa ngeri terhadap orang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “merasa ngeri” juga dapat berarti “merasa muak,” “jijik,” atau “tertekan.” Dalam konteks ini, nuansa kengerian yang bercampur rasa muak tampaknya menonjol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר ... מְאֹד
  choice: sangat takut
  rationale: Kata kerja גור dalam konteks ini menyatakan rasa takut atau gentar, sedangkan מְאֹד memperkuatnya. Ungkapan “sangat takut” alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִפְּנֵי
  choice: kepada / terhadap
  rationale: Secara harfiah berarti “dari hadapan,” tetapi dalam kedua klausa ini menandai pihak yang menimbulkan ketakutan atau kengerian. Pilihan ini lebih wajar daripada terjemahan harfiah dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Nomina kolektif ini menunjuk kepada Israel sebagai satu kelompok bangsa. “Bangsa itu” mempertahankan rujukan tertentu dan cocok dengan konteks.
- source_word: כִּי רַב הוּא
  choice: karena jumlah mereka sangat besar
  rationale: רַב di sini menunjuk pada besarnya jumlah bangsa Israel. Bahasa Indonesia secara alami memakai bentuk jamak “mereka” untuk kelompok kolektif tersebut.
- source_word: וַיָּקָץ
  choice: merasa ngeri
  rationale: Kata קוץ dapat menyatakan rasa muak, tertekan, atau kengerian yang mendalam. “Merasa ngeri” sesuai dengan konteks ketakutan tanpa menghapus kemungkinan nuansa jijik atau muak, yang dicatat dalam catatan kaki.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” lebih alami dan tidak disalahpahami sebagai hanya anak-anak atau hanya laki-laki.
- source_word: מוֹאָב
  choice: Moab
  rationale: Nama baku bagi negeri atau bangsa Moab; ambiguitas antara wilayah dan penduduknya tetap dipertahankan.
