  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: id
  text: Lalu Bileam berkata kepada Balak, “Lihat, sekarang aku telah datang kepadamu. Sanggupkah aku mengatakan apa pun?[a] Perkataan yang Allah taruh dalam mulutku, itulah yang akan kukatakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sungguh-sungguh sanggupkah aku mengatakan apa pun?” Bahasa Ibrani memakai konstruksi penegas untuk menyatakan kemampuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan daya deiktis dan penegasan dalam ungkapan Indonesia modern tanpa memakai bentuk arkais seperti ‘sesungguhnya’.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: sekarang aku telah datang kepadamu
  rationale: Menyampaikan aspek perfektif dan unsur waktu עַתָּה secara alami serta menekankan bahwa Bileam kini sudah hadir di hadapan Balak.
- source_word: הֲיָכוֹל אוּכַל
  choice: Sanggupkah aku
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kemampuan; pertanyaan retoris ini menyatakan keterbatasan nyata Bileam.
- source_word: דַּבֵּר מְאוּמָה
  choice: mengatakan apa pun sesuka hatiku
  rationale: ‘Apa pun’ mencerminkan מְאוּמָה. Tambahan idiomatis ‘sesuka hatiku’ memperjelas dalam bahasa Indonesia bahwa yang dipersoalkan ialah kebebasan Bileam untuk mengucapkan sesuatu atas kehendaknya sendiri, sesuai konteks dan tanpa mengubah pembatasan pada tuturannya.
- source_word: הַדָּבָר
  choice: Perkataan
  rationale: Dalam konteks ucapan kenabian, ‘perkataan’ mempertahankan bentuk tunggal konkret dan terdengar alami dalam bahasa Indonesia.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: yang Allah taruh dalam mulutku
  rationale: Mempertahankan metafora Ibrani tentang perkataan yang diberikan secara ilahi; ‘taruh’ alami dan mudah dipahami.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: itulah yang akan kukatakan
  rationale: Pronomina objek yang didahulukan diberi tekanan melalui ‘itulah’, sehingga pembatasan pada perkataan dari Allah tetap jelas tanpa menambahkan penjelasan doktrinal.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Verba yang menyertainya berbentuk tunggal dan konteks menunjuk kepada Allah yang berbicara secara berotoritas kepada Bileam.
theological_decisions:
- issue: Kendali ilahi atas perkataan Bileam
  choice: Bileam menyatakan bahwa ia tidak bebas berkata sesuka hati, melainkan hanya akan mengatakan perkataan yang Allah taruh dalam mulutnya.
  alternative: Bileam mampu mengatakan apa saja, tetapi secara sukarela berniat membatasi dirinya.
  rationale: Pertanyaan dengan konstruksi penegas הֲיָכוֹל אוּכַל dan penekanan pada אֹתוֹ אֲדַבֵּר menunjukkan tutur yang dibatasi, bukan sekadar pilihan pribadi. Terjemahan mempertahankan ketegangan ini tanpa merinci mekanisme ilham.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Lihat’ dan ‘taruh dalam mulutku’ mempertahankan citra sumber secara lugas; ‘sesuka hatiku’ membuat maksud pertanyaan retoris alami bagi pembaca umum.
