  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: id
  text: Lalu Yahweh membuka mulut keledai betina itu, dan keledai itu berkata kepada Bileam, “Apa yang telah kulakukan kepadamu sehingga engkau memukul aku tiga kali ini[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ini tiga kaki”; ini adalah ungkapan Ibrani yang berarti “tiga kali” atau “pada tiga kesempatan ini”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: membuka
  rationale: Bentuk qal wayyiqtol dari פתח menyatakan tindakan langsung Yahweh dan secara wajar diterjemahkan sebagai “membuka”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: פִּי הָאָתוֹן
  choice: mulut keledai betina itu
  rationale: Frasa konstruksi ini secara harfiah berarti “mulut keledai itu”; nomina Ibraninya feminin, dan “keledai betina” menyampaikan ciri tersebut secara alami dalam bahasa Indonesia.
- source_word: וַתֹּאמֶר
  choice: dan keledai itu berkata
  rationale: Verba feminin tunggal merujuk kembali kepada keledai; pengulangan subjek lebih jelas dan alami daripada memakai pronomina bergender yang tidak tersedia dalam bahasa Indonesia.
- source_word: לְבִלְעָם
  choice: kepada Bileam
  rationale: Preposisi לְ diterjemahkan secara alami sebagai “kepada”, dan bentuk nama Indonesia yang lazim ialah “Bileam”.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: Apa yang telah kulakukan kepadamu
  rationale: Ungkapan pertanyaan ini menyatakan keberatan atas perlakuan Bileam; bentuk perfektif ditampilkan dengan “telah” tanpa menambahkan makna lain.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan ini כִּי menghubungkan tindakan yang ditanyakan dengan akibat atau dasar perlakuan Bileam. “Sehingga” menghasilkan pertanyaan Indonesia yang alami tanpa memaksakan hubungan kausal yang terpisah.
- source_word: הִכִּיתַנִי
  choice: engkau memukuliku
  rationale: Hifil נכה berarti memukul atau menghantam. Bentuk “memukuliku” secara idiomatis menyampaikan bahwa tindakan itu dilakukan berulang kali kepada si keledai.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: sampai tiga kali
  rationale: רְגָלִים secara harfiah berarti “kaki”, tetapi di sini merupakan idiom untuk kejadian atau kesempatan. “Sampai tiga kali” alami dalam keluhan langsung dan mempertahankan jumlahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Pelaku mukjizat kemampuan keledai berbicara
  choice: Yahweh membuka mulut keledai
  alternative: Yahweh membuat keledai berbicara
  rationale: Pilihan utama mempertahankan gambaran konkret teks Ibrani dan secara langsung menisbatkan tindakan tersebut kepada Yahweh tanpa menjelaskan mekanismenya lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Engkau” dipakai dalam dialog untuk menjaga nada sastra yang wajar; “memukuliku” menyampaikan pukulan berulang. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang dijelaskan.
