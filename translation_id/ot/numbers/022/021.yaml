  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַֽ/יַּחֲבֹ֖שׁ אֶת אֲתֹנ֑/וֹ וַ/יֵּ֖לֶךְ עִם שָׂרֵ֥י מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: id
  text: Bileam bangun pada pagi hari, memasang pelana pada keledainya[a], lalu pergi bersama para pemuka Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keledai betinanya.” Kata Ibrani yang digunakan secara khusus menyebut keledai betina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangun
  rationale: Bentuk naratif Qal dari קום menyatakan tindakan bangkit atau bangun; dalam konteks pagi hari, “bangun” paling alami dalam bahasa Indonesia.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Menerjemahkan keterangan waktu secara langsung tanpa menambahkan gagasan “pagi-pagi sekali”, yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וַיַּחֲבֹשׁ
  choice: memasang pelana pada
  rationale: Dalam pemakaian dengan hewan tunggangan, חבש berarti mempersiapkannya dengan memasang pelana; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: אֶת אֲתֹנוֹ
  choice: keledainya[a]
  rationale: אָתוֹן secara khusus berarti keledai betina. Teks utama memakai bentuk Indonesia yang alami, sedangkan rincian jenis kelaminnya dipertahankan dalam catatan kaki karena dapat relevan dalam kisah selanjutnya.
- source_word: וַיֵּלֶךְ
  choice: lalu pergi
  rationale: הלך dalam rangkaian narasi sederhana berarti “pergi”; “lalu” mewakili kesinambungan tindakan dalam bentuk wayyiqtol.
- source_word: עִם
  choice: bersama
  rationale: Padanan alami untuk preposisi yang menyatakan penyertaan.
- source_word: שָׂרֵי מוֹאָב
  choice: para pemuka Moab
  rationale: שָׂרִים menunjuk orang-orang berkedudukan sebagai pemimpin, pejabat, atau bangsawan. “Para pemuka” mempertahankan status tinggi mereka tanpa secara sempit menyiratkan bahwa semuanya putra raja.
