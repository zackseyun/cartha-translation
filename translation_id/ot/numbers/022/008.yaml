  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: id
  text: Bileam berkata kepada mereka, “Bermalamlah di sini malam ini. Aku akan menyampaikan jawaban kepada kalian sesuai dengan apa yang Yahweh firmankan kepadaku.” Maka para pembesar Moab tinggal bersama Bileam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Bermalamlah di sini malam ini
  rationale: Bentuk imperatif jamak dari לון/לין mengajak para utusan untuk tinggal semalam. “Bermalamlah” tepat dan alami dalam bahasa Indonesia, sedangkan “di sini malam ini” mempertahankan unsur tempat dan waktu.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: Aku akan menyampaikan kepada kalian jawaban
  rationale: Ungkapan dengan bentuk kausatif שוב dan דָּבָר menyatakan tindakan membawa kembali atau memberikan suatu jawaban/pesan. “Menyampaikan ... jawaban” terdengar alami tanpa menghapus gagasan bahwa Bileam akan melaporkan firman yang diterimanya.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: sesuai dengan apa yang Yahweh firmankan kepadaku
  rationale: כַּאֲשֶׁר menyatakan kesesuaian, sedangkan יְדַבֵּר dalam konteks ini mengacu pada firman yang akan disampaikan. “Firmankan” sesuai untuk tuturan ilahi dan tetap mempertahankan daya verbal teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וַיֵּשְׁבוּ
  choice: tinggal
  rationale: Walaupun ישב dapat berarti “duduk” atau “menetap”, konteks undangan untuk bermalam menunjukkan arti “tinggal” atau “tetap berada” bersama Bileam.
- source_word: שָׂרֵי מוֹאָב
  choice: para pembesar Moab
  rationale: שָׂרִים dapat menunjuk para pemimpin, pejabat, atau bangsawan. “Para pembesar” mempertahankan status tinggi mereka tanpa memastikan bahwa mereka adalah pangeran kerajaan.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama tersebut, sementara “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Sifat jawaban yang akan disampaikan Bileam
  choice: jawaban sesuai dengan apa yang Yahweh firmankan
  alternative: apa pun yang Yahweh firmankan
  rationale: Terjemahan ini mempertahankan hubungan ketat antara laporan Bileam dan firman Yahweh tanpa menyatakan terlebih dahulu isi atau hasil jawaban itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata “kalian” memperjelas objek jamak אֶתְכֶם dan cocok dalam ujaran langsung; “para pembesar” dipilih untuk mempertahankan keluasan makna שָׂרִים.
