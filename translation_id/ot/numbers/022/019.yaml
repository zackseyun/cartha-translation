  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: id
  text: Sekarang, mohon kalian juga tinggal di sini malam ini, supaya aku mengetahui apa lagi yang akan Yahweh katakan kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa lagi yang akan Yahweh bicarakan denganku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengantar instruksi Bileam berikutnya; bentuk tanpa “dan” paling alami dalam bahasa Indonesia modern.
- source_word: שְׁבוּ נָא
  choice: tinggallah
  rationale: Dalam konteks ini, verba ישׁב berarti menetap atau tinggal, bukan sekadar duduk. Nuansa permohonan pada נָא tercermin dalam bentuk imperatif yang tidak kasar dalam susunan kalimat ini.
- source_word: בָזֶה
  choice: di sini
  rationale: Ungkapan lokatif ini secara alami berarti tempat mereka berada saat itu.
- source_word: גַּם אַתֶּם
  choice: kalian juga
  rationale: 'Mempertahankan penekanan aditif: utusan-utusan ini diminta tinggal sebagaimana rombongan sebelumnya.'
- source_word: הַלָּיְלָה
  choice: malam ini
  rationale: Akusatif waktu ini menunjuk pada malam yang segera tiba; “malam ini” adalah padanan Indonesia yang idiomatis.
- source_word: וְאֵדְעָה
  choice: supaya aku mengetahui
  rationale: Bentuk kohortatif menyatakan tujuan dari permintaan agar mereka tinggal; “supaya” menyampaikan hubungan tersebut dengan jelas.
- source_word: מַה יֹּסֵף
  choice: apa lagi
  rationale: Konstruksi dengan יסף menyatakan tambahan atau kelanjutan, sehingga “apa lagi” mempertahankan maknanya secara ringkas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: דַּבֵּר עִמִּי
  choice: katakan kepadaku
  rationale: Secara kontekstual, Bileam menantikan pesan yang akan disampaikan kepadanya. Pilihan ini alami dalam bahasa Indonesia, sementara kemungkinan harfiah “berbicara denganku” dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Sifat komunikasi antara Yahweh dan Bileam dalam דַּבֵּר עִמִּי
  choice: katakan kepadaku
  alternative: berbicara denganku
  rationale: Konteks menyoroti pesan tambahan yang hendak diterima Bileam, tetapi ungkapan Ibrani dengan עִמִּי juga dapat diterjemahkan lebih harfiah sebagai komunikasi “dengan” dirinya; alternatif itu dipertahankan dalam catatan kaki agar nuansanya tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina jamak “kalian” memperjelas bahwa perintah ditujukan kepada rombongan utusan. Susunan “kalian juga” mempertahankan penekanan aditif dalam teks Ibrani.
