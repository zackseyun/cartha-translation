  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֗ם וַ/יֹּ֨אמֶר֙ אֶל עַבְדֵ֣י בָלָ֔ק אִם יִתֶּן לִ֥/י בָלָ֛ק מְלֹ֥א בֵית֖/וֹ כֶּ֣סֶף וְ/זָהָ֑ב לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּי֙ יְהוָ֣ה אֱלֹהָ֔/י לַ/עֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: id
  text: Bileam menjawab para hamba Balak, “Sekalipun Balak memberikan kepadaku seisi rumahnya berupa perak dan emas, aku tidak sanggup melampaui titah Yahweh, Allahku,[a] untuk melakukan apa pun, baik yang kecil maupun yang besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “melampaui mulut Yahweh, Allahku,” yaitu melewati atau melanggar apa yang telah difirmankan-Nya.'
    reason: Menjelaskan idiom Ibrani sambil mempertahankan metafora sumber yang tidak dapat dialihkan sepenuhnya secara alami ke teks utama.
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Bileam menjawab
  rationale: Rangkaian harfiah 'menjawab dan berkata' merupakan formula naratif Ibrani; 'menjawab' menyampaikan fungsinya secara alami dalam bahasa Indonesia.
- source_word: עַבְדֵי בָלָק
  choice: para hamba Balak
  rationale: Kata עֶבֶד dapat berarti budak, hamba, atau pelayan. Dalam konteks utusan kerajaan, 'para hamba' mempertahankan hubungan pengabdian tanpa memastikan status mereka sebagai budak atau pejabat.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Sekalipun Balak memberikan kepadaku
  rationale: Walaupun אִם secara dasar berarti 'jika', dalam pernyataan hipotetis ini syarat tersebut memiliki daya konsesif; 'sekalipun' terdengar alami dan menegaskan bahwa tawaran sebesar apa pun tidak mengubah batas yang disebutkan.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: seisi rumahnya berupa perak dan emas
  rationale: Ungkapan מְלֹא בֵיתוֹ menggambarkan seluruh isi atau kapasitas rumah. Pilihan ini mempertahankan citra kekayaan yang memenuhi rumah dan menghindari kesan bahwa rumah itu sendiri diberikan.
- source_word: לֹא אוּכַל
  choice: aku tidak sanggup
  rationale: Bentuk יכל menyatakan ketidakmampuan, bukan sekadar ketidakmauan. 'Tidak sanggup' mempertahankan daya itu dalam konstruksi hipotetis.
- source_word: לַעֲבֹר אֶת פִּי
  choice: melampaui titah
  rationale: Secara harfiah ungkapan ini berarti 'melampaui mulut'. 'Melampaui titah' mempertahankan gambaran batas yang tidak boleh dilewati sekaligus menjelaskan bahwa yang dimaksud ialah ucapan berotoritas.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, Allahku
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan bentuk posesif אֱלֹהָי diterjemahkan langsung sebagai 'Allahku' tanpa menambahkan implikasi teologis.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: dengan melakukan sesuatu, baik yang kecil maupun yang besar
  rationale: Pasangan 'kecil ... besar' merupakan merisme yang mencakup segala tindakan. Rumusan ini mempertahankan kedua kutub sambil membuat cakupan idiomnya jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri itu dan mengikuti bentuk yang lazim dalam kajian Ibrani.
- issue: Daya pernyataan Bileam
  choice: ketidaksanggupan melampaui titah Yahweh
  alternative: penolakan untuk melanggar perintah Yahweh
  rationale: Pemakaian יכל menekankan kemampuan, sedangkan idiom 'melampaui mulut' menunjuk pada melewati batas ucapan berotoritas. Terjemahan tidak mereduksinya menjadi sekadar kemauan atau penolakan.
- issue: Lingkup 'kecil atau besar'
  choice: segala tindakan, baik kecil maupun besar
  alternative: melakukan kurang atau lebih
  rationale: Pasangan tersebut dibiarkan terlihat sebagai merisme, sehingga cakupannya luas tanpa menentukan jenis tindakan yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bileam' dan 'Balak' mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia. 'Para hamba' dipilih sebagai istilah sosial yang cukup luas; 'titah' menyampaikan ucapan berotoritas tanpa menghilangkan citra batas pada verba 'melampaui'. Tanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
