id: NUM.22.34
reference: Numbers 22:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: id
  text: Lalu Bileam berkata kepada malaikat Yahweh[a], “Aku telah berdosa, sebab aku tidak tahu bahwa engkau berdiri menghadang aku di jalan. Sekarang, jika hal ini jahat di matamu[b], aku akan kembali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jika hal ini jahat di matamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti ‘utusan’ atau ‘malaikat’. Dalam konteks ini sosok adikodrati itu tampak dengan pedang terhunus dan menghadang Bileam, sehingga ‘malaikat’ paling sesuai; nama יְהוָה dipertahankan sebagai Yahweh.
- source_word: חָטָאתִי
  choice: Aku telah berdosa
  rationale: Bentuk perfektif menyatakan pengakuan Bileam atas dosa yang sudah dilakukan dan masih relevan pada saat ia berbicara.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: sebab aku tidak tahu
  rationale: כִּי memperkenalkan alasan yang dikemukakan Bileam; ‘sebab’ alami dalam pengakuan langsung.
- source_word: נִצָּב לִקְרָאתִי
  choice: berdiri menghadang aku
  rationale: נִצָּב menyatakan berdiri atau mengambil posisi, sedangkan לִקְרָאתִי pada konteks malaikat berpedang membawa daya menentang. ‘Menghadang’ mempertahankan daya adversatif tanpa memperluas makna secara berlebihan.
- source_word: בַּדָּרֶךְ
  choice: di jalan
  rationale: Terjemahan lokatif langsung yang alami bagi latar perjalanan ini.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: jika hal ini jahat di matamu
  rationale: Ungkapan sumber secara harfiah menyebut sesuatu yang ‘jahat di matamu’. ‘Hal ini’ memasok subjek tersirat secara wajar, sementara idiom dan bobot moralnya dipertahankan.
- source_word: אָשׁוּבָה לִּי
  choice: aku akan kembali
  rationale: Bentuk kohortatif menyatakan niat atau kesediaan Bileam untuk berbalik dan pulang. Dativus לִּי tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama ilahi itu dan tidak menggantinya dengan gelar.
- issue: Daya makna לִקְרָאתִי dalam konteks malaikat berpedang
  choice: menghadang aku
  alternative: menemui aku
  rationale: Secara leksikal frasa ini dapat berarti datang atau berdiri untuk menemui seseorang, tetapi konteks jalan yang diblokir dan pedang terhunus memberi nuansa perlawanan. ‘Menghadang’ menyampaikan nuansa itu tanpa membuat klaim teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘aku–engkau’ dipakai dalam tuturan langsung bernuansa sastra Alkitab. Ungkapan sumber ‘jahat di matamu’ sengaja dipertahankan; catatan kaki menjelaskan sifat harfiahnya.
