  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: id
  text: Allah datang kepada Bileam pada malam hari dan berkata kepadanya, “Jika orang-orang itu telah datang untuk memanggilmu[a], bangunlah dan pergilah bersama mereka. Namun, hanya perkataan yang akan Kusampaikan kepadamu[b] itulah yang harus kaulakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah datang untuk menjemputmu” atau “telah datang untuk mengundangmu.”
    reason: Frasa לִקְרֹא לְךָ secara harfiah berkaitan dengan memanggil seseorang, tetapi dalam konteks dapat menyiratkan menjemput atau mengundang.
  - marker: b
    text: Atau, “hanya hal yang akan Kukatakan kepadamu.”
    reason: Kata דָּבָר dapat berarti ‘perkataan’, ‘hal’, atau ‘perkara’; konteks pembicaraan mendukung ‘perkataan’ tetapi tidak meniadakan arti yang lebih luas.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk naratif dari בוא secara wajar menyatakan bahwa Allah datang kepada Bileam; ‘menampakkan diri’ akan menambahkan unsur penglihatan yang tidak dinyatakan teks.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Ayat ini memakai אֱלֹהִים, bukan nama ilahi YHWH, sehingga perbedaan sebutan dalam teks Ibrani dipertahankan.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia modern dan mempertahankan latar malam.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Jika orang-orang itu datang untuk memanggilmu
  rationale: Terjemahan ini mempertahankan bentuk syarat dan tujuan kedatangan mereka tanpa menentukan lebih jauh apakah maksudnya memanggil, menjemput, atau mengundang.
- source_word: קוּם לֵךְ
  choice: bangunlah dan pergilah
  rationale: Dua kata perintah dalam bahasa Ibrani dipertahankan sebagai dua tindakan yang berurutan dan alami dalam bahasa Indonesia.
- source_word: אִתָּם
  choice: bersama mereka
  rationale: Padanan langsung dan jelas sesuai konteks.
- source_word: וְאַךְ
  choice: Namun, hanya
  rationale: 'Gabungan ini menyampaikan pertentangan sekaligus pembatasan: Bileam boleh pergi, tetapi hanya dengan syarat yang ketat.'
- source_word: הַדָּבָר
  choice: perkataan
  rationale: Dalam konteks tindakan Allah berbicara, ‘perkataan’ mempertahankan hubungan verbal dengan אֲדַבֵּר, sementara kemungkinan arti ‘hal’ tetap dicatat.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: yang akan Kusampaikan kepadamu
  rationale: Bentuk imperfek paling alami dipahami berorientasi ke depan dalam konteks ini; ‘Kusampaikan’ menghindari pengulangan yang kaku tanpa menghilangkan unsur komunikasi lisan.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: itulah yang harus kaulakukan
  rationale: Konstruksi ini mempertahankan penonjolan objek dalam bahasa Ibrani dan menyampaikan daya wajib dari perintah ilahi secara alami.
theological_decisions:
- issue: Sebutan ilahi dalam ayat ini
  choice: Allah
  alternative: TUHAN
  rationale: Teks Ibrani ayat ini secara khusus memakai אֱלֹהִים, bukan YHWH; terjemahan tidak menyelaraskannya dengan sebutan ilahi pada ayat-ayat sekitar.
- issue: Sifat pesan yang harus ditaati Bileam
  choice: perkataan yang akan Kusampaikan
  alternative: hal yang akan Kukatakan
  rationale: Pilihan utama menonjolkan ucapan ilahi tanpa mengubah דָּבָר menjadi istilah teknis yang lebih sempit; catatan kaki mempertahankan keluasan makna katanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Bentuk terikat pronominal seperti ‘Kusampaikan’ dan ‘kaulakukan’ mengikuti ejaan baku dan menjaga kelancaran kalimat. Struktur penegasan ‘itulah yang harus kaulakukan’ mempertahankan tekanan pada objek perintah.
