  text: וַ/יֹּ֥סֶף ע֖וֹד בָּלָ֑ק שְׁלֹ֣חַ שָׂרִ֔ים רַבִּ֥ים וְ/נִכְבָּדִ֖ים מֵ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: id
  text: Kemudian Balak mengutus lagi sejumlah pejabat yang lebih banyak dan lebih terhormat[a] daripada rombongan sebelumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lebih terpandang” atau “lebih tinggi kedudukannya.” Kata Ibrani ini menekankan status atau martabat yang lebih tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... עוֹד ... שְׁלֹחַ
  choice: mengutus lagi
  rationale: Gabungan idiom יָסַף dengan infinitif dan עוֹד menyatakan tindakan yang diulangi; “mengutus lagi” merupakan ungkapan Indonesia yang alami.
- source_word: בָּלָק
  choice: Balak
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: שָׂרִים
  choice: pejabat
  rationale: Kata ini menunjuk para wakil atau pemimpin berkedudukan tinggi; “pejabat” jelas, modern, dan cocok dengan konteks diplomatik.
- source_word: רַבִּים
  choice: lebih banyak
  rationale: 'Frasa pembanding מֵאֵלֶּה membuat maknanya komparatif: jumlah rombongan baru lebih besar.'
- source_word: וְנִכְבָּדִים
  choice: lebih terhormat
  rationale: Bentuk ini berasal dari akar כבד dan mengungkapkan kehormatan, bobot kedudukan, atau prestise yang lebih tinggi.
- source_word: מֵאֵלֶּה
  choice: daripada rombongan sebelumnya
  rationale: Kata penunjuk ini merujuk kembali kepada para pejabat yang telah diutus; penyebutan “rombongan sebelumnya” memperjelas acuannya secara alami tanpa mengubah perbandingan.
