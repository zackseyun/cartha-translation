  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: id
  text: Lalu pada pagi hari Bileam bangun dan berkata kepada para pejabat Balak[a], “Pergilah ke negeri kalian, sebab Yahweh menolak mengizinkan aku pergi bersama kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pembesar Balak” atau “para pemimpin Balak.”
    reason: שָׂרֵי memiliki rentang makna yang mencakup pejabat, pembesar, dan pemimpin.
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangun
  rationale: Bentuk naratif dari קום menyatakan tindakan Bileam bangkit atau bangun pada pagi hari; “bangun” alami dalam bahasa Indonesia dengan keterangan waktu yang mengikutinya.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Padanan waktu yang jelas dan wajar tanpa menambahkan gagasan bahwa saat itu masih sangat pagi.
- source_word: שָׂרֵי בָלָק
  choice: para pejabat Balak
  rationale: שָׂרִים dapat menunjuk pejabat, pembesar, atau pemimpin. Dalam konteks ini mereka adalah utusan seorang raja, sehingga “para pejabat” menyampaikan kedudukan resmi mereka tanpa menyiratkan bahwa semuanya putra raja.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Bentuk imperatif jamak dari הלך; “Pergilah” menyampaikan perintah langsung kepada rombongan itu.
- source_word: אֶל אַרְצְכֶם
  choice: ke negeri kalian
  rationale: אֶרֶץ dapat berarti tanah atau negeri. “Negeri kalian” alami untuk tempat asal rombongan dan mempertahankan bentuk orang kedua jamak.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah Bileam; “sebab” jelas, ringkas, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: מֵאֵן
  choice: menolak
  rationale: Bentuk Piel perfektif dari מאן secara tegas menyatakan penolakan, bukan sekadar ketidaksediaan atau ketidakmampuan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan gelar.
- source_word: לְתִתִּי
  choice: mengizinkan aku
  rationale: נתן yang diikuti konstruksi infinitif di sini bermakna memberi izin atau membiarkan. “Mengizinkan aku” menyampaikan fungsi idiomatis tersebut secara alami.
- source_word: לַהֲלֹךְ עִמָּכֶם
  choice: pergi bersama kalian
  rationale: Dalam konteks ini הלך dengan עִם berarti menyertai rombongan dalam perjalanan; “pergi bersama kalian” merupakan padanan langsung dan alami.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Padanan baku untuk verba tutur dalam alur naratif Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama pribadi dan tidak menggantinya dengan gelar; vokalisasi historisnya tidak sepenuhnya pasti, tetapi bentuk ini merupakan transliterasi ilmiah yang lazim.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. “Kalian” dipakai untuk mempertahankan bentuk jamak pada rombongan Balak, sedangkan “menolak mengizinkan” menjaga tekanan leksikal pada tindakan menolak.
