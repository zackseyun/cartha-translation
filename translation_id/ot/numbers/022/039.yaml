  text: וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם בָּלָ֑ק וַ/יָּבֹ֖אוּ קִרְיַ֥ת חֻצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: id
  text: Lalu Bileam pergi bersama Balak, dan mereka sampai di Kiryat-Huzot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Kiryat-Huzot kemungkinan berarti “kota jalan-jalan” atau “kota tempat-tempat terbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol Qal dari הלך melanjutkan alur cerita dengan makna umum ‘pergi’; pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit cara perjalanan.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עִם
  choice: bersama
  rationale: Preposisi ini menyatakan penyertaan; ‘bersama’ terdengar alami dan jelas dalam konteks ini.
- source_word: בָּלָק
  choice: Balak
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיָּבֹאוּ
  choice: mereka sampai
  rationale: Bentuk wayyiqtol jamak dari בוא menyatakan gerak menuju tempat berikutnya; ‘sampai’ merupakan ungkapan naratif Indonesia yang alami tanpa menyatakan bahwa mereka masuk ke dalam kota.
- source_word: קִרְיַת חֻצוֹת
  choice: Kiryat-Huzot
  rationale: Ungkapan ini berfungsi sebagai nama tempat, sehingga ditransliterasikan dalam teks utama. Unsur katanya dapat berarti ‘kota jalan-jalan’ atau ‘kota tempat-tempat terbuka’, dan makna tersebut dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Konjungsi awal diterjemahkan ‘Lalu’ untuk meneruskan rangkaian peristiwa secara alami. Penanda catatan kaki ditempatkan sesudah nama tempat yang dijelaskannya.
