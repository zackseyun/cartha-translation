base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: id
  text: Lihatlah, bangsa yang keluar dari Mesir itu telah menutupi permukaan tanah.[a] Sekarang, datanglah dan kutuklah mereka bagiku. Barangkali aku dapat memerangi mereka dan mengusir mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah, “menutupi mata tanah,” suatu ungkapan yang berarti menutupi permukaan tanah yang terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata penunjuk ini menarik perhatian dengan nada mendesak; “Lihatlah” alami dan tetap mempertahankan daya serunya.
- source_word: הָעָם
  choice: bangsa
  rationale: Nomina kolektif ini menunjuk Israel sebagai suatu kelompok etnis-politis; “bangsa” paling jelas dalam konteks ancaman terhadap negeri Balak.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: yang keluar dari Mesir
  rationale: Partisip berartikel mengidentifikasi bangsa itu melalui peristiwa keluaran; klausa relatif Indonesia menyampaikan fungsi tersebut secara alami.
- source_word: וַיְכַס
  choice: telah menutupi
  rationale: Bentuk verba melaporkan tindakan yang menghasilkan keadaan yang masih berlangsung; “telah” menandai dampak kini tanpa memaksakan aspek yang terlalu rinci.
- source_word: עֵין הָאָרֶץ
  choice: permukaan negeri ini
  rationale: Ungkapan Ibrani secara harfiah berbunyi “mata negeri/tanah” dan berarti bagian permukaan yang terlihat. “Permukaan negeri ini” jelas dalam bahasa Indonesia dan konteksnya mengacu pada wilayah Balak.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Menandai peralihan mendesak dari laporan menuju permintaan.
- source_word: לְכָה
  choice: datanglah
  rationale: Imperatif ini merupakan desakan untuk bertindak; “datanglah” mempertahankan bentuk ajakan/perintah.
- source_word: קָבָה
  choice: kutuklah
  rationale: Verba tersebut secara khusus berarti mengucapkan kutuk; pilihan langsung ini mempertahankan kekuatan permintaan Balak.
- source_word: לִּי
  choice: bagiku
  rationale: Datif keuntungan menunjukkan bahwa Balaam diminta bertindak demi kepentingan Balak.
- source_word: אֹתוֹ
  choice: mereka
  rationale: Walaupun bentuk Ibraninya tunggal, acuannya adalah nomina kolektif “bangsa”; bentuk jamak lebih alami dalam bahasa Indonesia.
- source_word: אוּלַי אוּכַל
  choice: Barangkali aku dapat
  rationale: Mempertahankan unsur kemungkinan dan harapan tanpa mengubahnya menjadi kepastian.
- source_word: לְהִלָּחֶם בּוֹ
  choice: memerangi mereka
  rationale: Konstruksi ini berarti terlibat dalam pertempuran melawan bangsa tersebut; “memerangi” ringkas, alami, dan jelas.
- source_word: וְגֵרַשְׁתִּיו
  choice: dan mengusir mereka
  rationale: Menyatakan hasil yang diharapkan Balak setelah berhasil berperang; pronomina jamak mengikuti acuan kolektif secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Bangsa” dipakai untuk nomina kolektif, sedangkan pronomina berikutnya dibuat jamak agar alami. Partikel “-lah” mempertahankan daya seru dan imperatif. Tanda kutip penutup dipertahankan karena ayat ini merupakan akhir kutipan yang dimulai pada konteks sebelumnya.
