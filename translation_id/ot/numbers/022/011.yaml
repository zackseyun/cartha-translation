  to: Lihatlah, bangsa yang keluar dari Mesir itu telah menutupi permukaan tanah.[a] Sekarang, datanglah dan kutuklah mereka bagiku. Barangkali aku dapat memerangi mereka dan mengusir mereka.”
  rationale: Revisi terbatas pada penghapusan kata tunjuk yang tidak ada dalam sumber dan penggantian “negeri” dengan “tanah” dalam terjemahan serta catatan kaki, agar idiom Ibrani tentang permukaan tanah diterjemahkan lebih tepat dan alami. Makna kolektif, nada mendesak, dan ketidakpastian dalam permohonan Balak tetap dipertahankan.
