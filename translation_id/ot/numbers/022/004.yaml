source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: id
  text: Lalu Moab berkata kepada para tua-tua Midian, “Sekarang kumpulan ini akan menjilat habis segala yang ada di sekeliling kita, seperti lembu menjilat habis tumbuh-tumbuhan hijau di ladang.” Pada waktu itu Balak anak Zipor adalah raja Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹאָב
  choice: Moab
  rationale: Dipertahankan sebagai nama bangsa atau negeri yang dipersonifikasikan sebagai pihak yang berbicara.
- source_word: זִקְנֵי מִדְיָן
  choice: para tua-tua Midian
  rationale: Menyampaikan bentuk jamak konstruksi secara transparan dan memakai sebutan Indonesia yang lazim untuk para pemimpin senior suatu kaum.
- source_word: הַקָּהָל
  choice: kumpulan orang ini
  rationale: Mengungkapkan kelompok besar yang berhimpun dalam konteks ini tanpa memasukkan konotasi gerejawi; kata “ini” menyampaikan daya tunjuk kontekstual.
- source_word: יְלַחֲכוּ
  choice: akan menjilat habis
  rationale: Mempertahankan gambaran harfiah akar לחך dan sekaligus menyampaikan makna penghabisan yang ditegaskan oleh perumpamaan tentang sapi.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: segala sesuatu di sekeliling kita
  rationale: Ungkapan Indonesia yang alami bagi arti harfiah “seluruh lingkungan kita,” yakni segala sesuatu di kawasan sekitar.
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: seperti sapi menjilat habis
  rationale: Mempertahankan perumpamaan pertanian dan pengulangan akar לחך dari klausa sebelumnya.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: tumbuh-tumbuhan hijau di padang
  rationale: יֶרֶק menunjuk vegetasi atau herba hijau secara lebih luas daripada rumput saja; “padang” alami untuk שָׂדֶה dalam gambaran ini.
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: Pada waktu itu Balak anak Zipor
  rationale: Waw memperkenalkan keterangan latar; dalam bahasa Indonesia, penggabungan dengan frasa waktu menghasilkan transisi naratif yang alami.
- source_word: מֶלֶךְ לְמוֹאָב
  choice: adalah raja Moab
  rationale: Padanan langsung dan alami bagi predikat yang menyatakan jabatan Balak.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Menyampaikan latar waktu naratif secara langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Citra “menjilat habis” dipertahankan karena merupakan unsur utama perumpamaan Ibrani; susunan kalimat dibuat jelas bagi pembaca umum tanpa meratakan keluasan makna יֶרֶק.
