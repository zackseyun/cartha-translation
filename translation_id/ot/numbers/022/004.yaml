  verdict: revise
  source_fidelity: 'Draf pada dasarnya setia kepada struktur dan citra Ibrani: Moab dipersonifikasikan sebagai pembicara, qahal dirender netral, dan pengulangan verba ''menjilat habis'' dipertahankan. Namun, שׁוֹר lebih tepat dirender ''lembu'' daripada ''sapi'', dan שָׂדֶה dalam konteks ini lebih langsung sebagai ''ladang'' daripada ''padang''.'
  naturalness: Bahasa draf umumnya baku dan jelas. 'Segala yang ada di sekeliling kita' sedikit lebih wajar daripada 'segala sesuatu di sekeliling kita', tanpa mengubah makna.
  terminology: Nama Moab, Midian, Balak, dan Zipor konsisten. 'Para tua-tua Midian' merupakan istilah naratif yang mapan dan sesuai. 'Kumpulan ini' mempertahankan keluasan הַקָּהָל tanpa konotasi gerejawi yang tidak diperlukan.
