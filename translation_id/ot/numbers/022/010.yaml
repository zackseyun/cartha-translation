base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: id
  text: Lalu Bileam berkata kepada Allah, “Balak anak Zipor, raja Moab, telah mengutus[a] kepadaku:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah menyuruh memanggil aku.” Secara harfiah, “telah mengutus kepada aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” wajar dalam narasi Indonesia modern.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Artikel dan konteks menunjukkan Allah yang berbicara kepada Bileam pada ayat sebelumnya; bahasa Indonesia secara wajar memakai “Allah” tanpa artikel.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: Balak anak Zipor
  rationale: Hubungan konstruksi Ibrani diterjemahkan secara langsung dan alami sebagai hubungan ayah-anak.
- source_word: מֶלֶךְ מוֹאָב
  choice: raja Moab
  rationale: Frasa konstruksi ini menerangkan jabatan Balak dan secara alami tampil sebagai aposisi tanpa kata sandang.
- source_word: שָׁלַח אֵלָי
  choice: telah mengirim utusan kepadaku
  rationale: Kata kerja perfektif menyatakan tindakan yang sudah terjadi dan masih relevan. Objek yang dikirim tidak dinyatakan dalam Ibrani, tetapi konteks menunjukkan para utusan; penambahan “utusan” diperlukan agar ungkapan Indonesia tidak disalahpahami seolah-olah Balak mengirim dirinya sendiri, sementara “kepadaku” mempertahankan arah אֵלַי.
theological_decisions:
- issue: Rujukan הָאֱלֹהִים
  choice: Allah yang esa yang dijumpai Bileam dalam konteks langsung
  alternative: seorang allah atau para dewa dalam arti umum
  rationale: Konteks langsung memperlihatkan Bileam menanggapi perjumpaan ilahi pada ayat sebelumnya. Pilihan “Allah” menyampaikan identifikasi kontekstual itu tanpa menambahkan rincian doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik dua dipertahankan karena perkataan Bileam berlanjut pada ayat berikutnya.
