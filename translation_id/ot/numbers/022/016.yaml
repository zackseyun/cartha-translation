base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: id
  text: 'Mereka datang kepada Bileam dan berkata kepadanya, “Beginilah kata Balak anak Zipor: Tolong jangan enggan datang kepadaku.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Mereka datang
  rationale: Kata בוא menyatakan gerak datang atau masuk; dalam konteks ini para utusan mendatangi Bileam.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: dan berkata kepadanya
  rationale: Mempertahankan struktur pengantar ujaran langsung dengan objek tak langsung.
- source_word: כֹּה אָמַר
  choice: Beginilah kata
  rationale: Ungkapan ini merupakan formula pembawa pesan; bentuk ini formal, alami, dan mempertahankan sudut pandang pesan yang sedang disampaikan.
- source_word: בָּלָק בֶּן צִפּוֹר
  choice: Balak anak Zipor
  rationale: Hubungan konstruksi diterjemahkan secara langsung sebagai 'anak', dengan nama-nama ditransliterasikan menurut kelaziman Indonesia.
- source_word: אַל נָא
  choice: Tolong jangan
  rationale: אַל menyatakan larangan, sedangkan נָא memberi nuansa permohonan; 'Tolong jangan' menyampaikan keduanya secara wajar.
- source_word: תִמָּנַע
  choice: menahan diri
  rationale: Kata מנע berarti menahan atau mencegah; dalam konstruksi ini bentuk refleksif Indonesia menyampaikan arti tidak membiarkan diri melakukan tindakan berikutnya.
- source_word: מֵהֲלֹךְ
  choice: untuk datang
  rationale: הלך pada dasarnya berarti pergi atau berjalan, tetapi bersama אֵלַי dan dari perspektif Balak, 'datang kepadaku' merupakan ungkapan Indonesia yang paling alami.
- source_word: אֵלָי
  choice: kepadaku
  rationale: Preposisi arah dengan sufiks orang pertama tunggal diterjemahkan langsung dan idiomatis.
