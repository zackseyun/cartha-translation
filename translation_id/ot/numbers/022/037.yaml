  to: Lalu Balak berkata kepada Bileam, “Bukankah aku benar-benar telah mengutus utusan kepadamu[a] untuk memanggilmu? Mengapa engkau tidak datang kepadaku?[b] Apakah aku benar-benar tidak sanggup memberimu kehormatan?”[c]
