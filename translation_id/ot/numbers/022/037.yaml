  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: id
  text: Lalu Balak berkata kepada Bileam, “Bukankah aku benar-benar telah mengutus utusan kepadamu[a] untuk memanggilmu? Mengapa engkau tidak datang kepadaku?[b] Apakah aku benar-benar tidak sanggup memberimu kehormatan?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bukankah aku sungguh-sungguh telah mengutus utusan kepadamu?” Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberi penegasan; dalam konteks ini, sebagian memahami penegasan itu sebagai pengutusan yang berulang-ulang atau mendesak.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Mengapa engkau tidak pergi kepadaku?”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “memberimu kehormatan” dapat mencakup pemberian imbalan atau kedudukan tinggi, bukan hanya menunjukkan rasa hormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” merupakan penghubung alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Pertanyaan retoris negatif ini mengharapkan jawaban positif, dan “Bukankah” menyampaikan daya itu secara wajar.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: sudah bersungguh-sungguh mengutus orang
  rationale: Infinitif absolut yang diikuti verba finit menegaskan tindakan mengutus. “Bersungguh-sungguh” mempertahankan penekanan tanpa memastikan bahwa pengutusan itu berulang-ulang; objek “orang” tersirat dari tindakan Balak mengirim utusan dalam konteks.
- source_word: לִקְרֹא לָךְ
  choice: untuk memanggilmu
  rationale: קרא di sini berarti memanggil atau menyuruh datang; pilihan ini dekat dengan bentuk sumber dan tetap alami.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Mengapa engkau tidak datang kepadaku?
  rationale: הלך secara harfiah berarti “pergi,” tetapi dengan אֵלָי dan dari sudut pandang Balak, “datang kepadaku” adalah ungkapan Indonesia yang idiomatis.
- source_word: הַאֻמְנָם
  choice: benar-benar
  rationale: Partikel ini menandai pertanyaan yang tegas dan bernada tidak percaya; “benar-benar” menangkap nada tersebut.
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: aku benar-benar tidak sanggup memberimu kehormatan
  rationale: יכל menyatakan kemampuan, sedangkan bentuk piel כבד berarti menghormati atau menganugerahkan kehormatan. “Memberimu kehormatan” cukup luas untuk mencakup kedudukan maupun imbalan tanpa membatasinya pada uang.
