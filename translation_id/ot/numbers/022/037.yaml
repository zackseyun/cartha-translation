translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti “engkau” dipakai dalam dialog untuk menjaga kelugasan dan register Alkitabiah yang tetap mudah dipahami. Penekanan Ibrani dipertahankan tanpa menetapkan secara pasti apakah pengutusan itu mendesak atau berulang.
