  text: וַ/יִּזְבַּ֥ח בָּלָ֖ק בָּקָ֣ר וָ/צֹ֑אן וַ/יְשַׁלַּ֣ח לְ/בִלְעָ֔ם וְ/לַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: id
  text: Lalu Balak mempersembahkan sapi dan ternak kecil sebagai kurban[a], kemudian mengirimkan sebagian kepada Bileam dan kepada para pejabat yang menyertainya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “ternak kecil” dapat mencakup domba dan kambing.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengirimkan kepada Bileam dan kepada para pejabat yang menyertainya.” Yang dikirim tidak disebutkan, tetapi konteksnya menyiratkan sebagian dari daging atau bagian kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: mempersembahkan ... sebagai kurban
  rationale: Kata זבח menunjuk pada penyembelihan dalam konteks persembahan kurban; ungkapan ini mempertahankan makna kultisnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: בָּקָר
  choice: sapi
  rationale: בקר merupakan istilah kolektif bagi hewan jenis lembu; 'sapi' alami dalam bahasa Indonesia dan tidak membatasi jenis kelamin hewan.
- source_word: צֹאן
  choice: ternak kecil
  rationale: צאן adalah istilah kolektif yang dapat mencakup domba dan kambing; 'ternak kecil' mempertahankan cakupan leksikal yang lebih luas daripada hanya 'domba'.
- source_word: וַיְשַׁלַּח
  choice: mengirimkan sebagian
  rationale: Verba Ibrani itu sendiri berarti 'mengirimkan' tanpa menyebut objek, tetapi konteks kurban menyiratkan bahwa sebagian dari hewan atau daging kurban dikirim. 'Sebagian' membuat kalimat Indonesia jelas tanpa menentukan lebih jauh daripada sumber.
- source_word: לְבִלְעָם
  choice: kepada Bileam
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: לַשָּׂרִים
  choice: kepada para pejabat
  rationale: שׂרים menunjuk kepada orang-orang berpangkat atau pejabat; pilihan ini jelas dan tidak menyiratkan bahwa mereka putra raja.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang menyertainya
  rationale: Akhiran pronominal paling wajar mengacu kepada Bileam, anteseden tunggal terdekat; bentuk pronomina tetap mempertahankan struktur dan kemungkinan rujukan dalam bahasa sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Mempersembahkan ... sebagai kurban' menjaga nuansa ritual; 'ternak kecil' mempertahankan keluasan makna צאן. Semua penanda catatan kaki ditempatkan dalam teks utama.
