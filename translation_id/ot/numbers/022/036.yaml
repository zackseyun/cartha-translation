  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: id
  text: Ketika Balak mendengar bahwa Bileam telah datang, ia keluar untuk menemuinya di Kota Moab[a], yang terletak di perbatasan Sungai Arnon, di ujung perbatasan itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah kota di Moab”. Frasa Ibrani ini dapat menunjuk pada sebuah kota tertentu yang dikenal sebagai Kota Moab, atau secara lebih umum pada sebuah kota milik wilayah Moab.
    reason: lexical_alternative
  - marker: b
    text: Atau “di ujung wilayah itu”. Kata Ibrani yang diterjemahkan “perbatasan” juga dapat berarti “wilayah” dalam konteks tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Makna dasar שׁמע adalah “mendengar”; dalam narasi ini kata tersebut secara wajar menyatakan bahwa Balak menerima kabar tanpa menambahkan cara kabar itu disampaikan.
- source_word: כִּי בָא בִלְעָם
  choice: bahwa Bileam telah datang
  rationale: 'Klausa ini menyatakan isi kabar yang didengar Balak. Bentuk “telah datang” memperjelas urutan narasi: kedatangan Bileam diberitakan, lalu Balak keluar menemuinya.'
- source_word: וַיֵּצֵא
  choice: ia keluar
  rationale: יצא berarti “keluar”; pilihan ini mempertahankan gerak Balak dari tempatnya menuju Bileam.
- source_word: לִקְרָאתוֹ
  choice: untuk menemuinya
  rationale: Ungkapan ini menyatakan gerak menuju seseorang untuk bertemu; “menemuinya” netral dan alami, tanpa menambahkan nuansa sambutan hangat atau permusuhan.
- source_word: אֶל עִיר מוֹאָב
  choice: di Kota Moab
  rationale: Dengan verba gerak, אֶל dapat menunjukkan tujuan, tetapi sesudah “keluar untuk menemuinya” bahasa Indonesia lebih alami menyatakan lokasi pertemuan dengan “di”. Frasa konstruksi ini kemungkinan menunjuk pada sebuah kota tertentu yang dikenal sebagai Kota Moab, sementara kemungkinan arti “sebuah kota di Moab” dicatat dalam catatan kaki.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: yang terletak di perbatasan Sungai Arnon
  rationale: עַל גְּבוּל menunjukkan lokasi pada atau dekat batas. Arnon adalah sungai yang berfungsi sebagai penanda perbatasan; penyebutan “Sungai” membuat rujukan geografisnya jelas dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: di ujung perbatasan itu
  rationale: קצה berarti “ujung” atau “bagian terluar”. “Perbatasan” mempertahankan pengulangan גבול dalam teks Ibrani, sedangkan “itu” menghubungkannya dengan perbatasan yang baru disebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama “Kota Moab” dipakai dalam teks utama sebagai rujukan geografis tertentu, tetapi ambiguitas frasa Ibraninya dipertahankan melalui catatan kaki. Pengulangan kata “perbatasan” sengaja dipertahankan agar mencerminkan pengulangan גבול dalam sumber.
