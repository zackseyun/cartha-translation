  to: Lalu keledai itu berkata kepada Bileam, “Bukankah aku ini keledai betinamu[a], yang kautunggangi sepanjang hidupmu sampai hari ini? Pernahkah aku biasa bertindak seperti ini terhadapmu?” Jawab Bileam, “Tidak.”
