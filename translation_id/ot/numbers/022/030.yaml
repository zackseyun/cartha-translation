base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: id
  text: Lalu keledai itu berkata kepada Bileam, “Bukankah aku ini keledai betinamu[a], yang kautunggangi sepanjang hidupmu sampai hari ini? Pernahkah aku biasa bertindak seperti ini terhadapmu?” Jawab Bileam, “Tidak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai secara khusus berarti “keledai betina”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: keledai itu / keledai betinamu
  rationale: Kata אָתוֹן secara khusus menunjuk pada keledai betina. Dalam penyebutan pertama, 'keledai itu' mengalir alami dalam narasi; pada seruan pribadi, 'keledai betinamu' mempertahankan kekhususan leksikal dan bentuk posesif.
- source_word: הֲלוֹא אָנֹכִי
  choice: Bukankah aku ini
  rationale: Bentuk ini mempertahankan pertanyaan retoris yang mengharapkan jawaban setuju serta memberi tekanan pada 'aku'.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: yang kautunggangi
  rationale: Ungkapan ini secara alami menyatakan bahwa Bileam menunggang di atas keledai tersebut; pronomina terikat pada verba sesuai bahasa Indonesia baku.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: sepanjang hidupmu sampai hari ini
  rationale: Menyampaikan idiom tentang seluruh rentang pengalaman hidup Bileam hingga saat itu tanpa terjemahan harfiah yang kaku.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: Pernahkah aku terbiasa
  rationale: Infinitif absolut bersama verba finit menegaskan gagasan kebiasaan dalam pertanyaan retoris; 'pernahkah' menangkap cakupan pengalaman hingga kini.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: berbuat seperti ini kepadamu
  rationale: כֹּה menunjuk pada perilaku keledai saat itu. 'Seperti ini' alami dalam bahasa Indonesia dan mempertahankan acuannya.
- source_word: וַיֹּאמֶר לֹא
  choice: Jawab Bileam, “Tidak.”
  rationale: Subjek disebut kembali agar rujukannya jelas dalam bahasa Indonesia, sementara jawaban singkatnya dipertahankan.
