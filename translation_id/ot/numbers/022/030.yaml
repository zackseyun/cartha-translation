    issue: Awkward habitual-action expression
    rationale: ‘Terbiasa berbuat’ can be understood, but it sounds more like being accustomed or trained to perform an action than the source’s question whether this has been the animal’s customary behavior. ‘Biasa bertindak’ is idiomatic and retains the habitual sense of הַהַסְכֵּן הִסְכַּנְתִּי.
