  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: id
  text: Ketika keledai betina itu melihat malaikat Yahweh, ia merebahkan diri di bawah Bileam. Bileam pun menjadi marah dan memukul keledai itu dengan tongkatnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן
  choice: keledai betina itu
  rationale: Kata אָתוֹן secara khusus menunjuk pada keledai betina. Bahasa Indonesia dapat menyatakannya secara alami dan jelas tanpa perlu mengandalkan pronomina bergender.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat; konteks ini jelas menggambarkan utusan adikodrati, sehingga 'malaikat' paling tepat. Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: וַתִּרְבַּץ
  choice: ia merebahkan diri
  rationale: Verba רבץ berarti berbaring atau mendekam. 'Merebahkan diri' menggambarkan tindakan keledai di bawah penunggangnya secara alami tanpa menentukan bahwa ia jatuh atau roboh.
- source_word: תַּחַת בִּלְעָם
  choice: di bawah Bileam
  rationale: תַּחַת secara langsung berarti 'di bawah' atau 'di bawah posisi'; dalam konteks ini Bileam sedang menungganginya.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Bileam pun menjadi marah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan murka yang menyala. 'Menjadi marah' menyampaikan idiom itu secara wajar, sedangkan 'pun' meneruskan rangkaian akibat dalam narasi.
- source_word: וַיַּךְ
  choice: memukul
  rationale: נכה merupakan verba umum untuk tindakan menghantam atau memukul. 'Memukul' langsung dan tidak melebihkan intensitas tindakan tunggal yang disebutkan.
- source_word: בַּמַּקֵּל
  choice: dengan tongkatnya
  rationale: מַקֵּל berarti tongkat atau batang kayu. 'Tongkatnya' alami dalam bahasa Indonesia; akhiran posesif dijelaskan oleh konteks meskipun teks Ibrani secara harfiah memakai bentuk definit 'dengan tongkat itu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama tersebut melalui transliterasi dan tidak menggantinya dengan gelar.
- issue: Makna מַלְאָךְ dalam frasa מַלְאַךְ יְהוָה
  choice: malaikat
  alternative: utusan
  rationale: Walaupun kata itu secara leksikal dapat berarti 'utusan', konteks kisah menunjukkan sosok adikodrati. Terjemahan 'malaikat' menyampaikan hal itu tanpa menetapkan lebih jauh identitas ontologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tokoh memakai bentuk Indonesia yang lazim, 'Bileam'. Tidak diperlukan catatan kaki karena jenis kelamin keledai dapat dinyatakan langsung dan ambiguitas leksikal מַלְאָךְ cukup ditangani melalui pilihan kontekstual.
