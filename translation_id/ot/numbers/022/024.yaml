base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: id
  text: Kemudian malaikat Yahweh berdiri di sebuah jalan setapak di antara kebun-kebun anggur,[a] dengan tembok di satu sisi dan tembok di sisi yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.” Kata Ibrani yang dipakai dapat berarti “utusan” atau “malaikat”, tetapi dalam konteks kisah ini makna adikodrati lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Kemudian ... berdiri
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Kemudian” menyatakannya secara alami dalam bahasa Indonesia, sedangkan “berdiri” mempertahankan arti dasar עמד.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti “utusan” atau “malaikat”; konteks kisah Bileam menunjukkan sosok adikodrati, sehingga “malaikat” paling sesuai. Nama ilahi יהוה dipertahankan sebagai “Yahweh”.
- source_word: בְּמִשְׁעוֹל
  choice: di jalan sempit
  rationale: מִשְׁעוֹל menunjuk pada jalan atau lintasan sempit; pilihan ini juga mempertahankan gambaran ruang terbatas dalam narasi.
- source_word: הַכְּרָמִים
  choice: di antara kebun-kebun anggur
  rationale: Bentuk jamaknya dipertahankan, dan “di antara” sesuai dengan tembok pada kedua sisi jalan yang disebut sesudahnya.
- source_word: גָּדֵר
  choice: tembok
  rationale: גָּדֵר berarti tembok atau pagar pembatas. “Tembok” cocok dengan konteks kebun anggur tanpa menambahkan bahan bangunan yang tidak disebutkan teks.
- source_word: מִזֶּה ... וְגָדֵר מִזֶּה
  choice: di sebelah sini dan ... di sebelah sana
  rationale: Ungkapan ini mengikuti pengulangan demonstratif Ibrani dan menggambarkan pembatas pada kedua sisi secara jelas serta alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi; “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Makna מַלְאָךְ dalam frasa מַלְאַךְ יְהוָה
  choice: malaikat
  alternative: utusan
  rationale: Kata itu secara leksikal dapat berarti keduanya, tetapi dalam konteks langsung kisah ini sosok tersebut bersifat adikodrati. Alternatif leksikal tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “kebun-kebun anggur” mempertahankan jamak eksplisit, sedangkan “tembok” tidak menambahkan keterangan bahan seperti batu.
