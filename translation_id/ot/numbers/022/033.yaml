base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: id
  text: Keledai betina itu melihat Aku dan menyimpang di hadapan-Ku tiga kali. Seandainya ia tidak menyimpang dari hadapan-Ku,[a] tentu sekarang engkau sudah Kubunuh, sedangkan dia Kubiarkan hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “barangkali ia menyimpang dari hadapan-Ku.” Klausa ini umumnya dipahami sebagai pernyataan kontrafaktual, “seandainya ia tidak menyimpang dari hadapan-Ku,” sesuai dengan konteks dan pernyataan sesudahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: melihat Aku
  rationale: Bentuk dari ראה menyatakan penglihatan langsung; “melihat Aku” merupakan padanan Indonesia yang lugas dan alami.
- source_word: הָאָתוֹן
  choice: keledai betina itu
  rationale: אָתוֹן secara khusus berarti keledai betina. Penyebutan jenis kelamin ini wajar dalam bahasa Indonesia dan selaras dengan rujukan feminin pada klausa berikutnya.
- source_word: וַתֵּט לְפָנַי
  choice: menyimpang dari hadapan-Ku
  rationale: נטה di sini berarti berbelok atau menyimpang untuk menghindar. “Dari hadapan-Ku” mengungkapkan relasi ruang dengan malaikat dan sesuai dengan konteks, meskipun לְפָנַי secara sangat harfiah dapat berarti “di hadapan-Ku.”
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: tiga kali ini
  rationale: רְגָלִים secara idiomatis menunjuk pada kejadian atau kesempatan yang berulang; “tiga kali ini” mempertahankan unsur demonstratif זֶה dengan ungkapan Indonesia yang ringkas.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Seandainya ia tidak menyimpang dari hadapan-Ku
  rationale: 'Walaupun אוּלַי biasanya berarti “barangkali,” alur narasi menuntut kondisi kontrafaktual: tindakan keledai menghindar mencegah kematian Bileam. Negasi yang tidak tertulis secara eksplisit dipasok dalam terjemahan dan dijelaskan dalam catatan kaki.'
- source_word: כִּי עַתָּה
  choice: pasti sekarang
  rationale: Dalam akibat kontrafaktual ini, frasa tersebut membawa penegasan sekaligus makna waktu; “pasti sekarang” menyampaikan keduanya secara alami.
- source_word: גַּם אֹתְכָה הָרַגְתִּי
  choice: engkau sudah Kubunuh
  rationale: Perfek Ibrani berada dalam klausa akibat kontrafaktual sehingga diterjemahkan dengan bentuk “sudah Kubunuh.” Unsur גַּם tercermin melalui penekanan kontras pada engkau dan keledai.
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: sedangkan dia Kubiarkan hidup
  rationale: Hifil חיה berarti membiarkan atau mempertahankan hidup. “Sedangkan” memperjelas kontras dengan kematian Bileam tanpa mengubah isinya.
theological_decisions:
- issue: Klausa kontrafaktual setelah אוּלַי tidak memiliki negasi eksplisit dalam teks Masoret.
  choice: “Seandainya ia tidak menyimpang dari hadapan-Ku”
  alternative: “Barangkali ia menyimpang dari hadapan-Ku”
  rationale: Pernyataan berikutnya dan alur kisah menunjukkan bahwa keledai yang menyimpang itulah yang mencegah Bileam dibunuh. Terjemahan kontrafaktual dengan negasi menyampaikan maksud kontekstual, sementara ketegangan tekstualnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada utusan ilahi mengikuti gaya teks, dan “engkau” dipakai untuk sapaan tunggal dalam konteks khidmat.
