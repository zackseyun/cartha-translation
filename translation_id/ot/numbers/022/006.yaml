  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: id
  text: Sekarang, datanglah, kumohon, dan kutuklah bangsa ini bagiku, sebab mereka lebih kuat daripada aku. Barangkali aku sanggup memukul mereka dan mengusir mereka dari negeri ini. Sebab aku tahu bahwa siapa yang kauberkati akan diberkati, dan siapa yang kaukutuk akan dikutuk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Karena itu, ... sekarang
  rationale: Menandai peralihan yang berhubungan erat dengan alasan pada ayat sebelumnya sekaligus mempertahankan desakan waktu.
- source_word: לְכָה נָּא
  choice: datanglah
  rationale: Imperatif dengan partikel permohonan; akhiran -lah menyampaikan permintaan yang mendesak secara wajar dalam bahasa Indonesia tanpa perlu menambahkan 'tolong'.
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  choice: kutuklah bangsa ini bagiku
  rationale: Mempertahankan arti langsung verba 'mengutuk', objek kolektif tunggal, dan kepentingan pribadi Balak yang dinyatakan oleh לִּי.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: sebab mereka lebih kuat daripada aku
  rationale: עָצוּם dalam konteks ancaman militer menyatakan kekuatan yang melampaui Balak; pronomina jamak Indonesia secara alami merujuk kepada bangsa kolektif itu.
- source_word: אוּלַי אוּכַל נַכֶּה בּוֹ
  choice: Barangkali aku sanggup mengalahkan mereka
  rationale: אוּלַי mempertahankan ketidakpastian, sedangkan נכה dalam konstruksi ini paling alami menyatakan tindakan memukul hingga menang; 'mengalahkan' menghindari ungkapan Indonesia yang kaku tanpa memastikan pemusnahan.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: dan mengusir mereka dari negeri ini
  rationale: גרש berarti menghalau atau mengusir. 'Negeri ini' menyampaikan wilayah yang sedang dibicarakan; kata 'ini' tersirat secara kontekstual meskipun tidak dinyatakan demonstratif dalam frasa Ibrani.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: siapa yang kauberkati akan diberkati
  rationale: Konstruksi relatif generik dipertahankan dengan 'siapa yang'; bentuk pasif/resultatif diterjemahkan 'akan diberkati' sebagai hasil yang berlaku dari tindakan Bileam.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: dan siapa yang kaukutuk akan dikutuk
  rationale: Mempertahankan paralelisme berkat-kutuk dan bentuk pasif yang menyatakan berlakunya kutukan.
theological_decisions:
- issue: Daya efektif berkat dan kutuk Bileam
  choice: Mempertahankan klaim Balak secara langsung tanpa mengesahkannya sebagai penilaian narator
  alternative: Menjelaskan bahwa Balak hanya percaya atau menganggap berkat dan kutuk Bileam efektif
  rationale: Teks merupakan ucapan Balak dan sengaja menyajikan keyakinannya; penjelasan tambahan akan menyelesaikan ketegangan teologis yang tidak diselesaikan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kauberkati' dan 'kaukutuk' mengikuti ejaan baku untuk pronomina terikat. Pronomina jamak 'mereka' dipakai secara alami untuk merujuk kepada הָעָם sebagai nomina kolektif.
