id: NUM.22.22
reference: Numbers 22:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: id
  text: Namun, murka Allah menyala karena ia pergi, lalu malaikat Yahweh berdiri menghadangnya di jalan sebagai penentangnya.[a] Ia sedang menunggangi keledai betinanya,[b] dan kedua pelayannya menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שָׂטָן (satan) di sini berarti “penentang” atau “lawan”, bukan harus dipahami sebagai nama diri Satan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai secara khusus menunjuk kepada keledai betina.
    reason: lexical_precision
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: murka Allah menyala
  rationale: Mempertahankan gambaran hidup dalam idiom Ibrani tentang murka yang menyala, sekaligus tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: karena ia pergi
  rationale: כִּי menyatakan alasan, sedangkan bentuk partisip הוֹלֵךְ menggambarkan tindakan yang sedang berlangsung. Terjemahan ini mempertahankan ketegangan konteks tanpa menjelaskan alasan murka Allah lebih jauh daripada teks.
- source_word: וַיִּתְיַצֵּב
  choice: berdiri menghadangnya
  rationale: Bentuk hitpael menunjukkan tindakan sengaja mengambil posisi. 'Berdiri menghadangnya' menyampaikan baik posisi maupun maksud konfrontatifnya secara alami.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: Dalam konteks ini מַלְאַךְ menunjuk kepada utusan surgawi, dan nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: בַּדֶּרֶךְ
  choice: di jalan
  rationale: Menunjukkan lokasi konkret tempat malaikat itu mengambil posisi di jalur perjalanan Bileam.
- source_word: לְשָׂטָן לוֹ
  choice: sebagai penentangnya
  rationale: Mempertahankan fungsi nominal שָׂטָן sebagai 'penentang' atau 'lawan' dan tidak mengubahnya menjadi nama diri Satan.
- source_word: וְהוּא רֹכֵב
  choice: Ia sedang menunggangi
  rationale: Bentuk partisip menyajikan keadaan latar yang sedang berlangsung; aspek progresif dinyatakan dengan 'sedang'.
- source_word: אֲתֹנוֹ
  choice: keledai betinanya
  rationale: Kata אָתוֹן secara khusus berarti keledai betina; bahasa Indonesia dapat menyatakannya dengan jelas tanpa terdengar janggal.
- source_word: שְׁנֵי נְעָרָיו
  choice: kedua pelayannya
  rationale: Dalam konteks perjalanan, נְעָרִים dapat menunjuk kepada orang-orang muda yang melayani atau mendampingi seseorang. 'Pelayan' paling alami dalam bahasa Indonesia, sementara alternatif harfiahnya dicatat.
- source_word: עִמּוֹ
  choice: menyertainya
  rationale: Menyampaikan bahwa kedua pelayan itu berada bersama Bileam dalam perjalanan dengan kalimat Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Makna שָׂטָן dalam konteks ini
  choice: 'kata benda umum: ''penentang'''
  alternative: 'nama diri atau gelar: ''Satan'''
  rationale: Dalam Bilangan 22:22, kata itu menerangkan peran malaikat Yahweh yang menghadang Bileam. Tata bahasa dan konteks tidak mengharuskan pengertian nama diri.
- issue: Penyebutan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi itu tanpa menggantinya dengan gelar.
- issue: Alasan murka Allah meskipun Bileam pergi setelah mendapat izin
  choice: mempertahankan pernyataan 'karena ia pergi' tanpa harmonisasi
  alternative: menambahkan bahwa Bileam pergi dengan niat yang salah atau bertentangan dengan kehendak Allah
  rationale: Ayat ini sendiri tidak menyatakan alasan tambahan tersebut. Terjemahan mempertahankan ketegangan naratif dan teologis sebagaimana terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ungkapan 'murka Allah menyala' mempertahankan citra Ibrani; 'berdiri menghadangnya' menghindari kekakuan terjemahan harfiah; dan pronomina dibiarkan mengikuti teks sumber tanpa menambahkan nama Bileam.
