  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְב֣וֹת מוֹאָ֔ב מֵ/עֵ֖בֶר לְ/יַרְדֵּ֥ן יְרֵחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: id
  text: Kemudian orang Israel berangkat dan berkemah di dataran Moab[a], di seberang Sungai Yordan, berhadapan dengan Yerikho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani ini merupakan sebutan umum bagi bangsa Israel.
    reason: lexical_alternative
  - marker: b
    text: Yerikho menjadi titik acuan bagi lokasi dataran Moab di sisi timur Sungai Yordan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Dalam kisah perjalanan di padang gurun, נסע menunjukkan tindakan meninggalkan tempat perkemahan dan melanjutkan perjalanan. 'Berangkat' alami dalam bahasa Indonesia modern.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi merupakan sebutan kebangsaan yang lazim bagi bangsa Israel secara keseluruhan. 'Orang Israel' menyampaikan fungsi kolektifnya secara alami tanpa membatasi rujukan hanya kepada laki-laki.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: חנה berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan modern yang lugas.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: di dataran Moab
  rationale: עַרְבוֹת menunjuk pada kawasan dataran atau stepa. 'Dataran Moab' jelas, ringkas, dan merupakan sebutan geografis yang wajar.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini menunjukkan wilayah di seberang Yordan dari sudut pandang geografis narator. 'Di seberang' mempertahankan kerelatifan sudut pandang tersebut; 'Sungai' ditambahkan sebagai penjelasan alamiah nama geografis dalam bahasa Indonesia.
- source_word: יְרֵחוֹ
  choice: berhadapan dengan Yerikho
  rationale: Yerikho berfungsi sebagai titik acuan untuk lokasi perkemahan di sisi timur Yordan. 'Berhadapan dengan' menyatakan hubungan geografis itu dengan lebih tepat daripada 'di Yerikho', yang dapat menyiratkan bahwa mereka berada di kota tersebut.
