base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: id
  text: Pada bulan ketujuh, pada hari pertama bulan itu, adakanlah pertemuan kudus. Jangan lakukan pekerjaan berat apa pun. Hari tiupan sangkakala[a] itu bagi kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hari sorak-sorai” atau “hari pekik aklamasi.” Kata Ibrani teru‘ah menunjuk pada bunyi keras yang dapat berupa tiupan sangkakala, pekik, atau sorak aklamasi, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הַ/שְּׁבִיעִי
  choice: Pada bulan ketujuh
  rationale: Preposisi ב menyatakan waktu. Kata penghubung ו tidak perlu diterjemahkan secara tersendiri karena pembukaan dengan “Dan” kurang alami dalam bahasa Indonesia, sedangkan kesinambungan hukum tetap jelas dari konteks.
- source_word: בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: pada hari pertama bulan itu
  rationale: Ungkapan kalender Ibrani ini secara idiomatis berarti hari pertama dalam bulan tersebut.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Frasa kultis ini menunjuk pada pertemuan suci yang diserukan atau ditetapkan; “pertemuan kudus” alami dan tetap dekat dengan bentuk sumber.
- source_word: יִהְיֶה לָ/כֶם
  choice: adakanlah
  rationale: Dalam klausa tentang pertemuan, konstruksi harfiah “akan ada bagimu” dinyatakan sebagai perintah yang alami dalam bahasa Indonesia tanpa mengubah daya wajib ketentuan itu.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ
  choice: Jangan lakukan pekerjaan berat apa pun
  rationale: Frasa ini melarang pekerjaan biasa yang bersifat kerja-pelayanan pada hari raya, bukan setiap kegiatan tanpa kecuali. “Pekerjaan berat” mempertahankan pembatas tersebut, dan “apa pun” mencerminkan כָּל.
- source_word: יוֹם תְּרוּעָה
  choice: hari bunyi sangkakala
  rationale: תְּרוּעָה menunjuk pada bunyi keras atau tanda bunyi dan tidak menyebut alat musik secara eksplisit. Dalam konteks ibadah kalender ini, bunyi sangkakala merupakan padanan kontekstual yang tepat, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: יִהְיֶה לָ/כֶם
  choice: Hari itu harus menjadi ... bagimu
  rationale: Konstruksi ini menyatakan sifat hari yang ditetapkan bagi umat. “Harus menjadi ... bagimu” mempertahankan daya normatif dan unsur לָכֶם.
theological_decisions:
- issue: Sebutan perayaan יוֹם תְּרוּעָה
  choice: hari bunyi sangkakala
  alternative: hari sorak-sorai atau pekik aklamasi
  rationale: Teks menamai hari itu menurut bunyi khasnya, bukan memakai nama perayaan dari tradisi yang lebih kemudian. Karena תְּרוּעָה dapat menunjuk pada bunyi sangkakala, pekik, atau sorak aklamasi, alternatif leksikal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-liturgis yang bermartabat. Bentuk jamak orang kedua dalam bahasa Ibrani dinyatakan melalui konstruksi perintah umum yang alami dalam bahasa Indonesia. Istilah tradisional yang berasal dari masa lebih kemudian tidak dimasukkan ke dalam teks utama.
