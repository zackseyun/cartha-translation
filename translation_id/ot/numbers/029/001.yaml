  source_fidelity: 'Terjemahan secara umum mengikuti susunan dan isi Ibrani dengan baik: penanggalan, pertemuan kudus, larangan melakukan pekerjaan, dan penetapan יוֹם תְּרוּעָה semuanya terwakili. Namun, frasa utama “hari bunyi sangkakala” kurang idiomatis dalam bahasa Indonesia. “Tiupan sangkakala” lebih alami sebagai padanan bunyi ritual yang dimaksud, sambil catatan kaki tetap menjaga keluasan makna תְּרוּעָה.'
