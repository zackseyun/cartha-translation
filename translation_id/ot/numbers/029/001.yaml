  terminology: “Pertemuan kudus” merupakan padanan yang layak untuk מִקְרָא קֹדֶשׁ. “Pekerjaan berat” memadai untuk מְלֶאכֶת עֲבֹדָה dalam konteks larangan kerja hari raya. Untuk תְּרוּעָה, “tiupan sangkakala” adalah pilihan kontekstual yang wajar, tetapi tidak boleh diperlakukan sebagai satu-satunya makna leksikal; catatan kaki yang direvisi mempertahankan alternatif “sorak-sorai” dan “pekik aklamasi.”
