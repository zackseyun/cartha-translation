base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/025.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: id
  text: dan seekor kambing jantan sebagai kurban penghapus dosa, di samping kurban bakaran tetap[a], beserta kurban sajian dan kurban curahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban bakaran yang terus-menerus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: dan seekor kambing jantan
  rationale: Ungkapan ini menunjuk pada seekor kambing jantan untuk kurban; bentuk 'seekor' menyatakan jumlah secara alami dalam bahasa Indonesia.
- source_word: חַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks ritual, kata ini menyebut jenis kurban, bukan dosa sebagai konsep abstrak. Istilah ini jelas dan lazim dipahami dalam bahasa Indonesia.
- source_word: מִ/לְּ/בַד
  choice: di samping
  rationale: Ungkapan ini menandakan bahwa kurban tersebut dipersembahkan sebagai tambahan pada kurban yang sudah diwajibkan.
- source_word: עֹלַת הַ/תָּמִיד
  choice: kurban bakaran tetap
  rationale: Kata תָּמִיד menunjuk pada kurban yang dipersembahkan secara teratur dan berkelanjutan. 'Tetap' mempertahankan cakupan itu tanpa mempersempitnya menjadi hanya 'harian'.
- source_word: מִנְחָתָהּ
  choice: kurban sajian
  rationale: Dalam daftar ritual keimaman, מִנְחָה menunjuk pada persembahan berbahan hasil bumi yang menyertai kurban bakaran.
- source_word: וְ/נִסְכָּהּ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ adalah persembahan minuman yang dicurahkan. Akhiran pronominal dipertahankan dengan '-nya' untuk menunjukkan kaitannya dengan kurban bakaran tetap.
theological_decisions: []
