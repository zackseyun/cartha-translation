  text: וּ/בַ/יּ֧וֹם הַ/שִּׁשִּׁ֛י פָּרִ֥ים שְׁמֹנָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: id
  text: 'Pada hari keenam: delapan ekor sapi jantan, dua ekor domba jantan, dan empat belas ekor anak domba jantan berumur setahun, semuanya tidak bercacat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: Pada hari keenam
  rationale: Ungkapan ini melanjutkan urutan persembahan harian. Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya sudah jelas tanpa harus menerjemahkan וּ secara tersendiri sebagai “dan”.
- source_word: פָּרִים שְׁמֹנָה
  choice: delapan ekor sapi jantan
  rationale: Dalam konteks kurban, פָּרִים menunjuk pada sapi jantan; teks tidak menyatakan umurnya, sehingga unsur “muda” tidak ditambahkan.
- source_word: אֵילִם שְׁנָיִם
  choice: dua ekor domba jantan
  rationale: אֵילִם adalah istilah lazim untuk domba jantan dewasa, khususnya dalam konteks persembahan.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: empat belas ekor anak domba jantan
  rationale: כֶּבֶשׂ adalah anak domba dan bentuk maskulinnya mendukung penyebutan “jantan”; kata penggolong “ekor” menghasilkan bahasa Indonesia yang alami.
- source_word: בְּנֵי שָׁנָה
  choice: berumur setahun
  rationale: Ini adalah padanan idiomatis dan tepat bagi ungkapan Ibrani yang menyatakan usia hewan satu tahun.
- source_word: תְּמִימִם
  choice: semuanya tidak bercacat
  rationale: Dalam peraturan kurban, kata ini berarti bebas dari cacat. “Semuanya” memperjelas bahwa bentuk jamak tersebut menerangkan seluruh anak domba yang baru disebut, sesuai susunan langsung bahasa Ibrani.
