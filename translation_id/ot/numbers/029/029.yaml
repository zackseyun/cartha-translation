translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik dua mempertahankan bentuk daftar eliptis teks sumber. Kata penggolong “ekor” digunakan secara konsisten agar daftar hewan terdengar alami.
