  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: id
  text: dan seekor kambing jantan sebagai kurban penghapus dosa, di samping kurban bakaran rutin[a] beserta persembahan sajiannya dan persembahan-persembahan curahannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban bakaran yang terus-menerus.”
    reason: lexical_alternative
  - marker: b
    text: “Persembahan-persembahan curahan” juga dapat diterjemahkan “persembahan-persembahan minuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר
  choice: kambing jantan
  rationale: Dalam konteks kurban, kata ini menunjuk pada kambing, biasanya kambing jantan; penyebutan jenis kelaminnya mempertahankan ketepatan makna sumber.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks ibadah ini, kata tersebut menunjuk pada kurban yang dipersembahkan berkenaan dengan dosa, bukan pada dosa sebagai konsep abstrak.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan satu dinyatakan secara alami dalam bahasa Indonesia melalui penggolong untuk hewan.
- source_word: מִלְּבַד
  choice: di samping
  rationale: Ungkapan ini menunjukkan bahwa kurban yang disebutkan merupakan tambahan pada kurban bakaran rutin.
- source_word: עֹלַת הַתָּמִיד
  choice: kurban bakaran rutin
  rationale: Frasa ini menunjuk pada kurban bakaran yang dipersembahkan secara tetap dan berulang; 'rutin' alami dan jelas bagi pembaca modern.
- source_word: מִנְחָתָהּ
  choice: kurban sajian
  rationale: Dalam daftar kurban, מִנְחָה adalah persembahan pendamping berupa bahan pangan; 'kurban sajian' mempertahankan istilah kultis tanpa membatasi secara berlebihan pada satu bahan.
- source_word: וּנְסָכֶיהָ
  choice: kurban-kurban curahannya
  rationale: Bentuk jamak נְסָכִים menunjuk pada persembahan cair yang dicurahkan; akhiran pronominalnya merujuk pada kurban bakaran.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban karena dosa
  rationale: Pilihan utama menyatakan fungsi kultis istilah tersebut tanpa menjadikannya sekadar sebutan bagi dosa, tetapi tidak merinci teori tertentu tentang cara penghapusan dosa terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Penanda catatan kaki ditempatkan pada istilah yang benar-benar dijelaskan; susunan mengikuti alur teks Ibrani sambil tetap alami dalam bahasa Indonesia.
