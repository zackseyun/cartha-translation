  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: id
  text: 'Dan pada hari ketujuh: tujuh ekor sapi jantan, dua ekor domba jantan, dan empat belas ekor anak domba berumur setahun yang tidak bercacat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: Dan pada hari ketujuh
  rationale: Mempertahankan penghubung וּ dengan rangkaian hari sebelumnya, sedangkan בַיּוֹם secara alami diterjemahkan 'pada hari' dan הַשְּׁבִיעִי sebagai 'ketujuh'.
- source_word: פָּרִים שִׁבְעָה
  choice: tujuh ekor sapi jantan
  rationale: Dalam konteks persembahan korban, פָּרִים menunjuk kepada sapi jantan; kata penggolong 'ekor' menghasilkan bahasa Indonesia yang wajar.
- source_word: אֵילִם שְׁנָיִם
  choice: dua ekor domba jantan
  rationale: אֵילִם secara khusus berarti domba jantan dewasa, dibedakan dari anak domba dalam unsur berikutnya.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: empat belas ekor anak domba berumur setahun
  rationale: כְּבָשִׂים berarti anak-anak domba, dan ungkapan harfiah 'anak-anak setahun' menyatakan usia satu tahun.
- source_word: תְּמִימִם
  choice: yang tidak bercacat
  rationale: Dalam konteks korban, תְּמִימִם menyatakan bahwa hewan bebas dari cacat; 'tidak bercacat' menyampaikan syarat ritual ini dengan jelas tanpa memakai kata umum 'sempurna'.
theological_decisions:
- issue: Cakupan kata תְּמִימִם
  choice: Diletakkan sesudah 'anak domba' sehingga secara gramatikal menerangkan anak-anak domba.
  alternative: Memahami syarat tidak bercacat sebagai ketentuan bagi seluruh hewan dalam daftar.
  rationale: Dalam susunan Ibrani ayat ini, תְּמִימִם berjenis dan berjumlah sama dengan כְּבָשִׂים serta langsung mengikutinya. Terjemahan mempertahankan hubungan sintaksis tersebut tanpa meniadakan ketentuan korban yang lebih luas dalam konteks Taurat.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik dua mempertahankan bentuk daftar persembahan dalam teks Ibrani. Penggunaan 'ekor' alami bagi pembaca modern dan tidak menambahkan informasi teologis.
