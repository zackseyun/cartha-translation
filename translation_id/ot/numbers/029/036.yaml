  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: id
  text: 'Kalian harus mempersembahkan kurban bakaran, persembahan yang dibakar, dengan aroma yang menyenangkan[a] bagi Yahweh: seekor sapi jantan, seekor domba jantan, dan tujuh ekor anak domba berumur satu tahun yang tidak bercacat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "aroma yang menenangkan." Frasa Ibrani ini adalah ungkapan tetap dalam konteks kurban, yang menyatakan bahwa persembahan itu berkenan kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sebagai persembahan; 'mempersembahkan' paling alami dan tepat dalam bahasa Indonesia.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada kurban yang seluruhnya dibakar; 'kurban bakaran' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: אִשֵּׁה
  choice: persembahan yang dibakar
  rationale: Kata ini menunjuk pada persembahan yang diserahkan melalui api. Ungkapan ini mempertahankan cara persembahannya tanpa menafsirkannya secara lebih sempit sebagai makanan.
- source_word: רֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  rationale: Ungkapan kurban yang tetap ini menyatakan bahwa persembahan tersebut berkenan kepada Allah, sambil mempertahankan citra aroma dalam teks Ibrani.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai arah atau penerima persembahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: פַּר אֶחָד
  choice: seekor sapi jantan
  rationale: פַּר adalah sapi jantan dari kawanan lembu; teks tidak mengharuskan penambahan keterangan 'muda'.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל adalah istilah baku untuk domba jantan dalam daftar kurban.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: tujuh ekor anak domba berumur satu tahun
  rationale: Frasa harfiahnya berarti 'tujuh anak domba, anak-anak satu tahun'; pilihan ini menyampaikan persyaratan umur secara alami tanpa menambahkan jenis kelamin yang tidak dituntut teks.
- source_word: תְּמִימִם
  choice: yang tidak bercacat
  rationale: Dalam konteks kurban, kata ini berarti bebas dari cacat fisik dan layak dipersembahkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi perjanjian dan mengikuti keputusan yang diberikan tanpa menggantinya dengan gelar.
- issue: Makna רֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  alternative: aroma yang menenangkan; persembahan yang berkenan
  rationale: Terjemahan mempertahankan metafora antropomorfis dan ketegangan teologis teks, tanpa mereduksinya menjadi pernyataan abstrak tentang penerimaan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar dipertahankan dengan jelas; istilah ritual dibuat mudah dipahami tanpa menghilangkan citra konkret teks Ibrani.
