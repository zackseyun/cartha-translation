  text: and one-tenth for each lamb[a], for the seven lambs.
translation:
  language: id
  text: dan sepersepuluh untuk setiap anak domba dari ketujuh anak domba itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “sepersepuluh”; dalam konteks persembahan ini biasanya berarti sepersepuluh efa.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: dan sepersepuluh
  rationale: Frasa ini secara harfiah menyatakan satu bagian sepersepuluh. Karena teks Ibrani tidak menyebutkan satuannya dalam ayat ini, teks utama mempertahankan bentuk ringkas tersebut.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk setiap anak domba
  rationale: Secara harfiah, 'untuk anak domba yang satu'; dalam daftar persembahan, ungkapan ini berfungsi distributif, yakni takaran itu berlaku bagi masing-masing anak domba.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: untuk ketujuh anak domba itu
  rationale: Frasa ini menunjuk kepada kelompok tertentu yang terdiri atas tujuh anak domba yang telah disebut dalam konteks. Bentuk 'ketujuh ... itu' mempertahankan jumlah dan sifat definitnya secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Istilah 'sepersepuluh' mempertahankan ketidaklengkapan satuan dalam teks Ibrani, sedangkan catatan kaki memberi konteks ukuran tanpa menambahkannya ke dalam teks utama.
