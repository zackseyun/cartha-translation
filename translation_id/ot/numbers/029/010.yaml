lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: sepersepuluh efa
  rationale: Pengulangan nomina berfungsi distributif dalam peraturan kurban. Dalam konteks ini, עִשָּׂרוֹן adalah takaran bahan sajian berupa sepersepuluh efa; penyebutan 'efa' membuat satuannya jelas dalam bahasa Indonesia.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk setiap anak domba
  rationale: Secara harfiah, 'untuk anak domba yang satu'; dalam daftar persembahan, frasa ini menyatakan pembagian bagi tiap-tiap hewan.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: bagi ketujuh anak domba itu
  rationale: Artikel Ibrani mengacu kepada kelompok tujuh anak domba yang telah disebutkan, sedangkan 'ketujuh' mempertahankan jumlah dan keterkaitan kelompok tersebut.
