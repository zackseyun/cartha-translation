  rationale: 'Revisi memperbaiki kelancaran bahasa Indonesia dan menyelaraskan struktur dengan Ibrani: konjungsi pembuka dipertahankan, kedua persembahan dinyatakan sebagai milik mereka, dan daftar hewan tidak diberi penunjuk tambahan yang tidak merata. Frasa akhir "ketentuan yang berlaku bagi masing-masing" mempertahankan sufiks jamak pada כְּמִשְׁפָּטָם dan tidak memutuskan secara sempit apakah acuannya setiap hewan atau setiap kategori kurban. Catatan kaki mempertahankan rumusan yang lebih singkat sebagai alternatif.'
