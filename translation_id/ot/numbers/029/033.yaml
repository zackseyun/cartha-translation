  terminology: '"Persembahan sajian" dan "persembahan curahan" membedakan מִנְחָה dan נֶסֶךְ dengan jelas dalam register ritual. "Sapi jantan," "domba jantan," dan "anak domba" setia pada istilah Ibrani tanpa menambahkan usia atau jenis kelamin pada כְּבָשִׂים.'
