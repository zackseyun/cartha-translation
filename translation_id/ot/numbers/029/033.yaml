  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: id
  text: Dan persembahan sajian mereka serta persembahan curahan mereka bagi sapi jantan, domba jantan, dan anak domba, sesuai dengan jumlahnya, menurut ketentuan yang berlaku bagi masing-masing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sesuai dengan jumlahnya, menurut ketentuannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kurban sajian
  rationale: Dalam konteks kurban, מִנְחָה menunjuk pada persembahan dari hasil biji-bijian yang menyertai kurban bakaran. Bentuk tunggal kolektif dipertahankan secara alami dalam bahasa Indonesia.
- source_word: נִסְכֵּיהֶם
  choice: kurban-kurban curahannya
  rationale: נֶסֶךְ ialah persembahan cair yang dicurahkan; bentuk jamak Ibrani tercermin dalam pengulangan nomina bahasa Indonesia.
- source_word: לַפָּרִים
  choice: untuk sapi-sapi jantan
  rationale: פָּר dalam daftar kurban berarti sapi jantan; teks tidak secara eksplisit menambahkan keterangan usia.
- source_word: לָאֵילִם
  choice: domba-domba jantan
  rationale: אַיִל dalam konteks kurban secara langsung berarti domba jantan.
- source_word: וְלַכְּבָשִׂים
  choice: dan anak-anak domba itu
  rationale: כֶּבֶשׂ berarti anak domba. Jenis kelaminnya tidak dibuat eksplisit karena istilah sumber di sini cukup diterjemahkan secara umum, sedangkan penunjuk 'itu' menghubungkannya dengan hewan-hewan yang telah disebut.
- source_word: בְּמִסְפָּרָם
  choice: sesuai dengan jumlahnya
  rationale: Frasa ini menyatakan kesesuaian persembahan pengiring dengan jumlah hewan kurban yang ditetapkan.
- source_word: כְּמִשְׁפָּטָם
  choice: menurut ketentuan bagi masing-masing
  rationale: מִשְׁפָּט di sini menunjuk pada tata ketentuan ritual yang berlaku. Sufiks jamak dipertahankan tanpa memaksakan apakah acuannya terutama hewan atau jenis persembahannya.
theological_decisions:
- issue: Acuan sufiks jamak pada כְּמִשְׁפָּטָם
  choice: menurut ketentuan bagi masing-masing
  alternative: menurut ketentuannya; menurut ketetapan
  rationale: Bahasa Ibrani memakai sufiks orang ketiga jamak, sehingga terjemahan sebaiknya tidak menghapusnya menjadi satu ketetapan yang sepenuhnya tak beracuan. Rumusan ini mempertahankan gagasan bahwa ketentuan yang berlaku berkaitan dengan masing-masing hewan atau jenis kurban, sambil menghindari penentuan acuan yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada liturgis tanpa menjadi arkais. Istilah 'kurban sajian' dan 'kurban curahan' dipakai agar jenis persembahan mudah dibedakan. Penanda catatan kaki ditempatkan pada akhir frasa yang memiliki alternatif terjemahan.
