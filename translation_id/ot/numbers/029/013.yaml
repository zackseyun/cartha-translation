  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: id
  text: 'Kamu harus mempersembahkan kurban bakaran, persembahan yang dibakar dengan api, sebagai aroma yang menyenangkan[a] bagi Yahweh: tiga belas ekor lembu jantan dari kawanan, dua ekor domba jantan, dan empat belas ekor anak domba jantan berumur satu tahun. Semuanya harus tanpa cacat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aroma yang menenteramkan” atau “aroma yang harum.” Ungkapan Ibrani ini menyatakan bahwa persembahan itu berkenan kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Kamu harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sebagai persembahan; 'mempersembahkan' alami dan tepat dalam bahasa Indonesia.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan jelas untuk kurban yang seluruhnya dibakar di atas mazbah.
- source_word: אִשֵּׁה
  choice: kurban yang dibakar
  rationale: Menunjukkan persembahan yang diserahkan melalui api, sekaligus menghindari ungkapan 'kurban api' yang kurang alami.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Menyampaikan idiom tentang kurban yang berkenan kepada Allah tanpa meniadakan gambaran aroma dalam teks sumber.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mempertahankan nama perjanjian ilahi yang ditulis dengan Tetragramaton.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: sapi jantan dari kawanan
  rationale: Mempertahankan jenis kelamin dan klasifikasi ternak tanpa menyimpulkan bahwa hewan-hewan itu masih muda.
- source_word: אֵילִם
  choice: domba jantan
  rationale: Padanan langsung bagi domba jantan dewasa dalam daftar kurban.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: anak domba jantan berumur satu tahun
  rationale: Mempertahankan jenis kelamin gramatikal-leksikal dan keterangan umur secara eksplisit.
- source_word: תְּמִימִם
  choice: tidak bercacat
  rationale: Dalam konteks kurban, kata ini menunjuk pada hewan yang bebas dari cacat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan fungsinya sebagai nama perjanjian.
- issue: Makna רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenteramkan
  rationale: Pilihan utama menjaga metafora indrawi sekaligus menyatakan bahwa persembahan itu berkenan; tidak dimaksudkan untuk mereduksi ungkapan tersebut menjadi penciuman ilahi secara harfiah semata.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Struktur daftar hewan dibuat alami, sedangkan pengulangan istilah kurban dan gambaran aroma dari bahasa Ibrani tetap dipertahankan.
