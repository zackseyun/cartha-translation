  to: 'Kamu harus mempersembahkan kurban bakaran, persembahan yang dibakar dengan api, sebagai aroma yang menyenangkan[a] bagi Yahweh: tiga belas ekor lembu jantan dari kawanan, dua ekor domba jantan, dan empat belas ekor anak domba jantan berumur satu tahun. Semuanya harus tanpa cacat.'
  rationale: Revisi memperbaiki sintaksis agar “persembahan yang dibakar dengan api” dan “aroma yang menyenangkan” sama-sama menerangkan kurban bakaran, mempertahankan seluruh rincian daftar hewan, dan memakai ungkapan Indonesia modern yang lebih alami. Catatan kaki ditempatkan pada idiom רֵיחַ נִיחֹחַ untuk mempertahankan alternatif leksikal tanpa memaksakan satu penafsiran atas nuansanya.
