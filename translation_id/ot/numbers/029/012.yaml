  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: id
  text: Pada hari kelima belas bulan ketujuh, kamu harus mengadakan pertemuan kudus. Janganlah kamu melakukan pekerjaan sehari-hari apa pun. Kamu harus merayakan hari raya bagi Yahweh selama tujuh hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Pada hari kelima belas
  rationale: Ungkapan kalender Ibrani ini secara alami diterjemahkan dengan menyebut 'hari'; waw tidak perlu diterjemahkan sebagai 'dan' pada awal ayat dalam bahasa Indonesia.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: bulan ketujuh
  rationale: Menunjukkan bulan yang menjadi tempat hari kelima belas itu; susunan ini alami dalam bahasa Indonesia.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Istilah ini menunjuk pada pertemuan sakral yang diserukan secara resmi; 'pertemuan kudus' jelas, wajar, dan tetap mempertahankan nuansa keagamaan.
- source_word: יִהְיֶה לָכֶם
  choice: kamu harus mengadakan
  rationale: Secara harfiah 'akan ada bagimu'; dalam konteks perintah perayaan, 'harus mengadakan' menyampaikan kewajiban itu secara alami.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan sehari-hari apa pun
  rationale: Merujuk pada pekerjaan rutin atau pekerjaan mata pencaharian yang dilarang pada hari kudus, bukan setiap bentuk aktivitas tanpa kecuali.
- source_word: לֹא תַעֲשׂוּ
  choice: Janganlah kamu melakukan
  rationale: Mempertahankan daya larangan hukum dengan bentuk Indonesia yang tegas dan bermartabat.
- source_word: וְחַגֹּתֶם חַג
  choice: Kamu harus merayakan perayaan
  rationale: Konstruksi verba-nomina serumpun menekankan pelaksanaan suatu hari raya; pengulangan ini sedikit dipertahankan untuk mencerminkan bentuk sumber tanpa menjadi sukar dipahami.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi menunjukkan bahwa perayaan itu ditujukan kepada atau diadakan untuk menghormati Yahweh.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Menjelaskan durasi perayaan secara eksplisit dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan selaras dengan lapisan konsultasi POB yang telah diperbarui.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-liturgis yang tetap mudah dimengerti. Bentuk jamak orang kedua diterjemahkan dengan 'kamu' sesuai kebiasaan bahasa Indonesia; konteks menunjukkan bahwa seluruh umat disapa.
