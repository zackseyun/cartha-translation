  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: id
  text: dan satu ekor kambing jantan sebagai kurban penghapus dosa[a], di samping kurban bakaran tetap beserta kurban sajiannya dan kurban curahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa ini menunjuk kepada kambing jantan untuk kurban; penggolong 'seekor' dan keterangan jenis kelamin menghasilkan bahasa Indonesia yang alami sekaligus tepat.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan satu dinyatakan secara idiomatis melalui penggolong tunggal 'seekor'; tidak perlu menambahkan 'satu' karena jumlahnya sudah jelas.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks peribadatan, kata ini menunjuk kepada jenis kurban, bukan dosa sebagai konsep abstrak. Pilihan ini dikenal luas, sedangkan kemungkinan fungsi pemurnian dipertahankan dalam catatan kaki.
- source_word: מִלְּבַד
  choice: di samping
  rationale: Menandakan bahwa kurban tersebut diberikan sebagai tambahan pada kurban yang tetap diwajibkan.
- source_word: עֹלַת הַתָּמִיד
  choice: kurban bakaran tetap
  rationale: Menunjuk kepada kurban bakaran yang dipersembahkan secara teratur dan berulang menurut ketetapan.
- source_word: מִנְחָתָהּ
  choice: beserta kurban sajiannya
  rationale: Dalam konteks kurban, מִנְחָה adalah persembahan bahan pangan yang menyertai kurban bakaran; akhiran feminin tunggal merujuk kepada עֹלָה.
- source_word: וְנִסְכָּהּ
  choice: dan kurban curahannya
  rationale: Menunjuk kepada persembahan cair yang dicurahkan untuk menyertai kurban bakaran; akhiran posesifnya dipertahankan.
theological_decisions:
- issue: Makna kultis חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Terjemahan utama memakai istilah Indonesia yang paling dikenal tanpa menutup kemungkinan bahwa istilah Ibrani menekankan fungsi pemurnian; alternatif itu dicatat secara terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Istilah kurban dibuat konsisten, sedangkan bentuk posesif pada dua persembahan pendamping mempertahankan hubungannya dengan kurban bakaran tetap.
