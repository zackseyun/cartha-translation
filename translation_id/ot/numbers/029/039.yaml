id: NUM.29.39
reference: Numbers 29:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: id
  text: Semua ini harus kalian persembahkan kepada Yahweh pada waktu-waktu yang telah ditetapkan bagi kalian, di samping persembahan nazar dan persembahan sukarela kalian, yakni kurban bakaran, persembahan sajian, persembahan curahan, dan kurban keselamatan[a] kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan.” Istilah Ibrani ini menunjuk pada kategori kurban yang berkaitan dengan damai, keutuhan, dan kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Semua ini
  rationale: Kata tunjuk jamak ini merujuk kembali kepada rangkaian persembahan hari raya yang diperintahkan dalam konteks sebelumnya.
- source_word: תַּעֲשׂוּ
  choice: harus kalian persembahkan
  rationale: Secara harfiah berarti 'melakukan/membuat', tetapi dalam konteks kurban kepada Yahweh verba ini secara alami berarti mempersembahkan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau peruntukan persembahan, sedangkan nama ilahi יהוה dipertahankan sebagai Yahweh.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: pada waktu-waktu yang telah ditetapkan bagi kalian
  rationale: מוֹעֵד menunjuk pada waktu atau perayaan keagamaan yang ditentukan; pilihan ini mempertahankan cakupan waktunya tanpa membatasinya hanya pada pesta.
- source_word: לְבַד
  choice: di samping
  rationale: Menunjukkan bahwa persembahan nazar dan sukarela merupakan tambahan di luar persembahan wajib pada waktu-waktu yang ditetapkan.
- source_word: מִנִּדְרֵיכֶם
  choice: persembahan nazar ... kalian
  rationale: Dalam konteks kurban, נֶדֶר mengacu pada pemberian atau persembahan yang dijanjikan melalui nazar, bukan hanya ucapan nazarnya.
- source_word: וְנִדְבֹתֵיכֶם
  choice: persembahan sukarela kalian
  rationale: Istilah ini menunjuk pada persembahan yang diberikan secara sukarela, bukan karena kewajiban tertentu.
- source_word: לְעֹלֹתֵיכֶם
  choice: kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya di atas mazbah.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan berbahan hasil tanaman; 'persembahan sajian' merupakan istilah Indonesia yang alami dan tidak membatasi bahannya secara berlebihan.
- source_word: וּלְנִסְכֵּיכֶם
  choice: persembahan curahan
  rationale: נֶסֶךְ adalah persembahan cairan yang dicurahkan; istilah ini lebih tepat daripada ungkapan yang dapat menyiratkan minuman untuk diminum.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: kurban keselamatan
  rationale: שְׁלָמִים adalah kategori kurban yang berkaitan dengan kesejahteraan, keutuhan, dan damai; 'kurban keselamatan' mempertahankan istilah kurban yang lazim dalam bahasa Indonesia, sedangkan nuansa persekutuan dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu sebagai nama diri.
- issue: Penerjemahan שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan atau kurban damai
  rationale: Istilah Ibrani mencakup nuansa damai, keutuhan, kesejahteraan, dan persekutuan. Teks utama memakai nama kategori yang dikenal dalam bahasa Indonesia, sementara alternatif yang menonjolkan persekutuan disediakan dalam catatan kaki agar keluasan maknanya tidak ditutup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang wajar dan khidmat. Bentuk 'kalian' dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam ayat ini bersifat jamak. Penanda catatan kaki ditempatkan tepat sesudah istilah yang dijelaskannya.
