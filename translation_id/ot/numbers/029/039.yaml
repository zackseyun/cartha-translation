  source_fidelity: 'Teks Indonesia secara setia mencerminkan struktur dan unsur leksikal Ibrani: demonstratif jamak yang merujuk pada persembahan sebelumnya, kewajiban mempersembahkan kepada Yahweh pada waktu-waktu yang ditetapkan, serta pengecualian/tambahan berupa persembahan nazar dan sukarela. Keempat kategori kurban pada akhir ayat juga seluruhnya terwakili tanpa menambahkan rincian yang tidak ada dalam teks sumber.'
