  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: id
  text: Selain kurban bakaran untuk bulan itu[a] beserta persembahan sajiannya, kurban bakaran tetap beserta persembahan sajiannya, dan persembahan-persembahan curahan mereka, menurut ketentuan yang berlaku, sebagai aroma yang menyenangkan, suatu persembahan yang dibakar[b] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya secara harfiah berarti “kurban bakaran untuk bulan itu”; kemungkinan yang dimaksud ialah kurban pada bulan baru.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini secara tradisional diterjemahkan “persembahan yang dibakar” atau “persembahan dengan api.” Sebagai istilah teknis kurban, makna tepatnya diperdebatkan; ada juga yang menerjemahkannya “persembahan makanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: selain
  rationale: Menandai bahwa semua persembahan ini diberikan di samping persembahan yang telah disebutkan sebelumnya.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: kurban bakaran untuk bulan itu
  rationale: Mempertahankan kata Ibrani חֹדֶשׁ, 'bulan', tanpa diam-diam menggantinya dengan penafsiran 'bulan baru'; konteksnya dijelaskan dalam catatan kaki.
- source_word: מִנְחָתָהּ
  choice: persembahan sajiannya
  rationale: Dalam konteks kurban, מִנְחָה menunjuk pada persembahan dari hasil bumi yang menyertai kurban bakaran; 'persembahan sajian' merupakan istilah Indonesia yang ringkas dan lazim.
- source_word: עֹלַת הַתָּמִיד
  choice: kurban bakaran tetap
  rationale: תָּמִיד menyatakan keteraturan atau kesinambungan yang ditetapkan, tanpa perlu menambahkan kata 'harian' yang tidak muncul secara eksplisit di ayat ini.
- source_word: וְנִסְכֵּיהֶם
  choice: dan persembahan-persembahan curahan yang menyertai semuanya
  rationale: נֶסֶךְ adalah persembahan cair yang dicurahkan; akhiran jamak merujuk pada persembahan-persembahan yang telah disebutkan.
- source_word: כְּמִשְׁפָּטָם
  choice: sesuai dengan ketetapan bagi masing-masing
  rationale: Dalam konteks ibadah, מִשְׁפָּט menunjuk pada tata cara yang ditetapkan. Akhiran jamak dipertahankan dengan 'bagi masing-masing'.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Mempertahankan metafora formula kurban sekaligus memakai ungkapan Indonesia modern yang wajar.
- source_word: אִשֶּׁה
  choice: suatu persembahan makanan
  rationale: Memakai pengertian teknis sebagai persembahan yang disajikan kepada Allah, sambil mempertahankan terjemahan tradisional yang berkaitan dengan api dalam catatan kaki karena etimologi dan nuansanya diperdebatkan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan arah atau peruntukan persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna teknis אִשֶּׁה
  choice: suatu persembahan makanan
  alternative: persembahan yang dibakar; persembahan dengan api
  rationale: Pilihan utama menyampaikan persembahan sebagai sajian bagi Allah, sedangkan hubungan istilah itu dengan api tetap dinyatakan dalam catatan kaki agar ketegangan leksikal tidak dihapus.
- issue: Rujukan עֹלַת הַחֹדֶשׁ
  choice: kurban bakaran untuk bulan itu
  alternative: kurban bakaran bulan baru; kurban bakaran bulanan
  rationale: Secara harfiah teks menyebut 'bulan'. Konteks kemungkinan besar menunjuk pada kurban bulan baru, tetapi penafsiran tersebut tidak dimasukkan tanpa penanda ke dalam teks utama.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Istilah kurban dibuat konsisten: ''kurban bakaran'', ''persembahan sajian'', dan ''persembahan curahan''. Susunan daftar Ibrani dipertahankan sejauh tetap jelas dalam bahasa Indonesia.'
