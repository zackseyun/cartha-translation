  naturalness: Bahasa draft umumnya baku dan jelas. "Persembahan-persembahan curahan yang menyertai semuanya" terdengar bertele-tele; "persembahan curahan mereka" lebih idiomatis dan lebih dekat dengan teks. "Menurut ketentuan yang berlaku" menyampaikan fungsi kultis כְּמִשְׁפָּטָם secara wajar tanpa penambahan rujukan yang tidak perlu.
