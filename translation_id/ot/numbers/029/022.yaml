  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: id
  text: dan seekor kambing jantan sebagai kurban penghapus dosa, di samping kurban bakaran yang tetap beserta persembahan sajiannya dan persembahan curahannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: dan seekor kambing jantan
  rationale: שָׂעִיר menunjuk pada kambing jantan, sedangkan אֶחָד menyatakan jumlah satu; bentuk 'seekor' menyampaikan keduanya secara alami dalam bahasa Indonesia.
- source_word: חַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks tata kurban, istilah ini menunjuk pada jenis kurban, bukan pada dosa sebagai gagasan abstrak.
- source_word: מִ/לְּ/בַד
  choice: di samping
  rationale: Ungkapan ini menyatakan bahwa kurban tersebut dipersembahkan sebagai tambahan pada rangkaian kurban yang tetap.
- source_word: עֹלַת הַ/תָּמִיד
  choice: kurban bakaran yang tetap
  rationale: עֹלָה adalah istilah baku untuk kurban bakaran, sedangkan תָּמִיד menyatakan sifatnya yang terus dijalankan secara teratur.
- source_word: וּ/מִנְחָתָ/הּ
  choice: beserta kurban sajiannya
  rationale: Dalam konteks keimaman, מִנְחָה adalah persembahan bahan pangan; 'kurban sajian' merupakan istilah Indonesia yang ringkas dan dikenal. Sufiks feminin tunggal merujuk kepada kurban bakaran.
- source_word: וְ/נִסְכָּ/הּ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ adalah persembahan cair yang dicurahkan. Sufiks feminin tunggal kembali merujuk kepada kurban bakaran.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dipertahankan sebagai kelanjutan daftar ketetapan kurban. Rujukan kedua sufiks feminin kepada kurban bakaran dijaga melalui bentuk '-nya' tanpa menambahkan penjelasan yang tidak diperlukan.
