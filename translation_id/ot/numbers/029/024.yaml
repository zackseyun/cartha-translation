base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: id
  text: serta kurban sajian dan kurban curahan bagi lembu-lembu jantan, domba-domba jantan, dan anak-anak domba, sesuai dengan jumlahnya, menurut ketetapan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menurut tata cara yang ditetapkan." Istilah Ibrani ini menunjuk pada aturan atau prosedur resmi bagi persembahan-persembahan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kurban sajian
  rationale: Dalam konteks persembahan, מִנְחָה menunjuk pada persembahan berbahan hasil bumi yang menyertai kurban hewan. Istilah baku dan mudah dipahami dalam bahasa Indonesia ialah 'kurban sajian'.
- source_word: וְנִסְכֵּיהֶם
  choice: dan kurban curahan
  rationale: נֶסֶךְ ialah persembahan minuman yang dicurahkan. 'Kurban curahan' mempertahankan tindakan khasnya dan sesuai dengan ragam bahasa ibadah.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: yang menyertai sapi-sapi jantan, domba-domba jantan, dan anak-anak domba itu
  rationale: Prefiks ל menyatakan hubungan kurban-kurban pelengkap dengan setiap jenis hewan. 'Yang menyertai' menyampaikan hubungan itu secara alami tanpa menyiratkan bahwa persembahan tersebut diberikan kepada hewan.
- source_word: בְּמִסְפָּרָם
  choice: sesuai dengan jumlahnya
  rationale: Frasa ini menyatakan bahwa banyaknya kurban pelengkap disesuaikan dengan jumlah hewan yang dipersembahkan.
- source_word: כַּמִּשְׁפָּט
  choice: menurut ketetapan
  rationale: Dalam peraturan kurban, מִשְׁפָּט merujuk pada ketentuan atau tata cara resmi yang telah ditetapkan. 'Ketetapan' mempertahankan nuansa hukum dan ritualnya.
