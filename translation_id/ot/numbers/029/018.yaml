  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּי/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/018.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: id
  text: dan korban sajian mereka serta korban-korban curahan mereka untuk sapi-sapi jantan, untuk domba-domba jantan, dan untuk anak-anak domba, sesuai dengan jumlahnya, menurut ketetapan[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut tata cara yang telah ditetapkan.” Ibrani כַּמִּשְׁפָּט mengacu pada aturan atau prosedur yang telah ditetapkan untuk persembahan-persembahan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kurban sajian
  rationale: Dalam konteks ibadah kurban, מִנְחָה menunjuk pada persembahan dari bahan pangan, khususnya tepung atau biji-bijian, yang menyertai kurban bakaran. Istilah baku dan wajar dalam bahasa Indonesia ialah “kurban sajian”.
- source_word: נִסְכֵּיהֶם
  choice: kurban curahannya
  rationale: נֶסֶךְ ialah cairan yang dicurahkan sebagai persembahan. “Kurban curahan” menyampaikan tindakan ritual itu secara jelas dan mempertahankan kaitan sufiks jamak dengan hewan-hewan yang disebut.
- source_word: לַפָּרִים
  choice: untuk sapi-sapi jantan
  rationale: Prefiks לְ menyatakan hubungan atau pembagian kurban penyerta kepada setiap golongan hewan. פָּרִים adalah sapi jantan yang dipersembahkan.
- source_word: לָאֵילִם
  choice: domba-domba jantan
  rationale: אֵילִים merujuk kepada domba jantan dewasa dalam daftar hewan kurban; kata “untuk” yang muncul sebelumnya berlaku juga pada unsur ini.
- source_word: וְלַכְּבָשִׂים
  choice: dan anak-anak domba
  rationale: כְּבָשִׂים dalam peraturan kurban lazimnya menunjuk kepada anak domba. Prefiks לְ tetap bersifat distributif meskipun “untuk” tidak diulang demi kelancaran bahasa Indonesia.
- source_word: בְּמִסְפָּרָם
  choice: sesuai dengan jumlahnya
  rationale: Frasa ini menyatakan bahwa banyaknya kurban penyerta disesuaikan dengan jumlah hewan yang dipersembahkan.
- source_word: כַּמִּשְׁפָּט
  choice: menurut ketetapan
  rationale: מִשְׁפָּט di sini mengacu pada aturan atau tata cara yang telah ditetapkan bagi persembahan tersebut. “Menurut ketetapan” mempertahankan nuansa hukum-ritual tanpa menjadi kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan ayat dipertahankan sebagai kelanjutan sintaksis dari ayat sebelumnya. Istilah ritual dibuat konsisten dan mudah dipahami; pengulangan “untuk” diringkas secara alami tanpa mengubah hubungan distributif dalam bahasa Ibrani.
