    rationale: בָּקָר menunjuk ternak besar/sapi, bukan terutama “kawanan.” Catatan kaki perlu menyatakan bentuk harfiahnya sebagai “anak-anak ternak besar,” sambil membiarkan teks utama memakai ungkapan idiomatis.
