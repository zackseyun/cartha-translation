base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: id
  text: 'Dan pada hari kedua: dua belas ekor sapi jantan dari kawanan ternak[a], dua ekor domba jantan, dan empat belas ekor anak domba berumur satu tahun yang tidak bercacat,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “dua belas sapi jantan, anak-anak ternak besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שֵּׁנִי
  choice: Pada hari kedua
  rationale: Ungkapan ini melanjutkan urutan persembahan hari-hari raya. Dalam bahasa Indonesia, 'Pada hari kedua' sudah menyampaikan kesinambungan secara alami tanpa perlu menambahkan 'dan'.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: sapi jantan dari kawanan
  rationale: פָּרִים menunjuk pada sapi jantan dalam konteks kurban, sedangkan בְּנֵי בָקָר secara harfiah berarti 'anak-anak kawanan/ternak' dan berfungsi menggolongkan hewan tersebut sebagai ternak besar.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas ekor
  rationale: Bilangan kardinal untuk sapi jantan; penggolong 'ekor' merupakan bentuk alami dalam bahasa Indonesia.
- source_word: אֵילִם שְׁנָיִם
  choice: dua ekor domba jantan
  rationale: אֵילִם adalah domba jantan dewasa, istilah baku bagi hewan kurban ini.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: empat belas ekor anak domba berumur satu tahun
  rationale: כְּבָשִׂים diterjemahkan 'anak domba', sedangkan idiom בְּנֵי שָׁנָה menyatakan umur satu tahun.
- source_word: תְּמִימִם
  choice: yang tidak bercacat
  rationale: Dalam peraturan kurban, kata ini menyatakan bahwa hewan bebas dari cacat dan layak dipersembahkan.
