base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: id
  text: serta korban sajian mereka dan korban curahan mereka untuk lembu jantan, domba jantan, dan anak-anak domba, sesuai dengan jumlahnya, menurut ketetapan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kurban sajian
  rationale: Dalam konteks persembahan, מִנְחָה menunjuk pada kurban berbahan hasil tanaman yang menyertai kurban hewan. Bentuk tunggal bersufiks jamak dipahami secara kolektif.
- source_word: וְנִסְכֵּיהֶם
  choice: dan kurban curahannya
  rationale: נֶסֶךְ adalah persembahan cair yang dicurahkan. 'Kurban curahan' jelas, alami, dan mempertahankan tindakan ritualnya.
- source_word: לַפָּר
  choice: untuk sapi jantan
  rationale: פַּר menunjuk pada sapi jantan; unsur 'muda' tidak harus ditambahkan karena tidak dinyatakan secara tegas oleh bentuk ini.
- source_word: לָאַיִל
  choice: untuk domba jantan
  rationale: אַיִל secara langsung berarti domba jantan dalam daftar kurban.
- source_word: וְלַכְּבָשִׂים
  choice: dan untuk anak-anak domba
  rationale: כֶּבֶשׂ berarti anak domba, sering kali jantan dalam konteks kurban. Jenis kelaminnya tidak perlu diulang karena konteks daftar sebelumnya telah menetapkannya.
- source_word: בְּמִסְפָּרָם
  choice: sesuai dengan jumlahnya
  rationale: Frasa ini menyatakan kesesuaian persembahan penyerta dengan jumlah hewan kurban yang telah ditentukan.
- source_word: כַּמִּשְׁפָּט
  choice: menurut ketetapan
  rationale: מִשְׁפָּט di sini menunjuk pada aturan atau tata cara resmi yang mengatur persembahan tersebut; 'ketetapan' mempertahankan nuansa hukum-ritualnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'kurban sajian' serta 'kurban curahan' dipakai secara konsisten untuk kosakata ritual, sementara susunan berulang 'untuk ... untuk ... dan untuk ...' mempertahankan struktur daftar Ibrani.
