  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: id
  text: Pada hari kedelapan, kamu harus mengadakan pertemuan khidmat[a]. Janganlah kamu melakukan pekerjaan sehari-hari apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertemuan penutup”. Kata Ibrani עֲצֶרֶת dapat menunjuk pada pertemuan perayaan yang menutup rangkaian hari raya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Mempertahankan frasa waktu dan bentuk ordinal definit dalam ungkapan Indonesia yang alami.
- source_word: עֲצֶרֶת
  choice: pertemuan khidmat
  rationale: Menunjukkan pertemuan keagamaan yang resmi dan sakral tanpa secara berlebihan menentukan sifatnya sebagai acara penutup; kemungkinan itu dicatat dalam catatan kaki.
- source_word: תִּהְיֶה לָכֶם
  choice: kamu harus mengadakan
  rationale: Secara harfiah berarti 'akan ada bagimu'; dalam konteks perintah perayaan, bentuk ini menyampaikan kewajiban dengan jelas dan alami.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: pekerjaan berat apa pun
  rationale: Menyampaikan larangan atas pekerjaan pelayanan atau kerja yang membebani pada hari raya, bukan larangan mutlak atas setiap tindakan.
- source_word: לֹא תַעֲשׂוּ
  choice: Janganlah kamu melakukan
  rationale: Mencerminkan larangan kepada orang kedua jamak dalam ragam hukum yang tetap jelas bagi pembaca modern.
theological_decisions:
- issue: Makna istilah perayaan עֲצֶרֶת
  choice: pertemuan khidmat
  alternative: pertemuan penutup
  rationale: Teks menunjuk pada pertemuan sakral pada hari kedelapan, tetapi istilah Ibraninya juga dapat menonjolkan fungsi penutupnya. Teks utama mempertahankan sifat khidmat tanpa memasukkan identifikasi liturgis atau doktrinal tambahan, sedangkan alternatif leksikal dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'kamu' dipahami sebagai bentuk jamak kolektif yang ditujukan kepada umat; susunan dua kalimat membuat perintah mudah dibaca.
