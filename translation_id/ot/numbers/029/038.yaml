  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: id
  text: dan seekor kambing jantan untuk kurban penghapus dosa, selain kurban bakaran tetap beserta kurban sajiannya dan kurban curahannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: dan seekor kambing jantan
  rationale: שָׂעִיר dalam konteks kurban menunjuk pada kambing jantan; אֶחָד menyatakan jumlah satu dan secara alami tercakup dalam penggolong 'seekor'.
- source_word: חַטָּאת
  choice: untuk kurban penghapus dosa
  rationale: Dalam konteks keimaman, istilah ini menunjuk pada jenis kurban yang berkaitan dengan penghapusan dosa, bukan sekadar pada dosa sebagai konsep abstrak.
- source_word: מִ/לְּ/בַד
  choice: selain
  rationale: Menandai bahwa persembahan ini merupakan tambahan di luar kurban tetap yang telah ditetapkan.
- source_word: עֹלַת הַ/תָּמִיד
  choice: kurban bakaran tetap
  rationale: עֹלָה adalah kurban bakaran, sedangkan הַתָּמִיד menunjukkan persembahan yang dilakukan secara tetap atau terus-menerus.
- source_word: וּ/מִנְחָתָ/הּ
  choice: beserta kurban sajiannya
  rationale: מִנְחָה dalam konteks ritual ini ialah kurban sajian yang menyertai kurban bakaran; sufiks feminin tunggal merujuk kembali kepada kurban bakaran.
- source_word: וְ/נִסְכָּ/הּ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ ialah persembahan cair yang dicurahkan; sufiks feminin tunggal kembali merujuk kepada kurban bakaran.
theological_decisions:
- issue: Makna ritual חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Terjemahan mempertahankan sebutan tradisional dan mudah dipahami tanpa menentukan secara sempit apakah fungsi kurban dalam setiap konteks terutama menghapus dosa atau memurnikan kenajisan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Istilah ritual dibuat konsisten dan mudah dipahami; 'tetap' mempertahankan nuansa keteraturan הַתָּמִיד tanpa membatasi secara eksplisit menjadi 'harian'.
