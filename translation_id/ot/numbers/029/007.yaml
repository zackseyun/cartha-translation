  text: וּ/בֶ/עָשׂוֹר֩ לַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם כָּל מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: id
  text: Pada hari kesepuluh bulan ketujuh ini, akan ada pertemuan kudus bagi kamu. Kamu harus merendahkan diri[a] dan jangan melakukan pekerjaan apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kamu harus menyangkal diri." Secara harfiah, ungkapan Ibrani ini berarti "kamu harus mengafliksi jiwa-jiwamu." Ini adalah ungkapan ritual tentang penyangkalan diri, khususnya yang berkaitan dengan puasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: Pada hari kesepuluh
  rationale: Ungkapan dengan preposisi dan bilangan menyatakan tanggal; kata “hari” ditambahkan secara wajar dalam bahasa Indonesia.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: bulan ketujuh ini
  rationale: Mempertahankan urutan kalender dan unsur penunjuk הַזֶּה dengan susunan Indonesia yang alami.
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Menunjuk pada pertemuan sakral yang diserukan secara resmi; pilihan ini jelas bagi pembaca modern dan tetap mempertahankan corak ibadah.
- source_word: יִהְיֶה לָכֶם
  choice: kamu harus mengadakan
  rationale: Mengungkapkan kewajiban komunal yang tersirat dalam konstruksi “akan ada bagimu” dengan bahasa Indonesia yang alami.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Kamu harus merendahkan dirimu
  rationale: Idiom ritual ini mengacu pada tindakan merendahkan atau menyangkal diri, khususnya dalam konteks Hari Pendamaian. Pilihan utama mempertahankan dimensi pertobatan tanpa membatasinya hanya pada puasa.
- source_word: נַפְשֹׁתֵיכֶם
  choice: dirimu
  rationale: Walaupun secara harfiah berarti “jiwa-jiwamu” atau “hidupmu,” bentuk refleksif menyampaikan idiom Ibrani tanpa memasukkan pembedaan tubuh dan jiwa yang tidak dimaksudkan teks.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: tidak boleh melakukan pekerjaan apa pun
  rationale: Menyampaikan larangan hukum yang menyeluruh secara lugas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna idiom ritual וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: Kamu harus merendahkan dirimu
  alternative: Kamu harus menyangkal dirimu; secara harfiah, kamu harus menindas jiwamu
  rationale: “Merendahkan dirimu” mempertahankan bobot pertobatan dan pengendalian diri dalam perintah tersebut. Catatan kaki menjaga ungkapan harfiah dan kemungkinan makna penyangkalan diri tanpa menyamakan perintah ini secara mutlak hanya dengan puasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” dipakai secara kolektif sesuai bentuk jamak Ibrani; “pertemuan kudus” dipilih agar istilah ibadah tetap jelas bagi pembaca umum.
