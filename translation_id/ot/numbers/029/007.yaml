revisions:
- from: Pada hari kesepuluh bulan ketujuh ini, kamu harus mengadakan pertemuan kudus. Kamu harus merendahkan dirimu[a] dan tidak boleh melakukan pekerjaan apa pun.
  to: Pada hari kesepuluh bulan ketujuh ini, akan ada pertemuan kudus bagi kamu. Kamu harus merendahkan diri[a] dan jangan melakukan pekerjaan apa pun.
  rationale: Revisi memulihkan fungsi klausa "akan ada ... bagi kamu" dan mempertahankan larangan kerja yang menyeluruh. Terjemahan utama "merendahkan diri" tetap modern dan wajar, sementara catatan kaki menyajikan alternatif serta bentuk harfiah untuk menjaga keluasan idiom ritual Ibrani tanpa membatasinya pada puasa atau memaksakan tafsiran tertentu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T16:31:18Z'
review_pass:
  verdict: revise
  source_fidelity: Frasa "kamu harus mengadakan pertemuan kudus" mengubah מִקְרָא־קֹדֶשׁ יִהְיֶה לָכֶם ("akan ada pertemuan kudus bagi kamu") menjadi perintah agar umat menyelenggarakan pertemuan itu. Teks Ibrani menetapkan karakter hari tersebut, bukan secara eksplisit tindakan "mengadakan". "Merendahkan diri" merupakan pilihan yang sah untuk idiom ritual וְעִנִּיתֶם אֶת־נַפְשֹׁתֵיכֶם, asalkan catatan kaki mempertahankan alternatif yang lebih dekat kepada daya makna "menyangkal/mengafliksi diri".
  naturalness: Revisi memakai susunan Indonesia baku dan alami. "Akan ada pertemuan kudus bagi kamu" mempertahankan struktur sumber tanpa menjadi kaku; "jangan melakukan pekerjaan apa pun" adalah larangan yang jelas dan menyeluruh.
  terminology: '"Pertemuan kudus" dapat dipertahankan untuk מִקְרָא קֹדֶשׁ. "Merendahkan diri" tidak secara sendiri menyampaikan seluruh unsur penyangkalan diri dalam idiom Ibrani, sehingga alternatif dan penjelasan literal yang netral diperlukan dalam catatan kaki. "Menyiksa diri" dihindari karena dalam pemakaian Indonesia modern dapat menyiratkan kekerasan fisik yang tidak dinyatakan secara spesifik oleh ayat.'
  issues:
  - severity: medium
    issue: '"mengadakan pertemuan kudus" terlalu spesifik sebagai tindakan subjek.'
    rationale: יִהְיֶה לָכֶם secara harfiah menyatakan bahwa suatu pertemuan kudus "akan ada bagi kamu"; ayat ini tidak memakai verba yang berarti menyelenggarakan atau mengadakan.
  - severity: low
    issue: Catatan kaki menyebut "menindas jiwamu" sebagai harfiah.
    rationale: Secara bentuk, objeknya jamak ("jiwa-jiwamu"), dan verba ענה dalam idiom ini lebih baik dijelaskan sebagai "mengafliksi/merendahkan diri" daripada "menindas," yang dalam Indonesia lazim mengacu pada penindasan terhadap orang lain.
  revised_text: Pada hari kesepuluh bulan ketujuh ini, akan ada pertemuan kudus bagi kamu. Kamu harus merendahkan diri[a] dan jangan melakukan pekerjaan apa pun.
