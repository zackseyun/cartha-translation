  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: id
  text: 'Kurban sajian mereka harus berupa tepung halus yang dicampur dengan minyak: tiga ukuran sepersepuluh[a] untuk setiap sapi jantan, untuk ketiga belas sapi jantan itu, dan dua ukuran sepersepuluh untuk setiap domba jantan, untuk kedua domba jantan itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tiga persepuluh” dan “dua persepuluh”; ukuran sepersepuluh ini secara tradisional dipahami sebagai sepersepuluh efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Kurban sajian mereka
  rationale: Dalam konteks kurban, מִנְחָה menunjuk pada kurban sajian, dan akhiran orang ketiga jamak dipertahankan sebagai 'mereka'.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Istilah kultis ini berarti tepung bermutu tinggi yang digiling halus; 'tepung terbaik' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif dengan preposisi ב menyatakan bahwa tepung itu disiapkan dengan mencampurkannya dengan minyak.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tiga persepuluh efa
  rationale: עִשָּׂרוֹן adalah satuan sepersepuluh efa. Nama satuan ditambahkan agar ukuran yang tersirat dalam bahasa Ibrani dapat dipahami pembaca Indonesia.
- source_word: לַפָּר הָאֶחָד
  choice: untuk setiap sapi jantan
  rationale: Bentuk harfiah 'untuk sapi jantan yang satu' berfungsi secara distributif dalam petunjuk ini; 'setiap' menyampaikan fungsi tersebut secara alami.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: bagi ketiga belas sapi jantan itu
  rationale: Frasa ini menyebut keseluruhan kelompok tertentu yang menerima takaran per ekor tersebut.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dua persepuluh efa
  rationale: Istilah yang sama menunjuk pada dua satuan sepersepuluh efa; diterjemahkan sejajar dengan frasa sebelumnya.
- source_word: לָאַיִל הָאֶחָד
  choice: untuk setiap domba jantan
  rationale: Nomina tunggal dengan artikel berfungsi distributif, sehingga 'setiap domba jantan' jelas dan wajar.
- source_word: לִשְׁנֵי הָאֵילִם
  choice: bagi kedua domba jantan itu
  rationale: Bentuk definit ini menunjuk pada keseluruhan kelompok dua domba jantan yang telah ditentukan.
