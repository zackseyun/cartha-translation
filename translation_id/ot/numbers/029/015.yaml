  text: dan sepersepuluh bagian untuk setiap anak domba[a], untuk empat belas anak domba itu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mengulang “sepersepuluh” dua kali (“sepersepuluh, sepersepuluh”), suatu ungkapan yang menyatakan takaran bagi setiap anak domba.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: sepersepuluh bagian
  rationale: Kata yang diulang ini menunjuk pada ukuran sepersepuluh, dalam konteks persembahan biasanya sepersepuluh efa tepung terbaik. Bentuk Indonesia ini ringkas dan wajar; daya distributif pengulangan Ibrani disampaikan melalui frasa 'untuk setiap'.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk setiap anak domba
  rationale: Secara harfiah, 'untuk anak domba yang satu'. Dalam daftar persembahan ini frasa tersebut bersifat distributif, yaitu menetapkan takaran bagi masing-masing hewan.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: untuk keempat belas anak domba itu
  rationale: Frasa ini menyatakan keseluruhan kelompok yang dikenai takaran per ekor. Bentuk 'keempat belas ... itu' mencerminkan kelompok tertentu yang sudah ditetapkan dalam konteks.
