  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Ibrani dengan tepat: וּ sebagai “dan”; שְׂעִיר עִזִּים אֶחָד sebagai “seekor kambing jantan”; חַטָּאת dalam arti kultis sebagai “persembahan penghapus dosa”; serta לְכַפֵּר עֲלֵיכֶם sebagai “untuk mengadakan pendamaian bagi kamu.” Terjemahan ini tidak menambahkan mekanisme teologis yang tidak dinyatakan teks.'
