base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: id
  text: dan seekor kambing jantan sebagai persembahan penghapus dosa, untuk mengadakan pendamaian bagi kamu—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: dan seekor kambing jantan
  rationale: Frasa Ibrani menyebut satu ekor kambing jantan. Bentuk 'seekor' menyatakan jumlah secara alami dalam bahasa Indonesia, sedangkan 'kambing jantan' mempertahankan jenis kelamin hewan kurban.
- source_word: חַטָּאת
  choice: sebagai persembahan penghapus dosa
  rationale: Dalam konteks kurban, kata ini menunjuk pada jenis persembahan, bukan sekadar dosa secara abstrak. Rumusan ini jelas bagi pembaca modern dan mempertahankan fungsi kultisnya.
- source_word: לְ/כַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Kata kerja כפר dalam konteks keimaman menyatakan tindakan ritual pendamaian atau penghapusan kesalahan. 'Mengadakan pendamaian' mempertahankan keluasan makna teologisnya tanpa menentukan suatu mekanisme doktrinal tertentu.
- source_word: עֲלֵי/כֶם
  choice: bagi kamu
  rationale: Dengan כפר, preposisi עַל menunjukkan orang-orang yang menerima manfaat tindakan pendamaian. 'Bagi kamu' alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan istilah kurban כפר
  choice: untuk mengadakan pendamaian bagi kamu
  alternative: untuk menghapus kesalahan kamu
  rationale: Pilihan utama mempertahankan kategori ritual-teologis yang luas dalam teks Ibrani. Alternatif menonjolkan aspek penghapusan kesalahan, tetapi dapat mempersempit cakupan istilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dipertahankan sebagai lanjutan daftar persembahan; tanda pisah akhir mengikuti kesinambungan sintaksis konteks.
