  terminology: “Kambing jantan,” “persembahan penghapus dosa,” dan “mengadakan pendamaian” mempertahankan terminologi kurban secara jelas dan tidak bersifat denominatif. Pemilihan “persembahan” untuk חַטָּאת tetap memadai dalam konteks ini.
