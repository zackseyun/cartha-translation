  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: id
  text: dan seekor kambing jantan sebagai kurban penghapus dosa[a], di samping kurban penghapus dosa untuk pendamaian, serta kurban bakaran yang tetap[b] dengan persembahan sajian dari gandumnya dan persembahan-persembahan curahan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kurban pemurnian" pada kedua kemunculan frasa "kurban penghapus dosa".
    reason: lexical_alternative
  - marker: b
    text: Atau "kurban bakaran yang terus-menerus".
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa ini menunjuk pada kambing jantan. Kata penggolong 'seekor' secara alami menyatukan jenis hewan dan bilangan אֶחָד dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: seekor
  rationale: Bilangan satu dinyatakan melalui kata penggolong numerik 'seekor', bentuk yang paling wajar bagi hewan dalam bahasa Indonesia.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks ritual, nomina ini menunjuk pada kurban, bukan pada dosa secara abstrak. Pilihan ini merupakan istilah Indonesia yang jelas dan mapan, sementara kemungkinan nuansa pemurnian dicatat dalam catatan kaki.
- source_word: מִלְּבַד
  choice: di samping
  rationale: Menandai bahwa persembahan tersebut diberikan sebagai tambahan pada kurban-kurban lain yang disebutkan.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: kurban penghapus dosa untuk pendamaian
  rationale: Konstruksi ini menghubungkan kurban tersebut dengan tindakan pendamaian tanpa mempersempitnya secara eksplisit menjadi nama hari raya yang tidak disebutkan dalam frasa ini.
- source_word: עֹלַת הַתָּמִיד
  choice: kurban bakaran tetap
  rationale: תָּמִיד menyatakan pelaksanaan yang terus berlangsung atau teratur; 'tetap' ringkas, alami, dan mempertahankan sifat ritual yang berulang.
- source_word: מִנְחָתָהּ
  choice: kurban sajiannya
  rationale: Dalam daftar kurban, מִנְחָה adalah kurban sajian yang menyertai kurban bakaran. Sufiks feminin tunggal dipertahankan dengan '-nya', yang merujuk pada kurban bakaran.
- source_word: נִסְכֵּיהֶם
  choice: kurban-kurban curahan mereka
  rationale: Bentuk jamak nomina dan sufiks jamak dipertahankan. 'Kurban curahan' menyampaikan tindakan ritual mencurahkan cairan, sedangkan 'mereka' mempertahankan rujukan jamak yang memang terdapat dalam teks Ibrani.
theological_decisions:
- issue: Istilah ritual חַטָּאת
  choice: kurban penghapus dosa pada kedua kemunculannya
  alternative: kurban pemurnian
  rationale: Istilah tradisional ini jelas dalam daftar persembahan dan tidak mengharuskan penafsiran tertentu tentang fungsi tunggal kurban. Nuansa pemurnian yang juga mungkin tetap dinyatakan dalam catatan kaki.
- issue: Rujukan הַכִּפֻּרִים
  choice: untuk pendamaian
  alternative: pada Hari Pendamaian
  rationale: Teks frasa ini menyebut pendamaian, bukan secara eksplisit nama 'Hari Pendamaian'. Terjemahan mempertahankan bentuk ritualnya tanpa menambahkan identifikasi yang tersirat dari konteks.
- issue: Ketidaksesuaian jumlah pada נִסְכֵּיהֶם
  choice: kurban-kurban curahan mereka
  alternative: kurban curahannya
  rationale: Teks Masoret memakai sufiks maskulin jamak, meskipun מִנְחָתָהּ sebelumnya bersufiks feminin tunggal dan merujuk pada kurban bakaran. Terjemahan tidak menyeragamkan perubahan ini secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami. Penanda [a] dan [b] ditempatkan langsung pada istilah yang dijelaskan; perubahan dari sufiks tunggal pada kurban sajian ke sufiks jamak pada kurban curahan dipertahankan sebagaimana teks sumber.
