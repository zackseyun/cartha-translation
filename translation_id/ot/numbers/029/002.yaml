base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: id
  text: 'Kalian harus mempersembahkan kurban bakaran sebagai aroma yang menyenangkan bagi Yahweh[a]: seekor sapi jantan dari kawanan ternak, seekor domba jantan, dan tujuh ekor anak domba jantan berumur setahun, yang ketujuhnya tidak bercacat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aroma yang menenteramkan” atau “aroma yang harum.” Ungkapan Ibrani ini merupakan formula tetap dalam konteks kurban yang menunjukkan bahwa persembahan itu berkenan kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Kalian harus mempersembahkan
  rationale: Bentuk verba ini berpersona kedua jamak. Dalam konteks kurban dengan objek עֹלָה, arti idiomatisnya ialah mempersembahkan, bukan sekadar membuat.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada kurban yang seluruhnya dibakar di atas mazbah; “kurban bakaran” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Ungkapan baku dalam tata kurban ini menyatakan bahwa persembahan tersebut berkenan atau diterima di hadapan Allah, sambil tetap mempertahankan citra aroma dalam teks Ibrani.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menandai bahwa kurban itu ditujukan kepada Yahweh; nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: seekor sapi jantan dari kawanan ternak
  rationale: Padanan ini menyampaikan ungkapan harfiah “seekor sapi jantan, anak dari kawanan sapi” secara alami tanpa memastikan usia yang tidak dinyatakan secara tegas oleh frasa tersebut.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: Dalam daftar kurban, אַיִל secara langsung berarti domba jantan dewasa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: tujuh ekor anak domba jantan berumur setahun
  rationale: Bentuk כְּבָשִׂים dan konteks kurban mendukung jenis kelamin jantan, sedangkan בְּנֵי שָׁנָה berarti berumur setahun.
- source_word: תְּמִימִם
  choice: semuanya tidak bercacat
  rationale: Dalam konteks kurban, kata ini berarti bebas dari cacat. “Semuanya” memperjelas bahwa sifat jamak tersebut berlaku pada ketujuh anak domba.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama diri tersebut dan tidak menggantinya dengan gelar.
- issue: Makna formula לְרֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenteramkan
  rationale: Terjemahan mempertahankan metafora indrawi asli tanpa mereduksinya menjadi pernyataan abstrak tentang penerimaan ilahi. Catatan kaki menjelaskan fungsi formula kurban itu.
translation_notes:
  register: Bahasa Indonesia modern dan bermartabat digunakan dengan “kalian” untuk mempertahankan persona kedua jamak dalam bahasa Ibrani. Istilah “kurban bakaran” dan “tidak bercacat” mempertahankan kosakata ritual secara jelas bagi pembaca umum.
