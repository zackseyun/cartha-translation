    reason: textual_structure
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: dan seekor kambing jantan
  rationale: שׂעִיר secara khusus menunjuk kambing jantan, sedangkan אֶחָד menyatakan jumlah satu; dalam bahasa Indonesia, keduanya tersampaikan secara alami dengan 'seekor kambing jantan'.
- source_word: חַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam konteks ritual ini, חַטָּאת menunjuk jenis kurban, bukan sekadar dosa secara abstrak. Ungkapan ini jelas dan lazim dipahami dalam bahasa Indonesia.
- source_word: מִ/לְּ/בַד
  choice: selain
  rationale: Ungkapan ini menunjukkan bahwa kurban tersebut dipersembahkan di luar atau sebagai tambahan pada kurban yang disebut sesudahnya.
- source_word: עֹלַת הַ/תָּמִיד
  choice: kurban bakaran tetap
  rationale: עֹלָה adalah kurban bakaran, sedangkan תָּמִיד menunjukkan persembahan yang berlangsung atau berulang secara tetap; 'tetap' mempertahankan cakupan itu tanpa mempersempitnya menjadi hanya 'harian'.
- source_word: מִנְחָתָ/הּ
  choice: beserta kurban sajian
  rationale: Dalam daftar persembahan, מִנְחָה adalah kurban sajian yang menyertai kurban bakaran. Sufiks feminin mengacu pada עֹלָה; hubungan kepemilikannya tersirat secara alami sesudah 'beserta'.
- source_word: וְ/נִסְכָּ/הּ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ menunjuk persembahan berupa cairan yang dicurahkan. Sufiksnya dipertahankan melalui '-nya', yang mengaitkannya dengan kurban bakaran tetap.
