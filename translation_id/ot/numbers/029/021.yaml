base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: id
  text: dan persembahan sajian mereka dan persembahan curahan mereka untuk lembu-lembu jantan, domba-domba jantan, dan anak-anak domba, sesuai dengan jumlahnya dan menurut ketentuan[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan tata cara yang ditetapkan.” Istilah Ibrani ini menunjuk pada aturan ritual yang telah ditetapkan untuk persembahan-persembahan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kurban sajian
  rationale: Dalam konteks persembahan korban, מִנְחָה menunjuk pada persembahan berbahan hasil bumi yang menyertai korban bakaran. Istilah baku dan ringkas 'kurban sajian' mempertahankan fungsi ritualnya; bentuk Ibrani dipahami secara kolektif.
- source_word: נִסְכֵּיהֶם
  choice: kurban curahannya
  rationale: נֶסֶךְ ialah persembahan cair yang dicurahkan. 'Kurban curahan' jelas, alami dalam register Alkitab, dan mempertahankan tindakan ritual tersebut.
- source_word: לַפָּרִים
  choice: untuk sapi-sapi jantan
  rationale: פָּרִים dalam daftar korban berarti sapi jantan. Bahasa Indonesia memerlukan penyebutan jenis kelamin secara eksplisit agar berbeda dari istilah umum 'sapi'.
- source_word: לָאֵילִם
  choice: domba-domba jantan
  rationale: אַיִל dalam konteks korban secara langsung berarti domba jantan.
- source_word: וְלַכְּבָשִׂים
  choice: dan anak-anak domba
  rationale: כֶּבֶשׂ berarti anak domba; konteks dekat sudah menentukan persyaratan jenis kelaminnya, sehingga tidak perlu ditambahkan di ayat ini.
- source_word: בְּמִסְפָּרָם
  choice: sesuai dengan jumlahnya
  rationale: Frasa ini menyatakan bahwa persembahan yang menyertai setiap kelompok hewan harus selaras dengan jumlah hewan yang telah ditetapkan.
- source_word: כַּמִּשְׁפָּט
  choice: menurut ketentuan
  rationale: מִשְׁפָּט di sini menunjuk pada aturan atau tata cara ritual yang telah ditetapkan. 'Ketentuan' mempertahankan daya normatifnya sekaligus terdengar alami dalam bahasa Indonesia modern.
