  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: id
  text: 'Kalian harus mempersembahkan kepada Yahweh kurban bakaran sebagai aroma yang menyenangkan[a]: seekor sapi jantan muda, seekor domba jantan, dan tujuh ekor anak domba jantan berumur setahun. Semuanya harus tanpa cacat bagi kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aroma yang menenangkan.” Ungkapan Ibrani ini merupakan ungkapan tetap dalam bahasa kurban untuk persembahan yang berkenan kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Kalian harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan sebagai persembahan. Frasa ini alami dalam bahasa Indonesia dan mempertahankan daya wajib dari rangkaian ketentuan ritual.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada kurban yang seluruhnya dibakar. 'Kurban bakaran' merupakan padanan Indonesia yang jelas dan mapan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan persembahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: רֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Ungkapan tetap dalam bahasa kurban ini menyatakan bahwa persembahan itu berkenan atau diterima. Padanan ini mempertahankan metafora aroma tanpa menambahkan gagasan yang tidak tersurat.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: seekor sapi jantan muda
  rationale: Ungkapan harfiahnya adalah 'seekor sapi jantan, anak kawanan sapi' dan lazim menunjuk pada sapi jantan muda. Padanan ini ringkas dan wajar dalam daftar hewan kurban.
- source_word: אַיִל אֶחָד
  choice: seekor domba jantan
  rationale: אַיִל adalah sebutan umum bagi domba jantan dewasa dalam daftar kurban.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: tujuh ekor anak domba jantan berumur setahun
  rationale: כְּבָשִׂים berbentuk maskulin dan dalam konteks ini menunjuk pada anak domba jantan; בְּנֵי שָׁנָה adalah ungkapan idiomatis untuk usia satu tahun.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: Semuanya harus tidak bercacat
  rationale: Dalam konteks kurban, תָּמִים berarti bebas dari cacat. Bahasa Indonesia tidak dapat mempertahankan לָכֶם secara harfiah tanpa menjadi janggal; hubungannya dengan pihak yang membawa kurban sudah tersirat oleh subjek 'kalian'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi dan membedakannya dari gelar umum 'Tuhan'.
- issue: Makna רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenangkan
  rationale: Ungkapan itu menggambarkan kurban sebagai sesuatu yang berkenan kepada Allah. Pilihan ini mempertahankan metafora teks tanpa secara tegas menafsirkan kurban sebagai sarana untuk meredakan kemarahan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak 'kalian' dipakai untuk mencerminkan sapaan jamak Ibrani. Daftar hewan dibuat ringkas dan alami, sedangkan istilah ritual utama dipertahankan.
