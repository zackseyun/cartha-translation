base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: id
  text: 'Dan pada hari yang ketiga: sebelas ekor sapi jantan, dua ekor domba jantan, dan empat belas ekor anak domba berumur satu tahun yang tidak bercacat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari yang ketiga
  rationale: Ungkapan ini melanjutkan urutan persembahan harian. Dalam bahasa Indonesia, kesinambungan itu sudah jelas dari konteks, sehingga waw tidak perlu diterjemahkan secara kaku sebagai “dan”.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: sebelas ekor sapi jantan
  rationale: פָּרִים dalam konteks kurban menunjuk pada sapi jantan; kata bantu bilangan “ekor” menghasilkan ungkapan Indonesia yang alami.
- source_word: אֵילִם שְׁנָיִם
  choice: dua ekor domba jantan
  rationale: אֵילִם adalah domba jantan dewasa yang dipersembahkan sebagai kurban.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: empat belas ekor anak domba berumur satu tahun
  rationale: בְּנֵי שָׁנָה adalah idiom yang menyatakan umur satu tahun; susunan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: תְּמִימִם
  choice: yang tidak bercacat
  rationale: Dalam peraturan kurban, istilah ini berarti bebas dari cacat fisik, bukan sempurna dalam arti mutlak.
