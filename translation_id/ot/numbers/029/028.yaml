  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: id
  text: dan seekor kambing jantan sebagai kurban penghapus dosa, selain kurban bakaran yang tetap beserta kurban sajiannya dan kurban curahannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: dan seekor kambing jantan sebagai kurban penghapus dosa
  rationale: שָׂעִיר menunjuk pada kambing jantan, אֶחָד menyatakan jumlah satu dan secara alami tercakup dalam 'seekor', sedangkan חַטָּאת dalam daftar kurban menunjuk pada kurban penghapus dosa.
- source_word: מִ/לְּ/בַד
  choice: selain
  rationale: Ungkapan ini menyatakan bahwa kurban tersebut merupakan tambahan di luar rangkaian kurban tetap.
- source_word: עֹלַת הַ/תָּמִיד
  choice: kurban bakaran tetap
  rationale: עֹלָה adalah kurban bakaran, sedangkan תָּמִיד menekankan sifatnya yang tetap atau rutin tanpa perlu mempersempitnya secara leksikal menjadi 'harian'.
- source_word: וּ/מִנְחָתָ/הּ
  choice: beserta kurban sajian
  rationale: Dalam konteks keimaman, מִנְחָה adalah kurban sajian yang menyertai kurban bakaran; sufiks feminin merujuk kembali kepada עֹלָה.
- source_word: וְ/נִסְכָּ/הּ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ adalah persembahan cair yang dicurahkan; 'kurban curahan' merupakan istilah Indonesia yang ringkas dan jelas. Sufiksnya merujuk kepada kurban bakaran.
