  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar kurban dipertahankan, sementara pengulangan pronominal dibuat alami melalui frasa 'beserta ... dan ...-nya'. Tidak digunakan catatan kaki karena alternatif dalam lapisan konsultasi Inggris tidak sesuai dengan penempatan penandanya dan tidak diperlukan untuk mewakili ambiguitas penting dalam teks Ibrani.
