  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: id
  text: 'Dan korban sajian mereka berupa tepung halus yang dicampur dengan minyak: tiga persepuluh efa untuk lembu jantan dan dua persepuluh efa untuk domba jantan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: Beserta kurban sajian mereka harus dipersembahkan
  rationale: Dalam konteks kurban, מִנְחָה menunjuk pada kurban sajian. Prefiks וּ dipahami sebagai penghubung dengan persembahan pada ayat sebelumnya; susunan ini juga membuat klausa nominal Ibrani menjadi wajar dalam bahasa Indonesia.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: סֹלֶת adalah tepung bermutu tinggi yang diolah halus untuk persembahan. 'Tepung terbaik' alami dan mudah dipahami tanpa mengesankan jenis tepung modern tertentu.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisip pasif בְּלוּלָה menyatakan bahwa tepung itu disiapkan dengan mencampurkannya dengan minyak.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tiga persepuluh efa
  rationale: עִשָּׂרוֹן adalah satu persepuluh efa dalam ketentuan kurban. Unit 'efa' dinyatakan dalam teks terjemahan agar ukurannya tidak menggantung.
- source_word: לַפָּר
  choice: untuk lembu jantan
  rationale: פַּר menunjuk pada lembu jantan yang dipersembahkan; bentuk tunggal dipertahankan.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dua persepuluh efa
  rationale: Besaran satuan yang tersirat dijelaskan sebagai efa, selaras dengan istilah ukuran dalam hukum persembahan.
- source_word: לָאָיִל
  choice: untuk domba jantan
  rationale: אַיִל berarti domba jantan, khususnya dalam konteks persembahan; bentuk tunggal dipertahankan.
