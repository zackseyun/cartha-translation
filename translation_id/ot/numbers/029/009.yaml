  - severity: low
    issue: “yang menyertainya” untuk sufiks -ם pada מִנְחָתָם
    rationale: Sufiks tersebut secara langsung berarti “mereka/nya” (merujuk pada hewan-hewan yang telah disebutkan). Fungsi sebagai persembahan pendamping berasal dari konteks, bukan dari sufiks itu sendiri.
