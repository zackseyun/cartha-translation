  text: 'dan persembahan sajiannya: tepung halus yang dicampur dengan minyak—tiga persepuluh efa[a] untuk lembu jantan itu dan dua persepuluh efa untuk domba jantan yang satu itu.'
  philosophy: optimal-equivalence
