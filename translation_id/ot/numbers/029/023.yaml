translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dipertahankan secara ringkas; 'ekor' dipakai sebagai kata penggolong alami, dan 'yang tidak bercacat' secara gramatikal paling dekat menerangkan anak-anak domba sebagaimana susunan teks Ibrani.
