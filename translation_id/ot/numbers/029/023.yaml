base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: id
  text: 'Dan pada hari keempat: sepuluh ekor sapi jantan, dua ekor domba jantan, empat belas ekor anak domba jantan berumur satu tahun yang tidak bercacat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הָ/רְבִיעִי
  choice: Pada hari keempat
  rationale: Rumus waktu ini secara alami membuka butir berikutnya dalam rangkaian persembahan. Dalam bahasa Indonesia, kesinambungan daftar sudah jelas dari konteks sehingga prefiks וּ tidak perlu diterjemahkan dengan 'dan' secara kaku.
- source_word: פָּרִים עֲשָׂרָה
  choice: sepuluh ekor sapi jantan
  rationale: Dalam konteks korban, פָּרִים menunjuk pada sapi jantan; kata penggolong 'ekor' menghasilkan ungkapan Indonesia yang alami.
- source_word: אֵילִם שְׁנָיִם
  choice: dua ekor domba jantan
  rationale: אֵילִם adalah domba jantan dewasa dalam daftar korban, dibedakan dari anak domba yang disebut sesudahnya.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: empat belas ekor anak domba berumur satu tahun
  rationale: כְּבָשִׂים berarti anak domba, sedangkan idiom בְּנֵי שָׁנָה menyatakan usia sekitar atau dalam tahun pertama; 'berumur satu tahun' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: תְּמִימִם
  choice: yang tidak bercacat
  rationale: Dalam hukum korban, kata ini menyatakan bahwa hewan bebas dari cacat, bukan kesempurnaan abstrak.
