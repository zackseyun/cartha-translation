  text: וּ/בַ/יּ֧וֹם הַ/חֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: id
  text: 'Pada hari kelima: sembilan ekor sapi jantan[a], dua ekor domba jantan, dan empat belas ekor anak domba jantan berumur satu tahun, semuanya tidak bercacat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan pada hari kelima.” Teks Ibrani memakai kata penghubung pada awal ayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַחֲמִישִׁי
  choice: Pada hari kelima
  rationale: Ungkapan ini menyatakan waktu dalam rangkaian persembahan. Dalam bahasa Indonesia, konjungsi pembuka וּ dapat dibiarkan tersirat dalam gaya daftar; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: פָּרִים תִּשְׁעָה
  choice: sembilan ekor sapi jantan
  rationale: פָּרִים dalam konteks kurban menunjuk pada sapi jantan; kata penggolong 'ekor' menghasilkan bahasa Indonesia yang alami.
- source_word: אֵילִם שְׁנָיִם
  choice: dua ekor domba jantan
  rationale: אַיִל adalah domba jantan dewasa, dan terjemahan ini membedakannya dari anak domba yang disebut berikutnya.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: empat belas ekor anak domba jantan
  rationale: כְּבָשִׂים menunjuk pada anak domba, dan dalam daftar persembahan ini bentuknya dipahami sebagai jantan.
- source_word: בְּנֵי שָׁנָה
  choice: berumur satu tahun
  rationale: Idiom Ibrani ini secara alami menyatakan umur hewan dalam bahasa Indonesia.
- source_word: תְּמִימִם
  choice: semuanya tidak bercacat
  rationale: Dalam konteks kurban, תָּמִים berarti bebas dari cacat. 'Semuanya' memperjelas bahwa syarat ini berlaku bagi seluruh hewan yang tercantum.
