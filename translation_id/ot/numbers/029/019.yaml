lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: serta seekor kambing jantan
  rationale: Ungkapan Ibrani ini merupakan istilah kurban yang lazim untuk kambing jantan; 'seekor' menyatakan jumlah satu secara alami dalam bahasa Indonesia.
- source_word: חַטָּאת
  choice: sebagai persembahan penghapus dosa
  rationale: Dalam konteks peraturan kurban, kata ini menunjuk pada jenis persembahan untuk menangani dosa, bukan sekadar pada dosa sebagai gagasan abstrak.
- source_word: מִ/לְּ/בַד
  choice: di samping
  rationale: Menunjukkan bahwa persembahan ini diberikan sebagai tambahan pada rangkaian persembahan yang sudah ditetapkan.
- source_word: עֹלַת הַ/תָּמִיד
  choice: persembahan bakaran yang tetap
  rationale: '''Yang tetap'' menyampaikan sifatnya sebagai persembahan yang dilakukan terus menurut ketetapan, tanpa membatasi artinya secara eksplisit menjadi ''harian''.'
- source_word: וּ/מִנְחָתָ/הּ
  choice: persembahan sajian yang menyertainya
  rationale: Dalam peraturan kurban, מִנְחָה menunjuk pada persembahan berbahan hasil bumi; sufiks tunggal feminin merujuk kepada persembahan bakaran.
- source_word: וְ/נִסְכֵּי/הֶם
  choice: persembahan-persembahan curahan yang menyertai semuanya itu
  rationale: Bentuk nomina dan sufiksnya jamak. Terjemahan ini mempertahankan kejamakan tersebut sambil menjelaskan secara wajar bahwa persembahan curahan itu menyertai keseluruhan rangkaian persembahan.
