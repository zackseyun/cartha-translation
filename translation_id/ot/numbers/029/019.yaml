  source_fidelity: Draf dengan tepat menerjemahkan kambing jantan, persembahan penghapus dosa, dan sifat tambahan dari rangkaian persembahan ini. Namun, frasa “yang menyertai semuanya itu” menafsirkan sufiks jamak Ibrani sebagai mencakup seluruh unsur yang baru disebut, termasuk kambing persembahan penghapus dosa. Rujukan jamak itu tidak sepenuhnya pasti; terjemahan sebaiknya mempertahankan ketidakpastian tersebut dan menjelaskannya dalam catatan.
  naturalness: Bahasa draf umumnya modern dan jelas. “Persembahan bakaran yang tetap” dapat dipahami dalam register peribadatan, dan alternatif “terus-menerus” di catatan membantu pembaca. “Persembahan sajiannya” lebih langsung dan alami daripada “persembahan sajian yang menyertainya.”
  terminology: “Kambing jantan,” “persembahan penghapus dosa,” “persembahan bakaran,” “persembahan sajian,” dan “persembahan curahan” sesuai dengan konteks kurban serta konsisten secara semantis. Bentuk jamak pada “persembahan-persembahan curahan” dipertahankan.
