base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: id
  text: Kurban sajian mereka dan kurban curahan mereka bagi lembu-lembu jantan, domba-domba jantan, dan anak-anak domba, sesuai dengan jumlahnya, menurut ketetapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut tata cara yang ditetapkan.” Bahasa Ibrani כַּמִּשְׁפָּט mengacu pada aturan yang telah ditetapkan tentang cara mempersembahkan kurban-kurban ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: kurban sajian
  rationale: Dalam konteks persembahan korban, מִנְחָה menunjuk pada persembahan hasil gandum atau serealia. Istilah baku dan alami dalam bahasa Indonesia Alkitabiah adalah “kurban sajian”; bentuk tunggal Ibrani dipahami secara kolektif.
- source_word: נִסְכֵּיהֶם
  choice: kurban curahan
  rationale: נֶסֶךְ adalah persembahan berupa minuman yang dicurahkan. “Kurban curahan” mempertahankan tindakan ritual tersebut dan lebih spesifik daripada sekadar “persembahan minuman”.
- source_word: לַפָּרִים
  choice: bagi lembu-lembu jantan
  rationale: פַּר menunjuk pada lembu jantan dalam daftar korban. Sumber tidak secara eksplisit menyatakan usia, sehingga unsur “muda” tidak ditambahkan.
- source_word: לָאֵילִם
  choice: domba-domba jantan
  rationale: אַיִל secara langsung berarti domba jantan dalam konteks korban.
- source_word: וְלַכְּבָשִׂים
  choice: dan anak-anak domba
  rationale: כֶּבֶשׂ berarti anak domba. Jenis kelaminnya tidak diperjelas dalam terjemahan karena ayat ini tidak menuntut penambahan tersebut.
- source_word: בְּמִסְפָּרָם
  choice: sesuai dengan jumlahnya
  rationale: Frasa ini menyatakan bahwa persembahan pengiring disesuaikan dengan jumlah hewan yang telah ditetapkan.
- source_word: כַּמִּשְׁפָּט
  choice: menurut ketetapan
  rationale: מִשְׁפָּט di sini mengacu pada aturan atau tata cara yang telah ditetapkan bagi pelaksanaan persembahan. “Ketetapan” mempertahankan nuansa normatif dan legal-kultisnya.
