  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat konsisten dan mudah dipahami. Penunjuk “itu” membantu mengaitkan kelompok hewan dengan daftar pada konteks sebelumnya tanpa menambahkan informasi baru.
