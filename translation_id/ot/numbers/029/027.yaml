  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: id
  text: beserta persembahan sajian mereka dan persembahan curahan mereka untuk lembu-lembu jantan, domba-domba jantan, dan anak-anak domba, sesuai dengan jumlahnya, menurut ketetapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menurut tata cara yang ditetapkan.” Kata Ibrani מִשְׁפָּט di sini dapat menunjuk pada aturan maupun prosedur baku bagi persembahan-persembahan ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: persembahan sajian
  rationale: Dalam konteks kurban, מִנְחָה menunjuk pada persembahan berbahan hasil bumi yang menyertai kurban bakaran. Istilah ini lebih tepat daripada 'persembahan' saja.
- source_word: נִסְכֵּיהֶם
  choice: persembahan curahan
  rationale: נֶסֶךְ adalah persembahan cairan yang dicurahkan. 'Persembahan curahan' jelas, lazim dalam bahasa keagamaan Indonesia, dan lebih mudah dipahami daripada istilah teknis asing.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: untuk lembu-lembu jantan, domba-domba jantan, dan anak-anak domba itu
  rationale: Prefiks ל־ menyatakan hubungan atau peruntukan persembahan pendamping bagi tiap golongan hewan. Kata 'itu' mengaitkan daftar ini dengan hewan-hewan yang disebut dalam ayat sebelumnya.
- source_word: בְּמִסְפָּרָם
  choice: sesuai dengan jumlahnya
  rationale: Frasa ini menunjukkan bahwa persembahan pendamping disesuaikan dengan jumlah hewan. Bentuk '-nya' mempertahankan rujukan kolektif teks Ibrani tanpa penjelasan tambahan.
- source_word: כַּמִּשְׁפָּט
  choice: menurut ketetapan
  rationale: מִשְׁפָּט di sini menunjuk pada aturan atau tata cara kurban yang telah ditetapkan. 'Menurut ketetapan' mempertahankan nuansa resmi dan kultisnya.
- source_word: וּ
  choice: beserta
  rationale: Ayat ini secara sintaksis melanjutkan daftar kurban pada ayat sebelumnya. 'Beserta' secara alami menyatakan bahwa persembahan sajian dan curahan menyertai kurban-kurban tersebut.
