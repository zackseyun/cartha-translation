  source_fidelity: Teks Indonesia dengan tepat menyampaikan וַיֹּאמֶר sebagai “berfirman”, mempertahankan nama Yahweh, kedua penerima ujaran, hubungan Eleazar sebagai anak Harun, dan fungsi pengantar לֵאמֹר melalui “demikian:”. “Kemudian” merupakan penanda kelanjutan naratif yang dapat diterima untuk waw konseku­tif, tanpa menambahkan makna substantif.
  naturalness: Bahasa Indonesia baku, jelas, dan bernada wajar untuk narasi kitab suci. Susunan “kepada Musa dan kepada Eleazar” jelas menandai dua penerima. “Demikian:” secara idiomatis mengantar ujaran yang berlanjut pada ayat berikutnya.
  terminology: “Yahweh” konsisten dengan keputusan penerjemahan nama ilahi. “Imam Harun” secara alami menyatakan bahwa הַכֹּהֵן menerangkan Harun; kapitalisasi gelar juga lazim dalam penyebutan tokoh tertentu. Tidak diperlukan catatan kaki bahasa Indonesia karena tidak ada ambiguitas atau keputusan tekstual yang perlu diikat pada penanda.
