id: NUM.26.1
reference: Numbers 26:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh berfirman kepada Musa dan kepada Eleazar, anak Imam Harun, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari אמר berarti ‘berkata’. Karena subjeknya Yahweh, ‘berfirman’ merupakan padanan Indonesia yang alami dan bermartabat untuk tindakan berbicara ilahi tanpa mengubah isi verba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה וְאֶל־אֶלְעָזָר
  choice: kepada Musa dan kepada Eleazar
  rationale: Pengulangan preposisi אֶל dipertahankan agar kedua penerima firman tetap dinyatakan secara sejajar.
- source_word: בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: anak Imam Harun
  rationale: 'Secara sintaksis, הַכֹּהֵן paling wajar menerangkan Harun: ‘anak Harun, sang imam’. Dalam bahasa Indonesia, ‘anak Imam Harun’ menyampaikan hubungan dan gelar tersebut dengan alami.'
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif לֵאמֹר memperkenalkan kutipan langsung pada ayat berikutnya. ‘Demikian:’ menjalankan fungsi wacana itu secara alami dan menghindari rangkaian canggung ‘berfirman ... dengan berkata’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat nama diri ilahi, sehingga transliterasi ‘Yahweh’ mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Acuan gelar הַכֹּהֵן
  choice: Imam Harun
  alternative: Eleazar, anak Harun, imam itu
  rationale: Susunan konstruksi בֶּן־אַהֲרֹן diikuti הַכֹּהֵן secara paling alami menjadikan ‘imam’ sebagai aposisi bagi Harun, sejalan dengan identitas Harun dalam konteks Taurat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kemudian’ menandai kelanjutan narasi; ‘berfirman’ lazim untuk ujaran Allah; tanda titik dua secara alami mengantar isi firman pada ayat berikutnya.
