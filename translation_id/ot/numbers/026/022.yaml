translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah 'kaum' dipakai bagi subdivisi kekerabatan dalam suku, sedangkan 'terhitung' mempertahankan corak formula sensus Ibrani tanpa menjadi terlalu teknis.
