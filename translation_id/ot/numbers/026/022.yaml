  source_fidelity: Makna pokok dan jumlahnya tepat. Namun, לִפְקֻדֵיהֶם secara langsung berarti “menurut/berdasarkan jumlah (sensus) mereka” atau “menurut yang terdaftar dari mereka”; frasa “di antara mereka” menambahkan relasi lokatif yang tidak dinyatakan secara eksplisit dan membuat formula sensusnya kurang tepat.
