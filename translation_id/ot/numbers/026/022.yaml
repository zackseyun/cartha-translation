  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: id
  text: 'Inilah marga-marga Yehuda menurut jumlah mereka yang terdaftar: 76.500 orang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut jumlah mereka”; ungkapan Ibrani לִפְקֻדֵיהֶם menunjuk kepada mereka yang didaftarkan atau dihitung dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Demonstratif jamak ini memperkenalkan ringkasan hasil sensus; bahasa Indonesia tidak perlu menandai kala lampau pada kopula.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks suku Israel, istilah ini menunjuk kelompok-kelompok kekerabatan di dalam sebuah suku; 'kaum' lebih tepat daripada 'keluarga' yang dapat dipahami sebagai keluarga inti.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut orang-orang yang terhitung di antara mereka
  rationale: Mempertahankan nuansa sensus dari akar פקד serta hubungan pronominal dengan kaum-kaum Yehuda, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 76.500 orang
  rationale: Menyajikan jumlah yang tepat dalam format angka Indonesia; penambahan 'orang' memperjelas bahwa angka itu merupakan jumlah hasil sensus.
