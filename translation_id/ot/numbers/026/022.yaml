  terminology: “Yehuda” tepat. “Marga-marga” secara konsisten menyampaikan מִשְׁפְּחֹת sebagai unit kekerabatan di dalam suku tanpa menyamakannya dengan keluarga inti. “terdaftar” mempertahankan nuansa pendataan/sensus dari פקד.
