revisions:
- from: Kepada kelompok yang lebih besar harus kauberikan milik pusaka yang lebih besar, dan kepada kelompok yang lebih kecil harus kauberikan milik pusaka yang lebih kecil. Milik pusaka setiap kelompok harus diberikan menurut jumlah orang yang terdaftar di dalamnya.[a]
  to: Kepada kelompok yang lebih besar harus kauperbesar milik pusakanya, dan kepada kelompok yang lebih kecil harus kauperkecil milik pusakanya. Milik pusaka masing-masing harus diberikan menurut jumlah orang yang terdaftar baginya.[a]
  rationale: Revisi memulihkan paralelisme verba kausatif dalam bahasa Ibrani ('kauperbesar'/'kauperkecil'), sambil tetap memakai istilah Indonesia yang baku. Klausa terakhir mempertahankan sifat distributif dan hubungan antara bagian pusaka dengan jumlah yang terdaftar, tanpa menyatakan secara berlebihan bahwa setiap laki-laki menerima tanah secara individual.
