base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: id
  text: Kepada kelompok yang lebih besar harus kauperbesar milik pusakanya, dan kepada kelompok yang lebih kecil harus kauperkecil milik pusakanya. Milik pusaka masing-masing harus diberikan menurut jumlah orang yang terdaftar baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “milik pusaka masing-masing harus diberikan menurut orang-orangnya yang terdaftar.” Bentuk tunggal dalam bahasa Ibrani digunakan secara distributif; dalam konteks ini, bagian setiap kelompok ditentukan berdasarkan hasil sensusnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: kepada kelompok yang lebih besar
  rationale: Dalam konteks sensus dan pembagian tanah, רַב dipakai secara substantival untuk kelompok yang jumlah anggotanya lebih besar.
- source_word: תַּרְבֶּה נַחֲלָתוֹ
  choice: harus kauberikan milik pusaka yang lebih besar
  rationale: Secara harfiah berarti 'harus kauperbesar milik pusakanya'; rumusan ini menyampaikan tindakan memberikan bagian tanah yang lebih besar secara alami dalam bahasa Indonesia.
- source_word: וְלַמְעַט
  choice: dan kepada kelompok yang lebih kecil
  rationale: מְעַט dipakai secara substantival dan berlawanan dengan רַב, yakni kelompok dengan jumlah anggota lebih sedikit.
- source_word: תַּמְעִיט נַחֲלָתוֹ
  choice: harus kauberikan milik pusaka yang lebih kecil
  rationale: Secara harfiah berarti 'harus kauperkecil milik pusakanya'; pilihan ini menjelaskan perbandingan besarnya jatah tanpa mengubah maksud.
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Istilah ini menunjuk pada tanah warisan atau bagian tanah yang ditetapkan; 'milik pusaka' mempertahankan dimensi warisan dan kepemilikan.
- source_word: אִישׁ
  choice: setiap kelompok
  rationale: אִישׁ berbentuk tunggal dan digunakan secara distributif. Dalam konteks ini acuannya adalah tiap kelompok sensus yang menerima bagian, sehingga terjemahan ini menghindari kesan keliru bahwa setiap laki-laki menerima jatah tanah tersendiri.
- source_word: לְפִי פְקֻדָיו
  choice: menurut jumlah orang yang terdaftar di dalamnya
  rationale: Ungkapan ringkas ini mengaitkan besarnya jatah tiap kelompok dengan orang-orang yang tercatat dalam sensus kelompok tersebut.
- source_word: יֻתַּן
  choice: harus diberikan
  rationale: Bentuk pasif נתן berarti 'diberikan'; 'harus' sesuai dengan daya perintah dari konteks ketentuan pembagian.
