  text: To Aaron were born Nadab and Abihu[a], Eleazar and Ithamar.
translation:
  language: id
  text: Bagi Harun lahirlah Nadab dan Abihu, Eleazar dan Itamar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, teks Ibrani memakai verba tunggal dalam formula silsilah ini untuk memperkenalkan daftar beberapa anak: “Bagi Harun lahirlah Nadab dan Abihu, Eleazar dan Itamar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: lahirlah
  rationale: Bentuk Nifal dari ילד menyatakan bahwa anak-anak itu lahir. Walaupun verba Ibrani berbentuk tunggal dalam formula silsilah ini, bahasa Indonesia tidak menandai jumlah pada verba, sehingga bentuk alami “lahirlah” tetap mempertahankan susunan sumber.
- source_word: לְאַהֲרֹן
  choice: bagi Harun
  rationale: Preposisi לְ menandai orang tua yang baginya anak-anak itu lahir. “Bagi Harun lahirlah” mempertahankan arah konstruksi Ibrani tanpa mengubahnya menjadi bentuk aktif seperti “Harun memperanakkan”.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: tidak diterjemahkan tersendiri
  rationale: Partikel אֶת berulang kali menandai nama-nama dalam daftar, tetapi tidak mempunyai padanan leksikal langsung dalam bahasa Indonesia.
- source_word: נָדָב
  choice: Nadab
  rationale: Transliterasi baku nama pribadi ini dalam Alkitab bahasa Indonesia.
- source_word: אֲבִיהוּא
  choice: Abihu
  rationale: Transliterasi baku nama pribadi ini dalam Alkitab bahasa Indonesia.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Transliterasi baku nama pribadi ini dalam Alkitab bahasa Indonesia.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Transliterasi baku Indonesia untuk nama pribadi ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan “Bagi Harun lahirlah” sengaja mempertahankan formula pasif Ibrani; bahasa Indonesia tidak membedakan verba tunggal dan jamak. Penanda catatan kaki ditempatkan sesudah seluruh daftar nama.
