  text: 'Kemudian Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”.'
