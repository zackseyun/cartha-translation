lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia, “Kemudian” menyatakan kelanjutan itu, sedangkan “berfirman” merupakan padanan wajar dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju oleh perkataan; “kepada Musa” adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif ini memperkenalkan isi perkataan yang menyusul. “kata-Nya” mempertahankan formula pengantar secara alami dalam bahasa Indonesia dan menghindari bentuk kaku “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri YHWH. Bentuk “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur formula ujaran ilahi dipertahankan, tetapi disusun secara alami bagi pembaca Indonesia.
