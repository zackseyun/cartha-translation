base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/039.yaml
  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: id
  text: Dari Syefufam[a], kaum Syufam; dari Hufam, kaum Hufam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk Syefufam untuk nama leluhur, tetapi bentuk Syufam untuk nama kaumnya. Tradisi tekstual dan terjemahan lain mencatat beberapa variasi ejaan nama ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: Dari Syefufam
  rationale: Dalam rumus sensus ini, prefiks לְ menyatakan hubungan asal-usul atau kelompok dan secara alami diterjemahkan “dari”. Nama Ibrani שְׁפוּפָם ditransliterasikan sebagai “Syefufam”, dengan membedakannya dari bentuk nisbah berikutnya.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus suku Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di dalam suku; “kaum” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: הַשּׁוּפָמִי
  choice: Sufam
  rationale: Bentuk nisbah ini secara harfiah menunjuk kepada kelompok keturunan Sufam. Dalam bahasa Indonesia, konstruksi “kaum Sufam” menyampaikan makna kolektif itu secara alami sekaligus mempertahankan perbedaan bentuk dalam teks Ibrani antara Syefufam dan Sufam.
- source_word: לְחוּפָם
  choice: dari Hufam
  rationale: Prefiks לְ kembali memperkenalkan leluhur asal suatu kaum dalam daftar, sehingga diterjemahkan secara konsisten sebagai “dari”.
- source_word: הַחוּפָמִי
  choice: Hufam
  rationale: Bentuk nisbah ini menunjuk kepada keturunan Hufam; ungkapan “kaum Hufam” sudah menyatakan arti kolektifnya tanpa membentuk demonim yang tidak alami dalam bahasa Indonesia.
