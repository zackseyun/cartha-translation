  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: id
  text: 'Inilah kaum-kaum keturunan Zebulon menurut jumlah orang yang terdaftar di antara mereka: 60.500 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Bentuk penunjuk jamak ini memperkenalkan ringkasan hasil sensus; “Inilah” alami dan bermartabat dalam bahasa Indonesia.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks kesukuan dan sensus, kata ini menunjuk pada kelompok kekerabatan besar di dalam suatu suku, bukan sekadar keluarga inti.
- source_word: הַזְּבוּלֹנִי
  choice: keturunan Zebulon
  rationale: Bentuk nisbah tunggal dengan kata sandang dipakai secara kolektif bagi anggota suku yang berasal dari Zebulon; “keturunan Zebulon” jelas dan idiomatis.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut jumlah orang yang terdaftar di antara mereka
  rationale: Frasa dari akar פקד dipakai dalam arti sensus dan menghubungkan kaum-kaum itu dengan jumlah anggota yang didata.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 60.500 orang
  rationale: Angka ditulis dengan format numerik Indonesia agar mudah dibaca; penambahan “orang” menyatakan dengan wajar apa yang dihitung dan tersirat dalam konteks sensus.
