  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: id
  text: 'Inilah kaum-kaum keturunan Lewi: kaum Libni[a], kaum Hebron, kaum Mahli, kaum Musi, dan kaum Korah. Dan Kehat memperanakkan Amram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompok-kelompok keluarga”; kata Ibrani yang digunakan menunjuk pada kelompok kekerabatan di dalam suatu suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: kaum-kaum / kaum
  rationale: Dalam konteks sensus dan silsilah suku, istilah ini menunjuk pada kelompok kekerabatan di bawah tingkat suku, bukan sekadar keluarga inti. “Kaum” alami dalam bahasa Indonesia Alkitabiah-modern dan mempertahankan cakupan sosial tersebut.
- source_word: לֵוִי
  choice: Lewi
  rationale: Nama leluhur suku ditransliterasikan menurut bentuk Indonesia yang sudah lazim.
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: kaum Libni / Hebron / Mahli / Musi / Korah
  rationale: Bentuk-bentuk nisbah Ibrani menamai kelompok keturunan yang terkait dengan tokoh tersebut. Pola “kaum + nama leluhur” lebih jelas dan alami daripada menciptakan adjektiva etnis yang tidak lazim dalam bahasa Indonesia.
- source_word: וּקְהָת
  choice: Kehat
  rationale: Nama diri memakai bentuk Indonesia yang lazim. Konjungsi waw tidak dinyatakan tersendiri karena pergantian dari daftar kaum ke keterangan silsilah sudah jelas dalam bahasa Indonesia dan “dan” akan terasa kurang alami.
- source_word: הוֹלִד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam rumus silsilah berarti menjadi ayah atau menghasilkan keturunan. “Memperanakkan” mempertahankan hubungan genealogis laki-laki secara ringkas tanpa memakai bentuk arkais “memperanakkanlah” atau penjelasan tambahan.
- source_word: עַמְרָם
  choice: Amram
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Klausa Ibrani tidak memiliki kopula. “Inilah” merupakan padanan idiomatis untuk memperkenalkan daftar dalam narasi sensus tanpa memaksakan penandaan waktu yang tidak dinyatakan dalam sumber.
