  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “kaum” dipilih agar unit kekerabatan lebih luas daripada keluarga inti tetap jelas. Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
