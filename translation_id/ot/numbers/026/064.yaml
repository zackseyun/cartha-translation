  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: id
  text: Namun, di antara mereka[a] tidak ada seorang laki-laki pun dari antara orang-orang yang dihitung oleh Musa dan Imam Harun, yang telah menghitung anak-anak Israel[b] di padang belantara Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan di antara mereka”; kata penghubung Ibrani dapat diterjemahkan “dan”, tetapi dalam konteks ini kemungkinan menyatakan pertentangan dengan ayat sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Israel”; ini adalah sebutan kolektif tradisional bagi orang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Namun, di antara mereka
  rationale: Konjungsi ו dapat menyatakan pertentangan dalam konteks ini, sedangkan בְּ berarti 'di antara'. 'Mereka' merujuk secara alami kepada orang-orang yang baru saja dihitung.
- source_word: לֹא הָיָה אִישׁ
  choice: tidak ada seorang pun
  rationale: Ungkapan ini menegaskan bahwa tidak satu individu pun dari sensus terdahulu terdapat dalam kelompok tersebut; bentuk Indonesia ini alami dan tetap kuat.
- source_word: מִפְּקוּדֵי
  choice: yang termasuk orang-orang yang dihitung oleh
  rationale: Bentuk dari פקד menunjuk kepada mereka yang terdaftar dalam penghitungan sebelumnya, bukan sekadar kepada suatu catatan sensus abstrak.
- source_word: הַכֹּהֵן
  choice: Imam Harun
  rationale: Bahasa Indonesia secara alami menempatkan gelar sebelum nama. Tidak ditambahkan 'besar' karena teks Ibrani hanya menyebut הַכֹּהֵן, 'imam itu/imam'.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: yang telah menghitung
  rationale: Klausa relatif ini paling wajar dipahami dengan Musa dan Harun sebagai pelaku jamak; 'telah' menandai penghitungan terdahulu tanpa mengubah makna aspek secara berlebihan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan familial Ibrani dipertahankan tanpa memakai 'anak-anak lelaki Israel', yang dalam bahasa Indonesia dapat keliru dipahami hanya sebagai putra biologis langsung.
- source_word: בְּמִדְבַּר סִינָי
  choice: di padang belantara Sinai
  rationale: מִדְבָּר menunjuk wilayah liar atau tandus; 'padang belantara' merupakan padanan Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Cakupan gender dalam אִישׁ dan konteks sensus
  choice: seorang pun
  alternative: seorang laki-laki pun
  rationale: Sensus yang dirujuk memang mencatat laki-laki, tetapi idiom לֹא הָיָה אִישׁ terutama menegaskan ketiadaan satu orang pun dari kelompok itu. 'Seorang pun' alami dalam bahasa Indonesia dan tidak mengubah cakupan kelompok sensus yang sudah ditentukan konteks.
- issue: Ungkapan familial בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel
  rationale: '''Keturunan Israel'' mempertahankan hubungan genealogis-komunal dalam ungkapan Ibrani sekaligus menghindari kesan bahwa yang dimaksud hanya anak kecil atau putra langsung.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Musa dan Imam Harun' dipilih agar gelar הַכֹּהֵן jelas melekat hanya pada Harun. Tanda catatan kaki [a] ditempatkan sesudah frasa tersebut agar tidak memutus pembukaan ayat.
