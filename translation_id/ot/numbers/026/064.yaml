revisions:
- from: Namun, di antara mereka tidak ada seorang pun yang termasuk orang-orang yang dihitung oleh Musa dan Imam Harun,[a] yang telah menghitung keturunan Israel di padang belantara Sinai.
  to: Namun, di antara mereka[a] tidak ada seorang laki-laki pun dari antara orang-orang yang dihitung oleh Musa dan Imam Harun, yang telah menghitung anak-anak Israel[b] di padang belantara Sinai.
  rationale: Revisi memindahkan jangkar catatan konjungsi ke “Namun”, menyederhanakan konstruksi sensus, mempertahankan rujukan eksplisit kepada laki-laki sebagaimana dituntut konteks dan אִישׁ, serta memakai padanan idiomatis yang lebih dekat untuk בְּנֵי יִשְׂרָאֵל. Tidak ada penambahan teologis atau jabatan “imam besar”.
