  text: dari Ozni[a], kaum keturunan Ozni; dari Eri[b], kaum keturunan Eri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kaum Ozni.” Bahasa Ibrani memakai bentuk nisbah untuk menyebut kelompok keturunan Ozni.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kaum Eri.” Bahasa Ibrani memakai bentuk nisbah untuk menyebut kelompok keturunan Eri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: dari Ozni
  rationale: Dalam rumus silsilah-sensus ini, prefiks לְ memperkenalkan garis keturunan yang berasal dari seorang leluhur; “dari” merupakan padanan bahasa Indonesia yang alami. Nama diri ditransliterasikan sebagai “Ozni”.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks pembagian suku Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti. “Kaum” alami, ringkas, dan sesuai dengan konteks silsilah-sensus.
- source_word: הָ/אָזְנִי
  choice: keturunan Ozni
  rationale: Bentuk nisbah dengan artikel menunjuk pada kelompok yang berasal dari Ozni. Karena bahasa Indonesia tidak membentuk nama kelompok seperti bahasa Ibrani, “keturunan Ozni” menyampaikan hubungan tersebut dengan jelas.
- source_word: לְ/עֵרִי
  choice: dari Eri
  rationale: Seperti pada לְאָזְנִי, prefiks לְ berfungsi memperkenalkan garis keturunan dalam daftar ini. Nama diri ditransliterasikan sebagai “Eri”.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Istilah yang sama diterjemahkan secara konsisten dalam rumus daftar kaum yang berulang.
- source_word: הָ/עֵרִי
  choice: keturunan Eri
  rationale: Bentuk nisbah berartikel menunjuk pada kelompok keturunan Eri; “keturunan Eri” merupakan ungkapan Indonesia yang jelas dan wajar.
