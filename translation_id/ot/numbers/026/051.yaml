  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: id
  text: 'Inilah orang-orang yang terdaftar dari antara anak-anak Israel[a]: enam ratus satu ribu tujuh ratus tiga puluh orang.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang dihitung.” Bahasa Ibrani menunjuk kepada orang-orang yang dicatat dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk jamak ini memperkenalkan hasil akhir sensus; “Inilah” merupakan ungkapan Indonesia yang alami dan tetap dekat dengan fungsi teks sumber.
- source_word: פְּקוּדֵי
  choice: yang terdaftar
  rationale: Bentuk nominal dari פקד dalam konteks ini menunjuk kepada orang-orang yang dicatat dan dihitung dalam sensus, bukan sekadar kepada angka abstrak.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan ini secara harfiah berarti “anak-anak lelaki Israel,” tetapi di sini berfungsi sebagai sebutan kolektif bagi bangsa Israel; pilihan ini alami dalam bahasa Indonesia tanpa menghilangkan konteks pendataan laki-laki pada sensus tersebut.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: enam ratus satu ribu tujuh ratus tiga puluh orang
  rationale: Menyatakan jumlah keseluruhan 601.730 dengan susunan bilangan Indonesia yang baku; “orang” ditambahkan agar jelas bahwa angka itu menghitung pribadi-pribadi.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  alternative: anak-anak lelaki Israel; bani Israel
  rationale: Secara leksikal ungkapan itu bersifat maskulin dan familial, tetapi dalam ayat ini menjadi sebutan kolektif. “Orang-orang Israel” mudah dipahami pembaca modern, sedangkan konteks pasal tetap menunjukkan bahwa sensus ini menghitung laki-laki yang memenuhi syarat.
- issue: Makna פְּקוּדֵי dalam konteks sensus
  choice: yang terdaftar
  alternative: yang dihitung; jumlah hasil sensus
  rationale: Pilihan ini mempertahankan acuan kepada orang-orang yang dicatat dalam sensus dan tidak mengubahnya menjadi sekadar angka abstrak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “orang-orang Israel” dipilih agar lebih alami daripada terjemahan harfiah “anak-anak lelaki Israel,” sementara “yang terdaftar” mempertahankan nuansa sensus.
