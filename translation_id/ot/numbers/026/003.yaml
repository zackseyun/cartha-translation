  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: id
  text: 'Musa dan imam Eleazar berbicara kepada mereka di dataran Moab, di tepi Sungai Yordan dekat Yerikho[a], demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tepi Sungai Yordan, di seberang Yerikho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Bentuk naratif ini memperkenalkan ujaran langsung. “Berbicara” membedakannya secara wajar dari לֵאמֹר yang diterjemahkan “demikian”.
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: Musa dan Imam Eleazar
  rationale: Nama-nama memakai bentuk baku Indonesia. Gelar הַכֹּהֵן dipertahankan sebagai “Imam” tanpa menambahkan jabatan “imam besar” yang tidak dinyatakan dalam teks.
- source_word: אֹתָם
  choice: kepada mereka
  rationale: Dalam konstruksi dengan verba “berbicara”, pronomina objek ini secara alami menyatakan pihak yang diajak bicara.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עַרְבֹת menunjuk kawasan datar atau padang dataran; “dataran” jelas, alami, dan sesuai dengan nama geografis ini.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: di tepi Sungai Yordan dekat Yerikho
  rationale: Frasa tersebut menempatkan lokasi di sisi Yordan dalam kaitannya dengan Yerikho. “Di tepi ... dekat” merupakan ungkapan geografis Indonesia yang alami, sementara kemungkinan makna “di seberang Yerikho” dipertahankan dalam catatan kaki.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi ujaran yang menyusul. “Demikian:” menghindari pengulangan canggung “berbicara ... dengan berkata” dan tetap menandai pembukaan kutipan.
