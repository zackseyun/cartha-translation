  text: וַ/יִּהְי֣וּ בְנֵי פֶ֔רֶץ לְ/חֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽ/חֶצְרֹנִ֑י לְ/חָמ֕וּל מִשְׁפַּ֖חַת הֶ/חָמוּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: id
  text: 'Putra-putra Peres adalah: dari Hezron, kaum Hezron; dari Hamul, kaum Hamul.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Dalam rumusan sensus silsilah ini, היה berfungsi sebagai kopula yang memperkenalkan anak-anak Peres dan kaum yang berasal dari mereka; 'ialah' alami dan bermartabat dalam daftar formal.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Konteks langsung menyebut dua anak laki-laki Peres sebagai kepala garis keturunan. Bahasa Indonesia lazim memakai 'anak-anak' tanpa membedakan gender, sedangkan nama-nama berikut mempertahankan konteks genealogis laki-laki.
- source_word: פֶרֶץ
  choice: Peres
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan pelafalan Ibrani.
- source_word: לְחֶצְרֹן
  choice: dari Hezron
  rationale: Prefiks ל dalam rumusan sensus ini menandai pengelompokan atau asal-usul kaum; 'dari Hezron' mempertahankan struktur formula dan menyatakan bahwa kaum tersebut berasal darinya.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus Bilangan, מִשְׁפָּחָה adalah kelompok kekerabatan di bawah suku. 'Kaum' merupakan padanan Indonesia yang ringkas dan lazim untuk unit tersebut.
- source_word: הַחֶצְרֹנִי
  choice: orang Hezron
  rationale: Bentuk nisbah ini menunjuk kelompok keturunan Hezron. 'Orang Hezron' merupakan bentuk kelompok yang alami dalam bahasa Indonesia tanpa menambahkan informasi yang tidak terdapat dalam teks.
- source_word: לְחָמוּל
  choice: dari Hamul
  rationale: Seperti pada Hezron, prefiks ל menandai pengelompokan berdasarkan leluhur atau asal-usul kaum.
- source_word: הֶחָמוּלִי
  choice: orang Hamul
  rationale: Bentuk nisbah ini menunjuk kelompok keturunan Hamul; 'orang Hamul' menyampaikan makna kolektifnya secara jelas.
