source:
  edition: WLC
  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: id
  text: 'Keturunan Gad menurut kaum-kaum mereka: dari Zefon[a], kaum orang Zefon; dari Hagi, kaum orang Hagi; dari Syuni, kaum orang Syuni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian tradisi bahasa Inggris memakai “Zifion” dan “kaum orang Zifion” di sini (bandingkan Kejadian 46:16), tetapi Teks Masoret pada ayat ini berbunyi “Zefon” (צפון); karena itu, “Zefon” dipertahankan dalam teks utama.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Keturunan Gad
  rationale: Dalam daftar sensus dan silsilah, בְּנֵי menunjuk para keturunan dari leluhur suku. 'Keturunan Gad' lebih alami dalam bahasa Indonesia dan menghindari kesan bahwa yang dimaksud hanya anak-anak langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam konteks sensus menunjuk kelompok kekerabatan di dalam suku. 'Kaum' menyampaikan satuan klan dengan ringkas dan wajar.
- source_word: לִצְפוֹן
  choice: dari Zefon
  rationale: Prefiks ל dalam rumus silsilah ini menandai garis asal atau hubungan dengan leluhur; 'dari' menyatakannya secara alami.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: kaum orang Zefon
  rationale: Bentuk nisbah הַצְּפוֹנִי menamai kelompok yang berasal dari Zefon. 'Kaum orang Zefon' mempertahankan hubungan nama leluhur dan kelompok tanpa membentuk demonim Indonesia yang janggal.
- source_word: לְחַגִּי ... מִשְׁפַּחַת הַחַגִּי
  choice: dari Hagi, kaum orang Hagi
  rationale: Struktur sejajar dengan bagian sebelumnya; nama diri ditransliterasikan dan bentuk nisbah diterjemahkan sebagai kelompok keturunannya.
- source_word: לְשׁוּנִי ... מִשְׁפַּחַת הַשּׁוּנִי
  choice: dari Syuni, kaum orang Syuni
  rationale: Struktur genealogis yang sama dipertahankan. שׁ ditransliterasikan sebagai 'sy', sesuai bentuk nama Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
