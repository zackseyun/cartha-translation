translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya daftar silsilah yang ringkas dan bermartabat. 'Keturunan' dipilih daripada 'anak-anak', sedangkan 'kaum' dipakai untuk satuan kekerabatan dalam sensus. Semua unsur paralel teks Ibrani dipertahankan.
