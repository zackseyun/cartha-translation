  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: id
  text: 'Keturunan Benyamin menurut kaum-kaum mereka: dari Bela, kaum Bela; dari Asybel, kaum Asybel; dari Ahiram[a], kaum Ahiram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Masoret berbunyi “Ahiram”; beberapa tradisi teks memiliki bentuk nama yang sepadan dengan “Ahiam.”
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: Keturunan Benyamin
  rationale: Secara harfiah berarti “anak-anak lelaki Benyamin,” tetapi dalam konteks sensus kesukuan menunjuk kepada para keturunannya; “keturunan” lebih alami dan tidak memberi kesan bahwa yang dimaksud hanya putra langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di bawah tingkat suku. “Kaum” mempertahankan pembedaan dari suku dan lebih tepat daripada keluarga inti.
- source_word: לְבֶלַע ... מִשְׁפַּחַת הַבַּלְעִי
  choice: dari Bela, kaum orang Bela
  rationale: Prefiks לְ memperkenalkan leluhur asal setiap garis keturunan, sehingga “dari” menyatakan hubungan asal. Bentuk nisbah הַבַּלְעִי diungkapkan secara alami sebagai “orang Bela.”
- source_word: לְאַשְׁבֵּל ... מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: dari Asybel, kaum orang Asybel
  rationale: Mengikuti pola genealogis yang sama; ejaan “Asybel” menyesuaikan bunyi שׁ dengan ortografi Indonesia.
- source_word: לַאֲחִירָם ... מִשְׁפַּחַת הָאֲחִירָמִי
  choice: dari Ahiram, kaum orang Ahiram
  rationale: Mengikuti bacaan Teks Masoret אֲחִירָם dan mempertahankan pola paralel daftar kaum.
