id: NUM.26.33
reference: Numbers 26:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: id
  text: Zelafehad anak Hefer tidak mempunyai anak laki-laki, melainkan hanya anak perempuan. Nama anak-anak perempuan Zelafehad ialah Mahla, Noa[a], Hogla, Milka, dan Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noa di sini adalah nama salah seorang anak perempuan Zelafehad, bukan Nuh dalam kisah air bah.
    reason: cultural_note
lexical_decisions:
- source_word: וּצְלָפְחָד
  choice: Zelafehad
  rationale: Konjungsi waw tidak perlu dinyatakan dengan penanda temporal; nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן חֵפֶר
  choice: anak Hefer
  rationale: Dalam konteks silsilah, konstruksi ini secara alami menyatakan hubungan ayah-anak; bahasa Indonesia tidak perlu menambahkan kata 'dari'.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: tidak mempunyai anak laki-laki
  rationale: Ungkapan kepunyaan Ibrani harfiah 'tidak ada baginya anak-anak laki-laki' dialihkan secara idiomatis tanpa mengaburkan jenis kelamin yang dikontraskan dengan anak perempuan.
- source_word: כִּי אִם בָּנוֹת
  choice: melainkan hanya anak perempuan
  rationale: Konstruksi pengecualian dan pertentangan ini menegaskan bahwa ia memiliki anak perempuan, tetapi tidak memiliki anak laki-laki.
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Nama anak-anak perempuan Zelafehad ialah
  rationale: Kata Ibrani 'nama' berbentuk tunggal tetapi berfungsi kolektif sebelum sederet nama; bentuk Indonesia ini alami dan jelas.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka, dan Tirza
  rationale: Nama-nama diri ditransliterasikan ke ejaan Indonesia yang sederhana dan konsisten dengan bunyi konsonan sumber.
