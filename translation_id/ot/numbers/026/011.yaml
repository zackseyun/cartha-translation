  text: But the sons of Korah did not die[a].
translation:
  language: id
  text: Namun, anak-anak Korah tidak mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan anak-anak Korah tidak mati.” Konjungsi Ibrani dapat menyatakan hubungan sederhana dengan kalimat sebelumnya; “Namun” menonjolkan pertentangan dengan kematian yang disebutkan dalam konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Namun, anak-anak
  rationale: Konjungsi ו dapat berarti “dan”, tetapi dalam konteks ini bernuansa pertentangan dengan kematian yang baru disebutkan. בְנֵי secara harfiah berarti “anak-anak” dan sesuai dengan konteks silsilah.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לֹא
  choice: tidak
  rationale: Negasi Ibrani diterjemahkan secara langsung dan alami.
- source_word: מֵתוּ
  choice: mati
  rationale: Bentuk dari מות berarti “mati”; bersama לֹא, frasa ini secara wajar diterjemahkan “tidak mati”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Namun” dipilih untuk mengungkapkan kontras kontekstual, sementara catatan kaki mempertahankan kemungkinan bahwa konjungsi Ibrani hanya berarti “dan”.
