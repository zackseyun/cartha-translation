  text: לְ/יֵ֕צֶר מִשְׁפַּ֖חַת הַ/יִּצְרִ֑י לְ/שִׁלֵּ֕ם מִשְׁפַּ֖חַת הַ/שִּׁלֵּמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: id
  text: dari Yezer, kaum orang Yezer; dari Syilem, kaum orang Syilem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: dari Yezer
  rationale: Dalam rumus sensus ini, לְ memperkenalkan leluhur atau kepala kaum; dalam bahasa Indonesia, “dari” secara alami menyatakan asal-usul kaum tersebut. Nama יֵצֶר ditransliterasikan sebagai Yezer.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks suku dan sensus Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah tingkat suku, bukan sekadar keluarga inti. “Kaum” ringkas, wajar, dan sesuai dengan konteks silsilah.
- source_word: הַיִּצְרִי
  choice: orang Yezer
  rationale: Bentuk nisbah ini menunjuk kepada kelompok keturunan Yezer. “Orang Yezer” mempertahankan hubungan yang jelas dengan nama leluhur dan terdengar alami dalam rumus “kaum orang Yezer”.
- source_word: לְ/שִׁלֵּם
  choice: dari Syilem
  rationale: Seperti pada bagian pertama ayat, לְ menyatakan asal-usul kelompok dalam daftar sensus. Nama שִׁלֵּם ditransliterasikan sebagai Syilem menurut pola ejaan Indonesia.
- source_word: הַשִּׁלֵּמִי
  choice: orang Syilem
  rationale: Bentuk nisbah ini menamai kelompok keturunan Syilem. “Orang Syilem” menyampaikan hubungan genealogis itu secara jelas tanpa menciptakan bentuk etnonim Indonesia yang terasa kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur paralel teks Ibrani dipertahankan. Istilah “kaum” dipilih untuk kelompok kekerabatan dalam struktur suku Israel; nama-nama ditransliterasikan dengan ejaan yang mudah dibaca penutur Indonesia.
