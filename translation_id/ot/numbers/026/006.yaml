base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/006.yaml
  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: id
  text: dari Hezron[a], kaum Hezron; dari Karmi, kaum Karmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi Hezron ... bagi Karmi”; kata depan Ibrani dapat diterjemahkan lebih harfiah demikian, tetapi dalam konteks sensus ini kata tersebut menunjukkan asal-usul atau penggolongan menurut garis keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: dari Hezron
  rationale: Dalam rumusan sensus ini, prefiks לְ menandai asal-usul atau penggolongan berdasarkan garis keturunan. 'Dari Hezron' menyampaikan hubungan genealogis itu secara alami dalam bahasa Indonesia.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus dan silsilah, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di dalam suku. 'Kaum' merupakan istilah Indonesia yang wajar dan lebih luas daripada keluarga inti.
- source_word: הַֽ/חֶצְרוֹנִי
  choice: orang Hezron
  rationale: Bentuk nisbah ini menyebut kelompok keturunan yang terkait dengan Hezron. 'Orang Hezron' mempertahankan pengertian kolektif tanpa menciptakan bentuk demonym yang kaku.
- source_word: לְ/כַרְמִי
  choice: dari Karmi
  rationale: Seperti pada לְחֶצְרֹן, prefiks לְ menandai asal-usul atau klasifikasi genealogis; 'dari Karmi' mengungkapkannya secara jelas dan alami.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Istilah sensus yang sama diterjemahkan secara konsisten untuk mempertahankan kesejajaran struktur ayat.
- source_word: הַ/כַּרְמִי
  choice: orang Karmi
  rationale: Bentuk nisbah ini menunjuk secara kolektif kepada kelompok keturunan Karmi. 'Orang Karmi' sejajar dengan 'orang Hezron' dan mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel teks Ibrani dipertahankan; 'kaum' dipilih untuk satuan kekerabatan dalam sensus, sedangkan nama diri ditulis menurut bentuk Indonesia yang lazim, Hezron dan Karmi.
