lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak
  rationale: Dalam rumus silsilah ini, בְנֵי berbentuk jamak secara gramatikal, tetapi hanya satu nama yang menyusul. Bahasa Indonesia secara alami dapat memakai bentuk tak bertanda jumlah, “anak,” sehingga tetap dekat dengan makna hubungan langsung tanpa menghasilkan konstruksi yang janggal. Konjungsi ו tidak dinyatakan tersendiri karena ayat ini melanjutkan daftar dan “Dan anak Palu” kurang alami sebagai ayat mandiri dalam bahasa Indonesia.
- source_word: פַלּוּא
  choice: Palu
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; konsonan rangkap dalam bentuk Latin Inggris tidak perlu dipertahankan.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Nama pribadi ditransliterasikan dengan bentuk Indonesia yang sudah mapan.
