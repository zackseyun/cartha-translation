  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: id
  text: Inilah kelompok-kelompok kekerabatan orang Ruben. Jumlah mereka yang terdaftar[a] adalah empat puluh tiga ribu tujuh ratus tiga puluh orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang dihitung” atau “mereka yang didata.” Istilah Ibrani ini menunjuk pada orang-orang yang dihitung dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks sensus dan suku di Bilangan, kata ini menunjuk pada kelompok-kelompok kekerabatan di dalam suatu suku, bukan keluarga inti. 'Kaum' merupakan padanan Indonesia yang alami untuk unit sosial tersebut.
- source_word: הָרֻאוּבֵנִי
  choice: keturunan Ruben
  rationale: Bentuk gentilika ini menunjuk pada para anggota atau keturunan suku Ruben. Ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: פְקֻדֵיהֶם
  choice: orang yang terhitung dari mereka
  rationale: Dalam konteks sensus, bentuk dari פקד ini menunjuk pada orang-orang yang didata atau dihitung. Pilihan ini mempertahankan nuansa pasif sensus tanpa menyisipkan kategori yang tidak diulangi secara eksplisit dalam ayat ini.
- source_word: וַיִּהְיוּ
  choice: jumlah ... adalah
  rationale: Konstruksi ini menyampaikan total hasil penghitungan secara alami dalam bahasa Indonesia.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: empat puluh tiga ribu tujuh ratus tiga puluh
  rationale: Bilangan ditulis dengan kata-kata agar mempertahankan gaya sastra daftar sensus Ibrani dan tetap mudah dibaca.
