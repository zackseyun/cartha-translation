base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: id
  text: Dari mereka yang berumur dua puluh tahun ke atas, sebagaimana Yahweh[a] perintahkan kepada Musa dan orang Israel[b] yang keluar dari tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “anak-anak Israel”; maksudnya bangsa atau orang Israel secara kolektif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: Yang berumur dua puluh tahun ke atas
  rationale: Ungkapan Ibrani ini menyatakan batas usia. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan kaitannya dengan perintah sensus pada konteks sebelumnya.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Menghubungkan pelaksanaan sensus dengan perintah ilahi sebelumnya secara ringkas dan alami.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk pasif dalam bahasa Indonesia menghasilkan susunan yang alami tanpa mengurangi kekuatan verba Ibrani yang berarti memberi perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: dan orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi merupakan sebutan kolektif baku bagi bangsa Israel; 'orang Israel' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַיֹּצְאִים
  choice: yang keluar
  rationale: Partisip Ibrani mengidentifikasi orang Israel sebagai generasi yang keluar dari Mesir; klausa relatif mempertahankan fungsi tersebut.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari negeri Mesir
  rationale: '''Negeri Mesir'' menyampaikan ungkapan geografis Ibrani dengan bahasa Indonesia modern yang alami.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Frasa pembuka dibiarkan sebagai kelanjutan eliptis dari perintah sensus dalam konteks sebelumnya, sebagaimana struktur teks Ibrani.
