  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: id
  text: 'Keturunan Asyer menurut kaum-kaum mereka: dari Yimna, kaum Yimna; dari Yiswi, kaum Yiswi; dan dari Beria, kaum Beria.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Keturunan Asyer
  rationale: Secara harfiah berarti ‘anak-anak lelaki Asyer’, tetapi dalam konteks sensus silsilah ungkapan ini menunjuk kepada keturunan Asyer yang membentuk kaum-kaum; ‘keturunan’ menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam daftar sensus Bilangan menunjuk pada kelompok kekerabatan di dalam suku. ‘Kaum’ lebih tepat daripada ‘keluarga’, yang dalam pemakaian modern biasanya berarti rumah tangga atau keluarga inti.
- source_word: לְיִמְנָה ... לְיִשְׁוִי ... לִבְרִיעָה
  choice: dari Yimna ... dari Yiswi ... dari Beria
  rationale: Prefiks ל dalam rumus silsilah berulang ini menandai kelompok yang berasal dari leluhur yang disebut; ‘dari’ merupakan padanan Indonesia yang ringkas dan idiomatis.
- source_word: מִשְׁפַּחַת הַיִּמְנָה ... מִשְׁפַּחַת הַיִּשְׁוִי ... מִשְׁפַּחַת הַבְּרִיעִי
  choice: kaum orang Yimna ... kaum orang Yiswi ... kaum orang Beria
  rationale: Bentuk-bentuk Ibrani ini adalah nisba yang menamai anggota kaum berdasarkan leluhur mereka. Pola ‘orang + nama’ alami dalam bahasa Indonesia dan menghindari pembentukan akhiran transliterasi asing.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya daftar silsilah yang ringkas dan bermartabat. Nama-nama ditransliterasikan langsung dari bentuk Ibrani Masoret: Asyer, Yimna, Yiswi, dan Beria. Istilah ‘kaum’ dipakai secara konsisten untuk unit kekerabatan sensus.'
