  source_fidelity: 'Terjemahan mempertahankan dua unsur paralel formula sensus Ibrani: leluhur yang menjadi asal kelompok (לְזֶרַח; לְשָׁאוּל) dan kaum/kelompok keturunannya (מִשְׁפַּחַת הַזַּרְחִי; מִשְׁפַּחַת הַשָּׁאוּלִי). "Dari" sesuai untuk relasi asal/keturunan dalam konteks daftar ini, tanpa memaksakan arti arah harfiah prefiks לְ.'
