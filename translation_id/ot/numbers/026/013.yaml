  text: לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִ֑י לְ/שָׁא֕וּל מִשְׁפַּ֖חַת הַ/שָּׁאוּלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/013.yaml
  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: id
  text: dari Zerah, kaum orang Zerah; dari Saul, kaum orang Saul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְזֶרַח
  choice: dari Zerah
  rationale: Dalam rumus sensus ini, prefiks לְ menandai hubungan keturunan atau asal kaum. 'Dari Zerah' menyampaikan hubungan itu secara ringkas dan wajar dalam daftar silsilah.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks suku dan sensus, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di dalam suku. 'Kaum' lebih tepat daripada 'keluarga' untuk satuan sosial yang lebih luas ini.
- source_word: הַזַּרְחִי
  choice: orang Zerah
  rationale: Bentuk nisba ini menyebut kelompok keturunan Zerah. 'Orang Zerah' merupakan ungkapan Indonesia yang jelas dan menjaga nama leluhur tanpa membentuk istilah yang terasa asing.
- source_word: לְשָׁאוּל
  choice: dari Saul
  rationale: Seperti pada unsur pertama, prefiks לְ menyatakan hubungan keturunan dalam rumus sensus.
- source_word: הַשָּׁאוּלִי
  choice: orang Saul
  rationale: Bentuk nisba ini menunjuk pada keturunan Saul. 'Orang Saul' sejajar dengan 'orang Zerah' dan mempertahankan pola berulang teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan berwibawa. Struktur paralel teks Ibrani dipertahankan; 'kaum' dipakai untuk kelompok kekerabatan dalam susunan suku. Ejaan nama 'Saul' dipilih sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
