  terminology: '"Kaum" tepat untuk מִשְׁפָּחָה sebagai subdivisi kekerabatan dalam suku. "Orang Zerah" dan "orang Saul" secara idiomatis menyampaikan bentuk gentilik Ibrani tanpa menciptakan bentuk etnonim Indonesia yang tidak lazim. Ejaan "Saul" selaras dengan pemakaian Alkitab Indonesia yang mapan.'
