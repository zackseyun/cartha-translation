  yaml_path: translation/ot/numbers/026/028.yaml
  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: id
  text: 'Anak-anak Yusuf, menurut kaum mereka: Manasye dan Efraim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Keturunan
  rationale: Secara harfiah berarti “anak-anak lelaki,” tetapi dalam konteks sensus suku frasa ini menunjuk pada garis keturunan Yusuf; “keturunan” terdengar alami dalam bahasa Indonesia dan tidak membatasi rujukannya hanya pada putra langsung.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Mengikuti bentuk baku nama tokoh ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di dalam susunan suku Israel berarti kelompok kekerabatan atau kaum, bukan sekadar keluarga inti; prefiks לְ menyatakan penggolongan menurut kelompok tersebut.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Mengikuti ejaan baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְאֶפְרָיִם
  choice: dan Efraim
  rationale: Konjungsi וְ diterjemahkan “dan,” sedangkan nama itu memakai bentuk baku bahasa Indonesia.
