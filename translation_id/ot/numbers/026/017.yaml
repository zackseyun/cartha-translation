  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: id
  text: Dari Arod[a], kaum keturunan Arod; dari Areli, kaum keturunan Areli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah, “Bagi Arod: kaum keturunan Arod; bagi Areli: kaum keturunan Areli.” Kata depan Ibrani ל memperkenalkan setiap nama leluhur dalam rumusan sensus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: Dari Arod
  rationale: Dalam rumusan sensus ini, prefiks ל memperkenalkan leluhur asal suatu kaum. “Dari Arod” menyampaikan hubungan keturunan secara alami dalam bahasa Indonesia sambil mempertahankan pola berulang ayat tersebut.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus dan kesukuan, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di dalam suatu suku. “Kaum” merupakan padanan Indonesia yang ringkas, alami, dan sesuai dengan konteks silsilah.
- source_word: הָאֲרוֹדִי
  choice: orang Arod
  rationale: Bentuk nisbah dengan kata sandang menamai kelompok keturunan Arod. “Orang Arod” membedakannya dari nama leluhur Arod dan terdengar lebih wajar daripada membentuk demonim Indonesia yang tidak lazim.
- source_word: לְאַרְאֵלִי
  choice: dari Areli
  rationale: Seperti לַאֲרוֹד, prefiks ל memperkenalkan leluhur yang menjadi asal kaum tersebut. “Dari Areli” mempertahankan kesejajaran rumusan.
- source_word: הָאַרְאֵלִי
  choice: orang Areli
  rationale: Bentuk nisbah ini menamai kelompok keturunan Areli. “Orang Areli” menyampaikan makna kolektifnya dengan jelas dan alami.
