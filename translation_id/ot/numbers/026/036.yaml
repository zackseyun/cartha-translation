  text: 'And these were the sons of Shuthelah: of Eran[a], the clan of the Eranites.'
translation:
  language: id
  text: 'Dan inilah keturunan[a] Sutelah: dari Eran, kaum Erani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani, “Dan inilah anak-anak laki-laki Sutelah: dari Eran, kaum Erani.” Dalam rumusan silsilah ini, “anak-anak laki-laki” dapat menunjuk pada keturunan atau cabang kaum, bukan hanya anak-anak kandung langsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan butir berikut dalam daftar sensus; dalam bahasa Indonesia, “Inilah” menyampaikan fungsi penunjuknya tanpa perlu mempertahankan kata sambung Ibrani secara kaku.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam rumusan silsilah ini, kata tersebut menunjuk pada garis keturunan atau cabang kaum, bukan semata-mata anak laki-laki langsung. “Keturunan” mencegah kesan keliru karena teks hanya menyebut Eran.
- source_word: שׁוּתָלַח
  choice: Sutelah
  rationale: Nama diri dialihaksarakan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: לְ/עֵרָן
  choice: dari Eran
  rationale: Prefiks לְ menandai cabang yang berasal dari Eran dalam pola daftar sensus. “Dari Eran” menyatakan hubungan asal-usul itu secara alami.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus Bilangan, kata ini menunjuk pada kelompok kekerabatan di bawah suku; “kaum” merupakan padanan Alkitabiah Indonesia yang ringkas dan dapat dipahami.
- source_word: הָ/עֵרָנִי
  choice: orang Eran
  rationale: Bentuk nisbah ini menunjuk pada kelompok yang dinamai menurut Eran. “Orang Eran” mempertahankan penamaan patronimik tanpa membentuk istilah Indonesia yang janggal.
