id: NUM.26.57
reference: Numbers 26:57
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה פְקוּדֵ֣י הַ/לֵּוִי֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/גֵרְשׁ֗וֹן מִשְׁפַּ֨חַת֙ הַ/גֵּ֣רְשֻׁנִּ֔י לִ/קְהָ֕ת מִשְׁפַּ֖חַת הַ/קְּהָתִ֑י לִ/מְרָרִ֕י מִשְׁפַּ֖חַת הַ/מְּרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: id
  text: 'Inilah orang-orang dari suku Lewi yang didata[a] menurut kaum mereka: dari Gerson, kaum Gerson; dari Kehat, kaum Kehat; dari Merari, kaum Merari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dihitung” atau “yang dicatat”. Bahasa Ibrani menunjuk orang-orang yang dimasukkan dalam daftar sensus, bukan sekadar kegiatan menghitung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Menghubungkan ayat ini dengan daftar sensus sebelumnya sekaligus memperkenalkan kelompok yang kini dirinci; bentuk ini lebih alami daripada terjemahan harfiah 'Dan inilah' dalam bahasa Indonesia.
- source_word: פְקוּדֵי
  choice: orang-orang ... yang didata
  rationale: Menunjuk secara konkret kepada orang-orang yang dicatat atau dihitung dalam sensus, bukan kepada tindakan pendataan yang abstrak.
- source_word: הַלֵּוִי
  choice: dari suku Lewi
  rationale: Bentuk tunggal ini berfungsi sebagai sebutan kesukuan. 'Dari suku Lewi' jelas dan alami serta tidak menimbulkan kesan bahwa yang dimaksud hanya satu orang Lewi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Dalam konteks sensus kesukuan, מִשְׁפָּחָה menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti; 'kaum' mempertahankan tingkat sosial tersebut dengan bahasa yang wajar.
- source_word: לְגֵרְשׁוֹן
  choice: dari Gerson
  rationale: Preposisi ל di sini memperkenalkan garis keturunan atau afiliasi kelompok; 'dari' menyampaikan hubungan asal-usul itu secara alami.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי
  choice: kaum Gerson
  rationale: Bentuk nisbah menunjuk kaum keturunan Gerson. Dalam bahasa Indonesia, 'kaum Gerson' lebih ringkas dan alami daripada membentuk istilah etnonim yang kurang lazim.
- source_word: לִקְהָת / מִשְׁפַּחַת הַקְּהָתִי
  choice: dari Kehat, kaum Kehat
  rationale: 'Mempertahankan pola genealogis yang sama: nama leluhur diikuti nama kaum keturunannya.'
- source_word: לִמְרָרִי / מִשְׁפַּחַת הַמְּרָרִי
  choice: dari Merari, kaum Merari
  rationale: Mempertahankan kesejajaran susunan Ibrani dan menyatakan hubungan keturunan dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Istilah 'kaum' dipakai bagi מִשְׁפָּחָה dalam konteks pembagian suku, sedangkan pengulangan nama leluhur dipertahankan agar pola genealogis Ibrani tetap tampak.
