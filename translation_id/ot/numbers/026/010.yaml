base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: id
  text: Lalu bumi membuka mulutnya dan menelan mereka dan Korah, ketika kelompok itu binasa, ketika api menghanguskan dua ratus lima puluh laki-laki; mereka pun menjadi tanda peringatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka pun menjadi suatu tanda.” Kata Ibrani נֵס dapat berarti tanda, isyarat, atau panji; “tanda peringatan” menyatakan fungsinya dalam konteks ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: bumi membuka mulutnya
  rationale: אֶרֶץ dapat berarti bumi atau tanah; gambaran tanah yang terbelah mendukung 'bumi', sedangkan 'membuka mulutnya' mempertahankan personifikasi Ibrani.
- source_word: וַתִּבְלַע אֹתָם וְאֶת־קֹרַח
  choice: menelan mereka bersama Korah
  rationale: Terjemahan ini mempertahankan pernyataan eksplisit bahwa mereka dan Korah menjadi objek tindakan menelan, tanpa menyelaraskannya secara diam-diam dengan perincian narasi lain.
- source_word: בְּמוֹת הָעֵדָה
  choice: ketika kumpulan itu binasa
  rationale: ב dengan infinitif מות bersifat temporal. 'Kumpulan' menyampaikan עֵדָה sebagai kelompok yang terlibat dalam konteks ini, dan 'binasa' lebih wajar daripada 'mati' untuk subjek kolektif.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: ketika api menghanguskan
  rationale: Ungkapan temporal dipertahankan; אכל secara harfiah berarti makan, tetapi dengan api sebagai subjek, 'menghanguskan' merupakan ungkapan Indonesia yang alami.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: dua ratus lima puluh orang
  rationale: Menyampaikan bilangan dan kata אִישׁ secara langsung serta alami dalam bahasa Indonesia.
- source_word: וַיִּהְיוּ לְנֵס
  choice: mereka pun menjadi tanda peringatan
  rationale: נֵס dapat berarti tanda, isyarat, atau panji. Dalam konteks penghukuman, 'tanda peringatan' menyatakan fungsi tanda itu, sementara pronomina jamak mempertahankan ketidakjelasan rujukannya.
theological_decisions:
- issue: Rujukan bentuk jamak dalam וַיִּהְיוּ לְנֵס
  choice: Mempertahankan 'mereka' tanpa menentukan apakah rujukannya khusus kepada 250 orang atau lebih luas kepada orang-orang yang dihukum.
  alternative: Menafsirkan rujukannya secara khusus sebagai 250 orang, atau sebagai seluruh peristiwa penghukuman.
  rationale: Bentuk jamak Ibrani tidak menetapkan anteseden secara sempit; terjemahan sebaiknya mempertahankan ambiguitas itu.
- issue: Hubungan Korah dengan tindakan ditelan dalam ayat ini
  choice: Menerjemahkan Korah sebagai bagian dari objek tindakan menelan dalam susunan kalimat ayat ini.
  alternative: Memisahkan Korah dari mereka yang ditelan berdasarkan rekonstruksi dari bagian narasi lain.
  rationale: Sintaks Ibrani ayat ini secara eksplisit menyebut 'mereka dan Korah'; terjemahan mengikuti bukti langsung tanpa harmonisasi interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur temporal Ibrani dipertahankan sejauh tetap terbaca alami. 'Kumpulan' dipilih untuk kelompok pemberontak dalam konteks ayat, bukan 'jemaat' yang dapat terdengar lebih institusional. Semua penanda catatan kaki yang disediakan muncul dalam teks utama.
