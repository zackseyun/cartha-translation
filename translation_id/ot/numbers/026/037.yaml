  text: אֵ֣לֶּה מִשְׁפְּחֹ֤ת בְּנֵי אֶפְרַ֨יִם֙ לִ/פְקֻ֣דֵי/הֶ֔ם שְׁנַ֧יִם וּ/שְׁלֹשִׁ֛ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת אֵ֥לֶּה בְנֵי יוֹסֵ֖ף לְ/מִשְׁפְּחֹתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: id
  text: 'Inilah kaum-kaum keturunan Efraim menurut jumlah mereka yang terdaftar: 32.500 orang.[a] Inilah keturunan Yusuf menurut kaum-kaum mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut pencatatan mereka”, “menurut jumlah mereka”, atau secara lebih idiomatis “sebagaimana mereka dihitung”. Ungkapan Ibrani ini memakai bahasa pencatatan sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks sensus dan susunan suku, kata ini menunjuk pada kelompok kekerabatan di dalam suatu suku. “Kaum” lebih tepat daripada “keluarga” yang dalam bahasa Indonesia modern biasanya berarti unit rumah tangga yang lebih kecil.
- source_word: בְּנֵי אֶפְרַיִם
  choice: keturunan Efraim
  rationale: Secara harfiah berarti “anak-anak Efraim”, tetapi dalam daftar silsilah dan sensus frasa ini mencakup para keturunannya; “keturunan Efraim” menyampaikan maksud itu secara alami tanpa mengaburkan hubungan genealogis.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut jumlah mereka yang terdaftar
  rationale: Bentuk dari פקד di sini memakai bahasa pencatatan sensus dan menunjuk kepada orang-orang yang didata serta jumlah mereka.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 32.500 orang
  rationale: Jumlah persisnya disajikan dalam tata angka Indonesia modern. Kata “orang” memperjelas elipsis bahwa angka tersebut adalah jumlah orang yang didata.
- source_word: בְנֵי יוֹסֵף
  choice: keturunan Yusuf
  rationale: Frasa genealogis ini mencakup mereka yang berasal dari Yusuf dan selaras dengan penerjemahan בְּנֵי אֶפְרַיִם.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Rumusan penutup ini mempertahankan pengelompokan berdasarkan unit-unit kekerabatan dan konsisten dengan מִשְׁפְּחֹת pada awal ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Kaum-kaum” dipakai untuk unit kekerabatan dalam suku, sedangkan “keturunan” dipilih daripada “anak-anak” agar idiom genealogis Ibrani dipahami secara wajar. Penanda catatan kaki [a] ditempatkan dalam teks utama.
