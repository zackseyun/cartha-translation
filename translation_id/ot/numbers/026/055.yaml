  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: id
  text: Hanya dengan undian tanah itu harus dibagi; mereka akan mewarisi tanah itu menurut nama-nama suku leluhur mereka dari pihak ayah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “leluhur mereka.” Secara harfiah, bahasa Ibrani berbunyi “bapak-bapak mereka,” yang menunjuk pada garis leluhur pihak ayah dalam suku-suku itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: hanya
  rationale: 'Dalam konteks ini partikel tersebut membatasi cara pembagian tanah: tanah harus dibagi hanya melalui undian.'
- source_word: בְּגוֹרָל
  choice: dengan undian
  rationale: Menunjukkan sarana yang dipakai untuk menentukan pembagian; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: יֵחָלֵק אֶת־הָאָרֶץ
  choice: tanah itu harus dibagi
  rationale: Bentuk Nifal menyatakan tindakan pasif, sedangkan bentuk imperfek dalam konteks perintah menetapkan keharusan.
- source_word: לִשְׁמוֹת מַטּוֹת
  choice: menurut nama suku
  rationale: Preposisi לְ menyatakan patokan atau acuan, dan מַטּוֹת dalam konteks ini berarti kelompok-kelompok suku.
- source_word: אֲבֹתָם
  choice: bapak leluhur mereka
  rationale: Mempertahankan unsur maskulin dari kata Ibrani dan penekanan pada garis leluhur pihak ayah, sambil memakai ungkapan Indonesia yang dapat dipahami.
- source_word: יִנְחָלוּ
  choice: mereka harus mewarisinya
  rationale: Kata kerja נחל berarti menerima atau memiliki sebagai warisan; akhiran -nya memperjelas bahwa yang diwarisi ialah tanah tersebut.
theological_decisions:
- issue: Istilah leluhur bergender dalam אֲבֹתָם
  choice: bapak leluhur mereka
  alternative: leluhur mereka
  rationale: Teks Ibrani secara khusus memakai istilah maskulin 'bapak-bapak mereka' dalam konteks garis keturunan dan warisan suku. Terjemahan utama mempertahankan penekanan itu tanpa menambahkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda titik koma mempertahankan hubungan erat antara pembagian melalui undian dan penerimaan warisan menurut suku.
