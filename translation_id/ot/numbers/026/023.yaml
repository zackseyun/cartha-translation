source:
  edition: WLC
  text: בְּנֵ֤י יִשָּׂשכָר֙ לְ/מִשְׁפְּחֹתָ֔/ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַ/תּוֹלָעִ֑י לְ/פֻוָ֕ה מִשְׁפַּ֖חַת הַ/פּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: id
  text: 'Keturunan Isakhar menurut kaum mereka: dari Tola, kaum orang Tola; dari Puwa[a], kaum orang Puni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Puwa dieja Pua dalam beberapa bagian terkait dan sejumlah terjemahan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Keturunan Isakhar
  rationale: Dalam daftar sensus, בְּנֵי menunjuk secara kolektif kepada keturunan dalam suatu suku. 'Keturunan' lebih alami dalam bahasa Indonesia daripada 'anak-anak lelaki' tanpa kehilangan hubungan garis keturunan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di bawah tingkat suku; 'kaum' membedakannya dari keluarga inti dan cocok dengan konteks sensus.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Nama diri ini ditransliterasikan, bukan diterjemahkan menurut arti kata bendanya.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: kaum orang Tola
  rationale: Bentuk nisbah הַתּוֹלָעִי menandai kelompok keturunan Tola. Ungkapan ini mempertahankan hubungan nama leluhur dan nama kaumnya secara wajar dalam bahasa Indonesia.
- source_word: לְפֻוָה
  choice: dari Puwa
  rationale: Prefiks לְ memperkenalkan leluhur asal tiap kaum. Ejaan WLC פֻוָה mendukung transliterasi 'Puwa' dalam kaidah Indonesia.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: kaum orang Puni
  rationale: Bentuk nisbah הַפּוּנִי adalah nama kelompok keturunan Puwa; 'orang Puni' mereproduksi bentuk nama kaum tanpa memaksakan bentuk nama leluhurnya.
