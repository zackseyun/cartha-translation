  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: id
  text: Jumlah mereka yang dihitung adalah 23.000 orang, yaitu semua laki-laki yang berumur satu bulan ke atas. Mereka tidak dihitung bersama keturunan Israel karena tidak ada milik pusaka yang diberikan kepada mereka di antara keturunan Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: jumlah mereka yang dihitung
  rationale: Dalam konteks sensus, bentuk ini menunjuk kepada orang-orang yang didata sekaligus menghasilkan jumlah keseluruhan; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan kaitan dengan tindakan menghitung.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: 23.000 orang
  rationale: Menyampaikan bilangan Ibrani secara lugas; 'orang' ditambahkan secara wajar karena yang dihitung adalah individu.
- source_word: כָּל זָכָר
  choice: semua laki-laki
  rationale: Tepat untuk mencakup setiap orang berjenis kelamin laki-laki, termasuk bayi yang disebut dalam frasa usia berikutnya.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: yang berumur satu bulan ke atas
  rationale: Padanan Indonesia modern yang alami untuk batas usia dalam konstruksi Ibrani tersebut.
- source_word: הָתְפָּקְדוּ
  choice: dihitung
  rationale: Mempertahankan hubungan leksikal dengan akar פקד dalam konteks sensus dan konsisten dengan klausa pertama.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: bersama ... / di antara keturunan Israel
  rationale: בְּנֵי יִשְׂרָאֵל secara harfiah bersifat genealogis. 'Keturunan Israel' mempertahankan nuansa itu dengan bahasa Indonesia yang alami; variasi preposisional mengikuti tuntutan sintaksis tiap klausa tanpa mengubah acuannya.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: tidak ada milik pusaka yang diberikan kepada mereka
  rationale: Mempertahankan konstruksi pasif dan memakai 'milik pusaka' untuk נחלה dalam konteks pembagian tanah turun-temurun.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: '''Keturunan Israel'' menjaga bentuk genealogis dan komunal ungkapan Ibrani tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak dalam arti usia.'
- issue: Makna נַחֲלָה dalam pembedaan orang Lewi dari suku-suku lain
  choice: milik pusaka
  alternative: warisan; tanah pusaka
  rationale: Teks menyatakan bahwa mereka tidak menerima נחלה di tengah Israel. 'Milik pusaka' mempertahankan cakupan istilah yang terkait jatah turun-temurun tanpa menambahkan kata 'tanah' secara eksplisit, meskipun konteksnya adalah pembagian wilayah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dua klausa panjang Ibrani dibagi menjadi dua kalimat agar mudah dipahami. Tidak diperlukan catatan kaki karena alternatif 'orang Israel' tidak mengubah makna secara substantif dan 'keturunan Israel' sudah mempertahankan nuansa sumber.
