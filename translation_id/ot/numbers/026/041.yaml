  yaml_path: translation/ot/numbers/026/041.yaml
  text: These were the sons of Benjamin by their clans, and those numbered from them were forty-five thousand six hundred.
translation:
  language: id
  text: Itulah keturunan Benyamin menurut kaum-kaum mereka. Jumlah orang yang terdaftar dari mereka adalah 45.600 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Dalam konteks sensus suku, בנים mencakup para keturunan yang disebut menurut garis keluarga, bukan hanya anak kandung langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk kelompok kekerabatan dalam struktur suku; 'kaum' merupakan padanan Indonesia yang alami dan sesuai konteks.
- source_word: וּפְקֻדֵיהֶם
  choice: Jumlah orang yang terdaftar dari mereka
  rationale: Bentuk pasif פקד dalam konteks sensus menyatakan mereka yang dihitung atau didaftarkan; susunan ini juga mempertahankan nuansa bahwa jumlah tersebut berasal dari kelompok-kelompok tadi.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 45.600 orang
  rationale: Angka ditulis dengan format numerik Indonesia agar segera terbaca, dan 'orang' ditambahkan secara wajar karena yang dihitung adalah manusia.
