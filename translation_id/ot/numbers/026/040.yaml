  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: id
  text: 'Anak-anak Bela ialah Ard dan Naaman: dari Ard berasal kaum Ardi, dan dari Naaman berasal kaum Naami.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ardi dan Naami adalah bentuk nama kaum yang diturunkan masing-masing dari Ard dan Naaman; maksudnya ialah kaum keturunan mereka.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי בֶלַע
  choice: Anak-anak Bela ialah
  rationale: Mempertahankan bentuk silsilah yang langsung. Dalam konteks sensus suku, בְנֵי dapat menunjuk kepada anak atau garis keturunan laki-laki, tetapi nama-nama yang disebut disajikan sebagai anak-anak Bela.
- source_word: אַרְדְּ וְנַעֲמָן
  choice: Ard dan Naaman
  rationale: Nama diri dialihaksarakan secara langsung ke dalam ejaan Indonesia.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks pembagian suku Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah tingkat suku; 'kaum' merupakan padanan Indonesia yang alami dan ringkas.
- source_word: לְ
  choice: dari ... berasal
  rationale: Dalam rumus silsilah ini, לְ menandai hubungan asal-usul atau afiliasi. Susunan 'dari X berasal' menyatakan hubungan keturunan dengan jelas dalam bahasa Indonesia.
- source_word: הָאַרְדִּי
  choice: Ardi
  rationale: Bentuk nisbah Ibrani yang diturunkan dari nama Ard dipertahankan sebagai nama kaum.
- source_word: הַנַּעֲמִי
  choice: Naami
  rationale: Bentuk nisbah Ibrani diturunkan dari Naaman, tetapi berbentuk נַעֲמִי (Naami), bukan sekadar pengulangan nama pribadi tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Rumus sensus-silsilah dibuat alami dengan 'dari ... berasal', sementara bentuk nama kaum Ibrani tetap dipertahankan.
