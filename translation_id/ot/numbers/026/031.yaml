id: NUM.26.31
reference: Numbers 26:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַ֨שְׂרִיאֵ֔ל מִשְׁפַּ֖חַת הָֽ/אַשְׂרִֽאֵלִ֑י וְ/שֶׁ֕כֶם מִשְׁפַּ֖חַת הַ/שִּׁכְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/031.yaml
  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: id
  text: dari Asriel, kaum Asriel; dan dari Sikhem, kaum Sikhem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: Asriel
  rationale: Nama ini memakai huruf שׂ (sin), sehingga bentuk “Asriel” mencerminkan pelafalan Ibrani dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus dan silsilah, kata ini menunjuk pada kelompok kekerabatan di dalam suatu suku. “Kaum” merupakan padanan Indonesia yang ringkas, wajar, dan sesuai dengan konteks daftar keturunan.
- source_word: הָאַשְׂרִיאֵלִי
  choice: kaum Asriel
  rationale: Bentuk nisbah dengan kata sandang menunjuk secara kolektif kepada kelompok keturunan Asriel. Dalam bahasa Indonesia, pengulangan “kaum Asriel” menyampaikan hubungan itu secara alami tanpa membentuk istilah etnik yang janggal.
- source_word: וְ
  choice: dan
  rationale: Kata sambung sederhana yang menghubungkan dua entri dalam daftar kaum.
- source_word: שֶׁכֶם
  choice: Sikhem
  rationale: Nama diri ini diterjemahkan dengan bentuk Indonesia yang sudah dikenal untuk nama Ibrani שֶׁכֶם; dalam konteks ini nama tersebut menunjuk kepada leluhur, bukan tempat.
- source_word: הַשִּׁכְמִי
  choice: kaum Sikhem
  rationale: Bentuk nisbah ini menunjuk secara kolektif kepada keturunan Sikhem; “kaum Sikhem” jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat ringkas dan bermartabat sesuai bentuk daftar sensus. Kata “dari” dipertahankan pada kedua bagian agar hubungan setiap kaum dengan leluhurnya jelas dalam bahasa Indonesia modern.
