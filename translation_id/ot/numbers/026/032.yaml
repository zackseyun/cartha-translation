  text: וּ/שְׁמִידָ֕ע מִשְׁפַּ֖חַת הַ/שְּׁמִידָעִ֑י וְ/חֵ֕פֶר מִשְׁפַּ֖חַת הַֽ/חֶפְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: id
  text: dari Semida, kaum orang Semida; dan dari Hefer, kaum orang Hefer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: dari Semida
  rationale: Dalam rumusan sensus yang eliptis ini, kata depan “dari” disediakan berdasarkan pola yang tersirat, sedangkan nama Ibrani ditransliterasikan sebagai Semida.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam daftar suku dan sensus, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah tingkat suku; “kaum” merupakan padanan Indonesia yang alami dan tepat dalam konteks ini.
- source_word: הַ/שְּׁמִידָעִי
  choice: orang Semida
  rationale: Bentuk nisbah ini menunjuk kepada kelompok keturunan yang dikaitkan dengan Semida. Ungkapan “orang Semida” menyampaikan hubungan tersebut secara alami tanpa menciptakan bentuk demonomina yang janggal.
- source_word: וְ/חֵפֶר
  choice: dan dari Hefer
  rationale: Kata sambung membuka unsur berikut dalam pola sensus yang berulang; “dari” disediakan agar elipsis Ibrani jelas dalam bahasa Indonesia.
- source_word: הַֽ/חֶפְרִי
  choice: orang Hefer
  rationale: Bentuk nisbah ini menandai kelompok keturunan Hefer; “orang Hefer” adalah bentuk yang jelas dan wajar dalam bahasa Indonesia.
theological_decisions: []
