  source_fidelity: 'Teks Indonesia secara setia mencerminkan dua unsur daftar sensus Ibrani: Semida dan Hefer, masing-masing diikuti kelompok kekerabatan/gentilisial yang terkait dengannya. Penambahan "dari" secara implisit menjelaskan formula eliptis daftar sensus tanpa mengubah makna. Konjungsi "dan" sebelum unsur kedua juga sesuai dengan waw Ibrani.'
