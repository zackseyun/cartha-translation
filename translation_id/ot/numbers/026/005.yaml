  text: רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַ/חֲנֹכִ֔י לְ/פַלּ֕וּא מִשְׁפַּ֖חַת הַ/פַּלֻּאִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: id
  text: 'Ruben, anak sulung Israel: keturunan Ruben ialah: dari Henok, kaum Henok; dari Palu, kaum Palu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: anak sulung Israel
  rationale: Menyatakan hubungan keluarga dan kedudukan Ruben secara langsung tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: בְּנֵי רְאוּבֵן
  choice: keturunan Ruben
  rationale: Secara harfiah berarti 'anak-anak Ruben', tetapi dalam konteks sensus silsilah frasa ini memperkenalkan garis keturunan dan para pendiri kaum; 'keturunan' menyampaikan fungsi kontekstualnya dengan wajar.
- source_word: חֲנוֹךְ
  choice: Henok
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab Indonesia.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks pembagian suku Israel, kata ini menunjuk kelompok kekerabatan di bawah tingkat suku; 'kaum' lebih tepat daripada keluarga inti.
- source_word: הַחֲנֹכִי
  choice: kaum Henok
  rationale: Bentuk nisbah ini menunjuk kelompok keturunan Henok; bahasa Indonesia secara alami menamainya dengan 'kaum' diikuti nama leluhur.
- source_word: לְפַלּוּא
  choice: dari Palu
  rationale: Prefiks ל dalam daftar ini memperkenalkan leluhur asal suatu kaum, sehingga 'dari' menyatakan hubungan keturunan secara alami.
- source_word: הַפַּלֻּאִי
  choice: kaum Palu
  rationale: Bentuk nisbah ini menunjuk kaum yang berasal dari Palu; ungkapan tersebut ringkas dan alami dalam bahasa Indonesia.
