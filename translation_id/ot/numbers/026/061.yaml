  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur-unsur Ibrani: kematian Nadab dan Abihu, hubungan temporal בְּהַקְרִיבָם (''ketika mereka mempersembahkan''), אֵשׁ זָרָה (''api asing''), serta לִפְנֵי יְהוָה (''di hadapan Yahweh''). Bentuk jamak tersirat dari verba tunggal Ibrani telah ditangani secara wajar dalam bahasa Indonesia.'
  naturalness: Kalimatnya ringkas, jelas, dan berregister modern-baku. 'Namun' dapat diterima sebagai penanda kontras diskursif dalam konteks silsilah. Ungkapan 'api asing' terdengar sedikit formal/alkitabiah, tetapi tepat untuk register terjemahan Kitab Suci dan dijelaskan melalui catatan kaki.
  terminology: Nama Nadab, Abihu, dan Yahweh konsisten. 'Api asing' mempertahankan ketakterincian leksikal זָרָה tanpa secara diam-diam membatasi maknanya menjadi hanya 'tidak diizinkan'. Catatan kaki secara memadai memberi alternatif dan konteks kultis.
