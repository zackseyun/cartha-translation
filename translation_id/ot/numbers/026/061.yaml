  text: וַ/יָּ֥מָת נָדָ֖ב וַ/אֲבִיה֑וּא בְּ/הַקְרִיבָ֥/ם אֵשׁ זָרָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: id
  text: Namun Nadab dan Abihu mati ketika mereka mempersembahkan api asing di hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “api yang tidak semestinya” atau “api yang tidak diizinkan.” Dalam konteks ibadah, bahasa Ibrani menunjuk pada api yang tidak patut atau tidak berwenang untuk dipersembahkan di hadapan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Walaupun verba Ibrani berbentuk tunggal karena mendahului subjek majemuk, maknanya mencakup Nadab dan Abihu; susunan bahasa Indonesia tidak memerlukan penandaan jamak pada verba.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab dan Abihu
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּהַקְרִיבָם
  choice: ketika mereka mempersembahkan
  rationale: Preposisi ב pada infinitif konstruk dengan sufiks berfungsi temporal di sini. Verba 'mempersembahkan' sesuai dengan konteks ibadah dan persembahan.
- source_word: אֵשׁ זָרָה
  choice: api asing
  rationale: Terjemahan ini mempertahankan citra dan ketegangan leksikal dari זָרָה, yaitu sesuatu yang asing, tidak semestinya, atau tidak berwenang dalam konteks ibadah, tanpa memasukkan penjelasan yang tidak dinyatakan langsung dalam ayat.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי dalam konteks kultis menyatakan tindakan yang dilakukan di hadapan atau dalam hadirat ilahi; nama perjanjian יְהוָה dipertahankan sebagai 'Yahweh'.
- source_word: וַ
  choice: Namun
  rationale: Kata penghubung ini menandai kontras antara pencatatan keturunan dalam konteks sekitar dan kematian kedua orang tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Sifat 'api asing'
  choice: Mempertahankan ungkapan 'api asing' dan menjelaskan rentang maknanya dalam catatan kaki
  alternative: api yang tidak diperintahkan
  rationale: Ayat ini sendiri memakai kata זָרָה, bukan klausa eksplisit 'yang tidak diperintahkan'. Terjemahan utama mempertahankan ungkapan sumber dan tidak mempersempit maknanya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Api asing' mempertahankan ungkapan konkret teks sumber, sedangkan catatan kaki menjelaskan maknanya bagi pembaca masa kini.
