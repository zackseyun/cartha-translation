  text: בְּנֵ֤י נַפְתָּלִי֙ לְ/מִשְׁפְּחֹתָ֔/ם לְ/יַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְצְאֵלִ֑י לְ/גוּנִ֕י מִשְׁפַּ֖חַת הַ/גּוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: id
  text: 'Keturunan Naftali menurut kaum-kaum mereka: dari Yahzeel, kaum Yahzeel; dari Guni, kaum Guni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Keturunan Naftali
  rationale: Dalam konteks sensus suku, בְּנֵי menunjuk para keturunan atau anggota garis keturunan Naftali, bukan hanya anak-anak langsungnya. 'Keturunan Naftali' alami dan tepat dalam bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Frasa ini mengelompokkan keturunan Naftali berdasarkan מִשְׁפָּחָה. 'Kaum' sesuai untuk kelompok kekerabatan dalam daftar suku dan menghindari kesan keluarga inti.
- source_word: לְיַחְצְאֵל
  choice: dari Yahzeel
  rationale: Preposisi לְ dalam rumus silsilah ini memperkenalkan leluhur asal suatu kaum; 'dari' menyatakan keturunan secara alami dalam bahasa Indonesia.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: kaum Yahzeel
  rationale: Bentuk nisbah הַיַּחְצְאֵלִי menamai kelompok keturunan Yahzeel. Bahasa Indonesia lazim memakai nama leluhur tanpa membentuk demonim khusus.
- source_word: לְגוּנִי
  choice: dari Guni
  rationale: Sama seperti לְיַחְצְאֵל, preposisi ini memperkenalkan leluhur yang menjadi asal kaum tersebut.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: kaum Guni
  rationale: Bentuk nisbah menunjuk kelompok keturunan Guni; 'kaum Guni' ringkas, alami, dan mempertahankan struktur daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur paralel teks Ibrani dipertahankan, sedangkan 'keturunan' dipilih agar בְּנֵי tidak disalahpahami sebagai anak langsung. Nama יַחְצְאֵל ditransliterasikan sebagai Yahzeel, mengikuti bentuk Ibrani dan konvensi nama Alkitab Indonesia.
