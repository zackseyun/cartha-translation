translation:
  language: id
  text: Inilah kaum-kaum keluarga Manasye. Mereka yang terdaftar dari antara mereka[a] berjumlah 52.700 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang mereka yang terdaftar” atau “mereka yang terhitung.” Rumusan sensus Ibrani memakai bentuk dari פקד, yang menunjuk kepada mereka yang dihitung atau didaftarkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Kata tunjuk jamak ini merangkum daftar kaum sebelumnya; 'itulah' merupakan rumusan penutup yang alami dalam bahasa Indonesia.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum keturunan
  rationale: Dalam konteks sensus Bilangan, istilah ini menunjuk kelompok-kelompok kekerabatan dalam suatu suku, bukan sekadar keluarga inti.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּפְקֻדֵיהֶם
  choice: Orang-orang yang terhitung dari mereka
  rationale: Bentuk dari פקד dalam rumusan sensus menunjuk orang-orang yang dihitung atau didaftarkan; terjemahan ini mempertahankan kaitannya dengan kaum-kaum tersebut tanpa menambahkan jenis kelamin yang tidak dinyatakan dalam ayat ini.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: 52.700 orang
  rationale: Menyampaikan jumlah Ibrani secara tepat dan idiomatis dalam notasi angka Indonesia.
