  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: id
  text: 'Inilah kaum-kaum keturunan Asyer berdasarkan jumlah orang yang terdaftar: 53.400 orang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “menurut orang-orang mereka yang terdaftar.” Kata Ibrani ini memakai istilah sensus dari kata kerja פקד dan menunjuk kepada orang-orang yang didata atau dihitung.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk jamak ini memperkenalkan pernyataan rangkuman; “Inilah” merupakan ungkapan Indonesia yang alami dalam rumus sensus ini.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks kesukuan, istilah ini menunjuk kelompok kekerabatan besar di dalam suatu suku, bukan keluarga inti.
- source_word: בְּנֵי אָשֵׁר
  choice: keturunan Asyer
  rationale: Secara harfiah berarti “anak-anak lelaki Asyer”, tetapi dalam konteks sensus menunjuk para keturunan yang membentuk suku Asyer; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut orang-orang yang terdaftar di antara mereka
  rationale: Bentuk dari פקד memakai istilah sensus bagi orang yang secara resmi didata atau dihitung; frasa ini mempertahankan acuan kepada para peserta sensus, bukan sekadar jumlah abstrak.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 53.400 orang
  rationale: Angka disajikan menurut penulisan Indonesia modern dan mempertahankan jumlah tepat; “orang” ditambahkan secara wajar untuk memperjelas bahwa ini jumlah peserta sensus.
