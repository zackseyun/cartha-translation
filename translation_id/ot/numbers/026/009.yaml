review_pass:
  verdict: revise
  source_fidelity: Frasa קרואי הָעֵדָה lebih harfiah berarti “orang-orang terpanggil dari/di antara umat,” bukan orang-orang yang “dipanggil dari antara umat” dalam arti asal atau sumber panggilan. Revisi kecil diperlukan agar konstruksi Ibrani dan ambiguitasnya tetap terjaga. Bagian lain secara setia menyampaikan identifikasi Datan dan Abiram, pertentangan mereka terhadap Musa dan Harun dalam kelompok Korah, serta pertentangan terhadap Yahweh.
  naturalness: Bahasa draft umumnya baku dan mengalir. “Orang-orang terpanggil dari umat” lebih padat dan alami daripada “orang-orang yang dipanggil dari antara umat,” sekaligus menghindari kesan bahwa umat adalah pihak yang memanggil mereka.
  terminology: Nama-nama dan “Yahweh” sudah konsisten. “Umat” layak untuk הָעֵדָה dalam konteks ini. Catatan kaki perlu memakai alternatif yang tidak mengubah hubungan frasa menjadi “pilihan umat” secara terlalu bebas; “orang-orang pilihan dari umat” menyampaikan kemungkinan idiomatisnya dengan lebih baik.
  issues:
  - severity: medium
    issue: “orang-orang yang dipanggil dari antara umat” berpotensi menyatakan asal panggilan atau tindakan pemanggilan secara lebih eksplisit daripada konstruksi קרואי הָעֵדָה.
    rationale: Konstruksi tersebut secara padat menyebut mereka sebagai orang-orang terpanggil yang terkait dengan umat/komunitas. “Orang-orang terpanggil dari umat” mempertahankan sifat statusnya dan tidak menetapkan secara berlebihan siapa yang memanggil.
  - severity: low
    issue: Catatan kaki “orang-orang pilihan umat” kurang jelas mengenai hubungan mereka dengan umat.
    rationale: Penambahan “dari” menghasilkan bahasa Indonesia yang lebih wajar dan lebih dekat dengan gagasan orang-orang terpilih dari komunitas.
  revised_text: Anak-anak Eliab ialah Nemuel, Datan, dan Abiram. Merekalah Datan dan Abiram itu, orang-orang terpanggil dari umat[a], yang menentang Musa dan Harun bersama kelompok Korah ketika mereka menentang Yahweh.
  revised_footnotes:
