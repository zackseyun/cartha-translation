revisions:
- from: Anak-anak Eliab ialah Nemuel, Datan, dan Abiram. Merekalah Datan dan Abiram itu, orang-orang yang dipanggil dari antara umat[a], yang menentang Musa dan Harun bersama kelompok Korah ketika mereka menentang Yahweh.
  to: Anak-anak Eliab ialah Nemuel, Datan, dan Abiram. Merekalah Datan dan Abiram itu, orang-orang terpanggil dari umat[a], yang menentang Musa dan Harun bersama kelompok Korah ketika mereka menentang Yahweh.
  rationale: Revisi terbatas pada penyempurnaan frasa קרואי הָעֵדָה dan catatan kakinya. Bentuk “orang-orang terpanggil dari umat” mempertahankan ambiguitas tekstual tentang status mereka tanpa secara tegas menjadikan umat sebagai pelaku yang memanggil. Makna ayat selebihnya tidak diubah.
