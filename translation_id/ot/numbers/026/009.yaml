  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: id
  text: Anak-anak Eliab ialah Nemuel, Datan, dan Abiram. Merekalah Datan dan Abiram itu, orang-orang terpanggil dari umat[a], yang menentang Musa dan Harun bersama kelompok Korah ketika mereka menentang Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang pilihan dari umat.”
    reason: Frasa Ibrani קרואי הָעֵדָה dapat dipahami secara lebih idiomatis sebagai orang-orang yang dipilih atau diakui dari antara umat.
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: Anak-anak Eliab ialah
  rationale: Dalam daftar silsilah, בְּנֵי menunjuk kepada anak-anak laki-laki yang kemudian disebutkan namanya. Bentuk ini alami dalam bahasa Indonesia tanpa perlu mengulang kata 'dan' pada awal ayat.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Merekalah Datan dan Abiram itu
  rationale: הוּא berbentuk tunggal, tetapi di sini berfungsi secara resumtif-identifikasional bagi dua nama. 'Merekalah ... itu' mempertahankan penegasan identitasnya dalam bahasa Indonesia yang alami.
- source_word: קרואי הָעֵדָה
  choice: orang-orang yang dipanggil dari antara umat
  rationale: Partisip pasif קרא dipertahankan dengan 'dipanggil', sedangkan הָעֵדָה diterjemahkan 'umat' sebagai komunitas Israel. Ungkapan ini tidak memutuskan secara berlebihan apakah mereka dipanggil, dipilih, atau diakui sebagai wakil umat.
- source_word: אֲשֶׁר הִצּוּ
  choice: yang menentang
  rationale: Dalam konteks ini נצה menyatakan perselisihan aktif atau perlawanan. 'Menentang' ringkas, jelas, dan sesuai dengan objek yang diperkenalkan oleh עַל.
- source_word: בַּעֲדַת קֹרַח
  choice: bersama kelompok Korah
  rationale: Frasa ini menunjukkan keterkaitan Datan dan Abiram dengan kumpulan Korah. 'Kelompok Korah' lebih alami daripada pengulangan 'umat/jemaah' dan tidak menyiratkan lembaga formal yang terpisah.
- source_word: בְּהַצֹּתָם
  choice: ketika mereka menentang
  rationale: Infinitif konstruk dengan בְּ menyatakan keadaan temporal. Pengulangan 'menentang' mencerminkan pengulangan akar נצה dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri perjanjian secara langsung; 'Yahweh' mempertahankan statusnya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Makna קרואי הָעֵדָה
  choice: orang-orang yang dipanggil dari antara umat
  alternative: orang-orang pilihan umat
  rationale: Bahasa Ibrani dapat menunjuk kepada orang yang dipanggil atau dikenali sebagai wakil/pemimpin umat. Teks utama mempertahankan unsur leksikal 'dipanggil', sedangkan kemungkinan makna 'dipilih' dicatat tanpa menjadikannya pasti.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Nemuel, Datan, Abiram, Musa, Harun, dan Korah. Ambiguitas jabatan atau status Datan dan Abiram dipertahankan melalui catatan kaki.'
