base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: id
  text: 'Inilah keturunan Gilead[a]: dari Iezer, kaum Iezer; dari Helek, kaum Helek.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Gilead”; ungkapan Ibrani ini dapat menunjuk keturunan melalui garis laki-laki atau kaum-kaum yang berasal darinya, bukan hanya anak-anak langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk Ibrani ini tidak menyatakan kala; “Inilah” memperkenalkan daftar secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי גִלְעָד
  choice: keturunan Gilead
  rationale: Dalam konteks sensus, frasa ini mencakup keturunan melalui garis laki-laki atau kelompok kaum, bukan hanya anak laki-laki langsung; “keturunan” menyampaikan maksud kontekstual dengan jelas.
- source_word: אִיעֶזֶר
  choice: Iezer
  rationale: Nama diri ditransliterasikan mengikuti bentuk Ibrani.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Istilah ini menunjuk subdivisi dalam suku; “kaum” alami dan tepat bagi kelompok kekerabatan dalam daftar sensus.
- source_word: הָאִיעֶזְרִי
  choice: orang Iezer
  rationale: Bentuk nisbah ini menunjuk kelompok keturunan Iezer; “orang Iezer” mempertahankan hubungan nama dengan pendiri kaum tanpa bentuk akhiran asing.
- source_word: לְחֵלֶק
  choice: dari Helek
  rationale: Prefiks ל dalam rumus sensus ini memperkenalkan leluhur berikutnya; “dari” menyatakan asal keturunan secara alami.
- source_word: הַחֶלְקִי
  choice: orang Helek
  rationale: Bentuk nisbah ini menamai kelompok keturunan Helek; pola “orang Helek” jelas dan konsisten.
