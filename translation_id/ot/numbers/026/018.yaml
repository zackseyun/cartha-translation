lexical_decisions:
- source_word: מִשְׁפְּחֹת בְּנֵי־גָד
  choice: kaum-kaum keturunan Gad
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan dalam suku, sedangkan בְּנֵי־גָד secara alami diterjemahkan sebagai keturunan Gad dalam konteks daftar sensus.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut jumlah orang yang terdaftar dari antara mereka
  rationale: Bentuk ini mengacu kepada orang-orang yang dihitung atau didaftarkan dalam sensus; frasa 'dari antara mereka' mempertahankan unsur pronominal dan hubungan partitif tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 40.500 orang
  rationale: Angka dinyatakan dalam bentuk numerik yang lazim dan mudah dibaca dalam bahasa Indonesia; 'orang' ditambahkan secara kontekstual karena yang dihitung adalah anggota suku.
