source:
  edition: WLC
  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: id
  text: “Adakanlah sensus atas seluruh umat Israel[a], yang berumur dua puluh tahun ke atas, menurut keluarga-keluarga dari pihak ayah mereka[b]—semua orang Israel yang dapat pergi berperang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “angkatlah kepala seluruh umat anak-anak Israel,” sebuah ungkapan Ibrani yang berarti menghitung atau mengadakan sensus. “Anak-anak Israel” juga dapat berarti “orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut rumah para ayah mereka.” Yang dimaksud ialah kelompok-kelompok kekerabatan dari garis ayah.
    reason: cultural_clarification
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Hitunglah
  rationale: Ungkapan harfiah ‘angkatlah kepala’ merupakan idiom untuk menghitung orang atau mengadakan sensus. ‘Hitunglah’ menyampaikan maknanya secara alami dan langsung dalam bahasa Indonesia.
- source_word: כָּל עֲדַת
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel secara kolektif. ‘Umat’ alami dalam konteks Alkitab dan tetap mempertahankan nuansa komunitas perjanjian.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi juga berfungsi sebagai sebutan kolektif bagi bangsa Israel. ‘Keturunan Israel’ mempertahankan gambaran kekeluargaan tanpa terdengar kaku; konteks akhir ayat memperjelas bahwa yang dihitung ialah mereka yang maju berperang.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini adalah rumusan batas usia yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum keluarga pihak ayah mereka
  rationale: בֵּית אָב adalah satuan kekerabatan patrilineal atau rumah leluhur dari pihak ayah. Pilihan ini lebih mudah dipahami daripada terjemahan harfiah ‘rumah ayah’ dan tidak mereduksinya menjadi keluarga inti.
- source_word: כָּל יֹצֵא צָבָא
  choice: semua orang ... yang maju berperang
  rationale: Secara bentuk, frasa ini berarti setiap orang yang keluar untuk tugas perang. ‘Maju berperang’ mempertahankan ungkapan tindakan dalam teks tanpa menambahkan secara eksplisit gagasan ‘mampu’ atau ‘layak’.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Menerjemahkan preposisi secara langsung dan menempatkan orang-orang tersebut di tengah komunitas Israel.
theological_decisions:
- issue: Cakupan gender dalam בְּנֵי יִשְׂרָאֵל dan sensus militer
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Ungkapan itu merupakan nama kolektif bagi bangsa yang berasal dari Israel, sedangkan frasa sensus militer di akhir ayat menentukan kelompok yang benar-benar dihitung. Terjemahan tidak menambahkan kategori gender di luar bentuk dan konteks sumber.
- issue: Kelayakan militer dalam כָּל יֹצֵא צָבָא
  choice: yang maju berperang
  alternative: yang sanggup maju berperang; yang layak menjalani dinas militer
  rationale: Partisipel Ibrani secara langsung menggambarkan orang yang keluar untuk perang. Pilihan utama menjaga bentuk tersebut dan tidak diam-diam mengubahnya menjadi pernyataan eksplisit tentang kemampuan atau kelayakan, walaupun makna itu mungkin tersirat oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah jamak Ibrani diterjemahkan dengan ‘Hitunglah’. Tanda pisah memperjelas bahwa bagian terakhir menentukan siapa yang termasuk dalam penghitungan, tanpa menyelesaikan lebih jauh ambiguitas antara partisipasi aktual dan kelayakan militer.
