  naturalness: “Seluruh umat keturunan Israel” kurang luwes dalam bahasa Indonesia baku. “Seluruh umat Israel” adalah sebutan kolektif yang alami dan jelas; nuansa harfiah בני ישראל dapat dicatat dalam catatan kaki.
  terminology: “Umat Israel,” “sensus,” dan “keluarga-keluarga dari pihak ayah” sesuai register Alkitab bahasa Indonesia modern. Catatan kaki perlu membetulkan harfiah בית אבות dari bentuk tunggal “rumah leluhur” menjadi “rumah/keluarga para ayah mereka,” sambil menjelaskan pengertian sosialnya.
