  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: id
  text: Kepada mereka inilah tanah itu harus dibagikan sebagai milik pusaka menurut jumlah nama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menurut jumlah orang"; secara harfiah, "menurut jumlah nama."
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: Kepada mereka inilah
  rationale: Preposisi ל menandai penerima pembagian, sedangkan אֵלֶּה merujuk kepada orang-orang yang baru saja dihitung; bentuk ini mempertahankan daya tunjuk ungkapan Ibrani secara alami dalam bahasa Indonesia.
- source_word: תֵּחָלֵק
  choice: harus dibagikan
  rationale: Bentuk Nifal imperfek dari חלק menyatakan pembagian secara pasif. Dalam konteks perintah ilahi, 'harus dibagikan' menyampaikan daya kewajiban dengan wajar.
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: הָאָרֶץ menunjuk kepada tanah yang akan dibagikan kepada Israel; 'tanah itu' alami dan tetap mempertahankan rujukan tertentu dalam konteks.
- source_word: בְּנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נַחֲלָה ialah harta atau bagian yang diwariskan dan ditetapkan. 'Milik pusaka' mempertahankan dimensi kepemilikan turun-temurun tanpa menambahkan tafsiran denominasi.
- source_word: בְּמִסְפַּר
  choice: menurut jumlah
  rationale: Preposisi בְּ menyatakan patokan atau ukuran pembagian; 'menurut jumlah' merupakan padanan Indonesia yang ringkas dan tepat.
- source_word: שֵׁמוֹת
  choice: nama
  rationale: Teks Ibrani secara harfiah menyebut 'nama-nama'. Bentuk kolektif 'jumlah nama' alami dalam bahasa Indonesia dan mempertahankan metafora sumber, sementara makna orang-orang yang dihitung dijelaskan dalam catatan kaki.
