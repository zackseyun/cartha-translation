base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: id
  text: Itulah kaum-kaum Naftali menurut kaum mereka, dan jumlah orang yang dicatat dari mereka ada 45.400 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Kata tunjuk jamak ini memperkenalkan pernyataan rangkuman; dalam bahasa Indonesia, “Itulah” merupakan ungkapan alami untuk merangkum daftar yang baru disebutkan.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks sensus suku, istilah ini menunjuk pada kelompok kekerabatan besar di dalam suatu suku, bukan keluarga inti.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Prefiks לְ menyatakan pengelompokan atau klasifikasi; “menurut kaum mereka” menyampaikan fungsi tersebut secara jelas dan alami.
- source_word: וּפְקֻדֵיהֶם
  choice: jumlah orang yang terhitung dari mereka
  rationale: Bentuk dari פקד dalam konteks sensus menunjuk kepada orang-orang yang didata. Pilihan ini mempertahankan acuan kepada orang tanpa secara eksplisit menambahkan “laki-laki”, yang tidak muncul dalam frasa ayat ini.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 45.400 orang
  rationale: Penyajian angka dengan format Indonesia modern, disertai “orang” agar satuan hitungan jelas.
