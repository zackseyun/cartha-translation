  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kaum” dipakai untuk kelompok kekerabatan dalam struktur suku, sedangkan rumusan sensus dibuat jelas tanpa menambahkan rincian gender yang tidak dinyatakan dalam frasa Ibrani ayat ini.
