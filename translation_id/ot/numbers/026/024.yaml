base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: id
  text: dari Yasyub, kaum keturunan Yasyub; dari Simron, kaum keturunan Simron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: dari Yasyub
  rationale: Dalam rumusan sensus ini, לְ di depan nama pribadi memperkenalkan leluhur asal suatu kaum; ‘dari’ menyatakan hubungan keturunan secara alami dalam bahasa Indonesia.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus suku, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah suku. ‘Kaum’ lebih tepat daripada ‘keluarga’, yang dalam pemakaian modern biasanya lebih sempit.
- source_word: הַ/יָּשׁוּבִי
  choice: orang Yasyub
  rationale: Bentuk nisbah ini menyebut kelompok keturunan Yasyub. Rumusan ‘orang Yasyub’ alami dan menghindari pembentukan demonim Indonesia yang terasa kaku.
- source_word: לְ/שִׁמְרֹן
  choice: dari Simron
  rationale: Sejajar dengan Yasyub, לְ memperkenalkan leluhur yang namanya menjadi nama kaum tersebut.
- source_word: הַ/שִּׁמְרֹנִי
  choice: orang Simron
  rationale: Bentuk nisbah ini menunjuk kepada kelompok keturunan Simron; ‘orang Simron’ mempertahankan fungsi nama kelompok dengan bahasa yang mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan paralel teks Ibrani dipertahankan. Nama יָשׁוּב ditransliterasikan ‘Yasyub’ untuk mencerminkan konsonan syin, sedangkan שִׁמְרֹן menjadi ‘Simron’ sesuai bentuk nama yang lazim dalam bahasa Indonesia.
