base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: id
  text: 'Anak-anak Simeon menurut kaum-kaum mereka: dari Nemuel, kaum Nemuel; dari Yamin, kaum Yamin; dari Yakhin[a], kaum Yakhin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditulis “Yakin”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: Keturunan Simeon
  rationale: Secara harfiah berarti “anak-anak lelaki Simeon,” tetapi dalam daftar sensus genealogis ini ungkapan tersebut menunjuk kepada keturunan melalui garis keluarga. “Keturunan” paling alami dalam bahasa Indonesia tanpa mengubah fungsi genealogisnya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Dalam konteks sensus, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di dalam suku. “Kaum” membedakannya dari keluarga inti dan mempertahankan corak pengelompokan sensus.
- source_word: לִנְמוּאֵל
  choice: dari Nemuel
  rationale: Prefiks לְ memperkenalkan leluhur asal kaum dalam rumusan genealogis. “Dari” menyampaikan hubungan keturunan secara wajar.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי
  choice: kaum orang Nemuel
  rationale: Bentuk nisba Ibrani menamai kelompok keturunan berdasarkan Nemuel. Ungkapan ini jelas dan tidak memaksakan akhiran nama bangsa asing ke dalam bahasa Indonesia.
- source_word: לְיָמִין / מִשְׁפַּחַת הַיָּמִינִי
  choice: dari Yamin, kaum orang Yamin
  rationale: Nama יָמִין ditransliterasikan “Yamin” sesuai bunyi Ibrani; bentuk nisba diterjemahkan sebagai kelompok keturunannya.
- source_word: לְיָכִין / מִשְׁפַּחַת הַיָּכִינִי
  choice: dari Yakhin, kaum orang Yakhin
  rationale: “Yakhin” mencerminkan konsonan awal yod dan bunyi כ tak berdages dalam nama Ibrani; kelompok turunannya dinyatakan dengan rumusan paralel.
