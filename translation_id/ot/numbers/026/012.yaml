  naturalness: Struktur daftar yang diulang tetap alami dalam bahasa Indonesia modern. “Kaum Nemuel” lebih ringkas dan idiomatis daripada “kaum orang Nemuel,” sambil tetap menunjukkan kelompok keturunan yang dinamai menurut leluhur tersebut.
