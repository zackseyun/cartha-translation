base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: id
  text: 'Putra-putra Yehuda: Er dan Onan.[a] Namun, Er dan Onan mati di tanah Kanaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Er dan Onan mati di tanah Kanaan.” Konjungsi Ibrani dapat diterjemahkan secara sederhana sebagai “dan”; “namun” dalam teks utama mencerminkan nuansa kontras dalam konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Bentuk jamak konstruktus dari בֵּן dalam daftar silsilah; pilihan ini mempertahankan acuan kepada putra-putra Yehuda dan terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama diri; memakai bentuk Indonesia yang lazim dalam tradisi penerjemahan Alkitab.
- source_word: עֵר
  choice: Er
  rationale: Nama diri, ditransliterasikan secara langsung.
- source_word: וְ/אוֹנָן
  choice: dan Onan
  rationale: Konjungsi וְ mengoordinasikan nama kedua dalam daftar.
- source_word: וַ/יָּמָת
  choice: Namun, ... mati
  rationale: Bentuk wayyiqtol dari מוּת menyatakan peristiwa lampau. 'Namun' mengungkapkan peralihan kontras dari penyebutan kedua putra kepada keterangan bahwa mereka telah mati, tanpa meniadakan kemungkinan menerjemahkan konjungsi secara sederhana sebagai 'dan'.
- source_word: בְּ/אֶרֶץ
  choice: di tanah
  rationale: Gabungan preposisi בְּ dengan אֶרֶץ dalam ungkapan geografis diterjemahkan secara alami sebagai 'di tanah'.
- source_word: כְּנָעַן
  choice: Kanaan
  rationale: Nama tempat; memakai bentuk Indonesia yang baku.
