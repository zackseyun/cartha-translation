base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: id
  text: 'Keturunan Yehuda menurut kaum mereka ialah: dari Syela, kaum orang Syela; dari Peres, kaum orang Peres; dari Zerah, kaum orang Zerah.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Dalam rumusan sensus ini, bentuk היה berfungsi sebagai pengantar kopulatif bagi daftar kaum; “ialah” alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְנֵי יְהוּדָה
  choice: Keturunan Yehuda
  rationale: Secara harfiah berarti “anak-anak lelaki Yehuda”, tetapi dalam konteks silsilah dan sensus menunjuk kepada keturunan garis lelaki yang dikelompokkan menurut kaum. “Keturunan” menyampaikan cakupan itu tanpa menyiratkan bahwa mereka semua anak langsung Yehuda.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di bawah suku; “kaum” lebih tepat daripada “keluarga” untuk satuan komunal dalam sensus ini.
- source_word: לְשֵׁלָה ... לְפֶרֶץ ... לְזֶרַח
  choice: dari Syela ... dari Peres ... dari Zerah
  rationale: Kata depan לְ dalam pola daftar ini memperkenalkan leluhur asal setiap kaum; “dari” menyatakan hubungan keturunan secara ringkas dan alami.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: kaum orang Syela
  rationale: Bentuk nisbah הַשֵּׁלָנִי menamai kelompok keturunan Syela. Ungkapan “kaum orang Syela” mempertahankan baik unsur kaum maupun nama turunannya tanpa membentuk istilah Indonesia yang janggal.
- source_word: מִשְׁפַּחַת הַפַּרְצִי
  choice: kaum orang Peres
  rationale: Pilihan ini mempertahankan pola berulang bahasa Ibrani dan hubungan transparan dengan nama leluhur Peres.
- source_word: מִשְׁפַּחַת הַזַּרְחִי
  choice: kaum orang Zerah
  rationale: Pilihan ini menyampaikan bentuk kelompok keturunan dan menjaga kesejajaran dengan Syela serta Peres.
