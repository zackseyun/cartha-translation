  text: אֵ֣לֶּה בְנֵי אֶפְרַיִם֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שׁוּתֶ֗לַח מִשְׁפַּ֨חַת֙ הַ/שֻּׁ֣תַלְחִ֔י לְ/בֶ֕כֶר מִשְׁפַּ֖חַת הַ/בַּכְרִ֑י לְ/תַ֕חַן מִשְׁפַּ֖חַת הַֽ/תַּחֲנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: id
  text: 'Inilah keturunan Efraim menurut kaum mereka: dari Sutelah, kaum orang Sutelah; dari Bekher, kaum orang Bekher; dari Tahan, kaum orang Tahan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: Inilah keturunan Efraim
  rationale: Dalam konteks sensus suku, בְנֵי mencakup para keturunan laki-laki yang dikelompokkan menurut leluhur, bukan hanya anak kandung langsung. 'Inilah keturunan Efraim' alami dalam bahasa Indonesia dan tetap mempertahankan rumus pengantar genealogis.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kekerabatan di dalam suku. 'Kaum' membedakannya dari keluarga inti dan cocok dengan konteks pendataan suku.
- source_word: לְשׁוּתֶלַח ... לְבֶכֶר ... לְתַחַן
  choice: dari Sutelah ... dari Bekher ... dari Tahan
  rationale: Prefiks לְ dalam rumus genealogis ini menandai kelompok yang berasal dari atau terkait dengan leluhur yang disebut. 'Dari' menyampaikan hubungan keturunan secara ringkas.
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: kaum orang Sutelah
  rationale: Bentuk nisbah Ibrani menyebut kelompok keturunan Sutelah. Ungkapan ini menghindari pembentukan nama gentilisia Indonesia yang kaku sambil mempertahankan nama leluhur dengan jelas.
- source_word: מִשְׁפַּחַת הַבַּכְרִי
  choice: kaum orang Bekher
  rationale: Bentuk nisbah menunjuk kepada kelompok keturunan Bekher; pola 'kaum orang Bekher' menjaga kesejajaran daftar. Ejaan 'Bekher' membantu mencerminkan konsonan Ibrani בֶכֶר tanpa menyamakannya dengan kata Indonesia 'beker'.
- source_word: מִשְׁפַּחַת הַתַּחֲנִי
  choice: kaum orang Tahan
  rationale: Bentuk nisbah dipahami sebagai nama kelompok yang berasal dari Tahan dan diterjemahkan sejajar dengan dua unsur sebelumnya.
