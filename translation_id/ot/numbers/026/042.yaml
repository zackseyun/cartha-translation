base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: id
  text: 'Inilah keturunan Dan[a] menurut kaum mereka: dari Suham, kaum orang Suham. Inilah kaum-kaum Dan menurut kaum mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Dan”; dalam rumusan sensus silsilah ini, ungkapan tersebut dapat berarti keturunan suatu suku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata penunjuk ini memperkenalkan dan kemudian merangkum daftar sensus; “Inilah” alami dalam bahasa Indonesia dan mempertahankan daya tunjuk teks Ibrani.
- source_word: בְנֵי דָן
  choice: keturunan Dan
  rationale: Secara harfiah berarti “anak-anak lelaki Dan,” tetapi dalam rumusan sensus kesukuan frasa ini menunjuk kepada para keturunan Dan secara kolektif. Pilihan ini menyampaikan fungsi genealogisnya dengan jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Dalam konteks sensus Bilangan, מִשְׁפָּחָה menunjuk pada kelompok kaum di dalam suku. “Menurut kaum mereka” mempertahankan susunan klasifikasi sumber.
- source_word: לְשׁוּחָם
  choice: dari Suham
  rationale: Prefiks לְ dalam rumusan genealogis ini menandai hubungan dengan leluhur atau asal kaum; “dari Suham” menyatakannya secara alami.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: kaum orang Suham
  rationale: Bentuk nisbah הַשּׁוּחָמִי dipakai secara kolektif bagi kelompok yang berasal dari Suham. Ungkapan ini mempertahankan nama leluhur dan identitas kaumnya.
- source_word: מִשְׁפְּחֹת דָּן
  choice: kaum-kaum Dan
  rationale: Bentuk jamak diterjemahkan secara eksplisit dan konsisten dengan istilah sensus pada bagian pertama ayat.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Pengulangan dalam rumusan penutup dipertahankan meskipun terasa repetitif, karena merupakan ciri gaya sensus teks Ibrani.
