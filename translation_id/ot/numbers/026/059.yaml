base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: id
  text: Nama istri Amram ialah Yokhebed, anak perempuan Lewi[a], yang dilahirkan untuk Lewi di Mesir[b]. Ia melahirkan untuk Amram Harun dan Musa, serta Miryam, saudara perempuan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak perempuan Lewi.” Dalam konteks silsilah, “anak perempuan” kadang-kadang dapat dipakai secara lebih luas untuk keturunan perempuan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang dilahirkannya untuk Lewi di Mesir”; identitas ibu tidak disebutkan dalam teks Ibrani.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: Nama istri Amram ialah
  rationale: Menyampaikan rumus pengantar Ibrani secara alami dalam bahasa Indonesia; waw pembuka tidak perlu diterjemahkan tersendiri.
- source_word: יוֹכֶבֶד
  choice: Yokhebed
  rationale: Transliterasi nama Ibrani yang lazim dan transparan dalam bahasa Indonesia.
- source_word: בַּת לֵוִי
  choice: anak perempuan Lewi
  rationale: Mempertahankan ungkapan harfiah dan tidak diam-diam menyelesaikan persoalan silsilah dengan menerjemahkannya sebagai 'keturunan perempuan'.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: yang dilahirkan bagi Lewi di Mesir
  rationale: Bentuk pasif Indonesia menjaga rujukan kepada Yokhebed tanpa menambahkan identitas ibu yang tidak disebutkan dalam teks Ibrani.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: Ia melahirkan bagi Amram
  rationale: Mempertahankan hubungan yang ditandai oleh לְ sekaligus tetap dapat dipahami dalam register silsilah.
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה וְאֵת מִרְיָם אֲחֹתָם
  choice: Harun, Musa, dan Miryam, saudara perempuan mereka
  rationale: Penanda objek tidak diterjemahkan; susunan nama dan aposisi dipertahankan dengan tanda baca alami.
theological_decisions:
- issue: Arti genealogis בַּת לֵוִי ('anak perempuan Lewi')
  choice: Mempertahankan 'anak perempuan Lewi' dalam teks utama.
  alternative: '''keturunan perempuan Lewi'' atau ''seorang perempuan keturunan Lewi'''
  rationale: Teks sumber menyatakan hubungan itu dengan istilah 'anak perempuan'. Terjemahan tidak mengharmoniskan ketegangan kronologis atau silsilah secara diam-diam.
- issue: Subjek perempuan dalam אֲשֶׁר יָלְדָה אֹתָהּ ('yang ia lahirkan')
  choice: Menggunakan pasif 'yang dilahirkan bagi Lewi'.
  alternative: '''yang dilahirkannya bagi Lewi'''
  rationale: Bahasa Ibrani menyiratkan seorang ibu tetapi tidak menyebut identitasnya. Bentuk pasif mencegah penambahan rujukan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan silsilah dibuat cukup formal tanpa menjadi kaku; ambiguitas mengenai hubungan Yokhebed dengan Lewi serta ibu yang tidak disebutkan dipertahankan melalui teks dan catatan kaki.
