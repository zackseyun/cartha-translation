id: NUM.26.45
reference: Numbers 26:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ/בְנֵ֣י בְרִיעָ֔ה לְ/חֶ֕בֶר מִשְׁפַּ֖חַת הַֽ/חֶבְרִ֑י לְ/מַ֨לְכִּיאֵ֔ל מִשְׁפַּ֖חַת הַ/מַּלְכִּיאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: id
  text: 'Keturunan Beria ialah: dari Heber, kaum orang Heber; dari Malkiel, kaum orang Malkiel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי
  choice: Keturunan ... ialah
  rationale: Dalam rumus sensus ini, בְּנֵי menunjuk pada garis keturunan, sedangkan לְ memperkenalkan cabang yang termasuk dalam garis tersebut. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan susunan genealogis.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Nama diri ditransliterasikan ke bentuk Indonesia yang lazim dan selaras dengan ejaan nama Ibrani dalam Alkitab bahasa Indonesia.
- source_word: לְחֶבֶר
  choice: dari Heber
  rationale: Prefiks לְ dalam pola sensus ini menunjukkan asal garis keturunan dari leluhur yang disebut; 'dari' menyampaikan hubungan itu secara ringkas.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Dalam konteks sensus dan silsilah, מִשְׁפָּחָה adalah kelompok kekerabatan di bawah suku. 'Kaum' merupakan istilah Indonesia yang wajar dan lebih tepat daripada 'keluarga' untuk unit sosial ini.
- source_word: הַחֶבְרִי
  choice: orang Heber
  rationale: Bentuk nisbah ini menamai kelompok keturunan Heber. 'Orang Heber' menghasilkan nama kaum yang jelas tanpa membentuk demonim Indonesia yang kaku.
- source_word: לְמַלְכִּיאֵל
  choice: dari Malkiel
  rationale: Seperti pada Heber, prefiks לְ menandai garis yang berasal dari leluhur bernama Malkiel.
- source_word: הַמַּלְכִּיאֵלִי
  choice: orang Malkiel
  rationale: Bentuk nisbah tersebut menunjuk kepada kelompok keturunan Malkiel; 'orang Malkiel' alami dalam frasa 'kaum orang Malkiel'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda titik dua mempertahankan struktur daftar sensus. Istilah 'kaum' dipakai secara konsisten untuk unit kekerabatan מִשְׁפָּחָה.
