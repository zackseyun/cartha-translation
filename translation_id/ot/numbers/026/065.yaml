source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: id
  text: Sebab Yahweh telah berfirman mengenai mereka, “Mereka pasti akan mati[a] di padang gurun.” Tidak seorang pun dari mereka yang tersisa[b], kecuali Kaleb anak Yefune dan Yosua anak Nun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “mati, mereka akan mati,” suatu bentuk Ibrani yang menegaskan kepastian: “mereka pasti akan mati.”'
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “tidak tersisa dari mereka seorang pun.”
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan bagi pernyataan pada ayat sebelumnya; “Sebab” mempertahankan hubungan penjelas tersebut secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אָמַר יְהוָה לָהֶם
  choice: Yahweh telah berfirman mengenai mereka
  rationale: “Berfirman” merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek. Dalam konteks ini, לָהֶם dipahami sebagai pihak yang dikenai pernyataan ilahi, sehingga diterjemahkan “mengenai mereka”; bentuk “telah” menunjukkan bahwa firman itu mendahului hasil sensus yang sedang dijelaskan.
- source_word: מוֹת יָמֻתוּ
  choice: Mereka pasti akan mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian kematian; “pasti akan mati” menyampaikan penekanan itu secara alami.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: Padanan umum dan mudah dipahami untuk מִדְבָּר dalam kisah perjalanan Israel, tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: Tidak seorang pun dari mereka yang tersisa
  rationale: אִישׁ berbentuk tunggal maskulin tetapi dipakai secara distributif dalam klausa negatif. Ungkapan Indonesia ini mempertahankan arti bahwa bahkan satu orang pun tidak tersisa.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Ungkapan ini memperkenalkan dua pengecualian terhadap pernyataan negatif sebelumnya.
- source_word: כָּלֵב בֶּן יְפֻנֶּה וִיהוֹשֻׁעַ בִּן נוּן
  choice: Kaleb anak Yefune dan Yosua anak Nun
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia, sedangkan patronimik בֶּן diterjemahkan secara transparan sebagai “anak”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan hukuman kematian atas angkatan yang dihitung sebelumnya
  choice: Tidak seorang pun tersisa, dengan Kaleb dan Yosua sebagai pengecualian yang dinyatakan teks
  alternative: Menggeneralisasi atau membatasi kelompok itu lebih lanjut berdasarkan penafsiran di luar ayat
  rationale: Terjemahan mengikuti ketegangan dan cakupan klausa Ibrani sebagaimana tertulis, tanpa menambahkan pembatas teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara penegasan Ibrani dan bentuk harfiah klausa negatif dijelaskan melalui catatan kaki.
