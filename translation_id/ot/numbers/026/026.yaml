id: NUM.26.26
reference: Numbers 26:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: id
  text: Anak-anak Zebulon[a] menurut kaum mereka:[b] dari Sered, kaum orang Sered; dari Elon, kaum orang Elon; dari Yahleel, kaum orang Yahleel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks sensus ini, “anak-anak Zebulon” berarti keturunan suku Zebulon.
    reason: lexical_alternative
  - marker: b
    text: Atau “berdasarkan kaum mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: Anak-anak Zebulon
  rationale: Mempertahankan ungkapan genealogis Ibrani secara dekat. Dalam konteks sensus, ungkapan ini mencakup keturunan kesukuan Zebulon, yang dijelaskan dalam catatan kaki.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kaum dalam suatu suku, bukan sekadar keluarga inti; לְ menyatakan pengelompokan atau pembagian.
- source_word: לְסֶרֶד
  choice: dari Sered
  rationale: Prefiks לְ dalam rumus daftar ini memperkenalkan leluhur asal suatu kaum; 'dari' secara alami menyatakan garis keturunan dalam bahasa Indonesia.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: kaum orang Sered
  rationale: Bentuk nisbah הַסַּרְדִּי menyebut kelompok keturunan yang berasal dari Sered. Bentuk ini mempertahankan perbedaan antara nama leluhur dan kaumnya tanpa menciptakan akhiran etnik yang tidak alami dalam bahasa Indonesia.
- source_word: לְאֵלֹן ... מִשְׁפַּחַת הָאֵלֹנִי
  choice: dari Elon, kaum orang Elon
  rationale: 'Mengikuti rumus berulang yang sama: nama leluhur diikuti kelompok keturunannya.'
- source_word: לְיַחְלְאֵל ... מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: dari Yahleel, kaum orang Yahleel
  rationale: Nama יַחְלְאֵל ditransliterasikan sebagai 'Yahleel', sedangkan bentuk nisbahnya diterjemahkan sebagai kelompok orang yang berasal darinya.
