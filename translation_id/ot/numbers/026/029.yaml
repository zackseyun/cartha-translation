    rationale: Dalam pemakaian Indonesia modern, “memperanakkan” kurang alami untuk tindakan seorang ayah dan dapat mengaburkan penegasan genealogis bahwa Makhir adalah ayah Gilead. Teks Ibrani memakai formula kelahiran/ayah yang dalam konteks ini paling jelas diterjemahkan “menjadi ayah.”
