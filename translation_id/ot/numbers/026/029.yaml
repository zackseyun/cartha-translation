  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: id
  text: 'Keturunan Manasye: dari Makhir, kaum orang Makhir; Makhir menjadi ayah Gilead; dari Gilead, kaum orang Gilead.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Keturunan Manasye
  rationale: Dalam konteks sensus kesukuan, בְּנֵי mencakup garis keturunan, bukan hanya anak laki-laki langsung. Pilihan ini alami dalam bahasa Indonesia dan sesuai dengan fungsi genealogisnya.
- source_word: לְמָכִיר
  choice: dari Makhir
  rationale: Prefiks לְ dalam rumus sensus ini memperkenalkan cabang keturunan yang menjadi asal suatu kaum; 'dari' menyampaikan hubungan tersebut secara ringkas dan alami.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: kaum orang Makhir
  rationale: מִשְׁפָּחָה menunjuk kelompok kekerabatan di bawah tingkat suku. 'Kaum' sesuai dengan konteks kesukuan, sedangkan bentuk 'orang Makhir' menyampaikan gentilika Ibrani tanpa menciptakan istilah Indonesia yang janggal.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Makhir memperanakkan Gilead
  rationale: Bentuk kausatif הוֹלִיד adalah ungkapan genealogis untuk menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' mempertahankan gaya silsilah dan hubungan ayah-anak secara padat.
- source_word: לְגִלְעָד
  choice: dari Gilead
  rationale: Sejajar dengan לְמָכִיר, prefiks ini menandai cabang keturunan yang terkait dengan kaum berikutnya.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: kaum orang Gilead
  rationale: '''Kaum'' menyatakan kelompok kekerabatan dalam sensus, dan ''orang Gilead'' menerjemahkan gentilika secara jelas serta alami.'
