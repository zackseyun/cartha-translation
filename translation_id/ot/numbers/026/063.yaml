  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: id
  text: Inilah orang-orang yang dihitung oleh Musa dan Eleazar, sang imam. Keduanya menghitung orang Israel[a] di dataran Moab, di tepi Sungai Yordan dekat Yerikho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “putra-putra Israel”; dapat juga diterjemahkan “keturunan Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di tepi Sungai Yordan, berhadapan dengan Yerikho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: orang-orang yang dihitung
  rationale: Bentuk konstruk dari פקד dalam konteks sensus menunjuk kepada orang-orang yang didata. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan acuan personal.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Teks Ibrani menyebut Eleazar sebagai 'imam', bukan secara eksplisit 'imam besar'. Dalam bahasa Indonesia, gelar di depan nama ditulis dengan huruf kapital.
- source_word: פָּקְדוּ
  choice: menghitung
  rationale: Mempertahankan hubungan leksikal dengan פְּקוּדֵי dan sesuai dengan konteks penghitungan sensus.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa keturunan Israel. 'Umat Israel' jelas dan alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עַרְבוֹת dalam ungkapan geografis ini berarti dataran atau padang datar; 'dataran Moab' merupakan padanan Indonesia yang jelas.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: di tepi Sungai Yordan dekat Yerikho
  rationale: Frasa ini menempatkan lokasi di sisi Yordan dalam kaitannya dengan Yerikho. 'Dekat Yerikho' mempertahankan keterbukaan relasi geografis, sedangkan kemungkinan 'berhadapan dengan Yerikho' dicatat dalam catatan kaki.
theological_decisions:
- issue: Ungkapan perjanjian dan genealogis בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak lelaki Israel; orang Israel; keturunan Israel
  rationale: Dalam konteks sensus, ungkapan Ibrani berfungsi sebagai nama kolektif bangsa. Padanan utama dibuat alami dan inklusif terhadap referen kolektif tanpa menghapus bentuk harfiah, yang disediakan dalam catatan kaki.
- issue: Gelar jabatan Eleazar
  choice: Imam Eleazar
  alternative: Imam Besar Eleazar
  rationale: Terjemahan tidak menambahkan gelar 'Imam Besar' karena teks sumber hanya memakai הַכֹּהֵן, 'imam itu/sang imam'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat demi kejelasan, tanpa mengubah hubungan maknanya. Penanda catatan kaki [a] dan [b] ditempatkan tepat sesudah unsur yang dijelaskan.
