  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: id
  text: 'Inilah kaum-kaum Isakhar, menurut orang-orang yang terdaftar dari antara mereka[a]: 64.300 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut jumlah mereka” atau “menurut pendaftaran mereka.” Ungkapan Ibrani ini mengacu pada penghitungan dalam sensus atas orang-orang yang terdaftar dari antara kaum-kaum ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk jamak ini memperkenalkan pernyataan rangkuman. “Inilah” secara wajar mewakili klausa Ibrani tanpa verba.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks sensus dan suku, istilah ini menunjuk pada kelompok-kelompok kekerabatan besar di dalam suatu suku; “kaum” lebih tepat daripada “keluarga” dalam arti rumah tangga.
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut orang-orang yang terdaftar dari antara mereka
  rationale: Bentuk dari akar פקד dalam konteks ini menunjuk pada orang-orang yang dihitung atau didaftarkan dalam sensus. Pilihan ini mempertahankan acuan kepada orang-orang yang terhitung serta sufiks jamak “mereka” tanpa menyederhanakannya hanya menjadi jumlah abstrak.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 64.300 orang
  rationale: Menyajikan nilai bilangan Ibrani dalam tata angka Indonesia modern. Kata “orang” memperjelas bahwa angka tersebut adalah jumlah peserta sensus.
theological_decisions: []
