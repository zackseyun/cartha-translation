  text: 'These are the clans of the Simeonites: twenty-two thousand two hundred.'
translation:
  language: id
  text: 'Inilah kaum-kaum keturunan Simeon: 22.200 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk jamak ini memperkenalkan ringkasan sensus; “Inilah” menyampaikan fungsi presentatif klausa nominal Ibrani secara alami.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks suku dan sensus, istilah ini menunjuk pada kelompok-kelompok kekerabatan di dalam suatu suku; “kaum” lebih tepat daripada “keluarga” dalam bahasa Indonesia.
- source_word: הַשִּׁמְעֹנִי
  choice: keturunan Simeon
  rationale: Bentuk nisbah tunggal dengan kata sandang dipakai secara kolektif bagi kelompok suku; “keturunan Simeon” jelas dan alami bagi pembaca Indonesia.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: 22.200 orang
  rationale: Angka sensus diterjemahkan menurut susunan bilangan Indonesia, sedangkan “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah orang yang didata.
