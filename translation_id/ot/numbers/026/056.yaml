  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: id
  text: Menurut hasil undian[a], milik pusakanya harus dibagikan di antara kelompok yang lebih banyak dan yang lebih sedikit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Berdasarkan undian, milik pusakanya harus dibagikan di antara kelompok yang banyak dan yang sedikit.” Bahasa Ibrani mempertentangkan kelompok yang lebih banyak dengan kelompok yang lebih sedikit dalam proses pembagian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי הַגּוֹרָל
  choice: Menurut hasil undian
  rationale: Ungkapan עַל פִּי berarti ‘menurut’ atau ‘berdasarkan keputusan’, sedangkan הַגּוֹרָל menunjuk pada undian untuk menentukan pembagian. ‘Menurut hasil undian’ alami dalam bahasa Indonesia dan memperjelas bahwa keputusan undian menjadi dasar pembagian.
- source_word: תֵּחָלֵק
  choice: harus dibagi
  rationale: Bentuk Nifal menyatakan pembagian secara pasif. Dalam konteks ketetapan ini, ‘harus dibagi’ menyampaikan daya normatif bentuk verbal Ibrani dengan wajar.
- source_word: נַחֲלָתוֹ
  choice: milik pusakanya
  rationale: Nomina tunggal dengan akhiran orang ketiga maskulin tunggal secara formal berarti ‘milik pusakanya’. Acuannya bersifat distributif kepada setiap kelompok yang menerima bagian.
- source_word: בֵּין רַב לִמְעָט
  choice: antara kelompok yang besar dan kelompok yang kecil
  rationale: רַב dan מְעָט dikontraskan berdasarkan banyak-sedikitnya anggota dalam konteks sensus dan pembagian tanah. Penambahan ‘kelompok’ membuat acuan substantivalnya jelas tanpa menentukan bahwa frasa itu menunjuk pada luas tanah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Milik pusaka’ mempertahankan istilah warisan tanah yang lazim dalam konteks Alkitab, sedangkan ‘kelompok yang besar/kecil’ menyampaikan perbandingan jumlah penduduk secara alami.
