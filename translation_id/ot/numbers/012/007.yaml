  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: id
  text: Tidak demikian dengan hamba-Ku Musa; ia setia di seluruh rumah-Ku[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di seluruh rumah tangga-Ku.” Kata Ibrani untuk “rumah” dapat menunjuk pada rumah tangga atau ranah kekuasaan, bukan hanya bangunan fisik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Tidak demikian
  rationale: Ungkapan ini menyatakan kontras korektif yang tegas terhadap cara Allah menyatakan diri kepada nabi lain pada ayat sebelumnya; bentuk ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: עַבְדִּי
  choice: hamba-Ku
  rationale: Dalam konteks ini עֶבֶד merupakan sebutan kehormatan bagi Musa dalam hubungannya dengan Allah, bukan penekanan pada status perbudakan. “Hamba-Ku” juga sesuai dengan ragam bahasa Alkitab Indonesia yang tetap mudah dipahami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: בְּכָל בֵּיתִי
  choice: dalam seluruh rumah-Ku
  rationale: Mempertahankan preposisi dan metafora Ibrani secara langsung. “Rumah” dapat menunjuk pada rumah tangga atau ranah kekuasaan Allah, tetapi cakupan itu tidak dipersempit dalam teks utama.
- source_word: נֶאֱמָן
  choice: setia
  rationale: נֶאֱמָן menyatakan sifat dapat dipercaya, teguh, dan andal. “Setia” merupakan padanan yang alami dan tepat dalam pernyataan mengenai kedudukan Musa di hadapan Allah.
- source_word: הוּא
  choice: ia
  rationale: Pronomina mandiri Ibrani dinyatakan dengan subjek eksplisit dalam bahasa Indonesia; kopula tidak diperlukan.
theological_decisions:
- issue: Makna “rumah-Ku” sehubungan dengan peran Musa
  choice: Mempertahankan metafora “rumah-Ku” dalam teks utama.
  alternative: “seluruh rumah tangga-Ku” atau “seluruh umat-Ku”
  rationale: Bahasa Ibrani memakai בַּיִת, “rumah,” yang dapat mencakup rumah tangga atau ranah milik Allah. Mempertahankan metafora menjaga ambiguitas dan kaitan antarteks tanpa menentukan bahwa yang dimaksud hanya umat atau hanya wilayah pelayanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada akhiran posesif “-Ku” mengikuti konvensi umum untuk rujukan kepada Allah. Struktur kalimat mempertahankan kontras tegas dan metafora sumber tanpa terasa kaku.
