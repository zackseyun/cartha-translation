  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: id
  text: Lalu Miryam dan Harun berbicara menentang Musa karena perempuan Kush yang telah diambilnya sebagai istri[a], sebab ia telah mengambil seorang perempuan Kush sebagai istri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang telah diambilnya.” Dalam konteks ini, ungkapan Ibrani tersebut berarti mengambil sebagai istri atau menikahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר
  choice: berbicara menentang
  rationale: Kata kerja דבר pada dirinya berarti “berbicara”; bersama בְּמֹשֶׁה dan dalam konteks ini, ungkapan tersebut bernuansa bermusuhan atau mengecam, sehingga “berbicara menentang” mempertahankan tindakan tutur dan arah negatifnya.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: Miryam dan Harun
  rationale: Urutan nama dalam bahasa Ibrani dipertahankan. Bentuk kata kerja feminin tunggal mungkin menonjolkan Miryam sebagai penggerak utama, tetapi teks tetap menyebut keduanya sebagai pelaku.
- source_word: עַל אֹדוֹת
  choice: karena
  rationale: Ungkapan ini menyatakan alasan atau perkara yang memicu perkataan mereka; “karena” alami dalam bahasa Indonesia dan mempertahankan daya kausalnya.
- source_word: הַכֻּשִׁית / כֻשִׁית
  choice: Kush
  rationale: Sebutan ini menunjuk kepada perempuan yang berasal dari Kush. “Kush” lebih transparan terhadap teks sumber dan tidak menyamakannya secara anakronistis dengan Etiopia modern.
- source_word: אֲשֶׁר לָקָח
  choice: yang telah diambilnya sebagai istri
  rationale: לקח secara harfiah berarti “mengambil”, tetapi dalam konteks perkawinan merupakan idiom untuk mengambil sebagai istri atau menikahi. Terjemahan ini menjaga citra verbal sumber sekaligus menjernihkan maksud idiom bagi pembaca Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan yang mengulang alasan sebelumnya; “sebab” mempertahankan fungsi penjelasannya.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: ia telah mengambil seorang perempuan Kush sebagai istri
  rationale: Pengulangan dalam bahasa Ibrani dipertahankan untuk menjaga penekanannya, bukan dihaluskan atau dihapus.
theological_decisions:
- issue: Identitas dan sebutan etnis istri Musa
  choice: Menerjemahkan כֻשִׁית sebagai “perempuan Kush” tanpa menyamakannya dengan Zipora atau menafsirkan Kush sebagai Etiopia modern.
  alternative: “Perempuan Etiopia” atau identifikasi langsung dengan Zipora orang Midian.
  rationale: Ayat ini sendiri menggunakan sebutan Kush. Terjemahan perlu mempertahankan keterangan teks tanpa menyelesaikan perdebatan sejarah atau harmonisasi yang tidak dinyatakan dalam ayat.
- issue: Keutamaan Miryam dalam tindakan berbicara
  choice: Menyebut “Miryam dan Harun” sesuai subjek eksplisit tanpa menambahkan bahwa Miryam memulai kecaman.
  alternative: “Miryam, bersama Harun, mulai berbicara menentang Musa.”
  rationale: Kata kerja feminin tunggal dapat mengisyaratkan keutamaan Miryam, tetapi teks tidak secara eksplisit menyatakan bahwa ia memulai tindakan. Ambiguitas bentuk gramatikal tidak dijadikan narasi tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan sumber dipertahankan. Nama “Miryam” dan wilayah “Kush” memakai bentuk yang dekat dengan bahasa sumber; idiom perkawinan dijelaskan secara alami tanpa menghapus ungkapan “mengambil”.
