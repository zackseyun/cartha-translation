  terminology: “Rahim ibunya” dan “dagingnya” tepat untuk רֶחֶם אִמּוֹ dan בְשָׂרוֹ. “Orang mati” secara sengaja tidak mempersempit כַּמֵּת; catatan kaki dapat menyebut alternatif “bayi lahir mati.”
