  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: id
  text: Janganlah kiranya ia menjadi seperti orang mati, yang ketika keluar dari rahim ibunya, separuh dagingnya sudah habis dimakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti bayi lahir mati, yang ketika keluar dari rahim ibunya, separuh dagingnya sudah habis dimakan.” Bahasa Ibrani membandingkan Miryam dengan seseorang yang mati saat dilahirkan; beberapa terjemahan menyatakan gambaran bayi lahir mati secara eksplisit dalam teks utama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Janganlah kiranya
  rationale: אַל menyatakan larangan, sedangkan נָא memberi nuansa permohonan yang mendesak. Gabungan ini diterjemahkan sebagai permohonan, bukan perintah negatif yang keras.
- source_word: תְהִי
  choice: ia menjadi
  rationale: Bentuk feminin tunggal mengacu kepada Miryam; dalam bahasa Indonesia, pronomina 'ia' wajar dan konteks menjelaskan rujukannya.
- source_word: כַּמֵּת
  choice: seperti orang mati
  rationale: Terjemahan ini mempertahankan perbandingan umum dalam bahasa Ibrani tanpa langsung mempersempitnya menjadi 'bayi lahir mati'; gambaran kelahiran dijelaskan dalam klausa berikutnya.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: ketika keluar dari rahim ibunya
  rationale: Infinitif dengan בְּ menyatakan waktu. Ungkapan ini dekat dengan gambaran konkret teks Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: separuh dagingnya telah hancur
  rationale: Secara harfiah bentuk verba berarti 'dimakan', tetapi dalam gambaran ini menunjukkan keadaan daging yang telah rusak atau habis. 'Telah hancur' menyampaikan hasil yang mengerikan secara alami tanpa menyiratkan pemakan harfiah.
theological_decisions:
- issue: Rujukan bentuk feminin tunggal
  choice: '''ia'' mengacu kepada Miryam'
  alternative: menyebut nama 'Miryam' secara eksplisit
  rationale: Konteks langsung menunjukkan bahwa Harun sedang memohon bagi Miryam. Pronomina mempertahankan bentuk teks sumber tanpa tambahan nama.
- issue: Apakah כַּמֵּת secara eksplisit berarti bayi lahir mati
  choice: mempertahankan 'seperti orang mati' dalam teks utama
  alternative: “seperti bayi lahir mati”
  rationale: Teks Ibrani secara leksikal mengatakan 'seperti orang mati', sementara klausa berikut menghadirkan gambaran kematian pada saat keluar dari rahim. Terjemahan utama tidak menutup ambiguitas itu; penafsiran lahir mati dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Janganlah kiranya' mempertahankan nada permohonan yang sungguh-sungguh, sedangkan 'separuh dagingnya telah hancur' menjaga gambaran jasmani yang keras tanpa terdengar janggal atau terlalu harfiah.
