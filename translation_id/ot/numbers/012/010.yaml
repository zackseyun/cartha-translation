  text: וְ/הֶ/עָנָ֗ן סָ֚ר מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/הִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּ/שָּׁ֑לֶג וַ/יִּ֧פֶן אַהֲרֹ֛ן אֶל מִרְיָ֖ם וְ/הִנֵּ֥ה מְצֹרָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: id
  text: Awan itu pun beranjak dari atas Kemah, dan lihatlah, Miryam terkena penyakit kulit[a], seperti salju. Kemudian Harun berpaling kepada Miryam, dan lihatlah, ia terkena penyakit kulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat menunjuk pada berbagai penyakit kulit serius atau kondisi kulit yang berkaitan dengan kenajisan ritual, bukan hanya penyakit yang dalam pengertian medis modern disebut kusta (penyakit Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Nomina definit ini menunjuk pada awan yang telah dikenal dalam konteks, yakni tanda kelihatan yang berkaitan dengan kehadiran TUHAN.
- source_word: סָר
  choice: beranjak
  rationale: Verba ini menyatakan bergerak menjauh atau menyingkir; 'beranjak' alami untuk gerakan awan tanpa menambahkan gagasan bahwa awan lenyap sepenuhnya.
- source_word: מֵעַל הָאֹהֶל
  choice: dari atas Kemah
  rationale: Frasa ini menunjukkan gerakan menjauh dari posisi di atas. Kapitalisasi 'Kemah' menandai kemah khusus dalam konteks, tanpa memperluas teks menjadi 'Kemah Pertemuan'.
- source_word: וְהִנֵּה
  choice: dan lihatlah / lihatlah
  rationale: '''Lihatlah'' mempertahankan daya dramatik dan unsur keterkejutan partikel Ibrani; pada kemunculan kedua, hubungan kalimat lebih alami dalam bahasa Indonesia tanpa mengulang ''dan''.'
- source_word: מְצֹרַעַת
  choice: terkena penyakit kulit
  rationale: Istilah Ibrani menunjuk pada gangguan kulit yang ditentukan dalam kerangka ritual Israel dan tidak harus sama dengan kusta modern atau penyakit Hansen. Pilihan ini menghindari identifikasi medis yang terlalu sempit.
- source_word: כַּשָּׁלֶג
  choice: seperti salju
  rationale: Menerjemahkan perbandingan singkat secara langsung tanpa secara eksplisit menambahkan 'putih', yang hanya tersirat.
- source_word: וַיִּפֶן ... אֶל
  choice: berpaling kepada
  rationale: Mengungkapkan gerakan Harun mengarahkan diri kepada Miryam secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat penyakit Miryam
  choice: penyakit kulit
  alternative: kusta
  rationale: Teks menggambarkan ṣāraʿat, kategori gangguan kulit atau kenajisan ritual yang cakupannya lebih luas daripada penyakit Hansen; terjemahan tidak menyamakan keduanya secara pasti.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Repetisi 'lihatlah' serta penyebutan ulang kondisi Miryam dipertahankan demi penekanan naratif. 'Kemah' dikapitalisasi karena dalam konteks menunjuk pada kemah khusus.
