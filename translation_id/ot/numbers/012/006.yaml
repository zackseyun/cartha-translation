  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: id
  text: 'Lalu Ia berfirman, “Dengarkanlah firman-Ku: Jika ada seorang nabi di antara kamu[a], Aku, Yahweh, menyatakan diri kepada dia[b] dalam suatu penglihatan; Aku berbicara kepadanya[c] dalam mimpi.”


    [a] Atau, “jika salah seorang dari kamu adalah nabi.” Secara harfiah, ungkapan Ibraninya berbunyi “jika ada nabimu.”


    [b] Atau, “Aku membuat diri-Ku dikenal kepadanya.”


    [c] Atau, “berbicara dengan dia.” Kata depan Ibrani yang dipakai dapat berarti “di dalam” atau “dengan,” tetapi bersama kata kerja “berbicara” ungkapan ini secara wajar dapat berarti berbicara kepada seseorang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika salah seorang dari kamu adalah nabi.” Secara harfiah, ungkapan Ibraninya berbunyi “jika ada nabimu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Aku membuat diri-Ku dikenal kepadanya.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “berbicara dengan dia.” Kata depan Ibrani yang dipakai dapat berarti “di dalam” atau “dengan,” tetapi bersama kata kerja “berbicara” ungkapan ini secara wajar dapat berarti berbicara kepada seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Ia berfirman
  rationale: Bentuk wayyiqtol melanjutkan narasi dan memperkenalkan ucapan langsung. Karena subjeknya adalah Allah, “berfirman” merupakan pilihan Indonesia yang alami dan bermartabat.
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: Dengarkanlah firman-Ku
  rationale: Imperatif jamak dengan נָא menyampaikan seruan yang sungguh-sungguh. Partikel -lah mempertahankan nuansa desakan tanpa terdengar kaku; “firman-Ku” sesuai untuk ucapan ilahi.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: Jika ada seorang nabi di antara kamu
  rationale: Ungkapan harfiah “jika ada nabimu” paling alami dipahami sebagai keberadaan seorang nabi di tengah kelompok yang disapa. Catatan kaki mempertahankan kemungkinan “jika salah seorang dari kamu adalah nabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi empat huruf dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בַּמַּרְאָה
  choice: dalam suatu penglihatan
  rationale: מַרְאָה menunjuk pada pengalaman atau penampakan visioner sebagai sarana penyataan.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: menyatakan diri kepadanya
  rationale: 'Bentuk hitpael dari ידע memiliki nuansa refleksif: Yahweh membuat diri-Nya dikenal oleh sang nabi.'
- source_word: בַּחֲלוֹם
  choice: dalam mimpi
  rationale: Frasa ini menyebut mimpi sebagai ranah atau sarana komunikasi ilahi.
- source_word: אֲדַבֶּר בּוֹ
  choice: Aku berbicara kepadanya
  rationale: Walaupun בּוֹ secara bentuk berarti “di dalam/dengan dia,” konstruksi dengan דבר dapat secara idiomatis menyatakan berbicara kepada seseorang. “Kepadanya” paling alami dalam bahasa Indonesia, sementara bentuk yang lebih harfiah dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Cara penyataan kepada nabi
  choice: Yahweh menyatakan diri dalam penglihatan dan berbicara dalam mimpi
  alternative: Yahweh menampakkan diri dalam penglihatan
  rationale: Terjemahan mempertahankan kesejajaran kedua sarana penyataan serta nuansa refleksif אֶתְוַדָּע, tanpa menambahkan teori teologis tentang hakikat nubuat.
- issue: Arah tindakan dalam אֲדַבֶּר בּוֹ
  choice: berbicara kepadanya
  alternative: berbicara dengan dia
  rationale: Pilihan utama menyampaikan komunikasi ilahi secara alami, sedangkan alternatif mempertahankan bentuk kata depan Ibrani dan tetap dicatat karena dapat memberi kesan percakapan timbal balik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda titik koma mempertahankan kesejajaran antara penglihatan dan mimpi.
