  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: id
  text: Maka Miryam dikucilkan di luar perkemahan selama tujuh hari, dan bangsa itu tidak berangkat sampai Miryam dibawa kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “sampai Miryam dikumpulkan.” Kata kerja Ibrani yang dipakai berarti “mengumpulkan”; dalam konteks ini, ungkapan itu menunjuk pada pemulihan Miryam ke perkemahan setelah masa pengucilannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: diasingkan
  rationale: Bentuk Nifal dari סגר menyatakan bahwa Miryam ditutup atau disingkirkan dari lingkungan perkemahan. “Diasingkan” menyampaikan keadaan pasif dan pengucilannya secara alami dalam bahasa Indonesia tanpa menyiratkan bahwa ia dikurung dalam sebuah bangunan.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Padanan lokatif langsung yang sesuai dengan latar perjalanan Israel di padang gurun.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Ungkapan durasi yang alami dan tepat dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Dalam konteks ini kata tersebut menunjuk kepada seluruh komunitas Israel yang sedang melakukan perjalanan. “Bangsa itu” menjaga rujukan kolektif tanpa menambahkan sebutan keagamaan yang tidak tersurat.
- source_word: לֹא נָסַע
  choice: tidak berangkat
  rationale: נסע dalam kisah perjalanan di padang gurun merujuk pada tindakan membongkar perkemahan lalu mulai bergerak. “Tidak berangkat” menyampaikan arti perjalanan tersebut dengan ringkas dan alami.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: sampai Miryam dibawa masuk kembali
  rationale: Bentuk Nifal dari אסף secara harfiah berarti “dikumpulkan” atau “dibawa masuk.” Dalam konteks ini ungkapan tersebut menunjuk pada penerimaan Miryam kembali ke perkemahan setelah masa pengasingannya; kata “kembali” membuat arah pemulihan kontekstual itu jelas.
