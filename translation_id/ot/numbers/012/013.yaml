  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: id
  text: 'Lalu Musa berseru kepada Yahweh: “Ya Allah, kumohon, sembuhkanlah dia, kumohon!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai kata permohonan na dua kali, sebelum dan sesudah “sembuhkanlah,” untuk menegaskan desakan doa Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: Maka ... berseru
  rationale: Kata kerja צעק menyatakan seruan kuat atau permohonan mendesak. “Berseru” alami dalam bahasa Indonesia dan mempertahankan kesungguhan doa Musa.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל menunjukkan arah seruan, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap terlihat.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Bentuk ini memperkenalkan isi seruan Musa. “Katanya” menyampaikan fungsi tersebut secara ringkas dan wajar.
- source_word: אֵל
  choice: Ya Allah
  rationale: אֵל dipakai sebagai sapaan langsung kepada Allah. Partikel “Ya” menandai bentuk vokatif dalam bahasa Indonesia.
- source_word: נָא רְפָא נָא
  choice: sembuhkanlah dia, kumohon
  rationale: Imperatif רְפָא diterjemahkan “sembuhkanlah”; נָא menyatakan permohonan mendesak. Pengulangan partikel itu tidak diulang secara kaku dalam teks utama, tetapi urgensinya dipertahankan dengan “kumohon” dan dijelaskan dalam catatan kaki.
- source_word: לָהּ
  choice: dia
  rationale: Akhiran pronominal feminin tunggal menunjuk kepada Miryam. Bahasa Indonesia tidak membedakan gender pada pronomina orang ketiga, sehingga “dia” merupakan padanan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama yang terdapat dalam teks tanpa menggantinya dengan gelar.
- issue: Sapaan אֵל dalam doa Musa
  choice: Ya Allah
  alternative: Ya Tuhan
  rationale: אֵל berarti “Allah” dan di sini berfungsi sebagai sapaan langsung. “Ya Allah” mempertahankan istilah sumber tanpa menyamakan אֵל dengan nama Yahweh atau gelar lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Berseru” mempertahankan intensitas צעק, sedangkan “kumohon” memberi nada doa yang mendesak tanpa menghasilkan pengulangan yang kaku dalam teks utama.
