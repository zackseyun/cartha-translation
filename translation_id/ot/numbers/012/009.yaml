base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: id
  text: Maka murka Yahweh menyala terhadap mereka[a], lalu Ia pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hidung Yahweh menyala terhadap mereka,” sebuah ungkapan Ibrani yang berarti bahwa murka Yahweh menyala terhadap mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Gabungan חרה dan אַף merupakan ungkapan tentang kemarahan yang menjadi panas atau menyala. Terjemahan ini alami dalam bahasa Indonesia serta mempertahankan metafora panas dari bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: בָּם
  choice: terhadap mereka
  rationale: Dalam ungkapan kemarahan ini, preposisi ב menandai pihak yang menjadi sasaran murka.
- source_word: וַיֵּלַךְ
  choice: lalu Ia pergi
  rationale: הלך di sini menyatakan bahwa Yahweh pergi setelah berbicara. Pilihan ini ringkas, jelas, dan tidak menambahkan tafsiran mengenai cara kepergian-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi secara langsung; transliterasi mempertahankannya sebagai nama pribadi.
- issue: Gambaran antropomorfis tentang kepergian Yahweh
  choice: Ia pergi
  alternative: Ia meninggalkan tempat itu
  rationale: Terjemahan mengikuti bentuk sederhana וַיֵּלַךְ dan mempertahankan ketegangan ungkapan teks tanpa menjelaskan lokasi atau cara kepergian yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Murka” dipilih karena sesuai dengan konteks kemarahan ilahi, sedangkan “menyala” mempertahankan metafora panas dalam teks Ibrani. Huruf kapital pada “Ia” mengikuti register religius Indonesia tanpa mengubah makna sumber.
