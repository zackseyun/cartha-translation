  - severity: low
    issue: Rumusan catatan kaki “kalian semua bertiga” kurang idiomatis.
    rationale: Alternatif yang lebih alami adalah “ketiga kalian” atau “kalian semua,” sambil tetap menjelaskan penekanan bahwa ketiga orang itu disapa bersama.
