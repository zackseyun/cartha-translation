  text: וַ/יֹּ֨אמֶר יְהוָ֜ה פִּתְאֹ֗ם אֶל מֹשֶׁ֤ה וְ/אֶֽל אַהֲרֹן֙ וְ/אֶל מִרְיָ֔ם צְא֥וּ שְׁלָשְׁתְּ/כֶ֖ם אֶל אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּצְא֖וּ שְׁלָשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: id
  text: Yahweh tiba-tiba berfirman kepada Musa, Harun, dan Miryam, “Keluarlah, kalian bertiga[a], menuju Kemah Pertemuan.” Maka mereka bertiga keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketiga kalian” atau “kalian semua.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: פִּתְאֹם
  choice: tiba-tiba
  rationale: Mempertahankan kesan mendadak dan tak terduga dalam tindakan tutur Yahweh.
- source_word: צְאוּ
  choice: Keluarlah
  rationale: Imperatif יצא menyatakan gerak keluar dari suatu tempat. Bahasa Indonesia tidak perlu memilih secara tegas antara nuansa Inggris 'go out' dan 'come out'.
- source_word: שְׁלָשְׁתְּכֶם
  choice: kalian bertiga
  rationale: Secara alami dan eksplisit menunjukkan bahwa ketiga orang yang disapa harus keluar bersama-sama.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan Indonesia yang baku, jelas, dan bermartabat untuk istilah tempat ibadah tersebut.
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Menyampaikan tindakan naratif berikutnya secara langsung tanpa menambahkan arah yang tidak dinyatakan.
- source_word: שְׁלָשְׁתָּם
  choice: mereka bertiga
  rationale: Mempertahankan pengulangan dan penekanan teks Ibrani bahwa ketiganya menaati perintah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama pribadi ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang kurang dekat dengan rekonstruksi umum.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan nama disederhanakan dengan tanda koma sesuai kelaziman Indonesia, sementara pengulangan 'bertiga' dipertahankan karena merupakan penekanan dalam teks Ibrani.
