  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: id
  text: Musa adalah seorang yang sangat rendah hati, lebih daripada siapa pun yang ada di muka bumi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: Musa adalah seorang
  rationale: Konstruksi Ibrani memperkenalkan Musa sebagai pokok pernyataan. Dalam bahasa Indonesia modern, bentuk ini lebih alami daripada ungkapan harfiah “orang itu, Musa”; waw dipahami sebagai penghubung naratif dan tidak perlu dinyatakan secara tersendiri dalam ayat ini.
- source_word: ענו
  choice: rendah hati
  rationale: Dalam konteks ini kata tersebut terutama menggambarkan sikap atau watak Musa. “Rendah hati” alami dalam bahasa Indonesia dan tidak menyiratkan kelemahan seperti yang mungkin timbul dari “lemah lembut” dalam konteks tertentu.
- source_word: מְאֹד
  choice: sangat
  rationale: Menyampaikan penguat adverbial Ibrani secara langsung dan alami.
- source_word: מִ/כֹּל הָאָדָם
  choice: lebih daripada siapa pun
  rationale: Konstruksi perbandingan ini bersifat generik dan mencakup manusia mana pun, bukan hanya laki-laki. “Siapa pun” menyampaikan cakupan itu dengan wajar tanpa menambah penafsiran.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: yang ada di muka bumi
  rationale: Mempertahankan ungkapan figuratif Ibrani “di muka bumi” dalam bentuk Indonesia yang lazim dan bermartabat.
theological_decisions:
- issue: Cakupan generik הָאָדָם dalam perbandingan
  choice: siapa pun
  alternative: setiap orang; semua manusia
  rationale: Kata אָדָם di sini menunjuk manusia secara umum. “Siapa pun” mempertahankan bentuk perbandingan tunggal sekaligus menyatakan cakupan universal tanpa membatasinya pada laki-laki.
- issue: Makna ענו sebagai gambaran Musa
  choice: rendah hati
  alternative: lemah lembut; tertindas
  rationale: Konteks menjadikannya deskripsi watak Musa. “Rendah hati” paling tepat dalam bahasa Indonesia modern, sedangkan “tertindas” menggeser makna kepada keadaan yang dialami dan “lemah lembut” dapat menonjolkan kelembutan lebih daripada kerendahan hati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat dibuat alami sambil mempertahankan perbandingan yang kuat serta idiom “di muka bumi” dari teks Ibrani.
