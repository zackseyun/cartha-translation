  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: id
  text: Lalu Yahweh turun dalam tiang awan dan berdiri di pintu masuk kemah,[a] lalu Ia memanggil Harun dan Miryam. Keduanya pun keluar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Kemah Pertemuan; teks Ibrani di sini hanya berbunyi “kemah”.
    reason: cross_reference
  - marker: b
    text: Atau “keduanya maju mendekat”. Kata Ibrani secara harfiah berarti “keluar”, tetapi dalam konteks ini dapat menunjuk pada tindakan maju untuk memenuhi panggilan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Kata kerja ירד menyatakan gerak turun secara konkret. Pilihan ini mempertahankan gambaran teofanik dan bahasa antropomorfis sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks sumber tidak diganti dengan gelar.
- source_word: בְּעַמּוּד עָנָן
  choice: dalam tiang awan
  rationale: Preposisi בְּ paling wajar menunjukkan medium atau wujud penyertaan ketika Yahweh turun; frasa Indonesia ini dekat dengan bentuk Ibrani dan tetap alami.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Makna dasar עמד sesuai dengan urutan tindakan naratif tanpa perlu diperluas menjadi 'mengambil tempat'.
- source_word: פֶּתַח הָאֹהֶל
  choice: di pintu masuk kemah
  rationale: פתח berarti bukaan atau pintu masuk. Teks hanya menyebut 'kemah', sementara identitasnya sebagai Kemah Pertemuan dijelaskan dalam catatan.
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: קרא secara langsung berarti memanggil; konteks memberi nuansa panggilan untuk menghadap tanpa perlu menerjemahkannya sebagai 'menyuruh datang'.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: Harun dan Miryam
  rationale: Harun adalah bentuk nama yang mapan dalam bahasa Indonesia, sedangkan Miryam mencerminkan nama Ibrani dan membedakannya secara wajar dari bentuk lain.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: Keduanya pun keluar
  rationale: Terjemahan ini mempertahankan makna leksikal יצא, 'keluar', dan penegasan שְׁנֵיהֶם, 'keduanya'. Partikel 'pun' menyampaikan kelanjutan respons secara alami tanpa menambahkan isi substantif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Transliterasi mempertahankan nama pribadi yang terdapat dalam teks sumber dan tidak menggantinya dengan gelar atau bentuk yang terikat tradisi tertentu.
- issue: Bahasa antropomorfis tentang turunnya Yahweh
  choice: Mempertahankan kata konkret 'turun'
  alternative: Menafsirkan secara kurang konkret sebagai 'menampakkan diri'
  rationale: Teks Ibrani secara eksplisit memakai ירד. Terjemahan tidak perlu meredakan ketegangan teologis atau menjelaskan cara kehadiran ilahi.
- issue: Arah gerak Harun dan Miryam
  choice: Keduanya pun keluar
  alternative: Keduanya maju mendekat
  rationale: Makna dasar יצא dipertahankan dalam teks utama. Kemungkinan pragmatis bahwa mereka maju untuk menghadap Yahweh dicatat tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Struktur rangkaian tindakan Ibrani dipertahankan secara alami melalui 'lalu' dan 'pun'; ambiguitas gerak pada יצא dijaga lewat teks utama yang formal-leksikal serta catatan alternatif.
