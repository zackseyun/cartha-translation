  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: id
  text: Mereka berkata[a], “Apakah Yahweh memang hanya berbicara melalui Musa? Bukankah Dia juga berbicara melalui kami?” Dan Yahweh mendengarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah Yahweh memang hanya berbicara kepada Musa? Bukankah Dia juga berbicara kepada kami?” Preposisi Ibrani dapat menandai penerima ataupun perantara perkataan ilahi; teks utama memilih “melalui” karena konteksnya menyangkut kewenangan kenabian.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mereka berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan urutan narasi dan memperkenalkan ucapan langsung; bahasa Indonesia tidak memerlukan kata penghubung eksplisit di sini.
- source_word: הֲרַק אַךְ
  choice: Apakah ... memang hanya
  rationale: Gabungan partikel tanya dan dua unsur pembatas/penegas menyampaikan pertanyaan retoris yang menantang sekaligus penekanan pada eksklusivitas.
- source_word: בְּמֹשֶׁה
  choice: melalui Musa
  rationale: Dalam konteks perkataan ilahi dan kewenangan kenabian, preposisi ב dapat menandai perantara. Namun, kemungkinan makna penerima, yaitu 'kepada Musa', tetap dicatat dalam catatan kaki.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh ... berbicara
  rationale: דבר menunjuk pada tindakan berbicara, khususnya penyampaian firman ilahi; nama יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: Bukankah Dia juga berbicara melalui kami?
  rationale: Pertanyaan retoris negatif diterjemahkan secara alami dengan 'Bukankah'; konstruksi yang sejajar dengan בְּמֹשֶׁה diterjemahkan secara konsisten sebagai 'melalui kami'.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: Dan Yahweh mendengarnya
  rationale: Objek yang tersirat dalam bahasa Ibrani dinyatakan dengan enklitik '-nya' agar alami dalam bahasa Indonesia, dengan acuan pada perkataan mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi itu dan mengikuti kebijakan proyek tanpa menggantinya dengan gelar.
- issue: Fungsi preposisi ב pada בְּמֹשֶׁה dan בָּנוּ
  choice: melalui Musa / melalui kami
  alternative: kepada Musa / kepada kami
  rationale: Konteks mempertentangkan kewenangan dan perantaraan kenabian, sehingga 'melalui' paling tepat dalam teks utama. Karena konstruksi Ibrani juga dapat menunjuk penerima perkataan, alternatif 'kepada' dipertahankan dalam catatan kaki dan ambiguitasnya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan retoris dibuat alami bagi pembaca umum, sambil mempertahankan penegasan ganda pada klaim bahwa Yahweh tidak berbicara hanya melalui Musa. Kapitalisasi 'Dia' dipakai secara hormat dan untuk memperjelas bahwa subjeknya adalah Yahweh.
