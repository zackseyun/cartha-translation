  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: id
  text: Yahweh berfirman kepada Musa, “Seandainya ayahnya meludahi wajahnya, bukankah ia akan dipermalukan selama tujuh hari?[a] Biarlah ia diasingkan di luar perkemahan selama tujuh hari. Sesudah itu, ia akan diterima kembali.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukankah ia akan merasa malu selama tujuh hari?”
    reason: lexical_alternative
  - marker: b
    text: Atau “sesudah itu, ia akan dikumpulkan kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti TUHAN.
- source_word: יָרֹק יָרַק
  choice: meludahi
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan meludah; dalam konstruksi pengandaian, bahasa Indonesia alami tidak memerlukan pengulangan harfiah.
- source_word: בְּפָנֶיהָ
  choice: wajahnya
  rationale: Dalam konteks tindakan meludah, frasa ini secara idiomatis berarti meludahi wajahnya dan menyatakan penghinaan langsung.
- source_word: תִכָּלֵם
  choice: akan dipermalukan
  rationale: Bentuk Nifal menyatakan keadaan dipermalukan atau mendapat aib; bentuk pasif mempertahankan tekanan sosial dari ungkapan Ibrani.
- source_word: תִּסָּגֵר
  choice: Biarlah ia dikucilkan
  rationale: Bentuk pasif menunjuk pada pemisahan atau pengurungan; 'dikucilkan' menyampaikan penyingkiran dari lingkungan perkemahan secara wajar dalam bahasa Indonesia.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Padanan langsung dan alami untuk tempat pengucilan yang disebutkan dalam teks.
- source_word: תֵּאָסֵף
  choice: ia boleh diterima kembali
  rationale: Bentuk pasif dari אסף secara harfiah berkaitan dengan dikumpulkan; dalam konteks ini, maksudnya ialah diterima kembali ke dalam komunitas setelah masa pengucilan.
theological_decisions:
- issue: Sifat klausa tentang ayah yang meludah
  choice: Analogi pengandaian tentang penghinaan dan pengucilan
  alternative: Penyebutan peristiwa nyata yang pernah terjadi
  rationale: Susunan Ibrani berfungsi sebagai pengandaian retoris yang mendasari masa pengucilan Miryam; terjemahan tidak menambahkan makna simbolis atau doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Nama Yahweh dipertahankan; pertanyaan retoris, bentuk pasif, dan gambaran sosial tentang penghinaan serta penerimaan kembali dijaga tanpa memperhalus ketegangan teks.
