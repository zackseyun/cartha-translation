  - severity: low
    issue: '''Dikucilkan'' berpotensi terlalu menekankan ostrasisme sosial.'
    rationale: תִּסָּגֵר, bersama 'di luar perkemahan', menunjuk pada pemisahan atau pengasingan yang konkret. 'Diasingkan' menyampaikan hal ini secara lebih langsung dalam bahasa Indonesia modern.
  - severity: low
    issue: Catatan b diberi label 'Secara harfiah' tetapi memuat parafrasa bermodal 'boleh'.
    rationale: Catatan audit Inggris menandainya sebagai alternatif leksikal. Rumusan alternatif yang langsung lebih akurat dan konsisten.
