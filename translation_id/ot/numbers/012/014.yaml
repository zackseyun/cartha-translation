  to: Yahweh berfirman kepada Musa, “Seandainya ayahnya meludahi wajahnya, bukankah ia akan dipermalukan selama tujuh hari?[a] Biarlah ia diasingkan di luar perkemahan selama tujuh hari. Sesudah itu, ia akan diterima kembali.[b]”
