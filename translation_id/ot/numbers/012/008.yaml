  variant: modern standard Indonesian
source:
  edition: WLC
  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: id
  text: Aku berbicara dengannya secara langsung[a], dengan jelas dan bukan dalam teka-teki; ia memandang rupa Yahweh.[b] Jadi, mengapa kalian tidak takut berbicara menentang hamba-Ku, menentang Musa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut ke mulut”; yaitu melalui pembicaraan langsung. Dapat juga diterjemahkan “berhadapan muka”.
    reason: lexical_alternative
  - marker: b
    text: Atau “keserupaan Yahweh” atau “penampakan Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: dari mulut ke mulut
  rationale: Mempertahankan ungkapan konkret Ibrani yang menekankan komunikasi langsung; ungkapan ini sengaja tidak disamakan begitu saja dengan 'berhadapan muka'.
- source_word: אֲדַבֶּר בּוֹ
  choice: Aku berbicara dengannya
  rationale: Konstruksi דבר dengan ב mendukung makna berbicara dengan seseorang, bukan sekadar menyampaikan perkataan kepadanya.
- source_word: וּמַרְאֶה
  choice: dengan jelas
  rationale: Dalam pertentangannya dengan 'bukan dalam teka-teki', kata ini paling wajar dipahami sebagai komunikasi yang nyata atau jelas, tanpa menjadikannya objek terpisah.
- source_word: וְלֹא בְחִידֹת
  choice: dan bukan dalam teka-teki
  rationale: חידות menunjuk pada tuturan penuh teka-teki atau makna terselubung; terjemahan ini alami dan mempertahankan kontras dengan penyataan langsung.
- source_word: וּתְמֻנַת יְהוָה
  choice: rupa Yahweh
  rationale: תמונה dapat berarti rupa, bentuk, atau keserupaan. 'Rupa' mempertahankan pernyataan konkret teks tanpa menjelaskan secara berlebihan hakikat penampakan ilahi.
- source_word: יַבִּיט
  choice: ia memandang
  rationale: Bentuk ini menyiratkan tindakan melihat dengan sengaja; 'memandang' lebih tepat daripada sekadar 'melihat' dan tetap alami dalam bahasa Indonesia.
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: Jadi, mengapa kalian tidak takut
  rationale: Kata penghubung memperkenalkan kesimpulan retoris dari keunikan penyataan kepada Musa; bentuk jamak ditandai dengan 'kalian'.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: berbicara menentang hamba-Ku, menentang Musa
  rationale: Dalam konteks teguran, preposisi ב menandai sasaran perkataan yang memusuhi. Pengulangan 'menentang' mencerminkan pengulangan preposisi dan menonjolkan aposisi Musa sebagai hamba Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian YHWH. 'Yahweh' mempertahankan nama diri tersebut dan tidak menggantinya dengan gelar.
- issue: Gambaran tentang penyataan unik kepada Musa
  choice: ia memandang rupa Yahweh
  alternative: ia melihat keserupaan Yahweh; ia memandang penampakan Yahweh
  rationale: Terjemahan ini menegaskan klaim teks mengenai penyataan yang luar biasa langsung kepada Musa, tetapi tidak menentukan hakikat metafisis dari rupa yang dipandangnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pronomina 'Aku' dan bentuk kepunyaan '-Ku' dikapitalisasi karena merupakan ucapan Yahweh; 'kalian' memperjelas bahwa teguran diarahkan kepada lebih dari satu orang. Ungkapan sumber yang tidak lazim, 'dari mulut ke mulut', dipertahankan dan dijelaskan melalui catatan kaki.
