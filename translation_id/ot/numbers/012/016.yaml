  yaml_path: translation/ot/numbers/012/016.yaml
  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: id
  text: Sesudah itu, bangsa itu berangkat dari Hazerot lalu berkemah di padang gurun Paran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai urutan waktu setelah peristiwa sebelumnya dengan ungkapan Indonesia yang alami dan jelas.
- source_word: נָסְעוּ
  choice: berangkat
  rationale: Dalam kisah perjalanan di padang gurun, verba נסע menyatakan pembongkaran perkemahan untuk melanjutkan perjalanan; 'berangkat' menyampaikan gerak tersebut secara wajar.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk secara kolektif kepada umat Israel; 'bangsa itu' mempertahankan acuan kolektif dan definitnya dalam konteks.
- source_word: מֵחֲצֵרוֹת
  choice: dari Hazerot
  rationale: Nama tempat ditransliterasikan ke bentuk Indonesia yang mengikuti bunyi Ibrani secara wajar.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Verba חנה berarti mendirikan atau menempati perkemahan; 'berkemah' adalah padanan Indonesia modern, sedangkan 'lalu' menyampaikan kesinambungan naratif waw-consecutive.
- source_word: בְּמִדְבַּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk wilayah liar dan gersang; 'padang gurun' merupakan padanan Indonesia yang lazim tanpa membatasi makna hanya pada gurun pasir.
- source_word: פָּארָן
  choice: Paran
  rationale: Nama tempat dipertahankan melalui transliterasi yang lazim dalam bahasa Indonesia.
