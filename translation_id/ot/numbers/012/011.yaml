  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: id
  text: Lalu Harun berkata kepada Musa, “Kumohon, Tuanku, janganlah bebankan dosa kepada kami[a], dosa yang dalam hal itu kami telah bertindak bodoh dan telah berdosa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “janganlah bebankan kesalahan kepada kami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Kumohon, Tuanku
  rationale: בִּי menyatakan permohonan yang mendesak, sedangkan אֲדֹנִי merupakan sapaan hormat kepada Musa, bukan gelar ilahi. “Kumohon, Tuanku” mempertahankan kerendahan hati dan urgensi Harun.
- source_word: אַל נָא
  choice: janganlah
  rationale: Partikel נָא memperhalus dan memperkuat permohonan. Nuansa itu sudah disampaikan oleh “Kumohon”, sementara bentuk “janganlah” menyampaikan larangan dengan wajar dalam bahasa Indonesia.
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: bebankan dosa kepada kami
  rationale: Ungkapan שׂים + עַל secara harfiah menggambarkan penempatan sesuatu ke atas seseorang. “Bebankan ... kepada kami” mempertahankan metafora tersebut dengan bahasa Indonesia yang alami. חַטָּאת dapat menunjuk pada dosa atau kesalahan/keadaan bersalah; “dosa” dipakai dalam teks utama dan alternatifnya dicatat.
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: karena kami telah bertindak bodoh
  rationale: 'Bentuk Niphal dari יאל di sini menyatakan tindakan bodoh atau tidak berakal. Dalam konteks permohonan dan pengakuan, אֲשֶׁר paling wajar dipahami dengan daya kausal: “karena”.'
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: dan karena kami telah berdosa
  rationale: Klausa kedua memperjelas dan memperkuat pengakuan pertama. Pengulangan “karena” mempertahankan kesejajaran dua klausa אֲשֶׁר.
theological_decisions:
- issue: Makna אֲדֹנִי dalam sapaan kepada Musa
  choice: Tuanku
  alternative: Tuan
  rationale: Dalam konteks ini kata tersebut merupakan sapaan hormat manusiawi kepada Musa, bukan sebutan bagi Allah. “Tuanku” mempertahankan nada takzim dan hubungan sosial dalam permohonan Harun.
- issue: Makna חַטָּאת dalam permohonan Harun
  choice: dosa
  alternative: kesalahan
  rationale: Kata ini dapat menyoroti pelanggaran maupun tanggungan kesalahan yang timbul darinya. Teks utama mempertahankan padanan langsung “dosa”, sedangkan catatan kaki menjaga kemungkinan makna “kesalahan” tanpa menyelesaikan ambiguitas secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Tuanku” sengaja dipertahankan sebagai penghormatan kepada Musa tanpa menyiratkan keilahian. Pengulangan “karena” mencerminkan struktur pengakuan ganda dalam bahasa sumber.
