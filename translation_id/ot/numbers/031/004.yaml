translation:
  language: id
  text: Seribu orang dari setiap suku, seribu orang dari setiap suku, dari semua suku Israel, harus kamu kirim untuk dinas militer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepada pasukan.” Kata Ibrani לַצָּבָא dapat menunjuk pada pasukan atau pada dinas militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף
  choice: seribu orang
  rationale: Bilangan אֶלֶף berarti ‘seribu’. Kata ‘orang’ ditambahkan secara wajar dalam bahasa Indonesia karena konteksnya adalah pengerahan anggota pasukan.
- source_word: לַמַּטֶּה
  choice: dari setiap suku
  rationale: מַטֶּה berarti ‘suku’ dalam konteks Israel. Preposisi ל dengan angka yang diulang berfungsi secara distributif, yakni seribu orang dari masing-masing suku.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: Seribu orang dari setiap suku, seribu orang dari setiap suku
  rationale: Pengulangan yang nyata dalam teks Ibrani dipertahankan demi penekanan retoris dan transparansi formal, meskipun bahasa Indonesia lazimnya dapat meringkasnya.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: dari semua suku Israel
  rationale: 'Frasa ini menegaskan cakupan distributif pengerahan tersebut: orang-orang harus diambil dari seluruh suku Israel.'
- source_word: תִּשְׁלְחוּ
  choice: harus kamu kirim
  rationale: Bentuk imperfek orang kedua jamak memiliki daya perintah dalam konteks ini. ‘Harus kamu kirim’ menyampaikan kewajiban tanpa mengubahnya menjadi parafrasa bebas.
- source_word: לַצָּבָא
  choice: untuk berperang
  rationale: צָבָא dalam konteks ini menunjuk pada pasukan, pengerahan militer, atau peperangan. ‘Untuk berperang’ merupakan ungkapan Indonesia yang alami bagi tujuan pengiriman tersebut, sementara alternatif leksikalnya dicatat dalam catatan kaki.
