source:
  edition: WLC
  text: וְ/אֶת מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל חַלְלֵי/הֶ֗ם אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְ/אֵת֙ בִּלְעָ֣ם בֶּן בְּע֔וֹר הָרְג֖וּ בֶּ/חָֽרֶב־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: id
  text: 'Mereka membunuh raja-raja Midian bersama orang-orang Midian lainnya yang terbunuh: Ewi[a], Rekem, Zur, Hur, dan Reba—kelima raja Midian itu. Mereka juga membunuh Bileam anak Beor dengan pedang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di antara orang-orang Midian yang terbunuh.” Ungkapan Ibraninya padat dan dapat menggambarkan para raja itu sebagai orang-orang yang dibunuh di antara orang Midian lainnya yang tewas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: membunuh
  rationale: Verba Qal perfektum orang ketiga jamak dari הרג secara langsung menyatakan tindakan membunuh; bentuk aktif ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: עַל חַלְלֵיהֶם
  choice: bersama orang-orang mereka yang terbunuh
  rationale: Ungkapan Ibrani yang padat ini secara harfiah memakai preposisi 'atas/di antara' dan dapat menunjukkan bahwa para raja dibunuh bersama atau di antara orang-orang Midian lain yang tewas. Terjemahan utama mempertahankan kaitan itu tanpa menentukan nuansa ruang secara berlebihan.
- source_word: מַלְכֵי מִדְיָן
  choice: raja-raja Midian
  rationale: Rangkaian konstruksi ini berarti 'raja-raja Midian'; bentuk yang sama dipertahankan pada keterangan setelah daftar nama.
- source_word: אֱוִי
  choice: Ewi
  rationale: Nama diri ditransliterasikan dengan w untuk mewakili bunyi konsonan Ibrani secara wajar dalam ejaan Indonesia.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: צוּר
  choice: Zur
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: חוּר
  choice: Hur
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: רֶבַע
  choice: Reba
  rationale: Nama diri ditransliterasikan dalam bentuk Alkitabiah Indonesia yang lazim.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: kelima raja Midian itu
  rationale: Frasa ini merupakan aposisi yang merangkum lima nama sebelumnya; 'kelima ... itu' menyampaikan sifat tentu dan fungsi rangkumannya secara alami.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Bileam anak Beor
  rationale: Nama dan patronimik diterjemahkan dengan bentuk nama yang dikenal dalam bahasa Indonesia serta hubungan langsung 'anak Beor'.
- source_word: בֶּחָרֶב
  choice: dengan pedang
  rationale: Preposisi ב instrumental menyatakan alat; 'dengan pedang' mempertahankan gambaran konkret teks Ibrani.
