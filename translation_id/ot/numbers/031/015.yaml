  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: id
  text: Musa berkata kepada mereka, “Apakah kalian membiarkan semua perempuan tetap hidup?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar diterjemahkan dengan verba lampau kontekstual “berkata”; bahasa Indonesia tidak menandai kala secara morfologis.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Preposisi אֶל dengan sufiks orang ketiga jamak maskulin menunjukkan pihak yang menjadi tujuan perkataan.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk nama yang baku dan umum dalam bahasa Indonesia.
- source_word: הַחִיִּיתֶם
  choice: Mengapa kalian membiarkan ... tetap hidup?
  rationale: Bentuk Hifil dari חיה berarti “membiarkan hidup” atau “mempertahankan hidup.” Partikel הַ di sini dapat dipahami sebagai penanda pertanyaan retoris bernada teguran; “mengapa” membuat fungsi pragmatis itu alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan pertanyaan ya/tidak yang lebih formal.
- source_word: כָּל
  choice: semua
  rationale: Dengan nomina tunggal kolektif dalam konstruksi ini, כָּל menyatakan cakupan menyeluruh; “semua” paling alami dalam bahasa Indonesia.
- source_word: נְקֵבָה
  choice: perempuan
  rationale: נְקֵבָה menunjuk jenis kelamin perempuan tanpa membatasi usia. Dalam konteks manusia, “perempuan” lebih alami dan bermartabat daripada “betina,” serta tidak mempersempit makna menjadi perempuan dewasa saja.
theological_decisions:
- issue: Cakupan נְקֵבָה dalam konteks kekerasan perang
  choice: perempuan
  alternative: wanita; perempuan dan anak perempuan
  rationale: Teks Ibrani menggunakan istilah yang mencakup semua manusia berjenis kelamin perempuan dan tidak membatasi usia. “Perempuan” mempertahankan cakupan dan ketegangan teks tanpa menambahkan perincian interpretatif.
- issue: Daya interogatif הַחִיִּיתֶם
  choice: pertanyaan teguran dengan “Mengapa”
  alternative: 'pertanyaan ya/tidak: “Apakah kalian membiarkan ...?”'
  rationale: Dalam konteks Musa menegur para pemimpin pasukan (ay. 14), pertanyaan ini berfungsi sebagai teguran atas tindakan yang telah dilakukan. Namun, karena bentuk Ibraninya juga dapat direpresentasikan secara lebih formal sebagai pertanyaan ya/tidak, alternatif tersebut dicatat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “kalian” menandai orang kedua jamak secara alami; “mereka” merujuk pada kelompok yang disapa Musa. Penempatan penanda catatan kaki sesudah kutipan mengikuti seluruh klausa yang diberi alternatif.
