  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: id
  text: Pisahkanlah bagi Yahweh bagian wajib dari para prajurit yang pergi berperang, yaitu satu dari setiap lima ratus[a], baik dari manusia[b], sapi, keledai, maupun kambing domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “satu jiwa dari lima ratus.” Kata Ibrani nefesh di sini dipakai sebagai satuan hitung untuk satu makhluk hidup, baik manusia maupun hewan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani adam di sini menunjuk pada bagian manusia dari hasil rampasan, berbeda dengan hewan-hewan yang disebut sesudahnya.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲרֵמֹתָ מֶכֶס
  choice: Pisahkanlah ... bagian wajib
  rationale: Bentuk kausatif רום menyatakan tindakan mengambil atau mengkhususkan suatu bagian, sedangkan מֶכֶס adalah bagian yang diwajibkan dari hasil rampasan. Gabungan ini alami dalam bahasa Indonesia dan mempertahankan unsur pengkhususan serta kewajiban.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa bagian tersebut dikhususkan bagi Yahweh; nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: dari para prajurit yang pergi berperang
  rationale: Ungkapan ini menunjuk kepada para laki-laki yang ikut dalam operasi militer. “Para prajurit” menyampaikan makna militernya secara wajar dan ringkas.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: satu dari setiap lima ratus
  rationale: נֶפֶשׁ di sini berfungsi sebagai istilah hitung bagi satu makhluk hidup dan mencakup manusia maupun hewan. Terjemahan utama dibuat alami, sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: מִן הָאָדָם
  choice: dari manusia
  rationale: אָדָם di sini menunjuk pada kelompok manusia dalam rampasan, sebagai lawan dari kategori hewan yang menyusul.
- source_word: וּמִן הַבָּקָר
  choice: sapi
  rationale: בָּקָר adalah istilah kolektif bagi ternak sapi.
- source_word: וּמִן הַחֲמֹרִים
  choice: keledai
  rationale: חֲמֹרִים secara langsung berarti keledai-keledai; bentuk tanpa pengulangan lebih alami untuk daftar kategori dalam bahasa Indonesia.
- source_word: וּמִן הַצֹּאן
  choice: kambing domba
  rationale: צֹאן adalah istilah kolektif yang mencakup ternak kecil, khususnya domba dan kambing; “kambing domba” menghindari penyempitan menjadi domba saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan נֶפֶשׁ dalam penghitungan
  choice: Tidak menerjemahkan נֶפֶשׁ sebagai “jiwa” dalam teks utama
  alternative: satu jiwa dari setiap lima ratus; satu makhluk hidup dari setiap lima ratus
  rationale: Dalam konteks ini נֶפֶשׁ mencakup manusia dan hewan sebagai satuan hitung, bukan pernyataan mengenai unsur rohani. Terjemahan ringkas mempertahankan cakupan itu tanpa memberi kesan metafisik yang tidak dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat mempertahankan bentuk perintah kepada satu orang serta susunan daftar sumber bagian wajib, tetapi menghindari ungkapan harfiah yang terdengar metafisik atau kaku.
