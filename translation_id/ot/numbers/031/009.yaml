  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: id
  text: Orang Israel menawan perempuan-perempuan Midian dan anak-anak mereka, lalu menjarah semua ternak mereka, semua kawanan ternak mereka, dan seluruh harta mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: menawan
  rationale: Bentuk Qal dari שׁבה menunjuk pada tindakan menjadikan orang sebagai tawanan; “menawan” ringkas dan alami dalam konteks perang.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan ini secara idiomatis menunjuk pada bangsa Israel. “Orang Israel” alami dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa yang dimaksud hanya anak-anak secara harfiah.
- source_word: נְשֵׁי מִדְיָן
  choice: perempuan-perempuan Midian
  rationale: נָשִׁים di sini berarti perempuan secara umum, bukan secara khusus para istri.
- source_word: טַפָּם
  choice: anak-anak mereka
  rationale: טַף menunjuk terutama pada anak-anak kecil; “anak-anak” merupakan padanan Indonesia yang alami dalam konteks ini tanpa mempersempit secara tidak perlu.
- source_word: בְּהֶמְתָּם
  choice: semua ternak
  rationale: בְּהֵמָה dalam pemakaian kolektif menunjuk pada hewan peliharaan atau ternak.
- source_word: מִקְנֵהֶם
  choice: kawanan hewan
  rationale: מִקְנֶה lazim menunjuk pada kepemilikan berupa kawanan ternak. Padanan ini membedakannya dari בְּהֵמָה sambil mempertahankan nuansa pastoral.
- source_word: חֵילָם
  choice: seluruh kekayaan mereka
  rationale: Dalam konteks nonmiliter ini, חַיִל paling wajar berarti kekayaan atau sumber daya material yang tersisa setelah manusia dan ternak disebutkan.
- source_word: בָּזָזוּ
  choice: menjarah
  rationale: בזז berarti mengambil jarahan sesudah kemenangan; “menjarah” mempertahankan nuansa tindakan perang tersebut.
theological_decisions:
- issue: Ungkapan etnonim בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: Anak-anak Israel
  rationale: Tidak ada perbedaan doktrinal yang dipertaruhkan. “Orang Israel” menyampaikan fungsi etnonim ungkapan Ibrani secara jelas dan wajar dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti dua tindakan utama dalam teks Ibrani—menawan manusia dan menjarah harta—dengan “lalu” untuk alur yang alami. Pengulangan “semua/seluruh” dipertahankan untuk mencerminkan כָּל pada setiap kelompok benda.
