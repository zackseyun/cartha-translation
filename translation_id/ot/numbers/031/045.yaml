lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: dan keledai
  rationale: חֲמֹרִים adalah bentuk jamak umum untuk 'keledai'; prefiks וַ diterjemahkan 'dan' untuk mempertahankan struktur daftar. Bahasa Indonesia tidak memerlukan kata sandang.
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: tiga puluh ribu
  rationale: Konstruksi bilangan Ibrani standar ini berarti 'tiga puluh ribu'.
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: lima ratus
  rationale: Nilainya diterjemahkan langsung sebagai 'lima ratus'. Konjungsi Ibrani menyatakan penjumlahan dalam bilangan majemuk, tetapi tidak perlu diungkapkan dengan 'dan' karena bentuk alami bilangan Indonesia ialah 'tiga puluh ribu lima ratus'.
- source_word: חֲמֹרִים ... שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: keledai, tiga puluh ribu lima ratus ekor
  rationale: Kata penggolong 'ekor' ditempatkan sesudah jumlah agar daftar inventaris terdengar alami dan jelas dalam bahasa Indonesia.
