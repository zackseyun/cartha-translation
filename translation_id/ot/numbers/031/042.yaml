  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: id
  text: Dan dari separuh bagian milik orang Israel, yang Musa pisahkan dari para laki-laki yang berangkat untuk berperang[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang sedang dalam kampanye militer” atau “yang bertugas dalam dinas militer.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: Dan dari separuh bagian
  rationale: Konjungsi dan preposisi berawalan tetap diwakili. Dalam konteks pembagian jarahan, מַחֲצִית menunjuk pada separuh atau jatah separuh; “separuh bagian” jelas dan wajar dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: milik orang Israel
  rationale: Ungkapan ini menunjuk secara kolektif kepada umat Israel. “Orang Israel” merupakan padanan Indonesia yang alami, sedangkan “milik” memperjelas hubungan bagian tersebut dengan mereka.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif “yang” secara alami merujuk kembali kepada separuh bagian itu.
- source_word: חָצָה
  choice: telah ... pisahkan
  rationale: Dalam konteks pembagian jarahan menjadi dua, verba ini menyatakan tindakan membagi atau memisahkan satu bagian. Bentuk “telah Musa pisahkan” mempertahankan tindakan yang sudah dilakukan tanpa mempersempit maknanya menjadi pembagian administratif tertentu.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: מִן הָ/אֲנָשִׁים
  choice: dari para laki-laki
  rationale: אֲנָשִׁים secara harfiah berarti laki-laki atau orang-orang; konteksnya adalah para petempur laki-laki, sehingga unsur gender dipertahankan.
- source_word: הַ/צֹּבְאִים
  choice: yang bertugas dalam pasukan
  rationale: Partisip dari צבא menunjuk kepada mereka yang menjalankan dinas atau kegiatan militer. Pilihan ini alami dalam bahasa Indonesia dan tetap membuka cakupan antara berdinas, ikut berperang, dan menjalani kampanye militer.
