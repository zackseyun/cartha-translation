  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: id
  text: Pada hari ketujuh kamu harus mencuci pakaianmu dan menjadi tahir; sesudah itu kamu boleh masuk ke perkemahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: kamu harus mencuci
  rationale: Bentuk Piel dari כבס secara khusus menunjuk pada mencuci pakaian atau kain. Dalam konteks petunjuk ritual, 'harus mencuci' menyampaikan kewajiban dengan wajar dalam bahasa Indonesia.
- source_word: בִּגְדֵיכֶם
  choice: pakaianmu
  rationale: בגד berarti pakaian atau kain sandang; 'pakaian' merupakan padanan baku dan alami.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Padanan langsung dan idiomatis bagi ungkapan waktu Ibrani ini.
- source_word: וּטְהַרְתֶּם
  choice: dan menjadi tahir
  rationale: Qal טהר di sini bersifat intransitif/resultatif, yakni memasuki keadaan tahir sesudah pencucian yang ditetapkan. 'Menjadi tahir' mempertahankan nuansa status ritual tanpa menyiratkan bahwa mereka sendiri melakukan seluruh tindakan pentahiran.
- source_word: וְאַחַר
  choice: sesudah itu
  rationale: 'Menandai urutan: masuk ke perkemahan terjadi setelah proses pentahiran selesai.'
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: kamu boleh masuk ke perkemahan
  rationale: Secara harfiah berarti datang atau masuk ke perkemahan. Dalam konteks aturan kenajisan, tindakan ini merupakan izin untuk masuk kembali setelah menjadi tahir, sehingga 'boleh masuk' menyampaikan fungsi pragmatisnya.
theological_decisions:
- issue: Bahasa ketahiran ritual
  choice: menjadi tahir
  alternative: ditahirkan; menyucikan diri
  rationale: '''Menjadi tahir'' mempertahankan keadaan ritual yang dinyatakan oleh bentuk Qal טהר dan tidak mengalihkannya menjadi penyucian moral atau rohani. Ungkapan ini juga tidak melebihkan agensi seperti ''menyucikan diri''.'
- issue: Modalitas masuk ke perkemahan
  choice: boleh masuk
  alternative: akan masuk; harus masuk
  rationale: Bentuk Ibrani dapat dibaca secara sederhana sebagai tindakan berikutnya, tetapi konteks aturan pentahiran menunjukkan bahwa masuk kembali diizinkan setelah ketahiran tercapai. 'Boleh' membuat implikasi kontekstual itu jelas tanpa menambahkan kewajiban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'tahir' dipertahankan karena merupakan istilah yang tepat dan dikenal untuk status bersih secara ritual; 'perkemahan' dipilih untuk המחנה. Pronomina tunggal kolektif 'kamu' mengikuti kebiasaan bahasa Indonesia meskipun bentuk Ibraninya jamak.
