  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: id
  text: Kemudian Imam Eleazar berkata kepada para prajurit yang datang untuk berperang, “Inilah ketetapan hukum[a] yang diperintahkan Yahweh kepada Musa:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan Taurat” atau “ketetapan pengajaran.”
    reason: Frasa חֻקַּת הַתּוֹרָה dapat diterjemahkan sebagai ketetapan hukum, ketetapan Taurat, atau ketetapan pengajaran, karena תּוֹרָה dapat menunjuk pada hukum maupun pengajaran yang berwenang.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “kemudian” menyatakan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, dan gelar definitnya ditempatkan secara idiomatis sebelum nama.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: para prajurit
  rationale: Ungkapan harfiah “orang-orang dari pasukan” menunjuk kepada anggota laki-laki pasukan; “para prajurit” ringkas, alami, dan mempertahankan makna militernya.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: yang telah pergi berperang
  rationale: Partisip dengan לַמִּלְחָמָה menggambarkan mereka dalam kaitannya dengan gerak menuju peperangan. Dalam konteks pasukan yang telah selesai bertempur, “telah pergi berperang” terdengar alami tanpa menambahkan secara eksplisit bahwa mereka “kembali dari” perang.
- source_word: זֹאת חֻקַּת הַתּוֹרָה
  choice: Inilah ketetapan hukum
  rationale: Klausa nominal diterjemahkan dengan “inilah”; חֻקָּה menyatakan ketetapan yang mengikat, sedangkan תּוֹרָה di sini adalah hukum atau pengajaran yang berwenang.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: yang diperintahkan Yahweh kepada Musa
  rationale: Musa adalah orang yang menerima perintah, sebagaimana ditandai oleh אֶת; konstruksi pasif ini alami dalam bahasa Indonesia dan tidak mengubah Musa menjadi perantara yang tidak dinyatakan oleh frasa tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Hubungan Musa dengan perintah
  choice: diperintahkan Yahweh kepada Musa
  alternative: diperintahkan Yahweh melalui Musa
  rationale: Penanda objek אֶת menunjukkan Musa sebagai penerima perintah. Terjemahan “melalui Musa” akan menambahkan gagasan perantaraan yang tidak dinyatakan dalam klausa ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Para prajurit” dipilih daripada ungkapan harfiah yang kaku, sedangkan “ketetapan hukum” mempertahankan corak hukum teks. Tanda titik dua dipertahankan karena ayat berikutnya meneruskan ucapan Eleazar.
