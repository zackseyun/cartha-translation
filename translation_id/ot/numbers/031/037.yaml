base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: id
  text: Upeti bagi Yahweh dari kawanan ternak itu berjumlah enam ratus tujuh puluh lima ekor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: berjumlah
  rationale: Dalam konteks ini, bentuk naratif dari היה menghubungkan bagian upeti dengan jumlahnya. Bahasa Indonesia alami menyatakannya dengan "berjumlah"; hubungan dengan ayat sebelumnya sudah membuat kata sambung eksplisit tidak diperlukan.
- source_word: הַמֶּכֶס
  choice: upeti
  rationale: מֶכֶס menunjuk pada bagian wajib dari jarahan perang yang dipisahkan sebagai hak tertentu. "Upeti" mempertahankan nuansa bagian yang diwajibkan tanpa memasukkan kategori pajak modern.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai pihak yang menerima atau bagi siapa bagian itu dikhususkan. "Bagi" menyampaikan peruntukan tersebut secara wajar.
- source_word: יהוה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai "Yahweh", sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: מִן הַצֹּאן
  choice: dari kawanan ternak itu
  rationale: צֹאן adalah sebutan kolektif untuk ternak kecil, khususnya domba dan kambing. "Kawanan ternak" tidak mempersempitnya menjadi domba saja, sedangkan "itu" mencerminkan artikel definit dalam bahasa Ibrani.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: enam ratus tujuh puluh lima ekor
  rationale: Angka diterjemahkan tepat sebagai 675. Kata penggolong "ekor" ditambahkan secara alami dalam bahasa Indonesia karena yang dihitung adalah hewan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama יהוה secara langsung. "Yahweh" mempertahankan nama khusus itu dan membedakannya dari gelar umum, tanpa menambahkan tafsiran denominatif.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca modern sambil mempertahankan arti bahwa 675 ekor merupakan bagian wajib yang dikhususkan bagi Yahweh.
