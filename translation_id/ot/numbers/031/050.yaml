  terminology: «Yahweh», «persembahan», dan «mengadakan pendamaian» dapat dipertahankan. «Perhiasan» untuk כוּמָז merupakan pilihan umum yang aman, asalkan ketidakpastiannya tetap dijelaskan dalam catatan kaki.
