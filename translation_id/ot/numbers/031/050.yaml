  to: 'Jadi, kami telah membawa persembahan bagi Yahweh: masing-masing membawa apa yang ditemukannya—barang-barang emas, gelang lengan atas[a], gelang tangan, cincin, anting-anting, dan perhiasan[b]—untuk mengadakan pendamaian bagi diri kami[c] di hadapan Yahweh.'
