id: NUM.31.50
reference: Numbers 31:50
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: id
  text: 'Jadi, kami telah membawa persembahan bagi Yahweh: masing-masing membawa apa yang ditemukannya—barang-barang emas, gelang lengan atas[a], gelang tangan, cincin, anting-anting, dan perhiasan[b]—untuk mengadakan pendamaian bagi diri kami[c] di hadapan Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “gelang kaki”; arti tepat אֶצְעָדָה tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Arti tepat כוּמָז tidak pasti; mungkin sejenis kalung, liontin, hiasan, atau cincin hidung.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bagi nyawa kami” atau “bagi pribadi kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: kami telah membawa
  rationale: Bentuk Hifil dari קרב berarti menyebabkan mendekat atau membawa mendekat. Dalam bahasa Indonesia, 'membawa persembahan' menyampaikan tindakan itu secara alami, sementara 'telah' sesuai dengan laporan para pemimpin tentang tindakan yang sudah dilakukan.
- source_word: קָרְבַּן יְהוָה
  choice: persembahan bagi Yahweh
  rationale: קָרְבָּן adalah sesuatu yang dibawa mendekat sebagai persembahan. Genitif Ibrani dapat menyatakan hubungan atau tujuan; 'bagi Yahweh' alami dalam bahasa Indonesia dan tidak memaksakan makna kepemilikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: masing-masing apa yang didapatnya
  rationale: אִישׁ berfungsi distributif dalam konteks para lelaki yang ikut berperang. 'Masing-masing' alami dan tetap menunjukkan sumbangan individual tanpa perlu mengulang kata 'orang'.
- source_word: כְלִי זָהָב
  choice: barang-barang emas
  rationale: כְלִי adalah istilah luas untuk barang, benda, perkakas, atau wadah. Dalam daftar ini, 'barang-barang emas' cukup luas dan tidak terlalu cepat membatasinya menjadi perhiasan.
- source_word: אֶצְעָדָה
  choice: gelang lengan
  rationale: Istilah ini menunjuk perhiasan pada anggota tubuh, tetapi lokasi tepatnya tidak pasti. 'Gelang lengan' dipakai dalam teks dan alternatif 'gelang kaki' dicatat.
- source_word: צָמִיד
  choice: gelang tangan
  rationale: צָמִיד menunjuk gelang atau lingkar perhiasan pada tangan/lengan. 'Gelang tangan' membedakannya dari אֶצְעָדָה dalam daftar.
- source_word: טַבַּעַת
  choice: cincin
  rationale: Makna dasarnya adalah cincin. Teks tidak mengharuskan pengkhususan sebagai cincin meterai.
- source_word: עָגִיל
  choice: anting-anting
  rationale: Dalam daftar perhiasan, istilah ini paling wajar menunjuk anting-anting.
- source_word: כוּמָז
  choice: perhiasan
  rationale: Jenis benda yang dimaksud tidak pasti. 'Perhiasan' sengaja dipilih sebagai istilah umum, dengan beberapa kemungkinan yang lebih spesifik dicatat dalam catatan kaki.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: כפר dalam konteks persembahan memiliki bobot ritual-teologis. 'Mengadakan pendamaian' mempertahankan bobot itu tanpa menjelaskan mekanismenya melampaui teks.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: bagi diri kami
  rationale: Secara harfiah frasa ini dapat berarti bagi nyawa, pribadi, atau diri kami. 'Bagi diri kami' idiomatis dan tidak memasukkan dikotomi tubuh-jiwa yang tidak dinyatakan teks.
theological_decisions:
- issue: Hubungan persembahan para prajurit dengan כפר
  choice: Persembahan itu dibawa untuk mengadakan pendamaian bagi mereka di hadapan Yahweh.
  alternative: Menganggapnya semata-mata persembahan syukur atau hanya tindakan untuk menangkal bahaya tanpa makna ritual.
  rationale: Ayat memakai כפר bersama קָרְבַּן dan frasa 'di hadapan Yahweh'. Karena itu, bahasa pendamaian perlu dipertahankan, tetapi cara atau mekanisme pendamaian tidak dijelaskan lebih jauh daripada sumber.
- issue: Daya distributif אִישׁ
  choice: masing-masing
  alternative: setiap orang atau setiap laki-laki
  rationale: Konteks mengacu kepada para lelaki dalam pasukan, tetapi dalam konstruksi ini fungsi utama אִישׁ adalah distributif. 'Masing-masing' menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur daftar dipertahankan, istilah benda yang tidak pasti tidak dibuat terlalu spesifik, dan nama ilahi ditulis 'Yahweh'. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
