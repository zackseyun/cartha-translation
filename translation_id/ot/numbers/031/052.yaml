source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: id
  text: Jumlah seluruh emas sumbangan[a] yang mereka persembahkan kepada Yahweh adalah 16.750 syikal, dari para pemimpin pasukan seribu dan dari para pemimpin pasukan seratus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan”. Istilah Ibrani ini menunjuk pada sumbangan yang dipisahkan dan diserahkan kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: Jumlah seluruh emas ... adalah
  rationale: Ungkapan ini menyatakan jumlah keseluruhan emas. Susunan dengan “jumlah ... adalah” alami dalam bahasa Indonesia dan tetap mempertahankan kaitan naratif ayat.
- source_word: הַתְּרוּמָה
  choice: sumbangan
  rationale: Kata תְּרוּמָה menunjuk pada sesuatu yang dipisahkan dan diserahkan untuk tujuan kudus. “Sumbangan” sesuai dengan konteks penyerahan sebagian barang rampasan dan lebih jelas daripada ungkapan tradisional yang harfiah.
- source_word: אֲשֶׁר הֵרִימוּ
  choice: yang mereka persembahkan
  rationale: Bentuk Hifil dari רום di sini mengacu pada tindakan menyerahkan atau mengkhususkan sesuatu sebagai persembahan, bukan sekadar mengangkatnya secara fisik.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau penerima penyerahan, sedangkan nama ilahi יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: 16.750 syikal
  rationale: Angka disajikan menurut konvensi penulisan Indonesia. “Syikal” mempertahankan satuan berat kuno tanpa mengubahnya menjadi nilai modern yang tidak pasti.
- source_word: מֵאֵת
  choice: berasal dari
  rationale: Preposisi ini menandai sumber emas tersebut. Kalimat kedua memperjelas hubungan sumber secara alami dalam bahasa Indonesia.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: para panglima pasukan seribu
  rationale: Dalam konteks militer, שַׂר berarti pemimpin atau panglima, sedangkan “seribu” menunjuk pada satuan pasukan.
- source_word: וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: dan para panglima pasukan seratus
  rationale: Terjemahan ini mempertahankan kesejajaran dengan panglima pasukan seribu dan struktur organisasi militer yang disebut dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri ilahi. “Yahweh” mempertahankan nama perjanjian tersebut secara langsung dan membedakannya dari gelar umum.
- issue: Sifat kudus dari תְּרוּמָה
  choice: sumbangan, dengan penjelasan dalam catatan kaki
  alternative: persembahan khusus
  rationale: “Sumbangan” cocok dengan barang rampasan yang diserahkan, sedangkan catatan kaki menjaga nuansa bahwa sumbangan itu dipisahkan bagi Yahweh tanpa memaksakan istilah ritual yang kurang jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang sumber dibagi menjadi dua agar hubungan jumlah dan sumbernya mudah dipahami. Istilah militer diterjemahkan secara konkret sebagai satuan pasukan, dan nama ilahi dipertahankan sebagai Yahweh.
