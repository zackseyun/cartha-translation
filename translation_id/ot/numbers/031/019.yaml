  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: id
  text: Kalian harus berkemah di luar perkemahan selama tujuh hari. Setiap orang yang telah membunuh seseorang dan setiap orang yang telah menyentuh orang yang terbunuh[a] harus menyucikan diri pada hari ketiga dan hari ketujuh—baik kalian maupun para tawanan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mayat orang yang terbunuh.” Secara harfiah, bahasa Ibrani menyebut “orang yang terbunuh”; dalam konteks ini yang dimaksud adalah menyentuh jenazah sehingga menjadi najis secara ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ
  choice: harus berkemah
  rationale: Bentuk imperatif jamak dari חנה memerintahkan mereka untuk berkemah atau tinggal dalam keadaan berkemah. Ungkapan ini alami dalam bahasa Indonesia dan, bersama konteksnya, tetap menyampaikan daya perintah.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Ungkapan tempat ini diterjemahkan secara langsung; “perkemahan” sesuai dengan latar pasukan dan perjalanan di padang gurun.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Kata “selama” menyatakan rentang waktu secara alami dalam bahasa Indonesia.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: setiap orang yang telah membunuh seseorang
  rationale: נֶפֶשׁ di sini menunjuk kepada seorang manusia, bukan “jiwa” sebagai konsep abstrak. Bentuk partisipnya dipahami dengan acuan lampau karena perintah ini diberikan sesudah pertempuran.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: dan setiap orang yang telah menyentuh orang yang terbunuh
  rationale: חָלָל menunjuk kepada orang yang mati karena kekerasan. Rumusan ini mempertahankan rujukan personal dalam bahasa Ibrani, sedangkan implikasi kontak dengan jenazah dijelaskan dalam catatan kaki.
- source_word: תִּתְחַטְּאוּ
  choice: harus menyucikan diri
  rationale: Dalam konteks ritual, bentuk Hitpael dari חטא berarti menjalani penyucian dari kenajisan. “Menyucikan diri” jelas dan tidak mengubahnya menjadi pernyataan tentang pengampunan moral.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketiga dan hari ketujuh
  rationale: Penanda waktu ritual dipertahankan secara eksplisit sebagaimana dalam teks sumber.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: baik kalian maupun para tawanan kalian
  rationale: שְׁבִי adalah orang-orang yang ditawan dalam perang. Konstruksi “baik ... maupun ...” memperjelas bahwa ketentuan penyucian berlaku bagi kedua kelompok tanpa mengubah cakupannya.
theological_decisions:
- issue: Sifat penyucian setelah membunuh atau menyentuh orang mati
  choice: penyucian ritual dari kenajisan akibat kontak dengan orang mati
  alternative: pembersihan moral dari kesalahan karena menumpahkan darah
  rationale: Konteks dan penyebutan hari ketiga serta hari ketujuh mengarah kepada tata cara penyucian dari kenajisan karena orang mati. Terjemahan “menyucikan diri” mempertahankan pengertian ritual tanpa menyatakan bahwa ayat ini terutama membahas pengampunan atas kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian”, sesuai dengan objek perintah yang jamak. Susunan kalimat dibuat alami dan bermartabat, sementara istilah “menyucikan diri” mempertahankan nuansa ritual. Tanda pisah menonjolkan penegasan penutup bahwa ketentuan itu berlaku bagi orang Israel yang dituju dan para tawanan mereka.
