  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: id
  text: Separuh bagian yang menjadi milik umat itu, dari kawanan kambing dan domba, berjumlah 337.500 ekor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: berjumlah
  rationale: Dalam pernyataan inventaris ini, bentuk וַתְּהִי memperkenalkan hasil penghitungan. 'Berjumlah' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'adalah'.
- source_word: מֶחֱצַת הָעֵדָה
  choice: bagian separuh milik umat itu
  rationale: Bentuk konstruk מֶחֱצַת menyatakan separuh yang menjadi jatah עֵדָה. Ungkapan ini menjaga makna pembagian dan kepemilikan yang tersirat dalam konteks.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel. 'Umat itu' alami dan bermartabat dalam konteks ini, tanpa menyiratkan lembaga keagamaan yang lebih kemudian.
- source_word: מִן הַצֹּאן
  choice: dari kawanan kambing domba
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, khususnya kambing dan domba. Penyebutan keduanya lebih jelas bagi pembaca Indonesia, sedangkan 'kawanan' mempertahankan sifat kolektifnya.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337.500 ekor
  rationale: Rangkaian bilangan Ibrani berjumlah tepat 337.500. Angka Arab memudahkan pembacaan daftar inventaris, dan kata penggolong 'ekor' alami dalam bahasa Indonesia.
