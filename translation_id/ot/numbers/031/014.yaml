id: NUM.31.14
reference: Numbers 31:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶ/חָ֑יִל שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/שָׂרֵ֣י הַ/מֵּא֔וֹת הַ/בָּאִ֖ים מִ/צְּבָ֥א הַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: id
  text: Musa marah kepada para perwira pasukan[a], yaitu para pemimpin pasukan seribu dan para pemimpin pasukan seratus, yang datang dari tugas perang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "para pejabat pasukan". Kata Ibrani dapat menunjuk orang-orang yang ditunjuk untuk memegang wewenang atas pasukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: marah
  rationale: Kata kerja קצף menyatakan kemarahan. 'Marah' alami dalam bahasa Indonesia modern dan tidak memperkuatnya secara berlebihan menjadi 'murka'.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: para perwira pasukan
  rationale: Bentuk פְּקוּדֵי merujuk kepada orang-orang yang ditunjuk untuk memegang wewenang, sedangkan הֶחָיִל menunjuk pasukan militer. 'Para perwira pasukan' menyampaikan fungsi kepemimpinan militernya secara jelas.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: para pemimpin pasukan seribu
  rationale: שָׂרֵי berarti para pemimpin atau pejabat. Penambahan 'pasukan' membuat susunan militer 'seribu' jelas dan wajar bagi pembaca Indonesia.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: dan para pemimpin pasukan seratus
  rationale: Terjemahan ini mempertahankan kesejajaran dengan pemimpin pasukan seribu serta struktur organisasi militer dalam teks Ibrani.
- source_word: הַבָּאִים
  choice: yang datang
  rationale: Partisipel בוא menggambarkan para perwira yang datang. 'Yang datang' tetap dekat dengan bentuk Ibrani tanpa menambahkan gagasan 'kembali' yang tidak dinyatakan secara eksplisit.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: dari tugas perang
  rationale: צָבָא dapat menunjuk dinas, tugas, atau pasukan militer; bersama הַמִּלְחָמָה, frasa ini menyatakan tugas militer dalam perang. 'Tugas perang' ringkas, alami, dan mempertahankan unsur pelayanan militer.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah kepangkatan dibuat mudah dipahami tanpa memaksakan padanan pangkat militer modern yang terlalu khusus.
