  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: id
  text: Ternak sapi itu berjumlah tiga puluh enam ribu ekor, dan pungutan bagi Yahweh berjumlah tujuh puluh dua ekor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: lembu-lembu
  rationale: בָּקָר adalah sebutan kolektif bagi ternak sapi. Dalam daftar rampasan ini, “lembu-lembu” alami dan lebih spesifik daripada “ternak”; kata bantu bilangan “ekor” ditambahkan sesuai idiom Indonesia.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: tiga puluh enam ribu
  rationale: Urutan bilangan disesuaikan dengan tata bilangan baku bahasa Indonesia tanpa mengubah makna.
- source_word: מִכְסָם
  choice: bagian yang dipungut dari semuanya
  rationale: מֶכֶס menunjuk pada bagian wajib yang diambil dari rampasan. Bentuk bersufiks -ם berarti bagian yang dipungut dari seluruh kelompok lembu tersebut; frasa ini mempertahankan rujukan sufiksnya dengan jelas.
- source_word: לַיהוָה
  choice: untuk Yahweh
  rationale: Preposisi ל menandai bagian yang diperuntukkan bagi YHWH, dan nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: tujuh puluh dua
  rationale: Urutan bilangan Ibrani disesuaikan dengan idiom baku bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menyebut Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi, sedangkan “TUHAN” merupakan penggantian tradisional berupa gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur inventaris dipertahankan, sementara “berjumlah” dan kata penggolong “ekor” dipakai agar daftar angka terdengar alami dan jelas.
