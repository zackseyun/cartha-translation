  text: וַ/יָּבִ֡אוּ אֶל מֹשֶׁה֩ וְ/אֶל אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/אֶל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הַ/שְּׁבִ֧י וְ/אֶת הַ/מַּלְק֛וֹחַ וְ/אֶת הַ/שָּׁלָ֖ל אֶל הַֽ/מַּחֲנֶ֑ה אֶל עַֽרְבֹ֣ת מוֹאָ֔ב אֲשֶׁ֖ר עַל יַרְדֵּ֥ן יְרֵחֽוֹ־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: id
  text: Mereka membawa para tawanan, hasil rampasan, dan jarahan itu kepada Musa, kepada Imam Eleazar, dan kepada umat Israel, yaitu ke perkemahan di Dataran Moab, di tepi Sungai Yordan dekat Yerikho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tepi Sungai Yordan, berhadapan dengan Yerikho.”
    reason: Ungkapan geografis Ibrani dapat dipahami lebih khusus sebagai lokasi di seberang atau berhadapan dengan Yerikho.
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Mereka membawa
  rationale: Bentuk Hifil dari בוא menyatakan tindakan membawa; rangkaian objek langsung sesudahnya menegaskan makna kausatif ini.
- source_word: הַשְּׁבִי
  choice: para tawanan
  rationale: Dalam konteks perang, kata ini menunjuk kepada orang-orang yang ditawan, bukan keadaan abstrak berupa penawanan.
- source_word: הַמַּלְקוֹחַ
  choice: hasil rampasan
  rationale: Istilah ini menunjuk kepada apa yang direbut, khususnya harta bergerak atau ternak; frasa ini dibedakan dari שׁלל.
- source_word: הַשָּׁלָל
  choice: jarahan
  rationale: Kata ini merupakan istilah umum bagi jarahan perang. Pilihan yang berbeda dari 'hasil rampasan' mempertahankan dua istilah Ibrani yang berkaitan tetapi tidak identik.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: umat bani Israel
  rationale: '''Umat'' menyampaikan makna komunitas yang berhimpun, sedangkan ''bani Israel'' mempertahankan ungkapan kekeluargaan Ibrani secara wajar dalam bahasa Indonesia Alkitabiah.'
- source_word: אֶל הַמַּחֲנֶה
  choice: ke perkemahan
  rationale: Preposisi אֶל menyatakan arah menuju perkemahan tanpa memastikan bahwa mereka telah memasukinya.
- source_word: עַרְבֹת מוֹאָב
  choice: Dataran Moab
  rationale: Ini adalah sebutan geografis yang lazim dan mudah dipahami; bentuk jamak Ibrani dapat dinyatakan secara alami dengan nomina kolektif 'Dataran'.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: di tepi Sungai Yordan dekat Yerikho
  rationale: Ungkapan ini menempatkan Dataran Moab di sisi Yordan dalam kaitannya dengan Yerikho. Terjemahan utama mempertahankan lokasi umum tanpa memaksakan hubungan geografis yang lebih spesifik.
