  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: id
  text: Jadi sekarang, bunuhlah setiap anak laki-laki di antara anak-anak kecil itu, dan bunuhlah setiap perempuan yang pernah berhubungan seksual dengan laki-laki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “yang mengenal seorang laki-laki melalui pembaringan seorang laki-laki,” sebuah idiom Ibrani untuk hubungan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Menandai peralihan menuju perintah langsung berikutnya; “jadi sekarang” mempertahankan daya wacana וְ ditambah עַתָּה secara alami dalam bahasa Indonesia.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: bunuhlah
  rationale: Bentuk imperatif dari הרג bersifat langsung dan keras. “Bunuhlah” menyampaikan perintah itu tanpa memperhalusnya.
- source_word: כָל זָכָר בַּטָּף
  choice: setiap anak laki-laki di antara anak-anak kecil itu
  rationale: זָכָר berarti “laki-laki/jantan,” sedangkan טַף menunjuk anak-anak kecil atau para tanggungan. Dalam konteks ini, “anak laki-laki” menyatakan jenis kelamin sekaligus kelompok usia secara wajar.
- source_word: כָל אִשָּׁה
  choice: setiap perempuan
  rationale: אִשָּׁה di sini bersifat umum dan tidak secara khusus berarti “istri.”
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: yang pernah mengenal laki-laki dengan tidur bersamanya
  rationale: Mempertahankan ungkapan Ibrani “mengenal” dan “tidur” sambil membuat makna seksualnya cukup dapat dipahami dalam bahasa Indonesia; catatan kaki memberikan bentuk harfiahnya.
theological_decisions:
- issue: Menerjemahkan perintah perang yang secara moral sangat berat tanpa memperhalus atau menambahkan tafsiran
  choice: Menyampaikan perintah membunuh secara langsung dan mempertahankan cakupan kelompok yang disebut dalam teks
  alternative: Menggunakan ungkapan yang lebih halus seperti “hukumlah mati” atau menambahkan penjelasan historis ke dalam teks utama
  rationale: Bahasa Ibrani memberikan perintah langsung. Terjemahan tidak boleh mengurangi kekerasannya maupun memasukkan pembelaan, kecaman, atau penjelasan moral yang tidak dinyatakan dalam ayat.
- issue: Ungkapan seksual יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: Mempertahankan idiom “mengenal laki-laki” dan menjelaskan bentuk Ibraninya dalam catatan kaki
  alternative: Menggantikannya sepenuhnya dengan “pernah bersetubuh dengan laki-laki”
  rationale: Pilihan ini mempertahankan citra dan ketegangan ungkapan sumber tanpa mengaburkan makna seksualnya bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Partikel imperatif “-lah” mempertahankan bentuk perintah; kosakata yang arkais dan bahasa yang memperhalus kekerasan teks dihindari.
