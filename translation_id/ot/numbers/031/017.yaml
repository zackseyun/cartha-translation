  source_fidelity: Struktur perintah ganda, cakupan “setiap laki-laki di antara anak-anak kecil,” dan keterangan mengenai perempuan yang telah melakukan hubungan seksual dengan laki-laki pada dasarnya tepat. Namun, “mengenal laki-laki dengan tidur bersamanya” masih dapat terdengar sebagai gabungan dua tindakan nonseksual dalam bahasa Indonesia modern dan kurang menyatakan fungsi seksual yang tegas dari idiom Ibrani dalam konteks ini.
  naturalness: “Jadi sekarang” dan bentuk imperatif “bunuhlah” wajar serta lugas. Penggantian idiom seksual dalam teks utama dengan ungkapan modern yang eksplisit menghasilkan kalimat yang lebih jelas tanpa memperhalus isi perintah.
  terminology: “Anak laki-laki,” “perempuan,” dan “bunuhlah” sesuai dengan makna sumber dan register Indonesia baku. Catatan kaki perlu memperbaiki parafrasa harfiah “karena pembaringan,” yang tidak tepat menangkap fungsi לְ dan kurang idiomatis.
