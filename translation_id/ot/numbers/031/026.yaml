  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: id
  text: “Engkau, bersama Imam Eleazar dan para kepala keluarga umat itu, hitunglah jumlah hasil rampasan, yaitu para tawanan, baik manusia maupun hewan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Hitunglah seluruh
  rationale: Ungkapan harfiah ‘angkatlah kepala’ merupakan idiom untuk menghitung atau menentukan jumlah keseluruhan; ‘hitunglah seluruh’ menyampaikan perintah itu secara alami dalam bahasa Indonesia.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: hasil jarahan yang ditawan
  rationale: מַלְקוֹחַ menunjuk pada hasil rampasan perang, sedangkan הַשְּׁבִי mencakup apa yang ditangkap atau ditawan. Susunan ini mempertahankan cakupannya atas manusia dan hewan tanpa membatasinya hanya kepada tawanan manusia.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: baik manusia maupun hewan
  rationale: אָדָם di sini berarti manusia sebagai lawan dari בְּהֵמָה, yaitu hewan, khususnya hewan ternak dalam konteks ini. Pasangan ‘manusia maupun hewan’ jelas dan wajar.
- source_word: אַתָּה וְאֶלְעָזָר הַכֹּהֵן
  choice: Engkau, Imam Eleazar
  rationale: Pronomina eksplisit mempertahankan penekanan pada keterlibatan Musa. Dalam bahasa Indonesia, gelar jabatan lazim ditempatkan sebelum nama.
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: para kepala kaum leluhur umat itu
  rationale: רָאשֵׁי אֲבוֹת menunjuk kepada para pemimpin kelompok kekerabatan berdasarkan garis leluhur. ‘Kaum leluhur’ lebih alami daripada terjemahan harfiah ‘rumah-rumah bapa’, sementara הָעֵדָה diterjemahkan ‘umat itu’ sesuai komunitas Israel dalam konteks.
