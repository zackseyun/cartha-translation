  terminology: “Perwira” merupakan padanan yang baik untuk הַפְּקֻדִים dalam konteks ini. “Para pemimpin seribu dan para pemimpin seratus” menyampaikan שָׂרֵי הָאֲלָפִים dan שָׂרֵי הַמֵּאוֹת secara idiomatis, tanpa mengklaim nomenklatur pangkat militer modern.
