  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: id
  text: Kemudian para perwira yang bertugas atas satuan-satuan pasukan itu, yaitu para pemimpin seribu dan para pemimpin seratus, mendekat kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: datang menghadap
  rationale: Kata kerja קרב menyatakan gerak mendekati seseorang. Dalam konteks menghadap Musa untuk berbicara, 'datang menghadap' alami dalam bahasa Indonesia tanpa menghilangkan gagasan mendekat.
- source_word: הַפְּקֻדִים
  choice: para perwira
  rationale: Bentuk ini merujuk kepada orang-orang yang ditunjuk untuk memimpin atau mengawasi satuan militer, bukan prajurit biasa. 'Para perwira' menyampaikan fungsi tersebut secara ringkas dan modern.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: yang membawahi pasukan-pasukan seribu orang
  rationale: Frasa ini menunjukkan lingkup tanggung jawab para perwira atas satuan-satuan militer berukuran seribu; 'membawahi' memperjelas hubungan kepemimpinan yang ditegaskan oleh aposisi berikutnya.
- source_word: אַלְפֵי
  choice: pasukan-pasukan seribu orang
  rationale: Dalam konteks militer dan sejajar dengan satuan seratus, kata ini paling wajar dipahami sebagai satuan pasukan yang disebut menurut jumlah seribu, sambil tidak menuntut bahwa jumlah aktualnya selalu tepat seribu.
- source_word: הַצָּבָא
  choice: pasukan
  rationale: Di sini צבא menunjuk kepada kekuatan tempur yang terorganisasi. 'Pasukan' sesuai dengan konteks satuan militer dan terdengar alami dalam bahasa Indonesia.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: para kepala pasukan seribu
  rationale: שׂר berarti pemimpin atau pejabat. 'Kepala pasukan seribu' mempertahankan struktur pangkat berdasarkan satuan dan menghindari istilah pangkat modern yang terlalu spesifik.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: dan para kepala pasukan seratus
  rationale: Terjemahan ini sejajar dengan frasa sebelumnya dan mempertahankan hierarki satuan militer dalam teks Ibrani.
