translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Aposisi 'yaitu' memperjelas bahwa kepala pasukan seribu dan seratus adalah para perwira yang baru disebutkan. Istilah 'kepala' dipilih daripada pangkat militer Indonesia tertentu agar tidak memasukkan struktur kemiliteran modern ke dalam teks kuno.
