id: NUM.31.47
reference: Numbers 31:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Dari separuh bagian milik orang Israel[a], Musa mengambil satu bagian dari setiap lima puluh, baik dari manusia maupun dari ternak, lalu menyerahkan semuanya kepada orang Lewi yang bertugas menjaga Kemah Suci Yahweh, seperti yang telah diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; maksudnya, orang Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Dari separuh bagian milik orang Israel
  rationale: מַחֲצִית menunjuk pada separuh jatah rampasan yang dialokasikan kepada umat Israel. 'Orang Israel' merupakan padanan Indonesia yang alami bagi ungkapan harfiah 'anak-anak Israel'.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: satu bagian dari setiap lima puluh
  rationale: אָחֻז menunjuk pada bagian atau pungutan yang diambil, sedangkan אֶחָד מִן הַחֲמִשִּׁים menetapkan perbandingan satu dari lima puluh.
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: baik dari manusia maupun dari ternak
  rationale: אָדָם dipakai secara kolektif untuk manusia, sedangkan בְּהֵמָה dalam konteks rampasan perang menunjuk pada hewan ternak. Konstruksi 'baik ... maupun ...' menyampaikan kedua kategori dengan jelas.
- source_word: וַיִּתֵּן אֹתָם
  choice: lalu menyerahkan semuanya
  rationale: Akhiran jamak merujuk pada apa yang dipungut dari kedua kategori. 'Semuanya' menghindari ambiguitas pronomina Indonesia tanpa menghilangkan cakupan jamaknya.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Padanan Indonesia baku dan alami bagi kelompok suku Lewi.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: yang bertanggung jawab atas Kemah Suci Yahweh
  rationale: Gabungan partisip dan nomina serumpun menandakan tugas menjaga atau mengurus Kemah Suci. 'Bertanggung jawab atas' mempertahankan gagasan amanat penjagaan dalam bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: seperti yang telah diperintahkan Yahweh kepada Musa
  rationale: כַּאֲשֶׁר menyatakan kesesuaian dengan perintah sebelumnya; 'telah diperintahkan' mencerminkan urutan narasi secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan tersebut secara harfiah berarti 'anak-anak Israel', tetapi dalam konteks ini berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' menyampaikan rujukannya secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- issue: Cakupan manusia dalam rampasan perang
  choice: manusia
  alternative: orang-orang
  rationale: אָדָם bersifat kolektif dan tidak membatasi rujukan pada laki-laki. 'Manusia' mempertahankan keluasan itu dan membentuk kontras yang jelas dengan ternak.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat dijaga dekat dengan alur Ibrani, tetapi menggunakan bentuk idiomatis seperti 'orang Israel', 'baik ... maupun ...', dan 'bertanggung jawab atas' agar mudah dipahami pembaca umum.
