id: NUM.31.41
reference: Numbers 31:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu Musa memberikan upeti[a] itu, yakni persembahan bagi Yahweh[b], kepada Imam Eleazar, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pungutan” atau “bagian wajib”, yaitu bagian yang ditetapkan untuk diambil dari jarahan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “persembahan Yahweh”; secara tradisional, “persembahan unjukan bagi Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan lampau dalam alur narasi; “memberikan” merupakan padanan alami dan langsung.
- source_word: מֶכֶס
  choice: upeti
  rationale: Dalam konteks pembagian jarahan perang, kata ini menunjuk pada bagian wajib yang ditetapkan untuk diserahkan. “Upeti” menyampaikan kewajiban tersebut tanpa terutama mengesankan pajak sipil modern.
- source_word: תְּרוּמַת יְהוָה
  choice: persembahan bagi Yahweh
  rationale: תְּרוּמָה adalah bagian yang dipisahkan dan diserahkan untuk tujuan sakral. Kata “bagi” mempertahankan arah pemberian tanpa memaksakan pengertian teknis ritual tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: kepada Imam Eleazar
  rationale: Susunan ini alami dalam bahasa Indonesia dan secara tepat menyatakan penerima beserta jabatannya.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: “Tepat seperti” menonjolkan kesesuaian tindakan Musa dengan perintah ilahi sebelumnya, sebagaimana fungsi formula Ibrani tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Hubungan מֶכֶס dengan תְּרוּמַת יְהוָה
  choice: upeti itu, yakni persembahan bagi Yahweh
  alternative: upeti, persembahan Yahweh
  rationale: Frasa kedua dipahami sebagai penjelasan tentang upeti tersebut. “Bagi Yahweh” menyatakan bahwa bagian itu diperuntukkan bagi-Nya, sambil menghindari kesan bahwa Yahweh adalah sumber persembahan itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Imam Eleazar” dipilih daripada “Eleazar, sang imam” karena lebih alami. Penanda kaki [a] dan [b] ditempatkan langsung sesudah istilah yang diterangkan.
