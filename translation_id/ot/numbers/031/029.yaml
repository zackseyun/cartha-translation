source:
  edition: WLC
  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: id
  text: Dari separuh bagian mereka, ambillah itu dan berikanlah kepada Imam Eleazar sebagai bagian persembahan bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “persembahan khusus milik Yahweh” atau “bagian yang dikhususkan bagi Yahweh.” Kata Ibrani תְּרוּמָה menunjuk pada bagian yang dipisahkan untuk penggunaan suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: Dari setengah bagian mereka
  rationale: Gabungan מִן dan מַחֲצִית dengan sufiks orang ketiga jamak berarti bagian yang diambil dari separuh milik kelompok tersebut; frasa ini tetap jelas dalam konteks pembagian jarahan.
- source_word: תִּקָּחוּ
  choice: ambillah itu
  rationale: Bentuk orang kedua jamak menyampaikan perintah kepada para pelaksana pembagian. Partikel -lah memberi daya perintah secara wajar, sedangkan “itu” menunjuk pada bagian yang telah ditentukan dalam konteks.
- source_word: וְנָתַתָּה
  choice: dan berikanlah
  rationale: Bentuk orang kedua tunggal meneruskan rangkaian perintah. Terjemahan ini mempertahankan daya perintah tanpa membuat pergantian jumlah gramatikal Ibrani terasa janggal dalam bahasa Indonesia.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: kepada Imam Eleazar
  rationale: Susunan gelar sebelum nama merupakan bentuk Indonesia yang alami dan tetap mengidentifikasi jabatan Eleazar.
- source_word: תְּרוּמַת יְהוָה
  choice: persembahan khusus bagi Yahweh
  rationale: תְּרוּמָה ialah bagian yang dipisahkan atau disisihkan untuk penggunaan suci. “Persembahan khusus” mudah dipahami dan “bagi Yahweh” mempertahankan kemungkinan relasi tujuan pada konstruksi genitif ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh agar nama pribadi dalam teks Ibrani dipertahankan, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna konstruksi תְּרוּמַת יְהוָה
  choice: persembahan khusus bagi Yahweh
  alternative: persembahan khusus milik Yahweh; persembahan kepada Yahweh
  rationale: Genitif Ibrani dapat dipahami sebagai kepunyaan atau tujuan. Teks utama memakai ungkapan Indonesia yang wajar dalam konteks bagian jarahan yang dikhususkan bagi Yahweh, sementara catatan mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang khidmat. Bentuk “ambillah” dan “berikanlah” menyampaikan perintah secara alami; istilah teknis kuno seperti “persembahan unjukan” dihindari demi kejelasan.
