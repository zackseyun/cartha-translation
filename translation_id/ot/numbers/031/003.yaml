  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: id
  text: Lalu Musa berkata kepada bangsa itu, “Kerahkanlah orang-orang dari antaramu untuk berperang, dan hendaklah mereka melawan Midian untuk melaksanakan pembalasan Yahweh[a] terhadap Midian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembalasan bagi Yahweh.” Frasa Ibraninya dapat berarti pembalasan yang menjadi milik Yahweh atau yang dilaksanakan demi Dia.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berkata
  rationale: Bentuk naratif ini memperkenalkan perkataan langsung; 'berkata' merupakan ungkapan naratif yang alami dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Dalam konteks ini, עָם menunjuk kepada umat Israel yang disapa Musa; 'bangsa itu' menjaga sifat kolektif dan rujukan yang sudah tertentu.
- source_word: הֵחָלְצוּ
  choice: Persenjatailah
  rationale: Dalam konteks militer, verba ini berarti memperlengkapi atau menyiapkan diri untuk perang; bentuk ini mempertahankan unsur persenjataan dan daya imperatifnya.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: orang-orang dari antara kamu
  rationale: Frasa ini menyatakan pemilihan sejumlah laki-laki dari tengah komunitas. Bahasa Indonesia lazim memakai 'orang-orang' dalam konteks pengerahan militer ini tanpa menambahkan istilah 'prajurit' yang tidak eksplisit.
- source_word: לַצָּבָא
  choice: untuk berperang
  rationale: צָבָא di sini berkaitan dengan pengerahan bagi suatu operasi militer; 'untuk berperang' lebih alami daripada 'untuk tentara' dalam konstruksi Indonesia.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: Biarlah mereka maju melawan Midian
  rationale: Idiom היה על dalam konteks permusuhan menyatakan pengerahan melawan sasaran. 'Maju melawan' menyampaikan daya militer idiom itu secara wajar tanpa memperinci bentuk serangannya.
- source_word: לָתֵת נִקְמַת
  choice: untuk melaksanakan pembalasan
  rationale: Secara harfiah לָתֵת berarti 'memberikan', tetapi bersama נִקְמַת ungkapan ini berarti menjalankan atau melaksanakan pembalasan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּמִדְיָן
  choice: terhadap Midian
  rationale: Preposisi ב menandai Midian sebagai sasaran pembalasan; 'terhadap' merupakan padanan Indonesia yang jelas dan alami.
theological_decisions:
- issue: Hubungan genitif dalam נִקְמַת יְהוָה pada konteks perang
  choice: pembalasan Yahweh
  alternative: pembalasan bagi Yahweh
  rationale: Konstruksi Ibrani dapat menunjuk pada pembalasan yang menjadi milik atau tindakan Yahweh, ataupun pembalasan yang dilaksanakan demi Dia. Teks utama mempertahankan bentuk genitif yang ringkas, sedangkan catatan kaki mencatat kemungkinan lainnya tanpa meredakan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat langsung dibuat alami bagi pembaca umum, sementara istilah keras 'pembalasan' serta nama ilahi 'Yahweh' dipertahankan. Penanda catatan kaki ditempatkan pada klausa yang mengandung ambiguitas.
