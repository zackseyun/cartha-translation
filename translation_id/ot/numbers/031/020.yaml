base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: id
  text: Dan setiap pakaian, setiap barang dari kulit, setiap barang yang dibuat dari bulu kambing, dan setiap barang dari kayu harus kamu tahirkan semuanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk hitpael kata kerja Ibrani ini juga dapat dipahami, “kamu harus menyucikan diri.” Namun, dalam konteks ini pemurnian berkaitan dengan benda-benda yang baru disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: pakaian
  rationale: Kata ini lazim berarti pakaian atau kain sandang; “pakaian” alami dan tetap sesuai dengan gaya daftar inventaris.
- source_word: כְּלִי עוֹר
  choice: barang dari kulit
  rationale: כְּלִי dapat menunjuk berbagai jenis benda atau perkakas, bukan hanya wadah. “Barang dari kulit” mempertahankan keluasan makna dan klasifikasi berdasarkan bahan.
- source_word: מַעֲשֵׂה עִזִּים
  choice: barang yang dibuat dari bulu kambing
  rationale: Ungkapan ini secara harfiah menunjuk hasil pekerjaan atau benda buatan dari kambing; dalam daftar bahan, bulu kambing paling mungkin dimaksud. Rumusan ini jelas tanpa mengubahnya menjadi kulit kambing.
- source_word: כְּלִי עֵץ
  choice: barang dari kayu
  rationale: כְּלִי lebih luas daripada “bejana”; pilihan ini sejajar dengan “barang dari kulit” dan menyampaikan pengelompokan menurut bahan.
- source_word: תִּתְחַטָּאוּ
  choice: harus kamu tahirkan
  rationale: Bentuk hitpael orang kedua jamak secara morfologis dapat terdengar refleksif, tetapi objek-objek yang disebut di awal ayat menjadi sasaran tindakan dalam konteks ini. “Tahirkan” menyampaikan pemurnian ritual, bukan pengampunan moral dari dosa.
theological_decisions:
- issue: Arah tindakan pemurnian pada תִּתְחַטָּאוּ
  choice: Mengungkapkannya secara idiomatis sebagai kewajiban menahirkan benda-benda yang didaftarkan.
  alternative: “Kamu harus menahirkan diri sehubungan dengan semuanya itu” atau “kamu harus menyucikan dirimu.”
  rationale: Walaupun verba Ibrani berbentuk hitpael orang kedua jamak, susunan ayat menempatkan daftar benda sebagai unsur yang harus diperlakukan. Konteks dekat juga membicarakan pemurnian barang rampasan. Terjemahan utama mengikuti fungsi kontekstual itu, sementara catatan kaki mempertahankan bentuk refleksif sebagai kemungkinan formal.
- issue: Sifat pemurnian
  choice: Memakai istilah “tahirkan” untuk pemurnian ritual.
  alternative: “Bersihkan” atau “sucikan dari dosa.”
  rationale: Konteksnya ialah kenajisan ritual sesudah peperangan dan kontak dengan orang mati, bukan pertobatan moral atau doktrin pendamaian. “Tahirkan” menjaga ranah ritual tanpa menambahkan “dari dosa” yang tidak dinyatakan sebagai pelengkap dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “setiap” mempertahankan irama daftar Ibrani. Pronomina “kamu” dipahami sebagai jamak berdasarkan bentuk verba Ibrani.
