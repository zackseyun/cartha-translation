- from: Lalu Musa mengutus mereka untuk berperang, seribu orang dari setiap suku. Ia mengutus mereka bersama Pinehas, anak Imam Eleazar, dengan membawa perlengkapan kudus[a] dan nafiri-nafiri untuk memberi tanda seruan perang[b] di tangannya.
  to: Lalu Musa mengutus mereka—seribu orang dari setiap suku—untuk berperang, bersama Pinehas, anak Eleazar, imam itu, yang membawa perlengkapan kudus[a] dan nafiri-nafiri untuk tanda perang[b] di tangannya.
