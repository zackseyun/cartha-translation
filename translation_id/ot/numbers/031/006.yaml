  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: id
  text: Lalu Musa mengutus mereka—seribu orang dari setiap suku—untuk berperang, bersama Pinehas, anak Eleazar, imam itu, yang membawa perlengkapan kudus[a] dan nafiri-nafiri untuk tanda perang[b] di tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkakas-perkakas tempat kudus” atau “benda-benda suci.”
    reason: lexical_alternative
  - marker: b
    text: Atau “nafiri-nafiri pemberi tanda” atau “nafiri-nafiri tanda bahaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam narasi ini, verba שלח menyatakan tindakan Musa menugaskan dan mengirim pasukan; “mengutus” alami sekaligus mempertahankan nuansa penugasan.
- source_word: אֶלֶף לַמַּטֶּה
  choice: seribu orang dari setiap suku
  rationale: Bentuk distributifnya menunjukkan jumlah yang disediakan masing-masing suku; kata “orang” dibuat eksplisit secara wajar dalam bahasa Indonesia.
- source_word: לַצָּבָא
  choice: untuk berperang
  rationale: Dalam konteks ini צבא menunjuk pada kegiatan perang atau dinas militer, bukan terutama lembaga tentara. Pilihan ini alami dan mempertahankan tujuan pengutusan.
- source_word: אֹתָם ... אֹתָם
  choice: mereka ... mereka
  rationale: Pengulangan pronomina Ibrani dicerminkan melalui dua kalimat agar hubungan sintaksis tetap jelas dan hasilnya tidak janggal dalam bahasa Indonesia.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinehas, anak Imam Eleazar
  rationale: Frasa הַכֹּהֵן secara sintaksis paling dekat dengan Eleazar. Susunan ini menghindari kesan bahwa gelar imam secara eksplisit menerangkan Pinehas dalam ayat ini.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: perlengkapan kudus
  rationale: כְּלִי dapat berarti perkakas, wadah, atau berbagai benda/perlengkapan. Terjemahan ini mempertahankan ketidakspesifikan objek dan sifat sakralnya.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: nafiri-nafiri untuk memberi tanda seruan perang
  rationale: חֲצֹצְרוֹת adalah nafiri atau terompet logam, sedangkan תְּרוּעָה adalah bunyi nyaring sebagai tanda, pekik, atau tanda bahaya. Konteks militer mendukung “seruan perang,” sementara fungsi pemberian tanda tetap dinyatakan.
- source_word: בְּיָדוֹ
  choice: di tangannya
  rationale: Ungkapan tunggal ini dipertahankan secara formal; anteseden terdekatnya adalah Pinehas, tanpa mengubah idiom menjadi penjelasan interpretatif.
theological_decisions:
- issue: Peran Pinehas dan benda-benda kudus dalam ekspedisi militer
  choice: Ayat menampilkan Pinehas menyertai pasukan dengan perlengkapan kudus dan nafiri pemberi tanda, tanpa memperluasnya menjadi rumusan teologis tentang perang suci.
  alternative: Menjelaskan Pinehas hanya sebagai pengamat, atau menentukan secara pasti fungsi dan identitas setiap benda kudus.
  rationale: Teks menghubungkan Pinehas, perlengkapan kudus, dan nafiri dengan ekspedisi, tetapi tidak menjabarkan jabatan Pinehas dalam operasi itu maupun identitas perlengkapannya.
- issue: Rujukan bentuk tunggal בְּיָדוֹ
  choice: Mempertahankan “di tangannya,” yang paling wajar merujuk kepada Pinehas.
  alternative: Mengalihkannya menjadi “di bawah tanggung jawabnya” atau menganggapnya merujuk secara kolektif kepada pasukan.
  rationale: Pinehas merupakan anteseden tunggal terdekat. Namun, terjemahan tidak menambahkan penjelasan yang melampaui bentuk Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Nafiri” dipilih karena cocok bagi alat tiup logam dalam konteks Alkitab, sedangkan frasa penjelas menerangkan fungsinya. Struktur dua kalimat mengurangi kekakuan pengulangan Ibrani tanpa menghapusnya.
