  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: id
  text: Tetapi, dari antara kaum perempuan, biarkanlah tetap hidup bagi kalian semua anak perempuan yang belum pernah tidur dengan laki-laki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih jelas: “yang belum pernah melakukan hubungan seksual dengan laki-laki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Tetapi semua
  rationale: וְ meneruskan perintah dengan pertentangan terhadap instruksi sebelumnya; dalam bahasa Indonesia, “Tetapi” menyatakan daya adversatif itu secara wajar. כֹל dengan nomina kolektif הַטַּף diterjemahkan “semua”.
- source_word: הַטַּף בַּ/נָּשִׁים
  choice: anak perempuan di antara kaum perempuan
  rationale: טַף berarti anak-anak atau orang-orang yang masih kecil. Konteks בַּנָּשִׁים dan klausa tentang belum mengenal persetubuhan dengan laki-laki membatasi acuannya kepada anak perempuan; frasa partitif dipertahankan dengan “di antara kaum perempuan”.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: yang belum pernah mengenal persetubuhan dengan laki-laki
  rationale: יָדַע dipertahankan sebagai eufemisme “mengenal”, sedangkan מִשְׁכַּב זָכָר dijelaskan secara cukup transparan sebagai “persetubuhan dengan laki-laki”. Kata “pernah” menyampaikan pengalaman yang belum terjadi tanpa mengubah makna.
- source_word: הַחֲיוּ לָ/כֶם
  choice: biarkanlah hidup bagi kalian
  rationale: Bentuk Hifil imperatif dari חיה berarti membiarkan atau mempertahankan hidup. “Bagi kalian” mempertahankan לָכֶם tanpa menentukan lebih jauh tujuan atau status mereka.
theological_decisions:
- issue: Seberapa eksplisit idiom seksual Ibrani harus diterjemahkan
  choice: “belum pernah mengenal persetubuhan dengan laki-laki”
  alternative: “belum pernah tidur dengan laki-laki” atau “masih perawan”
  rationale: Pilihan ini mempertahankan unsur eufemistik יָדַע (“mengenal”) sambil membuat מִשְׁכַּב זָכָר dapat dipahami pembaca modern. Istilah “perawan” dihindari karena mengganti ungkapan tindakan/pengalaman dalam teks dengan sebuah label.
- issue: Penandaan jenis kelamin acuan טַף
  choice: “anak perempuan”
  alternative: “anak-anak” atau “anak kecil”
  rationale: Walaupun טַף sendiri bersifat kolektif dan tidak secara inheren feminin, pembatas langsung בַּנָּשִׁים serta klausa berikutnya menunjukkan bahwa yang dimaksud ialah anak-anak perempuan.
- issue: Makna לָכֶם
  choice: Mempertahankan secara terbuka sebagai “bagi kalian”
  alternative: Menjelaskannya sebagai “untuk kalian miliki” atau “untuk kalian gunakan”
  rationale: Teks menyatakan kepentingan atau peruntukan bagi para penerima perintah, tetapi tidak merinci di ayat ini bentuk relasi atau tujuan selanjutnya; terjemahan tidak menambahkan penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kalian” dipakai untuk לָכֶם yang jamak; “biarkanlah hidup” mempertahankan bentuk perintah tanpa memperhalus kekerasan konteks. Penanda catatan kaki [a] ditempatkan dalam teks utama.
