revisions:
- from: Tetapi semua anak perempuan di antara kaum perempuan yang belum pernah mengenal persetubuhan dengan laki-laki, biarkanlah hidup bagi kalian.[a]
  to: Tetapi, dari antara kaum perempuan, biarkanlah tetap hidup bagi kalian semua anak perempuan yang belum pernah tidur dengan laki-laki.[a]
  rationale: Revisi ini memperbaiki idiom dan kelancaran bahasa Indonesia. “Dari antara kaum perempuan” mempertahankan fungsi partitif, “semua anak perempuan” mempertahankan cakupan kolektif כָּל הַטַּף dalam konteks perempuan, dan “tidur dengan laki-laki” mencerminkan eufemisme מִשְׁכַּב זָכָר. “Bagi kalian” tetap terbuka dan tidak menyatakan secara tambahan tujuan atau status mereka.
