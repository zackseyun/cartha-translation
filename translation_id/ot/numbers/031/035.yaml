  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: id
  text: dan orang-orang dari antara para perempuan yang belum pernah bersetubuh dengan laki-laki[a], seluruhnya berjumlah tiga puluh dua ribu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang tidak mengenal pembaringan laki-laki,” sebuah ungkapan Ibrani yang berarti mereka belum pernah melakukan hubungan seksual dengan laki-laki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: orang-orang
  rationale: Dalam konteks penghitungan yang membedakan manusia dari ternak, frasa ini menunjuk kepada pribadi-pribadi manusia. 'Orang-orang' menyampaikan maknanya secara alami dalam bahasa Indonesia tanpa ungkapan berlebihan seperti 'pribadi manusia'.
- source_word: מִן הַנָּשִׁים
  choice: dari antara para perempuan
  rationale: Preposisi מִן menandai kelompok yang diambil dari keseluruhan perempuan; 'dari antara' alami dan tepat dalam konteks ini.
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: yang belum pernah bersetubuh dengan laki-laki
  rationale: Secara harfiah ungkapan ini berbunyi 'yang tidak mengenal pembaringan laki-laki', sebuah idiom Ibrani untuk hubungan seksual. Terjemahan dalam teks menyampaikan maknanya dengan jelas dan bermartabat, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: כָּל נֶפֶשׁ
  choice: seluruhnya berjumlah ... orang
  rationale: Frasa ini merangkum jumlah keseluruhan kelompok. Susunan Indonesia ini menghindari pengulangan 'orang-orang ... semua orang' sambil mempertahankan fungsi penghitungan.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: tiga puluh dua ribu
  rationale: Padanan baku bahasa Indonesia untuk bilangan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Konjungsi awal 'dan' dipertahankan karena ayat ini meneruskan daftar dari ayat sebelumnya. Istilah 'perempuan' dipilih karena נָשִׁים mencakup kelompok perempuan secara umum, sedangkan 'laki-laki' secara alami menyampaikan זָכָר dalam idiom seksual ini.
