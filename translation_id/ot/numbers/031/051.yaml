  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: id
  text: Lalu Musa dan Imam Eleazar mengambil emas itu dari mereka, yaitu semua barang buatan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: menerima
  rationale: Dalam konteks penyerahan persembahan oleh para perwira, לקח dapat berarti mengambil atau menerima; “menerima” menyampaikan tindakan ini secara alami tanpa mengubah sumber pemberian.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: dan Imam Eleazar
  rationale: Gelar הַכֹּהֵן diterjemahkan secara alami sebagai “Imam” dan ditempatkan sebelum nama sesuai kelaziman bahasa Indonesia.
- source_word: אֶת הַזָּהָב
  choice: emas itu
  rationale: Artikel tertentu menunjuk kepada emas yang baru saja diserahkan dalam konteks sebelumnya.
- source_word: מֵאִתָּם
  choice: dari mereka
  rationale: Frasa ini menyatakan sumber atau pihak yang menyerahkan emas tersebut.
- source_word: כֹּל כְּלִי מַעֲשֶׂה
  choice: segala barang yang telah dibuat dari emas
  rationale: כְּלִי adalah istilah luas untuk barang atau benda, sedangkan מַעֲשֶׂה menunjukkan hasil pengerjaan. Tambahan “dari emas” memperjelas hubungan aposisional dengan “emas itu” dan membedakan barang jadi dari emas mentah.
