  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: id
  text: Mereka membakar dengan api semua kota yang mereka diami dan semua perkemahan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kamp-kamp” atau “perkampungan-perkampungan.” Istilah Ibrani yang diterjemahkan “perkemahan” juga dapat menunjuk kawasan berpagar.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: kota
  rationale: עִיר dapat menunjuk kota atau permukiman; “kota” merupakan padanan baku yang sesuai dengan konteks geografis dan militer.
- source_word: בְּמוֹשְׁבֹתָם
  choice: tempat tinggal orang Midian
  rationale: מוֹשָׁב berarti tempat tinggal, kediaman, atau permukiman. Susunan ini mempertahankan fungsi lokatif frasa Ibrani sambil menghindari rangkaian pronomina yang rancu dalam bahasa Indonesia.
- source_word: טִירֹתָם
  choice: perkemahan mereka
  rationale: טִירָה dapat berarti perkemahan, kawasan berpagar, atau permukiman. “Perkemahan” membedakannya dari kota tanpa memastikan secara berlebihan bentuk permukimannya.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: membakar dengan api
  rationale: Padanan ini mempertahankan ungkapan instrumental dan penekanan eksplisit pada api dalam teks Ibrani.
- source_word: וְאֵת ... וְאֵת
  choice: semua ... dan semua
  rationale: Pengulangan כָּל pada kedua objek menyatakan keseluruhan masing-masing kelompok; dalam bahasa Indonesia, kata “semua” kedua dapat dipahami melalui koordinasi, tetapi di sini maknanya dipertahankan secara semantis dalam frasa kedua.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang Midian” dinyatakan untuk memperjelas acuan pronomina jamak dari konteks tanpa mengubah pelaku atau sasaran tindakan. Penanda catatan kaki ditempatkan sesudah klausa yang memuat istilah ambigu.
