- from: Separuh yang menjadi bagian orang-orang yang pergi berperang itu[a] berjumlah 337.500 ekor domba.
  to: Separuh itu, yaitu bagian bagi orang-orang yang pergi berperang, berjumlah 337.500 ekor domba.[a]
  rationale: The revision preserves the Hebrew apposition and makes the allotment relationship explicit in idiomatic Indonesian. It retains the exact number, the livestock designation, and the military sense, while revising the footnote to reflect membership in the army rather than mere accompaniment.
