base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: id
  text: Separuh itu, yaitu bagian bagi orang-orang yang pergi berperang, berjumlah 337.500 ekor domba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Separuh itu, bagian orang-orang yang keluar dalam pasukan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: berjumlah
  rationale: Dalam konteks hasil pembagian dan penghitungan, bentuk היה ini menyatakan jumlah akhir; “berjumlah” alami dalam bahasa Indonesia tanpa mengubah nilainya.
- source_word: הַמֶּחֱצָה חֵלֶק
  choice: Separuh yang menjadi bagian
  rationale: חֵלֶק menjelaskan הַמֶּחֱצָה secara aposisional. Susunan ini mempertahankan gagasan “separuh” dan “bagian” sambil menghindari konstruksi Indonesia yang kaku.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: orang-orang yang pergi berperang
  rationale: Ungkapan ini secara harfiah menunjuk kepada mereka yang keluar dalam pasukan, yaitu para peserta pertempuran; “pergi berperang” merupakan padanan Indonesia yang jelas dan wajar.
- source_word: מִסְפַּר הַצֹּאן
  choice: berjumlah ... ekor domba
  rationale: מִסְפַּר memperkenalkan jumlah ternak, sedangkan צֹאן dalam daftar rampasan ini merujuk pada domba. Kata penggolong “ekor” sesuai untuk menghitung hewan dalam bahasa Indonesia.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '337.500'
  rationale: 'Bilangan Ibrani bersifat aditif: 300.000 + 30.000 + 7.000 + 500. Penulisan angka mengikuti kaidah Indonesia dan mempertahankan jumlah secara tepat.'
