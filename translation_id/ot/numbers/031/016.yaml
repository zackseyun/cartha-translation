id: NUM.31.16
reference: Numbers 31:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: id
  text: Lihatlah, perempuan-perempuan inilah yang, atas perkataan Bileam[b], menyebabkan anak-anak Israel[a] berlaku tidak setia kepada Yahweh dalam perkara Peor. Karena itu, tulah menimpa jemaah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah “anak-anak Israel”; ungkapan ini menunjuk kepada bangsa Israel.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “atas nasihat Bileam” atau “menurut anjuran Bileam”. Bahasa Ibrani secara harfiah berbunyi “atas/dengan perkataan Bileam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: Lihatlah, perempuan-perempuan inilah
  rationale: Ungkapan penunjuk yang berulang ini bersifat tegas. “Lihatlah” mempertahankan daya serunya, sedangkan “perempuan-perempuan inilah” menyatakan rujukan feminin jamak yang jelas dari konteks.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Mempertahankan bentuk ungkapan Ibrani, sambil memberi catatan bahwa ungkapan itu menunjuk kepada bangsa Israel.
- source_word: בִּדְבַר בִּלְעָם
  choice: atas perkataan Bileam
  rationale: דָּבָר secara harfiah berarti “perkataan/hal”. Dalam konteks ini frasa tersebut dapat menunjuk pada nasihat atau anjuran Bileam; terjemahan utama mempertahankan keluasan maknanya.
- source_word: לִמְסָר מַעַל
  choice: menyebabkan ... berlaku tidak setia
  rationale: Infinitif dari מסר menyatakan perantaraan atau penyebab, sedangkan מעל menggambarkan pelanggaran kesetiaan, khususnya terhadap Yahweh.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Dengan מעל, preposisi ini menandai pihak yang menjadi sasaran ketidaksetiaan. “Kepada” merupakan ungkapan Indonesia yang alami untuk berlaku tidak setia terhadap seseorang.
- source_word: עַל דְּבַר פְּעוֹר
  choice: dalam perkara Peor
  rationale: Terjemahan ini mempertahankan rujukan ringkas pada peristiwa Peor tanpa menambahkan penjelasan yang tidak dinyatakan dalam ayat.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: Karena itu, tulah menimpa
  rationale: Klausa berurutan ini menyampaikan akibat dari ketidaksetiaan tersebut. “Karena itu” membuat hubungan akibatnya jelas dan alami dalam bahasa Indonesia.
- source_word: בַּעֲדַת יְהוָה
  choice: jemaah Yahweh
  rationale: עֵדָה menunjuk pada komunitas atau perhimpunan umat. “Jemaah” mempertahankan nuansa komunal, dan verba “menimpa” menyampaikan datangnya tulah atas mereka.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Penyebutan eksplisit rujukan feminin הֵנָּה
  choice: perempuan-perempuan inilah
  alternative: mereka inilah; orang-orang inilah
  rationale: Pronomina Ibrani berbentuk feminin jamak, dan konteks langsung menunjuk kepada para perempuan Midian. Penyebutan eksplisit memperjelas rujukannya tanpa menambah identitas yang tidak disebut dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur kalimat dipecah menjadi dua agar hubungan akibat mudah dipahami. Istilah “berlaku tidak setia”, “tulah”, dan “jemaah” mempertahankan nuansa perjanjian dan komunal tanpa memakai bahasa yang terlalu arkais.
