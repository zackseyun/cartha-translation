base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: id
  text: Maka Musa dan Imam Eleazar melakukan seperti yang diperintahkan Yahweh kepada Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”.'
    reason: Memberi tahu pembaca tentang bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה merangkum pelaksanaan perintah sebelumnya; “melakukan” wajar dalam frasa “melakukan apa yang diperintahkan” dan menyatakan ketaatan tanpa menambah makna.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk baku nama tokoh Alkitab dalam bahasa Indonesia.
- source_word: וְאֶלְעָזָר
  choice: dan Eleazar
  rationale: Konjungsi diterjemahkan “dan”, sedangkan nama diri dipertahankan dalam bentuk Eleazar yang lazim.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Gelar הכהן mengidentifikasi jabatan Eleazar. Dalam susunan nama dan jabatan bahasa Indonesia, “Imam Eleazar” terdengar alami dan tetap mempertahankan peran resminya.
- source_word: כַּאֲשֶׁר
  choice: apa yang
  rationale: Dalam konstruksi עשה כאשר צוה, ungkapan “melakukan apa yang diperintahkan” menyampaikan kesesuaian tindakan dengan perintah secara alami dalam bahasa Indonesia.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk pasif menghasilkan ungkapan Indonesia yang alami dan tetap menyatakan Yahweh sebagai pemberi perintah; urutan perintah sebelum tindakan sudah jelas dari konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: Penanda objek אֵת tidak diterjemahkan tersendiri; karena verba Indonesia “memerintahkan” lazim mengambil penerima dengan “kepada”, hubungan Musa sebagai penerima perintah dinyatakan secara idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan mengikuti transliterasi akademis yang umum tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Maka” menyambungkan tindakan ini dengan perintah serta pembagian hasil rampasan dalam konteks sebelumnya. Susunan “Imam Eleazar” dipilih sebagai bentuk jabatan-nama yang alami dalam bahasa Indonesia.
