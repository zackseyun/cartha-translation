  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה וְ/אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶת הַ/זָּהָ֔ב מֵ/אֵ֛ת שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/הַ/מֵּא֑וֹת וַ/יָּבִ֤אוּ אֹת/וֹ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד זִכָּר֥וֹן לִ/בְנֵֽי יִשְׂרָאֵ֖ל לִ/פְנֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: id
  text: Musa dan Imam Eleazar mengambil emas itu dari para kepala pasukan seribu dan pasukan seratus, lalu membawanya ke dalam Kemah Pertemuan sebagai peringatan bagi Bani Israel di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk naratif dari לקח secara langsung berarti “mengambil”; bentuk tunggal mengikuti konstruksi Ibrani meskipun subjeknya majemuk, tetapi bahasa Indonesia secara alami tidak menandai jumlah pada verba.
- source_word: הַזָּהָב
  choice: emas itu
  rationale: Kata sandang Ibrani menunjuk kepada emas tertentu yang telah disebut dalam konteks sebelumnya.
- source_word: מֵאֵת
  choice: dari
  rationale: Preposisi ini menandai sumber atau asal; “dari” merupakan padanan Indonesia yang alami.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: para pemimpin pasukan seribu dan pasukan seratus
  rationale: Dalam konteks militer, שׂרים adalah para pemimpin atau perwira. “Pasukan seribu” dan “pasukan seratus” mempertahankan nama satuan militer-administratif tanpa menyiratkan bahwa jumlah aktualnya harus tepat seribu atau seratus orang.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ini adalah sebutan baku dan bermartabat dalam bahasa Indonesia bagi kemah suci tempat pertemuan yang ditetapkan.
- source_word: זִכָּרוֹן
  choice: sebagai tanda peringatan
  rationale: Nomina ini menunjuk pada sesuatu yang berfungsi mempertahankan ingatan atau menjadi memorial; “tanda peringatan” alami dalam bahasa Indonesia dan tetap mempertahankan fungsi kultisnya.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang lazim dan cukup formal untuk sebutan perjanjian harfiah “anak-anak lelaki/keturunan Israel,” tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan keberadaan di hadapan atau dalam hadirat Yahweh, khususnya dalam konteks ibadah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan sebutan בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak Israel; orang Israel; umat Israel
  rationale: Ungkapan Ibrani secara bentuk berarti “anak-anak lelaki Israel,” tetapi secara konvensional menunjuk kepada keturunan atau umat Israel secara keseluruhan. “Bani Israel” menjaga bentuk kolektif tradisional tanpa mempersempit cakupan kepada kaum laki-laki saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan urutan tindakan teks Ibrani, tetapi memakai penghubung “lalu” agar alur naratif alami. Istilah militer dijelaskan melalui “pasukan” supaya “seribu” dan “seratus” terbaca sebagai satuan komando, bukan sekadar bilangan lepas.
