  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: id
  text: Maka, dari antara orang Israel[b] disediakan[a] seribu orang dari setiap suku, seluruhnya dua belas ribu orang yang siap untuk berperang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diserahkan”, “ditugaskan”, atau “dikerahkan”; kata kerja Ibrani ini dapat berarti bahwa mereka diberikan atau disediakan untuk menjalankan tugas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari ribuan Israel”. Ungkapan ini dapat menunjuk bukan hanya pada jumlah, tetapi juga pada kelompok kaum atau satuan militer Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: diserahkan
  rationale: Bentuk Nifal menyatakan bahwa orang-orang itu diberikan atau disediakan dari antara Israel untuk tugas militer. 'Diserahkan' mempertahankan nuansa pasif dan ketegangan leksikal teks Ibrani; kemungkinan makna 'ditugaskan' atau 'dikerahkan' dicatat dalam catatan kaki.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: dari ribuan orang Israel
  rationale: Mempertahankan arti harfiah אַלְפֵי sebagai 'ribuan', sambil mencatat bahwa istilah itu dapat pula menunjuk pada kelompok kaum atau satuan militer Israel.
- source_word: אֶלֶף לַמַּטֶּה
  choice: seribu orang dari setiap suku
  rationale: Kata depan לְ dipahami secara distributif dalam konteks pengambilan pasukan, sehingga setiap suku menyumbangkan seribu orang.
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: seluruhnya dua belas ribu orang
  rationale: Jumlah ini merangkum pasukan yang berasal dari kedua belas suku; 'seluruhnya' membuat fungsi rangkuman itu jelas secara alami tanpa mengubah isinya.
- source_word: חֲלוּצֵי צָבָא
  choice: orang yang diperlengkapi untuk berperang
  rationale: חֲלוּצֵי menunjuk kepada orang-orang yang telah diperlengkapi atau disiapkan bagi aksi militer. Pilihan ini mempertahankan unsur kesiapan dan perlengkapan tanpa membatasi maknanya hanya pada kepemilikan senjata.
