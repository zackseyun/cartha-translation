    rationale: Nifal dari מסר dapat berarti diserahkan, diberikan, atau disediakan. Dalam konteks penetapan kontingen militer, “disediakan” mempertahankan pasif dan lebih wajar dalam bahasa Indonesia.
  - severity: low
    issue: “Diperlengkapi untuk berperang” agak lebih sempit daripada istilah Ibrani yang dapat mencakup kesiapan/penyusunan untuk dinas militer.
    rationale: “Siap untuk berperang” menyampaikan daya militer frasa חֲלוּצֵי צָבָא tanpa menentukan apakah penekanannya pada perlengkapan, persenjataan, atau penataan barisan.
