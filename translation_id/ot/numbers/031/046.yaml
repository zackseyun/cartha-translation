lexical_decisions:
- source_word: וְ/נֶפֶשׁ אָדָם
  choice: dan jumlah orang itu
  rationale: Dalam konteks daftar pembagian hasil jarahan, נֶפֶשׁ אָדָם menunjuk kepada manusia sebagai orang-orang yang dihitung, bukan kepada 'jiwa' sebagai unsur nonjasmani. Ungkapan 'jumlah orang itu' alami dalam bahasa Indonesia dan memperjelas fungsi frasa tersebut dalam rangkaian inventaris; וְ diterjemahkan 'dan' untuk mempertahankan kesinambungan dengan ayat sebelumnya.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: enam belas ribu
  rationale: Frasa bilangan Ibrani ini secara langsung menyatakan 16.000; angka tersebut ditulis dengan kata-kata sesuai gaya teks Alkitab bahasa Indonesia.
