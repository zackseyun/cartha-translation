base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: id
  text: Mereka berkata kepada Musa, “Hamba-hambamu telah menghitung[a] para prajurit yang berada di bawah komando kami[b], dan tidak ada seorang pun dari pasukan kami yang hilang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah mengangkat kepala”; sebuah ungkapan Ibrani untuk menghitung atau mendata.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang ada di tangan kami,” yaitu yang menjadi tanggung jawab atau berada di bawah wewenang kami.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: Hamba-hambamu
  rationale: Bentuk sapaan merendah para perwira kepada Musa; 'hamba' lebih sesuai daripada 'budak' karena status perbudakan tidak ditonjolkan dalam konteks ini.
- source_word: נָשְׂאוּ אֶת־רֹאשׁ
  choice: telah menghitung
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'mengangkat kepala' dipakai dalam konteks administratif dan militer untuk menghitung atau mendata orang.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: para prajurit
  rationale: Merujuk kepada laki-laki yang bertempur; 'para prajurit' menyampaikan fungsi militer dengan wajar dan ringkas dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: yang berada di bawah komando kami
  rationale: Ungkapan harfiah 'yang ada di tangan kami' menunjukkan pasukan yang menjadi tanggung jawab atau berada di bawah wewenang para perwira.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: dan tidak seorang pun dari antara kami hilang
  rationale: Dalam konteks pemeriksaan pasukan, bentuk nifal פקד berarti tidak hadir, hilang, atau tidak terhitung; terjemahan ini mempertahankan cakupan makna tanpa secara khusus menyatakan bahwa mereka tewas.
theological_decisions:
- issue: Makna ketidakhadiran para prajurit setelah pertempuran
  choice: tidak seorang pun dari antara kami hilang
  alternative: tidak seorang pun dari antara kami tewas
  rationale: Teks Ibrani menyatakan bahwa tidak seorang pun hilang atau tidak terhitung, tetapi tidak secara eksplisit memakai kata 'tewas'; terjemahan tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan pronominal posesif '-mu' mempertahankan gaya langsung kepada Musa. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskan.
