base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: id
  text: Hasil jarahan[a], yaitu sisa dari rampasan yang telah diambil oleh orang-orang dalam pasukan itu, berjumlah 675.000 ekor domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barang rampasan, yaitu sisa jarahan.” Bahasa Ibrani memakai dua istilah yang sangat berdekatan artinya untuk hasil rampasan perang (מַלְקוֹחַ dan בָּז), mungkin sebagai variasi gaya atau untuk memberi nuansa penggolongan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: berjumlah
  rationale: Bentuk היה memperkenalkan pernyataan inventaris; dalam bahasa Indonesia, “berjumlah” secara alami menyatakan nilai jumlah yang menyusul tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: הַמַּלְקוֹחַ
  choice: hasil jarahan
  rationale: Istilah ini menunjuk pada apa yang diambil dalam perang. “Hasil jarahan” jelas dalam bahasa Indonesia modern dan dapat dibedakan dari istilah rampasan berikutnya.
- source_word: יֶתֶר הַבָּז
  choice: sisa rampasan
  rationale: יֶתֶר menandai bagian yang tersisa, sedangkan בָּז adalah istilah umum untuk rampasan perang. Ungkapan ini mempertahankan hubungan konstruksi Ibrani secara ringkas.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: yang telah dirampas
  rationale: Kata kerja ini secara khusus berarti mengambil sebagai rampasan. Bentuk “telah dirampas” mempertahankan kaitan leksikal dengan “rampasan” dan menunjukkan tindakan yang mendahului penghitungan.
- source_word: עַם הַצָּבָא
  choice: orang-orang dalam pasukan itu
  rationale: Secara harfiah berarti “rakyat/orang-orang dari pasukan.” Pilihan ini mempertahankan unsur manusia dan militer sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: צֹאן
  choice: domba
  rationale: Dalam daftar penghitungan ini, “domba” merupakan padanan langsung dan alami; kata penggolong “ekor” ditambahkan sesuai idiom bahasa Indonesia.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: '675.000'
  rationale: Bilangan Ibrani berjumlah 600.000 + 70.000 + 5.000. Angka meningkatkan keterbacaan dalam daftar inventaris dan mengikuti penulisan bilangan Indonesia.
