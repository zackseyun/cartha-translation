  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”. Bentuk lain yang digunakan untuk nama ini antara lain “Yahweh” dan “Yehuwa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Lalu” menyatakan perkembangan peristiwa secara alami; “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat untuk דבר ketika subjeknya Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi berupa Tetragramaton dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan firman; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia dan tradisi Alkitab Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Formula Ibrani harfiah “untuk mengatakan” memperkenalkan isi perkataan pada ayat berikutnya. Dalam bahasa Indonesia, fungsi itu sudah tersampaikan secara alami oleh “berfirman” dan koma; menambahkan “demikian” dapat memberi kesan bahwa ujaran dimulai dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar, sedangkan catatan kaki memberi tahu pembaca mengenai kebiasaan penerjemahan lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dibuat alami dalam narasi Indonesia. Penanda catatan kaki ditempatkan setelah “Musa” mengikuti lapisan konsultasi, meskipun isi catatan menerangkan nama “Yahweh”.
