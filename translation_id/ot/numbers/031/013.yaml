  text: וַ/יֵּ֨צְא֜וּ מֹשֶׁ֨ה וְ/אֶלְעָזָ֧ר הַ/כֹּהֵ֛ן וְ/כָל נְשִׂיאֵ֥י הָ/עֵדָ֖ה לִ/קְרָאתָ֑/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: id
  text: Lalu Musa, Imam Eleazar, dan semua pemimpin umat[a] keluar menemui mereka di luar perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua kepala umat” atau “semua pemuka jemaah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Bentuk wayyiqtol dari יצא menyatakan gerak ke arah luar; “keluar” merupakan padanan naratif Indonesia yang alami dan tepat.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Gelar הַכֹּהֵן menyatakan jabatan Eleazar. Dalam bahasa Indonesia, penempatan gelar sebelum nama terdengar alami dan tetap mempertahankan identifikasinya.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: semua pemimpin umat
  rationale: נְשִׂיאִים di sini menunjuk kepada para pemimpin resmi komunitas, bukan raja atau bangsawan; הָעֵדָה menunjuk kepada komunitas Israel. “Pemimpin umat” jelas, wajar, dan sesuai konteks.
- source_word: לִקְרָאתָם
  choice: menemui mereka
  rationale: Infinitif dengan ל menyatakan tujuan tindakan keluar, yaitu untuk menemui mereka.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Ungkapan ini menunjuk pada tempat di luar batas perkemahan. “Di luar perkemahan” menyampaikan lokasinya secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Penanda catatan kaki ditempatkan sesudah “umat,” yakni frasa yang dijelaskannya, bukan sesudah nama Musa seperti dalam lapisan konsultasi bahasa Inggris.
