  source_fidelity: Teks menerjemahkan וַיִּקְחוּ dengan tepat sebagai “Mereka mengambil” dan mempertahankan dua nomina yang dibedakan dalam bahasa Ibrani, שָׁלָל (“jarahan”) dan מַלְקוֹחַ (“hasil rampasan”). Frasa “baik manusia maupun ternak” dengan setia mencerminkan keterangan בָּאָדָם וּבַבְּהֵמָה dan tidak menambahkan rincian yang tidak ada pada sumber.
