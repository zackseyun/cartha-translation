  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: id
  text: Mereka mengambil seluruh jarahan dan seluruh hasil rampasan, baik manusia maupun ternak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: jarahan
  rationale: Istilah ini secara alami menyatakan barang jarahan perang dan tetap dibedakan dari מַלְקוֹחַ.
- source_word: מַלְקוֹחַ
  choice: hasil rampasan
  rationale: Kata ini menunjuk pada apa yang dirampas atau ditawan; ungkapan umum ini mempertahankan cakupan luas yang kemudian dijelaskan sebagai manusia dan ternak.
- source_word: אָדָם
  choice: manusia
  rationale: Padanan kolektif dan netral bagi manusia yang ditawan, tanpa membatasi jenis kelamin.
- source_word: בְּהֵמָה
  choice: ternak
  rationale: Dalam konteks rampasan perang, kata ini paling wajar menunjuk pada hewan peliharaan atau ternak, bukan binatang secara umum.
