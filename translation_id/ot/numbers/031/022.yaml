id: NUM.31.22
reference: Numbers 31:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֥ךְ אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כָּ֑סֶף אֶֽת הַ/נְּחֹ֨שֶׁת֙ אֶת הַ/בַּרְזֶ֔ל אֶֽת הַ/בְּדִ֖יל וְ/אֶת הָ/עֹפָֽרֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: id
  text: Hanya emas, perak, tembaga[a], besi, timah, dan timbal—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perunggu.” Istilah Ibrani ini dapat merujuk secara luas pada tembaga atau logam berbahan dasar tembaga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: Dalam konteks ini kata tersebut membatasi daftar benda yang dibicarakan dan memperkenalkan pengecualian terhadap petunjuk sebelumnya.
- source_word: הַזָּהָב
  choice: emas
  rationale: Padanan baku untuk nama logam emas; artikel Ibrani tidak perlu dinyatakan satu per satu dalam daftar bahasa Indonesia.
- source_word: הַכָּסֶף
  choice: perak
  rationale: Konteks daftar logam menunjukkan arti 'perak', bukan 'uang'.
- source_word: הַנְּחֹשֶׁת
  choice: tembaga[a]
  rationale: Istilah Ibrani ini dapat menunjuk pada tembaga maupun logam berbahan dasar tembaga, termasuk perunggu. 'Tembaga' dipilih sebagai padanan luas dan alami, sementara alternatifnya dicatat.
- source_word: הַבַּרְזֶל
  choice: besi
  rationale: Padanan baku untuk nama logam besi.
- source_word: הַבְּדִיל
  choice: timah
  rationale: Dalam daftar logam, kata ini paling wajar dipahami sebagai timah (tin), bukan secara umum sebagai campuran logam.
- source_word: הָעֹפָרֶת
  choice: timbal
  rationale: Padanan modern yang tepat untuk logam lead dan membedakannya dengan jelas dari timah.
- source_word: אֵת (berulang sebelum setiap nomina)
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung ini menata dan menegaskan unsur-unsur daftar dalam bahasa Ibrani; dalam bahasa Indonesia fungsinya diwakili oleh susunan daftar dan tanda baca.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda pisah pada akhir ayat dipertahankan karena kalimat dan petunjuknya berlanjut ke ayat berikutnya.
