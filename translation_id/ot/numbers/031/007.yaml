base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: id
  text: Mereka berperang melawan Midian[a], sebagaimana Yahweh telah memerintahkan Musa, dan mereka membunuh setiap laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka bertempur melawan Midian.” Verba Ibrani ini dapat menyatakan pelaksanaan dinas militer atau peperangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: mereka berperang
  rationale: Bentuk verba dari צבא di sini menyatakan keterlibatan dalam tindakan militer. “Berperang” alami dalam bahasa Indonesia dan mempertahankan cakupan makna tanpa mempersempitnya pada satu pertempuran tertentu.
- source_word: עַל
  choice: melawan
  rationale: Dengan verba tindakan militer dan Midian sebagai sasaran, עַל menyatakan arah permusuhan; “melawan” merupakan padanan Indonesia yang alami.
- source_word: מִדְיָן
  choice: Midian
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menyatakan kesesuaian tindakan mereka dengan perintah ilahi. “Tepat seperti” menegaskan korespondensi tersebut secara alami.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: Konstruksi pasif relatif ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa Yahweh memberi perintah kepada Musa sebelum tindakan perang itu dilakukan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: אֶת menandai Musa sebagai objek dari verba “memerintahkan”; bahasa Indonesia secara idiomatis memakai “memerintahkan ... kepada” dalam konstruksi pasif ini.
- source_word: וַיַּהַרְגוּ
  choice: mereka membunuh
  rationale: הרג secara langsung berarti membunuh. Padanan ini jelas, lugas, dan tidak menghaluskan tindakan yang dinyatakan sumber.
- source_word: כָּל
  choice: setiap
  rationale: Dengan nomina tunggal זָכָר, “setiap” secara alami menyampaikan sifat distributif כָּל.
- source_word: זָכָר
  choice: laki-laki
  rationale: זָכָר menunjuk pada jenis kelamin laki-laki tanpa dengan sendirinya membatasi usia. “Laki-laki” adalah ungkapan Indonesia yang paling alami dan dapat mencakup laki-laki dari berbagai usia dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Transliterasi “Yahweh” mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Cakupan זָכָר
  choice: setiap laki-laki
  alternative: semua pria atau setiap orang laki-laki
  rationale: Sumber menyebut jenis kelamin laki-laki, bukan khusus pria dewasa. “Setiap laki-laki” mempertahankan cakupan itu tanpa mempersempitnya berdasarkan usia.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Susunan kalimat mengikuti alur sumber, sementara pilihan “berperang” dan konstruksi “yang diperintahkan Yahweh kepada Musa” menjaga kealamian. Kekerasan teks disampaikan langsung tanpa diperhalus atau diperluas.
