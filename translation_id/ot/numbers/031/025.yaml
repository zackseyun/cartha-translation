  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan secara alami; “berfirman” merupakan ungkapan Indonesia yang wajar ketika Allah menjadi subjek ujaran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Padanan Indonesia yang lazim untuk penerima ujaran dalam formula ini.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: diwakili oleh tanda koma yang mengantar isi firman pada ayat berikutnya
  rationale: Dalam bahasa Indonesia modern, menerjemahkannya secara harfiah sebagai “demikian” atau “katanya” setelah “berfirman” terasa kaku dan berulang. Fungsi pengantar kutipannya tetap dipertahankan secara sintaksis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri יהוה. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula ujaran Ibrani dialihkan secara alami tanpa mengulang verba ujaran; koma menunjukkan bahwa isi firman berlanjut pada ayat berikutnya.
