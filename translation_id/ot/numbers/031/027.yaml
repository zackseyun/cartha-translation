source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: id
  text: Bagilah hasil jarahan itu antara para pejuang yang pergi berperang dan seluruh umat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: Bagilah
  rationale: Bentuk perfek konsekutif dalam rangkaian perintah kepada Musa berfungsi sebagai instruksi. Imperatif bahasa Indonesia paling alami dan langsung.
- source_word: הַמַּלְקוֹחַ
  choice: hasil jarahan itu
  rationale: Istilah ini menunjuk pada apa yang dirampas dalam perang dan dalam konteks mencakup manusia serta ternak. 'Hasil jarahan' cukup luas, alami, dan tidak membatasi rujukannya hanya pada barang.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan
  rationale: Konstruksi ini membagi hasil jarahan kepada dua kelompok yang berbeda.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: para pejuang
  rationale: Secara harfiah ungkapan ini adalah 'orang-orang yang memegang/menangani perang', yakni mereka yang bertempur. 'Para pejuang' menyampaikan idiom tersebut dengan ringkas dan wajar.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: yang pergi berperang
  rationale: Frasa partisipial ini menerangkan para pejuang sebagai mereka yang keluar untuk menjalankan tugas militer atau mengikuti pertempuran.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk pada komunitas Israel sebagai satu kesatuan. 'Seluruh umat' alami dalam bahasa Indonesia dan mempertahankan arti korporatnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur dua pihak dipertahankan dengan 'antara ... dan'. Tidak ada catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat ini.
