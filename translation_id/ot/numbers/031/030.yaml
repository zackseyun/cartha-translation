  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: id
  text: Dari setengah bagian milik umat Israel, ambillah satu dari setiap lima puluh[a]—dari manusia, sapi, keledai, dan kawanan domba dan kambing, dari segala ternak—lalu berikanlah semuanya itu kepada orang Lewi yang menjalankan tugas menjaga Kemah Suci Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “satu yang diambil dari setiap lima puluh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Dari setengah bagian milik umat Israel
  rationale: מַחֲצִית menunjuk pada setengah bagian atau jatah. בְּנֵי יִשְׂרָאֵל secara harfiah berarti 'anak-anak Israel', tetapi dalam bahasa Indonesia modern 'umat Israel' lebih wajar dan tetap menunjuk kepada kelompok Israel.
- source_word: תִּקַּח
  choice: ambillah
  rationale: Bentuk imperfek ini berfungsi sebagai perintah kepada Musa; bentuk imperatif Indonesia menyampaikan daya instruksinya secara alami.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: satu dari setiap lima puluh
  rationale: Ungkapan ini menetapkan pungutan dengan perbandingan satu banding lima puluh. Terjemahan ini jelas dan idiomatis; nuansa אָחֻז sebagai sesuatu yang diambil dicatat dalam catatan kaki.
- source_word: מִן הָאָדָם
  choice: dari manusia
  rationale: אָדָם berbentuk tunggal kolektif dan di sini menunjuk pada bagian manusia di antara hasil rampasan. 'Manusia' mempertahankan perbedaan antara manusia dan ternak tanpa menyiratkan hanya laki-laki.
- source_word: מִן הַבָּקָר
  choice: sapi
  rationale: בָּקָר adalah istilah kolektif bagi ternak besar, terutama sapi.
- source_word: מִן הַחֲמֹרִים
  choice: keledai
  rationale: Padanan Indonesia modern dan langsung bagi bentuk jamak Ibrani ini.
- source_word: וּמִן הַצֹּאן
  choice: kawanan kambing domba
  rationale: צֹאן merupakan istilah kolektif yang mencakup ternak kecil, khususnya domba dan kambing. 'Kawanan kambing domba' menyatakan cakupan itu secara ringkas.
- source_word: מִכָּל הַבְּהֵמָה
  choice: dari segala ternak
  rationale: בְּהֵמָה di sini merangkum semua jenis hewan piaraan yang termasuk dalam pembagian rampasan.
- source_word: וְנָתַתָּה אֹתָם לַלְוִיִּם
  choice: lalu berikanlah semuanya itu kepada orang Lewi
  rationale: Rangkaian waw diterjemahkan sebagai kelanjutan instruksi. 'Semuanya itu' menyampaikan pronomina jamak yang merujuk pada seluruh pungutan.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: yang menjalankan tugas menjaga Kemah Suci
  rationale: Konstruksi serumpun שֹׁמְרֵי מִשְׁמֶרֶת menekankan tanggung jawab yang wajib dipelihara atau dijaga. 'Menjalankan tugas menjaga' mempertahankan unsur tugas dan penjagaan; מִשְׁכָּן diterjemahkan 'Kemah Suci' dalam konteks tempat kudus portabel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian YHWH. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan instruksi, rasio pungutan, perbedaan manusia dan ternak, serta nuansa tugas penjagaan orang Lewi.
