  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: id
  text: Setiap benda yang dapat dimasukkan ke dalam api harus kamu masukkan ke dalam api dan akan menjadi tahir. Namun, benda itu harus ditahirkan dengan air pentahiran.[a] Setiap benda yang tidak dapat dimasukkan ke dalam api harus kamu masukkan ke dalam air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air kenajisan”; secara tradisional, “air pemisahan” (bdk. Bilangan 19).
    reason: Menampilkan bentuk harfiah dan padanan tradisional bagi מֵי נִדָּה, sedangkan “air pentahiran” dalam teks utama menyatakan fungsinya dalam konteks kemurnian ritual.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: Segala benda
  rationale: Dalam konteks barang rampasan, frasa ini menunjuk secara menyeluruh kepada setiap benda konkret.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: yang dapat dimasukkan ke dalam api
  rationale: Ungkapan ini membedakan benda yang tahan terhadap proses dengan api dari benda yang tidak dapat diperlakukan demikian.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: harus kamu lewatkan melalui api
  rationale: Mempertahankan bentuk kausatif dari עבר dan kesejajarannya dengan tindakan melalui air pada akhir ayat.
- source_word: וְטָהֵר
  choice: maka benda itu menjadi tahir
  rationale: Menunjukkan keadaan ritual yang dihasilkan, bukan pengampunan atas kesalahan moral.
- source_word: אַךְ
  choice: Namun, ... juga
  rationale: Menyampaikan pembatasan penting bahwa pemrosesan dengan api tidak meniadakan keharusan pentahiran dengan air khusus.
- source_word: בְּמֵי נִדָּה
  choice: dengan air untuk menghapus kenajisan
  rationale: Menjelaskan fungsi air khusus dalam pentahiran ritual menurut konteks Bilangan 19 tanpa memberi kesan bahwa air itu sendiri najis.
- source_word: יִתְחַטָּא
  choice: harus ditahirkan
  rationale: Dalam konteks keimaman, bentuk ini menyatakan bahwa benda harus menjalani pentahiran dari kenajisan ritual.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: Segala benda yang tidak dapat dimasukkan ke dalam api
  rationale: Menyatakan kontras praktis dengan benda yang dapat menjalani pemrosesan melalui api.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: harus kamu lewatkan melalui air
  rationale: Mempertahankan kata kerja dan kesejajaran dengan perintah untuk melewatkan benda melalui api.
theological_decisions:
- issue: Sifat bahasa pentahiran dalam hukum keimaman
  choice: Menggunakan istilah tahir dan kenajisan ritual.
  alternative: Menggunakan bahasa dosa atau penyucian moral.
  rationale: Konteks Bilangan 31 dan kaitannya dengan Bilangan 19 membahas status ritual benda, bukan pengampunan atas kesalahan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “tahir” dipertahankan karena lazim dan tepat untuk konteks kemurnian ritual; susunan kalimat dibuat jelas bagi pembaca umum tanpa menghapus kesejajaran tindakan melalui api dan melalui air.
