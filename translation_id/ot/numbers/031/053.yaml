  text: Para prajurit itu masing-masing telah mengambil jarahan untuk dirinya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Para prajurit itu telah menjarah, masing-masing untuk dirinya sendiri.”
