lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: Orang-orang dalam pasukan itu
  rationale: Frasa konstruksi ini menunjuk kepada para laki-laki anggota kekuatan militer. Dalam bahasa Indonesia modern, “orang-orang dalam pasukan itu” menyampaikan keanggotaan mereka secara alami tanpa mengubahnya menjadi sebutan teknis yang tidak dinyatakan langsung oleh teks.
- source_word: בָּזְזוּ
  choice: telah mengambil jarahan
  rationale: Kata kerja בזז berarti menjarah atau mengambil barang rampasan. Karena objeknya tersirat, “mengambil jarahan” membuat maknanya jelas dan wajar dalam bahasa Indonesia, sedangkan aspek telah selesai sesuai dengan konteks naratif.
- source_word: אִישׁ לוֹ
  choice: masing-masing ... bagi dirinya sendiri
  rationale: Ungkapan distributif ini secara harfiah berarti “setiap orang bagi dirinya”; terjemahan tersebut mempertahankan bahwa tiap anggota pasukan mengambil jarahan untuk dirinya sendiri.
