  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: id
  text: Manusia itu berjumlah enam belas ribu orang,[a] dan pungutan[b] bagi Yahweh dari mereka berjumlah tiga puluh dua orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa manusia”; maksudnya, orang-orang atau individu manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau “bagian wajib.” Kata Ibrani ini menunjuk pada bagian rampasan yang dihitung dan dikhususkan bagi Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: manusia ... orang
  rationale: Ungkapan ini menghitung individu manusia dan membedakan mereka dari hewan dalam daftar rampasan. Dalam bahasa Indonesia, “manusia berjumlah ... orang” menyampaikan kedua unsur itu secara alami tanpa memberi נֶפֶשׁ arti metafisik yang tidak dituntut konteks.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: enam belas ribu
  rationale: Padanan langsung bagi bilangan kardinal Ibrani.
- source_word: מִכְסָם
  choice: pungutan dari mereka
  rationale: מֶכֶס menunjuk pada bagian yang ditetapkan dan diambil dari rampasan. “Pungutan” mempertahankan nuansa bagian wajib yang diperhitungkan, sedangkan “dari mereka” menyatakan sufiks pronominal dalam konteks orang-orang yang dihitung.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau pengkhususan bagian tersebut kepada Yahweh.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: tiga puluh dua orang
  rationale: נֶפֶשׁ kembali dipakai sebagai satuan hitung bagi individu manusia; “orang” merupakan padanan Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama diri itu, bukan menggantinya dengan gelar.
- issue: Makna נֶפֶשׁ dalam penghitungan manusia
  choice: orang
  alternative: jiwa
  rationale: Dalam daftar pembagian rampasan ini, נֶפֶשׁ berfungsi sebagai sebutan untuk individu manusia. “Orang” menghindari penyempitan makna menjadi unsur rohani manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara pembedaan manusia dari hewan, sifat pungutan yang diperhitungkan, dan nama ilahi tetap dipertahankan.
