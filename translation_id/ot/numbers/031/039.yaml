  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: id
  text: Keledai berjumlah 30.500 ekor, dan bagian yang ditetapkan bagi Yahweh adalah 61 ekor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: Keledai
  rationale: חֲמֹרִים adalah bentuk jamak umum untuk keledai. Kata penghubung awal tidak perlu dinyatakan dalam bahasa Indonesia karena ayat ini melanjutkan daftar inventaris.
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30.500 ekor
  rationale: Urutan bilangan Ibrani menyatakan jumlah 30.500. Angka dipakai agar mudah dibaca dalam konteks daftar, dan penggolong 'ekor' ditambahkan secara wajar untuk hewan.
- source_word: וּ/מִכְסָ/ם
  choice: bagian yang dipersembahkan dari jumlah itu
  rationale: מֶכֶס di sini menunjuk pada bagian yang ditetapkan dari barang rampasan bagi Yahweh. Ungkapan ini menyampaikan fungsi pembagian tersebut dengan jelas tanpa memberi kesan pajak umum.
- source_word: לַ/יהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima atau memiliki bagian itu, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: 61 ekor
  rationale: Susunan bilangan Ibrani secara harfiah 'satu dan enam puluh' menyatakan 61; penggolong 'ekor' memperjelas bahwa jumlah itu masih merujuk pada keledai.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian dalam bentuk nama diri.
- issue: Sifat מֶכֶס dalam konteks rampasan perang
  choice: bagian yang dipersembahkan
  alternative: upeti; pungutan; bagian yang ditetapkan
  rationale: Konteks ayat 25–30 menetapkan sebagian rampasan bagi Yahweh. Pilihan ini menjelaskan tujuan kultis bagian itu tanpa mengubahnya menjadi pajak umum atau mengaburkan bahwa jumlahnya ditentukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur daftar dipertahankan, angka ditulis dengan digit, dan 'ekor' dipakai sebagai penggolong alami bagi hewan.
