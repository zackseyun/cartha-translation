- source_word: שִׁשָּׁה וּ/שְׁלֹשִׁים אָלֶף
  choice: tiga puluh enam ribu ekor
  rationale: Ungkapan Ibrani secara harfiah menyusun bilangan sebagai “enam dan tiga puluh ribu”. Urutannya disesuaikan dengan kaidah bilangan bahasa Indonesia modern, sedangkan “ekor” ditambahkan sebagai kata penggolong alami bagi hewan tanpa mengubah jumlah.
