  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: id
  text: “Lakukanlah pembalasan bagi orang Israel terhadap orang Midian.[a] Sesudah itu, engkau akan dikumpulkan kepada kaummu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Tuntutlah pembalasan bagi orang Israel terhadap orang Midian.” Secara harfiah dalam bahasa Ibrani: “Lakukanlah pembalasan orang Israel dari/terhadap orang Midian.”'
    reason: lexical_alternative
  - marker: b
    text: “Dikumpulkan kepada kaummu” adalah ungkapan Ibrani untuk kematian.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Lakukanlah pembalasan
  rationale: Kata kerja imperatif dan nomina serumpun membentuk ungkapan penegasan yang secara harfiah menyerupai ‘balaskanlah pembalasan’. Bentuk Indonesia ini mempertahankan daya perintah dan makna penghukuman tanpa menghasilkan pengulangan yang janggal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada bangsa Israel sebagai kelompok. ‘Orang Israel’ alami dalam bahasa Indonesia modern dan tidak menimbulkan kesan bahwa yang dimaksud hanya anak laki-laki secara harfiah.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: terhadap orang Midian
  rationale: Dengan akar נקם, frasa berpreposisi ini menandai pihak yang menjadi sasaran pembalasan. ‘Terhadap’ menyampaikan hubungan itu dengan jelas dan wajar.
- source_word: אַחַר
  choice: Sesudah itu
  rationale: Menandai urutan waktu antara pelaksanaan pembalasan dan kematian Musa.
- source_word: תֵּאָסֵף
  choice: engkau akan dikumpulkan
  rationale: Bentuk pasif ini mempertahankan metafora Ibrani dan tidak langsung menggantinya dengan parafrasa ‘engkau akan mati’.
- source_word: אֶל עַמֶּיךָ
  choice: kepada kaummu
  rationale: ‘Kaummu’ cukup dekat dengan ungkapan sumber dan menghindari penafsiran yang lebih sempit seperti ‘leluhurmu’, sambil mempertahankan idiom kematian.
theological_decisions:
- issue: Ungkapan tentang kematian Musa
  choice: Mempertahankan ‘engkau akan dikumpulkan kepada kaummu’.
  alternative: ‘Sesudah itu, engkau akan mati’ atau ‘engkau akan dikumpulkan kepada leluhurmu’.
  rationale: Ungkapan Ibrani merupakan idiom kematian, tetapi metaforanya tetap dipertahankan agar teks tidak diberi rincian tentang keadaan sesudah mati yang tidak dinyatakan secara eksplisit.
- issue: Pihak yang kepentingannya dibalaskan
  choice: ‘pembalasan bagi orang Israel’.
  alternative: ‘balaskanlah orang Israel’ atau ‘lakukanlah pembalasan orang Israel’.
  rationale: Susunan Ibrani dapat dipahami sebagai pembalasan milik atau demi Israel. Pilihan utama menyampaikan tindakan atas nama mereka, sedangkan catatan kaki mempertahankan bentuk dan kemungkinan alternatif sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ‘engkau’ sesuai untuk sapaan tunggal langsung kepada Musa. Metafora kematian dipertahankan, sedangkan ungkapan pembalasan dibuat alami tanpa mengurangi kekuatan perintah.
