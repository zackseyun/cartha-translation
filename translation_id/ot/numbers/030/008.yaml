  naturalness: “Diam terhadap dia” merupakan calque yang janggal dalam bahasa Indonesia modern. “Tidak mengatakan apa-apa kepadanya” alami serta tetap menyampaikan tindakan diam/tidak menyatakan keberatan. Pengulangan “suaminya” dalam frasa waktu diperlukan untuk menghilangkan ambiguitas.
