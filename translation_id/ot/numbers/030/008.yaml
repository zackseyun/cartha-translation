base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: id
  text: Jika suaminya mendengarnya pada hari suaminya mendengarnya dan tidak mengatakan apa-apa kepadanya[a], nazar-nazar perempuan itu tetap berlaku, dan ikatan-ikatan yang dikenakannya pada dirinya sendiri tetap berlaku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan ia diam terhadapnya.” Ungkapan Ibrani ini menunjukkan bahwa suaminya tidak mengajukan keberatan.
    reason: lexical_alternative
  - marker: b
    text: “Ikatan-ikatan” berarti komitmen atau kewajiban mengikat yang dikenakannya pada dirinya sendiri.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Jika ... mendengarnya
  rationale: Dalam rangkaian hukum kasuistik ini, bentuk tersebut berfungsi sebagai syarat; bahasa Indonesia alami memakai "jika".
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks hukum perkawinan, אִישׁ dengan sufiks orang ketiga feminin tunggal berarti suaminya.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: pada hari ia mendengarnya
  rationale: Mempertahankan batas waktu hukum yang dinyatakan secara eksplisit oleh teks Ibrani.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: diam terhadap dia
  rationale: Mempertahankan ungkapan Ibrani yang menyatakan bahwa sang suami tidak mengajukan keberatan, dengan penjelasan dalam catatan kaki.
- source_word: וְקָמוּ / יָקֻמוּ
  choice: tetap berlaku
  rationale: Dalam konteks hukum, קום berarti komitmen itu berdiri atau tetap sah; "tetap berlaku" jelas dan alami dalam bahasa Indonesia serta mempertahankan pengulangan verba.
- source_word: נְדָרֶיהָ
  choice: nazar-nazar perempuan itu
  rationale: '"Nazar" merupakan padanan baku bagi נדר; penyebutan "perempuan itu" menghindari rentetan pronomina yang berpotensi kabur dalam bahasa Indonesia.'
- source_word: וֶאֱסָרֶהָ
  choice: ikatan-ikatan
  rationale: Nomina dari akar אסר menggambarkan komitmen atau pembatasan yang mengikat; pilihan ini mempertahankan metafora sumber tanpa menentukan jenis kewajibannya secara sempit.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: yang dikenakannya pada dirinya sendiri
  rationale: Menyampaikan tindakan membebankan ikatan kepada diri sendiri secara alami, tanpa menafsirkan נֶפֶשׁ sebagai jiwa yang terpisah.
