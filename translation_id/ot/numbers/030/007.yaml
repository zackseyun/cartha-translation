  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: id
  text: Tetapi jika ia menjadi istri seorang laki-laki[a], sementara nazar-nazarnya masih berlaku atas dirinya, atau ada ucapan gegabah dari bibirnya[b] yang dengannya ia telah mengikat dirinya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “ia bersuami” atau “ia menikah dengan seorang laki-laki.” Secara harfiah, idiom Ibraninya berbunyi “ia menjadi/berada bagi seorang laki-laki.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “ucapan dari bibirnya.” Frasa ini mungkin menunjuk pada kewajiban yang diucapkan secara spontan atau gegabah, yang dibedakan dari nazar formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Kata penghubung ini meneruskan ketentuan sebelumnya sekaligus memperkenalkan keadaan lain yang sedikit berlawanan.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: ia menjadi istri seseorang
  rationale: Ungkapan היה + לְאִישׁ merupakan idiom relasi perkawinan. Pilihan ini menyampaikan masuknya atau keberadaannya dalam perkawinan tanpa memakai bahasa kepemilikan yang dapat mengaburkan maksud hukumnya.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: sementara nazar-nazarnya masih berlaku atas dirinya
  rationale: Frasa ini mempertahankan gambaran kewajiban yang berada atas dirinya, sedangkan kata 'masih' menunjukkan bahwa nazar itu telah ada ketika keadaan perkawinan yang dibicarakan terjadi, tanpa mendahului keputusan hukum dalam ayat berikutnya.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: ucapan gegabah dari bibirnya
  rationale: מִבְטָא menunjuk pada sesuatu yang diucapkan; dalam konteks nazar dan pengikatan diri, kata ini dapat bernuansa ucapan kewajiban yang terlontar tanpa pertimbangan matang. 'Ucapan' tetap membedakannya dari nazar formal.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: yang dengannya ia telah mengikat dirinya
  rationale: אָסַר dalam hukum nazar berarti mengikat atau mewajibkan, sedangkan נֶפֶשׁ di sini berfungsi refleksif dan menunjuk kepada orang itu sendiri.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks hukum nazar
  choice: dirinya
  alternative: jiwanya; hidupnya
  rationale: Konteksnya adalah kewajiban yang dikenakan seseorang kepada dirinya sendiri, bukan ajaran antropologis tentang jiwa. 'Dirinya' mempertahankan fungsi refleksif ungkapan Ibrani tanpa memasukkan gagasan teologis tambahan.
- issue: Sifat ucapan dalam מִבְטָא שְׂפָתֶיהָ
  choice: ucapan gegabah dari bibirnya
  alternative: ucapan dari bibirnya
  rationale: Konteks pengikatan diri mendukung nuansa ucapan yang terlontar secara gegabah, tetapi karena kata bendanya sendiri juga dapat dipahami secara netral, alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dipertahankan sebagai anak kalimat yang berlanjut ke ayat berikutnya. Istilah 'nazar' dipakai karena lazim dalam ragam Alkitab Indonesia dan tepat bagi konteks hukum keagamaan.
