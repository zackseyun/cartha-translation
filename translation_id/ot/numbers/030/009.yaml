revisions:
- from: Namun, jika pada hari suaminya mendengar tentang hal itu, suaminya melarangnya dan membatalkan nazar yang ditanggungnya serta ucapan gegabah dari bibirnya[a] yang dengannya ia mengikat dirinya, Yahweh akan mengampuninya.
  to: Namun, jika pada hari suaminya mendengar tentang hal itu ia melarangnya dan membatalkan nazar yang mengikatnya serta ucapan gegabah dari bibirnya[a] yang dengannya ia mengikat dirinya, Yahweh akan mengampuninya.
