id: NUM.30.9
reference: Numbers 30:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: id
  text: Namun, jika pada hari suaminya mendengar tentang hal itu ia melarangnya dan membatalkan nazar yang mengikatnya serta ucapan gegabah dari bibirnya[a] yang dengannya ia mengikat dirinya, Yahweh akan mengampuninya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ucapan dari bibirnya” atau “ucapan yang mengikat dari bibirnya.”
    reason: Nuansa מִבְטָא dalam konteks ini tidak sepenuhnya pasti; kata itu dapat dipahami secara netral sebagai ucapan atau, secara kontekstual, sebagai ucapan yang gegabah atau mengikat.
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menyatakan syarat sekaligus kontras dengan perkara sebelumnya.
- source_word: בְּיוֹם שְׁמֹעַ
  choice: pada hari ... mendengar tentang hal itu
  rationale: Mempertahankan unsur waktu harfiah בְּיוֹם dan mengungkapkan objek tersirat secara wajar dalam bahasa Indonesia.
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks hukum keluarga ini, אִישׁ dengan sufiks feminin tunggal berarti suami perempuan tersebut.
- source_word: יָנִיא אֹתָהּ
  choice: melarangnya
  rationale: Bentuk Hifil dari נוא dalam konteks nazar berarti mencegah atau tidak mengizinkan kewajiban itu berlaku.
- source_word: וְהֵפֵר
  choice: dan membatalkan
  rationale: Dalam hukum nazar, הפר menunjuk pada peniadaan keabsahan atau daya ikat nazar.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: nazar yang ditanggungnya
  rationale: Mengungkapkan metafora kewajiban yang berada 'atas' seseorang dengan idiom Indonesia yang alami.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: ucapan gegabah dari bibirnya
  rationale: מִבְטָא berarti ucapan; konteks komitmen lisan mendukung kemungkinan nuansa gegabah, tetapi ketidakpastian nuansa itu dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: yang dengannya ia mengikat dirinya
  rationale: Mempertahankan gambaran hukum tentang seseorang yang menempatkan dirinya sendiri di bawah kewajiban.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang tertulis dalam teks Ibrani.
- source_word: יִסְלַח לָהּ
  choice: akan mengampuninya
  rationale: סלח berarti mengampuni; bentuk imperfek di sini menyatakan akibat hukum yang akan berlaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa מִבְטָא שְׂפָתֶיהָ
  choice: ucapan gegabah dari bibirnya
  alternative: ucapan dari bibirnya
  rationale: Konteks nazar memungkinkan nuansa ucapan spontan atau gegabah, tetapi leksem itu sendiri terutama berarti 'ucapan'; karena itu alternatif yang lebih netral dicatat.
- issue: Hubungan antara nazar dan ucapan bibir
  choice: serta
  alternative: atau
  rationale: Teks Ibrani menghubungkan kedua objek yang dibatalkan dengan וְאֵת ('dan/serta'), sehingga terjemahan tidak mengubahnya menjadi pilihan eksklusif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang tetap mudah dipahami. Pengulangan 'suaminya' dipertahankan pada awal klausa utama untuk memperjelas pelaku, sedangkan pronomina berikutnya mengikuti rujukan konteks. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskan.
