revisions:
- from: Itulah ketetapan-ketetapan yang diperintahkan Yahweh kepada Musa mengenai seorang suami dan istrinya, serta mengenai seorang ayah dan anak perempuannya yang masih muda dan tinggal di rumah ayahnya.[a]
  to: Itulah ketetapan-ketetapan yang Yahweh perintahkan kepada Musa mengenai seorang suami dan istrinya, serta mengenai seorang ayah dan anak perempuannya pada masa mudanya di rumah ayahnya.[a]
  rationale: Revisi menghapus verba “tinggal,” yang tidak dinyatakan dalam bahasa Ibrani, dan mengembalikan unsur temporal serta lokatif sebagai “pada masa mudanya di rumah ayahnya.” Bentuk aktif “yang Yahweh perintahkan kepada Musa” juga mempertahankan hubungan pelaku dan objek secara langsung dan alami. Catatan kaki tetap memberi alternatif harfiah untuk dua kali בֵּין (“antara”) tanpa mengubah makna teks utama.
