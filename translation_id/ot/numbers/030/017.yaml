base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: id
  text: Itulah ketetapan-ketetapan yang Yahweh perintahkan kepada Musa mengenai seorang suami dan istrinya, serta mengenai seorang ayah dan anak perempuannya pada masa mudanya di rumah ayahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “antara seorang laki-laki dan istrinya, dan antara seorang ayah dan anak perempuannya pada masa mudanya di rumah ayahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Itulah ketetapan-ketetapan
  rationale: Klausa nominal penutup ini merangkum ketentuan-ketentuan sebelumnya. Bentuk ulang 'ketetapan-ketetapan' mempertahankan jamak dan laras hukum.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: yang diperintahkan Yahweh kepada Musa
  rationale: Struktur pasif menghasilkan bahasa Indonesia yang alami dan tetap menyatakan Yahweh sebagai pemberi perintah serta Musa sebagai penerimanya.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: mengenai seorang suami dan istrinya
  rationale: בֵּין secara harfiah berarti 'antara', tetapi di sini menandai lingkup relasi yang diatur. Karena אִשְׁתּוֹ berarti 'istrinya', 'suami' memperjelas relasi perkawinan secara alami.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: serta mengenai seorang ayah dan anak perempuannya
  rationale: Mempertahankan kesejajaran dengan frasa sebelumnya dan istilah kekerabatan yang spesifik gender.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: yang masih muda dan tinggal di rumah ayahnya
  rationale: Mengungkapkan masa mudanya sekaligus keadaan berada dalam rumah tangga ayah. Kata 'tinggal' tersirat secara idiomatis oleh frasa lokatif, bukan dinyatakan sebagai verba dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Istilah relasional gender dalam konteks hukum
  choice: seorang suami dan istrinya; seorang ayah dan anak perempuannya
  alternative: seorang laki-laki dan istrinya; seorang ayah dan putrinya
  rationale: Terjemahan mempertahankan relasi dan gender yang dinyatakan teks. 'Suami' sesuai dengan hubungan yang ditunjukkan oleh 'istrinya', sedangkan 'anak perempuan' jelas dan umum.
- issue: Hubungan antara masa muda dan rumah ayah
  choice: yang masih muda dan tinggal di rumah ayahnya
  alternative: pada masa mudanya di rumah ayahnya
  rationale: Pilihan utama menyampaikan dua unsur teks tanpa menetapkan batas usia atau teori khusus tentang kewenangan ayah. Catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan laras ringkasan hukum. 'Itulah' cocok sebagai formula penutup yang menunjuk kembali kepada peraturan sebelumnya. Tanda catatan kaki ditempatkan langsung setelah bagian yang dijelaskannya.
