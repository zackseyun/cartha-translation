  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: id
  text: Jika suaminya mendengar tentang hal itu dan tidak mengatakan apa-apa kepadanya serta tidak membatalkan nazarnya, maka semua nazarnya tetap berlaku, dan setiap kewajiban mengikat yang dikenakannya pada dirinya sendiri tetap berlaku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַע
  choice: Jika ... mendengarnya
  rationale: Dalam gaya hukum kasuistik, bentuk ini meneruskan syarat dari konteks. Bahasa Indonesia secara alami menyatakannya dengan "jika".
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks hukum tentang perempuan yang telah menikah, אִישׁ dengan sufiks feminin tunggal berarti suaminya.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: tetapi tidak mengatakan apa-apa kepadanya
  rationale: Ungkapan ini berarti tetap diam sebagai tanggapan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan arti hukum dari sikap diam tersebut.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: tidak membatalkan nazarnya
  rationale: Bentuk harfiahnya berobjek perempuan itu, tetapi dalam konteks yang dibatalkan adalah kekuatan hukum nazarnya atau kewajibannya. Objek tersirat dibuat eksplisit demi kejelasan.
- source_word: וְקָמוּ
  choice: tetap berlaku
  rationale: Dalam konteks hukum, קום menyatakan bahwa sesuatu tetap sah atau berkekuatan. "Tetap berlaku" lebih jelas dalam bahasa Indonesia daripada terjemahan metaforis "berdiri".
- source_word: כָּל נְדָרֶיהָ
  choice: semua nazarnya
  rationale: נדר adalah nazar, yaitu janji khidmat yang mengikat di hadapan Allah; bentuk jamak bersufiks diterjemahkan secara alami sebagai "semua nazarnya".
- source_word: וְכָל אִסָּר
  choice: dan setiap kewajiban mengikat
  rationale: אִסָּר menunjuk pada ikatan atau larangan yang dikenakan pada diri sendiri. "Kewajiban mengikat" mempertahankan unsur legal dan daya ikatnya.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: yang dikenakannya pada dirinya sendiri
  rationale: Ungkapan Ibrani secara metaforis berarti mengikat sesuatu atas diri sendiri. "Dikenakannya pada dirinya sendiri" menyampaikan maksud idiomatisnya dengan jelas dan tetap dekat pada gagasan pembebanan diri.
- source_word: יָקוּם
  choice: tetap berlaku
  rationale: Pengulangan frasa ini mempertahankan paralelisme dan menegaskan bahwa kewajiban tersebut terus mempunyai kekuatan hukum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum bersyarat dipertahankan, sementara idiom Ibrani dijernihkan tanpa menambahkan tafsiran denominasi. Tidak diperlukan catatan kaki karena objek tersirat pada לֹא הֵנִיא אֹתָהּ telah dinyatakan secara wajar dalam teks sebagai "nazarnya".
