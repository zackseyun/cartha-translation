  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: id
  text: Musa berkata kepada bani Israel[a] sesuai dengan segala sesuatu yang telah Yahweh perintahkan kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani ini merupakan sebutan umum bagi bani atau umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk dasar verba ini berarti “berkata”. Karena ayat ini merangkum penyampaian Musa tanpa kutipan langsung, “berkata kepada” tetap wajar dan tidak menambahkan gagasan yang tidak dinyatakan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan Ibrani ini secara harfiah berarti “anak-anak lelaki Israel”, tetapi berfungsi sebagai sebutan kebangsaan yang baku bagi umat Israel. “Bani Israel” mempertahankan corak genealogis dan komunal ungkapan tersebut tanpa memberi kesan keliru bahwa hanya laki-laki yang dimaksud.
- source_word: כְּכֹל אֲשֶׁר
  choice: sesuai dengan segala sesuatu yang
  rationale: Prefiks כְּ menyatakan kesesuaian atau kecocokan. Terjemahan ini mempertahankan makna “sesuai dengan”, bukan sekadar menyatakan isi perkataan.
- source_word: צִוָּה
  choice: telah diperintahkan
  rationale: Bentuk perfektif menunjuk pada perintah Yahweh yang mendahului penyampaian Musa. “Telah” membuat urutan itu jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: Musa adalah penerima perintah. Bahasa Indonesia secara alami memakai konstruksi pasif “diperintahkan ... kepada Musa”, sambil mempertahankan penyebutan nama Musa yang diulangi dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan sebutan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak lelaki Israel atau orang Israel
  rationale: Dalam konteks ini ungkapan maskulin tersebut merupakan sebutan kolektif bagi umat Israel. “Bani Israel” mempertahankan bentuk tradisional-genealogis tanpa membatasi rujukannya hanya pada laki-laki; bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. “Bani Israel” dipilih sebagai sebutan kolektif yang dikenal luas; susunan kalimat mempertahankan pengulangan nama Musa dan nuansa kesesuaian dalam כְּכֹל אֲשֶׁר.
