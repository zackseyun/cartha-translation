  to: Namun, jika suaminya sungguh-sungguh membatalkan semua itu pada hari ia mendengarnya, maka segala yang diucapkan perempuan itu—baik nazarnya maupun kewajiban yang mengikat dirinya—tidak akan berlaku. Suaminya telah membatalkan semua itu, dan Yahweh akan mengampuninya.[a]
