  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: id
  text: Namun, jika suaminya sungguh-sungguh membatalkan semua itu pada hari ia mendengarnya, maka segala yang diucapkan perempuan itu—baik nazarnya maupun kewajiban yang mengikat dirinya—tidak akan berlaku. Suaminya telah membatalkan semua itu, dan Yahweh akan mengampuninya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “kewajiban yang mengikat dirinya” secara harfiah berarti “ikatan atas dirinya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menyatakan syarat yang berkontras dengan perkara sebelumnya dan tetap wajar dalam bahasa Indonesia.
- source_word: הָפֵר יָפֵר
  choice: sungguh-sungguh membatalkan
  rationale: Konstruksi infinitif absolut dengan bentuk finit menegaskan tindakan pembatalan; pengulangan adverbial ini mempertahankan penekanan Ibrani secara alami.
- source_word: אֹתָם
  choice: semuanya
  rationale: Mengacu secara kolektif kepada nazar dan ikatan kewajiban perempuan itu.
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks hukum perkawinan, inilah padanan idiomatis dan tepat.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: pada hari ia mendengarnya
  rationale: Mempertahankan batas waktu hukum yang dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: segala yang diucapkan perempuan itu
  rationale: Secara harfiah berarti 'segala yang keluar dari bibirnya'; pilihan ini menyampaikan cakupan semua komitmen lisannya dalam bahasa Indonesia yang alami.
- source_word: לִנְדָרֶיהָ
  choice: nazarnya
  rationale: Padanan baku נדר dalam konteks hukum-keagamaan.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: ikatan yang dikenakannya pada dirinya sendiri
  rationale: Mempertahankan gagasan kewajiban yang mengikat diri tanpa mempersempitnya menjadi jenis pantangan tertentu.
- source_word: לֹא יָקוּם
  choice: tidak akan berlaku
  rationale: Menyampaikan idiom hukum bahwa komitmen itu tidak tetap sah atau berkekuatan.
- source_word: הֲפֵרָם
  choice: telah membatalkan semuanya
  rationale: Bentuk perfektif merangkum tindakan suami yang menghasilkan keadaan hukum tersebut.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH secara langsung dan transparan dalam bahasa Indonesia.
- source_word: יִסְלַח לָהּ
  choice: akan mengampuninya
  rationale: Padanan langsung yang mempertahankan pernyataan pengampunan ilahi tanpa menjelaskan lebih jauh dasar atau cakupannya.
theological_decisions:
- issue: Makna pengampunan setelah nazar dibatalkan
  choice: 'Mempertahankan urutan teks: nazar dibatalkan, tidak berlaku, dan Yahweh mengampuni perempuan itu.'
  alternative: Menjelaskan bahwa pengampunan khusus diberikan karena kegagalan memenuhi nazar, atau karena kecerobohan ketika bernazar.
  rationale: Teks menyatakan pengampunan tetapi tidak merinci dengan pasti apakah objeknya adalah kegagalan memenuhi nazar, kecerobohan saat bernazar, atau pertanggungjawaban lain; terjemahan tidak menyelesaikan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum “membatalkan” dan “tidak akan berlaku” dipilih agar hubungan hukum antarklausa jelas, sedangkan “segala yang diucapkan” menghindari ungkapan harfiah yang kaku.
