  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: id
  text: Setiap nazar dan setiap sumpah yang mengikat untuk menyangkal diri[a], suaminya akan meneguhkannya atau suaminya akan membatalkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merendahkan diri.” Secara harfiah, “menindas jiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: nazar
  rationale: Dalam konteks hukum dan ibadah, נֵדֶר menunjuk pada janji khidmat yang diucapkan kepada Allah; “nazar” merupakan padanan Indonesia yang tepat dan lazim dalam konteks Alkitab.
- source_word: שְׁבֻעַת אִסָּר
  choice: sumpah yang mengikat
  rationale: Frasa ini memadukan sumpah dengan kewajiban atau ikatan yang membatasi; bentuk relatif ini alami dalam bahasa Indonesia sekaligus mempertahankan daya mengikatnya.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: untuk merendahkan diri
  rationale: Ungkapan Ibrani ini secara harfiah berbicara tentang ‘menindas jiwa/diri’, tetapi secara idiomatis menunjuk pada tindakan merendahkan atau menyangkal diri, sering kali melalui puasa. Pilihan ini jelas dan alami tanpa membatasi ungkapan hanya pada puasa.
- source_word: נָפֶשׁ
  choice: diri
  rationale: Dalam ungkapan ini נֶפֶשׁ mengacu pada diri atau pribadi, bukan semata-mata ‘jiwa’ sebagai unsur terpisah dari tubuh.
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Konteks hukum perkawinan memastikan bahwa אִישׁ dengan sufiks orang ketiga feminin tunggal berarti ‘suaminya’.
- source_word: יְקִימֶנּוּ
  choice: dapat diteguhkan
  rationale: Bentuk Hifil dari קום berarti membuat nazar itu tetap berlaku atau sah. Bentuk pasif dengan pelaku ‘oleh suaminya’ menjaga kesejajaran alami dengan klausa berikutnya.
- source_word: יְפֵרֶנּוּ
  choice: dapat dibatalkan
  rationale: Bentuk Hifil dari פרר dalam hukum nazar berarti membuatnya tidak berlaku; ‘dibatalkan’ menyampaikan akibat hukumnya secara jelas.
- source_word: כָּל ... וְכָל
  choice: Setiap ... dan setiap ...
  rationale: Pengulangan ‘setiap’ mempertahankan cakupan distributif dan menyeluruh dari kedua כָּל.
theological_decisions:
- issue: Cakupan ungkapan לְעַנֹּת נָפֶשׁ
  choice: merendahkan diri
  alternative: menyangkal diri; menindas jiwa
  rationale: Teks tidak menentukan bentuk khusus seperti puasa. Terjemahan utama mempertahankan keluasan makna, sedangkan arti harfiah dan alternatif idiomatis dicatat dalam catatan kaki.
- issue: Modalitas wewenang suami
  choice: dapat diteguhkan ... atau dibatalkan
  alternative: akan meneguhkan ... atau akan membatalkan
  rationale: Bentuk imperfek dalam konteks hukum menyatakan tindakan yang berada dalam kewenangan suami, bukan ramalan bahwa ia pasti melakukan salah satunya; ‘dapat’ menyampaikan fungsi legal tersebut tanpa menambahkan kewajiban moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “nazar” dipertahankan karena tepat untuk konteks hukum keagamaan. Susunan pasif menghasilkan kesejajaran yang wajar dan menghindari pengulangan subjek yang terasa berat.
