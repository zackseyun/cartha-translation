  to: Apabila seorang laki-laki bernazar kepada Yahweh atau bersumpah untuk mengikat dirinya dengan suatu kewajiban[a], ia tidak boleh melanggar perkataannya[b]. Ia harus melakukan segala sesuatu sesuai dengan yang telah diucapkannya.
  rationale: Revisi terbatas pada klausa terakhir untuk menyampaikan idiom Ibrani secara alami dalam bahasa Indonesia sambil mempertahankan tuntutan untuk melaksanakan seluruh isi ucapannya. Catatan a diperjelas agar lebih akurat mencerminkan kewajiban yang dikenakan atas diri sendiri. Tidak ada perubahan teologis atau doktrinal.
