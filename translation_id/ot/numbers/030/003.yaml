review_pass:
  verdict: revise
  source_fidelity: 'Makna pokoknya setia kepada Ibrani: subjek maskulin dipertahankan, nama Yahweh tepat, dan kewajiban untuk memenuhi ucapan sendiri tersampaikan. Namun, frasa penutup "melakukan segala sesuatu yang telah keluar dari mulutnya" tidak wajar secara idiomatis dalam bahasa Indonesia dan dapat terbaca seolah-olah ia harus melakukan benda-benda yang keluar dari mulutnya. Konstruksi Ibrani bermakna melakukan/menepati segala sesuatu sesuai dengan yang telah diucapkannya.'
  naturalness: Bahasa dan register hukum umumnya baik. Penyesuaian pada klausa terakhir diperlukan agar tetap formal dan dekat dengan sumber tanpa menghasilkan gambaran yang tidak idiomatis. Catatan a juga dapat dibuat lebih tepat dengan membedakan tindakan "mengikat" dari kewajiban yang dikenakan atas diri sendiri.
  terminology: '"Bernazar," "bersumpah," "Yahweh," dan "melanggar perkataannya" sesuai konteks hukum-keagamaan. "Kewajiban" merupakan padanan yang baik bagi אִסָּר. Catatan b secara tepat mempertahankan arti harfiah medan makna חלל.'
  issues:
  - severity: medium
    issue: Klausa terakhir diterjemahkan terlalu harfiah dan tidak idiomatis
    rationale: '"Ia harus melakukan segala sesuatu yang telah keluar dari mulutnya" tidak menyatakan hubungan "sesuai dengan" yang ditandai כְּכָל dan kurang alami dalam bahasa Indonesia. "Ia harus melakukan segala sesuatu sesuai dengan yang telah diucapkannya" mempertahankan daya hukum dan makna sumber.'
  - severity: low
    issue: Catatan kaki a kurang tepat dalam mengungkapkan konstruksi refleksif
    rationale: '"untuk mengikat suatu ikatan atas dirinya" dapat diterima, tetapi "untuk mengenakan suatu kewajiban yang mengikat atas dirinya" lebih jelas menyatakan bahwa kewajiban itu dikenakan pada diri sendiri, tanpa mengubah makna.'
  revised_text: Apabila seorang laki-laki bernazar kepada Yahweh atau bersumpah untuk mengikat dirinya dengan suatu kewajiban[a], ia tidak boleh melanggar perkataannya[b]. Ia harus melakukan segala sesuatu sesuai dengan yang telah diucapkannya.
