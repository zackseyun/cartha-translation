  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: id
  text: Apabila seorang laki-laki bernazar kepada Yahweh atau bersumpah untuk mengikat dirinya dengan suatu kewajiban[a], ia tidak boleh melanggar perkataannya[b]. Ia harus melakukan segala sesuatu sesuai dengan yang telah diucapkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk mengenakan suatu kewajiban yang mengikat atas dirinya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia tidak boleh menajiskan perkataannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan nomina maskulin tunggal dalam rumusan hukum sumber.
- source_word: יִדֹּר נֶדֶר
  choice: bernazar
  rationale: Konstruksi verba dan nomina serumpun dinyatakan dengan verba Indonesia yang alami serta tetap memiliki bobot hukum-keagamaan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama perjanjian, bukan menggantinya dengan gelar.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: bersumpah
  rationale: Ungkapan Indonesia ini secara alami menyampaikan tindakan mengucapkan sumpah yang khidmat.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: untuk mengikat dirinya dengan suatu kewajiban
  rationale: Menyampaikan gagasan bahwa orang itu mengenakan kewajiban yang mengikat atas dirinya sendiri, sekaligus mencerminkan pengulangan akar אסר tanpa menghasilkan frasa Indonesia yang janggal.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: ia tidak boleh melanggar perkataannya
  rationale: Dalam konteks ini bentuk Hifil dari חלל berarti memperlakukan perkataan sebagai tidak kudus, yaitu melanggar atau mengingkarinya. 'Melanggar perkataannya' jelas dan sesuai dengan nuansa hukum.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: Ia harus melakukan segala sesuatu yang telah keluar dari mulutnya
  rationale: Mempertahankan gambaran konkret Ibrani tentang perkataan yang keluar dari mulut, sambil menyatakan kewajibannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama ilahi.
- issue: Makna sakral לֹא יַחֵל דְּבָרוֹ
  choice: tidak boleh melanggar perkataannya
  alternative: tidak boleh menajiskan perkataannya
  rationale: Terjemahan utama menyampaikan daya wajib ungkapan dalam konteks hukum, sedangkan catatan kaki mempertahankan medan makna harfiahnya yang berkaitan dengan penajisan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat. Struktur konkret 'keluar dari mulutnya' dipertahankan untuk menjaga citra bahasa sumber; 'harus' dipakai untuk menyatakan kewajiban hukum dengan jelas.
