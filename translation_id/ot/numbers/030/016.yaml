  naturalness: Kalimatnya pada dasarnya baku dan jelas. “Nazar-nazar atau ikatan-ikatan itu” membuat rujukan objek lebih jelas dan lebih alami daripada “semuanya,” sambil tetap mencerminkan dua kategori yang dirujuk konteks dekat.
  terminology: “Membatalkan,” “nazar,” “ikatan,” dan “menanggung kesalahan perempuan itu” sesuai dengan register hukum-keagamaan dan tidak memaksakan rincian tentang jenis tanggungan. Catatan alternatif perlu mengulang “perempuan itu” agar rujukan posesif tidak kabur.
