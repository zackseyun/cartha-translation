  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: id
  text: Namun, jika ia sungguh-sungguh membatalkan nazar-nazar atau ikatan-ikatan itu sesudah ia mendengarnya[a], ia harus menanggung kesalahan perempuan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sesudah ia mendengar”; dalam konteks ini, yang didengar ialah nazar-nazar atau ikatan-ikatan itu.
    reason: clarification
  - marker: b
    text: “Menanggung kesalahan perempuan itu” juga dapat dipahami sebagai “menanggung tanggung jawab atas kesalahan perempuan itu” atau “menanggung hukuman akibat kesalahan perempuan itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Dalam konteks hukum ayat sebelumnya, waw memperkenalkan keadaan yang berlawanan; 'Namun, jika' menyampaikan kontras itu secara alami.
- source_word: הָפֵר יָפֵר
  choice: benar-benar membatalkan
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan pada tindakan. 'Benar-benar membatalkan' mempertahankan tekanan itu dan sesuai dengan konteks pembatalan nazar.
- source_word: אֹתָם
  choice: semuanya
  rationale: Pronomina jamak maskulin mengacu kembali pada nazar-nazar atau ikatan-ikatan perempuan tersebut. 'Semuanya' menyatakan acuan jamak secara wajar dalam bahasa Indonesia tanpa mengulang nomina.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: sesudah ia mendengarnya
  rationale: Ungkapan ini menunjukkan bahwa pembatalan terjadi setelah sang suami mendengar nazar-nazar itu; bentuk enklitik '-nya' secara alami mengacu kepada hal-hal yang telah diucapkan.
- source_word: וְנָשָׂא
  choice: ia harus menanggung
  rationale: Dalam konteks hukum-moral, נשׂא menyatakan kewajiban menanggung kesalahan atau akibatnya. 'Harus' menyampaikan daya normatif bentuk tersebut secara alami.
- source_word: עֲוֺנָהּ
  choice: kesalahan perempuan itu
  rationale: עָוֹן dapat mencakup kesalahan, tanggung jawab, maupun akibat hukumannya. Terjemahan ini mempertahankan ungkapan hukum-moral tanpa menentukan secara sempit mekanisme pemidanaannya.
theological_decisions:
- issue: Makna menanggung kesalahan dalam konteks hukum
  choice: Sang suami menanggung kesalahan perempuan itu karena ia membatalkan nazar-nazarnya setelah mendengarnya.
  alternative: Ia menanggung tanggung jawab atas kesalahan perempuan itu atau hukuman yang timbul darinya.
  rationale: Idiom נשׂא עון dapat menunjuk pada menanggung kesalahan, tanggung jawab, atau akibat hukumannya. Teks utama mempertahankan keluasan makna tersebut, sedangkan catatan kaki menyebutkan alternatif tanpa memaksakan satu mekanisme teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kontras bersyarat, penegasan Ibrani pada tindakan pembatalan, serta ketegangan makna idiom hukum-moral tanpa memasukkan tafsiran denominasi tertentu.
