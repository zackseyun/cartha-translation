base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: id
  text: Namun, jika suaminya tetap diam dari hari ke hari, ia meneguhkan semua nazarnya atau semua kewajibannya[a] yang berlaku atas dirinya; ia telah meneguhkan semuanya, karena ia diam pada hari ia mendengarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua janji yang mengikatnya.” Istilah Ibrani ini menunjuk pada komitmen yang mengikat orang yang mengucapkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: tetap diam
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan diam yang berlanjut. Dalam konteks hukum ini, diam berarti tidak menyatakan keberatan.
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks peraturan perkawinan, אִישׁ dengan sufiks orang ketiga feminin tunggal secara alami berarti 'suaminya'.
- source_word: מִיּוֹם אֶל יוֹם
  choice: dari hari ke hari
  rationale: Ungkapan ini mempertahankan bentuk idiom Ibrani dan menunjukkan bahwa sang suami terus diam hingga hari-hari berikutnya.
- source_word: וְהֵקִים
  choice: ia meneguhkan
  rationale: 'Bentuk Hifil dari קום di sini mempunyai daya hukum: membuat nazar tetap berlaku atau berdiri.'
- source_word: נְדָרֶיהָ
  choice: semua nazar istrinya
  rationale: נדר secara baku menunjuk pada nazar; penyebutan 'istrinya' menghindari rangkaian pronomina yang kurang alami dalam bahasa Indonesia.
- source_word: אֱסָרֶיהָ
  choice: semua ikatan janji
  rationale: Nomina dari akar אסר, 'mengikat', dalam pasal ini menunjuk pada janji atau komitmen yang mengikat orang yang mengucapkannya.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: yang berlaku atas istrinya
  rationale: Ungkapan ini mempertahankan metafora hukum tentang kewajiban yang berada 'atas' seseorang, sambil tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: הֵקִים אֹתָם
  choice: ia telah meneguhkan semuanya
  rationale: Bentuk perfektif merangkum akibat hukum dari sikap diam sebelumnya; 'telah' menandai hasil yang sudah berlaku.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini bersifat kausal dan menjelaskan dasar mengapa nazar serta ikatan janji itu diteguhkan.
- source_word: הֶחֱרִשׁ לָהּ
  choice: ia diam
  rationale: Bahasa Indonesia tidak memerlukan padanan harfiah bagi לָהּ di sini; konteks sudah jelas bahwa diamnya ditujukan terhadap perkara yang disampaikan istrinya.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: pada hari ia mendengarnya
  rationale: Terjemahan ini mempertahankan rumusan waktu hukum yang berulang dalam pasal tersebut; objek tersirat dibuat eksplisit dengan '-nya' secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang bermartabat. Pengulangan 'meneguhkan' dipertahankan karena merupakan penekanan penting dalam teks Ibrani. Tidak ada penanda catatan kaki karena alternatif leksikal untuk אֱסָרֶיהָ sudah diwakili secara transparan oleh 'ikatan janji'.
