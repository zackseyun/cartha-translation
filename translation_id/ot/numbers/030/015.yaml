  to: Namun, jika suaminya tetap diam dari hari ke hari, ia meneguhkan semua nazarnya atau semua kewajibannya[a] yang berlaku atas dirinya; ia telah meneguhkan semuanya, karena ia diam pada hari ia mendengarnya.
