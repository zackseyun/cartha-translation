  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: id
  text: Namun, jika ayahnya melarang dia pada hari ayahnya mendengar tentang hal itu, tidak satu pun dari nazarnya atau kewajiban-kewajiban mengikat yang dibebankannya atas dirinya sendiri akan tetap berlaku[a]. TUHAN akan mengampuninya, karena ayahnya telah melarang dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak akan berdiri,” yaitu tidak akan dipertahankan sebagai sesuatu yang mengikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Mengungkapkan syarat yang berlawanan dengan kemungkinan pada konteks sebelumnya, dengan bahasa Indonesia yang alami.
- source_word: הֵנִיא אָבִיהָ אֹתָהּ
  choice: ayahnya melarang dia
  rationale: Mempertahankan perempuan itu sebagai objek langsung, sebagaimana dalam bahasa Ibrani. Dalam konteks hukum nazar, tindakan melarang ini membuat nazar atau ikatannya tidak berlaku.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: pada hari ayahnya mendengar tentang hal itu
  rationale: Mempertahankan batas waktu yang tegas dalam teks Ibrani dan memperjelas subjek pronominal bagi pembaca Indonesia.
- source_word: כָּל נְדָרֶיהָ
  choice: tidak satu pun dari nazarnya
  rationale: Negasi pada predikat mencakup seluruh nazar; susunan ini menyampaikan cakupan tersebut secara jelas dan alami dalam bahasa Indonesia.
- source_word: וֶאֱסָרֶיהָ אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: ikatan yang dikenakannya pada dirinya sendiri
  rationale: Istilah אֱסָר menunjuk pada kewajiban yang mengikat diri, khususnya dalam konteks nazar. Pilihan ini mempertahankan citra mengikat dan sifat kewajiban yang dipikul sendiri.
- source_word: לֹא יָקוּם
  choice: tidak akan tetap berlaku
  rationale: 'Menyampaikan idiom hukum harfiah ''tidak akan berdiri'': nazar dan ikatan itu tidak dipertahankan sebagai kewajiban yang sah.'
- source_word: וַיהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian יהוה, dengan huruf kapital.
- source_word: יִסְלַח לָהּ
  choice: akan mengampuninya
  rationale: Padanan langsung dan wajar untuk tindakan pengampunan ilahi, tanpa menentukan lebih jauh sifat kesalahan yang diampuni.
- source_word: כִּי
  choice: karena
  rationale: Menandai alasan yang dinyatakan teks bagi pengampunan itu.
theological_decisions:
- issue: Makna pengampunan ilahi ketika nazar tidak berlaku karena larangan ayah
  choice: Mempertahankan pernyataan bahwa TUHAN mengampuni perempuan itu karena ayahnya melarang dia, tanpa memperluas atau mempersempit jenis kesalahannya.
  alternative: Menjelaskan bahwa ia secara khusus diampuni dari dosa karena tidak memenuhi nazar yang telah dibatalkan.
  rationale: Teks menempatkan pengampunan dalam konteks hukum nazar, tetapi tidak menguraikan secara eksplisit sifat atau cakupan kesalahan tersebut. Terjemahan menjaga ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tetap mudah dipahami. Pengulangan “ayahnya” dipertahankan untuk menghindari ketidakjelasan rujukan kata ganti. Istilah “nazar” dipakai karena sudah umum dalam bahasa Alkitab dan keagamaan Indonesia; “ikatan” mempertahankan metafora Ibrani tentang kewajiban yang mengikat diri.
