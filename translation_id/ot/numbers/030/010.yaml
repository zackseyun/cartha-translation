  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: id
  text: Adapun nazar seorang janda atau perempuan yang telah diceraikan—segala sesuatu yang dengannya ia mengikat dirinya—akan tetap mengikatnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “akan berdiri atasnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: nazar
  rationale: Dalam konteks hukum dan ibadah, istilah ini menunjuk pada janji khidmat kepada Allah; “nazar” merupakan padanan baku dan tepat dalam bahasa Indonesia Alkitabiah.
- source_word: אַלְמָנָה
  choice: janda
  rationale: Padanan langsung dan alami bagi perempuan yang suaminya telah meninggal.
- source_word: גְרוּשָׁה
  choice: perempuan yang telah diceraikan
  rationale: Bentuk partisip pasif menunjuk pada perempuan yang diceraikan; frasa ini jelas dan mempertahankan sudut pandang pasif teks sumber.
- source_word: כֹּל אֲשֶׁר
  choice: segala sesuatu yang dengannya
  rationale: Mempertahankan cakupan menyeluruh frasa Ibrani dan menghubungkannya secara alami dengan tindakan mengikat diri.
- source_word: אָסְרָה
  choice: ia mengikat
  rationale: Mempertahankan metafora dasar “mengikat” sekaligus menyampaikan tindakan menempatkan diri di bawah suatu kewajiban.
- source_word: עַל נַפְשָׁהּ
  choice: dirinya
  rationale: Secara harfiah berarti “atas jiwanya/dirinya”; bentuk refleksif ini alami dalam bahasa Indonesia dan menyatakan kewajiban yang dikenakan pada diri sendiri.
- source_word: יָקוּם
  choice: tetap
  rationale: Dalam konteks hukum, verba ini berarti berdiri, berlaku, atau tetap sah; “tetap” menyampaikan keberlangsungan dan keabsahan kewajiban secara alami.
- source_word: עָלֶיהָ
  choice: mengikatnya
  rationale: Dalam konteks kewajiban, preposisi ini menyatakan bahwa beban kewajiban berlaku atas orang tersebut; “mengikatnya” jelas secara hukum dan idiomatis dalam bahasa Indonesia.
