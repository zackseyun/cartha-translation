base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: id
  text: Lalu Musa berkata kepada para kepala suku bani Israel[a], “Inilah firman yang Yahweh perintahkan[b]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan ungkapan yang lebih umum, “orang Israel.” Secara harfiah, bahasa Ibrani memakai ungkapan “anak-anak lelaki/keturunan Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih idiomatis, “Inilah yang Yahweh perintahkan.” Secara harfiah, bahasa Ibrani berbunyi “Inilah firman yang Yahweh perintahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berbicara
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia, sedangkan “berbicara” mempertahankan verba sumber tanpa mereduksinya menjadi sekadar “berkata”.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: para kepala suku
  rationale: רָאשֵׁי secara harfiah berarti “kepala-kepala” dan dalam konteks ini menunjuk para pemimpin, sedangkan מַטּוֹת menunjuk suku-suku Israel. Ungkapan Indonesia “para kepala suku” alami sekaligus mempertahankan metafora dan tatanan sosial teks.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini secara formal berarti “anak-anak lelaki/keturunan Israel.” “Bani Israel” merupakan ungkapan Indonesia yang ringkas dan dikenal luas untuk umat keturunan Israel, serta mempertahankan nuansa genealogis-kovenantal tanpa memberi kesan bahwa yang dimaksud hanya anak-anak secara usia.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif ini memperkenalkan kutipan langsung. “Katanya” menjalankan fungsi tersebut dengan wajar dalam narasi Indonesia.
- source_word: זֶה הַדָּבָר
  choice: Inilah firman
  rationale: דָּבָר dapat berarti “firman,” “perkataan,” “hal,” atau “perkara.” Karena frasa ini memperkenalkan perintah ilahi, “firman” mempertahankan bobot ujaran berotoritas, sementara catatan kaki menyediakan padanan idiomatis yang lebih umum.
- source_word: צִוָּה
  choice: perintahkan
  rationale: Bentuk perfektif menyatakan tindakan memerintah yang sudah dilakukan. Dalam konstruksi relatif bahasa Indonesia, “yang Yahweh perintahkan” ringkas, alami, dan tetap menyampaikan bahwa Musa sedang meneruskan perintah ilahi tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar.
- issue: Ungkapan genealogis-kovenantal בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel atau anak-anak Israel
  rationale: “Bani Israel” mempertahankan gagasan keturunan Israel dan cakupan kolektif umat itu. “Anak-anak Israel” dapat disalahpahami sebagai anak kecil, sedangkan “orang Israel” menghilangkan metafora kekerabatannya.
- issue: Makna דָּבָר dalam formula perintah ilahi
  choice: firman
  alternative: hal atau apa
  rationale: “Firman” mempertahankan dimensi verbal dan otoritatif דָּבָר. Karena kata sumber juga dapat berarti “hal/perkara,” alternatif idiomatis dicantumkan dalam catatan kaki agar rentang maknanya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Para kepala suku” serta “bani Israel” dipilih karena mudah dipahami sekaligus mempertahankan struktur sosial dan nuansa genealogis teks. Susunan kutipan dibuat alami tanpa menghilangkan formula pengantar ujaran ilahi.
