  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: id
  text: Jika seorang perempuan mengucapkan nazar[a] kepada Yahweh dan mengikatkan dirinya pada suatu kewajiban[b] di rumah ayahnya, pada masa mudanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menazarkan nazar.” Bahasa Ibrani memakai kata kerja dan kata benda yang serumpun untuk menegaskan tindakan resmi mengucapkan nazar.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mengikatkan dirinya dengan suatu ikrar yang mengikat.” Bahasa Ibrani memakai kata kerja dan kata benda yang serumpun untuk menyatakan bahwa seseorang menempatkan dirinya di bawah suatu ikrar yang mengikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: Jika seorang perempuan
  rationale: Dalam rangkaian hukum kasuistik, כִּי memperkenalkan suatu keadaan bersyarat. Bahasa Indonesia alami tidak perlu mempertahankan וְ sebagai “dan” pada awal kalimat.
- source_word: תִדֹּר נֶדֶר
  choice: mengucapkan nazar
  rationale: Konstruksi verba-nomina serumpun menekankan tindakan resmi bernazar. “Mengucapkan nazar” menyampaikan tindakan itu secara alami dan bermartabat dalam bahasa Indonesia; bentuk sumber dijelaskan dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi לְ menyatakan pihak yang menjadi tujuan nazar, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: וְאָסְרָה אִסָּר
  choice: dan mengikat dirinya dengan suatu kewajiban
  rationale: Verba אָסַר bersama nomina serumpun אִסָּר menyatakan bahwa perempuan itu menempatkan dirinya di bawah kewajiban yang mengikat. Terjemahan ini mempertahankan unsur refleksif dan membedakannya dari נֶדֶר.
- source_word: בְּבֵית אָבִיהָ
  choice: di rumah ayahnya
  rationale: Terjemahan lokatif langsung yang mempertahankan lingkungan rumah tangga yang menjadi latar ketentuan hukum ini.
- source_word: בִּנְעֻרֶיהָ
  choice: semasa mudanya
  rationale: Frasa ini menunjuk pada masa muda perempuan tersebut tanpa menambahkan secara eksplisit status perkawinan atau rincian hukum yang hanya tersirat oleh konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankannya sebagai nama diri ilahi tanpa menggantinya dengan gelar.
- issue: Status perempuan semasa mudanya di rumah ayahnya
  choice: Tidak menambahkan keterangan “belum menikah” atau “di bawah wewenang ayahnya”
  alternative: ketika ia masih muda dan belum menikah di bawah wewenang ayahnya
  rationale: Konteks hukum dapat menyiratkan status tersebut, tetapi ayat ini sendiri hanya menyebut masa mudanya dan keberadaannya di rumah ayahnya. Terjemahan utama mempertahankan batas informasi eksplisit teks.
translation_notes:
  register: Bahasa hukum yang jelas, modern, dan bermartabat. Susunan klausa mengikuti alur sumber, tetapi ungkapan serumpun yang janggal dalam bahasa Indonesia dialihkan secara idiomatis dan dijelaskan melalui catatan kaki. Tanda koma akhir dipertahankan karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya.
