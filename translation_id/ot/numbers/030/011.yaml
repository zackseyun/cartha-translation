  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: id
  text: Dan jika di rumah suaminya ia mengucapkan nazar atau mengikat dirinya pada suatu kewajiban dengan sumpah,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mengikatkan suatu ikatan atas dirinya dengan sumpah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Gabungan kata penghubung dan partikel bersyarat meneruskan rangkaian ketentuan hukum sekaligus memperkenalkan kasus berikutnya.
- source_word: בֵּית אִישָׁהּ
  choice: di rumah suaminya
  rationale: Menerjemahkan frasa konstruksi secara alami sambil mempertahankan latar tempat dan rumah tangga perkawinan.
- source_word: נָדָרָה
  choice: ia mengucapkan nazar
  rationale: Kata kerja ini menyatakan tindakan membuat nazar; 'mengucapkan nazar' jelas, wajar, dan sesuai dengan konteks hukum-keagamaan.
- source_word: אוֹ
  choice: atau
  rationale: Mempertahankan hubungan disjungtif antara dua tindakan hukum yang berkaitan.
- source_word: אָסְרָה אִסָּר
  choice: mengikat dirinya pada suatu kewajiban
  rationale: Konstruksi serumpun kata kerja–kata benda menekankan tindakan menempatkan diri di bawah suatu ikatan atau kewajiban. Rumusan ini menyampaikan daya ikat hukumnya tanpa meniru pengulangan Ibrani secara kaku.
- source_word: עַל נַפְשָׁהּ
  choice: dirinya
  rationale: Dalam ungkapan ini נֶפֶשׁ menunjuk kepada pribadi atau diri orang tersebut, bukan secara sempit kepada 'jiwa'.
- source_word: בִּשְׁבֻעָה
  choice: dengan sumpah
  rationale: Preposisi menunjukkan sarana atau keadaan yang menyertai; terjemahan ini mempertahankan sifat resmi dan bersumpah dari kewajiban tersebut.
theological_decisions: []
