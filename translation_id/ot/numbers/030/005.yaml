  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: id
  text: Jika ayahnya mendengar nazarnya atau ikrar mengikat yang dibuatnya atas dirinya sendiri[a], dan ayahnya tidak mengatakan apa-apa kepadanya[b], maka semua nazarnya tetap berlaku, dan setiap ikrar mengikat yang dibuatnya atas dirinya sendiri tetap berlaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk “ikrar mengikat” berbeda dari istilah untuk “nazar”, meskipun keduanya berkaitan. Istilah ini dapat menunjuk pada kewajiban atau pembatasan yang dibuat seseorang atas dirinya sendiri.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ayahnya tetap diam terhadapnya.” Dalam konteks hukum ini, sikap diam itu menunjukkan tidak adanya keberatan; karena itu, nazar dan ikrarnya tetap berlaku.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: nazarnya / semua nazarnya
  rationale: Dalam konteks hukum dan ibadah, נֶדֶר menunjuk pada nazar. Istilah “nazar” merupakan padanan baku dalam bahasa Indonesia dan mempertahankan kaitannya dengan komitmen yang diucapkan di hadapan Allah.
- source_word: אִסָּר / אֱסָרָהּ
  choice: ikrar mengikat
  rationale: אִסָּר adalah komitmen atau pembatasan yang mengikat diri sendiri dan dibedakan dari נֶדֶר. “Ikrar mengikat” terdengar wajar dalam bahasa Indonesia sekaligus mempertahankan daya hukum dan pembedaan leksikal tersebut.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: yang dikenakannya pada dirinya sendiri
  rationale: Ungkapan Ibrani secara harfiah menggambarkan sesuatu yang diikatkan atau dikenakan atas diri sendiri. Terjemahan ini mempertahankan sifat refleksif dan sukarela tanpa menghasilkan susunan yang kaku.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: ayahnya tidak mengatakan apa-apa kepadanya
  rationale: Kata kerja ini berarti tetap diam. Rumusan ini alami dalam bahasa Indonesia dan tidak langsung mengganti tindakan diam itu dengan tafsiran hukumnya, yakni persetujuan atau tidak adanya keberatan.
- source_word: וְקָמוּ ... יָקוּם
  choice: tetap berlaku
  rationale: Dalam konteks hukum, קום berarti berdiri teguh atau tetap sah. “Tetap berlaku” menyampaikan kekuatan hukum ungkapan tersebut dengan jelas dan wajar.
- source_word: כָּל
  choice: semua / setiap
  rationale: “Semua” sesuai dengan bentuk jamak “nazar-nazarnya”, sedangkan “setiap” sesuai dengan ungkapan tunggal distributif mengenai ikrar yang mengikat.
- source_word: וְ
  choice: Jika ... dan ... maka
  rationale: Walaupun ayat diawali kata sambung “dan”, konteksnya melanjutkan rumusan hukum bersyarat dari ayat sebelumnya. Struktur “jika ... maka” menyatakan fungsi wacananya secara alami tanpa mengubah isi kasus hukum.
theological_decisions:
- issue: Makna hukum dari sikap diam ayah
  choice: Mempertahankan tindakan konkret “tidak mengatakan apa-apa” dalam teks utama
  alternative: Menerjemahkannya langsung sebagai “tidak menyatakan keberatan” atau “menyetujuinya”
  rationale: Teks Ibrani menyatakan bahwa ayah tetap diam; akibat hukumnya kemudian dinyatakan dengan nazar dan ikrar yang tetap berlaku. Terjemahan tidak menyamakan sikap diam secara eksplisit dengan persetujuan, sehingga urutan dan ketegangan hukum dalam sumber tetap terpelihara.
translation_notes:
  register: Bahasa yang dipakai modern, jelas, dan bermartabat. “Nazar” dipertahankan sebagai istilah ibadah yang lazim, sedangkan “ikrar mengikat” menjaga pembedaan istilah Ibrani tanpa memakai ungkapan hukum yang terlalu teknis. Pengulangan pada akhir ayat dipertahankan karena mencerminkan bentuk hukum dan penekanan teks sumber.
