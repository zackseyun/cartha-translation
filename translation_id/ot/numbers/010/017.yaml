base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: id
  text: Kemudian Kemah Suci dibongkar, dan keturunan Gersyon[a] serta keturunan Merari berangkat sambil mengangkut Kemah Suci[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Gersyon”; demikian juga dengan “keturunan Merari.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka mengangkut Kemah Suci setelah kemah itu dibongkar. Teks Ibrani mengulangi “Kemah Suci” tanpa secara eksplisit menyebut “bagian-bagiannya.”
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: dibongkar
  rationale: Bentuk Hofal dari ירד menggambarkan Kemah Suci dibuat turun dari keadaan terpasang. Dalam konteks perpindahan perkemahan, “dibongkar” merupakan ungkapan Indonesia yang alami; “diturunkan” lebih harfiah, tetapi dapat memberi kesan bahwa kemah hanya dipindahkan ke tempat yang lebih rendah.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן di sini menunjuk pada kemah tempat kudus Israel. “Kemah Suci” jelas, lazim, dan mudah dipahami dalam bahasa Indonesia modern, sekaligus membedakannya dari kemah biasa.
- source_word: וְנָסְעוּ
  choice: berangkat
  rationale: Dalam konteks perjalanan, נסע berarti membongkar perkemahan lalu mulai bergerak. “Berangkat” menyampaikan awal pergerakan dengan alami dalam bahasa Indonesia.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: keturunan Gersyon
  rationale: Secara harfiah frasa ini berarti “anak-anak lelaki Gersyon”, tetapi dalam konteks ini menunjuk pada kelompok kaum atau klan yang berasal darinya. “Keturunan Gersyon” alami dan tetap mempertahankan hubungan genealogis.
- source_word: וּבְנֵי מְרָרִי
  choice: keturunan Merari
  rationale: Sejajar dengan בְנֵי גֵרְשׁוֹן, frasa ini menunjuk pada kelompok keturunan Merari. Pilihan ini mempertahankan paralelisme sumber.
- source_word: נֹשְׂאֵי
  choice: sambil mengangkut
  rationale: Partisipel ini menggambarkan tindakan atau peran mereka ketika berangkat. “Sambil mengangkut” menghubungkannya secara wajar dengan verba utama dan cocok untuk benda-benda Kemah Suci yang dibawa dalam perjalanan.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Teks Ibrani mengulangi nomina yang sama. Walaupun konteks menunjukkan bahwa yang diangkut adalah bagian-bagian Kemah Suci setelah dibongkar, detail “bagian-bagian” tidak ditambahkan ke dalam teks utama.
