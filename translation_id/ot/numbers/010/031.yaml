  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: id
  text: Lalu Musa berkata, “Tolong, jangan tinggalkan kami, sebab engkau tahu tempat-tempat perkemahan kami di padang belantara, dan engkau akan menjadi mata bagi kami.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjadi mata bagi kami,” yaitu membantu menunjukkan jalan dan tempat berkemah berdasarkan pengetahuanmu tentang padang belantara.
    reason: Metafora Ibrani dipertahankan dalam teks utama dan dijelaskan agar maknanya mudah dipahami.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu berkatalah Musa
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Subjek tersirat diperjelas sebagai Musa berdasarkan konteks terdekat agar bahasa Indonesia alami tanpa mengubah rujukannya.
- source_word: אַל נָא תַּעֲזֹב אֹתָנוּ
  choice: Tolong, jangan tinggalkan kami
  rationale: אַל menyatakan larangan, sedangkan נָא memberi nada permohonan. 'Tolong, jangan' mempertahankan nada memohon dalam bahasa Indonesia modern.
- source_word: כִּי עַל כֵּן
  choice: sebab
  rationale: Ungkapan ini memperkenalkan alasan bagi permohonan Musa; 'sebab' ringkas, wajar, dan sesuai dengan hubungan kausal dalam konteks.
- source_word: יָדַעְתָּ חֲנֹתֵנוּ בַּמִּדְבָּר
  choice: engkau tahu tempat-tempat kami berkemah di padang belantara
  rationale: חֲנֹתֵנוּ secara bentuk menunjuk pada kegiatan atau keadaan berkemah kami dan dalam konteks dapat menyiratkan lokasi perkemahan. Terjemahan ini alami sekaligus tidak menambahkan modalitas 'harus' yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: dan engkau akan menjadi mata bagi kami
  rationale: Terjemahan ini mempertahankan metafora Ibrani secara langsung. Maksud pemanduan dapat dipahami dari konteks dan dijelaskan dalam catatan kaki tanpa menghapus citra sumber.
theological_decisions:
- issue: Hubungan antara tuntunan ilahi dan bantuan manusia dalam perjalanan Israel
  choice: Mempertahankan permintaan Musa agar Hobab menjadi 'mata' bagi mereka tanpa menjelaskan atau menyelaraskannya secara teologis.
  alternative: Mengganti metafora dengan 'penunjuk jalan kami' atau menambahkan penjelasan tentang peran Hobab di bawah tuntunan Allah.
  rationale: Ayat ini sendiri menyandingkan kebutuhan akan pengetahuan Hobab dengan konteks tuntunan ilahi tanpa menerangkan hubungan keduanya. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Padang belantara' dipilih untuk מִדְבָּר karena menunjuk wilayah liar yang belum dihuni, bukan semata-mata gurun pasir. Metafora 'menjadi mata bagi kami' dipertahankan, dengan penjelasan melalui catatan kaki.
