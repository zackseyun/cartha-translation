id: NUM.10.9
reference: Numbers 10:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: id
  text: Apabila kamu pergi berperang di negerimu melawan musuh yang menindas kamu,[a] hendaklah kamu membunyikan tanda bahaya dengan nafiri-nafiri itu. Maka kamu akan diingat di hadapan Yahweh, Allahmu,[b][c] dan kamu akan diselamatkan dari musuh-musuhmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika kamu pergi berperang di negerimu melawan musuh yang menindas kamu.” Kata penghubung Ibrani dapat memperkenalkan klausa keadaan maupun syarat.
    reason: alternative_reading
  - marker: b
    text: Atau, “kamu akan dibawa ke dalam ingatan di hadapan Yahweh, Allahmu”; secara lebih interpretatif, “Yahweh, Allahmu, akan mengingat kamu.”
    reason: lexical_alternative
  - marker: c
    text: Nama ilahi dalam bahasa Ibrani adalah YHWH; di sini diterjemahkan “Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Apabila
  rationale: Dalam konteks hukum atau petunjuk, ungkapan ini memperkenalkan keadaan yang mungkin terjadi. “Apabila” terdengar alami dalam bahasa Indonesia dan tetap dapat memuat nuansa waktu maupun syarat; kemungkinan “jika” dicatat dalam catatan kaki.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: kamu pergi berperang
  rationale: Ungkapan Ibrani ini berarti memasuki atau terlibat dalam peperangan. “Pergi berperang” merupakan ungkapan Indonesia yang alami.
- source_word: בְּאַרְצְכֶם
  choice: di negerimu
  rationale: Kata אֶרֶץ di sini menunjuk pada wilayah milik Israel. “Negeri” mempertahankan arti teritorial tanpa memberi kesan negara modern.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: melawan musuh yang menindas kamu
  rationale: Terjemahan ini mempertahankan baik nomina צַר, “musuh/lawan”, maupun partisip צֹרֵר, yaitu pihak yang sedang bertindak memusuhi atau menindas.
- source_word: וַהֲרֵעֹתֶם
  choice: kamu harus meniup tanda bahaya
  rationale: Bentuk Hifil dari רוע dalam konteks nafiri menunjuk pada pembunyian tiupan isyarat atau tanda bahaya, bukan sekadar bunyi keras.
- source_word: בַּחֲצֹצְרֹת
  choice: dengan nafiri-nafiri itu
  rationale: חֲצֹצְרֹת adalah nafiri perak yang telah disebutkan dalam pasal ini. Bentuk ulang menandai jamak, sedangkan “itu” mengacu pada nafiri tertentu tersebut.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: kamu akan diingat di hadapan Yahweh, Allahmu
  rationale: Bentuk Nifal dipertahankan sebagai pasif, “akan diingat”, agar terjemahan tidak diam-diam mengubah Allah menjadi subjek gramatikal eksplisit. “Di hadapan” mempertahankan ungkapan relasional Ibrani.
- source_word: וְנוֹשַׁעְתֶּם
  choice: kamu akan diselamatkan
  rationale: Bentuk Nifal dari ישׁע berarti diselamatkan atau dilepaskan. “Diselamatkan” sesuai dengan konteks militer sekaligus mempertahankan jangkauan makna teologisnya.
- source_word: מֵאֹיְבֵיכֶם
  choice: dari musuh-musuhmu
  rationale: אֹיֵב adalah istilah umum bagi musuh; bentuk jamak posesif diterjemahkan langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian YHWH. “Yahweh” mempertahankan nama pribadi itu, bukan menggantinya dengan gelar.
- issue: Daya bentuk pasif וֲנִזְכַּרְתֶּם
  choice: kamu akan diingat di hadapan Yahweh, Allahmu
  alternative: Yahweh, Allahmu, akan mengingat kamu
  rationale: Bentuk pasif Ibrani dipertahankan untuk menjaga ketegangan ungkapan asli dan tidak menentukan secara berlebihan bagaimana bunyi nafiri berkaitan dengan tindakan Allah mengingat umat-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Nafiri” dipakai karena konteksnya adalah alat tiup perak khusus dalam Bilangan 10. Susunan kalimat dipecah menjadi dua kalimat agar alurnya jelas tanpa menghilangkan hubungan tindakan dan hasil yang terdapat dalam teks Ibrani.
