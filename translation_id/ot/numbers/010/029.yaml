id: NUM.10.29
reference: Numbers 10:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: id
  text: Musa berkata kepada Hobab, anak Rehuel, orang Midian itu, mertua Musa[a], “Kami sedang berangkat ke tempat itu. Yahweh telah berfirman, ‘Aku akan memberikannya kepada kalian.’ Mari ikut dengan kami, dan kami akan berbuat baik kepadamu, sebab Yahweh telah berfirman yang baik tentang Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani חֹתֵן dapat menunjuk secara lebih luas kepada kerabat karena perkawinan; sebagian memahaminya sebagai “ipar Musa” atau “kerabat Musa karena perkawinan”, bukan “mertua Musa”.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב
  choice: Hobab
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: רְעוּאֵל
  choice: Rehuel
  rationale: Nama pribadi ditransliterasikan secara langsung dan wajar bagi pembaca Indonesia.
- source_word: הַמִּדְיָנִי
  choice: orang Midian itu
  rationale: Bentuk nisbah dengan artikel menyatakan identitas etnis tertentu; frasa ini paling alami dalam bahasa Indonesia.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: חֹתֵן lazim menunjuk kerabat karena perkawinan dan sering secara khusus berarti mertua laki-laki; kemungkinan makna yang lebih luas dipertahankan dalam catatan kaki.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: Kami sedang berangkat
  rationale: Partisipel dengan pronomina menandakan tindakan yang sedang atau segera dimulai; terjemahan ini alami dalam konteks dimulainya perjalanan.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: yang tentangnya Yahweh berfirman, ‘Aku akan memberikannya kepada kalian’
  rationale: Mempertahankan konstruksi relatif, acuan tunggal kepada tempat itu, dan bentuk jamak לָכֶם melalui ‘kalian’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar.
- source_word: לְכָה אִתָּנוּ
  choice: Mari ikut bersama kami
  rationale: Menyampaikan undangan Musa secara idiomatis tanpa mengubah arah gerak yang dimaksud.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: kami akan berbuat baik kepadamu
  rationale: Mempertahankan makna kausatif-benefaktif verba יטב, yakni bertindak demi kebaikan seseorang.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: telah menjanjikan yang baik bagi Israel
  rationale: Dalam konteks ucapan ilahi mengenai masa depan Israel, ‘menjanjikan’ menyampaikan daya janji dari דִּבֶּר טוֹב secara alami, sementara unsur ‘yang baik’ tetap dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi ‘Yahweh’ mempertahankan fungsi nama pribadi tersebut.
- issue: Hubungan חֹתֵן מֹשֶׁה dengan Hobab/Rehuel
  choice: mertua Musa
  alternative: kerabat Musa karena perkawinan; ipar Musa
  rationale: ‘Mertua’ adalah nilai leksikal yang umum, tetapi istilah Ibrani dapat memiliki cakupan lebih luas. Catatan kaki mempertahankan ketidakpastian hubungan keluarga tanpa memaksakan penyelesaian genealogis.
- issue: Daya ujar דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: telah menjanjikan yang baik bagi Israel
  alternative: telah mengatakan yang baik tentang Israel
  rationale: Konteksnya adalah firman Yahweh mengenai pemberian negeri dan kebaikan bagi Israel, sehingga ‘menjanjikan’ alami dan sesuai konteks, meskipun alternatif yang lebih harfiah tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. ‘Kalian’ dipakai untuk menunjukkan bahwa לָכֶם berbentuk jamak, sedangkan ‘kepadamu’ menunjukkan bahwa Hobab disapa secara tunggal.
