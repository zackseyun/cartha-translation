translation_notes:
  register: Bahasa dibuat modern, lugas, dan bermartabat. “Lalu” menjaga kesinambungan narasi; inversi ringan pada kalimat kedua memberi penekanan yang alami pada pemimpin pasukan. Istilah organisasi kemah dipertahankan tanpa memberi kesan bahwa ayat ini sedang menggambarkan pertempuran.
