base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: id
  text: Lalu panji[a] perkemahan keturunan Yehuda berangkat paling dahulu, menurut satuan-satuan mereka[b]. Satuan itu dipimpin oleh Nahason bin Aminadab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bendera.” Kata Ibrani ini menunjuk pada panji suku yang menjadi tanda bagi suatu kesatuan perkemahan ketika mereka bergerak.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut kelompok-kelompok mereka.” Kata Ibrani yang dipakai merupakan istilah organisasi militer untuk satuan-satuan suku yang tersusun teratur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: berangkat
  rationale: Dalam konteks perjalanan di padang gurun, verba נסע berarti membongkar perkemahan lalu mulai bergerak. “Berangkat” menyampaikan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: דֶּגֶל
  choice: panji
  rationale: Istilah ini menunjuk pada panji suku sekaligus kesatuan perkemahan yang berhimpun dan bergerak di bawahnya. “Panji” mempertahankan citra konkret dan nuansa organisasi kemah.
- source_word: מַחֲנֵה
  choice: perkemahan
  rationale: Dalam frasa konstruksi דֶּגֶל מַחֲנֵה, kata ini menunjuk pada perkemahan atau kesatuan kemah yang diatur di bawah sebuah panji.
- source_word: בְנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Dalam konteks suku, ungkapan harfiah “anak-anak lelaki Yehuda” merujuk pada para keturunan Yehuda. “Keturunan Yehuda” akurat secara genealogis dan lebih alami bagi pembaca Indonesia modern.
- source_word: בָּרִאשֹׁנָה
  choice: paling dahulu
  rationale: Bentuk adverbial ini menyatakan urutan keberangkatan. “Paling dahulu” jelas dan idiomatis.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: צָבָא di sini menunjuk pada kelompok-kelompok yang tersusun seperti satuan militer. Bentuk ulang mempertahankan jamak Ibrani dan “menurut” mencerminkan pengaturan keberangkatan berdasarkan satuan-satuan itu.
- source_word: וְעַל צְבָאוֹ
  choice: Yang memimpin pasukan itu ialah
  rationale: Frasa עַל צְבָאוֹ memperkenalkan orang yang berada di atas atau mengepalai satuan tersebut. Susunan ini menyampaikan fungsi kepemimpinan secara alami tanpa menambahkan gelar yang tidak terdapat dalam teks.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Nahason bin Aminadab
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; “bin” secara ringkas dan wajar menerjemahkan hubungan genealogis בֶּן.
