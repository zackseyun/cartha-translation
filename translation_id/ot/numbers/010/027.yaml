  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Istilah 'bani' dipertahankan karena alami dalam formula nama suku, sedangkan 'pasukan' menyampaikan sifat kontingen yang terorganisasi tanpa mengesankan angkatan perang nasional permanen.
