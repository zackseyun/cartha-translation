  terminology: “Pasukan” mempertahankan gagasan kontingen yang tertata tanpa harus menentukan bahwa ini adalah tentara nasional permanen. “Suku bani Naftali” mencerminkan istilah kesukuan dan ungkapan בְּנֵי secara tepat. Nama Ahira dan Enan ditransliterasikan secara konsisten. Catatan kaki secara memadai menjelaskan rentang makna צָבָא dan tetap terkait dengan penanda [a].
