  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: id
  text: Yang memimpin pasukan suku bani Naftali adalah Ahira bin Enan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bala tentara,” “laskar,” atau “kesatuan” untuk “pasukan.” Kata Ibrani צְבָא menunjuk pada kontingen suku yang terorganisasi dalam tata perkemahan dan perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang memimpin
  rationale: Dalam formula daftar pemimpin ini, וְ menghubungkan ayat dengan daftar sebelumnya, sedangkan עַל menyatakan bahwa orang yang disebut ditempatkan atas suatu kesatuan. Susunan ini menyampaikan fungsi kepemimpinan secara alami dalam bahasa Indonesia.
- source_word: צְבָא
  choice: pasukan
  rationale: Dalam konteks tata perkemahan dan perjalanan Israel, צְבָא menunjuk pada kontingen suku yang tersusun, bukan semata-mata angkatan perang nasional.
- source_word: מַטֵּה
  choice: suku
  rationale: Di sini מַטֵּה bermakna kesatuan suku, bukan tongkat sebagai benda harfiah.
- source_word: בְּנֵי נַפְתָּלִי
  choice: bani Naftali
  rationale: Ungkapan ini secara harfiah berarti 'anak-anak lelaki Naftali' dan dalam formula kesukuan menunjuk pada keturunannya. 'Bani Naftali' mempertahankan bentuk kekeluargaan sekaligus wajar dalam bahasa Indonesia Alkitabiah.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן עֵינָן
  choice: bin Enan
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara ringkas dan alami sebagai 'bin Enan'.
