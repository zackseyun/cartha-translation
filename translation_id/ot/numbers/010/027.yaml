  source_fidelity: 'Teks dengan tepat menyampaikan formula kepemimpinan Ibrani: Ahira, bin Enan, ditempatkan sebagai pemimpin atas kontingen/pasukan suku bani Naftali. “Yang memimpin” secara idiomatis merepresentasikan וְעַל dalam konstruksi daftar ini, dan “pasukan” sesuai dengan צָבָא dalam konteks perkemahan serta perjalanan.'
