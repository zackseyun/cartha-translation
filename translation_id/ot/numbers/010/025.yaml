  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: id
  text: Kemudian panji[a] perkemahan bani Dan berangkat sebagai barisan belakang[b] bagi semua perkemahan, sesuai dengan kelompok-kelompok mereka; pemimpin pasukan Dan adalah Ahiezer bin Amisyadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pataka”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sebagai penutup barisan”; istilah Ibraninya menggambarkan kelompok yang berjalan paling belakang dan menghimpun barisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kemudian ... berangkat
  rationale: Bentuk ini melanjutkan urutan perjalanan dalam narasi; “kemudian” menyatakan kesinambungan, sedangkan “berangkat” wajar untuk pergerakan perkemahan.
- source_word: דֶּגֶל
  choice: panji
  rationale: Kata ini menunjuk pada tanda pengenal utama kelompok suku dalam susunan perjalanan. “Panji” ringkas, bermartabat, dan lazim dalam konteks demikian.
- source_word: מַחֲנֵה בְנֵי דָן
  choice: perkemahan bani Dan
  rationale: “Perkemahan” mempertahankan gambaran kelompok yang berkemah, sedangkan “bani Dan” menyampaikan ungkapan kekerabatan suku secara padat dan lazim dalam bahasa Indonesia.
- source_word: מְאַסֵּף לְכָל הַמַּחֲנֹת
  choice: sebagai barisan belakang bagi seluruh perkemahan
  rationale: Dalam susunan perjalanan, kelompok Dan bergerak paling belakang dan berfungsi sebagai pasukan penutup. Ungkapan ini lebih jelas daripada terjemahan harfiah yang berhubungan dengan tindakan “mengumpulkan”.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: Bentuk jamak צבאות mengacu pada kelompok-kelompok suku yang tersusun untuk perjalanan. “Pasukan-pasukan” mempertahankan nuansa organisasi kolektif dan bentuk jamaknya.
- source_word: וְעַל צְבָאוֹ
  choice: pemimpin pasukan Dan adalah
  rationale: Secara harfiah frasa ini menyatakan bahwa Ahiezer berada “atas” pasukannya. Perumusan eksplisit ini alami dalam bahasa Indonesia, dan “Dan” memperjelas rujukan pronomina tunggal Ibrani.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Ahiezer bin Amisyadai
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia; “bin” mempertahankan rumus patronimik secara ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah “bani” dipertahankan karena ringkas dan mapan untuk identitas suku; susunan klausa dibuat alami tanpa menghilangkan fungsi militer-logistik kelompok Dan.
