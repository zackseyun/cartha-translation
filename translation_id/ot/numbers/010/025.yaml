    issue: Number and idiom in the phrase for לְכָל הַמַּחֲנֹת לְצִבְאֹתָם.
    rationale: '"Seluruh perkemahan" is grammatically collective but may obscure the Hebrew plural "all the camps," while "menurut pasukan-pasukan mereka" is awkward and unnecessarily militarized in Indonesian. "Semua perkemahan, sesuai dengan kelompok-kelompok mereka" preserves the plural organizational reference naturally.'
