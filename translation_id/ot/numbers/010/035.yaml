  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: id
  text: Setiap kali tabut itu berangkat[a], Musa berkata, “Bangkitlah[b], ya Yahweh! Biarlah musuh-musuh-Mu tercerai-berai, dan biarlah orang-orang yang membenci-Mu melarikan diri dari hadapan-Mu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan terjadilah ketika tabut itu berangkat.” Dalam konteks ini, ungkapan Ibrani tampaknya menunjukkan kejadian yang berulang: “Setiap kali tabut itu berangkat.”'
    reason: lexical_alternative
  - marker: b
    text: “Bangkitlah” adalah seruan agar Yahweh bertindak dengan kuasa, bukan pernyataan bahwa sebelumnya Ia benar-benar tidak aktif.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: Setiap kali ... mulai berangkat
  rationale: Rangkaian וַיְהִי dengan infinitif konstruk memperkenalkan keadaan yang berulang dalam konteks ini. 'Setiap kali' menyampaikan fungsi idiomatis itu, sedangkan 'mulai berangkat' secara alami menggambarkan awal pergerakan tabut.
- source_word: הָאָרֹן
  choice: tabut itu
  rationale: Teks Ibrani hanya menyebut 'tabut', tanpa tambahan 'perjanjian'. Penunjuk 'itu' wajar dalam bahasa Indonesia karena tabut tersebut sudah dikenal dari konteks.
- source_word: קוּמָה
  choice: Bangkitlah
  rationale: Imperatif ini mempertahankan gambaran hidup tentang Yahweh yang bangkit untuk bertindak dengan kuasa; bentuk '-lah' sesuai untuk seruan permohonan yang khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וְיָפֻצוּ
  choice: Biarlah ... tercerai-berai
  rationale: Bentuk imperfek sesudah imperatif berdaya yusif dan mengungkapkan permohonan. 'Biarlah' mempertahankan nuansa volitif, sedangkan 'tercerai-berai' cocok dengan konteks musuh yang dipukul mundur.
- source_word: אֹיְבֶיךָ
  choice: musuh-musuh-Mu
  rationale: Padanan langsung bagi nomina jamak dengan sufiks orang kedua tunggal yang merujuk kepada Yahweh.
- source_word: וְיָנֻסוּ
  choice: dan biarlah ... melarikan diri
  rationale: Seperti klausa sebelumnya, imperfek ini berdaya yusif. Pengulangan 'biarlah' mempertahankan kesejajaran permohonan.
- source_word: מְשַׂנְאֶיךָ
  choice: orang-orang yang membenci-Mu
  rationale: Partisipel ini menggambarkan orang berdasarkan sikap yang terus mencirikan mereka. Ungkapan tersebut alami dan mempertahankan sifat pribadi dari permusuhan itu.
- source_word: מִפָּנֶיךָ
  choice: dari hadapan-Mu
  rationale: Padanan ini mempertahankan metafora spasial Ibrani dan menyatakan bahwa para pembenci Yahweh mundur atau melarikan diri di hadirat-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi dan merupakan transliterasi akademis yang lazim, tanpa menggantinya dengan gelar.
- issue: Makna seruan קוּמָה kepada Yahweh
  choice: Bangkitlah sebagai permohonan agar Yahweh bertindak dengan kuasa
  alternative: Memahaminya secara harfiah seolah-olah Yahweh sebelumnya sedang duduk atau tidak aktif
  rationale: Dalam doa peperangan ini, imperatif merupakan seruan metaforis bagi tindakan dan campur tangan ilahi. Terjemahan mempertahankan metaforanya, sementara catatan menjelaskan daya ungkapnya tanpa menghapus gambaran asli.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Paralelisme doa dipertahankan melalui pengulangan 'biarlah'. Kapitalisasi pronomina yang merujuk kepada Yahweh mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan [a] ditempatkan pada ungkapan temporal yang dijelaskan; [b] ditempatkan setelah seluruh kutipan karena menjelaskan seruan pembukanya.
