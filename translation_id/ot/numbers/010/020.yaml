  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: id
  text: Dan pemimpin pasukan dari suku Gad ialah Elyasaf anak Deuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pasukan” juga dapat berarti “bala tentara” atau “kesatuan”. Di sini kata itu menunjuk pada kelompok suku yang tersusun dalam barisan perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Yang memimpin
  rationale: Dalam formula daftar pemimpin ini, עַל menyatakan bahwa orang yang disebut ditempatkan atas kelompok sukunya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan kepemimpinan itu; וְ dipahami sebagai penghubung dengan daftar pada ayat-ayat sebelumnya.
- source_word: צְבָא
  choice: pasukan
  rationale: צְבָא menunjuk pada kelompok suku yang teratur dalam barisan perjalanan dan tetap memiliki nuansa militer. 'Pasukan' mempertahankan nuansa itu tanpa harus menyatakan bahwa konteksnya adalah pertempuran.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks ini מַטֶּה berarti satuan suku, bukan tongkat.
- source_word: בְנֵי גָד
  choice: keturunan Gad
  rationale: Ungkapan harfiah 'anak-anak Gad' merupakan sebutan kolektif bagi anggota suku Gad; 'keturunan Gad' lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: אֶלְיָסָף
  choice: Elyasaf
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן דְּעוּאֵל
  choice: anak Deuel
  rationale: Konstruksi patronimik diterjemahkan langsung dengan formula Indonesia yang alami.
