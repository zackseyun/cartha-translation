  register: Bahasa Indonesia baku, modern, dan lugas. ‘Bunyi tanda’ dipilih untuk menyampaikan fungsi teknis tiupan tanpa memberi kesan ancaman yang belum tentu dimaksud; alternatif ‘bunyi peringatan’ dicatat dalam catatan kaki.
