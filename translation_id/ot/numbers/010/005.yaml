  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: id
  text: Apabila kamu meniup tiupan tanda[a], perkemahan-perkemahan yang berada di sebelah timur harus berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bunyi peringatan.” Istilah Ibrani ini menunjuk pada tiupan nafiri khas yang menjadi tanda agar perkemahan mulai bergerak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Apabila kamu meniup
  rationale: Kata kerja תקע dalam konteks nafiri berarti ‘meniup’ atau ‘membunyikan’. Bentuk dengan waw mengantar keadaan yang memicu tindakan berikutnya, sehingga ‘Apabila’ wajar dalam bahasa Indonesia.
- source_word: תְּרוּעָה
  choice: bunyi tanda
  rationale: Dalam petunjuk tentang nafiri ini, תְּרוּעָה menunjuk pada bunyi khas yang menjadi tanda bagi pergerakan perkemahan, bukan sekadar bunyi biasa atau pekik.
- source_word: וְנָסְעוּ
  choice: harus berangkat
  rationale: נסע lazim dipakai untuk tindakan berangkat atau mulai bergerak dari tempat perkemahan. ‘Harus berangkat’ mempertahankan nada instruksional konteks ini.
- source_word: הַמַּחֲנוֹת
  choice: perkemahan-perkemahan
  rationale: Bentuk jamak ini merujuk pada kelompok-kelompok perkemahan suku; terjemahan jamak dipertahankan secara eksplisit.
- source_word: הַחֹנִים
  choice: yang berkemah
  rationale: Partisipel חנה menerangkan perkemahan-perkemahan berdasarkan posisi mereka; ‘yang berkemah’ alami dan dekat dengan bentuk Ibrani.
- source_word: קֵדְמָה
  choice: di sebelah timur
  rationale: Dalam susunan perkemahan, bentuk ini menyatakan lokasi di sisi timur, bukan arah perjalanan ke timur.
