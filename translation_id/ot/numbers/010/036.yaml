  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: id
  text: Setiap kali tabut itu berhenti, Musa berkata, “Kembalilah, ya Yahweh, kepada umat Israel yang beribu-ribu laksa ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: Setiap kali tabut itu berhenti
  rationale: Gabungan preposisi ב dengan infinitif נוח membentuk klausa waktu. Sufiks feminin tunggal merujuk secara kontekstual kepada tabut, dan “setiap kali” selaras dengan tindakan berulang yang juga dinyatakan oleh יֹאמַר.
- source_word: יֹאמַר
  choice: Musa berkata
  rationale: 'Bentuk imperfek dalam konteks ini menyatakan kebiasaan: Musa mengucapkan perkataan ini setiap kali tabut berhenti. Nama Musa dibuat eksplisit dari konteks ayat sebelumnya agar rujukannya jelas dalam bahasa Indonesia.'
- source_word: שׁוּבָה
  choice: Kembalilah
  rationale: Imperatif שוב dengan akhiran paragogis ה merupakan seruan langsung agar Yahweh kembali kepada umat-Nya. “Kembalilah” mempertahankan arah gerak tanpa menjelaskan lebih jauh bagaimana kehadiran ilahi dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: ribuan orang Israel yang tidak terhitung banyaknya
  rationale: Dua istilah bilangan besar yang ditumpuk berfungsi menegaskan jumlah Israel yang amat besar. Ungkapan Indonesia ini menyampaikan daya retorisnya secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Arah permohonan שׁוּבָה
  choice: Kembalilah ... kepada
  alternative: Tinggallah ... bersama
  rationale: “Kembalilah” mempertahankan arti dasar שוב dan ketegangan gerak dalam pasangan dengan seruan ketika tabut berangkat pada ayat sebelumnya. Terjemahan “tinggallah” akan menafsirkan maksud permohonan secara lebih sempit daripada bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur berulang dibuat jelas dengan “setiap kali”; ungkapan bilangan yang sangat kaku dalam bentuk harfiah dialihkan secara idiomatis, dengan bentuk sumber dipertahankan dalam catatan kaki.
