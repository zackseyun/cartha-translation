  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: id
  text: Kemudian bani Kehat berangkat dengan membawa barang-barang kudus,[a] dan Kemah Suci sudah didirikan sebelum mereka tiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “para pengangkut tempat kudus.” Di sini ungkapan itu mengacu pada perlengkapan kudus yang dibawa bani Kehat, berbeda dari struktur Kemah Suci yang disebut sesudahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Kemudian ... berangkat
  rationale: Waw dengan נָסַע melanjutkan urutan perjalanan. 'Kemudian' menyampaikan alur naratif, sedangkan 'berangkat' wajar dalam konteks rombongan yang mulai berjalan.
- source_word: הַקְּהָתִים
  choice: bani Kehat
  rationale: Bentuk ini menunjuk kepada kelompok keturunan Kehat. 'Bani Kehat' merupakan sebutan Indonesia yang ringkas dan lazim untuk kaum tersebut.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: dengan membawa barang-barang kudus
  rationale: Secara bentuk frasa ini berarti 'para pengangkut tempat kudus', tetapi dalam konteksnya menunjuk secara metonimis kepada perlengkapan kudus yang diangkut bani Kehat, bukan struktur Kemah Suci.
- source_word: הַמִּקְדָּשׁ
  choice: barang-barang kudus
  rationale: מִקְדָּשׁ biasanya berarti 'tempat kudus', tetapi di sini konteks membedakan benda-benda kudus yang dibawa bani Kehat dari Kemah Suci yang didirikan lebih dahulu.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: dan Kemah Suci sudah didirikan
  rationale: Verba Ibrani berbentuk orang ketiga jamak tanpa subjek eksplisit. Bentuk pasif Indonesia mempertahankan ketidakjelasan pelaku dan menghindari kesan keliru bahwa bani Kehatlah yang mendirikannya; 'sudah' memperjelas bahwa pendirian selesai menjelang kedatangan mereka.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: '''Kemah Suci'' adalah padanan Indonesia yang jelas dan mapan untuk מִשְׁכָּן dalam konteks tempat ibadah Israel di padang gurun.'
- source_word: עַד בֹּאָם
  choice: sebelum mereka tiba
  rationale: Dalam konteks urutan rombongan, frasa ini berarti Kemah Suci telah didirikan menjelang atau pada saat bani Kehat datang. 'Sebelum mereka tiba' mengungkapkan hubungan waktunya secara alami.
