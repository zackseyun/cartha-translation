  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: id
  text: Kemudian panji perkemahan Ruben berangkat menurut pasukan-pasukan mereka[a], dan yang memimpin pasukannya ialah Elizur anak Syedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menurut kelompok-kelompok mereka"; kata Ibrani yang dipakai dapat menunjuk pada kelompok terorganisasi dengan corak kemiliteran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kemudian ... berangkat
  rationale: Bentuk naratif ini melanjutkan urutan perjalanan. 'Kemudian' menyampaikan daya urutan waw, sedangkan 'berangkat' secara alami menggambarkan pergerakan perkemahan tanpa menambahkan gagasan membongkar kemah.
- source_word: דֶּגֶל
  choice: panji
  rationale: Dalam konteks ini דֶּגֶל menunjuk pada panji yang menandai kelompok perkemahan suku. 'Panji' mempertahankan gambaran konkretnya dan sesuai dengan ragam Indonesia yang bermartabat.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: perkemahan Ruben
  rationale: Rangkaian konstruksi ini menyatakan hubungan kepunyaan atau identitas; 'perkemahan Ruben' dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: Bentuk jamak צְבָאֹת dengan akhiran orang ketiga jamak menggambarkan kelompok-kelompok yang terorganisasi dalam tata perjalanan. 'Pasukan-pasukan' mempertahankan nuansa organisasi bercorak militer tanpa menyiratkan bahwa mereka sedang bertempur.
- source_word: וְעַל צְבָאוֹ
  choice: dan yang memimpin pasukannya ialah
  rationale: עַל menyatakan kedudukan di atas atau kewenangan atas kelompok tersebut. Ungkapan verbal 'yang memimpin ... ialah' merupakan padanan Indonesia yang alami bagi klausa nominal Ibrani, sedangkan bentuk tunggal 'pasukannya' mempertahankan צְבָאוֹ.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: בֶּן שְׁדֵיאוּר
  choice: anak Syedeur
  rationale: בֶּן menyatakan patronimik. Nama ayah ditransliterasikan, bukan diterjemahkan.
theological_decisions: []
