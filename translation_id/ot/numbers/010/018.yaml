  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Panji' dipilih sebagai istilah konkret dan mudah dipahami; 'pasukan-pasukan' menjaga pengulangan leksikal צבא serta nuansa organisasi dalam tata perjalanan Israel.
