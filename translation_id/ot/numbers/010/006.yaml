  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: id
  text: Apabila kamu membunyikan aba-aba[a] untuk kedua kalinya, kelompok-kelompok perkemahan yang berada di sebelah selatan harus berangkat. Hendaklah aba-aba dibunyikan untuk keberangkatan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tiupan" atau "isyarat"; kata Ibrani תְּרוּעָה menunjuk pada bunyi nafiri khas yang digunakan untuk mengarahkan kelompok-kelompok perkemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: apabila kamu meniup
  rationale: Bentuk orang kedua jamak dari תקע merujuk pada tindakan meniup nafiri. 'Apabila' menyampaikan urutan instruksi secara alami tanpa menghilangkan sifat ketentuannya.
- source_word: תְּרוּעָה
  choice: tanda bahaya
  rationale: Dalam konteks aba-aba nafiri, kata ini menunjuk pada tiupan khas yang menjadi sinyal pergerakan, bukan sekadar bunyi atau pekik.
- source_word: שֵׁנִית
  choice: untuk kedua kalinya
  rationale: Menyatakan bahwa tiupan tanda ini dilakukan pada kesempatan kedua; ungkapan ini wajar dalam bahasa Indonesia.
- source_word: וְנָסְעוּ
  choice: harus berangkat
  rationale: נסע dalam konteks perkemahan berarti membongkar kemah lalu mulai bergerak. 'Berangkat' menyampaikan tindakan tersebut dengan jelas, sedangkan 'harus' mencerminkan fungsi instruksional bentuk verba.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: perkemahan-perkemahan yang berkemah
  rationale: Mempertahankan bentuk jamak dan hubungan partisipial deskriptif dalam teks Ibrani, walaupun pengulangan akar kata terasa lebih nyata dalam bahasa Indonesia.
- source_word: תֵּימָנָה
  choice: di sebelah selatan
  rationale: Dalam konteks ini bentuk berarah tersebut mengidentifikasi letak kelompok-kelompok perkemahan di sisi selatan, bukan arah perjalanan mereka.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: mereka harus meniup tanda bahaya
  rationale: Mempertahankan subjek jamak tak tersurat dan pengulangan nomina-verba dari teks Ibrani, alih-alih mengubahnya menjadi konstruksi pasif.
- source_word: לְמַסְעֵיהֶם
  choice: sebagai tanda untuk keberangkatan mereka
  rationale: Frasa ini menunjukkan fungsi tiupan bagi saat kelompok-kelompok itu mulai bergerak. Penambahan 'sebagai tanda' menjelaskan hubungan tujuan secara alami sesuai konteks.
