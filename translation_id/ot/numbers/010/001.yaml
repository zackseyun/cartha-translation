lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam rumus ujaran ilahi, kata kerja דבר paling alami dan bermartabat diterjemahkan dengan verba khusus bahasa Indonesia untuk perkataan Allah; bentuk wayyiqtol memulai peristiwa naratif baru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang menerima firman, dan Musa adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Infinitif לֵאמֹר memperkenalkan isi perkataan yang menyusul. Dalam bahasa Indonesia, fungsi ini sudah tersirat secara alami oleh 'berfirman' dan tanda baca; menerjemahkannya sebagai 'dengan berkata' akan terasa kaku dan berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk Yahweh mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. 'Berfirman' dipilih sebagai ungkapan baku bagi ujaran Allah. Ayat dibiarkan berakhir dengan koma karena kalimat langsung berlanjut pada ayat berikutnya.
