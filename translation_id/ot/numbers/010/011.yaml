base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: id
  text: Kemudian, pada tahun kedua, pada bulan kedua, pada hari kedua puluh bulan itu, awan terangkat[a] dari atas Kemah Suci Kesaksian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: naik; terangkat ke atas.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Kemah Kesaksian.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Kemudian
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. “Kemudian” menyampaikan peralihan tersebut secara alami dalam bahasa Indonesia tanpa ungkapan kaku seperti “dan terjadilah”.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: pada tahun kedua
  rationale: Ungkapan waktu ini diterjemahkan langsung dan wajar.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: dalam bulan kedua
  rationale: Menunjukkan bulan dalam tahun yang disebutkan; “dalam” membantu membedakannya dari keterangan tanggal berikutnya.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: pada hari kedua puluh bulan itu
  rationale: Ungkapan Ibrani secara harfiah menyebut “pada dua puluh dalam bulan”; kata “hari” ditambahkan agar maksud tanggalnya jelas dalam bahasa Indonesia.
- source_word: נַעֲלָה
  choice: terangkat
  rationale: Bentuk pasif dari עלה menggambarkan awan yang bergerak naik dari posisinya di atas Kemah Suci. “Terangkat” mempertahankan bentuk dan gambaran sumber, sementara “naik” dicatat sebagai alternatif.
- source_word: הֶעָנָן
  choice: awan
  rationale: Nomina tentu ini menunjuk kepada awan yang telah dikenal dalam konteks perjalanan Israel; bahasa Indonesia tidak memerlukan penanda ketentuan tersendiri.
- source_word: מֵעַל
  choice: dari atas
  rationale: Menunjukkan gerakan menjauh dari posisi yang berada di atas Kemah Suci.
- source_word: מִשְׁכַּן
  choice: Kemah Suci
  rationale: Dalam konteks Pentateukh, istilah ini menunjuk kepada tempat kediaman kudus portabel. “Kemah Suci” merupakan padanan Indonesia yang jelas dan dikenal.
- source_word: הָעֵדֻת
  choice: Kesaksian
  rationale: Istilah ini secara leksikal berarti “kesaksian” dan dalam konteks tempat kudus berkaitan dengan kesaksian perjanjian yang disimpan di sana. Terjemahan langsung mempertahankan kaitan antarteks tanpa menggantinya dengan tafsiran “perjanjian”.
theological_decisions:
- issue: Sebutan tempat kudus מִשְׁכַּן הָעֵדֻת
  choice: Kemah Suci Kesaksian
  alternative: Kemah Kesaksian; Kemah Suci tempat Kesaksian disimpan
  rationale: 'Pilihan utama mempertahankan kedua unsur Ibrani secara ringkas: מִשְׁכָּן sebagai tempat kediaman suci portabel dan עֵדוּת sebagai “Kesaksian.” Terjemahan “perjanjian” tidak dipakai dalam teks utama karena lebih interpretatif daripada bentuk leksikal sumber.'
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. Susunan keterangan waktu dibuat alami tanpa menghilangkan rincian kronologis. Huruf kapital pada “Kemah Suci Kesaksian” menandai sebutan khusus bagi tempat kudus itu.
