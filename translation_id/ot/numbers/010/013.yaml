  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: id
  text: Maka untuk pertama kalinya mereka berangkat atas perintah Yahweh melalui Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “dengan tangan Musa,” sebuah ungkapan yang berarti melalui Musa sebagai perantara atau pelaksana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: mereka berangkat
  rationale: Dalam kisah perjalanan, נסע menyatakan tindakan membongkar perkemahan lalu mulai bergerak. “Berangkat” merupakan padanan Indonesia modern yang alami dan mempertahankan nuansa awal gerak itu.
- source_word: בָּרִאשֹׁנָה
  choice: untuk pertama kalinya
  rationale: Bentuk adverbial ini dapat berarti “pada mulanya” atau “untuk pertama kalinya.” Dalam konteks keberangkatan perdana Israel dari Sinai secara teratur, pilihan ini paling jelas menyampaikan makna perdana.
- source_word: עַל פִּי
  choice: atas perintah
  rationale: Ungkapan yang secara harfiah berarti “menurut mulut” secara idiomatis berarti “menurut” atau “atas perintah.” Konteks menekankan bahwa keberangkatan itu mengikuti pengarahan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan “dengan tangan Musa” menandai perantaraan atau pelaku. “Melalui Musa” menyampaikan fungsi Musa sebagai perantara dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
- issue: Peran Musa dalam penyampaian perintah
  choice: melalui Musa
  alternative: dengan tangan Musa; oleh Musa
  rationale: Pilihan ini mempertahankan gagasan perantaraan atau keagenan dalam בְּיַד tanpa menyiratkan bahwa perintah tersebut berasal dari Musa sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara hubungan antara perintah Yahweh dan perantaraan Musa dipertahankan.
