base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: id
  text: Dan pemimpin pasukan suku bani Asyer ialah Pagiel, anak Okhran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barisan”, “divisi”, atau “tentara” untuk “pasukan”; kata Ibrani ini menunjuk pada kontingen yang terorganisasi dalam tata perkemahan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: Yang memimpin
  rationale: Dalam rangkaian daftar ini, gabungan konjungsi dan preposisi memperkenalkan orang yang berada ‘atas’ kontingen tersebut. Bahasa Indonesia alami menyatakan fungsi itu dengan ‘yang memimpin’ tanpa mengubah hubungan administratifnya.
- source_word: צְבָא
  choice: pasukan
  rationale: Dalam konteks tata perjalanan perkemahan Israel, kata ini menunjuk pada kontingen suku yang terorganisasi. ‘Pasukan’ mempertahankan nuansa kelompok teratur dan tersedia sebagai istilah Indonesia yang wajar.
- source_word: מַטֵּה
  choice: suku
  rationale: Di sini kata tersebut berarti unit kesukuan, bukan tongkat secara harfiah.
- source_word: בְּנֵי אָשֵׁר
  choice: bani Asyer
  rationale: Ungkapan konstruk Ibrani secara harfiah berarti ‘anak-anak lelaki Asyer’ dan berfungsi sebagai sebutan bagi keturunannya; ‘bani Asyer’ merupakan bentuk Alkitabiah Indonesia yang ringkas dan lazim untuk nama suku.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן עָכְרָן
  choice: anak Okhran
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara alami sebagai ‘anak’; nama ayah ditransliterasikan, bukan diterjemahkan.
