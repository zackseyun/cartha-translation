  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: id
  text: Jika engkau pergi bersama kami, maka kebaikan apa pun yang akan Yahweh lakukan bagi kami[a], kami pun akan berbuat baik kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kebaikan itu yang akan Yahweh lakukan kepada kami, kami akan berbuat baik kepadamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Jika
  rationale: Ungkapan pembuka ini memperkenalkan syarat. Dalam bahasa Indonesia modern, “jika” menyampaikan fungsi kondisionalnya tanpa mempertahankan ungkapan Ibrani secara kaku.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: engkau pergi bersama kami
  rationale: Kata הָלַךְ dengan עִם di sini berarti menyertai rombongan Israel dalam perjalanan. “Pergi bersama kami” langsung, alami, dan sesuai dengan konteks.
- source_word: וְהָיָה
  choice: maka
  rationale: Kemunculan kedua וְהָיָה menandai akibat dari syarat sebelumnya; “maka” menyatakan hubungan itu dengan jelas.
- source_word: הַטּוֹב הַהוּא
  choice: kebaikan apa pun
  rationale: Frasa ini menunjuk pada kebaikan yang kemudian dijelaskan oleh klausa relatif. “Kebaikan apa pun” menyampaikan cakupan manfaat yang belum dirinci, sedangkan “kebaikan itu” terasa lebih kaku dalam bahasa Indonesia.
- source_word: אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ
  choice: yang Yahweh lakukan bagi kami
  rationale: Bentuk Hifil יֵיטִיב berarti berbuat baik, memperlakukan dengan baik, atau mendatangkan manfaat. “Lakukan bagi kami” mempertahankan kaitan verbal dengan klausa berikutnya tanpa mempersempit jenis kebaikannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: kami pun akan berbuat baik kepadamu
  rationale: Terjemahan ini mempertahankan pengulangan akar יטב dan gagasan timbal balik, tetapi tidak menambahkan kata “kebaikan yang sama”, yang tidak dinyatakan secara eksplisit dalam klausa ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi tersebut tanpa menggantinya dengan gelar atau memilih bentuk tradisional lain.
- issue: Sifat kebaikan yang akan diterima orang yang diajak
  choice: kami pun akan berbuat baik kepadamu
  alternative: kami akan melakukan kebaikan yang sama bagimu
  rationale: Klausa terakhir menjanjikan perlakuan baik sebagai tanggapan atas kebaikan Yahweh kepada Israel, tetapi teks tidak secara eksplisit menyatakan bahwa bentuk atau jumlah kebaikannya harus identik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau” dipakai karena verba Ibrani berbentuk orang kedua maskulin tunggal. Struktur “jika … maka” memperjelas hubungan syarat dan akibat, sedangkan “pun” menandai tanggapan timbal balik tanpa menambahkan gagasan bahwa kebaikannya harus persis sama.
