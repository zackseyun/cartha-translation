  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: id
  text: Lalu orang Israel berangkat dari padang belantara Sinai menurut tahap-tahap perjalanan mereka, dan awan itu berdiam di padang belantara Paran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Dalam kisah perjalanan ini, נסע menunjuk pada tindakan membongkar perkemahan lalu mulai bergerak. “Berangkat” alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan bentuk kekerabatan kolektif dalam bahasa Ibrani tanpa memberi kesan bahwa yang dimaksud hanya anak kandung Israel. Padanan yang lebih idiomatis, “orang Israel,” dicantumkan dalam catatan kaki.
- source_word: לְמַסְעֵיהֶם
  choice: tahap demi tahap
  rationale: Bentuk jamak מַסָּע merujuk pada tahap-tahap atau persinggahan berturut-turut dalam perjalanan. “Tahap demi tahap” menyampaikan makna distributif itu dengan ringkas dan alami.
- source_word: מִמִּדְבַּר סִינָי
  choice: dari padang belantara Sinai
  rationale: מִדְבָּר adalah kawasan liar dan tidak dibudidayakan, bukan selalu gurun pasir. “Padang belantara” mempertahankan cakupan geografis tersebut.
- source_word: וַיִּשְׁכֹּן
  choice: berdiam
  rationale: שׁכן berarti tinggal atau menetap. Dengan awan sebagai subjek, “berdiam” menyatakan bahwa awan berhenti dan tetap hadir di tempat itu tanpa mengurangi nuansa tinggal.
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Artikel tentu menunjuk kembali kepada awan yang sudah dikenal sebagai penuntun Israel dalam konteks sebelumnya.
- source_word: בְּמִדְבַּר פָּארָן
  choice: di padang belantara Paran
  rationale: Menerjemahkan מִדְבָּר secara konsisten sebagai “padang belantara” dan mempertahankan Paran sebagai nama tempat.
theological_decisions:
- issue: Penerjemahan בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; secara harfiah, anak-anak lelaki Israel
  rationale: Bahasa Ibrani memakai ungkapan kekerabatan maskulin secara kolektif. “Bani Israel” mempertahankan corak kekerabatan dan cakupan kolektifnya, sedangkan catatan kaki menjelaskan bentuk sumber serta padanan idiomatisnya tanpa membatasi rombongan kepada laki-laki saja.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Bani Israel” dipilih sebagai ungkapan kolektif yang dikenal luas; “padang belantara” menghindari kesan bahwa wilayah tersebut semata-mata gurun pasir.
