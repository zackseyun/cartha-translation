  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: id
  text: Yang mengepalai rombongan dari suku Isakhar ialah Netaneel anak Zuar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kelompok" atau "barisan" untuk "rombongan" (Ibrani צְבָא), yaitu kelompok suku yang terorganisasi dalam tata perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang memimpin
  rationale: Dalam rumusan daftar ini, וְעַל menyatakan bahwa orang yang disebut ditempatkan atas kelompok tersebut. Bentuk relatif ini alami dalam bahasa Indonesia dan tetap menghubungkan ayat dengan daftar sebelumnya.
- source_word: צְבָא
  choice: pasukan
  rationale: צְבָא di sini menunjuk pada kelompok suku yang terorganisasi dalam tata perjalanan. 'Pasukan' mempertahankan nuansa kelompok yang tersusun, meski konteks langsungnya bukan semata-mata pertempuran.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pengaturan perkemahan dan perjalanan Israel, מַטֵּה berarti unit suku, bukan tongkat secara harfiah.
- source_word: בְּנֵי יִשָׂשכָר
  choice: keturunan Isakhar
  rationale: Secara harfiah berarti 'anak-anak Isakhar', tetapi dalam rumusan kesukuan menunjuk pada para keturunannya; pilihan ini jelas dan alami bagi pembaca Indonesia modern.
- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: בֶּן צוּעָר
  choice: anak Zuar
  rationale: Konstruksi ini menyatakan hubungan ayah-anak secara langsung; bahasa Indonesia tidak memerlukan kata sandang.
