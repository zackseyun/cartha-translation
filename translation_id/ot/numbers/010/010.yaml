  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: id
  text: Pada hari sukacitamu, pada waktu-waktu yang ditetapkan bagimu, dan pada permulaan bulan-bulanmu[a], kamu harus meniup nafiri mengiringi persembahan bakaranmu dan kurban keselamatanmu[b]. Itu semua akan menjadi pengingat bagimu di hadapan Allahmu. Akulah Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada bulan baru.” Secara harfiah, bahasa Ibrani berbunyi “pada permulaan bulan-bulanmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban persekutuanmu.” Istilah Ibrani juga berkaitan dengan damai, keutuhan, dan kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: sukacitamu
  rationale: Kata benda ini menyatakan sukacita atau kegembiraan. “Sukacitamu” alami dalam bahasa Indonesia dan tetap sesuai dengan susunan daftar perayaan.
- source_word: מוֹעֲדֵיכֶם
  choice: waktu-waktu yang ditetapkan bagimu
  rationale: מוֹעֵד dapat berarti waktu atau pertemuan yang ditetapkan dan, dalam konteks ibadah, sering menunjuk pada hari raya. Pilihan ini mempertahankan keluasan maknanya tanpa membatasinya hanya pada hari raya.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: awal bulan-bulanmu
  rationale: Ungkapan Ibrani secara harfiah berarti “kepala/awal bulan-bulanmu.” Bentuk ini mempertahankan ungkapan kalender Ibrani; konteksnya dapat menunjuk pada bulan baru.
- source_word: וּתְקַעְתֶּם בַּחֲצֹצְרֹת
  choice: kamu harus meniup nafiri-nafiri itu
  rationale: תקע dalam konteks חֲצֹצְרֹת berarti meniup atau membunyikan alat tersebut. “Nafiri” sesuai untuk trompet ritual yang telah diperkenalkan sebelumnya, tanpa menambahkan bahan peraknya yang tidak disebut ulang dalam ayat ini.
- source_word: עַל עֹלֹתֵיכֶם
  choice: mengiringi persembahan bakaranmu
  rationale: עַל di sini menyatakan hubungan trumpet-blowing dengan tindakan persembahan. “Mengiringi” menyampaikan fungsi ritual itu secara alami dalam bahasa Indonesia tanpa menuntut gambaran ruang yang kaku.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: kurban keselamatanmu
  rationale: שְׁלָמִים adalah istilah kurban yang berkaitan dengan damai, keutuhan, dan kesejahteraan. “Kurban keselamatan” merupakan istilah Alkitabiah Indonesia yang dikenal; alternatif “kurban persekutuan” dicatat agar dimensi komunalnya tidak hilang.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: Itu semua akan menjadi pengingat bagimu
  rationale: Bentuk jamak Ibrani menunjuk kembali secara terbuka pada unsur-unsur ritual yang baru disebut. “Itu semua” mempertahankan rujukan yang tidak sepenuhnya ditentukan, sedangkan “pengingat” menyampaikan fungsi memorial di hadapan Allah.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: di hadapan Allahmu
  rationale: לִפְנֵי berarti “di depan/di hadapan,” yakni dalam kehadiran Allah; ungkapan ini tepat dan alami dalam konteks ibadah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama, bukan menggantinya dengan gelar.
- issue: Penerjemahan istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan
  rationale: Istilah Ibrani mencakup gagasan damai, keutuhan, kesejahteraan, dan persekutuan dalam jamuan kurban. Pilihan utama mempertahankan istilah kurban yang dikenal dalam bahasa Indonesia, sedangkan catatan kaki mengakui alternatif yang menonjolkan dimensi persekutuan.
- issue: Rujukan bentuk jamak וְהָיוּ
  choice: Itu semua
  alternative: nafiri-nafiri itu atau bunyi nafiri itu
  rationale: Bentuk Ibrani tidak menyebut ulang nomina acuannya. Terjemahan tidak menetapkan secara tegas apakah yang menjadi pengingat adalah nafiri, bunyinya, atau keseluruhan tindakan ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk orang kedua tunggal kolektif dipakai untuk Israel sesuai sufiks Ibrani jamak yang menyapa umat sebagai kelompok. “Kamu” dipilih agar mudah dipahami pembaca umum; struktur daftar dan ketegangan leksikal istilah ritual tetap dipertahankan.
