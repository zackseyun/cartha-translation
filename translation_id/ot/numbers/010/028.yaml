  text: אֵ֛לֶּה מַסְעֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/צִבְאֹתָ֑/ם וַ/יִּסָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/028.yaml
  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: id
  text: Itulah tahap-tahap perjalanan keturunan Israel menurut pasukan mereka[a]; lalu mereka berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut rombongan-rombongan mereka” atau “menurut bala tentara mereka.” Bahasa Ibrani menunjuk kelompok-kelompok yang ditata untuk bergerak bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Kata tunjuk jamak ini merangkum urutan keberangkatan yang baru saja dipaparkan. Dalam konteks naratif retrospektif, “Itulah” terdengar alami meskipun bahasa Ibrani tidak memakai kopula eksplisit.
- source_word: מַסְעֵי
  choice: tahap-tahap perjalanan
  rationale: Bentuk jamak konstruksi dari מַסָּע dapat menunjuk perjalanan, keberangkatan, atau tahapan gerak. “Tahap-tahap perjalanan” paling jelas menyampaikan rangkaian perpindahan dalam perjalanan di padang gurun.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan harfiah “anak-anak lelaki Israel” berfungsi sebagai sebutan kolektif bagi umat Israel. “Keturunan Israel” mempertahankan unsur kekerabatan tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan mereka
  rationale: צְבָאוֹת menunjuk kelompok-kelompok yang terorganisasi untuk bergerak atau berbaris. “Pasukan” mempertahankan nuansa tatanan seperti militer tanpa menyatakan bahwa mereka sedang bertempur.
- source_word: וַיִּסָּעוּ
  choice: lalu mereka berangkat
  rationale: Bentuk naratif dari נסע menyatakan dimulainya perpindahan dari suatu tempat. “Lalu mereka berangkat” alami dalam bahasa Indonesia dan mencerminkan urutan narasi.
