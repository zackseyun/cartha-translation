  source_fidelity: 'Teks Indonesia dengan setia mencerminkan semua unsur utama Ibrani: demonstratif rangkuman (אֵלֶּה), rangkaian tahap/perjalanan (מַסְעֵי), בני ישראל sebagai kelompok Israel, pengaturan menurut צִבְאֹתָם, dan tindakan berangkat (וַיִּסָּעוּ). “Pasukan mereka” secara wajar mempertahankan nuansa organisasi yang tertata dan berkonotasi militer dari צְבָאוֹת, tanpa menambahkan klaim tentang pertempuran.'
