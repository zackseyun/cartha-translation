id: NUM.10.22
reference: Numbers 10:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: id
  text: Kemudian panji perkemahan keturunan Efraim berangkat menurut pasukan-pasukan mereka[a], dan yang memimpin pasukannya ialah Elisama anak Amihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut rombongan-rombongan mereka.” Kata Ibrani ini menggambarkan kelompok-kelompok terorganisasi dengan corak militer dalam perkemahan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kemudian ... berangkat
  rationale: Waw dengan bentuk qatal melanjutkan urutan narasi; 'kemudian' menyatakan rangkaian peristiwa, sedangkan 'berangkat' wajar dalam konteks perjalanan perkemahan.
- source_word: דֶּגֶל
  choice: panji
  rationale: Istilah ini menunjuk pada panji suku yang menjadi tanda kesatuan perkemahan saat bergerak; 'panji' alami dan bermartabat dalam bahasa Indonesia.
- source_word: מַחֲנֵה
  choice: perkemahan
  rationale: Dalam rangkaian konstruksi dengan דֶּגֶל, kata ini menyebut unit perkemahan yang berada di bawah panji tersebut.
- source_word: בְנֵי אֶפְרַיִם
  choice: keturunan Efraim
  rationale: Ungkapan Ibrani harfiah 'anak-anak lelaki Efraim' merupakan sebutan kesukuan; 'keturunan Efraim' menyampaikan makna itu secara alami tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: צָבָא di sini menunjuk pada kelompok-kelompok terorganisasi dengan corak militer dalam tata perjalanan Israel; bentuk jamak sumber dipertahankan.
- source_word: וְעַל צְבָאוֹ
  choice: dan yang memimpin pasukannya ialah
  rationale: עַל menyatakan kedudukan di atas atau kepemimpinan, sedangkan akhiran tunggal merujuk pada pasukan unit perkemahan Efraim.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama anak Amihud
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan בֶּן diterjemahkan secara langsung sebagai 'anak'.
theological_decisions: []
