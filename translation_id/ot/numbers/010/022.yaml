  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat mempertahankan urutan gerak lalu penyebutan pemimpin. 'Keturunan Efraim' dipilih sebagai sebutan kesukuan yang alami; 'pasukan-pasukan' menjaga nuansa organisasi militer tanpa mengharuskan konteks pertempuran.
