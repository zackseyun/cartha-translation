  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: id
  text: Namun, ia berkata kepadanya, “Aku tidak akan pergi. Sebaliknya, aku akan pergi ke negeriku sendiri dan kepada kaum kerabatku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: 'Dalam konteks penolakan yang diikuti pilihan lain, ungkapan ini menyatakan pertentangan: bukan pergi bersama mereka, melainkan kembali ke negerinya.'
- source_word: מוֹלַדְתִּי
  choice: kaum kerabatku
  rationale: Kata ini dapat menunjuk tempat kelahiran atau lingkungan asal/kaum keluarga. Karena אַרְצִי sudah diterjemahkan sebagai “negeriku”, pilihan “kaum kerabatku” mempertahankan unsur sosial-kekeluargaan dan menghindari pengulangan makna tempat.
