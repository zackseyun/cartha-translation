  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: id
  text: Lalu mereka berangkat dari gunung Yahweh sejauh tiga hari perjalanan[a], dan tabut perjanjian Yahweh bergerak di depan mereka sejauh tiga hari perjalanan untuk mencari[b] tempat perhentian bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perjalanan tiga hari”; ungkapan yang sama muncul dua kali dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjelajahi untuk menemukan” atau “mencari-cari”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: mereka berangkat
  rationale: Dalam konteks perpindahan perkemahan, נסע berarti membongkar kemah lalu mulai bergerak. “Berangkat” menyampaikan awal perjalanan secara wajar dalam bahasa Indonesia.
- source_word: מֵהַר יְהוָה
  choice: dari gunung Yahweh
  rationale: הַר berarti “gunung”, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” agar nama pribadi itu tetap tampak.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: perjalanan tiga hari / selama tiga hari perjalanan
  rationale: Ungkapan ini menunjukkan ukuran atau jarak perjalanan yang lazim ditempuh dalam tiga hari. Variasi kecil dalam susunan kalimat menghindari kekakuan tanpa menghapus pengulangan sumber.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: dan tabut perjanjian Yahweh
  rationale: Terjemahan ini mempertahankan hubungan konstruksi Ibrani secara ringkas dan alami.
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: bergerak di depan mereka
  rationale: Partisipel נֹסֵעַ menggambarkan tindakan yang sedang berlangsung, dan לִפְנֵיהֶם menyatakan posisi di depan rombongan.
- source_word: לָתוּר
  choice: untuk mencarikan
  rationale: תור dapat berarti menjelajahi, menyelidiki, atau mencari. Dalam konteks ini tujuannya ialah menemukan lokasi perhentian, bukan memata-matai musuh.
- source_word: מְנוּחָה
  choice: tempat beristirahat
  rationale: Dalam konteks perjalanan, kata ini paling wajar dipahami secara konkret sebagai tempat untuk berhenti dan beristirahat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Tabut bergerak di depan umat
  choice: dipertahankan secara langsung tanpa penjelasan tambahan
  alternative: menjelaskan mekanisme pemindahan tabut atau menyelaraskannya dengan keterangan urutan barisan di bagian lain
  rationale: Ayat ini menyatakan bahwa tabut berada di depan mereka untuk mencarikan tempat beristirahat. Terjemahan tidak menambahkan harmonisasi yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan “tiga hari perjalanan” dipertahankan karena terdapat dalam teks Ibrani, sementara susunan kedua kemunculannya dibuat sedikit lebih alami dalam bahasa Indonesia.
