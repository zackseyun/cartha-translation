  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: id
  text: Dan yang memimpin pasukan[a] suku keturunan Simeon ialah Selumiel anak Zurisyadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompok” atau “divisi” untuk “pasukan” (Ibrani צְבָא), yaitu kelompok suku yang terorganisasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang memimpin
  rationale: Dalam konteks urutan perjalanan, עַל menyatakan bahwa orang yang disebut ditempatkan sebagai pemimpin atas kelompok suku tersebut. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan sintaksis dengan ayat-ayat sekitar.
- source_word: צְבָא
  choice: pasukan
  rationale: Kata ini menunjuk pada kelompok suku yang terorganisasi dalam perjalanan Israel. 'Pasukan' mempertahankan nuansa kelompok teratur, meskipun tidak harus menyiratkan pertempuran aktif.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pengaturan perkemahan dan perjalanan Israel, kata ini secara kontekstual berarti unit suku.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: keturunan Simeon
  rationale: Ungkapan harfiahnya 'anak-anak lelaki Simeon', tetapi di sini merupakan sebutan kolektif bagi kelompok keturunannya; 'keturunan Simeon' menyampaikan maksud itu secara alami dalam bahasa Indonesia.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam patronimik langsung, 'anak' adalah padanan yang ringkas dan jelas.
- source_word: צוּרִי שַׁדָּי
  choice: Zurisyadai
  rationale: Nama pribadi majemuk ditransliterasikan sebagai satu nama menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami tanpa menghilangkan fungsi kepemimpinan yang dinyatakan oleh עַל. Istilah 'pasukan' mengikuti konteks rombongan suku yang tersusun, bukan dengan sendirinya pasukan yang sedang bertempur.
