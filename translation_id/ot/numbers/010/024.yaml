  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעוֹנִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: id
  text: Yang memimpin pasukan suku bani Benyamin ialah Abidan anak Gideoni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laskar” atau “barisan”; istilah Ibrani ini dapat menunjuk pada kelompok terorganisasi dengan tata seperti pasukan militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang memimpin
  rationale: Dalam rangkaian daftar ini, frasa tersebut menandai orang yang ditempatkan di atas atau mengepalai pasukan. Bentuk ini alami dalam bahasa Indonesia dan menyampaikan hubungan kepemimpinan tanpa perlu mempertahankan kata sambung Ibrani secara kaku.
- source_word: צְבָא
  choice: pasukan
  rationale: Istilah ini menunjuk pada kelompok yang terorganisasi menurut tata barisan, dengan nuansa militer; 'pasukan' merupakan padanan Indonesia yang jelas, sedangkan cakupannya dijelaskan dalam catatan kaki.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks sensus dan tata perjalanan Israel, kata ini menunjuk pada satuan kesukuan, bukan tongkat secara harfiah.
- source_word: בְּנֵי בִנְיָמִן
  choice: bani Benyamin
  rationale: '''Bani Benyamin'' mempertahankan bentuk genealogis ''anak-anak/keturunan Benyamin'' dalam ungkapan Indonesia yang ringkas, lazim, dan bermartabat.'
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Nama pribadi ditransliterasikan secara langsung dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן גִּדְעוֹנִי
  choice: anak Gideoni
  rationale: Padanan alami untuk keterangan patronimik Ibrani, yang mengidentifikasi Abidan melalui nama ayahnya.
