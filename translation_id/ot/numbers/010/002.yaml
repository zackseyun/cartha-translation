  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: id
  text: Buatlah bagimu dua trompet perak; buatlah keduanya dari perak yang ditempa. Keduanya akan menjadi sarana bagimu untuk memanggil jemaah dan untuk keberangkatan perkemahan-perkemahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Buatlah bagimu
  rationale: Mempertahankan imperatif dan unsur לְךָ, yang menunjukkan bahwa trompet itu dibuat untuk digunakan atau berada dalam tanggung jawab Musa.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: dua trompet perak
  rationale: חֲצֹצְרָה menunjuk pada trompet lurus, bukan sangkakala dari tanduk; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: מִקְשָׁה תַּעֲשֶׂה אֹתָם
  choice: keduanya harus kaubuat dari perak tempaan
  rationale: מִקְשָׁה menyatakan pengerjaan logam dengan cara ditempa. Penyebutan kembali 'perak' membuat hasilnya alami dalam bahasa Indonesia tanpa mengubah bahan yang sudah disebut.
- source_word: וְהָיוּ לְךָ
  choice: Trompet-trompet itu harus kaugunakan
  rationale: Konstruksi ini menyatakan fungsi bagi Musa, bukan sekadar kepemilikan; bentuk aktif ini lebih alami dalam bahasa Indonesia.
- source_word: לְמִקְרָא הָעֵדָה
  choice: untuk memanggil jemaah berkumpul
  rationale: מִקְרָא di sini adalah pemanggilan atau penghimpunan, sedangkan הָעֵדָה ialah jemaah/komunitas Israel. 'Berkumpul' memperjelas tujuan panggilan tanpa menambah muatan teologis.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: dan untuk memberi tanda agar perkemahan-perkemahan berangkat
  rationale: מַסַּע dapat berarti keberangkatan atau tindakan mulai berjalan. Rumusan ini menyampaikan fungsi trompet sebagai tanda bagi berbagai perkemahan untuk mulai berangkat dan tetap mempertahankan bentuk jamak הַמַּחֲנוֹת.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Trompet' dipilih untuk membedakannya dari sangkakala berbahan tanduk; 'jemaah' mempertahankan pengertian komunitas yang dihimpun. Bentuk ulang 'perkemahan-perkemahan' dipertahankan karena teks Ibrani memakai bentuk jamak dan mengacu pada kelompok-kelompok perkemahan yang berangkat secara teratur.
