  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: id
  text: Dan awan Yahweh ada di atas mereka pada siang hari ketika mereka berangkat dari perkemahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲנַן
  choice: Dan awan
  rationale: עָנָן berarti “awan”; waw diterjemahkan “Dan” untuk mempertahankan hubungan naratif dengan ayat sebelumnya. Konstruksi dengan nama ilahi membuat acuannya tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: עֲלֵי/הֶם
  choice: berada di atas mereka
  rationale: Preposisi עַל dengan sufiks pronominal menyatakan posisi di atas atau pada mereka. “Di atas mereka” paling alami untuk gambaran awan tersebut.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Adverbia יוֹמָם berarti “pada siang hari”; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: בְּ/נָסְעָ/ם
  choice: ketika mereka berangkat
  rationale: Infinitif konstruk נסע dengan בְּ memiliki fungsi temporal, secara harfiah “ketika mereka berangkat”; kata “berangkat” mempertahankan tindakan meninggalkan tempat perkemahan untuk melanjutkan perjalanan.
- source_word: מִן הַ/מַּחֲנֶה
  choice: dari perkemahan
  rationale: מַחֲנֶה menunjuk pada tempat berkemah Israel. “Dari perkemahan” merupakan padanan Indonesia yang ringkas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan hubungan naratif serta citra spasial teks Ibrani tanpa memperjelas fungsi awan secara berlebihan.
