  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Nafiri' dipertahankan sebagai istilah yang tepat bagi nafiri logam dalam konteks ibadah Israel; penyebutan 'kedua' mengungkapkan rujukan pronomina feminin jamak kepada dua nafiri perak pada ayat sebelumnya.
