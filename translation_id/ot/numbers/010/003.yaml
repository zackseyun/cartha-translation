  text: Apabila nafiri itu ditiup, seluruh umat akan berkumpul menghadap engkau di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתָקְעוּ בָהֵן
  choice: Apabila kedua nafiri itu ditiup
  rationale: 'Dalam rangkaian petunjuk ini, bentuk verba berfungsi temporal: bunyi kedua nafiri menjadi isyarat bagi umat untuk berkumpul. Bentuk pasif alami dalam bahasa Indonesia dan memperjelas bahwa בָהֵן merujuk kepada kedua nafiri perak pada ayat sebelumnya.'
- source_word: וְנוֹעֲדוּ
  choice: harus berkumpul
  rationale: Bentuk Nifal dari יעד di sini menyatakan berkumpul sebagai tanggapan terhadap panggilan atau isyarat. 'Harus' menyampaikan daya instruksional dalam konteks peraturan.
- source_word: אֵלֶיךָ
  choice: menghadap engkau
  rationale: Secara harfiah berarti 'kepadamu', tetapi dalam konteks pertemuan umat di hadapan Musa, 'menghadap engkau' menyatakan gerak sekaligus kehadiran di hadapannya tanpa mengubah acuannya.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel secara kolektif. 'Seluruh umat' alami dalam bahasa Indonesia modern dan mempertahankan cakupan keseluruhannya.
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: Menunjuk pada tempat masuk atau bukaan kemah; 'pintu masuk' jelas dan alami bagi pembaca modern.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan mudah dikenali untuk nama tempat kudus tempat pertemuan yang ditetapkan berlangsung.
