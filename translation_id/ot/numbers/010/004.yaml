  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: id
  text: Namun, jika hanya satu sangkakala ditiup, para pemimpin, yaitu para kepala ribuan Israel[a], akan berkumpul kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kepala ribuan Israel.” Ungkapan ini kemungkinan menunjuk kepada para pemimpin atas satuan-satuan “seribu” di Israel; sebagian terjemahan menafsirkannya sebagai “para kepala kaum-kaum Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Namun, jika
  rationale: Menyatakan syarat yang berkontras dengan perintah sebelumnya, ketika kedua sangkakala ditiup.
- source_word: בְּ/אַחַת יִתְקָעוּ
  choice: mereka meniup satu sangkakala saja
  rationale: Secara harfiah berarti ‘mereka meniup dengan satu’; nomina ‘sangkakala’ dipulihkan dari konteks, sedangkan ‘saja’ memperjelas kontras dengan peniupan kedua sangkakala tanpa mengubah maksud.
- source_word: וְ/נוֹעֲדוּ אֵלֶי/ךָ
  choice: harus berkumpul kepadamu
  rationale: Bentuk Niphal dari יעד dalam konteks ini menunjuk pada berkumpul sebagai tanggapan atas panggilan yang ditetapkan; ‘kepadamu’ mempertahankan arah gerak kepada Musa.
- source_word: הַ/נְּשִׂיאִים
  choice: para pemimpin
  rationale: Istilah ini menunjuk kepada para kepala atau pemuka Israel; ‘pemimpin’ jelas dan wajar dalam bahasa Indonesia modern tanpa menyiratkan gelar kerajaan.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: para kepala kelompok-kelompok seribu orang Israel
  rationale: Mempertahankan istilah Ibrani ‘ribuan’ sebagai sebutan bagi satuan sosial, administratif, atau militer, sambil merumuskannya secara cukup alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur ayat mempertahankan hubungan apposisi antara ‘para pemimpin’ dan ‘para kepala kelompok-kelompok seribu orang Israel’. Penanda catatan kaki ditempatkan pada ungkapan yang dijelaskannya.
