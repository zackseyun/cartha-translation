  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: id
  text: Yang memimpin pasukan suku keturunan Manasye ialah Gamaliel putra Pedazur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pasukan” juga dapat berarti “bala tentara” atau “divisi”; di sini yang dimaksud ialah kontingen suku yang terorganisasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang memimpin
  rationale: Dalam rumus berulang tentang urutan perjalanan perkemahan, עַל menunjukkan orang yang ditempatkan sebagai pemimpin suatu kesatuan suku. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan fungsi tersebut.
- source_word: צְבָא
  choice: pasukan
  rationale: Di sini kata ini menunjuk pada kontingen suku yang terorganisasi dalam perjalanan, dengan nuansa kemiliteran tetapi tidak terbatas pada pertempuran.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks kitab Bilangan, kata ini menunjuk pada kesatuan suku, bukan tongkat.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: keturunan Manasye
  rationale: Ungkapan harfiahnya 'anak-anak lelaki Manasye', tetapi dalam sebutan suku frasa ini mencakup garis keturunannya; 'keturunan Manasye' jelas dan wajar bagi pembaca Indonesia.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Penghubung silsilah ini secara khusus menyatakan bahwa Gamaliel adalah putra Pedazur; 'anak' merupakan bentuk ringkas dan idiomatis dalam nama silsilah Indonesia.
- source_word: פְּדָה צוּר
  choice: Pedazur
  rationale: Dua unsur grafis dalam teks merupakan satu nama pribadi, yang ditransliterasikan sebagai Pedazur menurut bentuk lazim Indonesia.
