  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk perintah dipakai untuk menyampaikan ketentuan kepada kelompok orang kedua jamak. Istilah teknis bagi bunyi trompet dijelaskan tanpa menentukan bahwa bunyi itu selalu menandakan bahaya.
