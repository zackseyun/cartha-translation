  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: id
  text: Ketika kalian mengumpulkan umat, tiuplah trompet, tetapi jangan membunyikan tiupan semboyan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan meniup tiupan semboyan.” Kata Ibrani membedakan tiupan biasa dari bunyi isyarat khusus yang dalam konteks sekitarnya dipakai sebagai tanda untuk berangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַקְהִיל
  choice: Namun, ketika kalian menghimpun
  rationale: Bentuk infinitif Hifil dengan prefiks בְּ menyatakan waktu, sedangkan וּ menghubungkan ayat ini secara kontras dengan tanda untuk berangkat dalam konteks sebelumnya. Subjek orang kedua jamak dinyatakan secara wajar dengan “kalian”.
- source_word: הַקָּהָל
  choice: umat
  rationale: קָהָל menunjuk pada komunitas Israel yang dihimpun. “Umat” alami dalam konteks komunal-keagamaan dan tidak mengacaukan orang-orang yang berkumpul dengan tindakan berkumpul.
- source_word: תִּתְקְעוּ
  choice: tiuplah trompet
  rationale: תקע di sini berarti meniup trompet. Walaupun objeknya tidak diulangi dalam ayat Ibrani ini, trompet disebut dengan jelas dalam konteks langsung; penyebutannya menghasilkan bahasa Indonesia yang alami dan tidak mengubah acuannya.
- source_word: וְלֹא תָרִיעוּ
  choice: tetapi jangan membunyikan tanda bahaya
  rationale: Dalam konteks trompet, bentuk Hifil dari רוע menunjuk pada bunyi isyarat khusus yang dibedakan dari tiupan biasa. “Tanda bahaya” mempertahankan sifat isyarat teknis itu, sedangkan “tetapi jangan” menyatakan kontras secara alami.
