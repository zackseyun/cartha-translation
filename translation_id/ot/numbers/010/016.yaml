  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: id
  text: Pemimpin pasukan suku Zebulon ialah Eliab anak Helon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bala tentara” atau “divisi” untuk “pasukan”; kata Ibrani צְבָא menunjuk pada kontingen suku yang terorganisasi dalam susunan perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang memimpin
  rationale: Dalam rumusan daftar ini, וְ menghubungkan ayat dengan unsur sebelumnya, sedangkan עַל dengan verba yang tersirat menyatakan wewenang atas pasukan. Bahasa Indonesia lebih alami dengan mengungkapkan verba tersirat itu sebagai 'memimpin'.
- source_word: צְבָא
  choice: pasukan
  rationale: Dalam konteks perjalanan di padang gurun, kata ini menunjuk pada kontingen suku yang terorganisasi dalam tata gerak. 'Pasukan' wajar dalam bahasa Indonesia dan mempertahankan nuansa kemiliterannya tanpa harus berarti tentara tetap.
- source_word: מַטֵּה
  choice: suku
  rationale: Di sini kata tersebut menunjuk pada kesatuan sosial-politik Israel, bukan tongkat secara harfiah.
- source_word: בְּנֵי זְבוּלֻן
  choice: bani Zebulon
  rationale: Ungkapan ini secara harfiah berarti 'anak-anak lelaki Zebulon' dan dalam rumusan kesukuan menunjuk pada keturunannya. 'Bani Zebulon' merupakan ungkapan Indonesia yang ringkas, bermartabat, dan mempertahankan bentuk genealogisnya.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן חֵלֹן
  choice: anak Helon
  rationale: Konstruksi patronimik Ibrani ini diterjemahkan secara langsung dan alami sebagai 'anak Helon'.
