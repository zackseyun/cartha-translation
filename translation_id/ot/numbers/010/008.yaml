    rationale: וְהָיוּ adalah bentuk jamak, tetapi subjeknya dalam rumusan hukum ini dapat dipahami secara rangkuman. “Semua ini” mempertahankan fungsi rangkuman tanpa menyiratkan suatu kumpulan benda yang tidak ditentukan, dan “akan menjadi” lebih cocok dengan bentuk futurum legal Ibrani daripada pengulangan “harus.”
  - severity: low
    issue: “Anak-anak lelaki Harun” agak kaku dalam bahasa Indonesia modern.
    rationale: Walaupun secara leksikal dapat dipertahankan, “anak-anak Harun, para imam” lebih alami. Konteks dan aposisi “para imam” tetap menunjukkan kelompok laki-laki yang dimaksud tanpa menambah atau mengurangi makna.
