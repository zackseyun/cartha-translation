base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: id
  text: Anak-anak Harun, para imam, harus meniup nafiri-nafiri itu. Semua ini akan menjadi ketetapan yang berlaku seterusnya[a] bagi kamu turun-temurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketetapan untuk selamanya” atau “ketetapan kekal.”'
    reason: Menampilkan kemungkinan terjemahan lain bagi חֻקַּת עוֹלָם dan mempertahankan rentang makna עוֹלָם.
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: Anak-anak lelaki Harun
  rationale: בְּנֵי secara harfiah berarti ‘anak-anak lelaki dari’. Bentuk ini mempertahankan hubungan keluarga yang dinyatakan sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים
  choice: yaitu para imam
  rationale: Frasa ini menjelaskan secara aposisional bahwa anak-anak lelaki Harun yang dimaksud adalah para imam; ‘yaitu’ membuat hubungan itu jelas dan alami.
- source_word: יִתְקְעוּ
  choice: harus meniup
  rationale: Dalam konteks peraturan, bentuk imperfek ini menyatakan kewajiban. Dengan objek nafiri, תָּקַע berarti ‘meniup’ atau ‘membunyikan’.
- source_word: בַּחֲצֹצְרֹת
  choice: nafiri-nafiri itu
  rationale: חֲצֹצְרֹת adalah nafiri atau trompet. Bentuk ulang mempertahankan jamak, sedangkan ‘itu’ merujuk pada nafiri yang telah diperintahkan untuk dibuat dalam konteks langsung. Kata ‘perak’ tidak ditambahkan karena tidak muncul dalam ayat ini.
- source_word: וְהָיוּ לָכֶם
  choice: Semuanya itu harus menjadi ... bagi kamu
  rationale: Kata kerja sumber berbentuk jamak, tetapi rujukannya merangkum ketentuan sebelumnya dan tidak sepenuhnya eksplisit. ‘Semuanya itu’ mempertahankan unsur jamak tanpa memaksakan nafiri sebagai satu-satunya anteseden.
- source_word: לְחֻקַּת עוֹלָם
  choice: ketetapan yang berlaku seterusnya
  rationale: Ungkapan hukum ini menyatakan keberlakuan yang terus berlangsung. Pilihan ini alami dalam bahasa Indonesia dan tidak secara diam-diam memutuskan apakah עוֹלָם harus dipahami sebagai durasi panjang atau kekekalan mutlak.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang ringkas dan lazim untuk keberlakuan sepanjang generasi-generasi berikutnya.
theological_decisions:
- issue: Cakupan waktu חֻקַּת עוֹלָם
  choice: ketetapan yang berlaku seterusnya
  alternative: ketetapan untuk selamanya; ketetapan kekal
  rationale: עוֹלָם dapat menyatakan keberlangsungan yang sangat panjang atau keberlakuan abadi menurut konteks. Terjemahan utama menjaga daya hukum yang berkelanjutan tanpa menjadikan salah satu penafsiran teologis sebagai satu-satunya kemungkinan.
- issue: Rujukan bentuk jamak וְהָיוּ
  choice: Semuanya itu
  alternative: nafiri-nafiri itu; hal itu
  rationale: Bentuk sumber adalah jamak, tetapi hubungan sintaksis dan semantisnya dengan unsur sebelumnya tidak sepenuhnya tegas. ‘Semuanya itu’ mempertahankan bentuk rangkuman jamak dan tidak mempersempit rujukannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Nafiri’ dipilih karena tepat untuk alat tiup logam dalam konteks ritual dan masih mudah dipahami dalam ragam Alkitab; struktur kalimat dipecah menjadi dua agar peraturan terbaca jelas.
