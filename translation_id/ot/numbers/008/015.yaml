base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: id
  text: Sesudah itu, orang Lewi akan datang untuk melayani di Kemah Pertemuan. Engkau akan mentahirkan mereka[a] dan mengunjukkan mereka sebagai persembahan unjukan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyucikan mereka.” Kata kerja Ibrani ini digunakan untuk pentahiran ritual.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mengunjukkan mereka secara seremonial di hadapan TUHAN sebagai persembahan unjukan.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Menandai urutan waktu dengan jelas dan alami dalam bahasa Indonesia, yaitu tahap yang menyusul upacara pentahbisan sebelumnya.
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: orang-orang Lewi harus datang
  rationale: Bentuk ini menyampaikan tindakan mendatang dalam konteks perintah, sedangkan bentuk ulang 'orang-orang' wajar untuk menyebut kelompok tersebut dalam bahasa Indonesia.
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: untuk melayani di Kemah Pertemuan
  rationale: Kata עבד dalam konteks ibadah menunjuk pada pelayanan atau pekerjaan resmi. Preposisi 'di' menghasilkan ungkapan Indonesia yang alami untuk pelayanan yang berkaitan dengan Kemah Pertemuan tanpa menjadikan kemah itu seolah-olah penerima pelayanan.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: Engkau harus mentahirkan mereka
  rationale: טהר di sini menunjuk pada pentahiran ritual. 'Mentahirkan' mempertahankan nuansa seremonial dengan istilah yang dikenal dalam ragam Alkitabiah Indonesia.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: dan mengunjukkan mereka sebagai persembahan unjukan
  rationale: Ungkapan ini mempertahankan istilah ritual dan fakta mencolok bahwa orang-orang Lewi sendiri menjadi objek tindakan tersebut. 'Mengunjukkan' lebih tepat dalam konteks ibadah daripada gambaran harfiah yang janggal seperti 'mengayun-ayunkan mereka'.
theological_decisions:
- issue: Bahasa ritual dalam penahbisan orang Lewi
  choice: Mempertahankan istilah khusus 'mentahirkan' dan 'persembahan unjukan'.
  alternative: Memparafrasakan sebagai 'menyucikan dan mempersembahkan mereka' atau meringkasnya menjadi 'menahbiskan mereka'.
  rationale: Ayat ini menggambarkan tindakan ritual tertentu, bukan sekadar pengangkatan umum untuk bertugas. Istilah khusus menjaga kerangka pentahiran dan persembahan tanpa memasukkan kategori teologis dari masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kemah Pertemuan', 'mentahirkan', dan 'persembahan unjukan' dipakai sebagai istilah ibadah yang mapan; struktur kalimat dibuat langsung dan mudah dipahami.
