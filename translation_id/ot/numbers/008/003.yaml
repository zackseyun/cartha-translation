base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: id
  text: 'Harun pun melakukannya: ia menata pelita-pelitanya[b] agar menghadap ke bagian depan kaki pelita[a], tepat seperti yang diperintahkan Yahweh kepada Musa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhadapan dengan bagian depan” atau “mengarah ke bagian depan” kaki pelita.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyalakan pelita-pelitanya”. Kata kerja Ibrani secara harfiah dapat berarti menyebabkan pelita-pelita itu naik, yang dalam konteks ini dapat menunjuk pada penataan atau penyalaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן אַהֲרֹן
  choice: Harun pun melakukannya
  rationale: Ungkapan ini menyatakan bahwa Harun bertindak sesuai dengan petunjuk sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi penyambung narasi.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: menghadap ke bagian depan kaki pelita
  rationale: Gabungan preposisi ini menunjukkan arah atau orientasi menuju bagian muka/depan kaki pelita tanpa menetapkan geometri ruang secara berlebihan.
- source_word: הַמְּנוֹרָה
  choice: kaki pelita
  rationale: Istilah ini menerjemahkan benda perlengkapan Kemah Suci secara jelas dan lazim, alih-alih mentransliterasikannya sebagai menorah.
- source_word: הֶעֱלָה
  choice: ia memasang
  rationale: Bentuk Hifil dari עלה secara harfiah menyatakan menyebabkan naik dan, ketika digunakan untuk pelita, dapat menunjuk pada pemasangan atau penyalaan. Dalam konteks petunjuk tentang arah cahaya, 'memasang' mempertahankan fokus pada penempatan sambil mencatat kemungkinan 'menyalakan' dalam catatan kaki.
- source_word: נֵרֹתֶיהָ
  choice: pelita-pelitanya
  rationale: נֵר menunjuk pada pelita, dan akhiran feminin tunggal merujuk kepada kaki pelita; bentuk ulang menyatakan jamak dengan alami.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: Klausa ini menekankan kesesuaian penuh dengan perintah ilahi; 'tepat seperti' menyampaikan penekanan tersebut secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani menggunakan Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama diri Allah tanpa menggantinya dengan gelar.
- issue: Makna הֶעֱלָה dalam hubungan dengan pelita
  choice: memasang
  alternative: menyalakan
  rationale: Konteks langsung menyoroti orientasi pelita sesuai perintah pada ayat sebelumnya, tetapi verba Ibrani juga dapat dipahami sebagai tindakan menyalakan. Ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. 'Kaki pelita' dipilih sebagai istilah konkret yang mudah dipahami. Penanda catatan kaki ditempatkan langsung setelah frasa yang memiliki dua ambiguitas leksikal.
