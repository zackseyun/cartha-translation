base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/005.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Yahweh[a] berfirman kepada Musa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif dari דבר memperkenalkan ujaran ilahi. Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan padanan alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang menerima firman; “kepada” adalah padanan Indonesia yang alami, dan מֹשֶׁה mengikuti bentuk nama Indonesia yang baku, “Musa”.
- source_word: לֵאמֹר
  choice: '[ditandai dengan koma sebagai pengantar tuturan langsung]'
  rationale: Infinitif ini adalah formula pengantar bagi isi ucapan yang menyusul. Dalam bahasa Indonesia, koma pada akhir klausa secara alami menjalankan fungsi tersebut; menerjemahkannya secara eksplisit sebagai “dengan berkata” akan terasa kaku dan berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar; catatan kaki memberi tahu pembaca tentang bentuk Ibrani dan terjemahan tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Formula ujaran ilahi diterjemahkan secara alami; tanda koma mempertahankan fungsi לֵאמֹר sebagai pengantar bagi perkataan pada ayat berikutnya.
