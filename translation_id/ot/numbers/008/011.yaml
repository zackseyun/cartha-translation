  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: id
  text: Harun harus mempersembahkan orang-orang Lewi sebagai persembahan unjukan di hadapan Yahweh, dari antara umat Israel[a], dan mereka akan menjalankan pelayanan bagi Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “dari antara umat Israel” juga dapat dipahami “dari pihak umat Israel” atau “atas nama umat Israel.” Orang-orang Lewi diambil dari antara orang Israel dan, dalam pelayanan mereka, mewakili mereka.
    reason: alternative_reading
  - marker: b
    text: 'Secara lebih harfiah: “melayani pelayanan Yahweh.” Pengulangan kata seakar dalam bahasa Ibrani menekankan tugas pelayanan yang ditetapkan bagi orang-orang Lewi.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: mempersembahkan ... sebagai persembahan unjukan
  rationale: Kata kerja dan kata benda berasal dari akar yang sama dan menunjuk pada tindakan penyajian ritual. 'Mempersembahkan' alami untuk objek berupa manusia, sedangkan 'persembahan unjukan' mempertahankan istilah kultisnya.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan jelas dalam bahasa Indonesia bagi kelompok suku Lewi.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mencerminkan idiom Ibrani tentang tindakan yang berlangsung di hadirat Yahweh dan mempertahankan nama ilahi.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dari pihak umat Israel
  rationale: מֵאֵת dapat menyatakan asal maupun pihak yang diwakili. Pilihan ini tetap dekat dengan bentuk sumber sekaligus wajar dalam bahasa Indonesia; ambiguitasnya dijelaskan dalam catatan kaki.
- source_word: וְהָיוּ לַעֲבֹד
  choice: supaya mereka melaksanakan
  rationale: Rangkaian ini menyatakan hasil atau tujuan penyerahan orang Lewi. 'Supaya' menghasilkan kalimat Indonesia yang alami tanpa meniadakan nuansa resultatif.
- source_word: עֲבֹדַת יְהוָה
  choice: pelayanan bagi Yahweh
  rationale: Dalam konteks keimaman, עֲבֹדָה menunjuk pada tugas atau pelayanan kultis. 'Pelayanan bagi Yahweh' menghindari pengulangan kaku sambil mempertahankan maknanya.
theological_decisions:
- issue: Orang Lewi digambarkan sebagai תְּנוּפָה
  choice: mempersembahkan orang-orang Lewi sebagai persembahan unjukan
  alternative: mengunjukkan orang-orang Lewi sebagai persembahan unjukan
  rationale: Pilihan utama mempertahankan kategori ritual tanpa memberi kesan bahwa Harun secara harfiah mengayun-ayunkan mereka atau bahwa mereka disembelih sebagai kurban.
- issue: Hubungan orang Lewi dengan umat Israel dalam מֵאֵת
  choice: dari pihak umat Israel
  alternative: dari antara umat Israel / atas nama umat Israel
  rationale: Frasa Ibrani dapat menyoroti asal orang Lewi dari Israel maupun peran perwakilan mereka. Teks utama tidak memaksakan hanya salah satu nuansa, dan catatan kaki menyatakan alternatifnya.
- issue: Hubungan klausa terakhir dengan tindakan ritual
  choice: supaya mereka melaksanakan pelayanan bagi Yahweh
  alternative: dan mereka akan bertugas melaksanakan pelayanan bagi Yahweh
  rationale: Infinitif לַעֲבֹד paling alami dipahami sebagai tujuan atau hasil dari penyerahan tersebut. 'Supaya' mengungkapkan hubungan itu secara jelas tanpa menambahkan rincian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Persembahan unjukan' dipakai sebagai istilah ritual yang cukup dikenal; struktur akhir dibuat alami dalam bahasa Indonesia sambil mencatat bentuk harfiahnya.
