review_pass:
  verdict: revise
  source_fidelity: Makna dasar dan pengulangan penutup telah dipertahankan, termasuk nama Yahweh dan cakupan kolektif בני ישראל. Namun, “melakukan bagi orang Lewi” kurang tepat secara idiomatis dan dapat menggeser relasi ל־ menjadi semata-mata manfaat; dalam konteks ini orang Lewi adalah pihak yang dikenai tindakan.
  naturalness: Kalimat draf dapat dipahami, tetapi “melakukan bagi orang Lewi segala sesuatu” tidak alami dalam bahasa Indonesia modern. “Bertindak terhadap” menyampaikan verba Ibrani yang umum tanpa menspesifikkan tindakan ritual serta menghasilkan struktur yang lebih lancar.
  terminology: “Yahweh,” “orang Lewi,” dan “umat Israel” sesuai register baku dan konteks Pentateukh. Catatan kaki untuk “orang Israel” tetap berguna karena bentuk Ibraninya secara harfiah adalah “anak-anak Israel.”
  issues:
  - severity: medium
    issue: Relasi “bagi orang Lewi” dalam kedua klausa
    rationale: Terjemahan “bagi” terutama menyatakan penerima manfaat, sedangkan ל־ di sini menandai orang Lewi sebagai pihak yang menjadi sasaran tindakan yang diperintahkan. “Terhadap” lebih netral dan setia tanpa memperinci ritus yang dimaksud.
  - severity: low
    issue: Kolokasi “melakukan bagi ... segala sesuatu”
    rationale: Susunan ini tidak lazim dan berpotensi membingungkan karena “segala sesuatu” merupakan pelaksanaan perintah, bukan objek yang dibuat “bagi” orang Lewi. Verba “bertindak” mempertahankan keluasan עשה secara idiomatis.
  revised_text: Maka Musa, Harun, dan seluruh umat Israel bertindak terhadap orang Lewi sesuai dengan segala yang Yahweh perintahkan kepada Musa mengenai orang Lewi. Demikianlah orang Israel[a] bertindak terhadap mereka.
  revised_footnotes:
