  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: id
  text: Maka Musa, Harun, dan seluruh umat Israel bertindak terhadap orang Lewi sesuai dengan segala yang Yahweh perintahkan kepada Musa mengenai orang Lewi. Demikianlah orang Israel[a] bertindak terhadap mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; ungkapan Ibrani yang lazim untuk umat Israel sebagai komunitas perjanjian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: melakukan / melakukannya
  rationale: Kata עשה bermakna luas, ‘melakukan’ atau ‘membuat’. Dalam konteks ini kata tersebut menunjuk pada pelaksanaan berbagai tindakan yang telah diperintahkan tanpa mempersempitnya menjadi satu tindakan ritual tertentu.
- source_word: עֲדַת
  choice: umat
  rationale: עֵדָה menunjuk pada komunitas perjanjian Israel secara kolektif. ‘Umat’ alami dalam bahasa Indonesia dan tetap mempertahankan nuansa komunalnya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah ‘anak-anak Israel’ merupakan sebutan baku bagi umat Israel. ‘Orang Israel’ menyampaikan rujukan kolektif itu secara jelas dan wajar dalam bahasa Indonesia modern, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לַלְוִיִּם / לָהֶם
  choice: bagi orang Lewi / bagi mereka
  rationale: Preposisi ל dapat menandai pihak yang menjadi sasaran sekaligus penerima manfaat tindakan. ‘Bagi’ mempertahankan nuansa tersebut tanpa membatasi tindakan pada perlakuan semata.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala sesuatu sesuai dengan yang
  rationale: Frasa ini menegaskan kesesuaian menyeluruh dengan perintah ilahi. Susunan ini alami dalam bahasa Indonesia dan mempertahankan daya cakup כֹל.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk ini menyatakan bahwa Yahweh telah memberikan perintah yang kemudian dilaksanakan, tanpa perlu menambahkan penanda waktu yang tidak alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: kepada Musa mengenai orang Lewi
  rationale: Konstruksi ini menyatakan bahwa perintah diberikan kepada Musa dan berkenaan dengan orang Lewi. ‘Mengenai’ mempertahankan hubungan topikal itu secara tepat.
- source_word: כֵּן
  choice: demikianlah
  rationale: כֵּן merangkum dan menegaskan bahwa tindakan orang Israel tepat bersesuaian dengan perintah yang telah disebutkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankan nama itu, sedangkan ‘TUHAN’ menggantinya dengan gelar.
- issue: Ungkapan komunal בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel atau keturunan Israel
  rationale: Dalam konteks ini ungkapan tersebut merupakan sebutan baku bagi seluruh komunitas Israel, bukan hanya laki-laki atau anak-anak secara biologis. Pilihan ini mempertahankan cakupan komunalnya, sedangkan bentuk harfiah disediakan dalam catatan kaki.
- issue: Hubungan preposisional ל dengan orang Lewi
  choice: bagi orang Lewi
  alternative: kepada orang Lewi atau terhadap orang Lewi
  rationale: Preposisi ל di sini dapat mencakup sasaran dan penerima manfaat dari tindakan tersebut. ‘Bagi’ menjaga keluasan itu tanpa menentukan secara berlebihan jenis tindakan ritualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘orang Lewi’ serta penegasan penutup dipertahankan karena mencerminkan struktur dan tekanan retoris teks Ibrani; susunan kalimat dilancarkan agar mudah dipahami.
