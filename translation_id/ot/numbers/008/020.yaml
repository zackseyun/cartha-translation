revisions:
- from: Maka Musa, Harun, dan seluruh umat Israel melakukan bagi orang Lewi segala sesuatu sesuai dengan yang diperintahkan Yahweh kepada Musa mengenai orang Lewi. Demikianlah orang Israel[a] melakukannya bagi mereka.
  to: Maka Musa, Harun, dan seluruh umat Israel bertindak terhadap orang Lewi sesuai dengan segala yang Yahweh perintahkan kepada Musa mengenai orang Lewi. Demikianlah orang Israel[a] bertindak terhadap mereka.
  rationale: Revisi mengganti konstruksi yang kurang alami “melakukan bagi” dengan “bertindak terhadap,” yang mempertahankan keluasan verba עשה dan relasi teks terhadap orang Lewi. Struktur pengulangan dan penegasan “Demikianlah” tetap dipertahankan.
