lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol menandai kelanjutan peristiwa dalam narasi. Dalam konteks perkataan ilahi, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai orang yang dituju dalam tindakan berbicara; “kepada Musa” adalah ungkapan Indonesia yang wajar.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Dalam rumus pembuka ujaran Ibrani, לֵאמֹר memperkenalkan kutipan langsung yang menyusul. Bahasa Indonesia secara alami cukup memakai koma setelah “berfirman kepada Musa”; menambahkan “demikian” atau “kata-Nya” akan terasa berlebih.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur rumus ujaran disesuaikan secara wajar untuk mengantar langsung ke perkataan pada ayat berikutnya.
