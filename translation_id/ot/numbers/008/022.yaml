  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: id
  text: Sesudah itu, orang-orang Lewi datang untuk melaksanakan tugas mereka di Kemah Pertemuan di hadapan Harun dan anak-anaknya. Seperti yang telah diperintahkan Yahweh kepada Musa mengenai orang-orang Lewi, demikianlah mereka melakukannya bagi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “demikianlah mereka melakukannya terhadap mereka.” Ungkapan Ibraninya ringkas dan mungkin merujuk pada pelaksanaan upacara-upacara yang ditetapkan berkenaan dengan orang-orang Lewi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Menandai urutan waktu sesudah pentahiran dan penahbisan dalam konteks sebelumnya; penghubung Ibrani diungkapkan secara alami dalam bahasa Indonesia.
- source_word: בָּאוּ הַלְוִיִּם
  choice: orang-orang Lewi datang
  rationale: Mempertahankan verba gerak yang umum tanpa mempersempit maknanya menjadi 'masuk'.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: untuk melaksanakan tugas mereka
  rationale: Dalam konteks ibadah, עבד dan עֲבֹדָה menunjuk pada pelaksanaan pelayanan atau kewajiban kudus. 'Melaksanakan tugas' alami dalam bahasa Indonesia dan menghindari pengulangan janggal seperti 'melayani pelayanan mereka'.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Nama baku bagi tempat kudus itu; 'di' mempertahankan cakupan preposisi tanpa menentukan secara berlebihan apakah seluruh kegiatan berlangsung di dalam ruang kemah.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: di hadapan Harun dan anak-anaknya
  rationale: Mempertahankan arti dasar לִפְנֵי dan tidak secara eksplisit menambahkan gagasan 'di bawah pengawasan', walaupun konteks mungkin menyiratkannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: עַל הַלְוִיִּם
  choice: mengenai orang-orang Lewi
  rationale: עַל menandai pokok atau sasaran perintah dalam konteks ini.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: demikianlah mereka melakukannya bagi mereka
  rationale: Mempertahankan subjek jamak yang tidak disebut ulang dan pronomina לָהֶם, sambil membiarkan rujukan tepat dari 'mereka' tetap mengikuti kepadatan teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Subjek dan sasaran dalam כֵּן עָשׂוּ לָהֶם
  choice: demikianlah mereka melakukannya bagi mereka
  alternative: demikianlah mereka memperlakukan orang-orang Lewi
  rationale: Teks Ibrani ringkas dan tidak mengulang subjek maupun objek tindakannya. Terjemahan utama mempertahankan ketegangan rujukan itu, sedangkan perluasan alternatif akan menafsirkan identitas pelaku dan tindakan secara lebih tegas daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Kemah Pertemuan' diperlakukan sebagai nama khusus. Bentuk 'orang-orang Lewi' dipilih agar alami bagi pembaca umum. Ambiguitas klausa penutup dipertahankan dan dijelaskan melalui catatan kaki.
