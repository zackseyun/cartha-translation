  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: id
  text: Engkau harus menempatkan orang-orang Lewi di hadapan Harun dan di hadapan putra-putranya, dan mempersembahkan mereka sebagai persembahan unjukan kepada Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mengunjukkan mereka sebagai persembahan unjukan kepada Yahweh.” Bahasa Ibrani memakai verba untuk tindakan ritual mengunjukkan atau mempersembahkan bersama nomina “persembahan unjukan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Engkau harus menempatkan
  rationale: Bentuk Hifil dari עמד bersifat kausatif, yaitu membuat seseorang berdiri atau menempatkannya pada posisi tertentu. “Menempatkan” alami dalam bahasa Indonesia dan sesuai dengan konteks upacara.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku bagi kelompok suku Lewi; bentuk jamak dan ketakrifannya tersampaikan secara alami dalam bahasa Indonesia.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini dapat menunjukkan posisi ruang maupun penghadapan resmi dalam upacara. Pengulangannya dipertahankan untuk mencerminkan struktur Ibrani.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Menggunakan bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: בָנָיו
  choice: anak-anak laki-lakinya
  rationale: בנים dalam konteks ini merujuk kepada putra-putra Harun yang menjadi imam; unsur laki-laki dinyatakan agar makna sumber tidak menjadi kabur.
- source_word: וְהֵנַפְתָּ
  choice: lalu mempersembahkan
  rationale: Bentuk Hifil dari נוף dalam konteks ibadah menunjuk pada tindakan ritual mengunjukkan atau mempersembahkan. “Mempersembahkan” menyampaikan fungsi upacara secara alami ketika objeknya adalah manusia.
- source_word: אֹתָם
  choice: mereka
  rationale: Kata ganti objek ini merujuk kembali kepada orang-orang Lewi.
- source_word: תְּנוּפָה
  choice: sebagai persembahan unjukan
  rationale: תנופה adalah istilah teknis bagi persembahan yang diunjukkan. Istilah “persembahan unjukan” mempertahankan kekhususan ritualnya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau penerima persembahan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Pengungkapan tindakan ritual terhadap orang-orang Lewi
  choice: mempersembahkan mereka sebagai persembahan unjukan
  alternative: mengunjukkan mereka sebagai persembahan unjukan
  rationale: Bahasa Ibrani menggabungkan verba נוף dengan nomina תנופה. Teks utama mengutamakan kejelasan tindakan ritual ketika objeknya manusia, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki agar gema leksikal sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “di hadapan” dipertahankan karena merupakan bagian dari susunan resmi upacara. Penanda catatan kaki ditempatkan sesudah frasa ritual yang dijelaskannya.
