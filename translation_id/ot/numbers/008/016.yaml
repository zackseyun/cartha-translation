base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: id
  text: Sebab mereka benar-benar telah diserahkan kepada-Ku dari antara bani Israel.[a] Sebagai ganti setiap yang membuka kandungan, yaitu setiap anak sulung di antara bani Israel,[b] Aku telah mengambil mereka bagi-Ku sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “diserahkan, diserahkan”; pengulangan dalam bahasa Ibrani memberi penekanan, sehingga dapat berarti “sungguh-sungguh diserahkan” atau “diserahkan sepenuhnya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap yang membuka kandungan, setiap anak sulung dari bani Israel.” “Yang membuka kandungan” adalah idiom untuk anak yang pertama keluar dari rahim, yakni anak sulung.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: telah diserahkan sepenuhnya
  rationale: Pengulangan partisip pasif menegaskan penyerahan total. Ungkapan ini menyampaikan penekanan tersebut secara alami tanpa mengulang kata secara janggal.
- source_word: לִי
  choice: kepada-Ku
  rationale: Preposisi ini menyatakan bahwa orang Lewi diserahkan dan dikhususkan kepada TUHAN.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dari antara bani Israel
  rationale: מִתּוֹךְ menunjukkan pemilihan dari dalam suatu kelompok; 'bani Israel' mempertahankan ungkapan kekerabatan Ibrani yang lazim dalam bahasa Indonesia Alkitabiah.
- source_word: תַּחַת
  choice: sebagai ganti
  rationale: 'Kata ini menyatakan hubungan penggantian: orang Lewi diambil menggantikan anak-anak sulung Israel.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: setiap anak sulung yang pertama keluar dari kandungan
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani sekaligus menjelaskan bahwa yang dimaksud ialah anak sulung.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: di antara bani Israel
  rationale: Keterangan ini mengaitkan anak sulung tersebut dengan seluruh komunitas Israel tanpa menghasilkan pengulangan bahasa Indonesia yang kaku.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: Aku telah mengambil mereka bagi-Ku sendiri
  rationale: Bentuk perfektif menyatakan tindakan pengambilan yang telah dilakukan, sedangkan לִי menekankan klaim dan pengkhususan ilahi.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: umat Israel; orang Israel
  rationale: Ungkapan ini mempertahankan bentuk kekerabatan kolektif dalam bahasa sumber dan tetap wajar serta dikenal luas dalam bahasa Indonesia.
- issue: Hubungan orang Lewi dengan anak sulung Israel
  choice: sebagai ganti
  alternative: sebagai pengganti; sebagai tukaran untuk
  rationale: Terjemahan ini mempertahankan gagasan substitusi dalam תַּחַת tanpa menjelaskan lebih jauh mekanisme teologis yang tidak dinyatakan dalam ayat.
