  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. 'Bani Israel' dipakai untuk mempertahankan ungkapan kekerabatan Ibrani; kapitalisasi pronomina ilahi mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
