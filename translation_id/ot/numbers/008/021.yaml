  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: id
  text: Lalu orang-orang Lewi menyucikan diri dan mencuci pakaian mereka. Harun mempersembahkan mereka sebagai persembahan unjukan[a] di hadapan Yahweh, lalu Harun mengadakan pendamaian bagi mereka untuk menahirkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengunjukkan mereka sebagai persembahan unjukan.” Bahasa Ibrani memakai ungkapan ritual baku untuk mempersembahkan sesuatu di hadapan Yahweh sebagai תְּנוּפָה.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: menyucikan diri
  rationale: Bentuk hitpael menyatakan tindakan refleksif dalam konteks pemurnian ritual. Kata 'menyucikan diri' alami dalam bahasa Indonesia dan tidak menambahkan 'dari dosa', yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: mencuci pakaian mereka
  rationale: '''Pakaian'' merupakan padanan modern dan wajar bagi בְּגָדִים serta tetap sesuai dengan konteks ritual.'
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: mempersembahkan mereka sebagai persembahan unjukan
  rationale: Ungkapan ini mempertahankan istilah ritual tradisional untuk tindakan mempersembahkan sesuatu di hadapan Yahweh, tanpa mengharuskan gambaran bahwa tubuh orang-orang Lewi secara harfiah diayunkan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Padanan langsung dan alami yang mempertahankan nama perjanjian ilahi יְהוָה.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: mengadakan pendamaian bagi mereka
  rationale: Mengungkapkan fungsi ritual כפר dalam bahasa Indonesia yang lazim dipakai dalam konteks kurban dan keimaman, tanpa merinci teori pendamaian tertentu.
- source_word: לְטַהֲרָם
  choice: untuk menahirkan mereka
  rationale: Infinitif ini menyatakan tujuan atau hasil tindakan Harun. 'Menahirkan' mempertahankan nuansa kemurnian ritual dan membedakannya dari tindakan refleksif sebelumnya.
theological_decisions:
- issue: Pembedaan istilah pemurnian dan pendamaian dalam bahasa ritual imamat
  choice: menyucikan diri; mengadakan pendamaian; menahirkan
  alternative: membersihkan diri; mengadakan pengampunan; menyucikan
  rationale: 'Pilihan ini mempertahankan tiga tindakan yang berkaitan tetapi tidak identik: pemurnian diri orang Lewi, tindakan pendamaian oleh Harun, dan penahiran sebagai tujuan atau hasilnya. Kata-katanya tidak memasukkan kerangka doktrinal yang lebih khusus daripada teks.'
- issue: Cara menerjemahkan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri ilahi dipertahankan sebagai 'Yahweh', sesuai bentuk yang langsung terdapat dalam teks sumber.
- issue: Sifat tindakan תְּנוּפָה terhadap orang-orang Lewi
  choice: mempersembahkan mereka sebagai persembahan unjukan
  alternative: mengunjukkan mereka sebagai persembahan unjukan
  rationale: Pilihan utama menyampaikan fungsi presentasi ritual dengan alami, sedangkan catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah dan ketegangan mengenai gerak ritualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibagi menjadi dua agar rangkaian tindakan tetap jelas. Istilah 'persembahan unjukan', 'pendamaian', dan 'menahirkan' dipertahankan karena konteksnya bersifat ritual-imamat; catatan kaki menjelaskan alternatif pada ungkapan ritual yang paling sukar.
