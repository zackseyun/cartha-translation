base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: id
  text: 'Inilah ketentuan bagi orang Lewi: dari usia dua puluh lima tahun ke atas, ia harus datang untuk menjalankan tugas[a] dalam pelayanan Kemah Pertemuan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masuk untuk bertugas”. Ungkapan Ibrani ini memakai idiom tugas atau dinas yang bernuansa kemiliteran.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: Inilah ketentuan bagi orang Lewi
  rationale: Konstruksi ini memperkenalkan peraturan yang berlaku bagi kaum Lewi. 'Ketentuan' menyampaikan daya hukum/instruksionalnya secara alami dalam bahasa Indonesia.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: sejak berumur dua puluh lima tahun ke atas
  rationale: Ungkapan Ibrani menetapkan batas usia minimum; bentuk ini dekat dengan sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: יָבוֹא
  choice: ia harus mulai
  rationale: Secara harfiah berarti 'ia akan/harus datang atau masuk'. Dalam konteks ketentuan usia untuk pelayanan, 'mulai' menyampaikan masuknya seorang Lewi ke dalam tugas, sedangkan 'ia' mempertahankan verba tunggal generik sumber.
- source_word: לִצְבֹא צָבָא
  choice: menjalankan tugas
  rationale: Idiom ini menunjuk pelaksanaan tugas atau dinas dan memiliki gema kemiliteran. 'Menjalankan tugas' alami dalam konteks pelayanan Kemah tanpa mengubahnya menjadi kegiatan perang.
- source_word: בַּעֲבֹדַת
  choice: dalam pelayanan di
  rationale: עֲבֹדָה di sini ialah pekerjaan atau pelayanan resmi yang ditetapkan di tempat kudus.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan jelas bagi nama tempat kudus tersebut dalam Pentateukh.
theological_decisions:
- issue: Verba tunggal generik dengan subjek kolektif
  choice: ia harus mulai
  alternative: mereka harus mulai
  rationale: Bahasa Ibrani memakai verba tunggal dalam peraturan yang membicarakan orang Lewi secara kolektif. Bentuk 'ia' mempertahankan ciri sumber dan merujuk kepada setiap laki-laki Lewi yang memenuhi batas usia.
- issue: Hubungan antara idiom tugas dan pelayanan tempat kudus
  choice: menjalankan tugas dalam pelayanan
  alternative: bergabung dengan pasukan dalam pekerjaan
  rationale: Idiom Ibrani memiliki gema kemiliteran, tetapi konteks secara eksplisit menempatkan tugas itu dalam pelayanan Kemah Pertemuan. Terjemahan utama menjaga konteks kultis tanpa menghapus nuansa idiom, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan mudah dipahami. 'Orang Lewi' dipakai sebagai sebutan kelompok, 'Kemah Pertemuan' sebagai istilah baku, dan modalitas hukum dinyatakan dengan 'harus'.
