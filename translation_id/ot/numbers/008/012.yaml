  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: id
  text: Lalu orang-orang Lewi hendaklah menumpangkan tangan mereka ke atas kepala lembu-lembu jantan itu. Persembahkanlah lembu yang satu sebagai kurban penghapus dosa[a] dan yang lain sebagai kurban bakaran kepada Yahweh, untuk mengadakan pendamaian bagi orang-orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kurban pemurnian". Istilah Ibrani חַטָּאת dapat menunjuk pada kurban yang berkaitan dengan dosa dan pemurnian dalam konteks keimaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: harus meletakkan tangan mereka
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan ritual meletakkan tangan pada hewan kurban; bentuk jamak יְדֵיהֶם dipertahankan secara konkret.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: di atas kepala lembu-lembu jantan itu
  rationale: Kata 'kepala' berbentuk tunggal tetapi bermakna distributif terhadap dua lembu; ungkapan Indonesia ini tetap alami dan dekat dengan bentuk Ibrani.
- source_word: וַעֲשֵׂה
  choice: Persembahkanlah
  rationale: Bentuk ini merupakan perintah kepada satu orang. Dalam konteks ritual, עשה dengan hewan kurban sebagai objek berarti melaksanakan atau mempersembahkan kurban.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Ini istilah Indonesia yang lazim dan mudah dipahami untuk kurban חטאת, sementara kemungkinan makna pemurnian dipertahankan dalam catatan kaki.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku untuk kurban yang dibakar seluruhnya di atas mazbah.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'; preposisinya secara alami diterjemahkan 'kepada' dalam rumusan persembahan.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: untuk mengadakan pendamaian bagi orang-orang Lewi
  rationale: Ungkapan ini mempertahankan daya ritual-teologis כפר tanpa menentukan satu teori khusus tentang pendamaian; עַל menyatakan pihak yang menerima manfaatnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi sebagai nama diri.
- issue: Cakupan makna חַטָּאת
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Sebutan tradisional dipakai dalam teks utama karena mudah dikenali, tetapi cakupan ritual yang dapat menonjolkan pemurnian tidak dihapus dan dicatat sebagai alternatif.
- issue: Makna כפר dalam ritual
  choice: mengadakan pendamaian
  alternative: mengadakan penghapusan dosa / melakukan pemurnian ritual
  rationale: Pilihan ini mempertahankan istilah kultis yang luas dan tidak menyempitkannya menjadi mekanisme teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Orang-orang Lewi' dipakai untuk kejelasan; istilah ritual mengikuti kosakata Alkitab Indonesia yang umum, dengan alternatif penting dijaga melalui catatan kaki.
