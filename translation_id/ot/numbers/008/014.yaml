  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: id
  text: Maka engkau harus memisahkan[a] orang-orang Lewi dari antara orang Israel[b], dan orang-orang Lewi itu akan menjadi milik-Ku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengkhususkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bani Israel”; secara harfiah: “anak-anak Israel.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “akan menjadi kepunyaan-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: Maka engkau harus memisahkan
  rationale: Bentuk Hifil dari בדל menyatakan tindakan memisahkan atau mengkhususkan. “Memisahkan” mempertahankan arti langsungnya, sedangkan “Maka” mencerminkan urutan tindakan dalam konteks pentahiran dan penyerahan orang Lewi.
- source_word: אֶת הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Istilah ini menunjuk kepada para anggota suku Lewi. Bentuk “orang-orang Lewi” alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִתּוֹךְ
  choice: dari antara
  rationale: Ungkapan ini menyatakan pemisahan dari dalam suatu kelompok yang lebih besar. “Dari antara” idiomatis dan tepat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel.” “Bani Israel” mempertahankan ungkapan kekerabatan Ibrani dan sudah dikenal dalam bahasa Indonesia, tanpa membatasi rujukannya hanya pada laki-laki secara individual.
- source_word: וְהָיוּ לִי
  choice: dan ... akan menjadi milik-Ku
  rationale: Konstruksi היה dengan לִי menyatakan kepunyaan atau keberpihakan khusus kepada Allah. “Menjadi milik-Ku” mempertahankan pernyataan kepunyaan tanpa menambahkan istilah penahbisan yang tidak terdapat secara eksplisit dalam ayat.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi itu
  rationale: Pengulangan nomina dalam bahasa Ibrani dipertahankan, bukan diganti dengan kata ganti. Kata “itu” membuat pengulangan tersebut alami dalam bahasa Indonesia sekaligus menjaga penekanannya.
theological_decisions:
- issue: Apakah status orang Lewi harus diterjemahkan sebagai kepunyaan atau sebagai penahbisan untuk ibadah
  choice: orang-orang Lewi itu akan menjadi milik-Ku
  alternative: orang-orang Lewi itu akan dikhususkan bagi-Ku
  rationale: Ayat ini secara langsung memakai konstruksi yang menyatakan bahwa mereka menjadi milik Allah. Konteksnya memang menyangkut pengkhususan untuk pelayanan, tetapi kosakata penahbisan atau persembahan tidak dinyatakan dalam klausa ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau” mengikuti bentuk orang kedua tunggal dalam bahasa Ibrani. Huruf kapital pada “-Ku” menandai bahwa penuturnya adalah Allah. “Bani Israel” dipilih untuk mempertahankan corak kekerabatan ungkapan sumber, sementara catatan kaki memberi padanan yang lebih umum.
