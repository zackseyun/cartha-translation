  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: id
  text: Namun, ia boleh melayani bersama saudara-saudaranya di Kemah Pertemuan untuk menjalankan tugas yang dipercayakan kepadanya, tetapi ia tidak boleh melakukan pekerjaan pelayanan[a]. Demikianlah harus kaulakukan terhadap orang Lewi dalam tugas-tugas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pekerjaan.” Bahasa Ibrani membedakan pelayanan yang masih boleh dilakukannya dari pekerjaan pelayanan reguler yang tidak boleh lagi dilakukannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: Namun, ia boleh melayani
  rationale: שרת menunjukkan pelayanan atau bantuan dalam konteks ibadah. Bentuk izin dipilih berdasarkan pertentangannya dengan larangan melakukan pekerjaan pelayanan sesudah usia yang ditentukan dalam ayat sebelumnya.
- source_word: אֶת־אֶחָיו
  choice: bersama saudara-saudaranya
  rationale: Dalam konstruksi ini, אֵת dapat menyatakan kebersamaan. 'Saudara-saudaranya' mempertahankan istilah kekerabatan Ibrani dan dalam konteks mengacu kepada sesama orang Lewi.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Padanan baku dan langsung bagi nama tempat kudus אֹהֶל מוֹעֵד.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: untuk menjalankan tugas yang dipercayakan kepadanya
  rationale: Gabungan infinitif dan nomina serumpun ini berarti menunaikan atau memelihara tanggung jawab yang diamanatkan; ungkapan Indonesia ini alami tanpa membatasinya hanya pada penjagaan keamanan.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: tetapi ia tidak boleh melakukan pekerjaan pelayanan
  rationale: Nomina dan verba serumpun עבד menegaskan pekerjaan pelayanan reguler yang tidak lagi boleh dilakukan. Frasa ini dibedakan dari pelayanan pendamping yang masih diizinkan pada awal ayat.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: Demikianlah harus kaulakukan terhadap orang Lewi
  rationale: Formula instruksional diterjemahkan langsung; 'terhadap' menyampaikan penerapan ketentuan kepada kelompok orang Lewi secara alami.
- source_word: בְּמִשְׁמְרֹתָם
  choice: sehubungan dengan tugas-tugas mereka
  rationale: Bentuk jamak merujuk pada tanggung jawab atau penugasan mereka. 'Sehubungan dengan' menghasilkan hubungan sintaksis yang jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Perbedaan antara kegiatan yang masih diizinkan dan pekerjaan yang dilarang bagi orang Lewi setelah batas usia
  choice: Ayat ini mengizinkan pelayanan pendamping dalam pelaksanaan tanggung jawab, tetapi melarang pekerjaan pelayanan reguler.
  alternative: Ayat ini melarang semua bentuk pelayanan; atau hanya mengizinkan tugas jaga dalam arti keamanan yang sempit.
  rationale: Pertentangan antara שרת dan konstruksi emphatik עֲבֹדָה לֹא יַעֲבֹד menunjukkan pembedaan jenis keterlibatan, bukan penghentian mutlak semua partisipasi. Terjemahan mempertahankan pembedaan itu tanpa merinci tugas yang tidak dijelaskan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kemah Pertemuan' memakai bentuk nama yang lazim. Kontras leksikal dijaga melalui 'melayani' dan 'pekerjaan pelayanan'; catatan kaki mempertahankan kemungkinan nuansa kerja atau beban tanpa menyempitkan makna teks utama.
