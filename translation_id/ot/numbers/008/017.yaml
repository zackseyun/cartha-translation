id: NUM.8.17
reference: Numbers 8:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: id
  text: Sebab setiap anak sulung di antara bani Israel, baik manusia maupun hewan, adalah milik-Ku. Pada hari Aku memukul setiap anak sulung di tanah Mesir, Aku menguduskan mereka bagi-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku mengkhususkan mereka bagi-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pernyataan sebelumnya dan mempertahankan hubungan penjelas antarayat.
- source_word: לִי
  choice: adalah milik-Ku
  rationale: Menyatakan kepemilikan secara alami dan jelas dalam bahasa Indonesia.
- source_word: כָל בְּכוֹר
  choice: setiap anak sulung
  rationale: Mencerminkan bentuk kolektif tunggal tanpa menambahkan unsur 'laki-laki' yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: di antara bani Israel
  rationale: Mempertahankan ungkapan kekerabatan-perjanjian Ibrani dengan bentuk yang sudah dikenal dan tetap wajar dalam bahasa Indonesia.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: baik manusia maupun hewan
  rationale: Mengungkapkan kontras dua kategori kolektif secara alami, tanpa membatasi בְּהֵמָה hanya pada ternak.
- source_word: בְּיוֹם
  choice: Pada hari
  rationale: Mempertahankan ungkapan waktu eksplisit dalam teks Ibrani.
- source_word: הַכֹּתִי
  choice: Aku memukul
  rationale: Menerjemahkan נכה secara langsung; konteks tulah menjelaskan akibat mematikannya tanpa harus menambahkan 'membunuh' ke dalam verba.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ, bukan menyederhanakannya menjadi hanya 'di Mesir'.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: Aku menguduskan mereka bagi-Ku
  rationale: Mempertahankan daya sakral bentuk hiphil קדשׁ serta tujuan/relasi kepada Allah yang dinyatakan oleh לִי.
theological_decisions:
- issue: Cakupan אָדָם dalam kontras manusia-hewan
  choice: manusia
  alternative: umat manusia
  rationale: Di sini אָדָם menunjuk kategori manusia secara umum, bukan seorang laki-laki secara khusus; 'manusia' menyampaikan kontras dengan hewan secara tepat.
- issue: Daya sakral הִקְדַּשְׁתִּי
  choice: Aku menguduskan mereka bagi-Ku
  alternative: Aku mengkhususkan mereka bagi-Ku
  rationale: '''Menguduskan'' mempertahankan gagasan bahwa anak-anak sulung dijadikan kudus/milik khusus Allah, sedangkan alternatif menjelaskan aspek pemisahannya tetapi melemahkan nuansa sakral.'
- issue: Referen pronomina אֹתָם
  choice: mereka
  alternative: semuanya
  rationale: Pronomina jamak merujuk secara kolektif kepada setiap anak sulung manusia dan hewan; terjemahan dibiarkan mengikuti bentuk teks tanpa mempersempit referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Bani Israel' mempertahankan corak kekerabatan teks; konstruksi 'baik manusia maupun hewan' membuat kontras kolektif Ibrani jelas dan alami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
