id: NUM.8.18
reference: Numbers 8:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: id
  text: Aku mengambil orang-orang Lewi sebagai pengganti setiap anak sulung di antara anak-anak Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara orang Israel.” Secara harfiah, teks Ibrani berbunyi “di antara anak-anak Israel.”
    reason: Alternatif leksikal yang menjelaskan ungkapan Ibrani בִּבְנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Aku mengambil
  rationale: Bentuk wayyiqtol Qal orang pertama tunggal dari לקח menyatakan tindakan Allah mengambil orang-orang Lewi. Kata “mengambil” mempertahankan makna konkret tanpa menambahkan gagasan memilih atau menerima yang tidak dinyatakan secara eksplisit.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Bentuk jamak definit ini secara khusus menunjuk kepada kaum Lewi; “orang-orang Lewi” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: תַּחַת
  choice: sebagai pengganti
  rationale: Dalam konteks ini תַּחַת menyatakan substitusi, bukan posisi ruang. “Sebagai pengganti” menyampaikan bahwa orang-orang Lewi mengambil tempat anak-anak sulung.
- source_word: כָּל בְּכוֹר
  choice: setiap anak sulung
  rationale: כָּל dengan nomina tunggal בְּכוֹר berfungsi distributif, sehingga “setiap anak sulung” lebih tepat daripada bentuk kolektif. Kata “laki-laki” tidak ditambahkan karena tidak muncul dalam frasa Ibrani ini.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: di antara anak-anak Israel
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani harfiah “anak-anak Israel,” sedangkan preposisi בְּ secara idiomatis diterjemahkan “di antara” dalam konteks ini.
theological_decisions:
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel
  rationale: Teks utama mempertahankan bentuk sumber yang secara harfiah berbunyi “anak-anak Israel,” tanpa meniadakan bahwa ungkapan tersebut secara korporatif dapat menunjuk kepada umat Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan istilah konkret, hubungan penggantian, dan ungkapan sumber “anak-anak Israel.”
