  yaml_path: translation/ot/numbers/008/002.yaml
  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: id
  text: Berbicaralah kepada Harun dan katakan kepadanya, ‘Ketika engkau memasang pelita-pelita itu,[a] ketujuh pelita itu akan memancarkan cahaya ke arah depan kaki pelita.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ketika engkau menyalakan pelita-pelita itu.” Kata kerja Ibraninya secara harfiah berarti “membuat naik” dan dalam konteks ini dapat menunjuk pada menyalakan pelita atau memasangnya sedemikian rupa sehingga cahayanya mengarah ke depan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Bentuk imperatif ini mengawali perintah ilahi kepada Musa. ‘Berbicaralah’ mempertahankan ragam perintah yang khidmat dan membedakannya dari kata kerja berikutnya.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: dan katakan kepadanya
  rationale: Mencerminkan formula ujaran Ibrani dan mempertahankan kedua kata kerja yang berbeda, yakni ‘berbicara’ dan ‘mengatakan’.
- source_word: בְּהַעֲלֹתְךָ
  choice: Ketika engkau memasang
  rationale: Bentuk Hifil dari עלה secara harfiah berarti ‘membuat naik’. Dalam konteks pelita, kata ini dapat menunjuk pada memasang atau menyalakan; ‘memasang’ sesuai dengan petunjuk orientasi cahaya tanpa menutup kemungkinan makna lain, yang dicatat dalam catatan kaki.
- source_word: הַנֵּרֹת
  choice: pelita-pelita itu
  rationale: נֵר menunjuk pada pelita konkret, bukan cahaya abstrak. Bentuk ulang merupakan bentuk jamak Indonesia yang jelas dan alami.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: bagian depan kaki pelita
  rationale: Gabungan preposisi ini menyatakan arah atau orientasi ke sisi depan perlengkapan tersebut. ‘Menerangi bagian depan’ menyampaikan arah cahaya secara alami tanpa memakai ungkapan harfiah yang kaku.
- source_word: יָאִירוּ
  choice: harus menerangi
  rationale: Hifil dari אור bersifat kausatif, yaitu ‘memberi cahaya’ atau ‘menerangi’. ‘Harus’ menyampaikan daya instruktif bentuk verba dalam konteks perintah.
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: ketujuh pelita itu
  rationale: Menerjemahkan frasa bilangan konstruksi secara langsung dan alami; bentuk ‘ketujuh’ menegaskan seluruh rangkaian tujuh pelita tanpa menambahkan unsur asing.
- source_word: הַמְּנוֹרָה
  choice: kaki pelita
  rationale: Istilah benda peribadatan ini diterjemahkan menurut fungsinya, bukan ditransliterasikan sebagai ‘menora’. ‘Kaki pelita’ adalah istilah Indonesia yang lazim dan mudah dipahami.
