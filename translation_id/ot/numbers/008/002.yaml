translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat yang tetap mudah dipahami. Pronomina ‘engkau’ dipakai untuk ujaran langsung ilahi kepada Harun melalui Musa. Ambiguitas tindakan בְּהַעֲלֹתְךָ dipertahankan melalui catatan kaki.
