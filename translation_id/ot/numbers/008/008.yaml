  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ פַּ֣ר בֶּן בָּקָ֔ר וּ/מִנְחָת֔/וֹ סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן וּ/פַר שֵׁנִ֥י בֶן בָּקָ֖ר תִּקַּ֥ח לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: id
  text: Lalu mereka harus mengambil seekor sapi jantan muda beserta kurban sajiannya berupa tepung halus yang dicampur dengan minyak, dan engkau harus mengambil sapi jantan muda yang kedua sebagai kurban penghapus dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pentahiran.” Istilah Ibrani חַטָּאת dapat menunjuk pada kurban penghapus dosa atau kurban pentahiran dalam konteks ritual keimaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Lalu mereka harus mengambil
  rationale: Bentuk jamak orang ketiga dalam rangkaian petunjuk ritual dinyatakan dengan daya kewajiban; “Lalu” menyampaikan urutan tindakan secara alami.
- source_word: פַּר בֶּן בָּקָר
  choice: seekor sapi jantan muda
  rationale: Ungkapan harfiah “sapi jantan, anak dari kawanan sapi” menunjuk kepada sapi jantan muda; “seekor” wajar dalam bahasa Indonesia dan membedakannya dari hewan kedua.
- source_word: וּמִנְחָתוֹ
  choice: beserta kurban sajiannya
  rationale: Dalam konteks ibadah, מִנְחָה adalah persembahan berbahan hasil bumi/tepung yang menyertai hewan; akhiran pronominalnya merujuk pada sapi jantan pertama.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Padanan baku dan jelas bagi tepung bermutu yang digiling halus untuk persembahan.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Menyampaikan rumusan persiapan ritual dengan bahasa Indonesia modern dan alami.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: dan engkau harus mengambil sapi jantan muda yang kedua
  rationale: Mempertahankan peralihan penting dari subjek jamak “mereka” kepada sapaan tunggal maskulin “engkau”; ordinal שֵׁנִי diterjemahkan “yang kedua”.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Menjaga hubungan leksikal חַטָּאת dengan dosa dalam istilah Indonesia yang lazim, sambil mencatat fungsi pentahiran sebagai alternatif yang sah.
theological_decisions:
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pentahiran
  rationale: Istilah Ibrani dapat menunjuk pada dosa maupun pada kurban yang menangani dosa/kenajisan ritual. Teks utama memakai istilah yang dikenal dan tetap terkait secara leksikal dengan dosa, sedangkan catatan kaki mempertahankan penekanan alternatif pada fungsi pentahiran tanpa memaksakan salah satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kurban sajian” dipilih untuk מִנְחָה agar jelas sebagai persembahan ritual, dan sapaan “engkau” mempertahankan bentuk tunggal sumber serta register Kitab Suci. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
