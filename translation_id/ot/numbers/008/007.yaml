  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: id
  text: 'Beginilah yang harus kaulakukan kepada mereka untuk menyucikan mereka: percikkanlah ke atas mereka air untuk penyucian dari dosa[a]. Hendaklah mereka mencukur seluruh tubuh mereka dengan pisau cukur, mencuci pakaian mereka, dan dengan demikian menyucikan diri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “air penyucian”; secara harfiah, “air dosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: Beginilah yang harus kaulakukan kepada mereka
  rationale: Menyampaikan petunjuk prosedural yang tersambung dengan konteks sebelumnya; bentuk tunggal orang kedua tetap dipertahankan.
- source_word: לְטַהֲרָם
  choice: untuk menyucikan mereka
  rationale: Dalam konteks penahbisan orang Lewi, טהר menunjuk pada penyucian ritual; 'menyucikan' wajar dan tetap mempertahankan nuansa kultis.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: percikkanlah kepada mereka
  rationale: Mengungkapkan tindakan ritual memercikkan air kepada atau ke atas orang-orang Lewi secara alami dalam bahasa Indonesia.
- source_word: מֵי חַטָּאת
  choice: air penyucian dari dosa
  rationale: Frasa Ibrani secara harfiah berarti 'air dosa', tetapi fungsi tepatnya dapat dipahami sebagai air untuk penyucian terkait dosa atau kenajisan; terjemahan utama mengikuti konteks tanpa menyebutnya sebagai persembahan dosa.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: Hendaklah mereka mencukur seluruh tubuh mereka dengan pisau cukur
  rationale: Mengalihkan idiom harfiah 'menjalankan pisau cukur di atas seluruh daging mereka' ke ungkapan Indonesia yang jelas sambil mempertahankan alat dan cakupan tindakan.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: mencuci pakaian mereka
  rationale: כבס lazim menunjuk pada pencucian pakaian; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: וְהִטֶּהָרוּ
  choice: dan dengan demikian menyucikan diri
  rationale: Mempertahankan nuansa refleksif serta hasil dari rangkaian tindakan ritual sebelumnya.
theological_decisions:
- issue: Sifat penyucian dalam ritual penahbisan orang Lewi
  choice: Menggunakan bahasa penyucian ritual tanpa membatasinya hanya pada pembersihan moral
  alternative: Menerjemahkan seluruh istilah sebagai 'membersihkan', atau menafsirkan חטאת secara khusus sebagai 'persembahan penghapus dosa'
  rationale: Ayat ini menetapkan tindakan ritual konkret. 'Menyucikan' mempertahankan sifat kultisnya, sedangkan frasa untuk air tidak dibuat secara eksplisit bersifat korban karena kata benda untuk persembahan tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kaulakukan' mempertahankan sapaan tunggal kepada Musa. Idiom mengenai pisau cukur diterjemahkan secara alami sebagai mencukur seluruh tubuh; penanda catatan kaki [a] dicantumkan tepat setelah frasa yang diterangkan.
