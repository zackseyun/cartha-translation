  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: id
  text: Bawalah orang-orang Lewi ke hadapan Kemah Pertemuan, lalu kumpulkanlah seluruh umat Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh umat anak-anak Israel.”
