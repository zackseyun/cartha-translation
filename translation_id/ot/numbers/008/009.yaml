lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Bawalah
  rationale: Bentuk hifil dari קרב berarti membawa mendekat atau menghadapkan. Dalam rangkaian petunjuk ritual ini, bentuk perintah bahasa Indonesia menyampaikan daya instruksionalnya secara alami.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan jelas bagi anggota suku Lewi yang ditetapkan untuk pelayanan di tempat kudus.
- source_word: לִפְנֵי
  choice: ke hadapan
  rationale: Menunjukkan posisi di depan suatu tempat atau kehadiran. 'Ke hadapan' mempertahankan arah gerak sekaligus nuansa resmi dalam konteks ritual.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Istilah yang mapan dan tepat untuk kemah suci tempat pertemuan yang ditetapkan.
- source_word: וְהִקְהַלְתָּ
  choice: lalu kumpulkanlah
  rationale: Bentuk hifil dari קהל berarti membuat suatu kelompok berkumpul. 'Lalu' menyatakan urutan tindakan yang dibawa oleh waw dalam rangkaian instruksi.
- source_word: כָּל עֲדַת
  choice: seluruh umat
  rationale: עֵדָה menunjuk pada komunitas Israel sebagai satu perhimpunan; 'seluruh umat' alami dalam bahasa Indonesia dan mencakup כָּל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Mempertahankan ungkapan kekerabatan dalam teks Ibrani. Dalam pemakaian korporat, frasa ini merujuk kepada umat keturunan Israel.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: umat Israel
  rationale: Teks sumber memakai ungkapan kekerabatan berbentuk jamak maskulin untuk umat perjanjian secara korporat. Teks utama mempertahankan bentuk ungkapan itu, sedangkan catatan kaki memberi padanan Indonesia yang lebih idiomatis tanpa membatasi rujukannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah dipakai karena ayat ini merupakan kelanjutan instruksi ilahi kepada Musa. Kapitalisasi 'Kemah Pertemuan' menandai nama khusus tempat kudus.
