revisions:
- from: Aku telah memberikan orang-orang Lewi sebagai pemberian kepada Harun dan anak-anaknya dari antara bani Israel,[a] supaya mereka melaksanakan tugas bani Israel di Kemah Pertemuan dan mengadakan pendamaian bagi bani Israel,[b] sehingga tidak ada tulah yang menimpa bani Israel ketika mereka mendekati tempat kudus.[c]
  to: Aku telah memberikan orang-orang Lewi sebagai suatu pemberian kepada Harun dan anak-anaknya dari antara bani Israel,[a] untuk melakukan pelayanan bagi bani Israel di Kemah Pertemuan dan mengadakan pendamaian bagi bani Israel,[b] agar tidak ada tulah di antara bani Israel ketika bani Israel mendekati tempat kudus.[c]
  rationale: Revisi terbatas pada kejelasan dan kelancaran. Frasa pelayanan diperbaiki agar menyampaikan tugas kultis orang Lewi bagi Israel, bukan sekadar ‘tugas’ yang secara gramatikal dapat dianggap milik Israel. Klausa penutup dibuat lebih eksplisit dan lebih dekat dengan pengulangan nomina dalam teks sumber. Tidak ada perubahan makna teologis atau penambahan penafsiran.
