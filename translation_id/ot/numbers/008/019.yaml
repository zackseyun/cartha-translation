  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: id
  text: Aku telah memberikan orang-orang Lewi sebagai suatu pemberian kepada Harun dan anak-anaknya dari antara bani Israel,[a] untuk melakukan pelayanan bagi bani Israel di Kemah Pertemuan dan mengadakan pendamaian bagi bani Israel,[b] agar tidak ada tulah di antara bani Israel ketika bani Israel mendekati tempat kudus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku telah memberikan orang-orang Lewi sebagai orang-orang yang diberikan.” Bahasa Ibrani mengulang akar kata “memberi” untuk memberi penekanan.
    reason: Menjelaskan permainan kata dan penekanan leksikal yang tidak dapat dipertahankan sepenuhnya secara alami dalam teks utama.
  - marker: b
    text: Atau, “mengadakan pendamaian atas bani Israel.”
    reason: Mencatat keluasan preposisi עַל dalam rumusan kultis tanpa mengubah terjemahan utama yang lebih alami.
  - marker: c
    text: Atau, “tempat suci”; istilah Ibraninya dapat menunjuk pada kawasan kudus atau tempat ibadah itu secara lebih luas.
    reason: Mempertahankan kemungkinan cakupan makna הַקֹּדֶשׁ.
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Aku telah memberikan
  rationale: Bentuk naratif dalam firman ilahi ini menyatakan tindakan pemberian yang hasilnya tetap berlaku; bentuk perfektum Indonesia menyampaikan daya resultatif itu secara alami.
- source_word: הַלְוִיִּם נְתֻנִים
  choice: orang-orang Lewi sebagai pemberian
  rationale: Mengungkapkan pengulangan akar נתן ('memberi') dan penekanannya bahwa orang Lewi sendiri diberikan, tanpa memakai frasa Indonesia yang kaku.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kepada Harun dan anak-anaknya
  rationale: Preposisi ל menandai penerima atau pihak yang memperoleh manfaat; 'kepada' paling langsung dalam konteks ini.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dari antara bani Israel
  rationale: מִתּוֹךְ menunjukkan pemilihan dari dalam kelompok yang lebih besar. 'Bani Israel' mempertahankan ungkapan kekerabatan Ibrani dalam bentuk Indonesia yang lazim dan bermartabat.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: supaya mereka melaksanakan tugas
  rationale: Infinitif dan nomina serumpun dari עבד menekankan pelaksanaan kewajiban pelayanan. 'Melaksanakan tugas' alami dalam bahasa Indonesia dan sesuai dengan konteks ibadah.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Padanan baku dan transparan bagi sebutan tempat ibadah tersebut; huruf kapital menandai nama khusus.
- source_word: וּלְכַפֵּר עַל
  choice: dan mengadakan pendamaian bagi
  rationale: Dalam konteks keimaman, כפר menyatakan tindakan pendamaian atau penghapusan kenajisan. Pilihan ini mempertahankan makna kultis tanpa menentukan mekanismenya lebih jauh.
- source_word: נֶגֶף
  choice: tulah
  rationale: Dalam konteks pelanggaran batas tempat kudus, נֶגֶף menunjuk pada pukulan atau bencana ilahi; 'tulah' ringkas dan sesuai dengan register Alkitab Indonesia.
- source_word: בְּגֶשֶׁת
  choice: ketika mereka mendekati
  rationale: Infinitif dengan ב menyatakan keadaan waktu; klausa temporal ini alami dalam bahasa Indonesia.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Dalam konteks Kemah Pertemuan, istilah ini menunjuk pada ruang atau kawasan sakral. 'Tempat kudus' mempertahankan keluasan makna tanpa mempersempitnya secara berlebihan.
theological_decisions:
- issue: Peran orang Lewi dalam kaitannya dengan Israel dan para imam
  choice: Orang Lewi diberikan dari antara Israel kepada Harun dan anak-anaknya untuk melaksanakan tugas Israel dan mengadakan pendamaian bagi Israel.
  alternative: Orang Lewi hanya membantu pekerjaan praktis dan tidak memiliki fungsi apa pun yang berkaitan dengan pendamaian.
  rationale: Ayat ini secara eksplisit menghubungkan tugas orang Lewi dengan pelayanan di Kemah Pertemuan dan כפר bagi Israel. Terjemahan mempertahankan ketegangan tersebut tanpa memasukkan pembedaan teologis yang tidak dinyatakan dalam ayat.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti 'anak-anak laki-laki Israel' tetapi berfungsi sebagai sebutan kolektif bagi umat perjanjian. 'Bani Israel' mempertahankan citra keturunan sekaligus merupakan ungkapan Indonesia yang mapan.
- issue: Tujuan perlindungan dari נֶגֶף
  choice: Pelayanan orang Lewi mencegah tulah menimpa bani Israel ketika mereka mendekati tempat kudus.
  alternative: Tulah dipahami hanya sebagai akibat alamiah atau administratif.
  rationale: Konteks batas kesucian mengisyaratkan hukuman ilahi, tetapi ayat tidak menjelaskan mekanismenya; 'tulah' mempertahankan bobot pernyataan tanpa menambahkan penjelasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku' dipakai untuk tuturan langsung ilahi sesuai konteks orang pertama tunggal. Istilah 'Kemah Pertemuan', 'pendamaian', 'tulah', dan 'tempat kudus' mempertahankan register kultis yang dapat dipahami pembaca umum. Semua penanda catatan kaki muncul dalam teks utama dan ditempatkan pada unsur yang dijelaskan.
