  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: id
  text: Engkau harus membawa orang-orang Lewi ke hadapan Yahweh, lalu orang-orang Israel[a] harus menumpangkan tangan mereka pada orang-orang Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ini adalah ungkapan kolektif yang lazim untuk bangsa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Engkau harus membawa
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau menghadapkan. Dalam konteks ritual ini, “membawa ... ke hadapan” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa arahnya.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan Indonesia yang baku dan jelas bagi sebutan kelompok לוי dalam bentuk jamak tentu.
- source_word: לִפְנֵי יְהוָה
  choice: ke hadapan Yahweh
  rationale: לִפְנֵי dapat berarti “di hadapan” atau “ke hadapan”; bersama verba gerak “membawa,” bentuk “ke hadapan” menyampaikan arah sekaligus konteks kehadiran ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְסָמְכוּ
  choice: lalu ... harus menumpangkan
  rationale: Dalam konstruksi ritual dengan tangan dan עַל, סמך lazim berarti menumpangkan tangan. “Lalu” menyatakan kelanjutan tindakan tanpa menambahkan hubungan kausal.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Secara harfiah ungkapan ini berarti “anak-anak lelaki Israel,” tetapi merupakan ungkapan kolektif baku bagi bangsa Israel. “Orang-orang Israel” alami, inklusif secara referensial, dan tidak menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: יְדֵיהֶם
  choice: tangan mereka
  rationale: Mencerminkan nomina jamak dengan sufiks orang ketiga jamak secara langsung dan alami.
- source_word: עַל הַלְוִיִּם
  choice: ke atas orang-orang Lewi itu
  rationale: Dalam idiom Indonesia, “menumpangkan tangan ke atas” secara jelas menyampaikan tindakan ritual; “itu” menandai kembali kelompok Lewi yang sudah disebut.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankannya sebagai nama ilahi tanpa menggantinya dengan gelar atau memilih bentuk alternatif “Yehuwa”.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  alternative: anak-anak lelaki Israel; umat Israel
  rationale: Bentuk Ibraninya secara harfiah maskulin, tetapi ungkapan tersebut lazim berfungsi sebagai sebutan kolektif bagi bangsa Israel. Terjemahan utama menyampaikan referen kolektifnya, sedangkan catatan kaki mempertahankan transparansi bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti tunggal “Engkau” mempertahankan sapaan langsung kepada Musa, sedangkan “harus” menyampaikan daya perintah bentuk verbal Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah ungkapan yang dijelaskan.
