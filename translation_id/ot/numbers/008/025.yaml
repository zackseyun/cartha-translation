  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: id
  text: Dan mulai usia lima puluh tahun, ia harus berhenti dari dinas pekerjaan itu dan tidak boleh bertugas lagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia harus kembali dari dinas pekerjaan itu”; kata kerja Ibraninya secara harfiah berarti “kembali/berbalik”, tetapi dalam konteks ini berarti berhenti dari tugas aktif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: Namun, sejak berumur lima puluh tahun
  rationale: Ungkapan Ibrani ini menandai ambang usia. 'Sejak berumur lima puluh tahun' alami dalam bahasa Indonesia dan menunjukkan bahwa ketentuan berlaku mulai pada usia tersebut. וּ di sini wajar dipahami sebagai peralihan atau kontras dengan masa pelayanan sebelumnya.
- source_word: יָשׁוּב
  choice: ia harus mengundurkan diri
  rationale: שׁוב secara harfiah berarti 'kembali/berbalik', tetapi dengan מִן dalam konteks penugasan ini berarti menarik diri atau berhenti dari tugas aktif. Catatan kaki mempertahankan arti harfiahnya.
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: dari tugas pekerjaan itu
  rationale: צָבָא dalam konteks orang Lewi menunjuk pada tugas dinas, bukan peperangan, sedangkan עֲבֹדָה berarti pekerjaan atau pelayanan. Frasa ini mempertahankan kedua unsur tanpa menghasilkan pengulangan yang terlalu janggal dalam bahasa Indonesia.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: dan tidak boleh bertugas lagi
  rationale: Bentuk imperfek dalam ketetapan hukum ini menyatakan larangan atau kewajiban. 'Tidak boleh bertugas lagi' menyampaikan bahwa ia tidak lagi menjalankan pekerjaan aktif yang ditetapkan, tanpa menyiratkan larangan atas segala bentuk bantuan.
theological_decisions:
- issue: Cakupan berhentinya orang Lewi pada usia lima puluh tahun
  choice: tidak boleh bertugas lagi
  alternative: tidak boleh melayani lagi dalam bentuk apa pun
  rationale: Ayat ini membatasi tugas pekerjaan aktif yang disebut dalam konteks. Terjemahan tidak memperluasnya menjadi larangan mutlak atas segala bentuk bantuan, terutama karena ayat berikutnya masih memperbolehkan orang tersebut membantu saudara-saudaranya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Bertugas' dipilih untuk konteks resmi pelayanan orang Lewi; 'mengundurkan diri' menyatakan penghentian tugas aktif tanpa nuansa militer yang tidak sesuai.
