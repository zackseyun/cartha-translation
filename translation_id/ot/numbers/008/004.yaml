  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֶ֨ה מַעֲשֵׂ֤ה הַ/מְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד יְרֵכָ֥/הּ עַד פִּרְחָ֖/הּ מִקְשָׁ֣ה הִ֑וא כַּ/מַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת הַ/מְּנֹרָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: id
  text: 'Inilah pembuatan kaki pelita itu: tempaan dari emas[a]. Dari alas hingga bunganya, seluruhnya merupakan hasil tempaan. Sesuai dengan rupa yang telah Yahweh perlihatkan kepada Musa[b], demikianlah kaki pelita itu dibuat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karya tempaan”; istilah Ibraninya menekankan bahwa kaki pelita itu dibentuk dengan cara ditempa. Sebagian orang juga memahaminya sebagai “dibuat dari satu bagian utuh”.
    reason: lexical_alternative
  - marker: b
    text: “Sesuai dengan rupa” juga dapat diterjemahkan “sesuai dengan pola” atau “sesuai dengan penglihatan” yang Yahweh perlihatkan kepada Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: pengerjaan
  rationale: Menunjuk pada cara dan hasil pembuatan benda oleh seorang perajin; 'pengerjaan' alami dalam konteks pertukangan logam.
- source_word: הַמְּנֹרָה
  choice: kaki pelita
  rationale: Menerjemahkan nama benda ibadah ini dengan istilah Indonesia yang umum dan jelas, bukan mentransliterasikannya.
- source_word: מִקְשָׁה
  choice: tempaan / hasil tempaan
  rationale: Menjaga penekanan berulang bahwa emas dibentuk dengan ditempa. Makna 'satu bagian utuh' mungkin tersirat, tetapi tidak dimasukkan ke teks utama.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung bagi bahan yang disebutkan.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: dari alas hingga bunganya
  rationale: Ungkapan berpasangan ini menyatakan keseluruhan bentang benda. יָרֵךְ secara kontekstual menunjuk bagian bawah atau alas, sedangkan פֶּרַח menunjuk hiasan berbentuk bunga.
- source_word: כַּמַּרְאֶה
  choice: sesuai dengan rupa
  rationale: מַרְאֶה secara langsung dapat berarti rupa, penampakan, atau apa yang diperlihatkan. 'Rupa' mempertahankan keluwesan sumber tanpa secara pasti menafsirkannya sebagai pola teknis atau penglihatan.
- source_word: הֶרְאָה
  choice: telah ... perlihatkan
  rationale: Bentuk kausatif dari ראה berarti 'memperlihatkan'; bentuk lampau sempurna Indonesia menandai bahwa tindakan itu mendahului pembuatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri.
- source_word: כֵּן עָשָׂה
  choice: demikianlah orang membuat
  rationale: Mempertahankan hubungan korelatif 'sesuai dengan ... demikianlah'. Karena subjek Ibrani tidak dinyatakan, 'orang' menghindari penentuan identitas atau gender pembuat yang tidak eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama diri dipertahankan tanpa menggantinya dengan gelar, sesuai kebijakan proyek.
- issue: Subjek tersirat pada עָשָׂה
  choice: orang membuat
  alternative: ia membuat; kaki pelita itu dibuat
  rationale: Bahasa Ibrani memakai verba aktif tunggal tanpa menyebut subjek. 'Orang membuat' mempertahankan pelaku manusia yang tak ditentukan dan tidak mengubah verba aktif menjadi pasif.
- issue: Makna כַּמַּרְאֶה dalam konteks pewahyuan
  choice: sesuai dengan rupa
  alternative: sesuai dengan pola; sesuai dengan penglihatan
  rationale: Kata sumber dapat merujuk pada rupa yang diperlihatkan, suatu model/pola, atau penampakan dalam penglihatan. Teks utama memakai padanan yang cukup terbuka, sementara alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan istilah tempaan dipertahankan karena merupakan penekanan dalam teks Ibrani. Struktur kalimat dibagi agar tidak terasa berat, tanpa menghilangkan hubungan antarklausa.
