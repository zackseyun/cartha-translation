base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Yahweh berfirman kepada Musa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: Menjelaskan bentuk Ibrani di balik “Yahweh” dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol memajukan rangkaian wacana. Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan padanan alami dan bermartabat ketika Allah menjadi subjek; unsur penghubung וַ tidak perlu selalu dinyatakan pada awal unit perikop.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: אֶל menandai pihak yang dituju oleh perkataan, sedangkan מֹשֶׁה memakai bentuk nama Indonesia yang lazim.
- source_word: לֵאמֹר
  choice: (tidak dinyatakan tersendiri)
  rationale: Dalam formula pembuka ujaran Ibrani, infinitif ini memperkenalkan isi perkataan yang menyusul. Bahasa Indonesia alami cukup memakai “berfirman kepada Musa,” tanpa ungkapan kaku “dengan mengatakan”; tanda koma menunjukkan bahwa isi firman berlanjut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dan membedakannya dari gelar, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Formula ujaran dibuat alami tanpa menghilangkan fungsinya sebagai pengantar firman pada ayat berikutnya.
