source:
  edition: WLC
  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: id
  text: “Ambillah orang-orang Lewi dari tengah-tengah umat Israel, lalu tahirkanlah mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח
  choice: Ambillah
  rationale: Bentuk imperatif tunggal maskulin dari לקח yang ditujukan kepada Musa. “Ambillah” mempertahankan perintah langsung dan dalam konteks ini mencakup tindakan memisahkan orang Lewi untuk tugas khusus.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Menunjuk kepada kelompok suku Lewi yang ditetapkan untuk pelayanan Kemah Suci. Bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִתּוֹךְ
  choice: dari tengah-tengah
  rationale: Mengungkapkan pemisahan dari dalam kelompok yang lebih besar dan cukup dekat dengan citra spasial ungkapan Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi di sini berfungsi sebagai sebutan kolektif bagi bangsa atau umat Israel. “Umat Israel” alami dalam bahasa Indonesia dan mempertahankan identitas komunal-perjanjian tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: lalu tahirkanlah mereka
  rationale: Dalam konteks ritual, טהר menunjuk pada tindakan menjadikan tahir. “Tahirkanlah” mempertahankan nuansa kemurnian ritual dengan istilah Indonesia yang ringkas dan lazim dalam ragam Alkitab.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Ungkapan Ibrani berbentuk maskulin jamak, tetapi berfungsi sebagai sebutan korporat bagi Israel. Terjemahan “umat Israel” menyampaikan cakupan kolektif dan nuansa komunitas perjanjian tanpa mempersempitnya hanya kepada laki-laki.
- issue: Makna ritual טהר
  choice: tahirkanlah
  alternative: sucikanlah; bersihkanlah
  rationale: Konteks pentahbisan orang Lewi menuntut nuansa ketahiran ritual. “Tahirkanlah” lebih khusus daripada “bersihkanlah” dan tidak secara otomatis menyamakan tindakan ini dengan pengudusan dalam setiap arti teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Imperatif berpartikel -lah menjaga nada perintah langsung. Tidak diperlukan catatan kaki karena makna kolektif בְּנֵי יִשְׂרָאֵל dapat disampaikan secara alami sebagai “umat Israel” tanpa kehilangan informasi penting dalam konteks ini.
