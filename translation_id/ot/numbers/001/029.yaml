  text: those counted from the tribe of Issachar were fifty-four thousand four hundred[a].
translation:
  language: id
  text: Yang terhitung dari suku Isakhar berjumlah 54.400 orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jumlah mereka” atau “yang terdaftar.” Istilah sensus dalam bahasa Ibrani menunjuk kepada mereka yang didata atau dihitung.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: yang terhitung ... berjumlah
  rationale: Bentuk dari פקד dengan sufiks orang ketiga jamak merujuk kepada orang-orang yang didata sekaligus jumlah hasil pendataan. Ungkapan ini mempertahankan konteks sensus dan terdengar alami dalam bahasa Indonesia.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam rumus sensus ini, לְ dengan מַטֶּה menunjukkan afiliasi kesukuan. 'Dari suku' merupakan padanan Indonesia yang alami.
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '54.400'
  rationale: Urutan bilangan Ibrani dinyatakan menurut kaidah bilangan bahasa Indonesia modern, dengan nilai tepat lima puluh empat ribu empat ratus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kata 'orang' ditambahkan setelah angka agar jumlah manusia terbaca alami; istilah ini tersirat jelas oleh konteks sensus, meskipun tidak dinyatakan secara eksplisit dalam klausa Ibrani ini.
