  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: id
  text: Bersama kamu harus ada seorang dari setiap suku, masing-masing adalah kepala kaum keluarganya menurut garis ayah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala rumah bapa-bapanya.” Ungkapan ini merujuk kepada kepala kelompok keluarga atau kaum yang ditentukan menurut garis ayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִתְּ/כֶם
  choice: Bersama kamu
  rationale: Frasa ini menunjukkan bahwa para wakil tersebut harus menyertai Musa dan Harun; bentuk ini alami dan tetap dekat dengan susunan Ibrani.
- source_word: יִהְיוּ
  choice: harus ada
  rationale: Bentuk imperfek dalam konteks perintah ini menyatakan ketentuan mengenai siapa yang harus hadir, bukan sekadar ramalan masa depan.
- source_word: אִישׁ אִישׁ לַ/מַּטֶּה
  choice: seorang dari setiap suku
  rationale: Pengulangan אִישׁ bersifat distributif, yakni satu wakil laki-laki bagi tiap-tiap suku.
- source_word: מַטֶּה
  choice: suku
  rationale: Dalam konteks pendataan dan pengorganisasian Israel, kata ini menunjuk pada kesatuan suku, bukan tongkat secara harfiah.
- source_word: אִישׁ רֹאשׁ
  choice: masing-masing adalah kepala
  rationale: Ungkapan aposisional ini menjelaskan bahwa setiap wakil merupakan pemimpin kelompok leluhurnya; 'kepala' mempertahankan metafora konkret bahasa Ibrani.
- source_word: לְבֵית אֲבֹתָיו
  choice: kaum leluhurnya
  rationale: '''Kaum leluhur'' menyampaikan gagasan kelompok kekerabatan patrilineal dengan lebih alami dalam bahasa Indonesia daripada terjemahan harfiah ''rumah bapa-bapanya''.'
- source_word: הוּא
  choice: adalah
  rationale: Pronomina mandiri yang menegaskan identitas setiap wakil diwujudkan secara alami melalui konstruksi predikatif 'masing-masing adalah kepala'.
