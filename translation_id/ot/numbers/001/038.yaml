  to: 'Untuk keturunan Dan, menurut silsilah mereka, menurut kaum mereka, dan menurut keluarga besar pihak ayah mereka, berdasarkan jumlah nama, semua laki-laki berumur dua puluh tahun ke atas yang sanggup berperang[a]:'
