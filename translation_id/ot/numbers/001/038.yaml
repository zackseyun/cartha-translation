source:
  edition: WLC
  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: id
  text: 'Untuk keturunan Dan, menurut silsilah mereka, menurut kaum mereka, dan menurut keluarga besar pihak ayah mereka, berdasarkan jumlah nama, semua laki-laki berumur dua puluh tahun ke atas yang sanggup berperang[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang layak untuk dinas militer.” Ungkapan Ibrani secara harfiah berbicara tentang keluar untuk berperang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Untuk keturunan Dan
  rationale: Dalam judul sensus ini, ל menandai kelompok yang sedang didata. בני secara harfiah berarti 'anak-anak lelaki', tetapi di sini menunjuk para keturunan laki-laki dalam suku Dan; 'keturunan Dan' lebih alami dalam bahasa Indonesia.
- source_word: תּוֹלְדֹתָם
  choice: menurut silsilah
  rationale: Dalam konteks sensus, istilah ini menunjuk garis keturunan atau pencatatan genealogis, bukan sekadar generasi biologis.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kaum
  rationale: מִשְׁפָּחָה adalah satuan kekerabatan suku yang lebih luas daripada rumah tangga; 'kaum' membedakannya dari puak leluhur pada frasa berikut.
- source_word: לְבֵית אֲבֹתָם
  choice: puak leluhur mereka
  rationale: Ungkapan teknis ini menyatakan unit kekerabatan patrilineal. 'Puak leluhur' mempertahankan struktur sosial yang dimaksud tanpa ungkapan Indonesia yang kaku seperti 'rumah bapak-bapak'.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: berdasarkan jumlah nama
  rationale: Terjemahan ini mempertahankan gambaran pendataan orang satu per satu menurut nama, alih-alih mereduksinya menjadi sekadar jumlah kepala.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini merupakan rumusan ambang usia sensus yang alami dan tepat dalam bahasa Indonesia modern.
- source_word: כֹּל יֹצֵא צָבָא
  choice: semua laki-laki ... yang sanggup maju berperang
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang setiap orang yang 'keluar untuk pasukan/perang'. Konteks ayat 2–3 secara eksplisit membatasi sensus kepada laki-laki dan ungkapan ini menyatakan kelayakan untuk tugas militer.
theological_decisions:
- issue: Bahasa bergender dalam sensus militer
  choice: semua laki-laki yang berumur dua puluh tahun ke atas dan sanggup maju berperang
  alternative: semua orang yang berumur dua puluh tahun ke atas dan layak untuk dinas militer
  rationale: Walaupun ayat 38 memakai bentuk yang dapat dipahami melalui rumusan sensus sebelumnya, konteks dekat secara khusus menghitung laki-laki yang memenuhi syarat militer. Rujukan laki-laki dipertahankan tanpa memperluasnya menjadi bahasa netral gender.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar sensus dipertahankan, tetapi istilah kekerabatan dibuat wajar bagi pembaca masa kini. Titik dua dipakai karena ayat ini merupakan pengantar kepada jumlah pada ayat berikutnya.
