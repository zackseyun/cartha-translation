id: NUM.1.51
reference: Numbers 1:51
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: id
  text: Ketika Kemah Suci berangkat, orang-orang Lewi harus membongkarnya; dan ketika Kemah Suci berkemah, orang-orang Lewi harus mendirikannya. Orang luar[a] yang mendekat harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing” atau “orang yang tidak berwenang”; kata Ibrani ini di sini menunjuk pada orang yang tidak berwenang mendekati tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: Apabila ... akan berangkat
  rationale: Preposisi ב dengan infinitif konstruk נסע membentuk anak kalimat waktu. Ungkapan ini mempertahankan gagasan mulai bergerak sekaligus wajar dalam bahasa Indonesia.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks ini מִשְׁכָּן menunjuk pada tempat kudus portabel Israel. 'Kemah Suci' adalah istilah Indonesia yang jelas dan lazim, meski arti harfiahnya berkaitan dengan tempat kediaman.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: harus membongkarnya
  rationale: Bentuk Hifil dari ירד dalam konteks perjalanan Kemah Suci mengacu pada tindakan menurunkan atau membongkar strukturnya untuk diangkut.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku bagi kelompok yang diberi wewenang menangani Kemah Suci.
- source_word: וּבַחֲנֹת
  choice: apabila ... akan berkemah
  rationale: Infinitif konstruk חנה membentuk anak kalimat waktu yang sejajar dengan frasa sebelumnya. Terjemahan ini mempertahankan gambaran Kemah Suci ikut berangkat dan berkemah bersama perkemahan Israel.
- source_word: יָקִימוּ אֹתוֹ
  choice: harus mendirikannya
  rationale: Bentuk Hifil dari קום di sini berarti membuat Kemah Suci berdiri, yakni mendirikannya di tempat perkemahan.
- source_word: וְהַזָּר
  choice: Orang luar
  rationale: זָר dalam konteks pelayanan tempat kudus menunjuk pada orang yang berada di luar kewenangan pelayanan tersebut, bukan semata-mata orang asing secara etnis.
- source_word: הַקָּרֵב
  choice: yang mendekat
  rationale: Partisipel קרב menyatakan tindakan mendekati ranah atau pelayanan kudus yang terlarang bagi orang yang tidak berwenang.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal dari מות menyatakan kematian yang dikenakan kepada seseorang, bukan sekadar ramalan bahwa ia akan mati; pelakunya tidak disebutkan.
theological_decisions:
- issue: Sifat hukuman dalam יוּמָת
  choice: harus dihukum mati
  alternative: akan mati
  rationale: Bentuk pasif-kausatif Ibrani menunjukkan hukuman mati yang dikenakan, tanpa menentukan apakah pelaksanaannya dilakukan oleh manusia atau secara ilahi.
- issue: Cakupan זָר
  choice: orang luar, yakni orang yang tidak berwenang dalam pelayanan tempat kudus
  alternative: orang asing secara etnis; setiap orang non-Lewi
  rationale: Dalam konteks keimaman dan Kemah Suci, istilah ini terutama menandai status di luar kewenangan kudus. Terjemahan dan catatan kaki menghindari pembatasan yang terlalu etnis maupun penafsiran yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Harus' menyampaikan daya normatif bentuk verbal tanpa memakai gaya arkais. Personifikasi Kemah Suci sebagai sesuatu yang 'berangkat' dan 'berkemah' dipertahankan karena terdapat dalam ungkapan Ibrani dan terkait dengan gerak seluruh perkemahan.
