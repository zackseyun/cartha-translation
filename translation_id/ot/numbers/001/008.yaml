- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan; bentuk “Netaneel” mempertahankan unsur vokal nama Ibrani dan selaras dengan kelaziman nama Alkitab dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam identifikasi genealogis ini, בֶּן menunjuk langsung kepada hubungan ayah-anak; bahasa Indonesia secara alami memakai “anak” tanpa kata penghubung tambahan.
- source_word: צוּעָר
  choice: Zuar
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
