  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: id
  text: 'Inilah nama orang-orang yang akan mendampingi kalian: untuk suku Ruben[a], Elizur anak Syedeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari suku Ruben”. Kata depan Ibrani di sini dapat menunjukkan asal suku atau pihak yang diwakili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה שְׁמוֹת
  choice: Inilah nama
  rationale: Rumus presentasional Ibrani diterjemahkan secara alami dalam bahasa Indonesia. Konjungsi ו tidak perlu dinyatakan tersendiri karena ayat ini melanjutkan daftar dalam konteks sebelumnya.
- source_word: הָ/אֲנָשִׁים
  choice: orang-orang
  rationale: Konteks menunjukkan para laki-laki yang ditunjuk sebagai wakil, tetapi 'orang-orang' merupakan padanan Indonesia yang alami dan tidak mengaburkan identitas mereka dalam daftar nama.
- source_word: אֲשֶׁר יַעַמְדוּ אִתְּ/כֶם
  choice: yang harus mendampingi kamu
  rationale: Secara harfiah berarti 'yang akan/harus berdiri bersama kamu'. Dalam konteks administratif, ungkapan ini menyatakan tugas untuk berada di sisi dan membantu Musa serta Harun; 'mendampingi' menyampaikan fungsinya secara wajar.
- source_word: לִ/רְאוּבֵן
  choice: dari suku Ruben
  rationale: Prefiks ל menandai hubungan atau perwakilan suku. 'Dari suku Ruben' jelas dan alami, sambil mempertahankan alternatif 'untuk suku Ruben' dalam catatan kaki.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus silsilah, בֶּן berarti anak laki-laki dari seseorang; bahasa Indonesia lazim memakai 'anak' di antara dua nama pribadi.
- source_word: שְׁדֵיאוּר
  choice: Syedeur
  rationale: Nama pribadi ditransliterasikan agar mendekati bentuk Ibraninya sekaligus mudah dibaca dalam bahasa Indonesia.
