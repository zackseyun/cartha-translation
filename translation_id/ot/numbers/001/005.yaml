  - severity: low
    issue: Catatan kaki perlu dibalik agar alternatifnya sesuai dengan pilihan teks utama yang direvisi.
    rationale: Jika teks utama memakai “untuk suku Ruben,” pembacaan alternatif yang dicatat adalah “dari suku Ruben.”
