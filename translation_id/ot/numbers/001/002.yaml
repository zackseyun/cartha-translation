base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: id
  text: 'Adakanlah sensus[a] atas seluruh umat Bani Israel[b] menurut kaum mereka dan menurut keluarga pihak ayah mereka, berdasarkan jumlah nama: setiap laki-laki, seorang demi seorang.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “angkatlah kepala”; maksudnya, hitunglah atau daftarkanlah untuk sensus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “orang Israel.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menurut tengkorak/kepala mereka,” sebuah ungkapan Ibrani untuk menghitung tiap orang secara individual.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: Adakanlah sensus
  rationale: Ungkapan Ibrani ini secara harfiah berarti “angkatlah kepala,” tetapi dalam konteks administratif berarti menghitung atau mendaftarkan orang. “Adakanlah sensus” menyampaikan maksudnya dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כָּל עֲדַת
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kesatuan. “Seluruh umat” mempertahankan pengertian kolektifnya dan terdengar alami dalam konteks ini.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang mapan dan tetap dekat dengan bentuk Ibrani harfiah “anak-anak lelaki Israel,” tanpa menjadi kaku.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di dalam suku. “Kaum” membedakannya dari unit keluarga pihak ayah yang disebut sesudahnya.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga pihak ayah mereka
  rationale: Frasa ini menunjuk kepada kelompok keluarga yang disusun berdasarkan garis keturunan ayah. Pilihan ini mempertahankan unsur paternal dalam teks sumber dengan bahasa yang mudah dipahami.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan jumlah nama
  rationale: Pilihan ini mempertahankan bahasa administratif teks Ibrani, yang menggambarkan pencatatan orang berdasarkan nama, dan tidak menyederhanakannya menjadi sekadar “hitunglah.”
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: זָכָר secara khusus menyatakan jenis kelamin laki-laki. “Setiap laki-laki” tepat sekaligus lebih alami dalam bahasa Indonesia daripada bentuk nominal “setiap jantan.”
- source_word: לְגֻלְגְּלֹתָם
  choice: seorang demi seorang
  rationale: Secara harfiah ungkapan ini berarti “menurut tengkorak/kepala mereka,” yaitu idiom untuk menghitung tiap individu. “Seorang demi seorang” menyampaikan fungsi idiom tersebut secara jelas; citra harfiahnya dipertahankan dalam catatan kaki.
