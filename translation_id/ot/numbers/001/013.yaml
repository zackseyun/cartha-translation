lexical_decisions:
- source_word: לְ/אָשֵׁר
  choice: Dari Asyer
  rationale: Dalam daftar pemimpin suku ini, prefiks לְ menunjukkan asal atau keterkaitan dengan suku; 'Dari Asyer' alami dan sesuai konteks.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam identifikasi silsilah, בֶּן menyatakan hubungan keturunan; 'anak' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: עָכְרָן
  choice: Okhran
  rationale: Nama pribadi ditransliterasikan dengan 'kh' untuk mencerminkan konsonan Ibrani כ yang bersifat frikatif, sementara vokal awal mengikuti bentuk yang lazim dalam tradisi nama Alkitab Indonesia.
