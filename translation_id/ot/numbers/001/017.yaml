  source_fidelity: Klausa utama dan rujukan kepada orang-orang yang telah diidentifikasi sudah sejalan dengan Ibrani. Namun, "telah ditetapkan dengan disebut namanya masing-masing" tidak merupakan konstruksi bahasa Indonesia yang wajar dan mengaburkan idiom נִקְּבוּ בְּשֵׁמוֹת, yaitu orang-orang yang disebut atau ditetapkan secara khusus menurut nama.
