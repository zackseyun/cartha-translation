  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: id
  text: Lalu Musa dan Harun mengambil orang-orang ini, yang telah disebut namanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "yang telah ditetapkan secara khusus menurut nama."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam rangkaian narasi ini, לקח berarti mengambil atau membawa orang-orang yang telah disebutkan untuk menjalankan tugas. “Membawa” terdengar alami dalam bahasa Indonesia dan tidak menambahkan gagasan pemanggilan yang tidak dinyatakan secara eksplisit.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: orang-orang ini
  rationale: Frasa ini menunjuk kepada para laki-laki tertentu yang disebut dalam konteks sebelumnya. “Orang-orang ini” alami dalam bahasa Indonesia, sedangkan “para pemimpin ini” akan membuat peran kontekstual menjadi eksplisit tanpa dasar leksikal langsung.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif bahasa Indonesia yang alami untuk menerangkan orang-orang tersebut.
- source_word: נִקְּבוּ
  choice: telah ditetapkan dengan disebut
  rationale: Bentuk Nifal dari נקב dalam konteks ini menyatakan bahwa mereka telah ditunjuk atau diidentifikasi secara khusus. Rumusan ini mempertahankan unsur penetapan sekaligus hubungan eratnya dengan penyebutan nama.
- source_word: בְּשֵׁמוֹת
  choice: namanya masing-masing
  rationale: Ungkapan Ibrani berarti bahwa mereka diidentifikasi secara khusus menurut nama. “Namanya masing-masing” menyampaikan sifat individual itu dengan jelas dan alami.
