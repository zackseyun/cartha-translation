  text: Jumlah orang yang terdaftar dari suku Ruben adalah 46.500 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: jumlah orang yang terdaftar
  rationale: Bentuk ini berasal dari akar פקד dan dalam konteks sensus Bilangan 1 menunjuk kepada orang-orang yang telah didata. Ungkapan ini alami dalam bahasa Indonesia dan tetap menampilkan gagasan pendaftaran/penghitungan.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Gabungan preposisi ל dengan מַטֶּה dalam rumus sensus ini menyatakan afiliasi kesukuan; 'dari suku' adalah padanan Indonesia yang wajar.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Bentuk nama yang lazim digunakan dalam Alkitab berbahasa Indonesia.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '46.500'
  rationale: Jumlah tepatnya disajikan dengan notasi angka Indonesia agar ringkas dan mudah dibaca.
