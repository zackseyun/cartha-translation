translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata 'orang' pada akhir jumlah memperjelas bahwa angka tersebut adalah jumlah manusia, sesuai konteks sensus, tanpa memasukkan keterangan tambahan yang tidak terdapat dalam ayat ini.
