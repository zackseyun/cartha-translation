  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: id
  text: Namun, engkau harus menugaskan orang Lewi untuk bertanggung jawab atas Kemah Suci Kesaksian[a], atas segala perlengkapannya, dan atas segala sesuatu yang menjadi miliknya. Mereka harus mengangkut Kemah Suci beserta segala perlengkapannya, melayaninya[b], dan berkemah di sekeliling Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kediaman Kesaksian.” Istilah Ibrani מִשְׁכָּן dapat berarti kediaman atau kemah suci.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “melayani di sana” atau “mengurusnya.” Kata Ibrani ini mengandung arti melakukan pelayanan, khususnya dalam lingkungan tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Namun engkau
  rationale: Kata sambung ini bersifat kontras dengan larangan menghitung orang Lewi dalam ayat sebelumnya; “namun” menyatakan peralihan itu secara alami.
- source_word: הַפְקֵד ... עַל
  choice: harus menugaskan ... untuk bertanggung jawab atas
  rationale: Bentuk kausatif imperatif dari פקד bersama עַל menyatakan pemberian tugas dan tanggung jawab, bukan sekadar pengangkatan jabatan.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Kemah Suci Kesaksian
  rationale: מִשְׁכָּן menunjuk pada tempat kudus portabel sebagai tempat kediaman ilahi; “Kemah Suci” merupakan istilah Indonesia yang jelas dan lazim, sedangkan bentuk konstruksi dengan “Kesaksian” tetap dipertahankan.
- source_word: כֵּלָיו
  choice: segala perlengkapannya
  rationale: כֵּלִים di sini mencakup berbagai benda, perkakas, dan perabot peribadatan; “perlengkapan” cukup luas dan alami.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: segala sesuatu yang menjadi bagiannya
  rationale: Ungkapan ini mencakup semua yang berkaitan dengan atau menjadi milik Kemah Suci tanpa mempersempitnya hanya pada benda yang berada di dalamnya.
- source_word: יִשְׂאוּ
  choice: mengangkut
  rationale: Dalam konteks perpindahan perkemahan, נשא berarti membawa secara fisik; “mengangkut” menyampaikan fungsi pemindahan Kemah Suci dan perlengkapannya.
- source_word: יְשָׁרְתֻהוּ
  choice: melayani di sana
  rationale: Piel שרת menyatakan pelayanan, khususnya pelayanan kudus. Ungkapan lokatif ini alami dalam bahasa Indonesia sambil mempertahankan hubungan pelayanan dengan Kemah Suci.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: berkemah di sekeliling Kemah Suci
  rationale: Bentuk imperfek dalam konteks instruksi menyatakan kewajiban, dan סָבִיב menunjukkan posisi mengitari tempat kudus.
theological_decisions:
- issue: Istilah kultis untuk מִשְׁכָּן
  choice: Kemah Suci
  alternative: Kediaman; tabernakel
  rationale: “Kemah Suci” dengan jelas menunjuk pada tempat kudus portabel dan mudah dipahami pembaca Indonesia, tanpa menghilangkan sifat sakralnya.
- issue: Makna pelayanan dalam יְשָׁרְתֻהוּ
  choice: melayani di sana
  alternative: melayaninya; mengurusnya
  rationale: Pilihan ini mempertahankan nuansa pelayanan kudus tanpa menyiratkan jabatan atau teologi yang melampaui teks. Catatan kaki mempertahankan kemungkinan hubungan objek yang lebih langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “atas” mempertahankan struktur tanggung jawab dalam teks Ibrani, sementara “harus” menyampaikan daya perintah bentuk-bentuk verbal dalam konteks ini.
