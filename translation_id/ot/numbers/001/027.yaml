  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: id
  text: Orang-orang dari suku Yehuda yang terdaftar berjumlah 74.600 orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang dihitung.” Istilah Ibrani dalam rumus sensus ini dapat berarti orang-orang yang didaftarkan atau yang dihitung.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: jumlah orang yang terdaftar
  rationale: Bentuk dari akar פקד dalam konteks sensus menunjuk kepada orang-orang yang didata. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa pendaftaran resmi.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Preposisi לְ bersama מַטֶּה dalam rumus sensus ini menyatakan keterkaitan dengan suatu suku; 'dari suku' merupakan padanan Indonesia yang idiomatis.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan dekat dengan nama Ibrani.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '74.600'
  rationale: Urutan bilangan Ibrani berarti tujuh puluh empat ribu enam ratus; ditulis dengan format angka Indonesia yang ringkas dan jelas.
