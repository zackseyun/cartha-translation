  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: id
  text: 'Keturunan Ruben, anak sulung Israel, menurut silsilah mereka, menurut kaum mereka, menurut keluarga leluhur mereka, berdasarkan jumlah nama, seorang demi seorang[a]—setiap laki-laki yang berumur dua puluh tahun ke atas, semua yang keluar untuk berperang:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut tengkorak/kepala mereka,” suatu ungkapan yang berarti bahwa setiap orang dihitung secara tersendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי רְאוּבֵן
  choice: Keturunan Ruben
  rationale: Dalam konteks sensus suku, בְנֵי menunjuk kepada keturunan Ruben, bukan hanya anak-anak kandungnya. Unsur וַיִּהְיוּ diserap secara alami ke dalam rumusan daftar yang berlanjut hingga jumlah pada ayat berikutnya.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: anak sulung Israel
  rationale: Frasa aposisional ini mengidentifikasi Ruben sebagai anak sulung Israel tanpa menambah penafsiran.
- source_word: תּוֹלְדֹתָם
  choice: menurut silsilah
  rationale: Dalam konteks genealogis dan sensus, תּוֹלְדוֹת mengacu pada garis atau susunan keturunan. 'Silsilah' menyampaikan fungsi tersebut secara ringkas dan alami.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut ... kaum ... mereka
  rationale: מִשְׁפָּחָה di sini merupakan satuan kekerabatan dalam suku; 'kaum' membedakannya dari keluarga leluhur yang disebut sesudahnya.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut ... keluarga leluhur mereka
  rationale: Ungkapan teknis 'rumah para ayah' menunjuk pada kelompok keluarga berdasarkan garis leluhur. 'Keluarga leluhur' mempertahankan gagasan kekerabatan tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan jumlah nama
  rationale: Terjemahan ini mempertahankan gambaran penghitungan orang-orang yang terdaftar menurut nama.
- source_word: לְגֻלְגְּלֹתָם
  choice: seorang demi seorang
  rationale: Secara harfiah berarti 'menurut tengkorak/kepala mereka' dan secara idiomatis menyatakan bahwa setiap orang dihitung secara tersendiri.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: זָכָר menyatakan jenis kelamin; 'setiap laki-laki' tepat dan wajar dalam bahasa Indonesia.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini adalah ungkapan Indonesia yang alami untuk batas usia yang dinyatakan dalam teks Ibrani.
- source_word: כֹּל יֹצֵא צָבָא
  choice: semua yang keluar untuk berperang
  rationale: Pilihan ini tetap dekat dengan ungkapan harfiah 'setiap orang yang keluar menuju pasukan/perang' dan tidak menambahkan kata 'mampu' atau 'layak' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Apakah כֹּל יֹצֵא צָבָא harus dijelaskan sebagai kelayakan dinas militer
  choice: semua yang keluar untuk berperang
  alternative: semua yang mampu maju berperang
  rationale: Konteksnya memang sensus militer, tetapi teks menyatakan tindakan atau kategori 'keluar untuk berperang', bukan secara eksplisit kemampuan. Terjemahan dipertahankan cukup terbuka agar tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur daftar dipadatkan secara alami dengan deret 'silsilah, kaum, dan keluarga leluhur', sedangkan tanda titik dua dipertahankan karena rumusan sensus ini berlanjut kepada jumlah pada ayat berikutnya.
