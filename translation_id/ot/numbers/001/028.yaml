  naturalness: Bahasanya umumnya baku dan jelas. Pengulangan "menurut" serta "kaum-kaum" membantu pembaca mengikuti susunan administratif formula Ibrani. "Sanggup berperang" lebih alami dan tepat dalam konteks kelayakan daripada "dapat maju berperang."
