  to: 'Untuk keturunan Isakhar, menurut garis keturunan mereka, menurut kaum-kaum mereka, menurut keluarga dari pihak ayah mereka, berdasarkan jumlah nama, semua laki-laki yang berumur dua puluh tahun ke atas dan sanggup berperang:'
