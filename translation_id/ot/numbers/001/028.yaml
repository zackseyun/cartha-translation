  text: לִ/בְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: id
  text: 'Untuk keturunan Isakhar, menurut garis keturunan mereka, menurut kaum-kaum mereka, menurut keluarga dari pihak ayah mereka, berdasarkan jumlah nama, semua laki-laki yang berumur dua puluh tahun ke atas dan sanggup berperang:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Untuk keturunan Isakhar
  rationale: Dalam judul sensus suku ini, לְ paling wajar diterjemahkan “untuk”, sedangkan בְּנֵי secara kontekstual menunjuk kepada para keturunan laki-laki atau anggota suku Isakhar.
- source_word: תּוֹלְדֹתָם
  choice: menurut garis keturunan
  rationale: Istilah ini menunjuk kepada susunan berdasarkan asal-usul atau garis generasi; “garis keturunan” lebih jelas dalam bahasa Indonesia modern daripada terjemahan harfiah “generasi-generasi”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kaum
  rationale: מִשְׁפָּחָה di sini ialah kelompok kekerabatan di dalam suku, sehingga “kaum” lebih tepat daripada “keluarga” dalam arti rumah tangga inti.
- source_word: לְבֵית אֲבֹתָם
  choice: keluarga pihak ayah mereka
  rationale: Ungkapan ini mempertahankan struktur kekerabatan patrilineal Ibrani sekaligus terdengar alami dan dapat dipahami dalam bahasa Indonesia modern.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan jumlah nama
  rationale: Terjemahan ini mempertahankan idiom sensus yang menghitung orang-orang sebagai pribadi yang tercatat menurut nama.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini merupakan ungkapan Indonesia yang alami untuk ambang usia inklusif mulai dari dua puluh tahun.
- source_word: כֹּל יֹצֵא צָבָא
  choice: semua laki-laki ... yang dapat maju berperang
  rationale: Secara harfiah ungkapan ini berarti setiap orang yang keluar untuk pasukan/perang. Dalam konteks sensus, frasa itu menunjuk kepada laki-laki yang memenuhi syarat untuk tugas militer.
theological_decisions:
- issue: Bahasa sensus yang khusus laki-laki
  choice: semua laki-laki ... yang dapat maju berperang
  alternative: semua orang yang maju bersama pasukan
  rationale: Bentuk Ibrani bersifat maskulin dan konteksnya adalah pendataan laki-laki usia militer. Terjemahan mempertahankan kekhususan gender tersebut tanpa menambahkan batasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar sensus dipertahankan, tetapi istilah kekerabatan dibuat cukup alami bagi pembaca umum. Ayat diakhiri titik dua karena kalimat berlanjut ke jumlah dalam ayat berikutnya.
