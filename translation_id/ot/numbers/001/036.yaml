base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: id
  text: 'Untuk keturunan Benyamin, menurut silsilah mereka, menurut kaum mereka, menurut keluarga leluhur mereka, berdasarkan jumlah nama: semua laki-laki yang berumur dua puluh tahun ke atas dan yang dapat maju berperang[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap orang yang keluar untuk berperang,” yaitu ungkapan bagi orang yang memenuhi syarat untuk menjalani tugas militer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Dari keturunan Benyamin
  rationale: Dalam rumus sensus ini, לִבְנֵי menunjuk kepada anggota suku yang berasal dari Benyamin. “Keturunan” lebih wajar dalam bahasa Indonesia daripada ungkapan harfiah “anak-anak” untuk keseluruhan suku.
- source_word: תּוֹלְדֹתָם
  choice: menurut silsilah mereka
  rationale: Dalam konteks pencatatan suku, kata ini menunjuk pada garis keturunan atau catatan asal-usul; “silsilah” mempertahankan unsur genealogis tanpa mengubahnya menjadi istilah birokratis modern.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה adalah kelompok kekerabatan di dalam suku. “Kaum” membedakannya dari suku secara keseluruhan dan dari unit keluarga leluhur yang disebut sesudahnya.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga leluhur mereka
  rationale: Ungkapan Ibrani harfiahnya adalah “rumah para ayah mereka” dan menunjuk pada unit keluarga berdasarkan garis leluhur. Pilihan ini alami dalam bahasa Indonesia serta tetap menyatakan struktur kekerabatan tersebut.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: berdasarkan jumlah nama
  rationale: Frasa ini menggambarkan pencacahan orang-orang yang didaftarkan menurut nama, sambil mempertahankan rumus formal sensus.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: semua laki-laki yang berumur dua puluh tahun ke atas
  rationale: Bentuk tunggal maskulin בֶּן dalam konteks sensus militer merujuk secara kolektif kepada laki-laki yang memenuhi ambang usia dua puluh tahun.
- source_word: כֹּל יֹצֵא צָבָא
  choice: setiap orang yang dapat maju berperang
  rationale: Secara harfiah frasa ini berarti “setiap orang yang keluar untuk bala tentara/perang”; dalam konteks sensus, ini merupakan ungkapan bagi mereka yang memenuhi syarat untuk menjalani tugas militer.
