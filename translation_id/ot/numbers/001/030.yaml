  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: id
  text: 'Dari keturunan Zebulon, menurut silsilah mereka, menurut kaum mereka, dan menurut keluarga pihak ayah mereka, sesuai dengan jumlah nama, semua laki-laki yang berumur dua puluh tahun ke atas dan dapat maju berperang[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memenuhi syarat untuk dinas militer.” Secara harfiah, idiom Ibrani ini berarti “keluar untuk berperang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Dari keturunan Zebulon
  rationale: Prefiks ל memperkenalkan bagian sensus bagi suku tersebut. “Keturunan” menyampaikan cakupan kesukuan dengan lebih alami dalam bahasa Indonesia daripada ungkapan harfiah “anak-anak,” sedangkan nama Zebulon ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: תּוֹלְדֹתָם
  choice: menurut silsilah
  rationale: Dalam konteks sensus, kata ini menunjuk pada pengelompokan atau pencatatan berdasarkan garis keturunan. “Silsilah” mempertahankan makna genealogis tanpa mengartikannya sekadar sebagai angkatan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kaum mereka
  rationale: Istilah ini menunjuk pada kelompok kekerabatan besar di dalam suku. “Kaum” membedakannya dari unit rumah tangga yang lebih sempit.
- source_word: לְבֵית אֲבֹתָם
  choice: keluarga pihak ayah mereka
  rationale: Ungkapan teknis ini secara harfiah berarti “rumah para ayah.” Pilihan ini mempertahankan dasar patrilineal pengelompokan sambil tetap dapat dipahami pembaca modern.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: sesuai dengan jumlah nama
  rationale: Rumusan ini menggambarkan pencacahan orang seorang berdasarkan nama. Bentuk sumber dipertahankan dan tidak diperluas menjadi parafrasa seperti “jumlah kepala.”
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini adalah rumusan ambang usia yang berulang dalam pasal tersebut; terjemahan ini alami dan tepat dalam bahasa Indonesia.
- source_word: כֹּל יֹצֵא צָבָא
  choice: semua laki-laki ... yang dapat maju berperang
  rationale: Dalam konteks sensus militer, partisipan yang dihitung adalah laki-laki yang memenuhi syarat untuk turut dalam pasukan. “Maju berperang” mempertahankan citra idiom Ibrani tentang keluar bersama bala tentara, sementara “dapat” menyampaikan kelayakan praktis yang dimaksud.
theological_decisions:
- issue: Cakupan gender dalam sensus militer
  choice: semua laki-laki
  alternative: semua orang
  rationale: Walaupun כֹּל יֹצֵא tidak memakai nomina eksplisit untuk “laki-laki,” bentuk maskulin, rumusan usia, dan konteks pengerahan pasukan menunjukkan cakupan laki-laki dalam sensus ini. Terjemahan tidak menetralkan rujukan tersebut.
- issue: Makna idiom יֹצֵא צָבָא
  choice: dapat maju berperang
  alternative: memenuhi syarat untuk dinas militer
  rationale: Pilihan utama mempertahankan gambaran konkret dalam bahasa sumber. Alternatif menyatakan fungsi idiom secara lebih abstrak dan dicatat dalam catatan kaki agar ketegangan antara bentuk harfiah dan makna kontekstual tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar sensus yang berulang dipertahankan, tetapi hubungan antarkategori dibuat jelas dengan tanda baca. Istilah “silsilah,” “kaum,” dan “keluarga pihak ayah” dipilih untuk membedakan tiga lapisan pengelompokan kekerabatan.
