  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: id
  text: Dari usia dua puluh tahun ke atas, setiap laki-laki di Israel yang dapat maju berperang[a] harus kamu dan Harun daftarkan menurut kesatuan-kesatuan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang maju berperang.” Ungkapan Ibrani ini merupakan ungkapan militer bagi mereka yang layak menjalani dinas perang; konteks pasal ini menyebut laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut kelompok-kelompok militer mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ungkapan ini menetapkan batas usia minimum. Rumusan tersebut alami dalam bahasa Indonesia modern dan tetap dekat dengan bentuk Ibrani.
- source_word: כָּל יֹצֵא צָבָא
  choice: setiap laki-laki ... yang dapat maju berperang
  rationale: Ini merupakan ungkapan militer tentang orang yang layak menjalani dinas perang. Kata 'laki-laki' sesuai dengan konteks sensus dalam pasal ini, sedangkan 'dapat maju berperang' menyampaikan kelayakan tanpa menghilangkan gambaran konkret gerak maju untuk perang.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Padanan langsung dan alami yang menunjuk bangsa Israel.
- source_word: תִּפְקְדוּ אֹתָם
  choice: harus ... daftarkan
  rationale: Dalam konteks sensus militer, פקד mencakup pencatatan atau pendataan, bukan sekadar menghitung jumlah. 'Daftarkan' jelas dan wajar dalam bahasa Indonesia.
- source_word: לְצִבְאֹתָם
  choice: menurut kesatuan-kesatuan mereka
  rationale: Bentuk jamak ini menunjuk pengelompokan teratur untuk kepentingan militer. 'Kesatuan-kesatuan' mempertahankan nuansa organisasi militer tanpa bahasa arkais.
- source_word: אַתָּה וְאַהֲרֹן
  choice: kamu dan Harun
  rationale: Kata ganti yang eksplisit menegaskan Musa bersama Harun sebagai pelaksana pendaftaran.
theological_decisions:
- issue: Bahasa bergender dalam kelayakan militer
  choice: setiap laki-laki ... yang dapat maju berperang
  alternative: setiap orang yang maju berperang
  rationale: Konteks pasal secara khusus membatasi sensus ini pada laki-laki yang layak untuk dinas militer; karena itu, bahasa bergender mencerminkan sumber dan bukan tambahan doktrinal.
- issue: Makna idiom יֹצֵא צָבָא
  choice: yang dapat maju berperang
  alternative: yang maju berperang
  rationale: Ungkapan ini dapat menggambarkan mereka yang keluar untuk perang, tetapi dalam konteks sensus menunjuk kelayakan untuk dinas. Kata 'dapat' menyampaikan fungsi kontekstual idiom tersebut, sementara catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan urutan umum sumber sambil memakai 'daftarkan' agar fungsi sensus militer jelas bagi pembaca masa kini. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
