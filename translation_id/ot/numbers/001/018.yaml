  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: id
  text: Mereka mengumpulkan seluruh umat pada hari pertama bulan kedua. Lalu mereka mendaftarkan diri berdasarkan garis keturunan mereka[a], menurut klan mereka dan rumah leluhur mereka, berdasarkan jumlah nama, dari yang berumur dua puluh tahun ke atas, seorang demi seorang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menyatakan silsilah mereka” atau “mendaftarkan diri menurut silsilah.” Kata kerja Ibraninya merupakan ungkapan genealogis yang langka dan menunjukkan pendaftaran berdasarkan keturunan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut kepala mereka” atau “menurut tengkorak mereka,” suatu ungkapan yang berarti setiap orang dihitung satu per satu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: mengumpulkan
  rationale: Bentuk Hifil dari קהל menyatakan tindakan membuat seluruh umat berkumpul; “mengumpulkan” alami dan mempertahankan makna kausatifnya.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kesatuan. “Seluruh umat” jelas, bermartabat, dan lebih alami dalam bahasa Indonesia modern daripada istilah yang hanya menyiratkan pertemuan.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: pada hari pertama bulan kedua
  rationale: Ungkapan penanggalan Ibrani ini secara idiomatis berarti hari pertama dalam bulan kedua.
- source_word: וַיִּתְיַלְדוּ
  choice: mendaftarkan diri berdasarkan garis keturunan mereka
  rationale: Bentuk Hitpael yang langka dari ילד dalam konteks sensus menunjukkan pendaftaran atau pernyataan identitas berdasarkan keturunan. Pilihan ini menyampaikan tindakan administratif sekaligus dasar genealogisnya.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: menurut kaum
  rationale: מִשְׁפָּחָה dalam susunan kesukuan Israel menunjuk kepada kelompok kekerabatan setingkat kaum atau klan; “kaum” ringkas dan mudah dipahami.
- source_word: לְבֵית אֲבֹתָם
  choice: keluarga pihak ayah mereka
  rationale: Ungkapan teknis ini secara harfiah berkaitan dengan “rumah para ayah”; “keluarga pihak ayah” mempertahankan organisasi patrilineal yang dinyatakan teks tanpa memakai frasa Indonesia yang kaku.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan penghitungan nama
  rationale: Frasa ini menggambarkan pencacahan orang-orang yang terdaftar dengan nama masing-masing dan mempertahankan nuansa administratif sensus.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: semua yang berumur dua puluh tahun ke atas
  rationale: Ini adalah rumusan batas usia yang jelas dan idiomatis dalam bahasa Indonesia modern.
- source_word: לְגֻלְגְּלֹתָם
  choice: seorang demi seorang
  rationale: Secara harfiah ungkapan itu berarti “menurut kepala/tengkorak mereka,” tetapi berfungsi sebagai idiom bagi pencacahan setiap individu satu per satu. Terjemahan utama menyampaikan maksudnya, sedangkan citra konkretnya dipertahankan dalam catatan kaki.
