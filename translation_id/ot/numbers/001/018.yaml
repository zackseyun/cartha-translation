    issue: “berdasarkan penghitungan nama”
    rationale: Ungkapan ini terdengar seperti metode kalkulasi, bukan enumerasi “menurut jumlah nama” (בְּמִסְפַּר שֵׁמוֹת).
  - severity: low
    issue: “keluarga pihak ayah mereka”
    rationale: Pilihan ini kurang mempertahankan istilah organisasi kekerabatan בית אבות dan kurang sejajar dengan “kaum.”
  - severity: low
    issue: “yaitu semua yang berumur dua puluh tahun ke atas”
    rationale: “Yaitu semua” merupakan tambahan ekspositoris dan membuat hubungan frasa usia dengan pencatatan nama kurang langsung.
