translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-administratif yang bermartabat. Istilah kekerabatan dibuat cukup formal untuk konteks sensus Israel, tetapi tetap dapat dipahami pembaca umum. Penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskannya.
