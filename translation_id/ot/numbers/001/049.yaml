id: NUM.1.49
reference: Numbers 1:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: id
  text: Hanya suku Lewi yang tidak boleh kauhitung, dan jumlah mereka tidak boleh kaumasukkan ke dalam hitungan bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “orang Israel” atau “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: Di sini partikel ini membatasi dan mengecualikan suku Lewi dari perintah sensus sebelumnya.
- source_word: מַטֵּה לֵוִי
  choice: suku Lewi
  rationale: Dalam konteks sensus Israel, מַטֶּה berarti kelompok suku, bukan tongkat secara harfiah.
- source_word: תִפְקֹד
  choice: kauhitung
  rationale: Dalam konteks ini פקד menunjuk pada pencatatan atau penghitungan dalam sensus; 'hitung' jelas dan alami dalam bahasa Indonesia.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: jumlah mereka ... kaumasukkan ke dalam hitungan
  rationale: Gabungan idiomatis נשׂא dengan רֹאשׁ dalam bahasa sensus berarti menghitung atau mencatat jumlah. Terjemahan ini juga menyampaikan bahwa mereka tidak disertakan dalam sensus umum Israel.
- source_word: בְּתוֹךְ
  choice: ke dalam ... bani Israel
  rationale: Preposisi ini menyatakan penyertaan di tengah kelompok yang lebih besar; dalam konstruksi Indonesia, makna tersebut dinyatakan secara alami dengan 'masukkan ke dalam hitungan'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: '''Bani Israel'' merupakan ungkapan Indonesia yang mapan dan bermartabat bagi sebutan Ibrani harfiah ''anak-anak lelaki Israel'', serta tetap menunjuk kepada umat Israel sebagai satu bangsa.'
theological_decisions:
- issue: Sebutan perjanjian yang bergender בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: '''Bani Israel'' mempertahankan bentuk sebutan tradisional yang dekat dengan ungkapan sumber tanpa memberi kesan bahwa sensus ini hanya menyangkut putra kandung Yakub secara langsung. Catatan kaki menjelaskan bentuk harfiahnya.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat 'kau-' mempertahankan sapaan orang kedua tunggal kepada Musa. Dua larangan Ibrani dipertahankan, sedangkan klausa kedua dirumuskan secara idiomatis agar hubungan dengan sensus umum jelas tanpa menghapus penekanan teks sumber.
