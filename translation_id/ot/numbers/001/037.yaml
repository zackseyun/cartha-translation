  language: id
  text: Yang terhitung dari suku Benyamin berjumlah 35.400 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: yang terhitung
  rationale: Bentuk dari akar פקד ini menunjuk kepada orang-orang yang dihitung dalam sensus. 'Yang terhitung' alami dalam bahasa Indonesia dan tidak menambahkan keterangan yang tidak dinyatakan langsung oleh kata tersebut.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam rumusan sensus ini, לְמַטֵּה menyatakan afiliasi kesukuan. 'Dari suku' merupakan ungkapan Indonesia yang wajar sesuai konteks.
- source_word: בִנְיָמִן
  choice: Benyamin
  rationale: Bentuk baku nama pribadi dan suku ini dalam bahasa Indonesia.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '35.400'
  rationale: Menampilkan nilai tepat ungkapan Ibrani, yaitu tiga puluh lima ribu empat ratus, dengan format angka baku Indonesia.
- source_word: —
  choice: berjumlah ... orang
  rationale: Konstruksi predikatif ini membuat hasil sensus terbaca alami dalam bahasa Indonesia. 'Orang' memperjelas bahwa angka tersebut menghitung manusia, sebagaimana ditetapkan oleh konteks sensus pasal ini.
