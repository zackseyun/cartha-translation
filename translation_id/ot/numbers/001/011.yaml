- source_word: אֲבִידָן
  choice: Abidan
  rationale: Nama diri dialihaksarakan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus penamaan ini, בֶּן menyatakan hubungan keturunan laki-laki. 'Anak' terdengar alami dan ringkas dalam bahasa Indonesia; jenis kelamin sudah tersirat oleh konteks nama dan daftar para laki-laki.
- source_word: גִּדְעֹנִי
  choice: Gideoni
  rationale: Nama diri dialihaksarakan, bukan diterjemahkan, dengan bentuk yang lazim dalam bahasa Indonesia.
