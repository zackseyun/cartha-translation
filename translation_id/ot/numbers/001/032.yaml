base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: id
  text: 'Bagi keturunan Yusuf, yaitu keturunan Efraim, menurut silsilah mereka, menurut kaum mereka, dan menurut keluarga leluhur mereka, berdasarkan jumlah nama: semua laki-laki yang berumur dua puluh tahun ke atas, semua yang maju berperang:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Dari keturunan Yusuf
  rationale: Dalam rumus sensus ini, בנים menunjuk kepada keturunan suku, bukan hanya anak kandung; “keturunan” lebih alami dan tepat dalam bahasa Indonesia.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: yaitu keturunan Efraim
  rationale: Menentukan cabang keturunan Yusuf yang sedang dihitung. “Yaitu” memperjelas hubungan aposisional yang tersirat dalam susunan Ibrani.
- source_word: תּוֹלְדֹתָם
  choice: menurut silsilah
  rationale: Dalam konteks sensus, istilah ini mengacu pada garis keturunan atau pengelompokan genealogis; “silsilah” menyampaikan makna itu secara ringkas dan wajar.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה adalah kelompok kekerabatan dalam susunan suku, lebih luas daripada keluarga inti; “kaum” sesuai dengan konteks sosial ini.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga leluhur mereka
  rationale: Ungkapan teknis ini menunjuk pada rumah atau kelompok keluarga berdasarkan garis ayah. “Keluarga leluhur” mempertahankan gagasan garis keturunan tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: didaftarkan namanya satu per satu
  rationale: Ungkapan sensus ini menyatakan pencatatan individual berdasarkan nama. Bentuk verbal ini alami dalam bahasa Indonesia dan sesuai dengan fungsi frasa dalam daftar.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: semua laki-laki yang berumur dua puluh tahun ke atas
  rationale: Menyampaikan ambang usia sensus dengan idiom Indonesia yang lazim; “laki-laki” dibuat eksplisit berdasarkan konteks muster militer dan bentuk בֶּן.
- source_word: כֹּל יֹצֵא צָבָא
  choice: semua yang dapat maju berperang
  rationale: Idiom Ibrani secara harfiah menggambarkan orang yang keluar untuk pasukan/perang. “Dapat maju berperang” menyampaikan kelayakan militer dalam konteks sensus sambil mempertahankan citra perang.
theological_decisions:
- issue: Bahasa bergender dalam sensus
  choice: semua laki-laki yang berumur dua puluh tahun ke atas
  alternative: semua orang yang berumur dua puluh tahun ke atas
  rationale: Sensus ini menghitung laki-laki usia militer. Rujukan maskulin dipertahankan agar cakupan teks tidak dinetralkan.
- issue: Makna יֹצֵא צָבָא
  choice: semua yang dapat maju berperang
  alternative: semua yang keluar untuk dinas militer
  rationale: Frasa tersebut dapat dipahami sebagai idiom kelayakan atau keikutsertaan dalam dinas militer. Teks utama memakai ungkapan perang yang dekat dengan citra Ibrani, sedangkan alternatif administratif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar Ibrani diolah menjadi kalimat sensus yang alami, sambil mempertahankan tingkatan genealogis dan rujukan khusus kepada laki-laki usia militer.
