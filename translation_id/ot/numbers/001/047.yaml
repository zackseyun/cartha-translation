  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: id
  text: Namun, orang Lewi, menurut suku leluhur mereka,[a] tidak dihitung di antara mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menurut suku bapak-bapak mereka.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak didaftarkan” atau “tidak dicatat dalam sensus bersama mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Namun, orang Lewi
  rationale: Konjungsi וְ dipahami secara adversatif karena ayat ini membedakan orang Lewi dari suku-suku yang baru saja dihitung. Bentuk "orang Lewi" merupakan sebutan baku dan alami dalam bahasa Indonesia.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: menurut suku leluhur mereka
  rationale: מַטֶּה dalam konteks sensus berarti "suku", sedangkan אֲבֹתָם secara harfiah berarti "bapak-bapak mereka" dan menunjuk pada garis keturunan leluhur. Terjemahan ini mempertahankan unsur genealogis dalam bahasa Indonesia yang wajar.
- source_word: לֹא הָתְפָּקְדוּ
  choice: tidak dihitung
  rationale: Bentuk hitpael dari פקד dalam konteks sensus menyatakan bahwa mereka tidak didaftar atau dimasukkan dalam penghitungan resmi. "Tidak dihitung" jelas dan sesuai dengan konteks pasal ini.
- source_word: בְּתוֹכָם
  choice: di antara mereka
  rationale: Ungkapan ini menunjukkan bahwa orang Lewi tidak disertakan dalam kelompok suku-suku lain yang dihitung.
