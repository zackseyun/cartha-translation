  text: וַ/יִּֽהְי֛וּ כָּל פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: id
  text: Jadi, semua laki-laki Israel yang dihitung menurut kaum keluarga dari pihak ayah mereka, dari usia dua puluh tahun ke atas, yakni setiap orang yang sanggup maju berperang di Israel,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap orang yang layak menjalani dinas militer di Israel.” Secara harfiah, “setiap orang yang keluar untuk dinas militer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל פְּקוּדֵי
  choice: Jadi, semua ... yang dihitung
  rationale: Bentuk wayyiqtol merangkum hasil penghitungan sebelumnya; “Jadi” menyampaikan daya simpulannya, sedangkan “yang dihitung” mempertahankan makna pasif-hasil dari פקד dalam konteks sensus.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: anak laki-laki Israel
  rationale: Secara harfiah frasa ini berarti “anak-anak lelaki Israel.” Dalam sensus militer yang secara khusus menyangkut laki-laki, unsur gender perlu dipertahankan; “anak laki-laki Israel” alami dan tidak mengesankan bahwa yang dihitung hanyalah putra langsung Yakub.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum keluarga pihak ayah mereka
  rationale: Frasa ini menunjuk pengelompokan patrilineal. “Kaum keluarga pihak ayah” menyatakan struktur sosial tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ungkapan ambang usia ini diterjemahkan secara alami dan tepat.
- source_word: כָּל יֹצֵא צָבָא
  choice: setiap orang yang dapat maju berperang
  rationale: Secara harfiah berarti setiap orang yang keluar untuk pasukan/perang. Dalam konteks sensus, frasa ini menunjuk kelayakan menjalani tugas militer; “dapat maju berperang” mempertahankan citra geraknya sekaligus memperjelas maksudnya.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Terjemahan lugas bagi frasa lokatif-korporat ini.
