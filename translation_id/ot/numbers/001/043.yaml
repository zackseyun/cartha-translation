lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: yang terhitung
  rationale: Bentuk dari פקד dalam rumus sensus ini menunjuk kepada orang-orang yang didata atau dihitung. “Yang terhitung” alami dalam bahasa Indonesia dan mempertahankan konteks pendataan.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam rumus sensus ini, לְ dengan מַטֶּה menyatakan hubungan dengan suku tertentu; “dari suku” merupakan ungkapan Indonesia yang ringkas dan wajar.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim digunakan dalam bahasa Indonesia.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '53.400'
  rationale: Jumlah Ibrani disajikan menurut tata angka Indonesia modern. Tanda titik berfungsi sebagai pemisah ribuan.
