  terminology: “Orang-orang Lewi,” “Kemah Suci Kesaksian,” dan “murka” layak dipertahankan. Istilah “Kesaksian” menjaga ambiguitas הָעֵדוּת dan tidak menafsirkannya secara sempit sebagai hukum atau tabut.
