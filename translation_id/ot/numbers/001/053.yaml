  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: id
  text: Namun, orang-orang Lewi harus berkemah di sekeliling Kemah Suci Kesaksian, supaya murka tidak menimpa umat Israel; dan orang-orang Lewi harus menjalankan tugas penjagaan Kemah Suci Kesaksian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Namun, orang-orang Lewi
  rationale: Kata penghubung וְ mengaitkan perintah ini secara kontras dengan pengaturan suku-suku lain pada ayat sebelumnya. “Namun” menyampaikan alur itu secara wajar, sedangkan “orang-orang Lewi” adalah bentuk baku dan alami dalam bahasa Indonesia.
- source_word: יַחֲנוּ סָבִיב
  choice: harus berkemah di sekeliling
  rationale: Bentuk imperfek dalam konteks pengaturan perkemahan menyatakan kewajiban. “Harus berkemah” mempertahankan daya perintah, dan “di sekeliling” menyampaikan hubungan ruang secara jelas.
- source_word: לְמִשְׁכַּן הָעֵדֻת
  choice: Kemah Suci Kesaksian
  rationale: מִשְׁכָּן menunjuk pada tempat kediaman kudus atau tabernakel. “Kemah Suci” merupakan padanan Indonesia yang jelas dalam konteks Pentateukh, sedangkan “Kesaksian” mempertahankan istilah הָעֵדֻת tanpa mempersempitnya menjadi penafsiran tertentu mengenai dokumen perjanjian.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: supaya murka tidak menimpa
  rationale: Klausa ini menyatakan tujuan atau hasil pencegahan. “Murka” mempertahankan bobot penghakiman dalam konteks kekudusan tempat suci, dan “menimpa” berpadu alami dengan preposisi עַל.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: menimpa umat keturunan Israel
  rationale: עֵדָה menunjuk pada komunitas atau umat Israel, sedangkan בְּנֵי יִשְׂרָאֵל secara harfiah berarti anak-anak atau keturunan Israel. “Umat keturunan Israel” mempertahankan unsur komunal dan genealogis tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: dan ... harus menjaga ... sebagai tanggung jawab mereka
  rationale: Gabungan akar שׁמר dengan מִשְׁמֶרֶת mencakup tindakan menjaga sekaligus pelaksanaan tugas yang dipercayakan. Ungkapan ini menyampaikan kedua unsur itu secara alami dalam bahasa Indonesia.
- source_word: מִשְׁכַּן הָעֵדוּת
  choice: Kemah Suci Kesaksian
  rationale: Frasa yang berulang diterjemahkan secara konsisten, khususnya karena merupakan istilah penting dalam konteks peribadatan.
theological_decisions:
- issue: Sifat קֶצֶף dalam konteks tempat suci
  choice: “Murka” dipahami sebagai murka ilahi atau penghakiman yang dapat menimpa umat bila batas-batas kekudusan tidak dijaga.
  alternative: Kemarahan umum atau kemarahan manusia.
  rationale: Konteks penjagaan Kemah Suci dalam Kitab Bilangan mengarah pada bahaya penghakiman ilahi. Terjemahan tetap tidak menambahkan pelaku secara eksplisit karena subjek murka tidak dinyatakan dalam teks Ibrani.
- issue: Pemadanan בְּנֵי יִשְׂרָאֵל
  choice: “keturunan Israel”
  alternative: “orang Israel” atau bentuk harfiah “anak-anak lelaki Israel”
  rationale: Bentuk Ibrani bersifat genealogis dan secara gramatikal maskulin, tetapi dalam ungkapan kolektif ini menunjuk kepada umat yang berasal dari Israel. “Keturunan Israel” mempertahankan hubungan genealogis tanpa menyiratkan bahwa hanya laki-laki yang terancam murka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Istilah “Kemah Suci Kesaksian” dipakai secara konsisten; struktur kalimat mempertahankan dua kewajiban orang Lewi serta tujuan pencegahannya tanpa menjelaskan lebih daripada teks sumber.
