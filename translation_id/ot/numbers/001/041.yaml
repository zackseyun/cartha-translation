lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: yang terhitung
  rationale: Bentuk dari פקד dengan sufiks orang ketiga jamak menunjuk kepada mereka yang dihitung dalam sensus. Pilihan ini mempertahankan makna pendataan tanpa menambahkan unsur yang tidak dinyatakan dalam frasa tersebut.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam rumus sensus ini, לְ dengan מַטֶּה menyatakan afiliasi kesukuan. 'Dari suku' alami dalam bahasa Indonesia.
- source_word: אָשֵׁר
  choice: Asyer
  rationale: Nama suku ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '41.500'
  rationale: Angka Ibrani bernilai empat puluh satu ribu lima ratus; penulisan angka mempertahankan nilainya secara tepat dan mudah dibaca.
