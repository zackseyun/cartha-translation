base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: id
  text: Seperti yang diperintahkan Yahweh kepada Musa, Musa pun mendaftarkan mereka[a] di padang gurun Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menghitung mereka” atau “mengerahkan mereka.” Kata kerja Ibrani ini dapat menunjuk pada pendaftaran atau penghitungan dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Tepat seperti
  rationale: Menandai kesesuaian tindakan Musa dengan perintah ilahi dan menghubungkannya secara alami dengan konteks sebelumnya.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: Bentuk perfektif Ibrani menyatakan perintah yang telah diberikan sebelum tindakan penghitungan; konstruksi relatif ini alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: Partikel אֶת menandai Musa sebagai objek verba 'memerintahkan'; dalam bahasa Indonesia, verba ini secara alami memakai preposisi 'kepada' bagi penerima perintah.
- source_word: וַיִּפְקְדֵם
  choice: demikianlah ia menghitung mereka
  rationale: Dalam konteks sensus, פקד menunjuk pada tindakan mendata atau menghitung orang. 'Menghitung' jelas bagi pembaca umum, sementara 'demikianlah' menyampaikan kesinambungan hasil dengan klausa pembanding sebelumnya.
- source_word: בְּמִדְבַּר סִינָי
  choice: di Padang Belantara Sinai
  rationale: '''Padang belantara'' menyampaikan kawasan liar atau gurun dari מִדְבָּר tanpa membatasinya pada padang pasir, serta mempertahankan hubungan geografis dengan Sinai.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar, tanpa memaksakan rekonstruksi alternatif.
- issue: Cakupan makna פקד dalam konteks sensus
  choice: menghitung mereka
  alternative: mendata mereka; mengerahkan mereka
  rationale: Konteks mendukung penghitungan dalam sensus, tetapi verba tersebut juga dapat mencakup pendaftaran atau pengerahan. Alternatif dicatat agar keluasan maknanya tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ungkapan 'Tepat seperti ... demikianlah ...' mempertahankan tekanan pada ketaatan terhadap perintah. Kapitalisasi 'Padang Belantara Sinai' dipakai sebagai sebutan geografis.
