translation:
  language: id
  text: Jumlah orang yang terhitung dari suku Simeon adalah 59.300 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: jumlah orang yang terhitung
  rationale: Bentuk dari akar פקד dalam konteks sensus menunjuk kepada orang-orang yang dihitung atau didaftarkan. Ungkapan ini alami dalam bahasa Indonesia dan akhiran pronominal jamak tercermin secara wajar melalui konstruksi jumlah kelompok tersebut.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam rumus sensus ini, לְ dengan מַטֶּה menyatakan hubungan dengan suatu suku; 'dari suku' merupakan padanan Indonesia yang alami.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Bentuk nama yang baku dan dikenal dalam bahasa Indonesia.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: '59.300'
  rationale: Urutan bilangan Ibrani dinyatakan dalam format angka Indonesia modern, dengan titik sebagai pemisah ribuan, sambil mempertahankan jumlah tepat 59.300.
