  text: לִ/בְנֵ֣י אָשֵׁ֔ר תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: id
  text: 'Dari keturunan Asyer, menurut silsilah mereka, menurut kaum mereka, menurut rumah para leluhur mereka, berdasarkan jumlah nama, setiap laki-laki yang berusia dua puluh tahun ke atas, setiap orang yang maju berperang[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “setiap orang yang keluar untuk berperang”, suatu ungkapan bagi mereka yang memenuhi syarat untuk dinas militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Dari keturunan Asyer
  rationale: Preposisi לְ memperkenalkan kelompok suku yang didata. “Keturunan Asyer” menyampaikan makna tribal dengan lebih wajar dalam bahasa Indonesia daripada ungkapan harfiah “anak-anak Asyer”.
- source_word: תּוֹלְדֹתָם
  choice: menurut silsilah
  rationale: Dalam konteks sensus, istilah ini menunjuk pada garis keturunan atau pengelompokan genealogis; “silsilah” ringkas, alami, dan tidak mengandaikan adanya dokumen tertulis.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut ... kaum ... mereka
  rationale: מִשְׁפָּחָה di sini ialah satuan kekerabatan di bawah suku; “kaum” mempertahankan nuansa kelompok kerabat, bukan sekadar keluarga inti.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut ... keluarga pihak ayah mereka
  rationale: Pilihan ini mempertahankan unsur patrilineal dalam ungkapan Ibrani “rumah bapa-bapa mereka” sambil menggunakan bahasa Indonesia modern yang mudah dipahami.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: berdasarkan jumlah nama
  rationale: Terjemahan ini mempertahankan gambaran penghitungan orang seorang menurut nama tanpa mengubahnya menjadi “daftar”, yang tidak dinyatakan secara eksplisit.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: semua laki-laki yang berumur dua puluh tahun ke atas
  rationale: Ungkapan usia diterjemahkan secara idiomatis. “Laki-laki” dibuat eksplisit sesuai bentuk בֶּן dan konteks sensus militer.
- source_word: כֹּל יֹצֵא צָבָא
  choice: setiap orang yang maju berperang
  rationale: Ungkapan ini dipertahankan sebagai idiom tindakan militer, sedangkan cakupan kelayakan untuk dinas militer dijelaskan dalam catatan kaki.
