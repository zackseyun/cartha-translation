translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur berjenjang dari rumusan sensus Ibrani dipertahankan, tetapi istilah kekerabatan dibuat cukup alami bagi pembaca umum. Tanda titik dua dipertahankan karena ayat ini mengantar jumlah sensus pada ayat berikutnya.
