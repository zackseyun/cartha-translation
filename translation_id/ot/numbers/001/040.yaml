revisions:
- from: 'Dari keturunan Asyer, menurut silsilah, kaum, dan keluarga pihak ayah mereka, berdasarkan jumlah nama, semua laki-laki yang berumur dua puluh tahun ke atas, yakni setiap orang yang maju berperang[a]:'
  to: 'Dari keturunan Asyer, menurut silsilah mereka, menurut kaum mereka, menurut rumah para leluhur mereka, berdasarkan jumlah nama, setiap laki-laki yang berusia dua puluh tahun ke atas, setiap orang yang maju berperang[a]:'
  rationale: Revisi menghilangkan “semua ... yakni” agar rumusan sensus tidak menjadi tautologis dan agar idiom militer tetap berfungsi sebagai kualifikasi dalam teks. Istilah kekerabatan juga diselaraskan dengan struktur Ibrani yang berulang melalui “menurut ... mereka.”
