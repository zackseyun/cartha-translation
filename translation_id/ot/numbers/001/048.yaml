base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyatakan perkembangan peristiwa secara alami, sedangkan “berfirman” merupakan padanan bahasa Indonesia yang lazim dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan ujaran; “kepada” adalah padanan Indonesia yang alami dalam konstruksi ini.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak dinyatakan secara terpisah
  rationale: Infinitif לֵאמֹר memperkenalkan isi perkataan yang menyusul. Dalam bahasa Indonesia, fungsi tersebut sudah tersirat secara alami oleh “berfirman kepada Musa” dan tanda koma; menerjemahkannya secara harfiah sebagai “dengan berkata” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut, sementara catatan kaki memberi tahu pembaca tentang padanan tradisional Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Formula ujaran Ibrani dipadatkan secara alami tanpa menghilangkan fungsinya sebagai pengantar perkataan langsung pada ayat berikutnya.
