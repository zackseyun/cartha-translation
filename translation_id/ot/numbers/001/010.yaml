  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: id
  text: 'Dari keturunan Yusuf: dari Efraim, Elisama anak Amihud; dari Manasye, Gamaliel anak Pedazur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Dari keturunan Yusuf
  rationale: Dalam daftar ini, לְ menandai kelompok yang darinya pemimpin disebutkan. בְּנֵי secara harfiah berarti 'anak-anak', tetapi pada konteks suku menunjuk kepada keturunan atau cabang suku; 'keturunan' terdengar alami dan tidak menyiratkan bahwa Efraim dan Manasye masih hidup sebagai peserta sensus.
- source_word: לְאֶפְרַיִם
  choice: dari Efraim
  rationale: לְ menghubungkan Elisama dengan kelompok Efraim dalam struktur daftar. 'Dari Efraim' menyampaikan asal kelompok secara alami tanpa menambahkan kata 'suku' yang tidak dinyatakan langsung.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus silsilah, בֶּן menyatakan hubungan ayah-anak dan secara alami diterjemahkan 'anak' dalam bahasa Indonesia.
- source_word: עַמִּיהוּד
  choice: Amihud
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לִמְנַשֶּׁה
  choice: dari Manasye
  rationale: Diterjemahkan sejajar dengan לְאֶפְרַיִם untuk mempertahankan susunan kedua cabang keturunan Yusuf.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: פְּדָהצוּר
  choice: Pedazur
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
