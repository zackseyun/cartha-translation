  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: id
  text: 'Dari keturunan Manasye, menurut silsilah mereka, menurut kaum-kaum mereka, menurut keluarga mereka berdasarkan garis ayah, berdasarkan jumlah nama, semua laki-laki yang berumur dua puluh tahun ke atas yang maju untuk tugas militer[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang maju berperang.” Ungkapan Ibrani ini menunjuk pada mereka yang memenuhi syarat untuk tugas militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: Dari keturunan Manasye
  rationale: Dalam rumus sensus ini, ל memperkenalkan kelompok suku yang dihitung. בְּנֵי secara harfiah berarti 'anak-anak lelaki', tetapi dalam konteks kesukuan menunjuk pada keturunan Manasye; 'keturunan' alami dan tepat dalam bahasa Indonesia.
- source_word: תּוֹלְדֹתָם
  choice: menurut daftar keturunan mereka
  rationale: Dalam konteks sensus, תּוֹלְדֹת menunjuk pada garis atau catatan genealogis. Penambahan 'daftar' memperjelas fungsi frasa tanpa menghilangkan gagasan keturunan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di dalam suku, lebih luas daripada keluarga inti; 'kaum' mempertahankan tingkat sosial tersebut.
- source_word: לְבֵית אֲבֹתָם
  choice: keluarga-keluarga leluhur mereka
  rationale: Ungkapan Ibrani harfiah 'rumah para ayah mereka' menunjuk pada unit keluarga berdasarkan garis ayah. Pilihan ini menyampaikan struktur leluhur secara wajar tanpa ungkapan Indonesia yang kaku.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan jumlah nama
  rationale: Frasa ini menggambarkan pencacahan orang seorang melalui nama-nama yang didaftarkan dan mempertahankan corak resmi sensus.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: semua laki-laki yang berumur dua puluh tahun ke atas
  rationale: Ungkapan idiomatis ini menetapkan ambang usia. 'Berumur dua puluh tahun ke atas' merupakan bentuk Indonesia modern yang jelas; 'laki-laki' dinyatakan karena konteks dan konstruksi maskulin menunjuk pada pria yang didata untuk tugas militer.
- source_word: כֹּל יֹצֵא צָבָא
  choice: yang maju untuk tugas militer
  rationale: Secara harfiah ungkapan ini menyatakan setiap orang yang 'keluar/maju' untuk צָבָא. Dalam konteks ini צָבָא adalah dinas atau pasukan militer; terjemahan utama mempertahankan citra bergerak maju sekaligus menjelaskan fungsi militernya.
theological_decisions:
- issue: Bahasa bergender dalam sensus
  choice: semua laki-laki ... yang maju untuk tugas militer
  alternative: semua orang ... yang maju untuk tugas militer
  rationale: Sensus ini mencatat pria Israel berumur dua puluh tahun ke atas untuk tugas militer. Menyebut 'laki-laki' mempertahankan rujukan gender khusus dalam konteks, bukan menetralkannya.
- issue: Arti ungkapan keluar bersama pasukan
  choice: maju untuk tugas militer
  alternative: maju berperang
  rationale: צָבָא dapat menyoroti pasukan, dinas militer, atau perang. Terjemahan utama tidak membatasi ungkapan hanya pada pertempuran aktual, sedangkan alternatif yang lebih harfiah dan bernuansa perang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan berderet dipertahankan karena ayat ini merupakan bagian dari rumus sensus yang berlanjut ke ayat berikutnya; tanda titik dua mencerminkan struktur kalimat yang belum selesai.
