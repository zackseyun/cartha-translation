  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah menjadi dua agar hubungan antara orang-orang yang dihitung dan para pemimpin yang menyertai Musa serta Harun tetap jelas. Istilah 'kaum leluhur' dipilih sebagai padanan idiom sosial Ibrani yang mudah dipahami.
