  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: id
  text: Inilah orang-orang yang dihitung[a], yang dihitung oleh Musa, Harun, dan para pemimpin Israel. Para pemimpin itu berjumlah dua belas orang, masing-masing satu orang dari setiap rumah leluhurnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang-orang yang didata.” Dalam bahasa Ibrani, ungkapan ini dapat menyoroti orang-orang yang dihitung atau pencatatan mereka dalam sensus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah para leluhurnya.” Ungkapan ini menunjuk pada kelompok keluarga besar atau kaum berdasarkan garis keturunan dalam susunan kesukuan Israel.
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: orang-orang yang terhitung
  rationale: Bentuk partisip pasif dari פקד dalam konteks sensus menunjuk pada orang-orang yang telah didata, bukan sekadar jumlah abstrak; pilihan ini mempertahankan rujukan personal dan hubungan dengan verba berikutnya.
- source_word: פָּקַד
  choice: dihitung
  rationale: Dalam Bilangan 1 verba ini mengacu pada pelaksanaan sensus atau pendataan. 'Dihitung' jelas, alami, dan selaras dengan 'yang terhitung'.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: para pemimpin Israel
  rationale: נָשִׂיא di sini menunjuk kepada pemimpin suku; 'pemimpin' lebih tepat bagi pembaca modern daripada istilah yang dapat menyiratkan kedudukan kerajaan.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: dua belas orang
  rationale: Dalam konteks ini mereka jelas laki-laki, tetapi bahasa Indonesia secara wajar memakai 'orang' sesudah bilangan; identitas mereka telah ditentukan oleh daftar pemimpin sebelumnya.
- source_word: אִישׁ אֶחָד
  choice: masing-masing satu orang
  rationale: Ungkapan distributif ini menegaskan bahwa setiap kaum leluhur diwakili oleh satu orang.
- source_word: לְבֵית אֲבֹתָיו
  choice: mewakili kaum leluhurnya
  rationale: Frasa ini menunjuk pada unit kekerabatan patrilineal dan fungsi representatif setiap pemimpin. 'Kaum leluhur' mempertahankan gagasan struktur keturunan tanpa menimbulkan kesan sebuah bangunan.
- source_word: הָיוּ
  choice: menyertai mereka
  rationale: Kopula jamak menyatakan keberadaan kedua belas pemimpin bersama Musa dan Harun dalam pelaksanaan penghitungan; 'menyertai mereka' membuat hubungan itu lengkap dan alami dalam bahasa Indonesia.
