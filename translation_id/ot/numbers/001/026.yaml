  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: id
  text: Untuk keturunan Yehuda, menurut garis keturunan mereka, menurut kaum-kaum mereka, menurut keluarga pihak ayah mereka, berdasarkan jumlah nama, dari yang berumur dua puluh tahun ke atas, semua yang berangkat untuk berperang:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berarti "semua yang keluar untuk perang/pasukan" dan dalam konteks sensus merujuk kepada mereka yang termasuk dalam dinas militer.
    reason: Menjelaskan idiom כֹּל יֹצֵא צָבָא serta konteks militer tanpa memasukkan penafsiran itu ke dalam teks utama.
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Untuk keturunan Yehuda
  rationale: Secara harfiah berarti 'untuk anak-anak lelaki Yehuda', tetapi dalam rumusan sensus ini menunjuk kepada anggota suku yang berasal dari Yehuda. 'Keturunan' menyampaikan fungsi genealogisnya secara alami dalam bahasa Indonesia, sedangkan 'untuk' mempertahankan kaitan sintaktis dengan daftar pada ayat sebelumnya.
- source_word: תּוֹלְדֹתָם
  choice: menurut garis keturunan mereka
  rationale: Kata ini dapat menunjuk pada generasi, asal-usul genealogis, atau catatan keturunan. Dalam konteks sensus, 'garis keturunan' mempertahankan makna genealogis tanpa mengandaikan bahwa yang dimaksud pasti dokumen tertulis.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Dalam susunan suku Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan atau klan di bawah tingkat suku. 'Kaum' merupakan istilah Indonesia yang alami dan membedakannya dari unit keluarga pihak ayah yang disebut sesudahnya.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga pihak ayah mereka
  rationale: Ungkapan ini secara harfiah berarti 'menurut rumah para ayah mereka' dan menunjuk pada pengelompokan keluarga patrilineal. 'Keluarga pihak ayah' mempertahankan struktur tersebut tanpa memakai ungkapan 'rumah ayah' yang mudah disalahpahami sebagai bangunan.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan jumlah nama
  rationale: Terjemahan ini mengikuti ungkapan Ibrani dan menyatakan bahwa orang-orang dihitung secara individual menurut nama, tanpa menggantinya dengan istilah yang lebih bebas seperti 'jumlah kepala'.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dari yang berumur dua puluh tahun ke atas
  rationale: Ini menyampaikan batas umur sensus secara alami dan tetap dekat dengan bentuk sumber, 'dari usia dua puluh tahun dan ke atas'.
- source_word: כֹּל יֹצֵא צָבָא
  choice: semua laki-laki yang maju berperang
  rationale: Secara harfiah ungkapan ini berarti 'setiap orang yang keluar untuk pasukan/perang'. Konteks sensus dan bentuk maskulin menunjuk kepada laki-laki usia militer. 'Maju berperang' mempertahankan gambaran tindakan dalam teks tanpa menambahkan kata 'mampu' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Bahasa bergender dalam sensus militer
  choice: semua laki-laki yang maju berperang
  alternative: semua orang yang maju berperang
  rationale: Rumusan Ibrani bersifat maskulin dan dalam konteksnya menghitung laki-laki usia militer. Penyebutan 'laki-laki' mencegah pengaburan cakupan historis sensus, tetapi tidak menambahkan penilaian teologis mengenai peran gender.
- issue: Makna partisipel יֹצֵא dalam rumusan militer
  choice: yang maju berperang
  alternative: yang memenuhi syarat untuk bertugas dalam pasukan
  rationale: Teks secara formal menggambarkan mereka sebagai orang yang 'keluar' untuk pasukan atau perang. Terjemahan utama mempertahankan gambaran itu; makna kelayakan untuk dinas militer dijelaskan dalam catatan tanpa dimasukkan secara diam-diam ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'menurut' dipertahankan untuk mencerminkan susunan formula sensus, sementara 'keluarga pihak ayah' dipilih agar idiom patrilineal sumber dapat dipahami pembaca masa kini.
