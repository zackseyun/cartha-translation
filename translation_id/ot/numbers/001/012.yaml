  rationale: Dalam rumusan identifikasi berdasarkan garis keturunan, בֶּן berarti anak laki-laki dari; “anak” merupakan ungkapan Indonesia yang alami dan tepat dalam daftar nama.
- source_word: עַמִּישַׁדָּי
  choice: Amisyadai
  rationale: Nama pribadi ditransliterasikan dengan ejaan Indonesia, termasuk “sy” untuk bunyi שׁ.
