lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: jumlah yang terdaftar
  rationale: Bentuk dari פקד dengan sufiks orang ketiga jamak merujuk kepada mereka yang dihitung atau didaftarkan dalam sensus. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan nuansa militer yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Dalam rumusan sensus ini, לְ dengan מַטֶּה menunjukkan keanggotaan atau afiliasi kesukuan; 'dari suku' merupakan padanan Indonesia yang wajar.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab berbahasa Indonesia.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: empat puluh ribu lima ratus
  rationale: Padanan langsung angka kardinal Ibrani; ditulis dengan kata-kata agar selaras dengan gaya prosa Alkitab yang bermartabat.
