  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: id
  text: Orang Israel harus berkemah, masing-masing menurut perkemahannya dan masing-masing menurut panjinya, menurut kesatuan-kesatuan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָנוּ
  choice: harus berkemah
  rationale: Bentuk perfektum dengan waw dalam konteks pengaturan ini bernilai preskriptif; “harus berkemah” menyampaikan ketentuan dengan jelas dalam bahasa Indonesia modern.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiahnya “anak-anak lelaki Israel,” tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel; “Orang Israel” alami, jelas, dan tidak menambahkan gagasan yang tidak ada dalam teks.
- source_word: אִישׁ ... וְאִישׁ
  choice: masing-masing ... dan masing-masing
  rationale: Pengulangan distributif dipertahankan tanpa membuat bahasa Indonesia menjadi kaku; konteks sensus dan pasukan tetap menunjukkan para lelaki yang dimaksud.
- source_word: עַל מַחֲנֵהוּ
  choice: menurut perkemahannya
  rationale: עַל di sini menyatakan penempatan atau keterkaitan dengan kelompok perkemahan masing-masing. “Menurut” cocok dengan susunan yang ditetapkan dan sejajar dengan frasa berikutnya.
- source_word: דִּגְלוֹ
  choice: panji-panjinya
  rationale: דֶּגֶל menunjuk pada panji atau tanda kesatuan suku/militer. Bentuk jamak idiomatis dalam bahasa Indonesia menyatakan panji milik kelompok masing-masing, sementara sufiks Ibrani tetap bernilai distributif.
- source_word: לְצִבְאֹתָם
  choice: berdasarkan pasukan-pasukan mereka
  rationale: צָבָא di bagian ini memiliki nuansa kelompok yang terorganisasi untuk tugas militer. “Pasukan-pasukan” mempertahankan nuansa itu tanpa memakai istilah arkais seperti “bala tentara.”
