  yaml_path: translation/ot/numbers/001/035.yaml
  text: Their numbered men from the tribe of Manasseh were thirty-two thousand two hundred.
translation:
  language: id
  text: Jumlah orang yang terdaftar dari suku Manasye adalah 32.200 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: jumlah orang yang terdaftar
  rationale: Dalam konteks sensus ini, bentuk dari פקד menunjuk kepada mereka yang dihitung atau didaftarkan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fokus pada pencatatan sensus.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: Frasa ini menyatakan afiliasi kesukuan; 'dari suku' merupakan padanan Indonesia yang ringkas dan wajar dalam rumusan sensus.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: '32.200'
  rationale: Bilangan Ibrani bernilai tiga puluh dua ribu dua ratus; penulisan angka dengan tanda titik mengikuti kebiasaan baku bahasa Indonesia dan memperjelas data sensus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata 'orang' pada akhir bilangan ditambahkan secara idiomatis untuk memperjelas bahwa angka tersebut menyatakan jumlah orang, tanpa mengubah makna sumber.
