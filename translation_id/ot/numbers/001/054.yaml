revisions:
- from: Demikianlah umat Israel melakukan segala yang diperintahkan Yahweh kepada Musa; demikianlah mereka melakukannya.
  to: Orang Israel melakukan segala sesuatu sesuai dengan yang Yahweh perintahkan kepada Musa; demikianlah mereka melakukannya.
  rationale: Revisi memperjelas bahwa tindakan Israel sesuai dengan keseluruhan perintah Yahweh, menempatkan penegasan “demikianlah” pada penutup sebagaimana כֵּן dalam bahasa Ibrani, dan memakai sebutan kolektif Indonesia yang lebih langsung untuk בְּנֵי יִשְׂרָאֵל. Pengulangan verba penutup tetap dipertahankan.
