  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: id
  text: Orang Israel melakukan segala sesuatu sesuai dengan yang Yahweh perintahkan kepada Musa; demikianlah mereka melakukannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: melakukan
  rationale: Kata kerja עשה bermakna luas, ‘melakukan/mengerjakan’. ‘Melakukan’ alami dalam pernyataan ringkas tentang ketaatan dan dapat diulang pada akhir ayat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi dalam konteks ini menunjuk secara kolektif kepada bangsa Israel. ‘Umat Israel’ merupakan padanan Indonesia yang alami dan tidak keliru membatasi pelakunya hanya pada laki-laki.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala yang
  rationale: Ungkapan ini menyatakan kesesuaian menyeluruh dengan seluruh perintah. Bersama susunan kalimat ‘melakukan segala yang diperintahkan’, makna komparatifnya tersampaikan secara alami.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk perfektif menunjuk pada perintah yang telah diberikan sebelumnya. Dalam bahasa Indonesia, konstruksi relatif pasif ini menyatakan urutan tersebut dengan wajar tanpa perlu penanda kala khusus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: 'Walaupun אֶת menandai objek langsung dalam bahasa Ibrani, verba Indonesia ‘memerintahkan’ lazim memakai penerima dengan ‘kepada’ dalam konstruksi pasif: ‘yang diperintahkan ... kepada Musa’.'
- source_word: כֵּן
  choice: demikianlah
  rationale: Kata ini menegaskan bahwa tindakan Israel tepat sesuai dengan perintah; ‘demikianlah’ juga mempertahankan penutup yang bersifat emfatis.
- source_word: עָשׂוּ
  choice: mereka melakukannya
  rationale: Pengulangan verba Ibrani dipertahankan untuk menjaga penegasan penutup, sedangkan sufiks ‘-nya’ membuat ungkapan itu alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak lelaki Israel
  rationale: Bentuk Ibraninya secara morfologis maskulin, tetapi merupakan sebutan kolektif lazim bagi bangsa Israel dalam konteks ini. Terjemahan harfiah berisiko memberi kesan bahwa hanya laki-laki yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan penutup dipertahankan karena merupakan penegasan sengaja dalam teks Ibrani. Tidak diperlukan catatan kaki karena pilihan ‘umat Israel’ menyampaikan referen kolektif secara tepat dan alami.
