base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: id
  text: 'Keturunan Naftali, menurut garis keturunan mereka, menurut kaum-kaum mereka, menurut keluarga pihak ayah mereka, berdasarkan jumlah nama, dari yang berumur dua puluh tahun ke atas, semua laki-laki yang dapat ikut berperang[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “semua yang pergi berperang” atau “semua yang berangkat untuk dinas militer.” Ungkapan Ibrani ini menunjuk kepada laki-laki yang memenuhi syarat untuk dinas militer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Keturunan Naftali
  rationale: Dalam rumus sensus ini, frasa harfiahnya, ‘anak-anak lelaki Naftali’, menunjuk kepada para anggota suku yang berasal dari Naftali. ‘Keturunan Naftali’ menyampaikan hubungan genealogis itu secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa yang dimaksud hanya anak-anak langsung Naftali.
- source_word: תּוֹלְדֹתָם
  choice: menurut garis keturunan mereka
  rationale: Kata ini berkaitan dengan asal-usul dan susunan genealogis. ‘Garis keturunan’ mempertahankan unsur silsilah serta membedakannya dari kaum dan keluarga yang disebut sesudahnya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Dalam konteks kesukuan Israel, מִשְׁפָּחָה menunjuk kepada kelompok kekerabatan yang lebih luas daripada keluarga inti. ‘Kaum’ merupakan padanan Indonesia yang alami untuk kelompok tersebut.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga pihak ayah mereka
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘rumah para ayah mereka’ dan menunjuk kepada pengelompokan keluarga menurut garis ayah. Pilihan ini mempertahankan struktur patrilineal tanpa memakai ungkapan Indonesia yang kaku.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan jumlah nama
  rationale: Frasa ini menggambarkan penghitungan orang-orang yang terdaftar menurut nama. Terjemahan ini dekat dengan bentuk Ibrani dan sesuai dengan gaya resmi sebuah sensus.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: dari yang berumur dua puluh tahun ke atas
  rationale: Ini menyampaikan secara wajar ambang usia yang dinyatakan oleh rumus Ibrani ‘dari yang berumur dua puluh tahun dan ke atas’.
- source_word: כֹּל יֹצֵא צָבָא
  choice: semua yang dapat ikut berperang
  rationale: Secara harfiah frasa ini berarti ‘setiap orang yang keluar untuk pasukan/perang’. Dalam konteks sensus, maksudnya ialah mereka yang memenuhi syarat untuk dinas militer; ‘dapat ikut berperang’ menyatakan fungsi idiom itu tanpa menghilangkan nuansa militernya.
