  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur berulang ‘menurut’ dipertahankan untuk mencerminkan rumus sensus Ibrani, sedangkan pilihan ‘kaum’ dan ‘keluarga pihak ayah’ menjaga pembedaan tingkat-tingkat kekerabatan. Tanda titik dua dipertahankan karena ayat ini merupakan pengantar bagi jumlah sensus pada ayat berikutnya.
