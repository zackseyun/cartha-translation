lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: dari Simeon
  rationale: Dalam daftar pemimpin suku ini, prefiks לְ menandai hubungan atau perwakilan suku. “Dari Simeon” alami dalam bahasa Indonesia dan, sesuai konteks ayat-ayat sekitarnya, berarti bahwa orang yang disebut berasal dari atau mewakili suku Simeon tanpa menambahkan kata yang tidak tersurat.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus identifikasi genealogis ini, בֶּן secara langsung menyatakan hubungan anak laki-laki dengan ayahnya. Bahasa Indonesia lazim memakai “anak” dalam penyebutan nama semacam ini.
- source_word: צוּרִישַׁדָּי
  choice: Zurisadai
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang mudah dibaca dan lazim dalam tradisi Alkitab bahasa Indonesia.
