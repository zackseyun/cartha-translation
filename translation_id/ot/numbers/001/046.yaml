lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Jadi, jumlah ... adalah
  rationale: Bentuk wayyiqtol dari היה melanjutkan sekaligus menyimpulkan hasil sensus; susunan ini menyampaikan nuansa hasil secara alami dalam bahasa Indonesia.
- source_word: כָּל
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh dari kata Ibrani.
- source_word: הַפְּקֻדִים
  choice: orang yang dihitung
  rationale: Partisip pasif dari פקד menunjuk kepada mereka yang didaftarkan atau dihitung dalam sensus. Pilihan ini jelas dan tidak menambahkan kata 'laki-laki' yang tidak diulangi dalam ayat ini, meskipun konteks sebelumnya menentukan kelompok yang disensus.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '603.550'
  rationale: Nilai bilangan Ibrani, yaitu enam ratus tiga ribu lima ratus lima puluh, disajikan dengan format angka baku Indonesia agar mudah dibaca.
