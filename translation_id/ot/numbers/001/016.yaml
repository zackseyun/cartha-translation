  rationale: Revisi menghapus “antara,” yang menambahkan nuansa seleksi secara lebih kuat daripada konstruksi Ibrani, dan menyesuaikan “para kepala” menjadi “kepala-kepala” untuk mencerminkan bentuk jamak. Terjemahan ‘kelompok-kelompok seribu Israel’ dan catatannya tetap membiarkan terbuka apakah אֶלֶף adalah angka harfiah atau satuan sosial/militer.
