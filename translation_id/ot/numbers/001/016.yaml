  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: id
  text: Mereka inilah orang-orang yang dipanggil dari umat itu[a], para pemimpin suku-suku leluhur mereka, kepala-kepala kelompok-kelompok seribu Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang disuruh datang dari umat itu” atau “orang-orang yang ditunjuk dari umat itu.” Bentuk Ibraninya dapat berarti dipanggil, disuruh datang, atau ditunjuk.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “kelompok-kelompok seribu Israel” dapat menunjuk secara harfiah kepada kelompok seribu, atau secara lebih luas kepada kelompok kekerabatan atau satuan militer di Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Bentuk penunjuk jamak ini memperkenalkan dan mengidentifikasi orang-orang yang baru saja disebut; “Inilah” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: קְרִיאֵי
  choice: orang-orang yang dipanggil
  rationale: Partisip pasif dari קרא dapat berarti orang-orang yang dipanggil, disuruh datang, atau ditunjuk. Pilihan ini mempertahankan bentuk pasif dan tidak mempersempit maknanya menjadi pemilihan resmi.
- source_word: הָעֵדָה
  choice: umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu umat atau perhimpunan. “Umat itu” alami dalam konteks Israel dan tetap dapat mencakup komunitas yang berhimpun.
- source_word: נְשִׂיאֵי
  choice: para pemimpin
  rationale: Dalam konteks kesukuan dan pemerintahan, נָשִׂיא berarti pemimpin atau kepala. “Para pemimpin” jelas dan tidak menyiratkan gelar kebangsawanan.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: suku-suku leluhur mereka
  rationale: מַטּוֹת menunjuk kepada suku-suku, sedangkan אֲבוֹתָם mengaitkannya dengan garis keturunan pihak leluhur. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan unsur keturunan.
- source_word: רָאשֵׁי
  choice: para kepala
  rationale: Terjemahan ini mempertahankan metafora Ibrani “kepala” bagi orang yang memimpin suatu kelompok.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: kelompok-kelompok seribu orang Israel
  rationale: אֶלֶף dapat berarti bilangan seribu, tetapi juga dapat menunjuk kepada satuan sosial atau militer. Terjemahan utama mempertahankan gambaran bilangan dalam teks sambil mencatat kemungkinan lain.
- source_word: הֵם
  choice: Inilah
  rationale: Pronomina penegas pada akhir klausa berfungsi mengidentifikasi orang-orang tersebut. Dalam bahasa Indonesia, daya identifikasinya paling alami disampaikan di awal melalui “Inilah”.
