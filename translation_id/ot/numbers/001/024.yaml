translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur berulang 'menurut' dipertahankan untuk mencerminkan rumus sensus Ibrani, sedangkan istilah kekerabatan dibuat cukup alami bagi pembaca umum. Tanda titik dua dipertahankan karena ayat ini merupakan pengantar bagi jumlah sensus pada ayat berikutnya.
