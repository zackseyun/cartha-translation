  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ/בְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: id
  text: 'Dari keturunan Gad[a], menurut silsilah mereka, menurut kaum mereka[b], menurut kaum keluarga pihak ayah mereka, berdasarkan jumlah nama, semua laki-laki yang berumur dua puluh tahun ke atas dan dapat maju berperang[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Gad”. Ungkapan ini menunjuk kepada anggota laki-laki suku Gad yang dihitung dalam sensus.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “menurut puak mereka” atau “menurut keluarga besar mereka”.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “setiap orang yang keluar untuk berperang”. Atau: “setiap orang yang menjalani dinas militer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Dari keturunan Gad
  rationale: Prefiks ל memperkenalkan kelompok suku dalam rumus sensus. 'Keturunan Gad' menyampaikan idiom Ibrani 'anak-anak lelaki Gad' secara wajar tanpa mengaburkan bahwa yang didata ialah anggota laki-laki.
- source_word: תּוֹלְדֹתָם
  choice: menurut silsilah mereka
  rationale: Dalam konteks sensus, istilah ini menunjuk pada garis keturunan atau pengelompokan genealogis; 'silsilah' lebih alami dalam bahasa Indonesia daripada 'generasi-generasi'.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: '''Kaum'' menggambarkan kelompok kekerabatan di bawah tingkat suku dan menghindari kesan keluarga inti modern.'
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum keluarga pihak ayah mereka
  rationale: Ungkapan ini mempertahankan struktur kekerabatan patrilineal dari istilah teknis Ibrani, tetapi tetap dapat dipahami pembaca Indonesia modern.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: berdasarkan jumlah nama
  rationale: Terjemahan ini dekat dengan bentuk Ibrani dan menunjukkan bahwa sensus dilakukan melalui pencatatan nama individual.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: semua laki-laki yang berumur dua puluh tahun ke atas
  rationale: Rumus ambang usia diterjemahkan secara idiomatis; 'laki-laki' sesuai dengan konteks anggota suku yang wajib atau layak menjalani tugas militer.
- source_word: כֹּל יֹצֵא צָבָא
  choice: setiap orang yang dapat maju berperang
  rationale: Ungkapan tersebut menunjuk kepada orang yang layak menjalani tugas militer. 'Dapat' menyampaikan kelayakan yang tersirat tanpa menjadikannya sekadar gerak fisik.
