translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur berulang 'menurut' dipertahankan untuk mencerminkan rumus sensus Ibrani, sementara istilah kekerabatan dibuat cukup alami bagi pembaca umum. Tanda titik dua dipertahankan karena ayat ini mengantar kepada jumlah sensus pada ayat berikutnya.
