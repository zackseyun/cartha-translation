  to: Mengenai keturunan Simeon, menurut garis keturunan mereka, menurut kaum mereka, menurut keluarga pihak ayah mereka, orang-orang yang terdaftar di antara mereka,[a] menurut jumlah nama, seorang demi seorang,[b] setiap laki-laki yang berumur dua puluh tahun ke atas, semua yang keluar untuk berperang:[c]
