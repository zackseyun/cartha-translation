  - severity: low
    issue: Kata “yaitu” menambahkan hubungan eksplikatif
    rationale: Teks Ibrani menempatkan “setiap laki-laki berusia dua puluh tahun ke atas” dan “semua yang keluar untuk berperang” dalam formula berturut-turut. Menghilangkan “yaitu” menjaga bentuk tersebut lebih dekat, tanpa mengurangi keterbacaan.
