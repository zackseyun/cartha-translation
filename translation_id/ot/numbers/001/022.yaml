  terminology: “Keturunan,” “garis keturunan,” “kaum,” “keluarga pihak ayah,” “terdaftar,” dan “seorang demi seorang” merupakan pilihan yang dapat dipertahankan. Catatan kaki secara substansial akurat; catatan c perlu diselaraskan dengan terjemahan yang direvisi.
