  source_fidelity: 'Terjemahan secara umum mengikuti rumus sensus Ibrani dengan baik: urutan unit kekerabatan, pendaftaran menurut nama secara perorangan, batas usia, dan orientasi militer semuanya terwakili. Namun, “maju berperang” sedikit lebih spesifik daripada יֹצֵא צָבָא, yang secara harfiah menggambarkan orang yang “keluar untuk berperang/dinas perang,” bukan niscaya sedang maju dalam pertempuran. Kata “yaitu” juga membuat hubungan penjelasan yang tidak dinyatakan secara eksplisit dalam bentuk formula Ibrani.'
