  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ/בְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם פְּקֻדָ֗י/ו בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: id
  text: Mengenai keturunan Simeon, menurut garis keturunan mereka, menurut kaum mereka, menurut keluarga pihak ayah mereka, orang-orang yang terdaftar di antara mereka,[a] menurut jumlah nama, seorang demi seorang,[b] setiap laki-laki yang berumur dua puluh tahun ke atas, semua yang keluar untuk berperang:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang-orang yang dihimpun dari antara mereka”; kata Ibrani dari akar פקד dalam konteks ini dapat bernuansa sensus ataupun pengerahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut tengkorak/kepala mereka,” suatu ungkapan untuk pencacahan setiap orang secara individual.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “setiap orang yang layak menjalani dinas militer”; teks Ibraninya lebih harfiah berbunyi “semua yang keluar untuk berperang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: Mengenai keturunan Simeon
  rationale: Dalam rumus sensus suku, בְּנֵי menunjuk kepada keturunan atau anggota suku dari leluhur bernama Simeon. 'Keturunan' lebih alami daripada 'anak-anak' dalam bahasa Indonesia dan tetap mempertahankan kaitan genealogis.
- source_word: תּוֹלְדֹתָם
  choice: menurut garis keturunan mereka
  rationale: Dalam konteks sensus-genealogis, תולדות menunjuk kepada garis asal-usul atau generasi. 'Garis keturunan' menyampaikan fungsi administratif-genealogisnya secara jelas.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה adalah unit kekerabatan tingkat kaum di dalam suku; 'kaum' membedakannya dari rumah tangga atau keluarga pihak ayah.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut keluarga pihak ayah mereka
  rationale: Ungkapan בֵּית אָבוֹת menunjuk kepada unit kekerabatan berdasarkan garis ayah. Terjemahan ini transparan dan lebih mudah dipahami daripada ungkapan harfiah 'rumah ayah'.
- source_word: פְּקֻדָיו
  choice: orang-orang yang terdaftar di antara mereka
  rationale: Bentuk dari פקד dalam konteks ini menunjuk kepada mereka yang didata atau dihitung dalam sensus; 'terdaftar' mempertahankan nuansa pencatatan tanpa terlalu cepat mempersempitnya menjadi pengerahan militer.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: menurut jumlah nama
  rationale: Rumus ini menunjukkan pencacahan berdasarkan nama-nama perseorangan dan dapat dipertahankan secara dekat dalam bahasa Indonesia.
- source_word: לְגֻלְגְּלֹתָם
  choice: seorang demi seorang
  rationale: Secara harfiah berarti 'menurut tengkorak/kepala mereka', yakni pencacahan individual. Idiom Indonesia 'seorang demi seorang' menyampaikan maksudnya secara alami.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: זָכָר menyatakan jenis kelamin laki-laki; dalam konteks ambang usia sensus, 'setiap laki-laki' alami dan tepat.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ini adalah rumus batas usia yang dapat diterjemahkan secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: כֹּל יֹצֵא צָבָא
  choice: setiap orang yang maju berperang
  rationale: Terjemahan ini menjaga gambaran verbal harfiah 'keluar/maju untuk perang' tanpa menambahkan secara eksplisit gagasan 'mampu' atau 'layak', meskipun ungkapan tersebut dalam konteks sensus menunjuk kepada kewajiban atau kelayakan militer.
