  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa di padang gurun Sinai, di Kemah Pertemuan, pada hari pertama bulan kedua, pada tahun kedua setelah mereka keluar dari tanah Mesir, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam konteks ketika Yahweh menjadi subjek, “berfirman” merupakan padanan naratif yang alami dan bermartabat untuk tindakan berbicara ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּמִדְבַּר סִינַי
  choice: di padang gurun Sinai
  rationale: “Padang gurun” menyampaikan wilayah liar dan gersang yang dimaksud מִדְבָּר tanpa membatasi maknanya pada gurun pasir.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Padanan ini mempertahankan kedua unsur ungkapan Ibrani, yaitu “kemah” dan “pertemuan,” serta lebih transparan daripada istilah tradisional.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: pada hari pertama bulan kedua
  rationale: Ungkapan kalender Ibrani disampaikan dengan bentuk Indonesia yang jelas dan alami.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: dalam tahun kedua
  rationale: Padanan ini mempertahankan penentuan waktu yang eksplisit dalam teks sumber.
- source_word: לְצֵאתָם
  choice: setelah mereka keluar
  rationale: Infinitif dengan akhiran pronominal menyatakan waktu sehubungan dengan keluarnya bangsa Israel; bentuk klausa ini alami dalam bahasa Indonesia.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Kata אֶרֶץ dipertahankan sebagai “tanah” agar seluruh ungkapan sumber terwakili.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Formula pengantar kutipan ini secara alami menandai bahwa isi firman menyusul pada ayat berikutnya, tanpa pengulangan kaku “berfirman ... dengan berkata.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan keterangan tempat dan waktu mengikuti alur sumber sejauh tetap alami. Huruf kapital pada “Kemah Pertemuan” menandai nama tempat ibadah tertentu.
