source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: id
  text: Mereka tidak boleh menyisakan sedikit pun darinya sampai pagi, dan tidak boleh mematahkan satu pun tulangnya.[a] Mereka harus merayakannya sesuai dengan seluruh ketetapan Paskah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ketentuan bahwa tulangnya tidak boleh dipatahkan mengulangi petunjuk Paskah dalam Keluaran 12:46.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: Mereka tidak boleh menyisakan sedikit pun darinya sampai pagi
  rationale: Bentuk Hifil יַשְׁאִירוּ menyatakan tindakan menyisakan atau membiarkan tetap ada. מִמֶּנּוּ bernilai partitif; ‘sedikit pun darinya’ mengungkapkan larangan menyeluruh secara alami dalam bahasa Indonesia.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: dan tidak boleh mematahkan satu pun tulangnya
  rationale: Kata עֶצֶם berbentuk tunggal tetapi digunakan secara distributif. ‘Satu pun tulangnya’ mempertahankan cakupan larangan dan lebih alami daripada terjemahan harfiah ‘sebuah tulang padanya’.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: sesuai dengan seluruh ketetapan Paskah
  rationale: חֻקָּה menunjuk pada ketetapan atau aturan yang ditetapkan. Bentuk tunggal dengan כָּל menyatakan keseluruhan aturan yang mengatur perayaan Paskah.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: Mereka harus merayakannya
  rationale: Dalam konteks hari raya, עשה dapat berarti menjalankan atau merayakan suatu perayaan. ‘Merayakannya’ jelas dan wajar, sementara pronomina tetap merujuk pada Paskah yang sedang dibicarakan.
theological_decisions:
- issue: Makna antarteks dari larangan mematahkan tulang
  choice: Menerjemahkannya secara langsung sebagai ketentuan Paskah dan mencantumkan kaitannya dengan Keluaran 12:46 dalam catatan kaki.
  alternative: Membentuk redaksi ayat utama untuk menonjolkan pemaknaan kristologis dalam Perjanjian Baru.
  rationale: Dalam konteks langsungnya, ayat ini menetapkan cara merayakan Paskah. Hubungan kanonisnya penting, tetapi penafsiran teologis yang muncul kemudian tidak boleh dimasukkan ke dalam isi eksplisit teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘tidak boleh’ menyampaikan daya larangan, sedangkan ‘sedikit pun’ dan ‘satu pun’ membuat cakupan negatif bahasa Ibrani jelas tanpa terasa kaku.
