  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: id
  text: Namun, orang yang tahir dan tidak sedang dalam perjalanan, tetapi tidak merayakan Paskah, harus diputus dari antara bangsanya[a], karena ia tidak mempersembahkan persembahan bagi Yahweh pada waktu yang telah ditetapkan. Orang itu harus menanggung dosanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa itu harus diputuskan.” Ungkapan Ibrani ini menyatakan penghukuman perjanjian yang berat, tetapi ayat ini tidak merinci bagaimana hukuman tersebut dilaksanakan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “harus menanggung kesalahannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: tahir
  rationale: Dalam konteks ini kata tersebut menunjuk pada keadaan bersih secara ritual, bukan kemurnian moral. “Tahir” merupakan istilah baku dan ringkas dalam bahasa Indonesia untuk konsep ini.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: tidak sedang dalam perjalanan
  rationale: Ungkapan ini menyatakan bahwa orang tersebut tidak berada jauh karena bepergian, sesuai dengan pengecualian dalam konteks ayat-ayat sebelumnya.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: tetapi lalai merayakan Paskah
  rationale: חָדַל dapat berarti berhenti, menahan diri, atau tidak melaksanakan. “Lalai” menyampaikan kegagalan yang disengaja atau tanpa alasan sah, sedangkan “merayakan Paskah” mencakup pelaksanaan ketetapan Paskah, bukan hanya tindakan mempersembahkan kurban.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: harus diputuskan
  rationale: נֶפֶשׁ di sini berarti orang atau pribadi. “Diputuskan” mempertahankan ungkapan hukum-perjanjian yang kuat tanpa menentukan secara lebih sempit bentuk pelaksanaannya.
- source_word: מֵעַמֶּיהָ
  choice: dari bangsanya
  rationale: Kata ganti feminin mengikuti bentuk gramatikal נֶפֶשׁ, tetapi mengacu kepada laki-laki yang sedang dibicarakan. “Bangsanya” secara alami menyatakan komunitas umatnya.
- source_word: קָרְבַּן יְהוָה
  choice: persembahan bagi Yahweh
  rationale: קָרְבָּן adalah sesuatu yang dibawa sebagai persembahan kepada Allah. “Bagi Yahweh” menyampaikan hubungan persembahan itu dengan penerimanya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: בְּמֹעֲדוֹ
  choice: pada waktu yang telah ditetapkan
  rationale: מוֹעֵד di sini adalah waktu tetap yang ditentukan untuk pelaksanaan Paskah.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: harus menanggung dosanya
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang memikul dosa beserta pertanggungjawaban atau akibatnya, tanpa menggantinya secara interpretatif dengan “kesalahan” atau “hukuman” saja.
- source_word: הָאִישׁ הַהוּא
  choice: Orang itu
  rationale: Acuannya tetap jelas kepada laki-laki yang disebut pada awal ayat; “orang itu” terdengar lebih alami dalam bahasa Indonesia dan tidak mengubah referen gramatikalnya.
theological_decisions:
- issue: Makna hukuman “diputuskan dari bangsanya”
  choice: Mempertahankan ungkapan “harus diputuskan dari bangsanya” tanpa merinci bentuk hukumannya.
  alternative: “harus disingkirkan dari umatnya” atau “harus dihukum mati”
  rationale: Ungkapan Ibrani menyatakan hukuman perjanjian yang berat, tetapi ayat ini tidak menjelaskan apakah pelaksanaannya berupa kematian, pengucilan, ketiadaan keturunan, atau penghukuman langsung oleh Allah. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
- issue: Makna “menanggung dosanya”
  choice: Mempertahankan idiom yang mencakup dosa serta pertanggungjawaban atas akibatnya.
  alternative: “harus menanggung kesalahannya”
  rationale: חֵטְא berarti dosa, tetapi konstruksi dengan נָשָׂא dapat menekankan tanggungan kesalahan dan akibat hukum. Terjemahan utama mempertahankan keluasan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “tahir” mempertahankan nuansa ritual; “Paskah” memakai istilah Alkitab yang umum; susunan kalimat dijaga jelas bagi pembaca umum tanpa menghilangkan idiom hukum-perjanjian dalam teks Ibrani.
