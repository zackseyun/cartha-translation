id: NUM.9.20
reference: Numbers 9:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: id
  text: Kadang-kadang awan itu tetap berada di atas Kemah Suci selama beberapa hari. Atas perintah Yahweh mereka berkemah[a], dan atas perintah Yahweh mereka berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut mulut Yahweh”—artinya, atas perintah Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Kadang-kadang
  rationale: Ungkapan ini memperkenalkan salah satu keadaan yang sesekali terjadi dalam rangkaian situasi yang berbeda-beda; “Kadang-kadang” alami dan tepat dalam bahasa Indonesia.
- source_word: יִהְיֶה הֶעָנָן
  choice: awan itu tetap berada
  rationale: Dalam konteks perjalanan, היה menyatakan keberadaan yang berlanjut pada suatu tempat, bukan sekadar eksistensi.
- source_word: יָמִים מִסְפָּר
  choice: selama beberapa hari
  rationale: Ungkapan harfiah “hari-hari yang terhitung” menunjukkan jumlah hari yang terbatas tanpa menyebut angka tertentu.
- source_word: עַל הַמִּשְׁכָּן
  choice: di atas Kemah Suci
  rationale: מִשְׁכָּן adalah istilah baku bagi tempat kudus portabel Israel; “Kemah Suci” jelas dan lazim bagi pembaca Indonesia, sedangkan “di atas” menyampaikan posisi awan.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan yang secara harfiah berarti “menurut mulut Yahweh” secara idiomatis menunjuk pada perintah atau arahan-Nya.
- source_word: יַחֲנוּ
  choice: mereka tetap berkemah
  rationale: Bentuk imperfek menggambarkan kebiasaan berulang; penambahan “tetap” memperjelas bahwa mereka tidak membongkar perkemahan selama awan menetap.
- source_word: יִסָּעוּ
  choice: mereka berangkat
  rationale: Dalam konteks perjalanan padang gurun, נסע berarti membongkar perkemahan lalu bergerak meneruskan perjalanan; “berangkat” ringkas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sifat ketaatan Israel terhadap petunjuk ilahi
  choice: atas perintah Yahweh
  alternative: menurut mulut Yahweh
  rationale: Terjemahan idiomatis menyatakan otoritas arahan ilahi tanpa menambahkan penjelasan mengenai cara perintah itu disampaikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pola berulang “atas perintah Yahweh” dipertahankan untuk mencerminkan paralelisme Ibrani. Istilah “Kemah Suci” dipakai sebagai padanan yang mudah dipahami untuk מִשְׁכָּן.
