  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: id
  text: Atas perintah Yahweh mereka berkemah, dan atas perintah Yahweh mereka berangkat. Mereka menjalankan kewajiban mereka terhadap Yahweh atas perintah Yahweh melalui Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Musa,” suatu ungkapan yang berarti “melalui Musa” atau “dengan Musa sebagai perantara.”'
    reason: Menjelaskan idiom Ibrani בְּיַד מֹשֶׁה dan dasar terjemahan “melalui Musa.”
lexical_decisions:
- source_word: עַל־פִּי
  choice: atas titah
  rationale: Ungkapan harfiah ‘menurut mulut’ menyatakan arahan atau perintah yang berwenang. ‘Atas titah’ alami, ringkas, dan mempertahankan pengulangan ungkapan Ibrani dalam ayat ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat secara langsung dalam teks Ibrani.
- source_word: יַחֲנוּ
  choice: mereka berkemah
  rationale: Menyatakan tindakan tinggal atau menetap di perkemahan dengan bahasa Indonesia modern dan wajar.
- source_word: יִסָּעוּ
  choice: mereka berangkat
  rationale: Dalam konteks perjalanan di padang gurun, verba ini menekankan tindakan meninggalkan tempat perkemahan untuk melanjutkan perjalanan.
- source_word: מִשְׁמֶרֶת יְהוָה
  choice: amanat Yahweh
  rationale: ‘Amanat’ mempertahankan gagasan tentang tanggung jawab atau ketentuan yang dipercayakan dan wajib dipelihara, tanpa mempersempitnya menjadi sekadar tugas biasa.
- source_word: שָׁמָרוּ
  choice: memegang teguh
  rationale: Mengungkapkan makna menjaga sekaligus menaati dengan setia, selaras dengan objek ‘amanat Yahweh’.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan harfiah ‘dengan tangan Musa’ merupakan idiom perantaraan atau keagenan; ‘melalui Musa’ menyampaikan maknanya secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian יְהוָה; bentuk ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara titah Yahweh dan perantaraan Musa
  choice: sesuai dengan titah Yahweh melalui Musa
  alternative: sesuai dengan titah Yahweh, dengan tangan Musa
  rationale: Pilihan ini mempertahankan Yahweh sebagai sumber titah dan Musa sebagai perantara, tanpa menyamakan kewenangan keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘atas titah Yahweh’ dipertahankan untuk mencerminkan penekanan retoris teks Ibrani; ‘amanat’ dan ‘memegang teguh’ menjaga nuansa tanggung jawab serta ketaatan.
