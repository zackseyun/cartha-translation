id: NUM.9.10
reference: Numbers 9:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: id
  text: Katakanlah kepada umat Israel[a], ‘Apabila seseorang menjadi najis karena mayat[b], atau sedang dalam perjalanan jauh, baik di antaramu maupun di antara generasi-generasimu[c], ia harus merayakan Paskah bagi Yahweh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; ungkapan ini menunjuk kepada komunitas Israel secara keseluruhan.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani secara harfiah berbunyi “najis karena seorang/nyawa”; dalam konteks hukum ini yang dimaksud ialah kenajisan akibat mayat.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “untuk generasi-generasimu” atau “sepanjang generasi-generasimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Katakanlah kepada umat Israel
  rationale: Bentuk imperatif דַּבֵּר diterjemahkan secara alami sebagai “Katakanlah”. Secara harfiah בְּנֵי יִשְׂרָאֵל berarti “anak-anak lelaki Israel”, tetapi dalam sapaan perjanjian ini menunjuk kepada komunitas Israel secara keseluruhan; “umat Israel” menyampaikan rujukan kolektif itu dalam bahasa Indonesia modern.
- source_word: אִישׁ אִישׁ
  choice: seseorang
  rationale: Pengulangan kata אִישׁ bersifat distributif, yakni siapa pun secara perseorangan. “Seseorang” mempertahankan cakupan kasus per kasus tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: טָמֵא לָנֶפֶשׁ
  choice: menjadi najis karena mayat
  rationale: Dalam konteks hukum kenajisan, נֶפֶשׁ pada ungkapan ini menunjuk kepada orang yang telah mati atau mayat. “Karena mayat” menyatakan penyebab kenajisan dengan jelas, sedangkan “menjadi najis” mengikuti bentuk keadaan yang muncul dalam klausa bersyarat.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: sedang dalam perjalanan jauh
  rationale: Ungkapan ini berarti berada dalam perjalanan yang jauh. Terjemahan tersebut alami dalam bahasa Indonesia dan tidak membatasi דֶּרֶךְ pada arti harfiah “jalan”.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: di antara kamu atau keturunanmu
  rationale: Frasa ini memperluas berlakunya ketetapan dari angkatan yang sedang diajak bicara kepada angkatan keturunan mereka. Susunan dipindahkan lebih awal agar hubungan sintaksisnya jelas dan alami dalam bahasa Indonesia.
- source_word: וְעָשָׂה פֶסַח
  choice: ia harus merayakan Paskah
  rationale: Kata עָשָׂה bersama פֶסַח merupakan idiom untuk melaksanakan atau merayakan Paskah. Bentuk perfektum berwaw dalam ketetapan hukum menyatakan kewajiban sebagai akibat dari kondisi sebelumnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan bahwa perayaan itu ditujukan atau dipersembahkan bagi Yahweh. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menyebut nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama diri tersebut dan membedakannya dari gelar umum untuk Tuhan.
- issue: Lingkup sapaan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak lelaki Israel
  rationale: Bentuk Ibraninya maskulin, tetapi dalam konteks ini berfungsi sebagai nama kolektif bagi komunitas Israel. Terjemahan utama menyatakan fungsi kolektifnya, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- issue: Kekuatan hukum וְעָשָׂה פֶסַח
  choice: ia harus merayakan Paskah
  alternative: ia tetap boleh merayakan Paskah
  rationale: Bentuk verbal dalam konteks hukum paling langsung menyatakan kewajiban, bukan sekadar izin. Kata “tetap” tidak dinyatakan secara eksplisit dalam teks, sehingga tidak dimasukkan ke dalam terjemahan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Merayakan Paskah” dipilih sebagai ungkapan yang mudah dipahami untuk pelaksanaan ritus Paskah Israel. Struktur klausa ditata ulang secara terbatas agar cakupan “di antara kamu atau keturunanmu” jelas tanpa mengubah isi hukum.
