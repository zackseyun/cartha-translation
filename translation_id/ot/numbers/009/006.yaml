  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: id
  text: Ada laki-laki yang najis karena mayat manusia[a], sehingga mereka tidak dapat merayakan Paskah pada hari itu; dan pada hari itu mereka datang menghadap Musa dan Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “najis berkenaan dengan נפש seorang manusia.” Dalam konteks ini, ungkapan Ibrani tersebut berarti najis akibat mayat manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: Ada beberapa laki-laki
  rationale: Konstruksi ini memperkenalkan keadaan dalam narasi. 'Ada beberapa laki-laki' alami dalam bahasa Indonesia dan mempertahankan acuan maskulin jamak dari אֲנָשִׁים.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: najis karena mayat manusia
  rationale: Dalam konteks hukum kenajisan, ungkapan Ibrani ini menunjuk pada kenajisan ritual yang disebabkan oleh mayat manusia; terjemahan ini menyampaikan idiom tersebut tanpa mengesankan kesalahan moral.
- source_word: וְלֹא יָכְלוּ
  choice: sehingga mereka tidak dapat
  rationale: Hubungan akibat dengan kenajisan sebelumnya jelas dari konteks; 'sehingga' mengungkapkannya secara wajar dalam bahasa Indonesia.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: merayakan Paskah
  rationale: Secara harfiah 'melakukan Paskah', yaitu menjalankan perayaan atau ketetapan Paskah. 'Merayakan Paskah' merupakan ungkapan Indonesia yang lazim dan tidak sekadar menekankan suasana pesta.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal langsung yang dipertahankan pada kedua kemunculannya, dengan kemunculan kedua diberi 'juga' agar pengulangan terdengar alami.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: mereka datang menghadap
  rationale: '''Datang menghadap'' secara alami menyampaikan tindakan mendekat dan hadir di hadapan Musa serta Harun tanpa menambahkan gagasan permohonan hukum secara eksplisit.'
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: Musa ... Harun
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Sifat kenajisan
  choice: Kenajisan ritual karena mayat manusia
  alternative: Kenajisan moral, atau terjemahan harfiah 'najis karena jiwa seseorang'
  rationale: Dalam konteks hukum kemurnian Pentateukh, frasa ini merupakan idiom bagi kenajisan yang berkaitan dengan mayat, bukan pernyataan bahwa orang-orang itu bersalah secara moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dipecah menjadi dua kalimat agar mudah dibaca, sementara pengulangan 'pada hari itu' dan urutan Musa lalu Harun tetap dipertahankan.
