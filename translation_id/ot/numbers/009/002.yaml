  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: id
  text: Dan hendaklah orang Israel merayakan Paskah pada waktu yang telah ditentukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; dapat juga diterjemahkan “orang Israel” atau, menurut ungkapan tradisional, “anak-anak Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: Dan hendaklah ... merayakan
  rationale: Kata kerja עשה secara harfiah berarti “melakukan/membuat”, tetapi ketika berobjek פֶּסַח, ungkapan ini berarti melaksanakan atau merayakan Paskah. Bentuk imperfek dengan waw dalam konteks ini menyatakan perintah, sehingga “Dan hendaklah ... merayakan” mencerminkan baik kata penghubung maupun daya perintahnya.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel”, tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” merupakan padanan modern yang alami dan mencakup komunitas yang dimaksud tanpa menjadikan ungkapan Indonesia terasa hanya merujuk kepada laki-laki.
- source_word: הַפָּסַח
  choice: Paskah
  rationale: פֶּסַח dapat menunjuk pada perayaan atau kurban Paskah. Ayat ini tidak mempersempit acuannya, sehingga “Paskah” mempertahankan keluasan makna tersebut.
- source_word: בְּמוֹעֲדוֹ
  choice: pada waktu yang telah ditetapkan untuknya
  rationale: מוֹעֵד di sini menunjuk pada waktu yang ditentukan, sedangkan sufiks orang ketiga tunggal mengacu pada Paskah. Terjemahan ini mempertahankan unsur waktu yang ditetapkan dan daya posesif sufiks tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang khidmat. “Merayakan” dipilih sebagai ungkapan ritual yang alami, sedangkan “orang Israel” menghindari kesan bahwa perintah ini hanya ditujukan kepada laki-laki sambil menjelaskan bentuk harfiahnya dalam catatan kaki.
