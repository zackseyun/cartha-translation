  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: id
  text: Jika seorang pendatang menetap di antara kamu dan hendak merayakan Paskah bagi Yahweh, ia harus melakukannya sesuai dengan ketetapan Paskah dan peraturannya. Demikianlah ia harus melakukannya. Satu ketetapan berlaku bagi kamu, bagi pendatang, dan bagi orang yang lahir di negeri itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Membuka kasus bersyarat; hubungan dengan ketentuan sebelumnya tetap jelas dalam konteks tanpa perlu memakai 'Dan jika' yang kurang alami dalam bahasa Indonesia.
- source_word: יָגוּר ... גֵּר
  choice: seorang pendatang menetap di antara kamu
  rationale: גֵּר menunjuk kepada orang asing yang tinggal di tengah Israel, bukan pelancong yang hanya singgah. 'Pendatang' alami dalam bahasa Indonesia, sedangkan 'menetap di antara kamu' memperjelas status tinggalnya.
- source_word: וְעָשָׂה פֶסַח
  choice: hendak merayakan Paskah
  rationale: Ungkapan harfiah 'melakukan/membuat Paskah' berarti menjalankan perayaan atau ritus Paskah. 'Hendak merayakan' menyampaikan nilai bersyarat dan maksud ritual secara alami.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa perayaan itu ditujukan atau dipersembahkan bagi Yahweh; nama perjanjian diterjemahkan secara langsung.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: sesuai dengan ketetapan Paskah
  rationale: חֻקָּה adalah ketentuan yang telah ditetapkan, khususnya dalam konteks hukum dan ritus.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: dan peraturannya
  rationale: מִשְׁפָּט di sini menunjuk pada aturan atau tata pelaksanaan ritus. 'Peraturan' membedakannya secara wajar dari 'ketetapan' sambil mempertahankan tumpang tindih makna keduanya.
- source_word: כֵּן יַעֲשֶׂה
  choice: Demikianlah ia harus melakukannya
  rationale: Mempertahankan penekanan bahwa ritus wajib dilakukan tepat menurut tata cara yang baru disebutkan.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: Satu ketetapan berlaku
  rationale: Menyatakan satu aturan yang mengikat semua kelompok yang disebut; 'berlaku' lebih alami daripada terjemahan harfiah 'akan ada'.
- source_word: לָכֶם וְלַגֵּר
  choice: bagi kamu, bagi pendatang
  rationale: Pengulangan 'bagi' mempertahankan penekanan preposisi Ibrani dan penerapan ketetapan yang sama kepada kedua pihak.
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: dan bagi orang asli negeri itu
  rationale: אֶזְרַח adalah orang yang berasal dari negeri itu, sebagai lawan dari גֵּר. Pilihan ini menghindari kategori politik modern seperti 'warga negara'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan satu ketetapan bagi pendatang dan orang asli
  choice: Satu ketetapan berlaku bagi kedua kelompok dalam pelaksanaan Paskah
  alternative: Pernyataan ini dipahami sebagai kesetaraan hukum yang tidak terbatas pada konteks Paskah
  rationale: Klausa secara eksplisit menyatakan satu ketetapan bagi umat, pendatang, dan orang asli. Terjemahan mempertahankan kesamaan aturan dalam konteks langsung ini tanpa memperluas klaim melampaui pokok perayaan Paskah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum-ritual 'ketetapan' dan 'peraturan' dipertahankan tetapi disusun dalam kalimat yang mudah dipahami. 'Pendatang' dipilih daripada 'orang asing' agar status sebagai penghuni dari luar komunitas lebih jelas dan tidak mengesankan pelancong sementara.
