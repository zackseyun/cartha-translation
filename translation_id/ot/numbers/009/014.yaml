    issue: '"orang asli negeri itu" untuk אֶזְרַח הָאָרֶץ'
    rationale: Frasa ini dapat dipahami sebagai "indigenous/native people" dalam pengertian etnis modern. Ibrani di sini menunjuk orang yang berasal atau lahir di negeri itu, sebagai kontras hukum dengan גֵּר. "Orang yang lahir di negeri itu" menyatakan kontras tersebut dengan lebih tepat.
