  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: id
  text: Ketika awan itu tetap berada di atas Kemah Suci selama berhari-hari, orang Israel[a] menaati ketetapan Yahweh[b] dan tidak berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; dapat juga diterjemahkan “keturunan Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “memelihara ketetapan Yahweh” atau “menjalankan amanat Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ
  choice: Ketika ... tetap berada
  rationale: Konstruksi ב dengan infinitif אָרַךְ membentuk anak kalimat waktu dan menyatakan bahwa keberadaan awan berlangsung lama. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan aspek duratifnya.
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Artikel Ibrani menunjuk kepada awan tertentu yang telah dikenal dari konteks, yaitu awan yang menandai kehadiran dan tuntunan Yahweh.
- source_word: עַל הַמִּשְׁכָּן
  choice: di atas Kemah Suci
  rationale: עַל menyatakan posisi awan di atas tempat kudus. 'Kemah Suci' merupakan padanan Indonesia yang jelas dan wajar bagi מִשְׁכָּן dalam konteks perjalanan Israel.
- source_word: יָמִים רַבִּים
  choice: selama berhari-hari
  rationale: Ungkapan ini mempertahankan acuan kepada hari-hari sekaligus menyampaikan lamanya waktu secara alami dalam bahasa Indonesia.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת יְהוָה
  choice: menaati kewajiban yang diberikan Yahweh
  rationale: Gabungan שׁמר dan מִשְׁמֶרֶת menyatakan pemenuhan atau ketaatan terhadap tanggung jawab yang berasal dari Yahweh. 'Menaati kewajiban' menghindari kesan bahwa yang dimaksud semata-mata tugas menjaga secara fisik.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini menunjuk kepada umat Israel secara kolektif. 'Orang Israel' merupakan ungkapan modern yang alami; bentuk sumber dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְלֹא יִסָּעוּ
  choice: dan tidak berangkat
  rationale: Dalam konteks perjalanan di padang gurun, נסע berarti meninggalkan perkemahan untuk melanjutkan perjalanan. 'Berangkat' menyampaikan makna itu secara ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel atau keturunan Israel
  rationale: Bentuk Ibrani secara gramatikal maskulin, tetapi dalam konteks naratif ini merujuk kepada komunitas Israel yang berkemah dan bepergian. Terjemahan utama menyatakan rujukan kolektifnya, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
- issue: Makna מִשְׁמֶרֶת יְהוָה
  choice: kewajiban yang diberikan Yahweh
  alternative: ketetapan Yahweh atau tugas jaga bagi Yahweh
  rationale: Frasa tersebut dapat menyoroti kewajiban, ketetapan, atau amanat yang harus dipelihara. Dalam konteks ini orang Israel tidak berangkat selama awan menetap; pilihan utama menyampaikan ketaatan tanpa mempersempitnya menjadi penjagaan fisik.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti hubungan waktu dan akibat dalam teks Ibrani. Istilah 'Kemah Suci' dipakai agar mudah dipahami pembaca umum, sedangkan 'Yahweh' mempertahankan nama ilahi.
