base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Lalu Yahweh[a] berfirman kepada Musa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bahwa “Yahweh” menerjemahkan Tetragramaton dalam teks Ibrani serta mencatat padanan tradisional.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Waw konsekutif melanjutkan rangkaian narasi, sehingga “Lalu” menyatakan urutan secara alami. Dalam konteks perkataan ilahi, “berfirman” merupakan padanan bahasa Indonesia yang wajar dan bermartabat untuk דִּבֵּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi sasaran tutur; “kepada” adalah padanan alami dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Formula Ibrani לֵאמֹר memperkenalkan isi perkataan berikutnya. Dalam bahasa Indonesia, fungsi tersebut sudah tersampaikan secara alami oleh “berfirman” dan tanda koma; menerjemahkannya sebagai “dengan mengatakan” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur dibuat alami tanpa menghilangkan urutan naratif; koma menandai bahwa isi firman berlanjut pada ayat berikutnya.
