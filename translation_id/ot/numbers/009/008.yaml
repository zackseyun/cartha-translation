base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: id
  text: Lalu Musa berkata kepada mereka[a], “Tunggulah, dan aku akan mendengar apa yang akan Yahweh perintahkan kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berdirilah,” sesuai arti yang lebih harfiah dari kata perintah Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan urutan narasi; “Lalu” merupakan penghubung yang alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Padanan langsung dan alami untuk preposisi dengan sufiks orang ketiga jamak maskulin.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: עִמְדוּ
  choice: Tunggulah di sini
  rationale: Secara harfiah berarti “berdirilah,” tetapi dalam konteks ini menyuruh mereka tetap di tempat sambil menantikan jawaban. Tambahan “di sini” mengungkapkan daya idiomatisnya secara alami; arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: וְאֶשְׁמְעָה
  choice: dan aku akan mendengar
  rationale: Bentuk orang pertama menyatakan niat Musa untuk menerima jawaban; “mendengar” mempertahankan ungkapan Ibrani tanpa menjelaskan lebih jauh daripada teks.
- source_word: מַה
  choice: apa yang
  rationale: Kata tanya ini memperkenalkan isi perintah yang hendak Musa dengar.
- source_word: יְצַוֶּה
  choice: akan ... perintahkan
  rationale: Bentuk piel imperfek dari צוה menyatakan perintah atau instruksi yang akan diberikan dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: לָכֶם
  choice: mengenai kalian
  rationale: Dalam konteks ini, preposisi dengan sufiks jamak menunjuk pada perkara yang menyangkut mereka; “mengenai kalian” alami dan menjaga cakupan relasinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Arah perintah dalam יְצַוֶּה יְהוָה לָכֶם
  choice: apa yang akan Yahweh perintahkan mengenai kalian
  alternative: apa yang akan Yahweh perintahkan kepada kalian
  rationale: לָכֶם dapat dipahami sebagai perintah yang diberikan kepada mereka atau keputusan yang menyangkut perkara mereka. Konteks pertanyaan tentang status mereka mendukung “mengenai kalian,” tetapi alternatif tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena sapaan ditujukan kepada beberapa orang dan lebih alami daripada “kamu sekalian.” Ungkapan “Tunggulah di sini” menghindari kekakuan terjemahan harfiah sambil mempertahankan alternatifnya dalam catatan kaki.
