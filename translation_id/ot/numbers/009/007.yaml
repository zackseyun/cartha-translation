  edition: WLC
  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: id
  text: Orang-orang itu berkata kepadanya, “Kami najis karena mayat manusia.[a] Mengapa kami harus dihalangi untuk mempersembahkan persembahan bagi Yahweh pada waktu yang telah ditetapkan di tengah-tengah orang Israel?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “najis berkenaan dengan jiwa seorang manusia”; dalam konteks hukum ritual, ungkapan Ibrani ini berarti najis karena mayat manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Mengapa kami harus dikecualikan sehingga tidak dapat membawa persembahan bagi Yahweh ... di tengah-tengah keturunan Israel?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: Orang-orang itu berkata kepadanya
  rationale: Bentuk naratif אמר secara alami diterjemahkan 'berkata'; demonstratif הָהֵמָּה menunjuk kembali kepada orang-orang yang disebut dalam konteks.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: najis karena mayat manusia
  rationale: Dalam konteks hukum ritual, frasa idiomatis ini menunjuk pada kenajisan akibat mayat manusia. 'Najis' mempertahankan nuansa kultis, sedangkan 'mayat manusia' menyatakan maknanya dengan jelas.
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: harus terhalang untuk mempersembahkan
  rationale: Bentuk pasif נִגָּרַע di sini menyatakan dicegah atau dikecualikan dari keikutsertaan; הקריב dalam konteks kurban berarti membawa atau mempersembahkan.
- source_word: קָרְבַּן יְהוָה
  choice: persembahan bagi Yahweh
  rationale: קָרְבָּן adalah persembahan yang dibawa kepada Allah. Genitif Ibrani dapat menyatakan persembahan yang diperuntukkan bagi Yahweh; pilihan ini alami dalam bahasa Indonesia tanpa menghapus relasinya dengan nama ilahi.
- source_word: בְּמֹעֲדוֹ
  choice: pada waktu yang telah ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu tetap yang ditentukan bagi pelaksanaan persembahan Paskah.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: bersama-sama dengan umat Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Umat Israel' alami, inklusif sesuai fungsi etnonimnya, dan konteks ini menekankan partisipasi bersama mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi YHWH secara langsung. 'Yahweh' mempertahankan nama pribadi itu, bukan menggantinya dengan gelar.
- issue: Sifat kenajisan dalam לְנֶפֶשׁ אָדָם
  choice: najis karena mayat manusia
  alternative: najis karena orang mati
  rationale: Ungkapan tersebut adalah istilah hukum untuk kenajisan yang timbul sehubungan dengan mayat manusia. Terjemahan ini tidak menentukan cara kontak yang tidak dinyatakan secara eksplisit dalam ayat.
- issue: Nuansa נִגָּרַע
  choice: terhalang
  alternative: dikecualikan
  rationale: '''Terhalang'' mempertahankan bentuk pasif dan keluhan para penutur tanpa memastikan apakah pengecualian itu sudah merupakan keputusan resmi.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-hukum yang bermartabat. Istilah 'najis' dipertahankan untuk kemurnian ritual; 'umat Israel' dipakai sebagai padanan alami bagi etnonim kolektif בְּנֵי יִשְׂרָאֵל.
