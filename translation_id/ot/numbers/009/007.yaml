  to: Orang-orang itu berkata kepadanya, “Kami najis karena mayat manusia.[a] Mengapa kami harus dihalangi untuk mempersembahkan persembahan bagi Yahweh pada waktu yang telah ditetapkan di tengah-tengah orang Israel?”[b]
