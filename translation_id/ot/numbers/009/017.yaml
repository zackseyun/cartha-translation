base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: id
  text: Setiap kali awan terangkat dari atas kemah[a], sesudah itu orang Israel[b] berangkat, dan di tempat awan itu menetap, di sanalah orang Israel berkemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kemah yang dimaksud ialah Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “putra-putra Israel”; ungkapan ini adalah sebutan bagi orang Israel sebagai suatu bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי
  choice: Setiap kali
  rationale: Ungkapan לְפִי dengan infinitif di sini menyatakan keadaan yang berulang; “setiap kali” menyampaikan pola perjalanan yang berulang secara alami.
- source_word: הֵעָלֹת
  choice: terangkat
  rationale: Bentuk ini menggambarkan awan naik atau diangkat dari atas kemah. “Terangkat” alami dalam konteks ini dan tidak menetapkan pelaku yang tidak disebutkan secara eksplisit.
- source_word: הֶעָנָן
  choice: awan
  rationale: Padanan baku bagi עָנָן dalam konteks tuntunan Israel di padang gurun.
- source_word: מֵעַל הָאֹהֶל
  choice: dari atas kemah
  rationale: Mengekalkan makna ruang מֵעַל dan arti langsung אֹהֶל, yaitu “kemah”; rujukannya kepada Kemah Suci dijelaskan dalam catatan kaki.
- source_word: וְאַחֲרֵי כֵן
  choice: sesudah itu
  rationale: Menjaga urutan waktu yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: יִסְעוּ
  choice: berangkat
  rationale: Dalam konteks kebiasaan berulang, imperfek menyatakan tindakan yang dilakukan setiap kali awan terangkat. “Berangkat” merupakan padanan Indonesia yang wajar untuk memulai perjalanan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah berarti “anak-anak lelaki/putra-putra Israel,” tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” jelas, inklusif, dan alami dalam bahasa Indonesia modern.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: Di tempat ...
  rationale: Mempertahankan struktur lokatif sumber tanpa membuat kalimat Indonesia terasa kaku; hubungan dengan klausa sebelumnya tetap jelas.
- source_word: יִשְׁכָּן
  choice: berdiam
  rationale: שׁכן berarti tinggal, menetap, atau berdiam. Untuk awan, “berdiam” mempertahankan nuansa menetap pada suatu tempat tanpa memasukkan istilah teologis tambahan.
- source_word: שָׁם ... שָׁם
  choice: di tempat ... di sanalah
  rationale: Susunan ini mempertahankan korespondensi dan penekanan lokatif dari pengulangan שָׁם dalam bahasa Ibrani.
- source_word: יַחֲנוּ
  choice: berkemah
  rationale: Padanan alami untuk חנה; dalam konteks ini bentuk imperfek menunjukkan tindakan berulang, yang sudah dinyatakan oleh “setiap kali.”
