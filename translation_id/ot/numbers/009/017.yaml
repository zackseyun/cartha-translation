translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi menjadi dua agar alur tindakan berulang mudah dipahami. Istilah tradisional yang berpotensi disalahpahami sebagai hanya anak-anak atau hanya laki-laki dihindari dalam teks utama, tetapi bentuk Ibraninya dicatat.
