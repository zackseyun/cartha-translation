id: NUM.9.15
reference: Numbers 9:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: id
  text: Pada hari Kemah Suci didirikan, awan menutupi Kemah Suci, yaitu Kemah Kesaksian.[a] Pada petang hari, awan itu berada di atas Kemah Suci dan tampak seperti api sampai pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kemah Kesaksian”; dapat juga diterjemahkan “Kemah Saksi.” Istilah “kesaksian” dipertahankan sebagai sebutan ibadah yang merujuk pada kesaksian perjanjian yang disimpan di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Pada hari
  rationale: Frasa waktu ini diterjemahkan secara alami; waw penghubung tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: הָקִים אֶת הַמִּשְׁכָּן
  choice: Kemah Suci didirikan
  rationale: Infinitif kausatif berfungsi dalam konstruksi temporal. Bentuk pasif Indonesia menyampaikan tindakan mendirikan bangunan itu secara wajar.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah baku dan mudah dipahami untuk mishkan, tempat kediaman ibadah portabel Israel; huruf kapital menandai nama bangunan khusus.
- source_word: כִּסָּה הֶעָנָן
  choice: awan menutupi
  rationale: Menjaga arti langsung verba 'menutupi' dan bentuk definit sumber melalui konteks awan yang sudah dikenal dalam narasi.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: yaitu Kemah Kesaksian
  rationale: Dipahami sebagai keterangan aposisional yang mengidentifikasi Kemah Suci. 'Kesaksian' mempertahankan istilah kultis עֵדוּת tanpa mempersempitnya menjadi tafsiran tertentu.
- source_word: וּבָעֶרֶב
  choice: Pada petang hari
  rationale: Peralihan temporal dinyatakan dengan idiom Indonesia yang alami; hubungan antarklausa tetap jelas tanpa harus memakai 'dan'.
- source_word: יִהְיֶה עַל הַמִּשְׁכָּן
  choice: awan itu berada di atas Kemah Suci
  rationale: Imperfek menyatakan keadaan yang berlangsung atau berulang. Subjek 'awan itu' dibuat eksplisit agar rujukannya jelas dalam bahasa Indonesia.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: tampak seperti api
  rationale: Mempertahankan perbandingan visual, bukan menyatakan bahwa awan itu benar-benar api.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Padanan temporal yang langsung dan alami.
theological_decisions:
- issue: Hubungan antara הַמִּשְׁכָּן dan לְאֹהֶל הָעֵדֻת
  choice: 'Aposisional: ''yaitu Kemah Kesaksian'' mengidentifikasi Kemah Suci'
  alternative: 'Nuansa lokatif atau terarah: awan menutupi Kemah Suci pada/ke arah Kemah Kesaksian'
  rationale: Sintaksis dan konteks paling wajar menunjukkan bahwa frasa kedua menjelaskan identitas bangunan yang sama, meskipun prefiks ל secara bentuk dapat memunculkan nuansa lain.
- issue: Hakikat penampakan malam
  choice: Awan itu 'tampak seperti api'
  alternative: Awan itu adalah api
  rationale: כְּמַרְאֵה menyatakan kemiripan penampakan. Terjemahan tidak mengubah perbandingan itu menjadi identitas ontologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Kemah Suci' dipakai sebagai istilah umum yang mudah dikenali, sedangkan 'Kemah Kesaksian' mempertahankan sebutan khusus dalam teks Ibrani. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
