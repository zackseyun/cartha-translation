  text: So Moses told the sons of Israel to keep the Passover.
translation:
  language: id
  text: Lalu Musa menyampaikan kepada orang Israel agar mereka merayakan Paskah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... menyampaikan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; dalam konteks penyampaian perintah, 'menyampaikan' terdengar alami dan tetap mencerminkan tindakan Musa berbicara kepada umat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' secara idiomatis menunjuk kepada umat Israel; 'orang Israel' adalah padanan Indonesia modern yang jelas dan wajar.
- source_word: לַעֲשֹׂת הַפָּסַח
  choice: agar mereka merayakan Paskah
  rationale: Dalam konteks ritual, עשה + פסח berarti melaksanakan atau merayakan perayaan Paskah, bukan sekadar 'membuat' Paskah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Hubungan tujuan/perintah pada infinitif לַעֲשֹׂת dinyatakan dengan 'agar mereka', tanpa menambahkan rincian yang tidak terdapat dalam ayat.
