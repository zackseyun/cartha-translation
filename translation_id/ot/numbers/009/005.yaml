id: NUM.9.5
reference: Numbers 9:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: id
  text: Maka mereka merayakan Paskah pada bulan pertama, pada hari keempat belas bulan itu, pada waktu senja[a], di padang gurun Sinai. Sesuai dengan segala yang diperintahkan Yahweh kepada Musa, demikianlah anak-anak Israel melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di antara kedua petang,” sebuah ungkapan Ibrani yang menunjuk pada waktu senja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: merayakan / dilakukan
  rationale: Dengan objek פֶּסַח, עָשָׂה berarti melaksanakan atau merayakan Paskah; pada klausa penutup, bentuk umum 'dilakukan' mempertahankan pengulangan verba Ibrani tanpa membuat bahasa Indonesia terasa kaku.
- source_word: הַפֶּסַח
  choice: Paskah
  rationale: Dalam konteks ini istilah tersebut menunjuk pada perayaan Paskah secara keseluruhan, bukan hanya kurban atau hewan Paskah.
- source_word: בָּרִאשׁוֹן
  choice: pada bulan pertama
  rationale: Kata 'bulan' tersirat dalam ungkapan penanggalan dan perlu dinyatakan agar jelas dalam bahasa Indonesia.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: pada hari keempat belas bulan itu
  rationale: Ungkapan ini menyampaikan rumus tanggal Ibrani secara jelas dan alami.
- source_word: בֵּין הָעַרְבַּיִם
  choice: pada waktu senja
  rationale: Ungkapan Ibrani secara harfiah berarti 'di antara kedua petang' dan menunjuk pada masa senja; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּמִדְבַּר סִינָי
  choice: di padang gurun Sinai
  rationale: מִדְבָּר menunjuk pada daerah gurun atau belantara; 'padang gurun Sinai' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: כְּכֹל אֲשֶׁר
  choice: sesuai dengan segala yang
  rationale: Padanan ini mempertahankan penekanan bahwa seluruh perintah ditaati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dinyatakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk ini alami dalam konstruksi relatif bahasa Indonesia; konteks sudah menunjukkan bahwa perintah itu mendahului pelaksanaannya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Padanan ini mempertahankan citra hubungan keturunan dalam ungkapan Ibrani sekaligus berfungsi secara kolektif bagi umat Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Ungkapan kolektif bergender בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel atau bangsa Israel
  rationale: Pilihan ini mempertahankan unsur filial dari בְּנֵי sambil tetap dapat dipahami sebagai sebutan kolektif bagi umat Israel.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Susunan kalimat mempertahankan kesejajaran klausa penutup Ibrani, sedangkan istilah ritual dan penanggalan dibuat jelas bagi pembaca umum.
