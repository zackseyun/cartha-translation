  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: id
  text: Kadang-kadang awan itu tetap ada dari petang sampai pagi. Ketika awan itu terangkat pada pagi hari[a], mereka pun berangkat. Atau jika awan itu tetap ada selama sehari semalam, ketika awan itu terangkat, mereka pun berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ketika awan itu naik pada pagi hari.” Verba Ibrani tersebut secara lebih harfiah dapat berarti “naik,” tetapi dalam konteks ini awan terangkat sebagai tanda bagi Israel untuk berangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Kadang-kadang
  rationale: Ungkapan ini memperkenalkan salah satu kemungkinan dalam pola yang sedang dijelaskan; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna keadaan yang sesekali terjadi.
- source_word: יִהְיֶה הֶעָנָן
  choice: awan itu tetap ada
  rationale: Dengan rentang waktu yang mengikutinya, verba היה menyatakan keberadaan yang berlanjut, bukan sekadar keadaan statis.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: dari petang sampai pagi
  rationale: Padanan temporal yang langsung dan wajar; 'sampai' menandai batas akhirnya.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: ketika awan itu terangkat
  rationale: Verba עלה menggambarkan awan yang naik dari atas Kemah Suci sebagai tanda keberangkatan. 'Terangkat' mempertahankan kemungkinan nuansa pasif tanpa menentukan pelaku yang tidak dinyatakan.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Ungkapan waktu yang alami dan jelas dalam bahasa Indonesia modern.
- source_word: וְנָסָעוּ
  choice: mereka pun berangkat
  rationale: Dalam konteks perjalanan di padang gurun, נסע menunjuk pada tindakan meninggalkan tempat perkemahan untuk meneruskan perjalanan; 'berangkat' menyampaikan tindakan itu secara ringkas dan alami.
- source_word: אוֹ
  choice: Atau jika
  rationale: Memperkenalkan kemungkinan lain yang sejajar; 'jika' membuat hubungan bersyarat yang tersirat menjadi jelas dalam bahasa Indonesia.
- source_word: יוֹמָם וָלַיְלָה
  choice: selama sehari semalam
  rationale: Dalam susunan ini frasa tersebut menyatakan lamanya awan tetap ada. 'Sehari semalam' merupakan ungkapan Indonesia yang alami dan tidak harus menyiratkan lebih dari satu siklus siang-malam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'ketika awan itu terangkat, mereka pun berangkat' dipertahankan karena mencerminkan pola prosedural dan repetisi teks Ibrani. 'Petang' dipilih agar sesuai dengan ragam Alkitab yang tetap mudah dipahami, sedangkan 'sehari semalam' digunakan sebagai ungkapan durasi yang alami.
