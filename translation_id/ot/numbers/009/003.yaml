  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: id
  text: Pada hari keempat belas bulan ini, pada waktu senja[a], kamu harus merayakannya pada waktu yang telah ditetapkan. Sesuai dengan segala ketetapan dan segala peraturannya, kamu harus merayakannya.
  philosophy: optimal-equivalence
  footnotes:
