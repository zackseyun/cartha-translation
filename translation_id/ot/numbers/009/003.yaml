    text: Secara harfiah, “di antara kedua petang,” ungkapan waktu tradisional Ibrani; waktu tepat yang dimaksud tidak pasti, tetapi berkaitan dengan masa sekitar senja.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: Pada hari keempat belas bulan ini
  rationale: Mengungkapkan tanggal secara alami dalam bahasa Indonesia sambil mempertahankan ketepatan kalender dalam teks Ibrani.
- source_word: בֵּין הָעַרְבַּיִם
  choice: di antara kedua petang
  rationale: Mempertahankan bentuk ungkapan waktu teknis Ibrani dan ambiguitas batas waktunya; penjelasan ringkas diberikan dalam catatan kaki.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: kamu harus merayakannya
  rationale: Dengan Paskah sebagai objeknya, עשה berarti melaksanakan atau merayakan perayaan itu, bukan sekadar 'melakukannya'. Bentuk ini juga mempertahankan daya perintah.
- source_word: בְּמוֹעֲדוֹ
  choice: pada waktu yang telah ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu atau kesempatan yang sudah ditentukan, khususnya dalam konteks kalender ibadah.
- source_word: כְּכָל חֻקֹּתָיו
  choice: sesuai dengan segala ketetapannya
  rationale: חֻקּוֹת mempertahankan nuansa ketentuan resmi yang ditetapkan bagi perayaan Paskah.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: dan segala peraturannya
  rationale: מִשְׁפָּטִים di sini menunjuk pada aturan pelaksanaan; 'peraturan' membedakannya secara wajar dari 'ketetapan' tanpa memaksakan perbedaan teknis yang berlebihan.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: kamu harus merayakannya
  rationale: Pengulangan frasa verba-objek pada akhir ayat dipertahankan untuk mencerminkan pembingkaian dan penekanan teks Ibrani.
