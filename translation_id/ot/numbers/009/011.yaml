id: NUM.9.11
reference: Numbers 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: id
  text: Pada bulan kedua, pada hari keempat belas, saat senja[a], mereka harus merayakannya. Mereka harus memakannya bersama roti tidak beragi dan sayur pahit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di antara kedua petang,” sebuah ungkapan Ibrani untuk waktu sekitar matahari terbenam atau senja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: Pada bulan kedua
  rationale: Dalam konteks penanggalan, חֹדֶשׁ berarti “bulan”; frasa ini secara alami diterjemahkan sebagai keterangan waktu.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: pada hari keempat belas
  rationale: Konstruksi bilangan pokok dengan יוֹם menyatakan tanggal dan dalam bahasa Indonesia wajar diterjemahkan dengan bilangan tingkat.
- source_word: בֵּין הָעַרְבַּיִם
  choice: saat senja
  rationale: Ungkapan Ibrani ini menunjuk pada waktu sekitar matahari terbenam. “Saat senja” jelas dan alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: mereka harus merayakannya
  rationale: Dalam konteks Paskah, עשה dengan objek yang merujuk kepada Paskah berarti melaksanakan atau merayakannya, bukan sekadar “melakukannya”.
- source_word: עַל מַצּוֹת
  choice: bersama roti tidak beragi
  rationale: Dalam konteks makan, עַל menyatakan penyertaan, sedangkan מַצּוֹת adalah roti yang dibuat tanpa ragi.
- source_word: וּמְרֹרִים
  choice: dan sayur pahit
  rationale: Bentuk jamak ini mengacu pada tumbuhan atau sayuran pahit yang dimakan dalam perayaan Paskah; “sayur pahit” adalah padanan Indonesia yang alami.
- source_word: יֹאכְלֻהוּ
  choice: Mereka harus memakannya
  rationale: Bentuk imperfek dalam ketentuan hukum menyatakan kewajiban. Akhiran objek tunggal maskulin dipertahankan dengan “-nya” tanpa mempersempit rujukannya secara tidak perlu.
theological_decisions:
- issue: Rujukan akhiran objek pada יַעֲשׂוּ אֹתוֹ dan יֹאכְלֻהוּ
  choice: Dipertahankan sebagai “-nya”
  alternative: Menjelaskannya sebagai “Paskah” atau “kurban Paskah”
  rationale: Ayat ini bergantung pada konteks sebelumnya, dan bentuk Ibraninya memakai pronomina. Mempertahankan pronomina menghindari penentuan referen yang lebih sempit daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Harus” menyampaikan daya wajib dari ketentuan hukum tanpa memakai bentuk yang terasa kuno. Penanda catatan kaki ditempatkan setelah “senja”, sesuai dengan frasa Ibrani yang dijelaskannya.
