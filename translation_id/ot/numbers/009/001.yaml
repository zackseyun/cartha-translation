id: NUM.9.1
reference: Numbers 9:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa di Padang Belantara Sinai[a], pada tahun kedua setelah mereka keluar dari tanah Mesir, dalam bulan pertama, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Gurun Sinai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif ini melanjutkan kisah dan memperkenalkan perkataan ilahi. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diteruskan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל bersama verba berbicara menandai orang yang dituju.
- source_word: בְּמִדְבַּר סִינַי
  choice: di Padang Belantara Sinai
  rationale: מִדְבָּר menunjuk wilayah liar, tandus, dan jarang dihuni; “padang belantara” mempertahankan cakupan itu tanpa mengharuskan gambaran gurun pasir.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: pada tahun kedua
  rationale: Ungkapan waktu ini diterjemahkan secara langsung dan idiomatis.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: setelah mereka keluar dari tanah Mesir
  rationale: Infinitif berkonstruksi dengan לְ dan sufiks membentuk keterangan waktu yang dihitung dari peristiwa keluarnya mereka; אֶרֶץ tetap tercermin dalam “tanah Mesir”.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: dalam bulan pertama
  rationale: Padanan langsung bagi keterangan waktu, dengan gaya yang sesuai bagi narasi kitab suci.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Kata ini memperkenalkan isi firman pada ayat berikutnya. “Demikian:” berfungsi alami dalam bahasa Indonesia dan mempertahankan hubungan sintaksis tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani menggunakan Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Berfirman” dipilih sebagai ungkapan lazim bagi tuturan Allah. Kapitalisasi “Padang Belantara Sinai” memperlakukannya sebagai sebutan geografis; catatan kaki mempertahankan alternatif leksikal “Gurun Sinai”.
