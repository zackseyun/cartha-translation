id: NUM.9.18
reference: Numbers 9:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: id
  text: Atas perintah Yahweh, orang Israel berangkat[a], dan atas perintah Yahweh mereka berkemah. Selama awan itu tetap berada di atas Kemah Suci, mereka tetap berkemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut mulut Yahweh,” sebuah ungkapan Ibrani yang berarti “atas perintah Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan עַל־פִּי secara harfiah berarti 'menurut mulut', tetapi secara idiomatis menyatakan perintah atau arahan yang berwenang. 'Atas perintah Yahweh' alami dalam bahasa Indonesia dan mempertahankan kendali ilahi atas keberangkatan dan perkemahan.
- source_word: יִסְעוּ
  choice: berangkat
  rationale: Dalam konteks perjalanan, נסע berarti membongkar perkemahan lalu bergerak dari tempat itu. 'Berangkat' menyampaikan tindakan memulai perjalanan secara jelas tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak lelaki Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' merupakan padanan Indonesia yang alami dan mencakup seluruh umat yang dimaksud.
- source_word: יַחֲנוּ
  choice: mereka berkemah / mereka tetap berkemah
  rationale: חנה berarti berkemah. Pada kemunculan terakhir, konteks duratif כָּל יְמֵי אֲשֶׁר mendukung 'tetap berkemah' agar keberlangsungan tindakan tersampaikan secara alami.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: selama
  rationale: Frasa ini menyatakan seluruh rentang waktu ketika keadaan berikutnya berlangsung. 'Selama' ringkas, alami, dan mempertahankan makna duratif.
- source_word: יִשְׁכֹּן
  choice: tetap berada
  rationale: שכן dapat berarti tinggal, menetap, atau berdiam. Dengan awan sebagai subjek, 'tetap berada' menyampaikan keberadaan yang berlanjut tanpa personifikasi berlebihan.
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Artikel tertentu menunjuk kepada awan yang telah dikenal dalam konteks narasi. 'Awan itu' mengungkapkan ketentuan tersebut secara alami.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah tempat kediaman kudus Yahweh di tengah Israel. 'Kemah Suci' merupakan istilah Indonesia yang mudah dipahami dan membedakannya dari kemah biasa, tanpa menyamakannya dengan אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankan nama diri itu alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel 'atas perintah Yahweh' dipertahankan, sedangkan ungkapan duratif dibuat alami dengan 'selama' dan 'tetap berkemah'.
