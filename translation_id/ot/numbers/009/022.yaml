id: NUM.9.22
reference: Numbers 9:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: id
  text: Entah selama dua hari, sebulan, atau berhari-hari[a], apabila awan itu tetap berada di atas Kemah Suci dan berdiam di atasnya, orang Israel tetap berkemah dan tidak berangkat. Namun, ketika awan itu terangkat, mereka pun berangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari-hari”; dalam konteks ini kemungkinan berarti jangka waktu yang panjang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Entah ... atau ... atau ...
  rationale: Rangkaian partikel disjungtif menyajikan beberapa kemungkinan lamanya waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan susunan tersebut.
- source_word: יֹמַיִם
  choice: dua hari
  rationale: Bentuk dual Ibrani secara khusus menyatakan dua hari.
- source_word: חֹדֶשׁ
  choice: sebulan
  rationale: Menyatakan jangka waktu satu bulan secara alami dalam bahasa Indonesia.
- source_word: יָמִים
  choice: berhari-hari
  rationale: Sesudah 'dua hari' dan 'sebulan', bentuk jamak ini menunjuk pada masa yang lebih panjang. 'Berhari-hari' mempertahankan unsur 'hari' tanpa menentukan batas waktunya.
- source_word: בְּהַאֲרִיךְ
  choice: apabila ... tetap berada
  rationale: Bentuk ini menyatakan keberlangsungan atau lamanya awan berada di atas Kemah Suci; 'tetap berada' jelas dan alami dalam konteks tindakan yang berulang.
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Kata sandang menunjuk pada awan penuntun yang telah dikenal dari konteks sebelumnya.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah Indonesia yang lazim dan mudah dipahami untuk tempat kudus portabel Israel.
- source_word: לִשְׁכֹּן עָלָיו
  choice: berdiam di atasnya
  rationale: Mempertahankan gagasan kehadiran yang menetap di atas Kemah Suci serta hubungan leksikal dengan konsep tempat kediaman.
- source_word: יַחֲנוּ בְנֵי יִשְׂרָאֵל
  choice: orang Israel tetap berkemah
  rationale: 'Imperfek menggambarkan tindakan kebiasaan: selama awan menetap, mereka tetap berada di perkemahan. ''Orang Israel'' adalah padanan alami bagi ungkapan Ibrani tanpa mengubah rujukannya.'
- source_word: וְלֹא יִסָּעוּ
  choice: dan tidak berangkat
  rationale: Dalam konteks perjalanan, נסע berarti meninggalkan perkemahan untuk melanjutkan perjalanan.
- source_word: וּבְהֵעָלֹתוֹ יִסָּעוּ
  choice: Namun, ketika awan itu terangkat, mereka pun berangkat
  rationale: Mempertahankan kontras antara menetap dan berangkat serta menjadikan rujukan pronomina jelas dalam bahasa Indonesia.
theological_decisions: []
