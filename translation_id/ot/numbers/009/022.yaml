  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pengulangan 'tetap' mencerminkan keberlangsungan awan dan keadaan Israel yang terus berkemah; istilah teknis yang tidak perlu dihindari.
