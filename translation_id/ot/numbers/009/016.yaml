  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: id
  text: 'Demikianlah yang selalu terjadi: awan menutupinya, dan pada malam hari tampak seperti api[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan pada malam hari ada penampakan api.”'
    reason: Alternatif ini mengikuti bentuk nominal מַרְאֵה אֵשׁ secara lebih harfiah.
lexical_decisions:
- source_word: כֵּן יִהְיֶה תָמִיד
  choice: Demikianlah yang selalu terjadi
  rationale: Gabungan ini merangkum pola yang berlangsung terus-menerus. Bentuk imperfek יִהְיֶה dipahami sebagai keadaan kebiasaan dalam konteks naratif, sedangkan תָמִיד menegaskan kesinambungannya.
- source_word: הֶעָנָן
  choice: awan
  rationale: Nomina definit ini menunjuk kepada awan yang sudah dikenal dari konteks langsung; dalam bahasa Indonesia, definiteness cukup ditentukan oleh konteks tanpa kata sandang khusus.
- source_word: יְכַסֶּנּוּ
  choice: menutupinya
  rationale: Verba ini berarti menutupi atau menyelubungi. Akhiran pronominal orang ketiga maskulin tunggal dipertahankan secara alami dengan -nya, dengan rujukan kontekstual kepada Kemah Suci.
- source_word: וּמַרְאֵה אֵשׁ לָיְלָה
  choice: dan pada malam hari tampak seperti api
  rationale: Ungkapan ini menyatakan kesan visual berupa api pada malam hari. Rumusan ini alami dalam bahasa Indonesia dan tidak memutuskan apakah yang terlihat itu api secara harfiah atau hanya menyerupai api.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam יְכַסֶּנּוּ
  choice: -nya, merujuk secara kontekstual kepada Kemah Suci
  alternative: menerjemahkannya dengan rujukan personal, 'menutupi dia'
  rationale: Bentuk Ibrani dapat secara gramatikal berarti 'dia' atau 'itu', tetapi konteks terdekat membahas Kemah Suci yang ditutupi awan. Bentuk Indonesia '-nya' mempertahankan pronomina tanpa mempersonifikasikan rujukannya.
- issue: Hakikat penampakan api pada malam hari
  choice: tampak seperti api
  alternative: ada penampakan api
  rationale: מַרְאֵה menunjuk pada apa yang tampak atau penampakan. Terjemahan utama mempertahankan ketegangan antara api yang nyata dan sesuatu yang tampak seperti api, tanpa menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan pola ringkasan naratif Ibrani, sementara bentuk 'tampak seperti api' menghindari ungkapan nominal yang kaku.
