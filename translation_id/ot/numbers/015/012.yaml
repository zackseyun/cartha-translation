  yaml_path: translation/ot/numbers/015/012.yaml
  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: id
  text: Sesuai dengan jumlah yang kamu siapkan[a], demikianlah harus kamu siapkan untuk masing-masing menurut jumlahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sesuai dengan jumlah yang kamu buat, demikianlah harus kamu lakukan untuk masing-masing menurut jumlahnya.” Kata kerja Ibrani עשה biasanya berarti “melakukan” atau “membuat”; di sini “siapkan” dipakai untuk memperjelas konteks persembahan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: Sesuai dengan jumlah
  rationale: Prefiks כ menyatakan kesesuaian atau perbandingan, sedangkan מִסְפָּר berarti “jumlah” atau “hitungan”. Ungkapan ini mempertahankan susunan sumber sekaligus wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini menerangkan “jumlah” dan secara alami diterjemahkan “yang”.
- source_word: תַּעֲשׂוּ
  choice: kamu siapkan / harus kamu siapkan
  rationale: Verba עשה secara luas berarti “melakukan” atau “membuat”, tetapi dalam konteks kurban menunjuk pada penyiapan persembahan beserta ketentuannya. “Siapkan” memperjelas konteks tanpa menghilangkan alternatif harfiahnya, yang dicatat dalam catatan kaki.
- source_word: כָּכָה
  choice: demikianlah
  rationale: Adverbia ini menghubungkan ketentuan awal dengan pelaksanaannya. “Demikianlah” bernada instruktif, alami, dan bermartabat.
- source_word: לָאֶחָד
  choice: untuk masing-masing
  rationale: 'Secara harfiah berarti “untuk yang satu”, tetapi konteksnya distributif: ketentuan tersebut berlaku bagi setiap hewan atau satuan persembahan.'
- source_word: כְמִסְפָּרָם
  choice: menurut jumlahnya
  rationale: Ungkapan ini menyatakan kesesuaian dengan jumlah seluruh satuan yang dipersembahkan. Sufiks jamak Ibrani diungkapkan secara idiomatis dengan “-nya” yang merujuk pada kumpulan tersebut.
