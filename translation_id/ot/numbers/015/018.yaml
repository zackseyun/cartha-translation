  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: id
  text: '“Berbicaralah kepada orang Israel dan katakan kepada mereka: Apabila kamu memasuki negeri yang sedang Kubawa kamu masuki,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif piel dari דבר memperkenalkan perintah ilahi yang harus disampaikan Musa; bentuk ini langsung dan wajar dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiahnya ‘anak-anak lelaki Israel’, tetapi dalam formula sapaan perjanjian ini menunjuk komunitas Israel secara keseluruhan. ‘Orang Israel’ alami, inklusif sesuai cakupan konteks, dan tidak mengubahnya menjadi istilah politik modern.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakan kepada mereka
  rationale: Mempertahankan formula perintah berurutan yang lazim setelah ‘berbicaralah kepada’.
- source_word: בְּבֹאֲכֶם
  choice: Apabila kamu memasuki
  rationale: Infinitif konstruk dengan בְּ menyatakan waktu. Dalam konteks kedatangan ke suatu negeri, ‘memasuki’ menyampaikan gerak masuk secara alami.
- source_word: אֶל הָאָרֶץ
  choice: negeri
  rationale: אֶרֶץ di sini adalah wilayah tujuan yang akan dimasuki Israel; ‘negeri’ merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: yang sedang Kubawa kamu ke sana
  rationale: Partisipel מֵבִיא menyatakan tindakan ilahi yang sedang berlangsung dan berarah ke masa depan. ‘Ke sana’ mempertahankan שָׁמָּה yang hadir secara eksplisit dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan ‘orang Israel’ dipilih untuk cakupan komunal; kapitalisasi ‘Kubawa’ menandai pembicara ilahi sesuai konvensi ejaan Alkitab bahasa Indonesia. Tanda koma penutup menunjukkan ayat ini berlanjut ke ayat berikutnya.
