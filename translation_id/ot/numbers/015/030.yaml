  terminology: “Yahweh” konsisten dengan kebijakan proyek. “Menghina” dapat menyampaikan גדף tanpa membatasi tindakan itu hanya pada ujaran. “Diputuskan dari antara bangsanya” menjaga istilah hukum-teologis כרת tanpa menentukan apakah pelaksanaannya berupa hukuman mati, pengucilan, atau penghakiman ilahi.
