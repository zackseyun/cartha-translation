  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: id
  text: Namun, orang yang bertindak dengan tangan terangkat[a], baik warga asli maupun pendatang, menghina Yahweh, dan orang itu akan diputuskan dari antara bangsanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan lancang” atau “dengan sikap menantang”; secara harfiah, “dengan tangan terangkat.”
    reason: Menjelaskan arti idiom Ibrani sambil mempertahankan citra harfiahnya dalam teks utama.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: orang
  rationale: Dalam konteks hukum, נֶפֶשׁ menunjuk kepada pribadi secara utuh; “orang” merupakan padanan Indonesia yang alami dan tepat.
- source_word: תַּעֲשֶׂה
  choice: bertindak
  rationale: Kata עשה bersifat luas, dan “bertindak” mempertahankan cakupan itu tanpa menentukan pelanggaran yang tidak disebutkan secara eksplisit.
- source_word: בְּיָד רָמָה
  choice: dengan tangan terangkat
  rationale: Padanan ini mempertahankan gambaran konkret idiom Ibrani, sementara catatan kaki menjelaskan makna menantang atau lancangnya.
- source_word: הָאֶזְרָח
  choice: penduduk asli
  rationale: Menunjuk kepada anggota asli komunitas dan membentuk kontras hukum yang jelas dengan גֵּר.
- source_word: הַגֵּר
  choice: pendatang
  rationale: Menunjuk kepada orang bukan pribumi yang menetap di tengah Israel; “pendatang” alami dalam bahasa Indonesia dan tidak menyiratkan sekadar pengunjung.
- source_word: אֶת יְהוָה הוּא מְגַדֵּף
  choice: menghina Yahweh
  rationale: גדף menyatakan penghinaan atau pencelaan berat terhadap Allah. “Menghina” mencakup tindakan dalam konteks ini tanpa membatasinya pada ucapan penghujatan saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana tampil dalam teks Ibrani dan sesuai dengan kebijakan proyek.
- source_word: וְנִכְרְתָה
  choice: harus dilenyapkan
  rationale: Ungkapan ini mempertahankan kerasnya formula hukum כרת tanpa memutuskan apakah hukumannya berupa eksekusi, pengucilan, atau penghukuman langsung oleh Allah.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: dari tengah-tengah bangsanya
  rationale: Menyampaikan penyingkiran dari komunitas umat; bentuk “-nya” juga menghindari pemberian gender yang tidak diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat pelanggaran dan hukuman
  choice: Pelanggaran digambarkan melalui idiom “dengan tangan terangkat,” sedangkan hukumannya dinyatakan sebagai “dilenyapkan” tanpa menjelaskan mekanismenya.
  alternative: Menerjemahkan pelanggaran secara langsung sebagai “dengan sengaja menantang” dan hukuman sebagai hukuman mati atau pengucilan.
  rationale: Teks menyatakan sikap menantang dan hukuman yang berat, tetapi tidak merinci bentuk pelanggaran maupun mekanisme penyingkiran dalam ayat ini. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur hukum ayat dipertahankan, tetapi susunan kalimat dibagi agar jelas bagi pembaca umum.
