  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: id
  text: Apabila kamu menyiapkan seekor lembu jantan sebagai korban bakaran atau korban sembelihan, untuk menunaikan suatu nazar[a] atau sebagai korban keselamatan[b] bagi Yahweh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “untuk melaksanakan nazar” atau “untuk memenuhi nazar.” Ungkapan Ibrani ini menunjuk pada pelaksanaan sesuatu yang telah dinazarkan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “korban persekutuan” atau “korban kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Apabila
  rationale: Dalam rangkaian petunjuk hukum ini, bentuk tersebut memperkenalkan keadaan yang bersifat kondisional sekaligus temporal. “Apabila” wajar dalam bahasa Indonesia dan mempertahankan kedua nuansa itu.
- source_word: תַעֲשֶׂה
  choice: kamu menyiapkan
  rationale: Kata עשה secara luas berarti ‘melakukan/membuat’. Dalam konteks kurban, “menyiapkan” menyampaikan tindakan mempersiapkan hewan tanpa mempersempit maknanya menjadi tindakan ritual tertentu.
- source_word: בֶן בָּקָר
  choice: seekor sapi jantan
  rationale: Ungkapan harfiah ‘anak kawanan sapi’ menunjuk pada hewan jantan dari kawanan sapi. Bahasa Indonesia modern paling jelas menyatakannya sebagai “seekor sapi jantan”; usia muda tidak ditegaskan dalam ayat ini.
- source_word: עֹלָה
  choice: korban bakaran
  rationale: Istilah baku dan ringkas untuk kurban yang dibakar seluruhnya.
- source_word: אוֹ זָבַח
  choice: atau korban sembelihan
  rationale: זבח menunjuk pada kurban yang disembelih. “Korban sembelihan” mempertahankan unsur leksikalnya dan membedakannya dari kategori khusus korban bakaran.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: untuk menunaikan nazar
  rationale: Ungkapan ini dalam hukum kurban berarti melaksanakan atau memenuhi sesuatu yang telah dinazarkan. “Menunaikan nazar” alami dan tepat dalam bahasa Indonesia.
- source_word: אוֹ שְׁלָמִים
  choice: atau sebagai persembahan keselamatan
  rationale: שְׁלָמִים adalah kategori kurban yang berkaitan dengan damai, kesejahteraan, dan persekutuan. “Persembahan keselamatan” mempertahankan istilah tradisional tanpa membatasi maknanya hanya pada salah satu aspek.
- source_word: לַ/יהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa persembahan itu diperuntukkan bagi Allah. Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Penerjemahan שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan persekutuan; persembahan kesejahteraan; korban pendamaian
  rationale: Istilah Ibrani mencakup nuansa damai, kesejahteraan, dan persekutuan. Pilihan ini mempertahankan kategori kurban yang dikenal sambil mendokumentasikan alternatifnya, tanpa menetapkan satu penafsiran teologis secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur ayat dibiarkan berlanjut dengan koma karena kalimat ketentuannya diteruskan dalam ayat berikutnya. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
