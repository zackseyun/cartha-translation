  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan sebagai “TUHAN”.'
