lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam konteks perkataan ilahi, “berfirman” merupakan ungkapan Indonesia yang alami dan bermartabat; bentuk wayyiqtol memajukan alur narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Menandai Musa sebagai penerima firman dengan preposisi Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Rumus Ibrani harfiah “untuk mengatakan” memperkenalkan isi ucapan pada ayat berikutnya. Dalam bahasa Indonesia, fungsi itu sudah tersirat secara alami oleh “berfirman” dan tanda koma; menerjemahkannya sebagai “demikian” akan menambahkan unsur yang tidak eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Berfirman” dipilih sebagai diksi lazim untuk perkataan Allah. Koma mempertahankan sifat ayat ini sebagai pengantar bagi isi firman pada ayat berikutnya.
