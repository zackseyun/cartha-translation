  text: אֵת֩ כָּל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶׁ֑ה מִן הַ/יּ֞וֹם אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה וָ/הָ֖לְאָה לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: id
  text: segala sesuatu yang diperintahkan Yahweh kepadamu melalui Musa[a], sejak hari ketika Yahweh memberi perintah dan seterusnya, turun-temurun—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Musa,” sebuah ungkapan yang berarti “melalui Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: segala sesuatu yang
  rationale: Menyatakan keseluruhan dari apa yang diperintahkan dan tetap alami dalam bahasa Indonesia modern.
- source_word: צִוָּה יְהוָה אֲלֵיכֶם
  choice: yang diperintahkan Yahweh kepadamu
  rationale: Bentuk perfektif Ibrani merangkum perintah yang telah diberikan dan masih relevan dalam konteks; konstruksi pasif Indonesia menghasilkan susunan yang alami tanpa mengubah pelakunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan harfiah 'dengan tangan Musa' merupakan idiom perantaraan atau keagenan; 'melalui Musa' menyampaikan maknanya secara jelas.
- source_word: מִן הַיּוֹם אֲשֶׁר צִוָּה יְהוָה
  choice: sejak hari Yahweh memberi perintah
  rationale: Menandai titik awal waktu. 'Memberi perintah' mempertahankan arti צִוָּה sekaligus menghindari konstruksi Indonesia yang tidak lengkap.
- source_word: וָהָלְאָה
  choice: dan seterusnya
  rationale: Menyatakan kelanjutan sejak titik waktu yang disebutkan.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang alami untuk keberlakuan berkelanjutan dalam generasi-generasi umat yang disapa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut dari ayat sebelumnya ke ayat berikutnya.
