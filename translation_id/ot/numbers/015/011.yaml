  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: id
  text: Demikianlah harus dilakukan untuk setiap ekor sapi jantan, atau setiap ekor domba jantan, atau seekor ternak kecil[a] dari antara domba atau kambing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה dapat berarti seekor ternak kecil secara umum, bukan hanya anak domba; frasa berikutnya menunjukkan bahwa hewan itu dapat berasal dari domba ataupun kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: Demikianlah
  rationale: Menandai cara pelaksanaan yang telah ditetapkan dalam konteks hukum dengan bahasa Indonesia yang ringkas dan bermartabat.
- source_word: יֵעָשֶׂה
  choice: harus dilakukan
  rationale: Bentuk pasif menyampaikan ketentuan impersonal; 'harus' mempertahankan daya preskriptif bentuk imperfek dalam konteks hukum.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: untuk setiap ekor sapi jantan
  rationale: Gabungan kata sandang dan 'satu' menunjuk penerapan ketentuan pada tiap-tiap hewan secara individual; 'setiap ekor' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'sapi jantan yang satu itu'.
- source_word: לָאַיִל הָאֶחָד
  choice: setiap ekor domba jantan
  rationale: אַיִל berarti domba jantan; pengulangan הָאֶחָד kembali menekankan penerapan pada satu hewan secara individual.
- source_word: שֶׂה
  choice: seekor ternak kecil
  rationale: Istilah ini dapat menunjuk seekor hewan ternak kecil, baik domba maupun kambing. Pilihan ini mempertahankan keluasan makna yang kemudian diperjelas oleh frasa berikutnya.
- source_word: בַכְּבָשִׂים
  choice: dari antara domba
  rationale: Preposisi ב menandai golongan atau kategori asal hewan tersebut.
- source_word: בָעִזִּים
  choice: dari antara ... kambing
  rationale: Sejajar dengan בַכְּבָשִׂים dan menyatakan kategori kambing.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: atau ... atau ... atau
  rationale: Struktur pilihan dipertahankan sejauh wajar dalam bahasa Indonesia untuk menunjukkan berbagai jenis hewan persembahan yang mungkin.
