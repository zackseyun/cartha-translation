  yaml_path: translation/ot/numbers/015/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר memperkenalkan peristiwa tutur baru. Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama pribadi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan perkataan; “kepada” adalah padanan baku dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama Ibrani ini memakai bentuk konvensional yang sudah mapan dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Infinitif ini memperkenalkan isi ujaran yang menyusul. Dalam bahasa Indonesia modern, fungsi tersebut sudah tersirat oleh “berfirman” dan tanda baca, sehingga terjemahan harfiah “dengan mengatakan” akan terasa kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Kemudian” menandai kelanjutan narasi tanpa membuat hubungan waktunya terlalu spesifik. Rumus לֵאמֹר diungkapkan secara idiomatis melalui verba tutur dan koma karena isi firman berlanjut pada ayat berikutnya.
