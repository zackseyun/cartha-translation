  naturalness: “Yahweh berfirman kepada Musa:” adalah bahasa Indonesia baku, alami, dan lazim untuk rumus pengantar ujaran ilahi yang isinya berlanjut ke ayat berikutnya. Tanda titik dua lebih jelas daripada koma pada akhir ayat karena menandai ujaran yang akan menyusul.
  terminology: “Yahweh” konsisten dengan keputusan penerjemahan nama ilahi. “Berfirman” sesuai register naratif kitab suci dan tepat bagi subjek ilahi; “Musa” adalah bentuk nama yang mapan dalam bahasa Indonesia.
