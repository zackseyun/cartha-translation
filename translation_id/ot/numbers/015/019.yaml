  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: id
  text: Apabila kamu makan roti dari negeri itu, hendaklah kamu mempersembahkan persembahan khusus[a] kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “angkatlah suatu persembahan.” Frasa Ibrani ini memakai bahasa ibadah untuk menyerahkan sesuatu yang dikhususkan bagi Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: Apabila kamu makan
  rationale: Konstruksi dengan היה dan infinitif berprefiks ב menyatakan keadaan waktu pada masa mendatang. “Apabila kamu makan” menyampaikan fungsi temporalnya secara alami dalam bahasa Indonesia.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: roti dari hasil negeri itu
  rationale: לֶחֶם secara dasar berarti “roti”, sedangkan מן menunjukkan sumber atau makna partitif. Tambahan “hasil” memperjelas bahwa roti tersebut berasal dari produksi negeri yang akan mereka masuki tanpa menghilangkan gambaran konkretnya.
- source_word: תָּרִימוּ תְרוּמָה
  choice: kamu harus mempersembahkan persembahan khusus
  rationale: Dalam konteks ibadah, bentuk Hifil dari רום bersama תְרוּמָה merupakan ungkapan teknis untuk menyerahkan sesuatu yang dikhususkan bagi Allah. “Mempersembahkan persembahan khusus” alami dan mempertahankan sifat kultis istilah tersebut; gambaran harfiah “mengangkat” dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima atau menjadi tujuan persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. “Yahweh” mempertahankan nama perjanjian itu secara langsung dan membedakannya dari gelar umum.
- issue: Sifat תְרוּמָה sebagai pemberian ibadah
  choice: persembahan khusus
  alternative: sumbangan
  rationale: Dalam konteks perintah ibadah, kata ini menunjuk pada bagian yang dikhususkan dan diserahkan kepada Yahweh. “Persembahan khusus” mempertahankan dimensi sakral yang dapat menjadi kurang jelas bila hanya disebut “sumbangan”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak “kamu” tidak ditandai secara morfologis dalam bahasa Indonesia, tetapi mengacu kepada seluruh umat dalam konteks ini. Pengulangan “mempersembahkan persembahan” dipertahankan karena jelas dan wajar dalam register hukum-ibadah.
