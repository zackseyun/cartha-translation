id: NUM.15.39
reference: Numbers 15:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: id
  text: Itu harus menjadi rumbai bagimu[a]. Ketika kamu melihatnya, kamu harus mengingat segala perintah Yahweh dan melakukannya. Janganlah kamu mengejar dorongan hatimu sendiri dan pandangan matamu sendiri[b], yang kamu ikuti dengan berzina[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jumbai.” Istilah Ibrani menunjuk pada rumbai seperti jumbai yang dipasang pada ujung pakaian.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “mengikuti hatimu dan matamu.” Kata kerja Ibrani menggambarkan tindakan mencari, menjelajah, atau mengejar sesuatu.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani memakai gambaran perzinaan untuk ketidaksetiaan terhadap perjanjian. Terjemahan yang lebih lunak ialah “yang membuat kamu menyimpang” atau “yang kepadanya kamu tidak setia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: rumbai
  rationale: Dalam konteks ini istilah tersebut menunjuk pada jumbai atau rumbai yang dipasang pada ujung pakaian. “Rumbai” jelas dan lazim dalam bahasa Indonesia modern.
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: Itu harus menjadi rumbai bagimu
  rationale: Mempertahankan konstruksi predikatif dan acuan tunggal dari ayat sebelumnya tanpa menambahkan fungsi penafsiran seperti “pengingat” ke dalam frasa ini.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Ketika kamu melihatnya
  rationale: 'Rangkaian tindakan dalam bahasa Ibrani secara wajar mengandung hubungan waktu: melihat rumbai itu mendorong tindakan mengingat.'
- source_word: מִצְוֺת
  choice: perintah
  rationale: “Perintah” menyampaikan daya hukum dan perjanjian dari istilah Ibrani secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri dan tidak diganti dengan gelar.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: dan melakukannya
  rationale: Terjemahan langsung dan alami untuk tindakan menjalankan semua perintah yang baru disebutkan.
- source_word: תָתֻרוּ
  choice: mengejar
  rationale: Dalam konteks moral ini, verba tersebut menggambarkan tindakan mencari atau bergerak mengikuti sesuatu. “Mengejar” mempertahankan unsur usaha aktif lebih baik daripada sekadar “mengikuti”.
- source_word: לְבַבְכֶם
  choice: dorongan hatimu sendiri
  rationale: לֵבָב mencakup kehendak, niat, dan hasrat batin, bukan hanya emosi. “Dorongan hati” membuat maksud ungkapan dapat dipahami dalam bahasa Indonesia, sedangkan “sendiri” menampilkan kontras tersirat dengan perintah Yahweh.
- source_word: עֵינֵיכֶם
  choice: pandangan matamu sendiri
  rationale: Ungkapan itu secara harfiah menyebut mata, tetapi menunjuk pada apa yang dilihat dan menarik keinginan. “Pandangan mata” tetap dekat dengan citra sumber dan alami dalam bahasa Indonesia.
- source_word: זֹנִים
  choice: berzina
  rationale: Mempertahankan metafora seksual yang kuat bagi ketidaksetiaan terhadap perjanjian, tanpa melunakkannya menjadi sekadar “menyimpang” atau “tidak setia”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri; bentuk “Yahweh” mempertahankan nama perjanjian tersebut.
- issue: Kekuatan metafora זנה dalam konteks kesetiaan perjanjian
  choice: mempertahankan gambaran seksual dengan “berzina”
  alternative: menyimpang atau tidak setia
  rationale: Bahasa Ibrani sengaja memakai gambaran perzinaan untuk pengejaran yang merupakan ketidaksetiaan kepada Yahweh. Catatan kaki menjelaskan fungsi metaforisnya tanpa menghapus ketegangan bahasa sumber.
- issue: Hubungan frasa relatif אֲשֶׁר ... אַחֲרֵיהֶם dengan hati dan mata
  choice: mempertahankan keduanya sebagai hal yang diikuti dalam perzinaan
  alternative: menafsirkan frasa hanya sebagai akibat umum berupa kesesatan
  rationale: Akhiran jamak pada אַחֲרֵיהֶם merujuk kembali kepada hati dan mata. Terjemahan mempertahankan kaitan gramatikal itu meskipun metaforanya terasa tajam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan sapaan jamak yang dinyatakan melalui “kamu” sesuai kelaziman bahasa Indonesia. Struktur kalimat dibuat alami, sementara citra rumbai, hati, mata, dan perzinaan tetap dipertahankan. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
