id: NUM.15.25
reference: Numbers 15:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: id
  text: Imam harus mengadakan pendamaian bagi seluruh umat Israel, dan mereka akan diampuni, karena itu adalah kesalahan yang tidak disengaja dan karena mereka telah membawa persembahan mereka, yaitu persembahan yang dipersembahkan dengan api bagi Yahweh[a], serta persembahan penghapus dosa mereka ke hadapan Yahweh[b], karena kesalahan mereka yang tidak disengaja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “persembahan api bagi Yahweh.” Istilah Ibrani ini adalah sebutan teknis bagi persembahan yang dipersembahkan dengan api.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan pemurnian mereka.” Istilah Ibrani yang lazim diterjemahkan “persembahan penghapus dosa” juga dapat menekankan pemurnian dalam konteks kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: harus mengadakan pendamaian
  rationale: Bentuk piel dari כפר dalam konteks kurban menyatakan tindakan ritual untuk mengadakan pendamaian. Ungkapan ini mempertahankan bobot kultis dan teologisnya dalam bahasa Indonesia yang wajar.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: bagi seluruh umat Israel
  rationale: עַל sesudah כפר berarti 'bagi' atau 'demi', sedangkan עֲדָה menunjuk kepada umat sebagai persekutuan. 'Umat Israel' menyampaikan makna idiomatis בְּנֵי יִשְׂרָאֵל secara alami dan inklusif dalam konteks seluruh komunitas.
- source_word: וְנִסְלַח לָהֶם
  choice: maka mereka akan diampuni
  rationale: Bentuk pasif dipertahankan tanpa menambahkan subjek ilahi yang tidak dinyatakan secara eksplisit dalam teks Ibrani. 'Maka' menunjukkan hasil dari tindakan pendamaian.
- source_word: כִּי שְׁגָגָה הִוא
  choice: sebab itu adalah kesalahan yang tidak disengaja
  rationale: שְׁגָגָה menunjuk kepada pelanggaran atau kekeliruan yang dilakukan tanpa sengaja. 'Kesalahan yang tidak disengaja' mempertahankan unsur kesalahan sekaligus ketidaksengajaan.
- source_word: אֶת קָרְבָּנָם
  choice: persembahan mereka
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa mendekat sebagai persembahan kepada Allah.
- source_word: אִשֶּׁה לַיהוָה
  choice: persembahan yang dibakar bagi Yahweh
  rationale: אִשֶּׁה merupakan istilah kurban yang berkaitan dengan api. Pilihan ini lebih mudah dipahami daripada bentuk teknis 'persembahan api-apian' dan tidak mengubahnya menjadi sekadar 'makanan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וְחַטָּאתָם
  choice: serta persembahan penghapus dosa mereka
  rationale: Dalam susunan ini חַטָּאת adalah sesuatu yang dibawa ke hadapan Yahweh, sehingga jelas menunjuk kepada jenis persembahan, bukan hanya kepada dosa itu sendiri. Istilah Indonesia yang lazim dipertahankan, dengan alternatif leksikal dicatat.
- source_word: לִפְנֵי יְהוָה
  choice: ke hadapan Yahweh
  rationale: Ungkapan ini menyatakan pembawaan persembahan ke dalam hadirat Yahweh dalam konteks ibadah.
- source_word: עַל שִׁגְגָתָם
  choice: karena kesalahan mereka yang tidak disengaja
  rationale: Pilihan ini mengulang padanan akar שׁגג secara konsisten dan menyatakan alasan persembahan itu diperlukan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH secara langsung; transliterasi mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna חַטָּאת dalam konteks kurban
  choice: persembahan penghapus dosa
  alternative: persembahan pemurnian
  rationale: Karena חַטָּאת di sini adalah sesuatu yang dibawa ke hadapan Yahweh, makna persembahannya dituntut oleh konteks. 'Persembahan pemurnian' tetap merupakan alternatif ilmiah yang layak dan dicatat dalam catatan kaki.
- issue: Pelaku pengampunan tidak disebutkan secara eksplisit
  choice: bentuk pasif 'mereka akan diampuni'
  alternative: Yahweh akan mengampuni mereka
  rationale: Bentuk pasif Ibrani memungkinkan pembaca memahami Allah sebagai pelaku tersirat, tetapi terjemahan tidak menambahkan nama pelaku yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur kalimat dibagi dua agar hubungan logis tetap jelas tanpa menghasilkan kalimat yang terlalu panjang. Istilah ritual dipertahankan, tetapi bentuk yang sangat teknis dijelaskan melalui catatan kaki.
