  - marker: b
    text: Atau “negeri kediamanmu” atau “negeri permukimanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Bentuk imperatif piel ini memperkenalkan perintah ilahi yang harus disampaikan Musa; ‘Berbicaralah kepada’ mempertahankan gaya perintah yang resmi dan wajar dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan Ibrani secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi dalam konteks ini menunjuk kepada komunitas Israel. ‘Keturunan Israel’ mempertahankan hubungan genealogis tanpa memberi kesan bahwa hanya laki-laki yang disapa.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: dan katakanlah kepada mereka
  rationale: Rumus perintah berurutan ini diterjemahkan secara dekat sekaligus alami.
- source_word: כִּי
  choice: Apabila
  rationale: Di sini כִּי memperkenalkan keadaan yang diharapkan terjadi ketika Israel memasuki negeri itu, bukan alasan kausal.
- source_word: תָבֹאוּ
  choice: kamu memasuki
  rationale: בוא dapat berarti datang atau masuk; bersama אֶל אֶרֶץ, ‘memasuki negeri’ merupakan ungkapan Indonesia yang paling alami.
- source_word: אֶרֶץ
  choice: negeri
  rationale: ‘Negeri’ cocok untuk wilayah yang akan dihuni Israel dan tetap membawa bobot konteks tanah yang dijanjikan.
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: tempat kamu akan tinggal
  rationale: מוֹשָׁב berarti tempat tinggal atau permukiman. Bentuk verbal ini menjelaskan konstruksi Ibrani yang tidak biasa dengan alami tanpa menentukan apakah yang dimaksud rumah-rumah atau permukiman-permukiman.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: yang Kuberikan kepadamu
  rationale: Partisipel נֹתֵן menyatakan tindakan pemberian Allah yang sedang berlaku atau sudah pasti. Bentuk kini bahasa Indonesia mempertahankan kepastian itu tanpa mengubahnya menjadi masa depan eksplisit.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Bentuk Ibrani bersifat filial dan gramatikal maskulin, tetapi sapaan hukum ini tertuju kepada komunitas perjanjian. Pilihan utama mempertahankan unsur garis keturunan dan menghindari pembatasan referen hanya kepada laki-laki; arti harfiahnya dicatat dalam catatan kaki.
- issue: Aspek pemberian ilahi dalam נֹתֵן
  choice: yang Kuberikan kepadamu
  alternative: yang sedang Kuberikan kepadamu; yang akan Kuberikan kepadamu
  rationale: Bentuk partisipel mempertahankan pemberian sebagai tindakan ilahi yang berlaku dan pasti. Terjemahan ini tidak mempersempitnya menjadi progresif murni ataupun masa depan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘Kuberikan’ mengikuti kebiasaan penulisan pronomina ilahi dalam teks keagamaan Indonesia. Anak kalimat dibiarkan terbuka karena ayat ini berlanjut ke ketentuan pada ayat berikutnya.
