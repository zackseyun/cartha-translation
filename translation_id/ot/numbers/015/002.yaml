  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: id
  text: “Berbicaralah kepada keturunan Israel dan katakanlah kepada mereka[a], ‘Apabila kamu memasuki negeri tempat tinggalmu[b], yang Kuberikan kepadamu,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; dapat juga diterjemahkan “orang Israel” atau “anak-anak Israel.”
