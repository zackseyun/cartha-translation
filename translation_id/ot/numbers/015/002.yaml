  source_fidelity: 'Terjemahan mempertahankan urutan dan fungsi utama teks Ibrani: dua perintah kepada Israel, kemudian anak kalimat temporal yang sengaja belum selesai. “Keturunan Israel” dapat diterima untuk בְּנֵי יִשְׂרָאֵל, dan “memasuki negeri” menerjemahkan תָבֹאוּ אֶל־אֶרֶץ dengan baik. Namun, “tempat kamu akan tinggal” menambahkan bentuk futurum verbal yang tidak eksplisit pada מוֹשְׁבֹתֵיכֶם, yang secara nominal berarti tempat-tempat kediaman/permukimanmu. Revisi menjadi “negeri tempat tinggalmu” lebih dekat pada konstruksi Ibrani sambil tetap alami.'
