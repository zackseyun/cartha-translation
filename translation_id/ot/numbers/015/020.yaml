  naturalness: Bahasa umumnya baku dan jelas. “Angkatlah” lebih idiomatis dan tegas untuk instruksi hukum daripada “kamu harus mengangkat.” “Adonan kalian” juga selaras dengan sapaan kolektif jamak dalam bahasa Indonesia modern.
