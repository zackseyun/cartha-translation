base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: id
  text: Dari bagian pertama adonan kalian[a], angkatlah sebuah roti sebagai persembahan khusus[b]. Seperti persembahan khusus dari tempat pengirikan, demikianlah kamu harus mengangkatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian pertama dari adonan kalian yang diuleni”; kata Ibrani yang diterjemahkan “adonan” dapat menunjuk pada adonan itu sendiri atau, melalui perluasan makna, pada wadah atau tempat mengadon.
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional, “persembahan unjukan”. Istilah Ibrani ini menunjuk pada sumbangan atau persembahan yang dipisahkan dan diserahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: bagian pertama
  rationale: Menunjukkan bagian awal atau bagian pertama yang diambil dari keseluruhan, tanpa membatasi maknanya pada hasil panen mentah.
- source_word: עֲרִסֹתֵיכֶם
  choice: adonanmu
  rationale: Dalam konteks ini kata tersebut paling wajar menunjuk pada adonan yang darinya roti diambil, meskipun secara leksikal dapat juga berkaitan dengan wadah atau tempat mengadon.
- source_word: חַלָּה
  choice: sebuah roti
  rationale: Menunjuk pada roti atau penganan roti yang dibentuk dari adonan; 'roti' alami dalam bahasa Indonesia modern dan tidak menyiratkan kue manis.
- source_word: תָּרִימוּ
  choice: kamu harus mengangkat
  rationale: Mempertahankan gambaran dasar verba 'mengangkat' dan pengulangannya dalam ayat, sekaligus membiarkan konteks menjelaskan tindakan penyerahan sebagai persembahan.
- source_word: תְרוּמָה
  choice: persembahan khusus
  rationale: Menyampaikan bahwa bagian tersebut dipisahkan dan diserahkan, tanpa memakai istilah tradisional yang dapat menyiratkan tata gerak ritual tertentu secara berlebihan.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: seperti persembahan khusus dari tempat pengirikan
  rationale: Menyatakan perbandingan dengan persembahan yang diambil dari hasil di tempat pengirikan dan mempertahankan latar agrarisnya.
- source_word: גֹּרֶן
  choice: tempat pengirikan
  rationale: Padanan Indonesia yang jelas untuk lokasi tempat bulir-bulir diproses dan dipisahkan dari sekam.
- source_word: כֵּן
  choice: demikianlah
  rationale: Menandai kesimpulan dari perbandingan secara ringkas dan bermartabat.
- source_word: אֹתָהּ
  choice: -nya
  rationale: Pronomina feminin tersebut merujuk kembali kepada roti atau persembahan yang baru disebut; bentuk Indonesia ini mempertahankan rujukan tanpa mempersempitnya.
