review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan satu hukum yang berlaku sama bagi warga Israel asli dan ger serta tindakan yang dilakukan tanpa sengaja. Namun, "di tengah-tengah kamu" mengubah rujukan orang ketiga Ibrani בְּתוֹכָם ("di antara mereka") menjadi sapaan orang kedua. Bentuk orang ketiga sebaiknya dipertahankan.
  naturalness: Kalimatnya baku dan jelas. "Pendatang" dapat dipakai bila dijelaskan sebagai penduduk nonasli yang menetap; penambahan "yang menetap" dalam teks membuat cakupan גֵּר lebih jelas dan alami.
  terminology: '"Orang Israel asli" secara wajar menyampaikan הָאֶזְרָח dalam register Alkitab Indonesia. "Hukum yang sama" tepat untuk תּוֹרָה אַחַת dalam konteks hukum ini. "Tanpa sengaja" tepat untuk בִּשְׁגָגָה.'
  issues:
  - severity: medium
    issue: Perubahan "di antara mereka" menjadi "di tengah-tengah kamu".
    rationale: Teks Ibrani memakai pronomina orang ketiga jamak dalam הַגָּר בְּתוֹכָם. Meskipun konteksnya berhubungan dengan komunitas Israel yang disapa, terjemahan sebaiknya tidak mengubah rujukan eksplisit ini menjadi orang kedua.
  - severity: low
    issue: Status menetap dari גֵּר hanya dijelaskan dalam catatan kaki.
    rationale: '"Pendatang" sendiri dapat mengacu pada orang yang baru datang atau sementara. Menyatakan "yang menetap" dalam teks secara aman mencerminkan partisip הַגָּר dan konteks sosial-hukum.'
  revised_text: Hukum yang sama berlaku bagi orang Israel asli dan bagi pendatang[a] yang menetap di antara mereka, apabila salah seorang dari mereka berbuat tanpa sengaja.
