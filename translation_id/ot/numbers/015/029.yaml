base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: id
  text: Hukum yang sama berlaku bagi orang Israel asli dan bagi pendatang[a] yang menetap di antara mereka, apabila salah seorang dari mereka berbuat tanpa sengaja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pendatang” ialah orang bukan Israel yang menetap di dalam komunitas Israel.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: orang Israel asli
  rationale: Frasa ini menunjuk pada anggota asli komunitas Israel; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: וְלַגֵּר
  choice: dan bagi pendatang
  rationale: Dalam konteks hukum ini, גֵּר adalah orang bukan asli yang menetap dalam komunitas, bukan orang asing yang sekadar lewat.
- source_word: הַגָּר בְּתוֹכָם
  choice: yang tinggal di tengah-tengah kamu
  rationale: Partisip Ibrani menyatakan tempat tinggal yang menetap; kata ganti orang kedua mempertahankan sapaan langsung kepada umat.
- source_word: תּוֹרָה אַחַת
  choice: Hukum yang sama
  rationale: Ungkapan ini menekankan bahwa ketentuan hukum yang identik berlaku bagi kedua kelompok.
- source_word: יִהְיֶה לָכֶם
  choice: berlaku
  rationale: Dalam bahasa hukum Indonesia, 'berlaku' secara alami menyampaikan bahwa ketentuan tersebut mengikat komunitas yang disapa.
- source_word: לָעֹשֶׂה
  choice: apabila salah seorang dari mereka berbuat
  rationale: Partisip tunggal bersifat generik dan dapat menunjuk kepada anggota mana pun dari kedua kelompok yang baru disebut.
- source_word: בִּשְׁגָגָה
  choice: tanpa sengaja
  rationale: Ungkapan ini menyampaikan tindakan yang tidak disengaja dalam konteks hukum dan korban secara jelas bagi pembaca modern.
theological_decisions:
- issue: Kesetaraan penerapan hukum bagi orang Israel asli dan pendatang dalam perkara tindakan yang tidak disengaja
  choice: Ayat ini menyatakan bahwa hukum yang sama berlaku bagi kedua kelompok ketika seseorang berbuat tanpa sengaja.
  alternative: Frasa תּוֹרָה אַחַת dapat diterjemahkan lebih harfiah sebagai 'satu hukum' atau 'satu ketetapan'.
  rationale: Terjemahan mempertahankan penekanan Ibrani pada penerapan ketentuan yang sama tanpa memperluasnya menjadi klaim teologis di luar konteks hukum langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara kesetaraan kedua kelompok, sapaan langsung kepada komunitas, dan sifat tindakan yang tidak disengaja tetap dipertahankan.
