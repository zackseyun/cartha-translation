  naturalness: Bahasa draf umumnya baku dan jelas. Revisi kecil menempatkan keterangan secara lebih tepat tanpa menghilangkan pengulangan yang disengaja dalam teks sumber.
  terminology: “Imam,” “mengadakan pendamaian,” “Yahweh,” dan “diampuni” adalah padanan yang layak serta bernada khidmat. “Berbuat salah” dan “melakukan dosa tanpa sengaja” secara bersama-sama mempertahankan dua pengungkapan terkait dalam bahasa Ibrani.
