  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: id
  text: Imam harus mengadakan pendamaian bagi orang yang berbuat salah ketika ia melakukan dosa tanpa sengaja di hadapan Yahweh, untuk mengadakan pendamaian baginya, dan ia akan diampuni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: harus mengadakan pendamaian
  rationale: Bentuk piel dari כפר dalam konteks keimaman menyatakan tindakan ritual untuk memulihkan hubungan dengan Allah. Frasa 'mengadakan pendamaian' jelas dan tidak membatasi maknanya pada satu teori teologis tertentu.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan langsung dan wajar bagi pelayan kultis yang melaksanakan ritus tersebut.
- source_word: עַל הַנֶּפֶשׁ
  choice: bagi orang
  rationale: נֶפֶשׁ di sini menunjuk kepada pribadi atau individu, bukan secara khusus kepada unsur tak berwujud yang disebut 'jiwa'.
- source_word: הַשֹּׁגֶגֶת
  choice: yang berbuat salah
  rationale: Partisipel dari שׁגג menggambarkan orang yang melakukan kekeliruan. Ungkapan ini dibedakan dari keterangan 'tanpa sengaja' sesudahnya agar pengulangan gagasan dalam bahasa Ibrani tetap terasa tanpa menjadi janggal.
- source_word: בְּחֶטְאָה בִשְׁגָגָה
  choice: dengan melakukan dosa tanpa sengaja
  rationale: Frasa ini menjelaskan bentuk kesalahan orang tersebut, yaitu dosa yang dilakukan tanpa sengaja. Terjemahan ini mempertahankan unsur חטא dan שגגה.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan relasi kehadiran, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: לְכַפֵּר עָלָיו
  choice: dengan mengadakan pendamaian baginya
  rationale: Pengulangan akar כפר dipertahankan. Bentuk ini menyatakan sarana atau hasil yang berkaitan erat dengan tindakan imam sebelumnya.
- source_word: וְנִסְלַח לוֹ
  choice: orang itu akan diampuni
  rationale: Bentuk pasif menyatakan bahwa pengampunan diberikan kepada orang tersebut; penyebutan 'orang itu' menghindari kerancuan pronomina dan tetap mempertahankan makna pasif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian yang dinyatakan dalam sumber Ibrani.
- issue: Makna כפר dalam ritus keimaman
  choice: mengadakan pendamaian
  alternative: menebus kesalahan
  rationale: '''Mengadakan pendamaian'' mempertahankan cakupan kultis istilah tersebut tanpa menetapkan secara sempit mekanisme teologis pendamaian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan pengulangan כפר serta pembedaan antara orang yang berbuat salah dan dosa yang dilakukan tanpa sengaja.
