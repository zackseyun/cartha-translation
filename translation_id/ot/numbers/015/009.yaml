  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: id
  text: Lalu bersama lembu jantan itu haruslah ia mempersembahkan kurban sajian berupa tepung halus, sebanyak tiga persepuluh efa[a], yang dicampur dengan setengah hin minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tiga persepuluh”; dalam konteks kurban ini, takaran yang dimaksud dipahami sebagai tiga persepuluh efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Lalu ... haruslah ia mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa mendekat atau mempersembahkan; waw menyatakan kelanjutan urutan petunjuk.
- source_word: עַל
  choice: bersama
  rationale: Dalam petunjuk kurban ini, preposisi tersebut menyatakan penyertaan atau tambahan, bukan posisi di atas.
- source_word: בֶּן הַבָּקָר
  choice: lembu jantan itu
  rationale: Ungkapan harfiah 'anak dari kawanan sapi' merupakan idiom bagi hewan sapi untuk kurban; konteks ayat sebelumnya dan artikelnya mendukung rujukan tertentu.
- source_word: מִנְחָה
  choice: kurban sajian
  rationale: Dalam hukum kurban imamat, istilah ini menunjuk pada persembahan berbahan hasil tanaman, bukan sekadar pemberian umum; 'kurban sajian' merupakan istilah Indonesia yang ringkas dan lazim.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Menunjuk pada tepung halus bermutu yang dipakai dalam persembahan; ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tiga persepuluh efa
  rationale: Teks Ibrani secara eliptis berbunyi 'tiga persepuluh'; dalam konteks takaran kurban, satuan yang dimaksud adalah efa.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: dicampur dengan ... minyak
  rationale: Partisip pasif dan preposisinya menunjukkan bahwa minyak merupakan bahan pencampur.
- source_word: חֲצִי הַהִין
  choice: setengah hin
  rationale: Nama satuan cair kuno dipertahankan melalui transliterasi agar kekhususan teks sumber tidak hilang.
