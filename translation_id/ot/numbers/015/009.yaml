  to: Lalu bersama lembu jantan itu haruslah ia mempersembahkan kurban sajian berupa tepung halus, sebanyak tiga persepuluh efa[a], yang dicampur dengan setengah hin minyak.
  rationale: Hanya padanan סֹלֶת diperbaiki dari “tepung terbaik” menjadi “tepung halus” agar lebih setia pada arti leksikal dan istilah persembahan dalam konteks ini. Struktur, ukuran, serta ambiguitas prosedural teks sumber tetap dipertahankan.
