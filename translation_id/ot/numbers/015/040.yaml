  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: id
  text: agar kamu mengingat dan melakukan segala perintah-Ku, serta menjadi kudus bagi Allahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikhususkan bagi Allahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: agar
  rationale: Menyatakan tujuan atau hasil; “agar” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: תִּזְכְּרוּ
  choice: kamu mengingat
  rationale: Bentuk imperfek dalam klausa tujuan menyatakan tindakan yang dimaksudkan terjadi; “mengingat” merupakan padanan langsung dan wajar dalam konteks perjanjian.
- source_word: וַעֲשִׂיתֶם
  choice: dan melakukan
  rationale: עשה di sini berarti melakukan atau melaksanakan perintah. “Melakukan” mempertahankan tindakan nyata tanpa menggeser maknanya menjadi sekadar menaati atau memelihara.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: segala perintah-Ku
  rationale: “Segala” mempertahankan כָּל, sedangkan “perintah-Ku” menyampaikan bentuk jamak beserta akhiran orang pertama tunggal secara alami dalam bahasa Indonesia.
- source_word: וִהְיִיתֶם
  choice: serta menjadi
  rationale: היה dengan kata sifat predikatif dapat menunjukkan keadaan yang dihasilkan. “Menjadi” sesuai dengan rangkaian tujuan ayat ini tanpa menentukan bagaimana keadaan itu diwujudkan.
- source_word: קְדֹשִׁים
  choice: kudus
  rationale: “Kudus” mempertahankan cakupan makna etis, perjanjian, dan ibadah dari קדוש, tanpa mempersempitnya hanya menjadi pemisahan ritual.
- source_word: לֵאלֹהֵיכֶם
  choice: bagi Allahmu
  rationale: Preposisi ל menyatakan hubungan atau peruntukan kepada Allah. “Bagi Allahmu” alami dalam bahasa Indonesia dan mempertahankan hubungan perjanjian yang dinyatakan teks.
theological_decisions:
- issue: Makna kekudusan dalam konteks perjanjian
  choice: kudus bagi Allahmu
  alternative: dikhususkan bagi Allahmu
  rationale: “Kudus” mempertahankan seluruh bobot teologis istilah tersebut—etis, perjanjian, dan ibadah—sedangkan “dikhususkan” hanya menonjolkan segi keterpisahan atau peruntukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kamu” mengikuti sapaan orang kedua jamak dalam bahasa Ibrani; dalam bahasa Indonesia bentuk ini dapat menyapa umat secara kolektif. Huruf kapital pada “-Ku” mengikuti konvensi penerbitan Alkitab bahasa Indonesia untuk rujukan kepada Allah.
