  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: id
  text: Berbicaralah kepada keturunan Israel dan katakanlah kepada mereka agar mereka membuat jumbai-jumbai[a] pada sudut-sudut pakaian mereka, turun-temurun, dan memasang seutas benang biru[b] pada jumbai di setiap sudut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumbai-rumbai” (Ibrani צִיצִת).
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani תְּכֵלֶת mengacu pada pewarna atau warna biru hingga biru-ungu yang digunakan pada berbagai perlengkapan sakral Israel.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini mempertahankan hubungan kekerabatan dengan Israel sekaligus terdengar wajar sebagai sebutan kolektif dalam bahasa Indonesia modern.
- source_word: וְעָשׂוּ לָהֶם
  choice: agar mereka membuat
  rationale: Sesudah perintah 'katakanlah kepada mereka', bentuk Ibrani ini secara alami menyatakan isi perintah; unsur refleksif לָהֶם tersirat dengan jelas karena jumbai dibuat pada pakaian mereka sendiri.
- source_word: צִיצִת
  choice: jumbai-jumbai
  rationale: Kata ini menunjuk pada untaian yang menggantung dan dipasang pada pakaian; 'jumbai' lebih konkret dan mudah dipahami daripada istilah yang dapat mengacu pada tepian secara umum.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: pada sudut-sudut pakaian mereka
  rationale: כָּנָף secara harfiah dapat berarti 'sayap', tetapi pada pakaian menunjuk pada ujung atau sudutnya; 'sudut-sudut' paling tepat dalam konteks ini.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan keberlakuan perintah dari satu generasi ke generasi berikutnya.
- source_word: עַל צִיצִת הַכָּנָף
  choice: pada jumbai di setiap sudut
  rationale: Bentuk tunggal Ibrani dipahami secara distributif dalam konteks banyak sudut pakaian; 'setiap sudut' menyatakan hubungan itu secara alami.
- source_word: פְּתִיל
  choice: seutas benang
  rationale: פְּתִיל menunjuk pada benang atau tali yang dipintal; 'seutas benang' alami dalam bahasa Indonesia dan sesuai dengan benda yang dipasang pada jumbai.
- source_word: תְּכֵלֶת
  choice: biru
  rationale: Istilah ini menunjuk pada bahan pewarna atau warna biru hingga biru-ungu yang dikenal dalam perlengkapan sakral Israel; 'biru' merupakan padanan utama yang jelas, dengan cakupan warnanya dijelaskan dalam catatan kaki.
