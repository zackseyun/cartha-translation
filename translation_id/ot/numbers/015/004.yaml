  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: id
  text: Maka, orang yang membawa persembahannya kepada Yahweh harus mempersembahkan persembahan sajian berupa sepersepuluh efa[a] tepung halus yang dicampur dengan seperempat hin minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sepersepuluh”; dalam konteks persembahan ini, yang dimaksud ialah sepersepuluh efa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: maka ... harus membawa
  rationale: Waw dengan bentuk perfektum melanjutkan urutan ketentuan dari ayat sebelumnya. “Maka” menyatakan kelanjutan prosedural, sedangkan “harus membawa” mengungkapkan kewajiban dalam konteks persembahan secara alami.
- source_word: הַמַּקְרִיב
  choice: orang yang mempersembahkan
  rationale: Partisipel Hifil menunjuk kepada orang yang menyerahkan persembahan; frasa ini jelas dan mempertahankan sifat partisipelnya.
- source_word: קָרְבָּנוֹ
  choice: persembahannya
  rationale: קָרְבָּן adalah istilah umum bagi sesuatu yang dibawa sebagai persembahan kepada Allah. Bentuk posesif orang ketiga tunggal dipertahankan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל diterjemahkan “kepada”, dan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks tetap tampak.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam peraturan kurban, מִנְחָה menunjuk pada persembahan berbahan hasil biji-bijian. “Persembahan sajian” merupakan ungkapan Indonesia yang ringkas dan lazim dalam konteks Alkitab.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: סֹלֶת menunjuk pada tepung bermutu yang digiling halus untuk persembahan; “tepung halus” tepat dan mudah dipahami.
- source_word: עִשָּׂרוֹן
  choice: sepersepuluh efa
  rationale: Secara harfiah kata ini berarti “sepersepuluh”, tetapi dalam ketentuan persembahan merupakan singkatan ukuran sepersepuluh efa. “Efa” ditambahkan dalam teks demi kejelasan, dengan catatan kaki yang mempertahankan bentuk harfiahnya.
- source_word: בָּלוּל
  choice: yang dicampur
  rationale: Partisipel pasif ini menggambarkan tepung yang telah dicampur dengan minyak. Bentuk relatif pasif terdengar alami dalam bahasa Indonesia.
- source_word: בִּרְבִעִית הַהִין
  choice: dengan seperempat hin
  rationale: Frasa ini menyatakan takaran minyak. Satuan kuno “hin” dipertahankan agar unsur budaya sumber tidak diubah.
- source_word: שָׁמֶן
  choice: minyak
  rationale: Teks Ibrani hanya menyebut “minyak”. Meskipun kemungkinan besar minyak zaitun yang dimaksud, terjemahan tidak menambahkan kekhususan yang tidak dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar atau memilih bentuk “Yehovah” yang kurang mencerminkan bukti kebahasaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan sifat hukum-prosedural ayat sekaligus menghindari kekakuan yang tidak perlu. Pengulangan akar קרב sebagian dipertahankan melalui “mempersembahkan persembahannya”, tetapi verba utama dibuat “membawa” agar kalimat tetap alami.
