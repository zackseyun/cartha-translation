  text: וַ/יַּנִּ֥יחוּ אֹת֖/וֹ בַּ/מִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: id
  text: Lalu mereka menahannya dalam tahanan, karena belum dinyatakan dengan jelas apa yang harus dilakukan terhadapnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena belum ditetapkan apa yang harus dilakukan terhadapnya.”
    reason: Alternatif ini menonjolkan kemungkinan nuansa legal dari פֹרַשׁ sebagai ketentuan yang belum dinyatakan secara khusus.
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: mereka menahannya
  rationale: Bentuk Hifil dari נוח berarti menempatkan atau membiarkan. Bersama בַּמִּשְׁמָר, ungkapan ini secara alami menyatakan bahwa orang itu ditempatkan dan ditahan dalam penjagaan.
- source_word: בַּמִּשְׁמָר
  choice: dalam tahanan
  rationale: מִשְׁמָר dapat menunjuk pada penjagaan, penahanan, atau tempat tahanan. Pilihan ini menyampaikan status penahanan sementara tanpa melebihkannya menjadi hukuman penjara resmi.
- source_word: לֹא פֹרַשׁ
  choice: belum dinyatakan dengan jelas
  rationale: Bentuk pasif פֹרַשׁ menunjukkan bahwa ketentuan itu belum dijelaskan atau ditetapkan secara terang. Terjemahan ini mempertahankan unsur pasif dan ketidakjelasan prosedural.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: apa yang harus dilakukan terhadapnya
  rationale: Klausa ini menanyakan tindakan yang harus diambil mengenai orang tersebut; 'harus dilakukan terhadapnya' alami dalam konteks hukum dan tidak menentukan lebih jauh jenis tindakannya.
theological_decisions:
- issue: Sifat ketidakpastian dalam proses hukum
  choice: Tindakan yang harus diambil terhadap orang itu belum dinyatakan dengan jelas.
  alternative: Hukuman khusus baginya belum ditetapkan.
  rationale: Teks Ibrani menyatakan kurangnya penjelasan atau penetapan yang jelas, tetapi tidak secara eksplisit membatasi ketidakpastian itu hanya pada jenis hukuman. Terjemahan tidak menambahkan penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Dalam tahanan' dipakai untuk penahanan sementara; struktur kalimat tetap dekat dengan alur narasi Ibrani.
