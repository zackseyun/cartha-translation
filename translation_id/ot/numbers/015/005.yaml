  text: וְ/יַ֤יִן לַ/נֶּ֨סֶךְ֙ רְבִיעִ֣ית הַ/הִ֔ין תַּעֲשֶׂ֥ה עַל הָ/עֹלָ֖ה א֣וֹ לַ/זָּ֑בַח לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: id
  text: Dan sebagai kurban curahan, haruslah kamu menyiapkan seperempat hin anggur bersama kurban bakaran[a] atau kurban sembelihan, untuk setiap anak domba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “di atas kurban bakaran.” Kata depan Ibrani di sini kemungkinan menunjukkan bahwa kurban curahan menyertai kurban bakaran dalam tata cara persembahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “untuk anak domba yang satu itu”; dalam petunjuk ini ungkapan tersebut berarti jumlah yang harus disediakan bagi setiap anak domba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: Dan ... anggur
  rationale: וְ menghubungkan ketentuan ini dengan ayat sebelumnya, sedangkan יַיִן adalah istilah umum untuk anggur.
- source_word: לַ/נֶּסֶךְ
  choice: sebagai kurban curahan
  rationale: Dalam konteks persembahan, נֶסֶךְ menunjuk pada anggur yang dicurahkan sebagai kurban. Istilah ini jelas dan mempertahankan gambaran tindakan ritualnya.
- source_word: רְבִיעִית הַ/הִין
  choice: seperempat hin
  rationale: Terjemahan ini mempertahankan jumlah dan satuan kuno yang disebut teks tanpa mengubahnya menjadi perkiraan modern.
- source_word: תַּעֲשֶׂה
  choice: haruslah kamu menyiapkan
  rationale: עָשָׂה secara dasar berarti melakukan atau membuat, tetapi dalam petunjuk ritual ini 'menyiapkan' paling alami bagi anggur yang akan dijadikan kurban curahan.
- source_word: עַל הָ/עֹלָה
  choice: bersama kurban bakaran
  rationale: עַל secara harfiah dapat berarti 'di atas', tetapi di sini kemungkinan menyatakan keterkaitan atau penyertaan dalam tata cara persembahan. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
- source_word: א֣וֹ לַ/זָּבַח
  choice: atau kurban sembelihan
  rationale: זֶבַח menunjuk pada kurban yang disembelih dan dibedakan dari עֹלָה, kurban bakaran. Pilihan ini mempertahankan pembedaan tersebut.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: untuk setiap anak domba
  rationale: Secara harfiah frasa ini berarti 'untuk anak domba yang satu itu', tetapi dalam petunjuk prosedural ini daya distributifnya paling jelas dinyatakan dengan 'setiap anak domba'.
theological_decisions: []
