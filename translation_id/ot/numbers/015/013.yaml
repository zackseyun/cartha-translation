  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: id
  text: 'Setiap warga asli[a] harus melakukan semua ini dengan cara demikian untuk mempersembahkan suatu persembahan dengan api[b], suatu aroma yang menyenangkan bagi Yahweh.


    [a] Secara harfiah, “setiap warga asli.” Bentuk Ibraninya tunggal maskulin, tetapi dalam ketentuan hukum ini dipakai dengan makna umum bagi setiap orang yang merupakan warga asli.


    [b] Istilah Ibrani ini juga dapat diterjemahkan “persembahan oleh api” atau “persembahan yang dipersembahkan dengan api.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap warga asli.” Bentuk Ibraninya tunggal maskulin, tetapi dalam ketentuan hukum ini dipakai dengan makna umum bagi setiap orang yang merupakan warga asli.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini juga dapat diterjemahkan “persembahan oleh api” atau “persembahan yang dipersembahkan dengan api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: Setiap warga asli
  rationale: כָּל bersifat distributif di depan nomina tunggal. הָאֶזְרָח menunjuk anggota asli komunitas Israel, berbeda dengan pendatang dalam konteks sekitarnya; bahasa Indonesia tidak perlu menambahkan penanda gender.
- source_word: יַעֲשֶׂה
  choice: harus melakukan
  rationale: Bentuk imperfek ini berfungsi preskriptif dalam ketentuan hukum; “harus” menyampaikan kewajiban secara alami dalam bahasa Indonesia modern.
- source_word: כָּכָה אֶת אֵלֶּה
  choice: melakukan semua hal ini dengan cara demikian
  rationale: Ungkapan ini merujuk kembali kepada tata cara dan unsur persembahan yang telah ditetapkan, tanpa mempersempit acuannya hanya kepada benda-benda persembahan.
- source_word: לְהַקְרִיב
  choice: untuk mempersembahkan
  rationale: Dalam konteks kurban, verba ini berarti membawa atau menyajikan sesuatu sebagai persembahan; “mempersembahkan” merupakan padanan Indonesia yang wajar.
- source_word: אִשֵּׁה
  choice: persembahan dengan api
  rationale: Istilah teknis kurban ini berkaitan dengan persembahan yang diserahkan melalui api. Terjemahan mempertahankan unsur api, sedangkan pilihan lain dicatat dalam catatan kaki karena rincian maknanya diperdebatkan.
- source_word: רֵיחַ נִיחֹחַ
  choice: yang aromanya menyenangkan
  rationale: Ungkapan kurban ini menyatakan aroma yang berkenan atau menyenangkan bagi Allah. Susunan relatif menghasilkan bahasa Indonesia yang alami tanpa menghilangkan citra aroma.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”; preposisi לְ dalam ungkapan ini secara alami diterjemahkan “bagi”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung; transliterasi “Yahweh” mempertahankan fungsi nama perjanjian itu.
- issue: Daya representatif bentuk maskulin tunggal הָאֶזְרָח
  choice: warga asli
  alternative: laki-laki warga asli
  rationale: Walaupun bentuk gramatikal Ibrani adalah maskulin tunggal, nomina itu tidak secara leksikal berarti “laki-laki” dan dalam hukum ini mempunyai daya representatif. Padanan Indonesia yang netral mempertahankan cakupan tersebut tanpa menambahkan pembatasan gender.
- issue: Makna istilah kurban אִשֵּׁה
  choice: persembahan dengan api
  alternative: persembahan berupa makanan
  rationale: Hubungan istilah ini dengan api dipertahankan karena paling langsung dikenali dalam konteks ritual, tetapi ketidakpastian leksikal tidak diselesaikan secara dogmatis; alternatif dekat dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang bermartabat. “Harus” dipilih alih-alih konstruksi arkais, dan urutan kalimat dijaga dekat dengan teks Ibrani sambil tetap alami bagi pembaca umum.
