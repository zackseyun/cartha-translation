  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: id
  text: Apabila hal itu dilakukan tanpa sengaja dan luput dari perhatian umat, seluruh umat harus mempersembahkan seekor lembu jantan muda sebagai kurban bakaran, untuk menjadi aroma yang menyenangkan bagi Yahweh, beserta kurban sajiannya dan persembahan curahannya sesuai dengan ketentuan, serta seekor kambing jantan sebagai kurban penghapus dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban pemurnian”. Kata Ibrani חַטָּאת dapat menunjuk pada kurban yang berkaitan dengan dosa dan pada dampak pemurnian ritualnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: luput dari perhatian umat
  rationale: Ungkapan harfiahnya, 'dari mata umat', merupakan idiom untuk sesuatu yang tidak terlihat atau tidak disadari oleh umat. Pilihan ini menyampaikan makna idiom itu secara alami tanpa menambah penafsiran.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: dilakukan tanpa sengaja
  rationale: שְׁגָגָה menunjuk pada kekeliruan atau pelanggaran yang tidak disengaja, khususnya dalam konteks hukum dan kurban, berlawanan dengan tindakan yang disengaja dalam konteks sekitar.
- source_word: כָל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk pada komunitas Israel sebagai satu persekutuan; 'seluruh umat' alami dalam bahasa Indonesia dan mempertahankan cakupan כָל.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: seekor sapi jantan muda
  rationale: Frasa ini menunjuk pada seekor sapi jantan dari kawanan ternak, lazimnya dipahami sebagai sapi jantan muda yang dipersembahkan sebagai kurban. 'Seekor' juga mempertahankan אֶחָד.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah kurban baku bagi persembahan yang dibakar; 'kurban bakaran' ringkas, jelas, dan sesuai dengan konteks ritual.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Terjemahan ini mempertahankan metafora ritual Ibrani mengenai aroma yang berkenan tanpa mereduksinya menjadi keterangan tentang penciuman semata.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditampilkan sebagai 'Yahweh', sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: וּמִנְחָתוֹ
  choice: beserta kurban sajiannya
  rationale: Dalam konteks kurban, מִנְחָה adalah persembahan dari hasil tanaman yang menyertai kurban utama. Bentuk posesif mempertahankan sufiks Ibrani.
- source_word: וְנִסְכּוֹ
  choice: dan kurban curahannya
  rationale: נֶסֶךְ menunjuk pada persembahan cair yang dicurahkan. 'Kurban curahan' merupakan padanan ritual yang jelas dan mempertahankan sufiks posesif.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan ketentuan
  rationale: מִשְׁפָּט di sini berarti tata cara atau aturan ritual yang telah ditetapkan; 'ketentuan' menyampaikan sifat normatifnya dalam bahasa Indonesia modern.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: serta seekor kambing jantan
  rationale: שְׂעִיר עִזִּים secara khusus menyatakan kambing jantan; pilihan ini mempertahankan jenis kelamin hewan dan jumlah tunggalnya.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: חַטָּאת adalah istilah ritual yang berkaitan dengan dosa sekaligus pemurnian. 'Kurban penghapus dosa' mudah dipahami dan mempertahankan kaitannya dengan dosa, sedangkan nuansa pemurnian dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna חַטָּאת dalam konteks kurban imamat
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah Ibrani ini dapat menonjolkan kaitan kurban dengan dosa maupun fungsi ritualnya dalam pemurnian. Teks utama memakai istilah yang mudah dikenali tanpa meniadakan alternatif yang bermakna, yang dipertahankan dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan gelar.
translation_notes:
  register: 'Bahasa Indonesia modern yang lugas dan bermartabat. Istilah ritual dibuat konsisten dan mudah dibaca: ''kurban bakaran'', ''kurban sajian'', ''kurban curahan'', dan ''kurban penghapus dosa''. Struktur kalimat mengikuti urutan teks Ibrani sejauh tetap alami dalam bahasa Indonesia.'
