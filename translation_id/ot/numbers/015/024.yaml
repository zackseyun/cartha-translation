    issue: Konstruksi 'sebagai aroma yang menyenangkan bagi Yahweh' canggung.
    rationale: Dalam bahasa Indonesia, konstruksi ini dapat dibaca seolah-olah hewan kurban adalah aroma. Ibrani memakai idiom tujuan/hasil ritual, 'untuk aroma yang menyenangkan bagi Yahweh'.
  - severity: low
    issue: '''Kurban curahan'' kurang idiomatis dibandingkan ''persembahan curahan''.'
    rationale: נסך adalah persembahan cair yang menyertai korban utama; 'persembahan curahan' menyampaikan fungsi ini dengan lebih alami.
  revised_text: Apabila hal itu dilakukan tanpa sengaja dan luput dari perhatian umat, seluruh umat harus mempersembahkan seekor lembu jantan muda sebagai kurban bakaran, untuk menjadi aroma yang menyenangkan bagi Yahweh, beserta kurban sajiannya dan persembahan curahannya sesuai dengan ketentuan, serta seekor kambing jantan sebagai kurban penghapus dosa.[a]
