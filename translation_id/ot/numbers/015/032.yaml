id: NUM.15.32
reference: Numbers 15:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: id
  text: Ketika orang Israel berada di padang gurun, mereka mendapati seorang laki-laki sedang mengumpulkan kayu[a] pada hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: ranting-ranting.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ketika ... berada
  rationale: Bentuk naratif ini berfungsi sebagai latar keadaan. Susunan “ketika ... berada” menyampaikan daya sirkumstansialnya secara alami dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk secara kolektif kepada umat Israel. “Orang Israel” merupakan padanan Indonesia modern yang alami dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk kawasan liar dan tandus tempat pengembaraan Israel; “padang gurun” adalah ungkapan Indonesia yang lazim tanpa mengharuskan gambaran gurun pasir.
- source_word: וַיִּמְצְאוּ
  choice: mereka mendapati
  rationale: Dalam konteks naratif, verba ini berarti menemukan atau menjumpai seseorang dalam keadaan tertentu; “mendapati” sesuai dengan konstruksi partisipial berikutnya.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina tunggal ini secara eksplisit menunjuk individu laki-laki. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: sedang mengumpulkan kayu
  rationale: Partisipel menyatakan kegiatan yang tengah berlangsung, sedangkan עֵצִים di sini merujuk bahan kayu yang dikumpulkan. Kemungkinan arti “ranting-ranting” dipertahankan dalam catatan kaki.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: pada hari Sabat
  rationale: Padanan ini mempertahankan unsur יוֹם, “hari,” serta istilah Sabat secara lugas.
theological_decisions:
- issue: Sebutan kolektif בְנֵי יִשְׂרָאֵל bagi umat perjanjian
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: “Orang Israel” menyampaikan rujukan kolektif secara alami dalam bahasa Indonesia dan mencakup seluruh umat, sedangkan “anak-anak Israel” dapat terdengar seolah-olah hanya menunjuk anak kecil.
- issue: Istilah Sabat
  choice: pada hari Sabat
  alternative: pada hari perhentian
  rationale: “Sabat” mempertahankan istilah khusus dalam teks dan tidak menambahkan penafsiran teologis mengenai sifat atau tuntutan hukumnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan fungsi pembukaan sebagai latar naratif, sementara “sedang” memperjelas aspek partisipel Ibrani. Penanda catatan kaki ditempatkan sesudah “kayu,” yaitu kata yang memiliki alternatif leksikal.
