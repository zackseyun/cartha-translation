  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: id
  text: Sebab ia telah menghina firman Yahweh dan melanggar perintah-Nya, orang itu pasti akan diputus[a]; kesalahannya ada padanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani menegaskan bahwa orang itu benar-benar akan “diputus”; bentuk tepat hukumannya tidak dijelaskan di sini.
    reason: cultural_note
  - marker: b
    text: Atau “kejahatannya ada padanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi hukuman yang dinyatakan dalam konteks sebelumnya; “sebab” mempertahankan hubungan kausal secara alami.
- source_word: דְבַר יְהוָה
  choice: firman Yahweh
  rationale: דָּבָר di sini menunjuk pada perkataan atau penyataan ilahi dalam konteks perjanjian, sedangkan nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: בָּזָה
  choice: telah menghina
  rationale: Kata kerja ini menyatakan sikap meremehkan dengan penghinaan aktif, bukan sekadar mengabaikan.
- source_word: מִצְוָתוֹ
  choice: perintah-Nya
  rationale: Bentuk tunggal Ibrani dipertahankan, dan “perintah” terdengar alami dalam bahasa Indonesia modern sambil tetap memiliki bobot hukum.
- source_word: הֵפַר
  choice: melanggar
  rationale: Dalam konteks perintah ilahi, “melanggar” menyampaikan tindakan membatalkan atau merusak keberlakuan perintah secara idiomatis tanpa terdengar terlalu teknis.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: pasti dilenyapkan
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian hukuman. “Pasti” membawa unsur penegasan, sedangkan “dilenyapkan” mempertahankan ketidakjelasan mengenai bentuk tepat hukuman tersebut.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: orang itu
  rationale: Dalam bahasa hukum Ibrani, נֶפֶשׁ menunjuk pada individu; “orang itu” lebih alami dan tidak memasukkan gagasan antropologis tentang ‘jiwa’.
- source_word: עֲוֺנָהּ בָּהּ
  choice: kesalahannya ada padanya
  rationale: Ungkapan ini mempertahankan gambaran tanggung jawab atau beban kesalahan yang melekat pada pelaku, tanpa menambahkan verba waktu yang tidak terdapat dalam klausa Ibrani.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut Tetragramaton secara langsung; bentuk “Yahweh” mempertahankan nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Makna hukuman הִכָּרֵת תִּכָּרֵת
  choice: pasti dilenyapkan
  alternative: pasti dikeluarkan dari umat
  rationale: Ayat ini tidak menjelaskan apakah hukuman itu berupa kematian, pengusiran, atau tindakan ilahi lainnya. Terjemahan tidak menambahkan mekanisme tertentu yang tidak dinyatakan oleh teks.
- issue: Makna עָוֹן dalam klausa penutup
  choice: kesalahannya ada padanya
  alternative: kejahatannya ditanggungnya
  rationale: “Kesalahan” mencakup perbuatan salah sekaligus tanggung jawab yang timbul darinya. Susunan ini mempertahankan ketegangan semantis tersebut tanpa secara khusus menafsirkan klausa sebagai hukuman pada masa depan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat serta kesejajaran dua pelanggaran dipertahankan. Pronomina penghormatan “-Nya” digunakan untuk Yahweh. Istilah hukuman sengaja tidak diperjelas melampaui sumber Ibrani.
