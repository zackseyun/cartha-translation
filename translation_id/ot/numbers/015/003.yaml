id: NUM.15.3
reference: Numbers 15:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: id
  text: dan kamu mempersembahkan kepada Yahweh kurban api[a]—entah kurban bakaran atau kurban sembelihan—untuk memenuhi nazar, sebagai persembahan sukarela, atau pada waktu-waktu yang ditetapkan bagimu[b], untuk menghadirkan aroma yang menyenangkan bagi Yahweh, dari ternak sapi atau kambing domba,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan yang dipersembahkan dengan api.”
    reason: Istilah Ibrani אִשֶּׁה adalah istilah ritual bagi persembahan yang disajikan melalui api; padanan singkat “kurban api” dapat dijelaskan dengan bentuk yang lebih deskriptif.
  - marker: b
    text: Atau “pada hari-hari raya yang ditetapkan bagimu.”
    reason: Kata Ibrani מוֹעֵד dapat menunjuk waktu yang ditetapkan secara umum atau, secara lebih khusus, perayaan keagamaan yang ditetapkan.
lexical_decisions:
- source_word: וַעֲשִׂיתֶם אִשֶּׁה
  choice: kamu mempersembahkan ... kurban api
  rationale: Kata kerja harfiahnya berarti 'membuat/melakukan', tetapi dalam konteks kurban bermakna mempersembahkan. 'Kurban api' mempertahankan istilah ritual tanpa memakai ungkapan lama 'korban api-apian'.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mempertahankan nama perjanjian יהוה dan arah persembahan kepada-Nya.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah Indonesia yang jelas bagi kurban yang seluruhnya dibakar.
- source_word: זֶבַח
  choice: kurban sembelihan
  rationale: Menunjukkan kurban hewan yang disembelih dan membedakannya dari kurban bakaran, tanpa mempersempitnya pada satu jenis khusus.
- source_word: לְפַלֵּא נֶדֶר
  choice: untuk memenuhi nazar
  rationale: Mengungkapkan tindakan melaksanakan kewajiban persembahan yang telah dinazarkan.
- source_word: בִנְדָבָה
  choice: sebagai persembahan sukarela
  rationale: Menyampaikan istilah ritual bagi persembahan yang diberikan dengan sukarela, bukan karena nazar.
- source_word: בְּמֹעֲדֵיכֶם
  choice: pada waktu-waktu yang ditetapkan bagimu
  rationale: Mempertahankan cakupan מוֹעֵד yang dapat berarti waktu yang ditetapkan secara umum maupun perayaan keagamaan tertentu.
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: guna menghasilkan aroma yang menyenangkan
  rationale: Mempertahankan tujuan dan metafora ritual teks dengan bahasa Indonesia modern, tanpa mengembangkan teori tentang cara kurban memengaruhi Allah.
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: dari kawanan sapi atau kawanan kambing domba
  rationale: הַבָּקָר menunjuk ternak besar, khususnya sapi, sedangkan הַצֹּאן adalah ternak kecil kolektif yang mencakup domba dan kambing.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani menyebut Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Ungkapan antropomorfis רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan bagi Yahweh
  alternative: aroma yang menenteramkan bagi Yahweh
  rationale: Pilihan ini mempertahankan metafora ritual bahwa aroma itu berkenan kepada Yahweh, tetapi tidak menambahkan gagasan bahwa Allah secara mekanis ditenangkan atau diredakan.
- issue: Hubungan alternatif dalam rangkaian עֹלָה אוֹ זֶבַח ...
  choice: baik kurban bakaran maupun kurban sembelihan ... untuk memenuhi nazar, sebagai persembahan sukarela, atau pada waktu-waktu yang ditetapkan
  alternative: menautkan setiap keadaan hanya kepada salah satu jenis kurban tertentu
  rationale: Struktur Ibrani menyajikan jenis kurban dan berbagai kesempatan mempersembahkannya tanpa menetapkan pasangan eksklusif; terjemahan mempertahankan keterbukaan sintaksis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Klausa sengaja diawali dengan 'dan' serta diakhiri koma karena ayat ini melanjutkan kalimat bersyarat dari ayat sebelumnya dan diteruskan oleh ayat berikutnya. 'Kurban' dipakai untuk tindakan ritual, sedangkan 'persembahan' dipakai pada istilah teknis persembahan sukarela. Tanda pisah membantu pembaca menangkap pasangan jenis kurban tanpa menghapus struktur rangkaian Ibrani.
