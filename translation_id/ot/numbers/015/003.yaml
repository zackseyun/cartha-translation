  to: dan kamu mempersembahkan kepada Yahweh kurban api[a]—entah kurban bakaran atau kurban sembelihan—untuk memenuhi nazar, sebagai persembahan sukarela, atau pada waktu-waktu yang ditetapkan bagimu[b], untuk menghadirkan aroma yang menyenangkan bagi Yahweh, dari ternak sapi atau kambing domba,
