  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: id
  text: Dan engkau harus mempersembahkan anggur untuk persembahan curahan, sebanyak setengah hin, sebagai persembahan api[a], aroma yang menyenangkan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan dengan api” atau “persembahan yang dipersembahkan dengan api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: Dan ... anggur
  rationale: יַיִן berarti ‘anggur’; waw penghubung diterjemahkan ‘Dan’. Susunan katanya disesuaikan agar alami dalam bahasa Indonesia.
- source_word: תַּקְרִיב
  choice: engkau harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa atau menyajikan sesuatu sebagai persembahan. ‘Mempersembahkan’ menyampaikan fungsi kultisnya secara wajar.
- source_word: לַ/נֶּסֶךְ
  choice: sebagai persembahan curahan
  rationale: נֶסֶךְ menunjuk pada persembahan cair yang dicurahkan. ‘Persembahan curahan’ jelas, cukup harfiah, dan lebih mudah dipahami daripada istilah teknis ‘libasi’.
- source_word: חֲצִי הַ/הִין
  choice: setengah hin
  rationale: Takaran kuno ‘hin’ dipertahankan agar tidak memberikan konversi modern yang semu atau terlalu pasti.
- source_word: אִשֵּׁה
  choice: suatu persembahan yang dibakar
  rationale: Istilah keimaman ini berkaitan dengan persembahan yang disajikan melalui api. Terjemahan ini mempertahankan unsur api dan memakai bahasa Indonesia modern, sementara kemungkinan padanan lain dicatat dalam catatan kaki.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Ungkapan kurban baku ini menyatakan bahwa persembahan itu berkenan. ‘Aroma yang menyenangkan’ alami dan tidak menambahkan gagasan bahwa Allah secara harfiah ditenangkan oleh baunya.
- source_word: לַ/יהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan ‘Yahweh’. Preposisi ל dalam ungkapan ini secara alami diterjemahkan ‘bagi’.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Transliterasi ‘Yahweh’ mempertahankan nama pribadi dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Makna אִשֵּׁה
  choice: suatu persembahan yang dibakar
  alternative: persembahan dengan api; persembahan api; persembahan makanan
  rationale: Pilihan utama mempertahankan hubungan tradisional istilah itu dengan api. Karena cakupan tepat istilah keimaman ini diperdebatkan dan ‘persembahan makanan’ juga diajukan berdasarkan fungsi kultisnya, catatan kaki menjaga alternatif yang berhubungan dengan api tanpa menyelesaikan ketegangan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal ‘engkau’ mempertahankan orang kedua tunggal. Istilah teknis ‘hin’ dipertahankan, sedangkan נֶסֶךְ dijelaskan secara transparan sebagai ‘persembahan curahan’.
