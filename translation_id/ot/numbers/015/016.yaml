  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: id
  text: Satu hukum dan satu ketetapan berlaku bagi kamu dan bagi orang asing yang menetap bersama kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendatang.” Kata Ibrani גֵּר merujuk pada orang nonpribumi yang tinggal di tengah Israel di bawah tatanan komunitasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: hukum
  rationale: Dalam konteks hukum ini, תּוֹרָה menunjuk pada ketentuan yang mengikat. “Hukum” alami dalam bahasa Indonesia dan tetap berbeda dari מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: ketetapan
  rationale: Istilah ini menunjuk pada norma atau keputusan hukum yang ditetapkan. “Ketetapan” mempertahankan nuansa yuridis tanpa menyiratkan vonis pengadilan.
- source_word: אַחַת / אֶחָד
  choice: satu
  rationale: Pengulangan “satu” mempertahankan bentuk Ibrani dan menegaskan kesatuan standar bagi kedua kelompok.
- source_word: יִהְיֶה
  choice: berlaku
  rationale: Bentuk imperfek menyatakan ketentuan normatif. Dalam bahasa Indonesia hukum, “berlaku” menyampaikan daya wajib secara alami tanpa terdengar sebagai ramalan.
- source_word: גֵּר
  choice: pendatang
  rationale: גֵּר adalah orang bukan pribumi yang menetap di tengah Israel dan hidup dalam tatanan komunitasnya. “Pendatang” mudah dipahami dan tidak membawa konotasi keras seperti “orang asing”; cakupan khususnya dijelaskan dalam catatan kaki.
- source_word: הַגָּר
  choice: yang tinggal
  rationale: Partisip ini menerangkan pendatang tersebut sebagai orang yang menetap. Bahasa Indonesia tidak dapat mempertahankan permainan kata benda-kata kerja Ibrani secara alami tanpa ungkapan yang janggal.
- source_word: אִתְּכֶם
  choice: bersama kamu
  rationale: Pilihan ini dekat dengan arti harfiah preposisi “dengan kamu” dan tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Kesetaraan hukum antara orang Israel dan pendatang yang menetap dalam konteks hukum peribadatan
  choice: Ayat menyatakan bahwa satu standar hukum berlaku bagi Israel dan pendatang yang tinggal bersama mereka.
  alternative: Pernyataan ini dapat dipahami lebih sempit sebagai ketentuan yang hanya berlaku pada peraturan persembahan dalam konteks terdekat.
  rationale: Rumusan ayat bersifat luas, tetapi muncul dalam bagian hukum tertentu. Terjemahan mempertahankan rumusan luas itu tanpa memperluas penerapannya secara teologis melampaui konteks.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan “satu” dipertahankan untuk mencerminkan penekanan teks Ibrani; “berlaku” dipilih sebagai ungkapan normatif yang alami.
