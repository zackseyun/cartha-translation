  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: id
  text: Bagi jemaah, satu ketetapan berlaku bagi kamu dan bagi pendatang yang tinggal di antara kamu.[a] Itulah ketetapan tetap turun-temurun. Di hadapan Yahweh, pendatang itu akan sama seperti kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap di antara kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: seluruh umat
  rationale: Dalam konteks ini קָהָל menunjuk kepada komunitas Israel sebagai satu keseluruhan. 'Seluruh umat' alami dalam bahasa Indonesia dan tidak memberi kesan gerejawi yang tidak diperlukan.
- source_word: חֻקָּה אַחַת
  choice: satu ketetapan
  rationale: Mempertahankan bentuk tunggal dan daya hukum חֻקָּה dengan ungkapan Indonesia yang jelas.
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: baik bagi kamu maupun bagi pendatang yang tinggal di tengah-tengah kamu
  rationale: '''Pendatang'' menyatakan orang bukan pribumi yang menetap di tengah Israel; klausa verbal mempertahankan pengulangan akar ג־ו־ר secara wajar dalam bahasa Indonesia.'
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan tetap
  rationale: Dalam rumusan hukum, עוֹלָם menekankan keberlakuan yang terus berlangsung; 'tetap' menyampaikan daya itu tanpa memaksakan gagasan filosofis tentang kekekalan.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang alami untuk keberlakuan sepanjang generasi-generasi berturut-turut.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: pendatang itu harus diperlakukan sama seperti kamu
  rationale: Menyampaikan kesejajaran hukum yang ditekankan konstruksi perbandingan Ibrani. Bentuk pasif idiomatis dalam bahasa Indonesia dan tidak memperluas persamaan itu melampaui konteks ketetapan ini.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menerjemahkan לִפְנֵי secara langsung dan mempertahankan nama ilahi יהוה sebagai Yahweh.
theological_decisions:
- issue: Kedudukan pendatang dalam peraturan ibadah Israel
  choice: Ayat ini menyatakan bahwa dalam ketetapan yang sedang dibicarakan, pendatang dan umat Israel diperlakukan sama di hadapan Yahweh.
  alternative: Pernyataan ini dapat dipahami sebagai asas kesetaraan yang berlaku lebih luas bagi semua bidang hukum Israel.
  rationale: Kesejajaran kedua kelompok dinyatakan dengan tegas, tetapi konteks langsungnya adalah peraturan persembahan. Terjemahan mempertahankan kesetaraan tersebut tanpa memperluas cakupannya secara tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Umat' dipilih untuk komunitas Israel, 'ketetapan' untuk corak hukum, dan 'pendatang' untuk גֵּר. Susunan kalimat dipecah agar jelas bagi pembaca umum sambil mempertahankan penekanan pada satu ketetapan dan perlakuan yang sama.
