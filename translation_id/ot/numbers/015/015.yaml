review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat menyampaikan satu ketetapan bagi komunitas Israel dan pendatang, serta sifatnya yang berlaku lintas generasi. Namun, "pendatang itu harus diperlakukan sama" mengubah predikasi/status paralel dalam teks Ibrani ("seperti kamu, demikian pendatang itu akan ada di hadapan Yahweh") menjadi perintah eksplisit mengenai tindakan orang lain. Revisi mempertahankan kesetaraan yang dinyatakan tanpa menambahkan agen atau kewajiban perlakuan yang tidak diekspresikan secara langsung.
  naturalness: '"Jemaah" merupakan padanan baku dan alami bagi הַקָּהָל dalam konteks komunitas yang berhimpun. Susunan revisi tetap modern dan jelas; "di hadapan Yahweh" ditempatkan bersama klausa kesetaraan agar cakupannya tidak kabur.'
  terminology: '"Ketetapan" sesuai untuk חֻקָּה; "pendatang yang tinggal di antara kamu" secara baik mencerminkan גֵּר הַגָּר dan pengulangan gagasan menetap. "Ketetapan tetap turun-temurun" menyampaikan חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם tanpa memaksakan pengertian metafisis. Nama ilahi "Yahweh" dipertahankan.'
  issues:
  - severity: medium
    issue: '"Pendatang itu harus diperlakukan sama seperti kamu" menambahkan gagasan perlakuan oleh pihak lain.'
    rationale: Klausa כָּכֶם כַּגֵּר יִהְיֶה secara harfiah menyatakan bahwa pendatang itu akan/sama seperti umat di hadapan Yahweh. Walaupun implikasi kesetaraan hukum sesuai konteks, verba pasif "diperlakukan" dan modal "harus" merupakan perumusan tambahan.
  - severity: low
    issue: '"Seluruh umat" kurang langsung mencerminkan nuansa komunitas/majelis dalam הַקָּהָל.'
    rationale: Padanan ini masih dapat dipahami, tetapi "jemaah" lebih dekat dengan istilah untuk himpunan komunitas tanpa mengubah makna.
  revised_text: Bagi jemaah, satu ketetapan berlaku bagi kamu dan bagi pendatang yang tinggal di antara kamu.[a] Itulah ketetapan tetap turun-temurun. Di hadapan Yahweh, pendatang itu akan sama seperti kamu.
  revised_footnotes:
