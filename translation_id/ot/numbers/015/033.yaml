  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: id
  text: Orang-orang yang mendapati dia sedang mengumpulkan kayu[a] membawanya kepada Musa, Harun, dan seluruh umat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ranting.” Kata Ibrani עֵצִים dapat menunjuk pada kayu secara umum atau potongan-potongan kayu seperti ranting.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: membawanya kepada
  rationale: Bentuk Hifil dari קרב menyatakan tindakan membawa atau menghadapkan seseorang. Dalam konteks ini, “membawanya kepada” alami dalam bahasa Indonesia dan tetap menyampaikan bahwa orang itu dibawa menghadap para pemimpin serta umat.
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: orang-orang yang mendapati dia
  rationale: Partisipel berartikel berfungsi substantival, yaitu menunjuk kepada orang-orang yang memergokinya. “Mendapati dia” secara alami menghubungkan penemuan itu dengan tindakan yang sedang berlangsung.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: sedang mengumpulkan kayu
  rationale: Partisipel menunjukkan tindakan yang sedang dilakukan ketika ia ditemukan. עֵצִים dapat berarti kayu secara umum atau potongan-potongan kayu seperti ranting; “kayu” mempertahankan cakupan yang lebih luas.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: kepada Musa, Harun, dan seluruh umat itu
  rationale: אֶל menyatakan arah atau tujuan. Pengulangan preposisi Ibrani tidak perlu diulang seluruhnya dalam bahasa Indonesia. Dalam konteks Israel, עֵדָה menunjuk kepada himpunan umat perjanjian; “seluruh umat itu” jelas dan alami.
