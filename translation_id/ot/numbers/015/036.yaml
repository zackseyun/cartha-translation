  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu seluruh umat membawa orang itu ke luar perkemahan dan merajamnya dengan batu, dan ia mati, seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk pada umat Israel sebagai himpunan bersama; “seluruh umat” alami dalam bahasa Indonesia dan mempertahankan cakupan כָּל.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: membawa orang itu
  rationale: Bentuk Hifil dari יצא berarti membawa atau mengeluarkan; bersama frasa tujuan berikutnya, “membawa ... ke luar” merupakan ungkapan Indonesia yang wajar.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: ke luar perkemahan
  rationale: Frasa ini menyatakan gerak menuju tempat di luar batas perkemahan.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: merajamnya dengan batu
  rationale: רגם berarti merajam, sedangkan בָּאֲבָנִים menyebut alatnya secara eksplisit; keduanya dipertahankan.
- source_word: וַיָּמֹת
  choice: sampai ia mati
  rationale: Secara leksikal berarti “dan ia mati”; dalam bahasa Indonesia, “sampai ia mati” menghubungkan hasil rajam secara alami tanpa mengubah kenyataan yang dinyatakan.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: seperti yang diperintahkan Yahweh kepada Musa
  rationale: כַּאֲשֶׁר menyatakan kesesuaian dengan perintah sebelumnya, dan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה. “Yahweh” mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Umat” dipilih untuk komunitas Israel secara kolektif, sedangkan “perkemahan” sesuai dengan latar perjalanan di padang gurun.
