id: NUM.15.14
reference: Numbers 15:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: id
  text: Apabila seorang pendatang tinggal bersama kalian, atau siapa pun berada di tengah-tengah kalian dari generasi ke generasi, dan ia mempersembahkan persembahan dengan api[a] sebagai aroma yang menyenangkan bagi Yahweh, ia harus melakukannya sama seperti kalian melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan berupa makanan”. Makna tepat istilah Ibraninya tidak pasti; istilah ini lazim dikaitkan dengan persembahan yang dibakar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Apabila
  rationale: Membuka ketentuan bersyarat yang berhubungan dengan hukum sebelumnya; dalam bahasa Indonesia, hubungan itu cukup alami tanpa menerjemahkan ו secara tersendiri.
- source_word: יָגוּר ... גֵּר
  choice: seorang pendatang tinggal
  rationale: Menunjukkan orang bukan pribumi yang menetap di tengah masyarakat, tanpa konotasi politis atau merendahkan dari istilah lain.
- source_word: אִתְּכֶם ... בְּתוֹכְכֶם
  choice: bersama kalian ... di tengah-tengah kalian
  rationale: Mempertahankan perbedaan antara kedua ungkapan preposisional Ibrani sekaligus memakai bahasa Indonesia yang wajar.
- source_word: לְדֹרֹתֵיכֶם
  choice: dari generasi ke generasi
  rationale: Menyampaikan keberlakuan ketentuan ini secara berkesinambungan bagi generasi-generasi mendatang.
- source_word: וְעָשָׂה
  choice: dan ia mempersembahkan
  rationale: Dalam konteks kurban, עשה berarti melaksanakan atau mempersembahkan kurban, bukan sekadar 'membuat'.
- source_word: אִשֵּׁה
  choice: persembahan dengan api
  rationale: Mencerminkan kaitan tradisional istilah ini dengan api dan tidak menyiratkan bahwa Allah secara harfiah memakan persembahan; alternatif leksikal dicatat dalam catatan kaki.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Mempertahankan metafora kurban yang menandakan penerimaan atau perkenanan ilahi dalam bahasa modern.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi diterjemahkan secara transparan sebagai Yahweh; preposisi ל menyatakan arah atau peruntukan persembahan.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: ia harus melakukannya sama seperti kalian melakukannya
  rationale: Mempertahankan formula perbandingan yang menuntut tata cara yang sama, dengan 'harus' untuk menyatakan daya preskriptif hukum.
theological_decisions:
- issue: Kedudukan peserta bukan Israel dalam ibadah kurban
  choice: Ayat ini menetapkan tata cara kurban yang sama bagi pendatang atau orang lain yang berada di tengah Israel dalam kasus yang dibicarakan.
  alternative: Ketentuan ini dapat dipahami lebih sempit sebagai hanya berlaku bagi pendatang menetap yang telah terintegrasi ke dalam kehidupan perjanjian Israel.
  rationale: Formula 'sama seperti kalian ...' menekankan kesetaraan tata cara dalam perkara ini, tetapi terjemahan tidak menarik kesimpulan yang lebih luas tentang status perjanjian mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang bermartabat. Kata ganti jamak 'kalian' dipakai untuk membedakan sapaan jamak Ibrani dari pelaku tunggal 'ia'. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
