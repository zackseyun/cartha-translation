  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: id
  text: Namun, jika satu orang berbuat dosa dengan tidak sengaja, ia harus mempersembahkan seekor kambing betina berumur satu tahun sebagai kurban penghapus dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban pemurnian.” Istilah Ibrani חַטָּאת dapat menunjuk kepada kurban yang menangani dosa atau kenajisan, bukan hanya kepada dosa itu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Dalam konteks hukum ini, ungkapan tersebut memperkenalkan kasus yang berbeda dari ketentuan sebelumnya; “Namun, jika” menyampaikan daya kontras ringan secara alami.
- source_word: נֶפֶשׁ אַחַת
  choice: satu orang
  rationale: Dalam konteks hukum, נֶפֶשׁ menunjuk kepada seorang pribadi, bukan semata-mata “jiwa”; אַחַת menegaskan bentuk tunggal.
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: berbuat dosa dengan tidak sengaja
  rationale: Frasa ini membedakan pelanggaran yang tidak disengaja dari dosa yang dilakukan dengan sengaja atau menantang.
- source_word: וְהִקְרִיבָה
  choice: ia harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks kurban berarti membawa atau menyajikan persembahan. Pronomina “ia” wajar dalam bahasa Indonesia dan tidak membatasi pelaku berdasarkan jenis kelamin.
- source_word: עֵז
  choice: seekor kambing betina
  rationale: Kata Ibrani ini secara khusus menyatakan kambing betina, sehingga jenis kelaminnya dipertahankan.
- source_word: בַּת שְׁנָתָהּ
  choice: berumur satu tahun
  rationale: Idiom ini menyatakan bahwa hewan tersebut berumur setahun atau berada dalam tahun pertamanya; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: לְחַטָּאת
  choice: sebagai kurban penghapus dosa
  rationale: Dalam hukum kurban, חַטָּאת menunjuk kepada persembahan yang menangani dosa atau kenajisan, bukan hanya kepada dosa itu sendiri. Istilah Indonesia ini jelas, lazim, dan mempertahankan fungsi ritualnya.
theological_decisions:
- issue: Jenis kelamin pelanggar tunggal
  choice: Menggunakan pronomina netral “ia”.
  alternative: Menggunakan “perempuan itu” atau pronomina yang secara eksplisit feminin.
  rationale: Bentuk-bentuk feminin dalam bahasa Ibrani mengikuti nomina נֶפֶשׁ yang secara gramatikal feminin dan tidak dengan sendirinya membatasi hukum ini hanya bagi perempuan. Bahasa Indonesia tidak menandai gender pada “ia”, sehingga cakupan umum hukum dipertahankan tanpa menghapus ketunggalannya.
- issue: Makna חַטָּאת dalam hukum kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian
  rationale: Istilah utama mempertahankan hubungan eksplisit dengan dosa dan mudah dipahami pembaca umum. Kemungkinan penekanan pada fungsi pemurnian tetap dicatat dalam catatan kaki agar ketegangan leksikal tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti pola hukum bersyarat secara alami. “Kurban” dipilih sebagai ejaan baku; “ia” mempertahankan pelaku tunggal tanpa memasukkan pembedaan gender yang tidak terdapat dalam pronomina bahasa Indonesia.
