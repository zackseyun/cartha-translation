base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: id
  text: Akulah Yahweh, Allah kalian, yang telah membawa kalian keluar dari tanah Mesir supaya Aku menjadi Allah kalian.[a] Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk menjadi Allah bagi kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama perjanjian dalam teks Ibrani tetap dipertahankan.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, dalam konteks ini rujukannya tunggal, yaitu Allah Israel. Sufiks orang kedua jamak diterjemahkan secara kolektif dengan “-mu”, sesuai pemakaian baku bahasa Indonesia ketika menyapa umat sebagai satu komunitas.
- source_word: הוֹצֵאתִי
  choice: membawa kamu keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan kausatif, “membawa keluar”, dan mempertahankan rumusan khas peristiwa keluaran.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ dan tetap terdengar alami serta khidmat dalam bahasa Indonesia modern.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: supaya Aku menjadi Allahmu
  rationale: Konstruksi infinitif ini menyatakan tujuan dari tindakan membawa Israel keluar. “Supaya Aku menjadi Allahmu” mengungkapkan hubungan perjanjian secara alami tanpa menghapus kemungkinan terjemahan yang lebih harfiah.
- source_word: אֲנִי
  choice: Akulah
  rationale: Klausa nominal Ibrani bersifat tegas. Bentuk “Akulah” menyampaikan penekanan tersebut secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Rumusan perjanjian לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: supaya Aku menjadi Allahmu
  alternative: supaya Aku menjadi Allah bagimu
  rationale: Pilihan utama jelas dan alami dalam bahasa Indonesia serta mempertahankan makna relasional perjanjian. Bentuk harfiahnya dicatat agar konstruksi sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan orang kedua jamak Ibrani diterjemahkan secara kolektif dengan “kamu” dan “Allahmu”. Pengulangan penutup dipertahankan untuk menjaga tekanan retoris ayat.
