  source_fidelity: Teks utama menangkap pengampunan bagi seluruh komunitas Israel dan bagi גֵּר yang tinggal di tengah mereka, serta alasan bahwa pelanggaran itu tidak disengaja. Namun, “umat keturunan Israel” tidak alami dan agak mengaburkan idiom kolektif בְּנֵי יִשְׂרָאֵל. “Pendatang” juga kurang spesifik untuk גֵּר, yang dalam konteks hukum menunjuk orang asing yang menetap.
  naturalness: “Seluruh umat Israel” dan “orang asing yang menetap” lebih baku, jelas, dan alami dalam bahasa Indonesia modern. “Demikian pula” mempertahankan hubungan koordinatif tanpa membuat kalimat berat.
  terminology: “Umat Israel” sesuai untuk עֲדַת בְּנֵי יִשְׂרָאֵל dalam teks utama, dengan bentuk harfiah dijelaskan dalam catatan. “Orang asing yang menetap” menyampaikan status penduduk asing (גֵּר) dengan lebih tepat daripada “pendatang.” Istilah “tanpa sengaja” mempertahankan makna hukum בִּשְׁגָגָה.
