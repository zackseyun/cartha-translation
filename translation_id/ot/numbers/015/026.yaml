base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: id
  text: Seluruh umat Israel akan diampuni[a], demikian pula orang asing yang menetap di tengah-tengah mereka[b], sebab seluruh umat itu melakukannya tanpa sengaja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh jemaah anak-anak Israel”; dapat juga diterjemahkan “seluruh umat Israel.”'
    reason: lexical_alternative
  - marker: b
    text: “Orang asing yang menetap” menerjemahkan istilah bagi warga asing yang tinggal di tengah masyarakat Israel serta hidup di bawah hukum dan perlindungan umat itu.
    reason: cultural_note
  - marker: c
    text: Klausa Ibraninya sangat ringkas; dapat juga diterjemahkan, “sebab seluruh umat itu berada dalam kekeliruan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: akan diampuni
  rationale: Bentuk nifal menyatakan pengampunan secara pasif/impersonal; bahasa Indonesia secara wajar menjadikannya predikat pasif bagi seluruh umat.
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat keturunan Israel
  rationale: עֵדָה menunjuk komunitas atau himpunan umat, sedangkan בְּנֵי יִשְׂרָאֵל secara harfiah berarti 'anak-anak/keturunan Israel'. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan identitas komunalnya.
- source_word: וְלַגֵּר
  choice: demikian juga pendatang
  rationale: גֵּר ialah orang asing yang menetap di tengah masyarakat Israel serta hidup di bawah hukum dan perlindungannya; 'pendatang' lebih alami dan tidak membawa konotasi modern yang keliru.
- source_word: הַגָּר בְּתוֹכָם
  choice: yang tinggal di tengah-tengah mereka
  rationale: Partisip גור menerangkan pendatang tersebut sebagai orang yang menetap di antara umat. Pengulangan akar Ibrani tidak dapat dipertahankan secara alami tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pengampunan dalam klausa sebelumnya.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: seluruh bangsa itu melakukannya tanpa sengaja
  rationale: Klausa Ibrani sangat ringkas, secara harfiah kira-kira 'sebab bagi seluruh bangsa, dalam ketidaksengajaan'. Pilihan ini menyampaikan bahwa pelanggaran komunal tersebut tidak disengaja, sambil mencatat kemungkinan pembacaan yang lebih harfiah dalam catatan kaki.
theological_decisions:
- issue: Cakupan pengampunan secara komunal
  choice: Pengampunan mencakup seluruh umat Israel dan pendatang yang menetap di tengah mereka.
  alternative: Membatasi pernyataan hanya kepada orang Israel asli.
  rationale: Teks secara eksplisit menghubungkan וְלַגֵּר dengan seluruh umat, sehingga pendatang termasuk dalam ketentuan pengampunan komunal ini.
- issue: Makna klausa terakhir
  choice: Seluruh bangsa melakukan pelanggaran itu tanpa sengaja.
  alternative: Seluruh bangsa berada dalam kekeliruan.
  rationale: בִּשְׁגָגָה menandai ketidaksengajaan dalam konteks hukum korban, tetapi susunan Ibraninya padat dan tidak menyebut verba 'melakukan'; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Umat' dipilih daripada 'jemaah' dalam teks utama agar mudah dipahami dalam konteks komunal, sedangkan bentuk yang lebih harfiah dicatat. 'Tanpa sengaja' mempertahankan pembedaan hukum antara pelanggaran yang tidak disengaja dan pelanggaran yang dilakukan dengan sengaja.
