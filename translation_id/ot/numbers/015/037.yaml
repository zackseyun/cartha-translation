  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam konteks Allah sebagai subjek, verba Indonesia “berfirman” secara alami dan bermartabat menyampaikan tindakan berbicara ilahi; waw konsekutif tidak perlu diterjemahkan secara mekanis dengan “dan” pada awal unit ayat.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas untuk Tetragramaton dengan huruf kapital, tanpa memasukkan pelafalan rekonstruktif ke dalam teks utama.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan langsung dan alami bagi penerima ujaran.
- source_word: לֵאמֹר
  choice: '[tidak dinyatakan tersendiri]'
  rationale: Infinitif formulaik ini memperkenalkan isi firman pada ayat berikutnya. Dalam bahasa Indonesia, “berfirman” sudah mencakup fungsi tersebut, sehingga “dengan mengatakan” akan terasa kaku dan berlebihan.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: “TUHAN” mempertahankan tradisi pembacaan yang mapan dan dapat dikenali pembaca Indonesia; pilihan ini tidak dimaksudkan untuk meniadakan bahwa teks sumber memuat nama diri ilahi.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Formula ujaran Ibrani dibuat alami tanpa mengurangi informasi proposisional; koma menandakan bahwa isi firman berlanjut pada ayat berikutnya.
