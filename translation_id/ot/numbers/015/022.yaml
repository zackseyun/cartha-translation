  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: id
  text: Jika kamu tanpa sengaja menyimpang dan tidak melakukan semua perintah ini, yang telah Yahweh firmankan kepada Musa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keliru” atau “berbuat dosa tanpa sengaja.” Kata Ibrani yang dipakai mengandung arti menyimpang atau keliru dan dalam konteks ini menunjuk pada kegagalan yang tidak disengaja dalam menaati perintah-perintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Namun, jika
  rationale: Memperkenalkan keadaan bersyarat yang melanjutkan ketentuan hukum sebelumnya sekaligus memberi sedikit peralihan kontras.
- source_word: תִשְׁגּוּ
  choice: kamu tanpa sengaja menyimpang
  rationale: Kata kerja שׁגה menggambarkan tindakan menyimpang atau keliru; dalam konteks hukum ini, tindakan tersebut tidak disengaja. Pilihan ini mempertahankan citra verbal dan nuansa ketidaksengajaan.
- source_word: וְלֹא תַעֲשׂוּ
  choice: dan tidak melakukan
  rationale: Menerjemahkan עשה secara langsung dan wajar dalam kaitannya dengan pelaksanaan perintah.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: semua perintah ini
  rationale: Mempertahankan cakupan menyeluruh כָּל serta penunjukan הָאֵלֶּה dalam bahasa Indonesia yang alami.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: yang telah Yahweh firmankan kepada Musa
  rationale: Mempertahankan Yahweh sebagai pelaku tindakan berbicara dan menyampaikan bahwa perintah-perintah itu diberikan kepada Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa שׁגה dalam konteks hukum dan kurban
  choice: tanpa sengaja menyimpang
  alternative: keliru; berbuat dosa tanpa sengaja
  rationale: Konteks ayat-ayat berikutnya membedakan pelanggaran yang tidak disengaja dari tindakan menentang dengan sengaja. Terjemahan ini menjaga pembedaan tersebut tanpa menyamakan kata kerja ini secara sempit dengan istilah teologis tertentu.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung; bentuk “Yahweh” mempertahankan nama itu dan membedakannya dari gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “kamu” mengikuti sapaan jamak dalam bahasa Ibrani secara kontekstual, meskipun jumlah tidak ditandai secara morfologis dalam bahasa Indonesia. Koma penutup dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
