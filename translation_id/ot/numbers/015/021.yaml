base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: id
  text: Dari bagian pertama adonanmu[a] kamu harus memberikan sumbangan[b] kepada Yahweh, dari generasi ke generasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "wadah pengadonanmu"; istilah Ibrani ini dapat merujuk pada adonan atau, secara metonimia, pada wadah untuk mengadon.
    reason: lexical_alternative
  - marker: b
    text: Atau "persembahan"; secara tradisional, "persembahan unjukan".
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: Dari bagian pertama
  rationale: Kata רֵאשִׁית di sini menunjuk pada bagian awal atau pertama yang diambil dari keseluruhan adonan; frasa ini mempertahankan makna partitifnya.
- source_word: עֲרִסֹתֵיכֶם
  choice: adonanmu
  rationale: עֲרִסָה dapat berarti adonan atau, melalui asosiasi, wadah untuk mengaduknya. Karena yang diberikan adalah sebagian dari isinya, 'adonanmu' paling sesuai dengan tindakan ritual dalam konteks ini.
- source_word: תִּתְּנוּ
  choice: haruslah kamu memberikan
  rationale: נתן adalah verba umum yang berarti 'memberikan'. Bentuk ini menyampaikan daya perintah tanpa menggantinya dengan istilah ritual yang lebih khusus.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga nama perjanjian yang terdapat langsung dalam teks tetap terlihat.
- source_word: תְּרוּמָה
  choice: persembahan khusus
  rationale: תְּרוּמָה adalah bagian yang dipisahkan atau diangkat untuk dipersembahkan. 'Persembahan khusus' terdengar wajar dalam bahasa Indonesia dan menunjukkan bahwa bagian itu dikhususkan, tanpa memakai istilah teknis yang kurang jelas.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan ini menyatakan keberlakuan kewajiban tersebut bagi generasi-generasi berikutnya; 'turun-temurun' merupakan padanan Indonesia yang alami dan ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan mengikuti lapisan konsultasi yang telah diperbarui, tanpa menggantinya dengan gelar.
- issue: Sifat תְּרוּמָה
  choice: persembahan khusus
  alternative: persembahan; persembahan unjukan
  rationale: Pilihan ini mempertahankan gagasan tentang bagian yang dipisahkan bagi Yahweh, tetapi tidak mempersempitnya pada suatu teknik ritual tertentu yang tidak dinyatakan secara eksplisit oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah hukum yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ambiguitas עֲרִסָה dan rentang makna תְּרוּמָה dipertahankan melalui catatan kaki.
