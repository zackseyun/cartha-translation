base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: id
  text: Atau, untuk seekor domba jantan, engkau harus menyiapkan persembahan sajian berupa tepung halus, dua persepuluh[a], yang dicampur dengan sepertiga hin minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah hanya berbunyi “dua persepuluh”; satuan efa dipahami dari sistem takaran persembahan dan disebut lengkap di bagian lain sebagai “dua persepuluh efa.”
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Atau
  rationale: Partikel ini menghubungkan ketentuan tersebut dengan pilihan kurban sebelumnya; “Atau” mempertahankan urutan alternatif tanpa menambahkan unsur bersyarat.
- source_word: לָ/אַ֨יִל֙
  choice: untuk seekor domba jantan
  rationale: אַיִל berarti domba jantan, sedangkan prefiks ל menyatakan hubungan atau peruntukan. Bentuk tak tentu wajar dalam petunjuk prosedural bahasa Indonesia.
- source_word: תַּעֲשֶׂ֣ה
  choice: haruslah engkau menyiapkan
  rationale: Dalam konteks persiapan kurban, עשה secara idiomatis berarti menyiapkan. “Haruslah” menyampaikan daya instruktif bentuk imperfek, sedangkan “engkau” mempertahankan sapaan orang kedua tunggal.
- source_word: מִנְחָ֔ה
  choice: persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה menunjuk pada persembahan berbahan hasil tanaman atau tepung. “Persembahan sajian” merupakan istilah Indonesia yang mapan dan tidak membatasi bahan itu secara kurang tepat sebagai biji-bijian utuh.
- source_word: סֹ֖לֶת
  choice: berupa tepung terbaik
  rationale: סֹלֶת adalah tepung bermutu tinggi yang telah diolah halus. “Tepung terbaik” terdengar alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: sebanyak dua persepuluh efa
  rationale: Ibrani secara harfiah menyebut “dua persepuluh” dan membiarkan satuan besarnya tersirat. Efa dijelaskan dalam teks demi kejelasan ukuran ritual, dengan catatan bahwa kata itu tidak tertulis pada ayat ini.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: yang dicampur dengan ... minyak
  rationale: Partisip pasif בְּלוּלָה menerangkan tepung sebagai sesuatu yang dicampur, dan preposisi pada שֶׁמֶן paling alami diterjemahkan “dengan”.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: sepertiga hin
  rationale: Ungkapan ini menyatakan pecahan dari satuan kuno hin. Satuan tersebut dipertahankan tanpa konversi yang berpotensi memberi ketepatan semu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan sifat prosedural hukum kurban, sementara satuan kuno tetap dipakai. Penanda catatan kaki [a] ditempatkan tepat sesudah ukuran yang dijelaskannya.
