  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: id
  text: Anggur untuk persembahan curahan[a], sebanyak sepertiga hin[b], haruslah engkau persembahkan sebagai aroma yang menyenangkan[c] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai persembahan curahan”; istilah Ibrani ini menunjuk pada persembahan berupa minuman yang dicurahkan untuk menyertai korban.
    reason: lexical_alternative
  - marker: b
    text: Hin adalah satuan takaran cairan pada zaman dahulu.
    reason: cultural_note
  - marker: c
    text: Atau, “aroma yang menenteramkan” atau “aroma yang harum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: juga anggur
  rationale: יַיִן berarti “anggur”, sedangkan prefiks וְ menghubungkan ketentuan ini dengan persembahan yang disebut sebelumnya; “juga” menyatakan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: לַ/נֶּסֶךְ
  choice: sebagai persembahan curahan
  rationale: נֶסֶךְ menunjuk pada cairan yang dicurahkan sebagai persembahan. “Persembahan curahan” jelas, mudah dipahami, dan mempertahankan tindakan khas yang terkandung dalam istilah Ibrani.
- source_word: שְׁלִשִׁית הַ/הִין
  choice: sebanyak sepertiga hin
  rationale: Frasa ini menetapkan takaran anggur. Satuan kuno “hin” dipertahankan agar teks tidak diberi padanan modern yang terkesan terlalu pasti.
- source_word: תַּקְרִיב
  choice: engkau harus mempersembahkan
  rationale: Bentuk Hifil dari קרב dalam konteks ibadah berarti membawa atau menyajikan sesuatu sebagai persembahan. “Mempersembahkan” alami dalam bahasa Indonesia dan tetap mempertahankan daya instruktif bentuk verba ini.
- source_word: רֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Ungkapan tetap dalam bahasa korban ini menggambarkan persembahan sebagai berkenan kepada Allah. Terjemahan ini mempertahankan gambaran aromanya tanpa menambahkan penjelasan teologis yang tidak dinyatakan teks.
- source_word: לַ/יהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan arah atau penerima persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri יהוה. “Yahweh” mempertahankan nama ilahi yang hadir secara langsung dalam sumber tanpa menggantinya dengan gelar.
- issue: Makna רֵיחַ נִיחֹחַ dalam bahasa persembahan
  choice: sebagai aroma yang menyenangkan
  alternative: sebagai aroma yang menenteramkan; sebagai aroma yang harum
  rationale: Pilihan ini menjaga citra indrawi dan gagasan bahwa persembahan itu berkenan, tanpa menentukan secara berlebihan apakah נִיחֹחַ terutama berarti menyenangkan, menenteramkan, atau harum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah ritual “persembahan curahan”, satuan kuno “hin”, citra “aroma”, dan nama “Yahweh” dipertahankan.
