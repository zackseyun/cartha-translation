  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Orang itu harus benar-benar dihukum mati[a]. Seluruh umat harus benar-benar merajamnya dengan batu[b] di luar perkemahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani memakai pengulangan bentuk kata kerja untuk menegaskan vonis ini: “pasti harus dihukum mati.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “merajamnya dengan batu.” Bentuk Ibrani menegaskan perintah yudisial ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. “Lalu” menyatakan urutan secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang secara langsung terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מוֹת יוּמַת
  choice: harus dihukum mati
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kepastian hukuman mati. Bentuk pasif dan daya wajibnya dipertahankan dalam bahasa Indonesia yang alami; unsur penegas dijelaskan dalam catatan kaki.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Nomina definit ini menunjuk kembali kepada pelanggar yang telah disebutkan sebelumnya. “Orang itu” lebih jelas dan alami daripada sekadar “orang tersebut” dalam dialog langsung.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: harus merajam dia dengan batu
  rationale: “Merajam” menyampaikan tindakan penghukuman dengan batu, sementara frasa “dengan batu” mempertahankan pengulangan etimologis dan penekanan ungkapan Ibrani.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu badan. “Seluruh umat” alami bagi pembaca modern dan tetap mempertahankan makna korporatifnya.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Ungkapan ini menyatakan lokasi pelaksanaan hukuman. “Di luar perkemahan” merupakan padanan Indonesia yang tepat dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menyebut nama perjanjian ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama itu tanpa mengubahnya menjadi gelar.
- issue: Kekuatan hukum dalam מוֹת יוּמַת
  choice: harus dihukum mati
  alternative: pasti akan dihukum mati; harus benar-benar dihukum mati
  rationale: Konstruksi Ibrani menegaskan vonis dan kewajiban pelaksanaannya. “Harus dihukum mati” mempertahankan sifat normatif serta bentuk pasif tanpa menambahkan penafsiran tentang pelaksana hukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lugas seperti keputusan hukum dalam narasi, tanpa menghilangkan penegasan teks Ibrani. Istilah “umat” dipilih agar mudah dipahami sekaligus mempertahankan sifat kolektif komunitas Israel.
