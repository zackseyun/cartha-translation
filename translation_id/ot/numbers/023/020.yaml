  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: id
  text: Lihatlah, aku telah menerima tugas[a] untuk memberkati; ia telah memberkati,[b] dan aku tidak dapat membatalkannya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku telah menerima untuk memberkati”; objek dari “menerima” tidak dinyatakan dalam bahasa Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Subjek “ia telah memberkati” tidak disebutkan secara eksplisit dalam bahasa Ibrani; konteks menunjuk kepada Allah.
    reason: alternative_reading
  - marker: c
    text: Atau “mengubahnya kembali,” “membalikkannya,” atau “menariknya kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata seru ini menarik perhatian kepada pernyataan berikutnya. “Lihatlah” alami, jelas, dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: בָרֵךְ לָקָחְתִּי
  choice: aku telah menerima firman untuk memberkati
  rationale: Secara harfiah susunannya mendekati “aku telah menerima untuk memberkati,” dengan objek לָקָחְתִּי tersirat. “Firman” menjelaskan dalam konteks bahwa Bileam menerima suatu ucapan ilahi, tanpa mempersempitnya menjadi “perintah.”
- source_word: וּבֵרֵךְ
  choice: Dia telah memberkati
  rationale: Bentuk perfek orang ketiga tunggal maskulin tidak menyebut subjek secara eksplisit; konteks menunjuk kepada Allah. Pronomina mempertahankan keringkasan teks Ibrani.
- source_word: אֲשִׁיבֶנָּה
  choice: aku tidak dapat membatalkannya
  rationale: Bentuk Hifil dari שוב secara dasar berarti membuat kembali atau berbalik. Dalam konteks, maksudnya ialah menarik kembali, membalikkan, atau meniadakan berkat yang sudah diucapkan; “membatalkannya” paling alami dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat pada וּבֵרֵךְ
  choice: “Dia” dalam teks utama, dengan catatan bahwa konteks menunjuk kepada Allah
  alternative: “Ia telah memberkati” tanpa penjelasan, atau subjek tak tentu seperti “orang telah memberkati”
  rationale: Teks Ibrani hanya menandai orang ketiga tunggal maskulin, sedangkan konteks kuat menunjuk kepada Allah. Kapitalisasi “Dia” membantu pembaca Indonesia mengenali rujukan kontekstual, sementara catatan kaki mengakui bahwa nama Allah tidak tertulis dalam klausa ini.
- issue: Objek tersirat dari לָקָחְתִּי
  choice: “firman” dijadikan eksplisit dengan catatan tekstual
  alternative: 'Terjemahan sangat harfiah: “aku telah menerima untuk memberkati”; atau “aku telah menerima perintah untuk memberkati”'
  rationale: “Firman” sesuai dengan konteks ucapan kenabian dan menghasilkan bahasa Indonesia yang wajar. Catatan kaki mempertahankan kesadaran bahwa objek kata kerja tidak dinyatakan secara eksplisit. “Perintah” dihindari karena lebih khusus daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Urutan klausa dan ketegasan ucapan Bileam dipertahankan. Objek tersirat pada “menerima” dijelaskan secara minimal sebagai “firman,” sedangkan subjek ilahi pada klausa kedua tetap berupa pronomina agar keringkasan bahasa Ibrani tidak hilang.
