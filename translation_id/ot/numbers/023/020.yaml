revisions:
- from: Lihatlah, aku telah menerima firman untuk memberkati; Dia telah memberkati,[a] dan aku tidak dapat membatalkannya.[b]
  to: Lihatlah, aku telah menerima tugas[a] untuk memberkati; ia telah memberkati,[b] dan aku tidak dapat membatalkannya.[c]
  rationale: Revisi mengganti “firman” dengan “tugas” sebagai pelengkap idiomatis yang lebih netral, lalu menambahkan catatan kaki yang secara terbuka menyatakan objek tersirat dalam teks Ibrani. “Dia” diubah menjadi “ia” agar identifikasi Allah tetap merupakan kesimpulan kontekstual yang dijelaskan dalam catatan, bukan unsur yang dipastikan melalui kapitalisasi di teks utama. Makna bahwa berkat yang telah diucapkan tidak dapat dibalikkan tetap dipertahankan.
