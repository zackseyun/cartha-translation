id: NUM.23.19
reference: Numbers 23:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: id
  text: Allah bukan manusia sehingga Ia berdusta, bukan pula anak manusia[a] sehingga Ia berubah pikiran.[b] Apakah Ia telah berfirman, tetapi tidak melakukannya? Atau telah berbicara, tetapi tidak menegakkannya?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Anak manusia'' di sini adalah ungkapan Ibrani yang berarti seorang manusia, bukan gelar mesianik.'
    reason: cultural_note
  - marker: b
    text: Atau 'mengurungkan niat'; secara tradisional, 'menyesal.' Kata kerja Ibrani ini dapat menyatakan perubahan arah atau pengurungan niat. Di sini konteksnya adalah keandalan Allah, bukan pertobatan moral.
    reason: lexical_alternative
  - marker: c
    text: Atau 'menggenapinya' atau 'mengukuhkannya.' Secara harfiah, bahasa Ibraninya berarti 'membuatnya berdiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks ini אֵל menunjuk kepada Allah Israel. 'Allah' merupakan sebutan baku dan alami dalam bahasa Indonesia serta mempertahankan kontras dengan manusia.
- source_word: אִישׁ
  choice: manusia
  rationale: Walaupun אִישׁ dapat berarti 'laki-laki', di sini istilah itu mewakili manusia dalam kontras dengan Allah. 'Manusia' menyampaikan maksud tersebut secara alami tanpa menghilangkan paralelisme dengan 'anak manusia'.
- source_word: וִיכַזֵּב
  choice: sehingga Ia berdusta
  rationale: כזב menyatakan berdusta atau terbukti palsu. 'Berdusta' mempertahankan dimensi moral dan menegaskan keandalan Allah.
- source_word: בֶן אָדָם
  choice: anak manusia
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani dan kesejajaran puitisnya. Dalam konteks ini ungkapan tersebut berarti seorang manusia biasa, bukan gelar mesianik.
- source_word: וְיִתְנֶחָם
  choice: sehingga Ia berubah pikiran
  rationale: Bentuk hitpael dari נחם di sini menunjuk pada perubahan maksud atau tindakan mengurungkan niat. 'Berubah pikiran' jelas dalam bahasa Indonesia modern dan tidak menyiratkan pertobatan moral.
- source_word: הַהוּא אָמַר
  choice: Apakah Ia telah berfirman
  rationale: Secara bentuk dapat dibaca sebagai pernyataan, tetapi bersama klausa berikutnya membentuk pertanyaan retoris. 'Berfirman' wajar bagi perkataan Allah dan tetap membedakannya secara halus dari 'berbicara' pada baris sejajar.
- source_word: יַעֲשֶׂה
  choice: tidak melakukannya
  rationale: עשה berarti melakukan atau bertindak. Sufiks objek tersirat dalam bahasa Indonesia merujuk pada apa yang telah Allah firmankan.
- source_word: וְדִבֶּר
  choice: telah berbicara
  rationale: דבר secara langsung berarti berbicara atau mengucapkan. Pilihan ini mempertahankan kesejajaran dengan 'berfirman' tanpa menambah gagasan yang tidak dinyatakan.
- source_word: יְקִימֶנָּה
  choice: tidak menegakkannya
  rationale: Bentuk hiphil dari קום secara harfiah berarti membuat berdiri, lalu menegakkan, mengukuhkan, atau menggenapi. 'Menegakkannya' mempertahankan citra konkret Ibrani, sedangkan catatan kaki menjelaskan alternatif kontekstual.
theological_decisions:
- issue: Bahasa tentang ketetapan Allah dalam וְיִתְנֶחָם
  choice: berubah pikiran
  alternative: mengurungkan niat; menyesal
  rationale: Ayat ini mengontraskan keandalan Allah dengan ketidakstabilan manusia. Pilihan ini mempertahankan pernyataan teks tanpa mengembangkannya menjadi rumusan filosofis yang lebih luas atau menyiratkan pertobatan moral pada Allah.
- issue: Makna בֶן אָדָם dalam konteks ini
  choice: ungkapan biasa 'anak manusia' yang berarti manusia
  alternative: menerjemahkannya langsung sebagai 'manusia'; membacanya sebagai gelar mesianik
  rationale: Dalam puisi ini frasa tersebut sejajar dengan אִישׁ dan menunjuk kepada manusia biasa. Bentuk harfiahnya dipertahankan, sedangkan catatan menjaganya dari pembacaan sebagai gelar mesianik.
- issue: Daya pertanyaan retoris pada הַהוּא אָמַר ... וְלֹא יַעֲשֶׂה
  choice: diterjemahkan sebagai dua pertanyaan retoris
  alternative: diterjemahkan sebagai pernyataan diikuti pertanyaan
  rationale: Susunan konteks menekankan bahwa apa yang Allah katakan pasti dilakukan. Bentuk tanya alami dalam bahasa Indonesia menyampaikan fungsi retoris itu tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme puitis dipertahankan melalui pasangan 'manusia/anak manusia', 'berfirman/berbicara', serta 'melakukan/menegakkan'. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia.
