  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: id
  text: Sebab tidak ada tenung terhadap Yakub[a], dan tidak ada ramalan gaib terhadap Israel. Pada waktunya akan dikatakan kepada Yakub dan kepada Israel, “Apa yang telah Allah kerjakan!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak ada tenung di kalangan Yakub, dan tidak ada ramalan gaib di kalangan Israel.” Preposisi Ibrani dapat dipahami dengan lebih dari satu cara; konteks mendukung arti “terhadap.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau sebagai pertanyaan: “Apa yang telah Allah kerjakan?”'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: tenung
  rationale: Dalam konteks ini kata benda tersebut menunjuk pada praktik mencari pertanda atau pengetahuan melalui sarana gaib. “Tenung” merupakan padanan Indonesia yang ringkas dan lazim dalam ragam Alkitab, serta dapat dibedakan dari קֶסֶם.
- source_word: קֶסֶם
  choice: ramalan gaib
  rationale: Istilah ini menunjuk pada praktik ramalan melalui sarana okultis. “Ramalan gaib” jelas bagi pembaca modern dan mempertahankan perbedaan ungkapan dengan נַחַשׁ tanpa mengubah keduanya menjadi praktik yang sepenuhnya berbeda.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: terhadap Yakub / terhadap Israel
  rationale: Preposisi ב dapat berarti “di dalam” atau, sesuai konteks ucapan Bileam tentang ketidakberdayaan kutuk dan praktik gaib, “terhadap.” Teks utama memakai arti kontekstual “terhadap,” sementara ambiguitas Ibraninya dipertahankan dalam catatan kaki.
- source_word: כָּעֵת
  choice: pada waktunya
  rationale: Ungkapan ini dapat berarti “sekarang/pada waktu ini” atau menunjuk saat yang tepat. “Pada waktunya” alami dalam bahasa Indonesia dan menyampaikan saat ketika tindakan Allah dinyatakan.
- source_word: יֵאָמֵר
  choice: akan dikatakan
  rationale: Bentuk Nifal imperfek dipertahankan sebagai konstruksi pasif dengan nuansa mendatang.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: kepada Yakub dan kepada Israel
  rationale: Padanan ini mengikuti nilai datif langsung dari ל dan tidak memutuskan bahwa frasa itu harus berarti “tentang” Yakub dan Israel.
- source_word: מַה פָּעַל אֵל
  choice: Lihatlah apa yang telah Allah kerjakan!
  rationale: מַה dapat memperkenalkan seruan tentang kedahsyatan tindakan Allah, sedangkan bentuk perfektif פָּעַל mendukung “telah ... kerjakan.” Penambahan “Lihatlah” membuat fungsi eksklamatifnya jelas dalam bahasa Indonesia tanpa menjadikannya pertanyaan.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל adalah sebutan umum bagi Tuhan. “Allah” merupakan padanan baku dan alami dalam Alkitab bahasa Indonesia tanpa menambahkan gelar yang tidak dinyatakan.
theological_decisions:
- issue: Apakah ayat ini meniadakan praktik gaib di tengah Israel atau daya praktik gaib terhadap Israel
  choice: Teks utama menyatakan bahwa tenung dan ramalan gaib tidak berdaya terhadap Yakub/Israel.
  alternative: Ayat ini menyatakan bahwa tidak ada tenung atau ramalan gaib di dalam Yakub/Israel.
  rationale: Konteks ucapan Bileam menekankan bahwa umat yang diberkati Allah tidak dapat dikutuk atau dimanipulasi melalui praktik gaib. Namun, karena preposisi ב sungguh dapat dibaca secara lokatif, alternatif itu dicatat dan tidak disembunyikan.
- issue: Apakah מַה פָּעַל אֵל merupakan pertanyaan atau seruan
  choice: 'Dipahami sebagai seruan: “Lihatlah apa yang telah Allah kerjakan!”'
  alternative: 'Dipahami sebagai pertanyaan: “Apa yang telah Allah kerjakan?”'
  rationale: Dalam alur syair, klausa ini paling wajar menjadi pernyataan kagum atas tindakan Allah bagi Israel. Bentuk Ibraninya sendiri dapat tampak seperti pertanyaan, sehingga kemungkinan tersebut dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tenung” dipasangkan dengan “ramalan gaib” agar dua istilah Ibrani tetap dibedakan tetapi mudah dipahami. Nama kolektif Yakub dan Israel dipertahankan, dan susunan puitis dibuat ringkas.
