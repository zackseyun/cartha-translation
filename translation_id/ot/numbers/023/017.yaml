    text: 'Atau: para pejabat Moab.'
    reason: Alternatif leksikal untuk שָׂרֵי, yang dapat berarti pemimpin, pembesar, atau pejabat.
  revision_rationale: Revisi mengganti konstruksi yang menambahkan tindakan melihat oleh Balaam dengan penanda perhatian naratif yang setia pada וְהִנּוֹ, menghapus tambahan “masih,” memakai istilah “korban bakaran” yang lazim, dan memulihkan catatan kaki alternatif bagi “para pemimpin Moab.” Makna dan ambiguitas ruang pada עַל tetap dipertahankan dengan “di dekat.”
