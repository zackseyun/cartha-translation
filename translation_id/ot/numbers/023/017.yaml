  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: id
  text: Ia datang kepada Balak, dan tampaklah Balak sedang berdiri di dekat korban bakarannya, bersama para pemimpin Moab[a]. Lalu Balak bertanya kepadanya, “Apa yang telah Yahweh firmankan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: para pejabat Moab.'
    reason: Alternatif leksikal untuk שָׂרֵי, yang dapat berarti pemimpin, pembesar, atau pejabat.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Ia datang kepada Balak
  rationale: בוא berarti ‘datang/masuk’. Nama Balak dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia tanpa menambahkan informasi di luar konteks langsung.
- source_word: וְהִנּוֹ
  choice: dan melihat bahwa Balak masih
  rationale: Partikel הִנֵּה menarik perhatian pada keadaan yang dijumpai. Dalam narasi Indonesia, ‘melihat bahwa’ menyampaikan fungsi deiktisnya secara alami; ‘masih’ menandai keadaan yang sedang berlangsung tanpa menjadikannya seruan arkais seperti ‘sesungguhnya’.
- source_word: נִצָּב
  choice: berdiri
  rationale: Partisipel ini menggambarkan keadaan atau sikap yang sedang berlangsung ketika Bileam tiba.
- source_word: עַל עֹלָתוֹ
  choice: di dekat kurban bakarannya
  rationale: עַל dalam konteks ruang dapat berarti ‘di dekat/di sisi’, sedangkan עֹלָה adalah istilah baku untuk kurban yang dibakar seluruhnya.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: bersama para pemimpin Moab
  rationale: שָׂרִים dapat menunjuk para pemimpin, pembesar, atau pejabat. ‘Para pemimpin’ alami dan cukup luas untuk mempertahankan cakupan istilah Ibrani.
- source_word: וַיֹּאמֶר לוֹ בָּלָק
  choice: Lalu Balak bertanya kepadanya
  rationale: Karena ujaran berikut berbentuk pertanyaan, ‘bertanya’ merupakan padanan naratif alami bagi אמר dalam konteks ini; ‘lalu’ meneruskan urutan wayyiqtol.
- source_word: מַה דִּבֶּר
  choice: Apa yang telah ... firmankan?
  rationale: Perfect דִּבֶּר menanyakan perkataan yang baru disampaikan dan masih relevan. ‘Firmankan’ merupakan verba Indonesia yang wajar untuk ucapan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. ‘Yahweh’ mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Acuan pronomina diperjelas dengan nama Balak agar dua tokoh laki-laki tidak membingungkan. Tidak diperlukan catatan kaki karena alternatif ‘pejabat/pembesar Moab’ tidak mengubah makna pokok ayat.
