revisions:
- from: Ia datang kepada Balak dan melihat bahwa Balak masih berdiri di dekat kurban bakarannya, bersama para pemimpin Moab. Lalu Balak bertanya kepadanya, “Apa yang telah Yahweh firmankan?”
  to: Ia datang kepada Balak, dan tampaklah Balak sedang berdiri di dekat korban bakarannya, bersama para pemimpin Moab[a]. Lalu Balak bertanya kepadanya, “Apa yang telah Yahweh firmankan?”
  rationale: Revisi mengganti konstruksi yang menambahkan tindakan melihat oleh Balaam dengan penanda perhatian naratif yang setia pada וְהִנּוֹ, menghapus tambahan “masih,” memakai istilah “korban bakaran” yang lazim, dan memulihkan catatan kaki alternatif bagi “para pemimpin Moab.” Makna dan ambiguitas ruang pada עַל tetap dipertahankan dengan “di dekat.”
