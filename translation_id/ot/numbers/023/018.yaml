  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר ק֤וּם בָּלָק֙ וּֽ/שֲׁמָ֔ע הַאֲזִ֥ינָ/ה עָדַ֖/י בְּנ֥/וֹ צִפֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: id
  text: 'Lalu ia menyampaikan ucapan puitisnya[a], katanya,


    “Bangkitlah, Balak, dan dengarlah;

    simaklah aku, hai anak Zipor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani מָשָׁל dapat berarti peribahasa, tuturan perumpamaan, atau ucapan resmi yang puitis; di sini kata itu memperkenalkan pernyataan Bileam yang bernada tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: ia menyampaikan ucapan puitisnya
  rationale: Gabungan נָשָׂא dengan מָשָׁל secara idiomatis memperkenalkan suatu tuturan resmi. “Menyampaikan” terdengar alami dalam bahasa Indonesia, sedangkan “ucapan puitis” mempertahankan sifat מָשָׁל sebagai tuturan bernada tinggi tanpa membatasinya hanya sebagai peribahasa atau nubuat.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: Bentuk naratif ini memperkenalkan ujaran langsung. “Katanya” menghindari rangkaian “dan berkata” yang kaku setelah verba penyampaian, sekaligus tetap setia pada fungsinya.
- source_word: קוּם
  choice: Bangkitlah
  rationale: Imperatif ini secara harfiah meminta Balak bangkit. “Bangkitlah” mempertahankan nada khidmat, meskipun konteks tidak memastikan apakah yang dimaksud berdiri secara fisik atau bersiap memberi perhatian.
- source_word: וּשֲׁמָע
  choice: dan dengarlah
  rationale: Pilihan ini mempertahankan arti dasar שׁמע dan paralelismenya dengan perintah berikutnya.
- source_word: הַאֲזִינָה עָדַי
  choice: simaklah aku
  rationale: Hifil אזן menyatakan mendengarkan dengan sungguh-sungguh. “Simaklah aku” menyampaikan peningkatan perhatian sesudah “dengarlah” secara ringkas dan alami.
- source_word: בְּנוֹ צִפֹּר
  choice: hai anak Zipor
  rationale: Sapaan patronimik dipertahankan secara langsung. Partikel “hai” memperjelas bahwa frasa ini merupakan sapaan kepada Balak.
