  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Susunan dua baris mempertahankan paralelisme puitis Ibrani; “dengarlah” dan “simaklah” membedakan kedua verba pendengaran tanpa memakai ungkapan harfiah yang kaku.
