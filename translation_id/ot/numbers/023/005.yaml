id: NUM.23.5
reference: Numbers 23:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: id
  text: Lalu Yahweh menaruh firman dalam mulut Bileam dan berkata, “Kembalilah kepada Balak, dan beginilah harus kaukatakan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: menaruh
  rationale: Kata שׂוּם berarti ‘menaruh, menempatkan’. ‘Menaruh’ mempertahankan gambaran konkret dalam ungkapan Ibrani tentang firman yang ditempatkan dalam mulut seseorang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: דָּבָר
  choice: firman
  rationale: Dalam konteks perkataan yang diberikan Allah untuk disampaikan, דָּבָר wajar diterjemahkan ‘firman’. Bentuk tunggalnya tetap dipertahankan.
- source_word: בְּפִי בִלְעָם
  choice: dalam mulut Bileam
  rationale: Terjemahan ini mempertahankan idiom dan citra harfiah teks Ibrani, yang juga dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: שׁוּב אֶל בָּלָק
  choice: Kembalilah kepada Balak
  rationale: שׁוּב adalah perintah untuk kembali, sedangkan אֶל menunjukkan arah kepada Balak.
- source_word: וְכֹה תְדַבֵּר
  choice: dan beginilah harus kaukatakan
  rationale: כֹה berarti ‘demikian/begini’ dan תְדַבֵּר menyatakan tindakan berbicara yang diperintahkan. Susunan ini alami dalam bahasa Indonesia serta mempertahankan daya perintahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi; transliterasi ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Sumber perkataan Bileam
  choice: Yahweh menaruh firman dalam mulut Bileam
  alternative: Yahweh memberi Bileam suatu pesan
  rationale: Ungkapan konkret teks sumber dipertahankan, sehingga penegasan bahwa perkataan itu berasal dari Yahweh tetap jelas tanpa mengubah metaforanya menjadi penjelasan abstrak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk ‘kaukatakan’ dipakai untuk menyampaikan perintah langsung secara ringkas; idiom ‘menaruh firman dalam mulut’ sengaja dipertahankan karena jelas dan penting bagi citra teks sumber.
