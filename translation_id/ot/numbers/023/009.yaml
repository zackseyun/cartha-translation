source:
  edition: WLC
  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: id
  text: Sebab dari puncak bukit batu aku melihatnya, dan dari perbukitan aku memandangnya. Lihatlah, suatu bangsa yang tinggal tersendiri dan tidak menganggap dirinya termasuk di antara bangsa-bangsa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan tidak diperhitungkan di antara bangsa-bangsa.” Kata kerja Ibrani dapat dipahami secara pasif maupun refleksif/medial.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memperkenalkan penjelasan dalam ucapan Bileam tanpa mempertegas hubungan sebab-akibat secara berlebihan.
- source_word: מֵרֹאשׁ צֻרִים
  choice: dari puncak bukit batu
  rationale: רֹאשׁ dalam konteks topografis berarti puncak, sedangkan צֻרִים menunjuk pada tempat-tempat tinggi berbatu; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran titik pandang.
- source_word: אֶרְאֶנּוּ
  choice: aku melihatnya
  rationale: Bentuk ini adalah orang pertama tunggal dengan objek orang ketiga tunggal maskulin. Akhiran -nya mempertahankan acuan tunggal kolektif kepada Israel tanpa terdengar janggal dalam bahasa Indonesia.
- source_word: וּמִגְּבָעוֹת
  choice: dan dari perbukitan
  rationale: Mengungkapkan bentuk jamak dan menjaga kesejajaran puitis dengan puncak bukit batu.
- source_word: אֲשׁוּרֶנּוּ
  choice: aku memandangnya
  rationale: Kata kerja puitis ini menyiratkan pengamatan yang disengaja; 'memandang' membedakannya dari ראה sambil tetap wajar dan bermartabat.
- source_word: הֶן
  choice: Lihatlah
  rationale: Partikel penunjuk ini menarik perhatian kepada pernyataan berikutnya. 'Lihatlah' jelas, alami, dan mempertahankan daya retorisnya.
- source_word: עָם
  choice: suatu bangsa
  rationale: עָם menunjuk kepada sebuah komunitas etnis-nasional. Dalam konteks kontras dengan bangsa-bangsa lain, 'bangsa' lebih alami daripada 'suatu umat'.
- source_word: לְבָדָד
  choice: tersendiri
  rationale: Menunjukkan keterpisahan atau kekhasan. 'Tersendiri' menghindari kesan kesepian yang dapat melekat pada kata 'sendirian'.
- source_word: יִשְׁכֹּן
  choice: yang tinggal
  rationale: Bentuk imperfek dapat menyatakan keadaan khas atau tindakan masa depan. Klausa relatif Indonesia menyampaikan ciri bangsa itu tanpa memaksakan nuansa waktu yang terlalu sempit.
- source_word: וּבַגּוֹיִם
  choice: di antara bangsa-bangsa lain
  rationale: Menunjukkan bangsa-bangsa selain Israel; penambahan 'lain' memperjelas kontras yang sudah tersirat dalam konteks.
- source_word: לֹא יִתְחַשָּׁב
  choice: tidak menganggap dirinya termasuk
  rationale: Mempertahankan kemungkinan refleksif atau medial dari bentuk Hitpael חשׁב dan menghasilkan ungkapan Indonesia yang alami. Kemungkinan pasif dicatat dalam catatan kaki.
theological_decisions:
- issue: Apakah לֹא יִתְחַשָּׁב harus dipahami secara refleksif/medial atau pasif
  choice: tidak menganggap dirinya termasuk di antara bangsa-bangsa lain
  alternative: tidak diperhitungkan di antara bangsa-bangsa lain
  rationale: Bentuk Hitpael memungkinkan arti refleksif/medial maupun pasif. Teks utama mempertahankan pembacaan refleksif yang masuk akal tanpa menjadikan keterpisahan Israel sebagai klaim superioritas; pembacaan pasif yang juga sah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Diksi 'puncak bukit batu', 'perbukitan', dan 'tersendiri' mempertahankan citra serta kesejajaran teks Ibrani tanpa terdengar kuno.
