base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: id
  text: Lalu Balak membawa Bileam ke Padang Zofim[a], ke puncak Pisga. Ia mendirikan tujuh mezbah dan mempersembahkan seekor sapi jantan dan seekor domba jantan di atas setiap mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Padang Para Pengintai.” Ungkapan Ibrani ini dapat dipahami sebagai nama tempat yang ditransliterasikan “Zofim” atau sebagai sebutan deskriptif.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: Lalu Balak membawa Bileam
  rationale: Bentuk wayyiqtol meneruskan urutan narasi. Nama Balak dan Bileam dinyatakan agar rujukan pronomina Ibrani yang sama-sama maskulin tidak membingungkan dalam bahasa Indonesia.
- source_word: שְׂדֵה צֹפִים
  choice: Padang Zofim
  rationale: Frasa ini kemungkinan berfungsi sebagai nama tempat. Transliterasi 'Zofim' mempertahankan nama Ibrani, sedangkan 'Padang' menerjemahkan שְׂדֵה; kemungkinan makna deskriptif dijelaskan dalam catatan kaki.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: ke puncak Pisga
  rationale: רֹאשׁ dalam konteks geografis berarti 'puncak', dan פִּסְגָּה diperlakukan sebagai nama tempat Pisga.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: Ia mendirikan tujuh mezbah
  rationale: Ungkapan alami dan formal untuk tindakan membangun tempat persembahan; subjek tunggal dipertahankan tanpa memaksakan identitas lebih jauh.
- source_word: וַיַּעַל פָּר וָאַיִל
  choice: dan mempersembahkan seekor sapi jantan dan seekor domba jantan
  rationale: Dalam konteks kurban, עלה berarti mempersembahkan. Istilah hewan diterjemahkan secara umum dan jelas bagi pembaca modern.
- source_word: בַּמִּזְבֵּחַ
  choice: di setiap mezbah
  rationale: 'Walaupun bentuk Ibraninya tunggal, konteks tujuh mezbah dan pola sejajar dalam perikop menunjukkan pengertian distributif: satu pasang hewan pada masing-masing mezbah.'
