base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: id
  text: Lalu Bileam berkata kepada Balak, “Bangunlah tujuh mezbah untukku di sini, dan siapkanlah tujuh ekor sapi jantan serta tujuh ekor domba jantan untukku di sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan gerak maju tersebut secara alami dalam bahasa Indonesia.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל בָּלָק
  choice: kepada Balak
  rationale: Ungkapan pelaporan tuturan yang alami dan tepat dalam bahasa Indonesia.
- source_word: בְּנֵה
  choice: Bangunlah
  rationale: Imperatif dari בנה; bentuk berpartikel -lah terdengar tegas namun tetap wajar dan bermartabat.
- source_word: לִי
  choice: untukku
  rationale: Menandai penerima manfaat atau pihak yang berkepentingan secara langsung.
- source_word: בָּזֶה
  choice: di sini
  rationale: Secara harfiah berarti “di tempat/benda ini”; konteks menunjukkan lokasi, sehingga “di sini” mempertahankan daya tunjuknya secara alami.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: tujuh mezbah
  rationale: Padanan langsung bagi frasa bilangan dan nomina tersebut; “mezbah” adalah istilah Indonesia yang mapan untuk tempat persembahan korban.
- source_word: וְהָכֵן
  choice: dan siapkanlah
  rationale: Imperatif bentuk kausatif dari כון berarti membuat siap; “siapkanlah” tepat untuk hewan-hewan korban.
- source_word: שִׁבְעָה פָרִים
  choice: tujuh ekor sapi jantan
  rationale: פַּר menunjuk sapi jantan dalam konteks korban. Kata penggolong “ekor” membuat frasa bilangan alami dalam bahasa Indonesia tanpa menambah makna substantif.
- source_word: וְשִׁבְעָה אֵילִים
  choice: serta tujuh ekor domba jantan
  rationale: אֵילִים secara khusus adalah domba jantan; “serta” menghubungkan kedua jenis hewan yang sama-sama menjadi objek perintah menyiapkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan בָּזֶה dipertahankan dengan “di sini” pada kedua tempat untuk menjaga penekanan lokasi dalam teks Ibrani. Tidak diperlukan catatan kaki karena ungkapan itu dapat diterjemahkan langsung dan alami.
