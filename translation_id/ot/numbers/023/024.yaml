  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: id
  text: Lihatlah, suatu bangsa bangkit seperti singa betina[a] dan menegakkan diri seperti singa; bangsa itu tidak akan berbaring sampai memakan mangsanya dan meminum darah mereka yang terbunuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “singa.” Kata Ibrani לָבִיא dapat dipakai secara lebih umum untuk singa, tetapi “singa betina” mempertahankan perbedaan leksikal dengan אֲרִי (“singa”) pada bagian berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Lihatlah
  rationale: Kata seru penunjuk ini memperkenalkan pengamatan yang tegas. “Lihatlah” alami, jelas, dan mempertahankan daya retoris teks.
- source_word: עָם
  choice: suatu bangsa
  rationale: Mengacu secara kolektif kepada Israel. “Bangsa” lebih wajar dalam bahasa Indonesia daripada “suatu umat” dalam gambaran puitis dan militer ini.
- source_word: כְּלָבִיא
  choice: seperti singa betina
  rationale: לָבִיא dapat berarti singa secara umum, tetapi dalam puisi dapat merujuk pada singa betina. Pilihan ini mempertahankan kemungkinan perbedaan leksikal dengan אֲרִי pada baris berikutnya.
- source_word: יָקוּם
  choice: bangkit
  rationale: Bentuk imperfek dari קום menggambarkan seekor singa yang bangun dan siap bertindak; “bangkit” ringkas dan sesuai dengan citra tersebut.
- source_word: וְכַאֲרִי
  choice: dan ... seperti singa
  rationale: אֲרִי merupakan sebutan umum untuk singa. Terjemahan ini tidak menambahkan keterangan tentang jenis kelamin, umur, atau ukuran yang tidak dinyatakan teks.
- source_word: יִתְנַשָּׂא
  choice: menegakkan diri
  rationale: Bentuk ini menggambarkan tindakan mengangkat atau meninggikan diri. “Menegakkan diri” alami dalam bahasa Indonesia dan cocok dengan postur hewan yang bangkit dengan gagah.
- source_word: לֹא יִשְׁכַּב
  choice: tidak akan berbaring
  rationale: Mempertahankan citra konkret singa yang tidak kembali berbaring; bentuk akan sesuai dengan alur profetis-puitis kalimat.
- source_word: עַד יֹאכַל טֶרֶף
  choice: sebelum memakan mangsanya
  rationale: יֹאכַל secara langsung berarti “memakan,” sedangkan טֶרֶף adalah mangsa. Pilihan ini mempertahankan kekuatan gambaran tanpa memperhebat verba menjadi “melahap.”
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: dan meminum darah mereka yang terbunuh
  rationale: חֲלָלִים dalam konteks kekerasan atau perang lazim menunjuk kepada orang-orang yang terbunuh. Ungkapan yang tajam ini dipertahankan sebagaimana adanya.
theological_decisions:
- issue: Gambaran kekerasan dalam nubuat Bileam
  choice: Mempertahankan gambaran pemangsa, mangsa, dan tindakan meminum darah sebagai bahasa puitis tentang kemenangan militer dan kekuatan yang tidak terbendung.
  alternative: Melunakkan gambaran itu menjadi bahasa umum tentang kemenangan.
  rationale: Bahasa Ibrani sengaja memakai citra yang keras. Menerjemahkannya secara langsung menjaga ketegangan teks tanpa mengubahnya menjadi perintah untuk benar-benar meminum darah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan “bangsa itu” dipakai agar acuan kata kerja tunggal kolektif dalam bahasa Ibrani tetap jelas dalam bahasa Indonesia.
