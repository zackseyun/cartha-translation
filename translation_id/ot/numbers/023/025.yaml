  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם גַּם קֹ֖ב לֹ֣א תִקֳּבֶ֑/נּוּ גַּם בָּרֵ֖ךְ לֹ֥א תְבָרֲכֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: id
  text: Lalu Balak berkata kepada Bileam, “Jangan sekali-kali mengutuk dia, dan jangan sekali-kali memberkati dia!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, susunan Ibraninya berbunyi, “mengutuk, jangan kautuk dia ... memberkati, jangan kauberkati dia.” Dalam setiap klausa, infinitif absolut diikuti verba finit untuk memberi penegasan kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif wayyiqtol melanjutkan rangkaian peristiwa; “Lalu” menyampaikan alur itu secara wajar dalam bahasa Indonesia modern.
- source_word: בָּלָק
  choice: Balak
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶל בִּלְעָם
  choice: kepada Bileam
  rationale: Preposisi אֶל menunjukkan pihak yang dituju oleh perkataan; “kepada” merupakan padanan Indonesia yang alami. Nama בִּלְעָם memakai bentuk Indonesia yang lazim, “Bileam”.
- source_word: גַּם ... גַּם
  choice: '... dan ...'
  rationale: Dalam dua larangan sejajar, kedua kemunculan גַּם menghubungkan kedua tindakan yang sama-sama dilarang. Pengulangan “jangan sekali-kali” pada tiap klausa menyampaikan hubungan dan tekanannya secara alami.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: Jangan sekali-kali mengutuk dia
  rationale: Infinitif absolut yang diikuti verba finit dari akar yang sama memberi penegasan kuat. “Jangan sekali-kali” mempertahankan larangan tegas tersebut, sedangkan “dia” mewakili sufiks objek maskulin tunggal tanpa menentukan lebih jauh acuannya.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: jangan sekali-kali memberkati dia
  rationale: Susunan infinitif absolut dan verba finit kembali memberi penegasan kuat dan sejajar dengan klausa pertama. Pengulangan “jangan sekali-kali” mempertahankan keseimbangan retoris teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “jangan sekali-kali” dipilih untuk menyampaikan penegasan ganda dalam bahasa Ibrani tanpa menghasilkan pengulangan yang janggal. Penanda catatan kaki ditempatkan sesudah seluruh ucapan karena menerangkan kedua klausa sejajar.
