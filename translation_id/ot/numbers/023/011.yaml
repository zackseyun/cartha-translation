  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: id
  text: Lalu Balak berkata kepada Bileam, “Apa yang telah kaulakukan kepadaku? Aku membawamu untuk mengutuk musuh-musuhku, tetapi lihatlah, engkau malah benar-benar memberkati mereka!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “engkau sungguh-sungguh telah memberkati”; bahasa Ibrani memakai kata kerja finit bersama infinitif absolut untuk memberikan penekanan.
    reason: Menjelaskan konstruksi penegasan Ibrani בֵּרַכְתָּ בָרֵךְ dan mempertahankan kemungkinan padanan yang lebih harfiah.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: מֶה עָשִׂיתָ לִי
  choice: Apa yang telah kaulakukan kepadaku?
  rationale: Terjemahan langsung dan wajar dari pertanyaan yang mengungkapkan keterkejutan Balak atas tindakan yang baru terjadi dan masih berdampak.
- source_word: לָקֹב
  choice: untuk mengutuk
  rationale: Dalam konteks ini, קבב berarti mengucapkan kutuk terhadap seseorang; “mengutuk” adalah padanan Indonesia yang jelas dan lazim.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Mempertahankan bentuk jamak dan akhiran posesif orang pertama dari teks Ibrani.
- source_word: לְקַחְתִּיךָ
  choice: Aku membawamu
  rationale: לקח secara dasar berarti “mengambil”; dalam konteks Balak membawa Bileam ke tempat untuk mengutuk Israel, “membawamu” lebih alami dalam bahasa Indonesia tanpa menambahkan gagasan bahwa ia secara khusus menyewanya.
- source_word: וְהִנֵּה
  choice: tetapi lihatlah
  rationale: “Lihatlah” mempertahankan daya penunjuk dan keterkejutan הִנֵּה, sedangkan “tetapi” menyatakan kontras yang jelas dalam konteks.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: engkau malah benar-benar memberkati mereka
  rationale: Kata kerja finit yang disertai infinitif absolut menegaskan tindakan memberkati. “Benar-benar” menyampaikan penekanan itu, dan “malah” menonjolkan hasil yang berlawanan dengan maksud Balak. Objek “mereka” disediakan dari konteks karena tersirat dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Nama “Bileam” mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Bentuk “kaulakukan” dan “musuh-musuhku” mengikuti ejaan baku; “lihatlah” mempertahankan seruan tanpa memakai diksi arkais.
