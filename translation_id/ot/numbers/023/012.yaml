  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: id
  text: Ia menjawab, “Bukankah aku harus dengan cermat menyampaikan apa yang Yahweh menaruh dalam mulutku?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Bukankah aku harus menjaga untuk mengatakan apa yang Yahweh taruh dalam mulutku?” Kata kerja Ibrani ini dapat menekankan kepatuhan yang cermat dalam menyampaikan perkataan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: Ia menjawab
  rationale: Pasangan verba Ibrani harfiah berarti ‘ia menjawab dan berkata’. Dalam bahasa Indonesia modern, ‘ia menjawab’ sudah secara alami memperkenalkan ucapan langsung tanpa kehilangan fungsi naratifnya.
- source_word: הֲלֹא
  choice: Bukankah aku harus
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan. ‘Bukankah aku harus’ menyampaikan kewajiban yang dirasakan Bileam dalam konteks ini.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: apa yang
  rationale: Konstruksi objek-relatif dengan pronomina objek yang diulang paling alami dinyatakan sebagai ‘apa yang’ dalam bahasa Indonesia; pronomina ulang tidak perlu ditampilkan secara terpisah.
- source_word: יָשִׂים
  choice: taruh
  rationale: Verba שׂים dalam ungkapan ‘dalam mulut’ menunjuk pada pemberian kata-kata untuk diucapkan. ‘Taruh’ mempertahankan gambaran sumber dan tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: בְּפִי
  choice: dalam mulutku
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani mengenai perkataan yang diberikan Allah dan tetap jelas dalam bahasa Indonesia.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: harus mengatakan
  rationale: Dalam pertanyaan retoris ini, שׁמר dengan infinitif menyatakan kewajiban untuk berpegang dengan saksama pada perkataan yang diberikan. Teks utama dibuat ringkas dan alami, sementara nuansa ‘menjaga/memperhatikan dengan cermat’ dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama YHWH secara langsung. ‘Yahweh’ mempertahankan nama ilahi, sedangkan ‘TUHAN’ merupakan penggantian dengan gelar.
- issue: Tingkat keterikatan Bileam pada perkataan yang diberikan
  choice: Bukankah aku harus mengatakan apa yang Yahweh taruh dalam mulutku?
  alternative: Bukankah aku harus dengan saksama mengatakan apa yang Yahweh taruh dalam mulutku?
  rationale: Pertanyaan retoris menyampaikan kewajiban, sedangkan אֶשְׁמֹר dapat menambahkan nuansa menjaga atau menaati dengan cermat. Teks utama tidak melebih-lebihkan gagasan pendiktean mekanis; nuansa leksikal tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Redundansi formula naratif Ibrani ‘menjawab dan berkata’ dipadatkan menjadi ‘menjawab’. Ungkapan ‘dalam mulutku’ dipertahankan untuk menjaga citra teks sumber.
