  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: id
  text: Siapa dapat menghitung debu Yakub, atau membilang bagian keempat Israel?[a] Kiranya jiwaku mengalami kematian seperti orang-orang yang hidup lurus,[b] dan kiranya kesudahanku seperti kesudahannya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat dipahami sebagai “keempat penjuru Israel”, atau, secara lebih tafsiran, “bahkan seperempat dari Israel”.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang benar”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “seperti dia”. Bentuk Ibraninya tunggal dan mungkin menunjuk kepada seorang yang mewakili kelompok orang-orang yang hidup lurus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: Siapa dapat menghitung
  rationale: Kata tanya מִי membuka pertanyaan retoris, sedangkan מָנָה berarti menghitung atau membilang. Kata “dapat” menyatakan ketidakmungkinan yang tersirat dalam konteks tanpa mengubah daya retorisnya.
- source_word: עֲפַר יַעֲקֹב
  choice: debu Yakub
  rationale: Metafora “debu” dipertahankan karena menggemakan gambaran keturunan yang tak terhitung banyaknya; “Yakub” juga dipertahankan dalam paralelisme puitis dengan “Israel”.
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: atau membilang seperempat bagian Israel
  rationale: Bentuk nominal מִסְפָּר diungkapkan secara verbal agar paralel dengan “menghitung”. רֹבַע paling langsung berarti seperempat atau bagian keempat; terjemahan ini mempertahankan ketidakpastian ungkapan Ibrani dan tidak menggantinya dengan tafsiran “banyaknya”.
- source_word: תָּמֹת נַפְשִׁי
  choice: Kiranya jiwaku mati
  rationale: Bentuk permohonan atau harapan dinyatakan dengan “kiranya”, sementara נַפְשִׁי sebagai subjek dipertahankan menjadi “jiwaku” demi citra puitis teks.
- source_word: מוֹת יְשָׁרִים
  choice: seperti matinya orang-orang yang hidup lurus
  rationale: Ungkapan Ibrani harfiah “mati kematian orang-orang lurus” dibuat wajar dalam bahasa Indonesia dengan “seperti matinya”. יְשָׁרִים menunjuk orang-orang yang lurus secara moral; “yang hidup lurus” lebih alami dan tidak membatasi maknanya pada kejujuran verbal.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: dan kiranya akhir hidupku
  rationale: אַחֲרִית dapat berarti akhir, kesudahan, atau hasil akhirnya. “Akhir hidupku” sesuai dengan paralelnya, yaitu kematian, serta jelas bagi pembaca modern.
- source_word: כָּמֹהוּ
  choice: seperti akhir hidupnya
  rationale: Pronomina sufiks Ibrani berbentuk maskulin tunggal. Bentuk “-nya” menghasilkan bahasa Indonesia yang alami, sementara catatan kaki menjelaskan bentuk tunggal yang dapat menunjuk seorang wakil dari kelompok orang-orang yang hidup lurus.
theological_decisions:
- issue: Makna יְשָׁרִים
  choice: orang-orang yang hidup lurus
  alternative: orang-orang benar
  rationale: Pilihan ini mempertahankan makna dasar ישר, yakni lurus atau berintegritas, tanpa secara tidak perlu memasukkan kategori teologis-forensik yang mungkin diasosiasikan dengan istilah “orang benar”.
- issue: Penafsiran רֹבַע יִשְׂרָאֵל
  choice: seperempat bagian Israel
  alternative: banyaknya Israel; kelompok-kelompok Israel; bahkan seperempat dari Israel
  rationale: Terjemahan yang lebih formal mempertahankan gambaran dan ketidakjelasan ungkapan Ibrani. Kemungkinan bahwa bahkan seperempat Israel pun tidak terbilang dicantumkan dalam catatan, bukan dimasukkan sebagai kepastian ke dalam teks.
- issue: Rujukan sufiks tunggal כָּמֹהוּ
  choice: akhir hidupnya, dengan penjelasan bentuk tunggal dalam catatan
  alternative: akhir hidup mereka
  rationale: Bentuk tunggal sumber dipertahankan dan tidak diam-diam diubah menjadi jamak, meskipun antesedennya adalah kelompok “orang-orang yang hidup lurus”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan pertanyaan retoris serta metafora “debu Yakub” dipertahankan. Ungkapan kematian dibuat cukup alami bagi pembaca umum tanpa menghilangkan “jiwaku” dari teks sumber.
