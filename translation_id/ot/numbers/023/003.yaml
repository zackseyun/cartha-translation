  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: id
  text: Lalu Bileam berkata kepada Balak, “Berdirilah di samping kurban bakaranmu, dan aku akan pergi. Mungkin Yahweh akan datang menemuiku. Apa pun yang diperlihatkan-Nya kepadaku akan kuberitahukan kepadamu.” Lalu Bileam pergi ke tempat tinggi yang gundul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat tinggi yang tandus” atau “bukit yang gundul.” Kata Ibrani yang langka ini tampaknya menunjuk pada tempat tinggi yang terbuka dan gundul.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Berdirilah di samping kurban bakaranmu
  rationale: Bentuk imperatif hitpael menyuruh Balak mengambil posisi, sedangkan עַל dalam konteks ini menunjukkan posisi di dekat kurban, bukan berdiri di atasnya. 'Kurban bakaran' menerjemahkan עֹלָה secara khusus.
- source_word: וְאֵלְכָה
  choice: sementara aku pergi
  rationale: Bentuk kohortatif menyatakan tindakan yang hendak dilakukan Bileam. Dalam hubungan dengan perintah sebelumnya, 'sementara aku pergi' terdengar alami dan tetap menyampaikan maksudnya untuk pergi.
- source_word: אוּלַי
  choice: Mungkin
  rationale: Mempertahankan unsur kemungkinan dan ketidakpastian dalam ucapan Bileam.
- source_word: יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: Yahweh akan menjumpai aku
  rationale: Nifal קרה dengan לִקְרָאתִי menunjuk pada terjadinya suatu perjumpaan. 'Menjumpai aku' alami dalam bahasa Indonesia, sedangkan 'mungkin' mempertahankan ketidakpastian tanpa memberi kesan bahwa perjumpaan ilahi terjadi secara kebetulan semata.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: Apa pun yang diperlihatkan-Nya kepadaku
  rationale: Ungkapan Ibrani yang padat ini menyatakan isi penyataan. Bentuk hifil ראה berarti 'memperlihatkan'; terjemahan ini mempertahankan makna tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: akan kuberitahukan kepadamu
  rationale: Hifil נגד berarti memberitahukan, menyatakan, atau melaporkan. Pilihan ini jelas dan sesuai dengan konteks.
- source_word: שֶׁפִי
  choice: tempat tinggi yang gundul
  rationale: Istilah langka ini kemungkinan menunjuk pada tempat tinggi atau bukit yang terbuka, tandus, atau tidak ditumbuhi pepohonan. Terjemahan ini mempertahankan unsur topografis tanpa menjadikannya istilah teknis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi יהוה. 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar, dan tidak memasukkan penafsiran denominasi tertentu.
- issue: Sifat perjumpaan Yahweh dengan Bileam
  choice: Mungkin Yahweh akan menjumpai aku
  alternative: Mungkin Yahweh akan datang menemuiku; mungkin Yahweh kebetulan menjumpai aku
  rationale: '''Mungkin'' menjaga ketidakpastian yang diucapkan Bileam. Kata kerja קרה dapat menyiratkan suatu perjumpaan yang terjadi, tetapi terjemahan tidak menambahkan gagasan bahwa Yahweh bertindak secara acak ataupun bahwa Ia pasti berkenan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Bileam' dan 'Balak' mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Pronomina yang merujuk kepada Yahweh ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia, tanpa menambah unsur yang tidak terdapat dalam teks.
