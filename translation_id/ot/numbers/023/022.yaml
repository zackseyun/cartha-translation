  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: id
  text: Allah membawa mereka keluar dari Mesir; ia[c] mempunyai tanduk seperti tanduk lembu liar[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia memiliki kekuatan seperti lembu liar.” Ungkapan Ibraninya sulit; terjemahan utama mempertahankan kemungkinan citra tanduk alih-alih mengubahnya menjadi sifat abstrak.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini kemungkinan menunjuk pada aurochs, sejenis lembu liar besar yang kini telah punah. Dalam terjemahan tradisional, istilah ini pernah diterjemahkan “unikorn”.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani beralih dari “mereka” dalam klausa pertama ke bentuk tunggal “ia” dalam klausa kedua. Rujukan bentuk tunggal ini tidak pasti; mungkin Israel dipandang sebagai satu kesatuan. Terjemahan mempertahankan peralihan tersebut.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks nubuat Bileam, אֵל berfungsi sebagai subjek dan paling wajar diterjemahkan dengan sebutan umum bagi Sang Ilahi, yaitu “Allah”, tanpa menambahkan nuansa “Mahakuasa” yang tidak dinyatakan secara eksplisit.
- source_word: מוֹצִיאָם
  choice: membawa mereka keluar
  rationale: Partisipel Hifil dari יצא dengan sufiks orang ketiga jamak menggambarkan Allah sebagai pihak yang membawa mereka keluar. Bentuk kini mempertahankan daya hidup puitisnya sekaligus menunjuk pada peristiwa keluaran.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Dengan verba “membawa ... keluar”, bahasa Indonesia cukup memakai “dari Mesir”; makna gerak keluar sudah dinyatakan oleh verba.
- source_word: כְּתוֹעֲפֹת
  choice: memiliki tanduk-tanduk seperti
  rationale: Kata תּוֹעֲפֹת sulit ditafsirkan dan dapat menunjuk pada tanduk-tanduk yang menjulang atau, secara kiasan, kekuatan. Terjemahan ini mempertahankan citra konkret binatang dan unsur perbandingan כְּ, sedangkan alternatif abstraknya dicatat dalam catatan kaki.
- source_word: רְאֵם
  choice: lembu liar
  rationale: רְאֵם kemungkinan menunjuk pada bovina liar yang kuat, sering diidentifikasi sebagai aurochs, bukan makhluk mitologis bertanduk satu. “Lembu liar” mudah dipahami pembaca Indonesia modern.
- source_word: לוֹ
  choice: dia memiliki
  rationale: Sufiks לוֹ berbentuk orang ketiga tunggal maskulin. Ungkapan kepunyaan yang alami dalam bahasa Indonesia mempertahankan bentuk tunggal “dia”, tanpa menyamakan diam-diam rujukannya dengan “mereka” pada klausa sebelumnya.
theological_decisions:
- issue: Citra רְאֵם
  choice: lembu liar
  alternative: aurochs; unikorn
  rationale: Ayat ini memakai citra daya dan tanduk bovina liar, bukan menyatakan keberadaan makhluk mitologis. “Lembu liar” sesuai dengan bukti leksikal dan tetap mudah dipahami.
- issue: Makna תּוֹעֲפֹת
  choice: tanduk-tanduk
  alternative: kekuatan
  rationale: Bahasa Ibrani sulit dan memungkinkan pengertian daya atau keperkasaan, tetapi konteks רְאֵם mendukung dipertahankannya citra tanduk. Alternatif abstrak dicatat tanpa meniadakan ketidakpastian.
- issue: Peralihan dari bentuk jamak ke tunggal
  choice: mereka ... dia
  alternative: mereka ... mereka; Israel sebagai satu kesatuan
  rationale: Teks Masoret memakai sufiks jamak pada מוֹצִיאָם dan sufiks tunggal pada לוֹ. Terjemahan mempertahankan ketegangan gramatikal itu dan tidak memaksakan satu identifikasi rujukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur dua klausa dipertahankan; istilah teknis “aurochs” hanya muncul dalam catatan kaki. Kata ganti “dia” ditulis tanpa huruf kapital agar rujukannya tidak diputuskan secara sepihak sebagai Allah.
