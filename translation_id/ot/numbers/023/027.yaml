source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: id
  text: Lalu Balak berkata kepada Bileam, “Mari, biarlah aku membawamu ke tempat lain. Mungkin hal itu akan berkenan di mata Allah, dan kutuklah bangsa itu bagiku dari sana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Mari
  rationale: Imperatif הלך dengan partikel נָא berfungsi sebagai ajakan atau permohonan yang diperhalus. “Mari” menyampaikan undangan itu secara alami dalam bahasa Indonesia.
- source_word: אֶקָּחֲךָ
  choice: izinkan aku membawamu
  rationale: Bentuk imperfek orang pertama ini bernuansa kehendak setelah ajakan; pilihan ini mempertahankan maksud “biarlah aku membawa engkau” dalam bahasa Indonesia yang wajar.
- source_word: מָקוֹם אַחֵר
  choice: tempat lain
  rationale: Padanan langsung dan alami yang mempertahankan gagasan tentang lokasi atau sudut pandang yang berbeda.
- source_word: אוּלַי
  choice: Mungkin
  rationale: Menandai harapan Balak tanpa menyiratkan kepastian.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: hal itu akan dipandang baik oleh Allah
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan apa yang benar atau menyenangkan “di mata” seseorang. Padanan ini alami dalam bahasa Indonesia dan tetap mempertahankan ketidakjelasan subjek tersirat sebagai “hal itu,” yaitu rencana mengutuk dari tempat lain.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi, sebutan ini merujuk kepada Allah yang berhubungan dengan Bileam, bukan kepada suatu dewa yang tidak tertentu.
- source_word: וְקַבֹּתוֹ לִי
  choice: sehingga engkau dapat mengutuk bangsa itu bagiku
  rationale: Bentuk ini melanjutkan tujuan permintaan Balak. Sufiks tunggal merujuk secara kolektif kepada Israel; “bangsa itu” membuat rujukannya jelas tanpa mengubah makna kolektif.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Mempertahankan makna spasial yang terkait dengan tempat baru tersebut.
theological_decisions:
- issue: Rujukan הָאֱלֹהִים dalam ucapan Balak
  choice: Allah
  alternative: dewa itu; suatu dewa
  rationale: Konteks langsung menunjukkan bahwa Balak sedang berbicara tentang Allah yang membatasi ucapan Bileam. “Allah” menyampaikan rujukan naratif ini tanpa memasukkan asumsi politeistis.
- issue: Hubungan sintaksis וְקַבֹּתוֹ dengan klausa sebelumnya
  choice: sehingga engkau dapat mengutuk bangsa itu bagiku
  alternative: dan kutuklah bangsa itu bagiku; lalu engkau akan mengutuknya bagiku
  rationale: Dalam konteks, pengutukan merupakan hasil yang Balak harapkan jika tindakan itu dipandang baik oleh Allah. Pilihan ini menyampaikan hubungan tujuan/hasil tanpa menjadikannya kepastian ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mari” serta “izinkan aku” menjaga nada permohonan Balak. “Bangsa itu” dipakai untuk menyampaikan objek tunggal kolektif yang merujuk kepada Israel.
