base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: id
  text: 'Lalu ia menyampaikan ucapan puitisnya[a] dan berkata:


    “Balak, raja Moab, telah menuntun aku dari Aram,


    dari pegunungan di sebelah timur[b]:


    ‘Datanglah, kutuklah Yakub bagiku;


    datanglah, kecamlah[c] Israel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia mengangkat mashal-nya.” Kata Ibrani mashal di sini menunjuk pada tuturan resmi berbentuk puisi; dalam konteks lain kata itu juga dapat berarti amsal atau perumpamaan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dari pegunungan timur.” Ungkapan Ibrani ini kemungkinan menunjuk secara geografis kepada daerah di sebelah timur Moab.
    reason: lexical_alternative
  - marker: c
    text: Kata kerja Ibrani ini berbeda dari kata “kutuklah” pada baris sebelumnya. Kata ini dapat menyatakan kecaman atau murka yang bersifat memusuhi, bahkan mengandung imbauan kutuk; “kecamlah” dipakai untuk mempertahankan perbedaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: ia mengucapkan syairnya
  rationale: Ungkapan Ibrani ini memperkenalkan suatu tuturan resmi yang berbentuk puisi. “Mengucapkan syairnya” terdengar alami dalam bahasa Indonesia dan mempertahankan bentuk puitisnya tanpa mempersempit makna menjadi amsal atau secara berlebihan menetapkannya sebagai nubuat.
- source_word: מִן אֲרָם
  choice: Dari Aram
  rationale: Aram dipertahankan sebagai nama tempat, bukan diganti dengan nama geopolitik yang lebih kemudian seperti Siria.
- source_word: יַנְחֵנִי
  choice: menuntun aku
  rationale: Bentuk kausatif dari נחה menyatakan tindakan memimpin atau menuntun. Pilihan ini mempertahankan gambaran gerak yang diarahkan, meski dalam konteksnya juga dapat dipahami sebagai membawa atau mendatangkan.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: dari pegunungan di sebelah timur
  rationale: קדם dipahami secara geografis sebagai timur, selaras dengan Aram sebagai daerah asal Bileam. Ungkapan ini tetap memungkinkan acuan kepada kawasan pegunungan yang terletak di timur.
- source_word: לְכָה
  choice: Datanglah
  rationale: Imperatif ini berfungsi sebagai ajakan atau desakan dalam perkataan langsung dan paling wajar diterjemahkan “Datanglah”.
- source_word: אָרָה
  choice: kutuklah
  rationale: Kata kerja ini secara langsung berarti mengutuk; padanan sederhana ini akurat dan lazim.
- source_word: לִּי
  choice: demi aku
  rationale: Datif ini menandai kepentingan Balak dalam tindakan yang dimintanya. “Demi aku” menyampaikan bahwa kutukan itu diminta untuk kepentingan Balak.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi sekaligus nama kolektif ini dipertahankan dengan bentuk baku bahasa Indonesia.
- source_word: זֹעֲמָה
  choice: laknatilah
  rationale: Kata kerja kedua berbeda dari אָרָה dan mengandung nuansa menyatakan murka atau kecaman yang bersifat mengutuk. “Laknatilah” mempertahankan daya imprekatoris sekaligus membedakannya dari “kutuklah”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama pribadi sekaligus nama kolektif ini dipertahankan dengan bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Hubungan Yakub dan Israel dalam permintaan Balak yang dikutip Bileam
  choice: Kedua nama dipertahankan secara terpisah sebagai sebutan paralel bagi umat yang sama.
  alternative: Melebur keduanya menjadi satu istilah kolektif, misalnya “orang Israel”.
  rationale: Teks Ibrani sengaja memasangkan “Yakub” dan “Israel” dalam paralelisme puitis. Mempertahankan keduanya menjaga gema sastra dan perjanjian tanpa menambahkan tafsiran doktrinal.
translation_notes:
  register: Bahasa yang digunakan modern, khidmat, dan mudah dipahami. Susunan baris mempertahankan paralelisme puisi Ibrani. “Syair” dipilih untuk tuturan puitis formal, sedangkan “kutuklah” dan “laknatilah” dibedakan agar dua kata kerja Ibrani tidak dilebur.
