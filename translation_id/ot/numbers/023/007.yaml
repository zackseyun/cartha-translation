  source_fidelity: Revisi diperlukan terutama untuk memperjelas hubungan sintaktis bahwa Balaklah yang telah menuntun Bileam dari Aram. Draf berbunyi “Dari Aram, Balak ... menuntun aku,” yang dapat terbaca janggal dalam bahasa Indonesia dan tidak menyatakan aspek hasil tindakan secara jelas. Datif לִי lebih tepat diterjemahkan “bagiku” atau “untukku” daripada “demi aku,” yang dapat membawa nuansa sumpah atau seruan yang tidak ada dalam teks.
  naturalness: Susunan puitis dan register khidmat dipertahankan. “Lalu ia menyampaikan ucapan puitisnya” alami dalam bahasa Indonesia modern dan cukup luas untuk מָשָׁל tanpa memaksakan arti “nubuat” atau mempersempitnya menjadi “syair.”
  terminology: Aram, Balak, Moab, Yakub, dan Israel dipertahankan. “Kecamlah” membedakan זֹעֲמָה dari “kutuklah” (אָרָה), dengan catatan kaki yang menjaga nuansa kecaman bermusuhan/imbauan kutuk. Kedua nama paralel Yakub dan Israel tetap terpelihara.
