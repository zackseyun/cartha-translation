    rationale: זעם adalah verba berbeda yang berkaitan dengan mengecam atau menyatakan murka. “Kecamlah,” dengan penjelasan catatan kaki tentang daya bermusuhan/imbauan kutuk, mempertahankan pembedaan tanpa memakai istilah yang tidak lazim.
