  - severity: low
    issue: “Demi aku” bukan padanan paling aman bagi לִי.
    rationale: 'Datif tersebut menyatakan kepentingan Balak: kutuk itu diminta baginya. “Bagiku” menyampaikan fungsi ini tanpa kemungkinan konotasi sumpah.'
  - severity: low
