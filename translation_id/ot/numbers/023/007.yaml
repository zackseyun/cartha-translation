revisions:
- from: 'Kemudian ia mengucapkan syairnya[a], katanya:


    “Dari Aram, Balak, raja Moab, menuntun aku,

    dari pegunungan di sebelah timur[b]:

    ‘Datanglah, kutuklah Yakub demi aku;

    datanglah, laknatilah[c] Israel.’”'
  to: 'Lalu ia menyampaikan ucapan puitisnya[a] dan berkata:


    “Balak, raja Moab, telah menuntun aku dari Aram,


    dari pegunungan di sebelah timur[b]:


    ‘Datanglah, kutuklah Yakub bagiku;


    datanglah, kecamlah[c] Israel.’”'
  rationale: Revisi menata ulang klausa pertama agar Balak menjadi subjek yang jelas bagi tindakan membawa/menuntun Bileam dari Aram, serta memakai “telah menuntun” untuk menyampaikan tindakan yang sudah terjadi dalam konteks ujaran puitis. “Bagiku” menggantikan “demi aku” sebagai padanan datif yang lebih tepat. “Ucapan puitis” dan “kecamlah” mempertahankan bentuk formal-puitis מָשָׁל dan perbedaan antara dua verba bermusuhan tanpa mengimpor penafsiran doktrinal.
