  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: id
  text: Lalu Balak membawa Bileam ke puncak Peor, yang menghadap ke arah Yesimon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanah tandus” atau “padang gurun.” Kata Ibrani Yesimon dapat dipahami sebagai nama tempat atau sebagai sebutan deskriptif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu ... membawa
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam konteks memindahkan seseorang ke suatu tempat, 'membawa' lebih alami daripada 'mengambil' dalam bahasa Indonesia.
- source_word: בָּלָק
  choice: Balak
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶת בִּלְעָם
  choice: Bileam
  rationale: Penanda objek langsung tidak diterjemahkan; nama orang memakai bentuk yang lazim dalam tradisi bahasa Indonesia.
- source_word: רֹאשׁ
  choice: puncak
  rationale: Dalam konteks topografi, kata ini menunjuk bagian tertinggi suatu ketinggian; 'puncak' alami dan tepat.
- source_word: הַפְּעוֹר
  choice: Peor
  rationale: Dipahami sebagai nama tempat; artikel Ibrani tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: הַנִּשְׁקָף
  choice: yang menghadap ke
  rationale: Partisipel Nifal ini menggambarkan lokasi tinggi yang memandang atau terbuka ke arah suatu kawasan. 'Menghadap ke' mempertahankan relasi geografis tanpa berlebihan menyiratkan pandangan ke bawah.
- source_word: עַל פְּנֵי
  choice: ke bentangan
  rationale: Ungkapan harfiah 'atas permukaan/wajah' diungkapkan secara alami sebagai pandangan menuju bentangan kawasan tersebut, sambil mempertahankan citra geografis.
- source_word: הַיְשִׁימֹן
  choice: Yesimon
  rationale: Bentuk berartikel ini dapat dipahami sebagai nama kawasan tertentu atau sebagai sebutan bagi tanah tandus. Teks utama mempertahankan kemungkinan nama tempat, sedangkan catatan memberi arti deskriptifnya.
