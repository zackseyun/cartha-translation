  - severity: low
    issue: Frasa 'bentangan Yesimon' kurang jelas dan kurang idiomatis.
    rationale: Konstruksi ini kurang lazim untuk nama kawasan dan mengaburkan fungsi Yesimon. 'Ke arah Yesimon' menyampaikan relasi geografis secara alami tanpa memutuskan apakah Yesimon nama tempat.
