  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: id
  text: Lalu Yahweh menemui Bileam[a] dan menaruh perkataan ke dalam mulutnya, lalu berfirman, “Kembalilah kepada Balak, dan berbicaralah demikian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “datang kepada Bileam” atau “berjumpa dengan Bileam.”'
    reason: Alternatif leksikal untuk וַיִּקָּר; konteksnya menyatakan perjumpaan tanpa menentukan bentuk penampakan atau pengalaman tersebut.
lexical_decisions:
- source_word: וַיִּקָּר
  choice: menjumpai
  rationale: Bentuk dari קָרָה menyatakan perjumpaan atau pertemuan. 'Menjumpai' alami dalam bahasa Indonesia dan mempertahankan gagasan perjumpaan langsung tanpa menafsirkannya sebagai penampakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: menaruh suatu perkataan dalam mulutnya
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang pemberian ilahi atas ucapan yang harus disampaikan dan tetap mengikuti bentuk tunggal דָּבָר.
- source_word: דָּבָר
  choice: suatu perkataan
  rationale: Dalam konteks ini דָּבָר menunjuk pada ucapan tertentu yang harus disampaikan Bileam. 'Perkataan' mempertahankan citra idiomatis ayat tanpa memperluasnya menjadi 'pesan'.
- source_word: שׁוּב
  choice: Kembalilah
  rationale: Imperatif ini memerintahkan Bileam untuk kembali kepada Balak; 'Kembalilah' ringkas, jelas, dan sesuai dengan register naratif.
- source_word: וְכֹה תְדַבֵּר
  choice: dan berbicaralah demikian
  rationale: כֹה menerangkan cara atau isi ucapan berikutnya. Bentuk imperatif Indonesia menyampaikan daya perintah dari konstruksi Ibrani dan mempertahankan nuansa formula kenabian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Sumber ucapan Bileam
  choice: menaruh suatu perkataan dalam mulutnya
  alternative: memberinya pesan untuk disampaikan
  rationale: Ungkapan sumber mempertahankan penegasan bahwa perkataan Bileam diberikan oleh Yahweh, tanpa menjelaskan lebih jauh mekanisme inspirasi atau mengurangi citra Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan idiom penting teks Ibrani dan formula ujaran ilahi.
