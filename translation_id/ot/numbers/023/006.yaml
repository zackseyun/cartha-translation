  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: id
  text: Lalu Bileam kembali kepada Balak. Tampaklah Balak berdiri di dekat kurban bakarannya bersama semua pemimpin Moab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: Lalu Bileam kembali kepada Balak
  rationale: Pronomina Ibrani secara harfiah berarti “ia kembali kepadanya”; nama tokoh diperjelas dari konteks langsung agar rujukannya alami dan tidak membingungkan dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: Mengungkapkan fungsi penarik perhatian dari hinnēh dengan bentuk naratif Indonesia yang ringkas dan bermartabat.
- source_word: נִצָּב עַל עֹלָתוֹ
  choice: berdiri di dekat kurban bakarannya
  rationale: Kata נִצָּב menyatakan posisi berdiri, sedangkan עַל dalam konteks ini paling alami dipahami sebagai kedekatan posisi, bukan berdiri secara harfiah di atas persembahan.
- source_word: שָׂרֵי מוֹאָב
  choice: pemimpin Moab
  rationale: שָׂרִים merujuk para pejabat atau pemuka; “pemimpin” merupakan padanan modern yang luas tanpa menyiratkan gelar kebangsawanan tertentu.
