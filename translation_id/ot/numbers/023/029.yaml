base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: id
  text: Lalu Bileam berkata kepada Balak, “Bangunlah tujuh mezbah untukku di sini, dan siapkanlah tujuh ekor sapi jantan dan tujuh ekor domba jantan untukku di sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל־בָּלָק
  choice: kepada Balak
  rationale: Preposisi אֶל dalam pengantar ujaran paling alami diterjemahkan “kepada”; Balak adalah bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: בְּנֵה
  choice: Bangunlah
  rationale: Imperatif dari בנה berarti membangun; partikel “-lah” menyampaikan perintah secara wajar dan bermartabat.
- source_word: לִי
  choice: untukku
  rationale: Preposisi ל menandai kepentingan atau peruntukan bagi Bileam.
- source_word: בָּזֶה
  choice: di sini
  rationale: Ungkapan harfiahnya menunjuk “di tempat ini”; “di sini” adalah padanan Indonesia yang ringkas dan alami.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: tujuh mezbah
  rationale: Padanan langsung yang mempertahankan jumlah dan istilah tempat persembahan korban.
- source_word: וְהָכֵן
  choice: dan siapkanlah
  rationale: Imperatif Hifil dari כון di sini berarti menyediakan atau membuat siap bagi persembahan.
- source_word: שִׁבְעָה פָרִים
  choice: tujuh ekor sapi jantan
  rationale: פָרִים menunjuk sapi jantan dalam konteks korban; kata penggolong “ekor” membuat frasa bilangan alami dalam bahasa Indonesia.
- source_word: וְשִׁבְעָה אֵילִים
  choice: dan tujuh ekor domba jantan
  rationale: אֵילִים adalah domba jantan dewasa; padanan ini lebih mudah dipahami pembaca umum daripada istilah yang kurang lazim.
theological_decisions: []
