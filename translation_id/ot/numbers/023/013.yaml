source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: id
  text: Lalu Balak berkata kepadanya, “Mari ikut aku ke tempat lain. Dari sana engkau dapat melihat bangsa itu. Engkau hanya akan melihat bagian terluarnya[a] dan tidak akan melihat seluruh bangsa itu.[b] Mari kita mengutuknya untukku dari sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hanya ujungnya” atau “hanya bagian paling luarnya,” yakni hanya sebagian dari bangsa Israel.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal (“dia,” “seluruhnya”) untuk Israel sebagai satu bangsa kolektif.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: Mari ikut aku
  rationale: Imperatif הלך dengan partikel נָא menyampaikan ajakan atau permintaan yang diperhalus. Dalam bahasa Indonesia, “Mari ikut aku” secara alami menyatakan bahwa Balak mengajak Bileam berpindah bersamanya.
- source_word: מָקוֹם אַחֵר
  choice: tempat lain
  rationale: Padanan langsung dan alami yang mempertahankan gagasan perpindahan ke lokasi berbeda.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: Dari sana engkau dapat melihat bangsa itu
  rationale: Susunan ini memperjelas tempat sebagai titik pandang. Objek tunggal dalam bahasa Ibrani merujuk secara kolektif kepada Israel, sehingga diterjemahkan “bangsa itu” agar alami dan tetap mempertahankan kesatuan referennya.
- source_word: אֶפֶס קָצֵהוּ
  choice: hanya ... bagian terluarnya
  rationale: אֶפֶס membatasi cakupan penglihatan, sedangkan קָצֶה menunjuk ujung, tepi, atau bagian terluar. Padanan ini menyampaikan bahwa hanya sebagian pinggir Israel yang terlihat tanpa memaksakan satu gambaran geografis yang terlalu khusus.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: dan tidak akan melihat seluruh bangsa itu
  rationale: Menyatakan kontras antara pandangan sebagian dan pandangan menyeluruh. Sufiks tunggal kolektif dipertahankan secara semantis melalui “bangsa itu”.
- source_word: וְקָבְנוֹ לִי
  choice: Kutuklah mereka bagiku
  rationale: קבב berarti mengutuk dalam kisah Bileam. “Mereka” merupakan rujukan pronominal Indonesia yang alami kepada anggota bangsa Israel, sedangkan “bagiku” mempertahankan kepentingan pribadi Balak.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Dipertahankan untuk menegaskan bahwa tindakan mengutuk dimaksudkan berlangsung dari titik pandang baru tersebut.
theological_decisions:
- issue: Sufiks pronominal tunggal yang merujuk kepada Israel
  choice: Menerjemahkan referen pertama dan keseluruhannya sebagai “bangsa itu,” lalu memakai “mereka” sebagai objek kutukan
  alternative: Memakai bentuk tunggal “dia/seluruhnya” secara lebih harfiah
  rationale: Bahasa Ibrani memandang Israel sebagai satu kesatuan kolektif. “Bangsa itu” mempertahankan gagasan kesatuan tersebut dengan bahasa Indonesia yang jelas, sedangkan “mereka” pada perintah mengutuk menghindari pronomina personal tunggal yang terdengar seolah merujuk kepada seorang individu. Catatan kaki menjelaskan bentuk sumber.
- issue: Daya imperatif לך־נא
  choice: 'Ajakan yang diperhalus: “Mari ikut aku”'
  alternative: 'Perintah lebih harfiah: “Pergilah bersamaku”'
  rationale: Konteks menunjukkan Balak mengajak Bileam berpindah bersamanya. Bentuk ajakan lebih tepat secara deiktis dan pragmatis dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Engkau” dipakai sesuai register Alkitab yang wajar, sementara “Mari ikut aku” menjaga kelancaran ajakan. Semua penanda catatan kaki muncul dalam teks utama.
