  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בִּלְעָ֑ם וַ/יַּ֨עַל בָּלָ֧ק וּ/בִלְעָ֛ם פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: id
  text: Balak melakukan seperti yang dikatakan Bileam. Lalu Balak dan Bileam mempersembahkan seekor sapi jantan dan seekor domba jantan di atas mezbah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat naik”; dalam konteks kurban, ungkapan ini berarti “mempersembahkan” atau “mempersembahkan sebagai kurban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר דִּבֶּר
  choice: melakukan seperti yang dikatakan
  rationale: Ungkapan ini menyatakan bahwa Balak melaksanakan perkataan atau petunjuk Bileam. Bentuk ini alami dalam bahasa Indonesia modern dan tetap dekat dengan susunan Ibrani.
- source_word: וַיַּעַל
  choice: mempersembahkan
  rationale: Dalam konteks hewan kurban dan mezbah, bentuk Hifil dari עלה merupakan istilah kurban yang berarti mempersembahkan atau mempersembahkan sebagai kurban bakaran.
- source_word: בָּלָק וּבִלְעָם
  choice: Balak dan Bileam
  rationale: Kedua nama merupakan subjek gabungan dari tindakan mempersembahkan.
- source_word: פָּר
  choice: seekor sapi jantan
  rationale: פָּר menunjuk pada sapi jantan dalam konteks kurban; ayat ini sendiri tidak menyatakan usia hewan itu secara eksplisit.
- source_word: וָאַיִל
  choice: dan seekor domba jantan
  rationale: אַיִל adalah istilah biasa untuk domba jantan; kata penggolong 'seekor' menghasilkan ungkapan Indonesia yang wajar.
- source_word: בַּמִּזְבֵּחַ
  choice: di atas mezbah
  rationale: Preposisi ב dengan mezbah dalam konteks kurban secara alami menyatakan lokasi persembahan di atas mezbah.
theological_decisions:
- issue: Jenis persembahan yang tersirat oleh וַיַּעַל
  choice: mempersembahkan, dengan catatan makna harfiahnya
  alternative: mempersembahkan sebagai kurban bakaran
  rationale: Verba tersebut mengandung idiom kurban 'membuat naik', tetapi teks tidak memakai nomina עֹלָה di sini. Terjemahan utama tidak menambahkan klasifikasi ritual yang lebih eksplisit daripada bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Mezbah' dipertahankan sebagai istilah Alkitab yang luas dikenal. Pemisahan menjadi dua kalimat menghindari rangkaian klausa yang berat tanpa mengubah urutan tindakan.
