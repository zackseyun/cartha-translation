  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: id
  text: Allah menemui Bileam[a], lalu Bileam berkata kepada-Nya, “Aku telah menyiapkan tujuh mezbah itu dan mempersembahkan seekor sapi jantan serta seekor domba jantan di atas mezbah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berjumpa dengan Bileam”; verba Ibrani ini menyatakan suatu perjumpaan dan dalam konteks lain kadang dapat bernuansa menjumpai secara tidak terduga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: menemui
  rationale: Dalam konteks ini verba dari akar קרה menyatakan perjumpaan nyata antara Allah dan Bileam. “Menemui” wajar dalam bahasa Indonesia dan tidak memberi kesan bahwa perjumpaan itu terjadi secara kebetulan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini disertai verba tunggal dan dalam konteks jelas menunjuk kepada Allah yang esa.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: lalu Bileam berkata kepada-Nya
  rationale: Walaupun teks Ibrani secara harfiah memakai pronomina “ia” dan “kepadanya”, isi ucapan orang pertama menunjukkan bahwa pembicaranya adalah Bileam dan lawan bicaranya Allah. Nama dan pronomina diperjelas agar rujukannya alami dalam bahasa Indonesia.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: ketujuh mezbah itu
  rationale: Frasa definit ini menunjuk kepada tujuh mezbah tertentu yang sudah dikenal dari konteks sebelumnya.
- source_word: עָרַכְתִּי
  choice: Aku telah menyiapkan
  rationale: ערך berarti menata, mengatur, atau menyiapkan. “Menyiapkan” paling alami untuk mezbah dalam konteks tindakan ritual yang telah selesai dan kini dilaporkan.
- source_word: וָאַעַל
  choice: dan mempersembahkan
  rationale: Dalam konteks kurban, עלה secara idiomatis berarti mempersembahkan kurban di atas mezbah.
- source_word: פָּר
  choice: seekor sapi jantan
  rationale: Padanan Indonesia yang jelas dan lazim bagi פר dalam konteks persembahan kurban.
- source_word: וָאַיִל
  choice: serta seekor domba jantan
  rationale: Padanan yang jelas bagi איל dalam konteks kurban; “serta” menghindari rangkaian konjungsi yang kaku tanpa mengubah hubungan unsur.
- source_word: בַּמִּזְבֵּחַ
  choice: di atas mezbah
  rationale: Mempertahankan bentuk tunggal dan definit dari teks Ibrani tanpa menambahkan gagasan distributif “di atas setiap mezbah” ke dalam teks utama.
theological_decisions:
- issue: Sifat perjumpaan ilahi dalam וַיִּקָּר
  choice: Diterjemahkan sebagai tindakan Allah menemui Bileam tanpa kesan kebetulan
  alternative: “Allah berjumpa dengan Bileam” atau ungkapan yang menyiratkan bahwa Allah kebetulan menjumpainya
  rationale: Akar katanya dalam konteks tertentu dapat mengandung nuansa menjumpai atau terjadi, tetapi narasi ini menggambarkan keterlibatan ilahi yang nyata. Pilihan utama tidak memasukkan gagasan bahwa tindakan Allah bersifat acak.
- issue: Identitas pembicara dalam וַיֹּאמֶר אֵלָיו
  choice: Bileam disebut secara eksplisit sebagai pembicara, dan Allah dirujuk dengan “kepada-Nya”
  alternative: Mempertahankan bentuk harfiah “ia berkata kepadanya”
  rationale: Ucapan orang pertama yang menyusul memastikan bahwa Bileamlah yang berbicara kepada Allah. Perujukan eksplisit mencegah ambiguitas pronomina Indonesia tanpa menambahkan penafsiran teologis.
- issue: Bentuk tunggal בַּמִּזְבֵּחַ sesudah penyebutan tujuh mezbah
  choice: Mempertahankan “di atas mezbah” dalam bentuk tunggal
  alternative: “di atas setiap mezbah”
  rationale: Konteks dapat mendukung pengertian distributif, tetapi kata “setiap” tidak dinyatakan dalam teks Ibrani. Terjemahan utama mempertahankan bentuk sumber dan tidak menutup ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Ketujuh mezbah itu” menandai kelompok tertentu yang telah disebut, sedangkan bentuk tunggal “mezbah” pada akhir ayat sengaja dipertahankan. Pronomina “-Nya” digunakan sesuai konvensi bahasa Indonesia ketika merujuk kepada Allah.
