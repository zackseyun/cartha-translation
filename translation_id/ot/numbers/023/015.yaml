base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: id
  text: Lalu ia berkata kepada Balak, “Berdirilah di sini di dekat kurban bakaranmu, dan aku akan pergi untuk menemui dia di sana.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku akan bertemu di sana” atau “aku akan menjumpai dia di sana.” Kata kerja Ibraninya ringkas dan dapat diterjemahkan dengan beberapa cara yang berdekatan maknanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: Lalu ia berkata kepada Balak
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” merupakan penghubung naratif yang alami dalam bahasa Indonesia tanpa menambahkan penafsiran yang berlebihan.
- source_word: הִתְיַצֵּב
  choice: Berdirilah
  rationale: Imperatif Hitpael dari יצב menyatakan mengambil posisi atau tetap berdiri pada suatu tempat; “berdirilah” jelas dan alami dalam konteks ini.
- source_word: כֹּה
  choice: di sini
  rationale: Dalam konteks ruang, kata penunjuk ini menunjuk tempat Balak harus berdiri.
- source_word: עַל עֹלָתֶךָ
  choice: di dekat kurban bakaranmu
  rationale: עַל di sini menyatakan posisi di sisi atau dekat sesuatu, sedangkan עֹלָה secara khusus berarti kurban bakaran.
- source_word: וְאָנֹכִי
  choice: sementara aku
  rationale: 'Pronomina eksplisit menonjolkan perbedaan tindakan: Balak tetap di tempat, sementara Bileam pergi. “Sementara aku” menyampaikan kontras ringan itu secara alami.'
- source_word: אִקָּרֶה
  choice: akan pergi untuk menemui Dia
  rationale: Bentuk Niphal dari קרה dalam konteks kisah Bileam menunjuk pada suatu perjumpaan. Ungkapan ini menyampaikan gerak menuju perjumpaan tanpa menyebut identitas pihak yang ditemui secara eksplisit.
- source_word: כֹּה
  choice: di sana
  rationale: Kemunculan kedua menunjuk lokasi yang berbeda dari tempat Balak berdiri dan mempertahankan kontras deiktis “di sini/di sana”.
theological_decisions:
- issue: Objek tersirat dari perjumpaan Bileam
  choice: Menggunakan “Dia” sebagai objek personal yang dipahami dari konteks, tanpa menyebut nama TUHAN dalam ayat utama.
  alternative: Menerjemahkan secara lebih tak tentu sebagai “aku akan menjumpai di sana” atau “aku akan mengalami perjumpaan di sana.”
  rationale: Bahasa Ibrani tidak menyebut objek secara eksplisit, tetapi konteks mengarah kepada perjumpaan ilahi. “Dia” membuat kalimat Indonesia dapat dipahami sambil mempertahankan ketidaktersuratan identitas dalam ayat ini; huruf kapital menandai rujukan ilahi yang ditunjukkan konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kurban bakaran” dipilih sebagai istilah yang jelas bagi pembaca umum. Kontras tempat dipertahankan dengan “di sini/di sana,” dan ambiguitas ringkas pada verba Ibrani dijelaskan dalam catatan kaki.
