base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: id
  text: Maka Balak melakukan seperti yang dikatakan Bileam. Ia mempersembahkan seekor sapi jantan dan seekor domba jantan di atas mazbah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Dalam konstruksi dengan כַּאֲשֶׁר אָמַר, verba עשה berarti melakukan sesuai dengan perkataan atau petunjuk seseorang.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Ungkapan ini menyatakan kesesuaian tindakan Balak dengan apa yang telah dikatakan Bileam.
- source_word: אָמַר
  choice: dikatakan
  rationale: Bentuk pasif ini alami dalam bahasa Indonesia dan tetap menunjukkan bahwa perkataan Bileam mendahului tindakan Balak tanpa perlu menambahkan penanda kala yang tidak wajib.
- source_word: וַיַּעַל
  choice: mempersembahkan
  rationale: Dalam konteks korban, עלה merupakan istilah kultis untuk menaikkan atau mempersembahkan korban di atas mazbah.
- source_word: פָּר
  choice: seekor sapi jantan
  rationale: Padanan Indonesia modern yang jelas bagi hewan kurban jantan dari jenis lembu.
- source_word: אַיִל
  choice: seekor domba jantan
  rationale: Padanan tepat dan mudah dipahami untuk אַיִל dalam konteks hewan kurban.
- source_word: בַּמִּזְבֵּחַ
  choice: di atas mazbah
  rationale: Preposisi ב dalam konteks persembahan korban menunjuk pada lokasi korban di atas mazbah; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: וַ
  choice: Maka
  rationale: Waw pembuka melanjutkan alur sekaligus menyatakan hasil dari petunjuk sebelumnya; 'Maka' menangkap hubungan naratif tersebut secara alami.
