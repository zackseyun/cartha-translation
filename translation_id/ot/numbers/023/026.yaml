  source_fidelity: Terjemahan dengan tepat mencerminkan dua verba naratif וַיַּעַן ... וַיֹּאמֶר melalui “menjawab dan berkata,” pertanyaan retoris הֲלֹא, perkataan Bileam sebelumnya, cakupan menyeluruh כֹּל אֲשֶׁר, nama ilahi יהוה sebagai “Yahweh,” serta objek resumptif אֹתוֹ melalui “itulah.” “Yang difirmankan Yahweh” merupakan padanan yang setia bagi “yang Yahweh firmankan/katakan” tanpa menambahkan pembatasan seperti “hanya.”
  naturalness: Bahasa Indonesia baku, jelas, dan bernada wajar untuk narasi kitab suci. Frasa “Bileam menjawab dan berkata kepada Balak” sengaja agak formal, tetapi tetap idiomatis dan dengan tepat mempertahankan formula dialog Ibrani. Bentuk “Bukankah aku telah berkata kepadamu” secara alami menyampaikan pertanyaan retoris yang merujuk pada ucapan terdahulu.
  terminology: “Yahweh” konsisten dengan nama יהוה dalam sumber dan kebijakan yang diberikan. “Difirmankan” sesuai register religius Indonesia yang modern-baku, sedangkan “itulah yang akan kulakukan” mempertahankan penegasan dan komitmen Bileam tanpa penafsiran denominatif.
