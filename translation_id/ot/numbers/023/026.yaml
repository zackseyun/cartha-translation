  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: id
  text: Bileam menjawab dan berkata kepada Balak, “Bukankah aku telah berkata kepadamu, ‘Segala yang difirmankan Yahweh, itulah yang akan kulakukan’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: menjawab dan berkata
  rationale: Mempertahankan rumusan naratif Ibrani yang memakai dua verba, sekaligus tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: Bukankah aku telah berkata kepadamu
  rationale: הֲלֹא memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; bentuk perfektum menunjuk pada perkataan Bileam sebelumnya.
- source_word: כֹּל אֲשֶׁר
  choice: Segala yang
  rationale: Menjaga cakupan menyeluruh ungkapan Ibrani dan sesuai dengan struktur penegasan yang dilanjutkan oleh אֹתוֹ.
- source_word: יְדַבֵּר יְהוָה
  choice: difirmankan Yahweh
  rationale: ‘Difirmankan’ merupakan ungkapan Indonesia yang wajar dan bermartabat untuk perkataan ilahi; bentuknya tidak memaksakan apakah tindakan berbicara itu dipahami sebagai kebiasaan atau peristiwa mendatang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara langsung terdapat dalam teks Ibrani.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: itulah yang akan kulakukan
  rationale: ‘Itulah’ mempertahankan unsur resumptif dan penekanan אֹתוֹ, sedangkan ‘akan kulakukan’ mencerminkan bentuk imperfektum orang pertama.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Ruang lingkup komitmen Bileam
  choice: Segala yang difirmankan Yahweh, itulah yang akan kulakukan
  alternative: Aku hanya akan melakukan apa yang difirmankan Yahweh
  rationale: Terjemahan utama mempertahankan struktur dan penekanan teks tanpa menambahkan kata ‘hanya’, meskipun pembatasan tindakan Bileam tersirat dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘menjawab dan berkata’ sengaja dipertahankan agar formula naratif Ibrani tidak dilebur, sedangkan ‘itulah’ menjaga penekanan pada isi yang difirmankan Yahweh.
