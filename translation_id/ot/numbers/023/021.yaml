  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: id
  text: 'Ia tidak memandang kesusahan pada Yakub,

    dan tidak melihat penderitaan pada Israel.[a]


    Yahweh, Allahnya, menyertainya,

    dan sorak seorang raja ada di tengah mereka.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak melihat kejahatan pada Yakub dan tidak melihat kesukaran atau kelaliman pada Israel.” Kedua istilah Ibrani itu dapat bermakna moral, seperti “kejahatan”, ataupun menunjuk pada kesusahan dan penderitaan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “di dalam dia”; Israel diperlakukan sebagai pribadi kolektif berbentuk tunggal pada bagian sebelumnya.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “sorak seorang raja” dapat menunjuk pada sorak atau aklamasi kerajaan di tengah Israel dan mungkin menyiratkan kehadiran Yahweh sebagai Raja.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: memandang
  rationale: Mempertahankan nuansa melihat dengan perhatian atau mengamati, sekaligus membedakannya dari רָאָה pada baris sejajar.
- source_word: אָוֶן
  choice: kesusahan
  rationale: Kata ini dapat berarti kejahatan, kesalahan, atau kesusahan. Dalam konteks berkat Bileam, 'kesusahan' menyampaikan keadaan buruk tanpa menyatakan bahwa Israel sama sekali tidak berdosa; kemungkinan moral dipertahankan dalam catatan kaki.
- source_word: רָאָה
  choice: melihat
  rationale: Padanan langsung dan alami untuk verba umum 'melihat', sesuai dengan paralelisme puisi.
- source_word: עָמָל
  choice: penderitaan
  rationale: Mencakup kesukaran, jerih payah, dan derita, serta membedakannya secara wajar dari אָוֶן.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: pada Yakub / pada Israel
  rationale: Preposisi ב dipahami secara lokatif dalam paralelisme. 'Pada' lebih alami daripada 'di dalam' ketika Yakub dan Israel menunjuk kepada umat secara kolektif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Mempertahankan akhiran orang ketiga tunggal yang mengacu kepada Israel sebagai pribadi kolektif.
- source_word: עִמּוֹ
  choice: menyertainya
  rationale: Mempertahankan bentuk tunggal dan menyampaikan kehadiran yang menyertai secara alami dalam bahasa Indonesia.
- source_word: תְרוּעַת מֶלֶךְ
  choice: sorak bagi seorang raja
  rationale: תְרוּעָה dapat berupa pekik, sorak, atau aklamasi. Konstruksi ini dibiarkan cukup luas untuk mencakup sorak kerajaan tanpa menetapkan secara eksplisit identitas sang raja.
- source_word: בּוֹ
  choice: di tengah mereka
  rationale: Secara bentuk berarti 'di dalamnya/di dalam dia', dengan Israel sebagai tunggal kolektif. Bentuk jamak alami dalam bahasa Indonesia menyatakan bahwa sorak itu ada di tengah umat; bentuk harfiahnya dicatat.
theological_decisions:
- issue: Apakah ayat ini menyatakan Israel tidak berdosa atau bahwa kesusahan tidak tampak berlaku atas Israel
  choice: Teks utama memakai 'kesusahan' dan 'penderitaan'.
  alternative: '''Ia tidak melihat kejahatan pada Yakub dan tidak melihat kesukaran/kelaliman pada Israel.'''
  rationale: Rentang makna אָוֶן dan עָמָל memungkinkan pembacaan moral maupun pembacaan tentang kesusahan. Konteks berkat dan kehadiran ilahi mendukung pembacaan kesusahan dalam teks utama, tetapi pembacaan moral tetap dicatat agar ketegangan leksikal tidak dihapus.
- issue: Identitas 'raja' dalam תְרוּעַת מֶלֶךְ
  choice: Tidak mengidentifikasi sang raja secara eksplisit; diterjemahkan 'sorak bagi seorang raja'.
  alternative: '''sorak Sang Raja'' atau ''sorak kerajaan''.'
  rationale: Ungkapan Ibrani dapat menunjuk kepada aklamasi kerajaan dan mungkin menyiratkan kehadiran Yahweh sebagai Raja, tetapi referennya tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern, puitis namun mudah dipahami. Paralelisme Ibrani dipertahankan dalam susunan empat baris. Pronomina tunggal pada 'Allahnya' dan 'menyertainya' mempertahankan personifikasi kolektif Israel, sedangkan 'di tengah mereka' dipakai secara idiomatis untuk umat sebagai kumpulan.
