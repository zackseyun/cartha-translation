  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: id
  text: Bagaimana mungkin aku mengutuk orang yang tidak dikutuk Allah? Bagaimana mungkin aku mengecam orang yang tidak dikecam Yahweh?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bagaimana mungkin aku murka terhadap orang yang tidak dimurkai Yahweh?” Kata kerja Ibrani pada baris kedua dapat menekankan kemurkaan atau kecaman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Bagaimana mungkin
  rationale: Dalam pertanyaan retoris ini, מָה menyatakan ketidakmungkinan, bukan sekadar meminta informasi; ungkapan ini alami dalam bahasa Indonesia.
- source_word: אֶקֹּב / קַבֹּה
  choice: aku mengutuk / tidak dikutuk
  rationale: Kedua bentuk berasal dari akar yang sama dalam konteks tindakan mengutuk; pengulangan kata mempertahankan kaitan leksikal dan paralelisme Ibrani.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini berfungsi sebagai sebutan bagi Tuhan; 'Allah' merupakan padanan baku dan wajar dalam bahasa Indonesia.
- source_word: אֶזְעֹם / זָעַם
  choice: aku mengecam / tidak dikecam
  rationale: זעם dapat menunjuk pada murka maupun pengungkapan murka sebagai kecaman. 'Mengecam' mempertahankan tindakan verbal yang sejajar dengan 'mengutuk' tanpa menyamakan kedua verba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', sehingga tetap dibedakan dari sebutan אֵל dalam baris pertama.
theological_decisions:
- issue: Pembedaan אֵל dan יְהוָה dalam paralelisme puisi
  choice: אֵל diterjemahkan 'Allah' dan יְהוָה 'Yahweh'.
  alternative: Keduanya diterjemahkan dengan sebutan umum 'Allah' atau יְהוָה diganti dengan 'TUHAN'.
  rationale: Teks Ibrani memakai dua bentuk yang berbeda, termasuk nama pribadi ilahi pada baris kedua; mempertahankan perbedaan ini mencerminkan sumber tanpa menghapus paralelismenya.
- issue: Makna זעם dalam baris kedua
  choice: Diterjemahkan sebagai tindakan 'mengecam', dengan arti 'murka' dicatat sebagai kemungkinan lain.
  alternative: Bagaimana mungkin aku murka terhadap orang yang tidak dimurkai Yahweh?
  rationale: Verba ini memungkinkan nuansa murka maupun kecaman yang lahir dari murka. Teks utama mempertahankan kesejajaran tindakan verbal dengan baris pertama, sedangkan catatan kaki menjaga ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk 'aku' sesuai dengan tuturan pribadi Bileam dalam syair. Susunan dua pertanyaan paralel dipertahankan, dengan 'Bagaimana mungkin' untuk menyampaikan daya retoris מָה.
