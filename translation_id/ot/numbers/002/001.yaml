  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa dan kepada Harun demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang di sini ditulis “Yahweh”.'
    reason: Menjelaskan bentuk Ibrani di balik penulisan nama ilahi dalam teks utama.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif ini memperkenalkan tindakan tutur ilahi yang baru. “Berfirman” merupakan padanan Indonesia yang alami dan bermartabat untuk דבר ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan kepada Harun
  rationale: Pengulangan kata depan אֶל dipertahankan agar kedua orang itu jelas tampil sebagai penerima firman secara sejajar.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Rumus infinitif ini memperkenalkan isi perkataan pada ayat berikutnya. “Demikian:” mengungkapkan fungsinya secara wajar dalam bahasa Indonesia dan tetap menandai bahwa kutipan akan menyusul.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; YHWH
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan sebuah gelar; catatan kaki menyebutkan bentuk konsonantal Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “kepada” sengaja dipertahankan karena terdapat dalam teks Ibrani, sedangkan “demikian:” digunakan sebagai pengantar alami menuju firman pada ayat berikutnya.
