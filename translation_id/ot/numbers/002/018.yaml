base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: id
  text: Panji[a] perkemahan Efraim, menurut kesatuan-kesatuan mereka[b], akan berada di sebelah barat; pemimpin bani Efraim[c] ialah Elisama anak Amihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pataka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut kelompok-kelompok mereka.” Istilah Ibraninya mengandung pengertian kesatuan yang tersusun secara militer.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak Efraim”; maksudnya keturunan atau suku Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: panji
  rationale: Menunjuk pada tanda pengenal suku atau kesatuan yang menjadi pusat pengaturan perkemahan. “Panji” alami dan jelas dalam bahasa Indonesia modern.
- source_word: מַחֲנֵה
  choice: perkemahan
  rationale: Mengacu pada perkemahan sebagai formasi kelompok suku; “perkemahan” sesuai dengan konteks penataan Israel di sekeliling Kemah Pertemuan.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: Bentuk jamak צְבָאוֹת menyatakan kesatuan-kesatuan yang tersusun dan terorganisasi. “Pasukan-pasukan” mempertahankan nuansa militer-organisasional tanpa menyiratkan bahwa pertempuran sedang berlangsung.
- source_word: יָמָּה
  choice: di sebelah barat
  rationale: Secara etimologis menunjuk ke arah laut, tetapi dalam orientasi geografis Israel merupakan ungkapan lazim untuk arah barat. Konteksnya adalah posisi perkemahan.
- source_word: וְנָשִׂיא
  choice: pemimpin
  rationale: נָשִׂיא di sini adalah kepala atau pemimpin suku. “Pemimpin” lebih jelas daripada “pangeran,” yang dapat memberi kesan jabatan dinasti.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: bani Efraim
  rationale: “Bani Efraim” mempertahankan gagasan keturunan sekaligus berfungsi secara alami sebagai sebutan suku dalam bahasa Indonesia Alkitabiah yang masih mudah dipahami.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama bin Amihud
  rationale: Nama-nama ditransliterasikan ke bentuk Indonesia yang lazim; “bin” secara ringkas dan tepat menerjemahkan בֶּן.
