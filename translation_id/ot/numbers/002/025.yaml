source:
  edition: WLC
  text: דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: id
  text: Panji perkemahan Dan berada di sebelah utara menurut kelompok-kelompok mereka[a]. Pemimpin bani Dan ialah Ahiezer bin Amisyadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menurut divisi-divisi mereka" atau "menurut pasukan-pasukan mereka."
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: panji
  rationale: Menunjuk pada tanda atau panji suku yang menjadi pusat pengaturan perkemahan; 'panji' alami, ringkas, dan sesuai dengan konteks.
- source_word: מַחֲנֵה
  choice: perkemahan
  rationale: Menggambarkan kelompok suku yang berkemah secara teratur, bukan hanya tempat kemah.
- source_word: צָפֹנָה
  choice: di sebelah utara
  rationale: Bentuk berarah ini dalam konteks tersebut menunjukkan letak pada sisi utara dari Kemah Suci.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: צָבָא di sini menunjuk pada kelompok-kelompok yang diatur seperti pasukan; bentuk jamaknya dipertahankan dan alternatif yang lebih administratif dicatat dalam catatan kaki.
- source_word: וְנָשִׂיא
  choice: Pemimpin
  rationale: נָשִׂיא dalam konteks kesukuan berarti kepala atau pemimpin yang diakui, tanpa menyiratkan kedudukan monarkis.
- source_word: לִבְנֵי דָן
  choice: bani Dan
  rationale: '''Bani Dan'' merupakan ungkapan Indonesia yang mapan untuk sebutan kesukuan ''anak-anak lelaki/keturunan Dan'' dan tetap mempertahankan bentuk kolektif tradisional.'
- source_word: אֲחִיעֶזֶר
  choice: Ahiezer
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: bin Amisyadai
  rationale: '''Bin'' menyampaikan hubungan patronimik secara ringkas dan alami; nama Ibrani ditransliterasikan ke ejaan Indonesia.'
theological_decisions:
- issue: Sebutan kesukuan maskulin בְנֵי דָן
  choice: bani Dan
  alternative: keturunan Dan; anak-anak lelaki Dan
  rationale: '''Bani Dan'' mempertahankan sebutan kesukuan kolektif dari teks tanpa mempersempitnya hanya kepada laki-laki individual maupun menghapus bentuk tradisionalnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan istilah kesukuan 'bani' dan patronimik 'bin' yang sudah dikenal luas dalam terjemahan Alkitab Indonesia.
