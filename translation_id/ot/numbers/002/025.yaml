  source_fidelity: Kata "harus" menambahkan nuansa kewajiban yang tidak dinyatakan dalam klausa nominal Ibrani; ayat ini menyatakan posisi panji/perkemahan. Selain itu, לְצִבְאֹתָם paling baik diterjemahkan sebagai pengaturan menurut kelompok/divisi mereka, tanpa harus memaksakan arti "pasukan-pasukan" dalam teks utama.
  naturalness: '"Panji perkemahan Dan berada di sebelah utara menurut kelompok-kelompok mereka" adalah bahasa Indonesia baku dan jelas. "Bani Dan" dan "bin" tetap dapat dipakai dalam register Alkitab yang bermartabat.'
  terminology: '"Panji", "perkemahan", "bani Dan", dan nama Ahiezer bin Amisyadai dapat dipertahankan. "Kelompok-kelompok" lebih alami dan kurang berkonotasi militer modern daripada "pasukan-pasukan", sambil tetap mencerminkan pengelompokan teratur dari צָבָא.'
