  text: 'dan pasukannya[a], yaitu mereka yang terhitung: tiga puluh dua ribu dua ratus orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bala tentaranya” atau “kontingennya”; kata Ibrani צָבָא di sini menunjuk pada kontingen suku yang diatur untuk berkemah dan melakukan perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: dan pasukannya
  rationale: צָבָא dalam konteks penataan perkemahan dan barisan perjalanan menunjuk pada kontingen suku yang terorganisasi. 'Pasukan' alami dalam bahasa Indonesia dan tetap mempertahankan nuansa militernya.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terhitung
  rationale: Bentuk dari פקד ini menunjuk pada orang-orang yang telah dihitung atau didata. Ungkapan ini memperkenalkan jumlah sensus yang menyusul dan mempertahankan acuan sufiks jamak kepada anggota pasukan.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: tiga puluh dua ribu dua ratus orang
  rationale: Bilangan Ibrani dialihkan ke urutan bilangan baku bahasa Indonesia. 'Orang' ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah orang yang terhitung.
