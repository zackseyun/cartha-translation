  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: id
  text: Panji perkemahan Ruben berada di sebelah selatan menurut kesatuan-kesatuan mereka[a], dan pemimpin orang-orang Ruben ialah Elizur anak Syedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut bala tentara mereka”; kata Ibrani ini menunjuk pada kelompok-kelompok yang tersusun untuk tugas militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: panji
  rationale: Menunjuk pada tanda pengenal suku atau kesatuan dalam penataan perkemahan. 'Panji' alami dalam bahasa Indonesia dan mempertahankan nuansa komunal-militer.
- source_word: מַחֲנֵה
  choice: perkemahan
  rationale: Menunjuk pada perkemahan suku yang tertata, bukan sekadar tindakan berkemah.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: תֵּימָנָה
  choice: di sebelah selatan
  rationale: Akhiran direktif-lokatif dalam konteks ini menyatakan penempatan pada sisi selatan perkemahan.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: Mempertahankan arti dasar צבא sebagai kelompok militer yang tersusun serta bentuk jamaknya; ungkapan ini juga cocok dengan penataan suku dalam Bilangan 1–2.
- source_word: וְנָשִׂיא
  choice: Pemimpin
  rationale: Dalam konteks ini נָשִׂיא adalah kepala suku yang ditunjuk. 'Pemimpin' jelas dan netral, tanpa kesan monarkis dari 'pangeran'.
- source_word: לִבְנֵי רְאוּבֵן
  choice: bani Ruben
  rationale: Ungkapan Indonesia yang ringkas dan mapan untuk kelompok keturunan atau suku Ruben.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizur anak Syedeur
  rationale: Transliterasi nama yang sesuai dengan kebiasaan Indonesia, dengan patronimik בן diterjemahkan langsung sebagai 'anak'.
