base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/029.yaml
  text: 'And the tribe of Naphtali[a], and the leader of the sons of Naphtali: Ahira son of Enan.'
translation:
  language: id
  text: Dan suku Naftali[a]. Pemimpin bani Naftali ialah Ahira anak Enan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian berikutnya menyebut mereka “bani Naftali”, yaitu para keturunan atau anggota suku Naftali.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pengaturan perkemahan Israel, kata ini menunjuk pada kelompok suku, bukan tongkat secara harfiah.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Kata ini menunjuk pada kepala yang diakui dari suatu suku; 'pemimpin' jelas dan tidak menimbulkan kesan kerajaan seperti 'pangeran'.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: bani Naftali
  rationale: '''Bani'' merupakan ungkapan Indonesia yang ringkas dan lazim untuk keturunan atau anggota kelompok yang berasal dari seorang leluhur, serta mempertahankan corak rumusan Ibrani.'
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nama diri dan nama suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲחִירַע
  choice: Ahira
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumusan patronimik ini, 'anak' adalah padanan Indonesia yang langsung dan alami.
- source_word: עֵינָן
  choice: Enan
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
