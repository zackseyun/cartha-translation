  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה אָשֵׁ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י אָשֵׁ֔ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: id
  text: Yang berkemah di sebelahnya[a] adalah suku Asyer, dan pemimpin keturunan Asyer adalah Pagiel anak Okhran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di sampingnya.” Kata depan Ibrani ini dapat menunjukkan posisi berdampingan dalam susunan perkemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: Yang berkemah
  rationale: Partisipel dari חנה menunjuk kepada mereka yang sedang atau berada dalam keadaan berkemah; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya partisipelnya.
- source_word: עָלָיו
  choice: di sebelahnya
  rationale: Dalam konteks tata letak perkemahan, עַל dengan sufiks pronominal menyatakan posisi berdampingan, bukan berada secara fisik di atas.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks sensus dan susunan perkemahan Israel, מַטֶּה menunjuk kepada kelompok suku.
- source_word: אָשֵׁר
  choice: Asyer
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam kitab Bilangan, נָשִׂיא adalah kepala yang diakui dari suatu suku; 'pemimpin' akurat dan tidak menyiratkan kedudukan dinastik.
- source_word: לִבְנֵי אָשֵׁר
  choice: keturunan Asyer
  rationale: Secara harfiah berarti 'anak-anak lelaki Asyer', tetapi sebagai ungkapan silsilah kolektif, 'keturunan Asyer' menyampaikan maksudnya secara alami tanpa membatasi rujukan pada anak langsung.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Nama diri ditransliterasikan.
- source_word: בֶּן עָכְרָן
  choice: anak Okhran
  rationale: Konstruksi patronimik Ibrani diterjemahkan langsung; ejaan 'Okhran' mempertahankan konsonan tenggorokan ח secara terukur dalam transliterasi Indonesia.
