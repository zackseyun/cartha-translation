  yaml_path: translation/ot/numbers/002/015.yaml
  text: 'and his company[b][a], even those numbered from them: forty-five thousand six hundred and fifty.'
translation:
  language: id
  text: dan pasukannya[a], yaitu mereka yang terdaftar[b], berjumlah 45.650 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompok tentaranya”; istilah Ibrani ini dapat menunjuk pada kesatuan militer yang terorganisasi.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka yang dihitung” atau “mereka yang didata dalam sensus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: dan pasukannya
  rationale: Dalam konteks sensus dan tata perkemahan, צָבָא menunjuk pada kelompok suku yang terorganisasi untuk tugas militer. "Pasukan" alami dalam bahasa Indonesia dan mempertahankan nuansa tersebut tanpa harus menyiratkan bahwa pertempuran sedang berlangsung.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terdaftar
  rationale: Bentuk dari פקד di sini menunjuk kepada orang-orang yang didata atau dihitung dalam sensus. "Mereka yang terdaftar" mempertahankan acuan jamak dan nuansa pendataan, sedangkan "yaitu" menyatakan hubungan penjelas yang tersirat dalam susunan klausa.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: berjumlah 45.650 orang
  rationale: Angka Ibrani secara langsung berjumlah empat puluh lima ribu enam ratus lima puluh. Penambahan "berjumlah" dan "orang" menghasilkan ungkapan Indonesia yang wajar dalam laporan sensus tanpa mengubah nilai angkanya.
