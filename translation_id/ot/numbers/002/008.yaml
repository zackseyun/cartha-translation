  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: id
  text: Pasukannya[a], yakni orang-orangnya yang terdaftar[b], berjumlah 57.400 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bala tentaranya” atau “kesatuannya”; kata Ibrani צָבָא dapat menunjuk pada pasukan atau kontingen yang terorganisasi dalam konteks sensus dan pengaturan perkemahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orangnya yang dihitung” atau “orang-orangnya yang didata”; bentuk Ibrani ini menunjuk pada mereka yang secara resmi dihitung dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Pasukannya
  rationale: צָבָא dalam konteks pengaturan perkemahan dan sensus menunjuk pada kesatuan atau kontingen suku yang terorganisasi. “Pasukan” alami dalam bahasa Indonesia dan mempertahankan nuansa kemiliteran tanpa menyatakan bahwa mereka sedang berperang.
- source_word: וּפְקֻדָיו
  choice: yakni orang-orangnya yang terdaftar
  rationale: Bentuk dari פקד dalam rumusan sensus ini menunjuk pada orang-orang yang telah dihitung dan dicatat secara resmi. “Terdaftar” mengungkapkan pencatatan sensus, sedangkan “yakni” memperlihatkan bahwa frasa ini menjelaskan jumlah pasukan tersebut.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57.400 orang
  rationale: Bilangan Ibrani dinyatakan menurut tata angka Indonesia modern sambil mempertahankan nilai tepat 57.400; “orang” ditambahkan secara wajar untuk memperjelas bahwa yang dihitung adalah anggota pasukan.
