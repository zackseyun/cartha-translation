id: NUM.2.12
reference: Numbers 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: id
  text: Yang berkemah di sampingnya[a] ialah suku Simeon, dan pemimpin bani Simeon ialah Selumiel anak Zurisyadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dekatnya.” Kata depan Ibrani di sini menunjukkan kedekatan dalam susunan perkemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: Yang berkemah
  rationale: Partisipel dari חנה dipakai secara substantival untuk menyebut kelompok yang berkemah; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa verbalnya.
- source_word: עָלָיו
  choice: di sampingnya
  rationale: Dalam konteks tata letak perkemahan, עַל dengan sufiks pronominal menyatakan kedekatan tempat. Sufiks maskulin tunggal dipertahankan dengan -nya tanpa memaksakan apakah acuannya tokoh atau kesatuan perkemahan sebelumnya.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: suku Simeon
  rationale: מַטֶּה dalam konteks sensus dan perkemahan menunjuk pada kesatuan suku, bukan tongkat secara harfiah.
- source_word: וְנָשִׂיא
  choice: Pemimpin
  rationale: נָשִׂיא di sini adalah kepala yang diakui dari suatu suku; 'pemimpin' jelas dan tidak menimbulkan kesan jabatan kerajaan.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: bani Simeon
  rationale: '''Bani'' merupakan ungkapan Indonesia yang ringkas dan lazim dalam register Alkitab untuk keturunan atau kelompok kekerabatan yang secara harfiah disebut ''anak-anak lelaki Simeon''.'
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang sesuai dengan ejaan dan tradisi nama Alkitab bahasa Indonesia.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: anak Zurisyadai
  rationale: Konstruksi patronimik diterjemahkan langsung; nama ayah ditransliterasikan sebagai satu nama diri.
theological_decisions:
- issue: Bahasa kekerabatan bergender dalam לִבְנֵי שִׁמְעוֹן
  choice: bani Simeon
  alternative: anak-anak lelaki Simeon; keturunan Simeon
  rationale: '''Bani'' mempertahankan identitas kelompok keturunan dari ungkapan Ibrani tanpa terdengar janggal dalam bahasa Indonesia. Dalam konteks daftar pemimpin suku, istilah ini tidak dimaksudkan untuk menghapus bentuk maskulin sumber, melainkan menyampaikan sebutan genealogis secara wajar.'
- issue: Acuan sufiks maskulin tunggal pada עָלָיו
  choice: di sampingnya
  alternative: di samping dia; berdekatan dengannya
  rationale: Bentuk '-nya' mempertahankan kemungkinan acuan kepada tokoh atau unsur perkemahan yang disebut sebelumnya, sehingga ambiguitas sumber tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada bermartabat dan jelas. 'Bani' dipakai sebagai istilah kekerabatan yang sudah dikenal dalam bahasa Indonesia, sedangkan dua klausa dipisahkan menjadi dua kalimat agar daftar tata perkemahan mudah dibaca.
