  text: 'dan pasukannya[a], mereka yang terhitung: enam puluh dua ribu tujuh ratus orang.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bala tentaranya” atau “kontingen tenteranya”; kata Ibrani צָבָא dapat berarti bala tentara atau kelompok yang tersusun. Dalam konteks sensus ini, kata itu menunjuk pada kontingen dari suku tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang yang terhitung dari antara mereka.” Frasa ini menunjuk pada orang-orang dari suku itu yang didata dalam sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: dan pasukannya
  rationale: צָבָא dalam konteks pengaturan perkemahan dan sensus di Bilangan 1–2 menunjuk pada pasukan atau kontingen suku. "Pasukan" alami dalam bahasa Indonesia dan tetap mempertahankan nuansa kemiliteran serta organisasi kelompok.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terhitung
  rationale: Bentuk dari פקד ini menunjuk pada orang-orang yang didata dalam sensus. "Mereka yang terhitung" mempertahankan rujukan kepada orang-orang yang dihitung, bukan hanya angka abstrak; penghubung "yaitu" memperjelas hubungan penjelas antara pasukan dan jumlah mereka.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: enam puluh dua ribu tujuh ratus orang
  rationale: Jumlah tepatnya disajikan menurut susunan bilangan Indonesia modern. "Orang" ditambahkan secara wajar untuk menegaskan bahwa angka itu adalah jumlah orang yang terhitung.
