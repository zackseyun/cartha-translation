  text: וְ/עָלָ֖י/ו מַטֵּ֣ה מְנַשֶּׁ֑ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י מְנַשֶּׁ֔ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: id
  text: Di sebelahnya adalah suku Manasye[a], dan pemimpin keturunan Manasye adalah Gamaliel anak Pedazur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di sampingnya adalah suku Manasye.” Frasa depan dalam bahasa Ibrani menunjukkan posisi yang berdekatan dalam susunan perkemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: Di sebelahnya
  rationale: Dalam konteks penataan perkemahan, עַל dengan sufiks pronominal menyatakan letak yang berdekatan, bukan kedudukan di atas atau wewenang.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks sensus dan pengaturan perkemahan Israel, מַטֶּה menunjuk pada satuan suku, bukan tongkat secara harfiah.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama pribadi dan suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְנָשִׂיא
  choice: dan pemimpin
  rationale: נָשִׂיא di Kitab Bilangan menunjuk pada kepala resmi suatu suku; 'pemimpin' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: keturunan Manasye
  rationale: Secara harfiah frasa ini berarti 'anak-anak Manasye', tetapi dalam konteks kesukuan menunjuk pada para keturunannya; bentuk ini alami dan tetap mempertahankan hubungan garis keturunan.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumusan patronimik Ibrani, בֶּן menyatakan bahwa Gamaliel adalah anak Pedazur.
- source_word: פְּדָהצוּר
  choice: Pedazur
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
