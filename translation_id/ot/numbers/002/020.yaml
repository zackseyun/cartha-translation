  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Di sebelahnya' dipilih untuk menyampaikan hubungan spasial secara alami; 'keturunan Manasye' menghindari kesan bahwa yang dimaksud hanya anak-anak langsung Manasye.
