  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
translation:
  language: id
  text: Pasukannya[a], yaitu mereka yang terdaftar[b], berjumlah 74.600 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentaranya”; kata Ibrani צָבָא dapat bermakna militer, tetapi di sini kemungkinan menunjuk pada pasukan suku sebagaimana ditata di perkemahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka yang dihitung” atau “orang-orang mereka yang terdaftar”. Ungkapan Ibrani ini memakai istilah pendaftaran sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Pasukannya
  rationale: צָבָא dapat berarti tentara atau pasukan. Dalam konteks penataan perkemahan dan sensus suku, “pasukan” secara alami menunjuk pada kesatuan suku yang diatur di bawah seorang pemimpin, tanpa harus menyiratkan pertempuran aktif.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terdaftar
  rationale: Bentuk dari פקד di sini memakai istilah sensus bagi orang-orang yang didata atau dihitung. “Mereka yang terdaftar” mempertahankan nuansa pencatatan sensus dan tidak memasukkan kata “laki-laki” ke dalam frasa ini, meskipun konteks yang lebih luas adalah sensus militer.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '74.600'
  rationale: Jumlah yang tepat disajikan menurut tata angka Indonesia modern agar ringkas dan mudah dibaca.
