translation_notes:
  register: Bahasa Indonesia baku yang modern dan lugas. Susunan klausa dibuat alami dalam bahasa Indonesia, dengan “berjumlah” memperjelas hubungan antara kelompok yang didata dan angka total. Kata “orang” ditambahkan sesudah angka sebagai penggolong alami dalam bahasa Indonesia, sesuai rujukan manusia dalam konteks.
