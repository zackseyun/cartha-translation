  yaml_path: translation/ot/numbers/002/028.yaml
  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: id
  text: Pasukannya[a], yakni mereka yang terdaftar dari antara mereka[b], berjumlah 41.500 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompoknya”; kata Ibrani yang dipakai dapat berarti pasukan atau kelompok terorganisasi dalam sensus perkemahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan mereka yang terdaftar” atau “mereka yang dimuster dari antara mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Pasukannya
  rationale: Dalam konteks sensus dan pengaturan perkemahan, צָבָא menunjuk pada kelompok suku yang terorganisasi sebagai pasukan. Bentuk berakhiran orang ketiga tunggal diterjemahkan dengan akhiran -nya.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terhitung dari suku itu
  rationale: Ungkapan dari akar פקד menunjuk kepada orang-orang yang dihitung atau didata dalam sensus. 'Dari suku itu' menyampaikan rujukan pronomina jamak secara alami dalam bahasa Indonesia tanpa menambahkan identitas yang tidak disebutkan dalam klausa.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '41.500'
  rationale: 'Bilangan Ibrani dinyatakan menurut susunan angka baku bahasa Indonesia: empat puluh satu ribu lima ratus.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. 'Pasukan' mempertahankan nuansa organisasi militer dalam konteks Bilangan 2, sedangkan susunan dengan 'yaitu' membuat hubungan antara pasukan dan jumlah orang yang terhitung jelas. Kata 'orang' sesudah angka ditambahkan secara idiomatis sebagai penggolong, sesuai konteks sensus manusia.
