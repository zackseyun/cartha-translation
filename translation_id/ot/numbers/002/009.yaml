  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: id
  text: Jumlah semua orang yang terdaftar[a] dari perkemahan Yehuda adalah 186.400 orang, menurut kelompok-kelompok mereka.[b] Mereka harus berangkat lebih dahulu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang dihitung” atau “yang didata.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “menurut pasukan-pasukan mereka” atau “menurut bala tentara mereka.”
    reason: lexical_alternative
  - marker: c
    text: Dalam konteks perkemahan, ini juga dapat diterjemahkan, “Mereka harus membongkar perkemahan lebih dahulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Semua orang yang dihitung
  rationale: Bentuk pasif dari פקד menunjuk kepada mereka yang telah dicatat atau dihitung dalam sensus militer. Ungkapan ini jelas dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi istilah teknis tertentu.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: dalam perkemahan Yehuda
  rationale: Frasa ini menyatakan kelompok perkemahan yang dipimpin Yehuda. Kata 'dalam' menghasilkan hubungan yang alami dalam bahasa Indonesia tanpa mengubah pengelompokan tersebut.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 186.400 orang
  rationale: Angka mempertahankan jumlah tepat dan mudah dibaca dalam konteks sensus. Kata penggolong 'orang' ditambahkan agar alami dalam bahasa Indonesia.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: Bentuk jamak צִבְאֹת menunjuk kepada kelompok-kelompok yang tersusun untuk tugas atau gerak militer. 'Pasukan-pasukan' mempertahankan nuansa militer tanpa memakai konsep tentara modern yang terlalu khusus.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Mereka harus berangkat lebih dahulu
  rationale: נסע dalam konteks perkemahan berarti mulai bergerak atau berangkat dari tempat berkemah, sedangkan רִאשֹׁנָה menyatakan urutan pertama. 'Harus' menyampaikan daya instruktif bentuk imperfek dalam ketetapan susunan perjalanan.
