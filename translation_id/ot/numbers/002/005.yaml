  register: Bahasa Indonesia baku, modern, dan bermartabat. Inversi ringan 'Di sebelahnya berkemah...' menjaga hubungan spasial dengan ayat sebelumnya tanpa terasa kaku. Nama-nama mengikuti bentuk Indonesia yang lazim.
