base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: id
  text: Di sebelahnya berkemah suku Isakhar, dan pemimpin keturunan Isakhar[a] ialah Netaneel anak Zuar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Isakhar.” Ungkapan ini merupakan sebutan kesukuan yang lazim dan mengacu kepada keturunan atau anggota suku Isakhar, bukan hanya laki-laki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: berkemah
  rationale: Partisipel ini menyatakan kelompok yang menempati posisi dalam perkemahan; susunan 'Di sebelahnya berkemah...' alami dalam narasi penataan kemah dan mempertahankan makna keadaan/kegiatan yang berlangsung.
- source_word: עָלָיו
  choice: di sebelahnya
  rationale: Dalam konteks tata letak perkemahan, frasa ini menunjuk kedekatan secara ruang dengan kelompok yang disebut sebelumnya, bukan posisi harfiah 'di atasnya'.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks sensus dan perkemahan Bilangan, kata ini berarti unit kesukuan, bukan tongkat.
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Kata ini menunjuk kepala yang diakui dari suatu suku; 'pemimpin' jelas dan tidak menimbulkan kesan jabatan raja.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: keturunan Isakhar
  rationale: Ungkapan kekerabatan Ibrani secara idiomatis menunjuk anggota atau keturunan kelompok Isakhar, bukan hanya anak laki-laki langsung.
- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang jelas dan dekat dengan bentuk Ibrani.
- source_word: בֶּן צוּעָר
  choice: anak Zuar
  rationale: Konstruksi patronimik Ibrani ini secara alami diterjemahkan 'anak Zuar' dalam bahasa Indonesia.
