base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: id
  text: Kemudian Kemah Pertemuan akan berangkat bersama perkemahan orang Lewi di tengah perkemahan-perkemahan. Sebagaimana mereka berkemah, demikian pula mereka akan berangkat, masing-masing di tempatnya[a], menurut panji-panji mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada posisinya”; ungkapan Ibrani ini secara harfiah melibatkan kata “tangan/sisi” dan menunjuk tempat yang ditetapkan dalam susunan perjalanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “sesuai dengan panji-panji mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Kemudian ... harus berangkat
  rationale: Dalam konteks perpindahan perkemahan, נָסַע berarti membongkar kemah lalu mulai bergerak. “Berangkat” menyampaikan tindakan memulai perjalanan secara alami, sedangkan “kemudian” mencerminkan urutan prosesi.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan ini mempertahankan unsur konkret “kemah” dan fungsi tempat pertemuan tanpa memasukkan istilah teologis yang lebih kemudian.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: perkemahan orang Lewi
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung; “orang Lewi” merupakan sebutan kelompok yang wajar dalam bahasa Indonesia modern.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: di tengah perkemahan-perkemahan itu
  rationale: בְּתוֹךְ menunjukkan posisi di bagian tengah. Bentuk jamak dipertahankan karena yang dimaksud ialah berbagai perkemahan kelompok Israel.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: Sebagaimana mereka berkemah, demikian pula mereka harus berangkat
  rationale: Susunan korelatif ini mempertahankan kesejajaran antara tata letak ketika berkemah dan urutan ketika berangkat, tanpa menambahkan kata “urutan” yang hanya tersirat oleh konteks.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ dipakai secara distributif untuk setiap orang atau kelompok dalam susunan perjalanan; “masing-masing” menyampaikan fungsi tersebut dengan alami.
- source_word: עַל יָדוֹ
  choice: di tempatnya
  rationale: Ungkapan yang secara harfiah melibatkan “tangan/sisi” ini secara idiomatis menunjuk posisi setiap pihak dalam susunan perjalanan.
- source_word: לְדִגְלֵיהֶם
  choice: menurut panji-panji mereka
  rationale: דֶּגֶל adalah panji atau tanda pengenal kelompok suku. “Menurut” menonjolkan fungsi panji dalam mengatur pengelompokan dan urutan.
