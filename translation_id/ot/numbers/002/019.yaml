lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: Pasukannya
  rationale: Dalam konteks pengaturan perkemahan dan sensus, צָבָא menunjuk pada kelompok terorganisasi yang siap menjalankan tugas, dengan nuansa kemiliteran. “Pasukan” alami dalam bahasa Indonesia dan sesuai dengan konteks ini.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terhitung dari antara mereka
  rationale: Bentuk dari פקד di sini menunjuk kepada orang-orang yang didata atau dihitung dalam sensus. Frasa ini mempertahankan akhiran jamak “mereka” tanpa mengubahnya menjadi rujukan tunggal.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: empat puluh ribu lima ratus
  rationale: Bilangan kardinal Ibrani diterjemahkan langsung ke dalam bentuk bilangan Indonesia yang wajar.
