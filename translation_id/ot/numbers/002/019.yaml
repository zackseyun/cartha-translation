  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: id
  text: Pasukannya, yaitu orang-orang yang terdaftar,[a] berjumlah empat puluh ribu lima ratus orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang dihitung.” Istilah Ibrani ini dapat menunjuk kepada orang-orang yang didaftarkan atau dihitung untuk bertugas dalam sensus.
