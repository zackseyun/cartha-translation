  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: id
  text: Orang Israel harus berkemah, masing-masing di bawah panjinya, menurut tanda-tanda kaum keluarga mereka menurut garis ayah. Mereka harus berkemah menghadap Kemah Pertemuan, di sekelilingnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: masing-masing
  rationale: Nomina tunggal ini dipakai secara distributif. Dalam bahasa Indonesia, “masing-masing” menyampaikan pembagian per orang secara alami tanpa perlu menambahkan kata berpenanda gender yang terasa kaku dalam konteks ini.
- source_word: דִּגְלוֹ
  choice: dekat panjinya
  rationale: דֶּגֶל menunjuk pada panji pengenal kelompok suku atau pasukan. “Panji” tepat, ringkas, dan wajar dalam bahasa Indonesia; preposisi ב menandai lokasi atau keterkaitan dengan panji tersebut.
- source_word: בְאֹתֹת
  choice: menurut tanda
  rationale: אוֹת menunjuk pada tanda atau lambang pengenal. “Menurut” mengungkapkan bahwa penataan perkemahan mengikuti tanda-tanda kaum leluhur, tanpa menentukan secara berlebihan bentuk fisik tanda itu.
- source_word: לְבֵית אֲבֹתָם
  choice: kaum leluhur mereka
  rationale: בֵּית אָבוֹת adalah unit kekerabatan berdasarkan garis ayah. “Kaum leluhur” mempertahankan gagasan kelompok kekerabatan turun-temurun dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: יַחֲנוּ
  choice: harus berkemah
  rationale: Bentuk imperfek dalam konteks instruksi menyatakan ketentuan. “Harus berkemah” menyampaikan daya perintah secara jelas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” merupakan idiom kolektif bagi bangsa Israel. “Orang Israel” adalah padanan Indonesia modern yang alami dan tidak menimbulkan kesan bahwa hanya anak-anak yang dimaksud.
- source_word: מִנֶּגֶד
  choice: menghadap
  rationale: Kata ini menyatakan posisi di seberang atau berhadapan dengan sesuatu. “Menghadap” sesuai dengan tata letak perkemahan yang berorientasi kepada Kemah Pertemuan.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Adverbia ini menunjukkan susunan mengelilingi pada berbagai sisi; akhiran “-nya” secara alami merujuk pada Kemah Pertemuan.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan langsung ini mempertahankan unsur “kemah” dan “pertemuan” serta menghindari istilah tradisional yang kurang transparan.
theological_decisions:
- issue: Bahasa kekerabatan kolektif
  choice: Orang Israel
  alternative: anak-anak Israel
  rationale: בְּנֵי יִשְׂרָאֵל adalah idiom etnis-kovenantal, bukan pembatasan usia. Padanan alami “Orang Israel” menyampaikan rujukannya dengan jelas tanpa meniadakan identitas bangsa yang berasal dari Israel.
- issue: Istilah tempat ibadah
  choice: Kemah Pertemuan
  alternative: Kemah Suci
  rationale: אֹהֶל מוֹעֵד secara leksikal berarti kemah pertemuan atau perjumpaan. Terjemahan langsung dipilih agar tidak mengganti istilah sumber dengan sebutan tradisional yang menggeser penekanannya.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur dua kalimat mempertahankan pengulangan verba Ibrani dan memperjelas susunan perkemahan. Kapitalisasi “Kemah Pertemuan” menandai nama khusus tempat ibadah.
