base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: id
  text: Semua orang yang terdaftar dalam perkemahan Ruben berjumlah 151.450 orang, menurut kelompok-kelompok militer mereka.[a] Mereka akan berangkat sebagai yang kedua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut bala tentara mereka” atau “menurut pasukan-pasukan mereka.”
    reason: Menjaga rentang makna צְבָאֹתָם, yang dapat menunjuk bala tentara, pasukan, atau kelompok militer yang terorganisasi.
  - marker: b
    text: Secara harfiah, “dan mereka akan berangkat sebagai yang kedua,” yang menunjukkan tempat perkemahan itu dalam urutan perjalanan.
    reason: Menjelaskan bentuk ungkapan Ibrani dan fungsi bilangannya dalam urutan keberangkatan.
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: semua orang yang terhitung
  rationale: Menyampaikan cakupan menyeluruh כָּל dan makna partisip pasif הַפְּקֻדִים sebagai mereka yang didata dalam sensus, tanpa mempersempitnya dengan keterangan yang tidak eksplisit.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: dalam perkemahan Ruben
  rationale: Dalam konteks susunan suku, לְ menandai keterkaitan dengan kelompok perkemahan Ruben; bentuk ini alami dalam bahasa Indonesia.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 151.450 orang
  rationale: Angka ditulis dengan digit agar mudah dibaca dalam konteks sensus; tanda titik mengikuti kaidah Indonesia sebagai pemisah ribuan. 'Orang' melengkapi bilangan secara alami berdasarkan mereka yang terhitung.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: צְבָאוֹת menunjuk kelompok-kelompok militer yang terorganisasi. 'Pasukan-pasukan' mempertahankan nuansa militer dan bentuk jamaknya.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Mereka harus berangkat pada urutan kedua
  rationale: Ungkapan ini menyatakan posisi perkemahan tersebut dalam urutan perjalanan. 'Berangkat' sesuai dengan נסע dalam konteks perjalanan di padang gurun, sedangkan 'pada urutan kedua' membuat fungsi ordinalnya jelas.
