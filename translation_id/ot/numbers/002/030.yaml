lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: dan pasukannya
  rationale: צָבָא menunjuk pada kelompok suku yang tertata seperti kesatuan militer. Dalam konteks pengaturan perkemahan dan sensus, “pasukan” mempertahankan nuansa organisasi serta militernya tanpa menyiratkan bahwa pertempuran sedang berlangsung.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terhitung
  rationale: Bentuk dari פקד di sini merujuk kepada orang-orang yang didata dalam sensus. “Mereka yang terhitung” menyampaikan makna pendataan dan mempertahankan sufiks jamak tanpa menentukan rujukannya lebih jauh daripada teks sumber.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: lima puluh tiga ribu empat ratus orang
  rationale: Urutan bilangan disesuaikan dengan idiom Indonesia modern sambil mempertahankan jumlah tepat 53.400. “Orang” ditambahkan secara wajar sebagai penggolong bilangan manusia berdasarkan konteks sensus.
