source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: id
  text: Demikianlah orang Israel[a] melakukan segala sesuatu yang diperintahkan Yahweh kepada Musa. Mereka berkemah menurut panji-panji mereka[b] dan berangkat demikian pula, masing-masing menurut marga-marganya, menurut keluarga leluhur mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “putra-putra Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di bawah panji-panji mereka.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “menurut rumah bapak-bapaknya,” yaitu kelompok keluarga menurut garis leluhur pihak bapak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: melakukan
  rationale: Kata kerja עשה merangkum ketaatan Israel dalam melaksanakan seluruh perintah yang telah diberikan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini menunjuk kepada bangsa Israel secara kolektif; 'orang Israel' alami dan jelas dalam bahasa Indonesia modern.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala yang
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari konstruksi Ibrani tanpa menghasilkan ungkapan yang kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, sesuai dengan bentuk Tetragramaton dalam teks sumber.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: diperintahkan ... kepada Musa
  rationale: Bentuk pasif Indonesia menghasilkan susunan yang alami sambil tetap menyatakan Yahweh sebagai pemberi perintah dan Musa sebagai penerimanya.
- source_word: כֵּן ... וְכֵן
  choice: Demikianlah ... dan demikian pula
  rationale: Pengulangan dipertahankan untuk menonjolkan kesesuaian tindakan Israel dengan perintah Yahweh.
- source_word: חָנוּ
  choice: berkemah
  rationale: Padanan Indonesia modern yang langsung dan wajar untuk tindakan mendirikan atau menempati perkemahan.
- source_word: לְדִגְלֵיהֶם
  choice: menurut panji-panji mereka
  rationale: דֶּגֶל merujuk pada panji yang menandai dan mengatur kelompok-kelompok perkemahan; 'menurut' menyampaikan penataan berdasarkan panji tersebut.
- source_word: נָסָעוּ
  choice: berangkat
  rationale: Dalam konteks perpindahan perkemahan, kata ini menyatakan bahwa mereka mulai bergerak menempuh perjalanan.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ berfungsi secara distributif di sini; 'masing-masing' menyampaikan fungsi itu dengan alami tanpa membatasi rujukannya hanya kepada individu laki-laki.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: menurut kaumnya
  rationale: מִשְׁפָּחָה dalam susunan suku Israel menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti; 'kaum' sesuai dengan tingkat sosial tersebut.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: menurut keluarga leluhurnya
  rationale: Ungkapan ini menunjuk pada rumah atau kelompok keturunan dari garis bapak; pilihan ini menyampaikan struktur leluhur secara jelas tanpa terjemahan harfiah yang janggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur pengulangan Ibrani dipertahankan melalui 'Demikianlah ... dan demikian pula', sedangkan istilah sosial kuno dijelaskan secara ringkas dalam catatan kaki.
