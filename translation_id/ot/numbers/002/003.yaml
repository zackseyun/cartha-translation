  text: וְ/הַ/חֹנִים֙ קֵ֣דְמָ/ה מִזְרָ֔חָ/ה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: id
  text: Di sebelah timur, ke arah matahari terbit, berkemahlah pasukan-pasukan di bawah panji perkemahan Yehuda menurut kelompok-kelompok mereka. Pemimpin keturunan Yehuda ialah Nahason anak Aminadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: panji
  rationale: Mempertahankan gambaran konkret tentang tanda pengenal utama perkemahan, sekaligus memungkinkan makna kelompok yang berhimpun di bawah panji itu.
- source_word: לְצִבְאֹתָם
  choice: menurut kelompok-kelompok mereka
  rationale: צָבָא di sini menunjuk pada susunan kelompok atau pasukan Israel; 'kelompok-kelompok' terdengar alami dalam konteks penataan perkemahan tanpa membatasi maknanya pada tentara profesional.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Padanan modern dan umum bagi kepala atau tokoh utama suatu suku.
- source_word: בְנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Dalam konteks suku, ungkapan ini bersifat genealogis dan mencakup seluruh anggota suku, bukan hanya anak-anak langsung Yehuda.
- source_word: קֵדְמָה מִזְרָחָה
  choice: di sebelah timur, ke arah matahari terbit
  rationale: Mencerminkan dua keterangan arah yang berdekatan dalam teks Ibrani dan mempertahankan ungkapan orientasionalnya.
