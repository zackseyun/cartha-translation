  text: 'dan pasukannya, yaitu mereka yang terhitung: 59.300 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: beserta pasukannya
  rationale: Dalam konteks sensus dan penataan perkemahan, צָבָא menunjuk pada kelompok atau kontingen suku yang diatur untuk tugas militer. “Pasukan” alami dalam bahasa Indonesia modern dan mempertahankan nuansa organisasional-militernya; sufiks orang ketiga tunggal diterjemahkan “-nya”.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terhitung
  rationale: Bentuk dari פקד ini menunjuk kepada orang-orang yang telah dihitung dalam sensus. “Mereka yang terhitung” mempertahankan makna pasif dan tidak secara tersendiri menambahkan unsur yang tidak dinyatakan dalam frasa Ibrani.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: 59.300 orang
  rationale: Ungkapan Ibrani bernilai lima puluh sembilan ribu tiga ratus. Penulisan angka dengan tanda titik sebagai pemisah ribuan lazim dalam bahasa Indonesia; “orang” ditambahkan secara wajar untuk memperjelas bahwa jumlah itu menghitung anggota pasukan.
