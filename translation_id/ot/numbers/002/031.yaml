  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: id
  text: Seluruh orang yang terdaftar dalam perkemahan Dan berjumlah 157.600 orang. Mereka harus berangkat paling belakang menurut panji-panji mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di bawah panji-panji mereka.” Istilah Ibrani ini dapat merujuk pada panji-panji suku atau kelompok-kelompok yang tersusun di bawah panji-panji itu dalam tata perkemahan Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: semua orang yang terhitung
  rationale: Bentuk pasif dari פקד menunjuk kepada mereka yang telah dihitung atau didaftarkan dalam sensus. Ungkapan ini mempertahankan cakupan כָּל dan tidak menambahkan keterangan yang tidak diulang secara eksplisit dalam ayat ini.
- source_word: לְמַחֲנֵה דָן
  choice: dalam perkemahan Dan
  rationale: Frasa ini menyatakan hubungan dengan kelompok perkemahan yang dipimpin suku Dan; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran tata perkemahan Israel.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 157.600 orang
  rationale: Angka ditulis dengan format angka Indonesia untuk keterbacaan, sambil mempertahankan jumlah persisnya. Kata 'orang' melengkapi konstruksi Indonesia karena angka itu menghitung orang-orang yang disebut pada awal ayat.
- source_word: לָאַחֲרֹנָה
  choice: paling belakang
  rationale: Kata ini menunjukkan urutan perjalanan dan, dalam konteks barisan perkemahan, secara alami berarti menempati posisi terakhir atau paling belakang.
- source_word: יִסְעוּ
  choice: harus berangkat
  rationale: Dalam kisah perjalanan di padang gurun, נסע berarti mulai bergerak atau berangkat dari tempat perkemahan. Bentuk imperfek dalam ketentuan tata perjalanan diterjemahkan sebagai kewajiban yang berlaku.
- source_word: לְדִגְלֵיהֶם
  choice: menurut panji-panji mereka
  rationale: דגל menunjuk pada panji sekaligus kelompok yang tersusun di bawahnya. Terjemahan ini mempertahankan citra tata barisan perkemahan tanpa mempersempit maknanya hanya menjadi benda atau hanya menjadi kelompok.
