  terminology: “Laki-laki Israel yang terdaftar” sesuai dengan konteks sensus militer dan nominal Ibrani פְּקוּדֵי. “Kaum keluarga pihak ayah” mempertahankan struktur patrilineal בֵּית אָב, sedangkan “kesatuan-kesatuan” menerjemahkan צְבָאֹת sebagai pengelompokan yang teratur.
