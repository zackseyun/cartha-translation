source:
  edition: WLC
  text: אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל פְּקוּדֵ֤י הַֽ/מַּחֲנֹת֙ לְ/צִבְאֹתָ֔/ם שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: id
  text: Inilah laki-laki Israel[a] yang terdaftar[b] menurut kaum keluarga pihak ayah mereka. Jumlah seluruh yang terdaftar dari perkemahan-perkemahan itu, menurut kesatuan-kesatuan mereka[c], ialah 603.550 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; dapat juga diterjemahkan “orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang dihitung” atau “yang didaftarkan.” Dalam konteks sensus ini, yang dimaksud ialah laki-laki yang memenuhi syarat untuk dinas militer.
    reason: lexical_alternative
  - marker: c
    text: Atau “menurut pasukan-pasukan mereka” atau “menurut divisi-divisi mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: orang-orang ... yang dihitung
  rationale: Bentuk ini menunjuk kepada mereka yang didata dalam sensus. Kata 'orang-orang' wajar dalam bahasa Indonesia, sedangkan konteks sensus militer menjelaskan bahwa yang dimaksud adalah laki-laki yang memenuhi syarat.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan idiomatis ini menyatakan bangsa Israel. Pilihan tersebut alami dalam bahasa Indonesia modern tanpa mengubah identitas kolektifnya.
- source_word: לְבֵית אֲבֹתָם
  choice: menurut kaum leluhur mereka
  rationale: '''Kaum leluhur'' menyampaikan unit kekerabatan berdasarkan garis ayah dengan bahasa Indonesia yang alami dan bermartabat.'
- source_word: הַמַּחֲנֹת
  choice: perkemahan-perkemahan
  rationale: Bentuk jamak dipertahankan karena menunjuk kepada berbagai kelompok perkemahan suku di sekeliling Kemah Suci.
- source_word: לְצִבְאֹתָם
  choice: menurut pasukan mereka
  rationale: צְבָאוֹת menunjuk kepada kelompok-kelompok yang tersusun untuk pelayanan militer; 'pasukan' mempertahankan nuansa tersebut tanpa menyiratkan bahwa pertempuran sedang berlangsung.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '603.550'
  rationale: Penulisan angka dengan pemisah ribuan Indonesia menyampaikan jumlah Ibrani secara tepat dan mudah dibaca.
theological_decisions:
- issue: Gender dalam bahasa sensus
  choice: orang-orang yang dihitung, dengan catatan bahwa konteksnya adalah laki-laki
  alternative: laki-laki yang dihitung
  rationale: Ayat ini sendiri tidak memuat kata tersendiri untuk 'laki-laki', walaupun konteks Bilangan 1–2 menetapkan bahwa sensus militer mencakup laki-laki yang memenuhi syarat. Terjemahan utama tidak menambahkan unsur leksikal itu secara diam-diam, sementara catatan menjelaskan referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat mengikuti struktur ringkasan sensus dalam bahasa Ibrani. Istilah kekerabatan dan kemiliteran dibuat jelas bagi pembaca umum tanpa menghilangkan latar patrilineal dan organisasi pasukan.
