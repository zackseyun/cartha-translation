  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: id
  text: Dan suku Gad; pemimpin bani Gad ialah Elyasaf anak Rehuel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah atau bagian paralel menyebut nama ayahnya Deuel (lihat Bil. 1:14).
