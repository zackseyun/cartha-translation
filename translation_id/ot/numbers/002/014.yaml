lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: Lalu suku
  rationale: Dalam konteks pengaturan perkemahan, מַטֶּה berarti suku, bukan tongkat. וְ diterjemahkan 'Lalu' agar alur daftar terdengar alami dalam bahasa Indonesia.
- source_word: גָּד
  choice: Gad
  rationale: Nama suku dipertahankan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְ/נָשִׂיא
  choice: Pemimpin
  rationale: נָשִׂיא di sini menunjuk kepada kepala resmi suku; 'pemimpin' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לִ/בְנֵי גָד
  choice: bani Gad
  rationale: Ungkapan ini menunjuk kepada kelompok keturunan Gad. 'Bani Gad' ringkas, dikenal dalam ragam bahasa Alkitab Indonesia, dan mempertahankan gagasan garis keturunan.
- source_word: אֶלְיָסָף
  choice: Elyasaf
  rationale: Nama orang dialihaksarakan dalam bentuk Indonesia yang jelas dan konsisten.
- source_word: בֶּן
  choice: anak
  rationale: Rumus patronimik Ibrani diterjemahkan langsung sebagai 'anak'.
- source_word: רְעוּאֵל
  choice: Rehuel
  rationale: Teks Masoret yang menjadi sumber utama berbunyi רְעוּאֵל; bentuk ini diterjemahkan 'Rehuel' dan tidak diselaraskan diam-diam dengan bacaan paralel 'Deuel'.
