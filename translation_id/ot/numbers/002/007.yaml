  rationale: Nama suku dan nama leluhur ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְנָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks administratif ini, נָשִׂיא adalah kepala yang diakui bagi suatu suku; 'pemimpin' jelas dan tidak memberi kesan monarki seperti 'pangeran'.
- source_word: לִבְנֵי זְבוּלֻן
  choice: bani Zebulon
  rationale: Ungkapan ini mempertahankan bahasa keturunan kolektif Ibrani secara alami dan bermartabat dalam bahasa Indonesia; preposisi ל menyatakan hubungan dengan anggota suku tersebut.
- source_word: אֱלִיאָב
  choice: Eliab
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: בֶּן חֵלֹן
  choice: anak Helon
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara langsung dan alami.
