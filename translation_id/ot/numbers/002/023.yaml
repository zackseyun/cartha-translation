translation:
  language: id
  text: dan pasukannya[a], yaitu mereka yang terdaftar, berjumlah 35.400 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompoknya” atau “pasukannya”; kata Ibrani ini dapat menunjuk pada kelompok atau kesatuan yang tertata secara militer dalam susunan suku-suku, sensus, dan perkemahan di padang gurun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: dan pasukannya
  rationale: צָבָא menunjuk pada kelompok suku yang tertata sebagai kesatuan bergaya militer dalam susunan perkemahan Israel. 'Pasukan' alami dalam bahasa Indonesia dan mempertahankan nuansa organisasional-militernya tanpa menyatakan bahwa mereka sedang bertempur.
- source_word: וּפְקֻדֵיהֶם
  choice: yaitu mereka yang terhitung di antara mereka
  rationale: Bentuk dari פקד di sini mengacu pada orang-orang yang didata atau dihitung dalam sensus. Ungkapan ini mempertahankan akhiran jamak 'mereka' dan menghubungkan kelompok yang dihitung dengan jumlah sesudahnya.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 35.400 orang
  rationale: Angka Ibrani tersebut berjumlah tepat tiga puluh lima ribu empat ratus. Penulisan angka dan penambahan kata penggolong 'orang' membuat jumlah itu jelas dan alami dalam bahasa Indonesia modern.
