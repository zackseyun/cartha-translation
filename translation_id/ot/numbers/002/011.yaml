  text: And his company, even those numbered from it, was forty-six thousand five hundred.
translation:
  language: id
  text: Pasukannya, yaitu mereka yang terhitung di dalamnya, berjumlah 46.500 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: pasukannya
  rationale: Dalam konteks sensus dan perkemahan di Bilangan, צָבָא menunjuk pada kesatuan suku yang ditata seperti pasukan. “Pasukannya” alami dalam bahasa Indonesia dan mempertahankan nuansa organisasi militer tanpa menyiratkan bahwa pertempuran sedang berlangsung.
- source_word: פְקֻדָיו
  choice: mereka yang terhitung di dalamnya
  rationale: Bentuk dari פקד ini dipakai dalam arti sensus, yakni orang-orang yang didata sebagai bagian dari pasukan tersebut. Frasa ini mempertahankan hubungan pronominal dengan kesatuan yang baru disebut.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: 46.500 orang
  rationale: Jumlah Ibrani dinyatakan menurut tata angka Indonesia modern. Kata “orang” ditambahkan secara wajar untuk memperjelas bahwa angka itu adalah jumlah orang yang terhitung.
