lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: dan pasukannya
  rationale: צָבָא menunjuk pada kelompok militer suku yang tersusun dalam perkemahan. “Pasukan” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa militernya; akhiran orang ketiga maskulin tunggal diterjemahkan “-nya”.
- source_word: וּפְקֻדָיו
  choice: yaitu mereka yang terhitung di dalamnya
  rationale: Bentuk dari פקד menunjuk pada orang-orang yang telah dihitung atau didata dalam sensus. Dalam susunan ini frasa tersebut paling wajar dipahami sebagai penjelasan tentang jumlah pasukan, sehingga waw kedua diterjemahkan secara eksplikatif dengan “yaitu”, tanpa membatasi mereka lebih jauh daripada teks sumber.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 54.400 orang
  rationale: Jumlah Ibrani diterjemahkan menurut tata angka Indonesia modern. “Orang” ditambahkan secara wajar karena angka itu menyatakan jumlah mereka yang terhitung.
