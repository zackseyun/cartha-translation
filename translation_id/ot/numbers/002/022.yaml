base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: id
  text: Lalu suku Benyamin; pemimpin bani Benyamin[a] ialah Abidan anak Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemimpin bagi bani Benyamin.” Preposisi Ibrani di sini dapat diterjemahkan dengan lebih dari satu cara yang maknanya berdekatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pengaturan perkemahan Israel di Bilangan, kata ini menunjuk pada kelompok suku, bukan tongkat secara harfiah.
- source_word: בִּנְיָמִן
  choice: Benyamin
  rationale: Nama diri dan nama suku ini ditulis menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Kata ini menunjuk pada kepala resmi yang mewakili suku; 'pemimpin' jelas dalam bahasa Indonesia modern dan tidak menimbulkan kesan jabatan kerajaan seperti 'pangeran'.
- source_word: לִבְנֵי בִנְיָמִן
  choice: bani Benyamin
  rationale: Ungkapan ini mempertahankan gambaran kekerabatan Ibrani dan secara alami menunjuk pada keturunan atau kelompok suku Benyamin. Nuansa preposisi ל dijelaskan dalam catatan kaki.
- source_word: אֲבִידָן
  choice: Abidan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן גִּדְעֹנִי
  choice: anak Gideoni
  rationale: Konstruksi patronimik Ibrani diterjemahkan langsung dan wajar dalam bahasa Indonesia.
