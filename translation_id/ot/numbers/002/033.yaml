  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: id
  text: Namun, orang-orang Lewi tidak dihitung di antara orang Israel, sebagaimana Yahweh telah memerintahkan Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; dapat juga diterjemahkan “keturunan Israel” atau, secara tradisional, “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Namun, orang-orang Lewi
  rationale: Konjungsi ו menandai kontras dengan jumlah sensus sebelumnya. “Namun” menyampaikan alur itu secara alami; “orang-orang Lewi” adalah sebutan baku dan jelas.
- source_word: לֹא הָתְפָּקְדוּ
  choice: tidak dihitung
  rationale: Bentuk hitpael dari פקד dalam konteks sensus menyatakan bahwa mereka tidak dimasukkan dalam penghitungan atau pendaftaran. “Tidak dihitung” ringkas dan sesuai konteks.
- source_word: בְּ/תוֹךְ
  choice: di antara
  rationale: Frasa ini menunjukkan keikutsertaan dalam kelompok yang lebih besar; “di antara” merupakan padanan Indonesia yang alami.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam pemakaian kolektif menunjuk kepada bangsa yang berasal dari Israel. “Keturunan Israel” alami, inklusif sesuai cakupan konteks, dan tetap mempertahankan hubungan genealogis; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: כַּ/אֲשֶׁר
  choice: seperti yang
  rationale: Memperkenalkan kesesuaian tindakan dengan perintah ilahi yang telah diberikan sebelumnya.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Perfek Ibrani merujuk pada perintah yang telah diberikan sebelum laporan sensus ini. Dalam bahasa Indonesia, urutan waktunya sudah jelas dari konteks tanpa bentuk pluskuamperfek khusus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: Penanda objek langsung אֶת tidak diterjemahkan tersendiri; verba Indonesia “memerintahkan” dalam konstruksi pasif ini secara alami memakai “kepada Musa” untuk pihak yang menerima perintah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Ungkapan maskulin Ibrani secara idiomatis dapat menunjuk komunitas Israel secara kolektif. “Keturunan Israel” menjaga unsur asal-usul tanpa membatasi rujukan hanya kepada laki-laki, sedangkan bentuk harfiahnya tetap tersedia dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” mempertahankan kontras wacana; “orang-orang Lewi” lebih wajar daripada bentuk tunggal kolektif; susunan kalimat mengikuti bahasa Indonesia alami tanpa menghilangkan isi sumber.
