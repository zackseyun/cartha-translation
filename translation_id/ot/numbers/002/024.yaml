  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: id
  text: Jumlah semua orang yang terdaftar dari perkemahan Efraim adalah 108.100 orang, menurut pasukan-pasukan mereka.[a] Mereka akan berangkat sebagai kelompok ketiga.
