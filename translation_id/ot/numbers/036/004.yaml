  source_fidelity: 'Terjemahan pada dasarnya mengikuti struktur dan konsekuensi hukum dalam Ibrani: tibanya Yobel, penambahan milik pusaka perempuan kepada milik pusaka suku lain, dan pengurangan dari suku asal. Namun, “suku tempat mereka menjadi anggota” kurang idiomatis dan menggeser hubungan yang dinyatakan klausa Ibrani menjadi keterangan tempat.'
  naturalness: Bahasa umumnya baku dan jelas. “Suku yang mereka masuki” lebih alami daripada “suku tempat mereka menjadi anggota,” tanpa perlu menambahkan mekanisme perkawinan yang tersirat dari konteks lebih luas, tetapi tidak dinyatakan secara eksplisit dalam ayat ini.
  terminology: “Tahun Yobel,” “orang Israel,” “milik pusaka,” dan “suku” sesuai dengan istilah dan register Alkitab bahasa Indonesia modern. “Suku nenek moyang kami” lebih idiomatis untuk מַטֵּה אֲבֹתֵינוּ daripada “suku leluhur kami,” sambil tetap menunjukkan asal-usul kesukuan para penutur.
  issues:
