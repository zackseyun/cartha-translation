    rationale: Klausa אֲשֶׁר תִּהְיֶינָה לָהֶם menghubungkan para perempuan dengan suku penerima. Kata “tempat” tidak ada dalam sumber dan menjadikan hubungan itu seolah-olah lokasi. “Suku yang mereka masuki” menyampaikan hubungan tersebut secara lebih langsung dan wajar.
  - severity: low
    issue: “Suku leluhur kami” agak kurang idiomatis dalam konteks pembagian pusaka kesukuan.
    rationale: “Suku nenek moyang kami” merupakan ungkapan Indonesia yang lebih lazim bagi frasa harfiah “suku ayah-ayah kami” dan mempertahankan makna asal-usul kesukuan.
