  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: id
  text: Apabila tahun Yobel tiba bagi orang Israel[a], milik pusaka para perempuan itu akan ditambahkan pada milik pusaka suku yang mereka masuki, dan milik pusaka mereka akan dikurangi dari milik pusaka suku nenek moyang kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bagi putra-putra Israel”; dapat juga diterjemahkan “bagi anak-anak Israel.”'
    reason: Menjelaskan bentuk ungkapan Ibrani בְנֵי יִשְׂרָאֵל dan alternatif terjemahannya tanpa membuat teks utama menjadi kaku.
lexical_decisions:
- source_word: וְאִם
  choice: Apabila
  rationale: Gabungan partikel ini dapat berarti “dan jika.” Dalam argumen hukum ini, “apabila” mempertahankan unsur persyaratan sekaligus menyampaikan suatu peristiwa mendatang yang diperkirakan akan terjadi.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: tahun Yobel tiba
  rationale: Kata kerja היה bersama יוֹבֵל menunjuk pada tibanya peristiwa kalender tersebut. “Tahun Yobel” merupakan istilah Indonesia yang jelas dan mapan.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Secara harfiah frasa ini berbunyi “bagi anak-anak lelaki Israel,” tetapi dalam konteks ini berfungsi sebagai sebutan kolektif bagi bangsa Israel. Pilihan yang alami dicantumkan dalam teks, sedangkan bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: וְנוֹסְפָה
  choice: akan ditambahkan
  rationale: 'Bentuk Nifal menyatakan hasil pasif: milik pusaka itu menjadi bagian tambahan pada jatah suku lain. Bentuk mendatang sesuai dengan akibat hukum yang sedang dipaparkan.'
- source_word: נַחֲלָתָן
  choice: milik pusaka para perempuan itu / milik pusaka mereka
  rationale: נחלה di sini ialah tanah warisan turun-temurun dalam pembagian suku. Akhiran feminin jamak merujuk kepada para perempuan yang dibicarakan, sehingga rujukan itu diperjelas pada penyebutan pertama.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: kepada milik pusaka suku
  rationale: Dengan יסף, preposisi על menyatakan penambahan kepada jatah lain. “Kepada” menghasilkan ungkapan Indonesia yang wajar, dan מטה berarti “suku” dalam konteks pembagian tanah.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: tempat mereka menjadi anggota
  rationale: Ungkapan Ibrani harfiahnya kaku dalam bahasa Indonesia dan dalam konteks menunjuk kepada suku yang akan dimasuki para perempuan itu melalui perkawinan. Terjemahan ini menyampaikan hubungan tersebut tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: dari milik pusaka suku leluhur kami
  rationale: Frasa ini membedakan suku penerima dari suku asal para pembicara. “Leluhur kami” menyampaikan אֲבֹתֵינוּ secara alami dalam konteks warisan antargenerasi.
- source_word: יִגָּרַע
  choice: akan dikurangi
  rationale: Bentuk Nifal dari גרע menyatakan pengurangan atau pemindahan dari suatu bagian. “Akan dikurangi dari” mempertahankan gambaran hukum tentang berkurangnya jatah tanah suku asal.
