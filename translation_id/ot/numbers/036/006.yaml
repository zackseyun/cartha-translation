id: NUM.36.6
reference: Numbers 36:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: id
  text: 'Inilah ketetapan yang Yahweh perintahkan mengenai anak-anak perempuan Zelafehad: “Mereka boleh menikah dengan siapa saja yang mereka anggap baik[a], tetapi mereka hanya boleh menikah dengan laki-laki dari kaum dalam suku ayah mereka[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan yang baik di mata mereka”; atau, “dengan siapa pun yang mereka anggap paling baik.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dalam klan dari suku ayah mereka.” Bahasa Ibrani memakai istilah bagi kelompok kekerabatan dan suku untuk menegaskan bahwa perkawinan itu dibatasi pada garis suku pihak ayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Inilah perkara
  rationale: דָּבָר dapat berarti ‘perkataan’, ‘perkara’, atau ‘hal’. Dalam konteks keputusan resmi ini, ‘perkara’ terdengar wajar dan tetap mempertahankan nuansa ketetapan yang sedang diumumkan.
- source_word: צִוָּה יְהוָה
  choice: yang diperintahkan Yahweh
  rationale: צוה menyatakan perintah yang mengikat. Bentuk lampau Ibrani diterjemahkan secara alami sebagai ‘diperintahkan’, sedangkan nama perjanjian יְהוָה ditransliterasikan ‘Yahweh’.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: mengenai anak-anak perempuan Zelafehad
  rationale: Preposisi ל dapat menandai pihak yang menjadi sasaran atau pokok perintah. ‘Mengenai’ cocok karena ketetapan ini berlaku atas mereka, sementara Musa menyampaikannya kepada umat.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: dengan siapa pun yang mereka pandang baik
  rationale: Ungkapan harfiahnya ialah ‘kepada yang baik di mata mereka’. Pilihan ini mempertahankan citra penilaian pribadi dalam idiom Ibrani sekaligus jelas dalam bahasa Indonesia.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: mereka boleh menikah
  rationale: Secara harfiah, frasa ini berarti ‘hendaklah mereka menjadi istri’. Dalam klausa pertama bentuk itu memberi izin, sehingga ‘boleh menikah’ menyampaikan fungsinya secara alami tanpa menentukan calon suami yang tidak disebutkan.
- source_word: אַךְ
  choice: tetapi ... hanya
  rationale: אַךְ membatasi izin yang baru diberikan. Gabungan ‘tetapi ... hanya’ menandai pembatasan itu dengan jelas dalam bahasa Indonesia.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: di dalam kaum dari suku ayah mereka
  rationale: מִשְׁפָּחָה menunjuk kelompok kekerabatan atau kaum, sedangkan מַטֶּה menunjuk suku. Terjemahan ini mempertahankan kedua tingkat struktur sosial tersebut dan garis keturunan pihak ayah.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: mereka hanya boleh menikah
  rationale: Pengulangan frasa yang sama kini berada di bawah pembatasan אַךְ. Dalam bahasa Indonesia, ‘hanya boleh menikah’ mengungkapkan kewajiban untuk memilih pasangan dalam lingkup yang ditentukan tanpa menyiratkan bahwa mereka diwajibkan untuk menikah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu dan membedakannya dari gelar umum bagi Tuhan.
- issue: Apakah para anak perempuan itu diwajibkan menikah
  choice: Izin menikah dibatasi pada kaum dari suku ayah mereka
  alternative: Mereka diwajibkan untuk menikah, dan harus dengan anggota kaum tersebut
  rationale: Klausa pertama memberi kebebasan memilih, lalu אַךְ membatasi lingkup pilihan. Terjemahan ‘hanya boleh menikah’ menjaga pembatasan hukum tanpa menambahkan kewajiban mutlak untuk menikah yang tidak dinyatakan secara tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Menikah’ dipilih daripada ungkapan harfiah ‘menjadi istri’ agar alami bagi pembaca umum. ‘Kaum’ mempertahankan unsur kekerabatan tanpa menyamakannya begitu saja dengan keluarga inti; catatan kaki menyediakan ‘marga’ sebagai kemungkinan padanan kontekstual.
