- from: 'Inilah perkara yang diperintahkan Yahweh mengenai anak-anak perempuan Zelafehad: “Mereka boleh menikah dengan siapa pun yang mereka pandang baik[a], tetapi mereka hanya boleh menikah di dalam kaum dari suku ayah mereka[b].”'
  to: 'Inilah ketetapan yang Yahweh perintahkan mengenai anak-anak perempuan Zelafehad: “Mereka boleh menikah dengan siapa saja yang mereka anggap baik[a], tetapi mereka hanya boleh menikah dengan laki-laki dari kaum dalam suku ayah mereka[b].”'
  rationale: 'Revisi mempertahankan izin pada klausa pertama dan pembatasan yang tegas pada klausa kedua. "Dengan laki-laki dari kaum dalam suku ayah mereka" menyatakan secara alami dalam bahasa Indonesia bahwa pembatasan itu menyangkut asal kelompok kekerabatan pasangan, sambil tetap mempertahankan dua tingkat istilah Ibrani: kaum/klan dan suku. Tidak ada perubahan doktrinal atau penambahan kewajiban untuk menikah.'
