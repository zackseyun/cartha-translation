  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: id
  text: Itulah perintah-perintah dan ketetapan-ketetapan yang Yahweh perintahkan melalui Musa kepada umat Israel[a] di dataran Moab, di tepi Sungai Yordan dekat Yerikho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; ungkapan perjanjian ini menunjuk kepada umat Israel secara kolektif.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di tepi Sungai Yordan, berhadapan dengan Yerikho.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Kata penunjuk jamak ini membuka rumusan penutup yang merangkum ketentuan sebelumnya; bahasa Indonesia tidak menandai jumlah pada pronomina penunjuk.
- source_word: הַמִּצְוֺת
  choice: perintah-perintah
  rationale: Menjaga makna legal מִצְוָה dan hubungan leksikalnya dengan verba צִוָּה.
- source_word: וְהַמִּשְׁפָּטִים
  choice: dan ketetapan-ketetapan
  rationale: Dalam konteks hukum, מִשְׁפָּטִים menunjuk pada keputusan atau ketentuan hukum; 'ketetapan-ketetapan' terdengar alami dan berwibawa dalam bahasa Indonesia.
- source_word: צִוָּה
  choice: perintahkan
  rationale: Menyampaikan daya otoritatif verba Ibrani dan mempertahankan kaitannya dengan 'perintah-perintah'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks, bukan menggantinya dengan gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan harfiah 'dengan tangan Musa' merupakan idiom perantaraan; 'melalui Musa' menyampaikan fungsi Musa sebagai perantara secara wajar.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kepada umat Israel
  rationale: Secara harfiah 'kepada anak-anak lelaki Israel', tetapi sebagai ungkapan kolektif perjanjian menunjuk kepada bangsa Israel; 'umat Israel' alami dan tidak menyiratkan hanya laki-laki.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עַרְבֹת menunjuk pada kawasan dataran atau stepa; 'dataran Moab' merupakan padanan geografis yang jelas.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: di tepi Sungai Yordan, di seberang Yerikho
  rationale: עַל menandai lokasi di dekat Yordan, sedangkan konstruksi יַרְדֵּן יְרֵחוֹ secara ringkas mengaitkannya dengan Yerikho; terjemahan ini memperjelas letaknya di sisi seberang dari Yerikho tanpa menghapus alternatif sintaksis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu dan merupakan transliterasi ilmiah yang lazim.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak lelaki Israel
  rationale: Ungkapan tersebut secara bentuk berarti 'anak-anak lelaki Israel', tetapi dalam rumusan perjanjian ini berfungsi secara kolektif bagi bangsa Israel. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'perintah-perintah ... perintahkan' disengaja untuk mencerminkan hubungan kata dalam bahasa Ibrani. Nama geografis 'Sungai Yordan' dibuat eksplisit agar segera dipahami pembaca umum.
