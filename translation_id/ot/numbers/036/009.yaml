  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: id
  text: Janganlah milik pusaka beralih dari satu suku kepada suku yang lain, sebab setiap suku keturunan Israel harus berpegang teguh pada milik pusakanya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: beralih
  rationale: Dalam konteks hukum ini, verba tersebut menunjuk pada berpindahnya kepemilikan tanah pusaka dari satu suku ke suku lain, bukan gerakan berputar secara fisik.
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Istilah ini merujuk pada tanah warisan yang dialokasikan kepada suku-suku Israel; 'milik pusaka' mempertahankan unsur warisan sekaligus sifatnya sebagai kepemilikan.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: dari satu suku kepada suku yang lain
  rationale: Dalam konteks pembagian tanah, מַטֶּה berarti unit suku, bukan tongkat; bentuk ini menyampaikan perpindahan antarsuku dengan jelas.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi larangan sebelumnya.
- source_word: אִישׁ
  choice: setiap
  rationale: Kata ini berfungsi secara distributif terhadap suku-suku yang disebut sesudahnya, sehingga 'setiap' lebih alami daripada mempersonifikasikan suku sebagai seorang laki-laki.
- source_word: בְּנַחֲלָתוֹ
  choice: pada milik pusakanya sendiri
  rationale: Bersama דבק, frasa ini menyatakan keterikatan pada jatah tanah pusaka masing-masing.
- source_word: יִדְבְּקוּ
  choice: harus tetap berpegang
  rationale: Pilihan ini mempertahankan metafora 'melekat/berpegang erat' sambil menyatakan kewajiban hukum dan keberlanjutan kepemilikan.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: suku keturunan Israel
  rationale: Frasa ini mempertahankan hubungan genealogis dalam בְּנֵי יִשְׂרָאֵל secara alami dalam bahasa Indonesia, sementara bentuk tunggal 'setiap suku' mewakili jamak Ibrani secara distributif.
theological_decisions:
- issue: Ungkapan perjanjian yang bergender בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel / bani Israel
  rationale: '''Keturunan Israel'' mempertahankan makna genealogis harfiah ''anak-anak Israel'' tanpa memberi kesan bahwa yang dimaksud hanya laki-laki; dalam konteks ini ungkapan tersebut menunjuk umat Israel secara kolektif.'
- issue: Ketidakselarasan gramatikal antara אִישׁ ... יִדְבְּקוּ dan מַטּוֹת
  choice: setiap suku ... harus tetap berpegang pada milik pusakanya sendiri
  alternative: suku-suku ... masing-masing harus melekat pada milik pusakanya
  rationale: Terjemahan distributif ini mempertahankan maksud teks tanpa memaksakan pronomina maskulin tunggal kepada entitas kolektif; tidak ada ketegangan teologis yang diselesaikan secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang bermartabat. 'Janganlah' menyampaikan larangan normatif; 'milik pusaka' dipilih agar pembaca memahami bahwa yang dimaksud ialah warisan berupa kepemilikan tanah. Tidak diperlukan catatan kaki karena alternatif leksikal tidak memengaruhi makna pokok ayat.
