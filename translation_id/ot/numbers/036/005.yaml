base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: id
  text: 'Lalu Musa memerintahkan umat Israel sesuai dengan firman Yahweh[a]: “Suku keturunan Yusuf itu benar.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut mulut Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “Suku keturunan Yusuf berbicara dengan benar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata צוה menyatakan perintah yang berwibawa; “memerintahkan” mempertahankan daya tersebut secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Dalam konteks seluruh komunitas, idiom harfiah “anak-anak lelaki Israel” secara alami merujuk kepada umat Israel; pilihan ini jelas dan tidak memberi kesan hanya laki-laki yang dituju.
- source_word: עַל פִּי יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Ungkapan ini secara harfiah berarti “menurut mulut Yahweh” dan menyatakan bahwa perintah Musa bersumber dari perkataan serta wewenang ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Bentuk infinitif ini memperkenalkan perkataan langsung; “katanya” idiomatis setelah verba utama dalam bahasa Indonesia.
- source_word: כֵּן
  choice: benar
  rationale: Dalam konteks ini כֵּן menegaskan bahwa pernyataan atau permohonan pihak keturunan Yusuf tepat.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pembagian suku dan tanah pusaka, מַטֶּה berarti kelompok suku, bukan tongkat.
- source_word: בְנֵי יוֹסֵף
  choice: keturunan Yusuf
  rationale: Ungkapan kekerabatan ini menunjuk kepada kelompok-kelompok suku yang berasal dari Yusuf; “keturunan Yusuf” alami dan tepat dalam bahasa Indonesia.
- source_word: דֹּבְרִים
  choice: itu benar
  rationale: Partisip דבר secara harfiah berkaitan dengan berbicara, tetapi bersama כֵּן ungkapan tersebut secara idiomatis menilai bahwa apa yang mereka katakan benar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel
  rationale: Perintah ditujukan kepada komunitas perjanjian secara keseluruhan. “Umat Israel” mempertahankan cakupan kolektif dan menghindari pembatasan yang tidak dimaksudkan oleh idiom Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan sumber ilahi perintah Musa, nama Yahweh, serta nuansa bahwa perkataan suku keturunan Yusuf dinilai benar.
