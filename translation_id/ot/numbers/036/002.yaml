  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אֶת אֲדֹנִ/י֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֨ת אֶת הָ/אָ֧רֶץ בְּ/נַחֲלָ֛ה בְּ/גוֹרָ֖ל לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וַֽ/אדֹנִ/י֙ צֻוָּ֣ה בַֽ/יהוָ֔ה לָ/תֵ֗ת אֶֽת נַחֲלַ֛ת צְלָפְחָ֥ד אָחִ֖י/נוּ לִ/בְנֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: id
  text: Mereka berkata, “Yahweh telah memerintahkan tuanku untuk memberikan negeri itu sebagai milik pusaka kepada orang Israel[a] dengan undi. Tuanku juga telah diperintahkan oleh Yahweh untuk memberikan milik pusaka Zelafehad, saudara kami, kepada anak-anak perempuannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diterjemahkan “anak-anak Israel.”'
    reason: Menjelaskan bentuk gender gramatikal ungkapan Ibrani dan alternatif terjemahan kolektifnya.
lexical_decisions:
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat kepada Musa sebagai pemimpin manusia; bentuk ini mempertahankan rasa takzim tanpa menjadikannya gelar ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לָתֵת אֶת הָאָרֶץ
  choice: memberikan negeri itu
  rationale: נתן berarti memberikan, sedangkan הָאָרֶץ dalam konteks pembagian Kanaan secara alami diterjemahkan sebagai negeri itu.
- source_word: בְּנַחֲלָה
  choice: sebagai milik pusaka
  rationale: Menjaga makna hukum נחלה sebagai tanah atau bagian turun-temurun, dengan ungkapan Indonesia yang lazim dalam konteks Alkitab.
- source_word: בְּגוֹרָל
  choice: dengan membuang undi
  rationale: Menunjukkan sarana pembagian secara jelas dan alami, bukan sekadar hasil pembagian.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada orang Israel
  rationale: Ungkapan Ibrani harfiah 'anak-anak lelaki Israel' berfungsi sebagai sebutan kolektif bagi umat Israel; 'orang Israel' alami dan mencakup keseluruhan kelompok yang dimaksud.
- source_word: צֻוָּה בַיהוָה
  choice: telah diperintahkan oleh Yahweh
  rationale: Bentuk pasif menunjukkan bahwa Musa menerima perintah, dan ב menandai sumber atau pelaku perintah.
- source_word: נַחֲלַת צְלָפְחָד
  choice: milik pusaka Zelafehad
  rationale: Mempertahankan hubungan konstruksi sebagai bagian warisan yang berada dalam garis keluarga Zelafehad.
- source_word: אָחִינוּ
  choice: saudara kami
  rationale: Mempertahankan bahasa kekerabatan sumber tanpa mempersempitnya menjadi saudara kandung.
- source_word: לִבְנֹתָיו
  choice: kepada anak-anak perempuannya
  rationale: Menyatakan penerima perempuan secara eksplisit sesuai bentuk feminin jamak dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memuat nama perjanjian secara langsung; 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar אֲדֹנִי yang ditujukan kepada Musa.
- issue: Bahasa kolektif לִבְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel atau putra-putra Israel
  rationale: Dalam konteks ini frasa tersebut menunjuk secara korporat kepada umat Israel, bukan hanya laki-laki. Terjemahan utama menyampaikan rujukan kolektif secara wajar, sementara bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan 'tuanku' mempertahankan penghormatan para kepala kaum kepada Musa. Istilah 'milik pusaka' menjaga corak hukum pertanahan, sedangkan susunan kalimat dipecah menjadi dua agar jelas tanpa mengubah hubungan antarklausa.
