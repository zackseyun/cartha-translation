  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: id
  text: Jadi, milik pusaka bani Israel tidak boleh beralih dari satu suku kepada suku lain, sebab setiap orang dari bani Israel harus tetap berpegang pada milik pusaka suku leluhurnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: beralih
  rationale: Dalam konteks hukum pembagian tanah, verba ini menunjuk pada perpindahan kepemilikan atau keterikatan kesukuan suatu milik pusaka, bukan gerakan berputar secara harfiah.
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Istilah ini menyatakan tanah warisan yang menjadi bagian turun-temurun suatu keluarga dan suku; 'milik pusaka' mempertahankan nuansa hukum serta patrimonialnya.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: dari satu suku kepada suku lain
  rationale: מַטֶּה jelas berarti 'suku' dalam konteks pembagian tanah. Bentuk ini alami dalam bahasa Indonesia dan menegaskan perpindahan antarsuku.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan baku dan ringkas yang mempertahankan corak genealogis dari ungkapan Ibrani 'anak-anak lelaki Israel' tanpa menjadi janggal dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi larangan yang mendahuluinya.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Dalam konstruksi ini kata tersebut berfungsi distributif, yakni masing-masing anggota Israel, bukan terutama menekankan jenis kelamin individu.
- source_word: יִדְבְּקוּ
  choice: harus tetap berpegang pada
  rationale: דבק menyatakan keterikatan yang teguh. Tambahan 'tetap' menyampaikan kesinambungan keterikatan pada milik pusaka kesukuan, sedangkan 'harus' sesuai dengan daya normatif konteks hukum.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: pada milik pusaka suku leluhurnya
  rationale: Terjemahan ini mempertahankan hubungan milik pusaka dengan garis keturunan suku sambil menggunakan susunan Indonesia yang alami.
theological_decisions:
- issue: Bahasa genealogis bergender dalam ketentuan hukum korporat
  choice: bani Israel ... setiap orang ... leluhurnya
  alternative: anak-anak lelaki Israel ... masing-masing ... nenek moyangnya
  rationale: ‘Bani Israel’ mempertahankan identitas genealogis kolektif, sedangkan אִישׁ diterjemahkan secara distributif sebagai ‘setiap orang’. אֲבֹתָיו merujuk kepada garis leluhur pihak yang bersangkutan dan secara alami dapat diterjemahkan ‘leluhurnya’ tanpa mengubah ketentuan tentang warisan suku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. Susunan dibuat jelas bagi pembaca umum tanpa menghilangkan konsep milik pusaka turun-temurun dan keterikatan kesukuan.
