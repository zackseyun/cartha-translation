    issue: Penambahan kata “tetap”
    rationale: יִירְשׁוּ menyatakan agar bani Israel masing-masing memiliki/mewarisi warisan bapa-bapanya. Gagasan mempertahankan kepemilikan memang sesuai konteks, tetapi kata “tetap” tidak dinyatakan dan sebaiknya tidak ditambahkan ke teks utama.
