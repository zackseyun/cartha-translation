  verdict: revise
  source_fidelity: Draf pada umumnya setia pada struktur hukum dan konteks pertanahan ayat ini. Namun, “di antara suku-suku” kurang tepat untuk מִמַּטּוֹת, yang menyatakan asal, “dari suku-suku.” Kata “tetap” pada klausa tujuan tidak dinyatakan dalam bahasa Ibrani. Selain itu, “leluhur” pada teks utama mengaburkan bentuk patrilineal אֲבֹתָיו lebih daripada yang diperlukan.
  naturalness: Bahasa draf umumnya baku dan jelas. “Dari salah satu kaum dalam suku ayahnya” lebih alami sekaligus lebih dekat dengan konstruksi “salah satu dari kaum suku ayahnya.”
  terminology: “Tanah warisan,” “suku,” dan “kaum” tepat untuk נַחֲלָה, מַטֶּה, dan מִשְׁפָּחָה. “Bani Israel” dapat dipertahankan sebagai idiom nama kolektif. “Bapa-bapanya” dipakai pada klausa akhir untuk mempertahankan istilah sumber dan kerangka patrilineal hukum ini; catatan kaki menjelaskan ungkapan tersebut.
