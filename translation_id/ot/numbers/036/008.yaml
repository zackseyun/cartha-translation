  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: id
  text: Setiap anak perempuan yang memiliki tanah warisan dari suku-suku bani Israel harus menikah dengan salah seorang dari kaum dalam suku ayahnya,[a] supaya orang-orang bani Israel masing-masing memiliki tanah warisan bapa-bapanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “harus menjadi istri bagi salah seorang dari kaum suku ayahnya.” Kata Ibrani yang diterjemahkan “kaum” menunjuk pada kelompok kekerabatan di dalam suatu suku.
    reason: Menjelaskan idiom perkawinan dan struktur sosial kaum di dalam suku.
  - marker: b
    text: Kata Ibrani yang diterjemahkan “memiliki” juga dapat berarti “mewarisi.” Secara harfiah, bagian akhir berbunyi, “supaya bani Israel masing-masing memiliki warisan bapa-bapanya.”
    reason: Mempertahankan kemungkinan leksikal ירשׁ serta bentuk patrilineal teks sumber.
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: yang memiliki tanah warisan
  rationale: Partisipel יֹרֶשֶׁת menggambarkan status anak perempuan sebagai ahli waris atau pemegang warisan. Dalam konteks pembagian tanah, “memiliki tanah warisan” alami dalam bahasa Indonesia dan menghindari pengulangan janggal “mewarisi warisan”.
- source_word: נַחֲלָה
  choice: tanah warisan
  rationale: Dalam konteks hukum kesukuan ini, נַחֲלָה menunjuk pada milik pusaka berupa tanah, bukan sekadar warisan secara umum.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: di antara suku-suku bani Israel
  rationale: מַטֶּה berarti suku dalam struktur Israel. “Bani Israel” mempertahankan ungkapan perjanjian dan bentuk kebapakan dalam sumber.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: dari kaum dalam suku ayahnya
  rationale: מִשְׁפָּחָה adalah kelompok kekerabatan di bawah tingkat suku; “kaum” membedakannya dari מַטֶּה, “suku”.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: harus menikah dengan seorang laki-laki
  rationale: Idiom harfiahnya “menjadi istri bagi seseorang.” Bentuk ini menyampaikan kewajiban hukum secara jelas dan alami; “seorang laki-laki” menjelaskan rujukan maskulin לְאֶחָד yang tersirat.
- source_word: יִירְשׁוּ ... אִישׁ
  choice: setiap orang ... tetap memiliki
  rationale: ירשׁ dapat berarti mewarisi atau memiliki. Tujuan hukum ini adalah mempertahankan penguasaan atas tanah pusaka; אִישׁ bersifat distributif, sehingga diterjemahkan “setiap orang”.
- source_word: נַחֲלַת אֲבֹתָיו
  choice: tanah warisan leluhurnya
  rationale: אֲבֹתָיו secara harfiah “bapa-bapanya,” tetapi dalam bahasa Indonesia “leluhurnya” menyampaikan garis keturunan terdahulu secara wajar. Catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Bahasa hukum warisan yang bersifat patrilineal
  choice: Mempertahankan “bani Israel” dan “suku ayahnya,” serta mencatat bentuk harfiah “bapa-bapaknya.”
  alternative: Mengganti seluruhnya dengan ungkapan netral seperti “orang Israel” dan “warisan nenek moyang.”
  rationale: Ayat ini mengatur tanah warisan melalui struktur suku dan garis ayah. Unsur patrilinealnya perlu tetap terlihat tanpa membuat bahasa Indonesia menjadi kaku.
- issue: Nuansa ירשׁ sebagai mewarisi atau memiliki
  choice: “memiliki” dalam teks utama
  alternative: “mewarisi”
  rationale: Dalam konteks ini, hasil yang dituju ialah tiap orang mempertahankan kepemilikan tanah leluhurnya. Pilihan “memiliki” menjaga nuansa status hukum, sementara alternatif leksikal dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum secara wajar. “Tanah warisan” memperjelas konteks pertanahan; “kaum” dipakai untuk membedakan unit kekerabatan dari “suku.” Semua penanda catatan kaki hadir dalam teks utama.
