revisions:
- from: Jika mereka menjadi istri dari salah seorang anggota suku-suku bani Israel, maka warisan mereka akan dikurangi dari warisan nenek moyang kami dan ditambahkan kepada warisan suku tempat mereka kemudian menjadi anggota. Dengan demikian, bagian yang ditetapkan bagi warisan kami akan berkurang.[a]
  to: Jika mereka menjadi istri salah seorang laki-laki dari suku-suku Israel, warisan mereka akan diambil dari warisan nenek moyang kami dan ditambahkan kepada warisan suku yang mereka masuki. Dengan demikian, sebagian dari bagian warisan kami yang diperoleh melalui undi akan diambil.[a]
  rationale: 'Revisi memperbaiki idiom dan sintaksis Indonesia, memperjelas rujukan afiliasi kesukuan setelah perkawinan, serta memulihkan hubungan gramatikal terakhir: pengambilan terjadi dari bagian warisan mereka yang diperoleh melalui undi. Istilah kunci "warisan," "suku," dan "undi" tetap selaras dengan teks Ibrani dan tidak menambahkan penafsiran denominasi.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:08:57Z'
review_pass:
  verdict: revise
  source_fidelity: Draf ini pada umumnya menyampaikan skenario bersyarat, perpindahan warisan antarsuku, dan acuan kepada bagian yang ditentukan melalui undi. Namun, frasa "istri dari" tidak idiomatis dalam konstruksi ini, "anggota suku-suku" kurang tepat secara gramatikal, dan kalimat terakhir mengaburkan konstruksi Ibrani "dari undi/bagian warisan kami akan diambil."
  naturalness: 'Bahasa draf formal dan cukup jelas, tetapi beberapa ungkapan terasa kaku: "menjadi istri dari," "suku tempat mereka kemudian menjadi anggota," dan "bagian yang ditetapkan bagi warisan kami." Revisi memakai susunan yang lebih alami tanpa mengurangi ketelitian hukum-warisan dalam ayat ini.'
  terminology: '"Warisan" tepat untuk נַחֲלָה dan sebaiknya tetap diulang. "Suku" tepat untuk מַטֶּה. "Bagian warisan yang diperoleh melalui undi" dengan jelas mengungkapkan גּוֹרָל dalam konteks pembagian tanah, sementara catatan kaki mempertahankan padanan harfiahnya, "undi."'
  issues:
  - severity: medium
    issue: Konstruksi "menjadi istri dari salah seorang" dan "anggota suku-suku bani Israel" kurang alami/kurang rapi.
    rationale: לְנָשִׁים lazim diterjemahkan "menjadi istri" atau "menjadi istri bagi," sedangkan מִבְּנֵי שִׁבְטֵי בְנֵי־יִשְׂרָאֵל menunjuk laki-laki dari suku-suku Israel. "Salah seorang laki-laki dari suku-suku Israel" jelas dan modern.
  - severity: medium
    issue: Klausa "suku tempat mereka kemudian menjadi anggota" terlalu berputar-putar dan "tempat" tidak cocok untuk suku.
    rationale: Klausa אֲשֶׁר תִּהְיֶינָה לָהֶם menunjuk suku yang mereka masuki melalui perkawinan. "Suku yang mereka masuki" menyampaikan afiliasi itu tanpa mengubahnya menjadi kepemilikan pribadi.
  - severity: medium
    issue: '"Bagian yang ditetapkan bagi warisan kami" tidak mencerminkan dengan jelas bahwa pengurangan terjadi dari bagian warisan mereka yang diperoleh melalui undi.'
    rationale: וּמִגֹּרַל נַחֲלָתֵנוּ יִגָּרֵעַ secara langsung menyatakan bahwa sesuatu akan diambil/dikurangi dari "undi/bagian warisan kami." Revisi mempertahankan hubungan "dari" tersebut.
  revised_text: Jika mereka menjadi istri salah seorang laki-laki dari suku-suku Israel, warisan mereka akan diambil dari warisan nenek moyang kami dan ditambahkan kepada warisan suku yang mereka masuki. Dengan demikian, sebagian dari bagian warisan kami yang diperoleh melalui undi akan diambil.[a]
  revised_footnotes:
