  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: id
  text: Jika mereka menjadi istri salah seorang laki-laki dari suku-suku Israel, warisan mereka akan diambil dari warisan nenek moyang kami dan ditambahkan kepada warisan suku yang mereka masuki. Dengan demikian, sebagian dari bagian warisan kami yang diperoleh melalui undi akan diambil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari undi warisan kami akan diambil.” “Undi” di sini menunjuk bagian tanah warisan yang ditentukan melalui undian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: Jika mereka menjadi istri
  rationale: Bentuk Ibrani secara harfiah diawali dengan 'dan mereka menjadi istri', tetapi dalam rangkaian argumen ayat ini menyatakan keadaan bersyarat; 'jika' membuat hubungan itu wajar dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: dari salah seorang anggota suku-suku bani Israel
  rationale: '''Salah seorang anggota'' menyampaikan ungkapan harfiah ''salah seorang dari anak-anak suku-suku'' secara alami, sedangkan ''bani Israel'' mempertahankan sebutan genealogis sumber.'
- source_word: וְנִגְרְעָה נַחֲלָתָן
  choice: warisan mereka akan dikurangi
  rationale: Nifal גרע menyatakan berkurangnya bagian warisan asal akibat perpindahan hak milik; bentuk pasif dipertahankan.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: dari warisan nenek moyang kami
  rationale: '''Nenek moyang'' merupakan padanan Indonesia yang alami untuk אבות dalam konteks warisan leluhur dan tidak mengaburkan kesinambungan keluarga serta suku.'
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: dan ditambahkan kepada warisan suku
  rationale: Mempertahankan kesejajaran pasif dan gagasan hukum tentang perpindahan warisan kepada suku lain.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: tempat mereka kemudian menjadi anggota
  rationale: Klausa Ibrani secara harfiah sulit ('yang kepadanya mereka akan menjadi milik'); pilihan ini menyampaikan afiliasi kesukuan yang timbul melalui perkawinan tanpa menyatakan bahwa para perempuan menjadi milik pribadi suami.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ יִגָּרֵעַ
  choice: bagian yang ditetapkan bagi warisan kami akan berkurang
  rationale: גורל secara harfiah berarti 'undi', tetapi secara metonimis menunjuk bagian tanah yang ditentukan melalui undian; terjemahan utama mengutamakan hasil pembagian, sementara arti harfiahnya dicatat.
