  to: Kemudian para kepala kelompok keluarga[a] dari kaum keturunan Gilead, anak Makhir, anak Manasye, yang berasal dari kaum-kaum keturunan Yusuf, datang menghadap dan berbicara di hadapan Musa dan di hadapan para pemimpin, yaitu para kepala kelompok keluarga bani Israel.[b]
