  terminology: '"Musa," "Makhir," "Manasye," dan "Yusuf" sudah tepat. "Bani Israel" layak dipertahankan sebagai sebutan formal. Istilah "kelompok keluarga" dipakai untuk membedakan rumah/kelompok leluhur (אָבוֹת) dari "kaum-kaum" (מִשְׁפְּחֹת).'
