  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: id
  text: Kemudian para kepala kelompok keluarga[a] dari kaum keturunan Gilead, anak Makhir, anak Manasye, yang berasal dari kaum-kaum keturunan Yusuf, datang menghadap dan berbicara di hadapan Musa dan di hadapan para pemimpin, yaitu para kepala kelompok keluarga bani Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala-kepala para bapa.” Ungkapan ini menunjuk para pemimpin rumah atau kelompok kekerabatan dalam susunan suku Israel; dapat juga diterjemahkan “kepala kaum.”
    reason: lexical_alternative
  - marker: b
    text: “Bani Israel” adalah ungkapan Ibrani formal; dapat juga diterjemahkan “orang Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: datang menghadap
  rationale: Dalam konteks penyampaian perkara secara resmi, ungkapan ini menyatakan pendekatan kepada pihak berwenang; “datang menghadap” alami dalam bahasa Indonesia dan mempertahankan nuansa formal.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum
  rationale: Secara harfiah berarti “kepala-kepala para leluhur/bapa” dan menunjuk para pemimpin unit kekerabatan dalam susunan suku Israel. “Kepala kaum” lebih wajar daripada terjemahan harfiah yang kabur.
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: dari kaum keturunan Gilead
  rationale: Prefiks ל menandai hubungan atau keanggotaan. בְּנֵי dalam silsilah dapat menyatakan keturunan, bukan hanya anak langsung.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: anak Makhir, anak Manasye
  rationale: Pengulangan “anak” dipertahankan agar rantai silsilah Ibrani tetap terlihat.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: yang termasuk dalam kaum-kaum keturunan Yusuf
  rationale: מִן menunjukkan asal atau keanggotaan dalam kelompok kekerabatan yang lebih besar. Bentuk jamak מִשְׁפְּחֹת dipertahankan sebagai “kaum-kaum”.
- source_word: וַיְדַבְּרוּ לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂיאִם
  choice: berbicara di hadapan Musa serta para pemimpin
  rationale: לִפְנֵי menandai kehadiran di hadapan pihak berwenang, sedangkan נְשִׂיאִים menunjuk para pemimpin atau kepala suku.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: para kepala kaum bani Israel
  rationale: Frasa aposisional ini menjelaskan identitas para pemimpin. “Bani Israel” mempertahankan ungkapan genealogis formal בְּנֵי יִשְׂרָאֵל.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada resmi. Istilah “kaum” dipakai untuk unit kekerabatan, sedangkan “bani Israel” mempertahankan bentuk genealogis tradisional yang masih mudah dipahami. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan dua ungkapan dalam keseluruhan kalimat.
