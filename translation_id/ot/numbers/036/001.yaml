  verdict: revise
  source_fidelity: 'Terjemahan menangkap alur dan hubungan silsilah dengan baik: para pemimpin dari garis Gilead—melalui Makhir dan Manasye—datang secara resmi kepada Musa dan para pemimpin. Namun, "kepala kaum" kurang membedakan רָאשֵׁי הָאָבוֹת (kepala unit keluarga/rumah leluhur) dari מִשְׁפָּחָה (kaum/klan), dan pengulangan "kaum dari kaum" mengaburkan struktur tersebut.'
