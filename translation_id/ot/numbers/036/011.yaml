  source_fidelity: 'Makna pokoknya tepat: kelima putri Zelafehad menikah dengan putra-putra paman mereka. Namun, konstruksi “istri anak-anak lelaki dari paman-paman mereka” kurang jelas dalam bahasa Indonesia; “dari” dapat terdengar seolah-olah hanya menyatakan asal-usul, bukan hubungan kepunyaan/kekerabatan yang dimaksud teks Ibrani.'
  naturalness: Nama-nama dan registernya sesuai. “Menjadi istri bagi anak-anak laki-laki paman mereka” lebih alami dan secara sintaktis lebih tegas daripada “menjadi istri anak-anak lelaki dari paman-paman mereka.” “Putri-putri” juga merupakan padanan yang lebih ringkas dan wajar untuk בְּנוֹת dalam konteks silsilah.
  terminology: “Paman mereka” mempertahankan keluasan istilah דֹדֵיהֶן dalam teks utama, sedangkan catatan kaki dengan tepat menjelaskan pembacaan yang lebih spesifik, yaitu saudara-saudara laki-laki ayah mereka. Catatan sebaiknya ditambatkan langsung pada “paman mereka,” bukan pada akhir seluruh kalimat.
