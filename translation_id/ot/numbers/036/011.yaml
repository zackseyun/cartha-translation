base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: id
  text: Mahla, Tirza, Hogla, Milka, dan Noa, putri-putri Zelafehad, menjadi istri bagi anak-anak laki-laki paman mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “anak-anak laki-laki saudara-saudara ayah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: menjadi
  rationale: Bentuk ini menyatakan masuknya mereka ke dalam keadaan sebagai istri; “menjadi” mengungkapkan peralihan itu secara alami dalam bahasa Indonesia.
- source_word: בְּנוֹת
  choice: anak-anak perempuan
  rationale: Padanan baku dalam konteks silsilah dan keluarga, yang secara khusus menyatakan bahwa mereka adalah putri-putri Zelafehad.
- source_word: צְלָפְחָד
  choice: Zelafehad
  rationale: Nama diri ditransliterasikan dengan bentuk yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לִבְנֵי
  choice: anak-anak lelaki dari
  rationale: Dalam konteks perkawinan, frasa ini menunjuk kepada para lelaki yang mereka nikahi; susunan ini juga menghubungkannya secara jelas dengan “paman-paman mereka”.
- source_word: דֹדֵיהֶן
  choice: paman-paman mereka
  rationale: דּוֹד dalam konteks kekerabatan ini menunjuk kepada paman, khususnya saudara laki-laki ayah; bentuk jamak Ibrani dipertahankan.
- source_word: לְנָשִׁים
  choice: menjadi istri
  rationale: Ungkapan perkawinan ini secara idiomatis berarti menjadi istri; bentuk Indonesia ini alami dan mempertahankan makna maritalnya.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Mahla, Tirza, Hogla, Milka, dan Noa
  rationale: Nama-nama diri ditransliterasikan memakai bentuk yang lazim dalam Alkitab bahasa Indonesia, dan urutannya mengikuti teks Ibrani.
