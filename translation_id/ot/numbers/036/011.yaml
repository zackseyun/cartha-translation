  - severity: low
    issue: Letak penanda catatan kaki tidak melekat pada istilah yang dijelaskan.
    rationale: Catatan kaki menjelaskan “paman mereka”; penanda sebaiknya ditempatkan segera sesudah frasa tersebut.
