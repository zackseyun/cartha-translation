translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk jamak “paman-paman” dipertahankan untuk mencerminkan דֹדֵיהֶן, sedangkan catatan kaki menjelaskan secara eksplisit bahwa yang dimaksud ialah saudara-saudara laki-laki ayah mereka.
