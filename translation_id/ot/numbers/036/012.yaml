  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: id
  text: Mereka menjadi istri bagi laki-laki dari antara kaum-kaum keturunan Manasye, anak Yusuf[a], dan milik pusaka mereka tetap pada suku dari kaum ayah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka menjadi istri bagi laki-laki dari antara keluarga-keluarga keturunan Manasye, anak Yusuf.” Kata Ibrani yang diterjemahkan “kaum-kaum” juga dapat diterjemahkan “keluarga-keluarga” menurut tingkat kekhususan kelompok kekerabatan yang dimaksud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: dari antara kaum-kaum
  rationale: 'Preposisi מִן paling wajar menyatakan asal atau lingkungan pemilihan pasangan: para perempuan itu menikah dengan laki-laki yang berasal dari kaum-kaum Manasye. Ungkapan ''dari antara'' mencegah kesan bahwa mereka sendiri berpindah keluar dari kelompok tersebut.'
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: keturunan Manasye, anak Yusuf
  rationale: '''Keturunan'' menyampaikan fungsi genealogis בְּנֵי secara alami dalam bahasa Indonesia, sedangkan ''anak Yusuf'' mempertahankan bentuk silsilah tunggal bagi Manasye.'
- source_word: הָיוּ לְנָשִׁים
  choice: menjadi istri
  rationale: Mencerminkan konstruksi predikatif harfiah 'menjadi/berada sebagai istri' dan mempertahankan para perempuan sebagai subjek.
- source_word: נַחֲלָתָן
  choice: milik pusaka mereka
  rationale: Dalam konteks hukum tanah Bilangan, נַחֲלָה menunjuk kepada tanah warisan turun-temurun; 'milik pusaka' menyatakan baik unsur harta maupun pewarisan.
- source_word: וַתְּהִי
  choice: sehingga ... tetap berada
  rationale: Bentuk dasarnya berarti 'dan menjadi/berada', tetapi konteks menekankan hasil perkawinan tersebut, yakni pusaka itu tidak beralih suku. 'Sehingga ... tetap berada' mengungkapkan hubungan hasil tanpa mengubah pokok legalnya.
- source_word: עַל מַטֵּה
  choice: berada pada suku
  rationale: מַטֶּה berarti 'suku' di sini. Preposisi עַל menyatakan keterikatan atau pencatatan pusaka pada suku tersebut; 'pada' mempertahankan ungkapan itu secara ringkas.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: kaum ayah mereka
  rationale: מִשְׁפָּחָה adalah kelompok kekerabatan di dalam suku, sehingga 'kaum' lebih tepat daripada 'keluarga' dalam struktur sosial Israel. Bentuk tunggal kolektif dipertahankan.
