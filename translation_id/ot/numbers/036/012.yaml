translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'kaum' dipakai untuk unit kekerabatan di bawah 'suku'. Kalimat mempertahankan fokus pada para perempuan dan keberlanjutan kepemilikan pusaka dalam suku ayah mereka.
