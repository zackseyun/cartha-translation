  verdict: revise
  source_fidelity: Draf dengan tepat menangkap bahwa para perempuan itu menikah dari dalam kelompok-kelompok kekerabatan Manasye dan bahwa pusaka mereka tidak beralih dari kelompok suku ayah mereka. Namun, konstruksi "menjadi istri dari antara" tidak menyatakan dengan jelas hubungan predikatif Ibrani הָיוּ לְנָשִׁים; dalam bahasa Indonesia, penerima status istri perlu dinyatakan sebagai laki-laki yang berasal dari kaum-kaum tersebut. Kata sambung "sehingga" juga menambahkan hubungan akibat yang lebih kuat daripada waw Ibrani.
  naturalness: '"Kaum-kaum" dapat dipakai untuk membedakan unit kekerabatan dari "suku", tetapi frasa "menjadi istri dari antara kaum-kaum" tidak idiomatis. "Menjadi istri bagi laki-laki dari antara kaum-kaum" adalah baku, jelas, dan tetap cukup dekat dengan bentuk sumber.'
  terminology: '"Manasye, anak Yusuf", "milik pusaka", "suku", dan "kaum" cocok untuk silsilah serta tata pembagian tanah dalam konteks ini. "Kaum" dipertahankan untuk מִשְׁפָּחָה, sementara "suku" menerjemahkan מַטֶּה. Frasa "suku dari kaum ayah mereka" mempertahankan kedua tingkat struktur yang disebutkan teks Ibrani.'
