  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: id
  text: Sama seperti Yahweh telah memerintahkan Musa, demikianlah anak-anak perempuan Zelafehad bertindak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Sama seperti ... demikianlah
  rationale: Pasangan ungkapan ini menyatakan kesesuaian langsung antara perintah Yahweh dan tindakan anak-anak perempuan Zelafehad, sekaligus mempertahankan struktur korelatif bahasa Ibrani.
- source_word: צִוָּה
  choice: telah memerintahkan
  rationale: Kata kerja ini berarti memberi perintah. Kata 'telah' secara wajar menunjukkan bahwa perintah itu mendahului tindakan yang disebut sesudahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Penanda objek אֶת menandai Musa sebagai orang yang diperintah; konstruksi 'memerintahkan Musa' alami dalam bahasa Indonesia.
- source_word: עָשׂוּ
  choice: yang dilakukan
  rationale: Dalam pasangan כֵּן עָשׂוּ, ungkapan ini menyatakan bahwa mereka bertindak sesuai dengan perintah tanpa menambahkan rincian yang tidak disebutkan.
- source_word: בְּנוֹת צְלָפְחָד
  choice: anak-anak perempuan Zelafehad
  rationale: Menerjemahkan konstruksi kepunyaan secara jelas dan mempertahankan identitas para perempuan yang dimaksud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, sehingga bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Struktur 'Sama seperti ... demikianlah' mempertahankan kesejajaran teks Ibrani tanpa terdengar kaku.
