  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang biasanya dilafalkan “Yahweh”; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber serta padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk wayyiqtol dari דבר membuka peristiwa tutur baru. Dalam bahasa Indonesia Alkitabiah yang tetap alami, “berfirman” lazim dan tepat untuk perkataan langsung Allah.
- source_word: יְהוָה
  choice: TUHAN[a]
  rationale: Nama ilahi YHWH ditampilkan dengan padanan konvensional bahasa Indonesia “TUHAN”, disertai catatan yang menerangkan bentuk Ibraninya agar identitasnya sebagai nama ilahi tetap transparan.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan perkataan; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam rumus וידבר ... לאמר, infinitif ini mengantar isi perkataan berikutnya. Bahasa Indonesia secara alami cukup memakai “berfirman kepada”; tanda koma menunjukkan bahwa firman tersebut akan dilanjutkan pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: TUHAN[a]
  alternative: Yahweh
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “TUHAN” merupakan padanan konvensional yang bermartabat dan mudah dipahami pembaca Indonesia, sedangkan catatan kaki mempertahankan transparansi bahwa bentuk sumbernya ialah YHWH dan menyebut kemungkinan pelafalan “Yahweh” tanpa menyatakan kepastian yang tidak diberikan oleh teks konsonantal.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumus ujaran Ibrani dialihkan secara alami; koma dipertahankan karena isi firman berlanjut pada ayat berikutnya.
