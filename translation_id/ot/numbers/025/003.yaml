source:
  edition: WLC
  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: id
  text: Maka Israel mengikatkan diri kepada Baal dari Peor[a], dan murka Yahweh menyala terhadap Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Baal-Peor”; atau, “memasangkan diri kepada Baal dari Peor.”
    reason: Menunjukkan alternatif bagi bentuk nama לְבַעַל פְּעוֹר dan nuansa harfiah verba צמד, yaitu dipasangkan atau disatukan seperti dalam satu kuk.
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: mengikatkan diri
  rationale: Bentuk Nifal dari צמד menyatakan keterikatan atau pertautan yang erat. “Mengikatkan diri” mempertahankan nuansa refleksif dan menggambarkan keterikatan Israel kepada ilah itu tanpa menjelaskan secara berlebihan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk baku nama bangsa tersebut dalam bahasa Indonesia.
- source_word: לְבַעַל פְּעוֹר
  choice: kepada Baal dari Peor
  rationale: בעל menunjuk kepada Baal, sedangkan פעור mengaitkannya dengan tempat atau manifestasi lokal di Peor. Bentuk ini mempertahankan hubungan konstruksi Ibrani; “Baal-Peor” tetap dicatat sebagai alternatif.
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Ungkapan Ibrani secara harfiah menggambarkan amarah sebagai panas atau api yang menyala. Ungkapan “murka ... menyala” mempertahankan metafora itu dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dalam ungkapan חרה אף, preposisi ב menandai sasaran murka. “Terhadap Israel” merupakan padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi itu tanpa menggantinya dengan gelar.
- issue: Sifat keterikatan Israel kepada Baal
  choice: mengikatkan diri
  alternative: berpaut atau memasangkan diri
  rationale: Terjemahan ini mempertahankan gambaran keterikatan erat dalam verba צמד dan kemungkinan nuansa kesetiaan religius, tanpa secara eksplisit menambahkan gagasan perjanjian yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora Ibrani tentang murka yang menyala dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
