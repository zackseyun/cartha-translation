  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: id
  text: 'Perjanjian itu akan menjadi miliknya dan milik keturunannya sesudah dia: suatu perjanjian keimaman yang berlaku selama-lamanya[a], karena ia bersemangat membela Allahnya[b] dan mengadakan pendamaian bagi bani Israel[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perjanjian keimaman yang kekal.”
    reason: alternative_reading
  - marker: b
    text: Atau, “cemburu demi Allahnya.” Kata kerja Ibrani dapat menyatakan kecemburuan perjanjian ataupun semangat yang berkobar.
    reason: lexical_alternative
  - marker: c
    text: “Bani Israel” adalah sebutan kebangsaan tradisional dalam bahasa Ibrani dan merujuk kepada umat Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Itu akan menjadi
  rationale: Bentuk feminin tunggal menunjuk pada pemberian perjanjian yang disebut sesudahnya; penghubung waw diserap agar kalimat Indonesia tetap alami.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: bagi dia dan bagi keturunannya sesudah dia
  rationale: Keturunannya menyampaikan makna kolektif זֶרַע secara wajar, sedangkan sesudah dia mempertahankan gagasan kesinambungan generasi.
- source_word: בְּרִית כְּהֻנַּת עוֹלָם
  choice: suatu perjanjian tentang keimaman untuk selama-lamanya
  rationale: Perjanjian adalah padanan baku בְּרִית. Frasa tentang keimaman menyatakan isi pemberian itu, dan untuk selama-lamanya mempertahankan sifat berkelanjutan עוֹלָם tanpa memaksakan rumusan metafisis.
- source_word: תַּחַת אֲשֶׁר
  choice: karena
  rationale: Dalam konteks ini frasa tersebut menyatakan dasar pemberian perjanjian.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: giat membela Allahnya
  rationale: Pilihan ini mengungkapkan semangat yang lahir dari kecemburuan perjanjian dan diarahkan untuk membela kehormatan Allah; kemungkinan terjemahan lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיְכַפֵּר
  choice: mengadakan pendamaian
  rationale: Padanan ini mudah dipahami dan mempertahankan arti kultis כפר, yakni tindakan yang memulihkan hubungan dengan Allah.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: bagi bani Israel
  rationale: Bani Israel merupakan ungkapan Indonesia yang lazim untuk sebutan kebangsaan Ibrani 'anak-anak lelaki Israel' dan merujuk kepada umat Israel secara keseluruhan.
theological_decisions:
- issue: Makna קנא dalam tindakan Pinehas
  choice: giat membela Allahnya
  alternative: cemburu demi Allahnya
  rationale: Kata Ibrani mencakup semangat dan kecemburuan yang berkaitan dengan kesetiaan perjanjian. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan nuansa kecemburuan.
- issue: Daya makna עוֹלָם dalam janji keimaman
  choice: keimaman untuk selama-lamanya
  alternative: keimaman yang kekal
  rationale: Pilihan utama menyatakan kesinambungan kelembagaan yang berlangsung terus tanpa mengharuskan pembacaan filosofis tertentu tentang kekekalan.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Ungkapan tradisional dipertahankan, tetapi catatan menjelaskan bahwa sebutan kebangsaan ini merujuk kepada umat Israel, bukan hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sumber dipertahankan sejauh tetap alami; istilah teologis dibuat mudah dipahami tanpa menghapus ambiguitas leksikal.
