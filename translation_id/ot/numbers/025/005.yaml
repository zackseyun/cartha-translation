base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: id
  text: Lalu Musa berkata kepada para hakim Israel, “Kamu masing-masing harus membunuh orang-orang di bawah wewenangmu[b] yang telah mengikatkan diri kepada Baal-Peor.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Baal dari Peor.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, teks Ibrani berbunyi “bunuhlah, masing-masing orang, orang-orangnya,” yang berarti setiap hakim harus membunuh orang-orang di bawah wewenangnya yang telah mengikatkan diri kepada Baal-Peor.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: para hakim
  rationale: Kata ini menunjuk kepada orang-orang yang menjalankan wewenang hukum dan pemerintahan di Israel; ‘para hakim’ merupakan padanan langsung dan sesuai konteks.
- source_word: הִרְגוּ
  choice: harus membunuh
  rationale: Bentuk imperatif jamak menyampaikan perintah tegas Musa. ‘Harus membunuh’ mengungkapkan daya perintah itu tanpa menambahkan nuansa yuridis yang tidak dinyatakan langsung oleh verba Ibrani.
- source_word: אִישׁ אֲנָשָׁיו
  choice: Kamu masing-masing ... orang-orang di bawah wewenangmu
  rationale: Konstruksi distributif ini mengarahkan setiap hakim untuk membunuh orang-orang yang menjadi tanggung jawab atau berada di bawah kewenangannya. Susunan ini alami dalam bahasa Indonesia dan tidak mengaburkan pembagian tanggung jawab tersebut.
- source_word: הַנִּצְמָדִים
  choice: yang telah mengikatkan diri
  rationale: Partisipel Nifal dari צמד menyatakan keterikatan atau pelekatan yang erat. ‘Mengikatkan diri’ mempertahankan unsur keterlibatan sukarela tanpa menentukan lebih jauh sifat hubungan itu.
- source_word: לְבַעַל פְּעוֹר
  choice: kepada Baal-Peor
  rationale: Frasa ini menyebut dewa yang berkaitan dengan Peor. Bentuk ‘Baal-Peor’ ringkas, dikenal dalam bahasa Indonesia, dan tetap membuka kemungkinan pemahaman ‘Baal dari Peor’ melalui catatan kaki.
theological_decisions:
- issue: Sifat pembunuhan yang diperintahkan
  choice: Menerjemahkan secara langsung bahwa Musa memerintahkan para hakim Israel membunuh para pelanggar yang berada di bawah wewenang mereka.
  alternative: Memakai ‘menghukum mati’ untuk menonjolkan pelaksanaan putusan hukum, atau menambahkan penjelasan mengenai penghukuman perjanjian.
  rationale: Ayat ini menyampaikan perintah langsung dalam konteks kemurtadan, tetapi tidak menjelaskan prosedur hukum atau ritualnya. Terjemahan mempertahankan kerasnya perintah tanpa memasukkan kerangka teologis atau yuridis tambahan.
- issue: Rujukan maskulin dalam אִישׁ אֲנָשָׁיו
  choice: Memakai ‘orang-orang di bawah wewenangmu’ dalam sapaan kepada para hakim, dengan konteks yang tetap merujuk kepada para pelanggar laki-laki.
  alternative: Memakai bentuk harfiah ‘setiap orang, orang-orangnya’ atau bentuk lebih umum ‘mereka yang berada di bawahmu’.
  rationale: Bahasa Indonesia tidak memiliki pronomina posesif bergender. Rumusan yang dipilih mempertahankan sasaran konkret dan hubungan kewenangan dalam konstruksi Ibrani tanpa menghasilkan ungkapan yang janggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. ‘Kamu masing-masing’ memperjelas bahwa perintah jamak itu dibagikan kepada setiap hakim, sedangkan ‘orang-orang di bawah wewenangmu’ menyampaikan maksud konstruksi distributif Ibrani secara alami.
