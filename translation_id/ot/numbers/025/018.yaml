id: NUM.25.18
reference: Numbers 25:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: id
  text: Sebab mereka memusuhi kalian melalui siasat licik yang mereka gunakan untuk memperdaya kalian dalam perkara Peor[a] dan dalam perkara Kozbi, anak perempuan seorang pemimpin Midian, saudari mereka[b], yang dibunuh pada hari wabah itu karena perkara Peor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peor mengacu pada peristiwa Baal-Peor yang diceritakan sebelumnya dalam pasal ini.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “saudari mereka”; ungkapan ini mungkin berarti seorang perempuan dari kaum atau kelompok kerabat mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: terus memusuhi
  rationale: Bentuk partisip Ibrani menyatakan permusuhan yang sedang berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi permusuhan militer saja.
- source_word: בְּנִכְלֵיהֶם
  choice: melalui siasat licik
  rationale: Kata benda ini menunjuk pada cara-cara yang penuh kelicikan atau tipu daya, sedangkan preposisinya menyatakan sarana. 'Melalui siasat licik' menyampaikan keduanya dengan jelas.
- source_word: נִכְּלוּ
  choice: yang mereka gunakan untuk memperdaya
  rationale: Kata kerja ini serumpun dengan kata 'siasat' sebelumnya dan menggambarkan tindakan penuh tipu daya terhadap Israel. Susunan ini mempertahankan kaitan leksikalnya secara alami.
- source_word: עַל דְּבַר פְּעוֹר
  choice: dalam perkara Peor / karena perkara Peor
  rationale: Ungkapan Ibrani dapat berarti 'mengenai perkara' dan, menurut konteks, juga mengandung nuansa sebab. Kemunculan pertama dibuat situasional, sedangkan yang terakhir dibuat kausal.
- source_word: כָּזְבִּי
  choice: Kozbi
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan sesuai dengan bunyi sumber.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: anak perempuan seorang pemimpin Midian
  rationale: נשיא berarti pemimpin atau kepala kelompok; 'pemimpin' jelas bagi pembaca modern dan tidak memasukkan gagasan kebangsawanan yang belum tentu dimaksud.
- source_word: אֲחֹתָם
  choice: saudari mereka
  rationale: Terjemahan harfiah ini mempertahankan bahasa kekerabatan dalam teks Ibrani tanpa memutuskan apakah yang dimaksud saudari kandung atau perempuan dari kelompok kerabat mereka.
- source_word: הַמֻּכָּה
  choice: yang dibunuh
  rationale: Partisip pasif dari נכה secara harfiah berarti 'yang dipukul', tetapi dalam konteks ini pukulan itu mematikan. 'Yang dibunuh' menyampaikan hasilnya dengan bahasa Indonesia yang wajar.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: pada hari terjadinya wabah
  rationale: Terjemahan ini mempertahankan acuan waktu yang konkret sekaligus terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan nama 'Peor'
  choice: Nama 'Peor' dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki sebagai acuan kepada peristiwa Baal-Peor.
  alternative: Mengembangkan nama itu menjadi 'Baal-Peor' dalam teks utama.
  rationale: Teks Ibrani hanya menyebut 'Peor'. Mempertahankan bentuk itu menghindari penambahan interpretatif, sementara catatan kaki memberi konteks yang diperlukan.
- issue: Nuansa dua kemunculan ungkapan עַל דְּבַר פְּעוֹר
  choice: Kemunculan pertama diterjemahkan secara situasional, 'dalam perkara Peor', dan yang terakhir secara kausal, 'karena perkara Peor'.
  alternative: Menggunakan frasa Indonesia yang sama pada kedua kemunculan.
  rationale: Ungkapan Ibrani yang sama memungkinkan kedua nuansa tersebut. Perbedaan dalam terjemahan mengikuti fungsi sintaksis dan konteks setempat tanpa menghapus pengulangannya.
- issue: Makna 'saudari mereka'
  choice: Bahasa kekerabatan harfiah dipertahankan dan kemungkinan makna kelompok kerabat dijelaskan dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai 'seorang perempuan dari kaum mereka' atau 'kerabat perempuan mereka'.
  rationale: Sumber secara harfiah mengatakan 'saudari mereka'. Terjemahan utama mempertahankan ketegangan makna dan tidak menetapkan hubungan biologis ataupun kesukuan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan jamak 'kalian' dipilih untuk menyatakan bentuk orang kedua jamak Ibrani secara jelas. Pengulangan 'perkara Peor' dipertahankan karena penting bagi struktur dan penekanan ayat.
