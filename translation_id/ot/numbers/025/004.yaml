  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa[a], “Tangkaplah semua pemimpin bangsa itu dan pancangkanlah mereka bagi Yahweh di bawah sinar matahari[b], supaya murka Yahweh yang menyala-nyala surut dari Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kumpulkanlah semua pemimpin bangsa itu, lalu suruhlah mereka menghukum mati orang-orang yang bersalah bagi Yahweh di bawah sinar matahari.” Secara tata bahasa, kata “mereka” paling langsung menunjuk kepada para pemimpin, tetapi ada yang memahami para pemimpin sebagai pelaksana hukuman.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “di hadapan matahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar TUHAN.
- source_word: קַח
  choice: Tangkaplah
  rationale: Dalam konteks penghukuman, bentuk imperatif לקח menuntut agar para pemimpin diambil ke dalam penguasaan; 'tangkaplah' lebih jelas dan wajar daripada 'ambillah'.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: semua pemimpin bangsa itu
  rationale: רָאשֵׁי secara harfiah berarti 'kepala-kepala', tetapi di sini menunjuk kepada para pemimpin; ungkapan Indonesia ini jelas tanpa menimbulkan kesan bagian tubuh.
- source_word: וְהוֹקַע אֹתָם
  choice: dan pancangkanlah mereka
  rationale: Hifil dari יקע menggambarkan penghukuman mati atau pemajangan tubuh secara keras dan terbuka. 'Pancangkanlah' mempertahankan gambaran publik itu tanpa menetapkan secara berlebihan apakah caranya tepat berupa penyaliban, penggantungan, atau penusukan pada pancang.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל paling langsung menyatakan arah, peruntukan, atau dedikasi; 'bagi Yahweh' menghindari pengubahan menjadi 'di hadapan Yahweh', yang biasanya memakai konstruksi lain.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: di bawah terik matahari
  rationale: Secara harfiah 'di hadapan matahari'; ungkapan ini menunjukkan tindakan terbuka pada siang hari. Terjemahan utama tetap menampilkan citra matahari, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: וְיָשֹׁב חֲרוֹן אַף יְהוָה
  choice: supaya murka Yahweh yang menyala-nyala surut
  rationale: Susunan ini menyatakan tujuan atau hasil yang diharapkan. 'Menyala-nyala' mempertahankan unsur panas dalam idiom kemurkaan, dan 'surut' menyampaikan gerak menjauh.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi מן menandai pemisahan; frasa ini secara alami melengkapi kata 'surut'.
theological_decisions:
- issue: Rujukan kata ganti אֹתָם ('mereka')
  choice: Dalam teks utama, kata ganti itu merujuk kepada semua pemimpin bangsa.
  alternative: Para pemimpin diperintahkan untuk menghukum mati orang-orang yang bersalah, bukan mereka sendiri yang dihukum.
  rationale: Secara sintaksis, anteseden jamak terdekat ialah 'semua pemimpin bangsa itu'. Namun, ayat berikutnya memerintahkan para hakim membunuh orang-orang yang berpaut kepada Baal-Peor, sehingga ada ketegangan penafsiran yang nyata. Bacaan alternatif dipertahankan dalam catatan kaki.
- issue: Makna tindakan יקע
  choice: Diterjemahkan 'pancangkanlah' sebagai penghukuman atau pemajangan tubuh secara terbuka.
  alternative: Tusuklah mereka pada pancang; gantunglah mereka; hukum mati mereka di muka umum.
  rationale: Istilah Ibrani menunjukkan tindakan penghukuman dan pemajangan yang keras, tetapi cara persisnya tidak sepenuhnya pasti. Terjemahan tidak mempersempitnya secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bangsa itu' dipakai untuk הָעָם dalam konteks umat Israel; 'pancangkanlah' mempertahankan kekerasan serta sifat publik tindakan tanpa memaksakan metode eksekusi yang terlalu spesifik. Semua penanda catatan kaki muncul dalam teks utama.
