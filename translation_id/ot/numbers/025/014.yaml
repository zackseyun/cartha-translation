  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: id
  text: Nama orang Israel yang telah dipukul mati[a]—yang dipukul mati bersama perempuan Midian itu—ialah Zimri anak Salu, seorang pemimpin kaum keluarga[b] di antara orang Simeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “orang Israel yang dipukul, yang dipukul bersama perempuan Midian itu.” Bahasa Ibrani mengulangi kata kerja tersebut untuk memberi penekanan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “rumah ayah”, yaitu kaum keluarga yang ditarik menurut garis keturunan ayah di dalam suatu suku.'
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: Nama
  rationale: Frasa ini memperkenalkan identitas orang yang disebut dalam kisah sebelumnya. Konjungsi וְ tidak perlu diterjemahkan secara tersendiri karena hubungan wacananya sudah jelas dalam konteks.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk kepada seorang laki-laki Israel. Dalam bahasa Indonesia, 'orang Israel' sudah alami dan rujukan maskulinnya menjadi jelas dari identitas serta konteks.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: yang telah dipukul mati—yang dipukul mati
  rationale: Pengulangan bentuk kata נכה dipertahankan untuk mencerminkan penekanan dalam bahasa Ibrani. 'Dipukul mati' menyatakan tindakan kekerasan yang berakhir dengan kematian tanpa meratakan kedua bentuk menjadi satu.
- source_word: אֶת הַמִּדְיָנִית
  choice: bersama perempuan Midian itu
  rationale: 'Dalam konstruksi ini אֶת menyatakan kebersamaan: laki-laki itu dibunuh bersama perempuan Midian. Kata ''perempuan'' memperjelas bentuk feminin tunggal הַמִּדְיָנִית, dan ''itu'' sesuai dengan sifat definitnya.'
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Zimri anak Salu
  rationale: Nama diri ditransliterasikan, sedangkan בֶּן diterjemahkan secara alami sebagai 'anak' dalam rumus silsilah Indonesia.
- source_word: נְשִׂיא
  choice: seorang pemimpin
  rationale: Kata ini menunjuk orang yang berkedudukan sebagai kepala atau pemimpin; 'pemimpin' jelas dan tidak membawa nuansa kerajaan yang dapat timbul dari 'pangeran'.
- source_word: בֵית אָב
  choice: puak
  rationale: '''Puak'' menyampaikan unit kekerabatan patrilineal di bawah tingkat suku dengan ringkas dan alami; catatan kaki mempertahankan informasi budaya dari ungkapan harfiah ''rumah ayah''.'
- source_word: לַשִּׁמְעֹנִי
  choice: di antara orang Simeon
  rationale: Frasa ini menyatakan afiliasi dengan kelompok suku Simeon. 'Di antara orang Simeon' alami setelah penyebutan seorang pemimpin puak.
